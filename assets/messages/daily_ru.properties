daily.brief_0=К Крысиному королю идёт подкрепление. Победите его, прежде чем оно доберётся до двора. Пленный надзиратель поможет в бою, а в охраняемом складе найдутся припасы.
daily.brief_1=Бунт прикрывает побег Тэнгу. Победите обоих главарей побега, чтобы открыть его убежище, а затем и самого Тэнгу, пока не истекло время. Освободите заключённых, чтобы они сражались со стражей, или обыщите запертую оружейную. Вход в убежище закроется за вами.
daily.brief_2=Трое шахтёров застряли под землёй, а последний подъёмник скоро уйдёт. Откройте их укрытия, доведите всех троих живыми до подъёмника и выбирайтесь. По туннелям бродит DM-300. С ним можно сразиться или обойти его. Припасы и запертые короткие пути помогут спасти всех.
daily.brief_3=По пещерам бродят ледокоготь, гнолл-ледоспин и инеерог. Убейте всех троих и доберитесь до дальнего выхода, пока буря не отрезала путь. Порядок охоты выбираете вы. В боковых ходах есть припасы, но их поиски отнимают время.
daily.brief_4=Три места ритуала призывают демонов в чертоги. Доберитесь до каждого и запечатайте его до завершения ритуала. Каждая печать перекрывает один источник подкреплений. Выбирайте маршрут и ищите припасы в боковых залах, если понадобится.
daily.brief_5=Удержите форпост до прихода помощи. Капитан должен пережить пять волн нападающих. Защитники будут держать центр, пока вы сражаетесь, ищете припасы или открываете камеры с подмогой. Следите за подступами: поздние волны могут атаковать с нескольких сторон.
daily.brief_6=В королевской казне хранится золото города. Найдите капитана, заберите его ключ, вскройте казну и уйдите через дальние ворота, пока они не закрылись. Открытие казны поднимет тревогу. Можно сперва обыскать склады и открыть короткие пути или рискнуть и пойти на ограбление с меньшим запасом.
daily.rules=У каждого дня свои герой, снаряжение и подземелье. Перед выходом распределите очки навыков. Время считается в ходах. Выход из события завершает попытку. У ежедневных событий отдельные результаты; они не открывают значки и записи в энциклопедии.
daily.time_left=Осталось ходов: _%d_
daily.timeout_0=Подкрепление добралось до двора. Приходится отступить.\n\nМожно попробовать снова в Ежедневных испытаниях.
daily.timeout_1=Время вышло. Тэнгу сбежал во время бунта.\n\nМожно попробовать снова в Ежедневных испытаниях.
daily.timeout_2=Последний подъёмник ушёл. Всех спасти не удалось.\n\nМожно попробовать снова в Ежедневных испытаниях.
daily.timeout_3=Буря завалила выход. Охота окончена.\n\nМожно попробовать снова в Ежедневных испытаниях.
daily.timeout_4=Ритуал завершён. Демоны заполонили чертоги.\n\nМожно попробовать снова в Ежедневных испытаниях.
daily.timeout_6=Городские ворота закрылись. Стража отрезала путь к отступлению.\n\nМожно попробовать снова в Ежедневных испытаниях.
