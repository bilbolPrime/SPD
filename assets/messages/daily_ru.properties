daily.quarry_desc_0=Одна из трёх целей охоты. Когда он принимает защитную стойку, ледяной панцирь твердеет. Огонь ломает эту защиту.
daily.quarry_desc_1=Одна из трёх целей охоты. Замахивается перед сокрушительным ударом. Отойдите с отмеченных клеток.
daily.quarry_desc_2=Одна из трёх целей охоты. Несётся по прямой, а затем некоторое время восстанавливает силы. Уйдите с пути до рывка.
