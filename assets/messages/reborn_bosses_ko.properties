actors.mobs.rebornboss.opening=무방비!
actors.mobs.rebornboss.interrupted=%s의 집중이 흐트러졌다!
actors.mobs.reborngoo.desc=구에 대해서는 알려진 것이 거의 없습니다. 어쩌면 생명체가 아니라, 하수도의 물질이 뭉쳐 희미한 자아를 갖게 된 것일지도 모릅니다.
actors.mobs.reborngoo.warning=구가 부풀어 오른다. 앞에서 벗어나자!
actors.mobs.reborndm300.desc=이 기계는 수백 년 전 드워프들이 만들었습니다. 이후 드워프들은 기계 대신 골렘과 정령, 심지어 악마까지 부리기 시작했습니다. 결국 그것이 문명의 몰락을 불렀습니다. DM-300과 비슷한 기계들은 주로 건설과 채굴에 쓰였으며, 때로는 도시를 지키기도 했습니다.
actors.mobs.reborndm300.repair=DM-300이 스스로를 수리했다!
actors.mobs.reborndm300.warning=엔진이 비명을 지른다. 표시된 곳을 벗어나자!
actors.mobs.rebornking.desc=드워프의 마지막 왕은 삶과 죽음에 해박한 지식으로 유명했습니다. 왕은 신하들을 설득해 영원한 젊음을 준다는 의식에 참여시켰습니다. 결국 젊음을 얻은 것은 왕뿐이었고, 덤으로 언데드 군대까지 생겼습니다.
actors.mobs.rebornking.warning=왕이 손을 든다!
actors.mobs.rebornking.herald_fell=자리를 지켜라, 겁쟁이들아!
actors.mobs.rebornking$retainer.name_0=왕실 경비병
actors.mobs.rebornking$retainer.desc_0=찌그러진 갑옷을 입은 드워프의 시체. 죽어서도 왕을 지키고 있다.
actors.mobs.rebornking$retainer.name_1=궁정 마법사
actors.mobs.rebornking$retainer.desc_1=죽음에서 되살아난 궁정 마법사. 손에 어둠의 마력이 모여든다.
actors.mobs.rebornking$retainer.name_2=왕실 전령
actors.mobs.rebornking$retainer.desc_2=턱이 부서진 전령은 여전히 왕의 명령을 고함친다. 죽은 자들은 그 명령에 따른다.
actors.mobs.rebornking$retainer.name_3=언데드 궁수
actors.mobs.rebornking$retainer.desc_3=활과 함께 묻힌 드워프. 아직 활 쏘는 법을 잊지 않았다.
actors.mobs.rebornyog.desc=요그-제와는 혼돈의 영역에서 온 강력한 존재인 고대 신입니다. 백 년 전, 고대 드워프들은 악마 군대와의 전쟁에서 간신히 승리했지만, 신 자체를 처치하지는 못했습니다. 그들은 요그-제와가 너무 약해 다시는 일어설 수 없을 것이라고 믿고 도시 지하의 지하 감옥에 가두었습니다.
actors.mobs.rebornyog.warning=공기가 갈라진다. 깜빡이는 표시에서 벗어나자!
actors.mobs.rebornyog.inherit_rot=살은 시든다. 나는 남는다.
actors.mobs.rebornyog.inherit_fire=이제 불꽃은 내 것이다.
actors.mobs.rebornyog$rotting.desc=썩은 살덩어리로 이루어진 거대한 주먹. 손가락 사이로 악취 나는 점액이 흘러나와 아래의 돌바닥을 더럽힌다.
actors.mobs.rebornyog$rotting.warning=썩은 주먹이 뒤로 젖혀진다!
actors.mobs.rebornyog$burninghand.desc=불길에 휩싸인 거대한 주먹. 손가락을 움켜쥘 때마다 타닥거리는 소리와 함께 바닥으로 불씨가 떨어진다.
actors.mobs.rebornyog$burninghand.warning=불타는 주먹 앞에 불씨가 모인다!
actors.mobs.reborntengu.shadow_broken=내 그림자가…!
