items.scrolls.scrolloffrostlevel.name=Gulungan Embun Beku
items.scrolls.scrolloffrostlevel.desc=Hawa dingin merembes dari perkamen ini.\n\nKamu juga bisa merobeknya di mana saja untuk membekukan semua musuh di lantai ini sampai mereka terkena kerusakan. Bos dan makhluk yang kebal terhadap pembekuan tidak terpengaruh. Ini tidak memberikan kerusakan.
items.scrolls.scrolloffrostlevel.ac_tear=Robek
items.scrolls.scrolloffrostlevel.tear_confirm=Merobek gulungan ini akan melepaskan sihirnya dan membekukan semua musuh di lantai ini sampai mereka terkena kerusakan. Bos dan makhluk yang kebal terhadap pembekuan tidak terpengaruh. Ini tidak memberikan kerusakan.\n\nRobek gulungan ini?
items.scrolls.scrolloffrostlevel.wrong_place=Gulungan ini tidak bekerja di sini.
items.scrolls.scrolloffrostlevel.spent=Jalan itu sudah terbuka. Gulungan ini tidak bereaksi.
items.keys.key.ice_depth=Kunci ini milik lantai %d di Gua Es.
scenes.interlevelscene$mode.frost=Memasuki Gua Es...
levels.icecaveslevel.water_name=Air sedingin es
levels.icecaveslevel.water_desc=Lapisan es tipis pecah di bawah kaki.
levels.icecaveslevel.wall_desc=Bekas beliung tertutup urat es tebal. Para penambang meninggalkan terowongan ini saat dingin menyebar ke dalam batu.
levels.cavesbosslevel.collapsed_name=Gua runtuh
levels.cavesbosslevel.collapsed_desc=Sebuah gua yang runtuh. Tidak ada jalan melewati bebatuan yang jatuh.
actors.buffs.frostbite.name=Radang dingin
actors.buffs.frostbite.desc=Hawa dingin memperlambat gerakanmu sebesar 20%.
actors.mobs.rimebat.name=Kelelawar embun beku
actors.mobs.rimebat.desc=Kelelawar pucat ini bersarang di bawah es. Gigitannya yang dingin memperlambat gerakan sesaat, memberi mereka waktu untuk berputar dan menyerang lagi.\n\nKebal terhadap pembekuan dan sihir es.
actors.mobs.iceclaw.name=Cakar es
actors.mobs.iceclaw.desc=Pemakan bangkai bercangkang es padat. Ia bersiap sebelum bertarung, mempertebal zirahnya sesaat. Api melelehkan perlindungan tambahan itu.\n\nKebal terhadap pembekuan dan sihir es.
actors.mobs.frostback.name=Gnoll punggung beku
actors.mobs.frostback.desc=Gnoll ini bertahan dalam dingin dengan merampok siapa pun yang masuk. Saat ia mengangkat senjata, menyingkirlah: pukulan beratnya akan mendarat di tempatmu tadi berdiri.\n\nKebal terhadap pembekuan dan sihir es.
actors.mobs.shardling.name=Serpihan hidup
actors.mobs.shardling.desc=Gumpalan kristal es yang terus bergerak. Ia membidik sebelum menembakkan serpihan dalam garis lurus. Dinding menghentikan tembakannya.\n\nKebal terhadap pembekuan dan sihir es.
actors.mobs.hollowminer.name=Penambang hampa
actors.mobs.hollowminer.desc=Penambang ini tidak pernah lolos dari tambang beku. Lenteranya masih menyala meski pemiliknya sudah lama mati. Jika dibiarkan mengangkat lentera, ia memanggil makhluk di dekatnya untuk bertarung. Sebuah pukulan menghentikan isyaratnya.\n\nKebal terhadap pembekuan dan sihir es.
actors.mobs.rimehorn.name=Tanduk beku
actors.mobs.rimehorn.desc=Binatang besar dengan bulu penuh embun beku. Ia menggaruk tanah sebelum menerjang lurus. Menyingkirlah dari jalurnya selagi ia bersiap.\n\nKebal terhadap pembekuan dan sihir es.
actors.mobs.oldrime.name=Embun Tua
actors.mobs.oldrime.desc=Para penambang menemukan Embun Tua di bawah gunung, terkubur dalam es yang lebih tua daripada terowongan mereka. Beliung mereka membangunkannya. Kini ia menjaga tambang beku dan jalan di belakangnya. Saat melemah, zirahnya pecah dan membebaskan anggota tubuhnya. Waspadai ayunan berat, es yang menembus lantai, dan napas bekunya.\n\nKebal terhadap pembekuan dan sihir es.
actors.mobs.oldrime.warning=Embun Tua bersiap menghantam!
windows.wndjournal.ice_depth=Es %d
levels.icebosslevel.exit_name=Jalan gua
levels.icebosslevel.exit_desc=Sebuah lorong sempit berkelok semakin dalam ke gunung.
levels.icebosslevel.blocked_name=Jalan membeku
levels.icebosslevel.blocked_desc=Dinding es menghalangi jalan di belakang Embun Tua.
items.weapon.ice.wrong_hero=Senjata ini bukan untukmu.
items.weapon.ice.already_enchanted=Senjata ini sudah diberi sihir.
items.weapon.ice.glaciercleaver.name=Parang Gletser
items.weapon.ice.glaciercleaver.desc=Bilah lebar yang dipahat dari es Embun Tua. Serangan yang mengenai sasaran melapisinya dengan embun beku selama empat giliran. Pukulan Parang Gletser berikutnya memecahkannya dan memberi %d kerusakan tambahan. Hanya Pejuang yang dapat menggunakannya.
actors.buffs.frostcoating.name=Berselimut embun beku
actors.buffs.frostcoating.desc=Lapisan tipis embun beku menempel pada makhluk ini. Pukulan Parang Gletser akan memecahkannya.
items.weapon.ice.hoarfroststaff.name=Tongkat Embun Putih
items.weapon.ice.hoarfroststaff.desc=Dingin berkumpul di antara cabang ujung tongkat ini. Proyektilnya memberi %d-%d kerusakan sebelum bonus keterampilan dan memperlambat gerakan serta serangan selama dua giliran. Awalnya menyimpan tiga muatan dan mengisi ulang seperti tongkat sihir. Hanya Penyihir yang dapat menggunakannya.
items.weapon.ice.rimepick.name=Beliung Embun Beku
items.weapon.ice.rimepick.desc=Beliung es yang ramping ini menemukan celah zirah. Ia mengabaikan seperempat zirah sasaran, atau setengahnya jika sasaran lengah. Hanya Pencuri yang dapat menggunakannya.
items.weapon.ice.frostbow.name=Busur Embun Beku
items.weapon.ice.frostbow.desc=Anak panah dari busur ini meledak menjadi es tajam saat mengenai sasaran. Kerusakan pada sasaran bertambah %d%%, dan musuh di sebelahnya menerima seperempat kerusakan pukulan itu. Serpihannya tidak membekukan korban. Hanya Pemburu Wanita yang dapat menggunakannya.
items.weapon.ice.gravefrostscythe.name=Sabit Embun Kubur
items.weapon.ice.gravefrostscythe.desc=Embun beku menempel pada gagang sabit yang dililit tulang. Saat dipakai, kerangka dan hantu panggilanmu memberi %d kerusakan dingin tambahan setiap pukulan. Hanya Nekromancer yang dapat menggunakannya.
items.weapon.ice.frostbiterifle.name=Senapan Radang Dingin
items.weapon.ice.frostbiterifle.desc=Kamar peluru senapan ini dilapisi es yang tidak pernah mencair. Setiap tembakan yang mengenai sasaran menyebabkan radang dingin selama dua giliran, memperlambat gerakan 20%. Tembakan berikutnya memperbarui efeknya. Hanya Tentara Bayaran yang dapat menggunakannya.
library.ice_weapon_drop=Satu senjata dijatuhkan untuk setiap pahlawan, sesuai kelasnya.

actors.mobs.npcs.prospector.name=Penambang terjebak
actors.mobs.npcs.prospector.desc=Seorang penambang berjaket tambalan berlindung di dekat tangga. Lampunya hampir padam.
actors.mobs.npcs.prospector.torches=Lampuku tak akan bertahan lama. Aku meninggalkan peti perbekalan di lantai ini saat kabur. Bisa bawakan _tiga obor_ dari sana?
actors.mobs.npcs.prospector.iceclaws=Cakar es mengusirku dari lorong tambang. Bunuh _tiga cakar es di lantai ini_ agar aku bisa kembali bekerja.
actors.mobs.npcs.prospector.accept=Aku akan bantu.
actors.mobs.npcs.prospector.later=Tidak sekarang.
actors.mobs.npcs.prospector.need_torches=Aku butuh _tiga obor_. Petinya masih ada di lantai ini.
actors.mobs.npcs.prospector.claws_left=Cakar es yang masih harus dibunuh: _%d_.
actors.mobs.npcs.prospector.reward=Bagus. Mau pilih yang mana?
actors.mobs.npcs.prospector.rations=Dua jatah makanan
actors.mobs.npcs.prospector.thanks=Satu masalah beres. Terima kasih.
library.quest.prospector_torches.name=Lampu yang meredup
library.quest.prospector_torches.desc=Bawakan tiga obor untuk penambang yang terjebak. Peti di lantainya berisi cukup obor.
library.quest.prospector_iceclaws.name=Cakar es di tambang
library.quest.prospector_iceclaws.desc=Bunuh tiga cakar es di lantai penambang, lalu kembali kepadanya.
library.quest.prospector.reward=Pilih satu gulungan peningkatan atau dua jatah makanan.
items.scrolls.scrolloffrostlevel.read_confirm=Saat membaca, kamu merasa akan segera diteleportasi.
