custom.generated.entry_read_this_scroll_to_unleash_the_wrath_of_the_dun_db502abf39=Přečtěte si tento svitek a uvolněte hněv duchů jeskyně, kteří zabijí vše na aktuální úrovni. No, téměř všechno. Některá z mocnějších stvoření nemusí být ovlivněna.
custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=Zaříkávání na tomto svitku vytvoří iluzorní dvojčata čtenáře, která budou pronásledovat jeho nepřátele.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Zaříkávání na tomto svitku okamžitě odstraní ze zbraně, brnění, prstenů a nošených předmětů čtenáře veškerá zlá kouzla, která by mohla nositeli bránit v jejich odstranění.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Syrová magická síla svázaná v tomto pergamenu po uvolnění dobije všechny hůlky čtenáře na plnou kapacitu.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Svitek ukrývá tajemství zakázaného rituálu. Výměnou za blaho čtenáře svitek poškodí všechny v okolí a jeho samotného plně uzdraví.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Svitek se zdá být chladnější než okolí. Jako by to byl portál do chladnější dimenze.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Kouzlo na tomto pergamenu okamžitě přenese čtenáře na náhodné místo v úrovni podzemí. Lze ho použít k úniku z nebezpečné situace, ale smolařský čtenář se může ocitnout na ještě nebezpečnějším místě.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Tento svitek obsahuje ničivou energii, kterou lze psionicky nasměrovat a způsobit masivní poškození všem tvorům v zorném poli. Doprovodný záblesk světla dočasně oslepí všechny v oblasti působení, včetně čtenáře svitku.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Tento svitek dokáže naplnit zbraň nebo brnění náhodným očarováním, které jí udělí speciální sílu.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Tento svitek vylepší jeden předmět a zlepší jeho kvalitu. Hůlka se zvýší na síle a počtu nabití; zbraň způsobí větší poškození nebo častěji najde svůj cíl; brnění odrazí další údery; účinek prstenu na jeho nositele se zesílí. Zbraně a brnění budou také vyžadovat menší sílu k použití a veškeré kletby na předmětu budou zrušeny.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Při hlasitém přečtení se z tohoto svitku ozve náročný řev, který probudí všechny příšery a upozorní je na polohu čtenáře.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Po přečtení vás inspirativní slova připraví na boj.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=Když si je přečtete, moudrá slova vám zlepší dovednosti.

