daily.brief_0=ネズミ王の援軍が向かっている。宮廷に着く前に王を倒そう。捕らわれた看守を助ければ共に戦ってくれる。警備された倉庫には物資もある。
daily.brief_1=暴動に紛れて天狗が逃げようとしている。脱獄の首謀者を二人とも倒して隠れ家を開き、時間内に天狗を倒そう。囚人を解放すれば衛兵と戦ってくれる。鍵のかかった武器庫で物資を探してもよい。隠れ家の扉は入ると閉まる。
daily.brief_2=三人の鉱夫が地下に取り残された。最後の昇降機は間もなく出発する。避難所を開き、三人とも生きたまま昇降機へ連れ帰って脱出しよう。坑道にはDM-300がいる。戦っても、別の道を探してもよい。物資や鍵のかかった近道が救助に役立つだろう。
daily.brief_3=氷爪、霜背のノール、霜角獣が洞窟を歩き回っている。三体を仕留め、吹雪が道を塞ぐ前に奥の出口へ向かおう。狩る順番は自由だ。脇道には物資があるが、探すには時間がかかる。
daily.brief_4=三か所の祭壇から悪魔が広間に呼び出されている。儀式が終わる前にすべての祭壇を封じよう。一つ封じるたびに、その場所からの増援が止まる。進む道を選び、物資が必要なら脇の部屋を探そう。
daily.brief_5=援軍が来るまで砦を守ろう。五回の襲撃を乗り切り、隊長を生かさなければならない。守備兵は中央を守る。戦うか、近くの部屋で物資を探すか、牢を開けて仲間を増やすかは自由だ。後半の襲撃は複数の方向から来ることもある。
daily.brief_6=街の金は王の宝物庫に眠っている。隊長を探して鍵を奪い、宝物庫を開け、奥の門が閉まる前に逃げ出そう。宝物庫を開けると警報が鳴る。先に倉庫を調べて近道を開くか、少ない物資で素早く盗み出すかを選ぼう。
daily.rules=日付ごとに英雄、装備、ダンジョンが決まっている。出発前にスキルポイントを使おう。時間はターンで進み、イベントを離れると挑戦は終わる。デイリーイベントは別に成績を記録し、バッジや図鑑の解放には数えられない。
