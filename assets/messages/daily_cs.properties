daily.brief_0=Posily Krysího krále jsou na cestě. Poraz ho, než dorazí ke dvoru. Zajatý dozorce ti může pomoci v boji a hlídaný sklad ukrývá zásoby.
daily.brief_1=Vzpoura kryje Tenguův útěk. Poraz oba vůdce útěku, otevři jeho úkryt a pak poraz i Tengua, než vyprší čas. Osvoboď vězně, aby bojovali proti strážím, nebo prohledej zamčenou zbrojnici. Vstup do úkrytu se za tebou uzavře.
daily.brief_2=Tři horníci uvízli pod zemí a poslední výtah brzy odjede. Otevři jejich úkryty, odveď všechny tři živé k výtahu a vyjeď ven. DM-300 bloudí štolami. Můžeš s ním bojovat nebo se mu vyhnout. Zásoby a zamčené zkratky ti mohou pomoci zachránit všechny.
daily.brief_3=V jeskyních se potulují ledový dráp, gnoll mrazohřbet a jíniroh. Ulov všechny tři a doraz ke vzdálenému východu, než udeří bouře. Pořadí lovu je na tobě. V bočních chodbách jsou zásoby, ale jejich hledání stojí čas.
daily.brief_4=Tři rituální místa přivolávají do síní démony. Dostaň se ke každému a zapečeť ho, než se rituál dokončí. Každá pečeť zastaví jeden proud posil. Vyber si cestu a podle potřeby prohledej boční komnaty.
daily.brief_5=Udrž výspu do příchodu pomoci. Kapitán musí přežít pět vln útočníků. Obránci budou hlídat střed, zatímco ty bojuješ, hledáš zásoby nebo otevíráš cely s posilami. Sleduj přístupové cesty: pozdější vlny mohou přijít z více stran.
daily.brief_6=Královská pokladnice ukrývá zlato města. Najdi kapitána, vezmi mu klíč, vnikni do pokladnice a unikni vzdálenou branou, než se zavře. Otevření pokladnice spustí poplach. Nejdřív můžeš prohledat sklady a otevřít zkratky, nebo riskovat rychlejší loupež s menšími zásobami.
daily.rules=Každý den má svého hrdinu, výbavu a podzemí. Před odchodem rozděl body dovedností. Čas se počítá na tahy. Opuštěním události pokus končí. Denní události mají vlastní výsledky a neodemykají odznaky ani záznamy v knihovně.
