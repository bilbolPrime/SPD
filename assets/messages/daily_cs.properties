daily.timeout_0=Posily dorazily ke dvoru. Musíš ustoupit.\n\nV Denních výzvách to můžeš zkusit znovu.
daily.timeout_1=Čas vypršel. Tengu při vzpouře uprchl.\n\nV Denních výzvách to můžeš zkusit znovu.
daily.timeout_2=Poslední výtah odjel. Nepodařilo se dostat všechny ven včas.\n\nV Denních výzvách to můžeš zkusit znovu.
daily.timeout_3=Bouře zasypala východ. Lov skončil.\n\nV Denních výzvách to můžeš zkusit znovu.
daily.timeout_4=Rituál je dokončen. Síně zaplavili démoni.\n\nV Denních výzvách to můžeš zkusit znovu.
daily.timeout_6=Městské brány se zavřely. Stráže ti odřízly únikovou cestu.\n\nV Denních výzvách to můžeš zkusit znovu.
