custom.difficulty.easy=Fácil
custom.difficulty.easy.desc=- Comece com 2 rações extra.\n- Comece com 2 poções de cura.\n- Comece com 200 de ouro.\n- Comece com 2 cristais da alma.\n- Bónus ao descobrir portas e armadilhas escondidas.\n- Os monstros são fracos, causam menos 25% de dano, recebem mais 10% de dano e têm 15% menos HP.\n- Taxa de aparecimento de campeões definida para 10%.\n- Taxa de drop de campeões definida para 30%.
custom.difficulty.hard=Duro
custom.difficulty.hard.desc=- A poção de cura restaura 75% da vida máxima.\n- Os inimigos são fortes, causam 10% de dano extra, recebem menos 10% de dano e têm mais 20% de vida.\n- A taxa de surgimento de campeões foi definida para 30%.\n- A taxa de drop de campeões foi definida para 50%.
custom.difficulty.hell.desc=- A poção de cura restaura 50% da vida máxima. \n - Os inimigos são imortais, causam mais 35% de dano, recebem menos 30% de dano e têm mais 45% de vida. \n - A taxa de aparecimento de campeões foi definida para 50%. \n - O herói começa com menos 4 pontos de vida máxima. \n - O herói ganha menos 1 ponto de vida máxima ao subir de nível. \n - A taxa de obtenção de campeões foi definida para 70%.
custom.difficulty.just_kill_me=Só me mata
custom.difficulty.just_kill_me.desc=- Começa com duas poções de experiência. \n - Poção de cura cura 10% da vida máxima. \n - Os inimigos são divindades, causam mais 60% de dano, recebem menos 40% de dano e têm mais 75% de vida. \n - Taxa de emergência de campeões definida para 100%. \n - O herói começa com menos 8 pontos de vida máxima. \n - O herói ganha menos 3 pontos de vida máxima ao subir de nível. \n - Taxa de obtenção de campeões definida para 100%.
custom.difficulty.nightmare.desc=- A poção de cura restaura 25% da vida máxima. \n - Os monstros são divinos, causam mais 45% de dano, recebem menos 30% de dano e têm mais 60% de vida. \n - A taxa de aparecimento de campeões foi definida para 70%. \n - O herói começa com menos 8 pontos de vida máxima. \n - O herói ganha menos 3 pontos de vida máxima ao subir de nível. \n - A taxa de obtenção de campeões foi definida para 90%.
custom.difficulty.normal.desc=- Os mobs são standard.\n- Taxa de aparecimento de campeões definida para 20%.\n- Taxa de drop de campeões definida para 40%.
custom.difficulty.super_easy=Super fácil
custom.difficulty.super_easy.desc=- Comece com 5 rações extra.\n- Comece com 5 poções de cura.\n- Comece com 500 de ouro.\n- Comece com 3 cristais de alma.\n- Os monstros são patéticos, causam menos 50% de dano, recebem menos 50% de dano e têm menos 50% de HP.\n- A taxa de aparecimento de campeões foi definida para 10%.\n- A taxa de drop de campeões foi definida para 10%.
levels.sign.dead_end=O que está aqui a fazer?!
levels.sign.tip_02=Nem todas as portas da masmorra são visíveis à primeira vista. Se ficar preso, procure portas escondidas.
levels.sign.tip_03=Lembre-se que aumentar a sua força não é a única forma de aceder a equipamentos melhores. Pode fazer o contrário, diminuindo o requisito de força com os Pergaminhos de Melhoria.
levels.sign.tip_04=Pode gastar o seu ouro em lojas nos níveis mais profundos da masmorra. A primeira delas encontra-se no 6º nível.
levels.sign.tip_09=Um ataque surpresa tem maior probabilidade de sucesso. Por exemplo, pode emboscar o seu inimigo atrás de uma porta fechada quando sabe que ele se aproxima.
levels.sign.tip_13=Se estiver em chamas, não conseguirá apagar o fogo na água enquanto estiver a levitar.
levels.sign.tip_21=Pixel-Mart. Preços especiais para caçadores de demónios!
actors.blobs.waterofawareness.drink_message=Ao dar um gole, sente o conhecimento inundar a sua mente. Agora já sabe tudo sobre os seus artigos equipados. Além disso, reparas em todos os itens no nível e conheces todos os seus segredos.
