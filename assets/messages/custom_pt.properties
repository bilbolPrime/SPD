levels.sign.burn=Ao tentar ler a placa, esta explode em chamas esverdeadas.
levels.sign.tip_01=Não sobrevalorize a sua força, use armas e armaduras que consiga manejar.
levels.sign.tip_05=Cuidado com a gosma!
levels.sign.tip_06=Pixel-Mart - tudo o que precisa para uma aventura de sucesso!
levels.sign.tip_07=Identifique as suas poções e pergaminhos o mais rapidamente possível. Não deixe para a última hora, quando realmente precisar deles.
levels.sign.tip_08=Ter fome não dói, mas morrer de fome dói.
levels.sign.tip_10=Não deixem escapar o Tengu!
levels.sign.tip_11=Pixel-Mart. Gaste dinheiro. Viva mais.
levels.sign.tip_12=Quando for atacado por vários monstros ao mesmo tempo, tente refugiar-se atrás de uma porta.
levels.sign.tip_14=Não faz sentido possuir mais do que um Ankh ao mesmo tempo, pois irá perdê-los ao ressuscitar.
levels.sign.tip_15=PERIGO! As máquinas pesadas podem causar ferimentos, perda de membros ou morte!
levels.sign.tip_16=Pixel-Mart. Uma vida mais segura na masmorra.
levels.sign.tip_17=Ao melhorar uma arma encantada, existe a hipótese de destruir o encantamento.
levels.sign.tip_18=As armas e as armaduras deterioram-se mais rapidamente do que as varinhas e os anéis, mas existem mais formas de as reparar.
levels.sign.tip_19=A única forma de obter um Pergaminho de Extermínio é recebê-lo como um presente dos espíritos da masmorra.
levels.sign.tip_20=É proibido andar armado na presença de Sua Majestade!
