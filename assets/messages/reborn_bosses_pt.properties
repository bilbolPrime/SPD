actors.mobs.rebornboss.opening=Exposto!
actors.mobs.rebornboss.interrupted=%s perde a concentração!
actors.mobs.reborngoo.desc=Pouco se sabe sobre a Gosma. Talvez nem seja uma criatura, mas apenas um amontoado de substâncias dos esgotos que ganhou um princípio de vontade própria.
actors.mobs.reborngoo.warning=Goo está inchando. Saia do caminho!
actors.mobs.reborndm300.desc=Esta máquina foi construída pelos anões há vários séculos. Mais tarde, começaram a substituir as máquinas por golens, elementais e até demónios, o que acabou por levar a sua civilização ao declínio. O DM-300 e máquinas semelhantes eram usados na construção e nas minas, e por vezes na defesa das cidades.
actors.mobs.reborndm300.repair=DM-300 está se reparando!
actors.mobs.reborndm300.warning=O motor está rangendo. Saia das marcas no chão!
actors.mobs.rebornking.desc=O último rei dos anões conhecia bem os segredos da vida e da morte. Convenceu a sua corte a participar num ritual que lhes daria juventude eterna. No fim, só ele a conseguiu, juntamente com um exército de mortos-vivos.
actors.mobs.rebornking.warning=O Rei ergue a mão!
actors.mobs.rebornking.herald_fell=Mantenham a posição, covardes!
actors.mobs.rebornking$retainer.name_0=Guarda real
actors.mobs.rebornking$retainer.desc_0=Um anão morto com uma armadura amassada. Ainda protege seu rei.
actors.mobs.rebornking$retainer.name_1=Feiticeiro da corte
actors.mobs.rebornking$retainer.desc_1=Um mago da corte trazido de volta dos mortos. Magia negra se concentra em suas mãos.
actors.mobs.rebornking$retainer.name_2=Arauto real
actors.mobs.rebornking$retainer.desc_2=Mesmo com a mandíbula quebrada, este arauto ainda berra as ordens do Rei. Os mortos obedecem.
actors.mobs.rebornking$retainer.name_3=Arqueiro morto-vivo
actors.mobs.rebornking$retainer.desc_3=Este anão foi enterrado com seu arco. Não esqueceu como usá-lo.
actors.mobs.rebornyog.desc=Yog-Dzewa é um Deus Antigo, uma entidade poderosa dos reinos do caos. Há um século, os antigos anões mal conseguiram vencer a guerra contra o seu exército de demónios, mas foram incapazes de matar o próprio deus. Em vez disso, aprisionaram-no nos salões por baixo da sua cidade, acreditando que estava demasiado fraco para ressurgir.
actors.mobs.rebornyog.warning=O ar se rasga. Saia das marcas que piscam!
actors.mobs.rebornyog.inherit_rot=A carne definha. Eu permaneço.
actors.mobs.rebornyog.inherit_fire=Agora a chama é minha.
actors.mobs.rebornyog$rotting.desc=Um enorme punho de carne podre. Uma gosma fétida escorre entre seus dedos e mancha a pedra abaixo.
actors.mobs.rebornyog$rotting.warning=O punho podre se prepara para golpear!
actors.mobs.rebornyog$burninghand.desc=Um grande punho envolto em fogo. Seus dedos crepitam ao se fechar, derramando brasas no chão.
actors.mobs.rebornyog$burninghand.warning=Brasas se juntam diante do punho ardente!
actors.mobs.reborntengu.shadow_broken=Minha sombra…!
