items.scrolls.scrolloffrostlevel.name=寒霜卷軸
items.scrolls.scrolloffrostlevel.desc=寒氣從這張羊皮紙中滲出。\n\n你也可以在任何地方撕碎它，將本層的所有敵人凍結。受到傷害時，凍結便會解除。頭目和免疫凍結的生物不受影響。不會造成傷害。
items.scrolls.scrolloffrostlevel.ac_tear=撕碎
items.scrolls.scrolloffrostlevel.tear_confirm=撕碎這張卷軸會釋放其中的魔力，將本層的所有敵人凍結。受到傷害時，凍結便會解除。頭目和免疫凍結的生物不受影響。不會造成傷害。\n\n要撕碎卷軸嗎？
items.scrolls.scrolloffrostlevel.wrong_place=卷軸在這裡不起作用。
items.scrolls.scrolloffrostlevel.spent=通道已經開啟。卷軸毫無反應。
items.keys.key.ice_depth=這把鑰匙屬於冰窟第%d層。
scenes.interlevelscene$mode.frost=正在進入冰窟……
levels.icecaveslevel.water_name=冰水
levels.icecaveslevel.water_desc=薄冰在腳下碎裂。
levels.icecaveslevel.wall_desc=厚厚的冰脈掩蓋了鎬痕。寒冷滲入岩石後，礦工們便放棄了這些坑道。
levels.cavesbosslevel.collapsed_name=坍塌的洞穴
levels.cavesbosslevel.collapsed_desc=一處坍塌的洞穴。落石堵死了去路。
actors.buffs.frostbite.name=凍傷
actors.buffs.frostbite.desc=寒冷使你的移動速度降低20%。
actors.mobs.rimebat.name=霜蝠
actors.mobs.rimebat.desc=這些蒼白的蝙蝠棲息在冰層下。冰冷的撕咬會短暫減慢移動速度，讓牠們有時間盤旋，再次發動攻擊。\n\n免疫凍結和寒冰魔法。
actors.mobs.iceclaw.name=冰爪
actors.mobs.iceclaw.desc=披著厚實冰殼的食腐動物。牠會在戰鬥前蓄力，短暫增強護甲。火焰能融化這層額外的保護。\n\n免疫凍結和寒冰魔法。
actors.mobs.frostback.name=霜背豺狼人
actors.mobs.frostback.desc=這隻豺狼人靠搶劫闖入者熬過嚴寒。牠舉起武器時要及時躲開：重擊會落在你原先站立的位置。\n\n免疫凍結和寒冰魔法。
actors.mobs.shardling.name=冰晶靈
actors.mobs.shardling.desc=一團躁動的冰晶。它會先瞄準，再沿直線發射碎片。牆壁能擋住這輪齊射。\n\n免疫凍結和寒冰魔法。
actors.mobs.hollowminer.name=空殼礦工
actors.mobs.hollowminer.desc=這個礦工沒能逃出冰封的坑道。它早已死去，提燈卻仍在燃燒。若讓它舉起燈籠，它就會召來附近的生物參戰。擊中它能打斷信號。\n\n免疫凍結和寒冰魔法。
actors.mobs.rimehorn.name=霜角獸
actors.mobs.rimehorn.desc=皮毛裡結滿霜的沉重野獸。牠會先刨地，再沿直線衝鋒。趁牠準備時離開衝鋒路線。\n\n免疫凍結和寒冰魔法。
actors.mobs.oldrime.name=古霜
actors.mobs.oldrime.desc=礦工們在山底發現了古霜，它埋在比礦道還古老的冰層中。鎬聲將它喚醒。如今它守著冰封的礦坑和後方的通道。隨著它逐漸虛弱，冰甲會破裂，四肢也隨之掙脫束縛。當心它的重擊、破地而出的冰刺和冰冷的吐息。\n\n免疫凍結和寒冰魔法。
actors.mobs.oldrime.warning=古霜蓄勢準備重擊！
windows.wndjournal.ice_depth=冰窟 %d
levels.icebosslevel.exit_name=洞穴通道
levels.icebosslevel.exit_desc=一條狹窄的通道蜿蜒通向山體深處。
levels.icebosslevel.blocked_name=冰封通道
levels.icebosslevel.blocked_desc=一面冰牆擋住了古霜身後的通道。
items.weapon.ice.wrong_hero=這件武器不適合你。
items.weapon.ice.already_enchanted=這件武器已經附魔。
items.weapon.ice.glaciercleaver.name=冰川斬刀
items.weapon.ice.glaciercleaver.desc=從古霜的冰塊中鑿出的寬刃。命中後使目標覆蓋寒霜，持續四回合。下一次冰川斬刀的攻擊會震碎寒霜，造成%d點額外傷害。僅戰士能使用。
actors.buffs.frostcoating.name=覆霜
actors.buffs.frostcoating.desc=這隻生物身上附著一層薄霜。冰川斬刀的攻擊會將它震碎。
items.weapon.ice.hoarfroststaff.name=白霜法杖
items.weapon.ice.hoarfroststaff.desc=寒氣匯聚在法杖的尖叉之間。其魔彈在技能加成前造成%d-%d點傷害，並降低移動和攻擊速度，持續兩回合。初始擁有三次充能，充能方式與魔杖相同。僅法師能使用。
items.weapon.ice.rimepick.name=霜鎬
items.weapon.ice.rimepick.desc=這把細長的冰鎬能找到護甲間的縫隙。它會無視目標四分之一的護甲，若目標毫無防備，則無視一半。僅盜賊能使用。
items.weapon.ice.frostbow.name=寒霜弓
items.weapon.ice.frostbow.desc=這把弓射出的箭矢會在命中時爆裂成鋒利的碎冰。對目標造成的傷害提高%d%%，並對相鄰敵人造成該次傷害的四分之一。碎片不會凍結受害者。僅女獵手能使用。
items.weapon.ice.gravefrostscythe.name=墓霜鐮刀
items.weapon.ice.gravefrostscythe.desc=寒霜附著在纏著白骨的鐮柄上。裝備此武器時，你召喚的骷髏和幽靈每次命中額外造成%d點寒冷傷害。僅死靈法師能使用。
items.weapon.ice.frostbiterifle.name=凍傷步槍
items.weapon.ice.frostbiterifle.desc=槍膛內覆著永不融化的冰。每次射擊命中會造成兩回合的凍傷，使移動速度降低20%。再次命中會刷新持續時間。僅傭兵能使用。
library.ice_weapon_drop=每位英雄都會獲得一件符合其職業的掉落武器。

actors.mobs.npcs.prospector.name=受困的礦工
actors.mobs.npcs.prospector.desc=一名穿著補丁外套的礦工躲在樓梯旁。他的燈快熄了。
actors.mobs.npcs.prospector.torches=這盞燈撐不了多久了。我逃跑時把補給箱落在這一層了。能幫我從裡面取來_三支火把_嗎？
actors.mobs.npcs.prospector.iceclaws=冰爪把我趕出了礦道。幫我殺掉_這一層的三隻冰爪_，我就能回去工作了。
actors.mobs.npcs.prospector.accept=我來幫你。
actors.mobs.npcs.prospector.later=現在不行。
actors.mobs.npcs.prospector.need_torches=我需要_三支火把_。補給箱還在這一層的某個地方。
actors.mobs.npcs.prospector.claws_left=還需要殺掉的冰爪：_%d_隻。
actors.mobs.npcs.prospector.reward=做得好。你想要哪一個？
actors.mobs.npcs.prospector.rations=兩份食物配給
actors.mobs.npcs.prospector.thanks=總算少了一樁心事。謝謝你。
library.quest.prospector_torches.name=將熄的燈
library.quest.prospector_torches.desc=給受困的礦工帶去三支火把。他所在樓層的補給箱裡有足夠的火把。
library.quest.prospector_iceclaws.name=礦道裡的冰爪
library.quest.prospector_iceclaws.desc=殺掉礦工所在樓層的三隻冰爪，然後回去找他。
library.quest.prospector.reward=選擇一張升級卷軸或兩份食物配給。
items.scrolls.scrolloffrostlevel.read_confirm=閱讀時，你感覺自己即將被傳送。
