actors.mobs.rebornboss.opening=破绽！
actors.mobs.rebornboss.interrupted=%s的专注被打断了！
actors.mobs.reborngoo.desc=人们对粘咕知之甚少。它或许根本不是生物，而是下水道里的各种物质聚成一团，渐渐有了些自己的意志。
actors.mobs.reborngoo.warning=粘咕正在膨胀，快避开正面！
actors.mobs.reborndm300.desc=这台机器是矮人在几个世纪前制造的。后来，矮人开始用魔像、元素生物，甚至恶魔取代机器，最终导致了文明的衰落。DM-300及同类机器通常用于建筑和采矿，有时也用于保卫城市。
actors.mobs.reborndm300.repair=DM-300修复了自己！
actors.mobs.reborndm300.warning=引擎发出尖啸，离开地上的标记！
actors.mobs.rebornking.desc=矮人的末代国王以深谙生死之道闻名。他说服宫廷成员参加一场据说能让人永葆青春的仪式。结果只有他一人如愿，还附带得到了一支亡灵大军。
actors.mobs.rebornking.warning=国王举起了手！
actors.mobs.rebornking.herald_fell=守住阵地，懦夫！
actors.mobs.rebornking$retainer.name_0=王室卫兵
actors.mobs.rebornking$retainer.desc_0=一具身披破损盔甲的矮人尸体，死后仍在守卫他的国王。
actors.mobs.rebornking$retainer.name_1=宫廷术士
actors.mobs.rebornking$retainer.desc_1=死而复生的宫廷法师，黑暗魔法正在他手中凝聚。
actors.mobs.rebornking$retainer.name_2=王室传令官
actors.mobs.rebornking$retainer.desc_2=即使下巴已经碎裂，这名传令官仍在吼叫着传达国王的命令。亡者们依然服从。
actors.mobs.rebornking$retainer.name_3=亡灵弓手
actors.mobs.rebornking$retainer.desc_3=这个矮人下葬时带着他的弓。他还没忘记该怎么用。
actors.mobs.rebornyog.desc=尤格-泽瓦是一位古神，来自混沌领域的强大存在。一个世纪前，古老的矮人勉强战胜了它率领的恶魔大军，却未能将其杀死。于是，矮人们将它囚禁在城下的殿堂之中，认为它已虚弱到无法再次复活。
actors.mobs.rebornyog.warning=空气正在撕裂，离开闪烁的标记！
actors.mobs.rebornyog.inherit_rot=血肉凋零，我仍长存。
actors.mobs.rebornyog.inherit_fire=火焰如今归我。
actors.mobs.rebornyog$rotting.desc=一只腐肉堆成的巨大拳头。恶臭的黏液从指缝渗出，污染了下方的石面。
actors.mobs.rebornyog$rotting.warning=腐烂之拳正在蓄力！
actors.mobs.rebornyog$burninghand.desc=一只裹着烈火的巨拳。手指握紧时劈啪作响，余烬纷纷落到地上。
actors.mobs.rebornyog$burninghand.warning=余烬正在燃烧之拳前聚集！
actors.mobs.reborntengu.shadow_broken=我的影子……！
