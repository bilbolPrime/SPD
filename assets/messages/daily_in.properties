daily.brief_0=Bala bantuan Raja Tikus sedang menuju istana. Kalahkan dia sebelum mereka tiba. Sipir yang ditawan bisa membantumu bertarung, dan gudang yang dijaga menyimpan perbekalan.
daily.brief_1=Kerusuhan menutupi pelarian Tengu. Kalahkan kedua pemimpin pelarian untuk membuka persembunyiannya, lalu kalahkan Tengu sebelum waktu habis. Bebaskan tahanan agar mereka melawan penjaga, atau cari bekal di gudang senjata yang terkunci. Pintu persembunyian akan menutup setelah kamu masuk.
daily.brief_2=Tiga penambang terjebak di bawah tanah, dan lift terakhir akan segera berangkat. Buka tempat berlindung mereka, bawa ketiganya hidup-hidup ke lift, lalu keluar. DM-300 berkeliaran di lorong tambang. Kamu bisa melawannya atau mencari jalan lain. Bekal dan jalan pintas yang terkunci bisa membantu penyelamatan.
daily.brief_3=Cakar es, gnoll punggung beku, dan tanduk beku berkeliaran di gua. Buru ketiganya, lalu capai pintu keluar di seberang sebelum badai menutup jalan. Kamu bebas memilih urutan buruan. Ada bekal di lorong samping, tetapi mencarinya memakan waktu.
daily.brief_4=Tiga tempat ritual memanggil iblis ke aula. Capai dan segel semuanya sebelum ritual selesai. Setiap segel menghentikan satu sumber bala bantuan. Pilih rute dan telusuri ruangan samping jika butuh bekal.
daily.brief_5=Pertahankan pos sampai bantuan tiba. Kapten harus selamat dari lima gelombang penyerang. Para pembela akan menjaga pusat saat kamu bertarung, mencari bekal, atau membuka sel untuk mendapat bantuan. Awasi jalan masuk: gelombang berikutnya bisa menyerang dari beberapa sisi.
daily.brief_6=Emas kota tersimpan di ruang harta raja. Temukan kapten, rebut kuncinya, buka ruang harta, lalu kabur lewat gerbang di seberang sebelum ditutup. Membuka ruang harta akan memicu alarm. Kamu bisa mencari bekal dan membuka jalan pintas lebih dulu, atau merampok lebih cepat dengan bekal seadanya.
daily.rules=Setiap tanggal memiliki pahlawan, perlengkapan, dan ruang bawah tanah sendiri. Gunakan poin keterampilan sebelum berangkat. Waktu dihitung dalam giliran. Meninggalkan acara mengakhiri percobaan. Acara harian memiliki hasil terpisah dan tidak membuka lencana atau catatan di ensiklopedia.
