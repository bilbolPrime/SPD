daily.brief_0=Да Пацучынага караля ідзе падмацаванне. Перамажыце яго, пакуль яно не дабралася да двара. Палонны наглядчык дапаможа ў баі, а на ахоўным складзе ёсць прыпасы.
daily.brief_1=Бунт прыкрывае ўцёкі Тэнгу. Перамажыце абодвух завадатараў уцёкаў, каб адкрыць яго сховішча, а потым і самога Тэнгу, пакуль не скончыўся час. Вызваліце вязняў, каб яны біліся з вартай, або абшукайце замкнёную збройню. Уваход у сховішча зачыніцца за вамі.
daily.brief_2=Трое шахцёраў засталіся пад зямлёй, а апошні пад'ёмнік хутка сыдзе. Адкрыйце іх укрыцці, давядзіце ўсіх траіх жывымі да пад'ёмніка і выбірайцеся. Па тунэлях блукае DM-300. З ім можна біцца або абысці яго. Прыпасы і замкнёныя кароткія шляхі дапамогуць выратаваць усіх.
daily.brief_3=Па пячорах блукаюць ледзяны кіпцюр, гнол-ледзяная спіна і інеерог. Забіце ўсіх траіх і дабярыцеся да далёкага выхаду, пакуль бура не перакрыла шлях. Парадак палявання выбіраеце вы. У бакавых хадах ёсць прыпасы, але іх пошукі займаюць час.
daily.brief_4=Тры рытуальныя месцы клічуць дэманаў у залы. Дабярыцеся да кожнага і запячатайце яго да завяршэння рытуалу. Кожная пячатка перакрывае адну крыніцу падмацавання. Выбірайце маршрут і шукайце прыпасы ў бакавых пакоях, калі спатрэбіцца.
daily.brief_5=Утрымайце заставу да прыходу дапамогі. Капітан мусіць перажыць пяць хваляў нападнікаў. Абаронцы будуць трымаць цэнтр, пакуль вы б'яцеся, шукаеце прыпасы або адчыняеце камеры з падмогай. Сачыце за подступамі: пазнейшыя хвалі могуць нападаць з некалькіх бакоў.
daily.brief_6=У каралеўскай скарбніцы ляжыць золата горада. Знайдзіце капітана, забярыце яго ключ, адкрыйце скарбніцу і ўцякайце праз далёкую браму, пакуль яна не зачынілася. Адкрыццё скарбніцы ўзніме трывогу. Можна спачатку абшукаць склады і адкрыць кароткія шляхі або рызыкнуць і пайсці на рабаванне з меншымі запасамі.
daily.rules=Кожны дзень мае свайго героя, рыштунак і падзямелле. Перад выхадам размяркуйце ачкі навыкаў. Час лічыцца ў хадах. Выхад з падзеі завяршае спробу. Штодзённыя падзеі маюць асобныя вынікі і не адкрываюць значкоў ці запісаў у энцыклапедыі.
