daily.timeout_0=Падмацаванне дабралася да двара. Давядзецца адступіць.\n\nМожна паспрабаваць зноў у Штодзённых выпрабаваннях.
daily.timeout_1=Час скончыўся. Тэнгу ўцёк падчас бунту.\n\nМожна паспрабаваць зноў у Штодзённых выпрабаваннях.
daily.timeout_2=Апошні пад'ёмнік сышоў. Выратаваць усіх своечасова не ўдалося.\n\nМожна паспрабаваць зноў у Штодзённых выпрабаваннях.
daily.timeout_3=Бура заваліла выхад. Паляванне скончылася.\n\nМожна паспрабаваць зноў у Штодзённых выпрабаваннях.
daily.timeout_4=Рытуал завершаны. Дэманы запаланілі залы.\n\nМожна паспрабаваць зноў у Штодзённых выпрабаваннях.
daily.timeout_6=Брамы горада зачыніліся. Варта адрэзала шлях да ўцёкаў.\n\nМожна паспрабаваць зноў у Штодзённых выпрабаваннях.
