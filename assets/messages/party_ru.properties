actors.skills.raiseskeletonskill.desc=Призывает скелета, который будет сражаться на вашей стороне.
network.partysession.background=Соединение с отрядом разорвано, так как вы покинули игру.
items.corpse.name=труп
items.corpse.desc=Свежий труп. Подходит для некромантии.
items.armorkit.desc=Эти инструменты превращают любую броню в эпическую. Она сохраняет свойства и получает способность вашего класса. Ремесленные навыки не нужны.
items.bomb.desc=Небольшая бомба с чёрным порохом. Фитиль загорается при броске.
items.quest.driedrose.desc=Роза давно высохла, но сохранила все лепестки.
items.quest.phantomfish.desc=Эту маленькую полупрозрачную рыбку едва видно в воздухе. В воде она почти незаметна.
items.tomeofmastery.desc=Эта тонкая книга в потёртом кожаном переплёте будто хранит немало знаний. На чтение потребуется время.
items.weightstone.desc=Позволяет сбалансировать оружие ближнего боя, повысив его скорость или точность.
items.wands.wandofamok.desc=Фиолетовый свет приводит цель в бешенство. Она нападает на ближайших существ без разбора.
items.wands.wandofavalanche.desc=Попав в стену или другое твёрдое препятствие, разряд вызывает камнепад, который ранит и оглушает существ в области удара.
items.wands.wandofflock.desc=Призывает стадо волшебных овец, на время преграждающее путь.
items.wands.wandofpoison.desc=Отравляет цель, нанося периодический урон. Улучшения продлевают действие яда.
items.wands.wandofreach.desc=Подбирает предметы издалека и меняет вас местами с врагом. Волна активирует ловушки, приминает траву и открывает либо закрывает двери на пути.
items.wands.wandofslowness.desc=На время вдвое снижает скорость передвижения и атак цели.
items.wands.wandofteleportation.desc=Переносит существо в случайное место на текущем этаже.
items.weapon.melee.dualswords.desc=Два острых клинка для мощных ударов.
items.weapon.missiles.cupidarrow.desc=Говорят, эта стрела принадлежала Купидону. Осторожнее с выбором цели.
items.weapon.missiles.curaredart.desc=Эти дротики наносят мало урона, но могут парализовать цель и оставить её беззащитной.
items.weapon.missiles.incendiarydart.desc=Наконечник застревает в цели, а закреплённая на дротике смесь вспыхивает.
items.weapon.missiles.soulcrystal.desc=Кристалл, способный ловить души. Бросьте его в слабого или ослабленного врага, чтобы пленить его дух.
items.weapon.missiles.tamahawk.desc=Этот метательный топор не очень тяжёлый, но требует силы для умелого броска.
network.partytext.weapon_fast=Это быстрое оружие.
network.partytext.weapon_slow=Это медленное оружие.
network.partytext.weapon_accurate=Это точное оружие.
network.partytext.weapon_inaccurate=Это неточное оружие.
network.partytext.weapon_fast_and_accurate=Это быстрое и точное оружие.
network.partytext.weapon_fast_but_inaccurate=Это быстрое, но неточное оружие.
network.partytext.weapon_slow_but_accurate=Это медленное, но точное оружие.
network.partytext.weapon_slow_and_inaccurate=Это медленное и неточное оружие.
network.partytext.necroblade_bolt=С уровня 5 полностью заряженный клинок может выпустить _Тёмный снаряд_, способный разрушить сущность цели и превратить её в слугу.
network.partytext.necroblade_intro=Клинок, созданный тёмной магией. Поглощает души своих жертв и становится сильнее.
network.partytext.necroblade_energy=Накопленные души: _%s/100_
network.partytext.necroblade_damage=Души добавляют _0–%d урона_.
network.partytext.necroblade_hungry=Клинок может поглотить полный запас душ, чтобы стать сильнее.
network.partytext.necroblade_full=Клинок больше не может улучшать себя, поглощая души.
