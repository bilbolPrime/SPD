levels.rebornsiderooms.leave=Dejarlo
actors.mobs.npcs.echoreflection.name=tu reflejo
actors.mobs.npcs.echoreflection.desc=Una copia pálida de ti espera inmóvil. Solo luchará si la desafías. Vencerla otorga un punto de habilidad. Salir de la sala termina el duelo y restaura la salud del reflejo.
actors.mobs.npcs.echoreflection.challenge=¿Desafiar a tu reflejo? La victoria otorga un punto de habilidad. Puedes retirarte, pero el reflejo se recuperará si sales de la sala.
actors.mobs.npcs.echoreflection.accept=Desafiar
actors.mobs.npcs.echoreflection.withdrawn=Tu reflejo vuelve a quedarse inmóvil.
actors.mobs.npcs.echoreflection.victory=El reflejo se desvanece y deja un pergamino de habilidad.
actors.mobs.npcs.barbecueking.name=rey rata
actors.mobs.npcs.barbecueking.desc=Hasta un rey tiene que comer. Ha encontrado un rincón tranquilo para asar su cena.
actors.mobs.npcs.barbecueking.greeting=Asuntos reales. Muy importantes. Muy sabrosos.
actors.mobs.npcs.barbecueking.stolen=¡EH! ¡Eso era mío!
actors.mobs.npcs.barbecueking.after=Ojalá se te atragante.
actors.mobs.npcs.forgottenoffering.name=ofrenda olvidada
actors.mobs.npcs.forgottenoffering.desc=Una ración de comida y una poción de curación esperan bajo el cristal. Elige una; la otra se convertirá en polvo.
actors.mobs.npcs.watchremains.name=guardia caído
actors.mobs.npcs.watchremains.desc=Los huesos de un guardia yacen junto a un muro roto. Bajo su casco hay un trozo de papel.
actors.mobs.npcs.watchremains.note=Defendí la puerta toda la noche. Entraron por la pared.
