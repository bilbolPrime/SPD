actors.hero.talent$swiftequipcooldown.name=snabb nedkylning av utrustningen
actors.hero.talent.adventurers_intuition.desc=_+1:_ Duelisten identifierar vapen _2,5x snabbare_ och rustning _1,75x snabbare_.\n\n_+2:_ Duelisten identifierar vapen _när hon utrustar dem_ och rustning _2,5x snabbare_.
actors.hero.talent.adventurers_intuition.title=äventyrarens intuition
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duelisten får _3 sköldning_ när hon använder en vapenförmåga och har 50 % hälsa eller lägre.\n\n_+2:_ Duelisten får _5 sköldning_ när hon använder en vapenförmåga och har 50 % hälsa eller lägre.
actors.hero.talent.aggressive_barrier.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att ge sköld vid närstridsattacker med låg hälsa, med en nedkylningstid på 50 tur.
actors.hero.talent.aggressive_barrier.title=aggressiv barriär
actors.hero.talent.ally_warp.desc=_+1:_ Magikern kan välja en allierad för att omedelbart byta plats med dem, med ett _2-brickintervall_.\n\n_+2:_ Magikern kan välja en allierad för att omedelbart byta plats med dem, med ett _4-brickintervall_.\n\n_+3:_ Magikern kan välja en allierad för att omedelbart byta plats med dem, med ett _6-brickintervall_.\n\n Magikern kan inte byta plats med orörliga allierade.
actors.hero.talent.ally_warp.title=allierad varp
actors.hero.talent.arcane_vision.desc=_+1:_ När magikern slår en fiende får han sinnesinsikt på dem i _10 omgångar_.\n\n_+2:_ När magikern slår en fiende får han sinnesinsikt på dem i _15 omgångar_.
actors.hero.talent.arcane_vision.title=svårbegriplig vision
actors.hero.talent.assassins_reach.desc=_+1:_ Lönnmördarens blinkningsområde per förberedelsenivå ökas till _1/3/4/6 rutor_, från 1/2/3/4.\n\n_+2:_ Lönnmördarens blinkningsområde per förberedelsenivå ökas till _2/4/6/8 rutor_, från 1/2/3/4.\n\n_+3:_ Lönnmördarens blinkningsområde per förberedelsenivå ökas till _2/5/7/10 rutor_, från 1/2/3/4.\n\nDenna blinkning kan gå genom faror och fiender, men inte genom fast terräng som murar.
actors.hero.talent.assassins_reach.title=lönnmördarens räckvidd
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladinen kan kasta _Skyddets Aura,_ en besvärjelse som ger Paladinen och alla allierade inom 2 rutor _20 % skademotstånd_ och effekten av Paladinens rustningsglyf vid _+50 % kraft_ i 20 omgångar, till kostnaden för 2 laddningar.\n\n_+2:_ Paladinen kan kasta _Skyddets Aura,_ en besvärjelse som ger Paladinen och alla allierade inom 2 rutor _30 % skademotstånd_ och effekten av Paladinens rustningsglyf vid _+75 % kraft_ i 20 omgångar, till kostnaden för 2 laddningar.\n\n_+3:_ Paladinen kan kasta _Skyddets Aura,_ en besvärjelse som ger Paladinen och alla allierade inom 2 rutor _40 % skademotstånd_ och effekten av Paladinens rustningsglyf vid _+100 % kraft_ i 20 varv, till kostnaden av 2 laddningar.
actors.hero.talent.aura_of_protection.title=aura av skydd
actors.hero.talent.backup_barrier.desc=_+1:_ Magikern får _3 sköldning_ varje gång han spenderar den sista laddningen i sin stav.\n\n_+2:_ Magikern får _5 sköldning_ varje gång han spenderar den sista laddningen i sin stav.
actors.hero.talent.backup_barrier.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att utlösas från hjältens trollstav på högsta nivå.
actors.hero.talent.backup_barrier.title=backupbarriär
actors.hero.talent.barkskin.desc=_+1:_ När hon kliver i gräs får fångvaktaren _0–50 % av sin nivå_ i barkskalsrustning som bleknar varje tur.\n\n_+2:_ När hon kliver i gräs får fångvaktaren _0–100 % av sin nivå_ i barkskalsrustning som bleknar varje tur.\n\n_+3:_ När hon kliver i gräs får fångvaktaren _0–150 % av sin nivå_ i barkskalsrustning som bleknar varje tur.
actors.hero.talent.barkskin.title=barkhud
actors.hero.talent.beaming_ray.desc=Prästen kan kasta _Strålande Stråle_ från en bemyndigad allierad för kostnaden av 1 laddning. Denna stråle kan gå igenom väggar och teleportera allierade till en riktad plats. Om en fiende är på den platsen dyker allierade upp bredvid fienden och kommer att rikta in sig på dem. Strålande stråle kan till och med teleportera normalt orörliga allierade, men har halva räckvidden när den gör det.\n\n_+1:_ Strålande stråle har en maximal räckvidd på _4 brickor,_ och ökar Power of Manys bonus till _+35 % skada_ mot den närmaste fienden i 10 turer.\n\n_+2:_ Strålande stråle har en maximal räckvidd på _8 brickor,_ och ökar Power of Manys bonus till _+40 % skada_ mot den närmaste fienden i 10 turer.\n\n_+3:_ Strålande stråle har en maximal räckvidd på _12 brickor,_ och ökar Power of Manys bonus till _+45 % skada_ mot den närmaste fienden i 10 turer.\n\n_+4:_ Strålande stråle har en maximal räckvidd på _16 brickor,_ och ökar Mångas krafts bonus till _+50 % skada_ mot den närmaste fienden i 10 rundor.
actors.hero.talent.beaming_ray.title=strålande stråle
actors.hero.talent.blast_radius.desc=_+1:_ Elementexplosionens radie ökas till _5 rutor_, från 4. \n\n_+2:_ Elementexplosionens radie ökas till _6 rutor_, från 4. \n\n_+3:_ Elementexplosionens radie ökas till _7 rutor_, från 4. \n\n_+4:_ Elementexplosionens radie ökas till _8 rutor_, från 4.
actors.hero.talent.blast_radius.title=explosionsradie
actors.hero.talent.bless.desc=_+1:_ Prästskapet kan kasta _Välsignelse,_ en besvärjelse som ger _6 varv av välsignelse och 10 sköldar_ när den kastas på sig själv eller _10 varv av välsignelse och 10 helande_ när den kastas på en annan karaktär, till kostnaden av 1 laddning.\n\n_+2:_ Prästskapet kan kasta _Välsignelse,_ en besvärjelse som ger _10 varv av välsignelse och 15 sköldar_ när den kastas på sig själv eller _15 varv av välsignelse och 15 helande_ när den kastas på en annan karaktär, till kostnaden av 1 laddning.\n\nÖverskottsläkning från denna besvärjelse omvandlas till sköldar.
actors.hero.talent.bless.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att öka precisionen och undvikandet för hjälten och alla allierade med 3% vid +1 eller 5% vid +2.
actors.hero.talent.bless.title=välsigna
actors.hero.talent.body_form.desc=Prästen kan använda _Kroppsform_, vilket ger Trinity kraften från en förtrollning eller glyf som prästen har identifierat under denna omgång, till en kostnad av 2 laddningar.\n\n_+1:_ När Trinity används får prästen den valda effekten i _20 omgångar._\n\n_+2:_ När Trinity används får prästen den valda effekten i _27 omgångar._\n\n_+3:_ När Trinity används får prästen den valda effekten i _33 omgångar._\n\n_+4:_ När Trinity används får prästen den valda effekten i _40 omgångar._\n\nTrinity kan bara genomsyras av en kroppseffekt åt gången. Trinitys rustningsladdningskostnad är högre om den valda glyfen är sällsynt och kraftfull.
actors.hero.talent.body_form.title=kroppsform
actors.hero.talent.body_replacement.desc=_+1:_ Efter att ha blinkat lämnar skurken en trälockbete som har _20 hälsa och 1-3 rustning_.\n\n_+2:_ Efter att ha blinkat lämnar skurken en trälockbete som har _40 hälsa och 2-6 rustning_.\n\n_+3:_ Efter att ha blinkat lämnar skurken en trälockbete som har _60 hälsa och 3-9 rustning_.\n\n_+4:_ Efter att ha blinkat lämnar skurken en trälockbete som har _80 hälsa och 4-12 rustning_.\n\nEndast en lockbete kan vara aktiv åt gången.
actors.hero.talent.body_replacement.title=karossersättning
actors.hero.talent.body_slam.desc=_+1:_ När krigaren landar efter att ha hoppat tar alla angränsande fiender skada lika med _1-4 plus 25%_ av hans skadeblockerande kraft.\n\n_+2:_ När krigaren landar efter att ha hoppat tar alla angränsande fiender skada lika med _2-8 plus 50%_ av hans skadeblockerande kraft.\n\n_+3:_ När krigaren landar efter att ha hoppat tar alla angränsande fiender skada lika med _3-12 plus 75%_ av hans skadeblockerande kraft.\n\n_+4:_ När krigaren landar efter att ha hoppat tar alla angränsande fiender skada lika med _4-16 plus 100%_ av hans skadeblockerande kraft.
actors.hero.talent.body_slam.title=kroppsslam
actors.hero.talent.bounty_hunter.desc=_+1:_ När lönnmördaren dödar en fiende med ett förberett slag ökar deras chans att förlora föremål med _2/4/8/16%_, per förberedelsenivå.\n\n_+2:_ När lönnmördaren dödar en fiende med ett förberett slag ökar deras chans att förlora föremål med _4/8/16/32%_, per förberedelsenivå.\n\n_+3:_ När lönnmördaren dödar en fiende med ett förberett slag ökar deras chans att förlora föremål med _6/12/24/48%_, per förberedelsenivå.
actors.hero.talent.bounty_hunter.title=prisjägare
actors.hero.talent.cached_rations.desc=_+1:_ Skurken kan hitta _2 förrådsransoner_ placerade i kistor medan han utforskar de närmaste våningarna i fängelsehålan.\n\n_+2:_ Skurken kan hitta _3 förrådsransoner_ placerade i kistor medan han utforskar de närmaste våningarna i fängelsehålan.\n\nFörrådsransoner äts snabbt, återställer en måttlig mängd mättnadskänsla, läker 5 hp och återställer 1 laddning till skuggornas mantel.
actors.hero.talent.cached_rations.title=cachade ransoner
actors.hero.talent.cleanse.desc=_+1:_ Prästen kan kasta _Rengöra,_ en besvärjelse som _tar bort negativa statuseffekter_ från prästen och alla närliggande allierade, och ger dem _10% sköldning,_ till en kostnad av 2 laddningar.\n\n_+2:_ Prästen kan kasta _Rengöra,_ en besvärjelse som _ger 3 varv negativ statusimmunitet_ till prästen och alla närliggande allierade, och ger dem _20% sköldning,_ till en kostnad av 2 laddningar.\n\n_+3:_ Prästen kan kasta _Rengöra,_ en besvärjelse som _ger 5 varv negativ statusimmunitet_ till prästen och alla närliggande allierade, och ger dem _30% sköldning,_ till en kostnad av 2 laddningar.
actors.hero.talent.cleanse.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att rensa ut negativa statuseffekter på hjälten efter att ha använt en trollstav eller artefakt, 10/20/30 % av tiden vid +1/+2/+3.
actors.hero.talent.cleanse.title=rengöra
actors.hero.talent.cleave.desc=_+1:_ Den extra tiden gladiatorn får på en kill ökas till _30 turar_, från 15. \n\n_+2:_ Den extra tiden gladiatorn får på en kill ökas till _45 turar_, från 15. \n\n_+3:_ Den extra tiden gladiatorn får på en kill ökas till _60 turar_, från 15.
actors.hero.talent.cleave.title=klyva
actors.hero.talent.cloned_armor.desc=_+1:_ Skuggklonen får _12%_ av hjältens rustningsvärde och har _25% chans_ att använda glyfen på hjältens rustning.\n\n_+2:_ Skuggklonen får _24%_ av hjältens rustningsvärde och har _50% chans_ att använda glyfen på hjältens rustning.\n\n_+3:_ Skuggklonen får _36%_ av hjältens rustningsvärde och har _75% chans_ att använda glyfen på hjältens rustning.\n\n_+4:_ Skuggklonen får _48%_ av hjältens rustningsvärde och har _100% chans_ att använda glyfen på hjältens rustning.
actors.hero.talent.cloned_armor.title=klonad rustning
actors.hero.talent.close_the_gap.desc=_+1:_ Duellanten blinkar _upp till två brickor_ mot sitt mål när hon startar en duell.\n\n_+2:_ Duellanten blinkar _upp till tre brickor_ mot sitt mål när hon startar en duell.\n\n_+3:_ Duellanten blinkar _upp till fyra brickor_ mot sitt mål när hon startar en duell.\n\n_+4:_ Duellanten blinkar _upp till fem brickor_ mot sitt mål när hon startar en duell.\n\nDenna blinkning kan gå igenom faror och fiender, men inte genom fast terräng som murar. Blinkningen tas med i beräkningen när man avgör om en fiende är inom räckhåll för att utmanas.
actors.hero.talent.close_the_gap.title=täpp till gapet
actors.hero.talent.combined_energy.desc=_+1:_ Om munken använder en vapenförmåga och en _4+ energi_-förmåga inom 5 omgångar från varandra, återfår hon 1 förbrukad energi.\n\n_+2:_ Om munken använder en vapenförmåga och en _3+ energi_-förmåga inom 5 omgångar från varandra, återfår hon 1 förbrukad energi.\n\n_+3:_ Om munken använder en vapenförmåga och en _2+ energi_-förmåga inom 5 omgångar från varandra, återfår hon 1 förbrukad energi.
actors.hero.talent.combined_energy.title=kombinerad energi
actors.hero.talent.combined_lethality.desc=_+1:_ Om mästaren attackerar med ett närstridsvapen omedelbart efter att ha använt en annan vapens förmåga, kommer attacken att avrätta alla icke-boss-fiender som finns kvar på _under 13 % HP_.\n\n_+2:_ Om mästaren attackerar med ett närstridsvapen omedelbart efter att ha använt en annan vapens förmåga, kommer attacken att avrätta alla icke-boss-fiender som finns kvar på _under 27 % HP_.\n\n_+3:_ Om mästaren attackerar med ett närstridsvapen omedelbart efter att ha använt en annan vapens förmåga, kommer attacken att avrätta alla icke-boss-fiender som finns kvar på _under 40 % HP_.\n\nDenna attack kan vara en vanlig närstridsattack eller en del av en vapenförmåga.
actors.hero.talent.combined_lethality.title=kombinerad dödlighet
actors.hero.talent.conserved_magic.desc=_+1:_ Varje zapp från vild magi använder nu _0,33 laddningar_ istället för 0,5, och vild magi har _25% chans_ att inte spendera en tur.\n\n_+2:_ Varje zapp från vild magi använder nu _0,225 laddningar_ istället för 0,5, och vild magi har _50% chans_ att inte spendera en tur.\n\n_+3:_ Varje zapp från vild magi använder nu _0,15 laddningar_ istället för 0,5, och vild magi har _75% chans_ att inte spendera en tur.\n\n_+4:_ Varje zapp från vild magi använder nu _0,1 laddningar_ istället för 0,5, och vild magi har _100% chans_ att inte spendera en tur.
actors.hero.talent.conserved_magic.title=bevarad magi
actors.hero.talent.counter_ability.desc=_+1:_ Om duellisten använder en vapenförmåga inom 3 omgångar efter att hennes efterbild attackerats, återfår hon omedelbart _0,38 laddningar_.\n\n_+2:_ Om duellisten använder en vapenförmåga inom 3 omgångar efter att hennes efterbild attackerats, återfår hon omedelbart _0,77 laddningar_.\n\n_+3:_ Om duellisten använder en vapenförmåga inom 3 omgångar efter att hennes efterbild attackerats, återfår hon omedelbart _1,13 laddningar_.\n\n_+4:_ Om duellisten använder en vapenförmåga inom 3 omgångar efter att hennes efterbild attackerats, återfår hon omedelbart _1,5 laddningar_.
actors.hero.talent.counter_ability.title=motförmåga
actors.hero.talent.deadly_followup.desc=_+1:_ När duelisten träffar en fiende med ett kastat vapen, kommer hon att göra _10 % mer närstridsskada_ på dem i 5 omgångar.\n\n_+2:_ När duelisten träffar en fiende med ett kastat vapen, kommer hon att göra _20 % mer närstridsskada_ på dem i 5 omgångar.\n\n_+3:_ När duelisten träffar en fiende med ett kastat vapen, kommer hon att göra _30 % mer närstridsskada_ på dem i 5 omgångar.
actors.hero.talent.deadly_followup.title=dödlig uppföljning
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk utlöses automatiskt om Berserker är på väg att dö och ilskan är på eller över 100 %, men den har en nedkylningstid på _3 hjältenivåer_ när detta händer.\n\n_+2:_ Berserk utlöses automatiskt om Berserker är på väg att dö och ilskan är på eller över 100 %, men den har en nedkylningstid på _2 hjältenivåer_ när detta händer.\n\n_+3:_ Berserk utlöses automatiskt om Berserker är på väg att dö och ilskan är på eller över 100 %, men den har en nedkylningstid på _1 hjältenivå_ när detta händer.\n\nObservera att Berserker fortfarande kommer att dö om han har 0 HP när bersärkningen slutar.
actors.hero.talent.deathless_fury.title=odödlig raseri
actors.hero.talent.deathly_durability.desc=_+1:_ Fiender som dödas av dödsmärket ger Rogue-sköld lika med _13%_ av deras HP när de markerades.\n\n_+2:_ Fiender som dödas av dödsmärket ger Rogue-sköld lika med _25%_ av deras HP när de markerades.\n\n_+3:_ Fiender som dödas av dödsmärket ger Rogue-sköld lika med _38%_ av deras HP när de markerades.\n\n_+4:_ Fiender som dödas av dödsmärket ger Rogue-sköld lika med _50%_ av deras HP när de markerades.
actors.hero.talent.deathly_durability.title=dödlig hållbarhet
actors.hero.talent.desperate_power.desc=_+1:_ Magikerns trollstavar och stav får _+1 nivå_ på sin sista zapp när de har kommit ner till sin sista laddning.\n\n_+2:_ Magikerns trollstavar och stav får _+2 nivåer_ på sin sista zapp när de har kommit ner till sin sista laddning.\n\n_+3:_ Magikerns trollstavar och stav får _+3 nivåer_ på sin sista zapp när de har kommit ner till sin sista laddning.
actors.hero.talent.desperate_power.title=desperat makt
actors.hero.talent.directed_power.desc=_+1:_ Den direkta attacken från elementärt attack ger _+30 % förtrollningskraft_ för varje fiende inom räckhåll för elementärt attackens effekt, inklusive attackmålet.\n\n_+2:_ Den direkta attacken från elementärt attack ger _+60 % förtrollningskraft_ för varje fiende inom räckhåll för elementärt attackens effekt, inklusive attackmålet.\n\n_+3:_ Den direkta attacken från elementärt attack ger _+90 % förtrollningskraft_ för varje fiende inom räckhåll för elementärt attackens effekt, inklusive attackmålet.\n\n_+4:_ Den direkta attacken från elementärt attack ger _+120 % förtrollningskraft_ för varje fiende inom räckhåll för elementärt attackens effekt, inklusive attackmålet.
actors.hero.talent.directed_power.title=riktad kraft
actors.hero.talent.divine_intervention.desc=_+1:_ I Uppstigen Form kan Prästen använda _Gudomlig Intervention,_ vilket ökar Prästen och alla allierade upp till _150 i sköldning_ och utökar Uppstigen Form med _3 varv._\n\n_+2:_ I Uppstigen Form kan Prästen använda _Gudomlig Intervention,_ vilket ökar Prästen och alla allierade upp till _200 i sköldning_ och utökar Uppstigen Form med _4 varv._\n\n_+3:_ I Uppstigen Form kan Prästen använda _Gudomlig Intervention,_ vilket ökar Prästen och alla allierade upp till _250 i sköldning_ och utökar Uppstigen Form med _5 varv._\n\n_+4:_ I Uppstigen Form kan Prästen använda _Gudomlig Intervention,_ vilket ökar Präst och alla allierade upp till _300 sköldning_ och utökar Uppstigen Form med _6 tur._\n\nGudomlig Intervention kostar hela 5 tomeladdningar och kan bara kastas en gång i samma uppstigna form.
actors.hero.talent.divine_intervention.title=gudomlig ingripande
actors.hero.talent.divine_sense.desc=_+1:_ Prästskapet kan kasta _Gudomlig Sinn,_ en besvärjelse som ger dem _8 brickor_ av Sinnesvision i 50 omgångar och som inte tar någon tid att kasta, till en kostnad av 2 laddningar.\n\n_+2:_ Prästskapet kan kasta _Gudomlig Sinn,_ en besvärjelse som ger dem _12 brickor_ av Sinnesvision i 50 omgångar och som inte tar någon tid att kasta, till en kostnad av 2 laddningar.
actors.hero.talent.divine_sense.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att ge dem tankesyn under en kort stund efter att ha använt en trollstav eller artefakt med ett intervall på 3 brickor vid +1 eller 5 brickor vid +2.
actors.hero.talent.divine_sense.title=gudomlig känsla
actors.hero.talent.double_jump.desc=_+1:_ Om krigaren utför ett andra hopp inom 3 varv har det hoppet en _16 % reducerad_ laddningskostnad.\n\n_+2:_ Om krigaren utför ett andra hopp inom 3 varv har det hoppet en _30 % reducerad_ laddningskostnad.\n\n_+3:_ Om krigaren utför ett andra hopp inom 3 varv har det hoppet en _40 % reducerad_ laddningskostnad.\n\n_+4:_ Om krigaren utför ett andra hopp inom 3 varv har det hoppet en _50 % reducerad_ laddningskostnad.
actors.hero.talent.double_jump.title=dubbelhopp
actors.hero.talent.double_mark.desc=_+1:_ Att markera ett andra mål samtidigt som det första har en _30 % reducerad_ laddningskostnad.\n\n_+2:_ Att markera ett andra mål samtidigt som det första har en _50 % reducerad_ laddningskostnad.\n\n_+3:_ Att markera ett andra mål samtidigt som det första har en _65 % reducerad_ laddningskostnad.\n\n_+4:_ Att markera ett andra mål samtidigt som det första har en _75 % reducerad_ laddningskostnad.
actors.hero.talent.double_mark.title=dubbelt märke
actors.hero.talent.durable_projectiles.desc=_+1:_ Kastade vapen har _+50 % hållbarhet_ när de används av Jägaren.\n\n_+2:_ Kastade vapen har _+75 % hållbarhet_ när de används av Jägaren.
actors.hero.talent.durable_projectiles.title=hållbara projektiler
actors.hero.talent.durable_tips.desc=_+1:_ Spetsiga pilar har _2x hållbarhet_ när fångvaktaren använder dem.\n\n_+2:_ Spetsiga pilar har _3x hållbarhet_ när fångvaktaren använder dem.\n\n_+3:_ Spetsiga pilar har _4x hållbarhet_ när fångvaktaren använder dem.
actors.hero.talent.durable_tips.title=slitstarka spetsar
actors.hero.talent.eagle_eye.desc=_+1:_ Andehökens synområde ökas till _7 rutor_ från 6. \n\n_+2:_ Andehökens synområde ökas till _8 rutor_ från 6. \n\n_+3:_ Andehökens synområde ökas till _9 rutor_ från 6, och den får _2 rutor_ sinnessyn. \n\n_+4:_ Andehökens synområde ökas till _10 rutor_ från 6, och den får _3 rutor_ sinnessyn.
actors.hero.talent.eagle_eye.title=örnöga
actors.hero.talent.elemental_power.desc=_+1:_ Kraften i elementexplosionen ökas med _25%_.\n\n_+2:_ Kraften i elementexplosionen ökas med _50%_.\n\n_+3:_ Kraften i elementexplosionen ökas med _75%_.\n\n_+4:_ Kraften i elementexplosionen ökas med _100%_.
actors.hero.talent.elemental_power.title=elementär kraft
actors.hero.talent.elemental_reach.desc=_+1:_ Elementarslagets räckvidd ökas till _5 rutor_ från 4, och dess bredd ökas till _75 grader_ från 65. \n\n_+2:_ Elementarslagets räckvidd ökas till _6 rutor_ från 4, och dess bredd ökas till _85 grader_ från 65. \n\n_+3:_ Elementarslagets räckvidd ökas till _7 rutor_ från 4, och dess bredd ökas till _95 grader_ från 65. \n\n_+4:_ Elementarslagets räckvidd ökas till _8 rutor_ från 4, och dess bredd ökas till _105 grader_ från 65.
actors.hero.talent.elemental_reach.title=elementär räckvidd
actors.hero.talent.elimination_match.desc=_+1:_ Om duellisten utmanar igen inom 3 rundor efter att en duell slutat, har den utmaningen en _16 % reducerad_ laddningskostnad.\n\n_+2:_ Om duellisten utmanar igen inom 3 rundor efter att en duell slutat, har den utmaningen en _30 % reducerad_ laddningskostnad.\n\n_+3:_ Om duellisten utmanar igen inom 3 rundor efter att en duell slutat, har den utmaningen en _40 % reducerad_ laddningskostnad.\n\n_+4:_ Om duellisten utmanar igen inom 3 rundor efter att en duell slutat, har den utmaningen en _50 % reducerad_ laddningskostnad.
actors.hero.talent.elimination_match.title=elimineringsmatch
actors.hero.talent.empowered_strike.desc=_+1:_ Battlemagikerns första närstridsattack med sin stav efter att ha zappat med den ger _+16 % skada_ och stavens bonuseffekt får _+50 % kraft_.\n\n_+2:_ Battlemagikerns första närstridsattack med sin stav efter att ha zappat med den ger _+33 % skada_ och stavens bonuseffekt får _+100 % kraft_.\n\n_+3:_ Battlemagikerns första närstridsattack med sin stav efter att ha zappat med den ger _+50 % skada_ och stavens bonuseffekt får _+150 % kraft_.
actors.hero.talent.empowered_strike.title=bemyndigad strejk
actors.hero.talent.empowering_meal.desc=_+1:_ Att äta mat ger magikern _2 bonusskada_ de nästa 3 gånger han gör skada med en trollstav.\n\n_+2:_ Att äta mat ger magikern _3 bonusskada_ de nästa 3 gånger han gör skada med en trollstav.
actors.hero.talent.empowering_meal.title=stärkande måltid
actors.hero.talent.endless_rage.desc=_+1:_ Berserkern kan nå maximalt _116 % raseri_.\n\n_+2:_ Berserkern kan nå maximalt _133 % raseri_.\n\n_+3:_ Berserkern kan nå maximalt _150 % raseri_.\n\nVarje raseripoäng över 100 % ökar berserkerns avsköldning med 1 % och minskar nedkylningstiden med 1 %, men ökar inte skadebonusen utöver +50 %.
actors.hero.talent.endless_rage.title=oändlig ilska
actors.hero.talent.energizing_meal.desc=_+1:_ Att äta mat tar magikerns första tur och ger honom _5 varv med omladdning av trollstav_.\n\n_+2:_ Att äta mat tar magikerns första tur och ger honom _8 varv med omladdning av trollstav_.
actors.hero.talent.energizing_meal.title=energigivande måltid
actors.hero.talent.enhanced_combo.desc=_+1:_ När gladiatorns kombination är 7 eller högre ökar Clobbers knockback-intervall till 3, den orsakar yrsel och kan slå fiender ner i gropar.\n\n_+2:_ Förutom fördelarna med +1, arbetar parering med flera attacker när gladiatorns kombination är 9 eller högre.\n\n_+3:_ Förutom fördelarna med +1 och +2 kan gladiatorn hoppa upp till kombinations-/3-brickor när den använder Slam, Crush eller Fury.
actors.hero.talent.enhanced_combo.title=förbättrad kombination
actors.hero.talent.enhanced_lethality.desc=_+1:_ Lönnmördaren kan lönnmörda fiender kvar vid under _4/13/27/67 % hälsa_ per förberedelsenivå, upp från 3/10/20/50 %.\n\n_+2:_ Lönnmördaren kan lönnmörda fiender kvar vid under _5/17/33/83 % hälsa_ per förberedelsenivå, upp från 3/10/20/50 %.\n\n_+3:_ Lönnmördaren kan lönnmörda fiender kvar vid under _6/20/40/100 % hälsa_ per förberedelsenivå, upp från 3/10/20/50 %.
actors.hero.talent.enhanced_lethality.title=ökad dödlighet
actors.hero.talent.enhanced_rings.desc=_+1:_ När skurken använder en artefakt får hans ringar +1 uppgradering i _3 omgångar_.\n\n_+2:_ När skurken använder en artefakt får hans ringar +1 uppgradering i _6 omgångar_.\n\n_+3:_ När skurken använder en artefakt får hans ringar +1 uppgradering i _9 omgångar_.
actors.hero.talent.enhanced_rings.title=förstärkta ringar
actors.hero.talent.enlightening_meal.desc=_+1:_ Att äta mat tar prästen 1 tur och ger dem _0,67 anklagelser_ på deras heliga bok. \n\n_+2:_ Att äta mat tar prästen 1 tur och ger dem _1 anklagelse_ på deras heliga bok.
actors.hero.talent.enlightening_meal.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge 2 varv av omladdning av trollstav och artefakt vid +1, eller 3 varv vid +2. Detta kan inte användas för att låta ymnighetshornet ladda om sig självt.
actors.hero.talent.enlightening_meal.title=Upplysande måltid
actors.hero.talent.enraged_catalyst.desc=_+1:_ Förtrollningar och förbannelser på Berserkers vapen utlöses oftare ju mer raseri han har, till maximalt _15 % oftare_ vid 100 % raseri.\n\n_+2:_ Förtrollningar och förbannelser på Berserkers vapen utlöses oftare ju mer raseri han har, till maximalt _30 % oftare_ vid 100 % raseri.\n\n_+3:_ Förtrollningar och förbannelser på Berserkers vapen utlöses oftare ju mer raseri han har, till maximalt _45 % oftare_ vid 100 % raseri.
actors.hero.talent.enraged_catalyst.title=rasande katalysator
actors.hero.talent.evasive_armor.desc=_+1:_ Medan frilöparen springer får frilöparen ytterligare _+1 undanflykt_ per överskottsstyrka på sin rustning.\n\n_+2:_ Medan frilöparen frilöpar får frilöparen ytterligare _+2 undanflykt_ per överskjutande styrka på sin rustning. freerunning, får Freerunner ytterligare _+3 evasion_ per överskjutande styrka på sin rustning.
actors.hero.talent.evasive_armor.title=undvikande rustning
actors.hero.talent.even_the_odds.desc=_+1:_ Krigaren gör ytterligare _5 % bonusskada_ för varje fiende inom 2 rutor när den klarar avslut.\n\n_+2:_ Krigaren gör ytterligare _10 % bonusskada_ för varje fiende inom 2 rutor när den klarar avslut.\n\n_+3:_ Krigaren gör ytterligare _15 % bonusskada_ för varje fiende inom 2 rutor när den klarar avslut.\n\n_+4:_ Krigaren gör ytterligare _20 % bonusskada_ för varje fiende inom 2 rutor när den klarar avslut.
actors.hero.talent.even_the_odds.title=till och med oddsen
actors.hero.talent.excess_charge.desc=_+1:_ När Battlemages stav är fulladdad, ger dess nästa zapp honom _0,67 sköldar_ per stavnivå.\n\n_+2:_ När Battlemages stav är fulladdad, ger dess nästa zapp honom _1,33 sköldar_ per stavnivå.\n\n_+3:_ När Battlemages stav är fulladdad, ger dess nästa zapp honom _2 sköldar_ per stavnivå.
actors.hero.talent.excess_charge.title=överskottsavgift
actors.hero.talent.expanding_wave.desc=_+1:_ Shockwaves räckvidd ökas till _6 rutor_ från 5, och dess bredd ökas till _75 grader_ från 60. \n\n_+2:_ Shockwaves räckvidd ökas till _7 rutor_ från 5, och dess bredd ökas till _90 grader_ från 60. \n\n_+3:_ Shockwaves räckvidd ökas till _8 rutor_ från 5, och dess bredd ökas till _105 grader_ från 60. \n\n_+4:_ Shockwaves räckvidd ökas till _9 rutor_ från 5, och dess bredd ökas till _120 grader_ från 60.
actors.hero.talent.expanding_wave.title=expanderande våg
actors.hero.talent.expose_weakness.desc=_+1:_ Fiender som attackerar Duelistens efterbild blir svaga och sårbara i _2 omgångar_.\n\n_+2:_ Fiender som attackerar Duelistens efterbild blir svaga och sårbara i _4 omgångar_.\n\n_+3:_ Fiender som attackerar Duelistens efterbild blir svaga och sårbara i _6 omgångar_.\n\n_+4:_ Fiender som attackerar Duelistens efterbild blir svaga och sårbara i _8 omgångar_.
actors.hero.talent.expose_weakness.title=avslöja svaghet
actors.hero.talent.fan_of_blades.desc=_+1:_ Spektralblad kan träffa upp till _1 ytterligare mål_ för 50 % skada. Målet måste vara synligt och inom en _30 graders_ kon AOE.\n\n_+2:_ Spektralblad kan träffa upp till _2 ytterligare mål_ för 50 % skada. Målen måste vara synliga och inom en _60 graders_ kon AOE.\n\n_+3:_ Spektralblad kan träffa upp till _3 ytterligare mål_ för 50 % skada. Målen måste vara synliga och inom en _90 graders_ kon AOE.\n\n_+4:_ Spektralblad kan träffa upp till _4 ytterligare mål_ för 50 % skada. Målen måste vara synliga och inom en _120 graders_ kon AOE.
actors.hero.talent.fan_of_blades.title=fläkt av blad
actors.hero.talent.farsight.desc=_+1:_ Krypskyttens synfält _ökas med 25%_.\n\n_+2:_ Krypskyttens synfält _ökas med 50%_.\n\n_+3:_ Krypskyttens synfält _ökas med 75%_.
actors.hero.talent.farsight.title=långsyn
actors.hero.talent.fear_the_reaper.desc=_+1:_ När en dödsmarkerad fiende når 0 hp blir de _förlamad_.\n\n_+2:_ När en dödsmarkerad fiende når 0 hp blir de _fruktade och förlamade_.\n\n_+3:_ När en dödsmarkerad fiende når 0 hp blir de _fruktade och förlamade_ och fiender inom 3 rutor blir _förlamade_.\n\n_+4:_ När en dödsmarkerad fiende når 0 hp blir de _fruktade och förlamade_ och fiender inom 3 rutor blir _fruktade och förlamade_.
actors.hero.talent.fear_the_reaper.title=frukta skördemannen
actors.hero.talent.feigned_retreat.desc=_+1:_ Om en fiende attackerar duellistens efterbild vinner hon _2 varv_ i hast.\n\n_+2:_ Om en fiende attackerar duellistens efterbild vinner hon _4 varv_ i hast.\n\n_+3:_ Om en fiende attackerar duellistens efterbild vinner hon _6 varv_ i hast.\n\n_+4:_ Om en fiende attackerar duellistens efterbild vinner hon _8 varv_ i hast.
actors.hero.talent.feigned_retreat.title=föreföll reträtt
actors.hero.talent.fire_everything.desc=_+1:_ Vildmagi avfyras nu _5 gånger_ upp från 4, och varje trollstav har _25 % chans_ att kunna användas 3 gånger.\n\n_+2:_ Vildmagi avfyras nu _6 gånger_ upp från 4, och varje trollstav har _50 % chans_ att kunna användas 3 gånger.\n\n_+3:_ Vildmagi avfyras nu _7 gånger_ upp från 4, och varje trollstav har _75 % chans_ att kunna användas 3 gånger.\n\n_+4:_ Vildmagi avfyras nu _8 gånger_ upp från 4, och varje trollstav har _100 % chans_ att kunna användas 3 gånger.
actors.hero.talent.fire_everything.title=avfyra allt
actors.hero.talent.flash.desc=_+1:_ I Uppstigen Form kan prästen kasta _Blixt_ för att teleportera upp till _3 brickor_ bort.\n\n_+2:_ I Uppstigen Form kan prästen kasta _Blixt_ för att teleportera upp till _4 brickor_ bort.\n\n_+3:_ I Uppstigen Form kan prästen kasta _Blixt_ för att teleportera upp till _5 brickor_ bort.\n\n_+4:_ I Uppstigen Form kan prästen kasta _Blixt_ för att teleportera upp till _6 brickor_ bort.\n\nBlixt kostar 2 tome-laddningar initialt, och 1 ytterligare laddning för varje användning i samma uppstigna form.
actors.hero.talent.flash.title=flash
actors.hero.talent.focused_meal.desc=_+1:_ Att äta mat tar duellanten 1 tur och ger henne _0,67 laddningar_ på hennes vapen.\n\n_+2:_ Att äta mat tar duellanten 1 tur och ger henne _1 laddning_ på hennes vapen.
actors.hero.talent.focused_meal.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge bonusskada till deras nästa träff lika med deras nivå/3 vid +1, eller nivå/2 vid +2.
actors.hero.talent.focused_meal.title=fokuserad måltid
actors.hero.talent.followup_strike.desc=_+1:_ När Jägaren träffar en fiende med sin båge eller ett kastat vapen, gör hennes nästa närstridsattack mot den fienden _2 bonusskada_.\n\n_+2:_ När Jägaren träffar en fiende med sin båge eller ett kastat vapen, gör hennes nästa närstridsattack mot den fienden _3 bonusskada_.
actors.hero.talent.followup_strike.title=uppföljningsstrejk
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Attacker från anden höken förblindar fiender i _2 omgångar_.\n\n_+2:_ Attacker från anden höken förblindar fiender i _5 omgångar_.\n\n_+3:_ Attacker från anden höken förblindar fiender i _5 omgångar_ och lamslår dem i _2 omgångar_.\n\n_+4:_ Attacker från anden höken förblindar fiender i _5 omgångar_ och lamslår dem i _5 omgångar_.
actors.hero.talent.go_for_the_eyes.title=gå för ögonen
actors.hero.talent.growing_power.desc=_+1:_ Attack- och rörelsehastighetsökningarna från naturens kraft ökas till _38% och 125%_, från 33% och 100%.\n\n_+2:_ Attack- och rörelsehastighetsökningarna från naturens kraft ökas till _42% och 150%_, från 33% och 100%.\n\n_+3:_ Attack- och rörelsehastighetsökningarna från naturens kraft ökas till _46% och 175%_, från 33% och 100%.\n\n_+4:_ Attack- och rörelsehastighetsökningarna från naturens kraft ökas till _50% och 200%_, från 33% och 100%.
actors.hero.talent.growing_power.title=växande kraft
actors.hero.talent.hallowed_ground.desc=_+1:_ Prästen kan kasta _Helgat Mark,_ en besvärjelse som helgar terräng i ett _3x3 område_ i 20 omgångar, till en kostnad av 2 laddningar.\n\n_+2:_ Prästen kan kasta _Helgat Mark,_ en besvärjelse som helgar terräng i ett _5x5 område_ i 20 omgångar, till en kostnad av 2 laddningar.\n\n_+3:_ Prästen kan kasta _Helgat Mark,_ en besvärjelse som helgar terräng i ett _7x7 område_ i 20 omgångar, till en kostnad av 2 laddningar.\n\nNär den kastas, läker Helgat Mark allierade för 15 HP, rotar fiender kortvarigt och sprider kort gräs. Därefter läker den långsamt allierade, lemlästar fiender och får högt gräs att växa slumpmässigt. Helgad mark ger prästen skydd istället för läkning och förstörs av eld.
actors.hero.talent.hallowed_ground.title=helig mark
actors.hero.talent.hasty_retreat.desc=_+1:_ Efter att ha blinkat får skurken _1 varv_ av hast och osynlighet.\n\n_+2:_ Efter att ha blinkat får skurken _2 varv_ av hast och osynlighet.\n\n_+3:_ Efter att ha blinkat får skurken _3 varv_ av hast och osynlighet.\n\n_+4:_ Efter att ha blinkat får skurken _4 varv_ av hast och osynlighet.
actors.hero.talent.hasty_retreat.title=hastig reträtt
actors.hero.talent.hearty_meal.desc=_+1:_ Att äta mat helar krigaren med _4 HP_ när han har 33 % hälsa eller lägre. \n\n_+2:_ Att äta mat helar krigaren med _6 HP_ när han har 33 % hälsa eller lägre.
actors.hero.talent.hearty_meal.title=rejäl måltid
actors.hero.talent.heightened_senses.desc=_+1:_ Jägerskan får tankeseende på karaktärer inom _2 rutor från sin position_.\n\n_+2:_ Jägerskan får tankeseende på karaktärer inom _3 rutor från sin position_.
actors.hero.talent.heightened_senses.title=förhöjda sinnen
actors.hero.talent.heroic_energy.desc=_+1:_ Hjältens rustningsförmåga har en _12 % reducerad_ laddningskostnad.\n\n_+2:_ Hjältens rustningsförmåga har en _23 % reducerad_ laddningskostnad.\n\n_+3:_ Hjältens rustningsförmåga har en _32 % reducerad_ laddningskostnad.\n\n_+4:_ Hjältens rustningsförmåga har en _40 % reducerad_ laddningskostnad.
actors.hero.talent.heroic_energy.rat_title=ratroisk energi
actors.hero.talent.heroic_energy.title=heroisk energi
actors.hero.talent.hold_fast.desc=_+1:_ När krigaren väntar får han _1-2 rustningar_ och saktar ner försämringen av kombinations- och skyddsfördelar med _50%_ tills han rör sig.\n\n_+2:_ När krigaren väntar får han _2-4 rustningar_ och saktar ner försämringen av kombinations- och skyddsfördelar med _75%_ tills han rör sig.\n\n_+3:_ När krigaren väntar får han _3-6 rustningar_ och saktar ner försämringen av kombinations- och skyddsfördelar med _100%_ tills han rör sig.
actors.hero.talent.hold_fast.title=håll fast
actors.hero.talent.holy_intuition.desc=_+1:_ Prästskapet kan kasta _Helig Intuition,_ en besvärjelse som avslöjar om ett föremål är förbannat till en kostnad av _3 laddningar._\n\n_+2:_ Prästskapet kan kasta _Helig Intuition,_ en besvärjelse som avslöjar om ett föremål är förbannat till en kostnad av _2 laddningar._
actors.hero.talent.holy_intuition.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att låta hjälten identifiera förbannelsestatusen på ett förbannat föremål precis innan den utrustas, 15 % av tiden vid +1 eller 25 % av tiden vid +2.
actors.hero.talent.holy_intuition.title=helig intuition
actors.hero.talent.holy_lance.desc=_+1:_ Prästen kan kasta _Heliga Lansen,_ en förödande besvärjelse som gör _30–55 skada_ till en kostnad av 4 laddningar.\n\n_+2:_ Prästen kan kasta _Heliga Lansen,_ en förödande besvärjelse som gör _45–83 skada_ till en kostnad av 4 laddningar.\n\n_+3:_ Prästen kan kasta _Heliga Lansen,_ en förödande besvärjelse som gör _60–110 skada_ till en kostnad av 4 laddningar.\n\nHeliga Lansen gör alltid maximal skada på demoniska och odöda fiender. Heliga Lansen har en nedkylningstid på 30 tur innan den kan kastas igen.
actors.hero.talent.holy_lance.title=helig lans
actors.hero.talent.impact_wave.desc=_+1:_ När krigaren landar efter att ha hoppat slås alla intilliggande fiender _2 brickor_ tillbaka och har _25 % chans_ att bli sårbara i 5 omgångar.\n\n_+2:_ När krigaren landar efter att ha hoppat slås alla intilliggande fiender _3 brickor_ tillbaka och har _50 % chans_ att bli sårbara i 5 omgångar.\n\n_+3:_ När krigaren landar efter att ha hoppat slås alla intilliggande fiender _4 brickor_ tillbaka och har _75 % chans_ att bli sårbara i 5 omgångar.\n\n_+4:_ När krigaren landar efter att ha hoppat slås alla intilliggande fiender _5 brickor_ tillbaka och har _100 % chans_ att bli sårbara i 5 omgångar.
actors.hero.talent.impact_wave.title=stötvåg
actors.hero.talent.improvised_projectiles.desc=_+1:_ Krigaren kan förblinda en fiende i _2 rundor_ genom att kasta valfritt föremål som inte är ett kastat vapen på dem. Detta har en nedkylningstid på 50 rundor.\n\n_+2:_ Krigaren kan förblinda en fiende i _3 rundor_ genom att kasta valfritt föremål som inte är ett kastat vapen på dem. Detta har en nedkylningstid på 50 rundor.
actors.hero.talent.improvised_projectiles.title=improviserade projektiler
actors.hero.talent.inscribed_power.desc=_+1:_ När magikern läser en skriftrulle eller använder ett besvärjelseföremål får hans _nästa 2 trollstavzappar_ +2 nivåer.\n\n_+2:_ När magikern läser en skriftrulle eller använder ett besvärjelseföremål får hans _nästa 3 trollstavzappar_ +2 nivåer.\n\nAntalet förbättrade trollstavzappar fördubblas när man använder en skriftrulle med uppgraderings-, transmutations- eller alkemiföremål som måste tillverkas med dessa skriftrullar.\n\nFör alkemiföremål med högre outputkvantiteter (t.ex. de flesta besvärjelser) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.inscribed_power.title=inskriven kraft
actors.hero.talent.inscribed_stealth.desc=_+1:_ Skurken får _3 varv_ osynlighet efter att ha läst en skriftrulle eller använt ett besvärjelseföremål.\n\n_+2:_ Skurken får _5 varv_ osynlighet efter att ha läst en skriftrulle eller använt ett besvärjelseföremål.\n\nOsynlighetsvaraktigheten fördubblas när man använder en uppgraderingsskriftrulle, transmutationsskriftrulle eller alkemiföremål som måste tillverkas med dessa skriftrullar.\n\nFör alkemiföremål med högre outputkvantiteter (t.ex. de flesta besvärjelser) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.inscribed_stealth.title=inskriven smyg
actors.hero.talent.invigorating_meal.desc=_+1:_ Att äta mat tar Jägarinnan 1 tur (bär äts direkt) och ger henne _1 tur av hast_.\n\n_+2:_ Att äta mat tar Jägarinnan 1 tur (bär äts direkt) och ger henne _2 turar av hast_.
actors.hero.talent.invigorating_meal.title=uppfriskande måltid
actors.hero.talent.invigorating_victory.desc=_+1:_ Om duellanten besegrar sitt mål innan duellen är slut, läker hon för _5 HP plus 30 % av skadan_ hon tog under duellen.\n\n_+2:_ Om duellanten besegrar sitt mål innan duellen är slut, läker hon för _10 HP plus 50 % av skadan_ hon tog under duellen.\n\n_+3:_ Om duellanten besegrar sitt mål innan duellen är slut, läker hon för _15 HP plus 65 % av skadan_ hon tog under duellen.\n\n_+4:_ Om duellanten besegrar sitt mål innan duellen är slut, läker hon för _20 HP plus 75 % av skadan_ hon tog under duellen.
actors.hero.talent.invigorating_victory.title=uppfriskande seger
actors.hero.talent.iron_stomach.desc=_+1:_ Att äta mat tar Krigarens 1:a tur och ger honom _75 % skademotstånd_ medan han äter. \n\n_+2:_ Att äta mat tar Krigarens 1:a tur och ger honom _100 % skademotstånd_ medan han äter.
actors.hero.talent.iron_stomach.title=järnmage
actors.hero.talent.iron_will.desc=_+1:_ Skölden som tillhandahålls av krigarens sigill _ökas med 1_.\n\n_+2:_ Skölden som tillhandahålls av krigarens sigill _ökas med 2_.
actors.hero.talent.iron_will.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den passivt att ge en 1- eller 2-max sköldversion av Krigarens brutna sigill-effekt.
actors.hero.talent.iron_will.title=järnvilja
actors.hero.talent.judgement.desc=_+1:_ I Uppstigen Form kan prästen kasta _Dome,_ vilket gör _10–20 skada_ på alla synliga fiender.\n\n_+2:_ I Uppstigen Form kan prästen kasta _Dome,_ vilket gör _15–30 skada_ på alla synliga fiender.\n\n_+3:_ I Uppstigen Form kan prästen kasta _Dome,_ vilket gör _20–40 skada_ på alla synliga fiender.\n\n_+4:_ I Uppstigen Form kan prästen kasta _Dome,_ vilket gör _25–50 skada_ på alla synliga fiender.\n\nDome kostar 3 laddningar. Dom ger +33% skada för varje besvärjelse som Prästen har kastat sedan hen inträtt i uppstigen form eller sedan den senaste Domens utövning.
actors.hero.talent.judgement.title=dom
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladinen kan kasta _Handpåläggning,_ en besvärjelse som omedelbart läker en närliggande karaktär för _15 HP,_ eller ger Paladinen _15 sköldning,_ till en kostnad av 1 laddning.\n\n_+2:_ Paladinen kan kasta _Handpåläggning,_ en besvärjelse som omedelbart läker en närliggande karaktär för _20 HP,_ eller ger Paladinen _20 sköldning,_ till en kostnad av 1 laddning.\n\n_+3:_ Paladinen kan kasta _Handpåläggning,_ en besvärjelse som omedelbart läker en närliggande karaktär för _25 HP,_ eller ger Paladinen _25 sköldning,_ till en kostnad av 1 laddning.\n\nÖverskottsläkning från denna besvärjelse omvandlas till sköldning. Händepåläggning kan göras upprepade gånger, men det är inte tillåtet att använda mer än tre kast av skydd samtidigt.
actors.hero.talent.lay_on_hands.title=lägga på händerna
actors.hero.talent.lethal_defense.desc=_+1:_ När gladiatorn dödar en fiende med ett kombinationsdrag, _minskas nedkylningstiden för hans brutna sigill-sköld med 50 turer. \n\n_+2:_ När gladiatorn dödar en fiende med ett kombinationsdrag, _minskas nedkylningstiden för hans brutna sigill-sköld med 100 turer. \n\n_+3:_ När gladiatorn dödar en fiende med ett kombinationsdrag, _minskas nedkylningstiden för hans brutna sigill-sköld med 150 turer. \n\nSköldens nedkylningstid kan reduceras till så lågt som -150 turer med denna talang, vilket innebär att den omedelbart kommer att vara tillgänglig igen när den aktiveras.
actors.hero.talent.lethal_defense.title=dödligt försvar
actors.hero.talent.lethal_haste.desc=_+1:_ När duelisten träffar en fiende med en vapenförmåga får hon _3 varv_ av omedelbar rörelse.\n\n_+2:_ När duelisten träffar en fiende med en vapenförmåga får hon _5 varv_ av omedelbar rörelse.
actors.hero.talent.lethal_haste.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att utlösas med vanliga vapenattacker, med en nedkylningstid på 100 tur.
actors.hero.talent.lethal_haste.title=dödlig hast
actors.hero.talent.lethal_momentum.desc=_+1:_ När krigaren träffar en fiende med ett fysiskt vapen har den _67 % chans_ att ta 0 tur. \n\n_+2:_ När krigaren träffar en fiende med ett fysiskt vapen har den _100 % chans_ att ta 0 tur.
actors.hero.talent.lethal_momentum.title=dödlig momentum
actors.hero.talent.life_link.desc=Prästen kan skapa _Livslänk_ mellan sig själv och en bemyndigad allierad till kostnaden av 2 laddningar. Denna besvärjelse gör att skada delas mellan prästen och dennes allierade, och gör att fördelaktiga prästerbesvärjelser av nivå 3 eller lägre tillämpas på båda om endera påverkas.\n\n_+1:_ Livslänken varar i _10 turar_ och ökar Mångas Krafts bonus till _-35 % tagen skada._\n\n_+2:_ Livslänken varar i _13 turar_ och ökar Mångas Krafts bonus till _-40 % tagen skada._\n\n_+3:_ Livslänken varar i _17 turar_ och ökar Mångas Krafts bonus till _-45 % tagen skada._\n\n_+4:_ Livslänken varar i _20 turar_ och ökar Mångas Krafts bonus till _-50 % tagen skada._
actors.hero.talent.life_link.title=livslänk
actors.hero.talent.light_cloak.desc=_+1:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas med _25 % hastighet_ när den inte är utrustad.\n\n_+2:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas med _50 % hastighet_ när den inte är utrustad.\n\n_+3:_ Skurken kan använda sin skuggmantel när den inte är utrustad, men den laddas med _75 % hastighet_ när den inte är utrustad.
actors.hero.talent.light_cloak.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka laddningshastigheten för alla artefakter med 7/13/20% vid +1/+2/+3.
actors.hero.talent.light_cloak.title=lätt mantel
actors.hero.talent.light_reading.desc=_+1:_ Prästskapet kan använda sin heliga skrift när den inte är utrustad, men den laddas med _25 % hastighet_ när den inte är utrustad.\n\n_+2:_ Prästskapet kan använda sin heliga skrift när den inte är utrustad, men den laddas med _50 % hastighet_ när den inte är utrustad.\n\n_+3:_ Prästskapet kan använda sin heliga skrift när den inte är utrustad, men den laddas med _75 % hastighet_ när den inte är utrustad.
actors.hero.talent.light_reading.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka laddningshastigheten för alla trollstavar med 7/13/20% vid +1/+2/+3.
actors.hero.talent.light_reading.title=Lättläsning
actors.hero.talent.lingering_magic.desc=_+1:_ När magikern zappar med en trollstav eller stav, gör hans nästa fysiska attack _1-2 bonusskada_.\n\n_+2:_ När magikern zappar med en trollstav eller stav, gör hans nästa fysiska attack _2 bonusskada_.
actors.hero.talent.lingering_magic.title=kvarvarande magi
actors.hero.talent.liquid_agility.desc=_+1:_ När duellenten dricker eller kastar en trolldryck, brygd eller elixir har hen _3x undvikande förmåga_ och _3x noggrannhet_ på sin nästa närstridsattack inom 5 rundor.\n\n_+2:_ När duellenten dricker eller kastar en trolldryck, brygd eller elixir har hen _oändlig undvikande förmåga_ och _oändlig noggrannhet_ på sin nästa närstridsattack inom 5 rundor.\n\nDenna bonus varar i ytterligare en runda och attack när hen använder trolldrycker med styrka, erfarenhet eller alkemiföremål som måste tillverkas med dessa trolldrycker.\n\nFör alkemiföremål med högre outputkvantiteter (t.ex. vattenbrygd) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.liquid_agility.title=flytande smidighet
actors.hero.talent.liquid_nature.desc=_+1:_ När jägarinnan dricker eller kastar en trolldryck, brygd eller elixir, _upp till 4 gräsplattor_ spirar i det omgivande området, och intilliggande fiender förankras i _1 tur_.\n\n_+2:_ När jägarinnan dricker eller kastar en trolldryck, brygd eller elixir, _upp till 6 gräsplattor_ spirar i det omgivande området, och intilliggande fiender förankras i _2 turar_.\n\nMängden gräs och rotens varaktighet fördubblas när man använder trolldrycker med styrka, erfarenhet eller alkemiföremål som måste tillverkas med dessa trolldrycker.\n\nFör alkemiföremål med högre outputkvantiteter (t.ex. vattenbrygd) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.liquid_nature.title=flytande natur
actors.hero.talent.liquid_willpower.desc=_+1:_ Krigaren får _6,5 % av sin maximala HP i sköldning_ när han dricker eller kastar en trolldryck, brygd eller elixir.\n\n_+2:_ Krigaren får _10 % av sin maximala HP i sköldning_ när han dricker eller kastar en trolldryck, brygd eller elixir.\n\nSköldmängden fördubblas när man använder trolldrycker med styrka, erfarenhet eller alkemiföremål som måste tillverkas med dessa trolldrycker.\n\nFör alkemiföremål med högre outputmängder (t.ex. vattenbrygd) har denna talang en chans att utlösas baserat på hur många av det föremålet som produceras.
actors.hero.talent.liquid_willpower.title=flytande viljestyrka
actors.hero.talent.longrange_warp.desc=_+1:_ Magikern kan nu warp mellan våningar, till _150 % laddningskostnad_.\n\n_+2:_ Magikern kan nu warp mellan våningar, till _117 % laddningskostnad_.\n\n_+3:_ Magikern kan nu warp mellan våningar, till _83 % laddningskostnad_.\n\n_+4:_ Magikern kan nu warp mellan våningar, till _50 % laddningskostnad_.\n\nMagikern kan inte använda långdistanswarp för att lämna en låst våning.
actors.hero.talent.longrange_warp.title=Långdistansvarp
actors.hero.talent.mind_form.desc=Prästen kan använda _Sinnesform_, vilket ger Trinity kraften från en trollstav eller ett kastat vapen som prästen har använt under denna körning, till en kostnad av 3 laddningar.\n\n_+1:_ När Trinity används använder prästen zapp- eller kasteffekten för det valda föremålet, som om det vore _+3._\n\n_+2:_ När Trinity används använder prästen zapp- eller kasteffekten för det valda föremålet, som om det vore _+4._\n\n_+3:_ När Trinity används använder prästen zapp- eller kasteffekten för det valda föremålet, som om det vore _+5._\n\n_+4:_ När Trinity används använder prästen zapp- eller kasteffekten för det valda föremålet, som om det vore _+6._\n\nTrinity kan bara genomsyras av en tankeeffekt åt gången.
actors.hero.talent.mind_form.title=sinneform
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Prästen kan kasta _Mnemonisk bön,_ en besvärjelse som ger buffs/debuffs på en allierad/fiende i _3 turar_ till en kostnad av 1 laddning.\n\n_+2:_ Prästen kan kasta _Mnemonisk bön,_ en besvärjelse som ger buffs/debuffs på en allierad/fiende i _4 turar_ till en kostnad av 1 laddning.\n\n_+3:_ Prästen kan kasta _Mnemonisk bön,_ en besvärjelse som ger buffs/debuffs på en allierad/fiende i _5 turar_ till en kostnad av 1 laddning.\n\nMnemonisk bön tar ingen tid att kasta. Mnemonisk bön kan bara ge en viss instans av en buff/debuff en gång och kan inte ge buffs från rustningsförmågor.
actors.hero.talent.mnemonic_prayer.title=mnemonisk bön
actors.hero.talent.monastic_vigor.desc=_+1:_ Om munken har _100 % energi_ stärks hennes förmågor.\n\n_+2:_ Om munken har _80 % eller mer energi_ stärks hennes förmågor.\n\n_+3:_ Om munken har _60 % eller mer energi_ stärks hennes förmågor.\n\nNär den är stärkt:\n- Flurry tillämpar ditt vapens förtrollning\n- Fokus är omedelbart\n- Dash får +4 räckvidd\n- Dragon Kick gör +50 % skada och tillämpar sin knockback- och bedövningseffekt på alla angränsande fiender\n- Meditera läker långsamt 20 % av saknad HP och ger 80 % skademotstånd.
actors.hero.talent.monastic_vigor.title=klosterkraft
actors.hero.talent.mystical_charge.desc=_+1:_ Att slå med sin stav ger Battlemagikern _0,5 varv_ i artefaktladdning.\n\n_+2:_ Att slå med sin stav ger Battlemagikern _1 varv_ i artefaktladdning.\n\n_+3:_ Att slå med sin stav ger Battlemagikern _1,5 varv_ i artefaktladdning.
actors.hero.talent.mystical_charge.title=mystisk laddning
actors.hero.talent.mystical_meal.desc=_+1:_ Att äta mat tar Skurken 1-turen (förrådsransoner äts direkt) och ger honom _3 varv med att ladda artefakter_.\n\n_+2:_ Att äta mat tar Skurken 1-turen (förrådsransoner äts direkt) och ger honom _5 varv med att ladda artefakter_.\n\nDenna talang kan inte användas för att låta ymnighetshornet ladda om sig självt.
actors.hero.talent.mystical_meal.title=mystisk måltid
actors.hero.talent.natures_aid.desc=_+1:_ Jägaren får 0-2 rustningar av barkhud, som bleknar var _3:e tur_ när en växts effekt aktiveras i hennes syn.\n\n_+2:_ Jägaren får 0-2 rustningar av barkhud, som bleknar var _5:e tur_ när en växts effekt aktiveras i hennes syn.
actors.hero.talent.natures_aid.title=naturens hjälp
actors.hero.talent.natures_bounty.desc=_+1:_ Jägerskan kan hitta _4 bär_ gömda i högt gräs när hon utforskar de närmaste våningarna i fängelsehålan.\n\n_+2:_ Jägerskan kan hitta _6 bär_ gömda i högt gräs när hon utforskar de närmaste våningarna i fängelsehålan.\n\nBär äts snabbt, återställer en liten mängd mättnadskänsla och kan innehålla ett användbart frö.
actors.hero.talent.natures_bounty.title=naturens överflöd
actors.hero.talent.natures_wrath.desc=_+1:_ Medan naturens kraft är aktiv har skott från andebågen _8 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+2:_ Medan naturens kraft är aktiv har skott från andebågen _17 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+3:_ Medan naturens kraft är aktiv har skott från andebågen _25 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\n_+4:_ Medan naturens kraft är aktiv har skott från andebågen _33 % chans_ att utlösa en slumpmässig skadlig växteffekt.\n\nVäxterna som kan utlösas är: blindört, eldblomma, istäcke, sorgmossa och stormvin.
actors.hero.talent.natures_wrath.title=naturens vrede
actors.hero.talent.necromancers_minions.desc=_+1:_ När en själsmärkt fiende dör har Warlocken _13 % chans_ att uppväcka dem som en korrupt vålnad.\n\n_+2:_ När en själsmärkt fiende dör har Warlocken _27 % chans_ att uppväcka dem som en korrupt vålnad.\n\n_+3:_ När en själsmärkt fiende dör har Warlocken _40 % chans_ att uppväcka dem som en korrupt vålnad.
actors.hero.talent.necromancers_minions.title=nekromantikerns hantlangare
actors.hero.talent.patient_strike.desc=_+1:_ Om duellanten väntar innan hen utför en närstridsattack kommer hen att göra _1-2 bonusskada_.\n\n_+2:_ Om duellanten väntar innan hen utför en närstridsattack kommer hen att göra _2 bonusskada_.
actors.hero.talent.patient_strike.title=patientstrejk
actors.hero.talent.perfect_copy.desc=_+1:_ Skuggklonen får _10%_ av hjältens maximala HP och kan omedelbart byta plats med hjälten upp till _1 ruta_ bort.\n\n_+2:_ Skuggklonen får _20%_ av hjältens maximala HP och kan omedelbart byta plats med hjälten upp till _2 rutor_ bort.\n\n_+3:_ Skuggklonen får _30%_ av hjältens maximala HP och kan omedelbart byta plats med hjälten upp till _3 rutor_ bort.\n\n_+4:_ Skuggklonen får _40%_ av hjältens maximala HP och kan omedelbart byta plats med hjälten upp till _4 rutor_ bort.
actors.hero.talent.perfect_copy.title=perfekt kopia
actors.hero.talent.point_blank.desc=_+1:_ När jägarinnan använder sin båge eller ett kastat vapen på närstridshåll har den _-25 % noggrannhet,_ istället för -50%.\n\n_+2:_ När jägarinnan använder sin båge eller ett kastat vapen på närstridshåll har den _normal noggrannhet,_ istället för -50%.\n\n_+3:_ När jägarinnan använder sin båge eller ett kastat vapen på närstridshåll har den _+25 % noggrannhet,_ istället för -50%.\n\nObservera att kastade vapen eller andebågen alltid har +50 % noggrannhet när de används på avstånd.
actors.hero.talent.point_blank.title=punkt tom
actors.hero.talent.precise_assault.desc=_+1:_ När duellanten använder en vapenförmåga får hon _2x noggrannhet_ på sin nästa närstridsattack inom 5 rundor.\n\n_+2:_ När duellanten använder en vapenförmåga får hon _5x noggrannhet_ på sin nästa närstridsattack inom 5 rundor.\n\n_+3:_ När duellanten använder en vapenförmåga får hon _oändlig noggrannhet_ på sin nästa närstridsattack inom 5 rundor.
actors.hero.talent.precise_assault.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att öka närstridsnoggrannheten med 10 % vid +1, 20 % vid +2 eller 30 % vid +3.
actors.hero.talent.precise_assault.title=precist anfall
actors.hero.talent.projectile_momentum.desc=_+1:_ Under freerunning får Freerunnern _+50 % noggrannhet och +15 % skada_ med kastade vapen.\n\n_+2:_ Under freerunning får Freerunnern _+100 % noggrannhet och +30 % skada_ med kastade vapen.\n\n_+3:_ Under freerunning får Freerunnern _+150 % noggrannhet och +45 % skada_ med kastade vapen.
actors.hero.talent.projectile_momentum.title=projektilmomentum
actors.hero.talent.projecting_blades.desc=_+1:_ Spektralblad har _+25 % noggrannhet_ och kan penetrera upp till _2 solida plattor_.\n\n_+2:_ Spektralblad har _+50 % noggrannhet_ och kan penetrera upp till _4 solida plattor_.\n\n_+3:_ Spektralblad har _+75 % noggrannhet_ och kan penetrera upp till _6 solida plattor_.\n\n_+4:_ Spektralblad har _+100 % noggrannhet_ och kan penetrera upp till _8 solida plattor_.
actors.hero.talent.projecting_blades.title=utskjutande blad
actors.hero.talent.protective_shadows.desc=_+1:_ Skurken får en sköld _varannan tur_ han är osynlig, _upp till max 3_. \n\n_+2:_ Skurken får en sköld _varje tur_ han är osynlig, _upp till max 5_.
actors.hero.talent.protective_shadows.title=skyddande skuggor
actors.hero.talent.provoked_anger.desc=_+1:_ När någon sköldförstärkning som riktas mot krigaren bryts av skada, kommer hans nästa fysiska attack att ge _3 bonusskada_.\n\n_+2:_ När någon sköldförstärkning som riktas mot krigaren bryts av skada, kommer hans nästa fysiska attack att ge _5 bonusskada_.
actors.hero.talent.provoked_anger.title=framkallad ilska
actors.hero.talent.ratforcements.desc=_+1:_ Använda ratmogrify på dig själv _skapar 1_ ally pungdjursråtta bredvid dig.\n\n_+2:_ Använda ratmogrify på dig själv _skapar 2_ ally pungdjursråttor bredvid dig.\n\n_+3:_ Använda ratmogrify på dig själv _skapar 3_ ally pungdjursråttor bredvid dig.\n\n_+4:_ Använda ratmogrify på dig själv _skapar 4_ ally pungdjursråttor bredvid dig.
actors.hero.talent.ratforcements.title=råttstyrkor
actors.hero.talent.ratlomacy.desc=_+1:_ Att använda ratmogrify på en ratmogrifierad fiende gör dem vänliga och gör transformationen permanent.\n\n_+2:_ Att använda ratmogrify på en ratmogrifierad fiende gör dem vänliga, gör transformationen permanent och ger dem _2 varv_ adrenalin.\n\n_+3:_ Att använda ratmogrify på en ratmogrifierad fiende gör dem vänliga, gör transformationen permanent och ger dem _4 varv_ adrenalin.\n\n_+4:_ Att använda ratmogrify på en ratmogrifierad fiende gör dem vänliga, gör transformationen permanent och ger dem _6 varv_ adrenalin.
actors.hero.talent.ratlomacy.title=råttlomation
actors.hero.talent.ratsistance.desc=_+1:_ Fientliga råttmogrifierade fiender ger _-10 % skada_.\n\n_+2:_ Fientliga råttmogrifierade fiender ger _-19 % skada_.\n\n_+3:_ Fientliga råttmogrifierade fiender ger _-27 % skada_.\n\n_+4:_ Fientliga råttmogrifierade fiender ger _-35 % skada_.
actors.hero.talent.ratsistance.title=råttmotstånd
actors.hero.talent.reactive_barrier.desc=_+1:_ Magikern får _2,5 sköldar_ för varje karaktär som påverkas av elementär explosion, upp till max 5 tecken.\n\n_+2:_ Magikern får _5 sköldar_ för varje karaktär som påverkas av elementär explosion, upp till max 6 tecken.\n\n_+3:_ Magikern får _7,5 sköldar_ för varje karaktär som påverkas av elementär explosion, upp till max 7 tecken.\n\n_+4:_ Magikern får _10 sköldar_ för varje karaktär som påverkas av elementär explosion, upp till max 8 tecken.
actors.hero.talent.reactive_barrier.title=reaktiv barriär
actors.hero.talent.recall_inscription.desc=_+1:_ Prästskapet kan kasta _Återkallelseinskriptionen,_ en besvärjelse som låter dem upprepa effekten av den senaste runstenen eller skriftrullen de använde inom _10 omgångar._\n\n_+2:_ Prästskapet kan kasta _Återkallelseinskriptionen,_ en besvärjelse som låter dem upprepa effekten av den senaste runstenen eller skriftrullen de använde inom _300 omgångar._\n\nÅterkallelseinskriptionen kan inte användas med uppgraderingsskriftrullar. Denna besvärjelses laddningskostnad varierar beroende på vilket föremål som användes nyligen: 2 för en runsten, 3 för en skriftrulle, 4 för en exotisk skriftrulle. Denna laddningskostnad fördubblas också när den används med en transmutationsskriftrulle eller alkemiföremål som måste tillverkas med transmutation eller uppgradering.
actors.hero.talent.recall_inscription.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att återbetala vilken skriftrulle eller runsten som helst 10% av gångerna vid +1 eller 15% av gångerna vid +2. Uppgraderingsskriftrullar är undantagna från denna effekt.
actors.hero.talent.recall_inscription.refunded=Din vara har återbetalats!
actors.hero.talent.recall_inscription.title=återkallelseinskription
actors.hero.talent.rejuvenating_steps.desc=_+1:_ När jägarinnan trampar på kort gräs eller glöd, hoppar de upp till högt gräs som jägarinnan omedelbart fårar. Detta har en _10 turers nedkylning_.\n\n_+2:_ När jägarinnan trampar på kort gräs eller glöd, hoppar de upp till högt gräs som jägarinnan omedelbart fårar. Detta har en _5 turers nedkylning_.\n\nDenna talang kommer att producera fårat gräs om passiva regenereringseffekter är inaktiverade eller om hjälten inte har fått erfarenhet på länge.
actors.hero.talent.rejuvenating_steps.title=föryngrande steg
actors.hero.talent.remote_beacon.desc=_+1:_ Magikern kan placera en fyr på vilken plats som helst inom _4 rutor_.\n\n_+2:_ Magikern kan placera en fyr på vilken plats som helst inom _8 rutor_.\n\n_+3:_ Magikern kan placera en fyr på vilken plats som helst inom _12 rutor_.\n\n_+4:_ Magikern kan placera en fyr på vilken plats som helst inom _16 rutor_.\n\nMagikern kan inte placera fyrar på platser som är oåtkomliga.
actors.hero.talent.remote_beacon.title=Fjärrstyrd beacon
actors.hero.talent.rogues_foresight.desc=_+1:_ När skurken är på en nivå med ett hemligt rum har han _75 % chans att märka_ att nivån innehåller en hemlighet. \n\n_+2:_ När skurken är på en nivå med ett hemligt rum har han _100 % chans att märka_ att nivån innehåller en hemlighet.
actors.hero.talent.rogues_foresight.title=skurkens framsynthet
actors.hero.talent.runic_transference.desc=_+1:_ Krigarens brutna sigill kan överföra _vanliga glyfer_ på samma sätt som den överför en uppgradering.\n\n_+2:_ Krigarens brutna sigill kan överföra _vanliga, kraftfulla och förbannelseglyfer_ på samma sätt som den överför en uppgradering.\n\nSigillet kan bara överföra glyfer om de applicerades på rustningen när sigillet fästes.
actors.hero.talent.runic_transference.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer det istället att hjälpa tecken på din rustning att motstå borttagning av uppgraderingsrullar. Tecken kommer att börja gå förlorade när du uppgraderar från nivå 6 (upp från 4) vid +1, eller nivå 7 (upp från 4) vid +2. Nivån där tecken garanteras att gå förlorade är oförändrad vid +8.
actors.hero.talent.runic_transference.title=runöverföring
actors.hero.talent.satiated_spells.desc=_+1:_ Att äta mat gör att prästen får _3 sköld_ nästa gång de kastar en besvärjelse.\n\n_+2:_ Att äta mat gör att prästen får _5 sköld_ nästa gång de kastar en besvärjelse.
actors.hero.talent.satiated_spells.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge sköld omedelbart, vilken börjar avta normalt efter 10 rundor.
actors.hero.talent.satiated_spells.title=Mättade trollformler
actors.hero.talent.scholars_intuition.desc=_+1:_ Magikern identifierar trollstavar _3 gånger snabbare_.\n\n_+2:_ Magikern identifierar trollstavar _när han använder dem_.
actors.hero.talent.scholars_intuition.title=forskarens intuition
actors.hero.talent.searing_light.desc=_+1:_ Prästmannens fysiska attacker mot fiender upplysta av _Vägledande Ljus_ ger _+3 skada._\n\n_+2:_ Prästmannens fysiska attacker mot fiender upplysta av _Vägledande Ljus_ ger _+5 skada._
actors.hero.talent.searing_light.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att ge sin bonusskada efter att en trollstav eller artefakt har använts mot en fiende, med en nedkylningstid på 20 rundor.
actors.hero.talent.searing_light.title=Brännande ljus
actors.hero.talent.seer_shot.desc=_+1:_ När Jägaren skjuter en pil mot marken ger den sikt i ett 3x3-område runt den i _5 rundor_. Detta har en nedkylningstid på 20 rundor.\n\n_+2:_ När Jägaren skjuter en pil mot marken ger den sikt i ett 3x3-område runt den i _10 rundor_. Detta har en nedkylningstid på 20 rundor.\n\n_+3:_ När Jägaren skjuter en pil mot marken ger den sikt i ett 3x3-område runt den i _15 rundor_. Detta har en nedkylningstid på 20 rundor.
actors.hero.talent.seer_shot.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den att utlösas från vilket kastat vapen som helst.
actors.hero.talent.seer_shot.title=siare skott
actors.hero.talent.shadow_blade.desc=_+1:_ Skuggklonen får _8%_ av hjältens skada per tur och har _25% chans_ att använda förtrollningen på hjältens vapen.\n\n_+2:_ Skuggklonen får _16%_ av hjältens skada per tur och har _50% chans_ att använda förtrollningen på hjältens vapen.\n\n_+3:_ Skuggklonen får _24%_ av hjältens skada per tur och har _75% chans_ att använda förtrollningen på hjältens vapen.\n\n_+4:_ Skuggklonen får _32%_ av hjältens skada per tur och har _100% chans_ att använda förtrollningen på hjältens vapen.
actors.hero.talent.shadow_blade.title=skuggblad
actors.hero.talent.shadow_step.desc=_+1:_ Om skurken använder rökbomb medan han är osynlig, inträffar det omedelbart och har en _16 % reducerad_ laddningskostnad, men det förblindar inte heller fiender eller utlöser andra talanger.\n\n_+2:_ Om skurken använder rökbomb medan han är osynlig, inträffar det omedelbart och har en _30 % reducerad_ laddningskostnad, men det förblindar inte heller fiender eller utlöser andra talanger.\n\n_+3:_ Om skurken använder rökbomb medan han är osynlig, inträffar det omedelbart och har en _41 % reducerad_ laddningskostnad, men det förblindar inte heller fiender eller utlöser andra talanger.\n\n_+4:_ Om skurken använder rökbomb medan han är osynlig, inträffar det omedelbart och har en _50 % reducerad_ laddningskostnad, men det förblindar inte heller fiender eller utlöser andra talanger.
actors.hero.talent.shadow_step.title=skuggsteg
actors.hero.talent.shared_enchantment.desc=_+1:_ Kastade vapen har _33% chans_ att använda förtrollningen på krypskyttens båge.\n\n_+2:_ Kastade vapen har _67% chans_ att använda förtrollningen på krypskyttens båge.\n\n_+3:_ Kastade vapen har _100% chans_ att använda förtrollningen på krypskyttens båge.\n\nBågens förtrollning kan utlösas utöver den förtrollning som det kastade vapnet redan har.
actors.hero.talent.shared_enchantment.title=delad förtrollning
actors.hero.talent.shared_upgrades.desc=_+1:_ När krypskytten attackerar med ett uppgraderat kastat vapen, ökar varje nivå varaktigheten av krypskyttens märke med 1 tur och skadan av hennes specialattack med 16%, till max _2 tur och +33% skada vid +2_.\n\n_+2:_ När krypskytten attackerar med ett uppgraderat kastat vapen, ökar varje nivå varaktigheten av krypskyttens märke med 1 tur och skadan av hennes specialattack med 16%, till max _4 tur och +67% skada vid +4_.\n\n_+3:_ När krypskytten attackerar med ett uppgraderat kastat vapen, ökar varje nivå varaktigheten av krypskyttens märke med 1 tur och skadan av hennes specialattack med 16%, till max _6 tur och +100% skada vid +6_.
actors.hero.talent.shared_upgrades.title=delade uppgraderingar
actors.hero.talent.shield_battery.desc=_+1:_ Magikern kan rikta in sig själv med en trollstav för att omvandla alla sina laddningar till avskärmning med en hastighet av _4 % max HP per laddning_.\n\n_+2:_ Magikern kan rikta in sig själv med en trollstav för att omvandla alla sina laddningar till avskärmning med en hastighet av _6 % max HP per laddning_.
actors.hero.talent.shield_battery.title=sköldbatteri
actors.hero.talent.shield_of_light.desc=_+1:_ Prästmannen kan kasta _Ljusets sköld,_ en besvärjelse som kastas omedelbart och ger dem _2–4 rustningar_ mot ett mål i 5 omgångar till kostnaden för 1 laddning.\n\n_+2:_ Prästmannen kan kasta _Ljusets sköld,_ en besvärjelse som kastas omedelbart och ger dem _3–6 rustningar_ mot ett mål i 5 omgångar till kostnaden för 1 laddning.
actors.hero.talent.shield_of_light.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att minska fysisk skada från din riktade fiende med 1, 33% av tiden vid +1 eller 50% av tiden vid +2.
actors.hero.talent.shield_of_light.title=sköld av ljus
actors.hero.talent.shielding_dew.desc=_+1:_ Daggdroppar kan skydda fångvaktaren när hennes hälsa är full, upp till _20 % av hennes maximala HP_.\n\n_+2:_ Daggdroppar kan skydda fångvaktaren när hennes hälsa är full, upp till _40 % av hennes maximala HP_.\n\n_+3:_ Daggdroppar kan skydda fångvaktaren när hennes hälsa är full, upp till _60 % av hennes maximala HP_.
actors.hero.talent.shielding_dew.title=skyddande dagg
actors.hero.talent.shock_force.desc=_+1:_ Stötvåg gör _20 % mer skada_ och har _25 % chans_ att bedöva istället för att lamslå.\n\n_+2:_ Stötvåg gör _40 % mer skada_ och har _50 % chans_ att bedöva istället för att lamslå.\n\n_+3:_ Stötvåg gör _60 % mer skada_ och har _75 % chans_ att bedöva istället för att lamslå.\n\n_+4:_ Stötvåg gör _80 % mer skada_ och har _100 % chans_ att bedöva istället för att lamslå.
actors.hero.talent.shock_force.title=chockkraft
actors.hero.talent.shrug_it_off.desc=_+1:_ Krigarens skadereduktion under uthållighet _ökas till 60%_, från 50%.\n\n_+2:_ Krigarens skadereduktion under uthållighet _ökas till 68%_, från 50%.\n\n_+3:_ Krigarens skadereduktion under uthållighet _ökas till 74%_, från 50%.\n\n_+4:_ Krigarens skadereduktion under uthållighet _ökas till 80%_, från 50%.
actors.hero.talent.shrug_it_off.title=axlarna åt sidan
actors.hero.talent.silent_steps.desc=_+1:_ Skurken väcker inte sovande fiender när han _är _3 eller fler brickor ifrån dem_.\n\n_+2:_ Skurken väcker inte sovande fiender när han _inte är intill dem_.
actors.hero.talent.silent_steps.title=tysta steg
actors.hero.talent.soul_eater.desc=_+1:_ Själsmärket ger _0,33 varv_ mättnadskänsla för varje utdelad fysisk skada. Själsmarkerade fiender har _10 % chans_ att utlösa ät-effekter när de dör.\n\n_+2:_ Själsmärket ger _0,67 varv_ mättnadskänsla för varje utdelad fysisk skada. Själsmarkerade fiender har _20 % chans_ att utlösa ät-effekter när de dör.\n\n_+3:_ Själsmärket ger _1 varv_ mättnadskänsla för varje utdelad fysisk skada. Själsmarkerade fiender har _30 % chans_ att utlösa ät-effekter när de dör.
actors.hero.talent.soul_eater.title=själsätare
actors.hero.talent.soul_siphon.desc=_+1:_ Fysisk skada utförd av andra karaktärer utlöser Warlockens själsmärke vid _13 % effektivitet_.\n\n_+2:_ Fysisk skada utförd av andra karaktärer utlöser Warlockens själsmärke vid _27 % effektivitet_.\n\n_+3:_ Fysisk skada utförd av andra karaktärer utlöser Warlockens själsmärke vid _40 % effektivitet_.
actors.hero.talent.soul_siphon.title=själssifon
actors.hero.talent.speedy_stealth.desc=_+1:_ Freerunnern får 2 högar momentum per tur medan hen är osynlig.\n\n_+2:_ Förutom fördelarna med +1 räknas inte längre freerunning ner medan Freerunnern är osynlig.\n\n_+3:_ Förutom fördelarna med +1 och +2 rör sig Freerunnern med 2x hastighet medan hen är osynlig, oavsett om hen freerunnar eller inte.
actors.hero.talent.speedy_stealth.title=snabb smyg
actors.hero.talent.spirit_blades.desc=_+1:_ Spektralblad har _30% chans_ att även använda förtrollningen på andebågen.\n\n_+2:_ Spektralblad har _60% chans_ att även använda förtrollningen på andebågen.\n\n_+3:_ Spektralblad har _90% chans_ att även använda förtrollningen på andebågen.\n\n_+4:_ Spektralblad har _100% chans_ att även använda förtrollningen på andebågen, och det ger varje förtrollning _+10% kraft_.
actors.hero.talent.spirit_blades.title=spritblad
actors.hero.talent.spirit_form.desc=Prästen kan använda _Andeform_, vilket ger Trinity kraften av en ring eller artefakt som prästen har identifierat under denna period (förutom den heliga boken), till en kostnad av 4 laddningar.\n\n_+1:_ När Trinity används får prästen en ringeffekt vid _+1_ i 20 omgångar, eller utlöser en artefakteffekt vid _+4._\n\n_+2:_ När Trinity används får prästen en ringeffekt vid _+2_ i 20 omgångar, eller utlöser en artefakteffekt vid _+6._\n\n_+3:_ När Trinity används får prästen en ringeffekt vid _+3_ i 20 omgångar, eller utlöser en artefakteffekt vid _+8._\n\n_+4:_ När Trinity används får prästen en ringeffekt vid _+4_ i 20 turer, eller utlöser en artefakteffekt vid _+10._\n\nTrinity kan bara genomsyras av en andeeffekt åt gången. Artefakter har varierande effekter och rustningsladdningskostnader när de utlöses av Trinity.
actors.hero.talent.spirit_form.title=andeform
actors.hero.talent.stasis.desc=Prästen kan kasta _Stasis_ på en bemyndigad allierad för kostnaden av 2 laddningar. Stasis tar tillfälligt bort allierade från fängelsehålan och bevarar den återstående tiden på alla buffs, inklusive Mångas Kraft. Allierade kommer att dyka upp igen bredvid dig när effekten slutar. Stasis kan kastas om direkt och utan kostnad för att avsluta effekten i förtid. Stas fungerar på orörliga allierade, men kan inte flytta dem mellan fängelsehålsvåningar.\n\n_+1:_ Stas varar i max _60 tur._\n\n_+2:_ Stas varar i max _90 tur._\n\n_+3:_ Stas varar i max _120 tur._\n\n_+4:_ Stas varar i max _150 tur._\n\nKläraren kan också kasta Strålande Stråle när en allierad är i stas för att återkalla dem, eller kasta Livslänk för att förebyggande tillämpa dess effekt. Allierade drar dock inte nytta av Livslänk medan de är i stas.
actors.hero.talent.stasis.title=stasis
actors.hero.talent.strengthening_meal.desc=_+1:_ Att äta mat ger duelisten 3 bonusskada de nästa _2 gånger_ hon träffar en fiende med en fysisk attack.\n\n_+2:_ Att äta mat ger duelisten 3 bonusskada de nästa _3 gånger_ hon träffar en fiende med en fysisk attack.
actors.hero.talent.strengthening_meal.title=stärkande måltid
actors.hero.talent.striking_force.desc=_+1:_ Effekten av elementslaget ökar med _30%_.\n\n_+2:_ Effekten av elementslaget ökar med _60%_.\n\n_+3:_ Effekten av elementslaget ökar med _90%_.\n\n_+4:_ Effekten av elementslaget ökar med _120%_.
actors.hero.talent.striking_force.title=slagkraft
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave har _30% chans_ att även använda träffsäkra effekter som förtrollningar och kombinationer.\n\n_+2:_ Shockwave har _60% chans_ att även använda träffsäkra effekter som förtrollningar och kombinationer.\n\n_+3:_ Shockwave har _90% chans_ att även använda träffsäkra effekter som förtrollningar och kombinationer.\n\n_+4:_ Shockwave har _100% chans_ att även använda träffsäkra effekter som förtrollningar och kombinationer, och den ger förtrollningar _+20% kraft_.
actors.hero.talent.striking_wave.title=slående våg
actors.hero.talent.strongman.desc=_+1:_ Krigarens styrka _ökas med 8%_, avrundat nedåt.\n\n_+2:_ Krigarens styrka _ökas med 13%_, avrundat nedåt.\n\n_+3:_ Krigarens styrka _ökas med 18%_, avrundat nedåt.
actors.hero.talent.strongman.title=starkman
actors.hero.talent.sucker_punch.desc=_+1:_ Skurken gör _1-2 bonusskada_ första gången han överraskningsattackerar en fiende.\n\n_+2:_ Skurken gör _2 bonusskada_ första gången han överraskningsattackerar en fiende.
actors.hero.talent.sucker_punch.title=sugpunch
actors.hero.talent.sunray.desc=_+1:_ Prästskapet kan kasta _Solstråle,_ en besvärjelse som gör _4–8 skada_ och förblindar målet i _4 omgångar,_ till kostnaden för 1 laddning.\n\n_+2:_ Prästskapet kan kasta _Solstråle,_ en besvärjelse som gör _6–12 skada_ och förblindar målet i _6 omgångar,_ till kostnaden för 1 laddning.\n\nSolstrålen kan bara förblindas varje mål en gång, men om målet redan är förblindat av Solstrålen förlamas det istället. Solstrålen gör alltid maximal skada på demoniska och odöda fiender.
actors.hero.talent.sunray.meta_desc=_Om denna talang förvärvas av en annan hjälte_ kommer den istället att orsaka att trollstavar och artefakter förblindar fiender i 4 omgångar, 15 % av tiden vid +1 eller 25 % av tiden vid +2.
actors.hero.talent.sunray.title=solstråle
actors.hero.talent.survivalists_intuition.desc=_+1:_ Jägaren identifierar kastade vapen _3x snabbare_.\n\n_+2:_ Jägaren identifierar kastade vapen _när hon träffar med dem_.
actors.hero.talent.survivalists_intuition.title=överlevnadsintuition
actors.hero.talent.sustained_retribution.desc=_+1:_ Krigaren gör _115 % bonusskada_ fördelad över _2 träffar_, istället för 100 % bonusskada i 1 träff.\n\n_+2:_ Krigaren gör _130 % bonusskada_ fördelad över _3 träffar_, istället för 100 % bonusskada i 1 träff.\n\n_+3:_ Krigaren gör _145 % bonusskada_ fördelad över _4 träffar_, istället för 100 % bonusskada i 1 träff.\n\n_+4:_ Krigaren gör _160 % bonusskada_ fördelad över _5 träffar_, istället för 100 % bonusskada i 1 träff.
actors.hero.talent.sustained_retribution.title=ihållande vedergällning
actors.hero.talent.swift_equip.desc=_+1:_ Duelisten kan byta sitt utrustade vapen direkt _en gång_ var 20:e tur.\n\n_+2:_ Duelisten kan byta sitt utrustade vapen direkt _två gånger_ var 20:e tur.\n\nOm Duelisten har denna talang och den inte är i nedkylningsfas, kommer snabbanvändning av ett outrustat vapen att utrusta den.
actors.hero.talent.swift_equip.title=snabb utrustning
actors.hero.talent.swift_spirit.desc=_+1:_ Andehökens rörelsehastighet ökas till _2,5 rutor_ från 2, och den garanteras undvika de första _2 attackerna_ som görs mot den.\n\n_+2:_ Andehökens rörelsehastighet ökas till _3 rutor_ från 2, och den garanteras undvika de första _4 attackerna_ som görs mot den.\n\n_+3:_ Andehökens rörelsehastighet ökas till _3,5 rutor_ från 2, och den garanteras undvika de första _6 attackerna_ som görs mot den.\n\n_+4:_ Andehökens rörelsehastighet ökas till _4 rutor_ från 2, och den garanteras undvika de första _8 attackerna_ som görs mot den.
actors.hero.talent.swift_spirit.title=snabb ande
actors.hero.talent.telefrag.desc=_+1:_ Om magikern warpar in i en annan karaktär gör han _10-15 skada_ på den, men tar också _5 skada_.\n\n_+2:_ Om magikern warpar in i en annan karaktär gör han _20-30 skada_ på den, men tar också _10 skada_.\n\n_+3:_ Om magikern warpar in i en annan karaktär gör han _30-45 skada_ på den, men tar också _15 skada_.\n\n_+4:_ Om magikern warpar in i en annan karaktär gör han _40-60 skada_ på den, men tar också _20 skada_.\n\nHjälten kan inte dödas av denna talang, självskadan kan minskas genom magiska motståndseffekter.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Skurken identifierar ringar _2x snabbare_ och identifierar typen av ring _när han utrustar den_. \n\n_+2:_ Skurken identifierar ringar _när han utrustar dem_ och identifierar typen av ring _när han plockar upp den_.
actors.hero.talent.thiefs_intuition.title=tjuvens intuition
actors.hero.talent.twin_upgrades.desc=_+1:_ Om ett av Mästarens två utrustade vapen har en lägre nivå och är _2 eller fler nivåer lägre_ än det andra vapnet, kommer det att boostas till det andra vapnets nivå.\n\n_+2:_ Om ett av Mästarens två utrustade vapen har en lägre nivå och är _1 eller fler nivåer lägre_ än det andra vapnet, kommer det att boostas till det andra vapnets nivå.\n\n_+3:_ Om ett av Mästarens två utrustade vapen har en lägre nivå och är _samma nivå eller lägre_ än det andra vapnet, kommer det att boostas till det andra vapnets nivå.
actors.hero.talent.twin_upgrades.title=dubbla uppgraderingar
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Munken får _50 % mer energi_ för varje utrustningsdel _nivå 3 eller lägre_ hon använder.\n\n_+2:_ Munken får _75 % mer energi_ för varje utrustningsdel _nivå 2 eller lägre_ hon använder. Fördelen på nivå 3 är oförändrad.\n\n_+3:_ Munken får _100 % mer energi_ för varje utrustningsdel _nivå 1 eller lägre_ hon använder. Fördelarna på nivå 2 och 3 är oförändrade. Hon får också en gratis tygrustning och dubbade handskar.\n\nObservera att denna talang inte ger någon fördel av att vara obeväpnad eller attackera med en Kraftring.
actors.hero.talent.unencumbered_spirit.title=obehindrad ande
actors.hero.talent.varied_charge.desc=_+1:_ Mästaren återfår omedelbart _0,17 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsgräns.\n\n_+2:_ Mästaren återfår omedelbart _0,33 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsgräns.\n\n_+3:_ Mästaren återfår omedelbart _0,5 vapenladdningar_ när hon använder två olika vapenförmågor, utan tidsgräns.
actors.hero.talent.varied_charge.title=varierad laddning
actors.hero.talent.veterans_intuition.desc=_+1:_ Krigaren identifierar vapen _1,75 gånger snabbare_ och rustning _2,5 gånger snabbare_.\n\n_+2:_ Krigaren identifierar vapen _2,5 gånger snabbare_ och rustning _när han utrustar den_.
actors.hero.talent.veterans_intuition.title=veteranens intuition
actors.hero.talent.wall_of_light.desc=_+1:_ Paladinen kan kasta _Ljusväggen,_ en besvärjelse som skapar en _3 rutor bred_ solid vägg framför Paladinen som stöter bort fiender och varar i 20 omgångar, till en kostnad av 3 laddningar.\n\n_+2:_ Paladinen kan kasta _Ljusväggen,_ en besvärjelse som skapar en _5 rutor bred_ solid vägg framför Paladinen som stöter bort fiender och varar i 20 omgångar, till en kostnad av 3 laddningar.\n\n_+3:_ Paladinen kan kasta _Ljusväggen,_ en besvärjelse som skapar en _7 rutor bred_ solid vägg framför Paladinen som stöter bort fiender och varar i 20 omgångar, till en kostnad av 3 laddningar.\n\nMuren kan placeras kardinalt eller diagonalt, endast en vägg kan existera åt gången.
actors.hero.talent.wall_of_light.title=vägg av ljus
actors.hero.talent.wand_preservation.desc=_+1:_ När magikern sätter in en ny trollstav i sin stav, återlämnas den gamla trollstaven vid +0, _men detta kan bara göras en gång._\n\n_+2:_ När magikern sätter in en ny trollstav i sin stav, återlämnas den gamla trollstaven vid +0, _detta kan upprepas med en nedkylningstid på en hjältenivå._
actors.hero.talent.wand_preservation.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka mängden arcane harts som erhålls när man placerar en trollstav i en alkemikruka med 1 vid +1, eller med 2 vid +2.
actors.hero.talent.wand_preservation.title=trollstavsbevarande
actors.hero.talent.weapon_recharging.desc=_+1:_ Duelisten får en vapenladdning var _15:e tur_ när hen är påverkad av förstärkningar för trollstav eller artefakt.\n\n_+2:_ Duelisten får en vapenladdning var _10:e tur_ när hen är påverkad av förstärkningar för trollstav eller artefakt.
actors.hero.talent.weapon_recharging.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer det istället att orsaka +5% närstridsskada vid återladdning vid +1, eller +7,5% närstridsskada vid återladdning vid +2.
actors.hero.talent.weapon_recharging.title=vapenladdning
actors.hero.talent.wide_search.desc=_+1:_ Rogues sökradie ökas från en 5x5 kvadrat till en _7x7 cirkel_.\n\n_+2:_ Rogues sökradie ökas från en 5x5 kvadrat till en _7x7 kvadrat_.
actors.hero.talent.wide_search.meta_desc=_Om denna talang erhålls av en annan hjälte_ kommer den istället att öka deras sökradie från en 3x3-ruta till en 5x5-cirkel vid +1, eller en 5x5-ruta vid +2.
actors.hero.talent.wide_search.title=bred sökning
actors.hero.talent.wild_momentum.desc=_+1:_ Att döda en fiende med andebågen förlänger naturens krafts varaktighet med _1 tur_. Varaktigheten kan förlängas med maximalt _2 tur_.\n\n_+2:_ Att döda en fiende med andebågen förlänger naturens krafts varaktighet med _2 tur_. Varaktigheten kan förlängas med maximalt _4 tur_.\n\n_+3:_ Att döda en fiende med andebågen förlänger naturens krafts varaktighet med _3 tur_. Varaktigheten kan förlängas med maximalt _6 tur_.\n\n_+4:_ Att döda en fiende med andebågen förlänger naturens krafts varaktighet med _4 tur_. Varaktigheten kan förlängas med maximalt _8 tur_.
actors.hero.talent.wild_momentum.title=vild fart
actors.hero.talent.wild_power.desc=_+1:_ När vild magi används förstärks trollstavar med antingen _2 eller 3, upp till +4_.\n\n_+2:_ När vild magi används förstärks trollstavar med _3, upp till +5_.\n\n_+3:_ När vild magi används förstärks trollstavar med antingen _3 eller 4, upp till +6_.\n\n_+4:_ När vild magi används förstärks trollstavar med _4, upp till +7_.
actors.hero.talent.wild_power.title=vild kraft
actors.mobs.acidic.desc=Dessa enorma, spindelliknande, demoniska varelser undviker närstrid och föredrar att avfyra förlamande, tandade spikar från långa avstånd. Den här verkar drypa av frätande slem.
actors.mobs.acidic.name=sur skorpion
actors.mobs.albino.desc=Detta är en sällsynt ras av pungråtta, med ren vit päls och taggiga tänder.
actors.mobs.albino.discover_hint=Du kan sällan hitta den här fienden i en specifik region av fängelsehålan.
actors.mobs.albino.name=albino råtta
actors.mobs.armoredbrute.desc=De mest seniora gnoll-brutarna bär ofta kraftfulla rustningar för att visa sin status. Rustningen gör dessa brutar mycket mer motståndskraftiga mot fysisk skada, och deras större disciplin innebär att de kan rasa mycket längre innan de dukar under för sina sår.
actors.mobs.armoredbrute.name=bepansrad brutal
actors.mobs.armoredstatue.desc=Man skulle kunna tro att det bara är ytterligare en av den här fängelsehålans livlösa statyer, men dess röda glödande ögon avslöjar den. \n\n Den verkar vara i bra skick, på grund av rustningen den bär, den kan vara väldigt svår att döda.
actors.mobs.armoredstatue.desc_arm_wep=Även om själva statyn är gjord av sten, ser _%1$s_ och _%2$s_ som den bär riktiga ut.
actors.mobs.armoredstatue.name=bepansrad staty
actors.mobs.bandit.desc=Djupare nivåer i fängelsehålan har alltid varit ett gömställe för alla möjliga typer av brottslingar. Inte alla kunde hålla ett klart sinne under sina längre perioder så långt från dagsljus. För länge sedan har dessa galna tjuvar och banditer glömt vilka de är och varför de stjäl.
actors.mobs.bandit.name=galen bandit
actors.mobs.bat.desc=Dessa pigga och ihärdiga grottbefolkningar är mycket farligare än de verkar. De fyller på sin hälsa med varje lyckad attack, vilket gör att de kan besegra mycket större motståndare.
actors.mobs.bat.name=vampyrfladdermus
actors.mobs.bee.desc=Trots sin lilla storlek tenderar guldbin att skydda sitt hem hårt. Den här är väldigt arg, det är bäst att hålla avstånd.
actors.mobs.bee.desc_honey=Trots sin lilla storlek tenderar guldbin att skydda sitt hem hårt. Den här har blivit blidkad och verkar vilja följa dig.
actors.mobs.bee.discover_hint=Du kan hitta den här karaktären med ett specifikt föremål.
actors.mobs.bee.name=gyllene bi
actors.mobs.brute$bruterage.desc=Denna gnoll-odjur dör, men vill ta dig med sig!\n\nOdjuret kommer att dö när dess sköld slits ut, antingen på grund av tid eller om det skadas. Under tiden kommer det att göra enormt mycket skada, så se upp!\n\nÅterstående sköld: %d.
actors.mobs.brute$bruterage.name=brutalt raseri
actors.mobs.brute.def_verb=blockerad
actors.mobs.brute.desc=Bjässarna är de största, starkaste och tåligaste av alla gnoller. När de blir svårt sårade går de bärsärkagång och tillfogar sina fiender ännu mer skada.
actors.mobs.brute.enraged=rasande
actors.mobs.brute.name=gnollbjässe
actors.mobs.causticslime.desc=Detta slem verkar ha befläckats av den mörka magin som utgår underifrån. Det har förlorat sin vanliga gröna färg och droppar av frätande slem.
actors.mobs.causticslime.discover_hint=Du kan sällan hitta den här fienden i en specifik region av fängelsehålan.
actors.mobs.causticslime.name=kaustiskt slem
actors.mobs.crab.desc=Dessa enorma krabbor befinner sig högst upp i näringskedjan i avloppen. De är extremt snabba och deras tjocka ryggsköld tål hårda slag.
actors.mobs.crab.name=avloppskrabba
actors.mobs.crystalguardian.def_verb=blockerad
actors.mobs.crystalguardian.desc=Dessa stora kristallina väktare ser nästan ut som statyer, om det inte vore för deras starkt glödande ögon. Den härdade kristallen de är gjorda av gör dem tröga men väldigt tuffa, så _det är bäst att låta dem sova i sitt kristallbo så länge som möjligt._\n\nPå grund av sin storlek rör sig kristallväktare mycket långsammare i slutna utrymmen. De är också så hållbara att de är omöjliga att döda direkt. De kan slås ner och tillfälligt göras oskadliga, men de kommer bara att resa sig upp igen efter en liten stund.
actors.mobs.crystalguardian.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.crystalguardian.name=kristallskyddare
actors.mobs.crystalmimic.ate=Härmaren åt upp din %s!
actors.mobs.crystalmimic.desc=Härmare är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att locka till sig intet ont anande äventyrare. \n\n Kristallhärmare är knepigare än sina vanliga kusiner och föredrar att undvika konflikter när de stjäl byte. De kommer att försöka springa iväg när de väl upptäckts och har förmågan att ompositionera fiender när de attackerar.
actors.mobs.crystalmimic.escaped=Kristallhärmaren har rymt!
actors.mobs.crystalmimic.name=kristallhärmning
actors.mobs.crystalspire.alert=Vibrationen växer och dånar genom hela grottan!
actors.mobs.crystalspire.desc=Denna gigantiska spira av ultrahård kristall är förmodligen källan till alla de konstiga kristallina varelserna i den här grottan. Dina vanliga vapen är ineffektiva mot den, så du måste använda din hacka om du vill förstöra den. \n\n_Se till att du är förberedd innan du börjar bryta sönder den._ En så stor kristall kommer sannolikt att ta ett tag att bryta igenom, och du kommer förmodligen inte att kunna göra det ostört. Själva spiran kan till och med ha något sätt att försvara sig. _Kanske skulle spirans egna attacker kunna användas mot dess hantlangare._
actors.mobs.crystalspire.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.crystalspire.name=kristallspira
actors.mobs.crystalspire.warning=Kristallen vibrerar när du slår på den. Att fortsätta med detta kommer garanterat att dra till dig uppmärksamhet...
actors.mobs.crystalwisp.beam_kill=Ljusstrålen dödade dig...
actors.mobs.crystalwisp.desc=En liten, ilsken, flytande bit av härdad kristall som producerar ett starkt sken. Även om de inte är särskilt starka, kommer kristallstrimlor att skjuta en skadlig ljusstråle mot dig om de har ett fritt skott. \n\nKristallstrimlor är tillräckligt små för att lätt röra sig genom de olika kristallutsprången, men de kan inte skjuta igenom dem.
actors.mobs.crystalwisp.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.crystalwisp.name=kristallstrimla
actors.mobs.demonspawner.desc=Denna förvridna blandning av dvärgkött är ansvarig för att skapa rippandemoner från dvärgarna som har dött i den här regionen. Demonerna ser uppenbarligen inga problem med att använda alla resurser de kan mot sina fiender.\n\nÄven om de är visuellt skrämmande har demon-spawners inga möjligheter att röra sig eller direkt försvara sig. Deras betydande massa gör dem dock svåra att döda snabbt, och de kommer att spawna rippandemoner snabbare när de är hotade.\n\n_Demon-spawners verkar vara kopplade till någon central källa till demonisk kraft. Att döda dem kan försvaga den._
actors.mobs.demonspawner.name=demon spawner
actors.mobs.demonspawner.on_death=Den demoniska energin här verkar minska när spawnern dör.
actors.mobs.dm100.desc=DM-100 är en tidig modell av dvärgarnas "försvarsmaskin" som var utformad för att skydda dvärgarnas gruvarbetare i grottorna nedanför detta fängelse. Deras elektriska stötar visade sig dock vara för svaga, och därför gavs de till människostaden ovanför. De förblev oanvända i åratal och hamnade så småningom i fängelset, där fängelsevakten initialt ansåg dem vara för grymma att använda. Men allt eftersom fångarna blev mer ostyriga blev de en nödvändighet.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Blixten dödade dig...
actors.mobs.dm200.desc=DM-200 är andra generationen av dvärgarnas "försvarsmaskin", som designades för att skydda dvärgarnas gruvarbetare i grottorna och staden nedanför. De är mycket större och mer skrymmande än sina föregångare och attackerar med förödande hydrauliska nävar. \n\nDeras ökade storlek är också deras främsta svaghet, eftersom de inte får plats i de smala tunnlarna och dörröppningarna i fängelsehålan. Dvärgarna kunde kompensera för DM-200:s bristande rörlighet genom att låta dem ventilera sina giftiga avgaser mot avlägsna fiender, eller fiender de inte kan nå.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 avfyrar en stråle av giftiga avgaser!
actors.mobs.dm201.desc=Dvärgarna experimenterade kort med att betona DM-200:s brist på rörlighet och skapade några DM-modeller som är helt stationära. DM-201 är en eftermonterad DM-200 som fungerar som ett vakttorn utan rörelseförmåga. I utbyte mot bristen på rörlighet har DM-201:or betydligt mer hållbarhet och attackkraft. \n\nAs DM-201:or har ingen motor att ventilera avgaser från, dvärgarna utrustade dem istället med frätande gasgranater! DM-201:or är dock försiktiga med dessa granater och kommer bara att lobba dem när de attackeras på avstånd.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 avfyrar en frätande granat!
actors.mobs.dm300.charge_lost=PYLON FÖRSTÖRD! ÅTERGÅR TILL LOKAL MAKT!
actors.mobs.dm300.charging=SKADA UPPSTÅR! AKTIVERA KRAFTPYLON!
actors.mobs.dm300.charging_hint=DM-300 är osårbar medan den får ström från en pylon!
actors.mobs.dm300.def_verb=blockerad
actors.mobs.dm300.defeated=ALLVARLIGA SKADOR! FÖRSÖK ATT STÄNGA AV-
actors.mobs.dm300.desc=Den här maskinen byggdes av dvärgarna för flera hundra år sedan. Senare började de ersätta maskiner med golemar, elementarväsen och till och med demoner. Till slut ledde det till deras civilisations förfall. DM-300 och liknande maskiner användes främst till byggarbete och gruvdrift, men ibland även till att försvara staden.
actors.mobs.dm300.desc_supercharged=DM-300 är för närvarande laddad med elektrisk energi. I denna form kan DM-300 inte skadas och rör sig med dubbel hastighet! Dessutom snurrar dess borr nu tillräckligt snabbt för att den ska kunna _gräva tunnel genom fast berg,_ även om den rör sig mycket långsammare när den gör detta. \n\nAtt attackera DM-300 direkt är meningslöst medan den är överladdad, men _något i området måste förse den med denna energi,_ och förstöra något som kan försvaga den.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=OAUTORISERAD PERSONAL UPPTÄCKT!
actors.mobs.dm300.pylons_destroyed=VARNING! INSTABILITET UPPTÄCKT I ELNÄTET!
actors.mobs.dm300.rankings_desc=Krossad av DM-300
actors.mobs.dm300.shield=DM-300 drar ström från de exponerade ledningarna och skärmar sig själv!
actors.mobs.dm300.supercharged=FÖRSTÖR! FÖRSTÖR! FÖRSTÖR!
actors.mobs.dwarfking$dkghoul.rankings_desc=Föll inför dvärgarnas kung
actors.mobs.dwarfking$dkgolem.rankings_desc=Föll inför dvärgarnas kung
actors.mobs.dwarfking$dkmonk.rankings_desc=Föll inför dvärgarnas kung
actors.mobs.dwarfking$dkwarlock.rankings_desc=Föll inför dvärgarnas kung
actors.mobs.dwarfking.defeated=Du har... dömt oss alla...
actors.mobs.dwarfking.desc=För många år sedan avslöjade en av de högsta trollkarlarna vid dvärgarnas hov hemligheter som gav honom enorm makt över liv och död. Han använde snart denna makt, underkuvade och korrumperade sina jämnåriga, sin kung och så småningom varje dvärgmedborgare. Nu är han kung, härskare över en legion av odöda undersåtar. \n\n Dvärgarnas kung är en aggressiv fiende som försöker omringa och överväldiga sina fiender med sin hord av odöda hantlangare.
actors.mobs.dwarfking.enraged=Du kan inte döda mig %s. JAG. ÄR. ODÖDLIG!
actors.mobs.dwarfking.lifelink_1=Jag behöver din essens, slav!
actors.mobs.dwarfking.lifelink_2=Blöda för mig, slav!
actors.mobs.dwarfking.losing=Nej! Du kan inte göra det här... du har ingen aning om vad som finns nedanför...
actors.mobs.dwarfking.name=Dvärgarnas kung
actors.mobs.dwarfking.notice=Hur vågar du! Du har ingen aning om vad du lägger dig i!
actors.mobs.dwarfking.rankings_desc=Föll inför dvärgarnas kung
actors.mobs.dwarfking.teleport_1=Ta itu med dem, slav!
actors.mobs.dwarfking.teleport_2=Håll dem sysselsatta, slav!
actors.mobs.dwarfking.wave_1=Nog! Res er, mina slavar!
actors.mobs.dwarfking.wave_2=Mer! Blöda för er kung!
actors.mobs.dwarfking.wave_3=Värdelösa! DÖDA DEM NU!
actors.mobs.ebonymimic.desc=Härmare är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att locka till sig intet ont anande äventyrare. \n\nEbenholtshärmare är smygande härmare med förmågan att göra sig nästan osynliga. De lurar på saker som äventyrare sannolikt kommer att interagera med, men innehåller också sitt eget byte. De är inte tuffare än en vanlig härmare när de väl upptäckts, men deras överraskande bett är förödande.
actors.mobs.ebonymimic.discover_hint=Du kan hitta den här fienden med en specifik prydnadssak.
actors.mobs.ebonymimic.hidden_desc=Det verkar finnas något här, men det är nästan helt genomskinligt.
actors.mobs.ebonymimic.hidden_name=misstänkt kontur
actors.mobs.ebonymimic.name=ebenholts härma
actors.mobs.ebonymimic.reveal=Det fanns en härmning där!
actors.mobs.elemental$chaoselemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi. \n\nKaoselementaler är sällsynta och farliga elementaler som inte har stabiliserats till ett visst element. De kommer att släppa lös vild oförutsägbar magi när de attackerar.
actors.mobs.elemental$chaoselemental.name=kaos elementärt
actors.mobs.elemental$fireelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och förknippas vanligtvis med en viss typ av magi. \n\nEldelementaler är en vanlig typ av elemental som orsakar skada med eldig magi. De sätter sitt mål i brand med närstridsattacker och kan ibland även avfyra eldpilar.
actors.mobs.elemental$fireelemental.name=eldelement
actors.mobs.elemental$frostelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi. \n\n Frostelementaler är en vanlig typ av elemental som försvagar fiender med kylig magi. De kyler ner sitt mål med närstridsattacker och enstaka distansattacker. Deras magi är mycket mer effektiv i vatten.
actors.mobs.elemental$frostelemental.name=frostelementär
actors.mobs.elemental$newbornfireelemental.charging=Elementarium laddar upp!
actors.mobs.elemental$newbornfireelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och förknippas vanligtvis med en viss typ av magi. \n\n Denna eldelemental är nyligen framkallad, men fortfarande ganska farlig!
actors.mobs.elemental$newbornfireelemental.desc_ally=Eftersom detta element framkallades av en besvärjelse har det lite mer kontroll över sin låga. Det är oförmöget att utföra distansattacker, men kommer att antända fiender det attackerar i närstrid.
actors.mobs.elemental$newbornfireelemental.desc_boss=På grund av den kaotiska naturen i dess åkallan kan detta element bara sprida eld i felaktiga explosioner efter att ha anfallit i en tur.
actors.mobs.elemental$newbornfireelemental.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.elemental$newbornfireelemental.name=nyfödd eldelement
actors.mobs.elemental$shockelemental.desc=Elementaler är kaotiska varelser som ofta skapas när kraftfull ockult magi inte kontrolleras ordentligt. Elementaler har minimal intelligens och är vanligtvis förknippade med en viss typ av magi. \n\nChockelementaler är en mindre vanlig typ av elemental som stör sina fiender med elektricitet och ljusblixtar. I närstrid skickar de elektricitet till närliggande fiender och gör bonusskada på sitt primära mål om de är i vatten. De fokuserar också ibland en ljusstråle på avstånd mot sitt mål, vilket tillfälligt bländar dem.
actors.mobs.elemental$shockelemental.name=chockelementär
actors.mobs.eye.deathgaze_kill=Dödsblicken dödade dig...
actors.mobs.eye.desc=Den här demonen kallas också ”hatets klot”. När den ser en fiende använder den sin dödsblick utan hänsyn till sina allierade, som ofta kommer till skada.
actors.mobs.eye.name=onda ögat
actors.mobs.fetidrat.desc=Något är uppenbarligen fel med den här råttan. Dess feta svarta päls och ruttnande hud är väldigt annorlunda från de friska råttor du sett tidigare. Dess blekgröna ögon får den att verka särskilt hotfull. \n\nRåttan bär med sig ett moln av hemsk stank, den är överväldigande stark på nära håll. \n\nMörkt sekret droppar från råttans mun, den äter sig igenom golvet men verkar lösas upp i vatten.
actors.mobs.fetidrat.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.fetidrat.name=stinkande råtta
actors.mobs.fungalcore.desc=Denna gigantiska svamp måste vara källan till all svampaktivitet i den här grottan.
actors.mobs.fungalcore.name=svampkärna
actors.mobs.fungalsentry.desc=Denna särskilt höga svamp fungerar som en försvarspunkt för det större svampnätverket som lever i denna grotta. \n\n Den är orörlig, men avfyrar precisa giftstötar mot allt som kommer inom dess synfält. Även om effekten av dessa stötar är ganska svag, _kan de samla dödliga mängder gift mycket snabbt._ Även om den kan dödas är det förmodligen bäst att undvika den.
actors.mobs.fungalsentry.name=svampvakt
actors.mobs.fungalspinner.desc=Denna grottspinnare verkar bekämpas av en parasitisk svamp. Svampen har också ändrat sina förmågor och ersatt sitt nät och sina giftsäckar med svampväxt. \n\n Svampspinnaren spottar växtliv på dig istället för nät, vilket sprider svampvegetation och potentiellt rotar dig. Även om den inte kan förgifta, kommer svampspinnaren att få betydande skademotståndskraft om den är intill svampar.
actors.mobs.fungalspinner.name=svampspinnare
actors.mobs.ghoul.desc=Allt eftersom dvärgsamhället sakta började kollapsa, och den nuvarande dvärgkungen tog absolut makt, behandlades inte de som var svaga eller som gjorde motstånd mot honom väl. Allt eftersom kungen blev mer skicklig på att utöva mörk magi, böjde han dessa dvärgar efter sin vilja, och nu utgör de fotsoldaterna i hans armé. \n\n Ghouls är inte särskilt starka på egen hand, utan reser alltid i grupper och är mycket svårare att döda i stort antal. _När en ghoul besegras, kommer den att resa sig igen efter några omgångar så länge en annan ghoul är i närheten._
actors.mobs.ghoul.name=dvärgspöke
actors.mobs.gnoll.desc=Gnolls är hyenliknande humanoider. De bor i kloaker och fängelsehålor och vågar sig upp för att plundra ytan då och då. Gnoll-spejare är regelbundna medlemmar i deras flock, de är inte lika starka som odjur och inte lika intelligenta som shamaner.
actors.mobs.gnoll.name=gnoll scout
actors.mobs.gnollexile.desc=Denna gråpälsade gnol har ett stort märke på axeln, vilket indikerar att den är en exil. Gnollar förvisas vanligtvis från sitt samhälle för att de ignorerar order eller bryter mot lagar. Exiler måste vara starka och slug för att överleva, den här ser ut som att den vet hur man använder spjutet den håller.
actors.mobs.gnollexile.desc_aggro=_Gnoll-förvisaren tittar sig ilsket omkring._ Det verkar som att något har fått den att bestämma sig för att slåss trots allt. Se upp för spjutet!
actors.mobs.gnollexile.desc_passive=_Gnoll-exilen ger sig inte ut för att attackera._ Den verkar inte lika aggressiv som de andra gnollarna här, och tror förmodligen inte att det är värt att slåss mot dig. Du kan bara låta den passera, men den har en ryggsäck som kan vara full av användbara föremål...
actors.mobs.gnollexile.name=gnoll exil
actors.mobs.gnollexile.seen_aggro=Den spjutbeväpnade gnollen går till attack!
actors.mobs.gnollexile.seen_passive=Den spjutsvingande gnollen tittar vaksamt på dig, men rör sig inte för att attackera.
actors.mobs.gnollgeomancer.alert=Geomancern vaknar! Hela grottan verkar förskjutas när den hoppar iväg medan den skrattar vilt!
actors.mobs.gnollgeomancer.desc=Denna imponerande långa seniorgnol måste vara källan till de olika jordförflyttningsmagierna här omkring, och organisatören av all gnollaktivitet. Till skillnad från gnollsapparna i området är geomancern ganska skicklig på sin magi och kan inte skadas av kastade eller fallande stenar. Den har dock inget sätt att slåss i närstrid.
actors.mobs.gnollgeomancer.desc_armor=Geomancern är för närvarande innesluten i ett lager av stenpansar. _Du måste komma nära och bryta loss den med din hacka innan du kan skada geomancern._
actors.mobs.gnollgeomancer.desc_armor_sapper=En gnollsappör i närheten håller i en anordning som ger geomancerns stenrustning kraft. Du kommer inte att kunna skada den alls just nu!
actors.mobs.gnollgeomancer.desc_sleeping=Denna imponerande höga gnollshaman är omgiven av ett lager sten och ser nästan ut som en staty. Om du tittar noga kan du se stenen röra sig magiskt i takt med den äldre gnollens andning. Den kan inte skadas medan den är inbäddad i sten på det här sättet, och den verkar njuta av en bokstavlig tupplur i jord. \n\nDu kan förmodligen bryta igenom stenlagren med din hacka, men _se till att du är redo för en strid när du gör det._ Geomancern måste vara källan till de olika jordflyttningsmagin här omkring, och organisatören av all gnollaktivitet. _Att besegra gnollarna som är utspridda här innan man bekämpar den kan vara en bra idé._
actors.mobs.gnollgeomancer.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.rock_kill=Den flygande stenen dödade dig...
actors.mobs.gnollgeomancer.rockfall_kill=De fallande stenarna dödade dig...
actors.mobs.gnollgeomancer.warning=Geomancern börjar röra på sig. Se till att du är redo innan du fortsätter!
actors.mobs.gnollguard.def_verb=blockerad
actors.mobs.gnollguard.desc=En stor och tuff gnoll med spjut och sköld, men ingen hjälm. Dessa vakter är sannolikt ohyror i träning, inhysta för att skydda gruvan från inkräktande vilda djur. \n\n Gnollskyddet är tillräckligt starkt för att kunna hålla spjutet i ena handen, men kan inte använda det särskilt bra. _Den behöver ganska öppet utrymme för att attackera på avstånd, och kommer att göra betydligt mindre skada på dig om du kommer nära._
actors.mobs.gnollguard.desc_armor=En gnoll-sappör i närheten håller i en anordning som ger denna vakt jordnära rustning, vilket kraftigt minskar skadan den tar.
actors.mobs.gnollguard.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.gnollguard.name=gnoll-skydd
actors.mobs.gnollguard.spear_warn=Gnollen landar ett våldsamt slag med spetsen på sitt spjut!
actors.mobs.gnollsapper.desc=En liten och svag men intelligent gnoll med blek päls och en väska full av diverse prylar. De är troligen här för att hjälpa till med prospektering och utvinning av mörkt guld, och har en vakt i närheten som skydd. De är kapabla att slåss, men deras attacker är ynkligt svaga, inte starkare än en gnollspanare. \n\n Istället för att slåss direkt föredrar sappers att använda de olika prylar de har för att få den steniga omgivningen att attackera åt dem. De kan dock inte själva jordförflyttningsmagi, och är därför ganska benägna att använda sina prylar vårdslöst. _Det borde finnas många sätt att använda sina attacker mot dem, eller sin vakt._
actors.mobs.gnollsapper.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.gnollsapper.name=gnoll-sappör
actors.mobs.gnolltrickster.desc=En underlig varelse, även med gnollmått mätt. Den lutar sig framåt med ett elakt flin, nästan med väskan som hänger över axeln. Dess ögon är vidöppna av en märklig blandning av rädsla och spänning. \n\nDet finns en stor samling dåligt tillverkade pilar i dess väska, de verkar alla vara fyllda med diverse skadliga ämnen.
actors.mobs.gnolltrickster.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.gnolltrickster.name=gnoll-bedragaren
actors.mobs.goldenmimic.desc=Härmare är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att locka till sig intet ont anande äventyrare. \n\n Gyllene härmare är tuffare härmare som försöker attrahera de starkaste äventyrarna. De har bättre byte, men är också mycket starkare än vanliga härmare.
actors.mobs.goldenmimic.name=gyllene härm
actors.mobs.golem.def_verb=blockerad
actors.mobs.golem.desc=Dvärgarna försökte förena sin kunskap om mekanik med sin nyvunna förmåga att binda elementarväsen. De använde jordandar som själar i golemarnas mekaniska kroppar, eftersom de ansågs lättast att styra. Trots det kunde minsta misstag i ritualen få dem att löpa amok.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=Man vet inte mycket om Goo. Kanske är det inte ens en varelse, utan en ansamling av ämnen från kloakerna som har fått ett slags egen vilja.
actors.mobs.goo.enraged=rasande
actors.mobs.goo.gluuurp=GLAAAAA!
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Goo pumpar upp sig själv!
actors.mobs.goo.rankings_desc=Absorberad av Goo
actors.mobs.greatcrab.def_verb=blockerad
actors.mobs.greatcrab.desc=Denna krabba är gigantisk, även jämfört med andra kloakkrabbor. Dess blå skal är täckt av sprickor och havstulpaner, vilket visar på hög ålder. Den lufsar omkring långsamt och håller knappt balansen med sin massiva klo. \n\n Även om krabban bara har en klo, kompenserar dess storlek lätt. Krabban håller klon framför alla hot och skyddar sig bakom en ogenomtränglig vägg av ryggsköld. Krabban kan dock inte blockera attacker den inte ser komma, eller attacker från flera fiender samtidigt.
actors.mobs.greatcrab.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.greatcrab.name=stor krabba
actors.mobs.greatcrab.noticed=Krabban blockerar med sin massiva klo.
actors.mobs.guard.def_verb=blockerad
actors.mobs.guard.desc=Dessa vakter, som en gång var fängelsevakter, har för länge sedan inte blivit annorlunda än fångarna. De vandrar omkring som zombier, strövar hjärnlöst genom korridorerna i jakt på allt som inte hör hemma, precis som du! \n\n De bär kedjor runt höften, möjligen för att dra in fiender på nära håll.
actors.mobs.guard.name=fångvaktare
actors.mobs.guard.scorpion=Kom hit!
actors.mobs.hermitcrab.def_verb=blockerad
actors.mobs.hermitcrab.desc=Av en eller annan anledning har den här kloakkrabban bestämt sig för att bära den trasiga övre delen av en tunna på huvudet! Den extra vikten har saktat ner den till normal hastighet, men har också gett den betydligt mer försvar. Man tror att man kan höra något studsa runt inuti tunnan dock...
actors.mobs.hermitcrab.name=eremitkräfta
actors.mobs.mimic.desc=Mimiker är magiska varelser som kan ta vilken form de vill. I fängelsehålor väljer de nästan alltid formen av en skattkista för att locka till sig intet ont anande äventyrare.
actors.mobs.mimic.discover_hint=Du kan hitta den här fienden var som helst i fängelsehålan.
actors.mobs.mimic.hidden_hint=Något med det här bröstet känns konstigt... Att gå fram och försöka öppna det kanske är en dålig idé.
actors.mobs.mimic.name=mimik
actors.mobs.mimic.reveal=Det där bröstet är en härmning!
actors.mobs.mob.died=Du hör något dö i fjärran.
actors.mobs.mob.discover_hint=Du kan hitta den här fienden i en specifik region av fängelsehålan.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Dödad av: %s
actors.mobs.monk$focus.desc=Den här munken är perfekt fokuserad på sitt mål och verkar förutse deras drag innan de utför dem. \n\n Medan karaktären är fokuserad är nästa fysiska attack mot den här karaktären garanterad att missa, oavsett omständigheterna. Att parera den här attacken kommer att förbruka munkens fokus, och de kommer att behöva bygga upp det igen för att parera en annan attack. Munkar bygger fokus snabbare medan de rör sig.
actors.mobs.monk$focus.name=fokuserad
actors.mobs.monk.def_verb=blockerad
actors.mobs.monk.desc=Dessa munkar är fanatiker som vigt sina liv åt att skydda stadens hemligheter från alla utomstående. De använder varken rustning eller vapen, utan litar helt på sin skicklighet i obeväpnad strid.
actors.mobs.monk.name=dvärgmunk
actors.mobs.monk.parried=parerade
actors.mobs.necromancer$necroskeleton.desc=Detta skelett har framkallats av en nekromant. Det beter sig precis som ett vanligt skelett och kommer att dö när nekromantikern som framkallade det dödas.
actors.mobs.necromancer$necroskeleton.name=nekromantikerns skelett
actors.mobs.necromancer.desc=Dessa lärlingsmagiker har flockats till fängelset, eftersom det är den perfekta platsen att utöva sitt onda hantverk. \n\nNekromanter kommer att kalla fram och ge skelett kraft att kämpa för dem. Att döda nekromantikern kommer också att döda skelettet den kallar fram.
actors.mobs.necromancer.name=andebesvärjare
actors.mobs.npcs.blacksmith.cant_enter_old=Det området är inte tillgängligt på den här sträckan. Spela ett nytt spel för att prova det nya uppdraget!
actors.mobs.npcs.blacksmith.def_verb=blockerad
actors.mobs.npcs.blacksmith.desc=Den här trollsmeden ser ut som alla troll ser ut: han är lång och smal, och hans hud liknar sten i både färg och textur. Trollsmeden mekar med oproportionerligt små verktyg.
actors.mobs.npcs.blacksmith.enter_no=Inte än
actors.mobs.npcs.blacksmith.enter_yes=Jag är redo
actors.mobs.npcs.blacksmith.entrance_blocked=Vägen ner är blockerad.
actors.mobs.npcs.blacksmith.exit_no=Inte än
actors.mobs.npcs.blacksmith.exit_warn_crystal=Den där jättekristallen är fortfarande där nere också. Jag betalar extra om du förstör den.
actors.mobs.npcs.blacksmith.exit_warn_full=Är du klar? Du har massor av guld, men se till att du inte har glömt någon av dina saker. \n\n_Kom ihåg att jag inte släpper in dig igen när du väl kommit upp._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Den där jättesvampen är fortfarande där nere också. Jag betalar extra om du dödar den.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Den där gnoll-geomancern är fortfarande där nere också. Jag betalar extra om du dödar den.
actors.mobs.npcs.blacksmith.exit_warn_high=Är du klar? Det ser ut som att du har en bra mängd guld, men jag skulle kunna använda lite mer. Du borde kunna få _40 mynt._\n\n_Kom ihåg att jag inte släpper in dig igen när du väl kommit upp._
actors.mobs.npcs.blacksmith.exit_warn_low=Är du klar redan? Det ser inte ut som att du har mycket guld. Du borde kunna få _40 mynt._\n\n_Kom ihåg att jag inte släpper in dig igen när du väl kommit upp._
actors.mobs.npcs.blacksmith.exit_warn_med=Är du klar? Du har åtminstone lite guld, men det finns definitivt mer i gruvan. Du borde kunna få _40 mynt._\n\n_Kom ihåg att jag inte släpper in dig igen när du väl kommit upp._
actors.mobs.npcs.blacksmith.exit_warn_none=Är du klar redan? Du har knappt något guld alls! Du borde kunna få _40 bitar._\n\n_Kom ihåg att jag inte släpper in dig igen när du väl kommit upp._
actors.mobs.npcs.blacksmith.exit_yes=Jag är klar
actors.mobs.npcs.blacksmith.get_lost=Jag är upptagen. Gå vilse!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hej människa! Du verkar vara en viktig person.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Men var försiktig, gruvan är farlig för en liten människa som du. Den har stått övergiven ett tag, och en massa kristaller har börjat växa. De är glänsande, men för sköra för att vara värda någonting, och de har några magiska saker som skyddar dem. De är ganska starka, så _var försiktig var du bryter_ annars får du deras uppmärksamhet. \n\nDet finns en _jättekristall_ någonstans också. Den är mycket tuffare, så var beredd på en strid om du börjar krossa den. Jag slår vad om att krossa den kommer att sakta ner all kristalltillväxt, så jag betalar extra om du kan göra det.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hej människa! Du verkar modig.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Men var försiktig, gruvan är farlig för en liten människa som du. Det finns någon sorts svampmonster som har vuxit där nere. Den har svampvakter som är riktigt dödliga om de ser dig, men de kan åtminstone inte resa sig upp och jaga dig. _Håll dig utom synhåll_ om du vill hålla dig vid liv. \n\nJag betalar extra om du lyckas ta ner den _största svampen_, men det kommer att krävas en rejäl ansträngning. Den är kopplad till ett gäng mycelnoder som är gömda i väggarna. Du måste krossa de flesta av dem innan du riktigt kan skada den.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Men var försiktig, gruvan är farlig för en liten människa som du. Vissa gnollar vill också ha guldet och nu förstör de platsen. De är dumma varelser, så deras gruvdrift har orsakat alla möjliga kollapser och ras. Du måste bryta igenom den, så _leta efter nyligen störd sten._\n\nJag tror att en av gnollarna orsakar de flesta problemen, förmodligen en _geomancer-shaman_ eller något. Jag betalar extra om du kan hitta och döda den, men jag är säker på att den kommer att slå tillbaka.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hej människa! Du ser ut att vara snabb.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hej människa! Du verkar vara en smarting.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hej människa! Du ser ut som en lömsk människa.
actors.mobs.npcs.blacksmith.intro_quest_start=Vill du vara till nytta, va? Ja, jag har något du kan göra. Jag byggde den här verkstaden ovanpå en gammal gruva, det är bara nerför den där stegen. Ta den här hackan och bryt lite _mörk guldmalm_ åt mig. 40 bitar_ borde räcka. Stenen nerför är fin och mjuk så _du kommer att kunna bryta dig igenom väggarna med lite ansträngning._\n\nVad menar du med hur jag ska betala? Din girige...\n\nOkej, okej, jag kan göra lite smide åt dig. Betrakta dig själv som lycklig, jag är den enda smeden i närheten.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hej människa! Du verkar vara en tuffing.
actors.mobs.npcs.blacksmith.lost_pick=Skojar du? Var är min hacka?!
actors.mobs.npcs.blacksmith.name=trollsmed
actors.mobs.npcs.blacksmith.quest_start_prompt=Är du redo att gå ner? Se till att du har lite ledigt utrymme för guldet. \n\n_Jag släpper bara ner dig en gång!_
actors.mobs.npcs.blacksmith.reminder=Har du slösat bort min tid? Gruvingången är där borta.
actors.mobs.npcs.blacksmith.reminder_crystal=Ge mig så mycket guld som möjligt, och försök att krossa den stora kristallen också.
actors.mobs.npcs.blacksmith.reminder_fungi=Ge mig så mycket guld som möjligt, och försök att döda den gigantiska svampen också.
actors.mobs.npcs.blacksmith.reminder_gnoll=Ge mig så mycket guld som möjligt, och försök att döda gnoll-geomancern också.
actors.mobs.npcs.ghost.crab_1=Hej %s... En gång var jag som du - stark och självsäker... Men jag dödades av en uråldrig varelse... Jag kan inte lämna den här platsen... Inte förrän jag har fått min hämnd... Döda den _stora krabban,_ som har tagit mitt liv...\n\nDen är onaturligt gammal... Med en massiv enda klo och ett tjockt skal... _Se upp för dess klo, du måste överraska krabban annars kommer den att blockera den..._
actors.mobs.npcs.ghost.crab_2=Snälla... Hjälp mig... Döda kräftdjuret...\n\n_Den kommer alltid att blockera... När den ser dig komma..._
actors.mobs.npcs.ghost.desc=Spöket är knappt synligt. Det ser ut som en formlös fläck av svagt ljus med ett sorgset ansikte.
actors.mobs.npcs.ghost.find_me=Tack... kom och hitta mig...
actors.mobs.npcs.ghost.gnoll_1=Hej %s... En gång var jag som du - stark och självsäker... Men jag dödades av en lömsk fiende... Jag kan inte lämna den här platsen... Inte förrän jag har fått min hämnd... Döda _gnoll-bedragaren,_ som har tagit mitt liv...\n\nDen är inte som de andra gnollarna... Den gömmer sig och använder kastade vapen... _Se upp för dess giftiga och brännbara pilar, attackera inte på avstånd..._
actors.mobs.npcs.ghost.gnoll_2=Snälla... Hjälp mig... Döda bedragaren...\n\n_Låt det inte träffa dig... Kom nära det..._
actors.mobs.npcs.ghost.name=sorgligt spöke
actors.mobs.npcs.ghost.rat_1=Hej %s... En gång var jag som du - stark och självsäker... Men jag dödades av ett vidrigt odjur... Jag kan inte lämna den här platsen... Inte förrän jag har fått min hämnd... Döda den _stinkande råttan,_ som har tagit mitt liv...\n\nDen smyger här på golvet... Sprider smuts överallt... _Se upp för dess moln av stank och frätande bett, syran löses upp i vatten..._
actors.mobs.npcs.ghost.rat_2=Snälla... Hjälp mig... Döda styggelsen...\n\n_Bekämpa den nära vatten... Undvik stanken..._
actors.mobs.npcs.imp.cya=Vi ses, %s!
actors.mobs.npcs.imp.desc=Impar är mindre demoner. De är varken kända för sin styrka eller sin magiska talang, men de är ganska smarta och sällskapliga. Många impar föredrar att leva bland icke-demoner.
actors.mobs.npcs.imp.golems_1=I mitt fall är det _golems_ som behöver dödas. Du förstår, jag ska starta ett litet företag här, men de där dumma golemerna är dåliga för affärerna! Det är väldigt svårt att förhandla med vandrande granitklumpar, förbannade dem! Så snälla döda... låt oss säga _4 av dem_ så får du en belöning.
actors.mobs.npcs.imp.golems_2=Hur går det med din golemsafari? Glöm bara inte att hämta de där polletterna.
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.intro=Är du en äventyrare? Jag älskar äventyrare! Man kan alltid lita på dem om något behöver dödas, eller hur? Mot en belöning förstås ;)
actors.mobs.npcs.imp.monks_1=I mitt fall är det _munkar_ som behöver dödas. Du förstår, jag ska starta ett litet företag här, men de där galningarna köper ingenting själva och kommer att skrämma bort andra kunder. Så snälla döda... låt oss säga _5 av dem_ så får du en belöning.
actors.mobs.npcs.imp.monks_2=Åh, du lever fortfarande! Jag visste att din kung-fu skulle vara starkare ;) Glöm bara inte att hämta de där polletterna.
actors.mobs.npcs.imp.name=ambitiös imp
actors.mobs.npcs.impshopkeeper.buyback=Impen returnerar glatt ditt föremål.
actors.mobs.npcs.impshopkeeper.desc=Djävulen har öppnat en liten butik i utkanten av de inre korridorerna. Det är trevligt att se ett vänligt ansikte, men hans priser verkar verkligen inte vara vänliga.
actors.mobs.npcs.impshopkeeper.greetings=Hej, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Vad gjorde du %s? Handla snabbt, jag måste härifrån!
actors.mobs.npcs.impshopkeeper.name=ambitiös imp
actors.mobs.npcs.impshopkeeper.thief=Jag trodde jag kunde lita på dig!
actors.mobs.npcs.mirrorimage.desc=Den här illusionen liknar dig på pricken, men är blekare och rycker lite.
actors.mobs.npcs.mirrorimage.discover_hint=Du kan hitta den här karaktären med en specifik rullning.
actors.mobs.npcs.mirrorimage.name=spegelbild
actors.mobs.npcs.npc.discover_hint=Du kan hitta den här karaktären i en specifik region av fängelsehålan.
actors.mobs.npcs.prismaticimage.desc=Denna skimrande illusion har en stark likhet med dig, den verkar till och med använda ditt nuvarande vapen och din rustning.\n\nPrismatiska bilder kommer att försöka söka och dra fokus från fiender, med hjälp av sitt förbättrade försvar och hälsa för att skydda dig. Även om de inte har samma offensiva kraft som spegelbilder, har de förbättrad hållbarhet, inklusive att få fördelar från din rustning.\n\nNär de reduceras till 0 hp kommer prismatiska bilder att blekna över flera omgångar, och kan fortfarande läkas under denna tid. När inga fiender är närvarande kommer prismatiska bilder att blekna och återförenas med sin herre.
actors.mobs.npcs.prismaticimage.discover_hint=Du kan hitta den här karaktären med en specifik rullning.
actors.mobs.npcs.prismaticimage.name=prismatisk bild
actors.mobs.npcs.ratking.confused=Va... Var är jag? Mitt kungarike behöver mig!
actors.mobs.npcs.ratking.crown_after=Trivs du med din nya rustning? Inga återköp!
actors.mobs.npcs.ratking.crown_clothes=Ta på dig lite kläder! Du är inte i ett skick att prata med kungligheter!
actors.mobs.npcs.ratking.crown_desc=Åh, är den kronan till mig!? Den ser mycket blankare ut än min, så jag accepterar vänligt! \n\nFaktum är att jag tror att jag kan erbjuda dig något som belöning för den här kronan. En enorm kraft som anstår en hjälte som dig! Skulle du vilja ha det?
actors.mobs.npcs.ratking.crown_fine=Okej! Det var inte som att jag ville det i alla fall...
actors.mobs.npcs.ratking.crown_info=Berätta mer först.
actors.mobs.npcs.ratking.crown_no=Jag skulle hellre inte...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, tack! Gå nu och gör din kung stolt!
actors.mobs.npcs.ratking.crown_yes=Naturligtvis!
actors.mobs.npcs.ratking.desc=Den här råttan är lite större än en vanlig pungråtta. Den har en liten krona på huvudet.
actors.mobs.npcs.ratking.desc_birthday=Den här råttan är lite större än en vanlig pungråtta. Den har en liten grön partyhatt istället för sin vanliga krona. Grattis på födelsedagen Råttkungen!
actors.mobs.npcs.ratking.desc_crown=Denna råtta är lite större än en vanlig pungdjursråtta. Den bär en dvärgkungkrona på huvudet.
actors.mobs.npcs.ratking.desc_winter=Den här råttan är lite större än en vanlig pungdjursråtta. Den har en liten festlig hatt istället för sin vanliga krona. God jul!
actors.mobs.npcs.ratking.discover_hint=Du hittar den här karaktären i slutet av en specifik region i fängelsehålan.
actors.mobs.npcs.ratking.name=råttkungen
actors.mobs.npcs.ratking.not_sleeping=Jag sover inte!
actors.mobs.npcs.ratking.what_is_it=Vad är det? Jag har ingen tid med det här nonsenset. Mitt kungarike kommer inte att styra sig självt!
actors.mobs.npcs.sheep.baa!=bä!
actors.mobs.npcs.sheep.baa.=Bä.
actors.mobs.npcs.sheep.baa...=Bä...
actors.mobs.npcs.sheep.baa?=Bä?
actors.mobs.npcs.sheep.def_verb=blockerad
actors.mobs.npcs.sheep.desc=Det här är ett magiskt får. Vad är så magiskt med det? Man kan inte döda det. Det kommer att stå där tills det magiskt försvinner, hela tiden idisslande med en tom blick.
actors.mobs.npcs.sheep.discover_hint=Du kan hitta den här karaktären med ett specifikt föremål eller en fälla.
actors.mobs.npcs.sheep.name=får
actors.mobs.npcs.shopkeeper.buyback=Butiksinnehavaren returnerar motvilligt din vara.
actors.mobs.npcs.shopkeeper.desc=Den här kraftige killen ser mer passande ut för ett handelsdistrikt i någon storstad än för en fängelsehåla. Hans priser förklarar varför han föredrar att göra affärer här.
actors.mobs.npcs.shopkeeper.flee=Butiksägaren flyr!
actors.mobs.npcs.shopkeeper.name=butiksinnehavare
actors.mobs.npcs.shopkeeper.sell=Sälj en vara
actors.mobs.npcs.shopkeeper.talk=Prata
actors.mobs.npcs.shopkeeper.talk_ascent=Jag vet inte vad du planerar att göra med den där amuletten, men jag vill inte ha något med det att göra. Köp något och gå vidare, vi måste båda lämna det här stället!
actors.mobs.npcs.shopkeeper.talk_caves=Spendera pengar, lev längre. \n\n Och säg hej till den där trollsmeden från mig om du ser honom. Påminn sladden om att han fortfarande är skyldig mig pengar för den där hammaren jag sålde honom förra veckan!
actors.mobs.npcs.shopkeeper.talk_city=Mina varor kan hålla dig säker här nere. \n\n...Och släng inte upp dig, om du vill. Det tog en evighet att få lokalbefolkningen att lämna mig ifred, jag vill inte att du ska ställa till med några problem!
actors.mobs.npcs.shopkeeper.talk_halls=Hallå, jag har specialpriser för demonjägare!\n\nOch var försiktig där nere! Demonerna nedanför bryr sig inte om hur modig du är. Du kan inte komma upp igen och spendera mer pengar om du är död! ;)\n\nÄr demonerna som jag? Hehe, inte alls. Jag är bara en liten karl, inte särskilt krigare, och jag har lyckats hålla mitt sinne intakt. Demonerna nedanför är mycket starkare saker, och de har alla förslavats av... ja... var bara försiktig där nere.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nå, hallå där Ers Höghet, eller är det Ers Helighet nu? Hehe, hur som helst är det här ingen plats för dig, många skulle bli ganska förkrossade om du dog. Du har säkert några mynt dock, varför inte köpa något för att förhindra det?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Om det inte är den resande hjälten! Om du försöker rädda en annan stad så lycka till, farorna här är mycket värre än småaktiga banditgäng. Jag är säker på att du kommer att göra bättre ifrån dig än någon annan, försök bara att inte dö precis utanför min butik.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Du verkar vara helt ur ditt esse, fröken. Trånga fängelsehålekorridorer är väl inte lika rymliga som stora salar eller skogarna som omger staden? Hehe, åh, bry dig inte om mitt babbel, varför inte köpa något?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Jag har allt du behöver för ett lyckat äventyr!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, jag tror jag har sett en efterlysningsaffisch med ditt namn på någonstans i stan. Är vi på flykt? Jaha, du är oskyldig, eller hur? Självklart, självklart... Oroa dig inte, jag har bättre saker för mig än att rapportera om dig, men kanske borde du köpa något för att vara säker?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Har du kommit från tjuvgillet för att rensa området? Nej, bara för att shoppa? Döda några monster medan du är här i alla fall. Förvänta dig inte rabatt heller, jag betalar bra skyddspengar till er och ni håller mig knappt säker här nere.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Det är ett intressant sigill du har där, de är oftast i ett stycke. Är du en vanärad hjälte eller något? Vad du än har gjort angår det inte mig, dina mynt är fortfarande bra.
actors.mobs.npcs.shopkeeper.thief=Tjuv, tjuv!
actors.mobs.npcs.shopkeeper.warn=Se upp! Jag kommer inte att varna dig igen.
actors.mobs.npcs.vaultlaser.desc=Denna vaktpost avfyrar lasrar med jämna mellanrum. _Eftersom detta bara är ett testområde kommer lasrarna inte att skada dig._
actors.mobs.npcs.vaultlaser.name=valvlaservakt
actors.mobs.npcs.vaultsentry.desc=Denna vaktpost skannar området i ett mönster. _Eftersom detta bara är ett testområde kommer vaktposten inte att göra någonting om den upptäcker dig._
actors.mobs.npcs.vaultsentry.name=valvskanningsvakt
actors.mobs.npcs.wandmaker.def_verb=blockerad
actors.mobs.npcs.wandmaker.desc=Denna gamle men friska herre har ett något förvirrat uttryck. Han är skyddad av en magisk sköld.
actors.mobs.npcs.wandmaker.intro_1=Jag kom hit för att hitta en sällsynt ingrediens till en trollstav, men jag har gått vilse, och min magiska sköld håller på att försvagas. Jag måste snart åka, men jag orkar inte gå utan att få det jag kom för.
actors.mobs.npcs.wandmaker.intro_2=Om du kan skaffa den åt mig, betalar jag dig gärna med en av mina fint tillverkade trollstavar! Jag tog med mig två, så du kan ta vilken du vill.
actors.mobs.npcs.wandmaker.intro_berry=Den gamla fängelsevakten hade en _rotbärsplanta_, och jag är ute efter ett av dess frön. Plantan har förmodligen förvildats vid det här laget, så det kan vara knepigt att få den att ge ifrån sig ett frö. Dess trädgård borde finnas någonstans här i närheten. Försök att _hålla dig borta från dess vinrankepiskar_ om du vill hålla dig i ett stycke. Att använda eld kan vara frestande, men gör det inte, du kommer att döda plantan och förstöra dess frön.
actors.mobs.npcs.wandmaker.intro_cleric=Åh, hej Ers Höghet! Vilken trevlig överraskning att möta er på en så deprimerande plats! Jag ogillar att påtvinga er något, men jag kanske har en uppgift åt er.
actors.mobs.npcs.wandmaker.intro_duelist=Åh, hej fröken! Vilken trevlig överraskning att möta en hjälte på en så deprimerande plats! Om du har lust att hjälpa en gammal man, kanske jag har en uppgift åt dig.
actors.mobs.npcs.wandmaker.intro_dust=Jag letar efter lite _likdamm_. Det är en speciell sorts förbannat benmjöl som vanligtvis dyker upp på sådana här platser. Det borde finnas ett barrikaderat rum här någonstans, jag är säker på att det kommer att dyka upp lite damm där. Var dock försiktig, förbannelsen som dammet bär med sig är ganska stark, _kom tillbaka till mig så fort du kan_ så ska jag rena det åt dig.
actors.mobs.npcs.wandmaker.intro_ember=Jag letar efter lite _färska glödande bloss_ från en nyfödd eldelemental. Elementaler dyker vanligtvis upp när en åkallande ritual inte är kontrollerad, så hitta bara några ljus och en rituell plats så är jag säker på att du kan få en att dyka upp. Du bör _undvika att boxa in dig själv_ medan du kämpar mot den, eller så kan du _ha någon form av frysande föremål till hands._ Nyfödda elementaler är ganska kraftfulla och kaotiska, men de tål inte kyla.
actors.mobs.npcs.wandmaker.intro_huntress=Åh, hej fröken! Ett vänligt ansikte är en trevlig överraskning här nere, eller hur? Jag svär faktiskt att jag har sett ditt ansikte förut, men jag kan inte sätta fingret på det... Strunt samma, om du är här för äventyrs skull kanske jag har en uppgift åt dig.
actors.mobs.npcs.wandmaker.intro_mage=Åh, hej %s! Jag hörde att det var lite uppståndelse mellan dig och trollkarlsinstitutet? Strunt samma, jag har aldrig gillat de där stick-i-lejan ändå. Om du är villig kanske jag har en uppgift till dig.
actors.mobs.npcs.wandmaker.intro_rogue=Åh herregud, du skrämde mig! Jag har inte träffat en bandit från den här platsen som fortfarande har sitt förstånd kvar, så du måste vara från ytan! Om du är sugen på att hjälpa en främling kanske jag har en uppgift åt dig.
actors.mobs.npcs.wandmaker.intro_warrior=Åh, hej där! Vilken trevlig överraskning att möta en krigare från norr på en så deprimerande plats! Du måste ha rest ganska långt för att komma hit. Om du letar efter äventyr kanske jag har en uppgift åt dig.
actors.mobs.npcs.wandmaker.name=gammal trollstavmakare
actors.mobs.npcs.wandmaker.reminder_berry=Någon tur med ett Rotberry-frö, %s? Leta efter ett rum fyllt med växtlighet.
actors.mobs.npcs.wandmaker.reminder_dust=Någon tur med likdamm, %s? Leta efter några barrikader.
actors.mobs.npcs.wandmaker.reminder_ember=Någon tur med glöden, %s? Du behöver hitta fyra ljus och ritualplatsen.
actors.mobs.phantompiranha.desc=Fantompirayar är en sällsynt pirayorart med magiska förmågor och kusliga genomskinliga kroppar. De kan teleportera sig när de attackeras, antingen för att fly eller för att snabbt komma nära sin fiende! \n\nÄven om de är irriterande att slåss mot, är deras kött uppskattat för sina magiska egenskaper.
actors.mobs.phantompiranha.name=fantompiraya
actors.mobs.phantompiranha.teleport_away=Fantompirayan teleporterar sig bort...
actors.mobs.piranha.desc=Dessa köttätande fiskar är specifikt avlade för att skydda översvämmade områden. Deras bett är dödligt, så det är bäst att undvika att konfrontera dem direkt.
actors.mobs.piranha.discover_hint=Du kan hitta den här fienden var som helst i fängelsehålan.
actors.mobs.piranha.name=jättepiraya
actors.mobs.pylon.desc_active=En kraftpylon, avsedd att hjälpa till att reglera elektriciteten som driver maskineriet i detta område. Pylonen svämmar just nu över med elektrisk energi, det måste vara detta som överladdar DM-300!\n\nI detta tillstånd är pyloner sårbara, men kommer att skicka elektricitet till närliggande celler i ett medurs mönster. På grund av sin tunga metallkonstruktion är pyloner motståndskraftiga mot stora mängder skador.
actors.mobs.pylon.desc_inactive=En kraftpylon, avsedd att hjälpa till att reglera elektriciteten som driver maskineriet i detta område. \n\nPylonen är för närvarande inaktiv och immun mot skador.
actors.mobs.pylon.name=kraftpylon
actors.mobs.rat.desc=Pungråttor är aggressiva men ganska svaga avloppslevande. De har ett otäckt bett, men är bara livshotande i stort antal.
actors.mobs.rat.name=pungdjursråtta
actors.mobs.ripperdemon.desc=Dessa fruktansvärda varelser är resultatet av att de många dvärgliken i denna region används av demoniska krafter. Rippers är utmärglade, spöklika varelser som liknar dvärgar, men med brutna kroppar och långa, vassa klor gjorda av ben. \n\nRipper-demoner är inte särskilt hållbara, men de är smidiga och farliga. De kan hoppa långa sträckor för att snabbt nå mål innan de stångas i dem med sina klor.
actors.mobs.ripperdemon.leap=Ripperdemonen gör sig redo att hoppa!
actors.mobs.ripperdemon.name=ripper-demonen
actors.mobs.rotheart.desc=En rotbärs frukt är mycket unik. Istället för att ruttna bort och ge näring, växer frukten, hårdnar och omsluter kärnan. Den ger skydd för de inre organen som växer inuti frukten. Denna gigantiska klot kallas hjärtat i en vuxen rotbärsplanta.
actors.mobs.rotheart.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.rotheart.name=ruttna hjärta
actors.mobs.rotlasher.desc=Rötpiskaren är en del av en mogen rotfruktsplantas rotstruktur och även deras primära försvarsmedel. Piskarna är blinda och fastna i marken, men kommer våldsamt att attackera alla närliggande hot efter att ha tagit en stund för att upptäcka dem. När det inte finns några fiender i närheten står de orörliga och försöker smälta in i den omgivande vegetationen.
actors.mobs.rotlasher.discover_hint=Du kan hitta den här fienden under ett specifikt uppdrag.
actors.mobs.rotlasher.name=röta-skärare
actors.mobs.scorpio.desc=Dessa enorma spindelliknande demoniska varelser undviker närstrid och föredrar att avfyra förlamande tandade spikar från långa avstånd.
actors.mobs.scorpio.name=skorpion
actors.mobs.senior.desc=Dessa munkar är fanatiker som vigt sina liv åt att skydda stadens hemligheter från alla utomstående. De använder varken rustning eller vapen, utan litar helt på sin skicklighet i obeväpnad strid.
actors.mobs.senior.name=äldre munk
actors.mobs.shaman$blueshaman.spell_desc=Denna shaman bär en blå mask och kommer att använda magi som tillfälligt _ökar skadan du tar._
actors.mobs.shaman$purpleshaman.spell_desc=Denna shaman bär en lila mask och kommer att använda magi som tillfälligt _minskar din noggrannhet och undvikande förmåga._
actors.mobs.shaman$redshaman.spell_desc=Denna shaman bär en röd mask och kommer att använda magi som tillfälligt _försvagar din attackförmåga._
actors.mobs.shaman.bolt_kill=Den magiska blixten dödade dig...
actors.mobs.shaman.desc=De klokaste gnollerna kan lära sig schamanernas magi. Gnollschamaner föredrar stridsbesvärjelser för att väga upp sin brist på styrka, och tvekar inte att använda dem mot den som ifrågasätter deras ställning i stammen.
actors.mobs.shaman.name=gnoll-shaman
actors.mobs.skeleton.def_verb=blockerad
actors.mobs.skeleton.desc=Skeletten består av ben från olyckliga äventyrare och andra invånare i fängelsehålan, väckta till liv av ond magi från djupet. När de tagit tillräckligt med skada faller de sönder i ett regn av ben.
actors.mobs.skeleton.explo_kill=Du dödades av benexplosionen...
actors.mobs.skeleton.name=skelett
actors.mobs.slime.def_verb=blockerad
actors.mobs.slime.desc=Slem är märkliga, lätt magiska varelser med en gummiaktig yttre kropp och en flytande kärna. Stadens avlopp förser dem med rikligt med vatten och näringsämnen. \n\n På grund av deras elastiska yttre membran är det svårt att göra mer än _6% skada_ på slem från en enda attack.
actors.mobs.slime.name=slem
actors.mobs.snake.desc=Dessa överdimensionerade ormar kan snabbt slingra sig runt slag, vilket gör dem ganska svåra att träffa. Magiska attacker eller överraskningsattacker kan dock överraska dem. \n\nDu kan utföra en överraskningsattack genom att attackera medan du är utom synhåll för ormen. Ett sätt är att låta en orm jaga dig genom en dörröppning och sedan _slå till precis efter att den rör sig in i dörren._
actors.mobs.snake.hint=Försök att använda undersökningsknappen på en orm för att lära dig hur du motverkar dem.
actors.mobs.snake.name=avloppsorm
actors.mobs.spectralnecromancer.desc=Medan skelett är en nekromantikers vardagsmat, föredrar vissa att titta på andra mindre kroppsliga undersåtar. Spektrala nekromanter har valt vålnader som sina favoritundersåtar! \n\nEnskilda vålnader är inte lika starka som skelett, men dessa nekromanter är inte rädda för att kalla fram en massa av dem!
actors.mobs.spectralnecromancer.name=spektral nekromantiker
actors.mobs.spinner.desc=Dessa grönaktiga, håriga grottspindlar undviker helst närstrid. De väntar på avstånd medan offret, fångat i deras nät, långsamt dör av det giftiga bettet.
actors.mobs.spinner.name=grottspinnare
actors.mobs.statue.def_verb=blockerad
actors.mobs.statue.desc=Man skulle kunna tro att det bara är ytterligare en av den här fängelsehålans livlösa statyer, men dess röda glödande ögon avslöjar det.
actors.mobs.statue.desc_weapon=Även om statyn i sig är gjord av sten, ser _%s_ som den svingar verklig ut.
actors.mobs.statue.discover_hint=Du kan hitta den här fienden var som helst i fängelsehålan.
actors.mobs.statue.name=animerad staty
actors.mobs.succubus.desc=Succubor är demoner som ser ut som förföriska flickor med en något gotisk stil. Med sin magi kan de förtrolla en hjälte, som då inte kan angripa någon förrän förtrollningen släpper.
actors.mobs.succubus.name=succubus
actors.mobs.swarm.desc=Den dödliga flugsvärmen surrar ilsket. Varje icke-magisk attack kommer att dela upp den i två mindre men lika farliga svärmar.
actors.mobs.swarm.name=svärm av flugor
actors.mobs.tengu$bombability$bombblob.desc=Ett moln av överhettad rök väller upp här. Se upp, det kommer att explodera!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Den sitter fast i marken, du kan inte flytta den!
actors.mobs.tengu$bombability$bombitem.desc=Tengu har kastat hit en konstig rökbomb, som böljar ut en tjock, het rök. Den tickar högt, som om den räknar ner till en explosion! \n\n Bomben har förankrat sig i marken, så du kan inte lyfta den.
actors.mobs.tengu$bombability$bombitem.name=rökbomb
actors.mobs.tengu$fireability$fireblob.desc=Tengu har kastat ett fint pulver som verkar börja ta fart här, det är på väg att antändas!
actors.mobs.tengu$shockerability$shockerblob.desc=Elektrisk energi byggs upp här, allt som står på den här plattan kommer att chockas nästa tur!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Den drar för mycket ström, du kan inte ta tag i den!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu har kastat hit en märklig maskin, som verkar vara gjord av DM-100-delar. Maskinen utsänder ständigt elektricitet med ljusbågar runt sig, men den verkar röra sig i ett förutsägbart mönster. \n\nMed all elektricitet som utsänds runt den finns det inget sätt att du kan förstå detta.
actors.mobs.tengu$shockerability$shockeritem.name=Rysare
actors.mobs.tengu.defeated=Äntligen fri...
actors.mobs.tengu.desc=Tengu tillhör en uråldrig lönnmördarklan med samma namn. De är kända för sin flitiga användning av kaststjärnor och fällor.
actors.mobs.tengu.interesting=Låt oss göra det här intressant...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Förstår du, %s!
actors.mobs.tengu.notice_have=Jag har dig nu, %s!
actors.mobs.tengu.rankings_desc=Mördad av Tengu
actors.mobs.thief.carries=Tjuven bär på en _%s._ Uppenbarligen stulen.
actors.mobs.thief.desc=Även om dessa fångar strövar fritt från sina celler, är den här platsen fortfarande deras fängelse. Med tiden har platsen tagit deras sinnen såväl som deras frihet. För länge sedan har dessa galna tjuvar och banditer glömt vilka de är och varför de stjäl. \n\nDessa fiender är mer benägna att stjäla och fly än att slåss. Se till att hålla dem inom synhåll, annars kanske du aldrig ser ditt stulna föremål igen.
actors.mobs.thief.escapes=Tjuven kommer undan med din %s!
actors.mobs.thief.name=galen tjuv
actors.mobs.thief.stole=Tjuven stal %s från dig!
actors.mobs.tormentedspirit.desc=Plågade andar är annars godmodiga andar som har drabbats av en förbannelse. Så länge de är förbannade kommer de att attackera precis som en vålnad, och är också mäktigare! \n\nDet kan vara möjligt att rena förbannelsen genom att använda rätt föremål när man är bredvid anden. Om förbannelsen hävs kommer anden säkert att vara tacksam...
actors.mobs.tormentedspirit.name=plågad ande
actors.mobs.tormentedspirit.thank_you=Tack så mycket...
actors.mobs.vaultrat.desc=Den här råttan har gjort några beteendeförändringar för att testa sin nya valvfiender-AI:\n_-_ Dess rörelse kan "höras" genom väggar\n_-_ Den kommer att vandra längs en förinställd patrull\n_-_ Medan den vandrar har den kraftigt minskat detekteringsavstånd bakom den riktning den rör sig i.\n_-_ Medan den sover minskar också dess detekteringsavstånd\n_-_ När den upptäcker dig kommer den att "undersöka" innan den byter till jakt. Undersökande fiender rör sig mot dig men attackerar inte och är lättare att förlora bakom dörrar och hörn.
actors.mobs.warlock.bolt_kill=Skuggblixten dödade dig...
actors.mobs.warlock.desc=När dvärgarnas intresse skiftade från ingenjörskonst till magi tog häxmästarna makten i staden. De började med elementarmagi, men övergick snart till demonologi och nekromanti.
actors.mobs.warlock.name=dvärghäxmästare
actors.mobs.wraith.desc=En vålnad är en hämndlysten ande hos en syndare, vars grav eller grav har blivit störd. Eftersom den är en eterisk varelse är den mycket svår att träffa med ett vanligt vapen.
actors.mobs.wraith.discover_hint=Du kan hitta den här fienden var som helst i fängelsehålan.
actors.mobs.wraith.name=vålnad
actors.mobs.yogdzewa$larva.desc=Dessa små avkommor av Yog-Dzewa är enkla undersåtar som är lätta att producera. Även om de är individuellt svaga, kallas de snabbt och kan bli överväldigande i stora antal.
actors.mobs.yogdzewa$larva.name=guds larv
actors.mobs.yogdzewa$larva.rankings_desc=Slukad av Yog-Dzewa
