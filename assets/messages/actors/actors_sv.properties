actors.mobs.yogdzewa$yogscorpio.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogdzewa.darkness=Mörkret drar sig närmare...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa är en gammal gud; ett stort monstruös väsen som når in i dödliga världar och slukar dem för att ge näring åt dess oändliga tillväxt. Dvärgarna måste ha lockat till sig uppmärksamheten från denna kosmiska skräck när de lekte med mörk magi, och har försökt hålla den innesluten sedan dess. \n\n Yog-Dzewa härstammar från en dimension av rått magiskt kaos och kan inte föra sin sanna form in i denna värld. Istället har den skapat avatarer och kallat fram demoniska minions för att göra sin budgivning här. \n\n Detta gigantiska öga är fokuspunkten för Yog-Dzewas kraft i denna värld. Medan ögat i sig är orörligt, kan det skjuta kraftfulla strålar av demonisk magi och kalla fram en mängd olika minions för att hjälpa det.
actors.mobs.yogdzewa.desc_spawners=Du kan känna vågor av demonisk energi stråla ut mot ögat från våningarna ovanför. Något du lämnade vid liv där uppe måste kanalisera kraft tillbaka till Yog-Dzewa. _Yog kommer att använda den här energin för att kalla fram kraftfullare hantlangare!_
actors.mobs.yogdzewa.hope=DITT. HOPP. ÄR. EN. ILLUSION!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=JAG. SER. DIG.
actors.mobs.yogdzewa.rankings_desc=Slukad av Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Denna knytnäve är formad av ren ljusenergi. Den kan skjuta kraftfulla strålar av brännande ljus varje tur! Dessa strålar kommer tillfälligt att blända dig förutom att orsaka stor skada. Knutnäven kan också kortvarigt uppsluka arenan i bländande ljus för att fly! \n\n Knutnäven har dock inga speciella förmågor som den kan använda i närstridsavstånd.
actors.mobs.yogfist$brightfist.name=ljus näve
actors.mobs.yogfist$brightfist.teleport=Näven teleporterar sig bort i en ljusblixt som allvarligt bländar dig!
actors.mobs.yogfist$burningfist.desc=En stor näve omsluten av eld. Fingrarna knastrar när de knyts och strör glöd över golvet.
actors.mobs.yogfist$burningfist.name=brinnande näve
actors.mobs.yogfist$darkfist.desc=Denna knytnäve är formad av ren mörk energi. Den kan avfyra kraftfulla explosioner av mörk magi varje tur! Dessa explosioner kommer att försvaga din ljuskälla förutom att orsaka stor skada. Knutnäven kan också kort omsluta arenan i mörker för att fly! \n\n Knutnäven har dock inga speciella förmågor som den kan använda i närstridsavstånd.
actors.mobs.yogfist$darkfist.name=mörk näve
actors.mobs.yogfist$darkfist.teleport=Näven teleporterar sig bort i en mörkerexplosion som släcker din ljuskälla!
actors.mobs.yogfist$rottingfist.desc=En väldig näve av ruttnande kött. Illaluktande slem sipprar mellan fingrarna och fläckar stenen under den.
actors.mobs.yogfist$rottingfist.name=ruttnande näve
actors.mobs.yogfist$rustedfist.desc=Denna knytnäve är formad av levande metall. Det är en tornhög massa av skiftande metall som har kraftfulla närstridsattacker och kan lamslå sina mål på avstånd. På grund av sin enorma massa kommer knytnäven att ta all skada som tillfogas den över tid, istället för omedelbart. \n\nKnytnäven är dock oflexibel och kan inte röra sig in i trånga passager. Dessutom, även om den kan ta skada långsamt, kommer den uppskjutna skadan att fortsätta att öka om knytnäven träffas flera gånger.
actors.mobs.yogfist$rustedfist.name=rostig näve
actors.mobs.yogfist$soiledfist.desc=Denna näve är formad av kaotisk jordmagi. När den rör sig kommer den ständigt att få vegetation att spira runt den. Den kan också avfyra koncentrerade jordexplosioner som snärjer dess mål i snabbt växande vinrankor och rötter! \n\nNäven får kraft från detta växtliv och kommer att motstå skador baserat på mängden hög eller fårad vegetation i närheten!
actors.mobs.yogfist$soiledfist.name=smutsig näve
actors.mobs.yogfist.desc=Denna knytnäve är en aspekt av Yog-Dzewas kraft. Nävar är kopplade till Yog-Dzewas kraft och skyddas från all skada när de är nära ögat.
actors.mobs.yogfist.invuln_warn=Näven är osårbar när den är nära ögat!
actors.mobs.yogfist.rankings_desc=Slukad av Yog-Dzewa
