actors.blobs.blizzard.desc=En snöstorm virvlar här.
actors.blobs.blizzard.name=snöstorm
actors.blobs.confusiongas.desc=Ett moln av förvirringsgas virvlar här.
actors.blobs.confusiongas.name=förvirringsgas
actors.blobs.corrosivegas.desc=Ett moln av dödlig frätande gas virvlar här.
actors.blobs.corrosivegas.name=frätande gas
actors.blobs.electricity.desc=Ett elektriskt fält gnistrar starkt här.
actors.blobs.electricity.name=elektricitet
actors.blobs.electricity.ondeath=Du blev dödschockad...
actors.blobs.electricity.rankings_desc=Elektrostöt
actors.blobs.fire.desc=En eld rasar här.
actors.blobs.fire.name=brand
actors.blobs.foliage.desc=Ljusstrimlor genomtränger den underjordiska trädgårdens mörker.
actors.blobs.foliage.name=lövverk
actors.blobs.freezing.desc=Luften är onaturligt iskall här.
actors.blobs.freezing.name=frysande luft
actors.blobs.goowarn.desc=Fläckar av mörk energi svärmar här!
actors.blobs.goowarn.name=mörk energi
actors.blobs.inferno.desc=Ett inferno rasar här.
actors.blobs.inferno.name=inferno
actors.blobs.paralyticgas.desc=Ett moln av paralytisk gas virvlar här.
actors.blobs.paralyticgas.name=paralytisk gas
actors.blobs.regrowth.name=återväxt
actors.blobs.sacrificialfire.desc=Det finns ett altare här med en brinner offereld ovanpå. Varje varelse som dödas här kommer att förtäras som ett offer till fängelsehålans andar. \n\nKanske en belöning kommer att ges om tillräckligt många uppoffringar görs?
actors.blobs.sacrificialfire.name=offereld
actors.blobs.sacrificialfire.reward=Elden blossar upp och slocknar sedan, och lämnar en belöning efter sig!
actors.blobs.sacrificialfire.unworthy=Elden förtär ditt offer, men förändras inte.
actors.blobs.sacrificialfire.worthy=Elden förtär ditt offer och blir starkare.
actors.blobs.smokescreen.desc=Ett moln av tjock svart rök virvlar här.
actors.blobs.smokescreen.name=rökridå
actors.blobs.stenchgas.desc=Ett moln av stinkande stank virvlar här.
actors.blobs.stenchgas.name=stankgas
actors.blobs.stormcloud.desc=Ett moln av böljande vattenånga virvlar här.
actors.blobs.stormcloud.name=stormmoln
actors.blobs.toxicgas.desc=Ett grönaktigt moln av giftig gas virvlar här.
actors.blobs.toxicgas.name=giftig gas
actors.blobs.toxicgas.ondeath=Du dog av den giftiga gasen...
actors.blobs.toxicgas.rankings_desc=Kvävd
actors.blobs.waterofawareness.desc=Kunskapens kraft utstrålar från vattnet i denna brunn. Att dricka från brunnen kommer att identifiera alla utrustade föremål, identifiera förbannelser på alla föremål i ditt inventarium och avslöja alla föremål på den aktuella våningen.
actors.blobs.waterofawareness.name=medvetandets vatten
actors.blobs.waterofawareness.procced=När du tar en klunk känner du hur kunskap strömmar in i ditt sinne.
actors.blobs.waterofhealth.desc=Hälsokraft utstrålar från vattnet i denna brunn. Att dricka från denna brunn kommer att läka dina sår, stilla hunger och rena förbannelser på alla slitna föremål.
actors.blobs.waterofhealth.name=hälsans vatten
actors.blobs.waterofhealth.procced=När du tar en klunk känner du att dina sår läker helt.
actors.blobs.web.desc=Ett tjockt nät täcker allt här. Allt som rör vid eller kastas genom nätet kommer att bryta det, men kommer också att fastna på plats.
actors.blobs.web.name=spindelnät
actors.buffs.adrenaline.desc=En våg av fysisk kraft, adrenalin förstärkte både attack- och rörelsehastighet. \n\nAdrenalin låter sitt mål springa med 2x hastighet och attackera med 1,5x hastighet. \n\n Återstående turar: %s.
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenalinesurge.desc=En våg av stor makt, men tyvärr inte permanent.\n\nStyrkeökning: +%d.\nVänder sig tills boosten försvagas: %s.
actors.buffs.adrenalinesurge.name=styrkeökning
actors.buffs.amok.desc=Amok orsakar ett tillstånd av stor ilska och förvirring hos sitt mål.\n\nNär en varelse är amokad, attackerar den vad som helst som finns i närheten, oavsett om det är vän eller fiende.\n\nÅterstående amok-omgångar: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=En tunn sköld omger dig och blockerar en del av skadan från magiska attacker.\n\nDin magiska rustning förstärks för närvarande av: 0-%d.\n\nVänder sig tills den mystiska rustningen försvagas: %s.
actors.buffs.arcanearmor.name=svårbegriplig rustning
actors.buffs.artifactrecharge.desc=Energi flödar genom dig, vilket ökar hastigheten som dina utrustade artefakter laddas.\n\nVarje artefakt påverkas lite olika, men de kommer alla att laddas mycket snabbare än normalt.\n\nÅterstående turar: %s.
actors.buffs.artifactrecharge.name=artefaktuppladdning
actors.buffs.ascensionchallenge.almost=Du känner att Yogs grepp om amuletten börjar försvagas, du är nästan där!
actors.buffs.ascensionchallenge.beckon=Amuletten börjar ropa på avlägsna fiender.
actors.buffs.ascensionchallenge.break=Du tar en stund för att hämta andan och känner att dina sår börjar sluta sig!
actors.buffs.ascensionchallenge.damage=Amuletten börjar utstråla mörk energi. Den brinner!
actors.buffs.ascensionchallenge.desc=På något sätt behåller Yog-Dzewa sitt inflytande på den här världen genom amuletten och försöker stoppa din uppstigning! \n\nYogs kraft gör fängelsehålan mycket farligare, vilket ökar antalet fiender och gör dem starkare! Denna kraft kommer att fortsätta byggas om den lämnas okontrollerad, den kan försvagas genom att besegra fiender som har förstärkts av Yogs kraft.
actors.buffs.ascensionchallenge.desc_beckon=Amuletten ropar just nu på avlägsna fiender och varnar dem om din position.
actors.buffs.ascensionchallenge.desc_clear=Den mörka energin som strålar ut från amuletten har försvagats så mycket som möjligt för nu.
actors.buffs.ascensionchallenge.desc_damage=Energin från amuletten har blivit så stark att den _direkt skadar dig!_
actors.buffs.ascensionchallenge.desc_haste=Amuletten _påskyndar för närvarande avlägsna fiender_ och låter dem nå dig snabbare!
actors.buffs.ascensionchallenge.desc_slow=Amuletten _saktar ner dig_ och motverkar hastighetsökningseffekter!
actors.buffs.ascensionchallenge.haste=Amuletten börjar påskynda avlägsna fiender!
actors.buffs.ascensionchallenge.name=amulettens förbannelse
actors.buffs.ascensionchallenge.on_kill=Den mörka energin förbrukar dig...
actors.buffs.ascensionchallenge.slow=Amuletten börjar kännas som en blyvikt i ditt inventarium!
actors.buffs.ascensionchallenge.weaken=Du kan känna att amulettens förbannelse försvagas något.
actors.buffs.ascensionchallenge.weaken_info=Amulettens förbannelse kan försvagas genom att besegra fler fiender.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Om du besegrar fiender kommer amulettens förbannelse att försvagas!
actors.buffs.barkskin.desc=Din hud är härdad, den känns grov och fast som bark.\n\nDen härdade huden ökar din effektiva rustning, vilket gör att du bättre kan försvara dig mot fysiska attacker.\n\nDin rustning är för närvarande ökad med: 0-%d.\nVänder sig tills barkskinnet försvagas: %s.\n\nOm du får barkskinnet från flera källor kommer endast den starkaste att gälla.
actors.buffs.barkskin.name=barkhud
actors.buffs.barrier.desc=En hållbar kraftbubbla som blockerar all skada.\n\nBarriären tar skada för vad den än skyddar så länge det finns skärmning kvar. Skärmen kommer också långsamt att förfalla med tiden.\n\nÅterstående skärmning: %d.
actors.buffs.barrier.name=barriär
actors.buffs.berserk.action_name=Bärsärk
actors.buffs.berserk.angered=ilskad
actors.buffs.berserk.angered_desc=Allvaret av Berserkerns skador förstärker hans slag. Allt eftersom berserkern tar fysisk skada kommer hans raseri att byggas upp, vilket ger honom bonusskada. Skada som blockeras av rustning räknas fortfarande mot att bygga upp raseri. \n\n Raseri kommer att avta med tiden. Ju lägre berserkerns hälsa är, desto längre kommer den att vara. \n\nVid 100%% raseri kan Berserkern gå berserker, vilket ger honom sköld baserat på nivån på hans rustning och hans saknade hälsa. Under bärsärkagången förfaller hans sköld med tiden och när den tar slut måste han vila innan han bygger upp ilska igen.\n\nNuvarande ilska: _%1$.0f%%_\n_+%2$.0f%%_ skada\n\nBersärkagångssköld med nuvarande rustning och HP: _%3$d_
actors.buffs.berserk.berserk=bärsärkagång
actors.buffs.berserk.berserk_desc=Rädsla och osäkerhet försvinner och lämnar bara ilska. I detta tillstånd är Berserkern extremt kraftfull och _gör +50%% skada och får bonussköld,_ men förlorar också sköld varje tur.\n\nNär all hans sköld är reducerad till 0, kommer berserken att upphöra.\n\nEfter att ha rasat måste Berserkern återhämta sig innan han kan bygga upp ilska igen.\n\nÅterstående sköld: %d
actors.buffs.berserk.exhausted=utmattad
actors.buffs.berserk.no_seal=Du behöver ditt brutna sigill för att gå bärsärkagång!
actors.buffs.berserk.rankings_desc=Berserkad till döds
actors.buffs.berserk.recovering=återhämta sig
actors.buffs.berserk.recovering_desc=Inre styrka har sina gränser. Berserkern måste vila innan han använder sin ilska igen. \n\n Medan Berserkern återhämtar sig bygger den inte upp någon ilska genom att ta skada.
actors.buffs.berserk.recovering_desc_levels=Nivåer tills återhämtningen är klar: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Vänder sig tills återhämtad: _%d_
actors.buffs.bleeding.desc=Det där såret läcker en oroande mängd blod.\n\nBlödning orsakar skada varje tur. Varje tur minskar skadan med en slumpmässig mängd, tills blödningen slutligen upphör.\n\nAktuell blödningsskada: %d.
actors.buffs.bleeding.heromsg=Du blöder!
actors.buffs.bleeding.name=blödning
actors.buffs.bleeding.ondeath=Du förblödde...
actors.buffs.bleeding.rankings_desc=Förblödde till döds
actors.buffs.bless.desc=En stor fokusexplosion, vissa säger att den är inspirerad av gudarna.\n\nVälsignelse ökar precision och undvikande med 25%%, vilket gör de välsignade mycket mer effektiva i strid.\n\nÅterstående välsignelseomgångar: %s.
actors.buffs.bless.name=välsignad
actors.buffs.blindness.desc=Blindning förvandlar omvärlden till ett mörkt dis.\n\nMedan en karaktär är bländad reduceras hans synfält till en ruta, vilket gör distansattacker värdelösa och gör det mycket lätt att tappa bort koll på avlägsna fiender. Dessutom kan en bländad hjälte inte läsa skriftrullar eller böcker.\n\nÅterstående blindhetsgrader: %s.
actors.buffs.blindness.heromsg=Du är förblindad!
actors.buffs.blindness.name=förblindad
actors.buffs.blobimmunity.desc=Någon märklig kraft omsluter dig i en tunn skyddande barriär som blockerar alla skadliga luftburna effekter.\n\nDu är immun mot alla områdesbundna effekter så länge denna barriär varar.\n\nÅterstående immunitetsomgångar: %s.
actors.buffs.blobimmunity.name=reningsbarriär
actors.buffs.burning.burnsup=%s brinner upp!
actors.buffs.burning.desc=Få saker är mer plågsamma än att vara uppslukad av lågor.\n\nEld gör skada varje gång tills den släcks av vatten eller dör ut. Eld kan släckas genom att man kliva i vatten eller genom stänket från en krossande dryck.\n\nDessutom kan elden antända brandfarlig terräng eller föremål som den kommer i kontakt med.\n\nÅterstående brinntider: %s.
actors.buffs.burning.heromsg=Du fattar eld!
actors.buffs.burning.name=brinnande
actors.buffs.burning.ondeath=Du brann ihjäl...
actors.buffs.burning.rankings_desc=Bränd till aska
actors.buffs.championenemy$antimagic.desc=Antimagiska mästare tar 50 % mindre skada och är helt immuna mot magiska effekter.
actors.buffs.championenemy$antimagic.name=antimagisk mästare
actors.buffs.championenemy$blazing.desc=Flammande mästare gör 25 % mer närstridsskada, antänder fiender de attackerar, är immuna mot eld och sprider eld runt dem när de dör. De kan dock inte sprida eld på vatten.
actors.buffs.championenemy$blazing.name=flammande mästare
actors.buffs.championenemy$blessed.desc=Välsignade mästare har 4x precision och undvikande.
actors.buffs.championenemy$blessed.name=välsignad mästare
actors.buffs.championenemy$giant.desc=Jättemästare tar 80 % mindre skada och har +1 attackräckvidd, men kan inte röra sig genom slutna utrymmen.
actors.buffs.championenemy$giant.name=jättemästare
actors.buffs.championenemy$growing.desc=Växande mästare får en stadigt ökande bonus för precision, undvikande, fysisk skada och en minskning av skada som tas.\n\nNuvarande ack/evak/skada-boost: %1$d%%\nNuvarande skademinskning: %2$d%%
actors.buffs.championenemy$growing.name=växande mästare
actors.buffs.championenemy$projecting.desc=Projicerande mästare gör 25 % mer närstridsskada och har +3 attackräckvidd.
actors.buffs.championenemy$projecting.name=projekterande mästare
actors.buffs.championenemy.warn=Du anar en dödlig närvaro.
actors.buffs.charm.cant_attack=Du är charmad av den fienden och kan inte attackera dem.
actors.buffs.charm.desc=En besvärjelse är manipulativ magi som kan få fiender att tillfälligt avguda varandra.\n\nKaraktärer som påverkas av besvärjelse kan inte direkt attackera fienden de är besvärjda av. Att attackera andra mål är dock fortfarande möjligt. Smärtchocken kommer att minska besvärjelsens varaktighet.\n\nÅterstående besvärjelseomgångar: %s.
actors.buffs.charm.heromsg=Du är charmad!
actors.buffs.charm.name=betagen
actors.buffs.chill.desc=Inte riktigt frusen, men fortfarande alldeles för kall.\n\nKylda mål utför alla handlingar långsammare, beroende på hur många varv som är kvar i effekten. I värsta fall motsvarar detta att bli långsammare.\n\nÅterstående varv av kyla: %1$s.\nHastigheten minskas med: %2$s%%
actors.buffs.chill.freezes=%s fryser!
actors.buffs.chill.name=kyld
actors.buffs.combo$combomove.clobber.desc=Slår tillbaka en fiende 2 brickor, men gör ingen skada och kan inte slå ner i gropar. Ökar kombinationen med 1.
actors.buffs.combo$combomove.clobber.empower_desc=Slår tillbaka en fiende _3 brickor, orsakar yrsel och kan slå ner i gropar,_ men gör ingen skada. Ökar kombinationen med 1.
actors.buffs.combo$combomove.clobber.name=klämma
actors.buffs.combo$combomove.crush.desc=Gör %d%% (kombination*25%%) skada på det primära målet och hälften av den skadan på alla andra fiender i ett 7x7 AOE. Återställer kombinationen när den används.
actors.buffs.combo$combomove.crush.empower_desc=_Hopper upp till %1$d-ruta(or)_ och gör %2$d%% (kombination*25%%) skada på det primära målet och hälften av den skadan på alla andra fiender i en 7x7 AOE. Återställer kombinationen när den används.
actors.buffs.combo$combomove.crush.name=krossa
actors.buffs.combo$combomove.fury.desc=Träffar en fiende en gång för varje kombination du har, varje träff gör 60 % skada och kan utlösa förtrollningar. Återställer kombinationen när den används.
actors.buffs.combo$combomove.fury.empower_desc=_Hopper upp till %d-ruta(or)_ och träffar en fiende en gång för varje kombination du har, varje träff gör 60%% skada och kan utlösa förtrollningar. Återställer kombinationen när den används.
actors.buffs.combo$combomove.fury.name=raseri
actors.buffs.combo$combomove.parry.desc=Blockerar nästa attack inom 1 tur när den aktiveras, och hämnas omedelbart på den. Återställer kombinationen om ingenting pareras.
actors.buffs.combo$combomove.parry.empower_desc=Blockerar _alla attacker_ inom 1 tur när den aktiveras, och hämnas omedelbart på dem. Återställer kombinationen om ingenting pareras.
actors.buffs.combo$combomove.parry.name=parera
actors.buffs.combo$combomove.slam.desc=Ger %d%% (kombination*20%%) av din skadablockerande kraft som bonusskada. Återställer kombinationen när den används.
actors.buffs.combo$combomove.slam.empower_desc=_Hopper upp till %1$d-ruta(or)_ och delar ut %2$d%% (kombination*20%%) av din skadablockerande kraft som bonusskada. Återställer kombinationen när den används.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo.action_name=kombinationsattack
actors.buffs.combo.bad_target=Du måste rikta in dig på en fiende inom attackräckhåll.
actors.buffs.combo.combo=%d succékombination!
actors.buffs.combo.desc=Gladiatorn bygger momentum när han landar framgångsrika slag. Varje attack ökar komboräknaren med ett, men om det tar för lång tid mellan träffarna återställer komboräknaren till 0. Så länge gladiatorn har kombo kommer eventuellt skydd från hans brutna sigill inte att börja blekna.\n\nAtt bygga kombo låser upp speciella komboattacker som inte kan missas! En annan attack låses upp vid komboantal 2, 4, 6, 8 och 10. Vissa drag återställer kombon och andra inte, men varje drag kan bara användas en gång per kombosession.\n\nAktuell kombo: %1$d.\n\nVänder tills kombon förloras: %2$s.
actors.buffs.combo.name=kombination
actors.buffs.combo.prompt=Välj ett mål att attackera.
actors.buffs.corrosion.desc=Kraftfull syra smälter bort kött, metall och ben i en alarmerande hastighet. \n\nKorrosionsskador ökar med tiden, allt eftersom målet fortsätter att smälta bort. \n\nÅterstående korrosionsomgångar: %1$s. \nNuvarande korrosionsskador: %2$d.
actors.buffs.corrosion.heromsg=Du smälter!
actors.buffs.corrosion.name=korrosion
actors.buffs.corrosion.ondeath=Du smälter bort...
actors.buffs.corrosion.rankings_desc=Upplöst
actors.buffs.corruption.desc=Korruption sipprar in i en varelses essens och vrider dem mot deras tidigare natur. \n\n Korrupta varelser kommer att attackera sina allierade och ignorera sina tidigare fiender. Korruption är också skadlig och kommer långsamt att få sitt mål att duka under. \n\n Korruption är permanent, dess effekter slutar bara i döden.
actors.buffs.corruption.name=korrupt
actors.buffs.cripple.desc=Du är ganska säker på att benen inte är menade att böjas på det sättet.\n\nKripplad halverar rörelsehastigheten, vilket gör att det vanligtvis tar två varv istället för ett att flytta en platta.\n\nÅterstående varv för krippel: %s
actors.buffs.cripple.heromsg=Du är förlamad!
actors.buffs.cripple.name=lam
actors.buffs.daze.desc=Ringande öron och suddig syn gör det svårt att slåss.\n\nMedan man är omtöcknad minskar precisionen och undvikandet med 50%%, vilket gör både landning och undvikande av slag mycket svårare.\n\nÅterstående omgångar av omtöcknad: %s.
actors.buffs.daze.heromsg=Du är förvirrad!
actors.buffs.daze.name=förvirrad
actors.buffs.degrade.desc=Kraftfull mörk magi tär på den styrka som uppgraderingsrullar har tillämpat på din utrustning!\n\nMedan den är degraderad kommer uppgraderad utrustning att behandlas som om den har en lägre nivå än den faktiskt är. _Varje uppgradering efter +3 blir exponentiellt svagare än den föregående._ Beskrivningarna av dina föremål kommer att ändras för att återspegla deras reducerade kraftnivå.\n\nNedbrytning påverkar inte styrkekrav, trollstavladdningar, hållbarheten hos kastade vapen eller artefakter.\n\nÅterstående nedbrytningsomgångar: %s. Att använda en uppgraderingsrulle eller ta bort förbannelsen avslutar degraderingen omedelbart.
actors.buffs.degrade.heromsg=Din utrustning känns svagare!
actors.buffs.degrade.name=nedbruten
actors.buffs.doom.desc=Det är svårt att fortsätta när det verkar som om universum vill att du ska dö.\n\nDömda karaktärer får +67 % skada från alla källor.\n\nDömningen är permanent, dess effekter slutar bara i döden.
actors.buffs.doom.name=dömd
actors.buffs.dread.desc=En skräck så stor att den kommer att få sitt mål att fly från fängelsehålan helt!\n\nVarelser som drabbas av skräck kommer att springa från sin motståndare i hög hastighet och kommer att försvinna från fängelsehålan helt när de är utom sikte. Fiender som besegras på detta sätt ger halv erfarenhet och släpper inga föremål. Smärtchocken kommer att minska skräckens varaktighet.\n\nÅterstående skräckomgångar: %d.
actors.buffs.dread.name=fruktan
actors.buffs.drowsy.desc=En magisk kraft gör det svårt att hålla sig vaken, efter några omgångar kommer målet att falla in i en djup magisk sömn.\n\nHjälten kan motstå dåsighet genom att ta skada eller genom att vara vid full hälsa.\n\nVändningar tills sömn: %s.
actors.buffs.drowsy.name=dåsig
actors.buffs.earthimbue.desc=Du är genomsyrad av jordens kraft!\n\nAlla fysiska attacker kommer att förskjuta jorden under fienden och lamslå dem under en kort tid.\n\nÅterstående jordgenomsyrade omgångar: %s.
actors.buffs.earthimbue.name=genomsyrad av jord
actors.buffs.enhancedrings.desc=Skurkens nyligen använda artefakt ger hans ringar kraft och ger dem +1 nivå.\n\nÅterstående turar: %s.
actors.buffs.enhancedrings.name=förstärkta ringar
actors.buffs.fireimbue.desc=Du är genomsyrad av eldens kraft!\n\nAlla fysiska attacker kommer att ha en chans att tända fiender i brand. Dessutom är du helt immun mot eldens effekter.\n\nÅterstående eldomgångar: %s.
actors.buffs.fireimbue.name=genomsyrad av eld
actors.buffs.foresight.desc=Du kan på något sätt se den omgivande terrängens layout med ditt sinne.\n\nMedan du är framför allt inställd på framsynthet avslöjas alla brickor inom en stor radie för dig, inklusive alla hemliga fällor eller dörrar.\n\nÅterstående framsynthetsomgångar: %s.
actors.buffs.foresight.name=framsynthet
actors.buffs.frost.desc=Inte att förväxla med att frysa fast, denna mer milda frysning omsluter helt enkelt målet i is.\n\nFrysning fungerar på liknande sätt som förlamning, vilket gör det omöjligt för målet att agera. Till skillnad från förlamning avbryts frysningen omedelbart om målet tar skada, eftersom isen kommer att splittras.\n\nÅterstående frystider: %s.
actors.buffs.frost.freezes=%s fryser!
actors.buffs.frost.name=frusen
actors.buffs.frostimbue.desc=Du är fylld med isande kraft!\n\nAlla fysiska attacker kommer stadigt att ge fiender kyla. Dessutom är du helt immun mot kylan.\n\nÅterstående frostomgångar: %s.
actors.buffs.frostimbue.name=genomsyrad av frost
actors.buffs.fury.desc=Du är arg, fiender kommer inte att gilla dig när du är arg.\n\nA stor ilska brinner inom dig, vilket ökar skadan du gör av fysiska attacker med 50%%.\n\nDenna ilska kommer att vara så länge du är skadad under 50%% hälsa.
actors.buffs.fury.heromsg=Du blir rasande!
actors.buffs.fury.name=rasande
actors.buffs.gravitychaostracker.desc_duration=Det är oklart hur länge effekten kommer att vara, men den kan inte vara för evigt.
actors.buffs.gravitychaostracker.desc_intro=Med några få varv kastas alla karaktärer på den aktuella fängelsehålsgolvet i en slumpmässig riktning.
actors.buffs.gravitychaostracker.desc_positive=Du och dina allierade verkar dock vara immuna.
actors.buffs.gravitychaostracker.name=gravitationskaos
actors.buffs.greaterhaste.desc=En otrolig hastighetsökning, för ett ögonblick känns det som om allt annat står stilla. \n\n Under effekterna av större hast tar rörelser ingen tid alls, men andra handlingar utförs fortfarande med normal hastighet. Varje rörelsesteg förbrukar ett varv med större hast. \n\n Återstående varv med större hast: %d.
actors.buffs.greaterhaste.name=större brådska
actors.buffs.haste.desc=Energi flödar genom dina muskler, vilket gör att du kan springa i otroliga hastigheter!\n\nMedan du är i hast kommer du att springa i 3x hastighet, men utföra alla andra åtgärder i normal hastighet.\n\nÅterstående hastvarv: %s.
actors.buffs.haste.name=brådska
actors.buffs.healing.desc=Ett magiskt botemedel får sår att slutas och kött att sys samman.\n\nVarje tur kommer hälsan stadigt att regenereras tills den läkande effekten upphör. Mängden läkning kan avta med tiden.\n\nNästa läkning: %d.\n\nÅterstående läkning: %d.
actors.buffs.healing.name=läkning
actors.buffs.herodisguise.desc=Illusorisk magi har förändrat ditt fysiska utseende! Effekten är rent kosmetisk, men känns väldigt konstig oavsett. \n\n Återstående förklädnadsmoment: %s.
actors.buffs.herodisguise.name=dölja
actors.buffs.hex.desc=Mörk magi som tappa fokus och gör målet något desorienterat.\n\nHexing minskar precision och undvikande med 20%%, vilket gör målet mindre effektivt i strid.\n\nÅterstående hexagonomgångar: %s.
actors.buffs.hex.heromsg=Du har blivit lurad!
actors.buffs.hex.name=hexade
actors.buffs.holdfast.desc=Krigaren håller sin position, ökar sin rustning med %1$d-%2$d och saktar ner förfallshastigheten för vissa buffs med %3$d%%. Detta kommer att vara tills han rör på sig.
actors.buffs.holdfast.name=håll fast
actors.buffs.hunger.cursedhorn=Det förbannade hornet stjäl en del av matenergin när du äter.
actors.buffs.hunger.desc=Hungern ökar sakta allt eftersom du tillbringar tid i fängelsehålan, och så småningom kommer du att börja svälta. Medan du svälter kommer du långsamt att förlora hälsa istället för att regenerera den.\n\nRansonering är viktigt! Om du har hälsa att avvara är det ingen dålig idé att svälta om det betyder att det kommer att finnas mer mat senare. Effektiv ransonering kan få maten att räcka mycket längre!
actors.buffs.hunger.desc_intro_hungry=Du kan känna att magen ropar efter mat, men det är inte alltför brådskande än.
actors.buffs.hunger.desc_intro_starving=Du är så hungrig att det gör ont.
actors.buffs.hunger.hungry=hungrig
actors.buffs.hunger.ondeath=Du svalt ihjäl...
actors.buffs.hunger.onhungry=Du är hungrig.
actors.buffs.hunger.onstarving=Du svälter!
actors.buffs.hunger.rankings_desc=Svalt ihjäl
actors.buffs.hunger.starving=svältande
actors.buffs.invisibility.desc=Du smälter in helt i den omgivande terrängen, vilket gör dig omöjlig att se.\n\nMedan du är osynlig kan fiender inte attackera eller följa dig. Fysiska attacker och magiska effekter (som skriftrullar och trollstavar) kommer omedelbart att upphäva osynligheten.\n\nÅterstående osynlighetstider: %s.
actors.buffs.invisibility.name=osynlig
actors.buffs.invulnerability.desc=Denna karaktär är fylld med stor skyddande kraft, vilket ger dem en kort period av osårbarhet!\n\nÅterstående tur: %s.
actors.buffs.invulnerability.name=osårbar
actors.buffs.levitation.desc=En magisk kraft svävar över marken och får dig att känna dig viktlös.\n\nSvävande karaktärer rör sig tyst och ignorerar alla markbaserade effekter. Fällor utlöses inte, vatten släcker inte eld, växter trampas inte på, rötter missar och gropar svävas över. Var försiktig, eftersom allt detta kan träda i kraft i samma sekund som levitationen slutar!\n\nÅterstående levitationstider: %s.
actors.buffs.levitation.name=svävande
actors.buffs.lifelink.desc=Den här karaktärens livskraft är kopplad till en annan karaktär i närheten. All skada som tas delas mellan dem.\n\nNär den här karaktären tar skada kommer hälften att delas ut till livslänksmålet istället.\n\nÅterstående livslänksomgångar: %s.
actors.buffs.lifelink.name=livslänk
actors.buffs.lifelink.ondeath=De livshotande skadorna dödade dig...
actors.buffs.light.desc=Även i den mörkaste fängelsehålan är ett stadigt ljus vid din sida alltid en tröst.\n\nLjus hjälper till att hålla mörkret borta, så att du kan se ett rimligt avstånd trots omgivningen.\n\nÅterstående belysningsvarv: %s.
actors.buffs.light.name=upplyst
actors.buffs.lockedfloor.desc=Den nuvarande våningen är låst, och du kan inte lämna den!\n\nMedan en våning är låst kommer du inte att uppleva hunger eller ta skada av att svälta. Om du inte arbetar för att besegra den här våningens boss kommer dessutom de passiva regenereringseffekterna att upphöra.\n\nDessutom, om du återupplivas av en ovälsignad ankh medan våningen är låst, kommer den att återställas.\n\nDöda den här våningens boss för att bryta låset.
actors.buffs.lockedfloor.name=golvet är låst
actors.buffs.lostinventory.desc=Ditt inventarieförråd har tappats bort någonstans i fängelsehålan! Du kommer inte att kunna plocka upp eller använda de flesta föremålen förrän du har återfått det.
actors.buffs.lostinventory.name=förlorat lager
actors.buffs.magicalsight.desc=På något sätt kan du se med ditt sinne, snarare än dina ögon.\n\nMedan den magiska synen är aktiv kommer du att kunna se genom all terräng inom en radie av 12 rutor.\n\nÅterstående omgångar av magisk syn: %s.
actors.buffs.magicalsight.name=magisk syn
actors.buffs.magicalsleep.desc=Den här karaktären har fallit in i en djup magisk sömn som de inte kommer att vakna ur naturligt. \n\nMagisk sömn liknar vanlig sömn, förutom att endast skada får målet att vakna. \n\nFör hjälten och deras allierade har magisk sömn vissa återställande egenskaper, vilket gör att de snabbt kan läka medan de vilar.
actors.buffs.magicalsleep.fallasleep=Du faller in i en djup magisk sömn.
actors.buffs.magicalsleep.name=magisk sömn
actors.buffs.magicalsleep.toohealthy=Du är för frisk och motstår lusten att sova.
actors.buffs.magicalsleep.wakeup=Du vaknar upp och känner dig utvilad och frisk.
actors.buffs.magicimmune.desc=Alla magiska effekter har förlorat sitt grepp om dig, du är helt okänslig för dem.\n\nMedan magisk immunitet inte är tillåten kommer alla skadliga och hjälpsamma magiska effekter att gälla dig, inklusive förbannelser, förtrollningar, trollstavar, skriftrullar, ringar, artefakter etc. Heroiska rustningsförmågor är tillräckligt starka för att fungera oavsett denna effekt.\n\nÅterstående omgångar av magisk immunitet: %s.
actors.buffs.magicimmune.name=immun mot magi
actors.buffs.mindvision.desc=På något sätt kan du se alla varelser på den här våningen genom ditt sinne. Det är en konstig känsla.\n\nAlla karaktärer på den här våningen är synliga för dig så länge du har sinnesinsyn. Att se en varelse genom sinnesinsyn räknas som att den ses eller är i närheten för många magiska effekter.\n\nÅterstående sinnesinsynstider: %s.
actors.buffs.mindvision.name=sinnesyn
actors.buffs.momentum.action_name=frilöpning
actors.buffs.momentum.momentum=bygga momentum
actors.buffs.momentum.momentum_desc=När Freerunnern rör sig bygger den upp momentum, som den kan använda för att börja freerunna.\n\nVarje laddning momentum ger två varv freerunning, och Freerunnern kan bygga upp upp till 10 laddningar. Momentum förloras snabbt när Freerunnern slutar röra sig.\n\nAktuell momentumladdning: %d.
actors.buffs.momentum.resting=återhämta sig
actors.buffs.momentum.resting_desc=Allt eftersom han rör sig bygger freerunnern upp momentum, vilket han kan använda för att börja freerunna.\n\nFreerunnern behöver tid för att återfå sin uthållighet innan han bygger upp momentum igen.\n\nÅterstående turar: %d.
actors.buffs.momentum.running=frilöpning
actors.buffs.momentum.running_desc=Allt eftersom han rör sig bygger Freerunnern upp momentum, vilket han kan använda för att börja freerunna.\n\nMedan Freerunnern freerunnar rör sig Freerunnern i dubbel hastighet och får bonusundvikande baserat på sin nivå.\n\nÅterstående turar: %d.
actors.buffs.monkenergy$monkability$dash.desc=En omedelbar rusning upp till 4 rutor bort. Denna förmåga kan gå över faror, men inte genom fiender eller fast terräng.
actors.buffs.monkenergy$monkability$dash.empower_desc=En omedelbar rusning upp till _8 rutor_ bort. Denna förmåga kan gå över faror, men inte genom fiender eller fast terräng.
actors.buffs.monkenergy$monkability$dash.name=rusa
actors.buffs.monkenergy$monkability$dash.prompt=Välj en plats
actors.buffs.monkenergy$monkability$dragonkick.desc=En förödande spark som gör %1$d-ZXQ1ZXQ skada och ignorerar rustning. Sparken slår bort målet och förlamar det för varje ruta det färdas.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=En förödande spark som gör _%1$d-ZXQ1ZXQ skada_ och ignorerar rustning. Sparken slår bort _alla angränsande mål_ och förlamar dem för varje ruta de färdas.
actors.buffs.monkenergy$monkability$dragonkick.name=drakespark
actors.buffs.monkenergy$monkability$flurry.desc=Två omedelbara attacker som gör %1$d-ZXQ1ZXQ skada och ignorerar rustning. Denna förmåga kan inte användas upprepade gånger.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Två omedelbara attacker som gör %1$d-ZXQ1ZXQ skada, ignorerar rustning och använder ditt vapens förtrollning. Denna förmåga kan inte användas upprepade gånger.
actors.buffs.monkenergy$monkability$flurry.name=en virvelvind av slag
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Munken är fokuserad på sin omgivning och väntar på nästa attack mot henne. Medan hon är fokuserad är hon garanterad att parera nästa inkommande attack.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=fokuserad
actors.buffs.monkenergy$monkability$focus.desc=Munken tar en tur att fokusera och låter henne parera nästa attack mot henne.
actors.buffs.monkenergy$monkability$focus.empower_desc=Munken fokuserar _omedelbart_ och låter henne parera nästa attack mot henne.
actors.buffs.monkenergy$monkability$focus.name=fokus
actors.buffs.monkenergy$monkability$meditate.desc=Munken fokuserar energi på sin kropp i 5 varv. Detta eliminerar de flesta negativa effekterna och ger henne 8 varv med omladdning av trollstav och artefakter.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Munken fokuserar energi på sin kropp i 5 varv. Detta eliminerar de flesta negativa effekterna och ger henne 8 varv med omladdning av trollstav och artefakter. _Hon får också 80 % skademotstånd medan hon mediterar och läker långsamt 20 % av sin saknade HP._
actors.buffs.monkenergy$monkability$meditate.name=meditera
actors.buffs.monkenergy.action=Munkförmågor
actors.buffs.monkenergy.desc=När hon besegrar fiender får munken energi som hon kan använda på en mängd olika förmågor. De flesta fiender ger 1 energi när de besegras, och munken förlorar inte energi över tid. \n\n Nuvarande energi: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Munken har nyligen använt en förmåga och måste vänta innan han använder en annan. \n\nAktuell nedkylningstid: %d turerna.
actors.buffs.monkenergy.name=energi
actors.buffs.ooze.desc=Denna klibbiga syra fastnar vid köttet och smälter långsamt bort det.\n\nSlem orsakar ständig skada över tid, men kan omedelbart tvättas bort med vatten.\n\nAntal återstående sllem: %s.
actors.buffs.ooze.heromsg=Frätande slem äter upp ditt kött. Tvätta bort det!
actors.buffs.ooze.name=frätande slem
actors.buffs.ooze.ondeath=Du smälter bort...
actors.buffs.ooze.rankings_desc=Upplöst
actors.buffs.paralysis.desc=Ofta är det värsta man kan göra ingenting alls.\n\nFörlamning stoppar helt alla handlingar, vilket tvingar målet att vänta tills effekten avtar. Smärtan från att ta skada kan få karaktärer att motstå förlamning, vilket bryter dem ur effekten.\n\nÅterstående förlamningsomgångar: %s.
actors.buffs.paralysis.heromsg=Du är förlamad!
actors.buffs.paralysis.name=lam
actors.buffs.paralysis.out=motstod förlamning
actors.buffs.physicalempower.desc=Dina slag har förstärkts, vilket ökar mängden skada du kan göra när du träffar fiender med fysiska attacker.\n\nBonusskada: %1$d.\nÅterstående träffar: %2$d.
actors.buffs.physicalempower.name=fysiskt bemyndigade
actors.buffs.pincushion.desc=De kastade vapen du har använt mot den här karaktären sitter för närvarande fast vid dem och kommer att falla till golvet efter att de besegrats.\n\nFöljande föremål är för närvarande fästa:
actors.buffs.pincushion.name=nåldyna
actors.buffs.poison.desc=Giftet arbetar sig genom kroppen och försämrar långsamt dess interna funktion.\n\nGiftet gör skada varje tur proportionellt mot hur lång tid det tar innan det upphör.\n\nÅrstående giftomgångar: %s.
actors.buffs.poison.heromsg=Du är förgiftad!
actors.buffs.poison.name=förgiftad
actors.buffs.poison.ondeath=Du dog av gift...
actors.buffs.poison.rankings_desc=Dukade under för gift
actors.buffs.preparation.action_name=förberedd attack
actors.buffs.preparation.assassinated=mördad
actors.buffs.preparation.desc=Lönnmördaren väntar tålmodigt och förbereder sig för att slå till från skuggorna.
actors.buffs.preparation.desc_blink=Han kan blinka mot en fiende innan han anfaller dem, med ett maximalt avstånd på _%d._
actors.buffs.preparation.desc_dmg=Hans nästa attack kommer att göra _%1$d%% bonusskada_ och kommer att avrätta vanliga fiender under _%2$d%% hälsa_, eller bossar under _%3$d%% hälsa_.
actors.buffs.preparation.desc_dmg_likely=Attacken kommer också att vara mer benägen att orsaka en större mängd skada.
actors.buffs.preparation.desc_invis_next=Vändningar för starkare attack: _%d._
actors.buffs.preparation.desc_invis_time=Turer som spenderats osynliga: _%d._
actors.buffs.preparation.name=förberedelse
actors.buffs.preparation.no_target=Det finns inget att attackera där.
actors.buffs.preparation.out_of_reach=Det målet är utom räckhåll.
actors.buffs.preparation.prompt=Välj ett mål att attackera! \n Maximal blinkningsavstånd: %d
actors.buffs.prismaticguard.desc=Du skyddas av en prismatisk bild som för närvarande är inaktiv. När fiender är närvarande kommer den prismatiska bilden att agera och skydda dig!\n\nMedan den är inaktiv kommer den prismatiska bilden stadigt att återhämta sig från eventuell skada den har tagit.\n\nNuvarande HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Denna prismatiska bild drar också nytta av Kraften hos många. Återstående varv: %d.
actors.buffs.prismaticguard.name=prismatiskt skydd
actors.buffs.recharging.desc=Energi flödar genom dig och förbättrar laddningshastigheten för dina trollstavar och stavar.\n\nVarje tur med denna buff ökar den aktuella laddningen med en fjärdedel, utöver den vanliga laddningen.\n\nÅterstående laddningsturer: %s.
actors.buffs.recharging.name=laddning
actors.buffs.revealedarea.desc=Ett område av fängelsehålan har tillfälligt avslöjats för hjälten. De kommer att se det oavsett var de är. \n\n Återstående tur: %s.
actors.buffs.revealedarea.name=avslöjat område
actors.buffs.revealedchar.desc=Denna karaktär avslöjas för hjälten. De kommer att vara synliga oavsett var de är. \n\n Återstående tur: %s.
actors.buffs.revealedchar.name=avslöjade
actors.buffs.roots.desc=Rötter (magiska eller naturliga) griper tag i fötterna och tvingar ner dem till marken.\n\nRötter låser ett mål på plats, vilket gör rörelse och de flesta rörelseförmågor omöjliga. Andra handlingar påverkas inte, inklusive teleporteringseffekter.\n\nRotens återstående varv: %s.
actors.buffs.roots.heromsg=Du kan inte röra dig!
actors.buffs.roots.name=rotad
actors.buffs.scrollempower.desc=Energin från magikerns nyligen lästa skriftrulle ger hans trollstavar kraft!\n\nNivåökning: +%1$d.\nÅterstående Zaps: %2$d.
actors.buffs.scrollempower.name=rulla stärk
actors.buffs.shadows.desc=Du blandas in i skuggorna runt omkring dig, vilket ger dig osynlighet och saktar ner din ämnesomsättning.\n\nMedan du är osynlig kan fiender inte attackera eller följa dig. De flesta fysiska attacker och magiska effekter (som skriftrullar och trollstavar) kommer omedelbart att upphäva osynligheten. Dessutom, medan du är skuggsmält, minskar din hungerhastighet.\n\nDu kommer att förbli skuggsmält tills du lämnar skuggorna eller en fiende kommer i kontakt med dig.
actors.buffs.shadows.name=skuggsmält
actors.buffs.slow.desc=Att sakta ner magin påverkar målets tidshastighet, för dem rör sig allt supersnabbt.\n\nA En långsam karaktär utför alla handlingar på dubbelt så lång tid som normalt.\n\n Återstående långsamma omgångar: %s
actors.buffs.slow.name=saktade ner
actors.buffs.snipersmark.action_name_snapshot=ögonblicksbild
actors.buffs.snipersmark.action_name_sniper=prickskyttskott
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.desc=Krypskytten är finslipad på det mål hon senast attackerade. Hon kan utföra en specialattack med sin båge som varierar beroende på hur bågen är förstärkt.\n\nEn oförstärkt båge avfyrar en _ögonblicksbild_,_ som gör minskad skada men inte tar någon tid att avfyra.\n\nA En båge förstärkt för hastighet avfyrar en _salva_ med tre pilar. Varje pil gör minskad skada, men kan fortfarande aktivera förtrollning. Denna salva tar 1 tur att skjuta.\n\nA En båge förstärkt för skada avfyrar ett _krypskytteskott_._ Detta skott garanteras att träffa, gör bonusskada baserat på avståndet från målet och tar 2 turar att avfyra.\n\nÅterstående turar: %s.
actors.buffs.snipersmark.name=prickskyttens märke
actors.buffs.soulmark.desc=Trollkarlen har nått den här varelsens själ, vilket gör att han kan läka medan den tar fysisk skada. \n\n Återstående själsteckenomgångar: %s.
actors.buffs.soulmark.name=själsmärkt
actors.buffs.stamina.desc=Du har oändlig uthållighet, vilket möjliggör snabbare rörelse!\n\nMedan du är under påverkan av uthållighet kommer du att springa i +50%% hastighet, men kommer att utföra alla andra handlingar i normal hastighet.\n\nÅterstående uthållighetsomgångar: %s.
actors.buffs.stamina.name=uthållighet
actors.buffs.terror.desc=Terror är manipulativ magi som tvingar sitt mål in i en okontrollerbar panik. \n\n Skräckslagna karaktärer tvingas fly från sin motståndare och försöker skapa så många dörrar och murar som möjligt mellan dem. Smärtchocken kommer dock att minska skräckens varaktighet. \n\n Återstående skräckomgångar: %s.
actors.buffs.terror.name=livrädd
actors.buffs.toxicimbue.desc=Du är genomsyrad av giftig energi!\n\nAllt du rör dig runt med giftig gas kommer konstant att välla ut från dig och skada dina fiender. Du är immun mot giftig gas och gift under effektens varaktighet, såväl som i några omgångar efteråt.\n\nÅterstående omgångar av giftig energi: %s.
actors.buffs.toxicimbue.name=genomsyrad av toxicitet
actors.buffs.vertigo.desc=Att gå i en rak linje kan vara svårt när hela världen snurrar.\n\nNär karaktärer är verksamma vid vertigo kommer de att gå i en slumpmässig riktning istället för den de tänkte gå i.\n\nÅterstående vertigoomgångar: %s.
actors.buffs.vertigo.name=vertigo
actors.buffs.vulnerable.desc=Sårbarhetsmagi ökar all fysisk skada som en karaktär tar med 33%%, efter att skadan har minskat med rustning. \n\nTurer av sårbara kvarvarande: %s
actors.buffs.vulnerable.heromsg=Du känner dig skör!
actors.buffs.vulnerable.name=sårbar
actors.buffs.wandempower.desc=Dina skadegörande trollstavar har stärkts, vilket ökar mängden skada de gör för några träffar.\n\nBonusskada: %1$d.\nÅterstående träffar: %2$d.
actors.buffs.wandempower.name=trollstavar bemyndigade
actors.buffs.weakness.desc=Allt känns plötsligt mycket tyngre.\n\nFörsvagande magi minskar en karaktärs fysiska styrka, vilket gör att de gör 33%% minskad skada.\n\nÅterstående svaghetsomgångar: %s.
actors.buffs.weakness.heromsg=Du känner dig försvagad!
actors.buffs.weakness.name=försvagad
actors.buffs.wellfed.desc=Du känner dig ganska nöjd och mätt.\n\nMedan du är väl mätt kommer din hunger inte att öka, och du kommer att läka ytterligare en mängd hälsa med tiden.\n\nÅterstående turar: %d
actors.buffs.wellfed.name=välnärd
actors.char.def_verb=undvek
actors.char.def_verb_blocked=blockerad
actors.char.defeat=Du besegrade %s.
actors.char.immune=immun
actors.char.invulnerable=osårbar
actors.char.kill=%s dödade dig...
actors.hero.abilities.armorability.cost=Avgiftskostnad: _%d_
actors.hero.abilities.armorability.no_target=Det finns inget att sikta på där!
actors.hero.abilities.armorability.prompt=Välj en plats att rikta in dig på
actors.hero.abilities.armorability.self_target=Du kan inte rikta in dig på dig själv!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Strålande energi utgår från prästens kropp. I denna form får prästen 2 attackräckvidd (från den heliga energin som projicerar från dem) och 10 sköldar varje gång de spenderar en helig tomeladdning. De kan också kasta trollformler som låses upp via den uppstigna formens talanger.\n\nSkölden som beviljas av den uppstigna formen och dess trollformler kommer inte att förfalla normalt, utan kommer omedelbart att blekna när den uppstigna formen upphör.\n\nNuvarande sköld: %1$d.\nÅterstående tur: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=uppstigen form
actors.hero.abilities.cleric.ascendedform.desc=Prästen projicerar helig energi från sig själv och antar en utökad strålande form i 10 omgångar. I denna form kan prästen kasta nya trollformler, få 2 attackräckvidd, 30 sköldar, och alla ytterligare trollformler de kastar ger 10 sköldar per använd helig tomeladdning. \n\n Skölden från uppstigen form och dess trollformler avtar inte normalt, utan kommer omedelbart att blekna när den uppstigna formen slutar. Förmågan kan återanvändas för att uppdatera den uppstigna formens varaktighet.
actors.hero.abilities.cleric.ascendedform.name=uppstigen form
actors.hero.abilities.cleric.ascendedform.short_desc=Prästen antar en _Uppstigen Form_ och får nya trollformler, attackräckvidd och sköldning.
actors.hero.abilities.cleric.powerofmany$lightally.desc=En kopia av en av prästerskapets äventyrliga följeslagare, gjord av fast ljus. Även om den har formen av en annan hjälte, har den inga av deras unika förmågor. Denna allierade kommer att bestå så länge som Kraften hos Många tillämpas på dem. \n\nDenna allierade kan styras utan kostnad genom att återanvända rustningsförmågan Kraften hos Många.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Din allierade går till attack!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Din allierade flyttar till den positionen.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Din allierade följer dig.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Du kan hitta den här karaktären med en specifik hjälterustningsförmåga.
actors.hero.abilities.cleric.powerofmany$lightally.name=lätt allierad
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Denna allierade har fått kraft av Mångas Kraft, vilket ger dem +25%% skada utdelad och -25%% skada tagen. De kommer också att dela sin synräckvidd med Prästen och kan dra nytta av kraften i många trollformler.\n\n Mångas Kraft kommer att bestå när allierade som prismatiska bilder gömmer sig, men dess varaktighet kommer fortfarande att räknas ner.\n\nÅterstående tur: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=mångas makt
actors.hero.abilities.cleric.powerofmany.ally_exists=Du har redan en bemyndigad allierad.
actors.hero.abilities.cleric.powerofmany.desc=Prästmästaren kanaliserar _Mångans Kraft_, som antingen ger en befintlig allierad kraft eller skapar en ny bemyndigad i 100 omgångar. Att rikta in sig på ett tomt utrymme skapar en ny allierad.\n\nMedan allierade är bemyndigade av Mångas Kraft, gör de +25 % skada, tar -25 % skada och delar sin vision med Prästmästaren. De får också 25 % sköldning när förmågan används.\n\nPrästmästaren får också tre nya trollformler som bara kan utövas med en bemyndigad allierad. Mångas Kraft upphör inte medan en av dessa trollformler är aktiv.
actors.hero.abilities.cleric.powerofmany.name=mångas makt
actors.hero.abilities.cleric.powerofmany.no_vision=Du kan inte rikta in dig på en plats du inte kan se.
actors.hero.abilities.cleric.powerofmany.only_allies=Du kan bara ge allierade kraft.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Rikta din ljusa allierade
actors.hero.abilities.cleric.powerofmany.prompt_default=Välj en allierad eller plats
actors.hero.abilities.cleric.powerofmany.short_desc=Prästen kanaliserar _Mångas Kraft_, vilket ger en befintlig allierad kraft eller skapar en ny.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Tilldela till kroppsform
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Tilldela till minnesformulär
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Tilldela till andeform
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Välj en effekt som ska integreras i Trinity. Ytterligare information visas före bekräftelse.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Kroppsform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Tankeform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Andeform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Välj vilken form av Treenighet som ska användas. Effekterna av olika former kan vara aktiva samtidigt.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity kommer att tillämpa denna artefakts avlägsna alkemieffekt, till bekostnad av en _%2$s laddning._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity kommer att tillämpa denna artefakts passiva hälsoregenereringseffekt vid _+%1$d_ i 20 turar, till kostnaden av _%2$s laddning._
actors.hero.abilities.cleric.trinity.cost=Kostnaden för denna förmåga varierar, men är oftast _%d._
actors.hero.abilities.cleric.trinity.desc=Prästen får en _Treenighet_ av rustningsförmågor, som kan tilldelas olika föremålseffekter genom att använda tre nya trollformler. Var och en av dessa trollformler fokuserar på att emulera effekterna av olika typer av utrustning som prästen har identifierat under denna körning: kroppsform (vapen och rustning), sinneform (stavar och kastade vapen) och andeform (ringar och artefakter). \n\nVarje Treenighetsform kan genomsyras av en effekt i taget, och prästen väljer vilken som ska aktiveras när han använder Treenighet. Treenigheten kommer inte att duplicera effekten av något du redan har utrustat.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity kommer att använda denna artefakts effekt för att kalla fram en korrumperad vänlig vålnad med HP:n hos ett _+%1$d_-spöke, till bekostnad av laddningen _%2$s._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity kommer att tillämpa denna effekt för _%1$d turer_ till kostnaden av _%2$s laddning._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity kommer att tillämpa denna artefakts kedjekastningseffekt med räckvidd vid _+%1$d_, till kostnaden av _%2$s laddning._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity kommer att tillämpa denna artefakts snackseffekt, till en kostnad av _%2$s._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity kommer att tillämpa denna artefakts fiendens råneffekt vid _+%1$d_, till kostnaden av laddningen _%2$s._
actors.hero.abilities.cleric.trinity.name=treenigheten
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity kan inte kopiera en effekt som du redan har utrustad!
actors.hero.abilities.cleric.trinity.no_imbue=Treenigheten har ingen effekt inställd för någon av sina former för närvarande, använd en av dess trollformler!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity kommer att tillämpa denna _kraftfulla_ effekt för _%1$d turner_ till kostnaden av _%2$s laddning._
actors.hero.abilities.cleric.trinity.ring_use=Trinity kommer att applicera denna ringeffekt vid _+%1$d_ i 20 varv, till kostnaden av en _%2$s laddning._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity kommer att applicera denna artefakts roteffekt med ett slumpmässigt skadligt frö, till kostnaden av _%2$s-laddningen._
actors.hero.abilities.cleric.trinity.short_desc=Prästen får en _Treenighet_ av förmågor, som emulerar utrustning de har sett och kan tilldelas genom att använda nya trollformler.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity kommer att tillämpa denna artefakts insert-effekt, till en kostnad av _%2$s._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity kommer att tillämpa denna artefakts skrikeffekt vid _+%1$d_, till kostnaden av _%2$s laddning._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity kommer att kasta detta vapen mot _+%1$d_ till kostnaden av en _%2$s laddning._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity kommer att tillämpa denna artefakts tidsfrysningseffekt med en _%1$d_ turlängd, till en kostnad av _%2$s laddning._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity kommer att tillämpa denna artefakts slumpmässiga scrolleffekt med en _%1$d/10_ chans att erbjuda den exotiska versionen utan extra kostnad, till en kostnad av _%2$s._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity kommer att zappa denna _flerladdningsbara_ trollstav vid _+%1$d_ till kostnaden av _%2$s laddning._
actors.hero.abilities.cleric.trinity.wand_use=Trinity kommer att zappa denna trollstav vid _+%1$d_ till kostnaden av _%2$s laddning._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Den här karaktären deltar i en duell. De, och deras allierade eller undersåtar, får agera normalt medan andra är frusna.\n\nDuellen kommer att pågå under en viss tid, tills en deltagare dör, eller tills deltagarna flyttar mer än 5 brickor från varandra.\n\nÅterstående turar: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duelldeltagare
actors.hero.abilities.duelist.challenge.ally_target=Du kan bara utmana fiender.
actors.hero.abilities.duelist.challenge.already_dueling=Du kan bara vara med i en duell åt gången.
actors.hero.abilities.duelist.challenge.desc=Duelisten utmanar en närliggande fiende på duell. Den fienden tvingas slåss mot henne medan alla andra fiender tillfälligt är frysta i tiden.\n\nMålet måste vara nåbart och inom 5 rutor från Duelisten. Duellen varar tills 10 rundor har gått, fienden dör eller Duelisten är mer än 5 rutor bort från fienden.\n\nFrysta fiender är osårbara. Duelistens allierade fryses inte av denna förmåga, men om en boss är ett mål kommer dess undersåtare inte heller att frysas.
actors.hero.abilities.duelist.challenge.distant_target=Den fienden är för långt borta för att utmanas.
actors.hero.abilities.duelist.challenge.name=utmaning
actors.hero.abilities.duelist.challenge.prompt=Välj en fiende att utmana
actors.hero.abilities.duelist.challenge.short_desc=Duelisten _utmanar_ en närliggande fiende till en duell och fryser tillfälligt alla andra fiender.
actors.hero.abilities.duelist.challenge.unreachable_target=Du måste kunna nå ditt mål.
actors.hero.abilities.duelist.elementalstrike.desc=Duelisten anfaller en fiende eller plats och utför en regelbunden attack som garanterat träffar och sprider en magisk effekt som färdas upp till 4 rutor i en 65-graders kon. Denna magiska effekt varierar beroende på förtrollningen på Duelistens primära vapen.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ett elementärt anfall utan förtrollning frigör en liten magisk explosion som orsakar 6–12 skada på alla fiender inom räckhåll.
actors.hero.abilities.duelist.elementalstrike.name=elementär attack
actors.hero.abilities.duelist.elementalstrike.short_desc=Duelisten utför en _Elementarattack_ och sprider en effekt i en konisk AOE baserat på hennes vapenförtrollning.
actors.hero.abilities.duelist.feint.bad_location=Du kan inte flytta till den platsen.
actors.hero.abilities.duelist.feint.desc=Duelisten fejkar en attack medan hon rusar till en intilliggande platta och lämnar efter sig en tillfällig efterbild av sig själv. Fiender som attackerade Duelisten kommer istället att attackera hennes efterbild. \n\nFiender som attackerar efterbilden blir förvirrade, vilket avbryter deras nästa handling och gör dem öppna för en överraskningsattack.
actors.hero.abilities.duelist.feint.name=fint
actors.hero.abilities.duelist.feint.prompt=Välj en plats att rusa till
actors.hero.abilities.duelist.feint.short_desc=Duelisten _Feints_, som fejkar en attack medan hon rusar till en intilliggande ruta. Fiender kommer att attackera hennes efterbild, vilket gör dem öppna för en motattack.
actors.hero.abilities.duelist.feint.too_far=Den platsen ligger inte intill dig.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Jägarinnan får kortvarig kraft, vilket ökar hennes rörelsehastighet och attackhastighet med sin båge. \n\n Återstående turar: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=naturens kraft
actors.hero.abilities.huntress.naturespower.desc=Jägaren ger tillfälligt sig själv och sin båge kraft med naturens kraft! Detta varar i 8 turer. \n\nUnder denna tid rör sig Jägaren med 2x hastighet och attackerar 33 % snabbare med sin båge. Bonusbågseffekterna utlöses inte om Krypskytten använder sina specialattacker.
actors.hero.abilities.huntress.naturespower.name=naturens kraft
actors.hero.abilities.huntress.naturespower.short_desc=Jägaren åkallar _Naturens Kraft_, vilket ökar hennes rörelsehastighet och hennes båges eldhastighet under en kort tid.
actors.hero.abilities.huntress.spectralblades.desc=Jägarinnan kastar ut ett spektralblad mot en fiende, vilket fungerar som ett distansanfall från hennes närstridsvapen. Alla normala effekter från ett närstridsvapen aktiveras, inklusive förtrollningar.
actors.hero.abilities.huntress.spectralblades.name=spektrala blad
actors.hero.abilities.huntress.spectralblades.short_desc=Jägaren kastar _Spektralklingor_ mot ett mål och orsakar skada beroende på hennes för närvarande utrustade närstridsvapen.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=En magisk hök, framkallad av Jägaren. Den lyser i ett starkt eteriskt blått sken, dess huvud rör sig ständigt runt medan den granskar området. \n\nÄven om den inte är någon större krigare, gör dess snabbhet och syn den utmärkt för att spana och distrahera fiender.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Garanterade undanflykter kvar: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Återstående varv: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Din hök går till attack!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Din hök rör sig till den positionen.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Din hök rör sig för att följa dig.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Du kan hitta den här karaktären med en specifik hjälterustningsförmåga.
actors.hero.abilities.huntress.spirithawk$hawkally.name=andehök
actors.hero.abilities.huntress.spirithawk.desc=Jägaren kallar fram en bekant andehök, som kan styras genom att använda förmågan igen medan den kallas. Höken varar i 100 omgångar, att styra höken kostar ingen kostnad. \n\nHöken har minimal hälsa och attackkraft, men är snabb, undvikande och exakt. Den delar hela sitt synfält med Jägaren hela tiden. Den är immun mot alla områdesbundna effekter, såsom eld och giftgas. Den kommer inte att attackera om den inte specifikt beordras att göra det.
actors.hero.abilities.huntress.spirithawk.name=andehök
actors.hero.abilities.huntress.spirithawk.no_space=Det finns ingen ledig plats nära dig.
actors.hero.abilities.huntress.spirithawk.short_desc=Jägarinnan kallar fram en _Andehök_-bekant, som kan hjälpa henne att spana efter platser och distrahera fiender.
actors.hero.abilities.mage.elementalblast.desc=Magikern avger en magisk explosion som täcker ett cirkulärt område upp till 4 rutor bort och orsakar upp till 15–25% skada. Den specifika effekten av elementexplosionen varierar beroende på vilken trollstav magikerns stav har.
actors.hero.abilities.mage.elementalblast.generic_desc=Effekten av elementär explosion kommer att likna effekten av trollstaven när den zappas mot en fiende eller allierad.
actors.hero.abilities.mage.elementalblast.name=elementär explosion
actors.hero.abilities.mage.elementalblast.no_staff=Du kan inte använda den här förmågan utan din personal.
actors.hero.abilities.mage.elementalblast.short_desc=Magikern avger en _Elementärexplosion_ från sin stav, som täcker ett stort område runt omkring honom i en effekt som varierar beroende på trollstaven i hans stav.
actors.hero.abilities.mage.warpbeacon.depths=Man kan inte slingra sig mellan djup!
actors.hero.abilities.mage.warpbeacon.desc=Magikern placerar en fyr, som sedan kan förvrängas till när som helst. Att placera fyren tar 1 tur, men att förvränga till den är omedelbar. \n\nMagikern kan inte förvränga mellan våningar som standard, eller använda fyren för att nå oåtkomliga platser som låsta rum. Magikern kan teleportera till fiender, vilket kommer att knuffa dem åt sidan.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Du får inte placera en fyr där!
actors.hero.abilities.mage.warpbeacon.locked_floor=Du får inte lämna en låst våning!
actors.hero.abilities.mage.warpbeacon.name=warp-fyr
actors.hero.abilities.mage.warpbeacon.short_desc=Magikern placerar en _Warping Beacon_ på sin nuvarande plats, som han omedelbart kan teleportera tillbaka till.
actors.hero.abilities.mage.warpbeacon.too_far=Den platsen är för långt bort!
actors.hero.abilities.mage.warpbeacon.window_cancel=avboka
actors.hero.abilities.mage.warpbeacon.window_clear=tydlig fyr
actors.hero.abilities.mage.warpbeacon.window_desc=Din beacon är för närvarande placerad på våning %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportera till fyr
actors.hero.abilities.mage.wildmagic.desc=Magikern släpper lös kraften i sina trollstavar och avfyrar dem slumpmässigt upp till fyra gånger i ett enda drag. Magikerns stav ingår inte i denna effekt. \n\nVarje trollstav får också sin nivå höjd med 2, upp till +3. Denna förmåga använder en halv trollstavladdning för varje zapp, och ingen trollstav kan avfyras mer än två gånger.
actors.hero.abilities.mage.wildmagic.name=vild magi
actors.hero.abilities.mage.wildmagic.no_wands=Du har inga trollstavar att zappa med!
actors.hero.abilities.mage.wildmagic.short_desc=Magikern släpper lös den _Vilda magin_ som finns i hans trollstavar och avfyrar dem slumpmässigt flera gånger mot ett valt mål under en enda tur.
actors.hero.abilities.ratmogrify$transmograt.desc=Den här fienden har förvandlats till en råtta. En stor förbättring, om du frågar mig! - Råttkungen
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrifierad %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Dödad av: råttmodifierad fiende
actors.hero.abilities.ratmogrify.cant_transform=Det kan du inte råttmogrifa!
actors.hero.abilities.ratmogrify.desc=Hjälten förvandlar en fiende till en råtta i 6 omgångar! Bossar, allierade och råttor kan inte råttmogrifieras. \n\nRåttmogrifierade fiender behåller sina ursprungliga statistik, men har inga förmågor.
actors.hero.abilities.ratmogrify.name=råttmogrify
actors.hero.abilities.ratmogrify.short_desc=Hjälten _Råttmogrifierar_ en fiende! Detta förvandlar dem tillfälligt till en råtta utan förmågor.
actors.hero.abilities.ratmogrify.too_strong=Den fienden är för stark för att råtmogrifa!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Denna fiende har blivit markerad, vilket gör att de tar 25%% bonusskada, men det gör dem också oförmögna att dö förrän markeringen är slut.\n\nÅterstående turar: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=märkt för döden
actors.hero.abilities.rogue.deathmark.ally_target=Du kan bara markera fiender
actors.hero.abilities.rogue.deathmark.desc=Skurken placerar ett märke på en vald fiende, vilket gör att de tar 25 % extra skada. Märket appliceras omedelbart och varar i 5 turer. \n\nMarkerade fiender tar bonusskada men kan inte dö förrän märket löper ut. Om en fiende har 0 HP när märket slutar, kommer de att dö omedelbart.
actors.hero.abilities.rogue.deathmark.name=dödsmärke
actors.hero.abilities.rogue.deathmark.short_desc=Skurken placerar ett _Dödsmärke_ på en vald fiende. Markerade fiender tar bonusskada, men kan inte dö förrän märket tar slut.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=En kopia av Rogue, gjord av skuggigt mörker. Den står helt stilla, med tomma ögon och små strimlor av mörker som stiger upp från den likt ånga. \n\n Klonen är inte en perfekt kopia av Rogue, men är fortfarande en hyfsad fighter, och kan dra nytta av Rogues utrustning med rätt talanger.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Din klon går för att attackera!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Din klon flyttas till den positionen.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Din klon rör sig för att följa dig.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Du kan hitta den här karaktären med en specifik hjälterustningsförmåga.
actors.hero.abilities.rogue.shadowclone$shadowally.name=skuggskurk
actors.hero.abilities.rogue.shadowclone.desc=Skurken kallar fram en skuggig härmare av sig själv, som kan dirigeras för att hjälpa honom i strid. Att dirigera skuggklonen kostar ingenting.\n\nKlonen har 80 HP, ingen rustning och gör 10-20 skada. Alla dessa egenskaper kan förbättras med talanger, så att klonen drar nytta av vapen och rustningar som hjälten har.
actors.hero.abilities.rogue.shadowclone.name=skuggklon
actors.hero.abilities.rogue.shadowclone.short_desc=Skurken kallar fram en _Skuggklon_, som kan dirigeras för att hjälpa honom i strid.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=På något sätt blir fiender lätt övertygade om att den här trälockbetan är den riktiga skurken!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Du kan hitta den här karaktären med en specifik hjälterustningsförmåga.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=trälockbete
actors.hero.abilities.rogue.smokebomb.desc=Rogue kastar ner en rökbomb och blinkar upp till 6 rutor bort. Han kan blinka genom faror och fiender, men inte genom fast terräng som murar. \n\nFiender som ligger intill Rogues gamla position kommer att bli förblindade i 5 omgångar.
actors.hero.abilities.rogue.smokebomb.fov=Du kan bara hoppa till en tom plats i ditt synfält.
actors.hero.abilities.rogue.smokebomb.name=rökbomb
actors.hero.abilities.rogue.smokebomb.prompt=Välj en plats att hoppa till
actors.hero.abilities.rogue.smokebomb.short_desc=Skurken kastar ner en _Rökbomb_ medan han blinkar bort. Han förblindar fiender nära sin gamla plats.
actors.hero.abilities.warrior.endure$enduretracker.desc=Krigaren gör nu bonusskada baserat på den skada han utstod. \n\nBonusskada: %1$d\nTräffar kvar: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=uthållighet
actors.hero.abilities.warrior.endure.desc=Krigaren håller ut i 3 rundor och tar hälften av skadan från alla källor. Denna minskning tillämpas före skademotståndseffekter som rustning.\n\nEfter att ha utstått ger krigarens nästa träff inom 10 rundor bonusskada. Denna bonusskada är lika med hälften av all skada som tillfogats honom under uthålligheten, före några skademinskningseffekter!\n\nOm krigaren har någon kombination ökar användningen av denna förmåga dess återstående tid med 3 rundor.
actors.hero.abilities.warrior.endure.name=uthärda
actors.hero.abilities.warrior.endure.short_desc=Krigaren _Håller ut_, hoppar över flera turer men får hög motståndskraft mot skadegörelse. Han gör sedan bonusskada baserat på vad han uthärdade.
actors.hero.abilities.warrior.heroicleap.desc=Krigaren hoppar mot en riktad plats och passerar alla fiender eller faror i vägen. Han kan dock inte hoppa över murar eller annan fast terräng.
actors.hero.abilities.warrior.heroicleap.name=heroiskt språng
actors.hero.abilities.warrior.heroicleap.prompt=Välj riktning för att hoppa
actors.hero.abilities.warrior.heroicleap.short_desc=Krigaren utför ett _Heroiskt språng_ mot en riktad plats och seglar över fiender och faror.
actors.hero.abilities.warrior.shockwave.desc=Krigaren slår i marken och producerar en chockvåg som färdas upp till 5 brickor i en 60-graders kon. \n\nFiender som fångas i denna chockvåg blir lamslagna i 5 omgångar. De tar också 5-10 skada, plus ytterligare 1-2 skada för varje styrkepoäng krigaren har över 10.
actors.hero.abilities.warrior.shockwave.name=chockvåg
actors.hero.abilities.warrior.shockwave.short_desc=Krigaren utlöser en _Chockvåg_ i en konisk AOE genom att slå i marken. Fiender som fångas i chockvågen skadas och lamslås.
actors.hero.hero.key_distracted=Du kan inte riktigt få upp låset, du får fortsätta försöka.
actors.hero.hero.leave=Du kan inte gå än, resten av fängelsehålan väntar nedanför!
actors.hero.hero.level_cap=Du kan inte bli starkare, men dina erfarenheter ger dig en våg av kraft!
actors.hero.hero.level_up=Nivå upp!
actors.hero.hero.locked_chest=Den här kistan är låst och du har ingen matchande nyckel.
actors.hero.hero.locked_door=Du har ingen matchande nyckel.
actors.hero.hero.name=du
actors.hero.hero.new_level=Nivå upp! + Noggrannhet, + Undvikning, + 5 HP!
actors.hero.hero.new_talent=+1 talangpoäng!
actors.hero.hero.noticed_smth=Du märkte något.
actors.hero.hero.pain_resist=Smärtan hjälper dig att motstå lusten att sova.
actors.hero.hero.revive=Ankh exploderar med livgivande energi!
actors.hero.hero.search=söka
actors.hero.hero.search_distracted=Det är svårt att koncentrera sig, sökandet är utmattande.
actors.hero.hero.unspent=Du har outnyttjade talangpoäng!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=du kan inte bära: %s.
actors.hero.hero.you_now_have=du hämtade: %s.
actors.hero.heroclass.cleric=präst
actors.hero.heroclass.cleric_desc=Prästen börjar med en _unik helig skrift_, som de kan använda för att kasta olika trollformler.\n\nDe flesta av prästens talanger är inriktade på att lära sig eller uppgradera trollformler.\n\nPrästen börjar också med _en påklädning_, tygrustning, en vattensäck och en sammetspåse.\n\nPrästen identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Reningsdrycker\n_-_ Förbannelsens borttagningsrullar
actors.hero.heroclass.cleric_desc_short=Prästen är en gudomlig trollkarl som använder sin unika _heliga bok_ för att kanalisera gudomlig magi. De kan _lära sig och uppgradera trollformler_ via talanger.
actors.hero.heroclass.cleric_unlock=För att låsa upp prästen, _rengör helt förbannelsen på vilken del av förbannad utrustning som helst._
actors.hero.heroclass.duelist=duellanten
actors.hero.heroclass.duelist_desc=Duelisten börjar med en _unik värja_ med en speciell förmåga som laddas om med tiden.\n\nVarje vapen i spelet har en _olika specialförmåga_ som Duelisten kan använda.\n\nDuelisten börjar också med _två kastspikar_, tygrustning, en vattenskin och en sammetspåse.\n\nDuelisten identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Styrkedrycker\n_-_ Spegelbildsrullar
actors.hero.heroclass.duelist_desc_short=Duelisten är en vapenmästare som kan använda sitt vapen för att utlösa en _speciell vapenförmåga._ Denna speciella förmåga är _olika för varje vapen._
actors.hero.heroclass.duelist_unlock=För att låsa upp Duelisten _utrusta ett vapen av nivå 2 eller högre utan styrkestraff._
actors.hero.heroclass.huntress=jägare
actors.hero.heroclass.huntress_desc=Jägerskan börjar med en _unik andebåge_, som kan avfyra ett oändligt antal trollformade pilar.\n\nJägerskan kan färdas genom högt gräs _utan att trampa på det_.\n\nJägerskan börjar också med _nudlade handskar_, tygrustning, en vattensäck och en sammetspåse.\n\nJägerskan identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Sinnesdrycker Vision\n_-_ Vaggvisans rullar
actors.hero.heroclass.huntress_desc_short=Jägerskan är en mästare på kastade vapen och har en _magisk båge_ med oändliga pilar. Hon färdas också genom högt gräs _utan att trampa på det._
actors.hero.heroclass.huntress_unlock=För att låsa upp Jägaren, _träffa fiender med kastade vapen 10 gånger i ett spel._
actors.hero.heroclass.mage=magiker
actors.hero.heroclass.mage_desc=Magikern börjar med en _unik stav_, som laddas betydligt snabbare än en trollstav och har 1 ytterligare laddning. Staven _kan genomsyras av vilken trollstav som helst_ som magikern hittar i fängelsehålan.\n\nMagikern börjar också med en _trollstav med magisk missil_ genomsyrad av sin stav, tygrustning, en vattensäck och en sammetspåse.\n\nMagikern identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Flytande flammedrycker\n_-_ Uppgraderingsrullar
actors.hero.heroclass.mage_desc_short=Magikern är en arkan expert och bär en _magisk stav_ som är starkare än en trollstav. Staven kan _genomsyras med vilken trollstav_ som helst som magikern hittar.
actors.hero.heroclass.mage_unlock=För att låsa upp magikern, använd en uppgraderingsrulle för att göra ett föremål starkare.
actors.hero.heroclass.rogue=skurk
actors.hero.heroclass.rogue_desc=Skurken börjar med en _unik Skuggmantel_, som han kan använda för att bli osynlig när han vill. ZXQPH0 ZXQZXQPH1 ZXQ Skurken kan _upptäcka hemligheter och fällor_ på större avstånd. ZXQPH2 ZXQZXQPH3 ZXQ Skurken börjar också med _en dolk_, _tre kastknivar_, tygrustning, en vattensäck och en sammetspåse. ZXQPH4 ZXQZXQPH5 ZXQ Skurken identifierar automatiskt: ZXQPH6 ZXQ_-_ Identifieringsrullar ZXQPH7 ZXQ_-_ Osynlighetsdrycker ZXQPH8 ZXQ_-_ Magiska kartläggningsrullar
actors.hero.heroclass.rogue_desc_short=Skurken kan undvika fiender och slå till från osynlighet med hjälp av sin _skuggmantel_. Han _upptäcker också hemligheter och fällor_ på större avstånd.
actors.hero.heroclass.rogue_unlock=För att låsa upp skurken, _utför 10 överraskningsattacker i ett spel._
actors.hero.heroclass.warrior=krigare
actors.hero.heroclass.warrior_desc=Krigaren börjar med ett _unikt brutet sigill_ som ger honom en explosion av sköld när han är under halv hälsa. Sigillet kan flyttas mellan rustningar och kan _överföra en enda uppgradering_ med det.\n\nKrigaren börjar också med ett _slitet kortsvärd_, _tre kaststenar_, tygrustning, en vattensäck och en sammetspåse.\n\nKrigaren identifierar automatiskt:\n_-_ Identifieringsrullar\n_-_ Läkdrycker\n_-_ Raserirullar
actors.hero.heroclass.warrior_desc_short=Krigaren utsätts för extra skada med skydd som ges av hans _brutna sigill._ Sigillet kan flyttas mellan rustningar och _överför en enda uppgradering._
actors.hero.heroclass.warrior_unlock=Krigaren låses upp automatiskt.
actors.hero.herosubclass.assassin=mördare
actors.hero.herosubclass.assassin_desc=Lönnmördaren förbereder sin nästa attack när han blir osynlig. Ju längre han förbereder sig, desto kraftfullare blir hans nästa attack. Förberedelserna bygger upp till 9 turer. \n\nEfter förberedelserna gör lönnmördaren bonusskada på sin nästa attack, kan blinka mot sitt mål och kan till och med omedelbart döda fiender som är tillräckligt svaga.
actors.hero.herosubclass.assassin_short_desc=_Lönnmördaren_ kan förbereda ett dödligt angrepp medan han är osynlig. Ju längre han väntar, desto kraftfullare blir attacken.
actors.hero.herosubclass.battlemage=stridsmakare
actors.hero.herosubclass.battlemage_desc=Stridsmagikern får en bonuseffekt varje gång han slår i närstrid med sin stav, som om hans stav hade en extra förtrollning. Dessa effekter beror på vilken trollstav hans stav är genomsyrad av, varje trollstav har sin egen effekt. Utöver trollstaveffekterna får Stridsmagikerns stav också 0,5 laddningar när han slår med den.
actors.hero.herosubclass.battlemage_short_desc=_Battlemagikern_ frammanar bonuseffekter när han strider i närstrid med sin stav. Dessa effekter beror på vilken trollstav hans stav är genomsyrad av.
actors.hero.herosubclass.berserker=bärsärk
actors.hero.herosubclass.berserker_desc=Bersärkern får raseri när han tar fysisk skada, inklusive skada som blockeras av hans rustning! Raseri avtar stadigt med tiden, men bleknar långsammare om han har låg HP. \n\nRaseri kan få Bersärkern att göra upp till +50 % skada. Vid maximal raseri kan han gå bärsärkagång, få en explosion av sköldning och behålla sin raseri så länge han har sköldning kvar. Sköldningen skalas med nivån på bersärkers rustning och kan ökas massivt om han har låg hälsa. Bersärkern behöver tid att återhämta sig efter att han gått bärsärkagång.
actors.hero.herosubclass.berserker_short_desc=_Bersärkern_ bygger upp raseri när han tar skada. Raseri ökar hans skada och kan aktiveras vid 100% för bonusskydd.
actors.hero.herosubclass.champion=mästare
actors.hero.herosubclass.champion_desc=Mästaren är en mästare på närstridsvapen och kan utrusta henne med ett sekundärt vapen utöver sitt primära. Hennes vanliga attacker använder sitt primära vapen, men hon kan byta ut sitt primära vapen direkt och använda endera vapnets förmåga. \n\n Hon får också 2 extra laddningar för maximal vapenförmåga och +50 % laddningshastighet för vapenförmågan.
actors.hero.herosubclass.champion_short_desc=_Mästaren_ kan använda två vapen och får fler vapenladdningar. Hennes vanliga attacker använder hennes primära vapen, men hon kan byta vapen och använda endera vapnets förmåga.
actors.hero.herosubclass.freerunner=frilöpare
actors.hero.herosubclass.freerunner_desc=Allt eftersom freerunnern rör sig bygger han upp högar av momentum. Han kan få upp till 10 momentum efter att ha sprungit i 10 varv, men förlorar det snabbt om han slutar röra sig. Freerunnern kan använda sin momentum för att börja freerunna, i 2 varv per momentumpunkt. \n\nNär freerunnaren rör sig freerunnern i 2x hastighet och får bonusundvikande i proportion till sin nivå. När freerunningen är slut finns det en nedkylningsperiod innan momentum kan byggas upp igen.
actors.hero.herosubclass.freerunner_short_desc=_Freerunnern_ bygger upp momentum när han springer, vilket kan användas för att starta freerunning. Detta ger honom bonushastighet och undanmanövrering under en kort stund.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_desc=Gladiatoren bygger en kombopoäng varje gång han gör en lyckad attack med ett närstridsvapen eller ett kastat vapen. Om gladiatorn inte gör en lyckad attack inom 5 turer (15 turer efter en kill) återställs hans kombo. \n\n När han bygger en kombo kan gladiatorn använda en mängd olika förmågor som garanterat träffar: \n2 Kombo: slå tillbaka fienden, bevara kombon \n4 Kombo: gör skada baserat på rustning \n6 Kombo: parera, bevara kombon \n8 Kombo: skadar målet och närliggande fiender \n10 Kombo: attackerar en gång för varje kombo
actors.hero.herosubclass.gladiator_short_desc=Gladiatorn bygger kombinationer när han utför framgångsrika attacker. Han kan använda unika förmågor med kombinationer.
actors.hero.herosubclass.monk=munk
actors.hero.herosubclass.monk_desc=Munken är en mästare på fysisk teknik. När hon besegrar fiender får hon energi som kan användas på en mängd olika defensiva och nyttofokuserade förmågor. Denna energi avtar inte med tiden, utan har ett tak baserat på munkens nivå. \n\n1 Energi: slå snabbt med knytnävarna \n2 Energi: fokusera för att undvika nästa attack \n3 Energi: rusa omedelbart i närheten \n4 Energi: sparka bort en fiende \n5 Energi: meditera för att rensa statusar och återställa trollstav- och artefaktladdning.
actors.hero.herosubclass.monk_short_desc=Munken bygger upp energi under strid. Denna energi kan användas på en mängd olika unika förmågor.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_desc=Paladinen får en mängd nya och uppgraderade trollformler som betonar närstrid och synergi med vapen och rustningar.\n\nPaladinens _Heliga vapen_ och _Heliga försvar_-trollformler ger större bonusar, åsidosätter inte längre befintliga förtrollningar och glyfer, och kan utökas genom att kasta andra trollformler.\n\nPaladinen får också _Smite_-trollformeln, som låter dem utföra en garanterad närstridsträff med bonusskada och förtrollningskraft.
actors.hero.herosubclass.paladin_short_desc=_Paladin_ får nya kortdistansbesvärjelser och stärkta versioner av heliga vapen och skydd.
actors.hero.herosubclass.priest=präst
actors.hero.herosubclass.priest_desc=Prästen får en mängd nya och uppgraderade trollformler som betonar distansstrid och synergi med magiska föremål.\n\nPrästen kan kasta _Vägledande Ljus_ gratis en gång var 50:e tur, belyser fiender som är direkt måltavlor för någon av deras trollformler och kan konsumera illumination-debuff med allierade, trollstavar och vissa artefakter för bonusskada lika med deras nivå + 5.\n\nPrästen får också _Strålstyrka_-trollformeln, som skingrar mörker och påverkar alla synliga fiender, utlöser och applicerar illumination och bedövar dem kortvarigt för en kostnad av 2 laddningar.
actors.hero.herosubclass.priest_short_desc=_Prästen_ får nya långsiktiga trollformler och en stärkt version av vägledande ljus.
actors.hero.herosubclass.sniper=prickskytt
actors.hero.herosubclass.sniper_desc=Krypskytten är en mästare på distansstrid, vars distansattacker genomborrar fiendens rustning. När hon attackerar en fiende med ett kastat vapen placerar hon ett krypskyttemärke på dem, vilket låter henne följa upp med en specialattack från hennes båge. Denna specialattack varierar beroende på hur hennes båge är förstärkt. \n\n En oförstärkt båge avfyrar en ögonblicksbild som gör reducerad skada men avfyras omedelbart. En snabb båge avfyrar en salva av tre pilar som gör reducerad skada, kan fortfarande aktivera förtrollningar och tar 1 tur att avfyra. En skadande båge avfyrar ett krypskytteskott som garanterat träffar, gör bonusskada baserat på avstånd och tar 2 turar att avfyra.
actors.hero.herosubclass.sniper_short_desc=_Prickskytt_ kan genomborra rustning med sina distansattacker. Efter att ha anfallit med ett kastat vapen kan hon följa upp med en specialattack från sin båge.
actors.hero.herosubclass.warden=föreståndare
actors.hero.herosubclass.warden_desc=Vakten har en stark koppling till naturen vilket ger henne en mängd bonuseffekter relaterade till gräs och växter. Hon kan se genom högt och fårat gräs som om det vore tomrum. \n\nVakten får gräs att spira runt alla frö hon kastar eller planterar, och får specialeffekter när hon trampar ner växter. Dessa specialeffekter ersätter de vanliga växteffekterna, vilket innebär att ingen växt är skadlig för henne att trampa på.
actors.hero.herosubclass.warden_short_desc=_Vakten_ kan se genom högt gräs och får bonuseffekter när hon planterar frön och trampar ner växter.
actors.hero.herosubclass.warlock=trollkarl
actors.hero.herosubclass.warlock_desc=Trollkarlen har chansen att tillfoga karaktärer ett själsmärke när hen använder trollstavar på dem. Chansen att applicera ett själsmärke och dess varaktighet ökar med trollstavnivån. \n\nNär en fiende är själsmärkt, kommer Trollkarlen att läka 2 hk för varje 5 skada hen tillfogar dem, men bara med attacker från närstrid eller kastade vapen, inte från trollstavar!
actors.hero.herosubclass.warlock_short_desc=_Warlock_ har en chans att själsmärka fiender med sina trollstavar. Han kommer att läka när han gör fysisk skada på markerade fiender.
actors.hero.spells.auraofprotection$aurabuff.desc=Paladinen utstrålar skyddande energi runt sig.\n\nAlla närliggande allierade (inklusive Paladinen själva) tar minskad skada och får effekten av Paladinens rustningsglyf med ökad kraft.\n\nÅterstående turar: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura av skydd
actors.hero.spells.auraofprotection.desc=Paladinen börjar utstråla skyddande energi i en glittrande aura runt sig själv i 20 omgångar. Alla allierade inom 2 rutor från Paladinen (inklusive sig själva) tar %1$d%% mindre skada och får effekten av Paladinens rustningsglyf med +%2$d%% kraft.\n\nDenna skademinskning sker före andra skademinskande effekter (t.ex. rustning). Glyfens kraftökning kommer alltid att tillämpas, men denna besvärjelse kan inte orsaka att Paladinens glyf tillämpas mer än en gång om en karaktär redan drar nytta av den (t.ex. Paladinen själv eller en prismatisk bild).
actors.hero.spells.auraofprotection.name=aura av skydd
actors.hero.spells.auraofprotection.short_desc=Stärker försvaret för Paladin och närliggande allierade.
actors.hero.spells.beamingray$beamingrayboost.desc=Denna allierade teleporterades nyligen av Beaming Ray, vilket gav dem bonusskada mot närmaste fiende efter teleporteringen. Mångas Kraft förfaller inte heller när denna buff är aktiv. \n\nÅterstående tur: %s.
actors.hero.spells.beamingray$beamingrayboost.name=strålande stråle
actors.hero.spells.beamingray.desc=Prästen kanaliserar kraften på sin allierade till en ljusstråle som strålar dem till en plats. Om strålen kolliderar med en fiende kommer den att placera allierade i närheten och rikta dem mot fienden. \n\nStrålen har en maximal räckvidd på %1$d-rutor och kommer att öka Mångas Krafts bonusskada till +%2$d%% i 10 turer mot den närmaste fienden inom 4 rutor. Den strålande strålen kan till och med teleportera normalt orörliga allierade, men dess räckvidd halveras i dessa fall.
actors.hero.spells.beamingray.name=strålande stråle
actors.hero.spells.beamingray.no_space=Det finns inget utrymme för din allierade att synas där.
actors.hero.spells.beamingray.out_of_range=Den platsen är utom räckhåll.
actors.hero.spells.beamingray.short_desc=Teleporterar din allierade och ger bonusskada.
actors.hero.spells.blessspell.desc=Prästmannen ger en helig välsignelse över sig själv eller en annan karaktär de kan se.\n\nNär besvärjelsen kastas på sig själv är effekten svagare, vilket ger %1$d välsignelseomgångar och %2$d barriär.\n\nNär besvärjelsen kastas på andra karaktärer är den kraftfullare, vilket ger %3$d välsignelseomgångar och %4$d läkning. Överskottsläkning omvandlas till barriär.
actors.hero.spells.blessspell.name=välsigna
actors.hero.spells.blessspell.short_desc=Välsignar och sköldar prästen, välsignar och helar andra.
actors.hero.spells.bodyform$bodyformbuff.desc=Trinitys kroppsform ger dig för närvarande kraften av en förtrollning eller glyf, som om du hade den utrustad på ditt nuvarande vapen eller din rustning.\n\nObservera att kroppsformen inte kan ge ytterligare en kopia av en effekt som du redan drar nytta av.\n\nAktuell effekt: %1$s.\n\nÅterstående turar: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=kroppsform
actors.hero.spells.bodyform.desc=Prästmannen väljer en förtrollning eller glyf som de har identifierat under denna körning och ger Trinity dess effekt.\n\nNär Trinity används får Prästmannen effekten av den valda förtrollningen eller glyfen för %d-omgångar. Denna tillfälliga förtrollning eller glyf fungerar med alla effekter som en vanlig förtrollning eller glyf skulle fungera med.\n\nDenna besvärjelse ersätter alla andra kroppseffekter som Trinity för närvarande är genomsyrad av.
actors.hero.spells.bodyform.name=kroppsform
actors.hero.spells.bodyform.short_desc=Tilldelar Trinity till en förtrollning eller glyf.
actors.hero.spells.cleanse.desc=Prästen eliminerar alla skadliga statuseffekter på sig själv och synliga allierade. Efter att besvärjelsen är slut får alla berörda karaktärer också %1$d-omgångar av debuff-immunitet och %2$d-barriär.
actors.hero.spells.cleanse.name=rengöra
actors.hero.spells.cleanse.short_desc=Rensar debuffs och ger sköldning.
actors.hero.spells.clericspell.charge_cost=Avgiftskostnad: %d
actors.hero.spells.clericspell.invalid_enemy=Du kan inte rikta in dig på den fienden.
actors.hero.spells.clericspell.invalid_target=Du kan inte rikta in dig på den platsen.
actors.hero.spells.clericspell.no_target=Det finns inget mål där.
actors.hero.spells.clericspell.prompt=Välj ett mål
actors.hero.spells.divineintervention.desc=Prästskapet öser en enorm mängd kraft från sin bok till sig själva och allierade, vilket boostar alla till %1$d-sköldning och utökar Uppstigen Form med %2$d-turer. Denna besvärjelse otroliga defensiva kraft vägs mot dess mycket höga laddningskostnad. \n\n Precis som annan sköldning som beviljas av uppstigen form, förfaller inte denna sköldning normalt, utan upphör omedelbart när den uppstigna formen upphör.
actors.hero.spells.divineintervention.name=gudomlig ingripande
actors.hero.spells.divineintervention.short_desc=Massiv sköldförstärkning till präster och allierade.
actors.hero.spells.divinesense$divinesensetracker.desc=Den här karaktären kan tillfälligt se andra varelser i närheten med sina sinnen!\n\nÅterstående turar: %s.
actors.hero.spells.divinesense$divinesensetracker.name=gudomlig känsla
actors.hero.spells.divinesense.desc=Prästen fokuserar sina sinnen på omgivningen och får sinnessyn med en %d-ruträckvidd i 50 omgångar. Denna besvärjelse tar ingen tid att kasta.
actors.hero.spells.divinesense.name=gudomlig känsla
actors.hero.spells.divinesense.short_desc=Få tillfällig sinnesvision inom ett brett spektrum.
actors.hero.spells.flash.desc=Prästen kanaliserar sin uppstigna form till en närliggande plats och teleporterar dit. Flash kan teleportera Prästen till vilken upptäckt plats som helst som är inom räckhåll och ledig. Denna besvärjelse kostar mer tomeavgifter varje gång den används i samma uppstigna form.
actors.hero.spells.flash.name=flash
actors.hero.spells.flash.prompt=Välj en plats
actors.hero.spells.flash.short_desc=Teleportera till en närliggande plats.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Prästen kommer att kunna kasta Vägledande Ljus gratis igen efter att 50 turar har gått. \n\n Återstående turar: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Vägledande ljus
actors.hero.spells.guidinglight$illuminated.desc=Den här karaktären lyser efter att ha blivit träffad av ledljus. Även om glöden inte är tillräckligt stark för att lysa upp omgivningen, kommer den magiska effekten att göra det mycket lättare för prästen att träffa den.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andra hjältar kan fortfarande använda upplyst för att dra nytta av den brännande ljustalangen, men kommer inte att uppnå någon precision.
actors.hero.spells.guidinglight$illuminated.desc_priest=Prästen kan dessutom konsumera upplysta föremål med strålglans, ett trollstavslag, attack från en allierad eller effekter från vissa artefakter. Att använda upplysta föremål på detta sätt ger bonusmagisk skada motsvarande Prästens nivå + 5.
actors.hero.spells.guidinglight$illuminated.name=upplyst
actors.hero.spells.guidinglight.desc=Prästen avfyrar en magisk energibloss som träffar ett mål, orsakar 2–8 skada och belyser det. Nästa icke-belastade fysiska attack mot en upplyst fiende garanterar att träffa dem.
actors.hero.spells.guidinglight.desc_priest=_Denna besvärjelse är kraftfullare när den utförs av Prästen._ Den första utkastningen av besvärjelsen var 50:e tur kostar inga laddningar, och belysning kommer att förbrukas av strålglans, trollstavar, andra karaktärer och artefakter som direkt påverkar fiender. När belysning används på detta sätt ger den bonusmagisk skada motsvarande Prästens nivå + 5.
actors.hero.spells.guidinglight.name=Vägledande ljus
actors.hero.spells.guidinglight.short_desc=Erbjudanden varierade i magisk skada och garanterar en träff.
actors.hero.spells.hallowedground$hallowedterrain.desc=Marken har helgats här. Helgad mark saktar ner fiender, helar allierade och får gräs att sprida sig.
actors.hero.spells.hallowedground.desc=Prästen fokuserar sin gudomliga magi i marken i närheten och skapar ett %1$dx%1$d område med helig terräng i 20 rundor.\n\nNär den kastas, läker denna besvärjelse alla allierade för 15 HP (friska allierade och prästen får sköld), rotar fiender kortvarigt och sprider kort gräs.\n\nDen heliggjorda terrängen läker allierade för 1 HP per runda (friska allierade och prästen får sköld), lemlästar fiender och får slumpmässigt högt gräs att växa.\n\nHelig terräng förstörs av eld och kommer att producera fårat gräs om passiva regenereringseffekter inaktiveras eller om prästen inte har fått erfarenhet på ett tag.
actors.hero.spells.hallowedground.name=helig mark
actors.hero.spells.hallowedground.prompt=Välj en plats
actors.hero.spells.hallowedground.short_desc=Läker allierade, saktar ner fiender och sprider gräs i en AOE.
actors.hero.spells.holyintuition.cursed=Du anar att ondskefull magi lurar inuti det här föremålet.
actors.hero.spells.holyintuition.desc=Prästen fokuserar sina sinnen på ett föremål och avgör om det är förbannat eller inte utan att behöva utrusta det.
actors.hero.spells.holyintuition.name=helig intuition
actors.hero.spells.holyintuition.prompt=välj ett objekt
actors.hero.spells.holyintuition.short_desc=identifierar om ett föremål är förbannat eller inte.
actors.hero.spells.holyintuition.uncursed=Denna artikel är fri från ondskefull magi.
actors.hero.spells.holylance$lancecooldown.desc=Prästen har nyligen kastat Helig lans och måste vänta innan han kastar den igen. \n\n Återstående tur: %s
actors.hero.spells.holylance$lancecooldown.name=Helig lans nedkylning
actors.hero.spells.holylance.desc=Prästen koncentrerar en stor mängd energi i en förödande kastad lans gjord av ljus. Denna lans gör %1$d-%2$d skada och gör alltid maximal skada på odöda och demoniska mål. \n\n Denna besvärjelse är mycket dyr och har en nedkylningstid på 30 varv.
actors.hero.spells.holylance.name=helig lans
actors.hero.spells.holylance.short_desc=Gör stor magisk skada på avstånd.
actors.hero.spells.holyward$holyarmbuff.desc=Prästmästaren har genomsyrat deras slitna rustning med helig energi, vilket tillfälligt åsidosätter alla befintliga glyfer och får rustningen att blockera ytterligare 1 skadapoäng. \n\n Återstående tur: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladinen har genomsyrat sin slitna rustning med helig energi, vilket gör att rustningen blockerar ytterligare 3 skadapoäng.\n\nAtt kasta andra besvärjelser medan den heliga avdelningen är aktiv kommer att förlänga dess varaktighet med 10 turar per spenderad laddning.\n\nÅterstående turar: %s.
actors.hero.spells.holyward$holyarmbuff.name=heliga avdelningen
actors.hero.spells.holyward.desc=Prästen genomsyrar sin slitna rustning med tecken av heligt ljus, vilket ökar rustningens skadablockering med 1. Denna besvärjelse tar ingen tid att kasta. \n\nDenna tecknet varar i 50 varv och kommer att åsidosätta alla fördelaktiga tecken som rustningen har under hela tiden. Prästen kommer att dra nytta av denna effekt även om de inte har någon rustning.
actors.hero.spells.holyward.desc_paladin=_Denna besvärjelse är kraftfullare när den kastas av Paladinen._ Den extra skadablockeringen ökas till 3, besvärjelsen åsidosätter inte längre befintliga symboler, och att kasta andra besvärjelser medan den heliga avdelningen är aktiv kommer att förlänga dess varaktighet med 10 varv per använd laddning.
actors.hero.spells.holyward.glyph_desc=Denna teckensymbol ökar något mängden skada som rustning kan blockera.
actors.hero.spells.holyward.glyph_name=%s av ljus
actors.hero.spells.holyward.name=heliga avdelningen
actors.hero.spells.holyward.short_desc=Åsidosätter tillfälligt glyfer för att öka rustningsblockering.
actors.hero.spells.holyweapon$holywepbuff.desc=Prästmannen har genomsyrat sitt slitna vapen med helig energi, vilket tillfälligt åsidosätter all befintlig förtrollning och får vapnet att göra 2 extra magisk skada på varje attack. \n\n Återstående tur: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladinen har genomsyrat sitt slitna vapen med helig energi, vilket gör att deras attacker orsakar ytterligare 6 magiska skador.\n\nAtt kasta andra besvärjelser medan det heliga vapnet är aktivt förlänger dess varaktighet med 10 varv per spenderad laddning.\n\nÅterstående varv: %s.
actors.hero.spells.holyweapon$holywepbuff.name=heligt vapen
actors.hero.spells.holyweapon.desc=Prästen förtrollar sitt slitna vapen med helig energi, vilket gör att vapnet orsakar ytterligare 2 magiska skador varje gång de träffar en fiende med det. Denna besvärjelse tar ingen tid att kasta. \n\nDenna förtrollning varar i 50 varv och kommer att åsidosätta alla fördelaktiga förtrollningar som vapnet har under tiden. Obeväpnade attacker kan också dra nytta av denna effekt.
actors.hero.spells.holyweapon.desc_paladin=_Denna besvärjelse är kraftfullare när den kastas av Paladinen._ Den extra magiska skadan ökas till 6, besvärjelsen åsidosätter inte längre befintliga förtrollningar, och att kasta andra besvärjelser medan det heliga vapnet är aktivt kommer att förlänga dess varaktighet med 10 varv per använd laddning.
actors.hero.spells.holyweapon.ench_desc=Fiender som träffas av ett heligt vapen kommer att ta extra magisk skada.
actors.hero.spells.holyweapon.ench_name=heliga %s
actors.hero.spells.holyweapon.name=heligt vapen
actors.hero.spells.holyweapon.short_desc=Åsidosätter tillfälligt förtrollningar för att öka skadan.
actors.hero.spells.judgement.desc=Prästen slår sin knytnäve i marken, vilket orsakar ett ljusutbrott som gör skada på alla fiender de kan se. Detta gör %1$d-%2$d skada vid basen, men gör också ytterligare 33%% skada för varje besvärjelse som prästen har kastat sedan de inträtt i uppstigen form (eller sedan de senast kastade Dom).\n\nFör närvarande gör Dom %3$d-%4$d skada.
actors.hero.spells.judgement.name=dom
actors.hero.spells.judgement.short_desc=Skadar alla synliga fiender.
actors.hero.spells.layonhands.desc=Paladinen kanaliserar helig energi genom sina händer och läker eller skyddar vad de än rör vid.\n\nPaladinen kan kasta denna besvärjelse på vilken angränsande karaktär som helst för att ge dem %1$d läkning, eller på sig själva för att få %1$d sköldning. Överskottsläkning från denna besvärjelse omvandlas till sköldning.\n\nDenna besvärjelse kastas omedelbart och kan kastas upprepade gånger, men kan inte ge mer än tre kast av sköldning åt gången.
actors.hero.spells.layonhands.name=lägga på händerna
actors.hero.spells.layonhands.short_desc=Läker omedelbart en angränsande karaktär eller skyddar paladinen.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Prästen kastade nyligen Livslänk på denna allierade.\n\nUtöver Livslänkens vanliga fördelar tar denna karaktär också minskad skada, alla positiva prästbesvärjelser tillämpas på både präst och denna allierade istället för bara en, och Mångas Kraft kommer inte att förfalla medan denna buff är aktiv.\n\nÅterstående turar: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=livslänkskydd
actors.hero.spells.lifelinkspell.desc=Prästen stärker länken mellan sig själva och sin bemyndigade allierade. Med denna bemyndigade länk kommer all skada som tas att delas mellan både hjälten och dennes allierade under %1$d-turer, och Mångas Krafts defensiva boost kommer att ökas till -%2$d%% skada som tagits. Observera att skadan delas efter rustning, men före Mångas Krafts skadereducering. \n\nMedan denna effekt är aktiv, kommer gynnsamma prästformler på T3 eller lägre att gälla för både präst och dennes allierade om de bara skulle ha gällt för en av dem.
actors.hero.spells.lifelinkspell.name=livslänk
actors.hero.spells.lifelinkspell.short_desc=Delar skada med en allierad och minskar deras skada.
actors.hero.spells.mindform.desc=Prästmästaren väljer en trollstav eller kastade vapen som de har identifierat under denna löpning och genomsyrar Trinity med dess effekt.\n\nNär Trinity används kan Prästmästaren göra en enda attack som om de använde det valda föremålet vid +%d. Detta kommer att utlösa alla effekter som användning av den typen av föremål normalt skulle utlösa.\n\nDenna besvärjelse ersätter alla andra tankeeffekter som Trinity för närvarande är genomsyrad av.
actors.hero.spells.mindform.name=sinneform
actors.hero.spells.mindform.short_desc=Tilldelar Trinity till en trollstav eller ett kastat vapen.
actors.hero.spells.mnemonicprayer.desc=Prästen uttalar en bön som förlänger varaktigheten av alla buffs eller debuffs på ett specifikt mål med %1$d turer. Denna besvärjelse tar ingen tid att uttala. Positiva effekter varar längre på allierade (inklusive prästen själva), och skadliga effekter varar längre på fiender. \n\nMnemonisk bön kan bara förlänga en specifik instans av en buff eller debuff en gång, och kan inte förlänga buffs som beviljats från rustningsförmågor.
actors.hero.spells.mnemonicprayer.name=mnemonisk bön
actors.hero.spells.mnemonicprayer.short_desc=Utökar buffs/debuffs på en allierad/fiende och återapplicerar upplyst.
actors.hero.spells.radiance.desc=Prästen bryter ut i heligt ljus och bedövar alla synliga fiender i 3 omgångar. Om en fiende redan är upplyst, kommer Radiance att utlösa Illuminates bonusskada och sedan tillämpa den upplysta debuff. Radiance kommer också att få Prästen att glöda i 100 omgångar om den aktuella våningen är mörk.
actors.hero.spells.radiance.name=strålglans
actors.hero.spells.radiance.short_desc=Lyser upp och bedövar kortvarigt synliga fiender.
actors.hero.spells.recallinscription$useditemtracker.desc=Prästmannen har nyligen använt ett föremål som fungerar med den inskrivna återkallningsbesvärjelsen. Prästmannen kan uttala besvärjelsen för att upprepa föremålets effekt.\n\nAnvänt föremål: %1$s.\n\nÅterstående turar: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=nyligen använd runa
actors.hero.spells.recallinscription.desc=Prästen använder helig magi för att återskapa effekten av en magisk runa som hittats på en runsten eller skriftrulle de använde under de senaste %s-omgångarna. Återkallelseinskriptionen kan inte användas för att replikera uppgraderingsskriftrullar. Laddningskostnaden för denna besvärjelse varierar beroende på vilket föremål som användes nyligen: 2 för en runsten, 3 för en skriftrulle, 4 för en exotisk skriftrulle. Denna laddningskostnad fördubblas också när man replikerar en transmutationsskriftrulle eller alkemiföremål som måste tillverkas med transmutation eller uppgradering.
actors.hero.spells.recallinscription.name=återkallelseinskription
actors.hero.spells.recallinscription.short_desc=Upprepar en nyligen använd runsten eller skriftrulle.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=En tunn ljussköld står mellan den här karaktären och en fiende. Den är inte stark nog att blockera attacker helt och hållet, men den kommer att mildra dem. \n\n Återstående tur: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=sköld av ljus
actors.hero.spells.shieldoflight.desc=Prästen skapar en tunn ljusbarriär mellan sig själv och en fiende, vilket ökar deras rustnings blockkraft mot den fienden med %1$d-%2$d i 5 omgångar. \n\nDenna besvärjelse tar ingen tid att kasta, men kan inte användas mot flera mål samtidigt.
actors.hero.spells.shieldoflight.name=sköld av ljus
actors.hero.spells.shieldoflight.short_desc=Ger tillfällig rustning mot ett mål.
actors.hero.spells.smite.desc=Paladinen ger ett närstridsanfall rättfärdig destruktiv kraft.\n\nFörutom att göra normal närstridsskada, utför Smite icke-besvärade attacker som garanterat träffar, har +300%% förtrollningskraft och gör %1$d - %2$d bonusmagisk skada.\n\nSmites bonusmagiska skada skalas med Paladinens nivå, och den kommer alltid att göra maximal bonusmagisk skada mot odöda eller demoniska fiender.
actors.hero.spells.smite.name=slå
actors.hero.spells.smite.short_desc=Garanterar en träff med bonusskada och förtrollningskraft.
actors.hero.spells.spiritform$spiritformbuff.desc=Trinitys andeform ger dig för närvarande kraften hos ett föremål, som om du hade det utrustad.\n\nObservera att andeform inte kan tillhandahålla en annan kopia av en effekt som du redan drar nytta av.\n\nAktuell effekt: %1$s.\n\nÅterstående tur: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=andeform
actors.hero.spells.spiritform.desc=Prästmannen väljer en ring eller artefakt som de har identifierat under denna period (förutom den heliga boken) och ger Trinity dess effekt.\n\nOm en ring väljs, ger Trinity den ringens effekt vid +%1$d i 20 turer.\n\nOm en artefakt väljs, replikerar Trinity den artefaktens effekt vid +%2$d. Varje artefakt har olika specifika beteenden och rustningsladdningskostnader när den används med Trinity.\n\nDenna besvärjelse ersätter alla andra andeeffekter som Trinity för närvarande är genomsyrad av.
actors.hero.spells.spiritform.name=andeform
actors.hero.spells.spiritform.short_desc=Tilldelar Trinity till en ring eller artefakt.
actors.hero.spells.stasis$stasisbuff.desc=Prästen har för närvarande en allierad lagrad i stasis. Alla positiva effekter på denna allierade bevaras, inklusive Mångas Kraft, och de kommer att dyka upp igen bredvid Prästen när effekten slutar. Effekten kan också avslutas i förtid genom att omkasta Stasis.\n\nAllierad i stasis: %1$s.\nÅterstående tur: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Din orörliga allierade är lämnad kvar.
actors.hero.spells.stasis$stasisbuff.name=allierad i stagnation
actors.hero.spells.stasis.desc=Prästen fokuserar sin koppling till sin allierade mot sig själv, vilket gör att allierade tillfälligt hålls i ett slags energistasis inom Prästen. Allierade kommer att bevaras i upp till %d turer, där alla positiva effekter på dem inte påverkas av deras tid i stasis. \n\n Allierade kommer att dyka upp bredvid Prästen när stasis upphör naturligt, eller så kan de omedelbart återge besvärjelsen utan kostnad för att avsluta effekten i förtid. Stasis kan till och med flytta orörliga allierade, men kan inte överföra dem mellan våningar.
actors.hero.spells.stasis.name=stasis
actors.hero.spells.stasis.short_desc=Tar bort allierade från fängelsehålan och bevarar dem.
actors.hero.spells.sunray.desc=Prästen avfyrar en stråle av bländande ljus mot ett mål, vilket orsakar %1$d-%2$d skada och bländar dem i %3$d-omgångar. Solstrålen gör alltid maximal skada på odöda och demoniska mål. \n\nEfter att ha blivit träffad med denna besvärjelse kommer en fiendes syn att justeras, vilket förhindrar att de blir bländade av den igen. Men om de träffas igen medan de är bländade av denna besvärjelse, är ljuset överväldigande och förlamar dem istället.
actors.hero.spells.sunray.name=solstråle
actors.hero.spells.sunray.short_desc=Ger magisk skada på avstånd och förblindar ett mål en gång.
actors.hero.spells.walloflight$lightwall.desc=Skimrande ljuspaneler blockerar passagen här.
actors.hero.spells.walloflight.desc=Paladinen skapar en vägg gjord av paneler av fast ljus direkt framför dem. Den är 1 platta tjock, %1$d plattorna breda och varar i 20 varv. \n\nDenna vägg fungerar precis som en vanlig, förutom att den kan ses igenom. Fiender som fastnar i väggen när den skapas kommer att bli tillfälligt bedövade och om möjligt knuffas tillbaka. Allt som fastnat i väggen kommer att kunna röra sig ut ur den. \n\nMuren kan kastas i vilken som helst av de fyra kardinalriktningarna eller fyra diagonala riktningarna. Om en vägg redan är aktiv kan besvärjelsen återanvändas gratis för att omedelbart rensa väggen.
actors.hero.spells.walloflight.early_end=Du skingrar ljusets vägg.
actors.hero.spells.walloflight.name=vägg av ljus
actors.hero.spells.walloflight.short_desc=Skapar en mur som blockerar fiender.
actors.hero.talent$aggressivebarriercooldown.desc=Du har nyligen använt den här talangen och måste vänta innan du använder den igen. \n\n Återstående tur: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressiv barriärnedkylning
actors.hero.talent$combinedlethalityabilitytracker.executed=avrättad
actors.hero.talent$deadlyfollowuptracker.desc=Duelisten har nyligen attackerat en fiende med ett kastat vapen, hennes närstridsattacker mot samma mål kommer att ha ökat skadan.\n\nÅterstående tur: %s.
actors.hero.talent$deadlyfollowuptracker.name=dödlig uppföljning
actors.hero.talent$followupstriketracker.desc=Jägaren har nyligen attackerat en fiende med ett kastat vapen, hennes nästa närstridsattack mot samma mål kommer att ha ökad skada.\n\nÅterstående turar: %s.
actors.hero.talent$followupstriketracker.name=uppföljningsstrejk
actors.hero.talent$improvisedprojectilecooldown.desc=Du har nyligen använt den här talangen och måste vänta innan du använder den igen. \n\n Återstående tur: %s.
actors.hero.talent$improvisedprojectilecooldown.name=nedkylning av improviserade projektiler
actors.hero.talent$lethalhastecooldown.desc=Du har nyligen använt den här talangen och måste vänta innan du använder den igen. \n\n Återstående tur: %s.
actors.hero.talent$lethalhastecooldown.name=dödlig hastig nedkylning
actors.hero.talent$lingeringmagictracker.desc=Magikern har nyligen använt en stav eller trollstav, hans nästa fysiska attack kommer att göra bonusskada. \n\n Återstående turar: %s.
actors.hero.talent$lingeringmagictracker.name=kvarvarande magi
actors.hero.talent$liquidagilacctracker.desc=Duelistens nästa regelbundna närstridsattack får bonusprecision.\n\nÅterstående tur: %s.
actors.hero.talent$liquidagilacctracker.name=flytande smidighet
actors.hero.talent$patientstriketracker.desc=Duelisten har precis väntat en tur, hennes nästa närstridsattack kommer att göra bonusskada.
actors.hero.talent$patientstriketracker.name=patientstrejk
actors.hero.talent$preciseassaulttracker.desc=Duelistens nästa regelbundna närstridsattack får bonusprecision.\n\nÅterstående tur: %s.
actors.hero.talent$preciseassaulttracker.name=precist anfall
actors.hero.talent$provokedangertracker.desc=Krigaren har nyligen förlorat sin sköld, hans nästa fysiska attack kommer att göra bonusskada. \n\n Återstående turar: %s.
actors.hero.talent$provokedangertracker.name=framkallad ilska
actors.hero.talent$rejuvenatingstepscooldown.desc=Du har nyligen använt den här talangen och måste vänta innan du använder den igen. \n\n Återstående tur: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=föryngrande steg nedkylning
actors.hero.talent$satiatedspellstracker.desc=Nästa besvärjelse som prästen kastar kommer att ge dem en liten mängd sköld.
actors.hero.talent$satiatedspellstracker.name=Skyddande besvärjelse
