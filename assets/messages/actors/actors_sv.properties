actors.mobs.elemental.desc=Vandrande eldelementarer blir kvar efter åkallandet av mäktigare väsen. Deras natur är så kaotisk att inte ens den skickligaste demonolog kan tygla dem.
actors.mobs.elemental.name=eldelementar
actors.mobs.king.desc=Dvärgarnas siste kung var känd för sin djupa kunskap om liv och död. Han övertalade sitt hov att delta i en ritual som skulle ge dem evig ungdom. Till slut var han den ende som fick den – och en armé av odöda på köpet.
actors.mobs.king.name=Dvärgarnas kung
actors.mobs.npcs.bee.desc=Trots sin ringa storlek försvarar gyllene bin sin herre ursinnigt. De lever dock inte särskilt länge.
actors.mobs.npcs.bee.name=gyllene bi
actors.mobs.shielded.desc=Bjässarna är de största, starkaste och tåligaste av alla gnoller. När de blir svårt sårade går de bärsärkagång och tillfogar sina fiender ännu mer skada.
actors.mobs.shielded.name=bjässe med sköld
actors.mobs.yog.desc=Yog-Dzewa är en gammal gud, en mäktig varelse från kaosets rike. För ett sekel sedan vann de forntida dvärgarna nätt och jämnt kriget mot deras demoner, men de kunde inte döda själva guden. Istället fängslade de den i hallarna nedanför sin stad, i tron att den var för svag för att någonsin resa sig igen.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s bär en _%s_. Uppenbarligen stulen.
actors.buffs.armorevasion.name=Undflyende
actors.mobs.king.defeated=Du kan inte döda mig, %s... Jag är... odödlig...
