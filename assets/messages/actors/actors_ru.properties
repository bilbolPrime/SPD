actors.blobs.blizzard.desc=Здесь бушует метель.
actors.blobs.blizzard.name=метель
actors.blobs.confusiongas.desc=Здесь клубится облако газа, вызывающего замешательство.
actors.blobs.confusiongas.name=газ путаницы
actors.blobs.corrosivegas.desc=Здесь клубится облако смертельно опасного едкого газа.
actors.blobs.corrosivegas.name=коррозионный газ
actors.blobs.electricity.desc=Здесь ярко вспыхивает электрическое поле.
actors.blobs.electricity.name=электричество
actors.blobs.electricity.ondeath=Вы были убиты шоком...
actors.blobs.electricity.rankings_desc=Удар электрическим током
actors.blobs.fire.desc=Здесь бушует пожар.
actors.blobs.fire.name=огонь
actors.blobs.foliage.desc=Лучи света пронзают мрак подземного сада.
actors.blobs.foliage.name=листва
actors.blobs.freezing.desc=Здесь неестественно холодно.
actors.blobs.freezing.name=ледяной воздух
actors.blobs.goowarn.desc=Здесь роятся частицы темной энергии!
actors.blobs.goowarn.name=темная энергия
actors.blobs.inferno.desc=Здесь бушует настоящий ад.
actors.blobs.inferno.name=ад
actors.blobs.paralyticgas.desc=Здесь кружится облако парализующего газа.
actors.blobs.paralyticgas.name=парализующий газ
actors.blobs.regrowth.name=повторный рост
actors.blobs.sacrificialfire.desc=Здесь находится алтарь, на вершине которого горит жертвенный огонь. Любое существо, убитое здесь, будет съедено в качестве подношения духам подземелья. Возможно, будет награда, если будет принесено достаточно жертв?
actors.blobs.sacrificialfire.name=жертвенный огонь
actors.blobs.sacrificialfire.reward=Огонь вспыхивает, а затем рассеивается, оставляя после себя награду!
actors.blobs.sacrificialfire.unworthy=Огонь поглощает ваше подношение, но не меняется.
actors.blobs.sacrificialfire.worthy=Огонь поглощает ваше подношение и разгорается все сильнее.
actors.blobs.smokescreen.desc=Здесь клубится густое облако черного дыма.
actors.blobs.smokescreen.name=дымовая завеса
actors.blobs.stenchgas.desc=Здесь витает облако зловонного запаха.
actors.blobs.stenchgas.name=зловоние газа
actors.blobs.stormcloud.desc=Здесь клубится облако водяного пара.
actors.blobs.stormcloud.name=грозовые тучи
actors.blobs.toxicgas.desc=Здесь клубится зеленоватое облако токсичного газа.
actors.blobs.toxicgas.name=токсичный газ
actors.blobs.toxicgas.ondeath=Вы умерли от отравления токсичным газом...
actors.blobs.toxicgas.rankings_desc=Задохнулся
actors.blobs.waterofawareness.desc=Сила знания исходит от воды этого колодца. Выпив воды из колодца, вы полностью идентифицируете все экипированные предметы, выявите проклятия на всех предметах в вашем инвентаре и увидите все предметы на текущем этаже.
actors.blobs.waterofawareness.name=вода осознания
actors.blobs.waterofawareness.procced=Сделав глоток, вы чувствуете, как знания наполняют ваш разум.
actors.blobs.waterofhealth.desc=Вода из этого колодца излучает целительную силу. Питье из этого колодца залечит ваши раны, утолит голод и снимет проклятия с любых изношенных вещей.
actors.blobs.waterofhealth.name=вода здоровья
actors.blobs.waterofhealth.procced=Сделав глоток, вы чувствуете, как ваши раны полностью заживают.
actors.blobs.web.desc=Здесь всё покрыто густой паутиной. Всё, что коснётся этой паутины или будет брошено сквозь неё, разорвёт её, но при этом застрянет на месте.
actors.blobs.web.name=паутина
actors.buffs.adrenaline.desc=Прилив физической силы, адреналин усиливает как атаку, так и скорость передвижения. Адреналин позволяет цели бегать в 2 раза быстрее и атаковать в 1,5 раза быстрее. Осталось ходов: %s.
actors.buffs.adrenaline.name=адреналин
actors.buffs.adrenalinesurge.desc=Всплеск огромной мощи, но, к сожалению, ненадолго. \n\nУвеличение силы: +%d.\nКоличество ходов до ослабления усиления: %s.
actors.buffs.adrenalinesurge.name=повышение силы
actors.buffs.amok.desc=Амок вызывает у цели состояние сильной ярости и замешательства. Когда существо находится под воздействием амока, оно атакует всё, что находится рядом, будь то друг или враг. \n\n Количество ходов амока: %s.
actors.buffs.amok.name=амок
actors.buffs.arcanearmor.desc=Вас окружает тонкий щит, блокирующий часть урона от магических атак. Ваша магическая броня в данный момент усилена на: 0-%d.\n\n Количество ходов до ослабления магической брони: %s.
actors.buffs.arcanearmor.name=мистическая броня
actors.buffs.artifactrecharge.desc=Энергия циркулирует через вас, увеличивая скорость зарядки ваших экипированных артефактов. \n\nКаждый артефакт реагирует немного по-разному, но все они будут заряжаться гораздо быстрее, чем обычно. \n\nОсталось ходов: %s.
actors.buffs.artifactrecharge.name=перезарядка артефакта
actors.buffs.ascensionchallenge.almost=Вы чувствуете, как хватка Йога на амулете начинает ослабевать, вы почти у цели!
actors.buffs.ascensionchallenge.beckon=Амулет начинает призывать врагов издалека.
actors.buffs.ascensionchallenge.break=Вы делаете паузу, чтобы перевести дыхание, и чувствуете, как начинают заживать раны!
actors.buffs.ascensionchallenge.damage=Амулет начинает излучать темную энергию. Он горит!
actors.buffs.ascensionchallenge.desc=Каким-то образом Йог-Дзева сохраняет своё влияние в этом мире через амулет и пытается остановить ваше восхождение! Сила Йога делает подземелье намного опаснее, увеличивая количество врагов и делая их сильнее! Эта сила будет продолжать расти, если её не контролировать; её можно ослабить, побеждая врагов, усиленных силой Йога.
actors.buffs.ascensionchallenge.desc_beckon=В данный момент амулет _призывает врагов на расстоянии_, предупреждая их о вашем местоположении.
actors.buffs.ascensionchallenge.desc_clear=В настоящее время темная энергия, исходящая от амулета, максимально ослаблена.
actors.buffs.ascensionchallenge.desc_damage=Энергия амулета стала настолько сильной, что _наносит вам прямой вред!_
actors.buffs.ascensionchallenge.desc_haste=В данный момент амулет ускоряет приближение врагов на расстоянии, позволяя им быстрее добраться до вас!
actors.buffs.ascensionchallenge.desc_slow=В данный момент амулет замедляет вас и нейтрализует эффекты ускорения!
actors.buffs.ascensionchallenge.haste=Амулет ускоряет приближение врагов на расстоянии!
actors.buffs.ascensionchallenge.name=проклятие амулета
actors.buffs.ascensionchallenge.on_kill=Тёмная энергия поглощает тебя...
actors.buffs.ascensionchallenge.slow=Амулет начинает ощущаться как свинцовая гиря в вашем инвентаре!
actors.buffs.ascensionchallenge.weaken=Вы можете почувствовать, как проклятие амулета немного ослабевает.
actors.buffs.ascensionchallenge.weaken_info=Проклятие амулета можно ослабить, победив больше врагов.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Если вы победите врагов, проклятие амулета ослабнет!
actors.buffs.barkskin.desc=Ваша кожа затвердела, она шероховатая и плотная, как кора. Затвердевшая кожа увеличивает вашу эффективную броню, позволяя лучше защищаться от физических атак. Ваша броня в данный момент увеличена на: 0-%d. Количество ходов, до которых кора ослабевает: %s. Если вы получаете кору из нескольких источников, будет действовать только самый сильный из них.
actors.buffs.barkskin.name=кора
actors.buffs.barrier.desc=Прочный силовой пузырь, блокирующий все повреждения. \n\n Барьер будет получать урон от того, что он защищает, пока остается защитное поле. Защитное поле также будет медленно разрушаться со временем. \n\nОставшееся защитное поле: %d.
actors.buffs.barrier.name=барьер
actors.buffs.berserk.action_name=Берсерк
actors.buffs.berserk.angered=разгневан
actors.buffs.berserk.angered_desc=Тяжесть ранений берсерка усиливает его удары. По мере получения физического урона ярость берсерка будет накапливаться, давая ему бонусный урон. Урон, блокируемый броней, всё ещё учитывается при накоплении ярости. Ярость будет угасать со временем. Чем меньше здоровья берсерка, тем дольше она будет длиться. При 100% ярости берсерк может впасть в ярость, получая щит, зависящий от уровня его брони и недостающего здоровья. Во время берсерка его щит со временем ослабевает, и как только он закончится, ему придётся отдохнуть, прежде чем снова набрать ярость. \n\nТекущий уровень ярости: _%1$.0f%%_\n_+%2$.0f%%_ урон\n\nЩит берсерка при текущем уровне брони и здоровья: _%3$d_
actors.buffs.berserk.berserk=берсеркинг
actors.buffs.berserk.berserk_desc=Страх и неуверенность исчезают, оставляя лишь гнев. В этом состоянии Берсерк чрезвычайно силен, нанося +50%% урона и получая бонус к защите, но также теряя защиту каждый ход.\n\nКогда вся его защита снизится до 0, берсерк закончится.\n\nПосле ярости Берсерку потребуется время на восстановление, прежде чем он сможет снова накопить ярость.\n\nОставшийся щит: %d
actors.buffs.berserk.exhausted=измученный
actors.buffs.berserk.no_seal=Чтобы сойти с ума, вам нужна поврежденная печать!
actors.buffs.berserk.rankings_desc=Обезумевший до смерти
actors.buffs.berserk.recovering=выздоровление
actors.buffs.berserk.recovering_desc=Внутренняя сила имеет свои пределы. Берсерк должен отдохнуть, прежде чем снова использовать свою ярость. Во время восстановления берсерк не накапливает ярость от полученных повреждений.
actors.buffs.berserk.recovering_desc_levels=Уровни до восстановления: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Поворачивается до восстановления: _%d_
actors.buffs.bleeding.desc=Из этой раны течет тревожно большое количество крови. \n\nКровотечение наносит урон каждый ход. Каждый ход урон уменьшается на случайную величину, пока кровотечение в конце концов не прекратится. \n\nТекущий урон от кровотечения: %d.
actors.buffs.bleeding.heromsg=У вас кровотечение!
actors.buffs.bleeding.name=кровотечение
actors.buffs.bleeding.ondeath=Ты умер от кровопотери...
actors.buffs.bleeding.rankings_desc=Скончался от кровопотери
actors.buffs.bless.desc=Мощный всплеск концентрации, некоторые говорят, что он вдохновлен богами. \n\nБлагословение увеличивает точность и уклонение на 25%%, что делает благословенного гораздо более эффективным в бою. \n\nОсталось ходов благословения: %s.
actors.buffs.bless.name=благословенный
actors.buffs.blindness.desc=Ослепление превращает окружающий мир в темную дымку. В состоянии ослепления дальность обзора персонажа сокращается до одной клетки, что делает атаки дальнего боя бесполезными и значительно упрощает потерю из виду врагов на расстоянии. Кроме того, ослепленный герой не может читать свитки или книги. Осталось ходов ослепления: %s.
actors.buffs.blindness.heromsg=Вы ослепли!
actors.buffs.blindness.name=ослепший
actors.buffs.blobimmunity.desc=Какая-то странная сила окутывает вас тонким защитным барьером, блокирующим все вредные воздействия, передающиеся по воздуху. \n\nВы невосприимчивы ко всем воздействиям, действующим на определенную область, пока действует этот барьер. \n\nОсталось ходов невосприимчивости: %s.
actors.buffs.blobimmunity.name=барьер очистки
actors.buffs.burning.burnsup=%s сгорает!
actors.buffs.burning.desc=Мало что может быть более мучительным, чем быть объятым пламенем. Огонь будет наносить урон каждый ход, пока его не потушат водой или пока он не погаснет. Огонь можно потушить, ступив в воду или брызгами зелья разрушения. Кроме того, огонь может воспламенить легковоспламеняющуюся местность или предметы, с которыми он соприкоснется. Осталось ходов горения: %s.
actors.buffs.burning.heromsg=Ты загоришься!
actors.buffs.burning.name=горение
actors.buffs.burning.ondeath=Ты сгорел заживо...
actors.buffs.burning.rankings_desc=Сгорел дотла
actors.buffs.championenemy$antimagic.desc=Чемпионы, обладающие антимагическими способностями, получают на 50% меньше урона и полностью невосприимчивы к магическим воздействиям.
actors.buffs.championenemy$antimagic.name=чемпион антимагии
actors.buffs.championenemy$blazing.desc=Пылающие чемпионы наносят на 25% больше урона в ближнем бою, поджигают врагов, которых атакуют, невосприимчивы к огню и распространяют огонь вокруг себя при смерти. Однако они не могут распространять огонь на воду.
actors.buffs.championenemy$blazing.name=пылающий чемпион
actors.buffs.championenemy$blessed.desc=У благословенных чемпионов точность и уклонение в 4 раза выше.
actors.buffs.championenemy$blessed.name=благословенный чемпион
actors.buffs.championenemy$giant.desc=Чемпионы-гиганты получают на 80% меньше урона и имеют на 1 единицу дальность атаки, но не могут перемещаться в замкнутых пространствах.
actors.buffs.championenemy$giant.name=гигантский чемпион
actors.buffs.championenemy$growing.desc=По мере развития чемпионы получают постоянно возрастающий бонус к точности, уклонению, физическому урону и снижение получаемого урона. \n\nТекущий бонус к точности/уклонению/урону: %1$d%%\nТекущий бонус к снижению урона: %2$d%%
actors.buffs.championenemy$growing.name=растущий чемпион
actors.buffs.championenemy$projecting.desc=Чемпионы, использующие проекцию, наносят на 25% больше урона в ближнем бою и имеют на 3 единицы дальность атаки больше.
actors.buffs.championenemy$projecting.name=прогнозирующий чемпион
actors.buffs.championenemy.warn=Вы чувствуете смертоносное присутствие.
actors.buffs.charm.cant_attack=Вы очарованы этим врагом и не можете напасть на него.
actors.buffs.charm.desc=Очарование — это манипулятивная магия, которая может заставить врагов временно обожать друг друга. Персонажи, находящиеся под воздействием очарования, не могут напрямую атаковать врага, которым они очарованы. Однако атаковать другие цели по-прежнему возможно. Болевой шок сократит продолжительность действия очарования. Осталось ходов очарования: %s.
actors.buffs.charm.heromsg=Вы очарованы!
actors.buffs.charm.name=Зачарованные
actors.buffs.chill.desc=Не совсем замерзли, но все еще слишком холодно. \n\nЗамороженные цели выполняют все действия медленнее, в зависимости от того, сколько ходов осталось до окончания действия эффекта. В худшем случае это эквивалентно замедлению. \n\nОсталось ходов охлаждения: %1$s.\nСкорость снижается на: %2$s%%
actors.buffs.chill.freezes=%s зависает!
actors.buffs.chill.name=охлажденный
actors.buffs.combo$combomove.clobber.desc=Отбрасывает врага на 2 клетки назад, но не наносит урона и не может сбросить его в ямы. Увеличивает комбо на 1.
actors.buffs.combo$combomove.clobber.empower_desc=Отбрасывает врага на 3 клетки назад, вызывает головокружение и может сбросить в ямы, но не наносит урона. Увеличивает комбо на 1.
actors.buffs.combo$combomove.clobber.name=клобер
actors.buffs.combo$combomove.crush.desc=Наносит %d%% (комбо*25%%) урона основной цели и половину этого урона всем остальным врагам в области 7x7. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.crush.empower_desc=_Подпрыгивает на расстояние до %1$d клеток_ и наносит %2$d%% (комбо*25%%) урона основной цели, а также половину этого урона всем остальным врагам в области 7x7. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.crush.name=раздавить
actors.buffs.combo$combomove.fury.desc=Наносит врагу один удар за каждую вашу комбинацию, каждый удар наносит 60% урона и может активировать зачарования. При использовании сбрасывает комбинацию.
actors.buffs.combo$combomove.fury.empower_desc=_Подпрыгивает на расстояние до %d клеток_ и наносит один удар врагу за каждую имеющуюся у вас комбинацию ударов. Каждый удар наносит 60%% урона и может активировать зачарования. При использовании сбрасывает комбинацию ударов.
actors.buffs.combo$combomove.fury.name=ярость
actors.buffs.combo$combomove.parry.desc=При активации блокирует следующую атаку в течение 1 хода и мгновенно отвечает на неё. Сбрасывает комбо, если ничего не парируется.
actors.buffs.combo$combomove.parry.empower_desc=При активации блокирует _все атаки_ в течение 1 хода и мгновенно наносит ответный удар. Сбрасывает комбо, если ничего не парируется.
actors.buffs.combo$combomove.parry.name=парировать
actors.buffs.combo$combomove.slam.desc=Наносит %d%% (комбо*20%%) вашего блокирующего урона в качестве бонусного урона. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.slam.empower_desc=_Перепрыгивает на расстояние до %1$d клеток_ и наносит %2$d%% (комбо*20%%) вашего блокирующего урона в качестве бонусного урона. Сбрасывает комбо при использовании.
actors.buffs.combo$combomove.slam.name=удар
actors.buffs.combo.action_name=комбинированная атака
actors.buffs.combo.bad_target=Вы должны нацелиться на врага в пределах досягаемости атаки.
actors.buffs.combo.combo=Комбо-удар %d!
actors.buffs.combo.desc=Гладиатор набирает обороты, нанося успешные удары. Каждая атака увеличивает счетчик комбо на единицу, но слишком большой перерыв между ударами обнуляет счетчик комбо. Пока у гладиатора есть комбо, любая защита от его сломанной печати не начнет исчезать. \n\n Накопление комбо открывает специальные комбо-атаки, которые невозможно промахнуться! Другая атака открывается при 2, 4, 6, 8 и 10 комбо. Некоторые приемы сбрасывают комбо, а некоторые нет, но каждый прием можно использовать только один раз за сеанс комбо. \n\nТекущее комбо: %1$d.\n\nКоличество ходов до потери комбо: %2$s.
actors.buffs.combo.name=комбо
actors.buffs.combo.prompt=Выберите цель для атаки.
actors.buffs.corrosion.desc=Мощная кислота разъедает плоть, металл и кости с пугающей скоростью. \n\nКоррозионное повреждение усиливается со временем, поскольку объект продолжает разъедаться. \n\nОставшаяся коррозия: %1$s.\nТекущий уровень коррозионного повреждения: %2$d.
actors.buffs.corrosion.heromsg=Ты таешь!
actors.buffs.corrosion.name=коррозия
actors.buffs.corrosion.ondeath=Ты растворяешься...
actors.buffs.corrosion.rankings_desc=Растворенный
actors.buffs.corruption.desc=Коррупция проникает в сущность существа, искажая его и заставляя жить вразрез с его прежней природой. Испорченные существа будут атаковать своих союзников и игнорировать своих бывших врагов. Коррупция также наносит вред и постепенно приводит к гибели своей цели. Коррупция необратима, её последствия заканчиваются только смертью.
actors.buffs.corruption.name=поврежденный
actors.buffs.cripple.desc=Вы почти уверены, что ноги не предназначены для такого сгибания. \n\nОграничение скорости передвижения уменьшает скорость вдвое, из-за чего перемещение клетки обычно занимает два хода вместо одного. \n\nОсталось ходов ограничения: %s.
actors.buffs.cripple.heromsg=Вы калека!
actors.buffs.cripple.name=искалеченный
actors.buffs.daze.desc=Звон в ушах и затуманенное зрение затрудняют ведение боя. В состоянии оглушения точность и уклонение снижаются на 50, что значительно затрудняет как нанесение ударов, так и уклонение от них. Осталось ходов оглушения: 1.
actors.buffs.daze.heromsg=Вы в шоке!
actors.buffs.daze.name=ошеломленный
actors.buffs.degrade.desc=Мощная темная магия истощает силу, которую свитки улучшения применили к вашему снаряжению! \n\nВ период износа улучшенное снаряжение будет рассматриваться как имеющее более низкий уровень, чем он есть на самом деле. _Каждое улучшение после +3 становится экспоненциально слабее предыдущего._ Описания ваших предметов изменятся, отражая их пониженный уровень силы. \n\nИзнос не влияет на требования к силе, заряды жезла, прочность метательного оружия или артефактов. \n\nОсталось ходов износа: %s. Использование свитка улучшения или снятия проклятия немедленно прекратит износ.
actors.buffs.degrade.heromsg=Ваше оборудование стало работать слабее!
actors.buffs.degrade.name=деградировавший
actors.buffs.doom.desc=Трудно продолжать, когда кажется, что вселенная хочет твоей смерти. \n\nОбреченные персонажи получат +67% урона от всех источников. \n\nГибель необратима, ее последствия заканчиваются только смертью.
actors.buffs.doom.name=обреченный
actors.buffs.dread.desc=Ужас настолько велик, что заставит свою цель покинуть подземелье! \n\nСущества, пораженные ужасом, будут убегать от своего противника с высокой скоростью и полностью исчезнут из подземелья, как только окажутся вне поля зрения. За победу над врагами таким образом начисляется половина опыта, и они не оставляют после себя никаких предметов. Шок от боли сократит продолжительность ужаса. \n\nОсталось ходов ужаса: %d.
actors.buffs.dread.name=страх
actors.buffs.drowsy.desc=Магическая сила затрудняет бодрствование, через несколько ходов цель погрузится в глубокий магический сон. \n\nГерой может противостоять сонливости, получая урон или имея полное здоровье. \n\nКоличество ходов до сна: %s.
actors.buffs.drowsy.name=сонливый
actors.buffs.earthimbue.desc=Вы наделены силой земли! \n\nВсе физические атаки сдвинут землю под противником, на короткое время парализуя его. \n\nОсталось ходов наделения силой земли: %s.
actors.buffs.earthimbue.name=пропитанный землей
actors.buffs.enhancedrings.desc=Недавно использованный артефакт Разбойника усиливает его кольца, давая им +1 уровень. \n\nОсталось ходов: %s.
actors.buffs.enhancedrings.name=улучшенные кольца
actors.buffs.fireimbue.desc=Вы наделены силой огня! \n\nВсе физические атаки будут иметь шанс поджечь врагов. Кроме того, вы полностью невосприимчивы к воздействию огня. \n\nОсталось ходов наделения огнем: %s.
actors.buffs.fireimbue.name=пропитанный огнем
actors.buffs.foresight.desc=Вы каким-то образом способны мысленно видеть расположение окружающей местности. \n\nНаходясь под действием предвидения, вы видите все клетки в широком радиусе, включая любые секретные ловушки или двери. \n\nОсталось ходов предвидения: %s.
actors.buffs.foresight.name=предвидение
actors.buffs.frost.desc=Не следует путать с полным замерзанием; это более мягкое замораживание просто обволакивает цель льдом. Замораживание действует аналогично параличу, делая невозможным для цели какие-либо действия. В отличие от паралича, замораживание немедленно прекращается, если цель получает урон, так как лед раскалывается. Осталось ходов замораживания: %s.
actors.buffs.frost.freezes=%s зависает!
actors.buffs.frost.name=замороженный
actors.buffs.frostimbue.desc=Вы наделены ледяной силой! \n\nВсе физические атаки будут постепенно накладывать эффект заморозки на врагов. Кроме того, вы полностью невосприимчивы к холоду. \n\nОсталось ходов заморозки: %s.
actors.buffs.frostimbue.name=пропитанный инеем
actors.buffs.fury.desc=Вы злитесь, врагам не понравится, когда вы злитесь. В вас пылает сильная ярость, увеличивая урон, наносимый физическими атаками, на 50. Эта ярость будет длиться до тех пор, пока уровень вашего здоровья не опустится ниже 50.
actors.buffs.fury.heromsg=Вы приходите в ярость!
actors.buffs.fury.name=яростный
actors.buffs.gravitychaostracker.desc_duration=Неясно, как долго продлится этот эффект, но он не может длиться вечно.
actors.buffs.gravitychaostracker.desc_intro=Каждые несколько ходов все персонажи на текущем этаже подземелья будут случайным образом перемещаться в нужном направлении.
actors.buffs.gravitychaostracker.desc_positive=Похоже, вы и ваши союзники неуязвимы.
actors.buffs.gravitychaostracker.name=гравитационный хаос
actors.buffs.greaterhaste.desc=Невероятный прирост скорости, на мгновение кажется, будто все вокруг замерло. \n\n Под действием повышенной скорости движения занимают совсем немного времени, но другие действия выполняются с обычной скоростью. Каждый шаг движения расходует ход повышенной скорости. \n\n Осталось ходов повышенной скорости: %d.
actors.buffs.greaterhaste.name=большая поспешность
actors.buffs.haste.desc=Энергия течет по вашим мышцам, позволяя вам бегать с невероятной скоростью! \n\n Под действием ускорения вы будете бегать с утроенной скоростью, но все остальные действия будете выполнять с обычной скоростью. \n\n Осталось ходов ускорения: %s.
actors.buffs.haste.name=спешка
actors.buffs.healing.desc=Волшебное средство вызывает заживление ран и срастание тканей. \n\nКаждый ход здоровье будет постепенно восстанавливаться, пока не закончится действие лечебного эффекта. Количество исцеления может уменьшаться со временем. \n\nСледующее исцеление: %d.\n\nОставшееся исцеление: %d.
actors.buffs.healing.name=выздоровление
actors.buffs.herodisguise.desc=Иллюзорная магия изменила вашу внешность! Эффект чисто косметический, но всё равно ощущается очень странно. \n\nОсталось ходов маскировки: %s.
actors.buffs.herodisguise.name=маскировка
actors.buffs.hex.desc=Темная магия, которая ослабляет концентрацию, слегка дезориентируя цель. \n\nНаложение проклятий снижает точность и уклонение на 20%%, делая цель менее эффективной в бою. \n\nОсталось ходов проклятия: %s.
actors.buffs.hex.heromsg=На вас наложено проклятие!
actors.buffs.hex.name=проклятый
actors.buffs.holdfast.desc=Воин удерживает свою позицию, увеличивая свою броню на %1$d-%2$d и замедляя скорость ослабления некоторых баффов на %3$d%%. Это будет продолжаться до тех пор, пока он не переместится.
actors.buffs.holdfast.name=стойко держаться
actors.buffs.hunger.cursedhorn=Проклятый рог забирает часть энергии пищи, когда вы её едите.
actors.buffs.hunger.desc=Голод постепенно нарастает по мере того, как вы проводите время в подземелье, в конце концов вы начнете голодать. Во время голодания вы будете медленно терять здоровье вместо того, чтобы восстанавливать его.\n\nРационирование важно! Если у вас достаточно здоровья, голодание — неплохая идея, если это означает, что позже будет больше еды. Эффективное рационирование может значительно продлить срок хранения еды!
actors.buffs.hunger.desc_intro_hungry=Вы чувствуете, как ваш желудок требует еды, но пока это не слишком настойчиво.
actors.buffs.hunger.desc_intro_starving=Ты так сильно проголодался, что аж больно.
actors.buffs.hunger.hungry=голодный
actors.buffs.hunger.ondeath=Ты умер от голода...
actors.buffs.hunger.onhungry=Вы голодны.
actors.buffs.hunger.onstarving=Вы умираете от голода!
actors.buffs.hunger.rankings_desc=Умер от голода
actors.buffs.hunger.starving=изголодавшийся
actors.buffs.invisibility.desc=Вы полностью сливаетесь с окружающей местностью, становясь невидимым. Пока вы невидимы, враги не могут атаковать вас или преследовать. Физические атаки и магические эффекты (такие как свитки и жезлы) немедленно отменяют невидимость. Осталось ходов невидимости: %s.
actors.buffs.invisibility.name=невидимый
actors.buffs.invulnerability.desc=Этот персонаж обладает огромной защитной силой, дарующей ему кратковременную неуязвимость! \n\n Осталось ходов: %s.
actors.buffs.invulnerability.name=неуязвимый
actors.buffs.levitation.desc=Магическая сила поднимает вас над землей, заставляя чувствовать себя невесомым. Левитирующие персонажи движутся бесшумно и игнорируют все эффекты, воздействующие на землю. Ловушки не сработают, вода не потушит огонь, растения не будут затоптаны, корни не будут повреждены, а ямы будут парить над ними. Будьте осторожны, так как все это может вступить в силу, как только закончится левитация! Осталось ходов левитации: %s.
actors.buffs.levitation.name=левитирующий
actors.buffs.lifelink.desc=Жизненная сила этого персонажа связана с другим персонажем поблизости. Любой полученный урон распределяется между ними. \n\n Каждый раз, когда этот персонаж получает урон, половина этого урона будет нанесена цели, связанной с жизненной связью. \n\n Осталось ходов жизненной связи: %s.
actors.buffs.lifelink.name=связь жизни
actors.buffs.lifelink.ondeath=Ущерб, причиненный здоровью, стал причиной вашей смерти...
actors.buffs.light.desc=Даже в самом темном подземелье постоянный свет рядом всегда успокаивает. Свет помогает держать тьму на расстоянии, позволяя видеть на разумном расстоянии, несмотря на окружающую обстановку. Осталось включений освещения: %s.
actors.buffs.light.name=освещенный
actors.buffs.lockedfloor.desc=Текущий этаж заблокирован, и вы не можете его покинуть! Пока этаж заблокирован, вы не будете испытывать чувство голода и не будете получать урон от голодания. Кроме того, если вы не будете работать над победой над боссом этого этажа, пассивные эффекты регенерации также прекратятся. Кроме того, если вас оживит неблагословленный анкх, пока этаж заблокирован, то он сбросится. Убейте босса этого этажа, чтобы снять блокировку.
actors.buffs.lockedfloor.name=этаж заперт
actors.buffs.lostinventory.desc=Ваш инвентарь потерян где-то в подземелье! Вы не сможете подобрать или использовать большинство предметов, пока не заберете его.
actors.buffs.lostinventory.name=потерянный товарный запас
actors.buffs.magicalsight.desc=Каким-то образом вы способны видеть разумом, а не глазами. Пока магическое зрение активно, вы сможете видеть сквозь всю местность в радиусе 12 клеток. \n\nОсталось ходов магического зрения: %s.
actors.buffs.magicalsight.name=волшебное зрелище
actors.buffs.magicalsleep.desc=Этот персонаж погрузился в глубокий магический сон, из которого он не проснётся естественным путём. Магический сон похож на обычный сон, за исключением того, что только нанесённый урон заставит цель проснуться. Для героя и его союзников магический сон обладает некоторыми восстанавливающими свойствами, позволяя им быстро исцеляться во время отдыха.
actors.buffs.magicalsleep.fallasleep=Вы погружаетесь в глубокий волшебный сон.
actors.buffs.magicalsleep.name=волшебный сон
actors.buffs.magicalsleep.toohealthy=Вы слишком здоровы и сопротивляетесь желанию поспать.
actors.buffs.magicalsleep.wakeup=Вы просыпаетесь, чувствуя себя отдохнувшим и здоровым.
actors.buffs.magicimmune.desc=Все магические эффекты потеряли над вами контроль, вы полностью невосприимчивы к ним. Пока вы невосприимчивы к магии, все вредные и полезные магические эффекты не будут на вас действовать, включая проклятия, зачарования, жезлы, свитки, кольца, артефакты и т. д. Способности героической брони достаточно сильны, чтобы действовать независимо от этого эффекта. Осталось ходов невосприимчивости к магии: %s.
actors.buffs.magicimmune.name=невосприимчив к магии
actors.buffs.mindvision.desc=Каким-то образом вы можете видеть всех существ на этом этаже своим разумом. Это странное чувство. Все персонажи на этом этаже видны вам, пока у вас есть способность видеть разумом. Видение существа разумом считается видимым или находящимся поблизости для целей многих магических эффектов. Осталось ходов способности видеть разумом: %s.
actors.buffs.mindvision.name=мысленное видение
actors.buffs.momentum.action_name=фриран
actors.buffs.momentum.momentum=наращиваем темп
actors.buffs.momentum.momentum_desc=Во время движения Фрираннер накапливает импульс, который он может потратить на начало свободного бега. Каждый заряд импульса дает два хода свободного бега, и Фрираннер может накопить до 10 зарядов. Импульс быстро теряется, когда Фрираннер останавливается. Текущий заряд импульса: %d.
actors.buffs.momentum.resting=выздоровление
actors.buffs.momentum.resting_desc=Во время движения Фрираннер набирает инерцию, которую он может использовать для начала свободного бега. Фрираннеру нужно время, чтобы восстановить выносливость, прежде чем снова набрать инерцию. Осталось ходов: \n\n.
actors.buffs.momentum.running=фрираннинг
actors.buffs.momentum.running_desc=Во время движения Фрираннер набирает инерцию, которую может использовать для начала свободного бега. Во время свободного бега Фрираннер движется с удвоенной скоростью и получает бонус к уклонению в зависимости от своего уровня. Осталось ходов: %d.
actors.buffs.monkenergy$monkability$dash.desc=Мгновенный рывок на расстояние до 4 клеток. Эта способность позволяет преодолевать препятствия, но не врагов или твердую местность.
actors.buffs.monkenergy$monkability$dash.empower_desc=Мгновенный рывок на расстояние до _8 клеток_. Эта способность позволяет преодолевать препятствия, но не врагов или твердую местность.
actors.buffs.monkenergy$monkability$dash.name=бросаться
actors.buffs.monkenergy$monkability$dash.prompt=Выберите местоположение
actors.buffs.monkenergy$monkability$dragonkick.desc=Сокрушительный удар ногой, наносящий %1$d-%2$d урона и игнорирующий броню. Удар отбрасывает цель и парализует её на каждую пройденную клетку.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Сокрушительный удар ногой, наносящий урон в _%1$d-%2$d_ и игнорирующий броню. Удар отбрасывает _всех соседних целей_ и парализует их на каждую пройденную клетку.
actors.buffs.monkenergy$monkability$dragonkick.name=удар дракона
actors.buffs.monkenergy$monkability$flurry.desc=Два мгновенных удара, наносящие урон в диапазоне %1$d-%2$d и игнорирующие броню. Это умение нельзя использовать повторно.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Два мгновенных удара, наносящие %1$d-%2$d урона, игнорируют броню и используют зачарование вашего оружия. Это умение нельзя использовать повторно.
actors.buffs.monkenergy$monkability$flurry.name=шквал ударов
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Монахиня сосредоточена на происходящем вокруг, предвидя следующую атаку. Благодаря сосредоточенности, она гарантированно отразит следующий входящий удар.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=сфокусированный
actors.buffs.monkenergy$monkability$focus.desc=Монахиня меняет тактику, сосредотачиваясь на следующем нападении.
actors.buffs.monkenergy$monkability$focus.empower_desc=Монах мгновенно сосредотачивается, что позволяет ей парировать следующую атаку.
actors.buffs.monkenergy$monkability$focus.name=фокус
actors.buffs.monkenergy$monkability$meditate.desc=Монах концентрирует энергию в своем теле на 5 ходов. Это снимает большинство негативных эффектов и дает ей 8 ходов на перезарядку жезла и артефакта.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Монах концентрирует энергию в своем теле на 5 ходов. Это снимает большинство негативных эффектов и дает ей 8 ходов на перезарядку жезла и артефакта. _Также она получает 80% сопротивления урону во время медитации и медленно восстанавливает 20% от недостающего здоровья._
actors.buffs.monkenergy$monkability$meditate.name=медитировать
actors.buffs.monkenergy.action=Способности монаха
actors.buffs.monkenergy.desc=Побеждая врагов, монахиня получает энергию, которую может использовать для различных способностей. Большинство врагов дают 1 единицу энергии после победы, и монахиня не теряет энергию со временем.
actors.buffs.monkenergy.desc_cooldown=Монах недавно использовал способность и должен подождать, прежде чем использовать другую. \n\nТекущее время восстановления: %d ходов.
actors.buffs.monkenergy.name=энергия
actors.buffs.ooze.desc=Эта липкая кислота прилипает к плоти, медленно размягчая её. \n\nСлизь будет наносить постоянный урон в течение длительного времени, но её можно немедленно смыть водой. \n\nКоличество оставшейся слизи: %s.
actors.buffs.ooze.heromsg=Едкая жидкость разъедает вашу кожу. Смойте её!
actors.buffs.ooze.name=едкая слизь
actors.buffs.ooze.ondeath=Ты растворяешься...
actors.buffs.ooze.rankings_desc=Растворенный
actors.buffs.paralysis.desc=Зачастую худшее, что можно сделать, — это ничего не делать. \n\nПаралич полностью останавливает все действия, заставляя цель ждать, пока эффект не пройдет. Боль от полученных повреждений может заставить персонажей сопротивляться параличу, освобождая их от его действия. \n\nОсталось ходов паралича: %s.
actors.buffs.paralysis.heromsg=Вы парализованы!
actors.buffs.paralysis.name=парализованный
actors.buffs.paralysis.out=сопротивлялся параличу
actors.buffs.physicalempower.desc=Ваши удары усилены, что увеличивает урон, который вы можете нанести врагам при попадании физическими атаками. \n\nБонусный урон: %1$d.\nОсталось ударов: %2$d.
actors.buffs.physicalempower.name=физически силен
actors.buffs.pincushion.desc=Метательное оружие, которое вы использовали против этого персонажа, в данный момент прикреплено к нему и упадет на пол после его поражения. \n\n Следующие предметы в данный момент прикреплены:
actors.buffs.pincushion.name=подушечка для булавок
actors.buffs.poison.desc=Яд постепенно распространяется по организму, медленно нарушая его внутренние функции. Яд наносит урон каждый ход пропорционально времени до его исчезновения. Осталось ходов яда: %s.
actors.buffs.poison.heromsg=Вы отравлены!
actors.buffs.poison.name=отравленный
actors.buffs.poison.ondeath=Вы умерли от отравления...
actors.buffs.poison.rankings_desc=Поддался отравлению
actors.buffs.preparation.action_name=подготовленная забастовка
actors.buffs.preparation.assassinated=убит
actors.buffs.preparation.desc=Ассасин терпеливо ждет, готовясь нанести удар из тени.
actors.buffs.preparation.desc_blink=Он способен телепортироваться к врагу, прежде чем нанести удар, на максимальное расстояние _%d._
actors.buffs.preparation.desc_dmg=Его следующая атака нанесет дополнительный урон в размере _%1$d%% и уничтожит обычных врагов, у которых осталось менее _%2$d%% здоровья_, или боссов, у которых осталось менее _%3$d%% здоровья_.
actors.buffs.preparation.desc_dmg_likely=Кроме того, такая атака с большей вероятностью нанесет более значительный ущерб.
actors.buffs.preparation.desc_invis_next=Повороты для более мощной атаки: _%d._
actors.buffs.preparation.desc_invis_time=Ходы, потраченные в невидимости: _%d._
actors.buffs.preparation.name=подготовка
actors.buffs.preparation.no_target=Там нечего атаковать.
actors.buffs.preparation.out_of_reach=Эта цель недостижима.
actors.buffs.preparation.prompt=Выберите цель для атаки! \nМаксимальная дальность телепортации: %d
actors.buffs.prismaticguard.desc=Вас охраняет призматическое изображение, которое в данный момент неактивно. При появлении врагов призматическое изображение активируется и защитит вас! \n\nВ неактивном состоянии призматическое изображение будет постепенно восстанавливаться после полученных повреждений. \n\nТекущий HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Это призматическое изображение также выигрывает от эффекта «Сила многих». Осталось ходов: %d.
actors.buffs.prismaticguard.name=призматическая стража
actors.buffs.recharging.desc=Энергия циркулирует в вас, ускоряя зарядку ваших волшебных палочек и посохов. Каждый ход этот бафф увеличивает текущий заряд на четверть, в дополнение к обычной перезарядке. Осталось ходов перезарядки: %s.
actors.buffs.recharging.name=подзарядка
actors.buffs.revealedarea.desc=Герою временно открылась часть подземелья. Он увидит её, где бы ни находился. \n\nОсталось ходов: %s.
actors.buffs.revealedarea.name=открытая область
actors.buffs.revealedchar.desc=Этот персонаж открывается герою. Он будет виден независимо от того, где он находится. \n\nОсталось ходов: %s.
actors.buffs.revealedchar.name=раскрытый
actors.buffs.roots.desc=Корни (магические или природные) цепляются за ноги, прижимая их к земле. Корни фиксируют цель на месте, делая движение и большинство способностей к перемещению невозможными. Другие действия не затрагиваются, включая эффекты телепортации. Осталось ходов корней: %s.
actors.buffs.roots.heromsg=Вы не можете двигаться!
actors.buffs.roots.name=укорененный
actors.buffs.scrollempower.desc=Энергия из недавно прочитанного магом свитка наполняет его волшебные палочки! \n\nУвеличение уровня: +%1$d.\nОсталось зарядов: %2$d.
actors.buffs.scrollempower.name=прокрутка расширить возможности
actors.buffs.shadows.desc=Вы сливаетесь с окружающими тенями, обретая невидимость и замедляя метаболизм. Пока вы невидимы, враги не могут атаковать вас или преследовать. Большинство физических атак и магических эффектов (таких как свитки и волшебные палочки) немедленно отменяют невидимость. Кроме того, во время пребывания в тени ваш аппетит замедляется. Вы останетесь в тени, пока не покинете тени или враг не вступит с вами в контакт.
actors.buffs.shadows.name=слился с тенью
actors.buffs.slow.desc=Замедляющая магия влияет на скорость восприятия времени целью, для неё всё движется сверхбыстро. \n\n Замедленный персонаж выполняет все действия за время, вдвое превышающее обычное. \n\n Осталось ходов замедления: %s.
actors.buffs.slow.name=замедленный
actors.buffs.snipersmark.action_name_snapshot=снимок
actors.buffs.snipersmark.action_name_sniper=снайперский выстрел
actors.buffs.snipersmark.action_name_volley=лёт
actors.buffs.snipersmark.desc=Снайпер нацелилась на цель, которую атаковала последней. Она может выполнить особую атаку из лука, которая будет варьироваться в зависимости от того, как улучшен лук. \n\nНеулучшенный лук выстрелит _мгновенным выстрелом_, который наносит уменьшенный урон, но не требует времени для выстрела. \n\nЛук, улучшенный для скорости, выстрелит _залпом_ из трех стрел. Каждая стрела нанесет уменьшенный урон, но все еще может активировать зачарование. Этот залп занимает 1 ход для выстрела. \n\nЛук, улучшенный для урона, выстрелит _снайперским выстрелом_. Этот выстрел гарантированно попадет, нанесет дополнительный урон в зависимости от расстояния до цели и занимает 2 хода для выстрела. \n\nОсталось ходов: %s.
actors.buffs.snipersmark.name=снайперская метка
actors.buffs.soulmark.desc=Чернокнижник подключился к душе этого существа, что позволяет ему исцелять его по мере получения физических повреждений. \n\nОсталось ходов метки души: %s.
actors.buffs.soulmark.name=душа отмечена
actors.buffs.stamina.desc=У вас бесконечная выносливость, позволяющая двигаться быстрее! \n\nВ период действия эффекта выносливости вы будете бегать со скоростью +50%%, но все остальные действия будете выполнять с обычной скоростью. \n\nОсталось ходов выносливости: %s.
actors.buffs.stamina.name=выносливость
actors.buffs.terror.desc=Ужас — это манипулятивная магия, которая повергает цель в неконтролируемую панику. Испуганные персонажи вынуждены убегать от противника, стараясь поставить между собой как можно больше дверей и стен. Однако шок от боли сократит продолжительность ужаса. Осталось ходов ужаса: 0.
actors.buffs.terror.name=испуганный
actors.buffs.toxicimbue.desc=Вы пропитаны ядовитой энергией! \n\n При перемещении из вас постоянно будет выходить ядовитый газ, наносящий урон вашим врагам. Вы невосприимчивы к ядовитому газу и яду на время действия эффекта, а также в течение нескольких ходов после его окончания. \n\n Осталось ходов действия токсичного воздействия: %s.
actors.buffs.toxicimbue.name=пропитанный токсичными веществами
actors.buffs.vertigo.desc=Ходить по прямой линии может быть сложно, когда весь мир вращается. Под воздействием головокружения персонажи, пытающиеся двигаться, будут двигаться в случайном направлении, а не в том, в котором они намеревались. Осталось поворотов головокружения: %s.
actors.buffs.vertigo.name=головокружение
actors.buffs.vulnerable.desc=Магия уязвимости увеличивает весь получаемый персонаж физический урон на 33%%, после того как этот урон был уменьшен броней.\n\nОсталось ходов уязвимости: %s.
actors.buffs.vulnerable.heromsg=Вы чувствуете себя уязвимой!
actors.buffs.vulnerable.name=уязвимый
actors.buffs.wandempower.desc=Ваши жезлы, наносящие урон, были усилены, что увеличило наносимый ими урон на несколько попаданий. \n\nБонусный урон: %1$d.\nОсталось попаданий: %2$d.
actors.buffs.wandempower.name=волшебные палочки наделены силой
actors.buffs.weakness.desc=Всё внезапно кажется намного тяжелее. \n\nОслабляющая магия уменьшает физическую силу персонажа, заставляя его наносить на 33%% меньше урона. \n\nОсталось ходов слабости: %s.
actors.buffs.weakness.heromsg=Вы чувствуете слабость!
actors.buffs.weakness.name=ослабленный
actors.buffs.wellfed.desc=Вы чувствуете себя вполне сытым и довольным. \n\n Пока вы сыты, ваш голод не усилится, и со временем вы восстановите дополнительное количество здоровья. \n\n Осталось ходов: %d.
actors.buffs.wellfed.name=хорошо накормлен
actors.char.def_verb=увернулся
actors.char.def_verb_blocked=заблокировано
actors.char.defeat=Вы победили %s.
actors.char.immune=иммунитет
actors.char.invulnerable=неуязвимый
actors.char.kill=%s убил тебя...
actors.hero.abilities.armorability.cost=Стоимость зарядки: _%d_
actors.hero.abilities.armorability.no_target=Там не на что нацеливаться!
actors.hero.abilities.armorability.prompt=Выберите местоположение для целевого воздействия.
actors.hero.abilities.armorability.self_target=Вы не можете нацелиться на себя!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Из тела жреца исходит лучистая энергия. Находясь в этой форме, жрец получает 2 единицы дальности атаки (за счет исходящей от него святой энергии) и 10 единиц щита каждый раз, когда тратит заряд святого тома. Он также может применять заклинания, которые открываются благодаря талантам вознесенной формы. Щит, предоставляемый вознесенной формой и ее заклинаниями, не будет исчезать обычным образом, но мгновенно пропадет после окончания вознесенной формы. Текущий щит: %1$d.\n Осталось ходов: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=вознесённая форма
actors.hero.abilities.cleric.ascendedform.desc=Жрец излучает святую энергию, принимая продолжительную сияющую форму на 10 ходов. Находясь в этой форме, Жрец может произносить новые заклинания, получает 2 единицы дальности атаки, 30 единиц защиты, а любые дополнительные заклинания, которые он произносит, будут давать 10 единиц защиты за каждый использованный заряд святого тома. Защита от вознесённой формы и её заклинаний не исчезает обычным образом, но немедленно пропадает после окончания действия вознесённой формы. Способность можно использовать повторно для обновления длительности действия вознесённой формы.
actors.hero.abilities.cleric.ascendedform.name=вознесённая форма
actors.hero.abilities.cleric.ascendedform.short_desc=Жрец принимает _вознесённую форму_, получая новые заклинания, дальность атаки и защиту.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Копия одного из спутников-авантюристов жреца, созданная из твердого света. Хотя она имеет форму другого героя, у нее нет ни одной из его уникальных способностей. Этот союзник будет существовать до тех пор, пока к нему применяется «Сила множества». \n\n Этого союзника можно направлять бесплатно, повторно используя способность брони «Сила множества».
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Ваш союзник переходит в атаку!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Ваш союзник перемещается на эту позицию.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Ваш союзник начинает следовать за вами.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Этот персонаж обладает определённой способностью, позволяющей ему использовать героическую броню.
actors.hero.abilities.cleric.powerofmany$lightally.name=светлый союзник
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Этот союзник усилен силой «Силы Множества», которая дает ему +25%% наносимого урона и -25%% получаемого урона. Он также будет делить дальность обзора с Жрецом и сможет извлекать выгоду из заклинаний «Силы Множества». «Сила Множества» будет сохраняться, когда союзники, такие как призматические образы, прячутся, но ее действие будет продолжаться, отсчитывая время. Осталось ходов: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=сила многих
actors.hero.abilities.cleric.powerofmany.ally_exists=У вас уже есть сильный и влиятельный союзник.
actors.hero.abilities.cleric.powerofmany.desc=Жрец направляет _Силу Множества_, которая либо усиливает существующего союзника, либо создает нового усиленного союзника на 100 ходов. Нацеливание на пустое место создает нового союзника. Пока союзник усилен Силой Множества, он наносит на 25% больше урона, получает на 25% меньше урона и делится своим видением с Жрецом. Он также получает 25 единиц щита при использовании способности. Жрец также получает три новых заклинания, которые можно использовать только с усиленным союзником. Сила Множества не прекратит свое действие, пока одно из этих заклинаний активно.
actors.hero.abilities.cleric.powerofmany.name=сила многих
actors.hero.abilities.cleric.powerofmany.no_vision=Невозможно нацелиться на место, которое не видно.
actors.hero.abilities.cleric.powerofmany.only_allies=Вы можете усилить только союзников.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Направьте своего светлого союзника
actors.hero.abilities.cleric.powerofmany.prompt_default=Выберите союзника или местоположение
actors.hero.abilities.cleric.powerofmany.short_desc=Жрец направляет _Силу Множества_, усиливая существующего союзника или создавая нового.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Присвоить форме тела
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Присвоить ментальной форме
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Присвоить в духовной форме
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Выберите эффект, который будет добавлен в Trinity. Дополнительная информация будет отображена перед подтверждением.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Форма тела: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Форма разума: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Духовная форма: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Выберите, какую форму Троицы использовать. Эффекты разных форм могут быть активны одновременно.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Тринити применит эффект дистанционной алхимии этого артефакта ценой заряда _%2$s._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Тринити будет применять пассивный эффект восстановления здоровья этого артефакта на уровне _+%1$d_ в течение 20 ходов, ценой _%2$s заряда._
actors.hero.abilities.cleric.trinity.cost=Стоимость этой способности варьируется, но чаще всего составляет _%d._
actors.hero.abilities.cleric.trinity.desc=Жрец получает Троицу способностей брони, которые можно назначить различным эффектам предметов с помощью трех новых заклинаний. Каждое из этих заклинаний направлено на имитацию эффектов различных видов снаряжения, которые Жрец определил во время этого прохождения: телесная форма (оружие и броня), ментальная форма (волшебные палочки и метательное оружие) и духовная форма (кольца и артефакты). Каждая форма Троицы может быть наделена одним эффектом за раз, и Жрец выбирает, какой из них активировать при использовании Троицы. Троица не будет дублировать эффект того, что у вас уже экипировано.
actors.hero.abilities.cleric.trinity.driedrose_use=Тринити использует эффект этого артефакта, чтобы призвать дружественного призрака, пораженного порчей, с количеством HP, равным _+%1$d_ призраку, ценой _%2$s заряда._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity применит этот эффект в течение _%1$d ходов_ ценой заряда _%2$s_.
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity применит эффект цепного применения этого артефакта с дальностью действия _+%1$d_, ценой _%2$s заряда._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Тринити применит эффект «поедания» этого артефакта, затратив _%2$s заряда._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Тринити применит эффект отнятия врагов этого артефакта в точке _+%1$d_, ценой заряда _%2$s_.
actors.hero.abilities.cleric.trinity.name=триединство
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity не может дублировать эффект, который у вас уже есть!
actors.hero.abilities.cleric.trinity.no_imbue=В настоящее время ни одна из форм Тринити не имеет установленных эффектов, используйте одно из её заклинаний!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Тринити применит этот _мощный_ эффект в течение _%1$d ходов_ ценой _%2$s заряда._
actors.hero.abilities.cleric.trinity.ring_use=Тринити применит эффект этого кольца на _+%1$d_ в течение 20 ходов, ценой _%2$s заряда._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity применит эффект корня этого артефакта со случайным вредоносным начальным значением, ценой заряда _%2$s._
actors.hero.abilities.cleric.trinity.short_desc=Жрец получает _Троицу_ способностей, которые имитируют увиденное им снаряжение и могут быть назначены с помощью новых заклинаний.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity применит эффект вставки этого артефакта за счет заряда _%2$s._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity применит эффект прорицания этого артефакта в точке _+%1$d_, ценой заряда _%2$s_.
actors.hero.abilities.cleric.trinity.thrown_use=Тринити метнет это оружие в _+%1$d_ ценой заряда _%2$s._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity применит эффект заморозки времени этого артефакта с длительностью хода _%1$d_, ценой заряда _%2$s_.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity применит эффект случайного свитка этого артефакта с вероятностью _%1$d/10_, чтобы предложить экзотическую версию без дополнительной платы, но за плату в размере _%2$s._
actors.hero.abilities.cleric.trinity.wand_multi_use=Тринити поразит этот многозарядный жезл током с зарядом +%1$d, затратив на это заряд 1%2$s.
actors.hero.abilities.cleric.trinity.wand_use=Тринити поразит эту палочку током с силой _+%1$d_ ценой заряда _%2$s._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Этот персонаж участвует в дуэли. Ему, а также любым его союзникам или приспешникам, разрешено действовать как обычно, в то время как другие заморожены. Дуэль продлится определенное время, пока один из участников не погибнет или пока участники не отойдут друг от друга более чем на 5 клеток. Осталось ходов: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=дуэльный участник
actors.hero.abilities.duelist.challenge.ally_target=Вы можете бросать вызов только врагам.
actors.hero.abilities.duelist.challenge.already_dueling=Одновременно можно участвовать только в одной дуэли.
actors.hero.abilities.duelist.challenge.desc=Дуэлистка вызывает на дуэль ближайшего врага. Этот враг вынужден сражаться с ней, в то время как все остальные враги временно заморожены во времени. Цель должна быть достижима и находиться в пределах 5 клеток от Дуэлистки. Дуэль длится до тех пор, пока не пройдет 10 ходов, враг не погибнет или Дуэлистка не окажется на расстоянии более 5 клеток от врага. Замороженные враги неуязвимы. Союзники Дуэлистки не замораживаются этой способностью, но если целью является босс, его приспешники также не будут заморожены.
actors.hero.abilities.duelist.challenge.distant_target=Этот враг находится слишком далеко, чтобы ему противостоять.
actors.hero.abilities.duelist.challenge.name=испытание
actors.hero.abilities.duelist.challenge.prompt=Выберите врага, которому вы бросите вызов.
actors.hero.abilities.duelist.challenge.short_desc=Дуэлист вызывает на дуэль ближайшего противника, временно замораживая всех остальных врагов.
actors.hero.abilities.duelist.challenge.unreachable_target=Вы должны суметь достичь своей цели.
actors.hero.abilities.duelist.elementalstrike.desc=Дуэлист наносит удар по врагу или локации, совершая обычную атаку, гарантированно попадающую в цель, и распространяя магический эффект, охватывающий до 4 клеток в конусе под углом 65 градусов. Этот магический эффект варьируется в зависимости от зачарования основного оружия Дуэлиста.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Удар стихии без зачарования высвободит небольшой заряд магии, наносящий 6-12 урона всем врагам в радиусе действия.
actors.hero.abilities.duelist.elementalstrike.name=элементарный удар
actors.hero.abilities.duelist.elementalstrike.short_desc=Дуэлистка выполняет «Стихийный удар», распространяя эффект в конусообразной области, зависящей от зачарования её оружия.
actors.hero.abilities.duelist.feint.bad_location=Вы не можете переехать в это место.
actors.hero.abilities.duelist.feint.desc=Дуэлистка имитирует атаку, стремительно перемещаясь на соседнюю клетку, оставляя за собой кратковременное остаточное изображение. Враги, атаковавшие Дуэлистку, вместо этого атакуют её остаточное изображение. Враги, атакующие остаточное изображение, приходят в замешательство, что отменяет их следующее действие и делает их уязвимыми для внезапной атаки.
actors.hero.abilities.duelist.feint.name=финт
actors.hero.abilities.duelist.feint.prompt=Выберите место, куда нужно быстро добраться.
actors.hero.abilities.duelist.feint.short_desc=Дуэлистка имитирует атаку, стремительно перемещаясь на соседнюю клетку. Враги атакуют её остаточное изображение, что делает их уязвимыми для контратаки.
actors.hero.abilities.duelist.feint.too_far=Это место находится не рядом с вами.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Охотница на короткое время получает усиление, увеличивающее скорость передвижения и скорость атаки из лука. \n\nОсталось ходов: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=сила природы
actors.hero.abilities.huntress.naturespower.desc=Охотница временно наделяет себя и свой лук силой природы! Это длится 8 ходов. В течение этого времени Охотница движется в 2 раза быстрее и атакует из лука на 33% быстрее. Бонусные эффекты лука не срабатывают, если Снайпер использует свои особые атаки.
actors.hero.abilities.huntress.naturespower.name=сила природы
actors.hero.abilities.huntress.naturespower.short_desc=Охотница призывает Силу Природы, что на короткое время увеличивает её скорость передвижения и скорострельность лука.
actors.hero.abilities.huntress.spectralblades.desc=Охотница метает в противника призрачный клинок, который действует как удар из её оружия ближнего боя. При этом активируются все обычные эффекты оружия ближнего боя, включая зачарования.
actors.hero.abilities.huntress.spectralblades.name=спектральные лопасти
actors.hero.abilities.huntress.spectralblades.short_desc=Охотница метает в цель Призрачные клинки, нанося урон в зависимости от используемого ею в данный момент оружия ближнего боя.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Волшебный ястреб, призванный Охотницей. Он светится ярким эфирным синим светом, его голова постоянно поворачивается, пока он осматривает окрестности. Хотя он и не очень хорош в бою, его скорость и зрение делают его отличным средством для разведки и отвлечения врагов.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Осталось гарантированных уклонений: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Осталось оборотов: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Ваш ястреб готовится к атаке!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Ваш ястреб перемещается на эту позицию.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Ваш ястреб начинает следовать за вами.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Этот персонаж обладает определённой способностью, позволяющей ему использовать героическую броню.
actors.hero.abilities.huntress.spirithawk$hawkally.name=дух ястреба
actors.hero.abilities.huntress.spirithawk.desc=Охотница призывает духа-ястреба-фамильяра, которым можно управлять, используя способность повторно во время его призыва. Ястреб существует 100 ходов, управление им не требует затрат энергии. Ястреб обладает минимальным запасом здоровья и атакующей силой, но быстр, уклоняется и точен. Он постоянно делит с Охотницей все свое поле зрения. Он невосприимчив ко всем эффектам, действующим на область, таким как огонь и ядовитый газ. Он не будет атаковать, если ему не будет дано специальное указание.
actors.hero.abilities.huntress.spirithawk.name=дух ястреба
actors.hero.abilities.huntress.spirithawk.no_space=В вашем районе нет свободных мест.
actors.hero.abilities.huntress.spirithawk.short_desc=Охотница призывает фамильяра — Духовного Ястреба, который может помочь ей разведывать местность и отвлекать врагов.
actors.hero.abilities.mage.elementalblast.desc=Маг испускает магический заряд, который покрывает круговую область на расстоянии до 4 клеток и наносит от 15 до 25 урона. Конкретный эффект элементального заряда зависит от волшебной палочки, в которую встроен посох мага.
actors.hero.abilities.mage.elementalblast.generic_desc=Эффект от элементарного взрыва будет аналогичен эффекту от использования волшебной палочки при воздействии на врага или союзника.
actors.hero.abilities.mage.elementalblast.name=элементарный взрыв
actors.hero.abilities.mage.elementalblast.no_staff=Вы не можете использовать эту способность без своего персонала.
actors.hero.abilities.mage.elementalblast.short_desc=Маг испускает из своего посоха _Элементарный Взрыв_, покрывая большую область вокруг себя эффектом, который варьируется в зависимости от типа жезла в его посохе.
actors.hero.abilities.mage.warpbeacon.depths=Между глубинами невозможно совершить телепортацию!
actors.hero.abilities.mage.warpbeacon.desc=Маг устанавливает маяк, к которому затем можно телепортироваться по своему желанию. Установка маяка занимает 1 ход, но телепортация к нему происходит мгновенно. Маг по умолчанию не может телепортироваться между этажами или использовать маяк для достижения недоступных мест, таких как запертые комнаты. Маг может телепортироваться к врагам, отталкивая их в сторону.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Там нельзя установить маяк!
actors.hero.abilities.mage.warpbeacon.locked_floor=Вы не можете покинуть запертый этаж!
actors.hero.abilities.mage.warpbeacon.name=варп-маяк
actors.hero.abilities.mage.warpbeacon.short_desc=Маг устанавливает телепортационный маяк в своем текущем местоположении, куда он может мгновенно телепортироваться обратно.
actors.hero.abilities.mage.warpbeacon.too_far=Это место слишком далеко!
actors.hero.abilities.mage.warpbeacon.window_cancel=отмена
actors.hero.abilities.mage.warpbeacon.window_clear=чистый маяк
actors.hero.abilities.mage.warpbeacon.window_desc=Ваш маяк в данный момент расположен на этаже %d.
actors.hero.abilities.mage.warpbeacon.window_tele=телепортироваться к маяку
actors.hero.abilities.mage.wildmagic.desc=Маг высвобождает силу своих волшебных палочек, случайным образом выпуская их до 4 раз за один ход. Посох Мага не подпадает под действие этого эффекта. Уровень каждой палочки также повышается на 2, до +3. Эта способность расходует половину заряда палочки за каждый разряд, и ни одна палочка не может выстрелить более 2 раз.
actors.hero.abilities.mage.wildmagic.name=дикая магия
actors.hero.abilities.mage.wildmagic.no_wands=У вас нет волшебных палочек, чтобы поражать цели!
actors.hero.abilities.mage.wildmagic.short_desc=Маг высвобождает заключенную в его жезлах _Дикую Магию_, случайным образом выпуская их несколько раз в выбранную цель в течение одного хода.
actors.hero.abilities.ratmogrify$transmograt.desc=Этот враг превратился в крысу. На мой взгляд, это большое улучшение! - Крысиный Король
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Убит: врагом, превращенным в крысу.
actors.hero.abilities.ratmogrify.cant_transform=Это нельзя превратить в крысиную мистификации!
actors.hero.abilities.ratmogrify.desc=Герой превращает врага в крысу на 6 ходов! Боссов, союзников и крыс нельзя превратить в крысу. Враги, превращенные в крыс, сохраняют свои первоначальные характеристики, но не обладают никакими способностями.
actors.hero.abilities.ratmogrify.name=крысомигрировать
actors.hero.abilities.ratmogrify.short_desc=Герой превращает врага в крысу! Это временно превращает его в крысу без каких-либо способностей.
actors.hero.abilities.ratmogrify.too_strong=Этот враг слишком силён, чтобы его превратить в крысу!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Этот враг помечен, в результате чего он получает 25%% дополнительного урона, а также становится неуязвимым для смерти, пока действие метки не прекратится.\n\nОсталось ходов: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=приговорен к смерти
actors.hero.abilities.rogue.deathmark.ally_target=Вы можете отмечать только врагов.
actors.hero.abilities.rogue.deathmark.desc=Разбойник накладывает метку на выбранного врага, заставляя его получать на 25% больше урона. Метка накладывается мгновенно и действует 5 ходов. Отмеченные враги получают дополнительный урон, но не могут умереть, пока метка не исчезнет. Если у врага 0 HP, когда метка перестанет действовать, он немедленно умрет.
actors.hero.abilities.rogue.deathmark.name=метка смерти
actors.hero.abilities.rogue.deathmark.short_desc=Разбойник накладывает на выбранного врага метку смерти. Помеченные враги получают дополнительный урон, но не могут умереть, пока метка не исчезнет.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Копия Разбойника, созданная из тьмы. Она стоит неподвижно, с пустыми глазами и крошечными клубами тьмы, поднимающимися, словно пар. Клон не является идеальной копией Разбойника, но всё же неплохой боец и может извлечь выгоду из снаряжения Разбойника, если правильно подобрать таланты.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Ваш клон готовится к атаке!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ваш клон перемещается на эту позицию.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Ваш клон начинает следовать за вами.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Этот персонаж обладает определённой способностью, позволяющей ему использовать героическую броню.
actors.hero.abilities.rogue.shadowclone$shadowally.name=теневой разбойник
actors.hero.abilities.rogue.shadowclone.desc=Разбойник призывает теневого двойника самого себя, которого можно направлять на помощь в бою. Направление теневого клона не требует затрат энергии. Клон имеет 80 HP, не имеет брони и наносит 10-20 урона. Все эти характеристики можно улучшить с помощью талантов, так что клон будет получать преимущества от оружия и брони, которыми обладает герой.
actors.hero.abilities.rogue.shadowclone.name=теневой клон
actors.hero.abilities.rogue.shadowclone.short_desc=Разбойник призывает теневого клона, которого можно направить на помощь в бою.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Каким-то образом врагов легко убедить, что эта деревянная приманка — настоящий Разбойник!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Этот персонаж обладает определённой способностью, позволяющей ему использовать героическую броню.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=деревянная приманка
actors.hero.abilities.rogue.smokebomb.desc=Разбойник бросает дымовую шашку и телепортируется на расстояние до 6 клеток. Он может телепортироваться сквозь препятствия и врагов, но не сквозь твердую местность, такую как стены. Враги, находящиеся рядом с прежней позицией Разбойника, будут ослеплены на 5 ходов.
actors.hero.abilities.rogue.smokebomb.fov=Вы можете переместиться только в пустое место в поле зрения.
actors.hero.abilities.rogue.smokebomb.name=дымовая шашка
actors.hero.abilities.rogue.smokebomb.prompt=Выберите место, куда нужно переместиться.
actors.hero.abilities.rogue.smokebomb.short_desc=Разбойник бросает дымовую шашку, телепортируясь в сторону. Он ослепляет врагов рядом со своим прежним местоположением.
actors.hero.abilities.warrior.endure$enduretracker.desc=Теперь Воин наносит дополнительный урон, зависящий от полученного им урона. \n\nДополнительный урон: %1$d\nОсталось ударов: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=выносливость
actors.hero.abilities.warrior.endure.desc=Воин выдерживает 3 хода, получая половину урона от всех источников. Это снижение урона применяется до применения эффектов сопротивления урону, таких как броня. После выдержки следующий удар воина в течение 10 ходов получает бонусный урон. Этот бонусный урон равен половине всего урона, нанесенного ему во время выдержки, до применения каких-либо эффектов снижения урона! Если у воина есть какая-либо комбинация, использование этой способности увеличивает оставшееся время на 3 хода.
actors.hero.abilities.warrior.endure.name=терпеть
actors.hero.abilities.warrior.endure.short_desc=Воин _Выдерживает_, пропуская несколько ходов, но получая высокое сопротивление урону. Затем он наносит дополнительный урон в зависимости от того, что он пережил.
actors.hero.abilities.warrior.heroicleap.desc=Воин совершает прыжок к намеченной точке, преодолевая любые препятствия или опасности на своем пути. Однако он не может перепрыгивать через стены или другую твердую поверхность.
actors.hero.abilities.warrior.heroicleap.name=героический прыжок
actors.hero.abilities.warrior.heroicleap.prompt=Выберите направление для прыжка
actors.hero.abilities.warrior.heroicleap.short_desc=Воин совершает «Героический прыжок» в направлении заданной точки, паря над врагами и опасностями.
actors.hero.abilities.warrior.shockwave.desc=Воин с силой ударяет по земле, создавая ударную волну, которая распространяется на расстояние до 5 клеток в конусе под углом 60 градусов. Враги, попавшие в эту ударную волну, получают эффект замедления на 5 ходов. Они также получают 5-10 урона, плюс дополнительно 1-2 урона за каждое очко силы Воина, превышающее 10.
actors.hero.abilities.warrior.shockwave.name=ударная волна
actors.hero.abilities.warrior.shockwave.short_desc=Воин, ударяя по земле, выпускает ударную волну в конусообразной области поражения. Враги, попавшие в ударную волну, получают урон и становятся недееспособными.
actors.hero.hero.key_distracted=У вас не получается открыть замок, придётся продолжать попытки.
actors.hero.hero.leave=Вы пока не можете уйти, остальная часть подземелья ждет вас внизу!
actors.hero.hero.level_cap=Вы не можете стать сильнее, но ваш опыт даёт вам прилив энергии!
actors.hero.hero.level_up=Повышайте свой уровень!
actors.hero.hero.locked_chest=Этот сундук заперт, и у вас нет соответствующего ключа.
actors.hero.hero.locked_door=У вас нет соответствующего ключа.
actors.hero.hero.name=ты
actors.hero.hero.new_level=Повышение уровня! +Точность, +Уклонение, +5 HP!
actors.hero.hero.new_talent=+1 очко таланта!
actors.hero.hero.noticed_smth=Вы кое-что заметили.
actors.hero.hero.pain_resist=Боль помогает вам сопротивляться желанию заснуть.
actors.hero.hero.revive=Анкх излучает животворящую энергию!
actors.hero.hero.search=поиск
actors.hero.hero.search_distracted=Трудно сосредоточиться, поиски изматывают.
actors.hero.hero.unspent=У вас остались неизрасходованные очки талантов!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Вы не можете носить с собой: %s.
actors.hero.hero.you_now_have=Вы подобрали: %s.
actors.hero.heroclass.cleric=священник
actors.hero.heroclass.cleric_desc=Жрец начинает игру с _уникальным священным фолиантом_, который он может использовать для произнесения различных заклинаний. Большинство талантов Жреца сосредоточены на изучении или улучшении заклинаний. Жрец также начинает игру с _дубинкой_, тканевой броней, бурдюком с водой и бархатным мешочком. Жрец автоматически определяет: Свитки определения 7 Зелья чистоты 8 Свитки снятия проклятия
actors.hero.heroclass.cleric_desc_short=Жрец — это божественный заклинатель, использующий свой уникальный _священный фолиант_ для направления божественной магии. Он может _изучать и улучшать заклинания_ с помощью талантов.
actors.hero.heroclass.cleric_unlock=Чтобы разблокировать Жреца, _полностью снимите проклятие с любого проклятого предмета экипировки._
actors.hero.heroclass.duelist=дуэлист
actors.hero.heroclass.duelist_desc=Дуэлист начинает игру с уникальной рапирой, обладающей особой способностью, которая перезаряжается со временем. Каждое оружие в игре имеет свою особую способность, которую может использовать дуэлист. Дуэлист также начинает игру с двумя метательными шипами, тканевой броней, флягой с водой и бархатным мешочком. Дуэлист автоматически определяет: Свитки определения ZXQPH6 ZXQ Свитки силы ZXQPH7 ZXQ Свитки зеркального отражения
actors.hero.heroclass.duelist_desc_short=Дуэлистка — мастер владения оружием, которая может использовать своё оружие для активации _особой способности_. Эта особая способность _различна для каждого вида оружия_.
actors.hero.heroclass.duelist_unlock=Чтобы разблокировать Дуэлиста, _экипируйте оружие 2-го уровня или выше без штрафа к силе._
actors.hero.heroclass.huntress=охотница
actors.hero.heroclass.huntress_desc=Охотница начинает игру с уникальным духовным луком, способным выпускать бесконечное количество созданных стрел. Охотница может передвигаться по высокой траве, не топча её. Охотница также начинает игру с перчатками с шипами, тканевой броней, флягой для воды и бархатным мешочком. Охотница автоматически распознает: Свитки распознавания, Зелья видения разума, Свитки колыбельной.
actors.hero.heroclass.huntress_desc_short=Охотница — мастер метательного оружия и владеет волшебным луком с бесконечным запасом стрел. Она также передвигается по высокой траве, не затоптав её.
actors.hero.heroclass.huntress_unlock=Чтобы разблокировать Охотницу, _нанесите врагам 10 ударов метательным оружием за одну игру._
actors.hero.heroclass.mage=маг
actors.hero.heroclass.mage_desc=Маг начинает игру с _уникальным посохом_, который перезаряжается значительно быстрее, чем волшебная палочка, и имеет на 1 заряд больше. Посох _можно зачаровать любой волшебной палочкой_, которую Маг найдет в подземелье. Маг также начинает игру с _волшебной палочкой магической стрелы_, зачарованной в его посохе, тканевой броней, флягой с водой и бархатным мешочком. Маг автоматически определяет: Свитки определения ...
actors.hero.heroclass.mage_desc_short=Маг — эксперт в области магии и носит _магический посох_, который сильнее волшебной палочки. Посох может быть _наполнен любой волшебной палочкой_, которую найдет Маг.
actors.hero.heroclass.mage_unlock=Чтобы разблокировать Мага, используйте свиток улучшения, чтобы сделать предмет сильнее.
actors.hero.heroclass.rogue=негодяй
actors.hero.heroclass.rogue_desc=Разбойник начинает игру с уникальным Плащом Теней, который позволяет ему становиться невидимым по желанию. Разбойник может обнаруживать секреты и ловушки с большего расстояния. Разбойник также начинает игру с кинжалом, тремя метательными ножами, тканевой броней, бурдюком с водой и бархатным мешочком. Разбойник автоматически определяет: Свитки Идентификации, Зелья Невидимости, Свитки Магического Карты.
actors.hero.heroclass.rogue_desc_short=Разбойник может уклоняться от врагов и наносить удары из невидимости, используя свой плащ теней. Он также обнаруживает секреты и ловушки с большего расстояния.
actors.hero.heroclass.rogue_unlock=Чтобы разблокировать Разбойника, совершите 10 внезапных атак за одну игру.
actors.hero.heroclass.warrior=воин
actors.hero.heroclass.warrior_desc=Воин начинает игру с уникальной сломанной печатью, которая даёт ему всплеск защиты, когда у него меньше половины здоровья. Печать можно перемещать между доспехами, и с её помощью можно передать одно улучшение. Воин также начинает игру с поношенным коротким мечом, тремя метательными камнями, тканевыми доспехами, флягой с водой и бархатным мешочком. Воин автоматически распознаёт: Свитки распознавания \n_-_ Зелья исцеления \n_-_ Свитки ярости
actors.hero.heroclass.warrior_desc_short=Воин получает дополнительный урон благодаря щиту, обеспечиваемому его _сломанной печатью_. Печать можно переносить между различными доспехами, и она _переносит одно улучшение_.
actors.hero.heroclass.warrior_unlock=Воин разблокируется автоматически.
actors.hero.herosubclass.assassin=убийца
actors.hero.herosubclass.assassin_desc=Ассасин готовится к следующему удару, когда становится невидимым. Чем дольше он готовится, тем мощнее будет его следующая атака. Подготовка длится до 9 ходов. После подготовки Ассасин наносит дополнительный урон своей следующей атакой, может телепортироваться к цели и даже мгновенно убивать достаточно слабых врагов.
actors.hero.herosubclass.assassin_short_desc=Ассасин может подготовить смертельный удар, оставаясь невидимым. Чем дольше он ждёт, тем мощнее будет атака.
actors.hero.herosubclass.battlemage=боевой маг
actors.hero.herosubclass.battlemage_desc=Боевой маг получает бонусный эффект при каждом ударе посохом в ближнем бою, как если бы его посох был дополнительно зачарован. Эти эффекты зависят от волшебной палочки, которой зачарован его посох; каждая палочка имеет свой собственный эффект. В дополнение к эффектам волшебной палочки, посох боевого мага также получает 0,5 заряда при ударе.
actors.hero.herosubclass.battlemage_short_desc=Боевой маг использует свои посохи в ближнем бою, чтобы активировать дополнительные эффекты. Эти эффекты зависят от того, какой волшебной палочкой зачарован его посох.
actors.hero.herosubclass.berserker=берсерк
actors.hero.herosubclass.berserker_desc=Берсерк набирает ярость по мере получения физического урона, включая урон, блокируемый его броней! Ярость постепенно угасает со временем, но угасает медленнее, если у него мало здоровья. Ярость может увеличить урон, наносимый берсерком, до +50%. При максимальном уровне ярости он может впасть в ярость, получив кратковременное усиление щита и сохраняя его до тех пор, пока у него остаётся щит. Щит зависит от уровня брони берсерка и может быть значительно усилен, если у него мало здоровья. Берсерку нужно время на восстановление после впадения в ярость.
actors.hero.herosubclass.berserker_short_desc=Берсерк накапливает ярость по мере получения урона. Ярость увеличивает его урон и может быть активирована при 100% для получения дополнительной защиты.
actors.hero.herosubclass.champion=чемпион
actors.hero.herosubclass.champion_desc=Чемпионка — мастер ближнего боя, которая может использовать дополнительное оружие в дополнение к основному. Её обычные атаки используют основное оружие, но она может мгновенно сменить основное оружие и использовать способности любого из них. Она также получает на 2 дополнительных заряда способностей оружия больше и +50% к скорости перезарядки способностей оружия.
actors.hero.herosubclass.champion_short_desc=Чемпионка может использовать два вида оружия и накапливает больше зарядов. В своих обычных атаках она использует основное оружие, но может менять оружие и применять способности любого из них.
actors.hero.herosubclass.freerunner=фрираннер
actors.hero.herosubclass.freerunner_desc=Во время движения Фрираннер накапливает очки импульса. Он может получить до 10 очков импульса после 10 ходов, но быстро теряет их, если останавливается. Фрираннер может использовать свой импульс, чтобы начать свободное перемещение, по 2 хода за каждое очко импульса. Во время свободного перемещения Фрираннер движется со скоростью в 2 раза выше обычной и получает бонус к уклонению пропорционально своему уровню. После завершения свободного перемещения начинается период восстановления, после которого импульс можно будет набрать снова.
actors.hero.herosubclass.freerunner_short_desc=Во время бега фрираннер набирает инерцию, которую можно использовать для начала фрирана. Это дает ему бонус к скорости и уклонению на короткое время.
actors.hero.herosubclass.gladiator=гладиатор
actors.hero.herosubclass.gladiator_desc=Гладиатор накапливает одно очко комбо каждый раз, когда совершает успешную атаку оружием ближнего боя или метательным оружием. Если Гладиатор не совершает успешную атаку в течение 5 ходов (15 ходов после убийства), его комбо сбрасывается. По мере накопления комбо Гладиатор может использовать различные способности, которые гарантированно попадают в цель: \n2 Комбо: отбрасывает врага назад, сохраняет комбо; \n4 Комбо: наносит урон в зависимости от брони; \n6 Комбо: парирует, сохраняет комбо; \n8 Комбо: наносит урон цели и ближайшим врагам; \n10 Комбо: атакует один раз за каждое комбо.
actors.hero.herosubclass.gladiator_short_desc=Гладиатор накапливает комбо при успешных атаках. Он может потратить комбо на использование уникальных способностей.
actors.hero.herosubclass.monk=монах
actors.hero.herosubclass.monk_desc=Монахиня — мастер физической техники. Побеждая врагов, она накапливает энергию, которую может использовать для различных защитных и вспомогательных способностей. Эта энергия не исчезает со временем, но имеет ограничение, зависящее от уровня Монахини. \n\n1 Энергия: быстрый удар кулаками. \n2 Энергия: сосредоточение для уклонения от следующей атаки. \n3 Энергия: мгновенный рывок к ближайшему противнику. \n4 Энергия: удар ногой по врагу. \n5 Энергия: медитация для снятия негативных эффектов и восстановления заряда жезла и артефакта.
actors.hero.herosubclass.monk_short_desc=Монах накапливает энергию во время боя. Эту энергию можно потратить на развитие различных уникальных способностей.
actors.hero.herosubclass.paladin=паладин
actors.hero.herosubclass.paladin_desc=Паладин получает множество новых и улучшенных заклинаний, которые делают упор на ближний бой и синергию с оружием и доспехами. Заклинания «Священное оружие» и «Священная защита» паладина дают большие бонусы, больше не перекрывают существующие зачарования и глифы и могут быть продлены путем применения других заклинаний. Паладин также получает заклинание «Кара», которое позволяет ему наносить гарантированный удар в ближнем бою с дополнительным уроном и силой зачарования.
actors.hero.herosubclass.paladin_short_desc=Паладин получает новые заклинания ближнего боя, а также усиленные версии священного оружия и защитного заклинания.
actors.hero.herosubclass.priest=священник
actors.hero.herosubclass.priest_desc=Жрец получает множество новых и улучшенных заклинаний, которые делают упор на дальний бой и синергию с магическими предметами. Жрец может бесплатно применять заклинание «Направляющий свет» один раз каждые 50 ходов, освещая врагов, непосредственно выбранных любым из его заклинаний, и может использовать дебафф освещения с союзниками, жезлами и некоторыми артефактами, получая бонусный урон, равный их уровню + 5. Жрец также получает заклинание «Сияние», которое рассеивает тьму и воздействует на всех видимых врагов, активируя и применяя эффект освещения и кратковременно оглушая их за 2 заряда.
actors.hero.herosubclass.priest_short_desc=Жрец получает новые заклинания дальнего действия и усиленную версию заклинания «Направляющий свет».
actors.hero.herosubclass.sniper=снайпер
actors.hero.herosubclass.sniper_desc=Снайпер — мастер дальнего боя, чьи атаки пробивают броню противника. При атаке врага метательным оружием она ставит на него снайперскую метку, что позволяет ей продолжить атаку специальным ударом из лука. Этот специальный удар зависит от уровня улучшения лука. Неулучшенный лук выпускает мгновенный выстрел, наносящий уменьшенный урон, но срабатывающий сразу. Лук, увеличивающий скорость, выпускает залп из трех стрел, наносящих уменьшенный урон, но способных активировать зачарования и требующих 1 ход для выстрела. Лук, увеличивающий урон, выпускает снайперский выстрел, гарантированно попадающий, наносящий бонусный урон в зависимости от расстояния и требующий 2 ходов для выстрела.
actors.hero.herosubclass.sniper_short_desc=Снайперша может пробивать броню своими атаками дальнего боя. После удара метательным оружием она может продолжить атаку специальным выстрелом из лука.
actors.hero.herosubclass.warden=надзиратель
actors.hero.herosubclass.warden_desc=Стражница обладает сильной связью с природой, что наделяет её множеством бонусных эффектов, связанных с травой и растениями. Она способна видеть сквозь высокую и бороздчатую траву, как сквозь пустое пространство. Стражница заставляет траву прорастать вокруг любого семени, которое она бросает или сажает, и получает особые эффекты при вытаптывании растений. Эти особые эффекты заменяют обычные эффекты растений, а это значит, что ни одно растение не представляет для неё опасности, если на него наступить.
actors.hero.herosubclass.warden_short_desc=Стражница может видеть сквозь высокую траву и получает бонусные эффекты, когда сажает семена и топчет растения.
actors.hero.herosubclass.warlock=чернокнижник
actors.hero.herosubclass.warlock_desc=У Колдуна есть шанс наложить метку души на персонажей, когда он использует на них жезлы. Шанс наложения метки души и её длительность увеличиваются с уровнем жезла. Когда на врага наложена метка души, Колдун восстанавливает 2 HP за каждые 5 единиц урона, нанесённого ему, но только при атаках ближнего боя или метательным оружием, а не жезлами!
actors.hero.herosubclass.warlock_short_desc=У Чернокнижника есть шанс пометить врагов меткой души с помощью своих жезлов. Он будет исцеляться всякий раз, когда наносит физический урон помеченным врагам.
actors.hero.spells.auraofprotection$aurabuff.desc=Паладин излучает вокруг себя защитную энергию. Любой находящийся поблизости союзник (включая самого Паладина) получает уменьшенный урон и получает эффект глифа брони Паладина с повышенной силой. Осталось ходов: %s.
actors.hero.spells.auraofprotection$aurabuff.name=аура защиты
actors.hero.spells.auraofprotection.desc=Паладин начинает излучать защитную энергию в виде сверкающей ауры вокруг себя в течение 20 ходов. Любой союзник в радиусе 2 клеток от Паладина (включая его самого) получает на %1$d%% меньше урона и получает эффект глифа брони Паладина с +%2$d%% силой.\n\n Это снижение урона происходит до других эффектов снижения урона (например, брони). Увеличение силы глифа будет применяться всегда, но это заклинание не может заставить глиф Паладина применяться более одного раза, если персонаж уже получает от него выгоду (например, сам Паладин или призматическое изображение).
actors.hero.spells.auraofprotection.name=аура защиты
actors.hero.spells.auraofprotection.short_desc=Повышает защиту паладина и находящихся рядом союзников.
actors.hero.spells.beamingray$beamingrayboost.desc=Этот союзник недавно был телепортирован с помощью Лучевого луча, что дало ему бонус к урону по ближайшему врагу после телепортации. Сила Множества также не исчезнет, пока этот бафф активен. \n\nОсталось ходов: %s.
actors.hero.spells.beamingray$beamingrayboost.name=луч
actors.hero.spells.beamingray.desc=Жрец направляет силу своего союзника в луч света, который переносит его в определенное место. Если луч сталкивается с врагом, он перемещает союзника поблизости и направляет его к врагу. Луч имеет максимальную дальность действия в 0 клеток и увеличивает бонусный урон от «Силы многих» до +10 ходов против ближайшего врага в радиусе 4 клеток. Луч может даже телепортировать обычно неподвижных союзников, но в этих случаях его дальность действия уменьшается вдвое.
actors.hero.spells.beamingray.name=луч
actors.hero.spells.beamingray.no_space=Там нет места для появления вашего союзника.
actors.hero.spells.beamingray.out_of_range=Это местоположение находится вне зоны действия.
actors.hero.spells.beamingray.short_desc=Телепортирует вашего союзника и наносит дополнительный урон.
actors.hero.spells.blessspell.desc=Жрец накладывает святое благословение на себя или на другого персонажа, которого он видит. При наложении на себя эффект слабее, давая %1$d ходов благословения и %2$d барьера. При наложении на других персонажей заклинание сильнее, давая %3$d ходов благословения и %4$d исцеления. Избыточное исцеление преобразуется в барьер.
actors.hero.spells.blessspell.name=благословить
actors.hero.spells.blessspell.short_desc=Благословляет и защищает священника, благословляет и исцеляет других.
actors.hero.spells.bodyform$bodyformbuff.desc=В текущей форме тела Тринити вы получаете силу зачарования или глифа, как если бы они были надеты на ваше текущее оружие или доспехи. Обратите внимание, что форма тела не может предоставить еще одну копию эффекта, от которого вы уже получаете выгоду. Текущий эффект: %1$s.\n\n Осталось ходов: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=форма тела
actors.hero.spells.bodyform.desc=Жрец выбирает заклинание или глиф, который он определил в этом забеге, и наделяет Тринити его эффектом. Когда используется Тринити, Жрец получает эффект выбранного заклинания или глифа на %d ходов. Это временное заклинание или глиф будет работать с любым эффектом, который обычно накладывает обычное заклинание или глиф. Это заклинание заменяет любой другой эффект тела, которым в данный момент наделена Тринити.
actors.hero.spells.bodyform.name=форма тела
actors.hero.spells.bodyform.short_desc=Присваивает Тринити зачарование или глиф.
actors.hero.spells.cleanse.desc=Жрец снимает все вредные негативные эффекты с себя и видимых союзников. После окончания действия заклинания все затронутые персонажи также получают %1$d ходов невосприимчивости к дебаффам и %2$d барьер.
actors.hero.spells.cleanse.name=очищение
actors.hero.spells.cleanse.short_desc=Снимает негативные эффекты и предоставляет защиту.
actors.hero.spells.clericspell.charge_cost=Стоимость зарядки: %d
actors.hero.spells.clericspell.invalid_enemy=Вы не можете нацелиться на этого врага.
actors.hero.spells.clericspell.invalid_target=Вы не можете нацелиться на это место.
actors.hero.spells.clericspell.no_target=Там нет цели.
actors.hero.spells.clericspell.prompt=Выберите цель
actors.hero.spells.divineintervention.desc=Жрец вкладывает огромное количество силы из своего тома в себя и союзников, усиливая защиту всех до %1$d и продлевая действие Вознесённой формы на %2$d ходов. Невероятная защитная мощь этого заклинания сопоставляется с очень высокой стоимостью его зарядки.\n\nКак и другие щиты, предоставляемые Вознесённой формой, этот щит не исчезает обычным образом, а немедленно прекращается по окончании действия Вознесённой формы.
actors.hero.spells.divineintervention.name=божественное вмешательство
actors.hero.spells.divineintervention.short_desc=Значительное усиление щитов для жреца и его союзников.
actors.hero.spells.divinesense$divinesensetracker.desc=Этот персонаж временно способен видеть других находящихся поблизости существ силой мысли! \n\n Осталось ходов: %s.
actors.hero.spells.divinesense$divinesensetracker.name=божественное чувство
actors.hero.spells.divinesense.desc=Жрец концентрирует свои чувства на окружающем мире, обретая мысленное видение с радиусом действия %d клеток на 50 ходов. Применение этого заклинания происходит мгновенно.
actors.hero.spells.divinesense.name=божественное чувство
actors.hero.spells.divinesense.short_desc=Временно обретает способность видеть в широком диапазоне.
actors.hero.spells.flash.desc=Жрец направляет свою вознесённую форму в ближайшее место и телепортируется туда. Заклинание «Вспышка» может телепортировать жреца в любое обнаруженное место, находящееся в пределах досягаемости и свободное от посторонних глаз. Для использования этого заклинания в той же вознесённой форме требуется больше зарядов тома.
actors.hero.spells.flash.name=вспышка
actors.hero.spells.flash.prompt=Выберите местоположение
actors.hero.spells.flash.short_desc=Телепортироваться в ближайшее место.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Жрец сможет снова бесплатно использовать заклинание «Путеводный свет» по истечении 50 ходов. \n\nОсталось ходов: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Путеводный свет
actors.hero.spells.guidinglight$illuminated.desc=Этот персонаж светится в результате попадания на него направляющего света. Хотя свечение недостаточно сильное, чтобы осветить окружающую местность, магический эффект значительно облегчит нанесение ударов жрецу.
actors.hero.spells.guidinglight$illuminated.desc_generic=Другие герои по-прежнему могут использовать «Освещение», чтобы получить выгоду от таланта «Пылающий свет», но не получат повышения точности.
actors.hero.spells.guidinglight$illuminated.desc_priest=Жрец также может использовать заклинание «Освещение сиянием», «Удар жезлом», «Удар союзника» или эффекты некоторых артефактов. Использование заклинания «Освещение» таким образом нанесет дополнительный магический урон, равный уровню Жреца + 5.
actors.hero.spells.guidinglight$illuminated.name=освещенный
actors.hero.spells.guidinglight.desc=Жрец выпускает сгусток магической энергии, который поражает цель, нанося 2-8 урона и освещая её. Следующая физическая атака без перегрузки, совершённая по освещённому врагу, гарантированно попадёт в цель.
actors.hero.spells.guidinglight.desc_priest=_Это заклинание становится мощнее, когда его применяет Жрец._ Первое применение заклинания каждые 50 ходов не требует зарядов тома, а эффект «Освещение» будет расходоваться сиянием, жезлами, другими персонажами и артефактами, которые непосредственно воздействуют на врагов. При таком использовании «Освещения» наносится дополнительный магический урон, равный уровню Жреца + 5.
actors.hero.spells.guidinglight.name=Путеводный свет
actors.hero.spells.guidinglight.short_desc=Наносит магический урон на расстоянии и гарантирует попадание.
actors.hero.spells.hallowedground$hallowedterrain.desc=Здесь освящена земля. Освященная земля замедляет врагов, лечит союзников и способствует распространению травы.
actors.hero.spells.hallowedground.desc=Жрец направляет свою божественную магию в ближайшую землю, создавая область освященной местности на 20 ходов. При применении это заклинание исцеляет всех союзников на 15 HP (здоровые союзники и Жрец получают щит), ненадолго обездвиживает врагов и разбрасывает короткую траву. Освященная местность исцеляет союзников на 1 HP за ход (здоровые союзники и Жрец получают щит), ослабляет врагов и случайным образом вызывает рост высокой травы. Освященная местность уничтожается огнем и будет производить бороздчатую траву, если пассивные эффекты регенерации отключены или Жрец некоторое время не получал опыт.
actors.hero.spells.hallowedground.name=священная земля
actors.hero.spells.hallowedground.prompt=Выберите местоположение
actors.hero.spells.hallowedground.short_desc=Лечит союзников, замедляет врагов и распространяет траву по области.
actors.hero.spells.holyintuition.cursed=Вы чувствуете, что в этом предмете таится зловещая магия.
actors.hero.spells.holyintuition.desc=Жрец концентрирует свои чувства на предмете и определяет, проклят он или нет, не надевая его на себя.
actors.hero.spells.holyintuition.name=священная интуиция
actors.hero.spells.holyintuition.prompt=выберите товар
actors.hero.spells.holyintuition.short_desc=Определяет, является ли предмет проклятым или нет.
actors.hero.spells.holyintuition.uncursed=Этот предмет не обладает злонамеренной магией.
actors.hero.spells.holylance$lancecooldown.desc=Жрец недавно применил заклинание «Святое копье» и должен подождать, прежде чем применить его снова. \n\nОсталось ходов: %s.
actors.hero.spells.holylance$lancecooldown.name=перезарядка священного копья
actors.hero.spells.holylance.desc=Жрец концентрирует огромное количество энергии в разрушительном метательном копье, сотканном из света. Это копье наносит %1$d-%2$d урона и всегда наносит максимальный урон нежити и демоническим целям.\n\nЭто заклинание очень дорогое и имеет время восстановления 30 ходов.
actors.hero.spells.holylance.name=святое копье
actors.hero.spells.holylance.short_desc=Наносит значительный магический урон на расстоянии.
actors.hero.spells.holyward$holyarmbuff.desc=Жрец наполнил свою изношенную броню святой энергией, временно отменяя любой существующий глиф и заставляя броню блокировать дополнительно 1 единицу урона. \n\nОсталось ходов: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Паладин наполнил свою изношенную броню святой энергией, благодаря чему броня блокирует дополнительные 3 единицы урона. \n\nИспользование других заклинаний во время действия «Священной защиты» продлит её действие на 10 ходов за каждый потраченный заряд. \n\nОсталось ходов: %s.
actors.hero.spells.holyward$holyarmbuff.name=святая палата
actors.hero.spells.holyward.desc=Жрец наделяет свою носимую броню глифами святого света, увеличивая блокировку урона броней на 1. Это заклинание применяется мгновенно. Этот глиф действует 50 ходов и перекрывает любые полезные глифы брони на это время. Жрец получит выгоду от этого эффекта, даже если у него нет брони.
actors.hero.spells.holyward.desc_paladin=_Это заклинание становится мощнее, когда его применяет паладин._ Дополнительное блокирование урона увеличено до 3, заклинание больше не переопределяет существующие глифы, а применение других заклинаний во время действия «Священной защиты» продлевает её действие на 10 ходов за каждый использованный заряд.
actors.hero.spells.holyward.glyph_desc=Этот глиф немного увеличивает количество урона, которое может заблокировать броня.
actors.hero.spells.holyward.glyph_name=%s света
actors.hero.spells.holyward.name=святая палата
actors.hero.spells.holyward.short_desc=Временно отменяет действие глифов для повышения блокирования урона броней.
actors.hero.spells.holyweapon$holywepbuff.desc=Жрец наделил своё изношенное оружие святой энергией, временно отменив любое существующее зачарование и заставив оружие наносить на 2 магических урона больше при каждой атаке. \n\nОсталось ходов: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Паладин наполнил своё изношенное оружие святой энергией, благодаря чему его атаки наносят дополнительно 6 магического урона. \n\nИспользование других заклинаний во время действия заклинания «Святое оружие» продлевает его действие на 10 ходов за каждый потраченный заряд. \n\nОсталось ходов: %s.
actors.hero.spells.holyweapon$holywepbuff.name=священное оружие
actors.hero.spells.holyweapon.desc=Жрец накладывает на своё ношеное оружие зачарование святой энергией, благодаря чему оружие наносит дополнительно 2 магических урона каждый раз, когда он наносит им удар по врагу. Это заклинание применяется мгновенно. Зачарование длится 50 ходов и перекрывает любые полезные зачарования оружия на это время. Безоружные удары также могут получить выгоду от этого эффекта.
actors.hero.spells.holyweapon.desc_paladin=_Это заклинание становится мощнее, когда его применяет паладин._ Дополнительный магический урон увеличен до 6, заклинание больше не перекрывает существующие чары, а применение других заклинаний во время действия «Священного оружия» продлевает его действие на 10 ходов за каждый использованный заряд.
actors.hero.spells.holyweapon.ench_desc=Враги, пораженные священным оружием, получат дополнительный магический урон.
actors.hero.spells.holyweapon.ench_name=святой %s
actors.hero.spells.holyweapon.name=священное оружие
actors.hero.spells.holyweapon.short_desc=Временно отменяет действие зачарований для увеличения урона.
actors.hero.spells.judgement.desc=Жрец с силой ударяет кулаком по земле, вызывая вспышку света, которая наносит урон всем видимым врагам. Базовый урон составляет %1$d-%2$d, а также дополнительно 33%% урона за каждое заклинание, произнесенное Жрецом с момента перехода в вознесенную форму (или с момента последнего применения «Суждения»). В настоящее время «Суждение» наносит %3$d-%4$d урона.
actors.hero.spells.judgement.name=суждение
actors.hero.spells.judgement.short_desc=Наносит урон всем видимым врагам.
actors.hero.spells.layonhands.desc=Паладин направляет святую энергию через свои руки, исцеляя или защищая всё, к чему прикасается. Паладин может наложить это заклинание на любого соседнего персонажа, чтобы дать ему исцеление, или на себя, чтобы получить щит. Избыточное исцеление от этого заклинания преобразуется в щит. Это заклинание накладывается мгновенно и может применяться многократно, но не может дать более трёх применений щита за раз.
actors.hero.spells.layonhands.name=возложить руки
actors.hero.spells.layonhands.short_desc=Мгновенно исцеляет находящегося рядом персонажа или защищает паладина.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Жрец недавно применил заклинание «Жизненная связь» к этому союзнику. В дополнение к обычным преимуществам «Жизненной связи», этот персонаж также получает уменьшенный урон, любые положительные заклинания Жреца применяются как к Жрецу, так и к этому союзнику, а не только к одному из них, и «Сила многих» не исчезнет, пока этот бафф активен. Осталось ходов: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=защита жизненной связи
actors.hero.spells.lifelinkspell.desc=Жрец укрепляет связь между собой и своим усиленным союзником. Благодаря этой усиленной связи любой полученный урон будет распределяться между героем и его союзником в течение %1$d ходов, а защитное усиление «Силы многих» будет увеличено до -%2$d%% получаемого урона. Обратите внимание, что урон распределяется после брони, но до снижения урона от «Силы многих». Пока этот эффект активен, полезные заклинания Жреца уровня Т3 или ниже будут применяться как к Жрецу, так и к его союзнику, если бы они применялись только к одному из них.
actors.hero.spells.lifelinkspell.name=связь жизни
actors.hero.spells.lifelinkspell.short_desc=Разделяет урон с союзником и уменьшает получаемый им урон.
actors.hero.spells.mindform.desc=Жрец выбирает волшебную палочку или метательное оружие, которое он определил в этом забеге, и наделяет «Тринити» его эффектом. Когда используется «Тринити», жрец может совершить одну атаку, как если бы он использовал выбранный предмет с бонусом +%d. Это активирует все эффекты, которые обычно активируются при использовании предмета такого типа. Это заклинание заменяет любой другой эффект разума, которым в данный момент наделена «Тринити».
actors.hero.spells.mindform.name=форма разума
actors.hero.spells.mindform.short_desc=Назначает Тринити волшебную палочку или метательное оружие.
actors.hero.spells.mnemonicprayer.desc=Жрец произносит молитву, которая продлевает действие всех положительных или отрицательных эффектов на конкретной цели на %1$d ходов. Применение этого заклинания происходит мгновенно. Положительные эффекты будут действовать дольше на союзников (включая самого Жреца), а вредные эффекты — дольше на врагов. Мнемоническая молитва может продлить действие конкретного положительного или отрицательного эффекта только один раз и не может продлить эффекты, полученные от способностей брони.
actors.hero.spells.mnemonicprayer.name=мнемоническая молитва
actors.hero.spells.mnemonicprayer.short_desc=Продлевает действие положительных/отрицательных эффектов на союзника/врага и повторно применяет эффект подсветки.
actors.hero.spells.radiance.desc=Жрец излучает святой свет, оглушая всех видимых врагов на 3 хода. Если враг уже освещен, «Сияние» активирует бонусный урон от «Освещения», а затем наложит дебафф «Освещение». «Сияние» также заставит Жреца светиться в течение 100 ходов, если текущий этаж темный.
actors.hero.spells.radiance.name=сияние
actors.hero.spells.radiance.short_desc=Подсвечивает и ненадолго оглушает видимых врагов.
actors.hero.spells.recallinscription$useditemtracker.desc=Жрец недавно использовал предмет, который работает с заклинанием «Возврат с помощью надписи». Жрец может использовать заклинание, чтобы повторить эффект предмета. \n\nИспользованный предмет: %1$s.\n\nОсталось ходов: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=недавно использованная руна
actors.hero.spells.recallinscription.desc=Жрец использует святую магию, чтобы повторно применить эффект магической руны, найденной на рунном камне или свитке, которые он использовал в последние %s ходов.\n\nНадпись «Возврат» нельзя использовать для копирования свитков улучшения. Стоимость заряда этого заклинания варьируется в зависимости от того, какой предмет был использован недавно: 2 для рунного камня, 3 для свитка, 4 для экзотического свитка. Эта стоимость заряда также удваивается при копировании свитка трансмутации или алхимических предметов, которые должны быть созданы с использованием трансмутации или улучшения.
actors.hero.spells.recallinscription.name=напоминание о надписи
actors.hero.spells.recallinscription.short_desc=Повторяет недавно использованный рунный камень или свиток.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Между этим персонажем и врагом стоит тонкий щит из света. Он недостаточно силен, чтобы полностью блокировать атаки, но смягчит их. \n\nОсталось ходов: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=щит света
actors.hero.spells.shieldoflight.desc=Жрец создает тонкий световой барьер между собой и врагом, увеличивая силу блокирования своей брони против этого врага на %1$d-%2$d на 5 ходов.\n\nЭто заклинание применяется мгновенно, но не может быть использовано против нескольких целей одновременно.
actors.hero.spells.shieldoflight.name=щит света
actors.hero.spells.shieldoflight.short_desc=Предоставляет временную броню против цели.
actors.hero.spells.smite.desc=Паладин наполняет удар ближнего боя праведной разрушительной силой. В дополнение к нанесению обычного урона в ближнем бою, «Кара» гарантирует попадание атак без перегрузки, имеет +300 к силе зачарования и наносит %1$d - %2$d бонусного магического урона.\n\n Бонусный магический урон от «Кары» зависит от уровня паладина и всегда будет наносить максимальный бонусный магический урон против нежити или демонических врагов.
actors.hero.spells.smite.name=карать
actors.hero.spells.smite.short_desc=Гарантирует попадание с дополнительным уроном и силой зачарования.
actors.hero.spells.spiritform$spiritformbuff.desc=Духовная форма Тринити в данный момент дарует вам силу предмета, как если бы он был экипирован. \n\nОбратите внимание, что духовная форма не может предоставить еще одну копию эффекта, от которого вы уже получаете выгоду. \n\nТекущий эффект: %1$s.\n\nОсталось ходов: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=духовная форма
actors.hero.spells.spiritform.desc=Жрец выбирает кольцо или артефакт, который он определил в этом забеге (кроме священного тома), и наделяет Тринити его эффектом. Если выбрано кольцо, Тринити наделяет Тринити эффектом этого кольца с бонусом +%1$d на 20 ходов. Если выбран артефакт, Тринити воспроизводит эффект этого артефакта с бонусом +%2$d. Каждый артефакт имеет различное поведение и стоимость заряда брони при использовании с Тринити. Это заклинание заменяет любой другой эффект духа, которым в данный момент наделена Тринити.
actors.hero.spells.spiritform.name=духовная форма
actors.hero.spells.spiritform.short_desc=Присваивает Троицу кольцу или артефакту.
actors.hero.spells.stasis$stasisbuff.desc=В данный момент у Жреца находится союзник, находящийся в состоянии стазиса. Все положительные эффекты этого союзника сохраняются, включая «Силу многих», и он снова появится рядом с Жрецом, когда действие эффекта закончится. Эффект также можно прекратить досрочно, повторно применив «Стазис». \n\nСоюзник в стазисе: %1$s.\nОсталось ходов: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Ваш неподвижный союзник остался позади.
actors.hero.spells.stasis$stasisbuff.name=союзник в состоянии стазиса
actors.hero.spells.stasis.desc=Жрец направляет свою связь с союзником на себя, в результате чего союзник временно оказывается в состоянии энергетического стазиса внутри Жреца. Союзник будет находиться в этом состоянии до %d ходов, при этом все положительные эффекты на него не будут затронуты временем, проведенным в стазисе. Союзник появится рядом с Жрецом, когда стазис закончится естественным образом, или он может мгновенно повторно применить заклинание без затрат, чтобы досрочно завершить эффект. Стазис может даже перемещать неподвижных союзников, но не может перемещать их между этажами.
actors.hero.spells.stasis.name=стазис
actors.hero.spells.stasis.short_desc=Удаляет союзника из подземелья и сохраняет его.
actors.hero.spells.sunray.desc=Жрец выпускает в цель луч ослепляющего света, наносящий %1$d-%2$d урона и ослепляющий её на %3$d ходов. Солнечный луч всегда наносит максимальный урон нежити и демоническим целям.\n\n После попадания этим заклинанием зрение противника адаптируется, предотвращая повторное ослепление. Однако, если враг снова будет поражен этим заклинанием, находясь в состоянии ослепления, свет станет подавляющим и вместо этого парализует его.
actors.hero.spells.sunray.name=солнечный луч
actors.hero.spells.sunray.short_desc=Наносит магический урон на расстоянии и ослепляет цель один раз.
actors.hero.spells.walloflight$lightwall.desc=Мерцающие световые панели преграждают здесь проход.
actors.hero.spells.walloflight.desc=Паладин создает перед собой стену из панелей твердого света толщиной в 1 клетку, шириной в 0,00 клеток и длительностью 20 ходов. Эта стена действует как обычная, за исключением того, что сквозь нее можно видеть. Враги, попавшие в стену в момент ее создания, будут на мгновение оглушены и, если возможно, отброшены назад. Все, что застряло в стене, смогут выйти из нее. Стену можно создать в любом из четырех основных или четырех диагональных направлений. Если стена уже активна, заклинание можно использовать повторно бесплатно, чтобы мгновенно убрать стену.
actors.hero.spells.walloflight.early_end=Вы рассеиваете стену света.
actors.hero.spells.walloflight.name=стена света
actors.hero.spells.walloflight.short_desc=Создаёт стену, которая блокирует врагов.
actors.hero.talent$aggressivebarriercooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова. \n\nОсталось ходов: %s.
actors.hero.talent$aggressivebarriercooldown.name=агрессивное охлаждение барьера
actors.hero.talent$combinedlethalityabilitytracker.executed=выполнено
actors.hero.talent$deadlyfollowuptracker.desc=Дуэлистка недавно атаковала врага метательным оружием, поэтому ее рукопашные атаки по той же цели будут иметь увеличенный урон. \n\nОсталось ходов: %s.
actors.hero.talent$deadlyfollowuptracker.name=смертельное продолжение
actors.hero.talent$followupstriketracker.desc=Охотница недавно атаковала врага метательным оружием, поэтому ее следующая рукопашная атака по той же цели будет иметь увеличенный урон. \n\nОсталось ходов: %s.
actors.hero.talent$followupstriketracker.name=повторный удар
actors.hero.talent$improvisedprojectilecooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова. \n\nОсталось ходов: %s.
actors.hero.talent$improvisedprojectilecooldown.name=время охлаждения импровизированных снарядов
actors.hero.talent$lethalhastecooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова. \n\nОсталось ходов: %s.
actors.hero.talent$lethalhastecooldown.name=Смертельная скорость перезарядка
actors.hero.talent$lingeringmagictracker.desc=Если маг недавно использовал посох или волшебную палочку, его следующая физическая атака нанесет дополнительный урон. \n\nОсталось ходов: %s.
actors.hero.talent$lingeringmagictracker.name=непреходящая магия
actors.hero.talent$liquidagilacctracker.desc=Следующая обычная рукопашная атака дуэлиста получит бонус к точности. \n\nОсталось ходов: %s.
actors.hero.talent$liquidagilacctracker.name=жидкая подвижность
actors.hero.talent$patientstriketracker.desc=Дуэлистка только что провела ход в ожидании, её следующая атака ближнего боя нанесёт дополнительный урон.
actors.hero.talent$patientstriketracker.name=забастовка пациентов
actors.hero.talent$preciseassaulttracker.desc=Следующая обычная рукопашная атака дуэлиста получит бонус к точности. \n\nОсталось ходов: %s.
actors.hero.talent$preciseassaulttracker.name=точный штурм
actors.hero.talent$provokedangertracker.desc=Воин недавно потерял свою защиту, его следующая физическая атака нанесет дополнительный урон. \n\nОсталось ходов: %s.
actors.hero.talent$provokedangertracker.name=вызвал гнев
actors.hero.talent$rejuvenatingstepscooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова. \n\nОсталось ходов: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=омолаживающие шаги, заминка
actors.hero.talent$satiatedspellstracker.desc=Следующее заклинание, которое произнесёт жрец, даст ему небольшую защиту.
actors.hero.talent$satiatedspellstracker.name=Защитное заклинание
actors.hero.talent$searinglightcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова. \n\nОсталось ходов: %s.
actors.hero.talent$searinglightcooldown.name=Обжигающий свет
actors.hero.talent$seershotcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова. \n\nОсталось ходов: %s.
actors.hero.talent$seershotcooldown.name=время перезарядки выстрела провидца
actors.hero.talent$swiftequipcooldown.desc=Вы недавно использовали этот талант и должны подождать, прежде чем использовать его снова. \n\nОсталось ходов: %s.
actors.hero.talent$swiftequipcooldown.name=быстрое снаряжение перезарядка
actors.hero.talent.adventurers_intuition.desc=_+1:_ Дуэлистка распознает оружие в 2,5 раза быстрее и броню в 1,75 раза быстрее._+2:_ Дуэлистка распознает оружие, когда надевает его, и броню в 2,5 раза быстрее.
actors.hero.talent.adventurers_intuition.title=интуиция искателя приключений
actors.hero.talent.aggressive_barrier.desc=_+1:_ Дуэлистка получает _3 щита_ при использовании способности оружия, когда её здоровье составляет 50% или меньше.\n\n_+2:_ Дуэлистка получает _5 щита_ при использовании способности оружия, когда её здоровье составляет 50% или меньше.
actors.hero.talent.aggressive_barrier.meta_desc=Если этот талант получит другой герой, он вместо этого будет давать защиту при совершении рукопашной атаки при низком уровне здоровья, с перезарядкой в 50 ходов.
actors.hero.talent.aggressive_barrier.title=агрессивный барьер
actors.hero.talent.ally_warp.desc=_+1:_ Маг может выбрать союзника, чтобы мгновенно поменяться с ним местами, в радиусе _2 клеток_.\n\n_+2:_ Маг может выбрать союзника, чтобы мгновенно поменяться с ним местами, в радиусе _4 клеток_.\n\n_+3:_ Маг может выбрать союзника, чтобы мгновенно поменяться с ним местами, в радиусе _6 клеток_.\n\nМаг не может поменяться местами с неподвижными союзниками.
actors.hero.talent.ally_warp.title=союзник варп
actors.hero.talent.arcane_vision.desc=_+1:_ Когда Маг поражает врага электрическим разрядом, он получает ментальное зрение на него на _10 ходов_.\n\n_+2:_ Когда Маг поражает врага электрическим разрядом, он получает ментальное зрение на него на _15 ходов_.
actors.hero.talent.arcane_vision.title=таинственное видение
actors.hero.talent.assassins_reach.desc=_+1:_ Дальность телепортации Ассасина за каждый уровень подготовки увеличена до _1/3/4/6 клеток_, с 1/2/3/4.\n\n_+2:_ Дальность телепортации Ассасина за каждый уровень подготовки увеличена до _2/4/6/8 клеток_, с 1/2/3/4.\n\n_+3:_ Дальность телепортации Ассасина за каждый уровень подготовки увеличена до _2/5/7/10 клеток_, с 1/2/3/4.\n\nЭта телепортация может проходить сквозь препятствия и врагов, но не сквозь твердую местность, такую как стены.
actors.hero.talent.assassins_reach.title=досягаемость убийцы
actors.hero.talent.aura_of_protection.desc=_+1:_ Паладин может использовать заклинание «Аура защиты», которое дает паладину и всем союзникам в радиусе 2 клеток _20% сопротивления урону_ и эффект глифа брони паладина с _+50% силы_ на 20 ходов, за 2 заряда._+2:_ Паладин может использовать заклинание «Аура защиты», которое дает паладину и всем союзникам в радиусе 2 клеток _30% сопротивления урону_ и эффект глифа брони паладина с _+75% силы_ на 20 ходов, за 2 заряда._+3:_ Паладин может использовать заклинание «Аура защиты», которое дает паладину и всем союзникам в радиусе 2 клеток _40% сопротивления урону_ и эффект глифа брони паладина с _+50% силы +100% мощности на 20 ходов, ценой 2 зарядов.
actors.hero.talent.aura_of_protection.title=аура защиты
actors.hero.talent.backup_barrier.desc=_+1:_ Маг получает _3 щита_ каждый раз, когда тратит последний заряд своего посоха.\n\n_+2:_ Маг получает _5 щита_ каждый раз, когда тратит последний заряд своего посоха.
actors.hero.talent.backup_barrier.meta_desc=Если этот талант получит другой герой, он активируется с помощью волшебной палочки самого высокого уровня этого героя.
actors.hero.talent.backup_barrier.title=резервный барьер
actors.hero.talent.barkskin.desc=_+1:_ При ходьбе по траве Страж получает _0-50% от своего уровня_ в броне из коры деревьев, которая исчезает каждый ход.\n\n_+2:_ При ходьбе по траве Страж получает _0-100% от своего уровня_ в броне из коры деревьев, которая исчезает каждый ход.\n\n_+3:_ При ходьбе по траве Страж получает _0-150% от своего уровня_ в броне из коры деревьев, которая исчезает каждый ход.
actors.hero.talent.barkskin.title=кора
actors.hero.talent.beaming_ray.desc=Жрец может использовать заклинание «Лучевое излучение» от усиленного союзника, потратив 1 заряд. Этот луч может проходить сквозь стены и телепортировать союзника в указанное место. Если в этом месте находится враг, союзник появляется рядом с ним и нацеливается на него. Лучевой луч может даже телепортировать обычно неподвижных союзников, но при этом имеет половину дальности действия. \n\n_+1: Лучевой луч имеет максимальную дальность действия 4 клетки и увеличивает бонус Силы Множества до +35% урона по ближайшему врагу на 10 ходов. \n\n_+2: Лучевой луч имеет максимальную дальность действия 8 клеток и увеличивает бонус Силы Множества до +40% урона по ближайшему врагу на 10 ходов. \n\n_+3: Лучевой луч имеет максимальную дальность действия 12 клеток и увеличивает бонус Силы Множества до +45% урона по ближайшему врагу на 10 ходов. \n\n_+4: Лучевой луч имеет максимальную дальность действия _16 клеток_ и увеличивает бонус «Силы многих» до _+50% урона_ по ближайшему врагу на 10 ходов.
actors.hero.talent.beaming_ray.title=луч
actors.hero.talent.blast_radius.desc=_+1:_ Радиус элементарного взрыва увеличен до _5 клеток_, с 4.\n\n_+2:_ Радиус элементарного взрыва увеличен до _6 клеток_, с 4.\n\n_+3:_ Радиус элементарного взрыва увеличен до _7 клеток_, с 4.\n\n_+4:_ Радиус элементарного взрыва увеличен до _8 клеток_, с 4.
actors.hero.talent.blast_radius.title=радиус взрыва
actors.hero.talent.bless.desc=_+1:_ Жрец может использовать заклинание «Благословение», которое дает _6 ходов благословения и 10 единиц защиты_ при применении на себя или _10 ходов благословения и 10 единиц исцеления_ при применении на другого персонажа, за 1 заряд._+2:_ Жрец может использовать заклинание «Благословение», которое дает _10 ходов благословения и 15 единиц защиты_ при применении на себя или _15 ходов благословения и 15 единиц исцеления_ при применении на другого персонажа, за 1 заряд._ Избыточное исцеление от этого заклинания преобразуется в защиту.
actors.hero.talent.bless.meta_desc=Если этот талант получит другой герой, он вместо этого повысит точность и уклонение героя и всех союзников на 3% при +1 или на 5% при +2.
actors.hero.talent.bless.title=благословить
actors.hero.talent.body_form.desc=Жрец может использовать заклинание «Форма тела», которое наделяет Тринити силой чар или глифа, которые Жрец определил в этом забеге, за 2 заряда. \n\n_+1: При использовании Тринити Жрец получает выбранный эффект на 20 ходов._\n\n_+2: При использовании Тринити Жрец получает выбранный эффект на 27 ходов._\n\n_+3: При использовании Тринити Жрец получает выбранный эффект на 33 хода._\n\n_+4: При использовании Тринити Жрец получает выбранный эффект на 40 ходов._\n\nТринити может быть наделена только Эффекты на теле применяются по одному за раз. Стоимость заряда брони Тринити выше, если выбранный глиф редкий и мощный.
actors.hero.talent.body_form.title=форма тела
actors.hero.talent.body_replacement.desc=_+1:_ После телепортации Разбойник оставляет деревянную приманку с 20 единицами здоровья и 1-3 единицами брони._+2:_ После телепортации Разбойник оставляет деревянную приманку с 40 единицами здоровья и 2-6 единицами брони._+3:_ После телепортации Разбойник оставляет деревянную приманку с 60 единицами здоровья и 3-9 единицами брони._+4:_ После телепортации Разбойник оставляет деревянную приманку с 80 единицами здоровья и 4-12 единицами брони._+4:_ Одновременно может быть активна только одна приманка.
actors.hero.talent.body_replacement.title=замена тела
actors.hero.talent.body_slam.desc=_+1:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _1-4 плюс 25%_ от его способности блокировать урон.\n\n_+2:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _2-8 плюс 50%_ от его способности блокировать урон.\n\n_+3:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _3-12 плюс 75%_ от его способности блокировать урон.\n\n_+4:_ Когда Воин приземляется после прыжка, все соседние враги получают урон, равный _4-16 плюс 100%_ от его способности блокировать урон.
actors.hero.talent.body_slam.title=бросок через тело
actors.hero.talent.bounty_hunter.desc=_+1:_ Когда Ассасин убивает врага подготовленным ударом, его шанс выпадения предмета увеличивается на _2/4/8/16%_ за каждый уровень подготовки.\n\n_+2:_ Когда Ассасин убивает врага подготовленным ударом, его шанс выпадения предмета увеличивается на _4/8/16/32%_ за каждый уровень подготовки.\n\n_+3:_ Когда Ассасин убивает врага подготовленным ударом, его шанс выпадения предмета увеличивается на _6/12/24/48%_ за каждый уровень подготовки.
actors.hero.talent.bounty_hunter.title=охотник за головами
actors.hero.talent.cached_rations.desc=_+1:_ Разбойник может найти _2 пайка_ в сундуках, исследуя следующие несколько этажей подземелья.\n\n_+2:_ Разбойник может найти _3 пайка_ в сундуках, исследуя следующие несколько этажей подземелья.\n\nПакеты съедаются быстро, восстанавливают умеренное чувство сытости, лечат 5 HP и восстанавливают 1 заряд плаща теней.
actors.hero.talent.cached_rations.title=спрятанные пайки
actors.hero.talent.cleanse.desc=_+1:_ Жрец может использовать заклинание _Очищение_, которое снимает негативные статусные эффекты с Жреца и любых находящихся рядом союзников и дает им _10 щита_ за 2 заряда._+2:_ Жрец может использовать заклинание _Очищение_, которое дает Жрецу и любым находящимся рядом союзникам _3 хода иммунитета к негативным статусам_ и дает им _20 щита_ за 2 заряда._+3:_ Жрец может использовать заклинание _Очищение_, которое дает Жрецу и любым находящимся рядом союзникам _5 ходов иммунитета к негативным статусам_ и дает им _30 щита_ за 2 заряда.
actors.hero.talent.cleanse.meta_desc=Если этот талант получает другой герой, он будет снимать негативные эффекты статуса с героя после использования жезла или артефакта в 10/20/30% случаев с бонусом +1/+2/+3.
actors.hero.talent.cleanse.title=очищение
actors.hero.talent.cleave.desc=_+1:_ Дополнительное время, которое гладиатор получает на убийство, увеличено до _30 ходов_, с 15.\n\n_+2:_ Дополнительное время, которое гладиатор получает на убийство, увеличено до _45 ходов_, с 15.\n\n_+3:_ Дополнительное время, которое гладиатор получает на убийство, увеличено до _60 ходов_, с 15.
actors.hero.talent.cleave.title=расщепление
actors.hero.talent.cloned_armor.desc=_+1:_ Теневой клон получает _12%_ от значения брони героя и имеет _25% шанс_ использовать глиф на броне героя.\n\n_+2:_ Теневой клон получает _24%_ от значения брони героя и имеет _50% шанс_ использовать глиф на броне героя.\n\n_+3:_ Теневой клон получает _36%_ от значения брони героя и имеет _75% шанс_ использовать глиф на броне героя.\n\n_+4:_ Теневой клон получает _48%_ от значения брони героя и имеет _100% шанс_ использовать глиф на броне героя.
actors.hero.talent.cloned_armor.title=клонированная броня
actors.hero.talent.close_the_gap.desc=_+1:_ Дуэлистка перемещается на _до двух клеток_ в сторону своей цели при начале дуэли.\n\n_+2:_ Дуэлистка перемещается на _до трех клеток_ в сторону своей цели при начале дуэли.\n\n_+3:_ Дуэлистка перемещается на _до четырех клеток_ в сторону своей цели при начале дуэли.\n\n_+4:_ Дуэлистка перемещается на _до пяти клеток_ в сторону своей цели при начале дуэли.\n\nЭто перемещение может проходить сквозь препятствия и врагов, но не сквозь твердую местность, такую как стены. Перемещение учитывается при определении того, находится ли враг в пределах досягаемости для вызова на поединок.
actors.hero.talent.close_the_gap.title=закрыть разрыв
actors.hero.talent.combined_energy.desc=_+1:_ Если монах использует способность оружия и способность, требующую _4+ энергии_, в течение 5 ходов, она восстанавливает 1 потраченную энергию.\n\n_+2:_ Если монах использует способность оружия и способность, требующую _3+ энергии_, в течение 5 ходов, она восстанавливает 1 потраченную энергию.\n\n_+3:_ Если монах использует способность оружия и способность, требующую _2+ энергии_, в течение 5 ходов, она восстанавливает 1 потраченную энергию.
actors.hero.talent.combined_energy.title=объединенная энергия
actors.hero.talent.combined_lethality.desc=_+1:_ Если Чемпион атакует оружием ближнего боя сразу после использования способности другого оружия, эта атака уничтожит любого врага, кроме босса, у которого осталось _менее 13% HP_.\n\n_+2:_ Если Чемпион атакует оружием ближнего боя сразу после использования способности другого оружия, эта атака уничтожит любого врага, кроме босса, у которого осталось _менее 27% HP_.\n\n_+3:_ Если Чемпион атакует оружием ближнего боя сразу после использования способности другого оружия, эта атака уничтожит любого врага, кроме босса, у которого осталось _менее 40% HP_.\n\nЭта атака может быть обычной атакой оружием ближнего боя или частью способности оружия.
actors.hero.talent.combined_lethality.title=комбинированная летальность
actors.hero.talent.conserved_magic.desc=_+1:_ Каждый разряд дикой магии теперь расходует _0,33 заряда_ вместо 0,5, и у дикой магии есть _25% шанс_ не тратить ход.\n\n_+2:_ Каждый разряд дикой магии теперь расходует _0,225 заряда_ вместо 0,5, и у дикой магии есть _50% шанс_ не тратить ход.\n\n_+3:_ Каждый разряд дикой магии теперь расходует _0,15 заряда_ вместо 0,5, и у дикой магии есть _75% шанс_ не тратить ход.\n\n_+4:_ Каждый разряд дикой магии теперь расходует _0,1 заряда_ вместо 0,5, и у дикой магии есть _100% шанс_ не тратить ход.
actors.hero.talent.conserved_magic.title=сохраненная магия
actors.hero.talent.counter_ability.desc=_+1:_ Если дуэлист использует способность оружия в течение 3 ходов после атаки на его остаточное изображение, он мгновенно восстановит _0,38 зарядов_.\n\n_+2:_ Если дуэлист использует способность оружия в течение 3 ходов после атаки на его остаточное изображение, он мгновенно восстановит _0,77 зарядов_.\n\n_+3:_ Если дуэлист использует способность оружия в течение 3 ходов после атаки на его остаточное изображение, он мгновенно восстановит _1,13 зарядов_.\n\n_+4:_ Если дуэлист использует способность оружия в течение 3 ходов после атаки на его остаточное изображение, он мгновенно восстановит _1,5 зарядов_.
actors.hero.talent.counter_ability.title=контрспособность
actors.hero.talent.deadly_followup.desc=_+1:_ Когда дуэлистка попадает по врагу метательным оружием, она наносит ему на _10% больше урона в ближнем бою_ в течение 5 ходов._+2:_ Когда дуэлистка попадает по врагу метательным оружием, она наносит ему на _20% больше урона в ближнем бою_ в течение 5 ходов._+3:_ Когда дуэлистка попадает по врагу метательным оружием, она наносит ему на _30% больше урона в ближнем бою_ в течение 5 ходов.
actors.hero.talent.deadly_followup.title=смертельное продолжение
actors.hero.talent.deathless_fury.desc=_+1:_ Эффект «Берсерк» автоматически срабатывает, если берсерк находится на грани смерти, а уровень ярости равен или превышает 100%, но в этом случае у него есть время восстановления в _3 уровня героя_.\n\n_+2:_ Эффект «Берсерк» автоматически срабатывает, если берсерк находится на грани смерти, а уровень ярости равен или превышает 100%, но в этом случае у него есть время восстановления в _2 уровня героя_.\n\n_+3:_ Эффект «Берсерк» автоматически срабатывает, если берсерк находится на грани смерти, а уровень ярости равен или превышает 100%, но в этом случае у него есть время восстановления в _1 уровень героя_.\n\nОбратите внимание, что берсерк все равно умрет, даже если у него останется 0 HP после окончания эффекта «Берсерк».
actors.hero.talent.deathless_fury.title=бессмертная ярость
actors.hero.talent.deathly_durability.desc=_+1:_ Враги, убитые меткой смерти, дают разбойнику щит, равный _13%_ от их здоровья в момент получения метки.\n\n_+2:_ Враги, убитые меткой смерти, дают разбойнику щит, равный _25%_ от их здоровья в момент получения метки.\n\n_+3:_ Враги, убитые меткой смерти, дают разбойнику щит, равный _38%_ от их здоровья в момент получения метки.\n\n_+4:_ Враги, убитые меткой смерти, дают разбойнику щит, равный _50%_ от их здоровья в момент получения метки.
actors.hero.talent.deathly_durability.title=смертоносная прочность
actors.hero.talent.desperate_power.desc=_+1:_ Волшебные палочки и посох мага получают +1 уровень_ при последнем разряде, когда у них остаётся последний заряд.\n\n_+2:_ Волшебные палочки и посох мага получают +2 уровня_ при последнем разряде, когда у них остаётся последний заряд.\n\n_+3:_ Волшебные палочки и посох мага получают +3 уровня_ при последнем разряде, когда у них остаётся последний заряд.
actors.hero.talent.desperate_power.title=отчаянная власть
actors.hero.talent.directed_power.desc=_+1:_ Прямая атака элементальным ударом получает +30% к силе зачарования за каждого врага в радиусе действия элементального удара, включая цель атаки. _+2:_ Прямая атака элементальным ударом получает +60% к силе зачарования за каждого врага в радиусе действия элементального удара, включая цель атаки. _+3:_ Прямая атака элементальным ударом получает +90% к силе зачарования за каждого врага в радиусе действия элементального удара, включая цель атаки. _+4:_ Прямая атака элементальным ударом получает +120% к силе зачарования за каждого врага в радиусе действия элементального удара, включая цель атаки.
actors.hero.talent.directed_power.title=направленная сила
actors.hero.talent.divine_intervention.desc=_+1:_ Находясь в Вознесённой форме, жрец может использовать заклинание «Божественное вмешательство», которое увеличивает защиту жреца и всех союзников до 150 и продлевает Вознесённую форму на 3 хода._\n\n_+2:_ Находясь в Вознесённой форме, жрец может использовать заклинание «Божественное вмешательство», которое увеличивает защиту жреца и всех союзников до 200 и продлевает Вознесённую форму на 4 хода._\n\n_+3:_ Находясь в Вознесённой форме, жрец может использовать заклинание «Божественное вмешательство», которое увеличивает защиту жреца и всех союзников до 250 и продлевает Вознесённую форму на 5 ходов._\n\n_+4:_ Находясь в В Вознесённой форме Жрец может использовать заклинание «Божественное вмешательство», которое увеличивает защиту Жреца и всех союзников до 300 единиц и продлевает действие Вознесённой формы на 6 ходов. «Божественное вмешательство» стоит целых 5 зарядов тома и может быть использовано только один раз в одной и той же Вознесённой форме.
actors.hero.talent.divine_intervention.title=божественное вмешательство
actors.hero.talent.divine_sense.desc=_+1:_ Жрец может использовать заклинание _Божественное Чувство_, которое дает ему _8 клеток_ видения разума на 50 ходов и не требует времени для применения, за 2 заряда._+2:_ Жрец может использовать заклинание _Божественное Чувство_, которое дает ему _12 клеток_ видения разума на 50 ходов и не требует времени для применения, за 2 заряда.
actors.hero.talent.divine_sense.meta_desc=Если этот талант получит другой герой, то вместо этого он на короткое время дарует ему мысленное зрение после использования волшебной палочки или артефакта с дальностью действия 3 клетки (+1) или 5 клеток (+2).
actors.hero.talent.divine_sense.title=божественное чувство
actors.hero.talent.double_jump.desc=_+1:_ Если Воин совершает второй прыжок в течение 3 ходов, стоимость его заряда уменьшается на 16%.\n\n_+2:_ Если Воин совершает второй прыжок в течение 3 ходов, стоимость его заряда уменьшается на 30%.\n\n_+3:_ Если Воин совершает второй прыжок в течение 3 ходов, стоимость его заряда уменьшается на 40%.\n\n_+4:_ Если Воин совершает второй прыжок в течение 3 ходов, стоимость его заряда уменьшается на 50%.
actors.hero.talent.double_jump.title=двойной прыжок
actors.hero.talent.double_mark.desc=_+1:_ Одновременная отметка второй цели и первой имеет _сниженную на 30%_ стоимость.\n\n_+2:_ Одновременная отметка второй цели и первой имеет _сниженную на 50%_ стоимость.\n\n_+3:_ Одновременная отметка второй цели и первой имеет _сниженную на 65%_ стоимость.\n\n_+4:_ Одновременная отметка второй цели и первой имеет _сниженную на 75% стоимость.
actors.hero.talent.double_mark.title=двойная отметка
actors.hero.talent.durable_projectiles.desc=_+1:_ Метательное оружие имеет _+50% прочности_ при использовании Охотницей.\n\n_+2:_ Метательное оружие имеет _+75% прочности_ при использовании Охотницей.
actors.hero.talent.durable_projectiles.title=прочные снаряды
actors.hero.talent.durable_tips.desc=_+1:_ Дротики с наконечниками обладают в 2 раза большей прочностью_ при использовании Стражем.\n\n_+2:_ Дротики с наконечниками обладают в 3 раза большей прочностью_ при использовании Стражем.\n\n_+3:_ Дротики с наконечниками обладают в 4 раза большей прочностью_ при использовании Стражем.
actors.hero.talent.durable_tips.title=прочные наконечники
actors.hero.talent.eagle_eye.desc=_+1:_ Дальность обзора духовного ястреба увеличена с 6 до 7 клеток._+2:_ Дальность обзора духовного ястреба увеличена с 6 до 8 клеток._+3:_ Дальность обзора духовного ястреба увеличена с 6 до 9 клеток, и он получает 2 клетки ментального зрения._+4:_ Дальность обзора духовного ястреба увеличена с 6 до 10 клеток, и он получает 3 клетки ментального зрения.
actors.hero.talent.eagle_eye.title=орлиный глаз
actors.hero.talent.elemental_power.desc=_+1:_ Мощность элементального взрыва увеличена на _25%_.\n\n_+2:_ Мощность элементального взрыва увеличена на _50%_.\n\n_+3:_ Мощность элементального взрыва увеличена на _75%_.\n\n_+4:_ Мощность элементального взрыва увеличена на _100%_.
actors.hero.talent.elemental_power.title=стихийная сила
actors.hero.talent.elemental_reach.desc=_+1:_ Дальность действия элементарного удара увеличена с 4 до 5 клеток, а его ширина увеличена с 65 до 75 градусов._+2:_ Дальность действия элементарного удара увеличена с 4 до 6 клеток, а его ширина увеличена с 65 до 85 градусов._+3:_ Дальность действия элементарного удара увеличена с 4 до 7 клеток, а его ширина увеличена с 65 до 95 градусов._+4:_ Дальность действия элементарного удара увеличена с 4 до 8 клеток, а его ширина увеличена с 65 до 105 градусов.
actors.hero.talent.elemental_reach.title=элементарный радиус действия
actors.hero.talent.elimination_match.desc=_+1:_ Если дуэлист снова вызывает на поединок в течение 3 ходов после окончания дуэли, стоимость этого вызова снижается на 16%._+2:_ Если дуэлист снова вызывает на поединок в течение 3 ходов после окончания дуэли, стоимость этого вызова снижается на 30%._+3:_ Если дуэлист снова вызывает на поединок в течение 3 ходов после окончания дуэли, стоимость этого вызова снижается на 40%._+4:_ Если дуэлист снова вызывает на поединок в течение 3 ходов после окончания дуэли, стоимость этого вызова снижается на 50%.
actors.hero.talent.elimination_match.title=матч на выбывание
actors.hero.talent.empowered_strike.desc=_+1: Первый удар боевого мага посохом в ближнем бою после поражения электрическим разрядом наносит _+16% урона_, а бонусный эффект посоха получает _+50% силы_.\n\n_+2: Первый удар боевого мага посохом в ближнем бою после поражения электрическим разрядом наносит _+33% урона_, а бонусный эффект посоха получает _+100% силы_.\n\n_+3: Первый удар боевого мага посохом в ближнем бою после поражения электрическим разрядом наносит _+50% урона_, а бонусный эффект посоха получает _+150% силы_.
actors.hero.talent.empowered_strike.title=усиленная забастовка
actors.hero.talent.empowering_meal.desc=_+1:_ Употребление пищи дает Магу _2 бонусного урона_ в следующие 3 раза, когда он наносит урон волшебной палочкой.\n\n_+2:_ Употребление пищи дает Магу _3 бонусного урона_ в следующие 3 раза, когда он наносит урон волшебной палочкой.
actors.hero.talent.empowering_meal.title=питательная еда
actors.hero.talent.endless_rage.desc=_+1:_ Берсерк может достичь максимума в 116% ярости_.\n\n_+2:_ Берсерк может достичь максимума в 133% ярости_.\n\n_+3:_ Берсерк может достичь максимума в 150% ярости_.\n\nКаждое очко ярости сверх 100% увеличивает защиту берсерка на 1% и уменьшает время восстановления на 1%, но не увеличивает бонус к урону сверх +50%.
actors.hero.talent.endless_rage.title=бесконечная ярость
actors.hero.talent.energizing_meal.desc=_+1:_ Употребление пищи отнимает у Мага 1 ход и дает ему _5 ходов перезарядки волшебной палочки_.\n\n_+2:_ Употребление пищи отнимает у Мага 1 ход и дает ему _8 ходов перезарядки волшебной палочки_.
actors.hero.talent.energizing_meal.title=энергетическое питание
actors.hero.talent.enhanced_combo.desc=_+1:_ Когда комбо Гладиатора достигает 7 или более, радиус отбрасывания от «Сокрушения» увеличивается до 3, вызывает головокружение и может сбрасывать врагов в ямы.\n\n_+2:_ В дополнение к преимуществам +1, когда комбо Гладиатора достигает 9 или более, «Парирование» работает на нескольких атаках.\n\n_+3:_ В дополнение к преимуществам +1 и +2, Гладиатор может подпрыгивать на расстояние до комбо/3 клеток при использовании «Удара», «Сокрушения» или «Ярости».
actors.hero.talent.enhanced_combo.title=улучшенная комбинация
actors.hero.talent.enhanced_lethality.desc=_+1:_ Ассасин может убивать врагов, у которых осталось менее _4/13/27/67% здоровья_ за каждый уровень подготовки, вместо 3/10/20/50%.\n\n_+2:_ Ассасин может убивать врагов, у которых осталось менее _5/17/33/83% здоровья_ за каждый уровень подготовки, вместо 3/10/20/50%.\n\n_+3:_ Ассасин может убивать врагов, у которых осталось менее _6/20/40/100% здоровья_ за каждый уровень подготовки, вместо 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=повышенная летальность
actors.hero.talent.enhanced_rings.desc=_+1:_ Когда Разбойник использует артефакт, его кольца получают +1 улучшение на _3 хода_.\n\n_+2:_ Когда Разбойник использует артефакт, его кольца получают +1 улучшение на _6 ходов_.\n\n_+3:_ Когда Разбойник использует артефакт, его кольца получают +1 улучшение на _9 ходов_.
actors.hero.talent.enhanced_rings.title=улучшенные кольца
actors.hero.talent.enlightening_meal.desc=_+1:_ Прием пищи отнимает у жреца 1 ход и добавляет _0,67 зарядов_ к его священному фолио.\n\n_+2:_ Прием пищи отнимает у жреца 1 ход и добавляет _1 заряд_ к его священному фолио.
actors.hero.talent.enlightening_meal.meta_desc=Если этот талант получит другой герой, он вместо этого даст 2 хода перезарядки жезла и артефакта с бонусом +1 или 3 хода с бонусом +2. Это нельзя использовать для перезарядки Рога изобилия.
actors.hero.talent.enlightening_meal.title=Просветляющая трапеза
actors.hero.talent.enraged_catalyst.desc=_+1:_ Заклинания и проклятия на оружии берсерка срабатывают чаще, чем больше у него ярости, максимум на _15% чаще_ при 100% ярости._+2:_ Заклинания и проклятия на оружии берсерка срабатывают чаще, чем больше у него ярости, максимум на _30% чаще_ при 100% ярости._+3:_ Заклинания и проклятия на оружии берсерка срабатывают чаще, чем больше у него ярости, максимум на _45% чаще_ при 100% ярости.
actors.hero.talent.enraged_catalyst.title=разъяренный катализатор
actors.hero.talent.evasive_armor.desc=_+1:_ Во время свободного бега Фрираннер получает дополнительно _+1 уклонения_ за избыточное очко силы на своей броне.\n\n_+2:_ Во время свободного бега Фрираннер получает дополнительно _+2 уклонения_ за каждое избыточное очко силы на своей броне. дополнительные _+3 уклонения_ за каждое лишнее очко силы на его броне.
actors.hero.talent.evasive_armor.title=уклоняющаяся броня
actors.hero.talent.even_the_odds.desc=_+1:_ Воин наносит дополнительный _5% бонусный урон_ за каждого врага в радиусе 2 клеток, когда эффект "Выносливость" заканчивается.\n\n_+2:_ Воин наносит дополнительный _10% бонусный урон_ за каждого врага в радиусе 2 клеток, когда эффект "Выносливость" заканчивается.\n\n_+3:_ Воин наносит дополнительный _15% бонусный урон_ за каждого врага в радиусе 2 клеток, когда эффект "Выносливость" заканчивается.\n\n_+4:_ Воин наносит дополнительный _20% бонусный урон_ за каждого врага в радиусе 2 клеток, когда эффект "Выносливость" заканчивается.
actors.hero.talent.even_the_odds.title=равные шансы
actors.hero.talent.excess_charge.desc=_+1:_ Когда посох боевого мага полностью заряжен, следующий разряд даст ему _0,67 щита_ за каждый уровень посоха.\n\n_+2:_ Когда посох боевого мага полностью заряжен, следующий разряд даст ему _1,33 щита_ за каждый уровень посоха.\n\n_+3:_ Когда посох боевого мага полностью заряжен, следующий разряд даст ему _2 щита_ за каждый уровень посоха.
actors.hero.talent.excess_charge.title=избыточный заряд
actors.hero.talent.expanding_wave.desc=_+1:_ Дальность действия Shockwave увеличена с 5 до 6 клеток, а ширина увеличена с 60 до 75 градусов._+2:_ Дальность действия Shockwave увеличена с 5 до 7 клеток, а ширина увеличена с 60 до 90 градусов._+3:_ Дальность действия Shockwave увеличена с 5 до 8 клеток, а ширина увеличена с 60 до 105 градусов._+4:_ Дальность действия Shockwave увеличена с 5 до 9 клеток, а ширина увеличена с 60 до 120 градусов.
actors.hero.talent.expanding_wave.title=расширяющаяся волна
actors.hero.talent.expose_weakness.desc=_+1:_ Враги, атакующие остаточное изображение дуэлиста, становятся слабыми и уязвимыми на _2 хода_.\n\n_+2:_ Враги, атакующие остаточное изображение дуэлиста, становятся слабыми и уязвимыми на _4 хода_.\n\n_+3:_ Враги, атакующие остаточное изображение дуэлиста, становятся слабыми и уязвимыми на _6 ходов_.\n\n_+4:_ Враги, атакующие остаточное изображение дуэлиста, становятся слабыми и уязвимыми на _8 ходов_.
actors.hero.talent.expose_weakness.title=выявить слабость
actors.hero.talent.fan_of_blades.desc=_+1:_ Призрачные клинки могут поразить до _1 дополнительной цели_ с 50% урона. Цель должна быть видимой и находиться в пределах конуса _30 градусов_ области поражения. _+2:_ Призрачные клинки могут поразить до _2 дополнительных целей_ с 50% урона. Цели должны быть видимыми и находиться в пределах конуса _60 градусов_ области поражения. _+3:_ Призрачные клинки могут поразить до _3 дополнительных целей_ с 50% урона. Цели должны быть видимыми и находиться в пределах конуса _90 градусов_ области поражения. _+4:_ Призрачные клинки могут поразить до _4 дополнительных целей_ с 50% урона. Цели должны быть видимыми и находиться в пределах конуса _120 градусов_ области поражения.
actors.hero.talent.fan_of_blades.title=веер лезвий
actors.hero.talent.farsight.desc=_+1:_ Дальность обзора снайпера _увеличена на 25%_.\n\n_+2:_ Дальность обзора снайпера _увеличена на 50%_.\n\n_+3:_ Дальность обзора снайпера _увеличена на 75%_.
actors.hero.talent.farsight.title=дальнозоркость
actors.hero.talent.fear_the_reaper.desc=_+1:_ Когда у врага, отмеченного смертью, остается 0 HP, он становится _калекой_.\n\n_+2:_ Когда у врага, отмеченного смертью, остается 0 HP, он становится _внушающим страх и калекой_.\n\n_+3:_ Когда у врага, отмеченного смертью, остается 0 HP, он становится _внушающим страх и калекой_, а враги в радиусе 3 клеток становятся _калеками_.\n\n_+4:_ Когда у врага, отмеченного смертью, остается 0 HP, он становится _внушающим страх и калекой_, а враги в радиусе 3 клеток становятся _внушающими страх и калеками_.
actors.hero.talent.fear_the_reaper.title=бойтесь жнеца
actors.hero.talent.feigned_retreat.desc=_+1:_ Если враг атакует остаточное изображение Дуэлиста, она получает _2 хода_ ускорения.\n\n_+2:_ Если враг атакует остаточное изображение Дуэлиста, она получает _4 хода_ ускорения.\n\n_+3:_ Если враг атакует остаточное изображение Дуэлиста, она получает _6 ходов_ ускорения.\n\n_+4:_ Если враг атакует остаточное изображение Дуэлиста, она получает _8 ходов_ ускорения.
actors.hero.talent.feigned_retreat.title=притворное отступление
actors.hero.talent.fire_everything.desc=_+1:_ Дикая магия теперь срабатывает _5 раз_ вместо 4, и каждая палочка имеет _25% шанс_ быть использованной 3 раза.\n\n_+2:_ Дикая магия теперь срабатывает _6 раз_ вместо 4, и каждая палочка имеет _50% шанс_ быть использованной 3 раза.\n\n_+3:_ Дикая магия теперь срабатывает _7 раз_ вместо 4, и каждая палочка имеет _75% шанс_ быть использованной 3 раза.\n\n_+4:_ Дикая магия теперь срабатывает _8 раз_ вместо 4, и каждая палочка имеет _100% шанс_ быть использованной 3 раза.
actors.hero.talent.fire_everything.title=всё поджечь
actors.hero.talent.flash.desc=_+1:_ Находясь в Вознесённой форме, жрец может использовать заклинание _Вспышка_ для телепортации на расстояние до _3 клеток_.\n\n_+2:_ Находясь в Вознесённой форме, жрец может использовать заклинание _Вспышка_ для телепортации на расстояние до _4 клеток_.\n\n_+3:_ Находясь в Вознесённой форме, жрец может использовать заклинание _Вспышка_ для телепортации на расстояние до _5 клеток_.\n\n_+4:_ Находясь в Вознесённой форме, жрец может использовать заклинание _Вспышка_ для телепортации на расстояние до _6 клеток_.\n\nЗаклинание «Вспышка» стоит 2 заряда тома изначально и ещё 1 заряд за каждое использование в той же Вознесённой форме.
actors.hero.talent.flash.title=вспышка
actors.hero.talent.focused_meal.desc=_+1:_ Употребление пищи отнимает у Дуэлистки 1 ход и добавляет ей _0,67 зарядов_ к оружию.\n\n_+2:_ Употребление пищи отнимает у Дуэлистки 1 ход и добавляет ей _1 заряд_ к оружию.
actors.hero.talent.focused_meal.meta_desc=Если этот талант получит другой герой, он вместо этого даст бонусный урон к его следующему удару, равный его уровню/3 с +1, или уровню/2 с +2.
actors.hero.talent.focused_meal.title=целенаправленное питание
actors.hero.talent.followup_strike.desc=_+1:_ Когда Охотница поражает врага луком или метательным оружием, ее следующая рукопашная атака по этому врагу наносит _2 дополнительного урона_.\n\n_+2:_ Когда Охотница поражает врага луком или метательным оружием, ее следующая рукопашная атака по этому врагу наносит _3 дополнительного урона_.
actors.hero.talent.followup_strike.title=повторный удар
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Атаки духовного ястреба ослепляют врагов на _2 хода_.\n\n_+2:_ Атаки духовного ястреба ослепляют врагов на _5 ходов_.\n\n_+3:_ Атаки духовного ястреба ослепляют врагов на _5 ходов_ и наносят им урон на _2 хода_.\n\n_+4:_ Атаки духовного ястреба ослепляют врагов на _5 ходов_ и наносят им урон на _5 ходов_.
actors.hero.talent.go_for_the_eyes.title=целиться в глаза
actors.hero.talent.growing_power.desc=_+1:_ Увеличение атаки и скорости передвижения от силы природы увеличено до _38% и 125%_ с 33% и 100%.\n\n_+2:_ Увеличение атаки и скорости передвижения от силы природы увеличено до _42% и 150%_ с 33% и 100%.\n\n_+3:_ Увеличение атаки и скорости передвижения от силы природы увеличено до _46% и 175%_ с 33% и 100%.\n\n_+4:_ Увеличение атаки и скорости передвижения от силы природы увеличено до _50% и 200%_ с 33% и 100%.
actors.hero.talent.growing_power.title=растущая мощь
actors.hero.talent.hallowed_ground.desc=_+1:_ Жрец может использовать заклинание «Священная земля», которое освящает местность в области 3x3 на 20 ходов, затрачивая 2 заряда._+2:_ Жрец может использовать заклинание «Священная земля», которое освящает местность в области 5x5 на 20 ходов, затрачивая 2 заряда._+3:_ Жрец может использовать заклинание «Священная земля», которое освящает местность в области 7x7 на 20 ходов, затрачивая 2 заряда._+3 При использовании «Священная земля» восстанавливает союзникам 15 HP, ненадолго обездвиживает врагов и разбрасывает короткую траву. После этого она медленно восстанавливает здоровье союзников, ослабляет врагов и вызывает случайный рост высокой травы. Священная земля дарует жрецу защиту вместо исцеления и уничтожается огнём.
actors.hero.talent.hallowed_ground.title=священная земля
actors.hero.talent.hasty_retreat.desc=_+1:_ После телепортации Разбойник получает _1 ход_ ускорения и невидимости.\n\n_+2:_ После телепортации Разбойник получает _2 хода_ ускорения и невидимости.\n\n_+3:_ После телепортации Разбойник получает _3 хода_ ускорения и невидимости.\n\n_+4:_ После телепортации Разбойник получает _4 хода_ ускорения и невидимости.
actors.hero.talent.hasty_retreat.title=поспешное отступление
actors.hero.talent.hearty_meal.desc=_+1:_ Прием пищи восстанавливает Воину _4 HP_, когда его здоровье составляет 33% или меньше. _+2:_ Прием пищи восстанавливает Воину _6 HP_, когда его здоровье составляет 33% или меньше.
actors.hero.talent.hearty_meal.title=сытный обед
actors.hero.talent.heightened_senses.desc=_+1:_ Охотница получает способность видеть разум персонажей в радиусе _2 клеток от своей позиции_.\n\n_+2:_ Охотница получает способность видеть разум персонажей в радиусе _3 клеток от своей позиции_.
actors.hero.talent.heightened_senses.title=обостренные чувства
actors.hero.talent.heroic_energy.desc=_+1:_ Стоимость зарядки способности «Броня» героя снижена на 12%.\n\n_+2:_ Стоимость зарядки способности «Броня» героя снижена на 23%.\n\n_+3:_ Стоимость зарядки способности «Броня» героя снижена на 32%.\n\n_+4:_ Стоимость зарядки способности «Броня» героя снижена на 40%.
actors.hero.talent.heroic_energy.rat_title=ратроическая энергия
actors.hero.talent.heroic_energy.title=героическая энергия
actors.hero.talent.hold_fast.desc=_+1:_ Когда Воин ждет, он получает _1-2 брони_ и замедляет ослабление комбо и щитовых баффов на _50%_, пока не совершит движение.\n\n_+2:_ Когда Воин ждет, он получает _2-4 брони_ и замедляет ослабление комбо и щитовых баффов на _75%_, пока не совершит движение.\n\n_+3:_ Когда Воин ждет, он получает _3-6 брони_ и замедляет ослабление комбо и щитовых баффов на _100%_, пока не совершит движение.
actors.hero.talent.hold_fast.title=стойко держаться
actors.hero.talent.holy_intuition.desc=_+1:_ Жрец может использовать заклинание «Святая интуиция», которое показывает, проклят ли предмет, за _3 заряда._\n\n_+2:_ Жрец может использовать заклинание «Святая интуиция», которое показывает, проклят ли предмет, за _2 заряда._
actors.hero.talent.holy_intuition.meta_desc=Если этот талант получит другой герой, он позволит герою определить наличие проклятия на проклятом предмете непосредственно перед его экипировкой в 15% случаев при +1 или в 25% случаев при +2.
actors.hero.talent.holy_intuition.title=священная интуиция
actors.hero.talent.holy_lance.desc=_+1:_ Жрец может использовать _Священное Копьё_, разрушительное заклинание, наносящее _30-55 урона_ за 4 заряда._+2:_ Жрец может использовать _Священное Копьё_, разрушительное заклинание, наносящее _45-83 урона_ за 4 заряда._+3:_ Жрец может использовать _Священное Копьё_, разрушительное заклинание, наносящее _60-110 урона_ за 4 заряда._+3:_ Жрец может использовать _Священное Копьё_, разрушительное заклинание, наносящее _60-110 урона_ за 4 заряда._+4 Священное Копьё всегда наносит максимальный урон демоническим и немертвым врагам. Священное Копьё имеет 30-ходовое время восстановления, прежде чем его можно будет использовать снова.
actors.hero.talent.holy_lance.title=святое копье
actors.hero.talent.impact_wave.desc=_+1:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _2 клетки_ назад и имеют _25% шанс_ стать уязвимыми на 5 ходов.\n\n_+2:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _3 клетки_ назад и имеют _50% шанс_ стать уязвимыми на 5 ходов.\n\n_+3:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _4 клетки_ назад и имеют _75% шанс_ стать уязвимыми на 5 ходов.\n\n_+4:_ Когда Воин приземляется после прыжка, все соседние враги отбрасываются на _5 клеток_ назад и имеют _100% шанс_ стать уязвимыми на 5 ходов.
actors.hero.talent.impact_wave.title=ударная волна
actors.hero.talent.improvised_projectiles.desc=_+1:_ Воин может ослепить врага на _2 хода_, бросив в него любой предмет, кроме метательного оружия. Время восстановления — 50 ходов._+2:_ Воин может ослепить врага на _3 хода_, бросив в него любой предмет, кроме метательного оружия. Время восстановления — 50 ходов.
actors.hero.talent.improvised_projectiles.title=импровизированные снаряды
actors.hero.talent.inscribed_power.desc=_+1:_ Когда Маг читает свиток или использует заклинание, его _следующие 2 разряда жезла_ получают +2 уровня.\n\n_+2:_ Когда Маг читает свиток или использует заклинание, его _следующие 3 разряда жезла_ получают +2 уровня.\n\n Количество усиленных разрядов жезла удваивается при использовании свитка улучшения, трансмутации или алхимии, которые должны быть созданы с помощью этих свитков.\n\n Для алхимических предметов с большим количеством производимых эффектов (например, большинство заклинаний) этот талант может сработать в зависимости от количества произведенных таких предметов.
actors.hero.talent.inscribed_power.title=записанная сила
actors.hero.talent.inscribed_stealth.desc=_+1:_ Разбойник получает _3 хода_ невидимости после прочтения свитка или использования заклинания.\n\n_+2:_ Разбойник получает _5 ходов_ невидимости после прочтения свитка или использования заклинания.\n\nДлительность невидимости удваивается при использовании свитка улучшения, свитка трансмутации или алхимических предметов, которые необходимо изготовить с помощью этих свитков.\n\nДля алхимических предметов с большим количеством производимых единиц (например, большинства заклинаний) этот талант может сработать в зависимости от количества произведенных таких предметов.
actors.hero.talent.inscribed_stealth.title=выгравированная скрытность
actors.hero.talent.invigorating_meal.desc=_+1:_ Употребление пищи отнимает у Охотницы 1 ход (ягоды съедаются мгновенно) и дает ей _1 ход ускорения_.\n\n_+2:_ Употребление пищи отнимает у Охотницы 1 ход (ягоды съедаются мгновенно) и дает ей _2 хода ускорения_.
actors.hero.talent.invigorating_meal.title=бодрящая еда
actors.hero.talent.invigorating_victory.desc=_+1:_ Если дуэлистка победит свою цель до окончания дуэли, она восстановит _5 HP плюс 30% от полученного урона_ во время дуэли.\n\n_+2:_ Если дуэлистка победит свою цель до окончания дуэли, она восстановит _10 HP плюс 50% от полученного урона_ во время дуэли.\n\n_+3:_ Если дуэлистка победит свою цель до окончания дуэли, она восстановит _15 HP плюс 65% от полученного урона_ во время дуэли.\n\n_+4:_ Если дуэлистка победит свою цель до окончания дуэли, она восстановит _20 HP плюс 75% от полученного урона_ во время дуэли.
actors.hero.talent.invigorating_victory.title=воодушевляющая победа
actors.hero.talent.iron_stomach.desc=_+1:_ Приём пищи отнимает у Воина 1 ход и даёт ему _75% сопротивления урону_ во время еды.\n\n_+2:_ Приём пищи отнимает у Воина 1 ход и даёт ему _100% сопротивления урону_ во время еды.
actors.hero.talent.iron_stomach.title=железный желудок
actors.hero.talent.iron_will.desc=_+1:_ Щит, обеспечиваемый печатью Воина, _увеличивается на 1_.\n\n_+2:_ Щит, обеспечиваемый печатью Воина, _увеличивается на 2_.
actors.hero.talent.iron_will.meta_desc=Если этот талант получит другой герой, он пассивно предоставит эффект «сломанной печати» Воина, увеличивающий максимальный запас щита до 1 или 2.
actors.hero.talent.iron_will.title=железная воля
actors.hero.talent.judgement.desc=_+1:_ Находясь в Вознесённой форме, жрец может применять заклинание «Суд», которое наносит _10-20 урона_ всем видимым врагам._+2:_ Находясь в Вознесённой форме, жрец может применять заклинание «Суд», которое наносит _15-30 урона_ всем видимым врагам._+3:_ Находясь в Вознесённой форме, жрец может применять заклинание «Суд», которое наносит _20-40 урона_ всем видимым врагам._+4:_ Находясь в Вознесённой форме, жрец может применять заклинание «Суд», которое наносит _25-50 урона_ всем видимым врагам._+6_+7_ Стоимость заклинания «Суд» составляет 3 заряда тома. Заклинание «Суд» наносит на 33% больше урона за каждое заклинание, которое жрец применил с момента перехода в вознесённую форму или с момента последнего применения «Суда».
actors.hero.talent.judgement.title=суждение
actors.hero.talent.lay_on_hands.desc=_+1:_ Паладин может применить заклинание «Возложение рук», которое мгновенно исцеляет ближайшего персонажа на 15 HP или дает паладину 15 щита за 1 заряд._+2:_ Паладин может применить заклинание «Возложение рук», которое мгновенно исцеляет ближайшего персонажа на 20 HP или дает паладину 20 щита за 1 заряд._+3:_ Паладин может применить заклинание «Возложение рук», которое мгновенно исцеляет ближайшего персонажа на 25 HP или дает паладину 25 щита за 1 заряд._ Избыточное исцеление от этого заклинания преобразуется в щит. Заклинание «Возложение рук» можно применять многократно, но оно не может обеспечить защиту более чем за три применения одновременно.
actors.hero.talent.lay_on_hands.title=возложить руки
actors.hero.talent.lethal_defense.desc=_+1:_ Когда Гладиатор убивает врага комбо-ударом, время восстановления его щита «Сломанная печать» уменьшается на 50 ходов_.\n\n_+2:_ Когда Гладиатор убивает врага комбо-ударом, время восстановления его щита «Сломанная печать» уменьшается на 100 ходов_.\n\n_+3:_ Когда Гладиатор убивает врага комбо-ударом, время восстановления его щита «Сломанная печать» уменьшается на 150 ходов_.\n\nВремя восстановления щита может быть уменьшено до -150 ходов благодаря этому таланту, что означает, что он немедленно снова станет доступен после активации.
actors.hero.talent.lethal_defense.title=смертоносная защита
actors.hero.talent.lethal_haste.desc=_+1:_ Когда дуэлистка наносит смертельный удар врагу, обладающему способностью оружия, она получает _3 хода_ мгновенного перемещения.\n\n_+2:_ Когда дуэлистка наносит смертельный удар врагу, обладающему способностью оружия, она получает _5 ходов_ мгновенного перемещения.
actors.hero.talent.lethal_haste.meta_desc=Если этот талант получит другой герой, он будет активироваться при обычных атаках оружием, с перезарядкой в 100 ходов.
actors.hero.talent.lethal_haste.title=смертельная спешка
actors.hero.talent.lethal_momentum.desc=_+1:_ Когда Воин наносит смертельный удар врагу физическим оружием, у него есть _67% шанс_ сделать 0 ходов.\n\n_+2:_ Когда Воин наносит смертельный удар врагу физическим оружием, у него есть _100% шанс_ сделать 0 ходов.
actors.hero.talent.lethal_momentum.title=смертельный импульс
actors.hero.talent.life_link.desc=Жрец может использовать заклинание «Жизненная связь» между собой и усиленным союзником, потратив 2 заряда. Это заклинание распределяет урон между жрецом и его союзником, а также заставляет полезные заклинания жреца 3-го уровня или ниже применяться к обоим, если один из них находится под воздействием. \n\n_+1:_ Связь жизни длится _10 ходов_ и увеличивает бонус Силы многих до -35% получаемого урона._\n\n_+2:_ Связь жизни длится _13 ходов_ и увеличивает бонус Силы многих до -40% получаемого урона._\n\n_+3:_ Связь жизни длится _17 ходов_ и увеличивает бонус Силы многих до -45% получаемого урона._\n\n_+4:_ Связь жизни длится _20 ходов_ и увеличивает бонус Силы многих до -50% получаемого урона.
actors.hero.talent.life_link.title=связь жизни
actors.hero.talent.light_cloak.desc=_+1:_ Разбойник может использовать свой плащ теней, даже если он не надет, но он перезаряжается со скоростью _25%_, когда не надет.\n\n_+2:_ Разбойник может использовать свой плащ теней, даже если он не надет, но он перезаряжается со скоростью _50%_, когда не надет.\n\n_+3:_ Разбойник может использовать свой плащ теней, даже если он не надет, но он перезаряжается со скоростью _75%_, когда не надет.
actors.hero.talent.light_cloak.meta_desc=Если этот талант получит другой герой, он вместо этого увеличит скорость зарядки всех артефактов на 7/13/20% со значениями +1/+2/+3.
actors.hero.talent.light_cloak.title=легкий плащ
actors.hero.talent.light_reading.desc=_+1:_ Жрец может использовать свой священный фолиант, даже если он не экипирован, но он перезаряжается со скоростью _25%_, когда снят с экипировки.\n\n_+2:_ Жрец может использовать свой священный фолиант, даже если он не экипирован, но он перезаряжается со скоростью _50%_, когда снят с экипировки.\n\n_+3:_ Жрец может использовать свой священный фолиант, даже если он не экипирован, но он перезаряжается со скоростью _75%_, когда снят с экипировки.
actors.hero.talent.light_reading.meta_desc=Если этот талант получит другой герой, он вместо этого увеличит скорость перезарядки всех жезлов на 7/13/20% со значениями +1/+2/+3.
actors.hero.talent.light_reading.title=Легкое чтение
actors.hero.talent.lingering_magic.desc=_+1:_ Когда Маг использует жезл или посох, его следующая физическая атака наносит _1-2 дополнительного урона_.\n\n_+2:_ Когда Маг использует жезл или посох, его следующая физическая атака наносит _2 дополнительного урона_.
actors.hero.talent.lingering_magic.title=непреходящая магия
actors.hero.talent.liquid_agility.desc=_+1:_ При употреблении или метании зелья, зелья или эликсира дуэлист получает _3-кратное уклонение_ и _3-кратную точность_ своей следующей атаки ближнего боя в течение 5 ходов.\n\n_+2:_ При употреблении или метании зелья, зелья или эликсира дуэлист получает _бесконечное уклонение_ и _бесконечную точность_ своей следующей атаки ближнего боя в течение 5 ходов.\n\nЭтот бонус действует на один дополнительный ход и атаку при использовании зелий силы, опыта или алхимических предметов, которые должны быть изготовлены с использованием этих зелий.\n\nДля алхимических предметов с большим количеством производимого продукта (например, водного зелья) этот талант может сработать в зависимости от количества произведенного предмета.
actors.hero.talent.liquid_agility.title=жидкая подвижность
actors.hero.talent.liquid_nature.desc=_+1:_ Когда Охотница пьет или бросает зелье, зелье или эликсир, в окружающей области вырастает _до 4 клеток травы_, а соседние враги обездвиживаются на _1 ход_.\n\n_+2:_ Когда Охотница пьет или бросает зелье, зелье или эликсир, в окружающей области вырастает _до 6 клеток травы_, а соседние враги обездвиживаются на _2 хода_.\n\nКоличество травы и длительность обездвиживания удваиваются при использовании зелий силы, опыта или алхимических предметов, которые должны быть созданы с использованием этих зелий.\n\nДля алхимических предметов с большим количеством производимого продукта (например, водного зелья) этот талант может сработать в зависимости от количества произведенного предмета.
actors.hero.talent.liquid_nature.title=жидкая природа
actors.hero.talent.liquid_willpower.desc=_+1:_ Воин получает _6,5% от своего максимального запаса здоровья в виде щита_ при употреблении или броске зелья, зелья или эликсира.\n\n_+2:_ Воин получает _10% от своего максимального запаса здоровья в виде щита_ при употреблении или броске зелья, зелья или эликсира.\n\n Количество щита удваивается при использовании зелий силы, опыта или алхимических предметов, которые должны быть изготовлены с использованием этих зелий.\n\n Для алхимических предметов с большим количеством производимого продукта (например, водного зелья) этот талант может сработать в зависимости от количества произведенного предмета.
actors.hero.talent.liquid_willpower.title=жидкая сила воли
actors.hero.talent.longrange_warp.desc=_+1:_ Теперь Маг может телепортироваться между этажами, затратив _150% заряда_.\n\n_+2:_ Теперь Маг может телепортироваться между этажами, затратив _117% заряда_.\n\n_+3:_ Теперь Маг может телепортироваться между этажами, затратив _83% заряда_.\n\n_+4:_ Теперь Маг может телепортироваться между этажами, затратив _50% заряда_.\n\nМаг не может использовать телепортацию на дальнее расстояние, чтобы покинуть заблокированный этаж.
actors.hero.talent.longrange_warp.title=Дальнобойный варп
actors.hero.talent.mind_form.desc=Жрец может использовать заклинание «Форма разума», которое наделяет Тринити силой жезла или метательного оружия, использованного Жрецом в этом забеге, за 3 заряда. \n\n_+1:_ При использовании «Тринити» Жрец использует эффект разряда или броска выбранного предмета, как если бы это был _+3._\n\n_+2:_ При использовании «Тринити» Жрец использует эффект разряда или броска выбранного предмета, как если бы это был _+4._\n\n_+3:_ При использовании «Тринити» Жрец использует эффект разряда или броска выбранного предмета, как если бы это был _+5._\n\n_+4:_ При использовании «Тринити» Жрец использует эффект разряда или броска выбранного предмета, как если бы Это было _+6._\n\nТроица может быть наделена только одним воздействием на разум за раз.
actors.hero.talent.mind_form.title=форма разума
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Священник может использовать заклинание «Мнемоническая молитва», которое продлевает действие положительных/отрицательных эффектов на союзника/врага на _3 хода_ за 1 заряд. _+2:_ Священник может использовать заклинание «Мнемоническая молитва», которое продлевает действие положительных/отрицательных эффектов на союзника/врага на _4 хода_ за 1 заряд. _+3:_ Священник может использовать заклинание «Мнемоническая молитва», которое продлевает действие положительных/отрицательных эффектов на союзника/врага на _5 ходов_ за 1 заряд. _+3:_ Священник может использовать заклинание «Мнемоническая молитва», которое продлевает действие положительных/отрицательных эффектов на союзника/врага на _5 ходов_ за 1 заряд. _+4: _Мнемоническая молитва применяется мгновенно. Мнемоническая молитва может продлить действие определенного баффа/дебаффа только один раз и не может продлить действие баффов от способностей брони.
actors.hero.talent.mnemonic_prayer.title=мнемоническая молитва
actors.hero.talent.monastic_vigor.desc=_+1:_ Если у монаха _100% энергии_, его способности усиливаются.\n\n_+2:_ Если у монаха _80% или более энергии_, его способности усиливаются.\n\n_+3:_ Если у монаха _60% или более энергии_, его способности усиливаются.\n\n При усилении:\n - Шквал накладывает зачарование вашего оружия.\n - Фокус срабатывает мгновенно.\n - Рывок получает +4 к дальности.\n - Удар дракона наносит +50% урона и применяет эффект отбрасывания и оглушения ко всем соседним врагам.\n - Медитация медленно восстанавливает 20% недостающего здоровья и дает 80% сопротивления урону.
actors.hero.talent.monastic_vigor.title=монашеская сила
actors.hero.talent.mystical_charge.desc=_+1:_ Удар посохом дает боевому магу _0,5 ходов_ перезарядки артефакта.\n\n_+2:_ Удар посохом дает боевому магу _1 ход_ перезарядки артефакта.\n\n_+3:_ Удар посохом дает боевому магу _1,5 ходов_ перезарядки артефакта.
actors.hero.talent.mystical_charge.title=мистический заряд
actors.hero.talent.mystical_meal.desc=_+1:_ Приём пищи занимает 1 ход Разбойника (пайки съедаются мгновенно) и даёт ему _3 хода перезарядки артефакта_.\n\n_+2:_ Приём пищи занимает 1 ход Разбойника (пайки съедаются мгновенно) и даёт ему _5 ходов перезарядки артефакта_.\n\nЭтот талант нельзя использовать для перезарядки Рога изобилия.
actors.hero.talent.mystical_meal.title=мистическая трапеза
actors.hero.talent.natures_aid.desc=_+1:_ Охотница получает 0-2 брони из коры деревьев, которая исчезает каждые _3 хода_, когда в ее поле зрения активируется эффект растения.\n\n_+2:_ Охотница получает 0-2 брони из коры деревьев, которая исчезает каждые _5 ходов_, когда в ее поле зрения активируется эффект растения.
actors.hero.talent.natures_aid.title=помощь природы
actors.hero.talent.natures_bounty.desc=_+1:_ Охотница может найти _4 ягоды_, спрятанные в высокой траве, исследуя следующие несколько этажей подземелья.\n\n_+2:_ Охотница может найти _6 ягод_, спрятанные в высокой траве, исследуя следующие несколько этажей подземелья.\n\nЯгоды съедаются быстро, восстанавливают небольшое чувство сытости и могут содержать пригодное для использования семя.
actors.hero.talent.natures_bounty.title=дары природы
actors.hero.talent.natures_wrath.desc=_+1:_ Пока действует сила природы, выстрелы из духовного лука имеют _8% шанс_ вызвать случайный эффект вредного растения.\n\n_+2:_ Пока действует сила природы, выстрелы из духовного лука имеют _17% шанс_ вызвать случайный эффект вредного растения.\n\n_+3:_ Пока действует сила природы, выстрелы из духовного лука имеют _25% шанс_ вызвать случайный эффект вредного растения.\n\n_+4:_ Пока действует сила природы, выстрелы из духовного лука имеют _33% шанс_ вызвать случайный эффект вредного растения.\n\nРастения, которые могут вызвать эффект: слепая трава, огненный цветок, ледяная шапка, скорбный мох и штормовая лоза.
actors.hero.talent.natures_wrath.title=гнев природы
actors.hero.talent.necromancers_minions.desc=_+1:_ Когда враг с меткой души умирает, у Чернокнижника есть _13% шанс_ воскресить его в виде оскверненного призрака.\n\n_+2:_ Когда враг с меткой души умирает, у Чернокнижника есть _27% шанс_ воскресить его в виде оскверненного призрака.\n\n_+3:_ Когда враг с меткой души умирает, у Чернокнижника есть _40% шанс_ воскресить его в виде оскверненного призрака.
actors.hero.talent.necromancers_minions.title=Приспешники некроманта
actors.hero.talent.patient_strike.desc=_+1:_ Если дуэлистка подождет, прежде чем совершить рукопашную атаку, она нанесет _1-2 дополнительных урона_.\n\n_+2:_ Если дуэлистка подождет, прежде чем совершить рукопашную атаку, она нанесет _2 дополнительных урона_.
actors.hero.talent.patient_strike.title=забастовка пациентов
actors.hero.talent.perfect_copy.desc=_+1:_ Теневой клон получает _10%_ от максимального запаса здоровья героя и может мгновенно поменяться местами с героем на расстоянии до _1 клетки_.\n\n_+2:_ Теневой клон получает _20%_ от максимального запаса здоровья героя и может мгновенно поменяться местами с героем на расстоянии до _2 клеток_.\n\n_+3:_ Теневой клон получает _30%_ от максимального запаса здоровья героя и может мгновенно поменяться местами с героем на расстоянии до _3 клеток_.\n\n_+4:_ Теневой клон получает _40%_ от максимального запаса здоровья героя и может мгновенно поменяться местами с героем на расстоянии до _4 клеток_.
actors.hero.talent.perfect_copy.title=идеальная копия
actors.hero.talent.point_blank.desc=_+1:_ При использовании лука или метательного оружия в ближнем бою точность снижается на _-25% вместо -50%._+2:_ При использовании лука или метательного оружия в ближнем бою точность снижается на _обычную_ вместо -50%._+3:_ При использовании лука или метательного оружия в ближнем бою точность снижается на _+25% вместо -50%._Обратите внимание, что метательное оружие или духовный лук всегда имеют +50% точности при использовании на расстоянии.
actors.hero.talent.point_blank.title=в упор
actors.hero.talent.precise_assault.desc=_+1:_ Когда дуэлист использует способность оружия, она получает _удвоенную точность_ своей следующей рукопашной атаки в течение 5 ходов.\n\n_+2:_ Когда дуэлист использует способность оружия, она получает _пятикратную точность_ своей следующей рукопашной атаки в течение 5 ходов.\n\n_+3:_ Когда дуэлист использует способность оружия, она получает _бесконечную точность_ своей следующей рукопашной атаки в течение 5 ходов.
actors.hero.talent.precise_assault.meta_desc=Если этот талант получит другой герой, он увеличит точность ближнего боя на 10% при +1, на 20% при +2 или на 30% при +3.
actors.hero.talent.precise_assault.title=точный штурм
actors.hero.talent.projectile_momentum.desc=_+1:_ Во время паркура Фрираннер получает +50% к точности и +15% к урону_ от метательного оружия._+2:_ Во время паркура Фрираннер получает +100% к точности и +30% к урону_ от метательного оружия._+3:_ Во время паркура Фрираннер получает +150% к точности и +45% к урону_ от метательного оружия.
actors.hero.talent.projectile_momentum.title=импульс снаряда
actors.hero.talent.projecting_blades.desc=_+1:_ Спектральные клинки имеют точность +25% и могут пробивать до 2 твердых клеток._+2:_ Спектральные клинки имеют точность +50% и могут пробивать до 4 твердых клеток._+3:_ Спектральные клинки имеют точность +75% и могут пробивать до 6 твердых клеток._+4:_ Спектральные клинки имеют точность +100% и могут пробивать до 8 твердых клеток.
actors.hero.talent.projecting_blades.title=выступающие лопасти
actors.hero.talent.protective_shadows.desc=_+1:_ Разбойник получает один щит _каждый второй ход_, когда он невидим, _максимум 3_.\n\n_+2:_ Разбойник получает один щит _каждый ход_, когда он невидим, _максимум 5_.
actors.hero.talent.protective_shadows.title=защитные тени
actors.hero.talent.provoked_anger.desc=_+1:_ Когда любой защитный эффект, наложенный на Воина, прерывается уроном, его следующая физическая атака нанесет _3 дополнительных урона_.\n\n_+2:_ Когда любой защитный эффект, наложенный на Воина, прерывается уроном, его следующая физическая атака нанесет _5 дополнительных уронов_.
actors.hero.talent.provoked_anger.title=вызвал гнев
actors.hero.talent.ratforcements.desc=_+1:_ Использование способности «Крысоподобие» на себе порождает 1 союзную сумчатую крысу рядом с вами.\n\n_+2:_ Использование способности «Крысоподобие» на себе порождает 2 союзные сумчатые крысы рядом с вами.\n\n_+3:_ Использование способности «Крысоподобие» на себе порождает 3 союзные сумчатые крысы рядом с вами.\n\n_+4:_ Использование способности «Крысоподобие» на себе порождает 4 союзные сумчатые крысы рядом с вами.
actors.hero.talent.ratforcements.title=крысиные силы
actors.hero.talent.ratlomacy.desc=_+1:_ Использование способности «Крысиная трансформация» на превращенном во врага делает его дружелюбным и делает трансформацию постоянной.\n\n_+2:_ Использование способности «Крысиная трансформация» на превращенном во врага делает его дружелюбным, делает трансформацию постоянной и дает ему _2 хода_ адреналина.\n\n_+3:_ Использование способности «Крысиная трансформация» на превращенном во врага делает его дружелюбным, делает трансформацию постоянной и дает ему _4 хода_ адреналина.\n\n_+4:_ Использование способности «Крысиная трансформация» на превращенном во врага делает его дружелюбным, делает трансформацию постоянной и дает ему _6 ходов_ адреналина.
actors.hero.talent.ratlomacy.title=ратломация
actors.hero.talent.ratsistance.desc=_+1:_ Враждебные крысоподобные враги наносят _-10% урона_.\n\n_+2:_ Враждебные крысоподобные враги наносят _-19% урона_.\n\n_+3:_ Враждебные крысоподобные враги наносят _-27% урона_.\n\n_+4:_ Враждебные крысоподобные враги наносят _-35% урона_.
actors.hero.talent.ratsistance.title=крысоустойчивость
actors.hero.talent.reactive_barrier.desc=_+1:_ Маг получает _2,5 щита_ за каждого персонажа, пораженного элементальным взрывом, максимум 5 персонажей.\n\n_+2:_ Маг получает _5 щита_ за каждого персонажа, пораженного элементальным взрывом, максимум 6 персонажей.\n\n_+3:_ Маг получает _7,5 щита_ за каждого персонажа, пораженного элементальным взрывом, максимум 7 персонажей.\n\n_+4:_ Маг получает _10 щита_ за каждого персонажа, пораженного элементальным взрывом, максимум 8 персонажей.
actors.hero.talent.reactive_barrier.title=реактивный барьер
actors.hero.talent.recall_inscription.desc=_+1:_ Жрец может использовать заклинание «Возврат надписи», которое позволяет повторить эффект последнего использованного рунного камня или свитка в течение _10 ходов._\n\n_+2:_ Жрец может использовать заклинание «Возврат надписи», которое позволяет повторить эффект последнего использованного рунного камня или свитка в течение _300 ходов._\n\n «Возврат надписи» нельзя использовать со свитками улучшения. Стоимость заряда этого заклинания варьируется в зависимости от того, какой предмет был использован недавно: 2 для рунного камня, 3 для свитка, 4 для экзотического свитка. Эта стоимость заряда также удваивается при использовании со свитком трансмутации или алхимическими предметами, которые должны быть созданы с помощью трансмутации или улучшения.
actors.hero.talent.recall_inscription.meta_desc=Если этот талант получен другим героем, то вместо этого он вернет стоимость любого свитка или рунного камня в 10% случаев при +1 или в 15% случаев при +2. Свитки улучшения не подпадают под действие этого эффекта.
actors.hero.talent.recall_inscription.refunded=Вам вернули деньги за товар!
actors.hero.talent.recall_inscription.title=напоминание о надписи
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Когда Охотница наступает на короткую траву или тлеющие угли, они вырастают в высокую траву, которую Охотница немедленно взбивает в борозды. Время восстановления — 10 ходов._+2:_ Когда Охотница наступает на короткую траву или тлеющие угли, они вырастают в высокую траву, которую Охотница немедленно взбивает в борозды. Время восстановления — 5 ходов._+2 Этот талант будет создавать взбитую траву, если пассивные эффекты регенерации отключены или герой долгое время не получал опыта.
actors.hero.talent.rejuvenating_steps.title=омолаживающие шаги
actors.hero.talent.remote_beacon.desc=_+1:_ Маг может разместить маяк в любом месте в пределах _4 клеток_.\n\n_+2:_ Маг может разместить маяк в любом месте в пределах _8 клеток_.\n\n_+3:_ Маг может разместить маяк в любом месте в пределах _12 клеток_.\n\n_+4:_ Маг может разместить маяк в любом месте в пределах _16 клеток_.\n\nМаг не может размещать маяки в недоступных местах.
actors.hero.talent.remote_beacon.title=Удаленный маяк
actors.hero.talent.rogues_foresight.desc=_+1:_ Когда Разбойник находится на уровне с секретной комнатой, у него есть _75% шанс заметить_, что уровень содержит секрет._+2:_ Когда Разбойник находится на уровне с секретной комнатой, у него есть _100% шанс заметить_, что уровень содержит секрет.
actors.hero.talent.rogues_foresight.title=предвидение мошенника
actors.hero.talent.runic_transference.desc=_+1:_ Сломанная печать Воина может передавать _обычные глифы_ так же, как и улучшения.\n\n_+2:_ Сломанная печать Воина может передавать _обычные, мощные и проклятые глифы_ так же, как и улучшения.\n\nПечать может передавать глифы только в том случае, если они были применены к доспехам, когда печать была прикреплена.
actors.hero.talent.runic_transference.meta_desc=Если этот талант получит другой герой, он поможет глифам на вашей броне противостоять удалению свитками улучшения. Глифы начнут теряться при улучшении с 6-го уровня (с 4-го) на +1 или с 7-го уровня (с 4-го) на +2. Уровень, на котором гарантированно теряются глифы, остается неизменным на +8.
actors.hero.talent.runic_transference.title=рунический перенос
actors.hero.talent.satiated_spells.desc=_+1:_ При употреблении пищи жрец получает _3 щита_ при следующем применении заклинания.\n\n_+2:_ При употреблении пищи жрец получает _5 щита_ при следующем применении заклинания.
actors.hero.talent.satiated_spells.meta_desc=Если этот талант получит другой герой, он вместо этого немедленно предоставит щит, который начнет уменьшаться обычным образом через 10 ходов.
actors.hero.talent.satiated_spells.title=Насыщенные заклинания
actors.hero.talent.scholars_intuition.desc=_+1:_ Маг распознает волшебные палочки в 3 раза быстрее._+2:_ Маг распознает волшебные палочки, когда использует их.
actors.hero.talent.scholars_intuition.title=интуиция учёного
actors.hero.talent.searing_light.desc=+1: Физические атаки жреца по врагам, освещенным «Путеводным светом», наносят +3 урона. +2: Физические атаки жреца по врагам, освещенным «Путеводным светом», наносят +5 урона.
actors.hero.talent.searing_light.meta_desc=Если этот талант получен другим героем, то бонус к урону будет начисляться после использования жезла или артефакта на враге, с перезарядкой в 20 ходов.
actors.hero.talent.searing_light.title=Обжигающий свет
actors.hero.talent.seer_shot.desc=_+1:_ Когда Охотница выпускает стрелу в землю, она дает обзор в области 3x3 вокруг себя на _5 ходов_. Время восстановления — 20 ходов. _+2:_ Когда Охотница выпускает стрелу в землю, она дает обзор в области 3x3 вокруг себя на _10 ходов_. Время восстановления — 20 ходов. _+3:_ Когда Охотница выпускает стрелу в землю, она дает обзор в области 3x3 вокруг себя на _15 ходов_. Время восстановления — 20 ходов.
actors.hero.talent.seer_shot.meta_desc=Если этот талант получит другой герой, он активируется при использовании любого метательного оружия.
actors.hero.talent.seer_shot.title=провидческий выстрел
actors.hero.talent.shadow_blade.desc=_+1:_ Теневой клон получает _8%_ от урона героя за ход и имеет _25% шанс_ использовать зачарование на оружии героя.\n\n_+2:_ Теневой клон получает _16%_ от урона героя за ход и имеет _50% шанс_ использовать зачарование на оружии героя.\n\n_+3:_ Теневой клон получает _24%_ от урона героя за ход и имеет _75% шанс_ использовать зачарование на оружии героя.\n\n_+4:_ Теневой клон получает _32%_ от урона героя за ход и имеет _100% шанс_ использовать зачарование на оружии героя Оружие героя.
actors.hero.talent.shadow_blade.title=теневой клинок
actors.hero.talent.shadow_step.desc=_+1:_ Если разбойник использует дымовую шашку, будучи невидимым, эффект срабатывает мгновенно и имеет _16% сниженную_ стоимость заряда, но при этом не ослепляет врагов и не активирует другие таланты.\n\n_+2:_ Если разбойник использует дымовую шашку, будучи невидимым, эффект срабатывает мгновенно и имеет _30% сниженную_ стоимость заряда, но при этом не ослепляет врагов и не активирует другие таланты.\n\n_+3:_ Если разбойник использует дымовую шашку, будучи невидимым, эффект срабатывает мгновенно и имеет _41% сниженную_ стоимость заряда, но при этом не ослепляет врагов и не активирует другие таланты.\n\n_+4:_ Если разбойник использует дымовую шашку, будучи невидимым, эффект срабатывает мгновенно и имеет _50% сниженную_ стоимость заряда, но при этом не ослепляет врагов и не активирует другие таланты.
actors.hero.talent.shadow_step.title=теневой шаг
actors.hero.talent.shared_enchantment.desc=_+1:_ Метательное оружие имеет _33% шанс_ применить зачарование, наложенное на снайперский лук.\n\n_+2:_ Метательное оружие имеет _67% шанс_ применить зачарование, наложенное на снайперский лук.\n\n_+3:_ Метательное оружие имеет _100% шанс_ применить зачарование, наложенное на снайперский лук.\n\nЗачарование лука может сработать в дополнение к тому зачарованию, которое уже есть у метательного оружия.
actors.hero.talent.shared_enchantment.title=общее очарование
actors.hero.talent.shared_upgrades.desc=_+1:_ Когда Снайпер атакует улучшенным метательным оружием, каждый уровень увеличивает длительность метки снайпера на 1 ход и урон от её особой атаки на 16%, до максимума в _2 хода и +33% урона при +2_.\n\n_+2:_ Когда Снайпер атакует улучшенным метательным оружием, каждый уровень увеличивает длительность метки снайпера на 1 ход и урон от её особой атаки на 16%, до максимума в _4 хода и +67% урона при +4_.\n\n_+3:_ Когда Снайпер атакует улучшенным метательным оружием, каждый уровень увеличивает длительность метки снайпера на 1 ход и урон от её особой атаки на 16%, до максимума в _6 ходов и +100% урона при +6_.
actors.hero.talent.shared_upgrades.title=общие обновления
actors.hero.talent.shield_battery.desc=_+1:_ Маг может нацелить на себя жезл, чтобы преобразовать все свои заряды в щит со скоростью _4% от максимального запаса здоровья за заряд_.\n\n_+2:_ Маг может нацелить на себя жезл, чтобы преобразовать все свои заряды в щит со скоростью _6% от максимального запаса здоровья за заряд_.
actors.hero.talent.shield_battery.title=батарея щита
actors.hero.talent.shield_of_light.desc=_+1:_ Жрец может использовать заклинание «Щит Света», которое применяется мгновенно и дает ему _2-4 брони_ против цели на 5 ходов за 1 заряд._+2:_ Жрец может использовать заклинание «Щит Света», которое применяется мгновенно и дает ему _3-6 брони_ против цели на 5 ходов за 1 заряд.
actors.hero.talent.shield_of_light.meta_desc=Если этот талант получает другой герой, он вместо этого уменьшит получаемый от целевого врага физический урон на 1, в 33% случаев при +1 или в 50% случаев при +2.
actors.hero.talent.shield_of_light.title=щит света
actors.hero.talent.shielding_dew.desc=_+1:_ Капли росы могут защитить Стража, когда её здоровье полностью восстановлено, до _20% от её максимального HP_.\n\n_+2:_ Капли росы могут защитить Стража, когда её здоровье полностью восстановлено, до _40% от её максимального HP_.\n\n_+3:_ Капли росы могут защитить Стража, когда её здоровье полностью восстановлено, до _60% от её максимального HP_.
actors.hero.talent.shielding_dew.title=защитная роса
actors.hero.talent.shock_force.desc=_+1:_ Ударная волна наносит на _20% больше урона_ и имеет _25% шанс_ оглушить вместо обездвижить.\n\n_+2:_ Ударная волна наносит на _40% больше урона_ и имеет _50% шанс_ оглушить вместо обездвижить.\n\n_+3:_ Ударная волна наносит на _60% больше урона_ и имеет _75% шанс_ оглушить вместо обездвижить.\n\n_+4:_ Ударная волна наносит на _80% больше урона_ и имеет _100% шанс_ оглушить вместо обездвижить.
actors.hero.talent.shock_force.title=ударная сила
actors.hero.talent.shrug_it_off.desc=_+1:_ Снижение урона, наносимого Воином во время действия эффекта, _увеличено до 60%_ с 50%.\n\n_+2:_ Снижение урона, наносимого Воином во время действия эффекта, _увеличено до 68%_ с 50%.\n\n_+3:_ Снижение урона, наносимого Воином во время действия эффекта, _увеличено до 74%_ с 50%.\n\n_+4:_ Снижение урона, наносимого Воином во время действия эффекта, _увеличено до 80%_ с 50%.
actors.hero.talent.shrug_it_off.title=пожать плечами
actors.hero.talent.silent_steps.desc=_+1:_ Разбойник не разбудит спящих врагов, если находится на расстоянии _3 или более клеток от них_.\n\n_+2:_ Разбойник не разбудит спящих врагов, если не находится рядом с ними_.
actors.hero.talent.silent_steps.title=тихие шаги
actors.hero.talent.soul_eater.desc=_+1:_ Метка души дает _0,33 хода_ насыщения за каждый нанесенный физический урон. У врагов с меткой души есть _10% шанс_ активировать эффекты при еде после смерти._+2:_ Метка души дает _0,67 хода_ насыщения за каждый нанесенный физический урон. У врагов с меткой души есть _20% шанс_ активировать эффекты при еде после смерти._+3:_ Метка души дает _1 ход_ насыщения за каждый нанесенный физический урон. У врагов с меткой души есть _30% шанс_ активировать эффекты при еде после смерти.
actors.hero.talent.soul_eater.title=пожиратель душ
actors.hero.talent.soul_siphon.desc=_+1:_ Физический урон, наносимый другими персонажами, активирует метку души Чернокнижника с эффективностью _13%_.\n\n_+2:_ Физический урон, наносимый другими персонажами, активирует метку души Чернокнижника с эффективностью _27%_.\n\n_+3:_ Физический урон, наносимый другими персонажами, активирует метку души Чернокнижника с эффективностью _40%_.
actors.hero.talent.soul_siphon.title=поглотитель души
actors.hero.talent.speedy_stealth.desc=_+1:_ Фрираннер получает 2 стака импульса за ход, пока он невидим.\n\n_+2:_ В дополнение к преимуществам +1, обратный отсчет времени паркура прекращается, пока фрираннер невидим.\n\n_+3:_ В дополнение к преимуществам +1 и +2, фрираннер движется со скоростью в 2 раза выше, пока невидим, независимо от того, находится ли он в режиме паркура или нет.
actors.hero.talent.speedy_stealth.title=быстрая скрытность
actors.hero.talent.spirit_blades.desc=_+1:_ У Призрачных клинков есть _30% шанс_ также использовать зачарование на луке духа.\n\n_+2:_ У Призрачных клинков есть _60% шанс_ также использовать зачарование на луке духа.\n\n_+3:_ У Призрачных клинков есть _90% шанс_ также использовать зачарование на луке духа.\n\n_+4:_ У Призрачных клинков есть _100% шанс_ также использовать зачарование на луке духа, и каждое зачарование дает _+10% силы_.
actors.hero.talent.spirit_blades.title=духовные клинки
actors.hero.talent.spirit_form.desc=Жрец может использовать заклинание «Духовная форма», которое наделяет Тринити силой кольца или артефакта, который Жрец определил в этом прохождении (кроме священного тома), за 4 заряда. \n\n_+1:_ При использовании Тринити Жрец получит эффект кольца со значением _+1_ на 20 ходов или активирует эффект артефакта со значением _+4._\n\n_+2:_ При использовании Тринити Жрец получит эффект кольца со значением _+2_ на 20 ходов или активирует эффект артефакта со значением _+6._\n\n_+3:_ При использовании Тринити Жрец получит эффект кольца со значением _+3_ на 20 ходов или активирует эффект артефакта со значением _+8._\n\n_+4:_ При использовании «Троицы» жрец получит эффект кольца со значением _+4_ на 20 ходов или активирует эффект артефакта со значением _+10._\n\n «Троица» может быть наделена только одним духовным эффектом за раз. Артефакты имеют различные эффекты и стоимость зарядов брони при активации «Троицы».
actors.hero.talent.spirit_form.title=духовная форма
actors.hero.talent.stasis.desc=Жрец может наложить заклинание «Стазис» на усиленного союзника за 2 заряда. Стазис временно удаляет союзника из подземелья и сохраняет оставшееся время действия всех баффов, включая «Силу многих». Союзник появится рядом с вами, когда действие эффекта закончится. Стазис можно мгновенно и бесплатно повторно применить, чтобы досрочно завершить эффект. Стазис действует на неподвижных союзников, но не может перемещать их между этажами подземелья. \n\n_+1: Стазис длится максимум 60 ходов._\n\n_+2: Стазис длится максимум 90 ходов._\n\n_+3: Стазис длится максимум 120 ходов._\n\n_+4: Стазис длится максимум 150 ходов._\n\n Жрец также может использовать «Лучевое излучение», когда союзник находится в стазисе, чтобы призвать его снова, или использовать «Жизненную связь», чтобы превентивно применить её эффект. Однако союзники не получают выгоды от «Жизненной связи», находясь в стазисе.
actors.hero.talent.stasis.title=стазис
actors.hero.talent.strengthening_meal.desc=_+1:_ Употребление пищи дает Дуэлистке 3 бонусных единицы урона в следующие _2 раза_, когда она поразит врага физической атакой.\n\n_+2:_ Употребление пищи дает Дуэлистке 3 бонусных единицы урона в следующие _3 раза_, когда она поразит врага физической атакой.
actors.hero.talent.strengthening_meal.title=укрепляющее питание
actors.hero.talent.striking_force.desc=_+1:_ Сила эффекта элементального удара увеличена на _30%_.\n\n_+2:_ Сила эффекта элементального удара увеличена на _60%_.\n\n_+3:_ Сила эффекта элементального удара увеличена на _90%_.\n\n_+4:_ Сила эффекта элементального удара увеличена на _120%_.
actors.hero.talent.striking_force.title=ударная сила
actors.hero.talent.striking_wave.desc=_+1:_ У Шоквейва есть _30% шанс_ также использовать эффекты при попадании, такие как зачарования и комбо.\n\n_+2:_ У Шоквейва есть _60% шанс_ также использовать эффекты при попадании, такие как зачарования и комбо.\n\n_+3:_ У Шоквейва есть _90% шанс_ также использовать эффекты при попадании, такие как зачарования и комбо.\n\n_+4:_ У Шоквейва есть _100% шанс_ также использовать эффекты при попадании, такие как зачарования и комбо, и он дает зачарованиям _+20% силы_.
actors.hero.talent.striking_wave.title=впечатляющая волна
actors.hero.talent.strongman.desc=_+1:_ Сила Воина _увеличена на 8%_, округлено в меньшую сторону.\n\n_+2:_ Сила Воина _увеличена на 13%_, округлено в меньшую сторону.\n\n_+3:_ Сила Воина _увеличена на 18%_, округлено в меньшую сторону.
actors.hero.talent.strongman.title=силач
actors.hero.talent.sucker_punch.desc=_+1:_ Разбойник наносит _1-2 дополнительного урона_ при первой внезапной атаке врага.\n\n_+2:_ Разбойник наносит _2 дополнительного урона_ при первой внезапной атаке врага.
actors.hero.talent.sucker_punch.title=запрещенный прием
actors.hero.talent.sunray.desc=_+1:_ Жрец может использовать заклинание «Солнечный луч», которое наносит _4-8 урона_ и ослепляет цель на _4 хода_, затрачивая 1 заряд._+2:_ Жрец может использовать заклинание «Солнечный луч», которое наносит _6-12 урона_ и ослепляет цель на _6 ходов_, затрачивая 1 заряд._Солнечный луч может ослепить каждую цель только один раз, но если цель уже ослеплена «Солнечным лучом», то вместо ослепления он парализует. «Солнечный луч» всегда наносит максимальный урон демоническим и немертвым врагам.
actors.hero.talent.sunray.meta_desc=Если этот талант получит другой герой, то вместо этого жезлы и артефакты будут ослеплять врагов на 4 хода, в 15% случаев при +1 или в 25% случаев при +2.
actors.hero.talent.sunray.title=солнечный луч
actors.hero.talent.survivalists_intuition.desc=_+1:_ Охотница распознает метательное оружие в 3 раза быстрее._+2:_ Охотница распознает метательное оружие, когда наносит удар.
actors.hero.talent.survivalists_intuition.title=интуиция выживальщика
actors.hero.talent.sustained_retribution.desc=_+1:_ Воин наносит _115% дополнительного урона_, распределенного на _2 удара_, вместо 100% дополнительного урона за 1 удар.\n\n_+2:_ Воин наносит _130% дополнительного урона_, распределенного на _3 удара_, вместо 100% дополнительного урона за 1 удар.\n\n_+3:_ Воин наносит _145% дополнительного урона_, распределенного на _4 удара_, вместо 100% дополнительного урона за 1 удар.\n\n_+4:_ Воин наносит _160% дополнительного урона_, распределенного на _5 ударов_, вместо 100% дополнительного урона за 1 удар.
actors.hero.talent.sustained_retribution.title=устойчивое возмездие
actors.hero.talent.swift_equip.desc=_+1:_ Дуэлист может мгновенно менять экипированное оружие _один раз_ каждые 20 ходов.\n\n_+2:_ Дуэлист может мгновенно менять экипированное оружие _два раза_ каждые 20 ходов.\n\nЕсли у Дуэлиста есть этот талант, и он не находится на перезарядке, быстрое использование неэкипированного оружия экипирует его.
actors.hero.talent.swift_equip.title=быстрое снаряжение
actors.hero.talent.swift_spirit.desc=_+1:_ Скорость передвижения духовного ястреба увеличена с 2 до 2,5 клеток, и ему гарантировано уклонение от первых 2 атак, направленных против него.\n\n_+2:_ Скорость передвижения духовного ястреба увеличена с 2 до 3 клеток, и ему гарантировано уклонение от первых 4 атак, направленных против него.\n\n_+3:_ Скорость передвижения духовного ястреба увеличена с 2 до 3,5 клеток, и ему гарантировано уклонение от первых 6 атак, направленных против него.\n\n_+4:_ Скорость передвижения духовного ястреба увеличена с 2 до 4 клеток, и ему гарантировано уклонение от первых 8 атак, направленных против него.
actors.hero.talent.swift_spirit.title=быстрый дух
actors.hero.talent.telefrag.desc=_+1:_ Если Маг телепортируется в другого персонажа, он наносит ему _10-15 урона_, но также получает _5 урона_.\n\n_+2:_ Если Маг телепортируется в другого персонажа, он наносит ему _20-30 урона_, но также получает _10 урона_.\n\n_+3:_ Если Маг телепортируется в другого персонажа, он наносит ему _30-45 урона_, но также получает _15 урона_.\n\n_+4:_ Если Маг телепортируется в другого персонажа, он наносит ему _40-60 урона_, но также получает _20 урона_.\n\nГероя нельзя убить этим талантом, урон самому себе может быть уменьшен эффектами сопротивления магии.
actors.hero.talent.telefrag.title=Телефраг
actors.hero.talent.thiefs_intuition.desc=_+1:_ Разбойник определяет кольца в 2 раза быстрее и определяет тип кольца, когда надевает его._+2:_ Разбойник определяет кольца, когда надевает их, и определяет тип кольца, когда подбирает его.
actors.hero.talent.thiefs_intuition.title=воровская интуиция
actors.hero.talent.twin_upgrades.desc=_+1:_ Если одно из двух экипированных оружий Чемпиона имеет более низкий уровень и на _2 или более уровней ниже_, чем другое оружие, оно будет повышено до уровня другого оружия.\n\n_+2:_ Если одно из двух экипированных оружий Чемпиона имеет более низкий уровень и на _1 или более уровней ниже_, чем другое оружие, оно будет повышено до уровня другого оружия.\n\n_+3:_ Если одно из двух экипированных оружий Чемпиона имеет более низкий уровень и на _тот же или более уровней_, чем другое оружие, оно будет повышено до уровня другого оружия.
actors.hero.talent.twin_upgrades.title=двойные обновления
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Монах получает на 50% больше энергии за каждый предмет экипировки 3-го уровня или ниже, который она использует.\n\n_+2:_ Монах получает на 75% больше энергии за каждый предмет экипировки 2-го уровня или ниже, который она использует. Преимущество 3-го уровня остается неизменным.\n\n_+3:_ Монах получает на 100% больше энергии за каждый предмет экипировки 1-го уровня или ниже, который она использует. Преимущество 2-го и 3-го уровней остается неизменным. Она также получает бесплатную тканевую броню и перчатки с шипами.\n\nОбратите внимание, что этот талант не дает никаких преимуществ от безоружного боя или атаки с помощью Кольца Силы.
actors.hero.talent.unencumbered_spirit.title=свободный дух
actors.hero.talent.varied_charge.desc=_+1: Чемпион мгновенно восстанавливает _0,17 зарядов оружия_ при использовании двух разных способностей оружия, без ограничения по времени. _+2: Чемпион мгновенно восстанавливает _0,33 зарядов оружия_ при использовании двух разных способностей оружия, без ограничения по времени. _+3: Чемпион мгновенно восстанавливает _0,5 зарядов оружия_ при использовании двух разных способностей оружия, без ограничения по времени.
actors.hero.talent.varied_charge.title=различный заряд
actors.hero.talent.veterans_intuition.desc=_+1:_ Воин распознает оружие в 1,75 раза быстрее и доспехи в 2,5 раза быстрее._+2:_ Воин распознает оружие в 2,5 раза быстрее и доспехи, когда надевает их.
actors.hero.talent.veterans_intuition.title=интуиция ветерана
actors.hero.talent.wall_of_light.desc=_+1:_ Паладин может использовать заклинание «Стена света», которое создает перед ним сплошную стену шириной 3 клетки, отталкивающую врагов и действующую 20 ходов, за 3 заряда._+2:_ Паладин может использовать заклинание «Стена света», которое создает перед ним сплошную стену шириной 5 клеток, отталкивающую врагов и действующую 20 ходов, за 3 заряда._+3:_ Паладин может использовать заклинание «Стена света», которое создает перед ним сплошную стену шириной 7 клеток, отталкивающую врагов и действующую 20 ходов, за 3 заряда._+3 Стена может быть размещена по сторонам света или по диагонали, одновременно может существовать только одна стена. время.
actors.hero.talent.wall_of_light.title=стена света
actors.hero.talent.wand_preservation.desc=_+1:_ Когда Маг наделяет свой посох новой волшебной палочкой, старая палочка возвращается с +0, _но это можно сделать только один раз._\n\n_+2:_ Когда Маг наделяет свой посох новой волшебной палочкой, старая палочка возвращается с +0, _это можно повторить с перезарядкой в один уровень героя._
actors.hero.talent.wand_preservation.meta_desc=Если этот талант получит другой герой, то количество получаемой магической смолы при помещении волшебной палочки в алхимический котел увеличится на 1 при +1 или на 2 при +2.
actors.hero.talent.wand_preservation.title=сохранение палочки
actors.hero.talent.weapon_recharging.desc=_+1:_ Дуэлист получает один заряд оружия каждые _15 ходов_, находясь под действием баффов на перезарядку жезла или артефакта._+2:_ Дуэлист получает один заряд оружия каждые _10 ходов_, находясь под действием баффов на перезарядку жезла или артефакта.
actors.hero.talent.weapon_recharging.meta_desc=Если этот талант получит другой герой, то вместо этого он будет наносить на +5% больше урона в ближнем бою при перезарядке на +1 единицу или на +7,5% больше урона в ближнем бою при перезарядке на +2 единицы.
actors.hero.talent.weapon_recharging.title=перезарядка оружия
actors.hero.talent.wide_search.desc=_+1:_ Радиус поиска Разбойника увеличен с квадрата 5x5 до круга 7x7_.\n\n_+2:_ Радиус поиска Разбойника увеличен с квадрата 5x5 до квадрата 7x7_.
actors.hero.talent.wide_search.meta_desc=Если этот талант получит другой герой, то радиус его поиска увеличится с квадрата 3x3 до круга 5x5 с бонусом +1 или до квадрата 5x5 с бонусом +2.
actors.hero.talent.wide_search.title=широкий поиск
actors.hero.talent.wild_momentum.desc=_+1:_ Убийство врага с помощью духовного лука продлевает действие силы природы на _1 ход_. Длительность может быть увеличена максимум на _2 хода_.\n\n_+2:_ Убийство врага с помощью духовного лука продлевает действие силы природы на _2 хода_. Длительность может быть увеличена максимум на _4 хода_.\n\n_+3:_ Убийство врага с помощью духовного лука продлевает действие силы природы на _3 хода_. Длительность может быть увеличена максимум на _6 ходов_.\n\n_+4:_ Убийство врага с помощью духовного лука продлевает действие силы природы на _4 хода_. Длительность может быть увеличена максимум на _8 ходов_.
actors.hero.talent.wild_momentum.title=бурный импульс
actors.hero.talent.wild_power.desc=_+1:_ При использовании дикой магии волшебные палочки будут усилены на _2 или 3, до +4_.\n\n_+2:_ При использовании дикой магии волшебные палочки будут усилены на _3, до +5_.\n\n_+3:_ При использовании дикой магии волшебные палочки будут усилены на _3 или 4, до +6_.\n\n_+4:_ При использовании дикой магии волшебные палочки будут усилены на _4, до +7_.
actors.hero.talent.wild_power.title=дикая сила
actors.mobs.acidic.desc=Эти огромные, похожие на пауков демонические существа избегают ближнего боя, предпочитая стрелять калечащими зазубренными шипами с большого расстояния. Это существо, похоже, истекает едкой слизью.
actors.mobs.acidic.name=кислый скорпион
actors.mobs.albino.desc=Это редкая порода сумчатых крыс с чисто белой шерстью и острыми зубами.
actors.mobs.albino.discover_hint=Этого врага можно редко встретить в определённом регионе подземелья.
actors.mobs.albino.name=крыса-альбинос
actors.mobs.armoredbrute.desc=Самые старшие гноллы-громилы часто носят мощную броню, чтобы подчеркнуть свой статус. Броня делает этих громил гораздо более устойчивыми к физическим повреждениям, а их более высокая дисциплина позволяет им дольше пребывать в ярости, прежде чем они скончаются от ран.
actors.mobs.armoredbrute.name=бронированный громила
actors.mobs.armoredstatue.desc=Можно подумать, что это просто еще одна из неодушевленных статуй этого подземелья, но ее красные светящиеся глаза выдают ее с потрохом. Судя по доспехам, она, похоже, в отличном состоянии, и убить ее будет очень сложно.
actors.mobs.armoredstatue.desc_arm_wep=Хотя сама статуя сделана из камня, _%1$s_ и _%2$s_, которые она держит, выглядят очень реалистично.
actors.mobs.armoredstatue.name=бронированная статуя
actors.mobs.bandit.desc=Глубокие уровни подземелья всегда служили убежищем для самых разных преступников. Не все из них могли сохранять трезвость ума в течение длительного времени, проведенного вдали от дневного света. Давным-давно эти безумные воры и бандиты забыли, кто они такие и зачем воруют.
actors.mobs.bandit.name=сумасшедший бандит
actors.mobs.bat.desc=Эти энергичные и упорные обитатели пещер гораздо опаснее, чем кажутся. С каждой успешной атакой они восстанавливают здоровье, что позволяет им побеждать гораздо более крупных противников.
actors.mobs.bat.name=вампир
actors.mobs.bee.desc=Несмотря на свой небольшой размер, золотистые пчелы склонны яростно защищать свой дом. Эта очень злая, лучше держитесь от нее подальше.
actors.mobs.bee.desc_honey=Несмотря на свой небольшой размер, золотистые пчелы, как правило, яростно защищают свой дом. Эта пчела успокоилась и, похоже, хочет следовать за вами.
actors.mobs.bee.discover_hint=Этого персонажа можно найти с помощью определённого предмета.
actors.mobs.bee.name=золотая пчела
actors.mobs.brute$bruterage.desc=Этот гнолл-громила умирает, но хочет забрать тебя с собой!\n\nГромила умрет, когда ее щит исчезнет, либо из-за времени, либо из-за повреждений. Тем временем она будет наносить значительно больший урон, так что будьте осторожны!\n\nОставшийся щит: %d.
actors.mobs.brute$bruterage.name=грубая ярость
actors.mobs.brute.def_verb=заблокировано
actors.mobs.brute.desc=Громилы — самые крупные, сильные и выносливые гноллы. Получив тяжёлые раны, они впадают в ярость и наносят врагам ещё больший урон.
actors.mobs.brute.enraged=разъяренный
actors.mobs.brute.name=гнолл-громила
actors.mobs.causticslime.desc=Эта слизь, похоже, осквернена темной магией, исходящей снизу. Она потеряла свой обычный зеленый цвет и истекает едкой жижей.
actors.mobs.causticslime.discover_hint=Этого врага можно редко встретить в определённом регионе подземелья.
actors.mobs.causticslime.name=едкая слизь
actors.mobs.crab.desc=Эти огромные крабы находятся на вершине пищевой цепи в канализации. Они невероятно быстры, а их толстый панцирь способен выдерживать сильные удары.
actors.mobs.crab.name=краб из канализации
actors.mobs.crystalguardian.def_verb=заблокировано
actors.mobs.crystalguardian.desc=Эти огромные кристаллические стражи почти похожи на статуи, если бы не их ярко светящиеся глаза. Затвердевший кристалл, из которого они сделаны, делает их медлительными, но очень выносливыми, поэтому лучше всего оставить их спать в их кристаллическом гнезде как можно дольше. Из-за своих размеров кристаллические стражи будут двигаться гораздо медленнее в замкнутых пространствах. Они также настолько прочны, что их невозможно убить сразу. Их можно избить и временно обездвижить, но через некоторое время они снова встанут.
actors.mobs.crystalguardian.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.crystalguardian.name=кристальный страж
actors.mobs.crystalmimic.ate=Имитатор съел твой %s!
actors.mobs.crystalmimic.desc=Мимики — это магические существа, способные принимать любую форму по своему желанию. В подземельях они почти всегда выбирают форму сундука с сокровищами, чтобы заманить ничего не подозревающих искателей приключений. Кристаллические мимики хитрее своих обычных сородичей и предпочитают избегать конфликтов, воруя добычу. Они попытаются убежать, как только их обнаружат, и обладают способностью менять позицию врагов во время атаки.
actors.mobs.crystalmimic.escaped=Кристаллический имитатор сбежал!
actors.mobs.crystalmimic.name=кристаллический имитатор
actors.mobs.crystalspire.alert=Вибрация нарастает и сотрясает всю пещеру!
actors.mobs.crystalspire.desc=Этот гигантский шпиль из сверхтвердого кристалла, вероятно, является источником всех странных кристаллических существ в этой пещере. Ваше обычное оружие против него неэффективно, поэтому вам понадобится кирка, если вы хотите его разрушить. Убедитесь, что вы готовы, прежде чем начать его разбивать. Добыча такого большого кристалла, вероятно, займет много времени, и вы, скорее всего, не сможете сделать это беспрепятственно. Сам шпиль, возможно, даже имеет какие-то средства защиты. Возможно, атаки самого шпиля можно использовать против его приспешников.
actors.mobs.crystalspire.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.crystalspire.name=хрустальный шпиль
actors.mobs.crystalspire.warning=Кристалл вибрирует при ударе. Если продолжать в том же духе, это обязательно привлечет к вам внимание...
actors.mobs.crystalwisp.beam_kill=Луч света убил тебя...
actors.mobs.crystalwisp.desc=Небольшой, разъяренный, плавающий кусок затвердевшего кристалла, излучающий яркое свечение. Хотя он и не особенно силен, кристаллические сгустки могут выстрелить в вас разрушительным лучом света, если у них есть возможность для выстрела. Кристаллические сгустки достаточно малы, чтобы легко перемещаться сквозь различные кристаллические выступы, но они не способны пробивать их насквозь.
actors.mobs.crystalwisp.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.crystalwisp.name=кристаллический огонек
actors.mobs.demonspawner.desc=Эта извивающаяся масса плоти гномов порождает демонов-потрошителей из гномов, погибших в этом регионе. Очевидно, демоны не видят ничего плохого в том, чтобы использовать все имеющиеся ресурсы против своих врагов. Хотя внешне они ужасающе страшны, создатели демонов не имеют средств передвижения или прямой защиты. Однако их значительная масса затрудняет их быстрое уничтожение, и они будут порождать демонов-потрошителей быстрее, когда им угрожает опасность. Создатели демонов, похоже, связаны с каким-то центральным источником демонической силы. Их убийство может ослабить этот источник.
actors.mobs.demonspawner.name=порождения демонов
actors.mobs.demonspawner.on_death=Похоже, что демоническая энергия здесь ослабевает по мере смерти источника.
actors.mobs.dm100.desc=DM-100 — это ранняя модель гномьих «оборонительных машин», разработанная для защиты гномьих шахтеров в пещерах под этой тюрьмой. Однако их электрические разряды оказались слишком слабыми, и поэтому их подарили человеческому городу наверху. Они годами оставались неиспользованными и в конце концов попали в тюрьму, где начальник тюрьмы сначала посчитал их слишком жестокими для использования. Однако, по мере того как заключенные становились все более непокорными, они стали необходимостью.
actors.mobs.dm100.name=ДМ-100
actors.mobs.dm100.zap_kill=Удар молнии убил тебя...
actors.mobs.dm200.desc=DM-200 — это второе поколение гномьих «оборонительных машин», разработанных для защиты гномьих шахтеров в пещерах и городе под землей. Они намного крупнее и массивнее своих предшественников и атакуют разрушительными гидравлическими кулаками. Увеличение размеров также является их главной слабостью, поскольку они не могут протиснуться в узкие туннели и дверные проемы подземелья. Гномы смогли компенсировать недостаток мобильности DM-200, позволив им выпускать токсичные выхлопные газы на врагов на расстоянии или на врагов, до которых они не могут дотянуться.
actors.mobs.dm200.name=ДМ-200
actors.mobs.dm200.vent=ДМ-200 выпускает струю токсичных выхлопных газов!
actors.mobs.dm201.desc=Гномы ненадолго поэкспериментировали с усилением акцента на низкой мобильности DM-200 и создали несколько моделей DM, которые полностью неподвижны. DM-201 — это модернизированный DM-200, который действует как сторожевая турель, не имеющая возможности передвижения. В обмен на низкую мобильность DM-201 обладают значительно большей прочностью и атакующей мощью. Поскольку у DM-201 нет двигателя для отвода выхлопных газов, гномы оснастили их гранатами с коррозионным газом! Однако DM-201 осторожны с этими гранатами и бросают их только при атаке с расстояния.
actors.mobs.dm201.name=ДМ-201
actors.mobs.dm201.vent=ДМ-201 бросает едкую гранату!
actors.mobs.dm300.charge_lost=Опора линии электропередачи разрушена! Переключение на местное электроснабжение!
actors.mobs.dm300.charging=ПОВРЕЖДЕНИЕ! АКТИВАЦИЯ ЭЛЕКТРОСТАНЦИИ!
actors.mobs.dm300.charging_hint=ДМ-300 неуязвим, пока находится под напряжением от опоры пилона!
actors.mobs.dm300.def_verb=заблокировано
actors.mobs.dm300.defeated=КРИТИЧЕСКИЙ УДАР! ПОПЫТКА ЗАКРЫТЬСЯ!
actors.mobs.dm300.desc=Эту машину дварфы создали несколько столетий назад. Позже они стали заменять машины големами, элементалями и даже демонами. В конце концов это привело их цивилизацию к упадку. DM-300 и подобные машины обычно использовались на стройках и в шахтах, а иногда и для обороны города.
actors.mobs.dm300.desc_supercharged=В данный момент DM-300 полностью заряжен электрической энергией. В таком состоянии DM-300 не может быть поврежден и движется с удвоенной скоростью! Кроме того, его бур теперь вращается достаточно быстро, чтобы _прокладывать туннели сквозь твердую породу_, хотя при этом он движется гораздо медленнее. Атака DM-300 напрямую бессмысленна, пока он находится в состоянии сверхзаряда, но _что-то в этом районе должно обеспечивать его этой энергией_, уничтожение чего-либо может ослабить его.
actors.mobs.dm300.name=ДМ-300
actors.mobs.dm300.notice=ОБНАРУЖЕН НЕУПОЛНОМОЧЕННЫЙ ПЕРСОНАЛ!
actors.mobs.dm300.pylons_destroyed=ВНИМАНИЕ! ОБНАРУЖЕНА НЕУСТОЙЧИВОСТЬ В ЭЛЕКТРОСЕТИ!
actors.mobs.dm300.rankings_desc=Раздавлен ДМ-300
actors.mobs.dm300.shield=DM-300 получает питание от оголённых проводов и экранируется сам собой!
actors.mobs.dm300.supercharged=УНИЧТОЖИТЬ! УНИЧТОЖИТЬ! УНИЧТОЖИТЬ!
actors.mobs.dwarfking$dkghoul.rankings_desc=Пад перед королём гномов
actors.mobs.dwarfking$dkgolem.rankings_desc=Пад перед королём гномов
actors.mobs.dwarfking$dkmonk.rankings_desc=Пад перед королём гномов
actors.mobs.dwarfking$dkwarlock.rankings_desc=Пад перед королём гномов
actors.mobs.dwarfking.defeated=Ты... обрекла нас всех на гибель...
actors.mobs.dwarfking.desc=Много лет назад один из величайших волшебников двора гномов раскрыл секреты, которые даровали ему огромную власть над жизнью и смертью. Вскоре он использовал эту власть, поработив и развратив своих соплеменников, своего короля и, в конце концов, каждого гнома-гражданина. Теперь он король, правитель легиона нежити. Король гномов — агрессивный враг, который попытается окружить и сокрушить своих врагов ордой своих приспешников-нежити.
actors.mobs.dwarfking.enraged=Ты не сможешь меня убить, %s. Я. БЕССМЕРТЕН!
actors.mobs.dwarfking.lifelink_1=Мне нужна твоя сущность, раб!
actors.mobs.dwarfking.lifelink_2=Пролей кровь за меня, раб!
actors.mobs.dwarfking.losing=Нет! Вы не можете этого сделать... вы понятия не имеете, что находится внизу...
actors.mobs.dwarfking.name=Король гномов
actors.mobs.dwarfking.notice=Как ты смеешь! Ты понятия не имеешь, во что вмешиваешься!
actors.mobs.dwarfking.rankings_desc=Пад перед королём гномов
actors.mobs.dwarfking.teleport_1=Разберись с ними, раб!
actors.mobs.dwarfking.teleport_2=Займи их делом, раб!
actors.mobs.dwarfking.wave_1=Довольно! Вставайте, рабы мои!
actors.mobs.dwarfking.wave_2=Ещё! Пролейте кровь за своего короля!
actors.mobs.dwarfking.wave_3=Бесполезные! Убейте их немедленно!
actors.mobs.ebonymimic.desc=Мимики — это магические существа, способные принимать любую форму по своему желанию. В подземельях они почти всегда выбирают форму сундука с сокровищами, чтобы заманить ничего не подозревающих искателей приключений. Эбеновые мимики — это скрытные существа, способные становиться практически невидимыми. Они прячутся на предметах, с которыми искатели приключений могут взаимодействовать, но и сами могут нести добычу. После обнаружения они не сильнее обычных мимиков, но их внезапный укус может быть очень опасным.
actors.mobs.ebonymimic.discover_hint=Этого врага можно найти с помощью определённого амулета.
actors.mobs.ebonymimic.hidden_desc=Кажется, здесь что-то есть, но это практически совершенно незаметно.
actors.mobs.ebonymimic.hidden_name=подозрительный контур
actors.mobs.ebonymimic.name=имитация черного дерева
actors.mobs.ebonymimic.reveal=Там был мимик!
actors.mobs.elemental$chaoselemental.desc=Элементали — это хаотичные существа, которые часто создаются, когда мощная оккультная магия не контролируется должным образом. Элементали обладают минимальным интеллектом и обычно связаны с определённым типом магии. Хаотические элементали — это редкие и опасные элементали, которые не стабилизировались в определённой стихии. При атаке они высвобождают дикую, непредсказуемую магию.
actors.mobs.elemental$chaoselemental.name=стихийный хаос
actors.mobs.elemental$fireelemental.desc=Элементали — это хаотичные существа, которые часто создаются, когда мощная оккультная магия не контролируется должным образом. Элементали обладают минимальным интеллектом и обычно связаны с определённым типом магии. Огненные элементали — распространённый тип элементалей, наносящих урон огненной магией. Они поджигают свою цель при рукопашных атаках, а иногда могут также стрелять огненными сгустками.
actors.mobs.elemental$fireelemental.name=огненный элементаль
actors.mobs.elemental$frostelemental.desc=Элементали — это хаотичные существа, которые часто создаются, когда мощная оккультная магия не контролируется должным образом. Элементали обладают минимальным интеллектом и обычно связаны с определённым типом магии. Морозные элементали — распространённый тип элементалей, ослабляющих врагов с помощью леденящей магии. Они будут охлаждать свою цель в ближнем бою и иногда с помощью атак дальнего боя. Их магия гораздо эффективнее в воде.
actors.mobs.elemental$frostelemental.name=ледяной элементаль
actors.mobs.elemental$newbornfireelemental.charging=Стихия набирает силу!
actors.mobs.elemental$newbornfireelemental.desc=Элементали — это хаотичные существа, которые часто создаются, когда мощная оккультная магия не контролируется должным образом. Элементали обладают минимальным интеллектом и обычно связаны с определённым типом магии. Этот огненный элементаль только что призван, но всё ещё довольно опасен!
actors.mobs.elemental$newbornfireelemental.desc_ally=Поскольку этот элементаль был призван заклинанием, он обладает немного большим контролем над своим пламенем. Он не способен совершать атаки дальнего боя, но может поджигать врагов, которых атакует в ближнем бою.
actors.mobs.elemental$newbornfireelemental.desc_boss=Из-за хаотичной природы своего призыва, этот элементаль может распространять огонь лишь неточными залпами после подготовки в течение хода.
actors.mobs.elemental$newbornfireelemental.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.elemental$newbornfireelemental.name=новорожденный огненный элементаль
actors.mobs.elemental$shockelemental.desc=Элементали — это хаотичные существа, которые часто создаются, когда мощная оккультная магия не контролируется должным образом. Элементали обладают минимальным интеллектом и обычно ассоциируются с определённым типом магии. Электрические элементали — это менее распространённый тип элементалей, которые дезориентируют своих врагов электричеством и вспышками света. В ближнем бою они будут испускать электрический разряд на ближайших врагов и наносить дополнительный урон своей основной цели, если она находится в воде. Иногда они также будут направлять на цель луч света на расстоянии, временно ослепляя её.
actors.mobs.elemental$shockelemental.name=шоковый элементальный
actors.mobs.eye.deathgaze_kill=Смертельный взгляд убил тебя...
actors.mobs.eye.desc=Другое имя этого демона — «шар ненависти». Завидев врага, он бездумно пускает в ход свой смертоносный взгляд, часто не считаясь с союзниками и раня их.
actors.mobs.eye.name=злобный глаз
actors.mobs.fetidrat.desc=С этой крысой явно что-то не так. Ее жирная черная шерсть и гниющая кожа сильно отличаются от здоровых крыс, которых вы видели раньше. Бледно-зеленые глаза делают ее особенно угрожающей. Крыса источает облако ужасного запаха, вблизи он невероятно силен. Из пасти крысы капает темная слизь, она прогрызает пол, но, кажется, растворяется в воде.
actors.mobs.fetidrat.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.fetidrat.name=зловонная крыса
actors.mobs.fungalcore.desc=Этот гигантский гриб, должно быть, является источником всей грибковой активности в этой пещере.
actors.mobs.fungalcore.name=грибковое ядро
actors.mobs.fungalsentry.desc=Этот особенно высокий гриб служит защитой для более крупной грибной сети, обитающей в этой пещере. Он неподвижен, но выпускает точные ядовитые струи во всё, что попадает в поле его зрения. Хотя сила этих струй довольно слаба, они могут очень быстро накапливать смертельное количество яда. Хотя его можно убить, лучше избегать его.
actors.mobs.fungalsentry.name=грибковый страж
actors.mobs.fungalspinner.desc=Похоже, что этим пещерным существом управляет паразитический гриб. Гриб также изменил свои способности, заменив паутину и ядовитые мешочки на грибковые образования. Грибное существо будет плевать в вас растительностью вместо паутины, распространяя грибковые растения и потенциально оглушая вас. Хотя оно не может отравить, грибное существо получит значительную устойчивость к урону, если будет находиться рядом с любыми грибами.
actors.mobs.fungalspinner.name=грибной спиннер
actors.mobs.ghoul.desc=По мере того, как гномье общество постепенно начало рушиться, и нынешний король гномов захватил абсолютную власть, с теми, кто был слаб или сопротивлялся ему, обращались плохо. По мере того, как король становился всё более искусным в использовании тёмной магии, он подчинил этих гномов своей воле, и теперь они составляют пехотинцев его армии. Гули сами по себе не особенно сильны, но всегда передвигаются группами, и их гораздо труднее убить в больших количествах. Когда гуль побеждён, он восстанет через несколько ходов, если рядом находится другой гуль.
actors.mobs.ghoul.name=гном-упырь
actors.mobs.gnoll.desc=Гноллы — человекоподобные существа, похожие на гиен. Они обитают в канализации и подземельях, время от времени выбираясь на поверхность для набегов. Гнолльские разведчики — обычные члены их стаи; они не так сильны, как громилы, и не так умны, как шаманы.
actors.mobs.gnoll.name=гнолл-разведчик
actors.mobs.gnollexile.desc=У этого серошерстного гнолла на плече большая метка, указывающая на то, что он изгнанник. Гноллов обычно изгоняют из общества за игнорирование приказов или нарушение законов. Изгнанники должны быть сильными и проницательными, чтобы выжить, и этот, похоже, умеет обращаться с копьем, которое держит в руках.
actors.mobs.gnollexile.desc_aggro=Гнолль-изгнанник сердито оглядывается по сторонам. Похоже, что-то всё-таки заставило его вступить в бой. Осторожно, копьё!
actors.mobs.gnollexile.desc_passive=Гнолль-изгнанник не собирается атаковать. Он не кажется таким агрессивным, как другие гноллы здесь, и, вероятно, не считает, что сражаться с вами стоит. Вы могли бы просто пропустить его, но у него есть рюкзак, который может быть полон полезных вещей...
actors.mobs.gnollexile.name=изгнанник гноллов
actors.mobs.gnollexile.seen_aggro=Гнолл с копьем готовится к атаке!
actors.mobs.gnollexile.seen_passive=Гнолл с копьем смотрит на вас с опаской, но не предпринимает никаких действий для нападения.
actors.mobs.gnollgeomancer.alert=Геомант пробуждается! Вся пещера словно сдвигается с места, и он, безумно смеясь, убегает прочь!
actors.mobs.gnollgeomancer.desc=Этот впечатляюще высокий старший гнолл, должно быть, является источником различных магических заклинаний, способных перемещать землю в этих местах, и организатором всей деятельности гноллов. В отличие от гноллов-саперов в этом районе, геомант весьма искусен в магии и не может быть ранен брошенными или падающими камнями. Однако он не умеет сражаться в ближнем бою.
actors.mobs.gnollgeomancer.desc_armor=В данный момент геомант заключен в слой каменной брони. Вам нужно подойти поближе и снять её киркой, прежде чем вы сможете нанести геоманту урон.
actors.mobs.gnollgeomancer.desc_armor_sapper=Находящийся неподалеку сапер-гнолл держит устройство, усиливающее каменную броню геоманта. Сейчас вы не сможете ей навредить!
actors.mobs.gnollgeomancer.desc_sleeping=Этот впечатляюще высокий шаман-гнолл окружен слоем камня и выглядит почти как статуя. Присмотревшись, можно увидеть, как камень магическим образом движется в такт дыханию старшего гнолла. В таком положении, заключенный в камень, он неуязвим, и, похоже, наслаждается буквально «земным сном». Вероятно, вы сможете пробить слои камня киркой, но _будьте готовы к бою, когда будете это делать._ Геомант, должно быть, является источником различной магии, перемещающей землю, и организатором всей деятельности гноллов. _Победить гноллов, разбросанных здесь, прежде чем сражаться с ним, может быть хорошей идеей._
actors.mobs.gnollgeomancer.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.gnollgeomancer.name=гнолл-геомант
actors.mobs.gnollgeomancer.rock_kill=Летящий валун убил тебя...
actors.mobs.gnollgeomancer.rockfall_kill=Падающие камни убили тебя...
actors.mobs.gnollgeomancer.warning=Геомант начинает шевелиться. Убедитесь, что вы готовы, прежде чем продолжить!
actors.mobs.gnollguard.def_verb=заблокировано
actors.mobs.gnollguard.desc=Крупный и суровый на вид гнолл с копьем и щитом, но без шлема. Эти стражники, вероятно, являются обученными головорезами, которых завербовали для защиты шахты от наступления диких животных. Гнолл-стражник достаточно силен, чтобы держать копье одной рукой, но не умеет им хорошо пользоваться. _Для атаки на расстоянии ему потребуется достаточно открытое пространство, и он нанесет вам значительно меньше урона, если вы подойдете к нему вплотную._
actors.mobs.gnollguard.desc_armor=Находящийся неподалеку сапер-гнолл держит устройство, которое наделяет этого стража земляной броней, значительно снижая получаемый им урон.
actors.mobs.gnollguard.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.gnollguard.name=страж гноллов
actors.mobs.gnollguard.spear_warn=Гнолл наносит сокрушительный удар острием своего копья!
actors.mobs.gnollsapper.desc=Маленький и слабый, но умный гнолл со светлой шерстью и сумкой, полной различных приспособлений. Вероятно, он здесь, чтобы помогать в разведке и добыче темного золота, и его охраняет находящийся неподалеку охранник. Он способен сражаться, но его атаки до смешного слабы, не сильнее, чем у гнолла-разведчика. Вместо прямого боя саперы предпочитают использовать имеющиеся у них приспособления, чтобы заставить каменистую местность атаковать за них. Однако сами они не владеют магией перемещения земли, поэтому, скорее всего, будут использовать свои приспособления безрассудно. Должны быть многочисленные способы использовать их атаки против них самих или против их охранника.
actors.mobs.gnollsapper.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.gnollsapper.name=сапер гноллов
actors.mobs.gnolltrickster.desc=Странное на вид существо, даже по меркам гноллов. Оно сгорбилось, злобно ухмыляясь, почти обхватив сумку, висящую у него на плече. Его глаза широко раскрыты от странной смеси страха и возбуждения. В его сумке находится большая коллекция плохо сделанных дротиков, наконечники которых, похоже, пропитаны различными опасными веществами.
actors.mobs.gnolltrickster.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.gnolltrickster.name=гнолл-обманщик
actors.mobs.goldenmimic.desc=Мимики — это магические существа, способные принимать любую форму по своему желанию. В подземельях они почти всегда выбирают форму сундука с сокровищами, чтобы заманить ничего не подозревающих искателей приключений. Золотые мимики — это более сильные существа, которые пытаются привлечь самых могущественных искателей приключений. У них лучше добыча, но они также намного сильнее обычных мимиков.
actors.mobs.goldenmimic.name=золотой мимик
actors.mobs.golem.def_verb=заблокировано
actors.mobs.golem.desc=Дварфы пытались соединить свои знания о механизмах с недавно открытым искусством подчинения стихий. Душами механических тел големов служили духи земли, которых считали самыми послушными. И всё же малейшая ошибка в ритуале могла привести к тому, что голем выйдет из-под контроля.
actors.mobs.golem.name=голем
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=хлюп... хлюп...
actors.mobs.goo.desc=О Жиже мало что известно. Возможно, это даже не существо, а скопление канализационных отходов, обретшее зачатки собственной воли.
actors.mobs.goo.enraged=разъяренный
actors.mobs.goo.gluuurp=ГЛУУУРП!
actors.mobs.goo.name=Жижа
actors.mobs.goo.notice=ГЛУРП-ГЛУРП!
actors.mobs.goo.pumpup=Гум наполняется энергией!
actors.mobs.goo.rankings_desc=Поглощенная Слизью
actors.mobs.greatcrab.def_verb=заблокировано
actors.mobs.greatcrab.desc=Этот краб гигантский, даже по сравнению с другими крабами из канализации. Его синий панцирь покрыт трещинами и ракушками, что свидетельствует о его преклонном возрасте. Он медленно передвигается, едва удерживая равновесие своей массивной клешней. Хотя у краба всего одна клешня, его размер с лихвой компенсирует это. Краб держит клешню перед любой угрозой, защищаясь непроницаемой стеной панциря. Однако краб не может блокировать атаки, которые он не ожидает, или атаки нескольких врагов одновременно.
actors.mobs.greatcrab.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.greatcrab.name=большой краб
actors.mobs.greatcrab.noticed=Краб блокирует удар своей огромной клешней.
actors.mobs.guard.def_verb=заблокировано
actors.mobs.guard.desc=Когда-то эти охранники тюрьмы давно уже ничем не отличаются от заключенных. Они бродят, как зомби, бездумно скитаясь по коридорам в поисках чего-нибудь подозрительного, как и вы! Они носят цепи на поясе, возможно, для того, чтобы притягивать врагов на близкое расстояние.
actors.mobs.guard.name=тюремный охранник
actors.mobs.guard.scorpion=Иди сюда!
actors.mobs.hermitcrab.def_verb=заблокировано
actors.mobs.hermitcrab.desc=По какой-то причине этот краб из канализации решил надеть на голову сломанную верхнюю часть бочки! Дополнительный вес замедлил его до обычной скорости, но также значительно повысил его защиту. Вам кажется, что вы слышите, как что-то трясется внутри бочки...
actors.mobs.hermitcrab.name=рак-отшельник
actors.mobs.mimic.desc=Мимики — это магические существа, способные принимать любую форму по своему желанию. В подземельях они почти всегда выбирают форму сундука с сокровищами, чтобы заманить ничего не подозревающих искателей приключений. Мимики обладают неприятным укусом, но часто хранят больше сокровищ, чем обычный сундук.
actors.mobs.mimic.discover_hint=Этот враг может быть найден в любом месте подземелья.
actors.mobs.mimic.hidden_hint=С этим сундуком что-то не так... Подходить и пытаться открыть его – плохая идея.
actors.mobs.mimic.name=мимик
actors.mobs.mimic.reveal=Эта грудь — мимикрирующая!
actors.mobs.mob.died=Вы слышите, как что-то умирает вдали.
actors.mobs.mob.discover_hint=Этого врага можно найти в определённой области подземелья.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Погиб от: %s
actors.mobs.monk$focus.desc=Этот монах идеально нацелен на свою цель и, кажется, предугадывает её действия ещё до того, как они будут предприняты. Пока монах сосредоточен, следующая физическая атака по нему гарантированно промахнется, независимо от обстоятельств. Парирование этой атаки тратит его концентрацию, и ему потребуется снова её накопить, чтобы парировать следующую атаку. Монахи накапливают концентрацию быстрее во время движения.
actors.mobs.monk$focus.name=сфокусированный
actors.mobs.monk.def_verb=заблокировано
actors.mobs.monk.desc=Эти монахи — фанатики, посвятившие себя защите тайн своего города от всех чужаков. Они не пользуются ни доспехами, ни оружием, полагаясь лишь на искусство рукопашного боя.
actors.mobs.monk.name=дварф-монах
actors.mobs.monk.parried=парировал
actors.mobs.necromancer$necroskeleton.desc=Этот скелет был призван некромантом. Он ведёт себя как обычный скелет и умрёт, когда будет убит некромант, который его призвал.
actors.mobs.necromancer$necroskeleton.name=скелет некроманта
actors.mobs.necromancer.desc=Эти ученики темных магов стекаются в тюрьму, поскольку это идеальное место для оттачивания своего злого ремесла. Некроманты призывают и наделяют силой скелетов, чтобы те сражались на их стороне. Убийство некроманта также убьет призванного им скелета.
actors.mobs.necromancer.name=некромант
actors.mobs.npcs.blacksmith.cant_enter_old=Эта область недоступна в данном прохождении. Начните новую игру, чтобы попробовать новое задание!
actors.mobs.npcs.blacksmith.def_verb=заблокировано
actors.mobs.npcs.blacksmith.desc=Этот тролль-кузнец выглядит так же, как и все тролли: он высокий и худой, а его кожа по цвету и текстуре напоминает камень. Тролль-кузнец возится с непропорционально маленькими инструментами.
actors.mobs.npcs.blacksmith.enter_no=Еще нет
actors.mobs.npcs.blacksmith.enter_yes=Я готов
actors.mobs.npcs.blacksmith.entrance_blocked=Спуск заблокирован.
actors.mobs.npcs.blacksmith.exit_no=Еще нет
actors.mobs.npcs.blacksmith.exit_warn_crystal=Тот гигантский кристалл всё ещё там, внизу. Я заплачу дополнительно, если вы его уничтожите.
actors.mobs.npcs.blacksmith.exit_warn_full=Закончил? У тебя куча золота, но убедись, что ты ничего не забыл. \n\n_Помни, я тебя больше не впущу, как только ты поднимешься._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Тот гигантский гриб тоже всё ещё там, внизу. Я заплачу дополнительно, если ты его убьёшь.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Тот гнолл-геомант тоже всё ещё там, внизу. Я заплачу дополнительно, если ты его убьёшь.
actors.mobs.npcs.blacksmith.exit_warn_high=Закончили? Похоже, у вас неплохое количество золота, но мне бы не помешало еще. Вы сможете получить _40 штук._Помните, я вас больше не пущу, как только вы подниметесь._
actors.mobs.npcs.blacksmith.exit_warn_low=Ты уже закончил? Похоже, у тебя не так много золота. Ты должен получить _40 штук._Помни, я тебя больше не впущу, как только ты поднимешься._
actors.mobs.npcs.blacksmith.exit_warn_med=Закончили? По крайней мере, золото у вас есть, но в шахте точно есть ещё. Вы должны получить _40 штук._Помните, я вас больше не пущу, как только вы подниметесь._
actors.mobs.npcs.blacksmith.exit_warn_none=Ты уже закончил? У тебя почти нет золота! Ты должен получить _40 штук._Помни, я тебя больше не пущу, как только ты поднимешься._
actors.mobs.npcs.blacksmith.exit_yes=Я задолбался
actors.mobs.npcs.blacksmith.get_lost=Я занят. Убирайся!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Привет, человек! Ты выглядишь очень важной персоной.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Однако будьте осторожны, шахта опасна для такого маленького человека, как вы. Она заброшена уже давно, и там начали расти кристаллы. Они блестящие, но слишком хрупкие, чтобы чего-то стоить, и их защищают какие-то магические штуки. Они довольно прочные, поэтому _будьте осторожны, где вы добываете_, иначе привлечете их внимание. Где-то есть еще и _гигантский кристалл_. Он намного прочнее, так что будьте готовы к бою, если начнете его разбивать. Держу пари, что разбивание замедлит рост всех кристаллов, так что я заплачу дополнительно, если вы сможете это сделать.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Привет, человек! Ты выглядишь очень храбрым.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Однако будьте осторожны, шахта опасна для такого маленького человека, как вы. Там внизу растёт какое-то грибное чудовище. Там есть грибные стражи, которые очень опасны, если вас увидят, но они, по крайней мере, не могут подняться и преследовать вас. _Держитесь подальше_, если хотите остаться в живых. Я заплачу дополнительно, если вам удастся уничтожить _самый большой гриб_, но это потребует немалых усилий. Он соединён с множеством мицелиальных узлов, спрятанных в стенах. Вам придётся сломать большинство из них, прежде чем вы сможете нанести ему серьёзный урон.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Однако будьте осторожны, шахта опасна для такого маленького человека, как вы. Некоторые гноллы тоже хотят золота и теперь разрушают это место. Они глупые твари, поэтому их добыча полезных ископаемых привела к всевозможным обвалам и провалам. Вам придётся прокладывать себе путь сквозь неё, поэтому ищите недавно потревоженные породы. Думаю, один из гноллов создаёт большую часть проблем, вероятно, шаман-геомант или что-то в этом роде. Я заплачу дополнительно, если вы найдёте и убьёте его, но я уверен, что он будет сопротивляться.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Привет, человек! Ты выглядишь очень проворным.
actors.mobs.npcs.blacksmith.intro_quest_mage=Привет, человек! Ты выглядишь очень умным.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Привет, человек! Ты выглядишь как настоящий хитрец.
actors.mobs.npcs.blacksmith.intro_quest_start=Хочешь быть полезным, да? Да, у меня есть кое-что, чем ты мог бы заняться. Я построил эту мастерскую на месте старой шахты, она находится чуть ниже по лестнице. Возьми эту кирку и добудь мне немного руды из темного золота. 40 кусков должно хватить. Камни там мягкие, так что ты сможешь прорубить стены, приложив немного усилий. Что ты имеешь в виду, как я заплачу? Жадный ты... Ладно, ладно, я могу немного поковыряться для тебя. Считай себя счастливчиком, я единственный кузнец в округе.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Привет, Человек! Ты выглядишь очень крутым.
actors.mobs.npcs.blacksmith.lost_pick=Вы что, шутите? Где моя кирка?!
actors.mobs.npcs.blacksmith.name=тролль-кузнец
actors.mobs.npcs.blacksmith.quest_start_prompt=Готов спуститься вниз? Убедись, что у тебя достаточно свободного места для золота. \n\n_Я тебя подведу только один раз!_
actors.mobs.npcs.blacksmith.reminder=Ты больше не тратишь мое время? Вход в шахту вон там.
actors.mobs.npcs.blacksmith.reminder_crystal=Принеси мне как можно больше золота и попробуй заодно разбить большой кристалл.
actors.mobs.npcs.blacksmith.reminder_fungi=Принеси мне как можно больше золота и постарайся заодно убить гигантский гриб.
actors.mobs.npcs.blacksmith.reminder_gnoll=Принеси мне как можно больше золота и постарайся заодно убить гнолла-геоманта.
actors.mobs.npcs.ghost.crab_1=Привет, %s... Когда-то я был таким же, как ты — сильным и уверенным в себе... Но меня убило древнее существо... Я не могу покинуть это место... Не раньше, чем отомщу... Убей _великого краба_, который отнял мою жизнь...\n\nОн неестественно стар... С огромной клешней и толстым панцирем... _Остерегайтесь его клешни, вы должны застать краба врасплох, иначе он заблокирует им путь..._
actors.mobs.npcs.ghost.crab_2=Пожалуйста... Помогите мне... Убейте ракообразное... \n\n_Оно всегда будет блокировать... Когда увидит, что вы приближаетесь..._
actors.mobs.npcs.ghost.desc=Призрак едва различим. Он выглядит как бесформенное пятно слабого света с печальным лицом.
actors.mobs.npcs.ghost.find_me=Спасибо... найди меня...
actors.mobs.npcs.ghost.gnoll_1=Привет, %s... Когда-то я был таким же, как ты — сильным и уверенным в себе... Но меня убил коварный враг... Я не могу покинуть это место... Пока не отомщу... Убей _гнолла-обманщика_, который отнял мою жизнь...\n\nОн не похож на других гноллов... Он прячется и использует метательное оружие... _Остерегайтесь его ядовитых и зажигательных дротиков, не атакуйте издалека..._
actors.mobs.npcs.ghost.gnoll_2=Пожалуйста... Помогите мне... Убейте обманщика... \n\n_Не дайте ему вас поразить... Подойдите к нему поближе..._
actors.mobs.npcs.ghost.name=грустный призрак
actors.mobs.npcs.ghost.rat_1=Привет, %s... Когда-то я был таким же, как ты — сильным и уверенным в себе... Но меня убил мерзкий зверь... Я не могу покинуть это место... Не раньше, чем отомщу... Убей эту _зловонную крысу_, которая отняла мою жизнь... \n\n Она бродит по этому полу... Сеет грязь повсюду... _Остерегайтесь ее облака зловония и едкого укуса, кислота растворяется в воде..._
actors.mobs.npcs.ghost.rat_2=Пожалуйста... Помогите мне... Убейте это чудовище... \n\n_Сражайтесь с ним возле воды... Избегайте зловония..._
actors.mobs.npcs.imp.cya=До встречи, %s!
actors.mobs.npcs.imp.desc=Бесы — это низшие демоны. Они не отличаются ни силой, ни магическими способностями, но довольно умны и общительны. Многие бесы предпочитают жить среди не-демонов.
actors.mobs.npcs.imp.golems_1=В моем случае нужно убить големов. Видите ли, я собираюсь открыть здесь небольшой бизнес, но эти глупые големы — настоящая головная боль! С этими бродячими глыбами гранита очень трудно вести переговоры, проклятые они! Так что, пожалуйста, убейте... скажем, 4 из них, и награда будет вашей.
actors.mobs.npcs.imp.golems_2=Как проходит ваше сафари с големами? Только не забудьте собрать жетоны.
actors.mobs.npcs.imp.hey=Пссст, %s!
actors.mobs.npcs.imp.intro=Вы искатель приключений? Я обожаю искателей приключений! На них всегда можно положиться, если нужно кого-то убить, верно? Конечно же, за награду ;)
actors.mobs.npcs.imp.monks_1=В моем случае нужно убить _монахов_. Видите ли, я собираюсь открыть здесь небольшой бизнес, но эти сумасшедшие сами ничего не покупают и отпугнут других клиентов. Поэтому, пожалуйста, убейте... скажем, _пять из них_, и награда будет вашей.
actors.mobs.npcs.imp.monks_2=О, ты всё ещё жив! Я знал, что твоё кунг-фу будет сильнее ;) Только не забудь взять эти жетоны.
actors.mobs.npcs.imp.name=амбициозный бес
actors.mobs.npcs.impshopkeeper.buyback=Бес радостно возвращает вам ваш товар.
actors.mobs.npcs.impshopkeeper.desc=Этот бес открыл небольшой магазинчик на границе внутренних залов. Приятно видеть приветливое лицо, но цены у него явно не кажутся привлекательными.
actors.mobs.npcs.impshopkeeper.greetings=Здравствуйте, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Что ты сделал, %s? Быстро схожу за покупками, мне нужно отсюда уходить!
actors.mobs.npcs.impshopkeeper.name=амбициозный бес
actors.mobs.npcs.impshopkeeper.thief=Я думал, что могу тебе доверять!
actors.mobs.npcs.mirrorimage.desc=Эта иллюзия очень похожа на тебя, только бледнее и слегка подёргивается.
actors.mobs.npcs.mirrorimage.discover_hint=Этот персонаж встречается в определенных свитках.
actors.mobs.npcs.mirrorimage.name=зеркальное изображение
actors.mobs.npcs.npc.discover_hint=Этот персонаж находится в определённом регионе подземелья.
actors.mobs.npcs.prismaticimage.desc=Эта мерцающая иллюзия очень похожа на вас, даже кажется, что она держит ваше текущее оружие и доспехи. Призматические изображения будут пытаться найти и привлечь внимание врагов, используя свою повышенную защиту и здоровье, чтобы защитить вас. Хотя они не обладают такой же атакующей мощью, как зеркальные изображения, они обладают повышенной прочностью, включая получение преимуществ от ваших доспехов. При снижении здоровья до 0 призматические изображения исчезнут в течение нескольких ходов, и их все еще можно будет восстановить. Когда врагов нет, призматические изображения исчезнут и воссоединятся со своим хозяином.
actors.mobs.npcs.prismaticimage.discover_hint=Этот персонаж встречается в определенных свитках.
actors.mobs.npcs.prismaticimage.name=призматическое изображение
actors.mobs.npcs.ratking.confused=Что... Где я? Моему королевству я нужен!
actors.mobs.npcs.ratking.crown_after=Вам нравится ваша новая броня? Отказаться от неё не придётся!
actors.mobs.npcs.ratking.crown_clothes=Одевайся! Ты не в состоянии разговаривать с членами королевской семьи!
actors.mobs.npcs.ratking.crown_desc=Ооо, эта корона для меня?! Она выглядит намного блестяще моей, поэтому я с благодарностью принимаю! На самом деле, я думаю, я могу предложить вам кое-что в награду за эту корону. Огромную силу, подобающую такому герою, как вы! Хотите?
actors.mobs.npcs.ratking.crown_fine=Ладно! В любом случае, мне это было не нужно...
actors.mobs.npcs.ratking.crown_info=Сначала расскажите мне подробнее.
actors.mobs.npcs.ratking.crown_no=Я бы предпочёл этого не делать...
actors.mobs.npcs.ratking.crown_thankyou=Хе-хе, спасибо! Теперь иди и заставь своего короля гордиться тобой!
actors.mobs.npcs.ratking.crown_yes=Конечно!
actors.mobs.npcs.ratking.desc=Эта крыса немного крупнее обычной сумчатой крысы. На голове у неё крошечная корона.
actors.mobs.npcs.ratking.desc_birthday=Эта крыса немного крупнее обычной сумчатой крысы. Вместо своей обычной короны на ней крошечная зелёная праздничная шляпка. С днём рождения, Крысиный Король!
actors.mobs.npcs.ratking.desc_crown=Эта крыса немного крупнее обычной сумчатой крысы. На голове у неё корона карликового короля.
actors.mobs.npcs.ratking.desc_winter=Эта крыса немного крупнее обычной сумчатой крысы. Вместо своей обычной короны на ней крошечная праздничная шляпка. Счастливых праздников!
actors.mobs.npcs.ratking.discover_hint=Этот персонаж находится в конце определённого участка подземелья.
actors.mobs.npcs.ratking.name=крысиный король
actors.mobs.npcs.ratking.not_sleeping=Я не сплю!
actors.mobs.npcs.ratking.what_is_it=Что это? У меня нет времени на эту ерунду. Моё королевство не будет править само собой!
actors.mobs.npcs.sheep.baa!=Баа!
actors.mobs.npcs.sheep.baa.=Баа.
actors.mobs.npcs.sheep.baa...=Баа...
actors.mobs.npcs.sheep.baa?=Баа?
actors.mobs.npcs.sheep.def_verb=заблокировано
actors.mobs.npcs.sheep.desc=Это волшебная овца. Что в ней такого волшебного? Её нельзя убить. Она будет стоять там, пока волшебным образом не исчезнет, всё это время пережевывая жвачку с пустым взглядом.
actors.mobs.npcs.sheep.discover_hint=Этого персонажа можно найти с помощью определённого предмета или ловушки.
actors.mobs.npcs.sheep.name=овца
actors.mobs.npcs.shopkeeper.buyback=Продавец неохотно возвращает вам товар.
actors.mobs.npcs.shopkeeper.desc=Этот коренастый тип больше подходит для торгового района какого-нибудь крупного города, чем для подземелья. Его цены объясняют, почему он предпочитает вести дела именно здесь.
actors.mobs.npcs.shopkeeper.flee=Продавец убегает!
actors.mobs.npcs.shopkeeper.name=лавочник
actors.mobs.npcs.shopkeeper.sell=Продать товар
actors.mobs.npcs.shopkeeper.talk=Разговаривать
actors.mobs.npcs.shopkeeper.talk_ascent=Я не знаю, что ты собираешься делать с этим амулетом, но он мне совсем не нужен. Купи что-нибудь и уходи, нам обоим нужно покинуть это место!
actors.mobs.npcs.shopkeeper.talk_caves=Трать деньги — живи дольше. \n\nО, и передай привет тому троллю-кузнецу, если увидишь его. Напомни этому болвану, что он всё ещё должен мне деньги за молоток, который я продал ему на прошлой неделе!
actors.mobs.npcs.shopkeeper.talk_city=Мои товары обеспечат вам здесь безопасность. \n\n...И, пожалуйста, не слоняйтесь без дела. Мне потребовалось целая вечность, чтобы местные жители оставили меня в покое, я не хочу, чтобы вы навлекли на себя неприятности!
actors.mobs.npcs.shopkeeper.talk_halls=Привет! У меня специальные цены для охотников на демонов! \n\nО, и будьте осторожны там внизу! Демонам внизу будет все равно, насколько вы храбры. Вы не сможете вернуться и потратить больше денег, если будете мертвы! ;)\n\nДемоны похожи на меня? Хе-хе, совсем нет. Я просто маленький парень, не очень сильный боец, и мне удалось сохранить рассудок. Демоны внизу гораздо сильнее, и все они были порабощены... ну... просто будьте осторожны там внизу.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Здравствуйте, Ваше Высочество, или теперь Ваше Святейшество? Хе-хе, в любом случае, вам здесь не место, многие были бы очень расстроены, если бы вы погибли. Но у вас наверняка есть деньги, почему бы не купить что-нибудь, чтобы предотвратить это?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ну, если это не странствующий герой! Если вы пытаетесь спасти другой город, то удачи вам, опасности здесь гораздо серьёзнее, чем мелкие бандитские группировки. Уверен, у вас получится лучше, чем у кого-либо другого, только постарайтесь не погибнуть прямо у моего магазина.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Вы, кажется, не в своей стихии, мисс. Узкие коридоры подземелий не такие просторные, как величественные залы или леса, окружающие город, не так ли? Хе-хе, не обращайте внимания на мои рассуждения, почему бы вам что-нибудь не купить?
actors.mobs.npcs.shopkeeper.talk_prison_intro=У меня есть всё необходимое для успешного приключения!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Хе-хе, кажется, я где-то в городе видел объявление о вашем розыске. Вы в бегах? О, вы невиновны? Конечно, конечно... Не волнуйтесь, у меня есть дела поважнее, чем доносить на вас, но, может быть, вам стоит что-нибудь купить на всякий случай?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Вы пришли из гильдии воров, чтобы зачистить территорию? Нет, просто за покупками? Ну, заодно убейте пару монстров. И скидок не ждите, я плачу вам неплохие деньги за защиту, а вы едва обеспечиваете мне здесь безопасность.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Какая интересная у вас печать, обычно они целые. Вы что, опальный герой? Ну, что бы вы ни сделали, это не мое дело, ваши монеты все еще ценны.
actors.mobs.npcs.shopkeeper.thief=Вор, вор!
actors.mobs.npcs.shopkeeper.warn=Осторожно! Больше предупреждать не буду.
actors.mobs.npcs.vaultlaser.desc=Этот часовой периодически стреляет лазерами. _Поскольку это всего лишь тестовая площадка, лазеры вам не причинят вреда._
actors.mobs.npcs.vaultlaser.name=лазерный страж хранилища
actors.mobs.npcs.vaultsentry.desc=Этот часовой сканирует местность по определенной схеме. _Поскольку это всего лишь тестовая зона, часовой ничего не предпримет, если обнаружит вас._
actors.mobs.npcs.vaultsentry.name=часовой сканирования хранилища
actors.mobs.npcs.wandmaker.def_verb=заблокировано
actors.mobs.npcs.wandmaker.desc=Этот пожилой, но бодрый джентльмен выглядит слегка растерянным. Он защищен магическим щитом.
actors.mobs.npcs.wandmaker.intro_1=I Я пришел сюда, чтобы найти редкий ингредиент для волшебной палочки, но заблудился, и мой магический щит ослабевает. Мне скоро нужно будет уйти, но я не могу смириться с уходом, не получив то, за чем пришел.
actors.mobs.npcs.wandmaker.intro_2=Если вы сможете мне это достать, я с удовольствием расплачусь с вами одной из моих искусно изготовленных волшебных палочек! Я принёс с собой две, так что вы можете взять любую, какую захотите.
actors.mobs.npcs.wandmaker.intro_berry=У старого начальника этой тюрьмы росло растение гнилостной ягоды, и мне нужно одно из его семян. Вероятно, растение уже разрослось, поэтому получить от него семя будет непросто. Его огород должен находиться где-то здесь. Старайтесь держаться подальше от его плетей, если хотите остаться в живых. Использование огня может показаться заманчивым, но, пожалуйста, не делайте этого, вы убьете растение и уничтожите его семена.
actors.mobs.npcs.wandmaker.intro_cleric=О, здравствуйте, Ваше Высочество! Какая приятная неожиданность встретить Вас в таком унылом месте! Не хочу вас обременять, но у меня, возможно, есть для Вас задание.
actors.mobs.npcs.wandmaker.intro_duelist=О, здравствуйте, мисс! Какая приятная неожиданность встретить героя в таком унылом месте! Если вы не против помочь старику, у меня может быть для вас задание.
actors.mobs.npcs.wandmaker.intro_dust=Мне нужна _пыль из трупов_. Это особый вид проклятой костной муки, которая обычно встречается в подобных местах. Где-то здесь должна быть забаррикадированная комната, я уверен, там найдется немного пыли. Будьте осторожны, проклятие, которое несет эта пыль, очень сильное, _свяжитесь со мной как можно скорее_, и я сниму с вас проклятие.
actors.mobs.npcs.wandmaker.intro_ember=Я ищу _свежие угли_ от новорожденного огненного элементаля. Элементали обычно появляются, когда ритуал призыва не контролируется, поэтому просто найдите несколько свечей и место для ритуала, и я уверен, что вы сможете заставить его появиться. Однако, сражаясь с ним, вам следует _избегать окружения_ или _держать под рукой какой-нибудь замораживающий предмет._ Новорожденные элементали довольно сильны и хаотичны, но они не переносят холода.
actors.mobs.npcs.wandmaker.intro_huntress=О, здравствуйте, мисс! Приятное зревоище здесь, внизу, не правда ли? Честно говоря, я клянусь, я вас уже видел, но не могу вспомнить, где именно… Ладно, неважно, если вы здесь в поисках приключений, у меня может быть для вас задание.
actors.mobs.npcs.wandmaker.intro_mage=О, привет, %s! Я слышал, что между тобой и институтом волшебников был какой-то скандал? Да ладно, мне эти зануды никогда и не нравились. Если ты не против, у меня может быть для тебя задание.
actors.mobs.npcs.wandmaker.intro_rogue=О боже, вы меня напугали! Я не встречал ни одного бандита из этого места, сохранившего рассудок, так что вы, должно быть, с поверхности! Если вы готовы помочь незнакомцу, у меня может быть для вас задание.
actors.mobs.npcs.wandmaker.intro_warrior=О, привет! Какая приятная неожиданность — встретить воина с севера в таком унылом месте! Вы, должно быть, проделали долгий путь, чтобы добраться сюда. Если вы ищете приключений, у меня может быть для вас задание.
actors.mobs.npcs.wandmaker.name=старый мастер жезлов
actors.mobs.npcs.wandmaker.reminder_berry=Удалось ли вам найти семечко Rotberry, %s? Ищите комнату, полную растений.
actors.mobs.npcs.wandmaker.reminder_dust=Удалось ли тебе найти пыль с трупов, %s? Поищи баррикады.
actors.mobs.npcs.wandmaker.reminder_ember=Удалось ли тебе найти тлеющие угли, %s? Тебе нужно найти четыре свечи и место для ритуала.
actors.mobs.phantompiranha.desc=Призрачные пираньи — редкий вид пираний, обладающих магическими способностями и жуткими полупрозрачными телами. Они способны телепортироваться во время нападения, чтобы либо убежать, либо быстро приблизиться к врагу! Хотя сражаться с ними непросто, их мясо ценится за свои магические свойства.
actors.mobs.phantompiranha.name=фантомная пиранья
actors.mobs.phantompiranha.teleport_away=Призрачная пиранья телепортируется прочь...
actors.mobs.piranha.desc=Эти хищные рыбы были выведены специально для защиты затопленных территорий. Их укус смертельно опасен, поэтому лучше избегать прямого контакта с ними.
actors.mobs.piranha.discover_hint=Этот враг может быть найден в любом месте подземелья.
actors.mobs.piranha.name=гигантская пиранья
actors.mobs.pylon.desc_active=Опора электросети, предназначенная для регулирования электроэнергии, питающей оборудование в этом районе. В данный момент опора перегружена электрической энергией, это, должно быть, и есть причина сверхзарядки DM-300!\n\n В этом состоянии опоры уязвимы, но будут создавать электрические разряды на близлежащие ячейки по часовой стрелке. Благодаря своей прочной металлической конструкции опоры устойчивы к значительным повреждениям.
actors.mobs.pylon.desc_inactive=Опора линии электропередачи, предназначенная для регулирования электроэнергии, питающей оборудование в этом районе. \n\n В настоящее время опора неактивна и не подвержена повреждениям.
actors.mobs.pylon.name=опора линии электропередачи
actors.mobs.rat.desc=Сумчатые крысы — агрессивные, но довольно слабые обитатели канализации. Они опасно кусаются, но представляют смертельную опасность только в больших количествах.
actors.mobs.rat.name=сумчатая крыса
actors.mobs.ripperdemon.desc=Эти ужасающие существа — результат использования многочисленных трупов гномов в этом регионе демоническими силами. Рипперы — это истощённые, уродливые создания, похожие на гномов, но с изуродованными телами и длинными острыми когтями из костей. Демоны-рипперы не отличаются особой прочностью, но они ловки и опасны. Они способны совершать прыжки на большие расстояния, чтобы быстро добраться до цели и пронзить её когтями.
actors.mobs.ripperdemon.leap=Демон-потрошитель готовится к прыжку!
actors.mobs.ripperdemon.name=демон-потрошитель
actors.mobs.rotheart.desc=Плоды гнилостной ягоды очень уникальны. Вместо того чтобы гнить и обеспечивать питательные вещества, плод растет, затвердевает и окружает семя. Он обеспечивает защиту внутренних органов, которые развиваются внутри плода. Этот гигантский шар называют сердцем взрослого растения гнилостной ягоды.
actors.mobs.rotheart.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.rotheart.name=гниющее сердце
actors.mobs.rotlasher.desc=Гнилостный щиток — это часть корневой системы взрослого растения гнилой ягоды, а также их основное средство защиты. Щитки слепы и воткнуты в землю, но после обнаружения любой угрозы они яростно атакуют её. Когда поблизости нет врагов, они стоят неподвижно, пытаясь слиться с окружающей растительностью.
actors.mobs.rotlasher.discover_hint=С этим врагом можно столкнуться во время выполнения определённого задания.
actors.mobs.rotlasher.name=гниющий плеть
actors.mobs.scorpio.desc=Эти огромные, похожие на пауков демонические существа избегают ближнего боя, предпочитая стрелять калечащими зазубренными шипами с большого расстояния.
actors.mobs.scorpio.name=Скорпион
actors.mobs.senior.desc=Эти монахи — фанатики, посвятившие себя защите тайн своего города от всех чужаков. Они не пользуются ни доспехами, ни оружием, полагаясь лишь на искусство рукопашного боя.
actors.mobs.senior.name=старший монах
actors.mobs.shaman$blueshaman.spell_desc=Этот шаман носит синюю маску и будет использовать магию, которая временно увеличивает получаемый вами урон.
actors.mobs.shaman$purpleshaman.spell_desc=Этот шаман носит фиолетовую маску и будет использовать магию, которая временно снижает вашу точность и уклонение.
actors.mobs.shaman$redshaman.spell_desc=Этот шаман носит красную маску и будет использовать магию, которая временно ослабляет вашу атакующую силу.
actors.mobs.shaman.bolt_kill=Волшебный разряд убил тебя...
actors.mobs.shaman.desc=Самые умные гноллы способны овладеть шаманской магией. Гнолльи шаманы предпочитают боевые заклинания, восполняя ими недостаток силы, и без колебаний применяют их против тех, кто ставит под сомнение их положение в племени.
actors.mobs.shaman.name=шаман гноллов
actors.mobs.skeleton.def_verb=заблокировано
actors.mobs.skeleton.desc=Скелеты собраны из костей неудачливых искателей приключений и обитателей подземелья, оживлённых злой магией из глубин. Получив достаточно повреждений, они рассыпаются взрывом костей.
actors.mobs.skeleton.explo_kill=Вы погибли от взрыва костей...
actors.mobs.skeleton.name=скелет
actors.mobs.slime.def_verb=заблокировано
actors.mobs.slime.desc=Слизни — странные, слегка магические существа с эластичным внешним телом и жидким ядром. Городская канализация обеспечивает их обильным запасом воды и питательных веществ. Благодаря эластичной внешней мембране, нанести слизням более 6 единиц урона за одну атаку довольно сложно.
actors.mobs.slime.name=слизь
actors.mobs.snake.desc=Эти гигантские змеи способны быстро уворачиваться от ударов, что делает их довольно сложными для поражения. Однако магические атаки или внезапные нападения могут застать их врасплох. Вы можете совершить внезапную атаку, напав, находясь вне поля зрения змеи. Один из способов — позволить змее преследовать вас через дверной проем, а затем _нанести удар сразу после того, как она переместится в дверь._
actors.mobs.snake.hint=Попробуйте использовать кнопку осмотра на змее, чтобы узнать, как ей противостоять.
actors.mobs.snake.name=канализационная змея
actors.mobs.spectralnecromancer.desc=Хотя скелеты — это основная специализация некромантов, некоторые предпочитают использовать других, менее материальных приспешников. Призрачные некроманты выбрали в качестве своих приспешников призраков! Отдельные призраки не так сильны, как скелеты, но эти некроманты не боятся призвать целую стаю!
actors.mobs.spectralnecromancer.name=спектральный некромант
actors.mobs.spinner.desc=Эти зеленоватые мохнатые пещерные пауки избегают прямого боя. Они предпочитают ждать в стороне, пока жертва, запутавшаяся в их паутине, медленно умирает от ядовитого укуса.
actors.mobs.spinner.name=пещерный паук
actors.mobs.statue.def_verb=заблокировано
actors.mobs.statue.desc=Можно подумать, что это просто еще одна из неодушевленных статуй этого подземелья, но ее красные светящиеся глаза выдают ее истинное предназначение.
actors.mobs.statue.desc_weapon=Хотя сама статуя сделана из камня, оружие, которое она держит, выглядит очень реалистично.
actors.mobs.statue.discover_hint=Этот враг может быть найден в любом месте подземелья.
actors.mobs.statue.name=анимированная статуя
actors.mobs.succubus.desc=Суккубы — демоны в облике соблазнительных девушек с несколько мрачным вкусом в одежде. Своей магией суккуб может очаровать героя, и тот не сможет никого атаковать, пока чары не спадут.
actors.mobs.succubus.name=суккуб
actors.mobs.swarm.desc=Смертоносный рой мух яростно жужжит. Любая немагическая атака разделит его на два меньших, но столь же опасных роя.
actors.mobs.swarm.name=рой мух
actors.mobs.tengu$bombability$bombblob.desc=Здесь клубится облако перегретого дыма. Осторожно, сейчас произойдёт взрыв!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Оно прилипло к земле, его невозможно сдвинуть!
actors.mobs.tengu$bombability$bombitem.desc=Тэнгу бросил сюда странно выглядящую дымовую шашку, которая поднимает густой горячий дым. Она издает громкий тикающий звук, как будто отсчитывает время до взрыва! Бомба закрепилась на земле, поэтому вы не можете ее поднять.
actors.mobs.tengu$bombability$bombitem.name=дымовая шашка
actors.mobs.tengu$fireability$fireblob.desc=Тэнгу подбросил мелкий порошок, который, похоже, начинает воспламеняться, и вот-вот загорится!
actors.mobs.tengu$shockerability$shockerblob.desc=Здесь накапливается электрическая энергия, любой предмет, стоящий на этой клетке, будет поражен электрическим током в следующий ход!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Оно вырабатывает слишком много электроэнергии, её невозможно взять!
actors.mobs.tengu$shockerability$shockeritem.desc=Тэнгу подбросил сюда любопытную машину, которая, похоже, сделана из деталей DM-100. Машина постоянно испускает вокруг себя электрические разряды, но, кажется, по предсказуемой схеме. При таком количестве электрических разрядов её невозможно поднять.
actors.mobs.tengu$shockerability$shockeritem.name=Шокер
actors.mobs.tengu.defeated=Наконец-то свобода...
actors.mobs.tengu.desc=Тэнгу — члены древнего клана убийц с таким же названием. Они известны широким применением сюрикенов и ловушек.
actors.mobs.tengu.interesting=Давайте сделаем это интересным...
actors.mobs.tengu.name=Тэнгу
actors.mobs.tengu.notice_gotcha=Понял, %s!
actors.mobs.tengu.notice_have=Теперь ты у меня в руках, %s!
actors.mobs.tengu.rankings_desc=Убит Тенгу
actors.mobs.thief.carries=Вор несёт _%s._ Очевидно, украдено.
actors.mobs.thief.desc=Хотя эти заключенные свободно разгуливают по своим камерам, это место по-прежнему остается их тюрьмой. Со временем это место отняло у них не только свободу, но и разум. Давным-давно эти безумные воры и бандиты забыли, кто они и зачем воруют. Эти враги скорее украдут и убегут, чем вступят в бой. Держите их в поле зрения, иначе вы можете никогда больше не увидеть украденную вещь.
actors.mobs.thief.escapes=Вор украл ваш %s и скрылся!
actors.mobs.thief.name=сумасшедший вор
actors.mobs.thief.stole=Вор украл у тебя %s!
actors.mobs.tormentedspirit.desc=Измученные духи — это, в остальном, добродушные духи, пораженные проклятием. Пока они прокляты, они будут атаковать, как призраки, и станут еще сильнее! Возможно, проклятие можно снять, используя подходящий предмет, находясь рядом с духом. Если проклятие будет снято, дух, несомненно, будет благодарен...
actors.mobs.tormentedspirit.name=измученный дух
actors.mobs.tormentedspirit.thank_you=Спасибо...
actors.mobs.vaultrat.desc=У этой крысы произошли некоторые изменения в поведении, чтобы протестировать новый ИИ врагов в хранилище: \n_-_ Ее движения можно «услышать» сквозь стены. \n_-_ Она будет бродить по заранее заданному маршруту. \n_-_ Во время блуждания у нее резко снижается дальность обнаружения позади направления движения. \n_-_ Во время сна дальность обнаружения также снижается. \n_-_ Когда она вас обнаружит, она начнет «исследование», прежде чем переключиться на охоту. Исследующие враги движутся к вам, но не атакуют, и их легче скрыть за дверями и углами.
actors.mobs.warlock.bolt_kill=Теневой разряд убил тебя...
actors.mobs.warlock.desc=Когда интересы дварфов сместились от инженерного дела к тайным искусствам, власть в городе захватили чернокнижники. Они начинали с магии стихий, но вскоре перешли к демонологии и некромантии.
actors.mobs.warlock.name=дварф-чернокнижник
actors.mobs.wraith.desc=Призрак — это мстительный дух грешника, чья могила или гробница была осквернена. Будучи эфирным существом, его очень трудно поразить обычным оружием.
actors.mobs.wraith.discover_hint=Этот враг может быть найден в любом месте подземелья.
actors.mobs.wraith.name=призрак
actors.mobs.yogdzewa$larva.desc=Эти крошечные отпрыски Йог-Дзевы — простые миньоны, которых легко создать. Хотя поодиночке они слабы, призываются быстро и в больших количествах могут стать непобедимыми.
actors.mobs.yogdzewa$larva.name=личинка бога
actors.mobs.yogdzewa$larva.rankings_desc=Поглощено Йог-Дзевой
actors.mobs.yogdzewa$yogeye.rankings_desc=Поглощено Йог-Дзевой
actors.mobs.yogdzewa$yogripper.rankings_desc=Поглощено Йог-Дзевой
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Поглощено Йог-Дзевой
actors.mobs.yogdzewa.darkness=Тьма сгущается...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Йог-Дзева — Древний Бог; огромное чудовище, проникающее в миры смертных и пожирающее их, чтобы питать свой бесконечный рост. Гномы, должно быть, привлекли внимание этого космического ужаса, играя с темной магией, и с тех пор пытаются сдержать его. Йог-Дзева происходит из измерения первозданного магического хаоса и не может явить свою истинную форму в этот мир. Вместо этого он создал аватары и призвал демонических приспешников, чтобы те выполняли его приказы. Этот гигантский глаз является центром силы Йог-Дзевы в этом мире. Хотя сам глаз неподвижен, он способен испускать мощные лучи демонической магии и призывать различных приспешников на помощь.
actors.mobs.yogdzewa.desc_spawners=Вы чувствуете волны демонической энергии, исходящие из верхних этажей. Что-то, что вы оставили живым там наверху, должно быть, направляет энергию обратно в Йог-Дзеву. _Йог использует эту энергию для призыва более могущественных приспешников!_
actors.mobs.yogdzewa.hope=ВАША. НАДЕЖДА. — ЭТО. ИЛЛЮЗИЯ!
actors.mobs.yogdzewa.name=Йог-Дзева
actors.mobs.yogdzewa.notice=Я ТЕБЯ ВИЖУ.
actors.mobs.yogdzewa.rankings_desc=Поглощено Йог-Дзевой
actors.mobs.yogfist$brightfist.desc=Этот кулак создан из чистой световой энергии. Он способен каждый ход выпускать мощные лучи обжигающего света! Эти лучи временно ослепят вас, а также нанесут значительный урон. Кулак также способен на короткое время окутать арену ослепляющим светом, чтобы вы могли сбежать! \n\n Однако у этого кулака нет особых способностей, которые он мог бы использовать в ближнем бою.
actors.mobs.yogfist$brightfist.name=яркий кулак
actors.mobs.yogfist$brightfist.teleport=Кулак телепортируется прочь во вспышке света, которая серьёзно ослепляет!
actors.mobs.yogfist$burningfist.desc=Огромный кулак, объятый огнём. Пальцы с треском сжимаются, роняя на пол тлеющие угли.
actors.mobs.yogfist$burningfist.name=пылающий кулак
actors.mobs.yogfist$darkfist.desc=Этот кулак создан из чистой темной энергии. Он способен каждый ход выпускать мощные заряды темной магии! Эти заряды ослабят ваш источник света, а также нанесут значительный урон. Кулак также способен на короткое время погрузить арену во тьму, чтобы сбежать! \n\n Однако у этого кулака нет особых способностей, которые он мог бы использовать в ближнем бою.
actors.mobs.yogfist$darkfist.name=темный кулак
actors.mobs.yogfist$darkfist.teleport=Кулак телепортируется прочь, окутывая вас вспышкой тьмы, которая гасит ваш источник света!
actors.mobs.yogfist$rottingfist.desc=Огромный кулак из гнилой плоти. Между пальцами сочится зловонная слизь, пачкая камень под ним.
actors.mobs.yogfist$rottingfist.name=гниющий кулак
actors.mobs.yogfist$rustedfist.desc=Этот кулак создан из живого металла. Это огромная масса движущегося металла, обладающая мощными атаками в ближнем бою и способная парализовать цель на расстоянии. Из-за своей огромной массы кулак будет получать любой нанесенный ему урон постепенно, а не мгновенно. Однако кулак негибкий и не может проникать в узкие проходы. Кроме того, хотя он может получать урон медленно, отложенный урон будет продолжать увеличиваться, если кулак будет поражен несколько раз.
actors.mobs.yogfist$rustedfist.name=ржавый кулак
actors.mobs.yogfist$soiledfist.desc=Этот кулак создан из хаотической магии земли. Во время движения он постоянно вызывает рост растительности вокруг себя. Он также может выпускать концентрированные земляные заряды, которые опутывают цель быстро растущими лианами и корнями! \n\n Кулак черпает силу из этой растительности и будет противостоять урону в зависимости от количества высокой или бороздчатой растительности рядом с ним!
actors.mobs.yogfist$soiledfist.name=испачканный кулак
actors.mobs.yogfist.desc=Этот кулак — один из аспектов силы Йог-Дзевы. Кулаки связаны с силой Йог-Дзевы и будут защищены от любого вреда, если находятся близко к глазу.
actors.mobs.yogfist.invuln_warn=Кулак неуязвим, когда находится близко к глазу!
actors.mobs.yogfist.rankings_desc=Поглощено Йог-Дзевой
actors.char.def_verb_evaded=уклонился
actors.char.enemy_hit=%s ударил тебя
actors.char.enemy_missed=Атака от тебя, %2$s %1$s
actors.char.hit=%s удар %s
actors.char.mob_missed=Атака %1$s %2$s %3$s
actors.char.out_of_paralysis=Боль вывела %s из состояния паралича.
actors.char.you_hit=Вы нажали %s
actors.char.you_missed=%1$s %2$s ваша атака
actors.mobs.mob.fleeing=%s убегает
actors.mobs.mob.hunting=%s охотится
actors.mobs.mob.passive=%s является пассивным
actors.mobs.mob.sleeping=%s спит
actors.mobs.mob.wandering=%s блуждает
actors.mobs.elemental.desc=Бродячие огненные элементали — побочный результат призыва более могущественных существ. Они настолько непредсказуемы, что даже сильнейшему демонологу не под силу ими управлять.
actors.mobs.elemental.name=огненный элементаль
actors.mobs.king.desc=Последний король дварфов славился глубокими познаниями в тайнах жизни и смерти. Он уговорил придворных принять участие в ритуале, который должен был даровать им вечную молодость. В итоге её получил лишь сам король — а в придачу целую армию нежити.
actors.mobs.king.name=король дварфов
actors.mobs.npcs.bee.desc=Несмотря на свои размеры, золотые пчёлы яростно защищают хозяина. Правда, живут они недолго.
actors.mobs.npcs.bee.name=золотая пчела
actors.mobs.shielded.desc=Громилы — самые крупные, сильные и выносливые гноллы. Получив тяжёлые раны, они впадают в ярость и наносят врагам ещё больший урон.
actors.mobs.shielded.name=громила со щитом
actors.mobs.yog.desc=Йог-Дзева — Древний Бог, могущественное существо из царств хаоса. Столетие назад древние гномы с трудом одержали победу в войне против его армии демонов, но не смогли убить самого бога. Вместо этого они заточили его в залах под своим городом, полагая, что он слишком слаб, чтобы когда-либо снова восстать.
actors.mobs.yog.name=Йог-Дзева
actors.mobs.bandit.carries=%s перевозит _%s_. Очевидно, украден.
actors.buffs.armorevasion.name=Уклонение усилено
actors.mobs.king.defeated=Ты не сможешь меня убить. %s...Я... бессмертен...
