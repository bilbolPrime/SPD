actors.mobs.mob.hunting=%s 正在狩獵
actors.mobs.mob.passive=%s 是被動的
actors.mobs.mob.sleeping=%s 正在睡覺
actors.mobs.mob.wandering=%s 正在遊蕩
actors.mobs.elemental.desc=遊蕩的火元素是召喚更強大存在時產生的副產物。牠們的本性太過混亂，即便是最強大的惡魔學者也無法控制。
actors.mobs.elemental.name=火元素
actors.mobs.king.desc=矮人的末代國王以深諳生死之道聞名。他說服宮廷成員參加一場據說能讓人永保青春的儀式。結果只有他一人如願，還附帶得到了一支亡靈大軍。
actors.mobs.king.name=矮人王
actors.mobs.npcs.bee.desc=金蜂雖小，卻會凶猛地保護主人。不過，牠們活不了多久。
actors.mobs.npcs.bee.name=金蜂
actors.mobs.shielded.desc=豺狼暴徒是豺狼人中體形最大、力氣最強、最耐打的。受了重傷後，牠們會陷入狂怒，對敵人造成更大的傷害。
actors.mobs.shielded.name=持盾暴徒
actors.mobs.yog.desc=尤格-澤瓦是一位古神，來自混沌領域的強大存在。一個世紀前，古老的矮人勉強戰勝了它所率領的惡魔大軍，卻未能將其殺死。於是，矮人們將它囚禁在城下的殿堂之中，認為它已虛弱到無法再次復活。
actors.mobs.yog.name=約格-澤瓦
actors.mobs.bandit.carries=%s 攜帶 _%s_。顯然是偷來的。
actors.buffs.armorevasion.name=閃避提升
actors.mobs.king.defeated=你殺不死我。 %s我是……不朽的……
