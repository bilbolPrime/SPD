actors.blobs.blizzard.desc=這裡正刮著暴風雪。
actors.blobs.blizzard.name=暴風雪
actors.blobs.confusiongas.desc=這裡瀰漫著一團混亂的氣體。
actors.blobs.confusiongas.name=混亂氣體
actors.blobs.corrosivegas.desc=這裡正瀰漫著一團致命的腐蝕性氣體。
actors.blobs.corrosivegas.name=腐蝕性氣體
actors.blobs.electricity.desc=這裡電場閃爍著耀眼的光芒。
actors.blobs.electricity.name=電
actors.blobs.electricity.ondeath=你當時嚇壞了…
actors.blobs.electricity.rankings_desc=觸電
actors.blobs.fire.desc=這裡火勢猛烈。
actors.blobs.fire.name=火
actors.blobs.foliage.desc=幾束光線刺穿了地下花園的昏暗。
actors.blobs.foliage.name=葉子
actors.blobs.freezing.desc=這裡的空氣異常寒冷。
actors.blobs.freezing.name=冰凍空氣
actors.blobs.goowarn.desc=這裡聚集著大量的暗能量！
actors.blobs.goowarn.name=暗能量
actors.blobs.inferno.desc=這裡燃起了熊熊大火。
actors.blobs.inferno.name=地獄
actors.blobs.paralyticgas.desc=這裡正瀰漫著一團麻痺氣體。
actors.blobs.paralyticgas.name=麻痺氣體
actors.blobs.regrowth.name=再生
actors.blobs.sacrificialfire.desc=這裡有一個祭壇，上面燃著祭祀之火。任何在此被殺死的生物都會被獻祭給地牢的亡靈。或許獻祭足夠多的生物後會得到獎勵？
actors.blobs.sacrificialfire.name=祭祀之火
actors.blobs.sacrificialfire.reward=火焰燃起，然後消散，留下獎勵！
actors.blobs.sacrificialfire.unworthy=火焰吞噬了你的祭品，但自身卻不會改變。
actors.blobs.sacrificialfire.worthy=火焰吞噬了你的祭品，愈發旺盛。
actors.blobs.smokescreen.desc=這裡正翻滾著一團濃濃的黑煙。
actors.blobs.smokescreen.name=煙幕
actors.blobs.stenchgas.desc=這裡瀰漫著一股惡臭。
actors.blobs.stenchgas.name=惡臭氣體
actors.blobs.stormcloud.desc=這裡正翻滾著滾滾水汽。
actors.blobs.stormcloud.name=暴風雲
actors.blobs.toxicgas.desc=這裡正盤旋著一團綠色的有毒氣體。
actors.blobs.toxicgas.name=有毒氣體
actors.blobs.toxicgas.ondeath=你死於有毒氣體…
actors.blobs.toxicgas.rankings_desc=窒息
actors.blobs.waterofawareness.desc=這口井的水蘊含著知識的力量。飲用井水可以完全鑑定你裝備的所有物品，鑑定你背包中所有物品上的詛咒，並顯示當前樓層的所有物品。
actors.blobs.waterofawareness.name=意識之水
actors.blobs.waterofawareness.procced=當你啜飲一口時，你會感到知識湧入你的腦海。
actors.blobs.waterofhealth.desc=這口井的水蘊含著療癒的力量。飲用此井水可以治癒你的傷口，滿足你的飢餓感，並洗淨任何破損物品上的詛咒。
actors.blobs.waterofhealth.name=健康之水
actors.blobs.waterofhealth.procced=你喝了一口，感覺傷口完全癒合了。
actors.blobs.web.desc=這裡到處都覆蓋著一張厚厚的蜘蛛網。任何碰到或穿過蛛網的東西都會破壞它，但也會因此被困在原地。
actors.blobs.web.name=蜘蛛網
actors.buffs.adrenaline.desc=一股強大的體能湧現，腎上腺素增強了攻擊和移動速度。腎上腺素使目標以 2 倍速度奔跑，以 1.5 倍速度攻擊。剩餘回合數：。
actors.buffs.adrenaline.name=腎上腺素
actors.buffs.adrenalinesurge.desc=一股強大的力量湧動，可惜並非永久。 \n\n力量提升：+%d.\n提升效果減弱前的回合數：%s。
actors.buffs.adrenalinesurge.name=增強
actors.buffs.amok.desc=狂暴會使目標陷入極度憤怒和混亂的狀態。當生物處於狂暴狀態時，它會攻擊附近的一切，無論敵友。狂暴剩餘回合數：
actors.buffs.amok.name=阿莫克
actors.buffs.arcanearmor.desc=一道薄薄的護盾環繞著你，阻擋了部分魔法攻擊的傷害。你的魔法護甲目前提升了：0-%d。持續回合數直到奧術護甲減弱：%s。
actors.buffs.arcanearmor.name=奧術護甲
actors.buffs.artifactrecharge.desc=能量在你體內奔湧，加快你裝備的神器充能速度。每個神器受到的影響略有不同，但它們的充能速度都會比平常快得多。剩餘回合數：。
actors.buffs.artifactrecharge.name=神器充能
actors.buffs.ascensionchallenge.almost=你感覺到尤格握著護身符的手開始鬆動，你快要成功了！
actors.buffs.ascensionchallenge.beckon=護身符開始向遠方的敵人發出呼喊聲。
actors.buffs.ascensionchallenge.break=你喘了口氣，感覺傷口開始癒合！
actors.buffs.ascensionchallenge.damage=護身符開始散發出黑暗能量。它燃燒了！
actors.buffs.ascensionchallenge.desc=不知何故，尤格-澤瓦繼續透過護身符來影響這個世界，並試圖阻止你的晉升！尤格的力量讓地牢變得更危險，敵人數量增加，實力也更強！如果不加以控制，這股力量會不斷增強。擊敗被尤格力量強化過的敵人可以削弱它。
actors.buffs.ascensionchallenge.desc_beckon=護身符目前正在向遠處的敵人發出警報，讓他們知道你的位置。
actors.buffs.ascensionchallenge.desc_clear=目前，護身符散發出的黑暗能量已被盡可能地削弱了。
actors.buffs.ascensionchallenge.desc_damage=護身符的能量變得如此強大，它正在直接傷害你！
actors.buffs.ascensionchallenge.desc_haste=護身符目前正在加速遠處的敵人，讓他們更快接近你！
actors.buffs.ascensionchallenge.desc_slow=該護身符目前正在減慢你的速度，並抵消加速效果！
actors.buffs.ascensionchallenge.haste=護身符開始加速遠處敵人的行動！
actors.buffs.ascensionchallenge.name=護身符的詛咒
actors.buffs.ascensionchallenge.on_kill=黑暗能量會吞噬你…
actors.buffs.ascensionchallenge.slow=護身符放在你的物品欄裡就像一塊鉛塊一樣沉重！
actors.buffs.ascensionchallenge.weaken=你能感覺到護身符的詛咒稍微減弱了一些。
actors.buffs.ascensionchallenge.weaken_info=擊敗更多敵人可以削弱護身符的詛咒。
actors.buffs.ascensionchallenge.weaken_info_no_kills=如果你擊敗敵人，護身符的詛咒就會減弱！
actors.buffs.barkskin.desc=你的皮膚變得堅硬，摸起來粗糙而堅實，如同樹皮。堅硬的皮膚會提升你的有效護甲值，使你更好地抵禦物理攻擊。你的護甲值目前提升了：0-0。樹皮術持續生效，直到效果減弱：1-8。如果你從多個來源獲得樹皮術效果，則只有最強的效果生效。
actors.buffs.barkskin.name=樹皮
actors.buffs.barrier.desc=一個持久的力場護罩，可以阻擋所有傷害。只要護罩還在，它就會承受它所保護的一切的傷害。護罩也會隨著時間推移緩慢衰減。剩餘護罩：
actors.buffs.barrier.name=障礙
actors.buffs.berserk.action_name=狂戰士
actors.buffs.berserk.angered=憤怒
actors.buffs.berserk.angered_desc=狂戰士的傷勢越嚴重，其攻擊力就越強。當狂戰士受到物理傷害時，怒氣值會不斷累積，從而獲得額外傷害。即使被護甲格擋的傷害也計入怒氣值。怒氣值會隨時間消退。狂戰士的生命值越低，怒氣值持續時間越長。當怒氣值達到100時，狂戰士可以進入狂暴狀態，獲得基於其護甲等級和已損失生命值的護盾。在狂暴狀態下，他的護盾會隨時間衰減，護盾耗盡後他必須休息才能再次累積怒氣。目前怒氣值：_%1$.0f%%_\n_+%2$.0f%%_ 傷害值\n\n目前護甲與生命值下的狂暴護盾值：_%3$d_
actors.buffs.berserk.berserk=狂暴
actors.buffs.berserk.berserk_desc=恐懼和不安逐漸消散，只剩下憤怒。在這種狀態下，狂戰士極為強大，造成額外50點傷害並獲得額外護盾，但每回合也會失去一部分護盾。當所有護盾降至0時，狂暴狀態結束。狂暴結束後，狂戰士需要一段時間恢復才能再次累積怒氣。剩餘護盾值：
actors.buffs.berserk.exhausted=筋疲力盡的
actors.buffs.berserk.no_seal=你需要打破封印才能狂暴！
actors.buffs.berserk.rankings_desc=狂暴至死
actors.buffs.berserk.recovering=復原中
actors.buffs.berserk.recovering_desc=內在力量終有極限。狂戰士必須休息才能再次使用狂怒之力。在恢復期間，狂戰士不會因受到傷害而累積狂怒之力。
actors.buffs.berserk.recovering_desc_levels=恢復等級：_%.2f_
actors.buffs.berserk.recovering_desc_turns=直到恢復為止的回合數：_%d_
actors.buffs.bleeding.desc=傷口正在大量出血，情況令人擔憂。流血每回合都會造成傷害。每回合傷害都會隨機減少，直到流血最終停止。當前出血傷害：。
actors.buffs.bleeding.heromsg=你流血了！
actors.buffs.bleeding.name=出血
actors.buffs.bleeding.ondeath=你因失血過多而死…
actors.buffs.bleeding.rankings_desc=流血致死
actors.buffs.bless.desc=一陣強烈的專注爆發，有人說這是神明的啟示。祝福使命中率和閃避率提高25，使祝福者在戰鬥中更有效。祝福剩餘回合數：1。
actors.buffs.bless.name=蒙福
actors.buffs.blindness.desc=致盲狀態會將周遭世界變成一片黑暗的迷霧。在致盲狀態下，角色的視野範圍會縮小到一格，遠程攻擊將失效，並且很容易失去對遠處敵人的追蹤。此外，致盲狀態下的英雄也無法閱讀捲軸或書籍。剩餘致盲回合數：0。
actors.buffs.blindness.heromsg=你瞎了！
actors.buffs.blindness.name=失明
actors.buffs.blobimmunity.desc=一股奇異的力量將你包裹在一層薄薄的保護屏障中，阻擋所有有害的空氣傳播效果。在此屏障存在期間，你免疫所有區域效果。剩餘免疫回合數：0。
actors.buffs.blobimmunity.name=淨化屏障
actors.buffs.burning.burnsup=%s 燒毀了！
actors.buffs.burning.desc=沒有什麼比被火焰吞噬更令人痛苦的了。火焰每回合都會造成傷害，直到被水撲滅或熄滅為止。火焰可以透過踩入水中或被碎裂藥水濺到來撲滅。此外，火焰可能會點燃它接觸到的易燃地形或物品。剩餘燃燒回合數：0。
actors.buffs.burning.heromsg=你著火了！
actors.buffs.burning.name=燃燒
actors.buffs.burning.ondeath=你被燒死了…
actors.buffs.burning.rankings_desc=燒成灰燼
actors.buffs.championenemy$antimagic.desc=反魔法英雄受到的傷害減少 50%，並且完全免疫魔法效果。
actors.buffs.championenemy$antimagic.name=反魔法冠軍
actors.buffs.championenemy$blazing.desc=烈焰勇士的近戰傷害提高25%，攻擊敵人後會點燃敵人，自體免疫火焰傷害，死亡時會向周圍散播火焰。但他們無法將火焰散播到水面上。
actors.buffs.championenemy$blazing.name=耀眼冠軍
actors.buffs.championenemy$blessed.desc=受祝福的英雄擁有4倍的命中率和閃避率。
actors.buffs.championenemy$blessed.name=蒙福的冠軍
actors.buffs.championenemy$giant.desc=巨型冠軍受到的傷害減少 80%，攻擊範圍增加 1，但不能穿越封閉空間。
actors.buffs.championenemy$giant.name=巨人冠軍
actors.buffs.championenemy$growing.desc=成長中的英雄會獲得持續提升的命中率、閃避率、物理傷害加成，以及受到的傷害減免。目前命中率/閃避率/傷害加成：目前傷害減免：
actors.buffs.championenemy$growing.name=成長中的冠軍
actors.buffs.championenemy$projecting.desc=投射型英雄的近戰傷害提高 25%，攻擊範圍增加 3 格。
actors.buffs.championenemy$projecting.name=冠軍的預測
actors.buffs.championenemy.warn=你感覺到一股致命的氣息。
actors.buffs.charm.cant_attack=你被那個敵人迷惑了，無法攻擊他。
actors.buffs.charm.desc=魅惑是一種操控魔法，可以使敵人暫時互相愛慕。受魅惑影響的角色無法直接攻擊魅惑他們的敵人，但仍然可以攻擊其他目標。痛苦的衝擊會縮短魅惑的持續時間。剩餘魅惑回合數：
actors.buffs.charm.heromsg=你被迷住了！
actors.buffs.charm.name=迷住了
actors.buffs.chill.desc=雖然還沒完全凍住，但還是太冷了。受凍目標的所有行動速度都會降低，降低的幅度取決於凍傷效果剩餘的回合數。最嚴重的情況下，就相當於被減速。剩餘凍傷回合數：0。速度降低量：2。
actors.buffs.chill.freezes=%s 卡住了！
actors.buffs.chill.name=冷藏
actors.buffs.combo$combomove.clobber.desc=將敵人擊退2格，但不造成傷害，也無法將其擊落到陷阱中。連擊數增加1。
actors.buffs.combo$combomove.clobber.empower_desc=將敵人擊退3格，使其眩暈，並有可能將其擊落到陷阱中，但不會造成傷害。連擊數增加1。
actors.buffs.combo$combomove.clobber.name=重擊
actors.buffs.combo$combomove.crush.desc=對主要目標造成 %d%% (連擊數*25%%) 點傷害，並對 7x7 範圍內的其他所有敵人造成該傷害的一半。使用後重置連擊數。
actors.buffs.combo$combomove.crush.empower_desc=躍至 %1$d 格，對主要目標造成 %2$d%% (連擊數*25%%) 點傷害，並對 7x7 範圍內的其他敵人造成該傷害的一半。使用後重置連擊數。
actors.buffs.combo$combomove.crush.name=壓碎
actors.buffs.combo$combomove.fury.desc=每疊連擊數對應一次攻擊，每次攻擊造成60%傷害，並可觸發附魔效果。使用後重置連擊數。
actors.buffs.combo$combomove.fury.empower_desc=跳躍至 %d 格，並根據你的連擊數攻擊敵人一次，每次攻擊造成 60%% 點傷害，並可觸發附魔效果。使用後重置連擊數。
actors.buffs.combo$combomove.fury.name=憤怒
actors.buffs.combo$combomove.parry.desc=啟動後，可在1回合內格擋下一次攻擊，並立即反擊。若未成功招架任何攻擊，則重置連擊。
actors.buffs.combo$combomove.parry.empower_desc=啟動後，可在1回合內格擋所有攻擊，並立即反擊。若未成功招架任何攻擊，則重置連擊。
actors.buffs.combo$combomove.parry.name=招架
actors.buffs.combo$combomove.slam.desc=將你格擋傷害能力的 %d%% (連擊數*20%%) 轉換為額外傷害。使用後重置連擊數。
actors.buffs.combo$combomove.slam.empower_desc=躍至 %1$d 個方格，並造成相當於你傷害格擋能力 %2$d%% (連擊數*20%%) 的額外傷害。使用後重置連擊數。
actors.buffs.combo$combomove.slam.name=猛擊
actors.buffs.combo.action_name=連擊
actors.buffs.combo.bad_target=你必須鎖定攻擊範圍內的敵人。
actors.buffs.combo.combo=%d 連擊！
actors.buffs.combo.desc=角鬥士透過成功擊中敵人來累積連擊數。每次攻擊都會使連擊數增加1，但如果兩次攻擊間隔過長，連擊數就會重設為0。角鬥士保持連擊時，他破損封印所產生的任何護盾都不會消失。累積連擊數可以解鎖必定命中的特殊連擊攻擊！連擊數達到2、4、6、8和10時，會解鎖不同的攻擊。有些招式會重置連擊數，有些則不會，但每個招式在每次連擊中只能使用一次。目前連擊數：0。連擊數剩餘回合數：1。
actors.buffs.combo.name=組合
actors.buffs.combo.prompt=選擇攻擊目標。
actors.buffs.corrosion.desc=強酸以驚人的速度腐蝕血肉、金屬和骨骼。腐蝕損傷會隨著目標持續腐蝕而增加。剩餘腐蝕圈數：0。目前腐蝕損傷：1。
actors.buffs.corrosion.heromsg=你快要融化了！
actors.buffs.corrosion.name=腐蝕
actors.buffs.corrosion.ondeath=你漸漸融化…
actors.buffs.corrosion.rankings_desc=已解散
actors.buffs.corruption.desc=腐化會滲入生物的本質，使其背離原本的本性。被腐化的生物會攻擊盟友，無視於昔日的敵人。腐化本身也具有破壞性，會逐漸導致目標衰弱。腐化是永久性的，其影響只有在死亡時才會結束。
actors.buffs.corruption.name=腐敗的
actors.buffs.cripple.desc=你很確定腿不應該那樣彎曲。殘疾使移動速度減半，移動一格通常需要兩回合而不是一回合。殘疾剩餘回合數：
actors.buffs.cripple.heromsg=你殘疾了！
actors.buffs.cripple.name=殘疾的
actors.buffs.daze.desc=耳鳴和視力模糊使戰鬥變得困難。在暈眩期間，命中率和閃避率降低 50，使攻擊命中和閃避都變得更加困難。眩暈剩餘回合數：。
actors.buffs.daze.heromsg=你神情恍惚！
actors.buffs.daze.name=茫然
actors.buffs.degrade.desc=強大的黑暗魔法正在削弱你裝備上升級捲軸所獲得的力量！裝備降級後，其等級將被視為低於實際等級。 _+3之後的每次升級都會比上一次弱很多。 _你的物品描述將隨之改變，以反映其降低的等級。降級不會影響力量需求、魔杖充能、投擲武器的耐久度或神器。剩餘降級回合數：0。使用升級捲軸或移除詛咒將立即結束降級。
actors.buffs.degrade.heromsg=你的裝備感覺性能下降了！
actors.buffs.degrade.name=退化的
actors.buffs.doom.desc=當宇宙似乎想要你的命時，很難繼續走下去。注定厄運的角色將受到來自所有來源的額外67%傷害。厄運是永久性的，其效果只有在死亡時才會結束。
actors.buffs.doom.name=注定失敗
actors.buffs.dread.desc=一種極度恐怖的恐懼，足以讓目標徹底逃離地牢！受恐懼影響的生物會高速逃離對手，一旦離開視線範圍就會完全消失在地牢中。以這種方式擊敗的敵人只會獲得一半經驗值，並且不會掉落任何物品。劇痛會縮短恐懼的持續時間。恐懼剩餘回合數：0。
actors.buffs.dread.name=恐懼
actors.buffs.drowsy.desc=一股魔法力量使人難以保持清醒，幾個回合後，目標將陷入深度魔法睡眠。英雄可以透過受傷或維持滿血狀態來抵抗困倦。睡眠所需回合數：0。
actors.buffs.drowsy.name=昏昏欲睡
actors.buffs.earthimbue.desc=你被賦予了大地之力！所有物理攻擊都會使敵人腳下的土地移動，使其在短時間內行動受限。剩餘大地之力回合數：
actors.buffs.earthimbue.name=充滿泥土氣息
actors.buffs.enhancedrings.desc=盜賊最近使用的神器正在強化他的戒指，使它們等級+1。剩餘回合數：\n\n。
actors.buffs.enhancedrings.name=強化戒指
actors.buffs.fireimbue.desc=你被賦予了火焰之力！所有物理攻擊都有幾率點燃敵人。此外，你完全免疫火焰效果。剩餘火焰附魔回合數：0。
actors.buffs.fireimbue.name=充滿火焰
actors.buffs.foresight.desc=你似乎能夠用意念看到周圍地形的佈局。在預知術的效果下，大範圍內的所有地塊都會向你顯現，包括任何秘密陷阱或門。剩餘預知術回合數：
actors.buffs.foresight.name=遠見
actors.buffs.frost.desc=不要與完全凍結混淆，這種較為溫和的凍結只是將目標包裹在冰中。凍結的效果類似麻痺，使目標無法行動。與麻痺不同的是，如果目標受到傷害，凍結效果會立即解除，因為冰會破碎。剩餘凍結回合數：
actors.buffs.frost.freezes=%s 卡住了！
actors.buffs.frost.name=冷凍
actors.buffs.frostimbue.desc=你被賦予了冰霜之力！所有物理攻擊都會持續給敵人疊加冰凍效果。此外，你完全免疫寒冷。剩餘冰霜附魔回合數：0。
actors.buffs.frostimbue.name=充滿霜凍
actors.buffs.fury.desc=你怒火中燒，敵人不會喜歡你生氣的樣子。你體內燃起熊熊怒火，使你的物理攻擊傷害提高50點。只要你的生命值低於50點，這種怒火就會持續存在。
actors.buffs.fury.heromsg=你勃然大怒！
actors.buffs.fury.name=狂怒
actors.buffs.gravitychaostracker.desc_duration=目前還不清楚這種效果會持續多久，但不可能永遠持續下去。
actors.buffs.gravitychaostracker.desc_intro=每隔幾個回合，當前地牢樓層的所有角色都會被隨機扔向一個方向。
actors.buffs.gravitychaostracker.desc_positive=不過，你和你的盟友似乎不受影響。
actors.buffs.gravitychaostracker.name=重力混沌
actors.buffs.greaterhaste.desc=速度瞬間提升，彷彿周圍的一切都靜止了。在「疾行術」效果下，移動動作完全不耗時，但其他動作仍以正常速度進行。每移動一步都會消耗一回合「疾行術」。剩餘「疾行術」回合數：0。
actors.buffs.greaterhaste.name=更加匆忙
actors.buffs.haste.desc=能量流遍你的肌肉，讓你能夠以驚人的速度奔跑！在加速效果下，你的奔跑速度將提升3倍，但其他所有動作仍以正常速度進行。剩餘加速回合數：0。
actors.buffs.haste.name=匆忙
actors.buffs.healing.desc=一種神奇的療法正在使傷口癒合，血肉癒合。每回合生命值都會穩定恢復，直到治療效果消失。治療量可能會隨時間推移而減弱。下次治療量：剩餘治療量：
actors.buffs.healing.name=治癒
actors.buffs.herodisguise.desc=幻術改變了你的外表！效果純粹是外觀上的，但感覺卻很奇怪。剩餘偽裝回合數：\n\n。
actors.buffs.herodisguise.name=偽裝
actors.buffs.hex.desc=黑暗魔法會削弱專注力，使目標稍微失去方向感。詛咒會降低目標20點命中率和閃避率，使目標在戰鬥中效率降低。剩餘詛咒回合數：
actors.buffs.hex.heromsg=你中了詛咒！
actors.buffs.hex.name=詛咒
actors.buffs.holdfast.desc=戰士保持原地不動，護甲值提升 %1$d-%2$d，部分增益效果的衰減速度降低 %3$d%%。此效果持續到他移動為止。
actors.buffs.holdfast.name=堅守
actors.buffs.hunger.cursedhorn=詛咒之角會在你進食時竊取部分食物能量。
actors.buffs.hunger.desc=在地下城中待的時間越長，飢餓感會逐漸增強，最後你會開始挨餓。挨餓期間，你的生命值會緩慢下降，而不是自動恢復。合理分配食物至關重要！如果你還有剩餘的生命值，挨餓並非壞事，因為這意味著之後會有更多食物。有效的食物分配可以讓食物維持更久！
actors.buffs.hunger.desc_intro_hungry=你能感覺到肚子在叫餓，但還沒到餓的地步。
actors.buffs.hunger.desc_intro_starving=你餓得肚子都痛了。
actors.buffs.hunger.hungry=飢餓的
actors.buffs.hunger.ondeath=你餓死了…
actors.buffs.hunger.onhungry=你餓了。
actors.buffs.hunger.onstarving=你餓壞了！
actors.buffs.hunger.rankings_desc=餓死
actors.buffs.hunger.starving=飢餓
actors.buffs.invisibility.desc=你完全融入周圍地形，變得無法被看見。隱身期間，敵人無法攻擊或追蹤你。物理攻擊和魔法效果（例如捲軸和魔杖）會立即解除隱形狀態。剩餘隱身回合數：0。
actors.buffs.invisibility.name=無形的
actors.buffs.invulnerability.desc=該角色擁有強大的保護力，使其獲得短暫的無敵狀態！剩餘回合數：\n\n。
actors.buffs.invulnerability.name=無敵的
actors.buffs.levitation.desc=一股魔法力量正將你懸浮在地面之上，讓你感到失重。懸浮狀態下的角色移動無聲，並無視所有地面效果。陷阱不會觸發，水無法滅火，植物不會被踩踏，樹根不會穿透地面，陷阱會懸浮在空中。小心，因為所有這些效果都會在懸浮狀態結束後立即生效！剩餘懸浮回合數：0。
actors.buffs.levitation.name=懸浮
actors.buffs.lifelink.desc=該角色的生命力與附近另一個角色相連。他們受到的任何傷害都會分擔。每當角色受到傷害時，一半的傷害將轉移給生命連結目標。生命連結剩餘回合數：0。
actors.buffs.lifelink.name=生命連結
actors.buffs.lifelink.ondeath=生命相關的傷害奪走了你的生命…
actors.buffs.light.desc=即使在最黑暗的地牢中，身邊穩定的光線總能讓人感到安心。光線有助於驅散黑暗，讓你即使在惡劣的環境中也能看清相當遠的距離。剩餘照明圈數：
actors.buffs.light.name=照明
actors.buffs.lockedfloor.desc=目前樓層已鎖定，您無法離開！樓層鎖定期間，您不會獲得飢餓值，也不會因飢餓而受到傷害。此外，如果您不努力擊敗此樓層的首領，被動回覆效果也會停止。另外，如果您在樓層鎖定期間被未受祝福的安卡復活，則該樓層將會重置。擊敗此樓層的首領即可解除鎖定。
actors.buffs.lockedfloor.name=樓層已鎖
actors.buffs.lostinventory.desc=你的物品欄在地下城某處遺失了！在找回物品之前，你將無法拾取或使用大多數物品。
actors.buffs.lostinventory.name=庫存遺失
actors.buffs.magicalsight.desc=不知何故，你能夠用心靈而非雙眼去看。當魔法視覺啟動時，你將能夠看穿半徑 12 格內的所有地形。魔法視覺剩餘回合數：0。
actors.buffs.magicalsight.name=神奇的景象
actors.buffs.magicalsleep.desc=該角色陷入了深度魔法睡眠，無法自然醒來。魔法睡眠與普通睡眠類似，差別在於只有受到傷害才能喚醒目標。對於英雄及其盟友而言，魔法睡眠具有一定的恢復效果，使他們能夠在休息時快速恢復生命值。
actors.buffs.magicalsleep.fallasleep=你陷入了深深的、神奇的睡眠。
actors.buffs.magicalsleep.name=神奇的睡眠
actors.buffs.magicalsleep.toohealthy=你身體很健康，所以不要想睡覺。
actors.buffs.magicalsleep.wakeup=你醒來後感覺神清氣爽，身體健康。
actors.buffs.magicimmune.desc=所有魔法效果都已對你失效，你完全免疫它們。在魔法免疫期間，所有有害和有益的魔法效果都將對你無效，包括詛咒、附魔、魔杖、捲軸、戒指、神器等等。英雄護甲技能強大到足以不受此效果影響。魔法免疫剩餘回合數：0。
actors.buffs.magicimmune.name=免疫魔法
actors.buffs.mindvision.desc=不知何故，你能夠透過意念看到這一層的所有生物。這是一種奇特的感覺。只要你擁有心靈視覺，這一層的所有角色對你來說都是可見的。透過心靈視覺看到一個生物，對於許多魔法效果而言，都算作你看到它或它在附近。心靈視覺剩餘回合數：0。
actors.buffs.mindvision.name=心靈願景
actors.buffs.momentum.action_name=自由奔跑
actors.buffs.momentum.momentum=勢頭正盛
actors.buffs.momentum.momentum_desc=隨著跑酷者的移動，他會累積動量，並且可以用動量開始跑酷。每次動量累積可使跑酷次數達到兩次，跑酷者最多可累積 10 次動量。當跑酷者停止移動時，動量會迅速消失。當前動量：0。
actors.buffs.momentum.resting=復原中
actors.buffs.momentum.resting_desc=隨著他的移動，跑酷者會積蓄動能，他可以利用這些動能開始自由奔跑。跑酷者需要時間恢復體力才能再次積蓄動能。剩餘回合數：0。
actors.buffs.momentum.running=跑酷
actors.buffs.momentum.running_desc=隨著他的移動，跑酷者會累積動量，他可以用這些動量開始自由奔跑。自由奔跑時，跑酷者的移動速度會翻倍，並根據其等級獲得額外的閃避能力。剩餘回合數：0。
actors.buffs.monkenergy$monkability$dash.desc=瞬間衝刺最多4格。此技能可以越過障礙物，但無法穿越敵人或堅硬地形。
actors.buffs.monkenergy$monkability$dash.empower_desc=瞬間衝刺最多可移動 8 格。此能力可以越過障礙物，但無法穿越敵人或堅硬地形。
actors.buffs.monkenergy$monkability$dash.name=短跑
actors.buffs.monkenergy$monkability$dash.prompt=選擇地點
actors.buffs.monkenergy$monkability$dragonkick.desc=一記威力驚人的踢擊，造成 %1$d-%2$d 點傷害，並無視護甲。該踢擊會將目標擊退，並使其每移動一格就麻痺一次。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=一記威力驚人的踢擊，造成_%1$d-%2$d點傷害，並無視護甲。該踢擊會將所有相鄰目標擊退，並使其每移動一格便陷入麻痺狀態。
actors.buffs.monkenergy$monkability$dragonkick.name=龍踢
actors.buffs.monkenergy$monkability$flurry.desc=兩次瞬發攻擊，造成 %1$d-%2$d 點傷害，無視護甲。此技能無法重複使用。
actors.buffs.monkenergy$monkability$flurry.empower_desc=兩次瞬間攻擊，造成 %1$d-%2$d 點傷害，無視護甲，並使用你武器的附魔效果。此技能不能重複使用。
actors.buffs.monkenergy$monkability$flurry.name=一陣猛攻
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=僧侶全神貫注於周圍環境，預判即將到來的攻擊。在這種專注狀態下，她必定能格擋住下一次攻擊。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=專注
actors.buffs.monkenergy$monkability$focus.desc=僧侶轉身集中精神，讓她阻擋接下來對她的攻擊。
actors.buffs.monkenergy$monkability$focus.empower_desc=僧侶瞬間集中精神，成功招架了接下來對她的攻擊。
actors.buffs.monkenergy$monkability$focus.name=重點
actors.buffs.monkenergy$monkability$meditate.desc=僧侶將能量集中到體內，持續5回合。這可以清除大部分負面效果，並使她的魔杖和神器獲得8回合的充能時間。
actors.buffs.monkenergy$monkability$meditate.empower_desc=僧侶將能量集中於體內，持續5回合。這可以清除大部分負面效果，並為她的魔杖和神器充能8回合。 _冥想期間，她獲得80%的傷害抗性，並緩慢恢復20%的已失去生命值。 _
actors.buffs.monkenergy$monkability$meditate.name=幽思
actors.buffs.monkenergy.action=武僧能力
actors.buffs.monkenergy.desc=當她擊敗敵人時，僧侶會獲得能量，這些能量可用於各種技能。大多數敵人被擊敗後會提供 1 點能量，僧侶的能量不會隨時間流逝而減少。目前能量：\n\n。
actors.buffs.monkenergy.desc_cooldown=武僧最近使用了一項技能，必須等待一段時間才能使用另一項技能。目前冷卻時間：%d 回合。
actors.buffs.monkenergy.name=活力
actors.buffs.ooze.desc=這種黏稠的酸液會附著在血肉上，慢慢地將其溶解。 \n\n黏液會持續造成傷害，但可以立即用水沖洗掉。 \n\n剩餘黏液回合數：%s。
actors.buffs.ooze.heromsg=腐蝕性黏液會侵蝕你的血肉。趕緊把它洗掉！
actors.buffs.ooze.name=腐蝕性滲出物
actors.buffs.ooze.ondeath=你漸漸融化…
actors.buffs.ooze.rankings_desc=已解散
actors.buffs.paralysis.desc=很多時候，最糟糕的做法就是什麼都不做。麻痺會完全阻止所有行動，迫使目標等待效果消失。受到傷害的痛苦可以使角色抵抗麻痺，從而擺脫麻痺效果。麻痺剩餘回合數：0。
actors.buffs.paralysis.heromsg=你癱瘓了！
actors.buffs.paralysis.name=癱瘓
actors.buffs.paralysis.out=抵抗麻痺
actors.buffs.physicalempower.desc=你的攻擊力得到提升，物理攻擊命中敵人時造成的傷害量增加。額外傷害：剩餘命中次數：1。
actors.buffs.physicalempower.name=身體強壯
actors.buffs.pincushion.desc=你用來攻擊該角色的投擲武器目前粘在他們身上，擊敗他們後會掉在地上。以下物品目前已附著在他們身上：
actors.buffs.pincushion.name=針墊
actors.buffs.poison.desc=毒素會逐漸侵蝕身體，並緩慢損害其內部功能。毒素每回合造成的傷害與毒素剩餘回合數成正比。毒素剩餘回合數：
actors.buffs.poison.heromsg=你中毒了！
actors.buffs.poison.name=中毒
actors.buffs.poison.ondeath=你死於中毒…
actors.buffs.poison.rankings_desc=死於中毒
actors.buffs.preparation.action_name=準備罷工
actors.buffs.preparation.assassinated=被暗殺
actors.buffs.preparation.desc=刺客正耐心等待，準備從陰影發動攻擊。
actors.buffs.preparation.desc_blink=他可以在攻擊敵人之前閃現到敵人身邊，最大距離為_%d。 _
actors.buffs.preparation.desc_dmg=他的下一次攻擊將造成_%1$d%%額外傷害_，並處決生命值低於_%2$d%%的普通敵人，或生命值低於_%3$d%%的首領。
actors.buffs.preparation.desc_dmg_likely=這次攻擊也更有可能造成更大的傷害。
actors.buffs.preparation.desc_invis_next=更強攻擊的回合：_%d._
actors.buffs.preparation.desc_invis_time=回合數已消耗在不可見的位置：_%d._
actors.buffs.preparation.name=準備
actors.buffs.preparation.no_target=那裡沒有什麼可以攻擊的目標。
actors.buffs.preparation.out_of_reach=那個目標遙不可及。
actors.buffs.preparation.prompt=選擇攻擊目標！最大閃爍距離：
actors.buffs.prismaticguard.desc=你正受到一個棱鏡影像的守護，該影像目前處於非啟動狀態。當敵人出現時，棱鏡影像將立即行動並保護你！在非激活狀態下，棱鏡影像會持續恢復所受到的任何傷害。當前生命值：
actors.buffs.prismaticguard.desc_many=這張棱鏡般的圖像也受益於「眾生之力」。剩餘輪數：%d。
actors.buffs.prismaticguard.name=棱鏡守衛
actors.buffs.recharging.desc=能量在你體內奔湧，提升你的魔杖和法杖的充能速度。每回合，此增益效果將使目前充能值增加四分之一，此外還會進行常規充能。剩餘充能回合數：0。
actors.buffs.recharging.name=充電
actors.buffs.revealedarea.desc=地牢的某個區域暫時對英雄顯現，無論英雄身在何處都能看到它。剩餘回合數：\n\n。
actors.buffs.revealedarea.name=顯露區域
actors.buffs.revealedchar.desc=該角色將對英雄顯現，無論身處何處都將可見。剩餘回合數：\n\n。
actors.buffs.revealedchar.name=揭曉
actors.buffs.roots.desc=根鬚（魔法或自然）會抓住雙腳，迫使它們倒在地上。根鬚會將目標鎖定在原地，使其無法移動，也無法使用大多數移動能力。其他動作不受影響，包括傳送效果。剩餘根鬚回合數：0。
actors.buffs.roots.heromsg=你動不了！
actors.buffs.roots.name=根
actors.buffs.scrollempower.desc=法師最近閱讀的捲軸中的能量正在增強他的魔杖！等級提升：+ ...
actors.buffs.scrollempower.name=滾動賦能
actors.buffs.shadows.desc=你融入周圍的陰影之中，獲得隱身效果並減緩新陳代謝。隱身期間，敵人無法攻擊或追蹤你。大多數物理攻擊和魔法效果（例如捲軸和魔杖）會立即解除隱形狀態。此外，暗影潛行期間，你的飢餓速度也會減慢。你會一直保持暗影潛行狀態，直到你離開陰影或與敵人接觸為止。
actors.buffs.shadows.name=影融合
actors.buffs.slow.desc=減速魔法會影響目標的時間流逝速度，對他們來說一切都飛快運轉。被減速的角色執行所有動作所需的時間是正常情況下的兩倍。剩餘減速回合數：
actors.buffs.slow.name=減速
actors.buffs.snipersmark.action_name_snapshot=快照
actors.buffs.snipersmark.action_name_sniper=狙擊射擊
actors.buffs.snipersmark.action_name_volley=截擊
actors.buffs.snipersmark.desc=狙擊手會鎖定她最近攻擊過的目標。她可以用弓箭進行特殊攻擊，攻擊方式取決於弓箭的強化方式。未強化的弓箭會發射一次“快照”，傷害較低，但無需等待。強化速度的弓箭會發射三支箭的「齊射」。每支箭的傷害較低，但仍可觸發附魔效果。齊射需要1回合。強化傷害的弓箭會發射一次「狙擊射擊」。這次射擊必定命中，傷害根據與目標的距離而增加，需要2回合。剩餘回合數：0。
actors.buffs.snipersmark.name=狙擊手的標記
actors.buffs.soulmark.desc=術士已汲取此生物的靈魂，使其能夠在受到物理傷害時進行治療。剩餘靈魂印記回合數：\n\n。
actors.buffs.soulmark.name=靈魂印記
actors.buffs.stamina.desc=你擁有無窮的耐力，可以更快地移動！在耐力效果下，你的奔跑速度將提升50倍，但其他所有動作仍以正常速度進行。剩餘耐力回合數：
actors.buffs.stamina.name=耐力
actors.buffs.terror.desc=恐懼是一種操控魔法，它能迫使目標陷入無法控制的恐慌。受恐懼影響的角色會被迫逃離對手，並盡可能在彼此之間設置門和牆。然而，劇痛會縮短恐懼的持續時間。剩餘的恐懼回合數：
actors.buffs.terror.name=嚇壞了
actors.buffs.toxicimbue.desc=你被注入了劇毒能量！當你移動時，毒氣會不斷從你身上湧出，傷害你的敵人。在效果持續期間以及之後的幾個回合內，你免疫毒氣和中毒。剩餘劇毒能量回合數：0。
actors.buffs.toxicimbue.name=充滿毒性
actors.buffs.vertigo.desc=當整個世界都在旋轉時，沿著直線行走會變得很困難。眩暈期間，試圖移動的角色會朝著隨機方向移動，而不是朝著他們想要的方向移動。剩餘眩暈回合數：0。
actors.buffs.vertigo.name=眩暈
actors.buffs.vulnerable.desc=易傷魔法使角色受到的所有物理傷害增加 33%%，該傷害在被護甲減少後增加。 \n\n剩餘易傷回合數：%s。
actors.buffs.vulnerable.heromsg=你感覺自己很脆弱！
actors.buffs.vulnerable.name=易受傷害的
actors.buffs.wandempower.desc=你的傷害魔杖已獲得強化，在幾次攻擊中增加其造成的傷害。額外傷害：剩餘攻擊次數：1。
actors.buffs.wandempower.name=魔杖被賦予力量
actors.buffs.weakness.desc=一切突然變得沉重起來。虛弱魔法會降低角色的物理力量，使其造成的傷害減少33。剩餘虛弱回合數：1。
actors.buffs.weakness.heromsg=你感到虛弱！
actors.buffs.weakness.name=減弱
actors.buffs.wellfed.desc=你感到非常滿足和飽足。飽足後，你的飢餓值不會增加，你會隨著時間的推移恢復額外的生命值。剩餘回合數：。
actors.buffs.wellfed.name=吃得很好
actors.char.def_verb=躲避
actors.char.def_verb_blocked=已屏蔽
actors.char.defeat=你擊敗了 %s。
actors.char.immune=免疫
actors.char.invulnerable=無敵的
actors.char.kill=%s 殺了你…
actors.hero.abilities.armorability.cost=費用：_%d_
actors.hero.abilities.armorability.no_target=那裡沒有什麼可以攻擊的目標！
actors.hero.abilities.armorability.prompt=選擇目標位置
actors.hero.abilities.armorability.self_target=你不能以自己為目標！
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=牧師的身體散發出耀眼的光芒。在此形態下，牧師的攻擊範圍增加2點（源自其散發的神聖能量），並且每次消耗聖典充能時獲得10點護盾值。他們也可以施放透過昇華形態天賦解鎖的法術。昇華形態及其法術提供的護盾值不會正常衰減，而是在昇華形態結束時立即消失。目前護盾值：剩餘回合數：
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=昇華形式
actors.hero.abilities.cleric.ascendedform.desc=牧師從自身散發出神聖能量，進入持續10回合的光輝形態。在此形態下，牧師可以施放新的法術，攻擊範圍增加2點，獲得30點護盾值，並且每次額外施放的法術都會根據消耗的聖典充能數量額外提供10點護盾值。昇華形態及其法術提供的護盾值不會像普通形態那樣衰減，而是在昇華形態結束後立即消失。此能力可以再次使用以刷新昇華形態的持續時間。
actors.hero.abilities.cleric.ascendedform.name=昇華形式
actors.hero.abilities.cleric.ascendedform.short_desc=牧師進入_昇華形態_，獲得新的法術、攻擊範圍和護盾。
actors.hero.abilities.cleric.powerofmany$lightally.desc=這是牧師一位冒險夥伴的複製體，由實體光構成。雖然它擁有另一位英雄的外形，但它不具備該英雄的任何獨特能力。只要「眾生之力」對其生效，這位盟友就會一直存在。再次使用「眾生之力」護甲能力，即可免費操控這位盟友。
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=你的盟友發動攻擊！
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=你的盟友移動到那個位置。
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=你的盟友會跟隨你。
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=你可以透過特定的英雄護甲技能找到這個角色。
actors.hero.abilities.cleric.powerofmany$lightally.name=輕微的盟友
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=這位盟友已獲得「眾生之力」的強化，使其造成的傷害+25%%，受到的傷害-25%%。他們也會與牧師共享視野範圍，並能受益於「眾生之力」法術。 「眾生之力」的效果會在諸如棱鏡鏡像之類的盟友隱匿時持續存在，但其持續時間仍會繼續倒數計時。剩餘回合數：%s。
actors.hero.abilities.cleric.powerofmany$powerbuff.name=眾人的力量
actors.hero.abilities.cleric.powerofmany.ally_exists=你已經擁有了一位強大的盟友。
actors.hero.abilities.cleric.powerofmany.desc=牧師引導“眾生之力”，該技能可以強化一名現有盟友，或創造一名新的強化盟友，持續100回合。瞄準空位即可創造一個新的盟友。在「眾生之力」的強化下，任何盟友造成的傷害提高25%，受到的傷害降低25%，並與牧師共享視野。此外，該盟友在使用該技能時還會獲得25點護盾值。牧師也會獲得三個新的法術，這些法術只能在擁有強化盟友的情況下施放。 「眾生之力」的持續時間不會隨著這些法術的生效而結束。
actors.hero.abilities.cleric.powerofmany.name=眾人的力量
actors.hero.abilities.cleric.powerofmany.no_vision=你無法瞄準你看不見的位置。
actors.hero.abilities.cleric.powerofmany.only_allies=你只能賦能盟友。
actors.hero.abilities.cleric.powerofmany.prompt_ally=引導你的光盟友
actors.hero.abilities.cleric.powerofmany.prompt_default=選擇盟友或地點
actors.hero.abilities.cleric.powerofmany.short_desc=牧師引導“眾生之力”，增強現有盟友的力量或創造新的盟友。
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=分配給身體形式
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=賦予心靈形態
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=賦予靈體形態
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=選擇要賦予三位一體的效果。確認前將顯示更多資訊。
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_身體形態：%s。 _
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=心智形態：%s。
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_靈體形態：%s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=選擇使用哪種形式的三位一體。不同形式的效果可以同時生效。
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=三位一體將施放此神器遠程煉金術效果，消耗_%2$s點能量。
actors.hero.abilities.cleric.trinity.chaliceofblood_use=三位一體將以消耗_%2$s能量的方式，使此神器被動恢復生命值，持續20回合，恢復量為_+%1$d_。
actors.hero.abilities.cleric.trinity.cost=這項能力的充能成本各不相同，但最常見的是_%d。 _
actors.hero.abilities.cleric.trinity.desc=牧師獲得一套名為「三位一體」的護甲能力，可透過三個新法術將其賦予不同的物品效果。這三個法術分別模擬牧師在本次遊戲過程中發現的不同類型裝備的效果：肉體形態（武器和護甲）、心靈形態（魔杖和投擲武器）以及精神形態（戒指和神器）。每種「三位一體」形態一次只能賦予一種效果，牧師在使用「三位一體」時可以選擇啟動哪一種效果。 「三位一體」不會複製你已裝備的物品的效果。
actors.hero.abilities.cleric.trinity.driedrose_use=三位一體將使用此神器的效果召喚一個被腐化的友方幽靈，其生命值相當於一個_+%1$d_幽靈，消耗_%2$s點能量。
actors.hero.abilities.cleric.trinity.ench_glyph_use=三位一體將施加此效果，持續_%1$d回合_，消耗_%2$s能量。
actors.hero.abilities.cleric.trinity.etherealchains_use=三位一體將以_+%1$d_的施法距離施放此神器連鎖施法效果，消耗_%2$s點能量。
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity 將使用此神器進行吞噬效果，代價為 _%2$s 點數。 _
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=三位一體將以消耗_%2$s點能量為代價，施加_+%1$d_的敵方掠奪效果。
actors.hero.abilities.cleric.trinity.name=三位一體
actors.hero.abilities.cleric.trinity.no_duplicate=三位一體無法複製你已經裝備的效果！
actors.hero.abilities.cleric.trinity.no_imbue=三位一體目前沒有任何形態的效果，請使用它的法術之一！
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=三位一體將以消耗 1 點能量為代價，施加此強大效果，持續 10 回合。
actors.hero.abilities.cleric.trinity.ring_use=三位一體將以消耗_%2$s能量的方式，在_+%1$d_回合內施加此戒指的效果。
actors.hero.abilities.cleric.trinity.sandalsofnature_use=三位一體將施加此神器根部效果，並隨機分配一個有害種子，消耗_%2$s點能量。
actors.hero.abilities.cleric.trinity.short_desc=牧師獲得了三位一體的能力，這些能力可以模擬他們所見過的裝備，並且可以透過使用新的法術來分配。
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity 將套用此神器插入效果，消耗 _%2$s 點數。 _
actors.hero.abilities.cleric.trinity.talismanofforesight_use=三位一體將以_+%1$d_的法術力消耗_%2$s點數來施放此神器占卜效果。
actors.hero.abilities.cleric.trinity.thrown_use=Trinity會以消耗_%2$s點能量的方式將此武器投擲向_+%1$d_。
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=三位一體會施加此神器的時間凍結效果，持續_%1$d_回合，消耗_%2$s點能量。
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity 將套用此神器隨機捲軸效果，有 _%1$d/10_ 的幾率免費提供異域版本，但需支付 _%2$s 費用。
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity 將以 +%1$d 的能量消耗這根多重充能魔杖，能量值為 %2$s。
actors.hero.abilities.cleric.trinity.wand_use=Trinity 將以 _%2$s 的費用，在 _+%1$d_ 處使用這根魔杖。
actors.hero.abilities.duelist.challenge$duelparticipant.desc=該角色正在參與決鬥。該角色及其盟友或隨從可以正常行動，而其他角色則被凍結。決鬥將持續一段固定的時間，直到一方死亡，或雙方移動距離超過 5 格。剩餘回合數：
actors.hero.abilities.duelist.challenge$duelparticipant.name=決鬥參與者
actors.hero.abilities.duelist.challenge.ally_target=你只能挑戰敵人。
actors.hero.abilities.duelist.challenge.already_dueling=你一次只能進行一場決鬥。
actors.hero.abilities.duelist.challenge.desc=決鬥者向附近的敵人發動決鬥挑戰。該敵人被迫與她戰鬥，而其他所有敵人則暫時被凍結在時間中。目標必須在決鬥者的攻擊範圍內，距離在決鬥者5格以內。決鬥持續10回合，直到敵人死亡，或決鬥者與敵人之間的距離超過5格。被凍結的敵人處於無敵狀態。決鬥者的盟友不會受到此技能的影響，但如果目標是首領，其手下也不會被凍結。
actors.hero.abilities.duelist.challenge.distant_target=那個敵人距離太遠，無法挑戰。
actors.hero.abilities.duelist.challenge.name=挑戰
actors.hero.abilities.duelist.challenge.prompt=選擇一個敵人來挑戰
actors.hero.abilities.duelist.challenge.short_desc=決鬥者向附近的敵人發動決鬥挑戰，暫時凍結所有其他敵人。
actors.hero.abilities.duelist.challenge.unreachable_target=你必須能夠達成目標。
actors.hero.abilities.duelist.elementalstrike.desc=決鬥者攻擊敵人或目標區域，進行一次必定命中的普通攻擊，並散播一個魔法效果，該效果以65度錐形範圍傳播，最多可達4格。此魔法效果會根據決鬥者主武器上的附魔而有所不同。
actors.hero.abilities.duelist.elementalstrike.generic_desc=沒有附魔的元素攻擊會釋放一小股魔法，對範圍內的所有敵人造成 6-12 點傷害。
actors.hero.abilities.duelist.elementalstrike.name=元素打擊
actors.hero.abilities.duelist.elementalstrike.short_desc=決鬥者施展元素打擊，依武器附魔效果，在錐形範圍內散播效果。
actors.hero.abilities.duelist.feint.bad_location=你不能搬到那個地方。
actors.hero.abilities.duelist.feint.desc=決鬥者在衝刺到相鄰方格時佯裝攻擊，留下一個短暫的殘影。原本攻擊決鬥者的敵人會轉而攻擊她的殘影。攻擊殘影的敵人會陷入混亂狀態，取消其下一次行動，並使其容易受到突襲。
actors.hero.abilities.duelist.feint.name=佯攻
actors.hero.abilities.duelist.feint.prompt=選擇一個地點衝刺
actors.hero.abilities.duelist.feint.short_desc=決鬥者使用佯攻，在衝刺到鄰近格子的同時假裝攻擊。敵人會攻擊她的殘影，從而露出破綻，讓她有機會反擊。
actors.hero.abilities.duelist.feint.too_far=那個地點離你並不相鄰。
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=女獵手短暫獲得強化，提升她的移動速度和弓箭攻擊速度。剩餘回合數：\n\n。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=大自然的力量
actors.hero.abilities.huntress.naturespower.desc=女獵手暫時以自然之力強化自身與弓箭！此效果持續8回合。在此期間，女獵手的移動速度提升2倍，弓箭攻擊速度提升33%。如果狙擊手正在使用特殊攻擊，則弓箭的強化效果不會觸發。
actors.hero.abilities.huntress.naturespower.name=大自然的力量
actors.hero.abilities.huntress.naturespower.short_desc=女獵手召喚_自然之力_，在短時間內提高移動速度和弓箭射速。
actors.hero.abilities.huntress.spectralblades.desc=女獵手向敵人投擲出一把幽靈利刃，其效果如同使用近戰武器進行遠程攻擊。近戰武器的所有常規效果都會被激活，包括附魔效果。
actors.hero.abilities.huntress.spectralblades.name=光譜刀片
actors.hero.abilities.huntress.spectralblades.short_desc=女獵手向目標投擲_幽靈之刃_，根據她目前裝備的近戰武器造成傷害。
actors.hero.abilities.huntress.spirithawk$hawkally.desc=一隻由女獵手召喚的魔法鷹。它散發著明亮的空靈藍光，頭部不斷轉動，環顧四周。雖然它並不擅長戰鬥，但它的速度和視力使它成為偵察和分散敵人注意力的絕佳選擇。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=剩餘的保證閃避次數：%d。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=剩餘圈數：%d。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=你的鷹準備攻擊！
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=你的鷹飛到了那個位置。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=你的鷹會跟著你飛。
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=你可以透過特定的英雄護甲技能找到這個角色。
actors.hero.abilities.huntress.spirithawk$hawkally.name=靈鷹
actors.hero.abilities.huntress.spirithawk.desc=獵人召喚一隻靈鷹夥伴，召喚期間可再次使用該技能來操控它。靈鷹持續100回合，操控靈鷹不消耗任何能量。靈鷹生命值和攻擊力較低，但速度快、身手敏捷且精準。它始終與獵人共享整個視野。它免疫所有範圍效果，例如火焰和毒氣。除非受到明確指示，否則它不會主動攻擊。
actors.hero.abilities.huntress.spirithawk.name=靈鷹
actors.hero.abilities.huntress.spirithawk.no_space=您附近沒有空位。
actors.hero.abilities.huntress.spirithawk.short_desc=女獵手召喚一隻_靈鷹_使魔，它可以幫助她偵察位置並分散敵人的注意力。
actors.hero.abilities.mage.elementalblast.desc=法師釋放出一道魔法衝擊波，覆蓋半徑最多4格的圓形區域，造成15-25點傷害。元素衝擊波的具體效果取決於法師法杖上附魔的魔杖類型。
actors.hero.abilities.mage.elementalblast.generic_desc=元素爆破的效果與用魔杖攻擊敵人或盟友時的效果類似。
actors.hero.abilities.mage.elementalblast.name=元素爆破
actors.hero.abilities.mage.elementalblast.no_staff=沒有你的法師，你無法使用這項能力。
actors.hero.abilities.mage.elementalblast.short_desc=法師從他的法杖中發出元素衝擊波，覆蓋他周圍的大片區域，其效果會根據他法杖中的魔杖而變化。
actors.hero.abilities.mage.warpbeacon.depths=你無法在不同的深度之間進行傳送！
actors.hero.abilities.mage.warpbeacon.desc=法師放置一個信標，之後可以隨意傳送至該信標處。放置信標需要1回合，但傳送至該信標處是瞬間完成的。預設情況下，法師無法在樓層之間傳送，也無法使用信標到達無法進入的地方，例如鎖著的房間。法師可以傳送至敵人身邊，將他們推開。
actors.hero.abilities.mage.warpbeacon.invalid_beacon=你不能在那裡放置信標！
actors.hero.abilities.mage.warpbeacon.locked_floor=你不能離開已上鎖的樓層！
actors.hero.abilities.mage.warpbeacon.name=躍遷信標
actors.hero.abilities.mage.warpbeacon.short_desc=法師在目前位置放置一個_傳送信標_，他可以立即傳送回該位置。
actors.hero.abilities.mage.warpbeacon.too_far=那個地方太遠了！
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.window_clear=清楚的信標
actors.hero.abilities.mage.warpbeacon.window_desc=您的信標目前位於 %d 層。
actors.hero.abilities.mage.warpbeacon.window_tele=傳送至信標
actors.hero.abilities.mage.wildmagic.desc=法師釋放魔杖中的力量，在一回合內隨機發射最多4次。法師的法杖不參與此效果。每根魔杖的等級提升2級，最高可達+3。每次發射消耗半點魔杖能量，每根魔杖最多只能發射2次。
actors.hero.abilities.mage.wildmagic.name=狂野魔法
actors.hero.abilities.mage.wildmagic.no_wands=你沒有魔杖可以用來施法！
actors.hero.abilities.mage.wildmagic.short_desc=法師釋放魔杖中蘊含的狂野魔法，在一回合內隨機多次向選定的目標發射魔杖。
actors.hero.abilities.ratmogrify$transmograt.desc=這個敵人已經變成一隻老鼠了。依我看，這可是個巨大的進步！ ——鼠王
actors.hero.abilities.ratmogrify$transmograt.name=鼠化 %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=被下列敵人殺死：鼠形敵人
actors.hero.abilities.ratmogrify.cant_transform=你不能把那東西變成老鼠！
actors.hero.abilities.ratmogrify.desc=英雄將一名敵人變成老鼠，持續6回合！首領、盟友和老鼠都無法被鼠化。被鼠化的敵人保留其原有屬性，但沒有任何技能。
actors.hero.abilities.ratmogrify.name=鼠形
actors.hero.abilities.ratmogrify.short_desc=英雄可以使用「鼠化」技能將敵人變成一隻老鼠！這會暫時將敵人變成一隻失去所有能力的老鼠。
actors.hero.abilities.ratmogrify.too_strong=那個敵人太強大了，無法被鼠化！
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=該敵人已被標記，使其受到 25%% 額外傷害，但同時也使其在標記結束前不會死亡。剩餘回合數：%s。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=被標記為死亡
actors.hero.abilities.rogue.deathmark.ally_target=你只能標記敵人
actors.hero.abilities.rogue.deathmark.desc=盜賊會在選定的敵人身上施加一個標記，使其受到的傷害額外增加25%。標記立即生效，持續5回合。被標記的敵人會受到額外傷害，但在標記消失前不會死亡。如果敵人在標記結束時生命值為0，則會立即死亡。
actors.hero.abilities.rogue.deathmark.name=死亡標記
actors.hero.abilities.rogue.deathmark.short_desc=盜賊會在選定的敵人身上施加一個「死亡印記」。被標記的敵人會受到額外傷害，但在印記消失前不會死亡。
actors.hero.abilities.rogue.shadowclone$shadowally.desc=由陰影黑暗構成的盜賊複製品。它一動不動地站著，雙眼空洞，縷縷黑暗如同蒸氣般從它身上升騰而起。這個複製品並非盜賊的完美複製品，但仍然是一位不錯的戰士，如果天賦合適，還能從盜賊的裝備中獲益。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=你的克隆體準備攻擊！
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=你的克隆體移動到那個位置。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=你的克隆體會跟著你移動。
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=你可以透過特定的英雄護甲技能找到這個角色。
actors.hero.abilities.rogue.shadowclone$shadowally.name=暗影盜賊
actors.hero.abilities.rogue.shadowclone.desc=盜賊召喚一個自己的影子分身，可以指揮它協助自己戰鬥。指揮影子分身不消耗任何能量。分身擁有80點生命值，沒有護甲，每次攻擊造成10-20點傷害。所有這些屬性都可以透過天賦來強化，使分身能夠受益於英雄所裝備的武器和護甲。
actors.hero.abilities.rogue.shadowclone.name=影子複製
actors.hero.abilities.rogue.shadowclone.short_desc=盜賊可以召喚一個暗影分身，並指揮它協助自己進行戰鬥。
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=不知何故，敵人很容易就相信這個木製誘餌才是真正的盜賊！
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=你可以透過特定的英雄護甲技能找到這個角色。
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木製誘餌
actors.hero.abilities.rogue.smokebomb.desc=盜賊投擲煙霧彈，閃現至多6格遠。他可以穿過障礙物和敵人，但無法穿過牆壁等實體地形。與盜賊原位置相鄰的敵人將被致盲5回合。
actors.hero.abilities.rogue.smokebomb.fov=你只能跳到視野範圍內的空位。
actors.hero.abilities.rogue.smokebomb.name=煙霧彈
actors.hero.abilities.rogue.smokebomb.prompt=選擇要跳到的位置
actors.hero.abilities.rogue.smokebomb.short_desc=盜賊在閃現離開的同時投擲了一枚煙霧彈。他會使原位置附近的敵人暫時失明。
actors.hero.abilities.warrior.endure$enduretracker.desc=戰士現在會根據他所受到的傷害造成額外傷害。額外傷害：剩餘攻擊次數：
actors.hero.abilities.warrior.endure$enduretracker.name=耐力
actors.hero.abilities.warrior.endure.desc=戰士持續忍耐3回合，受到的所有傷害減半。此減傷效果在護甲等傷害減免效果生效前計算。忍耐結束後，戰士在接下來的10回合內受到的下一次攻擊將獲得額外傷害。此額外傷害等於忍耐期間所有傷害的一半（不計任何傷害減免效果）！如果戰士擁有連擊，使用此技能將使其剩餘持續時間延長3回合。
actors.hero.abilities.warrior.endure.name=忍受
actors.hero.abilities.warrior.endure.short_desc=戰士會“忍耐”，跳過幾個回合，但獲得極高的傷害抗性。然後，他會根據自己承受的傷害量造成額外傷害。
actors.hero.abilities.warrior.heroicleap.desc=戰士躍向目標位置，越過沿途的敵人或障礙物。但他無法躍過牆壁或其他堅硬地形。
actors.hero.abilities.warrior.heroicleap.name=英勇一躍
actors.hero.abilities.warrior.heroicleap.prompt=選擇跳躍方向
actors.hero.abilities.warrior.heroicleap.short_desc=戰士向目標位置進行_英雄跳躍_，飛躍敵人和危險物。
actors.hero.abilities.warrior.shockwave.desc=戰士猛擊地面，產生一道衝擊波，以60度錐形範圍傳播至多5格。被衝擊波擊中的敵人將癱瘓5回合。他們還會受到5-10點傷害，此外，戰士每超過10點力量值，還會額外受到1-2點傷害。
actors.hero.abilities.warrior.shockwave.name=衝擊波
actors.hero.abilities.warrior.shockwave.short_desc=戰士猛擊地面，釋放錐形範圍的衝擊波。被衝擊波擊中的敵人會受到傷害並陷入殘廢狀態。
actors.hero.hero.key_distracted=你打不開鎖，得繼續嘗試。
actors.hero.hero.leave=你還不能離開，地牢的其餘部分還在下方等著你！
actors.hero.hero.level_cap=你無法變得更強壯，但你的經驗確實會帶給你強大的力量！
actors.hero.hero.level_up=升級！
actors.hero.hero.locked_chest=這個箱子上了鎖，你沒有匹配的鑰匙。
actors.hero.hero.locked_door=您沒有匹配的鑰匙。
actors.hero.hero.name=你
actors.hero.hero.new_level=升級！命中率+，閃避率+，生命值+5！
actors.hero.hero.new_talent=+1 天賦點數！
actors.hero.hero.noticed_smth=你注意到了一些事情。
actors.hero.hero.pain_resist=疼痛能幫助你抵抗睡意。
actors.hero.hero.revive=生命之符迸發出賦予生命的能量！
actors.hero.hero.search=搜尋
actors.hero.hero.search_distracted=很難集中註意力，搜尋很累人。
actors.hero.hero.unspent=你還有未使用的天賦點數！
actors.hero.hero.wait=……
actors.hero.hero.you_cant_have=你不能攜帶：%s。
actors.hero.hero.you_now_have=你撿到了：%s。
actors.hero.heroclass.cleric=牧師
actors.hero.heroclass.cleric_desc=牧師初始擁有一本獨特的聖典，可用於施放各種法術。牧師的大部分天賦都集中在學習或升級法術上。此外，牧師初始還擁有一根木棒、布甲、一個水囊和一個天鵝絨袋。牧師會自動鑑定以下物品：鑑定捲軸、淨化藥水和移除詛咒捲軸。
actors.hero.heroclass.cleric_desc_short=牧師是神聖法術施放者，他們使用獨特的聖典來引導神聖魔法。他們可以透過天賦來學習和升級法術。
actors.hero.heroclass.cleric_unlock=要解鎖牧師職業，請徹底清除任何一件被詛咒裝備上的詛咒。
actors.hero.heroclass.duelist=決鬥者
actors.hero.heroclass.duelist_desc=決鬥者初始裝備一把獨特的細劍，擁有隨時間充能的特殊能力。遊戲中每種武器都有不同的特殊能力，供決鬥者使用。決鬥者初始還擁有兩根投擲尖刺、布甲、水囊和天鵝絨袋。決鬥者會自動鑑定以下物品：鑑定捲軸、力量藥水和鏡像捲軸。
actors.hero.heroclass.duelist_desc_short=決鬥者是一位武器大師，她可以使用自己的武器觸發一種特殊的武器能力。這種特殊能力因武器而異。
actors.hero.heroclass.duelist_unlock=要解鎖決鬥者職業，_裝備一把2級或更高階且無力量懲罰的武器。 _
actors.hero.heroclass.huntress=女獵人
actors.hero.heroclass.huntress_desc=女獵手初始擁有一把獨特的靈弓，可以發射無限數量的召喚箭矢。女獵手可以穿過高草叢而不會踩踏它們。女獵人初始還擁有鑲釘手套、布甲、水囊和天鵝絨小袋。女獵手會自動鑑定：鑑定捲軸、心靈視覺藥水和催眠捲軸。
actors.hero.heroclass.huntress_desc_short=女獵手精通投擲武器，擁有一把箭矢無限的魔法弓。她還能穿過高高的草叢，而不會踩踏草叢。
actors.hero.heroclass.huntress_unlock=解鎖女獵手：在一局遊戲中用投擲武器擊中敵人 10 次。
actors.hero.heroclass.mage=法師
actors.hero.heroclass.mage_desc=法師初始擁有一根獨特的法杖，其充能速度遠超魔杖，且充能次數也多一次。法師可以在地牢中找到任何魔杖並將其附魔到這根法杖上。此外，法師初始還擁有附魔於法杖上的魔法飛彈魔杖、布甲、水囊和天鵝絨小袋。法師會自動鑑定以下物品：鑑定捲軸、液態火焰藥水和升級捲軸。
actors.hero.heroclass.mage_desc_short=這位法師精通奧術，他擁有一根比魔杖更強大的魔法杖。這根魔法杖可以吸收法師找到的任何魔杖的力量。
actors.hero.heroclass.mage_unlock=若要解鎖法師，請使用升級捲軸來強化物品。
actors.hero.heroclass.rogue=流氓
actors.hero.heroclass.rogue_desc=盜賊初始擁有獨特的暗影斗篷，可以隨意隱身。盜賊還能從更遠的距離偵測到秘密和陷阱。此外，盜賊初始還擁有匕首、三把飛刀、布甲、水袋和天鵝絨袋。盜賊會自動鑑定以下物品：鑑定捲軸、隱形藥水和魔法地圖捲軸。
actors.hero.heroclass.rogue_desc_short=盜賊可以利用他的「暗影斗篷」來躲避敵人並從隱身狀態發動攻擊。他還可以從更遠的距離「偵測到秘密和陷阱」。
actors.hero.heroclass.rogue_unlock=解鎖「叛逆者」角色，需要在單局遊戲中完成10次突襲。
actors.hero.heroclass.warrior=戰士
actors.hero.heroclass.warrior_desc=戰士初始擁有一件獨特的破損封印，當生命值低於一半時，封印會為其提供短暫的護盾效果。該封印可以在不同盔甲間轉移，並且可以轉移一項升級。戰士初始還擁有一把破舊的短劍、三塊投擲石、布甲、一個水囊和一個天鵝絨袋。戰士會自動鑑定以下物品：鑑定捲軸、治療藥水和狂怒捲軸。
actors.hero.heroclass.warrior_desc_short=戰士的護盾由其破碎的封印提供，可以承受額外傷害。該封印可以在盔甲之間轉移，並轉移一次升級。
actors.hero.heroclass.warrior_unlock=戰士角色自動解鎖。
actors.hero.herosubclass.assassin=刺客
actors.hero.herosubclass.assassin_desc=刺客隱身時會準備下一次攻擊。準備時間越長，下一次攻擊威力越大。準備時間最多可累積9回合。準備完畢後，刺客的下一次攻擊將造成額外傷害，可以瞬間移動到目標身邊，甚至可以瞬間擊殺足夠弱小的敵人。
actors.hero.herosubclass.assassin_short_desc=刺客可以在隱身狀態下準備致命一擊。等待的時間越長，攻擊威力越大。
actors.hero.herosubclass.battlemage=戰鬥法師
actors.hero.herosubclass.battlemage_desc=戰鬥法師每次使用法杖進行近戰攻擊時，都會獲得額外效果，如同法杖附有額外魔法一般。這些效果取決於法杖所附魔的魔杖類型，每根魔杖都有其獨特的效果。除了魔杖效果之外，戰鬥法師每次使用法杖攻擊時，法杖還會獲得0.5層充能。
actors.hero.herosubclass.battlemage_short_desc=戰鬥法師在使用法杖進行近戰時會施放額外效果。這些效果取決於法杖所附魔的魔杖。
actors.hero.herosubclass.berserker=狂戰士
actors.hero.herosubclass.berserker_desc=狂戰士受到物理傷害時會累積怒氣，即使是被護甲格擋的傷害也會積攢怒氣！怒氣會隨時間逐漸消退，但生命值越低，消退速度越慢。怒氣可使狂戰士的傷害提升至多50%。當怒氣達到最大值時，狂戰士會進入狂暴狀態，獲得短暫的護盾效果，並且只要護盾還在，怒氣就會持續存在。護盾效果與狂戰士的護甲等級成正比，生命值越低，護盾效果越強。狂戰士進入狂暴狀態後需要一段時間才能恢復。
actors.hero.herosubclass.berserker_short_desc=狂戰士受到傷害時會累積怒氣。怒氣可以提升他的傷害，並在怒氣達到100%時激活，提供額外的護盾。
actors.hero.herosubclass.champion=冠軍
actors.hero.herosubclass.champion_desc=冠軍精通近戰武器，除了主武器外，還可以裝備副武器。她的普通攻擊使用主武器，但她可以瞬間切換主武器並使用兩把武器的技能。此外，她還會獲得2層額外武器技能充能，以及50%的武器技能充能速度提升。
actors.hero.herosubclass.champion_short_desc=冠軍角色可以同時使用兩把武器，並且擁有更多武器充能次數。她的普通攻擊使用主武器，但她可以切換武器並使用其中一把武器的技能。
actors.hero.herosubclass.freerunner=自由奔跑者
actors.hero.herosubclass.freerunner_desc=自由奔跑者移動時會累積動量。奔跑10回合後最多可累積10點動量，但一旦停止移動，動量就會迅速消失。自由奔跑者可以消耗動量來進入自由奔跑狀態，每點動量可持續2回合。自由奔跑時，自由奔跑者的移動速度提升2倍，並獲得與等級成正比的額外閃避加成。自由奔跑結束後，需要等待一段時間才能再次累積動量。
actors.hero.herosubclass.freerunner_short_desc=自由跑者在跑步過程中會積蓄動能，可以用來發動自由跑。自由跑能讓他短時間內獲得速度與閃避能力的提升。
actors.hero.herosubclass.gladiator=角鬥士
actors.hero.herosubclass.gladiator_desc=角鬥士每次使用近戰或投擲武器成功攻擊時，都會累積一點連擊數。如果角鬥士在5回合內（擊殺後15回合）沒有成功攻擊，則連擊數重置。角鬥士累積連擊數時，可使用多種必定命中的技能：連擊2：擊退敵人，保留連擊數；連擊4：造成基於護甲的傷害；連擊6：格擋，保留連擊數；連擊8：對目標及其附近敵人造成傷害；連擊10：每積累一點連擊數，即可進行一次攻擊。
actors.hero.herosubclass.gladiator_short_desc=角鬥士透過成功攻擊累積連擊數。他可以消耗連擊數來使用特殊技能。
actors.hero.herosubclass.monk=僧侶
actors.hero.herosubclass.monk_desc=這位武僧精通體術。她擊敗敵人後會獲得能量，這些能量可用於各種防禦和輔助技能。能量不會隨時間消散，但會根據武僧的等級達到上限。 \n\n1 能量：快速揮拳攻擊；\n2 能量：集中精神躲避下一次攻擊；\n3 能量：瞬間向附近衝刺；\n4 能量：踢開敵人；\n5 ：冥想能量
actors.hero.herosubclass.monk_short_desc=武僧在戰鬥中累積能量。這些能量可以用來施展各種獨特的技能。
actors.hero.herosubclass.paladin=聖騎士
actors.hero.herosubclass.paladin_desc=聖騎士獲得了一系列全新升級的法術，這些法術強調近戰以及與武器和盔甲的協同作用。聖騎士的「聖武器」和「聖盾」法術提供的加成更高，不再覆蓋現有的附魔和符文，並且可以透過施放其他法術來延長持續時間。聖騎士還獲得了「懲擊」法術，該法術可以讓他們進行一次必定命中的近戰攻擊，並附帶額外的傷害和附魔效果。
actors.hero.herosubclass.paladin_short_desc=聖騎士獲得了新的短程法術，以及強化版的聖武器和聖盾術。
actors.hero.herosubclass.priest=牧師
actors.hero.herosubclass.priest_desc=牧師獲得了一系列全新和升級的法術，這些法術強調遠程戰鬥以及與魔法物品的協同作用。牧師每50回合可以免費施放一次“指引之光”，照亮任何被其法術直接瞄準的敵人，並且可以與盟友、魔杖和一些神器一起消耗照明減益效果，造成相當於其等級+5的額外傷害。牧師也獲得了「光輝」法術，該法術驅散黑暗並影響所有可見的敵人，觸發並施加照明效果，並短暫眩暈他們，消耗2點充能。
actors.hero.herosubclass.priest_short_desc=牧師獲得了新的遠程法術和強化版的指引之光。
actors.hero.herosubclass.sniper=狙擊手
actors.hero.herosubclass.sniper_desc=狙擊手是遠程戰鬥大師，她的遠程攻擊可以穿透敵人的護甲。當她用投擲武器攻擊敵人時，會給敵人施加一個狙擊標記，使她能夠緊接著使用弓箭發動特殊攻擊。這個特殊攻擊會根據弓箭的強化程度而有所不同。未強化的弓箭會發射一發瞬射箭，傷害較低但瞬間完成。速射弓會發射三支箭矢，傷害較低，但仍能觸發附魔效果，需要1回合才能發射。傷害弓會發射一發必定命中的狙擊箭，傷害會根據距離而增加，需要2回合才能發射。
actors.hero.herosubclass.sniper_short_desc=狙擊手可以用遠程攻擊穿透敵人的護甲。她先用投擲武器攻擊，然後可以接上弓箭進行特殊攻擊。
actors.hero.herosubclass.warden=典獄長
actors.hero.herosubclass.warden_desc=守衛者與大自然有著緊密的聯繫，這賦予了她一系列與草和植物相關的額外效果。她能夠看穿高高的、溝壑縱橫的草叢，如同看到一片空曠的天空。守衛者投擲或種植的任何種子周圍都會長出青草，踐踏植物時也會獲得特殊效果。這些特殊效果會取代植物原本的效果，這意味著任何植物對她來說都不會造成傷害。
actors.hero.herosubclass.warden_short_desc=守衛者可以透過高高的草叢看到東西，並且在播種和踐踏植物時獲得額外效果。
actors.hero.herosubclass.warlock=術士
actors.hero.herosubclass.warlock_desc=術士使用魔杖攻擊角色時有幾率施加靈魂印記。施加靈魂印記的幾率和持續時間會隨著魔杖等級的提升而增加。當敵人被施加靈魂印記時，術士每對其造成5點傷害，就會回复2點生命值，但只能透過近戰或投擲武器攻擊回复，魔杖攻擊無效！
actors.hero.herosubclass.warlock_short_desc=術士有幾率用魔杖給敵人施加靈魂印記。每當他對被標記的敵人造成物理傷害時，他都會恢復生命值。
actors.hero.spells.auraofprotection$aurabuff.desc=聖騎士周身散發保護能量。附近任何盟友（包括聖騎士本身）受到的傷害減少，並獲得聖騎士護甲符文的效果，且效果增強。剩餘回合數：。
actors.hero.spells.auraofprotection$aurabuff.name=保護光環
actors.hero.spells.auraofprotection.desc=聖騎士開始散發出閃耀的保護能量光環，持續20回合。聖騎士周圍2格內的任何盟友（包括自身）受到的傷害減少%1$d%%，並獲得聖騎士護甲符文+%2$d%%的效果。此傷害減免效果優先於其他減傷效果（例如護甲）。符文效果的提升始終生效，但如果角色已經受益於此符文（例如聖騎士本身或其棱鏡鏡像），則此法術無法使聖騎士的符文效果重複生效。
actors.hero.spells.auraofprotection.name=保護光環
actors.hero.spells.auraofprotection.short_desc=提升聖騎士和附近盟友的防禦力。
actors.hero.spells.beamingray$beamingrayboost.desc=該盟友最近被光束射線傳送，傳送後對最近的敵人造成額外傷害。 「眾生之力」在此增益效果啟動期間也不會消失。剩餘回合數：\n\n。
actors.hero.spells.beamingray$beamingrayboost.name=光束
actors.hero.spells.beamingray.desc=牧師將盟友身上的力量轉化為光束，將其傳送至指定位置。若光束與敵人碰撞，則會將盟友傳送至附近並引導其攻擊敵人。光束最大射程為 0 格，並使「眾生之力」的額外傷害提升 10 回合，作用於 4 格範圍內最近的敵人。光束甚至可以傳送原本無法移動的盟友，但此時其射程減半。
actors.hero.spells.beamingray.name=光束
actors.hero.spells.beamingray.no_space=那裡沒有你盟友出現的位置。
actors.hero.spells.beamingray.out_of_range=此位置超出範圍。
actors.hero.spells.beamingray.short_desc=傳送你的盟友並給予額外傷害。
actors.hero.spells.blessspell.desc=牧師對自己或視線範圍內的其他角色施加神聖祝福。對自己施放時效果較弱，提供 0 回合祝福和 1 個屏障。對其他角色施放時效果更強，提供 2 回合祝福和 3 個治療。多餘的治療量會轉化為屏障。
actors.hero.spells.blessspell.name=保佑
actors.hero.spells.blessspell.short_desc=祝福與護盾牧師，祝福並治療他人。
actors.hero.spells.bodyform$bodyformbuff.desc=三位一體的形態目前賦予你一種附魔或符文的力量，如同你已將其裝備在當前的武器或盔甲上一樣。請注意，此形態無法提供你已受益效果的重複效果。目前效果：剩餘回合數：
actors.hero.spells.bodyform$bodyformbuff.name=體型
actors.hero.spells.bodyform.desc=牧師選擇本次輪迴中已鑑定的附魔或符文，並將其效果賦予三位一體。當三位一體被使用時，牧師獲得所選附魔或符文的效果，持續 %d 回合。此臨時附魔或符文可與任何普通附魔或符文的效果疊加。此法術會替換三位一體目前所擁有的任何其他身體效果。
actors.hero.spells.bodyform.name=體型
actors.hero.spells.bodyform.short_desc=將三位一體賦予魔法或符文。
actors.hero.spells.cleanse.desc=牧師清除自身及可見盟友身上的所有有害狀態效果。法術結束後，所有受影響的角色還將獲得 %1$d 回合的減益免疫效果，以及 %2$d 護盾。
actors.hero.spells.cleanse.name=潔淨
actors.hero.spells.cleanse.short_desc=清除減益效果並提供護盾。
actors.hero.spells.clericspell.charge_cost=費用：%d
actors.hero.spells.clericspell.invalid_enemy=你不能鎖定那個敵人。
actors.hero.spells.clericspell.invalid_target=你無法指定該位置。
actors.hero.spells.clericspell.no_target=那裡沒有目標。
actors.hero.spells.clericspell.prompt=選擇目標
actors.hero.spells.divineintervention.desc=牧師將法典中的大量力量注入自身和盟友體內，為所有人提供%1$d護盾，並將昇華形態的持續時間延長%2$d回合。此法術強大的防禦力與其極高的充能消耗相權衡。 \n\n與其他昇華形態提供的護盾一樣，此護盾不會正常衰減，而是在昇華形態結束時立即消失。
actors.hero.spells.divineintervention.name=神靈幹預
actors.hero.spells.divineintervention.short_desc=大幅提升牧師及其盟友的護盾值。
actors.hero.spells.divinesense$divinesensetracker.desc=該角色暫時能夠用心靈感應看到附近的其他生物！剩餘回合數：\n\n。
actors.hero.spells.divinesense$divinesensetracker.name=神聖的感知
actors.hero.spells.divinesense.desc=牧師集中感官觀察周圍環境，獲得範圍為 %d 格的心靈視覺，持續 50 回合。此法術無需施法時間。
actors.hero.spells.divinesense.name=神聖的感知
actors.hero.spells.divinesense.short_desc=獲得大範圍的暫時性視覺體驗。
actors.hero.spells.flash.desc=牧師在附近地點引導其昇華形態並傳送至該處。 「閃現」法術可以將牧師傳送至範圍內任何已發現且無人佔據的地點。每次以同一昇華形態使用此法術，消耗的法術書能量都會增加。
actors.hero.spells.flash.name=閃光
actors.hero.spells.flash.prompt=選擇地點
actors.hero.spells.flash.short_desc=傳送至附近地點。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=50回合後，牧師將能夠再次免費施放「指引之光」。剩餘回合數：\n\n。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=指路明燈
actors.hero.spells.guidinglight$illuminated.desc=這個角色因受到指引之光的照射而散發出光芒。雖然這光芒不足以照亮周圍區域，但這種魔法效果會讓牧師更容易擊中目標。
actors.hero.spells.guidinglight$illuminated.desc_generic=其他英雄仍然可以使用照明來受益於灼熱之光天賦，但不會獲得任何命中率加成。
actors.hero.spells.guidinglight$illuminated.desc_priest=牧師也可以利用光輝、魔杖電擊、盟友的打擊或某些神器的效果來吸收光輝。以這種方式使用光輝會造成相當於牧師等級+5的額外魔法傷害。
actors.hero.spells.guidinglight$illuminated.name=照明
actors.hero.spells.guidinglight.desc=牧師發射一道魔法能量束擊中目標，造成2-8點傷害並使其發光。下一次對被發光的敵人進行的非負重物理攻擊必定命中。
actors.hero.spells.guidinglight.desc_priest=由牧師施放此法術時威力更強。每50回合首次施放此法術無需消耗法術書能量，且光輝、魔杖、其他角色以及直接影響敵人的神器都會消耗光輝。以此方式使用光輝時，會造成相當於牧師等級+5的額外魔法傷害。
actors.hero.spells.guidinglight.name=指路明燈
actors.hero.spells.guidinglight.short_desc=造成遠程魔法傷害，並保證命中。
actors.hero.spells.hallowedground$hallowedterrain.desc=這裡已聖化。聖地能減緩敵人的速度，治療盟友，並使草地蔓延。
actors.hero.spells.hallowedground.desc=牧師將神聖魔法集中於附近的地面，創造一片持續20回合的神聖區域。施放此法術時，所有友軍恢復15點生命值（健康的友軍和牧師獲得護盾），短暫地束縛敵人，並長出矮草。神聖區域每回合恢復友軍1點生命值（健康的友軍和牧師獲得護盾），削弱敵人，並隨機長出高草。神聖區域會被火焰摧毀，如果被動回復效果被禁用或牧師長時間未獲得經驗值，則會產生溝壑草。
actors.hero.spells.hallowedground.name=聖地
actors.hero.spells.hallowedground.prompt=選擇地點
actors.hero.spells.hallowedground.short_desc=治療友軍，減緩敵人速度，並在範圍內散播青草。
actors.hero.spells.holyintuition.cursed=你感覺到這件物品中潛藏著邪惡的魔法。
actors.hero.spells.holyintuition.desc=牧師將感官集中在一件物品上，無需裝備即可判斷該物品是否被詛咒。
actors.hero.spells.holyintuition.name=神聖直覺
actors.hero.spells.holyintuition.prompt=選擇一件商品
actors.hero.spells.holyintuition.short_desc=判斷一件物品是否被詛咒。
actors.hero.spells.holyintuition.uncursed=此物品不含邪惡魔法。
actors.hero.spells.holylance$lancecooldown.desc=牧師剛剛施放了聖槍術，必須等待一段時間才能再次施放。剩餘回合數：\n\n。
actors.hero.spells.holylance$lancecooldown.name=聖槍冷卻時間
actors.hero.spells.holylance.desc=牧師將大量能量凝聚成一枚威力巨大的光矛。這枚光矛造成 %1$d-%2$d 點傷害，並且對亡靈和惡魔目標始終造成最大傷害。 \n\n此法術消耗極高，冷卻時間為 30 回合。
actors.hero.spells.holylance.name=聖槍
actors.hero.spells.holylance.short_desc=造成大量遠程魔法傷害。
actors.hero.spells.holyward$holyarmbuff.desc=牧師已將神聖能量注入其破舊的盔甲中，暫時覆蓋任何現有的符文，使盔甲額外抵擋 1 點傷害。剩餘回合數：\n\n。
actors.hero.spells.holyward$holyarmbuff.desc_paladin=聖騎士已將神聖能量注入其磨損的盔甲，使盔甲額外抵擋 3 點傷害。在神聖護盾啟動期間施放其他法術，每消耗一次充能，其持續時間將延長 10 回合。剩餘回合數：
actors.hero.spells.holyward$holyarmbuff.name=聖潔病房
actors.hero.spells.holyward.desc=牧師將聖光符文注入其穿戴的盔甲，使盔甲的傷害格擋能力提高1點。此法術無需施法時間。該符文持續50回合，並在此期間覆蓋盔甲上任何增益符文。即使牧師沒有穿戴盔甲，也能獲得此效果。
actors.hero.spells.holyward.desc_paladin=聖騎士施放此法術時威力更強。額外格擋傷害增加至 3，法術不再涵蓋現有符文，且在聖潔守護啟動期間施放其他法術，每消耗一次充能，其持續時間將延長 10 回合。
actors.hero.spells.holyward.glyph_desc=這個符文可以稍微增加護甲能夠阻擋的傷害量。
actors.hero.spells.holyward.glyph_name=%s 光
actors.hero.spells.holyward.name=聖潔病房
actors.hero.spells.holyward.short_desc=暫時覆蓋符文效果以增強護甲格擋能力。
actors.hero.spells.holyweapon$holywepbuff.desc=牧師已將聖能注入其磨損的武器，暫時覆蓋任何現有的附魔，並使該武器每次攻擊額外造成 2 點魔法傷害。剩餘回合數：\n\n。
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=聖騎士已將聖能注入其穿戴的武器，使其攻擊額外造成 6 點魔法傷害。在聖武器啟動期間施放其他法術，每消耗 1 層充能，其持續時間將延長 10 回合。剩餘回合數：
actors.hero.spells.holyweapon$holywepbuff.name=聖武器
actors.hero.spells.holyweapon.desc=牧師以聖光能量附魔其穿戴的武器，使該武器每次攻擊敵人時額外造成2點魔法傷害。此法術無需施法時間。此附魔持續50回合，並會覆蓋武器上任何其他增益附魔。徒手攻擊也能受益於此效果。
actors.hero.spells.holyweapon.desc_paladin=聖騎士施放此法術時威力更強。額外魔法傷害提升至 6，法術不再涵蓋現有附魔，且在聖武器啟動期間施放其他法術，每消耗一次充能，其持續時間將延長 10 回合。
actors.hero.spells.holyweapon.ench_desc=被聖器擊中的敵人會受到額外的魔法傷害。
actors.hero.spells.holyweapon.ench_name=神聖的 %s
actors.hero.spells.holyweapon.name=聖武器
actors.hero.spells.holyweapon.short_desc=暫時覆蓋附魔效果以提升傷害。
actors.hero.spells.judgement.desc=牧師一拳擊地，引發一道光芒爆發，對所有可見的敵人造成傷害。基礎傷害為 %1$d-%2$d，此外，牧師自從進入昇華形態（或自上次施放「審判」）以來每施放一個法術，就會額外造成 33%% 的傷害。目前，「審判」的傷害為 %3$d-%4$d。
actors.hero.spells.judgement.name=判斷
actors.hero.spells.judgement.short_desc=對所有可見敵人造成傷害。
actors.hero.spells.layonhands.desc=聖騎士透過雙手引導神聖能量，治療或保護所觸及的一切。聖騎士可以對任何相鄰角色施放此法術，為其提供治療，或對自己施放此法術以獲得護盾。此法術多餘的治療量將轉化為護盾。此法術瞬發，可重複施放，但一次最多只能提供相當於三次施法效果的護盾。
actors.hero.spells.layonhands.name=為手按
actors.hero.spells.layonhands.short_desc=立即治療相鄰角色或為聖騎士提供護盾。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=牧師最近對這位盟友施放了生命連結。除了生命連結的常規效果外，該角色還會受到更少的傷害，任何牧師的增益法術都會同時作用於牧師和這位盟友，而不是只作用於其中一人，並且“眾生之力”在此增益效果生效期間不會消失。剩餘回合數：0。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=生命連結保護
actors.hero.spells.lifelinkspell.desc=牧師強化自身與其強化盟友之間的連結。在此強化連結下，英雄及其盟友在 %1$d 回合內將共同承受所有傷害，並且「眾生之力」的防禦加成將提升至 -%2$d%% 點傷害。請注意，傷害是在護甲之後、「眾生之力」減傷之前進行分攤的。 \n\n在此效果啟動期間，T3 或更低的牧師增益法術將同時作用於牧師及其盟友，如同這些法術原本只作用於其中一人一樣。
actors.hero.spells.lifelinkspell.name=生命連結
actors.hero.spells.lifelinkspell.short_desc=與盟友分擔傷害，並減少其所受的傷害。
actors.hero.spells.mindform.desc=牧師選擇一件本輪遊戲中已鑑定的魔杖或投擲武器，並將其效果賦予三位一體法術。當三位一體法術生效時，牧師可以進行一次攻擊，如同使用所選物品一般，攻擊力提升至+1。這將觸發使用該類型物品通常會觸發的所有效果。此法術會取代三位一體法術目前所附的任何其他精神效果。
actors.hero.spells.mindform.name=心形
actors.hero.spells.mindform.short_desc=將三位一體賦予魔杖或投擲武器。
actors.hero.spells.mnemonicprayer.desc=牧師唸禱文，將特定目標身上所有增益或減益效果的持續時間延長 %1$d 回合。此法術無需施法時間。增益效果對友軍（包括牧師本身）的持續時間會延長，而減益效果對敵人的持續時間會延長。 \n\n「記憶禱文」只能將特定增益或減益效果的持續時間延長一次，且無法延長護甲技能提供的增益效果。
actors.hero.spells.mnemonicprayer.name=記憶祈禱
actors.hero.spells.mnemonicprayer.short_desc=延長友方/敵方身上的增益/減益效果，並重新施加照明效果。
actors.hero.spells.radiance.desc=祭司爆發出聖光，使所有可見的敵人昏迷3回合。如果敵人已被照亮，「光輝」會觸發「照亮」的額外傷害，並施加「照亮」減益效果。如果目前樓層為黑暗，「光輝」也會使祭司本身發光100回合。
actors.hero.spells.radiance.name=輻射
actors.hero.spells.radiance.short_desc=照亮並短暫眩暈可見的敵人。
actors.hero.spells.recallinscription$useditemtracker.desc=牧師最近使用了一件與銘文「召回術」配合的物品。牧師可以施放該法術來重複物品的效果。已使用物品：剩餘回合數：
actors.hero.spells.recallinscription$useditemtracker.name=最近使用的符文
actors.hero.spells.recallinscription.desc=牧師使用神聖魔法重新施放最近 %s 回合內使用的符文石或捲軸上的魔法符文效果。 「召回銘文」無法用於複製升級捲軸。此法術的充能消耗取決於最近使用的物品：符文石消耗 2 點，捲軸消耗 3 點，異國捲軸消耗 4 點。複製變形捲軸或必須使用變形或升級法術製作的鍊金物品時，此法術的充能消耗也會翻倍。
actors.hero.spells.recallinscription.name=回憶銘文
actors.hero.spells.recallinscription.short_desc=重複使用最近一次使用的符文石或捲軸。
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=一道薄薄的光盾橫亙在這個角色和敵人之間。它不足以完全阻擋攻擊，但可以削弱攻擊。剩餘回合數：
actors.hero.spells.shieldoflight$shieldoflighttracker.name=光之盾
actors.hero.spells.shieldoflight.desc=牧師在自己和敵人之間創造一道薄薄的光之屏障，使自身護甲對該敵人的格擋效果提升 %1$d-%2$d，持續 5 回合。 \n\n此法術施放無需時間，但不能同時對多個目標使用。
actors.hero.spells.shieldoflight.name=光之盾
actors.hero.spells.shieldoflight.short_desc=賦予目標暫時的護甲。
actors.hero.spells.smite.desc=聖騎士將正義的毀滅之力注入近戰攻擊。除了造成普通近戰傷害外，「懲擊」還能使無負重攻擊必定命中，擁有+300的附魔效果，並造成額外的魔法傷害。懲擊的額外魔法傷害會隨著聖騎士等級的提升而增加，並且對亡靈或惡魔敵人始終造成最大額外魔法傷害。
actors.hero.spells.smite.name=懲擊
actors.hero.spells.smite.short_desc=保證命中，並附帶額外傷害和附魔效果。
actors.hero.spells.spiritform$spiritformbuff.desc=三位一體的靈體形態目前賦予你一件物品的力量，如同你裝備了該物品一般。請注意，靈體形態無法提供你已受益效果的重複效果。目前效果：剩餘回合數：
actors.hero.spells.spiritform$spiritformbuff.name=靈體
actors.hero.spells.spiritform.desc=牧師選擇一枚已鑑定的戒指或神器（聖典除外），並將其效果賦予三位一體。如果選擇的是戒指，則三位一體賦予該戒指的效果，持續20回合，效果強度為+0。如果選擇的是神器，則三位一體複製該神器的效果，效果強度為+1。每件神器與三位一體搭配使用時，其具體效果和護甲充能消耗各不相同。此法術會取代三位一體目前所擁有的任何其他靈體效果。
actors.hero.spells.spiritform.name=靈體
actors.hero.spells.spiritform.short_desc=將三位一體分配給戒指或神器。
actors.hero.spells.stasis$stasisbuff.desc=牧師目前有一名盟友處於靜止狀態。該盟友身上的所有增益效果（包括「眾生之力」）都會保留，並在效果結束後重新出現在牧師身邊。也可以再次施放「靜止」法術提前結束效果。靜止盟友：剩餘回合數：
actors.hero.spells.stasis$stasisbuff.left_behind=你那行動不便的盟友被留在了後面。
actors.hero.spells.stasis$stasisbuff.name=處於靜止狀態的盟友
actors.hero.spells.stasis.desc=牧師將與盟友的連結集中在自身，使盟友暫時處於一種能量靜止狀態，這種狀態會將盟友暫時封印在牧師體內。盟友最多會被封印 %d 回合，期間所有增益效果不受影響。 \n\n 靜止狀態自然結束後，盟友會出現在牧師身旁；或者牧師可以立即免費重新施放此法術，提前結束靜止狀態。靜止狀態甚至可以移動無法移動的盟友，但無法將他們轉移到其他樓層。
actors.hero.spells.stasis.name=停滯
actors.hero.spells.stasis.short_desc=將盟友從地牢中移除並保存下來。
actors.hero.spells.sunray.desc=牧師向目標發射一道致盲光束，造成 ZXQPH0-%2$d 點傷害，並使其失明 %3$d 回合。日光術對亡靈和惡魔目標總是造成最大傷害。 \n\n 敵人被此法術擊中後，其視力會進行調整，使其不再受到致盲效果的影響。但是，如果敵人在被此法術致盲時期再次受到攻擊，則光束會變得過於強烈，使其麻痺。
actors.hero.spells.sunray.name=陽光
actors.hero.spells.sunray.short_desc=造成遠程魔法傷害，並使目標失明一次。
actors.hero.spells.walloflight$lightwall.desc=這裡，閃爍的光幕阻擋了去路。
actors.hero.spells.walloflight.desc=聖騎士會在自己正前方創造一道由實心光板構成的牆，牆厚1格，寬%1$d格，持續20回合。這道牆的作用與普通牆類似，但可以透視。牆體生成時被困住的敵人會被短暫眩暈，並儘可能被擊退。任何被困在牆內的物體都可以掙脫出來。這道牆可以向四個方位或四個對角線方向施放。如果牆體已經存在，可以免費再次使用該法術來立即清除它。
actors.hero.spells.walloflight.early_end=你驅散了光牆。
actors.hero.spells.walloflight.name=光之牆
actors.hero.spells.walloflight.short_desc=製造一道牆來阻擋敵人。
actors.hero.talent$aggressivebarriercooldown.desc=您最近已使用此天賦，必須等待一段時間才能再次使用。剩餘回合數：\n\n。
actors.hero.talent$aggressivebarriercooldown.name=攻擊屏障冷卻
actors.hero.talent$combinedlethalityabilitytracker.executed=執行
actors.hero.talent$deadlyfollowuptracker.desc=決鬥者最近使用投擲武器攻擊了一名敵人，她對相同目標的近戰攻擊將造成更高的傷害。剩餘回合數：\n\n。
actors.hero.talent$deadlyfollowuptracker.name=致命的後續
actors.hero.talent$followupstriketracker.desc=女獵手最近用投擲武器攻擊了一名敵人，她對同一目標的下一次近戰攻擊將造成更高的傷害。剩餘回合數：\n\n。
actors.hero.talent$followupstriketracker.name=後續打擊
actors.hero.talent$improvisedprojectilecooldown.desc=您最近已使用此天賦，必須等待一段時間才能再次使用。剩餘回合數：\n\n。
actors.hero.talent$improvisedprojectilecooldown.name=臨時投擲物冷卻時間
actors.hero.talent$lethalhastecooldown.desc=您最近已使用此天賦，必須等待一段時間才能再次使用。剩餘回合數：\n\n。
actors.hero.talent$lethalhastecooldown.name=致命急速冷卻
actors.hero.talent$lingeringmagictracker.desc=法師最近使用過法杖或魔杖，他的下一次物理攻擊將造成額外傷害。剩餘回合數：\n\n。
actors.hero.talent$lingeringmagictracker.name=揮之不去的魔力
actors.hero.talent$liquidagilacctracker.desc=決鬥者的下一次普通近戰攻擊將獲得額外命中率。剩餘回合數：\n\n。
actors.hero.talent$liquidagilacctracker.name=液態敏捷性
actors.hero.talent$patientstriketracker.desc=決鬥者剛剛等待了一個回合，她的下一次近戰攻擊將造成額外傷害。
actors.hero.talent$patientstriketracker.name=病人罷工
actors.hero.talent$preciseassaulttracker.desc=決鬥者的下一次普通近戰攻擊將獲得額外命中率。剩餘回合數：\n\n。
actors.hero.talent$preciseassaulttracker.name=精準打擊
actors.hero.talent$provokedangertracker.desc=戰士最近失去了護盾，他的下一次物理攻擊將造成額外傷害。剩餘回合數：\n\n。
actors.hero.talent$provokedangertracker.name=激怒
actors.hero.talent$rejuvenatingstepscooldown.desc=您最近已使用此天賦，必須等待一段時間才能再次使用。剩餘回合數：\n\n。
actors.hero.talent$rejuvenatingstepscooldown.name=恢復步驟冷卻
actors.hero.talent$satiatedspellstracker.desc=牧師施放的下一個法術會給予他們少量的護盾。
actors.hero.talent$satiatedspellstracker.name=護盾法術
actors.hero.talent$searinglightcooldown.desc=您最近已使用此天賦，必須等待一段時間才能再次使用。剩餘回合數：\n\n。
actors.hero.talent$searinglightcooldown.name=灼熱之光
actors.hero.talent$seershotcooldown.desc=您最近已使用此天賦，必須等待一段時間才能再次使用。剩餘回合數：\n\n。
actors.hero.talent$seershotcooldown.name=先知射擊冷卻時間
actors.hero.talent$swiftequipcooldown.desc=您最近已使用此天賦，必須等待一段時間才能再次使用。剩餘回合數：\n\n。
actors.hero.talent$swiftequipcooldown.name=快速裝備冷卻時間
actors.hero.talent.adventurers_intuition.desc=+1：決鬥者辨識武器的速度提高 2.5 倍，辨識盔甲的速度提高 1.75 倍。 +2：決鬥者在裝備武器時辨識武器的速度提高 2.5 倍，辨識盔甲的速度提高 2.5 倍。
actors.hero.talent.adventurers_intuition.title=冒險家的直覺
actors.hero.talent.aggressive_barrier.desc=+1：決鬥者在使用武器技能且生命值低於或等於 50% 時獲得 3 點護盾。 +2：決鬥者在使用武器技能且生命值低於或等於 50% 時獲得 5 點護盾。
actors.hero.talent.aggressive_barrier.meta_desc=_如果該天賦由其他英雄獲得_，則會在生命值較低時進行近戰攻擊時提供護盾，冷卻時間為 50 回合。
actors.hero.talent.aggressive_barrier.title=攻擊性屏障
actors.hero.talent.ally_warp.desc=+1：法師可以選擇一名盟友立即與其交換位置，範圍為2格。 +2：法師可以選擇盟友立即與其交換位置，範圍為4格。 +3：法師可以選擇盟友立即與其交換位置，範圍為6格。法師無法與無法移動的盟友交換位置。
actors.hero.talent.ally_warp.title=盟友傳送
actors.hero.talent.arcane_vision.desc=+1：當法師用魔法攻擊敵人時，他獲得對該敵人的心靈視覺，持續10回合。 +2：當法師用魔法攻擊敵人時，他獲得對該敵人的心靈視覺，持續15回合。
actors.hero.talent.arcane_vision.title=奧術視覺
actors.hero.talent.assassins_reach.desc=+1：刺客每公升一級準備等級，閃現範圍增加至 1/3/4/6 格，原為 1/2/3/4 格。 +2：刺客每公升一級準備等級，閃現範圍增加至 2/4/6/8 格，原為 1/2/3/4 格。 +3：刺客每公升一級準備等級，閃現範圍增加至 2/5/7/10 格，原為 1/2/3/4 格。此閃現可以穿過障礙物和敵人，但不能穿過牆壁等實體地形。
actors.hero.talent.assassins_reach.title=刺客的觸及
actors.hero.talent.aura_of_protection.desc=+1：聖騎士可以施放“防護光環”，該法術使聖騎士及其周圍2格內的所有盟友獲得20%的傷害抗性，並使聖騎士的護甲符文效果提升50%，持續20回合，消耗2點能量。 +2：聖騎士可以施放“防護光環”，該法術使聖騎士及其周圍2格內的所有盟友獲得30%的傷害抗性，並使聖騎士的護甲符文效果提升75%，持續20回合，消耗2點能量。 +3：聖騎士可以施放“防護光環”，該法術使聖騎士及其周圍2格內的所有盟友獲得40%的傷害抗性，並使聖騎士的護甲符文效果提升75%，持續20回合，消耗2點能量。聖騎士的盔甲符文使力量提升 100%，持續 20 回合，消耗 2 次充能。
actors.hero.talent.aura_of_protection.title=保護光環
actors.hero.talent.backup_barrier.desc=+1：法師用完法杖的最後一層充能時，獲得 3 點護盾值。 +2：法師用完法杖的最後一層充能時，獲得 5 點護盾值。
actors.hero.talent.backup_barrier.meta_desc=_如果該天賦由其他英雄獲得_，則會從該英雄最高等級的魔杖觸發。
actors.hero.talent.backup_barrier.title=後備屏障
actors.hero.talent.barkskin.desc=+1：當守望者踏入草地時，她會拿到相當於自身等級0-50%的樹皮護甲，該護甲每回合都會消失。 +2：當守望者踏入草地時，她會拿到相當於自身等級0-100%的樹皮護甲，該護甲每回合都會消失。 +3：當守望者踏入草地時，她會獲得相當於自身等級0-150%的樹皮護甲，每回合都會消失。
actors.hero.talent.barkskin.title=樹皮
actors.hero.talent.beaming_ray.desc=牧師可以消耗1點充能，對一個強化過的盟友施放「光束射線」。這道射線可以穿牆，並將盟友傳送到目標位置。如果位置有敵人，盟友會出現在敵人旁邊並攻擊敵人。光束射線甚至可以傳送通常無法移動的盟友，但傳送距離減半。光束射線最大射程為4格，並使「群聚之力」的加成效果提升至對最近敵人造成+35%傷害，持續10回合。光束射線最大射程為8格，並使「群聚之力」的加成效果提升至對最近敵人造成+40%傷害，持續10回合。光束射線最大射程為12格，並使「群聚之力」的加成效果提升至對最近敵人造成+45%傷害，持續10回合。光束射線最大射程為_16 格，_並將「眾生之力」的加成提升至_對最近的敵人造成 _+50% 的傷害_，持續 10 回合。
actors.hero.talent.beaming_ray.title=光束
actors.hero.talent.blast_radius.desc=_+1:_元素爆炸的半徑從 4.\n\n_增加到 _5 格_；_+2:_元素爆炸的半徑從 4.\n\n_增加到 _6 格_；_+3:_元素元素的半徑從 4.ZXZQZQZXZ（ZXZFXZFXZXZ4.ZXZFXZ4.ZXZFXZX_ZXZ4.ZXZFX 11111 月爆炸元素的半徑從 4.Z格_;_+4:_元素爆炸的半徑從 4.\n\n_增加到 _8 格_。
actors.hero.talent.blast_radius.title=爆炸半徑
actors.hero.talent.bless.desc=+1：牧師可以施放“祝福術”，法術對自己施放時可獲得6回合的祝福效果和10點護盾值，對其他角色施放時可獲得10回合的祝福效果和10點治療值，消耗1點法力值。 +2：牧師可以施放“祝福術”，法術對自己施放時可獲得10回合的祝福效果和15點護盾值，對其他角色施放時可獲得15回合的祝福效果和15點治療值，消耗1點法力值。此法術多餘的治療量將轉換為護盾值。
actors.hero.talent.bless.meta_desc=_如果該天賦由其他英雄獲得_，則會改為提升該英雄及其所有盟友的命中率和閃避率，+1 時提升 3%，+2 時提升 5%。
actors.hero.talent.bless.title=保佑
actors.hero.talent.body_form.desc=牧師可以施放“形體術”，消耗2點充能，使三位一體獲得牧師在本輪遊戲中已鑑定的附魔或符文的力量。使用三位一體時，牧師獲得所選效果，持續20回合。當使用三位一體時，牧師獲得所選效果，持續27回合。當使用三位一體時，牧師獲得所選效果，持續33回合。當使用三位一體時，牧師獲得所選效果，持續40回合。一次只能賦予一種身體效果。如果選擇的符文稀有且強大，三位一體護甲的充能消耗會更高。
actors.hero.talent.body_form.title=體型
actors.hero.talent.body_replacement.desc=+1：閃現後，盜賊會留下一個擁有20點生命值和1-3點護甲的木製誘餌。 +2：閃現後，盜賊會留下一個擁有40點生命值和2-6點護甲的木製誘餌。 +3：閃現後，盜賊會留下一個擁有60點生命值和3-9點護甲的木製誘餌。 +4：閃現後，盜賊會留下一個擁有80點生命值和4-12點護甲的木製誘餌。一次只能有一個誘餌處於啟動狀態。
actors.hero.talent.body_replacement.title=身體置換
actors.hero.talent.body_slam.desc=+1：當戰士跳躍落地時，所有鄰近敵人所受到的傷害等於1-4點傷害加上其傷害格擋能力的25%。 +2：當戰士跳躍落地時，所有鄰近敵人受到的傷害等於2-8點傷害加上其傷害格擋能力的50%。 +3：當戰士跳躍落地時，所有鄰近敵人受到的傷害等於3-12點傷害加上其傷害格擋能力的75%。 +4：當戰士跳躍落地時，所有鄰近敵人受到的傷害等於4-16點傷害加上其傷害格擋能力的100%。
actors.hero.talent.body_slam.title=抱摔
actors.hero.talent.bounty_hunter.desc=+1：刺客使用預備攻擊擊殺敵人時，物品掉落幾率每提升一級預備等級增加 2/4/8/16%。 +2：刺客使用預備攻擊擊殺敵人時，物品掉落幾率每提升一級預備等級增加 4/8/16/32%。 +3：刺客使用預備攻擊擊殺敵人時，物品掉落幾率每提升一級預備等級增加 6/12/24/48%。
actors.hero.talent.bounty_hunter.title=賞金獵人
actors.hero.talent.cached_rations.desc=+1：盜賊在探索地牢接下來的幾層時，可以在寶箱中找到 2 份補給。 +2：盜賊在探索地牢接下來的幾層時，可以在寶箱中找到 3 份補給。補給可以快速食用，恢復適量的飽足感，治療 5 點生命值，並為暗影斗篷恢復 1 層充能。
actors.hero.talent.cached_rations.title=儲備口糧
actors.hero.talent.cleanse.desc=+1：牧師可以施放“淨化術”，該法術可以移除牧師和附近盟友身上的負面狀態效果，並賦予他們10點護盾值，消耗2點法術力。 +2：牧師可以施放“淨化術”，該法術可以賦予牧師和附近盟友3回合的負面狀態免疫，並賦予他們20點護盾值，消耗2點法術力。 +3：牧師可以施放“淨化術”，該法術可以賦予牧師和附近盟友5回合的負面狀態免疫，並賦予他們30點護盾值，消耗2點法術力。
actors.hero.talent.cleanse.meta_desc=_如果該天賦由其他英雄獲得_，則會在使用魔杖或神器後，有 10/20/30% 的幾率清除該英雄身上的負面狀態效果，同時提升 1/2/3 點。
actors.hero.talent.cleanse.title=潔淨
actors.hero.talent.cleave.desc=_+1:_ 角鬥士擊殺敵人後獲得的額外時間從 15 回合增加到 30 回合。 _+2:_ 角鬥士擊殺敵人後獲得的額外時間從 15 回合增加到 45 回合。 _+3:_ 角鬥士擊殺敵人後獲得的額外時間從 15 回合增加到 60 回合。
actors.hero.talent.cleave.title=劈開
actors.hero.talent.cloned_armor.desc=+1：暗影分身獲得英雄護甲值的12%，並有25%的幾率使用英雄護甲上的符文。 +2：暗影分身獲得英雄護甲值的24%，並有50%的幾率使用英雄護甲上的符文。 +3：暗影分身獲得英雄護甲值的36%，並有75%的幾率使用英雄護甲上的符文。 +4：暗影分身獲得英雄護甲值的48%，並有100%的幾率使用英雄護甲上的符文。
actors.hero.talent.cloned_armor.title=克隆裝甲
actors.hero.talent.close_the_gap.desc=+1：決鬥者在開始決鬥時會向目標閃現最多兩格。 +2：決鬥者在開始決鬥時會向目標閃現最多三格。 +3：決鬥者在開始決鬥時會向目標閃現最多四格。 +4：決鬥者在開始決鬥時會向目標閃現最多五格。這種閃現可以穿過障礙物和敵人，但無法穿過牆壁等實體地形。判斷敵人是否在挑戰範圍內時，閃現效果會被考慮。
actors.hero.talent.close_the_gap.title=縮小差距
actors.hero.talent.combined_energy.desc=+1：如果武僧在5回合內先後使用武器技能和消耗4點或以上能量的技能，則恢復1點消耗的能量。 +2：若武僧在5回合內先後使用武器技能和消耗3點或以上能量的技能，則恢復1點消耗的能量。 +3：若武僧在5回合內先後使用武器技能和消耗2點或以上能量的技能，則恢復1點消耗的能量。
actors.hero.talent.combined_energy.title=聯合能源
actors.hero.talent.combined_lethality.desc=+1：如果英雄在使用其他武器技能後立即使用近戰武器攻擊，則該攻擊將處決任何生命值低於 13% 的非首領敵人。 +2：如果英雄在使用其他武器技能後立即使用近戰武器攻擊，則該攻擊將處決任何生命值低於 27% 的非首領敵人。 +3：如果英雄在使用其他武器技能後立即使用近戰武器攻擊，則該攻擊將處決任何生命值低於 40% 的非首領敵人。此攻擊可以是普通的近戰武器攻擊，也可以是武器技能的一部分。
actors.hero.talent.combined_lethality.title=聯合致死
actors.hero.talent.conserved_magic.desc=+1：每次狂野魔法的攻擊現在消耗0.33點能量，而不是0.5點，狂野魔法有25%的幾率不會消耗回合。 +2：每次狂野魔法的攻擊現在消耗0.225點能量，而不是0.5點，而狂野魔法有50%的幾率不會消耗回合。 +3：每次狂野魔法的攻擊現在消耗0.15點能量，而不是0.5點，狂野魔法有75%的幾率不會消耗回合。 +4：每次狂野魔法的攻擊現在消耗0.1點能量，而不是0.5點，而狂野魔法有100%的幾率不會消耗回合。
actors.hero.talent.conserved_magic.title=守恆魔法
actors.hero.talent.counter_ability.desc=+1：如果決鬥者在殘影被攻擊後的3回合內使用武器技能，她將立即恢復0.38點充能。 +2：如果決鬥者在殘影被攻擊後的3回合內使用武器技能，她將立即恢復0.77點充能。 +3：如果決鬥者在殘影被攻擊後的3回合內使用武器技能，她將立即恢復1.13點充能。 +4：如果決鬥者在殘影被攻擊後的3回合內使用武器技能，她將立即恢復1.5點充能。
actors.hero.talent.counter_ability.title=反制能力
actors.hero.talent.deadly_followup.desc=+1：決鬥者使用投擲武器擊中敵人時，在接下來的5回合內，她將對其造成額外10%的近戰傷害。 +2：決鬥者使用投擲武器擊中敵人時，在接下來的5回合內，她將對其造成額外20%的近戰傷害。 +3：決鬥者使用投擲武器擊中敵人時，在接下來的5回合內，她將對其造成額外30%的近戰傷害。
actors.hero.talent.deadly_followup.title=致命的後續
actors.hero.talent.deathless_fury.desc=+1：狂暴會在狂戰士即將死亡且怒氣值達到或超過100%時自動觸發，但此時會有3個英雄等級的冷卻時間。 +2：狂暴會在狂戰士即將死亡且怒氣值達到或超過100%時自動觸發，但此時會有2個英雄等級的冷卻時間。 +3：狂暴會在狂戰士即將死亡且怒氣值達到或超過100%時自動觸發，但此時會有1個英雄等級的冷卻時間。注意：狂暴結束時，如果狂戰士的生命值降至0，他仍然會死亡。
actors.hero.talent.deathless_fury.title=不死之怒
actors.hero.talent.deathly_durability.desc=+1：被死亡標記擊殺的敵人會為盜賊提供相當於其被標記時生命值13%的護盾。 +2：被死亡標記擊殺的敵人會為盜賊提供相當於其被標記時生命值25%的護盾。 +3：被死亡標記擊殺的敵人會為盜賊提供相當於其被標記時生命值38%的護盾。 +4：被死亡標記擊殺的敵人會為盜賊提供相當於其被標記時生命值50%的護盾。
actors.hero.talent.deathly_durability.title=致命的耐久性
actors.hero.talent.desperate_power.desc=+1：法師的魔杖和法杖在充能即將耗盡時，最後一次施法會獲得+1等級。 +2：法師的魔杖和法杖在充能即將耗盡時，最後一次施法會獲得+2等級。 +3：法師的魔杖和法杖在充能即將耗盡時，最後一次施法會獲得+3等級。
actors.hero.talent.desperate_power.title=絕望的力量
actors.hero.talent.directed_power.desc=+1：元素打擊的直接攻擊效果會根據其作用範圍內敵人的數量（包括攻擊目標）獲得+30%的附魔強度。 +2：元素打擊的直接攻擊效果會根據其作用範圍內敵人的數量（包括攻擊目標）獲得+60%的附魔強度。 +3：元素打擊的直接攻擊效果會根據其作用範圍內敵人的數量（包括攻擊目標）獲得+90%的附魔強度。 +4：元素打擊的直接攻擊效果會根據其作用範圍內敵人的數量（包括攻擊目標）獲得+120%的附魔強度。
actors.hero.talent.directed_power.title=定向能
actors.hero.talent.divine_intervention.desc=+1：在昇華形態下，牧師可以施放“神聖幹預”，使牧師和所有盟友的護盾值提升至多150，並將昇華形態的持續時間延長3回合。 +2：在昇華形態下，牧師可以施放“神聖幹預”，使牧師和所有盟友的護盾值提升至多200，並將昇華形態的持續時間延長4回合。 +3：在昇華形態下，牧師可以施放“神聖幹預”，使牧師和所有盟友的護盾值提升至多250，並將昇華形態的持續時間延長5回合。 +4：在昇華形態下，牧師可以施放_神聖幹預_，使牧師和所有盟友的護盾值提升至多_300_，並使昇華形態的持續時間延長_6回合。 _神聖幹預需要消耗5個書卷充能，並且在同一昇華形態下只能施放一次。
actors.hero.talent.divine_intervention.title=神靈幹預
actors.hero.talent.divine_sense.desc=+1：牧師可以施放「神聖感知」法術，法術賦予他們8格心靈視覺，持續50回合，施法無需時間，消耗2點法力值。 +2：牧師可以施放「神聖感知」法術，法術賦予他們12格心靈視覺，持續50回合，施法無需時間，消耗2點法力值。
actors.hero.talent.divine_sense.meta_desc=_如果該天賦由其他英雄獲得_，則會改為在使用魔杖或神器後短暫地賦予他們心靈視覺，範圍為+1時3格或+2時5格。
actors.hero.talent.divine_sense.title=神聖的感知
actors.hero.talent.double_jump.desc=+1：如果戰士在3回合內進行第二次跳躍，則該跳躍的充能消耗降低16%。 +2：如果戰士在3回合內進行第二次跳躍，則該跳躍的充能消耗降低30%。 +3：如果戰士在3回合內進行第二次跳躍，則該跳躍的充能消耗降低40%。 +4：如果戰士在3回合內進行第二次跳躍，則該跳躍的充能消耗降低50%。
actors.hero.talent.double_jump.title=雙跳
actors.hero.talent.double_mark.desc=+1：同時標記第二個目標可降低30%的充能成本。 +2：同時標記第二個目標可降低50%的充能成本。 +3：同時標記第二個目標可降低65%的充能成本。 +4：同時標記第二個目標可降低75%的充能成本。
actors.hero.talent.double_mark.title=雙倍標記
actors.hero.talent.durable_projectiles.desc=_+1:_ 女獵人使用投擲武器時，耐久度增加 _50%_。 \n\n_+2:_ 女獵人使用投擲武器時，耐久度增加 _75%_。
actors.hero.talent.durable_projectiles.title=耐用彈丸
actors.hero.talent.durable_tips.desc=_+1:_ 守衛者使用尖鏢的飛鏢時，飛鏢的耐久度增加 _2 倍_。 \n\n_+2:_ 守衛者使用尖鏢的飛鏢時，飛鏢的耐久度增加 _3 倍_。 \n\n_+3:_ 守衛者使用尖鏢的飛鏢時，飛鏢的耐久度增加 _4 倍_。
actors.hero.talent.durable_tips.title=耐用型筆尖
actors.hero.talent.eagle_eye.desc=+1：靈鷹的視野範圍從 6 格增加到 7 格。 +2：靈鷹的視野範圍從 6 格增加到 8 格。 +3：靈鷹的視野範圍從 6 格增加到 9 格，並獲得 2 格的心靈視野。 +4：靈鷹的視野範圍從 6 格增加到 10 格，並獲得 3 格的心靈視野。
actors.hero.talent.eagle_eye.title=鷹眼
actors.hero.talent.elemental_power.desc=+1：元素爆破威力提升25%。 +2：元素爆破威力提升50%。 +3：元素爆破威力提升75%。 +4：元素爆破威力提升100%。
actors.hero.talent.elemental_power.title=元素之力
actors.hero.talent.elemental_reach.desc=+1：元素打擊的範圍從 4 格增加到 5 格，寬度從 65 度增加到 75 度。 +2：元素打擊的範圍從 4 格增加到 6 格，寬度從 65 度增加到 85 度。 +3：元素打擊的範圍從 4 格增加到 7 格，寬度從 65 度增加到 95 度。 +4：元素打擊的範圍從 4 格增加到 8 格，寬度從 65 度增加到 105 度。
actors.hero.talent.elemental_reach.title=元素範圍
actors.hero.talent.elimination_match.desc=+1：如果決鬥者在決鬥結束後的3回合內再次發起挑戰，則該挑戰的充能消耗降低16%。 +2：如果決鬥者在決鬥結束後的3回合內再次發起挑戰，則該挑戰的充能消耗降低30%。 +3：如果決鬥者在決鬥結束後的3回合內再次發起挑戰，則該挑戰的充能消耗降低40%。 +4：如果決鬥者在決鬥結束後的3回合內再次發起挑戰，則該挑戰的充能消耗降低50%。
actors.hero.talent.elimination_match.title=淘汰賽
actors.hero.talent.empowered_strike.desc=+1：戰鬥法師使用法杖進行電擊後，第一次近戰攻擊造成的傷害提高16%，法杖的額外效果威力提高50%。 +2：戰鬥法師使用法杖進行電擊後，第一次近戰攻擊造成的傷害提高33%，法杖的額外效果威力提高100%。 +3：戰鬥法師使用法杖進行電擊後，第一次近戰攻擊造成的傷害提高50%，法杖的額外效果威力提高150%。
actors.hero.talent.empowered_strike.title=授權罷工
actors.hero.talent.empowering_meal.desc=_+1:_ 食用食物後，法師在接下來的 3 次使用魔杖造成傷害時，獲得 _2 點額外傷害_。 \n\n_+2:_ 食用食物後，法師在接下來的 3 次使用魔杖造成傷害時，獲得 _3 點額外傷害_。
actors.hero.talent.empowering_meal.title=賦能餐
actors.hero.talent.endless_rage.desc=+1：狂戰士的怒氣最高可達116%。 +2：狂戰士的怒氣最高可達133%。 +3：狂戰士的怒氣最高可達150%。每超過100%的怒氣值，狂暴護盾值增加1%，冷卻時間減少1%，但傷害加成不會超過50%。
actors.hero.talent.endless_rage.title=無盡的憤怒
actors.hero.talent.energizing_meal.desc=+1：吃食物會使法師消耗 1 個回合，並使其獲得 5 回合的魔杖充能。 +2：吃食物會使法師消耗 1 個回合，並使其獲得 8 回合的魔杖充能。
actors.hero.talent.energizing_meal.title=活力餐
actors.hero.talent.enhanced_combo.desc=+1：當角鬥士的連擊數達到7或更高時，「重擊」的擊退範圍增加到3格，並附加眩暈效果，且可以將敵人擊落到深淵中。 +2：除了+1的增益效果外，當角鬥士的連擊數達到9或更高時，「格擋」可以對多次攻擊生效。 +3：除了+1和+2的增益效果外，角鬥士在使用「猛擊」、「粉碎」或「狂怒」時，可以跳躍最多3格的連擊數。
actors.hero.talent.enhanced_combo.title=強化連擊
actors.hero.talent.enhanced_lethality.desc=+1：刺客每提升一級準備等級，即可暗殺生命值低於 4/13/27/67% 的敵人，高於先前的 3/10/20/50%。 +2：刺客每提升一級準備等級，即可暗殺生命值低於 5/17/33/83% 的敵人，高於先前的 3/10/20/50%。 +3：刺客每提升一級準備等級，即可暗殺生命值低於 6/20/40/100% 的敵人，高於先前的 3/10/20/50%。
actors.hero.talent.enhanced_lethality.title=增強致死率
actors.hero.talent.enhanced_rings.desc=+1：當盜賊使用神器時，他的戒指獲得+1升級，持續3回合。 +2：當盜賊使用神器時，他的戒指獲得+1升級，持續6回合。 +3：當盜賊使用神器時，他的戒指獲得+1升級，持續9回合。
actors.hero.talent.enhanced_rings.title=強化戒指
actors.hero.talent.enlightening_meal.desc=+1：牧師吃食物需要1個回合，其聖書獲得0.67次充能。 +2：牧師吃食物需要1個回合，其聖書獲得1次充能。
actors.hero.talent.enlightening_meal.meta_desc=若該天賦由其他英雄獲得，則會改為提供魔杖和神器充能+1時2回合，或+2時3回合。此天賦不能用於豐饒號角的充能。
actors.hero.talent.enlightening_meal.title=啟迪餐
actors.hero.talent.enraged_catalyst.desc=+1：狂戰士武器上的附魔和詛咒會隨著其怒氣值的增加而更頻繁地觸發，在怒氣值達到 100% 時，觸發頻率最高可提高 15%。 +2：狂戰士武器上的附魔和詛咒會隨著其怒氣值的增加而更頻繁地觸發，在怒氣值達到 100% 時，觸發頻率最高可提高 30%。 +3：狂戰士武器上的附魔和詛咒會隨著其怒氣值的增加而更頻繁地觸發，在怒氣值達到 100% 時，觸發頻率最高可提高 45%。
actors.hero.talent.enraged_catalyst.title=憤怒的催化劑
actors.hero.talent.evasive_armor.desc=_+1:_ 自由奔跑時，自由奔跑者的盔甲上每增加一點力量，自由奔跑者獲得額外 _+1 躲避_。 \n\n_+2:_ 自由奔跑時，自由奔跑者的盔甲上每增加一點力量，自由奔跑者獲得額外 _+2 躲避_。 \n\n_+3:_ 自由奔跑時，自由奔跑者獲得他的護甲每增加一點力量，額外增加 _+3 閃避_。
actors.hero.talent.evasive_armor.title=閃避裝甲
actors.hero.talent.even_the_odds.desc=+1：當「堅韌」狀態結束時，戰士對周圍2格內的每個敵人造成額外5%的傷害。 +2：當「堅韌」狀態結束時，戰士對周圍2格內的每個敵人造成額外10%的傷害。 +3：當「堅韌」狀態結束時，戰士對周圍2格內的每個敵人造成額外15%的傷害。 +4：當「堅韌」狀態結束時，戰士對周圍2格內的每個敵人造成額外20%的傷害。
actors.hero.talent.even_the_odds.title=勝算均等
actors.hero.talent.excess_charge.desc=+1：當戰鬥法師的法杖充滿能量時，其下一次電擊將為他提供每級法杖0.67點護盾值。 +2：當戰鬥法師的法杖充滿能量時，其下一次電擊將為他提供每級法杖1.33點護盾值。 +3：當戰鬥法師的法杖充滿能量時，其下一次電擊將為他提供每級法杖2點護盾值。
actors.hero.talent.excess_charge.title=超額收費
actors.hero.talent.expanding_wave.desc=+1：衝擊波的範圍從 5 格增加到 6 格，寬度從 60 度增加到 75 度。 +2：衝擊波的範圍從 5 格增加到 7 格，寬度從 60 度增加到 90 度。 +3：衝擊波的範圍從 5 格增加到 8 格，寬度從 60 度增加到 105 度。 +4：衝擊波的範圍從 5 格增加到 9 格，寬度從 60 度增加到 120 度。
actors.hero.talent.expanding_wave.title=膨脹波
actors.hero.talent.expose_weakness.desc=+1：攻擊決鬥者殘影的敵人會變得虛弱且易傷，持續2回合。 +2：攻擊決鬥者殘影的敵人會變得虛弱且易傷，持續4回合。 +3：攻擊決鬥者殘影的敵人會變得虛弱且易傷，持續6回合。 +4：攻擊決鬥者殘影的敵人會變得虛弱且易傷，持續8回合。
actors.hero.talent.expose_weakness.title=暴露弱點
actors.hero.talent.fan_of_blades.desc=+1：幽靈之刃可額外攻擊至多 1 個目標，造成 50% 的傷害。目標必須可見且位於 30 度錐形範圍內。 +2：幽靈之刃可額外攻擊至多 2 個目標，造成 50% 的傷害。目標必須可見且位於 60 度錐形範圍內。 +3：幽靈之刃可額外攻擊至多 3 個目標，造成 50% 的傷害。目標必須可見且位於 90 度錐形範圍內。 +4：幽靈之刃可額外攻擊至多 4 個目標，造成 50% 的傷害。目標必須可見且位於 120 度錐形範圍內。
actors.hero.talent.fan_of_blades.title=扇葉
actors.hero.talent.farsight.desc=_+1:_狙擊手的視野範圍_增加25%_。 \n\n_+2:_狙擊手的視野範圍_增加50%_。 \n\n_+3:_狙擊手的視野範圍_增加75%_。
actors.hero.talent.farsight.title=遠見
actors.hero.talent.fear_the_reaper.desc=+1：當死亡標記的敵人生命值降至0時，他們會陷入殘廢狀態。 +2：當死亡標記的敵人生命值降至0時，他們會陷入恐懼和殘廢狀態。 +3：當死亡標記的敵人生命值降至0時，他們會陷入恐懼和殘廢狀態，並且3格範圍內的敵人也會陷入殘廢狀態。 +4：當死亡標記的敵人生命值降至0時，他們會陷入恐懼和殘廢狀態，並且3格範圍內的敵人也會陷入恐懼和殘廢狀態。
actors.hero.talent.fear_the_reaper.title=畏懼死神
actors.hero.talent.feigned_retreat.desc=+1：如果敵人攻擊決鬥者的殘影，她獲得2回合的加速效果。 +2：如果敵人攻擊決鬥者的殘影，她獲得4回合的加速效果。 +3：如果敵人攻擊決鬥者的殘影，她獲得6回合的加速效果。 +4：如果敵人攻擊決鬥者的殘影，她獲得8回合的加速效果。
actors.hero.talent.feigned_retreat.title=假裝撤退
actors.hero.talent.fire_everything.desc=+1：狂野魔法的施法次數從 4 次增加到 5 次，每根魔杖有 25% 的幾率可以使用 3 次。 +2：狂野魔法的施法次數從 4 次增加到 6 次，每根魔杖有 50% 的幾率可以使用 3 次。 +3：狂野魔法的施法次數從 4 次增加到 7 次，每根魔杖有 75% 的幾率可以使用 3 次。 +4：狂野魔法的施法次數從 4 次增加到 8 次，每根魔杖有 100% 的幾率可以使用 3 次。
actors.hero.talent.fire_everything.title=放火燒掉一切
actors.hero.talent.flash.desc=+1：在昇華形態下，牧師可以施放「閃現術」傳送至最多3格遠的地方。 +2：在昇華形態下，牧師可以施放「閃現術」傳送至最多4格遠的地方。 +3：在昇華形態下，牧師可以施放「閃現術」傳送至最多5格遠的地方。 +4：在昇華形態下，牧師可以施放「閃現術」傳送至最多6格遠的地方。 「閃現術」初始消耗2點法術能量，在同一昇華形態下每次使用額外消耗1點法術能量。
actors.hero.talent.flash.title=閃光
actors.hero.talent.focused_meal.desc=+1：吃食物會使決鬥者失去 1 個回合，並使她的武器獲得 0.67 次充能。 +2：吃食物會讓決鬥者失去 1 個回合，並使她的武器獲得 1 次充能。
actors.hero.talent.focused_meal.meta_desc=_如果該天賦由其他英雄獲得_，則會改為給予該英雄下一次攻擊額外傷害，數值等於其等級/3（+1）或等級/2（+2）。
actors.hero.talent.focused_meal.title=專注餐
actors.hero.talent.followup_strike.desc=+1：當女獵手用弓箭或投擲武器擊中敵人時，她對該敵人的下一次近戰攻擊將造成 2 點額外傷害。 +2：當女獵手用弓箭或投擲武器擊中敵人時，她對該敵人的下一次近戰攻擊將造成 3 點額外傷害。
actors.hero.talent.followup_strike.title=後續打擊
actors.hero.talent.go_for_the_eyes.desc=+1：靈鷹的攻擊使敵人失明2回合。 +2：靈鷹的攻擊使敵人失明5回合。 +3：靈鷹的攻擊使敵人失明5回合，並使其殘廢2回合。 +4：靈鷹的攻擊使敵人失明5回合，並使其殘廢5回合。
actors.hero.talent.go_for_the_eyes.title=瞄準眼睛
actors.hero.talent.growing_power.desc=+1：自然之力提供的攻擊力和移動速度加成分別從 33% 和 100% 提升至 38% 和 125%。 +2：自然之力提供的攻擊力和移動速度加成分別從 33% 和 100% 提升至 42% 和 150%。 +3：自然之力提供的攻擊力和移動速度加成分別從 33% 和 100% 提升至 46% 和 175%。 +4：自然之力提供的攻擊力和移動速度加成分別從 33% 和 100% 提升至 50% 和 200%。
actors.hero.talent.growing_power.title=日益增長的力量
actors.hero.talent.hallowed_ground.desc=+1：牧師可以施放「聖地」法術，消耗2點法力值，將3x3區域內的地形聖化20回合。 +2：牧師可以施放「聖地」法術，消耗2點法力值，將5x5區域內的地形聖化20回合。 +3：牧師可以施放「聖地」法術，消耗2點法力值，將7x7區域內的地形聖化20回合。施放時，「聖地」會為友軍恢復15點生命值，短暫定身敵人，並散播矮草。之後，它會緩慢地為友軍恢復生命值，削弱敵人，並隨機生長出高草。聖地給予牧師護盾而不是治療，並且會被火焰摧毀。
actors.hero.talent.hallowed_ground.title=聖地
actors.hero.talent.hasty_retreat.desc=+1：閃現後，盜賊獲得1回合急速與隱身效果。 +2：閃現後，盜賊獲得2回合急速與隱身效果。 +3：閃現後，盜賊獲得3回合急速和隱身效果。 +4：閃現後，盜賊獲得4回合急速與隱身效果。
actors.hero.talent.hasty_retreat.title=倉促撤退
actors.hero.talent.hearty_meal.desc=+1：當戰士生命值低於或等於 33% 時，食用食物可恢復 4 點生命值。 +2：當戰士生命值低於或等於 33% 時，食用食物可恢復 6 點生命值。
actors.hero.talent.hearty_meal.title=豐盛的一餐
actors.hero.talent.heightened_senses.desc=+1：女獵人獲得對其位置周圍 2 格範圍內角色的心靈視覺。 +2：女獵人獲得對其位置周圍 3 格範圍內角色的心靈視覺。
actors.hero.talent.heightened_senses.title=感官增強
actors.hero.talent.heroic_energy.desc=+1：英雄的護甲技能充能消耗降低12%。 +2：英雄的護甲技能充能消耗降低23%。 +3：英雄的護甲技能充能消耗降低32%。 +4：英雄的護甲技能充能消耗降低40%。
actors.hero.talent.heroic_energy.rat_title=老鼠能量
actors.hero.talent.heroic_energy.title=英雄能量
actors.hero.talent.hold_fast.desc=+1：戰士等待時獲得1-2點護甲，連擊和護盾增益效果的衰減速度降低50%，直到他移動為止。 +2：戰士等待時獲得2-4點護甲，連擊和護盾增益效果的衰減速度降低75%，直到他移動為止。 +3：戰士等待時獲得3-6點護甲，連擊和護盾增益效果的衰減速度降低100%，直到他移動為止。
actors.hero.talent.hold_fast.title=堅守
actors.hero.talent.holy_intuition.desc=+1：牧師可以施放「神聖直覺」法術，消耗3點法力值，揭示一件物品是否被詛咒。 +2：牧師可以施放「神聖直覺」法術，消耗2點法力值，揭示一件物品是否被詛咒。
actors.hero.talent.holy_intuition.meta_desc=_如果該天賦由其他英雄獲得_，則該英雄可以在裝備詛咒物品之前識別該物品的詛咒狀態，+1 時有 15% 的幾率，+2 時有 25% 的幾率。
actors.hero.talent.holy_intuition.title=神聖直覺
actors.hero.talent.holy_lance.desc=+1：牧師可以施放“聖槍”，這是一個威力強大的法術，消耗4點能量，造成30-55點傷害。 +2：牧師可以施放“聖槍”，這是一個威力強大的法術，消耗4點能量，造成45-83點傷害。 +3：牧師可以施放“聖槍”，這是一個威力強大的法術，消耗4點能量，造成60-110點傷害。聖槍對惡魔和亡靈敵人總是造成最大傷害。聖槍的冷卻時間為30回合。
actors.hero.talent.holy_lance.title=聖槍
actors.hero.talent.impact_wave.desc=+1：戰士跳躍落地後，所有相鄰敵人會被擊退2格，並有25%的機率進入5回合的易傷狀態。 +2：戰士跳躍落地後，所有相鄰敵人會被擊退3格，並有50%的機率進入5回合的易傷狀態。 +3：戰士跳躍落地後，所有相鄰敵人會被擊退4格，並有75%的機率進入5回合的易傷狀態。 +4：戰士跳躍落地後，所有相鄰敵人會被擊退5格，並有100%的機率進入5回合的易傷狀態。
actors.hero.talent.impact_wave.title=衝擊波
actors.hero.talent.improvised_projectiles.desc=+1：戰士可以向敵人投擲任何非投擲武器的物品，使其致盲2回合。此技能冷卻時間為50回合。 +2：戰士可以向敵人投擲任何非投擲武器的物品，使其致盲3回合。此技能冷卻時間為50回合。
actors.hero.talent.improvised_projectiles.title=簡易投擲物
actors.hero.talent.inscribed_power.desc=+1：當法師閱讀捲軸或使用法術物品時，他的_接下來的2次魔杖攻擊_獲得+2級。 +2：當法師閱讀捲軸或使用法術物品時，他的_接下來的3次魔杖攻擊_獲得+2級。當使用升級、轉換或煉金捲軸製作的物品時，強化魔杖攻擊的次數會增加一倍。對於產量較高的煉金術物品（例如大多數法術），此天賦有一定幾率會根據該物品的產量觸發。
actors.hero.talent.inscribed_power.title=銘刻的力量
actors.hero.talent.inscribed_stealth.desc=+1：盜賊閱讀捲軸或使用法術物品後獲得 3 回合的隱身效果。 +2：盜賊閱讀捲軸或使用法術物品後獲得 5 回合的隱身效果。使用升級捲軸、轉換捲軸或必須使用這些捲軸製作的煉金物品時，隱身持續時間翻倍。對於產量較高的煉金術物品（例如大多數法術），此天賦有一定幾率會根據該物品的產量觸發。
actors.hero.talent.inscribed_stealth.title=銘刻的隱密
actors.hero.talent.invigorating_meal.desc=+1：吃食物會讓女獵人獲得 1 回合（莓果會立即被吃掉），並賦予她 1 回合的加速效果。 +2：吃食物會讓女獵人獲得 1 回合（莓果會立即被吃掉），並賦予她 2 回合的加速效果。
actors.hero.talent.invigorating_meal.title=令人精神煥發的一餐
actors.hero.talent.invigorating_victory.desc=+1：如果決鬥者在決鬥結束前擊敗目標，她將恢復5點生命值，外加決鬥期間所受傷害的30%。 +2：如果決鬥者在決鬥結束前擊敗目標，她將恢復10點生命值，外加決鬥期間所受傷害的50%。 +3：如果決鬥者在決鬥結束前擊敗目標，她將恢復15點生命值，外加決鬥期間所受傷害的65%。 +4：如果決鬥者在決鬥結束前擊敗目標，她將恢復20點生命值，外加決鬥期間所受傷害的75%。
actors.hero.talent.invigorating_victory.title=令人振奮的勝利
actors.hero.talent.iron_stomach.desc=+1：戰士吃食物會消耗1個回合，並在進食期間獲得75%的傷害抗性。 +2：戰士吃食物會消耗1個回合，並在進食期間獲得100%的傷害抗性。
actors.hero.talent.iron_stomach.title=鐵胃
actors.hero.talent.iron_will.desc=_+1:_戰士印記提供的護盾值_增加1_。 \n\n_+2:_戰士印記提供的護盾值_增加2_。
actors.hero.talent.iron_will.meta_desc=_如果該天賦由其他英雄獲得_，則會被動地賦予戰士破除封印效果的1或2點最大護盾值。
actors.hero.talent.iron_will.title=鋼鐵般的意志
actors.hero.talent.judgement.desc=+1：在昇華形態下，牧師可以施放“審判”，對所有可見敵人造成10-20點傷害。 +2：在昇華形態下，牧師可以施放“審判”，對所有可見敵人造成15-30點傷害。 +3：在昇華形態下，牧師可以施放“審判”，對所有可見敵人造成20-40點傷害。 +4：在昇華形態下，牧師可以施放“審判”，對所有可見敵人造成25-50點傷害。 「審判」消耗3點法術書充能。審判造成的傷害為牧師自進入昇華形態以來或自上次施放審判以來每施放一個法術，傷害就增加 33%。
actors.hero.talent.judgement.title=判斷
actors.hero.talent.lay_on_hands.desc=+1：聖騎士可以施放“聖療術”，該法術可以立即為附近角色恢復15點生命值，或者為聖騎士提供15點護盾值，消耗1點能量。 +2：聖騎士可以施放“聖療術”，該法術可以立即為附近角色恢復20點生命值，或為聖騎士提供20點護盾值，消耗1點能量。 +3：聖騎士可以施放“聖療術”，該法術可以立即為附近角色恢復25點生命值，或為聖騎士提供25點護盾值，消耗1點能量。此法術的額外治療量將轉換為護盾值。聖療術可以重複施放，但一次最多只能施加三次施法的護盾效果。
actors.hero.talent.lay_on_hands.title=為手按
actors.hero.talent.lethal_defense.desc=+1：當角鬥士使用連擊技能擊殺敵人時，其破封護盾的冷卻時間減少50回合。 +2：當角鬥士使用連擊技能擊殺敵人時，其破封護盾的冷卻時間減少100回合。 +3：當角鬥士使用連擊技能擊殺敵人時，其破封護盾的冷卻時間減少150回合。此天賦可將護盾冷卻時間減少至-150回合，這意味著護盾啟動後將立即再次可用。
actors.hero.talent.lethal_defense.title=致命防禦
actors.hero.talent.lethal_haste.desc=+1：當決鬥者使用武器技能擊殺敵人時，她獲得相當於 3 回合的瞬間移動力。 +2：當決鬥者使用武器技能擊殺敵人時，她獲得相當於 5 回合的瞬間移動力。
actors.hero.talent.lethal_haste.meta_desc=_如果該天賦由其他英雄獲得_，則會改為透過普通武器攻擊觸發，冷卻時間為100回合。
actors.hero.talent.lethal_haste.title=致命的匆忙
actors.hero.talent.lethal_momentum.desc=+1：當戰士使用實體武器對敵人造成致命一擊時，有 67% 的機率使敵人失去 0 個回合。 +2：當戰士使用實體武器對敵人造成致命一擊時，有 100% 的機率使敵人失去 0 個回合。
actors.hero.talent.lethal_momentum.title=致命的動量
actors.hero.talent.life_link.desc=牧師可以消耗 2 點能量，在自己和一個強化盟友之間施放 _生命連結_。此法術會使牧師及其盟友分擔傷害，如果其中一人受到影響，則3級或以下的牧師增益法術也會同時作用於兩人。生命連結持續10回合，並將「眾生之力」的加成提升至-35%受到的傷害。生命連結持續13回合，並將「眾生之力」的加成提升至-40%受到的傷害。生命連結持續17回合，並將「眾生之力」的加成提升至-45%受到的傷害。生命連結持續20回合，並將「眾生之力」的加成提升至-50%受到的傷害。
actors.hero.talent.life_link.title=生命連結
actors.hero.talent.light_cloak.desc=+1：盜賊在未裝備暗影斗篷時可以使用它，但未裝備時冷卻速度降低至25%。 +2：盜賊在未裝備暗影斗篷時可以使用它，但未裝備時冷卻速度降低至50%。 +3：盜賊在未裝備暗影斗篷時可以使用它，但未裝備時冷卻速度降低至75%。
actors.hero.talent.light_cloak.meta_desc=_如果該天賦由其他英雄獲得_，則在+1/+2/+3時，所有神器的充能速度將提高7/13/20%。
actors.hero.talent.light_cloak.title=輕型斗篷
actors.hero.talent.light_reading.desc=+1：神父在未裝備聖典時可使用聖典，但聖典冷卻速度降低至25%。 +2：神父在未裝備聖典時可使用聖典，但聖典冷卻速度降低至50%。 +3：神父在未裝備聖典時可使用聖典，但聖典冷卻速度降低至75%。
actors.hero.talent.light_reading.meta_desc=_如果該天賦由其他英雄獲得_，則在+1/+2/+3時，所有魔杖的充能速度將提高7/13/20%。
actors.hero.talent.light_reading.title=輕讀
actors.hero.talent.lingering_magic.desc=+1：當法師使用魔杖或法杖進行攻擊時，他的下一次物理攻擊會造成 1-2 點額外傷害。 +2：當法師使用魔杖或法杖進行攻擊時，他的下一次物理攻擊會造成 2 點額外傷害。
actors.hero.talent.lingering_magic.title=揮之不去的魔力
actors.hero.talent.liquid_agility.desc=+1：當決鬥者飲用或投擲藥水、釀造物或靈藥時，其閃避率和命中率在5回合內的下一次近戰攻擊中提升3倍。 +2：當決鬥者飲用或投擲藥水、釀造物或靈藥時，其閃避率和命中率在5回合內的下一次近戰攻擊中無限提升。使用力量藥水、經驗藥水或必須用這些藥水製作的煉金物品時，此加成效果會額外持續一個回合和一次攻擊。對於產量較高的煉金物品（例如水之釀造物），此天賦的觸發幾率取決於該物品的產量。
actors.hero.talent.liquid_agility.title=液態敏捷性
actors.hero.talent.liquid_nature.desc=+1：當女獵手飲用或投擲藥水、釀造物或靈藥時，周圍區域最多會生長出 4 格草地，相鄰的敵人會被定身 1 回合。 +2：當女獵手飲用或投擲藥水、釀造物或靈藥時，周圍區域最多會生長出 6 格草地，相鄰的敵人會被定身 2 回合。使用力量藥水、經驗藥水或必須用這些藥水製作的煉金物品時，草地數量和定身持續時間會翻倍。對於產量較高的煉金物品（例如水之釀造物），此天賦的觸發幾率取決於該物品的產量。
actors.hero.talent.liquid_nature.title=液態
actors.hero.talent.liquid_willpower.desc=+1：當戰士飲用或投擲藥水、釀造藥劑或靈藥時，可獲得相當於其最大生命值6.5%的護盾。 +2：當戰士飲用或投擲藥水、釀造藥劑或靈藥時，可獲得相當於其最大生命值10%的護盾。使用力量藥水、經驗藥水或必須用這些藥水製作的煉金物品時，護盾值會加倍。對於產量較高的煉金物品（例如水之釀造藥劑），此天賦有一定幾率根據該物品的產量觸發。
actors.hero.talent.liquid_willpower.title=液體意志力
actors.hero.talent.longrange_warp.desc=+1：法師現在可以在樓層間傳送，消耗150%的充能。 +2：法師現在可以在樓層間傳送，消耗117%的充能。 +3：法師現在可以在樓層間傳送，消耗83%的充能。 +4：法師現在可以在樓層間傳送，消耗50%的充能。法師無法使用遠端傳送離開已鎖定的樓層。
actors.hero.talent.longrange_warp.title=遠程躍遷
actors.hero.talent.mind_form.desc=牧師可以施放“心靈形態”，消耗3點充能，使三位一體獲得牧師本次遊戲過程中使用過的魔杖或投擲武器的力量。當使用三位一體時，牧師會使用所選物品的電擊或投擲效果，如同使用過該物品一樣。當使用三位一體時，牧師會使用所選物品的電擊或投擲效果，如同使用過該物品一樣。當使用三位一體時，牧師會使用所選物品的電擊或投擲效果，如同使用過該物品一樣。當使用三位一體時，牧師會使用所選物品的電擊或投擲效果，如同使用過該物品一樣。當使用三位一體時，牧師會使用所選物品的電擊效果，如同使用過該物品一樣。或投擲所選物品的效果，如同它是_+6._\n\nTrinity一次只能被賦予一個精神效果。
actors.hero.talent.mind_form.title=心形
actors.hero.talent.mnemonic_prayer.desc=+1：牧師可以施放“記憶禱言”，該法術消耗1點能量，可將友方/敵方身上的增益/減益效果延長3回合。 +2：牧師可以施放“記憶禱言”，法術消耗1點能量，可將友方/敵方身上的增益/減益效果延長4回合。 +3：牧師可以施放“記憶禱言”，法術消耗1點能量，可將友方/敵方身上的增益/減益效果延長5回合。 「記憶禱言」施法無需時間。它只能將特定增益/減益效果延長一次，且無法延長護甲技能所提供的增益效果。
actors.hero.talent.mnemonic_prayer.title=記憶祈禱
actors.hero.talent.monastic_vigor.desc=+1：如果武僧擁有100%能量，則其技能得到強化。 +2：若武僧擁有80%或以上能量，則其技能得到強化。 +3：若武僧擁有60%或以上能量，則其技能得到強化。強化後：- 亂舞會應用武器的附魔效果；- 專注術瞬發；- 衝刺攻擊範圍+4；- 龍踢傷害+50%，並對所有相鄰敵人施加擊退和眩暈效果；- 冥想緩慢恢復20%已損失生命值，並提供80%傷害抗性。
actors.hero.talent.monastic_vigor.title=修道院的活力
actors.hero.talent.mystical_charge.desc=+1：使用法杖攻擊可使戰鬥法師獲得相當於0.5回合的神器充能。 +2：使用法杖攻擊可使戰鬥法師獲得相當於1回合的神器充能。 +3：使用法杖攻擊可使戰鬥法師獲得相當於1.5回合的神器充能。
actors.hero.talent.mystical_charge.title=神秘能量
actors.hero.talent.mystical_meal.desc=+1：食用食物會使盜賊獲得 1 個回合（補給口糧會立即被吃掉），並使其獲得 3 回合的神器充能。 +2：食用食物會使盜賊獲得 1 個回合（補給口糧會立即被吃掉），並使其獲得 5 回合的神器充能。此天賦不能用於使豐饒號角自行充能。
actors.hero.talent.mystical_meal.title=神秘的餐點
actors.hero.talent.natures_aid.desc=+1：女獵手獲得0-2點樹皮護甲，當植物的效果在她視野中啟動時，該護甲每3回合消失一次。 +2：女獵手獲得0-2點樹皮護甲，當植物的效果在她視野中啟動時，該護甲每5回合消失一次。
actors.hero.talent.natures_aid.title=自然的援助
actors.hero.talent.natures_bounty.desc=+1：女獵人在探索地牢接下來的幾層時，可以在高高的草叢中找到 4 顆漿果。 +2：女獵人在探索地牢接下來的幾層時，可以在高高的草叢中找到 6 顆漿果。漿果可以快速食用，恢復少量飽足感，並且可能含有可用的種子。
actors.hero.talent.natures_bounty.title=大自然的饋贈
actors.hero.talent.natures_wrath.desc=+1：當自然之力啟動時，靈弓的射擊有 8% 的幾率觸發一種隨機有害植物效果。 +2：當自然之力啟動時，靈弓的射擊有 17% 的幾率觸發一種隨機有害植物效果。 +3：當自然之力啟動時，靈弓的射擊有 25% 的幾率觸發一種隨機有害植物效果。 +4：當自然之力啟動時，靈弓的射擊有 33% 的幾率觸發一種隨機有害植物效果。可觸發的植物包括：盲草、火焰花、冰帽、哀草和風暴藤。
actors.hero.talent.natures_wrath.title=大自然的憤怒
actors.hero.talent.necromancers_minions.desc=+1：當一個被靈魂標記的敵人死亡時，術士有 13% 的幾率將其復活為墮落幽靈。 +2：當一個被靈魂標記的敵人死亡時，術士有 27% 的幾率將其復活為墮落幽靈。 +3：當一個被靈魂標記的敵人死亡時，術士有 40% 的幾率將其復活為墮落幽靈。
actors.hero.talent.necromancers_minions.title=死靈法師的爪牙
actors.hero.talent.patient_strike.desc=+1：如果決鬥者在進行近戰攻擊前稍等片刻，她將造成 1-2 點額外傷害。 +2：如果決鬥者在進行近戰攻擊前稍等片刻，她將造成 2 點額外傷害。
actors.hero.talent.patient_strike.title=病人罷工
actors.hero.talent.perfect_copy.desc=+1：分身獲得英雄最大生命值的10%，並可立即與英雄交換最多1格的位置。 +2：分身獲得英雄最大生命值的20%，並可立即與英雄交換最多2格的位置。 +3：分身獲得英雄最大生命值的30%，並可立即與英雄交換最多3格的位置。 +4：分身獲得英雄最大生命值的40%，並可立即與英雄交換最多4格的位置。
actors.hero.talent.perfect_copy.title=完美副本
actors.hero.talent.point_blank.desc=+1：當女獵手在近戰範圍內使用弓箭或投擲武器時，命中率降低25%，而非降低50%。 +2：當女獵手在近戰範圍內使用弓箭或投擲武器時，命中率正常，而非降低50%。 +3：當女獵手在近戰範圍內使用弓箭或投擲武器時，命中率提高25%，而非降低50%。注意：投擲武器或靈弓在遠距離使用時始終具有50%的命中率。
actors.hero.talent.point_blank.title=近距離
actors.hero.talent.precise_assault.desc=+1：決鬥者使用武器技能後，5回合內下一次近戰攻擊的命中率提升2倍。 +2：決鬥者使用武器技能後，5回合內下一次近戰攻擊的命中率提升5倍。 +3：決鬥者使用武器技能後，5回合內下一次近戰攻擊的命中率無限提升。
actors.hero.talent.precise_assault.meta_desc=_如果該天賦由其他英雄獲得_，則會改為近戰命中率提高10%（+1）、20%（+2）或30%（+3）。
actors.hero.talent.precise_assault.title=精準打擊
actors.hero.talent.projectile_momentum.desc=+1：自由奔跑時，投擲武器的命中率提高 50%，傷害提高 15%。 +2：自由奔跑時，投擲武器的命中率提高 100%，傷害提高 30%。 +3：自由奔跑時，投擲武器的命中率提高 150%，傷害提高 45%。
actors.hero.talent.projectile_momentum.title=拋射體動量
actors.hero.talent.projecting_blades.desc=+1：光譜之刃的命中率提高 25%，最多可穿透 2 個實體方塊。 +2：光譜之刃的命中率提高 50%，最多可穿透 4 個實體方塊。 +3：光譜之刃的命中率提高 75%，最多可穿透 6 個實體方塊。 +4：光譜之刃的命中率提高 100%，最多可穿透 8 個實體方塊。
actors.hero.talent.projecting_blades.title=突出的刀片
actors.hero.talent.protective_shadows.desc=+1：盜賊在隱身狀態下每隔一回合獲得一個護盾，最多可獲得 3 個護盾。 +2：盜賊在隱身狀態下每回合獲得一個護盾，最多可獲得 5 個護盾。
actors.hero.talent.protective_shadows.title=保護性的陰影
actors.hero.talent.provoked_anger.desc=+1：當戰士身上的任何護盾增益被傷害打破時，他的下一次物理攻擊將造成 3 點額外傷害。 +2：當戰士身上的任何護盾增益被傷害打破時，他的下一次物理攻擊將造成 5 點額外傷害。
actors.hero.talent.provoked_anger.title=激怒
actors.hero.talent.ratforcements.desc=對自身使用鼠形幻化後，會在你身邊生成 1 隻友方袋鼠。對自身使用鼠形幻化後，會在你身邊生成 2 隻友方袋鼠。對自身使用鼠形幻化後，會在你身邊生成 3 隻友方袋鼠。對自身使用鼠形幻化後，會在你身邊生成 4 隻友方袋鼠。
actors.hero.talent.ratforcements.title=鼠兵
actors.hero.talent.ratlomacy.desc=+1：對已幻化的敵人使用「鼠化」技能，使其變成友善狀態，並使幻化狀態永久生效。 +2：對已幻化的敵人使用「鼠化」技能，使其變為友善狀態，並使幻化狀態永久生效，同時給予其2回合的腎上腺素效果。 +3：對已幻化的敵人使用「鼠化」技能，使其變為友善狀態，並使幻化狀態永久生效，同時給予其4回合的腎上腺素效果。 +4：對已幻化的敵人使用「鼠化」技能，使其變為友善狀態，並使幻化狀態永久生效，同時給予其6回合的腎上腺素效果。
actors.hero.talent.ratlomacy.title=拉特洛米
actors.hero.talent.ratsistance.desc=+1：敵對的鼠形敵人造成-10%傷害。 +2：敵對的鼠形敵人造成-19%傷害。 +3：敵對的鼠形敵人造成-27%傷害。 +4：敵對的鼠形敵人造成-35%傷害。
actors.hero.talent.ratsistance.title=鼠類抵抗
actors.hero.talent.reactive_barrier.desc=+1：法師每受到元素衝擊影響一個角色，便獲得2.5點護盾值，最多影響5個角色。 +2：法師每受到元素衝擊影響一個角色，便獲得5點護盾值，最多影響6個角色。 +3：法師每受到元素衝擊影響一個角色，就獲得7.5點護盾值，最多影響7個角色。 +4：法師每受到元素衝擊影響一個角色，就獲得10點護盾值，最多影響8個角色。
actors.hero.talent.reactive_barrier.title=反應屏障
actors.hero.talent.recall_inscription.desc=+1：牧師可以施放「召回銘文」法術，使其在10回合內重複使用上次使用的符文石或捲軸的效果。 +2：牧師可以施放「回想銘文」法術，使其在300回合內重複使用上次使用的符文石或捲軸的效果。 「召回銘文」不能與升級捲軸一起使用。此法術的充能消耗取決於最近使用的物品：符文石消耗2點，捲軸消耗3點，異域捲軸消耗4點。如果與轉化捲軸或必須使用轉化或升級合成的煉金物品一起使用，則充能消耗翻倍。
actors.hero.talent.recall_inscription.meta_desc=_如果該天賦由其他英雄獲得_，則在+1時有10%的幾率返還任何捲軸或符文石，在+2時有15%的幾率返還任何捲軸或符文石。升級捲軸不受此效果影響。
actors.hero.talent.recall_inscription.refunded=您的商品已退款！
actors.hero.talent.recall_inscription.title=回憶銘文
actors.hero.talent.rejuvenating_steps.desc=+1：當女獵人踩到矮草或餘燼時，它們會變成高草，女獵手會立即犁出一道溝壑。此技能冷卻時間為10回合。 +2：當女獵人踩到矮草或餘燼時，它們會變成高草，女獵手會立即犁出一道溝壑。此技能冷卻時間為5回合。如果被動回復效果被禁用或英雄長時間未獲得經驗值，此天賦將產生犁出的溝壑。
actors.hero.talent.rejuvenating_steps.title=恢復活力的步驟
actors.hero.talent.remote_beacon.desc=+1：法師可以在距離目標 4 格範圍內的任意位置放置信標。 +2：法師可以在距離目標 8 格範圍內的任意位置放置信標。 +3：法師可以在距離目標 12 格範圍內的任意位置放置信標。 +4：法師可以在距離目標 16 格範圍內的任意位置放置信標。法師無法在無法到達的位置放置信標。
actors.hero.talent.remote_beacon.title=遠端信標
actors.hero.talent.rogues_foresight.desc=+1：當盜賊處於有密室的關卡時，他有 75% 的幾率注意到該關卡包含秘密。 +2：當盜賊處於有密室的關卡時，他有 100% 的幾率注意到該關卡包含秘密。
actors.hero.talent.rogues_foresight.title=盜賊的預見
actors.hero.talent.runic_transference.desc=+1：戰士的破損封印可以像轉移升級符文一樣轉移普通符文。 +2：戰士的破損封印可以像轉移升級符文一樣轉移普通符文、強力符文和詛咒符文。封印只能轉移在封印附加時已附加到盔甲上的符文。
actors.hero.talent.runic_transference.meta_desc=如果此天賦由其他英雄獲得，則改為增強護甲上的符文抵抗升級捲軸移除的能力。符文會在護甲等級從4級上升至6級（+1）或從4級上升至7級（+2）時開始遺失。符文必定遺失的等級為+8，不變。
actors.hero.talent.runic_transference.title=符文轉移
actors.hero.talent.satiated_spells.desc=+1：食用食物後，牧師下次施法時獲得 3 點護盾值。 +2：食用食物後，牧師下次施法時獲得 5 點護盾值。
actors.hero.talent.satiated_spells.meta_desc=_如果該天賦由其他英雄獲得_，則會立即給予護盾，護盾會在 10 回合後正常衰減。
actors.hero.talent.satiated_spells.title=滿足咒語
actors.hero.talent.scholars_intuition.desc=+1：法師鑑定魔杖的速度提高 3 倍。 +2：法師在使用魔杖時即可鑑定魔杖。
actors.hero.talent.scholars_intuition.title=學者的直覺
actors.hero.talent.searing_light.desc=+1：牧師對被「指引之光」照亮的敵人造成的物理攻擊額外造成3點傷害。 +2：牧師對被「指引之光」照亮的敵人造成的物理攻擊額外造成5點傷害。
actors.hero.talent.searing_light.meta_desc=_如果該天賦由其他英雄獲得_，則會在對敵人使用魔杖或神器後提供額外傷害，冷卻時間為 20 回合。
actors.hero.talent.searing_light.title=灼熱之光
actors.hero.talent.seer_shot.desc=+1：當女獵人向地面射箭時，會為其周圍3x3範圍內的區域提供視野，持續5回合。此技能冷卻時間為20回合。 +2：當女獵人向地面射箭時，會為其周圍3x3範圍內的區域提供視野，持續10回合。此技能冷卻時間為20回合。 +3：當女獵人向地面射箭時，會為其周圍3x3範圍內的區域提供視野，持續15回合。此技能冷卻時間為20回合。
actors.hero.talent.seer_shot.meta_desc=如果該天賦由其他英雄獲得，則可透過任何投擲武器觸發。
actors.hero.talent.seer_shot.title=先知之槍
actors.hero.talent.shadow_blade.desc=+1：暗影分身每回合獲得英雄8%的傷害加成，並有25%的幾率使用英雄武器上的附魔。 +2：暗影分身每回合獲得英雄16%的傷害加成，並有50%的幾率使用英雄武器上的附魔。 +3：暗影分身每回合獲得英雄24%的傷害加成，並有75%的幾率使用英雄武器上的附魔。 +4：暗影分身每回合獲得英雄32%的傷害加成，並有100%的幾率使用英雄武器上的附魔。
actors.hero.talent.shadow_blade.title=暗影之刃
actors.hero.talent.shadow_step.desc=+1：如果盜賊在隱身狀態下使用煙霧彈，煙霧彈會立即生效，充能消耗降低16%，但不會致盲敵人或觸發其他天賦。 +2：如果盜賊在隱身狀態下使用煙霧彈，煙霧彈會立即生效，充能消耗降低30%，但不會致盲敵人或觸發其他天賦。 +3：如果盜賊在隱身狀態下使用煙霧彈，煙霧彈會立即生效，充能消耗降低41%，但不會致盲敵人或觸發其他天賦。 +4：如果盜賊在隱身狀態下使用煙霧彈，煙霧彈會立即生效，充能消耗降低50%，但不會致盲敵人或觸發其他天賦。
actors.hero.talent.shadow_step.title=影子步
actors.hero.talent.shared_enchantment.desc=+1：投擲武器有 33% 的幾率使用狙擊弓上的附魔。 +2：投擲武器有 67% 的幾率使用狙擊弓上的附魔。 +3：投擲武器有 100% 的幾率使用狙擊弓上的附魔。弓上的附魔可以疊加在投擲武器已有的附魔之上。
actors.hero.talent.shared_enchantment.title=共同的魅力
actors.hero.talent.shared_upgrades.desc=+1：狙擊手使用升級後的投擲武器攻擊時，每公升一級，狙擊手標記的持續時間增加1回合，特殊攻擊的傷害增加16%，最高可達+2級時增加2回合和33%的傷害。 +2：狙擊手使用升級後的投擲武器攻擊時，每公升一級，狙擊手標記的持續時間增加1回合，特殊攻擊的傷害增加16%，最高可達+4級時增加4回合和67%的傷害。 +3：狙擊手使用升級後的投擲武器攻擊時，每公升一級，狙擊手標記的持續時間增加1回合，特殊攻擊的傷害增加16%，最高可達+6級時增加6回合和100%的傷害。
actors.hero.talent.shared_upgrades.title=共享升級
actors.hero.talent.shield_battery.desc=+1：法師可以使用魔杖以自身為目標，將所有充能轉換為護盾，每充能可恢復 4% 的最大生命值。 +2：法師可以使用魔杖以自身為目標，將所有充能轉換為護盾，每充能可恢復 6% 的最大生命值。
actors.hero.talent.shield_battery.title=護盾電池
actors.hero.talent.shield_of_light.desc=+1：牧師可以施放“光之盾”，這是一個立即施放的法術，消耗1點能量，使自身獲得2-4點護甲，持續5回合，對抗目標。 +2：牧師可以施放“光之盾”，這是一個立即施放的法術，消耗1點能量，使自身獲得3-6點護甲，持續5回合，對抗目標。
actors.hero.talent.shield_of_light.meta_desc=_如果該天賦由其他英雄獲得，則改為使目標敵人受到的物理傷害減少 1 點，+1 時有 33% 的幾率減少 1 點，+2 時有 50% 的幾率減少 1 點。
actors.hero.talent.shield_of_light.title=光之盾
actors.hero.talent.shielding_dew.desc=+1：露珠可以在守衛者生命值全滿時為其提供護盾，最高可達其最大生命值的 20%。 +2：露珠可以在守衛者生命值全滿時為其提供護盾，最高可達其最大生命值的 40%。 +3：露珠可以在守衛者生命值全滿時為其提供護盾，最高可達其最大生命值的 60%。
actors.hero.talent.shielding_dew.title=遮蔽露水
actors.hero.talent.shock_force.desc=+1：衝擊波造成的傷害提高20%，並且有25%的幾率使目標昏迷而不是致殘。 +2：衝擊波造成的傷害提高40%，並且有50%的幾率使目標昏迷而不是致殘。 +3：衝擊波造成的傷害提高60%，並且有75%的幾率使目標昏迷而不是致殘。 +4：衝擊波造成的傷害提高80%，並且有100%的幾率使目標昏迷而不是致殘。
actors.hero.talent.shock_force.title=衝擊力
actors.hero.talent.shrug_it_off.desc=+1：戰士在忍耐狀態下的傷害減免從 50% 提升至 60%。 +2：戰士在忍耐狀態下的傷害減免從 50% 提升至 68%。 +3：戰士在忍耐狀態下的傷害減免從 50% 提升至 74%。 +4：戰士在忍耐狀態下的傷害減免從 50% 提升至 80%。
actors.hero.talent.shrug_it_off.title=聳聳肩
actors.hero.talent.silent_steps.desc=+1：當盜賊與熟睡的敵人相距 3 格或以上時，不會吵醒他們。 +2：當盜賊與熟睡的敵人之間不相鄰時，不會吵醒他們。
actors.hero.talent.silent_steps.title=無聲的腳步
actors.hero.talent.soul_eater.desc=+1：靈魂印記每造成一次物理傷害，即可獲得0.33回合的飽食度。被靈魂印記的敵人死亡時有10%的幾率觸發進食效果。 +2：靈魂印記每造成一次物理傷害，即可獲得0.67回合的飽食度。被靈魂印記的敵人死亡時有20%的幾率觸發進食效果。 +3：靈魂印記每造成一次物理傷害，即可獲得1回合的飽食度。被靈魂印記的敵人死亡時有30%的幾率觸發進食效果。
actors.hero.talent.soul_eater.title=噬魂師
actors.hero.talent.soul_siphon.desc=+1：其他角色造成的物理傷害會以 13% 的效果觸發術士的靈魂印記。 +2：其他角色造成的物理傷害會以 27% 的效果觸發術士的靈魂印記。 +3：其他角色造成的物理傷害會以 40% 的效果觸發術士的靈魂印記。
actors.hero.talent.soul_siphon.title=靈魂虹吸
actors.hero.talent.speedy_stealth.desc=+1：自由奔跑者在隱身狀態下每回合獲得2層動量。 +2：除了+1的效果外，自由奔跑在隱身狀態下不再倒數。 +3：除了+1和+2的效果外，自由奔跑者在隱身狀態下移動速度翻倍，無論是否處於自由奔跑狀態。
actors.hero.talent.speedy_stealth.title=快速隱身
actors.hero.talent.spirit_blades.desc=+1：幽靈之刃有 30% 的幾率同時為靈弓附魔。 +2：幽靈之刃有 60% 的幾率同時為靈弓附魔。 +3：幽靈之刃有 90% 的幾率同時為靈弓附魔。 +4：幽靈之刃有 100% 的幾率同時為靈弓附魔，並且每個附魔的效果提升 10%。
actors.hero.talent.spirit_blades.title=靈刃
actors.hero.talent.spirit_form.desc=牧師可以施放“靈體形態”，消耗4點充能，將牧師在本輪遊戲中鑑定出的戒指或神器（聖典除外）的力量賦予三位一體。 +1：使用三位一體時，牧師將獲得一枚戒指+1的效果，持續20回合；或觸發一件神器+4的效果。 +2：使用三位一體時，牧師將獲得一枚戒指+2的效果，持續20回合；或觸發一件神器+6的效果。 +3：使用三位一體時，牧師將獲得一枚戒指+3的效果，持續20回合；或觸發一件神器+3的效果。 _+8._\n\n_+4:_ 使用三位一體時，牧師將獲得一枚戒指的效果，持續 20 回合，等級為 _+4_；或觸發一件神器的效果，等級為 _+10._\n\n。三位一體一次只能附魔一種靈體效果。神器在被三位一體觸發時，其效果和護甲充能消耗各不相同。
actors.hero.talent.spirit_form.title=靈體
actors.hero.talent.stasis.desc=牧師可以消耗2點充能對一個已強化的盟友施放「靜滯術」。靜滯術會暫時將該盟友移出地牢，並保留所有增益效果的剩餘時間，包括「群聚之力」。效果結束後，該盟友會重新出現在你身邊。 「靜滯術」可立即再次施放，且無需消耗充能，從而提前結束效果。靜止狀態對無法移動的盟友有效，但無法在地下城樓層之間移動他們。靜止狀態最多持續 60 回合。靜止狀態最多持續 90 回合。靜止狀態最多持續 120 回合。靜止狀態最多持續 150 回合。牧師也可以在盟友處於靜止狀態時施放光束射線來重新召喚他們，或施放生命連結來預先施加其效果。但是，盟友在靜止狀態下無法從生命連結中受益。
actors.hero.talent.stasis.title=停滯
actors.hero.talent.strengthening_meal.desc=+1：吃食物後，決鬥者在接下來的兩次物理攻擊中，每次攻擊造成3點額外傷害。 +2：吃食物後，決鬥者在接下來的三次物理攻擊中，每次攻擊造成3點額外傷害。
actors.hero.talent.strengthening_meal.title=強化餐
actors.hero.talent.striking_force.desc=+1：元素打擊的效果威力提升30%。 +2：元素打擊的效果威力提升60%。 +3：元素打擊的效果威力提升90%。 +4：元素打擊的效果威力提升120%。
actors.hero.talent.striking_force.title=打擊力量
actors.hero.talent.striking_wave.desc=+1：衝擊波有 30% 的幾率觸發命中效果，例如附魔和連擊。 +2：衝擊波有 60% 的幾率觸發命中效果，例如附魔和連擊。 +3：衝擊波有 90% 的幾率觸發命中效果，例如附魔和連擊。 +4：衝擊波有 100% 的幾率觸發命中效果，例如附魔和連擊，並且使附魔威力提升 20%。
actors.hero.talent.striking_wave.title=衝擊波
actors.hero.talent.strongman.desc=+1：戰士的力量提升 8%，向下取整。 +2：戰士的力量提升 13%，向下取整。 +3：戰士的力量提升 18%，向下取整。
actors.hero.talent.strongman.title=大力士
actors.hero.talent.sucker_punch.desc=+1：盜賊第一次突襲敵人時造成 1-2 點額外傷害。 +2：盜賊第一次突襲敵人時造成 2 點額外傷害。
actors.hero.talent.sucker_punch.title=垂死掙扎
actors.hero.talent.sunray.desc=+1：牧師可以施放“日光術”，該法術造成4-8點傷害，並使目標失明4回合，消耗1點能量。 +2：牧師可以施放“日光術”，該法術造成6-12點傷害，並使目標失明6回合，消耗1點能量。 「日光術」只能使每個目標失明一次，但如果目標已被「日光術」致盲，則改為麻痺。對惡魔和亡靈敵人，「日光術」總是造成最大傷害。
actors.hero.talent.sunray.meta_desc=_如果該天賦由其他英雄獲得_，則會使魔杖和神器使敵人失明 4 回合，+1 時有 15% 的幾率，+2 時有 25% 的幾率。
actors.hero.talent.sunray.title=陽光
actors.hero.talent.survivalists_intuition.desc=+1：女獵人辨識投擲武器的速度提高 3 倍。 +2：女獵人在投擲武器擊中目標時即可識別它們。
actors.hero.talent.survivalists_intuition.title=生存者的直覺
actors.hero.talent.sustained_retribution.desc=+1：戰士造成115%額外傷害，分2次攻擊造成，而非1次攻擊造成100%額外傷害。 +2：戰士造成130%額外傷害，分3次攻擊造成，而非1次攻擊造成100%額外傷害。 +3：戰士造成145%額外傷害，分4次攻擊造成，而非1次攻擊造成100%額外傷害。 +4：戰士造成160%額外傷害，分5次攻擊造成，而非1次攻擊造成100%額外傷害。
actors.hero.talent.sustained_retribution.title=持續報復
actors.hero.talent.swift_equip.desc=+1：決鬥者每20回合可以瞬間切換一次已裝備的武器。 +2：決鬥者每20回合可以瞬間切換兩次已裝備的武器。如果決鬥者擁有此天賦且該天賦未處於冷卻狀態，則快速使用未裝備的武器即可裝備該武器。
actors.hero.talent.swift_equip.title=迅速裝備
actors.hero.talent.swift_spirit.desc=+1：靈鷹的移動速度從 2 格提升至 2.5 格，並且必定閃避前 2 次攻擊。 +2：靈鷹的移動速度從 2 格提升至 3 格，並且必定閃避前 4 次攻擊。 +3：靈鷹的移動速度從 2 格提升至 3.5 格，並且必定閃避前 6 次攻擊。 +4：靈鷹的移動速度從 2 格提升至 4 格，並且必定閃避前 8 次攻擊。
actors.hero.talent.swift_spirit.title=迅捷的靈魂
actors.hero.talent.telefrag.desc=+1：如果法師傳送到另一個角色身上，他會對其造成10-15點傷害，但自身也會受到5點傷害。 +2：如果法師傳送到另一個角色身上，他會對其造成20-30點傷害，但自身也會受到10點傷害。 +3：如果法師傳送到另一個角色身上，他會對其造成30-45點傷害，但自身也會受到15點傷害。 +4：如果法師傳送到另一個角色身上，他會對其造成40-60點傷害，但自身也會受到20點傷害。該天賦不會殺死英雄，自身受到的傷害可以透過魔法抗性效果來降低。
actors.hero.talent.telefrag.title=遠程擊殺
actors.hero.talent.thiefs_intuition.desc=+1：盜賊鑑定戒指的速度提高 2 倍，並且在裝備戒指時即可鑑定戒指的類型。 +2：盜賊在裝備戒指時即可鑑定戒指，拾取戒指時即可鑑定戒指的類型。
actors.hero.talent.thiefs_intuition.title=盜賊的直覺
actors.hero.talent.twin_upgrades.desc=+1：如果冠軍裝備的兩件武器中，有一件等級較低，且比另一件武器低2個或以上等級，則該武器的等級將被提升至與另一件武器相同的等級。 +2：如果冠軍裝備的兩件武器中，有一件等級較低，且比另一件武器低1個或以上等級，則該武器的等級將被提升至與另一件武器相同的等級。 +3：如果冠軍裝備的兩件武器中，有一件等級較低，且與另一件武器等級相同或更低，則該武器的等級將被提升至與另一件武器相同的等級。
actors.hero.talent.twin_upgrades.title=雙重升級
actors.hero.talent.unencumbered_spirit.desc=+1：武僧每使用一件3級或更低等級的裝備，即可獲得額外50%的能量。 +2：武僧每使用一件2級或更低等級的裝備，即可獲得額外75%的能量。 3級裝備的效果不變。 +3：武僧每使用一件1級或更低等級的裝備，即可獲得額外100%的能量。 2級和3級裝備的效果不變。此外，她還會獲得免費的布甲和一副鑲釘手套。注意：此天賦在徒手或使用力量之戒攻擊時無效。
actors.hero.talent.unencumbered_spirit.title=不受束縛的精神
actors.hero.talent.varied_charge.desc=+1：冠軍使用兩種不同的武器技能後，立即恢復0.17點武器充能，無時間限制。 +2：冠軍使用兩種不同的武器技能後，立即恢復0.33點武器充能，無時間限制。 +3：冠軍使用兩種不同的武器技能後，立即恢復0.5點武器充能，無時間限制。
actors.hero.talent.varied_charge.title=不同收費
actors.hero.talent.veterans_intuition.desc=+1：戰士辨識武器的速度提高 1.75 倍，辨識盔甲的速度提高 2.5 倍。 +2：當戰士裝備武器和盔甲時，辨識速度提高 2.5 倍。
actors.hero.talent.veterans_intuition.title=老兵的直覺
actors.hero.talent.wall_of_light.desc=+1：聖騎士可以施放“光之牆”，該法術會在聖騎士前方生成一道3格寬的實體牆，擊退敵人，持續20回合，消耗3點法力值。 +2：聖騎士可以施放“光之牆”，該法術會在聖騎士前方生成一道5格寬的實體牆，擊退敵人，持續20回合，消耗3點法力值。 +3：聖騎士可以施放“光之牆”，該法術會在聖騎士前方生成一道7格寬的實體牆，擊退敵人，持續20回合，消耗3點法力值。此牆可以沿直線或斜線放置。一次只能存在一堵牆。
actors.hero.talent.wall_of_light.title=光之牆
actors.hero.talent.wand_preservation.desc=+1：當法師將新魔杖注入法杖時，舊魔杖的等級變成+0，但此效果只能使用一次。 +2：當法師將新魔杖注入法杖時，舊魔杖的等級變為+0，此效果可以重複使用，冷卻時間為1個英雄等級。
actors.hero.talent.wand_preservation.meta_desc=_如果該天賦由其他英雄獲得_，則將魔杖放入煉金術罐時獲得的奧術樹脂數量將增加 1（+1 時）或 2（+2 時）。
actors.hero.talent.wand_preservation.title=魔杖保存
actors.hero.talent.weapon_recharging.desc=+1：決鬥者在魔杖或神器充能增益效果下，每 15 回合獲得 1 點武器充能。 +2：決鬥者在魔杖或神器充能增益效果下，每 10 回合獲得 1 點武器充能。
actors.hero.talent.weapon_recharging.meta_desc=_如果該天賦由其他英雄獲得_，則會使其在充能+1時造成+5%的近戰傷害，或在充能+2時造成+7.5%的近戰傷害。
actors.hero.talent.weapon_recharging.title=武器充能
actors.hero.talent.wide_search.desc=_+1:_ 盜賊的搜尋半徑從 5x5 正方形增加到 _7x7 圓_。 \n\n_+2:_ 盜賊的搜尋半徑從 5x5 正方形增加到 _7x7 正方形_。
actors.hero.talent.wide_search.meta_desc=_如果該天賦由其他英雄獲得_，則會將其搜尋半徑從 3x3 的正方形增加到 5x5 的圓形（+1），或從 5x5 的正方形增加到 2。
actors.hero.talent.wide_search.title=廣泛搜尋
actors.hero.talent.wild_momentum.desc=+1：使用靈弓擊殺敵人可使自然之力持續時間延長1回合，最多可延長2回合。 +2：使用靈弓擊殺敵人可使自然之力持續時間延長2回合，最多可延長4回合。 +3：使用靈弓擊殺敵人可使自然之力持續時間延長3回合，最多可延長6回合。 +4：使用靈弓擊殺敵人可使自然之力持續時間延長4回合，最多可延長8回合。
actors.hero.talent.wild_momentum.title=狂野的勢頭
actors.hero.talent.wild_power.desc=_+1:_ 使用狂野魔法時，魔杖的威力將提升 _2 或 3，最高可達 +4_。 \n\n_+2:_ 使用狂野魔法時，魔杖的威力將提升 _3，最高可達 +5_。 \n\n_+3:_ 使用狂野魔法時，魔杖的威力將提升 _3 或 _4，最高可達 +6_。 \n\n_+4:_ 使用狂野魔法時，魔杖的威力將提升 _4，最高可達 +7_。
actors.hero.talent.wild_power.title=野性力量
actors.mobs.acidic.desc=這些體型巨大的蛛形惡魔生物避免近身搏鬥，更喜歡從遠處發射威力強大的鋸齒狀尖刺。這只似乎渾身滴著腐蝕性黏液。
actors.mobs.acidic.name=酸性天蠍座
actors.mobs.albino.desc=這是一種罕見的袋鼠品種，擁有純白色的皮毛和鋸齒狀的牙齒。
actors.mobs.albino.discover_hint=這種敵人很少會在地牢的特定區域出現。
actors.mobs.albino.name=白化大鼠
actors.mobs.armoredbrute.desc=地位最高的豺狼人蠻獸通常穿著堅固的盔甲以彰顯其身份。這身盔甲使它們對物理傷害的抵抗力大大增強，而它們自身更強的自律性也意味著它們能在傷重不治前持續狂暴更長時間。
actors.mobs.armoredbrute.name=裝甲蠻獸
actors.mobs.armoredstatue.desc=你可能會認為它只是地牢裡眾多無生命的雕像之一，但它那雙閃著紅光的眼睛卻暴露了它的身份。它看起來狀態極佳，因為它穿著盔甲，可能很難被殺死。
actors.mobs.armoredstatue.desc_arm_wep=雖然雕像本身是用石頭做的，但它所揮舞的_%1$s_和_%2$s_看起來很逼真。
actors.mobs.armoredstatue.name=盔甲雕像
actors.mobs.bandit.desc=地牢深處一直是各種罪犯的藏身之處。長時間遠離陽光，並非所有人都能保持清醒的頭腦。很久以前，這些瘋狂的盜賊和強盜早已忘記了自己是誰，也忘記了自己為何而偷竊。
actors.mobs.bandit.name=瘋狂強盜
actors.mobs.bat.desc=這些生活在洞穴中的敏捷而頑強的生物遠比看起來危險得多。它們每次成功攻擊都能恢復生命值，這使它們能夠擊敗體型遠大於自己的對手。
actors.mobs.bat.name=吸血蝙蝠
actors.mobs.bee.desc=儘管體型很小，金蜜蜂卻會拼命保護自己的巢穴。這隻金蜜蜂非常生氣，最好離它遠一點。
actors.mobs.bee.desc_honey=儘管體型很小，金蜂會拼命保護自己的巢穴。這隻金蜂已經被安撫了，似乎想跟著你走。
actors.mobs.bee.discover_hint=你可以透過特定物品找到這個角色。
actors.mobs.bee.name=金蜂
actors.mobs.brute$bruterage.desc=這隻豺狼蠻獸快要死了，但它想拉你一起陪葬！當它的護盾消失時，它就會死亡，護盾消失的原因可能是時間到了，也可能是受傷了。在此期間，它的攻擊力會大幅提升，所以要小心！剩餘護盾值：
actors.mobs.brute$bruterage.name=蠻橫的憤怒
actors.mobs.brute.def_verb=已屏蔽
actors.mobs.brute.desc=豺狼暴徒是豺狼人中體形最大、力氣最強、最耐打的。受了重傷後，牠們會陷入狂怒，對敵人造成更大的傷害。
actors.mobs.brute.enraged=憤怒
actors.mobs.brute.name=豺狼暴徒
actors.mobs.causticslime.desc=這團黏液似乎受到了下方散發出的黑暗魔法的污染。它失去了原本的綠色，並且滴落著腐蝕性的黏液。
actors.mobs.causticslime.discover_hint=這種敵人很少會在地牢的特定區域出現。
actors.mobs.causticslime.name=腐蝕性黏液
actors.mobs.crab.desc=這些巨型螃蟹位於下水道食物鏈的頂端。它們速度極快，厚實的甲殼能夠承受重擊。
actors.mobs.crab.name=下水道螃蟹
actors.mobs.crystalguardian.def_verb=已屏蔽
actors.mobs.crystalguardian.desc=這些巨大的水晶守衛者看起來幾乎像雕像，除非它們那雙閃閃發光的眼睛。它們由堅硬的水晶構成，這使得它們行動遲緩但極其堅韌，因此最好讓它們盡可能長時間地待在水晶巢穴中休息。由於體型龐大，水晶守護者在封閉空間內的移動速度會慢很多。它們也極為耐打，幾乎不可能被徹底殺死。雖然它們可以被擊倒並暫時失去行動能力，但過一會兒就會重新站起來。
actors.mobs.crystalguardian.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.crystalguardian.name=水晶守護者
actors.mobs.crystalmimic.ate=模仿者吃了你的 %s！
actors.mobs.crystalmimic.desc=擬態怪是一種魔法生物，可以隨意變換形態。在地下城中，它們幾乎總是選擇寶箱的形狀來引誘毫無戒心的冒險者。水晶擬態怪比普通的擬態怪更狡猾，它們更喜歡在竊取戰利品時避免衝突。一旦被發現，它們會試圖快速逃跑，並且擁有在攻擊時改變敵人位置的能力。
actors.mobs.crystalmimic.escaped=水晶仿生體逃脫了！
actors.mobs.crystalmimic.name=晶體模擬物
actors.mobs.crystalspire.alert=震動越來越強，隆隆聲響徹整個洞穴！
actors.mobs.crystalspire.desc=這根巨大的超硬水晶尖塔很可能是洞穴裡所有奇怪水晶生物的源頭。你的普通武器對它無效，所以如果你想摧毀它，你必須使用鎬。 _在開始破壞它之前，務必做好充分準備。 _如此巨大的水晶可能需要很長時間才能挖掘完畢，而且你很可能無法在不受干擾的情況下完成。尖塔本身可能也擁有某種防禦機制。 _或許可以利用尖塔自身的攻擊來對付它的爪牙。 _
actors.mobs.crystalspire.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.crystalspire.name=水晶尖塔
actors.mobs.crystalspire.warning=敲擊水晶時，它會震動。一直這樣做肯定會引起別人的注意…
actors.mobs.crystalwisp.beam_kill=那道光束殺死了你…
actors.mobs.crystalwisp.desc=一小塊憤怒的、漂浮的硬化水晶碎片，發出耀眼的光芒。雖然威力不大，但如果它們有機會，就會向你發射一道具有破壞性的光束。這些水晶碎片體積很小，可以輕鬆穿過各種水晶凸起，但它們無法穿透水晶發射光束。
actors.mobs.crystalwisp.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.crystalwisp.name=水晶薄霧
actors.mobs.demonspawner.desc=這種由矮人血肉扭曲而成的混合體，負責將這片區域內死去的矮人轉化為撕裂惡魔。顯然，這些惡魔毫不猶豫地利用一切資源對付敵人。雖然惡魔生成器看起來十分恐怖，但它們既無法移動，也無法直接防禦。不過，它們龐大的體型使得它們難以被迅速殺死，而且當受到威脅時，它們會更快地生成撕裂惡魔。惡魔生成器似乎與某種中央惡魔力量來源相連。殺死它們或許能夠削弱這種力量。
actors.mobs.demonspawner.name=惡魔生成器
actors.mobs.demonspawner.on_death=這裡的惡魔能量似乎隨著生成器的死亡而減弱。
actors.mobs.dm100.desc=DM-100是矮人早期開發的一種“防禦機器”，原本是為了保護監獄下方洞穴中的矮人礦工而設計的。然而，它的電擊威力太弱，於是被贈送了地上的人類城市。這些機器閒置多年，最後輾轉到了監獄。典獄長最初認為它們過於殘酷，不宜使用。但隨著囚犯們越來越桀駿不馴，這些機器最後還是成了必需品。
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=閃電擊中了你…
actors.mobs.dm200.desc=DM-200是矮人第二代“防禦機器”，其設計目的是為了保護洞穴和地下城市的矮人礦工。它們比前代產品體型更大、更笨重，並使用威力巨大的液壓拳套進行攻擊。然而，體積的增加也是它們的主要弱點，因為它們無法進入地牢狹窄的隧道和門道。矮人們透過讓DM-200向遠處的敵人或它們無法攻擊到的敵人排放有毒廢氣來彌補其機動性的不足。
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 噴射出一股有毒的廢氣！
actors.mobs.dm201.desc=矮人們曾短暫嘗試進一步強化DM-200機動性不足的特性，並製造了一些完全固定不動的DM型號。 DM-201是在DM-200的基礎上進行改裝而成的，它作為哨兵砲塔，完全喪失了移動能力。作為機動性不足的補償，DM-201擁有顯著提升的耐久性和攻擊力。由於DM-201沒有引擎排放廢氣，矮人們便為其配備了腐蝕性毒氣手雷！不過，DM-201使用這些手雷時非常謹慎，只有在受到遠距離攻擊時才會投擲。
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 投擲了一枚腐蝕性手榴彈！
actors.mobs.dm300.charge_lost=輸電塔被毀！恢復本地供電！
actors.mobs.dm300.charging=持續受損！啟動動力塔！
actors.mobs.dm300.charging_hint=DM-300 在電塔供電時是刀槍不入的！
actors.mobs.dm300.def_verb=已屏蔽
actors.mobs.dm300.defeated=嚴重傷害！嘗試關閉
actors.mobs.dm300.desc=這台機器是矮人在幾個世紀前製造的。後來，矮人開始用魔像、元素生物，甚至惡魔取代機器，最終導致了文明的衰落。DM-300及同類機器通常用於建築和採礦，有時也用於保衛城市。
actors.mobs.dm300.desc_supercharged=DM-300 目前充滿電能。在這種狀態下，DM-300 刀槍不入，移動速度翻倍！此外，它的鑽頭旋轉速度也足以穿透堅硬的岩石，儘管此時它的移動速度會大幅降低。直接攻擊處於超強充能狀態的 DM-300 毫無意義，但周圍一定有某種東西在為其提供能量，摧毀該能量源或許能削弱它。
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=發現未經授權人員！
actors.mobs.dm300.pylons_destroyed=警報！電網偵測到不穩定！
actors.mobs.dm300.rankings_desc=被DM-300碾壓
actors.mobs.dm300.shield=DM-300 從裸露的電線中汲取電力並屏蔽自身！
actors.mobs.dm300.supercharged=摧毀！摧毀！摧毀！
actors.mobs.dwarfking$dkghoul.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking$dkgolem.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking$dkmonk.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking$dkwarlock.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking.defeated=你……把我們都害慘了……
actors.mobs.dwarfking.desc=多年前，矮人宮廷中一位地位顯赫的巫師發現了賦予他掌控生死的強大力量的秘密。他很快便濫用這種力量，征服並腐化了他的同僚、國王，最終控制了所有矮人子民。如今，他已成為國王，統治著一支亡靈大軍。矮人王是一位極具侵略性的敵人，他會試圖用他的亡靈大軍包圍並壓制敵人。
actors.mobs.dwarfking.enraged=你殺不死我，%s。我是不死的！
actors.mobs.dwarfking.lifelink_1=我需要你的精華，奴隸！
actors.mobs.dwarfking.lifelink_2=奴隸，為我流血吧！
actors.mobs.dwarfking.losing=不！你不能這樣做……你根本不知道下面是什麼……
actors.mobs.dwarfking.name=矮人王
actors.mobs.dwarfking.notice=你竟敢如此！你根本不知道自己在干涉什麼！
actors.mobs.dwarfking.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking.teleport_1=去對付他們，奴隸！
actors.mobs.dwarfking.teleport_2=讓他們忙起來，奴隸！
actors.mobs.dwarfking.wave_1=夠了！我的奴隸們，起來！
actors.mobs.dwarfking.wave_2=更多！為你的國王流血！
actors.mobs.dwarfking.wave_3=沒用！立刻殺了他們！
actors.mobs.ebonymimic.desc=擬態怪是一種魔法生物，可以隨意變換形狀。在地下城中，它們幾乎總是偽裝成寶箱，引誘毫無防備的冒險者。黑檀擬態怪是一種隱密的擬態怪，擁有近乎隱形的能力。它們潛伏在冒險者可能接觸的物體上，但本身也藏有寶藏。一旦被發現，它們並不比普通的擬態怪更難對付，但它們的突襲卻威力巨大。
actors.mobs.ebonymimic.discover_hint=你可以使用特定的飾品來找到這個敵人。
actors.mobs.ebonymimic.hidden_desc=這裡面似乎有些東西，但幾乎完全透明。
actors.mobs.ebonymimic.hidden_name=可疑輪廓
actors.mobs.ebonymimic.name=烏木擬態
actors.mobs.ebonymimic.reveal=那裡有個模仿者！
actors.mobs.elemental$chaoselemental.desc=元素生物是混亂的生物，通常在強大的神秘魔法失控時產生。元素生物智力低下，通常與某種特定類型的魔法相關聯。混沌元素生物是罕見且危險的元素生物，它們尚未穩定地歸屬於任何特定元素。它們攻擊時會釋放狂野而不可預測的魔法。
actors.mobs.elemental$chaoselemental.name=混沌元素
actors.mobs.elemental$fireelemental.desc=元素生物是混亂的生物，通常在強大的神秘魔法失控時產生。元素生物智力低下，通常與某種特定類型的魔法相關聯。火元素是一種常見的元素生物，它們使用火焰魔法造成傷害。它們會用近戰攻擊點燃目標，偶爾也會發射火球。
actors.mobs.elemental$fireelemental.name=火元素
actors.mobs.elemental$frostelemental.desc=元素生物是混亂的生物，通常在強大的神秘魔法失控時誕生。元素生物智力低下，通常與某種特定類型的魔法相關聯。冰霜元素生物是一種常見的元素生物，它們會用冰凍魔法削弱敵人。它們會用近戰攻擊和偶爾的遠程攻擊來冰凍目標。它們的魔法在水中效果更佳。
actors.mobs.elemental$frostelemental.name=冰霜元素
actors.mobs.elemental$newbornfireelemental.charging=元素正在充能！
actors.mobs.elemental$newbornfireelemental.desc=元素生物是混亂的生物，通常在強大的神秘魔法失控時產生。元素生物智力低下，通常與某種特定類型的魔法相關聯。這隻火元素是剛剛召喚出來的，但仍然非常危險！
actors.mobs.elemental$newbornfireelemental.desc_ally=由於這個元素生物是由法術召喚而來，因此它對火焰的控制能力更強。它無法進行遠程攻擊，但點燃近戰攻擊的敵人。
actors.mobs.elemental$newbornfireelemental.desc_boss=由於其召喚過程混亂，該元素生物只能在充能一回合後以不精確的方式散播火焰。
actors.mobs.elemental$newbornfireelemental.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.elemental$newbornfireelemental.name=新火元素
actors.mobs.elemental$shockelemental.desc=元素生物是混亂的生物，通常在強大的神秘魔法失控時產生。元素生物智力低下，通常與某種特定類型的魔法相關聯。電擊元素是一種較為罕見的元素生物，它們會用電流和閃光幹擾敵人。近戰時，它們會向附近的敵人釋放電弧，如果主要目標在水中，則會對其造成額外傷害。它們偶爾也會向目標發射一道遠程光束，使其暫時失明。
actors.mobs.elemental$shockelemental.name=衝擊元素
actors.mobs.eye.deathgaze_kill=那道死亡凝視殺了你…
actors.mobs.eye.desc=這種惡魔又被稱為「憎恨之球」。一旦發現敵人，牠就會不顧一切地射出死亡凝視，常常連同伴也一起打傷。
actors.mobs.eye.name=邪眼
actors.mobs.fetidrat.desc=這隻老鼠顯然有問題。它油膩的黑色皮毛和腐爛的皮膚與你之前見過的健康老鼠截然不同。它那蒼白的綠色眼睛更增添了幾分凶神惡煞。這隻老鼠散發著一股令人作嘔的惡臭，近距離聞起來更是刺鼻難聞。黑色的黏液從老鼠嘴裡流出來，它啃穿了地板，但似乎遇水就化了。
actors.mobs.fetidrat.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.fetidrat.name=臭老鼠
actors.mobs.fungalcore.desc=這朵巨大的蘑菇一定是這個洞穴裡所有真菌活動的源頭。
actors.mobs.fungalcore.name=真菌核心
actors.mobs.fungalsentry.desc=這朵特別高的蘑菇是洞穴中大型真菌網絡的防線。它雖然無法移動，但會向任何進入其視線範圍的生物發射精準的毒液衝擊波。雖然這些衝擊波的威力相對較弱，但_它們能迅速累積致命的毒素量_。雖然它可以被殺死，但最好還是避開它。
actors.mobs.fungalsentry.name=真菌哨兵
actors.mobs.fungalspinner.desc=這隻洞穴織網蛛似乎被一種寄生真菌控制了。真菌也改變了它的能力，用真菌植株取代了蛛網和毒囊。真菌織網蛛會向你噴射植物而不是蛛網，傳播真菌植被，並有可能將你困住。雖然它不會造成中毒，但如果它靠近蘑菇，就會獲得顯著的傷害抗性。
actors.mobs.fungalspinner.name=真菌紡絲器
actors.mobs.ghoul.desc=隨著矮人社會逐漸瓦解，現任矮人國王攫取了絕對權力，那些弱小或反抗他的人都受到了不公正的對待。國王對黑暗魔法的運用日益精湛，他逐漸將這些矮人納入自己的掌控，如今他們成了他軍隊的步兵。食屍鬼單獨行動並不特別強大，但它們總是成群結隊地行動，數量越多越難對付。 _當一個食屍鬼被擊敗後，只要附近有另一個食屍鬼，它就會在幾個回合後復活。 _
actors.mobs.ghoul.name=矮人食屍鬼
actors.mobs.gnoll.desc=豺狼人是類似鬣狗的人形生物。它們棲息於下水道和地牢，偶爾會冒險來到地面劫掠。豺狼人斥候是其族群的普通成員，它們的力量不如蠻獸，智慧也不如薩滿。
actors.mobs.gnoll.name=豺狼人偵察兵
actors.mobs.gnollexile.desc=這隻灰毛豺狼人肩膀上有一道醒目的印記，顯示它是一名流亡者。豺狼人通常因為違抗命令或觸犯法律而被逐出族群。流亡者必須強大而狡猾才能生存，這隻豺狼人看起來似乎很擅長使用它手中的長矛。
actors.mobs.gnollexile.desc_aggro=豺狼人流放者憤怒地環顧四周。看來它最終還是決定戰鬥了。小心那長矛！
actors.mobs.gnollexile.desc_passive=那隻被放逐的豺狼人並沒有攻擊的意圖。它看起來不像這裡的其他豺狼人那麼好鬥，可能覺得跟你打架不值得。你可以放它走，但它背著一個背包，裡面可能裝滿了有用的東西…
actors.mobs.gnollexile.name=豺狼人流放
actors.mobs.gnollexile.seen_aggro=手持長矛的豺狼人發動攻擊！
actors.mobs.gnollexile.seen_passive=手持長矛的豺狼人警戒地看著你，但並沒有攻擊你。
actors.mobs.gnollgeomancer.alert=地卜師醒了！整個洞穴彷彿都隨之移動，它一邊瘋狂大笑一邊躍離洞穴！
actors.mobs.gnollgeomancer.desc=這位身材高大、氣勢逼人的豺狼人老者，想必是此地各種土方魔法的源頭，也是所有豺狼人活動的組織者。與此地的豺狼人工兵不同，這位土方術士精通魔法，而且刀槍不入，不受投擲或墜落的岩石傷害。不過，它卻不具備任何近戰能力。
actors.mobs.gnollgeomancer.desc_armor=地術士目前被一層岩石盔甲包裹著。你需要靠近並用鎬子鑿開這層盔甲才能傷害到地術士。
actors.mobs.gnollgeomancer.desc_armor_sapper=附近有個豺狼人工兵拿著一個裝置，正在強化地術士的岩石盔甲。你現在根本無法對其造成任何傷害！
actors.mobs.gnollgeomancer.desc_sleeping=這位高大的豺狼人薩滿被一層岩石包裹著，看起來幾乎像一尊雕像。仔細觀察，你會發現岩石會隨著這位年長豺狼人的呼吸而神奇地移動。它被這樣包裹在岩石之中，刀槍不入，看起來正享受著真正的「土眠」。你或許可以用鎬子鑿開這些岩石層，但_務必做好戰鬥準備。 _這位地脈術士一定是周圍各種土方魔法的源頭，也是所有豺狼人活動的組織者。 _在與它戰鬥之前，最好先消滅散落在周圍的豺狼人。 _
actors.mobs.gnollgeomancer.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.gnollgeomancer.name=豺狼人地卜師
actors.mobs.gnollgeomancer.rock_kill=飛來的巨石砸死了你…
actors.mobs.gnollgeomancer.rockfall_kill=你被落石砸死了…
actors.mobs.gnollgeomancer.warning=風水師開始活動。請確保您已準備好再繼續！
actors.mobs.gnollguard.def_verb=已屏蔽
actors.mobs.gnollguard.desc=一個體型龐大、外表兇悍的豺狼人，手持長矛和盾牌，但沒有戴頭盔。這些守衛很可能是正在接受訓練的蠻漢，被招募來保護礦井免受野生動物的侵擾。豺狼人守衛力大無窮，可以單手揮舞長矛，但使用技巧並不純熟。 _它需要相當開闊的空間才能進行遠距離攻擊，如果你靠近它，它對你造成的傷害會明顯降低。 _
actors.mobs.gnollguard.desc_armor=附近一名豺狼人工兵拿著一個裝置，能賦予這名守衛泥土護甲，大幅降低他所受到的傷害。
actors.mobs.gnollguard.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.gnollguard.name=豺狼人守衛
actors.mobs.gnollguard.spear_warn=豺狼人用長矛尖端狠狠地擊中了目標！
actors.mobs.gnollsapper.desc=一個體型矮小、力量較弱但智力超群的豺狼人，有著淺色的皮毛，背著一個裝滿各種小玩意兒的挎包。他們很可能是來協助勘探和開採暗金的，附近還有守衛保護。他們雖然具備戰鬥能力，但攻擊力極為微弱，甚至不如豺狼人偵察兵。工兵們並非直接攻擊，而是更傾向於利用各種小玩意兒讓岩石環境為他們造成攻擊。然而，他們本身並不掌握土方魔法，因此很可能會魯莽地使用這些小玩意兒。應該有很多方法可以利用他們的攻擊來對付他們，或是他們的守衛。
actors.mobs.gnollsapper.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.gnollsapper.name=豺狼人工兵
actors.mobs.gnolltrickster.desc=即使以豺狼人的標準來看，它也長相怪異。它弓著身子，咧著嘴露出邪惡的笑容，幾乎是抱著掛在肩上的挎包。它的眼睛睜得大大的，既有恐懼又有興奮，眼神十分複雜。挎包裡裝著一大堆做工粗糙的飛鏢，每支飛鏢的尖端似乎都塗上各種有害物質。
actors.mobs.gnolltrickster.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.gnolltrickster.name=豺狼人騙術師
actors.mobs.goldenmimic.desc=擬態怪是一種可以隨意變換形狀的魔法生物。在地下城中，它們幾乎總是偽裝成寶箱，以此引誘毫無戒心的冒險者。黃金擬態怪則更為強大，它們會試圖吸引最強大的冒險家。它們掉落的戰利品更加豐厚，但自身也比一般擬態怪強大許多。
actors.mobs.goldenmimic.name=金色擬態
actors.mobs.golem.def_verb=已屏蔽
actors.mobs.golem.desc=矮人試圖將機械知識與新掌握的元素束縛術結合起來。他們把大地精靈放進魔像的機械身軀，作為它們的靈魂，因為這些精靈被認為最容易控制。儘管如此，儀式中哪怕出了一點差錯，也可能讓魔像失控。
actors.mobs.golem.name=魔像
actors.mobs.goo.!!!=！ ！ ！
actors.mobs.goo.defeated=咕嚕咕嚕……咕嚕咕嚕……
actors.mobs.goo.desc=人們對黏咕所知甚少。牠或許根本不是生物，而是下水道裡的各種物質聚成一團，漸漸有了些自己的意志。
actors.mobs.goo.enraged=憤怒
actors.mobs.goo.gluuurp=咕嚕咕嚕！
actors.mobs.goo.name=黏咕
actors.mobs.goo.notice=咕嚕咕嚕！
actors.mobs.goo.pumpup=Goo正在自我充氣！
actors.mobs.goo.rankings_desc=被黏液吸收
actors.mobs.greatcrab.def_verb=已屏蔽
actors.mobs.greatcrab.desc=這隻螃蟹體型巨大，即使與其他下水道螃蟹相比也毫不遜色。它藍色的甲殼佈滿裂縫和藤壺，顯示出它已相當古老。它行動緩慢，僅靠巨大的螯勉強保持平衡。雖然這隻螃蟹只有一隻螯，但它龐大的身軀足以彌補這一缺陷。螃蟹會用螯擋在威脅面前，用堅不可摧的甲殼保護自己。然而，螃蟹無法抵抗它看不到的攻擊，也無法同時抵禦多個敵人的攻擊。
actors.mobs.greatcrab.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.greatcrab.name=大蟹
actors.mobs.greatcrab.noticed=螃蟹用它巨大的蟹鉗阻擋。
actors.mobs.guard.def_verb=已屏蔽
actors.mobs.guard.desc=這些曾經的監獄守衛，如今早已與囚犯無異。他們像行屍走肉般蹣跚而行，漫無目的地在走廊上遊蕩，尋找任何異常之處，就像你一樣！他們腰間掛著鎖鏈，或許是用來將敵人拉近的。
actors.mobs.guard.name=獄警
actors.mobs.guard.scorpion=過來！
actors.mobs.hermitcrab.def_verb=已屏蔽
actors.mobs.hermitcrab.desc=不知何故，這隻下水道螃蟹竟然把破損的桶身頂在了頭上！額外的重量讓它的速度降到了正常水平，但也大大增強了它的防禦力。不過，你好像聽到桶子裡有東西在晃動…
actors.mobs.hermitcrab.name=寄居蟹
actors.mobs.mimic.desc=擬態怪是一種魔法生物，可以隨意變換形狀。在地下城裡，它們幾乎總是選擇寶箱的形狀來引誘毫無戒心的冒險者。擬態怪的咬合力很強，但通常比普通的寶箱藏有更多寶物。
actors.mobs.mimic.discover_hint=你可以在地牢的任何地方遇到這種敵人。
actors.mobs.mimic.hidden_hint=這個箱子感覺有點不對勁……走上前去試圖打開它可能不是個好主意。
actors.mobs.mimic.name=寶箱怪
actors.mobs.mimic.reveal=那個箱子是仿製品！
actors.mobs.mob.died=你聽到遠處傳來什麼東西死亡的聲音。
actors.mobs.mob.discover_hint=你可以在地牢的特定區域找到這種敵人。
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=被 %s 擊殺
actors.mobs.monk$focus.desc=這位僧侶的注意力完全集中在目標身上，似乎能預判對手的行動。專注狀態下，無論在何種情況下，下一次針對他的物理攻擊都必定落空。格擋這次攻擊會消耗僧侶的專注值，需要重新累積專注值才能再次阻擋攻擊。僧侶在移動中累積專注值的速度更快。
actors.mobs.monk$focus.name=專注
actors.mobs.monk.def_verb=已屏蔽
actors.mobs.monk.desc=這些僧侶是一群狂熱分子，一心守護城市的秘密，不讓任何外人染指。他們不穿護甲，也不拿武器，只憑徒手格鬥的本領作戰。
actors.mobs.monk.name=矮人僧侶
actors.mobs.monk.parried=招架
actors.mobs.necromancer$necroskeleton.desc=這具骷髏是由一位死靈法師召喚的。它的行為與普通骷髏無異，當召喚它的死靈法師被殺死時，它也會隨之死亡。
actors.mobs.necromancer$necroskeleton.name=死靈法師的骨架
actors.mobs.necromancer.desc=這些黑暗法師學徒蜂擁而至，因為這裡是他們練習邪惡魔法的理想場所。死靈法師會召喚並強化骷髏為他們而戰。殺死死靈法師也會殺死它召喚的骷髏。
actors.mobs.necromancer.name=死靈法師
actors.mobs.npcs.blacksmith.cant_enter_old=本次遊戲無法進入該區域。請重新開始遊戲以嘗試新任務！
actors.mobs.npcs.blacksmith.def_verb=已屏蔽
actors.mobs.npcs.blacksmith.desc=這位巨魔鐵匠的外表和其他巨魔一樣：身材高挑精瘦，皮膚的顏色和質地都像石頭一樣堅硬。他正在擺弄著一些比例失衡的小工具。
actors.mobs.npcs.blacksmith.enter_no=還沒有
actors.mobs.npcs.blacksmith.enter_yes=我準備好了
actors.mobs.npcs.blacksmith.entrance_blocked=下山的路被堵住了。
actors.mobs.npcs.blacksmith.exit_no=還沒有
actors.mobs.npcs.blacksmith.exit_warn_crystal=那塊巨大的水晶還在下面。如果你把它毀掉，我會額外付錢。
actors.mobs.npcs.blacksmith.exit_warn_full=你搞定了？你帶了不少金子，但確保你沒有落下任何裝備。記住，你上來之後我就不讓你再進來了。
actors.mobs.npcs.blacksmith.exit_warn_fungi=那朵巨型蘑菇還在下面呢。你要是能把它弄死，我願意額外付錢。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=那個豺狼人地術士還在下面。你要是殺了它，我額外付錢。
actors.mobs.npcs.blacksmith.exit_warn_high=你弄完了嗎？看起來你已經存了不少金子，但我還需要一些。你應該可以弄到40個。記住，一旦你上來，我就不會再讓你進來了。
actors.mobs.npcs.blacksmith.exit_warn_low=這就完了？看起來你沒弄到多少金子。你應該可以拿到40個。記住，你上來之後我就不讓你再進來了。
actors.mobs.npcs.blacksmith.exit_warn_med=你挖完了嗎？你至少挖到了一些金子，但礦裡肯定還有更多。你應該可以挖到40塊。記住，你上來之後我就不讓你再進去了。
actors.mobs.npcs.blacksmith.exit_warn_none=這就完了？你幾乎沒拿到什麼金幣！你應該可以拿到40個。記住，你上來之後我就不讓你再進來了。
actors.mobs.npcs.blacksmith.exit_yes=我受夠了
actors.mobs.npcs.blacksmith.get_lost=我很忙。滾開！
actors.mobs.npcs.blacksmith.intro_quest_cleric=嘿，人類！你看起來像個重要人物。
actors.mobs.npcs.blacksmith.intro_quest_crystal=不過要小心，礦井對你這樣的小傢伙來說很危險。它已經廢棄很久了，裡面長了很多水晶。它們閃閃發光，但太脆弱了，沒什麼價值，而且還有一些魔法保護著它們。這些水晶很堅固，所以_小心你的礦井位置_，否則你會引起它們的注意。礦井裡還有一顆_巨大的水晶_。它堅硬得多，所以如果你開始破壞它，做好戰鬥的準備。不過我敢打賭，砸碎它應該可以減緩所有水晶的生長速度，所以如果你能做到，我會額外付你錢。
actors.mobs.npcs.blacksmith.intro_quest_duelist=嘿，人類！你看起來很勇敢。
actors.mobs.npcs.blacksmith.intro_quest_fungi=不過要小心，礦井對你這樣的小傢伙來說很危險。那裡長著某種真菌怪物。它有蘑菇哨兵，如果被它們發現會非常致命，但至少它們不會站起來追你。 _想活命就躲開_。如果你能幹掉_最大的蘑菇_，我會額外付你錢，但這需要費一番功夫。它連接著許多隱藏在牆壁裡的菌絲節點。你必須先破壞大部分菌絲節點才能真正對它造成傷害。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=不過要小心，礦井對你這樣的小傢伙來說很危險。有些豺狼人也想要黃金，現在它們正在破壞礦井。這些傢伙很蠢，它們的採礦活動造成了各種各樣的坍塌和塌方。你必須挖穿礦井，所以要留意最近被擾動過的岩石。我覺得其中一個豺狼人是罪魁禍首，可能是個地脈術師薩滿之類的。如果你能找到並幹掉它，我會額外付錢，但我肯定它會反擊。
actors.mobs.npcs.blacksmith.intro_quest_huntress=嘿，人類！你看起來動作很快。
actors.mobs.npcs.blacksmith.intro_quest_mage=嘿，人類！你看起來很聰明。
actors.mobs.npcs.blacksmith.intro_quest_rogue=嘿，人類！你看起來像個狡猾的傢伙。
actors.mobs.npcs.blacksmith.intro_quest_start=想幫忙？嗯，我這兒有個活兒你可以幹。我把這間工坊建在舊礦井上面，梯子下去就到了。拿著這把鎬，幫我挖點_暗金礦_。 40塊應該夠了。下面的岩石很軟，所以_你稍微費點勁就能挖穿岩壁_。什麼？我怎麼付錢？你太貪心了……好吧好吧，我可以幫你鍛造。你走運了，我是這附近唯一的鐵匠。
actors.mobs.npcs.blacksmith.intro_quest_warrior=嘿，人類！你看起來很厲害。
actors.mobs.npcs.blacksmith.lost_pick=你在開玩笑嗎？我的鎬呢？ ！
actors.mobs.npcs.blacksmith.name=巨魔鐵匠
actors.mobs.npcs.blacksmith.quest_start_prompt=準備好下去了嗎？確保你留出點空間放金子。我只會讓你失望一次！
actors.mobs.npcs.blacksmith.reminder=你浪費我的時間夠了嗎？礦井入口就在那邊。
actors.mobs.npcs.blacksmith.reminder_crystal=盡可能多帶些金子，還有，試著打破那塊大水晶。
actors.mobs.npcs.blacksmith.reminder_fungi=盡可能地給我帶些金子，還有，盡量把巨型蘑菇幹掉。
actors.mobs.npcs.blacksmith.reminder_gnoll=盡可能地帶些金子，還有，盡量把那個豺狼人地術士也幹掉。
actors.mobs.npcs.ghost.crab_1=你好 %s……我曾經也像你一樣——強大而自信……但我卻被一隻遠古生物殺死了……我無法離開這裡……除非我復仇成功……殺死那隻奪走我性命的巨蟹……\n\n它異常古老……長著一隻巨大的單爪和厚厚的盔甲……_著它的爪子，否則它不那麼老的爪子
actors.mobs.npcs.ghost.crab_2=請……幫幫我……消滅這隻甲殼類動物……它總是會擋住你的去路……只要它看到你靠近……
actors.mobs.npcs.ghost.desc=那個鬼魂幾乎看不見，看起來像一團模糊的光點，帶著悲傷的表情。
actors.mobs.npcs.ghost.find_me=謝謝……來找我吧……
actors.mobs.npcs.ghost.gnoll_1=你好，%s……我曾經也像你一樣——強大而自信……但我卻被一個狡猾的敵人殺死了……我無法離開這裡……除非我復仇成功……殺死那個奪走我性命的_豺狼人騙子_……\n\n它和其他豺狼人不一樣……它會投擲它，遠離它會被拋擲和拋擲武器。
actors.mobs.npcs.ghost.gnoll_2=請……幫幫我……除掉那個騙子……別讓它打到你……靠近它……
actors.mobs.npcs.ghost.name=悲傷的鬼魂
actors.mobs.npcs.ghost.rat_1=你好，%s……我曾經也像你一樣——強大而自信……但我卻被一隻邪惡的野獸奪走了生命……我無法離開這裡……除非我復仇成功……殺死那隻奪走我性命的_臭老鼠_……\n\nQ它潛伏在這層樓裡……
actors.mobs.npcs.ghost.rat_2=請……幫幫我……斬殺這隻怪物……在水邊與它戰鬥……避開那惡臭……
actors.mobs.npcs.imp.cya=再見，%s！
actors.mobs.npcs.imp.desc=小惡魔是低階惡魔。它們既不以力量見長，魔法天賦也平平，但卻十分聰明且善於交際。許多小惡魔更喜歡與非惡魔為伍。
actors.mobs.npcs.imp.golems_1=就我而言，需要消滅的是_魔像_。你看，我打算在這裡開個小生意，但這些愚蠢的魔像會拖累生意！跟這些遊蕩的花崗岩塊談判簡直太難了，該死的！所以，請幫我殺掉…比如說_4個_，我會給你獎勵。
actors.mobs.npcs.imp.golems_2=你的魔像狩獵之旅進行得怎麼樣了？別忘了收集那些代幣哦。
actors.mobs.npcs.imp.hey=噓，%s！
actors.mobs.npcs.imp.intro=你是冒險者嗎？我超愛冒險者！要是需要做什麼，他們總是能幫上忙，對吧？當然是為了賞金啦 ;)
actors.mobs.npcs.imp.monks_1=就我而言，需要殺的是那些和尚。你看，我打算在這裡開個小店，但這些瘋子自己什麼都不買，還會嚇跑其他顧客。所以，請你殺了……比如說，五個和尚，賞金給你。
actors.mobs.npcs.imp.monks_2=哦，你還活著！我就知道你的功夫會更強 ;) 別忘了把代幣都拿走。
actors.mobs.npcs.imp.name=雄心勃勃的小鬼
actors.mobs.npcs.impshopkeeper.buyback=小惡魔興高采烈地將你的物品歸還給你。
actors.mobs.npcs.impshopkeeper.desc=小妖精在內廳邊緣開了一家小店。看到一張友善的臉孔固然令人高興，但他的價格可一點也不友善。
actors.mobs.npcs.impshopkeeper.greetings=你好，%s！
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s，你做了什麼？快點購物，我得離開這裡！
actors.mobs.npcs.impshopkeeper.name=雄心勃勃的小鬼
actors.mobs.npcs.impshopkeeper.thief=我以為我可以信任你！
actors.mobs.npcs.mirrorimage.desc=這個幻影和你十分相像，只是更蒼白，還會微微抽動。
actors.mobs.npcs.mirrorimage.discover_hint=你可以透過特定的捲軸找到這個角色。
actors.mobs.npcs.mirrorimage.name=鏡像
actors.mobs.npcs.npc.discover_hint=你可以在地牢的特定區域找到這個角色。
actors.mobs.npcs.prismaticimage.desc=這種閃爍的幻象與你極為相似，甚至看起來也像是在使用你目前的武器和盔甲。棱鏡幻象會試圖尋找並吸引敵人的注意力，利用其增強的防禦力和生命值來保護你。雖然它們的攻擊力不如鏡像，但它們擁有更強的耐久性，並且能夠獲得你盔甲的加成。當生命值降至0時，稜鏡幻象會在幾個回合內逐漸消失，在此期間仍可被治療。當周圍沒有敵人時，棱鏡幻象會消失並重新回到它們的主人身邊。
actors.mobs.npcs.prismaticimage.discover_hint=你可以透過特定的捲軸找到這個角色。
actors.mobs.npcs.prismaticimage.name=棱鏡影像
actors.mobs.npcs.ratking.confused=什麼……這是哪裡？我的王國需要我！
actors.mobs.npcs.ratking.crown_after=喜歡你的新盔甲嗎？可不能反悔！
actors.mobs.npcs.ratking.crown_clothes=穿上衣服！你現在這副樣子根本無法跟皇室成員說話！
actors.mobs.npcs.ratking.crown_desc=哇哦，這頂王冠是給我的嗎？ ！它看起來比我的閃亮多了，所以我欣然接受！其實，我想我可以給你一些東西作為這頂王冠的獎勵。一種配得上你這樣英雄的強大力量！你想要嗎？
actors.mobs.npcs.ratking.crown_fine=好吧！反正我也不是想要…
actors.mobs.npcs.ratking.crown_info=請先詳細說說。
actors.mobs.npcs.ratking.crown_no=我寧願不…
actors.mobs.npcs.ratking.crown_thankyou=呵呵，謝謝！現在就去讓你的國王為你驕傲吧！
actors.mobs.npcs.ratking.crown_yes=當然！
actors.mobs.npcs.ratking.desc=這隻老鼠比普通的袋鼠稍大。它的頭上戴著一個小小的皇冠。
actors.mobs.npcs.ratking.desc_birthday=這隻老鼠比普通的袋鼠略大。它頭上戴著一頂小小的綠色派對帽，而不是它平常戴的王冠。鼠王生日快樂！
actors.mobs.npcs.ratking.desc_crown=這隻老鼠比普通的袋鼠鼠稍大。它頭上戴著矮人王冠。
actors.mobs.npcs.ratking.desc_winter=這隻老鼠比一般的袋鼠鼠稍大。它戴著一頂小小的節日帽子，而不是它通常的王冠。節日快樂！
actors.mobs.npcs.ratking.discover_hint=你可以在地牢特定區域的盡頭找到這個角色。
actors.mobs.npcs.ratking.name=鼠王
actors.mobs.npcs.ratking.not_sleeping=我睡不著！
actors.mobs.npcs.ratking.what_is_it=什麼事？我沒空理會這些無聊事。我的王國可不會自己統治！
actors.mobs.npcs.sheep.baa!=咩！
actors.mobs.npcs.sheep.baa.=咩。
actors.mobs.npcs.sheep.baa...=咩…
actors.mobs.npcs.sheep.baa?=咩？
actors.mobs.npcs.sheep.def_verb=已屏蔽
actors.mobs.npcs.sheep.desc=這是一隻神奇的綿羊。它到底神奇在哪裡？你殺不死它。它會一直站在那裡，直到神奇地消失，同時反芻，眼神空洞。
actors.mobs.npcs.sheep.discover_hint=你可以透過特定的物品或陷阱找到這個角色。
actors.mobs.npcs.sheep.name=羊
actors.mobs.npcs.shopkeeper.buyback=店主很不情願地退還了你的商品。
actors.mobs.npcs.shopkeeper.desc=這個身材魁梧的傢伙看起來更像是大城市商業區的人，而不是地牢裡的人。他的定價也解釋了他為什麼更喜歡在這裡做生意。
actors.mobs.npcs.shopkeeper.flee=店主逃跑了！
actors.mobs.npcs.shopkeeper.name=店主
actors.mobs.npcs.shopkeeper.sell=出售物品
actors.mobs.npcs.shopkeeper.talk=演講
actors.mobs.npcs.shopkeeper.talk_ascent=我不知道你打算怎麼處理那個護身符，但我一點也不想摻和。買點別的東西然後離開吧，我們兩個都得離開這個地方！
actors.mobs.npcs.shopkeeper.talk_caves=花錢，活得更久。哦，如果你看到那個巨魔鐵匠，幫我問好。提醒他，他還沒付我上週賣給他的鐵鎚的錢！
actors.mobs.npcs.shopkeeper.talk_city=我的貨物能保證你在這裡的安全。 \n\n……還有，請不要待太久。我費了好大勁才讓當地人不再騷擾我，我可不想你惹麻煩！
actors.mobs.npcs.shopkeeper.talk_halls=嘿，我這裡有惡魔獵人的特價優惠！哦，對了，小心點！下面的惡魔才不管你有多勇敢。死了就沒辦法再上來花錢了！ ;) 惡魔跟我一樣嗎？呵呵，完全不一樣。我只是個小傢伙，不怎麼會打架，但我的理智還算清醒。下面的惡魔比我強大得多，而且它們都被……嗯……奴役了。總之，小心點。
actors.mobs.npcs.shopkeeper.talk_prison_cleric=你好啊，殿下，或現在該叫你聖殿大人了？呵呵，不管怎樣，這裡不適合你，如果你死了，很多人都會很難過。不過你肯定不缺錢，何不買點東西來避免這種情況發生呢？
actors.mobs.npcs.shopkeeper.talk_prison_duelist=喲，這不是旅行英雄嗎！如果你是來拯救另一個城鎮的，祝你好運，這裡的危險比那些小匪幫嚴重得多。我相信你肯定比任何人都做得好，只是別死在我店門口。
actors.mobs.npcs.shopkeeper.talk_prison_huntress=小姐，你好像不太適應這裡。狹窄的地牢走廊可不如宏偉的大廳或環繞城市的森林寬敞，對吧？呵呵，別在意我的絮叨，不如買點東西吧？
actors.mobs.npcs.shopkeeper.talk_prison_intro=我已經為你準備好了成功冒險所需的一切！
actors.mobs.npcs.shopkeeper.talk_prison_mage=呵呵，我好像在城裡某個地方看過你的通緝令。你這是在逃亡嗎？哦，你是清白的？當然，當然……別擔心，我還有更重要的事要做，沒空去告發你。不過，或許你該買點東西以防萬一？
actors.mobs.npcs.shopkeeper.talk_prison_rogue=你是盜賊公會的，來清理這區域的嗎？不是，只是來購物的？既然來了，那就順便殺幾個怪吧。別指望打折，我付了你們一大筆保護費，你們卻連我的安全都保障不了多少。
actors.mobs.npcs.shopkeeper.talk_prison_warrior=你這枚印章挺有意思的，通常都是完整的。你是落魄英雄之類的嗎？不過你做過什麼跟我沒關係，你的硬幣還是很值錢。
actors.mobs.npcs.shopkeeper.thief=小偷！小偷！
actors.mobs.npcs.shopkeeper.warn=注意！我不會再警告你一次了。
actors.mobs.npcs.vaultlaser.desc=這個哨兵會定時發射雷射。 _由於這裡只是測試區域，雷射不會對你造成實際傷害。 _
actors.mobs.npcs.vaultlaser.name=金庫雷射哨兵
actors.mobs.npcs.vaultsentry.desc=這個哨兵正在以特定模式掃描該區域。 _由於這只是一個測試區域，即使哨兵偵測到你，也不會採取任何行動。 _
actors.mobs.npcs.vaultsentry.name=金庫掃描哨兵
actors.mobs.npcs.wandmaker.def_verb=已屏蔽
actors.mobs.npcs.wandmaker.desc=這位年邁但身強體健的紳士臉上帶著一絲困惑。他被一道魔法護盾保護著。
actors.mobs.npcs.wandmaker.intro_1=我來這裡是為了尋找製作魔杖的稀有材料，但我迷路了，而且我的魔法護盾正在減弱。我很快就要離開了，但我捨不得空手而歸。
actors.mobs.npcs.wandmaker.intro_2=如果你能幫我找到那個，我很樂意用我精心製作的魔杖之一來支付你報酬！我帶了兩根，你可以隨便挑一根。
actors.mobs.npcs.wandmaker.intro_berry=這所監獄的老典獄長種了一株腐爛漿果，我想要它的一顆種子。不過這株植物現在可能已經野生了，所以要讓它掉落種子可能有點難。它的地盤應該就在這附近。如果你想活命，就盡量避開它的藤蔓鞭笞者。用火燒它或許很誘人，但千萬別這麼做，你會把植物燒死，種子也會毀掉。
actors.mobs.npcs.wandmaker.intro_cleric=哦，殿下，您好！在這樣陰鬱的地方遇見您真是個驚喜！恕我冒昧，我或許可以委託您做件事。
actors.mobs.npcs.wandmaker.intro_duelist=哦，你好小姐！在這種蕭條的地方遇到英雄真是個驚喜！如果你願意幫助一位老人家，我或許可以交給你一項任務。
actors.mobs.npcs.wandmaker.intro_dust=我在找一些屍粉。那是一種特殊的詛咒骨粉，通常出現在這種地方。這附近應該有個被封鎖的房間，我肯定能在那裡找到一些屍粉。不過要小心，這屍粉的詛咒非常強大，找到之後儘快聯絡我，我會幫你淨化它。
actors.mobs.npcs.wandmaker.intro_ember=我正在尋找新生火元素的_新鮮餘燼_。元素通常會在召喚儀式失控時出現，所以只要找到一些蠟燭和儀式地點，我相信你就能召喚出一個。不過，戰鬥時你最好_避免把自己困在某個地方_，或者你可以_準備一些冰凍物品_。新生元素非常強大且混亂，但它們不耐寒。
actors.mobs.npcs.wandmaker.intro_huntress=哦，你好小姐！在這裡見到一張友善的臉真是令人驚喜，不是嗎？事實上，我發誓我以前見過你，但一時想不起來……哦，沒關係，如果你是來冒險的，我或許可以給你安排個任務。
actors.mobs.npcs.wandmaker.intro_mage=哦，你好啊 %s！我聽說你和魔法學院之間有點小摩擦？哦，算了，反正我一直都不喜歡那些古板守舊的人。如果你願意的話，我或許可以幫你安排個任務。
actors.mobs.npcs.wandmaker.intro_rogue=我的天哪，你嚇了我一跳！我還沒看過哪個本地強盜還保持理智，看來你一定是來自地面！如果你願意幫助一個陌生人，我或許可以為你安排個任務。
actors.mobs.npcs.wandmaker.intro_warrior=哦，你好啊！在這種荒涼的地方居然能遇到一位來自北方的勇士，真是個驚喜！想必你跋山涉水來到這裡一定很遠的路吧。如果你想找點刺激，我或許可以幫你安排個任務。
actors.mobs.npcs.wandmaker.name=老魔杖匠
actors.mobs.npcs.wandmaker.reminder_berry=%s，你找到腐爛漿果種子了嗎？找一個長滿植物的房間。
actors.mobs.npcs.wandmaker.reminder_dust=%s，你找到屍粉了嗎？找找路障。
actors.mobs.npcs.wandmaker.reminder_ember=%s，那些餘燼找到了嗎？你需要找到四根蠟燭和儀式地點。
actors.mobs.phantompiranha.desc=幻影食人魚是一種罕見的食人魚，擁有魔法能力和詭異的半透明身體。它們能夠在受到攻擊時瞬間移動，以便逃脫或迅速接近敵人！雖然它們很難對付，但它們的肉因其神奇的特性而備受珍視。
actors.mobs.phantompiranha.name=幻影食人魚
actors.mobs.phantompiranha.teleport_away=幽靈食人魚瞬間消失…
actors.mobs.piranha.desc=這些肉食性魚類是專門為了保護洪水氾濫地區而培育的。它們的咬傷致命，所以最好避免與它們正面衝突。
actors.mobs.piranha.discover_hint=你可以在地牢的任何地方遇到這種敵人。
actors.mobs.piranha.name=巨型食人魚
actors.mobs.pylon.desc_active=一座電力塔，用於調節該區域機械設備的電力供應。塔內電能正處於激增狀態，這一定是DM-300超載的動力來源！在這種狀態下，電力塔雖然脆弱，但會以順時針方向向附近的電池放電。由於其採用重型金屬結構，電力塔能夠承受較大的損傷。
actors.mobs.pylon.desc_inactive=一座電力塔，旨在幫助調節為該區域機械設備供電的電力。該電力塔目前處於非啟動狀態，且不會受到損壞。
actors.mobs.pylon.name=輸電塔
actors.mobs.rat.desc=袋鼠是生活在下水道中的一種具有攻擊性但體質較弱的動物。它們的咬傷很厲害，但只有在數量眾多時才會危及生命。
actors.mobs.rat.name=有袋鼠
actors.mobs.ripperdemon.desc=這些恐怖的生物是惡魔勢力利用該地區眾多矮人屍體所造就的。撕裂者是瘦骨嶙峋、面目猙獰的生物，外形酷似矮人，但身軀殘破，長著由骨頭構成的鋒利長爪。撕裂者惡魔雖然不特別耐打，但卻敏捷而危險。它們能夠跳躍很遠的距離，迅速接近目標，然後用利爪將其撕碎。
actors.mobs.ripperdemon.leap=開膛手惡魔準備躍起！
actors.mobs.ripperdemon.name=開膛手惡魔
actors.mobs.rotheart.desc=腐莓的果實非常獨特。它不會像其他果實那樣腐爛分解，而是會繼續生長、變硬，並將種子包裹起來。這層包裹為果實內部生長的器官提供了保護。這個巨大的球狀物被稱為成年腐莓植株的心臟。
actors.mobs.rotheart.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.rotheart.name=腐爛的心
actors.mobs.rotlasher.desc=腐爛鞭笞者是成熟腐爛漿果植株根系的一部分，也是它們的主要防禦手段。鞭笞者雙眼失明，紮根於土壤中，但會在短暫探測到附近威脅後發動猛烈攻擊。當附近沒有敵人時，它們會靜止不動，試圖融入周圍的植被。
actors.mobs.rotlasher.discover_hint=你可以在某個特定任務中遇到這個敵人。
actors.mobs.rotlasher.name=腐爛鞭笞者
actors.mobs.scorpio.desc=這些巨大的蛛形惡魔生物避免近身戰鬥，更喜歡從遠處發射具有毀滅性的鋸齒狀尖刺。
actors.mobs.scorpio.name=巨蠍
actors.mobs.senior.desc=這些僧侶是一群狂熱分子，一心守護城市的秘密，不讓任何外人染指。他們不穿護甲，也不拿武器，只憑徒手格鬥的本領作戰。
actors.mobs.senior.name=資深僧侶
actors.mobs.shaman$blueshaman.spell_desc=這位薩滿戴著藍色面具，會使用一種會暫時增加你受到的傷害的魔法。
actors.mobs.shaman$purpleshaman.spell_desc=這位薩滿戴著紫色面具，會使用一種暫時降低你的命中率和閃避率的魔法。
actors.mobs.shaman$redshaman.spell_desc=這位薩滿戴著紅色面具，會使用魔法暫時削弱你的攻擊力。
actors.mobs.shaman.bolt_kill=那道魔法閃電殺死了你…
actors.mobs.shaman.desc=最聰明的豺狼人能夠掌握薩滿法術。豺狼薩滿偏愛戰鬥法術，用來彌補力量上的不足。誰敢質疑牠們在部落中的地位，牠們也會毫不猶豫地施法教訓。
actors.mobs.shaman.name=豺狼人薩滿
actors.mobs.skeleton.def_verb=已屏蔽
actors.mobs.skeleton.desc=骷髏由倒楣的冒險者和地牢居民的屍骨拼成，被深處湧出的邪惡魔法喚醒。受到足夠的傷害後，牠們會炸成四散的碎骨。
actors.mobs.skeleton.explo_kill=你被骨頭爆炸炸死了…
actors.mobs.skeleton.name=骷髏
actors.mobs.slime.def_verb=已屏蔽
actors.mobs.slime.desc=史萊姆是一種奇特的、略帶魔法氣息的生物，它們有著橡膠般的外殼和液態的內核。城市下水道為它們提供了充足的水源和營養。由於它們富有彈性的外膜，任何攻擊都很難對史萊姆造成超過6點的傷害。
actors.mobs.slime.name=黏液
actors.mobs.snake.desc=這些體型巨大的蛇能夠迅速躲避攻擊，因此很難擊中它們。然而，魔法攻擊或突襲卻能出其不意地擊中它們。你可以在蛇的視線之外發動突襲。一種方法是讓蛇追著你穿過門口，然後在它剛進入門口時發動攻擊。
actors.mobs.snake.hint=試著使用「檢視」按鈕來觀察蛇，了解如何對付它們。
actors.mobs.snake.name=下水道蛇
actors.mobs.spectralnecromancer.desc=骷髏是死靈法師的必備法寶，但有些死靈法師更喜歡其他非實體的僕從。幽靈死靈法師就選擇了怨靈作為他們的首選僕從！單一怨靈雖然不如骷髏強大，但這些死靈法師並不害怕召喚一大群怨靈！
actors.mobs.spectralnecromancer.name=幽靈死靈法師
actors.mobs.spinner.desc=這些長著綠毛的洞穴蜘蛛不願正面交戰。牠們更喜歡躲在遠處，等著困在蛛網中的獵物因毒牙留下的傷口慢慢死去。
actors.mobs.spinner.name=洞穴蜘蛛
actors.mobs.statue.def_verb=已屏蔽
actors.mobs.statue.desc=你可能會認為它只是這個地牢裡眾多無生命的雕像之一，但它那閃著紅光的眼睛卻暴露了它的身份。
actors.mobs.statue.desc_weapon=雖然雕像本身是用石頭做的，但它所揮舞的_%s_看起來是真的。
actors.mobs.statue.discover_hint=你可以在地牢的任何地方遇到這種敵人。
actors.mobs.statue.name=動畫雕像
actors.mobs.succubus.desc=魅魔是外形酷似妖豔少女的惡魔，打扮還帶著點哥德風。牠們能用魔法魅惑英雄，使其在效果消退前無法攻擊任何目標。
actors.mobs.succubus.name=魅魔
actors.mobs.swarm.desc=致命的蠅群憤怒地嗡嗡作響。任何非魔法攻擊都會將其分裂成兩群規模較小但同樣危險的蠅群。
actors.mobs.swarm.name=一群蒼蠅
actors.mobs.tengu$bombability$bombblob.desc=這裡正冒出滾滾高溫煙霧。小心，它要爆炸了！
actors.mobs.tengu$bombability$bombitem.cant_pickup=它黏在地上了，你根本動不了它！
actors.mobs.tengu$bombability$bombitem.desc=天狗在這裡丟了一個奇形怪狀的煙霧彈，正冒出濃煙。它發出響亮的滴答聲，彷彿在倒數計時即將爆炸！這枚煙霧彈已經固定在地面上，所以你無法撿起來。
actors.mobs.tengu$bombability$bombitem.name=煙霧彈
actors.mobs.tengu$fireability$fireblob.desc=天狗撒下了一些細粉，這些粉末似乎正在變成蒸汽，它即將燃燒！
actors.mobs.tengu$shockerability$shockerblob.desc=這裡正在累積電能，任何站在這塊地磚上的物體下一回合都會受到電擊！
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=它釋放的電量太多了，你抓不住！
actors.mobs.tengu$shockerability$shockeritem.desc=天狗丟在這裡一台奇特的機器，看起來像是用DM-100的零件組裝的。這台機器周圍不斷產生電弧，但似乎遵循著某種可預測的模式。由於周圍電弧不斷，你根本不可能把它撿起來。
actors.mobs.tengu$shockerability$shockeritem.name=震驚
actors.mobs.tengu.defeated=終於自由了…
actors.mobs.tengu.desc=天狗是一個古老刺客宗族的成員，這個宗族也叫天狗。他們以大量使用手裏劍和陷阱聞名。
actors.mobs.tengu.interesting=讓我們讓這件事變得有趣…
actors.mobs.tengu.name=天狗
actors.mobs.tengu.notice_gotcha=抓到你了，%s！
actors.mobs.tengu.notice_have=%s，你被我抓住了！
actors.mobs.tengu.rankings_desc=被天狗刺殺
actors.mobs.thief.carries=小偷攜帶了_\n\n顯然是偷來的。
actors.mobs.thief.desc=雖然這些囚犯可以在牢房裡自由活動，但這裡仍然是他們的監獄。隨著時間的推移，這個地方不僅奪走了他們的自由，也改變了他們的心智。很久以前，這些瘋狂的盜賊和強盜就已經忘記了自己是誰，也忘記了他們偷竊的原因。這些敵人更傾向於偷竊後逃跑，而不是戰鬥。務必隨時注意他們，否則你可能再也找不回你偷來的東西了。
actors.mobs.thief.escapes=小偷偷溜走了你的 %s！
actors.mobs.thief.name=瘋狂的小偷
actors.mobs.thief.stole=小偷從你那裡偷走了 %s！
actors.mobs.tormentedspirit.desc=受折磨的靈魂原本是善良的，卻被詛咒纏身。只要詛咒還在，它們就會像幽靈一樣攻擊，而且更強大！或許可以在靈魂附近使用合適的物品來解除詛咒。如果詛咒被解除，靈魂一定會感激不盡…
actors.mobs.tormentedspirit.name=受折磨的靈魂
actors.mobs.tormentedspirit.thank_you=謝謝...
actors.mobs.vaultrat.desc=這隻老鼠的行為有所改變，用於測試新的金庫敵人AI：\n_-_ 它的移動聲可以穿透牆壁被「聽到」；\n_-_ 它會沿著預設的巡邏路線遊蕩；\n_-_ 遊蕩時，它移動方向後方的巡邏範圍會縮小；睡覺時，它的偵測範圍也會縮小；\n_-_ 當它發現你時，會先進行“調查”，然後再轉為狩獵。調查中的敵人會向你移動，但不會攻擊，而且更容易躲在門後或角落。
actors.mobs.warlock.bolt_kill=暗影閃電殺了你…
actors.mobs.warlock.desc=當矮人的興趣從工程轉向秘術時，術士們掌握了城市的權力。他們起初研究元素魔法，卻很快轉向了惡魔學和死靈術。
actors.mobs.warlock.name=矮人術士
actors.mobs.wraith.desc=怨靈是罪人的復仇之魂，因其墳墓或陵墓遭到擾亂而化作怨靈。由於其虛幻縹緲，普通武器很難擊中它。
actors.mobs.wraith.discover_hint=你可以在地牢的任何地方遇到這種敵人。
actors.mobs.wraith.name=幽靈
actors.mobs.yogdzewa$larva.desc=這些尤格-澤瓦的微小後代是很容易召喚的簡單嘍囉。雖然單一它們很弱，但召喚速度很快，數量眾多時就能形成壓倒性的局面。
actors.mobs.yogdzewa$larva.name=神的幼蟲
actors.mobs.yogdzewa$larva.rankings_desc=被約格-澤瓦吞噬
actors.mobs.yogdzewa$yogeye.rankings_desc=被約格-澤瓦吞噬
actors.mobs.yogdzewa$yogripper.rankings_desc=被約格-澤瓦吞噬
actors.mobs.yogdzewa$yogscorpio.rankings_desc=被約格-澤瓦吞噬
actors.mobs.yogdzewa.darkness=黑暗逐漸逼近…
actors.mobs.yogdzewa.defeated=……
actors.mobs.yogdzewa.desc=尤格-澤瓦是古老的神祇，龐大的怪物，它深入凡間，吞噬一切，以維持自身無盡的成長。矮人們一定是在玩弄黑暗魔法時引起了這宇宙恐怖的注意，此後便一直試圖將其封印。尤格-澤瓦源自於一個充滿原始魔法混沌的維度，無法將其真身帶到這個世界。因此，它創造了化身，並召喚惡魔僕從在此地為其效力。這隻巨眼是尤格-澤瓦在這個世界力量的焦點。雖然巨眼本身無法移動，但它能夠發射強大的惡魔魔法光束，並召喚各種各樣的僕從來協助它。
actors.mobs.yogdzewa.desc_spawners=你能感覺到樓上湧來的陣陣魔力直衝眼眶。你留在樓上的某個東西肯定在把能量回流給尤格·澤瓦。尤格會利用這股能量召喚更強大的爪牙！
actors.mobs.yogdzewa.hope=你的希望只是幻覺！
actors.mobs.yogdzewa.name=約格-澤瓦
actors.mobs.yogdzewa.notice=我看見你。
actors.mobs.yogdzewa.rankings_desc=被約格-澤瓦吞噬
actors.mobs.yogfist$brightfist.desc=這隻拳頭由純粹的光能構成，每回合都能發射出威力強大的灼熱光束！這些光束除了造成大量傷害外，還會暫時使你失明。這隻拳頭還能短暫地用耀眼的光芒籠罩整個競技場，以便逃脫！然而，這隻拳頭在近戰範圍內沒有任何特殊能力。
actors.mobs.yogfist$brightfist.name=明亮的拳頭
actors.mobs.yogfist$brightfist.teleport=拳頭瞬間消失，伴隨著一道強光，強光刺得你睜不開眼！
actors.mobs.yogfist$burningfist.desc=一隻裹著烈火的巨拳。手指握緊時劈啪作響，餘燼紛紛落到地上。
actors.mobs.yogfist$burningfist.name=燃燒的拳頭
actors.mobs.yogfist$darkfist.desc=這隻拳頭由純粹的黑暗能量構成，每回合都能發射威力強大的黑暗魔法衝擊波！這些衝擊波不僅會造成大量傷害，還會削弱你的光源。這隻拳頭還能短暫地將整個競技場籠罩在黑暗之中，以便逃脫！然而，這隻拳頭在近戰範圍內沒有任何特殊能力。
actors.mobs.yogfist$darkfist.name=黑拳
actors.mobs.yogfist$darkfist.teleport=拳頭瞬間消失，伴隨著一陣黑暗，熄滅了你的光源！
actors.mobs.yogfist$rottingfist.desc=一隻腐肉堆成的巨大拳頭。惡臭的黏液從指縫滲出，汙染了下方的石面。
actors.mobs.yogfist$rottingfist.name=腐爛的拳頭
actors.mobs.yogfist$rustedfist.desc=這隻拳頭由活體金屬構成，是一團高聳的、不斷移動的金屬，擁有強大的近戰攻擊力，並能遠程重創目標。由於其巨大的質量，這隻拳頭受到的傷害會隨著時間而逐漸累積，而不是立即生效。然而，這隻拳頭缺乏靈活性，無法進入狹窄的通道。此外，雖然它會緩慢承受傷害，但如果多次受到攻擊，累積的傷害會持續增加。
actors.mobs.yogfist$rustedfist.name=生鏽的拳頭
actors.mobs.yogfist$soiledfist.desc=這隻拳頭由混亂的土系魔法構成。它移動時，周圍會不斷生長出植物。它還能發射高密度土系衝擊波，將目標困在快速生長的藤蔓和根鬚之中！這隻拳頭從這些植物中汲取力量，並能根據附近高大或溝壑縱橫的植物數量來抵抗傷害！
actors.mobs.yogfist$soiledfist.name=髒拳頭
actors.mobs.yogfist.desc=這只拳頭是尤格-澤瓦力量的一個面向。拳頭與尤格-澤瓦的力量相連，當它靠近眼睛時，可以免受一切傷害。
actors.mobs.yogfist.invuln_warn=拳頭靠近眼睛時是刀槍不入的！
actors.mobs.yogfist.rankings_desc=被約格-澤瓦吞噬
