actors.char.mob_missed=Атака %1$s %2$s %3$s
actors.char.out_of_paralysis=Біль вивів %s з паралічу.
actors.char.you_hit=Ви влучили %s
actors.char.you_missed=%1$s %2$s ваша атака
actors.mobs.mob.fleeing=%s тікає
actors.mobs.mob.hunting=%s полює
actors.mobs.mob.passive=%s є пасивним
actors.mobs.mob.sleeping=%s спить
actors.mobs.mob.wandering=%s блукає
actors.mobs.elemental.desc=Блукаючі вогняні елементалі з'являються як побічний наслідок виклику могутніших істот. Вони настільки непередбачувані, що навіть найсильніший демонолог не здатен ними керувати.
actors.mobs.elemental.name=вогняний елементаль
actors.mobs.king.desc=Останній король дворфів славився глибокими знаннями про життя і смерть. Він переконав придворних узяти участь у ритуалі, що мав подарувати їм вічну молодість. Зрештою її отримав лише сам король — а на додачу ще й армію невмерлих.
actors.mobs.king.name=король дворфів
actors.mobs.npcs.bee.desc=Попри свої невеликі розміри, золоті бджоли люто захищають господаря. Щоправда, живуть вони недовго.
actors.mobs.npcs.bee.name=золота бджола
actors.mobs.shielded.desc=Здоровані — найбільші, найсильніші та найвитриваліші з усіх гнолів. Від тяжких поранень вони шаленіють і завдають ворогам ще більшої шкоди.
actors.mobs.shielded.name=здоровань зі щитом
actors.mobs.yog.desc=Йог-Дзева — Стародавній Бог, могутня сутність зі світу хаосу. Століття тому стародавні гноми ледве виграли війну проти його армії демонів, але не змогли вбити самого бога. Натомість вони ув'язнили його в залах під своїм містом, вважаючи, що він надто слабкий, щоб колись знову повстати.
actors.mobs.yog.name=Йог-Дзева
actors.mobs.bandit.carries=%s несе _%s_. Очевидно, вкрадений.
actors.buffs.armorevasion.name=Посилене ухилення
actors.mobs.king.defeated=Ти не можеш мене вбити, %s... Я... безсмертний...
