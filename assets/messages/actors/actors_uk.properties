actors.blobs.blizzard.desc=Тут вирує хуртовина.
actors.blobs.blizzard.name=хуртовина
actors.blobs.confusiongas.desc=Тут вирує хмара газу, що викликає плутанину.
actors.blobs.confusiongas.name=газ сплутаності свідомості
actors.blobs.corrosivegas.desc=Тут вирує хмара смертельно їдкого газу.
actors.blobs.corrosivegas.name=корозійний газ
actors.blobs.electricity.desc=Тут яскраво іскрить поле електрики.
actors.blobs.electricity.name=електрика
actors.blobs.electricity.ondeath=Ти був смертельно шокований...
actors.blobs.electricity.rankings_desc=Уражений струмом
actors.blobs.fire.desc=Тут вирує пожежа.
actors.blobs.fire.name=вогонь
actors.blobs.foliage.desc=Промені світла пронизують темряву підземного саду.
actors.blobs.foliage.name=листя
actors.blobs.freezing.desc=Повітря тут неприродно холодне.
actors.blobs.freezing.name=крижане повітря
actors.blobs.goowarn.desc=Тут рояться цятки темної енергії!
actors.blobs.goowarn.name=темна енергія
actors.blobs.inferno.desc=Тут вирує пекло.
actors.blobs.inferno.name=пекло
actors.blobs.paralyticgas.desc=Тут вирує хмара паралітичного газу.
actors.blobs.paralyticgas.name=паралітичний газ
actors.blobs.regrowth.name=відростання
actors.blobs.sacrificialfire.desc=Тут є вівтар, на якому горить жертовний вогонь. Будь-яка істота, вбита тут, буде спожита як жертва духам підземелля.\n\nМожливо, буде дана винагорода, якщо буде принесено достатньо жертв?
actors.blobs.sacrificialfire.name=жертовний вогонь
actors.blobs.sacrificialfire.reward=Вогонь спалахує, а потім згасає, залишаючи після себе винагороду!
actors.blobs.sacrificialfire.unworthy=Вогонь поглинає твою жертву, але не змінюється.
actors.blobs.sacrificialfire.worthy=Вогонь поглинає твою жертву і міцніє.
actors.blobs.smokescreen.desc=Тут клубочиться хмара густого чорного диму.
actors.blobs.smokescreen.name=димова завіса
actors.blobs.stenchgas.desc=Тут витає хмара смердючого смороду.
actors.blobs.stenchgas.name=смердючий газ
actors.blobs.stormcloud.desc=Тут вирує хмара водяної пари, що клубочиться.
actors.blobs.stormcloud.name=грозові хмари
actors.blobs.toxicgas.desc=Тут вирує зеленувата хмара токсичного газу.
actors.blobs.toxicgas.name=токсичний газ
actors.blobs.toxicgas.ondeath=Ти помер від отруєння токсичним газом...
actors.blobs.toxicgas.rankings_desc=Задушений
actors.blobs.waterofawareness.desc=Сила знань випромінюється з води цієї криниці. Пиття з криниці повністю ідентифікує всі екіпіровані предмети, визначить прокляття на всіх предметах у вашому інвентарі та розкриє всі предмети на поточному поверсі.
actors.blobs.waterofawareness.name=вода усвідомлення
actors.blobs.waterofawareness.procced=Роблячи ковток, ви відчуваєте, як знання ллються у ваш розум.
actors.blobs.waterofhealth.desc=Сила здоров'я випромінюється водою з цієї криниці. Пиття з цієї криниці загоїть ваші рани, вгамує голод і очистить прокляття з будь-яких зношених речей.
actors.blobs.waterofhealth.name=вода здоров'я
actors.blobs.waterofhealth.procced=Зробивши ковток, ви відчуваєте, як ваші рани повністю загоюються.
actors.blobs.web.desc=Тут усе вкрите густою павутиною. Все, що торкнеться павутини або буде кинуто крізь неї, розірве її, але водночас залишиться на місці.
actors.blobs.web.name=павутина
actors.buffs.adrenaline.desc=Сплеск фізичної сили, адреналін посилив як атаку, так і швидкість пересування.\n\nАдреналін дозволяє цілі бігати зі швидкістю вдвічі та атакувати зі швидкістю в 1,5 раза.\n\nХодів залишилося: %s.
actors.buffs.adrenaline.name=адреналін
actors.buffs.adrenalinesurge.desc=Сплеск величезної могутності, але, на жаль, не постійний. \n\nПідвищення сили: +%d. \nХодить, доки посилення не ослабне: %s.
actors.buffs.adrenalinesurge.name=підвищення сили
actors.buffs.amok.desc=Амок викликає у цілі стан великої люті та розгубленості.\n\nКоли істота димиться, вона атакує все, що знаходиться поруч, незалежно від того, чи це друг, чи ворог.\n\nХодів амоку, що залишилися: %s.
actors.buffs.amok.name=амок
actors.buffs.arcanearmor.desc=Тонкий щит оточує вас, блокуючи частину шкоди від магічних атак. \n\nВаша магічна броня зараз посилена: 0-%d. \n\nХодить, доки чарівна броня не ослабне: %s.
actors.buffs.arcanearmor.name=таємничі обладунки
actors.buffs.artifactrecharge.desc=Енергія протікає крізь вас, збільшуючи швидкість заряджання ваших екіпірованих артефактів.\n\nНа кожен артефакт діє трохи по-різному, але всі вони заряджатимуться набагато швидше, ніж зазвичай.\n\nХодів залишилося: %s.
actors.buffs.artifactrecharge.name=перезарядка артефактів
actors.buffs.ascensionchallenge.almost=Ти відчуваєш, як хватка Йога на амулеті починає слабшати, ти майже на місці!
actors.buffs.ascensionchallenge.beckon=Амулет починає кликати далеких ворогів.
actors.buffs.ascensionchallenge.break=Ти на мить переводить подих і відчуваєш, як твої рани починають затягуватися!
actors.buffs.ascensionchallenge.damage=Амулет починає випромінювати темну енергію. Він горить!
actors.buffs.ascensionchallenge.desc=Якимось чином Йог-Дзева підтримує вплив на цей світ за допомогою амулета та намагається зупинити ваше сходження!\n\nСила Йога робить підземелля набагато небезпечнішим, збільшуючи кількість ворогів та роблячи їх сильнішими! Ця сила продовжуватиме посилюватися, якщо її не контролювати, її можна послабити, перемагаючи ворогів, посилених силою Йога.
actors.buffs.ascensionchallenge.desc_beckon=Амулет зараз _кличе далеких ворогів_, попереджаючи їх про ваше місцезнаходження.
actors.buffs.ascensionchallenge.desc_clear=Темна енергія, що випромінюється від амулета, наразі максимально ослаблена.
actors.buffs.ascensionchallenge.desc_damage=Енергія амулета стала настільки сильною, що _безпосередньо шкодить тобі!_
actors.buffs.ascensionchallenge.desc_haste=Амулет зараз _прискорює далеких ворогів_, дозволяючи їм швидше дістатися до вас!
actors.buffs.ascensionchallenge.desc_slow=Амулет зараз _уповільнює вас_ та нейтралізує ефекти підвищення швидкості!
actors.buffs.ascensionchallenge.haste=Амулет починає прискорювати далеких ворогів!
actors.buffs.ascensionchallenge.name=прокляття амулета
actors.buffs.ascensionchallenge.on_kill=Темна енергія поглинає тебе...
actors.buffs.ascensionchallenge.slow=Амулет починає відчуватися як свинцева гиря у вашому інвентарі!
actors.buffs.ascensionchallenge.weaken=Ви можете відчути, як прокляття амулета трохи слабшає.
actors.buffs.ascensionchallenge.weaken_info=Прокляття амулета можна послабити, перемігши більше ворогів.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Якщо ви переможете ворогів, прокляття амулета ослабне!
actors.buffs.barkskin.desc=Ваша шкіра затверділа, вона шорстка та тверда на дотик, як кора.\n\nЗатверділа шкіра збільшує вашу ефективну броню, дозволяючи вам краще захищатися від фізичних атак.\n\nВаша броня наразі збільшується на: 0-%d.\nХоди, доки шкіра кори не ослабне: %s.\n\nЯкщо ви отримуєте шкіру кори з кількох джерел, буде застосовано лише найсильнішу.
actors.buffs.barkskin.name=кора
actors.buffs.barrier.desc=Міцна бульбашка сили, яка блокує будь-яку шкоду.\n\nБар'єр отримуватиме шкоду тому, що він захищає, доки залишиться екранування. Екранування також повільно згасатиме з часом.\n\nЗалишок екранування: %d.
actors.buffs.barrier.name=бар'єр
actors.buffs.berserk.action_name=Берсерк
actors.buffs.berserk.angered=розгніваний
actors.buffs.berserk.angered_desc=Тяжкість травм Берсеркера посилює його удари. У міру того, як Берсеркер отримує фізичну шкоду, його лють зростає, надаючи йому додаткову шкоду. Шкода, блокована бронею, все одно враховується при накопиченні люті.\n\nЛют з часом згасає. Чим менше здоров'я Берсеркера, тим довше воно триватиме.\n\nПри люті 100%% Берсеркер може скаженіти, надаючи йому щит залежно від рівня його броні та відсутнього здоров'я. Під час берсеркінгу його щит з часом слабшає, і як тільки він закінчиться, йому доведеться відпочити, перш ніж знову наростити лють. \n\nПоточна лють: _%1$.0f%%_\n_+%2$.0f%%_ пошкодження\n\nЩит берсерка при поточній броні та HP: _%3$d_
actors.buffs.berserk.berserk=берсеркінг
actors.buffs.berserk.berserk_desc=Страх і невпевненість зникають, залишаючи лише гнів. У цьому стані Берсеркер надзвичайно потужний, _завдаючи +50%% шкоди та отримуючи бонусний щит,_ але також втрачаючи щит щоходом.\n\nКоли весь його щит зменшиться до 0, берсеркерство закінчиться.\n\nПісля люті Берсеркеру потрібно буде відновитися, перш ніж він зможе знову наростити лють.\n\nЗалишок щита: %d
actors.buffs.berserk.exhausted=виснажений
actors.buffs.berserk.no_seal=Тобі потрібна твоя зламана печатка, щоб скаженіти!
actors.buffs.berserk.rankings_desc=Берсерк до смерті
actors.buffs.berserk.recovering=одужує
actors.buffs.berserk.recovering_desc=Внутрішня сила має свої межі. Берсеркер повинен відпочити, перш ніж знову використовувати свою лють.\n\nПід час одужання Берсеркер не накопичує лють від отриманої шкоди.
actors.buffs.berserk.recovering_desc_levels=Рівні до відновлення: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Повертається, поки не відновиться: _%d_
actors.buffs.bleeding.desc=З цієї рани витікає тривожна кількість крові.\n\nКровотеча завдає шкоди щоходом. З кожним ходом шкода зменшується на випадкову величину, доки кровотеча врешті-решт не зупиниться.\n\nПоточна шкода від кровотечі: %d.
actors.buffs.bleeding.heromsg=Ти кровоточиш!
actors.buffs.bleeding.name=кровотеча
actors.buffs.bleeding.ondeath=Ти помер від втрати крові...
actors.buffs.bleeding.rankings_desc=Смерть від втрати крові
actors.buffs.bless.desc=Чудовий сплеск зосередженості, деякі кажуть, що він натхненний богами.\n\nБлагословення збільшує точність та ухилення на 25%%, роблячи благословенного набагато ефективнішим у бою.\n\nХодів благословення, що залишилися: %s.
actors.buffs.bless.name=благословенний
actors.buffs.blindness.desc=Засліплення перетворює навколишній світ на темний серпанок.\n\nПід час засліплення дальність зору персонажа зменшується до однієї клітинки, що робить дальні атаки марними та ускладнює втрату спостереження за віддаленими ворогами. Крім того, засліплений герой не може читати сувої чи книги.\n\nЗалишилося виворотів сліпоти: %s.
actors.buffs.blindness.heromsg=Ви осліпли!
actors.buffs.blindness.name=засліплений
actors.buffs.blobimmunity.desc=Якась дивна сила огортає вас тонким захисним бар'єром, блокуючи всі шкідливі повітряні ефекти. \n\nВи маєте імунітет до всіх ефектів, пов'язаних з областю, поки діє цей бар'єр. \n\nХодів імунітету, що залишилися: %s.
actors.buffs.blobimmunity.name=бар'єр очищення
actors.buffs.burning.burnsup=%s згорає!
actors.buffs.burning.desc=Мало що може бути більш тривожним, ніж бути охопленим полум'ям.\n\nВогонь завдаватиме шкоди щороку, доки його не загасить вода або він не згасне. Вогонь можна загасити, ступивши у воду, або бризками розбиваючого зілля.\n\nКрім того, вогонь може запалити легкозаймисту місцевість або предмети, з якими він стикається.\n\nХодів горіння, що залишилися: %s.
actors.buffs.burning.heromsg=Ти загораєшся!
actors.buffs.burning.name=горіння
actors.buffs.burning.ondeath=Ти згорів живцем...
actors.buffs.burning.rankings_desc=Згорів дотла
actors.buffs.championenemy$antimagic.desc=Чемпіони з антимагії отримують на 50% менше шкоди та повністю несприйнятливі до магічних ефектів.
actors.buffs.championenemy$antimagic.name=чемпіон з антимагії
actors.buffs.championenemy$blazing.desc=Палаючі чемпіони завдають на 25% більше шкоди в ближньому бою, підпалюють ворогів, яких атакують, мають імунітет до вогню та поширюють вогонь навколо себе, коли помирають. Однак вони не можуть поширювати вогонь на воду.
actors.buffs.championenemy$blazing.name=палаючий чемпіон
actors.buffs.championenemy$blessed.desc=Благословенні чемпіони мають 4-кратну точність та ухилення.
actors.buffs.championenemy$blessed.name=благословенний чемпіон
actors.buffs.championenemy$giant.desc=Гігантські чемпіони отримують на 80% менше шкоди та мають +1 до дальності атаки, але не можуть пересуватися у закритих просторах.
actors.buffs.championenemy$giant.name=гігантський чемпіон
actors.buffs.championenemy$growing.desc=Зростаючі чемпіони отримують постійно зростаючий бонус до точності, ухилення, фізичної шкоди та зменшення отриманої шкоди.\n\nПоточне підвищення акселерації/віддачі/шкоди: %1$d%%\nПоточне зменшення шкоди: %2$d%%
actors.buffs.championenemy$growing.name=чемпіон зростання
actors.buffs.championenemy$projecting.desc=Проектуючі чемпіони завдають на 25% більше шкоди в ближньому бою та мають +3 до дальності атаки.
actors.buffs.championenemy$projecting.name=проектуючий чемпіон
actors.buffs.championenemy.warn=Ви відчуваєте смертельну присутність.
actors.buffs.charm.cant_attack=Ви зачаровані цим ворогом і не можете його атакувати.
actors.buffs.charm.desc=Чари — це маніпулятивна магія, яка може тимчасово змусити ворогів обожнювати одне одного.\n\nПерсонажі, на яких діє чари, не можуть безпосередньо атакувати ворога, який їх зачарував. Однак атака на інші цілі все ще можлива. Шок болю скоротить тривалість дії чарів.\n\nХодів чарів, що залишилися: %s.
actors.buffs.charm.heromsg=Ви зачаровані!
actors.buffs.charm.name=зачарований
actors.buffs.chill.desc=Не зовсім замерзлий, але все ще занадто холодний.\n\nОхолоджені цілі виконують усі дії повільніше, залежно від того, скільки ходів залишилося в ефекті. У найгіршому випадку це еквівалентно уповільненню.\n\nХоди холоду, що залишилися: %1$s.\nШвидкість зменшується на: %2$s%%
actors.buffs.chill.freezes=%s зависає!
actors.buffs.chill.name=охолоджений
actors.buffs.combo$combomove.clobber.desc=Відкидає ворога назад на 2 клітинки, але не завдає шкоди та не може збити в ями. Збільшує комбо на 1.
actors.buffs.combo$combomove.clobber.empower_desc=Відкидає ворога назад на _3 клітинки, викликає запаморочення та може збити в ями,_ але не завдає шкоди. Збільшує комбо на 1.
actors.buffs.combo$combomove.clobber.name=розгромити
actors.buffs.combo$combomove.crush.desc=Завдає %d%% (комбо*25%%) шкоди основній цілі та половину цієї шкоди всім іншим ворогам в зоні дії 7x7. Скидає комбо під час використання.
actors.buffs.combo$combomove.crush.empower_desc=_Підстрибує до плитки(ок) %1$d_ та завдає %2$d%% (комбо*25%%) шкоди основній цілі та половину цієї шкоди всім іншим ворогам в області дії 7x7. Скидає комбо під час використання.
actors.buffs.combo$combomove.crush.name=розчавлювати
actors.buffs.combo$combomove.fury.desc=Вражає ворога один раз за кожне ваше комбо, кожен удар завдає 60% шкоди та може активувати чари. Скидає комбо під час використання.
actors.buffs.combo$combomove.fury.empower_desc=_Підстрибує до плитки(ок) %d_ та вражає ворога один раз за кожне ваше комбо, кожен удар завдає 60%% одиниць шкоди та може активувати чари. Скидає комбо під час використання.
actors.buffs.combo$combomove.fury.name=лють
actors.buffs.combo$combomove.parry.desc=Блокує наступну атаку протягом 1 ходу при активації та миттєво відповідає на неї. Скидає комбо, якщо нічого не парирується.
actors.buffs.combo$combomove.parry.empower_desc=Блокує _всі атаки_ протягом 1 ходу при активації та миттєво відповідає на них. Скидає комбо, якщо нічого не парирується.
actors.buffs.combo$combomove.parry.name=парирування
actors.buffs.combo$combomove.slam.desc=Завдає %d%% (комбо*20%%) вашої сили блокування шкоди як додаткову шкоду. Скидає комбо під час використання.
actors.buffs.combo$combomove.slam.empower_desc=_Підстрибує до плитки(ок) %1$d_ та завдає %2$d%% (комбо*20%%) вашої сили блокування шкоди як додаткову шкоду. Скидає комбо під час використання.
actors.buffs.combo$combomove.slam.name=грюкнути
actors.buffs.combo.action_name=комбінована атака
actors.buffs.combo.bad_target=Ви повинні вистрілити у ворога, який знаходиться в зоні дії атаки.
actors.buffs.combo.combo=%d вдало поєднано!
actors.buffs.combo.desc=Гладіатор нарощує імпульс, завдаючи успішних ударів. Кожна атака збільшує лічильник комбо на одиницю, але занадто довгий проміжок часу між ударами скине лічильник комбо до 0. Поки гладіатор має комбо, будь-який щит, який він має від своєї зламаної печатки, не почне зникати.\n\nПобудова комбо розблоковує спеціальні комбо-атаки, які неможливо промахнутися! Різні атаки розблоковуються при лічильнику комбо 2, 4, 6, 8 та 10. Деякі рухи скидають комбо, а деякі ні, але кожен рух можна використовувати лише один раз за сеанс комбо.\n\nПоточне комбо: %1$d.\n\nХодить, доки не буде втрачено комбо: %2$s.
actors.buffs.combo.name=комбо
actors.buffs.combo.prompt=Виберіть ціль для атаки.
actors.buffs.corrosion.desc=Потужна кислота плавить плоть, метал і кістки з тривожною швидкістю.\n\nКорозійні пошкодження зростають з часом, оскільки ціль продовжує танути.\n\nЗалишки корозії: %1$s.\nПоточні корозійні пошкодження: %2$d.
actors.buffs.corrosion.heromsg=Ти танеш!
actors.buffs.corrosion.name=корозія
actors.buffs.corrosion.ondeath=Ти розтанеш...
actors.buffs.corrosion.rankings_desc=Розчинений
actors.buffs.corruption.desc=Порча проникає в сутність істоти, спотворюючи її проти її колишньої природи.\n\nПорчалі істоти нападатимуть на своїх союзників та ігноруватимуть колишніх ворогів. Порча також руйнівна і повільно призводить до падіння своєї цілі.\n\nПорча є постійною, її наслідки закінчуються лише смертю.
actors.buffs.corruption.name=пошкоджений
actors.buffs.cripple.desc=Ти впевнений, що ноги не повинні згинатися таким чином.\n\nКаліка зменшує швидкість руху вдвічі, завдяки чому переміщення плитки зазвичай займає два ходи замість одного.\n\nХодів каліки, що залишилися: %s.
actors.buffs.cripple.heromsg=Ти покалічений!
actors.buffs.cripple.name=покалічений
actors.buffs.daze.desc=Дзвін у вухах та розмитий зір ускладнюють бій.\n\nПід час приголомшення точність та ухилення знижуються на 50%%, що значно ускладнює як приземлення, так і ухилення від ударів.\n\nХодів приголомшення, що залишилися: %s.
actors.buffs.daze.heromsg=Ви приголомшені!
actors.buffs.daze.name=приголомшений
actors.buffs.degrade.desc=Потужна темна магія виснажує силу, яку сувої покращення додали до вашого спорядження!\n\nПід час деградації покращене спорядження вважатиметься нижчого рівня, ніж воно є насправді. _Кожне покращення після +3 стає експоненціально слабшим за попереднє._ Описи ваших предметів змінюватимуться, щоб відобразити їх знижений рівень сили.\n\nДеградація не впливає на вимоги до сили, заряди чарівних паличок, міцність метальної зброї або артефактів.\n\nХодів деградації, що залишилися: %s. Використання сувою покращення або зняття прокляття негайно припинить деградацію.
actors.buffs.degrade.heromsg=Ваше обладнання здається слабшим!
actors.buffs.degrade.name=деградований
actors.buffs.doom.desc=Важко продовжувати, коли здається, що всесвіт хоче твоєї смерті.\n\nПриречені персонажі отримають +67% шкоди з усіх джерел.\n\nПриречення є постійним, його ефекти закінчуються лише смертю.
actors.buffs.doom.name=приречений
actors.buffs.dread.desc=Жах настільки сильний, що змусить ціль повністю втекти з підземелля!\n\nІстоти, уражені жахом, тікають від свого супротивника з великою швидкістю та повністю зникають з підземелля, як тільки зникають з поля зору. Вороги, переможені таким чином, отримують половину досвіду та не втрачають предметів. Шок болю скоротить тривалість жаху.\n\nХодів жаху, що залишилися: %d.
actors.buffs.dread.name=жах
actors.buffs.drowsy.desc=Магічна сила ускладнює неспання, через кілька ходів ціль занурюється в глибокий магічний сон.\n\nГерой може протистояти сонливості, отримуючи шкоду або перебуваючи в повному здоров'ї.\n\nХоди до сну: %s.
actors.buffs.drowsy.name=сонливий
actors.buffs.earthimbue.desc=Ви сповнені силою землі!\n\nУсі фізичні атаки зрушать землю під ворогом, калічачи його на короткий час.\n\nХодів насичення землі, що залишилися: %s.
actors.buffs.earthimbue.name=пронизаний землею
actors.buffs.enhancedrings.desc=Нещодавно використаний артефакт Розбійника посилює його кільця, надаючи їм +1 рівень. \n\nХодів залишилося: %s.
actors.buffs.enhancedrings.name=покращені кільця
actors.buffs.fireimbue.desc=Ви сповнені силою вогню!\n\nУсі фізичні атаки матимуть шанс підпалити ворогів. Крім того, ви повністю несприйнятливі до впливу вогню.\n\nХодів сповнення вогнем, що залишилися: %s.
actors.buffs.fireimbue.name=пронизаний вогнем
actors.buffs.foresight.desc=Ви якимось чином здатні бачити розташування навколишньої місцевості за допомогою розуму.\n\nПід впливом передбачення вам відкриваються всі плитки в широкому радіусі, включаючи будь-які таємні пастки чи двері.\n\nПовороти передбачення, що залишилися: %s.
actors.buffs.foresight.name=передбачення
actors.buffs.frost.desc=Не слід плутати із замерзанням, це більш щадне заморожування просто огортає ціль льодом.\n\nЗаморожування діє подібно до паралічу, унеможливлюючи дії цілі. На відміну від паралічу, заморожування негайно скасовується, якщо ціль отримує пошкодження, оскільки лід розбивається на тріщини.\n\nХодів заморожування, що залишилися: %s.
actors.buffs.frost.freezes=%s зависає!
actors.buffs.frost.name=заморожений
actors.buffs.frostimbue.desc=Ви сповнені крижаної сили!\n\nУсі фізичні атаки поступово накладатимуть холод на ворогів. Крім того, ви повністю несприйнятливі до холоду.\n\nХодів морозу, що залишилися: %s.
actors.buffs.frostimbue.name=пронизаний морозом
actors.buffs.fury.desc=Ви злі, вороги вас не полюблять, коли ви злі.\n\nA У вас палає величезна лють, яка збільшує шкоду, яку ви завдаєте фізичними атаками, на 50%%.\n\nЦя лють триватиме доти, доки ваш рівень здоров'я буде нижче 50%%.
actors.buffs.fury.heromsg=Ти розлючуєшся!
actors.buffs.fury.name=розлючений
actors.buffs.gravitychaostracker.desc_duration=Незрозуміло, як довго триватиме ефект, але він не може тривати вічно.
actors.buffs.gravitychaostracker.desc_intro=Кожні кілька ходів усіх персонажів на поточному поверсі підземелля буде кинуто у випадковому напрямку.
actors.buffs.gravitychaostracker.desc_positive=Хоча, схоже, що ви та ваші союзники маєте імунітет.
actors.buffs.gravitychaostracker.name=гравітаційний хаос
actors.buffs.greaterhaste.desc=Неймовірне прискорення, на мить здається, ніби все зупинилося.\n\nПід впливом більшого прискорення рухові дії взагалі не займають багато часу, але інші дії все ще виконуються зі звичайною швидкістю. Кожен крок руху витрачає хід більшого прискорення.\n\nХоди більшого прискорення, що залишилися: %d.
actors.buffs.greaterhaste.name=більша поспішність
actors.buffs.haste.desc=Енергія протікає крізь ваші м'язи, дозволяючи вам бігати з неймовірною швидкістю!\n\nПід впливом поспішності ви бігатимете зі швидкістю втричі, але всі інші дії виконуватимете зі звичайною швидкістю.\n\nХодів поспішності, що залишилися: %s.
actors.buffs.haste.name=поспіх
actors.buffs.healing.desc=Магічний засіб змушує рани затягуватися, а плоть зрощуватися.\n\nЗ кожним ходом здоров'я поступово відновлюватиметься, доки ефект зцілення не закінчиться. З часом кількість зцілення може зменшуватися.\n\nНаступне зцілення: %d.\n\nЗалишок зцілення: %d.
actors.buffs.healing.name=загоєння
actors.buffs.herodisguise.desc=Ілюзорна магія змінила твій фізичний вигляд! Ефект суто косметичний, але все одно відчувається дуже дивно. \n\n Залишилося ходів маскування: %s.
actors.buffs.herodisguise.name=маскування
actors.buffs.hex.desc=Темна магія, яка послаблює фокус, роблячи ціль трохи дезорієнтованою.\n\nПрокляття зменшує точність та ухилення на 20%%, роблячи ціль менш ефективною в бою.\n\nХодів заклинання, що залишилося: %s.
actors.buffs.hex.heromsg=Тебе прокляли!
actors.buffs.hex.name=заклятий
actors.buffs.holdfast.desc=Воїн утримує свою позицію, збільшуючи свою броню на %1$d-%2$d та уповільнюючи швидкість розпаду деяких бафів на %3$d%%. Це триватиме, поки він не переміститься.
actors.buffs.holdfast.name=тримайся міцно
actors.buffs.hunger.cursedhorn=Проклятий ріг краде частину харчової енергії, коли ви їсте.
actors.buffs.hunger.desc=Голод поступово зростає, коли ви проводите час у підземеллі, і зрештою ви почнете голодувати. Під час голодування ви будете поступово втрачати здоров'я, а не відновлювати його.\n\nНормування важливе! Якщо у вас є запас здоров'я, голодування — непогана ідея, якщо це означає, що пізніше буде більше їжі. Ефективне нормування може значно довше зберегти запас їжі!
actors.buffs.hunger.desc_intro_hungry=Ви можете відчувати, як ваш шлунок кличе до їжі, але це ще не надто терміново.
actors.buffs.hunger.desc_intro_starving=Ти такий голодний, що аж боляче.
actors.buffs.hunger.hungry=голодний
actors.buffs.hunger.ondeath=Ти помер від голоду...
actors.buffs.hunger.onhungry=Ви голодні.
actors.buffs.hunger.onstarving=Ти голодуєш!
actors.buffs.hunger.rankings_desc=Голодна смерть
actors.buffs.hunger.starving=голодуючий
actors.buffs.invisibility.desc=Ви повністю зливаєтеся з навколишньою місцевістю, що робить вас неможливим для спостереження.\n\nПоки ви невидимі, вороги не можуть атакувати вас або слідувати за вами. Фізичні атаки та магічні ефекти (такі як сувої та палички) негайно скасовують невидимість.\n\nХодів невидимості, що залишилися: %s.
actors.buffs.invisibility.name=невидимий
actors.buffs.invulnerability.desc=Цей персонаж наділений величезною захисною силою, що дарує йому короткий період невразливості!\n\nХодів залишилося: %s.
actors.buffs.invulnerability.name=невразливий
actors.buffs.levitation.desc=Магічна сила левітує вас над землею, змушуючи вас почуватися невагомими. \n\nЛевітуючі персонажі рухаються безшумно та ігнорують усі наземні ефекти. Пастки не спрацьовують, вода не загасить вогонь, рослини не будуть затоптані, коріння не промахнеться, а над ямами буде зависати ширяння. Будьте обережні, оскільки все це може набути чинності щойно левітація закінчиться! \n\nЗалишилося ходів левітації: %s.
actors.buffs.levitation.name=левітуючий
actors.buffs.lifelink.desc=Життєва сила цього персонажа пов'язана з іншим персонажем поруч. Будь-яка отримана шкода розподіляється між ними.\n\nЩоразу, коли цей персонаж отримує шкоду, половина її буде завдана цілі зв'язку життя.\n\nХодів зв'язку життя, що залишилися: %s.
actors.buffs.lifelink.name=життєвий зв'язок
actors.buffs.lifelink.ondeath=Пошкодження, пов'язані з життям, вбило тебе...
actors.buffs.light.desc=Навіть у Найтемнішому Підземеллі постійне світло поруч завжди заспокоює.\n\nСвітло допомагає тримати темряву подалі, дозволяючи бачити на розумній відстані, незважаючи на навколишнє середовище.\n\nКількість витків освітлення, що залишилися: %s.
actors.buffs.light.name=освітлений
actors.buffs.lockedfloor.desc=Поточний поверх заблоковано, і ви не можете його покинути!\n\nПоки поверх заблоковано, ви не відчуватимете голоду та не отримуватимете шкоди від голодування. Крім того, якщо ви не докладете зусиль для перемоги над босом цього поверху, пасивні ефекти регенерації також припиняться.\n\nКрім того, якщо вас оживить неблагословенний анкх, поки поверх заблоковано, він скинеться.\n\nВбийте боса цього поверху, щоб зламати замок.
actors.buffs.lockedfloor.name=підлога замкнена
actors.buffs.lostinventory.desc=Ваш інвентар загубився десь у підземеллі! Ви не зможете підібрати чи використати більшість предметів, поки не знайдете його.
actors.buffs.lostinventory.name=втрачений інвентар
actors.buffs.magicalsight.desc=Якимось чином ви здатні бачити розумом, а не очима.\n\nПоки магічний зір активний, ви зможете бачити крізь всю місцевість у радіусі 12 клітинок.\n\nХодів магічного зору, що залишилося: %s.
actors.buffs.magicalsight.name=чарівне видовище
actors.buffs.magicalsleep.desc=Цей персонаж поринув у глибокий магічний сон, з якого він не прокинеться природним шляхом.\n\nМагічний сон схожий на звичайний сон, за винятком того, що лише пошкодження призводять до пробудження цілі.\n\nДля героя та його союзників магічний сон має деякі відновлювальні властивості, що дозволяє їм швидко зцілюватися під час відпочинку.
actors.buffs.magicalsleep.fallasleep=Ви засинаєтесь глибоким чарівним сном.
actors.buffs.magicalsleep.name=чарівний сон
actors.buffs.magicalsleep.toohealthy=Ви надто здорові та чините опір бажанню спати.
actors.buffs.magicalsleep.wakeup=Ви прокидаєтеся бадьорим та здоровим.
actors.buffs.magicimmune.desc=Усі магічні ефекти втратили над вами свій вплив, ви повністю невразливі до них.\n\nХоча ви маєте імунітет до магії, усі шкідливі та корисні магічні ефекти не застосовуватимуться до вас, включаючи прокляття, чари, палички, сувої, кільця, артефакти тощо. Здібності героїчної броні достатньо сильні, щоб працювати незалежно від цього ефекту.\n\nХодів магічного імунітету, що залишилися: %s.
actors.buffs.magicimmune.name=імунітет до магії
actors.buffs.mindvision.desc=Якимось чином ви можете бачити всіх істот на цьому поверсі через свій розум. Це дивне відчуття.\n\nУсі персонажі на цьому поверсі видимі для вас, якщо у вас є розумовий зір. Бачення істоти через розумовий зір вважається тим, що вона знаходиться поруч або знаходиться поруч, для багатьох магічних ефектів.\n\nЗалишок поворотів розумового зору: %s.
actors.buffs.mindvision.name=бачення розуму
actors.buffs.momentum.action_name=фріран
actors.buffs.momentum.momentum=нарощування імпульсу
actors.buffs.momentum.momentum_desc=Під час руху Фріраннер нарощує імпульс, який він може витратити, щоб розпочати фріраннер.\n\nКожен заряд імпульсу дає два ходи фріраннеруху, і Фріраннер може накопичити до 10 зарядів. Імпульс швидко втрачається, коли Фріраннер зупиняється.\n\nПоточний заряд імпульсу: %d.
actors.buffs.momentum.resting=одужує
actors.buffs.momentum.resting_desc=Під час руху Фріраннер набирає імпульс, який він може витратити, щоб розпочати фріраннер.\n\nФріраннеру потрібен час, щоб відновити свою витривалість, перш ніж знову набирати імпульс.\n\nХодів залишилося: %d.
actors.buffs.momentum.running=фріран
actors.buffs.momentum.running_desc=Під час руху Фріраннер набирає імпульс, який він може витратити, щоб розпочати фріран.\n\nПід час фріраннеруху Фріраннер рухається з подвійною швидкістю та отримує бонус до ухилення залежно від свого рівня.\n\nХодів залишилося: %d.
actors.buffs.monkenergy$monkability$dash.desc=Миттєвий ривок на відстань до 4 клітинок. Ця здатність може долати перешкоди, але не ворогів чи тверду місцевість.
actors.buffs.monkenergy$monkability$dash.empower_desc=Миттєвий ривок на відстань до _8 клітинок_. Ця здатність може долати перешкоди, але не ворогів чи тверду місцевість.
actors.buffs.monkenergy$monkability$dash.name=тире
actors.buffs.monkenergy$monkability$dash.prompt=Виберіть місцезнаходження
actors.buffs.monkenergy$monkability$dragonkick.desc=Руйнівний удар ногою, який завдає %1$d-%2$d шкоди та ігнорує броню. Удар відкидає ціль та паралізує її на кожній клітинці, яку вона проходить.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Руйнівний удар ногою, що завдає _%1$d-%2$d шкоди_ та ігнорує броню. Удар ногою відкидає _всі сусідні цілі_ та паралізує їх на кожній клітинці, якою вони переміщуються.
actors.buffs.monkenergy$monkability$dragonkick.name=удар дракона
actors.buffs.monkenergy$monkability$flurry.desc=Два миттєві удари, що завдають %1$d-%2$d шкоди та ігнорують броню. Цю здатність не можна використовувати повторно.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Два миттєві удари, що завдають шкоди %1$d-%2$d, ігнорують броню _та використовують чари вашої зброї._ Цю здатність не можна використовувати повторно.
actors.buffs.monkenergy$monkability$flurry.name=шквал ударів
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Чернець зосереджений на навколишньому середовищі, очікуючи наступної атаки, спрямованої проти нього. Зосередившись, він гарантовано парирує наступну атаку.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=зосереджений
actors.buffs.monkenergy$monkability$focus.desc=Чернець зосереджується, дозволяючи їй парирувати наступну атаку, спрямовану проти неї.
actors.buffs.monkenergy$monkability$focus.empower_desc=Чернець _миттєво зосереджується_, дозволяючи їй парирувати наступну атаку, спрямовану проти неї.
actors.buffs.monkenergy$monkability$focus.name=фокус
actors.buffs.monkenergy$monkability$meditate.desc=Черниця фокусує енергію у своєму тілі протягом 5 ходів. Це очищає більшість негативних ефектів і дає їй 8 ходів перезарядки чарівної палички та артефакту.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Черниця фокусує енергію у своєму тілі протягом 5 ходів. Це знімає більшість негативних ефектів і дає їй 8 ходів перезарядки чарівної палички та артефакту. _Вона також отримує 80% стійкості до пошкоджень під час медитації та повільно відновлює 20% відсутнього здоров'я._
actors.buffs.monkenergy$monkability$meditate.name=медитувати
actors.buffs.monkenergy.action=Здібності ченця
actors.buffs.monkenergy.desc=Перемагаючи ворогів, Чернець отримує енергію, яку може використовувати для різних здібностей. Більшість ворогів дають 1 одиницю енергії після перемоги, а Чернець не втрачає енергію з часом. \n\nПоточна енергія: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Чернець нещодавно використав одну здатність і повинен зачекати, перш ніж використовувати іншу. \n\nПоточний час відновлення: %d ходи.
actors.buffs.monkenergy.name=енергія
actors.buffs.ooze.desc=Ця липка кислота прилипає до плоті, повільно її розтоплюючи.\n\nСлиз завдаватиме постійної шкоди з часом, але його можна негайно змити водою.\n\nКількість залишків слизу: %s.
actors.buffs.ooze.heromsg=Їдкий слиз роз'їдає твою плоть. Змий його!
actors.buffs.ooze.name=їдкий слиз
actors.buffs.ooze.ondeath=Ти розтанеш...
actors.buffs.ooze.rankings_desc=Розчинений
actors.buffs.paralysis.desc=Часто найгірше, що можна зробити, це взагалі нічого не робити.\n\nПараліч повністю зупиняє всі дії, змушуючи ціль чекати, поки ефект не зникне. Біль від отримання пошкоджень може змусити персонажів чинити опір паралічу, виводячи їх з-під дії ефекту.\n\nЧасів паралічу, що залишилися: %s.
actors.buffs.paralysis.heromsg=Ти паралізований!
actors.buffs.paralysis.name=паралізований
actors.buffs.paralysis.out=чинив опір паралічу
actors.buffs.physicalempower.desc=Ваші удари посилено, що збільшує кількість шкоди, яку ви можете завдати, коли вражаєте ворогів фізичними атаками. \n\nДодаткова шкода: %1$d.\nЗалишилося влучань: %2$d.
actors.buffs.physicalempower.name=фізично підсилений
actors.buffs.pincushion.desc=Метальна зброя, яку ви використовували проти цього персонажа, наразі прилипла до нього та впаде на підлогу після його перемоги. \n\nНаразі прикріплені такі предмети:
actors.buffs.pincushion.name=подушечка для голок
actors.buffs.poison.desc=Отрута проникає крізь тіло, повільно погіршуючи його внутрішнє функціонування.\n\nОтрута завдає шкоди кожен хід пропорційно до того, як довго вона діє.\n\nХодів отрути, що залишилася: %s.
actors.buffs.poison.heromsg=Ви отруєні!
actors.buffs.poison.name=отруєний
actors.buffs.poison.ondeath=Ти помер від отрути...
actors.buffs.poison.rankings_desc=Піддався отруєнню
actors.buffs.preparation.action_name=підготовлений страйк
actors.buffs.preparation.assassinated=убитий
actors.buffs.preparation.desc=Асасин терпляче чекає, готуючись вдарити з тіні.
actors.buffs.preparation.desc_blink=Він здатний моргнути у бік ворога, перш ніж вдарити його, з максимальною відстанню _%d._.
actors.buffs.preparation.desc_dmg=Його наступна атака завдасть _%1$d%% додаткової шкоди_ та стратить звичайних ворогів зі здоров'ям нижче _%2$d%%_ або босів зі здоров'ям нижче _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=Атака також з більшою ймовірністю завдасть більшої шкоди.
actors.buffs.preparation.desc_invis_next=Ходи для сильнішої атаки: _%d._
actors.buffs.preparation.desc_invis_time=Ходи, проведені невидимим: _%d._
actors.buffs.preparation.name=підготовка
actors.buffs.preparation.no_target=Там нема на що нападати.
actors.buffs.preparation.out_of_reach=Ця ціль недосяжна.
actors.buffs.preparation.prompt=Виберіть ціль для атаки!\nМаксимальна дальність моргання: %d
actors.buffs.prismaticguard.desc=Вас охороняє призматичне зображення, яке наразі неактивне. Коли присутні вороги, призматичне зображення активується та захищає вас!\n\nПоки призматичне зображення неактивне, воно поступово відновлюватиметься після будь-якої отриманої шкоди.\n\nПоточні HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Це призматичне зображення також виграє від ефекту «Сила багатьох». Залишилося ходів: %d.
actors.buffs.prismaticguard.name=призматична гвардія
actors.buffs.recharging.desc=Енергія пронизує вас, покращуючи швидкість заряджання ваших паличок та посохів.\n\nКожен хід цього посилення збільшуватиме поточний заряд на чверть, на додаток до звичайного перезаряджання.\n\nХодів перезаряджання, що залишилися: %s.
actors.buffs.recharging.name=підзарядка
actors.buffs.revealedarea.desc=Герою тимчасово відкрито частину підземелля. Він побачить її, де б він не був. \n\nХодів залишилося: %s.
actors.buffs.revealedarea.name=виявлена область
actors.buffs.revealedchar.desc=Цей персонаж відкривається герою, його буде видно, де б він не знаходився. \n\nХодів залишилося: %s.
actors.buffs.revealedchar.name=виявлено
actors.buffs.roots.desc=Коріння (магічне чи природне) хапає за ноги, притискаючи їх до землі.\n\nКоріння фіксує ціль на місці, унеможливлюючи рух та більшість здібностей руху. Інші дії залишаються незмінними, включаючи ефекти телепортації.\n\nХодів кореня, що залишилися: %s.
actors.buffs.roots.heromsg=Ти не можеш рухатися!
actors.buffs.roots.name=вкорінений
actors.buffs.scrollempower.desc=Енергія з нещодавно прочитаного сувою Мага підсилює його чарівні палички!\n\nПідвищення рівня: +%1$d.\nЗалишилося запусу: %2$d.
actors.buffs.scrollempower.name=розширення можливостей прокручування
actors.buffs.shadows.desc=Ви зливаєтеся з тінями навколо, надаючи вам невидимість і уповільнюючи ваш метаболізм.\n\nПоки ви невидимі, вороги не можуть атакувати вас або слідувати за вами. Більшість фізичних атак і магічних ефектів (таких як сувої та палички) негайно скасовують невидимість. Крім того, під час злиття з тінню ваш рівень голоду сповільнюється.\n\nВи залишатиметеся злиті з тінню, доки не вийдете з тіні або ворог не контактуватиме з вами.
actors.buffs.shadows.name=тіньовий злиття
actors.buffs.slow.desc=Магія уповільнення впливає на швидкість руху часу цілі, для них все рухається надзвичайно швидко. \n\nA Уповільнений персонаж виконує всі дії вдвічі довше, ніж зазвичай. \n\nХодів уповільнення, що залишилися: %s.
actors.buffs.slow.name=сповільнився
actors.buffs.snipersmark.action_name_snapshot=знімок
actors.buffs.snipersmark.action_name_sniper=снайперський постріл
actors.buffs.snipersmark.action_name_volley=залп
actors.buffs.snipersmark.desc=Снайпер зосереджений на цілі, яку він нещодавно атакував. Він може виконувати спеціальну атаку своїм луком, яка залежить від того, як посилено лук.\n\nНепосилений лук вистрілить _моментальний_ постріл,_ який завдає зменшеної шкоди, але стрілянина не займає багато часу.\n\nA Лук, посилений на швидкість, вистрілить _залп_ з трьох стріл. Кожна стріла завдає зменшеної шкоди, але все ще може активувати зачарування. Цей залп стріляє 1 хід.\n\nA Лук, посилений на шкоду, вистрілить _снайперським_ пострілом._ Цей постріл гарантовано влучить, завдає додаткової шкоди залежно від відстані від цілі та стріляє 2 ходу.\n\nЗалишилося ходів: %s.
actors.buffs.snipersmark.name=мітка снайпера
actors.buffs.soulmark.desc=Чаклун підключився до душі цієї істоти, що дозволило йому зцілюватися, коли вона отримує фізичну шкоду. \n\nХодів знака душі, що залишився: %s.
actors.buffs.soulmark.name=позначена душа
actors.buffs.stamina.desc=У вас безмежна витривалість, що дозволяє вам швидше рухатися!\n\nПід впливом витривалості ви бігатимете зі швидкістю +50%%, але виконуватимете всі інші дії зі звичайною швидкістю.\n\nХоди витривалості, що залишилися: %s.
actors.buffs.stamina.name=витривалість
actors.buffs.terror.desc=Терор — це маніпулятивна магія, яка змушує свою ціль впадати в неконтрольовану паніку. \n\nПерсонажі, що перелякані, змушені тікати від свого супротивника, намагаючись поставити між ними якомога більше дверей і стін. Однак шок болю скоротить тривалість жаху. \n\nЗалишилося витків жаху: %s.
actors.buffs.terror.name=жахливий
actors.buffs.toxicimbue.desc=Ви сповнені отруйної енергії!\n\nКоли ви рухаєтесь, з вас постійно вириватиме токсичний газ, завдаючи шкоди вашим ворогам. Ви маєте імунітет до токсичного газу та отрути протягом дії ефекту, а також протягом кількох ходів після нього.\n\nХодів токсичного сприйняття, що залишилося: %s.
actors.buffs.toxicimbue.name=просякнутий токсичністю
actors.buffs.vertigo.desc=Ходити по прямій лінії може бути важко, коли весь світ обертається.\n\nПід впливом запаморочення персонажі, які намагаються рухатися, рухатимуться у випадковому напрямку, а не в тому, в якому вони мали намір піти.\n\nКількість витків запаморочення, що залишилися: %s.
actors.buffs.vertigo.name=запаморочення
actors.buffs.vulnerable.desc=Магія вразливості збільшує всю фізичну шкоду, яку отримує персонаж, на 33%%, після того як ця шкода зменшується бронею.\n\nХоди вразливості, що залишилися: %s.
actors.buffs.vulnerable.heromsg=Ти почуваєшся крихким!
actors.buffs.vulnerable.name=вразливий
actors.buffs.wandempower.desc=Ваші чарівні палички, що завдають шкоди, посилені, що збільшує кількість завданої ними шкоди на кілька ударів. \n\nДодаткова шкода: %1$d.\nЗалишилося ударів: %2$d.
actors.buffs.wandempower.name=палички, наділені силою
actors.buffs.weakness.desc=Все раптом здається набагато важчим.\n\nОслаблення магії зменшує фізичну силу персонажа, змушуючи його завдавати на 33%% зменшеної шкоди.\n\nЗалишилися витки слабкості: %s.
actors.buffs.weakness.heromsg=Ти відчуваєш себе ослабленим!
actors.buffs.weakness.name=ослаблений
actors.buffs.wellfed.desc=Ви почуваєтеся цілком задоволеними та ситими.\n\nКоли ви добре нагодовані, ваш голод не збільшуватиметься, і з часом ви відновлюватимете додаткову кількість здоров'я.\n\nХодів залишилося: %d.
actors.buffs.wellfed.name=добре годований
actors.char.def_verb=ухилився
actors.char.def_verb_blocked=заблоковано
actors.char.defeat=Ви перемогли %s.
actors.char.immune=імунний
actors.char.invulnerable=невразливий
actors.char.kill=%s тебе вбив...
actors.hero.abilities.armorability.cost=Вартість плати: _%d_
actors.hero.abilities.armorability.no_target=Там нема на що орієнтуватися!
actors.hero.abilities.armorability.prompt=Виберіть місце для цільового розташування
actors.hero.abilities.armorability.self_target=Ти не можеш цілитися в себе!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Тіло Клірика випромінює променисту енергію. У цій формі Клірик отримує 2 одиниці дальності атаки (завдяки святій енергії, що випромінюється ним) та 10 одиниць захисту щоразу, коли витрачає заряд священного фоліанта. Він також може використовувати заклинання, які розблоковуються талантами вознесенної форми.\n\nЩит, наданий вознесенною формою та її заклинаннями, не зникатиме зазвичай, а миттєво зникатиме після закінчення дії вознесенної форми.\n\nПоточний захист: %1$d.\nХодів залишилося: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=вознесена форма
actors.hero.abilities.cleric.ascendedform.desc=Клірик випромінює з себе святу енергію, приймаючи розширену променисту форму протягом 10 ходів. У цій формі Клірик може використовувати нові заклинання, отримує 2 одиниці дальності атаки, 30 одиниць захисту, а будь-які додаткові заклинання, які він використовує, даватимуть 10 одиниць захисту за кожен використаний заряд священного фоліанта. \n\nЗахист від вознесенної форми та її заклинань не зникає зазвичай, а миттєво зникає після закінчення дії вознесенної форми. Здатність можна використовувати повторно для оновлення тривалості вознесенної форми.
actors.hero.abilities.cleric.ascendedform.name=вознесена форма
actors.hero.abilities.cleric.ascendedform.short_desc=Клірик приймає _Вознесену Форму_, отримуючи нові заклинання, дальність атаки та щити.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Копія одного з супутників Клірика-шукача пригод, зроблена з твердого світла. Хоча вона має форму іншого героя, вона не має жодної з його унікальних здібностей. Цей союзник існуватиме доти, доки до нього застосовується «Сила багатьох». \n\nЦього союзника можна спрямувати безкоштовно, повторно використовуючи здатність броні «Сила багатьох».
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Ваш союзник переходить в атаку!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Ваш союзник переміщується на цю позицію.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Ваш союзник рухається, щоб слідувати за вами.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Ви можете знайти цього персонажа зі спеціальною здатністю героїчної броні.
actors.hero.abilities.cleric.powerofmany$lightally.name=світлий союзник
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Цього союзника посилила «Сила багатьох», що дає йому +25%% завданої шкоди та -25%% отриманої шкоди. Вони також ділитимуться своїм радіусом зору зі Священнослужителем і зможуть отримати користь від сили багатьох заклинань.\n\n «Сила багатьох» діятиме, коли такі союзники, як призматичні зображення, ховаються, але її тривалість все ще відраховуватиметься.\n\nХодів залишилося: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=влада багатьох
actors.hero.abilities.cleric.powerofmany.ally_exists=У вас вже є сильний союзник.
actors.hero.abilities.cleric.powerofmany.desc=Клірик передає _Силу багатьох_, яка або посилює існуючого союзника, або створює нового посиленого на 100 ходів. Вибравши порожнє місце, ви створите нового союзника.\n\nПід час використання здібності «Сила багатьох» будь-який союзник завдає +25% шкоди, отримує -25% шкоди та ділиться своїм баченням з Кліриком. Він також отримує 25 одиниць захисту, коли використовує цю здатність.\n\nКлірик також отримує три нові заклинання, які можна застосувати лише з посиленим союзником. «Сила багатьох» не закінчиться, поки одне з цих заклинань активне.
actors.hero.abilities.cleric.powerofmany.name=влада багатьох
actors.hero.abilities.cleric.powerofmany.no_vision=Ви не можете орієнтуватися на місцезнаходження, яке не бачите.
actors.hero.abilities.cleric.powerofmany.only_allies=Ви можете лише надати сили союзникам.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Направте свого світлового союзника
actors.hero.abilities.cleric.powerofmany.prompt_default=Виберіть союзника або місцезнаходження
actors.hero.abilities.cleric.powerofmany.short_desc=Клірик передає _Силу Багатьох_, посилюючи існуючого союзника або створюючи нового.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Призначити формі тіла
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Призначити форму розуму
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Призначити духовній формі
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Виберіть ефект, який буде застосовано до Trinity. Додаткова інформація буде показана перед підтвердженням.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Форма тіла: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Форма розуму: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Форма духу: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Виберіть, яку форму Трійці використовувати. Ефекти різних форм можуть бути активними одночасно.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Трійця застосує ефект дистанційної алхімічної дії цього артефакту ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Трійця застосовуватиме пасивний ефект регенерації здоров'я цього артефакту на _+%1$d_ протягом 20 ходів, ціною заряду _%2$s_.
actors.hero.abilities.cleric.trinity.cost=Вартість заряду цієї здібності варіюється, але найчастіше становить _%d._
actors.hero.abilities.cleric.trinity.desc=Клірик отримує _Трійцю_ здібностей броні, які можна призначити різним ефектам предметів за допомогою трьох нових заклинань. Кожне з цих заклинань зосереджено на емуляції ефектів різних видів спорядження, які Клірик визначив під час цього проходження: форма тіла (зброя та броня), форма розуму (палички та метальна зброя) та форма духу (кільця та артефакти).\n\nКожна форма Трійці може бути наповнена одним ефектом за раз, і Клірик вибирає, який з них активувати, використовуючи Трійцю. Трійця не дублюватиме ефект того, що ви вже екіпірували.
actors.hero.abilities.cleric.trinity.driedrose_use=Трініті використає ефект цього артефакту, щоб викликати зіпсованого дружнього духа з HP привида _+%1$d_, ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Трініті застосує цей ефект для ходів _%1$d_ ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.etherealchains_use=Трійця застосує ефект ланцюгового чаклування цього артефакту з досяжністю на _+%1$d_, ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Трійця застосує ефект перекусу цього артефакту ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Трійця застосує ефект пограбування ворогів цього артефакту о _+%1$d_, ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.name=трійця
actors.hero.abilities.cleric.trinity.no_duplicate=Трійця не може дублювати ефект, який ви вже екіпірували!
actors.hero.abilities.cleric.trinity.no_imbue=Трійця наразі не має встановленого ефекту для жодної зі своїх форм, скористайтеся одним із її заклинань!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Трініті застосує цей _потужний_ ефект для ходів _%1$d_ ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.ring_use=Трійця застосовуватиме ефект цього кільця о _+%1$d_ протягом 20 ходів, ціною заряду _%2$s_.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Трійця застосує ефект кореня цього артефакту за допомогою випадкового шкідливого насіння, ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.short_desc=Клірик отримує _Трійцю_ здібностей, які емулюють спорядження, яке він бачив, і можуть бути призначені за допомогою нових заклинань.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Трійця застосує ефект вставки цього артефакту ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Трійця застосує ефект чаклунства цього артефакту о _+%1$d_, ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.thrown_use=Трініті кине цю зброю в _+%1$d_ ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Трійця застосує ефект заморожування часу цього артефакту з тривалістю ходу _%1$d_, ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Трійця застосує ефект випадкового прокручування цього артефакту з шансом _%1$d/10_, щоб запропонувати екзотичну версію без додаткової плати, за рахунок _%2$s._
actors.hero.abilities.cleric.trinity.wand_multi_use=Трініті знищить цю _багатозарядну_ паличку о _+%1$d_ ціною заряду _%2$s._
actors.hero.abilities.cleric.trinity.wand_use=Трініті знищить цю паличку о _+%1$d_ ціною заряду _%2$s._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Цей персонаж бере участь у дуелі. Він та будь-який з його союзників чи міньйонів можуть діяти нормально, поки інші заморожені.\n\nДуель триватиме протягом певного часу, доки один з учасників не помре або доки учасники не відійдуть один від одного на відстань більше ніж 5 клітинок.\n\nХодів залишилося: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=учасник дуелі
actors.hero.abilities.duelist.challenge.ally_target=Ви можете кинути виклик лише ворогам.
actors.hero.abilities.duelist.challenge.already_dueling=Ви можете брати участь лише в одній дуелі одночасно.
actors.hero.abilities.duelist.challenge.desc=Дуелянт викликає ворога, що знаходиться поруч, на дуель. Цей ворог змушений битися з ним, поки всі інші вороги тимчасово заморожені в часі.\n\nЦіль має бути досяжною та знаходитися в межах 5 клітинок від Дуелянта. Дуель триває, поки не пройде 10 ходів, ворог не помре або Дуелянт не опиниться на відстані більше 5 клітинок від ворога.\n\nЗаморожені вороги невразливі. Союзники Дуелянта не заморожуються цією здібністю, але якщо цільовою є бос, його міньйони також не будуть заморожені.
actors.hero.abilities.duelist.challenge.distant_target=Цей ворог занадто далеко, щоб йому кинути виклик.
actors.hero.abilities.duelist.challenge.name=виклик
actors.hero.abilities.duelist.challenge.prompt=Виберіть ворога, якому хочете кинути виклик
actors.hero.abilities.duelist.challenge.short_desc=Дуелянт _Викликає_ ворога поблизу на дуель, тимчасово заморожуючи всіх інших ворогів.
actors.hero.abilities.duelist.challenge.unreachable_target=Ви повинні вміти досягати своєї мети.
actors.hero.abilities.duelist.elementalstrike.desc=Дуелянт вражає ворога або локацію, виконуючи звичайну атаку, яка гарантовано вражає та поширює магічний ефект, що поширюється на 4 клітинки в конусі 65 градусів. Цей магічний ефект залежить від зачарування основної зброї Дуелянта.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Стихійний удар без зачарувань вивільнить невеликий вибух магії, завдаючи 6-12 одиниць шкоди всім ворогам у радіусі дії.
actors.hero.abilities.duelist.elementalstrike.name=стихійний удар
actors.hero.abilities.duelist.elementalstrike.short_desc=Дуелянтка виконує _Елементальний удар_, поширюючи ефект у конічній області дії залежно від зачарування її зброї.
actors.hero.abilities.duelist.feint.bad_location=Ви не можете переїхати в це місце.
actors.hero.abilities.duelist.feint.desc=Дуелянт імітує атаку, мчачи до сусідньої клітинки, залишаючи після себе миттєве післязображення. Вороги, які атакували дуелянта, атакуватимуть його післязображення. \n\nВороги, які атакують післязображення, сплутуються, що скасовує їхню наступну дію та залишає їх відкритими для несподіваної атаки.
actors.hero.abilities.duelist.feint.name=обман
actors.hero.abilities.duelist.feint.prompt=Виберіть місце, куди мчати
actors.hero.abilities.duelist.feint.short_desc=Дуелянтка виконує _Фінти_, імітуючи атаку, мчачи до сусідньої клітинки. Вороги атакуватимуть її післязображення, відкриваючи їм можливості для контратаки.
actors.hero.abilities.duelist.feint.too_far=Це місце не поруч з вами.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Мисливиця ненадовго отримує сили, що збільшує її швидкість пересування та швидкість атаки луком. \n\nХодів залишилося: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=сила природи
actors.hero.abilities.huntress.naturespower.desc=Мисливиця тимчасово насичує себе та свій лук силою природи! Це триває 8 ходів.\n\nПротягом цього часу Мисливиця рухається зі швидкістю вдвічі швидше та атакує на 33% швидше своїм луком. Бонусні ефекти лука не спрацьовують, якщо снайпер використовує свої спеціальні атаки.
actors.hero.abilities.huntress.naturespower.name=сила природи
actors.hero.abilities.huntress.naturespower.short_desc=Мисливиця закликає _Силу Природи_, на короткий час збільшуючи швидкість свого пересування та скорострільність лука.
actors.hero.abilities.huntress.spectralblades.desc=Мисливиця викидає у ворога примарний клинок, який діє як удар дальньої дії з її зброї ближнього бою. Активуються всі звичайні ефекти зброї ближнього бою, включаючи чари.
actors.hero.abilities.huntress.spectralblades.name=спектральні леза
actors.hero.abilities.huntress.spectralblades.short_desc=Мисливиця кидає _Примарні Клинки_ у ціль, завдаючи шкоди залежно від її поточної зброї ближнього бою.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Чарівний яструб, викликаний Мисливицею. Він світиться яскравим ефірним блакитним кольором, його голова постійно повертається, коли він оглядає місцевість.\n\nХоча він не дуже вправний воїн, його швидкість і зір роблять його чудовим для розвідки та відволікання ворогів.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Гарантовано залишилося ухилень: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Залишок поворотів: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Ваш яструб рухається до атаки!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Ваш яструб переміщується в цю позицію.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Ваш яструб рухається, щоб слідувати за вами.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Ви можете знайти цього персонажа зі спеціальною здатністю героїчної броні.
actors.hero.abilities.huntress.spirithawk$hawkally.name=дух-яструб
actors.hero.abilities.huntress.spirithawk.desc=Мисливиця викликає фамільярного духа-яструба, якого можна направити, використовуючи цю здатність знову під час виклику. Яструб триває 100 ходів, направлення яструба не коштує жодного заряду.\n\nЯструб має мінімальне здоров'я та атакуючу силу, але є швидким, ухильним та точним. Він завжди ділить усе своє поле зору з Мисливицею. Він має імунітет до всіх ефектів, обмежених областю, таких як вогонь та отруйний газ. Він не атакуватиме, якщо не буде спеціально спрямований на це.
actors.hero.abilities.huntress.spirithawk.name=дух-яструб
actors.hero.abilities.huntress.spirithawk.no_space=Вільного місця поруч з вами немає.
actors.hero.abilities.huntress.spirithawk.short_desc=Мисливиця викликає фамільяра _Духовного Яструба_, який може допомогти їй розвідувати місця та відволікати ворогів.
actors.hero.abilities.mage.elementalblast.desc=Маг випускає магічний вибух, який охоплює круглу область на відстані до 4 клітинок і завдає до 15-25 одиниць шкоди. Конкретний ефект стихійного вибуху залежить від палички, якою наповнений посох Мага.
actors.hero.abilities.mage.elementalblast.generic_desc=Ефект стихійного вибуху буде подібним до ефекту чарівної палички при ударі по ворогу або союзнику.
actors.hero.abilities.mage.elementalblast.name=стихійний вибух
actors.hero.abilities.mage.elementalblast.no_staff=Ви не можете скористатися цією здатністю без свого персоналу.
actors.hero.abilities.mage.elementalblast.short_desc=Маг випускає _Елементальний Вибух_ зі свого посохом, охоплюючи велику площу навколо нього, ефект якого залежить від палички в його посохе.
actors.hero.abilities.mage.warpbeacon.depths=Ви не можете переміщатися між глибинами!
actors.hero.abilities.mage.warpbeacon.desc=Маг розміщує маяк, який потім можна трансформувати в нього за бажанням. Розміщення маяка займає 1 хід, але трансформація в нього відбувається миттєво.\n\nМаг за замовчуванням не може переміщатися між поверхами або використовувати маяк, щоб дістатися до недоступних місць, таких як замкнені кімнати. Маг може телепортуватися до ворогів, що відштовхне їх.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Там маяк ставити не можна!
actors.hero.abilities.mage.warpbeacon.locked_floor=Не можна залишати замкнений поверх!
actors.hero.abilities.mage.warpbeacon.name=варп-маяк
actors.hero.abilities.mage.warpbeacon.short_desc=Маг розміщує _Маяк Викривлення_ у своєму поточному місці, до якого він може миттєво телепортуватися назад.
actors.hero.abilities.mage.warpbeacon.too_far=Це місце занадто далеко!
actors.hero.abilities.mage.warpbeacon.window_cancel=скасувати
actors.hero.abilities.mage.warpbeacon.window_clear=чіткий маяк
actors.hero.abilities.mage.warpbeacon.window_desc=Ваш маяк наразі розміщено на поверсі %d.
actors.hero.abilities.mage.warpbeacon.window_tele=телепортуватися до маяка
actors.hero.abilities.mage.wildmagic.desc=Маг вивільняє силу своїх паличок, випадковим чином стріляючи ними до 4 разів за один хід. Посох Мага не враховується в цьому ефекті. \n\n Кожна паличка також має підвищений рівень на 2, до +3. Ця здатність використовує половину заряду палички для кожного удару, і жодну паличку не можна стріляти більше 2 разів.
actors.hero.abilities.mage.wildmagic.name=дика магія
actors.hero.abilities.mage.wildmagic.no_wands=У тебе немає паличок, щоб ними вразити!
actors.hero.abilities.mage.wildmagic.short_desc=Маг вивільняє _Дику Магію_, що міститься в його чарівних паличках, випадковим чином стріляючи ними кілька разів у вибрану ціль протягом одного ходу.
actors.hero.abilities.ratmogrify$transmograt.desc=Цього ворога перетворили на пацюка. Велике покращення, якщо хочете знати мою думку! - Король Пацюків
actors.hero.abilities.ratmogrify$transmograt.name=щуроподібний %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Убитий: ворогом, схваченим щурами
actors.hero.abilities.ratmogrify.cant_transform=Цього не можна ратмогрифікаціювати!
actors.hero.abilities.ratmogrify.desc=Герой перетворює ворога на пацюка на 6 ходів! Босів, союзників та пацюків не можна щуроутворити. \n\nЩуроутворені вороги зберігають свої початкові характеристики, але не мають жодних здібностей.
actors.hero.abilities.ratmogrify.name=ратмогрифікація
actors.hero.abilities.ratmogrify.short_desc=Герой _Щурмогрифікує_ ворога! Це тимчасово перетворює його на щура без здібностей.
actors.hero.abilities.ratmogrify.too_strong=Цей ворог надто сильний, щоб його можна було щурограмувати!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Цього ворога було позначено, що призвело до отримання ним додаткової шкоди у розмірі 25%%, але також позбавило його можливості померти, доки дія позначки не закінчиться.\n\nХодів залишилося: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=позначений смертю
actors.hero.abilities.rogue.deathmark.ally_target=Ви можете позначати лише ворогів
actors.hero.abilities.rogue.deathmark.desc=Розбійник накладає мітку на обраного ворога, через що він отримує на 25% більше шкоди. Мітка накладається миттєво та триває 5 ходів.\n\nМічені вороги отримують додаткову шкоду, але не можуть померти, доки дія мітки не закінчиться. Якщо ворог має 0 очок здоров'я, коли дія мітки закінчується, він негайно помре.
actors.hero.abilities.rogue.deathmark.name=посмертна пляма
actors.hero.abilities.rogue.deathmark.short_desc=Розбійник накладає _Мітку смерті_ на обраного ворога. Мічені вороги отримують додаткову шкоду, але не можуть померти, доки мітка не закінчиться.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Копія Розбійника, створена з тінистої темряви. Він стоїть нерухомо, з порожніми очима та крихітними клаптиками темряви, що піднімаються з нього, немов пара.\n\nКлон не є ідеальною копією Розбійника, але все ще є пристойним бійцем і може отримати користь від спорядження Розбійника за допомогою правильних талантів.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Ваш клон рухається в атаку!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ваш клон переміститься на цю позицію.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Ваш клон рухається, щоб слідувати за вами.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Ви можете знайти цього персонажа зі спеціальною здатністю героїчної броні.
actors.hero.abilities.rogue.shadowclone$shadowally.name=тіньовий шахрай
actors.hero.abilities.rogue.shadowclone.desc=Розбійник викликає тіньову імітацію себе, яку можна направити, щоб допомогти йому в бою. Направлення тіньового клона не коштує жодної плати.\n\nКлон має 80 здоров'я, не має броні та завдає 10-20 одиниць шкоди. Всі ці риси можна покращити за допомогою талантів, таким чином, клон отримує переваги від зброї та броні героя.
actors.hero.abilities.rogue.shadowclone.name=тіньовий клон
actors.hero.abilities.rogue.shadowclone.short_desc=Розбійник викликає _Тіньового Клона_, якого можна спрямувати для допомоги йому в бою.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Якимось чином вороги легко переконуються, що ця дерев'яна приманка — справжній Розбійник!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Ви можете знайти цього персонажа зі спеціальною здатністю героїчної броні.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=дерев'яна приманка
actors.hero.abilities.rogue.smokebomb.desc=Розбійник кидає димову бомбу та блимає на відстань до 6 клітинок. Він може блимати крізь небезпеки та ворогів, але не крізь тверду місцевість, таку як стіни. \n\nВороги, що знаходяться поруч зі старою позицією Розбійника, будуть засліплені на 5 ходів.
actors.hero.abilities.rogue.smokebomb.fov=Ви можете перестрибнути лише на порожнє місце у вашому полі зору.
actors.hero.abilities.rogue.smokebomb.name=димова бомба
actors.hero.abilities.rogue.smokebomb.prompt=Виберіть місце для переходу
actors.hero.abilities.rogue.smokebomb.short_desc=Розбійник кидає _димову бомбу_, кліпаючи очима. Він засліплює ворогів поблизу свого старого місця розташування.
actors.hero.abilities.warrior.endure$enduretracker.desc=Воїн тепер завдає додаткової шкоди залежно від отриманої шкоди. \n\nДодаток шкоди: %1$d\nЗалишилися удари: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=витривалість
actors.hero.abilities.warrior.endure.desc=Воїн витримує 3 ходи, отримуючи половину шкоди з усіх джерел. Це зменшення застосовується до ефектів опору урону, таких як броня.\n\nПісля витримки наступний удар воїна протягом 10 ходів отримує додаткову шкоду. Ця додаткова шкода дорівнює половині всієї шкоди, завданої йому під час витримки, до будь-яких ефектів зменшення шкоди!\n\nЯкщо у Воїна є будь-яке комбо, використання цієї здатності збільшує час, що залишився, на 3 ходи.
actors.hero.abilities.warrior.endure.name=терпіти
actors.hero.abilities.warrior.endure.short_desc=Воїн _Витримує_, пропускаючи кілька ходів, але отримуючи високий опір пошкодженням. Потім він завдає додаткової шкоди залежно від того, що він витримав.
actors.hero.abilities.warrior.heroicleap.desc=Воїн стрибає до вибраного місця, долаючи будь-яких ворогів або перешкоди на шляху. Однак він не може перестрибувати стіни чи іншу тверду місцевість.
actors.hero.abilities.warrior.heroicleap.name=героїчний стрибок
actors.hero.abilities.warrior.heroicleap.prompt=Виберіть напрямок для стрибка
actors.hero.abilities.warrior.heroicleap.short_desc=Воїн виконує _Героїчний стрибок_ до цільового місця, ширяючи над ворогами та небезпеками.
actors.hero.abilities.warrior.shockwave.desc=Воїн б'є по землі, створюючи ударну хвилю, яка поширюється на 5 клітинок у конусі під кутом 60 градусів.\n\nВороги, що потрапляють під цю ударну хвилю, калічаться на 5 ходів. Вони також отримують 5-10 одиниць шкоди, плюс додаткові 1-2 одиниці шкоди за кожну очку сили Воїна понад 10.
actors.hero.abilities.warrior.shockwave.name=ударна хвиля
actors.hero.abilities.warrior.shockwave.short_desc=Воїн випускає _Ударну Хвилю_ у конічній області дії, вдаряючись об землю. Вороги, що потрапили під ударну хвилю, отримують пошкодження та каліцтва.
actors.hero.hero.key_distracted=Тобі не вдасться повністю відкрити замок, доведеться продовжувати намагатися.
actors.hero.hero.leave=Ти ще не можеш піти, решта підземелля чекає на тебе внизу!
actors.hero.hero.level_cap=Ти не можеш стати сильнішим, але твій досвід дає тобі приплив сили!
actors.hero.hero.level_up=Підвищте свій рівень!
actors.hero.hero.locked_chest=Ця скриня замкнена, і у вас немає відповідного ключа.
actors.hero.hero.locked_door=У вас немає відповідного ключа.
actors.hero.hero.name=ти
actors.hero.hero.new_level=Підвищення рівня! +Точність, +Ухилення, +5 Здоров'я!
actors.hero.hero.new_talent=+1 бал таланту!
actors.hero.hero.noticed_smth=Ти щось помітив.
actors.hero.hero.pain_resist=Біль допомагає вам протистояти бажанню спати.
actors.hero.hero.revive=Анкх вибухає життєдайною енергією!
actors.hero.hero.search=пошук
actors.hero.hero.search_distracted=Важко зосередитися, пошук виснажує.
actors.hero.hero.unspent=У вас є невитрачені очки талантів!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Ви не можете носити: %s.
actors.hero.hero.you_now_have=Ви підібрали: %s.
actors.hero.heroclass.cleric=священнослужитель
actors.hero.heroclass.cleric_desc=Клірик починає з _унікального священного тому_, який він може використовувати для накладання різних заклинань.\n\nБільшість талантів Клірика зосереджені на вивченні або вдосконаленні заклинань.\n\nКлірик також починає з _дубиною_, тканинними обладунками, бурдюком для води та оксамитовим мішечком.\n\nКлірик автоматично ідентифікує:\n_-_ Сувої ідентифікації\n_-_ Зілля чистоти\n_-_ Сувої зняття прокляття
actors.hero.heroclass.cleric_desc_short=Клірик — це божественний заклинатель, який використовує свій унікальний _священний фоліант_ для передачі божественної магії. Він може _вивчати та покращувати заклинання_ за допомогою талантів.
actors.hero.heroclass.cleric_unlock=Щоб розблокувати Клірика, _повністю зняти прокляття з будь-якого предмета проклятого спорядження._
actors.hero.heroclass.duelist=дуелянт
actors.hero.heroclass.duelist_desc=Дуелянт починає з _унікальної рапіри_ зі спеціальною здатністю, яка перезаряджається з часом.\n\nКожна зброя в грі має _різну спеціальну здатність_, яку може використовувати Дуелянт.\n\nДуелянт також починає з _двох кидкових шипів_, тканинної броні, бурдюка з водою та оксамитового мішечка.\n\nДуелянт автоматично ідентифікує:\n_-_ Сувої ідентифікації\n_-_ Зілля сили\n_-_ Сувої дзеркального відображення
actors.hero.heroclass.duelist_desc_short=Дуелянт — майстер зброї, який може використовувати свою зброю, щоб активувати _спеціальну здатність зброї._ Ця особлива здатність _різна для кожної зброї._
actors.hero.heroclass.duelist_unlock=Щоб розблокувати Дуелянта, _екіпіруйте зброю 2-го рівня або вище без штрафу до сили._
actors.hero.heroclass.huntress=мисливиця
actors.hero.heroclass.huntress_desc=Мисливиця починає з _унікального духівного лука_, який може стріляти нескінченною кількістю викликаних стріл.\n\nМисливиця може подорожувати крізь високу траву, _не затоптуючи її_.\n\nМисливиця також починає з _рукавичок з шипами_, тканинних обладунків, бурдюка з водою та оксамитового мішка.\n\nМисливиця автоматично ідентифікує:\n_-_ Сувої ідентифікації\n_-_ Зілля розумового бачення\n_-_ Сувої колискової
actors.hero.heroclass.huntress_desc_short=Мисливиця — майстриня метальної зброї та має _магічний лук_ з нескінченною кількістю стріл. Вона також подорожує крізь високу траву, _не затоптуючи її._
actors.hero.heroclass.huntress_unlock=Щоб розблокувати Мисливицю, _вразіть ворогів метальною зброєю 10 разів за одну гру._
actors.hero.heroclass.mage=маг
actors.hero.heroclass.mage_desc=Маг починає з _унікального посоха_, який перезаряджається значно швидше, ніж чарівна паличка, і має на 1 заряд більше. Посох _можна наповнити будь-якою паличкою_, яку Маг знайде в підземеллі.\n\nМаг також починає з _палички магічного снаряда_, вбудованої в його посох, тканинні обладунки, бурдюк з водою та оксамитовий мішечок.\n\nМаг автоматично ідентифікує:\n_-_ Сувої ідентифікації\n_-_ Зілля рідкого полум'я\n_-_ Сувої покращення
actors.hero.heroclass.mage_desc_short=Маг — експерт з таємничих знань і носить _магічний посох_, сильніший за чарівну паличку. Посох можна _наповнити будь-якою паличкою_, яку знайде Маг.
actors.hero.heroclass.mage_unlock=Щоб розблокувати Мага, _використайте сувій покращення, щоб зробити предмет сильнішим._
actors.hero.heroclass.rogue=шахрай
actors.hero.heroclass.rogue_desc=Розбійник починає з _унікального Плаща Тіней_, який він може використовувати, щоб стати невидимим за бажанням.\n\nРозбійник може _виявляти секрети та пастки_ з більшої відстані.\n\nРозбійник також починає з _кинджала_, _трьох метальних ножів_, тканинної броні, бурдюка з водою та оксамитового мішечка.\n\nРозбійник автоматично ідентифікує:\n_-_ Сувої ідентифікації\n_-_ Зілля невидимості\n_-_ Сувої Магічного Картографування
actors.hero.heroclass.rogue_desc_short=Розбійник може уникати ворогів і атакувати з-за невидимості, використовуючи свій _плащ тіней_. Він також _виявляє таємниці та пастки_ з більшої відстані.
actors.hero.heroclass.rogue_unlock=Щоб розблокувати Розбійника, _виконайте 10 несподіваних атак за одну грі._
actors.hero.heroclass.warrior=воїн
actors.hero.heroclass.warrior_desc=Воїн починає з _унікальною зламаною печаткою_, яка дає йому вибух захисту, коли його здоров'я менше половини. Печатку можна переміщувати між обладунками, і за її допомогою можна _перенести одне покращення_.\n\nВоїн також починає з _зношеним коротким мечем_, _трьома кидковими каменями_, тканинними обладунками, бурдюком для води та оксамитовим мішком.\n\nВоїн автоматично ідентифікує:\n_-_ Сувої ідентифікації\n_-_ Зілля зцілення\n_-_ Сувої люті
actors.hero.heroclass.warrior_desc_short=Воїн зазнає додаткової шкоди завдяки захисту, що надається його _зламаною печаткою._ Печатку можна переміщати між обладунками та _передає одне покращення._
actors.hero.heroclass.warrior_unlock=Воїн розблоковується автоматично.
actors.hero.herosubclass.assassin=вбивця
actors.hero.herosubclass.assassin_desc=Асасин готується до наступного удару, коли стає невидимим. Чим довше він готується, тим потужнішою буде його наступна атака. Підготовка триває до 9 ходів. \n\nПісля підготовки Асасин завдає додаткової шкоди під час наступної атаки, може моргнути до цілі та навіть миттєво вбивати достатньо слабких ворогів.
actors.hero.herosubclass.assassin_short_desc=_Асасин_ може підготувати смертельний удар, будучи невидимим. Чим довше він чекає, тим потужнішою буде атака.
actors.hero.herosubclass.battlemage=бойовий маг
actors.hero.herosubclass.battlemage_desc=Бойовий Маг отримує бонусний ефект щоразу, коли він завдає удару в ближньому бою своїм посохом, ніби його посох має додаткові чари. Ці ефекти залежать від палички, якою наповнений його посох, кожна паличка має свій власний ефект. Окрім ефектів палички, посох Бойового Мага також отримує 0,5 заряду, коли він завдає удару ним.
actors.hero.herosubclass.battlemage_short_desc=_Бойовий маг_ викликає бонусні ефекти під час бою в ближньому бою своїм посохом. Ці ефекти залежать від палички, якою наповнений його посох.
actors.hero.herosubclass.berserker=берсеркер
actors.hero.herosubclass.berserker_desc=Берсеркер набирає люті, коли отримує фізичну шкоду, включаючи шкоду, яку блокує його броня! Лють поступово згасає з часом, але повільніше, якщо у нього низький рівень здоров'я.\n\nЛют може змусити Берсеркера завдати до +50% шкоди. При максимальній люті він може перейти в стан скаженості, отримуючи вибух щита та зберігаючи свою лють, поки у нього залишився щит. Захист залежить від рівня броні берсеркера та може бути значно посилений, якщо у нього низький рівень здоров'я. Берсеркеру потрібен час для відновлення після того, як він впадає в стан скаженості.
actors.hero.herosubclass.berserker_short_desc=_Берсеркер_ нарощує лють, коли отримує шкоду. Лють збільшує його шкоду та може бути активована на 100% для отримання додаткового щита.
actors.hero.herosubclass.champion=чемпіон
actors.hero.herosubclass.champion_desc=Чемпіонка — майстер володіння зброєю ближнього бою, яка може екіпірувати додаткову зброю на додаток до своєї основної. Її звичайні атаки використовують її основну зброю, але вона може миттєво змінити свою основну зброю та використовувати здатність будь-якої з них. \n\nВона також отримує 2 додаткові заряди здібностей зброї та +50% до швидкості перезарядки здібностей зброї.
actors.hero.herosubclass.champion_short_desc=_Чемпіонка_ може володіти двома видами зброї та отримує більше зарядів зброї. Її звичайні атаки використовують її основну зброю, але вона може міняти зброю та використовувати здатність будь-якої з них.
actors.hero.herosubclass.freerunner=фріраннер
actors.hero.herosubclass.freerunner_desc=Під час руху Фріраннер накопичує імпульс. Він може отримати до 10 одиниць імпульсу після 10 ходів бігу, але швидко втрачає їх, якщо зупиняється. Фріраннер може використати свій імпульс, щоб розпочати фріран, по 2 ходи за очко імпульсу.\n\nПід час фрірану Фріраннер рухається зі швидкістю вдвічі більшою та отримує бонус до ухилення пропорційно до свого рівня. Після завершення фрірану є час відновлення, перш ніж імпульс можна буде знову набрати.
actors.hero.herosubclass.freerunner_short_desc=_Фріраннер_ набирає обертів під час бігу, що може бути використано для початку фрірану. Це надає йому бонус до швидкості та можливості ухилення на короткий час.
actors.hero.herosubclass.gladiator=гладіатор
actors.hero.herosubclass.gladiator_desc=Гладіатор накопичує одне очко комбо щоразу, коли він здійснює успішну атаку зброєю ближнього бою або кидковою зброєю. Якщо Гладіатор не здійснює успішну атаку протягом 5 ходів (15 ходів після вбивства), його комбо скидається.\n\nA Коли він накопичує комбо, Гладіатор може використовувати різноманітні здібності, які гарантовано вражають:\n2 Комбо: відкидає ворога назад, зберігає комбо\n4 Комбо: завдає шкоди на основі броні\n6 Комбо: парирує, зберігає комбо\n8 Комбо: завдає шкоди цілі та ворогам поблизу\n10 Комбо: атакує один раз за кожне комбо
actors.hero.herosubclass.gladiator_short_desc=_Гладіатор_ нарощує комбо, коли здійснює успішні атаки. Він може витрачати комбо, щоб використовувати унікальні здібності.
actors.hero.herosubclass.monk=чернець
actors.hero.herosubclass.monk_desc=Чернець — майстер фізичної техніки. Перемагаючи ворогів, він отримує енергію, яку можна використовувати для різноманітних захисних та корисних здібностей. Ця енергія не зникає з часом, а має ліміт, що залежить від рівня Чернеця.\n\n1 Енергія: швидко б'є кулаками\n2 Енергія: зосереджується, щоб ухилитися від наступної атаки\n3 Енергія: миттєво кидається поблизу\n4 Енергія: відбиває ворога ногою\n5 Енергія: медитує, щоб очистити статуси та відновити заряд чарівної палички й артефакту
actors.hero.herosubclass.monk_short_desc=_Чернець_ накопичує енергію під час бою. Цю енергію можна витратити на різноманітні унікальні здібності.
actors.hero.herosubclass.paladin=паладин
actors.hero.herosubclass.paladin_desc=Паладин отримує різноманітні нові та покращені заклинання, що підкреслюють рукопашний бій та синергію зі зброєю та бронею.\n\nЗаклинання _Священна зброя_ та _Священний охоронець_ паладина надають більші бонуси, більше не перезаписують існуючі чари та гліфи, і можуть бути розширені шляхом застосування інших заклинань.\n\nПаладин також отримує заклинання _Удар_, яке дозволяє йому виконувати гарантований удар у ближньому бою з додатковою шкодою та силою чарів.
actors.hero.herosubclass.paladin_short_desc=_Паладин_ отримує нові заклинання ближньої дії та посилені версії священної зброї та оберега.
actors.hero.herosubclass.priest=священик
actors.hero.herosubclass.priest_desc=Жрець отримує різноманітні нові та покращені заклинання, що підкреслюють дальній бій та синергію з магічними предметами.\n\nЖрець може безкоштовно використовувати _Провідне світло_ раз на 50 ходів, освітлювати ворогів, на яких безпосередньо спрямоване будь-яке з їхніх заклинань, та використовувати негативний ефект освітлення разом із союзниками, чарівними паличками та деякими артефактами для додаткової шкоди, що дорівнює їхньому рівню + 5.\n\nЖрець також отримує заклинання _Сяйво_, яке розсіює темряву та впливає на всіх видимих ворогів, активуючи та застосовуючи освітлення та короткочасно приголомшуючи їх ціною 2 зарядів.
actors.hero.herosubclass.priest_short_desc=_Жрець_ отримує нові далекобійні заклинання та посилену версію дороговказного світла.
actors.hero.herosubclass.sniper=снайпер
actors.hero.herosubclass.sniper_desc=Снайпер — майстер дальнього бою, його дальні атаки пробивають ворожу броню. Коли вона атакує ворога меткою, вона ставить на нього снайперську мітку, що дозволяє їй провести спеціальну атаку з лука. Ця спеціальна атака залежить від того, як посилено її лук. \n\nНепосилений лук вистрілює моментально, що завдає зменшеної шкоди, але спрацьовує миттєво. Швидкісний лук вистрілює залпом із трьох стріл, які завдають зменшеної шкоди, все ще може активувати чари та потребує 1 ходу для стрільби. Лук, що завдає шкоди, вистрілює снайперським пострілом, який гарантовано влучає, завдає додаткової шкоди залежно від відстані та потребує 2 ходи для стрільби.
actors.hero.herosubclass.sniper_short_desc=_Снайперка_ може пробивати броню своїми дальніми атаками. Після удару метальною зброєю вона може провести спеціальну атаку зі свого лука.
actors.hero.herosubclass.warden=наглядач
actors.hero.herosubclass.warden_desc=Вартовий має міцний зв'язок з природою, що надає їй різноманітні бонусні ефекти, пов'язані з травою та рослинами. Вона здатна бачити крізь високу та борознисту траву, ніби це порожній простір.\n\nВартовий змушує траву проростати навколо будь-якого насіння, яке вона кидає або садить, і отримує спеціальні ефекти, коли топче рослини. Ці спеціальні ефекти замінюють звичайні ефекти рослин, а це означає, що жодна рослина не є шкідливою для неї, наступаючи на неї.
actors.hero.herosubclass.warden_short_desc=_Страж_ може бачити крізь високу траву та отримує бонусні ефекти, коли саджає насіння та топче рослини.
actors.hero.herosubclass.warlock=чаклун
actors.hero.herosubclass.warlock_desc=Чаклун має шанс накласти на персонажів мітку душі, коли використовує на них чарівні палички. Шанс накласти мітку душі та її тривалість збільшуються з рівнем палички.\n\nКоли ворог має мітку душі, Чаклун відновлюватиме 2 здоров'я за кожні 5 одиниць завданої йому шкоди, але лише атаками з рукопашної або меткої зброї, а не з палиць!
actors.hero.herosubclass.warlock_short_desc=_Чаклун_ має шанс позначити душу ворогів своїми чарівними паличками. Він зцілюватиметься щоразу, коли завдає фізичної шкоди позначеним ворогам.
actors.hero.spells.auraofprotection$aurabuff.desc=Паладин випромінює навколо себе захисну енергію.\n\nБудь-який союзник поблизу (включно з самим Паладином) отримує зменшену шкоду та отримує ефект гліфа броні Паладина з підвищеною силою.\n\nХодів залишилося: %s.
actors.hero.spells.auraofprotection$aurabuff.name=аура захисту
actors.hero.spells.auraofprotection.desc=Паладин починає випромінювати захисну енергію в блискучій аурі навколо себе протягом 20 ходів. Будь-який союзник у межах 2 клітинок від Паладина (включаючи його самого) отримує %1$d%% менше шкоди та отримує ефект гліфа броні Паладина з потужністю +%2$d%%.\n\nЦе зменшення шкоди відбувається перед іншими ефектами зменшення шкоди (наприклад, бронею). Підвищення сили гліфа завжди застосовуватиметься, але це заклинання не може призвести до застосування гліфа Паладина більше одного разу, якщо персонаж вже отримує від нього вигоду (наприклад, сам Паладин або призматичне зображення).
actors.hero.spells.auraofprotection.name=аура захисту
actors.hero.spells.auraofprotection.short_desc=Підвищує захист Паладина та союзників поблизу.
actors.hero.spells.beamingray$beamingrayboost.desc=Цього союзника нещодавно телепортував Променистий Промінь, що дало йому додаткову шкоду проти найближчого ворога після телепортації. Сила багатьох також не зникає, коли це посилення активне. \n\nХодів залишилося: %s.
actors.hero.spells.beamingray$beamingrayboost.name=променя
actors.hero.spells.beamingray.desc=Клірик перетворює силу свого союзника на промінь світла, який спрямовує його до певного місця. Якщо промінь зіткнеться з ворогом, він розмістить союзника поруч і направить його на ворога.\n\nПромінь має максимальну дальність дії на клітинках %1$d і збільшує бонусну шкоду від «Сили багатьох» до +%2$d%% протягом 10 ходів проти найближчого ворога в межах 4 клітинок. Промінь може навіть телепортувати зазвичай нерухомих союзників, але в цих випадках його дальність дії зменшується вдвічі.
actors.hero.spells.beamingray.name=променя
actors.hero.spells.beamingray.no_space=Там немає місця для появи вашого союзника.
actors.hero.spells.beamingray.out_of_range=Це місце поза зоною досяжності.
actors.hero.spells.beamingray.short_desc=Телепортує вашого союзника та надає додаткову шкоду.
actors.hero.spells.blessspell.desc=Священнослужитель накладає святе благословення на себе або іншого персонажа, якого він бачить.\n\nПри застосуванні заклинання на себе ефект слабший, надаючи %1$d ходу благословення та %2$d бар'єр.\n\nПри застосуванні заклинання на інших персонажах воно потужніше, надаючи %3$d ходу благословення та %4$d зцілення. Надмірне зцілення перетворюється на бар'єр.
actors.hero.spells.blessspell.name=благословляти
actors.hero.spells.blessspell.short_desc=Благословляє та захищає Священнослужитель, благословляє та зцілює інших.
actors.hero.spells.bodyform$bodyformbuff.desc=Форма тіла Трініті наразі надає вам силу чарів або гліфа, ніби ви вже одягли його на свою поточну зброю чи броню.\n\nЗверніть увагу, що форма тіла не може надати іншу копію ефекту, від якого ви вже отримуєте користь.\n\nПоточний ефект: %1$s.\n\nХодів залишилося: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=форма тіла
actors.hero.spells.bodyform.desc=Клірик вибирає чари або гліфи, які він визначив у цьому пробігу, та накладає їхній ефект на Трійцю.\n\nКоли використовується Трійця, Клірик отримує ефект вибраних чарів або гліфів на ходи %d. Ці тимчасові чари або гліфи працюватимуть з будь-яким ефектом, що й звичайні чари або гліфи.\n\nЦе заклинання замінює будь-які інші ефекти тіла, яким наразі наділена Трійця.
actors.hero.spells.bodyform.name=форма тіла
actors.hero.spells.bodyform.short_desc=Призначає Трійцю чарам або гліфам.
actors.hero.spells.cleanse.desc=Клірик знімає всі шкідливі ефекти статусів з себе та видимих союзників. Після закінчення дії заклинання всі персонажі, на яких діє заклинання, також отримують ходи імунітету до негативних ефектів %1$d та бар'єр %2$d.
actors.hero.spells.cleanse.name=очищати
actors.hero.spells.cleanse.short_desc=Знімає негативні ефекти та надає захисний ефект.
actors.hero.spells.clericspell.charge_cost=Вартість плати: %d
actors.hero.spells.clericspell.invalid_enemy=Ви не можете цільно атакувати цього ворога.
actors.hero.spells.clericspell.invalid_target=Ви не можете орієнтуватися на це місце.
actors.hero.spells.clericspell.no_target=Там немає цілі.
actors.hero.spells.clericspell.prompt=Виберіть ціль
actors.hero.spells.divineintervention.desc=Клірик наділяє себе та союзників величезною силою зі свого фоліанта, підвищуючи рівень захисної дії кожного заклинання до %1$d та розширюючи його до рівня Вознесенної форми на ходи %2$d. Неймовірна захисна сила цього заклинання зважується його дуже високою вартістю заряду. \n\nЯк і інші захисні дії, що надаються Вознесенною формою, ці захисні дії не зникають зазвичай, а миттєво зникають після закінчення дії Вознесенної форми.
actors.hero.spells.divineintervention.name=божественне втручання
actors.hero.spells.divineintervention.short_desc=Значне посилення щита для клірика та союзників.
actors.hero.spells.divinesense$divinesensetracker.desc=Цей персонаж тимчасово здатний бачити інших істот поблизу за допомогою розуму!\n\nХодів залишилося: %s.
actors.hero.spells.divinesense$divinesensetracker.name=божественне відчуття
actors.hero.spells.divinesense.desc=Клірик зосереджує свої почуття на навколишньому середовищі, отримуючи розумовий зір з радіусом дії клітинок %d протягом 50 ходів. Це заклинання застосовується миттєво.
actors.hero.spells.divinesense.name=божественне відчуття
actors.hero.spells.divinesense.short_desc=Отримайте тимчасове бачення свідомості в широкому діапазоні.
actors.hero.spells.flash.desc=Клірик спрямовує свою вознесену форму в сусіднє місце та телепортується туди. Флеш може телепортувати Клірика в будь-яке виявлене місце, яке знаходиться в зоні досяжності та вільне. Це заклинання коштує більше зарядів фоліанту щоразу, коли його використовують у тій самій вознесеній формі.
actors.hero.spells.flash.name=спалах
actors.hero.spells.flash.prompt=Виберіть місцезнаходження
actors.hero.spells.flash.short_desc=Телепортуватися до найближчого місця.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Жрець зможе знову безкоштовно використовувати «Провідне світло» після 50 ходів. \n\nХодів залишилося: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Провідне світло
actors.hero.spells.guidinglight$illuminated.desc=Цей персонаж світиться внаслідок впливу дороговказного світла. Хоча світіння недостатньо сильне, щоб освітити навколишню область, магічний ефект значно полегшить завдання ударів по ньому для Клірика.
actors.hero.spells.guidinglight$illuminated.desc_generic=Інші герої все ще можуть використовувати підсвічування, щоб отримати користь від таланту пекучого світла, але не отримають жодного покращення точності.
actors.hero.spells.guidinglight$illuminated.desc_priest=Жрець може додатково споживати освітлення за допомогою сяйва, удару чарівною паличкою, удару союзника або ефектів деяких артефактів. Використання освітлення таким чином завдасть додаткової магічної шкоди, що дорівнює рівню Жреця + 5.
actors.hero.spells.guidinglight$illuminated.name=освітлений
actors.hero.spells.guidinglight.desc=Клірик випускає розряд магічної енергії, який вражає ціль, завдаючи 2-8 одиниць шкоди та освітлюючи її. Наступна необтяжена фізична атака, здійснена проти освітленого ворога, гарантовано вразить його.
actors.hero.spells.guidinglight.desc_priest=_Це заклинання потужніше, коли його застосовує Жрець._ Перше застосування заклинання кожні 50 ходів не вимагає зарядів фоліантів, а освітлення буде споживатися сяйвом, чарівними паличками, іншими персонажами та артефактами, які безпосередньо впливають на ворогів. Коли освітлення використовується таким чином, воно завдає додаткової магічної шкоди, що дорівнює рівню Жреця + 5.
actors.hero.spells.guidinglight.name=Провідне світло
actors.hero.spells.guidinglight.short_desc=Завдає магічної шкоди дистанційного бою та гарантує влучення.
actors.hero.spells.hallowedground$hallowedterrain.desc=Земля тут освячена. Освячена земля уповільнює ворогів, лікує союзників і сприяє поширенню трави.
actors.hero.spells.hallowedground.desc=Жрець зосереджує свою божественну магію на землі поблизу, створюючи %1$dx%1$d область освяченої місцевості на 20 ходів.\n\nПід час застосування це заклинання лікує всіх союзників на 15 здоров'я (здорові союзники та Жрець отримують щит), ненадовго принижує ворогів і поширює коротку траву.\n\nОсвященна місцевість лікує союзників на 1 здоров'я за хід (здорові союзники та Жрець отримують щит), калічить ворогів і випадковим чином викликає ріст високої трави.\n\nОсвященна місцевість знищується вогнем і утворює борознисту траву, якщо пасивні ефекти регенерації вимкнені або Жрець не отримував досвіду деякий час.
actors.hero.spells.hallowedground.name=священна земля
actors.hero.spells.hallowedground.prompt=Виберіть місцезнаходження
actors.hero.spells.hallowedground.short_desc=Лікує союзників, уповільнює ворогів та поширює траву в області дії.
actors.hero.spells.holyintuition.cursed=Ви відчуваєте зловісну магію, що ховається в цьому предметі.
actors.hero.spells.holyintuition.desc=Клірик зосереджує свої почуття на предметі та визначає, чи проклятий він, без необхідності його екіпірувати.
actors.hero.spells.holyintuition.name=свята інтуїція
actors.hero.spells.holyintuition.prompt=вибрати елемент
actors.hero.spells.holyintuition.short_desc=визначає, чи проклятий предмет, чи ні.
actors.hero.spells.holyintuition.uncursed=Цей предмет не містить зловісної магії.
actors.hero.spells.holylance$lancecooldown.desc=Священик нещодавно використав «Священний спис» і мусить зачекати, перш ніж використати його знову. \n\nХодів залишилося: %s.
actors.hero.spells.holylance$lancecooldown.name=час відновлення святого списа
actors.hero.spells.holylance.desc=Жрець концентрує велику кількість енергії у руйнівному кинутому списі, створеному зі світла. Цей спис завдає %1$d-%2$d шкоди та завжди завдає максимальної шкоди нежиті та демонічним цілям.\n\nЦе заклинання дуже дороге та має час відновлення 30 ходів.
actors.hero.spells.holylance.name=святий спис
actors.hero.spells.holylance.short_desc=Завдає значної магічної шкоди на дальньому бою.
actors.hero.spells.holyward$holyarmbuff.desc=Клірик наповнив їхні зношені обладунки святою енергією, тимчасово замінивши будь-який існуючий гліф і змусивши обладунки блокувати додаткове 1 очко шкоди. \n\nХодів залишилося: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Паладин наповнив свої зношені обладунки святою енергією, завдяки чому обладунки блокують додаткові 3 очки шкоди.\n\nНакладання інших заклинань під час активного святого оберега подовжить його тривалість на 10 ходів за кожен витрачений заряд.\n\nХодів залишилося: %s.
actors.hero.spells.holyward$holyarmbuff.name=святий прихід
actors.hero.spells.holyward.desc=Клірик наповнює свої зношені обладунки гліфами святого світла, збільшуючи блокування шкоди обладунками на 1. Це заклинання використовується миттєво. \n\nЦей гліф діє 50 ходів і замінює будь-який корисний гліф, який має обладунок, на час його дії. Клірик отримає користь від цього ефекту, навіть якщо у нього немає обладунків.
actors.hero.spells.holyward.desc_paladin=_Це заклинання потужніше, коли його застосовує Паладін._ Додаткове блокування шкоди збільшено до 3, заклинання більше не перезаписує існуючі гліфи, а застосування інших заклинань під час активного святого оберега подовжить його тривалість на 10 ходів за кожен використаний заряд.
actors.hero.spells.holyward.glyph_desc=Цей гліф трохи збільшує кількість пошкоджень, які може блокувати броня.
actors.hero.spells.holyward.glyph_name=%s світла
actors.hero.spells.holyward.name=святий прихід
actors.hero.spells.holyward.short_desc=Тимчасово замінює гліфи, щоб посилити блокування броні.
actors.hero.spells.holyweapon$holywepbuff.desc=Клірик наповнив свою зношену зброю святою енергією, тимчасово скасовуючи будь-які існуючі чари та змушуючи зброю завдавати додаткові 2 одиниці магічної шкоди за кожну атаку. \n\nХодів залишилося: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Паладин наповнив свою зношену зброю святою енергією, завдяки чому їхні атаки завдають додаткових 6 одиниць магічної шкоди.\n\nВикористання інших заклинань, поки свята зброя активна, подовжить її тривалість на 10 ходів за кожен витрачений заряд.\n\nХодів залишилося: %s.
actors.hero.spells.holyweapon$holywepbuff.name=священна зброя
actors.hero.spells.holyweapon.desc=Клірик зачаровує свою зношену зброю святою енергією, змушуючи її завдавати додаткові 2 одиниці магічної шкоди щоразу, коли вона вражає нею ворога. Це заклинання використовується миттєво. \n\nЦе заклинання триває 50 ходів і скасовує будь-які корисні заклинання, які має зброя, на час його дії. Удари без зброї також можуть отримати користь від цього ефекту.
actors.hero.spells.holyweapon.desc_paladin=_Це заклинання потужніше, коли його застосовує Паладін._ Додаткова магічна шкода збільшена до 6, заклинання більше не скасовує існуючі чари, а застосування інших заклинань під час активної священної зброї подовжить її тривалість на 10 ходів за кожен використаний заряд.
actors.hero.spells.holyweapon.ench_desc=Вороги, уражені священною зброєю, отримають додаткову магічну шкоду.
actors.hero.spells.holyweapon.ench_name=святий %s
actors.hero.spells.holyweapon.name=священна зброя
actors.hero.spells.holyweapon.short_desc=Тимчасово скасовує чари, щоб збільшити шкоду.
actors.hero.spells.judgement.desc=Клірик б'є кулаком по землі, викликаючи спалах світла, який завдає шкоди всім ворогам, яких він може побачити. Це завдає %1$d-%2$d базової шкоди, але також завдає додаткових 33%% шкоди за кожне заклинання, яке Клірик застосував з моменту прийняття форми вознесіння (або з моменту останнього застосування Правосуддя).\n\nНаразі Правосуддя завдає шкоди %3$d-%4$d.
actors.hero.spells.judgement.name=судження
actors.hero.spells.judgement.short_desc=Завдає шкоди всім видимим ворогам.
actors.hero.spells.layonhands.desc=Паладин передає святу енергію через свої руки, зцілюючи або захищаючи все, до чого торкається.\n\nПаладин може застосувати це заклинання до будь-якого сусіднього персонажа, щоб дати йому %1$d зцілення, або до себе, щоб отримати %1$d екранування. Надмірне зцілення від цього заклинання перетворюється на екранування.\n\nЦе заклинання застосовується миттєво та може бути використане повторно, але не може дати більше трьох циклів екранування одночасно.
actors.hero.spells.layonhands.name=покласти на руки
actors.hero.spells.layonhands.short_desc=Миттєво лікує сусіднього персонажа або накриває паладина щитом.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Клірик нещодавно застосував «Посилання життя» до цього союзника.\n\nОкрім звичайних переваг «Посилання життя», цей персонаж також отримує менше шкоди, будь-які позитивні заклинання Клірика застосовуються як до Клірика, так і до цього союзника, а не лише до одного, а «Сила багатьох» не закінчується, поки активний цей бафф.\n\nХодів залишилося: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=захист життєвого зв'язку
actors.hero.spells.lifelinkspell.desc=Клірик зміцнює зв'язок між собою та своїм посиленим союзником. Завдяки цьому посиленому зв'язку будь-яка отримана шкода буде розподілятися між героєм та його союзником протягом ходів %1$d, а посилення захисту від Сили Багато буде збільшено до -%2$d%% отриманої шкоди. Зверніть увагу, що шкода розподіляється після броні, але до зменшення шкоди від Сили Багато.\n\nПоки цей ефект активний, корисні заклинання Клірика рівня T3 або нижче будуть застосовуватися як до Клірика, так і до його союзника, якби вони щойно застосували їх до одного з них.
actors.hero.spells.lifelinkspell.name=життєвий зв'язок
actors.hero.spells.lifelinkspell.short_desc=Розподіляє шкоду з союзником та зменшує отриману ним шкоду.
actors.hero.spells.mindform.desc=Клірик вибирає чарівну паличку або метну зброю, яку він ідентифікував під час цього пробігу, і наділяє Трійцю її ефектом.\n\nКоли використовується Трійця, Клірик може здійснити одну атаку, ніби він використовує вибраний предмет за адресою +%d. Це активує всі ефекти, які зазвичай спрацьовують при використанні цього типу предмета.\n\nЦе заклинання замінює будь-який інший ефект розуму, яким наразі наділена Трійця.
actors.hero.spells.mindform.name=форма розуму
actors.hero.spells.mindform.short_desc=Призначає Трійцю чарівній паличці або кидковій зброї.
actors.hero.spells.mnemonicprayer.desc=Жрець вимовляє молитву, яка продовжує тривалість усіх посилень або відлякувань на певній цілі на ходи %1$d. Це заклинання не потребує часу для його застосування. Позитивні ефекти триватимуть довше на союзниках (включаючи самого Жреця), а шкідливі ефекти триватимуть довше на ворогах. \n\nМнемонічна молитва може продовжити дію певного посилення або відлякування лише один раз і не може продовжити посилення, надані від здібностей броні.
actors.hero.spells.mnemonicprayer.name=мнемонічна молитва
actors.hero.spells.mnemonicprayer.short_desc=Подовжує дію бафів/знижуючих ефектів на союзника/ворога та повторно застосовує підсвічування.
actors.hero.spells.radiance.desc=Жрець спалахує святим світлом, приголомшуючи всіх видимих ворогів на 3 ходи. Якщо ворог вже освітлений, Сяйво активує додаткову шкоду від освітлення, а потім застосує негативний ефект освітлення. Сяйво також змусить Жреця світитися протягом 100 ходів, якщо поточний поверх темний.
actors.hero.spells.radiance.name=сяйво
actors.hero.spells.radiance.short_desc=Освітлює та ненадовго приголомшує видимих ворогів.
actors.hero.spells.recallinscription$useditemtracker.desc=Клірик нещодавно використав предмет, який працює із заклинанням відкликання з написом. Клірик може застосувати заклинання, щоб повторити ефект предмета. \n\nВикористаний предмет: %1$s.\n\nХодів залишилося: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=нещодавно використана руна
actors.hero.spells.recallinscription.desc=Клірик використовує священну магію, щоб повторно використати ефект магічної руни, знайденої на рунічному камені або сувої, який він використовував в останні ходи %s. \n\nНапис Відкликання не можна використовувати для копіювання сувоїв покращення. Вартість заряду цього заклинання залежить від того, який предмет використовувався нещодавно: 2 за рунічний камінь, 3 за сувій, 4 за екзотичний сувій. Ця вартість заряду також подвоюється при копіюванні сувою трансмутації або алхімічних предметів, які необхідно створити за допомогою трансмутації або покращення.
actors.hero.spells.recallinscription.name=напис про відкликання
actors.hero.spells.recallinscription.short_desc=Повторює нещодавно використаний рунічний камінь або сувій.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Між цим персонажем та ворогом стоїть тонкий щит світла. Він недостатньо сильний, щоб повністю блокувати атаки, але пом'якшить їх. \n\nХодів залишилося: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=щит світла
actors.hero.spells.shieldoflight.desc=Клірик створює тонкий світловий бар'єр між собою та ворогом, збільшуючи силу блокування своєї броні проти цього ворога на %1$d-%2$d протягом 5 ходів. \n\nЦе заклинання застосовується миттєво, але його не можна використовувати проти кількох цілей одночасно.
actors.hero.spells.shieldoflight.name=щит світла
actors.hero.spells.shieldoflight.short_desc=Надає тимчасову броню проти цілі.
actors.hero.spells.smite.desc=Паладин наповнює удар ближнього бою праведною руйнівною силою.\n\nОкрім завдання звичайної шкоди в ближньому бою, Smite гарантовано виконує необтяжені атаки, має силу зачарувань +300%% та завдає %1$d - %2$d бонусної магічної шкоди.\n\nБонусна магічна шкода Smite залежить від рівня Паладина, і він завжди завдає максимальну бонусну магічну шкоду нежиті або демонічним ворогам.
actors.hero.spells.smite.name=вразити
actors.hero.spells.smite.short_desc=Гарантує удар з додатковою шкодою та силою чарів.
actors.hero.spells.spiritform$spiritformbuff.desc=Духовна форма Трійці зараз надає вам силу предмета, ніби ви його екіпірували.\n\nЗверніть увагу, що духівна форма не може надати іншу копію ефекту, від якого ви вже отримуєте користь.\n\nПоточний ефект: %1$s.\n\nХодів залишилося: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=духовна форма
actors.hero.spells.spiritform.desc=Клірик вибирає кільце або артефакт, який він ідентифікував у цьому пробігу (крім священного тому), і наділяє Трійцю його ефектом.\n\nЯкщо вибрано кільце, то Трійця надає ефект цього кільця з коефіцієнтом +%1$d на 20 ходів.\n\nЯкщо вибрано артефакт, то Трійця повторює ефект цього артефакту з коефіцієнтом +%2$d. Кожен артефакт має різні специфічні поведінки та вартість заряду броні при використанні з Трійцею.\n\nЦе заклинання замінює будь-який інший ефект духу, яким наразі наділена Трійця.
actors.hero.spells.spiritform.name=духовна форма
actors.hero.spells.spiritform.short_desc=Призначає Трійцю кільцю або артефакту.
actors.hero.spells.stasis$stasisbuff.desc=Клірик наразі має союзника, що зберігається в стазисі. Усі позитивні ефекти на цього союзника зберігаються, включаючи Силу багатьох, і вони знову з'являться поруч із Кліриком, коли ефект закінчиться. Ефект також можна достроково завершити, повторно розігравши Стазис.\n\nСпівробітник у стазисі: %1$s.\nХодів залишилося: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Ваш нерухомий союзник залишився позаду.
actors.hero.spells.stasis$stasisbuff.name=союзник у стазисі
actors.hero.spells.stasis.desc=Клірик зосереджує свій зв'язок зі своїм союзником на собі, змушуючи союзника тимчасово утримуватися в своєрідному енергетичному стазисі всередині Клірика. Союзник буде збережений на час ходів до %d, причому всі позитивні ефекти на нього не змінюватимуться часом перебування в стазисі.\n\nСоюзник з'явиться поруч із Кліриком, коли стазис закінчиться природним шляхом, або він може миттєво повторити заклинання безкоштовно, щоб передчасно завершити ефект. Стазис може навіть переміщати нерухомих союзників, але не може переміщувати їх між поверхами.
actors.hero.spells.stasis.name=стаз
actors.hero.spells.stasis.short_desc=Виводить союзника з підземелля та зберігає його.
actors.hero.spells.sunray.desc=Клірик випускає промінь сліпучого світла в ціль, завдаючи %1$d-%2$d шкоди та засліплюючи її на %3$d ходи. Сонячний промінь завжди завдає максимальної шкоди нежиті та демонічним цілям.\n\nПісля удару цим заклинанням зір ворога регулюється, запобігаючи повторному засліпленню. Однак, якщо його вразити знову, будучи засліпленим цим заклинанням, то світло є приголомшливим і паралізує його.
actors.hero.spells.sunray.name=сонячний промінь
actors.hero.spells.sunray.short_desc=Завдає магічної шкоди дальньої дії та засліплює ціль один раз.
actors.hero.spells.walloflight$lightwall.desc=Мерехтливі панелі світла блокують тут прохід.
actors.hero.spells.walloflight.desc=Паладин створює стіну з панелей суцільного світла прямо перед собою, яка має товщину 1 плитку, ширину %1$d плитки та триває 20 ходів.\n\nЦя стіна діє як звичайна, за винятком того, що її можна бачити крізь неї. Вороги, які застрягли в стіні під час її створення, будуть на мить приголомшені та відштовхнуті назад, якщо це можливо. Все, що застрягне в стіні, зможе з неї вибратися.\n\nСтіну можна застосувати в будь-якому з чотирьох основних або чотирьох діагональних напрямків. Якщо стіна вже активна, заклинання можна безкоштовно повторно використати, щоб миттєво очистити стіну.
actors.hero.spells.walloflight.early_end=Ти розсіюєш стіну світла.
actors.hero.spells.walloflight.name=стіна світла
actors.hero.spells.walloflight.short_desc=Створює стіну, яка блокує ворогів.
actors.hero.talent$aggressivebarriercooldown.desc=Ви нещодавно використовували цей талант і повинні зачекати, перш ніж використовувати його знову. \n\nХодів залишилося: %s.
actors.hero.talent$aggressivebarriercooldown.name=час відновлення агресивного бар'єру
actors.hero.talent$combinedlethalityabilitytracker.executed=виконано
actors.hero.talent$deadlyfollowuptracker.desc=Дуелянтка нещодавно атакувала ворога метальною зброєю, її атаки ближнього бою проти тієї ж цілі матимуть збільшену шкоду. \n\nХодів залишилося: %s.
actors.hero.talent$deadlyfollowuptracker.name=смертельне продовження
actors.hero.talent$followupstriketracker.desc=Мисливиця нещодавно атакувала ворога метальною зброєю, її наступна атака ближнього бою проти тієї ж цілі матиме збільшену шкоду. \n\nХодів залишилося: %s.
actors.hero.talent$followupstriketracker.name=повторний страйк
actors.hero.talent$improvisedprojectilecooldown.desc=Ви нещодавно використовували цей талант і повинні зачекати, перш ніж використовувати його знову. \n\nХодів залишилося: %s.
actors.hero.talent$improvisedprojectilecooldown.name=час відновлення імпровізованих снарядів
actors.hero.talent$lethalhastecooldown.desc=Ви нещодавно використовували цей талант і повинні зачекати, перш ніж використовувати його знову. \n\nХодів залишилося: %s.
actors.hero.talent$lethalhastecooldown.name=час відновлення смертельної швидкості
actors.hero.talent$lingeringmagictracker.desc=Маг нещодавно використав посох або палицю, його наступна фізична атака завдасть додаткової шкоди. \n\nХодів залишилося: %s.
actors.hero.talent$lingeringmagictracker.name=затяжна магія
actors.hero.talent$liquidagilacctracker.desc=Наступна звичайна атака ближнього бою Дуелянта отримає бонус до точності. \n\nХодів залишилося: %s.
actors.hero.talent$liquidagilacctracker.name=спритність рідини
actors.hero.talent$patientstriketracker.desc=Дуелянтка щойно провела хід в очікуванні, її наступна атака ближнього бою завдасть додаткової шкоди.
actors.hero.talent$patientstriketracker.name=страйк пацієнтів
actors.hero.talent$preciseassaulttracker.desc=Наступна звичайна атака ближнього бою Дуелянта отримає бонус до точності. \n\nХодів залишилося: %s.
actors.hero.talent$preciseassaulttracker.name=точний напад
actors.hero.talent$provokedangertracker.desc=Воїн нещодавно втратив свій щит, його наступна фізична атака завдасть додаткової шкоди. \n\nХодів залишилося: %s.
actors.hero.talent$provokedangertracker.name=викликав гнів
actors.hero.talent$rejuvenatingstepscooldown.desc=Ви нещодавно використовували цей талант і повинні зачекати, перш ніж використовувати його знову. \n\nХодів залишилося: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=етапи омолодження, час відновлення
actors.hero.talent$satiatedspellstracker.desc=Наступне заклинання, яке накладе Клірик, надасть йому невеликий рівень захисту.
actors.hero.talent$satiatedspellstracker.name=Захисне заклинання
actors.hero.talent$searinglightcooldown.desc=Ви нещодавно використовували цей талант і повинні зачекати, перш ніж використовувати його знову. \n\nХодів залишилося: %s.
actors.hero.talent$searinglightcooldown.name=Палюче світло
actors.hero.talent$seershotcooldown.desc=Ви нещодавно використовували цей талант і повинні зачекати, перш ніж використовувати його знову. \n\nХодів залишилося: %s.
actors.hero.talent$seershotcooldown.name=час відновлення пострілу провидця
actors.hero.talent$swiftequipcooldown.desc=Ви нещодавно використовували цей талант і повинні зачекати, перш ніж використовувати його знову. \n\nХодів залишилося: %s.
actors.hero.talent$swiftequipcooldown.name=швидке перезаряджання екіпірування
actors.hero.talent.adventurers_intuition.desc=_+1:_ Дуелянтка розпізнає зброю _2,5 рази швидше_ та броню _1,75 раза швидше_.\n\n_+2:_ Дуелянтка розпізнає зброю _коли вона її екіпірує_ та броню _2,5 рази швидше_.
actors.hero.talent.adventurers_intuition.title=інтуїція шукача пригод
actors.hero.talent.aggressive_barrier.desc=_+1:_ Дуелянт отримує _3 одиниці захисту_, коли використовує здатність зі зброєю та має здоров'я 50% або менше.\n\n_+2:_ Дуелянт отримує _5 одиниць захисту_, коли використовує здатність зі зброєю та має здоров'я 50% або менше.
actors.hero.talent.aggressive_barrier.meta_desc=_Якщо цей талант отримує інший герой_, він натомість надаватиме щит під час атаки ближнього бою з низьким рівнем здоров'я, з часом відновлення 50 ходів.
actors.hero.talent.aggressive_barrier.title=агресивний бар'єр
actors.hero.talent.ally_warp.desc=_+1:_ Маг може вибрати союзника, щоб миттєво помінятися з ним місцями, з радіусом дії _2 плитки_.\n\n_+2:_ Маг може вибрати союзника, щоб миттєво помінятися з ним місцями, з радіусом дії _4 плитки_.\n\n_+3:_ Маг може вибрати союзника, щоб миттєво помінятися з ним місцями, з радіусом дії _6 плиток_.\n\nМаг не може мінятися місцями з нерухомими союзниками.
actors.hero.talent.ally_warp.title=союзник варп
actors.hero.talent.arcane_vision.desc=_+1:_ Коли Маг вражає ворога струмом, він отримує зір розуму на нього на _10 ходів_.\n\n_+2:_ Коли Маг вражає ворога струмом, він отримує зір розуму на нього на _15 ходів_.
actors.hero.talent.arcane_vision.title=таємниче бачення
actors.hero.talent.assassins_reach.desc=_+1:_ Дальність моргання Асасина за рівень підготовки збільшено до _1/3/4/6 плиток_, замість 1/2/3/4.\n\n_+2:_ Дальність моргання Асасина за рівень підготовки збільшено до _2/4/6/8 плиток_, замість 1/2/3/4.\n\n_+3:_ Дальність моргання Асасина за рівень підготовки збільшено до _2/5/7/10 плиток_, замість 1/2/3/4.\n\nЦе моргання може проходити крізь перешкоди та ворогів, але не крізь тверду місцевість, таку як стіни.
actors.hero.talent.assassins_reach.title=досяжність вбивці
actors.hero.talent.aura_of_protection.desc=_+1:_ Паладин може застосувати _Ауру Захисту_, заклинання, яке надає Паладину та всім союзникам у межах 2 клітинок _20% опору урону_ та ефект гліфа броні Паладина _+50% сили_ протягом 20 ходів, ціною 2 зарядів.\n\n_+2:_ Паладин може застосувати _Ауру Захисту_, заклинання, яке надає Паладину та всім союзникам у межах 2 клітинок _30% опору урону_ та ефект гліфа броні Паладина _+75% сили_ протягом 20 ходів, ціною 2 зарядів.\n\n_+3:_ Паладин може застосувати _Ауру Захисту_, заклинання, яке надає Паладину та всім союзникам у межах 2 клітинок _40% опору урону_ та ефект гліфа броні Паладина _+100% сили_ протягом 20 ходів, ціною 2 зарядів.
actors.hero.talent.aura_of_protection.title=аура захисту
actors.hero.talent.backup_barrier.desc=_+1:_ Маг отримує _3 одиниці захисту_ щоразу, коли витрачає останній заряд свого посоха.\n\n_+2:_ Маг отримує _5 одиниць захисту_ щоразу, коли витрачає останній заряд свого посоха.
actors.hero.talent.backup_barrier.meta_desc=_Якщо цей талант отримує інший герой_, він спрацює від чарівної палички найвищого рівня героя.
actors.hero.talent.backup_barrier.title=резервний бар'єр
actors.hero.talent.barkskin.desc=_+1:_ Наступаючи на траву, Вартовий отримує _0-50% свого рівня_ у броні з кори, яка зникає з кожним ходом.\n\n_+2:_ Наступаючи на траву, Вартовий отримує _0-100% свого рівня_ у броні з кори, яка зникає з кожним ходом.\n\n_+3:_ Наступаючи на траву, Вартовий отримує _0-150% свого рівня_ у броні з кори, яка зникає з кожним ходом.
actors.hero.talent.barkskin.title=кора
actors.hero.talent.beaming_ray.desc=Клірик може застосувати _Промінь_ від удосконаленого союзника за 1 заряд. Цей промінь може проходити крізь стіни та телепортувати союзника до певного місця. Якщо у цьому місці є ворог, союзник з'являється поруч із ворогом і вибирає його ціллю. Промінь-промінь може навіть телепортувати зазвичай нерухомих союзників, але при цьому має половинну дальність дії.\n\n_+1:_ Промінь-промінь має максимальну дальність дії _4 клітинки,_ та збільшує бонус «Сили багатьох» до _+35% шкоди_ проти найближчого ворога протягом 10 ходів.\n\n_+2:_ Промінь-промінь має максимальну дальність дії _8 клітинок,_ та збільшує бонус «Сили багатьох» до _+40% шкоди_ проти найближчого ворога протягом 10 ходів.\n\n_+3:_ Промінь-промінь має максимальну дальність дії _12 клітинок,_ та збільшує бонус «Сили багатьох» до _+45% шкоди_ проти найближчого ворога протягом 10 ходів.\n\n_+4:_ Промінь-промінь має максимальну дальність дії _16 клітинок,_ та збільшує Бонус від "Сили багатьох" до _+50% шкоди_ проти найближчого ворога протягом 10 ходів.
actors.hero.talent.beaming_ray.title=променя
actors.hero.talent.blast_radius.desc=_+1:_ Радіус елементарного вибуху збільшено до _5 плиток_, замість 4.\n\n_+2:_ Радіус елементарного вибуху збільшено до _6 плиток_, замість 4.\n\n_+3:_ Радіус елементарного вибуху збільшено до _7 плиток_, замість 4.\n\n_+4:_ Радіус елементарного вибуху збільшено до _8 плиток_, замість 4.
actors.hero.talent.blast_radius.title=радіус вибуху
actors.hero.talent.bless.desc=_+1:_ Клірик може застосувати _Благословення_, заклинання, яке дає _6 ходів благословення та 10 одиниць захисту_ при застосуванні на себе або _10 ходів благословення та 10 одиниць зцілення_ при застосуванні на іншого персонажа, ціною 1 заряду.\n\n_+2:_ Клірик може застосувати _Благословення_, заклинання, яке дає _10 ходів благословення та 15 одиниць захисту_ при застосуванні на себе або _15 ходів благословення та 15 одиниць зцілення_ при застосуванні на іншого персонажа, ціною 1 заряду.\n\nНадмірне зцілення від цього заклинання перетворюється на захист.
actors.hero.talent.bless.meta_desc=_Якщо цей талант отримує інший герой_, він натомість збільшить точність та ухилення для героя та всіх союзників на 3% при +1 або на 5% при +2.
actors.hero.talent.bless.title=благословляти
actors.hero.talent.body_form.desc=Клірик може застосувати _Форму тіла_, яка наділяє Трійцю силою чарів або гліфа, які Клірик визначив у цьому заході, ціною 2 зарядів. \n\n_+1:_ Коли використовується Трійця, Клірик отримує вибраний ефект на _20 ходів._\n\n_+2:_ Коли використовується Трійця, Клірик отримує вибраний ефект на _27 ходів._\n\n_+3:_ Коли використовується Трійця, Клірик отримує вибраний ефект на _33 ходи._\n\n_+4:_ Коли використовується Трійця, Клірик отримує вибраний ефект на _40 ходів._\n\nТрієць можна наділити лише одним ефектом тіла за раз. Вартість заряду броні Трійці вища, якщо обраний гліф рідкісний та потужний.
actors.hero.talent.body_form.title=форма тіла
actors.hero.talent.body_replacement.desc=_+1:_ Після моргання Розбійник залишає дерев'яну приманку, яка має _20 здоров'я та 1-3 броні_.\n\n_+2:_ Після моргання Розбійник залишає дерев'яну приманку, яка має _40 здоров'я та 2-6 броні_.\n\n_+3:_ Після моргання Розбійник залишає дерев'яну приманку, яка має _60 здоров'я та 3-9 броні_.\n\n_+4:_ Після моргання Розбійник залишає дерев'яну приманку, яка має _80 здоров'я та 4-12 броні_.\n\nОдночасно може бути активною лише одна приманка.
actors.hero.talent.body_replacement.title=заміна тіла
actors.hero.talent.body_slam.desc=_+1:_ Коли Воїн приземляється після стрибка, усі сусідні вороги отримують шкоду, що дорівнює _1-4 плюс 25%_ його сили блокування шкоди.\n\n_+2:_ Коли Воїн приземляється після стрибка, усі сусідні вороги отримують шкоду, що дорівнює _2-8 плюс 50%_ його сили блокування шкоди.\n\n_+3:_ Коли Воїн приземляється після стрибка, усі сусідні вороги отримують шкоду, що дорівнює _3-12 плюс 75%_ його сили блокування шкоди.\n\n_+4:_ Коли Воїн приземляється після стрибка, усі сусідні вороги отримують шкоду, що дорівнює _4-16 плюс 100%_ його сили блокування шкоди.
actors.hero.talent.body_slam.title=боді-слем
actors.hero.talent.bounty_hunter.desc=_+1:_ Коли Асасин вбиває ворога підготовленим ударом, його шанс випадіння предмета збільшується на _2/4/8/16%_, за рівень підготовки.\n\n_+2:_ Коли Асасин вбиває ворога підготовленим ударом, його шанс випадіння предмета збільшується на _4/8/16/32%_, за рівень підготовки.\n\n_+3:_ Коли Асасин вбиває ворога підготовленим ударом, його шанс випадіння предмета збільшується на _6/12/24/48%_, за рівень підготовки.
actors.hero.talent.bounty_hunter.title=мисливець за головами
actors.hero.talent.cached_rations.desc=_+1:_ Розбійник може знайти _2 пайки припасів_, розміщені у скринях, поки досліджує наступні кілька поверхів підземелля.\n\n_+2:_ Розбійник може знайти _3 пайки припасів_, розміщені у скринях, поки досліджує наступні кілька поверхів підземелля.\n\nПайки припасів швидко з'їдаються, відновлюють помірну ситість, лікують 5 здоров'я та відновлюють 1 заряд плаща тіней.
actors.hero.talent.cached_rations.title=кешовані пайки
actors.hero.talent.cleanse.desc=_+1:_ Клірик може застосувати _Очищення_, заклинання, яке _знімає негативні ефекти статусу_ з Клірика та будь-яких союзників поблизу, і надає їм _10 екранування_, ціною 2 зарядів.\n\n_+2:_ Клірик може застосувати _Очищення_, заклинання, яке _надає 3 ходи імунітету до негативного статусу_ Клірику та будь-яким союзникам поблизу, і надає їм _20 екранування_, ціною 2 зарядів.\n\n_+3:_ Клірик може застосувати _Очищення_, заклинання, яке _надає 5 ходів імунітету до негативного статусу_ Клірику та будь-яким союзникам поблизу, і надає їм _30 екранування_, ціною 2 зарядів.
actors.hero.talent.cleanse.meta_desc=_Якщо цей талант отримує інший герой_, він натомість очищатиме негативні ефекти статусу на герої після використання чарівної палички або артефакту, у 10/20/30% випадків зі значенням +1/+2/+3.
actors.hero.talent.cleanse.title=очищати
actors.hero.talent.cleave.desc=_+1:_ Додатковий час, який Гладіатор отримує на вбивство, збільшено до _30 ходів_, замість 15.\n\n_+2:_ Додатковий час, який Гладіатор отримує на вбивство, збільшено до _45 ходів_, замість 15.\n\n_+3:_ Додатковий час, який Гладіатор отримує на вбивство, збільшено до _60 ходів_, замість 15.
actors.hero.talent.cleave.title=розщеплювати
actors.hero.talent.cloned_armor.desc=_+1:_ Тіньовий клон отримує _12%_ значення броні героя та має _25% шанс_ використати гліф на броні героя.\n\n_+2:_ Тіньовий клон отримує _24%_ значення броні героя та має _50% шанс_ використати гліф на броні героя.\n\n_+3:_ Тіньовий клон отримує _36%_ значення броні героя та має _75% шанс_ використати гліф на броні героя.\n\n_+4:_ Тіньовий клон отримує _48%_ значення броні героя та має _100% шанс_ використати гліф на броні героя.
actors.hero.talent.cloned_armor.title=клонована броня
actors.hero.talent.close_the_gap.desc=_+1:_ Дуелянт моргає _на дві плитки_ у напрямку своєї цілі, починаючи дуель.\n\n_+2:_ Дуелянт моргає _на три плитки_ у напрямку своєї цілі, починаючи дуель.\n\n_+3:_ Дуелянт моргає _на чотири плитки_ у напрямку своєї цілі, починаючи дуель.\n\n_+4:_ Дуелянт моргає _на п'ять плиток_ у напрямку своєї цілі, починаючи дуель.\n\nЦе моргання може проходити крізь перешкоди та ворогів, але не крізь тверду місцевість, таку як стіни. Моргання враховується при визначенні, чи знаходиться ворог у зоні досяжності для виклику.
actors.hero.talent.close_the_gap.title=скоротити розрив
actors.hero.talent.combined_energy.desc=_+1:_ Якщо чернець використовує здатність зброї та здатність _4+ енергії_ протягом 5 ходів одна від одної, він відновлює 1 витрачену енергію.\n\n_+2:_ Якщо чернець використовує здатність зброї та здатність _3+ енергії_ протягом 5 ходів одна від одної, він відновлює 1 витрачену енергію.\n\n_+3:_ Якщо чернець використовує здатність зброї та здатність _2+ енергії_ протягом 5 ходів одна від одної, він відновлює 1 витрачену енергію.
actors.hero.talent.combined_energy.title=комбінована енергія
actors.hero.talent.combined_lethality.desc=_+1:_ Якщо Чемпіон атакує зброєю ближнього бою одразу після використання здатності іншої зброї, ця атака стратить будь-якого ворога, який не є босом, у якого залишилося _нижче 13% HP_.\n\n_+2:_ Якщо Чемпіон атакує зброєю ближнього бою одразу після використання здатності іншої зброї, ця атака стратить будь-якого ворога, який не є босом, у якого залишилося _нижче 27% HP_.\n\n_+3:_ Якщо Чемпіон атакує зброєю ближнього бою одразу після використання здатності іншої зброї, ця атака стратить будь-якого ворога, який не є босом, у якого залишилося _нижче 40% HP_.\n\nЦя атака може бути звичайною атакою зброєю ближнього бою або частиною здатності зброї.
actors.hero.talent.combined_lethality.title=комбінована летальність
actors.hero.talent.conserved_magic.desc=_+1:_ Кожен удар дикої магії тепер використовує _0,33 заряду_ замість 0,5, а дика магія має _25% шанс_ не витратити хід.\n\n_+2:_ Кожен удар дикої магії тепер використовує _0,225 заряду_ замість 0,5, а дика магія має _50% шанс_ не витратити хід.\n\n_+3:_ Кожен удар дикої магії тепер використовує _0,15 заряду_ замість 0,5, а дика магія має _75% шанс_ не витратити хід.\n\n_+4:_ Кожен удар дикої магії тепер використовує _0,1 заряду_ замість 0,5, а дика магія має _100% шанс_ не витратити хід.
actors.hero.talent.conserved_magic.title=збережена магія
actors.hero.talent.counter_ability.desc=_+1:_ Якщо Дуелянт використовує здатність зброї протягом 3 ходів після атаки на його залишкове зображення, він миттєво відновить _0,38 зарядів_.\n\n_+2:_ Якщо Дуелянт використовує здатність зброї протягом 3 ходів після атаки на його залишкове зображення, він миттєво відновить _0,77 зарядів_.\n\n_+3:_ Якщо Дуелянт використовує здатність зброї протягом 3 ходів після атаки на його залишкове зображення, він миттєво відновить _1,13 зарядів_.\n\n_+4:_ Якщо Дуелянт використовує здатність зброї протягом 3 ходів після атаки на його залишкове зображення, він миттєво відновить _1,5 зарядів_.
actors.hero.talent.counter_ability.title=здатність до протидії
actors.hero.talent.deadly_followup.desc=_+1:_ Коли Дуелянт вражає ворога кидковою зброєю, вона завдає йому _на 10% більше шкоди в ближньому бою_ протягом 5 ходів.\n\n_+2:_ Коли Дуелянт вражає ворога кидковою зброєю, вона завдає йому _на 20% більше шкоди в ближньому бою_ протягом 5 ходів.\n\n_+3:_ Коли Дуелянт вражає ворога кидковою зброєю, вона завдає йому _на 30% більше шкоди в ближньому бою_ протягом 5 ходів.
actors.hero.talent.deadly_followup.title=смертельне продовження
actors.hero.talent.deathless_fury.desc=_+1:_ Берсерк автоматично спрацьовує, якщо Берсерк ось-ось помре, а лють становить 100% або вище, але його час відновлення становить _3 рівні героя_.\n\n_+2:_ Берсерк автоматично спрацьовує, якщо Берсерк ось-ось помре, а лють становить 100% або вище, але його час відновлення становить _2 рівні героя_.\n\n_+3:_ Берсерк автоматично спрацьовує, якщо Берсерк ось-ось помре, а лють становить 100% або вище, але його час відновлення становить _1 рівень героя_.\n\nЗверніть увагу, що Берсерк все одно помре, якщо у нього 0 HP, коли закінчується берсеркування.
actors.hero.talent.deathless_fury.title=безсмертна лють
actors.hero.talent.deathly_durability.desc=_+1:_ Вороги, вбиті міткою смерті, дають екран Розбійника, що дорівнює _13%_ їхнього здоров'я, коли вони були позначені.\n\n_+2:_ Вороги, вбиті міткою смерті, дають екран Розбійника, що дорівнює _25%_ їхнього здоров'я, коли вони були позначені.\n\n_+3:_ Вороги, вбиті міткою смерті, дають екран Розбійника, що дорівнює _38%_ їхнього здоров'я, коли вони були позначені.\n\n_+4:_ Вороги, вбиті міткою смерті, дають екран Розбійника, що дорівнює _50%_ їхнього здоров'я, коли вони були позначені.
actors.hero.talent.deathly_durability.title=смертельна стійкість
actors.hero.talent.desperate_power.desc=_+1:_ Палички та посох Мага отримують _+1 рівень_ під час останнього удару, коли у них залишається останній заряд.\n\n_+2:_ Палички та посох Мага отримують _+2 рівні_ під час останнього удару, коли у них залишається останній заряд.\n\n_+3:_ Палички та посох Мага отримують _+3 рівні_ під час останнього удару, коли у них залишається останній заряд.
actors.hero.talent.desperate_power.title=відчайдушна сила
actors.hero.talent.directed_power.desc=_+1:_ Пряма атака від стихійного удару отримує _+30% сили зачарування_ для кожного ворога в радіусі дії стихійного удару, включаючи ціль атаки.\n\n_+2:_ Пряма атака від стихійного удару отримує _+60% сили зачарування_ для кожного ворога в радіусі дії стихійного удару, включаючи ціль атаки.\n\n_+3:_ Пряма атака від стихійного удару отримує _+90% сили зачарування_ для кожного ворога в радіусі дії стихійного удару, включаючи ціль атаки.\n\n_+4:_ Пряма атака від стихійного удару отримує _+120% сили зачарування_ для кожного ворога в радіусі дії стихійного удару, включаючи ціль атаки.
actors.hero.talent.directed_power.title=спрямована потужність
actors.hero.talent.divine_intervention.desc=_+1:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Божественне Втручання_, яке підсилює захист Клірика та всіх союзників до _150_ та подовжує Вознесену форму на _3 ходи._\n\n_+2:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Божественне Втручання_, яке підсилює захист Клірика та всіх союзників до _200_ та подовжує Вознесену форму на _4 ходи._\n\n_+3:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Божественне Втручання_, яке підсилює захист Клірика та всіх союзників до _250_ та подовжує Вознесену форму на _5 ходів._\n\n_+4:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Божественне Втручання_, що підсилює захист Клірика та всіх союзників до _300_ та подовжує Вознесену форму на _6 ходів._\n\nБожественне втручання коштує колосальних 5 зарядів тому та може бути використане лише один раз в одній Вознесеній формі.
actors.hero.talent.divine_intervention.title=божественне втручання
actors.hero.talent.divine_sense.desc=_+1:_ Клірик може застосувати _Божественне Відчуття_, заклинання, яке надає йому _8 плиток_ Бачення Розуму на 50 ходів і не потребує часу для застосування, ціною 2 зарядів.\n\n_+2:_ Клірик може застосувати _Божественне Відчуття_, заклинання, яке надає йому _12 плиток_ Бачення Розуму на 50 ходів і не потребує часу для застосування, ціною 2 зарядів.
actors.hero.talent.divine_sense.meta_desc=_Якщо цей талант отримує інший герой_, він натомість надасть йому зір розуму на короткий момент після використання чарівної палички або артефакту з радіусом дії 3 клітинки при +1 або 5 клітинок при +2.
actors.hero.talent.divine_sense.title=божественне відчуття
actors.hero.talent.double_jump.desc=_+1:_ Якщо Воїн виконує другий стрибок протягом 3 ходів, вартість заряду цього стрибка зменшується на _16%.\n\n_+2:_ Якщо Воїн виконує другий стрибок протягом 3 ходів, вартість заряду цього стрибка зменшується на _30%.\n\n_+3:_ Якщо Воїн виконує другий стрибок протягом 3 ходів, вартість заряду цього стрибка зменшується на _40%.\n\n_+4:_ Якщо Воїн виконує другий стрибок протягом 3 ходів, вартість заряду цього стрибка зменшується на _50%.
actors.hero.talent.double_jump.title=подвійний стрибок
actors.hero.talent.double_mark.desc=_+1:_ Позначення другої цілі одночасно з першою має _30% знижену_ вартість заряду.\n\n_+2:_ Позначення другої цілі одночасно з першою має _50% знижену_ вартість заряду.\n\n_+3:_ Позначення другої цілі одночасно з першою має _65% знижену_ вартість заряду.\n\n_+4:_ Позначення другої цілі одночасно з першою має _75% знижену_ вартість заряду.
actors.hero.talent.double_mark.title=подвійний знак
actors.hero.talent.durable_projectiles.desc=_+1:_ Метальна зброя має _+50% міцності_ при використанні Мисливицею.\n\n_+2:_ Метальна зброя має _+75% міцності_ при використанні Мисливицею.
actors.hero.talent.durable_projectiles.title=міцні снаряди
actors.hero.talent.durable_tips.desc=_+1:_ Дротики з наконечниками мають _2-кратну міцність_, коли їх використовує Вартовий.\n\n_+2:_ Дротики з наконечниками мають _3-кратну міцність_, коли їх використовує Вартовий.\n\n_+3:_ Дротики з наконечниками мають _4-кратну міцність_, коли їх використовує Вартовий.
actors.hero.talent.durable_tips.title=довговічні поради
actors.hero.talent.eagle_eye.desc=_+1:_ Дальність зору духа-яструба збільшена з 6 до _7 плиток_.\n\n_+2:_ Дальність зору духа-яструба збільшена з 6 до _8 плиток_.\n\n_+3:_ Дальність зору духа-яструба збільшена з 6 до _9 плиток_, і він отримує _2 плитки_ зору розуму.\n\n_+4:_ Дальність зору духа-яструба збільшена з 6 до _10 плиток_, і він отримує _3 плитки_ зору розуму.
actors.hero.talent.eagle_eye.title=орлине око
actors.hero.talent.elemental_power.desc=_+1:_ Потужність елементарного вибуху збільшена на _25%_.\n\n_+2:_ Потужність елементарного вибуху збільшена на _50%_.\n\n_+3:_ Потужність елементарного вибуху збільшена на _75%_.\n\n_+4:_ Потужність елементарного вибуху збільшена на _100%_.
actors.hero.talent.elemental_power.title=стихійна сила
actors.hero.talent.elemental_reach.desc=_+1:_ Дальність удару стихії збільшено з 4 до _5 плиток_, а його ширину збільшено з 65 до _75 градусів_.\n\n_+2:_ Дальність удару стихії збільшено з 4 до _6 плиток_, а його ширину збільшено з 65 до _85 градусів_.\n\n_+3:_ Дальність удару стихії збільшено з 4 до _7 плиток_, а його ширину збільшено з 65 до _95 градусів_.\n\n_+4:_ Дальність удару стихії збільшено з 4 до _8 плиток_, а його ширину збільшено з 65 до _105 градусів_.
actors.hero.talent.elemental_reach.title=елементарний охоплення
actors.hero.talent.elimination_match.desc=_+1:_ Якщо Дуелянт знову кидає виклик протягом 3 ходів закінчення дуелі, вартість заряду цього виклику знижена на _16%.\n\n_+2:_ Якщо Дуелянт знову кидає виклик протягом 3 ходів закінчення дуелі, вартість заряду цього виклику знижена на _30%.\n\n_+3:_ Якщо Дуелянт знову кидає виклик протягом 3 ходів закінчення дуелі, вартість заряду цього виклику знижена на _40%.\n\n_+4:_ Якщо Дуелянт знову кидає виклик протягом 3 ходів закінчення дуелі, вартість заряду цього виклику знижена на _50%.
actors.hero.talent.elimination_match.title=матч на вибування
actors.hero.talent.empowered_strike.desc=_+1:_ Перший удар Бойового Мага в ближньому бою його посохом після удару ним завдає _+16% шкоди_, а бонусний ефект посоху отримує _+50% сили_.\n\n_+2:_ Перший удар Бойового Мага в ближньому бою його посохом після удару ним завдає _+33% шкоди_, а бонусний ефект посоху отримує _+100% сили_.\n\n_+3:_ Перший удар Бойового Мага в ближньому бою його посохом після удару ним завдає _+50% шкоди_, а бонусний ефект посоху отримує _+150% сили_.
actors.hero.talent.empowered_strike.title=уповноважений страйк
actors.hero.talent.empowering_meal.desc=_+1:_ Вживання їжі дає Магу _2 бонусні шкоди_ наступні 3 рази, коли він завдає шкоди паличкою.\n\n_+2:_ Вживання їжі дає Магу _3 бонусні шкоди_ наступні 3 рази, коли він завдає шкоди паличкою.
actors.hero.talent.empowering_meal.title=заряджаючої силою страви
actors.hero.talent.endless_rage.desc=_+1:_ Берсеркер може досягти максимуму _116% люті_.\n\n_+2:_ Берсеркер може досягти максимуму _133% люті_.\n\n_+3:_ Берсеркер може досягти максимуму _150% люті_.\n\nКожна точка люті вище 100% збільшує захист берсерка на 1% та зменшує час відновлення на 1%, але не збільшує бонус шкоди понад +50%.
actors.hero.talent.endless_rage.title=нескінченна лють
actors.hero.talent.energizing_meal.desc=_+1:_ Вживання їжі займає 1-й хід і дає йому _5 ходів перезарядки чарівної палички_.\n\n_+2:_ Вживання їжі займає 1-й хід і дає йому _8 ходів перезарядки чарівної палички_.
actors.hero.talent.energizing_meal.title=енергійна страва
actors.hero.talent.enhanced_combo.desc=_+1:_ Коли комбо Гладіатора становить 7 або вище, дальність відкидання Клоббера збільшується до 3, він викликає запаморочення та може збивати ворогів у ями.\n\n_+2:_ Окрім переваг +1, коли комбо Гладіатора становить 9 або вище, Парування працює на кілька атак.\n\n_+3:_ Окрім переваг +1 та +2, Гладіатор може стрибати вгору до комбо/3 клітинок при використанні Удару, Розчавлення або Люті.
actors.hero.talent.enhanced_combo.title=покращене комбо
actors.hero.talent.enhanced_lethality.desc=_+1:_ Асасин може вбивати ворогів, у яких залишилося менше _4/13/27/67% здоров'я_ за рівень підготовки, замість 3/10/20/50%.\n\n_+2:_ Асасин може вбивати ворогів, у яких залишилося менше _5/17/33/83% здоров'я_ за рівень підготовки, замість 3/10/20/50%.\n\n_+3:_ Асасин може вбивати ворогів, у яких залишилося менше _6/20/40/100% здоров'я_ за рівень підготовки, замість 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=підвищена летальність
actors.hero.talent.enhanced_rings.desc=_+1:_ Коли Розбійник використовує артефакт, його кільця отримують +1 покращення на _3 ходи_.\n\n_+2:_ Коли Розбійник використовує артефакт, його кільця отримують +1 покращення на _6 ходів_.\n\n_+3:_ Коли Розбійник використовує артефакт, його кільця отримують +1 покращення на _9 ходів_.
actors.hero.talent.enhanced_rings.title=покращені кільця
actors.hero.talent.enlightening_meal.desc=_+1:_ Вживання їжі займає 1 хід Клірика та дає йому _0.67 зарядів_ на його священному томі.\n\n_+2:_ Вживання їжі займає 1 хід Клірика та дає йому _1 заряд_ на його священному томі.
actors.hero.talent.enlightening_meal.meta_desc=_Якщо цей талант отримує інший герой_, він натомість дасть 2 ходи перезарядки чарівної палички та артефакту з +1 або 3 ходи з +2. Це не можна використовувати для того, щоб ріг достатку самостійно перезарядився.
actors.hero.talent.enlightening_meal.title=Пізнавальна трапеза
actors.hero.talent.enraged_catalyst.desc=_+1:_ Чари та прокляття на зброї Берсеркера спрацьовують частіше, чим більше в нього люті, максимум на _15% частіше_ при 100% люті.\n\n_+2:_ Чари та прокляття на зброї Берсеркера спрацьовують частіше, чим більше в нього люті, максимум на _30% частіше_ при 100% люті.\n\n_+3:_ Чари та прокляття на зброї Берсеркера спрацьовують частіше, чим більше в нього люті, максимум на _45% частіше_ при 100% люті.
actors.hero.talent.enraged_catalyst.title=розлючений каталізатор
actors.hero.talent.evasive_armor.desc=_+1:_ Під час фрірану Фріраннер отримує додатковий _+1 ухилення_ за надлишок сили на своїй броні. \n\n_+2:_ Під час фрірану Фріраннер отримує додаткові _+2 ухилення_ за надлишок сили на своїй броні.\n\n_+3:_ Під час фрірану Фріраннер отримує додаткові _+3 ухилення_ за кожен надлишок сили на своїй броні.
actors.hero.talent.evasive_armor.title=ухильна броня
actors.hero.talent.even_the_odds.desc=_+1:_ Воїн завдає додаткової _5% бонусної шкоди_ кожному ворогу в межах 2 клітинок, коли закінчується витримка.\n\n_+2:_ Воїн завдає додаткової _10% бонусної шкоди_ кожному ворогу в межах 2 клітинок, коли закінчується витримка.\n\n_+3:_ Воїн завдає додаткової _15% бонусної шкоди_ кожному ворогу в межах 2 клітинок, коли закінчується витримка.\n\n_+4:_ Воїн завдає додаткової _20% бонусної шкоди_ кожному ворогу в межах 2 клітинок, коли закінчується витримка.
actors.hero.talent.even_the_odds.title=навіть шанси
actors.hero.talent.excess_charge.desc=_+1:_ Коли посох Бойового Мага повністю заряджений, його наступний удар зарядом надасть йому _0,67 захисту_ за кожен рівень посоху.\n\n_+2:_ Коли посох Бойового Мага повністю заряджений, його наступний удар зарядом надасть йому _1,33 захисту_ за кожен рівень посоху.\n\n_+3:_ Коли посох Бойового Мага повністю заряджений, його наступний удар зарядом надасть йому _2 захисту_ за кожен рівень посоху.
actors.hero.talent.excess_charge.title=надлишок заряду
actors.hero.talent.expanding_wave.desc=_+1:_ Дальність дії Ударної хвилі збільшено з 5 до _6 плиток_, а її ширину збільшено з 60 до _75 градусів_.\n\n_+2:_ Дальність дії Ударної хвилі збільшено з 5 до _7 плиток_, а її ширину збільшено з 60 до _90 градусів_.\n\n_+3:_ Дальність дії Ударної хвилі збільшено з 5 до _8 плиток_, а її ширину збільшено з 60 до _105 градусів_.\n\n_+4:_ Дальність дії Ударної хвилі збільшено з 5 до _9 плиток_, а її ширину збільшено з 60 до _120 градусів_.
actors.hero.talent.expanding_wave.title=розширююча хвиля
actors.hero.talent.expose_weakness.desc=_+1:_ Вороги, які атакують залишкове зображення Дуелянта, стають слабкими та вразливими на _2 ходи_.\n\n_+2:_ Вороги, які атакують залишкове зображення Дуелянта, стають слабкими та вразливими на _4 ходи_.\n\n_+3:_ Вороги, які атакують залишкове зображення Дуелянта, стають слабкими та вразливими на _6 ходів_.\n\n_+4:_ Вороги, які атакують залишкове зображення Дуелянта, стають слабкими та вразливими на _8 ходів_.
actors.hero.talent.expose_weakness.title=викрити слабкість
actors.hero.talent.fan_of_blades.desc=_+1:_ Спектральні леза можуть вразити до _1 додаткової цілі_, завдаючи 50% шкоди. Ціль має бути видимою та в межах конуса _30 градусів_ AOE.\n\n_+2:_ Спектральні леза можуть вразити до _2 додаткових цілей_, завдаючи 50% шкоди. Цілі мають бути видимими та в межах конуса _60 градусів_ AOE.\n\n_+3:_ Спектральні леза можуть вразити до _3 додаткових цілей_, завдаючи 50% шкоди. Цілі мають бути видимими та в межах конуса _90 градусів_ AOE.\n\n_+4:_ Спектральні леза можуть вразити до _4 додаткових цілей_, завдаючи 50% шкоди. Цілі мають бути видимими та в межах конуса _120 градусів_ AOE.
actors.hero.talent.fan_of_blades.title=вентилятор лопатей
actors.hero.talent.farsight.desc=_+1:_ Дальність зору снайпера _збільшено на 25%_.\n\n_+2:_ Дальність зору снайпера _збільшено на 50%_.\n\n_+3:_ Дальність зору снайпера _збільшено на 75%_.
actors.hero.talent.farsight.title=далекоглядність
actors.hero.talent.fear_the_reaper.desc=_+1:_ Коли ворог з позначкою смерті досягає 0 здоров'я, він стає _калікою_.\n\n_+2:_ Коли ворог з позначкою смерті досягає 0 здоров'я, він стає _страшним та калікою_.\n\n_+3:_ Коли ворог з позначкою смерті досягає 0 здоров'я, він стає _страшним та калікою_, а вороги в межах 3 клітинок стають _каліками_.\n\n_+4:_ Коли ворог з позначкою смерті досягає 0 здоров'я, він стає _страшним та калікою_, а вороги в межах 3 клітинок стають _страшними та каліками_.
actors.hero.talent.fear_the_reaper.title=бійтеся женця
actors.hero.talent.feigned_retreat.desc=_+1:_ Якщо ворог атакує післязображення Дуелянта, він отримує _2 ходи_ поспішності.\n\n_+2:_ Якщо ворог атакує післязображення Дуелянта, він отримує _4 ходи_ поспішності.\n\n_+3:_ Якщо ворог атакує післязображення Дуелянта, він отримує _6 ходів_ поспішності.\n\n_+4:_ Якщо ворог атакує післязображення Дуелянта, він отримує _8 ходів_ поспішності.
actors.hero.talent.feigned_retreat.title=удаваний відступ
actors.hero.talent.fire_everything.desc=_+1:_ Дика магія тепер спрацьовує _5 разів_ більше, ніж 4, і кожна паличка має _25% шанс_ бути використаною 3 рази.\n\n_+2:_ Дика магія тепер спрацьовує _6 разів_ більше, ніж 4, і кожна паличка має _50% шанс_ бути використаною 3 рази.\n\n_+3:_ Дика магія тепер спрацьовує _7 разів_ більше, ніж 4, і кожна паличка має _75% шанс_ бути використаною 3 рази.\n\n_+4:_ Дика магія тепер спрацьовує _8 разів_ більше, ніж 4, і кожна паличка має _100% шанс_ бути використаною 3 рази.
actors.hero.talent.fire_everything.title=підпалити все
actors.hero.talent.flash.desc=_+1:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Спалах_, щоб телепортуватися на відстань до _3 плиток_.\n\n_+2:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Спалах_, щоб телепортуватися на відстань до _4 плиток_.\n\n_+3:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Спалах_, щоб телепортуватися на відстань до _5 плиток_.\n\n_+4:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Спалах_, щоб телепортуватися на відстань до _6 плиток_.\n\nСпалах коштує 2 заряди тому спочатку, і ще 1 заряд за кожне використання у тій самій Вознесенній формі.
actors.hero.talent.flash.title=спалах
actors.hero.talent.focused_meal.desc=_+1:_ Вживання їжі займає 1 хід Дуелянтки та дає їй _0.67 зарядів_ зброї.\n\n_+2:_ Вживання їжі займає 1 хід Дуелянтки та дає їй _1 заряд_ зброї.
actors.hero.talent.focused_meal.meta_desc=_Якщо цей талант отримує інший герой_, він натомість надасть додаткову шкоду до його наступного удару, що дорівнює його рівню/3 при +1 або рівню/2 при +2.
actors.hero.talent.focused_meal.title=цілеспрямований прийом їжі
actors.hero.talent.followup_strike.desc=_+1:_ Коли Мисливиця вражає ворога своїм луком або метальною зброєю, її наступна атака ближнього бою проти цього ворога завдає _2 бонусної шкоди_.\n\n_+2:_ Коли Мисливиця вражає ворога своїм луком або метальною зброєю, її наступна атака ближнього бою проти цього ворога завдає _3 бонусної шкоди_.
actors.hero.talent.followup_strike.title=повторний страйк
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Атаки духовного яструба осліплюють ворогів на _2 ходи_.\n\n_+2:_ Атаки духовного яструба осліплюють ворогів на _5 ходів_.\n\n_+3:_ Атаки духовного яструба осліплюють ворогів на _5 ходів_ та калічать їх на _2 ходи_.\n\n_+4:_ Атаки духовного яструба осліплюють ворогів на _5 ходів_ та калічать їх на _5 ходів_.
actors.hero.talent.go_for_the_eyes.title=цілься в очі
actors.hero.talent.growing_power.desc=_+1:_ Підвищення швидкості атаки та руху від сили природи збільшено до _38% та 125%_, замість 33% та 100%.\n\n_+2:_ Підвищення швидкості атаки та руху від сили природи збільшено до _42% та 150%_, замість 33% та 100%.\n\n_+3:_ Підвищення швидкості атаки та руху від сили природи збільшено до _46% та 175%_, замість 33% та 100%.\n\n_+4:_ Підвищення швидкості атаки та руху від сили природи збільшено до _50% та 200%_, замість 33% та 100%.
actors.hero.talent.growing_power.title=зростаюча сила
actors.hero.talent.hallowed_ground.desc=_+1:_ Жрець може використовувати _Священну Землю_, заклинання, яке освячує місцевість у області _3x3_ протягом 20 ходів, ціною 2 зарядів.\n\n_+2:_ Жрець може використовувати _Священну Землю_, заклинання, яке освячує місцевість у області _5x5_ протягом 20 ходів, ціною 2 зарядів.\n\n_+3:_ Жрець може використовувати _Священну Землю_, заклинання, яке освячує місцевість у області _7x7_ протягом 20 ходів, ціною 2 зарядів.\n\nПід час використання Священна Земля лікує союзників на 15 здоров'я, ненадовго принижує ворогів і поширює коротку траву. Після цього вона повільно лікує союзників, калічить ворогів і випадковим чином призводить до зростання високої трави. Священна земля надає Жерцеві щит замість зцілення та знищується вогнем.
actors.hero.talent.hallowed_ground.title=священна земля
actors.hero.talent.hasty_retreat.desc=_+1:_ Після моргання Розбійник отримує _1 хід_ поспішності та невидимості.\n\n_+2:_ Після моргання Розбійник отримує _2 ходу_ поспішності та невидимості.\n\n_+3:_ Після моргання Розбійник отримує _3 ходу_ поспішності та невидимості.\n\n_+4:_ Після моргання Розбійник отримує _4 ходу_ поспішності та невидимості.
actors.hero.talent.hasty_retreat.title=поспішний відступ
actors.hero.talent.hearty_meal.desc=_+1:_ Вживання їжі лікує Воїна на _4 HP_, коли його здоров'я становить 33% або менше.\n\n_+2:_ Вживання їжі лікує Воїна на _6 HP_, коли його здоров'я становить 33% або менше.
actors.hero.talent.hearty_meal.title=ситну вечерю
actors.hero.talent.heightened_senses.desc=_+1:_ Мисливиця отримує розумовий зір на персонажах у межах _2 клітинок від своєї позиції_.\n\n_+2:_ Мисливиця отримує розумовий зір на персонажах у межах _3 клітинок від своєї позиції_.
actors.hero.talent.heightened_senses.title=загострені почуття
actors.hero.talent.heroic_energy.desc=_+1:_ Вартість заряду здатності героя "броня" знижена на _12%.\n\n_+2:_ Вартість заряду здатності героя "броня" знижена на _23%.\n\n_+3:_ Вартість заряду здатності героя "броня" знижена на _32%.\n\n_+4:_ Вартість заряду здатності героя "броня" знижена на _40%.
actors.hero.talent.heroic_energy.rat_title=ратроїчна енергія
actors.hero.talent.heroic_energy.title=героїчна енергія
actors.hero.talent.hold_fast.desc=_+1:_ Коли Воїн чекає, він отримує _1-2 броні_ та уповільнює розпад комбо- та щитових ефектів на _50%_, доки не переміститься.\n\n_+2:_ Коли Воїн чекає, він отримує _2-4 броні_ та уповільнює розпад комбо- та щитових ефектів на _75%_, доки не переміститься.\n\n_+3:_ Коли Воїн чекає, він отримує _3-6 броні_ та уповільнює розпад комбо- та щитових ефектів на _100%_, доки не переміститься.
actors.hero.talent.hold_fast.title=тримайся міцно
actors.hero.talent.holy_intuition.desc=_+1:_ Клірик може застосувати _Священну Інтуїцію_, заклинання, яке показує, чи проклятий предмет, ціною _3 зарядів._\n\n_+2:_ Клірик може застосувати _Священну Інтуїцію_, заклинання, яке показує, чи проклятий предмет, ціною _2 зарядів._
actors.hero.talent.holy_intuition.meta_desc=_Якщо цей талант отримує інший герой_, він натомість дозволить герою визначити статус прокляття на проклятому предметі безпосередньо перед його екіпіруванням, у 15% випадків з +1 або у 25% випадків з +2.
actors.hero.talent.holy_intuition.title=свята інтуїція
actors.hero.talent.holy_lance.desc=_+1:_ Священик може застосувати _Священний Спис,_ руйнівне заклинання, яке завдає _30-55 одиниць шкоди_ ціною 4 зарядів.\n\n_+2:_ Священик може застосувати _Священний Спис,_ руйнівне заклинання, яке завдає _45-83 одиниць шкоди_ ціною 4 зарядів.\n\n_+3:_ Священик може застосувати _Священний Спис,_ руйнівне заклинання, яке завдає _60-110 одиниць шкоди_ ціною 4 зарядів.\n\nСвященний Спис завжди завдає максимальної шкоди демонічним та немертвим ворогам. Священний Спис має 30 ходів відновлення, перш ніж його можна застосувати знову.
actors.hero.talent.holy_lance.title=святий спис
actors.hero.talent.impact_wave.desc=_+1:_ Коли Воїн приземляється після стрибка, всі сусідні вороги відкидаються на _2 клітинки_ назад і мають _25% шанс_ стати вразливими протягом 5 ходів.\n\n_+2:_ Коли Воїн приземляється після стрибка, всі сусідні вороги відкидаються на _3 клітинки_ назад і мають _50% шанс_ стати вразливими протягом 5 ходів.\n\n_+3:_ Коли Воїн приземляється після стрибка, всі сусідні вороги відкидаються на _4 клітинки_ назад і мають _75% шанс_ стати вразливими протягом 5 ходів.\n\n_+4:_ Коли Воїн приземляється після стрибка, всі сусідні вороги відкидаються на _5 клітинок_ назад і мають _100% шанс_ стати вразливими протягом 5 ходів.
actors.hero.talent.impact_wave.title=ударна хвиля
actors.hero.talent.improvised_projectiles.desc=_+1:_ Воїн може засліпити ворога на _2 ходу_, кинувши в нього будь-який предмет, що не є кидковою зброєю. Час відновлення 50 ходів.\n\n_+2:_ Воїн може засліпити ворога на _3 ходу_, кинувши в нього будь-який предмет, що не є кидковою зброєю. Час відновлення 50 ходів.
actors.hero.talent.improvised_projectiles.title=імпровізовані снаряди
actors.hero.talent.inscribed_power.desc=_+1:_ Коли Маг читає сувій або використовує предмет заклинання, його _наступні 2 удари паличкою_ отримують +2 рівні.\n\n_+2:_ Коли Маг читає сувій або використовує предмет заклинання, його _наступні 3 удари паличкою_ отримують +2 рівні.\n\nКількість покращених ударів паличкою подвоюється при використанні сувою предметів покращення, трансмутації або алхімічних предметів, які необхідно виготовити за допомогою цих сувоїв.\n\nДля предметів алхімічних речовин з більшою кількістю виробленого матеріалу (наприклад, більшість заклинань) цей талант має шанс спрацювати залежно від того, скільки цього предмета вироблено.
actors.hero.talent.inscribed_power.title=вписана сила
actors.hero.talent.inscribed_stealth.desc=_+1:_ Розбійник отримує _3 ходи_ невидимості після прочитання сувою або використання предмета заклинання.\n\n_+2:_ Розбійник отримує _5 ходів_ невидимості після прочитання сувою або використання предмета заклинання.\n\nТривалість невидимості подвоюється при використанні сувою покращення, сувою трансмутації або алхімічних предметів, які необхідно виготовити за допомогою цих сувоїв.\n\nДля алхімічних предметів з більшою кількістю виробленого матеріалу (наприклад, більшість заклинань) цей талант має шанс спрацювати залежно від того, скільки цього предмета вироблено.
actors.hero.talent.inscribed_stealth.title=вписана прихованість
actors.hero.talent.invigorating_meal.desc=_+1:_ Вживання їжі займає у Мисливиці 1 хід (ягоди з'їдаються миттєво) та дає їй _1 хід швидкості_.\n\n_+2:_ Вживання їжі займає у Мисливиці 1 хід (ягоди з'їдаються миттєво) та дає їй _2 ходу швидкості_.
actors.hero.talent.invigorating_meal.title=бадьорий обід
actors.hero.talent.invigorating_victory.desc=_+1:_ Якщо Дуелянт перемагає свою ціль до закінчення дуелі, вона виліковується на _5 HP плюс 30% від шкоди_, яку вона отримала під час дуелі.\n\n_+2:_ Якщо Дуелянт перемагає свою ціль до закінчення дуелі, вона виліковується на _10 HP плюс 50% від шкоди_, яку вона отримала під час дуелі.\n\n_+3:_ Якщо Дуелянт перемагає свою ціль до закінчення дуелі, вона виліковується на _15 HP плюс 65% від шкоди_, яку вона отримала під час дуелі.\n\n_+4:_ Якщо Дуелянт перемагає свою ціль до закінчення дуелі, вона виліковується на _20 HP плюс 75% від шкоди_, яку вона отримала під час дуелі.
actors.hero.talent.invigorating_victory.title=бадьорлива перемога
actors.hero.talent.iron_stomach.desc=_+1:_ Вживання їжі займає у Воїна 1 хід і надає йому _75% стійкості до пошкоджень_ під час їжі.\n\n_+2:_ Вживання їжі займає у Воїна 1 хід і надає йому _100% стійкості до пошкоджень_ під час їжі.
actors.hero.talent.iron_stomach.title=залізний шлунок
actors.hero.talent.iron_will.desc=_+1:_ Щит, що надається печаткою Воїна, _збільшується на 1_.\n\n_+2:_ Щит, що надається печаткою Воїна, _збільшується на 2_.
actors.hero.talent.iron_will.meta_desc=_Якщо цей талант отримує інший герой_, він пасивно надасть версію ефекту зламаної печатки Воїна з максимальним щитом 1 або 2.
actors.hero.talent.iron_will.title=залізна воля
actors.hero.talent.judgement.desc=_+1:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Суд,_ який завдає _10-20 одиниць шкоди_ всім видимим ворогам.\n\n_+2:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Суд,_ який завдає _15-30 одиниць шкоди_ всім видимим ворогам.\n\n_+3:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Суд,_ який завдає _20-40 одиниць шкоди_ всім видимим ворогам.\n\n_+4:_ Перебуваючи у Вознесенній формі, Клірик може застосувати _Суд,_ який завдає _25-50 одиниць шкоди_ всім видимим ворогам.\n\nСуд коштує 3 заряди тому. Суд завдає +33% шкоди за кожне заклинання, яке Клірик застосував з моменту прийняття форми вознесіння або з моменту останнього застосування Суду.
actors.hero.talent.judgement.title=судження
actors.hero.talent.lay_on_hands.desc=_+1:_ Паладин може застосувати _Покладання рук_, заклинання, яке миттєво лікує персонажа поблизу на _15 здоров'я,_ або надає паладину _15 екранування,_ ціною 1 заряду.\n\n_+2:_ Паладин може застосувати _Покладання рук_, заклинання, яке миттєво лікує персонажа поблизу на _20 здоров'я,_ або надає паладину _20 екранування,_ ціною 1 заряду.\n\n_+3:_ Паладин може застосувати _Покладання рук_, заклинання, яке миттєво лікує персонажа поблизу на _25 здоров'я,_ або надає паладину _25 екранування,_ ціною 1 заряду.\n\nНадмірне зцілення від цього заклинання перетворюється на екранування. «Покладання рук» можна застосовувати неодноразово, але не можна застосувати більше трьох застосувань щита одночасно.
actors.hero.talent.lay_on_hands.title=покласти на руки
actors.hero.talent.lethal_defense.desc=_+1:_ Коли Гладіатор вбиває ворога комбо-хит, час відновлення його захисту «Зламана печатка» _зменшується на 50 ходів_.\n\n_+2:_ Коли Гладіатор вбиває ворога комбо-хит, час відновлення його захисту «Зламана печатка» _зменшується на 100 ходів_.\n\n_+3:_ Коли Гладіатор вбиває ворога комбо-хит, час відновлення його захисту «Зламана печатка» _зменшується на 150 ходів_.\n\nЦей талант може зменшити час відновлення щита до -150 ходів, що означає, що він буде доступний знову одразу після активації.
actors.hero.talent.lethal_defense.title=смертельний захист
actors.hero.talent.lethal_haste.desc=_+1:_ Коли Дуелянт завдає смертельного удару ворогу зі здібністю зброї, він отримує _3 ходи_ миттєвого пересування.\n\n_+2:_ Коли Дуелянт завдає смертельного удару ворогу зі здібністю зброї, він отримує _5 ходів_ миттєвого пересування.
actors.hero.talent.lethal_haste.meta_desc=_Якщо цей талант отримує інший герой_, він спрацьовуватиме зі звичайними атаками зброї з часом відновлення 100 ходів.
actors.hero.talent.lethal_haste.title=смертельна поспіх
actors.hero.talent.lethal_momentum.desc=_+1:_ Коли Воїн завдає смертельного удару по ворогу фізичною зброєю, він має _67% шанс_ зробити 0 ходів.\n\n_+2:_ Коли Воїн завдає смертельного удару по ворогу фізичною зброєю, він має _100% шанс_ зробити 0 ходів.
actors.hero.talent.lethal_momentum.title=смертельний імпульс
actors.hero.talent.life_link.desc=Клірик може накласти _Життєвий зв'язок_ між собою та союзником, що має сили, ціною 2 зарядів. Це заклинання розподіляє шкоду між Кліриком та його союзником, а також застосовує корисні заклинання клірика 3-го рівня або нижче до обох, якщо один із них уражений. \n\n_+1:_ Зв'язок життя триває _10 ходів_ та збільшує бонус Силі багатьох до _-35% отриманої шкоди._\n\n_+2:_ Зв'язок життя триває _13 ходів_ та збільшує бонус Силі багатьох до _-40% отриманої шкоди._\n\n_+3:_ Зв'язок життя триває _17 ходів_ та збільшує бонус Силі багатьох до _-45% отриманої шкоди._\n\n_+4:_ Зв'язок життя триває _20 ходів_ та збільшує бонус Силі багатьох до _-50% отриманої шкоди._
actors.hero.talent.life_link.title=життєвий зв'язок
actors.hero.talent.light_cloak.desc=_+1:_ Розбійник може використовувати свій плащ тіней, коли він не екіпірований, але він перезаряджається зі швидкістю _25%_, коли він не екіпірований.\n\n_+2:_ Розбійник може використовувати свій плащ тіней, коли він не екіпірований, але він перезаряджається зі швидкістю _50%_, коли він не екіпірований.\n\n_+3:_ Розбійник може використовувати свій плащ тіней, коли він не екіпірований, але він перезаряджається зі швидкістю _75%_, коли він не екіпірований.
actors.hero.talent.light_cloak.meta_desc=_Якщо цей талант отримує інший герой_, він натомість збільшить швидкість зарядки всіх артефактів на 7/13/20% при +1/+2/+3.
actors.hero.talent.light_cloak.title=легкий плащ
actors.hero.talent.light_reading.desc=_+1:_ Клірик може використовувати свій священний фоліант, коли він не екіпірований, але він перезаряджається зі швидкістю _25%_, коли він не екіпірований.\n\n_+2:_ Клірик може використовувати свій священний фоліант, коли він не екіпірований, але він перезаряджається зі швидкістю _50%_, коли він не екіпірований.\n\n_+3:_ Клірик може використовувати свій священний фоліант, коли він не екіпірований, але він перезаряджається зі швидкістю _75%_, коли він не екіпірований.
actors.hero.talent.light_reading.meta_desc=_Якщо цей талант отримує інший герой_, він натомість збільшить швидкість перезарядки всіх паличок на 7/13/20% при +1/+2/+3.
actors.hero.talent.light_reading.title=Легке читання
actors.hero.talent.lingering_magic.desc=_+1:_ Коли Маг завдає удару паличкою або посохом, його наступна фізична атака завдає _1-2 бонусної шкоди_.\n\n_+2:_ Коли Маг завдає удару паличкою або посохом, його наступна фізична атака завдає _2 бонусної шкоди_.
actors.hero.talent.lingering_magic.title=затяжна магія
actors.hero.talent.liquid_agility.desc=_+1:_ Під час випивання або кидання зілля, відвару чи еліксиру Дуелянт має _3-кратне ухилення_ та _3-кратну точність_ під час наступної атаки ближнього бою протягом 5 ходів.\n\n_+2:_ Під час випивання або кидання зілля, відвару чи еліксиру Дуелянт має _безкінечне ухилення_ та _безкінечну точність_ під час наступної атаки ближнього бою протягом 5 ходів.\n\nЦей бонус триває ще один додатковий хід і атаку під час використання зілля сили, досвіду або алхімічних предметів, які необхідно виготовити з цих зілля.\n\nДля алхімічних предметів з більшою кількістю виробленого продукту (наприклад, водяного відвару) цей талант має шанс спрацювати залежно від того, скільки цього предмета виробляється.
actors.hero.talent.liquid_agility.title=спритність рідини
actors.hero.talent.liquid_nature.desc=_+1:_ Коли Мисливиця випиває або кидає зілля, відвар або еліксир, _до 4 плиток трави_ проростає навколишньою областю, а сусідні вороги підкорюються на _1 хід_.\n\n_+2:_ Коли Мисливиця випиває або кидає зілля, відвар або еліксир, _до 6 плиток трави_ проростає навколишньою областю, а сусідні вороги підкорюються на _2 ходу_.\n\nКількість трави та тривалість коренів подвоюється при використанні зілля сили, досвіду або алхімічних предметів, які необхідно виготовити з використанням цих зілля.\n\nДля алхімічних предметів з більшою кількістю виробленого матеріалу (наприклад, водяного відвару) цей талант має шанс спрацювати залежно від того, скільки цього предмета виробляється.
actors.hero.talent.liquid_nature.title=рідка природа
actors.hero.talent.liquid_willpower.desc=_+1:_ Воїн отримує _6,5% свого максимального HP у захисті_ під час випивання або кидання зілля, відвару чи еліксиру.\n\n_+2:_ Воїн отримує _10% свого максимального HP у захисті_ під час випивання або кидання зілля, відвару чи еліксиру.\n\nВеличина щита подвоюється під час використання зілля сили, досвіду або алхімічних предметів, які необхідно виготовити з цих зілля.\n\nДля алхімічних предметів з більшою кількістю виробленого матеріалу (наприклад, водяного відвару) цей талант має шанс спрацювати залежно від того, скільки цього предмета вироблено.
actors.hero.talent.liquid_willpower.title=рідка сила волі
actors.hero.talent.longrange_warp.desc=_+1:_ Маг тепер може переміщатися між поверхами, вартість заряду _150%_.\n\n_+2:_ Маг тепер може переміщатися між поверхами, вартість заряду _117%_.\n\n_+3:_ Маг тепер може переміщатися між поверхами, вартість заряду _83%_.\n\n_+4:_ Маг тепер може переміщатися між поверхами, вартість заряду _50%_.\n\nМаг не може використовувати варп на великій відстані, щоб залишити замкнений поверх.
actors.hero.talent.longrange_warp.title=Дальній варп
actors.hero.talent.mind_form.desc=Клірик може застосувати _Форму Розуму_, яка наділяє Трійцю силою чарівної палички або метальної зброї, яку Клірик використовував цього разу, ціною 3 зарядів. \n\n_+1:_ Коли використовується Трійця, Клірик використовує ефект кидка або удару обраного предмета, ніби це _+3._\n\n_+2:_ Коли використовується Трійця, Клірик використовує ефект кидка або удару обраного предмета, ніби це _+4._\n\n_+3:_ Коли використовується Трійця, Клірик використовує ефект кидка або удару обраного предмета, ніби це _+5._\n\n_+4:_ Коли використовується Трійця, Клірик використовує ефект кидка або удару обраного предмета, ніби це _+5. _+6._\n\nТрініті може бути наповнена лише одним ефектом розуму за раз.
actors.hero.talent.mind_form.title=форма розуму
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Священик може застосувати _Мнемонічну молитву,_ заклинання, яке продовжує ефект/зниження ефекту на союзника/ворога на _3 ходи_ вартістю 1 заряду.\n\n_+2:_ Священик може застосувати _Мнемонічну молитву,_ заклинання, яке продовжує ефект/зниження ефекту на союзника/ворога на _4 ходи_ вартістю 1 заряду.\n\n_+3:_ Священик може застосувати _Мнемонічну молитву,_ заклинання, яке продовжує ефект/зниження ефекту на союзника/ворога на _5 ходів_ вартістю 1 заряду.\n\nМнемонічна молитва застосовується не поспішаючи. Мнемонічна молитва може продовжити дію певного ефекту/зниження ефекту лише один раз і не може продовжити ефект від здібностей броні.
actors.hero.talent.mnemonic_prayer.title=мнемонічна молитва
actors.hero.talent.monastic_vigor.desc=_+1:_ Якщо чернець має _100% енергії_, його здібності посилюються.\n\n_+2:_ Якщо чернець має _80% або більше енергії_, його здібності посилюються.\n\n_+3:_ Якщо чернець має _60% або більше енергії_, його здібності посилюються.\n\nКоли посилено:\n - Шквал застосовує чари вашої зброї\n - Фокус миттєво\n - Ривок отримує +4 дальність\n - Удар дракона завдає +50% шкоди та застосовує ефект відкидання та оглушення до всіх сусідніх ворогів\n - Медитація повільно лікує 20% відсутніх HP та надає 80% опору пошкодженням.
actors.hero.talent.monastic_vigor.title=монастирська енергія
actors.hero.talent.mystical_charge.desc=_+1:_ Удар своїм посохом дає Бойовому Магу _0.5 ходу_ перезарядки артефакту.\n\n_+2:_ Удар своїм посохом дає Бойовому Магу _1 хід_ перезарядки артефакту.\n\n_+3:_ Удар своїм посохом дає Бойовому Магу _1.5 ходу_ перезарядки артефакту.
actors.hero.talent.mystical_charge.title=містичний заряд
actors.hero.talent.mystical_meal.desc=_+1:_ Вживання їжі займає 1 хід Розбійника (пайки з'їдаються миттєво) та дає йому _3 ходи перезарядки артефактів_.\n\n_+2:_ Вживання їжі займає 1 хід Розбійника (пайки з'їдаються миттєво) та дає йому _5 ходів перезарядки артефактів_.\n\nЦей талант не можна використовувати для того, щоб ріг достатку сам перезарядився.
actors.hero.talent.mystical_meal.title=містична трапеза
actors.hero.talent.natures_aid.desc=_+1:_ Мисливиця отримує 0-2 броні з кори, яка зникає кожні _3 ходи_, коли ефект рослини активується в її полі зору.\n\n_+2:_ Мисливиця отримує 0-2 броні з кори, яка зникає кожні _5 ходів_, коли ефект рослини активується в її полі зору.
actors.hero.talent.natures_aid.title=допомога природи
actors.hero.talent.natures_bounty.desc=_+1:_ Мисливиця може знайти _4 ягоди_, заховані у високій траві, досліджуючи наступні кілька поверхів підземелля.\n\n_+2:_ Мисливиця може знайти _6 ягід_, захованих у високій траві, досліджуючи наступні кілька поверхів підземелля.\n\n Ягоди з'їдаються швидко, відновлюють невелику кількість ситості та можуть містити придатне для використання насіння.
actors.hero.talent.natures_bounty.title=щедрість природи
actors.hero.talent.natures_wrath.desc=_+1:_ Поки сила природи активна, постріли з духовного лука мають _8% шанс_ спрацювати випадковий шкідливий ефект рослини.\n\n_+2:_ Поки сила природи активна, постріли з духовного лука мають _17% шанс_ спрацювати випадковий шкідливий ефект рослини.\n\n_+3:_ Поки сила природи активна, постріли з духовного лука мають _25% шанс_ спрацювати випадковий шкідливий ефект рослини.\n\n_+4:_ Поки сила природи активна, постріли з духовного лука мають _33% шанс_ спрацювати випадковий шкідливий ефект рослини.\n\nРослини, які можна спрацювати: лаванда, вогняний цвіт, крижана шапка, скорботний мох та штормова лоза.
actors.hero.talent.natures_wrath.title=гнів природи
actors.hero.talent.necromancers_minions.desc=_+1:_ Коли ворог, позначений позначкою душі, помирає, Чаклун має _13% шанс_ підняти його як зіпсованого привида.\n\n_+2:_ Коли ворог, позначений позначкою душі, помирає, Чаклун має _27% шанс_ підняти його як зіпсованого привида.\n\n_+3:_ Коли ворог, позначений позначкою душі, помирає, Чаклун має _40% шанс_ підняти його як зіпсованого привида.
actors.hero.talent.necromancers_minions.title=поплічники некроманта
actors.hero.talent.patient_strike.desc=_+1:_ Якщо Дуелянт чекає перед виконанням атаки ближнього бою, він завдасть _1-2 бонусної шкоди_.\n\n_+2:_ Якщо Дуелянт чекає перед виконанням атаки ближнього бою, він завдасть _2 бонусної шкоди_.
actors.hero.talent.patient_strike.title=страйк пацієнтів
actors.hero.talent.perfect_copy.desc=_+1:_ Тіньовий клон отримує _10%_ від максимального HP героя та може миттєво мінятися місцями з героєм на відстані до _1 плитки_.\n\n_+2:_ Тіньовий клон отримує _20%_ від максимального HP героя та може миттєво мінятися місцями з героєм на відстані до _2 плиток_.\n\n_+3:_ Тіньовий клон отримує _30%_ від максимального HP героя та може миттєво мінятися місцями з героєм на відстані до _3 плиток_.\n\n_+4:_ Тіньовий клон отримує _40%_ від максимального HP героя та може миттєво мінятися місцями з героєм на відстані до _4 плиток_.
actors.hero.talent.perfect_copy.title=ідеальна копія
actors.hero.talent.point_blank.desc=_+1:_ Коли Мисливиця використовує свій лук або меткову зброю на відстані ближнього бою, вона має _-25% точності,_ замість -50%.\n\n_+2:_ Коли Мисливиця використовує свій лук або меткову зброю на відстані ближнього бою, вона має _звичайну точність,_ замість -50%.\n\n_+3:_ Коли Мисливиця використовує свій лук або меткову зброю на відстані ближнього бою, вона має _+25% точності,_ замість -50%.\n\nЗверніть увагу, що меткова зброя або духівський лук завжди мають +50% точності при використанні на відстані.
actors.hero.talent.point_blank.title=прямо
actors.hero.talent.precise_assault.desc=_+1:_ Коли Дуелянт використовує здатність зброї, він отримує _2-кратну точність_ під час наступної атаки ближнього бою протягом 5 ходів.\n\n_+2:_ Коли Дуелянт використовує здатність зброї, він отримує _5-кратну точність_ під час наступної атаки ближнього бою протягом 5 ходів.\n\n_+3:_ Коли Дуелянт використовує здатність зброї, він отримує _безкінечну точність_ під час наступної атаки ближнього бою протягом 5 ходів.
actors.hero.talent.precise_assault.meta_desc=_Якщо цей талант отримує інший герой_, він натомість збільшить точність у ближньому бою на 10% при +1, 20% при +2 або 30% при +3.
actors.hero.talent.precise_assault.title=точний напад
actors.hero.talent.projectile_momentum.desc=_+1:_ Під час вільного бігу Вільний бігун отримує _+50% точності та +15% шкоди_ метальною зброєю.\n\n_+2:_ Під час вільного бігу Вільний бігун отримує _+100% точності та +30% шкоди_ метальною зброєю.\n\n_+3:_ Під час вільного бігу Вільний бігун отримує _+150% точності та +45% шкоди_ метальною зброєю.
actors.hero.talent.projectile_momentum.title=імпульс снаряда
actors.hero.talent.projecting_blades.desc=_+1:_ Спектральні леза мають _+25% точності_ та можуть пробити до _2 суцільних плиток_.\n\n_+2:_ Спектральні леза мають _+50% точності_ та можуть пробити до _4 суцільних плиток_.\n\n_+3:_ Спектральні леза мають _+75% точності_ та можуть пробити до _6 суцільних плиток_.\n\n_+4:_ Спектральні леза мають _+100% точності_ та можуть пробити до _8 суцільних плиток_.
actors.hero.talent.projecting_blades.title=виступаючі лопаті
actors.hero.talent.protective_shadows.desc=_+1:_ Розбійник отримує один щит _кожен другий хід_, поки він невидимий, _максимум 3_.\n\n_+2:_ Розбійник отримує один щит _кожен хід_, поки він невидимий, _максимум 5_.
actors.hero.talent.protective_shadows.title=захисні тіні
actors.hero.talent.provoked_anger.desc=_+1:_ Коли будь-яке посилення щита, застосоване до Воїна, провалюється внаслідок пошкоджень, його наступна фізична атака завдасть _3 бонусних одиниць шкоди_.\n\n_+2:_ Коли будь-яке посилення щита, застосоване до Воїна, провалюється внаслідок пошкоджень, його наступна фізична атака завдасть _5 бонусних одиниць шкоди_.
actors.hero.talent.provoked_anger.title=викликав гнів
actors.hero.talent.ratforcements.desc=_+1:_ Використання щура-маніпулятора на собі _порождає 1_ союзного сумчастого щура поруч із вами.\n\n_+2:_ Використання щура-маніпулятора на собі _порождає 2_ союзних сумчастих щурів поруч із вами.\n\n_+3:_ Використання щура-маніпулятора на собі _порождає 3_ союзних сумчастих щурів поруч із вами.\n\n_+4:_ Використання щура-маніпулятора на собі _порождає 4_ союзних сумчастих щурів поруч із вами.
actors.hero.talent.ratforcements.title=щурячі сили
actors.hero.talent.ratlomacy.desc=_+1:_ Використання "Щурмогрифікації" на щуроморфованому ворогові робить його дружнім, робить трансформацію постійною та дає йому _2 ходи_ адреналіну.\n\n_+2:_ Використання "Щурмогрифікації" на щуроморфованому ворогові робить його дружнім, робить трансформацію постійною та дає йому _2 ходи_ адреналіну.\n\n_+3:_ Використання "Щурмогрифікації" на щуроморфованому ворогові робить його дружнім, робить трансформацію постійною та дає йому _4 ходи_ адреналіну.\n\n_+4:_ Використання "Щурмогрифікації" на щуроморфованому ворогові робить його дружнім, робить трансформацію постійною та дає йому _6 ходів_ адреналіну.
actors.hero.talent.ratlomacy.title=щуроламатизм
actors.hero.talent.ratsistance.desc=_+1:_ Ворожі вороги, збуджені щурами, завдають _-10% шкоди_.\n\n_+2:_ Ворожі вороги, збуджені щурами, завдають _-19% шкоди_.\n\n_+3:_ Ворожі вороги, збуджені щурами, завдають _-27% шкоди_.\n\n_+4:_ Ворожі вороги, збуджені щурами, завдають _-35% шкоди_.
actors.hero.talent.ratsistance.title=стійкість до щурів
actors.hero.talent.reactive_barrier.desc=_+1:_ Маг отримує _2.5 одиниці захисту_ за кожного персонажа, на якого вплинув стихійний вибух, максимум 5 персонажів.\n\n_+2:_ Маг отримує _5 одиниць захисту_ за кожного персонажа, на якого вплинув стихійний вибух, максимум 6 персонажів.\n\n_+3:_ Маг отримує _7.5 одиниці захисту_ за кожного персонажа, на якого вплинув стихійний вибух, максимум 7 персонажів.\n\n_+4:_ Маг отримує _10 одиниць захисту_ за кожного персонажа, на якого вплинув стихійний вибух, максимум 8 персонажів.
actors.hero.talent.reactive_barrier.title=реактивний бар'єр
actors.hero.talent.recall_inscription.desc=_+1:_ Клірик може застосувати _Напис Відкликання_, заклинання, яке дозволяє йому повторити ефект останнього рунного каменю або сувою, який він використав протягом _10 ходів._\n\n_+2:_ Клірик може застосувати _Напис Відкликання_, заклинання, яке дозволяє йому повторити ефект останнього рунного каменю або сувою, який він використав протягом _300 ходів._\n\nНапис Відкликання не можна використовувати зі сувоями покращення. Вартість заряду цього заклинання залежить від того, який предмет був використаний нещодавно: 2 за рунний камінь, 3 за сувій, 4 за екзотичний сувій. Ця вартість заряду також подвоюється при використанні зі сувоєм трансмутації або алхімічними предметами, які необхідно створити за допомогою трансмутації або покращення.
actors.hero.talent.recall_inscription.meta_desc=_Якщо цей талант отримує інший герой_, він натомість поверне будь-який сувій або рунний камінь у 10% випадків при +1 або в 15% випадків при +2. Сувої покращення не підпадають під цей ефект.
actors.hero.talent.recall_inscription.refunded=Ваш товар було повернено!
actors.hero.talent.recall_inscription.title=напис про відкликання
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Коли Мисливиця наступає на коротку траву або жарину, вона вистрибує у високу траву, яку Мисливиця негайно вирощує. Час відновлення _10 ходів_.\n\n_+2:_ Коли Мисливиця наступає на коротку траву або жарину, вона вистрибує у високу траву, яку Мисливиця негайно вирощує. Час відновлення _5 ходів_.\n\nЦей талант створить борознисту траву, якщо пасивні ефекти регенерації вимкнені або герой давно не отримував досвіду.
actors.hero.talent.rejuvenating_steps.title=омолоджувальні кроки
actors.hero.talent.remote_beacon.desc=_+1:_ Маг може розмістити маяк у будь-якому місці в межах _4 плиток_.\n\n_+2:_ Маг може розмістити маяк у будь-якому місці в межах _8 плиток_.\n\n_+3:_ Маг може розмістити маяк у будь-якому місці в межах _12 плиток_.\n\n_+4:_ Маг може розмістити маяк у будь-якому місці в межах _16 плиток_.\n\nМаг не може розміщувати маяки в недоступних місцях.
actors.hero.talent.remote_beacon.title=Дистанційний маяк
actors.hero.talent.rogues_foresight.desc=_+1:_ Коли Розбійник знаходиться на рівні з таємною кімнатою, він має _75% шанс помітити_, що рівень містить секрет.\n\n_+2:_ Коли Розбійник знаходиться на рівні з таємною кімнатою, він має _100% шанс помітити_, що рівень містить секрет.
actors.hero.talent.rogues_foresight.title=передбачливість шахрая
actors.hero.talent.runic_transference.desc=_+1:_ Зламана печатка Воїна може передавати _звичайні гліфи_ так само, як вона передає покращення.\n\n_+2:_ Зламана печатка Воїна може передавати _звичайні, потужні та прокляті гліфи_ так само, як вона передає покращення.\n\nПечатка може передавати гліфи, лише якщо вони були нанесені на броню під час прикріплення печатки.
actors.hero.talent.runic_transference.meta_desc=_Якщо цей талант отримує інший герой_, він натомість допоможе гліфам на вашій броні протистояти видаленню сувоями покращення. Гліфи почнуть втрачатися під час покращення з 6-го рівня (з 4-го) на +1 або з 7-го рівня (з 4-го) на +2. Рівень, на якому гарантовано втрачаються гліфи, не змінився на +8.
actors.hero.talent.runic_transference.title=рунічний перенос
actors.hero.talent.satiated_spells.desc=_+1:_ Вживання їжі призводить до того, що Клірик отримує _3 одиниці захисту_ наступного разу, коли він читає заклинання.\n\n_+2:_ Вживання їжі призводить до того, що Клірик отримує _5 одиниць захисту_ наступного разу, коли він читає заклинання.
actors.hero.talent.satiated_spells.meta_desc=_Якщо цей талант отримує інший герой_, він натомість одразу надасть щит, який почне зникати після 10 ходів.
actors.hero.talent.satiated_spells.title=Ситі заклинання
actors.hero.talent.scholars_intuition.desc=_+1:_ Маг розпізнає чарівні палички _втричі швидше_.\n\n_+2:_ Маг розпізнає чарівні палички _коли він їх використовує_.
actors.hero.talent.scholars_intuition.title=інтуїція вченого
actors.hero.talent.searing_light.desc=_+1:_ Фізичні атаки Клірика по ворогах, освітлених _Провідним Світлом_, завдають _+3 одиниці шкоди._\n\n_+2:_ Фізичні атаки Клірика по ворогах, освітлених _Провідним Світлом_, завдають _+5 одиниць шкоди._
actors.hero.talent.searing_light.meta_desc=_Якщо цей талант отримує інший герой_, він натомість надаватиме додаткову шкоду після використання чарівної палички або артефакту на ворогові, з часом відновлення 20 ходів.
actors.hero.talent.searing_light.title=Палюче світло
actors.hero.talent.seer_shot.desc=_+1:_ Коли Мисливиця стріляє в землю, вона надає зір у зоні 3x3 навколо неї на _5 ходів_. Час відновлення 20 ходів.\n\n_+2:_ Коли Мисливиця стріляє в землю, вона надає зір у зоні 3x3 навколо неї на _10 ходів_. Час відновлення 20 ходів.\n\n_+3:_ Коли Мисливиця стріляє в землю, вона надає зір у зоні 3x3 навколо неї на _15 ходів_. Час відновлення 20 ходів.
actors.hero.talent.seer_shot.meta_desc=_Якщо цей талант отримує інший герой_, він спрацює від будь-якої кинутої зброї.
actors.hero.talent.seer_shot.title=постріл провидця
actors.hero.talent.shadow_blade.desc=_+1:_ Тіньовий клон отримує _8%_ шкоди героя за хід та має _25% шанс_ використати чари на зброї героя.\n\n_+2:_ Тіньовий клон отримує _16%_ шкоди героя за хід та має _50% шанс_ використати чари на зброї героя.\n\n_+3:_ Тіньовий клон отримує _24%_ шкоди героя за хід та має _75% шанс_ використати чари на зброї героя.\n\n_+4:_ Тіньовий клон отримує _32%_ шкоди героя за хід та має _100% шанс_ використати чари на зброї героя.
actors.hero.talent.shadow_blade.title=тіньовий клинок
actors.hero.talent.shadow_step.desc=_+1:_ Якщо розбійник використовує димову бомбу, будучи невидимим, це відбувається миттєво та має _16% знижену_ вартість заряду, але також не засліплює ворогів і не активує інші таланти.\n\n_+2:_ Якщо розбійник використовує димову бомбу, будучи невидимим, це відбувається миттєво та має _30% знижену_ вартість заряду, але також не засліплює ворогів і не активує інші таланти.\n\n_+3:_ Якщо розбійник використовує димову бомбу, будучи невидимим, це відбувається миттєво та має _41% знижену_ вартість заряду, але також не засліплює ворогів і не активує інші таланти.\n\n_+4:_ Якщо розбійник використовує димову бомбу, будучи невидимим, це відбувається миттєво та має _50% знижену_ вартість заряду, але також не засліплює ворогів і не активує інші таланти.
actors.hero.talent.shadow_step.title=тіньовий крок
actors.hero.talent.shared_enchantment.desc=_+1:_ Метальна зброя має _33% шанс_ використати чари на луку снайпера.\n\n_+2:_ Метальна зброя має _67% шанс_ використати чари на луку снайпера.\n\n_+3:_ Метальна зброя має _100% шанс_ використати чари на луку снайпера.\n\n Чари лука можуть спрацювати на додаток до будь-яких чарів, які вже має кинута зброя.
actors.hero.talent.shared_enchantment.title=спільне зачарування
actors.hero.talent.shared_upgrades.desc=_+1:_ Коли снайпер атакує покращеною метальною зброєю, кожен рівень збільшує тривалість дії снайперської позначки на 1 хід та шкоду від її спеціальної атаки на 16%, максимум до _2 ходів та +33% шкоди при +2_.\n\n_+2:_ Коли снайпер атакує покращеною метальною зброєю, кожен рівень збільшує тривалість дії снайперської позначки на 1 хід та шкоду від її спеціальної атаки на 16%, максимум до _4 ходів та +67% шкоди при +4_.\n\n_+3:_ Коли снайпер атакує покращеною метальною зброєю, кожен рівень збільшує тривалість дії снайперської позначки на 1 хід та шкоду від її спеціальної атаки на 16%, максимум до _6 ходів та +100% шкоди при +6_.
actors.hero.talent.shared_upgrades.title=спільні оновлення
actors.hero.talent.shield_battery.desc=_+1:_ Маг може самостійно прицілюватися паличкою, щоб перетворити всі свої заряди на щит зі швидкістю _4% макс. HP за заряд_.\n\n_+2:_ Маг може самостійно прицілюватися паличкою, щоб перетворити всі свої заряди на щит зі швидкістю _6% макс. HP за заряд_.
actors.hero.talent.shield_battery.title=щитова батарея
actors.hero.talent.shield_of_light.desc=_+1:_ Клірик може застосувати _Щит Світла_, заклинання, яке застосовується миттєво та надає йому _2-4 броні_ проти цілі протягом 5 ходів ціною 1 заряду.\n\n_+2:_ Клірик може застосувати _Щит Світла_, заклинання, яке застосовується миттєво та надає йому _3-6 броні_ проти цілі протягом 5 ходів ціною 1 заряду.
actors.hero.talent.shield_of_light.meta_desc=_Якщо цей талант отримує інший герой_, він натомість зменшить фізичну шкоду, яку отримує ваш цільовий ворог, на 1, у 33% випадків при +1 або у 50% випадків при +2.
actors.hero.talent.shield_of_light.title=щит світла
actors.hero.talent.shielding_dew.desc=_+1:_ Краплі роси можуть захистити Вартову, коли її здоров'я повне, до _20% її максимального здоров'я_.\n\n_+2:_ Краплі роси можуть захистити Вартову, коли її здоров'я повне, до _40% її максимального здоров'я_.\n\n_+3:_ Краплі роси можуть захистити Вартову, коли її здоров'я повне, до _60% її максимального здоров'я_.
actors.hero.talent.shielding_dew.title=захисна роса
actors.hero.talent.shock_force.desc=_+1:_ Ударна хвиля завдає _на _20% більше шкоди_ та має _25% шанс_ оглушити замість каліцтва.\n\n_+2:_ Ударна хвиля завдає _на _40% більше шкоди_ та має _50% шанс_ оглушити замість каліцтва.\n\n_+3:_ Ударна хвиля завдає _на _60% більше шкоди_ та має _75% шанс_ оглушити замість каліцтва.\n\n_+4:_ Ударна хвиля завдає _на _80% більше шкоди_ та має _100% шанс_ оглушити замість каліцтва.
actors.hero.talent.shock_force.title=ударна сила
actors.hero.talent.shrug_it_off.desc=_+1:_ Зменшення шкоди Воїна під час витривалості _збільшено до 60%_, замість 50%.\n\n_+2:_ Зменшення шкоди Воїна під час витривалості _збільшено до 68%_, замість 50%.\n\n_+3:_ Зменшення шкоди Воїна під час витривалості _збільшено до 74%_, замість 50%.\n\n_+4:_ Зменшення шкоди Воїна під час витривалості _збільшено до 80%_, замість 50%.
actors.hero.talent.shrug_it_off.title=відмахнутися від цього
actors.hero.talent.silent_steps.desc=_+1:_ Розбійник не розбудить сплячих ворогів, якщо він знаходиться на відстані _3 або більше клітинок від них_.\n\n_+2:_ Розбійник не розбудить сплячих ворогів, якщо він _не знаходиться поруч з ними_.
actors.hero.talent.silent_steps.title=тихі кроки
actors.hero.talent.soul_eater.desc=_+1:_ Мітка душі дає _0,33 ходу_ ситості за кожну завдану фізичну шкоду. Вороги з позначкою душі мають _10% шанс_ спрацювати ефекти "поїдання" після смерті.\n\n_+2:_ Мітка душі дає _0,67 ходу_ ситості за кожну завдану фізичну шкоду. Вороги з позначкою душі мають _20% шанс_ спрацювати ефекти "поїдання" після смерті.\n\n_+3:_ Мітка душі дає _1 хід_ ситості за кожну завдану фізичну шкоду. Вороги з позначкою душі мають _30% шанс_ спрацювати ефекти "поїдання" після смерті.
actors.hero.talent.soul_eater.title=пожирач душ
actors.hero.talent.soul_siphon.desc=_+1:_ Фізична шкода, завдана іншими персонажами, активує мітку душі Чаклуна з _13% ефективності_.\n\n_+2:_ Фізична шкода, завдана іншими персонажами, активує мітку душі Чаклуна з _27% ефективності_.\n\n_+3:_ Фізична шкода, завдана іншими персонажами, активує мітку душі Чаклуна з _40% ефективності_.
actors.hero.talent.soul_siphon.title=сифон душі
actors.hero.talent.speedy_stealth.desc=_+1:_ Вільний бігун отримує 2 заряди імпульсу за хід, поки він невидимий.\n\n_+2:_ На додаток до переваг +1, зворотний відлік вільного бігу більше не здійснюється, поки Вільний бігун невидимий.\n\n_+3:_ На додаток до переваг +1 та +2, Вільний бігун рухається зі швидкістю вдвічі швидше, поки він невидимий, незалежно від того, чи він вільно бігає чи ні.
actors.hero.talent.speedy_stealth.title=швидкий стелс
actors.hero.talent.spirit_blades.desc=_+1:_ Спектральні клинки мають _30% шанс_ також використовувати чари на духівському луку.\n\n_+2:_ Спектральні клинки мають _60% шанс_ також використовувати чари на духівському луку.\n\n_+3:_ Спектральні клинки мають _90% шанс_ також використовувати чари на духівському луку.\n\n_+4:_ Спектральні клинки мають _100% шанс_ також використовувати чари на духівському луку, і це дає кожній чарівності _+10% сили_.
actors.hero.talent.spirit_blades.title=спіритичні леза
actors.hero.talent.spirit_form.desc=Клірик може застосувати _Форму Духа_, яка наділяє Трійцю силою кільця або артефакту, який Клірик визначив у цьому пробігу (крім священного тому), ціною 4 зарядів. \n\n_+1:_ Коли використовується Трійця, Клірик отримує ефект кільця о _+1_ на 20 ходів або активує ефект артефакту о _+4._\n\n_+2:_ Коли використовується Трійця, Клірик отримує ефект кільця о _+2_ на 20 ходів або активує ефект артефакту о _+6._\n\n_+3:_ Коли використовується Трійця, Клірик отримує ефект кільця о _+3_ на 20 ходів або активує ефект артефакту о _+8._\n\n_+4:_ Коли використовується Трійця, Клірик отримує ефект кільця о _+4_ на 20 ходів або активує ефект артефакту о _+10._\n\nТрійця може бути наповнена лише одним ефектом духу за раз. Артефакти мають різні ефекти та вартість заряду броні, коли активуються Трійцею.
actors.hero.talent.spirit_form.title=духовна форма
actors.hero.talent.stasis.desc=Клірик може застосувати _Стазис_ на союзника, що має сили, витративши 2 заряди. Стазис тимчасово виводить союзника з підземелля та зберігає час, що залишився, на всіх посиленнях, включаючи Силу багатьох. Союзник знову з'явиться поруч із вами, коли ефект закінчиться. Стазис можна застосувати повторно миттєво та безкоштовно, щоб передчасно завершити ефект. Стазис діє на нерухомих союзників, але не може переміщувати їх між поверхами підземелля.\n\n_+1:_ Стазис триває максимум _60 ходів._\n\n_+2:_ Стазис триває максимум _90 ходів._\n\n_+3:_ Стазис триває максимум _120 ходів._\n\n_+4:_ Стазис триває максимум _150 ходів._\n\nКлірик також може використовувати «Промінь життя», коли союзник перебуває в стазисі, щоб повторно викликати його, або використовувати «Зв'язок життя», щоб превентивно застосувати його ефект. Однак союзники не отримують користі від «Зв'язку життя», перебуваючи в стазисі.
actors.hero.talent.stasis.title=стаз
actors.hero.talent.strengthening_meal.desc=_+1:_ Вживання їжі дає Дуелянтці 3 бонусні одиниці шкоди наступні _2 рази_, коли вона вражає ворога фізичною атакою.\n\n_+2:_ Вживання їжі дає Дуелянтці 3 бонусні одиниці шкоди наступні _3 рази_, коли вона вражає ворога фізичною атакою.
actors.hero.talent.strengthening_meal.title=зміцнювальний прийом їжі
actors.hero.talent.striking_force.desc=_+1:_ Потужність ефекту стихійного удару збільшена на _30%_.\n\n_+2:_ Потужність ефекту стихійного удару збільшена на _60%_.\n\n_+3:_ Потужність ефекту стихійного удару збільшена на _90%_.\n\n_+4:_ Потужність ефекту стихійного удару збільшена на _120%_.
actors.hero.talent.striking_force.title=ударна сила
actors.hero.talent.striking_wave.desc=_+1:_ У Шоквейва є _30% шанс_ також використовувати ефекти під час удару, такі як чари та комбо.\n\n_+2:_ У Шоквейва є _60% шанс_ також використовувати ефекти під час удару, такі як чари та комбо.\n\n_+3:_ У Шоквейва є _90% шанс_ також використовувати ефекти під час удару, такі як чари та комбо.\n\n_+4:_ У Шоквейва є _100% шанс_ також використовувати ефекти під час удару, такі як чари та комбо, і він дає чарам _+20% сили_.
actors.hero.talent.striking_wave.title=ударна хвиля
actors.hero.talent.strongman.desc=_+1:_ Сила Воїна _збільшується на 8%_, округляється вниз.\n\n_+2:_ Сила Воїна _збільшується на 13%_, округляється вниз.\n\n_+3:_ Сила Воїна _збільшується на 18%_, округляється вниз.
actors.hero.talent.strongman.title=силач
actors.hero.talent.sucker_punch.desc=_+1:_ Розбійник завдає _1-2 бонусної шкоди_ під час першої несподіваної атаки ворога.\n\n_+2:_ Розбійник завдає _2 бонусної шкоди_ під час першої несподіваної атаки ворога.
actors.hero.talent.sucker_punch.title=присоска
actors.hero.talent.sunray.desc=_+1:_ Клірик може застосувати _Сонячний промінь_, заклинання, яке завдає _4-8 одиниць шкоди_ та засліплює ціль на _4 ходи,_ ціною 1 заряду.\n\n_+2:_ Клірик може застосувати _Сонячний промінь_, заклинання, яке завдає _6-12 одиниць шкоди_ та засліплює ціль на _6 ходів,_ ціною 1 заряду.\n\nСонячний промінь може засліпити кожну ціль лише один раз, але якщо ціль вже засліплена Сонячним променем, то він паралізує її. Сонячний промінь завжди завдає максимальної шкоди демонічним та немертвим ворогам.
actors.hero.talent.sunray.meta_desc=_Якщо цей талант отримує інший герой_, він натомість призведе до того, що чарівні палички та артефакти засліплюватимуть ворогів на 4 ходи, 15% часу при +1 або 25% часу при +2.
actors.hero.talent.sunray.title=сонячний промінь
actors.hero.talent.survivalists_intuition.desc=_+1:_ Мисливиця розпізнає метну зброю _втричі швидше_.\n\n_+2:_ Мисливиця розпізнає метну зброю, _коли б'є нею_.
actors.hero.talent.survivalists_intuition.title=інтуїція виживальника
actors.hero.talent.sustained_retribution.desc=_+1:_ Воїн завдає _115% додаткової шкоди_, розподіленої на _2 удари_, замість 100% додаткової шкоди за 1 удар.\n\n_+2:_ Воїн завдає _130% додаткової шкоди_, розподіленої на _3 удари_, замість 100% додаткової шкоди за 1 удар.\n\n_+3:_ Воїн завдає _145% додаткової шкоди_, розподіленої на _4 удари_, замість 100% додаткової шкоди за 1 удар.\n\n_+4:_ Воїн завдає _160% додаткової шкоди_, розподіленої на _5 ударів_, замість 100% додаткової шкоди за 1 удар.
actors.hero.talent.sustained_retribution.title=постійна відплата
actors.hero.talent.swift_equip.desc=_+1:_ Дуелянт може миттєво змінювати свою споряджену зброю _один раз_ кожні 20 ходів.\n\n_+2:_ Дуелянт може миттєво змінювати свою споряджену зброю _два рази_ кожні 20 ходів.\n\nЯкщо Дуелянт має цей талант і він не перезаряджається, швидке використання неспорядженої зброї дозволить його спорядити.
actors.hero.talent.swift_equip.title=швидке спорядження
actors.hero.talent.swift_spirit.desc=_+1:_ Швидкість пересування духа-яструба збільшена з 2 до _2,5 клітинок_, і він гарантовано ухилиться від перших _2 атак_, здійснених проти нього.\n\n_+2:_ Швидкість пересування духа-яструба збільшена з 2 до _3 клітинок_, і він гарантовано ухилиться від перших _4 атак_, здійснених проти нього.\n\n_+3:_ Швидкість пересування духа-яструба збільшена з 2 до _3,5 клітинок_, і він гарантовано ухилиться від перших _6 атак_, здійснених проти нього.\n\n_+4:_ Швидкість пересування духа-яструба збільшена з 2 до _4 клітинок_, і він гарантовано ухилиться від перших _8 атак_, здійснених проти нього.
actors.hero.talent.swift_spirit.title=швидкий дух
actors.hero.talent.telefrag.desc=_+1:_ Якщо Маг перетворюється на іншого персонажа, він завдає йому _10-15 одиниць шкоди_, але також отримує _5 одиниць шкоди_.\n\n_+2:_ Якщо Маг перетворюється на іншого персонажа, він завдає йому _20-30 одиниць шкоди_, але також отримує _10 одиниць шкоди_.\n\n_+3:_ Якщо Маг перетворюється на іншого персонажа, він завдає йому _30-45 одиниць шкоди_, але також отримує _15 одиниць шкоди_.\n\n_+4:_ Якщо Маг перетворюється на іншого персонажа, він завдає йому _40-60 одиниць шкоди_, але також отримує _20 одиниць шкоди_.\n\nГероя не можна вбити цим талантом, пошкодження себе можна зменшити за допомогою ефектів опору магії.
actors.hero.talent.telefrag.title=Телефраг
actors.hero.talent.thiefs_intuition.desc=_+1:_ Розбійник розпізнає кільця _вдвічі швидше_ та визначає тип кільця _коли його одягає_.\n\n_+2:_ Розбійник розпізнає кільця _коли їх одягає_ та визначає тип кільця _коли його піднімає_.
actors.hero.talent.thiefs_intuition.title=інтуїція злодія
actors.hero.talent.twin_upgrades.desc=_+1:_ Якщо одна з двох екіпірованих зброї Чемпіона має нижчий рівень і _на 2 або більше рівнів нижча_ за іншу зброю, її буде підвищено до рівня іншої зброї.\n\n_+2:_ Якщо одна з двох екіпірованих зброї Чемпіона має нижчий рівень і _на 1 або більше рівнів нижча_ за іншу зброю, її буде підвищено до рівня іншої зброї.\n\n_+3:_ Якщо одна з двох екіпірованих зброї Чемпіона має нижчий рівень і _того ж рівня або нижчого_ за іншу зброю, її буде підвищено до рівня іншої зброї.
actors.hero.talent.twin_upgrades.title=подвійні оновлення
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Чернець отримує _на _50% більше енергії_ за кожен предмет спорядження _3-го рівня або нижче_, який він використовує.\n\n_+2:_ Чернець отримує _на _75% більше енергії_ за кожен предмет спорядження _2-го рівня або нижче_, який він використовує. Перевага 3-го рівня залишається незмінною.\n\n_+3:_ Чернець отримує _на _100% більше енергії_ за кожен предмет спорядження _1-го рівня або нижче_, який він використовує. Переваги 2-го та 3-го рівнів залишаються незмінними. Він також отримує безкоштовні тканинні обладунки та рукавички з шипами.\n\nЗверніть увагу, що цей талант не дає переваг від того, що він беззбройний або атакує Кільцем Сили.
actors.hero.talent.unencumbered_spirit.title=необтяжений дух
actors.hero.talent.varied_charge.desc=_+1:_ Чемпіонка миттєво відновлює _0,17 заряду зброї_, коли використовує дві різні здібності зброї, без обмеження часу.\n\n_+2:_ Чемпіонка миттєво відновлює _0,33 заряду зброї_, коли використовує дві різні здібності зброї, без обмеження часу.\n\n_+3:_ Чемпіонка миттєво відновлює _0,5 заряду зброї_, коли використовує дві різні здібності зброї, без обмеження часу.
actors.hero.talent.varied_charge.title=різноманітний заряд
actors.hero.talent.veterans_intuition.desc=_+1:_ Воїн розпізнає зброю _1,75 раза швидше_ та броню _2,5 раза швидше_.\n\n_+2:_ Воїн розпізнає зброю _2,5 раза швидше_ та броню _коли він її екіпірує_.
actors.hero.talent.veterans_intuition.title=інтуїція ветерана
actors.hero.talent.wall_of_light.desc=_+1:_ Паладин може застосувати _Стіну Світла_, заклинання, яке створює перед Паладином суцільну стіну завширшки _3 клітинки_, що відштовхує ворогів і триває 20 ходів, ціною 3 зарядів.\n\n_+2:_ Паладин може застосувати _Стіну Світла_, заклинання, яке створює перед Паладином суцільну стіну завширшки _5 клітинок_, що відштовхує ворогів і триває 20 ходів, ціною 3 зарядів.\n\n_+3:_ Паладин може застосувати _Стіну Світла_, заклинання, яке створює перед Паладином суцільну стіну завширшки _7 клітинок_, що відштовхує ворогів і триває 20 ходів, ціною 3 зарядів.\n\nСтіну можна розмістити по кардиналах або по діагоналі, одночасно може існувати лише одна стіна.
actors.hero.talent.wall_of_light.title=стіна світла
actors.hero.talent.wand_preservation.desc=_+1:_ Коли Маг вселяє нову паличку у свій посох, стара паличка повертається з +0, _але це можна зробити лише один раз._\n\n_+2:_ Коли Маг вселяє нову паличку у свій посох, стара паличка повертається з +0, _це можна повторити з часом відновлення одного рівня героя._
actors.hero.talent.wand_preservation.meta_desc=_Якщо цей талант отримує інший герой_, він натомість збільшить кількість арканної смоли, яку отримується при поміщенні палички в алхімічний горщик, на 1 при +1 або на 2 при +2.
actors.hero.talent.wand_preservation.title=збереження палички
actors.hero.talent.weapon_recharging.desc=_+1:_ Дуелянт отримує один заряд зброї кожні _15 ходів_, коли перебуває під дією посилення перезарядки чарівної палички або артефакту.\n\n_+2:_ Дуелянт отримує один заряд зброї кожні _10 ходів_, коли перебуває під дією посилення перезарядки чарівної палички або артефакту.
actors.hero.talent.weapon_recharging.meta_desc=_Якщо цей талант отримує інший герой_, він натомість завдаватиме +5% шкоди в ближньому бою під час перезарядки на +1 або +7,5% шкоди в ближньому бою під час перезарядки на +2.
actors.hero.talent.weapon_recharging.title=перезаряджання зброї
actors.hero.talent.wide_search.desc=_+1:_ Радіус пошуку Розбійника збільшено з квадрата 5x5 до _кола 7x7_.\n\n_+2:_ Радіус пошуку Розбійника збільшено з квадрата 5x5 до квадрата _7x7_.
actors.hero.talent.wide_search.meta_desc=_Якщо цей талант отримує інший герой_, він натомість збільшить його радіус пошуку з квадрата 3x3 до кола 5x5 при +1 або до квадрата 5x5 при +2.
actors.hero.talent.wide_search.title=широкий пошук
actors.hero.talent.wild_momentum.desc=_+1:_ Вбивство ворога духівським луком продовжує тривалість сили природи на _1 хід_. Тривалість можна збільшити максимум на _2 ходи_.\n\n_+2:_ Вбивство ворога духівським луком продовжує тривалість сили природи на _2 ходи_. Тривалість можна збільшити максимум на _4 ходи_.\n\n_+3:_ Вбивство ворога духівським луком продовжує тривалість сили природи на _3 ходи_. Тривалість можна збільшити максимум на _6 ходів_.\n\n_+4:_ Вбивство ворога духівським луком продовжує тривалість сили природи на _4 ходи_. Тривалість можна збільшити максимум на _8 ходів_.
actors.hero.talent.wild_momentum.title=шалений імпульс
actors.hero.talent.wild_power.desc=_+1:_ Під час використання дикої магії, палички будуть посилені на _2 або 3, до +4_.\n\n_+2:_ Під час використання дикої магії, палички будуть посилені на _3, до +5_.\n\n_+3:_ Під час використання дикої магії, палички будуть посилені на _3 або 4, до +6_.\n\n_+4:_ Під час використання дикої магії, палички будуть посилені на _4, до +7_.
actors.hero.talent.wild_power.title=дика сила
actors.mobs.acidic.desc=Ці величезні демонічні істоти, схожі на павукоподібних, уникають ближнього бою, вважаючи за краще стріляти калічачими зазубреними шипами з великих відстаней. Здається, що ця просякнута їдким слизом.
actors.mobs.acidic.name=кислий скорпіон
actors.mobs.albino.desc=Це рідкісна порода сумчастих щурів з чисто білим хутром та гострими зубами.
actors.mobs.albino.discover_hint=Цього ворога рідко можна знайти в певному регіоні підземелля.
actors.mobs.albino.name=альбіносний пацюк
actors.mobs.armoredbrute.desc=Найстарші гнолли-брути часто носять потужні обладунки, щоб показати свій статус. Обладунки роблять цих бруталів набагато стійкішими до фізичної шкоди, а їхня більша дисципліна означає, що вони можуть лютувати набагато довше, перш ніж піддатися ранам.
actors.mobs.armoredbrute.name=броньований звір
actors.mobs.armoredstatue.desc=Можна було б подумати, що це просто ще одна з неживих статуй цього підземелля, але її червоні сяючі очі видають її. \n\nЗдається, вона у відмінному стані, завдяки броні, яку вона носить, її може бути дуже важко вбити.
actors.mobs.armoredstatue.desc_arm_wep=Хоча сама статуя зроблена з каменю, _%1$s_ та _%2$s_, які вона тримає, виглядають справжніми.
actors.mobs.armoredstatue.name=броньована статуя
actors.mobs.bandit.desc=Глибші рівні підземелля завжди були схованкою для всіляких злочинців. Не всі з них могли зберігати ясність розуму протягом тривалого перебування так далеко від денного світла. Давно ці божевільні злодії та бандити забули, хто вони і чому крадуть.
actors.mobs.bandit.name=божевільний бандит
actors.mobs.bat.desc=Ці жваві та наполегливі мешканці печер набагато небезпечніші, ніж здаються. Вони поповнюють своє здоров'я з кожною успішною атакою, що дозволяє їм перемагати набагато більших супротивників.
actors.mobs.bat.name=кажан-вампір
actors.mobs.bee.desc=Незважаючи на свій невеликий розмір, золотисті бджоли, як правило, люто захищають свій дім. Ця дуже злісна, краще триматися на відстані.
actors.mobs.bee.desc_honey=Незважаючи на свій невеликий розмір, золотисті бджоли, як правило, люто захищають свій дім. Цю заспокоїли, і вона, здається, хоче слідувати за вами.
actors.mobs.bee.discover_hint=Ви можете знайти цього персонажа за допомогою певного предмета.
actors.mobs.bee.name=золота бджола
actors.mobs.brute$bruterage.desc=Цей гнол-звірюка помирає, але хоче забрати тебе з собою!\n\nЗвірюка помре, коли її щит зникне, або з часом, або через пошкодження. Тим часом вона завдаватиме значно більшої шкоди, тож будьте обережні!\n\nЗалишок щита: %d.
actors.mobs.brute$bruterage.name=груба лють
actors.mobs.brute.def_verb=заблоковано
actors.mobs.brute.desc=Здоровані — найбільші, найсильніші та найвитриваліші з усіх гнолів. Від тяжких поранень вони шаленіють і завдають ворогам ще більшої шкоди.
actors.mobs.brute.enraged=розлючений
actors.mobs.brute.name=гнол-здоровань
actors.mobs.causticslime.desc=Здається, цей слиз заплямований темною магією, що виходить знизу. Він втратив свій звичний зелений колір і стікає їдким слизом.
actors.mobs.causticslime.discover_hint=Цього ворога рідко можна знайти в певному регіоні підземелля.
actors.mobs.causticslime.name=їдкий слиз
actors.mobs.crab.desc=Ці величезні краби знаходяться на вершині харчового ланцюга в каналізації. Вони надзвичайно швидкі, а їхній товстий панцир може витримувати сильні удари.
actors.mobs.crab.name=каналізаційний краб
actors.mobs.crystalguardian.def_verb=заблоковано
actors.mobs.crystalguardian.desc=Ці великі кристалічні охоронці майже схожі на статуї, якби не їхні яскраві сяючі очі. Затверділий кристал, з якого вони зроблені, робить їх млявими, але дуже витривалими, тому _найкраще залишити їх спати у своєму кристалічному гнізді якомога довше._\n\nЧерез свій розмір кристалічні охоронці рухаються набагато повільніше у закритих просторах. Вони також настільки витривалі, що їх неможливо вбити одразу. Їх можна збити та тимчасово вивести з ладу, але вони знову встають через деякий час.
actors.mobs.crystalguardian.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.crystalguardian.name=кришталевий охоронець
actors.mobs.crystalmimic.ate=Імітатор з'їв твій %s!
actors.mobs.crystalmimic.desc=Міміки — це магічні істоти, які можуть приймати будь-яку форму, яку забажають. У підземеллях вони майже завжди обирають форму скрині зі скарбами, щоб заманити нічого не підозрюючих шукачів пригод. \n\nКришталеві міміки хитріші за своїх звичайних родичів і воліють уникати конфліктів під час крадіжки здобичі. Вони намагатимуться втекти, як тільки їх виявлять, і мають здатність переміщувати ворогів під час атаки.
actors.mobs.crystalmimic.escaped=Кришталевий імітатор втік!
actors.mobs.crystalmimic.name=кристалічний імітатор
actors.mobs.crystalspire.alert=Вібрація наростає і гуркотить по всій печері!
actors.mobs.crystalspire.desc=Цей гігантський шпиль надтвердого кристала, ймовірно, є джерелом усіх дивних кристалічних істот у цій печері. Ваша звичайна зброя неефективна проти нього, тому вам доведеться скористатися киркою, якщо ви хочете його знищити.\n\n_Переконайтеся, що ви готові, перш ніж почати його ламати._ Видобуток такого великого кристала, ймовірно, займе деякий час, і ви, ймовірно, не зможете зробити це спокійно. Сам шпиль може навіть мати якісь засоби для самозахисту._Можливо, власні атаки шпиля можна було б використовувати проти його поплічників._
actors.mobs.crystalspire.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.crystalspire.name=кришталевий шпиль
actors.mobs.crystalspire.warning=Кришталь вібрує, коли ви по ньому вдаряєте. Якщо ви будете продовжувати це робити, це обов'язково приверне до вас увагу...
actors.mobs.crystalwisp.beam_kill=Промінь світла вбив тебе...
actors.mobs.crystalwisp.desc=Невеликий розлючений плавучий шматок затверділого кристала, який випромінює яскраве сяйво. Хоча кришталеві клаптики не особливо сильні, вони вистрілять у вас руйнівним променем світла, якщо мають чіткий постріл. \n\nКлапки достатньо малі, щоб легко пересуватися крізь різні кристалічні виступи, але вони не здатні пробити їх.
actors.mobs.crystalwisp.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.crystalwisp.name=кришталевий клаптик
actors.mobs.demonspawner.desc=Ця викривлена амальгама гномьої плоті відповідає за створення демонів-розпорювачів з гномів, які загинули в цьому регіоні. Очевидно, що демони не бачать проблем у використанні всіх можливих ресурсів проти своїх ворогів.\n\nХоча візуально жахливі, демони-породжувачі не мають засобів для пересування чи безпосереднього захисту. Однак їхня значна маса ускладнює їх швидке вбивство, і вони швидше породжуватимуть демонів-розпорювачів, коли їм загрожує небезпека.\n\n_Демони-породжувачі, здається, пов'язані з якимось центральним джерелом демонічної сили. Їх вбивство може послабити його._
actors.mobs.demonspawner.name=породжувач демонів
actors.mobs.demonspawner.on_death=Демонічна енергія тут, здається, зменшується, коли породжувач помирає.
actors.mobs.dm100.desc=DM-100 — це рання модель гномьої «захисної машини», розробленої для захисту гномьих шахтарів у печерах під цією в'язницею. Однак їхні електричні удари виявилися занадто слабкими, тому їх подарували людському місту нагорі. Вони роками не використовувалися і зрештою потрапили до в'язниці, де наглядач спочатку вважав їх занадто жорстокими для використання. Однак, коли в'язні ставали дедалі більш неслухняними, вони стали необхідністю.
actors.mobs.dm100.name=ДМ-100
actors.mobs.dm100.zap_kill=Блискавка вбила тебе...
actors.mobs.dm200.desc=DM-200 — це друге покоління гномьої «оборонної машини», розробленої для захисту гномьих шахтарів у печерах та місті внизу. Вони набагато більші та громіздкіші за своїх попередників і атакують руйнівними гідравлічними кулаками. \n\nЇхній збільшений розмір також є їхньою основною слабкістю, оскільки вони не можуть поміститися у вузькі тунелі та дверні отвори підземелля. Гноми змогли компенсувати недостатню мобільність DM-200, дозволяючи їм випускати свої токсичні вихлопні гази на віддалених ворогів або ворогів, до яких вони не можуть дістатися.
actors.mobs.dm200.name=ДМ-200
actors.mobs.dm200.vent=DM-200 випускає струмінь токсичних вихлопних газів!
actors.mobs.dm201.desc=Гноми недовго експериментували, підкреслюючи відсутність мобільності DM-200, і створили деякі повністю стаціонарні моделі DM. DM-201 — це модернізована DM-200, яка діє як вартова вежа без можливості пересування. В обмін на відсутність мобільності, DM-201 мають значно більшу міцність та атакуючу силу. \n\nA Оскільки DM-201 не мають двигуна для випуску вихлопних газів, гноми натомість оснастили їх гранатами з корозійним газом! Однак DM-201 обережні з цими гранатами та кидають їх лише під час атаки здалеку.
actors.mobs.dm201.name=ДМ-201
actors.mobs.dm201.vent=DM-201 кидає корозійну гранату!
actors.mobs.dm300.charge_lost=ПІЛОН ЗРУЙНОВАНО! ПОВЕРТАЄМОСЯ ДО МІСЦЕВОГО ЕЛЕКТРОМОБІЛЮВАННЯ!
actors.mobs.dm300.charging=ПОШКОДЖЕННЯ! АКТИВАЦІЯ ЕНЕРГЕТИЧНОГО ПІЛОНА!
actors.mobs.dm300.charging_hint=DM-300 невразливий, поки його заряджає пілон!
actors.mobs.dm300.def_verb=заблоковано
actors.mobs.dm300.defeated=КРИТИЧНІ ПОШКОДЖЕННЯ! СПРОБА ЗАКРИТТЯ-
actors.mobs.dm300.desc=Цю машину створили дворфи кілька століть тому. Згодом вони почали замінювати машини големами, елементалями й навіть демонами. Зрештою це призвело до занепаду їхньої цивілізації. DM-300 та подібні машини зазвичай працювали на будівництві й у шахтах, а часом і захищали місто.
actors.mobs.dm300.desc_supercharged=DM-300 зараз повністю заряджений електричною енергією. У цьому вигляді DM-300 не може бути пошкоджений і рухається з подвійною швидкістю! Крім того, його бур тепер обертається достатньо швидко, щоб _прокладати тунелі крізь тверду породу_, хоча при цьому він рухається набагато повільніше.\n\nАтакувати DM-300 безпосередньо безглуздо, поки він перезаряджений, але _щось поблизу має постачати йому цю енергію_, знищуючи те, що може послабити його.
actors.mobs.dm300.name=ДМ-300
actors.mobs.dm300.notice=ВИЯВЛЕНО НЕЗАВЕРШЕНИЙ ПЕРСОНАЛ!
actors.mobs.dm300.pylons_destroyed=ТРИВОГА! ВИЯВЛЕНО НЕСТАБІЛЬНІСТЬ В ЕЛЕКТРОМЕРЕТІ!
actors.mobs.dm300.rankings_desc=Розчавлений DM-300
actors.mobs.dm300.shield=DM-300 отримує живлення з оголених проводів та екранує себе!
actors.mobs.dm300.supercharged=ЗНИЩИТИ! ЗНИЩИТИ! ЗНИЩИТИ!
actors.mobs.dwarfking$dkghoul.rankings_desc=Упав перед Королем Гномів
actors.mobs.dwarfking$dkgolem.rankings_desc=Упав перед Королем Гномів
actors.mobs.dwarfking$dkmonk.rankings_desc=Упав перед Королем Гномів
actors.mobs.dwarfking$dkwarlock.rankings_desc=Упав перед Королем Гномів
actors.mobs.dwarfking.defeated=Ти... прирік нас усіх...
actors.mobs.dwarfking.desc=Багато років тому один з найвищих чарівників гномського двору розкрив таємниці, які дали йому величезну владу над життям і смертю. Невдовзі він використав цю силу, підкоривши та розбестивши своїх рівних, свого короля, і зрештою кожного гнома-громадянина. Тепер він король, правитель легіону немертвих підданих.\n\nКороль гномів — агресивний ворог, який намагатиметься оточити та придушити своїх ворогів ордою немертвих поплічників.
actors.mobs.dwarfking.enraged=Ти не можеш мене вбити, %s. Я. БЕЗСМЕРТНИЙ!
actors.mobs.dwarfking.lifelink_1=Мені потрібна твоя сутність, рабе!
actors.mobs.dwarfking.lifelink_2=Пролий кров за мене, рабе!
actors.mobs.dwarfking.losing=Ні! Ти не можеш цього зробити... ти й гадки не маєш, що лежить внизу...
actors.mobs.dwarfking.name=Король гномів
actors.mobs.dwarfking.notice=Як ти смієш! Ти й гадки не маєш, у що втручаєшся!
actors.mobs.dwarfking.rankings_desc=Упав перед Королем Гномів
actors.mobs.dwarfking.teleport_1=Розберися з ними, рабе!
actors.mobs.dwarfking.teleport_2=Займай їх, рабе!
actors.mobs.dwarfking.wave_1=Досить! Вставайте, раби мої!
actors.mobs.dwarfking.wave_2=Більше! Пролийте кров за свого короля!
actors.mobs.dwarfking.wave_3=Марно! ВБИЙТЕ ЇХ ЗАРАЗ!
actors.mobs.ebonymimic.desc=Міміки — це чарівні істоти, які можуть приймати будь-яку форму, яку забажають. У підземеллях вони майже завжди обирають форму скрині зі скарбами, щоб заманити нічого не підозрюючих шукачів пригод.\n\nЧорношкірі міміки — це непомітні міміки, здатні робити себе майже невидимими. Вони ховаються на речах, з якими шукачі пригод можуть взаємодіяти, але також містять власну здобич. Вони не витриваліші за звичайних міміків, коли їх знаходять, але їхній несподіваний укус нищівний.
actors.mobs.ebonymimic.discover_hint=Ви можете знайти цього ворога за допомогою спеціального дрібничка.
actors.mobs.ebonymimic.hidden_desc=Здається, тут щось є, але це майже повністю прозоро.
actors.mobs.ebonymimic.hidden_name=підозрілий контур
actors.mobs.ebonymimic.name=імітатор чорного дерева
actors.mobs.ebonymimic.reveal=Там був мімікрій!
actors.mobs.elemental$chaoselemental.desc=Елементалі — це хаотичні істоти, які часто виникають, коли потужна окультна магія не контролюється належним чином. Елементалі мають мінімальний інтелект і зазвичай асоціюються з певним типом магії. \n\nЕлементалі Хаосу — це рідкісні та небезпечні елементалі, які не стабілізувалися до певної стихії. Вони вивільняють дику непередбачувану магію під час атаки.
actors.mobs.elemental$chaoselemental.name=елемент хаосу
actors.mobs.elemental$fireelemental.desc=Елементалі — це хаотичні істоти, які часто виникають, коли потужна окультна магія не контролюється належним чином. Елементалі мають мінімальний інтелект і зазвичай асоціюються з певним типом магії.\n\nВогняні елементалі — поширений тип елементалів, які завдають шкоди вогняною магією. Вони підпалюють свою ціль атаками ближнього бою, а також іноді можуть стріляти вогняними стрілами.
actors.mobs.elemental$fireelemental.name=вогняна стихія
actors.mobs.elemental$frostelemental.desc=Елементалі — це хаотичні істоти, які часто виникають, коли потужна окультна магія не контролюється належним чином. Елементалі мають мінімальний інтелект і зазвичай асоціюються з певним типом магії.\n\nМорозні елементалі — поширений тип елементалів, які послаблюють ворогів за допомогою холодної магії. Вони холодять свою ціль за допомогою атак ближнього бою та іноді дальніх атак. Їхня магія набагато ефективніша у воді.
actors.mobs.elemental$frostelemental.name=морозний елементар
actors.mobs.elemental$newbornfireelemental.charging=Елементаль заряджається!
actors.mobs.elemental$newbornfireelemental.desc=Елементалі — це хаотичні істоти, які часто виникають, коли потужна окультна магія не контролюється належним чином. Елементалі мають мінімальний інтелект і зазвичай пов'язані з певним типом магії.\n\nЦей вогняний елементаль нещодавно викликаний, але все ще досить небезпечний!
actors.mobs.elemental$newbornfireelemental.desc_ally=Оскільки цього елементаля було викликано заклинанням, він має трохи більше контролю над своїм полум'ям. Він не здатний здійснювати дальні атаки, але підпалюватиме ворогів, яких атакує в ближньому бою.
actors.mobs.elemental$newbornfireelemental.desc_boss=Через хаотичну природу свого виклику, цей елементаль може поширювати вогонь лише неточними вибухами після ходу зарядки.
actors.mobs.elemental$newbornfireelemental.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.elemental$newbornfireelemental.name=новонароджений вогняний елемент
actors.mobs.elemental$shockelemental.desc=Елементалі — це хаотичні істоти, які часто виникають, коли потужна окультна магія не контролюється належним чином. Елементалі мають мінімальний інтелект і зазвичай асоціюються з певним типом магії.\n\nШокові елементалі — менш поширений тип елементалів, які руйнують своїх ворогів електрикою та спалахами світла. У ближньому бою вони посилають електрикою ворогів поблизу та завдають додаткової шкоди своїй основній цілі, якщо та знаходиться у воді. Вони також іноді фокусують дальній вибух світла на своїй цілі, тимчасово засліплюючи її.
actors.mobs.elemental$shockelemental.name=шок елементарний
actors.mobs.eye.deathgaze_kill=Смертельний погляд убив тебе...
actors.mobs.eye.desc=Цього демона також називають «кулею ненависті». Побачивши ворога, він бездумно застосовує смертоносний погляд, часто не зважаючи на союзників і ранячи їх.
actors.mobs.eye.name=лихе око
actors.mobs.fetidrat.desc=З цим пацюком явно щось не так. Його жирне чорне хутро та гниюча шкіра дуже відрізняються від здорових пацюків, яких ви бачили раніше. Його блідо-зелені очі роблять його особливо загрозливим.\n\nПацюк несе з собою хмару жахливого смороду, зблизька він надзвичайно сильний.\n\nЗ рота пацюка стікає темний слиз, він їсть підлогу, але, здається, розчиняється у воді.
actors.mobs.fetidrat.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.fetidrat.name=смердючий щур
actors.mobs.fungalcore.desc=Цей гігантський гриб, мабуть, є джерелом усієї грибкової активності в цій печері.
actors.mobs.fungalcore.name=грибкове ядро
actors.mobs.fungalsentry.desc=Цей особливо високий гриб служить точкою захисту для більшої грибної мережі, що мешкає в цій печері. \n\nВін нерухомий, але стріляє точними вибухами отрути у все, що потрапляє в його поле зору. Хоча вплив цих вибухів досить слабкий, _вони можуть дуже швидко накопичити смертельну кількість отрути._ Хоча його можна вбити, мабуть, краще його уникати.
actors.mobs.fungalsentry.name=грибковий вартовий
actors.mobs.fungalspinner.desc=Цим печерним прядильником, схоже, керує паразитичний грибок. Грибок також змінив свої здібності, замінивши павутину та мішечки з отрутою грибковими рослинами.\n\nГрибний прядильник плюватиметься на вас рослинами замість павутини, поширюючи грибкову рослинність і потенційно вкорінюючи вас. Хоча він не може отруїти, грибний прядильник отримає значну стійкість до пошкоджень, якщо знаходиться поруч із будь-якими грибами.
actors.mobs.fungalspinner.name=грибковий прядильник
actors.mobs.ghoul.desc=Коли гномське суспільство почало поступово руйнуватися, а нинішній король гномів захопив абсолютну владу, до тих, хто був слабким або чинив йому опір, ставилися погано. Коли король ставав більш вправним у володінні темною магією, він підкорив цих гномів своїй волі, і тепер вони складають піхоту його армії. \n\nГулі не особливо сильні самі по собі, але завжди подорожують групами і їх набагато важче вбити у великій кількості. _Коли гуля переможено, він знову повстане через кілька ходів, якщо поруч є інший гуля._
actors.mobs.ghoul.name=гном-упир
actors.mobs.gnoll.desc=Гноли — гуманоїди, схожі на гієн. Вони живуть у каналізації та підземеллях, час від часу вилазячи на поверхню, щоб здійснювати набіги. Гноли-розвідники є постійними членами їхньої зграї, вони не такі сильні, як грубіяни, і не такі розумні, як шамани.
actors.mobs.gnoll.name=гнол-розвідник
actors.mobs.gnollexile.desc=Цей сірохутрий гнол має велику мітку на плечі, що вказує на його приналежність до вигнанця. Гнолів зазвичай виганяють зі свого суспільства за ігнорування наказів або порушення законів. Вигнанці повинні бути сильними та хитрими, щоб вижити, а цей виглядає так, ніби знає, як користуватися списом, який тримає в руках.
actors.mobs.gnollexile.desc_aggro=_Гнол-вигнанець сердито озирається навколо._ Здається, щось змусило його все ж таки вирішити битися. Стережися списа!
actors.mobs.gnollexile.desc_passive=_Гнол-вигнанець не збирається атакувати._ Він не здається таким агресивним, як інші гноли тут, і, ймовірно, не вважає, що боротьба з вами варта того. Ви можете просто пропустити це, але в нього є рюкзак, який може бути повний корисних речей...
actors.mobs.gnollexile.name=вигнання гнолів
actors.mobs.gnollexile.seen_aggro=Гнол зі списом рушає в атаку!
actors.mobs.gnollexile.seen_passive=Гнол зі списом дивиться на тебе насторожено, але не рухається, щоб атакувати.
actors.mobs.gnollgeomancer.alert=Геомант прокидається! Здається, вся печера рухається, коли він відстрибує, шалено сміючись!
actors.mobs.gnollgeomancer.desc=Цей вражаюче високий старший гнол, мабуть, є джерелом різноманітної землерухальної магії тут і організатором усієї діяльності гнолів. На відміну від гноллів-саперів у цьому районі, геомант досить вправно володіє своєю магією і не може бути пошкоджений кинутим або падаючим камінням. Однак він не має жодних можливостей для ближнього бою.
actors.mobs.gnollgeomancer.desc_armor=Геомант зараз закутаний у шар кам'яної броні. _Вам потрібно підійти ближче та зламати її киркою, перш ніж ви зможете пошкодити геоманта._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Неподалік гнол-сапер тримає пристрій, який посилює кам'яну броню геоманта. Зараз ви взагалі не зможете її пошкодити!_
actors.mobs.gnollgeomancer.desc_sleeping=Цей вражаюче високий гнол-шаман оточений шаром скелі та виглядає майже як статуя. Придивившись уважніше, можна побачити, як скеля магічно рухається в такт диханню старшого гнола. Йому не можна завдати шкоди, поки він так замкнений у скелі, і здається, що він насолоджується буквально дрімотою в землі.\n\nВи, ймовірно, зможете пробити шари скелі своєю киркою, але _переконайтеся, що ви готові до бою, коли це зробите._ Геомант, мабуть, є джерелом різноманітної магії руху землі тут і організатором усієї діяльності гнолів. _Перемога над гнолами, розкиданими тут, перед боєм з нею може бути гарною ідеєю._
actors.mobs.gnollgeomancer.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.gnollgeomancer.name=гнол-геомант
actors.mobs.gnollgeomancer.rock_kill=Летючий валун убив тебе...
actors.mobs.gnollgeomancer.rockfall_kill=Падаюче каміння вбило тебе...
actors.mobs.gnollgeomancer.warning=Геомант починає ворушитися. Переконайтеся, що ви готові, перш ніж продовжити!
actors.mobs.gnollguard.def_verb=заблоковано
actors.mobs.gnollguard.desc=Великий і міцний на вигляд гнол зі списом і щитом, але без шолома. Ці охоронці, ймовірно, є воїнами на тренуваннях, закріпленими за допомогою захисту шахти від вторгнення дикої природи. \n\nГнол-охоронець достатньо сильний, щоб тримати спис в одній руці, але не дуже добре ним користується. _Йому знадобиться досить відкритий простір для атаки на відстані, і він завдасть вам помітно менше шкоди, якщо ви підійдете близько._
actors.mobs.gnollguard.desc_armor=_Неподалік гнол-сапер тримає пристрій, який надає цьому охоронцю земляну броню, значно зменшуючи завдану йому шкоду._
actors.mobs.gnollguard.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.gnollguard.name=гнол-охоронець
actors.mobs.gnollguard.spear_warn=Гнол завдає жорстокого удару кінчиком свого списа!
actors.mobs.gnollsapper.desc=Маленький та слабкий, але розумний гнол зі світлим хутром та сумкою, повною різноманітних гаджетів. Вони, ймовірно, тут, щоб допомагати в розвідці та видобутті темного золота, і мають поруч охоронця для захисту. Вони здатні битися, але їхні атаки жалюгідно слабкі, не сильніші за атаки гнолла-розвідника. \n\n Замість того, щоб битися безпосередньо, сапери воліють використовувати різні гаджети, які у них є, щоб змусити кам'яне середовище атакувати за них. Однак самі вони не знають магії переміщення землі, тому, ймовірно, використовуватимуть свої гаджети безрозсудно. _Повинно бути багато способів використати їхні атаки проти них або їхньої охорони._
actors.mobs.gnollsapper.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.gnollsapper.name=гнол-сапер
actors.mobs.gnolltrickster.desc=Дивна на вигляд істота, навіть за гнолськими мірками. Вона згорбилася вперед із зловісною посмішкою, майже тримаючи сумку, що висить на її плечі. Її очі широко розплющені від дивної суміші страху та хвилювання.\n\nУ її сумці велика колекція погано зроблених дротиків, всі вони, здається, мають наконечники з різних шкідливих речовин.
actors.mobs.gnolltrickster.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.gnolltrickster.name=гнол-обманщик
actors.mobs.goldenmimic.desc=Міміки — це чарівні істоти, які можуть приймати будь-яку форму, яку забажають. У підземеллях вони майже завжди обирають форму скрині зі скарбами, щоб заманити нічого не підозрюючих шукачів пригод. \n\nЗолоті міміки — це сильніші міміки, які намагаються привабити найсильніших шукачів пригод. Вони мають кращу здобич, але також набагато сильніші за звичайних міміків.
actors.mobs.goldenmimic.name=золотий мімік
actors.mobs.golem.def_verb=заблоковано
actors.mobs.golem.desc=Дворфи намагалися поєднати знання механізмів із нещодавно відкритим умінням підкорювати стихії. Душами механічних тіл големів слугували духи землі, яких вважали найслухнянішими. Та навіть найменша помилка в ритуалі могла змусити голема вийти з-під контролю.
actors.mobs.golem.name=голем
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=глухий кут... глухий кут...
actors.mobs.goo.desc=Про Слиз відомо небагато. Можливо, це навіть не істота, а скупчення речовин зі стоків, у якому зародилася власна воля.
actors.mobs.goo.enraged=розлючений
actors.mobs.goo.gluuurp=ГЛУУУУРП!
actors.mobs.goo.name=Слиз
actors.mobs.goo.notice=ГЛУРП-ГЛУРП!
actors.mobs.goo.pumpup=Гу набирає обертів!
actors.mobs.goo.rankings_desc=Поглинений слизом
actors.mobs.greatcrab.def_verb=заблоковано
actors.mobs.greatcrab.desc=Цей краб гігантський, навіть порівняно з іншими каналізаційними крабами. Його блакитний панцир вкритий тріщинами та вусоногими черепашками, що свідчить про його старість. Він повільно пересувається, ледве утримуючи рівновагу за допомогою своєї масивної клешні.\n\nХоча у краба лише одна клешня, його розмір легко це компенсує. Краб тримає клешню перед будь-якою загрозою, прикриваючись непроникною стіною панцира. Однак краб не може блокувати атаки, яких він не бачить, або атаки кількох ворогів одночасно.
actors.mobs.greatcrab.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.greatcrab.name=великий краб
actors.mobs.greatcrab.noticed=Краб блокує своєю масивною клешнею.
actors.mobs.guard.def_verb=заблоковано
actors.mobs.guard.desc=Колись охоронці в'язниці, ці охоронці давно нічим не відрізняються від ув'язнених. Вони хитаються, як зомбі, бездумно блукаючи коридорами в пошуках чогось не на своєму місці, як і ви!\n\nВони носять ланцюги на стегнах, можливо, використовувані для того, щоб притягувати ворогів на близьку відстань.
actors.mobs.guard.name=тюремний охоронець
actors.mobs.guard.scorpion=Іди сюди!
actors.mobs.hermitcrab.def_verb=заблоковано
actors.mobs.hermitcrab.desc=З тієї чи іншої причини цей каналізаційний краб вирішив носити на голові зламану верхню частину бочки! Додаткова вага уповільнила його швидкість до звичайної, але також забезпечила йому значно кращий захист. Здається, ви чуєте, як щось підстрибує всередині бочки...
actors.mobs.hermitcrab.name=рак-відлюдник
actors.mobs.mimic.desc=Міміки — це чарівні істоти, які можуть приймати будь-яку форму, яку забажають. У підземеллях вони майже завжди обирають форму скрині зі скарбами, щоб заманити нічого не підозрюючих шукачів пригод.
actors.mobs.mimic.discover_hint=Ви можете знайти цього ворога будь-де в підземеллі.
actors.mobs.mimic.hidden_hint=Щось із цією скринею дивне... Підійти та спробувати її відкрити — мабуть, погана ідея.
actors.mobs.mimic.name=мімік
actors.mobs.mimic.reveal=Ці груди — міміка!
actors.mobs.mob.died=Чуєш, як щось вмирає вдалині.
actors.mobs.mob.discover_hint=Ви можете знайти цього ворога в певній області підземелля.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Убитий: %s
actors.mobs.monk$focus.desc=Цей чернець ідеально зосереджений на своїй цілі та, здається, передбачає її рухи, перш ніж вона їх зробить.\n\nПід час фокусування наступна фізична атака, спрямована проти цього персонажа, гарантовано промахнеться, незалежно від обставин. Парування цієї атаки витратить фокус ченця, і йому потрібно буде знову його відновити, щоб парирувати наступну атаку. Ченці швидше нарощують фокус під час руху.
actors.mobs.monk$focus.name=зосереджений
actors.mobs.monk.def_verb=заблоковано
actors.mobs.monk.desc=Ці монахи — фанатики, які присвятили себе захисту таємниць свого міста від усіх чужинців. Вони не користуються ні обладунками, ні зброєю, покладаючись лише на мистецтво рукопашного бою.
actors.mobs.monk.name=дворф-чернець
actors.mobs.monk.parried=парирував
actors.mobs.necromancer$necroskeleton.desc=Цей скелет був викликаний некромантом. Він поводиться як звичайний скелет і помре, коли некромант, який його викликав, буде вбитий.
actors.mobs.necromancer$necroskeleton.name=скелет некроманта
actors.mobs.necromancer.desc=Ці учні темних магів стікалися до в'язниці, оскільки це ідеальне місце для відпрацювання свого злого ремесла. \n\nНекроманти закликатимуть і нададуть сили скелетам, щоб ті билися за них. Вбивство некроманта також вб'є скелета, якого він викликає.
actors.mobs.necromancer.name=некромант
actors.mobs.npcs.blacksmith.cant_enter_old=Ця область недоступна на цьому етапі. Зіграйте в нову гру, щоб спробувати нове завдання!
actors.mobs.npcs.blacksmith.def_verb=заблоковано
actors.mobs.npcs.blacksmith.desc=Цей троль-коваль виглядає як усі тролі: він високий і худий, а його шкіра нагадує камінь як за кольором, так і за текстурою. Троль-коваль бавиться непропорційно малими інструментами.
actors.mobs.npcs.blacksmith.enter_no=Ще ні
actors.mobs.npcs.blacksmith.enter_yes=Я готовий
actors.mobs.npcs.blacksmith.entrance_blocked=Шлях вниз заблоковано.
actors.mobs.npcs.blacksmith.exit_no=Ще ні
actors.mobs.npcs.blacksmith.exit_warn_crystal=Той гігантський кристал теж там, унизу. Я заплачу додатково, якщо ти його знищиш.
actors.mobs.npcs.blacksmith.exit_warn_full=Ти закінчив? У тебе багато золота, але переконайся, що ти не залишив жодного зі свого спорядження. \n\n_Пам'ятай, я тебе не впущу, як тільки ти підіймешся._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Той велетенський гриб теж там, унизу. Я заплачу додатково, якщо ти його вб'єш.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Той гнол-геомант теж там, унизу. Я заплачу додатково, якщо ти його вб'єш.
actors.mobs.npcs.blacksmith.exit_warn_high=Ти закінчив? Схоже, у тебе є чимало золота, але мені б не завадило трохи більше. Ти маєш змогти отримати _40 шматків._\n\n_Пам'ятай, я тебе не впущу, як тільки ти підіймешся._
actors.mobs.npcs.blacksmith.exit_warn_low=Ти вже закінчив? Схоже, у тебе небагато золота. Ти маєш змогти отримати _40 штук._\n\n_Пам'ятай, я тебе не впущу, як тільки ти підіймешся._
actors.mobs.npcs.blacksmith.exit_warn_med=Ти закінчив? У тебе хоча б є трохи золота, але в шахті точно є більше. Ти маєш змогти отримати _40 шматків._\n\n_Пам'ятай, я тебе не впущу, як тільки ти вилізеш._
actors.mobs.npcs.blacksmith.exit_warn_none=Ти вже закінчив? У тебе майже немає золота! Ти маєш змогти отримати _40 штук._\n\n_Пам'ятай, я тебе не впущу, як тільки ти підіймешся._
actors.mobs.npcs.blacksmith.exit_yes=Я закінчив
actors.mobs.npcs.blacksmith.get_lost=Я зайнятий. Зникни!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Гей, Людино! Ти виглядаєш важливою людиною.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Але будь обережний, шахта небезпечна для такої маленької людини, як ти. Її вже деякий час покинули, і там почала рости купа кристалів. Вони блискучі, але надто крихкі, щоб мати якусь цінність, і їх захищають якісь магічні речі. Вони досить міцні, тому _будьте обережні, де видобуваєте_, інакше привернете їхню увагу.\n\nДесь також є _гігантський кристал_. Він набагато міцніший, тому будьте готові до бою, якщо почнете його ламати. Б'юся об заклад, що розбиття його уповільнить ріст кристалів, тому я заплачу додатково, якщо ви зможете це зробити.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Гей, Людино! Ти виглядаєш сміливцем.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Але будь обережний, шахта небезпечна для такої маленької людини, як ти. Там росте якийсь грибний монстр. Там є грибні вартові, які справді смертельно небезпечні, якщо побачать тебе, але вони принаймні не можуть встати та переслідувати тебе. _Тримайся подалі_, якщо хочеш залишитися живим.\n\nЯ заплачу додатково, якщо тобі вдасться звалити _найбільший гриб_, але це вимагатиме справжніх зусиль. Він пов'язаний з купою міцелієвих вузлів, захованих у стінах. Тобі доведеться зламати більшість із них, перш ніж ти зможеш по-справжньому пошкодити його.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Але будь обережний, шахта небезпечна для такої маленької людини, як ти. Якісь гноли теж хочуть золота, і тепер вони руйнують усе це місце. Вони дурні створіння, тому їхній видобуток спричинив усілякі обвали та завали. Тобі доведеться видобувати крізь неї, тому _шукай нещодавно порушену породу._\n\nЯ думаю, що один із гнолів спричиняє найбільше проблем, ймовірно, _геомант-шаман_ чи щось таке. Я заплачу додатково, якщо ти зможеш його знайти та вбити, але я впевнений, що воно дасть опір.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Гей, Людино! Здається, ти швидкий.
actors.mobs.npcs.blacksmith.intro_quest_mage=Гей, Людино! Ти виглядаєш розумним.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Гей, Людино! Виглядаєш як підступний звір.
actors.mobs.npcs.blacksmith.intro_quest_start=Хочеш бути корисним, га? Так, у мене є дещо, що ти міг би зробити. Я збудував цю майстерню на старій шахті, вона одразу під драбиною. Візьми цю кирку та видобуй мені трохи _темної золотої руди. 40 шматків_ має бути достатньо. Камінь під землею приємний і м'який, тому _ти зможеш пробиватися крізь стіни з деякими зусиллями._\n\nЩо ти маєш на увазі, як я заплачу? Ти жадібний...\n\nГаразд, гаразд, я можу тобі трохи покувати. Вважай, що тобі пощастило, я єдиний коваль навколо.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Гей, Людино! Здається, ти міцний хлопець.
actors.mobs.npcs.blacksmith.lost_pick=Ти жартуєш? Де моя кирка?!
actors.mobs.npcs.blacksmith.name=троль-коваль
actors.mobs.npcs.blacksmith.quest_start_prompt=Готовий спуститися? Переконайся, що у тебе є вільне місце для золота. \n\n_Я тебе підведу лише раз!_
actors.mobs.npcs.blacksmith.reminder=Ти вже гаяв мій час? Вхід до шахти он он там.
actors.mobs.npcs.blacksmith.reminder_crystal=Принеси мені якомога більше золота, і спробуй також розбити великий кристал.
actors.mobs.npcs.blacksmith.reminder_fungi=Принеси мені якомога більше золота, і спробуй убити також велетенський гриб.
actors.mobs.npcs.blacksmith.reminder_gnoll=Принеси мені якомога більше золота, і спробуй також убити гнолла-геоманта.
actors.mobs.npcs.ghost.crab_1=Привіт, %s... Колись я був таким, як ти — сильним і впевненим... Але мене вбила стародавня істота... Я не можу покинути це місце... Доки не помщуся... Убий _великого краба,_ який забрав моє життя...\n\nВін неприродно старий... З масивним одним клешнем і товстим панциром... _Остерігайся його клешні, ти повинен здивувати краба, інакше він заблокує тебе нею..._
actors.mobs.npcs.ghost.crab_2=Будь ласка... Допоможіть мені... Вбийте Ракоподібного...\n\n_Він завжди блокуватиме... Коли побачить, як ти наближаєшся..._
actors.mobs.npcs.ghost.desc=Привид ледве помітний. Він схожий на безформну пляму слабкого світла із сумним обличчям.
actors.mobs.npcs.ghost.find_me=Дякую... приходьте, знайдіте мене...
actors.mobs.npcs.ghost.gnoll_1=Привіт, %s... Колись я був таким, як ти — сильним і впевненим у собі... Але мене вбив підступний ворог... Я не можу покинути це місце... Доки не помщуся... Убийте _гнолла-обманщика,_ який забрав моє життя...\n\nВін не такий, як інші гноли... Він ховається та використовує метальні дротики... _Остерігайся його отруйних і запальних дротиків, не атакуй здалеку..._
actors.mobs.npcs.ghost.gnoll_2=Будь ласка... Допоможіть мені... Вбийте обманщика...\n\n_Не дозволяй йому вдарити тебе... Підійди ближче..._
actors.mobs.npcs.ghost.name=сумний привид
actors.mobs.npcs.ghost.rat_1=Привіт, %s... Колись я був таким, як ти — сильним і впевненим... Але мене вбив гидкий звір... Я не можу покинути це місце... Доки не помщуся... Убийте _смердючого щура,_ який забрав моє життя...\n\nВін нишпорить по цій підлозі... Поширюючи всюди бруд... _Остерігайся його хмари смороду та їдкого укусу, кислота розчиняється у воді..._
actors.mobs.npcs.ghost.rat_2=Будь ласка... Допоможіть мені... Знищте цю гидоту...\n\n_Бийтеся з нею біля води... Уникайте смороду..._
actors.mobs.npcs.imp.cya=До зустрічі, %s!
actors.mobs.npcs.imp.desc=Імпи — нижчі демони. Вони не вирізняються ні силою, ні магічним талантом, але досить розумні та товариські. Багато імпів воліють жити серед недемонів.
actors.mobs.npcs.imp.golems_1=У моєму випадку потрібно вбити _ґолемів_. Бачите, я збираюся розпочати тут невеликий бізнес, але ці дурні ґолеми погані для бізнесу! Дуже важко домовлятися з блукаючими брилами граніту, будь вони прокляті! Тож, будь ласка, убийте... скажімо, _чотирьох з них_, і винагорода ваша.
actors.mobs.npcs.imp.golems_2=Як проходить твоє сафарі з големами? Тільки не забудь взяти ці жетони.
actors.mobs.npcs.imp.hey=Тссс, %s!
actors.mobs.npcs.imp.intro=Ти шукач пригод? Я люблю шукачів пригод! Ти завжди можеш покластися на них, якщо потрібно щось убити, чи не так? Звісно, за винагороду ;)
actors.mobs.npcs.imp.monks_1=У моєму випадку потрібно вбити _ченців_. Бачите, я збираюся розпочати тут невеликий бізнес, але ці божевільні самі нічого не купують і відлякують інших клієнтів. Тож, будь ласка, вбийте... скажімо, _5 з них_, і винагорода ваша.
actors.mobs.npcs.imp.monks_2=О, ти ще живий! Я знав, що твоє кунг-фу буде сильнішим ;) Тільки не забудь взяти ті жетони.
actors.mobs.npcs.imp.name=амбітний бешталь
actors.mobs.npcs.impshopkeeper.buyback=Бесняжка радісно повертає твій предмет.
actors.mobs.npcs.impshopkeeper.desc=Бесенок облаштував невеличку крамницю на межі внутрішніх залів. Приємно бачити привітне обличчя, але його ціни точно не здаються дружніми.
actors.mobs.npcs.impshopkeeper.greetings=Привіт, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Що ти зробив, %s? Швидше купуй, мені треба звідси вибиратися!
actors.mobs.npcs.impshopkeeper.name=амбітний бешталь
actors.mobs.npcs.impshopkeeper.thief=Я думав, що можу тобі довіряти!
actors.mobs.npcs.mirrorimage.desc=Ця ілюзія дуже схожа на тебе, тільки блідіша й трохи сіпається.
actors.mobs.npcs.mirrorimage.discover_hint=Ви можете знайти цього персонажа за допомогою спеціального сувою.
actors.mobs.npcs.mirrorimage.name=дзеркальне відображення
actors.mobs.npcs.npc.discover_hint=Ви можете знайти цього персонажа в певному регіоні підземелля.
actors.mobs.npcs.prismaticimage.desc=Ця мерехтлива ілюзія дуже схожа на вас, навіть здається, що вона тримає вашу поточну зброю та броню.\n\nПризматичні зображення намагатимуться шукати та відволікати від ворогів, використовуючи свій покращений захист та здоров'я для вашого захисту. Хоча вони не мають такої ж наступальної сили, як дзеркальні зображення, вони мають покращену міцність, зокрема отримують переваги від вашої броні.\n\nЯкщо здоров'я знижено до 0, призматичні зображення зникатимуть протягом кількох ходів і все ще можна вилікувати протягом цього часу. Коли ворогів немає, призматичні зображення зникатимуть та повертатимуться до свого господаря.
actors.mobs.npcs.prismaticimage.discover_hint=Ви можете знайти цього персонажа за допомогою спеціального сувою.
actors.mobs.npcs.prismaticimage.name=призматичне зображення
actors.mobs.npcs.ratking.confused=Що... Де я? Моє королівство потребує мене!
actors.mobs.npcs.ratking.crown_after=Подобаються твої нові обладунки? Ніяких відмов!
actors.mobs.npcs.ratking.crown_clothes=Одягнися! Ти не в тому стані, щоб розмовляти з королівською родиною!
actors.mobs.npcs.ratking.crown_desc=Ооо, ця корона для мене!? Вона виглядає набагато блискучішою за мою, тому я люб'язно приймаю! \n\nНасправді, я думаю, що можу запропонувати тобі щось як винагороду за цю корону. Неймовірна сила, що личить такому герою, як ти! Тобі б це сподобалося?
actors.mobs.npcs.ratking.crown_fine=Гаразд! Я ж цього не хотів...
actors.mobs.npcs.ratking.crown_info=Розкажи мені спочатку більше.
actors.mobs.npcs.ratking.crown_no=Я б волів не...
actors.mobs.npcs.ratking.crown_thankyou=Хе-хе, дякую! А тепер іди та зроби так, щоб твій король пишався тобою!
actors.mobs.npcs.ratking.crown_yes=Звісно!
actors.mobs.npcs.ratking.desc=Цей пацюк трохи більший за звичайного сумчастого пацюка. На голові він носить крихітну корону.
actors.mobs.npcs.ratking.desc_birthday=Цей пацюк трохи більший за звичайного сумчастого пацюка. Замість своєї звичайної корони на ньому крихітний зелений святковий капелюшок. З днем народження, Король Пацюків!
actors.mobs.npcs.ratking.desc_crown=Цей пацюк трохи більший за звичайного сумчастого пацюка. На голові він носить корону короля карликів.
actors.mobs.npcs.ratking.desc_winter=Цей пацюк трохи більший за звичайного сумчастого пацюка. Замість своєї звичайної корони він носить крихітний святковий капелюшок. Зі святами!
actors.mobs.npcs.ratking.discover_hint=Ви можете знайти цього персонажа в кінці певного регіону підземелля.
actors.mobs.npcs.ratking.name=король щурів
actors.mobs.npcs.ratking.not_sleeping=Я не сплю!
actors.mobs.npcs.ratking.what_is_it=Що таке? У мене немає часу на цю нісенітницю. Моє королівство не буде правити саме собою!
actors.mobs.npcs.sheep.baa!=Беа!
actors.mobs.npcs.sheep.baa.=Беа.
actors.mobs.npcs.sheep.baa...=Бе...
actors.mobs.npcs.sheep.baa?=Беа?
actors.mobs.npcs.sheep.def_verb=заблоковано
actors.mobs.npcs.sheep.desc=Це чарівна вівця. Що в ній такого чарівного? Її не можна вбити. Вона стоятиме там, доки чарівним чином не зникне, весь час жуючи жуйку з порожнім поглядом.
actors.mobs.npcs.sheep.discover_hint=Ви можете знайти цього персонажа за допомогою певного предмета або пастки.
actors.mobs.npcs.sheep.name=вівці
actors.mobs.npcs.shopkeeper.buyback=Продавець неохоче повертає ваш товар.
actors.mobs.npcs.shopkeeper.desc=Цей кремезний хлопець виглядає скоріше доречним для торгового району якогось великого міста, ніж для підземелля. Його ціни пояснюють, чому він воліє вести бізнес саме тут.
actors.mobs.npcs.shopkeeper.flee=Крамар тікає!
actors.mobs.npcs.shopkeeper.name=крамар
actors.mobs.npcs.shopkeeper.sell=Продати товар
actors.mobs.npcs.shopkeeper.talk=Розмова
actors.mobs.npcs.shopkeeper.talk_ascent=Я не знаю, що ти плануєш робити з цим амулетом, але я не хочу мати до цього жодної участі. Купи щось і йди далі, нам обом потрібно звідси зникнути!
actors.mobs.npcs.shopkeeper.talk_caves=Витрачай гроші, живи довше.\n\nО, і передай від мене привіт тому ковалю-тролю, якщо побачиш його. Нагадай цьому ковалю, що він досі винен мені гроші за той молот, який я продав йому минулого тижня!
actors.mobs.npcs.shopkeeper.talk_city=Мої товари можуть захистити тебе тут, унизу. \n\n... І не тиняйтеся тут, будь ласка. Знадобилася ціла вічність, щоб місцеві жителі залишили мене в спокої, я не хочу, щоб ти накликав на себе якісь проблеми!
actors.mobs.npcs.shopkeeper.talk_halls=Привіт, у мене спеціальні ціни для мисливців на демонів!\n\nО, і будь обережний там, унизу! Демонам внизу байдуже, яка ти смілива. Ти не зможеш повернутися нагору та витратити більше грошей, якщо будеш мертвим! ;)\n\nЧи демони такі, як я? Хе-хе, зовсім ні. Я просто маленький хлопець, не дуже хороший воїн, і мені вдалося зберегти свій розум неушкодженим. Демони внизу набагато сильніші істоти, і всі вони поневолені... ну... просто будь обережний там, унизу.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Ну, привіт, Ваша Високосте, чи тепер Ваша Святість? Хе-хе, у будь-якому разі, це не місце для вас, багато людей були б дуже засмучені, якби ви загинули. У вас же, мабуть, є якісь монети, чому б не купити щось, щоб запобігти цьому?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Що ж, якщо це не мандрівний герой! Якщо ви намагаєтеся врятувати чергове місто, то удачі вам, небезпеки тут набагато гірші, ніж у дрібних бандитських угрупованнях. Я впевнений, що у вас все вийде краще, ніж у будь-кого іншого, тільки постарайтеся не померти прямо біля мого магазину.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Здається, ти не у своїй стихії, міс. Вузькі коридори підземель не такі просторі, як великі зали чи ліси, що оточують місто, чи не так? Хе-хе, ой, не звертай уваги на мою балаканину, чому б не купити щось?
actors.mobs.npcs.shopkeeper.talk_prison_intro=У мене є все необхідне для успішної пригоди!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Хе-хе, здається, я десь у місті бачив оголошення про розшук із твоїм іменем. Ми що, втікаємо? О, ти ж невинний, чи не так? Звичайно, звичайно... Не хвилюйся, у мене є справи важливіші, ніж писати доноси на тебе, але, можливо, тобі варто щось купити, щоб переконатися?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ти прийшов з гільдії злодіїв, щоб очистити територію? Ні, просто за покупками? Ну, вбий кілька монстрів, поки будеш тут. Знижки теж не сподівайся, я плачу вам непогані гроші за охорону, а ви ледве мене тут тримаєте в безпеці.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Цікава у тебе печатка, зазвичай вони цілі. Ти якийсь зганьблений герой чи що? Що б ти не зробив, це не моя справа, твої монети все ще хороші.
actors.mobs.npcs.shopkeeper.thief=Злодій, злодій!
actors.mobs.npcs.shopkeeper.warn=Дивись! Я більше не буду тебе попереджати.
actors.mobs.npcs.vaultlaser.desc=Цей вартовий стріляє лазерами через регулярні проміжки часу. _Оскільки це лише зона випробувань, лазери насправді вам не зашкодять._
actors.mobs.npcs.vaultlaser.name=лазерний вартовий сховища
actors.mobs.npcs.vaultsentry.desc=Цей вартовий сканує місцевість за певним шаблоном. _Оскільки це лише тестова зона, вартовий нічого не зробить, якщо вас виявить._
actors.mobs.npcs.vaultsentry.name=вартовий сканування сховища
actors.mobs.npcs.wandmaker.def_verb=заблоковано
actors.mobs.npcs.wandmaker.desc=Цей старий, але бадьорий джентльмен має трохи спантеличений вираз обличчя. Його захищає магічний щит.
actors.mobs.npcs.wandmaker.intro_1=Я прийшов сюди, щоб знайти рідкісний інгредієнт для чарівної палички, але я заблукав, і мій магічний щит слабшає. Мені скоро потрібно буде йти, але я не можу піти, не отримавши те, за чим прийшов.
actors.mobs.npcs.wandmaker.intro_2=Якщо ти зможеш мені це дістати, я із задоволенням заплачу тобі однією з моїх майстерно виготовлених паличок! Я приніс із собою дві, тож можеш взяти ту, яка тобі більше подобається.
actors.mobs.npcs.wandmaker.intro_berry=Старий наглядач цієї в'язниці тримав _гнильницю_, і я шукаю одне з її насіння. Рослина, мабуть, вже здичавіла, тому змусити її дати насіння може бути складно. Її сад має бути десь тут. Намагайтеся _триматися подалі від її лоз_, якщо хочете залишитися цілими. Використання вогню може бути спокусливим, але, будь ласка, не робіть цього, ви вб'єте рослину та знищите її насіння.
actors.mobs.npcs.wandmaker.intro_cleric=О, привіт, Ваша Високосте! Який приємний сюрприз зустріти вас у такому гнітючому місці! Не хочу нав'язуватися, але, можливо, у мене є для вас завдання.
actors.mobs.npcs.wandmaker.intro_duelist=О, привіт, міс! Який приємний сюрприз зустріти героя в такому гнітючому місці! Якщо ви готові допомогти старому чоловікові, можливо, у мене є для вас завдання.
actors.mobs.npcs.wandmaker.intro_dust=Я шукаю трохи _трупного пилу._ Це особливий вид проклятого кісткового борошна, яке зазвичай знаходять у таких місцях. Десь тут має бути забарикадована кімната, я впевнений, що там з'явиться пил. Але будьте обережні, прокляття, яке несе цей пил, досить сильне, _поверніться до мене якомога швидше_, і я його для вас очищу.
actors.mobs.npcs.wandmaker.intro_ember=Я шукаю _свіже вугілля_ від новонародженого вогняного елементаля. Елементалі зазвичай з'являються, коли ритуал виклику не контролюється, тому просто знайдіть кілька свічок і місце для ритуалу, і я впевнений, що ви зможете знайти один, який з'явиться. Однак вам слід _уникати замкненості_ під час битви з ним, або ж ви можете _тримати під рукою якийсь крижаний предмет._ Новонароджені елементалі досить потужні та хаотичні, але вони не переносять холод.
actors.mobs.npcs.wandmaker.intro_huntress=О, привіт, міс! Привітне обличчя тут, унизу, приємно здивувати, чи не так? Насправді, клянусь, я вже бачила ваше обличчя раніше, але не можу точно сказати... Та неважливо, якщо ви тут заради пригод, можливо, у мене для вас є завдання.
actors.mobs.npcs.wandmaker.intro_mage=О, привіт, %s! Я чув, що навколо тебе та інституту чарівників знявся якийсь галас? Та неважливо, мені ніколи не подобалися ці дурні. Якщо ти згоден, можливо, у мене для тебе є завдання.
actors.mobs.npcs.wandmaker.intro_rogue=О Боже, ти мене налякав! Я не зустрічав жодного бандита з цього місця, який би досі зберіг глузд, тож ти, мабуть, з поверхні! Якщо ти готовий допомогти незнайомцю, можливо, у мене є для тебе завдання.
actors.mobs.npcs.wandmaker.intro_warrior=О, привіт! Який приємний сюрприз — зустріти воїна з півночі в такому гнітючому місці! Мабуть, ти подолав чимало подорожей, щоб сюди потрапити. Якщо ти шукаєш пригод, можливо, у мене є для тебе завдання.
actors.mobs.npcs.wandmaker.name=старий майстер жезлів
actors.mobs.npcs.wandmaker.reminder_berry=У вас є насінина гнильниці, %s? Шукайте кімнату, заповнену рослинністю.
actors.mobs.npcs.wandmaker.reminder_dust=Тобі пощастило з трупним пилом, %s? Шукай якісь барикади.
actors.mobs.npcs.wandmaker.reminder_ember=Пощастило з цим вугіллям, %s? Тобі потрібно знайти чотири свічки та місце для ритуалу.
actors.mobs.phantompiranha.desc=Фантомні піраньї — рідкісна порода піраній з магічними здібностями та моторошними напівпрозорими тілами. Вони здатні телепортуватися під час атаки, щоб втекти або швидко наблизитися до ворога!\n\nХоча з ними дратує битися, їхнє м'ясо цінується за свої магічні властивості.
actors.mobs.phantompiranha.name=фантомна піранья
actors.mobs.phantompiranha.teleport_away=Фантомна піранья телепортується геть...
actors.mobs.piranha.desc=Цих хижих риб розводять спеціально для захисту затоплених територій. Їхній укус смертельно небезпечний, тому краще уникати прямої зустрічі з ними.
actors.mobs.piranha.discover_hint=Ви можете знайти цього ворога будь-де в підземеллі.
actors.mobs.piranha.name=гігантська піранья
actors.mobs.pylon.desc_active=Енергетична опора, призначена для регулювання електроенергії, яка живить обладнання в цій зоні. Опора зараз переповнена електричною енергією, мабуть, це те, що наддуває DM-300!\n\nУ такому стані опори вразливі, але утворюють дугу електрики до сусідніх елементів за годинниковою стрілкою. Завдяки своїй важкій металевій конструкції, опори стійкі до великих пошкоджень.
actors.mobs.pylon.desc_inactive=Енергетична опора, призначена для регулювання електроенергії, яка живить обладнання в цій зоні. \n\nОпора наразі неактивна та не захищена від пошкоджень.
actors.mobs.pylon.name=опора електропередач
actors.mobs.rat.desc=Сумчасті щури — агресивні, але досить слабкі мешканці каналізації. Вони мають неприємний укус, але становлять загрозу для життя лише у великій кількості.
actors.mobs.rat.name=сумчастий щур
actors.mobs.ripperdemon.desc=Ці жахливі істоти є результатом використання численних трупів гномів у цьому регіоні демонічними силами. Розпорювачі — це виснажені, моторошні істоти, схожі на гномів, але зі зламаними тілами та довгими гострими кігтями з кісток. \n\nДемони-розпорювачі не особливо витривалі, але вони спритні та небезпечні. Вони здатні стрибати на великі відстані, щоб швидко досягти цілей, перш ніж пробити їх своїми кігтями.
actors.mobs.ripperdemon.leap=Демон-розпорювач готується до стрибка!
actors.mobs.ripperdemon.name=демон-різник
actors.mobs.rotheart.desc=Плід гнильниці дуже унікальний. Замість того, щоб гнити та забезпечувати поживні речовини, плід росте, твердне та оточує насіння. Це забезпечує захист внутрішніх органів, які ростуть усередині плоду. Цю гігантську кулю називають серцем дорослої рослини гнильниці.
actors.mobs.rotheart.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.rotheart.name=гниле серце
actors.mobs.rotlasher.desc=Гнильозобійник є частиною кореневої системи дорослої рослини гнильозобійниці, а також її основним засобом захисту. Гнильозобійники сліпі та встромлені в землю, але жорстоко атакують будь-яку загрозу поблизу, як тільки знайдуть її на мить. Коли поблизу немає ворогів, вони стоять нерухомо, намагаючись злитися з навколишньою рослинністю.
actors.mobs.rotlasher.discover_hint=Ви можете знайти цього ворога під час виконання певного квесту.
actors.mobs.rotlasher.name=гнильний хлист
actors.mobs.scorpio.desc=Ці величезні демонічні істоти, схожі на павукоподібних, уникають ближнього бою, вважаючи за краще стріляти калічачими зазубреними шипами з великих відстаней.
actors.mobs.scorpio.name=скорпіон
actors.mobs.senior.desc=Ці монахи — фанатики, які присвятили себе захисту таємниць свого міста від усіх чужинців. Вони не користуються ні обладунками, ні зброєю, покладаючись лише на мистецтво рукопашного бою.
actors.mobs.senior.name=старший чернець
actors.mobs.shaman$blueshaman.spell_desc=Цей шаман носить синю маску та використовуватиме магію, яка тимчасово _збільшує отриману вами шкоду._
actors.mobs.shaman$purpleshaman.spell_desc=Цей шаман носить фіолетову маску та використовуватиме магію, яка тимчасово _зменшує вашу точність та ухилення._
actors.mobs.shaman$redshaman.spell_desc=Цей шаман носить червону маску та використовуватиме магію, яка тимчасово _послаблює вашу атакуючу силу._
actors.mobs.shaman.bolt_kill=Чарівна блискавка вбила тебе...
actors.mobs.shaman.desc=Найрозумніші гноли здатні опанувати шаманську магію. Гноли-шамани віддають перевагу бойовим закляттям, якими надолужують брак сили, і без вагань застосовують їх проти тих, хто ставить під сумнів їхнє місце в племені.
actors.mobs.shaman.name=гнол-шаман
actors.mobs.skeleton.def_verb=заблоковано
actors.mobs.skeleton.desc=Скелети складені з кісток нещасливих шукачів пригод і мешканців підземелля, оживлених злою магією з глибин. Зазнавши достатніх ушкоджень, вони розлітаються вибухом кісток.
actors.mobs.skeleton.explo_kill=Тебе вбив вибух кісток...
actors.mobs.skeleton.name=скелет
actors.mobs.slime.def_verb=заблоковано
actors.mobs.slime.desc=Слизняки — дивні, трохи магічні істоти з гумовим зовнішнім тілом та рідким ядром. Міська каналізація забезпечує їх достатнім запасом води та поживних речовин.\n\nЧерез їхню еластичну зовнішню мембрану важко завдати слизнякам більше _6 одиниць шкоди_ однією атакою.
actors.mobs.slime.name=слиз
actors.mobs.snake.desc=Ці величезні змії здатні швидко ковзати навколо ударів, що робить їх досить важкими для враження. Однак магічні атаки або несподівані атаки здатні застати їх зненацька.\n\nВи можете здійснити несподівану атаку, атакуючи, перебуваючи поза полем зору змії. Один із способів — дозволити змії переслідувати вас через дверний отвір, а потім _вдарити одразу після того, як вона зайде в двері._
actors.mobs.snake.hint=Спробуйте скористатися кнопкою дослідження на змії, щоб навчитися протистояти їй.
actors.mobs.snake.name=каналізаційна змія
actors.mobs.spectralnecromancer.desc=Хоча скелети — це хліб насущний для некромантів, деякі надають перевагу іншим, менш тілесним міньйонам. Примарні некроманти обрали привидів своїми улюбленими міньйонами!\n\nОкремі привиди не такі сильні, як скелети, але ці некроманти не бояться викликати їх цілу купу!
actors.mobs.spectralnecromancer.name=спектральний некромант
actors.mobs.spinner.desc=Ці зеленкуваті волохаті печерні павуки уникають прямого бою. Вони воліють чекати осторонь, поки жертва, заплутана в їхній павутині, повільно помирає від отруйного укусу.
actors.mobs.spinner.name=печерний павук
actors.mobs.statue.def_verb=заблоковано
actors.mobs.statue.desc=Можна було б подумати, що це просто ще одна з неживих статуй цього підземелля, але її червоні сяючі очі видають це.
actors.mobs.statue.desc_weapon=Хоча сама статуя зроблена з каменю, _%s_, який вона тримає, виглядає справжньою.
actors.mobs.statue.discover_hint=Ви можете знайти цього ворога будь-де в підземеллі.
actors.mobs.statue.name=анімована статуя
actors.mobs.succubus.desc=Сукуби — демони в подобі звабливих дівчат із дещо готичним виглядом. Своєю магією сукуб може зачарувати героя, і той не зможе нікого атакувати, доки чари не розвіються.
actors.mobs.succubus.name=сукуб
actors.mobs.swarm.desc=Смертельний рій мух сердито дзижчить. Кожна немагічна атака розділить його на два менші, але однаково небезпечні рої.
actors.mobs.swarm.name=рій мух
actors.mobs.tengu$bombability$bombblob.desc=Тут клубочиться хмара перегрітого диму. Обережно, вона вибухне!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Воно приклеїлося до землі, його не зрушити з місця!
actors.mobs.tengu$bombability$bombitem.desc=Тенгу кинув сюди дивну димову шашку, яка клубочиться густим гарячим димом. Вона видає гучне цокання, ніби веде зворотний відлік до вибуху!\n\nБомба закріпилася на землі, тому ви не можете її підняти.
actors.mobs.tengu$bombability$bombitem.name=димова бомба
actors.mobs.tengu$fireability$fireblob.desc=Тенгу кинув дрібний порошок, який, здається, починає парити, ось-ось спалахне!
actors.mobs.tengu$shockerability$shockerblob.desc=Тут накопичується електрична енергія, все, що стоїть на цій плитці, отримає струм наступного разу!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Воно виробляє забагато електрики, ти не можеш його схопити!
actors.mobs.tengu$shockerability$shockeritem.desc=Тенгу кинув сюди цікаву машину, яка, здається, зроблена з деталей DM-100. Машина постійно випромінює електричну дугу навколо себе, але, здається, це відбувається за передбачуваною схемою. \n\nЗ усією цією електричною дугою навколо неї немає жодного способу це підняти.
actors.mobs.tengu$shockerability$shockeritem.name=Шокер
actors.mobs.tengu.defeated=Нарешті вільний...
actors.mobs.tengu.desc=Тенґу належать до давнього клану вбивць із такою самою назвою. Вони відомі частим використанням сюрикенів і пасток.
actors.mobs.tengu.interesting=Давайте зробимо це цікавим...
actors.mobs.tengu.name=Тенґу
actors.mobs.tengu.notice_gotcha=Зрозумів, %s!
actors.mobs.tengu.notice_have=Тепер ти в мене є, %s!
actors.mobs.tengu.rankings_desc=Убитий тенгу
actors.mobs.thief.carries=Злодій несе _%s._ Очевидно, вкрадено.
actors.mobs.thief.desc=Хоча ці в'язні вільно блукають своїми камерами, це місце все ще залишається їхньою в'язницею. З часом це місце забрало їхній розум, а також їхню свободу. Давно ці божевільні злодії та бандити забули, хто вони і чому крадуть.\n\nЦі вороги радше крадуть і тікають, ніж б'ються. Обов'язково тримайте їх на виду, інакше ви можете ніколи більше не побачити свою вкрадену річ.
actors.mobs.thief.escapes=Злодій втече з вашого %s!
actors.mobs.thief.name=божевільний злодій
actors.mobs.thief.stole=Злодій вкрав у тебе %s!
actors.mobs.tormentedspirit.desc=Змучений дух — це добродушний дух, на якого накладено прокляття. Поки він проклятий, він атакуватиме так само, як привид, і водночас буде сильнішим!\n\nМожливо, можна очистити прокляття, використовуючи правильний предмет, перебуваючи поруч із духом. Якщо прокляття буде знято, дух неодмінно буде вдячний...
actors.mobs.tormentedspirit.name=стражденний дух
actors.mobs.tormentedspirit.thank_you=Дякую...
actors.mobs.vaultrat.desc=Цей пацюк має деякі зміни в поведінці, щоб випробувати нового ворога у сховищі: \n_-_ Його рух можна «почути» крізь стіни\n_-_ Він блукатиме вздовж заздалегідь встановленого патруля\n_-_ Під час блукання його дальність виявлення за напрямком руху різко зменшується.\n_-_ Під час сну дальність виявлення також зменшується\n_-_ Коли він виявляє вас, він «розслідує», перш ніж перейти до полювання. Вороги, що досліджують, рухаються до вас, але не атакують і їх легше загубити за дверима та кутами.
actors.mobs.warlock.bolt_kill=Тіньова блискавка вбила тебе...
actors.mobs.warlock.desc=Коли дворфи проміняли інженерну справу на таємні мистецтва, владу в місті захопили чорнокнижники. Почавши з магії стихій, вони невдовзі перейшли до демонології та некромантії.
actors.mobs.warlock.name=дворф-чорнокнижник
actors.mobs.wraith.desc=Привид — це мстивий дух грішника, чию могилу чи усипальницю було порушено. Будучи ефемерною сутністю, його дуже важко вразити звичайною зброєю.
actors.mobs.wraith.discover_hint=Ви можете знайти цього ворога будь-де в підземеллі.
actors.mobs.wraith.name=привид
actors.mobs.yogdzewa$larva.desc=Ці крихітні нащадки Йог-Дзеви — прості міньйони, яких легко створити. Хоча окремо вони слабкі, їх швидко викликають, а у великій кількості вони можуть стати приголомшливими.
actors.mobs.yogdzewa$larva.name=личинка бога
actors.mobs.yogdzewa$larva.rankings_desc=Поглинутий Йог-Дзевою
actors.mobs.yogdzewa$yogeye.rankings_desc=Поглинутий Йог-Дзевою
actors.mobs.yogdzewa$yogripper.rankings_desc=Поглинутий Йог-Дзевою
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Поглинутий Йог-Дзевою
actors.mobs.yogdzewa.darkness=Темрява насувається ближче...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Йог-Дзева — Стародавній Бог; велике чудовисько, яке проникає у світи смертних і пожирає їх, щоб підживлювати своє нескінченне зростання. Гноми, мабуть, привернули увагу цього космічного жаху, граючись з темною магією, і з того часу намагаються стримувати його.\n\nЙог-Дзева походить з виміру сирого магічного хаосу і не може принести свою справжню форму в цей світ. Натомість він створив аватари та викликав демонічних міньйонів, щоб виконувати тут свої накази.\n\nЦе гігантське око є центром сили Йог-Дзеви в цьому світі. Хоча саме око нерухоме, воно здатне стріляти потужними променями демонічної магії та викликати різноманітних міньйонів на допомогу.
actors.mobs.yogdzewa.desc_spawners=Ви можете відчути хвилі демонічної енергії, що випромінюються в око з верхніх поверхів. Щось, що ви залишили живим там, нагорі, мабуть, повертає силу назад до Йог-Дзеви. _Йог використає цю енергію, щоб викликати ще могутніших міньйонів!_
actors.mobs.yogdzewa.hope=ТВОЯ. НАДІЯ. – ЦЕ. ІЛЮЗІЯ!
actors.mobs.yogdzewa.name=Йог-Дзева
actors.mobs.yogdzewa.notice=Я. БАЧУ. ТЕБЕ.
actors.mobs.yogdzewa.rankings_desc=Поглинутий Йог-Дзевою
actors.mobs.yogfist$brightfist.desc=Цей кулак сформований з чистої світлової енергії. Він здатний щоразу стріляти потужними променями палючого світла! Ці промені тимчасово засліплять вас, а також завдадуть значної шкоди. Кулак також здатний ненадовго охопити арену сліпучим світлом, щоб ви могли втекти!\n\nОднак кулак не має спеціальних здібностей, які можна використовувати в ближньому бою.
actors.mobs.yogfist$brightfist.name=яскравий кулак
actors.mobs.yogfist$brightfist.teleport=Кулак телепортується геть у спалаху світла, який серйозно засліплює тебе!
actors.mobs.yogfist$burningfist.desc=Величезний кулак, охоплений вогнем. Пальці з тріском стискаються, розсипаючи жар по підлозі.
actors.mobs.yogfist$burningfist.name=палаючий кулак
actors.mobs.yogfist$darkfist.desc=Цей кулак сформований з чистої темної енергії. Він здатний щоразу стріляти потужними вибухами темної магії! Ці вибухи послаблять ваше джерело світла, а також завдадуть значної шкоди. Кулак також здатний ненадовго поглинути арену темрявою, щоб втекти!\n\nОднак кулак не має спеціальних здібностей, які він може використовувати в ближньому бою.
actors.mobs.yogfist$darkfist.name=темний кулак
actors.mobs.yogfist$darkfist.teleport=Кулак телепортується геть у вибуху темряви, який гасить ваше джерело світла!
actors.mobs.yogfist$rottingfist.desc=Величезний кулак із гнилої плоті. Між пальцями сочиться смердючий слиз, бруднячи камінь під ним.
actors.mobs.yogfist$rottingfist.name=гниючий кулак
actors.mobs.yogfist$rustedfist.desc=Цей кулак сформований з живого металу. Це величезна маса рухомого металу, яка має потужні атаки ближнього бою та може калічити цілі на відстані. Через свою величезну масу кулак отримуватиме будь-яку завдану йому шкоду з часом, а не миттєво.\n\nОднак кулак негнучкий і не може рухатися у вузьких проходах. Крім того, хоча він може отримувати шкоду повільно, відкладена шкода продовжуватиме зростати, якщо кулаком вдарити кілька разів.
actors.mobs.yogfist$rustedfist.name=іржавий кулак
actors.mobs.yogfist$soiledfist.desc=Цей кулак утворений з хаотичної земляної магії. Під час руху він постійно змушує проростати рослинність навколо себе. Він також може стріляти концентрованими земляними вибухами, які заманюють його ціль у швидкозростаючі лози та коріння!\n\nКулак отримує силу з цієї рослинності та чинить опір пошкодженням залежно від кількості високої або борознистої рослинності поблизу!
actors.mobs.yogfist$soiledfist.name=забруднений кулак
actors.mobs.yogfist.desc=Цей кулак є аспектом сили Йог-Дзеви. Кулаки пов'язані з силою Йог-Дзеви та будуть захищені від будь-якої шкоди, коли вони знаходяться близько до ока.
actors.mobs.yogfist.invuln_warn=Кулак невразливий, поки він близько до ока!
actors.mobs.yogfist.rankings_desc=Поглинутий Йог-Дзевою
actors.char.def_verb_evaded=ухилився
actors.char.enemy_hit=%s вдарив тебе
actors.char.enemy_missed=Ви, %2$s, атакуєте %1$s
