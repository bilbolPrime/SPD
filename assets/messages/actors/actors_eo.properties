actors.hero.talent.evasive_armor.desc=_+1:_ Dum libera kurado, la Freekuristo gajnas plian _+1 evasion_ per troa fortopunkto sur sia kiraso.\n\n_+2:_ Dum libera kurado, la Freekuristo gajnas plian _+2 evasion_ per troa fortopunkto sur sia kiraso.\n\n_+2:_ Dum libera kurado, la Freekuristo gajnas plian _+2 evasion_ por troa fortopunkto sur sia kiraso.\n\n_+2: Freerunner gajnas plian _+3 evasion_ per troa fortopunkto sur sia kiraso.
