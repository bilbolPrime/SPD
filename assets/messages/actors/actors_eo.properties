actors.hero.talent.expose_weakness.desc=_+1:_ Malamikoj kiuj atakas la postbildon de la Duelanto fariĝas malfortaj kaj vundeblaj dum _2 vicoj_.\n\n_+2:_ Malamikoj kiuj atakas la postbildon de la Duelanto fariĝas malfortaj kaj vundeblaj dum _4 vicoj_.\n\n_+3:_ Malamikoj kiuj atakas la postbildon de la Duelanto fariĝas malfortaj kaj vundeblaj dum _6 vicoj_.\n\n_+4:_ Malamikoj kiuj atakas la postbildon de la Duelanto fariĝas malfortaj kaj vundeblaj dum _8 vicoj_.
