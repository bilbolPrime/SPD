actors.hero.talent.endless_rage.desc=_+1:_ La Berserko povas atingi maksimumon de _116% kolero_.\n\n_+2:_ La Berserko povas atingi maksimumon de _133% kolero_.\n\n_+3:_ La Berserko povas atingi maksimumon de _150% kolero_.\n\nĈiu poento de kolero super 100% pliigas la berserkan ŝirmadon je 1% kaj reduktas malvarmiĝtempon je 1%, sed ne pliigas la damaĝan bonuson preter +50%.
actors.hero.talent.endless_rage.title=senfina kolero
actors.hero.talent.energizing_meal.desc=_+1:_ Manĝi manĝaĵon prenas por la Magiisto 1 vicon kaj donas al li _5 vicojn da sorĉbastono reŝargado_.\n\n_+2:_ Manĝi manĝaĵon prenas por la Magiisto 1 vicon kaj donas al li _8 vicojn da sorĉbastono reŝargado_.
actors.hero.talent.energizing_meal.title=vigliga manĝo
actors.hero.talent.enhanced_combo.desc=_+1:_ Kiam la kombo de la Gladiatoro estas 7 aŭ pli alta, la repuŝatingo de Clobber pliiĝas al 3, ĝi kaŭzas vertiĝon, kaj ĝi povas faligi malamikojn en fosaĵojn.\n\n_+2:_ Aldone al la avantaĝoj de +1, kiam la kombo de la Gladiatoro estas 9 aŭ pli alta, Parado funkcias sur pluraj atakoj.\n\n_+3:_ Aldone al la avantaĝoj de +1 kaj +2, la Gladiatoro povas salti ĝis kombo/3 kaheloj kiam li uzas Frapegon, Dispremadon aŭ Koleregon.
actors.hero.talent.enhanced_combo.title=plibonigita kombinaĵo
actors.hero.talent.enhanced_lethality.desc=_+1:_ La Insidmurdisto povas asasini malamikojn lasitajn je sub _4/13/27/67% sano_ po nivelo de preparo, pli ol 3/10/20/50%.\n\n_+2:_ La Insidmurdisto povas asasini malamikojn lasitajn je sub _5/17/33/83% sano_ po nivelo de preparo, pli ol 3/10/20/50%.\n\n_+3:_ La Insidmurdisto povas asasini malamikojn lasitajn je sub _6/20/40/100% sano_ po nivelo de preparo, pli ol 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=plifortigita letaleco
actors.hero.talent.enhanced_rings.desc=_+1:_ Kiam la Fripono uzas artefakton, liaj ringoj gajnas +1 plibonigon dum _3 vicoj_.\n\n_+2:_ Kiam la Fripono uzas artefakton, liaj ringoj gajnas +1 plibonigon dum _6 vicoj_.\n\n_+3:_ Kiam la Fripono uzas artefakton, liaj ringoj gajnas +1 plibonigon dum _9 vicoj_.
