actors.hero.talent.fan_of_blades.desc=_+1:_ Spektraj klingoj povas trafi ĝis _1 plian celon_ por 50%-a damaĝo. La celo devas esti videbla kaj ene de _30-grada_ konuso AOE.\n\n_+2:_ Spektraj klingoj povas trafi ĝis _2 pliajn celojn_ por 50%-a damaĝo. La celoj devas esti videblaj kaj ene de _60-grada_ konuso AOE.\n\n_+3:_ Spektraj klingoj povas trafi ĝis _3 pliajn celojn_ por 50%-a damaĝo. La celoj devas esti videblaj kaj ene de _90-grada_ konuso AOE.\n\n_+4:_ Spektraj klingoj povas trafi ĝis _4 pliajn celojn_ por 50%-a damaĝo. La celoj devas esti videblaj kaj ene de _120-grada_ konuso AOE.
actors.hero.talent.fan_of_blades.title=ventumilo de klingoj
actors.hero.talent.farsight.desc=_+1:_ La vidkampo de la kaŝpafisto estas _pliigita je 25%_.\n\n_+2:_ La vidkampo de la kaŝpafisto estas _pliigita je 50%_.\n\n_+3:_ La vidkampo de la kaŝpafisto estas _pliigita je 75%_.
actors.hero.talent.farsight.title=malproksimeco
actors.hero.talent.fear_the_reaper.desc=_+1:_ Kiam mortmarkita malamiko atingas 0 vivpoentojn, ili fariĝas _kripligitaj_.\n\n_+2:_ Kiam mortmarkita malamiko atingas 0 vivpoentojn, ili fariĝas _timataj kaj kripligitaj_.\n\n_+3:_ Kiam mortmarkita malamiko atingas 0 vivpoentojn, ili fariĝas _timataj kaj kripligitaj_ kaj malamikoj ene de 3 kaheloj fariĝas _kripligitaj_.\n\n_+4:_ Kiam mortmarkita malamiko atingas 0 vivpoentojn, ili fariĝas _timataj kaj kripligitaj_ kaj malamikoj ene de 3 kaheloj fariĝas _timataj kaj kripligitaj_.
actors.hero.talent.fear_the_reaper.title=timu la rikoltanton
actors.hero.talent.feigned_retreat.desc=_+1:_ Se malamiko atakas la postbildon de la Duelanto, ŝi gajnas _2 vicojn_ da hasto.\n\n_+2:_ Se malamiko atakas la postbildon de la Duelanto, ŝi gajnas _4 vicojn_ da hasto.\n\n_+3:_ Se malamiko atakas la postbildon de la Duelanto, ŝi gajnas _6 vicojn_ da hasto.\n\n_+4:_ Se malamiko atakas la postbildon de la Duelanto, ŝi gajnas _8 vicojn_ da hasto.
actors.hero.talent.feigned_retreat.title=ŝajnigita retiriĝo
actors.hero.talent.fire_everything.desc=_+1:_ Sovaĝa magio nun pafas _5 fojojn_ de 4, kaj ĉiu sorĉbastono havas _25% ŝancon_ esti uzebla 3 fojojn.\n\n_+2:_ Sovaĝa magio nun pafas _6 fojojn_ de 4, kaj ĉiu sorĉbastono havas _50% ŝancon_ esti uzebla 3 fojojn.\n\n_+3:_ Sovaĝa magio nun pafas _7 fojojn_ de 4, kaj ĉiu sorĉbastono havas _75% ŝancon_ esti uzebla 3 fojojn.\n\n_+4:_ Sovaĝa magio nun pafas _8 fojojn_ de 4, kaj ĉiu sorĉbastono havas _100% ŝancon_ esti uzebla 3 fojojn.
actors.hero.talent.fire_everything.title=fajrobruli ĉion
actors.hero.talent.flash.desc=_+1:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Fulmon_ por teletransporti ĝis _3 kahelojn_ for.\n\n_+2:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Fulmon_ por teletransporti ĝis _4 kahelojn_ for.\n\n_+3:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Fulmon_ por teletransporti ĝis _5 kahelojn_ for.\n\n_+4:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Fulmon_ por teletransporti ĝis _6 kahelojn_ for.\n\nFulmo kostas 2 volumajn ŝargojn komence, kaj 1 plian ŝargon por ĉiu uzo en la sama ĉielirita formo.
actors.hero.talent.flash.title=fulmo
actors.hero.talent.focused_meal.desc=_+1:_ Manĝi manĝaĵon prenas la Duelanton 1 vicon kaj donas al ŝi _0.67 ŝargojn_ sur ŝiaj armiloj.\n\n_+2:_ Manĝi manĝaĵon prenas la Duelanton 1 vicon kaj donas al ŝi _1 ŝargon_ sur ŝiaj armiloj.
actors.hero.talent.focused_meal.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe donos kromdamaĝon al ilia sekva trafo egalan al ilia nivelo/3 je +1, aŭ nivelo/2 je +2.
actors.hero.talent.focused_meal.title=fokusita manĝo
actors.hero.talent.followup_strike.desc=_+1:_ Kiam la Ĉasistino trafas malamikon per sia arko aŭ ĵetarmilo, ŝia sekva manbatalo kontraŭ tiu malamiko kaŭzas _2 kromdamaĝon_.\n\n_+2:_ Kiam la Ĉasistino trafas malamikon per sia arko aŭ ĵetarmilo, ŝia sekva manbatalo kontraŭ tiu malamiko kaŭzas _3 kromdamaĝon_.
actors.hero.talent.followup_strike.title=sekva striko
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Atakoj de la spirita akcipitro blindigas malamikojn dum _2 turnoj_.\n\n_+2:_ Atakoj de la spirita akcipitro blindigas malamikojn dum _5 turnoj_.\n\n_+3:_ Atakoj de la spirita akcipitro blindigas malamikojn dum _5 turnoj_ kaj kripligas ilin dum _2 turnoj_.\n\n_+4:_ Atakoj de la spirita akcipitro blindigas malamikojn dum _5 turnoj_ kaj kripligas ilin dum _5 turnoj_.
actors.hero.talent.go_for_the_eyes.title=iru por la okuloj
actors.hero.talent.growing_power.desc=_+1:_ La plialtigoj de atako kaj movrapideco pro la natura povo estas pliigitaj al _38% kaj 125%_, de 33% kaj 100%.\n\n_+2:_ La plialtigoj de atako kaj movrapideco pro la natura povo estas pliigitaj al _42% kaj 150%_, de 33% kaj 100%.\n\n_+3:_ La plialtigoj de atako kaj movrapideco pro la natura povo estas pliigitaj al _46% kaj 175%_, de 33% kaj 100%.\n\n_+4:_ La plialtigoj de atako kaj movrapideco pro la natura povo estas pliigitaj al _50% kaj 200%_, de 33% kaj 100%.
actors.hero.talent.growing_power.title=kreskanta potenco
actors.hero.talent.hallowed_ground.desc=_+1:_ La Pastro povas ĵeti _Sanktigitan Grundon,_ sorĉon kiu sanktigas terenon en _3x3 areo_ dum 20 vicoj, je la kosto de 2 ŝargoj.\n\n_+2:_ La Pastro povas ĵeti _Sanktigitan Grundon,_ sorĉon kiu sanktigas terenon en _5x5 areo_ dum 20 vicoj, je la kosto de 2 ŝargoj.\n\n_+3:_ La Pastro povas ĵeti _Sanktigitan Grundon,_ sorĉon kiu sanktigas terenon en _7x7 areo_ dum 20 vicoj, je la kosto de 2 ŝargoj.\n\nKiam ĝi estas ĵetita, Sanktigita Grundo resanigas aliancanojn je 15 vivpoentoj, nelonge enradikigas malamikojn, kaj disvastigas mallongan herbon. Poste, ĝi malrapide resanigas aliancanojn, kripligas malamikojn, kaj kaŭzas hazardan kreskadon de alta herbo. Sanktiga tero donas ŝirmadon al la pastro anstataŭ resanigo kaj estas detruita per fajro.
actors.hero.talent.hallowed_ground.title=sankta tero
actors.hero.talent.hasty_retreat.desc=_+1:_ Post palpebrumado la Fripono gajnas _1 vicon_ da hasto kaj nevidebleco.\n\n_+2:_ Post palpebrumado la Fripono gajnas _2 vicojn_ da hasto kaj nevidebleco.\n\n_+3:_ Post palpebrumado la Fripono gajnas _3 vicojn_ da hasto kaj nevidebleco.\n\n_+4:_ Post palpebrumado la Fripono gajnas _4 vicojn_ da hasto kaj nevidebleco.
actors.hero.talent.hasty_retreat.title=rapida retiriĝo
actors.hero.talent.hearty_meal.desc=_+1:_ Manĝado resanigas la Militiston je _4 Vivpoentoj_ kiam li havas sano je aŭ malpli ol 33%.\n\n_+2:_ Manĝado resanigas la Militiston je _6 Vivpoentoj_ kiam li havas sano je aŭ malpli ol 33%.
actors.hero.talent.hearty_meal.title=abunda manĝo
actors.hero.talent.heightened_senses.desc=_+1:_ La Ĉasistino akiras mensan vidon sur roluloj ene de _2 kaheloj de ŝia pozicio_.\n\n_+2:_ La Ĉasistino akiras mensan vidon sur roluloj ene de _3 kaheloj de ŝia pozicio_.
actors.hero.talent.heightened_senses.title=plifortigitaj sentoj
actors.hero.talent.heroic_energy.desc=_+1:_ La kiraskapablo de la heroo havas _12% reduktitan_ ŝargkoston.\n\n_+2:_ La kiraskapablo de la heroo havas _23% reduktitan_ ŝargkoston.\n\n_+3:_ La kiraskapablo de la heroo havas _32% reduktitan_ ŝargkoston.\n\n_+4:_ La kiraskapablo de la heroo havas _40% reduktitan_ ŝargkoston.
actors.hero.talent.heroic_energy.rat_title=ratroika energio
actors.hero.talent.heroic_energy.title=heroa energio
actors.hero.talent.hold_fast.desc=_+1:_ Kiam la Militisto atendas, li gajnas _1-2 kirason_ kaj malrapidigas la kadukiĝon de kombinaĵaj kaj ŝirmaj plibonigoj je _50%_ ĝis li moviĝas.\n\n_+2:_ Kiam la Militisto atendas, li gajnas _2-4 kirason_ kaj malrapidigas la kadukiĝon de kombinaĵaj kaj ŝirmaj plibonigoj je _75%_ ĝis li moviĝas.\n\n_+3:_ Kiam la Militisto atendas, li gajnas _3-6 kirason_ kaj malrapidigas la kadukiĝon de kombinaĵaj kaj ŝirmaj plibonigoj je _100%_ ĝis li moviĝas.
actors.hero.talent.hold_fast.title=tenu firme
actors.hero.talent.holy_intuition.desc=_+1:_ La Kleriko povas ĵeti _Sanktan Intuicion,_ sorĉon kiu malkaŝas ĉu objekto estas malbenita je la kosto de _3 ŝargoj._\n\n_+2:_ La Kleriko povas ĵeti _Sanktan Intuicion,_ sorĉon kiu malkaŝas ĉu objekto estas malbenita je la kosto de _2 ŝargoj._
actors.hero.talent.holy_intuition.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe permesos al la heroo identigi la malbenan staton de malbenita objekto ĝuste antaŭ ol ekipi ĝin, 15% de la tempo je +1 aŭ 25% de la tempo je +2.
actors.hero.talent.holy_intuition.title=sankta intuicio
actors.hero.talent.holy_lance.desc=_+1:_ La Pastro povas ĵeti _Sanktan Lancon,_ detruan sorĉon kiu kaŭzas _30-55 damaĝon_ je la kosto de 4 ŝargoj.\n\n_+2:_ La Pastro povas ĵeti _Sanktan Lancon,_ detruan sorĉon kiu kaŭzas _45-83 damaĝon_ je la kosto de 4 ŝargoj.\n\n_+3:_ La Pastro povas ĵeti _Sanktan Lancon,_ detruan sorĉon kiu kaŭzas _60-110 damaĝon_ je la kosto de 4 ŝargoj.\n\nSankta Lanco ĉiam kaŭzas maksimuman damaĝon al demonaj kaj malmortaj malamikoj. Sankta Lanco havas malvarmiĝtempon de 30-vira antaŭ ol ĝi povas esti ĵetita denove.
actors.hero.talent.holy_lance.title=sankta lanco
actors.hero.talent.impact_wave.desc=_+1:_ Kiam la Militisto alteriĝas post saltado, ĉiuj apudaj malamikoj estas ĵetitaj _2 kahelojn_ malantaŭen kaj havas _25% ŝancon_ iĝi vundeblaj dum 5 turnoj.\n\n_+2:_ Kiam la Militisto alteriĝas post saltado, ĉiuj apudaj malamikoj estas ĵetitaj _3 kahelojn_ malantaŭen kaj havas _50% ŝancon_ iĝi vundeblaj dum 5 turnoj.\n\n_+3:_ Kiam la Militisto alteriĝas post saltado, ĉiuj apudaj malamikoj estas ĵetitaj _4 kahelojn_ malantaŭen kaj havas _75% ŝancon_ iĝi vundeblaj dum 5 turnoj.\n\n_+4:_ Kiam la Militisto alteriĝas post saltado, ĉiuj apudaj malamikoj estas ĵetitaj _5 kahelojn_ malantaŭen kaj havas _100% ŝancon_ iĝi vundeblaj dum 5 turnoj.
actors.hero.talent.impact_wave.title=efikondo
actors.hero.talent.improvised_projectiles.desc=_+1:_ La Militisto povas blindigi malamikon dum _2 vicoj_ ĵetante al ili ajnan objekton, kiu ne estas ĵetarmilo. Ĉi tio havas malvarmiĝtempon de 50-vira.\n\n_+2:_ La Militisto povas blindigi malamikon dum _3 vicoj_ ĵetante al ili ajnan objekton, kiu ne estas ĵetarmilo. Ĉi tio havas malvarmiĝtempon de 50-vira.
actors.hero.talent.improvised_projectiles.title=improvizitaj kugloj
actors.hero.talent.inscribed_power.desc=_+1:_ Kiam la Magiisto legas volvlibron aŭ uzas sorĉon, liaj _sekvaj 2 sorĉbastonoj_ ricevas +2 nivelojn.\n\n_+2:_ Kiam la Magiisto legas volvlibron aŭ uzas sorĉon, liaj _sekvaj 3 sorĉbastonoj_ ricevas +2 nivelojn.\n\nLa nombro de plibonigitaj sorĉbastonoj duobliĝas kiam oni uzas volvlibron de plibonigaj, transmutaciaj aŭ alkemiaj objektoj, kiuj devas esti kreitaj per tiuj volvlibroj.\n\nPor alkemiaj objektoj kun pli altaj produktaj kvantoj (ekz. plej multaj sorĉoj), ĉi tiu talento havas ŝancon ekfunkcii surbaze de kiom da tiu objekto estas produktita.
actors.hero.talent.inscribed_power.title=surskribita potenco
actors.hero.talent.inscribed_stealth.desc=_+1:_ La Fripono gajnas _3 vicojn_ da nevidebleco post legado de volvlibro aŭ uzado de sorĉaĵo.\n\n_+2:_ La Fripono gajnas _5 vicojn_ da nevidebleco post legado de volvlibro aŭ uzado de sorĉaĵo.\n\nLa daŭro de nevidebleco duobliĝas kiam oni uzas volvlibron de plibonigo, volvlibron de transmutacio aŭ alkemiajn objektojn, kiuj devas esti kreitaj per tiuj volvlibroj.\n\nPor alkemiaj objektoj kun pli altaj produktaj kvantoj (ekz. plej multaj sorĉoj), ĉi tiu talento havas ŝancon ekfunkcii surbaze de kiom da tiu objekto estas produktita.
actors.hero.talent.inscribed_stealth.title=surskribita sekreto
actors.hero.talent.invigorating_meal.desc=_+1:_ Manĝi manĝaĵon prenas por la Ĉasistino 1 vicon (beroj estas manĝataj tuj) kaj donas al ŝi _1 vicon da rapido_.\n\n_+2:_ Manĝi manĝaĵon prenas por la Ĉasistino 1 vicon (beroj estas manĝataj tuj) kaj donas al ŝi _2 vicojn da rapido_.
actors.hero.talent.invigorating_meal.title=revigliga manĝo
actors.hero.talent.invigorating_victory.desc=_+1:_ Se la Duelanto venkas sian celon antaŭ ol la duelo finiĝas, ŝi resaniĝas je _5 Vivpoentoj plus 30% de la damaĝo_ kiun ŝi ricevis dum la duelo.\n\n_+2:_ Se la Duelanto venkas sian celon antaŭ ol la duelo finiĝas, ŝi resaniĝas je _10 Vivpoentoj plus 50% de la damaĝo_ kiun ŝi ricevis dum la duelo.\n\n_+3:_ Se la Duelanto venkas sian celon antaŭ ol la duelo finiĝas, ŝi resaniĝas je _15 Vivpoentoj plus 65% de la damaĝo_ kiun ŝi ricevis dum la duelo.\n\n_+4:_ Se la Duelanto venkas sian celon antaŭ ol la duelo finiĝas, ŝi resaniĝas je _20 Vivpoentoj plus 75% de la damaĝo_ kiun ŝi ricevis dum la duelo.
actors.hero.talent.invigorating_victory.title=revigliga venko
actors.hero.talent.iron_stomach.desc=_+1:_ Manĝi manĝaĵon prenas al la Militisto 1 vicon kaj donas al li _75%-an damaĝoreziston_ dum manĝado.\n\n_+2:_ Manĝi manĝaĵon prenas al la Militisto 1 vicon kaj donas al li _100%-an damaĝoreziston_ dum manĝado.
actors.hero.talent.iron_stomach.title=fera stomako
actors.hero.talent.iron_will.desc=_+1:_ La ŝildo provizita de la sigelo de la Militisto estas _pligrandigita je 1_.\n\n_+2:_ La ŝildo provizita de la sigelo de la Militisto estas _pligrandigita je 2_.
actors.hero.talent.iron_will.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi pasive donos maksimuman ŝildan version de 1 aŭ 2 de la efiko de rompita sigelo de la Militisto.
actors.hero.talent.iron_will.title=fera volo
actors.hero.talent.judgement.desc=_+1:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Juĝon,_ kiu kaŭzas _10-20 damaĝon_ al ĉiuj videblaj malamikoj.\n\n_+2:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Juĝon,_ kiu kaŭzas _15-30 damaĝon_ al ĉiuj videblaj malamikoj.\n\n_+3:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Juĝon,_ kiu kaŭzas _20-40 damaĝon_ al ĉiuj videblaj malamikoj.\n\n_+4:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Juĝon,_ kiu kaŭzas _25-50 damaĝon_ al ĉiuj videblaj malamikoj.\n\nJuĝo kostas 3 volumojn. Juĝo kaŭzas +33% da damaĝo por ĉiu sorĉo, kiun la Kleriko ĵetis ekde eniro en ĉieliran formon aŭ ekde la lasta ĵeto de Juĝo.
actors.hero.talent.judgement.title=juĝo
actors.hero.talent.lay_on_hands.desc=_+1:_ La Paladino povas ĵeti _Manmeton,_ sorĉon kiu tuj resanigas proksiman rolulon je _15 Vivpoentoj,_ aŭ donas al la Paladino _15 ŝirmadon,_ je la kosto de 1 ŝargo.\n\n_+2:_ La Paladino povas ĵeti _Manmeton,_ sorĉon kiu tuj resanigas proksiman rolulon je _20 Vivpoentoj,_ aŭ donas al la Paladino _20 ŝirmadon,_ je la kosto de 1 ŝargo.\n\n_+3:_ La Paladino povas ĵeti _Manmeton,_ sorĉon kiu tuj resanigas proksiman rolulon je _25 Vivpoentoj,_ aŭ donas al la Paladino _25 ŝirmadon,_ je la kosto de 1 ŝargo.\n\nTroa resanigo de ĉi tiu sorĉo estas konvertita en ŝirmadon. Manmeto povas esti uzata plurfoje, sed ne povas apliki pli ol tri fojojn da ŝirmado samtempe.
actors.hero.talent.lay_on_hands.title=meti sur manojn
actors.hero.talent.lethal_defense.desc=_+1:_ Kiam la Gladiatoro mortigas malamikon per kombinita movo, la malvarmiĝtempo de lia rompita sigela ŝirmado estas _reduktita je 50 turnoj_.\n\n_+2:_ Kiam la Gladiatoro mortigas malamikon per kombinita movo, la malvarmiĝtempo de lia rompita sigela ŝirmado estas _reduktita je 100 turnoj_.\n\n_+3:_ Kiam la Gladiatoro mortigas malamikon per kombinita movo, la malvarmiĝtempo de lia rompita sigela ŝirmado estas _reduktita je 150 turnoj_.\n\nLa malvarmiĝtempo de la ŝildo povas esti reduktita ĝis -150 turnoj per ĉi tiu talento, kio signifas, ke ĝi tuj estos havebla denove post kiam ĝi estos aktivigita.
actors.hero.talent.lethal_defense.title=mortiga defendo
actors.hero.talent.lethal_haste.desc=_+1:_ Kiam la Duelanto donas mortigan baton al malamiko per armila kapablo, ŝi gajnas _3 vicojn_ da tuja movado.\n\n_+2:_ Kiam la Duelanto donas mortigan baton al malamiko per armila kapablo, ŝi gajnas _5 vicojn_ da tuja movado.
actors.hero.talent.lethal_haste.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe ekiĝos per regulaj armilatakoj, kun malvarmigtempo de 100-vicoj.
actors.hero.talent.lethal_haste.title=mortiga hasto
actors.hero.talent.lethal_momentum.desc=_+1:_ Kiam la Militisto donas mortigan baton al malamiko per fizika armilo, ĝi havas _67%-an ŝancon_ daŭri 0 vicojn.\n\n_+2:_ Kiam la Militisto donas mortigan baton al malamiko per fizika armilo, ĝi havas _100%-an ŝancon_ daŭri 0 vicojn.
actors.hero.talent.lethal_momentum.title=mortiga impeto
actors.hero.talent.life_link.desc=La Kleriko povas uzi _Vivligon_ inter si kaj povigita aliancano je la kosto de 2 ŝargoj. Ĉi tiu sorĉo kaŭzas dividadon de damaĝo inter la Kleriko kaj ties aliancano, kaj kaŭzas, ke utilaj klerikaj sorĉoj de nivelo 3 aŭ pli malalta aplikiĝas al ambaŭ, se iu estas trafita.\n\n_+1:_ Vivligo daŭras _10 turnojn_ kaj pliigas la bonuson de Potenco de Multaj al _-35% ricevita damaĝo._\n\n_+2:_ Vivligo daŭras _13 turnojn_ kaj pliigas la bonuson de Potenco de Multaj al _-40% ricevita damaĝo._\n\n_+3:_ Vivligo daŭras _17 turnojn_ kaj pliigas la bonuson de Potenco de Multaj al _-45% ricevita damaĝo._\n\n_+4:_ Vivligo daŭras _20 turnojn_ kaj pliigas la bonuson de Potenco de Multaj al _-50% ricevita damaĝo._
actors.hero.talent.life_link.title=vivligo
actors.hero.talent.light_cloak.desc=_+1:_ La Fripono povas uzi sian mantelon de ombroj kiam ĝi ne estas ekipita, sed ĝi reŝargiĝas je _25% rapido_ kiam neekipita.\n\n_+2:_ La Fripono povas uzi sian mantelon de ombroj kiam ĝi ne estas ekipita, sed ĝi reŝargiĝas je _50% rapido_ kiam neekipita.\n\n_+3:_ La Fripono povas uzi sian mantelon de ombroj kiam ĝi ne estas ekipita, sed ĝi reŝargiĝas je _75% rapido_ kiam neekipita.
actors.hero.talent.light_cloak.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe pliigos la ŝargrapidon de ĉiuj artefaktoj je 7/13/20% je +1/+2/+3.
actors.hero.talent.light_cloak.title=malpeza mantelo
actors.hero.talent.light_reading.desc=_+1:_ La Kleriko povas uzi sian sanktan volumon kiam ĝi ne estas ekipita, sed ĝi reŝargiĝas je _25% rapido_ kiam neekipita.\n\n_+2:_ La Kleriko povas uzi sian sanktan volumon kiam ĝi ne estas ekipita, sed ĝi reŝargiĝas je _50% rapido_ kiam neekipita.\n\n_+3:_ La Kleriko povas uzi sian sanktan volumon kiam ĝi ne estas ekipita, sed ĝi reŝargiĝas je _75% rapido_ kiam neekipita.
actors.hero.talent.light_reading.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe pliigos la reŝargan rapidon de ĉiuj sorĉbastonoj je 7/13/20% je +1/+2/+3.
actors.hero.talent.light_reading.title=Malpeza Legado
actors.hero.talent.lingering_magic.desc=_+1:_ Kiam la Magiisto zapas per sorĉbastono aŭ bastono, lia sekva fizika atako kaŭzas _1-2 kroman damaĝon_.\n\n_+2:_ Kiam la Magiisto zapas per sorĉbastono aŭ bastono, lia sekva fizika atako kaŭzas _2 kroman damaĝon_.
actors.hero.talent.lingering_magic.title=daŭranta magio
actors.hero.talent.liquid_agility.desc=_+1:_ Kiam trinkante aŭ ĵetante pocion, trinkaĵon, aŭ eliksiron, la Duelanto havas _3-oblan evitadon_, kaj havas _3-oblan precizecon_ ĉe sia sekva manbatalo ene de 5 vicoj.\n\n_+2:_ Kiam trinkante aŭ ĵetante pocion, trinkaĵon, aŭ eliksiron, la Duelanto havas _senfinan evitadon_, kaj havas _senfinan precizecon_ ĉe sia sekva manbatalo ene de 5 vicoj.\n\nĈi tiu bonuso daŭras por unu plia vico kaj atako kiam oni uzas pociojn de forto, sperto, aŭ alkemiajn objektojn, kiuj devas esti kreitaj per tiuj pocioj.\n\nPor alkemiaj objektoj kun pli altaj produktaj kvantoj (ekz. akva trinkaĵo), ĉi tiu talento havas ŝancon ekfunkcii surbaze de kiom da tiu objekto estas produktita.
actors.hero.talent.liquid_agility.title=likva facilmoveco
actors.hero.talent.liquid_nature.desc=_+1:_ Kiam la Ĉasistino trinkas aŭ ĵetas pocion, trinkaĵon, aŭ eliksiron, _ĝis 4 herbaj kaheloj_ ĝermas en la ĉirkaŭa areo, kaj apudaj malamikoj estas enradikiĝintaj dum _1 turno_.\n\n_+2:_ Kiam la Ĉasistino trinkas aŭ ĵetas pocion, trinkaĵon, aŭ eliksiron, _ĝis 6 herbaj kaheloj_ ĝermas en la ĉirkaŭa areo, kaj apudaj malamikoj estas enradikiĝintaj dum _2 turnoj_.\n\nLa kvanto de herbo kaj radikdaŭro estas duobligita kiam oni uzas pociojn de forto, sperto, aŭ alkemiajn objektojn, kiuj devas esti kreitaj per tiuj pocioj.\n\nPor alkemiaj objektoj kun pli altaj produktaj kvantoj (ekz. akva trinkaĵo), ĉi tiu talento havas ŝancon ekfunkcii surbaze de kiom da tiu objekto estas produktita.
actors.hero.talent.liquid_nature.title=likva naturo
actors.hero.talent.liquid_willpower.desc=_+1:_ La Militisto gajnas _6.5% de sia maksimuma vivpoentoj per ŝirmado_ kiam li trinkas aŭ ĵetas pocion, trinkaĵon aŭ eliksiron.\n\n_+2:_ La Militisto gajnas _10% de sia maksimuma vivpoentoj per ŝirmado_ kiam li trinkas aŭ ĵetas pocion, trinkaĵon aŭ eliksiron.\n\nLa ŝirmkvanto duobliĝas kiam oni uzas pociojn de forto, sperto aŭ alkemiajn objektojn, kiuj devas esti kreitaj per tiuj pocioj.\n\nPor alkemiaj objektoj kun pli altaj produktaj kvantoj (ekz. akva trinkaĵo), ĉi tiu talento havas ŝancon ekfunkciiĝi surbaze de kiom da tiu objekto estas produktita.
actors.hero.talent.liquid_willpower.title=likva voloforto
actors.hero.talent.longrange_warp.desc=_+1:_ La Magiisto nun povas varpiĝi inter etaĝoj, je _150%-a ŝarga kosto_.\n\n_+2:_ La Magiisto nun povas varpiĝi inter etaĝoj, je _117%-a ŝarga kosto_.\n\n_+3:_ La Magiisto nun povas varpiĝi inter etaĝoj, je _83%-a ŝarga kosto_.\n\n_+4:_ La Magiisto nun povas varpiĝi inter etaĝoj, je _50%-a ŝarga kosto_.\n\nLa Magiisto ne povas uzi longdistancan varpiĝon por forlasi ŝlositan etaĝon.
actors.hero.talent.longrange_warp.title=Longdistanca Varpo
actors.hero.talent.mind_form.desc=La Kleriko povas uzi _Mensformon_, kiu plenigas Triunuon per la povo de sorĉbastono aŭ ĵetarmilo, kiun la Kleriko uzis ĉi-foje, je la kosto de 3 ŝargoj.\n\n_+1:_ Kiam Triunuo estas uzata, la Kleriko uzas la teletransportan aŭ ĵetan efikon de la elektita objekto, kvazaŭ ĝi estus _+3._\n\n_+2:_ Kiam Triunuo estas uzata, la Kleriko uzas la teletransportan aŭ ĵetan efikon de la elektita objekto, kvazaŭ ĝi estus _+4._\n\n_+3:_ Kiam Triunuo estas uzata, la Kleriko uzas la teletransportan aŭ ĵetan efikon de la elektita objekto, kvazaŭ ĝi estus _+5._\n\n_+4:_ Kiam Triunuo estas uzata, la Kleriko uzas la teletransportan aŭ ĵetan efikon de la elektita objekto, kvazaŭ ĝi estus _+6._\n\nTriunuo povas esti trapenetrita nur per unu mensa efiko samtempe.
actors.hero.talent.mind_form.title=mensa formo
actors.hero.talent.mnemonic_prayer.desc=_+1:_ La Pastro povas ĵeti _Mnemonikan Preĝon,_ sorĉon kiu etendas plifortigojn/malplifortigojn al aliancano/malamiko dum _3 vicoj_ je 1 ŝarga kosto.\n\n_+2:_ La Pastro povas ĵeti _Mnemonikan Preĝon,_ sorĉon kiu etendas plifortigojn/malplifortigojn al aliancano/malamiko dum _4 vicoj_ je 1 ŝarga kosto.\n\n_+3:_ La Pastro povas ĵeti _Mnemonikan Preĝon,_ sorĉon kiu etendas plifortigojn/malplifortigojn al aliancano/malamiko dum _5 vicoj_ je 1 ŝarga kosto.\n\nMnemonika preĝo ne bezonas tempon por ĵeti. Mnemonika Preĝo povas etendi nur specifan okazon de plifortigo/malplifortigo unufoje, kaj ne povas etendi plifortigojn de kiraskapabloj.
actors.hero.talent.mnemonic_prayer.title=mnemonika preĝo
actors.hero.talent.monastic_vigor.desc=_+1:_ Se la Monaĥo havas _100% da energio_, ŝiaj kapabloj estas plifortigitaj.\n\n_+2:_ Se la Monaĥo havas _80% aŭ pli da energio_, ŝiaj kapabloj estas plifortigitaj.\n\n_+3:_ Se la Monaĥo havas _60% aŭ pli da energio_, ŝiaj kapabloj estas plifortigitaj.\n\nKiam plifortigita:\n- Ekblovo aplikas la sorĉon de via armilo\n- Fokuso estas tuja\n- Kurego gajnas +4 atingon\n- Draka Piedbato kaŭzas +50% da damaĝo kaj aplikas sian repuŝon kaj miregigon al ĉiuj apudaj malamikoj\n- Meditado malrapide resanigas 20% de mankanta vivopovo kaj donas 80% da damaĝrezisto.
actors.hero.talent.monastic_vigor.title=monaĥa vigleco
actors.hero.talent.mystical_charge.desc=_+1:_ Bati per sia bastono donas al la Batalmago _0.5 turnojn_ da reŝargado de artefaktoj.\n\n_+2:_ Bati per sia bastono donas al la Batalmago _1 turnon_ da reŝargado de artefaktoj.\n\n_+3:_ Bati per sia bastono donas al la Batalmago _1.5 turnojn_ da reŝargado de artefaktoj.
actors.hero.talent.mystical_charge.title=mistera ŝargo
actors.hero.talent.mystical_meal.desc=_+1:_ Manĝi manĝaĵon prenas por la Fripono 1 vicon (provizoj estas manĝataj tuj) kaj donas al li _3 vicojn da artefakta reŝargado_.\n\n_+2:_ Manĝi manĝaĵon prenas por la Fripono 1 vicon (provizoj estas manĝataj tuj) kaj donas al li _5 vicojn da artefakta reŝargado_.\n\nĈi tiu talento ne uzeblas por lasi la kornon de abundo reŝargi sin.
actors.hero.talent.mystical_meal.title=mistera manĝo
actors.hero.talent.natures_aid.desc=_+1:_ La Ĉasistino gajnas 0-2 kirason el ŝelhaŭto, kiu paliĝas ĉiujn _3 vicojn_ kiam la efiko de planto estas aktivigita en ŝia vizio.\n\n_+2:_ La Ĉasistino gajnas 0-2 kirason el ŝelhaŭto, kiu paliĝas ĉiujn _5 vicojn_ kiam la efiko de planto estas aktivigita en ŝia vizio.
actors.hero.talent.natures_aid.title=helpo de la naturo
actors.hero.talent.natures_bounty.desc=_+1:_ La Ĉasistino povas trovi _4 berojn_ kaŝitajn en alta herbo dum ŝi esploras la sekvajn kelkajn etaĝojn de la kelkarcero.\n\n_+2:_ La Ĉasistino povas trovi _6 berojn_ kaŝitajn en alta herbo dum ŝi esploras la sekvajn kelkajn etaĝojn de la kelkarcero.\n\nBeroj estas rapide manĝataj, redonas malgrandan kvanton da sateco, kaj eble enhavas uzeblan semon.
actors.hero.talent.natures_bounty.title=la abundo de la naturo
actors.hero.talent.natures_wrath.desc=_+1:_ Dum la povo de naturo estas aktiva, pafoj de la spirita arko havas _8% ŝancon_ ekigi hazardan damaĝan plantefikon.\n\n_+2:_ Dum la povo de naturo estas aktiva, pafoj de la spirita arko havas _17% ŝancon_ ekigi hazardan damaĝan plantefikon.\n\n_+3:_ Dum la povo de naturo estas aktiva, pafoj de la spirita arko havas _25% ŝancon_ ekigi hazardan damaĝan plantefikon.\n\n_+4:_ Dum la povo de naturo estas aktiva, pafoj de la spirita arko havas _33% ŝancon_ ekigi hazardan damaĝan plantefikon.\n\nLa plantoj, kiujn oni povas ekigi, estas: blindherbo, fajrofloro, landglaciego, malĝojmusko kaj ŝtormrebo.
actors.hero.talent.natures_wrath.title=la kolero de la naturo
actors.hero.talent.necromancers_minions.desc=_+1:_ Kiam animmarkita malamiko mortas, la Sorĉisto havas _13%-an ŝancon_ revivigi lin kiel koruptitan fantomon.\n\n_+2:_ Kiam animmarkita malamiko mortas, la Sorĉisto havas _27%-an ŝancon_ revivigi lin kiel koruptitan fantomon.\n\n_+3:_ Kiam animmarkita malamiko mortas, la Sorĉisto havas _40%-an ŝancon_ revivigi lin kiel koruptitan fantomon.
actors.hero.talent.necromancers_minions.title=helpantoj de nekromancisto
actors.hero.talent.patient_strike.desc=_+1:_ Se la Duelanto atendas antaŭ ol plenumi manbatalon, ŝi kaŭzos _1-2 kromdamaĝon_.\n\n_+2:_ Se la Duelanto atendas antaŭ ol plenumi manbatalon, ŝi kaŭzos _2 kromdamaĝon_.
actors.hero.talent.patient_strike.title=pacienca striko
actors.hero.talent.perfect_copy.desc=_+1:_ La ombra klono gajnas _10%_ de la maksimuma vivpoentoj de la heroo, kaj povas tuj interŝanĝi lokojn kun la heroo ĝis _1 kahelon_ for.\n\n_+2:_ La ombra klono gajnas _20%_ de la maksimuma vivpoentoj de la heroo, kaj povas tuj interŝanĝi lokojn kun la heroo ĝis _2 kahelojn_ for.\n\n_+3:_ La ombra klono gajnas _30%_ de la maksimuma vivpoentoj de la heroo, kaj povas tuj interŝanĝi lokojn kun la heroo ĝis _3 kahelojn_ for.\n\n_+4:_ La ombra klono gajnas _40%_ de la maksimuma vivpoentoj de la heroo, kaj povas tuj interŝanĝi lokojn kun la heroo ĝis _4 kahelojn_ for.
actors.hero.talent.perfect_copy.title=perfekta kopio
actors.hero.talent.point_blank.desc=_+1:_ Kiam la Ĉasistino uzas sian arkon aŭ ĵetarmilon je proksimbatala distanco, ĝi havas _-25% precizecon,_ anstataŭ -50%.\n\n_+2:_ Kiam la Ĉasistino uzas sian arkon aŭ ĵetarmilon je proksimbatala distanco, ĝi havas _normalan precizecon,_ anstataŭ -50%.\n\n_+3:_ Kiam la Ĉasistino uzas sian arkon aŭ ĵetarmilon je proksimbatala distanco, ĝi havas _+25% precizecon,_ anstataŭ -50%.\n\nNotu, ke ĵetarmiloj aŭ la spirita arko ĉiam havas +50% precizecon kiam uzataj je distanco.
actors.hero.talent.point_blank.title=rektaĵo
actors.hero.talent.precise_assault.desc=_+1:_ Kiam la Duelanto uzas armilkapablon, ŝi akiras _2-oblan precizecon_ ĉe sia sekva manbatalo ene de 5 vicoj.\n\n_+2:_ Kiam la Duelanto uzas armilkapablon, ŝi akiras _5-oblan precizecon_ ĉe sia sekva manbatalo ene de 5 vicoj.\n\n_+3:_ Kiam la Duelanto uzas armilkapablon, ŝi akiras _senfinan precizecon_ ĉe sia sekva manbatalo ene de 5 vicoj.
actors.hero.talent.precise_assault.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe pliigos la precizecon de proksimbatalo je 10% je +1, 20% je +2, aŭ 30% je +3.
actors.hero.talent.precise_assault.title=preciza atako
actors.hero.talent.projectile_momentum.desc=_+1:_ Dum liberkurado, la Liberkuristo gajnas _+50% precizecon kaj +15% damaĝon_ per ĵetarmiloj.\n\n_+2:_ Dum liberkurado, la Liberkuristo gajnas _+100% precizecon kaj +30% damaĝon_ per ĵetarmiloj.\n\n_+3:_ Dum liberkurado, la Liberkuristo gajnas _+150% precizecon kaj +45% damaĝon_ per ĵetarmiloj.
actors.hero.talent.projectile_momentum.title=kugla impeto
actors.hero.talent.projecting_blades.desc=_+1:_ Spektraj klingoj havas _+25% precizecon_, kaj povas penetri ĝis _2 solidajn kahelojn_.\n\n_+2:_ Spektraj klingoj havas _+50% precizecon_, kaj povas penetri ĝis _4 solidajn kahelojn_.\n\n_+3:_ Spektraj klingoj havas _+75% precizecon_, kaj povas penetri ĝis _6 solidajn kahelojn_.\n\n_+4:_ Spektraj klingoj havas _+100% precizecon_, kaj povas penetri ĝis _8 solidajn kahelojn_.
actors.hero.talent.projecting_blades.title=elstarantaj klingoj
actors.hero.talent.protective_shadows.desc=_+1:_ La Fripono gajnas unu ŝirmadon _ĉiun duan vicon_ kiam li estas nevidebla, _ĝis maksimumo de 3_.\n\n_+2:_ La Fripono gajnas unu ŝirmadon _ĉiun vicon_ kiam li estas nevidebla, _ĝis maksimumo de 5_.
actors.hero.talent.protective_shadows.title=protektaj ombroj
actors.hero.talent.provoked_anger.desc=_+1:_ Kiam iu ajn ŝirma plifortigo aplikita al la Militisto estas rompita de damaĝo, lia sekva fizika atako kaŭzos _3 kroman damaĝon_.\n\n_+2:_ Kiam iu ajn ŝirma plifortigo aplikita al la Militisto estas rompita de damaĝo, lia sekva fizika atako kaŭzos _5 kroman damaĝon_.
actors.hero.talent.provoked_anger.title=provokita kolero
actors.hero.talent.ratforcements.desc=_+1:_ Uzante ratmogrify sur vi mem _naskigas 1_ aliancan marsupian raton apud vi.\n\n_+2:_ Uzante ratmogrify sur vi mem _naskigas 2_ aliancan marsupiajn ratojn apud vi.\n\n_+3:_ Uzante ratmogrify sur vi mem _naskigas 3_ aliancan marsupiajn ratojn apud vi.\n\n_+4:_ Uzante ratmogrify sur vi mem _naskigas 4_ aliancan marsupiajn ratojn apud vi.
actors.hero.talent.ratforcements.title=ratdevigoj
actors.hero.talent.ratlomacy.desc=_+1:_ Uzi ratmogrifon sur ratmogrigita malamiko igas ilin amikaj kaj igas la transformon permanenta.\n\n_+2:_ Uzi ratmogrifon sur ratmogrigita malamiko igas ilin amikaj, igas la transformon permanenta, kaj donas al ili _2 vicojn_ da adrenalino.\n\n_+3:_ Uzi ratmogrifon sur ratmogrigita malamiko igas ilin amikaj, igas la transformon permanenta, kaj donas al ili _4 vicojn_ da adrenalino.\n\n_+4:_ Uzi ratmogrifon sur ratmogrigita malamiko igas ilin amikaj, igas la transformon permanenta, kaj donas al ili _6 vicojn_ da adrenalino.
actors.hero.talent.ratlomacy.title=ratlomacio
actors.hero.talent.ratsistance.desc=_+1:_ Malamikaj ratmogrigitaj malamikoj kaŭzas _-10% damaĝon_.\n\n_+2:_ Malamikaj ratmogrigitaj malamikoj kaŭzas _-19% damaĝon_.\n\n_+3:_ Malamikaj ratmogrigitaj malamikoj kaŭzas _-27% damaĝon_.\n\n_+4:_ Malamikaj ratmogrigitaj malamikoj kaŭzas _-35% damaĝon_.
actors.hero.talent.ratsistance.title=ratrezisto
actors.hero.talent.reactive_barrier.desc=_+1:_ La Magiisto gajnas _2.5 ŝirmadon_ por ĉiu rolulo trafita de elementa eksplodo, ĝis maksimume 5 roluloj.\n\n_+2:_ La Magiisto gajnas _5 ŝirmadon_ por ĉiu rolulo trafita de elementa eksplodo, ĝis maksimume 6 roluloj.\n\n_+3:_ La Magiisto gajnas _7.5 ŝirmadon_ por ĉiu rolulo trafita de elementa eksplodo, ĝis maksimume 7 roluloj.\n\n_+4:_ La Magiisto gajnas _10 ŝirmadon_ por ĉiu rolulo trafita de elementa eksplodo, ĝis maksimume 8 roluloj.
actors.hero.talent.reactive_barrier.title=reaktiva bariero
actors.hero.talent.recall_inscription.desc=_+1:_ La Kleriko povas ĵeti _Revokon per Surskribo,_ sorĉon kiu permesas al ili ripeti la efikon de la lasta runŝtono aŭ volvlibro uzita ene de _10 vicoj._\n\n_+2:_ La Kleriko povas ĵeti _Revokon per Surskribo,_ sorĉon kiu permesas al ili ripeti la efikon de la lasta runŝtono aŭ volvlibro uzita ene de _300 vicoj._\n\nRevoko per Surskribo ne povas esti uzata kun volvlibroj de plibonigo. La ŝarga kosto de ĉi tiu sorĉo varias laŭ kiu objekto estis uzita lastatempe: 2 por runŝtono, 3 por volvlibro, 4 por ekzotika volvlibro. Ĉi tiu ŝarga kosto ankaŭ duobliĝas kiam uzata kun volvlibro de transmutacio, aŭ alĥemiaj objektoj kiuj devas esti kreitaj per transmutacio aŭ plibonigo.
actors.hero.talent.recall_inscription.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe repagos ajnan volvlibron aŭ runŝtonon 10% de la tempo je +1 aŭ 15% de la tempo je +2. Volvlibroj de Plibonigo estas esceptitaj de ĉi tiu efiko.
actors.hero.talent.recall_inscription.refunded=Via aĵo estis repagita!
actors.hero.talent.recall_inscription.title=revoksurskribo
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Kiam la Ĉasistino paŝas sur mallongan herbon aŭ ardaĵojn, ili saltas en altan herbon, kiun la Ĉasistino tuj sulkigas. Ĉi tio havas _10-vican malvarmiĝtempon_.\n\n_+2:_ Kiam la Ĉasistino paŝas sur mallongan herbon aŭ ardaĵojn, ili saltas en altan herbon, kiun la Ĉasistino tuj sulkigas. Ĉi tio havas _5-vican malvarmiĝtempon_.\n\nĈi tiu talento produktos sulkigitan herbon se pasivaj regeneradaj efikoj estas malŝaltitaj aŭ la heroo ne gajnis sperton dum longa tempo.
actors.hero.talent.rejuvenating_steps.title=rejunigaj paŝoj
actors.hero.talent.remote_beacon.desc=_+1:_ La Magiisto povas meti signostangon ie ajn ene de _4 kaheloj_.\n\n_+2:_ La Magiisto povas meti signostangon ie ajn ene de _8 kaheloj_.\n\n_+3:_ La Magiisto povas meti signostangon ie ajn ene de _12 kaheloj_.\n\n_+4:_ La Magiisto povas meti signostangon ie ajn ene de _16 kaheloj_.\n\nLa Magiisto ne povas meti signostangojn en lokojn, kiuj estas neatingeblaj.
actors.hero.talent.remote_beacon.title=Malproksima Signostango
actors.hero.talent.rogues_foresight.desc=_+1:_ Kiam la Fripono estas sur nivelo kun sekreta ĉambro, li havas _75%-an ŝancon rimarki_, ke la nivelo enhavas sekreton.\n\n_+2:_ Kiam la Fripono estas sur nivelo kun sekreta ĉambro, li havas _100%-an ŝancon rimarki_, ke la nivelo enhavas sekreton.
actors.hero.talent.rogues_foresight.title=antaŭscio de fiulo
actors.hero.talent.runic_transference.desc=_+1:_ La rompita sigelo de la Militisto povas transdoni _regulajn ideogramojn_ same kiel ĝi transdonas plibonigon.\n\n_+2:_ La rompita sigelo de la Militisto povas transdoni _regulajn, potencajn kaj malbenajn ideogramojn_ same kiel ĝi transdonas plibonigon.\n\nLa sigelo povas transdoni ideogramojn nur se ili estis aplikitaj al la kiraso kiam la sigelo estis alkroĉita.
actors.hero.talent.runic_transference.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe helpos glifojn sur via kiraso rezisti forigon per volvlibroj de plibonigo. Glifoj komencos perdiĝi kiam oni plibonigas de nivelo 6 (supren de 4) je +1, aŭ nivelo 7 (supren de 4) je +2. La nivelo kie glifoj certe perdiĝos restas senŝanĝa je +8.
actors.hero.talent.runic_transference.title=runa translokigo
actors.hero.talent.satiated_spells.desc=_+1:_ Manĝado de manĝaĵo igas la Klerikon gajni _3 ŝirmadon_ la sekvan fojon kiam ili ĵetas sorĉon.\n\n_+2:_ Manĝado de manĝaĵo igas la Klerikon gajni _5 ŝirmadon_ la sekvan fojon kiam ili ĵetas sorĉon.
actors.hero.talent.satiated_spells.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe tuj donos ŝirmadon, kiu normale komencos kadukiĝi post 10 vicoj.
actors.hero.talent.satiated_spells.title=Satigitaj Sorĉoj
actors.hero.talent.scholars_intuition.desc=_+1:_ La Magiisto identigas sorĉbastonojn _3-oble pli rapide_.\n\n_+2:_ La Magiisto identigas sorĉbastonojn _kiam li uzas ilin_.
actors.hero.talent.scholars_intuition.title=intuicio de akademiulo
actors.hero.talent.searing_light.desc=_+1:_ La fizikaj atakoj de la Kleriko kontraŭ malamikoj lumigitaj de _Gvida Lumo_ kaŭzas _+3 damaĝon._\n\n_+2:_ La fizikaj atakoj de la Kleriko kontraŭ malamikoj lumigitaj de _Gvida Lumo_ kaŭzas _+5 damaĝon._
actors.hero.talent.searing_light.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe donos sian kromdamaĝon post kiam sorĉbastono aŭ artefakto estas uzata kontraŭ malamiko, kun malvarmigtempo de 20-vicoj.
actors.hero.talent.searing_light.title=Bruliga Lumo
actors.hero.talent.seer_shot.desc=_+1:_ Kiam la Ĉasistino pafas sagon al la tero, ĝi donas vidon en 3x3 areo ĉirkaŭ ĝi dum _5 turnoj_. Ĉi tio havas 20-turnan malvarmiĝtempon.\n\n_+2:_ Kiam la Ĉasistino pafas sagon al la tero, ĝi donas vidon en 3x3 areo ĉirkaŭ ĝi dum _10 turnoj_. Ĉi tio havas 20-turnan malvarmiĝtempon.\n\n_+3:_ Kiam la Ĉasistino pafas sagon al la tero, ĝi donas vidon en 3x3 areo ĉirkaŭ ĝi dum _15 turnoj_. Ĉi tio havas 20-turnan malvarmiĝtempon.
actors.hero.talent.seer_shot.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi aktiviĝos per iu ajn ĵetita armilo.
actors.hero.talent.seer_shot.title=viziulo pafis
actors.hero.talent.shadow_blade.desc=_+1:_ La ombra klono gajnas _8%_ de la damaĝo de la heroo po turno, kaj havas _25% ŝancon_ uzi la sorĉon sur la armilo de la heroo.\n\n_+2:_ La ombra klono gajnas _16%_ de la damaĝo de la heroo po turno, kaj havas _50% ŝancon_ uzi la sorĉon sur la armilo de la heroo.\n\n_+3:_ La ombra klono gajnas _24%_ de la damaĝo de la heroo po turno, kaj havas _75% ŝancon_ uzi la sorĉon sur la armilo de la heroo.\n\n_+4:_ La ombra klono gajnas _32%_ de la damaĝo de la heroo po turno, kaj havas _100% ŝancon_ uzi la sorĉon sur la armilo de la heroo.
actors.hero.talent.shadow_blade.title=ombroklingo
actors.hero.talent.shadow_step.desc=_+1:_ Se la fripono uzas fumobombon dum nevidebla, ĝi okazas tuj kaj havas _16% reduktitan_ ŝargkoston, sed ĝi ankaŭ ne blindigas malamikojn aŭ ekigas aliajn talentojn.\n\n_+2:_ Se la fripono uzas fumobombon dum nevidebla, ĝi okazas tuj kaj havas _30% reduktitan_ ŝargkoston, sed ĝi ankaŭ ne blindigas malamikojn aŭ ekigas aliajn talentojn.\n\n_+3:_ Se la fripono uzas fumobombon dum nevidebla, ĝi okazas tuj kaj havas _41% reduktitan_ ŝargkoston, sed ĝi ankaŭ ne blindigas malamikojn aŭ ekigas aliajn talentojn.\n\n_+4:_ Se la fripono uzas fumobombon dum nevidebla, ĝi okazas tuj kaj havas _50% reduktitan_ ŝargkoston, sed ĝi ankaŭ ne blindigas malamikojn aŭ ekigas aliajn talentojn.
actors.hero.talent.shadow_step.title=ombropaŝo
actors.hero.talent.shared_enchantment.desc=_+1:_ Ĵetitaj armiloj havas _33% ŝancon_ uzi la sorĉon sur la arko de la kaŝpafisto.\n\n_+2:_ Ĵetitaj armiloj havas _67% ŝancon_ uzi la sorĉon sur la arko de la kaŝpafisto.\n\n_+3:_ Ĵetitaj armiloj havas _100% ŝancon_ uzi la sorĉon sur la arko de la kaŝpafisto.\n\nLa sorĉo de la arko povas ekfunkcii aldone al kia ajn sorĉo, kiun la ĵetita armilo jam havas.
actors.hero.talent.shared_enchantment.title=komuna ĉarmo
actors.hero.talent.shared_upgrades.desc=_+1:_ Kiam la Kaŝpafisto atakas per plibonigita ĵetarmilo, ĉiu nivelo pliigas la daŭron de la kaŝpafista marko je 1 vico kaj la damaĝon de ŝia speciala atako je 16%, ĝis maksimumo de _2 vicoj kaj +33% damaĝo je +2_.\n\n_+2:_ Kiam la Kaŝpafisto atakas per plibonigita ĵetarmilo, ĉiu nivelo pliigas la daŭron de la kaŝpafista marko je 1 vico kaj la damaĝon de ŝia speciala atako je 16%, ĝis maksimumo de _4 vicoj kaj +67% damaĝo je +4_.\n\n_+3:_ Kiam la Kaŝpafisto atakas per plibonigita ĵetarmilo, ĉiu nivelo pliigas la daŭron de la kaŝpafista marko je 1 vico kaj la damaĝon de ŝia speciala atako je 16%, ĝis maksimumo de _6 vicoj kaj +100% damaĝo je +6_.
actors.hero.talent.shared_upgrades.title=komunaj ĝisdatigoj
actors.hero.talent.shield_battery.desc=_+1:_ La Magiisto povas memceli per sorĉbastono por konverti ĉiujn siajn ŝargojn en ŝirmadon je rapideco de _4% maksimuma vivpoentoj po ŝargo_.\n\n_+2:_ La Magiisto povas memceli per sorĉbastono por konverti ĉiujn siajn ŝargojn en ŝirmadon je rapideco de _6% maksimuma vivpoentoj po ŝargo_.
actors.hero.talent.shield_battery.title=ŝilda baterio
actors.hero.talent.shield_of_light.desc=_+1:_ La Kleriko povas ĵeti _Ŝildon de Lumo,_ sorĉon kiu estas ĵetata tuj kaj donas al ili _2-4 kirason_ kontraŭ celo dum 5 vicoj je la kosto de 1 ŝargo.\n\n_+2:_ La Kleriko povas ĵeti _Ŝildon de Lumo,_ sorĉon kiu estas ĵetata tuj kaj donas al ili _3-6 kirason_ kontraŭ celo dum 5 vicoj je la kosto de 1 ŝargo.
actors.hero.talent.shield_of_light.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe reduktos fizikan damaĝon ricevitan de via celita malamiko je 1, 33% de la tempo je +1 aŭ 50% de la tempo je +2.
actors.hero.talent.shield_of_light.title=ŝildo de lumo
actors.hero.talent.shielding_dew.desc=_+1:_ Rosgutoj povas ŝirmi la Gardanton kiam ŝia sano estas plena, ĝis _20% de ŝia maksimuma vivpoentoj_.\n\n_+2:_ Rosgutoj povas ŝirmi la Gardanton kiam ŝia sano estas plena, ĝis _40% de ŝia maksimuma vivpoentoj_.\n\n_+3:_ Rosgutoj povas ŝirmi la Gardanton kiam ŝia sano estas plena, ĝis _60% de ŝia maksimuma vivpoentoj_.
actors.hero.talent.shielding_dew.title=ŝirmante roson
actors.hero.talent.shock_force.desc=_+1:_ Premondo kaŭzas _20% pli da damaĝo_ kaj havas _25% ŝancon_ miregigi anstataŭ kripligi.\n\n_+2:_ Premondo kaŭzas _40% pli da damaĝo_ kaj havas _50% ŝancon_ miregigi anstataŭ kripligi.\n\n_+3:_ Premondo kaŭzas _60% pli da damaĝo_ kaj havas _75% ŝancon_ miregigi anstataŭ kripligi.\n\n_+4:_ Premondo kaŭzas _80% pli da damaĝo_ kaj havas _100% ŝancon_ miregigi anstataŭ kripligi.
actors.hero.talent.shock_force.title=ŝoka forto
actors.hero.talent.shrug_it_off.desc=_+1:_ La damaĝredukto de la militisto dum eltenado _pliiĝas al 60%_, de 50%.\n\n_+2:_ La damaĝredukto de la militisto dum eltenado _pliiĝas al 68%_, de 50%.\n\n_+3:_ La damaĝredukto de la militisto dum eltenado _pliiĝas al 74%_, de 50%.\n\n_+4:_ La damaĝredukto de la militisto dum eltenado _pliiĝas al 80%_, de 50%.
actors.hero.talent.shrug_it_off.title=forĵetu ĝin
actors.hero.talent.silent_steps.desc=_+1:_ La Fripono ne vekos dormantajn malamikojn dum li estas _3 aŭ pli da kaheloj for de ili_.\n\n_+2:_ La Fripono ne vekos dormantajn malamikojn dum li _ne estas apud ili_.
actors.hero.talent.silent_steps.title=silentaj paŝoj
actors.hero.talent.soul_eater.desc=_+1:_ Animmarko donas _0.33 vicojn_ da sateco por ĉiu kaŭzita fizika damaĝo. Animmarkitaj malamikoj havas _10% ŝancon_ ekigi manĝefektojn kiam ili mortas.\n\n_+2:_ Animmarko donas _0.67 vicojn_ da sateco por ĉiu kaŭzita fizika damaĝo. Animmarkitaj malamikoj havas _20% ŝancon_ ekigi manĝefektojn kiam ili mortas.\n\n_+3:_ Animmarko donas _1 vicon_ da sateco por ĉiu kaŭzita fizika damaĝo. Animmarkitaj malamikoj havas _30% ŝancon_ ekigi manĝefektojn kiam ili mortas.
actors.hero.talent.soul_eater.title=animmanĝanto
actors.hero.talent.soul_siphon.desc=_+1:_ Fizika damaĝo kaŭzita de aliaj roluloj ekigas la animsignon de la sorĉisto je _13% efikeco_.\n\n_+2:_ Fizika damaĝo kaŭzita de aliaj roluloj ekigas la animsignon de la sorĉisto je _27% efikeco_.\n\n_+3:_ Fizika damaĝo kaŭzita de aliaj roluloj ekigas la animsignon de la sorĉisto je _40% efikeco_.
actors.hero.talent.soul_siphon.title=animsifono
actors.hero.talent.speedy_stealth.desc=_+1:_ La Liberkuranto gajnas 2 stakojn da impeto po turno dum li estas nevidebla.\n\n_+2:_ Aldone al la avantaĝoj de +1, liberkurado jam ne nombras malantaŭen dum la Liberkuranto estas nevidebla.\n\n_+3:_ Aldone al la avantaĝoj de +1 kaj +2, la Liberkuranto moviĝas je 2x rapideco dum nevidebla, sendepende de ĉu li liberkuras aŭ ne.
actors.hero.talent.speedy_stealth.title=rapida sekreto
actors.hero.talent.spirit_blades.desc=_+1:_ Spektraj klingoj havas _30% ŝancon_ ankaŭ uzi la sorĉon sur la spirita arko.\n\n_+2:_ Spektraj klingoj havas _60% ŝancon_ ankaŭ uzi la sorĉon sur la spirita arko.\n\n_+3:_ Spektraj klingoj havas _90% ŝancon_ ankaŭ uzi la sorĉon sur la spirita arko.\n\n_+4:_ Spektraj klingoj havas _100% ŝancon_ ankaŭ uzi la sorĉon sur la spirita arko, kaj ĝi donas al ĉiu sorĉo _+10% potencon_.
actors.hero.talent.spirit_blades.title=spiritklingoj
actors.hero.talent.spirit_form.desc=La Kleriko povas uzi _Spiritformon_, kiu plenigas Triunuon per la povo de ringo aŭ artefakto, kiun la Kleriko identigis ĉi-foje (krom la sankta volumo), je la kosto de 4 ŝargoj.\n\n_+1:_ Kiam Triunuo estas uzata, la Kleriko gajnos ringan efikon je _+1_ dum 20 turnoj, aŭ aktivigos artefaktan efikon je _+4._\n\n_+2:_ Kiam Triunuo estas uzata, la Kleriko gajnos ringan efikon je _+2_ dum 20 turnoj, aŭ aktivigos artefaktan efikon je _+6._\n\n_+3:_ Kiam Triunuo estas uzata, la Kleriko gajnos ringan efikon je _+3_ dum 20 turnoj, aŭ aktivigos artefaktan efikon je _+8._\n\n_+4:_ Kiam Triunuo estas uzata, la Kleriko akiros ringan efikon je _+4_ dum 20 vicoj, aŭ aktivigos artefaktan efikon je _+10._\n\nTriunuo povas esti trapenetrita nur per unu spirita efiko samtempe. Artefaktoj havas diversajn efikojn kaj kirasŝargajn kostojn kiam aktivigitaj de Triunuo.
actors.hero.talent.spirit_form.title=spirita formo
actors.hero.talent.stasis.desc=La Kleriko povas uzi _Stazon_ sur povigitan aliancanon je la kosto de 2 ŝargoj. Stazo provizore forigas la aliancanon el la kelkarcero kaj konservas la restantan tempon por ĉiuj plifortigoj, inkluzive de Potenco de Multaj. La aliancano reaperos apud vi kiam la efiko finiĝos. Stazo povas esti reuzita tuj kaj senkoste por fini la efikon frue. Stazo funkcias kontraŭ nemoveblaj aliancanoj, sed ne povas movi ilin inter kelkarceraj etaĝoj.\n\n_+1:_ Stazo daŭras maksimume _60 turnojn._\n\n_+2:_ Stazo daŭras maksimume _90 turnojn._\n\n_+3:_ Stazo daŭras maksimume _120 turnojn._\n\n_+4:_ Stazo daŭras maksimume _150 turnojn._\n\nLa Kleriko ankaŭ povas ĵeti Radiantan Radion kiam aliancano estas en stazo por revivigi lin/ŝin, aŭ ĵeti Vivligon por antaŭprene apliki ĝian efikon. Aliancanoj tamen ne profitas de Vivligo dum en stazo.
actors.hero.talent.stasis.title=stazo
actors.hero.talent.strengthening_meal.desc=_+1:_ Manĝi manĝaĵon donas al la Duelanto 3 kromdamaĝon la sekvajn _2 fojojn_ kiam ŝi trafas malamikon per fizika atako.\n\n_+2:_ Manĝi manĝaĵon donas al la Duelanto 3 kromdamaĝon la sekvajn _3 fojojn_ kiam ŝi trafas malamikon per fizika atako.
actors.hero.talent.strengthening_meal.title=fortiga manĝo
actors.hero.talent.striking_force.desc=_+1:_ La povo de la efiko de elementa bato pliiĝas je _30%_.\n\n_+2:_ La povo de la efiko de elementa bato pliiĝas je _60%_.\n\n_+3:_ La povo de la efiko de elementa bato pliiĝas je _90%_.\n\n_+4:_ La povo de la efiko de elementa bato pliiĝas je _120%_.
actors.hero.talent.striking_force.title=frapforto
actors.hero.talent.striking_wave.desc=_+1:_ Ŝokondo havas _30% ŝancon_ ankaŭ uzi surtrafajn efikojn kiel sorĉojn kaj kombojn.\n\n_+2:_ Ŝokondo havas _60% ŝancon_ ankaŭ uzi surtrafajn efikojn kiel sorĉojn kaj kombojn.\n\n_+3:_ Ŝokondo havas _90% ŝancon_ ankaŭ uzi surtrafajn efikojn kiel sorĉojn kaj kombojn.\n\n_+4:_ Ŝokondo havas _100% ŝancon_ ankaŭ uzi surtrafajn efikojn kiel sorĉojn kaj kombojn, kaj ĝi donas al sorĉoj _+20% potencon_.
actors.hero.talent.striking_wave.title=frapanta ondo
actors.hero.talent.strongman.desc=_+1:_ La forto de la militisto estas _pliigita je 8%_, rondigita malsupren.\n\n_+2:_ La forto de la militisto estas _pliigita je 13%_, rondigita malsupren.\n\n_+3:_ La forto de la militisto estas _pliigita je 18%_, rondigita malsupren.
actors.hero.talent.strongman.title=fortulo
actors.hero.talent.sucker_punch.desc=_+1:_ La Fripono kaŭzas _1-2 kroman damaĝon_ la unuan fojon kiam li surprizatakas malamikon.\n\n_+2:_ La Fripono kaŭzas _2 kroman damaĝon_ la unuan fojon kiam li surprizatakas malamikon.
actors.hero.talent.sucker_punch.title=suĉpugno
actors.hero.talent.sunray.desc=_+1:_ La Kleriko povas ĵeti _Sunradion,_ sorĉon kiu kaŭzas _4-8 damaĝon_ kaj blindigas la celon dum _4 vicoj,_ je la kosto de 1 ŝargo.\n\n_+2:_ La Kleriko povas ĵeti _Sunradion,_ sorĉon kiu kaŭzas _6-12 damaĝon_ kaj blindigas la celon dum _6 vicoj,_ je la kosto de 1 ŝargo.\n\nSunradio povas blindigi ĉiun celon nur unufoje, sed se la celo jam estas blindigita de Sunradio, tiam ĝi anstataŭe paralizas. Sunradio ĉiam kaŭzas maksimuman damaĝon al demonaj kaj malmortaj malamikoj.
actors.hero.talent.sunray.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe kaŭzos, ke sorĉbastonoj kaj artefaktoj blindigos malamikojn dum 4 vicoj, 15% de la tempo je +1 aŭ 25% de la tempo je +2.
actors.hero.talent.sunray.title=sunradio
actors.hero.talent.survivalists_intuition.desc=_+1:_ La Ĉasistino identigas ĵetarmilojn _3-oble pli rapide_.\n\n_+2:_ La Ĉasistino identigas ĵetarmilojn _kiam ŝi trafas per ili_.
actors.hero.talent.survivalists_intuition.title=intuicio de supervivanto
actors.hero.talent.sustained_retribution.desc=_+1:_ La Militisto kaŭzas _115% kroman damaĝon_ disvastigitan tra _2 trafoj_, anstataŭ 100% kroma damaĝo en 1 trafo.\n\n_+2:_ La Militisto kaŭzas _130% kroman damaĝon_ disvastigitan tra _3 trafoj_, anstataŭ 100% kroma damaĝo en 1 trafo.\n\n_+3:_ La Militisto kaŭzas _145% kroman damaĝon_ disvastigitan tra _4 trafoj_, anstataŭ 100% kroma damaĝo en 1 trafo.\n\n_+4:_ La Militisto kaŭzas _160% kroman damaĝon_ disvastigitan tra _5 trafoj_, anstataŭ 100% kroma damaĝo en 1 trafo.
actors.hero.talent.sustained_retribution.title=daŭra venĝo
actors.hero.talent.swift_equip.desc=_+1:_ La Duelanto povas tuj ŝanĝi sian ekipitan armilon _unu fojon_ ĉiujn 20 turnojn.\n\n_+2:_ La Duelanto povas tuj ŝanĝi sian ekipitan armilon _du fojojn_ ĉiujn 20 turnojn.\n\nSe la Duelanto havas ĉi tiun talenton kaj ĝi ne estas en malvarmiĝa tempo, rapida uzado de neekipita armilo ekipos ĝin.
actors.hero.talent.swift_equip.title=rapida ekipaĵo
actors.hero.talent.swift_spirit.desc=_+1:_ La moviĝrapido de la spirita akcipitro pliiĝas al _2.5 kaheloj_ de 2, kaj estas garantiite, ke ĝi evitos la unuajn _2 atakojn_ kontraŭ ĝi.\n\n_+2:_ La moviĝrapido de la spirita akcipitro pliiĝas al _3 kaheloj_ de 2, kaj estas garantiite, ke ĝi evitos la unuajn _4 atakojn_ kontraŭ ĝi.\n\n_+3:_ La moviĝrapido de la spirita akcipitro pliiĝas al _3.5 kaheloj_ de 2, kaj estas garantiite, ke ĝi evitos la unuajn _6 atakojn_ kontraŭ ĝi.\n\n_+4:_La moviĝrapido de la spirita akcipitro pliiĝas al _4 kaheloj_ de 2, kaj estas garantiite, ke ĝi evitos la unuajn _8 atakojn_ kontraŭ ĝi.
actors.hero.talent.swift_spirit.title=rapida spirito
actors.hero.talent.telefrag.desc=_+1:_ Se la Magiisto misformas en alian rolulon, li kaŭzas _10-15 damaĝon_ al ĝi, sed ankaŭ ricevas _5 damaĝon_.\n\n_+2:_ Se la Magiisto misformas en alian rolulon, li kaŭzas _20-30 damaĝon_ al ĝi, sed ankaŭ ricevas _10 damaĝon_.\n\n_+3:_ Se la Magiisto misformas en alian rolulon, li kaŭzas _30-45 damaĝon_ al ĝi, sed ankaŭ ricevas _15 damaĝon_.\n\n_+4:_ Se la Magiisto misformas en alian rolulon, li kaŭzas _40-60 damaĝon_ al ĝi, sed ankaŭ ricevas _20 damaĝon_.\n\nLa heroo ne povas esti mortigita per ĉi tiu talento, la memdamaĝo povas esti reduktita per magiaj rezistaj efikoj.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ La Fripono identigas ringojn _duoble pli rapide_, kaj identigas la tipon de ringo _kiam li ekipas ĝin_.\n\n_+2:_ La Fripono identigas ringojn _kiam li ekipas ilin_, kaj identigas la tipon de ringo _kiam li prenas ĝin_.
actors.hero.talent.thiefs_intuition.title=intuicio de ŝtelisto
actors.hero.talent.twin_upgrades.desc=_+1:_ Se unu el la du ekipitaj armiloj de la Ĉampiono havas pli malaltan nivelon kaj estas _2 aŭ pli da niveloj pli malalta_ ol la alia armilo, ĝi estos plifortigita al la nivelo de la alia armilo.\n\n_+2:_ Se unu el la du ekipitaj armiloj de la Ĉampiono havas pli malaltan nivelon kaj estas _1 aŭ pli da niveloj pli malalta_ ol la alia armilo, ĝi estos plifortigita al la nivelo de la alia armilo.\n\n_+3:_ Se unu el la du ekipitaj armiloj de la Ĉampiono havas pli malaltan nivelon kaj estas _la sama nivelo aŭ pli malalta_ ol la alia armilo, ĝi estos plifortigita al la nivelo de la alia armilo.
actors.hero.talent.twin_upgrades.title=ĝemelaj ĝisdatigoj
actors.hero.talent.unencumbered_spirit.desc=_+1:_ La Monaĥo gajnas _50% pli da energio_ por ĉiu peco de ekipaĵo de _nivelo 3 aŭ malpli alta_, kiun ŝi uzas.\n\n_+2:_ La Monaĥo gajnas _75% pli da energio_ por ĉiu peco de ekipaĵo de _nivelo 2 aŭ malpli alta_, kiun ŝi uzas. La avantaĝo de nivelo 3 restas senŝanĝa.\n\n_+3:_ La Monaĥo gajnas _100% pli da energio_ por ĉiu peco de ekipaĵo de _nivelo 1 aŭ malpli alta_, kiun ŝi uzas. La avantaĝoj de nivelo 2 kaj 3 restas senŝanĝaj. Ŝi ankaŭ gajnas senpagan ŝtofan kirason kaj ŝtofitajn gantojn.\n\nNotu, ke ĉi tiu talento ne donas avantaĝon pro esti senarma aŭ ataki per Ringo de Forto.
actors.hero.talent.unencumbered_spirit.title=senĝena spirito
actors.hero.talent.varied_charge.desc=_+1:_ La Ĉampiono tuj reakiras _0.17 armilŝargojn_ kiam ŝi uzas du malsamajn armilkapablojn, sen tempolimo.\n\n_+2:_ La Ĉampiono tuj reakiras _0.33 armilŝargojn_ kiam ŝi uzas du malsamajn armilkapablojn, sen tempolimo.\n\n_+3:_ La Ĉampiono tuj reakiras _0.5 armilŝargojn_ kiam ŝi uzas du malsamajn armilkapablojn, sen tempolimo.
actors.hero.talent.varied_charge.title=varia ŝargo
actors.hero.talent.veterans_intuition.desc=_+1:_ La Militisto identigas armilojn _1,75-oble pli rapide_ kaj kirason _2,5-oble pli rapide_.\n\n_+2:_ La Militisto identigas armilojn _2,5-oble pli rapide_ kaj kirason _kiam li ekipas ĝin_.
actors.hero.talent.veterans_intuition.title=la intuicio de veterano
actors.hero.talent.wall_of_light.desc=_+1:_ La Paladino povas ĵeti _Muron de Lumo,_ sorĉon kiu kreas _3 kahelojn larĝan_ solidan muron antaŭ la Paladino, kiu forpuŝas malamikojn kaj daŭras 20 turnojn, je la kosto de 3 ŝargoj.\n\n_+2:_ La Paladino povas ĵeti _Muron de Lumo,_ sorĉon kiu kreas _5 kahelojn larĝan_ solidan muron antaŭ la Paladino, kiu forpuŝas malamikojn kaj daŭras 20 turnojn, je la kosto de 3 ŝargoj.\n\n_+3:_ La Paladino povas ĵeti _Muron de Lumo,_ sorĉon kiu kreas _7 kahelojn larĝan_ solidan muron antaŭ la Paladino, kiu forpuŝas malamikojn kaj daŭras 20 turnojn, je la kosto de 3 ŝargoj.\n\nLa muro povas esti metita kardinale aŭ diagonale, nur unu muro povas ekzisti samtempe.
actors.hero.talent.wall_of_light.title=muro de lumo
actors.hero.talent.wand_preservation.desc=_+1:_ Kiam la Magiisto enmetas novan sorĉbastonon en sian bastonon, la malnova sorĉbastono estas redonita je +0, _sed tio povas esti farita nur unufoje._\n\n_+2:_ Kiam la Magiisto enmetas novan sorĉbastonon en sian bastonon, la malnova sorĉbastono estas redonita je +0, _tio povas esti ripetata kun malvarmigtempo de unu heroo-nivelo._
actors.hero.talent.wand_preservation.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe pliigos la kvanton da arkana rezino akirata metante sorĉbastonon en alĥemian poton je 1 je +1, aŭ je 2 je +2.
actors.hero.talent.wand_preservation.title=sorĉbastonkonservado
actors.hero.talent.weapon_recharging.desc=_+1:_ La Duelanto gajnas unu armilŝargon ĉiujn _15 vicojn_ kiam estas sub la efiko de reŝargaj plifortigoj de sorĉbastono aŭ artefakto.\n\n_+2:_ La Duelanto gajnas unu armilŝargon ĉiujn _10 vicojn_ kiam estas sub la efiko de reŝargaj plifortigoj de sorĉbastono aŭ artefakto.
actors.hero.talent.weapon_recharging.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe kaŭzos al ili +5% da proksimbatala damaĝo dum reŝargado je +1, aŭ +7,5% da proksimbatala damaĝo dum reŝargado je +2.
actors.hero.talent.weapon_recharging.title=armilreŝargado
actors.hero.talent.wide_search.desc=_+1:_ La serĉradiuso de la Fripono pligrandiĝas de 5x5 kvadrato al _7x7 cirklo_.\n\n_+2:_ La serĉradiuso de la Fripono pligrandiĝas de 5x5 kvadrato al _7x7 kvadrato_.
actors.hero.talent.wide_search.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe pliigos ties serĉradiuson de 3x3 kvadrato al 5x5 cirklo je +1, aŭ 5x5 kvadrato je +2.
actors.hero.talent.wide_search.title=larĝa serĉo
actors.hero.talent.wild_momentum.desc=_+1:_ Mortigi malamikon per la spirita arko plilongigas la daŭron de la natura povo je _1 vicoj_. La daŭro povas esti plilongigita je maksimume _2 vicoj_.\n\n_+2:_ Mortigi malamikon per la spirita arko plilongigas la daŭron de la natura povo je _2 vicoj_. La daŭro povas esti plilongigita je maksimume _4 vicoj_.\n\n_+3:_ Mortigi malamikon per la spirita arko plilongigas la daŭron de la natura povo je _3 vicoj_. La daŭro povas esti plilongigita je maksimume _6 vicoj_.\n\n_+4:_ Mortigi malamikon per la spirita arko plilongigas la daŭron de la natura povo je _4 vicoj_. La daŭro povas esti plilongigita je maksimume _8 vicoj_.
actors.hero.talent.wild_momentum.title=sovaĝa impeto
actors.hero.talent.wild_power.desc=_+1:_ Kiam oni uzas sovaĝan magion, sorĉbastonoj estos plifortigitaj je aŭ _2 aŭ 3, ĝis +4_.\n\n_+2:_ Kiam oni uzas sovaĝan magion, sorĉbastonoj estos plifortigitaj je _3, ĝis +5_.\n\n_+3:_ Kiam oni uzas sovaĝan magion, sorĉbastonoj estos plifortigitaj je aŭ _3 aŭ 4, ĝis +6_.\n\n_+4:_ Kiam oni uzas sovaĝan magion, sorĉbastonoj estos plifortigitaj je _4, ĝis +7_.
actors.hero.talent.wild_power.title=sovaĝa potenco
actors.mobs.acidic.desc=Ĉi tiuj grandegaj araneo-similaj demonaj estaĵoj evitas proksiman batalon, preferante pafi kripligajn segildentajn pikilojn de longaj distancoj. Ĉi tiu ŝajnas gutegi de koroda ŝlimo.
actors.mobs.acidic.name=acida skorpio
actors.mobs.albino.desc=Ĉi tiu estas malofta raso de marsupia rato, kun pure blanka felo kaj dentitaj dentoj.
actors.mobs.albino.discover_hint=Vi malofte povas trovi ĉi tiun malamikon en specifa regiono de la kelkarcero.
actors.mobs.albino.name=albina rato
actors.mobs.armoredbrute.desc=La plej altrangaj gnol-brutoj ofte portas potencajn kirasojn por montri sian statuson. La kiraso igas ĉi tiujn brutojn multe pli rezistemaj al fizika damaĝo, kaj ilia pli granda disciplino signifas, ke ili povas furiozi multe pli longe antaŭ ol venkiĝi al siaj vundoj.
actors.mobs.armoredbrute.name=kirasa bruto
actors.mobs.armoredstatue.desc=Oni pensus, ke ĝi estas nur alia el la senvivaj statuoj de ĉi tiu kelkarcero, sed ĝiaj ruĝe brilantaj okuloj perfidas ĝin. \n\nĜi ŝajnas esti en bonega stato pro la kiraso, kiun ĝi portas, ĝi povus esti tre malfacile mortigi.
actors.mobs.armoredstatue.desc_arm_wep=Kvankam la statuo mem estas farita el ŝtono, la _%1$s_ kaj _%2$s_, kiujn ĝi tenas, aspektas realaj.
actors.mobs.armoredstatue.name=kirasa statuo
actors.mobs.bandit.desc=Pli profundaj niveloj de la kelkarcero ĉiam estis kaŝejo por ĉiuspecaj krimuloj. Ne ĉiuj el ili povis konservi klaran menson dum siaj longaj periodoj tiel malproksimaj de la taglumo. Antaŭ longe, ĉi tiuj frenezaj ŝtelistoj kaj banditoj forgesis, kiuj ili estas kaj kial ili ŝtelas.
actors.mobs.bandit.name=freneza bandito
actors.mobs.bat.desc=Ĉi tiuj viglaj kaj persistemaj loĝantoj de la kavernoj estas multe pli danĝeraj ol ili ŝajnas. Ili replenigas sian sanon per ĉiu sukcesa atako, kio permesas al ili venki multe pli grandajn kontraŭulojn.
actors.mobs.bat.name=vampira vesperto
actors.mobs.bee.desc=Malgraŭ sia eta grandeco, oraj abeloj emas furioze protekti sian hejmon. Ĉi tiu estas tre freneza, pli bone tenu distancon.
actors.mobs.bee.desc_honey=Malgraŭ sia eta grandeco, oraj abeloj emas furioze protekti sian hejmon. Ĉi tiu estis pacigita, kaj ŝajnas voli sekvi vin.
actors.mobs.bee.discover_hint=Vi povas trovi ĉi tiun rolulon per specifa objekto.
actors.mobs.bee.name=ora abelo
actors.mobs.brute$bruterage.desc=Ĉi tiu gnola bruto mortas, sed volas vin kunporti!\n\nLa bruto mortos kiam ĝia ŝirmado eluziĝos, ĉu pro tempo aŭ se ĝi estos difektita. Dume, ĝi kaŭzos grandege pliigitan damaĝon, do atentu!\n\nRestanta ŝildo: %d.
actors.mobs.brute$bruterage.name=bruta kolero
actors.mobs.brute.def_verb=blokita
actors.mobs.brute.desc=Brutuloj estas la plej grandaj, fortaj kaj harditaj el ĉiuj gnoloj. Grave vunditaj, ili furioziĝas kaj kaŭzas eĉ pli da damaĝo al siaj malamikoj.
actors.mobs.brute.enraged=kolerigita
actors.mobs.brute.name=gnola brutulo
actors.mobs.causticslime.desc=Ŝajnas, ke ĉi tiu ŝlimo estis makulita de la malhela magio eliranta de sube. Ĝi perdis sian kutiman verdan koloron, kaj gutetas kaŭstikan ŝlimon.
actors.mobs.causticslime.discover_hint=Vi malofte povas trovi ĉi tiun malamikon en specifa regiono de la kelkarcero.
actors.mobs.causticslime.name=morda ŝlimo
actors.mobs.crab.desc=Ĉi tiuj grandegaj kraboj estas ĉe la supro de la nutroĉeno en la kloakoj. Ili estas ekstreme rapidaj kaj ilia dika karapaco povas elteni pezajn batojn.
actors.mobs.crab.name=kloaka krabo
actors.mobs.crystalguardian.def_verb=blokita
actors.mobs.crystalguardian.desc=Ĉi tiuj grandaj kristalaj gardantoj preskaŭ aspektas kiel statuoj, se ne estus pro iliaj brile brilantaj okuloj. La hardita kristalo, el kiu ili estas faritaj, igas ilin malviglaj sed tre fortikaj, do _estas plej bone lasi ilin dormi en sia kristala nesto kiel eble plej longe._\n\nPro sia grandeco, kristalaj gardantoj moviĝos multe pli malrapide en fermitaj spacoj. Ili ankaŭ estas tiel fortikaj, ke estas neeble tuj mortigi ilin. Ili povas esti venkitaj kaj provizore malfunkciigitaj, sed ili nur releviĝos post iom da tempo.
actors.mobs.crystalguardian.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.crystalguardian.name=kristala gardanto
actors.mobs.crystalmimic.ate=La imitisto formanĝis vian %s!
actors.mobs.crystalmimic.desc=Imitistoj estas magiaj estaĵoj, kiuj povas preni ajnan formon, kiun ili deziras. En kelkarceroj ili preskaŭ ĉiam elektas formon de trezorkesto, por allogi sensuspektajn aventuristojn. \n\nKristalaj imitistoj estas pli ruzaj ol iliaj ordinaraj kuzoj, kaj preferas eviti konflikton dum ŝtelado de rabaĵo. Ili provos forkuri post kiam ili estas malkovritaj, kaj havas la kapablon repoziciigi malamikojn kiam ili atakas.
actors.mobs.crystalmimic.escaped=La kristala imitisto eskapis!
actors.mobs.crystalmimic.name=kristala imitisto
actors.mobs.crystalspire.alert=La vibrado kreskas kaj tondras tra la tuta kaverno!
actors.mobs.crystalspire.desc=Ĉi tiu giganta spajro el ultramalmola kristalo estas probable la fonto de ĉiuj strangaj kristalaj estaĵoj en ĉi tiu kaverno. Viaj regulaj armiloj estas senefikaj kontraŭ ĝi, do vi devos uzi vian pioĉon se vi volas detrui ĝin. \n\n_Certigu, ke vi estas preparita antaŭ ol vi komencos rompi ĝin._ Tia granda kristalo probable bezonos iom da tempo por traminis, kaj vi probable ne povos fari tion neĝenate. La spajro mem eble eĉ havas iun rimedon por defendi sin. _Eble la propraj atakoj de la spajro povus esti uzataj kontraŭ ĝiaj helpantoj._
actors.mobs.crystalspire.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.crystalspire.name=kristala spajro
actors.mobs.crystalspire.warning=La kristalo vibras kiam vi frapas ĝin. Daŭrigi tion certe altiros atenton al vi...
actors.mobs.crystalwisp.beam_kill=La lumradio vin mortigis...
actors.mobs.crystalwisp.desc=Malgranda kolera ŝvebanta peco da hardita kristalo, kiu produktas brilan brilon. Kvankam ne aparte fortaj, kristalaj tufoj pafos damaĝan lumradion al vi se ili havas klaran pafon.\n\nTufoj estas sufiĉe malgrandaj por facile moviĝi tra la diversaj kristalaj elstaraĵoj, sed ili ne kapablas pafi tra ili.
actors.mobs.crystalwisp.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.crystalwisp.name=kristala tufo
actors.mobs.demonspawner.desc=Ĉi tiu torda amalgamo de nana karno respondecas pri la kreado de ŝirantaj demonoj el la nanoj, kiuj mortis en ĉi tiu regiono. Klare la demonoj vidas neniun problemon uzi ĉiun eblan rimedon kontraŭ siaj malamikoj.\n\nKvankam vide timigaj, demonaj generiloj ne havas rimedojn por moviĝi aŭ rekte defendi sin. Ilia konsiderinda maso tamen malfaciligas rapide mortigi ilin, kaj ili generos ŝirantajn demonojn pli rapide kiam ili estas minacataj.\n\n_Demonaj generiloj ŝajnas esti ligitaj al iu centra fonto de demona potenco. Mortigi ilin povus malfortigi ĝin._
actors.mobs.demonspawner.name=demona naskigisto
actors.mobs.demonspawner.on_death=La demona energio ĉi tie ŝajnas malpliiĝi kiam la naskiganto mortas.
actors.mobs.dm100.desc=La DM-100 estas frua modelo de nana "defendmaŝino", kiu estis desegnita por protekti nanajn ministojn en la kavernoj sub ĉi tiu malliberejo. Iliaj elektraj ŝokoj tamen montriĝis tro malfortaj, kaj tial ili estis donacitaj al la homa urbo supre. Ili restis neuzataj dum jaroj kaj fine trovis sian vojon al la malliberejo, kie la gardisto komence opiniis ilin tro kruelaj por uzi. Tamen, kiam la malliberuloj fariĝis pli neregeblaj, ili fariĝis neceso.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=La fulmo mortigis vin...
actors.mobs.dm200.desc=La DM-200 estas la dua generacio de nana "defendmaŝino", kiu estis desegnita por protekti nanajn ministojn en la kavernoj kaj urbo sube. Ili estas multe pli grandaj kaj pli dikaj ol siaj antaŭuloj, kaj atakas per detruaj hidraŭlikaj pugnoj. \n\nIlia pliigita grandeco estas ankaŭ ilia ĉefa malforto, ĉar ili ne kapablas konveni en la mallarĝajn tunelojn kaj pordojn de la kelkarcero. La nanoj povis kompensi la mankon de moviĝeblo de la DM-200 permesante al ili eligi siajn toksajn ellasajn gasojn al malproksimaj malamikoj, aŭ malamikoj, kiujn ili ne povas atingi.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=La DM-200 pafas ŝprucon de toksa degaso!
actors.mobs.dm201.desc=La dŭarfoj nelonge eksperimentis pli emfazante la mankon de moviĝeblo de la DM-200 kaj kreis kelkajn DM-modelojn, kiuj estas tute senmovaj. La DM-201 estas modernigita DM-200, kiu funkcias kiel gardostaranta gvattureto sen movokapablo. Kontraŭ la manko de moviĝeblo, DM-201-oj havas signife pli da daŭreco kaj ataka povo. \n\nĈar DM-201-oj ne havas motoron por eligi degasojn, la dŭarfoj anstataŭe ekipis ilin per korodaj gasobusoj! DM-201-oj tamen estas singardaj kun ĉi tiuj obusoj, kaj nur ĵetos ilin kiam atakitaj de malproksime.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=La DM-201 ĵetas korodan obuson!
actors.mobs.dm300.charge_lost=PILONO DETRUIĜITA! REVENAS AL LOKA POVO!
actors.mobs.dm300.charging=SUSPERANTE DIFEKTON! AKTIVIGANTE POTENCPILONO!
actors.mobs.dm300.charging_hint=DM-300 estas nevundebla dum ĝi estas energiigita per pilono!
actors.mobs.dm300.def_verb=blokita
actors.mobs.dm300.defeated=KRITIKA DAMAGO! PROVANTE FERMI-
actors.mobs.dm300.desc=Ĉi tiun maŝinon konstruis la gnomoj antaŭ kelkaj jarcentoj. Poste ili komencis anstataŭigi maŝinojn per golemoj, elementuloj kaj eĉ demonoj. Tio fine kaŭzis la malprosperon de ilia civilizo. DM-300 kaj similaj maŝinoj kutime servis por konstruado kaj minado, foje ankaŭ por defendi la urbon.
actors.mobs.dm300.desc_supercharged=DM-300 estas nuntempe ŝargita per elektra energio. En ĉi tiu formo, DM-300 ne povas esti difektita kaj moviĝas duoble rapide! Krome, ĝia borilo nun turniĝas sufiĉe rapide por ke ĝi povu _tuneli tra solida roko_, kvankam ĝi moviĝas multe pli malrapide farante tion. \n\nAtaki DM-300 rekte estas senutile dum ĝi estas superŝargita, sed _io en la areo devas provizi al ĝi ĉi tiun energion_, detruante tion, kio povus malfortigi ĝin.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=NERAJTIGITA PERSONARO DETEKTITA!
actors.mobs.dm300.pylons_destroyed=AVERTO! MESTABILECO DETEKTITA EN LA ELEKTRA RETO!
actors.mobs.dm300.rankings_desc=Dispremita de la DM-300
actors.mobs.dm300.shield=DM-300 tiras potencon de la nudaj dratoj kaj ŝirmas sin!
actors.mobs.dm300.supercharged=DETRUU! DETRUU! DETRUU!
actors.mobs.dwarfking$dkghoul.rankings_desc=Falis Antaŭ la Reĝo de la Nanoj
actors.mobs.dwarfking$dkgolem.rankings_desc=Falis Antaŭ la Reĝo de la Nanoj
actors.mobs.dwarfking$dkmonk.rankings_desc=Falis Antaŭ la Reĝo de la Nanoj
actors.mobs.dwarfking$dkwarlock.rankings_desc=Falis Antaŭ la Reĝo de la Nanoj
actors.mobs.dwarfking.defeated=Vi... kondamnis nin ĉiujn...
actors.mobs.dwarfking.desc=Antaŭ multaj jaroj, unu el la plej altaj sorĉistoj en la nana kortego malkovris sekretojn, kiuj donis al li grandegan potencon super vivo kaj morto. Li baldaŭ uzis ĉi tiun potencon, subigante kaj koruptante siajn samulojn, sian reĝon, kaj fine ĉiun nanan civitanon. Nun li estas reĝo, reganto super legio de malmortaj subuloj. \n\nLa Reĝo de la Nanoj estas agresema malamiko, kiu provos ĉirkaŭi kaj superforti siajn malamikojn per sia hordo de malmortaj servistoj.
actors.mobs.dwarfking.enraged=Vi ne povas mortigi min %s. MI. ESTAS. SENMORTA!
actors.mobs.dwarfking.lifelink_1=Mi bezonas vian esencon, sklavo!
actors.mobs.dwarfking.lifelink_2=Sangu por mi, sklavo!
actors.mobs.dwarfking.losing=Ne! Vi ne povas fari tion... vi tute ne scias, kio kuŝas sube...
actors.mobs.dwarfking.name=Reĝo de Dŭarfoj
actors.mobs.dwarfking.notice=Kiel vi kuraĝas! Vi tute ne scias, kion vi ĝenas!
actors.mobs.dwarfking.rankings_desc=Falis Antaŭ la Reĝo de la Nanoj
actors.mobs.dwarfking.teleport_1=Traktu ilin, sklavo!
actors.mobs.dwarfking.teleport_2=Okupu ilin, sklavo!
actors.mobs.dwarfking.wave_1=Sufiĉe! Leviĝu, miaj sklavoj!
actors.mobs.dwarfking.wave_2=Pli! Sangu por via reĝo!
actors.mobs.dwarfking.wave_3=Senutila! MORTIGU ILIN NUN!
actors.mobs.ebonymimic.desc=Imitistoj estas magiaj estaĵoj, kiuj povas preni ajnan formon, kiun ili deziras. En kelkarceroj ili preskaŭ ĉiam elektas formon de trezorkesto, por allogi sensuspektajn aventuristojn. \n\nEbonaj imitistoj estas sekretaj imitistoj kun la kapablo igi sin preskaŭ nevideblaj. Ili kaŝiĝas sur aferoj, kun kiuj aventuristoj verŝajne interagos, sed ankaŭ enhavas propran rabaĵon. Ili ne estas pli fortikaj ol ordinara imitisto post kiam ili estas malkovritaj, sed ilia surpriza mordo estas detruega.
actors.mobs.ebonymimic.discover_hint=Vi povas trovi ĉi tiun malamikon per specifa ornamaĵo.
actors.mobs.ebonymimic.hidden_desc=Ŝajnas esti io ĉi tie, sed ĝi estas preskaŭ tute travidebla.
actors.mobs.ebonymimic.hidden_name=suspektinda skizo
actors.mobs.ebonymimic.name=ebono imitisto
actors.mobs.ebonymimic.reveal=Tie estis imitisto!
actors.mobs.elemental$chaoselemental.desc=Elementuloj estas kaosaj estaĵoj, kiuj ofte kreiĝas kiam potenca okulta magio ne estas konvene kontrolata. Elementuloj havas minimuman inteligentecon, kaj kutime asociiĝas kun aparta tipo de magio. \n\nKaosaj elementuloj estas maloftaj kaj danĝeraj elementuloj, kiuj ne stabiliĝis al aparta elemento. Ili ellasos sovaĝan neantaŭvideblan magion kiam ili atakos.
actors.mobs.elemental$chaoselemental.name=kaoso elementa
actors.mobs.elemental$fireelemental.desc=Elementuloj estas kaosaj estaĵoj, kiuj ofte kreiĝas kiam potenca okulta magio ne estas konvene kontrolata. Elementuloj havas minimuman inteligentecon, kaj kutime asociiĝas kun aparta tipo de magio. \n\nFajraj elementuloj estas ofta tipo de elementuloj, kiuj kaŭzas damaĝon per fajra magio. Ili ekbruligos sian celon per manbatalaj atakoj, kaj foje ankaŭ povas pafi fajrofulmojn.
actors.mobs.elemental$fireelemental.name=fajro elementa
actors.mobs.elemental$frostelemental.desc=Elementuloj estas kaosaj estaĵoj, kiuj ofte kreiĝas kiam potenca okulta magio ne estas konvene kontrolata. Elementuloj havas minimuman inteligentecon, kaj kutime asociiĝas kun aparta tipo de magio. \n\nFrostaj elementuloj estas ofta tipo de elementuloj, kiuj malfortigas malamikojn per malvarmiga magio. Ili malvarmigos sian celon per manbatalo kaj fojaj distancataj atakoj. Ilia magio estas multe pli efika en akvo.
actors.mobs.elemental$frostelemental.name=frosto elementa
actors.mobs.elemental$newbornfireelemental.charging=La elementa forto ŝargiĝas!
actors.mobs.elemental$newbornfireelemental.desc=Elementuloj estas kaosaj estaĵoj, kiuj ofte kreiĝas kiam potenca okulta magio ne estas konvene kontrolata. Elementuloj havas minimuman inteligentecon, kaj kutime asociiĝas kun aparta tipo de magio. \n\nĈi tiu fajra elementulo estas ĵus alvokita, sed tamen sufiĉe danĝera!
actors.mobs.elemental$newbornfireelemental.desc_ally=Ĉar ĉi tiu elementalo estis alvokita per sorĉo, ĝi havas iom pli da kontrolo super sia flamo. Ĝi ne kapablas fari distancajn atakojn, sed ekbruligos malamikojn, kiujn ĝi atakas, en manbatalo.
actors.mobs.elemental$newbornfireelemental.desc_boss=Pro la kaosa naturo de ĝia alvoko, ĉi tiu elementa heroo povas disvastigi fajron nur per malprecizaj eksplodoj post ŝargado por unu vico.
actors.mobs.elemental$newbornfireelemental.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.elemental$newbornfireelemental.name=novnaskita fajro elementa
actors.mobs.elemental$shockelemental.desc=Elementuloj estas kaosaj estaĵoj, kiuj ofte kreiĝas kiam potenca okulta magio ne estas konvene kontrolata. Elementuloj havas minimuman inteligentecon, kaj kutime asociiĝas kun aparta tipo de magio. \n\nŜokaj elementuloj estas malpli ofta tipo de elementuloj, kiuj interrompas siajn malamikojn per elektro kaj lumfulmoj. En manbatalo ili arkos elektron al proksimaj malamikoj, kaj kaŭzos kroman damaĝon al sia ĉefa celo se ili estas en akvo. Ili ankaŭ foje enfokusigos distanc-lumeksplodon al sia celo, provizore blindigante ilin.
actors.mobs.elemental$shockelemental.name=ŝoko elementa
actors.mobs.eye.deathgaze_kill=La mortrigardo vin mortigis...
actors.mobs.eye.desc=Oni ankaŭ nomas ĉi tiun demonon «globo de malamo». Vidinte malamikon, ĝi senpripense uzas sian mortigan rigardon, ofte ignorante kaj vundante siajn aliancanojn.
actors.mobs.eye.name=malbona okulo
actors.mobs.fetidrat.desc=Io klare estas malĝusta kun ĉi tiu rato. Ĝia grasa nigra felo kaj putra haŭto estas tre malsamaj ol la sanaj ratoj, kiujn vi antaŭe vidis. Ĝiaj palverdaj okuloj igas ĝin ŝajni aparte minaca. \n\nLa rato portas nubon de terura fetoro, ĝi estas superforte forta de proksime. \n\nMalhela ŝlimo gutetas el la buŝo de la rato, ĝi manĝas tra la planko sed ŝajnas dissolviĝi en akvo.
actors.mobs.fetidrat.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.fetidrat.name=fetora rato
actors.mobs.fungalcore.desc=Ĉi tiu giganta fungo devas esti la fonto de la tuta funga agado en ĉi tiu kaverno.
actors.mobs.fungalcore.name=funga kerno
actors.mobs.fungalsentry.desc=Ĉi tiu aparte alta fungo funkcias kiel defendpunkto por la pli granda funga reto vivanta en ĉi tiu kaverno. \n\nĜi estas senmova, sed pafos precizajn venenajn ekblovojn al ĉio, kio eniras ĝian vidlinion. Kvankam la efiko de ĉi tiuj eksplodoj estas sufiĉe malforta, _ili povas amasigi mortigajn kvantojn da veneno tre rapide._ Kvankam ĝi povas esti mortigita, estas verŝajne plej bone eviti ĝin.
actors.mobs.fungalsentry.name=funga gardostaranto
actors.mobs.fungalspinner.desc=Ĉi tiu kaverna ŝpinilo ŝajnas esti kontrolata de parazita fungo. La fungo ankaŭ ŝanĝis siajn kapablojn, anstataŭigante sian reton kaj venensakojn per funga kresko. \n\nLa funga ŝpinilo kraĉos plantvivon al vi anstataŭ retojn, disvastigante fungan vegetaĵaron kaj eble enradikigante vin. Kvankam ĝi ne povas veneni, la funga ŝpinilo gajnos konsiderindan damaĝreziston se ĝi estas apud iuj ajn fungoj.
actors.mobs.fungalspinner.name=funga ŝpinilo
actors.mobs.ghoul.desc=Dum la nana socio malrapide komencis kolapsi, kaj la nuna reĝo de la gnomoj prenis absolutan potencon, tiuj, kiuj estis malfortaj aŭ kiuj rezistis lin, ne estis bone traktataj. Dum la reĝo fariĝis pli lerta pri uzado de malhela magio, li fleksis ĉi tiujn gnomojn al sia volo, kaj nun ili konsistigas la infanterisoldatojn de lia armeo.\n\nDemonoj ne estas aparte fortaj solaj, sed ĉiam vojaĝas en grupoj kaj estas multe pli malfacile mortigi en grandaj nombroj. _Kiam demono estas venkita, ĝi releviĝos post kelkaj vicoj, kondiĉe ke alia demono estas proksime._
actors.mobs.ghoul.name=nana demono
actors.mobs.gnoll.desc=Gnoloj estas hien-similaj humanoidoj. Ili loĝas en kloakoj kaj kelkarceroj, kuraĝante supreniri por rabi la surfacon de tempo al tempo. Gnolaj skoltoj estas regulaj membroj de ilia grupo, ili ne estas tiel fortaj kiel brutoj kaj ne tiel inteligentaj kiel ŝamanoj.
actors.mobs.gnoll.name=gnola skolto
actors.mobs.gnollexile.desc=Ĉi tiu grizfela gnolo havas grandan markon sur sia ŝultro, kiu indikas ĝin kiel ekziliton. Gnoloj kutime estas ekzilitaj el sia socio pro ignorado de ordonoj aŭ malobeo de leĝoj. Ekzilitoj devas esti fortaj kaj ruzaj por pluvivi, ĉi tiu aspektas kvazaŭ ĝi scias kiel uzi la lancon, kiun ĝi tenas.
actors.mobs.gnollexile.desc_aggro=_La gnola ekzilitino rigardas ĉirkaŭen kolere._ Ŝajnas, ke io finfine igis ĝin decidi batali. Atentu tiun lancon!
actors.mobs.gnollexile.desc_passive=_La ekzilitino de gnolo ne moviĝas por ataki._ Ĝi ne ŝajnas tiel agresema kiel la aliaj gnoloj ĉi tie, kaj verŝajne ne pensas, ke batali kontraŭ vi valoras la penon. Vi povus simple lasi ĝin pasi, sed ĝi havas dorsosakon, kiu eble estas plena de utilaj objektoj...
actors.mobs.gnollexile.name=gnola ekzilo
actors.mobs.gnollexile.seen_aggro=La lanc-uzanta gnolo moviĝas por ataki!
actors.mobs.gnollexile.seen_passive=La lanco-uzanta gnolo rigardas vin singarde, sed ne moviĝas por ataki.
actors.mobs.gnollgeomancer.alert=La geomancisto vekiĝas! La tuta kaverno ŝajnas ŝanĝiĝi dum ĝi saltas for kaj freneze ridas!
actors.mobs.gnollgeomancer.desc=Ĉi tiu impone alta altranga gnolo certe estas la fonto de la diversaj termovaj magioj ĉi tie, kaj la organizanto de la tuta gnola agado. Male al la gnolaj ministoj en la regiono, la geomancisto estas tre lerta pri sia magio, kaj ne povas esti damaĝita de ĵetitaj aŭ falantaj rokoj. Ĝi tamen ne havas manieron batali en proksimbatala batalo.
actors.mobs.gnollgeomancer.desc_armor=La geomanciisto estas nuntempe enkapsuligita en tavolo de roka kiraso. _Vi devos alproksimiĝi kaj rompi ĝin per via pioĉo antaŭ ol vi povos damaĝi la geomanciiston._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Proksima gnol-ministo tenas aparaton, kiu plifortigas la rokan kirason de la geomancisto. Vi tute ne povos difekti ĝin nun!_
actors.mobs.gnollgeomancer.desc_sleeping=Ĉi tiu impone alta gnola ŝamano estas ĉirkaŭata de tavolo da roko, kaj aspektas preskaŭ kiel statuo. Rigardante atente, vi povas vidi la rokon magie moviĝi sinkrone kun la spirado de la ĉefa gnola. Ĝi ne povas esti damaĝita dum ĝi estas enfermita en roko tiel, kaj ŝajnas, ke ĝi ĝuas laŭvortan teran dormeton. \n\nVi verŝajne povas rompi la tavolojn da roko per via pioĉo, sed _certigu, ke vi estas preta por batalo kiam vi faros tion._ La geomancisto devas esti la fonto de la diversaj ter-movaj magioj ĉi tie, kaj la organizanto de la tuta gnola agado. _Venki la gnolajn disĵetitajn ĉi tie antaŭ ol batali kontraŭ ili eble estus bona ideo._
actors.mobs.gnollgeomancer.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.gnollgeomancer.name=gnola geomancisto
actors.mobs.gnollgeomancer.rock_kill=La fluganta roko vin mortigis...
actors.mobs.gnollgeomancer.rockfall_kill=La falantaj ŝtonoj vin mortigis...
actors.mobs.gnollgeomancer.warning=La geomanciisto komencas moviĝi. Certigu, ke vi estas preta antaŭ ol vi daŭrigos!
actors.mobs.gnollguard.def_verb=blokita
actors.mobs.gnollguard.desc=Granda kaj fortika gnolisto, kiu uzas lancon kaj ŝildon, sed ne havas kaskon. Ĉi tiuj gardistoj estas verŝajne trejnitaj brutoj, ŝnurligitaj por helpi protekti la minejon kontraŭ entrudiĝantaj sovaĝaj bestoj. \n\nLa gnolisto estas sufiĉe forta por uzi la lancon en unu mano, sed ne povas uzi ĝin tre bone. _Ĝi bezonos sufiĉe liberan spacon por ataki de malproksime, kaj kaŭzos rimarkinde malpli da damaĝo al vi, se vi alproksimiĝos._
actors.mobs.gnollguard.desc_armor=_Proksima gnol-ministo tenas aparaton, kiu donas al ĉi tiu gardisto teran kirason, forte reduktante la damaĝon, kiun ĝi ricevas._
actors.mobs.gnollguard.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.gnollguard.name=gnolgardisto
actors.mobs.gnollguard.spear_warn=La gnolulo donas brutalan baton per la pinto de sia lanco!
actors.mobs.gnollsapper.desc=Malgranda kaj malforta sed inteligenta gnolo kun pala felo kaj ŝultrosako plena de diversaj aparatoj. Ili verŝajne estas ĉi tie por helpi en la prospektorado kaj minado de malhela oro, kaj havas proksiman gardiston por protekto. Ili kapablas batali, sed iliaj atakoj estas kompatinde malfortaj, ne pli fortaj ol gnola skolto.\n\nAnstataŭ batali rekte, ministoj preferas uzi la diversajn aparatojn, kiujn ili havas, por ataki la rokan medion por ili. Ili mem tamen ne konas ter-movan magion, kaj tial tre verŝajne uzas siajn aparatojn malzorge. _Devus esti multaj manieroj uzi iliajn atakojn kontraŭ ili, aŭ ilia gardisto._
actors.mobs.gnollsapper.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.gnollsapper.name=gnol-ministo
actors.mobs.gnolltrickster.desc=Strangeaspektanta kreitaĵo, eĉ laŭ gnolaj normoj. Ĝi kliniĝas antaŭen kun malica rideto, preskaŭ tenante la ŝultrosakon pendantan super sia ŝultro. Ĝiaj okuloj estas larĝaj kun stranga miksaĵo de timo kaj ekscito. \n\nEstas granda kolekto de malbone faritaj ĵetsagetoj en ĝia ŝultrosako, ili ĉiuj ŝajnas esti kovritaj per diversaj damaĝaj substancoj.
actors.mobs.gnolltrickster.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.gnolltrickster.name=gnola trompisto
actors.mobs.goldenmimic.desc=Imitistoj estas magiaj estaĵoj, kiuj povas preni ajnan formon, kiun ili deziras. En kelkarceroj ili preskaŭ ĉiam elektas formon de trezorkesto, por allogi sensuspektajn aventuristojn. \n\nOraj imitistoj estas pli fortikaj imitistoj, kiuj provas allogi la plej fortajn aventuristojn. Ili havas pli bonan rabaĵon, sed ankaŭ estas multe pli fortaj ol regulaj imitistoj.
actors.mobs.goldenmimic.name=ora imitisto
actors.mobs.golem.def_verb=blokita
actors.mobs.golem.desc=La gnomoj provis kunigi sian scion pri mekanismoj kun sia nove akirita povo ligi elementulojn. Kiel animojn de la mekanikaj korpoj de golemoj ili uzis terajn spiritojn, kiujn ili opiniis plej facile regeblaj. Tamen eĉ eta eraro dum la rito povis kaŭzi tumulton.
actors.mobs.golem.name=Golemo
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurpo... glurpo...
actors.mobs.goo.desc=Oni scias malmulton pri la Ŝlimo. Eble ĝi eĉ ne estas viva estaĵo, sed miksaĵo de kloakaj substancoj, kiu akiris la rudimentojn de propra volo.
actors.mobs.goo.enraged=kolerigita
actors.mobs.goo.gluuurp=GLUUURP!
actors.mobs.goo.name=Ŝlimo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Goo pumpas sin!
actors.mobs.goo.rankings_desc=Absorbita de la Gluaĵo
actors.mobs.greatcrab.def_verb=blokita
actors.mobs.greatcrab.desc=Ĉi tiu krabo estas giganta, eĉ kompare kun aliaj kloakkraboj. Ĝia blua ŝelo estas kovrita de fendetoj kaj balanoj, montrante grandan aĝon. Ĝi peze moviĝas ĉirkaŭe, apenaŭ konservante ekvilibron per sia masiva ungego. \n\nKvankam la krabo havas nur unu ungegon, ĝia grandeco facile kompensas. La krabo tenas la ungegon antaŭ iu ajn minaco, ŝirmante sin malantaŭ nepenetrebla muro de karapaco. Tamen, la krabo ne povas bloki atakojn, kiujn ĝi ne vidas veni, aŭ atakojn de pluraj malamikoj samtempe.
actors.mobs.greatcrab.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.greatcrab.name=granda krabo
actors.mobs.greatcrab.noticed=La krabo blokas per sia masiva ungego.
actors.mobs.guard.def_verb=blokita
actors.mobs.guard.desc=Iam gardistoj de la malliberejo, ĉi tiuj gardistoj jam delonge fariĝis neniaj malsamaj ol la malliberuloj. Ili ŝanceliĝas kiel zombioj, sencerbe vagante tra la koridoroj serĉante ion ajn malkonvenan, kiel vi! \n\nIli portas ĉenojn ĉirkaŭ sia kokso, eble uzatajn por altiri malamikojn al proksima distanco.
actors.mobs.guard.name=prizona gardisto
actors.mobs.guard.scorpion=Venu ĉi tien!
actors.mobs.hermitcrab.def_verb=blokita
actors.mobs.hermitcrab.desc=Pro unu aŭ alia kialo, ĉi tiu kloakkrabo decidis porti la rompitan supran parton de barelo sur sia kapo! La ekstra pezo malrapidigis ĝin al normala rapideco, sed ankaŭ donis al ĝi konsiderinde pli da defendo. Vi tamen pensas, ke vi povas aŭdi ion resalti interne de la barelo...
actors.mobs.hermitcrab.name=ermita krabo
actors.mobs.mimic.desc=Imitistoj estas magiaj estaĵoj, kiuj povas preni ajnan formon, kiun ili deziras. En kelkarceroj ili preskaŭ ĉiam elektas formon de trezorkesto, por allogi sensuspektajn aventuristojn.
actors.mobs.mimic.discover_hint=Vi povas trovi ĉi tiun malamikon ie ajn en la kelkarcero.
actors.mobs.mimic.hidden_hint=Io pri ĉi tiu kesto ŝajnas stranga... Supreniri kaj provi malfermi ĝin eble estus malbona ideo.
actors.mobs.mimic.name=mimikulo
actors.mobs.mimic.reveal=Tiu brusto estas imitisto!
actors.mobs.mob.died=Vi aŭdas ion morti en la distanco.
actors.mobs.mob.discover_hint=Vi povas trovi ĉi tiun malamikon en specifa regiono de la kelkarcero.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Mortigita de: %s
actors.mobs.monk$focus.desc=Ĉi tiu monaĥo estas perfekte akrigita al sia celo, kaj ŝajnas antaŭvidi iliajn movojn antaŭ ol ili faras ilin. \n\nDum fokusita, la sekva fizika atako farita kontraŭ ĉi tiu rolulo certe maltrafos, sendepende de la cirkonstancoj. Deturni ĉi tiun atakon elspezos la fokuson de la monaĥo, kaj ili devos pliigi ĝin denove por deturni alian atakon. Monaĥoj kreskigas fokuson pli rapide dum ili moviĝas.
actors.mobs.monk$focus.name=fokusita
actors.mobs.monk.def_verb=blokita
actors.mobs.monk.desc=Ĉi tiuj monaĥoj estas fanatikuloj, kiuj dediĉis sin al protektado de la sekretoj de sia urbo kontraŭ ĉiuj eksteruloj. Ili uzas nek kirason nek armilojn kaj fidas nur sian lerton en senarma batalo.
actors.mobs.monk.name=gnoma monaĥo
actors.mobs.monk.parried=deturnita
actors.mobs.necromancer$necroskeleton.desc=Ĉi tiu skeleto estis alvokita de nekromancisto. Ĝi kondutas same kiel ordinara skeleto, kaj mortos kiam la nekromancisto, kiu alvokis ĝin, estos mortigita.
actors.mobs.necromancer$necroskeleton.name=skeleto de nekromancisto
actors.mobs.necromancer.desc=Ĉi tiuj metilernantoj de malhelaj magiistoj pilgrimis al la malliberejo, ĉar ĝi estas la perfekta loko por praktiki sian malbonan metion. \n\nNekromancistoj alvokos kaj povigos skeletojn por batali por ili. Mortigi la nekromanciston ankaŭ mortigos la skeleton, kiun ĝi alvokas.
actors.mobs.necromancer.name=nekromancisto
actors.mobs.npcs.blacksmith.cant_enter_old=Tiu areo ne estas alirebla dum ĉi tiu kuro. Ludu novan ludon por provi la novan serĉon!
actors.mobs.npcs.blacksmith.def_verb=blokita
actors.mobs.npcs.blacksmith.desc=Ĉi tiu trolforĝisto aspektas kiel ĉiuj troloj: li estas alta kaj svelta, kaj lia haŭto similas ŝtonon kaj laŭ koloro kaj laŭ teksturo. La trolforĝisto ludas per malproporcie malgrandaj iloj.
actors.mobs.npcs.blacksmith.enter_no=Ankoraŭ ne
actors.mobs.npcs.blacksmith.enter_yes=Mi estas Preta
actors.mobs.npcs.blacksmith.entrance_blocked=La vojo malsupren estas blokita.
actors.mobs.npcs.blacksmith.exit_no=Ankoraŭ ne
actors.mobs.npcs.blacksmith.exit_warn_crystal=Tiu giganta kristalo estas ankoraŭ tie sube ankaŭ. Mi pagos pli se vi detruos ĝin.
actors.mobs.npcs.blacksmith.exit_warn_full=Ĉu vi finis? Vi havas multe da oro, sed certigu, ke vi ne lasis viajn ekipaĵojn. \n\n_Memoru, mi ne lasos vin reen post kiam vi supreniros._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Tiu giganta fungo estas ankoraŭ tie sube ankaŭ. Mi pagos pli se vi mortigos ĝin.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Tiu gnola geomancisto estas ankoraŭ tie sube ankaŭ. Mi pagos pli se vi mortigos ĝin.
actors.mobs.npcs.blacksmith.exit_warn_high=Ĉu vi finis? Ŝajnas, ke vi havas bonan kvanton da oro, sed mi bezonus iom pli. Vi devus povi akiri _40 pecojn._\n\n_Memoru, mi ne lasos vin reen eniri post kiam vi supreniros._
actors.mobs.npcs.blacksmith.exit_warn_low=Ĉu vi jam finis? Ŝajnas, ke vi ne havas multe da oro. Vi devus povi akiri _40 pecojn._\n\n_Memoru, mi ne lasos vin reen eniri post kiam vi supreniros._
actors.mobs.npcs.blacksmith.exit_warn_med=Ĉu vi finis? Vi havas almenaŭ iom da oro, sed certe estas pli en la minejo. Vi devus povi akiri _40 pecojn._\n\n_Memoru, mi ne lasos vin reen enen post kiam vi supreniros._
actors.mobs.npcs.blacksmith.exit_warn_none=Ĉu vi jam finis? Vi apenaŭ havas oron! Vi devus povi akiri _40 pecojn._\n\n_Memoru, mi ne lasos vin reen eniri post kiam vi supreniros._
actors.mobs.npcs.blacksmith.exit_yes=Mi Finis
actors.mobs.npcs.blacksmith.get_lost=Mi estas okupata. Foriru!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hej Homo! Vi aspektas kiel grava persono.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Sed atentu, la minejo estas danĝera por malgranda homo kiel vi. Ĝi estas forlasita de iom da tempo, kaj amaso da kristaloj komencis kreski. Ili estas brilaj, sed tro fragilaj por esti valoraj, kaj ili havas kelkajn magiajn aĵojn, kiuj protektas ilin. Ili estas sufiĉe fortaj, do _estu singarda, kie vi minas_ aŭ vi altiros ilian atenton. \n\n Estas ankaŭ _giganta kristalo_ ie. Ĝi estas multe pli fortika, do estu preta por batalo se vi komencos rompi ĝin. Mi vetas, ke frakasi ĝin malrapidigos la tutan kristalan kreskon, do mi pagos ekstraĵon se vi povas fari ĝin.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hej Homo! Vi aspektas kuraĝa.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Sed atentu, la minejo estas danĝera por malgranda homo kiel vi. Estas ia fungo-monstro, kiu kreskis tie sube. Ĝi havas fungogardostarantojn, kiuj estas vere mortigaj se ili vidas vin, sed ili ne povas leviĝi kaj almenaŭ ĉasi vin. _Restu ekster videbleco_ se vi volas resti vivanta. \n\nMi pagos ekstraĵon se vi sukcesos faligi la _plej grandan fungon_, sed ĝi postulos iom da vera peno. Ĝi estas konektita al aro da miceliaj nodoj, kiuj estas kaŝitaj en la muroj. Vi devos rompi la plejparton el ili antaŭ ol vi povos vere difekti ĝin.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Sed atentu, la minejo estas danĝera por malgranda homo kiel vi. Kelkaj gnoloj ankaŭ volas la oron kaj nun ili detruas la lokon. Ili estas stultaj estaĵoj, do ilia minado kaŭzis ĉiaspecajn kolapsojn kaj terfosojn. Vi devos mini tra ĝi, do _serĉu ĵus ĝenitan rokon._\n\nMi pensas, ke unu el la gnoloj kaŭzas la plejparton de la problemoj, probable _geomancia ŝamano_ aŭ io simila. Mi pagos ekstraĵon, se vi povas trovi kaj mortigi ĝin, sed mi certas, ke ĝi batalos kontraŭe.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hej Homo! Vi aspektas kiel rapida.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hej Homo! Vi aspektas kiel inteligenta.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hej Homo! Vi aspektas kiel ruza ulo.
actors.mobs.npcs.blacksmith.intro_quest_start=Ĉu vi volas esti utila, ĉu? Jes, mi havas ion, kion vi povus fari. Mi konstruis ĉi tiun laborejon sur malnova minejo, ĝi estas ĝuste sub tiu ŝtupetaro. Prenu ĉi tiun pioĉon kaj elminu por mi iom da _malhela ora erco. 40 pecoj_ devus sufiĉi. La roko sube estas bela kaj mola, do _vi povos mine tra la muroj kun iom da peno._ \n\nKion vi celas, kiel mi pagos? Vi avida... \n\nBone, bone, mi povas fari iom da forĝado por vi. Konsideru vin bonŝanca, mi estas la sola forĝisto ĉirkaŭe.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hej Homo! Vi aspektas kiel fortulo.
actors.mobs.npcs.blacksmith.lost_pick=Ĉu vi ŝercas? Kie estas mia pioĉo?!
actors.mobs.npcs.blacksmith.name=trolo forĝisto
actors.mobs.npcs.blacksmith.quest_start_prompt=Ĉu vi pretas malsupreniri? Certigu, ke vi havas iom da libera spaco por la oro. \n\n_Mi seniluziigos vin nur unufoje!_
actors.mobs.npcs.blacksmith.reminder=Ĉu vi finis malŝpari mian tempon? La enirejo de la minejo estas tie.
actors.mobs.npcs.blacksmith.reminder_crystal=Alportu al mi tiom da oro kiom vi povas, kaj provu rompi ankaŭ la grandan kristalon.
actors.mobs.npcs.blacksmith.reminder_fungi=Alportu al mi tiom da oro kiom vi povas, kaj provu mortigi ankaŭ la gigantan fungon.
actors.mobs.npcs.blacksmith.reminder_gnoll=Alportu al mi tiom da oro kiom vi povas, kaj provu mortigi ankaŭ la gnolan geomanciston.
actors.mobs.npcs.ghost.crab_1=Saluton %s... Iam mi estis kiel vi - forta kaj memfida... Sed mi estis mortigita de antikva estaĵo... Mi ne povas forlasi ĉi tiun lokon... Ne ĝis mi venĝos min... Mortigu la _grandan krabon,_ kiu prenis mian vivon... \n\nĜi estas nenature malnova... Kun masiva ununura ungego kaj dika ŝelo... _Atentu ĝian ungegon, vi devas surprizi la krabon aŭ ĝi blokos per ĝi..._
actors.mobs.npcs.ghost.crab_2=Mi petas... Helpu min... Mortigu la Krustacon...\n\n_Ĝi ĉiam blokos... Kiam ĝi vidos vin veni..._
actors.mobs.npcs.ghost.desc=La fantomo apenaŭ videblas. Ĝi aspektas kiel senforma makulo de malforta lumo kun malĝoja vizaĝo.
actors.mobs.npcs.ghost.find_me=Dankon... venu trovi min...
actors.mobs.npcs.ghost.gnoll_1=Saluton %s... Iam mi estis kiel vi - forta kaj memfida... Sed mi estis mortigita de ruza malamiko... Mi ne povas forlasi ĉi tiun lokon... Ne ĝis mi venĝos min... Mortigu la _gnolan trompiston,_ kiu prenis mian vivon... \n\nĜi ne estas kiel la aliaj gnoloj... Ĝi kaŝas sin kaj uzas ĵetarmilojn... _Gardu vin kontraŭ ĝiaj venenaj kaj flamiĝemaj sagetoj, ne ataku de malproksime..._
actors.mobs.npcs.ghost.gnoll_2=Mi petas... Helpu min... Mortigu la trompiston... \n\n_Ne lasu ĝin trafi vin... Alproksimiĝu al ĝi..._
actors.mobs.npcs.ghost.name=malĝoja fantomo
actors.mobs.npcs.ghost.rat_1=Saluton %s... Iam mi estis kiel vi - forta kaj memfida... Sed mi estis mortigita de abomeninda besto... Mi ne povas forlasi ĉi tiun lokon... Ne ĝis mi venĝos min... Mortigu la _fetoran raton,_ kiu prenis mian vivon... \n\nĜi persekutas ĉi tiun plankon... Disvastigante malpuraĵon ĉien... _Atentu ĝian nubon da fetoro kaj koroda mordo, la acido dissolviĝas en akvo..._
actors.mobs.npcs.ghost.rat_2=Bonvolu... Helpu min... Mortigu la abomenindaĵon...\n\n_Batalu ĝin apud akvo... Evitu la fetoron..._
actors.mobs.npcs.imp.cya=Ĝis revido, %s!
actors.mobs.npcs.imp.desc=Koboldoj estas malpli gravaj demonoj. Ili estas rimarkindaj nek pro sia forto nek pro sia magia talento, sed ili estas sufiĉe inteligentaj kaj sociemaj. Multaj koboldoj preferas vivi inter ne-demonoj.
actors.mobs.npcs.imp.golems_1=En mia kazo, temas pri _golemoj_, kiujn oni devas mortigi. Vidu, mi komencos malgrandan negocon ĉi tie, sed tiuj stultaj golemoj estas malbonaj por komerco! Estas tre malfacile negoci kun vagantaj granitbuloj, diable ili estu! Do bonvolu mortigi... ni diru _4 el ili_ kaj rekompenco estas via.
actors.mobs.npcs.imp.golems_2=Kiel iras via golema safaro? Nur ne forgesu preni tiujn ĵetonojn.
actors.mobs.npcs.imp.hey=Pst, %s!
actors.mobs.npcs.imp.intro=Ĉu vi estas aventuristo? Mi amas aventuristojn! Vi ĉiam povas fidi ilin se io bezonas esti mortigita, ĉu ne? Kontraŭ rekompenco kompreneble ;)
actors.mobs.npcs.imp.monks_1=En mia kazo temas pri _monaĥoj_, kiujn oni devas mortigi. Vidu, mi komencos malgrandan entreprenon ĉi tie, sed tiuj frenezuloj mem nenion aĉetas kaj fortimigos aliajn klientojn. Do bonvolu mortigi... ni diru _5 el ili_ kaj rekompenco estos via.
actors.mobs.npcs.imp.monks_2=Ho, vi ankoraŭ vivas! Mi sciis, ke via kungfuo estos pli forta ;) Nur ne forgesu preni tiujn ĵetonojn.
actors.mobs.npcs.imp.name=ambicia koboldo
actors.mobs.npcs.impshopkeeper.buyback=La koboldo gaje redonas vian objekton.
actors.mobs.npcs.impshopkeeper.desc=La koboldo starigis malgrandan butikon ĉe la limo de la internaj haloj. Plaĉas vidi amikan vizaĝon, sed liaj prezoj certe ne ŝajnas amikaj.
actors.mobs.npcs.impshopkeeper.greetings=Saluton, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Kion vi faris %s? Aĉetu rapide, mi devas foriri de ĉi tie!
actors.mobs.npcs.impshopkeeper.name=ambicia koboldo
actors.mobs.npcs.impshopkeeper.thief=Mi pensis, ke mi povas fidi vin!
actors.mobs.npcs.mirrorimage.desc=Ĉi tiu iluzio tre similas vin, sed estas pli pala kaj iom konvulsias.
actors.mobs.npcs.mirrorimage.discover_hint=Vi povas trovi ĉi tiun rolulon per specifa volvlibro.
actors.mobs.npcs.mirrorimage.name=spegula bildo
actors.mobs.npcs.npc.discover_hint=Vi povas trovi ĉi tiun rolulon en specifa regiono de la kelkarcero.
actors.mobs.npcs.prismaticimage.desc=Ĉi tiu brileta iluzio tre similas al vi, eĉ ŝajnas uzi vian nunan armilon kaj kirason.\n\nPrismaj bildoj provos serĉi kaj altiri atenton de malamikoj, uzante ilian plibonigitan defendon kaj sanon por protekti vin. Kvankam ili ne havas la saman ofensivan potencon kiel spegulaj bildoj, ili havas plibonigitan daŭrivon, inkluzive de ricevado de avantaĝoj de via kiraso.\n\nKiam reduktitaj al 0 vivpoentoj, prismaj bildoj paliĝos dum pluraj vicoj, kaj ankoraŭ povas esti resanigitaj dum ĉi tiu tempo. Kiam neniuj malamikoj ĉeestas, prismaj bildoj paliĝos kaj realiĝos al sia mastro.
actors.mobs.npcs.prismaticimage.discover_hint=Vi povas trovi ĉi tiun rolulon per specifa volvlibro.
actors.mobs.npcs.prismaticimage.name=prisma bildo
actors.mobs.npcs.ratking.confused=Kio... Kie mi estas? Mia regno bezonas min!
actors.mobs.npcs.ratking.crown_after=Ĉu vi ĝuas vian novan kirason? Neniuj kontraŭuloj!
actors.mobs.npcs.ratking.crown_clothes=Surmetu iujn vestojn! Vi tute ne estas en stato por paroli kun reĝfamilianoj!
actors.mobs.npcs.ratking.crown_desc=Ho, ĉu tiu krono estas por mi!? Ĝi aspektas multe pli brila ol la mia, do mi afable akceptas! \n\nFakte, mi pensas, ke mi povas oferti al vi ion kiel rekompencon por ĉi tiu krono. Grandegan potencon konvenan al heroo kiel vi! Ĉu vi ŝatus tion?
actors.mobs.npcs.ratking.crown_fine=Bone! Ĉiuokaze mi ne volis ĝin...
actors.mobs.npcs.ratking.crown_info=Diru al mi pli unue.
actors.mobs.npcs.ratking.crown_no=Mi preferus ne...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, dankon! Nun iru kaj fierigu vian reĝon!
actors.mobs.npcs.ratking.crown_yes=Kompreneble!
actors.mobs.npcs.ratking.desc=Ĉi tiu rato estas iom pli granda ol ordinara marsupia rato. Ĝi portas malgrandan kronon sur la kapo.
actors.mobs.npcs.ratking.desc_birthday=Ĉi tiu rato estas iom pli granda ol ordinara marsupia rato. Ĝi portas malgrandan verdan festan ĉapelon anstataŭ sia kutima krono. Feliĉan naskiĝtagon, Rata Reĝo!
actors.mobs.npcs.ratking.desc_crown=Ĉi tiu rato estas iom pli granda ol ordinara marsupia rato. Ĝi portas kronon de nana reĝo sur la kapo.
actors.mobs.npcs.ratking.desc_winter=Ĉi tiu rato estas iom pli granda ol ordinara marsupia rato. Ĝi portas malgrandan festan ĉapelon anstataŭ sian kutiman kronon. Feliĉajn Festojn!
actors.mobs.npcs.ratking.discover_hint=Vi povas trovi ĉi tiun rolulon ĉe la fino de specifa regiono de la kelkarcero.
actors.mobs.npcs.ratking.name=rata reĝo
actors.mobs.npcs.ratking.not_sleeping=Mi ne dormas!
actors.mobs.npcs.ratking.what_is_it=Kio estas? Mi ne havas tempon por ĉi tiu sensencaĵo. Mia regno ne regos sin mem!
actors.mobs.npcs.sheep.baa!=Be!
actors.mobs.npcs.sheep.baa.=Be.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.baa?=Be?
actors.mobs.npcs.sheep.def_verb=blokita
actors.mobs.npcs.sheep.desc=Jen magia ŝafo. Kio estas tiel magia pri ĝi? Vi ne povas mortigi ĝin. Ĝi staros tie ĝis ĝi magie malaperos, dum ĝi maĉas maĉaĵon kun malplena rigardo.
actors.mobs.npcs.sheep.discover_hint=Vi povas trovi ĉi tiun rolulon per specifa objekto aŭ kaptilo.
actors.mobs.npcs.sheep.name=ŝafo
actors.mobs.npcs.shopkeeper.buyback=La butikisto kontraŭvole redonas vian aĵon.
actors.mobs.npcs.shopkeeper.desc=Ĉi tiu fortika ulo aspektas pli taŭga por komerca distrikto en iu granda urbo ol por kelkarcero. Liaj prezoj klarigas kial li preferas fari negocojn ĉi tie.
actors.mobs.npcs.shopkeeper.flee=La butikisto fuĝas!
actors.mobs.npcs.shopkeeper.name=butikisto
actors.mobs.npcs.shopkeeper.sell=Vendi aĵon
actors.mobs.npcs.shopkeeper.talk=Babilado
actors.mobs.npcs.shopkeeper.talk_ascent=Mi ne scias, kion vi planas fari kun tiu amuleto, sed mi ne volas partopreni en ĝi. Aĉetu ion kaj foriru, ni ambaŭ devas forlasi ĉi tiun lokon!
actors.mobs.npcs.shopkeeper.talk_caves=Elspezu monon, vivu pli longe.\n\nHo, kaj diru saluton al tiu trola forĝisto por mi, se vi vidas lin. Rememorigu al la ulo, ke li ankoraŭ ŝuldas al mi monon pro tiu martelo, kiun mi vendis al li lastan semajnon!
actors.mobs.npcs.shopkeeper.talk_city=Miaj varoj povas teni vin sekura ĉi tie. \n\n...Kaj ne malrapidu, mi petas. Daŭris eterne por konvinki la lokulojn lasi min trankvila, mi ne volas, ke vi altiru problemojn!
actors.mobs.npcs.shopkeeper.talk_halls=Saluton, mi havas specialajn prezojn por demonĉasistoj! \n\nHo, kaj estu singarda tie sube! La demonoj sube ne zorgos pri via kuraĝo. Vi ne povas reveni supren kaj elspezi pli da mono se vi estas mortinta! ;)\n\nĈu la demonoj estas kiel mi? Hehe, tute ne. Mi estas nur malgranda ulo, ne tre batalanto, kaj mi sukcesis konservi mian menson sendifekta. La demonoj sube estas multe pli fortaj estaĵoj, kaj ili ĉiuj estis sklavigitaj de... nu... nur estu singarda tie sube.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nu, saluton, Via Moŝto, aŭ ĉu nun Via Sankteco? Hehe, ĉiuokaze ĉi tio ne estas loko por vi, multaj homoj estus tre afliktitaj se vi finus mortinta. Certe vi havas kelkajn monerojn tamen, kial ne aĉeti ion por helpi malhelpi tion?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Nu, se ĝi ne estas la vojaĝanta heroo! Se vi provas savi alian urbon, tiam bonŝancon, la danĝeroj ĉi tie estas multe pli malbonaj ol tiuj de malgrandaj banditoj. Mi certas, ke vi faros pli bone ol iu ajn alia povus, nur provu ne morti tuj antaŭ mia vendejo.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Vi ŝajnas esti ekster via elemento, fraŭlino. Mallarĝaj kelkarceraj koridoroj ne estas tiel vastaj kiel la grandaj haloj aŭ la arbaroj ĉirkaŭ la urbo, ĉu ne? Hehe, ho, ne atentu mian babiladon, kial ne aĉeti ion?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Mi havas ĉion, kion vi bezonas por sukcesa aventuro!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, mi kredas, ke mi vidis serĉatan afiŝon kun via nomo sur ĝi ie en la urbo. Ĉu ni fuĝas? Ho, vi estas senkulpa, ĉu? Kompreneble, kompreneble... Ne zorgu, mi havas pli bonajn aferojn farendajn ol raporti pri vi, sed eble vi devus aĉeti ion por esti certa?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ĉu vi venis de la ŝtelista gildo por purigi la areon? Ne, nur por butikumado? Nu, mortigu kelkajn monstrojn dum vi estas ĉi tie ĉiuokaze. Ne atendu rabaton ankaŭ, mi pagas bonan protektomonon al vi homoj kaj vi apenaŭ tenas min sekura ĉi tie.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Jen interesa sigelo, kiun vi havas tie, ili kutime estas sendifektaj. Ĉu vi estas malhonorita heroo aŭ io simila? Nu, kion ajn vi faris, tio ne estas mia afero, viaj moneroj ankoraŭ estas bonaj.
actors.mobs.npcs.shopkeeper.thief=Ŝtelisto, ŝtelisto!
actors.mobs.npcs.shopkeeper.warn=Atentu! Mi ne plu avertos vin.
actors.mobs.npcs.vaultlaser.desc=Ĉi tiu gardostaranto pafas laserojn je regulaj intervaloj. _Ĉar ĉi tio estas nur testareo, la laseroj fakte ne damaĝos vin._
actors.mobs.npcs.vaultlaser.name=trezorejo lasera gardostaranto
actors.mobs.npcs.vaultsentry.desc=Ĉi tiu gardostaranto skanas la areon laŭ ŝablono. _Ĉar ĉi tio estas nur testa areo, la gardostaranto faros nenion se ĝi detektos vin._
actors.mobs.npcs.vaultsentry.name=trezorejo-skananta gardostaranto
actors.mobs.npcs.wandmaker.def_verb=blokita
actors.mobs.npcs.wandmaker.desc=Ĉi tiu maljuna sed sana sinjoro portas iom konfuzitan mienon. Lin protektas magia ŝildo.
actors.mobs.npcs.wandmaker.intro_1=Mi venis ĉi tien por trovi maloftan ingrediencon por sorĉbastono, sed mi perdiĝis, kaj mia magia ŝildo malfortiĝas. Mi devos foriri baldaŭ, sed mi ne povas elteni la okazon sen akiri tion, por kio mi venis.
actors.mobs.npcs.wandmaker.intro_2=Se vi povas havigi tion por mi, mi volonte pagos vin per unu el miaj fajne kreitaj sorĉbastonoj! Mi kunportis du, do vi povas preni kiun ajn vi preferas.
actors.mobs.npcs.wandmaker.intro_berry=La maljuna gardisto de ĉi tiu malliberejo posedis _putroberan planton_, kaj mi celas unu el ĝiaj semoj. La planto verŝajne jam sovaĝiĝis, do igi ĝin cedi semon povus esti malfacile. Ĝia ĝardeno devus esti ie ĉi tie. Provu _teni vin for de ĝiaj vinbervipoj_ se vi volas resti sendifekta. Uzi fajron povus esti alloga, sed bonvolu ne fari tion, vi mortigos la planton kaj detruos ĝiajn semojn.
actors.mobs.npcs.wandmaker.intro_cleric=Ho, saluton Via Moŝto! Kia agrabla surprizo renkonti vin en tia deprima loko! Mi malamas trudi, sed mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_duelist=Ho, saluton fraŭlino! Kia agrabla surprizo renkonti heroon en tia deprima loko! Se vi pretas helpi maljunulon, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_dust=Mi serĉas iom da _kadavropolvo_. Ĝi estas speciala speco de malbenita ostpulvoro, kiu kutime aperas en tiaj lokoj. Devus esti barikadita ĉambro ie ĉi tie, mi certas, ke iom da polvo aperos tie. Tamen estu singarda, la malbeno, kiun la polvo portas, estas sufiĉe potenca, _revenu al mi kiel eble plej rapide_ kaj mi purigos ĝin por vi.
actors.mobs.npcs.wandmaker.intro_ember=Mi serĉas iom da _freŝaj ardaĵoj_ de novnaskita fajra elementulo. Elementuloj kutime aperas kiam alvoka rito ne estas kontrolata, do nur trovu kelkajn kandelojn kaj ritolokon kaj mi certas, ke vi povos akiri unu por ekbruligi. Vi tamen volos _eviti enboksi vin_ dum la batalo kontraŭ ĝi, aŭ vi povus _teni ian frostigaĵon prete._ Novnaskitaj Elementuloj estas sufiĉe potencaj kaj kaosaj, sed ili ne povas elteni la malvarmon.
actors.mobs.npcs.wandmaker.intro_huntress=Ho, saluton fraŭlino! Amika vizaĝo estas agrabla surprizo ĉi tie, ĉu ne? Fakte, mi ĵuras, ke mi jam vidis vian vizaĝon antaŭe, sed mi ne povas precize indiki ĝin... Ho, ne gravas, se vi estas ĉi tie por aventuro, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_mage=Ho, saluton %s! Mi aŭdis, ke estis iom da tumulto pri vi kaj la sorĉista instituto? Ho, ne gravas, mi neniam ŝatis tiujn babilaĵojn ĉiuokaze. Se vi bonvolas, mi eble havos taskon por vi.
actors.mobs.npcs.wandmaker.intro_rogue=Ho Dio, vi min konsternis! Mi ankoraŭ ne renkontis banditon el ĉi tiu loko, kiu ankoraŭ havas sian mensan sanon, do vi devas esti de la surfaco! Se vi pretas helpi fremdulon, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.intro_warrior=Ho, saluton! Kia agrabla surprizo renkonti militiston el la nordo en tia deprima loko! Vi certe vojaĝis sufiĉe malproksimen por alveni ĉi tien. Se vi serĉas aventuron, mi eble havas taskon por vi.
actors.mobs.npcs.wandmaker.name=maljuna vergofaristo
actors.mobs.npcs.wandmaker.reminder_berry=Ĉu vi havas bonŝancon kun Rotberry-semo, %s? Serĉu ĉambron plenan de vegetaĵaro.
actors.mobs.npcs.wandmaker.reminder_dust=Ĉu vi havas bonŝancon kun kadavropolvo, %s? Serĉu kelkajn barikadojn.
actors.mobs.npcs.wandmaker.reminder_ember=Ĉu vi havas bonŝancon kun tiuj ardaĵoj, %s? Vi devos trovi kvar kandelojn kaj la ritan lokon.
actors.mobs.phantompiranha.desc=Fantomaj piranjoj estas malofta raso de piranjo kun magiaj kapabloj kaj timigaj travideblaj korpoj. Ili kapablas teletransportiĝi dum atakado, ĉu por eskapi ĉu por rapide alproksimiĝi al sia malamiko!\n\nKvankam ili estas ĝenaj por batali, ilia viando estas aprezata pro siaj magiaj ecoj.
actors.mobs.phantompiranha.name=fantoma piranjo
actors.mobs.phantompiranha.teleport_away=La fantoma piranjo teletransportas for...
actors.mobs.piranha.desc=Ĉi tiuj karnovoraj fiŝoj estas breditaj specife por protekti inunditajn areojn. Ilia mordo estas mortiga, do estas plej bone eviti alfronti ilin rekte.
actors.mobs.piranha.discover_hint=Vi povas trovi ĉi tiun malamikon ie ajn en la kelkarcero.
actors.mobs.piranha.name=giganta piranjo
actors.mobs.pylon.desc_active=Potenca masto, celita helpi reguligi la elektron, kiu funkciigas la maŝinaron en ĉi tiu areo. La masto nuntempe ŝvelas de elektra energio, tio devas esti tio, kio superŝargas DM-300!\n\nEn ĉi tiu stato, mastoj estas vundeblaj, sed arkos elektron al proksimaj ĉeloj laŭ dekstruma padrono. Pro sia peza metala konstruo, mastoj estas rezistemaj al grandaj kvantoj da damaĝo.
actors.mobs.pylon.desc_inactive=Potenca masto, celita helpi reguligi la elektron, kiu funkciigas la maŝinaron en ĉi tiu areo. \n\nLa masto estas nuntempe neaktiva kaj imuna kontraŭ damaĝo.
actors.mobs.pylon.name=potenca pilono
actors.mobs.rat.desc=Marsupiaj ratoj estas agresemaj sed sufiĉe malfortaj loĝantoj de la kloakoj. Ili havas malagrablan mordon, sed estas vivminacaj nur en grandaj nombroj.
actors.mobs.rat.name=marsupia rato
actors.mobs.ripperdemon.desc=Ĉi tiuj teruraj estaĵoj estas la rezulto de la multaj kadavroj de nanoj en ĉi tiu regiono uzataj de demonaj fortoj. Buĉistoj estas malgrasaj fantomaj estaĵoj, kiuj similas al nanoj, sed kun rompitaj korpoj kaj longaj akraj ungegoj faritaj el osto. \n\nBuĉistoj ne estas aparte daŭremaj, sed ili estas facilmovaj kaj danĝeraj. Ili kapablas salti grandajn distancojn por rapide atingi celojn antaŭ ol kornobati ilin per siaj ungegoj.
actors.mobs.ripperdemon.leap=La buĉisto-demono prepariĝas salti!
actors.mobs.ripperdemon.name=buĉisto demono
actors.mobs.rotheart.desc=La frukto de putrobero estas tre unika. Anstataŭ putri kaj provizi nutraĵojn, la frukto kreskas, malmoliĝas kaj ĉirkaŭas la semon. Ĝi provizas protekton por la internaj organoj, kiuj kreskas ene de la frukto. Ĉi tiu giganta globo estas nomata la koro de plenkreska putrobero-planto.
actors.mobs.rotheart.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.rotheart.name=putra koro
actors.mobs.rotlasher.desc=La putrovipanto estas parto de la radika strukturo de matura putroberplanto, kaj ankaŭ ilia ĉefa defendrimedo. Vipantoj estas blindaj kaj pikitaj en la teron, sed furioze atakos ajnan proksiman minacon post momento por detekti ĝin. Kiam ne estas proksimaj malamikoj, ili staras senmovaj, provante miksiĝi kun la ĉirkaŭa vegetaĵaro.
actors.mobs.rotlasher.discover_hint=Vi povas trovi ĉi tiun malamikon dum specifa serĉo.
actors.mobs.rotlasher.name=putrovipanto
actors.mobs.scorpio.desc=Ĉi tiuj grandegaj araneo-similaj demonaj estaĵoj evitas proksiman batalon, preferante pafi kripligajn segildentajn pikilojn de longaj distancoj.
actors.mobs.scorpio.name=skorpio
actors.mobs.senior.desc=Ĉi tiuj monaĥoj estas fanatikuloj, kiuj dediĉis sin al protektado de la sekretoj de sia urbo kontraŭ ĉiuj eksteruloj. Ili uzas nek kirason nek armilojn kaj fidas nur sian lerton en senarma batalo.
actors.mobs.senior.name=altranga monaĥo
actors.mobs.shaman$blueshaman.spell_desc=Ĉi tiu ŝamano portas bluan maskon, kaj uzos magion kiu provizore _pliigas la damaĝon, kiun vi ricevas._
actors.mobs.shaman$purpleshaman.spell_desc=Ĉi tiu ŝamano portas purpuran maskon, kaj uzos magion kiu provizore _reduktas vian precizecon kaj evitadon._
actors.mobs.shaman$redshaman.spell_desc=Ĉi tiu ŝamano portas ruĝan maskon, kaj uzos magion kiu provizore _malfortigas vian atakan potencon._
actors.mobs.shaman.bolt_kill=La magia sago vin mortigis...
actors.mobs.shaman.desc=La plej inteligentaj gnoloj povas lerni ŝamanan magion. Gnolaj ŝamanoj preferas batalajn sorĉojn por kompensi sian mankon de forto. Ili senhezite uzas ilin kontraŭ tiuj, kiuj pridubas ilian rangon en la tribo.
actors.mobs.shaman.name=gnolŝamano
actors.mobs.skeleton.def_verb=blokita
actors.mobs.skeleton.desc=Skeletoj konsistas el la ostoj de malbonŝancaj aventuristoj kaj loĝantoj de la labirinto, vivigitaj de malica magio el la profundo. Post sufiĉa damaĝo ili disfalas en eksplodo de ostoj.
actors.mobs.skeleton.explo_kill=Vin mortigis la eksplodo de ostoj...
actors.mobs.skeleton.name=skeleto
actors.mobs.slime.def_verb=blokita
actors.mobs.slime.desc=Ŝlimaĵoj estas strangaj, iomete magiaj estaĵoj kun kaŭĉukeca ekstera korpo kaj likva kerno. La urbaj kloakoj provizas al ili abundan provizon de akvo kaj nutraĵoj. \n\nPro ilia elasta ekstera membrano, estas malfacile kaŭzi pli ol _6 damaĝon_ al ŝlimaĵoj per iu ajn atako.
actors.mobs.slime.name=ŝlimo
actors.mobs.snake.desc=Ĉi tiuj tro grandaj serpentoj kapablas rapide rampi ĉirkaŭ batoj, kio faras ilin sufiĉe malfacile trafeblaj. Magiaj atakoj aŭ surprizaj atakoj tamen kapablas surprizi ilin.\n\nVi povas fari surprizan atakon atakante dum vi estas ekster la vidkampo de la serpento. Unu maniero estas lasi serpenton ĉasi vin tra pordo kaj poste _frapi tuj post kiam ĝi eniras la pordon_.
actors.mobs.snake.hint=Provu uzi la ekzamenbutonon sur serpento por lerni kiel kontraŭstari ilin.
actors.mobs.snake.name=kloakserpento
actors.mobs.spectralnecromancer.desc=Kvankam skeletoj estas la ĉefa vivo de nekromancisto, iuj preferas esplori aliajn malpli korpajn helpantojn. Spektraj nekromancistoj elektis fantomojn kiel sian preferatan helpanton!\n\nIndividuaj fantomoj ne estas tiel fortaj kiel skeletoj, sed ĉi tiuj nekromancistoj ne timas alvoki multajn el ili!
actors.mobs.spectralnecromancer.name=spektra nekromancisto
actors.mobs.spinner.desc=Ĉi tiuj verdetaj, vilaj kavernaj araneoj evitas rektan batalon. Ili preferas atendi fore, dum la viktimo, kaptita en ilia araneaĵo, malrapide mortas pro la venena mordo.
actors.mobs.spinner.name=kaverna ŝpinilo
actors.mobs.statue.def_verb=blokita
actors.mobs.statue.desc=Oni pensus, ke ĝi estas nur alia el la senvivaj statuoj de ĉi tiu kelkarcero, sed ĝiaj ruĝe brilantaj okuloj perfidas ĝin.
actors.mobs.statue.desc_weapon=Kvankam la statuo mem estas farita el ŝtono, la _%s_, kiun ĝi tenas, aspektas reala.
actors.mobs.statue.discover_hint=Vi povas trovi ĉi tiun malamikon ie ajn en la kelkarcero.
actors.mobs.statue.name=vigla statuo
actors.mobs.succubus.desc=Sukuboj estas demonoj aspektantaj kiel allogaj knabinoj kun iom gotika stilo. Per sia magio sukubo povas ĉarmi heroon, kiu ne povos ataki ion ajn ĝis la ĉarmo finiĝos.
actors.mobs.succubus.name=sukubo
actors.mobs.swarm.desc=La mortiga svarmo da muŝoj zumas kolere. Ĉiu ne-magia atako dividos ĝin en du pli malgrandajn sed same danĝerajn svarmojn.
actors.mobs.swarm.name=svarmo de muŝoj
actors.mobs.tengu$bombability$bombblob.desc=Nubo da supervarmigita fumo ŝveliĝas ĉi tie. Atentu, ĝi eksplodos!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Ĝi estas algluiĝinta al la tero, vi ne povas movi ĝin!
actors.mobs.tengu$bombability$bombitem.desc=Tengu ĵetis strangeaspektantan fumobombon ĉi tien, kiu ŝprucas densan varman fumon. Ĝi faras laŭtan tiktakan bruon, kvazaŭ ĝi nombras malsupren al eksplodo! \n\nLa bombo ankris sin al la tero, do vi ne povas levi ĝin.
actors.mobs.tengu$bombability$bombitem.name=fumobombo
actors.mobs.tengu$fireability$fireblob.desc=Tengu ĵetis fajnan pulvoron, kiu ŝajnas kaptiĝi en vaporon ĉi tien, ĝi tuj ekbrulos!
actors.mobs.tengu$shockerability$shockerblob.desc=Elektra energio kreskas ĉi tie, ĉio staranta sur ĉi tiu kahelo estos ŝokita en la sekva vico!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Ĝi elsendas tro da elektro, vi ne povas kapti ĝin!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu ĵetis ĉi tien kuriozan maŝinon, kiu ŝajnas esti farita el DM-100-partoj. La maŝino konstante arĉas elektron ĉirkaŭ si, sed ŝajnas, ke ĝi iras laŭ antaŭvidebla padrono. \n\nKun la tuta elektro arĉanta ĉirkaŭ ĝi, ne eblas kompreni ĉi tion.
actors.mobs.tengu$shockerability$shockeritem.name=Ŝoko
actors.mobs.tengu.defeated=Fine libera...
actors.mobs.tengu.desc=Tenguoj apartenas al antikva klano de murdistoj, ankaŭ nomata Tengu. Ili famas pro abunda uzo de ŝurikenoj kaj kaptiloj.
actors.mobs.tengu.interesting=Ni faru ĉi tion interesa...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Kaptita, %s!
actors.mobs.tengu.notice_have=Mi havas vin nun, %s!
actors.mobs.tengu.rankings_desc=Asasinite de la Tenguoj
actors.mobs.thief.carries=La ŝtelisto portas _%s. Ŝtelita, evidente.
actors.mobs.thief.desc=Kvankam ĉi tiuj malliberuloj vagas libere el siaj ĉeloj, ĉi tiu loko ankoraŭ estas ilia malliberejo. Kun la tempo, ĉi tiu loko prenis iliajn mensojn kaj ankaŭ ilian liberecon. Antaŭ longe, ĉi tiuj frenezaj ŝtelistoj kaj banditoj forgesis, kiuj ili estas kaj kial ili ŝtelas. \n\n Ĉi tiuj malamikoj pli emas ŝteli kaj forkuri ol batali. Certiĝu, ke vi havas ilin videblaj, alie vi eble neniam plu vidos vian ŝtelitan objekton.
actors.mobs.thief.escapes=La ŝtelisto eskapas senpune kun via %s!
actors.mobs.thief.name=freneza ŝtelisto
actors.mobs.thief.stole=La ŝtelisto ŝtelis %s de vi!
actors.mobs.tormentedspirit.desc=Turmentitaj spiritoj estas alie bonkoraj spiritoj, kiujn trafis malbeno. Dum ili estas malbenitaj, ili atakos same kiel fantomo, kaj estas ankaŭ pli potencaj! \n\nEble eblas purigi la malbenon uzante la ĝustan objekton apud la spirito. Se la malbeno estas levita, la spirito certe estos dankema...
actors.mobs.tormentedspirit.name=turmentita spirito
actors.mobs.tormentedspirit.thank_you=Dankon...
actors.mobs.vaultrat.desc=Ĉi tiu rato havas kelkajn kondutajn ŝanĝojn por testi novan trezorean malamikan AI:\n_-_ Ĝia movado povas esti "aŭdita" tra muroj\n_-_ Ĝi vagados laŭ antaŭdifinita patrolo\n_-_ Dum vagado, ĝia detektodistanco estas akre reduktita malantaŭ la direkto, en kiu ĝi moviĝas.\n_-_ Dum dormado, ĝia detektodistanco ankaŭ estas reduktita\n_-_ Kiam ĝi detektas vin, ĝi "esploros" antaŭ ol ŝanĝi al ĉasado. Esplorantaj malamikoj moviĝas al vi sed ne atakas kaj estas pli facile perdeblaj malantaŭ pordoj kaj anguloj.
actors.mobs.warlock.bolt_kill=La ombrofulgo vin mortigis...
actors.mobs.warlock.desc=Kiam la gnomoj ekinteresiĝis pli pri magio ol pri inĝenierarto, sorĉistoj akiris la regadon de la urbo. Ili komencis per elementa magio, sed baldaŭ transiris al demonologio kaj nekromancio.
actors.mobs.warlock.name=gnoma sorĉisto
actors.mobs.wraith.desc=Fantomo estas venĝema spirito de pekulo, kies tombo aŭ tombo estis ĝenita. Estante etera ento, estas tre malfacile trafi ĝin per ordinara armilo.
actors.mobs.wraith.discover_hint=Vi povas trovi ĉi tiun malamikon ie ajn en la kelkarcero.
actors.mobs.wraith.name=fantomo
actors.mobs.yogdzewa$larva.desc=Ĉi tiuj etaj idoj de Yog-Dzewa estas simplaj helpantoj, kiujn facile produkti. Kvankam individue malfortaj, ili estas alvokataj rapide kaj povas fariĝi superfortaj en grandaj nombroj.
actors.mobs.yogdzewa$larva.name=larvo de dio
actors.mobs.yogdzewa$larva.rankings_desc=Forkonsumita de Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Forkonsumita de Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Forkonsumita de Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Forkonsumita de Yog-Dzewa
actors.mobs.yogdzewa.darkness=La mallumo alproksimiĝas...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa estas Malnova Dio; granda monstraĵo, kiu atingas en mortontajn mondojn kaj formanĝas ilin por instigi sian senfinan kreskon. La dŭarfoj certe altiris la atenton de ĉi tiu kosma hororo ludante kun malhela magio, kaj de tiam provis teni ĝin enhavita. \n\nYog-Dzewa originas el dimensio de kruda magia kaoso, kaj ne povas alporti sian veran formon en ĉi tiun mondon. Anstataŭe, ĝi kreis avatarojn kaj alvokis demonajn helpantojn por plenumi sian volon ĉi tie. \n\nĈi tiu giganta okulo estas la fokuso de la potenco de Yog-Dzewa en ĉi tiu mondo. Kvankam la okulo mem estas senmova, ĝi kapablas pafi potencajn radiojn de demona magio kaj alvoki diversajn helpantojn por helpi ĝin.
actors.mobs.yogdzewa.desc_spawners=Vi povas senti ondojn de demona energio radiantajn al la okulo de la etaĝoj supre. Io, kion vi lasis vivanta tie supre, certe enkanaligas potencon reen en Yog-Dzewa. _Yog uzos ĉi tiun energion por alvoki pli potencajn helpantojn!_
actors.mobs.yogdzewa.hope=VIA. ESPERO. ESTAS. ILUZIO!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=MI. VIDAS. VIN.
actors.mobs.yogdzewa.rankings_desc=Forkonsumita de Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Ĉi tiu pugno estas formita el pura lumenergio. Ĝi kapablas pafi potencajn radiojn de bruliga lumo ĉiun vicon! Ĉi tiuj radioj provizore blindigos vin krom kaŭzi pezan damaĝon. La pugno ankaŭ kapablas nelonge engluti la arenon per blindiga lumo por eskapi! \n\nLa pugno tamen ne havas specialajn kapablojn, kiujn ĝi povas uzi en proksimbatala distanco.
actors.mobs.yogfist$brightfist.name=brila pugno
actors.mobs.yogfist$brightfist.teleport=La pugno teletransportiĝas for en ekbrilo de lumo, kiu serioze blindigas vin!
actors.mobs.yogfist$burningfist.desc=Grandega pugno ĉirkaŭita de fajro. Ĝiaj fingroj kraketas dum ili fermiĝas, disĵetante braĝojn sur la plankon.
actors.mobs.yogfist$burningfist.name=brulanta pugno
actors.mobs.yogfist$darkfist.desc=Ĉi tiu pugno estas formita el pura malhela energio. Ĝi kapablas pafi potencajn eksplodojn de malhela magio ĉiufoje! Ĉi tiuj eksplodoj malfortigos vian lumfonton krom kaŭzi pezan damaĝon. La pugno ankaŭ kapablas nelonge engluti la arenon en mallumo por eskapi! \n\nLa pugno tamen ne havas specialajn kapablojn, kiujn ĝi povas uzi en proksimbatala distanco.
actors.mobs.yogfist$darkfist.name=malhela pugno
actors.mobs.yogfist$darkfist.teleport=La pugno teletransportiĝas for en eksplodo de mallumo kiu estingas vian lumfonton!
actors.mobs.yogfist$rottingfist.desc=Grandega pugno el putranta karno. Malbonodora ŝlimo elfluas inter ĝiaj fingroj kaj makulas la ŝtonon sub ĝi.
actors.mobs.yogfist$rottingfist.name=putranta pugno
actors.mobs.yogfist$rustedfist.desc=Ĉi tiu pugno estas formita el vivanta metalo. Ĝi estas tura maso de ŝanĝiĝanta metalo, kiu havas potencajn manbatalajn atakojn kaj povas kripligi siajn celojn je distanco. Pro sia grandega maso, la pugno ricevos ajnan damaĝon kaŭzitan al ĝi laŭlonge de la tempo, anstataŭ tuj. \n\nLa pugno tamen estas nefleksebla kaj ne povas moviĝi en mallarĝajn pasejojn. Krome, kvankam ĝi povas ricevi damaĝon malrapide, la prokrastita damaĝo daŭre pliiĝos se la pugno estas trafita plurfoje.
actors.mobs.yogfist$rustedfist.name=rusta pugno
actors.mobs.yogfist$soiledfist.desc=Ĉi tiu pugno formiĝas el kaosa tera magio. Dum ĝi moviĝas, ĝi konstante igas vegetaĵaron ĝermi ĉirkaŭ ĝi. Ĝi ankaŭ povas pafi koncentritajn terajn eksplodojn, kiuj kaptos ĝian celon en rapide kreskantaj vitoj kaj radikoj!\n\nLa pugno derivas potencon de ĉi tiu plantvivo, kaj rezistos damaĝon bazitan sur la kvanto de alta aŭ sulkiĝinta vegetaĵaro proksime de ĝi!
actors.mobs.yogfist$soiledfist.name=malpura pugno
actors.mobs.yogfist.desc=Ĉi tiu pugno estas aspekto de la povo de Yog-Dzewa. Pugnoj estas ligitaj al la povo de Yog-Dzewa, kaj estos protektitaj kontraŭ ĉia damaĝo kiam ili estas proksime al la okulo.
actors.mobs.yogfist.invuln_warn=La pugno estas nevundebla dum ĝi estas proksime al la okulo!
actors.mobs.yogfist.rankings_desc=Forkonsumita de Yog-Dzewa
