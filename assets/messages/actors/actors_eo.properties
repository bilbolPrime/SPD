actors.hero.talent.enlightening_meal.desc=_+1:_ Manĝi manĝaĵon prenas la Klerikon 1 vicon kaj donas al ili _0.67 ŝargojn_ sur ilia sankta volumo.\n\n_+2:_ Manĝi manĝaĵon prenas la Klerikon 1 vicon kaj donas al ili _1 ŝargon_ sur ilia sankta volumo.
actors.hero.talent.enlightening_meal.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe donos 2 vicojn da reŝargado de sorĉbastono kaj artefakto je +1, aŭ 3 vicojn je +2. Ĉi tio ne uzeblas por lasi la kornon de abundo reŝargi sin.
