actors.mobs.elemental.desc=Vagantaj fajraj elementuloj estas kromprodukto de alvokado de pli potencaj estaĵoj. Ili estas tiel ĥaosaj, ke eĉ la plej potenca demonologo ne povas regi ilin.
actors.mobs.elemental.name=fajra elementulo
actors.mobs.king.desc=La lasta reĝo de la gnomoj estis fama pro sia profunda kompreno de vivo kaj morto. Li konvinkis siajn korteganojn partopreni riton, kiu devis doni al ili eternan junecon. Fine nur li ricevis ĝin — kaj armeon de malmortuloj krome.
actors.mobs.king.name=reĝo de la gnomoj
actors.mobs.npcs.bee.desc=Malgraŭ sia malgranda grandeco, oraj abeloj furioze defendas sian mastron. Tamen ili ne vivas longe.
actors.mobs.npcs.bee.name=ora abelo
actors.mobs.shielded.desc=Brutuloj estas la plej grandaj, fortaj kaj harditaj el ĉiuj gnoloj. Grave vunditaj, ili furioziĝas kaj kaŭzas eĉ pli da damaĝo al siaj malamikoj.
actors.mobs.shielded.name=Ŝirmita Brutulo
actors.mobs.yog.desc=Yog-Dzewa estas Malnova Dio, potenca ento el la regnoj de kaoso. Antaŭ jarcento, la antikvaj dŭarfoj apenaŭ venkis en la milito kontraŭ ĝia armeo de demonoj, sed ne kapablis mortigi la dion mem. Anstataŭe, ili malliberigis ĝin en la haloj sub sia urbo, kredante, ke ĝi estas tro malforta por iam ajn releviĝi.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s portas _%s_. Ŝtelita evidente.
actors.buffs.armorevasion.name=Pli bona evitado
actors.mobs.king.defeated=Vi ne povas mortigi min, %s... Mi estas... senmorta...
