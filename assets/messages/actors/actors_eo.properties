actors.hero.talent.elemental_reach.desc=_+1:_ La atingodistanco de elementa atako pligrandiĝas al _5 kaheloj_ de 4, kaj ĝia larĝo pligrandiĝas al _75 gradoj_ de 65.\n\n_+2:_ La atingodistanco de elementa atako pligrandiĝas al _6 kaheloj_ de 4, kaj ĝia larĝo pligrandiĝas al _85 gradoj_ de 65.\n\n_+3:_ La atingodistanco de elementa atako pligrandiĝas al _7 kaheloj_ de 4, kaj ĝia larĝo pligrandiĝas al _95 gradoj_ de 65.\n\n_+4:_ La atingodistanco de elementa atako pligrandiĝas al _8 kaheloj_ de 4, kaj ĝia larĝo pligrandiĝas al _105 gradoj_ de 65.
actors.hero.talent.elemental_reach.title=elementa atingo
actors.hero.talent.elimination_match.desc=_+1:_ Se la Duelanto denove defias ene de 3 vicoj post duelfino, tiu defio havas _16% reduktitan_ ŝargkoston.\n\n_+2:_ Se la Duelanto denove defias ene de 3 vicoj post duelfino, tiu defio havas _30% reduktitan_ ŝargkoston.\n\n_+3:_ Se la Duelanto denove defias ene de 3 vicoj post duelfino, tiu defio havas _40% reduktitan_ ŝargkoston.\n\n_+4:_ Se la Duelanto denove defias ene de 3 vicoj post duelfino, tiu defio havas _50% reduktitan_ ŝargkoston.
actors.hero.talent.elimination_match.title=elimina matĉo
actors.hero.talent.empowered_strike.desc=_+1:_ La unua proksimbatala atako de la Batalmagiisto per lia bastono post teletransporto kaŭzas _+16% damaĝon_ kaj la kromefiko de la bastono ricevas _+50% potencon_.\n\n_+2:_ La unua proksimbatala atako de la Batalmagiisto per lia bastono post teletransporto kaŭzas _+33% damaĝon_ kaj la kromefiko de la bastono ricevas _+100% potencon_.\n\n_+3:_ La unua proksimbatala atako de la Batalmagiisto per lia bastono post teletransporto kaŭzas _+50% damaĝon_ kaj la kromefiko de la bastono ricevas _+150% potencon_.
actors.hero.talent.empowered_strike.title=povigita striko
actors.hero.talent.empowering_meal.desc=_+1:_ Manĝado de manĝaĵo donas al la Magiisto _2 kromdamaĝon_ dum la sekvaj 3 fojoj kiam li kaŭzas damaĝon per sorĉbastono.\n\n_+2:_ Manĝado de manĝaĵo donas al la Magiisto _3 kromdamaĝon_ dum la sekvaj 3 fojoj kiam li kaŭzas damaĝon per sorĉbastono.
