actors.hero.talent.enraged_catalyst.desc=_+1:_ Sorĉoj kaj malbenoj sur la armilo de la Berserkero ekfunkcias pli ofte ju pli da kolero li havas, ĝis maksimume _15% pli ofte_ je 100% kolero.\n\n_+2:_ Sorĉoj kaj malbenoj sur la armilo de la Berserkero ekfunkcias pli ofte ju pli da kolero li havas, ĝis maksimume _30% pli ofte_ je 100% kolero.\n\n_+3:_ Sorĉoj kaj malbenoj sur la armilo de la Berserkero ekfunkcias pli ofte ju pli da kolero li havas, ĝis maksimume _45% pli ofte_ je 100% kolero.
