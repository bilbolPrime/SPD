actors.blobs.regrowth.name=rekresko
actors.blobs.sacrificialfire.desc=Estas altaro ĉi tie kun oferfajro brulanta supre. Ĉiu estaĵo, kiu estas mortigita ĉi tie, estos konsumita kiel ofero al la spiritoj de la kelkarcero. \n\nEble rekompenco estos donita se sufiĉe da oferoj estos faritaj?
actors.blobs.sacrificialfire.name=oferfajro
actors.blobs.sacrificialfire.reward=La fajro ekflamas kaj poste disipas, lasante rekompencon!
actors.blobs.sacrificialfire.unworthy=La fajro formanĝas vian oferon, sed ne ŝanĝiĝas.
actors.blobs.sacrificialfire.worthy=La fajro konsumas vian oferon kaj fariĝas pli forta.
actors.blobs.smokescreen.desc=Nubo da densa nigra fumo kirliĝas ĉi tie.
actors.blobs.smokescreen.name=fumnebulo
actors.blobs.stenchgas.desc=Nubo de malbonodora fetoro kirliĝas ĉi tie.
actors.blobs.stenchgas.name=fetora gaso
actors.blobs.stormcloud.desc=Nubo da ŝvelanta akva vaporo kirliĝas ĉi tie.
actors.blobs.stormcloud.name=ŝtormnuboj
actors.blobs.toxicgas.desc=Verdeta nubo de toksa gaso kirliĝas ĉi tie.
actors.blobs.toxicgas.name=toksa gaso
actors.blobs.toxicgas.ondeath=Vi mortis pro la toksa gaso...
actors.blobs.toxicgas.rankings_desc=Sufokita
actors.blobs.waterofawareness.desc=La povo de scio radias el la akvo de ĉi tiu puto. Trinkado el la puto plene identigos ĉiujn ekipitajn objektojn, identigos malbenojn sur ĉiuj objektoj en via inventaro, kaj malkaŝos ĉiujn objektojn sur la nuna etaĝo.
actors.blobs.waterofawareness.name=akvo de konscio
actors.blobs.waterofawareness.procced=Dum vi trinketas, vi sentas scion verŝi en vian menson.
actors.blobs.waterofhealth.desc=Sanpovo radias el la akvo de ĉi tiu puto. Trinkado el ĉi tiu puto resanigos viajn vundojn, kontentigos malsaton, kaj purigos malbenojn de iuj ajn eluzitaj objektoj.
actors.blobs.waterofhealth.name=akvo de sano
actors.blobs.waterofhealth.procced=Dum vi trinketas, vi sentas, ke viaj vundoj tute resaniĝas.
actors.blobs.web.desc=Densa reto kovras ĉion ĉi tie. Ĉio, kio tuŝas aŭ estas ĵetita tra la reto, rompos ĝin, sed ankaŭ restos fiksita en la loko.
actors.blobs.web.name=araneaĵo
actors.buffs.adrenaline.desc=Ondo da fizika potenco, adrenalino plibonigis kaj atakan kaj movadrapidecon.\n\nAdrenalino permesas al ĝia celo kuri je 2-obla rapideco kaj ataki je 1,5-obla rapideco.\n\nRestantaj turnoj: %s.
actors.buffs.adrenaline.name=adrenalino
actors.buffs.adrenalinesurge.desc=Ondo de granda povo, sed bedaŭrinde ne daŭra.\n\nForto-akcelo: +%d.\nTurnas ĝis akcelo malfortiĝas: %s.
actors.buffs.adrenalinesurge.name=forto-akcelo
actors.buffs.amok.desc=Amok kaŭzas staton de granda kolero kaj konfuzo en sia celo.\n\nKiam estaĵo estas fumita, ĝi atakos ĉion proksime al ĝi, ĉu amiko aŭ malamiko.\n\nRestantaj turnoj de amoko: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Maldika ŝildo ĉirkaŭas vin, blokante iom da damaĝo de magiaj atakoj.\n\nVia magia kiraso estas nuntempe plifortigita je: 0-%d.\n\nTurnas ĝis arkana kiraso malfortiĝas: %s.
actors.buffs.arcanearmor.name=arkana kiraso
actors.buffs.artifactrecharge.desc=Energio trafluas vin, pliigante la rapidecon, kiun viaj ekipitaj artefaktoj ŝargas.\n\nĈiu artefakto estas influata iom malsame, sed ili ĉiuj ŝargiĝos multe pli rapide ol normale.\n\nRestantaj turnoj: %s.
actors.buffs.artifactrecharge.name=reŝargado de artefaktoj
actors.buffs.ascensionchallenge.almost=Vi sentas la teno de Yog sur la amuleto komenci malfortiĝi, vi preskaŭ estas tie!
actors.buffs.ascensionchallenge.beckon=La amuleto komencas voki malproksimajn malamikojn.
actors.buffs.ascensionchallenge.break=Vi prenas momenton por repreni vian spiron kaj sentas viajn vundojn komenci fermiĝi!
actors.buffs.ascensionchallenge.damage=La amuleto komencas radii malhelan energion. Ĝi brulas!
actors.buffs.ascensionchallenge.desc=Iel Yog-Dzewa konservas influon sur ĉi tiu mondo per la amuleto, kaj provas haltigi vian supreniron! \n\nLa povo de Yog igas la kelkarceron multe pli danĝera, pliigante la nombron da malamikoj kaj plifortigante ilin! Ĉi tiu povo daŭre kreskos se ne kontrolita, ĝi povas esti malfortigita per venkado de malamikoj, kiujn plifortigis la povo de Yog.
actors.buffs.ascensionchallenge.desc_beckon=La amuleto nuntempe _vokas malproksimajn malamikojn,_ avertante ilin pri via pozicio.
actors.buffs.ascensionchallenge.desc_clear=La malhela energio radianta el la amuleto estas nun kiel eble plej malfortigita.
actors.buffs.ascensionchallenge.desc_damage=La energio de la amuleto fariĝis tiel forta, ke ĝi _rekte damaĝas vin!_
actors.buffs.ascensionchallenge.desc_haste=La amuleto nuntempe _rapidigas malproksimajn malamikojn,_ permesante al ili atingi vin pli rapide!
actors.buffs.ascensionchallenge.desc_slow=La amuleto nuntempe _malrapidigas vin,_ kaj nuligas la efikojn de rapido-akcelo!
actors.buffs.ascensionchallenge.haste=La amuleto komencas rapidigi malproksimajn malamikojn!
actors.buffs.ascensionchallenge.name=malbeno de amuleto
actors.buffs.ascensionchallenge.on_kill=La malhela energio konsumas vin...
actors.buffs.ascensionchallenge.slow=La amuleto komencas sentiĝi kiel plumba pezo en via inventaro!
actors.buffs.ascensionchallenge.weaken=Vi povas senti la malbenon de la amuleto iomete malfortiĝi.
actors.buffs.ascensionchallenge.weaken_info=La malbeno de la amuleto povas esti malfortigita per venkado de pli da malamikoj.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Se vi venkos malamikojn, la malbeno de la amuleto malfortiĝos!
actors.buffs.barkskin.desc=Via haŭto estas malmoliĝinta, ĝi sentiĝas malglata kaj solida kiel ŝelo.\n\nLa malmoliĝinta haŭto pliigas vian efikan kirason, permesante al vi pli bone defendi vin kontraŭ fizika atako.\n\nVia kiraso nuntempe pliiĝas je: 0-%d.\nTurnas ĝis ŝelhaŭto malfortiĝas: %s.\n\nSe vi ricevas ŝelhaŭton de pluraj fontoj, nur la plej forta aplikiĝos.
actors.buffs.barkskin.name=ŝelhaŭto
actors.buffs.barrier.desc=Daŭra veziko de forto, kiu blokas ĉian damaĝon.\n\nLa bariero ricevos damaĝon pro tio, kion ĝi protektas, kondiĉe ke restas ŝirmado. La ŝirmado ankaŭ malrapide kadukiĝos laŭlonge de la tempo.\n\nRestanta ŝirmado: %d.
actors.buffs.barrier.name=bariero
actors.buffs.berserk.action_name=Berserko
actors.buffs.berserk.angered=kolerigita
actors.buffs.berserk.angered_desc=La severeco de la vundoj de la Berserkero plifortigas liajn batojn. Dum la berserkero ricevas fizikan damaĝon, lia kolero kreskos, donante al li bonusan damaĝon. Difekto blokita per kiraso ankoraŭ kalkuliĝas por konstrui koleron.\n\nKolerego malfortiĝos laŭlonge de la tempo. Ju pli malalta estas la sano de la berserkero, des pli longe ĝi daŭros.\n\nJe 100%% kolero, la Berserkero povas freneziĝi, donante al li ŝirmadon bazitan sur la nivelo de lia kiraso kaj lia mankanta sano. Dum berserkado, lia ŝirmado malfortiĝas laŭlonge de la tempo, kaj post kiam ĝi elĉerpiĝas, li devos ripozi antaŭ ol reakiri koleron.\n\nAktuala Kolerego: _%1$.0f%%_\n_+%2$.0f%%_ damaĝo\n\nBerserka ŝildo ĉe la nuna kiraso kaj vivpoentoj: _%3$d_
actors.buffs.berserk.berserk=berserkado
actors.buffs.berserk.berserk_desc=Timo kaj necerteco malaperas, lasante nur koleron. En ĉi tiu stato la Berserkero estas ekstreme potenca, _kaŭzante +50%% damaĝon kaj gajnante bonusan ŝirmadon,_ sed ankaŭ perdante ŝirmadon ĉiun vicon.\n\nKiam lia tuta ŝirmado estas reduktita al 0, berserkado finiĝos.\n\nPost furiozado, la Berserkero devos resaniĝi antaŭ ol povi denove konstrui koleron.\n\nŜildo Restanta: %d
actors.buffs.berserk.exhausted=elĉerpita
actors.buffs.berserk.no_seal=Vi bezonas vian rompitan sigelon por freneziĝi!
actors.buffs.berserk.rankings_desc=Berserkita al Morto
actors.buffs.berserk.recovering=resaniĝante
actors.buffs.berserk.recovering_desc=Interna forto havas siajn limojn. La Berserkero devas ripozi antaŭ ol reuzi sian koleron. \n\nDum resaniĝo, la Berserkero ne konstruas koleron pro ricevado de damaĝo.
actors.buffs.berserk.recovering_desc_levels=Niveloj ĝis resaniĝo: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Turniĝas ĝis resaniĝo: _%d_
actors.buffs.bleeding.desc=Tiu vundo likas maltrankviligan kvanton da sango.\n\nSangado kaŭzas damaĝon ĉiun vicon. Ĉiun vicon la damaĝo malpliiĝas je hazarda kvanto, ĝis la sangado fine ĉesas.\n\nAktuala sangada damaĝo: %d.
actors.buffs.bleeding.heromsg=Vi sangas!
actors.buffs.bleeding.name=sangado
actors.buffs.bleeding.ondeath=Vi mortsangis...
actors.buffs.bleeding.rankings_desc=Mortsangis
actors.buffs.bless.desc=Granda eksplodo de fokuso, iuj diras, ke ĝi estas inspirita de la dioj.\n\nBeno pliigas precizecon kaj evitadon je 25%%, igante la benaton multe pli efika en batalo.\n\nRestantaj vicoj de beno: %s.
actors.buffs.bless.name=benita
actors.buffs.blindness.desc=Blindigado igas la ĉirkaŭan mondon malhela nebulo.\n\nDum blindigita, la vidkampo de rolulo reduktiĝas al unu kahelo, igante distancajn atakojn senutilaj kaj faciligante perdi spuron de malproksimaj malamikoj. Krome, blindigita heroo ne kapablas legi volvlibrojn aŭ librojn.\n\nRestantaj blindecperiodoj: %s.
actors.buffs.blindness.heromsg=Vi estas blindigita!
actors.buffs.blindness.name=blindigita
actors.buffs.blobimmunity.desc=Iu stranga forto enfermas vin per maldika protekta bariero, blokante ĉiujn malutilajn aerajn efikojn. ZXQPH1 ZXQZXQPH2 ZXQ Vi estas imuna kontraŭ ĉiuj are-ligitaj efikoj dum ĉi tiu bariero daŭras. ZXQPH3 ZXQZXQPH4 ZXQRestantaj vicoj de imuneco: ZXQPH0 ZXQ.
actors.buffs.blobimmunity.name=puriga bariero
actors.buffs.burning.burnsup=%s brulas!
actors.buffs.burning.desc=Malmultaj aferoj estas pli afliktaj ol esti englutita de flamoj.\n\nFajro kaŭzos damaĝon ĉiun vicon ĝis ĝi estas estingita de akvo aŭ ĝi mortas. Fajro povas esti estingita per paŝado en akvon, aŭ per la ŝprucero de frakasanta pocio.\n\nPlie, la fajro povas ekbruligi flamiĝeman terenon aŭ objektojn, kun kiuj ĝi kontaktas.\n\nRestantaj brulvicoj: %s.
actors.buffs.burning.heromsg=Vi ekbrulas!
actors.buffs.burning.name=brulanta
actors.buffs.burning.ondeath=Vi brulmortis...
actors.buffs.burning.rankings_desc=Bruligita al Cindro
actors.buffs.championenemy$antimagic.desc=Kontraŭmagiaj ĉampionoj ricevas 50% malpli da damaĝo kaj estas tute imunaj kontraŭ magiaj efikoj.
actors.buffs.championenemy$antimagic.name=kontraŭmagia ĉampiono
actors.buffs.championenemy$blazing.desc=Flamantaj ĉampionoj kaŭzas 25% pli da proksimbatala damaĝo, ekbruligas malamikojn, kiujn ili atakas, estas imunaj kontraŭ fajro, kaj disvastigas fajron ĉirkaŭ si dum ili mortas. Ili tamen ne povas disvastigi fajron sur akvon.
actors.buffs.championenemy$blazing.name=flama ĉampiono
actors.buffs.championenemy$blessed.desc=Benitaj ĉampionoj havas kvaroblan precizecon kaj evitadon.
actors.buffs.championenemy$blessed.name=benita ĉampiono
actors.buffs.championenemy$giant.desc=Gigantaj ĉampionoj ricevas 80% malpli da damaĝo kaj havas +1 atakdistancon, sed ne povas moviĝi tra fermitaj spacoj.
actors.buffs.championenemy$giant.name=giganta ĉampiono
actors.buffs.championenemy$growing.desc=Kreskantaj ĉampionoj gajnas konstante kreskantan bonuson al precizeco, evitado, fizika damaĝo, kaj redukton de ricevita damaĝo.\n\nAktuala akcelo/evakuado/damaĝo-plifortigo: %1$d%%\nAktuala damaĝredukto: %2$d%%
actors.buffs.championenemy$growing.name=kreskanta ĉampiono
actors.buffs.championenemy$projecting.desc=Projekciantaj ĉampionoj kaŭzas 25% pli da proksimbatala damaĝo kaj havas +3 atakdistancon.
actors.buffs.championenemy$projecting.name=projekcianta ĉampiono
actors.buffs.championenemy.warn=Vi sentas mortigan ĉeeston.
actors.buffs.charm.cant_attack=Vi estas ĉarmita de tiu malamiko kaj ne povas ataki ilin.
actors.buffs.charm.desc=Ĉarmo estas manipula magio, kiu povas igi malamikojn provizore adori unu la alian.\n\nRoluloj influitaj de ĉarmo ne povas rekte ataki la malamikon, kiu sorĉas ilin. Tamen, ataki aliajn celojn ankoraŭ eblas. La ŝoko de doloro malpliigos la daŭron de la ĉarmo.\n\nRestantaj vicoj de ĉarmo: %s.
actors.buffs.charm.heromsg=Vi estas ĉarmita!
actors.buffs.charm.name=ĉarmita
actors.buffs.chill.desc=Ne tute frostigita, sed ankoraŭ multe tro malvarma.\n\nMalvarmigitaj celoj plenumas ĉiujn agojn pli malrapide, depende de kiom da vicoj restas en la efiko. Plej malbone, tio egalas al malrapidiĝo.\n\nVicoj de malvarmigo restantaj: %1$s.\nRapido estas reduktita je: %2$s%%
actors.buffs.chill.freezes=%s frostiĝas!
actors.buffs.chill.name=malvarmigita
actors.buffs.combo$combomove.clobber.desc=Repuŝas malamikon je 2 kaheloj, sed ne kaŭzas damaĝon kaj ne povas faligi en fosaĵojn. Pliigas la kombinaĵon je 1.
actors.buffs.combo$combomove.clobber.empower_desc=Repuŝas malamikon _3 kahelojn, kaŭzas vertiĝon, kaj povas frapi en fosaĵojn,_ sed ne kaŭzas damaĝon. Pliigas la kombinaĵon je 1.
actors.buffs.combo$combomove.clobber.name=batanto
actors.buffs.combo$combomove.crush.desc=Kaŭzas %d%% (kombinaĵo*25%%) damaĝon al la ĉefa celo, kaj duonon de tiu damaĝo al ĉiuj aliaj malamikoj en 7x7 areo-de-atako. Rekomencigas la kombinaĵon kiam uzata.
actors.buffs.combo$combomove.crush.empower_desc=_Saltas ĝis %1$d kahelo(j)_ kaj kaŭzas %2$d%% (kombinaĵo*25%%) damaĝon al la ĉefa celo, kaj duonon de tiu damaĝo al ĉiuj aliaj malamikoj en 7x7 areo-de-atako. Rekomencigas la kombinaĵon kiam uzata.
actors.buffs.combo$combomove.crush.name=plaŭdo
actors.buffs.combo$combomove.fury.desc=Trafas malamikon unufoje por ĉiu kombinaĵo, kiun vi havas, ĉiu trafo kaŭzas 60% damaĝon kaj povas ekigi sorĉojn. Rekomencigas kombinaĵon kiam uzata.
actors.buffs.combo$combomove.fury.empower_desc=_Saltas ĝis %d kahelo(j)_ kaj trafas malamikon unufoje por ĉiu kombinaĵo, kiun vi havas, ĉiu trafo kaŭzas 60%% damaĝon kaj povas ekigi sorĉojn. Rekomencigas la kombinaĵon kiam uzata.
actors.buffs.combo$combomove.fury.name=kolero
actors.buffs.combo$combomove.parry.desc=Blokas la sekvan atakon ene de 1 vico kiam aktivigite, kaj tuj rebatas ĝin. Rekomencigas la kombon se nenio estas deturnita.
actors.buffs.combo$combomove.parry.empower_desc=Blokas _ĉiujn atakojn_ ene de 1 vico kiam aktivigite, kaj tuj rebatas ilin. Rekomencigas la kombon se nenio estas deturnita.
actors.buffs.combo$combomove.parry.name=parado
actors.buffs.combo$combomove.slam.desc=Kaŭzas %d%% (kombinaĵo*20%%) de via damaĝo-bloka povo kiel kromdamaĝon. Rekomencigas la kombinaĵon kiam uzata.
actors.buffs.combo$combomove.slam.empower_desc=_Saltas ĝis %1$d kahelo(j)_ kaj kaŭzas %2$d%% (kombinaĵo*20%%) de via damaĝo-bloka povo kiel kromdamaĝon. Rekomencigas la kombinaĵon kiam uzata.
actors.buffs.combo$combomove.slam.name=ŝlemo
actors.buffs.combo.action_name=kombinita atako
actors.buffs.combo.bad_target=Vi devas celi malamikon en atakdistanco.
actors.buffs.combo.combo=%d trafa kombinaĵo!
actors.buffs.combo.desc=La gladiatoro kreskigas impeton dum li sukcesas bati. Ĉiu atako pliigas la kombo-kalkulilon je unu, sed tro longa tempo inter batoj restarigos la kombo-kalkulilon al 0. Dum la gladiatoro havas kombon, ajna ŝirmado, kiun li havas de lia rompita sigelo, ne komencos paliĝi.\n\nKonstruado de komboj malŝlosas specialajn kombo-atakojn, kiuj ne povas maltrafi! Malsama atako estas malŝlosita je 2, 4, 6, 8 kaj 10 kombo-kalkuloj. Iuj movoj restarigas la kombon kaj aliaj ne, sed ĉiu movo povas esti uzata nur unufoje por kombo-sesio.\n\nAktuala kombo: %1$d.\n\nTurnas ĝis la kombo perdiĝas: %2$s.
actors.buffs.combo.name=kombinaĵo
actors.buffs.combo.prompt=Elektu celon por ataki.
actors.buffs.corrosion.desc=Potenca acido fandas karnon, metalon kaj oston je alarma rapideco.\n\nKoroda damaĝo pliiĝas laŭlonge de la tempo, dum la celo daŭre degelas.\n\nRestantaj korodaj turnoj: %1$s.\nAktuala koroda damaĝo: %2$d.
actors.buffs.corrosion.heromsg=Vi fandiĝas!
actors.buffs.corrosion.name=korodo
actors.buffs.corrosion.ondeath=Vi degelas...
actors.buffs.corrosion.rankings_desc=Dissolvita
actors.buffs.corruption.desc=Korupto eniras la esencon de estaĵo, tordante ĝin kontraŭ ĝian antaŭan naturon.\n\nKoruptitaj estaĵoj atakos siajn aliancanojn kaj ignoros siajn iamajn malamikojn. Korupto ankaŭ estas damaĝa kaj malrapide kaŭzos la venkiĝon de ĝia celo.\n\nKorupto estas permanenta, ĝiaj efikoj finiĝas nur per morto.
actors.buffs.corruption.name=koruptita
actors.buffs.cripple.desc=Vi estas sufiĉe certa, ke kruroj ne estas destinitaj fleksiĝi tiel.\n\nKlapa moviĝrapido duoniĝas, kio faras, ke movi kahelon kutime bezonas du vicojn anstataŭ unu.\n\nVincoj de la kriplulo restantaj: %s.
actors.buffs.cripple.heromsg=Vi estas kripla!
actors.buffs.cripple.name=kripla
actors.buffs.daze.desc=Zumantaj oreloj kaj malklara vidado malfaciligas bataladon.\n\nDum konfuzite, precizeco kaj evito reduktiĝas je 50%%, kio faras kaj surteriĝon kaj eviton de batoj multe pli malfacilaj.\n\nRestantaj vicoj de konfuziteco: %s.
actors.buffs.daze.heromsg=Vi estas konfuzita!
actors.buffs.daze.name=konfuzita
actors.buffs.degrade.desc=Potenca malhela magio elĉerpas la forton, kiun volvlibroj de plibonigo aplikis al via ekipaĵo!\n\nDum degradita, ĝisdatigita ekipaĵo estos traktata kvazaŭ ĝi estus pli malalta nivelo ol ĝi efektive estas. _Ĉiu plibonigo post +3 fariĝas eksponente pli malforta ol la antaŭa._ La priskriboj de viaj objektoj ŝanĝiĝos por reflekti ilian reduktitan potencnivelon.\n\nDegradiĝo ne influas fortpostulojn, sorĉbastonajn ŝargojn, daŭrivon de ĵetarmiloj aŭ artefaktojn.\n\nRestantaj vicoj de degradiĝo: %s. Uzi volvlibron de plibonigo aŭ forigi malbenon tuj finos la degradiĝon.
actors.buffs.degrade.heromsg=Via ekipaĵo ŝajnas pli malforta!
actors.buffs.degrade.name=degradita
actors.buffs.doom.desc=Estas malfacile daŭrigi kiam ŝajnas, ke la universo volas vin morti.\n\nKondamnitaj roluloj ricevos +67% damaĝon de ĉiuj fontoj.\n\nPereo estas permanenta, ĝiaj efikoj finiĝas nur per morto.
actors.buffs.doom.name=kondamnita
actors.buffs.dread.desc=Teruro tiel granda, ke ĝi igos ĝian celon tute fuĝi el la kelkarcero! ZXQPH1 ZXQZXQPH2 ZXQEstaĵoj trafitaj de timo kuros de sia kontraŭulo kun alta rapideco, kaj malaperos el la kelkarcero tute post kiam ili estos ekster videbleco. Malamikoj, kiuj estas venkitaj tiel, donas duonon de la sperto kaj ne faligas objektojn. La ŝoko de doloro malpliigos la daŭron de timo. ZXQPH3 ZXQZXQPH4 ZXQRestantaj vicoj de timo: ZXQPH0 ZXQ.
actors.buffs.dread.name=timo
actors.buffs.drowsy.desc=Magia forto malfaciligas resti veka, post kelkaj turnoj, la celo falos en profundan magian dormon.\n\nLa heroo povas rezisti dormemon per ricevado de damaĝo aŭ per estado je plena sano.\n\nTurnoj ĝis dormo: %s.
actors.buffs.drowsy.name=dormema
actors.buffs.earthimbue.desc=Vi estas trapenetrita per la povo de la tero!\n\nĈiuj fizikaj atakoj ŝovos la teron sub la malamiko, kripligante ilin por mallonga tempo.\n\nRestantaj turnoj da tero trapenetranta: %s.
actors.buffs.earthimbue.name=trapenetrita per tero
actors.buffs.enhancedrings.desc=La ĵus uzita artefakto de la Fripono povigas liajn ringojn, donante al ili +1 nivelon.\n\nRestantaj turnoj: %s.
actors.buffs.enhancedrings.name=plifortigitaj ringoj
actors.buffs.fireimbue.desc=Vi estas trapenetrita per la povo de fajro!\n\nĈiuj fizikaj atakoj havos ŝancon ekbruligi malamikojn. Krome, vi estas tute imuna kontraŭ la efikoj de fajro.\n\nNombro da fajrotrapenetraj restantaj: %s.
actors.buffs.fireimbue.name=trapenetrita per fajro
actors.buffs.foresight.desc=Vi iel kapablas vidi la aranĝon de la ĉirkaŭa tereno per via menso.\n\nSub la efiko de antaŭscio, ĉiuj kaheloj en larĝa radiuso estas rivelitaj al vi, inkluzive de iuj ajn sekretaj kaptiloj aŭ pordoj.\n\nRestantaj vicoj de antaŭscio: %s.
actors.buffs.foresight.name=antaŭscio
actors.buffs.frost.desc=Ne konfuzu kun frostigado de solido, ĉi tiu pli benigna frostigado simple enfermas la celon en glacio.\n\nFrostigado agas simile al paralizo, malebligante la agon de la celo. Male al paralizo, frostigado tuj nuliĝas se la celo ricevas damaĝon, ĉar la glacio frakasiĝos.\n\nRestantaj turnoj de frostigado: %s.
actors.buffs.frost.freezes=%s frostiĝas!
actors.buffs.frost.name=frosta
actors.buffs.frostimbue.desc=Vi estas trapenetrita per glacia povo!\n\nĈiuj fizikaj atakoj konstante amasigos malvarmon sur malamikoj. Krome, vi estas tute imuna kontraŭ la malvarmo.\n\nTurnoj de frosto trapenetrado restantaj: %s.
actors.buffs.frostimbue.name=trapenetrita per frosto
actors.buffs.fury.desc=Vi koleras, malamikoj ne ŝatos vin kiam vi koleras. \n\nGranda kolero brulas en vi, pliigante la damaĝon, kiun vi kaŭzas per fizikaj atakoj je 50%%. \n\nĈi tiu kolero daŭros tiel longe kiel vi estas vundita sub 50%% sano.
actors.buffs.fury.heromsg=Vi fariĝas kolera!
actors.buffs.fury.name=kolera
actors.buffs.gravitychaostracker.desc_duration=Ne estas klare kiom longe la efiko daŭros, sed ĝi ne povas daŭri eterne.
actors.buffs.gravitychaostracker.desc_intro=Ĉiujn kelkajn turnojn ĉiuj roluloj sur la nuna kelkarcerplanko estos ĵetitaj en hazardan direkton.
actors.buffs.gravitychaostracker.desc_positive=Tamen ŝajnas, ke vi kaj viaj aliancanoj estas imunaj.
actors.buffs.gravitychaostracker.name=gravita kaoso
actors.buffs.greaterhaste.desc=Nekredebla akcelo de rapido, por momento ŝajnas kvazaŭ ĉio alia staras senmove.\n\n Sub la efikoj de pli granda hasto, moviĝagoj tute ne daŭras, sed aliaj agoj ankoraŭ estas plenumataj je normala rapido. Ĉiu paŝo de movado konsumas vicon de pli granda hasto.\n\nRestantaj vicoj de pli granda hasto: %d.
actors.buffs.greaterhaste.name=pli granda hasto
actors.buffs.haste.desc=Energio fluas tra viaj muskoloj, permesante al vi kuri je nekredeblaj rapidoj! ZXQPH1 ZXQZXQPH2 ZXQ Sub la efikoj de hasto vi kuros je 3-obla rapido, sed plenumos ĉiujn aliajn agojn je normala rapido. ZXQPH3 ZXQZXQPH4 ZXQRestantaj hastvicoj: ZXQPH0 ZXQ.
actors.buffs.haste.name=hasto
actors.buffs.healing.desc=Magia kuracilo kaŭzas fermiĝon de vundoj kaj trikiĝon de karno.\n\nĈiuvice sano konstante regeneriĝos ĝis la resaniĝa efiko eksvalidiĝos. La kvanto de resaniĝo povas malpliiĝi laŭlonge de la tempo.\n\nSekva resaniĝo: %d.\n\nResaniĝo restanta: %d.
actors.buffs.healing.name=resaniĝo
actors.buffs.herodisguise.desc=Iluzia magio ŝanĝis vian fizikan aspekton! La efiko estas pure kosmetika, sed sentas sin tre stranga ĉiuokaze.\n\nRestantaj vicoj de alivestiĝo: %s.
actors.buffs.herodisguise.name=alivestiĝo
actors.buffs.hex.desc=Malhela magio, kiu elĉerpas fokuson, igante la celon iomete konfuzita.\n\nSorĉado reduktas precizecon kaj evitadon je 20%%, igante la celon malpli efika en batalo.\n\nRestantaj vicoj de sorĉado: %s.
actors.buffs.hex.heromsg=Vi estis sorĉita!
actors.buffs.hex.name=sorĉita
actors.buffs.holdfast.desc=La Militisto tenas sian pozicion, pliigante sian kirason je %1$d-%2$d kaj malrapidigante la kadukiĝon de kelkaj plifortigoj je %3$d%%. Ĉi tio daŭros ĝis li moviĝos.
actors.buffs.holdfast.name=tenu firme
actors.buffs.hunger.cursedhorn=La malbenita korno ŝtelas iom da la manĝaĵenergio dum vi manĝas.
actors.buffs.hunger.desc=Malsato malrapide pliiĝas dum vi pasigas tempon en la kelkarcero, poste vi komencos malsati. Dum malsato vi malrapide perdos sanon anstataŭ regeneri ĝin.\n\nŜparciigo estas grava! Se vi havas sanon por redoni, malsati ne estas malbona ideo se ĝi signifas, ke estos pli da manĝaĵo poste. Efika ŝparciigo povas igi manĝaĵon daŭri multe pli longe!
actors.buffs.hunger.desc_intro_hungry=Vi povas senti vian stomakon alvokantan manĝaĵon, sed ĝi ankoraŭ ne estas tro urĝa.
actors.buffs.hunger.desc_intro_starving=Vi estas tiel malsata, ke ĝi doloras.
actors.buffs.hunger.hungry=malsata
actors.buffs.hunger.ondeath=Vi malsatis ĝismorte...
actors.buffs.hunger.onhungry=Vi estas malsata.
actors.buffs.hunger.onstarving=Vi malsatas!
actors.buffs.hunger.rankings_desc=Malsatigita al Morto
actors.buffs.hunger.starving=malsatanta
actors.buffs.invisibility.desc=Vi estas tute miksita en la ĉirkaŭan terenon, farante vin nevidebla.\n\nDum vi estas nevidebla, malamikoj ne povas ataki aŭ sekvi vin. Fizikaj atakoj kaj magiaj efikoj (kiel volvlibroj kaj sorĉbastonoj) tuj nuligos nevideblecon.\n\nRestantaj turnoj de nevidebleco: %s.
actors.buffs.invisibility.name=nevidebla
actors.buffs.invulnerability.desc=Ĉi tiu rolulo estas plena de granda protekta povo, donante al ili mallongan periodon de nevundebleco!\n\nRestantaj turnoj: %s.
actors.buffs.invulnerability.name=nevundebla
actors.buffs.levitation.desc=Magia forto ŝvebas vin super la tero, igante vin senti vin senpeza.\n\nŜvebantaj roluloj moviĝas silente kaj ignoras ĉiujn surterajn efikojn. Kaptiloj ne ekfunkcios, akvo ne estingos fajron, plantoj ne estos piedpremitaj, radikoj maltrafos, kaj kavoj ŝvebos super ili. Estu singarda, ĉar ĉio ĉi povas ekvalidi en la momento kiam la levitacio finiĝas!\n\nRestantaj vicoj de levitacio: %s.
actors.buffs.levitation.name=ŝvebanta
actors.buffs.lifelink.desc=La vivoforto de ĉi tiu rolulo estas ligita al alia rolulo proksima. Ĉia ricevita damaĝo estas dividita inter ili.\n\nKiam ajn ĉi tiu rolulo ricevas damaĝon, duono de ĝi estos kaŭzita al la vivliga celo anstataŭe.\n\nRestantaj vivligo-vicoj: %s.
actors.buffs.lifelink.name=vivligo
actors.buffs.lifelink.ondeath=La vivligita difekto mortigis vin...
actors.buffs.light.desc=Eĉ en la Plej Malluma Kelkarcero, konstanta lumo ĉe via flanko ĉiam konsolas. ZXQPH1 ZXQZXQPH2 ZXQLumo helpas teni mallumon for, permesante al vi vidi je akceptebla distanco malgraŭ la ĉirkaŭaĵo. ZXQPH3 ZXQZXQPH4 ZXQRestantaj lumvicoj: ZXQPH0 ZXQ.
actors.buffs.light.name=lumigita
actors.buffs.lockedfloor.desc=La nuna etaĝo estas ŝlosita, kaj vi ne povas forlasi ĝin!\n\nDum etaĝo estas ŝlosita, vi ne gajnos malsaton aŭ ricevos damaĝon pro malsato. Krome, se vi ne klopodas venki la estron de ĉi tiu etaĝo, la pasivaj regeneradaj efikoj ankaŭ ĉesos.\n\nPlie, se vi estas revivigita per nebenita anĥo dum la etaĝo estas ŝlosita, tiam ĝi rekomenciĝos.\n\nMortigu la estron de ĉi tiu etaĝo por rompi la seruron.
actors.buffs.lockedfloor.name=planko estas ŝlosita
actors.buffs.lostinventory.desc=Via inventaro perdiĝis ie en la kelkarcero! Vi ne povos preni aŭ uzi plej multajn objektojn ĝis vi reprenos ĝin.
actors.buffs.lostinventory.name=perdita inventaro
actors.buffs.magicalsight.desc=Iel vi kapablas vidi per via menso, anstataŭ viaj okuloj. \n\nDum magia vido estas aktiva, vi povos vidi tra ĉiu tereno en radiuso de 12 kaheloj. \n\nRestantaj vicoj de magia vido: %s.
actors.buffs.magicalsight.name=magia vido
actors.buffs.magicalsleep.desc=Ĉi tiu rolulo falis en profundan magian dormon, el kiu ili ne vekiĝos nature. \n\nMagia dormo similas al regula dormo, escepte ke nur damaĝo kaŭzos la vekiĝon de la celo. \n\nPor la heroo kaj iliaj aliancanoj, magia dormo havas kelkajn resanigajn ecojn, permesante al ili rapide resaniĝi dum ripozado.
actors.buffs.magicalsleep.fallasleep=Vi falas en profundan magian dormon.
actors.buffs.magicalsleep.name=magia dormo
actors.buffs.magicalsleep.toohealthy=Vi estas tro sana, kaj rezistas la deziron dormi.
actors.buffs.magicalsleep.wakeup=Vi vekiĝas sentante vin refreŝigita kaj sana.
actors.buffs.magicimmune.desc=Ĉiuj magiaj efikoj perdis sian potencon sur vi, vi estas tute imuna al ili. ZXQPH1 ZXQZXQPH2 ZXQ Kvankam vi estas magioimuna, ĉiuj malutilaj kaj helpaj magiaj efikoj ne aplikiĝos al vi, inkluzive de malbenoj, sorĉoj, sorĉbastonoj, volvlibroj, ringoj, artefaktoj, ktp. Heroaj kiraskapabloj estas sufiĉe fortaj por funkcii sendepende de ĉi tiu efiko. ZXQPH3 ZXQZXQPH4 ZXQRestantaj vicoj de magia imuneco: ZXQPH0 ZXQ.
actors.buffs.magicimmune.name=imuna kontraŭ magio
actors.buffs.mindvision.desc=Iel vi kapablas vidi ĉiujn estaĵojn sur ĉi tiu etaĝo per via menso. Estas stranga sento.\n\nĈiuj roluloj sur ĉi tiu etaĝo estas videblaj al vi tiel longe kiel vi havas mensan vidon. Vidi estaĵon per mensa vido kalkuliĝas kiel vidata aŭ proksime por la celoj de multaj magiaj efikoj.\n\nRestantaj turnoj de mensa vido: %s.
actors.buffs.mindvision.name=mensa vizio
actors.buffs.momentum.action_name=libera kuro
actors.buffs.momentum.momentum=konstruante impeton
actors.buffs.momentum.momentum_desc=Dum li moviĝas, la Liberkurulo konstruas impeton, kiun li povas elspezi por komenci liberkuradon. ZXQPH1 ZXQZXQPH2 ZXQ Ĉiu ŝargo de impeto donas du turnojn de liberkurado, kaj la Liberkurulo povas amasigi ĝis 10 ŝargojn. Impeto rapide perdiĝas kiam la Liberkurulo ĉesas moviĝi. ZXQPH3 ZXQZXQPH4 ZXQ Aktuala impetoŝargo: ZXQPH0 ZXQ.
actors.buffs.momentum.resting=resaniĝante
actors.buffs.momentum.resting_desc=Dum li moviĝas, la Liberkuranto akiras impeton, kiun li povas elspezi por komenci liberkuradon. ZXQPH1 ZXQZXQPH2 ZXQ La Liberkuranto bezonas tempon por reakiri sian eltenemon antaŭ ol denove akiri impeton. ZXQPH3 ZXQZXQPH4 ZXQ Restantaj turnoj: ZXQPH0 ZXQ.
actors.buffs.momentum.running=libera kurado
actors.buffs.momentum.running_desc=Dum li moviĝas, la Liberkuristo akiras impeton, kiun li povas elspezi por komenci liberkuradon. ZXQPH1 ZXQZXQPH2 ZXQDum liberkurado, la Liberkuristo moviĝas je duobla rapideco kaj gajnas bonusan evitadon bazitan sur sia nivelo. ZXQPH3 ZXQZXQPH4 ZXQRestantaj turnoj: ZXQPH0 ZXQ.
actors.buffs.monkenergy$monkability$dash.desc=Tujrapida kurado ĝis 4 kahelojn for. Ĉi tiu kapablo povas iri super danĝeroj, sed ne tra malamikoj aŭ solida tereno.
actors.buffs.monkenergy$monkability$dash.empower_desc=Tujrapida kurado ĝis _8 kahelojn_ for. Ĉi tiu kapablo povas iri super danĝeroj, sed ne tra malamikoj aŭ solida tereno.
actors.buffs.monkenergy$monkability$dash.name=streketo
actors.buffs.monkenergy$monkability$dash.prompt=Elektu Lokon
actors.buffs.monkenergy$monkability$dragonkick.desc=Detruiga piedbato kiu kaŭzas damaĝon de %1$d-%2$d kaj ignoras kirason. La piedbato forpuŝas la celon kaj paralizas ĝin por ĉiu kahelo, kiun ĝi trairas.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Detruiga piedbato kiu kaŭzas _%1$d-%2$d damaĝon_ kaj ignoras kirason. La piedbato forpuŝas _ĉiujn apudajn celojn_ kaj paralizas ilin por ĉiu kahelo, kiun ili trairas.
actors.buffs.monkenergy$monkability$dragonkick.name=drakopiedbato
actors.buffs.monkenergy$monkability$flurry.desc=Du tujaj atakoj, kiuj kaŭzas damaĝon de %1$d-%2$d kaj ignoras kirason. Ĉi tiu kapablo ne povas esti uzata plurfoje.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Du tujaj atakoj kiuj kaŭzas %1$d-%2$d damaĝon, ignoras kirason, _kaj uzas la sorĉon de via armilo._ Ĉi tiu kapablo ne povas esti uzata plurfoje.
actors.buffs.monkenergy$monkability$flurry.name=ekblovo de batoj
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=La Monaĥo koncentriĝas pri sia ĉirkaŭaĵo, antaŭvidante la sekvan atakon kontraŭ ŝi. Dum koncentrita, ŝi certe deturnos la sekvan alvenantan atakon.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=fokusita
actors.buffs.monkenergy$monkability$focus.desc=La Monaĥo prenas vicon por koncentriĝi, lasante ŝin deturni la sekvan atakon faritan kontraŭ ŝi.
actors.buffs.monkenergy$monkability$focus.empower_desc=La Monaĥo _tuj koncentriĝas,_ lasante ŝin deturni la sekvan atakon faritan kontraŭ ŝi.
actors.buffs.monkenergy$monkability$focus.name=fokuso
actors.buffs.monkenergy$monkability$meditate.desc=La Monaĥo koncentras energion en sian korpon dum 5 vicoj. Tio forigas plej multajn negativajn efikojn kaj donas al ŝi 8 vicojn da reŝargado de sorĉbastono kaj artefakto.
actors.buffs.monkenergy$monkability$meditate.empower_desc=La Monaĥo fokusas energion en sian korpon dum 5 vicoj. Tio forigas plej multajn negativajn efikojn kaj donas al ŝi 8 vicojn da reŝargado de sorĉbastono kaj artefakto. _Ŝi ankaŭ akiras 80%-an damaĝreziston dum meditado, kaj malrapide resaniĝas je 20% de sia mankanta vivopovo._
actors.buffs.monkenergy$monkability$meditate.name=mediti
actors.buffs.monkenergy.action=Monaĥaj Kapabloj
actors.buffs.monkenergy.desc=Dum ŝi venkas malamikojn, la Monaĥo akiras energion, kiun ŝi povas uzi por diversaj kapabloj. Plej multaj malamikoj donas 1 energion kiam venkitaj, kaj la Monaĥo ne perdas energion laŭlonge de la tempo. ZXQPH2 ZXQZXQPH3 ZXQ Aktuala energio: ZXQPH0 ZXQ/ZXQPH1 ZXQ.
actors.buffs.monkenergy.desc_cooldown=La Monaĥo ĵus uzis kapablon, kaj devas atendi antaŭ ol uzi alian. \n\nAktuala malvarmiĝtempo: %d vicoj.
actors.buffs.monkenergy.name=energio
actors.buffs.ooze.desc=Ĉi tiu gluiĝema acido algluiĝas al karno, malrapide fandante ĝin.\n\nŜlimo kaŭzos konstantan damaĝon laŭlonge de la tempo, sed povas esti tuj forlavita per akvo.\n\nRestantaj ŝlimoj: %s.
actors.buffs.ooze.heromsg=Morda ŝlimo formanĝas vian karnon. Forlavu ĝin!
actors.buffs.ooze.name=morda ŝlimo
actors.buffs.ooze.ondeath=Vi degelas...
actors.buffs.ooze.rankings_desc=Dissolvita
actors.buffs.paralysis.desc=Ofte la plej malbona afero farenda estas nenion.\n\nParalizo tute haltigas ĉiujn agojn, devigante la celon atendi ĝis la efiko malaperas. La doloro pro ricevado de damaĝo povas igi rolulojn rezisti paralizon, rompante ilin el la efiko.\n\nRestantaj turnoj de paralizo: %s.
actors.buffs.paralysis.heromsg=Vi estas paralizita!
actors.buffs.paralysis.name=paralizita
actors.buffs.paralysis.out=rezistis paralizon
actors.buffs.physicalempower.desc=Viaj batoj plifortiĝis, pliigante la kvanton da damaĝo, kiun vi povas kaŭzi kiam vi trafas malamikojn per fizikaj atakoj.\n\nKroma damaĝo: %1$d.\nRestaj trafoj: %2$d.
actors.buffs.physicalempower.name=fizike povigita
actors.buffs.pincushion.desc=La ĵetarmiloj, kiujn vi uzis kontraŭ ĉi tiu rolulo, estas nuntempe algluitaj al ili kaj falos sur la plankon post kiam ili estos venkitaj.\n\nLa jenaj objektoj estas nuntempe algluitaj:
actors.buffs.pincushion.name=pinglokuseno
actors.buffs.poison.desc=Veneno trairas la korpon, malrapide difektante ĝian internan funkciadon.\n\nVeneno kaŭzas damaĝon ĉiun vicon proporcie al kiom longe ĝis ĝi eksvalidiĝas.\n\nVincoj da restantaj veneno: %s.
actors.buffs.poison.heromsg=Vi estas venenita!
actors.buffs.poison.name=venenigita
actors.buffs.poison.ondeath=Vi mortis pro veneno...
actors.buffs.poison.rankings_desc=Venkiĝis al Veneno
actors.buffs.preparation.action_name=preta striko
actors.buffs.preparation.assassinated=asasinita
actors.buffs.preparation.desc=La Insidmurdisto pacience atendas, preparante sin por ataki el la ombroj.
actors.buffs.preparation.desc_blink=Li kapablas palpebrumi al malamiko antaŭ ol trafi lin/ŝin, kun maksimuma distanco de _%d._
actors.buffs.preparation.desc_dmg=Lia sekva atako kaŭzos _%1$d%% kromdamaĝon_, kaj ekzekutos ordinarajn malamikojn sub _%2$d%% sano_, aŭ estrojn sub _%3$d%% sano_.
actors.buffs.preparation.desc_dmg_likely=La atako ankaŭ pli verŝajne kaŭzos pli grandan kvanton da damaĝo.
actors.buffs.preparation.desc_invis_next=Turnoj por pli forta atako: _%d._
actors.buffs.preparation.desc_invis_time=Turnoj elspezitaj nevidebla: _%d._
actors.buffs.preparation.name=preparo
actors.buffs.preparation.no_target=Tie estas nenio atakebla.
actors.buffs.preparation.out_of_reach=Tiu celo estas neatingebla.
actors.buffs.preparation.prompt=Elektu celon por ataki!\nMaksimuma palpebrumodistanco: %d
actors.buffs.prismaticguard.desc=Vin gardas prisma bildo, kiu nuntempe estas neaktiva. Kiam malamikoj ĉeestas, la prisma bildo ekagos kaj protektos vin!\n\nDum neaktiva, la prisma bildo konstante resaniĝos de iu ajn ricevita damaĝo.\n\nAktuala Vivpoentoj: %d/%d.
actors.buffs.prismaticguard.desc_many=Ĉi tiu prisma bildo ankaŭ profitas de la Potenco de Multaj. Restantaj Turnoj: %d.
actors.buffs.prismaticguard.name=prisma gardisto
actors.buffs.recharging.desc=Energio fluas tra vi, plibonigante la rapidecon de ŝargado de viaj sorĉbastonoj kaj bastonoj.\n\nĈiun vicon ĉi tiu plifortigo pliigos la nunan ŝargon je unu kvarono, aldone al la regula reŝargado.\n\nRestantaj vicoj de reŝargado: %s.
actors.buffs.recharging.name=reŝargado
actors.buffs.revealedarea.desc=Areo de la kelkarcero estis provizore rivelita al la heroo. Ili vidos ĝin kie ajn ili estas. \n\nRestantaj turnoj: %s.
actors.buffs.revealedarea.name=rivelita areo
actors.buffs.revealedchar.desc=Ĉi tiu rolulo estas rivelita al la heroo. Ili estos videblaj kie ajn ili estas. \n\nRestantaj turnoj: %s.
actors.buffs.revealedchar.name=rivelita
actors.buffs.roots.desc=Radikoj (magiaj aŭ naturaj) kaptas la piedojn, devigante ilin fali al la tero.\n\nRadikoj ŝlosas celon en loko, malebligante movadon kaj plej multajn movkapablojn. Aliaj agoj ne estas influitaj, inkluzive de teleportaj efikoj.\n\nRestantaj turnoj de radiko: %s.
actors.buffs.roots.heromsg=Vi ne povas moviĝi!
actors.buffs.roots.name=enradikiĝinta
actors.buffs.scrollempower.desc=La energio de la ĵus legita volvlibro de la Magiisto povigas liajn sorĉbastonojn!\n\nNivela Pliigo: +%1$d.\nRestantaj zapoj: %2$d.
actors.buffs.scrollempower.name=rulumi povigi
actors.buffs.shadows.desc=Vi estas miksita en la ombrojn ĉirkaŭ vi, donante al vi nevideblecon kaj malrapidigante vian metabolon.\n\nDum vi estas nevidebla, malamikoj ne povas ataki aŭ sekvi vin. Plej multaj fizikaj atakoj kaj magiaj efikoj (kiel volvlibroj kaj sorĉbastonoj) tuj nuligos nevideblecon. Krome, dum ombrokunfandita, via malsato-rapideco malrapidiĝas.\n\nVi restos ombrokunfandita ĝis vi forlasos la ombrojn aŭ malamiko kontaktos vin.
actors.buffs.shadows.name=ombrita kunfandita
actors.buffs.slow.desc=Malrapidiga magio influas la temporapidon de la celo, por ili ĉio moviĝas superrapide. \n\nMalrapidigita rolulo plenumas ĉiujn agojn en duoble la tempo, kiun ili normale daŭrus. \n\nRestantaj turnoj de malrapidigo: %s.
actors.buffs.slow.name=malrapidigita
actors.buffs.snipersmark.action_name_snapshot=momentfoto
actors.buffs.snipersmark.action_name_sniper=kaŝpafisto pafis
actors.buffs.snipersmark.action_name_volley=salvo
actors.buffs.snipersmark.desc=La kaŝpafisto estas akrigita al la celo, kiun ŝi plej lastatempe atakis. Ŝi kapablas plenumi specialan atakon per sia arko, kiu varios laŭ kiel la arko estas plifortigita.\n\nNeplifortigita arko pafos _momentpafon_, kiu kaŭzas reduktitan damaĝon sed ne bezonas tempon por pafi.\n\nArko plifortigita por rapideco pafos _salvon_ de tri sagoj. Ĉiu sago kaŭzos reduktitan damaĝon, sed ankoraŭ povas aktivigi sorĉon. Ĉi tiu salvo bezonas 1 vicon por pafi.\n\nArko plifortigita por damaĝo pafos _kaŝpafon_. Ĉi tiu pafo garantiite trafos, kaŭzas bonusan damaĝon bazitan sur la distanco de la celo, kaj bezonas 2 vicojn por pafi.\n\nRestantaj vicoj: %s.
actors.buffs.snipersmark.name=kaŝpafista marko
actors.buffs.soulmark.desc=La sorĉisto kaptis la animon de ĉi tiu kreitaĵo, permesante al li resaniĝi dum ĝi ricevas fizikan damaĝon.\n\nRestantaj vicoj de animmarko: %s.
actors.buffs.soulmark.name=animo markita
actors.buffs.stamina.desc=Vi havas senfinan eltenemon, kio ebligas pli rapidan movadon!\n\nSub la efikoj de eltenemo vi kuros je +50%% rapideco, sed plenumos ĉiujn aliajn agojn je normala rapideco.\n\nRestantaj turnoj da eltenemo: %s.
actors.buffs.stamina.name=eltenemo
actors.buffs.terror.desc=Teruro estas manipula magio, kiu devigas sian celon en nekontroleblan panikon.\n\n Teruritaj roluloj estas devigitaj forkuri de sia kontraŭulo, provante meti kiel eble plej multajn pordojn kaj murojn inter ili. La ŝoko de doloro tamen mallongigos la daŭron de la teruro.\n\n Restantaj terurvicoj: %s.
actors.buffs.terror.name=terurita
actors.buffs.toxicimbue.desc=Vi estas trapenetrita per venena energio!\n\nDum vi moviĝas, toksa gaso konstante elŝprucos el vi, damaĝante viajn malamikojn. Vi estas imuna kontraŭ toksa gaso kaj veneno por la daŭro de la efiko, kaj ankaŭ por kelkaj vicoj poste.\n\nVicoj da restanta toksa trapenetrado: %s.
actors.buffs.toxicimbue.name=trapenetrita per tokseco
actors.buffs.vertigo.desc=Marŝi rektlinie povas esti malfacile kiam la tuta mondo turniĝas.\n\n Sub la efikoj de vertiĝo, roluloj kiuj provas moviĝi iros en hazarda direkto, anstataŭ tiu, en kiu ili intencis iri.\n\nRestantaj vertiĝovicoj: %s.
actors.buffs.vertigo.name=vertiĝo
actors.buffs.vulnerable.desc=Vundebleca magio pliigas ĉian fizikan damaĝon, kiun rolulo ricevas, je 33%%, post kiam tiu damaĝo estas reduktita per kiraso.\n\nVicoj de vundebleco restantaj: %s.
actors.buffs.vulnerable.heromsg=Vi sentas vin malforta!
actors.buffs.vulnerable.name=vundebla
actors.buffs.wandempower.desc=Viaj damaĝo-kaŭzantaj sorĉbastonoj estas plifortigitaj, pliigante la kvanton da damaĝo, kiun ili kaŭzas por kelkaj trafoj.\n\nKroma damaĝo: %1$d.\nRestaj trafoj: %2$d.
actors.buffs.wandempower.name=sorĉbastonoj povigitaj
actors.buffs.weakness.desc=Ĉio subite ŝajnas multe pli peza.\n\nMalfortiga magio reduktas la fizikan forton de rolulo, kaŭzante ke ili kaŭzas 33%% reduktitan damaĝon.\n\nRestantaj malfortecvicoj: %s.
actors.buffs.weakness.heromsg=Vi sentas vin malfortigita!
actors.buffs.weakness.name=malfortigita
actors.buffs.wellfed.desc=Vi sentas vin tute kontenta kaj plena.\n\nDum bone nutrita, via malsato ne pliiĝos, kaj vi resanigos plian kvanton da sano laŭlonge de la tempo.\n\nRestantaj turnoj: %d.
actors.buffs.wellfed.name=bone nutrita
actors.char.def_verb=evitita
actors.char.def_verb_blocked=blokita
actors.char.defeat=vi venkis %s.
actors.char.immune=imuna
actors.char.invulnerable=nevundebla
actors.char.kill=%s mortigis vin...
actors.hero.abilities.armorability.cost=Kosto de ŝargo: _%d_
actors.hero.abilities.armorability.no_target=Nenio estas celinda tie!
actors.hero.abilities.armorability.prompt=Elektu lokon por celi
actors.hero.abilities.armorability.self_target=Vi ne povas celi vin mem!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Radianta energio eliras el la korpo de la Kleriko. Dum en ĉi tiu formo, la Kleriko gajnas 2 atakdistancon (pro la sankta energio projekcianta el ili), kaj 10 ŝirmadon kiam ajn ili elspezas sanktan volumon. Ili ankaŭ kapablas ĵeti la sorĉojn, kiuj estas malŝlositaj per la talentoj de ĉielirita formo. \n\nLa ŝildo donita de ĉielirita formo kaj ĝiaj sorĉoj ne kadukiĝos normale, sed tuj svagiĝos kiam la ĉielirita formo finiĝos. \n\nAktuala ŝirmado: %1$d.\nRestantaj vicoj: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=suprenirita formo
actors.hero.abilities.cleric.ascendedform.desc=La Kleriko projekcias sanktan energion el si mem, alprenante plilongigitan radian formon dum 10 vicoj. Dum en ĉi tiu formo, la Kleriko povas ĵeti novajn sorĉojn, gajnas 2 atakdistancon, 30 ŝirmadon, kaj ĉiuj aldonaj sorĉoj, kiujn ili ĵetas, donos 10 ŝirmadon por ĉiu uzita sankta volumo-ŝargo. \n\nLa ŝirmado kontraŭ ĉielirita formo kaj ĝiaj sorĉoj normale ne kadukiĝas, sed tuj svagiĝos post kiam la ĉielirita formo finiĝas. La kapablo povas esti reuzata por refreŝigi la daŭron de la ĉielirita formo.
actors.hero.abilities.cleric.ascendedform.name=suprenirita formo
actors.hero.abilities.cleric.ascendedform.short_desc=La Kleriko alprenas _Ĉelirintan Formon_, akirante novajn sorĉojn, atakdistancon kaj ŝirmadon.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Kopio de unu el la aventuraj kunuloj de la Kleriko, farita el solida lumo. Kvankam ĝi havas la formon de alia heroo, ĝi ne havas iujn ajn el iliaj unikaj kapabloj. Ĉi tiu aliancano daŭros tiel longe kiel Potenco de Multaj estos aplikita al ili. \n\nĈi tiu aliancano povas esti direktita senkoste per reuzo de la kiraskapablo Potenco de Multaj.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Via aliancano moviĝas por ataki!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Via aliancano moviĝas al tiu pozicio.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Via aliancano moviĝas por sekvi vin.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Vi povas trovi ĉi tiun rolulon kun specifa heroo-kiraso-kapablo.
actors.hero.abilities.cleric.powerofmany$lightally.name=malpeza aliancano
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Ĉi tiu aliancano estis povigita per Potenco de Multaj, donante al ili +25%% da kaŭzita damaĝo kaj -25%% da ricevita damaĝo. Ili ankaŭ dividos sian vidkampon kun la Kleriko, kaj povas profiti de la povo de multaj sorĉoj.\n\nPotenco de Multaj daŭros kiam aliancanoj kiel prismaj bildoj kaŝiĝos, sed ĝia daŭro ankoraŭ estos dekalkulita.\n\nRestaj Turnoj: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=potenco de multaj
actors.hero.abilities.cleric.powerofmany.ally_exists=Vi jam havas povigitan aliancanon.
actors.hero.abilities.cleric.powerofmany.desc=La Kleriko kanaligas la _Potencon de Multaj_, kiu aŭ povigas ekzistantan aliancanon aŭ kreas novan povigitan aliancanon por 100 vicoj. Celi malplenan spacon kreas novan aliancanon.\n\nDum povigita per Potenco de Multaj, ĉiu aliancano kaŭzas +25% damaĝon, ricevas -25% damaĝon, kaj dividas sian vidon kun la Kleriko. Ili ankaŭ gajnas 25 ŝirmadon kiam la kapablo estas uzata.\n\nLa Kleriko ankaŭ gajnas tri novajn sorĉojn, kiujn oni povas gisi nur kun povigita aliancano. Potenco de Multaj ne finiĝos dum unu el ĉi tiuj sorĉoj estas aktiva.
actors.hero.abilities.cleric.powerofmany.name=potenco de multaj
actors.hero.abilities.cleric.powerofmany.no_vision=Vi ne povas celi lokon, kiun vi ne povas vidi.
actors.hero.abilities.cleric.powerofmany.only_allies=Vi povas nur povigi aliancanojn.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Direktu vian luman aliancanon
actors.hero.abilities.cleric.powerofmany.prompt_default=Elektu aliancanon aŭ lokon
actors.hero.abilities.cleric.powerofmany.short_desc=La Kleriko kanaligas la _Potencon de Multaj_, povigante ekzistantan aliancanon aŭ kreante novan.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Asigni al korpoformo
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Asigni al mensa formo
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Asigni al spirita formo
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Elektu efikon enigotan en Trinity. Pliaj informoj estos montrataj antaŭ konfirmo.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Korpoformo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Mensa Formo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Spiritformo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Elektu kiun formon de Triunuo uzi. La efikoj de malsamaj formoj povas esti aktivaj samtempe.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity aplikos la malproksiman alĥemian efikon de ĉi tiu artefakto, je la kosto de _%2$s ŝargo._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity aplikos la pasivan sanregeneran efikon de ĉi tiu artefakto je _+%1$d_ dum 20 vicoj, je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.cost=La ŝarga kosto de ĉi tiu kapablo varias, sed plej ofte estas _%d._
actors.hero.abilities.cleric.trinity.desc=La Kleriko akiras _Triunon_ da kiraskapabloj, kiuj povas esti asignitaj al diversaj objektaj efikoj per uzado de tri novaj sorĉoj. Ĉiu el ĉi tiuj sorĉoj fokusiĝas al imiti la efikojn de malsamaj specoj de ekipaĵo, kiujn la Kleriko identigis dum ĉi tiu kuro: korpoformo (armiloj kaj kiraso), mensformo (bastonoj kaj ĵetarmiloj), kaj spiritformo (ringoj kaj artefaktoj).\n\nĈiu Triuno-formo povas esti trapenetrita per unu efiko samtempe, kaj la Kleriko elektas kiun aktivigi dum uzado de Triuno. Triuno ne duplikatos la efikon de io, kion vi jam ekipis.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity uzos la efikon de ĉi tiu artefakto por alvoki koruptitan amikan fantomon kun la vivpoentoj de _+%1$d_ fantomo, je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity aplikos ĉi tiun efikon por _%1$d vicoj_ je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity aplikos la ĉen-ĵetan efikon de ĉi tiu artefakto kun atingo je _+%1$d_, je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity aplikos la manĝetan efikon de ĉi tiu artefakto, je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Triunuo aplikos la malamikan rabadan efikon de ĉi tiu artefakto je _+%1$d_, je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.name=triunuo
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity ne povas duplikati efikon, kiun vi jam ekipis!
actors.hero.abilities.cleric.trinity.no_imbue=Triunuo nuntempe ne havas efikon agorditan por iu ajn el siaj formoj, uzu unu el ĝiaj sorĉoj!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity aplikos ĉi tiun _potencan_ efikon por _%1$d vicoj_ je la kosto de _%2$s ŝargo._
actors.hero.abilities.cleric.trinity.ring_use=Trinity aplikos la efikon de ĉi tiu ringo ĉe _+%1$d_ dum 20 vicoj, je la kosto de _%2$s ŝargo._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity aplikos la radikan efikon de ĉi tiu artefakto per hazarda malutila semo, je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.short_desc=La Kleriko akiras _Triunon_ de kapabloj, kiuj imitas ekipaĵon, kiun ili vidis, kaj povas esti asignitaj per novaj sorĉoj.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity aplikos la enmetitan efikon de ĉi tiu artefakto, je la kosto de _%2$s-ŝargo._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity aplikos la skry-efikon de ĉi tiu artefakto je _+%1$d_, je la kosto de _%2$s ŝargo_.
actors.hero.abilities.cleric.trinity.thrown_use=Trinity ĵetos ĉi tiun armilon al _+%1$d_ je la kosto de _%2$s ŝargo._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Triunuo aplikos la tempofrostigan efikon de ĉi tiu artefakto kun _%1$d_ turndaŭro, je la kosto de _%2$s ŝargo._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity aplikos la hazardan volvaĵan efikon de ĉi tiu artefakto kun ŝanco de _%1$d/10_ oferti la ekzotikan version sen aldona kosto, kontraŭ la kosto de _%2$s_.
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity pafos ĉi tiun _multŝargan_ sorĉbastonon je _+%1$d_ je la kosto de _%2$s ŝargo._
actors.hero.abilities.cleric.trinity.wand_use=Trinity forigos ĉi tiun sorĉbastonon je _+%1$d_ je la kosto de _%2$s ŝargo._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Ĉi tiu rolulo partoprenas duelon. Ili, kaj ĉiuj iliaj aliancanoj aŭ helpantoj, rajtas agi normale dum aliaj estas frostigitaj. ZXQPH1 ZXQZXQPH2 ZXQ La duelo daŭros dum difinita tempodaŭro, ĝis unu partoprenanto mortos, aŭ ĝis la partoprenantoj moviĝos pli ol 5 kahelojn for unu de la alia. ZXQPH3 ZXQZXQPH4 ZXQ Restantaj vicoj: ZXQPH0 ZXQ.
actors.hero.abilities.duelist.challenge$duelparticipant.name=duelpartoprenanto
actors.hero.abilities.duelist.challenge.ally_target=Vi povas nur defii malamikojn.
actors.hero.abilities.duelist.challenge.already_dueling=Vi povas esti en nur unu duelo samtempe.
actors.hero.abilities.duelist.challenge.desc=La Duelanto defias proksiman malamikon al duelo. Tiu malamiko estas devigita batali kontraŭ ŝi dum ĉiuj aliaj malamikoj estas provizore frostigitaj en la tempo.\n\nLa celo devas esti atingebla kaj ene de 5 kaheloj de la Duelanto. La duelo daŭras ĝis 10 vicoj pasas, la malamiko mortas, aŭ la Duelanto estas pli ol 5 kahelojn for de la malamiko.\n\nFrostigitaj malamikoj estas nevundeblaj. La aliancanoj de la Duelanto ne estas frostigitaj per ĉi tiu kapablo, sed se estro estas celita, ĝiaj helpantoj ankaŭ ne estos frostigitaj.
actors.hero.abilities.duelist.challenge.distant_target=Tiu malamiko estas tro malproksima por defii.
actors.hero.abilities.duelist.challenge.name=defio
actors.hero.abilities.duelist.challenge.prompt=Elektu malamikon por defii
actors.hero.abilities.duelist.challenge.short_desc=La Duelanto _Defias_ proksiman malamikon al duelo, provizore frostigante ĉiujn aliajn malamikojn.
actors.hero.abilities.duelist.challenge.unreachable_target=Vi devas povi atingi vian celon.
actors.hero.abilities.duelist.elementalstrike.desc=La Duelanto frapas malamikon aŭ lokon, plenumante regulan atakon, kiu garantiite trafos, kaj disvastigante magian efikon, kiu vojaĝas ĝis 4 kahelojn en 65-grada konuso. Ĉi tiu magia efiko varias laŭ la sorĉo sur la ĉefa armilo de la Duelanto.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Elementa atako sen sorĉo ellasos malgrandan eksplodon de magio, kaŭzante 6-12 damaĝon al ĉiuj malamikoj en atingodistanco.
actors.hero.abilities.duelist.elementalstrike.name=elementa atako
actors.hero.abilities.duelist.elementalstrike.short_desc=La Duelanto plenumas _Elementan Baton_, disvastigante efikon en konusa AOE bazita sur ŝia armilsorĉo.
actors.hero.abilities.duelist.feint.bad_location=Vi ne povas moviĝi al tiu loko.
actors.hero.abilities.duelist.feint.desc=La Duelanto ŝajnigas atakon dum ĝi kuras al apuda kahelo, lasante momentan restan bildon de si mem. Malamikoj, kiuj atakis la Duelanton, anstataŭe atakos ŝian restan bildon. \n\nMalamikoj, kiuj atakas la restan bildon, konfuziĝas, kio nuligas ilian sekvan agon kaj lasas ilin eksponitaj al surpriza atako.
actors.hero.abilities.duelist.feint.name=ŝajnmanovro
actors.hero.abilities.duelist.feint.prompt=Elektu lokon por rapidi al
actors.hero.abilities.duelist.feint.short_desc=La Duelanto _Ŝajnigas_, ŝajnigante atakon dum ĝi kuras al apuda kahelo. Malamikoj atakos ŝian postbildon, lasante ilin malfermaj al kontraŭatako.
actors.hero.abilities.duelist.feint.too_far=Tiu loko ne estas apud vi.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=La Ĉasistino estas nelonge povigita, pliigante ŝian movrapidecon kaj atakrapidecon per ŝia arko. \n\nRestantaj turnoj: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=la potenco de la naturo
actors.hero.abilities.huntress.naturespower.desc=La Ĉasistino provizore povigas sin kaj sian arkon per la povo de la naturo! Ĉi tio daŭras 8 vicojn. \n\nDum ĉi tiu tempo, la Ĉasistino moviĝas je 2-obla rapideco kaj atakas 33% pli rapide per sia arko. La kromaj arkaj efikoj ne ekiĝas se la Kaŝpafisto uzas siajn specialajn atakojn.
actors.hero.abilities.huntress.naturespower.name=la potenco de la naturo
actors.hero.abilities.huntress.naturespower.short_desc=La Ĉasistino alvokas _la Potencon de la Naturo_, pliigante sian movrapidecon kaj la pafrapidecon de sia arko por mallonga tempo.
actors.hero.abilities.huntress.spectralblades.desc=La Ĉasistino ĵetas fantoman klingon al malamiko, kiu agas kiel distanca atako de ŝia manbatalarmilo. Ĉiuj normalaj efikoj de manbatalarmilo aktiviĝos, inkluzive de sorĉoj.
actors.hero.abilities.huntress.spectralblades.name=spektraj klingoj
actors.hero.abilities.huntress.spectralblades.short_desc=La Ĉasistino ĵetas _Spektrajn Klingojn_ al celo, kaŭzante damaĝon depende de ŝia nuntempe ekipita manbatalarmilo.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Magia akcipitro, alvokita de la Ĉasistino. Ĝi brilas hele etere blue, ĝia kapo konstante ŝoviĝas dum ĝi esploras la areon. \n\nKvankam ĝi ne estas vere batalanto, ĝia rapideco kaj vidkapablo igas ĝin bonega por gvati kaj malatentigi malamikojn.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Garantiitaj restantaj evitadoj: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Restantaj vicoj: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Via akcipitro moviĝas por ataki!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Via akcipitro moviĝas al tiu pozicio.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Via akcipitro moviĝas por sekvi vin.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Vi povas trovi ĉi tiun rolulon kun specifa heroo-kiraso-kapablo.
actors.hero.abilities.huntress.spirithawk$hawkally.name=spirita akcipitro
actors.hero.abilities.huntress.spirithawk.desc=La Ĉasistino alvokas spiritakcipitran familiarulon, kiun oni povas direkti per reuzado de la kapablo dum ĝi estas alvokita. La akcipitro daŭras 100 vicojn, direkti la akcipitron ne kostas ian ajn ŝargon. \n\nLa akcipitro havas minimuman sanon kaj atakan potencon, sed estas rapida, evitema kaj preciza. Ĝi ĉiam dividas sian tutan vidkampon kun la Ĉasistino. Ĝi estas imuna kontraŭ ĉiuj are-ligitaj efikoj, kiel fajro kaj venena gaso. Ĝi ne atakos krom se specife direktita.
actors.hero.abilities.huntress.spirithawk.name=spirita akcipitro
actors.hero.abilities.huntress.spirithawk.no_space=Ne estas libera spaco apud vi.
actors.hero.abilities.huntress.spirithawk.short_desc=La Ĉasistino alvokas familiarulon _Spirit Hawk_, kiu povas helpi ŝin gvati lokojn kaj malatentigi malamikojn.
actors.hero.abilities.mage.elementalblast.desc=La Magiisto elsendas magian eksplodon, kiu kovras cirklan regionon ĝis 4 kahelojn for kaj kaŭzas ĝis 15-25 damaĝon. La specifa efiko de la elementa eksplodo varios laŭ la sorĉbastono enmetita en la bastonon de la Magiisto.
actors.hero.abilities.mage.elementalblast.generic_desc=La efiko de elementa eksplodo estos simila al la efiko de la sorĉbastono kiam ĝi estas frapita al malamiko aŭ aliancano.
actors.hero.abilities.mage.elementalblast.name=elementa eksplodo
actors.hero.abilities.mage.elementalblast.no_staff=Vi ne povas uzi ĉi tiun kapablon sen via stabo.
actors.hero.abilities.mage.elementalblast.short_desc=La Magiisto eligas _Elementan Eksplodon_ el sia bastono, kovrante grandan areon ĉirkaŭ li en efiko kiu varias laŭ la sorĉbastono en lia bastono.
actors.hero.abilities.mage.warpbeacon.depths=Vi ne povas varpiĝi inter profundoj!
actors.hero.abilities.mage.warpbeacon.desc=La Magiisto metas signostangon, al kiu oni povas poste teletransportiĝi laŭvole. Meti la signostangon daŭras 1 vicon, sed teletransportiĝi al ĝi estas tuja. \n\nLa Magiisto defaŭlte ne povas teletransportiĝi inter etaĝoj, aŭ uzi la signostangon por atingi nealireblajn lokojn kiel ŝlositajn ĉambrojn. La Magiisto povas teletransportiĝi en malamikojn, kio puŝos ilin flanken.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Vi ne povas meti signostangon tien!
actors.hero.abilities.mage.warpbeacon.locked_floor=Vi ne povas forlasi ŝlositan etaĝon!
actors.hero.abilities.mage.warpbeacon.name=varpsignalo
actors.hero.abilities.mage.warpbeacon.short_desc=La Magiisto metas _Misforman Signostangon_ ĉe sia nuna loko, al kiu li povas tuj teletransportiĝi reen.
actors.hero.abilities.mage.warpbeacon.too_far=Tiu loko estas tro malproksima!
actors.hero.abilities.mage.warpbeacon.window_cancel=nuligi
actors.hero.abilities.mage.warpbeacon.window_clear=klara signostango
actors.hero.abilities.mage.warpbeacon.window_desc=Via lumturo estas nuntempe lokita sur la etaĝo %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teletransporti al signostango
actors.hero.abilities.mage.wildmagic.desc=La Magiisto liberigas la potencon de siaj sorĉbastonoj, hazarde pafante ilin ĝis 4 fojojn en ununura vico. La bastono de la Magiisto ne estas inkludita en ĉi tiu efiko. \n\nĈiu sorĉbastono ankaŭ havas sian nivelon pliigita je 2, ĝis +3. Ĉi tiu kapablo uzas duonon de sorĉbastona ŝargo por ĉiu pafo, kaj neniu sorĉbastono povas esti lanĉita pli ol 2 fojojn.
actors.hero.abilities.mage.wildmagic.name=sovaĝa magio
actors.hero.abilities.mage.wildmagic.no_wands=Vi ne havas sorĉbastonojn por telefazi!
actors.hero.abilities.mage.wildmagic.short_desc=La Magiisto malkaŝas la _Sovaĝan Magion_ enhavitan en siaj sorĉbastonoj, hazarde pafante ilin plurfoje al elektita celo dum ununura turno.
actors.hero.abilities.ratmogrify$transmograt.desc=Ĉi tiu malamiko transformiĝis en raton. Granda plibonigo, laŭ mia opinio! - Rat King
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrigita %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Mortigita de: ratmogrifita malamiko
actors.hero.abilities.ratmogrify.cant_transform=Vi ne povas ratmogrifi tion!
actors.hero.abilities.ratmogrify.desc=La heroo transformas malamikon en raton dum 6 vicoj! Estroj, aliancanoj kaj ratoj ne povas esti ratmogrigitaj.\n\nRatmogrigitaj malamikoj retenas siajn originalajn statistikojn, sed ne havas iujn ajn kapablojn.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=La heroo _Ratmogrifas_ malamikon! Tio provizore transformas lin en raton sen kapabloj.
actors.hero.abilities.ratmogrify.too_strong=Tiu malamiko estas tro forta por ratmogrifi!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Ĉi tiu malamiko estis markita, kaŭzante al ili ricevi 25%% kroman damaĝon, sed ankaŭ igante ilin nekapablaj morti ĝis la marko finiĝas.\n\nRestantaj turnoj: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=markita por morto
actors.hero.abilities.rogue.deathmark.ally_target=Vi povas marki nur malamikojn
actors.hero.abilities.rogue.deathmark.desc=La Fripono metas markon sur elektitan malamikon, kaŭzante al ili 25% plian damaĝon. La marko aplikiĝas tuj kaj daŭras 5 vicojn. \n\nMarkitaj malamikoj ricevas kroman damaĝon sed ne povas morti ĝis la marko eksvalidiĝas. Se malamiko havas 0 vivopoentojn kiam la marko finiĝas, ili tuj mortos.
actors.hero.abilities.rogue.deathmark.name=mortmarko
actors.hero.abilities.rogue.deathmark.short_desc=La Fripono metas _Mortosignon_ sur elektitan malamikon. Markitaj malamikoj ricevas kroman damaĝon, sed ne povas morti ĝis la marko finiĝas.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Kopio de la Fripono, farita el ombra mallumo. Ĝi staras tute senmove, kun malplenaj okuloj kaj etaj fadenoj de mallumo leviĝantaj el ĝi kiel vaporo. \n\nLa klono ne estas perfekta kopio de la Fripono, sed tamen estas deca batalanto, kaj povas profiti de la ekipaĵo de la Fripono kun la ĝustaj talentoj.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Via klono moviĝas por ataki!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Via klono moviĝas al tiu pozicio.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Via klono moviĝas por sekvi vin.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Vi povas trovi ĉi tiun rolulon kun specifa heroo-kiraso-kapablo.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ombrofiulo
actors.hero.abilities.rogue.shadowclone.desc=La Fripono alvokas ombran imitiston de si mem, kiun oni povas direkti por helpi lin en batalo. Direkti la ombran klonon ne kostas ian ajn ŝargon. \n\nLa klono havas 80 vivpovojn, neniun kirason, kaj kaŭzas 10-20 damaĝon. Ĉiuj ĉi tiuj trajtoj povas esti plibonigitaj per talentoj, tiel ke la klono profitas de armiloj kaj kiraso, kiujn la heroo havas.
actors.hero.abilities.rogue.shadowclone.name=ombroklono
actors.hero.abilities.rogue.shadowclone.short_desc=La Fripono alvokas _Ombran Klonon_, kiun oni povas direkti por helpi lin en batalo.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Iel, malamikoj facile konvinkiĝas, ke ĉi tiu ligna forlogaĵo estas la vera Fripono!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Vi povas trovi ĉi tiun rolulon kun specifa heroo-kiraso-kapablo.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=ligna forlogaĵo
actors.hero.abilities.rogue.smokebomb.desc=La Fripono ĵetas fumobombon kaj palpebrumas ĝis 6 kahelojn for. Li povas palpebrumi tra danĝeroj kaj malamikoj, sed ne tra solida tereno kiel muroj.\n\nMalamikoj apud la malnova pozicio de la Fripono estos blindigitaj dum 5 vicoj.
actors.hero.abilities.rogue.smokebomb.fov=Vi povas salti nur al malplena loko en via vidkampo.
actors.hero.abilities.rogue.smokebomb.name=fumobombo
actors.hero.abilities.rogue.smokebomb.prompt=Elektu lokon por salti al
actors.hero.abilities.rogue.smokebomb.short_desc=La Fripono ĵetas _Fumobombon_ dum li palpebrumas for. Li blindigas malamikojn proksime de sia malnova loko.
actors.hero.abilities.warrior.endure$enduretracker.desc=La Militisto nun kaŭzas kromdamaĝon bazitan sur la damaĝo, kiun li suferis.\n\nKromdamaĝo: %1$d\nMaldekstre trafas: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=eltenivo
actors.hero.abilities.warrior.endure.desc=La Militisto eltenas dum 3 vicoj, ricevante duonon de la damaĝo de ĉiuj fontoj. Ĉi tiu redukto aplikiĝas antaŭ damaĝorezistaj efikoj kiel kiraso.\n\nPost eltenado, la sekva trafo de la militisto ene de 10 vicoj gajnas kromdamaĝon. Ĉi tiu kromdamaĝo egalas al duono de la tuta damaĝo kaŭzita al li dum eltenado, antaŭ iuj ajn damaĝoreduktaj efikoj!\n\nSe la Militisto havas ian ajn kombon, uzi ĉi tiun kapablon pliigas ĝian restantan tempon je 3 vicoj.
actors.hero.abilities.warrior.endure.name=elteni
actors.hero.abilities.warrior.endure.short_desc=La Militisto _Eltenas_, saltante plurajn vicojn sed akirante altan damaĝreziston. Li tiam kaŭzas kromdamaĝon bazitan sur tio, kion li eltenis.
actors.hero.abilities.warrior.heroicleap.desc=La militisto saltas al celita loko, preterpasante iujn ajn malamikojn aŭ danĝerojn survoje. Li tamen ne povas salti super murojn aŭ alian solidan terenon.
actors.hero.abilities.warrior.heroicleap.name=heroa salto
actors.hero.abilities.warrior.heroicleap.prompt=Elektu direkton por salti
actors.hero.abilities.warrior.heroicleap.short_desc=La Militisto plenumas _Heroan Salton_ al celita loko, ŝvebante super malamikoj kaj danĝeroj.
actors.hero.abilities.warrior.shockwave.desc=La Militisto frapas la teron, produktante ŝokondon kiu vojaĝas ĝis 5 kahelojn en 60-grada konuso.\n\nMalamikoj kaptitaj en ĉi tiu ŝokondo estas kripligitaj dum 5 vicoj. Ili ankaŭ ricevas 5-10 damaĝon, plus plian 1-2 damaĝon por ĉiu fortopoento kiun la Militisto havas super 10.
actors.hero.abilities.warrior.shockwave.name=ŝokondo
actors.hero.abilities.warrior.shockwave.short_desc=La Militisto eligas _Ŝokondon_ en konusa areo-okazo frapante la teron. Malamikoj kaptitaj en la ŝokondo estas difektitaj kaj kripligitaj.
actors.hero.hero.key_distracted=Vi ne povas tute malfermi la seruron, vi devos daŭre provi.
actors.hero.hero.leave=Vi ankoraŭ ne povas foriri, la resto de la kelkarcero atendas sube!
actors.hero.hero.level_cap=Vi ne povas plifortiĝi, sed viaj spertoj ja donas al vi ondon da potenco!
actors.hero.hero.level_up=Plibonigu vian nivelon!
actors.hero.hero.locked_chest=Ĉi tiu kesto estas ŝlosita kaj vi ne havas kongruan ŝlosilon.
actors.hero.hero.locked_door=Vi ne havas kongruan ŝlosilon.
actors.hero.hero.name=vi
actors.hero.hero.new_level=Plibonigu vian nivelon! +Precizeco, +Evitado, +5 Vivpoentoj!
actors.hero.hero.new_talent=+1 Talenta Poento!
actors.hero.hero.noticed_smth=Vi rimarkis ion.
actors.hero.hero.pain_resist=La doloro helpas vin rezisti la deziron dormi.
actors.hero.hero.revive=La Anĥo eksplodas per viviga energio!
actors.hero.hero.search=serĉo
actors.hero.hero.search_distracted=Malfacilas koncentriĝi, serĉado estas laciga.
actors.hero.hero.unspent=Vi havas neeluzitajn talentpoentojn!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=vi ne povas porti: %s.
actors.hero.hero.you_now_have=vi prenis: %s.
actors.hero.heroclass.cleric=kleriko
actors.hero.heroclass.cleric_desc=La Kleriko komencas per _unika sankta volumo_, kiun ili povas uzi por ĵeti diversajn sorĉojn.\n\nPlej multaj el la talentoj de la Kleriko fokusiĝas al lernado aŭ plibonigo de sorĉoj.\n\nLa Kleriko ankaŭ komencas per _klabo_, ŝtofa kiraso, akvosako kaj velura saketo.\n\nLa Kleriko aŭtomate identigas:\n_-_ Volvlibroj de Identigo\n_-_ Pocioj de Pureco\n_-_ Volvlibroj de Forigo de Malbeno
actors.hero.heroclass.cleric_desc_short=La Kleriko estas dia sorĉisto kiu uzas sian unikan _sanktan volumon_ por kanaligi dian magion. Ili povas _lerni kaj plibonigi sorĉojn_ per talentoj.
actors.hero.heroclass.cleric_unlock=Por malŝlosi la Klerikon _plene purigu la malbenon sur iu ajn peco de malbenita ekipaĵo._
actors.hero.heroclass.duelist=duelanto
actors.hero.heroclass.duelist_desc=La Duelanto komenciĝas per _unika rapiro_ kun speciala kapablo kiu reŝargiĝas laŭlonge de la tempo.\n\nĈiu armilo en la ludo havas _malsaman specialan kapablon_ kiun la Duelanto povas uzi.\n\nLa Duelanto ankaŭ komenciĝas per _du ĵetpikiloj_, ŝtofa kiraso, akvosako, kaj velura saketo.\n\nLa Duelanto aŭtomate identigas:\n_-_ Volvlibroj de Identigo\n_-_ Pocioj de Forto\n_-_ Volvlibroj de Spegula Bildo
actors.hero.heroclass.duelist_desc_short=La Duelanto estas armilmajstro, kiu povas uzi sian armilon por ekigi _specialan armilkapablon_. Ĉi tiu speciala kapablo estas _malsama por ĉiu armilo_.
actors.hero.heroclass.duelist_unlock=Por malŝlosi la Dueliston _ekipu armilon de nivelo 2 aŭ pli alta sen fortpuno._
actors.hero.heroclass.huntress=ĉasistino
actors.hero.heroclass.huntress_desc=La Ĉasistino komencas per _unika spirita arko_, kiu povas pafi senfinan nombron da elvokitaj sagoj.\n\nLa Ĉasistino povas vojaĝi tra alta herbo _sen subpremi ĝin_.\n\nLa Ĉasistino ankaŭ komenciĝas per _fermitaj gantoj_, ŝtofa kiraso, akvosako, kaj velura saketo.\n\nLa Ĉasistino aŭtomate identigas:\n_-_ Volvlibroj de Identigo\n_-_ Pocioj de Menso-Vizio\n_-_ Volvlibroj de Lulkanto
actors.hero.heroclass.huntress_desc_short=La Ĉasistino estas majstro de ĵetarmiloj kaj havas _magian arkon_ kun senfinaj sagoj. Ŝi ankaŭ vojaĝas tra alta herbo _sen piedpremi ĝin_.
actors.hero.heroclass.huntress_unlock=Por malŝlosi la Ĉasistinon _trafu malamikojn per ĵetarmiloj 10 fojojn en unu ludo._
actors.hero.heroclass.mage=magiisto
actors.hero.heroclass.mage_desc=La Magiisto komencas per _unika bastono_, kiu reŝargiĝas signife pli rapide ol sorĉbastono kaj havas 1 plian ŝargon. La bastono _povas esti trapenetrita per iu ajn sorĉbastono_, kiun la Magiisto trovas en la kelkarcero.\n\nLa Magiisto ankaŭ komencas per _sorĉbastono de magia misilo_ trapenetrita en lian bastonon, ŝtofan kirason, akvosakon kaj veluran saketon.\n\nLa Magiisto aŭtomate identigas:\n_-_ Volvlibroj de Identigo\n_-_ Pocioj de Likva Flamo\n_-_ Volvlibroj de Plibonigo
actors.hero.heroclass.mage_desc_short=La Magiisto estas arkana fakulo kaj portas _magian bastonon_ kiu estas pli forta ol sorĉbastono. La bastono povas esti _trapenetrita per iu ajn sorĉbastono_ kiun la Magiisto trovas.
actors.hero.heroclass.mage_unlock=Por malŝlosi la Magiiston _uzu volvlibron de plibonigo por plifortigi objekton._
actors.hero.heroclass.rogue=fripono
actors.hero.heroclass.rogue_desc=La Fripono komencas per _unika Mantelo de Ombroj_, kiun li povas uzi por fariĝi nevidebla laŭvole.\n\nLa Fripono povas _detekti sekretojn kaj kaptilojn_ de pli granda distanco.\n\nLa Fripono ankaŭ komenciĝas per _ponardo_, _tri ĵettranĉiloj_, ŝtofa kiraso, akvosako, kaj velura saketo.\n\nLa Fripono aŭtomate identigas:\n_-_ Volvlibroj de Identigo\n_-_ Pocioj de Nevidebleco\n_-_ Volvlibroj de MagioMapado
actors.hero.heroclass.rogue_desc_short=La Fripono povas eviti malamikojn kaj ataki el nevidebleco uzante sian _mantelon de ombroj_. Li ankaŭ _detektas sekretojn kaj kaptilojn_ de pli granda distanco.
actors.hero.heroclass.rogue_unlock=Por malŝlosi la Friponon _plenumu 10 surprizajn atakojn en unu ludo._
actors.hero.heroclass.warrior=militisto
actors.hero.heroclass.warrior_desc=La Militisto komencas per _unika rompita sigelo_ kiu donas al li eksplodon de ŝirmado kiam li estas sub duono de sia sano. La sigelo povas esti movita inter kirasoj, kaj povas _transdoni unuopan plibonigon_ kun ĝi.\n\nLa Militisto ankaŭ komencas per _eluzita mallonga glavo_, _tri ĵetŝtonoj_, ŝtofa kiraso, akvosako, kaj velura saketo.\n\nLa Militisto aŭtomate identigas:\n_-_ Volvlibroj de Identigo\n_-_ Pocioj de Resanigo\n_-_ Volvlibroj de Kolerego
actors.hero.heroclass.warrior_desc_short=La Militisto eltenas ekstran damaĝon pro ŝirmado donita de lia _rompita sigelo_. La sigelo povas esti movita inter kirasoj kaj _transdonas unuopan plibonigon_.
actors.hero.heroclass.warrior_unlock=La Militisto estas aŭtomate malŝlosita.
actors.hero.herosubclass.assassin=insidmurdisto
actors.hero.herosubclass.assassin_desc=La Insidmurdisto preparas sian sekvan atakon kiam li fariĝas nevidebla. Ju pli longe li preparas sin, des pli potenca estos lia sekva atako. Preparo kreskas por ĝis 9 vicoj. \n\nPost preparado, la Insidmurdisto kaŭzas kroman damaĝon per sia sekva atako, povas palpebrumi al sia celo, kaj eĉ povas tuj mortigi malamikojn, kiuj estas sufiĉe malfortaj.
actors.hero.herosubclass.assassin_short_desc=La _Insidmurdisto_ povas prepari mortigan atakon dum li estas nevidebla. Ju pli longe li atendas, des pli potenca estos la atako.
actors.hero.herosubclass.battlemage=batalmagiisto
actors.hero.herosubclass.battlemage_desc=La Batalmagiisto gajnas kroman efikon kiam ajn li atakas en manbatalo per sia bastono, kvazaŭ lia bastono havus aldonan sorĉon. Ĉi tiuj efikoj dependas de la sorĉbastono, per kiu lia bastono estas trapenetrita, ĉiu sorĉbastono havas sian propran efikon. Aldone al la sorĉbastonefikoj, la bastono de la Batalmagiisto ankaŭ gajnos 0.5 ŝargojn kiam li atakas per ĝi.
actors.hero.herosubclass.battlemage_short_desc=La _Batalmagisto_ elvokas kromefikojn dum batalado en manbatalo per sia bastono. Ĉi tiuj efikoj dependas de la sorĉbastono, per kiu lia bastono estas trapenetrita.
actors.hero.herosubclass.berserker=berserkero
actors.hero.herosubclass.berserker_desc=La Berserkero akiras koleron kiam li ricevas fizikan damaĝon, inkluzive de damaĝo blokita de lia kiraso! Kolerego konstante malaperas laŭlonge de la tempo, sed pli malrapide se li havas malaltan sanon. \n\nKolerego povas igi la Berserkeron kaŭzi ĝis +50% damaĝon. Ĉe maksimuma kolero li povas freneziĝi, akirante eksplodon de ŝirmado kaj konservante sian koleron tiel longe kiel li havas ŝirmadon restanta. La ŝirmado skalas laŭ la nivelo de la kiraso de la berserkero, kaj povas esti grandege pliigita se li havas malaltan sanon. La Berserkero bezonas tempon por resaniĝi post kiam li freneziĝas.
actors.hero.herosubclass.berserker_short_desc=La _Berserker_ kreskigas koleron dum li ricevas damaĝon. Kolero pliigas lian damaĝon kaj povas esti aktivigita je 100% por kroma ŝirmado.
actors.hero.herosubclass.champion=ĉampiono
actors.hero.herosubclass.champion_desc=La Ĉampiono estas majstro de manbatalaj armiloj, kiu povas ekipi duarangan armilon aldone al sia ĉefa. Ŝiaj regulaj atakoj uzas ŝian ĉefan armilon, sed ŝi povas tuj interŝanĝi sian ĉefan armilon kaj uzi la kapablon de ambaŭ armiloj. \n\nŜi ankaŭ gajnas 2 pliajn maksimumajn armilkapablojn kaj +50% da armilkapablo-reŝarga rapido.
actors.hero.herosubclass.champion_short_desc=La _Ĉampiono_ povas uzi du armilojn kaj ricevas pli da armilŝargoj. Ŝiaj regulaj atakoj uzas ŝian ĉefan armilon, sed ŝi povas interŝanĝi armilojn kaj uzi la kapablon de ambaŭ armiloj.
actors.hero.herosubclass.freerunner=liberkuranto
actors.hero.herosubclass.freerunner_desc=Dum la Liberkuranto moviĝas, li konstruas amasojn da impeto. Li povas gajni ĝis 10 impetopoentojn post kurado dum 10 vicoj, sed rapide perdas ĝin se li ĉesas moviĝi. La liberkuranto povas eluzi sian impeton por komenci liberkuradon, dum 2 vicoj por ĉiu poento de impeto. \n\nDum liberkurado, la liberkuranto moviĝas je 2x rapido, kaj gajnas bonusan evitadon proporcie al sia nivelo. Post kiam liberkurado finiĝas, estas malvarmiĝtempo antaŭ ol impeto povas esti denove rekonstruita.
actors.hero.herosubclass.freerunner_short_desc=La _Liberkuranto_ akiras impeton dum kurado, kiun oni povas uzi por komenci liberkuradon. Tio donas al li kroman rapidon kaj evitmanieron por mallonga tempo.
actors.hero.herosubclass.gladiator=gladiatoro
actors.hero.herosubclass.gladiator_desc=La Gladiatoro konstruas unu poenton de kombo ĉiufoje kiam li sukcesas ataki per manbatalo aŭ ĵetarmilo. Se la Gladiatoro ne sukcesas ene de 5 vicoj (15 vicoj post mortigo), lia kombo restariĝas.\n\nDum li konstruas kombon, la Gladiatoro povas uzi diversajn kapablojn, kiuj garantiite trafos:\n2 Kombo: repuŝas malamikon, konservas kombon\n4 Kombo: kaŭzas damaĝon bazitan sur kiraso\n6 Kombo: parado, konservas kombon\n8 Kombo: damaĝas celon kaj proksimajn malamikojn\n10 Kombo: ataku unufoje por ĉiu kombo
actors.hero.herosubclass.gladiator_short_desc=La _Gladiatoro_ konstruas kombon kiam li faras sukcesajn atakojn. Li povas uzi kombon por unikaj kapabloj.
actors.hero.herosubclass.monk=monaĥo
actors.hero.herosubclass.monk_desc=La Monaĥo estas majstro de fizika tekniko. Dum ŝi venkas malamikojn, ŝi akiras energion, kiu povas esti uzata por diversaj defensivaj kaj utilec-fokusitaj kapabloj. Ĉi tiu energio ne paliĝas laŭlonge de la tempo, sed havas limon bazitan sur la nivelo de la Monaĥo. ZXQPH0 ZXQZXQPH1 ZXQ1 Energio: rapide frapu per pugnoj ZXQPH2 ZXQ2 Energio: fokusu por eviti la sekvan atakon ZXQPH3 ZXQ3 Energio: tuj kuregu proksimen ZXQPH4 ZXQ4 Energio: forbatu malamikon ZXQPH5 ZXQ5 Energio: meditu por forigi statusojn kaj restarigi sorĉbastonon kaj artefaktan ŝargon
actors.hero.herosubclass.monk_short_desc=La _Monaĥo_ konstruas energion dum batalado. Ĉi tiu energio povas esti elspezita por diversaj unikaj kapabloj.
actors.hero.herosubclass.paladin=paladino
actors.hero.herosubclass.paladin_desc=La Paladino akiras gamon da novaj kaj plibonigitaj sorĉoj, kiuj emfazas manbatalon kaj sinergion kun armiloj kaj kirasoj. \n\nLa sorĉoj _Sankta Armilo_ kaj _Sankta Gardo_ de la Paladino donas pli grandajn gratifikojn, jam ne superregas ekzistantajn sorĉojn kaj ideogramojn, kaj povas esti etenditaj per gisado de aliaj sorĉoj. \n\nLa Paladino ankaŭ akiras la sorĉon _Bati_, kiu permesas al ili plenumi garantiitan manbatalon kun gratifika damaĝo kaj sorĉpovo.
actors.hero.herosubclass.paladin_short_desc=La _Paladino_ akiras novajn mallongdistancajn sorĉojn kaj povigitajn versiojn de sankta armilo kaj protekto.
actors.hero.herosubclass.priest=pastro
actors.hero.herosubclass.priest_desc=La Pastro akiras gamon da novaj kaj plibonigitaj sorĉoj, kiuj emfazas distancan batalon kaj sinergion kun magiaj objektoj.\n\nLa Pastro povas uzi _Gvidan Lumon_ senpage unufoje ĉiujn 50 turnojn, lumigas malamikojn rekte celitajn de iu ajn el iliaj sorĉoj, kaj povas konsumi la lumigon per aliancanoj, sorĉbastonoj kaj kelkaj artefaktoj por kroma damaĝo egala al ilia nivelo + 5.\n\nLa Pastro ankaŭ akiras la sorĉon _Radiance_, kiu dispelas mallumon kaj influas ĉiujn videblajn malamikojn, aktivigante kaj aplikante lumigon kaj nelonge miregigante ilin je la kosto de 2 ŝargoj.
actors.hero.herosubclass.priest_short_desc=La _Pastro_ akiras novajn longdistancajn sorĉojn kaj plifortigitan version de gvidlumo.
actors.hero.herosubclass.sniper=kaŝpafisto
actors.hero.herosubclass.sniper_desc=La Kaŝpafisto estas majstro de distanca batalado, kies distancatakoj trapikas malamikan kirason. Kiam ŝi atakas malamikon per ĵetarmilo, ŝi metas kaŝpafistan markon sur lin, kio permesas al ŝi daŭrigi per speciala atako per sia arko. Ĉi tiu speciala atako varias laŭ kiel ŝia arko estas plifortigita. \n\nNeplifortigita arko pafos momentfoton, kiu kaŭzas reduktitan damaĝon sed pafas tuj. Rapida arko pafos vicon de tri sagoj, kiuj kaŭzas reduktitan damaĝon, ankoraŭ povas aktivigi sorĉojn, kaj bezonas 1 vicon por pafi. Difekta arko pafos kaŝpafiston, kiu garantiite trafos, kaŭzas bonusan damaĝon bazitan sur distanco, kaj bezonas 2 vicojn por pafi.
actors.hero.herosubclass.sniper_short_desc=La _Kaŝpafisto_ povas trapiki kirason per siaj distancatakoj. Post frapado per ĵetarmilo ŝi povas daŭrigi per speciala atako per sia arko.
actors.hero.herosubclass.warden=gardisto
actors.hero.herosubclass.warden_desc=La Gardisto havas fortan ligon al la naturo, kiu donas al ŝi diversajn kromefikojn rilatajn al herbo kaj plantoj. Ŝi kapablas vidi tra alta kaj sulkiĝinta herbo kvazaŭ ĝi estus malplena spaco. \n\nLa Gardisto igas herbon ĝermi ĉirkaŭ ĉiu semo, kiun ŝi ĵetas aŭ plantas, kaj akiras specialajn efikojn kiam ŝi piedpremas plantojn. Ĉi tiuj specialaj efikoj anstataŭigas la regulajn plantefikojn, kio signifas, ke neniu planto estas damaĝa por ŝi paŝi sur ĝin.
actors.hero.herosubclass.warden_short_desc=La _Gardisto_ povas vidi tra alta herbo kaj gajnas kromefikojn kiam ŝi plantas semojn kaj subpremas plantojn.
actors.hero.herosubclass.warlock=sorĉisto
actors.hero.herosubclass.warlock_desc=La Sorĉisto havas ŝancon kaŭzi animmarkon al roluloj kiam li uzas sorĉbastonojn sur ilin. La ŝanco apliki animmarkon kaj ĝia daŭro pliiĝas kun la sorĉbastona nivelo.\n\nKiam malamiko estas animmarkita, la Sorĉisto resanigos 2 vivpoentojn por po 5 damaĝoj, kiujn li kaŭzas al ili, sed nur per atakoj de manbatalo aŭ ĵetarmiloj, ne de sorĉbastonoj!
actors.hero.herosubclass.warlock_short_desc=La _Sorĉisto_ havas ŝancon animmarki malamikojn per siaj sorĉbastonoj. Li resaniĝos kiam ajn li kaŭzas fizikan damaĝon al markitaj malamikoj.
actors.hero.spells.auraofprotection$aurabuff.desc=La Paladino radias protektan energion ĉirkaŭ si.\n\nĈiu proksima aliancano (inkluzive de la Paladino mem) ricevas reduktitan damaĝon kaj akiras la efikon de la kirasa glifo de la Paladino kun pliigita potenco.\n\nRestantaj Turnoj: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aŭro de protekto
actors.hero.spells.auraofprotection.desc=La Paladino komencas radii protektan energion en brilanta aŭro ĉirkaŭ si dum 20 vicoj. Ĉiu aliancano ene de 2 kaheloj de la Paladino (inkluzive de si mem) ricevas %1$d%% malpli da damaĝo, kaj akiras la efikon de la kirasa glifo de la Paladino je +%2$d%% potenco.\n\n Ĉi tiu damaĝredukto okazas antaŭ aliaj damaĝreduktaj efikoj (ekz. kiraso). La potencakcelo de la glifo ĉiam aplikiĝos, sed ĉi tiu sorĉo ne povas igi la glifon de la Paladino aplikiĝi pli ol unufoje se rolulo jam profitas de ĝi (ekz. la Paladino mem, aŭ prisma bildo).
actors.hero.spells.auraofprotection.name=aŭro de protekto
actors.hero.spells.auraofprotection.short_desc=Plibonigas defendon por Paladino kaj proksimaj aliancanoj.
actors.hero.spells.beamingray$beamingrayboost.desc=Ĉi tiu aliancano estis ĵus teletransportita de Radianta Radio, donante al ili kromdamaĝon kontraŭ la plej proksima malamiko post la teletransporto. Potenco de Multaj ankaŭ ne eksvalidiĝos kiam ĉi tiu plifortigo estas aktiva. \n\nRestantaj Turnoj: %s.
actors.hero.spells.beamingray$beamingrayboost.name=radianta radio
actors.hero.spells.beamingray.desc=La Kleriko kanaligas la potencon sur sia aliancano en lumradion, kiu teletransportas ilin al loko. Se la radio kolizias kun malamiko, ĝi lokos la aliancanon proksimen kaj direktos ilin al la malamiko. \n\nLa radio havas maksimuman atingon de %1$d kaheloj, kaj pliigos la kromdamaĝon de Potenco de Multaj al +%2$d%% dum 10 turnoj kontraŭ la plej proksima malamiko ene de 4 kaheloj. Teletransporta radio eĉ povas teletransporti normale senmovajn aliancanojn, sed ĝia atingo estas duonigita en ĉi tiuj kazoj.
actors.hero.spells.beamingray.name=radianta radio
actors.hero.spells.beamingray.no_space=Ne estas spaco por ke via aliancano aperu tie.
actors.hero.spells.beamingray.out_of_range=Tiu loko estas ekster atingodistanco.
actors.hero.spells.beamingray.short_desc=Teleportas vian aliancanon kaj donas kromdamaĝon.
actors.hero.spells.blessspell.desc=La Kleriko metas sanktan benon sur sin mem aŭ alian rolulon, kiun ili povas vidi. \n\nKiam ĝi estas uzata sur si mem, la efiko estas pli malforta, donante al %1$d vicojn da beno kaj %2$d baron. \n\nKiam ĝi estas uzata sur aliajn rolulojn, la sorĉo estas pli potenca, donante al %3$d vicojn da beno kaj %4$d resanigon. Troa resanigo estas konvertita en baron.
actors.hero.spells.blessspell.name=beni
actors.hero.spells.blessspell.short_desc=Benas kaj ŝirmas Klerikon, benas kaj resanigas aliajn.
actors.hero.spells.bodyform$bodyformbuff.desc=La korpoformo de Triunuo nuntempe donas al vi la potencon de sorĉo aŭ glifo, kvazaŭ vi havus ĝin ekipita sur via nuna armilo aŭ kiraso.\n\nNotu, ke korpoformo ne povas provizi alian kopion de efiko, de kiu vi jam profitas.\n\nAktuala Efiko: %1$s.\n\nRestaj Turnoj: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=korpoformo
actors.hero.spells.bodyform.desc=La Kleriko elektas sorĉon aŭ glifon, kiun ili identigis ĉi-foje, kaj plenigas Triunuon per ĝia efiko. ZXQPH1 ZXQZXQPH2 ZXQKiam Triunuo estas uzata, la Kleriko akiras la efikon de la elektita sorĉo aŭ glifo dum ZXQPH0 ZXQ vicoj. Ĉi tiu provizora sorĉo aŭ glifo funkcios kun iu ajn efiko, kiun regula sorĉo aŭ glifo havus. ZXQPH3 ZXQZXQPH4 ZXQĈi tiu sorĉo anstataŭigas ajnan alian korpan efikon, per kiu Triunuo estas nuntempe plenigita.
actors.hero.spells.bodyform.name=korpoformo
actors.hero.spells.bodyform.short_desc=Asignas Triunuon al sorĉo aŭ glifo.
actors.hero.spells.cleanse.desc=La Kleriko forigas ĉiujn malutilajn statusajn efikojn sur si mem kaj videblajn aliancanojn. Post la fino de la sorĉo, ĉiuj trafitaj roluloj ankaŭ akiras %1$d vicojn da imuneco kontraŭ malfortiĝo, kaj %2$d baron.
actors.hero.spells.cleanse.name=purigi
actors.hero.spells.cleanse.short_desc=Forigas malfortigojn kaj donas ŝirmadon.
actors.hero.spells.clericspell.charge_cost=Kosto de ŝarĝo: %d
actors.hero.spells.clericspell.invalid_enemy=Vi ne povas celi tiun malamikon.
actors.hero.spells.clericspell.invalid_target=Vi ne povas celi tiun lokon.
actors.hero.spells.clericspell.no_target=Tie ne estas celo.
actors.hero.spells.clericspell.prompt=Elektu celon
actors.hero.spells.divineintervention.desc=La Kleriko verŝas grandegan kvanton da potenco el sia volumo en sin mem kaj aliancanojn, akcelante ĉiujn al %1$d ŝirmado kaj etendante Ĉielirintan Formon je %2$d vicoj. La nekredebla defenda povo de ĉi tiu sorĉo estas pesita kontraŭ ĝia tre alta ŝarga kosto.\n\nSame kiel aliaj ŝirmadoj donitaj de ĉielirita formo, ĉi tiu ŝirmado normale ne kadukiĝas, sed tuj eksvalidiĝos kiam la ĉielirita formo finiĝas.
actors.hero.spells.divineintervention.name=dia interveno
actors.hero.spells.divineintervention.short_desc=Grandega ŝildo-pliigo al Kleriko kaj aliancanoj.
actors.hero.spells.divinesense$divinesensetracker.desc=Ĉi tiu rolulo provizore kapablas vidi aliajn proksimajn estaĵojn per sia menso!\n\nRestantaj turnoj: %s.
actors.hero.spells.divinesense$divinesensetracker.name=dia sento
actors.hero.spells.divinesense.desc=La kleriko enfokusigas siajn sensojn al sia ĉirkaŭaĵo, akirante mensan vidon kun kahela distanco de %d dum 50 turnoj. Ĉi tiu sorĉo ne bezonas tempon por gisi.
actors.hero.spells.divinesense.name=dia sento
actors.hero.spells.divinesense.short_desc=Akiri provizoran mensan vidon en larĝa gamo.
actors.hero.spells.flash.desc=La Kleriko kanaligas sian ĉieliritan formon al proksima loko kaj teletransportas tien. Fulmo povas teletransporti la Klerikon al iu ajn malkovrita loko, kiu estas en atingodistanco kaj neokupita. Ĉi tiu sorĉo kostas pli da volumŝargoj ĉiufoje kiam ĝi estas uzata en la sama ĉielirita formo.
actors.hero.spells.flash.name=fulmo
actors.hero.spells.flash.prompt=Elektu Lokon
actors.hero.spells.flash.short_desc=Teletransportiĝu al proksima loko.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=La Pastro povos denove uzi Gvidan Lumon senpage post kiam pasos 50 vicoj. \n\nRestantaj vicoj: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Gvida Lumo
actors.hero.spells.guidinglight$illuminated.desc=Ĉi tiu rolulo brilas pro tio, ke ĝi estas trafita de gvida lumo. Kvankam la brilo ne estas sufiĉe forta por heligi la ĉirkaŭan areon, la magia efiko multe faciligos la surteriĝon de batoj sur ilin por la Kleriko.
actors.hero.spells.guidinglight$illuminated.desc_generic=Aliaj herooj ankoraŭ povas uzi lumigitan por profiti de la talento bruliga lumo, sed ne gajnos precizecon.
actors.hero.spells.guidinglight$illuminated.desc_priest=La Pastro povas plie konsumi lumigitan per radianco, sorĉbastonan ŝokon, baton de aliancano, aŭ efikojn de iuj artefaktoj. Uzante lumigitan tiamaniere kaŭzos kroman magian damaĝon egalan al la nivelo de la Pastro + 5.
actors.hero.spells.guidinglight$illuminated.name=lumigita
actors.hero.spells.guidinglight.desc=La Kleriko pafas sagon de magia energio, kiu trafas celon, kaŭzante 2-8 damaĝon kaj lumigante ĝin. La sekva ne-ŝarĝita fizika atako farita kontraŭ lumigita malamiko certe trafos ĝin.
actors.hero.spells.guidinglight.desc_priest=_Ĉi tiu sorĉo estas pli potenca kiam ĝi estas ĵetita de la Pastro._ La unua ĵeto de la sorĉo ĉiujn 50 turnojn kostas neniujn volumŝargojn, kaj lumigo estos konsumita de radianco, sorĉbastonoj, aliaj roluloj kaj artefaktoj, kiuj rekte efikas al malamikoj. Kiam lumigo estas uzata tiamaniere, ĝi kaŭzas kroman magian damaĝon egalan al la nivelo de la Pastro + 5.
actors.hero.spells.guidinglight.name=Gvida Lumo
actors.hero.spells.guidinglight.short_desc=Kaŭzas distanc-magian damaĝon kaj garantias trafon.
actors.hero.spells.hallowedground$hallowedterrain.desc=La grundo estas sanktigita ĉi tie. Sanktigita grundo malrapidigas malamikojn, resanigas aliancanojn, kaj kaŭzas herbon disvastiĝi.
actors.hero.spells.hallowedground.desc=La Pastro fokusas sian dian magion en la proksiman grundon, kreante areon de sankta tereno dum 20 vicoj.\n\nKiam ĝi estas ĵetita, ĉi tiu sorĉo resanigas ĉiujn aliancanojn je 15 vivpoentoj (sanaj aliancanoj kaj la Pastro ricevas ŝirmadon), nelonge enradikigas malamikojn, kaj disvastigas mallongan herbon.\n\nLa sankta tereno resanigas aliancanojn je 1 vivpoentoj po vico (sanaj aliancanoj kaj la Pastro ricevas ŝirmadon), kripligas malamikojn, kaj hazarde kaŭzas kreskadon de alta herbo.\n\nSanktiga tereno estas detruita per fajro, kaj produktos sulkiĝintan herbon se pasivaj regeneradaj efikoj estas malebligitaj aŭ la Pastro ne gajnis sperton de kelka tempo.
actors.hero.spells.hallowedground.name=sankta tero
actors.hero.spells.hallowedground.prompt=Elektu Lokon
actors.hero.spells.hallowedground.short_desc=Resanigas aliancanojn, malrapidigas malamikojn, kaj disvastigas herbon en areo de efiko.
actors.hero.spells.holyintuition.cursed=Vi sentas malican magion kaŝiĝantan en ĉi tiu objekto.
actors.hero.spells.holyintuition.desc=La kleriko enfokusigas siajn sentojn al objekto kaj determinas ĉu ĝi estas malbenita aŭ ne sen devi ekipi ĝin.
actors.hero.spells.holyintuition.name=sankta intuicio
actors.hero.spells.holyintuition.prompt=elekti eron
actors.hero.spells.holyintuition.short_desc=identigas ĉu objekto estas malbenita aŭ ne.
actors.hero.spells.holyintuition.uncursed=Ĉi tiu objekto estas libera de malica magio.
actors.hero.spells.holylance$lancecooldown.desc=La Pastro ĵus uzis Sanktan Lancon, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.spells.holylance$lancecooldown.name=malvarmigotempo de sankta lanco
actors.hero.spells.holylance.desc=La Pastro koncentras grandan kvanton da energio en detruan ĵetitan lancon faritan el lumo. Ĉi tiu lanco kaŭzas %1$d-%2$d damaĝon kaj ĉiam kaŭzas maksimuman damaĝon al malmortaj kaj demonaj celoj.\n\nĈi tiu sorĉo estas tre multekosta, kaj havas malvarmiĝtempon de 30 vicoj.
actors.hero.spells.holylance.name=sankta lanco
actors.hero.spells.holylance.short_desc=Kaŭzas grandan distanc-magian damaĝon.
actors.hero.spells.holyward$holyarmbuff.desc=La Kleriko plenigis ilian eluzitan kirason per sankta energio, provizore superregante ajnan ekzistantan glifon kaj kaŭzante ke la kiraso blokas 1 plian poenton da damaĝo.\n\nRestantaj Turnoj: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=La Paladino plenigis ilian eluzitan kirason per sankta energio, kaŭzante ke la kiraso blokas pliajn 3 poentojn da damaĝo.\n\nĴetado de aliaj sorĉoj dum sankta protekto estas aktiva plilongigos ĝian daŭron je 10 vicoj por ĉiu elspezita ŝargo.\n\nRestaj Vicoj: %s.
actors.hero.spells.holyward$holyarmbuff.name=sankta hospitala sekcio
actors.hero.spells.holyward.desc=La Kleriko plenigas sian eluzitan kirason per ideogramoj de sankta lumo, pliigante la damaĝoblokadon de la kiraso je 1. Ĉi tiu sorĉo rapide gisiĝas. \n\nĈi tiu ideogramo daŭras 50 vicojn kaj superregos ajnan utilan ideogramon, kiun la kiraso havas dum la daŭro. La Kleriko profitos de ĉi tiu efiko eĉ se ili ne havas kirason.
actors.hero.spells.holyward.desc_paladin=_Ĉi tiu sorĉo estas pli potenca kiam ĝi estas uzata de la Paladino._ La aldona damaĝoblokado estas pliigita al 3, la sorĉo jam ne superregas ekzistantajn ideogramojn, kaj ĵetante aliajn sorĉojn dum sankta protekto estas aktiva plilongigos ĝian daŭron je 10 vicoj por ĉiu uzita ŝargo.
actors.hero.spells.holyward.glyph_desc=Ĉi tiu glifo iomete pliigas la kvanton da damaĝo, kiun kiraso povas bloki.
actors.hero.spells.holyward.glyph_name=%s de lumo
actors.hero.spells.holyward.name=sankta hospitala sekcio
actors.hero.spells.holyward.short_desc=Provizore anstataŭigas ideogramojn por plifortigi kirasblokadon.
actors.hero.spells.holyweapon$holywepbuff.desc=La Kleriko plenigis ilian eluzitan armilon per sankta energio, provizore superregante ajnan ekzistantan sorĉon kaj igante la armilon kaŭzi pliajn 2 magiajn damaĝojn ĉe ĉiu atako. \n\nRestantaj Turnoj: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=La Paladino plenigis ilian eluzitan armilon per sankta energio, kaŭzante ke iliaj atakoj kaŭzas pliajn 6 magiajn damaĝojn.\n\nĴetado de aliaj sorĉoj dum la sankta armilo estas aktiva plilongigos ĝian daŭron je 10 vicoj por ĉiu elspezita ŝargo.\n\nRestaj Vicoj: %s.
actors.hero.spells.holyweapon$holywepbuff.name=sankta armilo
actors.hero.spells.holyweapon.desc=La Kleriko sorĉas sian eluzitan armilon per sankta energio, igante la armilon kaŭzi pliajn 2 magiajn damaĝojn kiam ajn ili trafas malamikon per ĝi. Ĉi tiu sorĉo ne bezonas multan tempon por iĝi. \n\nĈi tiu sorĉo daŭras 50 vicojn, kaj superregos ajnan utilan sorĉon, kiun la armilo havas dum la daŭro. Senarmaj atakoj ankaŭ povas profiti de ĉi tiu efiko.
actors.hero.spells.holyweapon.desc_paladin=_Ĉi tiu sorĉo estas pli potenca kiam ĝi estas uzata de la Paladino._ La aldona magia damaĝo estas pliigita al 6, la sorĉo jam ne superregas ekzistantajn sorĉojn, kaj ĵetante aliajn sorĉojn dum sankta armilo estas aktiva plilongigos ĝian daŭron je 10 vicoj por ĉiu uzita ŝargo.
actors.hero.spells.holyweapon.ench_desc=Malamikoj trafitaj de sankta armilo ricevos ekstran magian damaĝon.
actors.hero.spells.holyweapon.ench_name=sankta %s
actors.hero.spells.holyweapon.name=sankta armilo
actors.hero.spells.holyweapon.short_desc=Provizore anstataŭigas sorĉojn por pliigi damaĝon.
actors.hero.spells.judgement.desc=La Kleriko frapas sian pugnon sur la teron, kaŭzante erupcion de lumo kiu kaŭzas damaĝon al ĉiuj malamikoj, kiujn ili povas vidi. Ĉi tio kaŭzas %1$d-%2$d damaĝon ĉe la bazo, sed ankaŭ kaŭzas plian 33%% damaĝon por ĉiu sorĉo, kiun la Kleriko ĵetis ekde kiam li eniris ĉieliritan formon (aŭ ekde kiam ili laste ĵetis Juĝon).\n\nNuntempe Juĝo kaŭzos %3$d-%4$d damaĝon.
actors.hero.spells.judgement.name=juĝo
actors.hero.spells.judgement.short_desc=Difektas ĉiujn videblajn malamikojn.
actors.hero.spells.layonhands.desc=La Paladino kanaligas sanktan energion tra siaj manoj, resanigante aŭ protektante kion ajn ili tuŝas.\n\nLa Paladino povas ĵeti ĉi tiun sorĉon sur iun ajn apudan rolulon por doni al ili %1$d resanigon, aŭ sur si mem por akiri %1$d ŝirmadon. Troa resanigo de ĉi tiu sorĉo estas konvertita en ŝirmadon.\n\nĈi tiu sorĉo estas ĵetita tuj kaj povas esti ĵetita plurfoje, sed ne povas doni pli ol tri ĵetojn valorajn da ŝirmado samtempe.
actors.hero.spells.layonhands.name=meti sur manojn
actors.hero.spells.layonhands.short_desc=Tuj resanigas apudan rolulon aŭ ŝirmas la Paladinon.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=La Kleriko ĵus uzis Vivligilon sur ĉi tiun aliancanon.\n\nAldone al la regulaj avantaĝoj de Vivligilo, ĉi tiu rolulo ankaŭ ricevas reduktitan damaĝon, ĉiuj pozitivaj Klerikaj sorĉoj estas aplikitaj al kaj la Kleriko kaj ĉi tiu aliancano anstataŭ nur unu, kaj Potenco de Multaj ne eksvalidiĝos dum ĉi tiu plifortigo estas aktiva.\n\nRestas Turnoj: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=vivliga protekto
actors.hero.spells.lifelinkspell.desc=La Kleriko plifortigas la ligon inter si mem kaj sia povigita aliancano. Kun ĉi tiu povigita ligo, ĉia ricevita damaĝo estos dividita inter kaj la heroo kaj ilia aliancano por %1$d vicoj, kaj la defensiva akcelo de Potenco de Multaj estos pliigita al -%2$d%% ricevita damaĝo. Notu, ke la damaĝo estas dividita post kiraso, sed antaŭ la damaĝredukto de Potenco de Multaj.\n\nDum ĉi tiu efiko estas aktiva, utilaj Klerikaj sorĉoj de T3 aŭ malpli aplikiĝos al kaj la Kleriko kaj ilia aliancano se ili nur aplikus ilin al unu el ili.
actors.hero.spells.lifelinkspell.name=vivligo
actors.hero.spells.lifelinkspell.short_desc=Kunhavas damaĝon kun aliancano, kaj reduktas ties ricevitan damaĝon.
actors.hero.spells.mindform.desc=La Kleriko elektas sorĉbastonon aŭ ĵetarmilojn, kiujn ili identigis dum ĉi tiu kuro, kaj plenigas Triunuon per ĝia efiko. ZXQPH1 ZXQZXQPH2 ZXQKiam Triunuo estas uzata, la Kleriko povas fari unuopan atakon kvazaŭ ili uzus la elektitan objekton ĉe +ZXQPH0 ZXQ. Ĉi tio ekigos ĉiujn efikojn, kiujn uzado de tiu tipo de objekto normale ekigus. ZXQPH3 ZXQZXQPH4 ZXQ Ĉi tiu sorĉo anstataŭigas ajnan alian mensan efikon, per kiu Triunuo estas nuntempe plenigita.
actors.hero.spells.mindform.name=mensa formo
actors.hero.spells.mindform.short_desc=Asignas Triunuon al sorĉbastono aŭ ĵetarmilo.
actors.hero.spells.mnemonicprayer.desc=La Pastro eldiras preĝon kiu plilongigas la daŭron de ĉiuj plifortigoj aŭ malplifortigoj sur specifa celo je %1$d vicoj. Ĉi tiu sorĉo ne bezonas tempon por esti ĵetita. Pozitivaj efikoj daŭros pli longe sur aliancanoj (inkluzive de la Pastro mem), kaj malutilaj efikoj daŭros pli longe sur malamikoj. \n\nMnemonika Preĝo povas plilongigi specifan okazon de plifortigo aŭ malplifortigo nur unufoje, kaj ne povas plilongigi plifortigojn donitajn de kiraskapabloj.
actors.hero.spells.mnemonicprayer.name=mnemonika preĝo
actors.hero.spells.mnemonicprayer.short_desc=Plilongigas plibonigojn/malplibonigojn al aliancano/malamiko, kaj reaplikas lumigitajn.
actors.hero.spells.radiance.desc=La Pastro erupcias en sankta lumo, miregigante ĉiujn videblajn malamikojn dum 3 vicoj. Se malamiko jam estas lumigita, Radiance aktivigos la kromdamaĝon de lumigado kaj poste aplikos la lumigitan malfortigon. Radiance ankaŭ kaŭzos, ke la Pastro brilos dum 100 vicoj se la nuna etaĝo estas malluma.
actors.hero.spells.radiance.name=radianco
actors.hero.spells.radiance.short_desc=Lumigas kaj nelonge miregigas videblajn malamikojn.
actors.hero.spells.recallinscription$useditemtracker.desc=La Kleriko ĵus uzis objekton, kiu funkcias kun la surskribita revoka sorĉo. La Kleriko povas ĵeti la sorĉon por ripeti la efikon de la objekto.\n\nUzita objekto: %1$s.\n\nRestantaj vicoj: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=lastatempe uzita runo
actors.hero.spells.recallinscription.desc=La Kleriko uzas sanktan magion por refari la efikon de magia runo trovita sur runŝtono aŭ volvlibro, kiun ili uzis en la lastaj %s vicoj. \n\nRevoko-Surskribo ne povas esti uzata por reprodukti volvlibrojn de plibonigo. La ŝarga kosto de ĉi tiu sorĉo varias laŭ kiu objekto estis uzita lastatempe: 2 por runŝtono, 3 por volvlibro, 4 por ekzotika volvlibro. Ĉi tiu ŝarga kosto ankaŭ duobliĝas kiam oni reproduktas volvlibron de transmutacio, aŭ alĥemiajn objektojn, kiuj devas esti kreitaj per transmutacio aŭ plibonigo.
actors.hero.spells.recallinscription.name=revoksurskribo
actors.hero.spells.recallinscription.short_desc=Ripetas ĵus uzitan runŝtonon aŭ volvlibron.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Maldika ŝildo de lumo staras inter ĉi tiu rolulo kaj malamiko. Ĝi ne estas sufiĉe forta por rekte bloki atakojn, sed moligos ilin.\n\nRestantaj Turnoj: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ŝildo de lumo
actors.hero.spells.shieldoflight.desc=La Kleriko kreas maldikan lumbarieron inter si kaj malamiko, pliigante la blokpovon de ilia kiraso kontraŭ tiu malamiko je %1$d-%2$d dum 5 vicoj.\n\nĈi tiu sorĉo ne bezonas tempon por ĵigi, sed ne povas esti uzata kontraŭ pluraj celoj samtempe.
actors.hero.spells.shieldoflight.name=ŝildo de lumo
actors.hero.spells.shieldoflight.short_desc=Donas provizoran kirason kontraŭ celo.
actors.hero.spells.smite.desc=La Paladino plenigas manbatalon per justa detrua povo.\n\nAldone al kaŭzado de normala manbatalo, Smite faras ne-ŝarĝitajn atakojn garantiitajn trafi, havas +300%% sorĉpovon, kaj kaŭzas %1$d - %2$d bonusan magian damaĝon.\n\nLa bonusa magia damaĝo de Smite skalas laŭ la nivelo de la Paladino, kaj ĝi ĉiam kaŭzos maksimuman bonusan magian damaĝon kontraŭ malmortaj aŭ demonaj malamikoj.
actors.hero.spells.smite.name=batu
actors.hero.spells.smite.short_desc=Garantias trafon kun kroma damaĝo kaj sorĉpovo.
actors.hero.spells.spiritform$spiritformbuff.desc=La spiritformo de Triunuo nuntempe donas al vi la potencon de objekto, kvazaŭ vi havus ĝin ekipita.\n\nNotu, ke la spiritformo ne povas provizi alian kopion de efiko, de kiu vi jam profitas.\n\nAktuala Efiko: %1$s.\n\nRestaj Turnoj: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=spirita formo
actors.hero.spells.spiritform.desc=La Kleriko elektas ringon aŭ artefakton, kiun ili identigis ĉi-foje (krom la sankta volumo) kaj trapenetras Triunuon per ĝia efiko. ZXQPH2 ZXQZXQPH3 ZXQ Se ringo estas elektita, tiam Triunuo donas la efikon de tiu ringo je +ZXQPH0 ZXQ dum 20 vicoj. ZXQPH4 ZXQZXQPH5 ZXQ Se artefakto estas elektita, tiam Triunuo ripetas la efikon de tiu Artefakto je +ZXQPH1 ZXQ. Ĉiu artefakto havas malsamajn specifajn kondutojn kaj kirasŝargajn kostojn kiam uzata kun Triunuo. ZXQPH6 ZXQZXQPH7 ZXQ Ĉi tiu sorĉo anstataŭigas ajnan alian spiritan efikon, per kiu Triunuo estas nuntempe trapenetrita.
actors.hero.spells.spiritform.name=spirita formo
actors.hero.spells.spiritform.short_desc=Asignas Triunuon al ringo aŭ artefakto.
actors.hero.spells.stasis$stasisbuff.desc=La Kleriko nuntempe havas aliancanon stokitan en stazo. Ĉiuj pozitivaj efikoj sur ĉi tiu aliancano estas konservitaj, inkluzive de Potenco de Multaj, kaj ili reaperos apud la Kleriko kiam la efiko finiĝos. La efiko ankaŭ povas esti finita frue per reĵetado de Stazo.\n\nAliancano en stazo: %1$s.\nRestantaj Turnoj: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Via senmova aliancano estas postlasita.
actors.hero.spells.stasis$stasisbuff.name=aliancano en stazo
actors.hero.spells.stasis.desc=La Kleriko enfokusigas sian konekton kun sia aliancano al si mem, kaŭzante ke la aliancano estas provizore tenata en ia energia stazo ene de la Kleriko. La aliancano estos konservita ĝis %d vicoj, kaj ĉiuj pozitivaj efikoj sur ili ne estos influitaj de ilia tempo en stazo. \n\nLa aliancano aperos apud la Kleriko kiam la stazo finiĝas nature aŭ ili povas tuj refari la sorĉon senkoste por fini la efikon frue. Stazo eĉ povas movi senmovajn aliancanojn, sed ne povas translokigi ilin inter etaĝoj.
actors.hero.spells.stasis.name=stazo
actors.hero.spells.stasis.short_desc=Forigas aliancanon el la kelkarcero kaj konservas lin/ŝin.
actors.hero.spells.sunray.desc=La Kleriko pafas blindigan lumon al celo, kaŭzante %1$d-%2$d damaĝon kaj blindigante ilin dum %3$d vicoj. Sunradio ĉiam kaŭzas maksimuman damaĝon al malmortaj kaj demonaj celoj.\n\nPost esti trafita per ĉi tiu sorĉo, la vidkapablo de malamiko adaptiĝos, malhelpante ilin esti blindigitaj de ĝi denove. Tamen, se ili estas trafitaj denove dum blindigitaj de ĉi tiu sorĉo, tiam la lumo estas superforta kaj paralizas ilin anstataŭe.
actors.hero.spells.sunray.name=sunradio
actors.hero.spells.sunray.short_desc=Kaŭzas distanc-magian damaĝon kaj blindigas celon unufoje.
actors.hero.spells.walloflight$lightwall.desc=Briletaj lumpaneloj blokas trairejon ĉi tie.
actors.hero.spells.walloflight.desc=La Paladino kreas muron faritan el paneloj de solida lumo rekte antaŭ si, kiu estas 1 kahelon dika, %1$d kahelojn larĝa, kaj daŭras 20 turnojn.\n\nĈi tiu muro funkcias same kiel regula, escepte ke oni povas vidi tra ĝi. Malamikoj, kiuj estas kaptitaj en la muro kiam ĝi estas kreita, estos momente miregigitaj kaj puŝitaj reen se eble. Io ajn blokita en la muro povos moviĝi el ĝi.\n\nLa muro povas esti ĵetita en iun ajn el la kvar ĉefaj aŭ kvar diagonalaj direktoj. Se muro jam estas aktiva, la sorĉo povas esti reuzata senpage por tuj malplenigi la muron.
actors.hero.spells.walloflight.early_end=Vi dispelas la muron de lumo.
actors.hero.spells.walloflight.name=muro de lumo
actors.hero.spells.walloflight.short_desc=Kreas muron kiu blokas malamikojn.
actors.hero.talent$aggressivebarriercooldown.desc=Vi ĵus uzis ĉi tiun talenton, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.talent$aggressivebarriercooldown.name=agresema barilmalvarmigo
actors.hero.talent$combinedlethalityabilitytracker.executed=efektivigita
actors.hero.talent$deadlyfollowuptracker.desc=La Duelanto ĵus atakis malamikon per ĵetarmilo, ŝiaj manbatalaj atakoj kontraŭ la sama celo pliigos la damaĝon.\n\nRestantaj turnoj: %s.
actors.hero.talent$deadlyfollowuptracker.name=mortiga daŭrigo
actors.hero.talent$followupstriketracker.desc=La Ĉasistino ĵus atakis malamikon per ĵetarmilo, ŝia sekva manbatalo kontraŭ la sama celo pliigos la damaĝon.\n\nRestantaj turnoj: %s.
actors.hero.talent$followupstriketracker.name=sekva striko
actors.hero.talent$improvisedprojectilecooldown.desc=Vi ĵus uzis ĉi tiun talenton, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.talent$improvisedprojectilecooldown.name=malvarmiĝotempo de improvizitaj kugloj
actors.hero.talent$lethalhastecooldown.desc=Vi ĵus uzis ĉi tiun talenton, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.talent$lethalhastecooldown.name=malvarmigotempo de mortiga rapido
actors.hero.talent$lingeringmagictracker.desc=La Magiisto ĵus uzis bastonon aŭ sorĉbastonon, lia sekva fizika atako kaŭzos kroman damaĝon.\n\nRestantaj turnoj: %s.
actors.hero.talent$lingeringmagictracker.name=daŭranta magio
actors.hero.talent$liquidagilacctracker.desc=La sekva regula manbatalo de la Duelanto gajnos bonusan precizecon.\n\nRestantaj turnoj: %s.
actors.hero.talent$liquidagilacctracker.name=likva facilmoveco
actors.hero.talent$patientstriketracker.desc=La Duelanto ĵus pasigis unu vicon atendante, ŝia sekva proksimbatala atako kaŭzos kroman damaĝon.
actors.hero.talent$patientstriketracker.name=pacienca striko
actors.hero.talent$preciseassaulttracker.desc=La sekva regula manbatalo de la Duelanto gajnos bonusan precizecon.\n\nRestantaj turnoj: %s.
actors.hero.talent$preciseassaulttracker.name=preciza atako
actors.hero.talent$provokedangertracker.desc=La Militisto ĵus perdis sian ŝirmadon, lia sekva fizika atako kaŭzos kroman damaĝon. \n\nRestantaj turnoj: %s.
actors.hero.talent$provokedangertracker.name=provokita kolero
actors.hero.talent$rejuvenatingstepscooldown.desc=Vi ĵus uzis ĉi tiun talenton, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=rejunigaj paŝoj malvarmiĝo
actors.hero.talent$satiatedspellstracker.desc=La sekva sorĉo, kiun la kleriko ĵetas, donos al ili malgrandan kvanton da ŝirmado.
actors.hero.talent$satiatedspellstracker.name=Ŝirma Sorĉo
actors.hero.talent$searinglightcooldown.desc=Vi ĵus uzis ĉi tiun talenton, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.talent$searinglightcooldown.name=Bruliga Lumo
actors.hero.talent$seershotcooldown.desc=Vi ĵus uzis ĉi tiun talenton, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.talent$seershotcooldown.name=malvarmigotempo de viziisto-pafo
actors.hero.talent$swiftequipcooldown.desc=Vi ĵus uzis ĉi tiun talenton, kaj devas atendi antaŭ ol uzi ĝin denove. \n\nRestantaj turnoj: %s.
actors.hero.talent$swiftequipcooldown.name=rapida ekipaĵa malvarmigotempo
actors.hero.talent.adventurers_intuition.desc=_+1:_ La Duelanto identigas armilojn _2,5-oble pli rapide_ kaj kirasojn _1,75-oble pli rapide_.\n\n_+2:_ La Duelanto identigas armilojn _kiam ŝi ekipas ilin_ kaj kirasojn _2,5-oble pli rapide_.
actors.hero.talent.adventurers_intuition.title=intuicio de aventuristo
actors.hero.talent.aggressive_barrier.desc=_+1:_ La Duelanto gajnas _3 ŝirmadon_ kiam ŝi uzas armilkapablon kaj havas sanon je aŭ sub 50%.\n\n_+2:_ La Duelanto gajnas _5 ŝirmadon_ kiam ŝi uzas armilkapablon kaj havas sanon je aŭ sub 50%.
actors.hero.talent.aggressive_barrier.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe donos ŝirmadon dum proksimbatala atako kun malalta sano, kun malvarmigtempo de 50-vicoj.
actors.hero.talent.aggressive_barrier.title=agresema bariero
actors.hero.talent.ally_warp.desc=_+1:_ La Magiisto povas elekti aliancanon por tuj interŝanĝi lokojn kun ili, kun _2 kahelaj intervalo_.\n\n_+2:_ La Magiisto povas elekti aliancanon por tuj interŝanĝi lokojn kun ili, kun _4 kahelaj intervalo_.\n\n_+3:_ La Magiisto povas elekti aliancanon por tuj interŝanĝi lokojn kun ili, kun _6 kahelaj intervalo_.\n\nLa Magiisto ne povas interŝanĝi lokojn kun nemoveblaj aliancanoj.
actors.hero.talent.ally_warp.title=aliancana varpo
actors.hero.talent.arcane_vision.desc=_+1:_ Kiam la Magiisto mortigas malamikon, li akiras mensan vidon sur ili dum _10 vicoj_.\n\n_+2:_ Kiam la Magiisto mortigas malamikon, li akiras mensan vidon sur ili dum _15 vicoj_.
actors.hero.talent.arcane_vision.title=arkana vizio
actors.hero.talent.assassins_reach.desc=_+1:_ La palpebruma atingopovo de la Insidmurdisto por nivelo de preparo pliiĝas al _1/3/4/6 kaheloj_, de 1/2/3/4.\n\n_+2:_ La palpebruma atingopovo de la Insidmurdisto por nivelo de preparo pliiĝas al _2/4/6/8 kaheloj_, de 1/2/3/4.\n\n_+3:_ La palpebruma atingopovo de la Insidmurdisto por nivelo de preparo pliiĝas al _2/5/7/10 kaheloj_, de 1/2/3/4.\n\nĈi tiu palpebrumo povas trairi danĝerojn kaj malamikojn, sed ne tra solida tereno kiel muroj.
actors.hero.talent.assassins_reach.title=atingo de insidmurdisto
actors.hero.talent.aura_of_protection.desc=_+1:_ La Paladino povas ĵeti _Aŭron de Protekto,_ sorĉon kiu donas al la Paladino kaj ĉiuj aliancanoj ene de 2 kaheloj _20% damaĝoreziston_ kaj la efikon de la kirasa glifo de la Paladino je _+50% potenco_ dum 20 turnoj, je la kosto de 2 ŝargoj.\n\n_+2:_ La Paladino povas ĵeti _Aŭron de Protekto,_ sorĉon kiu donas al la Paladino kaj ĉiuj aliancanoj ene de 2 kaheloj _30% damaĝoreziston_ kaj la efikon de la kirasa glifo de la Paladino je _+75% potenco_ dum 20 turnoj, je la kosto de 2 ŝargoj.\n\n_+3:_ La Paladino povas ĵeti _Aŭron de Protekto,_ sorĉon kiu donas al la Paladino kaj ĉiuj aliancanoj ene de 2 kaheloj _40% damaĝoreziston_ kaj la efikon de la kirasa glifo de la Paladino je _+100% potenco_ dum 20 vicoj, je la kosto de 2 ŝargoj.
actors.hero.talent.aura_of_protection.title=aŭro de protekto
actors.hero.talent.backup_barrier.desc=_+1:_ La Magiisto gajnas _3 ŝirmadon_ kiam ajn li elspezas la lastan ŝargon en sia bastono.\n\n_+2:_ La Magiisto gajnas _5 ŝirmadon_ kiam ajn li elspezas la lastan ŝargon en sia bastono.
actors.hero.talent.backup_barrier.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe ekfunkcios per la plej altnivela sorĉbastono de la heroo.
actors.hero.talent.backup_barrier.title=rezerva bariero
actors.hero.talent.barkskin.desc=_+1:_ Paŝante en herbon, la Gardisto gajnas _0-50% de sia nivelo_ en ŝelhaŭta kiraso, kiu paliĝas ĉiun vicon.\n\n_+2:_ Paŝante en herbon, la Gardisto gajnas _0-100% de sia nivelo_ en ŝelhaŭta kiraso, kiu paliĝas ĉiun vicon.\n\n_+3:_ Paŝante en herbon, la Gardisto gajnas _0-150% de sia nivelo_ en ŝelhaŭta kiraso, kiu paliĝas ĉiun vicon.
actors.hero.talent.barkskin.title=ŝelhaŭto
actors.hero.talent.beaming_ray.desc=La Kleriko povas ĵeti _Luman Radion_ de povigita aliancano je la kosto de 1 ŝargo. Ĉi tiu radio povas trairi murojn kaj teletransporti la aliancanon al celita loko. Se malamiko estas ĉe tiu loko, la aliancano aperas apud la malamiko kaj celos lin/ŝin. Radianta Radio eĉ povas teletransporti normale nemoveblajn aliancanojn, sed havas duonan atingon dum tio.\n\n_+1:_ Radianta Radio havas maksimuman atingon de _4 kaheloj,_ kaj pliigas la bonuson de Potenco de Multaj al _+35% damaĝo_ kontraŭ la plej proksima malamiko dum 10 turnoj.\n\n_+2:_ Radianta Radio havas maksimuman atingon de _8 kaheloj,_ kaj pliigas la bonuson de Potenco de Multaj al _+40% damaĝo_ kontraŭ la plej proksima malamiko dum 10 turnoj.\n\n_+3:_ Radianta Radio havas maksimuman atingon de _12 kaheloj,_ kaj pliigas la bonuson de Potenco de Multaj al _+45% damaĝo_ kontraŭ la plej proksima malamiko dum 10 turnoj.\n\n_+4:_ Radianta Radio havas maksimuman atingon de _16 kaheloj,_ kaj pliigas La bonuso de Potenco de Multaj pliigas _+50% damaĝon_ kontraŭ la plej proksima malamiko dum 10 vicoj.
actors.hero.talent.beaming_ray.title=radianta radio
actors.hero.talent.blast_radius.desc=_+1:_ La radiuso de elementa eksplodo pligrandiĝas al _5 kaheloj_, de 4.\n\n_+2:_ La radiuso de elementa eksplodo pligrandiĝas al _6 kaheloj_, de 4.\n\n_+3:_ La radiuso de elementa eksplodo pligrandiĝas al _7 kaheloj_, de 4.\n\n_+4:_ La radiuso de elementa eksplodo pligrandiĝas al _8 kaheloj_, de 4.
actors.hero.talent.blast_radius.title=eksplodradiuso
actors.hero.talent.bless.desc=_+1:_ La Kleriko povas ĵeti _Benon,_ sorĉon kiu donas _6 vicojn da beno kaj 10 ŝirmadon_ kiam ĝi estas ĵetita sur sin mem aŭ _10 vicojn da beno kaj 10 resanigon_ kiam ĝi estas ĵetita sur alian rolulon, je kosto de 1 ŝargo.\n\n_+2:_ La Kleriko povas ĵeti _Benon,_ sorĉon kiu donas _10 vicojn da beno kaj 15 ŝirmadon_ kiam ĝi estas ĵetita sur sin mem aŭ _15 vicojn da beno kaj 15 resanigon_ kiam ĝi estas ĵetita sur alian rolulon, je kosto de 1 ŝargo.\n\nTroa resanigo de ĉi tiu sorĉo estas konvertita en ŝirmadon.
actors.hero.talent.bless.meta_desc=_Se ĉi tiun talenton akiras alia heroo_, ĝi anstataŭe pliigos precizecon kaj evitadon por la heroo kaj ĉiuj aliancanoj je 3% je +1 aŭ 5% je +2.
actors.hero.talent.bless.title=beni
actors.hero.talent.body_form.desc=La Kleriko povas uzi _Korpoformon_, kiu plenigas Triunuon per la povo de sorĉo aŭ ideogramo, kiun la Kleriko identigis ĉi-foje, je la kosto de 2 ŝargoj.\n\n_+1:_ Kiam Triunuo estas uzata, la Kleriko akiras la elektitan efikon dum _20 turnoj._\n\n_+2:_ Kiam Triunuo estas uzata, la Kleriko akiras la elektitan efikon dum _27 turnoj._\n\n_+3:_ Kiam Triunuo estas uzata, la Kleriko akiras la elektitan efikon dum _33 turnoj._\n\n_+4:_ Kiam Triunuo estas uzata, la Kleriko akiras la elektitan efikon dum _40 turnoj._\n\nTriunuo povas esti plenigita nur per unu korpa efiko samtempe. La kosto de la kiraso de Triunuo estas pli alta se la elektita glifo estas malofta kaj potenca.
actors.hero.talent.body_form.title=korpoformo
actors.hero.talent.body_replacement.desc=_+1:_ Post palpebrumado, la Fripono lasas lignan forlogaĵon, kiu havas _20 sanon kaj 1-3 kirason_.\n\n_+2:_ Post palpebrumado, la Fripono lasas lignan forlogaĵon, kiu havas _40 sanon kaj 2-6 kirason_.\n\n_+3:_ Post palpebrumado, la Fripono lasas lignan forlogaĵon, kiu havas _60 sanon kaj 3-9 kirason_.\n\n_+4:_ Post palpebrumado, la Fripono lasas lignan forlogaĵon, kiu havas _80 sanon kaj 4-12 kirason_.\n\nNur unu forlogaĵo povas esti aktiva samtempe.
actors.hero.talent.body_replacement.title=korpa anstataŭigo
actors.hero.talent.body_slam.desc=_+1:_ Kiam la Militisto surteriĝas post saltado, ĉiuj apudaj malamikoj ricevas damaĝon egalan al _1-4 plus 25%_ de lia damaĝo-bloka povo.\n\n_+2:_ Kiam la Militisto surteriĝas post saltado, ĉiuj apudaj malamikoj ricevas damaĝon egalan al _2-8 plus 50%_ de lia damaĝo-bloka povo.\n\n_+3:_ Kiam la Militisto surteriĝas post saltado, ĉiuj apudaj malamikoj ricevas damaĝon egalan al _3-12 plus 75%_ de lia damaĝo-bloka povo.\n\n_+4:_ Kiam la Militisto surteriĝas post saltado, ĉiuj apudaj malamikoj ricevas damaĝon egalan al _4-16 plus 100%_ de lia damaĝo-bloka povo.
actors.hero.talent.body_slam.title=korpoŝlemo
actors.hero.talent.bounty_hunter.desc=_+1:_ Kiam la Insidmurdisto mortigas malamikon per preparita atako, ilia ŝanco faligi objekton pliiĝas je _2/4/8/16%_, por nivelo de preparo.\n\n_+2:_ Kiam la Insidmurdisto mortigas malamikon per preparita atako, ilia ŝanco faligi objekton pliiĝas je _4/8/16/32%_, por nivelo de preparo.\n\n_+3:_ Kiam la Insidmurdisto mortigas malamikon per preparita atako, ilia ŝanco faligi objekton pliiĝas je _6/12/24/48%_, por nivelo de preparo.
actors.hero.talent.bounty_hunter.title=premiĉasisto
actors.hero.talent.cached_rations.desc=_+1:_ La Fripono povas trovi _2 provizoporciojn_ metitajn en kestojn dum li esploras la sekvajn kelkajn etaĝojn de la kelkarcero.\n\n_+2:_ La Fripono povas trovi _3 provizoporciojn_ metitajn en kestojn dum li esploras la sekvajn kelkajn etaĝojn de la kelkarcero.\n\nProvizporcioj estas rapide manĝataj, redonas moderan kvanton da sateco, resanigas 5 vivpoentojn, kaj redonas 1 ŝargon al la mantelo de ombroj.
actors.hero.talent.cached_rations.title=konservitaj porcioj
actors.hero.talent.cleanse.desc=_+1:_ La Kleriko povas ĵeti _Purigon,_ sorĉon kiu _forigas negativajn statusajn efikojn_ de la Kleriko kaj iuj ajn proksimaj aliancanoj, kaj donas al ili _10 ŝirmadon,_ je la kosto de 2 ŝargoj.\n\n_+2:_ La Kleriko povas ĵeti _Purigon,_ sorĉon kiu _donas 3 vicojn da negativa statusa imuneco_ al la Kleriko kaj iuj ajn proksimaj aliancanoj, kaj donas al ili _20 ŝirmadon,_ je la kosto de 2 ŝargoj.\n\n_+3:_ La Kleriko povas ĵeti _Purigon,_ sorĉon kiu _donas 5 vicojn da negativa statusa imuneco_ al la Kleriko kaj iuj ajn proksimaj aliancanoj, kaj donas al ili _30 ŝirmadon,_ je la kosto de 2 ŝargoj.
actors.hero.talent.cleanse.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe purigos negativajn statusajn efikojn sur la heroo post uzado de sorĉbastono aŭ artefakto, 10/20/30% de la tempo je +1/+2/+3.
actors.hero.talent.cleanse.title=purigi
actors.hero.talent.cleave.desc=_+1:_ La ekstra tempo, kiun la Gladiatoro mortigas, pliiĝas al _30 vicoj_, de 15.\n\n_+2:_ La ekstra tempo, kiun la Gladiatoro mortigas, pliiĝas al _45 vicoj_, de 15.\n\n_+3:_ La ekstra tempo, kiun la Gladiatoro mortigas, pliiĝas al _60 vicoj_, de 15.
actors.hero.talent.cleave.title=fendi
actors.hero.talent.cloned_armor.desc=_+1:_ La ombra klono gajnas _12%_ de la kirasvaloro de la heroo, kaj havas _25% ŝancon_ uzi la glifon sur la kiraso de la heroo.\n\n_+2:_ La ombra klono gajnas _24%_ de la kirasvaloro de la heroo, kaj havas _50% ŝancon_ uzi la glifon sur la kiraso de la heroo.\n\n_+3:_ La ombra klono gajnas _36%_ de la kirasvaloro de la heroo, kaj havas _75% ŝancon_ uzi la glifon sur la kiraso de la heroo.\n\n_+4:_ La ombra klono gajnas _48%_ de la kirasvaloro de la heroo, kaj havas _100% ŝancon_ uzi la glifon sur la kiraso de la heroo.
actors.hero.talent.cloned_armor.title=klonita kiraso
actors.hero.talent.close_the_gap.desc=_+1:_ La Duelanto palpebrumas _ĝis du kahelojn_ direkte al sia celo kiam ĝi komencas duelo.\n\n_+2:_ La Duelanto palpebrumas _ĝis tri kahelojn_ direkte al sia celo kiam ĝi komencas duelo.\n\n_+3:_ La Duelanto palpebrumas _ĝis kvar kahelojn_ direkte al sia celo kiam ĝi komencas duelo.\n\n_+4:_ La Duelanto palpebrumas _ĝis kvin kahelojn_ direkte al sia celo kiam ĝi komencas duelo.\n\nĈi tiu palpebrumo povas trairi danĝerojn kaj malamikojn, sed ne solidan terenon kiel murojn. La palpebrumo estas konsiderata kiam oni determinas ĉu malamiko estas ene de atingo por esti defiita.
actors.hero.talent.close_the_gap.title=fermi la interspacon
actors.hero.talent.combined_energy.desc=_+1:_ Se la Monaĥo uzas armilkapablon kaj kapablon kun _4+ energio_ ene de 5 vicoj unu de la alia, ŝi reakiras 1 elspezitan energion.\n\n_+2:_ Se la Monaĥo uzas armilkapablon kaj kapablon kun _3+ energio_ ene de 5 vicoj unu de la alia, ŝi reakiras 1 elspezitan energion.\n\n_+3:_ Se la Monaĥo uzas armilkapablon kaj kapablon kun _2+ energio_ ene de 5 vicoj unu de la alia, ŝi reakiras 1 elspezitan energion.
actors.hero.talent.combined_energy.title=kombinita energio
actors.hero.talent.combined_lethality.desc=_+1:_ Se la Ĉampiono atakas per manbatalarmilo tuj post uzado de la kapablo de malsama armilo, tiu atako ekzekutos ajnan ne-estran malamikon restantan je _sub 13% vivpoentoj_.\n\n_+2:_ Se la Ĉampiono atakas per manbatalarmilo tuj post uzado de la kapablo de malsama armilo, tiu atako ekzekutos ajnan ne-estran malamikon restantan je _sub 27% vivpoentoj_.\n\n_+3:_ Se la Ĉampiono atakas per manbatalarmilo tuj post uzado de la kapablo de malsama armilo, tiu atako ekzekutos ajnan ne-estran malamikon restantan je _sub 40% vivpoentoj_.\n\nĈi tiu atako povas esti regula manbatalarmilo, aŭ parto de armila kapablo.
actors.hero.talent.combined_lethality.title=kombinita letaleco
actors.hero.talent.conserved_magic.desc=_+1:_ Ĉiu teletransporto de sovaĝa magio nun uzas _0.33 ŝargojn_ anstataŭ 0.5, kaj sovaĝa magio havas _25% ŝancon_ ne elspezi unu vicon.\n\n_+2:_ Ĉiu teletransporto de sovaĝa magio nun uzas _0.225 ŝargojn_ anstataŭ 0.5, kaj sovaĝa magio havas _50% ŝancon_ ne elspezi unu vicon.\n\n_+3:_ Ĉiu teletransporto de sovaĝa magio nun uzas _0.15 ŝargojn_ anstataŭ 0.5, kaj sovaĝa magio havas _75% ŝancon_ ne elspezi unu vicon.\n\n_+4:_ Ĉiu teletransporto de sovaĝa magio nun uzas _0.1 ŝargojn_ anstataŭ 0.5, kaj sovaĝa magio havas _100% ŝancon_ ne elspezi unu vicon.
actors.hero.talent.conserved_magic.title=konservita magio
actors.hero.talent.counter_ability.desc=_+1:_ Se la Duelanto uzas armilkapablon ene de 3 vicoj post la atakado de ŝia postbildo, ŝi tuj reakiros _0.38 ŝargojn_.\n\n_+2:_ Se la Duelanto uzas armilkapablon ene de 3 vicoj post la atakado de ŝia postbildo, ŝi tuj reakiros _0.77 ŝargojn_.\n\n_+3:_ Se la Duelanto uzas armilkapablon ene de 3 vicoj post la atakado de ŝia postbildo, ŝi tuj reakiros _1.13 ŝargojn_.\n\n_+4:_ Se la Duelanto uzas armilkapablon ene de 3 vicoj post la atakado de ŝia postbildo, ŝi tuj reakiros _1.5 ŝargojn_.
actors.hero.talent.counter_ability.title=kontraŭa kapablo
actors.hero.talent.deadly_followup.desc=_+1:_ Kiam la Duelanto trafas malamikon per ĵetarmilo, ŝi kaŭzos _10% pli da proksimbatala damaĝo_ al ili dum 5 vicoj.\n\n_+2:_ Kiam la Duelanto trafas malamikon per ĵetarmilo, ŝi kaŭzos _20% pli da proksimbatala damaĝo_ al ili dum 5 vicoj.\n\n_+3:_ Kiam la Duelanto trafas malamikon per ĵetarmilo, ŝi kaŭzos _30% pli da proksimbatala damaĝo_ al ili dum 5 vicoj.
actors.hero.talent.deadly_followup.title=mortiga daŭrigo
actors.hero.talent.deathless_fury.desc=_+1:_ Berserko aŭtomate ekfunkcias se la Berserko estas mortonta kaj kolero estas je aŭ super 100%, sed ĝi havas malvarmiĝtempon de _3 herooniveloj_ kiam tio okazas.\n\n_+2:_ Berserko aŭtomate ekfunkcias se la Berserko estas mortonta kaj kolero estas je aŭ super 100%, sed ĝi havas malvarmiĝtempon de _2 herooniveloj_ kiam tio okazas.\n\n_+3:_ Berserko aŭtomate ekfunkcias se la Berserko estas mortonta kaj kolero estas je aŭ super 100%, sed ĝi havas malvarmiĝtempon de _1 heroonivelo_ kiam tio okazas.\n\nNotu, ke la Berserko ankoraŭ mortos se li havas 0 vivopoentojn kiam berserkado finiĝas.
actors.hero.talent.deathless_fury.title=senmorta kolero
actors.hero.talent.deathly_durability.desc=_+1:_ Malamikoj mortigitaj per mortmarko donas al la Fripono ŝirmadon egalan al _13%_ de iliaj vivpoentoj kiam ili estis markitaj.\n\n_+2:_ Malamikoj mortigitaj per mortmarko donas al la Fripono ŝirmadon egalan al _25%_ de iliaj vivpoentoj kiam ili estis markitaj.\n\n_+3:_ Malamikoj mortigitaj per mortmarko donas al la Fripono ŝirmadon egalan al _38%_ de iliaj vivpoentoj kiam ili estis markitaj.\n\n_+4:_ Malamikoj mortigitaj per mortmarko donas al la Fripono ŝirmadon egalan al _50%_ de iliaj vivpoentoj kiam ili estis markitaj.
actors.hero.talent.deathly_durability.title=mortiga fortikeco
actors.hero.talent.desperate_power.desc=_+1:_ La sorĉbastonoj kaj bastono de la Magiisto gajnas _+1 nivelon_ per sia fina ŝargo kiam ili ne plu havas sian lastan ŝargon.\n\n_+2:_ La sorĉbastonoj kaj bastono de la Magiisto gajnas _+2 nivelojn_ per sia fina ŝargo kiam ili ne plu havas sian lastan ŝargon.\n\n_+3:_ La sorĉbastonoj kaj bastono de la Magiisto gajnas _+3 nivelojn_ per sia fina ŝargo kiam ili ne plu havas sian lastan ŝargon.
actors.hero.talent.desperate_power.title=malespera potenco
actors.hero.talent.directed_power.desc=_+1:_ La rekta atako de elementa atako gajnas _+30% sorĉpovon_ por ĉiu malamiko en la atingopovo de la efiko de la elementa atako, inkluzive de la atakcelo.\n\n_+2:_ La rekta atako de elementa atako gajnas _+60% sorĉpovon_ por ĉiu malamiko en la atingopovo de la efiko de la elementa atako, inkluzive de la atakcelo.\n\n_+3:_ La rekta atako de elementa atako gajnas _+90% sorĉpovon_ por ĉiu malamiko en la atingopovo de la efiko de la elementa atako, inkluzive de la atakcelo.\n\n_+4:_ La rekta atako de elementa atako gajnas _+120% sorĉpovon_ por ĉiu malamiko en la atingopovo de la efiko de la elementa atako, inkluzive de la atakcelo.
actors.hero.talent.directed_power.title=direktita potenco
actors.hero.talent.divine_intervention.desc=_+1:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Dian Intervenon,_ kiu plibonigas la Klerikon kaj ĉiujn aliancanojn ĝis _150 ŝirmado_ kaj etendas Ĉielirintan Formon je _3 vicoj._\n\n_+2:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Dian Intervenon,_ kiu plibonigas la Klerikon kaj ĉiujn aliancanojn ĝis _200 ŝirmado_ kaj etendas Ĉielirintan Formon je _4 vicoj._\n\n_+3:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Dian Intervenon,_ kiu plibonigas la Klerikon kaj ĉiujn aliancanojn ĝis _250 ŝirmado_ kaj etendas Ĉielirintan Formon je _5 vicoj._\n\n_+4:_ Dum en Ĉielirita Formo, la Kleriko povas ĵeti _Dian Intervenon,_ kiu plibonigas la Kleriko kaj ĉiuj aliancanoj ĝis _300 ŝirmado_ kaj plilongigas Ĉielirintan Formon je _6 vicoj._\n\nDia Interveno kostas nekredeblajn 5 volumojn da ŝargoj, kaj povas esti uzata nur unufoje en la sama ĉielirita formo.
actors.hero.talent.divine_intervention.title=dia interveno
actors.hero.talent.divine_sense.desc=_+1:_ La Kleriko povas ĵeti _Dian Sencon,_ sorĉon kiu donas al ili _8 kahelojn_ da Mensvizio dum 50 turnoj kaj ne bezonas tempon por ĵeti, je la kosto de 2 ŝargoj.\n\n_+2:_ La Kleriko povas ĵeti _Dian Sencon,_ sorĉon kiu donas al ili _12 kahelojn_ da Mensvizio dum 50 turnoj kaj ne bezonas tempon por ĵeti, je la kosto de 2 ŝargoj.
actors.hero.talent.divine_sense.meta_desc=_Se ĉi tiun talenton akiras alia heroo_ ĝi anstataŭe donos al ili mensan vidon por mallonga momento post uzado de sorĉbastono aŭ artefakto kun atingodistanco de 3 kaheloj je +1 aŭ 5 kaheloj je +2.
actors.hero.talent.divine_sense.title=dia sento
actors.hero.talent.double_jump.desc=_+1:_ Se la Militisto plenumas duan salton ene de 3 vicoj, tiu salto havas _16% reduktitan_ ŝargkoston.\n\n_+2:_ Se la Militisto plenumas duan salton ene de 3 vicoj, tiu salto havas _30% reduktitan_ ŝargkoston.\n\n_+3:_ Se la Militisto plenumas duan salton ene de 3 vicoj, tiu salto havas _40% reduktitan_ ŝargkoston.\n\n_+4:_ Se la Militisto plenumas duan salton ene de 3 vicoj, tiu salto havas _50% reduktitan_ ŝargkoston.
actors.hero.talent.double_jump.title=duobla salto
actors.hero.talent.double_mark.desc=_+1:_ Marki duan celon samtempe kun la unua havas _30% reduktitan_ ŝargkoston.\n\n_+2:_ Marki duan celon samtempe kun la unua havas _50% reduktitan_ ŝargkoston.\n\n_+3:_ Marki duan celon samtempe kun la unua havas _65% reduktitan_ ŝargkoston.\n\n_+4:_ Marki duan celon samtempe kun la unua havas _75% reduktitan_ ŝargkoston.
actors.hero.talent.double_mark.title=duobla marko
actors.hero.talent.durable_projectiles.desc=_+1:_ Ĵetaj armiloj havas _+50% daŭripovon_ kiam uzataj de la Ĉasistino.\n\n_+2:_ Ĵetaj armiloj havas _+75% daŭripovon_ kiam uzataj de la Ĉasistino.
actors.hero.talent.durable_projectiles.title=daŭremaj kugloj
actors.hero.talent.durable_tips.desc=_+1:_ Pintitaj ĵetsagetoj havas _2-oble pli longan daŭrivon_ kiam la Gardanto uzas ilin.\n\n_+2:_ Pintitaj ĵetsagetoj havas _3-oble pli longan daŭrivon_ kiam la Gardanto uzas ilin.\n\n_+3:_ Pintitaj ĵetsagetoj havas _4-oble pli longan daŭrivon_ kiam la Gardanto uzas ilin.
actors.hero.talent.durable_tips.title=daŭremaj pintoj
actors.hero.talent.eagle_eye.desc=_+1:_ La vidkampo de la spirita akcipitro pliiĝas al _7 kaheloj_ de 6.\n\n_+2:_ La vidkampo de la spirita akcipitro pliiĝas al _8 kaheloj_ de 6.\n\n_+3:_ La vidkampo de la spirita akcipitro pliiĝas al _9 kaheloj_ de 6, kaj ĝi ricevas _2 kahelojn_ da mensa vidkampo.\n\n_+4:_ La vidkampo de la spirita akcipitro pliiĝas al _10 kaheloj_ de 6, kaj ĝi ricevas _3 kahelojn_ da mensa vidkampo.
actors.hero.talent.eagle_eye.title=aglokulo
actors.hero.talent.elemental_power.desc=_+1:_ La povo de elementa eksplodo pliiĝas je _25%_.\n\n_+2:_ La povo de elementa eksplodo pliiĝas je _50%_.\n\n_+3:_ La povo de elementa eksplodo pliiĝas je _75%_.\n\n_+4:_ La povo de elementa eksplodo pliiĝas je _100%_.
