actors.hero.talent.even_the_odds.desc=_+1:_ La Militisto kaŭzas plian _5%-an bonusan damaĝon_ por ĉiu malamiko ene de 2 kaheloj kiam eltenado finiĝas.\n\n_+2:_ La Militisto kaŭzas plian _10%-an bonusan damaĝon_ por ĉiu malamiko ene de 2 kaheloj kiam eltenado finiĝas.\n\n_+3:_ La Militisto kaŭzas plian _15%-an bonusan damaĝon_ por ĉiu malamiko ene de 2 kaheloj kiam eltenado finiĝas.\n\n_+4:_ La Militisto kaŭzas plian _20%-an bonusan damaĝon_ por ĉiu malamiko ene de 2 kaheloj kiam eltenado finiĝas.
actors.hero.talent.even_the_odds.title=eĉ la probableco
actors.hero.talent.excess_charge.desc=_+1:_ Kiam la bastono de la Batalmagiisto estas plene ŝargita, ĝia sekva ŝargo donos al li _0.67 ŝirmadon_ por nivelo de la bastono.\n\n_+2:_ Kiam la bastono de la Batalmagiisto estas plene ŝargita, ĝia sekva ŝargo donos al li _1.33 ŝirmadon_ por nivelo de la bastono.\n\n_+3:_ Kiam la bastono de la Batalmagiisto estas plene ŝargita, ĝia sekva ŝargo donos al li _2 ŝirmadon_ por nivelo de la bastono.
actors.hero.talent.excess_charge.title=troa ŝarĝo
actors.hero.talent.expanding_wave.desc=_+1:_ La atingopovo de Ŝokondo pligrandiĝas al _6 kaheloj_ de 5, kaj ĝia larĝo pligrandiĝas al _75 gradoj_ de 60.\n\n_+2:_ La atingopovo de Ŝokondo pligrandiĝas al _7 kaheloj_ de 5, kaj ĝia larĝo pligrandiĝas al _90 gradoj_ de 60.\n\n_+3:_ La atingopovo de Ŝokondo pligrandiĝas al _8 kaheloj_ de 5, kaj ĝia larĝo pligrandiĝas al _105 gradoj_ de 60.\n\n_+4:_ La atingopovo de Ŝokondo pligrandiĝas al _9 kaheloj_ de 5, kaj ĝia larĝo pligrandiĝas al _120 gradoj_ de 60.
