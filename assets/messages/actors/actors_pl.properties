actors.hero.talent.even_the_odds.desc=_+1:_ Wojownik zadaje dodatkowe _5% obrażeń bonusowych_ za każdego wroga w promieniu 2 pól, gdy czas trwania się kończy.\n\n_+2:_ Wojownik zadaje dodatkowe _10% obrażeń bonusowych_ za każdego wroga w promieniu 2 pól, gdy czas trwania się kończy.\n\n_+3:_ Wojownik zadaje dodatkowe _15% obrażeń bonusowych_ za każdego wroga w promieniu 2 pól, gdy czas trwania się kończy.\n\n_+4:_ Wojownik zadaje dodatkowe _20% obrażeń bonusowych_ za każdego wroga w promieniu 2 pól, gdy czas trwania się kończy.
