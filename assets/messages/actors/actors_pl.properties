actors.hero.talent.enhanced_rings.desc=_+1:_ Kiedy Łotrzyk używa artefaktu, jego pierścienie zyskują ulepszenie o +1 na _3 tury_.\n\n_+2:_ Kiedy Łotrzyk używa artefaktu, jego pierścienie zyskują ulepszenie o +1 na _6 tur_.\n\n_+3:_ Kiedy Łotrzyk używa artefaktu, jego pierścienie zyskują ulepszenie o +1 na _9 tur_.
