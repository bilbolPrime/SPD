actors.hero.talent.empowered_strike.desc=_+1:_ Pierwszy atak wręcz maga bitewnego jego laską po użyciu jej porażenia zadaje _+16% obrażeń_, a bonusowy efekt laski zyskuje _+50% mocy_.\n\n_+2:_ Pierwszy atak wręcz maga bitewnego jego laską po użyciu jej ...
