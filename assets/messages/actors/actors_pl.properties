actors.hero.talent.adventurers_intuition.desc=_+1:_ Duelistka rozpoznaje broń _2,5x szybciej_ i zbroję _1,75x szybciej_.\n\n_+2:_ Duelistka rozpoznaje broń _gdy ją zakłada_ i zbroję _2,5x szybciej_.
actors.hero.talent.adventurers_intuition.title=intuicja poszukiwacza przygód
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duelistka zyskuje _3 punkty osłony_, gdy używa zdolności broni i ma 50% lub mniej zdrowia.\n\n_+2:_ Duelistka zyskuje _5 punktów osłony_, gdy używa zdolności broni i ma 50% lub mniej zdrowia.
actors.hero.talent.aggressive_barrier.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zapewni on tarczę podczas wykonywania ataku wręcz przy niskim poziomie zdrowia, z 50-turowym czasem odnowienia.
actors.hero.talent.aggressive_barrier.title=agresywna bariera
actors.hero.talent.ally_warp.desc=_+1:_ Mag może wybrać sojusznika, z którym natychmiast zamieni się miejscami, w zasięgu _2 pól_.\n\n_+2:_ Mag może wybrać sojusznika, z którym natychmiast zamieni się miejscami, w zasięgu _4 pól_.\n\n_+3:_ Mag może wybrać sojusznika, z którym natychmiast zamieni się miejscami, w zasięgu _6 pól_.\n\nMag nie może zamienić się miejscami z nieruchomymi sojusznikami.
actors.hero.talent.ally_warp.title=sojuszniczy warp
actors.hero.talent.arcane_vision.desc=_+1:_ Kiedy Mag razi wroga, zyskuje wizję umysłu na _10 tur_.\n\n_+2:_ Kiedy Mag razi wroga, zyskuje wizję umysłu na _15 tur_.
actors.hero.talent.arcane_vision.title=tajemna wizja
actors.hero.talent.assassins_reach.desc=_+1:_ Zasięg mrugnięcia Zabójcy na każdy poziom przygotowania zwiększa się do _1/3/4/6 kafelków_, z 1/2/3/4.\n\n_+2:_ Zasięg mrugnięcia Zabójcy na każdy poziom przygotowania zwiększa się do _2/4/6/8 kafelków_, z 1/2/3/4.\n\n_+3:_ Zasięg mrugnięcia Zabójcy na każdy poziom przygotowania zwiększa się do _2/5/7/10 kafelków_, z 1/2/3/4.\n\nTo mrugnięcie może przenikać przez zagrożenia i wrogów, ale nie przez twardy teren, taki jak ściany.
actors.hero.talent.assassins_reach.title=zasięg zabójcy
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladyn może rzucić _Aurę Ochrony_, czar, który zapewnia Paladynowi i wszystkim sojusznikom w promieniu 2 pól _20% odporności na obrażenia_ oraz efekt glifu pancerza Paladyna z _+50% mocy_ na 20 tur, kosztem 2 ładunków.\n\n_+2:_ Paladyn może rzucić _Aurę Ochrony_, czar, który zapewnia Paladynowi i wszystkim sojusznikom w promieniu 2 pól _30% odporności na obrażenia_ oraz efekt glifu pancerza Paladyna z _+75% mocy_ na 20 tur, kosztem 2 ładunków.\n\n_+3:_ Paladyn może rzucić _Aurę Ochrony_, czar, który zapewnia Paladynowi i wszystkim sojusznikom w promieniu 2 pól _40% odporności na obrażenia_ oraz efekt glifu pancerza Paladyna z _+100% moc_ na 20 tur, kosztem 2 ładunków.
actors.hero.talent.aura_of_protection.title=aura ochrony
actors.hero.talent.backup_barrier.desc=_+1:_ Mag zyskuje _3 punkty ochrony_ za każdym razem, gdy zużyje ostatni ładunek swojej laski.\n\n_+2:_ Mag zyskuje _5 punktów ochrony_ za każdym razem, gdy zużyje ostatni ładunek swojej laski.
actors.hero.talent.backup_barrier.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zostanie on aktywowany przez różdżkę o najwyższym poziomie tego bohatera.
actors.hero.talent.backup_barrier.title=bariera zapasowa
actors.hero.talent.barkskin.desc=_+1:_ Kiedy wchodzi w trawę, Strażniczka zyskuje _0-50% swojego poziomu_ w zbroi z kory, która zanika z każdą turą.\n\n_+2:_ Kiedy wchodzi w trawę, Strażniczka zyskuje _0-100% swojego poziomu_ w zbroi z kory, która zanika z każdą turą.\n\n_+3:_ Kiedy wchodzi w trawę, Strażniczka zyskuje _0-150% swojego poziomu_ w zbroi z kory, która zanika z każdą turą.
actors.hero.talent.barkskin.title=kora
actors.hero.talent.beaming_ray.desc=Kapłan może rzucić zaklęcie _Beaming Ray_ ze wzmocnionego sojusznika za 1 ładunek. Promień ten może przenikać przez ściany i teleportować sojusznika w wyznaczone miejsce. Jeśli w tym miejscu znajduje się wróg, sojusznik pojawia się obok niego i obiera go za cel. Promień Promieniowy może teleportować nawet normalnie nieruchomych sojuszników, ale ma przy tym połowę zasięgu.\n\n_+1:_ Promień Promieniowy ma maksymalny zasięg _4 kafelki,_ i zwiększa premię Mocy Wielu do _+35% obrażeń_ przeciwko najbliższemu wrogowi na 10 tur.\n\n_+2:_ Promień Promieniowy ma maksymalny zasięg _8 kafelków,_ i zwiększa premię Mocy Wielu do _+40% obrażeń_ przeciwko najbliższemu wrogowi na 10 tur.\n\n_+3:_ Promień Promieniowy ma maksymalny zasięg _12 kafelków,_ i zwiększa premię Mocy Wielu do _+45% obrażeń_ przeciwko najbliższemu wrogowi na 10 tur.\n\n_+4:_ Promień Promieniowy ma maksymalny zasięg _16 kafelków,_ i zwiększa premię Mocy Wielu do _+50% obrażeń_ zadawanych najbliższemu wrogowi na 10 tur.
actors.hero.talent.beaming_ray.title=promień promieniujący
actors.hero.talent.blast_radius.desc=_+1:_ Promień wybuchu żywiołów zwiększa się do _5 kafelków_, z 4.\n\n_+2:_ Promień wybuchu żywiołów zwiększa się do _6 kafelków_, z 4.\n\n_+3:_ Promień wybuchu żywiołów zwiększa się do _7 kafelków_, z 4.\n\n_+4:_ Promień wybuchu żywiołów zwiększa się do _8 kafelków_, z 4.
actors.hero.talent.blast_radius.title=promień wybuchu
actors.hero.talent.bless.desc=_+1:_ Kapłan może rzucić _Błogosławieństwo_, czar, który zapewnia _6 tur błogosławieństwa i 10 osłony_, gdy jest rzucany na siebie lub _10 tur błogosławieństwa i 10 leczenia_, gdy jest rzucany na inną postać, kosztem 1 ładunku.\n\n_+2:_ Kapłan może rzucić _Błogosławieństwo_, czar, który zapewnia _10 tur błogosławieństwa i 15 osłony_, gdy jest rzucany na siebie lub _15 tur błogosławieństwa i 15 leczenia_, gdy jest rzucany na inną postać, kosztem 1 ładunku.\n\nNadmiar leczenia z tego czaru zostaje zamieniony na osłonę.
actors.hero.talent.bless.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zwiększy on celność i uniki bohatera i wszystkich sojuszników o 3% przy +1 lub o 5% przy +2.
actors.hero.talent.bless.title=błogosławić
actors.hero.talent.body_form.desc=Kapłan może rzucić _Body Form_, która napełnia Trinity mocą zaklęcia lub glifu, który Kapłan zidentyfikował w tej rundzie, za cenę 2 ładunków.\n\n_+1:_ Gdy używana jest Trinity, Kapłan zyskuje wybrany efekt na _20 tur._\n\n_+2:_ Gdy używana jest Trinity, Kapłan zyskuje wybrany efekt na _27 tur._\n\n_+3:_ Gdy używana jest Trinity, Kapłan zyskuje wybrany efekt na _33 tur._\n\n_+4:_ Gdy używana jest Trinity, Kapłan zyskuje wybrany efekt na _40 tur._\n\nTrinity może zostać nasycona tylko jednym efektem ciała na raz. Koszt ładowania pancerza Trójcy jest wyższy, jeśli wybrany glif jest rzadki i potężny.
actors.hero.talent.body_form.title=forma ciała
actors.hero.talent.body_replacement.desc=_+1:_ Po mrugnięciu, Łotrzyk pozostawia za sobą drewnianą przynętę, która ma _20 punktów zdrowia i pancerz 1-3_.\n\n_+2:_ Po mrugnięciu, Łotrzyk pozostawia za sobą drewnianą przynętę, która ma _40 punktów zdrowia i pancerz 2-6_.\n\n_+3:_ Po mrugnięciu, Łotrzyk pozostawia za sobą drewnianą przynętę, która ma _60 punktów zdrowia i pancerz 3-9_.\n\n_+4:_ Po mrugnięciu, Łotrzyk pozostawia za sobą drewnianą przynętę, która ma _80 punktów zdrowia i pancerz 4-12_.\n\nW danym momencie może być aktywny tylko jeden przynęta.
actors.hero.talent.body_replacement.title=wymiana ciała
actors.hero.talent.body_slam.desc=_+1:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie otrzymują obrażenia równe _1-4 plus 25%_ jego siły blokowania obrażeń.\n\n_+2:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie otrzymują obrażenia równe _2-8 plus 50%_ jego siły blokowania obrażeń.\n\n_+3:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie otrzymują obrażenia równe _3-12 plus 75%_ jego siły blokowania obrażeń.\n\n_+4:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie otrzymują obrażenia równe _4-16 plus 100%_ jego siły blokowania obrażeń.
actors.hero.talent.body_slam.title=uderzenie ciałem
actors.hero.talent.bounty_hunter.desc=_+1:_ Kiedy Zabójca zabije wroga przygotowanym ciosem, jego szansa na wypadnięcie przedmiotu wzrasta o _2/4/8/16%_, na każdy poziom przygotowania.\n\n_+2:_ Kiedy Zabójca zabije wroga przygotowanym ciosem, jego szansa na wypadnięcie przedmiotu wzrasta o _4/8/16/32%_, na każdy poziom przygotowania.\n\n_+3:_ Kiedy Zabójca zabije wroga przygotowanym ciosem, jego szansa na wypadnięcie przedmiotu wzrasta o _6/12/24/48%_, na każdy poziom przygotowania.
actors.hero.talent.bounty_hunter.title=łowca nagród
actors.hero.talent.cached_rations.desc=_+1:_ Łotrzyk może znaleźć _2 racje żywnościowe_ umieszczone w skrzyniach podczas eksploracji kolejnych pięter lochu.\n\n_+2:_ Łotrzyk może znaleźć _3 racje żywnościowe_ umieszczone w skrzyniach podczas eksploracji kolejnych pięter lochu.\n\nRacje żywnościowe są zjadane szybko, przywracają umiarkowaną ilość sytości, leczą 5 punktów zdrowia i przywracają 1 ładunek płaszcza cieni.
actors.hero.talent.cached_rations.title=zapasowe racje żywnościowe
actors.hero.talent.cleanse.desc=_+1:_ Kapłan może rzucić _Oczyszczenie_, czar, który _usuwa negatywne efekty statusu_ z Kapłana i pobliskich sojuszników, a także zapewnia im _10 tarczy_ kosztem 2 ładunków.\n\n_+2:_ Kapłan może rzucić _Oczyszczenie_, czar, który _zapewnia 3 tury odporności na negatywny status_ Kapłanowi i pobliskim sojusznikom, a także zapewnia im _20 tarczy_ kosztem 2 ładunków.\n\n_+3:_ Kapłan może rzucić _Oczyszczenie_, czar, który _zapewnia 5 tur odporności na negatywny status_ Kapłanowi i pobliskim sojusznikom, a także zapewnia im _30 tarczy_ kosztem 2 ładunków.
actors.hero.talent.cleanse.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, oczyści on bohatera z negatywnych efektów statusu po użyciu różdżki lub artefaktu, w 10/20/30% przypadków przy +1/+2/+3.
actors.hero.talent.cleanse.title=oczyścić
actors.hero.talent.cleave.desc=_+1:_ Dodatkowy czas, w którym Gladiator może zabić, wzrasta do _30 tur_, z 15.\n\n_+2:_ Dodatkowy czas, w którym Gladiator może zabić, wzrasta do _45 tur_, z 15.\n\n_+3:_ Dodatkowy czas, w którym Gladiator może zabić, wzrasta do _60 tur_, z 15.
actors.hero.talent.cleave.title=rozszczepiać
actors.hero.talent.cloned_armor.desc=_+1:_ Klon cienia zyskuje _12%_ wartości pancerza bohatera i ma _25% szans_ na użycie glifu na zbroi bohatera.\n\n_+2:_ Klon cienia zyskuje _24%_ wartości pancerza bohatera i ma _50% szans_ na użycie glifu na zbroi bohatera.\n\n_+3:_ Klon cienia zyskuje _36%_ wartości pancerza bohatera i ma _75% szans_ na użycie glifu na zbroi bohatera.\n\n_+4:_ Klon cienia zyskuje _48%_ wartości pancerza bohatera i ma _100% szans_ na użycie glifu na zbroi bohatera.
actors.hero.talent.cloned_armor.title=sklonowana zbroja
actors.hero.talent.close_the_gap.desc=_+1:_ Duelistka miga _do dwóch pól_ w kierunku swojego celu, rozpoczynając pojedynek.\n\n_+2:_ Duelistka miga _do trzech pól_ w kierunku swojego celu, rozpoczynając pojedynek.\n\n_+3:_ Duelistka miga _do czterech pól_ w kierunku swojego celu, rozpoczynając pojedynek.\n\n_+4:_ Duelistka miga _do pięciu pól_ w kierunku swojego celu, rozpoczynając pojedynek.\n\nTo miganie może przenikać przez przeszkody i wrogów, ale nie przez twardy teren, taki jak ściany. Miganie jest brane pod uwagę przy określaniu, czy wróg znajduje się w zasięgu, aby rzucić wyzwanie.
actors.hero.talent.close_the_gap.title=zamknąć lukę
actors.hero.talent.combined_energy.desc=_+1:_ Jeśli Mnich użyje zdolności broni i zdolności _4+ energii_ w odstępie 5 tur od siebie, odzyskuje 1 zużytą energię.\n\n_+2:_ Jeśli Mnich użyje zdolności broni i zdolności _3+ energii_ w odstępie 5 tur od siebie, odzyskuje 1 zużytą energię.\n\n_+3:_ Jeśli Mnich użyje zdolności broni i zdolności _2+ energii_ w odstępie 5 tur od siebie, odzyskuje 1 zużytą energię.
actors.hero.talent.combined_energy.title=połączona energia
actors.hero.talent.combined_lethality.desc=_+1:_ Jeśli Czempion zaatakuje bronią białą natychmiast po użyciu umiejętności innej broni, ten atak wykończy każdego wroga niebędącego bossem, który ma _poniżej 13% PW_.\n\n_+2:_ Jeśli Czempion zaatakuje bronią białą natychmiast po użyciu umiejętności innej broni, ten atak wykończy każdego wroga niebędącego bossem, który ma _poniżej 27% PW_.\n\n_+3:_ Jeśli Czempion zaatakuje bronią białą natychmiast po użyciu umiejętności innej broni, ten atak wykończy każdego wroga niebędącego bossem, który ma _poniżej 40% PW_.\n\nTen atak może być zwykłym atakiem bronią białą lub częścią umiejętności broni.
actors.hero.talent.combined_lethality.title=łączna śmiertelność
actors.hero.talent.conserved_magic.desc=_+1:_ Każde porażenie dziką magią zużywa teraz _0,33 ładunków_ zamiast 0,5, a dzika magia ma _25% szans_ na nieskorzystanie z tury.\n\n_+2:_ Każde porażenie dziką magią zużywa teraz _0,225 ładunków_ zamiast 0,5, a dzika magia ma _50% szans_ na nieskorzystanie z tury.\n\n_+3:_ Każde porażenie dziką magią zużywa teraz _0,15 ładunków_ zamiast 0,5, a dzika magia ma _75% szans_ na nieskorzystanie z tury.\n\n_+4:_ Każde porażenie dziką magią zużywa teraz _0,1 ładunków_ zamiast 0,5, a dzika magia ma _100% szans_ na nieskorzystanie z tury.
actors.hero.talent.conserved_magic.title=zachowana magia
actors.hero.talent.counter_ability.desc=_+1:_ Jeśli Duelistka użyje zdolności broni w ciągu 3 tur od ataku na jej powidoki, natychmiast odzyska _0,38 ładunków_.\n\n_+2:_ Jeśli Duelistka użyje zdolności broni w ciągu 3 tur od ataku na jej powidoki, natychmiast odzyska _0,77 ładunków_.\n\n_+3:_ Jeśli Duelistka użyje zdolności broni w ciągu 3 tur od ataku na jej powidoki, natychmiast odzyska _1,13 ładunków_.\n\n_+4:_ Jeśli Duelistka użyje zdolności broni w ciągu 3 tur od ataku na jej powidoki, natychmiast odzyska _1,5 ładunków_.
actors.hero.talent.counter_ability.title=zdolność kontrowania
actors.hero.talent.deadly_followup.desc=_+1:_ Gdy Duelistka uderzy wroga rzucaną bronią, zada mu _10% więcej obrażeń wręcz_ przez 5 tur.\n\n_+2:_ Gdy Duelistka uderzy wroga rzucaną bronią, zada mu _20% więcej obrażeń wręcz_ przez 5 tur.\n\n_+3:_ Gdy Duelistka uderzy wroga rzucaną bronią, zada mu _30% więcej obrażeń wręcz_ przez 5 tur.
actors.hero.talent.deadly_followup.title=śmiertelna kontynuacja
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk włącza się automatycznie, gdy Berserker ma umrzeć, a wściekłość wynosi 100% lub więcej, ale ma czas odnowienia wynoszący _3 poziomy bohatera_, gdy tak się dzieje.\n\n_+2:_ Berserk włącza się automatycznie, gdy Berserker ma umrzeć, a wściekłość wynosi 100% lub więcej, ale ma czas odnowienia wynoszący _2 poziomy bohatera_, gdy tak się dzieje.\n\n_+3:_ Berserk włącza się automatycznie, gdy Berserker ma umrzeć, a wściekłość wynosi 100% lub więcej, ale ma czas odnowienia wynoszący _1 poziom bohatera_, gdy tak się dzieje.\n\nNależy pamiętać, że Berserker umrze, nawet jeśli będzie miał 0 HP, gdy berserker się zakończy.
actors.hero.talent.deathless_fury.title=nieśmiertelna furia
actors.hero.talent.deathly_durability.desc=_+1:_ Wrogowie zabici przez znak śmierci dają Łotrzykowi tarczę równą _13%_ jego punktów zdrowia, gdy był oznaczony.\n\n_+2:_ Wrogowie zabici przez znak śmierci dają Łotrzykowi tarczę równą _25%_ jego punktów zdrowia, gdy był oznaczony.\n\n_+3:_ Wrogowie zabici przez znak śmierci dają Łotrzykowi tarczę równą _38%_ jego punktów zdrowia, gdy był oznaczony.\n\n_+4:_ Wrogowie zabici przez znak śmierci dają Łotrzykowi tarczę równą _50%_ jego punktów zdrowia, gdy był oznaczony.
actors.hero.talent.deathly_durability.title=śmiertelna trwałość
actors.hero.talent.desperate_power.desc=_+1:_ Różdżki i kostury Maga zyskują _+1 poziom_ na ostatnim porażeniu, gdy pozostał im ostatni ładunek.\n\n_+2:_ Różdżki i kostury Maga zyskują _+2 poziomy_ na ostatnim porażeniu, gdy pozostał im ostatni ładunek.\n\n_+3:_ Różdżki i kostury Maga zyskują _+3 poziomy_ na ostatnim porażeniu, gdy pozostał im ostatni ładunek.
actors.hero.talent.desperate_power.title=desperacka moc
actors.hero.talent.directed_power.desc=_+1:_ Bezpośredni atak żywiołowego uderzenia zyskuje _+30% mocy zaklęcia_ za każdego wroga w zasięgu działania żywiołowego uderzenia, wliczając cel ataku.\n\n_+2:_ Bezpośredni atak żywiołowego uderzenia zyskuje _+60% mocy zaklęcia_ za każdego wroga w zasięgu działania żywiołowego uderzenia, wliczając cel ataku.\n\n_+3:_ Bezpośredni atak żywiołowego uderzenia zyskuje _+90% mocy zaklęcia_ za każdego wroga w zasięgu działania żywiołowego uderzenia, wliczając cel ataku.\n\n_+4:_ Bezpośredni atak żywiołowego uderzenia zyskuje _+120% mocy zaklęcia_ za każdego wroga w zasięgu działania żywiołowego uderzenia, wliczając cel ataku.
actors.hero.talent.directed_power.title=moc kierowana
actors.hero.talent.divine_intervention.desc=_+1:_ W formie wzniesionej, duchowny może rzucać _Boską Interwencję_, która wzmacnia duchownego i wszystkich sojuszników do _150 tarcz_ i wydłuża czas trwania formy wzniesionej o _3 tury._\n\n_+2:_ W formie wzniesionej, duchowny może rzucać _Boską Interwencję_, która wzmacnia duchownego i wszystkich sojuszników do _200 tarcz_ i wydłuża czas trwania formy wzniesionej o _4 tury._\n\n_+3:_ W formie wzniesionej, duchowny może rzucać _Boską Interwencję_, która wzmacnia duchownego i wszystkich sojuszników do _250 tarcz_ i wydłuża czas trwania formy wzniesionej o _5 tury._\n\n_+4:_ W formie wzniesionej, duchowny może rzucać _Boską Interwencję Interwencja, która wzmacnia kapłana i wszystkich sojuszników do _300 tarcz_ i wydłuża Wzniesioną Formę o _6 tur._\n\nBoska Interwencja kosztuje aż 5 ładunków tomów i może być rzucona tylko raz w tej samej Wzniesionej Formie.
actors.hero.talent.divine_intervention.title=boska interwencja
actors.hero.talent.divine_sense.desc=_+1:_ Kapłan może rzucać _Boski Zmysł_, czar, który zapewnia mu _8 pól_ Wizji Umysłu na 50 tur i nie wymaga czasu, a jego rzucanie kosztuje 2 ładunki.\n\n_+2:_ Kapłan może rzucać _Boski Zmysł_, czar, który zapewnia mu _12 pól_ Wizji Umysłu na 50 tur i nie wymaga czasu, a jego rzucanie kosztuje 2 ładunki.
actors.hero.talent.divine_sense.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, obdarzy go on wizją umysłu na krótką chwilę po użyciu różdżki lub artefaktu o zasięgu 3 pól z +1 lub 5 pól z +2.
actors.hero.talent.divine_sense.title=boski zmysł
actors.hero.talent.double_jump.desc=_+1:_ Jeśli Wojownik wykona drugi skok w ciągu 3 tur, koszt tego skoku zostanie zmniejszony o _16%_.\n\n_+2:_ Jeśli Wojownik wykona drugi skok w ciągu 3 tur, koszt tego skoku zostanie zmniejszony o _30%_.\n\n_+3:_ Jeśli Wojownik wykona drugi skok w ciągu 3 tur, koszt tego skoku zostanie zmniejszony o _40%_.\n\n_+4:_ Jeśli Wojownik wykona drugi skok w ciągu 3 tur, koszt tego skoku zostanie zmniejszony o _50%_.
