actors.hero.talent.enlightening_meal.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zapewni on 2 tury regeneracji różdżki i artefaktu z +1 lub 3 tury z +2. Nie można go użyć do regeneracji rogu obfitości.
actors.hero.talent.enlightening_meal.title=Oświecający posiłek
actors.hero.talent.enraged_catalyst.desc=_+1:_ Zaklęcia i klątwy na broni Berserkera aktywują się częściej, im więcej ma on wściekłości, maksymalnie o _15% częściej_ przy 100% wściekłości.\n\n_+2:_ Zaklęcia i klątwy na broni Berserkera aktywują się częściej, im więcej ma on wściekłości, maksymalnie o _30% częściej_ przy 100% wściekłości.\n\n_+3:_ Zaklęcia i klątwy na broni Berserkera aktywują się częściej, im więcej ma on wściekłości, maksymalnie o _45% częściej_ przy 100% wściekłości.
actors.hero.talent.enraged_catalyst.title=wściekły katalizator
actors.hero.talent.evasive_armor.desc=_+1:_ Podczas swobodnego biegu Freerunner zyskuje dodatkowe _+1 uniku_ za każdy dodatkowy punkt siły swojego pancerza.\n\n_+2:_ Podczas swobodnego biegu Freebiegacz zyskuje dodatkowe _+2 uniku_ za każdy dodatkowy punkt siły swojego pancerza.\n\n_+3:_ Podczas swobodnego biegu Freerunner zyskuje dodatkowe _+3 uniki_ za każdy dodatkowy punkt siły na jego zbroi.
