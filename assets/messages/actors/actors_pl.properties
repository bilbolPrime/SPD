actors.hero.talent.enhanced_combo.desc=_+1:_ Gdy kombinacja Gladiatora wynosi 7 lub więcej, zasięg odrzucenia Clobbera zwiększa się do 3, zadaje on zawroty głowy i może zrzucać wrogów w dół.\n\n_+2:_ Oprócz korzyści z +1, gdy kombinacja Gladiatora wynosi 9 lub więcej, Parowanie działa na wiele ataków.\n\n_+3:_ Oprócz korzyści z +1 i +2, Gladiator może skoczyć do kombinacji/3 pól, gdy używa Rzutu, Zmiażdżenia lub Furii.
actors.hero.talent.enhanced_combo.title=ulepszone combo
actors.hero.talent.enhanced_lethality.desc=_+1:_ Zabójca może zabić wrogów, których zdrowie jest niższe niż _4/13/27/67%_ na każdy poziom przygotowania, w porównaniu z 3/10/20/50%.\n\n_+2:_ Zabójca może zabić wrogów, których zdrowie jest niższe niż _5/17/33/83%_ na każdy poziom przygotowania, w porównaniu z 3/10/20/50%.\n\n_+3:_ Zabójca może zabić wrogów, których zdrowie jest niższe niż _6/20/40/100%_ na każdy poziom przygotowania, w porównaniu z 3/10/20/50%.
