actors.hero.talent.growing_power.desc=_+1:_ Wzmocnienia ataku i szybkości ruchu pochodzące z mocy natury zwiększają się do _38% i 125%_, z 33% i 100%.\n\n_+2:_ Wzmocnienia ataku i szybkości ruchu pochodzące z mocy natury zwiększają się do _42% i 150%_, z 33% i 100%.\n\n_+3:_ Wzmocnienia ataku i szybkości ruchu pochodzące z mocy natury zwiększają się do _46% i 175%_, z 33% i 100%.\n\n_+4:_ Wzmocnienia ataku i szybkości ruchu pochodzące z mocy natury zwiększają się do _50% i 200%_, z 33% i 100%.
actors.hero.talent.growing_power.title=rosnąca moc
actors.hero.talent.hallowed_ground.desc=_+1:_ Kapłan może rzucić _Hallowed Ground_, czar, który uświęca teren na obszarze _3x3_ na 20 tur, kosztem 2 ładunków.\n\n_+2:_ Kapłan może rzucić _Hallowed Ground_, czar, który uświęca teren na obszarze _5x5_ na 20 tur, kosztem 2 ładunków.\n\n_+3:_ Kapłan może rzucić _Hallowed Ground_, czar, który uświęca teren na obszarze _7x7_ na 20 tur, kosztem 2 ładunków.\n\nPo rzuceniu, Hallowed Ground leczy sojuszników o 15 punktów zdrowia, na krótko unieruchamia wrogów i rozsiewa krótką trawę. Następnie powoli leczy sojuszników, okalecza wrogów i powoduje losowy wzrost wysokiej trawy. Poświęcona ziemia zapewnia kapłanowi tarczę zamiast leczenia i ulega zniszczeniu przez ogień.
actors.hero.talent.hallowed_ground.title=poświęcona ziemia
actors.hero.talent.hasty_retreat.desc=_+1:_ Po mrugnięciu Łotrzyk zyskuje _1 turę_ pośpiechu i niewidzialności.\n\n_+2:_ Po mrugnięciu Łotrzyk zyskuje _2 tury_ pośpiechu i niewidzialności.\n\n_+3:_ Po mrugnięciu Łotrzyk zyskuje _3 tury_ pośpiechu i niewidzialności.\n\n_+4:_ Po mrugnięciu Łotrzyk zyskuje _4 tury_ pośpiechu i niewidzialności.
actors.hero.talent.hasty_retreat.title=pospieszny odwrót
actors.hero.talent.hearty_meal.desc=_+1:_ Spożywanie pożywienia leczy Wojownika o _4 HP_, gdy jego zdrowie wynosi 33% lub mniej.\n\n_+2:_ Spożywanie pożywienia leczy Wojownika o _6 HP_, gdy jego zdrowie wynosi 33% lub mniej.
actors.hero.talent.hearty_meal.title=obfity posiłek
actors.hero.talent.heightened_senses.desc=_+1:_ Łowczyni zyskuje wizję umysłu postaci znajdujących się w odległości _2 pól od jej pozycji_.\n\n_+2:_ Łowczyni zyskuje wizję umysłu postaci znajdujących się w odległości _3 pól od jej pozycji_.
actors.hero.talent.heightened_senses.title=wyostrzone zmysły
actors.hero.talent.heroic_energy.desc=_+1:_ Zdolność pancerza bohatera ma _12% zmniejszony_ koszt ładowania.\n\n_+2:_ Zdolność pancerza bohatera ma _23% zmniejszony_ koszt ładowania.\n\n_+3:_ Zdolność pancerza bohatera ma _32% zmniejszony_ koszt ładowania.\n\n_+4:_ Zdolność pancerza bohatera ma _40% zmniejszony_ koszt ładowania.
actors.hero.talent.heroic_energy.rat_title=energia ratroiczna
actors.hero.talent.heroic_energy.title=heroiczna energia
actors.hero.talent.hold_fast.desc=_+1:_ Kiedy Wojownik czeka, zyskuje _1-2 pancerza_ i spowalnia zanikanie wzmocnień kombinacji i tarcz o _50%_ do momentu, aż się poruszy.\n\n_+2:_ Kiedy Wojownik czeka, zyskuje _2-4 pancerza_ i spowalnia zanikanie wzmocnień kombinacji i tarcz o _75%_ do momentu, aż się poruszy.\n\n_+3:_ Kiedy Wojownik czeka, zyskuje _3-6 pancerza_ i spowalnia zanikanie wzmocnień kombinacji i tarcz o _100%_ do momentu, aż się poruszy.
actors.hero.talent.hold_fast.title=trzymaj się mocno
actors.hero.talent.holy_intuition.desc=_+1:_ Kapłan może rzucić _Świętą Intuicję_, czar, który ujawnia, czy przedmiot jest przeklęty, kosztem _3 ładunków._\n\n_+2:_ Kapłan może rzucić _Świętą Intuicję_, czar, który ujawnia, czy przedmiot jest przeklęty, kosztem _2 ładunków._
actors.hero.talent.holy_intuition.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, pozwoli on bohaterowi zidentyfikować status klątwy na przeklętym przedmiocie tuż przed jego założeniem, w 15% przypadków przy +1 lub w 25% przypadków przy +2.
actors.hero.talent.holy_intuition.title=święta intuicja
actors.hero.talent.holy_lance.desc=_+1:_ Kapłan może rzucić _Świętą Włócznię_, niszczycielski czar, który zadaje _30-55 obrażeń_ kosztem 4 ładunków.\n\n_+2:_ Kapłan może rzucić _Świętą Włócznię_, niszczycielski czar, który zadaje _45-83 obrażeń_ kosztem 4 ładunków.\n\n_+3:_ Kapłan może rzucić _Świętą Włócznię_, niszczycielski czar, który zadaje _60-110 obrażeń_ kosztem 4 ładunków.\n\nŚwięta Włócznia zawsze zadaje maksymalne obrażenia demonicznym i nieumarłym wrogom. Święta Włócznia ma 30 tur czasu odnowienia, zanim można ją ponownie rzucić.
actors.hero.talent.holy_lance.title=święta włócznia
actors.hero.talent.impact_wave.desc=_+1:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie zostają odrzuceni o _2 pola_ i mają _25% szans_ na to, że staną się podatni na ataki przez 5 tur.\n\n_+2:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie zostają odrzuceni o _3 pola_ i mają _50% szans_ na to, że staną się podatni na ataki przez 5 tur.\n\n_+3:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie zostają odrzuceni o _4 pola_ i mają _75% szans_ na to, że staną się podatni na ataki przez 5 tur.\n\n_+4:_ Kiedy Wojownik ląduje po skoku, wszyscy sąsiadujący wrogowie zostają odrzuceni o _5 pól_ i mają _100% szans_ na to, że staną się podatni na ataki przez 5 tur.
actors.hero.talent.impact_wave.title=fala uderzeniowa
actors.hero.talent.improvised_projectiles.desc=_+1:_ Wojownik może oślepić wroga na _2 tury_, rzucając w niego przedmiotem innym niż broń miotana. Czas odnowienia wynosi 50 tur.\n\n_+2:_ Wojownik może oślepić wroga na _3 tury_, rzucając w niego przedmiotem innym niż broń miotana. Czas odnowienia wynosi 50 tur.
actors.hero.talent.improvised_projectiles.title=improwizowane pociski
actors.hero.talent.inscribed_power.desc=_+1:_ Gdy Mag czyta zwój lub używa przedmiotu magicznego, jego _następne 2 strzały różdżki_ otrzymują +2 poziomy.\n\n_+2:_ Gdy Mag czyta zwój lub używa przedmiotu magicznego, jego _następne 3 strzały różdżki_ otrzymują +2 poziomy.\n\nLiczba wzmocnionych strzałów różdżki jest podwajana podczas używania zwoju przedmiotu ulepszenia, transmutacji lub alchemii, który musi zostać wytworzony przy użyciu tych zwojów.\n\nW przypadku przedmiotów alchemicznych o większej ilości wyników (np. większości zaklęć), ten talent ma szansę na aktywację w zależności od tego, ile sztuk danego przedmiotu zostanie wyprodukowanych.
actors.hero.talent.inscribed_power.title=zapisana moc
actors.hero.talent.inscribed_stealth.desc=_+1:_ Łotrzyk zyskuje _3 tury_ niewidzialności po przeczytaniu zwoju lub użyciu przedmiotu magicznego.\n\n_+2:_ Łotrzyk zyskuje _5 tur_ niewidzialności po przeczytaniu zwoju lub użyciu przedmiotu magicznego.\n\nCzas trwania niewidzialności zostaje podwojony podczas używania zwoju ulepszenia, zwoju transmutacji lub przedmiotów alchemicznych, które muszą zostać wytworzone z tych zwojów.\n\nW przypadku przedmiotów alchemicznych o większej ilości wytworzonych przedmiotów (np. większości zaklęć), ten talent ma szansę na aktywację w zależności od tego, ile sztuk danego przedmiotu zostanie wytworzonych.
actors.hero.talent.inscribed_stealth.title=wpisany stealth
actors.hero.talent.invigorating_meal.desc=_+1:_ Jedzenie jedzenia zabiera Łowczyni 1 turę (jagody są zjadane natychmiast) i zapewnia jej _1 turę pośpiechu_.\n\n_+2:_ Jedzenie jedzenia zabiera Łowczyni 1 turę (jagody są zjadane natychmiast) i zapewnia jej _2 tury pośpiechu_.
actors.hero.talent.invigorating_meal.title=orzeźwiający posiłek
actors.hero.talent.invigorating_victory.desc=_+1:_ Jeśli Duelistka pokona swój cel przed zakończeniem pojedynku, leczy _5 HP plus 30% obrażeń_ otrzymanych podczas pojedynku.\n\n_+2:_ Jeśli Duelistka pokona swój cel przed zakończeniem pojedynku, leczy _10 HP plus 50% obrażeń_ otrzymanych podczas pojedynku.\n\n_+3:_ Jeśli Duelistka pokona swój cel przed zakończeniem pojedynku, leczy _15 HP plus 65% obrażeń_ otrzymanych podczas pojedynku.\n\n_+4:_ Jeśli Duelistka pokona swój cel przed zakończeniem pojedynku, leczy _20 HP plus 75% obrażeń_ otrzymanych podczas pojedynku.
actors.hero.talent.invigorating_victory.title=orzeźwiające zwycięstwo
actors.hero.talent.iron_stomach.desc=_+1:_ Spożywanie jedzenia zajmuje Wojownikowi 1 turę i zapewnia mu _75% odporności na obrażenia_ podczas jedzenia.\n\n_+2:_ Spożywanie jedzenia zajmuje Wojownikowi 1 turę i zapewnia mu _100% odporności na obrażenia_ podczas jedzenia.
actors.hero.talent.iron_stomach.title=żelazny żołądek
actors.hero.talent.iron_will.desc=_+1:_ Tarcza zapewniana przez pieczęć Wojownika jest _zwiększona o 1_.\n\n_+2:_ Tarcza zapewniana przez pieczęć Wojownika jest _zwiększona o 2_.
actors.hero.talent.iron_will.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, będzie on pasywnie zapewniał wojownikowi wersję tarczy o mocy 1 lub 2 maks. złamanej pieczęci.
actors.hero.talent.iron_will.title=żelazna wola
actors.hero.talent.judgement.desc=_+1:_ W formie wzniesionej, duchowny może rzucać _Wyrok_, który zadaje _10-20 obrażeń_ wszystkim widocznym wrogom.\n\n_+2:_ W formie wzniesionej, duchowny może rzucać _Wyrok_, który zadaje _15-30 obrażeń_ wszystkim widocznym wrogom.\n\n_+3:_ W formie wzniesionej, duchowny może rzucać _Wyrok_, który zadaje _20-40 obrażeń_ wszystkim widocznym wrogom.\n\n_+4:_ W formie wzniesionej, duchowny może rzucać _Wyrok_, który zadaje _25-50 obrażeń_ wszystkim widocznym wrogom.\n\nWyrok kosztuje 3 ładunki tomów. Wyrok zadaje +33% obrażeń za każde zaklęcie rzucone przez Kapłana od momentu wstąpienia w formę wzniesioną lub ostatniego rzucenia Wyroku.
actors.hero.talent.judgement.title=osąd
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladyn może rzucić _Lay on Hands_, czar, który natychmiast leczy pobliską postać o _15 HP_ lub zapewnia Paladynowi _15 osłony_, kosztem 1 ładunku.\n\n_+2:_ Paladyn może rzucić _Lay on Hands_, czar, który natychmiast leczy pobliską postać o _20 HP_ lub zapewnia Paladynowi _20 osłony_, kosztem 1 ładunku.\n\n_+3:_ Paladyn może rzucić _Lay on Hands_, czar, który natychmiast leczy pobliską postać o _25 HP_ lub zapewnia Paladynowi _25 osłony_, kosztem 1 ładunku.\n\nNadmiar leczenia z tego czaru zostaje przekształcony w osłonę. Umiejętność Nakładanie Rąk można rzucać wielokrotnie, ale nie można zastosować więcej niż trzykrotnego użycia osłony na raz.
actors.hero.talent.lay_on_hands.title=włożyć ręce
actors.hero.talent.lethal_defense.desc=_+1:_ Kiedy Gladiator zabija wroga ruchem kombinowanym, czas odnowienia jego osłony złamanej pieczęci zostaje _zmniejszony o 50 tur_.\n\n_+2:_ Kiedy Gladiator zabija wroga ruchem kombinowanym, czas odnowienia jego osłony złamanej pieczęci zostaje _zmniejszony o 100 tur_.\n\n_+3:_ Kiedy Gladiator zabija wroga ruchem kombinowanym, czas odnowienia jego osłony złamanej pieczęci zostaje _zmniejszony o 150 tur_.\n\nCzas odnowienia tarczy może zostać skrócony nawet do -150 tur za pomocą tego talentu, co oznacza, że będzie ona natychmiast ponownie dostępna po aktywacji.
actors.hero.talent.lethal_defense.title=śmiertelna obrona
actors.hero.talent.lethal_haste.desc=_+1:_ Kiedy Duelistka zadaje śmiertelny cios wrogowi za pomocą umiejętności broni, zyskuje natychmiastowy ruch o wartości _3 tur_.\n\n_+2:_ Kiedy Duelistka zadaje śmiertelny cios wrogowi za pomocą umiejętności broni, zyskuje natychmiastowy ruch o wartości _5 tur_.
actors.hero.talent.lethal_haste.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, będzie się on aktywował podczas zwykłych ataków bronią, z czasem odnowienia wynoszącym 100 tur.
actors.hero.talent.lethal_haste.title=śmiertelny pośpiech
actors.hero.talent.lethal_momentum.desc=_+1:_ Kiedy Wojownik zadaje śmiertelny cios wrogowi bronią fizyczną, ma _67% szans_ na to, że nie będzie musiał wykonywać żadnych tur.\n\n_+2:_ Kiedy Wojownik zadaje śmiertelny cios wrogowi bronią fizyczną, ma _100% szans_ na to, że nie będzie wykonywał żadnych tur.
actors.hero.talent.lethal_momentum.title=śmiercionośny pęd
actors.hero.talent.life_link.desc=Kapłan może rzucić zaklęcie _Łączność Życia_ między sobą a wzmocnionym sojusznikiem kosztem 2 ładunków. Ten czar sprawia, że obrażenia są dzielone pomiędzy Kleryka i jego sojusznika, a korzystne zaklęcia kleryka poziomu 3 lub niższego działają na obu, jeśli którykolwiek z nich jest dotknięty.\n\n_+1:_ Łączność Życia trwa przez _10 tur_ i zwiększa premię Mocy Wielu do _-35% otrzymywanych obrażeń._\n\n_+2:_ Łączność Życia trwa przez _13 tur_ i zwiększa premię Mocy Wielu do _-40% otrzymywanych obrażeń._\n\n_+3:_ Łączność Życia trwa przez _17 tur_ i zwiększa premię Mocy Wielu do _-45% otrzymywanych obrażeń._\n\n_+4:_ Łączność Życia trwa przez _20 tur_ i zwiększa premię Mocy Wielu do _-50% otrzymywanych obrażeń._
actors.hero.talent.life_link.title=łącze życia
actors.hero.talent.light_cloak.desc=_+1:_ Łotrzyk może używać swojego płaszcza cieni, gdy nie jest wyposażony, ale ładuje się on z _25% szybkości_, gdy go nie ma.\n\n_+2:_ Łotrzyk może używać swojego płaszcza cieni, gdy nie jest wyposażony, ale ładuje się on z _50% szybkości_, gdy go nie ma.\n\n_+3:_ Łotrzyk może używać swojego płaszcza cieni, gdy nie jest wyposażony, ale ładuje się on z _75% szybkości_, gdy go nie ma.
actors.hero.talent.light_cloak.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zwiększy on prędkość ładowania wszystkich artefaktów o 7/13/20% przy +1/+2/+3.
actors.hero.talent.light_cloak.title=lekki płaszcz
actors.hero.talent.light_reading.desc=_+1:_ Kapłan może używać swojej świętej księgi, gdy nie jest wyposażona, ale ładuje się ona z _25% szybkości_, gdy jej nie ma.\n\n_+2:_ Kapłan może używać swojej świętej księgi, gdy nie jest wyposażona, ale ładuje się ona z _50% szybkości_, gdy jej nie ma.\n\n_+3:_ Kapłan może używać swojej świętej księgi, gdy nie jest wyposażona, ale ładuje się ona z _75% szybkości_, gdy jej nie ma.
actors.hero.talent.light_reading.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zwiększy on prędkość ładowania wszystkich różdżek o 7/13/20% przy +1/+2/+3.
actors.hero.talent.light_reading.title=Lekka lektura
actors.hero.talent.lingering_magic.desc=_+1:_ Kiedy Mag atakuje różdżką lub laską, jego następny atak fizyczny zadaje _1-2 dodatkowych obrażeń_.\n\n_+2:_ Kiedy Mag atakuje różdżką lub laską, jego następny atak fizyczny zadaje _2 dodatkowych obrażeń_.
actors.hero.talent.lingering_magic.title=trwająca magia
actors.hero.talent.liquid_agility.desc=_+1:_ Po wypiciu lub rzuceniu mikstury, naparu lub eliksiru, Duelist ma _3x unik_ i _3x celność_ w swoim następnym ataku wręcz w ciągu 5 tur.\n\n_+2:_ Po wypiciu lub rzuceniu mikstury, naparu lub eliksiru, Duelist ma _nieskończone uniki_ i _nieskończoną celność_ w swoim następnym ataku wręcz w ciągu 5 tur.\n\nTa premia trwa dodatkową turę i atak podczas używania mikstur siły, doświadczenia lub przedmiotów alchemicznych, które muszą zostać wytworzone przy użyciu tych mikstur.\n\nW przypadku przedmiotów alchemicznych o większej wydajności (np. wywaru wodnego), ten talent ma szansę na aktywację w zależności od tego, ile sztuk danego przedmiotu zostanie wytworzonych.
actors.hero.talent.liquid_agility.title=płynna zwinność
actors.hero.talent.liquid_nature.desc=_+1:_ Gdy Łowczyni wypije lub rzuci miksturę, wywar lub eliksir, _maksymalnie 4 pola trawy_ wyrastają w okolicy, a sąsiedzi wrogowie zostają unieruchomieni na _1 turę_.\n\n_+2:_ Gdy Łowczyni wypije lub rzuci miksturę, wywar lub eliksir, _maksymalnie 6 pól trawy_ wyrastają w okolicy, a sąsiedzi wrogowie zostają unieruchomieni na _2 tury_.\n\nCzas trwania trawy i korzenia zostaje podwojony podczas używania mikstur siły, doświadczenia lub przedmiotów alchemicznych, które muszą zostać wytworzone przy użyciu tych mikstur.\n\nW przypadku przedmiotów alchemicznych o większej wydajności (np. wywaru wodnego) ten talent ma szansę na aktywację w zależności od tego, ile sztuk danego przedmiotu zostanie wytworzonych.
actors.hero.talent.liquid_nature.title=płynna natura
actors.hero.talent.liquid_willpower.desc=_+1:_ Wojownik zyskuje _6,5% swoich maks. PW w tarczy_ po wypiciu lub rzuceniu mikstury, wywaru lub eliksiru.\n\n_+2:_ Wojownik zyskuje _10% swoich maks. PW w tarczy_ po wypiciu lub rzuceniu mikstury, wywaru lub eliksiru.\n\nWartość tarczy jest podwajana podczas używania mikstur siły, doświadczenia lub przedmiotów alchemicznych, które muszą być wytworzone przy użyciu tych mikstur.\n\nW przypadku przedmiotów alchemicznych o większej ilości (np. wywaru wodnego), ten talent ma szansę na aktywację w zależności od tego, ile sztuk danego przedmiotu zostanie wytworzony.
actors.hero.talent.liquid_willpower.title=płynna siła woli
actors.hero.talent.longrange_warp.desc=_+1:_ Mag może teraz teleportować się między piętrami, kosztując _150%_.\n\n_+2:_ Mag może teraz teleportować się między piętrami, kosztując _117%_.\n\n_+3:_ Mag może teraz teleportować się między piętrami, kosztując _83%_.\n\n_+4:_ Mag może teraz teleportować się między piętrami, kosztując _50%_.\n\nMag nie może użyć teleportacji dalekiego zasięgu, aby opuścić zablokowane piętro.
actors.hero.talent.longrange_warp.title=Warp dalekiego zasięgu
actors.hero.talent.mind_form.desc=Kapłan może rzucić _Mind Form_, która napełnia Trinity mocą różdżki lub broni rzucanej, której Kapłan użył w tej rundzie, kosztem 3 ładunków.\n\n_+1:_ Kiedy używana jest Trinity, Kapłan używa efektu zapięcia lub rzutu wybranego przedmiotu, tak jakby był on _+3._\n\n_+2:_ Kiedy używana jest Trinity, Kapłan używa efektu zapięcia lub rzutu wybranego przedmiotu, tak jakby był on _+4._\n\n_+3:_ Kiedy używana jest Trinity, Kapłan używa efektu zapięcia lub rzutu wybranego przedmiotu, tak jakby był on _+5._\n\n_+4 ... _+6._\n\nTrinity może zostać nasycony tylko jednym efektem umysłu na raz.
actors.hero.talent.mind_form.title=forma umysłu
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Kapłan może rzucić _Modlitwę Mnemoniczną_, zaklęcie, które przedłuża efekty wzmocnień/osłabień sojusznika/wroga na _3 tury_, koszt 1 ładunku.\n\n_+2:_ Kapłan może rzucić _Modlitwę Mnemoniczną_, zaklęcie, które przedłuża efekty wzmocnień/osłabień sojusznika/wroga na _4 tury_, koszt 1 ładunku.\n\n_+3:_ Kapłan może rzucić _Modlitwę Mnemoniczną_, zaklęcie, które przedłuża efekty wzmocnień/osłabień sojusznika/wroga na _5 tur_, koszt 1 ładunku.\n\nRzucenie Modlitwy Mnemonicznej nie zajmuje dużo czasu. Modlitwa Mnemoniczna może przedłużyć działanie konkretnego wzmocnienia/osłabienia tylko raz i nie może przedłużyć efektów wzmocnień z umiejętności pancerza.
actors.hero.talent.mnemonic_prayer.title=modlitwa mnemoniczna
actors.hero.talent.monastic_vigor.desc=_+1:_ Jeśli Mnich ma _100% energii_, jego umiejętności zostają wzmocnione.\n\n_+2:_ Jeśli Mnich ma _80% lub więcej energii_, jego umiejętności zostają wzmocnione.\n\n_+3:_ Jeśli Mnich ma _60% lub więcej energii_, jego umiejętności zostają wzmocnione.\n\nPo wzmocnieniu:\n- Flurry nakłada zaklęcie na twoją broń\n- Focus jest natychmiastowy\n- Dash zyskuje +4 zasięg\n- Dragon Kick zadaje +50% obrażeń i nakłada efekt odrzucenia i ogłuszenia na wszystkich sąsiadujących wrogów\n- Meditate powoli leczy 20% brakujących HP i przyznaje 80% odporności na obrażenia.
actors.hero.talent.monastic_vigor.title=wigor monastyczny
actors.hero.talent.mystical_charge.desc=_+1:_ Uderzenie kosturem daje Battlemage'owi _0,5 tury_ odnawiania artefaktów.\n\n_+2:_ Uderzenie kosturem daje Battlemage'owi _1 tury_ odnawiania artefaktów.\n\n_+3:_ Uderzenie kosturem daje Battlemage'owi _1,5 tury_ odnawiania artefaktów.
actors.hero.talent.mystical_charge.title=mistyczny ładunek
actors.hero.talent.mystical_meal.desc=_+1:_ Spożywanie pożywienia zabiera Łotrowi 1 turę (porcje zaopatrzenia są zjadane natychmiast) i zapewnia mu _3 tury ładowania artefaktów_.\n\n_+2:_ Spożywanie pożywienia zabiera Łotrowi 1 turę (porcje zaopatrzenia są zjadane natychmiast) i zapewnia mu _5 tur ładowania artefaktów_.\n\nTego talentu nie można użyć, aby róg obfitości się naładował.
actors.hero.talent.mystical_meal.title=mistyczny posiłek
actors.hero.talent.natures_aid.desc=_+1:_ Łowczyni zyskuje 0-2 punktów pancerza z kory, który zanika co _3 tury_, gdy w jej polu widzenia aktywuje się efekt rośliny.\n\n_+2:_ Łowczyni zyskuje 0-2 punktów pancerza z kory, który zanika co _5 tur_, gdy w jej polu widzenia aktywuje się efekt rośliny.
actors.hero.talent.natures_aid.title=pomoc natury
actors.hero.talent.natures_bounty.desc=_+1:_ Łowczyni może znaleźć _4 jagody_ ukryte w wysokiej trawie podczas eksploracji kolejnych pięter lochu.\n\n_+2:_ Łowczyni może znaleźć _6 jagód_ ukryte w wysokiej trawie podczas eksploracji kolejnych pięter lochu.\n\nJagody są zjadane szybko, przywracają niewielką ilość sytości i mogą zawierać użyteczne nasiono.
actors.hero.talent.natures_bounty.title=dary natury
actors.hero.talent.natures_wrath.desc=_+1:_ Gdy aktywna jest moc natury, strzały z łuku ducha mają _8% szans_ na wywołanie losowego szkodliwego efektu rośliny.\n\n_+2:_ Gdy aktywna jest moc natury, strzały z łuku ducha mają _17% szans_ na wywołanie losowego szkodliwego efektu rośliny.\n\n_+3:_ Gdy aktywna jest moc natury, strzały z łuku ducha mają _25% szans_ na wywołanie losowego szkodliwego efektu rośliny.\n\n_+4:_ Gdy aktywna jest moc natury, strzały z łuku ducha mają _33% szans_ na wywołanie losowego szkodliwego efektu rośliny.\n\nRośliny, które można wywołać, to: ślepota, ognisty kwiat, czapa lodowa, mech smutku i burzowica.
actors.hero.talent.natures_wrath.title=gniew natury
actors.hero.talent.necromancers_minions.desc=_+1:_ Kiedy umiera wróg oznaczony duszą, Czarnoksiężnik ma _13% szans_ na wskrzeszenie go jako spaczonego widma.\n\n_+2:_ Kiedy umiera wróg oznaczony duszą, Czarnoksiężnik ma _27% szans_ na wskrzeszenie go jako spaczonego widma.\n\n_+3:_ Kiedy umiera wróg oznaczony duszą, Czarnoksiężnik ma _40% szans_ na wskrzeszenie go jako spaczonego widma.
actors.hero.talent.necromancers_minions.title=słudzy nekromanty
actors.hero.talent.patient_strike.desc=_+1:_ Jeśli Duelistka poczeka przed wykonaniem ataku wręcz, zada _1-2 dodatkowych obrażeń_.\n\n_+2:_ Jeśli Duelistka poczeka przed wykonaniem ataku wręcz, zada _2 dodatkowych obrażeń_.
actors.hero.talent.patient_strike.title=strajk pacjentów
actors.hero.talent.perfect_copy.desc=_+1:_ Klon cienia zyskuje _10%_ maks. punktów zdrowia bohatera i może natychmiast zamienić się miejscami z bohaterem oddalonym o _1 pole_.\n\n_+2:_ Klon cienia zyskuje _20%_ maks. punktów zdrowia bohatera i może natychmiast zamienić się miejscami z bohaterem oddalonym o _2 pola_.\n\n_+3:_ Klon cienia zyskuje _30%_ maks. punktów zdrowia bohatera i może natychmiast zamienić się miejscami z bohaterem oddalonym o _3 pola_.\n\n_+4:_ Klon cienia zyskuje _40%_ maks. punktów zdrowia bohatera i może natychmiast zamienić się miejscami z bohaterem oddalonym o _4 pola_.
actors.hero.talent.perfect_copy.title=idealna kopia
actors.hero.talent.point_blank.desc=_+1:_ Gdy Łowczyni używa łuku lub broni miotanej w walce wręcz, jej celność spada o _-25%,_ zamiast -50%.\n\n_+2:_ Gdy Łowczyni używa łuku lub broni miotanej w walce wręcz, jej celność spada o _normalną,_ zamiast -50%.\n\n_+3:_ Gdy Łowczyni używa łuku lub broni miotanej w walce wręcz, jej celność spada o _+25%,_ zamiast -50%.\n\nNależy pamiętać, że broń miotana lub łuk duchowy zawsze mają +50% celności, gdy są używane na odległość.
actors.hero.talent.point_blank.title=wprost
actors.hero.talent.precise_assault.desc=_+1:_ Kiedy Duelist używa zdolności broni, zyskuje _2x celność_ w kolejnym ataku wręcz w ciągu 5 tur.\n\n_+2:_ Kiedy Duelist używa zdolności broni, zyskuje _5x celność_ w kolejnym ataku wręcz w ciągu 5 tur.\n\n_+3:_ Kiedy Duelist używa zdolności broni, zyskuje _nieskończoną celność_ w kolejnym ataku wręcz w ciągu 5 tur.
actors.hero.talent.precise_assault.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zwiększy on celność walki wręcz o 10% przy +1, 20% przy +2 lub 30% przy +3.
actors.hero.talent.precise_assault.title=precyzyjny atak
actors.hero.talent.projectile_momentum.desc=_+1:_ Podczas swobodnego biegu, Freerunner zyskuje _+50% celności i +15% obrażeń_ za pomocą broni rzucanej.\n\n_+2:_ Podczas swobodnego biegu, Freerunner zyskuje _+100% celności i +30% obrażeń_ za pomocą broni rzucanej.\n\n_+3:_ Podczas swobodnego biegu, Freerunner zyskuje _+150% celności i +45% obrażeń_ za pomocą broni rzucanej.
actors.hero.talent.projectile_momentum.title=pęd pocisku
actors.hero.talent.projecting_blades.desc=_+1:_ Ostrza spektralne mają _+25% dokładności_ i mogą przebić się przez maks. _2 płytki lite_.\n\n_+2:_ Ostrza spektralne mają _+50% dokładności_ i mogą przebić się przez maks. _4 płytki lite_.\n\n_+3:_ Ostrza spektralne mają _+75% dokładności_ i mogą przebić się przez maks. _6 płytek lite_.\n\n_+4:_ Ostrza spektralne mają _+100% dokładności_ i mogą przebić się przez maks. _8 płytek lite_.
actors.hero.talent.projecting_blades.title=wystające ostrza
actors.hero.talent.protective_shadows.desc=_+1:_ Łotrzyk zyskuje jedną tarczę _co drugą turę_, gdy jest niewidzialny, _maksymalnie 3_.\n\n_+2:_ Łotrzyk zyskuje jedną tarczę _co drugą turę_, gdy jest niewidzialny, _maksymalnie 5_.
actors.hero.talent.protective_shadows.title=cienie ochronne
actors.hero.talent.provoked_anger.desc=_+1:_ Gdy jakiekolwiek wzmocnienie tarczy zastosowane do Wojownika zostanie przerwane przez obrażenia, jego następny atak fizyczny zada _3 dodatkowe obrażenia_.\n\n_+2:_ Gdy jakiekolwiek wzmocnienie tarczy zastosowane do Wojownika zostanie przerwane przez obrażenia, jego następny atak fizyczny zada _5 dodatkowych obrażeń_.
actors.hero.talent.provoked_anger.title=wywołał gniew
actors.hero.talent.ratforcements.desc=_+1:_ Użycie ratmogrify na sobie _przywołuje 1_ szczura torbacza obok ciebie.\n\n_+2:_ Użycie ratmogrify na sobie _przywołuje 2_ szczury torbacze obok ciebie.\n\n_+3:_ Użycie ratmogrify na sobie _przywołuje 3_ szczury torbacze obok ciebie.\n\n_+4:_ Użycie ratmogrify na sobie _przywołuje 4_ szczury torbacze obok ciebie.
actors.hero.talent.ratforcements.title=siły bezpieczeństwa
actors.hero.talent.ratlomacy.desc=_+1:_ Użycie ratmogrify na ratmogrifyowanym wrogu czyni go przyjaznym, a przemiana sprawia, że jest on trwały.\n\n_+2:_ Użycie ratmogrify na ratmogrifyowanym wrogu czyni go przyjaznym, przemiana sprawia, że jest on trwały i daje mu _2 tury_ adrenaliny.\n\n_+3:_ Użycie ratmogrify na ratmogrifyowanym wrogu czyni go przyjaznym, przemiana sprawia, że jest on trwały i daje mu _4 tury_ adrenaliny.\n\n_+4:_ Użycie ratmogrify na ratmogrifyowanym wrogu czyni go przyjaznym, przemiana sprawia, że jest on trwały i daje mu _6 tur_ adrenaliny.
actors.hero.talent.ratlomacy.title=ratlomacja
actors.hero.talent.ratsistance.desc=_+1:_ Wrodzy, podrasowani szczuropodobni wrogowie zadają _-10% obrażeń_.\n\n_+2:_ Wrodzy, podrasowani szczuropodobni wrogowie zadają _-19% obrażeń_.\n\n_+3:_ Wrodzy, podrasowani szczuropodobni wrogowie zadają _-27% obrażeń_.\n\n_+4:_ Wrodzy, podrasowani szczuropodobni wrogowie zadają _-35% obrażeń_.
actors.hero.talent.ratsistance.title=odporność na szczury
actors.hero.talent.reactive_barrier.desc=_+1:_ Mag zyskuje _2,5 tarczy_ za każdą postać pod wpływem wybuchu żywiołów, maksymalnie 5 postaci.\n\n_+2:_ Mag zyskuje _5 tarczy_ za każdą postać pod wpływem wybuchu żywiołów, maksymalnie 6 postaci.\n\n_+3:_ Mag zyskuje _7,5 tarczy_ za każdą postać pod wpływem wybuchu żywiołów, maksymalnie 7 postaci.\n\n_+4:_ Mag zyskuje _10 tarczy_ za każdą postać pod wpływem wybuchu żywiołów, maksymalnie 8 postaci.
actors.hero.talent.reactive_barrier.title=bariera reaktywna
actors.hero.talent.recall_inscription.desc=_+1:_ Kapłan może rzucić _Recall Inscription_, zaklęcie pozwalające mu powtórzyć efekt ostatniego użytego kamienia runicznego lub zwoju w ciągu _10 tur._\n\n_+2:_ Kapłan może rzucić _Recall Inscription_, zaklęcie pozwalające mu powtórzyć efekt ostatniego użytego kamienia runicznego lub zwoju w ciągu _300 tur._\n\nRecall Inscription nie może być używany ze zwojami ulepszeń. Koszt ładowania tego zaklęcia różni się w zależności od tego, który przedmiot był ostatnio używany: 2 dla kamienia runicznego, 3 dla zwoju, 4 dla zwoju egzotycznego. Koszt ładowania jest również podwajany, gdy jest używany ze zwojem transmutacji lub przedmiotami alchemicznymi, które muszą zostać wytworzone za pomocą transmutacji lub ulepszeń.
actors.hero.talent.recall_inscription.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zwróci on zwój lub kamień runiczny o 10% w przypadku +1 lub o 15% w przypadku +2. Zwoje Ulepszeń są wyłączone z tego efektu.
actors.hero.talent.recall_inscription.refunded=Zwrócono Ci pieniądze za przedmiot!
actors.hero.talent.recall_inscription.title=przywołać napis
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Kiedy Łowczyni nadepnie na krótką trawę lub żar, trawa ta wyrasta w wysoką trawę, którą Łowczyni natychmiast bruzduje. Czas odnowienia wynosi _10 tur_.\n\n_+2:_ Kiedy Łowczyni nadepnie na krótką trawę lub żar, trawa ta wyrasta w wysoką trawę, którą Łowczyni natychmiast bruzduje. Czas odnowienia wynosi _5 tur_.\n\nTen talent spowoduje bruzdowanie trawy, jeśli pasywne efekty regeneracji są wyłączone lub bohater nie zdobywał doświadczenia przez długi czas.
actors.hero.talent.rejuvenating_steps.title=kroki odmładzające
actors.hero.talent.remote_beacon.desc=_+1:_ Mag może umieścić latarnię w dowolnym miejscu w promieniu _4 pól_.\n\n_+2:_ Mag może umieścić latarnię w dowolnym miejscu w promieniu _8 pól_.\n\n_+3:_ Mag może umieścić latarnię w dowolnym miejscu w promieniu _12 pól_.\n\n_+4:_ Mag może umieścić latarnię w dowolnym miejscu w promieniu _16 pól_.\n\nMag nie może umieszczać latarni w miejscach, do których nie ma dostępu.
actors.hero.talent.remote_beacon.title=Zdalny sygnalizator
actors.hero.talent.rogues_foresight.desc=_+1:_ Gdy Łotrzyk znajduje się na poziomie z sekretnym pokojem, ma _75% szans na zauważenie_, że poziom ten zawiera sekret.\n\n_+2:_ Gdy Łotrzyk znajduje się na poziomie z sekretnym pokojem, ma _100% szans na zauważenie_, że poziom ten zawiera sekret.
actors.hero.talent.rogues_foresight.title=przewidywanie łobuza
actors.hero.talent.runic_transference.desc=_+1:_ Złamana pieczęć Wojownika może przenosić _zwykłe glify_ w taki sam sposób, w jaki przenosi ulepszenie.\n\n_+2:_ Złamana pieczęć Wojownika może przenosić _zwykłe, potężne i przeklęte glify_ w taki sam sposób, w jaki przenosi ulepszenie.\n\nPieczęć może przenosić glify tylko wtedy, gdy zostały one zastosowane do zbroi podczas zakładania pieczęci.
actors.hero.talent.runic_transference.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zamiast tego glify na twojej zbroi będą odporne na usunięcie przez zwoje ulepszeń. Glify zaczną zanikać po ulepszeniu z poziomu 6 (z 4) do +1 lub z poziomu 7 (z 4) do +2. Poziom, na którym glify z pewnością zostaną utracone, pozostaje niezmieniony i wynosi +8.
actors.hero.talent.runic_transference.title=przeniesienie runiczne
actors.hero.talent.satiated_spells.desc=_+1:_ Spożywanie pożywienia sprawia, że duchowny zyskuje _3 punkty ochrony_ przy następnym rzuceniu zaklęcia.\n\n_+2:_ Spożywanie pożywienia sprawia, że duchowny zyskuje _5 punktów ochrony_ przy następnym rzuceniu zaklęcia.
actors.hero.talent.satiated_spells.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, natychmiast przyzna on tarczę, która zacznie zanikać normalnie po 10 turach.
actors.hero.talent.satiated_spells.title=Nasycone zaklęcia
actors.hero.talent.scholars_intuition.desc=_+1:_ Mag rozpoznaje różdżki _3x szybciej_.\n\n_+2:_ Mag rozpoznaje różdżki, _kiedy ich używa_.
actors.hero.talent.scholars_intuition.title=intuicja uczonego
actors.hero.talent.searing_light.desc=_+1:_ Fizyczne ataki Kleryka na wrogów oświetlonych _Światłem Przewodnim_ zadają _+3 obrażeń._\n\n_+2:_ Fizyczne ataki Kleryka na wrogów oświetlonych _Światłem Przewodnim_ zadają _+5 obrażeń._
actors.hero.talent.searing_light.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, przyzna on bonus do obrażeń po użyciu różdżki lub artefaktu na przeciwniku, z czasem odnowienia wynoszącym 20 tur.
actors.hero.talent.searing_light.title=Palące światło
actors.hero.talent.seer_shot.desc=_+1:_ Kiedy Łowczyni wystrzeliwuje strzałę w ziemię, zapewnia ona wizję na obszarze 3x3 wokół siebie przez _5 tur_. Czas odnowienia wynosi 20 tur.\n\n_+2:_ Kiedy Łowczyni wystrzeliwuje strzałę w ziemię, zapewnia ona wizję na obszarze 3x3 wokół siebie przez _10 tur_. Czas odnowienia wynosi 20 tur.\n\n_+3:_ Kiedy Łowczyni wystrzeliwuje strzałę w ziemię, zapewnia ona wizję na obszarze 3x3 wokół siebie przez _15 tur_. Czas odnowienia wynosi 20 tur.
actors.hero.talent.seer_shot.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zostanie on aktywowany przez dowolną rzucaną broń.
actors.hero.talent.seer_shot.title=strzał jasnowidza
actors.hero.talent.shadow_blade.desc=_+1:_ Klon cienia zyskuje _8%_ obrażeń bohatera na turę i ma _25% szans_ na użycie zaklęcia na broni bohatera.\n\n_+2:_ Klon cienia zyskuje _16%_ obrażeń bohatera na turę i ma _50% szans_ na użycie zaklęcia na broni bohatera.\n\n_+3:_ Klon cienia zyskuje _24%_ obrażeń bohatera na turę i ma _75% szans_ na użycie zaklęcia na broni bohatera.\n\n_+4:_ Klon cienia zyskuje _32%_ obrażeń bohatera na turę i ma _100% szans_ na użycie zaklęcia na broni bohatera.
actors.hero.talent.shadow_blade.title=ostrze cienia
actors.hero.talent.shadow_step.desc=_+1:_ Jeśli łotrzyk użyje bomby dymnej, będąc niewidzialnym, efekt pojawia się natychmiast i ma _16% zmniejszony_ koszt ładowania, ale też nie oślepia wrogów ani nie aktywuje innych talentów.\n\n_+2:_ Jeśli łotrzyk użyje bomby dymnej, będąc niewidzialnym, efekt pojawia się natychmiast i ma _30% zmniejszony_ koszt ładowania, ale też nie oślepia wrogów ani nie aktywuje innych talentów.\n\n_+3:_ Jeśli łotrzyk użyje bomby dymnej, będąc niewidzialnym, efekt pojawia się natychmiast i ma _41% zmniejszony_ koszt ładowania, ale też nie oślepia wrogów ani nie aktywuje innych talentów.\n\n_+4:_ Jeśli łotrzyk użyje bomby dymnej, będąc niewidzialnym, efekt pojawia się natychmiast i ma _50% zmniejszony_ koszt ładowania, ale też nie oślepia wrogów ani nie aktywuje innych talentów.
actors.hero.talent.shadow_step.title=krok cienia
actors.hero.talent.shared_enchantment.desc=_+1:_ Broń rzucana ma _33% szans_ na użycie zaklęcia na łuku Snajpera.\n\n_+2:_ Broń rzucana ma _67% szans_ na użycie zaklęcia na łuku Snajpera.\n\n_+3:_ Broń rzucana ma _100% szans_ na użycie zaklęcia na łuku Snajpera.\n\nZaklęcie łuku może zostać aktywowane dodatkowo do zaklęcia, które już ma broń rzucana.
actors.hero.talent.shared_enchantment.title=wspólne zauroczenie
actors.hero.talent.shared_upgrades.desc=_+1:_ Kiedy Snajper atakuje ulepszoną bronią rzucaną, każdy poziom zwiększa czas trwania oznaczenia snajperki o 1 turę, a obrażenia jej ataku specjalnego o 16%, maksymalnie _2 tur i +33% obrażeń przy +2_.\n\n_+2:_ Kiedy Snajper atakuje ulepszoną bronią rzucaną, każdy poziom zwiększa czas trwania oznaczenia snajperki o 1 turę, a obrażenia jej ataku specjalnego o 16%, maksymalnie _4 tur i +67% obrażeń przy +4_.\n\n_+3:_ Kiedy Snajper atakuje ulepszoną bronią rzucaną, każdy poziom zwiększa czas trwania oznaczenia snajperki o 1 turę, a obrażenia jej ataku specjalnego o 16%, maksymalnie _6 tur i +100% obrażeń przy +6_.
actors.hero.talent.shared_upgrades.title=współdzielone aktualizacje
actors.hero.talent.shield_battery.desc=_+1:_ Mag może celować w samego siebie za pomocą różdżki, aby zamienić wszystkie swoje ładunki na osłonę z szybkością _4% maks. PW na ładunek_.\n\n_+2:_ Mag może celować w samego siebie za pomocą różdżki, aby zamienić wszystkie swoje ładunki na osłonę z szybkością _6% maks. PW na ładunek_.
actors.hero.talent.shield_battery.title=bateria tarczy
actors.hero.talent.shield_of_light.desc=_+1:_ Kapłan może rzucić _Tarczę Światła_, czar rzucany natychmiast, który zapewnia mu _2-4 punktów pancerza_ przeciwko celowi na 5 tur za kosztem 1 ładunku.\n\n_+2:_ Kapłan może rzucić _Tarczę Światła_, czar rzucany natychmiast, który zapewnia mu _3-6 punktów pancerza_ przeciwko celowi na 5 tur za kosztem 1 ładunku.
actors.hero.talent.shield_of_light.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zmniejszy on obrażenia fizyczne otrzymywane od wybranego wroga o 1, +1 w 33% przypadków lub +2 w 50% przypadków.
actors.hero.talent.shield_of_light.title=tarcza światła
actors.hero.talent.shielding_dew.desc=_+1:_ Krople rosy mogą osłaniać Strażniczkę, gdy jej zdrowie jest pełne, do _20% jej maksymalnego zdrowia_.\n\n_+2:_ Krople rosy mogą osłaniać Strażniczkę, gdy jej zdrowie jest pełne, do _40% jej maksymalnego zdrowia_.\n\n_+3:_ Krople rosy mogą osłaniać Strażniczkę, gdy jej zdrowie jest pełne, do _60% jej maksymalnego zdrowia_.
actors.hero.talent.shielding_dew.title=osłona przed rosą
actors.hero.talent.shock_force.desc=_+1:_ Fala uderzeniowa zadaje _20% więcej obrażeń_ i ma _25% szans_ na ogłuszenie zamiast okaleczenia.\n\n_+2:_ Fala uderzeniowa zadaje _40% więcej obrażeń_ i ma _50% szans_ na ogłuszenie zamiast okaleczenia.\n\n_+3:_ Fala uderzeniowa zadaje _60% więcej obrażeń_ i ma _75% szans_ na ogłuszenie zamiast okaleczenia.\n\n_+4:_ Fala uderzeniowa zadaje _80% więcej obrażeń_ i ma _100% szans_ na ogłuszenie zamiast okaleczenia.
actors.hero.talent.shock_force.title=siła uderzeniowa
actors.hero.talent.shrug_it_off.desc=_+1:_ Redukcja obrażeń Wojownika podczas wytrzymywania jest _zwiększona do 60%_, z 50%.\n\n_+2:_ Redukcja obrażeń Wojownika podczas wytrzymywania jest _zwiększona do 68%_, z 50%.\n\n_+3:_ Redukcja obrażeń Wojownika podczas wytrzymywania jest _zwiększona do 74%_, z 50%.\n\n_+4:_ Redukcja obrażeń Wojownika podczas wytrzymywania jest _zwiększona do 80%_, z 50%.
actors.hero.talent.shrug_it_off.title=wzruszyć ramionami
actors.hero.talent.silent_steps.desc=_+1:_ Łotrzyk nie obudzi śpiących wrogów, jeśli znajduje się w odległości _3 lub więcej pól od nich_.\n\n_+2:_ Łotrzyk nie obudzi śpiących wrogów, jeśli _nie znajduje się obok nich_.
actors.hero.talent.silent_steps.title=ciche kroki
actors.hero.talent.soul_eater.desc=_+1:_ Znak duszy zapewnia _0,33 tury_ sytości za każde zadane obrażenia fizyczne. Wrogowie naznaczeni duszą mają _10% szans_ na wywołanie efektów po zjedzeniu po śmierci.\n\n_+2:_ Znak duszy zapewnia _0,67 tury_ sytości za każde zadane obrażenia fizyczne. Wrogowie naznaczeni duszą mają _20% szans_ na wywołanie efektów po zjedzeniu po śmierci.\n\n_+3:_ Znak duszy zapewnia _1 turę_ sytości za każde zadane obrażenia fizyczne. Wrogowie naznaczeni duszą mają _30% szans_ na wywołanie efektów po zjedzeniu po śmierci.
actors.hero.talent.soul_eater.title=pożeracz dusz
actors.hero.talent.soul_siphon.desc=_+1:_ Obrażenia fizyczne zadawane przez inne postacie aktywują znak duszy Czarnoksiężnika z _13% skutecznością_.\n\n_+2:_ Obrażenia fizyczne zadawane przez inne postacie aktywują znak duszy Czarnoksiężnika z _27% skutecznością_.\n\n_+3:_ Obrażenia fizyczne zadawane przez inne postacie aktywują znak duszy Czarnoksiężnika z _40% skutecznością_.
actors.hero.talent.soul_siphon.title=syfon duszy
actors.hero.talent.speedy_stealth.desc=_+1:_ Freerunner zyskuje 2 ładunki pędu na turę, gdy jest niewidzialny.\n\n_+2:_ Oprócz korzyści wynikających z +1, freerunner nie jest już odliczany, gdy jest niewidzialny.\n\n_+3:_ Oprócz korzyści wynikających z +1 i +2, freerunner porusza się z 2x większą prędkością, gdy jest niewidzialny, niezależnie od tego, czy porusza się swobodnie, czy nie.
actors.hero.talent.speedy_stealth.title=szybkie skradanie się
actors.hero.talent.spirit_blades.desc=_+1:_ Ostrza widmowe mają _30% szans_ na użycie zaklęcia również na łuku ducha.\n\n_+2:_ Ostrza widmowe mają _60% szans_ na użycie zaklęcia również na łuku ducha.\n\n_+3:_ Ostrza widmowe mają _90% szans_ na użycie zaklęcia również na łuku ducha.\n\n_+4:_ Ostrza widmowe mają _100% szans_ na użycie zaklęcia również na łuku ducha i dają każdemu zaklęciu _+10% mocy_.
actors.hero.talent.spirit_blades.title=ostrza duchowe
actors.hero.talent.spirit_form.desc=Kapłan może rzucić _Formę Ducha_, która napełnia Trinity mocą pierścienia lub artefaktu, który Kapłan zidentyfikował w tej serii (oprócz świętej księgi), kosztem 4 ładunków.\n\n_+1:_ Kiedy używana jest Trinity, Kapłan zyska efekt pierścienia o _+1_ na 20 tur lub uruchomi efekt artefaktu o _+4._\n\n_+2:_ Kiedy używana jest Trinity, Kapłan zyska efekt pierścienia o _+2_ na 20 tur lub uruchomi efekt artefaktu o _+6._\n\n_+3:_ Kiedy używana jest Trinity, Kapłan zyska efekt pierścienia o _+3_ na 20 tur lub uruchomi efekt artefaktu o _+6. _+8._\n\n_+4:_ Po użyciu Trójcy, Kapłan zyska efekt pierścienia o wartości _+4_ na 20 tur lub aktywuje efekt artefaktu o wartości _+10._\n\nTrinity może zostać nasycona tylko jednym efektem ducha na raz. Artefakty mają różne efekty i koszty ładowania pancerza, gdy są aktywowane przez Trójcę.
actors.hero.talent.spirit_form.title=forma duchowa
actors.hero.talent.stasis.desc=Kapłan może rzucić _Stasis_ na wzmocnionego sojusznika kosztem 2 ładunków. Stasis tymczasowo usuwa sojusznika z lochu i zachowuje pozostały czas działania wszystkich wzmocnień, w tym Potęgi Wielu. Sojusznik pojawi się ponownie obok ciebie, gdy efekt się zakończy. Stasis można rzucić ponownie natychmiast i bez żadnych kosztów, aby zakończyć efekt przed czasem. Zastój działa na nieruchomych sojuszników, ale nie może ich przenosić między piętrami lochów.\n\n_+1:_ Zastój trwa maks. _60 tur._\n\n_+2:_ Zastój trwa maks. _90 tur._\n\n_+3:_ Zastój trwa maks. _120 tur._\n\n_+4:_ Zastój trwa maks. _150 tur._\n\nKleryk może również rzucić Promień Promienia, gdy sojusznik jest w stanie zastoju, aby go przywołać, lub rzucić Połączenie Życia, aby prewencyjnie zastosować jego efekt. Sojusznicy nie korzystają jednak z Połączenia Życia, gdy sojusznik jest w stanie zastoju.
actors.hero.talent.stasis.title=zastój
actors.hero.talent.strengthening_meal.desc=_+1:_ Spożywanie jedzenia daje Duelistce 3 premię do obrażeń za każdym razem, gdy _2 razy_ trafi wroga atakiem fizycznym.\n\n_+2:_ Spożywanie jedzenia daje Duelistce 3 premię do obrażeń za każdym razem, gdy _3 razy_ trafi wroga atakiem fizycznym.
actors.hero.talent.strengthening_meal.title=posiłek wzmacniający
actors.hero.talent.striking_force.desc=_+1:_ Siła efektu żywiołowego uderzenia jest zwiększona o _30%_.\n\n_+2:_ Siła efektu żywiołowego uderzenia jest zwiększona o _60%_.\n\n_+3:_ Siła efektu żywiołowego uderzenia jest zwiększona o _90%_.\n\n_+4:_ Siła efektu żywiołowego uderzenia jest zwiększona o _120%_.
actors.hero.talent.striking_force.title=siła uderzeniowa
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave ma _30% szans_ na użycie również efektów przy trafieniu, takich jak zaklęcia i kombo.\n\n_+2:_ Shockwave ma _60% szans_ na użycie również efektów przy trafieniu, takich jak zaklęcia i kombo.\n\n_+3:_ Shockwave ma _90% szans_ na użycie również efektów przy trafieniu, takich jak zaklęcia i kombo.\n\n_+4:_ Shockwave ma _100% szans_ na użycie również efektów przy trafieniu, takich jak zaklęcia i kombo, i daje zaklęciom _+20% mocy_.
actors.hero.talent.striking_wave.title=uderzająca fala
actors.hero.talent.strongman.desc=_+1:_ Siła Wojownika zostaje _zwiększona o 8%_, zaokrąglona w dół.\n\n_+2:_ Siła Wojownika zostaje _zwiększona o 13%_, zaokrąglona w dół.\n\n_+3:_ Siła Wojownika zostaje _zwiększona o 18%_, zaokrąglona w dół.
actors.hero.talent.strongman.title=człowiek silnej ręki
actors.hero.talent.sucker_punch.desc=_+1:_ Łotrzyk zadaje _1-2 dodatkowych obrażeń_, gdy po raz pierwszy zaatakuje wroga z zaskoczenia.\n\n_+2:_ Łotrzyk zadaje _2 dodatkowych obrażeń_, gdy po raz pierwszy zaatakuje wroga z zaskoczenia.
actors.hero.talent.sucker_punch.title=cios w twarz
actors.hero.talent.sunray.desc=_+1:_ Kapłan może rzucić _Promień Słońca_, czar, który zadaje _4-8 obrażeń_ i oślepia cel na _4 tury_ kosztem 1 ładunku.\n\n_+2:_ Kapłan może rzucić _Promień Słońca_, czar, który zadaje _6-12 obrażeń_ i oślepia cel na _6 tur_ kosztem 1 ładunku.\n\nPromień Słońca może oślepić każdy cel tylko raz, ale jeśli cel jest już oślepiony przez Promień Słońca, zamiast tego zostaje sparaliżowany. Promień Słońca zawsze zadaje maksymalne obrażenia demonicznym i nieumarłym wrogom.
actors.hero.talent.sunray.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, sprawi, że różdżki i artefakty oślepią wrogów na 4 tury, w 15% przypadków przy +1 lub w 25% przypadków przy +2.
actors.hero.talent.sunray.title=promień słoneczny
actors.hero.talent.survivalists_intuition.desc=_+1:_ Łowczyni rozpoznaje broń rzucaną _3 razy szybciej_.\n\n_+2:_ Łowczyni rozpoznaje broń rzucaną _kiedy nią trafia_.
actors.hero.talent.survivalists_intuition.title=intuicja survivalisty
actors.hero.talent.sustained_retribution.desc=_+1:_ Wojownik zadaje _115% dodatkowych obrażeń_ rozłożonych na _2 trafienia_, zamiast 100% dodatkowych obrażeń w 1 trafieniu.\n\n_+2:_ Wojownik zadaje _130% dodatkowych obrażeń_ rozłożonych na _3 trafienia_, zamiast 100% dodatkowych obrażeń w 1 trafieniu.\n\n_+3:_ Wojownik zadaje _145% dodatkowych obrażeń_ rozłożonych na _4 trafienia_, zamiast 100% dodatkowych obrażeń w 1 trafieniu.\n\n_+4:_ Wojownik zadaje _160% dodatkowych obrażeń_ rozłożonych na _5 trafień_, zamiast 100% dodatkowych obrażeń w 1 trafieniu.
actors.hero.talent.sustained_retribution.title=ciągła odpłata
actors.hero.talent.swift_equip.desc=_+1:_ Duelistka może natychmiast zmienić broń, którą ma na wyposażeniu _raz_ co 20 tur.\n\n_+2:_ Duelistka może natychmiast zmienić broń, którą ma na wyposażeniu _dwa razy_ co 20 tur.\n\nJeśli Duelistka ma ten talent i nie jest on w trakcie odnowienia, szybkie użycie niezaopatrzonej broni spowoduje jego wyposażenie.
actors.hero.talent.swift_equip.title=szybki sprzęt
actors.hero.talent.swift_spirit.desc=_+1:_ Prędkość ruchu jastrzębia duchowego wzrasta z 2 do _2,5 pola_, a także gwarantuje się, że uniknie on pierwszych _2 ataków_ wykonanych przeciwko niemu.\n\n_+2:_ Prędkość ruchu jastrzębia duchowego wzrasta z 2 do _3 pola_, a także gwarantuje się, że uniknie on pierwszych _4 ataków_ wykonanych przeciwko niemu.\n\n_+3:_ Prędkość ruchu jastrzębia duchowego wzrasta z 2 do _3,5 pola_, a także gwarantuje się, że uniknie on pierwszych _6 ataków_ wykonanych przeciwko niemu.\n\n_+4:_Prędkość ruchu jastrzębia duchowego wzrasta z 2 do _4 pola_, a także gwarantuje się, że uniknie on pierwszych _8 ataków_ wykonanych przeciwko niemu.
actors.hero.talent.swift_spirit.title=szybki duch
actors.hero.talent.telefrag.desc=_+1:_ Jeśli Mag przeniesie się w inną postać, zada jej _10-15 obrażeń_, ale otrzyma również _5 obrażeń_.\n\n_+2:_ Jeśli Mag przeniesie się w inną postać, zada jej _20-30 obrażeń_, ale otrzyma również _10 obrażeń_.\n\n_+3:_ Jeśli Mag przeniesie się w inną postać, zada jej _30-45 obrażeń_, ale otrzyma również _15 obrażeń_.\n\n_+4:_ Jeśli Mag przeniesie się w inną postać, zada jej _40-60 obrażeń_, ale otrzyma również _20 obrażeń_.\n\nBohater nie może zostać zabity przez ten talent, obrażenia zadawane sobie mogą zostać zmniejszone przez efekty odporności na magię.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Łotrzyk identyfikuje pierścienie _2x szybciej_ i rozpoznaje typ pierścienia _gdy go zakłada_.\n\n_+2:_ Łotrzyk identyfikuje pierścienie _gdy je zakłada_ i rozpoznaje typ pierścienia _gdy go podnosi_.
actors.hero.talent.thiefs_intuition.title=intuicja złodzieja
actors.hero.talent.twin_upgrades.desc=_+1:_ Jeśli jedna z dwóch wyposażonych broni Mistrza ma niższy poziom i jest _o 2 lub więcej poziomów niższa_ od drugiej broni, zostanie ona podniesiona do poziomu drugiej broni.\n\n_+2:_ Jeśli jedna z dwóch wyposażonych broni Mistrza ma niższy poziom i jest _o 1 lub więcej poziomów niższa_ od drugiej broni, zostanie ona podniesiona do poziomu drugiej broni.\n\n_+3:_ Jeśli jedna z dwóch wyposażonych broni Mistrza ma niższy poziom i jest _o tym samym poziomie lub niższym_ od drugiej broni, zostanie ona podniesiona do poziomu drugiej broni.
actors.hero.talent.twin_upgrades.title=ulepszenia bliźniacze
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Mniszka zyskuje _50% więcej energii_ za każdy element wyposażenia _poziomu 3 lub niższego_, którego używa.\n\n_+2:_ Mniszka zyskuje _75% więcej energii_ za każdy element wyposażenia _poziomu 2 lub niższego_, którego używa. Korzyści z poziomu 3 pozostają niezmienione.\n\n_+3:_ Mniszka zyskuje _100% więcej energii_ za każdy element wyposażenia _poziomu 1 lub niższego_, którego używa. Korzyści z poziomów 2 i 3 pozostają niezmienione. Otrzymuje również darmową zbroję materiałową i rękawice z ćwiekami.\n\nNależy pamiętać, że ten talent nie daje żadnych korzyści z bycia bez broni lub ataku Pierścieniem Mocy.
actors.hero.talent.unencumbered_spirit.title=nieskrępowany duch
actors.hero.talent.varied_charge.desc=_+1:_ Mistrzyni natychmiast odzyskuje _0,17 ładunków broni_, gdy używa dwóch różnych umiejętności broni, bez limitu czasu.\n\n_+2:_ Mistrzyni natychmiast odzyskuje _0,33 ładunków broni_, gdy używa dwóch różnych umiejętności broni, bez limitu czasu.\n\n_+3:_ Mistrzyni natychmiast odzyskuje _0,5 ładunków broni_, gdy używa dwóch różnych umiejętności broni, bez limitu czasu.
actors.hero.talent.varied_charge.title=zróżnicowany ładunek
actors.hero.talent.veterans_intuition.desc=_+1:_ Wojownik rozpoznaje broń _1,75x szybciej_, a zbroję _2,5x szybciej_.\n\n_+2:_ Wojownik rozpoznaje broń _2,5x szybciej_ i zbroję _gdy ją zakłada_.
actors.hero.talent.veterans_intuition.title=intuicja weterana
actors.hero.talent.wall_of_light.desc=_+1:_ Paladyn może rzucić _Ścianę Światła_, czar, który tworzy przed Paladynem solidną ścianę o szerokości _3 pól_, która odpycha wrogów i trwa 20 tur, kosztem 3 ładunków.\n\n_+2:_ Paladyn może rzucić _Ścianę Światła_, czar, który tworzy przed Paladynem solidną ścianę o szerokości _5 pól_, która odpycha wrogów i trwa 20 tur, kosztem 3 ładunków.\n\n_+3:_ Paladyn może rzucić _Ścianę Światła_, czar, który tworzy przed Paladynem solidną ścianę o szerokości _7 pól_, która odpycha wrogów i trwa 20 tur, kosztem 3 ładunków.\n\nŚcianę można umieścić kardynalnie lub po przekątnej, w danym momencie może istnieć tylko jedna ściana.
actors.hero.talent.wall_of_light.title=ściana światła
actors.hero.talent.wand_preservation.desc=_+1:_ Kiedy Mag nasyca swoją laskę nową różdżką, stara różdżka wraca do stanu +0, _ale można to zrobić tylko raz._\n\n_+2:_ Kiedy Mag nasyca swoją laskę nową różdżką, stara różdżka wraca do stanu +0, _można to powtórzyć z czasem odnowienia równym jednemu poziomowi bohatera._
actors.hero.talent.wand_preservation.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zwiększy on ilość żywicy tajemnej zdobywanej po włożeniu różdżki do alchemicznego garnka o 1 przy +1 lub o 2 przy +2.
actors.hero.talent.wand_preservation.title=konserwacja różdżki
actors.hero.talent.weapon_recharging.desc=_+1:_ Duelista zyskuje jeden ładunek broni co _15 tur_, gdy jest pod wpływem wzmocnień odnawiających różdżkę lub artefakt.\n\n_+2:_ Duelista zyskuje jeden ładunek broni co _10 tur_, gdy jest pod wpływem wzmocnień odnawiających różdżkę lub artefakt.
actors.hero.talent.weapon_recharging.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, spowoduje on, że będzie zadawał +5% obrażeń w walce wręcz podczas ładowania z +1 lub +7,5% obrażeń w walce wręcz podczas ładowania z +2.
actors.hero.talent.weapon_recharging.title=przeładowywanie broni
actors.hero.talent.wide_search.desc=_+1:_ Promień poszukiwań Łotra zwiększa się z kwadratu 5x5 do _koła 7x7_.\n\n_+2:_ Promień poszukiwań Łotra zwiększa się z kwadratu 5x5 do _kwadratu 7x7_.
actors.hero.talent.wide_search.meta_desc=_Jeśli ten talent zdobędzie inny bohater_, zwiększy on promień wyszukiwania z kwadratu 3x3 do koła 5x5 przy +1 lub kwadratu 5x5 przy +2.
actors.hero.talent.wide_search.title=szerokie wyszukiwanie
actors.hero.talent.wild_momentum.desc=_+1:_ Zabicie wroga łukiem ducha przedłuża czas trwania mocy natury o _1 turę_. Czas trwania może zostać wydłużony maksymalnie o _2 tury_.\n\n_+2:_ Zabicie wroga łukiem ducha przedłuża czas trwania mocy natury o _2 tury_. Czas trwania może zostać wydłużony maksymalnie o _4 tury_.\n\n_+3:_ Zabicie wroga łukiem ducha przedłuża czas trwania mocy natury o _3 tury_. Czas trwania może zostać wydłużony maksymalnie o _6 tur_.\n\n_+4:_ Zabicie wroga łukiem ducha przedłuża czas trwania mocy natury o _4 tury_. Czas trwania może zostać wydłużony maksymalnie o _8 tur_.
actors.hero.talent.wild_momentum.title=dziki pęd
actors.hero.talent.wild_power.desc=_+1:_ Podczas używania dzikiej magii, różdżki zostaną wzmocnione o _2 lub 3, aż do +4_.\n\n_+2:_ Podczas używania dzikiej magii, różdżki zostaną wzmocnione o _3, aż do +5_.\n\n_+3:_ Podczas używania dzikiej magii, różdżki zostaną wzmocnione o _3 lub 4, aż do +6_.\n\n_+4:_ Podczas używania dzikiej magii, różdżki zostaną wzmocnione o _4, aż do +7_.
actors.hero.talent.wild_power.title=dzika moc
actors.mobs.acidic.desc=Te ogromne, pajęczakopodobne, demoniczne stworzenia unikają walki wręcz, woląc miotać z dużej odległości obezwładniającymi, ząbkowanymi kolcami. Ten zdaje się ociekać żrącą mazią.
actors.mobs.acidic.name=kwaśny skorpion
actors.mobs.albino.desc=To rzadka rasa szczura torbacza, o czysto białym futrze i ostrych zębach.
actors.mobs.albino.discover_hint=Tego wroga rzadko można spotkać w konkretnym regionie lochu.
actors.mobs.albino.name=szczur albinos
actors.mobs.armoredbrute.desc=Najstarsi gnolle często noszą potężne zbroje, aby podkreślić swój status. Zbroja ta sprawia, że te bestie są znacznie bardziej odporne na obrażenia fizyczne, a ich większa dyscyplina pozwala im dłużej szaleć, zanim odniosą rany.
actors.mobs.armoredbrute.name=opancerzony brutal
actors.mobs.armoredstatue.desc=Można by pomyśleć, że to po prostu kolejny nieożywiony posąg z tego lochu, ale jego czerwone, świecące oczy zdradzają jego istnienie.\n\nWydaje się być w świetnym stanie dzięki zbroi, którą nosi. Może być bardzo trudno go zabić.
actors.mobs.armoredstatue.desc_arm_wep=Chociaż sama statua jest wykonana z kamienia, dzierżone przez nią _%1$s_ i _%2$s_ wyglądają prawdziwie.
actors.mobs.armoredstatue.name=opancerzona statua
actors.mobs.bandit.desc=Głębsze poziomy lochów zawsze były kryjówką dla wszelkiego rodzaju przestępców. Nie wszyscy potrafili zachować jasność umysłu podczas długich okresów spędzonych z dala od światła dziennego. Dawno temu ci szaleni złodzieje i bandyci zapomnieli, kim są i dlaczego kradną.
actors.mobs.bandit.name=szalony bandyta
actors.mobs.bat.desc=Ci energiczni i wytrwali mieszkańcy jaskiń są o wiele groźniejsi, niż się wydaje. Regenerują swoje zdrowie z każdym udanym atakiem, co pozwala im pokonywać znacznie większych przeciwników.
actors.mobs.bat.name=nietoperz wampir
actors.mobs.bee.desc=Pomimo niewielkich rozmiarów, pszczoły złote zaciekle bronią swojego domu. Ta jest bardzo wściekła, lepiej trzymać się od niej z daleka.
actors.mobs.bee.desc_honey=Pomimo niewielkich rozmiarów, złote pszczoły zaciekle bronią swojego domu. Ta została udobruchana i najwyraźniej chce za tobą podążyć.
actors.mobs.bee.discover_hint=Możesz znaleźć tę postać, mając do dyspozycji konkretny przedmiot.
actors.mobs.bee.name=złota pszczoła
actors.mobs.brute$bruterage.desc=Ten gnoll brutal umiera, ale chce cię zabrać ze sobą!\n\nBrut zginie, gdy jego osłona zniknie, z powodu upływu czasu lub uszkodzenia. W międzyczasie będzie zadawał znacznie większe obrażenia, więc uważaj!\n\nPozostała tarcza: %d.
actors.mobs.brute$bruterage.name=brutalna wściekłość
actors.mobs.brute.def_verb=zablokowany
actors.mobs.brute.desc=Osiłki to największe, najsilniejsze i najwytrzymalsze ze wszystkich gnolli. Ciężko ranne wpadają w szał i zadają wrogom jeszcze większe obrażenia.
actors.mobs.brute.enraged=rozwścieczony
actors.mobs.brute.name=gnolli osiłek
actors.mobs.causticslime.desc=Ten szlam najwyraźniej został skażony czarną magią emanującą z dołu. Stracił swój zwykły zielony kolor i ocieka żrącą mazią.
actors.mobs.causticslime.discover_hint=Tego wroga rzadko można spotkać w konkretnym regionie lochu.
actors.mobs.causticslime.name=żrący szlam
actors.mobs.crab.desc=Te ogromne kraby znajdują się na szczycie łańcucha pokarmowego w kanałach. Są niezwykle szybkie, a ich gruby pancerz wytrzymuje silne uderzenia.
actors.mobs.crab.name=krab kanalizacyjny
actors.mobs.crystalguardian.def_verb=zablokowany
actors.mobs.crystalguardian.desc=Te ogromne, kryształowe strażniczki wyglądają niemal jak posągi, gdyby nie ich błyszczące, błyszczące oczy. Utwardzony kryształ, z którego są zrobione, sprawia, że są powolne, ale bardzo wytrzymałe, dlatego najlepiej pozwolić im spać w ich kryształowym gnieździe tak długo, jak to możliwe. \n\nZ uwagi na swój rozmiar, kryształowe strażniczki poruszają się znacznie wolniej w zamkniętych przestrzeniach. Są też tak wytrzymałe, że nie da się ich zabić od razu. Można je powalić i tymczasowo unieruchomić, ale po chwili same się podniosą.
actors.mobs.crystalguardian.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.crystalguardian.name=strażnik kryształu
actors.mobs.crystalmimic.ate=Naśladowca zjadł twojego %s!
actors.mobs.crystalmimic.desc=Mimiki to magiczne stworzenia, które mogą przybierać dowolną postać. W lochach prawie zawsze wybierają kształt skrzyni ze skarbami, aby zwabić niczego niepodejrzewających poszukiwaczy przygód. \n\nKryształowe mimiki są bardziej przebiegłe niż ich zwykli kuzyni i wolą unikać konfliktów podczas kradzieży łupów. Po wykryciu spróbują uciec i potrafią zmieniać pozycję wrogów podczas ataku.
actors.mobs.crystalmimic.escaped=Kryształowy imitator uciekł!
actors.mobs.crystalmimic.name=imitator kryształu
actors.mobs.crystalspire.alert=Wibracje narastają i rozchodzą się po całej jaskini!
actors.mobs.crystalspire.desc=Ta gigantyczna iglica z ultratwardego kryształu jest prawdopodobnie źródłem wszystkich dziwnych kryształowych stworzeń w tej jaskini. Twoja zwykła broń jest przeciwko niej bezsilna, więc będziesz musiał użyć kilofa, jeśli chcesz ją zniszczyć.\n\n_Upewnij się, że jesteś przygotowany, zanim zaczniesz ją rozbijać._ Wydobycie tak dużego kryształu prawdopodobnie zajmie trochę czasu i prawdopodobnie nie uda ci się tego zrobić bez przeszkód. Sama iglica może nawet mieć jakieś sposoby na obronę. _Być może ataki samej iglicy można by wykorzystać przeciwko jej sługom._
actors.mobs.crystalspire.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.crystalspire.name=kryształowa iglica
actors.mobs.crystalspire.warning=Kryształ wibruje, gdy go uderzysz. Utrzymywanie tego w tej pozycji z pewnością przyciągnie uwagę...
actors.mobs.crystalwisp.beam_kill=Promień światła cię zabił...
actors.mobs.crystalwisp.desc=Mały, gniewny, unoszący się kawałek utwardzonego kryształu, który emituje jasną poświatę. Choć nie są szczególnie silne, kryształowe smugi wystrzelą w ciebie niszczącą wiązkę światła, jeśli będą miały wolną przestrzeń.\n\nStrzały są na tyle małe, że z łatwością przemieszczają się przez różne kryształowe wychodnie, ale nie są w stanie przez nie przebić się.
actors.mobs.crystalwisp.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.crystalwisp.name=kryształowy pasmo
actors.mobs.demonspawner.desc=Ta skręcona mieszanina krasnoludzkiego ciała odpowiada za tworzenie demonów-rozpruwaczy z krasnoludów, które zginęły w tym regionie. Najwyraźniej demony nie widzą problemu w wykorzystywaniu wszelkich dostępnych im zasobów przeciwko swoim wrogom.\n\nChoć wizualnie przerażające, generatory demonów nie mają możliwości poruszania się ani bezpośredniej obrony. Ich znaczna masa sprawia jednak, że trudno je szybko zabić, a w obliczu zagrożenia generują demony-rozpruwacze jeszcze szybciej.\n\n_Generatory demonów wydają się być połączone z jakimś centralnym źródłem demonicznej mocy. Ich zabicie może je osłabić._
actors.mobs.demonspawner.name=siewca demonów
actors.mobs.demonspawner.on_death=Energia demoniczna wydaje się słabnąć, gdy twórca umiera.
actors.mobs.dm100.desc=DM-100 to wczesny model krasnoludzkiej „maszyny obronnej”, zaprojektowanej do ochrony krasnoludzkich górników w jaskiniach pod tym więzieniem. Ich impulsy elektryczne okazały się jednak zbyt słabe, dlatego zostały podarowane ludzkiemu miastu na górze. Przez lata nie były używane i ostatecznie trafiły do więzienia, gdzie naczelnik początkowo uznał je za zbyt okrutne. Jednak wraz z rosnącą niesfornością więźniów stały się one koniecznością.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Zabił cię piorun...
actors.mobs.dm200.desc=DM-200 to druga generacja krasnoludzkich „maszyn obronnych”, zaprojektowanych do ochrony krasnoludzkich górników w jaskiniach i mieście poniżej. Są znacznie większe i masywniejsze niż ich poprzednicy, a atakują potężnymi hydraulicznymi pięściami.\n\nIch większy rozmiar jest również ich główną słabością, ponieważ nie mieszczą się w wąskich tunelach i przejściach lochów. Krasnoludy były w stanie zrekompensować brak mobilności DM-200, pozwalając im wypuszczać toksyczne spaliny na odległych lub niedostępnych wrogów.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 wystrzeliwuje strumień toksycznych spalin!
actors.mobs.dm201.desc=Krasnoludy krótko eksperymentowały z większym naciskiem na brak mobilności DM-200 i stworzyły modele DM, które są całkowicie stacjonarne. DM-201 to zmodyfikowana wersja DM-200, która działa jak wieżyczka strażnicza bez możliwości ruchu. W zamian za brak mobilności, DM-201 mają znacznie większą wytrzymałość i siłę ataku. \n\nAs DM-201 nie mają silnika, z którego można by odprowadzać spaliny, dlatego krasnoludy wyposażyły je w granaty z gazem żrącym! DM-201 są jednak ostrożne z tymi granatami i rzucają nimi tylko wtedy, gdy są atakowane z dystansu.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 rzuca żrący granat!
actors.mobs.dm300.charge_lost=ZNISZCZONY PYLON! POWRÓT DO LOKALNEGO ZASILANIA!
actors.mobs.dm300.charging=PODTRZYMUJĘ USZKODZENIA! AKTYWUJĘ PYLON ZASILANIA!
actors.mobs.dm300.charging_hint=DM-300 jest niezniszczalny, gdy jest zasilany energią z pylonu!
actors.mobs.dm300.def_verb=zablokowany
actors.mobs.dm300.defeated=KRYTYCZNE USZKODZENIA! PRÓBA WYŁĄCZENIA
actors.mobs.dm300.desc=Tę maszynę zbudowały krasnoludy kilka stuleci temu. Później zaczęły zastępować maszyny golemami, żywiołakami, a nawet demonami. Ostatecznie doprowadziło to do upadku ich cywilizacji. DM-300 i podobne maszyny służyły zwykle do budowy i wydobycia, czasem także do obrony miasta.
actors.mobs.dm300.desc_supercharged=DM-300 jest obecnie naładowany energią elektryczną. W tej formie DM-300 nie może zostać uszkodzony i porusza się z podwójną prędkością! Dodatkowo, jego wiertło obraca się teraz wystarczająco szybko, aby _przebić się przez twardą skałę_, choć porusza się wtedy znacznie wolniej.\n\nBezpośredni atak na DM-300 nie ma sensu, gdy jest on naładowany, ale _coś w okolicy musi dostarczać mu tej energii_, a jej zniszczenie może go osłabić.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=WYKRYTO NIEUPOWAŻNIONY PERSONEL!
actors.mobs.dm300.pylons_destroyed=UWAGA! WYKRYTO NIESTABILNOŚĆ W SIECI ELEKTRYCZNEJ!
actors.mobs.dm300.rankings_desc=Zmiażdżony przez DM-300
actors.mobs.dm300.shield=DM-300 pobiera prąd z odsłoniętych przewodów i ekranuje się!
actors.mobs.dm300.supercharged=ZNISZCZ! ZNISZCZ! ZNISZCZ!
actors.mobs.dwarfking$dkghoul.rankings_desc=Upadł przed Królem Krasnoludów
actors.mobs.dwarfking$dkgolem.rankings_desc=Upadł przed Królem Krasnoludów
actors.mobs.dwarfking$dkmonk.rankings_desc=Upadł przed Królem Krasnoludów
actors.mobs.dwarfking$dkwarlock.rankings_desc=Upadł przed Królem Krasnoludów
actors.mobs.dwarfking.defeated=Skazałeś nas wszystkich na zagładę...
actors.mobs.dwarfking.desc=Wiele lat temu jeden z najznamienitszych czarodziejów na krasnoludzkim dworze odkrył sekrety, które dały mu ogromną władzę nad życiem i śmiercią. Wkrótce wykorzystał tę moc, podporządkowując sobie i korumpując swoich towarzyszy, króla, a ostatecznie każdego krasnoludzkiego obywatela. Teraz jest królem, władcą legionu nieumarłych poddanych. \n\nKról Krasnoludów to agresywny przeciwnik, który będzie próbował otoczyć i przytłoczyć swoich wrogów hordą nieumarłych sług.
actors.mobs.dwarfking.enraged=Nie możesz mnie zabić %s. JESTEM NIEŚMIERTELNY!
actors.mobs.dwarfking.lifelink_1=Potrzebuję twojej esencji, niewolniku!
actors.mobs.dwarfking.lifelink_2=Przelej dla mnie krew, niewolniku!
actors.mobs.dwarfking.losing=Nie! Nie możesz tego zrobić... Nie masz pojęcia, co cię czeka...
actors.mobs.dwarfking.name=Król Krasnoludów
actors.mobs.dwarfking.notice=Jak śmiesz! Nie masz pojęcia, w co się wtrącasz!
actors.mobs.dwarfking.rankings_desc=Upadł przed Królem Krasnoludów
actors.mobs.dwarfking.teleport_1=Rozpraw się z nimi, niewolniku!
actors.mobs.dwarfking.teleport_2=Daj im zajęcie, niewolniku!
actors.mobs.dwarfking.wave_1=Dosyć! Powstańcie moi niewolnicy!
actors.mobs.dwarfking.wave_2=Więcej! Krwaw dla swojego króla!
actors.mobs.dwarfking.wave_3=Bezużyteczne! ZABIJ ICH TERAZ!
actors.mobs.ebonymimic.desc=Mimiki to magiczne stworzenia, które mogą przybierać dowolną postać. W lochach prawie zawsze wybierają kształt skrzyni ze skarbami, aby zwabić niczego niepodejrzewających poszukiwaczy przygód. \n\n Ebony mimiki to skradające się mimiki, które potrafią stać się niemal niewidzialne. Czają się na przedmiotach, z którymi poszukiwacze przygód mogą wejść w interakcję, ale same też posiadają łupy. Po odkryciu nie są odporniejsze na ataki zwykłych mimików, ale ich zaskakujące ugryzienie jest druzgocące.
actors.mobs.ebonymimic.discover_hint=Tego wroga możesz znaleźć za pomocą specjalnego gadżetu.
actors.mobs.ebonymimic.hidden_desc=Wydaje się, że coś tu jest, ale jest to niemal całkowicie przejrzyste.
actors.mobs.ebonymimic.hidden_name=podejrzany zarys
actors.mobs.ebonymimic.name=imitacja hebanu
actors.mobs.ebonymimic.reveal=Tam był naśladowca!
actors.mobs.elemental$chaoselemental.desc=Żywiołaki to chaotyczne stworzenia, które często powstają, gdy potężna magia okultystyczna nie jest odpowiednio kontrolowana. Żywiołaki charakteryzują się minimalną inteligencją i zazwyczaj są kojarzone z określonym rodzajem magii. \n\nŻywiołaki chaosu to rzadkie i niebezpieczne żywiołaki, które nie ustabilizowały się w jednym żywiole. Atakując, uwalniają dziką, nieprzewidywalną magię.
actors.mobs.elemental$chaoselemental.name=żywiołak chaosu
actors.mobs.elemental$fireelemental.desc=Żywiołaki to chaotyczne stworzenia, które często powstają, gdy potężna magia okultystyczna nie jest odpowiednio kontrolowana. Żywiołaki charakteryzują się minimalną inteligencją i zazwyczaj są kojarzone z konkretnym rodzajem magii.\n\nŻywiołaki ognia to powszechny typ żywiołaków, który zadaje obrażenia magią ognia. Podpalają cel atakami wręcz, a czasami mogą również strzelać ognistymi pociskami.
actors.mobs.elemental$fireelemental.name=żywiołak ognia
actors.mobs.elemental$frostelemental.desc=Żywiołaki to chaotyczne stworzenia, które często powstają, gdy potężna magia okultystyczna nie jest odpowiednio kontrolowana. Żywiołaki charakteryzują się minimalną inteligencją i zazwyczaj są kojarzone z konkretnym rodzajem magii.\n\nŻywiołaki mrozu to powszechny typ żywiołaków, który osłabia wrogów magią wychładzania. Oziębiają cel za pomocą ataku wręcz i okazjonalnych ataków dystansowych. Ich magia jest znacznie skuteczniejsza w wodzie.
actors.mobs.elemental$frostelemental.name=żywiołak mrozu
actors.mobs.elemental$newbornfireelemental.charging=Żywiołak się ładuje!
actors.mobs.elemental$newbornfireelemental.desc=Żywiołaki to chaotyczne stworzenia, które często powstają, gdy potężna magia okultystyczna nie jest odpowiednio kontrolowana. Żywiołaki mają minimalną inteligencję i zazwyczaj są kojarzone z konkretnym rodzajem magii.\n\nTen żywiołak ognia został niedawno przyzwany, ale wciąż jest bardzo niebezpieczny!
actors.mobs.elemental$newbornfireelemental.desc_ally=Ponieważ ten żywiołak został przywołany zaklęciem, ma nieco większą kontrolę nad swoim płomieniem. Nie jest zdolny do ataków dystansowych, ale podpala wrogów, których atakuje w zwarciu.
actors.mobs.elemental$newbornfireelemental.desc_boss=Ze względu na chaotyczny charakter przywołania, żywiołak ten może rozprzestrzeniać ogień jedynie w niedokładnych seriach po jednej turze szarży.
actors.mobs.elemental$newbornfireelemental.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.elemental$newbornfireelemental.name=nowonarodzony żywiołak ognia
actors.mobs.elemental$shockelemental.desc=Żywiołaki to chaotyczne stworzenia, które często powstają, gdy potężna magia okultystyczna nie jest odpowiednio kontrolowana. Żywiołaki charakteryzują się minimalną inteligencją i zazwyczaj są kojarzone z konkretnym rodzajem magii. \n\nŻywiołaki porażenia prądem to rzadszy typ żywiołaków, który paraliżuje wrogów elektrycznością i błyskami światła. W walce wręcz wyładowują elektryczność na pobliskich wrogów i zadają dodatkowe obrażenia głównemu celowi, jeśli ten znajduje się w wodzie. Czasami skupiają również na swoim celu wiązkę światła z dystansu, tymczasowo go oślepiając.
actors.mobs.elemental$shockelemental.name=szok elementarny
actors.mobs.eye.deathgaze_kill=Spojrzenie śmierci cię zabiło...
actors.mobs.eye.desc=Ten demon bywa też nazywany „kulą nienawiści”. Gdy dostrzeże wroga, bez opamiętania używa zabójczego spojrzenia, często nie zważając na sojuszników i raniąc ich przy tym.
actors.mobs.eye.name=złe oko
actors.mobs.fetidrat.desc=Coś ewidentnie jest nie tak z tym szczurem. Jego tłuste, czarne futro i gnijąca skóra bardzo różnią się od zdrowych szczurów, które widziałeś wcześniej. Jego jasnozielone oczy sprawiają, że wygląda wyjątkowo groźnie.\n\nSzczur niesie ze sobą kłębowisko okropnego smrodu, z bliska jest przytłaczająco silny.\n\nZ pyska szczura sączy się ciemna maź, która przegryza się przez podłogę, ale wydaje się rozpuszczać w wodzie.
actors.mobs.fetidrat.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.fetidrat.name=cuchnący szczur
actors.mobs.fungalcore.desc=Ten gigantyczny grzyb musi być źródłem wszelkiej aktywności grzybów w tej jaskini.
actors.mobs.fungalcore.name=rdzeń grzyba
actors.mobs.fungalsentry.desc=Ten wyjątkowo wysoki grzyb stanowi punkt obronny dla większej sieci grzybów żyjących w tej jaskini.\n\nJest nieruchomy, ale precyzyjnie strzela trucizną w każdego, kto znajdzie się w jego polu widzenia. Chociaż siła tych wybuchów jest dość słaba, _mogą one bardzo szybko zgromadzić śmiertelne ilości trucizny_. Chociaż można go zabić, prawdopodobnie najlepiej go unikać.
actors.mobs.fungalsentry.name=strażnik grzybowy
actors.mobs.fungalspinner.desc=Wygląda na to, że ten jaskiniowy prządek jest kontrolowany przez pasożytniczego grzyba. Grzyb zmienił również swoje zdolności, zastępując pajęczynę i woreczki z jadem grzybami. \n\n Prządka zieje roślinnością zamiast pajęczyn, rozprzestrzeniając grzybową roślinność i potencjalnie ukorzeniając. Chociaż nie może zatruć, prządka zyskuje znaczną odporność na obrażenia, jeśli znajduje się w pobliżu grzybów.
actors.mobs.fungalspinner.name=przędzarka grzybowa
actors.mobs.ghoul.desc=Wraz z powolnym upadkiem krasnoludzkiego społeczeństwa i przejęciem władzy absolutnej przez ówczesnego króla krasnoludów, ci, którzy byli słabi lub stawiali mu opór, nie byli dobrze traktowani. W miarę jak król zdobywał coraz większą wprawę w posługiwaniu się czarną magią, zmusił krasnoludy do posłuszeństwa i teraz stanowią one piechotę jego armii. \n\nGhule nie są szczególnie silne same w sobie, ale zawsze poruszają się w grupach i znacznie trudniej je zabić w dużych grupach. _Gdy ghul zostanie pokonany, odrodzi się po kilku turach, o ile w pobliżu znajduje się inny ghul._
actors.mobs.ghoul.name=krasnoludzki ghul
actors.mobs.gnoll.desc=Gnolle to humanoidalne istoty przypominające hieny. Mieszkają w kanałach i lochach, od czasu do czasu zapuszczając się na powierzchnię, by plądrować. Zwiadowcy gnolli są stałymi członkami ich stada, nie są jednak tak silni jak brutale i nie są tak inteligentni jak szamani.
actors.mobs.gnoll.name=zwiadowca gnolli
actors.mobs.gnollexile.desc=Ten szaro-futrzany gnoll ma na ramieniu duży znak, oznaczający, że jest wygnańcem. Gnolle są zazwyczaj wyganiane ze swojego społeczeństwa za ignorowanie rozkazów lub łamanie prawa. Wygnańcy muszą być silni i sprytni, aby przetrwać. Ten wygląda, jakby wiedział, jak posługiwać się włócznią, którą trzyma.
actors.mobs.gnollexile.desc_aggro=_Gnoll wygnaniec rozgląda się gniewnie._ Wygląda na to, że coś jednak skłoniło go do walki. Uważaj na tę włócznię!
actors.mobs.gnollexile.desc_passive=_Gnoll wygnaniec nie rusza do ataku._ Nie wydaje się tak agresywny jak inne gnole i prawdopodobnie nie uważa, że walka z tobą jest warta zachodu. Możesz go po prostu puścić wolno, ale ma plecak, który może być pełen przydatnych przedmiotów...
actors.mobs.gnollexile.name=wygnanie gnolli
actors.mobs.gnollexile.seen_aggro=Gnoll dzierżący włócznię rusza do ataku!
actors.mobs.gnollexile.seen_passive=Gnoll dzierżący włócznię patrzy na ciebie nieufnie, ale nie rusza do ataku.
actors.mobs.gnollgeomancer.alert=Geomanta się budzi! Cała jaskinia zdaje się poruszać, gdy odskakuje, śmiejąc się szaleńczo!
actors.mobs.gnollgeomancer.desc=Ten imponująco wysoki starszy gnoll musi być źródłem wszelkiej magii, która porusza ziemię w okolicy i organizatorem wszelkiej aktywności gnolli. W przeciwieństwie do gnolli saperów w okolicy, geomanta jest dość biegły w posługiwaniu się magią i nie może zostać zraniony przez rzucane lub spadające kamienie. Nie potrafi jednak walczyć wręcz.
actors.mobs.gnollgeomancer.desc_armor=Geomanta jest obecnie zakuty w warstwę kamiennej zbroi. _Musisz podejść blisko i rozbić ją kilofem, zanim zdołasz zadać mu obrażenia._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Gnoll saper w pobliżu trzyma urządzenie, które wzmacnia kamienny pancerz geomanty. Teraz nie będziesz w stanie go w ogóle uszkodzić!_
actors.mobs.gnollgeomancer.desc_sleeping=Ten imponująco wysoki szaman gnoll jest otoczony warstwą skał i wygląda niemal jak posąg. Przyglądając się uważnie, można zobaczyć, jak skała magicznie porusza się w rytm oddechu starszego gnolla. Nie można go zranić, gdy jest tak zatopiony w skale, a wygląda, jakby dosłownie drzemał w ziemi.\n\nPrawdopodobnie da się przebić przez warstwy skał kilofem, ale _upewnij się, że jesteś gotowy do walki, kiedy to zrobisz._ Geomanta musi być źródłem wszelkiej magii poruszającej ziemię w okolicy i organizatorem wszelkiej aktywności gnolli. _Pokonanie gnolli rozsianych po okolicy przed walką z nim może być dobrym pomysłem._
actors.mobs.gnollgeomancer.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.gnollgeomancer.name=gnoll geomanta
actors.mobs.gnollgeomancer.rock_kill=Latający głaz cię zabił...
actors.mobs.gnollgeomancer.rockfall_kill=Spadające kamienie cię zabiły...
actors.mobs.gnollgeomancer.warning=Geomanta zaczyna się wiercić. Upewnij się, że jesteś gotowy, zanim przejdziesz dalej!
actors.mobs.gnollguard.def_verb=zablokowany
actors.mobs.gnollguard.desc=Duży i groźnie wyglądający gnoll dzierży włócznię i tarczę, ale nie nosi hełmu. Ci strażnicy to prawdopodobnie brutale w trakcie szkolenia, wciągnięci w ochronę kopalni przed nadciągającymi dzikimi zwierzętami.\n\nGnoll strażnik jest wystarczająco silny, by władać włócznią w jednej ręce, ale nie potrafi się nią dobrze posługiwać. _Będzie potrzebował dość otwartej przestrzeni do ataku z dystansu i zada ci znacznie mniej obrażeń, jeśli podejdziesz do niego z bliska._
actors.mobs.gnollguard.desc_armor=_W pobliżu znajduje się saper gnolli, który trzyma urządzenie, które obdarza tego strażnika ziemnym pancerzem, znacznie zmniejszając otrzymywane przez niego obrażenia._
actors.mobs.gnollguard.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.gnollguard.name=strażnik gnolla
actors.mobs.gnollguard.spear_warn=Gnoll zadaje potężny cios czubkiem włóczni!
actors.mobs.gnollsapper.desc=Mały i słaby, ale inteligentny gnoll o jasnym futrze i z torbą pełną różnych gadżetów. Prawdopodobnie przybył tu, aby pomóc w poszukiwaniach i wydobywaniu ciemnego złota, a w pobliżu ma strażnika, który go chroni. Potrafi walczyć, ale jego ataki są żałośnie słabe, nie silniejsze niż ataki gnolli zwiadowców. \n\n Zamiast walczyć bezpośrednio, saperzy wolą używać różnych gadżetów, aby zmusić skaliste otoczenie do ataku. Sami jednak nie znają magii poruszania ziemią, więc prawdopodobnie będą używać swoich gadżetów lekkomyślnie. _Powinno być wiele sposobów na wykorzystanie ich ataków przeciwko nim, a także ich strażników._
actors.mobs.gnollsapper.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.gnollsapper.name=saper gnoll
actors.mobs.gnolltrickster.desc=Dziwnie wyglądające stworzenie, nawet jak na standardy gnolli. Pochyla się do przodu z szelmowskim uśmiechem, niemal trzymając torbę przewieszoną przez ramię. Jego oczy są szeroko otwarte, z dziwną mieszanką strachu i podniecenia.\n\nW torbie znajduje się duża kolekcja źle wykonanych strzałek, wszystkie wydają się być nasączone różnymi szkodliwymi substancjami.
actors.mobs.gnolltrickster.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.gnolltrickster.name=gnoll oszust
actors.mobs.goldenmimic.desc=Mimiki to magiczne stworzenia, które mogą przybierać dowolną postać. W lochach prawie zawsze wybierają kształt skrzyni ze skarbami, aby zwabić niczego niepodejrzewających poszukiwaczy przygód.\n\nZłote mimiki to silniejsze imitacje, które starają się przyciągnąć najsilniejszych poszukiwaczy przygód. Mają lepszy łup, ale są też znacznie silniejsze niż zwykłe mimiki.
actors.mobs.goldenmimic.name=złoty imitator
actors.mobs.golem.def_verb=zablokowany
actors.mobs.golem.desc=Krasnoludy próbowały połączyć wiedzę o mechanizmach z nowo odkrytą mocą wiązania żywiołaków. Za dusze mechanicznych ciał golemów posłużyły im duchy ziemi, uważane za najłatwiejsze do opanowania. Mimo to najdrobniejszy błąd w rytuale mógł sprawić, że golem wyrwie się spod kontroli.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=Niewiele wiadomo o Glucie. Być może nie jest nawet stworzeniem, a jedynie skupiskiem substancji z kanałów, które zyskało zalążek własnej woli.
actors.mobs.goo.enraged=rozwścieczony
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.name=Breja
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Goo się pompuje!
actors.mobs.goo.rankings_desc=Wchłonięty przez Goo
actors.mobs.greatcrab.def_verb=zablokowany
actors.mobs.greatcrab.desc=Ten krab jest gigantyczny, nawet w porównaniu z innymi krabami ściekowymi. Jego niebieska skorupa jest pokryta pęknięciami i pąklami, co świadczy o jego wieku. Porusza się powoli, ledwo utrzymując równowagę dzięki swoim masywnym szczypcom. \n\nChociaż krab ma tylko jeden szczypiec, jego rozmiar z łatwością to rekompensuje. Krab trzyma szczypce przed każdym zagrożeniem, chroniąc się nieprzenikalną ścianą pancerza. Nie jest jednak w stanie zablokować ataków, których nie widzi, ani ataków wielu wrogów jednocześnie.
actors.mobs.greatcrab.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.greatcrab.name=wielki krab
actors.mobs.greatcrab.noticed=Krab blokuje za pomocą swoich potężnych szczypiec.
actors.mobs.guard.def_verb=zablokowany
actors.mobs.guard.desc=Ci strażnicy, niegdyś strażnicy więzienia, dawno już stali się nikim innym niż więźniowie. Włóczą się jak zombie, bezmyślnie przemierzając korytarze w poszukiwaniu czegokolwiek, co nie pasuje, jak ty! \n\n Noszą łańcuchy u biodra, prawdopodobnie używane do przyciągania wrogów z bliskiej odległości.
actors.mobs.guard.name=strażnik więzienny
actors.mobs.guard.scorpion=Chodź tutaj!
actors.mobs.hermitcrab.def_verb=zablokowany
actors.mobs.hermitcrab.desc=Z jakiegoś powodu ten krab kanałowy postanowił nosić na głowie uszkodzoną górną część beczki! Dodatkowy ciężar spowolnił go do normalnej prędkości, ale jednocześnie zapewnił mu znacznie większą ochronę. Wydaje ci się jednak, że słyszysz, jak coś podskakuje w środku beczki...
actors.mobs.hermitcrab.name=biernatek
actors.mobs.mimic.desc=Mimiki to magiczne stworzenia, które mogą przybierać dowolną postać. W lochach prawie zawsze wybierają kształt skrzyni ze skarbami, aby zwabić niczego niepodejrzewających poszukiwaczy przygód.
actors.mobs.mimic.discover_hint=Tego wroga możesz spotkać w dowolnym miejscu lochu.
actors.mobs.mimic.hidden_hint=Coś jest nie tak z tą skrzynią... Podejście i próba jej otwarcia może być złym pomysłem.
actors.mobs.mimic.name=mimik
actors.mobs.mimic.reveal=Ta skrzynia to imitacja!
actors.mobs.mob.died=Słyszysz, że coś umiera w oddali.
actors.mobs.mob.discover_hint=Tego wroga możesz znaleźć w określonym regionie lochu.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Zabity przez: %s
actors.mobs.monk$focus.desc=Ten mnich jest idealnie skupiony na swoim celu i zdaje się przewidywać jego ruchy, zanim je wykona. \n\nW stanie skupienia, kolejny atak fizyczny skierowany przeciwko tej postaci z pewnością chybi, niezależnie od okoliczności. Sparowanie tego ataku zużyje skupienie mnicha, które będzie musiał ponownie zgromadzić, aby sparować kolejny atak. Mnisi szybciej budują skupienie, gdy się poruszają.
actors.mobs.monk$focus.name=skupiony
actors.mobs.monk.def_verb=zablokowany
actors.mobs.monk.desc=Ci mnisi to fanatycy, którzy poświęcili życie ochronie tajemnic miasta przed obcymi. Nie używają zbroi ani broni, polegając wyłącznie na sztuce walki wręcz.
actors.mobs.monk.name=krasnoludzki mnich
actors.mobs.monk.parried=sparowany
actors.mobs.necromancer$necroskeleton.desc=Ten szkielet został przywołany przez nekromantę. Zachowuje się jak zwykły szkielet i ginie, gdy nekromanta, który go przywołał, zostanie zabity.
actors.mobs.necromancer$necroskeleton.name=szkielet nekromanty
actors.mobs.necromancer.desc=Ci adepci mrocznego rzemiosła magów zgromadzili się w więzieniu, ponieważ jest to idealne miejsce do praktykowania swojego mrocznego rzemiosła. \n\nNekromanci przyzywają i wzmacniają szkielety, aby walczyły dla nich. Zabicie nekromanty spowoduje również śmierć przywołanego przez niego szkieletu.
actors.mobs.necromancer.name=nekromanta
actors.mobs.npcs.blacksmith.cant_enter_old=Ten obszar nie jest dostępny w tym etapie. Zagraj w nową grę, aby spróbować nowego zadania!
actors.mobs.npcs.blacksmith.def_verb=zablokowany
actors.mobs.npcs.blacksmith.desc=Ten troll kowal wygląda jak wszystkie trolle: jest wysoki i szczupły, a jego skóra przypomina kamień zarówno kolorem, jak i fakturą. Troll kowal majstruje przy nieproporcjonalnie małych narzędziach.
actors.mobs.npcs.blacksmith.enter_no=Jeszcze nie
actors.mobs.npcs.blacksmith.enter_yes=Jestem gotowy
actors.mobs.npcs.blacksmith.entrance_blocked=Droga w dół jest zablokowana.
actors.mobs.npcs.blacksmith.exit_no=Jeszcze nie
actors.mobs.npcs.blacksmith.exit_warn_crystal=Ten gigantyczny kryształ też tam jest. Zapłacę ekstra, jeśli go zniszczysz.
actors.mobs.npcs.blacksmith.exit_warn_full=Skończyłeś? Masz mnóstwo złota, ale upewnij się, że nie zostawiłeś żadnego ze swoich rzeczy.\n\n_Pamiętaj, nie wpuszczę cię z powrotem, jak już wejdziesz na górę._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Ten gigantyczny grzyb też tam jest. Zapłacę ekstra, jeśli go zabijesz.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ten gnoll geomanta też tam jest. Zapłacę ekstra, jeśli go zabijesz.
actors.mobs.npcs.blacksmith.exit_warn_high=Skończyłeś? Wygląda na to, że masz sporo złota, ale przydałoby mi się trochę więcej. Powinieneś dostać _40 sztuk._\n\n_Pamiętaj, nie wpuszczę cię z powrotem, jak już wejdziesz._
actors.mobs.npcs.blacksmith.exit_warn_low=Już skończyłeś? Wygląda na to, że nie masz dużo złota. Powinieneś dostać _40 sztuk._\n\n_Pamiętaj, nie wpuszczę cię z powrotem, jak już wejdziesz._
actors.mobs.npcs.blacksmith.exit_warn_med=Skończyłeś? Masz przynajmniej trochę złota, ale w kopalni na pewno jest więcej. Powinieneś dostać _40 sztuk._\n\n_Pamiętaj, nie wpuszczę cię z powrotem, jak już wyjdziesz na powierzchnię._
actors.mobs.npcs.blacksmith.exit_warn_none=Już skończyłeś? Nie masz prawie w ogóle złota! Powinieneś dostać _40 sztuk._\n\n_Pamiętaj, nie wpuszczę cię z powrotem, jak już wejdziesz._
actors.mobs.npcs.blacksmith.exit_yes=Skończyłem
actors.mobs.npcs.blacksmith.get_lost=Jestem zajęty. Spadaj!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hej Człowieku! Wyglądasz na kogoś ważnego.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Uważaj jednak, kopalnia jest niebezpieczna dla takiego małego człowieczka jak ty. Jest opuszczona od jakiegoś czasu i zaczęła rosnąć w niej masa kryształów. Są błyszczące, ale zbyt kruche, by cokolwiek zdziałać, a do tego chronią je magiczne przedmioty. Są dość wytrzymałe, więc _uważaj, gdzie kopiesz_, bo zwrócisz na siebie ich uwagę.\n\nGdzieś tam też jest _olbrzymi kryształ_. Jest o wiele twardszy, więc przygotuj się na walkę, jeśli zaczniesz go rozbijać. Założę się jednak, że jego rozbicie spowolni wzrost kryształów, więc zapłacę ekstra, jeśli ci się uda.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hej Człowieku! Wyglądasz na odważnego.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Uważaj jednak, kopalnia jest niebezpieczna dla małego człowieczka takiego jak ty. Na dole rośnie jakiś grzybowy potwór. Ma grzybowych strażników, którzy są naprawdę zabójczy, jeśli cię zobaczą, ale przynajmniej nie mogą wstać i cię gonić. _Trzymaj się z dala_, jeśli chcesz przeżyć. \n\n Zapłacę ekstra, jeśli uda ci się zdjąć _największego grzyba_, ale to będzie wymagało sporo wysiłku. Jest połączony z mnóstwem węzłów grzybni ukrytych w ścianach. Będziesz musiał zniszczyć większość z nich, zanim naprawdę go uszkodzisz.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Uważaj jednak, kopalnia jest niebezpieczna dla takiego małego człowieczka jak ty. Niektóre gnole też chcą złota i teraz demolują to miejsce. To głupie stworzenia, więc ich wydobycie spowodowało mnóstwo zawaleń i zapadnięć. Będziesz musiał przez nią kopać, więc _szukaj niedawno naruszonej skały._\n\nMyślę, że jeden z gnoli sprawia najwięcej kłopotów, prawdopodobnie _szaman geomanta_ albo coś w tym stylu. Zapłacę ekstra, jeśli go znajdziesz i zabijesz, ale jestem pewien, że będzie się bronił.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hej Człowieku! Wyglądasz na bystrego.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hej Człowieku! Wyglądasz na mądrego.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hej, Człowieku! Wyglądasz na podstępnego.
actors.mobs.npcs.blacksmith.intro_quest_start=Chcesz się przydać, co? Tak, mam coś, co możesz zrobić. Zbudowałem ten warsztat na starej kopalni, jest tuż przy drabinie. Weź kilof i wydobądź dla mnie trochę _ciemnej złotej rudy. 40 sztuk_ powinno wystarczyć. Skała na dole jest miękka i przyjemna, więc _z pewnym wysiłkiem uda ci się przekopać przez ściany._\n\nCo masz na myśli, jak mam zapłacić? Ty chciwy...\n\nOk, ok, mogę ci trochę pokowal. Uważaj się za szczęściarza, jestem jedynym kowalem w okolicy.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hej Człowieku! Wyglądasz na twardziela.
actors.mobs.npcs.blacksmith.lost_pick=Żartujesz sobie? Gdzie mój kilof?!
actors.mobs.npcs.blacksmith.name=troll kowal
actors.mobs.npcs.blacksmith.quest_start_prompt=Gotowy do zejścia? Upewnij się, że masz trochę wolnego miejsca na złoto.\n\n_Zawiodę cię tylko raz!_
actors.mobs.npcs.blacksmith.reminder=Skończyłeś marnować mój czas? Wejście do kopalni jest tam.
actors.mobs.npcs.blacksmith.reminder_crystal=Przynieś mi tyle złota, ile możesz i spróbuj rozbić ten wielki kryształ.
actors.mobs.npcs.blacksmith.reminder_fungi=Przynieś mi tyle złota, ile możesz, i spróbuj zabić gigantycznego grzyba.
actors.mobs.npcs.blacksmith.reminder_gnoll=Przynieś mi tyle złota, ile możesz i postaraj się zabić gnolla geomantę.
actors.mobs.npcs.ghost.crab_1=Witaj %s... Kiedyś byłem taki jak ty – silny i pewny siebie... Ale zostałem zabity przez starożytne stworzenie... Nie mogę opuścić tego miejsca... Dopóki się nie zemszczę... Zabij _wielkiego kraba_, który odebrał mi życie... \n\nJest nienaturalnie stary... Z jednym potężnym szczypcem i grubą skorupą... _Uważaj na jego szczypce, musisz zaskoczyć kraba, inaczej zablokuje cię nimi..._
actors.mobs.npcs.ghost.crab_2=Proszę... Pomóż mi... Zabij skorupiaka...\n\n_Zawsze zablokuje... Kiedy cię zobaczy..._
actors.mobs.npcs.ghost.desc=Duch jest ledwo widoczny. Wygląda jak bezkształtna plamka słabego światła o smutnej twarzy.
actors.mobs.npcs.ghost.find_me=Dziękuję... przyjdź i mnie znajdź...
actors.mobs.npcs.ghost.gnoll_1=Witaj %s... Kiedyś byłem taki jak ty – silny i pewny siebie... Ale zostałem zabity przez przebiegłego wroga... Nie mogę opuścić tego miejsca... Dopóki się nie zemszczę... Zabij _gnolla oszusta_, który odebrał mi życie... \n\nNie jest taki jak inne gnolle... Ukrywa się i używa broni miotanej... _Uważaj na jego trujące i zapalające strzałki, nie atakuj z dystansu..._
actors.mobs.npcs.ghost.gnoll_2=Proszę... Pomóż mi... Zabij oszusta...\n\n_Nie pozwól, żeby cię trafił... Zbliż się do niego..._
actors.mobs.npcs.ghost.name=smutny duch
actors.mobs.npcs.ghost.rat_1=Witaj %s... Kiedyś byłem taki jak ty – silny i pewny siebie... Ale zostałem zabity przez ohydną bestię... Nie mogę opuścić tego miejsca... Dopóki się nie zemszczę... Zabij _cuchnącego szczura_, który odebrał mi życie... \n\n Kryje się po tej podłodze... Rozsiewając wszędzie brud... _Uważaj na jego chmurę smrodu i żrącą żądzę, kwas rozpuszcza się w wodzie..._
actors.mobs.npcs.ghost.rat_2=Proszę... Pomóż mi... Zabij tę obrzydliwość...\n\n_Walcz z nią w pobliżu wody... Unikaj smrodu..._
actors.mobs.npcs.imp.cya=Do zobaczenia, %s!
actors.mobs.npcs.imp.desc=Impy to pomniejsze demony. Nie wyróżniają się ani siłą, ani magicznym talentem, ale są dość inteligentne i towarzyskie. Wiele z nich woli żyć wśród istot niebędących demonami.
actors.mobs.npcs.imp.golems_1=W moim przypadku to _golemy_ trzeba zabić. Widzisz, zamierzam tu rozkręcić mały interes, ale te głupie golemy szkodzą interesom! Bardzo trudno negocjować z wędrującymi bryłami granitu, niech je diabli! Więc proszę, zabij... powiedzmy _4 z nich_, a nagroda będzie twoja.
actors.mobs.npcs.imp.golems_2=Jak idzie ci golemowe safari? Tylko nie zapomnij zabrać tych żetonów.
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.intro=Jesteś poszukiwaczem przygód? Uwielbiam poszukiwaczy przygód! Zawsze można na nich liczyć, jeśli trzeba kogoś zabić, prawda? Oczywiście, że za nagrodę ;)
actors.mobs.npcs.imp.monks_1=W moim przypadku to _mnichów_ trzeba zabić. Widzisz, zamierzam tu założyć mały interes, ale ci szaleńcy sami nic nie kupują i odstraszają innych klientów. Więc proszę, zabij... powiedzmy _5 z nich_, a nagroda będzie twoja.
actors.mobs.npcs.imp.monks_2=O, żyjesz! Wiedziałem, że twoje kung-fu będzie silniejsze ;) Tylko nie zapomnij zebrać tych żetonów.
actors.mobs.npcs.imp.name=ambitny diabeł
actors.mobs.npcs.impshopkeeper.buyback=Chochlik radośnie zwraca twój przedmiot.
actors.mobs.npcs.impshopkeeper.desc=Iskry otworzyły mały sklepik na granicy wewnętrznych sal. Miło widzieć przyjazną twarz, ale jego ceny zdecydowanie nie wydają się przyjazne.
actors.mobs.npcs.impshopkeeper.greetings=Witaj, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Co zrobiłeś %s? Szybko na zakupy, muszę stąd uciekać!
actors.mobs.npcs.impshopkeeper.name=ambitny diabeł
actors.mobs.npcs.impshopkeeper.thief=Myślałem, że mogę ci zaufać!
actors.mobs.npcs.mirrorimage.desc=Ta iluzja jest do ciebie łudząco podobna, ale bledsza i lekko drży.
actors.mobs.npcs.mirrorimage.discover_hint=Możesz znaleźć tę postać za pomocą specjalnego zwoju.
actors.mobs.npcs.mirrorimage.name=odbicie lustrzane
actors.mobs.npcs.npc.discover_hint=Postać tę znajdziesz w określonym regionie lochu.
actors.mobs.npcs.prismaticimage.desc=Ta migocząca iluzja jest do ciebie bardzo podobna, a nawet wydaje się dzierżyć twoją obecną broń i zbroję.\n\nPryzmatyczne obrazy będą próbowały przyciągać uwagę wrogów, wykorzystując zwiększoną obronę i zdrowie, aby cię chronić. Chociaż nie mają takiej samej siły ataku jak lustrzane odbicia, mają zwiększoną wytrzymałość, w tym korzyści z twojej zbroi.\n\nPo zmniejszeniu poziomu zdrowia do 0, pryzmatyczne obrazy znikną na kilka tur i nadal można je w tym czasie leczyć. Gdy nie ma wrogów, pryzmatyczne obrazy znikną i dołączą do swojego pana.
actors.mobs.npcs.prismaticimage.discover_hint=Możesz znaleźć tę postać za pomocą specjalnego zwoju.
actors.mobs.npcs.prismaticimage.name=obraz pryzmatyczny
actors.mobs.npcs.ratking.confused=Co... Gdzie ja jestem? Moje królestwo mnie potrzebuje!
actors.mobs.npcs.ratking.crown_after=Podoba Ci się nowa zbroja? Nie ma mowy o zwrocie!
actors.mobs.npcs.ratking.crown_clothes=Ubierz się! Nie nadajesz się do rozmowy z rodziną królewską!
actors.mobs.npcs.ratking.crown_desc=Och, czy ta korona jest dla mnie?! Wygląda o wiele bardziej błyszcząco niż moja, więc z wdzięcznością ją przyjmuję! \n\n Myślę, że mogę ci coś zaoferować w nagrodę za tę koronę. Ogromna moc, godna bohatera takiego jak ty! Chciałbyś?
actors.mobs.npcs.ratking.crown_fine=No dobrze! W każdym razie nie chciałem tego...
actors.mobs.npcs.ratking.crown_info=Najpierw powiedz mi więcej.
actors.mobs.npcs.ratking.crown_no=Wolałbym nie...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, dziękuję! A teraz idź i spraw, żeby twój król był z ciebie dumny!
actors.mobs.npcs.ratking.crown_yes=Oczywiście!
actors.mobs.npcs.ratking.desc=Ten szczur jest trochę większy od zwykłego szczura torbacza. Nosi na głowie maleńką koronę.
actors.mobs.npcs.ratking.desc_birthday=Ten szczur jest trochę większy niż zwykły szczur torbacz. Zamiast swojej zwykłej korony nosi malutki zielony kapelusz imprezowy. Wszystkiego najlepszego, Królu Szczurów!
actors.mobs.npcs.ratking.desc_crown=Ten szczur jest trochę większy od zwykłego szczura torbacza. Na głowie nosi koronę króla karłów.
actors.mobs.npcs.ratking.desc_winter=Ten szczur jest trochę większy niż zwykły szczur torbacz. Zamiast swojej zwykłej korony nosi maleńki, świąteczny kapelusz. Wesołych Świąt!
actors.mobs.npcs.ratking.discover_hint=Postać tę znajdziesz na końcu określonego regionu lochu.
actors.mobs.npcs.ratking.name=król szczurów
actors.mobs.npcs.ratking.not_sleeping=Nie śpię!
actors.mobs.npcs.ratking.what_is_it=O co chodzi? Nie mam czasu na te bzdury. Moje królestwo samo się nie rządzi!
actors.mobs.npcs.sheep.baa!=Beczenie!
actors.mobs.npcs.sheep.baa.=Beczenie.
actors.mobs.npcs.sheep.baa...=Beczenie...
actors.mobs.npcs.sheep.baa?=Beczenie?
actors.mobs.npcs.sheep.def_verb=zablokowany
actors.mobs.npcs.sheep.desc=To magiczna owca. Co w niej takiego magicznego? Nie da się jej zabić. Będzie tam stała, aż magicznie zniknie, cały czas przeżuwając pokarm z pustym wzrokiem.
actors.mobs.npcs.sheep.discover_hint=Możesz znaleźć tę postać, mając do dyspozycji konkretny przedmiot lub pułapkę.
actors.mobs.npcs.sheep.name=owce
actors.mobs.npcs.shopkeeper.buyback=Sprzedawca niechętnie zwraca twój towar.
actors.mobs.npcs.shopkeeper.desc=Ten tęgi facet bardziej pasuje do dzielnicy handlowej w dużym mieście niż do lochu. Jego ceny wyjaśniają, dlaczego woli robić tu interesy.
actors.mobs.npcs.shopkeeper.flee=Właściciel sklepu ucieka!
actors.mobs.npcs.shopkeeper.name=sklepikarz
actors.mobs.npcs.shopkeeper.sell=Sprzedaj przedmiot
actors.mobs.npcs.shopkeeper.talk=Rozmawiać
actors.mobs.npcs.shopkeeper.talk_ascent=Nie wiem, co planujesz zrobić z tym amuletem, ale nie chcę mieć z tym nic wspólnego. Kup coś i idź dalej, oboje musimy stąd wyjść!
actors.mobs.npcs.shopkeeper.talk_caves=Wydawaj pieniądze, żyj dłużej.\n\nOch, i pozdrów ode mnie tego trolla kowala, jeśli go spotkasz. Przypomnij mu, że wciąż jest mi winien pieniądze za młot, który mu sprzedałem w zeszłym tygodniu!
actors.mobs.npcs.shopkeeper.talk_city=Moje towary zapewnią ci bezpieczeństwo tutaj na dole.\n\n... I proszę, nie włócz się, jeśli chcesz. Długo mi zajęło, zanim miejscowi tu zeszli, żeby dać mi spokój, nie chcę, żebyś ściągał na siebie kłopoty!
actors.mobs.npcs.shopkeeper.talk_halls=Hej, mam specjalne ceny dla łowców demonów! \n\nOch, i uważaj tam na dole! Demony na dole nie będą się przejmować twoją odwagą. Nie możesz wrócić na górę i wydać więcej pieniędzy, jeśli jesteś martwy! ;) \n\nCzy demony są takie jak ja? Hehe, wcale nie. Jestem tylko małym człowiekiem, kiepskim wojownikiem, ale udało mi się zachować zdrowy umysł. Demony na dole są o wiele silniejsze i wszystkie zostały zniewolone przez... cóż... po prostu uważaj tam na dole.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=No cóż, witaj, Wasza Wysokość, czy teraz Wasza Świątobliwość? Hehe, tak czy inaczej, to nie jest miejsce dla Ciebie, wielu ludzi byłoby zrozpaczonych, gdybyś zginął. Na pewno masz jakieś monety, może kupisz coś, żeby temu zapobiec?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=No cóż, jeśli to nie wędrujący bohater! Jeśli próbujesz uratować kolejne miasto, to powodzenia, niebezpieczeństwa tutaj są o wiele gorsze niż drobne bandy bandytów. Jestem pewien, że poradzisz sobie lepiej niż ktokolwiek inny, tylko postaraj się nie zginąć tuż przed moim sklepem.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Wygląda na to, że jesteś nie w swoim żywiole, panienko. Ciasne korytarze lochów nie są tak przestronne jak wielkie sale czy lasy otaczające miasto, prawda? Hehe, och, nie zwracaj uwagi na moje gadanie, czemu nie kupisz czegoś?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Mam wszystko, czego potrzebujesz, aby Twoja przygoda była udana!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, chyba gdzieś w mieście widziałem list gończy z twoim nazwiskiem. Uciekamy, co? Och, jesteś niewinny, prawda? Jasne, jasne... Nie martw się, mam lepsze rzeczy do roboty niż donoszenie na ciebie, ale może powinieneś coś kupić, żeby mieć pewność?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Przybyłeś z gildii złodziei, żeby oczyścić teren? Nie, tylko na zakupy? No cóż, i tak zabij kilka potworów, skoro już tu jesteś. Nie licz też na zniżkę, płacę wam niezłe haracz, a wy ledwo mnie tu chronicie.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Masz ciekawą pieczęć, zazwyczaj są w jednym kawałku. Jesteś zhańbionym bohaterem czy coś? Cóż, cokolwiek zrobiłeś, to nie moja sprawa, twoje monety wciąż są dobre.
actors.mobs.npcs.shopkeeper.thief=Złodziej, złodziej!
actors.mobs.npcs.shopkeeper.warn=Uważaj! Nie będę cię więcej ostrzegać.
actors.mobs.npcs.vaultlaser.desc=Ten strażnik strzela laserami w regularnych odstępach czasu. _Ponieważ to tylko obszar testowy, lasery nie zrobią ci krzywdy._
actors.mobs.npcs.vaultlaser.name=strażnik laserowy skarbca
actors.mobs.npcs.vaultsentry.desc=Ten strażnik skanuje teren według pewnego schematu. _Ponieważ jest to tylko obszar testowy, strażnik nic nie zrobi, jeśli cię wykryje._
actors.mobs.npcs.vaultsentry.name=strażnik skanujący skarbiec
actors.mobs.npcs.wandmaker.def_verb=zablokowany
actors.mobs.npcs.wandmaker.desc=Ten stary, ale krzepki dżentelmen ma lekko zdezorientowany wyraz twarzy. Chroni go magiczna tarcza.
actors.mobs.npcs.wandmaker.intro_1=I Przybyłem tu, żeby znaleźć rzadki składnik do różdżki, ale się zgubiłem, a moja magiczna tarcza słabnie. Wkrótce będę musiał stąd wyjść, ale nie mogę się z tym pogodzić, nie zdobywszy tego, po co przyszedłem.
actors.mobs.npcs.wandmaker.intro_2=Jeśli możesz mi to załatwić, z przyjemnością zapłacę ci jedną z moich misternie wykonanych różdżek! Przywiozłem ze sobą dwie, więc możesz wziąć, którą wolisz.
actors.mobs.npcs.wandmaker.intro_berry=Stary naczelnik tego więzienia hodował _roślinę gnilca_, a ja szukam jednego z jej nasion. Roślina prawdopodobnie już zdziczała, więc zmuszenie jej do wydania nasion może być trudne. Jej ogród powinien być gdzieś w pobliżu. Staraj się _trzymać z dala od jej winorośli_, jeśli chcesz pozostać w jednym kawałku. Używanie ognia może być kuszące, ale proszę, nie rób tego, bo zabijesz roślinę i zniszczysz jej nasiona.
actors.mobs.npcs.wandmaker.intro_cleric=O, witaj Waszą Wysokość! Co za miła niespodzianka spotkać Cię w tak przygnębiającym miejscu! Nie chcę się narzucać, ale chyba mam dla Ciebie zadanie.
actors.mobs.npcs.wandmaker.intro_duelist=O, cześć, panienko! Co za miła niespodzianka spotkać bohatera w tak przygnębiającym miejscu! Jeśli masz ochotę pomóc staruszkowi, to chyba mam dla ciebie zadanie.
actors.mobs.npcs.wandmaker.intro_dust=Szukam _prochu trupiego_. To specjalny rodzaj przeklętej mączki kostnej, która zazwyczaj pojawia się w takich miejscach. Gdzieś tu powinno być zabarykadowane pomieszczenie, jestem pewien, że pojawi się tam trochę pyłu. Uważaj jednak, klątwa, którą niesie ten pył, jest dość potężna. _Wróć do mnie jak najszybciej_, a ja to dla ciebie oczyszczę.
actors.mobs.npcs.wandmaker.intro_ember=Szukam _świeżych iskier_ od nowonarodzonego żywiołaka ognia. Żywiołaki zazwyczaj pojawiają się, gdy rytuał przywołania nie jest kontrolowany, więc po prostu znajdź kilka świec i miejsce rytuału, a jestem pewien, że uda ci się sprawić, by któryś się pojawił. Staraj się jednak _unikać blokowania się_ podczas walki, albo _mieć pod ręką jakiś przedmiot zamrażający. Nowonarodzone żywiołaki są dość potężne i chaotyczne, ale nie znoszą zimna.
actors.mobs.npcs.wandmaker.intro_huntress=O, cześć, panienko! Przyjazna twarz to miła niespodzianka, prawda? Właściwie, przysięgam, że już kiedyś widziałem twoją twarz, ale nie mogę jej sobie przypomnieć... Och, nieważne, jeśli jesteś tu po przygodę, to może mam dla ciebie zadanie.
actors.mobs.npcs.wandmaker.intro_mage=O, cześć %s! Słyszałem, że było jakieś zamieszanie wokół ciebie i Instytutu Czarodziejów? Och, nieważne, i tak nigdy nie lubiłem tych sztywniaków. Jeśli chcesz, mogę mieć dla ciebie zadanie.
actors.mobs.npcs.wandmaker.intro_rogue=O rany, przestraszyłeś mnie! Nie spotkałem jeszcze żadnego bandyty z tego miejsca, który zachowałby zdrowy rozsądek, więc musisz być z powierzchni! Jeśli masz ochotę pomóc nieznajomemu, to chyba mam dla ciebie zadanie.
actors.mobs.npcs.wandmaker.intro_warrior=O, cześć! Co za miła niespodzianka spotkać wojownika z północy w tak przygnębiającym miejscu! Musiałeś przebyć długą drogę, żeby się tu dostać. Jeśli szukasz przygód, mogę mieć dla ciebie zadanie.
actors.mobs.npcs.wandmaker.name=stary wytwórca różdżek
actors.mobs.npcs.wandmaker.reminder_berry=Udało Ci się zdobyć nasiona rotberry, %s? Poszukaj pokoju pełnego roślinności.
actors.mobs.npcs.wandmaker.reminder_dust=Udało ci się z pyłem zwłok, %s? Poszukaj barykad.
actors.mobs.npcs.wandmaker.reminder_ember=Udało ci się z tymi żarami, %s? Musisz znaleźć cztery świece i miejsce rytuału.
actors.mobs.phantompiranha.desc=Piranie widmowe to rzadki gatunek piranii o magicznych zdolnościach i upiornych, przezroczystych ciałach. Potrafią się teleportować, gdy są atakowane, aby uciec lub szybko zbliżyć się do wroga! \n\nChociaż w walce są irytujące, ich mięso jest cenione ze względu na swoje magiczne właściwości.
actors.mobs.phantompiranha.name=widmowa pirania
actors.mobs.phantompiranha.teleport_away=Widmowa pirania teleportuje się...
actors.mobs.piranha.desc=Te mięsożerne ryby są hodowane specjalnie w celu ochrony terenów zalanych. Ich ukąszenie jest śmiertelnie niebezpieczne, dlatego najlepiej unikać bezpośredniego kontaktu z nimi.
actors.mobs.piranha.discover_hint=Tego wroga możesz spotkać w dowolnym miejscu lochu.
actors.mobs.piranha.name=gigantyczna pirania
actors.mobs.pylon.desc_active=Słup energetyczny, mający pomóc regulować energię elektryczną zasilającą maszyny w tym obszarze. Słup jest obecnie naładowany energią elektryczną, to musi być to, co doładowuje DM-300! \n\nW tym stanie słupy są wrażliwe, ale będą wytwarzać łuk elektryczny do pobliskich ogniw zgodnie z ruchem wskazówek zegara. Ze względu na swoją ciężką, metalową konstrukcję, słupy są odporne na duże uszkodzenia.
actors.mobs.pylon.desc_inactive=Słup energetyczny, którego zadaniem jest regulacja energii elektrycznej zasilającej maszyny w tym obszarze.\n\nSłup jest obecnie nieaktywny i odporny na uszkodzenia.
actors.mobs.pylon.name=słup energetyczny
actors.mobs.rat.desc=Szczury torbacze to agresywni, ale raczej słabi mieszkańcy kanałów. Potrafią boleśnie ugryźć, ale stanowią zagrożenie dla życia tylko w dużych ilościach.
actors.mobs.rat.name=szczur torbacz
actors.mobs.ripperdemon.desc=Te przerażające stworzenia są rezultatem wykorzystania licznych krasnoludzkich zwłok w tym regionie przez demoniczne siły. Rozpruwacze to wychudzone, upiorne stworzenia przypominające krasnoludy, ale z połamanymi ciałami i długimi, ostrymi pazurami z kości. \n\n Demony Rozpruwacze nie są szczególnie wytrzymałe, ale są zwinne i niebezpieczne. Potrafią skakać na duże odległości, aby szybko dosięgnąć celu, zanim rozszarpią go pazurami.
actors.mobs.ripperdemon.leap=Demon Rozpruwacz przygotowuje się do skoku!
actors.mobs.ripperdemon.name=demon rozpruwacz
actors.mobs.rotheart.desc=Owoce rotberry są wyjątkowe. Zamiast gnić i dostarczać składników odżywczych, rosną, twardnieją i otaczają nasiono. Zapewniają ochronę narządom wewnętrznym, które rosną w owocu. Ta gigantyczna kula nazywana jest sercem dorosłej rośliny rotberry.
actors.mobs.rotheart.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.rotheart.name=zgniłe serce
actors.mobs.rotlasher.desc=Gnilowiec jest częścią struktury korzeniowej dojrzałej gnilowca, a zarazem jej głównym środkiem obrony. Gnilowiec jest ślepy i wbity w ziemię, ale po chwili na wykrycie go, gwałtownie atakuje każde zagrożenie w pobliżu. Gdy w pobliżu nie ma wrogów, stoi nieruchomo, próbując wtopić się w otaczającą roślinność.
actors.mobs.rotlasher.discover_hint=Tego wroga możesz spotkać podczas konkretnego zadania.
actors.mobs.rotlasher.name=gnilec
actors.mobs.scorpio.desc=Te ogromne, demoniczne, przypominające pająki stworzenia unikają walki wręcz, woląc ostrzeliwać wroga ostrymi, ząbkowanymi kolcami z dużej odległości.
actors.mobs.scorpio.name=Skorpion
actors.mobs.senior.desc=Ci mnisi to fanatycy, którzy poświęcili życie ochronie tajemnic miasta przed obcymi. Nie używają zbroi ani broni, polegając wyłącznie na sztuce walki wręcz.
actors.mobs.senior.name=starszy mnich
actors.mobs.shaman$blueshaman.spell_desc=Ten szaman nosi niebieską maskę i używa magii, która tymczasowo _zwiększa otrzymywane obrażenia._
actors.mobs.shaman$purpleshaman.spell_desc=Ten szaman nosi fioletową maskę i używa magii, która tymczasowo _zmniejsza twoją celność i uniki._
actors.mobs.shaman$redshaman.spell_desc=Ten szaman nosi czerwoną maskę i używa magii, która tymczasowo _osłabia twoją siłę ataku._
actors.mobs.shaman.bolt_kill=Magiczna strzała cię zabiła...
actors.mobs.shaman.desc=Najinteligentniejsze gnolle potrafią opanować szamańską magię. Gnolli szamani nadrabiają brak siły zaklęciami bojowymi i nie wahają się używać ich przeciw tym, którzy podważają ich pozycję w plemieniu.
actors.mobs.shaman.name=szaman gnoll
actors.mobs.skeleton.def_verb=zablokowany
actors.mobs.skeleton.desc=Szkielety złożone są z kości nieszczęsnych poszukiwaczy przygód i mieszkańców lochu, ożywionych przez złą magię z głębin. Po otrzymaniu dostatecznych obrażeń rozpadają się w eksplozji kości.
actors.mobs.skeleton.explo_kill=Zostałeś zabity przez eksplozję kości...
actors.mobs.skeleton.name=szkielet
actors.mobs.slime.def_verb=zablokowany
actors.mobs.slime.desc=Slimy to dziwne, lekko magiczne stworzenia o gumowatym ciele i płynnym rdzeniu. Miejskie kanały zapewniają im obfite zapasy wody i składników odżywczych.\n\nZ uwagi na elastyczną błonę zewnętrzną, trudno jest zadać slimom więcej niż _6 obrażeń_ jednym atakiem.
actors.mobs.slime.name=szlam
actors.mobs.snake.desc=Te ogromne węże potrafią szybko unikać ciosów, przez co są dość trudne do trafienia. Magiczne ataki lub ataki z zaskoczenia potrafią je jednak zaskoczyć.\n\nMożesz wykonać atak z zaskoczenia, atakując poza polem widzenia węża. Jednym ze sposobów jest pozwolenie wężowi gonić cię przez drzwi, a następnie _zaatakować tuż po tym, jak wkroczy do środka._
actors.mobs.snake.hint=Spróbuj użyć przycisku „Zbadaj” na wężu, aby dowiedzieć się, jak sobie z nim radzić.
actors.mobs.snake.name=wąż kanalizacyjny
actors.mobs.spectralnecromancer.desc=Choć szkielety to chleb powszedni nekromantów, niektórzy wolą przyjrzeć się innym, mniej materialnym sługom. Widmowi nekromanci wybrali widma jako swoje ulubione sługi! \n\nPojedyncze widma nie są tak silne jak szkielety, ale ci nekromanci nie boją się przywołać ich całej gromady!
actors.mobs.spectralnecromancer.name=widmowy nekromanta
actors.mobs.spinner.desc=Te zielonkawe, włochate pająki jaskiniowe unikają bezpośredniej walki. Wolą czekać z daleka, aż ofiara, uwięziona w ich sieci, powoli umrze od jadowitego ukąszenia.
actors.mobs.spinner.name=pająk jaskiniowy
actors.mobs.statue.def_verb=zablokowany
actors.mobs.statue.desc=Można by pomyśleć, że to po prostu kolejny nieożywiony posąg z tego lochu, ale jego czerwone, świecące oczy zdradzają jego istnienie.
actors.mobs.statue.desc_weapon=Chociaż sama statua jest wykonana z kamienia, dzierżony przez nią _%s_ wygląda prawdziwie.
actors.mobs.statue.discover_hint=Tego wroga możesz spotkać w dowolnym miejscu lochu.
actors.mobs.statue.name=animowana statua
actors.mobs.succubus.desc=Sukkuby to demony wyglądające jak uwodzicielskie dziewczęta o nieco gotyckim stylu. Sukkub potrafi oczarować bohatera, przez co nie może on nikogo zaatakować, dopóki czar nie minie.
actors.mobs.succubus.name=sukkub
actors.mobs.swarm.desc=Śmiercionośny rój much brzęczy gniewnie. Każdy niemagiczny atak podzieli go na dwa mniejsze, ale równie niebezpieczne roje.
actors.mobs.swarm.name=rój much
actors.mobs.tengu$bombability$bombblob.desc=Tu unosi się kłębek przegrzanego dymu. Uważaj, zaraz wybuchnie!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Przykleiło się do ziemi, nie da się go ruszyć!
actors.mobs.tengu$bombability$bombitem.desc=Tengu rzucił tu dziwnie wyglądającą bombę dymną, która bucha gęstym, gorącym dymem. Wydaje głośny, tykający dźwięk, jakby odliczał czas do eksplozji! \n\n Bomba zakotwiczyła się w ziemi, więc nie można jej podnieść.
actors.mobs.tengu$bombability$bombitem.name=bomba dymna
actors.mobs.tengu$fireability$fireblob.desc=Tengu rzucił drobny proszek, który zaczyna się parować i zaraz zapłonie!
actors.mobs.tengu$shockerability$shockerblob.desc=Tutaj wytwarza się prąd elektryczny, wszystko co stanie na tym polu zostanie porażone prądem w następnej turze!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Produkuje za dużo prądu, nie da się go złapać!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu rzucił tu dziwną maszynę, która wydaje się być zrobiona z części DM-100. Maszyna stale wytwarza wokół siebie łuk elektryczny, ale wydaje się, że porusza się w przewidywalny sposób.\n\nZważywszy na cały ten łuk elektryczny, nie ma mowy o podniesieniu tego.
actors.mobs.tengu$shockerability$shockeritem.name=Ohyda
actors.mobs.tengu.defeated=Nareszcie wolny...
actors.mobs.tengu.desc=Tengu należą do starożytnego klanu zabójców o tej samej nazwie. Słyną z częstego używania shurikenów i pułapek.
actors.mobs.tengu.interesting=Uczyńmy to interesującym...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Złapałem cię, %s!
actors.mobs.tengu.notice_have=Mam cię teraz, %s!
actors.mobs.tengu.rankings_desc=Zamordowany przez Tengu
actors.mobs.thief.carries=Złodziej ma przy sobie _%s._ Oczywiście skradziony.
actors.mobs.thief.desc=Choć więźniowie swobodnie poruszają się po swoich celach, to miejsce wciąż jest ich więzieniem. Z biegiem czasu to miejsce przejęło ich umysły i wolność. Dawno temu ci szaleni złodzieje i bandyci zapomnieli, kim są i dlaczego kradną. \n\nCi wrogowie chętniej kradną i uciekają niż walczą. Pamiętaj, żeby ich nie stracić, bo inaczej możesz już nigdy nie zobaczyć skradzionego przedmiotu.
actors.mobs.thief.escapes=Złodziej uciekł z Twoim %s!
actors.mobs.thief.name=szalony złodziej
actors.mobs.thief.stole=Złodziej ukradł ci %s!
actors.mobs.tormentedspirit.desc=Dręczone duchy to w zasadzie dobroduszne duchy, które zostały dotknięte klątwą. Dopóki są przeklęte, będą atakować jak upiór, a do tego będą potężniejsze! \n\n Możliwe jest oczyszczenie z klątwy poprzez użycie odpowiedniego przedmiotu w pobliżu ducha. Jeśli klątwa zostanie zdjęta, duch z pewnością będzie wdzięczny...
actors.mobs.tormentedspirit.name=dręczony duch
actors.mobs.tormentedspirit.thank_you=Dziękuję...
actors.mobs.vaultrat.desc=Ten szczur ma kilka zmian w zachowaniu, aby przetestować nową SI wrogów w kryptach: \n_-_ Jego ruchy można „słyszeć” przez ściany. \n_-_ Będzie wędrował wzdłuż ustalonego patrolu. \n_-_ Podczas wędrówki jego zasięg wykrywania znacznie się zmniejsza w kierunku, w którym się porusza. \n_-_ Podczas snu jego zasięg wykrywania również się zmniejsza. \n_-_ Po wykryciu cię, rozpocznie „badanie”, a następnie przejdzie do polowania. Badający wrogowie zbliżają się do ciebie, ale nie atakują i łatwiej ich zgubić za drzwiami i rogami.
actors.mobs.warlock.bolt_kill=Piorun cienia cię zabił...
actors.mobs.warlock.desc=Gdy zainteresowania krasnoludów przeniosły się z inżynierii na sztuki tajemne, władzę w mieście przejęli czarnoksiężnicy. Zaczęli od magii żywiołów, lecz szybko zajęli się demonologią i nekromancją.
actors.mobs.warlock.name=krasnoludzki czarnoksiężnik
actors.mobs.wraith.desc=Zjawa to mściwy duch grzesznika, którego grób lub grobowiec został naruszony. Jako istota eteryczna, bardzo trudno ją trafić zwykłą bronią.
actors.mobs.wraith.discover_hint=Tego wroga możesz spotkać w dowolnym miejscu lochu.
actors.mobs.wraith.name=widmo
actors.mobs.yogdzewa$larva.desc=Te maleńkie pomioty Yog-Dzewa to proste sługi, łatwe do stworzenia. Choć pojedynczo słabe, przyzywa się je szybko i w dużych grupach mogą być przytłaczające.
actors.mobs.yogdzewa$larva.name=larwa Boga
actors.mobs.yogdzewa$larva.rankings_desc=Pożarty przez Yog-Dzewę
actors.mobs.yogdzewa$yogeye.rankings_desc=Pożarty przez Yog-Dzewę
actors.mobs.yogdzewa$yogripper.rankings_desc=Pożarty przez Yog-Dzewę
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Pożarty przez Yog-Dzewę
actors.mobs.yogdzewa.darkness=Ciemność jest coraz bliżej...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa to Stary Bóg; wielka monstrum, które sięga do światów śmiertelników i pożera je, by napędzać swój niekończący się wzrost. Krasnoludy musiały przyciągnąć uwagę tego kosmicznego horroru, igrając z czarną magią, i od tamtej pory próbują go powstrzymać. \n\nYog-Dzewa pochodzi z wymiaru surowego magicznego chaosu i nie może przybrać swojej prawdziwej postaci w tym świecie. Zamiast tego stworzył awatary i przywołał demoniczne sługi, by wykonywały jego rozkazy. \n\nTo gigantyczne oko jest centralnym punktem mocy Yog-Dzewy w tym świecie. Choć samo oko jest nieruchome, potrafi ono strzelać potężnymi wiązkami demonicznej magii i przywoływać na pomoc rozmaite sługi.
actors.mobs.yogdzewa.desc_spawners=Czujesz fale demonicznej energii promieniujące do oka z wyższych pięter. Coś, co zostawiłeś tam żywe, musi przekazywać moc z powrotem do Yog-Dzewy. _Yog wykorzysta tę energię, by przywołać potężniejsze sługi!_
actors.mobs.yogdzewa.hope=TWOJA. NADZIEJA. JEST. ILUZJĄ.
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=W.I.I.I.Ę. CIĘ.
actors.mobs.yogdzewa.rankings_desc=Pożarty przez Yog-Dzewę
actors.mobs.yogfist$brightfist.desc=Ta pięść jest utworzona z czystej energii światła. Potrafi co turę strzelać potężnymi promieniami palącego światła! Te promienie, oprócz zadawania dużych obrażeń, tymczasowo cię oślepią. Pięść jest również w stanie na krótko otoczyć arenę oślepiającym światłem, aby uciec! \n\nPięść nie posiada jednak żadnych specjalnych zdolności, których mogłaby użyć w walce wręcz.
actors.mobs.yogfist$brightfist.name=jasna pięść
actors.mobs.yogfist$brightfist.teleport=Pięść teleportuje się w błysku światła, który poważnie cię oślepia!
actors.mobs.yogfist$burningfist.desc=Wielka pięść spowita ogniem. Jej palce trzaskają, gdy się zaciskają, strącając żar na podłogę.
actors.mobs.yogfist$burningfist.name=płonąca pięść
actors.mobs.yogfist$darkfist.desc=Ta pięść jest uformowana z czystej, mrocznej energii. Potrafi co turę wystrzeliwać potężne salwy mrocznej magii! Oprócz zadawania dużych obrażeń, te salwy osłabiają źródło światła. Pięść jest również w stanie na krótko pogrążyć arenę w ciemności, aby uciec! \n\n Pięść nie posiada jednak żadnych specjalnych zdolności, których mogłaby użyć w walce wręcz.
actors.mobs.yogfist$darkfist.name=ciemna pięść
actors.mobs.yogfist$darkfist.teleport=Pięść teleportuje się w eksplozji ciemności, która gasi źródło światła!
actors.mobs.yogfist$rottingfist.desc=Ogromna pięść z gnijącego mięsa. Między palcami sączy się cuchnący śluz, plamiąc kamień pod nią.
actors.mobs.yogfist$rottingfist.name=gnijąca pięść
actors.mobs.yogfist$rustedfist.desc=Ta pięść jest uformowana z żywego metalu. To potężna masa zmiennokształtnego metalu, która dysponuje potężnymi atakami wręcz i może okaleczyć cele z dystansu. Ze względu na swoją ogromną masę, pięść przyjmuje wszelkie obrażenia rozłożone w czasie, a nie natychmiast.\n\nPięść jest jednak nieelastyczna i nie może wcisnąć się w ciasne przejścia. Co więcej, chociaż obrażenia mogą być zadawane powoli, obrażenia opóźnione będą nadal rosły, jeśli pięść zostanie trafiona wielokrotnie.
actors.mobs.yogfist$rustedfist.name=zardzewiała pięść
actors.mobs.yogfist$soiledfist.desc=Ta pięść jest utworzona z chaotycznej magii ziemi. Poruszając się, nieustannie powoduje wyrastanie wokół niej roślinności. Potrafi również wystrzeliwać skoncentrowane, ziemiste podmuchy, które uwięzią cel w szybko rosnących pnączach i korzeniach! \n\nPięść czerpie moc z tej rośliny i będzie odporna na obrażenia w zależności od ilości wysokiej lub bruzdowanej roślinności w pobliżu!
actors.mobs.yogfist$soiledfist.name=zabrudzona pięść
actors.mobs.yogfist.desc=Ta pięść jest aspektem mocy Yog-Dzewy. Pięści są powiązane z mocą Yog-Dzewy i będą chronione przed wszelkimi obrażeniami, gdy znajdą się blisko oka.
actors.mobs.yogfist.invuln_warn=Pięść jest niezniszczalna, gdy jest blisko oka!
actors.mobs.yogfist.rankings_desc=Pożarty przez Yog-Dzewę
actors.char.def_verb_evaded=uniknął
actors.char.enemy_hit=%s trafił cię
actors.char.enemy_missed=Ty atakujesz %2$s %1$s
actors.char.hit=%s uderzył %s
actors.char.mob_missed=Atak %1$s %2$s %3$s
actors.char.out_of_paralysis=Ból wyrwał %s z paraliżu
actors.char.you_hit=Trafiłeś %s
actors.char.you_missed=%1$s %2$s twój atak
actors.mobs.mob.fleeing=%s ucieka
actors.mobs.mob.hunting=%s poluje
actors.mobs.mob.passive=%s jest pasywny
actors.mobs.mob.sleeping=%s śpi
actors.mobs.mob.wandering=%s wędruje
actors.mobs.elemental.desc=Wędrowne żywiołaki ognia powstają przy okazji przywoływania potężniejszych istot. Są z natury tak chaotyczne, że nie ujarzmi ich nawet najpotężniejszy demonolog.
actors.mobs.elemental.name=żywiołak ognia
actors.mobs.king.desc=Ostatni król krasnoludów słynął z głębokiej wiedzy o życiu i śmierci. Przekonał dworzan do udziału w rytuale, który miał dać im wieczną młodość. Ostatecznie otrzymał ją tylko on — a do tego armię nieumarłych.
actors.mobs.king.name=Król Krasnoludów
actors.mobs.npcs.bee.desc=Mimo niewielkich rozmiarów złote pszczoły zaciekle bronią swojego pana. Nie żyją jednak zbyt długo.
actors.mobs.npcs.bee.name=złota pszczoła
actors.mobs.shielded.desc=Osiłki to największe, najsilniejsze i najwytrzymalsze ze wszystkich gnolli. Ciężko ranne wpadają w szał i zadają wrogom jeszcze większe obrażenia.
actors.mobs.shielded.name=osiłek z tarczą
actors.mobs.yog.desc=Yog-Dzewa to Stary Bóg, potężna istota z krain chaosu. Sto lat temu pradawne krasnoludy ledwo wygrały wojnę z jego armią demonów, ale nie zdołały zabić samego boga. Zamiast tego uwięziły go w salach pod swoim miastem, wierząc, że jest zbyt słaby, by kiedykolwiek powstać.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s ma przy sobie _%s_. Oczywiście skradziony.
actors.buffs.armorevasion.name=Zwiększony unik
actors.mobs.king.defeated=Nie możesz mnie zabić, %s...jestem...nieśmiertelny...
