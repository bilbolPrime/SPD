actors.hero.talent.endless_rage.desc=_+1:_ Berserker może osiągnąć maks. _116% wściekłości_.\n\n_+2:_ Berserker może osiągnąć maks. _133% wściekłości_.\n\n_+3:_ Berserker może osiągnąć maks. _150% wściekłości_.\n\nKażdy punkt wściekłości powyżej 100% zwiększa osłonę berserka o 1% i skraca czas odnowienia o 1%, ale nie zwiększa premii do obrażeń powyżej +50%.
actors.hero.talent.endless_rage.title=niekończąca się wściekłość
actors.hero.talent.energizing_meal.desc=_+1:_ Spożywanie jedzenia zajmuje Magowi 1 turę i zapewnia mu _5 tur regeneracji różdżki_.\n\n_+2:_ Spożywanie jedzenia zajmuje Magowi 1 turę i zapewnia mu _8 tur regeneracji różdżki_.
