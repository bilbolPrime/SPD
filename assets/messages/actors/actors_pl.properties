actors.hero.talent.fear_the_reaper.desc=_+1:_ Kiedy wróg oznaczony śmiercią osiągnie 0 punktów zdrowia, staje się _okaleczony_.\n\n_+2:_ Kiedy wróg oznaczony śmiercią osiągnie 0 punktów zdrowia, staje się _przerażony i okaleczony_.\n\n_+3:_ Kiedy wróg oznaczony śmiercią osiągnie 0 punktów zdrowia, staje się _przerażony i okaleczony_, a wrogowie w promieniu 3 pól stają się _okaleczeni_.\n\n_+4:_ Kiedy wróg oznaczony śmiercią osiągnie 0 punktów zdrowia, staje się _przerażony i okaleczony_, a wrogowie w promieniu 3 pól stają się _przerażony i okaleczeni_.
