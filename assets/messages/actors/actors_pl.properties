actors.blobs.electricity.desc=Tutaj wyraźnie iskrzy pole elektryczne.
actors.blobs.electricity.name=elektryczność
actors.blobs.electricity.ondeath=Byłeś śmiertelnie zaszokowany...
actors.blobs.electricity.rankings_desc=Porażony prądem
actors.blobs.fire.desc=Tutaj szaleje pożar.
actors.blobs.fire.name=ogień
actors.blobs.foliage.desc=Promienie światła przebijają mrok podziemnego ogrodu.
actors.blobs.foliage.name=listowie
actors.blobs.freezing.desc=Tutaj powietrze jest nienaturalnie zimne.
actors.blobs.freezing.name=mroźne powietrze
actors.blobs.goowarn.desc=Tutaj roi się od cząsteczek ciemnej energii!
actors.blobs.goowarn.name=ciemna energia
actors.blobs.inferno.desc=Tutaj szaleje piekło.
actors.blobs.inferno.name=piekło
actors.blobs.paralyticgas.desc=Tutaj wiruje chmura gazu paraliżującego.
actors.blobs.paralyticgas.name=gaz paraliżujący
actors.blobs.regrowth.name=odrost
actors.blobs.sacrificialfire.desc=Jest tu ołtarz, na którym płonie ofiarny ogień. Każde zabite tu stworzenie zostanie złożone w ofierze duchom lochu.\n\nMoże nagroda zostanie przyznana, jeśli złoży się wystarczająco dużo ofiar?
actors.blobs.sacrificialfire.name=ogień ofiarny
actors.blobs.sacrificialfire.reward=Ogień wybucha i gaśnie, pozostawiając po sobie nagrodę!
actors.blobs.sacrificialfire.unworthy=Ogień trawi twoją ofiarę, lecz się nie zmienia.
actors.blobs.sacrificialfire.worthy=Ogień trawi twoją ofiarę i staje się silniejszy.
actors.blobs.smokescreen.desc=Tutaj wiruje chmura gęstego, czarnego dymu.
actors.blobs.smokescreen.name=zasłona dymna
actors.blobs.stenchgas.desc=Wszędzie unosi się odór stęchlizny.
actors.blobs.stenchgas.name=gaz śmierdzący
actors.blobs.stormcloud.desc=Tutaj wiruje chmura kłębiącej się pary wodnej.
actors.blobs.stormcloud.name=chmury burzowe
actors.blobs.toxicgas.desc=Tutaj wiruje zielonkawa chmura toksycznego gazu.
actors.blobs.toxicgas.name=toksyczny gaz
actors.blobs.toxicgas.ondeath=Zmarłeś z powodu toksycznego gazu...
actors.blobs.toxicgas.rankings_desc=Udusił się
actors.blobs.waterofawareness.desc=Z wody tej studni emanuje moc wiedzy. Napicie się wody ze studni pozwoli na pełną identyfikację wszystkich noszonych przedmiotów, rozpoznanie klątw na wszystkich przedmiotach w ekwipunku i ujawnienie wszystkich przedmiotów na obecnym piętrze.
actors.blobs.waterofawareness.name=woda świadomości
actors.blobs.waterofawareness.procced=Gdy bierzesz łyk, czujesz, jak wiedza wlewa się do twojego umysłu.
actors.blobs.waterofhealth.desc=Z wody tej studni emanuje moc zdrowia. Picie z niej uleczy twoje rany, zaspokoi głód i oczyści z klątw wszelkie noszone przedmioty.
actors.blobs.waterofhealth.name=woda zdrowia
actors.blobs.waterofhealth.procced=Gdy tylko napijesz się tego napoju, poczujesz, że twoje rany całkowicie się goją.
actors.blobs.web.desc=Wszystko tu pokrywa gęsta sieć. Wszystko, co się dotknie lub zostanie przez nią przerzucone, rozerwie ją, ale też utknie w miejscu.
actors.blobs.web.name=pajęczyna
actors.buffs.adrenaline.desc=Przypływ siły fizycznej, adrenalina zwiększa zarówno szybkość ataku, jak i ruchu.\n\nAdrenalina pozwala celowi biec z dwukrotnie większą prędkością i atakować z szybkością 1,5x większą.\n\nPozostałe tury: %s.
actors.buffs.adrenaline.name=adrenalina
actors.buffs.adrenalinesurge.desc=Nagły przypływ wielkiej mocy, niestety nietrwały.\n\nWzmocnienie siły: +%d.\nObraca się, aż wzmocnienie osłabnie: %s.
actors.buffs.adrenalinesurge.name=wzmocnienie siły
actors.buffs.amok.desc=Amok wywołuje u celu stan wielkiej wściekłości i zamieszania.\n\nKiedy istota jest w stanie amoku, atakuje wszystko, co znajduje się w jej pobliżu, bez względu na to, czy jest to przyjaciel, czy wróg.\n\nPozostałe tury amoku: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Otacza cię cienka tarcza, blokując część obrażeń od ataków magicznych.\n\nTwoja magiczna zbroja jest obecnie wzmocniona o: 0-%d.\n\nLiczba obrotów do momentu osłabienia tajemnej zbroi: %s.
actors.buffs.arcanearmor.name=tajemna zbroja
actors.buffs.artifactrecharge.desc=Energia krąży w twoim ciele, zwiększając szybkość ładowania wyposażonych przez ciebie artefaktów.\n\nKażdy artefakt działa nieco inaczej, ale wszystkie będą zyskiwać ładunek znacznie szybciej niż zwykle.\n\nPozostało tur: %s.
actors.buffs.artifactrecharge.name=ładowanie artefaktu
actors.buffs.ascensionchallenge.almost=Czujesz, że uścisk Yoga na amulecie zaczyna słabnąć. Już prawie udało ci się!
actors.buffs.ascensionchallenge.beckon=Amulet zaczyna wzywać odległych wrogów.
actors.buffs.ascensionchallenge.break=Zatrzymujesz się na chwilę, by złapać oddech i poczuć, jak rany zaczynają się zamykać!
actors.buffs.ascensionchallenge.damage=Amulet zaczyna emitować ciemną energię. Pali się!
actors.buffs.ascensionchallenge.desc=W jakiś sposób Yog-Dzewa utrzymuje wpływ na ten świat poprzez amulet i próbuje powstrzymać twój rozwój! \n\n Moc Yoga sprawia, że lochy stają się o wiele bardziej niebezpieczne, zwiększając liczbę wrogów i czyniąc ich silniejszymi! Ta moc będzie się kumulować, jeśli nie zostanie powstrzymana, i może zostać osłabiona przez pokonanie wrogów wzmocnionych mocą Yoga.
actors.buffs.ascensionchallenge.desc_beckon=Amulet obecnie _wzywa odległych wrogów_, informując ich o twojej pozycji.
actors.buffs.ascensionchallenge.desc_clear=Ciemna energia promieniująca z amuletu została na razie osłabiona tak bardzo, jak to tylko możliwe.
actors.buffs.ascensionchallenge.desc_damage=Energia z amuletu stała się tak silna, że _bezpośrednio ci szkodzi!_
actors.buffs.ascensionchallenge.desc_haste=Amulet obecnie _przyspiesza odległych wrogów_, pozwalając im dotrzeć do Ciebie szybciej!
actors.buffs.ascensionchallenge.desc_slow=Amulet obecnie _spowalnia Cię_ i niweluje efekty zwiększające prędkość!
actors.buffs.ascensionchallenge.haste=Amulet zaczyna poganiać odległych wrogów!
actors.buffs.ascensionchallenge.name=klątwa amuletu
actors.buffs.ascensionchallenge.on_kill=Ciemna energia cię pochłania...
actors.buffs.ascensionchallenge.slow=Amulet zaczyna przypominać ołowiany ciężar w twoim ekwipunku!
actors.buffs.ascensionchallenge.weaken=Można poczuć, jak klątwa amuletu lekko słabnie.
actors.buffs.ascensionchallenge.weaken_info=Klątwę amuletu można osłabić pokonując większą liczbę wrogów.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Jeśli pokonasz wrogów, klątwa amuletu osłabnie!
actors.buffs.barkskin.desc=Twoja skóra jest stwardniała, szorstka i twarda jak kora.\n\nStwardniała skóra zwiększa skuteczność pancerza, umożliwiając lepszą obronę przed atakami fizycznymi.\n\nTwój pancerz jest obecnie zwiększony o: 0-%d.\nObraca się, aż kora osłabnie: %s.\n\nJeśli otrzymasz korę z wielu źródeł, obowiązywać będzie tylko najmocniejsze z nich.
actors.buffs.barkskin.name=kora
actors.buffs.barrier.desc=Wytrzymała bańka siły, która blokuje wszelkie obrażenia.\n\nBariera będzie zatrzymywać uszkodzenia chronionego obiektu, dopóki będzie on chroniony. Osłona będzie również stopniowo zanikać z czasem.\n\nPozostała osłona: %d.
actors.buffs.barrier.name=bariera
actors.buffs.berserk.action_name=Szał
actors.buffs.berserk.angered=rozgniewany
actors.buffs.berserk.angered_desc=Siła obrażeń Berserkera wzmacnia jego ciosy. Wraz z otrzymywaniem obrażeń fizycznych, jego wściekłość narasta, zapewniając mu premię do obrażeń. Obrażenia zablokowane przez pancerz nadal wliczają się do wzrostu wściekłości. \n\nWściekłość będzie zanikać z czasem. Im niższe zdrowie berserkera, tym dłużej będzie trwała. \n\nPrzy 100%% wściekłości, Berserker może wpaść w szał, zapewniając sobie tarczę zależną od poziomu pancerza i brakującego zdrowia. Podczas szału jego tarcza z czasem zanika. Po jej wyczerpaniu będzie musiał odpocząć, zanim ponownie osiągnie wściekłość.\n\nAktualna wściekłość: _%1$.0f%%_\n_+%2$.0f%%_ obrażenia\n\nTarcza szału przy aktualnym pancerzu i PW: _%3$d_
actors.buffs.berserk.berserk=szaleństwo
actors.buffs.berserk.berserk_desc=Strach i niepewność ulatniają się, pozostawiając jedynie gniew. W tym stanie Berserker jest niezwykle potężny, zadając +50%% obrażeń i zyskując premię do tarczy, ale jednocześnie tracąc tarczę w każdej turze.\n\nGdy cała jego tarcza spadnie do 0, berserker przestanie działać.\n\nPo wpadnięciu w szał, Berserker będzie musiał się zregenerować, zanim będzie mógł ponownie nabrać wściekłości.\n\nPozostała tarcza: %d
actors.buffs.berserk.exhausted=wyczerpany
actors.buffs.berserk.no_seal=Aby wpaść w szał, musisz złamać swoją pieczęć!
actors.buffs.berserk.rankings_desc=Szał na śmierć
actors.buffs.berserk.recovering=odzyskiwanie
actors.buffs.berserk.recovering_desc=Siła wewnętrzna ma swoje granice. Berserker musi odpocząć, zanim ponownie użyje swojej furii.\n\nPodczas regeneracji Berserker nie nabiera furii od obrażeń.
actors.buffs.berserk.recovering_desc_levels=Poziomy do odzyskania: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Obroty do odzyskania: _%d_
actors.buffs.bleeding.desc=Z rany wycieka niepokojąca ilość krwi.\n\nKrwawienie zadaje obrażenia co turę. Z każdą turą obrażenia maleją o losową wartość, aż krwawienie w końcu ustanie.\n\nAktualne obrażenia od krwawienia: %d.
actors.buffs.bleeding.heromsg=Krwawisz!
actors.buffs.bleeding.name=krwawienie
actors.buffs.bleeding.ondeath=Wykrwawiłeś się na śmierć...
actors.buffs.bleeding.rankings_desc=Wykrwawiony na śmierć
actors.buffs.bless.desc=Potężny wybuch skupienia, niektórzy mówią, że jest inspirowany przez bogów.\n\nBłogosławieństwo zwiększa celność i uniki o 25%%, dzięki czemu błogosławiony jest znacznie skuteczniejszy w walce.\n\nPozostała liczba tur błogosławieństwa: %s.
actors.buffs.bless.name=błogosławiony
actors.buffs.blindness.desc=Oślepienie zamienia otaczający świat w mroczną mgłę.\n\nW stanie oślepienia zasięg widzenia postaci jest ograniczony do jednego pola, co sprawia, że ataki dystansowe stają się bezużyteczne i bardzo łatwo stracić z oczu oddalonych wrogów. Dodatkowo, oślepiony bohater nie może czytać zwojów ani ksiąg.\n\nPozostała liczba tur oślepienia: %s.
actors.buffs.blindness.heromsg=Jesteś zaślepiony!
actors.buffs.blindness.name=oślepiony
actors.buffs.blobimmunity.desc=Jakaś dziwna siła otacza cię cienką barierą ochronną, blokującą wszystkie szkodliwe efekty rozprzestrzeniania się w powietrzu.\n\nDopóki ta bariera działa, jesteś odporny na wszystkie efekty obszarowe.\n\nPozostała liczba tur odporności: %s.
actors.buffs.blobimmunity.name=bariera oczyszczająca
actors.buffs.burning.burnsup=%s spłonął!
actors.buffs.burning.desc=Niewiele rzeczy jest bardziej przygnębiających niż bycie pochłoniętym przez płomienie.\n\nOgień zadaje obrażenia co turę, aż zostanie ugaszony przez wodę lub wygaśnie. Ogień można ugasić, wchodząc do wody lub rozpryskując miksturę roztrzaskującą.\n\nDodatkowo ogień może zapalić łatwopalny teren lub przedmioty, z którymi się zetknie.\n\nPozostała liczba tur palenia: %s.
actors.buffs.burning.heromsg=Zapalisz się!
actors.buffs.burning.name=palenie
actors.buffs.burning.ondeath=Spłonąłeś żywcem...
actors.buffs.burning.rankings_desc=Spalony na popiół
actors.buffs.championenemy$antimagic.desc=Bohaterowie antymagiczni otrzymują o 50% mniej obrażeń i są całkowicie odporni na efekty magiczne.
actors.buffs.championenemy$antimagic.name=mistrz antymagii
actors.buffs.championenemy$blazing.desc=Płonący mistrzowie zadają o 25% więcej obrażeń w walce wręcz, podpalają wrogów, których atakują, są odporni na ogień i rozprzestrzeniają go wokół siebie, gdy giną. Nie mogą jednak rozprzestrzeniać ognia na wodę.
actors.buffs.championenemy$blazing.name=płonący mistrz
actors.buffs.championenemy$blessed.desc=Błogosławieni mistrzowie mają 4x większą celność i unikanie.
actors.buffs.championenemy$blessed.name=błogosławiony mistrz
actors.buffs.championenemy$giant.desc=Olbrzymi czempioni otrzymują o 80% mniej obrażeń i mają +1 zasięg ataku, ale nie mogą poruszać się przez zamknięte przestrzenie.
actors.buffs.championenemy$giant.name=gigantyczny mistrz
actors.buffs.championenemy$growing.desc=Bohaterowie w fazie rozwoju otrzymują stale zwiększającą się premię do celności, uników, obrażeń fizycznych i redukcję otrzymywanych obrażeń.\n\nAktualne zwiększenie celności/eva/obrażeń: %1$d%%\nAktualna redukcja obrażeń: %2$d%%
actors.buffs.championenemy$growing.name=rosnący mistrz
actors.buffs.championenemy$projecting.desc=Bohaterowie o wysokiej zdolności przewidywania zadają o 25% więcej obrażeń w walce wręcz i mają +3 zasięg ataku.
actors.buffs.championenemy$projecting.name=zapowiadający się mistrz
actors.buffs.championenemy.warn=Wyczuwasz śmiertelną obecność.
actors.buffs.charm.cant_attack=Jesteś oczarowany tym wrogiem i nie możesz go zaatakować.
actors.buffs.charm.desc=Urok to magia manipulacyjna, która może sprawić, że wrogowie na chwilę się zakochają.\n\nPostacie objęte urokiem nie mogą bezpośrednio atakować przeciwnika, który je zaczarował. Atakowanie innych celów jest jednak nadal możliwe. Ból wywołany szokiem skróci czas działania uroku.\n\nPozostałe tury uroku: %s.
actors.buffs.charm.heromsg=Jesteś oczarowany!
actors.buffs.charm.name=oczarowany
actors.buffs.chill.desc=Nie do końca zamrożone, ale wciąż zdecydowanie za zimne.\n\nWychłodzone cele wykonują wszystkie akcje wolniej, w zależności od liczby tur pozostałych w efekcie. W najgorszym przypadku jest to równoznaczne ze spowolnieniem.\n\nPozostała liczba tur wychłodzenia: %1$s.\nPrędkość zmniejsza się o: %2$s%%
actors.buffs.chill.freezes=%s zawiesza się!
actors.buffs.chill.name=schłodzony
actors.buffs.combo$combomove.clobber.desc=Odrzuca wroga o 2 pola, ale nie zadaje obrażeń i nie może wrzucić go do dołów. Zwiększa siłę kombo o 1.
actors.buffs.combo$combomove.clobber.empower_desc=Odrzuca wroga o _3 pola, powoduje zawroty głowy i może wpaść do dołów,_ ale nie zadaje obrażeń. Zwiększa siłę kombo o 1.
actors.buffs.combo$combomove.clobber.name=sprać
actors.buffs.combo$combomove.crush.desc=Zadaje obrażenia %d%% (combo*25%%) głównemu celowi i połowę tych obrażeń wszystkim pozostałym wrogom w obszarze 7x7. Resetuje combo po użyciu.
actors.buffs.combo$combomove.crush.empower_desc=_Skacze do pola(ek) %1$d_ i zadaje obrażenia %2$d%% (kombo*25%%) głównemu celowi oraz połowę tych obrażeń wszystkim pozostałym wrogom w obszarze 7x7. Resetuje kombinację po użyciu.
actors.buffs.combo$combomove.crush.name=zmiażdżyć
actors.buffs.combo$combomove.fury.desc=Trafia wroga raz za każdą twoją kombinację. Każde trafienie zadaje 60% obrażeń i może aktywować zaklęcia. Resetuje kombinację po użyciu.
actors.buffs.combo$combomove.fury.empower_desc=_Skacze do pola(ek) %d_ i trafia przeciwnika raz za każdą posiadaną kombinację. Każde trafienie zadaje 60%% obrażeń i może aktywować zaklęcia. Resetuje kombinację po użyciu.
actors.buffs.combo$combomove.fury.name=furia
actors.buffs.combo$combomove.parry.desc=Po aktywacji blokuje kolejny atak w ciągu 1 tury i natychmiast odpowiada na niego kontratakiem. Resetuje kombinację, jeśli nic nie zostanie sparowane.
actors.buffs.combo$combomove.parry.empower_desc=Po aktywacji blokuje _wszystkie ataki_ w ciągu 1 tury i natychmiast na nie odpowiada. Resetuje kombinację, jeśli nic nie zostanie sparowane.
actors.buffs.combo$combomove.parry.name=parować
actors.buffs.combo$combomove.slam.desc=Zadaje dodatkowe obrażenia w postaci %d%% (kombo*20%%) twojej mocy blokowania obrażeń. Resetuje kombinację po użyciu.
actors.buffs.combo$combomove.slam.empower_desc=_Skacze do pola(ek) %1$d_ i zadaje obrażenia dodatkowe w wysokości %2$d%% (kombinacja*20%%) twojej siły blokowania obrażeń. Resetuje kombinację po użyciu.
actors.buffs.combo$combomove.slam.name=zatrzasnąć
actors.buffs.combo.action_name=atak kombinowany
actors.buffs.combo.bad_target=Musisz wybrać wroga znajdującego się w zasięgu ataku.
actors.buffs.combo.combo=%d - udana kombinacja!
actors.buffs.combo.desc=Gladiator nabiera rozpędu, zadając celne ciosy. Każdy atak zwiększa licznik kombinacji o jeden, ale zbyt długa przerwa między ciosami zresetuje licznik kombinacji do 0. Dopóki gladiator korzysta z kombinacji, jego osłona po złamaniu pieczęci nie zacznie zanikać.\n\nBudowanie kombinacji odblokowuje specjalne ataki kombinacyjne, których nie można chybić! Inny atak jest odblokowywany przy 2, 4, 6, 8 i 10 kombinacjach. Niektóre ruchy resetują kombinację, a inne nie, ale każdy ruch można użyć tylko raz na sesję kombinacji.\n\nAktualna kombinacja: %1$d.\n\nObroty do momentu utraty kombinacji: %2$s.
actors.buffs.combo.name=kombinacja
actors.buffs.combo.prompt=Wybierz cel, który chcesz zaatakować.
actors.buffs.corrosion.desc=Mocny kwas topi ciało, metal i kości w zastraszającym tempie.\n\nZniszczenia korozyjne zwiększają się z czasem, w miarę jak cel nadal się topi.\n\nPozostałe zwoje korozji: %1$s.\nAktualne uszkodzenia korozyjne: %2$d.
actors.buffs.corrosion.heromsg=Rozpływasz się!
actors.buffs.corrosion.name=korozja
actors.buffs.corrosion.ondeath=Rozpływasz się...
actors.buffs.corrosion.rankings_desc=Rozpuszczony
actors.buffs.corruption.desc=Zepsucie przenika istotę istoty, wypaczając ją wbrew jej pierwotnej naturze.\n\nZepsute istoty atakują swoich sojuszników i ignorują dawnych wrogów. Zepsucie również zadaje obrażenia i powoli powoduje, że cel ulega.\n\nZepsucie jest trwałe, jego efekty kończą się dopiero po śmierci.
actors.buffs.corruption.name=skorumpowany
actors.buffs.cripple.desc=Jesteś prawie pewien, że nogi nie są stworzone do tego, aby się tak zginać.\n\nOkaleczenie zmniejsza prędkość ruchu o połowę, przez co przesunięcie pola zajmuje zazwyczaj dwie tury zamiast jednej.\n\nPozostałe tury okaleczenia: %s.
actors.buffs.cripple.heromsg=Jesteś kaleką!
actors.buffs.cripple.name=okaleczony
actors.buffs.daze.desc=Dzwonienie w uszach i niewyraźne widzenie utrudniają walkę.\n\nPodczas oszołomienia celność i uniki są zmniejszone o 50%%, przez co zarówno trafianie, jak i unikanie ciosów staje się znacznie trudniejsze.\n\nPozostała liczba tur oszołomienia: %s.
actors.buffs.daze.heromsg=Jesteś oszołomiony!
actors.buffs.daze.name=oszołomiony
actors.buffs.degrade.desc=Potężna mroczna magia osłabia moc, którą zwoje ulepszeń przypisały twojemu ekwipunkowi! \n\nPodczas degradacji, ulepszony ekwipunek będzie traktowany tak, jakby miał niższy poziom niż w rzeczywistości. _Każde ulepszenie po +3 staje się wykładniczo słabsze od poprzedniego._ Opisy twoich przedmiotów zmienią się, odzwierciedlając ich obniżony poziom mocy. \n\nDegradacja nie wpływa na wymagania siły, ładunki różdżek, wytrzymałość broni rzucanej ani artefakty. \n\nPozostała liczba tur degradacji: %s. Użycie zwoju ulepszenia lub zdjęcia klątwy natychmiast zakończy degradację.
actors.buffs.degrade.heromsg=Twój sprzęt wydaje się słabszy!
actors.buffs.degrade.name=zdegradowany
actors.buffs.doom.desc=Trudno jest kontynuować, gdy wydaje się, że wszechświat chce twojej śmierci.\n\nPostacie dotknięte zagładą będą otrzymywać +67% obrażeń ze wszystkich źródeł.\n\nZagłada jest trwała, jej efekty kończą się dopiero po śmierci.
actors.buffs.doom.name=stracony
actors.buffs.dread.desc=Groza tak wielka, że zmusi cel do ucieczki z lochu!\n\nStworzenia dotknięte grozą będą uciekać przed przeciwnikiem z dużą prędkością i znikną z lochu całkowicie, gdy tylko znikną z pola widzenia. Pokonani w ten sposób przeciwnicy otrzymają połowę punktów doświadczenia i nie upuszczą żadnych przedmiotów. Ból skróci czas trwania grozy.\n\nPozostała liczba tur grozy: %d.
actors.buffs.dread.name=strach
actors.buffs.drowsy.desc=Magiczna siła utrudnia celowi utrzymanie się w stanie czuwania. Po kilku turach cel zapadnie w głęboki magiczny sen.\n\nBohater może oprzeć się senności, otrzymując obrażenia lub mając pełne zdrowie.\n\nTury do zaśnięcia: %s.
actors.buffs.drowsy.name=senny
actors.buffs.earthimbue.desc=Zostałeś przepełniony mocą ziemi!\n\nWszystkie ataki fizyczne będą przesuwać ziemię pod wrogiem, paraliżując go na krótki czas.\n\nPozostała liczba obrotów nasycenia ziemią: %s.
actors.buffs.earthimbue.name=przesiąknięty ziemią
actors.buffs.enhancedrings.desc=Ostatnio użyty artefakt Łotra wzmacnia jego pierścienie, nadając im +1 poziom.\n\nPozostałe tury: %s.
actors.buffs.enhancedrings.name=ulepszone pierścienie
actors.buffs.fireimbue.desc=Jesteś przepełniony mocą ognia!\n\nWszystkie ataki fizyczne mają szansę podpalić wrogów. Dodatkowo jesteś całkowicie odporny na efekty ognia.\n\nPozostała liczba tur nasycenia ogniem: %s.
actors.buffs.fireimbue.name=przepełniony ogniem
actors.buffs.foresight.desc=W jakiś sposób jesteś w stanie zobaczyć układ otaczającego terenu za pomocą swojego umysłu.\n\nPodczas działania efektu przewidywania wszystkie pola w szerokim promieniu zostają ci ujawnione, łącznie z wszelkimi tajnymi pułapkami i drzwiami.\n\nPozostała liczba tur przewidywania: %s.
actors.buffs.foresight.name=dalekowzroczność
actors.buffs.frost.desc=Nie należy mylić go z zamrożeniem na stałe, to łagodniejsze zamrożenie po prostu otacza cel lodem.\n\nZamrożenie działa podobnie do paraliżu, uniemożliwiając celowi działanie. W przeciwieństwie do paraliżu, zamrożenie jest natychmiast anulowane, gdy cel otrzyma obrażenia, ponieważ lód pęka.\n\nPozostała liczba tur zamrożenia: %s.
actors.buffs.frost.freezes=%s zawiesza się!
actors.buffs.frost.name=mrożony
actors.buffs.frostimbue.desc=Jesteś przepełniony lodową mocą!\n\nWszystkie ataki fizyczne będą stopniowo nakładać na wrogów chłód. Dodatkowo jesteś całkowicie odporny na zimno.\n\nPozostała liczba tur mrozu: %s.
actors.buffs.frostimbue.name=przesiąknięty szronem
actors.buffs.fury.desc=Jesteś zły, wrogowie nie będą cię lubić, gdy będziesz zły.W tobie płonie wielka wściekłość, zwiększając obrażenia zadawane atakami fizycznymi o 50%%.Wściekłość ta będzie trwała tak długo, jak długo będziesz miał obrażenia poniżej 50%% zdrowia.
actors.buffs.fury.heromsg=Wściekasz się!
actors.buffs.fury.name=wściekły
actors.buffs.gravitychaostracker.desc_duration=Nie wiadomo, jak długo ten efekt będzie się utrzymywał, ale na pewno nie będzie trwał wiecznie.
actors.buffs.gravitychaostracker.desc_intro=Co kilka tur wszystkie postacie na aktualnym piętrze lochu zostaną rzucone w losowym kierunku.
actors.buffs.gravitychaostracker.desc_positive=Ty i twoi sojusznicy wyglądacie jednak na odpornych.
actors.buffs.gravitychaostracker.name=chaos grawitacyjny
actors.buffs.greaterhaste.desc=Niesamowity wzrost prędkości, przez chwilę wydaje się, jakby wszystko inne stanęło w miejscu.\n\nPod wpływem większego pośpiechu ruchy nie zajmują w ogóle czasu, ale inne czynności są nadal wykonywane z normalną prędkością. Każdy krok ruchu pochłania turę większego pośpiechu.\n\nPozostałe tury większego pośpiechu: %d.
actors.buffs.greaterhaste.name=większy pośpiech
actors.buffs.haste.desc=Energia krąży w twoich mięśniach, umożliwiając ci bieganie z niewiarygodną prędkością!\n\nPodczas działania pośpiechu będziesz biec z trzykrotnie większą prędkością, ale wszystkie inne czynności będziesz wykonywać z normalną prędkością.\n\nPozostała liczba tur pośpiechu: %s.
actors.buffs.haste.name=pośpiech
actors.buffs.healing.desc=Magiczny środek powoduje, że rany się zamykają, a ciało zrasta.\n\nZdrowie będzie się stopniowo regenerować w każdej turze, aż do wygaśnięcia efektu leczenia. Ilość leczenia może z czasem zanikać.\n\nNastępne leczenie: %d.\n\nPozostało leczenie: %d.
actors.buffs.healing.name=gojenie : zdrowienie
actors.buffs.herodisguise.desc=Iluzoryczna magia zmieniła twój wygląd! Efekt jest czysto kosmetyczny, ale i tak wydaje się bardzo dziwny.\n\nPozostała liczba tur kamuflażu: %s.
actors.buffs.herodisguise.name=przebranie
actors.buffs.hex.desc=Czarna magia, która osłabia koncentrację, przez co cel jest lekko zdezorientowany.\n\nZaklęcia zmniejszają celność i uniki o 20%%, przez co cel staje się mniej skuteczny w walce.\n\nPozostała liczba tur zaklęć: %s.
actors.buffs.hex.heromsg=Zostałeś przeklęty!
actors.buffs.hex.name=zaczarowany
actors.buffs.holdfast.desc=Wojownik utrzymuje swoją pozycję, zwiększając swój pancerz o %1$d-%2$d i spowalniając tempo zanikania niektórych wzmocnień o %3$d%%. Będzie to trwało, dopóki się nie poruszy.
actors.buffs.holdfast.name=trzymaj się mocno
actors.buffs.hunger.cursedhorn=Przeklęty róg kradnie część energii zawartej w pożywieniu, gdy jesz.
actors.buffs.hunger.desc=Głód powoli rośnie w miarę spędzania czasu w lochu, aż w końcu zaczniesz głodować. Głodując, będziesz powoli tracić zdrowie zamiast je regenerować.\n\nRacjonowanie jest ważne! Jeśli masz zapas zdrowia, głodowanie nie jest złym pomysłem, jeśli oznacza to, że później będzie więcej jedzenia. Skuteczne racjonowanie może sprawić, że jedzenie wystarczy na znacznie dłużej!
actors.buffs.hunger.desc_intro_hungry=Czujesz, że twój żołądek domaga się jedzenia, ale nie jest to jeszcze zbyt pilne.
actors.buffs.hunger.desc_intro_starving=Jesteś tak głodny, że aż boli.
actors.buffs.hunger.hungry=głodny
actors.buffs.hunger.ondeath=Umarłeś z głodu...
actors.buffs.hunger.onhungry=Jesteś głodny.
actors.buffs.hunger.onstarving=Jesteś głodny!
actors.buffs.hunger.rankings_desc=Zagłodzony na śmierć
actors.buffs.hunger.starving=głodujący
actors.buffs.invisibility.desc=Całkowicie wtapiasz się w otaczający teren, przez co nie można cię dostrzec.\n\nDopóki jesteś niewidzialny, wrogowie nie mogą cię atakować ani podążać za tobą. Ataki fizyczne i efekty magiczne (takie jak zwoje i różdżki) natychmiast anulują niewidzialność.\n\nPozostała liczba tur niewidzialności: %s.
actors.buffs.invisibility.name=niewidzialny
actors.buffs.invulnerability.desc=Ta postać jest przepełniona wielką mocą ochronną, zapewniającą jej krótki okres nietykalności!\n\nPozostało tur: %s.
actors.buffs.invulnerability.name=niewrażliwy
actors.buffs.levitation.desc=Magiczna siła unosi cię nad ziemią, sprawiając, że czujesz się nieważki.\n\nLewitujące postacie poruszają się bezszelestnie i ignorują wszystkie efekty naziemne. Pułapki się nie uruchamiają, woda nie gasi ognia, rośliny nie są tratowane, korzenie nie trafiają, a doły unoszą się w powietrzu. Uważaj, bo wszystkie te efekty mogą zadziałać natychmiast po zakończeniu lewitacji!\n\nPozostała liczba tur lewitacji: %s.
actors.buffs.levitation.name=lewitujący
actors.buffs.lifelink.desc=Siła życiowa tej postaci jest połączona z siłą życiową innej postaci w pobliżu. Wszelkie otrzymane obrażenia są dzielone między nimi.\n\nZa każdym razem, gdy ta postać otrzyma obrażenia, połowa z nich zostanie zadana celowi połączenia życiowego.\n\nPozostała liczba tur połączenia życiowego: %s.
actors.buffs.lifelink.name=łącze życia
actors.buffs.lifelink.ondeath=Uszkodzenia związane z życiem cię zabiły...
actors.buffs.light.desc=Nawet w Najciemniejszym Lochu, stałe światło u twego boku zawsze jest kojące.\n\nŚwiatło pomaga utrzymać ciemność na dystans, pozwalając ci widzieć na rozsądną odległość, niezależnie od otoczenia.\n\nPozostała liczba obrotów oświetlenia: %s.
actors.buffs.light.name=oświetlony
actors.buffs.lockedfloor.desc=Obecne piętro jest zablokowane i nie możesz go opuścić! \n\nDopóki piętro jest zablokowane, nie będziesz głodować ani nie otrzymasz obrażeń od głodu. Dodatkowo, jeśli nie podejmiesz wysiłków w celu pokonania bossa na tym piętrze, pasywne efekty regeneracji również zostaną zatrzymane. \n\nDodatkowo, jeśli zostaniesz ożywiony przez niebłogosławionego Ankh, gdy piętro jest zablokowane, zostanie ono zresetowane. \n\nZabij bossa na tym piętrze, aby odblokować blokadę.
actors.buffs.lockedfloor.name=piętro jest zablokowane
actors.buffs.lostinventory.desc=Twój ekwipunek zaginął gdzieś w lochu! Nie będziesz mógł podnieść ani użyć większości przedmiotów, dopóki go nie odzyskasz.
actors.buffs.lostinventory.name=utracone zapasy
actors.buffs.magicalsight.desc=W jakiś sposób jesteś w stanie widzieć umysłem, a nie oczami.\n\nDopóki magiczny wzrok jest aktywny, będziesz w stanie widzieć przez cały teren w promieniu 12 pól.\n\nPozostała liczba tur magicznego wzroku: %s.
actors.buffs.magicalsight.name=magiczny widok
actors.buffs.magicalsleep.desc=Ta postać zapadła w głęboki magiczny sen, z którego nie wybudzi się naturalnie.\n\nMagiczny sen jest podobny do zwykłego snu, z tą różnicą, że tylko otrzymane obrażenia spowodują wybudzenie celu.\n\nDla bohatera i jego sojuszników magiczny sen ma pewne właściwości regenerujące, pozwalając im szybko leczyć się podczas odpoczynku.
actors.buffs.magicalsleep.fallasleep=Zapadasz w głęboki, magiczny sen.
actors.buffs.magicalsleep.name=magiczny sen
actors.buffs.magicalsleep.toohealthy=Jesteś zbyt zdrowy i opierasz się pokusie snu.
actors.buffs.magicalsleep.wakeup=Budzisz się wypoczęty i zdrowy.
actors.buffs.magicimmune.desc=Wszystkie magiczne efekty tracą na tobie wpływ, jesteś na nie całkowicie odporny.\n\nDopóki jesteś odporny na magię, wszystkie szkodliwe i pomocne magiczne efekty nie będą na ciebie oddziaływać, włączając w to klątwy, zaklęcia, różdżki, zwoje, pierścienie, artefakty itp. Zdolności bohaterskiej zbroi są wystarczająco silne, by działać niezależnie od tego efektu.\n\nPozostała liczba tur odporności na magię: %s.
actors.buffs.magicimmune.name=odporny na magię
actors.buffs.mindvision.desc=W jakiś sposób jesteś w stanie widzieć wszystkie stworzenia na tym piętrze za pomocą swojego umysłu. To dziwne uczucie.\n\nWszystkie postacie na tym piętrze są dla ciebie widoczne, dopóki posiadasz zdolność widzenia umysłem. Widzenie stworzenia za pomocą widzenia umysłem liczy się jako jego widzenie lub obecność w pobliżu na potrzeby wielu efektów magicznych.\n\nPozostała liczba tur widzenia umysłem: %s.
actors.buffs.mindvision.name=wizja umysłu
actors.buffs.momentum.action_name=bieg swobodny
actors.buffs.momentum.momentum=budowanie pędu
actors.buffs.momentum.momentum_desc=W miarę ruchu Freerunner nabiera pędu, który może wykorzystać, aby rozpocząć bieg swobodny.\n\nKażdy ładunek pędu zapewnia dwie tury biegu swobodnego, a Freerunner może nabrać do 10 ładunków. Pęd szybko traci, gdy Freerunner przestaje się poruszać.\n\nAktualny ładunek pędu: %d.
actors.buffs.momentum.resting=odzyskiwanie
actors.buffs.momentum.resting_desc=W miarę jak się porusza, Freerunner nabiera rozpędu, który może wykorzystać, aby rozpocząć bieg swobodny.\n\nFreerunner potrzebuje czasu, aby odzyskać wytrzymałość, zanim znów zacznie biegać.\n\nPozostałe tury: %d.
actors.buffs.momentum.running=bieganie na luzie
actors.buffs.momentum.running_desc=W miarę jak się porusza, Freerunner nabiera pędu, który może wykorzystać, aby rozpocząć bieganie swobodne.\n\nPodczas biegu swobodnego Freerunner porusza się z podwójną prędkością i zyskuje premię do uników zależnie od swojego poziomu.\n\nPozostałe tury: %d.
actors.buffs.monkenergy$monkability$dash.desc=Natychmiastowy skok na odległość do 4 pól. Ta umiejętność pozwala pokonywać przeszkody, ale nie wrogów ani twardy teren.
actors.buffs.monkenergy$monkability$dash.empower_desc=Natychmiastowy skok na odległość do _8 pól_. Ta umiejętność pozwala pokonywać przeszkody, ale nie wrogów ani twardy teren.
actors.buffs.monkenergy$monkability$dash.name=kropla
actors.buffs.monkenergy$monkability$dash.prompt=Wybierz lokalizację
actors.buffs.monkenergy$monkability$dragonkick.desc=Niszczycielski kopniak, który zadaje obrażenia od %1$d-%2$d i ignoruje pancerz. Kopniak odrzuca cel i paraliżuje go z każdym polem, które przebył.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Niszczycielski kopniak, który zadaje _%1$d-%2$d obrażeń_ i ignoruje pancerz. Kopniak odrzuca _wszystkie sąsiednie cele_ i paraliżuje je z każdym polem, które przemierzą.
actors.buffs.monkenergy$monkability$dragonkick.name=kopnięcie smoka
actors.buffs.monkenergy$monkability$flurry.desc=Dwa natychmiastowe ciosy, które zadają obrażenia %1$d-%2$d i ignorują pancerz. Tej umiejętności nie można używać wielokrotnie.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dwa natychmiastowe ciosy, które zadają obrażenia %1$d-%2$d, ignorują pancerz i _używają zaklęcia twojej broni._ Tej umiejętności nie można używać wielokrotnie.
actors.buffs.monkenergy$monkability$flurry.name=grad ciosów
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Mniszka koncentruje się na swoim otoczeniu, przewidując kolejny atak. Skupiona, ma gwarancję, że sparuje kolejny nadchodzący atak.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=skupiony
actors.buffs.monkenergy$monkability$focus.desc=Mnich skupia się, pozwalając jej sparować kolejny atak skierowany przeciwko niej.
actors.buffs.monkenergy$monkability$focus.empower_desc=Mnich _natychmiast się koncentruje_, pozwalając jej sparować kolejny atak skierowany przeciwko niej.
actors.buffs.monkenergy$monkability$focus.name=centrum
actors.buffs.monkenergy$monkability$meditate.desc=Mniszka skupia energię w swoim ciele na 5 tur. To usuwa większość negatywnych efektów i zapewnia jej 8 tur regeneracji różdżki i artefaktów.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Mniszka skupia energię w swoim ciele przez 5 tur. Usuwa to większość negatywnych efektów i zapewnia jej 8 tur regeneracji różdżki i artefaktów. _Zyskuje również 80% odporności na obrażenia podczas medytacji i powoli leczy 20% brakującego HP._
actors.buffs.monkenergy$monkability$meditate.name=medytować
actors.buffs.monkenergy.action=Umiejętności mnicha
actors.buffs.monkenergy.desc=Pokonując wrogów, Mniszka zyskuje energię, którą może wykorzystać do różnych umiejętności. Większość wrogów zapewnia 1 punkt energii po pokonaniu, a Mniszka nie traci energii z upływem czasu.\n\nAktualna energia: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Mnich niedawno użył jednej ze zdolności i musi odczekać, zanim użyje kolejnej.\n\nAktualny czas odnowienia: %d obrotów.
actors.buffs.monkenergy.name=energia
actors.buffs.ooze.desc=Ten lepki kwas przylega do ciała, powoli je topiąc.\n\nOaza będzie zadawać stałe obrażenia przez dłuższy czas, ale można ją natychmiast zmyć wodą.\n\nLiczba pozostałych obrotów mazi: %s.
actors.buffs.ooze.heromsg=Żrąca maź zżera twoje ciało. Zmyj ją!
actors.buffs.ooze.name=żrący szlam
actors.buffs.ooze.ondeath=Rozpływasz się...
actors.buffs.ooze.rankings_desc=Rozpuszczony
actors.buffs.paralysis.desc=Często najgorszą rzeczą, jaką można zrobić, jest nic nie robić.\n\nParaliż całkowicie zatrzymuje wszystkie akcje, zmuszając cel do czekania, aż efekt minie. Ból spowodowany otrzymaniem obrażeń może sprawić, że postacie uodpornią się na paraliż, uwalniając je od efektu.\n\nPozostała liczba tur paraliżu: %s.
actors.buffs.paralysis.heromsg=Jesteś sparaliżowany!
actors.buffs.paralysis.name=sparaliżowany
actors.buffs.paralysis.out=opierał się paraliżowi
actors.buffs.physicalempower.desc=Twoje ciosy zostały wzmocnione, zwiększając ilość obrażeń, które możesz zadać, atakując wrogów atakami fizycznymi.\n\nDodatkowe obrażenia: %1$d.\nPozostałe trafienia: %2$d.
actors.buffs.physicalempower.name=fizycznie wzmocniony
actors.buffs.pincushion.desc=Rzucana przez Ciebie broń przeciwko tej postaci jest obecnie do niej przyklejona i spadnie na podłogę po jej pokonaniu.\n\nAktualnie dołączone są następujące przedmioty:
actors.buffs.pincushion.name=poduszeczka do igieł
actors.buffs.poison.desc=Trucizna przedostaje się do organizmu, powoli upośledzając jego funkcjonowanie.\n\nTrucizna zadaje obrażenia w każdej turze proporcjonalnie do czasu, jaki upłynął do jej wygaśnięcia.\n\nLiczba pozostałych tur trucizny: %s.
actors.buffs.poison.heromsg=Jesteś otruty!
actors.buffs.poison.name=otruty
actors.buffs.poison.ondeath=Umarłeś od trucizny...
actors.buffs.poison.rankings_desc=Uległ truciźnie
actors.buffs.preparation.action_name=przygotowany strajk
actors.buffs.preparation.assassinated=zamordowany
actors.buffs.preparation.desc=Zabójca czeka cierpliwie, przygotowując się do ataku z cienia.
actors.buffs.preparation.desc_blink=Potrafi mrugnąć w stronę wroga, a następnie go zaatakować. Maksymalny dystans wynosi _%d._
actors.buffs.preparation.desc_dmg=Jego kolejny atak zada _%1$d%% dodatkowe obrażenia_ i wykończy zwykłych wrogów mających mniej niż _%2$d%% zdrowia_ lub bossów mających mniej niż _%3$d%% zdrowia_.
actors.buffs.preparation.desc_dmg_likely=Atak będzie miał również większą szansę zadać większe obrażenia.
actors.buffs.preparation.desc_invis_next=Zmiana na mocniejszy atak: _%d._
actors.buffs.preparation.desc_invis_time=Liczba tur spędzonych w stanie niewidzialności: _%d._
actors.buffs.preparation.name=przygotowanie
actors.buffs.preparation.no_target=Nie ma tam czego atakować.
actors.buffs.preparation.out_of_reach=Ten cel jest poza naszym zasięgiem.
actors.buffs.preparation.prompt=Wybierz cel do ataku!\nMaksymalny zasięg mrugnięcia: %d
actors.buffs.prismaticguard.desc=Jesteś strzeżony przez pryzmatyczny obraz, który jest obecnie nieaktywny. Gdy pojawią się wrogowie, pryzmatyczny obraz zacznie działać i cię ochroni! \n\nW stanie nieaktywnym pryzmatyczny obraz będzie stopniowo regenerował się po wszelkich otrzymanych obrażeniach. \n\nAktualne HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Ten pryzmatyczny obraz również korzysta z Mocy Wielu. Pozostałe obroty: %d.
actors.buffs.prismaticguard.name=pryzmatyczna osłona
actors.buffs.recharging.desc=Energia krąży w twoim ciele, zwiększając szybkość ładowania twoich różdżek i kosturów.\n\nKażda tura, w której to wzmocnienie zwiększy obecny poziom naładowania o jedną czwartą, oprócz zwykłego doładowania.\n\nPozostała liczba tur doładowania: %s.
actors.buffs.recharging.name=ładowanie
actors.buffs.revealedarea.desc=Bohaterowi tymczasowo ujawniono część lochów. Zobaczy ją bez względu na to, gdzie się znajduje.\n\nPozostałe tury: %s.
actors.buffs.revealedarea.name=odsłonięty obszar
actors.buffs.revealedchar.desc=Ta postać zostaje ujawniona bohaterowi. Będzie widoczna bez względu na to, gdzie się znajduje.\n\nPozostałe tury: %s.
actors.buffs.revealedchar.name=ujawnił
actors.buffs.roots.desc=Korzenie (magiczne lub naturalne) chwytają stopy, przyciskając je do ziemi.\n\nKorzenie unieruchamiają cel, uniemożliwiając ruch i korzystanie z większości zdolności ruchowych. Pozostałe akcje, w tym efekty teleportacji, pozostają nienaruszone.\n\nPozostała liczba tur korzeni: %s.
actors.buffs.roots.heromsg=Nie możesz się ruszyć!
actors.buffs.roots.name=ukorzeniony
actors.buffs.scrollempower.desc=Energia z niedawno przeczytanego zwoju Maga wzmacnia jego różdżki!\n\nWzmocnienie poziomu: +%1$d.\nPozostało zapsów: %2$d.
actors.buffs.scrollempower.name=przewiń, wzmocnij
actors.buffs.shadows.desc=Wtapiasz się w otaczające cię cienie, co zapewnia ci niewidzialność i spowalnia metabolizm.\n\nDopóki jesteś niewidzialny, wrogowie nie mogą cię atakować ani podążać za tobą. Większość ataków fizycznych i efektów magicznych (takich jak zwoje i różdżki) natychmiast anuluje niewidzialność. Dodatkowo, będąc w cieniu, twoje tempo głodu jest spowolnione.\n\nPozostaniesz w cieniu, dopóki nie wyjdziesz z cienia lub nie wejdziesz w kontakt z wrogiem.
actors.buffs.shadows.name=wtopiony w cień
actors.buffs.slow.desc=Spowalniająca magia wpływa na tempo upływu czasu celu, dla którego wszystko dzieje się niezwykle szybko.\n\nSpowolniona postać wykonuje wszystkie akcje w czasie dwukrotnie dłuższym niż normalnie.\n\nPozostałe tury spowolnienia: %s.
actors.buffs.slow.name=spowolniony
actors.buffs.snipersmark.action_name_snapshot=migawka
actors.buffs.snipersmark.action_name_sniper=strzał snajperski
actors.buffs.snipersmark.action_name_volley=salwa
actors.buffs.snipersmark.desc=Snajperka jest skupiona na celu, który ostatnio zaatakowała. Może wykonać specjalny atak swoim łukiem, który będzie się różnić w zależności od tego, jak łuk jest ulepszony.\n\nNieulepszony łuk wystrzeli _strzał migawkowy_, który zadaje zmniejszone obrażenia, ale wystrzelenie go nie zajmuje dużo czasu.\n\nŁuk ulepszony pod kątem szybkości wystrzeli _salwę_ trzech strzał. Każda strzała zada zmniejszone obrażenia, ale nadal może aktywować zaklęcie. Wystrzelenie tej salwy zajmuje 1 turę.\n\nŁuk ulepszony pod kątem obrażeń wystrzeli _strzał snajperski_. Ten strzał z pewnością trafi, zadaje dodatkowe obrażenia zależne od odległości od celu i wystrzelenie go zajmuje 2 tury.\n\nPozostało tur: %s.
actors.buffs.snipersmark.name=znak snajpera
actors.buffs.soulmark.desc=Czarnoksiężnik dotarł do duszy tego stworzenia, co pozwala mu leczyć się, gdy odnosi obrażenia fizyczne.\n\nPozostała liczba tur znaku duszy: %s.
actors.buffs.soulmark.name=naznaczony duszą
actors.buffs.stamina.desc=Posiadasz nieskończoną wytrzymałość, co pozwala na szybsze poruszanie się!\n\nPodczas działania wytrzymałości będziesz biec z prędkością +50%%, ale wszystkie inne czynności będziesz wykonywać z normalną prędkością.\n\nPozostała liczba tur wytrzymałości: %s.
actors.buffs.stamina.name=wytrwałość
actors.buffs.terror.desc=Terror to magia manipulacyjna, która wpędza cel w niekontrolowaną panikę.\n\nPrzerażone postacie są zmuszone uciekać przed przeciwnikiem, próbując oddzielić się jak największą liczbą drzwi i ścian. Jednak szok bólu skróci czas trwania terroru.\n\nPozostałe tury terroru: %s.
actors.buffs.terror.name=przerażony
actors.buffs.toxicimbue.desc=Jesteś przesiąknięty trującą energią!\n\nGdy się poruszasz, toksyczny gaz będzie stale wydobywał się z ciebie, raniąc twoich wrogów. Jesteś odporny na toksyczny gaz i truciznę przez czas trwania efektu, a także przez kilka tur po jego zakończeniu.\n\nLiczba tur pozostałego toksycznego nasycenia: %s.
actors.buffs.toxicimbue.name=przesiąknięty toksycznością
actors.buffs.vertigo.desc=Chodzenie po linii prostej może być trudne, gdy cały świat się kręci.\n\nPodczas działania zawrotów głowy postacie próbujące się poruszyć pójdą w losowym kierunku, zamiast w zamierzonym.\n\nPozostałe obroty zawrotów głowy: %s.
actors.buffs.vertigo.name=zawrót głowy
actors.buffs.vulnerable.desc=Magia podatności zwiększa wszystkie obrażenia fizyczne otrzymywane przez postać o 33%%, po czym obrażenia te zostaną zmniejszone przez pancerz.\n\nLiczba tur pozostałej podatności: %s.
actors.buffs.vulnerable.heromsg=Czujesz się kruchy!
actors.buffs.vulnerable.name=wrażliwy
actors.buffs.wandempower.desc=Twoje różdżki zadające obrażenia zostały wzmocnione, zwiększając ilość zadawanych obrażeń na kilka trafień.\n\nDodatkowe obrażenia: %1$d.\nPozostałe trafienia: %2$d.
actors.buffs.wandempower.name=różdżki wzmocnione
actors.buffs.weakness.desc=Nagle wszystko wydaje się o wiele cięższe.\n\nOsłabiająca magia zmniejsza siłę fizyczną postaci, sprawiając, że zadaje ona o 33%% mniejsze obrażenia.\n\nPozostała liczba tur osłabienia: %s.
actors.buffs.weakness.heromsg=Czujesz się osłabiony!
actors.buffs.weakness.name=osłabiony
actors.buffs.wellfed.desc=Czujesz się bardzo nasycony i pełny.\n\nGdy jesteś najedzony, twój głód nie wzrośnie, a z czasem odzyskasz dodatkową ilość zdrowia.\n\nPozostało tur: %d.
actors.buffs.wellfed.name=dobrze odżywiony
actors.char.def_verb=uniknął
actors.char.def_verb_blocked=zablokowany
actors.char.defeat=pokonałeś %s.
actors.char.immune=odporny
actors.char.invulnerable=niewrażliwy
actors.char.kill=%s cię zabił...
actors.hero.abilities.armorability.cost=Koszt opłaty: _%d_
actors.hero.abilities.armorability.no_target=Nie ma tam nic, w co można by celować!
actors.hero.abilities.armorability.prompt=Wybierz lokalizację docelową
actors.hero.abilities.armorability.self_target=Nie możesz celować w siebie!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Z ciała Kleryka emanuje promienista energia. W tej formie Kleryk zyskuje 2 punkty zasięgu ataku (dzięki promieniującej z niego świętej energii) oraz 10 punktów osłony za każdym razem, gdy zużyje ładunek świętej księgi. Może również rzucać zaklęcia odblokowywane za pomocą talentów Wzniesionej Formy.\n\nTarcza zapewniana przez Wzniesioną Formę i jej zaklęcia nie zanika normalnie, ale natychmiast znika po zakończeniu Wzniesionej Formy.\n\nAktualna osłona: %1$d.\nPozostałe tury: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=wzniesiona forma
actors.hero.abilities.cleric.ascendedform.desc=Kapłan emituje z siebie świętą energię, przybierając wydłużoną, promienną formę na 10 tur. W tej formie może rzucać nowe zaklęcia, zyskuje 2 punkty zasięgu ataku, 30 punktów osłony, a każde dodatkowe zaklęcie zapewni 10 punktów osłony za każdy zużyty ładunek świętej księgi.\n\nOsłona z wniebowstąpionej formy i jej zaklęć nie zanika normalnie, ale natychmiast znika po zakończeniu wniebowstąpionej formy. Zdolność można ponownie wykorzystać do odświeżenia czasu trwania wniebowstąpionej formy.
actors.hero.abilities.cleric.ascendedform.name=wzniesiona forma
actors.hero.abilities.cleric.ascendedform.short_desc=Kapłan przybiera _Wzniesioną Formę_, zyskując nowe zaklęcia, zasięg ataku i osłony.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Kopia jednego z towarzyszy przygód Kleryka, wykonana z litego światła. Choć ma kształt innego bohatera, nie posiada żadnej z jego unikalnych zdolności. Ten sojusznik będzie istniał tak długo, jak długo będzie na niego działać Moc Wielu.\n\nTego sojusznika można nakierować bez żadnych kosztów, ponownie używając zdolności pancerza Moc Wielu.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Twój sojusznik rusza do ataku!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Twój sojusznik ustawia się w tym miejscu.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Twój sojusznik podąża za tobą.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Postać tę można znaleźć z określoną umiejętnością pancerza bohatera.
actors.hero.abilities.cleric.powerofmany$lightally.name=lekki sojusznik
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Ten sojusznik został wzmocniony Mocą Wielu, co zapewnia mu +25%% obrażeń zadawanych i -25%% obrażeń otrzymywanych. Będzie również dzielić zasięg widzenia z Klerykiem i będzie mógł korzystać z zaklęć Mocy Wielu. \n\nMoc Wielu będzie działać, gdy sojusznicy, tacy jak pryzmatyczne obrazy, się ukryją, ale jej czas trwania będzie nadal odliczany. \n\nPozostałe tury: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=moc wielu
actors.hero.abilities.cleric.powerofmany.ally_exists=Masz już silnego sojusznika.
actors.hero.abilities.cleric.powerofmany.desc=Kapłan używa _Mocy Wielu_, która wzmacnia istniejącego sojusznika lub tworzy nowego, wzmocnionego na 100 tur. Celowanie w puste miejsce tworzy nowego sojusznika.\n\nPodczas działania Mocy Wielu, każdy sojusznik zadaje +25% obrażeń, otrzymuje -25% obrażeń i dzieli się swoją wizją z Kapłanem. Zyskuje również 25 pkt. tarczy po użyciu tej umiejętności.\n\nKapłan zyskuje również trzy nowe zaklęcia, które można rzucać tylko ze wzmocnionym sojusznikiem. Moc Wielu nie kończy się, gdy jedno z tych zaklęć jest aktywne.
actors.hero.abilities.cleric.powerofmany.name=moc wielu
actors.hero.abilities.cleric.powerofmany.no_vision=Nie możesz wybrać lokalizacji, której nie widzisz.
actors.hero.abilities.cleric.powerofmany.only_allies=Możesz wzmocnić tylko sojuszników.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Skieruj swojego jasnego sojusznika
actors.hero.abilities.cleric.powerofmany.prompt_default=Wybierz sojusznika lub lokalizację
actors.hero.abilities.cleric.powerofmany.short_desc=Kapłan wykorzystuje _Moc Wielu_, wzmacniając istniejącego sojusznika lub tworząc nowego.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Przypisz do formy ciała
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Przypisz do formy umysłu
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Przypisz do formy duchowej
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Wybierz efekt, który chcesz dodać do Trinity. Dodatkowe informacje zostaną wyświetlone przed potwierdzeniem.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Postać ciała: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Forma umysłu: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Forma ducha: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Wybierz formę Trójcy, której chcesz użyć. Efekty różnych form mogą być aktywne jednocześnie.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity zastosuje zdalny efekt alchemiczny tego artefaktu za cenę ładunku _%2$s._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity zastosuje pasywny efekt regeneracji zdrowia tego artefaktu z szybkością _+%1$d_ przez 20 tur, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.cost=Koszt ładowania tej umiejętności jest różny, ale najczęściej wynosi _%d._
actors.hero.abilities.cleric.trinity.desc=Kapłan zyskuje _Trójcę_ zdolności pancerza, które można przypisać do różnych efektów przedmiotów za pomocą trzech nowych zaklęć. Każde z tych zaklęć koncentruje się na emulowaniu efektów różnych rodzajów ekwipunku, które Kapłan zidentyfikował podczas tej rozgrywki: formy ciała (broń i zbroja), formy umysłu (różdżki i broń rzucana) oraz formy ducha (pierścienie i artefakty).\n\nKażda forma Trójcy może zostać nasycona jednym efektem na raz, a Kapłan wybiera, który z nich aktywować podczas korzystania z Trójcy. Trójca nie powieli efektu czegoś, co już posiadasz.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity wykorzysta efekt tego artefaktu, aby przywołać spaczonego przyjaznego ducha o PW ducha _+%1$d_, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity zastosuje ten efekt na _%1$d tur_ kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity zastosuje efekt rzucania łańcuchowego tego artefaktu z zasięgiem _+%1$d_, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity zastosuje efekt przekąskowy tego artefaktu kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity zastosuje efekt rabunku wroga tego artefaktu w momencie _+%1$d_, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.name=trójca
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity nie może powielić efektu, który już posiadasz!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity nie ma obecnie żadnego zestawu efektów dla żadnej ze swoich form, użyj któregoś z jej zaklęć!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity zastosuje ten _potężny_ efekt przez _%1$d tur_ kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.ring_use=Trinity zastosuje efekt tego pierścienia na poziomie _+%1$d_ przez 20 tur, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity zastosuje główny efekt tego artefaktu za pomocą losowego szkodliwego ziarna, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.short_desc=Duchowny zyskuje _Trójcę_ umiejętności, które naśladują wyposażenie, jakie widział, i które można przypisać za pomocą nowych zaklęć.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity zastosuje efekt wstawiania tego artefaktu kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity zastosuje efekt wróżenia tego artefaktu w momencie _+%1$d_, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity rzuci tą bronią w _+%1$d_ kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity zastosuje efekt zamrożenia czasu tego artefaktu na czas trwania _%1$d_ tury, kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity zastosuje losowy efekt przewijania tego artefaktu z szansą _%1$d/10_ na zaoferowanie egzotycznej wersji bez dodatkowych kosztów, za opłatą _%2$s._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity będzie ładować tę różdżkę _wieloładunkową_ z prędkością _+%1$d_ kosztem ładunku _%2$s._
actors.hero.abilities.cleric.trinity.wand_use=Trinity zniszczy tę różdżkę z szybkością _+%1$d_ kosztem ładunku _%2$s._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Ta postać bierze udział w pojedynku. Ona i jej sojusznicy lub słudzy mogą działać normalnie, podczas gdy inni są zamrożeni.\n\nPojedynek będzie trwał określony czas, aż jeden z uczestników zginie lub oddali się od siebie o więcej niż 5 pól.\n\nPozostałe tury: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=uczestnik pojedynku
actors.hero.abilities.duelist.challenge.ally_target=Możesz wyzywać tylko wrogów.
actors.hero.abilities.duelist.challenge.already_dueling=Możesz brać udział tylko w jednym pojedynku na raz.
actors.hero.abilities.duelist.challenge.desc=Duelistka wyzywa pobliskiego przeciwnika na pojedynek. Przeciwnik jest zmuszony walczyć z nią, podczas gdy wszyscy pozostali przeciwnicy zostają tymczasowo zamrożeni w czasie.\n\nCel musi być osiągalny i znajdować się w odległości do 5 pól od Duelistki. Pojedynek trwa do momentu, aż upłynie 10 tur, wróg zginie lub Duelistka znajdzie się w odległości co najmniej 5 pól od przeciwnika.\n\nZamrożeni przeciwnicy są niezniszczalni. Sojusznicy Duelistki nie zostają zamrożeni przez tę umiejętność, ale jeśli boss zostanie zaatakowany, jego słudzy również nie zostaną zamrożeni.
actors.hero.abilities.duelist.challenge.distant_target=Ten wróg jest zbyt daleko, by rzucić mu wyzwanie.
actors.hero.abilities.duelist.challenge.name=wyzwanie
actors.hero.abilities.duelist.challenge.prompt=Wybierz wroga, któremu chcesz rzucić wyzwanie
actors.hero.abilities.duelist.challenge.short_desc=Duelista _wyzywa_ pobliskiego wroga na pojedynek, tymczasowo zamrażając wszystkich pozostałych wrogów.
actors.hero.abilities.duelist.challenge.unreachable_target=Musisz być w stanie osiągnąć swój cel.
actors.hero.abilities.duelist.elementalstrike.desc=Duelist atakuje wroga lub miejsce, wykonując standardowy atak, który gwarantuje trafienie i rozprzestrzenia magiczny efekt, który rozprzestrzenia się na obszar do 4 pól w stożku o kącie 65 stopni. Ten magiczny efekt zmienia się w zależności od zaklęcia na głównej broni Duelisty.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Elementarne uderzenie bez zaklęcia uwolni małą eksplozję magii, która zada 6-12 obrażeń wszystkim wrogom w zasięgu.
actors.hero.abilities.duelist.elementalstrike.name=uderzenie żywiołów
actors.hero.abilities.duelist.elementalstrike.short_desc=Duelistka wykonuje _Uderzenie Żywiołów_, rozprzestrzeniając efekt na stożkowym obszarze działania, który zależy od zaklęcia jej broni.
actors.hero.abilities.duelist.feint.bad_location=Nie możesz przenieść się do tej lokalizacji.
actors.hero.abilities.duelist.feint.desc=Duelistka udaje atak, skacząc na sąsiednie pole, pozostawiając za sobą chwilowy obraz. Przeciwnicy, którzy atakowali Duelistkę, zaatakują zamiast niego jej obraz. \n\nWrogowie atakujący obraz zostają zdezorientowani, co anuluje ich kolejną akcję i naraża ich na atak z zaskoczenia.
actors.hero.abilities.duelist.feint.name=zwód
actors.hero.abilities.duelist.feint.prompt=Wybierz miejsce, do którego chcesz się udać
actors.hero.abilities.duelist.feint.short_desc=Duelistka _Feints_, udając atak, jednocześnie doskakując do sąsiedniego pola. Wrogowie będą atakować jej powidok, wystawiając się na kontratak.
actors.hero.abilities.duelist.feint.too_far=Ta lokalizacja nie znajduje się w pobliżu Twojego miejsca zamieszkania.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Łowczyni zostaje na krótko wzmocniona, co zwiększa jej prędkość ruchu i szybkość ataku łukiem.\n\nPozostałe tury: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=moc natury
actors.hero.abilities.huntress.naturespower.desc=Łowczyni tymczasowo wzmacnia siebie i swój łuk mocą natury! Trwa to 8 tur.\n\nW tym czasie Łowczyni porusza się z dwukrotnie większą prędkością i atakuje łukiem o 33% szybciej. Bonusowe efekty łuku nie aktywują się, gdy Snajperka używa swoich ataków specjalnych.
actors.hero.abilities.huntress.naturespower.name=moc natury
actors.hero.abilities.huntress.naturespower.short_desc=Łowczyni wzywa _Moc Natury_, która na krótko zwiększa jej prędkość ruchu i szybkostrzelność łuku.
actors.hero.abilities.huntress.spectralblades.desc=Łowczyni ciska widmowym ostrzem we wroga, co działa jak atak dystansowy jej bronią białą. Aktywowane zostaną wszystkie normalne efekty broni białej, w tym zaklęcia.
actors.hero.abilities.huntress.spectralblades.name=ostrza widmowe
actors.hero.abilities.huntress.spectralblades.short_desc=Łowczyni rzuca w cel _Widmowymi Ostrzami_, zadając obrażenia zależne od aktualnie używanej przez nią broni białej.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Magiczny jastrząb, przywołany przez Łowczynię. Świeci jasnym, eterycznym błękitem, a jego głowa nieustannie obraca się, gdy rozgląda się po okolicy.\n\nChociaż nie jest wybitnym wojownikiem, jego szybkość i dobry wzrok sprawiają, że doskonale nadaje się do zwiadu i odwracania uwagi wrogów.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Pozostałe gwarantowane uniki: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Pozostałe rundy: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Twój jastrząb rusza do ataku!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Twój jastrząb przesuwa się do tej pozycji.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Twój jastrząb podąża za tobą.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Postać tę można znaleźć z określoną umiejętnością pancerza bohatera.
actors.hero.abilities.huntress.spirithawk$hawkally.name=jastrząb duchowy
actors.hero.abilities.huntress.spirithawk.desc=Łowczyni przywołuje ducha jastrzębia, którym można kierować, ponownie używając tej umiejętności podczas przywołania. Jastrząb utrzymuje się przez 100 tur, a kierowanie nim nie kosztuje żadnych opłat.\n\nJastrząb ma minimalne zdrowie i siłę ataku, ale jest szybki, unikliwy i celny. Przez cały czas dzieli całe pole widzenia z Łowczynią. Jest odporny na wszystkie efekty obszarowe, takie jak ogień i gaz trujący. Nie zaatakuje, jeśli nie otrzyma specjalnego polecenia.
actors.hero.abilities.huntress.spirithawk.name=jastrząb duchowy
actors.hero.abilities.huntress.spirithawk.no_space=Nie ma wolnego miejsca w Twojej okolicy.
actors.hero.abilities.huntress.spirithawk.short_desc=Łowczyni przywołuje chowańca _Spirit Hawk_, który może pomóc jej w zwiadach i odwracaniu uwagi wrogów.
actors.hero.abilities.mage.elementalblast.desc=Mag emituje eksplozję magii, która pokrywa obszar o promieniu do 4 pól i zadaje do 15-25 punktów obrażeń. Konkretny efekt eksplozji żywiołów będzie się różnić w zależności od różdżki, w którą wyposażony jest Mag.
actors.hero.abilities.mage.elementalblast.generic_desc=Efekt żywiołowego wybuchu będzie podobny do efektu różdżki użytej do trafienia wroga lub sojusznika.
actors.hero.abilities.mage.elementalblast.name=żywiołowy wybuch
actors.hero.abilities.mage.elementalblast.no_staff=Nie możesz używać tej umiejętności bez swojej laski.
actors.hero.abilities.mage.elementalblast.short_desc=Mag emituje ze swojej laski _Elementarną Eksplozję_, która pokrywa duży obszar wokół niego, a jej efekt różni się w zależności od rodzaju różdżki w lasce.
actors.hero.abilities.mage.warpbeacon.depths=Nie można przemieszczać się między głębinami!
actors.hero.abilities.mage.warpbeacon.desc=Mag umieszcza nadajnik, do którego może się teleportować w dowolnym momencie. Umieszczenie nadajnika zajmuje 1 turę, ale teleportacja jest natychmiastowa.\n\nMag nie może domyślnie teleportować się między piętrami ani używać nadajnika, aby dotrzeć do niedostępnych miejsc, takich jak zamknięte pokoje. Mag może teleportować się do wrogów, co ich odpycha.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Nie można tam umieścić sygnalizatora!
actors.hero.abilities.mage.warpbeacon.locked_floor=Nie możesz opuścić zamkniętego piętra!
actors.hero.abilities.mage.warpbeacon.name=latarnia osnowy
actors.hero.abilities.mage.warpbeacon.short_desc=Mag umieszcza _Sygnał Przeniesienia_ w swoim obecnym położeniu, do którego może się natychmiast teleportować.
actors.hero.abilities.mage.warpbeacon.too_far=To miejsce jest za daleko!
actors.hero.abilities.mage.warpbeacon.window_cancel=anulować
actors.hero.abilities.mage.warpbeacon.window_clear=jasny sygnał
actors.hero.abilities.mage.warpbeacon.window_desc=Twój sygnalizator znajduje się obecnie na piętrze %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportacja do latarni morskiej
actors.hero.abilities.mage.wildmagic.desc=Mag uwalnia moc ze swoich różdżek, losowo wystrzeliwując je do 4 razy w jednej turze. Laska maga nie jest objęta tym efektem.\n\nKażda różdżka ma również poziom zwiększony o 2, maksymalnie +3. Ta zdolność zużywa połowę ładunku różdżki na każde trafienie, a żadna różdżka nie może zostać wystrzelona więcej niż 2 razy.
actors.hero.abilities.mage.wildmagic.name=dzika magia
actors.hero.abilities.mage.wildmagic.no_wands=Nie masz różdżek, żeby nimi razić!
actors.hero.abilities.mage.wildmagic.short_desc=Mag uwalnia _Dziką Magię_ zawartą w swoich różdżkach, strzelając nimi wielokrotnie w losowo wybrany cel w ciągu jednej tury.
actors.hero.abilities.ratmogrify$transmograt.desc=Ten wróg przemienił się w szczura. Moim zdaniem, to duża poprawa! - Król Szczurów
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Zabity przez: wyniszczonego wroga
actors.hero.abilities.ratmogrify.cant_transform=Tego nie da się ratmogryfikować!
actors.hero.abilities.ratmogrify.desc=Bohater przemienia wroga w szczura na 6 tur! Bossowie, sojusznicy i szczury nie mogą zostać przemienieni w szczura.\n\nPrzemienieni wrogowie zachowują swoje pierwotne statystyki, ale nie mają żadnych umiejętności.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=Bohater _Ratmogryfikuje_ wroga! To tymczasowo zamienia go w szczura bez żadnych zdolności.
actors.hero.abilities.ratmogrify.too_strong=Ten wróg jest zbyt silny, by go unicestwić!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Ten wróg został oznaczony, przez co otrzymuje dodatkowe 25%% obrażeń, ale także nie może umrzeć, dopóki oznaczenie nie przestanie działać.\n\nPozostałe tury: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=naznaczony śmiercią
actors.hero.abilities.rogue.deathmark.ally_target=Możesz oznaczać tylko wrogów
actors.hero.abilities.rogue.deathmark.desc=Łotrzyk umieszcza znak na wybranym wrogu, powodując, że otrzymuje on o 25% więcej obrażeń. Znak jest nakładany natychmiast i utrzymuje się przez 5 tur.\n\nOznaczeni wrogowie otrzymują dodatkowe obrażenia, ale nie mogą umrzeć, dopóki znak nie wygaśnie. Jeśli wróg ma 0 PW w momencie zakończenia działania znaku, natychmiast umiera.
actors.hero.abilities.rogue.deathmark.name=znak śmierci
actors.hero.abilities.rogue.deathmark.short_desc=Łotrzyk umieszcza _Znak Śmierci_ na wybranym wrogu. Oznaczeni wrogowie otrzymują dodatkowe obrażenia, ale nie mogą umrzeć, dopóki znak nie zniknie.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Kopia Rogue, stworzona z mrocznej ciemności. Stoi nieruchomo, z pustymi oczami i maleńkimi smugami mroku unoszącymi się niczym para.\n\nKlon nie jest idealną kopią Rogue, ale wciąż jest niezłym wojownikiem i może skorzystać z wyposażenia Rogue, mając odpowiednie talenty.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Twój klon rusza do ataku!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Twój klon przesuwa się do tej pozycji.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Twój klon podąża za tobą.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Postać tę można znaleźć z określoną umiejętnością pancerza bohatera.
actors.hero.abilities.rogue.shadowclone$shadowally.name=łotrzyk cienia
actors.hero.abilities.rogue.shadowclone.desc=Łotrzyk przywołuje cienistą imitację samego siebie, którą można skierować do pomocy w walce. Skierowanie cienistego klona nie kosztuje żadnych opłat.\n\nKlon ma 80 punktów zdrowia, nie posiada pancerza i zadaje 10-20 obrażeń. Wszystkie te cechy można ulepszyć za pomocą talentów, dzięki czemu klon korzysta z broni i pancerza bohatera.
actors.hero.abilities.rogue.shadowclone.name=klon cienia
actors.hero.abilities.rogue.shadowclone.short_desc=Łotrzyk przywołuje _Klon Cienia_, który może pomóc mu w walce.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=W jakiś sposób wrogowie łatwo dają się przekonać, że ten drewniany wabik to prawdziwy Łotr!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Postać tę można znaleźć z określoną umiejętnością pancerza bohatera.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=drewniana przynęta
actors.hero.abilities.rogue.smokebomb.desc=Łotr rzuca bombę dymną i migocze w promieniu do 6 pól. Może migotać przez zagrożenia i wrogów, ale nie przez twardy teren, taki jak ściany.\n\nWrogowie sąsiadujący ze starą pozycją Łotra zostaną oślepieni na 5 tur.
actors.hero.abilities.rogue.smokebomb.fov=Możesz przeskoczyć wyłącznie do pustej lokalizacji w swoim polu widzenia.
actors.hero.abilities.rogue.smokebomb.name=bomba dymna
actors.hero.abilities.rogue.smokebomb.prompt=Wybierz lokalizację, do której chcesz przejść
actors.hero.abilities.rogue.smokebomb.short_desc=Rogue rzuca _Bombę Dymną_, mrugając. Oślepia wrogów w pobliżu swojej poprzedniej lokalizacji.
actors.hero.abilities.warrior.endure$enduretracker.desc=Wojownik zadaje teraz dodatkowe obrażenia w zależności od otrzymanych obrażeń.\n\nDodatkowe obrażenia: %1$d\nPozostałe trafienia: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=wytrzymałość
actors.hero.abilities.warrior.endure.desc=Wojownik wytrzymuje przez 3 tury, otrzymując połowę obrażeń ze wszystkich źródeł. Redukcja ta jest stosowana przed efektami odporności na obrażenia, takimi jak pancerz.\n\nPo wytrzymywaniu, kolejne uderzenie wojownika w ciągu 10 tur zyskuje premię do obrażeń. Ta premia do obrażeń jest równa połowie wszystkich obrażeń zadanych mu podczas wytrzymywania, przed efektami redukcji obrażeń!\n\nJeśli Wojownik ma jakąkolwiek kombinację, użycie tej zdolności wydłuża pozostały czas o 3 tury.
actors.hero.abilities.warrior.endure.name=wytrzymać
actors.hero.abilities.warrior.endure.short_desc=Wojownik _Wytrzymuje_, pomijając kilka tur, ale zyskując wysoką odporność na obrażenia. Następnie zadaje dodatkowe obrażenia w zależności od tego, co wytrzymał.
actors.hero.abilities.warrior.heroicleap.desc=Wojownik skacze w kierunku wyznaczonego miejsca, pokonując wrogów i przeszkody na swojej drodze. Nie może jednak przeskakiwać przez mury ani inne twarde tereny.
actors.hero.abilities.warrior.heroicleap.name=bohaterski skok
actors.hero.abilities.warrior.heroicleap.prompt=Wybierz kierunek skoku
actors.hero.abilities.warrior.heroicleap.short_desc=Wojownik wykonuje _Heroiczny Skok_ w kierunku wskazanego miejsca, przelatując ponad wrogami i zagrożeniami.
actors.hero.abilities.warrior.shockwave.desc=Wojownik uderza w ziemię, wytwarzając falę uderzeniową, która przemieszcza się na odległość do 5 pól w stożku o kącie 60 stopni. \n\n Przeciwnicy objęci tą falą uderzeniową zostają okaleczeni na 5 tur. Otrzymują również 5-10 punktów obrażeń, plus dodatkowe 1-2 punkty obrażeń za każdy punkt siły Wojownika powyżej 10.
actors.hero.abilities.warrior.shockwave.name=fala uderzeniowa
actors.hero.abilities.warrior.shockwave.short_desc=Wojownik uwalnia falę uderzeniową o stożkowym obszarze działania, uderzając w ziemię. Przeciwnicy objęci falą uderzeniową otrzymują obrażenia i zostają okaleczeni.
actors.hero.hero.key_distracted=Nie możesz otworzyć zamka, musisz próbować dalej.
actors.hero.hero.leave=Nie możesz jeszcze wyjść, reszta lochu czeka na Ciebie poniżej!
actors.hero.hero.level_cap=Nie możesz stać się silniejszy, ale doświadczenia dają ci przypływ mocy!
actors.hero.hero.level_up=Podnieść do właściwego poziomu!
actors.hero.hero.locked_chest=Ta skrzynia jest zamknięta, a ty nie masz pasującego klucza.
actors.hero.hero.locked_door=Nie masz pasującego klucza.
actors.hero.hero.name=Ty
actors.hero.hero.new_level=Awans! +Celność, +Uniki, +5 PW!
actors.hero.hero.new_talent=+1 punkt talentu!
actors.hero.hero.noticed_smth=Zauważyłeś coś.
actors.hero.hero.pain_resist=Ból pomaga oprzeć się chęci zaśnięcia.
actors.hero.hero.revive=Ankh eksploduje życiodajną energią!
actors.hero.hero.search=szukaj
actors.hero.hero.search_distracted=Trudno się skoncentrować, szukanie jest męczące.
actors.hero.hero.unspent=Masz niewykorzystane punkty talentu!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=nie możesz nosić: %s.
actors.hero.hero.you_now_have=odebrałeś: %s.
actors.hero.heroclass.cleric=duchowny
actors.hero.heroclass.cleric_desc=Kapłan zaczyna z _unikalną świętą księgą_, której może używać do rzucania różnych zaklęć.\n\nWiększość talentów Kapłana skupia się na nauce i ulepszaniu zaklęć.\n\nKapłan zaczyna również z _pałką_, zbroją materiałową, bukłakiem na wodę i aksamitnym woreczkiem.\n\nKapłan automatycznie identyfikuje:\n_-_ Zwoje identyfikacji\n_-_ Mikstury czystości\n_-_ Zwoje usunięcia klątwy
actors.hero.heroclass.cleric_desc_short=Kapłan to boski czarodziej, który używa swojej unikalnej _świętej księgi_ do przewodzenia boskiej magii. Może _uczyć się i ulepszać zaklęcia_ za pomocą talentów.
actors.hero.heroclass.cleric_unlock=Aby odblokować Kleryka, _całkowicie oczyść klątwę z dowolnego elementu przeklętego wyposażenia._
actors.hero.heroclass.duelist=pojedynkujący się
actors.hero.heroclass.duelist_desc=Duelista rozpoczyna grę z _unikalnym rapierem_ ze specjalną umiejętnością, która odnawia się z czasem.\n\nKażda broń w grze ma _inną specjalną umiejętność_, której Duelista może używać.\n\nDuelista rozpoczyna grę również z _dwoma kolcami do rzucania_, zbroją materiałową, bukłakiem na wodę i aksamitnym woreczkiem.\n\nDuelista automatycznie identyfikuje:\n_-_ Zwoje identyfikacji\n_-_ Mikstury siły\n_-_ Zwoje odbicia lustrzanego
actors.hero.heroclass.duelist_desc_short=Duelistka to mistrzyni broni, która może użyć swojej broni, aby aktywować _specjalną umiejętność broni._ Ta specjalna umiejętność jest _inna dla każdej broni._
actors.hero.heroclass.duelist_unlock=Aby odblokować Duelistę, _wyposaż się w broń 2. lub wyższego poziomu bez kary do siły._
actors.hero.heroclass.huntress=łowczyni
actors.hero.heroclass.huntress_desc=Łowczyni zaczyna z _unikalnym łukiem duchowym_, który może wystrzelić nieskończoną liczbę wyczarowanych strzał.\n\nŁowczyni może poruszać się przez wysoką trawę _bez jej deptania_.\n\nŁowczyni zaczyna również z _rękawicami nabijanymi ćwiekami_, zbroją z tkaniny, bukłakiem na wodę i aksamitnym woreczkiem.\n\nŁowczyni automatycznie identyfikuje:\n_-_ Zwoje identyfikacji\n_-_ Mikstury wizji umysłu\n_-_ Zwoje kołysanki
actors.hero.heroclass.huntress_desc_short=Łowczyni jest mistrzynią w posługiwaniu się bronią miotaną i ma _magiczny łuk_ z nieskończonym zapasem strzał. Potrafi też przemierzać wysoką trawę _bez jej deptania_.
actors.hero.heroclass.huntress_unlock=Aby odblokować Łowczynię, _traf wrogów rzucaną bronią 10 razy w jednej grze._
actors.hero.heroclass.mage=mag
actors.hero.heroclass.mage_desc=Mag rozpoczyna grę z _unikalną laską_, która ładuje się znacznie szybciej niż różdżka i ma o 1 ładunek więcej. Laska _może zostać nasycona dowolną różdżką_, którą Mag znajdzie w lochu.\n\nMag rozpoczyna grę również z _różdżką magicznego pocisku_ nasyconą w lasce, płócienną zbroją, bukłakiem na wodę i aksamitnym woreczkiem.\n\nMag automatycznie identyfikuje:\n_-_ Zwoje Identyfikacji\n_-_ Mikstury Płynnego Płomienia\n_-_ Zwoje Ulepszenia
actors.hero.heroclass.mage_desc_short=Mag jest ekspertem w dziedzinie magii i nosi _magiczny kostur_, który jest potężniejszy niż różdżka. Kostur można _nasycić dowolną różdżką_, którą znajdzie Mag.
actors.hero.heroclass.mage_unlock=Aby odblokować Maga, _użyj zwoju ulepszenia, aby wzmocnić przedmiot._
actors.hero.heroclass.rogue=łobuz
actors.hero.heroclass.rogue_desc=Łotr zaczyna z _unikalnym Płaszczem Cienia_, którego może użyć, aby stać się niewidzialnym na żądanie.\n\nŁotr może _wykrywać sekrety i pułapki_ z większej odległości.\n\nŁotr zaczyna również z _sztyletem_, _trzema nożami do rzucania_, zbroją materiałową, bukłakiem na wodę i aksamitnym woreczkiem.\n\nŁotr automatycznie identyfikuje:\n_-_ Zwoje Identyfikacji\n_-_ Mikstury Niewidzialności\n_-_ Zwoje Mapowania Magii
actors.hero.heroclass.rogue_desc_short=Łotrzyk może unikać wrogów i atakować z niewidzialności, korzystając ze swojego _płaszcza cieni_. Potrafi również _wykrywać sekrety i pułapki_ z większej odległości.
actors.hero.heroclass.rogue_unlock=Aby odblokować Łotrzyka, wykonaj 10 ataków z zaskoczenia w jednej grze.
actors.hero.heroclass.warrior=wojownik
actors.hero.heroclass.warrior_desc=Wojownik rozpoczyna grę z _unikalną złamaną pieczęcią_, która zapewnia mu zwiększoną ochronę, gdy jego zdrowie spadnie poniżej połowy. Pieczęć można przenosić między pancerzami i _przenieść jedno ulepszenie_.\n\nWojownik rozpoczyna grę również z _zużytym krótkim mieczem_, _trzema kamieniami do rzucania_, zbroją materiałową, bukłakiem na wodę i aksamitnym woreczkiem.\n\nWojownik automatycznie rozpoznaje:\n_-_ Zwoje Identyfikacji\n_-_ Mikstury Leczenia\n_-_ Zwoje Gniewu
actors.hero.heroclass.warrior_desc_short=Wojownik otrzymuje dodatkowe obrażenia dzięki tarczy zapewnianej przez _złamaną pieczęć_. Pieczęć można przenosić między pancerzami i _przenosi ona pojedyncze ulepszenie._
actors.hero.heroclass.warrior_unlock=Wojownik odblokowuje się automatycznie.
actors.hero.herosubclass.assassin=morderca
actors.hero.herosubclass.assassin_desc=Zabójca przygotowuje się do kolejnego ataku, stając się niewidzialny. Im dłużej się przygotowuje, tym potężniejszy będzie jego kolejny atak. Przygotowanie kumuluje się do 9 tur. \n\nPo przygotowaniu Zabójca zadaje dodatkowe obrażenia do kolejnego ataku, może mrugnąć do celu, a nawet natychmiast zabić wystarczająco słabych wrogów.
actors.hero.herosubclass.assassin_short_desc=_Zabójca_ może przygotować śmiercionośny atak, będąc niewidzialnym. Im dłużej czeka, tym potężniejszy będzie atak.
actors.hero.herosubclass.battlemage=mag bitewny
actors.hero.herosubclass.battlemage_desc=Mag Bitewny zyskuje efekt bonusowy za każdym razem, gdy uderza w walce wręcz swoją laską, tak jakby jego laska miała dodatkowe zaklęcie. Efekty te zależą od różdżki, którą nasączona jest jego laska – każda różdżka ma swój własny efekt. Oprócz efektów różdżki, laska Maga Bitewnego zyskuje również 0,5 ładunku za każdym razem, gdy nią uderza.
actors.hero.herosubclass.battlemage_short_desc=_Mag Bitewny_ przywołuje efekty bonusowe podczas walki wręcz za pomocą swojej laski. Efekty te zależą od różdżki, którą nasączony jest jej kostur.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=Berserker nabiera szału, gdy otrzymuje obrażenia fizyczne, w tym obrażenia blokowane przez jego pancerz! Szał stopniowo zanika z czasem, ale wolniej, gdy ma mało HP. \n\n Szał może sprawić, że Berserker zada do 50% obrażeń. Przy maksymalnym szale może wpaść w szał, zyskując natychmiastową ochronę i utrzymując szał tak długo, jak długo ma jeszcze osłonę. Osłona skaluje się z poziomem pancerza berserkera i może zostać znacznie wzmocniona, gdy ma mało zdrowia. Berserker potrzebuje czasu na regenerację po wpadnięciu w szał.
actors.hero.herosubclass.berserker_short_desc=_Berserker_ nabiera wściekłości w miarę otrzymywania obrażeń. Wściekłość zwiększa zadawane przez niego obrażenia i można ją aktywować przy 100%, aby uzyskać premię do tarczy.
actors.hero.herosubclass.champion=mistrz
actors.hero.herosubclass.champion_desc=Czempionka to mistrzyni broni białej, która oprócz broni głównej może wyposażyć się w broń dodatkową. Jej standardowe ataki wykorzystują broń główną, ale może natychmiast zamienić ją na inną i użyć umiejętności dowolnej z tych broni. \n\n Zyskuje również 2 dodatkowe ładunki maksymalnej mocy broni i +50% szybkości ładowania mocy broni.
actors.hero.herosubclass.champion_short_desc=_Czempionka_ może władać dwiema broniami i zdobywa więcej ładunków. Jej standardowe ataki wykorzystują broń główną, ale może zmieniać broń i korzystać ze zdolności dowolnej z nich.
actors.hero.herosubclass.freerunner=wolny biegacz
actors.hero.herosubclass.freerunner_desc=Podczas ruchu Freerunner gromadzi punkty pędu. Może zyskać do 10 punktów pędu po 10 turach biegu, ale szybko je traci, jeśli przestanie się poruszać. Freerunner może wykorzystać swój pęd, aby rozpocząć bieg swobodny, przez 2 tury na każdy punkt pędu.\n\nPodczas biegu swobodnego Freerunner porusza się z dwukrotnie większą prędkością i zyskuje premię do uników proporcjonalną do swojego poziomu. Po zakończeniu biegu swobodnego następuje czas odnowienia, zanim pęd zostanie ponownie zgromadzony.
actors.hero.herosubclass.freerunner_short_desc=_Freerunner_ nabiera rozpędu podczas biegu, co można wykorzystać do rozpoczęcia swobodnego biegu. To zapewnia mu na chwilę premię do prędkości i unikania ciosów.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_desc=Gladiator buduje jeden punkt combo za każdym razem, gdy wykona udany atak bronią białą lub miotaną. Jeśli Gladiator nie wykona udanego ataku w ciągu 5 tur (15 tur po zabiciu), jego combo zostaje zresetowane.\n\nW miarę budowania combo, Gladiator może używać różnych umiejętności, które gwarantują trafienie:\n2 Combo: odrzuca wroga, podtrzymuje combo\n4 Combo: zadaje obrażenia zależne od pancerza\n6 Combo: parowanie, podtrzymuje combo\n8 Combo: zadaje obrażenia celowi i pobliskim wrogom\n10 Combo: atakuje raz dla każdej kombinacji
actors.hero.herosubclass.gladiator_short_desc=_Gladiator_ buduje kombinację, gdy wykonuje udane ataki. Może wykorzystać kombinację, aby użyć unikalnych umiejętności.
actors.hero.herosubclass.monk=mnich
actors.hero.herosubclass.monk_desc=Mniszka jest mistrzynią techniki fizycznej. Pokonując wrogów, zyskuje energię, którą może wykorzystać w różnych umiejętnościach obronnych i użytkowych. Energia ta nie zanika z czasem, ale ma limit zależny od poziomu Mniszka.\n\n1 Energia: szybkie uderzenie pięściami\n2 Energia: skupienie, aby uniknąć kolejnego ataku\n3 Energia: natychmiastowe doskoczenie do pobliskiego miejsca\n4 Energia: odrzucenie przeciwnika\n5 Energia: medytacja, aby oczyścić statusy i przywrócić ładunek różdżki i artefaktu
actors.hero.herosubclass.monk_short_desc=_Mnich_ gromadzi energię podczas walki. Energię tę można wykorzystać na wiele unikalnych umiejętności.
actors.hero.herosubclass.paladin=paladyn
actors.hero.herosubclass.paladin_desc=Paladyn zyskuje szereg nowych i ulepszonych zaklęć, które kładą nacisk na walkę wręcz i synergię z bronią i zbroją.\n\nZaklęcia _Święta Broń_ i _Święta Ochrona_ Paladyna zapewniają większe premie, nie unieważniają już istniejących zaklęć i glifów, a ich działanie można wydłużyć, rzucając inne zaklęcia.\n\nPaladyn zyskuje również zaklęcie _Uderzenie_, które pozwala mu zadać gwarantowany cios wręcz z dodatkowymi obrażeniami i mocą zaklęcia.
actors.hero.herosubclass.paladin_short_desc=_Paladyn_ zyskuje nowe zaklęcia krótkiego zasięgu oraz wzmocnione wersje świętej broni i osłony.
actors.hero.herosubclass.priest=kapłan
actors.hero.herosubclass.priest_desc=Kapłan zyskuje szereg nowych i ulepszonych zaklęć, które kładą nacisk na walkę dystansową i synergię z magicznymi przedmiotami.\n\nKapłan może rzucić za darmo _Guiding Light_ raz na 50 tur, oświetlając wrogów bezpośrednio objętych dowolnym ze swoich zaklęć i może zużyć osłabienie iluminacji za pomocą sojuszników, różdżek i niektórych artefaktów, aby uzyskać premię do obrażeń równą swojemu poziomowi + 5.\n\nKapłan zyskuje również zaklęcie _Radiance_, które rozprasza ciemność i wpływa na wszystkich widocznych wrogów, aktywując i nakładając na nich efekt iluminacji oraz na krótko ich ogłuszając kosztem 2 ładunków.
actors.hero.herosubclass.priest_short_desc=_Kapłan_ zyskuje nowe zaklęcia dalekiego zasięgu i wzmocnioną wersję przewodniego światła.
actors.hero.herosubclass.sniper=snajper
actors.hero.herosubclass.sniper_desc=Snajperka to mistrzyni walki dystansowej, której ataki przebijają wrogi pancerz. Kiedy atakuje wroga bronią miotaną, oznacza go znakiem snajperskim, co pozwala jej na wykonanie ataku specjalnego z łuku. Ten atak specjalny różni się w zależności od tego, jak wzmocniony jest jej łuk.\n\nŁuk bez wzmocnienia wystrzeli strzałę migawkową, która zadaje zmniejszone obrażenia, ale strzela natychmiast. Łuk szybki wystrzeli salwę trzech strzał, które zadają zmniejszone obrażenia, nadal mogą aktywować zaklęcia i wymagają 1 tury na wystrzelenie. Łuk zadający obrażenia wystrzeli strzałę snajperską, która z pewnością trafi, zadaje dodatkowe obrażenia zależne od odległości i wymaga 2 tury na wystrzelenie.
actors.hero.herosubclass.sniper_short_desc=_Snajperka_ potrafi przebić pancerz atakami dystansowymi. Po ataku bronią miotaną może wykonać atak specjalny z łuku.
actors.hero.herosubclass.warden=opiekun
actors.hero.herosubclass.warden_desc=Strażniczka ma silną więź z naturą, co zapewnia jej różnorodne efekty bonusowe związane z trawą i roślinami. Potrafi widzieć przez wysoką i poszarpaną trawę, jakby była pustą przestrzenią.\n\nStrażniczka sprawia, że trawa wyrasta wokół każdego rzuconego lub zasadzonego przez nią nasiona, a także zyskuje efekty specjalne podczas deptania roślin. Te efekty specjalne zastępują standardowe efekty roślin, co oznacza, że żadna roślina nie jest dla niej szkodliwa.
actors.hero.herosubclass.warden_short_desc=_Strażniczka_ widzi przez wysoką trawę i zyskuje dodatkowe efekty, gdy sadzi nasiona i depcze rośliny.
actors.hero.herosubclass.warlock=czarodziej
actors.hero.herosubclass.warlock_desc=Czarnoksiężnik ma szansę na nałożenie znaku duszy na postacie, gdy używa na nich różdżek. Szansa na nałożenie znaku duszy i czas jego trwania rosną wraz z poziomem różdżki.\n\nKiedy wróg zostanie naznaczony znakiem duszy, Czarnoksiężnik przywróci mu 2 punkty zdrowia za każde 5 zadanych obrażeń, ale tylko atakami bronią białą lub miotaną, a nie różdżkami!
actors.hero.herosubclass.warlock_short_desc=_Czarnoksiężnik_ ma szansę na naznaczenie wrogów duszą za pomocą różdżki. Leczy się za każdym razem, gdy zadaje obrażenia fizyczne naznaczonym wrogom.
actors.hero.spells.auraofprotection$aurabuff.desc=Paladyn emanuje wokół siebie ochronną energią.\n\nWszyscy pobliscy sojusznicy (w tym sam Paladyn) odnoszą zmniejszone obrażenia i zyskują efekt glifu zbroi Paladyna ze zwiększoną mocą.\n\nPozostałe tury: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura ochrony
actors.hero.spells.auraofprotection.desc=Paladyn zaczyna emanować ochronną energią w postaci iskrzącej aury wokół siebie przez 20 tur. Każdy sojusznik w promieniu 2 pól od Paladyna (wliczając siebie samego) otrzymuje obrażenia o %1$d%% mniejsze i zyskuje efekt glifu zbroi Paladyna o mocy +%2$d%%.\n\n. Ta redukcja obrażeń następuje przed innymi efektami redukującymi obrażenia (np. pancerzem). Wzmocnienie mocy glifu zawsze będzie działać, ale to zaklęcie nie może spowodować, że glif Paladyna zostanie zastosowany więcej niż raz, jeśli postać już z niego korzysta (np. sam Paladyn lub pryzmatyczny obraz).
actors.hero.spells.auraofprotection.name=aura ochrony
actors.hero.spells.auraofprotection.short_desc=Zwiększa obronę Paladyna i pobliskich sojuszników.
actors.hero.spells.beamingray$beamingrayboost.desc=Ten sojusznik został niedawno teleportowany przez Promień Promienia, co dało mu dodatkowe obrażenia zadawane najbliższemu wrogowi po teleportacji. Siła Wielu również nie wygaśnie, gdy to wzmocnienie jest aktywne.\n\nPozostałe tury: %s.
actors.hero.spells.beamingray$beamingrayboost.name=promień promieniujący
actors.hero.spells.beamingray.desc=Kapłan kieruje moc swojego sojusznika w promień światła, który przenosi go w wybrane miejsce. Jeśli promień zderzy się z wrogiem, sojusznik znajdzie się w pobliżu i skieruje go w jego stronę.\n\nPromień ma maksymalny zasięg %1$d pól i zwiększa premię do obrażeń Potęgi Wielu o +%2$d%% na 10 tur przeciwko najbliższemu wrogowi w promieniu 4 pól. Promień może teleportować nawet normalnie nieruchomych sojuszników, ale w takich przypadkach jego zasięg jest o połowę mniejszy.
actors.hero.spells.beamingray.name=promień promieniujący
actors.hero.spells.beamingray.no_space=Nie ma tam miejsca na pojawienie się twojego sojusznika.
actors.hero.spells.beamingray.out_of_range=Ta lokalizacja jest poza zasięgiem.
actors.hero.spells.beamingray.short_desc=Teleportuje sojusznika i zapewnia dodatkowe obrażenia.
actors.hero.spells.blessspell.desc=Kapłan rzuca święte błogosławieństwo na siebie lub inną postać, którą widzi.\n\nPo rzuceniu na siebie, efekt jest słabszy, dając %1$d tur błogosławieństwa i %2$d barierę.\n\nPo rzuceniu na inne postacie, zaklęcie jest potężniejsze, dając %3$d tur błogosławieństwa i %4$d leczenia. Nadmiar leczenia przekształca się w barierę.
actors.hero.spells.blessspell.name=błogosławić
actors.hero.spells.blessspell.short_desc=Błogosławi i osłania duchownego, błogosławi i leczy innych.
actors.hero.spells.bodyform$bodyformbuff.desc=Forma ciała Trinity obecnie obdarza cię mocą zaklęcia lub glifu, tak jakbyś miał go założonego na swojej obecnej broni lub zbroi.\n\nPamiętaj, że forma ciała nie może zapewnić kolejnej kopii efektu, z którego już korzystasz.\n\nAktualny efekt: %1$s.\n\nPozostałe tury: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=forma ciała
actors.hero.spells.bodyform.desc=Kapłan wybiera zaklęcie lub glif, który zidentyfikował w tym biegu i nasyca Trinity jego efektem.\n\nPo użyciu Trinity, Kapłan zyskuje efekt wybranego zaklęcia lub glifu na %d tur. To tymczasowe zaklęcie lub glif będzie działać z każdym efektem, jaki działałoby ze zwykłym zaklęciem lub glifem.\n\nTo zaklęcie zastępuje wszelkie inne efekty fizyczne, którymi jest aktualnie nasycona Trinity.
actors.hero.spells.bodyform.name=forma ciała
actors.hero.spells.bodyform.short_desc=Przypisuje Trójcę do zaklęcia lub glifu.
actors.hero.spells.cleanse.desc=Kapłan usuwa wszystkie szkodliwe efekty statusu z siebie i widocznych sojuszników. Po zakończeniu zaklęcia wszystkie postacie objęte zaklęciem zyskują również %1$d tur odporności na osłabienia oraz barierę %2$d.
actors.hero.spells.cleanse.name=oczyścić
actors.hero.spells.cleanse.short_desc=Usuwa osłabienia i zapewnia tarczę.
actors.hero.spells.clericspell.charge_cost=Koszt ładowania: %d
actors.hero.spells.clericspell.invalid_enemy=Nie możesz obrać tego wroga za cel.
actors.hero.spells.clericspell.invalid_target=Nie można wybrać tej lokalizacji.
actors.hero.spells.clericspell.no_target=Nie ma tam żadnego celu.
actors.hero.spells.clericspell.prompt=Wybierz cel
actors.hero.spells.divineintervention.desc=Kapłan przelewa ogromną moc ze swojego tomu w siebie i sojuszników, wzmacniając tarczę %1$d i wydłużając Formę Wzniesienia o %2$d tur. Niesamowita moc obronna tego zaklęcia jest równoważona przez jego bardzo wysoki koszt ładowania.\n\nPodobnie jak inne tarcze zapewniane przez Formę Wzniesienia, ta tarcza nie zanika normalnie, ale natychmiast znika po zakończeniu Formacji Wzniesienia.
actors.hero.spells.divineintervention.name=boska interwencja
actors.hero.spells.divineintervention.short_desc=Znaczne wzmocnienie tarczy dla duchownych i sojuszników.
actors.hero.spells.divinesense$divinesensetracker.desc=Ta postać może tymczasowo widzieć umysłem inne pobliskie stworzenia!\n\nPozostało tur: %s.
actors.hero.spells.divinesense$divinesensetracker.name=boski zmysł
actors.hero.spells.divinesense.desc=Kapłan skupia zmysły na otoczeniu, zyskując wizję umysłu z zasięgiem kafelka %d na 50 tur. Rzucenie tego zaklęcia jest bardzo szybkie.
actors.hero.spells.divinesense.name=boski zmysł
actors.hero.spells.divinesense.short_desc=Zdobądź tymczasową wizję umysłu w szerokim zakresie.
actors.hero.spells.flash.desc=Kapłan kieruje swoją wzniesioną formę do pobliskiego miejsca i teleportuje się tam. Błysk może teleportować Kapłana do dowolnego odkrytego miejsca, które znajduje się w zasięgu i jest niezajęte. To zaklęcie kosztuje więcej ładunków tomów za każdym razem, gdy jest używane w tej samej wzniesionej formie.
actors.hero.spells.flash.name=błysk
actors.hero.spells.flash.prompt=Wybierz lokalizację
actors.hero.spells.flash.short_desc=Teleportuj się do pobliskiej lokalizacji.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Kapłan będzie mógł ponownie rzucać zaklęcie Guiding Light za darmo po upływie 50 tur.\n\nPozostało tur: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Światło przewodnie
actors.hero.spells.guidinglight$illuminated.desc=Ta postać świeci, ponieważ zostaje trafiona przez światło przewodnie. Choć blask nie jest wystarczająco silny, aby rozjaśnić otoczenie, magiczny efekt sprawi, że Kleryk będzie mógł zadawać jej ciosy znacznie łatwiej.
actors.hero.spells.guidinglight$illuminated.desc_generic=Pozostali bohaterowie nadal mogą używać iluminacji, by czerpać korzyści z talentu palącego światła, jednak nie zyskają na celności.
actors.hero.spells.guidinglight$illuminated.desc_priest=Kapłan może dodatkowo wykorzystać efekt iluminacji za pomocą blasku, różdżki, ciosu sojusznika lub efektów niektórych artefaktów. Użycie efektu iluminacji w ten sposób zada dodatkowe obrażenia magiczne równe poziomowi Kapłana +5.
actors.hero.spells.guidinglight$illuminated.name=oświetlony
actors.hero.spells.guidinglight.desc=Kapłan wystrzeliwuje wiązkę magicznej energii, która uderza w cel, zadając mu od 2 do 8 obrażeń i oświetlając go. Następny nieobciążony atak fizyczny na oświetlonego wroga z pewnością go trafi.
actors.hero.spells.guidinglight.desc_priest=_To zaklęcie jest potężniejsze, gdy rzuca je Kapłan._ Pierwsze rzucenie zaklęcia co 50 tur nie kosztuje żadnych tomów, a iluminacja zostanie zużyta przez blask, różdżki, inne postacie i artefakty, które bezpośrednio oddziałują na wrogów. Użycie iluminacji w ten sposób zadaje dodatkowe obrażenia magiczne równe poziomowi Kapłana + 5.
actors.hero.spells.guidinglight.name=Światło przewodnie
actors.hero.spells.guidinglight.short_desc=Zadaje obrażenia magiczne z dystansu i gwarantuje trafienie.
actors.hero.spells.hallowedground$hallowedterrain.desc=Ziemia została tu poświęcona. Poświęcona ziemia spowalnia wrogów, leczy sojuszników i powoduje rozprzestrzenianie się trawy.
actors.hero.spells.hallowedground.desc=Kapłan skupia swoją boską magię na pobliskiej ziemi, tworząc obszar %1$dx%1$d poświęconego terenu na 20 tur.\n\nPo rzuceniu tego zaklęcia leczy wszystkich sojuszników o 15 PW (zdrowi sojusznicy i kapłan otrzymują tarczę), na krótko unieruchamia wrogów i rozprzestrzenia krótką trawę.\n\nPoświęcony teren leczy sojuszników o 1 PW na turę (zdrowi sojusznicy i kapłan otrzymują tarczę), okalecza wrogów i losowo powoduje wzrost wysokiej trawy.\n\nPoświęcony teren zostaje zniszczony przez ogień i pozostawi po sobie bruzdowaną trawę, jeśli pasywne efekty regeneracji zostaną wyłączone lub kapłan przez pewien czas nie zdobywał doświadczenia.
actors.hero.spells.hallowedground.name=poświęcona ziemia
actors.hero.spells.hallowedground.prompt=Wybierz lokalizację
actors.hero.spells.hallowedground.short_desc=Leczy sojuszników, spowalnia wrogów i rozprzestrzenia trawę w obszarze działania.
actors.hero.spells.holyintuition.cursed=Wyczuwasz, że w tym przedmiocie kryje się złowroga magia.
actors.hero.spells.holyintuition.desc=Kapłan skupia swoje zmysły na przedmiocie i określa, czy jest on przeklęty, czy nie, bez konieczności zakładania go.
actors.hero.spells.holyintuition.name=święta intuicja
actors.hero.spells.holyintuition.prompt=wybierz przedmiot
actors.hero.spells.holyintuition.short_desc=określa, czy przedmiot jest przeklęty czy nie.
actors.hero.spells.holyintuition.uncursed=Przedmiot ten jest wolny od złowrogiej magii.
actors.hero.spells.holylance$lancecooldown.desc=Kapłan niedawno rzucił Świętą Włócznię i musi odczekać, zanim rzuci ją ponownie.\n\nPozostałe tury: %s.
actors.hero.spells.holylance$lancecooldown.name=czas odnowienia świętej włóczni
actors.hero.spells.holylance.desc=Kapłan koncentruje dużą ilość energii w niszczycielskiej włóczni rzuconej ze światła. Ta włócznia zadaje obrażenia %1$d-%2$d i zawsze zadaje maksymalne obrażenia nieumarłym i demonicznym celom.\n\nTo zaklęcie jest bardzo kosztowne i ma czas odnowienia 30 tur.
actors.hero.spells.holylance.name=święta włócznia
actors.hero.spells.holylance.short_desc=Zadaje duże obrażenia magiczne o zasięgu.
actors.hero.spells.holyward$holyarmbuff.desc=Kapłan nasycił swoją zużytą zbroję świętą energią, tymczasowo blokując wszelkie istniejące glify i sprawiając, że zbroja blokuje dodatkowy 1 punkt obrażeń.\n\nPozostałe tury: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladyn nasycił swoją zużytą zbroję świętą energią, dzięki czemu blokuje ona dodatkowe 3 punkty obrażeń.\n\nRzucanie innych zaklęć, gdy święta ochrona jest aktywna, wydłuży jej czas trwania o 10 tur na każdy zużyty ładunek.\n\nPozostałe tury: %s.
actors.hero.spells.holyward$holyarmbuff.name=święta dzielnica
actors.hero.spells.holyward.desc=Kapłan nasyca swoją zużytą zbroję glifami świętego światła, zwiększając blokowanie obrażeń przez zbroję o 1. Rzucenie tego zaklęcia jest natychmiastowe.\n\nTen glif utrzymuje się przez 50 tur i na czas trwania unieważnia wszystkie korzystne glify noszone przez zbroję. Kapłan odniesie korzyści z tego efektu, nawet jeśli nie ma pancerza.
actors.hero.spells.holyward.desc_paladin=_To zaklęcie jest potężniejsze, gdy rzuca je Paladyn._ Dodatkowe blokowanie obrażeń wzrasta do 3, zaklęcie nie unieważnia już istniejących glifów, a rzucanie innych zaklęć, gdy aktywna jest święta straż, wydłuży jego czas trwania o 10 tur na każdy użyty ładunek.
actors.hero.spells.holyward.glyph_desc=Ten glif nieznacznie zwiększa ilość obrażeń, jakie może zablokować pancerz.
actors.hero.spells.holyward.glyph_name=%s światła
actors.hero.spells.holyward.name=święta dzielnica
actors.hero.spells.holyward.short_desc=Tymczasowo zastępuje glify, aby zwiększyć blokowanie pancerza.
actors.hero.spells.holyweapon$holywepbuff.desc=Kapłan nasycił swoją zużytą broń świętą energią, tymczasowo unieważniając wszelkie istniejące zaklęcia i sprawiając, że broń zadaje dodatkowe 2 punkty obrażeń magicznych przy każdym ataku.\n\nPozostało tury: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladyn nasycił swoją zużytą broń świętą energią, dzięki czemu jego ataki zadają dodatkowe 6 punktów obrażeń magicznych.\n\nRzucanie innych zaklęć, gdy święta broń jest aktywna, wydłuży jej czas trwania o 10 tur na każdy zużyty ładunek.\n\nPozostałe tury: %s.
actors.hero.spells.holyweapon$holywepbuff.name=święta broń
actors.hero.spells.holyweapon.desc=Kapłan zaklina swoją zużytą broń świętą energią, dzięki czemu broń zadaje dodatkowe 2 punkty obrażeń magicznych za każdym razem, gdy trafi nią wroga. Rzucenie tego zaklęcia jest natychmiastowe.\n\nTo zaklęcie trwa 50 tur i unieważnia wszelkie korzystne zaklęcia danej broni. Ataki wręcz również mogą skorzystać z tego efektu.
actors.hero.spells.holyweapon.desc_paladin=_To zaklęcie jest potężniejsze, gdy rzuca je Paladyn._ Dodatkowe obrażenia magiczne wzrastają do 6, zaklęcie nie unieważnia już istniejących zaklęć, a rzucanie innych zaklęć, gdy aktywna jest święta broń, wydłuży jego czas trwania o 10 tur na każdy użyty ładunek.
actors.hero.spells.holyweapon.ench_desc=Wrogowie trafieni świętą bronią otrzymają dodatkowe obrażenia magiczne.
actors.hero.spells.holyweapon.ench_name=święty %s
actors.hero.spells.holyweapon.name=święta broń
actors.hero.spells.holyweapon.short_desc=Tymczasowo pomija zaklęcia, zwiększając obrażenia.
actors.hero.spells.judgement.desc=Kapłan uderza pięścią w ziemię, wywołując eksplozję światła, która zadaje obrażenia wszystkim widocznym w polu widzenia przeciwnikom. Zadaje ona obrażenia bazowe w wysokości %1$d-%2$d, ale dodatkowo zadaje obrażenia w wysokości 33%% za każde zaklęcie rzucone przez Kapłana od momentu wejścia w formę wzniesioną (lub od ostatniego rzucenia Wyroku). \n\nObecnie Wyrok zadaje obrażenia w wysokości %3$d-%4$d.
actors.hero.spells.judgement.name=osąd
actors.hero.spells.judgement.short_desc=Zadaje obrażenia wszystkim widocznym wrogom.
actors.hero.spells.layonhands.desc=Paladyn kieruje świętą energię przez swoje dłonie, lecząc lub chroniąc wszystko, czego dotknie.\n\nPaladyn może rzucić to zaklęcie na dowolną sąsiadującą postać, aby zapewnić jej leczenie %1$d, lub na siebie, aby uzyskać tarczę %1$d. Nadmiar leczenia z tego zaklęcia jest przekształcany w tarczę.\n\nTen czar jest rzucany natychmiastowo i może być rzucany wielokrotnie, ale nie może zapewnić więcej niż trzykrotnej tarczy naraz.
actors.hero.spells.layonhands.name=włożyć ręce
actors.hero.spells.layonhands.short_desc=Natychmiast leczy sąsiadującą postać lub osłania Paladyna.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Kapłan niedawno rzucił na tego sojusznika zaklęcie Life Link.\n\nOprócz standardowych korzyści z Life Link, ta postać otrzymuje również zmniejszone obrażenia, wszelkie pozytywne zaklęcia Kapłana odnoszą się zarówno do Kapłana, jak i do tego sojusznika, a nie tylko do jednego, a Moc Wielu nie wygasa, dopóki to wzmocnienie jest aktywne.\n\nPozostałe tury: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=ochrona łącza życia
actors.hero.spells.lifelinkspell.desc=Kapłan wzmacnia więź między sobą a wzmocnionym sojusznikiem. Dzięki temu wzmocnionemu połączeniu wszelkie otrzymane obrażenia będą dzielone między bohatera i sojusznika przez %1$d tur, a wzmocnienie defensywne Potęgi Wielu zostanie zwiększone do -%2$d%% otrzymanych obrażeń. Należy pamiętać, że obrażenia są dzielone po pancerzu, ale przed redukcją obrażeń Potęgi Wielu.\n\nDopóki ten efekt jest aktywny, korzystne zaklęcia Kapłana o poziomie T3 lub niższym będą działać zarówno na Kapłana, jak i na jego sojusznika, jeśli miałyby działać tylko na jednego z nich.
actors.hero.spells.lifelinkspell.name=łącze życia
actors.hero.spells.lifelinkspell.short_desc=Dzieli się obrażeniami z sojusznikiem i zmniejsza otrzymywane przez niego obrażenia.
actors.hero.spells.mindform.desc=Kapłan wybiera różdżkę lub broń miotaną, którą zidentyfikował w tym biegu i nasyca Trinity jej efektem.\n\nKiedy używana jest Trinity, Kapłan może wykonać pojedynczy atak, tak jakby używał wybranego przedmiotu, z +%d. Spowoduje to uruchomienie wszystkich efektów, które normalnie wywołałby użycie tego typu przedmiotu.\n\nTo zaklęcie zastępuje wszelkie inne efekty umysłu, którymi jest aktualnie nasycona Trinity.
actors.hero.spells.mindform.name=forma umysłu
actors.hero.spells.mindform.short_desc=Przypisuje Trójcę do różdżki lub broni rzucanej.
actors.hero.spells.mnemonicprayer.desc=Kapłan wypowiada modlitwę, która wydłuża czas trwania wszystkich wzmocnień i osłabień na danym celu o %1$d tur. Rzucenie tego zaklęcia jest szybkie. Pozytywne efekty będą trwać dłużej na sojusznikach (w tym na samym Kapłanie), a szkodliwe efekty będą trwać dłużej na wrogach. \n\nModlitwa Mnemoniczna może przedłużyć działanie konkretnego wzmocnienia lub osłabienia tylko raz i nie może przedłużyć efektów zapewnianych przez umiejętności pancerza.
actors.hero.spells.mnemonicprayer.name=modlitwa mnemoniczna
actors.hero.spells.mnemonicprayer.short_desc=Przedłuża efekty wzmocnień/osłabień na sojuszniku/wrogu i ponownie nakłada efekty podświetlenia.
actors.hero.spells.radiance.desc=Kapłan rozbłyska świętym światłem, ogłuszając wszystkich widocznych wrogów na 3 tury. Jeśli wróg jest już oświetlony, Blask aktywuje bonusowe obrażenia od blasku, a następnie nałoży efekt osłabienia. Blask sprawi również, że Kapłan będzie świecił przez 100 tur, jeśli obecne piętro jest ciemne.
actors.hero.spells.radiance.name=blask
actors.hero.spells.radiance.short_desc=Oświetla i na krótko ogłusza widocznych wrogów.
actors.hero.spells.recallinscription$useditemtracker.desc=Kapłan niedawno użył przedmiotu, który działa z zaklęciem przywołania. Kapłan może rzucić zaklęcie, aby powtórzyć efekt przedmiotu.\n\nUżyty przedmiot: %1$s.\n\nPozostałe tury: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=ostatnio używana runa
actors.hero.spells.recallinscription.desc=Kapłan używa świętej magii, aby odtworzyć efekt magicznej runy znalezionej na kamieniu runicznym lub zwoju, których użył w ostatnich turach %s. Inskrypcja Przywołania nie może być użyta do replikacji zwojów ulepszenia. Koszt ładowania tego zaklęcia różni się w zależności od tego, który przedmiot został ostatnio użyty: 2 dla kamienia runicznego, 3 dla zwoju, 4 dla zwoju egzotycznego. Koszt ładowania jest również podwajany podczas replikacji zwoju transmutacji lub przedmiotów alchemicznych, które muszą zostać wykonane za pomocą transmutacji lub ulepszenia.
actors.hero.spells.recallinscription.name=przywołać napis
actors.hero.spells.recallinscription.short_desc=Powtarza ostatnio używany kamień runiczny lub zwój.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Cienka tarcza światła stoi między tą postacią a wrogiem. Nie jest wystarczająco silna, aby całkowicie zablokować ataki, ale je osłabi.\n\nPozostałe tury: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=tarcza światła
actors.hero.spells.shieldoflight.desc=Kapłan tworzy cienką barierę światła między sobą a wrogiem, zwiększając siłę blokującą jego pancerz przeciwko temu wrogowi o %1$d-%2$d na 5 tur.\n\nRzucenie tego czaru nie zajmuje dużo czasu, ale nie można go używać przeciwko kilku celom jednocześnie.
actors.hero.spells.shieldoflight.name=tarcza światła
actors.hero.spells.shieldoflight.short_desc=Zapewnia tymczasowy pancerz przeciwko celowi.
actors.hero.spells.smite.desc=Paladyn napełnia atak wręcz sprawiedliwą, niszczycielską mocą.\n\nOprócz zadawania normalnych obrażeń w walce wręcz, Smite sprawia, że nieobciążone ataki z pewnością trafią, ma +300%% mocy zaklęcia i zadaje %1$d - %2$d premii do obrażeń magicznych.\n\nPremia do obrażeń magicznych Smite'a zwiększa się wraz z poziomem Paladyna i zawsze będzie zadawać maksymalne premie do obrażeń magicznych nieumarłym lub demonicznym wrogom.
actors.hero.spells.smite.name=porazić
actors.hero.spells.smite.short_desc=Gwarantuje trafienie z dodatkowymi obrażeniami i mocą zaklęcia.
actors.hero.spells.spiritform$spiritformbuff.desc=Duchowa forma Trinity obdarza cię obecnie mocą przedmiotu, tak jakbyś miał go założonego.\n\nPamiętaj, że duchowa forma nie może zapewnić kolejnej kopii efektu, z którego już korzystasz.\n\nAktualny efekt: %1$s.\n\nPozostałe obroty: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=forma duchowa
actors.hero.spells.spiritform.desc=Kapłan wybiera pierścień lub artefakt, który zidentyfikował w tym biegu (oprócz świętej księgi) i nasyca Trinity jego efektem.\n\nJeśli zostanie wybrany pierścień, Trinity nadaje efekt tego pierścienia z +%1$d przez 20 tur.\n\nJeśli zostanie wybrany artefakt, Trinity replikuje efekt tego artefaktu z +%2$d. Każdy artefakt ma inne specyficzne zachowania i koszty ładowania pancerza, gdy jest używany z Trinity.\n\nTo zaklęcie zastępuje wszelkie inne efekty duchowe, którymi Trinity jest obecnie nasycona.
actors.hero.spells.spiritform.name=forma duchowa
actors.hero.spells.spiritform.short_desc=Przypisuje Trójcę do pierścienia lub artefaktu.
actors.hero.spells.stasis$stasisbuff.desc=Kapłan ma obecnie sojusznika w stanie spoczynku. Wszystkie pozytywne efekty tego sojusznika, w tym Potęga Wielu, zostają zachowane i pojawią się ponownie obok Kapłana po zakończeniu efektu. Efekt można również zakończyć wcześniej, ponownie rzucając Zaklęcie Stazy.\n\nSojusznik w stanie spoczynku: %1$s.\nPozostałe tury: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Twój nieruchomy sojusznik zostaje w tyle.
actors.hero.spells.stasis$stasisbuff.name=sojusznik w stanie spoczynku
actors.hero.spells.stasis.desc=Kapłan koncentruje połączenie ze swoim sojusznikiem na sobie, powodując, że sojusznik zostaje tymczasowo uwięziony w swego rodzaju energetycznym zastoju. Sojusznik pozostanie w nim przez maksymalnie %d tur, a wszystkie pozytywne efekty na niego nie zostaną naruszone przez czas trwania zastoju.\n\nSojusznik pojawi się obok Kapłana, gdy zastój naturalnie się zakończy, lub może on natychmiastowo rzucić zaklęcie ponownie bez żadnych kosztów, aby zakończyć efekt przedwcześnie. Zastój może nawet poruszać nieruchomymi sojusznikami, ale nie może ich przenosić między piętrami.
actors.hero.spells.stasis.name=zastój
actors.hero.spells.stasis.short_desc=Usuwa sojusznika z lochu i zachowuje go.
actors.hero.spells.sunray.desc=Kapłan wystrzeliwuje w cel promień oślepiającego światła, zadając obrażenia %1$d-%2$d i oślepiając go na %3$d tur. Promień Słońca zawsze zadaje maksymalne obrażenia nieumarłym i demonicznym celom. \n\nPo trafieniu tym zaklęciem wzrok wroga ulega zmianie, zapobiegając ponownemu oślepieniu. Jeśli jednak zostanie on ponownie trafiony, będąc oślepionym, światło jest przytłaczające i paraliżuje go.
actors.hero.spells.sunray.name=promień słoneczny
actors.hero.spells.sunray.short_desc=Zadaje magiczne obrażenia dystansowe i oślepia cel jeden raz.
actors.hero.spells.walloflight$lightwall.desc=Migoczące panele światła blokują tutaj przejście.
actors.hero.spells.walloflight.desc=Paladyn tworzy ścianę z paneli solidnego światła tuż przed sobą, o grubości 1 pola i szerokości %1$d pól, która utrzymuje się przez 20 tur.\n\nTa ściana działa jak zwykła ściana, z tą różnicą, że można przez nią patrzeć. Przeciwnicy złapani w ścianę w momencie jej powstania zostaną na chwilę ogłuszeni i odepchnięci, jeśli to możliwe. Wszystko, co utknie w ścianie, będzie mogło się z niej wydostać.\n\nŚcianę można rzucać w dowolnym z czterech kierunków głównych lub czterech skośnych. Jeśli ściana jest już aktywna, zaklęcie można ponownie użyć za darmo, aby natychmiast ją oczyścić.
actors.hero.spells.walloflight.early_end=Rozpraszasz ścianę światła.
actors.hero.spells.walloflight.name=ściana światła
actors.hero.spells.walloflight.short_desc=Tworzy ścianę blokującą wrogów.
actors.hero.talent$aggressivebarriercooldown.desc=Niedawno użyłeś tego talentu i musisz odczekać, zanim użyjesz go ponownie.\n\nPozostało tur: %s.
actors.hero.talent$aggressivebarriercooldown.name=agresywny czas odnowienia bariery
actors.hero.talent$combinedlethalityabilitytracker.executed=wykonany
actors.hero.talent$deadlyfollowuptracker.desc=Duelistka niedawno zaatakowała wroga rzucaną bronią. Jej ataki wręcz przeciwko temu samemu celowi będą zadawać większe obrażenia.\n\nPozostało tur: %s.
actors.hero.talent$deadlyfollowuptracker.name=śmiertelna kontynuacja
actors.hero.talent$followupstriketracker.desc=Łowczyni niedawno zaatakowała wroga rzuconą bronią. Jej następny atak wręcz przeciwko temu samemu celowi zada zwiększone obrażenia.\n\nPozostało tur: %s.
actors.hero.talent$followupstriketracker.name=strajk uzupełniający
actors.hero.talent$improvisedprojectilecooldown.desc=Niedawno użyłeś tego talentu i musisz odczekać, zanim użyjesz go ponownie.\n\nPozostało tur: %s.
actors.hero.talent$improvisedprojectilecooldown.name=czas odnowienia improwizowanych pocisków
actors.hero.talent$lethalhastecooldown.desc=Niedawno użyłeś tego talentu i musisz odczekać, zanim użyjesz go ponownie.\n\nPozostało tur: %s.
actors.hero.talent$lethalhastecooldown.name=czas odnowienia śmiertelnego pośpiechu
actors.hero.talent$lingeringmagictracker.desc=Mag ostatnio użył laski lub różdżki. Jego następny atak fizyczny zada dodatkowe obrażenia.\n\nPozostało tur: %s.
actors.hero.talent$lingeringmagictracker.name=trwająca magia
actors.hero.talent$liquidagilacctracker.desc=Następny regularny atak wręcz Duelisty otrzyma premię do celności.\n\nPozostało tur: %s.
actors.hero.talent$liquidagilacctracker.name=płynna zwinność
actors.hero.talent$patientstriketracker.desc=Duelistka właśnie spędziła turę czekając, jej następny atak wręcz zada dodatkowe obrażenia.
actors.hero.talent$patientstriketracker.name=strajk pacjentów
actors.hero.talent$preciseassaulttracker.desc=Następny regularny atak wręcz Duelisty otrzyma premię do celności.\n\nPozostało tur: %s.
actors.hero.talent$preciseassaulttracker.name=precyzyjny atak
actors.hero.talent$provokedangertracker.desc=Wojownik niedawno stracił swoją tarczę, jego kolejny atak fizyczny zada dodatkowe obrażenia.\n\nPozostało tur: %s.
actors.hero.talent$provokedangertracker.name=wywołał gniew
