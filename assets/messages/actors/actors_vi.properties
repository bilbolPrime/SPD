actors.blobs.blizzard.desc=Một trận bão tuyết đang hoành hành ở đây.
actors.blobs.blizzard.name=bão tuyết
actors.blobs.confusiongas.desc=Một đám mây khí hỗn loạn đang cuộn xoáy ở đây.
actors.blobs.confusiongas.name=khí gây nhầm lẫn
actors.blobs.corrosivegas.desc=Một đám mây khí độc hại đang cuồn cuộn bao phủ khu vực này.
actors.blobs.corrosivegas.name=khí ăn mòn
actors.blobs.electricity.desc=Một luồng điện đang phát ra những tia lửa sáng rực ở đây.
actors.blobs.electricity.name=điện
actors.blobs.electricity.ondeath=Bạn đã chết lặng vì sốc...
actors.blobs.electricity.rankings_desc=Bị điện giật
actors.blobs.fire.desc=Một đám cháy đang bùng phát dữ dội ở đây.
actors.blobs.fire.name=ngọn lửa
actors.blobs.foliage.desc=Những tia sáng xuyên qua màn đêm u tối của khu vườn dưới lòng đất.
actors.blobs.foliage.name=tán lá
actors.blobs.freezing.desc=Không khí ở đây lạnh bất thường.
actors.blobs.freezing.name=không khí lạnh
actors.blobs.goowarn.desc=Những hạt năng lượng tối đang tràn ngập nơi đây!
actors.blobs.goowarn.name=năng lượng tối
actors.blobs.inferno.desc=Một đám cháy dữ dội đang bùng phát ở đây.
actors.blobs.inferno.name=địa ngục
actors.blobs.paralyticgas.desc=Một đám mây khí gây tê liệt đang cuộn xoáy ở đây.
actors.blobs.paralyticgas.name=khí gây tê liệt
actors.blobs.regrowth.name=sự tái sinh
actors.blobs.sacrificialfire.desc=Ở đây có một bàn thờ với ngọn lửa tế lễ đang cháy trên đó. Bất kỳ sinh vật nào bị giết ở đây sẽ được thiêu đốt như một vật tế lễ dâng lên các linh hồn của hầm ngục.\n\nCó lẽ sẽ có phần thưởng nếu đủ số lượng vật tế lễ được dâng lên?
actors.blobs.sacrificialfire.name=lửa tế lễ
actors.blobs.sacrificialfire.reward=Ngọn lửa bùng lên rồi tan biến, để lại phần thưởng xứng đáng!
actors.blobs.sacrificialfire.unworthy=Ngọn lửa thiêu rụi lễ vật của bạn, nhưng không làm thay đổi bản thân.
actors.blobs.sacrificialfire.worthy=Ngọn lửa thiêu rụi lễ vật của bạn và càng lúc càng mạnh hơn.
actors.blobs.smokescreen.desc=Một đám khói đen dày đặc đang cuồn cuộn bao phủ nơi đây.
actors.blobs.smokescreen.name=màn khói
actors.blobs.stenchgas.desc=Một đám mây mùi hôi thối đang cuồn cuộn bao trùm nơi đây.
actors.blobs.stenchgas.name=khí hôi
actors.blobs.stormcloud.desc=Một đám mây hơi nước cuồn cuộn đang cuộn xoáy ở đây.
actors.blobs.stormcloud.name=mây bão
actors.blobs.toxicgas.desc=Một đám mây khí độc màu xanh lục đang cu swirling quanh đây.
actors.blobs.toxicgas.name=khí độc
actors.blobs.toxicgas.ondeath=Bạn đã chết vì khí độc...
actors.blobs.toxicgas.rankings_desc=Bị ngạt thở
actors.blobs.waterofawareness.desc=Sức mạnh của tri thức tỏa ra từ dòng nước giếng này. Uống nước giếng sẽ giúp bạn nhận diện đầy đủ tất cả vật phẩm đang trang bị, xác định lời nguyền trên tất cả vật phẩm trong kho đồ và tiết lộ tất cả vật phẩm trên tầng hiện tại.
actors.blobs.waterofawareness.name=nước nhận thức
actors.blobs.waterofawareness.procced=Khi nhấp một ngụm, bạn cảm nhận được kiến thức tràn ngập trong tâm trí mình.
actors.blobs.waterofhealth.desc=Nguồn năng lượng chữa bệnh tỏa ra từ nước giếng này. Uống nước giếng này sẽ chữa lành vết thương, làm dịu cơn đói và hóa giải lời nguyền trên bất kỳ vật dụng nào đã cũ.
actors.blobs.waterofhealth.name=nước tốt cho sức khỏe
actors.blobs.waterofhealth.procced=Khi nhấp một ngụm, bạn cảm thấy vết thương của mình hoàn toàn lành lại.
actors.blobs.web.desc=Một lớp màng dày bao phủ mọi thứ ở đây. Bất cứ thứ gì chạm vào hoặc bị ném xuyên qua lớp màng đó đều sẽ làm đứt màng, nhưng đồng thời cũng sẽ bị mắc kẹt tại chỗ.
actors.blobs.web.name=mạng nhện
actors.buffs.adrenaline.desc=Sự bùng nổ sức mạnh thể chất, adrenaline giúp tăng cường cả tốc độ tấn công và di chuyển.\n\nAdrenaline cho phép mục tiêu chạy với tốc độ gấp 2 lần và tấn công với tốc độ gấp 1,5 lần.\n\nSố lượt còn lại: %s.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenalinesurge.desc=Một đợt bùng nổ sức mạnh to lớn, nhưng tiếc là không kéo dài.\n\nTăng sức mạnh: +%d.\nSố lượt cho đến khi hiệu ứng suy yếu: %s.
actors.buffs.adrenalinesurge.name=tăng cường sức mạnh
actors.buffs.amok.desc=Amok gây ra trạng thái giận dữ và hoang mang tột độ cho mục tiêu của nó.\n\nKhi một sinh vật bị ảnh hưởng bởi Amok, chúng sẽ tấn công bất cứ thứ gì ở gần, bất kể đó là bạn hay thù.\n\nSố lượt Amok còn lại: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Một lớp khiên mỏng bao quanh bạn, chặn một phần sát thương từ các đòn tấn công ma thuật.\n\nGiáp ma thuật của bạn hiện đang được tăng cường bởi: 0-%d.\n\nSố lượt cho đến khi giáp ma thuật suy yếu: %s.
actors.buffs.arcanearmor.name=áo giáp ma thuật
actors.buffs.artifactrecharge.desc=Năng lượng đang chảy khắp cơ thể bạn, làm tăng tốc độ sạc của các vật phẩm trang bị. Mỗi vật phẩm sẽ bị ảnh hưởng một chút khác nhau, nhưng tất cả đều sẽ sạc nhanh hơn nhiều so với bình thường. Số lượt còn lại: 0.
actors.buffs.artifactrecharge.name=sạc lại hiện vật
actors.buffs.ascensionchallenge.almost=Bạn cảm thấy Yog đang dần mất kiểm soát chiếc bùa hộ mệnh, bạn sắp thành công rồi!
actors.buffs.ascensionchallenge.beckon=Chiếc bùa hộ mệnh bắt đầu gọi tới những kẻ thù ở xa.
actors.buffs.ascensionchallenge.break=Bạn dành một khoảnh khắc để lấy lại hơi thở và cảm nhận những vết thương của mình bắt đầu lành lại!
actors.buffs.ascensionchallenge.damage=Chiếc bùa bắt đầu tỏa ra năng lượng hắc ám. Nó bốc cháy!
actors.buffs.ascensionchallenge.desc=Bằng cách nào đó, Yog-Dzewa đang duy trì ảnh hưởng của mình lên thế giới này thông qua chiếc bùa hộ mệnh, và đang cố gắng ngăn cản sự thăng tiến của bạn! Sức mạnh của Yog đang khiến hầm ngục trở nên nguy hiểm hơn rất nhiều, làm tăng số lượng kẻ thù và khiến chúng mạnh hơn! Sức mạnh này sẽ tiếp tục tích tụ nếu không được kiểm soát, nó có thể bị suy yếu bằng cách đánh bại những kẻ thù đã được tăng cường sức mạnh bởi Yog.
actors.buffs.ascensionchallenge.desc_beckon=Hiện tại, chiếc bùa hộ mệnh đang _phát tín hiệu đến kẻ thù ở xa_, báo hiệu vị trí của bạn cho chúng.
actors.buffs.ascensionchallenge.desc_clear=Năng lượng hắc ám phát ra từ bùa hộ mệnh đã được làm suy yếu đến mức tối đa có thể vào thời điểm này.
actors.buffs.ascensionchallenge.desc_damage=Năng lượng từ bùa hộ mệnh đã trở nên quá mạnh đến mức nó đang gây hại trực tiếp cho bạn!
actors.buffs.ascensionchallenge.desc_haste=Hiện tại, bùa hộ mệnh đang giúp _đẩy nhanh tốc độ di chuyển của kẻ thù ở xa_, cho phép chúng tiếp cận bạn nhanh hơn!
actors.buffs.ascensionchallenge.desc_slow=Hiện tại, bùa hộ mệnh đang làm chậm tốc độ của bạn và vô hiệu hóa các hiệu ứng tăng tốc!
actors.buffs.ascensionchallenge.haste=Bùa hộ mệnh bắt đầu đẩy nhanh sự tiến công của kẻ thù ở xa!
actors.buffs.ascensionchallenge.name=lời nguyền của bùa hộ mệnh
actors.buffs.ascensionchallenge.on_kill=Năng lượng bóng tối đang nuốt chửng bạn...
actors.buffs.ascensionchallenge.slow=Chiếc bùa hộ mệnh bắt đầu nặng trịch như chì trong hành trang của bạn!
actors.buffs.ascensionchallenge.weaken=Bạn có thể cảm nhận được lời nguyền của chiếc bùa hộ mệnh suy yếu đi một chút.
actors.buffs.ascensionchallenge.weaken_info=Lời nguyền của bùa hộ mệnh có thể được làm suy yếu bằng cách đánh bại nhiều kẻ thù hơn.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Nếu bạn đánh bại kẻ thù, lời nguyền của bùa hộ mệnh sẽ suy yếu!
actors.buffs.barkskin.desc=Da của bạn trở nên cứng cáp, cảm giác thô ráp và chắc như vỏ cây.\n\nLớp da cứng cáp này làm tăng giáp hiệu quả của bạn, cho phép bạn phòng thủ tốt hơn trước các đòn tấn công vật lý.\n\nGiáp của bạn hiện đang được tăng lên: 0-%d.\nSố lượt cho đến khi lớp da cứng yếu đi: %s.\n\nNếu bạn nhận được lớp da cứng từ nhiều nguồn, chỉ có hiệu ứng mạnh nhất mới được áp dụng.
actors.buffs.barkskin.name=vỏ cây
actors.buffs.barrier.desc=Một lớp bảo vệ bền vững ngăn chặn mọi sát thương.\n\nLớp bảo vệ sẽ chịu sát thương cho bất cứ thứ gì nó bảo vệ miễn là còn lớp chắn. Lớp chắn cũng sẽ suy giảm dần theo thời gian.\n\nLớp chắn còn lại: %d.
actors.buffs.barrier.name=rào cản
actors.buffs.berserk.action_name=Cuồng nộ
actors.buffs.berserk.angered=tức giận
actors.buffs.berserk.angered_desc=Mức độ nghiêm trọng của vết thương càng làm tăng sức mạnh cho các đòn đánh của Berserker. Khi Berserker chịu sát thương vật lý, cơn thịnh nộ của hắn sẽ tích tụ, mang lại cho hắn sát thương cộng thêm. Sát thương bị giáp chặn vẫn được tính vào việc tích lũy cơn thịnh nộ. Cơn thịnh nộ sẽ giảm dần theo thời gian. Máu của Berserker càng thấp, cơn thịnh nộ càng kéo dài lâu. Khi đạt 100 điểm thịnh nộ, Berserker có thể trở nên điên cuồng, tạo ra lớp giáp bảo vệ dựa trên cấp độ giáp và lượng máu đã mất. Trong trạng thái cuồng nộ, lớp giáp bảo vệ của anh ta sẽ suy yếu dần theo thời gian và khi hết giáp, anh ta sẽ phải nghỉ ngơi trước khi tích lũy cơn thịnh nộ trở lại.\n\nCơn thịnh nộ hiện tại: _%1$.0f%%_\n_+%2$.0f%%_ sát thương\n\nLớp giáp cuồng nộ với giáp và HP hiện tại: _%3$d_
actors.buffs.berserk.berserk=cuồng nộ
actors.buffs.berserk.berserk_desc=Nỗi sợ hãi và sự bất an tan biến, chỉ còn lại sự giận dữ. Ở trạng thái này, Berserker cực kỳ mạnh mẽ, gây ra sát thương +50%% và nhận thêm khiên chắn,_ nhưng cũng mất khiên chắn mỗi lượt.\n\nKhi tất cả khiên chắn của hắn giảm xuống 0, trạng thái cuồng nộ sẽ kết thúc.\n\nSau khi nổi cơn thịnh nộ, Berserker cần hồi phục trước khi có thể tích lũy cơn thịnh nộ một lần nữa.\n\nKhiên chắn còn lại: %d
actors.buffs.berserk.exhausted=kiệt sức
actors.buffs.berserk.no_seal=Bạn cần con dấu bị phá vỡ của mình để trở nên điên cuồng!
actors.buffs.berserk.rankings_desc=Cuồng nộ đến chết
actors.buffs.berserk.recovering=hồi phục
actors.buffs.berserk.recovering_desc=Sức mạnh nội tại có giới hạn. Chiến binh cuồng nộ phải nghỉ ngơi trước khi sử dụng cơn thịnh nộ của mình một lần nữa. Trong khi hồi phục, chiến binh cuồng nộ không tích lũy thêm cơn thịnh nộ nào từ việc chịu sát thương.
actors.buffs.berserk.recovering_desc_levels=Mức độ cho đến khi hồi phục: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Số lượt chơi cho đến khi hồi phục: _%d_
actors.buffs.bleeding.desc=Vết thương đó đang rỉ ra một lượng máu đáng lo ngại.\n\nChảy máu gây sát thương mỗi lượt. Mỗi lượt, sát thương giảm đi một lượng ngẫu nhiên, cho đến khi máu ngừng chảy hoàn toàn.\n\nSát thương chảy máu hiện tại: %d.
actors.buffs.bleeding.heromsg=Bạn đang chảy máu!
actors.buffs.bleeding.name=chảy máu
actors.buffs.bleeding.ondeath=Bạn đã chết vì mất máu...
actors.buffs.bleeding.rankings_desc=Chết vì mất máu
actors.buffs.bless.desc=Một sự bùng nổ tập trung tuyệt vời, một số người nói rằng nó được truyền cảm hứng từ các vị thần.\n\nPhước lành tăng độ chính xác và khả năng né tránh lên 25%%, khiến người được ban phước hiệu quả hơn nhiều trong chiến đấu.\n\nSố lượt ban phước còn lại: %s.
actors.buffs.bless.name=được ban phước
actors.buffs.blindness.desc=Mù lòa biến thế giới xung quanh thành một màn sương mù tối tăm.\n\nKhi bị mù, tầm nhìn của nhân vật bị giảm xuống còn một ô, khiến các đòn tấn công tầm xa trở nên vô dụng và rất dễ mất dấu kẻ thù ở xa. Ngoài ra, một anh hùng bị mù không thể đọc cuộn giấy hoặc sách.\n\nSố lượt mù còn lại: %s.
actors.buffs.blindness.heromsg=Bạn bị mù rồi!
actors.buffs.blindness.name=mù quáng
actors.buffs.blobimmunity.desc=Một thế lực kỳ lạ nào đó đang bao bọc bạn trong một lớp rào chắn bảo vệ mỏng, ngăn chặn mọi tác động có hại trong không khí. Bạn miễn nhiễm với mọi tác động trong phạm vi nhất định chừng nào lớp rào chắn này còn hiệu lực. Số lượt miễn nhiễm còn lại: 0.
actors.buffs.blobimmunity.name=rào cản thanh lọc
actors.buffs.burning.burnsup=%s bị cháy!
actors.buffs.burning.desc=Ít có điều gì đáng lo ngại hơn việc bị bao trùm trong ngọn lửa.\n\nLửa sẽ gây sát thương mỗi lượt cho đến khi bị dập tắt bởi nước hoặc tự tắt. Có thể dập tắt lửa bằng cách bước vào nước hoặc bằng cách sử dụng thuốc nổ.\n\nNgoài ra, lửa có thể bén vào địa hình hoặc vật phẩm dễ cháy mà nó tiếp xúc.\n\nSố lượt cháy còn lại: %s.
actors.buffs.burning.heromsg=Bạn bốc cháy!
actors.buffs.burning.name=đang cháy
actors.buffs.burning.ondeath=Bạn đã chết cháy...
actors.buffs.burning.rankings_desc=Cháy thành tro tàn
actors.buffs.championenemy$antimagic.desc=Các tướng chống phép thuật chịu ít hơn 50% sát thương và hoàn toàn miễn nhiễm với các hiệu ứng phép thuật.
actors.buffs.championenemy$antimagic.name=nhà vô địch chống phép thuật
actors.buffs.championenemy$blazing.desc=Những chiến binh rực lửa gây thêm 25% sát thương cận chiến, đốt cháy kẻ địch mà chúng tấn công, miễn nhiễm với lửa và lan tỏa lửa xung quanh khi chết. Tuy nhiên, chúng không thể lan tỏa lửa lên mặt nước.
actors.buffs.championenemy$blazing.name=nhà vô địch rực lửa
actors.buffs.championenemy$blessed.desc=Các tướng được ban phước có độ chính xác và khả năng né tránh gấp 4 lần.
actors.buffs.championenemy$blessed.name=nhà vô địch được ban phước
actors.buffs.championenemy$giant.desc=Các tướng khổng lồ chịu ít hơn 80% sát thương và có tầm tấn công +1, nhưng không thể di chuyển qua các không gian kín.
actors.buffs.championenemy$giant.name=nhà vô địch khổng lồ
actors.buffs.championenemy$growing.desc=Các tướng đang phát triển sẽ nhận được phần thưởng tăng dần về độ chính xác, né tránh, sát thương vật lý và giảm sát thương phải chịu.\n\nTăng độ chính xác/né tránh/sát thương hiện tại: %1$d%%\nGiảm sát thương hiện tại: %2$d%%
actors.buffs.championenemy$growing.name=nhà vô địch đang phát triển
actors.buffs.championenemy$projecting.desc=Các tướng được nâng cấp gây thêm 25% sát thương cận chiến và có tầm tấn công +3.
actors.buffs.championenemy$projecting.name=nhà vô địch dự đoán
actors.buffs.championenemy.warn=Bạn cảm nhận được một sự hiện diện chết người.
actors.buffs.charm.cant_attack=Bạn bị kẻ thù đó mê hoặc và không thể tấn công chúng.
actors.buffs.charm.desc=Bùa mê là một loại ma thuật thao túng có thể khiến kẻ thù tạm thời yêu mến lẫn nhau.\n\nCác nhân vật bị ảnh hưởng bởi bùa mê không thể trực tiếp tấn công kẻ thù đang bị mê hoặc. Tuy nhiên, vẫn có thể tấn công các mục tiêu khác. Cơn đau sẽ làm giảm thời gian hiệu lực của bùa mê.\n\nSố lượt bùa mê còn lại: %s.
actors.buffs.charm.heromsg=Bạn thật quyến rũ!
actors.buffs.charm.name=quyến rũ
actors.buffs.chill.desc=Chưa hoàn toàn đóng băng, nhưng vẫn còn quá lạnh.\n\nMục tiêu bị làm lạnh thực hiện tất cả các hành động chậm hơn, tùy thuộc vào số lượt còn lại của hiệu ứng. Ở mức độ tệ nhất, điều này tương đương với việc bị làm chậm.\n\nSố lượt làm lạnh còn lại: %1$s.\nTốc độ bị giảm đi: %2$s%%
actors.buffs.chill.freezes=%s bị treo!
actors.buffs.chill.name=ướp lạnh
actors.buffs.combo$combomove.clobber.desc=Đẩy lùi kẻ địch 2 ô, nhưng không gây sát thương và không thể đẩy chúng xuống hố. Tăng chuỗi combo lên 1.
actors.buffs.combo$combomove.clobber.empower_desc=Đẩy lùi kẻ địch 3 ô, gây chóng mặt và có thể hất xuống hố, nhưng không gây sát thương. Tăng chuỗi combo lên 1.
actors.buffs.combo$combomove.clobber.name=đánh đập
actors.buffs.combo$combomove.crush.desc=Gây sát thương %d%% (combo*25%%) lên mục tiêu chính, và một nửa sát thương đó lên tất cả kẻ địch khác trong phạm vi 7x7. Thiết lập lại combo khi sử dụng.
actors.buffs.combo$combomove.crush.empower_desc=_Nhảy lên ô %1$d_ và gây sát thương %2$d%% (combo*25%%) lên mục tiêu chính, và một nửa sát thương đó cho tất cả kẻ địch khác trong phạm vi 7x7. Thiết lập lại combo khi sử dụng.
actors.buffs.combo$combomove.crush.name=người mình thích
actors.buffs.combo$combomove.fury.desc=Mỗi đòn đánh sẽ gây sát thương lên kẻ địch một lần cho mỗi chuỗi combo bạn có, mỗi đòn gây ra 60% sát thương và có thể kích hoạt hiệu ứng tăng cường. Combo sẽ được thiết lập lại khi sử dụng.
actors.buffs.combo$combomove.fury.empower_desc=_Nhảy lên ô %d_ và tấn công kẻ địch một lần cho mỗi chuỗi combo bạn có, mỗi cú đánh gây 60%% sát thương và có thể kích hoạt hiệu ứng tăng cường. Thiết lập lại chuỗi combo khi sử dụng.
actors.buffs.combo$combomove.fury.name=cơn thịnh nộ
actors.buffs.combo$combomove.parry.desc=Khi được kích hoạt, kỹ năng này chặn đòn tấn công tiếp theo trong vòng 1 lượt và lập tức phản công. Thiết lập lại chuỗi combo nếu không có gì bị đỡ.
actors.buffs.combo$combomove.parry.empower_desc=Chặn tất cả các đòn tấn công trong vòng 1 lượt khi được kích hoạt, và phản công ngay lập tức. Thiết lập lại chuỗi combo nếu không có gì bị đỡ.
actors.buffs.combo$combomove.parry.name=đỡ đòn
actors.buffs.combo$combomove.slam.desc=Giảm %d%% (combo*20%%) sức mạnh chặn sát thương của bạn thành sát thương cộng thêm. Đặt lại combo khi sử dụng.
actors.buffs.combo$combomove.slam.empower_desc=_Nhảy lên ô %1$d_ và gây thêm sát thương bằng %2$d%% (combo*20%%) sức mạnh chặn sát thương của bạn. Đặt lại combo khi sử dụng.
actors.buffs.combo$combomove.slam.name=đập mạnh
actors.buffs.combo.action_name=đòn tấn công kết hợp
actors.buffs.combo.bad_target=Bạn phải nhắm mục tiêu vào kẻ địch trong tầm tấn công.
actors.buffs.combo.combo=%d đã thực hiện combo!
actors.buffs.combo.desc=Võ sĩ giác đấu tích lũy động lượng khi tung ra những đòn đánh thành công. Mỗi đòn tấn công sẽ tăng bộ đếm combo lên một, nhưng nếu khoảng thời gian giữa các đòn đánh quá lâu, bộ đếm combo sẽ đặt lại về 0. Trong khi võ sĩ giác đấu đang thực hiện combo, bất kỳ lớp bảo vệ nào anh ta có được từ ấn phong bị phá vỡ sẽ không bị mất đi.\n\n Việc xây dựng combo sẽ mở khóa các đòn tấn công combo đặc biệt không thể trượt! Một đòn tấn công khác nhau được mở khóa ở số combo 2, 4, 6, 8 và 10. Một số chiêu thức đặt lại combo và một số thì không, nhưng mỗi chiêu thức chỉ có thể được sử dụng một lần trong mỗi phiên combo.\n\n Combo hiện tại: %1$d.\n\n Số lượt cho đến khi mất Combo: %2$s.
actors.buffs.combo.name=combo
actors.buffs.combo.prompt=Chọn mục tiêu để tấn công.
actors.buffs.corrosion.desc=Axit mạnh có thể làm tan chảy thịt, kim loại và xương với tốc độ đáng báo động. Mức độ ăn mòn tăng dần theo thời gian khi mục tiêu tiếp tục bị tan chảy. Số lượt ăn mòn còn lại: 0.0 ...
actors.buffs.corrosion.heromsg=Bạn đang tan chảy!
actors.buffs.corrosion.name=ăn mòn
actors.buffs.corrosion.ondeath=Bạn tan biến...
actors.buffs.corrosion.rankings_desc=Đã hòa tan
actors.buffs.corruption.desc=Sự tha hóa len lỏi vào bản chất của một sinh vật, bóp méo chúng trái ngược với bản chất ban đầu. Những sinh vật bị tha hóa sẽ tấn công đồng minh của chúng và bỏ mặc kẻ thù cũ. Sự tha hóa cũng gây hại và sẽ từ từ khiến mục tiêu gục ngã. Sự tha hóa là vĩnh viễn, tác động của nó chỉ kết thúc khi chết.
actors.buffs.corruption.name=bị hỏng
actors.buffs.cripple.desc=Bạn khá chắc chắn rằng chân không được thiết kế để uốn cong như vậy.\n\nBị thương làm giảm một nửa tốc độ di chuyển, khiến việc di chuyển một ô thường mất hai lượt thay vì một.\n\nSố lượt bị thương còn lại: %s.
actors.buffs.cripple.heromsg=Bạn bị tàn tật!
actors.buffs.cripple.name=tàn tật
actors.buffs.daze.desc=Ù tai và mờ mắt khiến việc chiến đấu trở nên khó khăn.\n\nKhi bị choáng váng, độ chính xác và khả năng né tránh giảm đi 50%%, khiến việc tung đòn và né đòn trở nên khó khăn hơn nhiều.\n\nSố lượt choáng váng còn lại: %s.
actors.buffs.daze.heromsg=Bạn đang choáng váng!
actors.buffs.daze.name=choáng váng
actors.buffs.degrade.desc=Ma thuật hắc ám mạnh mẽ đang hút cạn sức mạnh mà các cuộn giấy nâng cấp đã mang lại cho trang bị của bạn!\n\nKhi bị suy yếu, trang bị đã nâng cấp sẽ được coi như có cấp độ thấp hơn so với thực tế. _Mỗi lần nâng cấp sau +3 sẽ yếu đi theo cấp số nhân so với lần nâng cấp trước đó._ Mô tả vật phẩm của bạn sẽ thay đổi để phản ánh mức sức mạnh giảm đi.\n\nSự suy yếu không ảnh hưởng đến yêu cầu sức mạnh, số lần sử dụng đũa phép, độ bền của vũ khí ném hoặc cổ vật.\n\nSố lượt suy yếu còn lại: %s. Sử dụng cuộn giấy nâng cấp hoặc hóa giải lời nguyền sẽ chấm dứt sự suy yếu ngay lập tức.
actors.buffs.degrade.heromsg=Thiết bị của bạn có vẻ yếu hơn!
actors.buffs.degrade.name=bị suy thoái
actors.buffs.doom.desc=Thật khó để tiếp tục khi dường như vũ trụ muốn bạn chết.\n\nDoomed characters will receive +67% damage from all sources.\n\nDoom is permanent, its effects only end when death.
actors.buffs.doom.name=bị diệt vong
actors.buffs.dread.desc=Một nỗi kinh hoàng lớn đến mức khiến mục tiêu phải bỏ chạy khỏi hầm ngục hoàn toàn!\n\nNhững sinh vật bị ảnh hưởng bởi nỗi kinh hoàng sẽ chạy trốn khỏi đối thủ với tốc độ cao và sẽ biến mất hoàn toàn khỏi hầm ngục khi khuất tầm nhìn. Kẻ thù bị đánh bại theo cách này sẽ nhận được một nửa kinh nghiệm và không rơi ra vật phẩm nào. Cơn đau nhói sẽ làm giảm thời gian kéo dài của nỗi kinh hoàng.\n\nSố lượt kinh hoàng còn lại: %d.
actors.buffs.dread.name=sợ hãi
actors.buffs.drowsy.desc=Một thế lực ma thuật khiến việc tỉnh táo trở nên khó khăn, sau vài lượt, mục tiêu sẽ rơi vào giấc ngủ ma thuật sâu.\n\nAnh hùng có thể chống lại cơn buồn ngủ bằng cách chịu sát thương hoặc bằng cách ở trạng thái đầy đủ máu.\n\nSố lượt cho đến khi ngủ: %s.
actors.buffs.drowsy.name=buồn ngủ
actors.buffs.earthimbue.desc=Bạn được ban cho sức mạnh của đất!\n\nTất cả các đòn tấn công vật lý sẽ làm dịch chuyển mặt đất dưới chân kẻ thù, làm chúng tê liệt trong một thời gian ngắn.\n\nSố lượt ban cho sức mạnh đất còn lại: %s.
actors.buffs.earthimbue.name=thấm đẫm đất
actors.buffs.enhancedrings.desc=Vật phẩm cổ xưa mà tên trộm vừa sử dụng đang tăng sức mạnh cho những chiếc nhẫn của hắn, giúp chúng tăng thêm +1 cấp độ.\n\nSố lượt còn lại: %s.
actors.buffs.enhancedrings.name=vòng tăng cường
actors.buffs.fireimbue.desc=Bạn được ban cho sức mạnh của lửa!\n\nTất cả các đòn tấn công vật lý đều có cơ hội đốt cháy kẻ thù. Ngoài ra, bạn hoàn toàn miễn nhiễm với các hiệu ứng của lửa.\n\nSố lượt ban lửa còn lại: %s.
actors.buffs.fireimbue.name=thấm đẫm lửa
actors.buffs.foresight.desc=Bằng cách nào đó, bạn có thể nhìn thấy bố cục địa hình xung quanh bằng tâm trí.\n\nKhi đang chịu ảnh hưởng của khả năng nhìn xa trông rộng, tất cả các ô trong bán kính rộng đều được hiển thị cho bạn, bao gồm cả bất kỳ bẫy hoặc cửa bí mật nào.\n\nSố lượt nhìn xa trông rộng còn lại: %s.
actors.buffs.foresight.name=tầm nhìn xa
actors.buffs.frost.desc=Không nên nhầm lẫn với việc đóng băng hoàn toàn, kiểu đóng băng nhẹ nhàng hơn này chỉ đơn giản là bao bọc mục tiêu trong băng.\n\nĐóng băng hoạt động tương tự như tê liệt, khiến mục tiêu không thể hành động. Không giống như tê liệt, đóng băng sẽ bị hủy bỏ ngay lập tức nếu mục tiêu bị thương, vì băng sẽ vỡ vụn.\n\nSố lượt đóng băng còn lại: %s.
actors.buffs.frost.freezes=%s bị treo!
actors.buffs.frost.name=đông lạnh
actors.buffs.frostimbue.desc=Bạn được ban cho sức mạnh băng giá!\n\nTất cả các đòn tấn công vật lý sẽ liên tục gây hiệu ứng đóng băng lên kẻ địch. Ngoài ra, bạn hoàn toàn miễn nhiễm với cái lạnh.\n\nSố lượt đóng băng còn lại: %s.
actors.buffs.frostimbue.name=thấm đẫm sương giá
actors.buffs.fury.desc=Bạn đang tức giận, kẻ thù sẽ không thích bạn khi bạn tức giận. Một cơn thịnh nộ lớn bùng cháy trong bạn, làm tăng sát thương bạn gây ra bằng các đòn tấn công vật lý lên 50. Cơn thịnh nộ này sẽ kéo dài cho đến khi bạn bị thương và lượng máu dưới 50.
actors.buffs.fury.heromsg=Bạn trở nên tức giận!
actors.buffs.fury.name=giận dữ
actors.buffs.gravitychaostracker.desc_duration=Chưa rõ hiệu quả này sẽ kéo dài bao lâu, nhưng chắc chắn không thể kéo dài mãi mãi.
actors.buffs.gravitychaostracker.desc_intro=Cứ sau vài lượt, tất cả nhân vật trên tầng hầm ngục hiện tại sẽ bị đẩy theo một hướng ngẫu nhiên.
actors.buffs.gravitychaostracker.desc_positive=Tuy nhiên, có vẻ như bạn và các đồng minh của bạn miễn nhiễm.
actors.buffs.gravitychaostracker.name=hỗn loạn trọng lực
actors.buffs.greaterhaste.desc=Một sự tăng tốc đáng kinh ngạc, trong khoảnh khắc đó, mọi thứ xung quanh dường như đứng yên.\n\nTrong khi chịu ảnh hưởng của hiệu ứng tăng tốc, các hành động di chuyển diễn ra gần như không mất thời gian, nhưng các hành động khác vẫn được thực hiện với tốc độ bình thường. Mỗi bước di chuyển tiêu tốn một lượt tăng tốc.\n\nSố lượt tăng tốc còn lại: %d.
actors.buffs.greaterhaste.name=vội vàng hơn
actors.buffs.haste.desc=Năng lượng tràn ngập cơ bắp, cho phép bạn chạy với tốc độ đáng kinh ngạc!\n\nKhi đang chịu ảnh hưởng của hiệu ứng tăng tốc, bạn sẽ chạy với tốc độ gấp 3 lần, nhưng thực hiện tất cả các hành động khác ở tốc độ bình thường.\n\nSố lượt tăng tốc còn lại: %s.
actors.buffs.haste.name=vội vàng
actors.buffs.healing.desc=Một phương thuốc kỳ diệu đang giúp vết thương lành lại và da thịt liền lại.\n\nMỗi lượt, máu sẽ dần hồi phục cho đến khi hiệu ứng hồi phục hết tác dụng. Lượng hồi phục có thể giảm dần theo thời gian.\n\nLần hồi phục tiếp theo: %d.\n\nLượng hồi phục còn lại: %d.
actors.buffs.healing.name=đang lành lại
actors.buffs.herodisguise.desc=Phép thuật ảo ảnh đã làm thay đổi ngoại hình của bạn! Hiệu ứng này chỉ mang tính chất thẩm mỹ, nhưng dù sao thì cảm giác cũng rất kỳ lạ.\n\nSố lượt ngụy trang còn lại: %s.
actors.buffs.herodisguise.name=cải trang
actors.buffs.hex.desc=Ma thuật hắc ám làm suy yếu sự tập trung, khiến mục tiêu hơi mất phương hướng.\n\n Việc sử dụng bùa chú làm giảm độ chính xác và khả năng né tránh đi 20%%, khiến mục tiêu kém hiệu quả hơn trong chiến đấu.\n\n Số lượt còn lại của bùa chú: %s.
actors.buffs.hex.heromsg=Bạn đã bị yểm bùa!
actors.buffs.hex.name=bị yểm bùa
actors.buffs.holdfast.desc=Chiến binh đang giữ vững vị trí, tăng giáp lên %1$d-%2$d và làm chậm tốc độ suy giảm của một số hiệu ứng tăng cường bằng %3$d%%. Hiệu ứng này sẽ kéo dài cho đến khi anh ta di chuyển.
actors.buffs.holdfast.name=giữ chặt
actors.buffs.hunger.cursedhorn=Chiếc sừng bị nguyền rủa sẽ hút một phần năng lượng từ thức ăn khi bạn ăn.
actors.buffs.hunger.desc=Cơn đói sẽ tăng dần khi bạn ở trong hầm ngục, cuối cùng bạn sẽ bắt đầu chết đói. Trong khi chết đói, bạn sẽ từ từ mất máu thay vì hồi phục. Việc phân bổ thức ăn rất quan trọng! Nếu bạn còn đủ máu, việc nhịn đói không phải là ý kiến tồi nếu điều đó có nghĩa là sẽ có thêm thức ăn sau này. Phân bổ thức ăn hiệu quả có thể giúp thức ăn dùng được lâu hơn rất nhiều!
actors.buffs.hunger.desc_intro_hungry=Bạn có thể cảm thấy bụng mình đang kêu đói, nhưng chưa đến mức quá cấp bách.
actors.buffs.hunger.desc_intro_starving=Bạn đói đến mức đau bụng.
actors.buffs.hunger.hungry=đói bụng
actors.buffs.hunger.ondeath=Bạn chết vì đói...
actors.buffs.hunger.onhungry=Bạn đang đói.
actors.buffs.hunger.onstarving=Bạn đang chết đói!
actors.buffs.hunger.rankings_desc=Chết đói
actors.buffs.hunger.starving=chết đói
actors.buffs.invisibility.desc=Bạn hoàn toàn hòa mình vào địa hình xung quanh, khiến bạn không thể bị nhìn thấy.\n\nTrong khi bạn tàng hình, kẻ thù không thể tấn công hoặc đuổi theo bạn. Các đòn tấn công vật lý và hiệu ứng ma thuật (như cuộn giấy và đũa phép) sẽ ngay lập tức hủy bỏ trạng thái tàng hình.\n\nSố lượt tàng hình còn lại: %s.
actors.buffs.invisibility.name=vô hình
actors.buffs.invulnerability.desc=Nhân vật này được bao bọc bởi sức mạnh bảo vệ to lớn, ban cho họ một khoảng thời gian ngắn bất khả xâm phạm!\n\nSố lượt còn lại: %s.
actors.buffs.invulnerability.name=bất khả xâm phạm
actors.buffs.levitation.desc=Một lực lượng ma thuật đang nâng bạn lơ lửng trên mặt đất, khiến bạn cảm thấy không trọng lượng.\n\n Các nhân vật đang lơ lửng di chuyển im lặng và bỏ qua tất cả các hiệu ứng trên mặt đất. Bẫy sẽ không kích hoạt, nước sẽ không dập tắt lửa, cây cối sẽ không bị giẫm đạp, rễ cây sẽ không chạm tới, và hố sẽ được lơ lửng qua. Hãy cẩn thận, vì tất cả những điều này có thể xảy ra ngay khi trạng thái lơ lửng kết thúc!\n\n Số lượt lơ lửng còn lại: %s.
actors.buffs.levitation.name=lơ lửng
actors.buffs.lifelink.desc=Sinh lực của nhân vật này được liên kết với một nhân vật khác ở gần đó. Mọi sát thương nhận phải sẽ được chia sẻ giữa hai người.\n\nMỗi khi nhân vật này nhận sát thương, một nửa sát thương sẽ được chuyển cho mục tiêu liên kết sinh lực.\n\nSố lượt liên kết sinh lực còn lại: %s.
actors.buffs.lifelink.name=liên kết cuộc sống
actors.buffs.lifelink.ondeath=Chính tổn thương liên quan đến sinh mệnh đã giết chết bạn...
actors.buffs.light.desc=Ngay cả trong Hầm Ngục Tăm Tối Nhất, một ánh sáng ổn định bên cạnh luôn mang lại cảm giác an tâm. Ánh sáng giúp xua tan bóng tối, cho phép bạn nhìn thấy một khoảng cách hợp lý bất chấp môi trường xung quanh. Số lượt chiếu sáng còn lại: 0.
actors.buffs.light.name=được chiếu sáng
actors.buffs.lockedfloor.desc=Tầng hiện tại đang bị khóa và bạn không thể rời khỏi!\n\nKhi một tầng bị khóa, bạn sẽ không bị đói hoặc bị sát thương do đói. Ngoài ra, nếu bạn không cố gắng đánh bại trùm của tầng này, các hiệu ứng hồi phục thụ động cũng sẽ dừng lại.\n\nThêm vào đó, nếu bạn được hồi sinh bởi một chiếc ankh không được ban phước trong khi tầng bị khóa, thì nó sẽ được thiết lập lại.\n\nHãy tiêu diệt trùm của tầng này để phá khóa.
actors.buffs.lockedfloor.name=Tầng này bị khóa
actors.buffs.lostinventory.desc=Toàn bộ đồ đạc của bạn đã bị thất lạc ở đâu đó trong hầm ngục! Bạn sẽ không thể nhặt hoặc sử dụng hầu hết các vật phẩm cho đến khi tìm lại được chúng.
actors.buffs.lostinventory.name=hàng tồn kho bị mất
actors.buffs.magicalsight.desc=Bằng cách nào đó bạn có thể nhìn bằng tâm trí chứ không phải bằng mắt.\n\nKhi khả năng nhìn xuyên thấu được kích hoạt, bạn sẽ có thể nhìn xuyên qua mọi địa hình trong bán kính 12 ô.\n\nSố lượt nhìn xuyên thấu còn lại: %s.
actors.buffs.magicalsight.name=cảnh tượng kỳ diệu
actors.buffs.magicalsleep.desc=Nhân vật này đã rơi vào giấc ngủ ma thuật sâu và sẽ không thể tỉnh dậy một cách tự nhiên. Giấc ngủ ma thuật tương tự như giấc ngủ thông thường, ngoại trừ việc chỉ khi bị sát thương mới khiến mục tiêu tỉnh dậy. Đối với người anh hùng và đồng minh của họ, giấc ngủ ma thuật có một số đặc tính phục hồi, cho phép họ nhanh chóng hồi phục trong khi nghỉ ngơi.
actors.buffs.magicalsleep.fallasleep=Bạn chìm vào giấc ngủ sâu đầy mê hoặc.
actors.buffs.magicalsleep.name=giấc ngủ kỳ diệu
actors.buffs.magicalsleep.toohealthy=Bạn quá khỏe mạnh và không hề cảm thấy buồn ngủ.
actors.buffs.magicalsleep.wakeup=Bạn thức dậy với cảm giác sảng khoái và khỏe khoắn.
actors.buffs.magicimmune.desc=Tất cả các hiệu ứng ma thuật đã mất tác dụng lên bạn, bạn hoàn toàn miễn nhiễm với chúng.\n\nTrong khi miễn nhiễm ma thuật, tất cả các hiệu ứng ma thuật có hại và có lợi sẽ không áp dụng cho bạn, bao gồm cả lời nguyền, bùa chú, đũa phép, cuộn giấy, nhẫn, cổ vật, v.v. Khả năng của áo giáp anh hùng đủ mạnh để hoạt động bất chấp hiệu ứng này.\n\nSố lượt miễn nhiễm ma thuật còn lại: %s.
actors.buffs.magicimmune.name=miễn nhiễm với phép thuật
actors.buffs.mindvision.desc=Bằng cách nào đó, bạn có thể nhìn thấy tất cả sinh vật trên tầng này thông qua tâm trí. Đó là một cảm giác kỳ lạ.\n\nTất cả các nhân vật trên tầng này đều hiển thị với bạn miễn là bạn có khả năng nhìn thấy bằng tâm trí. Việc nhìn thấy một sinh vật thông qua tâm trí được tính là đã nhìn thấy hoặc ở gần nó đối với mục đích của nhiều hiệu ứng ma thuật.\n\nSố lượt nhìn thấy bằng tâm trí còn lại: %s.
actors.buffs.mindvision.name=tầm nhìn tâm trí
actors.buffs.momentum.action_name=chạy tự do
actors.buffs.momentum.momentum=tạo đà
actors.buffs.momentum.momentum_desc=Khi di chuyển, Freerunner tích lũy động lượng, mà anh ta có thể sử dụng để bắt đầu chạy tự do. Mỗi lần tích lũy động lượng cho phép hai lượt chạy tự do, và Freerunner có thể tích lũy tối đa 10 lần. Động lượng sẽ nhanh chóng mất đi khi Freerunner dừng lại.
actors.buffs.momentum.resting=hồi phục
actors.buffs.momentum.resting_desc=Khi di chuyển, Freerunner tích lũy đà, và anh ta có thể sử dụng đà đó để bắt đầu chạy tự do.\n\nFreerunner cần thời gian để lấy lại sức bền trước khi tích lũy đà một lần nữa.\n\nSố lượt còn lại: %d.
actors.buffs.momentum.running=chạy tự do
actors.buffs.momentum.running_desc=Khi di chuyển, Freerunner tích lũy động lượng, mà anh ta có thể sử dụng để bắt đầu chạy tự do.\n\nTrong khi chạy tự do, Freerunner di chuyển với tốc độ gấp đôi và nhận được điểm né tránh thưởng dựa trên cấp độ của mình.\n\nSố lượt còn lại: %d.
actors.buffs.monkenergy$monkability$dash.desc=Lướt nhanh tức thì tối đa 4 ô. Khả năng này có thể vượt qua chướng ngại vật, nhưng không thể xuyên qua kẻ thù hoặc địa hình rắn chắc.
actors.buffs.monkenergy$monkability$dash.empower_desc=Một cú lao nhanh tức thì lên đến _8 ô_. Khả năng này có thể vượt qua các chướng ngại vật, nhưng không thể xuyên qua kẻ thù hoặc địa hình rắn chắc.
actors.buffs.monkenergy$monkability$dash.name=dấu gạch ngang
actors.buffs.monkenergy$monkability$dash.prompt=Chọn vị trí
actors.buffs.monkenergy$monkability$dragonkick.desc=Một cú đá tàn phá gây sát thương %1$d-%2$d và bỏ qua giáp. Cú đá hất văng mục tiêu và làm tê liệt chúng trên mỗi ô mà chúng di chuyển.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Một cú đá tàn phá gây ra sát thương _%1$d-%2$d_ và bỏ qua giáp. Cú đá hất văng _tất cả mục tiêu liền kề_ và làm tê liệt chúng trên mỗi ô chúng di chuyển.
actors.buffs.monkenergy$monkability$dragonkick.name=cú đá rồng
actors.buffs.monkenergy$monkability$flurry.desc=Hai đòn tấn công tức thời gây sát thương %1$d-%2$d và bỏ qua giáp. Khả năng này không thể sử dụng nhiều lần.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Hai đòn tấn công tức thời gây sát thương %1$d-%2$d, bỏ qua giáp và sử dụng hiệu ứng cường hóa của vũ khí. Khả năng này không thể sử dụng nhiều lần.
actors.buffs.monkenergy$monkability$flurry.name=cơn mưa đòn đánh
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Vị sư tập trung quan sát xung quanh, dự đoán đòn tấn công tiếp theo nhắm vào mình. Khi tập trung, bà chắc chắn sẽ đỡ được đòn tấn công sắp tới.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=tập trung
actors.buffs.monkenergy$monkability$focus.desc=Vị sư chuyển sang tập trung, để cô ấy đỡ đòn tấn công tiếp theo nhắm vào mình.
actors.buffs.monkenergy$monkability$focus.empower_desc=Vị sư _lập tức tập trung_, cho phép cô ấy đỡ được đòn tấn công tiếp theo nhắm vào mình.
actors.buffs.monkenergy$monkability$focus.name=tập trung
actors.buffs.monkenergy$monkability$meditate.desc=Vị sư tập trung năng lượng vào cơ thể trong 5 lượt. Điều này giúp loại bỏ hầu hết các hiệu ứng tiêu cực và cho phép cô ấy nạp lại năng lượng cho đũa phép và bảo vật trong 8 lượt.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Vị sư tập trung năng lượng vào cơ thể trong 5 lượt. Điều này giúp loại bỏ hầu hết các hiệu ứng tiêu cực và cho phép cô ấy nạp lại năng lượng cho gậy phép và vật phẩm trong 8 lượt. _Cô ấy cũng nhận được 80% khả năng kháng sát thương khi thiền định, và từ từ hồi phục 20% lượng HP đã mất._
actors.buffs.monkenergy$monkability$meditate.name=thiền định
actors.buffs.monkenergy.action=Khả năng của nhà sư
actors.buffs.monkenergy.desc=Khi đánh bại kẻ thù, Nữ tu sĩ sẽ nhận được năng lượng mà cô có thể sử dụng cho nhiều khả năng khác nhau. Hầu hết kẻ thù đều cho 1 điểm năng lượng khi bị đánh bại, và Nữ tu sĩ không bị mất năng lượng theo thời gian.\n\nNăng lượng hiện tại: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Vị sư vừa sử dụng một kỹ năng và phải chờ trước khi sử dụng kỹ năng khác.\n\nThời gian hồi chiêu hiện tại: %d lượt.
actors.buffs.monkenergy.name=năng lượng
actors.buffs.ooze.desc=Axit dính này bám vào thịt, từ từ làm tan chảy nó.\n\nChất nhầy sẽ gây sát thương liên tục theo thời gian, nhưng có thể được rửa sạch ngay lập tức bằng nước.\n\nSố lượt chất nhầy còn lại: %s.
actors.buffs.ooze.heromsg=Chất dịch ăn mòn sẽ làm tổn hại da thịt bạn. Hãy rửa sạch nó đi!
actors.buffs.ooze.name=chất lỏng ăn mòn
actors.buffs.ooze.ondeath=Bạn tan biến...
actors.buffs.ooze.rankings_desc=Đã hòa tan
actors.buffs.paralysis.desc=Thông thường, điều tồi tệ nhất cần làm là không làm gì cả.\n\nTê liệt hoàn toàn ngăn chặn mọi hành động, buộc mục tiêu phải chờ cho đến khi hiệu ứng hết tác dụng. Cơn đau do bị thương có thể khiến nhân vật chống lại sự tê liệt, giúp họ thoát khỏi hiệu ứng.\n\nSố lượt tê liệt còn lại: %s.
actors.buffs.paralysis.heromsg=Bạn bị liệt rồi!
actors.buffs.paralysis.name=bị tê liệt
actors.buffs.paralysis.out=chống lại sự tê liệt
actors.buffs.physicalempower.desc=Đòn đánh của bạn đã được tăng sức mạnh, làm tăng lượng sát thương bạn có thể gây ra khi tấn công kẻ thù bằng các đòn đánh vật lý.\n\nSát thương cộng thêm: %1$d.\nCòn lại: %2$d.
actors.buffs.physicalempower.name=được trao quyền về thể chất
actors.buffs.pincushion.desc=Các vũ khí bạn đã ném vào nhân vật này hiện đang bị dính vào người họ và sẽ rơi xuống sàn sau khi họ bị đánh bại.\n\nCác vật phẩm sau hiện đang được gắn vào:
actors.buffs.pincushion.name=gối kim
actors.buffs.poison.desc=Chất độc ngấm dần vào cơ thể, từ từ làm suy yếu các chức năng bên trong.\n\n Chất độc gây sát thương mỗi lượt tỷ lệ thuận với thời gian còn lại trước khi hết tác dụng.\n\n Số lượt còn lại của chất độc: %s.
actors.buffs.poison.heromsg=Bạn đã bị trúng độc!
actors.buffs.poison.name=bị đầu độc
actors.buffs.poison.ondeath=Bạn chết vì bị trúng độc...
actors.buffs.poison.rankings_desc=Chết vì trúng độc
actors.buffs.preparation.action_name=cuộc tấn công đã chuẩn bị
actors.buffs.preparation.assassinated=bị ám sát
actors.buffs.preparation.desc=Tên sát thủ đang kiên nhẫn chờ đợi, chuẩn bị ra tay từ trong bóng tối.
actors.buffs.preparation.desc_blink=Anh ta có khả năng dịch chuyển tức thời về phía kẻ thù trước khi tấn công, với khoảng cách tối đa là _%d._
actors.buffs.preparation.desc_dmg=Đòn tấn công tiếp theo của hắn sẽ gây thêm _%1$d%% sát thương_, và sẽ tiêu diệt kẻ địch thông thường có lượng máu dưới _%2$d%%, hoặc trùm có lượng máu dưới _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=Cuộc tấn công cũng sẽ có nhiều khả năng gây ra thiệt hại lớn hơn.
actors.buffs.preparation.desc_invis_next=Chuyển sang chế độ tấn công mạnh hơn: _%d._
actors.buffs.preparation.desc_invis_time=Số lượt tàng hình: _%d._
actors.buffs.preparation.name=sự chuẩn bị
actors.buffs.preparation.no_target=Không có gì để tấn công ở đó cả.
actors.buffs.preparation.out_of_reach=Mục tiêu đó nằm ngoài tầm với.
actors.buffs.preparation.prompt=Chọn mục tiêu để tấn công!\nKhoảng cách dịch chuyển tối đa: %d
actors.buffs.prismaticguard.desc=Bạn đang được bảo vệ bởi một hình ảnh lăng kính hiện đang ở trạng thái không hoạt động. Khi kẻ thù xuất hiện, hình ảnh lăng kính sẽ lập tức hoạt động và bảo vệ bạn!\n\nTrong khi không hoạt động, hình ảnh lăng kính sẽ dần dần hồi phục khỏi mọi sát thương mà nó đã nhận.\n\nHP hiện tại: %d/%d.
actors.buffs.prismaticguard.desc_many=Hình ảnh lăng kính này cũng được hưởng lợi từ Sức mạnh của số đông. Số lượt còn lại: %d.
actors.buffs.prismaticguard.name=Bảo vệ lăng kính
actors.buffs.recharging.desc=Năng lượng đang chảy khắp cơ thể bạn, giúp tăng tốc độ sạc cho đũa phép và trượng của bạn.\n\nMỗi lượt, hiệu ứng này sẽ tăng lượng điện tích hiện tại lên một phần tư, ngoài khả năng sạc thông thường.\n\nSố lượt sạc còn lại: %s.
actors.buffs.recharging.name=sạc
actors.buffs.revealedarea.desc=Một khu vực trong hầm ngục đã tạm thời được hé lộ cho người anh hùng. Họ sẽ nhìn thấy nó bất kể họ đang ở đâu. \n\nSố lượt còn lại: %s.
actors.buffs.revealedarea.name=khu vực được tiết lộ
actors.buffs.revealedchar.desc=Nhân vật này được tiết lộ cho người hùng. Họ sẽ hiển thị bất kể họ ở đâu. \n\nSố lượt còn lại: %s.
actors.buffs.revealedchar.name=tiết lộ
actors.buffs.roots.desc=Rễ cây (ma thuật hoặc tự nhiên) bám chặt lấy chân, ép chúng xuống đất.\n\nRễ cây khóa mục tiêu tại chỗ, khiến việc di chuyển và hầu hết các khả năng di chuyển đều không thể thực hiện được. Các hành động khác không bị ảnh hưởng, bao gồm cả hiệu ứng dịch chuyển tức thời.\n\nSố lượt của rễ cây còn lại: %s.
actors.buffs.roots.heromsg=Bạn không thể di chuyển!
actors.buffs.roots.name=bám rễ
actors.buffs.scrollempower.desc=Năng lượng từ cuộn giấy mà Pháp sư vừa đọc đang tiếp thêm sức mạnh cho cây đũa phép của hắn!\n\n Tăng cấp: +%1$d.\n Số lần phóng điện còn lại: %2$d.
actors.buffs.scrollempower.name=cuộn tăng cường
actors.buffs.shadows.desc=Bạn hòa mình vào bóng tối xung quanh, giúp bạn tàng hình và làm chậm quá trình trao đổi chất. Trong khi tàng hình, kẻ thù không thể tấn công hoặc đuổi theo bạn. Hầu hết các đòn tấn công vật lý và hiệu ứng ma thuật (như cuộn giấy phép thuật và đũa phép) sẽ ngay lập tức vô hiệu hóa khả năng tàng hình. Ngoài ra, khi hòa mình vào bóng tối, tốc độ đói của bạn sẽ chậm lại. Bạn sẽ duy trì trạng thái hòa mình vào bóng tối cho đến khi bạn rời khỏi bóng tối hoặc kẻ thù tiếp xúc với bạn.
actors.buffs.shadows.name=bóng tối hòa quyện
actors.buffs.slow.desc=Phép thuật làm chậm ảnh hưởng đến tốc độ thời gian của mục tiêu, đối với họ mọi thứ đều diễn ra siêu nhanh.\n\n Nhân vật bị làm chậm thực hiện tất cả các hành động trong thời gian gấp đôi so với bình thường.\n\n Số lượt làm chậm còn lại: %s.
actors.buffs.slow.name=chậm lại
actors.buffs.snipersmark.action_name_snapshot=ảnh chụp nhanh
actors.buffs.snipersmark.action_name_sniper=phát súng bắn tỉa
actors.buffs.snipersmark.action_name_volley=bóng chuyền
actors.buffs.snipersmark.desc=Xạ thủ đang tập trung vào mục tiêu mà cô ta vừa tấn công. Cô ta có thể thực hiện một đòn tấn công đặc biệt bằng cung tên, đòn tấn công này sẽ khác nhau tùy thuộc vào cách cung tên được nâng cấp.\n\nMột cây cung chưa được nâng cấp sẽ bắn ra một _phát bắn nhanh_, gây sát thương giảm nhưng không mất thời gian để bắn.\n\nMột cây cung được nâng cấp tốc độ sẽ bắn ra một _loạt_ ba mũi tên. Mỗi mũi tên sẽ gây sát thương giảm, nhưng vẫn có thể kích hoạt hiệu ứng phép thuật. Loạt bắn này mất 1 lượt để bắn.\n\nMột cây cung được nâng cấp sát thương sẽ bắn ra một _phát bắn tỉa_. Phát bắn này chắc chắn trúng đích, gây thêm sát thương dựa trên khoảng cách đến mục tiêu và mất 2 lượt để bắn.\n\nSố lượt còn lại: %s.
actors.buffs.snipersmark.name=dấu hiệu của tay bắn tỉa
actors.buffs.soulmark.desc=Phù thủy đã kết nối với linh hồn của sinh vật này, cho phép hắn tự chữa lành khi sinh vật này chịu sát thương vật lý.\n\nSố lượt còn lại của dấu ấn linh hồn: %s.
actors.buffs.soulmark.name=linh hồn được đánh dấu
actors.buffs.stamina.desc=Bạn có sức bền vô tận, cho phép di chuyển nhanh hơn!\n\nKhi đang chịu ảnh hưởng của sức bền, bạn sẽ chạy với tốc độ +50%%, nhưng sẽ thực hiện tất cả các hành động khác ở tốc độ bình thường.\n\nSố lượt sức bền còn lại: %s.
actors.buffs.stamina.name=sự bền bỉ
actors.buffs.terror.desc=Khủng bố là một loại ma thuật thao túng, buộc mục tiêu phải rơi vào trạng thái hoảng loạn không thể kiểm soát.\n\n Các nhân vật bị khủng bố buộc phải chạy trốn khỏi đối thủ, cố gắng tạo ra càng nhiều cửa và tường ngăn cách giữa họ càng tốt. Tuy nhiên, cơn đau sẽ làm giảm thời gian kéo dài của sự khủng bố.\n\n Số lượt khủng bố còn lại: %s.
actors.buffs.terror.name=kinh hãi
actors.buffs.toxicimbue.desc=Bạn được truyền năng lượng độc hại!\n\nKhi bạn di chuyển, khí độc sẽ liên tục bốc ra từ bạn, gây sát thương cho kẻ thù. Bạn miễn nhiễm với khí độc và chất độc trong suốt thời gian hiệu ứng, cũng như trong vài lượt sau đó.\n\nSố lượt còn lại của hiệu ứng truyền độc: %s.
actors.buffs.toxicimbue.name=thấm đẫm độc tố
actors.buffs.vertigo.desc=Đi thẳng có thể khó khăn khi cả thế giới đang quay cuồng.\n\nKhi bị chóng mặt, các nhân vật cố gắng di chuyển sẽ đi theo hướng ngẫu nhiên, thay vì hướng họ dự định.\n\nSố lượt chóng mặt còn lại: %s.
actors.buffs.vertigo.name=chóng mặt
actors.buffs.vulnerable.desc=Phép thuật điểm yếu làm tăng tất cả sát thương vật lý mà nhân vật phải chịu lên 33%%, sau khi sát thương đó đã bị giảm bởi giáp.\n\nSố lượt điểm yếu còn lại: %s.
actors.buffs.vulnerable.heromsg=Bạn cảm thấy mình thật dễ tổn thương!
actors.buffs.vulnerable.name=dễ bị tổn thương
actors.buffs.wandempower.desc=Gậy phép gây sát thương của bạn đã được cường hóa, tăng lượng sát thương gây ra trong vài lần tấn công.\n\nSát thương cộng thêm: %1$d.\nSố lần tấn công còn lại: %2$d.
actors.buffs.wandempower.name=đũa phép được trao quyền
actors.buffs.weakness.desc=Mọi thứ đột nhiên trở nên nặng nề hơn rất nhiều.\n\nPhép thuật làm suy yếu làm giảm sức mạnh thể chất của nhân vật, khiến họ gây ra 33%% sát thương giảm.\n\nSố lượt suy yếu còn lại: %s.
actors.buffs.weakness.heromsg=Bạn cảm thấy yếu ớt!
actors.buffs.weakness.name=suy yếu
actors.buffs.wellfed.desc=Bạn cảm thấy khá hài lòng và no bụng.\n\nKhi đã no, cơn đói của bạn sẽ không tăng lên, và bạn sẽ hồi phục thêm một lượng sức khỏe theo thời gian.\n\nSố lượt còn lại: %d.
actors.buffs.wellfed.name=được nuôi dưỡng tốt
actors.char.def_verb=né tránh
actors.char.def_verb_blocked=bị chặn
actors.char.defeat=Bạn đã đánh bại %s.
actors.char.immune=miễn dịch
actors.char.invulnerable=bất khả xâm phạm
actors.char.kill=%s đã giết bạn...
actors.hero.abilities.armorability.cost=Chi phí sạc: _%d_
actors.hero.abilities.armorability.no_target=Chẳng có gì để nhắm mục tiêu ở đó cả!
actors.hero.abilities.armorability.prompt=Chọn vị trí cần nhắm mục tiêu
actors.hero.abilities.armorability.self_target=Bạn không thể nhắm mục tiêu vào chính mình!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Năng lượng rạng rỡ tỏa ra từ cơ thể của Giáo sĩ. Khi ở dạng này, Giáo sĩ nhận được 2 tầm tấn công (từ năng lượng thánh phát ra từ họ), và 10 điểm phòng thủ mỗi khi họ sử dụng một lượt dùng sách thánh. Họ cũng có thể thi triển các phép thuật được mở khóa thông qua tài năng của dạng thăng thiên.\n\nLớp chắn được ban bởi dạng thăng thiên và các phép thuật của nó sẽ không suy giảm bình thường, mà sẽ biến mất ngay lập tức khi dạng thăng thiên kết thúc.\n\nĐộ che thủ hiện tại: %1$d.\nSố lượt còn lại: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=hình thức thăng thiên
actors.hero.abilities.cleric.ascendedform.desc=Thầy tu phóng ra năng lượng thánh từ bản thân, hóa thân thành một hình dạng rạng rỡ kéo dài 10 lượt. Trong hình dạng này, thầy tu có thể niệm phép mới, tăng 2 tầm tấn công, 30 điểm phòng thủ, và bất kỳ phép thuật bổ sung nào họ niệm sẽ tăng thêm 10 điểm phòng thủ cho mỗi điểm sử dụng sách thánh. Điểm phòng thủ từ hình dạng thăng thiên và các phép thuật của nó không suy giảm theo cách thông thường, mà sẽ biến mất ngay lập tức khi hình dạng thăng thiên kết thúc. Khả năng này có thể được sử dụng lại để làm mới thời gian hiệu lực của hình dạng thăng thiên.
actors.hero.abilities.cleric.ascendedform.name=hình thức thăng thiên
actors.hero.abilities.cleric.ascendedform.short_desc=Pháp sư sẽ đạt đến _Dạng Thăng Thiên_, có được những phép thuật mới, tầm tấn công xa hơn và khả năng phòng thủ tốt hơn.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Một bản sao của một trong những người bạn đồng hành phiêu lưu của Giáo sĩ, được tạo ra từ ánh sáng rắn chắc. Mặc dù có hình dạng của một anh hùng khác, nhưng nó không sở hữu bất kỳ khả năng độc đáo nào của họ. Đồng minh này sẽ tồn tại miễn là Sức Mạnh Của Đa Số được áp dụng cho họ.\n\nĐồng minh này có thể được điều khiển mà không tốn chi phí bằng cách sử dụng lại khả năng giáp Sức Mạnh Của Đa Số.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Đồng minh của bạn tiến hành tấn công!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Đồng minh của bạn di chuyển đến vị trí đó.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Đồng minh của bạn sẽ di chuyển theo bạn.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Bạn có thể tìm thấy nhân vật này với khả năng đặc biệt của bộ giáp anh hùng.
actors.hero.abilities.cleric.powerofmany$lightally.name=đồng minh ánh sáng
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Đồng minh này đã được tăng sức mạnh bởi Sức Mạnh Của Nhiều Người, giúp họ gây thêm +25%% sát thương và giảm -25%% sát thương phải chịu. Họ cũng sẽ chia sẻ phạm vi tầm nhìn với Pháp sư và có thể hưởng lợi từ sức mạnh của nhiều phép thuật.\n\nSức Mạnh Của Nhiều Người sẽ tiếp tục tồn tại khi các đồng minh như ảnh lăng kính ẩn nấp, nhưng thời gian hiệu lực vẫn sẽ đếm ngược.\n\nSố lượt còn lại: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=sức mạnh của nhiều người
actors.hero.abilities.cleric.powerofmany.ally_exists=Bạn đã có một đồng minh quyền lực rồi.
actors.hero.abilities.cleric.powerofmany.desc=Thầy tu sử dụng _Sức mạnh của Đa dạng_, sức mạnh này có thể tăng cường cho một đồng minh hiện có hoặc tạo ra một đồng minh mới được tăng cường trong 100 lượt. Chọn một ô trống sẽ tạo ra một đồng minh mới.\n\nKhi được tăng cường bởi Sức mạnh của Đa dạng, bất kỳ đồng minh nào cũng gây thêm +25% sát thương, chịu -25% sát thương và chia sẻ tầm nhìn của họ với Thầy tu. Họ cũng nhận được 25 điểm phòng thủ khi sử dụng khả năng này.\n\nThầy tu cũng nhận được ba phép thuật mới chỉ có thể được sử dụng với một đồng minh được tăng cường. Sức mạnh của Đa dạng sẽ không kết thúc khi một trong những phép thuật này đang hoạt động.
actors.hero.abilities.cleric.powerofmany.name=sức mạnh của nhiều người
actors.hero.abilities.cleric.powerofmany.no_vision=Bạn không thể nhắm mục tiêu vào một vị trí mà bạn không thể nhìn thấy.
actors.hero.abilities.cleric.powerofmany.only_allies=Bạn chỉ có thể tiếp thêm sức mạnh cho đồng minh.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Hãy hướng đồng minh ánh sáng của bạn
actors.hero.abilities.cleric.powerofmany.prompt_default=Chọn một đồng minh hoặc địa điểm
actors.hero.abilities.cleric.powerofmany.short_desc=Vị tu sĩ sử dụng _Sức mạnh của số đông_, tăng cường sức mạnh cho một đồng minh hiện có hoặc tạo ra một đồng minh mới.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Gán cho hình dạng cơ thể
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Gán vào hình thức tư duy
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Gán cho dạng linh hồn
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Chọn hiệu ứng bạn muốn áp dụng cho Trinity. Thông tin bổ sung sẽ được hiển thị trước khi xác nhận.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Mã định danh: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Dạng tâm trí: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Dạng linh hồn: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Hãy chọn hình thức Trinity mà bạn muốn sử dụng. Hiệu ứng của các hình thức khác nhau có thể hoạt động đồng thời.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity sẽ áp dụng hiệu ứng giả kim thuật từ xa của vật phẩm này, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity sẽ áp dụng hiệu ứng hồi phục máu thụ động của vật phẩm này với mức _+%1$d_ trong 20 lượt, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.cost=Chi phí sử dụng khả năng này có thể thay đổi, nhưng thường là _%d._
actors.hero.abilities.cleric.trinity.desc=Pháp sư nhận được bộ ba khả năng giáp trụ, có thể được gán cho các hiệu ứng vật phẩm khác nhau bằng cách sử dụng ba phép thuật mới. Mỗi phép thuật này tập trung vào việc mô phỏng hiệu ứng của các loại trang bị khác nhau mà Pháp sư đã xác định được trong lần chơi này: hình thể (vũ khí và giáp trụ), hình thể tâm trí (gậy phép và vũ khí ném), và hình thể linh hồn (nhẫn và cổ vật). Mỗi hình thức của bộ ba có thể được truyền một hiệu ứng tại một thời điểm, và Pháp sư sẽ chọn hiệu ứng nào để kích hoạt khi sử dụng bộ ba. Bộ ba sẽ không sao chép hiệu ứng của thứ gì đó bạn đã trang bị.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity sẽ sử dụng hiệu ứng của vật phẩm này để triệu hồi một hồn ma đồng minh bị tha hóa với lượng HP tương đương một hồn ma _+%1$d_, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity sẽ áp dụng hiệu ứng này trong _%1$d lượt_ với chi phí _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity sẽ áp dụng hiệu ứng lan tỏa của vật phẩm này với tầm xa là _+%1$d_, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity sẽ áp dụng hiệu ứng ăn vặt của vật phẩm này, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity sẽ áp dụng hiệu ứng cướp của kẻ địch từ vật phẩm này với _+%1$d_, tiêu tốn _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.name=Chúa Ba Ngôi
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity không thể sao chép hiệu ứng mà bạn đã trang bị!
actors.hero.abilities.cleric.trinity.no_imbue=Hiện tại Trinity chưa có hiệu ứng nào được thiết lập cho bất kỳ hình dạng nào của nó, hãy sử dụng một trong những phép thuật của nó!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity sẽ áp dụng hiệu ứng _mạnh mẽ_ này trong _%1$d lượt_ với chi phí _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.ring_use=Trinity sẽ áp dụng hiệu ứng của chiếc nhẫn này với _+%1$d_ trong 20 lượt, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity sẽ áp dụng hiệu ứng gốc của vật phẩm này với một hạt giống gây hại ngẫu nhiên, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.short_desc=Giáo sĩ có được bộ ba khả năng, mô phỏng các trang bị mà họ đã từng thấy và có thể được gán bằng cách sử dụng các phép thuật mới.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity sẽ áp dụng hiệu ứng chèn của vật phẩm này, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity sẽ áp dụng hiệu ứng soi bài của vật phẩm này với _+%1$d_, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity sẽ ném vũ khí này vào _+%1$d_ với chi phí _%2$s năng lượng._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity sẽ áp dụng hiệu ứng đóng băng thời gian của vật phẩm này trong thời gian _%1$d_ lượt, với chi phí là _%2$s điểm năng lượng._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity sẽ áp dụng hiệu ứng cuộn ngẫu nhiên của vật phẩm này với xác suất _%1$d/10_ để cung cấp phiên bản độc đáo mà không tính thêm phí, với chi phí là _%2$s phí._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity sẽ phóng điện vào cây đũa phép đa năng này với giá trị +%1$d, tiêu tốn 1%2$s điện năng.
actors.hero.abilities.cleric.trinity.wand_use=Trinity sẽ bắn tia năng lượng vào cây đũa phép này với giá _+%1$d_ và tiêu tốn _%2$s năng lượng._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Nhân vật này đang tham gia một cuộc đấu tay đôi. Họ, và bất kỳ đồng minh hoặc tay sai nào của họ, được phép hành động bình thường trong khi những người khác bị đóng băng.\n\nCuộc đấu sẽ kéo dài trong một khoảng thời gian nhất định, cho đến khi một người tham gia chết, hoặc cho đến khi những người tham gia di chuyển cách nhau hơn 5 ô.\n\nSố lượt còn lại: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=người tham gia đấu tay đôi
actors.hero.abilities.duelist.challenge.ally_target=Bạn chỉ có thể thách đấu kẻ thù.
actors.hero.abilities.duelist.challenge.already_dueling=Bạn chỉ có thể tham gia một trận đấu tay đôi tại một thời điểm.
actors.hero.abilities.duelist.challenge.desc=Đấu Sĩ thách đấu một kẻ thù gần đó. Kẻ thù đó buộc phải chiến đấu với cô ta trong khi tất cả kẻ thù khác tạm thời bị đóng băng thời gian. Mục tiêu phải nằm trong tầm với và trong phạm vi 5 ô của Đấu Sĩ. Cuộc đấu kéo dài cho đến khi 10 lượt trôi qua, kẻ thù chết, hoặc Đấu Sĩ cách kẻ thù hơn 5 ô. Kẻ thù bị đóng băng sẽ bất khả xâm phạm. Đồng minh của Đấu Sĩ không bị đóng băng bởi khả năng này, nhưng nếu nhắm mục tiêu vào một con trùm, lính của nó cũng sẽ không bị đóng băng.
actors.hero.abilities.duelist.challenge.distant_target=Kẻ thù đó ở quá xa để có thể thách đấu.
actors.hero.abilities.duelist.challenge.name=thử thách
actors.hero.abilities.duelist.challenge.prompt=Hãy chọn một kẻ thù để thách đấu.
actors.hero.abilities.duelist.challenge.short_desc=Đấu sĩ thách đấu một kẻ thù gần đó, tạm thời đóng băng tất cả kẻ thù khác.
actors.hero.abilities.duelist.challenge.unreachable_target=Bạn phải có khả năng đạt được mục tiêu của mình.
actors.hero.abilities.duelist.elementalstrike.desc=Đấu Sĩ tấn công kẻ thù hoặc một vị trí, thực hiện một đòn tấn công thông thường chắc chắn trúng đích và lan tỏa một hiệu ứng ma thuật di chuyển trong phạm vi tối đa 4 ô theo hình nón 65 độ. Hiệu ứng ma thuật này thay đổi tùy thuộc vào bùa chú trên vũ khí chính của Đấu Sĩ.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Đòn tấn công nguyên tố không kèm bùa chú sẽ giải phóng một luồng ma thuật nhỏ, gây 6-12 sát thương cho tất cả kẻ địch trong phạm vi.
actors.hero.abilities.duelist.elementalstrike.name=đòn tấn công nguyên tố
actors.hero.abilities.duelist.elementalstrike.short_desc=Đấu sĩ thực hiện một đòn tấn công nguyên tố, lan tỏa hiệu ứng trong một vùng ảnh hưởng hình nón dựa trên phép thuật cường hóa vũ khí của cô ấy.
actors.hero.abilities.duelist.feint.bad_location=Bạn không thể chuyển đến địa điểm đó.
actors.hero.abilities.duelist.feint.desc=Đấu sĩ giả vờ tấn công trong khi lao đến ô liền kề, để lại một ảnh ảo thoáng qua của chính mình. Kẻ địch đang tấn công Đấu sĩ sẽ tấn công ảnh ảo của cô ấy thay vì tấn công trực tiếp. Kẻ địch tấn công ảnh ảo sẽ bị bối rối, điều này làm hủy bỏ hành động tiếp theo của chúng và khiến chúng dễ bị tấn công bất ngờ.
actors.hero.abilities.duelist.feint.name=giả vờ
actors.hero.abilities.duelist.feint.prompt=Chọn một địa điểm để di chuyển nhanh đến
actors.hero.abilities.duelist.feint.short_desc=Đòn đánh giả của đấu sĩ, giả vờ tấn công trong khi lao nhanh đến ô liền kề. Kẻ địch sẽ tấn công vào ảnh ảo của cô ấy, tạo cơ hội cho cô ấy phản công.
actors.hero.abilities.duelist.feint.too_far=Địa điểm đó không nằm liền kề với bạn.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Nữ Thợ Săn được tăng sức mạnh trong chốc lát, giúp tăng tốc độ di chuyển và tốc độ tấn công bằng cung tên.\n\nSố lượt còn lại: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=sức mạnh của thiên nhiên
actors.hero.abilities.huntress.naturespower.desc=Nữ Thợ Săn tạm thời tăng cường sức mạnh cho bản thân và cây cung của mình bằng sức mạnh tự nhiên! Hiệu ứng này kéo dài 8 lượt. Trong thời gian này, Nữ Thợ Săn di chuyển với tốc độ gấp đôi và tấn công nhanh hơn 33% với cung tên của mình. Hiệu ứng tăng cường của cung tên sẽ không được kích hoạt nếu Xạ Thủ đang sử dụng đòn tấn công đặc biệt của mình.
actors.hero.abilities.huntress.naturespower.name=sức mạnh của thiên nhiên
actors.hero.abilities.huntress.naturespower.short_desc=Nữ thợ săn triệu hồi Sức mạnh Thiên nhiên, giúp tăng tốc độ di chuyển và tốc độ bắn cung của cô ấy trong một thời gian ngắn.
actors.hero.abilities.huntress.spectralblades.desc=Nữ Thợ Săn ném một lưỡi kiếm ma thuật về phía kẻ thù, hoạt động như một đòn tấn công tầm xa từ vũ khí cận chiến của cô. Tất cả các hiệu ứng thông thường của vũ khí cận chiến sẽ được kích hoạt, bao gồm cả các phép thuật.
actors.hero.abilities.huntress.spectralblades.name=lưỡi dao quang phổ
actors.hero.abilities.huntress.spectralblades.short_desc=Nữ Thợ Săn ném _Lưỡi Dao Ma Thuật_ vào mục tiêu, gây sát thương tùy thuộc vào vũ khí cận chiến mà cô ấy đang trang bị.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Một con đại bàng thần kỳ, được Nữ Thợ Săn triệu hồi. Nó phát sáng màu xanh lam huyền ảo, đầu liên tục lắc lư khi quan sát khu vực xung quanh. Mặc dù không phải là một chiến binh giỏi, nhưng tốc độ và tầm nhìn của nó khiến nó trở nên xuất sắc trong việc trinh sát và đánh lạc hướng kẻ thù.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Số lần né tránh chắc chắn còn lại: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Số lượt còn lại: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Chim ưng của bạn chuẩn bị tấn công!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Chim ưng của bạn di chuyển đến vị trí đó.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Chim ưng của bạn sẽ bay theo bạn.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Bạn có thể tìm thấy nhân vật này với khả năng đặc biệt của bộ giáp anh hùng.
actors.hero.abilities.huntress.spirithawk$hawkally.name=chim ưng linh hồn
actors.hero.abilities.huntress.spirithawk.desc=Nữ Thợ Săn triệu hồi một linh thú chim ưng, có thể được điều khiển bằng cách sử dụng khả năng này một lần nữa khi nó đang được triệu hồi. Chim ưng tồn tại trong 100 lượt, việc điều khiển chim ưng không tốn bất kỳ lượt nào. Chim ưng có lượng máu và sức tấn công tối thiểu, nhưng nhanh nhẹn, né tránh tốt và chính xác. Nó luôn chia sẻ toàn bộ tầm nhìn với Nữ Thợ Săn. Nó miễn nhiễm với tất cả các hiệu ứng giới hạn khu vực, chẳng hạn như lửa và khí độc. Nó sẽ không tấn công trừ khi được chỉ định cụ thể.
actors.hero.abilities.huntress.spirithawk.name=chim ưng linh hồn
actors.hero.abilities.huntress.spirithawk.no_space=Không có chỗ trống nào gần bạn.
actors.hero.abilities.huntress.spirithawk.short_desc=Nữ Thợ Săn triệu hồi một linh thú _Chim Ưng Linh Hồn_, giúp cô do thám địa điểm và đánh lạc hướng kẻ thù.
actors.hero.abilities.mage.elementalblast.desc=Pháp sư phóng ra một luồng ma thuật bao phủ một vùng hình tròn có bán kính tối đa 4 ô và gây sát thương từ 15 đến 25. Hiệu ứng cụ thể của luồng ma thuật này sẽ khác nhau tùy thuộc vào cây trượng được cường hóa trong cây trượng của pháp sư.
actors.hero.abilities.mage.elementalblast.generic_desc=Hiệu ứng của vụ nổ nguyên tố sẽ tương tự như hiệu ứng của cây đũa phép khi phóng vào kẻ thù hoặc đồng minh.
actors.hero.abilities.mage.elementalblast.name=vụ nổ nguyên tố
actors.hero.abilities.mage.elementalblast.no_staff=Bạn không thể sử dụng khả năng này nếu không có nhân viên của mình.
actors.hero.abilities.mage.elementalblast.short_desc=Pháp sư phóng ra một _Vụ Nổ Nguyên Tố_ từ cây trượng của mình, bao phủ một khu vực rộng lớn xung quanh anh ta với hiệu ứng khác nhau tùy thuộc vào cây trượng được gắn trên cây trượng.
actors.hero.abilities.mage.warpbeacon.depths=Bạn không thể dịch chuyển tức thời giữa các độ sâu!
actors.hero.abilities.mage.warpbeacon.desc=Pháp sư đặt một ngọn hải đăng, sau đó có thể dịch chuyển đến đó bất cứ lúc nào. Việc đặt ngọn hải đăng mất 1 lượt, nhưng dịch chuyển đến đó diễn ra tức thì. Theo mặc định, Pháp sư không thể dịch chuyển giữa các tầng hoặc sử dụng ngọn hải đăng để đến những nơi không thể tiếp cận được như các phòng bị khóa. Pháp sư có thể dịch chuyển vào giữa kẻ thù, đẩy chúng sang một bên.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Bạn không thể đặt thiết bị định vị ở đó!
actors.hero.abilities.mage.warpbeacon.locked_floor=Bạn không thể rời khỏi tầng bị khóa!
actors.hero.abilities.mage.warpbeacon.name=tín hiệu dịch chuyển
actors.hero.abilities.mage.warpbeacon.short_desc=Pháp sư đặt một _Ngọn hải đăng dịch chuyển_ tại vị trí hiện tại của mình, nhờ đó anh ta có thể dịch chuyển tức thời trở lại đó.
actors.hero.abilities.mage.warpbeacon.too_far=Địa điểm đó xa quá!
actors.hero.abilities.mage.warpbeacon.window_cancel=Hủy bỏ
actors.hero.abilities.mage.warpbeacon.window_clear=ngọn hải đăng rõ ràng
actors.hero.abilities.mage.warpbeacon.window_desc=Thiết bị định vị của bạn hiện đang được đặt trên tầng %d.
actors.hero.abilities.mage.warpbeacon.window_tele=dịch chuyển tức thời đến ngọn hải đăng
actors.hero.abilities.mage.wildmagic.desc=Pháp sư giải phóng sức mạnh trong những cây trượng của mình, bắn ngẫu nhiên tối đa 4 lần trong một lượt. Cây trượng của Pháp sư không nằm trong hiệu ứng này. Mỗi cây trượng cũng được tăng cấp độ lên 2, tối đa +3. Khả năng này sử dụng một nửa năng lượng của trượng cho mỗi lần bắn, và không một cây trượng nào có thể bắn quá 2 lần.
actors.hero.abilities.mage.wildmagic.name=phép thuật hoang dã
actors.hero.abilities.mage.wildmagic.no_wands=Bạn không có đũa phép nào để dùng để tấn công cả!
actors.hero.abilities.mage.wildmagic.short_desc=Pháp sư giải phóng _Ma thuật Hoang dã_ chứa trong những cây đũa phép của mình, bắn chúng ngẫu nhiên nhiều lần vào mục tiêu đã chọn trong một lượt.
actors.hero.abilities.ratmogrify$transmograt.desc=Kẻ thù này đã biến thành một con chuột. Một sự cải tiến lớn, nếu bạn hỏi tôi! - Vua Chuột
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Bị tiêu diệt bởi: kẻ thù biến hình chuột
actors.hero.abilities.ratmogrify.cant_transform=Bạn không thể biến nó thành chuột được!
actors.hero.abilities.ratmogrify.desc=Anh hùng biến kẻ thù thành chuột trong 6 lượt! Trùm, đồng minh và chuột không thể bị biến thành chuột. Kẻ thù bị biến thành chuột vẫn giữ nguyên chỉ số ban đầu, nhưng không có bất kỳ khả năng nào.
actors.hero.abilities.ratmogrify.name=biến đổi chuột
actors.hero.abilities.ratmogrify.short_desc=Anh hùng _Biến hình_ kẻ thù! Điều này tạm thời biến chúng thành một con chuột không có khả năng gì.
actors.hero.abilities.ratmogrify.too_strong=Kẻ thù đó quá mạnh để có thể bị biến thành chuột!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Kẻ địch này đã bị đánh dấu, khiến chúng chịu thêm 25 sát thương, đồng thời không thể chết cho đến khi dấu ấn biến mất. Số lượt còn lại: 1.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=bị đánh dấu để chết
actors.hero.abilities.rogue.deathmark.ally_target=Bạn chỉ có thể đánh dấu kẻ thù.
actors.hero.abilities.rogue.deathmark.desc=Kẻ gian đánh dấu lên một kẻ địch được chọn, khiến chúng chịu thêm 25% sát thương. Dấu ấn được áp dụng ngay lập tức và kéo dài trong 5 lượt. Kẻ địch bị đánh dấu sẽ chịu thêm sát thương nhưng không thể chết cho đến khi dấu ấn hết hiệu lực. Nếu kẻ địch có 0 HP khi dấu ấn kết thúc, chúng sẽ chết ngay lập tức.
actors.hero.abilities.rogue.deathmark.name=dấu hiệu tử vong
actors.hero.abilities.rogue.deathmark.short_desc=Tên trộm sẽ đặt Dấu Ấn Tử Thần lên một kẻ thù được chọn. Kẻ thù bị đánh dấu sẽ chịu thêm sát thương, nhưng không thể chết cho đến khi dấu ấn biến mất.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Một bản sao của Rogue, được tạo ra từ bóng tối mờ ảo. Nó đứng bất động, với đôi mắt trống rỗng và những làn khói bóng tối nhỏ li ti bốc lên từ nó như hơi nước. Bản sao này không phải là bản sao hoàn hảo của Rogue, nhưng vẫn là một chiến binh khá tốt và có thể tận dụng được trang bị của Rogue nếu sở hữu những kỹ năng phù hợp.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Bản sao của bạn tiến hành tấn công!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Bản sao của bạn sẽ di chuyển đến vị trí đó.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Bản sao của bạn sẽ di chuyển theo bạn.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Bạn có thể tìm thấy nhân vật này với khả năng đặc biệt của bộ giáp anh hùng.
actors.hero.abilities.rogue.shadowclone$shadowally.name=kẻ lừa đảo bóng tối
actors.hero.abilities.rogue.shadowclone.desc=Tên trộm triệu hồi một bản sao bóng tối của chính mình, có thể được điều khiển để hỗ trợ hắn trong chiến đấu. Việc điều khiển bản sao bóng tối không tốn bất kỳ năng lượng nào. Bản sao có 80 HP, không có giáp và gây ra 10-20 sát thương. Tất cả các đặc điểm này có thể được cải thiện bằng các kỹ năng, sao cho bản sao được hưởng lợi từ vũ khí và giáp mà người anh hùng đang sở hữu.
actors.hero.abilities.rogue.shadowclone.name=bản sao bóng
actors.hero.abilities.rogue.shadowclone.short_desc=Tên trộm triệu hồi một _Bản sao bóng tối_, có thể được điều khiển để hỗ trợ hắn trong chiến đấu.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Không hiểu sao, kẻ thù lại dễ dàng tin rằng con rối bằng gỗ này chính là Rogue thật!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Bạn có thể tìm thấy nhân vật này với khả năng đặc biệt của bộ giáp anh hùng.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=mồi nhử bằng gỗ
actors.hero.abilities.rogue.smokebomb.desc=Tên trộm ném bom khói và dịch chuyển tức thời tối đa 6 ô. Hắn có thể dịch chuyển xuyên qua chướng ngại vật và kẻ thù, nhưng không thể xuyên qua địa hình rắn chắc như tường.\n\nKẻ thù ở gần vị trí cũ của tên trộm sẽ bị mù trong 5 lượt.
actors.hero.abilities.rogue.smokebomb.fov=Bạn chỉ có thể nhảy đến một vị trí trống trong tầm nhìn của mình.
actors.hero.abilities.rogue.smokebomb.name=bom khói
actors.hero.abilities.rogue.smokebomb.prompt=Chọn vị trí bạn muốn chuyển đến
actors.hero.abilities.rogue.smokebomb.short_desc=Tên trộm ném xuống một quả bom khói trong khi dịch chuyển tức thời. Hắn làm mù kẻ thù gần vị trí cũ của mình.
actors.hero.abilities.warrior.endure$enduretracker.desc=Chiến binh hiện đang gây thêm sát thương dựa trên lượng sát thương mà anh ta đã chịu đựng.\n\nSát thương cộng thêm: %1$d\nBên trái: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=sức bền
actors.hero.abilities.warrior.endure.desc=Chiến binh chịu đựng trong 3 lượt, chỉ nhận một nửa sát thương từ mọi nguồn. Mức giảm này được áp dụng trước khi các hiệu ứng kháng sát thương như giáp được tính đến. Sau khi chịu đựng, đòn tấn công tiếp theo của chiến binh trong vòng 10 lượt sẽ nhận thêm sát thương. Sát thương cộng thêm này bằng một nửa tổng sát thương gây ra cho chiến binh trong khi chịu đựng, trước khi bất kỳ hiệu ứng giảm sát thương nào được áp dụng! Nếu Chiến binh có bất kỳ chuỗi combo nào, sử dụng khả năng này sẽ tăng thời gian còn lại của chuỗi combo thêm 3 lượt.
actors.hero.abilities.warrior.endure.name=chịu đựng
actors.hero.abilities.warrior.endure.short_desc=Chiến binh _Chịu đựng_, bỏ qua vài lượt nhưng nhận được khả năng kháng sát thương cao. Sau đó, anh ta gây thêm sát thương dựa trên những gì mình đã chịu đựng.
actors.hero.abilities.warrior.heroicleap.desc=Chiến binh lao về phía vị trí đã định, vượt qua mọi kẻ thù hoặc chướng ngại vật trên đường đi. Tuy nhiên, anh ta không thể nhảy qua tường hoặc các địa hình rắn chắc khác.
actors.hero.abilities.warrior.heroicleap.name=bước nhảy anh hùng
actors.hero.abilities.warrior.heroicleap.prompt=Chọn hướng để nhảy
actors.hero.abilities.warrior.heroicleap.short_desc=Chiến binh thực hiện cú _Nhảy Anh Hùng_ về phía vị trí đã định, lướt trên không trung phía trên kẻ thù và các mối nguy hiểm.
actors.hero.abilities.warrior.shockwave.desc=Chiến binh đập mạnh xuống đất, tạo ra một làn sóng xung kích lan truyền tối đa 5 ô trong hình nón 60 độ. Kẻ địch bị trúng làn sóng xung kích này sẽ bị tê liệt trong 5 lượt. Chúng cũng chịu 5-10 sát thương, cộng thêm 1-2 sát thương cho mỗi điểm sức mạnh của Chiến binh vượt quá 10.
actors.hero.abilities.warrior.shockwave.name=sóng xung kích
actors.hero.abilities.warrior.shockwave.short_desc=Chiến binh tung ra một làn sóng xung kích hình nón bằng cách đập mạnh xuống đất. Kẻ địch trúng phải làn sóng xung kích sẽ bị sát thương và suy yếu.
actors.hero.hero.key_distracted=Bạn không thể mở khóa được, bạn phải tiếp tục thử.
actors.hero.hero.leave=Bạn chưa thể rời đi được, phần còn lại của hầm ngục đang chờ bạn ở phía dưới!
actors.hero.hero.level_cap=Bạn không thể trở nên mạnh mẽ hơn, nhưng những trải nghiệm sẽ mang lại cho bạn nguồn năng lượng dồi dào!
actors.hero.hero.level_up=Nâng cấp!
actors.hero.hero.locked_chest=Chiếc rương này bị khóa và bạn không có chìa khóa phù hợp.
actors.hero.hero.locked_door=Bạn không có chìa khóa phù hợp.
actors.hero.hero.name=Bạn
actors.hero.hero.new_level=Nâng cấp! +Độ chính xác, +Né tránh, +5 HP!
actors.hero.hero.new_talent=+1 Điểm Tài Năng!
actors.hero.hero.noticed_smth=Bạn đã nhận thấy điều gì đó.
actors.hero.hero.pain_resist=Cơn đau giúp bạn chống lại cơn buồn ngủ.
actors.hero.hero.revive=Biểu tượng Ankh bùng nổ với nguồn năng lượng sống!
actors.hero.hero.search=tìm kiếm
actors.hero.hero.search_distracted=Khó mà tập trung được, việc tìm kiếm rất mệt mỏi.
actors.hero.hero.unspent=Bạn vẫn còn điểm tài năng chưa sử dụng!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Bạn không thể mang theo: %s.
actors.hero.hero.you_now_have=Bạn đã nhận được: %s.
actors.hero.heroclass.cleric=giáo sĩ
actors.hero.heroclass.cleric_desc=Pháp sư bắt đầu với một cuốn sách thánh độc nhất vô nhị, mà họ có thể sử dụng để thi triển nhiều loại phép thuật khác nhau. Hầu hết các kỹ năng của Pháp sư tập trung vào việc học hoặc nâng cấp phép thuật. Pháp sư cũng bắt đầu với một cây gậy, áo giáp vải, một bình nước và một túi nhung. Pháp sư tự động nhận diện: Cuộn giấy Nhận diện - Cuộn giấy Thanh tẩy - Cuộn giấy Hóa giải Lời nguyền
actors.hero.heroclass.cleric_desc_short=Pháp sư là một người sử dụng phép thuật thần thánh, dùng cuốn sách thánh độc nhất vô nhị của mình để truyền dẫn ma thuật thần thánh. Họ có thể học và nâng cấp phép thuật thông qua các kỹ năng.
actors.hero.heroclass.cleric_unlock=Để mở khóa lớp nhân vật Cleric, hãy _thanh tẩy hoàn toàn lời nguyền trên bất kỳ trang bị nào bị nguyền rủa._
actors.hero.heroclass.duelist=đấu sĩ
actors.hero.heroclass.duelist_desc=Đấu Sĩ bắt đầu với một thanh kiếm rapier độc đáo có khả năng đặc biệt được nạp lại theo thời gian. Mỗi vũ khí trong trò chơi đều có một khả năng đặc biệt khác nhau mà Đấu Sĩ có thể sử dụng. Đấu Sĩ cũng bắt đầu với hai vật ném nhọn, áo giáp vải, một bình nước và một túi nhung. Đấu Sĩ tự động nhận diện: Cuộn giấy Nhận diện ...
actors.hero.heroclass.duelist_desc_short=Đấu Sĩ là bậc thầy về vũ khí, người có thể sử dụng vũ khí của mình để kích hoạt một _khả năng đặc biệt của vũ khí_. Khả năng đặc biệt này _khác nhau đối với mỗi loại vũ khí._
actors.hero.heroclass.duelist_unlock=Để mở khóa nhân vật Đấu sĩ, hãy trang bị vũ khí cấp 2 trở lên mà không bị giảm sức mạnh.
actors.hero.heroclass.huntress=nữ thợ săn
actors.hero.heroclass.huntress_desc=Nữ Thợ Săn bắt đầu với một cây cung linh hồn độc đáo, có thể bắn ra vô số mũi tên được triệu hồi. Nữ Thợ Săn có thể di chuyển xuyên qua cỏ cao mà không giẫm lên nó. Nữ Thợ Săn cũng bắt đầu với găng tay đinh tán, áo giáp vải, bình nước và túi nhung. Nữ Thợ Săn tự động nhận diện: Cuộn giấy Nhận diện - Cuộn giấy Nhận diện - Thuốc Tầm nhìn Tâm trí - Cuộn giấy Ru ngủ
actors.hero.heroclass.huntress_desc_short=Nữ Thợ Săn là bậc thầy về vũ khí ném và sở hữu một cây cung thần kỳ với vô số mũi tên. Cô ấy cũng có thể di chuyển xuyên qua những đám cỏ cao mà không hề giẫm đạp lên chúng.
actors.hero.heroclass.huntress_unlock=Để mở khóa nhân vật Huntress, hãy ném vũ khí trúng kẻ địch 10 lần trong một ván chơi.
actors.hero.heroclass.mage=pháp sư
actors.hero.heroclass.mage_desc=Pháp sư bắt đầu với một cây trượng độc đáo, có khả năng nạp năng lượng nhanh hơn đáng kể so với đũa phép và có thêm 1 lần sử dụng. Cây trượng có thể được cường hóa bằng bất kỳ đũa phép nào mà Pháp sư tìm thấy trong hầm ngục. Pháp sư cũng bắt đầu với một cây đũa phép bắn tên lửa ma thuật được cường hóa trong trượng, áo giáp vải, một bình nước và một túi nhung. Pháp sư tự động nhận diện: Cuộn giấy Nhận diện - Cuộn giấy Nhận diện - Cuộn giấy Nâng cấp - Cuộn giấy Nâng cấp - Cuộn giấy Nâng cấp
actors.hero.heroclass.mage_desc_short=Pháp sư là một chuyên gia về phép thuật và mang theo một cây trượng ma thuật mạnh hơn cả đũa phép. Cây trượng này có thể được cường hóa bằng bất kỳ đũa phép nào mà pháp sư tìm thấy.
actors.hero.heroclass.mage_unlock=Để mở khóa lớp nhân vật Pháp sư, hãy sử dụng cuộn giấy nâng cấp để tăng sức mạnh cho vật phẩm.
actors.hero.heroclass.rogue=kẻ phản bội
actors.hero.heroclass.rogue_desc=Nhân vật Rogue bắt đầu với một chiếc Áo Choàng Bóng Tối độc đáo, mà hắn có thể sử dụng để trở nên vô hình theo ý muốn. Rogue có thể phát hiện ra bí mật và cạm bẫy từ khoảng cách xa hơn. Rogue cũng bắt đầu với một con dao găm, ba con dao phóng, áo giáp vải, một bình nước và một túi nhung. Rogue tự động nhận diện: Cuộn Giấy Nhận Diện Cuộn Giấy Nhận Diện Cuộn Giấy Nhận Diện Cuộn Giấy Nhận Diện Cuộn Giấy Bản Đồ Ma Thuật
actors.hero.heroclass.rogue_desc_short=Tên trộm có thể né tránh kẻ thù và tấn công từ trạng thái tàng hình nhờ chiếc áo choàng bóng tối của mình. Hắn cũng có thể phát hiện ra bí mật và cạm bẫy từ khoảng cách xa hơn.
actors.hero.heroclass.rogue_unlock=Để mở khóa nhân vật Rogue, hãy thực hiện 10 cuộc tấn công bất ngờ trong một ván chơi.
actors.hero.heroclass.warrior=chiến binh
actors.hero.heroclass.warrior_desc=Chiến binh bắt đầu với một _ấn phong độc đáo bị vỡ_ giúp anh ta tạo ra một lớp khiên bảo vệ khi máu còn dưới một nửa. Ấn phong này có thể được di chuyển giữa các bộ giáp và có thể _chuyển một nâng cấp duy nhất_ cùng với nó.\n\nChiến binh cũng bắt đầu với một _thanh kiếm ngắn cũ_, _ba viên đá ném_, áo giáp vải, một bình nước và một túi nhung.\n\nChiến binh tự động nhận diện:\n_-_ Cuộn giấy Nhận diện\n_-_ Thuốc hồi phục\n_-_ Cuộn giấy Cuồng nộ
actors.hero.heroclass.warrior_desc_short=Chiến binh chịu được sát thương lớn hơn nhờ lớp khiên bảo vệ được tạo ra bởi _ấn phong bị phá vỡ_. Ấn phong này có thể được di chuyển giữa các bộ giáp và _chuyển một lần nâng cấp._
actors.hero.heroclass.warrior_unlock=Chiến binh được tự động mở khóa.
actors.hero.herosubclass.assassin=sát thủ
actors.hero.herosubclass.assassin_desc=Sát thủ chuẩn bị cho đòn tấn công tiếp theo khi hắn tàng hình. Thời gian chuẩn bị càng lâu, đòn tấn công tiếp theo càng mạnh. Quá trình chuẩn bị kéo dài tối đa 9 lượt. Sau khi chuẩn bị, Sát thủ gây thêm sát thương cho đòn tấn công tiếp theo, có thể dịch chuyển tức thời đến mục tiêu và thậm chí có thể tiêu diệt ngay lập tức những kẻ địch yếu.
actors.hero.herosubclass.assassin_short_desc=Sát thủ có thể chuẩn bị một đòn tấn công chết người khi hắn tàng hình. Hắn càng chờ lâu, đòn tấn công càng mạnh.
actors.hero.herosubclass.battlemage=pháp sư chiến đấu
actors.hero.herosubclass.battlemage_desc=Pháp sư chiến đấu nhận được hiệu ứng bổ sung mỗi khi tấn công cận chiến bằng cây trượng của mình, như thể cây trượng được yểm thêm một phép thuật. Các hiệu ứng này phụ thuộc vào cây đũa phép được yểm vào cây trượng, mỗi cây đũa phép đều có hiệu ứng riêng. Bên cạnh các hiệu ứng của đũa phép, cây trượng của Pháp sư chiến đấu cũng sẽ nhận được 0,5 điểm tích lũy khi anh ta tấn công bằng nó.
actors.hero.herosubclass.battlemage_short_desc=Pháp sư chiến đấu (_Battlemage_) tạo ra các hiệu ứng bổ trợ khi chiến đấu cận chiến bằng cây trượng của mình. Các hiệu ứng này phụ thuộc vào loại trượng được cường hóa mà cây trượng đó sử dụng.
actors.hero.herosubclass.berserker=chiến binh cuồng nộ
actors.hero.herosubclass.berserker_desc=Chiến binh cuồng nộ tích tụ cơn thịnh nộ khi chịu sát thương vật lý, kể cả sát thương bị giáp của hắn chặn lại! Cơn thịnh nộ sẽ giảm dần theo thời gian, nhưng giảm chậm hơn nếu hắn còn ít máu. Cơn thịnh nộ có thể khiến Chiến binh cuồng nộ gây thêm tới +50% sát thương. Khi đạt mức thịnh nộ tối đa, hắn có thể trở nên điên cuồng, tạo ra một lớp khiên bảo vệ và duy trì cơn thịnh nộ miễn là còn khiên. Lớp khiên bảo vệ tỷ lệ thuận với cấp độ giáp của Chiến binh cuồng nộ, và có thể được tăng cường đáng kể nếu hắn còn ít máu. Chiến binh cuồng nộ cần thời gian để hồi phục sau khi trở nên điên cuồng.
actors.hero.herosubclass.berserker_short_desc=Chiến binh cuồng nộ tích lũy cơn thịnh nộ khi nhận sát thương. Cơn thịnh nộ làm tăng sát thương của anh ta và có thể được kích hoạt ở mức 100% để tạo thêm lớp giáp bảo vệ.
actors.hero.herosubclass.champion=nhà vô địch
actors.hero.herosubclass.champion_desc=Champion là bậc thầy về vũ khí cận chiến, có thể trang bị thêm vũ khí phụ bên cạnh vũ khí chính. Các đòn tấn công thông thường của cô ấy sử dụng vũ khí chính, nhưng cô ấy có thể lập tức đổi vũ khí chính và sử dụng khả năng của cả hai vũ khí. Cô ấy cũng nhận được thêm 2 lượt sử dụng khả năng vũ khí tối đa và tốc độ hồi chiêu khả năng vũ khí tăng 50%.
actors.hero.herosubclass.champion_short_desc=_Champion_ có thể sử dụng hai vũ khí và nhận được nhiều lượt sử dụng vũ khí hơn. Các đòn tấn công thông thường của cô ấy sử dụng vũ khí chính, nhưng cô ấy có thể đổi vũ khí và sử dụng khả năng của bất kỳ vũ khí nào.
actors.hero.herosubclass.freerunner=người chạy tự do
actors.hero.herosubclass.freerunner_desc=Khi di chuyển, Freerunner tích lũy điểm động lượng. Anh ta có thể tích lũy tối đa 10 điểm động lượng sau khi chạy 10 lượt, nhưng sẽ nhanh chóng mất đi nếu dừng lại. Freerunner có thể sử dụng động lượng của mình để bắt đầu chạy tự do, mỗi điểm động lượng kéo dài 2 lượt. Khi chạy tự do, Freerunner di chuyển với tốc độ gấp đôi và nhận được khả năng né tránh cộng thêm tỷ lệ thuận với cấp độ của mình. Sau khi kết thúc chạy tự do, sẽ có một khoảng thời gian chờ trước khi có thể tích lũy động lượng lại.
actors.hero.herosubclass.freerunner_short_desc=Nhân vật _Freerunner_ tích lũy đà khi chạy, điều này có thể được sử dụng để bắt đầu chạy tự do. Điều này giúp anh ta tăng tốc độ và khả năng né tránh trong một thời gian ngắn.
actors.hero.herosubclass.gladiator=đấu sĩ
actors.hero.herosubclass.gladiator_desc=Đấu sĩ tích lũy một điểm combo mỗi khi thực hiện thành công một đòn tấn công bằng vũ khí cận chiến hoặc ném. Nếu Đấu sĩ không thực hiện thành công một đòn tấn công nào trong vòng 5 lượt (15 lượt sau khi tiêu diệt kẻ địch), combo của anh ta sẽ được thiết lập lại.\n\nKhi tích lũy combo, Đấu sĩ có thể sử dụng nhiều kỹ năng chắc chắn trúng đích:\n2 Combo: đẩy lùi kẻ địch, giữ nguyên combo\n4 Combo: gây sát thương dựa trên giáp\n6 Combo: đỡ đòn, giữ nguyên combo\n8 Combo: gây sát thương cho mục tiêu và kẻ địch gần đó\n10 Combo: tấn công một lần cho mỗi combo
actors.hero.herosubclass.gladiator_short_desc=Võ Sĩ Tích lũy combo khi thực hiện thành công các đòn tấn công. Anh ta có thể sử dụng combo để kích hoạt các khả năng đặc biệt.
actors.hero.herosubclass.monk=tu sĩ
actors.hero.herosubclass.monk_desc=Tu sĩ là bậc thầy về kỹ thuật thể chất. Khi đánh bại kẻ thù, cô ấy sẽ nhận được năng lượng có thể được sử dụng cho nhiều khả năng phòng thủ và hỗ trợ khác nhau. Năng lượng này không giảm dần theo thời gian, nhưng có giới hạn dựa trên cấp độ của Tu sĩ.\n\n1 Năng lượng: nhanh chóng tấn công bằng nắm đấm\n2 Năng lượng: tập trung né tránh đòn tấn công tiếp theo\n3 Năng lượng: lao nhanh đến gần \n4 Năng lượng: đá kẻ thù ra xa\n5 Năng lượng: thiền định để xóa bỏ trạng thái bất lợi và phục hồi năng lượng cho gậy phép & vật phẩm.
actors.hero.herosubclass.monk_short_desc=Nhân vật _Tu sĩ_ tích lũy năng lượng trong khi chiến đấu. Năng lượng này có thể được sử dụng cho nhiều khả năng độc đáo khác nhau.
actors.hero.herosubclass.paladin=hiệp sĩ
actors.hero.herosubclass.paladin_desc=Hiệp sĩ Thánh chiến nhận được nhiều phép thuật mới và được nâng cấp, nhấn mạnh vào cận chiến và sự phối hợp với vũ khí và áo giáp. Các phép thuật _Vũ khí Thánh_ và _Lá chắn Thánh_ của Hiệp sĩ Thánh chiến mang lại phần thưởng lớn hơn, không còn ghi đè lên các bùa chú và biểu tượng hiện có, và có thể được mở rộng bằng cách sử dụng các phép thuật khác. Hiệp sĩ Thánh chiến cũng nhận được phép thuật _Đòn đánh_, cho phép họ thực hiện một đòn đánh cận chiến chắc chắn với sát thương và sức mạnh bùa chú bổ sung.
actors.hero.herosubclass.paladin_short_desc=Lớp nhân vật _Paladin_ nhận được các phép thuật tầm ngắn mới và các phiên bản được tăng cường sức mạnh của vũ khí thánh và lá chắn.
actors.hero.herosubclass.priest=linh mục
actors.hero.herosubclass.priest_desc=Thầy tu nhận được nhiều phép thuật mới và được nâng cấp, nhấn mạnh vào chiến đấu tầm xa và sự phối hợp với các vật phẩm ma thuật. Thầy tu có thể sử dụng _Ánh Sáng Dẫn Đường_ miễn phí một lần mỗi 50 lượt, chiếu sáng kẻ địch bị nhắm mục tiêu trực tiếp bởi bất kỳ phép thuật nào của họ, và có thể hấp thụ hiệu ứng suy yếu chiếu sáng với đồng minh, gậy phép và một số vật phẩm để gây thêm sát thương bằng cấp độ của họ + 5. Thầy tu cũng nhận được phép thuật _Ánh Sáng Rạng Rỡ_, giúp xua tan bóng tối và ảnh hưởng đến tất cả kẻ địch có thể nhìn thấy, kích hoạt và áp dụng hiệu ứng chiếu sáng và làm choáng chúng trong thời gian ngắn với chi phí 2 lượt sử dụng.
actors.hero.herosubclass.priest_short_desc=Vị Linh Mục nhận được các phép thuật tầm xa mới và một phiên bản được tăng cường sức mạnh của phép dẫn đường bằng ánh sáng.
actors.hero.herosubclass.sniper=tay bắn tỉa
actors.hero.herosubclass.sniper_desc=Xạ thủ là bậc thầy về chiến đấu tầm xa, với các đòn tấn công tầm xa xuyên giáp kẻ địch. Khi tấn công kẻ địch bằng vũ khí ném, cô ta sẽ để lại dấu ấn của xạ thủ trên chúng, cho phép cô ta tiếp tục bằng một đòn tấn công đặc biệt từ cung tên. Đòn tấn công đặc biệt này thay đổi tùy thuộc vào cách cung tên được nâng cấp. Một cung tên chưa được nâng cấp sẽ bắn ra một phát bắn nhanh gây sát thương giảm nhưng bắn ngay lập tức. Một cung tên tốc độ sẽ bắn ra một loạt ba mũi tên gây sát thương giảm, vẫn có thể kích hoạt các phép thuật và mất 1 lượt để bắn. Một cung tên sát thương sẽ bắn ra một phát bắn tỉa chắc chắn trúng đích, gây thêm sát thương dựa trên khoảng cách và mất 2 lượt để bắn.
actors.hero.herosubclass.sniper_short_desc=Xạ thủ có thể xuyên giáp bằng các đòn tấn công tầm xa. Sau khi tấn công bằng vũ khí ném, cô ấy có thể tiếp tục bằng một đòn tấn công đặc biệt từ cung tên của mình.
actors.hero.herosubclass.warden=cai ngục
actors.hero.herosubclass.warden_desc=Người Giám Hộ có mối liên hệ mật thiết với thiên nhiên, điều này mang lại cho cô ấy nhiều hiệu ứng bổ sung liên quan đến cỏ và cây cối. Cô ấy có thể nhìn xuyên qua những đám cỏ cao và rậm rạp như thể đó là không gian trống rỗng. Người Giám Hộ khiến cỏ mọc lên xung quanh bất kỳ hạt giống nào cô ấy ném hoặc trồng, và nhận được các hiệu ứng đặc biệt khi giẫm lên cây. Những hiệu ứng đặc biệt này thay thế các hiệu ứng thông thường của cây, có nghĩa là không có cây nào gây hại khi cô ấy giẫm lên.
actors.hero.herosubclass.warden_short_desc=Người quản ngục có thể nhìn xuyên qua cỏ cao và nhận được hiệu ứng bổ sung khi gieo hạt và giẫm đạp lên cây.
actors.hero.herosubclass.warlock=phù thủy
actors.hero.herosubclass.warlock_desc=Pháp sư có cơ hội gây ấn linh hồn lên các nhân vật khi sử dụng trượng lên họ. Cơ hội gây ấn linh hồn và thời gian hiệu lực tăng lên theo cấp độ trượng. Khi kẻ địch bị đánh dấu linh hồn, Pháp sư sẽ hồi 2 HP cho mỗi 5 sát thương gây ra, nhưng chỉ với các đòn tấn công cận chiến hoặc vũ khí ném, không phải từ trượng!
actors.hero.herosubclass.warlock_short_desc=Phù thủy có khả năng đánh dấu linh hồn kẻ thù bằng cây trượng của mình. Hắn sẽ hồi máu mỗi khi gây sát thương vật lý lên kẻ thù đã bị đánh dấu.
actors.hero.spells.auraofprotection$aurabuff.desc=Hiệp sĩ đang tỏa ra năng lượng bảo vệ xung quanh mình.\n\nBất kỳ đồng minh nào ở gần (bao gồm cả chính Hiệp sĩ) đều chịu sát thương giảm và nhận được hiệu ứng của phù hiệu giáp của Hiệp sĩ với sức mạnh được tăng cường.\n\nSố lượt còn lại: %s.
actors.hero.spells.auraofprotection$aurabuff.name=hào quang bảo vệ
actors.hero.spells.auraofprotection.desc=Hiệp sĩ bắt đầu tỏa ra năng lượng bảo vệ trong một vầng hào quang lấp lánh xung quanh bản thân trong 20 lượt. Bất kỳ đồng minh nào trong phạm vi 2 ô của Hiệp sĩ (bao gồm cả chính họ) sẽ chịu ít sát thương hơn %1$d%% và nhận được hiệu ứng của phù hiệu giáp của Hiệp sĩ với sức mạnh +%2$d%%. Việc giảm sát thương này diễn ra trước các hiệu ứng giảm sát thương khác (ví dụ: giáp). Hiệu ứng tăng sức mạnh của phù hiệu sẽ luôn được áp dụng, nhưng phép thuật này không thể khiến phù hiệu của Hiệp sĩ được áp dụng nhiều hơn một lần nếu một nhân vật đã được hưởng lợi từ nó (ví dụ: chính Hiệp sĩ, hoặc một hình ảnh lăng kính).
actors.hero.spells.auraofprotection.name=hào quang bảo vệ
actors.hero.spells.auraofprotection.short_desc=Tăng cường khả năng phòng thủ cho Paladin và các đồng minh gần đó.
actors.hero.spells.beamingray$beamingrayboost.desc=Đồng minh này vừa được dịch chuyển tức thời bằng Tia Sáng, giúp họ gây thêm sát thương lên kẻ địch gần nhất sau khi dịch chuyển. Sức Mạnh Của Nhiều Người cũng sẽ không hết hiệu lực khi hiệu ứng này đang hoạt động.\n\nSố lượt còn lại: %s.
actors.hero.spells.beamingray$beamingrayboost.name=tia sáng
actors.hero.spells.beamingray.desc=Thầy tu truyền sức mạnh của đồng minh vào một tia sáng chiếu rọi họ đến một vị trí. Nếu tia sáng va chạm với kẻ thù, nó sẽ đặt đồng minh ở gần đó và hướng họ về phía kẻ thù. Tia sáng có tầm bắn tối đa là ô %1$d, và sẽ tăng sát thương cộng thêm của Sức mạnh của Đa dạng lên +%2$d%% trong 10 lượt đối với kẻ thù gần nhất trong vòng 4 ô. Tia sáng thậm chí có thể dịch chuyển tức thời những đồng minh thường không thể di chuyển, nhưng tầm bắn sẽ bị giảm một nửa trong những trường hợp này.
actors.hero.spells.beamingray.name=tia sáng
actors.hero.spells.beamingray.no_space=Không có chỗ cho đồng minh của bạn xuất hiện ở đó.
actors.hero.spells.beamingray.out_of_range=Vị trí đó nằm ngoài phạm vi phủ sóng.
actors.hero.spells.beamingray.short_desc=Dịch chuyển đồng minh của bạn và tăng sát thương.
actors.hero.spells.blessspell.desc=Thầy tu đặt một lời chúc phúc thiêng liêng lên bản thân hoặc một nhân vật khác mà họ có thể nhìn thấy.\n\nKhi niệm lên chính mình, hiệu quả sẽ yếu hơn, ban cho %1$d lượt chúc phúc và %2$d lá chắn.\n\nKhi niệm lên các nhân vật khác, phép thuật sẽ mạnh hơn, ban cho %3$d lượt chúc phúc và %4$d khả năng hồi phục. Khả năng hồi phục dư thừa được chuyển hóa thành lá chắn.
actors.hero.spells.blessspell.name=chúc phúc
actors.hero.spells.blessspell.short_desc=Ban phước và che chở cho giáo sĩ, ban phước và chữa lành cho người khác.
actors.hero.spells.bodyform$bodyformbuff.desc=Hiện tại, hình dạng cơ thể của Trinity đang ban cho bạn sức mạnh của một bùa chú hoặc ký hiệu, như thể bạn đang trang bị nó trên vũ khí hoặc áo giáp hiện tại của mình.\n\nLưu ý rằng hình dạng cơ thể không thể cung cấp thêm một bản sao của hiệu ứng mà bạn đã được hưởng lợi.\n\nHiệu ứng hiện tại: %1$s.\n\nSố lượt còn lại: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=hình dạng cơ thể
actors.hero.spells.bodyform.desc=Thầy tu chọn một bùa chú hoặc ký hiệu mà họ đã xác định trong lượt này và truyền hiệu ứng của nó vào Trinity.\n\nKhi Trinity được sử dụng, Thầy tu nhận được hiệu ứng của bùa chú hoặc ký hiệu đã chọn trong %d lượt. Bùa chú hoặc ký hiệu tạm thời này sẽ hoạt động với bất kỳ hiệu ứng nào mà một bùa chú hoặc ký hiệu thông thường có.\n\nPhép thuật này thay thế bất kỳ hiệu ứng nào khác mà Trinity hiện đang được truyền vào.
actors.hero.spells.bodyform.name=hình dạng cơ thể
actors.hero.spells.bodyform.short_desc=Gán Trinity cho một phép thuật hoặc ký hiệu.
actors.hero.spells.cleanse.desc=Thầy tu xóa bỏ mọi hiệu ứng trạng thái có hại trên bản thân và các đồng minh hiển thị. Sau khi phép thuật kết thúc, tất cả các nhân vật bị ảnh hưởng cũng nhận được %1$d lượt miễn nhiễm hiệu ứng bất lợi và %2$d lá chắn.
actors.hero.spells.cleanse.name=làm sạch
actors.hero.spells.cleanse.short_desc=Xóa bỏ hiệu ứng bất lợi và tạo khiên bảo vệ.
actors.hero.spells.clericspell.charge_cost=Chi phí sạc: %d
actors.hero.spells.clericspell.invalid_enemy=Bạn không thể nhắm mục tiêu vào kẻ thù đó.
actors.hero.spells.clericspell.invalid_target=Bạn không thể nhắm mục tiêu vào vị trí đó.
actors.hero.spells.clericspell.no_target=Không có mục tiêu nào ở đó.
actors.hero.spells.clericspell.prompt=Chọn mục tiêu
actors.hero.spells.divineintervention.desc=Thầy tu truyền một lượng sức mạnh khổng lồ từ cuốn sách ma thuật của mình vào bản thân và đồng minh, tăng cường khả năng phòng thủ cho mọi người lên %1$d và kéo dài Dạng Thăng Thiên thêm %2$d lượt. Sức mạnh phòng thủ đáng kinh ngạc của phép thuật này được cân nhắc với chi phí sử dụng rất cao.\n\n Giống như các khả năng phòng thủ khác được ban bởi Dạng Thăng Thiên, khả năng phòng thủ này không suy giảm theo thời gian mà sẽ biến mất ngay lập tức khi Dạng Thăng Thiên kết thúc.
actors.hero.spells.divineintervention.name=sự can thiệp của thần thánh
actors.hero.spells.divineintervention.short_desc=Tăng cường đáng kể khả năng phòng thủ cho Pháp sư và đồng minh.
actors.hero.spells.divinesense$divinesensetracker.desc=Nhân vật này tạm thời có khả năng nhìn thấy các sinh vật khác ở gần đó bằng tâm trí!\n\nSố lượt còn lại: %s.
actors.hero.spells.divinesense$divinesensetracker.name=ý thức thần thánh
actors.hero.spells.divinesense.desc=Pháp sư tập trung giác quan vào môi trường xung quanh, có được khả năng nhìn thấu bằng tâm trí với phạm vi %d ô trong 50 lượt. Phép thuật này không mất thời gian để thi triển.
actors.hero.spells.divinesense.name=ý thức thần thánh
actors.hero.spells.divinesense.short_desc=Có được khả năng nhìn thấy bằng tâm trí trong một phạm vi rộng tạm thời.
actors.hero.spells.flash.desc=Thầy tu tập trung vào hình dạng thăng thiên của mình tại một vị trí gần đó và dịch chuyển tức thời đến đó. Phép thuật Flash có thể dịch chuyển thầy tu đến bất kỳ vị trí nào đã được phát hiện nằm trong phạm vi và không có người ở. Phép thuật này tiêu tốn nhiều lượt sử dụng sách hơn mỗi khi được sử dụng ở cùng một hình dạng thăng thiên.
actors.hero.spells.flash.name=đèn flash
actors.hero.spells.flash.prompt=Chọn vị trí
actors.hero.spells.flash.short_desc=Dịch chuyển tức thời đến một địa điểm gần đó.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Thầy tế sẽ có thể sử dụng phép Guiding Light miễn phí một lần nữa sau 50 lượt.\n\nSố lượt còn lại: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Ánh sáng dẫn đường
actors.hero.spells.guidinglight$illuminated.desc=Nhân vật này đang phát sáng do bị ánh sáng dẫn đường chiếu vào. Mặc dù ánh sáng không đủ mạnh để chiếu sáng khu vực xung quanh, nhưng hiệu ứng ma thuật sẽ giúp Pháp sư dễ dàng tấn công trúng mục tiêu hơn.
actors.hero.spells.guidinglight$illuminated.desc_generic=Các anh hùng khác vẫn có thể sử dụng kỹ năng "Được chiếu sáng" để hưởng lợi từ tài năng "Ánh sáng thiêu đốt", nhưng sẽ không nhận được bất kỳ sự tăng cường độ chính xác nào.
actors.hero.spells.guidinglight$illuminated.desc_priest=Ngoài ra, Thầy tu có thể hấp thụ năng lượng được chiếu sáng bởi hào quang, tia sáng từ cây trượng, đòn tấn công từ đồng minh, hoặc hiệu ứng từ một số vật phẩm. Sử dụng năng lượng được chiếu sáng theo cách này sẽ gây thêm sát thương phép thuật bằng cấp độ của Thầy tu + 5.
actors.hero.spells.guidinglight$illuminated.name=được chiếu sáng
actors.hero.spells.guidinglight.desc=Pháp sư phóng ra một luồng năng lượng ma thuật trúng mục tiêu, gây sát thương từ 2-8 và làm sáng mục tiêu đó. Đòn tấn công vật lý tiếp theo không bị cản trở nhắm vào kẻ địch đang được chiếu sáng chắc chắn sẽ trúng đích.
actors.hero.spells.guidinglight.desc_priest=_Phép thuật này mạnh hơn khi được Thầy tế sử dụng._ Lần sử dụng đầu tiên của phép thuật này sau mỗi 50 lượt không tốn điểm tích lũy sách phép, và hiệu ứng Ánh sáng sẽ được tiêu hao bởi Ánh hào quang, đũa phép, các nhân vật khác và các vật phẩm có tác động trực tiếp đến kẻ thù. Khi được sử dụng theo cách này, nó gây thêm sát thương phép thuật bằng cấp độ của Thầy tế + 5.
actors.hero.spells.guidinglight.name=Ánh sáng dẫn đường
actors.hero.spells.guidinglight.short_desc=Gây sát thương phép tầm xa và đảm bảo trúng đích.
actors.hero.spells.hallowedground$hallowedterrain.desc=Vùng đất này đã được thánh hóa. Đất thánh có tác dụng làm chậm kẻ thù, hồi máu cho đồng minh và khiến cỏ mọc lan rộng.
actors.hero.spells.hallowedground.desc=Vị linh mục tập trung ma thuật thần thánh của mình xuống đất gần đó, tạo ra một khu vực địa hình linh thiêng trong 20 lượt. Khi được thi triển, phép thuật này hồi phục 15 HP cho tất cả đồng minh (đồng minh khỏe mạnh và linh mục được bảo vệ), trói chân kẻ thù trong thời gian ngắn và làm lan rộng cỏ ngắn. Khu vực địa hình linh thiêng hồi phục 1 HP cho đồng minh mỗi lượt (đồng minh khỏe mạnh và linh mục được bảo vệ), làm suy yếu kẻ thù và ngẫu nhiên làm mọc cỏ cao. Khu vực địa hình linh thiêng sẽ bị phá hủy bởi lửa và sẽ tạo ra cỏ mọc lởm chởm nếu hiệu ứng hồi phục thụ động bị vô hiệu hóa hoặc linh mục không nhận được kinh nghiệm trong một thời gian.
actors.hero.spells.hallowedground.name=vùng đất thiêng liêng
actors.hero.spells.hallowedground.prompt=Chọn vị trí
actors.hero.spells.hallowedground.short_desc=Hồi máu cho đồng minh, làm chậm kẻ địch và lan tỏa cỏ trong phạm vi ảnh hưởng.
actors.hero.spells.holyintuition.cursed=Bạn cảm nhận được ma thuật tà ác ẩn chứa bên trong vật phẩm này.
actors.hero.spells.holyintuition.desc=Thầy tu tập trung giác quan vào một vật phẩm và xác định xem nó có bị nguyền rủa hay không mà không cần phải trang bị nó.
actors.hero.spells.holyintuition.name=trực giác thiêng liêng
actors.hero.spells.holyintuition.prompt=chọn một mục
actors.hero.spells.holyintuition.short_desc=Xác định xem một vật phẩm có bị nguyền rủa hay không.
actors.hero.spells.holyintuition.uncursed=Vật phẩm này không chứa ma thuật độc hại.
actors.hero.spells.holylance$lancecooldown.desc=Thầy tu vừa sử dụng Thánh Thương và phải đợi trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.spells.holylance$lancecooldown.name=thời gian hồi chiêu của thương thánh
actors.hero.spells.holylance.desc=Thầy tế tập trung một lượng lớn năng lượng vào một ngọn giáo ánh sáng hủy diệt. Ngọn giáo này gây sát thương %1$d-%2$d và luôn gây sát thương tối đa cho mục tiêu xác sống và quỷ dữ.\n\nPhép thuật này rất tốn năng lượng và có thời gian hồi chiêu là 30 lượt.
actors.hero.spells.holylance.name=ngọn giáo thần thánh
actors.hero.spells.holylance.short_desc=Gây sát thương phép tầm xa rất lớn.
actors.hero.spells.holyward$holyarmbuff.desc=Thầy tu đã truyền năng lượng thánh vào bộ giáp cũ của mình, tạm thời ghi đè lên bất kỳ phù hiệu nào hiện có và khiến bộ giáp chặn thêm 1 điểm sát thương.\n\nSố lượt còn lại: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Hiệp sĩ đã truyền năng lượng thánh vào bộ giáp đang mặc của mình, khiến bộ giáp chặn thêm 3 điểm sát thương.\n\nViệc sử dụng các phép thuật khác trong khi lá chắn thánh đang hoạt động sẽ kéo dài thời gian hiệu lực thêm 10 lượt cho mỗi lần sử dụng.\n\nSố lượt còn lại: %s.
actors.hero.spells.holyward$holyarmbuff.name=khu thánh
actors.hero.spells.holyward.desc=Thầy tu truyền các ký hiệu ánh sáng thánh vào bộ giáp đang mặc của mình, tăng khả năng chặn sát thương của giáp lên 1. Phép thuật này không mất thời gian để thi triển. Ký hiệu này kéo dài 50 lượt và sẽ ghi đè lên bất kỳ ký hiệu có lợi nào khác trên giáp trong suốt thời gian đó. Thầy tu sẽ được hưởng lợi từ hiệu ứng này ngay cả khi họ không mặc giáp.
actors.hero.spells.holyward.desc_paladin=_Phép thuật này mạnh hơn khi được Paladin thi triển._ Khả năng chặn sát thương bổ sung được tăng lên 3, phép thuật này không còn ghi đè lên các phù hiệu hiện có, và việc thi triển các phép thuật khác trong khi Holy Ward đang hoạt động sẽ kéo dài thời gian hiệu lực thêm 10 lượt cho mỗi lần sử dụng.
actors.hero.spells.holyward.glyph_desc=Biểu tượng này giúp tăng nhẹ lượng sát thương mà giáp có thể chặn được.
actors.hero.spells.holyward.glyph_name=%s ánh sáng
actors.hero.spells.holyward.name=khu thánh
actors.hero.spells.holyward.short_desc=Tạm thời ghi đè các biểu tượng để tăng khả năng chặn giáp.
actors.hero.spells.holyweapon$holywepbuff.desc=Thầy tu đã truyền năng lượng thánh vào vũ khí đang sử dụng của mình, tạm thời vô hiệu hóa mọi bùa chú hiện có và khiến vũ khí gây thêm 2 sát thương phép thuật trong mỗi đòn tấn công.\n\nSố lượt còn lại: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Hiệp sĩ đã truyền năng lượng thánh vào vũ khí đang sử dụng của mình, khiến các đòn tấn công gây thêm 6 sát thương phép thuật. Việc sử dụng các phép thuật khác trong khi vũ khí thánh đang hoạt động sẽ kéo dài thời gian hiệu lực thêm 10 lượt cho mỗi lần sử dụng. Số lượt còn lại:
actors.hero.spells.holyweapon$holywepbuff.name=vũ khí thần thánh
actors.hero.spells.holyweapon.desc=Pháp sư yểm bùa lên vũ khí đang đeo bằng năng lượng thánh, khiến vũ khí gây thêm 2 sát thương phép thuật mỗi khi tấn công kẻ địch. Phép thuật này không mất thời gian để thi triển. Hiệu ứng này kéo dài 50 lượt và sẽ ghi đè lên bất kỳ hiệu ứng có lợi nào khác trên vũ khí trong suốt thời gian đó. Đòn tấn công tay không cũng có thể hưởng lợi từ hiệu ứng này.
actors.hero.spells.holyweapon.desc_paladin=_Phép thuật này mạnh hơn khi được Paladin thi triển._ Sát thương phép thuật cộng thêm được tăng lên 6, phép thuật này không còn ghi đè lên các hiệu ứng phép thuật hiện có, và việc thi triển các phép thuật khác trong khi vũ khí thánh đang hoạt động sẽ kéo dài thời gian hiệu lực thêm 10 lượt cho mỗi lần sử dụng.
actors.hero.spells.holyweapon.ench_desc=Kẻ địch trúng phải vũ khí thần thánh sẽ chịu thêm sát thương phép thuật.
actors.hero.spells.holyweapon.ench_name=thánh %s
actors.hero.spells.holyweapon.name=vũ khí thần thánh
actors.hero.spells.holyweapon.short_desc=Tạm thời vô hiệu hóa các phép thuật để tăng sát thương.
actors.hero.spells.judgement.desc=Thầy tu đấm mạnh xuống đất, tạo ra một luồng ánh sáng gây sát thương cho tất cả kẻ địch mà họ có thể nhìn thấy. Sát thương cơ bản là %1$d-%2$d, nhưng cũng gây thêm 33%% sát thương cho mỗi phép thuật mà thầy tu đã sử dụng kể từ khi đạt đến dạng thăng thiên (hoặc kể từ lần cuối sử dụng Phán Xét). Hiện tại, Phán Xét sẽ gây sát thương %3$d-%4$d.
actors.hero.spells.judgement.name=phán xét
actors.hero.spells.judgement.short_desc=Gây sát thương cho tất cả kẻ địch trong tầm nhìn.
actors.hero.spells.layonhands.desc=Hiệp sĩ Thánh chiến truyền năng lượng thánh qua bàn tay, chữa lành hoặc bảo vệ bất cứ thứ gì họ chạm vào. Hiệp sĩ Thánh chiến có thể niệm phép này lên bất kỳ nhân vật nào ở gần để ban cho họ khả năng hồi phục, hoặc lên chính mình để nhận được lớp bảo vệ. Lượng hồi phục dư thừa từ phép thuật này sẽ được chuyển hóa thành lớp bảo vệ. Phép thuật này được niệm tức thì và có thể được niệm nhiều lần, nhưng không thể ban cho nhiều hơn ba lớp bảo vệ cùng một lúc.
actors.hero.spells.layonhands.name=đặt tay
actors.hero.spells.layonhands.short_desc=Hồi phục tức thì cho nhân vật đứng cạnh hoặc tạo khiên bảo vệ cho Hiệp sĩ.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Thầy tu vừa niệm phép Liên Kết Sự Sống lên đồng minh này.\n\nNgoài những lợi ích thông thường của Liên Kết Sự Sống, nhân vật này cũng chịu ít sát thương hơn, bất kỳ phép thuật tích cực nào của Thầy tu đều được áp dụng cho cả Thầy tu và đồng minh này thay vì chỉ một, và Sức Mạnh Của Nhiều Người sẽ không hết hiệu lực khi hiệu ứng này còn hoạt động.\n\nSố lượt còn lại: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=bảo vệ liên kết cuộc sống
actors.hero.spells.lifelinkspell.desc=Thầy tu củng cố mối liên kết giữa bản thân và đồng minh được tăng cường sức mạnh. Với mối liên kết được tăng cường này, mọi sát thương nhận được sẽ được chia sẻ giữa cả anh hùng và đồng minh trong %1$d lượt, và khả năng phòng thủ của Sức mạnh Đa dạng sẽ được tăng lên -%2$d%% sát thương nhận được. Lưu ý rằng sát thương được chia sẻ sau khi trừ giáp, nhưng trước khi giảm sát thương của Sức mạnh Đa dạng.\n\nTrong khi hiệu ứng này đang hoạt động, các phép thuật có lợi của Thầy tu cấp độ 3 trở xuống sẽ được áp dụng cho cả Thầy tu và đồng minh nếu chúng chỉ được áp dụng cho một trong hai người.
actors.hero.spells.lifelinkspell.name=liên kết cuộc sống
actors.hero.spells.lifelinkspell.short_desc=Chia sẻ sát thương với đồng minh và giảm sát thương mà đồng minh phải chịu.
actors.hero.spells.mindform.desc=Thầy tu chọn một cây trượng hoặc vũ khí ném mà họ đã xác định trong lượt chơi này và truyền hiệu ứng của nó vào Trinity.\n\nKhi sử dụng Trinity, Thầy tu có thể thực hiện một đòn tấn công duy nhất như thể họ đang sử dụng vật phẩm đã chọn với +%d. Điều này sẽ kích hoạt tất cả các hiệu ứng mà việc sử dụng loại vật phẩm đó thường kích hoạt.\n\nPhép thuật này thay thế bất kỳ hiệu ứng tâm linh nào khác mà Trinity hiện đang được truyền vào.
actors.hero.spells.mindform.name=hình thái tâm trí
actors.hero.spells.mindform.short_desc=Chỉ định Trinity cho một cây đũa phép hoặc vũ khí ném.
actors.hero.spells.mnemonicprayer.desc=Thầy tế đọc một lời cầu nguyện kéo dài thời gian hiệu lực của tất cả các hiệu ứng tăng hoặc giảm sức mạnh trên một mục tiêu cụ thể thêm %1$d lượt. Phép thuật này không mất thời gian để thi triển. Các hiệu ứng tích cực sẽ kéo dài hơn trên đồng minh (bao gồm cả chính thầy tế), và các hiệu ứng có hại sẽ kéo dài hơn trên kẻ thù.\n\nLời cầu nguyện ghi nhớ chỉ có thể kéo dài một hiệu ứng tăng hoặc giảm sức mạnh cụ thể một lần, và không thể kéo dài các hiệu ứng tăng sức mạnh được cấp từ khả năng của giáp.
actors.hero.spells.mnemonicprayer.name=lời cầu nguyện ghi nhớ
actors.hero.spells.mnemonicprayer.short_desc=Kéo dài hiệu ứng tăng/giảm sức mạnh lên đồng minh/kẻ thù, và tái áp dụng hiệu ứng "Được chiếu sáng".
actors.hero.spells.radiance.desc=Vị linh mục bùng phát ánh sáng thánh thiện, làm choáng váng tất cả kẻ địch trong tầm nhìn trong 3 lượt. Nếu kẻ địch đã bị chiếu sáng, Ánh Sáng sẽ kích hoạt sát thương cộng thêm của hiệu ứng Chiếu Sáng và sau đó áp dụng hiệu ứng suy yếu Chiếu Sáng. Ánh Sáng cũng sẽ khiến vị linh mục phát sáng trong 100 lượt nếu tầng hiện tại tối.
actors.hero.spells.radiance.name=sự rạng rỡ
actors.hero.spells.radiance.short_desc=Chiếu sáng và làm choáng kẻ địch trong tầm nhìn trong thời gian ngắn.
actors.hero.spells.recallinscription$useditemtracker.desc=Thầy tu vừa sử dụng một vật phẩm có tác dụng với phép thuật triệu hồi được khắc ghi. Thầy tu có thể niệm phép để lặp lại hiệu ứng của vật phẩm.\n\nVật phẩm đã sử dụng: %1$s.\n\nSố lượt còn lại: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=rune được sử dụng gần đây
actors.hero.spells.recallinscription.desc=Thầy tu sử dụng phép thuật thánh để tái tạo hiệu ứng của một phù chú ma thuật được tìm thấy trên một phiến đá phù chú hoặc cuộn giấy mà họ đã sử dụng trong %s lượt gần đây nhất.\n\nPhép Khắc Ghi Hồi Phục không thể được sử dụng để sao chép các cuộn giấy nâng cấp. Chi phí sử dụng phép thuật này thay đổi tùy thuộc vào vật phẩm được sử dụng gần đây: 2 cho phiến đá phù chú, 3 cho cuộn giấy, 4 cho cuộn giấy đặc biệt. Chi phí sử dụng này cũng được nhân đôi khi sao chép cuộn giấy chuyển hóa, hoặc các vật phẩm giả kim thuật phải được chế tạo bằng cách chuyển hóa hoặc nâng cấp.
actors.hero.spells.recallinscription.name=dòng chữ ghi nhớ
actors.hero.spells.recallinscription.short_desc=Lặp lại một viên đá rune hoặc cuộn giấy vừa được sử dụng.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Một lớp ánh sáng mỏng bao bọc giữa nhân vật này và kẻ thù. Nó không đủ mạnh để chặn hoàn toàn các đòn tấn công, nhưng sẽ làm suy yếu chúng.\n\nSố lượt còn lại: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=tấm chắn ánh sáng
actors.hero.spells.shieldoflight.desc=Pháp sư tạo ra một lớp chắn ánh sáng mỏng giữa bản thân và kẻ thù, tăng sức phòng thủ của áo giáp lên %1$d-%2$d trong 5 lượt.\n\nPhép thuật này không mất thời gian để thi triển, nhưng không thể sử dụng đồng thời lên nhiều mục tiêu.
actors.hero.spells.shieldoflight.name=tấm chắn ánh sáng
actors.hero.spells.shieldoflight.short_desc=Tạo lớp giáp tạm thời chống lại mục tiêu.
actors.hero.spells.smite.desc=Hiệp sĩ Thánh chiến truyền sức mạnh hủy diệt chính nghĩa vào đòn tấn công cận chiến. Ngoài sát thương cận chiến thông thường, Smite đảm bảo trúng đích mà không bị cản trở, có sức mạnh phù phép +300 và gây thêm sát thương phép thuật. Sát thương phép thuật cộng thêm của Smite tăng theo cấp độ của Hiệp sĩ Thánh chiến, và luôn gây sát thương phép thuật cộng thêm tối đa đối với kẻ thù bất tử hoặc ma quỷ.
actors.hero.spells.smite.name=đánh
actors.hero.spells.smite.short_desc=Đảm bảo trúng đích với sát thương cộng thêm và sức mạnh phép thuật.
actors.hero.spells.spiritform$spiritformbuff.desc=Hiện tại, linh hồn của Trinity đang ban cho bạn sức mạnh của một vật phẩm, như thể bạn đang trang bị nó.\n\nLưu ý rằng linh hồn không thể cung cấp thêm một bản sao của hiệu ứng mà bạn đã được hưởng lợi.\n\nHiệu ứng hiện tại: %1$s.\n\nSố lượt còn lại: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=hình dạng linh hồn
actors.hero.spells.spiritform.desc=Thầy tu chọn một chiếc nhẫn hoặc vật phẩm mà họ đã xác định trong lượt chơi này (ngoại trừ sách thánh) và truyền hiệu ứng của nó vào Trinity.\n\nNếu chọn một chiếc nhẫn, thì Trinity sẽ ban hiệu ứng của chiếc nhẫn đó ở mức +%1$d trong 20 lượt.\n\nNếu chọn một vật phẩm, thì Trinity sẽ sao chép hiệu ứng của vật phẩm đó ở mức +%2$d. Mỗi vật phẩm có các hành vi cụ thể khác nhau và chi phí tích lũy giáp khác nhau khi được sử dụng với Trinity.\n\nPhép thuật này thay thế bất kỳ hiệu ứng linh hồn nào khác mà Trinity hiện đang được truyền.
actors.hero.spells.spiritform.name=hình dạng linh hồn
actors.hero.spells.spiritform.short_desc=Gán Trinity cho một chiếc nhẫn hoặc hiện vật.
actors.hero.spells.stasis$stasisbuff.desc=Thầy tu hiện đang giữ một đồng minh trong trạng thái ngủ đông. Tất cả các hiệu ứng tích cực trên đồng minh này đều được bảo toàn, bao gồm cả Sức mạnh của Nhiều người, và họ sẽ xuất hiện trở lại bên cạnh Thầy tu khi hiệu ứng kết thúc. Hiệu ứng cũng có thể được kết thúc sớm bằng cách sử dụng lại phép Ngủ đông.\n\nĐồng minh trong trạng thái ngủ đông: %1$s.\nSố lượt còn lại: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Đồng minh bất động của bạn đã bị bỏ lại phía sau.
actors.hero.spells.stasis$stasisbuff.name=đồng minh trong trạng thái tĩnh
actors.hero.spells.stasis.desc=Thầy tu tập trung kết nối với đồng minh về phía mình, khiến đồng minh tạm thời bị giữ trong một trạng thái năng lượng tĩnh lặng bên trong thầy tu. Đồng minh sẽ được giữ trong tối đa %d lượt, với tất cả các hiệu ứng tích cực tác động lên họ không bị ảnh hưởng bởi thời gian ở trạng thái tĩnh lặng.\n\n Đồng minh sẽ xuất hiện bên cạnh thầy tu khi trạng thái tĩnh lặng kết thúc một cách tự nhiên hoặc họ có thể ngay lập tức niệm lại phép thuật mà không tốn chi phí để kết thúc hiệu ứng sớm hơn. Trạng thái tĩnh lặng thậm chí có thể di chuyển các đồng minh bất động, nhưng không thể chuyển họ giữa các tầng.
actors.hero.spells.stasis.name=trạng thái tĩnh
actors.hero.spells.stasis.short_desc=Giải cứu đồng minh khỏi ngục tối và bảo toàn họ.
actors.hero.spells.sunray.desc=Thầy tu bắn một tia sáng chói lóa vào mục tiêu, gây sát thương %1$d-%2$d và làm mù mục tiêu trong %3$d lượt. Tia sáng luôn gây sát thương tối đa cho mục tiêu là xác sống và quỷ. Sau khi bị trúng phép thuật này, thị lực của kẻ địch sẽ tự điều chỉnh, ngăn chúng bị mù lần nữa. Tuy nhiên, nếu chúng bị trúng phép thuật này lần nữa trong khi đang bị mù, thì ánh sáng sẽ quá mạnh và làm tê liệt chúng.
actors.hero.spells.sunray.name=tia nắng
actors.hero.spells.sunray.short_desc=Gây sát thương phép tầm xa và làm mù mục tiêu một lần.
actors.hero.spells.walloflight$lightwall.desc=Những mảng ánh sáng lung linh đang chắn lối đi ở đây.
actors.hero.spells.walloflight.desc=Hiệp sĩ tạo ra một bức tường làm từ các tấm ánh sáng đặc ngay trước mặt, dày 1 ô, rộng %1$d ô và tồn tại trong 20 lượt.\n\nBức tường này hoạt động giống như một bức tường thông thường, ngoại trừ việc nó có thể nhìn xuyên qua được. Kẻ thù bị mắc kẹt trong bức tường khi nó được tạo ra sẽ bị choáng váng trong giây lát và bị đẩy lùi nếu có thể. Bất cứ thứ gì bị mắc kẹt trong bức tường đều có thể di chuyển ra ngoài.\n\nBức tường có thể được tạo ra theo bất kỳ hướng nào trong bốn hướng chính hoặc bốn hướng chéo. Nếu một bức tường đã được kích hoạt, phép thuật có thể được sử dụng lại miễn phí để xóa bức tường ngay lập tức.
actors.hero.spells.walloflight.early_end=Bạn xua tan bức tường ánh sáng.
actors.hero.spells.walloflight.name=bức tường ánh sáng
actors.hero.spells.walloflight.short_desc=Tạo ra một bức tường ngăn chặn kẻ thù.
actors.hero.talent$aggressivebarriercooldown.desc=Bạn vừa sử dụng kỹ năng này và phải chờ trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.talent$aggressivebarriercooldown.name=thời gian hồi chiêu rào chắn tấn công
actors.hero.talent$combinedlethalityabilitytracker.executed=đã thực thi
actors.hero.talent$deadlyfollowuptracker.desc=Đấu sĩ vừa tấn công một kẻ địch bằng vũ khí ném, các đòn tấn công cận chiến của cô ấy vào cùng mục tiêu đó sẽ gây sát thương tăng cường.\n\nSố lượt còn lại: %s.
actors.hero.talent$deadlyfollowuptracker.name=sự theo dõi chết người
actors.hero.talent$followupstriketracker.desc=Nữ Thợ Săn vừa tấn công một kẻ địch bằng vũ khí ném, đòn tấn công cận chiến tiếp theo của cô ấy vào cùng mục tiêu đó sẽ gây sát thương được tăng cường.\n\nSố lượt còn lại: %s.
actors.hero.talent$followupstriketracker.name=cuộc tấn công tiếp theo
actors.hero.talent$improvisedprojectilecooldown.desc=Bạn vừa sử dụng kỹ năng này và phải chờ trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.talent$improvisedprojectilecooldown.name=thời gian hồi chiêu của đạn tự chế
actors.hero.talent$lethalhastecooldown.desc=Bạn vừa sử dụng kỹ năng này và phải chờ trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.talent$lethalhastecooldown.name=thời gian hồi chiêu tăng tốc chết người
actors.hero.talent$lingeringmagictracker.desc=Pháp sư vừa sử dụng trượng hoặc gậy phép, đòn tấn công vật lý tiếp theo của hắn sẽ gây thêm sát thương.\n\nSố lượt còn lại: %s.
actors.hero.talent$lingeringmagictracker.name=phép thuật còn vương vấn
actors.hero.talent$liquidagilacctracker.desc=Đòn tấn công cận chiến thông thường tiếp theo của Đấu sĩ sẽ nhận được độ chính xác cộng thêm.\n\nSố lượt còn lại: %s.
actors.hero.talent$liquidagilacctracker.name=sự nhanh nhẹn của chất lỏng
actors.hero.talent$patientstriketracker.desc=Đấu sĩ vừa mất một lượt chờ đợi, đòn tấn công cận chiến tiếp theo của cô ấy sẽ gây thêm sát thương.
actors.hero.talent$patientstriketracker.name=đình công của bệnh nhân
actors.hero.talent$preciseassaulttracker.desc=Đòn tấn công cận chiến thông thường tiếp theo của Đấu sĩ sẽ nhận được độ chính xác cộng thêm.\n\nSố lượt còn lại: %s.
actors.hero.talent$preciseassaulttracker.name=cuộc tấn công chính xác
actors.hero.talent$provokedangertracker.desc=Chiến binh vừa mất lớp khiên bảo vệ, đòn tấn công vật lý tiếp theo của anh ta sẽ gây thêm sát thương.\n\nSố lượt còn lại: %s.
actors.hero.talent$provokedangertracker.name=gây ra sự tức giận
actors.hero.talent$rejuvenatingstepscooldown.desc=Bạn vừa sử dụng kỹ năng này và phải chờ trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=các bước làm trẻ hóa
actors.hero.talent$satiatedspellstracker.desc=Phép thuật tiếp theo mà thầy tu thi triển sẽ ban cho họ một lượng khiên bảo vệ nhỏ.
actors.hero.talent$satiatedspellstracker.name=Phép thuật che chắn
actors.hero.talent$searinglightcooldown.desc=Bạn vừa sử dụng kỹ năng này và phải chờ trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.talent$searinglightcooldown.name=Ánh sáng rực cháy
actors.hero.talent$seershotcooldown.desc=Bạn vừa sử dụng kỹ năng này và phải chờ trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.talent$seershotcooldown.name=thời gian hồi chiêu của cú bắn tiên tri
actors.hero.talent$swiftequipcooldown.desc=Bạn vừa sử dụng kỹ năng này và phải chờ trước khi sử dụng lại.\n\nSố lượt còn lại: %s.
actors.hero.talent$swiftequipcooldown.name=thời gian hồi chiêu trang bị nhanh
actors.hero.talent.adventurers_intuition.desc=_+1:_ Đấu sĩ nhận diện vũ khí nhanh hơn _2,5 lần_ và giáp nhanh hơn _1,75 lần_.\n\n_+2:_ Đấu sĩ nhận diện vũ khí _khi cô ấy trang bị chúng_ và giáp nhanh hơn _2,5 lần_.
actors.hero.talent.adventurers_intuition.title=trực giác của nhà thám hiểm
actors.hero.talent.aggressive_barrier.desc=_+1:_ Đấu sĩ nhận được _3 giáp_ khi sử dụng kỹ năng vũ khí và có lượng máu từ 50% trở xuống.\n\n_+2:_ Đấu sĩ nhận được _5 giáp_ khi sử dụng kỹ năng vũ khí và có lượng máu từ 50% trở xuống.
actors.hero.talent.aggressive_barrier.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ cung cấp khả năng tạo khiên khi thực hiện đòn tấn công cận chiến ở mức máu thấp, với thời gian hồi chiêu 50 lượt.
actors.hero.talent.aggressive_barrier.title=rào cản hung hãn
actors.hero.talent.ally_warp.desc=_+1:_ Pháp sư có thể chọn một đồng minh để đổi chỗ ngay lập tức, trong phạm vi _2 ô_.\n\n_+2:_ Pháp sư có thể chọn một đồng minh để đổi chỗ ngay lập tức, trong phạm vi _4 ô_.\n\n_+3:_ Pháp sư có thể chọn một đồng minh để đổi chỗ ngay lập tức, trong phạm vi _6 ô_.\n\nPháp sư không thể đổi chỗ với các đồng minh không di chuyển.
actors.hero.talent.ally_warp.title=đồng minh biến dạng
actors.hero.talent.arcane_vision.desc=_+1:_ Khi Pháp sư tấn công kẻ địch, hắn sẽ có khả năng nhìn thấu tâm trí kẻ địch đó trong _10 lượt_.\n\n_+2:_ Khi Pháp sư tấn công kẻ địch, hắn sẽ có khả năng nhìn thấu tâm trí kẻ địch đó trong _15 lượt_.
actors.hero.talent.arcane_vision.title=tầm nhìn bí ẩn
actors.hero.talent.assassins_reach.desc=_+1:_ Tầm dịch chuyển của Sát thủ được tăng lên _1/3/4/6 ô_ mỗi cấp độ chuẩn bị, từ 1/2/3/4.\n\n_+2:_ Tầm dịch chuyển của Sát thủ được tăng lên _2/4/6/8 ô_, từ 1/2/3/4.\n\n_+3:_ Tầm dịch chuyển của Sát thủ được tăng lên _2/5/7/10 ô_, từ 1/2/3/4.\n\nKhả năng dịch chuyển này có thể xuyên qua các chướng ngại vật và kẻ thù, nhưng không thể xuyên qua địa hình rắn chắc như tường.
actors.hero.talent.assassins_reach.title=tầm với của sát thủ
actors.hero.talent.aura_of_protection.desc=_+1:_ Hiệp sĩ có thể sử dụng _Hào quang Bảo vệ_, một phép thuật giúp Hiệp sĩ và tất cả đồng minh trong phạm vi 2 ô có khả năng kháng sát thương _20%_ và hiệu ứng của phù hiệu giáp của Hiệp sĩ được tăng _50% sức mạnh_ trong 20 lượt, với chi phí là 2 lượt sử dụng.\n\n_+2:_ Hiệp sĩ có thể sử dụng _Hào quang Bảo vệ_, một phép thuật giúp Hiệp sĩ và tất cả đồng minh trong phạm vi 2 ô có khả năng kháng sát thương _30%_ và hiệu ứng của phù hiệu giáp của Hiệp sĩ được tăng _75% sức mạnh_ trong 20 lượt, với chi phí là 2 lượt sử dụng.\n\n_+3:_ Hiệp sĩ có thể sử dụng _Hào quang Bảo vệ_, một phép thuật giúp Hiệp sĩ và tất cả đồng minh trong phạm vi 2 ô có khả năng kháng sát thương _40%_ và hiệu ứng của phù hiệu giáp của Hiệp sĩ được tăng _100% sức mạnh_ trong 20 lượt, với chi phí là 2 lần sạc.
actors.hero.talent.aura_of_protection.title=hào quang bảo vệ
actors.hero.talent.backup_barrier.desc=_+1:_ Pháp sư nhận được _3 điểm phòng thủ_ mỗi khi sử dụng hết năng lượng cuối cùng của cây trượng.\n\n_+2:_ Pháp sư nhận được _5 điểm phòng thủ_ mỗi khi sử dụng hết năng lượng cuối cùng của cây trượng.
actors.hero.talent.backup_barrier.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ được kích hoạt từ cây trượng cấp cao nhất của anh hùng đó.
actors.hero.talent.backup_barrier.title=rào cản dự phòng
actors.hero.talent.barkskin.desc=_+1:_ Khi bước vào cỏ, Người bảo vệ nhận được _0-50% cấp độ của mình_ giáp da cây, giáp này sẽ mờ dần mỗi lượt.\n\n_+2:_ Khi bước vào cỏ, Người bảo vệ nhận được _0-100% cấp độ của mình_ giáp da cây, giáp này sẽ mờ dần mỗi lượt.\n\n_+3:_ Khi bước vào cỏ, Người bảo vệ nhận được _0-150% cấp độ của mình_ giáp da cây, giáp này sẽ mờ dần mỗi lượt.
actors.hero.talent.barkskin.title=vỏ cây
actors.hero.talent.beaming_ray.desc=Pháp sư có thể sử dụng _Tia Sáng_ từ một đồng minh được cường hóa với chi phí 1 điểm năng lượng. Tia sáng này có thể xuyên qua tường và dịch chuyển đồng minh đến vị trí được chỉ định. Nếu có kẻ thù ở vị trí đó, đồng minh sẽ xuất hiện bên cạnh kẻ thù và nhắm mục tiêu vào chúng. Tia Sáng thậm chí có thể dịch chuyển các đồng minh thường bất động, nhưng tầm bắn chỉ bằng một nửa khi làm vậy.\n\n_+1: Tia Sáng có tầm bắn tối đa là _4 ô,_ và tăng phần thưởng của Sức Mạnh Của Nhiều lên _+35% sát thương_ đối với kẻ địch gần nhất trong 10 lượt.\n\n_+2: Tia Sáng có tầm bắn tối đa là _8 ô,_ và tăng phần thưởng của Sức Mạnh Của Nhiều lên _+40% sát thương_ đối với kẻ địch gần nhất trong 10 lượt.\n\n_+3: Tia Sáng có tầm bắn tối đa là _12 ô,_ và tăng phần thưởng của Sức Mạnh Của Nhiều lên _+45% sát thương_ đối với kẻ địch gần nhất trong 10 lượt.\n\n_+4: Tia Sáng có tầm bắn tối đa là _16 ô,_ và tăng phần thưởng của Sức Mạnh Của Nhiều lên Tăng 50% sát thương lên kẻ địch gần nhất trong 10 lượt.
actors.hero.talent.beaming_ray.title=tia sáng
actors.hero.talent.blast_radius.desc=_+1:_ Bán kính vụ nổ nguyên tố được tăng lên _5 ô_, từ 4.\n\n_+2:_ Bán kính vụ nổ nguyên tố được tăng lên _6 ô_, từ 4.\n\n_+3:_ Bán kính vụ nổ nguyên tố được tăng lên _7 ô_, từ 4.\n\n_+4:_ Bán kính vụ nổ nguyên tố được tăng lên _8 ô_, từ 4.
actors.hero.talent.blast_radius.title=bán kính vụ nổ
actors.hero.talent.bless.desc=_+1:_ Pháp sư có thể niệm phép _Ban Phước_, một phép thuật ban _6 lượt ban phước và 10 điểm phòng thủ_ khi niệm lên chính mình hoặc _10 lượt ban phước và 10 điểm hồi máu_ khi niệm lên nhân vật khác, với chi phí 1 lượt sử dụng.\n\n_+2:_ Pháp sư có thể niệm phép _Ban Phước_, một phép thuật ban _10 lượt ban phước và 15 điểm phòng thủ_ khi niệm lên chính mình hoặc _15 lượt ban phước và 15 điểm hồi máu_ khi niệm lên nhân vật khác, với chi phí 1 lượt sử dụng.\n\nLượng hồi máu dư thừa từ phép thuật này được chuyển đổi thành điểm phòng thủ.
actors.hero.talent.bless.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ tăng độ chính xác và khả năng né tránh cho anh hùng đó và tất cả đồng minh lên 3% ở cấp +1 hoặc 5% ở cấp +2.
actors.hero.talent.bless.title=chúc phúc
actors.hero.talent.body_form.desc=Thầy tu có thể niệm phép _Biến Hình Thể_, truyền cho Trinity sức mạnh của một bùa chú hoặc ký hiệu mà Thầy tu đã xác định trong lượt chơi này, với chi phí là 2 lượt sử dụng.\n\n_+1:_ Khi Trinity được sử dụng, Thầy tu nhận được hiệu ứng đã chọn trong _20 lượt._\n\n_+2:_ Khi Trinity được sử dụng, Thầy tu nhận được hiệu ứng đã chọn trong _27 lượt._\n\n_+3:_ Khi Trinity được sử dụng, Thầy tu nhận được hiệu ứng đã chọn trong _33 lượt._\n\n_+4:_ Khi Trinity được sử dụng, Thầy tu nhận được hiệu ứng đã chọn trong _40 lượt._\n\n Trinity chỉ có thể được truyền một hiệu ứng biến hình tại một thời điểm. Chi phí tích lũy giáp của Trinity sẽ cao hơn nếu phù hiệu được chọn là loại hiếm và mạnh.
actors.hero.talent.body_form.title=hình dạng cơ thể
actors.hero.talent.body_replacement.desc=_+1:_ Sau khi nháy mắt, tên trộm để lại một hình nộm bằng gỗ có _20 máu và 1-3 giáp_.\n\n_+2:_ Sau khi nháy mắt, tên trộm để lại một hình nộm bằng gỗ có _40 máu và 2-6 giáp_.\n\n_+3:_ Sau khi nháy mắt, tên trộm để lại một hình nộm bằng gỗ có _60 máu và 3-9 giáp_.\n\n_+4:_ Sau khi nháy mắt, tên trộm để lại một hình nộm bằng gỗ có _80 máu và 4-12 giáp_.\n\nChỉ có thể có một hình nộm hoạt động cùng một lúc.
actors.hero.talent.body_replacement.title=thay thế cơ thể
actors.hero.talent.body_slam.desc=_+1:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề chịu sát thương bằng _1-4 cộng thêm 25%_ sức mạnh chặn sát thương của anh ta.\n\n_+2:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề chịu sát thương bằng _2-8 cộng thêm 50%_ sức mạnh chặn sát thương của anh ta.\n\n_+3:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề chịu sát thương bằng _3-12 cộng thêm 75%_ sức mạnh chặn sát thương của anh ta.\n\n_+4:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề chịu sát thương bằng _4-16 cộng thêm 100%_ sức mạnh chặn sát thương của anh ta.
actors.hero.talent.body_slam.title=cú vật ngã
actors.hero.talent.bounty_hunter.desc=_+1:_ Khi Sát thủ tiêu diệt kẻ địch bằng đòn tấn công đã chuẩn bị, tỷ lệ rơi vật phẩm sẽ tăng thêm _2/4/8/16%_ cho mỗi cấp độ chuẩn bị.\n\n_+2:_ Khi Sát thủ tiêu diệt kẻ địch bằng đòn tấn công đã chuẩn bị, tỷ lệ rơi vật phẩm sẽ tăng thêm _4/8/16/32% cho mỗi cấp độ chuẩn bị.\n\n_+3:_ Khi Sát thủ tiêu diệt kẻ địch bằng đòn tấn công đã chuẩn bị, tỷ lệ rơi vật phẩm sẽ tăng thêm _6/12/24/48% cho mỗi cấp độ chuẩn bị.
actors.hero.talent.bounty_hunter.title=thợ săn tiền thưởng
actors.hero.talent.cached_rations.desc=_+1:_ Tên trộm có thể tìm thấy _2 khẩu phần tiếp tế_ được đặt trong rương khi hắn khám phá vài tầng tiếp theo của hầm ngục.\n\n_+2:_ Tên trộm có thể tìm thấy _3 khẩu phần tiếp tế_ được đặt trong rương khi hắn khám phá vài tầng tiếp theo của hầm ngục.\n\nKhẩu phần tiếp tế được ăn nhanh, phục hồi một lượng no vừa phải, hồi 5 HP và phục hồi 1 lần sử dụng cho áo choàng bóng tối.
actors.hero.talent.cached_rations.title=khẩu phần dự trữ
actors.hero.talent.cleanse.desc=_+1:_ Pháp sư có thể sử dụng phép _Cleanse_, một phép thuật giúp _loại bỏ các hiệu ứng trạng thái tiêu cực_ khỏi Pháp sư và bất kỳ đồng minh nào ở gần đó, đồng thời ban cho họ _10 điểm phòng thủ_, với chi phí là 2 lượt sử dụng.\n\n_+2:_ Pháp sư có thể sử dụng phép _Cleanse_, một phép thuật giúp _ban cho Pháp sư và bất kỳ đồng minh nào ở gần đó khả năng miễn nhiễm với các hiệu ứng trạng thái tiêu cực trong 3 lượt, đồng thời ban cho họ _20 điểm phòng thủ_, với chi phí là 2 lượt sử dụng.\n\n_+3:_ Pháp sư có thể sử dụng phép _Cleanse_, một phép thuật giúp _ban cho Pháp sư và bất kỳ đồng minh nào ở gần đó khả năng miễn nhiễm với các hiệu ứng trạng thái tiêu cực trong 5 lượt, đồng thời ban cho họ _30 điểm phòng thủ_, với chi phí là 2 lượt sử dụng.
actors.hero.talent.cleanse.meta_desc=Nếu tài năng này được một anh hùng khác sở hữu, nó sẽ loại bỏ các hiệu ứng trạng thái tiêu cực trên anh hùng đó sau khi sử dụng gậy phép hoặc vật phẩm, với tỷ lệ 10/20/30% ở mức +1/+2/+3.
actors.hero.talent.cleanse.title=làm sạch
actors.hero.talent.cleave.desc=_+1:_ Thời gian cộng thêm mà Đấu sĩ nhận được khi tiêu diệt kẻ địch được tăng lên _30 lượt_, từ 15.\n\n_+2:_ Thời gian cộng thêm mà Đấu sĩ nhận được khi tiêu diệt kẻ địch được tăng lên _45 lượt_, từ 15.\n\n_+3:_ Thời gian cộng thêm mà Đấu sĩ nhận được khi tiêu diệt kẻ địch được tăng lên _60 lượt_, từ 15.
actors.hero.talent.cleave.title=chia tách
actors.hero.talent.cloned_armor.desc=_+1:_ Bản sao bóng tối nhận được _12%_ giá trị giáp của anh hùng và có _25% cơ hội_ sử dụng phù hiệu lên giáp của anh hùng.\n\n_+2:_ Bản sao bóng tối nhận được _24%_ giá trị giáp của anh hùng và có _50% cơ hội_ sử dụng phù hiệu lên giáp của anh hùng.\n\n_+3:_ Bản sao bóng tối nhận được _36%_ giá trị giáp của anh hùng và có _75% cơ hội_ sử dụng phù hiệu lên giáp của anh hùng.\n\n_+4:_ Bản sao bóng tối nhận được _48%_ giá trị giáp của anh hùng và có _100% cơ hội_ sử dụng phù hiệu lên giáp của anh hùng.
actors.hero.talent.cloned_armor.title=áo giáp nhân bản
actors.hero.talent.close_the_gap.desc=_+1:_ Đấu sĩ dịch chuyển tức thời _tối đa hai ô_ về phía mục tiêu khi bắt đầu một trận đấu.\n\n_+2:_ Đấu sĩ dịch chuyển tức thời _tối đa ba ô_ về phía mục tiêu khi bắt đầu một trận đấu.\n\n_+3:_ Đấu sĩ dịch chuyển tức thời _tối đa bốn ô_ về phía mục tiêu khi bắt đầu một trận đấu.\n\n_+4:_ Đấu sĩ dịch chuyển tức thời _tối đa năm ô_ về phía mục tiêu khi bắt đầu một trận đấu.\n\nKhả năng dịch chuyển này có thể xuyên qua các chướng ngại vật và kẻ thù, nhưng không thể xuyên qua địa hình rắn chắc như tường. Khả năng dịch chuyển này được tính đến khi xác định xem kẻ thù có nằm trong phạm vi để thách đấu hay không.
actors.hero.talent.close_the_gap.title=thu hẹp khoảng cách
actors.hero.talent.combined_energy.desc=_+1:_ Nếu Võ Sĩ sử dụng một kỹ năng vũ khí và một kỹ năng _4+ năng lượng_ trong vòng 5 lượt, cô ấy sẽ hồi phục 1 năng lượng đã tiêu hao.\n\n_+2:_ Nếu Võ Sĩ sử dụng một kỹ năng vũ khí và một kỹ năng _3+ năng lượng_ trong vòng 5 lượt, cô ấy sẽ hồi phục 1 năng lượng đã tiêu hao.\n\n_+3:_ Nếu Võ Sĩ sử dụng một kỹ năng vũ khí và một kỹ năng _2+ năng lượng_ trong vòng 5 lượt, cô ấy sẽ hồi phục 1 năng lượng đã tiêu hao.
actors.hero.talent.combined_energy.title=năng lượng kết hợp
actors.hero.talent.combined_lethality.desc=_+1:_ Nếu tướng tấn công bằng vũ khí cận chiến ngay sau khi sử dụng kỹ năng của một vũ khí khác, đòn tấn công đó sẽ kết liễu bất kỳ kẻ địch nào không phải trùm còn lại _dưới 13% HP_.\n\n_+2:_ Nếu tướng tấn công bằng vũ khí cận chiến ngay sau khi sử dụng kỹ năng của một vũ khí khác, đòn tấn công đó sẽ kết liễu bất kỳ kẻ địch nào không phải trùm còn lại _dưới 27% HP_.\n\n_+3:_ Nếu tướng tấn công bằng vũ khí cận chiến ngay sau khi sử dụng kỹ năng của một vũ khí khác, đòn tấn công đó sẽ kết liễu bất kỳ kẻ địch nào không phải trùm còn lại _dưới 40% HP_.\n\nĐòn tấn công này có thể là một đòn tấn công cận chiến thông thường, hoặc là một phần của kỹ năng vũ khí.
actors.hero.talent.combined_lethality.title=khả năng gây chết người kết hợp
actors.hero.talent.conserved_magic.desc=_+1:_ Mỗi lần phóng điện từ phép thuật hoang dã giờ đây sử dụng _0,33 điểm năng lượng_ thay vì 0,5, và phép thuật hoang dã có _25% cơ hội_ không mất lượt.\n\n_+2:_ Mỗi lần phóng điện từ phép thuật hoang dã giờ đây sử dụng _0,225 điểm năng lượng_ thay vì 0,5, và phép thuật hoang dã có _50% cơ hội_ không mất lượt.\n\n_+3:_ Mỗi lần phóng điện từ phép thuật hoang dã giờ đây sử dụng _0,15 điểm năng lượng_ thay vì 0,5, và phép thuật hoang dã có _75% cơ hội_ không mất lượt.\n\n_+4:_ Mỗi lần phóng điện từ phép thuật hoang dã giờ đây sử dụng _0,1 điểm năng lượng_ thay vì 0,5, và phép thuật hoang dã có _100% cơ hội_ không mất lượt.
actors.hero.talent.conserved_magic.title=phép thuật được bảo tồn
actors.hero.talent.counter_ability.desc=_+1:_ Nếu Đấu Sĩ sử dụng kỹ năng vũ khí trong vòng 3 lượt kể từ khi ảnh ảo của cô ấy bị tấn công, cô ấy sẽ ngay lập tức hồi phục _0.38 điểm tích lũy_.\n\n_+2:_ Nếu Đấu Sĩ sử dụng kỹ năng vũ khí trong vòng 3 lượt kể từ khi ảnh ảo của cô ấy bị tấn công, cô ấy sẽ ngay lập tức hồi phục _0.77 điểm tích lũy_.\n\n_+3:_ Nếu Đấu Sĩ sử dụng kỹ năng vũ khí trong vòng 3 lượt kể từ khi ảnh ảo của cô ấy bị tấn công, cô ấy sẽ ngay lập tức hồi phục _1.13 điểm tích lũy_.\n\n_+4:_ Nếu Đấu Sĩ sử dụng kỹ năng vũ khí trong vòng 3 lượt kể từ khi ảnh ảo của cô ấy bị tấn công, cô ấy sẽ ngay lập tức hồi phục _1.5 điểm tích lũy_.
actors.hero.talent.counter_ability.title=khả năng phản công
actors.hero.talent.deadly_followup.desc=_+1:_ Khi Đấu Sĩ tấn công trúng kẻ địch bằng vũ khí ném, cô ấy sẽ gây thêm _10% sát thương cận chiến_ cho chúng trong 5 lượt.\n\n_+2:_ Khi Đấu Sĩ tấn công trúng kẻ địch bằng vũ khí ném, cô ấy sẽ gây thêm _20% sát thương cận chiến_ cho chúng trong 5 lượt.\n\n_+3:_ Khi Đấu Sĩ tấn công trúng kẻ địch bằng vũ khí ném, cô ấy sẽ gây thêm _30% sát thương cận chiến_ cho chúng trong 5 lượt.
actors.hero.talent.deadly_followup.title=sự theo dõi chết người
actors.hero.talent.deathless_fury.desc=_+1:_ Trạng thái cuồng nộ tự động kích hoạt nếu Berserker sắp chết và cơn thịnh nộ đạt hoặc vượt quá 100%, nhưng có thời gian hồi chiêu là _3 cấp độ anh hùng_ khi điều này xảy ra.\n\n_+2:_ Trạng thái cuồng nộ tự động kích hoạt nếu Berserker sắp chết và cơn thịnh nộ đạt hoặc vượt quá 100%, nhưng có thời gian hồi chiêu là _2 cấp độ anh hùng_ khi điều này xảy ra.\n\n_+3:_ Trạng thái cuồng nộ tự động kích hoạt nếu Berserker sắp chết và cơn thịnh nộ đạt hoặc vượt quá 100%, nhưng có thời gian hồi chiêu là _1 cấp độ anh hùng_ khi điều này xảy ra.\n\nLưu ý rằng Berserker vẫn sẽ chết nếu anh ta có 0 HP khi trạng thái cuồng nộ kết thúc.
actors.hero.talent.deathless_fury.title=cơn thịnh nộ bất diệt
actors.hero.talent.deathly_durability.desc=_+1:_ Kẻ địch bị tiêu diệt bởi dấu ấn tử thần sẽ cho Rogue lớp giáp bằng _13%_ máu của chúng khi bị đánh dấu.\n\n_+2:_ Kẻ địch bị tiêu diệt bởi dấu ấn tử thần sẽ cho Rogue lớp giáp bằng _25%_ máu của chúng khi bị đánh dấu.\n\n_+3:_ Kẻ địch bị tiêu diệt bởi dấu ấn tử thần sẽ cho Rogue lớp giáp bằng _38%_ máu của chúng khi bị đánh dấu.\n\n_+4:_ Kẻ địch bị tiêu diệt bởi dấu ấn tử thần sẽ cho Rogue lớp giáp bằng _50%_ máu của chúng khi bị đánh dấu.
actors.hero.talent.deathly_durability.title=độ bền chết người
actors.hero.talent.desperate_power.desc=_+1:_ Gậy phép và trượng của Pháp sư tăng _+1 cấp độ_ ở lần phóng cuối cùng khi chúng chỉ còn lại một lần sạc cuối cùng.\n\n_+2:_ Gậy phép và trượng của Pháp sư tăng _+2 cấp độ_ ở lần phóng cuối cùng khi chúng chỉ còn lại một lần sạc cuối cùng.\n\n_+3:_ Gậy phép và trượng của Pháp sư tăng _+3 cấp độ_ ở lần phóng cuối cùng khi chúng chỉ còn lại một lần sạc cuối cùng.
actors.hero.talent.desperate_power.title=sức mạnh tuyệt vọng
actors.hero.talent.directed_power.desc=_+1:_ Đòn tấn công trực tiếp từ đòn đánh nguyên tố nhận thêm _+30% sức mạnh cường hóa_ cho mỗi kẻ địch trong phạm vi ảnh hưởng của đòn đánh nguyên tố, bao gồm cả mục tiêu tấn công.\n\n_+2:_ Đòn tấn công trực tiếp từ đòn đánh nguyên tố nhận thêm _+60% sức mạnh cường hóa_ cho mỗi kẻ địch trong phạm vi ảnh hưởng của đòn đánh nguyên tố, bao gồm cả mục tiêu tấn công.\n\n_+3:_ Đòn tấn công trực tiếp từ đòn đánh nguyên tố nhận thêm _+90% sức mạnh cường hóa_ cho mỗi kẻ địch trong phạm vi ảnh hưởng của đòn đánh nguyên tố, bao gồm cả mục tiêu tấn công.\n\n_+4:_ Đòn tấn công trực tiếp từ đòn đánh nguyên tố nhận thêm _+120% sức mạnh cường hóa_ cho mỗi kẻ địch trong phạm vi ảnh hưởng của đòn đánh nguyên tố, bao gồm cả mục tiêu tấn công.
actors.hero.talent.directed_power.title=sức mạnh định hướng
actors.hero.talent.divine_intervention.desc=_+1:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng _Can Tháp Thần Thánh_, giúp tăng giáp cho Pháp Sư và tất cả đồng minh lên đến _150_ và kéo dài Dạng Thăng Thiên thêm _3 lượt._\n\n_+2:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng _Can Tháp Thần Thánh_, giúp tăng giáp cho Pháp Sư và tất cả đồng minh lên đến _200_ và kéo dài Dạng Thăng Thiên thêm _4 lượt._\n\n_+3:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng _Can Tháp Thần Thánh_, giúp tăng giáp cho Pháp Sư và tất cả đồng minh lên đến _250_ và kéo dài Dạng Thăng Thiên thêm _5 lượt._\n\n_+4:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng _Can Tháp Thần Thánh_, giúp tăng giáp cho Pháp Sư và tất cả đồng minh lên đến _300 điểm phòng thủ_ và kéo dài Dạng Thăng Thiên thêm _6 lượt._\n\nCan thiệp Thần thánh tiêu tốn tới 5 lượt sử dụng sách phép và chỉ có thể được sử dụng một lần trong cùng một dạng thăng thiên.
actors.hero.talent.divine_intervention.title=sự can thiệp của thần thánh
actors.hero.talent.divine_sense.desc=_+1:_ Pháp sư có thể niệm _Giác Quan Thần Thánh_, một phép thuật ban cho họ _8 ô_ Tầm Nhìn Tâm Trí trong 50 lượt và không mất thời gian để niệm, với chi phí là 2 lượt sử dụng.\n\n_+2:_ Pháp sư có thể niệm _Giác Quan Thần Thánh_, một phép thuật ban cho họ _12 ô_ Tầm Nhìn Tâm Trí trong 50 lượt và không mất thời gian để niệm, với chi phí là 2 lượt sử dụng.
actors.hero.talent.divine_sense.meta_desc=Nếu tài năng này được một anh hùng khác sở hữu, nó sẽ ban cho họ khả năng nhìn thấu tâm trí trong một khoảnh khắc ngắn sau khi sử dụng một cây đũa phép hoặc vật phẩm có tầm bắn 3 ô ở mức +1 hoặc 5 ô ở mức +2.
actors.hero.talent.divine_sense.title=ý thức thần thánh
actors.hero.talent.double_jump.desc=_+1:_ Nếu Chiến binh thực hiện cú nhảy thứ hai trong vòng 3 lượt, cú nhảy đó sẽ có chi phí năng lượng giảm _16%.\n\n_+2:_ Nếu Chiến binh thực hiện cú nhảy thứ hai trong vòng 3 lượt, cú nhảy đó sẽ có chi phí năng lượng giảm _30%.\n\n_+3:_ Nếu Chiến binh thực hiện cú nhảy thứ hai trong vòng 3 lượt, cú nhảy đó sẽ có chi phí năng lượng giảm _40%.\n\n_+4:_ Nếu Chiến binh thực hiện cú nhảy thứ hai trong vòng 3 lượt, cú nhảy đó sẽ có chi phí năng lượng giảm _50%.
actors.hero.talent.double_jump.title=nhảy đôi
actors.hero.talent.double_mark.desc=_+1:_ Đánh dấu mục tiêu thứ hai cùng lúc với mục tiêu đầu tiên có chi phí giảm _30%.\n\n_+2:_ Đánh dấu mục tiêu thứ hai cùng lúc với mục tiêu đầu tiên có chi phí giảm _50%.\n\n_+3:_ Đánh dấu mục tiêu thứ hai cùng lúc với mục tiêu đầu tiên có chi phí giảm _65%.\n\n_+4:_ Đánh dấu mục tiêu thứ hai cùng lúc với mục tiêu đầu tiên có chi phí giảm _75%.
actors.hero.talent.double_mark.title=dấu hai lần
actors.hero.talent.durable_projectiles.desc=_+1:_ Vũ khí ném có độ bền _+50%_ khi được Thợ săn sử dụng.\n\n_+2:_ Vũ khí ném có độ bền _+75%_ khi được Thợ săn sử dụng.
actors.hero.talent.durable_projectiles.title=đạn bền
actors.hero.talent.durable_tips.desc=_+1:_ Phi tiêu có đầu nhọn có độ bền gấp _2 lần_ khi Người cai ngục sử dụng chúng.\n\n_+2:_ Phi tiêu có đầu nhọn có độ bền gấp _3 lần_ khi Người cai ngục sử dụng chúng.\n\n_+3:_ Phi tiêu có đầu nhọn có độ bền gấp _4 lần_ khi Người cai ngục sử dụng chúng.
actors.hero.talent.durable_tips.title=đầu bền
actors.hero.talent.eagle_eye.desc=_+1:_ Tầm nhìn của chim ưng linh hồn được tăng từ 6 lên 7 ô.\n\n_+2:_ Tầm nhìn của chim ưng linh hồn được tăng từ 6 lên 8 ô.\n\n_+3:_ Tầm nhìn của chim ưng linh hồn được tăng từ 6 lên 9 ô, và nó nhận được thêm 2 ô tầm nhìn tâm linh.\n\n_+4:_ Tầm nhìn của chim ưng linh hồn được tăng từ 6 lên 10 ô, và nó nhận được thêm 3 ô tầm nhìn tâm linh.
actors.hero.talent.eagle_eye.title=con mắt đại bàng
actors.hero.talent.elemental_power.desc=_+1:_ Sức mạnh của vụ nổ nguyên tố tăng thêm _25%_.\n\n_+2:_ Sức mạnh của vụ nổ nguyên tố tăng thêm _50%_.\n\n_+3:_ Sức mạnh của vụ nổ nguyên tố tăng thêm _75%_.\n\n_+4:_ Sức mạnh của vụ nổ nguyên tố tăng thêm _100%_.
actors.hero.talent.elemental_power.title=sức mạnh nguyên tố
actors.hero.talent.elemental_reach.desc=_+1:_ Tầm tấn công nguyên tố được tăng từ 4 lên 5 ô, và độ rộng được tăng từ 65 lên 75 độ.\n\n_+2:_ Tầm tấn công nguyên tố được tăng từ 4 lên 6 ô, và độ rộng được tăng từ 65 lên 85 độ.\n\n_+3:_ Tầm tấn công nguyên tố được tăng từ 4 lên 7 ô, và độ rộng được tăng từ 65 lên 95 độ.\n\n_+4:_ Tầm tấn công nguyên tố được tăng từ 4 lên 8 ô, và độ rộng được tăng từ 65 lên 105 độ.
actors.hero.talent.elemental_reach.title=phạm vi nguyên tố
actors.hero.talent.elimination_match.desc=_+1:_ Nếu Đấu sĩ thách đấu lại trong vòng 3 lượt sau khi trận đấu kết thúc, phí thách đấu sẽ giảm _16%.\n\n_+2:_ Nếu Đấu sĩ thách đấu lại trong vòng 3 lượt sau khi trận đấu kết thúc, phí thách đấu sẽ giảm _30%.\n\n_+3:_ Nếu Đấu sĩ thách đấu lại trong vòng 3 lượt sau khi trận đấu kết thúc, phí thách đấu sẽ giảm _40%.\n\n_+4:_ Nếu Đấu sĩ thách đấu lại trong vòng 3 lượt sau khi trận đấu kết thúc, phí thách đấu sẽ giảm _50%.
actors.hero.talent.elimination_match.title=trận đấu loại trực tiếp
actors.hero.talent.empowered_strike.desc=_+1: Đòn tấn công cận chiến đầu tiên của Pháp sư Chiến đấu bằng trượng sau khi phóng điện gây thêm _+16% sát thương_ và hiệu ứng cộng thêm của trượng tăng thêm _+50% sức mạnh_.\n\n_+2: Đòn tấn công cận chiến đầu tiên của Pháp sư Chiến đấu bằng trượng sau khi phóng điện gây thêm _+33% sát thương_ và hiệu ứng cộng thêm của trượng tăng thêm _+100% sức mạnh_.\n\n_+3: Đòn tấn công cận chiến đầu tiên của Pháp sư Chiến đấu bằng trượng sau khi phóng điện gây thêm _+50% sát thương_ và hiệu ứng cộng thêm của trượng tăng thêm _+150% sức mạnh_.
actors.hero.talent.empowered_strike.title=cuộc đình công được trao quyền
actors.hero.talent.empowering_meal.desc=_+1:_ Ăn thức ăn giúp Pháp sư nhận thêm _2 sát thương_ trong 3 lần gây sát thương tiếp theo bằng trượng.\n\n_+2:_ Ăn thức ăn giúp Pháp sư nhận thêm _3 sát thương_ trong 3 lần gây sát thương tiếp theo bằng trượng.
actors.hero.talent.empowering_meal.title=bữa ăn tiếp thêm sức mạnh
actors.hero.talent.endless_rage.desc=_+1:_ Chiến binh cuồng nộ có thể đạt tối đa _116% cơn thịnh nộ_.\n\n_+2:_ Chiến binh cuồng nộ có thể đạt tối đa _133% cơn thịnh nộ_.\n\n_+3:_ Chiến binh cuồng nộ có thể đạt tối đa _150% cơn thịnh nộ_.\n\nMỗi điểm cơn thịnh nộ trên 100% sẽ tăng khả năng chống chịu của trạng thái cuồng nộ thêm 1% và giảm thời gian hồi chiêu đi 1%, nhưng không làm tăng sát thương cộng thêm quá +50%.
actors.hero.talent.endless_rage.title=cơn thịnh nộ vô tận
actors.hero.talent.energizing_meal.desc=_+1:_ Ăn thức ăn mất 1 lượt của Pháp sư và cho phép anh ta _tái nạp đũa phép trong 5 lượt_.\n\n_+2:_ Ăn thức ăn mất 1 lượt của Pháp sư và cho phép anh ta _tái nạp đũa phép trong 8 lượt_.
actors.hero.talent.energizing_meal.title=bữa ăn tiếp thêm năng lượng
actors.hero.talent.enhanced_combo.desc=_+1:_ Khi chuỗi combo của Đấu sĩ đạt 7 trở lên, phạm vi đẩy lùi của Clobber tăng lên 3, gây chóng mặt và có thể hất kẻ địch xuống hố.\n\n_+2:_ Ngoài các lợi ích của +1, khi chuỗi combo của Đấu sĩ đạt 9 trở lên, Parry có tác dụng với nhiều đòn tấn công.\n\n_+3:_ Ngoài các lợi ích của +1 và +2, Đấu sĩ có thể nhảy lên tới combo/3 ô khi sử dụng Slam, Crush hoặc Fury.
actors.hero.talent.enhanced_combo.title=combo nâng cao
actors.hero.talent.enhanced_lethality.desc=_+1:_ Sát thủ có thể ám sát kẻ địch còn lại dưới _4/13/27/67% máu_ mỗi cấp độ chuẩn bị, tăng từ 3/10/20/50%.\n\n_+2:_ Sát thủ có thể ám sát kẻ địch còn lại dưới _5/17/33/83% máu_ mỗi cấp độ chuẩn bị, tăng từ 3/10/20/50%.\n\n_+3:_ Sát thủ có thể ám sát kẻ địch còn lại dưới _6/20/40/100% máu_ mỗi cấp độ chuẩn bị, tăng từ 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=khả năng gây chết người tăng cường
actors.hero.talent.enhanced_rings.desc=_+1:_ Khi Kẻ Lừa Gạt sử dụng một vật phẩm, nhẫn của hắn sẽ được nâng cấp +1 trong _3 lượt_.\n\n_+2:_ Khi Kẻ Lừa Gạt sử dụng một vật phẩm, nhẫn của hắn sẽ được nâng cấp +1 trong _6 lượt_.\n\n_+3:_ Khi Kẻ Lừa Gạt sử dụng một vật phẩm, nhẫn của hắn sẽ được nâng cấp +1 trong _9 lượt_.
actors.hero.talent.enhanced_rings.title=vòng tăng cường
actors.hero.talent.enlightening_meal.desc=_+1:_ Ăn thức ăn mất 1 lượt của Giáo sĩ và tăng cho họ _0,67 lượt sử dụng_ cho sách thánh của họ.\n\n_+2:_ Ăn thức ăn mất 1 lượt của Giáo sĩ và tăng cho họ _1 lượt sử dụng_ cho sách thánh của họ.
actors.hero.talent.enlightening_meal.meta_desc=Nếu tài năng này được một anh hùng khác sở hữu, nó sẽ cung cấp 2 lượt hồi phục cho đũa phép và vật phẩm ở mức +1, hoặc 3 lượt ở mức +2. Không thể dùng tài năng này để hồi phục cho Sừng Thịnh Vượng.
actors.hero.talent.enlightening_meal.title=Bữa ăn khai sáng
actors.hero.talent.enraged_catalyst.desc=_+1:_ Các phép thuật và lời nguyền trên vũ khí của Berserker được kích hoạt thường xuyên hơn khi hắn càng có nhiều cơn thịnh nộ, tối đa là _15% thường xuyên hơn_ khi đạt 100% cơn thịnh nộ.\n\n_+2:_ Các phép thuật và lời nguyền trên vũ khí của Berserker được kích hoạt thường xuyên hơn khi hắn càng có nhiều cơn thịnh nộ, tối đa là _30% thường xuyên hơn_ khi đạt 100% cơn thịnh nộ.\n\n_+3:_ Các phép thuật và lời nguyền trên vũ khí của Berserker được kích hoạt thường xuyên hơn khi hắn càng có nhiều cơn thịnh nộ, tối đa là _45% thường xuyên hơn_ khi đạt 100% cơn thịnh nộ.
actors.hero.talent.enraged_catalyst.title=chất xúc tác nổi giận
actors.hero.talent.evasive_armor.desc=_+1:_ Trong khi chạy tự do, Freerunner nhận thêm _+1 khả năng né tránh_ cho mỗi điểm sức mạnh vượt quá trên áo giáp của anh ta.\n\n_+2:_ Trong khi chạy tự do, Freerunner nhận được thêm _+2 khả năng né tránh_ cho mỗi điểm sức mạnh vượt quá trên áo giáp của anh ta.\n\n_+3:_ Trong khi chạy tự do, Freerunner nhận được thêm _+3 né tránh_ mỗi lần điểm sức mạnh dư thừa trên áo giáp của anh ta.
actors.hero.talent.evasive_armor.title=áo giáp né tránh
actors.hero.talent.even_the_odds.desc=_+1:_ Chiến binh gây thêm _5% sát thương cộng thêm_ cho mỗi kẻ địch trong phạm vi 2 ô khi hiệu ứng Enduring kết thúc.\n\n_+2:_ Chiến binh gây thêm _10% sát thương cộng thêm_ cho mỗi kẻ địch trong phạm vi 2 ô khi hiệu ứng Enduring kết thúc.\n\n_+3:_ Chiến binh gây thêm _15% sát thương cộng thêm_ cho mỗi kẻ địch trong phạm vi 2 ô khi hiệu ứng Enduring kết thúc.\n\n_+4:_ Chiến binh gây thêm _20% sát thương cộng thêm_ cho mỗi kẻ địch trong phạm vi 2 ô khi hiệu ứng Enduring kết thúc.
actors.hero.talent.even_the_odds.title=cân bằng tỷ lệ
actors.hero.talent.excess_charge.desc=_+1:_ Khi cây trượng của Pháp sư Chiến đấu được sạc đầy, cú phóng điện tiếp theo sẽ tăng cho anh ta _0.67 giáp_ cho mỗi cấp độ của cây trượng.\n\n_+2:_ Khi cây trượng của Pháp sư Chiến đấu được sạc đầy, cú phóng điện tiếp theo sẽ tăng cho anh ta _1.33 giáp_ cho mỗi cấp độ của cây trượng.\n\n_+3:_ Khi cây trượng của Pháp sư Chiến đấu được sạc đầy, cú phóng điện tiếp theo sẽ tăng cho anh ta _2 giáp_ cho mỗi cấp độ của cây trượng.
actors.hero.talent.excess_charge.title=phí vượt quá
actors.hero.talent.expanding_wave.desc=_+1:_ Phạm vi của Shockwave được tăng từ 5 lên 6 ô, và độ rộng được tăng từ 60 lên 75 độ.\n\n_+2:_ Phạm vi của Shockwave được tăng từ 5 lên 7 ô, và độ rộng được tăng từ 60 lên 90 độ.\n\n_+3:_ Phạm vi của Shockwave được tăng từ 5 lên 8 ô, và độ rộng được tăng từ 60 lên 105 độ.\n\n_+4:_ Phạm vi của Shockwave được tăng từ 5 lên 9 ô, và độ rộng được tăng từ 60 lên 120 độ.
actors.hero.talent.expanding_wave.title=sóng mở rộng
actors.hero.talent.expose_weakness.desc=_+1:_ Kẻ địch tấn công ảnh ảo của Đấu sĩ sẽ trở nên yếu và dễ bị tổn thương trong _2 lượt_.\n\n_+2:_ Kẻ địch tấn công ảnh ảo của Đấu sĩ sẽ trở nên yếu và dễ bị tổn thương trong _4 lượt_.\n\n_+3:_ Kẻ địch tấn công ảnh ảo của Đấu sĩ sẽ trở nên yếu và dễ bị tổn thương trong _6 lượt_.\n\n_+4:_ Kẻ địch tấn công ảnh ảo của Đấu sĩ sẽ trở nên yếu và dễ bị tổn thương trong _8 lượt_.
actors.hero.talent.expose_weakness.title=bộc lộ điểm yếu
actors.hero.talent.fan_of_blades.desc=_+1:_ Lưỡi kiếm quang phổ có thể tấn công thêm tối đa _1 mục tiêu_ với 50% sát thương. Mục tiêu phải hiển thị và nằm trong phạm vi ảnh hưởng hình nón _30 độ_.\n\n_+2:_ Lưỡi kiếm quang phổ có thể tấn công thêm tối đa _2 mục tiêu_ với 50% sát thương. Các mục tiêu phải hiển thị và nằm trong phạm vi ảnh hưởng hình nón _60 độ_.\n\n_+3:_ Lưỡi kiếm quang phổ có thể tấn công thêm tối đa _3 mục tiêu_ với 50% sát thương. Các mục tiêu phải hiển thị và nằm trong phạm vi ảnh hưởng hình nón _90 độ_.\n\n_+4:_ Lưỡi kiếm quang phổ có thể tấn công thêm tối đa _4 mục tiêu_ với 50% sát thương. Các mục tiêu phải hiển thị và nằm trong phạm vi ảnh hưởng hình nón _120 độ_.
actors.hero.talent.fan_of_blades.title=quạt lưỡi dao
actors.hero.talent.farsight.desc=_+1:_ Tầm nhìn của xạ thủ bắn tỉa được _tăng thêm 25%.\n\n_+2:_ Tầm nhìn của xạ thủ bắn tỉa được _tăng thêm 50%.\n\n_+3:_ Tầm nhìn của xạ thủ bắn tỉa được _tăng thêm 75%_.
actors.hero.talent.farsight.title=viễn thị
actors.hero.talent.fear_the_reaper.desc=_+1:_ Khi kẻ địch được đánh dấu tử thần đạt 0 HP, chúng sẽ bị _tàn phế_.\n\n_+2:_ Khi kẻ địch được đánh dấu tử thần đạt 0 HP, chúng sẽ bị _sợ hãi và tàn phế_.\n\n_+3:_ Khi kẻ địch được đánh dấu tử thần đạt 0 HP, chúng sẽ bị _sợ hãi và tàn phế_ và kẻ địch trong phạm vi 3 ô sẽ bị _tàn phế_.\n\n_+4:_ Khi kẻ địch được đánh dấu tử thần đạt 0 HP, chúng sẽ bị _sợ hãi và tàn phế_ và kẻ địch trong phạm vi 3 ô sẽ bị _sợ hãi và tàn phế_.
actors.hero.talent.fear_the_reaper.title=sợ thần chết
actors.hero.talent.feigned_retreat.desc=_+1:_ Nếu kẻ địch tấn công ảnh ảo của Đấu sĩ, cô ấy sẽ nhận được _2 lượt_ tăng tốc.\n\n_+2:_ Nếu kẻ địch tấn công ảnh ảo của Đấu sĩ, cô ấy sẽ nhận được _4 lượt_ tăng tốc.\n\n_+3:_ Nếu kẻ địch tấn công ảnh ảo của Đấu sĩ, cô ấy sẽ nhận được _6 lượt_ tăng tốc.\n\n_+4:_ Nếu kẻ địch tấn công ảnh ảo của Đấu sĩ, cô ấy sẽ nhận được _8 lượt_ tăng tốc.
actors.hero.talent.feigned_retreat.title=rút lui giả vờ
actors.hero.talent.fire_everything.desc=_+1:_ Phép thuật hoang dã giờ đây có thể kích hoạt _5 lần_ thay vì 4 lần, và mỗi cây đũa phép có _25% cơ hội_ sử dụng được 3 lần.\n\n_+2:_ Phép thuật hoang dã giờ đây có thể kích hoạt _6 lần_ thay vì 4 lần, và mỗi cây đũa phép có _50% cơ hội_ sử dụng được 3 lần.\n\n_+3:_ Phép thuật hoang dã giờ đây có thể kích hoạt _7 lần_ thay vì 4 lần, và mỗi cây đũa phép có _75% cơ hội_ sử dụng được 3 lần.\n\n_+4:_ Phép thuật hoang dã giờ đây có thể kích hoạt _8 lần_ thay vì 4 lần, và mỗi cây đũa phép có _100% cơ hội_ sử dụng được 3 lần.
actors.hero.talent.fire_everything.title=đốt hết mọi thứ đi
actors.hero.talent.flash.desc=_+1:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Flash_ để dịch chuyển tối đa _3 ô_ đi xa.\n\n_+2:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Flash_ để dịch chuyển tối đa _4 ô_ đi xa.\n\n_+3:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Flash_ để dịch chuyển tối đa _5 ô_ đi xa.\n\n_+4:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Flash_ để dịch chuyển tối đa _6 ô_ đi xa.\n\nFlash ban đầu tốn 2 lượt sử dụng sách phép, và thêm 1 lượt sử dụng cho mỗi lần sử dụng ở cùng dạng thăng thiên.
actors.hero.talent.flash.title=đèn flash
actors.hero.talent.focused_meal.desc=_+1:_ Ăn thức ăn giúp Đấu sĩ mất 1 lượt và tăng _0,67 điểm tích lũy_ cho vũ khí của cô ấy.\n\n_+2:_ Ăn thức ăn giúp Đấu sĩ mất 1 lượt và tăng _1 điểm tích lũy_ cho vũ khí của cô ấy.
actors.hero.talent.focused_meal.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ cộng thêm sát thương cho đòn đánh tiếp theo của họ bằng cấp độ của họ/3 ở mức +1, hoặc cấp độ/2 ở mức +2.
actors.hero.talent.focused_meal.title=bữa ăn tập trung
actors.hero.talent.followup_strike.desc=_+1:_ Khi Thợ săn tấn công trúng kẻ địch bằng cung tên hoặc vũ khí ném, đòn tấn công cận chiến tiếp theo của cô ấy vào kẻ địch đó gây thêm _2 sát thương_.\n\n_+2:_ Khi Thợ săn tấn công trúng kẻ địch bằng cung tên hoặc vũ khí ném, đòn tấn công cận chiến tiếp theo của cô ấy vào kẻ địch đó gây thêm _3 sát thương_.
actors.hero.talent.followup_strike.title=cuộc tấn công tiếp theo
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Các đòn tấn công từ chim ưng linh hồn làm mù kẻ địch trong _2 lượt_.\n\n_+2:_ Các đòn tấn công từ chim ưng linh hồn làm mù kẻ địch trong _5 lượt_.\n\n_+3:_ Các đòn tấn công từ chim ưng linh hồn làm mù kẻ địch trong _5 lượt_ và làm suy yếu chúng trong _2 lượt_.\n\n_+4:_ Các đòn tấn công từ chim ưng linh hồn làm mù kẻ địch trong _5 lượt_ và làm suy yếu chúng trong _5 lượt_.
actors.hero.talent.go_for_the_eyes.title=nhắm vào mắt
actors.hero.talent.growing_power.desc=_+1:_ Hiệu ứng tăng sức tấn công và tốc độ di chuyển từ sức mạnh tự nhiên được tăng lên _38% và 125%_, từ 33% và 100%.\n\n_+2:_ Hiệu ứng tăng sức tấn công và tốc độ di chuyển từ sức mạnh tự nhiên được tăng lên _42% và 150%_, từ 33% và 100%.\n\n_+3:_ Hiệu ứng tăng sức tấn công và tốc độ di chuyển từ sức mạnh tự nhiên được tăng lên _46% và 175%_, từ 33% và 100%.\n\n_+4:_ Hiệu ứng tăng sức tấn công và tốc độ di chuyển từ sức mạnh tự nhiên được tăng lên _50% và 200%_, từ 33% và 100%.
actors.hero.talent.growing_power.title=sức mạnh ngày càng tăng
actors.hero.talent.hallowed_ground.desc=_+1:_ Thầy tế có thể sử dụng phép _Đất Thánh_, một phép thánh hóa địa hình trong khu vực _3x3_ trong 20 lượt, với chi phí 2 lượt sử dụng.\n\n_+2:_ Thầy tế có thể sử dụng phép _Đất Thánh_, một phép thánh hóa địa hình trong khu vực _5x5_ trong 20 lượt, với chi phí 2 lượt sử dụng.\n\n_+3:_ Thầy tế có thể sử dụng phép _Đất Thánh_, một phép thánh hóa địa hình trong khu vực _7x7_ trong 20 lượt, với chi phí 2 lượt sử dụng.\n\nKhi được sử dụng, Đất Thánh hồi phục 15 HP cho đồng minh, trói chân kẻ địch trong thời gian ngắn và làm lan rộng cỏ ngắn. Sau đó, nó từ từ hồi phục HP cho đồng minh, làm suy yếu kẻ địch và khiến cỏ cao mọc ngẫu nhiên. Vùng đất linh thiêng ban cho linh mục khả năng che chắn thay vì chữa lành và sẽ bị phá hủy bởi lửa.
actors.hero.talent.hallowed_ground.title=vùng đất thiêng liêng
actors.hero.talent.hasty_retreat.desc=_+1:_ Sau khi nháy mắt, Kẻ trộm nhận được _1 lượt_ tăng tốc và tàng hình.\n\n_+2:_ Sau khi nháy mắt, Kẻ trộm nhận được _2 lượt_ tăng tốc và tàng hình.\n\n_+3:_ Sau khi nháy mắt, Kẻ trộm nhận được _3 lượt_ tăng tốc và tàng hình.\n\n_+4:_ Sau khi nháy mắt, Kẻ trộm nhận được _4 lượt_ tăng tốc và tàng hình.
actors.hero.talent.hasty_retreat.title=rút lui vội vã
actors.hero.talent.hearty_meal.desc=_+1:_ Ăn thức ăn giúp Chiến binh hồi phục _4 HP_ khi máu của anh ta ở mức 33% trở xuống.\n\n_+2:_ Ăn thức ăn giúp Chiến binh hồi phục _6 HP_ khi máu của anh ta ở mức 33% trở xuống.
actors.hero.talent.hearty_meal.title=bữa ăn thịnh soạn
actors.hero.talent.heightened_senses.desc=_+1:_ Nữ Thợ Săn có khả năng nhìn thấu tâm trí các nhân vật trong phạm vi _2 ô xung quanh vị trí của cô ấy_.\n\n_+2:_ Nữ Thợ Săn có khả năng nhìn thấu tâm trí các nhân vật trong phạm vi _3 ô xung quanh vị trí của cô ấy_.
actors.hero.talent.heightened_senses.title=giác quan được tăng cường
actors.hero.talent.heroic_energy.desc=_+1:_ Khả năng giáp của anh hùng có chi phí sử dụng giảm _12%.\n\n_+2:_ Khả năng giáp của anh hùng có chi phí sử dụng giảm _23%.\n\n_+3:_ Khả năng giáp của anh hùng có chi phí sử dụng giảm _32%.\n\n_+4:_ Khả năng giáp của anh hùng có chi phí sử dụng giảm _40%.
actors.hero.talent.heroic_energy.rat_title=năng lượng ratroic
actors.hero.talent.heroic_energy.title=năng lượng anh hùng
actors.hero.talent.hold_fast.desc=_+1:_ Khi Chiến binh chờ đợi, anh ta nhận được _1-2 giáp_ và làm chậm quá trình suy giảm của các hiệu ứng combo và khiên chắn đi _50%_ cho đến khi anh ta di chuyển.\n\n_+2:_ Khi Chiến binh chờ đợi, anh ta nhận được _2-4 giáp_ và làm chậm quá trình suy giảm của các hiệu ứng combo và khiên chắn đi _75%_ cho đến khi anh ta di chuyển.\n\n_+3:_ Khi Chiến binh chờ đợi, anh ta nhận được _3-6 giáp_ và làm chậm quá trình suy giảm của các hiệu ứng combo và khiên chắn đi _100%_ cho đến khi anh ta di chuyển.
actors.hero.talent.hold_fast.title=giữ chặt
actors.hero.talent.holy_intuition.desc=_+1:_ Pháp sư có thể niệm _Trực Giác Thánh Thiện_, một phép thuật tiết lộ xem một vật phẩm có bị nguyền rủa hay không với chi phí _3 lượt sử dụng._\n\n_+2:_ Pháp sư có thể niệm _Trực Giác Thánh Thiện_, một phép thuật tiết lộ xem một vật phẩm có bị nguyền rủa hay không với chi phí _2 lượt sử dụng._
actors.hero.talent.holy_intuition.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ cho phép anh hùng đó xác định trạng thái nguyền rủa trên một vật phẩm bị nguyền rủa ngay trước khi trang bị, với xác suất 15% ở mức +1 hoặc 25% ở mức +2.
actors.hero.talent.holy_intuition.title=trực giác thiêng liêng
actors.hero.talent.holy_lance.desc=_+1:_ Linh mục có thể sử dụng _Ngọn Giáo Thánh_, một phép thuật tàn phá gây ra _30-55 sát thương_ với chi phí 4 lượt sử dụng.\n\n_+2:_ Linh mục có thể sử dụng _Ngọn Giáo Thánh_, một phép thuật tàn phá gây ra _45-83 sát thương_ với chi phí 4 lượt sử dụng.\n\n_+3:_ Linh mục có thể sử dụng _Ngọn Giáo Thánh_, một phép thuật tàn phá gây ra _60-110 sát thương_ với chi phí 4 lượt sử dụng.\n\nNgọn Giáo Thánh luôn gây sát thương tối đa cho kẻ thù ma quỷ và xác sống. Ngọn Giáo Thánh có thời gian hồi chiêu 30 lượt trước khi có thể sử dụng lại.
actors.hero.talent.holy_lance.title=ngọn giáo thần thánh
actors.hero.talent.impact_wave.desc=_+1:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề bị đẩy lùi _2 ô_ và có _25% khả năng_ trở nên dễ bị tấn công trong 5 lượt.\n\n_+2:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề bị đẩy lùi _3 ô_ và có _50% khả năng_ trở nên dễ bị tấn công trong 5 lượt.\n\n_+3:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề bị đẩy lùi _4 ô_ và có _75% khả năng_ trở nên dễ bị tấn công trong 5 lượt.\n\n_+4:_ Khi Chiến binh tiếp đất sau khi nhảy, tất cả kẻ địch liền kề bị đẩy lùi _5 ô_ và có _100% khả năng_ trở nên dễ bị tấn công trong 5 lượt.
actors.hero.talent.impact_wave.title=sóng xung kích
actors.hero.talent.improvised_projectiles.desc=_+1:_ Chiến binh có thể làm mù kẻ địch trong _2 lượt_ bằng cách ném bất kỳ vật phẩm nào không phải là vũ khí ném vào chúng. Thời gian hồi chiêu là 50 lượt.\n\n_+2:_ Chiến binh có thể làm mù kẻ địch trong _3 lượt_ bằng cách ném bất kỳ vật phẩm nào không phải là vũ khí ném vào chúng. Thời gian hồi chiêu là 50 lượt.
actors.hero.talent.improvised_projectiles.title=đạn tự chế
actors.hero.talent.inscribed_power.desc=_+1:_ Khi Pháp sư đọc một cuộn giấy hoặc sử dụng một vật phẩm phép thuật, _2 lần phóng phép tiếp theo_ của anh ta sẽ được tăng +2 cấp.\n\n_+2:_ Khi Pháp sư đọc một cuộn giấy hoặc sử dụng một vật phẩm phép thuật, _3 lần phóng phép tiếp theo_ của anh ta sẽ được tăng +2 cấp.\n\nSố lần phóng phép được tăng cường sẽ được nhân đôi khi sử dụng cuộn giấy nâng cấp, chuyển hóa hoặc vật phẩm giả kim thuật phải được chế tạo bằng những cuộn giấy đó.\n\nĐối với các vật phẩm giả kim thuật có số lượng đầu ra cao hơn (ví dụ: hầu hết các phép thuật), tài năng này có cơ hội được kích hoạt dựa trên số lượng vật phẩm đó được sản xuất.
actors.hero.talent.inscribed_power.title=sức mạnh được ghi chép
actors.hero.talent.inscribed_stealth.desc=_+1:_ Kẻ trộm nhận được _3 lượt_ tàng hình sau khi đọc một cuộn giấy hoặc sử dụng một vật phẩm phép thuật.\n\n_+2:_ Kẻ trộm nhận được _5 lượt_ tàng hình sau khi đọc một cuộn giấy hoặc sử dụng một vật phẩm phép thuật.\n\nThời gian tàng hình được nhân đôi khi sử dụng cuộn giấy nâng cấp, cuộn giấy chuyển hóa hoặc các vật phẩm giả kim thuật phải được chế tạo bằng các cuộn giấy đó.\n\nĐối với các vật phẩm giả kim thuật có số lượng đầu ra cao hơn (ví dụ: hầu hết các phép thuật), tài năng này có cơ hội được kích hoạt dựa trên số lượng vật phẩm đó được sản xuất.
actors.hero.talent.inscribed_stealth.title=bí mật được khắc
actors.hero.talent.invigorating_meal.desc=_+1:_ Ăn thức ăn khiến Thợ săn mất 1 lượt (quả mọng được ăn ngay lập tức) và cho cô ấy _1 lượt tăng tốc_.\n\n_+2:_ Ăn thức ăn khiến Thợ săn mất 1 lượt (quả mọng được ăn ngay lập tức) và cho cô ấy _2 lượt tăng tốc_.
actors.hero.talent.invigorating_meal.title=bữa ăn bổ dưỡng
actors.hero.talent.invigorating_victory.desc=_+1:_ Nếu Đấu sĩ đánh bại mục tiêu trước khi trận đấu kết thúc, cô ấy sẽ hồi phục _5 HP cộng với 30% sát thương_ mà cô ấy nhận được trong trận đấu.\n\n_+2:_ Nếu Đấu sĩ đánh bại mục tiêu trước khi trận đấu kết thúc, cô ấy sẽ hồi phục _10 HP cộng với 50% sát thương_ mà cô ấy nhận được trong trận đấu.\n\n_+3:_ Nếu Đấu sĩ đánh bại mục tiêu trước khi trận đấu kết thúc, cô ấy sẽ hồi phục _15 HP cộng với 65% sát thương_ mà cô ấy nhận được trong trận đấu.\n\n_+4:_ Nếu Đấu sĩ đánh bại mục tiêu trước khi trận đấu kết thúc, cô ấy sẽ hồi phục _20 HP cộng với 75% sát thương_ mà cô ấy nhận được trong trận đấu.
actors.hero.talent.invigorating_victory.title=chiến thắng đầy sức sống
actors.hero.talent.iron_stomach.desc=_+1:_ Ăn thức ăn giúp Chiến binh mất 1 lượt và tăng _75% khả năng kháng sát thương_ trong khi ăn.\n\n_+2:_ Ăn thức ăn giúp Chiến binh mất 1 lượt và tăng _100% khả năng kháng sát thương_ trong khi ăn.
actors.hero.talent.iron_stomach.title=dạ dày sắt
actors.hero.talent.iron_will.desc=_+1:_ Lá chắn do ấn của Chiến binh cung cấp được _tăng thêm 1_.\n\n_+2:_ Lá chắn do ấn của Chiến binh cung cấp được _tăng thêm 2_.
actors.hero.talent.iron_will.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ tự động ban tặng 1 hoặc 2 lá chắn tối đa tương tự như hiệu ứng phá vỡ phong ấn của Chiến binh.
actors.hero.talent.iron_will.title=ý chí sắt đá
actors.hero.talent.judgement.desc=_+1:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Phán Xét,_ gây _10-20 sát thương_ cho tất cả kẻ địch hiển thị.\n\n_+2:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Phán Xét,_ gây _15-30 sát thương_ cho tất cả kẻ địch hiển thị.\n\n_+3:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Phán Xét,_ gây _20-40 sát thương_ cho tất cả kẻ địch hiển thị.\n\n_+4:_ Khi ở Dạng Thăng Thiên, Pháp Sư có thể sử dụng phép _Phán Xét,_ gây _25-50 sát thương_ cho tất cả kẻ địch hiển thị.\n\nPhán Xét tốn 3 lượt sử dụng sách phép. Phép Phán Xét gây thêm +33% sát thương cho mỗi phép mà Pháp sư đã sử dụng kể từ khi đạt đến dạng thăng thiên hoặc kể từ lần sử dụng Phán Xét gần nhất.
actors.hero.talent.judgement.title=phán xét
actors.hero.talent.lay_on_hands.desc=_+1:_ Hiệp sĩ có thể sử dụng phép _Lay on Hands_, một phép thuật hồi phục tức thì 15 HP cho nhân vật gần đó, hoặc tăng 15 điểm giáp cho Hiệp sĩ, với chi phí 1 lượt sử dụng.\n\n_+2:_ Hiệp sĩ có thể sử dụng phép _Lay on Hands_, một phép thuật hồi phục tức thì 20 HP cho nhân vật gần đó, hoặc tăng 20 điểm giáp cho Hiệp sĩ, với chi phí 1 lượt sử dụng.\n\n_+3:_ Hiệp sĩ có thể sử dụng phép _Lay on Hands_, một phép thuật hồi phục tức thì 25 HP cho nhân vật gần đó, hoặc tăng 25 điểm giáp cho Hiệp sĩ, với chi phí 1 lượt sử dụng.\n\nLượng hồi phục dư thừa từ phép thuật này sẽ được chuyển đổi thành giáp. Có thể sử dụng phép Lay on Hands nhiều lần, nhưng không thể tạo ra lớp bảo vệ tương đương với hơn ba lần sử dụng cùng một lúc.
actors.hero.talent.lay_on_hands.title=đặt tay
actors.hero.talent.lethal_defense.desc=_+1:_ Khi Đấu Sĩ tiêu diệt kẻ địch bằng đòn combo, thời gian hồi chiêu của lớp khiên phá vỡ sẽ giảm đi 50 lượt.\n\n_+2:_ Khi Đấu Sĩ tiêu diệt kẻ địch bằng đòn combo, thời gian hồi chiêu của lớp khiên phá vỡ sẽ giảm đi 100 lượt.\n\n_+3:_ Khi Đấu Sĩ tiêu diệt kẻ địch bằng đòn combo, thời gian hồi chiêu của lớp khiên phá vỡ sẽ giảm đi 150 lượt.\n\nThời gian hồi chiêu của khiên có thể giảm xuống thấp nhất là -150 lượt nhờ kỹ năng này, có nghĩa là nó sẽ ngay lập tức khả dụng trở lại sau khi được kích hoạt.
actors.hero.talent.lethal_defense.title=phòng thủ chết người
actors.hero.talent.lethal_haste.desc=_+1:_ Khi Đấu Sĩ tung đòn kết liễu vào kẻ địch bằng kỹ năng vũ khí, cô ấy nhận được _3 lượt_ di chuyển tức thì.\n\n_+2:_ Khi Đấu Sĩ tung đòn kết liễu vào kẻ địch bằng kỹ năng vũ khí, cô ấy nhận được _5 lượt_ di chuyển tức thì.
actors.hero.talent.lethal_haste.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ được kích hoạt bằng các đòn tấn công vũ khí thông thường, với thời gian hồi chiêu 100 lượt.
actors.hero.talent.lethal_haste.title=tốc độ chết người
actors.hero.talent.lethal_momentum.desc=_+1:_ Khi Chiến binh tung đòn kết liễu vào kẻ địch bằng vũ khí vật lý, có _67% cơ hội_ để không mất lượt nào.\n\n_+2:_ Khi Chiến binh tung đòn kết liễu vào kẻ địch bằng vũ khí vật lý, có _100% cơ hội_ để không mất lượt nào.
actors.hero.talent.lethal_momentum.title=động lực chết người
actors.hero.talent.life_link.desc=Thầy tu có thể sử dụng phép _Liên Kết Sự Sống_ giữa bản thân và một đồng minh được cường hóa với chi phí 2 lượt sử dụng. Phép thuật này khiến sát thương được chia sẻ giữa Pháp sư và đồng minh của họ, và khiến các phép thuật có lợi của pháp sư cấp 3 trở xuống được áp dụng cho cả hai nếu một trong hai đang bị ảnh hưởng.\n\n_+1: Liên kết Sự sống kéo dài trong _10 lượt_ và tăng phần thưởng của Sức mạnh của Nhiều lên _-35% sát thương nhận vào._\n\n_+2: Liên kết Sự sống kéo dài trong _13 lượt_ và tăng phần thưởng của Sức mạnh của Nhiều lên _-40% sát thương nhận vào._\n\n_+3: Liên kết Sự sống kéo dài trong _17 lượt_ và tăng phần thưởng của Sức mạnh của Nhiều lên _-45% sát thương nhận vào._\n\n_+4: Liên kết Sự sống kéo dài trong _20 lượt_ và tăng phần thưởng của Sức mạnh của Nhiều lên _-50% sát thương nhận vào._
actors.hero.talent.life_link.title=liên kết cuộc sống
actors.hero.talent.light_cloak.desc=_+1:_ Kẻ trộm có thể sử dụng áo choàng bóng tối ngay cả khi không trang bị, nhưng nó sẽ hồi phục với tốc độ _25%_ khi không trang bị.\n\n_+2:_ Kẻ trộm có thể sử dụng áo choàng bóng tối ngay cả khi không trang bị, nhưng nó sẽ hồi phục với tốc độ _50%_ khi không trang bị.\n\n_+3:_ Kẻ trộm có thể sử dụng áo choàng bóng tối ngay cả khi không trang bị, nhưng nó sẽ hồi phục với tốc độ _75%_ khi không trang bị.
actors.hero.talent.light_cloak.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ tăng tốc độ sạc của tất cả các vật phẩm lên 7/13/20% ở cấp độ +1/+2/+3.
actors.hero.talent.light_cloak.title=áo choàng nhẹ
actors.hero.talent.light_reading.desc=_+1:_ Pháp sư có thể sử dụng sách thánh của mình ngay cả khi không trang bị, nhưng tốc độ nạp lại chỉ bằng _25%_ khi không trang bị.\n\n_+2:_ Pháp sư có thể sử dụng sách thánh của mình ngay cả khi không trang bị, nhưng tốc độ nạp lại chỉ bằng _50%_ khi không trang bị.\n\n_+3:_ Pháp sư có thể sử dụng sách thánh của mình ngay cả khi không trang bị, nhưng tốc độ nạp lại chỉ bằng _75%_ khi không trang bị.
actors.hero.talent.light_reading.meta_desc=Nếu tài năng này được một anh hùng khác sở hữu, nó sẽ tăng tốc độ hồi chiêu của tất cả các cây trượng lên 7/13/20% ở cấp độ +1/+2/+3.
actors.hero.talent.light_reading.title=Đọc sách nhẹ nhàng
actors.hero.talent.lingering_magic.desc=_+1:_ Khi Pháp sư phóng điện bằng đũa phép hoặc trượng, đòn tấn công vật lý tiếp theo của hắn gây thêm _1-2 sát thương_.\n\n_+2:_ Khi Pháp sư phóng điện bằng đũa phép hoặc trượng, đòn tấn công vật lý tiếp theo của hắn gây thêm _2 sát thương_.
actors.hero.talent.lingering_magic.title=phép thuật còn vương vấn
actors.hero.talent.liquid_agility.desc=_+1:_ Khi uống hoặc ném thuốc, đồ uống hoặc thần dược, Đấu sĩ có _khả năng né tránh gấp 3 lần_ và độ chính xác gấp 3 lần_ cho đòn tấn công cận chiến tiếp theo trong vòng 5 lượt.\n\n_+2:_ Khi uống hoặc ném thuốc, đồ uống hoặc thần dược, Đấu sĩ có _khả năng né tránh vô hạn_ và độ chính xác vô hạn_ cho đòn tấn công cận chiến tiếp theo trong vòng 5 lượt.\n\nPhần thưởng này kéo dài thêm một lượt và một đòn tấn công khi sử dụng thuốc tăng sức mạnh, kinh nghiệm hoặc vật phẩm giả kim thuật cần được chế tạo bằng những loại thuốc đó.\n\nĐối với các vật phẩm giả kim thuật có số lượng sản phẩm đầu ra cao hơn (ví dụ: đồ uống aqua brew), tài năng này có cơ hội kích hoạt dựa trên số lượng vật phẩm đó được sản xuất.
actors.hero.talent.liquid_agility.title=sự nhanh nhẹn của chất lỏng
actors.hero.talent.liquid_nature.desc=_+1:_ Khi Thợ săn uống hoặc ném một loại thuốc, đồ uống hoặc thần dược, _tối đa 4 ô cỏ_ sẽ mọc lên ở khu vực xung quanh, và kẻ địch liền kề sẽ bị trói chân trong _1 lượt_.\n\n_+2:_ Khi Thợ săn uống hoặc ném một loại thuốc, đồ uống hoặc thần dược, _tối đa 6 ô cỏ_ sẽ mọc lên ở khu vực xung quanh, và kẻ địch liền kề sẽ bị trói chân trong _2 lượt_.\n\nSố lượng cỏ và thời gian trói chân được nhân đôi khi sử dụng thuốc tăng sức mạnh, kinh nghiệm hoặc vật phẩm giả kim thuật cần được chế tạo bằng những loại thuốc đó.\n\nĐối với các vật phẩm giả kim thuật có số lượng sản phẩm đầu ra cao hơn (ví dụ: đồ uống aqua brew), tài năng này có cơ hội được kích hoạt dựa trên số lượng vật phẩm đó được sản xuất.
actors.hero.talent.liquid_nature.title=bản chất lỏng
actors.hero.talent.liquid_willpower.desc=_+1:_ Chiến binh nhận được _6,5% HP tối đa của mình dưới dạng khiên chắn_ khi uống hoặc ném một bình thuốc, đồ uống hoặc thần dược.\n\n_+2:_ Chiến binh nhận được _10% HP tối đa của mình dưới dạng khiên chắn_ khi uống hoặc ném một bình thuốc, đồ uống hoặc thần dược.\n\nLượng khiên chắn được nhân đôi khi sử dụng các bình thuốc sức mạnh, kinh nghiệm hoặc các vật phẩm giả kim thuật phải được chế tạo bằng các bình thuốc đó.\n\nĐối với các vật phẩm giả kim thuật có số lượng sản phẩm đầu ra cao hơn (ví dụ: đồ uống aqua brew), tài năng này có cơ hội được kích hoạt dựa trên số lượng vật phẩm đó được sản xuất.
actors.hero.talent.liquid_willpower.title=sức mạnh ý chí dạng lỏng
actors.hero.talent.longrange_warp.desc=_+1:_ Pháp sư giờ có thể dịch chuyển giữa các tầng, với _chi phí sạc 150%_.\n\n_+2:_ Pháp sư giờ có thể dịch chuyển giữa các tầng, với _chi phí sạc 117%_.\n\n_+3:_ Pháp sư giờ có thể dịch chuyển giữa các tầng, với _chi phí sạc 83%_.\n\n_+4:_ Pháp sư giờ có thể dịch chuyển giữa các tầng, với _chi phí sạc 50%_.\n\nPháp sư không thể sử dụng dịch chuyển tầm xa để rời khỏi tầng bị khóa.
actors.hero.talent.longrange_warp.title=Biến dạng tầm xa
actors.hero.talent.mind_form.desc=Thầy tu có thể niệm phép _Hình Dạng Tâm Trí_, truyền cho Trinity sức mạnh của một cây đũa phép hoặc vũ khí ném mà Thầy tu đã sử dụng trong lượt chơi này, với chi phí là 3 lượt sử dụng.\n\n_+1:_ Khi Trinity được sử dụng, Thầy tu sử dụng hiệu ứng phóng điện hoặc ném của vật phẩm đã chọn, như thể nó là _+3._\n\n_+2:_ Khi Trinity được sử dụng, Thầy tu sử dụng hiệu ứng phóng điện hoặc ném của vật phẩm đã chọn, như thể nó là _+4._\n\n_+3:_ Khi Trinity được sử dụng, Thầy tu sử dụng hiệu ứng phóng điện hoặc ném của vật phẩm đã chọn, như thể nó là _+5._\n\n_+4:_ Khi Trinity được sử dụng, Thầy tu sử dụng hiệu ứng phóng điện hoặc ném của vật phẩm đã chọn, như thể nó là _+6._\n\nTrinity chỉ có thể được truyền một hiệu ứng tâm trí tại một thời điểm.
actors.hero.talent.mind_form.title=hình thái tâm trí
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Linh mục có thể niệm _Lời Cầu Nguyện Ghi Nhớ_, một phép thuật kéo dài hiệu ứng tăng/giảm sức mạnh lên đồng minh/kẻ thù trong _3 lượt_ với chi phí 1 lượt sử dụng.\n\n_+2:_ Linh mục có thể niệm _Lời Cầu Nguyện Ghi Nhớ_, một phép thuật kéo dài hiệu ứng tăng/giảm sức mạnh lên đồng minh/kẻ thù trong _4 lượt_ với chi phí 1 lượt sử dụng.\n\n_+3:_ Linh mục có thể niệm _Lời Cầu Nguyện Ghi Nhớ_, một phép thuật kéo dài hiệu ứng tăng/giảm sức mạnh lên đồng minh/kẻ thù trong _5 lượt_ với chi phí 1 lượt sử dụng.\n\nLời Cầu Nguyện Ghi Nhớ không mất thời gian để niệm. Lời Cầu Nguyện Ghi Nhớ chỉ có thể kéo dài một hiệu ứng tăng/giảm sức mạnh cụ thể một lần và không thể kéo dài hiệu ứng tăng sức mạnh từ khả năng của giáp.
actors.hero.talent.mnemonic_prayer.title=lời cầu nguyện ghi nhớ
actors.hero.talent.monastic_vigor.desc=_+1:_ Nếu Tu sĩ có _100% năng lượng_, các kỹ năng của cô ấy sẽ được tăng cường.\n\n_+2:_ Nếu Tu sĩ có _80% năng lượng trở lên_, các kỹ năng của cô ấy sẽ được tăng cường.\n\n_+3:_ Nếu Tu sĩ có _60% năng lượng trở lên_, các kỹ năng của cô ấy sẽ được tăng cường.\n\nKhi được tăng cường:\n- Flurry áp dụng hiệu ứng cường hóa của vũ khí.\n- Focus tức thì.\n- Dash tăng thêm +4 tầm đánh.\n- Dragon Kick gây thêm +50% sát thương và áp dụng hiệu ứng đẩy lùi và làm choáng cho tất cả kẻ địch liền kề.\n- Meditate từ từ hồi phục 20% HP đã mất và tăng 80% khả năng kháng sát thương.
actors.hero.talent.monastic_vigor.title=sức sống tu viện
actors.hero.talent.mystical_charge.desc=_+1:_ Đánh bằng trượng giúp Pháp sư Chiến đấu hồi phục trang bị trong _0,5 lượt_.\n\n_+2:_ Đánh bằng trượng giúp Pháp sư Chiến đấu hồi phục trang bị trong _1 lượt_.\n\n_+3:_ Đánh bằng trượng giúp Pháp sư Chiến đấu hồi phục trang bị trong _1,5 lượt_.
actors.hero.talent.mystical_charge.title=phí thần bí
actors.hero.talent.mystical_meal.desc=_+1:_ Ăn thức ăn mất 1 lượt của Kẻ Lừa Gạt (lương thực được ăn ngay lập tức) và cho hắn _3 lượt nạp lại trang bị_.\n\n_+2:_ Ăn thức ăn mất 1 lượt của Kẻ Lừa Gạt (lương thực được ăn ngay lập tức) và cho hắn _5 lượt nạp lại trang bị_.\n\nTài năng này không thể được sử dụng để cho phép sừng sung túc tự nạp lại.
actors.hero.talent.mystical_meal.title=bữa ăn huyền bí
actors.hero.talent.natures_aid.desc=_+1:_ Thợ săn nhận được 0-2 giáp vỏ cây, giáp này sẽ mờ dần sau mỗi _3 lượt_ khi hiệu ứng của một loại cây được kích hoạt trong tầm nhìn của cô ấy.\n\n_+2:_ Thợ săn nhận được 0-2 giáp vỏ cây, giáp này sẽ mờ dần sau mỗi _5 lượt_ khi hiệu ứng của một loại cây được kích hoạt trong tầm nhìn của cô ấy.
actors.hero.talent.natures_aid.title=sự trợ giúp của thiên nhiên
actors.hero.talent.natures_bounty.desc=_+1:_ Thợ săn có thể tìm thấy _4 quả mọng_ ẩn trong đám cỏ cao khi khám phá những tầng tiếp theo của hầm ngục.\n\n_+2:_ Thợ săn có thể tìm thấy _6 quả mọng_ ẩn trong đám cỏ cao khi khám phá những tầng tiếp theo của hầm ngục.\n\nQuả mọng được ăn nhanh, phục hồi một lượng nhỏ cảm giác no và có thể chứa một hạt giống có thể sử dụng được.
actors.hero.talent.natures_bounty.title=sự hào phóng của thiên nhiên
actors.hero.talent.natures_wrath.desc=_+1:_ Khi sức mạnh tự nhiên được kích hoạt, các phát bắn từ cung linh hồn có _8% cơ hội_ kích hoạt hiệu ứng thực vật gây hại ngẫu nhiên.\n\n_+2:_ Khi sức mạnh tự nhiên được kích hoạt, các phát bắn từ cung linh hồn có _17% cơ hội_ kích hoạt hiệu ứng thực vật gây hại ngẫu nhiên.\n\n_+3:_ Khi sức mạnh tự nhiên được kích hoạt, các phát bắn từ cung linh hồn có _25% cơ hội_ kích hoạt hiệu ứng thực vật gây hại ngẫu nhiên.\n\n_+4:_ Khi sức mạnh tự nhiên được kích hoạt, các phát bắn từ cung linh hồn có _33% cơ hội_ kích hoạt hiệu ứng thực vật gây hại ngẫu nhiên.\n\nCác loại thực vật có thể bị kích hoạt là: cỏ mù, hoa lửa, băng hà, rêu sầu và dây leo bão.
actors.hero.talent.natures_wrath.title=cơn thịnh nộ của thiên nhiên
actors.hero.talent.necromancers_minions.desc=_+1:_ Khi một kẻ địch được đánh dấu linh hồn chết, Pháp sư có _13% cơ hội_ hồi sinh chúng thành một hồn ma bị tha hóa.\n\n_+2:_ Khi một kẻ địch được đánh dấu linh hồn chết, Pháp sư có _27% cơ hội_ hồi sinh chúng thành một hồn ma bị tha hóa.\n\n_+3:_ Khi một kẻ địch được đánh dấu linh hồn chết, Pháp sư có _40% cơ hội_ hồi sinh chúng thành một hồn ma bị tha hóa.
actors.hero.talent.necromancers_minions.title=tay sai của pháp sư gọi hồn
actors.hero.talent.patient_strike.desc=_+1:_ Nếu Đấu sĩ chờ trước khi thực hiện đòn tấn công cận chiến, cô ấy sẽ gây thêm _1-2 sát thương_.\n\n_+2:_ Nếu Đấu sĩ chờ trước khi thực hiện đòn tấn công cận chiến, cô ấy sẽ gây thêm _2 sát thương_.
actors.hero.talent.patient_strike.title=đình công của bệnh nhân
actors.hero.talent.perfect_copy.desc=_+1: Bản sao bóng tối nhận được _10%_ HP tối đa của anh hùng và có thể lập tức đổi chỗ với anh hùng trong phạm vi _1 ô_ cách xa.\n\n_+2: Bản sao bóng tối nhận được _20%_ HP tối đa của anh hùng và có thể lập tức đổi chỗ với anh hùng trong phạm vi _2 ô_ cách xa.\n\n_+3: Bản sao bóng tối nhận được _30%_ HP tối đa của anh hùng và có thể lập tức đổi chỗ với anh hùng trong phạm vi _3 ô_ cách xa.\n\n_+4: Bản sao bóng tối nhận được _40%_ HP tối đa của anh hùng và có thể lập tức đổi chỗ với anh hùng trong phạm vi _4 ô_ cách xa.
actors.hero.talent.perfect_copy.title=bản sao hoàn hảo
actors.hero.talent.point_blank.desc=_+1:_ Khi Thợ săn sử dụng cung hoặc vũ khí ném ở cự ly gần, độ chính xác giảm _25%_ thay vì -50%.\n\n_+2:_ Khi Thợ săn sử dụng cung hoặc vũ khí ném ở cự ly gần, độ chính xác bình thường thay vì -50%.\n\n_+3:_ Khi Thợ săn sử dụng cung hoặc vũ khí ném ở cự ly gần, độ chính xác tăng _25%_ thay vì -50%.\n\nLưu ý rằng vũ khí ném hoặc cung linh hồn luôn có độ chính xác +50% khi sử dụng ở khoảng cách xa.
actors.hero.talent.point_blank.title=nói thẳng
actors.hero.talent.precise_assault.desc=_+1:_ Khi Đấu Sĩ sử dụng kỹ năng vũ khí, cô ấy nhận được _độ chính xác gấp đôi_ cho đòn tấn công cận chiến tiếp theo trong vòng 5 lượt.\n\n_+2:_ Khi Đấu Sĩ sử dụng kỹ năng vũ khí, cô ấy nhận được _độ chính xác gấp 5 lần_ cho đòn tấn công cận chiến tiếp theo trong vòng 5 lượt.\n\n_+3:_ Khi Đấu Sĩ sử dụng kỹ năng vũ khí, cô ấy nhận được _độ chính xác vô hạn_ cho đòn tấn công cận chiến tiếp theo trong vòng 5 lượt.
actors.hero.talent.precise_assault.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ tăng độ chính xác cận chiến lên 10% ở cấp +1, 20% ở cấp +2 hoặc 30% ở cấp +3.
actors.hero.talent.precise_assault.title=cuộc tấn công chính xác
actors.hero.talent.projectile_momentum.desc=_+1:_ Khi đang chạy tự do, Freerunner nhận được _+50% độ chính xác và +15% sát thương_ với vũ khí ném.\n\n_+2:_ Khi đang chạy tự do, Freerunner nhận được _+100% độ chính xác và +30% sát thương_ với vũ khí ném.\n\n_+3:_ Khi đang chạy tự do, Freerunner nhận được _+150% độ chính xác và +45% sát thương_ với vũ khí ném.
actors.hero.talent.projectile_momentum.title=động lượng của vật phóng
actors.hero.talent.projecting_blades.desc=_+1:_ Lưỡi dao quang phổ có độ chính xác _+25%_ và có thể xuyên qua tối đa _2 ô đặc_.\n\n_+2:_ Lưỡi dao quang phổ có độ chính xác _+50%_ và có thể xuyên qua tối đa _4 ô đặc_.\n\n_+3:_ Lưỡi dao quang phổ có độ chính xác _+75%_ và có thể xuyên qua tối đa _6 ô đặc_.\n\n_+4:_ Lưỡi dao quang phổ có độ chính xác _+100%_ và có thể xuyên qua tối đa _8 ô đặc_.
actors.hero.talent.projecting_blades.title=lưỡi dao nhô ra
actors.hero.talent.protective_shadows.desc=_+1:_ Kẻ trộm nhận được một lớp khiên mỗi lượt thứ hai khi hắn tàng hình, _tối đa là 3_.\n\n_+2:_ Kẻ trộm nhận được một lớp khiên mỗi lượt khi hắn tàng hình, _tối đa là 5_.
actors.hero.talent.protective_shadows.title=bóng râm bảo vệ
actors.hero.talent.provoked_anger.desc=_+1:_ Khi bất kỳ hiệu ứng tăng cường phòng thủ nào áp dụng cho Chiến binh bị phá vỡ bởi sát thương, đòn tấn công vật lý tiếp theo của anh ta sẽ gây thêm _3 sát thương_.\n\n_+2:_ Khi bất kỳ hiệu ứng tăng cường phòng thủ nào áp dụng cho Chiến binh bị phá vỡ bởi sát thương, đòn tấn công vật lý tiếp theo của anh ta sẽ gây thêm _5 sát thương_.
actors.hero.talent.provoked_anger.title=gây ra sự tức giận
actors.hero.talent.ratforcements.desc=_+1:_ Sử dụng phép biến hình chuột lên bản thân _tạo ra 1_ chuột đồng minh bên cạnh bạn.\n\n_+2:_ Sử dụng phép biến hình chuột lên bản thân _tạo ra 2_ chuột đồng minh bên cạnh bạn.\n\n_+3:_ Sử dụng phép biến hình chuột lên bản thân _tạo ra 3_ chuột đồng minh bên cạnh bạn.\n\n_+4:_ Sử dụng phép biến hình chuột lên bản thân _tạo ra 4_ chuột đồng minh bên cạnh bạn.
actors.hero.talent.ratforcements.title=sự gia cố chuột
actors.hero.talent.ratlomacy.desc=_+1:_ Sử dụng phép biến hình chuột lên kẻ địch đã bị biến hình chuột sẽ khiến chúng trở nên thân thiện và biến hình thành vĩnh viễn.\n\n_+2:_ Sử dụng phép biến hình chuột lên kẻ địch đã bị biến hình chuột sẽ khiến chúng trở nên thân thiện, biến hình thành vĩnh viễn và cho chúng _2 lượt_ adrenaline.\n\n_+3:_ Sử dụng phép biến hình chuột lên kẻ địch đã bị biến hình chuột sẽ khiến chúng trở nên thân thiện, biến hình thành vĩnh viễn và cho chúng _4 lượt_ adrenaline.\n\n_+4:_ Sử dụng phép biến hình chuột lên kẻ địch đã bị biến hình chuột sẽ khiến chúng trở nên thân thiện, biến hình thành vĩnh viễn và cho chúng _6 lượt_ adrenaline.
actors.hero.talent.ratlomacy.title=chuột chũi
actors.hero.talent.ratsistance.desc=_+1:_ Kẻ thù biến hình thành chuột gây sát thương _-10%_.\n\n_+2:_ Kẻ thù biến hình thành chuột gây sát thương _-19%_.\n\n_+3:_ Kẻ thù biến hình thành chuột gây sát thương _-27%_.\n\n_+4:_ Kẻ thù biến hình thành chuột gây sát thương _-35%_.
actors.hero.talent.ratsistance.title=kháng cự
actors.hero.talent.reactive_barrier.desc=_+1:_ Pháp sư nhận được _2.5 giáp_ cho mỗi nhân vật bị ảnh hưởng bởi vụ nổ nguyên tố, tối đa 5 nhân vật.\n\n_+2:_ Pháp sư nhận được _5 giáp_ cho mỗi nhân vật bị ảnh hưởng bởi vụ nổ nguyên tố, tối đa 6 nhân vật.\n\n_+3:_ Pháp sư nhận được _7.5 giáp_ cho mỗi nhân vật bị ảnh hưởng bởi vụ nổ nguyên tố, tối đa 7 nhân vật.\n\n_+4:_ Pháp sư nhận được _10 giáp_ cho mỗi nhân vật bị ảnh hưởng bởi vụ nổ nguyên tố, tối đa 8 nhân vật.
actors.hero.talent.reactive_barrier.title=rào cản phản ứng
actors.hero.talent.recall_inscription.desc=_+1:_ Pháp sư có thể sử dụng _Hồi Ký Chữ Khắc_, một phép thuật cho phép họ lặp lại hiệu ứng của viên đá rune hoặc cuộn giấy cuối cùng họ đã sử dụng trong vòng _10 lượt._ +2:_ Pháp sư có thể sử dụng _Hồi Ký Chữ Khắc_, một phép thuật cho phép họ lặp lại hiệu ứng của viên đá rune hoặc cuộn giấy cuối cùng họ đã sử dụng trong vòng _300 lượt._ Không thể sử dụng Hồi Ký Chữ Khắc với cuộn giấy nâng cấp. Chi phí sử dụng phép thuật này thay đổi tùy thuộc vào vật phẩm được sử dụng gần đây: 2 cho đá rune, 3 cho cuộn giấy, 4 cho cuộn giấy đặc biệt. Chi phí sử dụng này cũng tăng gấp đôi khi sử dụng với cuộn giấy biến đổi hoặc vật phẩm giả kim thuật phải được chế tạo bằng cách biến đổi hoặc nâng cấp.
actors.hero.talent.recall_inscription.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, thay vào đó, nó sẽ hoàn trả bất kỳ cuộn giấy hoặc đá rune nào với tỷ lệ 10% ở mức +1 hoặc 15% ở mức +2. Cuộn giấy nâng cấp không bị ảnh hưởng bởi hiệu ứng này.
actors.hero.talent.recall_inscription.refunded=Sản phẩm của bạn đã được hoàn tiền!
actors.hero.talent.recall_inscription.title=dòng chữ ghi nhớ
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Khi Thợ Săn bước lên cỏ ngắn hoặc than hồng, chúng sẽ mọc lên thành cỏ cao và Thợ Săn sẽ ngay lập tức cày xới. Kỹ năng này có thời gian hồi chiêu _10 lượt_.\n\n_+2:_ Khi Thợ Săn bước lên cỏ ngắn hoặc than hồng, chúng sẽ mọc lên thành cỏ cao và Thợ Săn sẽ ngay lập tức cày xới. Kỹ năng này có thời gian hồi chiêu _5 lượt_.\n\nKỹ năng này sẽ tạo ra cỏ cày xới nếu hiệu ứng hồi phục thụ động bị vô hiệu hóa hoặc tướng không nhận được kinh nghiệm trong một thời gian dài.
actors.hero.talent.rejuvenating_steps.title=các bước trẻ hóa
actors.hero.talent.remote_beacon.desc=_+1:_ Pháp sư có thể đặt một ngọn hải đăng ở bất kỳ vị trí nào trong phạm vi _4 ô_.\n\n_+2:_ Pháp sư có thể đặt một ngọn hải đăng ở bất kỳ vị trí nào trong phạm vi _8 ô_.\n\n_+3:_ Pháp sư có thể đặt một ngọn hải đăng ở bất kỳ vị trí nào trong phạm vi _12 ô_.\n\n_+4:_ Pháp sư có thể đặt một ngọn hải đăng ở bất kỳ vị trí nào trong phạm vi _16 ô_.\n\nPháp sư không thể đặt hải đăng ở những vị trí không thể tiếp cận.
actors.hero.talent.remote_beacon.title=Thiết bị định vị từ xa
actors.hero.talent.rogues_foresight.desc=_+1:_ Khi tên trộm ở trong một màn chơi có phòng bí mật, hắn có _75% cơ hội nhận ra_ rằng màn chơi đó chứa một bí mật.\n\n_+2:_ Khi tên trộm ở trong một màn chơi có phòng bí mật, hắn có _100% cơ hội nhận ra_ rằng màn chơi đó chứa một bí mật.
actors.hero.talent.rogues_foresight.title=tầm nhìn xa của kẻ lừa đảo
actors.hero.talent.runic_transference.desc=_+1:_ Ấn chú bị phá vỡ của Chiến binh có thể chuyển các _ký tự thông thường_ giống như cách chuyển nâng cấp.\n\n_+2:_ Ấn chú bị phá vỡ của Chiến binh có thể chuyển các _ký tự thông thường, mạnh mẽ và nguyền rủa_ giống như cách chuyển nâng cấp.\n\nẤn chú chỉ có thể chuyển các ký tự nếu chúng đã được áp dụng lên áo giáp khi ấn chú được gắn vào.
actors.hero.talent.runic_transference.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ giúp các phù hiệu trên giáp của bạn chống lại việc bị xóa bởi các cuộn nâng cấp. Các phù hiệu sẽ bắt đầu bị mất khi nâng cấp từ cấp độ 6 (từ cấp 4) ở mức +1, hoặc cấp độ 7 (từ cấp 4) ở mức +2. Cấp độ mà các phù hiệu chắc chắn bị mất vẫn không thay đổi ở mức +8.
actors.hero.talent.runic_transference.title=sự chuyển giao rune
actors.hero.talent.satiated_spells.desc=_+1:_ Ăn thức ăn giúp Pháp sư nhận được _3 điểm phòng thủ_ vào lần tiếp theo khi niệm phép.\n\n_+2:_ Ăn thức ăn giúp Pháp sư nhận được _5 điểm phòng thủ_ vào lần tiếp theo khi niệm phép.
actors.hero.talent.satiated_spells.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ ngay lập tức ban tặng lớp khiên bảo vệ, và lớp khiên này sẽ bắt đầu giảm dần sau 10 lượt.
actors.hero.talent.satiated_spells.title=Phép thuật no nê
actors.hero.talent.scholars_intuition.desc=_+1:_ Pháp sư nhận diện đũa phép nhanh hơn _3 lần_.\n\n_+2:_ Pháp sư nhận diện đũa phép _khi anh ta sử dụng chúng_.
actors.hero.talent.scholars_intuition.title=trực giác của học giả
actors.hero.talent.searing_light.desc=_+1:_ Các đòn tấn công vật lý của Pháp sư vào kẻ địch được chiếu sáng bởi _Ánh Sáng Dẫn Đường_ gây thêm _+3 sát thương._\n\n_+2:_ Các đòn tấn công vật lý của Pháp sư vào kẻ địch được chiếu sáng bởi _Ánh Sáng Dẫn Đường_ gây thêm _+5 sát thương._
actors.hero.talent.searing_light.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ cộng thêm sát thương sau khi sử dụng trượng hoặc thánh vật lên kẻ địch, với thời gian hồi chiêu 20 lượt.
actors.hero.talent.searing_light.title=Ánh sáng rực cháy
actors.hero.talent.seer_shot.desc=_+1:_ Khi Thợ Săn bắn một mũi tên xuống đất, nó sẽ cung cấp tầm nhìn trong khu vực 3x3 xung quanh trong _5 lượt_. Hiệu ứng này có thời gian hồi chiêu 20 lượt.\n\n_+2:_ Khi Thợ Săn bắn một mũi tên xuống đất, nó sẽ cung cấp tầm nhìn trong khu vực 3x3 xung quanh trong _10 lượt_. Hiệu ứng này có thời gian hồi chiêu 20 lượt.\n\n_+3:_ Khi Thợ Săn bắn một mũi tên xuống đất, nó sẽ cung cấp tầm nhìn trong khu vực 3x3 xung quanh trong _15 lượt_. Hiệu ứng này có thời gian hồi chiêu 20 lượt.
actors.hero.talent.seer_shot.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ được kích hoạt từ bất kỳ vũ khí nào được ném đi.
actors.hero.talent.seer_shot.title=cú bắn tiên tri
actors.hero.talent.shadow_blade.desc=_+1:_ Bản sao bóng tối nhận thêm _8%_ sát thương của anh hùng mỗi lượt, và có _25% cơ hội_ sử dụng phép thuật lên vũ khí của anh hùng.\n\n_+2:_ Bản sao bóng tối nhận thêm _16%_ sát thương của anh hùng mỗi lượt, và có _50% cơ hội_ sử dụng phép thuật lên vũ khí của anh hùng.\n\n_+3:_ Bản sao bóng tối nhận thêm _24%_ sát thương của anh hùng mỗi lượt, và có _75% cơ hội_ sử dụng phép thuật lên vũ khí của anh hùng.\n\n_+4:_ Bản sao bóng tối nhận thêm _32%_ sát thương của anh hùng mỗi lượt, và có _100% cơ hội_ sử dụng phép thuật lên vũ khí của anh hùng.
actors.hero.talent.shadow_blade.title=lưỡi kiếm bóng tối
actors.hero.talent.shadow_step.desc=_+1:_ Nếu tên trộm sử dụng bom khói khi tàng hình, nó sẽ kích hoạt ngay lập tức và có chi phí sử dụng giảm _16%_, nhưng nó cũng không làm mù kẻ địch hoặc kích hoạt các kỹ năng khác.\n\n_+2:_ Nếu tên trộm sử dụng bom khói khi tàng hình, nó sẽ kích hoạt ngay lập tức và có chi phí sử dụng giảm _30%_, nhưng nó cũng không làm mù kẻ địch hoặc kích hoạt các kỹ năng khác.\n\n_+3:_ Nếu tên trộm sử dụng bom khói khi tàng hình, nó sẽ kích hoạt ngay lập tức và có chi phí sử dụng giảm _41%_, nhưng nó cũng không làm mù kẻ địch hoặc kích hoạt các kỹ năng khác.\n\n_+4:_ Nếu tên trộm sử dụng bom khói khi tàng hình, nó sẽ kích hoạt ngay lập tức và có chi phí sử dụng giảm _50%_, nhưng nó cũng không làm mù kẻ địch hoặc kích hoạt các kỹ năng khác.
actors.hero.talent.shadow_step.title=bước bóng
actors.hero.talent.shared_enchantment.desc=_+1:_ Vũ khí ném có _33% cơ hội_ kích hoạt hiệu ứng phù phép trên cung của Xạ thủ.\n\n_+2:_ Vũ khí ném có _67% cơ hội_ kích hoạt hiệu ứng phù phép trên cung của Xạ thủ.\n\n_+3:_ Vũ khí ném có _100% cơ hội_ kích hoạt hiệu ứng phù phép trên cung của Xạ thủ.\n\nHiệu ứng phù phép của cung có thể được kích hoạt cùng với bất kỳ hiệu ứng phù phép nào mà vũ khí ném đã có.
actors.hero.talent.shared_enchantment.title=sự mê hoặc chung
actors.hero.talent.shared_upgrades.desc=_+1:_ Khi Xạ thủ tấn công bằng vũ khí ném được nâng cấp, mỗi cấp độ sẽ tăng thời gian hiệu lực của dấu ấn xạ thủ thêm 1 lượt và sát thương của đòn tấn công đặc biệt thêm 16%, tối đa là _2 lượt và +33% sát thương ở cấp +2_.\n\n_+2:_ Khi Xạ thủ tấn công bằng vũ khí ném được nâng cấp, mỗi cấp độ sẽ tăng thời gian hiệu lực của dấu ấn xạ thủ thêm 1 lượt và sát thương của đòn tấn công đặc biệt thêm 16%, tối đa là _4 lượt và +67% sát thương ở cấp +4_.\n\n_+3:_ Khi Xạ thủ tấn công bằng vũ khí ném được nâng cấp, mỗi cấp độ sẽ tăng thời gian hiệu lực của dấu ấn xạ thủ thêm 1 lượt và sát thương của đòn tấn công đặc biệt thêm 16%, tối đa là _6 lượt và +100% sát thương ở cấp +6_.
actors.hero.talent.shared_upgrades.title=nâng cấp chung
actors.hero.talent.shield_battery.desc=_+1:_ Pháp sư có thể tự nhắm mục tiêu bằng đũa phép để chuyển đổi tất cả các điểm tích lũy thành khiên chắn với tỷ lệ _4% HP tối đa mỗi điểm tích lũy_.\n\n_+2:_ Pháp sư có thể tự nhắm mục tiêu bằng đũa phép để chuyển đổi tất cả các điểm tích lũy thành khiên chắn với tỷ lệ _6% HP tối đa mỗi điểm tích lũy_.
actors.hero.talent.shield_battery.title=pin bảo vệ
actors.hero.talent.shield_of_light.desc=_+1:_ Pháp sư có thể niệm phép _Khiên Ánh Sáng_, một phép thuật được niệm ngay lập tức và ban cho họ _2-4 giáp_ chống lại mục tiêu trong 5 lượt với chi phí 1 điểm năng lượng.\n\n_+2:_ Pháp sư có thể niệm phép _Khiên Ánh Sáng_, một phép thuật được niệm ngay lập tức và ban cho họ _3-6 giáp_ chống lại mục tiêu trong 5 lượt với chi phí 1 điểm năng lượng.
actors.hero.talent.shield_of_light.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ giảm sát thương vật lý nhận từ kẻ địch mục tiêu đi 1, với xác suất 33% ở cấp +1 hoặc 50% ở cấp +2.
actors.hero.talent.shield_of_light.title=tấm chắn ánh sáng
actors.hero.talent.shielding_dew.desc=_+1:_ Giọt Sương có thể tạo lớp bảo vệ cho Người Giám Hộ khi máu của cô ấy đầy, tối đa _20% HP tối đa_.\n\n_+2:_ Giọt Sương có thể tạo lớp bảo vệ cho Người Giám Hộ khi máu của cô ấy đầy, tối đa _40% HP tối đa_.\n\n_+3:_ Giọt Sương có thể tạo lớp bảo vệ cho Người Giám Hộ khi máu của cô ấy đầy, tối đa _60% HP tối đa_.
actors.hero.talent.shielding_dew.title=sương che chắn
actors.hero.talent.shock_force.desc=_+1:_ Sóng xung kích gây thêm _20% sát thương_ và có _25% cơ hội_ gây choáng thay vì làm tê liệt.\n\n_+2:_ Sóng xung kích gây thêm _40% sát thương_ và có _50% cơ hội_ gây choáng thay vì làm tê liệt.\n\n_+3:_ Sóng xung kích gây thêm _60% sát thương_ và có _75% cơ hội_ gây choáng thay vì làm tê liệt.\n\n_+4:_ Sóng xung kích gây thêm _80% sát thương_ và có _100% cơ hội_ gây choáng thay vì làm tê liệt.
actors.hero.talent.shock_force.title=lực xung kích
actors.hero.talent.shrug_it_off.desc=_+1:_ Khả năng giảm sát thương của Chiến binh khi chịu đựng được tăng từ 50% lên 60%.\n\n_+2:_ Khả năng giảm sát thương của Chiến binh khi chịu đựng được tăng từ 50% lên 68%.\n\n_+3:_ Khả năng giảm sát thương của Chiến binh khi chịu đựng được tăng từ 50% lên 74%.\n\n_+4:_ Khả năng giảm sát thương của Chiến binh khi chịu đựng được tăng từ 50% lên 80%.
actors.hero.talent.shrug_it_off.title=bỏ qua đi
actors.hero.talent.silent_steps.desc=_+1:_ Tên trộm sẽ không đánh thức kẻ thù đang ngủ khi hắn _cách chúng 3 ô trở lên_.\n\n_+2:_ Tên trộm sẽ không đánh thức kẻ thù đang ngủ khi hắn _không ở cạnh chúng_.
actors.hero.talent.silent_steps.title=bước chân im lặng
actors.hero.talent.soul_eater.desc=_+1:_ Dấu ấn linh hồn ban cho _0,33 lượt_ no bụng cho mỗi sát thương vật lý gây ra. Kẻ địch có dấu ấn linh hồn có _10% cơ hội_ kích hoạt hiệu ứng khi ăn lúc chết.\n\n_+2:_ Dấu ấn linh hồn ban cho _0,67 lượt_ no bụng cho mỗi sát thương vật lý gây ra. Kẻ địch có dấu ấn linh hồn có _20% cơ hội_ kích hoạt hiệu ứng khi ăn lúc chết.\n\n_+3:_ Dấu ấn linh hồn ban cho _1 lượt_ no bụng cho mỗi sát thương vật lý gây ra. Kẻ địch có dấu ấn linh hồn có _30% cơ hội_ kích hoạt hiệu ứng khi ăn lúc chết.
actors.hero.talent.soul_eater.title=kẻ ăn linh hồn
actors.hero.talent.soul_siphon.desc=_+1:_ Sát thương vật lý gây ra bởi các nhân vật khác kích hoạt dấu ấn linh hồn của Pháp sư với hiệu quả _13%_.\n\n_+2:_ Sát thương vật lý gây ra bởi các nhân vật khác kích hoạt dấu ấn linh hồn của Pháp sư với hiệu quả _27%_.\n\n_+3:_ Sát thương vật lý gây ra bởi các nhân vật khác kích hoạt dấu ấn linh hồn của Pháp sư với hiệu quả _40%_.
actors.hero.talent.soul_siphon.title=hút linh hồn
actors.hero.talent.speedy_stealth.desc=_+1:_ Người chơi Freerunner nhận được 2 điểm cộng dồn động lượng mỗi lượt khi đang tàng hình.\n\n_+2:_ Ngoài các lợi ích của +1, thời gian chạy tự do không còn bị đếm ngược khi người chơi Freerunner đang tàng hình.\n\n_+3:_ Ngoài các lợi ích của +1 và +2, người chơi Freerunner di chuyển với tốc độ gấp đôi khi tàng hình, bất kể đang chạy tự do hay không.
actors.hero.talent.speedy_stealth.title=tàng hình nhanh chóng
actors.hero.talent.spirit_blades.desc=_+1:_ Lưỡi kiếm ma thuật có _30% cơ hội_ để cũng sử dụng phép thuật lên cung linh hồn.\n\n_+2:_ Lưỡi kiếm ma thuật có _60% cơ hội_ để cũng sử dụng phép thuật lên cung linh hồn.\n\n_+3:_ Lưỡi kiếm ma thuật có _90% cơ hội_ để cũng sử dụng phép thuật lên cung linh hồn.\n\n_+4:_ Lưỡi kiếm ma thuật có _100% cơ hội_ để cũng sử dụng phép thuật lên cung linh hồn, và nó tăng _10% sức mạnh_ cho mỗi phép thuật.
actors.hero.talent.spirit_blades.title=lưỡi kiếm linh hồn
actors.hero.talent.spirit_form.desc=Thầy tu có thể sử dụng _Hình Dạng Linh Hồn_, truyền cho Trinity sức mạnh của một chiếc nhẫn hoặc vật phẩm mà Thầy tu đã xác định trong lượt chơi này (ngoại trừ sách thánh), với chi phí là 4 lượt sử dụng.\n\n_+1:_ Khi sử dụng Trinity, Thầy tu sẽ nhận được hiệu ứng của chiếc nhẫn ở mức _+1_ trong 20 lượt, hoặc sẽ kích hoạt hiệu ứng của vật phẩm ở mức _+4._\n\n_+2:_ Khi sử dụng Trinity, Thầy tu sẽ nhận được hiệu ứng của chiếc nhẫn ở mức _+2_ trong 20 lượt, hoặc sẽ kích hoạt hiệu ứng của vật phẩm ở mức _+6._\n\n_+3:_ Khi sử dụng Trinity, Thầy tu sẽ nhận được hiệu ứng của chiếc nhẫn ở mức _+3_ trong 20 lượt, hoặc sẽ kích hoạt hiệu ứng của vật phẩm ở mức _+8._\n\n_+4:_ Khi sử dụng Trinity, Giáo sĩ sẽ nhận được hiệu ứng của chiếc nhẫn ở mức _+4_ trong 20 lượt, hoặc sẽ kích hoạt hiệu ứng của một vật phẩm ở mức _+10._\n\n Trinity chỉ có thể được truyền một hiệu ứng linh hồn tại một thời điểm. Vật phẩm có hiệu ứng và chi phí tích lũy giáp khác nhau khi được kích hoạt bởi Trinity.
actors.hero.talent.spirit_form.title=hình dạng linh hồn
actors.hero.talent.stasis.desc=Pháp sư có thể sử dụng phép _Stasis_ lên một đồng minh được cường hóa với chi phí 2 lượt sử dụng. Stasis tạm thời đưa đồng minh ra khỏi hầm ngục và giữ nguyên thời gian còn lại của tất cả các hiệu ứng tăng cường, bao gồm cả Power of Many. Đồng minh sẽ xuất hiện lại bên cạnh bạn khi hiệu ứng kết thúc. Có thể sử dụng lại Stasis ngay lập tức và không tốn chi phí để kết thúc hiệu ứng sớm. Hiệu ứng Stasis tác dụng lên các đồng minh bất động, nhưng không thể di chuyển họ giữa các tầng hầm ngục.\n\n_+1:_ Stasis kéo dài tối đa _60 lượt._\n\n_+2:_ Stasis kéo dài tối đa _90 lượt._\n\n_+3:_ Stasis kéo dài tối đa _120 lượt._\n\n_+4:_ Stasis kéo dài tối đa _150 lượt._\n\nNgười tu sĩ cũng có thể sử dụng Beaming Ray khi một đồng minh đang ở trạng thái Stasis để triệu hồi lại họ, hoặc sử dụng Life Link để áp dụng hiệu ứng trước. Tuy nhiên, các đồng minh không được hưởng lợi từ Life Link khi đang ở trạng thái Stasis.
actors.hero.talent.stasis.title=trạng thái tĩnh
actors.hero.talent.strengthening_meal.desc=_+1:_ Ăn thức ăn giúp Đấu sĩ nhận thêm 3 sát thương trong 2 lần tiếp theo khi tấn công kẻ địch bằng đòn tấn công vật lý.\n\n_+2:_ Ăn thức ăn giúp Đấu sĩ nhận thêm 3 sát thương trong 3 lần tiếp theo khi tấn công kẻ địch bằng đòn tấn công vật lý.
actors.hero.talent.strengthening_meal.title=bữa ăn tăng cường
actors.hero.talent.striking_force.desc=_+1:_ Sức mạnh của hiệu ứng đòn tấn công nguyên tố được tăng lên _30%_.\n\n_+2:_ Sức mạnh của hiệu ứng đòn tấn công nguyên tố được tăng lên _60%_.\n\n_+3:_ Sức mạnh của hiệu ứng đòn tấn công nguyên tố được tăng lên _90%_.\n\n_+4:_ Sức mạnh của hiệu ứng đòn tấn công nguyên tố được tăng lên _120%_.
actors.hero.talent.striking_force.title=lực tấn công
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave có _30% cơ hội_ để kích hoạt các hiệu ứng khi trúng đòn như phép bổ trợ và combo.\n\n_+2:_ Shockwave có _60% cơ hội_ để kích hoạt các hiệu ứng khi trúng đòn như phép bổ trợ và combo.\n\n_+3:_ Shockwave có _90% cơ hội_ để kích hoạt các hiệu ứng khi trúng đòn như phép bổ trợ và combo.\n\n_+4:_ Shockwave có _100% cơ hội_ để kích hoạt các hiệu ứng khi trúng đòn như phép bổ trợ và combo, đồng thời tăng _20% sức mạnh_ cho phép bổ trợ.
actors.hero.talent.striking_wave.title=sóng đánh
actors.hero.talent.strongman.desc=_+1:_ Sức mạnh của Chiến binh được _tăng thêm 8%_, làm tròn xuống.\n\n_+2:_ Sức mạnh của Chiến binh được _tăng thêm 13%_, làm tròn xuống.\n\n_+3:_ Sức mạnh của Chiến binh được _tăng thêm 18%_, làm tròn xuống.
actors.hero.talent.strongman.title=người đàn ông mạnh mẽ
actors.hero.talent.sucker_punch.desc=_+1:_ Tên trộm gây thêm _1-2 sát thương_ trong lần tấn công bất ngờ đầu tiên vào kẻ địch.\n\n_+2:_ Tên trộm gây thêm _2 sát thương_ trong lần tấn công bất ngờ đầu tiên vào kẻ địch.
actors.hero.talent.sucker_punch.title=cú đánh lén
actors.hero.talent.sunray.desc=_+1:_ Pháp sư có thể sử dụng _Sunray_, một phép thuật gây _4-8 sát thương_ và làm mù mục tiêu trong _4 lượt_, với chi phí 1 lượt sử dụng.\n\n_+2:_ Pháp sư có thể sử dụng _Sunray_, một phép thuật gây _6-12 sát thương_ và làm mù mục tiêu trong _6 lượt_, với chi phí 1 lượt sử dụng.\n\nSunray chỉ có thể làm mù mỗi mục tiêu một lần, nhưng nếu mục tiêu đã bị làm mù bởi Sunray thì nó sẽ làm tê liệt thay vì làm mù. Sunray luôn gây sát thương tối đa cho kẻ thù ma quỷ và xác sống.
actors.hero.talent.sunray.meta_desc=Nếu tài năng này được một anh hùng khác sở hữu, nó sẽ khiến các cây trượng và vật phẩm làm mù kẻ địch trong 4 lượt, với xác suất 15% ở cấp độ +1 hoặc 25% ở cấp độ +2.
actors.hero.talent.sunray.title=tia nắng
actors.hero.talent.survivalists_intuition.desc=_+1:_ Thợ săn nhận diện vũ khí ném nhanh hơn _3 lần_.\n\n_+2:_ Thợ săn nhận diện vũ khí ném _khi cô ấy dùng chúng trúng mục tiêu_.
actors.hero.talent.survivalists_intuition.title=trực giác của người sống sót
actors.hero.talent.sustained_retribution.desc=_+1:_ Chiến binh gây thêm _115% sát thương trải đều trên _2 đòn đánh_, thay vì 100% sát thương cộng thêm trong 1 đòn đánh.\n\n_+2:_ Chiến binh gây thêm _130% sát thương trải đều trên _3 đòn đánh_, thay vì 100% sát thương cộng thêm trong 1 đòn đánh.\n\n_+3:_ Chiến binh gây thêm _145% sát thương trải đều trên _4 đòn đánh_, thay vì 100% sát thương cộng thêm trong 1 đòn đánh.\n\n_+4:_ Chiến binh gây thêm _160% sát thương trải đều trên _5 đòn đánh_, thay vì 100% sát thương cộng thêm trong 1 đòn đánh.
actors.hero.talent.sustained_retribution.title=sự trừng phạt kéo dài
actors.hero.talent.swift_equip.desc=_+1:_ Đấu sĩ có thể đổi vũ khí đang trang bị ngay lập tức _một lần_ mỗi 20 lượt.\n\n_+2:_ Đấu sĩ có thể đổi vũ khí đang trang bị ngay lập tức _hai lần_ mỗi 20 lượt.\n\nNếu Đấu sĩ có tài năng này và nó không đang trong thời gian hồi chiêu, việc sử dụng nhanh một vũ khí chưa được trang bị sẽ trang bị nó.
actors.hero.talent.swift_equip.title=trang bị nhanh chóng
actors.hero.talent.swift_spirit.desc=_+1:_ Tốc độ di chuyển của chim ưng linh hồn được tăng từ 2 lên 2,5 ô, và nó chắc chắn né được 2 đòn tấn công đầu tiên.\n\n_+2:_ Tốc độ di chuyển của chim ưng linh hồn được tăng từ 2 lên 3 ô, và nó chắc chắn né được 4 đòn tấn công đầu tiên.\n\n_+3:_ Tốc độ di chuyển của chim ưng linh hồn được tăng từ 2 lên 3,5 ô, và nó chắc chắn né được 6 đòn tấn công đầu tiên.\n\n_+4:_ Tốc độ di chuyển của chim ưng linh hồn được tăng từ 2 lên 4 ô, và nó chắc chắn né được 8 đòn tấn công đầu tiên.
actors.hero.talent.swift_spirit.title=tinh thần nhanh nhẹn
actors.hero.talent.telefrag.desc=_+1:_ Nếu Pháp sư dịch chuyển đến nhân vật khác, hắn gây _10-15 sát thương_ cho nhân vật đó, nhưng cũng chịu _5 sát thương_.\n\n_+2:_ Nếu Pháp sư dịch chuyển đến nhân vật khác, hắn gây _20-30 sát thương_ cho nhân vật đó, nhưng cũng chịu _10 sát thương_.\n\n_+3:_ Nếu Pháp sư dịch chuyển đến nhân vật khác, hắn gây _30-45 sát thương_ cho nhân vật đó, nhưng cũng chịu _15 sát thương_.\n\n_+4:_ Nếu Pháp sư dịch chuyển đến nhân vật khác, hắn gây _40-60 sát thương_ cho nhân vật đó, nhưng cũng chịu _20 sát thương_.\n\nAnh hùng không thể bị tiêu diệt bởi tài năng này, sát thương tự gây ra có thể bị giảm bởi hiệu ứng kháng phép.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Tên trộm nhận diện nhẫn nhanh hơn _2 lần_ và nhận diện loại nhẫn _khi hắn đeo nó_.\n\n_+2:_ Tên trộm nhận diện nhẫn _khi hắn đeo chúng_ và nhận diện loại nhẫn _khi hắn nhặt nó lên_.
actors.hero.talent.thiefs_intuition.title=trực giác của tên trộm
actors.hero.talent.twin_upgrades.desc=_+1:_ Nếu một trong hai vũ khí được trang bị của Nhà vô địch có cấp độ thấp hơn và _thấp hơn 2 bậc trở lên_ so với vũ khí còn lại, nó sẽ được nâng cấp lên cấp độ của vũ khí kia.\n\n_+2:_ Nếu một trong hai vũ khí được trang bị của Nhà vô địch có cấp độ thấp hơn và _thấp hơn 1 bậc trở lên_ so với vũ khí còn lại, nó sẽ được nâng cấp lên cấp độ của vũ khí kia.\n\n_+3:_ Nếu một trong hai vũ khí được trang bị của Nhà vô địch có cấp độ thấp hơn và _cùng bậc hoặc thấp hơn_ so với vũ khí còn lại, nó sẽ được nâng cấp lên cấp độ của vũ khí kia.
actors.hero.talent.twin_upgrades.title=nâng cấp đôi
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Nhà sư nhận được thêm _50% năng lượng_ cho mỗi món trang bị _cấp 3 trở xuống_ mà cô ấy đang sử dụng.\n\n_+2:_ Nhà sư nhận được thêm _75% năng lượng_ cho mỗi món trang bị _cấp 2 trở xuống_ mà cô ấy đang sử dụng. Lợi ích của cấp 3 không thay đổi.\n\n_+3:_ Nhà sư nhận được thêm _100% năng lượng_ cho mỗi món trang bị _cấp 1 trở xuống_ mà cô ấy đang sử dụng. Lợi ích của cấp 2 và 3 không thay đổi. Cô ấy cũng nhận được một bộ giáp vải và găng tay đinh tán miễn phí.\n\nLưu ý rằng tài năng này không mang lại lợi ích khi không có vũ khí hoặc tấn công bằng Nhẫn Sức Mạnh.
actors.hero.talent.unencumbered_spirit.title=tinh thần không bị ràng buộc
actors.hero.talent.varied_charge.desc=_+1:_ Nhà vô địch ngay lập tức hồi phục _0.17 lượt sử dụng vũ khí_ khi sử dụng hai kỹ năng vũ khí khác nhau, không giới hạn thời gian.\n\n_+2:_ Nhà vô địch ngay lập tức hồi phục _0.33 lượt sử dụng vũ khí_ khi sử dụng hai kỹ năng vũ khí khác nhau, không giới hạn thời gian.\n\n_+3:_ Nhà vô địch ngay lập tức hồi phục _0.5 lượt sử dụng vũ khí_ khi sử dụng hai kỹ năng vũ khí khác nhau, không giới hạn thời gian.
actors.hero.talent.varied_charge.title=phí khác nhau
actors.hero.talent.veterans_intuition.desc=_+1:_ Chiến binh nhận diện vũ khí nhanh hơn _1,75 lần_ và áo giáp nhanh hơn _2,5 lần_.\n\n_+2:_ Chiến binh nhận diện vũ khí nhanh hơn _2,5 lần_ và áo giáp _khi anh ta trang bị nó_.
actors.hero.talent.veterans_intuition.title=trực giác của cựu chiến binh
actors.hero.talent.wall_of_light.desc=_+1:_ Hiệp sĩ có thể sử dụng phép _Wall of Light_, một phép tạo ra một bức tường vững chắc rộng _3 ô_ phía trước Hiệp sĩ, đẩy lùi kẻ thù và tồn tại trong 20 lượt, với chi phí 3 lượt sử dụng.\n\n_+2:_ Hiệp sĩ có thể sử dụng phép _Wall of Light_, một phép tạo ra một bức tường vững chắc rộng _5 ô_ phía trước Hiệp sĩ, đẩy lùi kẻ thù và tồn tại trong 20 lượt, với chi phí 3 lượt sử dụng.\n\n_+3:_ Hiệp sĩ có thể sử dụng phép _Wall of Light_, một phép tạo ra một bức tường vững chắc rộng _7 ô_ phía trước Hiệp sĩ, đẩy lùi kẻ thù và tồn tại trong 20 lượt, với chi phí 3 lượt sử dụng.\n\nBức tường có thể được đặt theo hướng chính hoặc hướng chéo, chỉ có thể có một bức tường tại một thời điểm.
actors.hero.talent.wall_of_light.title=bức tường ánh sáng
actors.hero.talent.wand_preservation.desc=_+1:_ Khi Pháp sư truyền một cây đũa phép mới vào cây trượng của mình, cây đũa phép cũ sẽ được trả lại với chỉ số +0, _nhưng điều này chỉ có thể thực hiện một lần._\n\n_+2:_ Khi Pháp sư truyền một cây đũa phép mới vào cây trượng của mình, cây đũa phép cũ sẽ được trả lại với chỉ số +0, _điều này có thể lặp lại với thời gian hồi chiêu bằng một cấp độ anh hùng._
actors.hero.talent.wand_preservation.meta_desc=Nếu tài năng này được một anh hùng khác sở hữu, nó sẽ tăng lượng nhựa ma thuật nhận được khi đặt đũa phép vào nồi luyện kim thêm 1 ở cấp +1, hoặc thêm 2 ở cấp +2.
actors.hero.talent.wand_preservation.title=bảo quản đũa phép
actors.hero.talent.weapon_recharging.desc=_+1:_ Đấu sĩ nhận được một lượt sử dụng vũ khí cứ sau mỗi _15 lượt_ khi đang chịu ảnh hưởng của các hiệu ứng tăng tốc độ nạp lại từ gậy phép hoặc vật phẩm.\n\n_+2:_ Đấu sĩ nhận được một lượt sử dụng vũ khí cứ sau mỗi _10 lượt_ khi đang chịu ảnh hưởng của các hiệu ứng tăng tốc độ nạp lại từ gậy phép hoặc vật phẩm.
actors.hero.talent.weapon_recharging.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ giúp họ gây thêm +5% sát thương cận chiến khi hồi chiêu ở mức +1, hoặc +7.5% sát thương cận chiến khi hồi chiêu ở mức +2.
actors.hero.talent.weapon_recharging.title=nạp lại vũ khí
actors.hero.talent.wide_search.desc=_+1:_ Bán kính tìm kiếm của Kẻ Lừa Gạt được tăng từ hình vuông 5x5 lên hình tròn _7x7_.\n\n_+2:_ Bán kính tìm kiếm của Kẻ Lừa Gạt được tăng từ hình vuông 5x5 lên hình vuông _7x7_.
actors.hero.talent.wide_search.meta_desc=Nếu kỹ năng này được một anh hùng khác sở hữu, nó sẽ tăng bán kính tìm kiếm của họ từ hình vuông 3x3 lên hình tròn 5x5 ở cấp độ +1, hoặc hình vuông 5x5 ở cấp độ +2.
actors.hero.talent.wide_search.title=tìm kiếm rộng rãi
actors.hero.talent.wild_momentum.desc=_+1:_ Hạ gục kẻ địch bằng cung linh hồn sẽ kéo dài thời gian hiệu lực của sức mạnh tự nhiên thêm _1 lượt_. Thời gian hiệu lực có thể được kéo dài tối đa _2 lượt_.\n\n_+2:_ Hạ gục kẻ địch bằng cung linh hồn sẽ kéo dài thời gian hiệu lực của sức mạnh tự nhiên thêm _2 lượt_. Thời gian hiệu lực có thể được kéo dài tối đa _4 lượt_.\n\n_+3:_ Hạ gục kẻ địch bằng cung linh hồn sẽ kéo dài thời gian hiệu lực của sức mạnh tự nhiên thêm _3 lượt_. Thời gian hiệu lực có thể được kéo dài tối đa _6 lượt_.\n\n_+4:_ Hạ gục kẻ địch bằng cung linh hồn sẽ kéo dài thời gian hiệu lực của sức mạnh tự nhiên thêm _4 lượt_. Thời gian hiệu lực có thể được kéo dài tối đa _8 lượt_.
actors.hero.talent.wild_momentum.title=động lực mạnh mẽ
actors.hero.talent.wild_power.desc=_+1:_ Khi sử dụng phép thuật hoang dã, đũa phép sẽ được tăng sức mạnh thêm _2 hoặc 3, tối đa là +4_.\n\n_+2:_ Khi sử dụng phép thuật hoang dã, đũa phép sẽ được tăng sức mạnh thêm _3, tối đa là +5_.\n\n_+3:_ Khi sử dụng phép thuật hoang dã, đũa phép sẽ được tăng sức mạnh thêm _3 hoặc 4, tối đa là +6_.\n\n_+4:_ Khi sử dụng phép thuật hoang dã, đũa phép sẽ được tăng sức mạnh thêm _4, tối đa là +7_.
actors.hero.talent.wild_power.title=sức mạnh hoang dã
actors.mobs.acidic.desc=Những sinh vật ma quỷ khổng lồ giống nhện này tránh giao chiến tầm gần, chúng thích bắn những gai nhọn gây thương tích từ khoảng cách xa. Con này dường như đang nhỏ giọt chất dịch ăn mòn.
actors.mobs.acidic.name=bọ cạp axit
actors.mobs.albino.desc=Đây là một giống chuột túi quý hiếm, có bộ lông trắng muốt và hàm răng lởm chởm.
actors.mobs.albino.discover_hint=Bạn hiếm khi tìm thấy kẻ thù này ở một khu vực cụ thể nào trong hầm ngục.
actors.mobs.albino.name=chuột bạch tạng
actors.mobs.armoredbrute.desc=Những tên gnoll hung bạo cấp cao nhất thường mặc giáp trụ mạnh mẽ để thể hiện địa vị của mình. Bộ giáp giúp chúng chống chịu sát thương vật lý tốt hơn nhiều, và kỷ luật cao hơn cho phép chúng nổi cơn thịnh nộ lâu hơn trước khi gục ngã vì vết thương.
actors.mobs.armoredbrute.name=kẻ hung bạo bọc thép
actors.mobs.armoredstatue.desc=Thoạt nhìn, bạn có thể nghĩ nó chỉ là một trong những bức tượng vô tri vô giác của hầm ngục này, nhưng đôi mắt đỏ rực của nó đã tố cáo điều đó. Nó dường như đang ở trong tình trạng rất tốt nhờ bộ giáp đang mặc, có lẽ rất khó để tiêu diệt nó.
actors.mobs.armoredstatue.desc_arm_wep=Mặc dù bức tượng được làm bằng đá, nhưng hai thanh kiếm _%1$s_ và _%2$s_ mà nó cầm trông rất thật.
actors.mobs.armoredstatue.name=tượng bọc thép
actors.mobs.bandit.desc=Những tầng sâu hơn của ngục tối luôn là nơi ẩn náu của đủ loại tội phạm. Không phải ai trong số họ cũng giữ được đầu óc tỉnh táo trong suốt thời gian dài xa ánh sáng ban ngày. Từ lâu, những tên trộm và cướp điên rồ này đã quên mất mình là ai và tại sao lại phải trộm cắp.
actors.mobs.bandit.name=tên cướp điên rồ
actors.mobs.bat.desc=Những cư dân nhanh nhẹn và ngoan cường của hang động này nguy hiểm hơn vẻ ngoài của chúng rất nhiều. Chúng hồi phục sức khỏe sau mỗi đòn tấn công thành công, cho phép chúng đánh bại những đối thủ lớn hơn nhiều.
actors.mobs.bat.name=dơi ma cà rồng
actors.mobs.bee.desc=Mặc dù có kích thước nhỏ, ong vàng thường bảo vệ tổ của chúng rất quyết liệt. Con ong này đang rất tức giận, tốt hơn hết là bạn nên giữ khoảng cách.
actors.mobs.bee.desc_honey=Mặc dù có kích thước nhỏ, ong vàng thường bảo vệ tổ của chúng rất quyết liệt. Con ong này đã được xoa dịu và dường như muốn đi theo bạn.
actors.mobs.bee.discover_hint=Bạn có thể tìm thấy nhân vật này cùng với một vật phẩm cụ thể.
actors.mobs.bee.name=ong vàng
actors.mobs.brute$bruterage.desc=Tên gnoll hung bạo này sắp chết, nhưng nó muốn kéo bạn theo!\n\nTên groll hung bạo này sẽ chết khi lớp khiên của nó hết tác dụng, hoặc do hết thời gian hoặc do bị thương. Trong lúc đó, nó sẽ gây sát thương tăng lên đáng kể, vì vậy hãy cẩn thận!\n\nLượng khiên còn lại: %d.
actors.mobs.brute$bruterage.name=cơn thịnh nộ tàn bạo
actors.mobs.brute.def_verb=bị chặn
actors.mobs.brute.desc=Lực sĩ là những gnoll to lớn, mạnh mẽ và bền bỉ nhất. Khi bị thương nặng, chúng nổi điên và gây thêm sát thương lên kẻ thù.
actors.mobs.brute.enraged=tức giận
actors.mobs.brute.name=gnoll lực sĩ
actors.mobs.causticslime.desc=Chất nhầy này dường như đã bị nhiễm ma thuật hắc ám phát ra từ bên dưới. Nó đã mất đi màu xanh lục thường thấy và nhỏ giọt chất dịch ăn mòn.
actors.mobs.causticslime.discover_hint=Bạn hiếm khi tìm thấy kẻ thù này ở một khu vực cụ thể nào trong hầm ngục.
actors.mobs.causticslime.name=chất nhầy ăn mòn
actors.mobs.crab.desc=Những con cua khổng lồ này đứng đầu chuỗi thức ăn trong cống rãnh. Chúng cực kỳ nhanh nhẹn và lớp vỏ dày có thể chịu được những cú va đập mạnh.
actors.mobs.crab.name=cua cống
actors.mobs.crystalguardian.def_verb=bị chặn
actors.mobs.crystalguardian.desc=Những người bảo vệ bằng tinh thể khổng lồ này trông gần giống như tượng, nếu không phải vì đôi mắt phát sáng rực rỡ của chúng. Tinh thể cứng chắc tạo nên chúng khiến chúng di chuyển chậm chạp nhưng rất bền bỉ, vì vậy tốt nhất là nên để chúng ngủ trong tổ tinh thể của mình càng lâu càng tốt. Do kích thước lớn, những người bảo vệ tinh thể sẽ di chuyển chậm hơn nhiều trong không gian kín. Chúng cũng rất bền bỉ đến mức không thể bị tiêu diệt ngay lập tức. Chúng có thể bị đánh gục và vô hiệu hóa tạm thời, nhưng chúng sẽ lại đứng dậy sau một thời gian ngắn.
actors.mobs.crystalguardian.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.crystalguardian.name=người bảo vệ tinh thể
actors.mobs.crystalmimic.ate=Kẻ bắt chước đã ăn mất %s của bạn!
actors.mobs.crystalmimic.desc=Những sinh vật giả dạng là những sinh vật ma thuật có thể biến hình thành bất kỳ hình dạng nào chúng muốn. Trong các hầm ngục, chúng hầu như luôn chọn hình dạng rương kho báu để dụ dỗ những nhà thám hiểm không ngờ tới. Những sinh vật giả dạng pha lê xảo quyệt hơn những con giả dạng thông thường và thích tránh xung đột khi cướp bóc. Chúng sẽ cố gắng chạy trốn khi bị phát hiện và có khả năng thay đổi vị trí của kẻ thù khi tấn công.
actors.mobs.crystalmimic.escaped=Kẻ giả dạng pha lê đã trốn thoát!
actors.mobs.crystalmimic.name=mô phỏng tinh thể
actors.mobs.crystalspire.alert=Sự rung động ngày càng lớn và lan khắp hang động!
actors.mobs.crystalspire.desc=Ngọn tháp tinh thể siêu cứng khổng lồ này có lẽ là nguồn gốc của tất cả những sinh vật tinh thể kỳ lạ trong hang động này. Vũ khí thông thường của bạn không hiệu quả chống lại nó, vì vậy bạn cần dùng cuốc nếu muốn phá hủy nó. Hãy chắc chắn rằng bạn đã chuẩn bị kỹ trước khi bắt đầu phá vỡ nó. Một tinh thể lớn như vậy có thể mất khá nhiều thời gian để khai thác, và có lẽ bạn sẽ không thể làm điều đó mà không bị quấy rầy. Bản thân ngọn tháp thậm chí có thể có một số phương tiện tự vệ. Có lẽ chính những đòn tấn công của ngọn tháp có thể được sử dụng để chống lại những sinh vật nhỏ bé của nó.
actors.mobs.crystalspire.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.crystalspire.name=ngọn tháp pha lê
actors.mobs.crystalspire.warning=Viên pha lê sẽ rung lên khi bạn gõ vào nó. Cứ tiếp tục làm vậy chắc chắn sẽ thu hút sự chú ý của mọi người...
actors.mobs.crystalwisp.beam_kill=Tia sáng đó đã giết chết bạn...
actors.mobs.crystalwisp.desc=Một khối tinh thể cứng nhỏ, giận dữ, đang trôi nổi và phát ra ánh sáng rực rỡ. Mặc dù không đặc biệt mạnh, nhưng những tinh thể nhỏ này sẽ bắn ra một chùm tia sáng gây sát thương nếu chúng có cơ hội. Những tinh thể nhỏ này đủ nhỏ để dễ dàng di chuyển qua các mỏm đá tinh thể khác nhau, nhưng chúng không thể bắn xuyên qua chúng.
actors.mobs.crystalwisp.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.crystalwisp.name=làn khói tinh thể
actors.mobs.demonspawner.desc=Sự kết hợp méo mó của thịt người lùn này chịu trách nhiệm tạo ra những con quỷ xé xác từ những người lùn đã chết trong khu vực này. Rõ ràng là lũ quỷ không thấy vấn đề gì khi sử dụng mọi nguồn lực chúng có thể để chống lại kẻ thù. Mặc dù trông rất đáng sợ, những sinh vật tạo ra quỷ không có cách nào di chuyển hoặc tự vệ trực tiếp. Khối lượng lớn của chúng khiến chúng khó bị tiêu diệt nhanh chóng, và chúng sẽ tạo ra quỷ xé xác nhanh hơn khi bị đe dọa. Những sinh vật tạo ra quỷ dường như được kết nối với một nguồn sức mạnh ma quỷ trung tâm nào đó. Việc tiêu diệt chúng có thể làm suy yếu nguồn sức mạnh đó.
actors.mobs.demonspawner.name=kẻ sinh ra quỷ
actors.mobs.demonspawner.on_death=Năng lượng ma quỷ ở đây dường như giảm dần khi sinh vật này chết đi.
actors.mobs.dm100.desc=DM-100 là một mẫu máy "phòng thủ" đời đầu của người lùn, được thiết kế để bảo vệ những người thợ mỏ lùn trong các hang động bên dưới nhà tù này. Tuy nhiên, những cú sốc điện của chúng tỏ ra quá yếu, vì vậy chúng đã được tặng cho thành phố của con người ở phía trên. Chúng không được sử dụng trong nhiều năm và cuối cùng đã đến được nhà tù, nơi mà ban đầu cai ngục cho rằng chúng quá tàn bạo để sử dụng. Tuy nhiên, khi các tù nhân trở nên khó bảo hơn, chúng lại trở thành một vật dụng cần thiết.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Tia sét đã giết chết bạn...
actors.mobs.dm200.desc=DM-200 là thế hệ thứ hai của "cỗ máy phòng thủ" người lùn, được thiết kế để bảo vệ những người thợ mỏ lùn trong các hang động và thành phố bên dưới. Chúng lớn hơn và cồng kềnh hơn nhiều so với các thế hệ trước, và tấn công bằng những nắm đấm thủy lực hủy diệt. Kích thước lớn hơn cũng là điểm yếu chính của chúng, vì chúng không thể lọt vào những đường hầm và cửa ra vào hẹp của hầm ngục. Người lùn đã bù đắp cho sự thiếu cơ động của DM-200 bằng cách cho phép chúng thải khí độc vào kẻ thù ở xa, hoặc kẻ thù mà chúng không thể tiếp cận.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 phun ra một luồng khí thải độc hại!
actors.mobs.dm201.desc=Người lùn đã thử nghiệm ngắn gọn việc nhấn mạnh hơn vào nhược điểm thiếu cơ động của DM-200 và tạo ra một số mẫu DM hoàn toàn đứng yên. DM-201 là phiên bản cải tiến của DM-200, hoạt động như một tháp pháo canh gác không có khả năng di chuyển. Để bù lại sự thiếu cơ động, DM-201 có độ bền và sức tấn công mạnh hơn đáng kể. Vì DM-201 không có động cơ để thoát khí thải, người lùn đã trang bị cho chúng lựu đạn khí ăn mòn! Tuy nhiên, DM-201 rất cẩn thận với những quả lựu đạn này và chỉ ném chúng khi bị tấn công từ xa.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 phóng ra một quả lựu đạn ăn mòn!
actors.mobs.dm300.charge_lost=CỘT ĐIỆN BỊ PHÁ HỦY! CHUYỂN SANG SỬ DỤNG ĐIỆN NGUỒN CẤP TẠI ĐỊA PHƯƠNG!
actors.mobs.dm300.charging=BỊ HƯ HỎNG! KÍCH HOẠT TRỤ ĐIỆN!
actors.mobs.dm300.charging_hint=DM-300 bất khả xâm phạm khi đang được cấp năng lượng từ một cột điện!
actors.mobs.dm300.def_verb=bị chặn
actors.mobs.dm300.defeated=THIỆT HẠI NGHIÊM TRỌNG! ĐANG CỐ GẮNG TẤ
actors.mobs.dm300.desc=Cỗ máy này được người lùn chế tạo từ nhiều thế kỷ trước. Về sau, họ dần thay máy móc bằng golem, tinh linh và cả ác quỷ. Điều đó cuối cùng đã đẩy nền văn minh của họ đến chỗ suy tàn. DM-300 và các máy tương tự thường được dùng để xây dựng, khai mỏ, đôi khi cả bảo vệ thành phố.
actors.mobs.dm300.desc_supercharged=DM-300 hiện đang được tích điện đầy đủ. Ở trạng thái này, DM-300 không thể bị hư hại và di chuyển với tốc độ gấp đôi! Thêm vào đó, mũi khoan của nó giờ đây quay đủ nhanh để có thể _đào xuyên qua đá cứng_, mặc dù tốc độ di chuyển sẽ chậm hơn nhiều khi làm điều này. Việc tấn công trực tiếp DM-300 khi nó đang được tích điện siêu cấp là vô ích, nhưng _phải có thứ gì đó trong khu vực đang cung cấp năng lượng cho nó_, việc phá hủy thứ đó có thể làm suy yếu nó.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=PHÁT HIỆN NGƯỜI KHÔNG CÓ THẨM QUYỀN!
actors.mobs.dm300.pylons_destroyed=CẢNH BÁO! PHÁT HIỆN SỰ KHÔNG ỔN ĐỊNH TRONG LƯỚI ĐIỆN!
actors.mobs.dm300.rankings_desc=Bị DM-300 nghiền nát
actors.mobs.dm300.shield=DM-300 lấy nguồn điện từ các dây dẫn hở và tự bảo vệ bằng lớp chắn!
actors.mobs.dm300.supercharged=PHÁ HỦY! PHÁ HỦY! PHÁ HỦY!
actors.mobs.dwarfking$dkghoul.rankings_desc=Gục ngã trước Vua Người Lùn
actors.mobs.dwarfking$dkgolem.rankings_desc=Gục ngã trước Vua Người Lùn
actors.mobs.dwarfking$dkmonk.rankings_desc=Gục ngã trước Vua Người Lùn
actors.mobs.dwarfking$dkwarlock.rankings_desc=Gục ngã trước Vua Người Lùn
actors.mobs.dwarfking.defeated=Ngươi... đã đẩy tất cả chúng ta vào chỗ diệt vong...
actors.mobs.dwarfking.desc=Nhiều năm trước, một trong những pháp sư tối cao trong triều đình người lùn đã khám phá ra những bí mật ban cho ông ta quyền năng to lớn chi phối sự sống và cái chết. Ông ta nhanh chóng sử dụng quyền lực này để khuất phục và tha hóa các đồng nghiệp, nhà vua, và cuối cùng là mọi thần dân người lùn. Giờ đây, ông ta là vua, người cai trị một đạo quân xác sống. Vua của người lùn là một kẻ thù hung hãn, sẽ cố gắng bao vây và áp đảo kẻ thù bằng đội quân xác sống của mình.
actors.mobs.dwarfking.enraged=Ngươi không thể giết ta %s. Ta. Bất. Tử!
actors.mobs.dwarfking.lifelink_1=Ta cần tinh chất của ngươi, tên nô lệ!
actors.mobs.dwarfking.lifelink_2=Hãy đổ máu vì ta, tên nô lệ!
actors.mobs.dwarfking.losing=Không! Bạn không thể làm thế... bạn không hề biết những gì đang chờ đợi ở phía dưới...
actors.mobs.dwarfking.name=Vua của người lùn
actors.mobs.dwarfking.notice=Sao anh dám! Anh không hề biết mình đang can thiệp vào chuyện gì đâu!
actors.mobs.dwarfking.rankings_desc=Gục ngã trước Vua Người Lùn
actors.mobs.dwarfking.teleport_1=Hãy xử lý chúng đi, tên nô lệ!
actors.mobs.dwarfking.teleport_2=Hãy giữ cho chúng bận rộn, tên nô lệ!
actors.mobs.dwarfking.wave_1=Đủ rồi! Hãy đứng dậy, hỡi những tên nô lệ của ta!
actors.mobs.dwarfking.wave_2=Thêm nữa! Hãy đổ máu vì đức vua của các ngươi!
actors.mobs.dwarfking.wave_3=Vô dụng! Giết chúng ngay!
actors.mobs.ebonymimic.desc=Những sinh vật giả dạng (Mimics) là những sinh vật ma thuật có thể biến hình thành bất kỳ hình dạng nào chúng muốn. Trong các hầm ngục, chúng hầu như luôn chọn hình dạng rương kho báu để dụ dỗ những nhà thám hiểm không ngờ tới. Sinh vật giả dạng Ebony rất lén lút, có khả năng tự làm cho mình gần như vô hình. Chúng ẩn nấp ở những nơi mà các nhà thám hiểm có khả năng tương tác, nhưng cũng chứa đựng chiến lợi phẩm riêng. Chúng không mạnh hơn sinh vật giả dạng thông thường khi bị phát hiện, nhưng cú cắn bất ngờ của chúng rất nguy hiểm.
actors.mobs.ebonymimic.discover_hint=Bạn có thể tìm thấy kẻ thù này bằng một vật phẩm đặc biệt.
actors.mobs.ebonymimic.hidden_desc=Dường như có điều gì đó ở đây, nhưng nó gần như hoàn toàn không thể nhận ra.
actors.mobs.ebonymimic.hidden_name=đường viền đáng ngờ
actors.mobs.ebonymimic.name=bắt chước gỗ mun
actors.mobs.ebonymimic.reveal=Có một kẻ bắt chước ở đó!
actors.mobs.elemental$chaoselemental.desc=Các sinh vật nguyên tố là những sinh vật hỗn loạn thường được tạo ra khi ma thuật huyền bí mạnh mẽ không được kiểm soát đúng cách. Sinh vật nguyên tố có trí thông minh tối thiểu và thường gắn liền với một loại ma thuật cụ thể. Sinh vật nguyên tố hỗn loạn là những sinh vật nguyên tố hiếm và nguy hiểm, chưa ổn định với một nguyên tố cụ thể nào. Chúng sẽ giải phóng ma thuật hoang dã khó lường khi tấn công.
actors.mobs.elemental$chaoselemental.name=nguyên tố hỗn loạn
actors.mobs.elemental$fireelemental.desc=Các sinh vật nguyên tố là những sinh vật hỗn loạn thường được tạo ra khi ma thuật huyền bí mạnh mẽ không được kiểm soát đúng cách. Sinh vật nguyên tố có trí thông minh tối thiểu và thường gắn liền với một loại ma thuật cụ thể. Sinh vật nguyên tố lửa là một loại sinh vật nguyên tố phổ biến gây sát thương bằng ma thuật lửa. Chúng sẽ thiêu rụi mục tiêu bằng các đòn tấn công cận chiến và đôi khi cũng có thể bắn ra những tia lửa.
actors.mobs.elemental$fireelemental.name=nguyên tố lửa
actors.mobs.elemental$frostelemental.desc=Các sinh vật nguyên tố là những sinh vật hỗn loạn thường được tạo ra khi ma thuật huyền bí mạnh mẽ không được kiểm soát đúng cách. Sinh vật nguyên tố có trí thông minh tối thiểu và thường gắn liền với một loại ma thuật cụ thể. Sinh vật nguyên tố băng giá là một loại sinh vật nguyên tố phổ biến, làm suy yếu kẻ thù bằng ma thuật băng giá. Chúng sẽ làm đóng băng mục tiêu bằng các đòn tấn công cận chiến và đôi khi là tấn công tầm xa. Ma thuật của chúng hiệu quả hơn nhiều trong nước.
actors.mobs.elemental$frostelemental.name=nguyên tố băng giá
actors.mobs.elemental$newbornfireelemental.charging=Nguyên tố đang tích tụ năng lượng!
actors.mobs.elemental$newbornfireelemental.desc=Các nguyên tố là những sinh vật hỗn loạn thường được tạo ra khi ma thuật huyền bí mạnh mẽ không được kiểm soát đúng cách. Nguyên tố có trí thông minh tối thiểu và thường gắn liền với một loại ma thuật cụ thể.\n\nNguyên tố lửa này vừa được triệu hồi, nhưng vẫn khá nguy hiểm!
actors.mobs.elemental$newbornfireelemental.desc_ally=Vì sinh vật nguyên tố này được triệu hồi bằng phép thuật, nó có khả năng kiểm soát ngọn lửa tốt hơn một chút. Nó không thể tấn công tầm xa, nhưng sẽ đốt cháy kẻ thù mà nó tấn công ở cự ly gần.
actors.mobs.elemental$newbornfireelemental.desc_boss=Do bản chất hỗn loạn của quá trình triệu hồi, nguyên tố này chỉ có thể phun lửa theo những luồng không chính xác sau khi tích tụ năng lượng trong một lượt.
actors.mobs.elemental$newbornfireelemental.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.elemental$newbornfireelemental.name=nguyên tố lửa sơ sinh
actors.mobs.elemental$shockelemental.desc=Các sinh vật nguyên tố là những sinh vật hỗn loạn thường được tạo ra khi ma thuật huyền bí mạnh mẽ không được kiểm soát đúng cách. Sinh vật nguyên tố có trí thông minh tối thiểu và thường gắn liền với một loại ma thuật cụ thể. Sinh vật nguyên tố điện giật là một loại sinh vật nguyên tố ít phổ biến hơn, chúng làm gián đoạn kẻ thù bằng điện và những tia sáng lóe lên. Trong cận chiến, chúng sẽ phóng điện đến kẻ thù gần đó và gây thêm sát thương cho mục tiêu chính nếu mục tiêu đó ở trong nước. Thỉnh thoảng, chúng cũng sẽ tập trung một luồng ánh sáng tầm xa vào mục tiêu, làm mù tạm thời mục tiêu đó.
actors.mobs.elemental$shockelemental.name=nguyên tố sốc
actors.mobs.eye.deathgaze_kill=Ánh mắt chết chóc đã giết chết bạn...
actors.mobs.eye.desc=Con quỷ này còn được gọi là "quả cầu thù hận". Hễ thấy kẻ địch, nó liền tung ánh nhìn chết chóc một cách bất chấp, thường phớt lờ và làm bị thương cả đồng minh.
actors.mobs.eye.name=ác nhãn
actors.mobs.fetidrat.desc=Rõ ràng có điều gì đó không ổn với con chuột này. Bộ lông đen bóng nhờn và lớp da thối rữa của nó rất khác so với những con chuột khỏe mạnh mà bạn đã thấy trước đây. Đôi mắt xanh nhạt khiến nó trông đặc biệt đáng sợ. Con chuột mang theo một đám mùi hôi thối kinh khủng, mùi này nồng nặc đến khó chịu khi ở gần. Chất dịch đen ngòm chảy ra từ miệng con chuột, nó ăn mòn cả sàn nhà nhưng dường như tan biến trong nước.
actors.mobs.fetidrat.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.fetidrat.name=chuột hôi thối
actors.mobs.fungalcore.desc=Loại nấm khổng lồ này chắc hẳn là nguồn gốc của mọi hoạt động nấm trong hang động này.
actors.mobs.fungalcore.name=lõi nấm
actors.mobs.fungalsentry.desc=Loại nấm cao lớn đặc biệt này đóng vai trò như một điểm phòng thủ cho mạng lưới nấm lớn hơn sống trong hang động này. Nó bất động, nhưng sẽ bắn những luồng độc chính xác vào bất cứ thứ gì lọt vào tầm nhìn của nó. Mặc dù tác động của những luồng độc này khá yếu, nhưng chúng có thể tích tụ lượng độc gây chết người rất nhanh. Mặc dù có thể tiêu diệt nó, nhưng tốt nhất là nên tránh xa nó.
actors.mobs.fungalsentry.name=lính canh nấm
actors.mobs.fungalspinner.desc=Loại nhện giăng tơ này dường như đang bị điều khiển bởi một loại nấm ký sinh. Loại nấm này cũng đã thay đổi khả năng của nó, thay thế mạng nhện và túi nọc độc bằng sự phát triển của nấm. Nhện giăng tơ nấm sẽ phun ra thực vật vào bạn thay vì mạng nhện, phát tán thảm thực vật nấm và có thể khiến bạn bị dính rễ. Mặc dù không thể gây độc, nhện giăng tơ nấm sẽ có khả năng kháng sát thương đáng kể nếu nó ở gần bất kỳ loại nấm nào.
actors.mobs.fungalspinner.name=con quay nấm
actors.mobs.ghoul.desc=Khi xã hội người lùn dần sụp đổ, và vị vua hiện tại của người lùn nắm giữ quyền lực tuyệt đối, những kẻ yếu đuối hoặc chống đối ông ta đều không được đối xử tốt. Khi nhà vua ngày càng thành thạo việc sử dụng ma thuật hắc ám, ông ta đã khuất phục những người lùn này theo ý muốn của mình, và giờ đây họ trở thành bộ binh trong quân đội của ông ta. Ma cà rồng không đặc biệt mạnh khi chiến đấu đơn độc, nhưng luôn di chuyển theo nhóm và rất khó tiêu diệt khi số lượng lớn. _Khi một con ma cà rồng bị đánh bại, nó sẽ hồi sinh sau vài lượt chơi miễn là có một con ma cà rồng khác ở gần đó._
actors.mobs.ghoul.name=ma cà rồng lùn
actors.mobs.gnoll.desc=Gnoll là những sinh vật hình người giống linh cẩu. Chúng sống trong cống rãnh và ngục tối, thỉnh thoảng lại mạo hiểm lên mặt đất để cướp phá. Trinh sát Gnoll là những thành viên thường trực trong bầy đàn của chúng, chúng không mạnh bằng những tên côn đồ và cũng không thông minh bằng pháp sư.
actors.mobs.gnoll.name=trinh sát gnoll
actors.mobs.gnollexile.desc=Con gnoll lông xám này có một vết bớt lớn trên vai, đánh dấu nó là kẻ bị lưu đày. Gnoll thường bị trục xuất khỏi xã hội vì không tuân lệnh hoặc vi phạm luật lệ. Những kẻ bị lưu đày phải mạnh mẽ và khôn ngoan để sống sót, con này trông có vẻ biết cách sử dụng ngọn giáo mà nó đang cầm.
actors.mobs.gnollexile.desc_aggro=Tên gnoll bị lưu đày nhìn xung quanh với vẻ giận dữ. Dường như cuối cùng nó cũng quyết định chiến đấu. Cẩn thận với cây giáo đó!
actors.mobs.gnollexile.desc_passive=_Con gnoll bị lưu đày không có ý định tấn công._ Nó có vẻ không hung hăng như những con gnoll khác ở đây, và có lẽ không nghĩ rằng việc chiến đấu với bạn là đáng giá. Bạn có thể cứ để nó đi qua, nhưng nó có một cái ba lô có thể chứa đầy những vật phẩm hữu ích...
actors.mobs.gnollexile.name=lưu đày gnoll
actors.mobs.gnollexile.seen_aggro=Con gnoll cầm giáo lao tới tấn công!
actors.mobs.gnollexile.seen_passive=Con gnoll cầm giáo nhìn bạn đầy cảnh giác, nhưng không tấn công.
actors.mobs.gnollgeomancer.alert=Thầy phong thủy tỉnh giấc! Toàn bộ hang động dường như rung chuyển khi ông ta nhảy vọt đi trong tiếng cười điên cuồng!
actors.mobs.gnollgeomancer.desc=Con gnoll già cao lớn ấn tượng này chắc hẳn là nguồn gốc của các phép thuật di chuyển đất đai quanh đây, và là kẻ tổ chức mọi hoạt động của lũ gnoll. Không giống như những tên gnoll phá hoại trong khu vực, tên gnoll địa lý này khá thành thạo phép thuật của mình, và không thể bị tổn thương bởi đá ném hoặc đá rơi. Tuy nhiên, nó không có cách nào để chiến đấu cận chiến.
actors.mobs.gnollgeomancer.desc_armor=Thầy pháp hiện đang bị bao bọc bởi một lớp giáp đá. Bạn cần phải đến gần và phá vỡ lớp giáp đó bằng cuốc chim trước khi có thể gây sát thương cho thầy pháp.
actors.mobs.gnollgeomancer.desc_armor_sapper=_Một tên lính công binh Gnoll gần đó đang giữ một thiết bị giúp tăng cường sức mạnh cho bộ giáp đá của pháp sư địa lý. Bạn sẽ không thể gây sát thương cho nó lúc này!_
actors.mobs.gnollgeomancer.desc_sleeping=Vị pháp sư gnoll cao lớn ấn tượng này được bao quanh bởi một lớp đá, trông gần như một bức tượng. Quan sát kỹ, bạn có thể thấy đá di chuyển một cách kỳ diệu theo nhịp thở của vị gnoll già. Nó không thể bị tổn thương khi bị bao bọc trong đá như thế này, và dường như đang tận hưởng một giấc ngủ sâu trong lòng đất. Bạn có thể dùng cuốc để phá vỡ các lớp đá, nhưng hãy chắc chắn rằng bạn đã sẵn sàng cho một cuộc chiến khi làm vậy. Vị pháp sư địa lý này chắc hẳn là nguồn gốc của các phép thuật di chuyển đất xung quanh đây, và là người tổ chức tất cả các hoạt động của gnoll. Việc đánh bại những con gnoll rải rác xung quanh đây trước khi chiến đấu với nó có lẽ là một ý kiến hay.
actors.mobs.gnollgeomancer.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.gnollgeomancer.name=pháp sư địa lý gnoll
actors.mobs.gnollgeomancer.rock_kill=Hòn đá bay đã giết chết bạn...
actors.mobs.gnollgeomancer.rockfall_kill=Đá rơi đã giết chết bạn...
actors.mobs.gnollgeomancer.warning=Thầy bói bắt đầu động đậy. Hãy chắc chắn rằng bạn đã sẵn sàng trước khi tiếp tục!
actors.mobs.gnollguard.def_verb=bị chặn
actors.mobs.gnollguard.desc=Một con gnoll to lớn và trông hung tợn, cầm giáo và khiên, nhưng không đội mũ bảo hiểm. Những tên lính canh này có lẽ là những tên côn đồ đang được huấn luyện, bị bắt buộc phải giúp bảo vệ mỏ khỏi động vật hoang dã xâm lấn. Tên gnoll lính canh đủ mạnh để cầm giáo bằng một tay, nhưng không sử dụng nó thành thạo lắm. _Nó cần không gian khá thoáng để tấn công từ xa, và sẽ gây sát thương ít hơn đáng kể nếu bạn đến gần._
actors.mobs.gnollguard.desc_armor=_Một tên lính công binh Gnoll gần đó đang cầm một thiết bị giúp tăng cường lớp giáp đất cho người lính canh này, giảm đáng kể sát thương mà nó phải chịu._
actors.mobs.gnollguard.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.gnollguard.name=lính canh Gnoll
actors.mobs.gnollguard.spear_warn=Con gnoll giáng một đòn hiểm ác bằng mũi giáo!
actors.mobs.gnollsapper.desc=Một con gnoll nhỏ bé, yếu ớt nhưng thông minh, lông màu nhạt và một chiếc túi đầy các loại dụng cụ. Chúng có lẽ ở đây để hỗ trợ việc thăm dò và khai thác vàng đen, và có một người bảo vệ gần đó. Chúng có khả năng chiến đấu, nhưng các đòn tấn công của chúng yếu ớt đến đáng thương, không mạnh hơn một con gnoll trinh sát. Thay vì chiến đấu trực tiếp, những người khai thác mỏ thích sử dụng các dụng cụ khác nhau mà chúng có để khiến môi trường đá tấn công hộ mình. Tuy nhiên, bản thân chúng không biết phép thuật di chuyển đất, vì vậy rất có thể chúng sẽ sử dụng các dụng cụ của mình một cách liều lĩnh. _Có rất nhiều cách để sử dụng các đòn tấn công của chúng chống lại chúng, hoặc người bảo vệ của chúng._
actors.mobs.gnollsapper.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.gnollsapper.name=lính công binh Gnoll
actors.mobs.gnolltrickster.desc=Một sinh vật có vẻ ngoài kỳ dị, ngay cả theo tiêu chuẩn của loài gnoll. Nó khom người về phía trước với nụ cười nham hiểm, gần như ôm chặt chiếc túi đeo trên vai. Đôi mắt nó mở to với một sự pha trộn kỳ lạ giữa sợ hãi và phấn khích. Trong túi của nó có một bộ sưu tập lớn các mũi phi tiêu được làm sơ sài, tất cả dường như đều được tẩm các chất độc hại khác nhau.
actors.mobs.gnolltrickster.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.gnolltrickster.name=kẻ lừa đảo gnoll
actors.mobs.goldenmimic.desc=Những sinh vật giả dạng (Mimics) là những sinh vật ma thuật có thể biến hình thành bất kỳ hình dạng nào chúng muốn. Trong các hầm ngục, chúng hầu như luôn chọn hình dạng rương kho báu để dụ dỗ những nhà thám hiểm không ngờ tới. Những sinh vật giả dạng vàng (Golden mimics) mạnh hơn, cố gắng thu hút những nhà thám hiểm mạnh nhất. Chúng có chiến lợi phẩm tốt hơn, nhưng cũng mạnh hơn nhiều so với những sinh vật giả dạng thông thường.
actors.mobs.goldenmimic.name=bắt chước vàng
actors.mobs.golem.def_verb=bị chặn
actors.mobs.golem.desc=Người lùn đã cố kết hợp kiến thức máy móc với khả năng ràng buộc tinh linh mới học được. Họ dùng những linh hồn đất làm linh hồn cho cơ thể máy của golem, vì cho rằng chúng dễ kiểm soát nhất. Dù vậy, chỉ một sai sót nhỏ trong nghi lễ cũng đủ khiến golem nổi loạn.
actors.mobs.golem.name=người đá
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=Ợ... ợ...
actors.mobs.goo.desc=Người ta biết rất ít về Goo. Có lẽ nó thậm chí không phải sinh vật, mà chỉ là một khối chất thải từ cống rãnh bắt đầu có ý chí riêng.
actors.mobs.goo.enraged=tức giận
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Chất nhầy đang tự bơm hơi!
actors.mobs.goo.rankings_desc=Bị chất nhầy hấp thụ
actors.mobs.greatcrab.def_verb=bị chặn
actors.mobs.greatcrab.desc=Con cua này khổng lồ, ngay cả khi so sánh với những con cua cống khác. Vỏ màu xanh lam của nó phủ đầy vết nứt và hà, cho thấy tuổi đời rất cao. Nó di chuyển chậm chạp, khó giữ thăng bằng với chiếc càng khổng lồ của mình. Mặc dù chỉ có một càng, kích thước của nó dễ dàng bù đắp cho điều đó. Con cua giơ càng ra trước bất kỳ mối đe dọa nào, tự bảo vệ mình phía sau bức tường vỏ cứng chắc không thể xuyên thủng. Tuy nhiên, con cua không thể chặn những đòn tấn công mà nó không nhìn thấy trước, hoặc các đòn tấn công từ nhiều kẻ thù cùng một lúc.
actors.mobs.greatcrab.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.greatcrab.name=cua lớn
actors.mobs.greatcrab.noticed=Con cua dùng chiếc càng khổng lồ của nó để chặn đường.
actors.mobs.guard.def_verb=bị chặn
actors.mobs.guard.desc=Từng là cai ngục, những tên lính canh này giờ đây chẳng khác gì tù nhân. Chúng lê bước như thây ma, vô hồn đi lang thang khắp các hành lang tìm kiếm bất cứ thứ gì lạ lẫm, giống như bạn vậy! Chúng đeo xích quanh hông, có thể dùng để kéo kẻ thù lại gần.
actors.mobs.guard.name=lính canh nhà tù
actors.mobs.guard.scorpion=Lại đây nào!
actors.mobs.hermitcrab.def_verb=bị chặn
actors.mobs.hermitcrab.desc=Không hiểu vì lý do gì, con cua cống này lại quyết định đội phần trên bị vỡ của một cái thùng phuy lên đầu! Trọng lượng tăng thêm đã làm chậm tốc độ của nó xuống mức bình thường, nhưng cũng giúp nó phòng thủ tốt hơn đáng kể. Có vẻ như bạn nghe thấy tiếng gì đó đang nảy lên nảy xuống bên trong thùng phuy...
actors.mobs.hermitcrab.name=cua ẩn sĩ
actors.mobs.mimic.desc=Những sinh vật giả dạng (Mimics) là những sinh vật ma thuật có thể biến hình thành bất kỳ hình dạng nào chúng muốn. Trong các hầm ngục, chúng hầu như luôn chọn hình dạng rương kho báu để dụ dỗ những nhà thám hiểm không ngờ tới. Mimics có vết cắn rất hiểm, nhưng thường chứa nhiều kho báu hơn một chiếc rương thông thường.
actors.mobs.mimic.discover_hint=Bạn có thể tìm thấy kẻ thù này ở bất cứ đâu trong hầm ngục.
actors.mobs.mimic.hidden_hint=Có điều gì đó không ổn với chiếc rương này... Tiến lại gần và cố gắng mở nó ra có lẽ là một ý kiến tồi.
actors.mobs.mimic.name=quái rương
actors.mobs.mimic.reveal=Chiếc rương đó là đồ giả!
actors.mobs.mob.died=Bạn nghe thấy tiếng gì đó chết ở đằng xa.
actors.mobs.mob.discover_hint=Bạn có thể tìm thấy kẻ thù này ở một khu vực cụ thể trong hầm ngục.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Bị tiêu diệt bởi: %s
actors.mobs.monk$focus.desc=Vị sư này hoàn toàn tập trung vào mục tiêu của mình, và dường như đang đoán trước các động tác của đối phương trước khi chúng thực hiện. Trong khi tập trung, đòn tấn công vật lý tiếp theo nhắm vào nhân vật này chắc chắn sẽ trượt, bất kể hoàn cảnh nào. Đỡ đòn tấn công này sẽ tiêu hao sự tập trung của sư, và họ cần phải tích lũy lại để đỡ đòn tấn công khác. Sư tích lũy sự tập trung nhanh hơn khi họ đang di chuyển.
actors.mobs.monk$focus.name=tập trung
actors.mobs.monk.def_verb=bị chặn
actors.mobs.monk.desc=Những tu sĩ này là những kẻ cuồng tín, dành cả đời bảo vệ bí mật của thành phố trước mọi người ngoài. Họ không dùng giáp hay vũ khí, chỉ dựa vào võ thuật tay không.
actors.mobs.monk.name=tu sĩ người lùn
actors.mobs.monk.parried=đỡ
actors.mobs.necromancer$necroskeleton.desc=Bộ xương này được triệu hồi bởi một pháp sư gọi hồn. Nó hành xử giống như một bộ xương bình thường và sẽ chết khi pháp sư gọi hồn triệu hồi nó bị tiêu diệt.
actors.mobs.necromancer$necroskeleton.name=bộ xương của pháp sư gọi hồn
actors.mobs.necromancer.desc=Những pháp sư hắc ám tập sự này đã đổ xô đến nhà tù, vì đây là nơi hoàn hảo để luyện tập ma thuật tà ác của chúng. Các pháp sư gọi hồn sẽ triệu hồi và tăng sức mạnh cho bộ xương để chiến đấu cho chúng. Giết pháp sư gọi hồn cũng sẽ giết chết bộ xương mà nó triệu hồi.
actors.mobs.necromancer.name=pháp sư gọi hồn
actors.mobs.npcs.blacksmith.cant_enter_old=Khu vực đó không thể tiếp cận trong lần chơi này. Hãy chơi lại game để thử nhiệm vụ mới!
actors.mobs.npcs.blacksmith.def_verb=bị chặn
actors.mobs.npcs.blacksmith.desc=Người thợ rèn troll này trông giống như tất cả những người troll khác: cao và gầy, da của anh ta giống đá cả về màu sắc lẫn kết cấu. Người thợ rèn troll đang mày mò với những dụng cụ nhỏ bé không cân xứng với cơ thể mình.
actors.mobs.npcs.blacksmith.enter_no=Chưa
actors.mobs.npcs.blacksmith.enter_yes=Tôi đã sẵn sàng
actors.mobs.npcs.blacksmith.entrance_blocked=Đường xuống bị chặn.
actors.mobs.npcs.blacksmith.exit_no=Chưa
actors.mobs.npcs.blacksmith.exit_warn_crystal=Viên pha lê khổng lồ đó vẫn còn ở dưới đó. Tôi sẽ trả thêm tiền nếu anh phá hủy nó.
actors.mobs.npcs.blacksmith.exit_warn_full=Xong chưa? Cậu có rất nhiều vàng, nhưng nhớ đừng để quên bất kỳ đồ đạc nào nhé.\n\n_Nhớ nhé, một khi cậu lên đây thì ta sẽ không cho cậu vào lại đâu._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Cây nấm khổng lồ đó vẫn còn ở dưới đó. Tôi sẽ trả thêm tiền nếu anh tiêu diệt nó.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Tên pháp sư gnoll đó vẫn còn ở dưới đó. Tôi sẽ trả thêm tiền nếu anh giết nó.
actors.mobs.npcs.blacksmith.exit_warn_high=Xong chưa? Có vẻ như cậu đã thu được khá nhiều vàng rồi, nhưng tôi cần thêm một chút nữa. Cậu có thể kiếm được khoảng 40 miếng. Nhớ nhé, một khi cậu lên đây thì tôi sẽ không cho cậu vào lại đâu.
actors.mobs.npcs.blacksmith.exit_warn_low=Xong rồi à? Trông có vẻ như cậu không có nhiều vàng lắm. Cậu chắc phải kiếm được khoảng 40 miếng chứ. Nhớ nhé, một khi cậu lên đây thì tôi sẽ không cho cậu vào lại đâu.
actors.mobs.npcs.blacksmith.exit_warn_med=Xong chưa? Ít nhất thì cậu cũng đã kiếm được một ít vàng, nhưng chắc chắn là còn nhiều hơn nữa trong hầm mỏ. Cậu có thể kiếm được khoảng 40 miếng. Nhớ nhé, một khi cậu lên trên thì tôi sẽ không cho cậu vào lại đâu.
actors.mobs.npcs.blacksmith.exit_warn_none=Xong rồi à? Cậu hầu như chẳng có đồng vàng nào cả! Cậu phải kiếm được khoảng 40 đồng chứ. Nhớ nhé, một khi cậu lên đến đây thì tôi sẽ không cho cậu vào lại đâu.
actors.mobs.npcs.blacksmith.exit_yes=Tôi xong rồi
actors.mobs.npcs.blacksmith.get_lost=Tôi đang bận. Biến đi!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Này anh bạn! Trông anh có vẻ rất quan trọng đấy.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Nhưng hãy cẩn thận, mỏ này nguy hiểm đối với một người nhỏ bé như cậu. Nó đã bị bỏ hoang một thời gian rồi, và rất nhiều tinh thể bắt đầu mọc lên. Chúng sáng bóng, nhưng quá dễ vỡ để có giá trị gì, và chúng được bảo vệ bởi một số thứ ma thuật. Chúng khá mạnh, vì vậy _hãy cẩn thận khi khai thác_ nếu không cậu sẽ thu hút sự chú ý của chúng.\n\nNgoài ra còn có một _tinh thể khổng lồ_ ở đâu đó nữa. Nó cứng hơn nhiều, vì vậy hãy chuẩn bị cho một cuộc chiến nếu cậu bắt đầu phá vỡ nó. Ta cá là việc đập vỡ nó sẽ làm chậm sự phát triển của tất cả các tinh thể, vì vậy ta sẽ trả thêm tiền nếu cậu làm được.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Này, bạn là người dũng cảm đấy!
actors.mobs.npcs.blacksmith.intro_quest_fungi=Tuy nhiên, hãy cẩn thận, hầm mỏ này rất nguy hiểm đối với một người nhỏ bé như bạn. Có một con quái vật nấm nào đó đang mọc ở dưới đó. Nó có những con nấm canh gác cực kỳ nguy hiểm nếu chúng nhìn thấy bạn, nhưng ít nhất chúng không thể đứng dậy và đuổi theo bạn. Hãy _tránh xa tầm nhìn_ nếu bạn muốn sống sót. Tôi sẽ trả thêm tiền nếu bạn có thể hạ gục con nấm _lớn nhất_, nhưng điều đó sẽ đòi hỏi rất nhiều nỗ lực. Nó được kết nối với một loạt các nút sợi nấm ẩn trong các bức tường. Bạn sẽ phải phá vỡ hầu hết chúng trước khi có thể gây sát thương thực sự cho nó.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Nhưng hãy cẩn thận, mỏ này nguy hiểm cho một người nhỏ bé như cậu đấy. Một số gnoll cũng muốn vàng và giờ chúng đang phá hoại nơi này. Chúng thật ngu ngốc, nên việc khai thác của chúng đã gây ra đủ loại sụp đổ và sập hầm. Cậu sẽ phải đào xuyên qua đó, vì vậy hãy tìm những tảng đá vừa bị xáo trộn. Tôi nghĩ một trong số những con gnoll đang gây ra hầu hết rắc rối, có lẽ là một pháp sư địa lý hoặc gì đó. Tôi sẽ trả thêm tiền nếu cậu tìm thấy và giết được nó, nhưng tôi chắc chắn nó sẽ chống trả.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Này anh bạn! Trông anh có vẻ nhanh nhẹn đấy.
actors.mobs.npcs.blacksmith.intro_quest_mage=Này, người! Trông bạn có vẻ thông minh đấy.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Này, con người! Trông ngươi có vẻ ranh mãnh đấy.
actors.mobs.npcs.blacksmith.intro_quest_start=Muốn làm việc gì đó hữu ích à? Được thôi, tôi có việc này cho cậu. Tôi đã xây cái xưởng này trên một mỏ cũ, nó ở ngay dưới cái thang kia. Cầm cái cuốc này và đào cho tôi một ít quặng vàng đen. 40 miếng là đủ rồi. Đá ở dưới đó khá mềm nên cậu sẽ có thể đào xuyên qua các bức tường nếu cố gắng một chút. Ý cậu là sao, tôi trả tiền kiểu gì? Cậu tham lam quá... Được rồi, được rồi, tôi có thể rèn đồ cho cậu. Cậu cứ tự thấy mình may mắn đi, tôi là thợ rèn duy nhất ở đây đấy.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Này, người! Trông ngươi có vẻ cứng rắn đấy.
actors.mobs.npcs.blacksmith.lost_pick=Bạn đang đùa tôi à? Cuốc chim của tôi đâu rồi?!
actors.mobs.npcs.blacksmith.name=thợ rèn troll
actors.mobs.npcs.blacksmith.quest_start_prompt=Bạn sẵn sàng xuống chưa? Nhớ chừa đủ chỗ trống để đựng vàng nhé.\n\n_Tôi chỉ để bạn thất vọng một lần thôi!_
actors.mobs.npcs.blacksmith.reminder=Anh đã làm mất thời gian của tôi chưa? Lối vào mỏ ở đằng kia.
actors.mobs.npcs.blacksmith.reminder_crystal=Hãy mang cho ta càng nhiều vàng càng tốt, và cố gắng phá vỡ viên pha lê lớn đó nữa.
actors.mobs.npcs.blacksmith.reminder_fungi=Hãy mang cho ta càng nhiều vàng càng tốt, và cố gắng tiêu diệt cả cây nấm khổng lồ nữa.
actors.mobs.npcs.blacksmith.reminder_gnoll=Hãy mang đến cho ta càng nhiều vàng càng tốt, và cố gắng tiêu diệt cả tên pháp sư địa lý Gnoll nữa.
actors.mobs.npcs.ghost.crab_1=Chào %s... Ta từng giống như ngươi - mạnh mẽ và tự tin... Nhưng ta đã bị một sinh vật cổ xưa giết chết... Ta không thể rời khỏi nơi này... Cho đến khi ta trả thù được... Hãy tiêu diệt con cua khổng lồ, kẻ đã cướp đi sinh mạng ta...\n\n Nó già một cách bất thường... Với một chiếc càng khổng lồ và lớp vỏ dày... Hãy cẩn thận với càng của nó, ngươi phải bất ngờ tấn công con cua nếu không nó sẽ dùng càng để chặn ngươi...
actors.mobs.npcs.ghost.crab_2=Làm ơn... Giúp tôi... Tiêu diệt con giáp xác...\n\n_Nó sẽ luôn chặn đường... Khi nó nhìn thấy bạn đến..._
actors.mobs.npcs.ghost.desc=Bóng ma hầu như không thể nhìn thấy. Nó trông giống như một đốm sáng mờ nhạt không có hình dạng cụ thể với khuôn mặt buồn rầu.
actors.mobs.npcs.ghost.find_me=Cảm ơn bạn... hãy đến tìm tôi...
actors.mobs.npcs.ghost.gnoll_1=Chào %s... Ta từng giống như ngươi - mạnh mẽ và tự tin... Nhưng ta đã bị một kẻ thù xảo quyệt giết chết... Ta không thể rời khỏi nơi này... Cho đến khi ta trả thù được... Hãy tiêu diệt tên _gnoll xảo quyệt_ đã cướp đi mạng sống của ta...\n\n Nó không giống những con gnoll khác... Nó ẩn nấp và sử dụng vũ khí ném... _Hãy cẩn thận với những mũi tên độc và gây cháy của nó, đừng tấn công từ xa..._
actors.mobs.npcs.ghost.gnoll_2=Làm ơn... Hãy giúp tôi... Tiêu diệt tên lừa đảo...\n\n_Đừng để nó đánh trúng bạn... Hãy đến gần nó..._
actors.mobs.npcs.ghost.name=hồn ma buồn
actors.mobs.npcs.ghost.rat_1=Chào %s... Ta từng giống như ngươi - mạnh mẽ và tự tin... Nhưng ta đã bị một con quái vật gớm ghiếc giết chết... Ta không thể rời khỏi nơi này... Cho đến khi ta trả thù được... Giết chết con _chuột hôi thối_ đã cướp đi mạng sống của ta...\n\n Nó lảng vảng trên sàn nhà này... Rải rác bẩn thỉu khắp nơi... _Hãy cẩn thận với đám mây mùi hôi thối và vết cắn ăn mòn của nó, axit tan trong nước..._
actors.mobs.npcs.ghost.rat_2=Làm ơn... Hãy giúp tôi... Tiêu diệt con quái vật gớm ghiếc...\n\n_Hãy chiến đấu gần nguồn nước... Tránh mùi hôi thối..._
actors.mobs.npcs.imp.cya=Hẹn gặp lại, %s!
actors.mobs.npcs.imp.desc=Quỷ lùn là loài quỷ cấp thấp. Chúng không nổi bật về sức mạnh hay tài năng ma thuật, nhưng lại khá thông minh và hòa đồng. Nhiều quỷ lùn thích sống chung với những sinh vật không phải quỷ.
actors.mobs.npcs.imp.golems_1=Trong trường hợp của tôi thì đó là những con golem cần phải tiêu diệt. Bạn thấy đấy, tôi định bắt đầu một công việc kinh doanh nhỏ ở đây, nhưng những con golem ngu ngốc đó lại gây cản trở việc kinh doanh! Thật khó để thương lượng với những khối đá granit biết đi, chết tiệt chúng! Vì vậy, hãy tiêu diệt... giả sử là _4 con_ và bạn sẽ nhận được phần thưởng.
actors.mobs.npcs.imp.golems_2=Chuyến thám hiểm golem của bạn thế nào rồi? Nhớ thu thập mấy cái token nhé.
actors.mobs.npcs.imp.hey=Này, %s!
actors.mobs.npcs.imp.intro=Bạn có phải là một nhà phiêu lưu mạo hiểm không? Tôi rất thích những nhà phiêu lưu mạo hiểm! Bạn luôn có thể trông cậy vào họ nếu cần tiêu diệt thứ gì đó, đúng không? Tất nhiên là với một khoản tiền thưởng rồi ;)
actors.mobs.npcs.imp.monks_1=Trong trường hợp của tôi, đó là những _nhà sư_ cần phải bị giết. Bạn thấy đấy, tôi định mở một cửa hàng nhỏ ở đây, nhưng những kẻ điên đó không tự mua gì cả và sẽ làm những khách hàng khác sợ hãi bỏ đi. Vì vậy, hãy giết... giả sử là _5 tên_ và bạn sẽ nhận được phần thưởng.
actors.mobs.npcs.imp.monks_2=Ồ, cậu vẫn còn sống à! Tớ biết võ công của cậu sẽ mạnh hơn mà ;) Chỉ đừng quên lấy mấy cái thẻ bài đó nhé.
actors.mobs.npcs.imp.name=kẻ tham vọng
actors.mobs.npcs.impshopkeeper.buyback=Con yêu tinh vui vẻ trả lại món đồ của bạn.
actors.mobs.npcs.impshopkeeper.desc=Tên quỷ nhỏ đã dựng một cửa hàng nhỏ ở rìa các sảnh bên trong. Thật vui khi thấy một khuôn mặt thân thiện, nhưng giá cả của hắn thì chắc chắn không hề thân thiện chút nào.
actors.mobs.npcs.impshopkeeper.greetings=Chào %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Bạn đã làm gì vậy %s? Mua sắm nhanh lên, tôi phải đi khỏi đây!
actors.mobs.npcs.impshopkeeper.name=kẻ tham vọng
actors.mobs.npcs.impshopkeeper.thief=Tôi tưởng tôi có thể tin tưởng bạn!
actors.mobs.npcs.mirrorimage.desc=Ảo ảnh này giống hệt bạn, chỉ nhợt nhạt hơn và hơi co giật.
actors.mobs.npcs.mirrorimage.discover_hint=Bạn có thể tìm thấy nhân vật này trong một cuộn giấy đặc biệt.
actors.mobs.npcs.mirrorimage.name=hình ảnh phản chiếu
actors.mobs.npcs.npc.discover_hint=Bạn có thể tìm thấy nhân vật này ở một khu vực cụ thể trong hầm ngục.
actors.mobs.npcs.prismaticimage.desc=Ảo ảnh lung linh này có vẻ ngoài rất giống bạn, thậm chí dường như còn sử dụng vũ khí và áo giáp hiện tại của bạn.\n\nHình ảnh lăng kính sẽ cố gắng tìm kiếm và thu hút sự chú ý của kẻ thù, sử dụng khả năng phòng thủ và máu được tăng cường để bảo vệ bạn. Mặc dù chúng không có sức tấn công mạnh mẽ như ảnh phản chiếu, nhưng chúng có độ bền cao hơn, bao gồm cả việc nhận được lợi ích từ áo giáp của bạn.\n\nKhi bị giảm xuống 0 máu, hình ảnh lăng kính sẽ mờ dần trong vài lượt và vẫn có thể được hồi phục trong thời gian này. Khi không có kẻ thù nào xuất hiện, hình ảnh lăng kính sẽ mờ dần và trở lại với chủ nhân của chúng.
actors.mobs.npcs.prismaticimage.discover_hint=Bạn có thể tìm thấy nhân vật này trong một cuộn giấy đặc biệt.
actors.mobs.npcs.prismaticimage.name=hình ảnh lăng kính
actors.mobs.npcs.ratking.confused=Cái gì... Mình đang ở đâu vậy? Vương quốc của ta cần ta!
actors.mobs.npcs.ratking.crown_after=Bạn hài lòng với bộ giáp mới của mình chứ? Không được trả lại hàng!
actors.mobs.npcs.ratking.crown_clothes=Mặc quần áo vào đi! Anh không có tư cách gì để nói chuyện với hoàng gia cả!
actors.mobs.npcs.ratking.crown_desc=Ôi, chiếc vương miện đó là dành cho tôi sao!? Nó trông sáng bóng hơn của tôi nhiều, vậy nên tôi xin trân trọng nhận lấy!\n\nThật ra, tôi nghĩ mình có thể tặng bạn một thứ gì đó làm phần thưởng cho chiếc vương miện này. Một sức mạnh to lớn xứng đáng với một anh hùng như bạn! Bạn có muốn không?
actors.mobs.npcs.ratking.crown_fine=Được thôi! Dù sao thì tôi cũng chẳng muốn nó...
actors.mobs.npcs.ratking.crown_info=Hãy kể thêm chi tiết trước đã.
actors.mobs.npcs.ratking.crown_no=Tôi không muốn...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, cảm ơn bạn! Giờ thì hãy đi và làm cho nhà vua tự hào nhé!
actors.mobs.npcs.ratking.crown_yes=Tất nhiên rồi!
actors.mobs.npcs.ratking.desc=Con chuột này lớn hơn một chút so với chuột túi thông thường. Nó đội một chiếc vương miện nhỏ trên đầu.
actors.mobs.npcs.ratking.desc_birthday=Con chuột này lớn hơn một chút so với chuột túi thông thường. Nó đội một chiếc mũ sinh nhật nhỏ màu xanh lá cây thay cho vương miện thường ngày. Chúc mừng sinh nhật Vua Chuột!
actors.mobs.npcs.ratking.desc_crown=Con chuột này lớn hơn một chút so với chuột túi thông thường. Nó đội vương miện của vua lùn trên đầu.
actors.mobs.npcs.ratking.desc_winter=Con chuột này lớn hơn một chút so với chuột túi thông thường. Nó đội một chiếc mũ nhỏ xinh thay cho vương miện thường ngày. Chúc mừng kỳ nghỉ lễ!
actors.mobs.npcs.ratking.discover_hint=Bạn có thể tìm thấy nhân vật này ở cuối một khu vực cụ thể trong hầm ngục.
actors.mobs.npcs.ratking.name=vua chuột
actors.mobs.npcs.ratking.not_sleeping=Tôi không ngủ!
actors.mobs.npcs.ratking.what_is_it=Cái gì vậy? Ta không có thời gian cho chuyện vớ vẩn này. Vương quốc của ta sẽ không tự cai trị được!
actors.mobs.npcs.sheep.baa!=Bê!
actors.mobs.npcs.sheep.baa.=Bê.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.baa?=Baa?
actors.mobs.npcs.sheep.def_verb=bị chặn
actors.mobs.npcs.sheep.desc=Đây là một con cừu thần kỳ. Điều gì khiến nó thần kỳ đến vậy? Bạn không thể giết nó. Nó sẽ đứng đó cho đến khi biến mất một cách kỳ diệu, trong khi vẫn nhai cỏ với ánh mắt vô hồn.
actors.mobs.npcs.sheep.discover_hint=Bạn có thể tìm thấy nhân vật này cùng với một vật phẩm hoặc cái bẫy cụ thể.
actors.mobs.npcs.sheep.name=con cừu
actors.mobs.npcs.shopkeeper.buyback=Người bán hàng miễn cưỡng trả lại món đồ của bạn.
actors.mobs.npcs.shopkeeper.desc=Gã mập mạp này trông hợp với khu thương mại ở một thành phố lớn hơn là một ngục tối. Giá cả của hắn ta giải thích tại sao hắn lại thích làm ăn ở đây.
actors.mobs.npcs.shopkeeper.flee=Người chủ cửa hàng bỏ chạy!
actors.mobs.npcs.shopkeeper.name=chủ cửa hàng
actors.mobs.npcs.shopkeeper.sell=Bán một mặt hàng
actors.mobs.npcs.shopkeeper.talk=Nói chuyện
actors.mobs.npcs.shopkeeper.talk_ascent=Tôi không biết anh định làm gì với cái bùa hộ mệnh đó nhưng tôi không muốn dính dáng gì đến nó cả. Mua thứ gì đó rồi đi thôi, cả hai chúng ta đều cần rời khỏi nơi này!
actors.mobs.npcs.shopkeeper.talk_caves=Tiêu tiền, sống lâu hơn.\n\nỸ và nếu gặp thì gửi lời chào đến tên thợ rèn quỷ lùn đó hộ tôi nhé. Nhắc hắn ta nhớ là hắn vẫn còn nợ tiền cái búa tôi bán cho hắn tuần trước đấy!
actors.mobs.npcs.shopkeeper.talk_city=Hàng hóa của tôi có thể giữ an toàn cho bạn ở đây.\n\n...Và làm ơn đừng nán lại quá lâu. Tôi đã mất rất nhiều thời gian để thuyết phục dân địa phương ở đây để họ không làm phiền tôi nữa, tôi không muốn bạn gây ra rắc rối gì cả!
actors.mobs.npcs.shopkeeper.talk_halls=Chào các bạn, mình có giá đặc biệt dành cho thợ săn quỷ đây!\n\nỸ và nhớ cẩn thận nhé! Bọn quỷ bên dưới không quan tâm các bạn dũng cảm đến đâu đâu. Nếu chết rồi thì các bạn không thể quay lại và tiêu thêm tiền được đâu! ;)\n\nBọn quỷ có giống mình không? Hehe, không hề. Mình chỉ là một tên nhỏ bé, không giỏi chiến đấu lắm, nhưng mình vẫn giữ được tinh thần tỉnh táo. Bọn quỷ bên dưới mạnh hơn nhiều, và chúng đều bị nô dịch bởi... à... nhớ cẩn thận nhé.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Chào ngài Điện hạ, hay giờ là Đức Thánh thượng nhỉ? Hehe, dù sao thì đây cũng không phải chỗ dành cho ngài, nhiều người sẽ rất đau lòng nếu ngài chết. Nhưng chắc ngài cũng có nhiều tiền, sao không mua thứ gì đó để phòng tránh điều đó nhỉ?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ồ, chẳng phải là anh hùng du hành sao! Nếu anh đang cố gắng cứu một thị trấn khác thì chúc may mắn, những nguy hiểm ở đây còn tồi tệ hơn cả những băng cướp vặt vãnh. Tôi chắc chắn anh sẽ làm tốt hơn bất cứ ai khác, chỉ cần cố gắng đừng chết ngay trước cửa hàng của tôi là được.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Cô có vẻ không quen thuộc với nơi này lắm, thưa cô. Hành lang ngục tối chật hẹp không rộng rãi như những đại sảnh hay những khu rừng bao quanh thành phố phải không? Hehe, ồ đừng để ý đến những lời lảm nhảm của tôi, sao không mua gì đó đi?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Tôi có mọi thứ bạn cần cho một chuyến phiêu lưu thành công!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, tôi nghĩ tôi đã thấy một tấm áp phích truy nã có tên anh ở đâu đó trong thành phố. Đang chạy trốn à? Ồ, anh vô tội chứ? Tất nhiên, tất nhiên rồi... Đừng lo lắng, tôi còn nhiều việc quan trọng hơn là viết báo cáo về anh, nhưng có lẽ anh nên mua thứ gì đó để chắc chắn hơn?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Anh đến từ hội trộm để dọn dẹp khu vực này à? Không, chỉ đi mua sắm thôi sao? Vậy thì cứ tiêu diệt vài con quái vật trong khi anh ở đây đi. Cũng đừng mong được giảm giá, tôi trả tiền bảo kê cho các anh rất hậu hĩnh mà các anh hầu như chẳng bảo vệ được tôi gì ở đây cả.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Con dấu của anh thú vị đấy, thường thì chúng còn nguyên vẹn. Anh là anh hùng bị thất sủng hay sao? Thôi thì chuyện anh làm không liên quan gì đến tôi, tiền của anh vẫn còn giá trị.
actors.mobs.npcs.shopkeeper.thief=Tên trộm, tên trộm!
actors.mobs.npcs.shopkeeper.warn=Hãy xem đi! Tôi sẽ không cảnh báo bạn lần nữa đâu.
actors.mobs.npcs.vaultlaser.desc=Lính canh này đang bắn tia laser theo định kỳ. _Vì đây chỉ là khu vực thử nghiệm, nên tia laser sẽ không gây hại cho bạn._
actors.mobs.npcs.vaultlaser.name=hầm chứa tia laser canh gác
actors.mobs.npcs.vaultsentry.desc=Lính canh này đang quét khu vực theo một mô hình nhất định. _Vì đây chỉ là khu vực thử nghiệm, lính canh sẽ không làm gì nếu phát hiện ra bạn._
actors.mobs.npcs.vaultsentry.name=lính canh quét kho tiền
actors.mobs.npcs.wandmaker.def_verb=bị chặn
actors.mobs.npcs.wandmaker.desc=Vị quý ông già nhưng khỏe mạnh này mang vẻ mặt hơi bối rối. Ông được bảo vệ bởi một chiếc khiên ma thuật.
actors.mobs.npcs.wandmaker.intro_1=Tôi đến đây để tìm một nguyên liệu quý hiếm cho cây đũa phép, nhưng tôi đã bị lạc đường, và lá chắn ma thuật của tôi đang suy yếu. Tôi cần phải rời đi sớm, nhưng không nỡ đi mà không lấy được thứ mình cần.
actors.mobs.npcs.wandmaker.intro_2=Nếu bạn có thể lấy được thứ đó cho tôi, tôi sẽ rất vui lòng trả công cho bạn bằng một trong những cây đũa phép được chế tác tinh xảo của tôi! Tôi mang theo hai cây, nên bạn có thể chọn cây nào bạn thích.
actors.mobs.npcs.wandmaker.intro_berry=Ông quản ngục cũ của nhà tù này có trồng một cây dâu rừng, và tôi đang tìm kiếm một hạt giống của nó. Tuy nhiên, có lẽ cây đã mọc hoang dại rồi, nên việc lấy được hạt giống từ nó sẽ khá khó khăn. Vườn của nó chắc hẳn ở đâu đó quanh đây. Cố gắng tránh xa những dây leo của nó nếu muốn được an toàn. Dùng lửa có vẻ hấp dẫn nhưng xin đừng làm vậy, bạn sẽ giết chết cây và phá hủy hạt giống của nó.
actors.mobs.npcs.wandmaker.intro_cleric=Ồ, chào Điện hạ! Thật là một bất ngờ thú vị khi được gặp Ngài ở một nơi ảm đạm như thế này! Tôi rất tiếc phải làm phiền, nhưng tôi có một nhiệm vụ muốn giao cho Ngài.
actors.mobs.npcs.wandmaker.intro_duelist=Ồ, chào cô! Thật là một bất ngờ thú vị khi gặp được một người hùng ở một nơi ảm đạm như thế này! Nếu cô sẵn lòng giúp đỡ một ông già, tôi có thể có một nhiệm vụ dành cho cô.
actors.mobs.npcs.wandmaker.intro_dust=Tôi đang tìm một ít _bột xác chết_. Đó là một loại bột xương bị nguyền rủa đặc biệt thường xuất hiện ở những nơi như thế này. Chắc chắn phải có một căn phòng bị rào chắn ở đâu đó quanh đây, tôi tin là sẽ có một ít bột ở đó. Nhưng hãy cẩn thận, lời nguyền mà loại bột này mang theo khá mạnh, _hãy liên lạc lại với tôi càng nhanh càng tốt_ và tôi sẽ thanh tẩy nó cho bạn.
actors.mobs.npcs.wandmaker.intro_ember=Tôi đang tìm kiếm một ít tàn lửa mới từ một nguyên tố lửa sơ sinh. Nguyên tố thường xuất hiện khi nghi lễ triệu hồi không được kiểm soát, vì vậy chỉ cần tìm một vài ngọn nến và một địa điểm thực hiện nghi lễ, tôi chắc chắn bạn có thể triệu hồi được một con. Tuy nhiên, bạn nên tránh tự nhốt mình trong không gian hẹp khi chiến đấu với nó, hoặc bạn có thể chuẩn bị sẵn một vật phẩm đóng băng nào đó. Nguyên tố sơ sinh khá mạnh mẽ và hỗn loạn, nhưng chúng không chịu được lạnh.
actors.mobs.npcs.wandmaker.intro_huntress=Ồ, chào cô! Một gương mặt thân thiện ở đây quả là một bất ngờ thú vị phải không? Thật ra, tôi thề là tôi đã từng thấy mặt cô trước đây, nhưng tôi không nhớ ra được... Thôi kệ vậy, nếu cô đến đây để tìm kiếm phiêu lưu, tôi có thể có một nhiệm vụ dành cho cô.
actors.mobs.npcs.wandmaker.intro_mage=Ồ, chào %s! Tôi nghe nói có chuyện ồn ào liên quan đến cậu và học viện phù thủy phải không? Thôi kệ đi, dù sao tôi cũng chẳng thích mấy kẻ bảo thủ đó. Nếu cậu đồng ý, tôi có một việc cần giao cho cậu.
actors.mobs.npcs.wandmaker.intro_rogue=Trời ơi, anh làm tôi giật mình! Tôi chưa từng gặp tên cướp nào ở đây mà còn tỉnh táo, vậy chắc anh đến từ mặt đất rồi! Nếu anh sẵn lòng giúp đỡ người lạ, tôi có thể giao cho anh một việc.
actors.mobs.npcs.wandmaker.intro_warrior=Ồ, chào anh! Thật là một bất ngờ thú vị khi gặp một chiến binh phương Bắc ở một nơi ảm đạm như thế này! Chắc hẳn anh đã đi một chặng đường rất xa để đến đây. Nếu anh đang tìm kiếm sự phiêu lưu, tôi có thể có một nhiệm vụ dành cho anh.
actors.mobs.npcs.wandmaker.name=người thợ làm đũa phép già
actors.mobs.npcs.wandmaker.reminder_berry=Bạn có may mắn tìm được hạt cây dâu thối không, %s? Hãy tìm một căn phòng đầy cây cối.
actors.mobs.npcs.wandmaker.reminder_dust=Bạn có may mắn gì với bụi xác chết không, %s? Hãy tìm kiếm một số rào chắn.
actors.mobs.npcs.wandmaker.reminder_ember=Bạn có may mắn gì với đống than hồng đó không, %s? Bạn cần tìm bốn ngọn nến và địa điểm thực hiện nghi lễ.
actors.mobs.phantompiranha.desc=Cá piranha ma thuật là một giống cá piranha quý hiếm với khả năng ma thuật và thân hình trong suốt kỳ lạ. Chúng có khả năng dịch chuyển tức thời khi bị tấn công, hoặc để trốn thoát hoặc để nhanh chóng tiếp cận kẻ thù! Mặc dù rất khó chịu khi phải chiến đấu với chúng, nhưng thịt của chúng lại được đánh giá cao vì những đặc tính ma thuật của nó.
actors.mobs.phantompiranha.name=cá piranha ma
actors.mobs.phantompiranha.teleport_away=Con cá piranha ma quái dịch chuyển đi mất...
actors.mobs.piranha.desc=Loại cá ăn thịt này được nuôi để bảo vệ các khu vực bị ngập lụt. Vết cắn của chúng rất nguy hiểm, vì vậy tốt nhất là nên tránh đối đầu trực tiếp với chúng.
actors.mobs.piranha.discover_hint=Bạn có thể tìm thấy kẻ thù này ở bất cứ đâu trong hầm ngục.
actors.mobs.piranha.name=cá piranha khổng lồ
actors.mobs.pylon.desc_active=Cột điện cao thế, có chức năng điều chỉnh điện năng cung cấp cho máy móc trong khu vực này. Cột điện hiện đang tích tụ nhiều năng lượng điện, chắc hẳn đây là thứ đang tăng cường sức mạnh cho DM-300!\n\nỞ trạng thái này, các cột điện dễ bị tổn thương, nhưng sẽ phóng điện sang các tế bào lân cận theo chiều kim đồng hồ. Do cấu tạo bằng kim loại nặng, các cột điện có khả năng chống chịu được lượng hư hại lớn.
actors.mobs.pylon.desc_inactive=Cột điện cao thế, có chức năng điều chỉnh điện năng cung cấp cho máy móc trong khu vực này. Cột điện hiện đang không hoạt động và không bị hư hại.
actors.mobs.pylon.name=cột điện
actors.mobs.rat.desc=Chuột túi là loài vật hung dữ nhưng khá yếu ớt, sống trong cống rãnh. Chúng có vết cắn rất đau, nhưng chỉ gây nguy hiểm đến tính mạng khi xuất hiện với số lượng lớn.
actors.mobs.rat.name=chuột túi
actors.mobs.ripperdemon.desc=Những sinh vật kinh hoàng này là kết quả của việc nhiều xác người lùn trong khu vực này bị các thế lực ma quỷ lợi dụng. Ripper là những sinh vật gớm ghiếc gầy gò, trông giống người lùn nhưng thân thể gãy nát và có móng vuốt dài, sắc nhọn làm bằng xương. Quỷ Ripper không đặc biệt bền bỉ, nhưng chúng nhanh nhẹn và nguy hiểm. Chúng có khả năng nhảy xa để nhanh chóng tiếp cận mục tiêu trước khi đâm xuyên chúng bằng móng vuốt.
actors.mobs.ripperdemon.leap=Con quỷ hung tàn chuẩn bị vồ mồi!
actors.mobs.ripperdemon.name=quỷ xé xác
actors.mobs.rotheart.desc=Quả của cây dâu thối rất độc đáo. Thay vì thối rữa và cung cấp chất dinh dưỡng, quả lại phát triển, cứng lại và bao bọc hạt. Nó bảo vệ các cơ quan nội tạng phát triển bên trong quả. Quả cầu khổng lồ này được gọi là tim của cây dâu thối trưởng thành.
actors.mobs.rotheart.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.rotheart.name=trái tim thối rữa
actors.mobs.rotlasher.desc=Bộ phận tấn công bằng roi thối rữa là một phần cấu trúc rễ của cây dâu thối rữa trưởng thành, và cũng là phương tiện phòng vệ chính của chúng. Những bộ phận này bị mù và bám chặt vào mặt đất, nhưng sẽ tấn công dữ dội bất kỳ mối đe dọa nào ở gần sau khi dành một chút thời gian để phát hiện ra chúng. Khi không có kẻ thù ở gần, chúng đứng bất động, cố gắng hòa mình vào thảm thực vật xung quanh.
actors.mobs.rotlasher.discover_hint=Bạn có thể gặp kẻ thù này trong một nhiệm vụ cụ thể.
actors.mobs.rotlasher.name=roi mục nát
actors.mobs.scorpio.desc=Những sinh vật ma quỷ khổng lồ giống nhện này tránh giao chiến tầm gần, chúng thích bắn những gai nhọn gây thương tích từ khoảng cách xa.
actors.mobs.scorpio.name=bọ cạp
actors.mobs.senior.desc=Những tu sĩ này là những kẻ cuồng tín, dành cả đời bảo vệ bí mật của thành phố trước mọi người ngoài. Họ không dùng giáp hay vũ khí, chỉ dựa vào võ thuật tay không.
actors.mobs.senior.name=cao tăng
actors.mobs.shaman$blueshaman.spell_desc=Thầy pháp này đeo mặt nạ màu xanh lam và sẽ sử dụng phép thuật làm tăng tạm thời sát thương bạn phải chịu.
actors.mobs.shaman$purpleshaman.spell_desc=Thầy pháp này đeo mặt nạ màu tím và sẽ sử dụng phép thuật làm giảm tạm thời độ chính xác và khả năng né tránh của bạn.
actors.mobs.shaman$redshaman.spell_desc=Thầy pháp này đeo mặt nạ đỏ và sẽ sử dụng phép thuật làm suy yếu tạm thời sức tấn công của bạn.
actors.mobs.shaman.bolt_kill=Tia sét ma thuật đã giết chết bạn...
actors.mobs.shaman.desc=Những gnoll thông minh nhất có thể học phép thuật shaman. Chúng chuộng phép chiến đấu để bù lại sức vóc yếu hơn, và chẳng ngần ngại dùng phép lên bất kỳ ai nghi ngờ địa vị của chúng trong bộ tộc.
actors.mobs.shaman.name=pháp sư gnoll
actors.mobs.skeleton.def_verb=bị chặn
actors.mobs.skeleton.desc=Bộ xương được ghép từ hài cốt của những nhà thám hiểm xấu số và cư dân ngục tối, rồi được tà thuật từ dưới sâu đánh thức. Khi chịu đủ thương tổn, chúng nổ tung thành những mảnh xương.
actors.mobs.skeleton.explo_kill=Bạn đã chết vì vụ nổ xương...
actors.mobs.skeleton.name=bộ xương
actors.mobs.slime.def_verb=bị chặn
actors.mobs.slime.desc=Slime là những sinh vật kỳ lạ, hơi có yếu tố ma thuật, với lớp vỏ ngoài dẻo như cao su và lõi bên trong là chất lỏng. Hệ thống cống rãnh của thành phố cung cấp cho chúng nguồn nước và chất dinh dưỡng dồi dào. Do lớp màng ngoài đàn hồi, rất khó để gây ra hơn _6 sát thương_ cho slime chỉ bằng một đòn tấn công.
actors.mobs.slime.name=chất nhờn
actors.mobs.snake.desc=Những con rắn khổng lồ này có khả năng nhanh chóng luồn lách né đòn, khiến chúng khá khó bị đánh trúng. Tuy nhiên, các đòn tấn công ma thuật hoặc tấn công bất ngờ có thể khiến chúng mất cảnh giác. Bạn có thể thực hiện một đòn tấn công bất ngờ bằng cách tấn công khi con rắn không nhìn thấy bạn. Một cách là để con rắn đuổi theo bạn qua cửa và sau đó tấn công ngay sau khi nó đi vào trong cửa.
actors.mobs.snake.hint=Hãy thử sử dụng nút "Kiểm tra" trên một con rắn để tìm hiểu cách đối phó với chúng.
actors.mobs.snake.name=rắn cống
actors.mobs.spectralnecromancer.desc=Mặc dù bộ xương là nguồn thu nhập chính của pháp sư gọi hồn, một số người lại thích tìm kiếm những tay sai ít hữu hình hơn. Các pháp sư gọi hồn ma quỷ đã chọn ma hồn làm tay sai ưa thích của họ!\n\nNhững con ma hồn riêng lẻ không mạnh bằng bộ xương, nhưng những pháp sư gọi hồn này không ngại triệu hồi một đám ma hồn!
actors.mobs.spectralnecromancer.name=pháp sư gọi hồn
actors.mobs.spinner.desc=Những con nhện hang lông xanh này tránh giao chiến trực tiếp. Chúng thích chờ từ xa, nhìn con mồi mắc trong tơ chậm rãi chết vì vết cắn độc.
actors.mobs.spinner.name=nhện hang
actors.mobs.statue.def_verb=bị chặn
actors.mobs.statue.desc=Thoạt nhìn, bạn có thể nghĩ đó chỉ là một trong những bức tượng vô tri vô giác của hầm ngục này, nhưng đôi mắt đỏ rực của nó đã tố cáo điều đó.
actors.mobs.statue.desc_weapon=Mặc dù bức tượng được làm bằng đá, nhưng thanh kiếm _%s_ mà nó cầm trông rất thật.
actors.mobs.statue.discover_hint=Bạn có thể tìm thấy kẻ thù này ở bất cứ đâu trong hầm ngục.
actors.mobs.statue.name=tượng hoạt hình
actors.mobs.succubus.desc=Succubus là quỷ mang dáng vẻ những cô gái quyến rũ, hơi có phong cách gothic. Nó có thể dùng phép mê hoặc anh hùng, khiến người đó không thể tấn công bất cứ ai cho đến khi hết mê hoặc.
actors.mobs.succubus.name=succubus
actors.mobs.swarm.desc=Đàn ruồi chết người vo ve giận dữ. Mỗi đòn tấn công không dùng phép thuật sẽ chia nó thành hai đàn nhỏ hơn nhưng nguy hiểm không kém.
actors.mobs.swarm.name=đàn ruồi
actors.mobs.tengu$bombability$bombblob.desc=Một đám khói siêu nóng đang cuồn cuộn bốc lên. Cẩn thận, nó sắp nổ rồi!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Nó bị dính chặt xuống đất, bạn không thể di chuyển nó được!
actors.mobs.tengu$bombability$bombitem.desc=Tengu đã ném một quả bom khói trông rất kỳ lạ ở đây, nó đang phun ra một làn khói dày đặc và nóng. Nó phát ra tiếng tích tắc lớn, như thể đang đếm ngược đến một vụ nổ! Quả bom đã dính chặt xuống đất nên bạn không thể nhặt nó lên được.
actors.mobs.tengu$bombability$bombitem.name=bom khói
actors.mobs.tengu$fireability$fireblob.desc=Tengu đã ném một loại bột mịn, có vẻ như nó đang bốc hơi, sắp bốc cháy rồi!
actors.mobs.tengu$shockerability$shockerblob.desc=Năng lượng điện đang tích tụ ở đây, bất cứ thứ gì đứng trên ô này sẽ bị giật điện ở lượt tiếp theo!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Nó tỏa ra quá nhiều điện, bạn không thể bắt lấy nó được!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu đã ném một cỗ máy kỳ lạ ở đây, dường như được làm từ các bộ phận của DM-100. Cỗ máy liên tục phóng điện xung quanh, nhưng dường như theo một quy luật nhất định. Với tất cả các tia điện phóng ra xung quanh, không thể nào bạn nhặt được nó lên được.
actors.mobs.tengu$shockerability$shockeritem.name=Thật sốc!
actors.mobs.tengu.defeated=Cuối cùng cũng tự do...
actors.mobs.tengu.desc=Tengu là thành viên của một gia tộc sát thủ cổ xưa cùng tên. Chúng nổi tiếng với việc sử dụng nhiều phi tiêu và cạm bẫy.
actors.mobs.tengu.interesting=Hãy làm cho điều này thú vị hơn nào...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Bắt được rồi, %s!
actors.mobs.tengu.notice_have=Ta đã tóm được ngươi rồi, %s!
actors.mobs.tengu.rankings_desc=Bị Tengu ám sát
actors.mobs.thief.carries=Tên trộm đang mang theo một chiếc _%s._ Rõ ràng là đồ ăn cắp.
actors.mobs.thief.desc=Mặc dù những tù nhân này được tự do đi lại trong phòng giam, nơi này vẫn là nhà tù của họ. Theo thời gian, nơi này đã cướp đi cả tâm trí lẫn tự do của họ. Từ lâu, những tên trộm và cướp điên rồ này đã quên mất mình là ai và tại sao lại phải ăn cắp. Những kẻ thù này có nhiều khả năng ăn cắp rồi bỏ chạy hơn là đánh nhau. Hãy chắc chắn luôn để mắt đến chúng, nếu không bạn có thể sẽ không bao giờ tìm lại được món đồ đã đánh cắp của mình.
actors.mobs.thief.escapes=Tên trộm đã tẩu thoát với chiếc %s của bạn!
actors.mobs.thief.name=tên trộm điên
actors.mobs.thief.stole=Tên trộm đã lấy cắp %s của bạn!
actors.mobs.tormentedspirit.desc=Những linh hồn bị dày vò vốn là những linh hồn hiền lành bị nguyền rủa. Chừng nào còn bị nguyền rủa, chúng sẽ tấn công giống như ma quỷ, và còn mạnh hơn nữa! Có thể hóa giải lời nguyền bằng cách sử dụng vật phẩm phù hợp khi ở gần linh hồn. Nếu lời nguyền được hóa giải, linh hồn chắc chắn sẽ biết ơn...
actors.mobs.tormentedspirit.name=linh hồn bị dày vò
actors.mobs.tormentedspirit.thank_you=Cảm ơn...
actors.mobs.vaultrat.desc=Con chuột này có một số thay đổi về hành vi để thử nghiệm trí tuệ nhân tạo (AI) mới của kẻ thù trong hầm chứa:\n_-_ Tiếng động của nó có thể 'nghe thấy' xuyên qua tường\n_-_ Nó sẽ đi lang thang theo một tuyến đường tuần tra đã được thiết lập sẵn\n_-_ Trong khi đi lang thang, phạm vi phát hiện của nó giảm mạnh phía sau hướng di chuyển.\n_-_ Khi ngủ, phạm vi phát hiện của nó cũng bị giảm\n_-_ Khi phát hiện ra bạn, nó sẽ 'điều tra' trước khi chuyển sang chế độ săn đuổi. Kẻ thù đang điều tra sẽ di chuyển về phía bạn nhưng không tấn công và dễ dàng bị phát hiện hơn khi nấp sau cửa và các góc khuất.
actors.mobs.warlock.bolt_kill=Tia sét bóng tối đã giết chết bạn...
actors.mobs.warlock.desc=Khi người lùn chuyển sự quan tâm từ kỹ thuật sang huyền thuật, các thuật sĩ hắc ám đã nắm quyền trong thành phố. Ban đầu họ dùng phép nguyên tố, nhưng chẳng bao lâu đã chuyển sang quỷ thuật và thuật gọi hồn.
actors.mobs.warlock.name=thuật sĩ người lùn
actors.mobs.wraith.desc=Ma hồn là linh hồn báo thù của một kẻ tội lỗi, người mà mộ phần hoặc lăng mộ đã bị quấy rầy. Là một thực thể vô hình, rất khó để tấn công nó bằng vũ khí thông thường.
actors.mobs.wraith.discover_hint=Bạn có thể tìm thấy kẻ thù này ở bất cứ đâu trong hầm ngục.
actors.mobs.wraith.name=bóng ma
actors.mobs.yogdzewa$larva.desc=Những sinh vật nhỏ bé này của Yog-Dzewa là những tay sai đơn giản, dễ sản sinh. Mặc dù yếu ớt khi đứng riêng lẻ, chúng được triệu hồi nhanh chóng và có thể trở nên áp đảo khi xuất hiện với số lượng lớn.
actors.mobs.yogdzewa$larva.name=ấu trùng của thần
actors.mobs.yogdzewa$larva.rankings_desc=Bị Yog-Dzewa nuốt chửng
actors.mobs.yogdzewa$yogeye.rankings_desc=Bị Yog-Dzewa nuốt chửng
actors.mobs.yogdzewa$yogripper.rankings_desc=Bị Yog-Dzewa nuốt chửng
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Bị Yog-Dzewa nuốt chửng
actors.mobs.yogdzewa.darkness=Bóng tối càng lúc càng bao trùm...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa là một Thần Cổ Đại; một quái vật khổng lồ vươn tới thế giới của người phàm và nuốt chửng chúng để nuôi dưỡng sự phát triển vô tận của nó. Người lùn hẳn đã thu hút sự chú ý của nỗi kinh hoàng vũ trụ này khi chơi đùa với ma thuật hắc ám, và đã cố gắng kiềm chế nó kể từ đó. Yog-Dzewa bắt nguồn từ một chiều không gian hỗn loạn ma thuật nguyên thủy, và không thể mang hình dạng thật của nó vào thế giới này. Thay vào đó, nó đã tạo ra các hình đại diện và triệu hồi những tay sai ma quỷ để thực hiện mệnh lệnh của nó ở đây. Con mắt khổng lồ này là điểm tập trung sức mạnh của Yog-Dzewa trong thế giới này. Mặc dù bản thân con mắt không thể di chuyển, nhưng nó có khả năng bắn ra những chùm tia ma thuật mạnh mẽ và triệu hồi nhiều loại tay sai để hỗ trợ nó.
actors.mobs.yogdzewa.desc_spawners=Ngươi có thể cảm nhận được những luồng năng lượng ma quỷ tỏa ra từ các tầng trên. Thứ gì đó ngươi để sống sót ở trên đó chắc hẳn đang truyền năng lượng trở lại cho Yog-Dzewa. _Yog sẽ sử dụng năng lượng này để triệu hồi thêm nhiều tay sai mạnh mẽ hơn!_
actors.mobs.yogdzewa.hope=HY VỌNG CỦA BẠN CHỈ LÀ ẢO TƯỞNG!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=TÔI. NHÌN. THẤY. BẠN.
actors.mobs.yogdzewa.rankings_desc=Bị Yog-Dzewa nuốt chửng
actors.mobs.yogfist$brightfist.desc=Nắm đấm này được tạo thành từ năng lượng ánh sáng thuần túy. Nó có khả năng bắn ra những tia sáng chói lóa mạnh mẽ mỗi lượt! Những tia sáng này sẽ tạm thời làm bạn mù và gây sát thương nặng. Nắm đấm cũng có khả năng bao trùm toàn bộ đấu trường trong ánh sáng chói lóa trong giây lát để trốn thoát!\n\nTuy nhiên, nắm đấm không có khả năng đặc biệt nào có thể sử dụng ở cự ly gần.
actors.mobs.yogfist$brightfist.name=nắm đấm sáng
actors.mobs.yogfist$brightfist.teleport=Nắm đấm dịch chuyển tức thời đi trong một luồng ánh sáng chói lóa đến mức làm bạn lóa mắt kinh khủng!
actors.mobs.yogfist$burningfist.desc=Một nắm đấm lớn bọc trong lửa. Những ngón tay khép lại nghe lách tách, rải tàn than xuống sàn.
actors.mobs.yogfist$burningfist.name=nắm đấm rực lửa
actors.mobs.yogfist$darkfist.desc=Nắm đấm này được tạo thành từ năng lượng bóng tối thuần túy. Nó có khả năng bắn ra những luồng ma thuật bóng tối mạnh mẽ mỗi lượt! Những luồng năng lượng này sẽ làm suy yếu nguồn sáng của bạn đồng thời gây sát thương nặng nề. Nắm đấm cũng có khả năng bao trùm đấu trường trong bóng tối trong chốc lát để trốn thoát!\n\nTuy nhiên, nắm đấm không có khả năng đặc biệt nào có thể sử dụng ở cự ly gần.
actors.mobs.yogfist$darkfist.name=nắm đấm bóng tối
actors.mobs.yogfist$darkfist.teleport=Nắm đấm dịch chuyển tức thời đi trong một luồng bóng tối dập tắt nguồn sáng của bạn!
actors.mobs.yogfist$rottingfist.desc=Một nắm đấm khổng lồ bằng thịt thối. Dịch nhầy hôi hám rỉ qua các kẽ ngón tay, làm bẩn nền đá bên dưới.
actors.mobs.yogfist$rottingfist.name=nắm đấm thối rữa
actors.mobs.yogfist$rustedfist.desc=Nắm đấm này được tạo thành từ kim loại sống. Nó là một khối kim loại khổng lồ biến đổi liên tục, sở hữu những đòn tấn công cận chiến mạnh mẽ và có thể làm tê liệt mục tiêu từ xa. Do khối lượng khổng lồ của nó, nắm đấm sẽ chịu mọi sát thương theo thời gian, thay vì ngay lập tức. Tuy nhiên, nắm đấm không linh hoạt và không thể di chuyển vào những lối đi hẹp. Thêm vào đó, mặc dù nó có thể chịu sát thương chậm, nhưng sát thương tích lũy sẽ tiếp tục tăng lên nếu nắm đấm bị tấn công nhiều lần.
actors.mobs.yogfist$rustedfist.name=nắm đấm rỉ sét
actors.mobs.yogfist$soiledfist.desc=Nắm đấm này được hình thành từ ma thuật đất hỗn loạn. Khi di chuyển, nó sẽ liên tục khiến cây cối mọc xung quanh. Nó cũng có thể bắn ra những luồng năng lượng đất tập trung, trói buộc mục tiêu bằng những dây leo và rễ cây phát triển nhanh chóng! Nắm đấm này lấy sức mạnh từ đời sống thực vật và sẽ chống chịu sát thương dựa trên lượng cây cối cao hoặc mọc thành bụi gần đó!
actors.mobs.yogfist$soiledfist.name=nắm đấm bẩn
actors.mobs.yogfist.desc=Cú đấm này là một khía cạnh sức mạnh của Yog-Dzewa. Nắm đấm có liên hệ mật thiết với sức mạnh của Yog-Dzewa, và sẽ được bảo vệ khỏi mọi sát thương khi ở gần mắt.
actors.mobs.yogfist.invuln_warn=Nắm đấm bất khả xâm phạm khi ở gần mắt!
actors.mobs.yogfist.rankings_desc=Bị Yog-Dzewa nuốt chửng
