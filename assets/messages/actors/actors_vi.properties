actors.mobs.mob.wandering=%s đang lang thang
actors.mobs.elemental.desc=Những tinh linh lửa lang thang là sản phẩm phụ của việc triệu hồi các thực thể hùng mạnh hơn. Bản tính của chúng hỗn loạn đến mức ngay cả nhà nghiên cứu quỷ thuật giỏi nhất cũng không thể kiểm soát.
actors.mobs.elemental.name=tinh linh lửa
actors.mobs.king.desc=Vị vua cuối cùng của người lùn nổi tiếng nhờ hiểu biết sâu sắc về sự sống và cái chết. Ông thuyết phục các cận thần tham gia nghi lễ hứa hẹn ban cho họ tuổi trẻ vĩnh hằng. Cuối cùng, chỉ mình ông đạt được điều đó — cùng một đạo quân xác sống.
actors.mobs.king.name=Vua của người lùn
actors.mobs.npcs.bee.desc=Tuy nhỏ bé, ong vàng bảo vệ chủ rất dữ dội. Có điều chúng không sống được lâu.
actors.mobs.npcs.bee.name=ong vàng
actors.mobs.shielded.desc=Lực sĩ là những gnoll to lớn, mạnh mẽ và bền bỉ nhất. Khi bị thương nặng, chúng nổi điên và gây thêm sát thương lên kẻ thù.
actors.mobs.shielded.name=lực sĩ cầm khiên
actors.mobs.yog.desc=Yog-Dzewa là một Thần Cổ Đại, một thực thể hùng mạnh đến từ cõi hỗn loạn. Một thế kỷ trước, tộc người lùn cổ đại đã suýt thua trong cuộc chiến chống lại đội quân quỷ của nó, nhưng không thể tiêu diệt được chính vị thần này. Thay vào đó, họ đã giam cầm nó trong những sảnh đường bên dưới thành phố của mình, tin rằng nó quá yếu để có thể trỗi dậy một lần nữa.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s đang mang theo _%s_. Rõ ràng là hàng ăn cắp.
actors.buffs.armorevasion.name=Tăng né tránh
actors.mobs.king.defeated=Ngươi không thể giết ta. %s...Tôi... bất tử...
