actors.char.out_of_paralysis=Боль вырваў %s з паралічу
actors.char.you_hit=Вы націснулі %s
actors.char.you_missed=%1$s %2$s ваша атака
actors.mobs.mob.fleeing=%s уцякае
actors.mobs.mob.hunting=%s палюе
actors.mobs.mob.passive=%s пасіўны
actors.mobs.mob.sleeping=%s спіць
actors.mobs.mob.wandering=%s блукае
actors.mobs.elemental.desc=Вандроўныя вогненныя элементалі — пабочны вынік выкліку больш магутных істот. Яны настолькі непрадказальныя, што нават наймацнейшы дэманолаг не здольны імі кіраваць.
actors.mobs.elemental.name=вогненны элементаль
actors.mobs.king.desc=Апошні кароль дворфаў славіўся глыбокімі ведамі пра жыццё і смерць. Ён пераканаў прыдворных узяць удзел у рытуале, які мусіў даць ім вечную маладосць. У выніку яе атрымаў толькі сам кароль — а ў дадатак яшчэ і войска нежыці.
actors.mobs.king.name=кароль дворфаў
actors.mobs.npcs.bee.desc=Нягледзячы на малыя памеры, залатыя пчолы люта абараняюць гаспадара. Праўда, жывуць яны нядоўга.
actors.mobs.npcs.bee.name=залатая пчала
actors.mobs.shielded.desc=Здаравякі — самыя буйныя, моцныя і трывалыя з усіх гнолаў. Цяжка параненыя, яны ўпадаюць у шаленства і наносяць ворагам яшчэ большую шкоду.
actors.mobs.shielded.name=здаравяк са шчытом
actors.mobs.yog.desc=Ёг-Дзева — Старажытны Бог, магутная сутнасць з царства хаосу. Стагоддзе таму старажытныя гномы ледзьве выйгралі вайну супраць яго войска дэманаў, але не змаглі забіць самога бога. Замест гэтага яны зняволілі яго ў залах пад сваім горадам, лічачы, што ён занадта слабы, каб калі-небудзь зноў паўстаць.
actors.mobs.yog.name=Ёг-Дзева
actors.mobs.bandit.carries=%s носіць _%s_. Відавочна, што скрадзены.
actors.buffs.armorevasion.name=Узмоцненае ўхіленне
actors.mobs.king.defeated=Ты не можаш мяне забіць, %s... Я ... бессмяротны ...
