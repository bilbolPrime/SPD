actors.hero.talent.adventurers_intuition.desc=_+1:_ Дуэлянтка вызначае зброю _2,5 раза хутчэй_ і браню _1,75 раза хутчэй_.\n\n_+2:_ Дуэлянтка вызначае зброю _калі яна яе экіпіруе_ і браню _2,5 раза хутчэй_.
actors.hero.talent.adventurers_intuition.title=інтуіцыя шукальніка прыгод
actors.hero.talent.aggressive_barrier.desc=_+1:_ Дуэлянт атрымлівае _3 адзінкі абароны_, калі выкарыстоўвае зброю і мае 50% здароўя або менш.\n\n_+2:_ Дуэлянт атрымлівае _5 адзінак абароны_, калі выкарыстоўвае зброю і мае 50% здароўя або менш.
actors.hero.talent.aggressive_barrier.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага дасць шчыт пры атацы ў блізкім бою з нізкім узроўнем здароўя, з часам аднаўлення 50 хадоў.
actors.hero.talent.aggressive_barrier.title=агрэсіўны бар'ер
actors.hero.talent.ally_warp.desc=_+1:_ Маг можа выбраць саюзніка, каб імгненна памяняцца з ім месцамі, з дыяпазонам _2 пліткі_.\n\n_+2:_ Маг можа выбраць саюзніка, каб імгненна памяняцца з ім месцамі, з дыяпазонам _4 пліткі_.\n\n_+3:_ Маг можа выбраць саюзніка, каб імгненна памяняцца з ім месцамі, з дыяпазонам _6 плітак_.\n\n Маг не можа памяняцца месцамі з нерухомымі саюзнікамі.
actors.hero.talent.ally_warp.title=саюзнік варп
actors.hero.talent.arcane_vision.desc=_+1:_ Калі Маг параніць ворага, ён атрымлівае зрок розуму на _10 хадоў_.\n\n_+2:_ Калі Маг параніць ворага, ён атрымлівае зрок розуму на _15 хадоў_.
actors.hero.talent.arcane_vision.title=таемнае бачанне
actors.hero.talent.assassins_reach.desc=_+1:_ Дыяпазон міргання Забойцы за кожны ўзровень падрыхтоўкі павялічаны да _1/3/4/6 плітак_, раней 1/2/3/4.\n\n_+2:_ Дыяпазон міргання Забойцы за кожны ўзровень падрыхтоўкі павялічаны да _2/4/6/8 плітак_, раней 1/2/3/4.\n\n_+3:_ Дыяпазон міргання Забойцы за кожны ўзровень падрыхтоўкі павялічаны да _2/5/7/10 плітак_, раней 1/2/3/4.\n\nГэта мірганне можа праходзіць скрозь небяспекі і ворагаў, але не праз цвёрдую мясцовасць, такую як сцены.
actors.hero.talent.assassins_reach.title=дасяжнасць забойцы
actors.hero.talent.aura_of_protection.desc=_+1:_ Паладзін можа выкарыстоўваць _Ауру абароны_, загавор, які дае Паладзіну і ўсім саюзнікам у межах 2 клетак _20% устойлівасці да пашкоджанняў_ і эфект гліфа даспехаў Паладзіна _+50% магутнасці_ на працягу 20 хадоў, коштам 2 зарадаў.\n\n_+2:_ Паладзін можа выкарыстоўваць _Ауру абароны_, загавор, які дае Паладзіну і ўсім саюзнікам у межах 2 клетак _30% устойлівасці да пашкоджанняў_ і эфект гліфа даспехаў Паладзіна _+75% магутнасці_ на працягу 20 хадоў, коштам 2 зарадаў.\n\n_+3:_ Паладзін можа выкарыстоўваць _Ауру абароны_, загавор, які дае Паладзіну і ўсім саюзнікам у межах 2 клетак _40% устойлівасці да пашкоджанняў_ і эфект гліфа даспехаў Паладзіна _+100% магутнасці_ на працягу 20 хадоў, коштам 2 зарадаў.
actors.hero.talent.aura_of_protection.title=аўра абароны
actors.hero.talent.backup_barrier.desc=_+1:_ Маг атрымлівае _3 адзінкі абароны_ кожны раз, калі ён траціць апошні зарад свайго посаха.\n\n_+2:_ Маг атрымлівае _5 адзінак абароны_ кожны раз, калі ён траціць апошні зарад свайго посаха.
actors.hero.talent.backup_barrier.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён будзе актывавацца з дапамогай палачкі найвышэйшага ўзроўню героя.
actors.hero.talent.backup_barrier.title=рэзервовы бар'ер
actors.hero.talent.barkskin.desc=_+1:_ Калі яна ступае па траве, Вартаўнік атрымлівае _0-50% свайго ўзроўню_ у даспехах з кары, якія знікаюць кожны ход.\n\n_+2:_ Калі яна ступае па траве, Вартаўнік атрымлівае _0-100% свайго ўзроўню_ у даспехах з кары, якія знікаюць кожны ход.\n\n_+3:_ Калі яна ступае па траве, Вартаўнік атрымлівае _0-150% свайго ўзроўню_ у даспехах з кары, якія знікаюць кожны ход.
actors.hero.talent.barkskin.title=каровая скура
actors.hero.talent.beaming_ray.desc=Клярык можа выкарыстоўваць _Прамень_ з узмоцненага саюзніка за 1 зарад. Гэты прамень можа праходзіць скрозь сцены і тэлепартаваць саюзніка ў вызначанае месца. Калі ў гэтым месцы знаходзіцца вораг, саюзнік з'яўляецца побач з ворагам і нацэльваецца на яго. Прамень-прамень можа нават тэлепартавацца звычайна нерухомых саюзнікаў, але пры гэтым мае палову радыусу дзеяння.\n\n_+1:_ Прамень-прамень мае максімальную далёкасць дзеяння _4 пліткі,_ і павялічвае бонус «Моцы многіх» да _+35% шкоды_ супраць бліжэйшага ворага на 10 хадоў.\n\n_+2:_ Прамень-прамень мае максімальную далёкасць дзеяння _8 плітак,_ і павялічвае бонус «Моцы многіх» да _+40% шкоды_ супраць бліжэйшага ворага на 10 хадоў.\n\n_+3:_ Прамень-прамень мае максімальную далёкасць дзеяння _12 плітак,_ і павялічвае бонус «Моцы многіх» да _+45% шкоды_ супраць бліжэйшага ворага на 10 хадоў.\n\n_+4:_ Прамень-прамень мае максімальную далёкасць дзеяння _16 плітак,_ і павялічвае Бонус ад «Моцы многіх» да _+50% шкоды_ супраць бліжэйшага ворага на працягу 10 хадоў.
actors.hero.talent.beaming_ray.title=прамянёвы прамень
actors.hero.talent.blast_radius.desc=_+1:_ Радыус элементарнага выбуху павялічаны да _5 плітак_, раней 4.\n\n_+2:_ Радыус элементарнага выбуху павялічаны да _6 плітак_, раней 4.\n\n_+3:_ Радыус элементарнага выбуху павялічаны да _7 плітак_, раней 4.\n\n_+4:_ Радыус элементарнага выбуху павялічаны да _8 плітак_, раней 4.
actors.hero.talent.blast_radius.title=радыус выбуху
actors.hero.talent.bless.desc=_+1:_ Клірык можа выкарыстоўваць _Дабраславеньне_, загавор, які дае _6 хадоў дабраславеньня і 10 адзінак абароны_ пры накладанні на сябе або _10 хадоў дабраславеньня і 10 адзінак лячэння_ пры накладанні на іншага персанажа, коштам 1 зарада.\n\n_+2:_ Клірык можа выкарыстоўваць _Дабраславеньне_, загавор, які дае _10 хадоў дабраславеньня і 15 адзінак абароны_ пры накладанні на сябе або _15 хадоў дабраславеньня і 15 адзінак лячэння_ пры накладанні на іншага персанажа, коштам 1 зарада.\n\nЛішняе лячэнне ад гэтага загавору пераўтвараецца ў абароны.
actors.hero.talent.bless.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага павялічыць дакладнасць і ўхіленне для героя і ўсіх саюзнікаў на 3% пры +1 або на 5% пры +2.
actors.hero.talent.bless.title=дабраслаўляць
actors.hero.talent.body_form.desc=Клірык можа выкарыстоўваць _Форму цела_, якая напаўняе Тройцу сілай чараў або гліфа, якія Клірык вызначыў у гэтым праходзе, за 2 зарады.\n\n_+1:_ Пры выкарыстанні Тройцы Клірык атрымлівае абраны эфект на _20 хадоў._\n\n_+2:_ Пры выкарыстанні Тройцы Клірык атрымлівае абраны эфект на _27 хадоў._\n\n_+3:_ Пры выкарыстанні Тройцы Клірык атрымлівае абраны эфект на _33 хады._\n\n_+4:_ Пры выкарыстанні Тройцы Клірык атрымлівае абраны эфект на _40 хадоў._\n\nТройцу можна напоўніць толькі адным эфектам цела адначасова. Кошт зарадкі даспехаў Трыніці вышэйшы, калі абраны гліф рэдкі і магутны.
actors.hero.talent.body_form.title=форма цела
actors.hero.talent.body_replacement.desc=_+1:_ Пасля міргання Разбойнік пакідае драўляную прынаду, якая мае _20 здароўя і 1-3 адзінкі броні_.\n\n_+2:_ Пасля міргання Разбойнік пакідае драўляную прынаду, якая мае _40 здароўя і 2-6 адзінак броні_.\n\n_+3:_ Пасля міргання Разбойнік пакідае драўляную прынаду, якая мае _60 здароўя і 3-9 адзінак броні_.\n\n_+4:_ Пасля міргання Разбойнік пакідае драўляную прынаду, якая мае _80 здароўя і 4-12 адзінак броні_.\n\nАктыўнай можа быць толькі адна прынада.
actors.hero.talent.body_replacement.title=замена цела
actors.hero.talent.body_slam.desc=_+1:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі атрымліваюць пашкоджанні, роўныя _1-4 плюс 25%_ ад яго сілы блакавання пашкоджанняў.\n\n_+2:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі атрымліваюць пашкоджанні, роўныя _2-8 плюс 50%_ ад яго сілы блакавання пашкоджанняў.\n\n_+3:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі атрымліваюць пашкоджанні, роўныя _3-12 плюс 75%_ ад яго сілы блакавання пашкоджанняў.\n\n_+4:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі атрымліваюць пашкоджанні, роўныя _4-16 плюс 100%_ ад яго сілы блакавання пашкоджанняў.
actors.hero.talent.body_slam.title=бодзіслэм
actors.hero.talent.bounty_hunter.desc=_+1:_ Калі Забойца забівае ворага падрыхтаваным ударам, яго шанец выпадзення прадмета павялічваецца на _2/4/8/16%_, за кожны ўзровень падрыхтоўкі.\n\n_+2:_ Калі Забойца забівае ворага падрыхтаваным ударам, яго шанец выпадзення прадмета павялічваецца на _4/8/16/32%_, за кожны ўзровень падрыхтоўкі.\n\n_+3:_ Калі Забойца забівае ворага падрыхтаваным ударам, яго шанец выпадзення прадмета павялічваецца на _6/12/24/48%_, за кожны ўзровень падрыхтоўкі.
actors.hero.talent.bounty_hunter.title=паляўнічы за галовамі
actors.hero.talent.cached_rations.desc=_+1:_ Разбойнік можа знайсці _2 пайкі прыпасаў_, размешчаныя ў скрынях, пакуль ён даследуе наступныя некалькі паверхаў падзямелля.\n\n_+2:_ Разбойнік можа знайсці _3 пайкі прыпасаў_, размешчаныя ў скрынях, пакуль ён даследуе наступныя некалькі паверхаў падзямелля.\n\nПайкі прыпасаў хутка з'ядаюцца, аднаўляюць умераную колькасць сытасці, лечаць 5 адзінак здароўя і аднаўляюць 1 зарад плашча ценяў.
actors.hero.talent.cached_rations.title=кешаваныя пайкі
actors.hero.talent.cleanse.desc=_+1:_ Клірык можа выкарыстоўваць _Ачышчэнне_, загавор, які _здымае негатыўныя эфекты статусу_ з Клірыка і любых бліжэйшых саюзнікаў і дае ім _10 адзінак абароны_ коштам 2 зарадаў.\n\n_+2:_ Клірык можа выкарыстоўваць _Ачышчэнне_, загавор, які _дае 3 хады імунітэту да адмоўнага статусу_ Клірыку і любым бліжэйшым саюзнікам і дае ім _20 адзінак абароны_ коштам 2 зарадаў.\n\n_+3:_ Клірык можа выкарыстоўваць _Ачышчэнне_, загавор, які _дае 5 хадоў імунітэту да адмоўнага статусу_ Клірыку і любым бліжэйшым саюзнікам і дае ім _30 адзінак абароны_ коштам 2 зарадаў.
actors.hero.talent.cleanse.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага ачышчае адмоўныя эфекты статусу на героі пасля выкарыстання палачкі або артэфакта ў 10/20/30% выпадкаў з +1/+2/+3.
actors.hero.talent.cleanse.title=ачысціць
actors.hero.talent.cleave.desc=_+1:_ Дадатковы час, які Гладыятар атрымлівае на забойства, павялічаны да _30 хадоў_, замест 15.\n\n_+2:_ Дадатковы час, які Гладыятар атрымлівае на забойства, павялічаны да _45 хадоў_, замест 15.\n\n_+3:_ Дадатковы час, які Гладыятар атрымлівае на забойства, павялічаны да _60 хадоў_, замест 15.
actors.hero.talent.cleave.title=расшчапляць
actors.hero.talent.cloned_armor.desc=_+1:_ Ценявы клон атрымлівае _12%_ ад значэння даспехаў героя і мае _25% шанец_ выкарыстаць гліф на даспехах героя.\n\n_+2:_ Ценявы клон атрымлівае _24%_ ад значэння даспехаў героя і мае _50% шанец_ выкарыстаць гліф на даспехах героя.\n\n_+3:_ Ценявы клон атрымлівае _36%_ ад значэння даспехаў героя і мае _75% шанец_ выкарыстаць гліф на даспехах героя.\n\n_+4:_ Ценявы клон атрымлівае _48%_ ад значэння даспехаў героя і мае _100% шанец_ выкарыстаць гліф на даспехах героя.
actors.hero.talent.cloned_armor.title=кланіраваная браня
actors.hero.talent.close_the_gap.desc=_+1:_ Дуэлянт міргае _да двух плітак_ у бок сваёй мэты, пачынаючы дуэль.\n\n_+2:_ Дуэлянт міргае _да трох плітак_ у бок сваёй мэты, пачынаючы дуэль.\n\n_+3:_ Дуэлянт міргае _да чатырох плітак_ у бок сваёй мэты, пачынаючы дуэль.\n\n_+4:_ Дуэлянт міргае _да пяці плітак_ у бок сваёй мэты, пачынаючы дуэль.\n\nГэта мірганне ўлічваецца пры вызначэнні таго, ці знаходзіцца вораг у зоне дасяжнасці для выкліку.
actors.hero.talent.close_the_gap.title=скараціць разрыў
actors.hero.talent.combined_energy.desc=_+1:_ Калі манах выкарыстоўвае здольнасць зброі і здольнасць з энергіяй _4+_ на працягу 5 хадоў адна ад адной, ён аднаўляе 1 выдаткаваную энергію.\n\n_+2:_ Калі манах выкарыстоўвае здольнасць зброі і здольнасць з энергіяй _3+_ на працягу 5 хадоў адна ад адной, ён аднаўляе 1 выдаткаваную энергію.\n\n_+3:_ Калі манах выкарыстоўвае здольнасць зброі і здольнасць з энергіяй _2+_ на працягу 5 хадоў адна ад адной, ён аднаўляе 1 выдаткаваную энергію.
actors.hero.talent.combined_energy.title=камбінаваная энергія
actors.hero.talent.combined_lethality.desc=_+1:_ Калі Чэмпіён атакуе зброяй блізкага бою адразу пасля выкарыстання здольнасці іншай зброі, гэтая атака пакарае смерцю любога ворага, які не з'яўляецца босам, у якога застаўся _ніжэй за 13% здароўя_.\n\n_+2:_ Калі Чэмпіён атакуе зброяй блізкага бою адразу пасля выкарыстання здольнасці іншай зброі, гэтая атака пакарае смерцю любога ворага, які не з'яўляецца босам, у якога застаўся _ніжэй за 27% здароўя_.\n\n_+3:_ Калі Чэмпіён атакуе зброяй блізкага бою адразу пасля выкарыстання здольнасці іншай зброі, гэтая атака пакарае смерцю любога ворага, які не з'яўляецца босам, у якога застаўся _ніжэй за 40% здароўя_.\n\nГэтая атака можа быць звычайнай атакай зброяй блізкага бою або часткай здольнасці зброі.
actors.hero.talent.combined_lethality.title=камбінаваная смяротнасць
actors.hero.talent.conserved_magic.desc=_+1:_ Кожны ўдар дзікай магіі цяпер выкарыстоўвае _0,33 зарадаў_ замест 0,5, і дзікая магія мае _25% шанец_ не выдаткаваць ход.\n\n_+2:_ Кожны ўдар дзікай магіі цяпер выкарыстоўвае _0,225 зарадаў_ замест 0,5, і дзікая магія мае _50% шанец_ не выдаткаваць ход.\n\n_+3:_ Кожны ўдар дзікай магіі цяпер выкарыстоўвае _0,15 зарадаў_ замест 0,5, і дзікая магія мае _75% шанец_ не выдаткаваць ход.\n\n_+4:_ Кожны ўдар дзікай магіі цяпер выкарыстоўвае _0,1 зарадаў_ замест 0,5, і дзікая магія мае _100% шанец_ не выдаткаваць ход.
actors.hero.talent.conserved_magic.title=захаваная магія
actors.hero.talent.counter_ability.desc=_+1:_ Калі Дуэлянт выкарыстае здольнасць зброі на працягу 3 хадоў пасля атакі па яго рэшткавым вобразе, ён імгненна аднавіць _0,38 зарадаў_.\n\n_+2:_ Калі Дуэлянт выкарыстае здольнасць зброі на працягу 3 хадоў пасля атакі па яго рэшткавым вобразе, ён імгненна аднавіць _0,77 зарадаў_.\n\n_+3:_ Калі Дуэлянт выкарыстае здольнасць зброі на працягу 3 хадоў пасля атакі па яго рэшткавым вобразе, ён імгненна аднавіць _1,13 зарадаў_.\n\n_+4:_ Калі Дуэлянт выкарыстае здольнасць зброі на працягу 3 хадоў пасля атакі па яго рэшткавым вобразе, ён імгненна аднавіць _1,5 зарадаў_.
actors.hero.talent.counter_ability.title=здольнасць супрацьстаяць
actors.hero.talent.deadly_followup.desc=_+1:_ Калі Дуэлянт б'е па ворагу кідальнай зброяй, яна наносіць яму на _10% больш шкоды ў блізкім бою_ на працягу 5 хадоў.\n\n_+2:_ Калі Дуэлянт б'е па ворагу кідальнай зброяй, яна наносіць яму на _20% больш шкоды ў блізкім бою_ на працягу 5 хадоў.\n\n_+3:_ Калі Дуэлянт б'е па ворагу кідальнай зброяй, яна наносіць яму на _30% больш шкоды ў блізкім бою_ на працягу 5 хадоў.
actors.hero.talent.deadly_followup.title=смяротнае наступства
actors.hero.talent.deathless_fury.desc=_+1:_ Берсерк аўтаматычна спрацоўвае, калі Берсерк вось-вось памрэ, а лютасць складае 100% або вышэй, але час аднаўлення складае _3 узроўні героя_.\n\n_+2:_ Берсерк аўтаматычна спрацоўвае, калі Берсерк вось-вось памрэ, а лютасць складае 100% або вышэй, але час аднаўлення складае _2 узроўні героя_.\n\n_+3:_ Берсерк аўтаматычна спрацоўвае, калі Берсерк вось-вось памрэ, а лютасць складае 100%, але час аднаўлення складае _1 узровень героя_.\n\nЗвярніце ўвагу, што Берсерк усё роўна памрэ, калі ў яго 0 адзінак здароўя пасля заканчэння берсеркавання.
actors.hero.talent.deathless_fury.title=несмяротная лютасць
actors.hero.talent.deathly_durability.desc=_+1:_ Ворагі, забітыя меткай смерці, даюць абарону Разбойніку, роўны _13%_ іх здароўя, калі яны былі пазначаны.\n\n_+2:_ Ворагі, забітыя меткай смерці, даюць абарону Разбойніку, роўны _25%_ іх здароўя, калі яны былі пазначаны.\n\n_+3:_ Ворагі, забітыя меткай смерці, даюць абарону Разбойніку, роўны _38%_ іх здароўя, калі яны былі пазначаны.\n\n_+4:_ Ворагі, забітыя меткай смерці, даюць абарону Разбойніку, роўны _50%_ іх здароўя, калі яны былі пазначаны.
actors.hero.talent.deathly_durability.title=смяротная трываласць
actors.hero.talent.desperate_power.desc=_+1:_ Палачкі і персанал мага атрымліваюць _+1 узровень_ пры апошнім удары, калі ў іх застаўся апошні зарад.\n\n_+2:_ Палачкі і персанал мага атрымліваюць _+2 узроўні_ пры апошнім удары, калі ў іх застаўся апошні зарад.\n\n_+3:_ Палачкі і персанал мага атрымліваюць _+3 узроўні_ пры апошнім удары, калі ў іх застаўся апошні зарад.
actors.hero.talent.desperate_power.title=адчайная сіла
actors.hero.talent.directed_power.desc=_+1:_ Прамая атака ад элементарнага ўдару атрымлівае _+30% сілы зачаравання_ за кожнага ворага ў радыусе дзеяння эфекту элементарнага ўдару, уключаючы цэль атакі.\n\n_+2:_ Прамая атака ад элементарнага ўдару атрымлівае _+60% сілы зачаравання_ за кожнага ворага ў радыусе дзеяння эфекту элементарнага ўдару, уключаючы цэль атакі.\n\n_+3:_ Прамая атака ад элементарнага ўдару атрымлівае _+90% сілы зачаравання_ за кожнага ворага ў радыусе дзеяння эфекту элементарнага ўдару, уключаючы цэль атакі.\n\n_+4:_ Прамая атака ад элементарнага ўдару атрымлівае _+120% сілы зачаравання_ за кожнага ворага ў радыусе дзеяння эфекту элементарнага ўдару, уключаючы цэль атакі.
actors.hero.talent.directed_power.title=накіраваная магутнасць
actors.hero.talent.divine_intervention.desc=_+1:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Боскае ўмяшанне_, якое ўзмацняе абарону Клірыка і ўсіх саюзнікаў да _150_ і падаўжае Узнёслую форму на _3 хады._\n\n_+2:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Боскае ўмяшанне_, якое ўзмацняе абарону Клірыка і ўсіх саюзнікаў да _200_ і падаўжае Узнёслую форму на _4 хады._\n\n_+3:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Боскае ўмяшанне_, якое ўзмацняе абарону Клірыка і ўсіх саюзнікаў да _250_ і падаўжае Узнёслую форму на _5 хадоў._\n\n_+4:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Боскае ўмяшанне_, які ўзмацняе абарону клірыка і ўсіх саюзнікаў да _300_ і падаўжае Узнёслую форму на _6 хадоў._\n\n«Божае ўмяшанне» каштуе цэлых 5 зарадаў тома і можа быць выкарыстана толькі адзін раз у адной і той жа ўзнёслай форме.
actors.hero.talent.divine_intervention.title=боскае ўмяшанне
actors.hero.talent.divine_sense.desc=_+1:_ Клірык можа выкарыстоўваць _Боскае пачуццё_, загавор, які дае яму _8 плітак_ Розумовага зроку на 50 хадоў і не патрабуе часу, за 2 зарады.\n\n_+2:_ Клірык можа выкарыстоўваць _Боскае пачуццё_, загавор, які дае яму _12 плітак_ Розумовага зроку на 50 хадоў і не патрабуе часу, за 2 зарады.
actors.hero.talent.divine_sense.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага дасць яму магчымасць на кароткі час бачыць розум пасля выкарыстання палачкі або артэфакта з радыусам дзеяння 3 клеткі пры +1 або 5 клетак пры +2.
actors.hero.talent.divine_sense.title=боскае пачуццё
actors.hero.talent.double_jump.desc=_+1:_ Калі Воін выконвае другі скачок на працягу 3 хадоў, кошт зарадкі гэтага скачка зніжаецца на _16%.\n\n_+2:_ Калі Воін выконвае другі скачок на працягу 3 хадоў, кошт зарадкі гэтага скачка зніжаецца на _30%.\n\n_+3:_ Калі Воін выконвае другі скачок на працягу 3 хадоў, кошт зарадкі гэтага скачка зніжаецца на _40%.\n\n_+4:_ Калі Воін выконвае другі скачок на працягу 3 хадоў, кошт зарадкі гэтага скачка зніжаецца на _50%.
actors.hero.talent.double_jump.title=падвойны скачок
actors.hero.talent.double_mark.desc=_+1:_ Адначасовая пазнака другой цэлі з першай мае _30% зніжаны_ кошт зарадкі.\n\n_+2:_ Адначасовая пазнака другой цэлі з першай мае _50% зніжаны_ кошт зарадкі.\n\n_+3:_ Адначасовая пазнака другой цэлі з першай мае _65% зніжаны_ кошт зарадкі.\n\n_+4:_ Адначасовая пазнака другой цэлі з першай мае _75% зніжаны_ кошт зарадкі.
actors.hero.talent.double_mark.title=падвойная адзнака
actors.hero.talent.durable_projectiles.desc=_+1:_ Кідальная зброя мае _+50% трываласці_ пры выкарыстанні Паляўнічай.\n\n_+2:_ Кідальная зброя мае _+75% трываласці_ пры выкарыстанні Паляўнічай.
actors.hero.talent.durable_projectiles.title=трывалыя снарады
actors.hero.talent.durable_tips.desc=_+1:_ Дроцікі з наканечнікам маюць _2-кратную трываласць_, калі іх выкарыстоўвае Вартаўнік.\n\n_+2:_ Дроцікі з наканечнікам маюць _3-кратную трываласць_, калі іх выкарыстоўвае Вартаўнік.\n\n_+3:_ Дроцікі з наканечнікам маюць _4-кратную трываласць_, калі іх выкарыстоўвае Вартаўнік.
actors.hero.talent.durable_tips.title=трывалыя парады
actors.hero.talent.eagle_eye.desc=_+1:_ Далёкасць зроку духоўнага ястраба павялічана з 6 да _7 плітак_.\n\n_+2:_ Далёкасць зроку духоўнага ястраба павялічана з 6 да _8 плітак_.\n\n_+3:_ Далёкасць зроку духоўнага ястраба павялічана з 6 да _9 плітак_, і ён атрымлівае _2 пліткі_ зроку розуму.\n\n_+4:_ Далёкасць зроку духоўнага ястраба павялічана з 6 да _10 плітак_, і ён атрымлівае _3 пліткі_ зроку розуму.
actors.hero.talent.eagle_eye.title=арлінае вока
actors.hero.talent.elemental_power.desc=_+1:_ Магутнасць элементарнага выбуху павялічваецца на _25%_.\n\n_+2:_ Магутнасць элементарнага выбуху павялічваецца на _50%_.\n\n_+3:_ Магутнасць элементарнага выбуху павялічваецца на _75%_.\n\n_+4:_ Магутнасць элементарнага выбуху павялічваецца на _100%_.
actors.hero.talent.elemental_power.title=элементарная сіла
actors.hero.talent.elemental_reach.desc=_+1:_ Далёкасць стыхійнага ўдару павялічана з 4 да _5 плітак_, а яго шырыня павялічана з 65 да _75 градусаў_.\n\n_+2:_ Далёкасць стыхійнага ўдару павялічана з 4 да _6 плітак_, а яго шырыня павялічана з 65 да _85 градусаў_.\n\n_+3:_ Далёкасць стыхійнага ўдару павялічана з 4 да _7 плітак_, а яго шырыня павялічана з 65 да _95 градусаў_.\n\n_+4:_ Далёкасць стыхійнага ўдару павялічана з 4 да _8 плітак_, а яго шырыня павялічана з 65 да _105 градусаў_.
actors.hero.talent.elemental_reach.title=элементарны ахоп
actors.hero.talent.elimination_match.desc=_+1:_ Калі Дуэлянт зноў кідае выклік на працягу 3 хадоў пасля заканчэння дуэлі, кошт зарадкі гэтага выкліку зніжаецца на _16%.\n\n_+2:_ Калі Дуэлянт зноў кідае выклік на працягу 3 хадоў пасля заканчэння дуэлі, кошт зарадкі гэтага выкліку зніжаецца на _30%.\n\n_+3:_ Калі Дуэлянт зноў кідае выклік на працягу 3 хадоў пасля заканчэння дуэлі, кошт зарадкі гэтага выкліку зніжаецца на _40%.\n\n_+4:_ Калі Дуэлянт зноў кідае выклік на працягу 3 хадоў пасля заканчэння дуэлі, кошт зарадкі гэтага выкліку зніжаецца на _50%.
actors.hero.talent.elimination_match.title=матч на выбыванне
actors.hero.talent.empowered_strike.desc=_+1:_ Першы ўдар баявога мага ў блізкім бою ягоным посахам пасля ўдару ім наносіць _+16% шкоды_, а бонусны эфект посаха атрымлівае _+50% сілы_.\n\n_+2:_ Першы ўдар баявога мага ў блізкім бою ягоным посахам пасля ўдару ім наносіць _+33% шкоды_, а бонусны эфект посаха атрымлівае _+100% сілы_.\n\n_+3:_ Першы ўдар баявога мага ў блізкім бою ягоным посахам пасля ўдару ім наносіць _+50% шкоды_, а бонусны эфект посаха атрымлівае _+150% сілы_.
actors.hero.talent.empowered_strike.title=упаўнаважаная забастоўка
actors.hero.talent.empowering_meal.desc=_+1:_ Ужыванне ежы дае Магу _2 бонусныя ўроны_ пры наступных 3 уздзеяннях палачкі.\n\n_+2:_ Ужыванне ежы дае Магу _3 бонусныя ўроны_ пры наступных 3 уздзеяннях палачкі.
actors.hero.talent.empowering_meal.title=натхняльная страва
actors.hero.talent.endless_rage.desc=_+1:_ Берсеркер можа дасягнуць максімум _116% лютасці_.\n\n_+2:_ Берсеркер можа дасягнуць максімум _133% лютасці_.\n\n_+3:_ Берсеркер можа дасягнуць максімум _150% лютасці_.\n\nКожны пункт лютасці вышэй за 100% павялічвае абарону берсерка на 1% і скарачае час аднаўлення на 1%, але не павялічвае бонус да шкоды больш чым на +50%.
actors.hero.talent.endless_rage.title=бясконцая лютасць
actors.hero.talent.energizing_meal.desc=_+1:_ Ужыванне ежы займае першы ход Мага і дае яму _5 хадоў перазарадкі палачкі_.\n\n_+2:_ Ужыванне ежы займае першы ход Мага і дае яму _8 хадоў перазарадкі палачкі_.
actors.hero.talent.energizing_meal.title=энергічная страва
actors.hero.talent.enhanced_combo.desc=_+1:_ Калі камбінацыя Гладыятара роўная 7 або вышэй, радыус адкідання Клобера павялічваецца да 3, ён выклікае галавакружэнне і можа збіваць ворагаў у ямы.\n\n_+2:_ Акрамя пераваг +1, калі камбінацыя Гладыятара роўная 9 або вышэй, адбіванне працуе на некалькі атак.\n\n_+3:_ Акрамя пераваг +1 і +2, Гладыятар можа падскочыць да камбінацыі/3 клетак пры выкарыстанні Удару, Раздушвання або Лютасці.
actors.hero.talent.enhanced_combo.title=палепшанае спалучэнне
actors.hero.talent.enhanced_lethality.desc=_+1:_ Забойца можа забіваць ворагаў, у якіх застаўся менш за _4/13/27/67% здароўя_ за кожны ўзровень падрыхтоўкі, у параўнанні з 3/10/20/50%.\n\n_+2:_ Забойца можа забіваць ворагаў, у якіх застаўся менш за _5/17/33/83% здароўя_ за кожны ўзровень падрыхтоўкі, у параўнанні з 3/10/20/50%.\n\n_+3:_ Забойца можа забіваць ворагаў, у якіх застаўся менш за _6/20/40/100% здароўя_ за кожны ўзровень падрыхтоўкі, у параўнанні з 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=павышаная смяротнасць
actors.hero.talent.enhanced_rings.desc=_+1:_ Калі Разбойнік выкарыстоўвае артэфакт, яго пярсцёнкі атрымліваюць +1 паляпшэнне на _3 хады_.\n\n_+2:_ Калі Разбойнік выкарыстоўвае артэфакт, яго пярсцёнкі атрымліваюць +1 паляпшэнне на _6 хадоў_.\n\n_+3:_ Калі Разбойнік выкарыстоўвае артэфакт, яго пярсцёнкі атрымліваюць +1 паляпшэнне на _9 хадоў_.
actors.hero.talent.enhanced_rings.title=палепшаныя кольцы
actors.hero.talent.enlightening_meal.desc=_+1:_ Ужыванне ежы займае ў Клірыка 1 ход і дае яму _0,67 зарадаў_ на яго святы том.\n\n_+2:_ Ужыванне ежы займае ў Клірыка 1 ход і дае яму _1 зарад_ на яго святы том.
actors.hero.talent.enlightening_meal.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён дасць 2 хады перазарадкі палачкі і артэфакта пры +1 або 3 хады пры +2. Гэта нельга выкарыстоўваць для таго, каб рог багацця самастойна перазараджваўся.
actors.hero.talent.enlightening_meal.title=Пазнавальная ежа
actors.hero.talent.enraged_catalyst.desc=_+1:_ Чары і праклёны на зброі Берсерка спрацоўваюць часцей, чым большая ў яго лютасць, максімум на _15% часцей_ пры 100% лютасці.\n\n_+2:_ Чары і праклёны на зброі Берсерка спрацоўваюць часцей, чым большая ў яго лютасць, максімум на _30% часцей_ пры 100% лютасці.\n\n_+3:_ Чары і праклёны на зброі Берсерка спрацоўваюць часцей, чым большая ў яго лютасць, максімум на _45% часцей_ пры 100% лютасці.
actors.hero.talent.enraged_catalyst.title=раз'юшаны каталізатар
actors.hero.talent.evasive_armor.desc=_+1:_ Падчас фрырану фрыраннер атрымлівае дадатковы _+1 ухіленне_ за кожны лішак сілы на сваёй брані. \n\n_+2:_ Падчас фрырану фрыраннер атрымлівае дадаткова _+2 ухілення_ за лішак сілы на сваёй брані. \n\n_+3:_ Падчас фрырану пры фрыране, Фрыраннер атрымлівае дадаткова _+3 ухілення_ за кожны лішак сілы на сваёй брані.
actors.hero.talent.evasive_armor.title=абарончая браня
actors.hero.talent.even_the_odds.desc=_+1:_ Воін наносіць дадатковую _5% бонуснай шкоды_ за кожнага ворага ў межах 2 клетак, калі заканчваецца трыванне.\n\n_+2:_ Воін наносіць дадатковую _10% бонуснай шкоды_ за кожнага ворага ў межах 2 клетак, калі заканчваецца трыванне.\n\n_+3:_ Воін наносіць дадатковую _15% бонуснай шкоды_ за кожнага ворага ў межах 2 клетак, калі заканчваецца трыванне.\n\n_+4:_ Воін наносіць дадатковую _20% бонуснай шкоды_ за кожнага ворага ў межах 2 клетак, калі заканчваецца трыванне.
actors.hero.talent.even_the_odds.title=нават шанцы
actors.hero.talent.excess_charge.desc=_+1:_ Калі посах Баявога Мага цалкам зараджаны, яго наступны ўдар дасць яму _0,67 экранавання_ за кожны ўзровень посаха.\n\n_+2:_ Калі посах Баявога Мага цалкам зараджаны, яго наступны ўдар дасць яму _1,33 экранавання_ за кожны ўзровень посаха.\n\n_+3:_ Калі посах Баявога Мага цалкам зараджаны, яго наступны ўдар дасць яму _2 экранавання_ за кожны ўзровень посаха.
actors.hero.talent.excess_charge.title=лішняя плата
actors.hero.talent.expanding_wave.desc=_+1:_ Далёкасць дзеяння Шоквейва павялічана з 5 да _6 плітак_, а яго шырыня павялічана з 60 да _75 градусаў_.\n\n_+2:_ Далёкасць дзеяння Шоквейва павялічана з 5 да _7 плітак_, а яго шырыня павялічана з 60 да _90 градусаў_.\n\n_+3:_ Далёкасць дзеяння Шоквейва павялічана з 5 да _8 плітак_, а яго шырыня павялічана з 60 да _105 градусаў_.\n\n_+4:_ Далёкасць дзеяння Шоквейва павялічана з 5 да _9 плітак_, а яго шырыня павялічана з 60 да _120 градусаў_.
actors.hero.talent.expanding_wave.title=пашыральная хваля
actors.hero.talent.expose_weakness.desc=_+1:_ Ворагі, якія атакуюць рэшткавы вобраз Дуэлянта, становяцца слабымі і ўразлівымі на _2 хады_.\n\n_+2:_ Ворагі, якія атакуюць рэшткавы вобраз Дуэлянта, становяцца слабымі і ўразлівымі на _4 хады_.\n\n_+3:_ Ворагі, якія атакуюць рэшткавы вобраз Дуэлянта, становяцца слабымі і ўразлівымі на _6 хадоў_.\n\n_+4:_ Ворагі, якія атакуюць рэшткавы вобраз Дуэлянта, становяцца слабымі і ўразлівымі на _8 хадоў_.
actors.hero.talent.expose_weakness.title=выкрыць слабасць
actors.hero.talent.fan_of_blades.desc=_+1:_ Спектральныя ляза могуць паражаць да _1 дадатковай цэлі_, наносячы 50% шкоды. Мэта павінна быць бачная і знаходзіцца ў межах _30-градуснага_ конусу AOE.\n\n_+2:_ Спектральныя ляза могуць паражаць да _2 дадатковых цэляў_, наносячы 50% шкоды. Мэты павінны быць бачныя і знаходзіцца ў межах _60-градуснага_ конусу AOE.\n\n_+3:_ Спектральныя ляза могуць паражаць да _3 дадатковых цэляў_, наносячы 50% шкоды. Мэты павінны быць бачныя і знаходзіцца ў межах _90-градуснага_ конусу AOE.\n\n_+4:_ Спектральныя ляза могуць паражаць да _4 дадатковых цэляў_, наносячы 50% шкоды. Мэты павінны быць бачныя і знаходзіцца ў межах _120-градуснага_ конусу AOE.
actors.hero.talent.fan_of_blades.title=вентылятар лапатак
actors.hero.talent.farsight.desc=_+1:_ Далёкасць зроку снайпера _павялічана на 25%_.\n\n_+2:_ Далёкасць зроку снайпера _павялічана на 50%_.\n\n_+3:_ Далёкасць зроку снайпера _павялічана на 75%_.
actors.hero.talent.farsight.title=дальназоркасць
actors.hero.talent.fear_the_reaper.desc=_+1:_ Калі вораг з пазнакай смерці дасягае 0 здароўя, ён становіцца _калекай_.\n\n_+2:_ Калі вораг з пазнакай смерці дасягае 0 здароўя, ён становіцца _страшным і калекай_.\n\n_+3:_ Калі вораг з пазнакай смерці дасягае 0 здароўя, ён становіцца _страшным і калекай_, а ворагі ў межах 3 клетак становяцца _калекамі_.\n\n_+4:_ Калі вораг з пазнакай смерці дасягае 0 здароўя, ён становіцца _страшным і калекай_, а ворагі ў межах 3 клетак становяцца _страшнымі і калекамі_.
actors.hero.talent.fear_the_reaper.title=бойся жняца
actors.hero.talent.feigned_retreat.desc=_+1:_ Калі вораг атакуе рэшткавы вобраз Дуэлянта, ён атрымлівае _2 хады_ паспешнасці.\n\n_+2:_ Калі вораг атакуе рэшткавы вобраз Дуэлянта, ён атрымлівае _4 хады_ паспешнасці.\n\n_+3:_ Калі вораг атакуе рэшткавы вобраз Дуэлянта, ён атрымлівае _6 хадоў_ паспешнасці.\n\n_+4:_ Калі вораг атакуе рэшткавы вобраз Дуэлянта, ён атрымлівае _8 хадоў_ паспешнасці.
actors.hero.talent.feigned_retreat.title=удаванае адступленне
actors.hero.talent.fire_everything.desc=_+1:_ Дзікая магія цяпер спрацоўвае _5 разоў_ павялічана замест 4, і кожная палачка мае _25% шанец_ быць выкарыстанай 3 разы.\n\n_+2:_ Дзікая магія цяпер спрацоўвае _6 разоў_ павялічана замест 4, і кожная палачка мае _50% шанец_ быць выкарыстанай 3 разы.\n\n_+3:_ Дзікая магія цяпер спрацоўвае _7 разоў_ павялічана замест 4, і кожная палачка мае _75% шанец_ быць выкарыстанай 3 разы.\n\n_+4:_ Дзікая магія цяпер спрацоўвае _8 разоў_ павялічана замест 4, і кожная палачка мае _100% шанец_ быць выкарыстанай 3 разы.
actors.hero.talent.fire_everything.title=падпаліць усё
actors.hero.talent.flash.desc=_+1:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Успышку_, каб тэлепартавацца на адлегласць да _3 плітак_.\n\n_+2:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Успышку_, каб тэлепартавацца на адлегласць да _4 плітак_.\n\n_+3:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Успышку_, каб тэлепартавацца на адлегласць да _5 плітак_.\n\n_+4:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Успышку_, каб тэлепартавацца на адлегласць да _6 плітак_.\n\nУспышка каштуе 2 зарады тома спачатку і яшчэ 1 зарад за кожнае выкарыстанне ў той жа ўзнёслай форме.
actors.hero.talent.flash.title=успышка
actors.hero.talent.focused_meal.desc=_+1:_ Ужыванне ежы займае 1 ход Дуэлянткі і дае ёй _0,67 зарадаў_ зброі.\n\n_+2:_ Ужыванне ежы займае 1 ход Дуэлянткі і дае ёй _1 зарад_ зброі.
actors.hero.talent.focused_meal.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага дасць бонусную шкоду да яго наступнага ўдару, роўную яго ўзроўню/3 пры +1 або ўзроўню/2 пры +2.
actors.hero.talent.focused_meal.title=мэтанакіраваны прыём ежы
actors.hero.talent.followup_strike.desc=_+1:_ Калі Паляўнічая б'е па ворагу лукам або кідальнай зброяй, яе наступная атака ў блізкім бою супраць гэтага ворага наносіць _2 адзінкі дадатковай шкоды_.\n\n_+2:_ Калі Паляўнічая б'е па ворагу лукам або кідальнай зброяй, яе наступная атака ў блізкім бою супраць гэтага ворага наносіць _3 адзінкі дадатковай шкоды_.
actors.hero.talent.followup_strike.title=паўторны страйк
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Атакі духоўнага ястраба асляпляюць ворагаў на _2 хады_.\n\n_+2:_ Атакі духоўнага ястраба асляпляюць ворагаў на _5 хадоў_.\n\n_+3:_ Атакі духоўнага ястраба асляпляюць ворагаў на _5 хадоў_ і калечаць іх на _2 хады_.\n\n_+4:_ Атакі духоўнага ястраба асляпляюць ворагаў на _5 хадоў_ і калечаць іх на _5 хадоў_.
actors.hero.talent.go_for_the_eyes.title=ідзі за вачыма
actors.hero.talent.growing_power.desc=_+1:_ Павялічаныя паказчыкі хуткасці атакі і перамяшчэння ад сілы прыроды былі павялічаны з 33% да 38% і 125% раней.\n\n_+2:_ Павялічаныя паказчыкі хуткасці атакі і перамяшчэння ад сілы прыроды былі павялічаны з 33% да 42% і 150% раней.\n\n_+3:_ Павялічаныя паказчыкі хуткасці атакі і перамяшчэння ад сілы прыроды былі павялічаны з 33% да 46% і 175% раней.\n\n_+4:_ Павялічаныя паказчыкі хуткасці атакі і перамяшчэння ад сілы прыроды былі павялічаны з 33% да 100% да 50% і 200% раней.
actors.hero.talent.growing_power.title=расце магутнасць
actors.hero.talent.hallowed_ground.desc=_+1:_ Святар можа выкарыстоўваць _Свяшчэнную зямлю_, загавор, які асвячае мясцовасць у вобласці _3x3_ на працягу 20 хадоў, коштам 2 зарадаў.\n\n_+2:_ Святар можа выкарыстоўваць _Свяшчэнную зямлю_, загавор, які асвячае мясцовасць у вобласці _5x5_ на працягу 20 хадоў, коштам 2 зарадаў.\n\n_+3:_ Святар можа выкарыстоўваць _Свяшчэнную зямлю_, загавор, які асвячае мясцовасць у вобласці _7x7_ на працягу 20 хадоў, коштам 2 зарадаў.\n\nПры выкарыстанні Свяшчэнная зямля лечыць саюзнікаў на 15 адзінак здароўя, ненадоўга прыгнятае ворагаў і распаўсюджвае кароткую траву. Пасля гэтага яна павольна лечыць саюзнікаў, калечыць ворагаў і выклікае выпадковы рост высокай травы. Асвячоная зямля дае святару шчыт замест лячэння і знішчаецца агнём.
actors.hero.talent.hallowed_ground.title=святая зямля
actors.hero.talent.hasty_retreat.desc=_+1:_ Пасля міргання Разбойнік атрымлівае _1 ход_ паспешлівасці і нябачнасці.\n\n_+2:_ Пасля міргання Разбойнік атрымлівае _2 хады_ паспешлівасці і нябачнасці.\n\n_+3:_ Пасля міргання Разбойнік атрымлівае _3 хады_ паспешлівасці і нябачнасці.\n\n_+4:_ Пасля міргання Разбойнік атрымлівае _4 хады_ паспешлівасці і нябачнасці.
actors.hero.talent.hasty_retreat.title=паспешлівае адступленне
actors.hero.talent.hearty_meal.desc=_+1:_ Ужыванне ежы аднаўляе _4 адзінкі здароўя Воіна, калі яго здароўе складае 33% або ніжэй.\n\n_+2:_ Ужыванне ежы аднаўляе _6 адзінак здароўя Воіна, калі яго здароўе складае 33% або ніжэй.
actors.hero.talent.hearty_meal.title=сытная ежа
actors.hero.talent.heightened_senses.desc=_+1:_ Паляўнічая атрымлівае зрок розуму на персанажах у межах _2 клетак ад яе пазіцыі_.\n\n_+2:_ Паляўнічая атрымлівае зрок розуму на персанажах у межах _3 клетак ад яе пазіцыі_.
actors.hero.talent.heightened_senses.title=абвостраныя пачуцці
actors.hero.talent.heroic_energy.desc=_+1:_ Кошт зарадкі брані героя зніжаны на _12%.\n\n_+2:_ Кошт зарадкі брані героя зніжаны на _23%.\n\n_+3:_ Кошт зарадкі брані героя зніжаны на _32%.\n\n_+4:_ Кошт зарадкі брані героя зніжаны на _40%.
actors.hero.talent.heroic_energy.rat_title=ратроічная энергія
actors.hero.talent.heroic_energy.title=гераічная энергія
actors.hero.talent.hold_fast.desc=_+1:_ Калі Воін чакае, ён атрымлівае _1-2 адзінкі броні_ і запавольвае раскладанне камбінаваных і шчытовых бафаў на _50%_, пакуль не рухаецца.\n\n_+2:_ Калі Воін чакае, ён атрымлівае _2-4 адзінкі броні_ і запавольвае раскладанне камбінаваных і шчытовых бафаў на _75%_, пакуль не рухаецца.\n\n_+3:_ Калі Воін чакае, ён атрымлівае _3-6 адзінак броні_ і запавольвае раскладанне камбінаваных і шчытовых бафаў на _100%_, пакуль не рухаецца.
actors.hero.talent.hold_fast.title=трымайся моцна
actors.hero.talent.holy_intuition.desc=_+1:_ Клірык можа выкарыстоўваць _Святую Інтуіцыю_, загавор, які паказвае, ці пракляты прадмет, коштам _3 зарадаў._\n\n_+2:_ Клірык можа выкарыстоўваць _Святую Інтуіцыю_, загавор, які паказвае, ці пракляты прадмет, коштам _2 зарадаў._
actors.hero.talent.holy_intuition.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён дазволіць герою вызначыць статус праклёну на праклятым прадмете непасрэдна перад яго экіпіроўкай, у 15% выпадкаў пры +1 або ў 25% выпадкаў пры +2.
actors.hero.talent.holy_intuition.title=святая інтуіцыя
actors.hero.talent.holy_lance.desc=_+1:_ Святар можа выкарыстоўваць _Святое Дзіда,_ разбуральны загавор, які наносіць _30-55 адзінак шкоды_ коштам 4 зарадаў.\n\n_+2:_ Святар можа выкарыстоўваць _Святое Дзіда,_ разбуральны загавор, які наносіць _45-83 адзінкі шкоды_ коштам 4 зарадаў.\n\n_+3:_ Святар можа выкарыстоўваць _Святое Дзіда,_ разбуральны загавор, які наносіць _60-110 адзінак шкоды_ коштам 4 зарадаў.\n\nСвятое Дзіда заўсёды наносіць максімальную шкоду дэманам і нябожчыкам. Святое Дзіда мае 30 хадоў аднаўлення, перш чым яго можна будзе выкарыстоўваць зноў.
actors.hero.talent.holy_lance.title=святое дзіда
actors.hero.talent.impact_wave.desc=_+1:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі адкідваюцца на _2 клеткі_ назад і маюць _25% верагоднасць_ стаць уразлівымі на 5 хадоў.\n\n_+2:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі адкідваюцца на _3 клеткі_ назад і маюць _50% верагоднасць_ стаць уразлівымі на 5 хадоў.\n\n_+3:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі адкідваюцца на _4 клеткі_ назад і маюць _75% верагоднасць_ стаць уразлівымі на 5 хадоў.\n\n_+4:_ Калі Воін прызямляецца пасля скачка, усе суседнія ворагі адкідваюцца на _5 клетак_ назад і маюць _100% верагоднасць_ стаць уразлівымі на 5 хадоў.
actors.hero.talent.impact_wave.title=ударная хваля
actors.hero.talent.improvised_projectiles.desc=_+1:_ Воін можа асляпіць ворага на _2 хады_, кінуўшы ў яго любы прадмет, які не з'яўляецца кідальнай зброяй. Час аднаўлення 50 хадоў.\n\n_+2:_ Воін можа асляпіць ворага на _3 хады_, кінуўшы ў яго любы прадмет, які не з'яўляецца кідальнай зброяй. Час аднаўлення 50 хадоў.
actors.hero.talent.improvised_projectiles.title=імправізаваныя снарады
actors.hero.talent.inscribed_power.desc=_+1:_ Калі Маг чытае скрутак або выкарыстоўвае прадмет загавораў, яго _наступныя 2 зарады палачкі_ атрымліваюць +2 узроўні.\n\n_+2:_ Калі Маг чытае скрутак або выкарыстоўвае прадмет загавораў, яго _наступныя 3 зарады палачкі_ атрымліваюць +2 узроўні.\n\nКолькасць палепшаных зарадаў палачкі падвойваецца пры выкарыстанні скрутка прадметаў паляпшэння, трансмутацыі або алхімічных прадметаў, якія павінны быць выраблены з дапамогай гэтых скруткаў.\n\nДля прадметаў алхімічных прадметаў з большай колькасцю выпрацоўкі (напрыклад, большасць загавораў) гэты талент мае шанец спрацаваць у залежнасці ад таго, колькі гэтага прадмета вырабляецца.
actors.hero.talent.inscribed_power.title=упісаная магутнасць
actors.hero.talent.inscribed_stealth.desc=_+1:_ Злодзей атрымлівае _3 хады_ нябачнасці пасля прачытання скрутка або выкарыстання прадмета загавору.\n\n_+2:_ Злодзей атрымлівае _5 хадоў_ нябачнасці пасля прачытання скрутка або выкарыстання прадмета загавору.\n\nПрацягласць нябачнасці падвойваецца пры выкарыстанні скрутка паляпшэння, скрутка трансмутацыі або алхімічных прадметаў, якія павінны быць выраблены з дапамогай гэтых скруткаў.\n\nДля алхімічных прадметаў з большай колькасцю вырабу (напрыклад, большасць загавораў) гэты талент мае шанец спрацаваць у залежнасці ад таго, колькі гэтага прадмета вырабляецца.
actors.hero.talent.inscribed_stealth.title=надпісаная скрытнасць
actors.hero.talent.invigorating_meal.desc=_+1:_ Ужыванне ежы займае ў Паляўнічай 1 ход (ягады з'ядаюцца імгненна) і дае ёй _1 ход паскарэння_.\n\n_+2:_ Ужыванне ежы займае ў Паляўнічай 1 ход (ягады з'ядаюцца імгненна) і дае ёй _2 хады паскарэння_.
actors.hero.talent.invigorating_meal.title=падбадзёрлівая страва
actors.hero.talent.invigorating_victory.desc=_+1:_ Калі Дуэлянтка перамагае сваю цэль да заканчэння дуэлі, яна аднаўляе _5 адзінак здароўя плюс 30% ад атрыманай шкоды_ падчас дуэлі.\n\n_+2:_ Калі Дуэлянтка перамагае сваю цэль да заканчэння дуэлі, яна аднаўляе _10 адзінак здароўя плюс 50% ад атрыманай шкоды_ падчас дуэлі.\n\n_+3:_ Калі Дуэлянтка перамагае сваю цэль да заканчэння дуэлі, яна аднаўляе _15 адзінак здароўя плюс 65% ад атрыманай шкоды_ падчас дуэлі.\n\n_+4:_ Калі Дуэлянтка перамагае сваю цэль да заканчэння дуэлі, яна аднаўляе _20 адзінак здароўя плюс 75% ад атрыманай шкоды_ падчас дуэлі.
actors.hero.talent.invigorating_victory.title=асвяжальная перамога
actors.hero.talent.iron_stomach.desc=_+1:_ Ужыванне ежы займае ў Воіна 1 ход і дае яму _75% устойлівасці да пашкоджанняў_ падчас ежы.\n\n_+2:_ Ужыванне ежы займае ў Воіна 1 ход і дае яму _100% устойлівасці да пашкоджанняў_ падчас ежы.
actors.hero.talent.iron_stomach.title=жалезны страўнік
actors.hero.talent.iron_will.desc=_+1:_ Шчыт, які забяспечвае пячатка Воіна, _павялічваецца на 1_.\n\n_+2:_ Шчыт, які забяспечвае пячатка Воіна, _павялічваецца на 2_.
actors.hero.talent.iron_will.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён пасіўна дасць 1 або 2 максімальныя шчыты ў версіі з эфектам зламанай пячаткі Воіна.
actors.hero.talent.iron_will.title=жалезная воля
actors.hero.talent.judgement.desc=_+1:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Суд,_ які наносіць _10-20 адзінак шкоды_ усім бачным ворагам.\n\n_+2:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Суд,_ які наносіць _15-30 адзінак шкоды_ усім бачным ворагам.\n\n_+3:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Суд,_ які наносіць _20-40 адзінак шкоды_ усім бачным ворагам.\n\n_+4:_ Знаходзячыся ва Узнёслай форме, Клірык можа выкарыстоўваць _Суд,_ які наносіць _25-50 адзінак шкоды_ усім бачным ворагам.\n\nСуд каштуе 3 зарады тома. Суд наносіць +33% шкоды за кожны загавор, які Клірык наклаў з моманту ўвабрання ў форму ўзнясення або з моманту апошняга выкарыстання "Суду".
actors.hero.talent.judgement.title=меркаванне
actors.hero.talent.lay_on_hands.desc=_+1:_ Паладзін можа выкарыстоўваць _Ускладанне рук_, загавор, які імгненна лечыць персанажа паблізу на _15 адзінак здароўя,_ або дае паладыну _15 экраніравання,_ коштам 1 зарада.\n\n_+2:_ Паладзін можа выкарыстоўваць _Ускладанне рук_, загавор, які імгненна лечыць персанажа паблізу на _20 адзінак здароўя,_ або дае паладыну _20 экраніравання,_ коштам 1 зарада.\n\n_+3:_ Паладзін можа выкарыстоўваць _Ускладанне рук_, загавор, які імгненна лечыць персанажа паблізу на _25 адзінак здароўя,_ або дае паладыну _25 экраніравання,_ коштам 1 зарада.\n\nЛішняе лячэнне ад гэтага загавору пераўтвараецца ў экраніраванне. «Узлажэнне рук» можна выкарыстоўваць неаднаразова, але адначасова нельга накласці больш за тры шчыты.
actors.hero.talent.lay_on_hands.title=пакласці на рукі
actors.hero.talent.lethal_defense.desc=_+1:_ Калі Гладыятар забівае ворага камбінаваным прыёмам, час аднаўлення яго шчыта "зламаная пячатка" _скарачаецца на 50 хадоў_.\n\n_+2:_ Калі Гладыятар забівае ворага камбінаваным прыёмам, час аднаўлення яго шчыта "зламаная пячатка" _скарачаецца на 100 хадоў_.\n\n_+3:_ Калі Гладыятар забівае ворага камбінаваным прыёмам, час аднаўлення яго шчыта "зламаная пячатка" _скарачаецца на 150 хадоў_.\n\nГэты талент можа скараціць час аднаўлення шчыта да -150 хадоў, што азначае, што ён будзе даступны зноў адразу пасля актывацыі.
actors.hero.talent.lethal_defense.title=смяротная абарона
actors.hero.talent.lethal_haste.desc=_+1:_ Калі Дуэлянт наносіць смяротны ўдар па ворагу са здольнасцю зброі, ён атрымлівае _3 хады_ імгненнага перамяшчэння.\n\n_+2:_ Калі Дуэлянт наносіць смяротны ўдар па ворагу са здольнасцю зброі, ён атрымлівае _5 хадоў_ імгненнага перамяшчэння.
actors.hero.talent.lethal_haste.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён будзе спрацоўваць пры звычайных атаках зброяй з часам аднаўлення 100 хадоў.
actors.hero.talent.lethal_haste.title=смяротная паспешлівасць
actors.hero.talent.lethal_momentum.desc=_+1:_ Калі Воін наносіць смяротны ўдар па ворагу фізічнай зброяй, ён мае _67% верагоднасць_ зрабіць 0 хадоў.\n\n_+2:_ Калі Воін наносіць смяротны ўдар па ворагу фізічнай зброяй, ён мае _100% верагоднасць_ зрабіць 0 хадоў.
actors.hero.talent.lethal_momentum.title=смяротны імпульс
actors.hero.talent.life_link.desc=Клярык можа выкарыстоўваць _Жыццёвую сувязь_ паміж сабой і ўзмоцненым саюзнікам, выдаткаваўшы 2 зарады. Гэты загавор распределяе шкоду паміж клірыкам і яго саюзнікам, а таксама прымушае карысныя загаворы клірыка 3-га ўзроўню або ніжэй ужывацца да абодвух, калі адзін з іх знаходзіцца пад уплывам. \n\n_+1:_ Жыццёвая сувязь дзейнічае _10 хадоў_ і павялічвае бонус "Моц многіх" да _-35% атрыманай шкоды._\n\n_+2:_ Жыццёвая сувязь дзейнічае _13 хадоў_ і павялічвае бонус "Моц многіх" да _-40% атрыманай шкоды._\n\n_+3:_ Жыццёвая сувязь дзейнічае _17 хадоў_ і павялічвае бонус "Моц многіх" да _-45% атрыманай шкоды._\n\n_+4:_ Жыццёвая сувязь дзейнічае _20 хадоў_ і павялічвае бонус "Моц многіх" да _-50% атрыманай шкоды._
actors.hero.talent.life_link.title=жыццёвая сувязь
actors.hero.talent.light_cloak.desc=_+1:_ Разбойнік можа выкарыстоўваць свой плашч ценяў, калі ён не экіпіраваны, але ён перазараджаецца з хуткасцю _25%_, калі ён не экіпіраваны.\n\n_+2:_ Разбойнік можа выкарыстоўваць свой плашч ценяў, калі ён не экіпіраваны, але ён перазараджаецца з хуткасцю _50%_, калі ён не экіпіраваны.\n\n_+3:_ Разбойнік можа выкарыстоўваць свой плашч ценяў, калі ён не экіпіраваны, але ён перазараджаецца з хуткасцю _75%_, калі ён не экіпіраваны.
actors.hero.talent.light_cloak.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага павялічыць хуткасць зарадкі ўсіх артэфактаў на 7/13/20% пры +1/+2/+3.
actors.hero.talent.light_cloak.title=лёгкі плашч
actors.hero.talent.light_reading.desc=_+1:_ Клірык можа выкарыстоўваць свой святы фоліант, калі ён не экіпіраваны, але ён перазараджаецца з _хуткасцю 25%_, калі ён не экіпіраваны.\n\n_+2:_ Клірык можа выкарыстоўваць свой святы фоліант, калі ён не экіпіраваны, але ён перазараджаецца з _хуткасцю 50%_, калі ён не экіпіраваны.\n\n_+3:_ Клірык можа выкарыстоўваць свой святы фоліант, калі ён не экіпіраваны, але ён перазараджаецца з _хуткасцю 75%_, калі ён не экіпіраваны.
actors.hero.talent.light_reading.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага павялічыць хуткасць перазарадкі ўсіх палачак на 7/13/20% пры +1/+2/+3.
actors.hero.talent.light_reading.title=Лёгкае чытанне
actors.hero.talent.lingering_magic.desc=_+1:_ Калі Маг б'е палачкай або посахам, яго наступная фізічная атака наносіць _1-2 бонусныя пашкоджанні_.\n\n_+2:_ Калі Маг б'е палачкай або посахам, яго наступная фізічная атака наносіць _2 бонусныя пашкоджанні_.
actors.hero.talent.lingering_magic.title=зацяжная магія
actors.hero.talent.liquid_agility.desc=_+1:_ Пры ўжыванні або кіданні зелля, адвара або эліксіра Дуэлянт мае _3-кратнае ўхіленне_ і _3-кратнае павелічэнне дакладнасці_ пры наступнай атацы блізкага бою на працягу 5 хадоў.\n\n_+2:_ Пры ўжыванні або кіданні зелля, адвара або эліксіра Дуэлянт мае _бясконцае ўхіленне_ і _бясконцае павелічэнне дакладнасці_ пры наступнай атацы блізкага бою на працягу 5 хадоў.\n\nГэты бонус дзейнічае яшчэ адзін ход і атаку пры выкарыстанні зелляў сілы, вопыту або алхімічных прадметаў, якія павінны быць выраблены з выкарыстаннем гэтых зелляў.\n\nДля алхімічных прадметаў з большай колькасцю вытворчасці (напрыклад, воднага адвара) гэты талент мае шанец спрацаваць у залежнасці ад таго, колькі гэтага прадмета вырабляецца.
actors.hero.talent.liquid_agility.title=спрытнасць вадкасці
actors.hero.talent.liquid_nature.desc=_+1:_ Калі Паляўнічая выпівае або кідае зелле, адвар або эліксір, _да 4 клетак травы_ прарастае ў наваколлі, і суседнія ворагі атрымліваюць паражэнне на _1 ход_.\n\n_+2:_ Калі Паляўнічая выпівае або кідае зелле, адвар або эліксір, _да 6 клетак травы_ прарастае ў наваколлі, і суседнія ворагі атрымліваюць паражэнне на _2 хады_.\n\nКолькасць травы і працягласць кораня падвойваюцца пры выкарыстанні зелляў сілы, вопыту або алхімічных прадметаў, якія павінны быць выраблены з выкарыстаннем гэтых зелляў.\n\nДля алхімічных прадметаў з большай колькасцю вытворчасці (напрыклад, воднага адвару) гэты талент мае шанец спрацаваць у залежнасці ад таго, колькі гэтага прадмета вырабляецца.
actors.hero.talent.liquid_nature.title=вадкая прырода
actors.hero.talent.liquid_willpower.desc=_+1:_ Воін атрымлівае _6,5% свайго максімальнага HP у абароне_ пры выпіўцы або кіданні зелля, адвара або эліксіра.\n\n_+2:_ Воін атрымлівае _10% свайго максімальнага HP у абароне_ пры выпіўцы або кіданні зелля, адвара або эліксіра.\n\nПамер шчыта падвойваецца пры выкарыстанні зелляў сілы, вопыту або алхімічных прадметаў, якія павінны быць выраблены з выкарыстаннем гэтых зелляў.\n\nДля алхімічных прадметаў з большай колькасцю выхаду (напрыклад, воднага адвара) гэты талент мае шанец спрацаваць у залежнасці ад таго, колькі гэтага прадмета вырабляецца.
actors.hero.talent.liquid_willpower.title=вадкая сіла волі
actors.hero.talent.longrange_warp.desc=_+1:_ Маг цяпер можа перамяшчацца паміж паверхамі, кошт зарадкі складае _150%_.\n\n_+2:_ Маг цяпер можа перамяшчацца паміж паверхамі, кошт зарадкі — _117%_.\n\n_+3:_ Маг цяпер можа перамяшчацца паміж паверхамі, кошт зарадкі — _83%_.\n\n_+4:_ Маг цяпер можа перамяшчацца паміж паверхамі, кошт зарадкі — _50%_.\n\nМаг не можа выкарыстоўваць варп на вялікія адлегласці, каб пакінуць заблакіраваны паверх.
actors.hero.talent.longrange_warp.title=Далёкадзейны варп
actors.hero.talent.mind_form.desc=Клірык можа выкарыстоўваць _Форму Розуму_, якая напаўняе Трыніці сілай палачкі або кідальнай зброі, якую Клірык выкарыстаў у гэтым праходзе, коштам 3 зарадаў.\n\n_+1:_ Пры выкарыстанні Трыніці Клірык выкарыстоўвае эфект кідка або ўдару абранага прадмета, як быццам гэта _+3._\n\n_+2:_ Пры выкарыстанні Трыніці Клірык выкарыстоўвае эфект кідка або ўдару абранага прадмета, як быццам гэта _+4._\n\n_+3:_ Пры выкарыстанні Трыніці Клірык выкарыстоўвае эфект кідка або ўдару абранага прадмета, як быццам гэта _+5._\n\n_+4:_ Пры выкарыстанні Трыніці Клірык выкарыстоўвае эфект кідка або ўдару абранага прадмета, як быццам гэта _+5. _+6._\n\nТрыніці можа быць насычана толькі адным эфектам розуму адначасова.
actors.hero.talent.mind_form.title=форма розуму
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Святар можа выкарыстоўваць _Мнеманічную малітву,_ загавор, які падаўжае ўзмацненні/адмоўныя эфекты на саюзніка/ворага на _3 хады_ коштам 1 зарада.\n\n_+2:_ Святар можа выкарыстоўваць _Мнеманічную малітву,_ загавор, які падаўжае ўзмацненні/адмоўныя эфекты на саюзніка/ворага на _4 хады_ коштам 1 зарада.\n\n_+3:_ Святар можа выкарыстоўваць _Мнеманічную малітву,_ загавор, які падаўжае ўзмацненні/адмоўныя эфекты на саюзніка/ворага на _5 хадоў_ коштам 1 зарада.\n\nМнеманічная малітва не патрабуе часу на напісанне. Мнеманічная малітва можа падоўжыць пэўны выпадак узмацнення/адмоўнага эфекту толькі адзін раз і не можа падаўжаць узмацненні ад здольнасцей даспехаў.
actors.hero.talent.mnemonic_prayer.title=мнеманічная малітва
actors.hero.talent.monastic_vigor.desc=_+1:_ Калі ў манаха _100% энергіі_, яго здольнасці ўзмацняюцца.\n\n_+2:_ Калі ў манаха _80% ці больш энергіі_, яго здольнасці ўзмацняюцца.\n\n_+3:_ Калі ў манаха _60% ці больш энергіі_, яго здольнасці ўзмацняюцца.\n\nКалі ўзмацняецца:\n - Шквал накладвае зачараванне вашай зброі\n - Фокус імгненны\n - Рывок атрымлівае +4 далёкасць\n - Удар дракона наносіць +50% шкоды і накладвае свой эфект адкідання і аглушэння на ўсіх суседніх ворагаў\n - Медытацыя павольна аднаўляе 20% адсутнага здароўя і дае 80% устойлівасці да шкоды.
actors.hero.talent.monastic_vigor.title=манастырская энергія
actors.hero.talent.mystical_charge.desc=_+1:_ Удар сваім посахам дае Баявому магу _0.5 ходу_ перазарадкі артэфакта.\n\n_+2:_ Удар сваім посахам дае Баявому магу _1 ход_ перазарадкі артэфакта.\n\n_+3:_ Удар сваім посахам дае Баявому магу _1.5 ходу_ перазарадкі артэфакта.
actors.hero.talent.mystical_charge.title=містычны зарад
actors.hero.talent.mystical_meal.desc=_+1:_ Ужыванне ежы займае 1 ход Разбойніка (прыпасы з'ядаюцца імгненна) і дае яму _3 хады папаўнення артэфакта_.\n\n_+2:_ Ужыванне ежы займае 1 ход Разбойніка (прыпасы з'ядаюцца імгненна) і дае яму _5 хадоў папаўнення артэфакта_.\n\nГэты талент нельга выкарыстоўваць, каб рог багацця сам перазарадзіўся.
actors.hero.talent.mystical_meal.title=містычная ежа
actors.hero.talent.natures_aid.desc=_+1:_ Паляўнічая атрымлівае 0-2 даспехі з кары, якія знікаюць кожныя _3 хады_, калі ў яе бачанні актывуецца эфект расліны.\n\n_+2:_ Паляўнічая атрымлівае 0-2 даспехі з кары, якія знікаюць кожныя _5 хадоў_, калі ў яе бачанні актывуецца эфект расліны.
actors.hero.talent.natures_aid.title=дапамога прыроды
actors.hero.talent.natures_bounty.desc=_+1:_ Паляўнічая можа знайсці _4 ягады_, схаваныя ў высокай траве, даследуючы наступныя некалькі паверхаў падзямелля.\n\n_+2:_ Паляўнічая можа знайсці _6 ягад_, схаваных у высокай траве, даследуючы наступныя некалькі паверхаў падзямелля.\n\nЯгады хутка з'ядаюцца, аднаўляюць невялікую колькасць сытасці і могуць утрымліваць карыснае насенне.
actors.hero.talent.natures_bounty.title=дары прыроды
actors.hero.talent.natures_wrath.desc=_+1:_ Пакуль сіла прыроды актыўная, стрэлы з духоўнага лука маюць _8% верагоднасць_ выклікаць выпадковы шкодны эфект расліны.\n\n_+2:_ Пакуль сіла прыроды актыўная, стрэлы з духоўнага лука маюць _17% верагоднасць_ выклікаць выпадковы шкодны эфект расліны.\n\n_+3:_ Пакуль сіла прыроды актыўная, стрэлы з духоўнага лука маюць _25% верагоднасць_ выклікаць выпадковы шкодны эфект расліны.\n\n_+4:_ Пакуль сіла прыроды актыўная, стрэлы з духоўнага лука маюць _33% верагоднасць_ выклікаць выпадковы шкодны эфект расліны.\n\nРасліны, якія можна актываваць: сляпая трава, агністы квет, ледзяная шапка, сумны мох і буравінавая ліяна.
actors.hero.talent.natures_wrath.title=гнеў прыроды
actors.hero.talent.necromancers_minions.desc=_+1:_ Калі памірае вораг з пазнакай душы, у Чарадзея ёсць _13% шанец_ уваскрэсіць яго як сапсаванага прывіда.\n\n_+2:_ Калі памірае вораг з пазнакай душы, у Чарадзея ёсць _27% шанец_ уваскрэсіць яго як сапсаванага прывіда.\n\n_+3:_ Калі памірае вораг з пазнакай душы, у Чарадзея ёсць _40% шанец_ уваскрэсіць яго як сапсаванага прывіда.
actors.hero.talent.necromancers_minions.title=паслугачы некраманта
actors.hero.talent.patient_strike.desc=_+1:_ Калі Дуэлянт чакае перад выкананнем атакі ў блізкім бою, ён нанясе _1-2 бонуснай шкоды_.\n\n_+2:_ Калі Дуэлянт чакае перад выкананнем атакі ў блізкім бою, ён нанясе _2 бонуснай шкоды_.
actors.hero.talent.patient_strike.title=забастоўка пацыентаў
actors.hero.talent.perfect_copy.desc=_+1:_ Ценявы клон атрымлівае _10%_ ад максімальнага HP героя і можа імгненна памяняцца месцамі з героем на адлегласці да _1 клеткі_.\n\n_+2:_ Ценявы клон атрымлівае _20%_ ад максімальнага HP героя і можа імгненна памяняцца месцамі з героем на адлегласці да _2 клетак_.\n\n_+3:_ Ценявы клон атрымлівае _30%_ ад максімальнага HP героя і можа імгненна памяняцца месцамі з героем на адлегласці да _3 клетак_.\n\n_+4:_ Ценявы клон атрымлівае _40%_ ад максімальнага HP героя і можа імгненна памяняцца месцамі з героем на адлегласці да _4 клетак_.
actors.hero.talent.perfect_copy.title=ідэальная копія
actors.hero.talent.point_blank.desc=_+1:_ Калі Паляўнічая выкарыстоўвае свой лук або кідальную зброю ў блізкім бою, яе дакладнасць складае _-25%,_ замест -50%.\n\n_+2:_ Калі Паляўнічая выкарыстоўвае свой лук або кідальную зброю ў блізкім бою, яе дакладнасць складае _звычайную,_ замест -50%.\n\n_+3:_ Калі Паляўнічая выкарыстоўвае свой лук або кідальную зброю ў блізкім бою, яе дакладнасць складае _+25%,_ замест -50%.\n\nЗвярніце ўвагу, што кідальная зброя або духоўны лук заўсёды маюць +50% дакладнасці пры выкарыстанні на адлегласці.
actors.hero.talent.point_blank.title=прама
actors.hero.talent.precise_assault.desc=_+1:_ Калі Дуэлянт выкарыстоўвае здольнасць зброі, ён атрымлівае _2x дакладнасць_ пры наступнай атацы блізкага бою на працягу 5 хадоў.\n\n_+2:_ Калі Дуэлянт выкарыстоўвае здольнасць зброі, ён атрымлівае _5x дакладнасць_ пры наступнай атацы блізкага бою на працягу 5 хадоў.\n\n_+3:_ Калі Дуэлянт выкарыстоўвае здольнасць зброі, ён атрымлівае _бясконцая дакладнасць_ пры наступнай атацы блізкага бою на працягу 5 хадоў.
actors.hero.talent.precise_assault.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага павялічыць дакладнасць у блізкім бою на 10% пры +1, 20% пры +2 або 30% пры +3.
actors.hero.talent.precise_assault.title=дакладны напад
actors.hero.talent.projectile_momentum.desc=_+1:_ Падчас вольнага бегу Вольны бегун атрымлівае _+50% дакладнасці і +15% шкоды_ кідальнай зброяй.\n\n_+2:_ Падчас вольнага бегу Вольны бегун атрымлівае _+100% дакладнасці і +30% шкоды_ кідальнай зброяй.\n\n_+3:_ Падчас вольнага бегу Вольны бегун атрымлівае _+150% дакладнасці і +45% шкоды_ кідальнай зброяй.
actors.hero.talent.projectile_momentum.title=імпульс снарада
actors.hero.talent.projecting_blades.desc=_+1:_ Спектральныя ляза маюць _+25% дакладнасці_ і могуць прабіваць да _2 суцэльных плітак_.\n\n_+2:_ Спектральныя ляза маюць _+50% дакладнасці_ і могуць прабіваць да _4 суцэльных плітак_.\n\n_+3:_ Спектральныя ляза маюць _+75% дакладнасці_ і могуць прабіваць да _6 суцэльных плітак_.\n\n_+4:_ Спектральныя ляза маюць _+100% дакладнасці_ і могуць прабіваць да _8 суцэльных плітак_.
actors.hero.talent.projecting_blades.title=выступаючыя лопасці
actors.hero.talent.protective_shadows.desc=_+1:_ Разбойнік атрымлівае адзін шчыт _кожны другі ход_, калі ён нябачны, _максімум 3_.\n\n_+2:_ Разбойнік атрымлівае адзін шчыт _кожны ход_ калі ён нябачны, _максімум 5_.
actors.hero.talent.protective_shadows.title=ахоўныя цені
actors.hero.talent.provoked_anger.desc=_+1:_ Калі любы ўзмацненне ахоўнага экрана, ужытае да Воіна, прабіваецца пашкоджаннямі, яго наступная фізічная атака нанясе _3 адзінкі дадатковай шкоды_.\n\n_+2:_ Калі любы ўзмацненне ахоўнага экрана, ужытае да Воіна, прабіваецца пашкоджаннямі, яго наступная фізічная атака нанясе _5 адзінак дадатковай шкоды_.
actors.hero.talent.provoked_anger.title=выклікаў гнеў
actors.hero.talent.ratforcements.desc=_+1:_ Выкарыстанне пацучынага рыштунку на сабе _спараджае 1_ саюзнага сумчатага пацука побач з вамі.\n\n_+2:_ Выкарыстанне пацучынага рыштунку на сабе _спараджае 2_ саюзных сумчатых пацукоў побач з вамі.\n\n_+3:_ Выкарыстанне пацучынага рыштунку на сабе _спараджае 3_ саюзных сумчатых пацукоў побач з вамі.\n\n_+4:_ Выкарыстанне пацучынага рыштунку на сабе _спараджае 4_ саюзных сумчатых пацукоў побач з вамі.
actors.hero.talent.ratforcements.title=пацучыныя войскі
actors.hero.talent.ratlomacy.desc=_+1:_ Выкарыстанне "Пацукоў" на пацукоў-ворага робіць яго дружалюбным і робіць пераўтварэнне пастаянным.\n\n_+2:_ Выкарыстанне "Пацукоў" на пацукоў-ворага робіць яго дружалюбным, робіць пераўтварэнне пастаянным і дае яму _2 хады_ адрэналіну.\n\n_+3:_ Выкарыстанне "Пацукоў" на пацукоў-ворага робіць яго дружалюбным, робіць пераўтварэнне пастаянным і дае яму _4 хады_ адрэналіну.\n\n_+4:_ Выкарыстанне "Пацукоў" на пацукоў-ворага робіць яго дружалюбным, робіць пераўтварэнне пастаянным і дае яму _6 хадоў_ адрэналіну.
actors.hero.talent.ratlomacy.title=пацукоў
actors.hero.talent.ratsistance.desc=_+1:_ Варожыя ворагі, акрыленыя пацукамі, наносяць _-10% шкоды_.\n\n_+2:_ Варожыя ворагі, акрыленыя пацукамі, наносяць _-19% шкоды_.\n\n_+3:_ Варожыя ворагі, акрыленыя пацукамі, наносяць _-27% шкоды_.\n\n_+4:_ Варожыя ворагі, акрыленыя пацукамі, наносяць _-35% шкоды_.
actors.hero.talent.ratsistance.title=пацучыная трываласць
actors.hero.talent.reactive_barrier.desc=_+1:_ Маг атрымлівае _2.5 адзінкі абароны_ за кожнага персанажа, пацярпелага ад элементарнага выбуху, максімум 5 персанажаў.\n\n_+2:_ Маг атрымлівае _5 адзінак абароны_ за кожнага персанажа, пацярпелага ад элементарнага выбуху, максімум 6 персанажаў.\n\n_+3:_ Маг атрымлівае _7.5 адзінкі абароны_ за кожнага персанажа, пацярпелага ад элементарнага выбуху, максімум 7 персанажаў.\n\n_+4:_ Маг атрымлівае _10 адзінак абароны_ за кожнага персанажа, пацярпелага ад элементарнага выбуху, максімум 8 персанажаў.
actors.hero.talent.reactive_barrier.title=рэактыўны бар'ер
actors.hero.talent.recall_inscription.desc=_+1:_ Клірык можа выкарыстоўваць _Надпіс адклікання_, загавор, які дазваляе яму паўтарыць эфект апошняга рунічнага каменя або скрутка, які ён выкарыстаў на працягу _10 хадоў._\n\n_+2:_ Клірык можа выкарыстоўваць _Надпіс адклікання_, загавор, які дазваляе яму паўтарыць эфект апошняга рунічнага каменя або скрутка, які ён выкарыстаў на працягу _300 хадоў._\n\nНадпіс адклікання нельга выкарыстоўваць са скруткамі паляпшэння. Кошт зараду гэтага загавору залежыць ад таго, які прадмет быў выкарыстаны нядаўна: 2 за рунічны камень, 3 за скрутак, 4 за экзатычны скрутак. Гэты кошт зараду таксама падвойваецца пры выкарыстанні са скруткам трансмутацыі або алхімічнымі прадметамі, якія павінны быць выраблены з дапамогай трансмутацыі або паляпшэння.
actors.hero.talent.recall_inscription.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага верне любы скрутак або рунны камень у 10% выпадкаў пры +1 або ў 15% выпадкаў пры +2. Скруткі паляпшэння вызваляюцца ад гэтага эфекту.
actors.hero.talent.recall_inscription.refunded=Ваш тавар быў вернуты!
actors.hero.talent.recall_inscription.title=надпіс аб адкліканні
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Калі Паляўнічая наступае на кароткую траву або вуголле, яна ўзлятае ў высокую траву, якую Паляўнічая адразу ж капае. Час аднаўлення — _10 хадоў_.\n\n_+2:_ Калі Паляўнічая наступае на кароткую траву або вуголле, яна ўзлятае ў высокую траву, якую Паляўнічая адразу ж капае. Час аднаўлення — _5 хадоў_.\n\nГэты талент стварае барозністую траву, калі пасіўныя эфекты рэгенерацыі адключаныя або герой даўно не атрымліваў вопыту.
actors.hero.talent.rejuvenating_steps.title=амаладжальныя этапы
actors.hero.talent.remote_beacon.desc=_+1:_ Маг можа размясціць маяк у любым месцы ў межах _4 плітак_.\n\n_+2:_ Маг можа размясціць маяк у любым месцы ў межах _8 плітак_.\n\n_+3:_ Маг можа размясціць маяк у любым месцы ў межах _12 плітак_.\n\n_+4:_ Маг можа размясціць маяк у любым месцы ў межах _16 плітак_.\n\n Маг не можа размяшчаць маякі ў недаступных месцах.
actors.hero.talent.remote_beacon.title=Аддалены маяк
actors.hero.talent.rogues_foresight.desc=_+1:_ Калі Разбойнік знаходзіцца на ўзроўні з сакрэтным пакоем, у яго ёсць _75% верагоднасць заўважыць_, што ўзровень утрымлівае сакрэт.\n\n_+2:_ Калі Разбойнік знаходзіцца на ўзроўні з сакрэтным пакоем, у яго ёсць _100% верагоднасць заўважыць_, што ўзровень утрымлівае сакрэт.
actors.hero.talent.rogues_foresight.title=прадбачлівасць нягодніка
actors.hero.talent.runic_transference.desc=_+1:_ Зламаная пячатка Воіна можа перадаваць _звычайныя гліфы_ гэтак жа, як яна перадае паляпшэнне.\n\n_+2:_ Зламаная пячатка Воіна можа перадаваць _звычайныя, магутныя і праклятыя гліфы_ гэтак жа, як яна перадае паляпшэнне.\n\nПячатка можа перадаваць гліфы толькі ў тым выпадку, калі яны былі нанесены на даспехі пры мацаванні пячаткі.
actors.hero.talent.runic_transference.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён дапаможа гліфам на вашай брані супраціўляцца выдаленню скруткамі паляпшэння. Гліфы пачнуць губляцца пры паляпшэнні з 6-га ўзроўню (было 4) пры +1 або з 7-га ўзроўню (было 4) пры +2. Узровень, на якім гарантавана губляюцца гліфы, застаўся нязменным і складае +8.
actors.hero.talent.runic_transference.title=рунічны перанос
actors.hero.talent.satiated_spells.desc=_+1:_ Ужыванне ежы прыводзіць да таго, што клірык атрымлівае _3 адзінкі абароны_ пры наступным накладанні загавору.\n\n_+2:_ Ужыванне ежы прыводзіць да таго, што клірык атрымлівае _5 адзінак абароны_ пры наступным накладанні загавору.
actors.hero.talent.satiated_spells.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён адразу ж дасць абарону, якая пачне звычайна змяншацца праз 10 хадоў.
actors.hero.talent.satiated_spells.title=Сытыя загаворы
actors.hero.talent.scholars_intuition.desc=_+1:_ Маг вызначае палачкі _3 разы хутчэй_.\n\n_+2:_ Маг вызначае палачкі _калі ён імі карыстаецца_.
actors.hero.talent.scholars_intuition.title=інтуіцыя навукоўца
actors.hero.talent.searing_light.desc=_+1:_ Фізічныя атакі клірыка па ворагах, асветленых _Пуцяводным святлом_, наносяць _+3 адзінкі шкоды._\n\n_+2:_ Фізічныя атакі клірыка па ворагах, асветленых _Пуцяводным святлом_, наносяць _+5 адзінак шкоды._
actors.hero.talent.searing_light.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён нанясе дадатковы ўрон пасля выкарыстання палачкі або артэфакта супраць ворага, з часам аднаўлення 20 хадоў.
actors.hero.talent.searing_light.title=Пякучае святло
actors.hero.talent.seer_shot.desc=_+1:_ Калі Паляўнічая страляе са стрэлы ў зямлю, яна дае зрок у вобласці 3x3 вакол яе на _5 хадоў_. Час аднаўлення 20 хадоў.\n\n_+2:_ Калі Паляўнічая страляе са стрэлы ў зямлю, яна дае зрок у вобласці 3x3 вакол яе на _10 хадоў_. Час аднаўлення 20 хадоў.\n\n_+3:_ Калі Паляўнічая страляе са стрэлы ў зямлю, яна дае зрок у вобласці 3x3 вакол яе на _15 хадоў_. Час аднаўлення 20 хадоў.
actors.hero.talent.seer_shot.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён спрацуе ад любой кінутай зброі.
actors.hero.talent.seer_shot.title=празорлівы стрэл
actors.hero.talent.shadow_blade.desc=_+1:_ Ценявы клон атрымлівае _8%_ шкоды героя за ход і мае _25% шанец_ выкарыстаць зачараванне на зброі героя.\n\n_+2:_ Ценявы клон атрымлівае _16%_ шкоды героя за ход і мае _50% шанец_ выкарыстаць зачараванне на зброі героя.\n\n_+3:_ Ценявы клон атрымлівае _24%_ шкоды героя за ход і мае _75% шанец_ выкарыстаць зачараванне на зброі героя.\n\n_+4:_ Ценявы клон атрымлівае _32%_ шкоды героя за ход і мае _100% шанец_ выкарыстаць зачараванне на зброі героя.
actors.hero.talent.shadow_blade.title=ценявы клінок
actors.hero.talent.shadow_step.desc=_+1:_ Калі разбойнік выкарыстоўвае дымавую бомбу, будучы нябачным, гэта адбываецца імгненна і мае _16% зніжаны_ кошт зарадкі, але яна таксама не асляпляе ворагаў і не актывуе іншыя таленты.\n\n_+2:_ Калі разбойнік выкарыстоўвае дымавую бомбу, будучы нябачным, гэта адбываецца імгненна і мае _30% зніжаны_ кошт зарадкі, але яна таксама не асляпляе ворагаў і не актывуе іншыя таленты.\n\n_+3:_ Калі разбойнік выкарыстоўвае дымавую бомбу, будучы нябачным, гэта адбываецца імгненна і мае _41% зніжаны_ кошт зарадкі, але яна таксама не асляпляе ворагаў і не актывуе іншыя таленты.\n\n_+4:_ Калі разбойнік выкарыстоўвае дымавую бомбу, будучы нябачным, гэта адбываецца імгненна і мае _50% зніжаны_ кошт зарадкі, але яна таксама не асляпляе ворагаў і не актывуе іншыя таленты.
actors.hero.talent.shadow_step.title=ценявы крок
actors.hero.talent.shared_enchantment.desc=_+1:_ Кідальная зброя мае _33% шанец_ выкарыстаць зачараванне на луку снайпера.\n\n_+2:_ Кідальная зброя мае _67% шанец_ выкарыстаць зачараванне на луку снайпера.\n\n_+3:_ Кідальная зброя мае _100% шанец_ выкарыстаць зачараванне на луку снайпера.\n\nЗачараванне лука можа спрацаваць у дадатак да любога зачаравання, якое ўжо мае кідальная зброя.
actors.hero.talent.shared_enchantment.title=агульнае зачараванне
actors.hero.talent.shared_upgrades.desc=_+1:_ Калі снайпер атакуе палепшанай кідальнай зброяй, кожны ўзровень павялічвае працягласць снайперскай меткі на 1 ход і шкоду ад яе спецыяльнай атакі на 16%, максімум да _2 хадоў і +33% шкоды пры +2_.\n\n_+2:_ Калі снайпер атакуе палепшанай кідальнай зброяй, кожны ўзровень павялічвае працягласць снайперскай меткі на 1 ход і шкоду ад яе спецыяльнай атакі на 16%, максімум да _4 хадоў і +67% шкоды пры +4_.\n\n_+3:_ Калі снайпер атакуе палепшанай кідальнай зброяй, кожны ўзровень павялічвае працягласць снайперскай меткі на 1 ход і шкоду ад яе спецыяльнай атакі на 16%, максімум да _6 хадоў і +100% шкоды пры +6_.
actors.hero.talent.shared_upgrades.title=агульныя абнаўленні
actors.hero.talent.shield_battery.desc=_+1:_ Маг можа нацэльвацца на сябе з дапамогай палачкі, каб пераўтварыць усе свае зарады ў шчыты з хуткасцю _4% ад максімальнага здароўя за зарад_.\n\n_+2:_ Маг можа нацэльвацца на сябе з дапамогай палачкі, каб пераўтварыць усе свае зарады ў шчыты з хуткасцю _6% ад максімальнага здароўя за зарад_.
actors.hero.talent.shield_battery.title=шчытавая батарэя
actors.hero.talent.shield_of_light.desc=_+1:_ Клірык можа выкарыстоўваць _Шчыт святла_, загавор, які імгненна спрацоўвае і дае яму _2-4 адзінкі броні_ супраць цэлі на 5 хадоў коштам 1 зарада.\n\n_+2:_ Клірык можа выкарыстоўваць _Шчыт святла_, загавор, які імгненна спрацоўвае і дае яму _3-6 адзінак броні_ супраць цэлі на 5 хадоў коштам 1 зарада.
actors.hero.talent.shield_of_light.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага паменшыць фізічную шкоду, якую атрымлівае ваш выбраны праціўнік, на 1, у 33% выпадкаў пры +1 або ў 50% выпадкаў пры +2.
actors.hero.talent.shield_of_light.title=шчыт святла
actors.hero.talent.shielding_dew.desc=_+1:_ Кроплі расы могуць абараняць Вартаўніцу, калі яе здароўе поўнае, да _20% ад яе максімальнага здароўя_.\n\n_+2:_ Кроплі расы могуць абараняць Вартаўніцу, калі яе здароўе поўнае, да _40% ад яе максімальнага здароўя_.\n\n_+3:_ Кроплі расы могуць абараняць Вартаўніцу, калі яе здароўе поўнае, да _60% ад яе максімальнага здароўя_.
actors.hero.talent.shielding_dew.title=ахоўная раса
actors.hero.talent.shock_force.desc=_+1:_ Ударная хваля наносіць _на _20% больш шкоды_ і мае _25% верагоднасць_ аглушыць замест калекі.\n\n_+2:_ Ударная хваля наносіць _на _40% больш шкоды_ і мае _50% верагоднасць_ аглушыць замест калекі.\n\n_+3:_ Ударная хваля наносіць _на _60% больш шкоды_ і мае _75% верагоднасць_ аглушыць замест калекі.\n\n_+4:_ Ударная хваля наносіць _на _80% больш шкоды_ і мае _100% верагоднасць_ аглушыць замест калекі.
actors.hero.talent.shock_force.title=ударная сіла
actors.hero.talent.shrug_it_off.desc=_+1:_ Зніжэнне шкоды Воіна падчас трываласці _павялічана да 60%_, раней 50%.\n\n_+2:_ Зніжэнне шкоды Воіна падчас трываласці _павялічана да 68%_, раней 50%.\n\n_+3:_ Зніжэнне шкоды Воіна падчас трываласці _павялічана да 74%_, раней 50%.\n\n_+4:_ Зніжэнне шкоды Воіна падчас трываласці _павялічана да 80%_, раней 50%.
actors.hero.talent.shrug_it_off.title=адмахнуцца ад гэтага
actors.hero.talent.silent_steps.desc=_+1:_ Разбойнік не абудзіць спячых ворагаў, калі ён знаходзіцца на адлегласці _3 ці больш клетак ад іх_.\n\n_+2:_ Разбойнік не абудзіць спячых ворагаў, калі ён _не знаходзіцца побач з імі_.
actors.hero.talent.silent_steps.title=ціхія крокі
actors.hero.talent.soul_eater.desc=_+1:_ Метка душы дае _0,33 ходу_ сытасці за кожную нанесеную фізічную шкоду. Ворагі з меткай душы маюць _10% шанец_ актываваць эфекты пры паглынанні пасля смерці.\n\n_+2:_ Метка душы дае _0,67 ходу_ сытасці за кожную нанесеную фізічную шкоду. Ворагі з меткай душы маюць _20% шанец_ актываваць эфекты пры паглынанні пасля смерці.\n\n_+3:_ Метка душы дае _1 ход_ сытасці за кожную нанесеную фізічную шкоду. Ворагі з меткай душы маюць _30% шанец_ актываваць эфекты пры паглынанні пасля смерці.
actors.hero.talent.soul_eater.title=пажыральнік душ
actors.hero.talent.soul_siphon.desc=_+1:_ Фізічная шкода, нанесеная іншымі персанажамі, актывуе метку душы Чарадзея з эфектыўнасцю _13%_.\n\n_+2:_ Фізічная шкода, нанесеная іншымі персанажамі, актывуе метку душы Чарадзея з эфектыўнасцю _27%_.\n\n_+3:_ Фізічная шкода, нанесеная іншымі персанажамі, актывуе метку душы Чарадзея з эфектыўнасцю _40%_.
actors.hero.talent.soul_siphon.title=сіфон душы
actors.hero.talent.speedy_stealth.desc=_+1:_ Вольны бегун атрымлівае 2 адзінкі імпульсу за ход, пакуль ён нябачны.\n\n_+2:_ Акрамя пераваг +1, вольны бег больш не адлічваецца, пакуль вольны бегун нябачны.\n\n_+3:_ Акрамя пераваг +1 і +2, вольны бегун рухаецца з 2-кратнай хуткасцю, пакуль ён нябачны, незалежна ад таго, ці ён вольны бегун, ці не.
actors.hero.talent.speedy_stealth.title=хуткі стэлс
actors.hero.talent.spirit_blades.desc=_+1:_ Спектральныя лязы маюць _30% шанец_ таксама выкарыстаць зачараванне на духоўным луку.\n\n_+2:_ Спектральныя лязы маюць _60% шанец_ таксама выкарыстаць зачараванне на духоўным луку.\n\n_+3:_ Спектральныя лязы маюць _90% шанец_ таксама выкарыстаць зачараванне на духоўным луку.\n\n_+4:_ Спектральныя лязы маюць _100% шанец_ таксама выкарыстаць зачараванне на духоўным луку, і гэта дае кожнаму зачараванню _+10% сілы_.
actors.hero.talent.spirit_blades.title=духоўныя ляза
actors.hero.talent.spirit_form.desc=Клірык можа выкарыстоўваць _Форму Духа_, якая напаўняе Тройцу сілай пярсцёнка або артэфакта, які Клірык вызначыў у гэтым праходзе (акрамя святога тома), за 4 зарады.\n\n_+1:_ Пры выкарыстанні Тройцы Клірык атрымлівае эфект пярсцёнка з _+1_ на 20 хадоў або актывуе эфект артэфакта з _+4._\n\n_+2:_ Пры выкарыстанні Тройцы Клірык атрымлівае эфект пярсцёнка з _+2_ на 20 хадоў або актывуе эфект артэфакта з _+6._\n\n_+3:_ Пры выкарыстанні Тройцы Клірык атрымлівае эфект пярсцёнка з _+3_ на 20 хадоў або актывуе эфект артэфакта з _+3. _+8._\n\n_+4:_ Пры выкарыстанні Тройцы Клірык атрымлівае эфект пярсцёнка з _+4_ на 20 хадоў або актывуе эфект артэфакта з _+10._\n\nТройца можа быць нададзена толькі адным эфектам духу адначасова. Артэфакты маюць розныя эфекты і кошт зараду даспехаў пры актывацыі Тройцай.
actors.hero.talent.spirit_form.title=духоўная форма
actors.hero.talent.stasis.desc=Клярык можа накласці _Стазіс_ на ўзмоцненага саюзніка за 2 зарады. Стазіс часова выводзіць саюзніка з падзямелля і захоўвае рэшту часу на ўсіх узмацненнях, у тым ліку на «Моц многіх». Саюзнік зноў з'явіцца побач з вамі, калі эфект скончыцца. Стазіс можна імгненна і бясплатна перакарыстаць, каб датэрмінова спыніць эфект. Стазіс дзейнічае на нерухомых саюзнікаў, але нельга перамяшчаць іх паміж паверхамі падзямелля.\n\n_+1:_ Стазіс доўжыцца максімум _60 хадоў._\n\n_+2:_ Стазіс доўжыцца максімум _90 хадоў._\n\n_+3:_ Стазіс доўжыцца максімум _120 хадоў._\n\n_+4:_ Стазіс доўжыцца максімум _150 хадоў._\n\nКлярык таксама можа выкарыстоўваць «Прамень жыцця», калі саюзнік знаходзіцца ў стазісе, каб аднавіць яго, або выкарыстоўваць «Сувязь жыцця», каб прэвентыўна прымяніць яе эфект. Аднак саюзнікі не атрымліваюць карысці ад «Сувязі жыцця», пакуль яны знаходзяцца ў стазісе.
actors.hero.talent.stasis.title=застой
actors.hero.talent.strengthening_meal.desc=_+1:_ Ужыванне ежы дае Дуэлянту 3 бонусныя пашкоджанні наступныя _2 разы_, калі яна ўдарае ворага фізічнай атакай.\n\n_+2:_ Ужыванне ежы дае Дуэлянту 3 бонусныя пашкоджанні наступныя _3 разы_, калі яна ўдарае ворага фізічнай атакай.
actors.hero.talent.strengthening_meal.title=падмацоўвальны прыём ежы
actors.hero.talent.striking_force.desc=_+1:_ Сіла эфекту стыхійнага ўдару павялічваецца на _30%_.\n\n_+2:_ Сіла эфекту стыхійнага ўдару павялічваецца на _60%_.\n\n_+3:_ Сіла эфекту стыхійнага ўдару павялічваецца на _90%_.\n\n_+4:_ Сіла эфекту стыхійнага ўдару павялічваецца на _120%_.
actors.hero.talent.striking_force.title=ударная сіла
actors.hero.talent.striking_wave.desc=_+1:_ У Шоквейва ёсць _30% верагоднасць_ выкарыстоўваць эфекты пры ўдары, такія як чары і камбінацыі.\n\n_+2:_ У Шоквейва ёсць _60% верагоднасць_ выкарыстоўваць эфекты пры ўдары, такія як чары і камбінацыі.\n\n_+3:_ У Шоквейва ёсць _90% верагоднасць_ выкарыстоўваць эфекты пры ўдары, такія як чары і камбінацыі.\n\n_+4:_ У Шоквейва ёсць _100% верагоднасць_ выкарыстоўваць эфекты пры ўдары, такія як чары і камбінацыі, і ён дае чарам _+20% сілы_.
actors.hero.talent.striking_wave.title=ударная хваля
actors.hero.talent.strongman.desc=_+1:_ Сіла Воіна _павялічваецца на 8%_, акругляецца ў меншы бок.\n\n_+2:_ Сіла Воіна _павялічваецца на 13%_, акругляецца ў меншы бок.\n\n_+3:_ Сіла Воіна _павялічваецца на 18%_, акругляецца ў меншы бок.
actors.hero.talent.strongman.title=асілак
actors.hero.talent.sucker_punch.desc=_+1:_ Разбойнік наносіць _1-2 бонусныя пашкоджанні_ пры першай нечаканай атацы на ворага.\n\n_+2:_ Разбойнік наносіць _2 бонусныя пашкоджанні_ пры першай нечаканай атацы на ворага.
actors.hero.talent.sucker_punch.title=прысоскі ўдар
actors.hero.talent.sunray.desc=_+1:_ Клірык можа выкарыстоўваць _Сонечны прамень_, загавор, які наносіць _4-8 адзінак шкоды_ і асляпляе цэль на _4 хады,_ коштам 1 зарада.\n\n_+2:_ Клірык можа выкарыстоўваць _Сонечны прамень_, загавор, які наносіць _6-12 адзінак шкоды_ і асляпляе цэль на _6 хадоў,_ коштам 1 зарада.\n\nСонечны прамень можа асляпіць кожную цэль толькі адзін раз, але калі цэль ужо аслеплена Сонечным прамянём, то ён паралізуе яе. Сонечны прамень заўсёды наносіць максімальную шкоду дэманам і нябожчыкам.
actors.hero.talent.sunray.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага прымушае палачкі і артэфакты асляпляць ворагаў на 4 хады, 15% часу пры +1 або 25% часу пры +2.
actors.hero.talent.sunray.title=сонечны прамень
actors.hero.talent.survivalists_intuition.desc=_+1:_ Паляўнічая распазнае кідальную зброю _3 разы хутчэй_.\n\n_+2:_ Паляўнічая распазнае кідальную зброю, _калі б'е ёю_.
actors.hero.talent.survivalists_intuition.title=інтуіцыя выжывальніка
actors.hero.talent.sustained_retribution.desc=_+1:_ Воін наносіць _115% бонуснай шкоды_, размеркаванай на _2 ўдары_, замест 100% бонуснай шкоды за 1 ўдар.\n\n_+2:_ Воін наносіць _130% бонуснай шкоды_, размеркаванай на _3 ўдары_, замест 100% бонуснай шкоды за 1 ўдар.\n\n_+3:_ Воін наносіць _145% бонуснай шкоды_, размеркаванай на _4 ўдары_, замест 100% бонуснай шкоды за 1 ўдар.\n\n_+4:_ Воін наносіць _160% бонуснай шкоды_, размеркаванай на _5 ўдараў_, замест 100% бонуснай шкоды за 1 ўдар.
actors.hero.talent.sustained_retribution.title=працяглая адплата
actors.hero.talent.swift_equip.desc=_+1:_ Дуэлянт можа імгненна мяняць сваю экіпіраваную зброю _адзін раз_ кожныя 20 хадоў.\n\n_+2:_ Дуэлянт можа імгненна мяняць сваю экіпіраваную зброю _два разы_ кожныя 20 хадоў.\n\nКалі ў Дуэлянта ёсць гэты талент, і ён не на перазарадцы, хуткае выкарыстанне неэкіпіраванай зброі дазволіць яму набыць яго.
actors.hero.talent.swift_equip.title=хуткае абсталяванне
actors.hero.talent.swift_spirit.desc=_+1:_ Хуткасць перамяшчэння духоўнага ястраба павялічваецца з 2 да _2,5 плітак_, і ён гарантавана ўхіляецца ад першых _2 атак_, зробленых супраць яго.\n\n_+2:_ Хуткасць перамяшчэння духоўнага ястраба павялічваецца з 2 да _3 плітак_, і ён гарантавана ўхіляецца ад першых _4 атак_, зробленых супраць яго.\n\n_+3:_ Хуткасць перамяшчэння духоўнага ястраба павялічваецца з 2 да _3,5 плітак_, і ён гарантавана ўхіляецца ад першых _6 атак_, зробленых супраць яго.\n\n_+4:_ Хуткасць перамяшчэння духоўнага ястраба павялічваецца з 2 да _4 плітак_, і ён гарантавана ўхіляецца ад першых _8 атак_, зробленых супраць яго.
actors.hero.talent.swift_spirit.title=хуткі дух
actors.hero.talent.telefrag.desc=_+1:_ Калі Маг ператвараецца ў іншага персанажа, ён наносіць яму _10-15 адзінак шкоды_, але таксама атрымлівае _5 адзінак шкоды_.\n\n_+2:_ Калі Маг ператвараецца ў іншага персанажа, ён наносіць яму _20-30 адзінак шкоды_, але таксама атрымлівае _10 адзінак шкоды_.\n\n_+3:_ Калі Маг ператвараецца ў іншага персанажа, ён наносіць яму _30-45 адзінак шкоды_, але таксама атрымлівае _15 адзінак шкоды_.\n\n_+4:_ Калі Маг ператвараецца ў іншага персанажа, ён наносіць яму _40-60 адзінак шкоды_, але таксама атрымлівае _20 адзінак шкоды_.\n\nГероя нельга забіць гэтым талентам, сабе шкоду можна паменшыць з дапамогай эфектаў супраціву магіі.
actors.hero.talent.telefrag.title=Тэлефраг
actors.hero.talent.thiefs_intuition.desc=_+1:_ Разбойнік вызначае пярсцёнкі _2 разы хутчэй_ і вызначае тып пярсцёнка _калі апранае яго_.\n\n_+2:_ Разбойнік вызначае пярсцёнкі _калі апранае іх_ і вызначае тып пярсцёнка _калі бярэ яго_.
actors.hero.talent.thiefs_intuition.title=інтуіцыя злодзея
actors.hero.talent.twin_upgrades.desc=_+1:_ Калі адна з дзвюх экіпіраваных адзінак зброі Чэмпіёна мае ніжэйшы ўзровень і на _2 ці больш узроўняў ніжэйшая_ за іншую зброю, яна будзе палепшана да ўзроўню іншай зброі.\n\n_+2:_ Калі адна з дзвюх экіпіраваных адзінак зброі Чэмпіёна мае ніжэйшы ўзровень і на _1 ці больш узроўняў ніжэйшая_ за іншую зброю, яна будзе палепшана да ўзроўню іншай зброі.\n\n_+3:_ Калі адна з дзвюх экіпіраваных адзінак зброі Чэмпіёна мае ніжэйшы ўзровень і на _таму ж узровень або ніжэйшы_ за іншую зброю, яна будзе палепшана да ўзроўню іншай зброі.
actors.hero.talent.twin_upgrades.title=падвойныя мадэрнізацыі
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Манах атрымлівае _на _50% больш энергіі_ за кожны прадмет рыштунку _3-га ўзроўню або ніжэйшага_, які ён выкарыстоўвае.\n\n_+2:_ Манах атрымлівае _на _75% больш энергіі_ за кожны прадмет рыштунку _2-га ўзроўню або ніжэйшага_, які ён выкарыстоўвае. Перавага 3-га ўзроўню застаецца нязменнай.\n\n_+3:_ Манах атрымлівае _на _100% больш энергіі_ за кожны прадмет рыштунку _1-га ўзроўню або ніжэйшага_, які ён выкарыстоўвае. Перавагі 2-га і 3-га ўзроўняў застаюцца нязменнымі. Ён таксама атрымлівае бясплатныя тканінныя даспехі і пальчаткі з шыпамі.\n\nЗвярніце ўвагу, што гэты талент не дае пераваг ад таго, што ён без зброі або атакуе з дапамогай Пярсцёнка Сілы.
actors.hero.talent.unencumbered_spirit.title=неабцяжараны дух
actors.hero.talent.varied_charge.desc=_+1:_ Чэмпіёнка імгненна аднаўляе _0,17 зарадаў зброі_, калі выкарыстоўвае дзве розныя здольнасці зброі, без абмежавання па часе.\n\n_+2:_ Чэмпіёнка імгненна аднаўляе _0,33 зарадаў зброі_, калі выкарыстоўвае дзве розныя здольнасці зброі, без абмежавання па часе.\n\n_+3:_ Чэмпіёнка імгненна аднаўляе _0,5 зарадаў зброі_, калі выкарыстоўвае дзве розныя здольнасці зброі, без абмежавання па часе.
actors.hero.talent.varied_charge.title=разнастайны зарад
actors.hero.talent.veterans_intuition.desc=_+1:_ Воін распазнае зброю _1,75 раза хутчэй_ і браню _2,5 раза хутчэй_.\n\n_+2:_ Воін распазнае зброю _2,5 раза хутчэй_ і браню _калі ён яе экіпіруе_.
actors.hero.talent.veterans_intuition.title=інтуіцыя ветэрана
actors.hero.talent.wall_of_light.desc=_+1:_ Паладзін можа выкарыстоўваць _Сцяну Святла_, загавор, які стварае перад Паладзінам суцэльную сцяну шырынёй _3 клеткі_, якая адштурхоўвае ворагаў і дзейнічае 20 хадоў, коштам 3 зарадаў.\n\n_+2:_ Паладзін можа выкарыстоўваць _Сцяну Святла_, загавор, які стварае перад Паладзінам суцэльную сцяну шырынёй _5 клетак_, якая адштурхоўвае ворагаў і дзейнічае 20 хадоў, коштам 3 зарадаў.\n\n_+3:_ Паладзін можа выкарыстоўваць _Сцяну Святла_, загавор, які стварае перад Паладзінам суцэльную сцяну шырынёй _7 клетак_, якая адштурхоўвае ворагаў і дзейнічае 20 хадоў, коштам 3 зарадаў.\n\nСцяну можна размясціць па баках святла або па дыяганалі, адначасова можа існаваць толькі адна сцяна.
actors.hero.talent.wall_of_light.title=сцяна святла
actors.hero.talent.wand_preservation.desc=_+1:_ Калі Маг убудоўвае новую палачку ў свой персанал, старая палачка вяртаецца з +0, _але гэта можна зрабіць толькі адзін раз._\n\n_+2:_ Калі Маг убудоўвае новую палачку ў свой персанал, старая палачка вяртаецца з +0, _гэта можна паўтарыць з часам аднаўлення на адзін узровень героя._
actors.hero.talent.wand_preservation.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён замест гэтага павялічыць колькасць таямнічай смалы, якую атрымлівае пры кладцы палачкі ў алхімічны гаршчок, на 1 пры +1 або на 2 пры +2.
actors.hero.talent.wand_preservation.title=захаванне палачкі
actors.hero.talent.weapon_recharging.desc=_+1:_ Дуэлянт атрымлівае адзін зарад зброі кожныя _15 хадоў_, калі знаходзіцца пад уздзеяннем бафаў перазарадкі палачкі або артэфакта.\n\n_+2:_ Дуэлянт атрымлівае адзін зарад зброі кожныя _10 хадоў_, калі знаходзіцца пад уздзеяннем бафаў перазарадкі палачкі або артэфакта.
actors.hero.talent.weapon_recharging.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён будзе наносіць +5% шкоды ў блізкім бою падчас перазарадкі з +1 або +7,5% шкоды ў блізкім бою падчас перазарадкі з +2.
actors.hero.talent.weapon_recharging.title=перазарадка зброі
actors.hero.talent.wide_search.desc=_+1:_ Радыус пошуку Разбойніка павялічаны з квадрата 5x5 да круга 7x7.\n\n_+2:_ Радыус пошуку Разбойніка павялічаны з квадрата 5x5 да квадрата 7x7.
actors.hero.talent.wide_search.meta_desc=_Калі гэты талент атрымлівае іншы герой_, ён павялічыць радыус пошуку з квадрата 3x3 да круга 5x5 пры +1 або да квадрата 5x5 пры +2.
actors.hero.talent.wide_search.title=шырокі пошук
actors.hero.talent.wild_momentum.desc=_+1:_ Забойства ворага духоўным лукам падаўжае працягласць сілы прыроды на _1 ход_. Працягласць можа быць падоўжана максімум на _2 хады_.\n\n_+2:_ Забойства ворага духоўным лукам падаўжае працягласць сілы прыроды на _2 хады_. Працягласць можа быць падоўжана максімум на _4 хады_.\n\n_+3:_ Забойства ворага духоўным лукам падаўжае працягласць сілы прыроды на _3 хады_. Працягласць можа быць падоўжана максімум на _6 хадоў_.\n\n_+4:_ Забойства ворага духоўным лукам падаўжае працягласць сілы прыроды на _4 хады_. Працягласць можа быць падоўжана максімум на _8 хадоў_.
actors.hero.talent.wild_momentum.title=дзікі імпульс
actors.hero.talent.wild_power.desc=_+1:_ Пры выкарыстанні дзікай магіі палачкі будуць узмоцнены на _2 або 3, максімум да +4_.\n\n_+2:_ Пры выкарыстанні дзікай магіі палачкі будуць узмоцнены на _3, максімум да +5_.\n\n_+3:_ Пры выкарыстанні дзікай магіі палачкі будуць узмоцнены на _3 або 4, максімум да +6_.\n\n_+4:_ Пры выкарыстанні дзікай магіі палачкі будуць узмоцнены на _4, максімум да +7_.
actors.hero.talent.wild_power.title=дзікая сіла
actors.mobs.acidic.desc=Гэтыя велізарныя дэманічныя істоты, падобныя на павукападобных, пазбягаюць блізкага бою, аддаючы перавагу страляць з вялікай адлегласці калечачымі зубчастымі шыпамі. Здаецца, гэтая прасякнута едкай сліззю.
actors.mobs.acidic.name=кіслы скарпіён
actors.mobs.albino.desc=Гэта рэдкая парода сумчатых пацукоў з чыста белай поўсцю і вострымі зубамі.
actors.mobs.albino.discover_hint=Гэтага ворага рэдка можна сустрэць у пэўным рэгіёне падзямелля.
actors.mobs.albino.name=альбінос-пацук
actors.mobs.armoredbrute.desc=Найстарэйшыя гнолскія грубіяны часта носяць магутныя даспехі, каб паказаць свой статус. Даспехі робяць гэтых грубіянаў значна больш устойлівымі да фізічнай шкоды, а іх большая дысцыпліна азначае, што яны могуць лютаваць значна даўжэй, перш чым паддацца атрыманым ранам.
actors.mobs.armoredbrute.name=браняваны звер
actors.mobs.armoredstatue.desc=Можна падумаць, што гэта проста яшчэ адна з нежывых статуй з гэтага падзямелля, але чырвоныя, зіхатлівыя вочы выдаюць гэта. \n\nЗдаецца, што яна ў выдатным стане, бо з-за даспехаў яе можа быць вельмі цяжка забіць.
actors.mobs.armoredstatue.desc_arm_wep=Хоць сама статуя зроблена з каменя, _%1$s_ і _%2$s_, якімі яна трымае, выглядаюць як сапраўдныя.
actors.mobs.armoredstatue.name=браняваная статуя
actors.mobs.bandit.desc=Глыбокія ўзроўні падзямелля заўсёды былі сховішчам для ўсялякіх злачынцаў. Не ўсе з іх маглі захоўваць ясны розум падчас працяглага знаходжання так далёка ад дзённага святла. Даўно гэтыя вар'яты злодзеі і бандыты забыліся, хто яны і чаму крадуць.
actors.mobs.bandit.name=шалёны бандыт
actors.mobs.bat.desc=Гэтыя спрытныя і жывучыя жыхары пячор значна больш небяспечныя, чым здаюцца. Яны папаўняюць сваё здароўе з кожнай паспяховай атакай, што дазваляе ім перамагаць значна больш буйных супернікаў.
actors.mobs.bat.name=кажан-вампір
actors.mobs.bee.desc=Нягледзячы на невялікія памеры, залатыя пчолы, як правіла, люта абараняюць свой дом. Гэтая вельмі злосная, лепш трымайцеся на адлегласці.
actors.mobs.bee.desc_honey=Нягледзячы на невялікія памеры, залатыя пчолы, як правіла, люта абараняюць свой дом. Гэтая пчола супакоілася і, здаецца, хоча ісці за вамі.
actors.mobs.bee.discover_hint=Вы можаце знайсці гэтага персанажа з дапамогай пэўнага прадмета.
actors.mobs.bee.name=залатая пчала
actors.mobs.brute$bruterage.desc=Гэты гнол-брут памірае, але хоча забраць цябе з сабой!\n\nБрут памрэ, калі яго шчыт знікне, альбо з-за часу, альбо калі ён будзе пашкоджаны. Тым часам ён будзе наносіць значна большую шкоду, таму будзьце ўважлівыя!\n\nШчыт застаўся: %d.
actors.mobs.brute$bruterage.name=грубая лютасць
actors.mobs.brute.def_verb=заблакаваны
actors.mobs.brute.desc=Здаравякі — самыя буйныя, моцныя і трывалыя з усіх гнолаў. Цяжка параненыя, яны ўпадаюць у шаленства і наносяць ворагам яшчэ большую шкоду.
actors.mobs.brute.enraged=раз'юшаны
actors.mobs.brute.name=гнол-здаравяк
actors.mobs.causticslime.desc=Здаецца, гэты слізь запэцканы цёмнай магіяй, якая зыходзіць знізу. Ён страціў свой звычайны зялёны колер і з яго цячэ едкая слізь.
actors.mobs.causticslime.discover_hint=Гэтага ворага рэдка можна сустрэць у пэўным рэгіёне падзямелля.
actors.mobs.causticslime.name=едкі слізь
actors.mobs.crab.desc=Гэтыя велізарныя крабы знаходзяцца на вяршыні харчовага ланцуга ў каналізацыі. Яны надзвычай хуткія, а іх тоўсты панцыр можа вытрымліваць моцныя ўдары.
actors.mobs.crab.name=каналізацыйны краб
actors.mobs.crystalguardian.def_verb=заблакаваны
actors.mobs.crystalguardian.desc=Гэтыя вялікія крышталічныя ахоўнікі выглядаюць амаль як статуі, калі б не іх яркія, зіхатлівыя вочы. Зацвярдзелы крышталь, з якога яны зроблены, робіць іх павольнымі, але вельмі вынослівымі, таму _лепш пакінуць іх спаць у крыштальным гняздзе як мага даўжэй._\n\nЗ-за сваіх памераў крыштальныя ахоўнікі рухаюцца значна павольней у замкнёных прасторах. Яны таксама настолькі вынослівыя, што іх немагчыма забіць адразу. Іх можна збіць і часова паралізаваць, але яны зноў устануць праз некаторы час.
actors.mobs.crystalguardian.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.crystalguardian.name=крыштальны захавальнік
actors.mobs.crystalmimic.ate=Імітатар з'еў твой %s!
actors.mobs.crystalmimic.desc=Мімікі — гэта чароўныя істоты, якія могуць прымаць любую форму. У падзямеллях яны амаль заўсёды выбіраюць форму куфра са скарбамі, каб прывабіць нічога не падазравалых шукальнікаў прыгод. \n\nКрыштальныя мімікі больш хітрыя, чым іх звычайныя сваякі, і аддаюць перавагу пазбягаць канфліктаў падчас крадзяжу здабычы. Яны будуць спрабаваць уцячы, як толькі іх выявяць, і маюць магчымасць змяняць пазіцыі ворагаў падчас атакі.
actors.mobs.crystalmimic.escaped=Крыштальны імітатор уцёк!
actors.mobs.crystalmimic.name=крыштальная імітацыя
actors.mobs.crystalspire.alert=Вібрацыя ўзмацняецца і грымоціць па ўсёй пячоры!
actors.mobs.crystalspire.desc=Гэты гіганцкі шпіль з ультрацвёрдага крышталя, верагодна, з'яўляецца крыніцай усіх дзіўных крышталічных істот у гэтай пячоры. Звычайная зброя супраць яго неэфектыўная, таму вам трэба будзе выкарыстаць кірку, калі вы хочаце яго знішчыць.\n\n_Пераканайцеся, што вы гатовыя, перш чым пачаць яго разбіваць._ Дабыча такога вялікага крышталя, верагодна, зойме некаторы час, і вы, верагодна, не зможаце зрабіць гэта спакойна. Сам шпіль можа нават мець нейкія сродкі самаабароны._Магчыма, уласныя атакі шпіля можна было б выкарыстоўваць супраць яго паслугачоў._
actors.mobs.crystalspire.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.crystalspire.name=крыштальны шпіль
actors.mobs.crystalspire.warning=Крышталь вібруе, калі вы па ім ударыце. Калі вы будзеце працягваць гэта рабіць, гэта абавязкова прыцягне да вас увагу...
actors.mobs.crystalwisp.beam_kill=Прамень святла забіў цябе...
actors.mobs.crystalwisp.desc=Невялікі раз'юшаны лунаючы кавалак зацвярдзелага крышталя, які выпраменьвае яркае ззянне. Хоць крышталічныя агеньчыкі і не асабліва моцныя, яны страляюць у вас разбуральным праменем святла, калі маюць выразны кідок. \n\nАгеньчыкі дастаткова малыя, каб лёгка перамяшчацца праз розныя выступы крышталя, але яны не здольныя прастрэліць іх.
actors.mobs.crystalwisp.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.crystalwisp.name=крыштальны ажыначак
actors.mobs.demonspawner.desc=Гэтая скрыўленая сумесь гномскай плоці адказвае за стварэнне дэманаў-раздзіральнікаў з гномаў, якія загінулі ў гэтым рэгіёне. Відавочна, што дэманы не бачаць праблем у выкарыстанні ўсіх магчымых рэсурсаў супраць сваіх ворагаў.\n\nНягледзячы на візуальную жахлівасць, дэманы-спараджальнікі не маюць сродкаў для перамяшчэння або непасрэднай абароны. Аднак іх значная маса робіць іх цяжкімі для хуткага забойства, і яны будуць спараджаць дэманаў-раздзіральнікаў хутчэй, калі ім пагражае небяспека.\n\n_Дэманы-спараджальнікі, здаецца, звязаны з нейкай цэнтральнай крыніцай дэманічнай сілы. Іх забойства можа аслабіць яе._
actors.mobs.demonspawner.name=спараджальнік дэманаў
actors.mobs.demonspawner.on_death=Дэманічная энергія тут, здаецца, памяншаецца па меры таго, як памірае спаўнер.
actors.mobs.dm100.desc=DM-100 — гэта ранняя мадэль гномскай «абарончай машыны», прызначаная для абароны гномскіх шахцёраў у пячорах пад гэтай турмой. Аднак іх электрычныя разрады аказаліся занадта слабымі, таму іх падораць гораду людзей наверсе. Яны гадамі не выкарыстоўваліся і ў рэшце рэшт трапілі ў турму, дзе наглядчык спачатку палічыў іх занадта жорсткімі для выкарыстання. Аднак, калі зняволеныя сталі больш непаслухмянымі, яны сталі неабходнасцю.
actors.mobs.dm100.name=ДМ-100
actors.mobs.dm100.zap_kill=Маланка забіла цябе...
actors.mobs.dm200.desc=DM-200 — гэта другое пакаленне гномьіх «абарончых машын», прызначаных для абароны гномьіх шахцёраў у пячорах і горадзе ўнізе. Яны значна большыя і масіўнейшыя за сваіх папярэднікаў і атакуюць разбуральнымі гідраўлічнымі кулакамі.\n\nІх павялічаны памер таксама з'яўляецца іх асноўнай слабасцю, бо яны не могуць змясціцца ў вузкіх тунэлях і дзвярных праёмах падзямелля. Гномы змаглі кампенсаваць адсутнасць мабільнасці DM-200, дазваляючы ім выпускаць свае таксічныя выхлапныя газы на далёкіх ворагаў або ворагаў, да якіх яны не могуць дабрацца.
actors.mobs.dm200.name=ДМ-200
actors.mobs.dm200.vent=DM-200 выпускае струмень таксічных выхлапных газаў!
actors.mobs.dm201.desc=Гномы ненадоўга эксперыментавалі з больш моцным акцэнтам на адсутнасці мабільнасці DM-200 і стварылі некалькі цалкам стацыянарных мадэляў DM. DM-201 — гэта мадэрнізаваны DM-200, які выконвае ролю вартавой вежы без магчымасці перамяшчэння. У абмен на адсутнасць мабільнасці, DM-201 маюць значна большую трываласць і атакуючую моц. \n\nA У DM-201 няма рухавіка для выхлапных газаў, замест гэтага гномы абсталявалі іх гранатамі з агрэсіўным газам! Аднак DM-201 асцярожныя з гэтымі гранатамі і кідаюць іх толькі пры атацы з адлегласці.
actors.mobs.dm201.name=ДМ-201
actors.mobs.dm201.vent=DM-201 кідае каразійную гранату!
actors.mobs.dm300.charge_lost=ПІЛОН ЗНІШЧАНЫ! ВЯРТАННЕ ДА ЛАКАЛЬНАГА ЭЛЕКТРАЭНЕРГЕТЫЧНАГА ПАСТАНАЎЛЕННЯ!
actors.mobs.dm300.charging=ПАШКОДЖАННЕ! АКТЫВАЦЫЯ ЭНЕРГЕТЫЧНАГА ПІЛОНА!
actors.mobs.dm300.charging_hint=DM-300 непаражальны, пакуль знаходзіцца пад энергіяй ад пілона!
actors.mobs.dm300.def_verb=заблакаваны
actors.mobs.dm300.defeated=КРЫТЫЧНАЕ ПАШКОДЖАННЕ! СПРОБА ЗАКРЫЦЦЯ-
actors.mobs.dm300.desc=Гэтую машыну дворфы стварылі некалькі стагоддзяў таму. Пазней яны пачалі замяняць машыны големамі, элементалямі і нават дэманамі. Урэшце гэта прывяло іх цывілізацыю да заняпаду. DM-300 і падобныя машыны звычайна працавалі на будоўлях і ў шахтах, а часам і абаранялі горад.
actors.mobs.dm300.desc_supercharged=DM-300 зараз цалкам зараджаны электрычнай энергіяй. У гэтым выглядзе DM-300 не можа быць пашкоджаны і рухаецца з падвоенай хуткасцю! Акрамя таго, яго свердзел цяпер круціцца дастаткова хутка, каб _прабіваць тунэлі праз цвёрдую пароду_, хоць пры гэтым ён рухаецца значна павольней.\n\nАтакаваць DM-300 непасрэдна бессэнсоўна, пакуль ён перазараджаны, але _нешта ў гэтым раёне павінна забяспечваць яго гэтай энергіяй_, знішчаючы тое, што можа аслабіць яго.
actors.mobs.dm300.name=ДМ-300
actors.mobs.dm300.notice=ВЫЯЎЛЕНЫ НЕАЎТАРЫЗАВАНЫ ПЕРСАНАЛ!
actors.mobs.dm300.pylons_destroyed=ТРЫВОГА! У ЭЛЕКТРАСЕТЦЫ ВЫЯЎЛЕНА НЕСТАБІЛЬНАСЦЬ!
actors.mobs.dm300.rankings_desc=Знішчаны DM-300
actors.mobs.dm300.shield=DM-300 атрымлівае энергію з адкрытых правадоў і экрануе сябе!
actors.mobs.dm300.supercharged=ЗНІШЧЫЦЬ! ЗНІШЧЫЦЬ! ЗНІШЧЫЦЬ!
actors.mobs.dwarfking$dkghoul.rankings_desc=Упаў перад каралём гномаў
actors.mobs.dwarfking$dkgolem.rankings_desc=Упаў перад каралём гномаў
actors.mobs.dwarfking$dkmonk.rankings_desc=Упаў перад каралём гномаў
actors.mobs.dwarfking$dkwarlock.rankings_desc=Упаў перад каралём гномаў
actors.mobs.dwarfking.defeated=Ты... асудзіў нас усіх...
actors.mobs.dwarfking.desc=Шмат гадоў таму адзін з найвышэйшых чараўнікоў гномскага двара раскрыў сакрэты, якія далі яму велізарную ўладу над жыццём і смерцю. Неўзабаве ён выкарыстаў гэтую сілу, падпарадкоўваючы і разбэшчваючы сваіх аднагодкаў, свайго караля і, у рэшце рэшт, кожнага гнома-грамадзяніна. Цяпер ён кароль, кіраўнік над легіёнам нежыці.\n\nКароль гномаў — агрэсіўны вораг, які будзе спрабаваць акружыць і знішчыць сваіх ворагаў сваёй ардой нежыці-паслуг.
actors.mobs.dwarfking.enraged=Ты не можаш мяне забіць, %s. Я. БЕССМЕРЦНЫ!
actors.mobs.dwarfking.lifelink_1=Мне патрэбна твая сутнасць, раб!
actors.mobs.dwarfking.lifelink_2=Пралівай кроў за мяне, раб!
actors.mobs.dwarfking.losing=Не! Ты не можаш гэтага зрабіць... ты паняцця не маеш, што ляжыць унізе...
actors.mobs.dwarfking.name=Кароль гномаў
actors.mobs.dwarfking.notice=Як ты смееш! Ты нават не ўяўляеш, у што ўмешваешся!
actors.mobs.dwarfking.rankings_desc=Упаў перад каралём гномаў
actors.mobs.dwarfking.teleport_1=Разбярыся з імі, раб!
actors.mobs.dwarfking.teleport_2=Займі іх, раб!
actors.mobs.dwarfking.wave_1=Досыць! Уставайце, мае рабы!
actors.mobs.dwarfking.wave_2=Больш! Пралівайце кроў за свайго караля!
actors.mobs.dwarfking.wave_3=Бескарысна! ЗАБІЦЕ ІХ ЗАРАЗ!
actors.mobs.ebonymimic.desc=Мімікі — гэта чароўныя істоты, якія могуць прымаць любую форму. У падзямеллях яны амаль заўсёды выбіраюць форму куфра са скарбамі, каб прывабіць нічога не падазравалых шукальнікаў прыгод. \n\nЭбанітавыя мімікі — гэта хітрыя мімікі, здольныя рабіць сябе амаль нябачнымі. Яны хаваюцца на рэчах, з якімі шукальнікі прыгод могуць узаемадзейнічаць, але таксама ўтрымліваюць уласную здабычу. Яны не мацнейшыя за звычайных мімікаў, калі іх знаходзяць, але іх нечаканы ўкус разбуральны.
actors.mobs.ebonymimic.discover_hint=Вы можаце знайсці гэтага ворага з дапамогай спецыяльнай цацанкі.
actors.mobs.ebonymimic.hidden_desc=Здаецца, тут нешта ёсць, але гэта амаль цалкам празрыста.
actors.mobs.ebonymimic.hidden_name=падазроны контур
actors.mobs.ebonymimic.name=імітацыя чорнага дрэва
actors.mobs.ebonymimic.reveal=Там быў мімікрык!
actors.mobs.elemental$chaoselemental.desc=Элементалі — гэта хаатычныя істоты, якія часта ўзнікаюць, калі магутная акультная магія не кантралюецца належным чынам. Элементалі маюць мінімальны інтэлект і звычайна асацыююцца з пэўным тыпам магіі. \n\nЭлементалі хаосу — гэта рэдкія і небяспечныя элементалі, якія не стабілізаваліся да пэўнай стыхіі. Пры атацы яны вызваляюць дзікую непрадказальную магію.
actors.mobs.elemental$chaoselemental.name=элементар хаосу
actors.mobs.elemental$fireelemental.desc=Элементалі — гэта хаатычныя істоты, якія часта ўзнікаюць, калі магутная акультная магія не кантралюецца належным чынам. Элементалі маюць мінімальны інтэлект і звычайна асацыююцца з пэўным тыпам магіі.\n\nАгністыя элементалі — распаўсюджаны тып элементаляў, якія наносяць шкоду вогненнай магіяй. Яны падпальваюць сваю цэль атакамі ў блізкім бою, а часам могуць страляць агністымі стрэламі.
actors.mobs.elemental$fireelemental.name=стыхія агню
actors.mobs.elemental$frostelemental.desc=Элементалі — гэта хаатычныя істоты, якія часта ўзнікаюць, калі магутная акультная магія не кантралюецца належным чынам. Элементалі маюць мінімальны інтэлект і звычайна асацыююцца з пэўным тыпам магіі.\n\nМарозныя элементалі — распаўсюджаны тып элементаляў, якія аслабляюць ворагаў магіяй астуджэння. Яны будуць астуджаць сваю цэль блізкім боем і часам дыстанцыйнымі атакамі. Іх магія значна больш эфектыўная ў вадзе.
actors.mobs.elemental$frostelemental.name=стыхія лёду
actors.mobs.elemental$newbornfireelemental.charging=Элементаль зараджаецца!
actors.mobs.elemental$newbornfireelemental.desc=Элементалі — гэта хаатычныя істоты, якія часта ўзнікаюць, калі магутная акультная магія не кантралюецца належным чынам. Элементалі маюць мінімальны інтэлект і звычайна асацыююцца з пэўным тыпам магіі.\n\nГэты агністы элементаль нядаўна выкліканы, але ўсё яшчэ даволі небяспечны!
actors.mobs.elemental$newbornfireelemental.desc_ally=Паколькі гэты элементаль быў выкліканы загаворам, ён мае крыху большы кантроль над сваім полымем. Ён не здольны здзяйсняць атакі на адлегласці, але падпальвае ворагаў, якіх атакуе ў блізкім бою.
actors.mobs.elemental$newbornfireelemental.desc_boss=З-за хаатычнага характару свайго выкліку гэты элементаль можа распаўсюджваць агонь толькі недакладнымі выбухамі пасля таго, як правядзе ход зарадкі.
actors.mobs.elemental$newbornfireelemental.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.elemental$newbornfireelemental.name=нованароджаны элемент агню
actors.mobs.elemental$shockelemental.desc=Элементалі — гэта хаатычныя істоты, якія часта ўзнікаюць, калі магутная акультная магія не кантралюецца належным чынам. Элементалі маюць мінімальны інтэлект і звычайна асацыююцца з пэўным тыпам магіі.\n\nЭлементалі-шокеры — гэта менш распаўсюджаны тып элементаляў, якія парушаюць працу сваіх ворагаў электрычнасцю і ўспышкамі святла. У блізкім бою яны запускаюць электрычную дугу ў бліжэйшых ворагаў і наносяць дадатковую шкоду сваёй асноўнай цэлі, калі тая знаходзіцца ў вадзе. Яны таксама часам факусуюць на сваёй цэлі дыстанцыйны выбух святла, часова асляпляючы яе.
actors.mobs.elemental$shockelemental.name=стыхійны ўдар
actors.mobs.eye.deathgaze_kill=Смяротны позірк забіў цябе...
actors.mobs.eye.desc=Гэтага дэмана таксама называюць «шарам нянавісці». Убачыўшы ворага, ён бяздумна ўжывае свой смяротны позірк, часта не зважаючы на саюзнікаў і ранячы іх.
actors.mobs.eye.name=злое вока
actors.mobs.fetidrat.desc=З гэтым пацуком відавочна нешта не так. Яго тлустая чорная поўсць і гнілая скура вельмі адрозніваюцца ад здаровых пацукоў, якіх вы бачылі раней. Яго бледна-зялёныя вочы робяць яго асабліва пагрозлівым.\n\nПацук нясе з сабой воблака жудаснага смуроду, зблізку ён неверагодна моцны.\n\nЗ рота пацука цячэ цёмная слізь, ён прагрызае падлогу, але, здаецца, раствараецца ў вадзе.
actors.mobs.fetidrat.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.fetidrat.name=смуродны пацук
actors.mobs.fungalcore.desc=Гэты гіганцкі грыб, напэўна, і з'яўляецца крыніцай усёй грыбковай актыўнасці ў гэтай пячоры.
actors.mobs.fungalcore.name=грыбковае ядро
actors.mobs.fungalsentry.desc=Гэты асабліва высокі грыб служыць абарончым пунктам для большай грыбной сеткі, якая жыве ў гэтай пячоры.\n\nЁн нерухомы, але страляе дакладнымі выбухамі атруты ва ўсё, што трапіць у яго поле зроку. Хоць уздзеянне гэтых выбухаў даволі слабае, _яны могуць вельмі хутка назапасіць смяротную колькасць атруты._ Хоць яго можна забіць, лепш за ўсё пазбягаць яго.
actors.mobs.fungalsentry.name=грыбковы вартавы
actors.mobs.fungalspinner.desc=Здаецца, што гэтай пячорнай круцільнёй кіруе паразітычны грыбок. Грыбок таксама змяніў свае здольнасці, замяніўшы павуцінне і мяшэчкі з атрутай грыбковымі насаджэннямі.\n\nГрыбная круцільнё будзе плюцца на вас расліннасцю замест павуціння, распаўсюджваючы грыбную расліннасць і, магчыма, укараняючы вас. Хоць яна не можа атруціць, грыбная круцільнёвая грыбніца атрымае значную ўстойлівасць да пашкоджанняў, калі будзе знаходзіцца побач з якімі-небудзь грыбамі.
actors.mobs.fungalspinner.name=грыбковы круцільнік
actors.mobs.ghoul.desc=Па меры таго, як гномскае грамадства паступова пачало развальвацца, і цяперашні кароль гномаў захапіў абсалютную ўладу, з тымі, хто быў слабы або супраціўляўся яму, абыходзіліся дрэнна. Па меры таго, як кароль станавіўся ўсё больш спрытным у валоданні цёмнай магіяй, ён падпарадкоўваў гэтых гномаў сваёй волі, і цяпер яны складаюць пехаціну яго арміі.\n\nГулі не асабліва моцныя самі па сабе, але заўсёды падарожнічаюць групамі і іх значна цяжэй забіць у вялікай колькасці. _Калі гуль пераможаны, ён зноў паўстане праз некалькі хадоў, пакуль побач знаходзіцца іншы гуль._
actors.mobs.ghoul.name=гном-гуль
actors.mobs.gnoll.desc=Гнолы — гуманоіды, падобныя да гіен. Яны жывуць у каналізацыі і падзямеллях, час ад часу выбіраючыся на паверхню, каб здзейсніць рабаванне. Гнолы-разведчыкі — звычайныя члены іх зграі, яны не такія моцныя, як жывёлы, і не такія разумныя, як шаманы.
actors.mobs.gnoll.name=гнол-разведчык
actors.mobs.gnollexile.desc=Гэты шэра-поўсты гнол мае вялікую метку на плячы, якая сведчыць пра тое, што ён выгнаны. Гнолаў звычайна выганяюць з грамадства за ігнараванне загадаў або парушэнне законаў. Выгнанцы павінны быць моцнымі і хітрымі, каб выжыць, а гэты выглядае так, быццам ведае, як карыстацца дзідай, якую трымае ў руках.
actors.mobs.gnollexile.desc_aggro=_Гнол-выгнанец злосна азіраецца._ Здаецца, нешта ўсё ж прымусіла яго вырашыць змагацца. Сцеражыся дзіды!
actors.mobs.gnollexile.desc_passive=_Гнол-выгнанец не збіраецца атакаваць._ Ён не выглядае такім агрэсіўным, як іншыя гнолы тут, і, верагодна, не лічыць, што змагацца з вамі варта. Вы маглі б проста пакінуць яго без увагі, але ў яго ёсць заплечнік, поўны карысных рэчаў...
actors.mobs.gnollexile.name=выгнанне гнолаў
actors.mobs.gnollexile.seen_aggro=Гнол з дзідай рыхтуецца да атакі!
actors.mobs.gnollexile.seen_passive=Гнол з дзідай глядзіць на цябе насцярожана, але не варушыцца атакаваць.
actors.mobs.gnollgeomancer.alert=Геамант прачынаецца! Уся пячора нібы варушыцца, калі ён адскоквае, шалёна смяючыся!
actors.mobs.gnollgeomancer.desc=Гэты ўражліва высокі старэйшы гнол, напэўна, з'яўляецца крыніцай разнастайнай магіі руху зямлі тут і арганізатарам усёй дзейнасці гнолаў. У адрозненне ад гнолаў-сапераў у гэтай мясцовасці, геамант даволі добра валодае сваёй магіяй і не можа быць пашкоджаны кінутымі або падаюць камянямі. Аднак ён не ўмее змагацца ў блізкім бою.
actors.mobs.gnollgeomancer.desc_armor=Геамант зараз ахутаны пластом каменнай брані. _Вам трэба будзе падысці бліжэй і зламаць яе кіркай, перш чым вы зможаце пашкодзіць геаманта._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Непадалёк гнол-сапёр трымае прыладу, якая ўзмацняе каменную браню геаманта. Зараз вы не зможаце яе пашкодзіць!_
actors.mobs.gnollgeomancer.desc_sleeping=Гэты ўражліва высокі гнол-шаман акружаны пластом скалы і выглядае амаль як статуя. Прыгледзеўшыся, можна ўбачыць, як скала магічным чынам рухаецца ў такт дыханню старэйшага гнола. Яму нельга нашкодзіць, пакуль ён так зачынены ў скале, і здаецца, што ён літаральна атрымлівае асалоду ад дрэмкі ў зямлі.\n\nВы, напэўна, зможаце прабіцца скрозь пласты скал сваёй кіркай, але _пераканайцеся, што вы гатовыя да бою, калі будзеце гэта рабіць._ Геамант, напэўна, з'яўляецца крыніцай разнастайнай магіі руху зямлі тут і арганізатарам усёй дзейнасці гнолаў. _Перамога над гноламі, раскіданымі тут, перад тым, як змагацца з ім, магла б быць добрай ідэяй._
actors.mobs.gnollgeomancer.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.gnollgeomancer.name=гнол-геомант
actors.mobs.gnollgeomancer.rock_kill=Лятучы валун забіў цябе...
actors.mobs.gnollgeomancer.rockfall_kill=Падаючыя камяні забілі цябе...
actors.mobs.gnollgeomancer.warning=Геамант пачынае варушыцца. Перад тым, як працягваць, пераканайцеся, што вы гатовыя!
actors.mobs.gnollguard.def_verb=заблакаваны
actors.mobs.gnollguard.desc=Вялікі і моцны на выгляд гнол з дзідай і шчытом, але без шлема. Гэтыя ахоўнікі, верагодна, звяры на трэніроўцы, прывязаныя да абароны шахты ад дзікіх жывёл. \n\nАхоўнік-гнол дастаткова моцны, каб трымацца з дзідай у адной руцэ, але не можа ім добра карыстацца. _Яму спатрэбіцца даволі адкрытая прастора для атакі на адлегласці, і ён нанясе вам значна менш шкоды, калі вы падыдзеце блізка._
actors.mobs.gnollguard.desc_armor=_Непадалёк гнол-сапёр трымае прыладу, якая надзяляе гэтага ахоўніка землянымі даспехамі, значна зніжаючы наносімую яму шкоду._
actors.mobs.gnollguard.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.gnollguard.name=гнол-ахоўнік
actors.mobs.gnollguard.spear_warn=Гнол наносіць люты ўдар кончыкам дзіды!
actors.mobs.gnollsapper.desc=Маленькі і слабы, але разумны гнол са бледнай поўсцю і сумкай, поўнай розных прылад. Хутчэй за ўсё, яны тут, каб дапамагаць у пошуку і здабычы цёмнага золата, і маюць побач ахову для абароны. Яны здольныя змагацца, але іх атакі жаласна слабыя, не мацнейшыя за атаку гнола-разведчыка.\n\nЗамест таго, каб змагацца непасрэдна, сапёры аддаюць перавагу выкарыстоўваць розныя прылады, якія ў іх ёсць, каб прымусіць скалістае асяроддзе атакаваць за іх. Аднак самі яны не ведаюць магіі перамяшчэння зямлі, таму, хутчэй за ўсё, будуць выкарыстоўваць свае прылады неабдумана. _Павінна быць шмат спосабаў выкарыстаць іх атакі супраць іх ці іх аховы._
actors.mobs.gnollsapper.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.gnollsapper.name=гнол-сапёр
actors.mobs.gnolltrickster.desc=Дзіўная істота, нават па мерках гнолаў. Яна схілілася наперад са хітрай усмешкай, амаль трымаючы сумесь, што вісіць на плячы. Яе вочы шырока расплюшчаныя, ад дзіўнай сумесі страху і хвалявання.\n\nУ яе сумцы вялікая калекцыя дрэнна зробленых дроцікаў, і ўсе яны, здаецца, напоўнены рознымі шкоднымі рэчывамі.
actors.mobs.gnolltrickster.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.gnolltrickster.name=гнол-хітрун
actors.mobs.goldenmimic.desc=Мімікі — гэта чароўныя істоты, якія могуць прымаць любую форму. У падзямеллях яны амаль заўсёды выбіраюць форму куфра са скарбамі, каб прывабіць нічога не падазравалых шукальнікаў прыгод. \n\nЗалатыя мімікі — гэта больш моцныя мімікі, якія спрабуюць прыцягнуць наймацнейшых шукальнікаў прыгод. У іх лепшая здабыча, але яны таксама значна мацнейшыя за звычайных мімікаў.
actors.mobs.goldenmimic.name=залаты мімікр
actors.mobs.golem.def_verb=заблакаваны
actors.mobs.golem.desc=Дворфы спрабавалі спалучыць веды пра механізмы з нядаўна адкрытым мастацтвам падпарадкавання стыхій. Душамі механічных цел големаў служылі духі зямлі, якіх лічылі найбольш паслухмянымі. Але нават найменшая памылка ў рытуале магла вывесці голема з-пад кантролю.
actors.mobs.golem.name=голем
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=глух... глух...
actors.mobs.goo.desc=Пра Слізь вядома няшмат. Магчыма, гэта нават не істота, а навала рэчываў са сцёкаў, у якой з'явіліся зародкі ўласнай волі.
actors.mobs.goo.enraged=раз'юшаны
actors.mobs.goo.gluuurp=ГЛУУУУРП!
actors.mobs.goo.name=Слізь
actors.mobs.goo.notice=ГЛУРП-ГЛУРП!
actors.mobs.goo.pumpup=Гу набірае абароты!
actors.mobs.goo.rankings_desc=Паглынуты сліззю
actors.mobs.greatcrab.def_verb=заблакаваны
actors.mobs.greatcrab.desc=Гэты краб гіганцкі, нават у параўнанні з іншымі каналізацыйнымі крабамі. Яго сіні панцыр пакрыты расколінамі і ракавінкамі, што сведчыць пра яго ўзрост. Ён павольна перасоўваецца, ледзь утрымліваючы раўнавагу з дапамогай сваёй масіўнай кіпцюры.\n\nХоць у краба толькі адна кіпцюр, яго памер лёгка кампенсуе гэта. Краб трымае кіпцюр перад любой пагрозай, хаваючыся за непрабіўной сцяной панцыра. Аднак краб не можа блакаваць атакі, якіх ён не бачыць, або атакі некалькіх ворагаў адначасова.
actors.mobs.greatcrab.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.greatcrab.name=вялікі краб
actors.mobs.greatcrab.noticed=Краб блакуе яго сваёй масіўнай кіпцюром.
actors.mobs.guard.def_verb=заблакаваны
actors.mobs.guard.desc=Калісьці вартаўнікі турмы, гэтыя ахоўнікі даўно нічым не адрозніваюцца ад зняволеных. Яны блукаюць, як зомбі, бяздумна блукаюць па калідорах у пошуках чаго-небудзь недарэчнага, як і вы!\n\nЯны носяць ланцугі вакол сцягна, магчыма, якія выкарыстоўваюцца для таго, каб прыцягваць ворагаў на блізкую адлегласць.
actors.mobs.guard.name=турэмны ахоўнік
actors.mobs.guard.scorpion=Ідзі сюды!
actors.mobs.hermitcrab.def_verb=заблакаваны
actors.mobs.hermitcrab.desc=Па той ці іншай прычыне гэты каналізацыйны краб вырашыў надзець на галаву зламаную верхнюю частку бочкі! Дадатковая вага запаволіла яго хуткасць да звычайнай, але таксама дала яму значна лепшую абарону. Здаецца, вы чуеце, як нешта падскоквае ўнутры бочкі...
actors.mobs.hermitcrab.name=рак-пустэльнік
actors.mobs.mimic.desc=Мімікі — гэта чароўныя істоты, якія могуць прымаць любую форму. У падзямеллях яны амаль заўсёды выбіраюць форму куфра са скарбамі, каб прывабіць нічога не падазравалых шукальнікаў прыгод.
actors.mobs.mimic.discover_hint=Вы можаце знайсці гэтага ворага ў любым месцы падзямелля.
actors.mobs.mimic.hidden_hint=Нешта з гэтай скрыняй не так... Падысці і паспрабаваць яе адкрыць — мабыць, дрэнная ідэя.
actors.mobs.mimic.name=мімік
actors.mobs.mimic.reveal=Гэтыя грудзі — міміка!
actors.mobs.mob.died=Чуеш, як нешта памірае ўдалечыні.
actors.mobs.mob.discover_hint=Вы можаце знайсці гэтага ворага ў пэўным рэгіёне падзямелля.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Забіты: %s
actors.mobs.monk$focus.desc=Гэты манах выдатна нацэлены на цэль і, здаецца, прадбачыць яе рухі, перш чым яна іх зробіць.\n\nПакуль персанаж знаходзіцца ў факусоўцы, яго наступная фізічная атака, накіраваная супраць яго, гарантавана прамахнецца, незалежна ад абставін. Адбіццё гэтай атакі выдаткуе ў манаха яго факусоўку, і яму трэба будзе зноў яе аднавіць, каб адбіць наступную атаку. Манахі хутчэй набіраюць факусоўку падчас руху.
actors.mobs.monk$focus.name=сканцэнтраваны
actors.mobs.monk.def_verb=заблакаваны
actors.mobs.monk.desc=Гэтыя манахі — фанатыкі, якія прысвяцілі сябе ахове таямніц свайго горада ад усіх чужынцаў. Яны не карыстаюцца ні даспехамі, ні зброяй, спадзеючыся толькі на мастацтва рукапашнага бою.
actors.mobs.monk.name=дворф-манах
actors.mobs.monk.parried=адбіў
actors.mobs.necromancer$necroskeleton.desc=Гэты шкілет быў выкліканы некрамантам. Ён паводзіць сябе гэтак жа, як звычайны шкілет, і памрэ, калі некрамант, які яго выклікаў, будзе забіты.
actors.mobs.necromancer$necroskeleton.name=шкілет некраманта
actors.mobs.necromancer.desc=Гэтыя вучні цёмных чараўнікоў сцякаліся ў турму, бо гэта ідэальнае месца, каб практыкаваць сваё злое рамяство. \n\nНекраманты будуць заклікаць і ўмацоўваць шкілетаў, каб яны змагаліся за іх. Забойства некраманта таксама заб'е шкілет, якога ён выклікаў.
actors.mobs.necromancer.name=некрамант
actors.mobs.npcs.blacksmith.cant_enter_old=Гэтая зона недаступная на гэтым этапе. Згуляйце ў новую гульню, каб паспрабаваць новы квэст!
actors.mobs.npcs.blacksmith.def_verb=заблакаваны
actors.mobs.npcs.blacksmith.desc=Гэты троль-каваль выглядае як усе тролі: ён высокі і хударлявы, а яго скура нагадвае камень і па колеры, і па тэкстуры. Троль-каваль важдаецца з непрапарцыйна маленькімі інструментамі.
actors.mobs.npcs.blacksmith.enter_no=Пакуль не
actors.mobs.npcs.blacksmith.enter_yes=Я гатовы
actors.mobs.npcs.blacksmith.entrance_blocked=Шлях уніз заблакаваны.
actors.mobs.npcs.blacksmith.exit_no=Пакуль не
actors.mobs.npcs.blacksmith.exit_warn_crystal=Той гіганцкі крышталь таксама ўсё яшчэ там, унізе. Я заплачу дадаткова, калі ты яго знішчыш.
actors.mobs.npcs.blacksmith.exit_warn_full=Ты скончыў? У цябе шмат золата, але пераканайся, што ты не пакінуў нічога са свайго рыштунку. \n\n_Памятай, я цябе не пушчу назад, як толькі ты падымешся._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Той гіганцкі грыб таксама ўсё яшчэ там. Я заплачу дадаткова, калі ты яго заб'еш.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Той гнол-геамант таксама ўсё яшчэ там. Я заплачу дадаткова, калі ты яго заб'еш.
actors.mobs.npcs.blacksmith.exit_warn_high=Ты скончыў? Здаецца, у цябе ёсць нямала золата, але мне не хапае яшчэ. Ты павінен атрымаць _40 штук._\n\n_Памятай, я цябе назад не пущу, як толькі ты падымешся._
actors.mobs.npcs.blacksmith.exit_warn_low=Ты ўжо скончыў? Здаецца, у цябе мала золата. Ты павінен атрымаць _40 штук._\n\n_Памятай, я цябе назад не пушчу, як толькі ты падымешся._
actors.mobs.npcs.blacksmith.exit_warn_med=Ты скончыў? У цябе ёсць трохі золата, але ў шахце яго дакладна больш. Ты павінен атрымаць _40 штук._\n\n_Памятай, я цябе назад не пущу, як толькі ты выйдзеш наверх._
actors.mobs.npcs.blacksmith.exit_warn_none=Ты ўжо скончыў? У цябе амаль няма золата! Ты павінен атрымаць _40 штук._\n\n_Памятай, я цябе назад не пущу, як толькі ты падымешся._
actors.mobs.npcs.blacksmith.exit_yes=Я скончыў
actors.mobs.npcs.blacksmith.get_lost=Я заняты. Знікні!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Гэй, чалавек! Ты выглядаеш важным чалавекам.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Але будзь асцярожны, шахта небяспечная для такога маленькага чалавечка, як ты. Яна ўжо даўно закінутая, і там пачала расці куча крышталяў. Яны бліскучыя, але занадта далікатныя, каб чагосьці вартыя, і іх абараняюць нейкія магічныя рэчы. Яны даволі моцныя, таму _будзь асцярожны, дзе здабываеш_, інакш прыцягнеш іх увагу.\n\nДзесьці таксама ёсць _гіганцкі крышталь_. Ён значна мацнейшы, таму будзь гатовы да бою, калі пачнеш яго ламаць. Б'юся аб заклад, што разбіццё яго запаволіць рост крышталяў, таму я заплачу дадаткова, калі ты зможаш гэта зрабіць.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Гэй, чалавек! Ты выглядаеш смелым.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Але будзь асцярожны, шахта небяспечная для такога маленькага чалавечка, як ты. Там, унізе, расце нейкая грыбная пачвара. Там ёсць грыбныя вартавыя, якія сапраўды смяротна небяспечныя, калі ўбачаць цябе, але яны хаця б не могуць устаць і пагнацца за табой. _Трымайся далей ад вачэй_, калі хочаш застацца ў жывых.\n\nЯ заплачу дадаткова, калі табе ўдасца знішчыць _самы вялікі грыб_, але гэта запатрабуе сур'ёзных намаганняў. Ён звязаны з кучай міцэліевых вузлоў, якія схаваны ў сценах. Табе прыйдзецца зламаць большасць з іх, перш чым ты зможаш сапраўды пашкодзіць яго.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Але будзь асцярожны, гэтая шахта небяспечная для такога маленькага чалавечка, як ты. Нейкія гнолы таксама хочуць золата, і цяпер яны руйнуюць усё гэтае месца. Яны дурныя істоты, таму іх здабыча прывяла да ўсялякіх абвалаў і абвалаў. Табе давядзецца капаць праз яе, таму _шукай нядаўна парушаную пароду._\n\n Я думаю, што адзін з гнолаў стварае большую частку праблем, верагодна, _геамант-шаман_ ці нешта падобнае. Я заплачу дадаткова, калі ты зможаш знайсці і забіць яго, але я ўпэўнены, што ён будзе змагацца.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Гэй, чалавек! Здаецца, ты хуткі.
actors.mobs.npcs.blacksmith.intro_quest_mage=Гэй, чалавек! Здаецца, ты разумны.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Гэй, чалавек! Здаецца, ты хітры.
actors.mobs.npcs.blacksmith.intro_quest_start=Хочаш быць карысным, га? Так, у мяне ёсць нешта, што ты можаш зрабіць. Я пабудаваў гэтую майстэрню на старой шахце, яна проста ўнізе па лесвіцы. Вазьмі гэтую кірку і здабывай мне трохі _цёмнай залатой руды. 40 кавалкаў_ павінна быць дастаткова. Камень унізе прыемны і мяккі, таму _ты зможаш здабываць скрозь сцены з некаторымі намаганнямі._\n\nШто ты маеш на ўвазе, як я заплачу? Ах ты, прагны...\n\nДобра, добра, я магу трохі пакаваць для цябе. Лічы, што табе пашанцавала, я адзіны каваль тут.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Гэй, чалавек! Здаецца, ты жорсткі.
actors.mobs.npcs.blacksmith.lost_pick=Ты жартуеш? Дзе мая кірка?!
actors.mobs.npcs.blacksmith.name=троль-каваль
actors.mobs.npcs.blacksmith.quest_start_prompt=Гатовы спусціцца? Пераканайцеся, што ў вас ёсць вольнае месца для золата. \n\n_Я падвяду цябе толькі адзін раз!_
actors.mobs.npcs.blacksmith.reminder=Ты ўжо марнаваў мой час? Уваход у шахту вунь там.
actors.mobs.npcs.blacksmith.reminder_crystal=Прынясі мне як мага больш золата і паспрабуй разбіць вялікі крышталь.
actors.mobs.npcs.blacksmith.reminder_fungi=Прынясі мне як мага больш золата і паспрабуй забіць таксама гіганцкі грыб.
actors.mobs.npcs.blacksmith.reminder_gnoll=Прынясі мне як мага больш золата і паспрабуй забіць гнола-геаманта.
actors.mobs.npcs.ghost.crab_1=Прывітанне, %s... Калісьці я быў падобны да цябе — моцным і ўпэўненым у сабе... Але мяне забіла старажытная істота... Я не магу пакінуць гэтае месца... Пакуль не адпомшчу... Забі _вялікага краба,_ які забраў маё жыццё...\n\nЁн ненатуральна стары... З адзінокай масіўнай кіпцюром і тоўстым панцырам... _Сцеражыся яго кіпцюра, ты павінен здзівіць краба, інакш ён заблакуе цябе ёю..._
actors.mobs.npcs.ghost.crab_2=Калі ласка... Дапамажыце мне... Забіце ракападобнага...\n\n_Ён заўсёды будзе блакаваць... Калі ўбачыць, як вы набліжаецеся..._
actors.mobs.npcs.ghost.desc=Прывід ледзь бачны. Ён выглядае як бясформенная пляма цьмянага святла з сумным тварам.
actors.mobs.npcs.ghost.find_me=Дзякуй... прыходзьце, знайдзіце мяне...
actors.mobs.npcs.ghost.gnoll_1=Прывітанне, %s... Калісьці я быў падобны да цябе — моцным і ўпэўненым у сабе... Але мяне забіў хітры вораг... Я не магу пакінуць гэтае месца... Пакуль не адпомшчу... Забі _гнола-хітрага,_ які забраў маё жыццё...\n\nЁн не падобны на іншых гнолаў... Ён хаваецца і выкарыстоўвае кідальную зброю... _Сцеражыся яго атрутных і запальных стрэл, не атакуй здалёк..._
actors.mobs.npcs.ghost.gnoll_2=Калі ласка... Дапамажыце мне... Забіце ашуканца...\n\n_Не дазваляйце яму ўдарыць па вас... Падыдзіце бліжэй да яго..._
actors.mobs.npcs.ghost.name=сумны прывід
actors.mobs.npcs.ghost.rat_1=Прывітанне, %s... Калісьці я быў падобны да цябе — моцным і ўпэўненым у сабе... Але мяне забіла агідная пачвара... Я не магу пакінуць гэтае месца... Пакуль не адпомшчу... Забі _смуроднага пацука_, які забраў маё жыццё...\n\nЁн блукае па гэтай падлозе... Распаўсюджвае бруд паўсюль... _Сцеражыся яго воблака смуроду і раз'ядальнага ўкусу, кіслата раствараецца ў вадзе..._
actors.mobs.npcs.ghost.rat_2=Калі ласка... Дапамажыце мне... Забіце гэтую агіднасць...\n\n_Змагайцеся з ёй каля вады... Пазбягайце смуроду..._
actors.mobs.npcs.imp.cya=Да сустрэчы, %s!
actors.mobs.npcs.imp.desc=Імпы — ніжэйшыя дэманы. Яны не вылучаюцца ні сілай, ні магічнымі здольнасцямі, але даволі разумныя і таварыскія. Многія імпы аддаюць перавагу жыць сярод недэманаў.
actors.mobs.npcs.imp.golems_1=У маім выпадку трэба забіваць _големаў_. Бачыце, я збіраюся пачаць тут невялікі бізнес, але гэтыя дурныя големы дрэнныя для бізнесу! Вельмі цяжка весці перамовы з блукаючымі кавалкамі граніту, праклятыя яны! Таму, калі ласка, забіце... скажам, _чатырох з іх_, і ўзнагарода ваша.
actors.mobs.npcs.imp.golems_2=Як праходзіць тваё сафары з големамі? Толькі не забудзься ўзяць гэтыя жэтоны.
actors.mobs.npcs.imp.hey=Тссс, %s!
actors.mobs.npcs.imp.intro=Ты шукальнік прыгод? Я люблю шукальнікаў прыгод! На іх заўсёды можна спадзявацца, калі трэба кагосьці забіць, ці не так? Вядома ж, за ўзнагароду ;)
actors.mobs.npcs.imp.monks_1=У маім выпадку трэба забіваць _манахаў_. Бачыце, я збіраюся пачаць тут невялікі бізнес, але гэтыя вар'яты самі нічога не купляюць і будуць палохаць іншых кліентаў. Таму, калі ласка, забіце... скажам, _5 з іх_, і ўзнагарода ваша.
actors.mobs.npcs.imp.monks_2=О, ты яшчэ жывы! Я ведаў, што тваё кунг-фу будзе мацнейшым ;) Толькі не забудзься ўзяць тыя жэтоны.
actors.mobs.npcs.imp.name=амбіцыйны імператар
actors.mobs.npcs.impshopkeeper.buyback=Бес радасна вяртае твой прадмет.
actors.mobs.npcs.impshopkeeper.desc=Бес адкрыў невялікую крамку на мяжы ўнутраных залаў. Прыемна бачыць прыязны твар, але яго цэны, безумоўна, непрыемныя.
actors.mobs.npcs.impshopkeeper.greetings=Прывітанне, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Што ты зрабіў, %s? Хутчэй пакупкі, мне трэба адсюль з'язджаць!
actors.mobs.npcs.impshopkeeper.name=амбіцыйны імператар
actors.mobs.npcs.impshopkeeper.thief=Я думаў, што магу табе давяраць!
actors.mobs.npcs.mirrorimage.desc=Гэтая ілюзія вельмі падобная да цябе, толькі больш бледная і крыху тузаецца.
actors.mobs.npcs.mirrorimage.discover_hint=Вы можаце знайсці гэтага персанажа з дапамогай спецыяльнага скрутка.
actors.mobs.npcs.mirrorimage.name=люстраное адлюстраванне
actors.mobs.npcs.npc.discover_hint=Вы можаце знайсці гэтага персанажа ў пэўным рэгіёне падзямелля.
actors.mobs.npcs.prismaticimage.desc=Гэтая мігатлівая ілюзія вельмі падобная на вас, нават здаецца, што яна трымае ў руках вашу цяперашнюю зброю і даспехі.\n\nПрызматычныя выявы будуць спрабаваць шукаць і адцягваць увагу ад ворагаў, выкарыстоўваючы сваю палепшаную абарону і здароўе для вашай абароны. Хоць яны не маюць такой жа атакуючай сілы, як люстраныя выявы, яны маюць палепшаную трываласць, у тым ліку атрымліваюць перавагі ад вашай даспехаў.\n\nКалі здароўе зніжаецца да 0, прызматычныя выявы будуць знікаць на працягу некалькіх хадоў і ўсё яшчэ могуць быць вылечаны на працягу гэтага часу. Калі ворагаў няма, прызматычныя выявы будуць знікаць і вяртацца да свайго гаспадара.
actors.mobs.npcs.prismaticimage.discover_hint=Вы можаце знайсці гэтага персанажа з дапамогай спецыяльнага скрутка.
actors.mobs.npcs.prismaticimage.name=прызматычны малюнак
actors.mobs.npcs.ratking.confused=Што... Дзе я? Маё каралеўства мае патрэбу ва мне!
actors.mobs.npcs.ratking.crown_after=Падабаюцца твае новыя даспехі? Ніякіх адмоў!
actors.mobs.npcs.ratking.crown_clothes=Апраніся! Ты не ў тым стане, каб размаўляць з каралеўскай сям'ёй!
actors.mobs.npcs.ratking.crown_desc=Ооо, гэтая карона для мяне!? Яна выглядае значна бліскучай за маю, таму я ветліва прымаю!\n\nНасамрэч, я думаю, што магу прапанаваць табе нешта ў якасці ўзнагароды за гэтую карону. Велізарная сіла, годная такога героя, як ты! Табе б гэта спадабалася?
actors.mobs.npcs.ratking.crown_fine=Добра! У любым выпадку, я гэтага не хацеў...
actors.mobs.npcs.ratking.crown_info=Спачатку раскажы мне больш.
actors.mobs.npcs.ratking.crown_no=Я б лепш не...
actors.mobs.npcs.ratking.crown_thankyou=Хе-хе, дзякуй! А цяпер ідзі і зрабі гонарам свайго караля!
actors.mobs.npcs.ratking.crown_yes=Вядома!
actors.mobs.npcs.ratking.desc=Гэты пацук крыху большы за звычайнага сумчатага пацука. На галаве ў яго маленькая карона.
actors.mobs.npcs.ratking.desc_birthday=Гэты пацук крыху большы за звычайнага сумчатага пацука. Замест звычайнай кароны на ім малюсенькі зялёны святочны капялюшык. З днём нараджэння, Кароль Пацукоў!
actors.mobs.npcs.ratking.desc_crown=Гэты пацук крыху большы за звычайнага сумчатага пацука. На галаве ў яго карона карлікавага караля.
actors.mobs.npcs.ratking.desc_winter=Гэты пацук крыху большы за звычайнага сумчатага пацука. Замест звычайнай кароны на ім малюсенькі святочны капялюшык. З святамі!
actors.mobs.npcs.ratking.discover_hint=Вы можаце знайсці гэтага персанажа ў канцы пэўнай вобласці падзямелля.
actors.mobs.npcs.ratking.name=пацучы кароль
actors.mobs.npcs.ratking.not_sleeping=Я не сплю!
actors.mobs.npcs.ratking.what_is_it=Што такое? У мяне няма часу на гэтую лухту. Маё каралеўства не будзе кіраваць само сабой!
actors.mobs.npcs.sheep.baa!=Беа!
actors.mobs.npcs.sheep.baa.=Беа.
actors.mobs.npcs.sheep.baa...=Беа...
actors.mobs.npcs.sheep.baa?=Беа?
actors.mobs.npcs.sheep.def_verb=заблакаваны
actors.mobs.npcs.sheep.desc=Гэта чароўная авечка. Што ў ёй такога чароўнага? Яе нельга забіць. Яна будзе стаяць там, пакуль чароўным чынам не знікне, увесь час жуючы жуйку з пустым позіркам.
actors.mobs.npcs.sheep.discover_hint=Вы можаце знайсці гэтага персанажа з дапамогай пэўнага прадмета або пасткі.
actors.mobs.npcs.sheep.name=авечкі
actors.mobs.npcs.shopkeeper.buyback=Прадавец неахвотна вяртае ваш тавар.
actors.mobs.npcs.shopkeeper.desc=Гэты дужы хлопец выглядае больш прыдатным для гандлёвага раёна ў нейкім вялікім горадзе, чым для падзямелля. Яго цэны тлумачаць, чаму ён аддае перавагу весці бізнес тут.
actors.mobs.npcs.shopkeeper.flee=Крамар уцякае!
actors.mobs.npcs.shopkeeper.name=крамнік
actors.mobs.npcs.shopkeeper.sell=Прадаць тавар
actors.mobs.npcs.shopkeeper.talk=Размова
actors.mobs.npcs.shopkeeper.talk_ascent=Не ведаю, што ты плануеш рабіць з гэтым амулетам, але я не хачу мець да гэтага ніякага дачынення. Купі што-небудзь і рухайся далей, нам абодвум трэба пакінуць гэтае месца!
actors.mobs.npcs.shopkeeper.talk_caves=Траць грошы, жыві даўжэй.\n\nО, і перадай ад мяне прывітанне таму тролю-кавалю, калі ўбачыш яго. Нагадай валаку, што ён усё яшчэ павінен мне грошы за той малаток, які я прадаў яму на мінулым тыдні!
actors.mobs.npcs.shopkeeper.talk_city=Мае тавары могуць ахаваць цябе тут, унізе. \n\n... І не бадзяйся тут, калі ласка. Мне спатрэбілася цэлая вечнасць, каб мясцовыя жыхары пакінулі мяне ў спакоі, я не хачу, каб ты наклікаў на сябе непрыемнасці!
actors.mobs.npcs.shopkeeper.talk_halls=Гэй, у мяне ёсць спецыяльныя цэны для паляўнічых на дэманаў!\n\nО, і будзь асцярожны там, унізе! Дэманам унізе будзе ўсё роўна, наколькі ты адважны. Калі ты мёртвы, ты не зможаш вярнуцца і траціць больш грошай! ;)\n\nЦі дэманы падобныя на мяне? Хе-хе, зусім не. Я проста маленькі хлопец, не вельмі добры баец, і мне ўдалося захаваць свой розум цэлым. Дэманы ўнізе значна мацнейшыя істоты, і ўсе яны былі заняволеныя... ну... проста будзь асцярожны там, унізе.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Ну, прывітанне, Ваша Высокасць, ці цяпер Ваша Святасць? Хе-хе, у любым выпадку, гэта не месца для вас, многія людзі былі б вельмі засмучаныя, калі б вы загінулі. Але ў вас напэўна ёсць манеты, чаму б не купіць што-небудзь, каб дапамагчы прадухіліць гэта?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ну, калі гэта не падарожны герой! Калі вы спрабуеце выратаваць яшчэ адзін горад, то поспехаў вам, небяспекі тут значна горшыя, чым ад дробных бандытаў. Я ўпэўнены, што ў вас усё атрымаецца лепш, чым у каго-небудзь іншага, толькі паспрабуйце не памерці прама каля маёй крамы.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Здаецца, ты не ў сваёй стыхіі, міс. Вузкія калідоры падзямелляў не такія прасторныя, як вялікія залы ці лясы вакол горада, ці не так? Хе-хе, ой, не зважай на маю лухту, чаму б не купіць што-небудзь?
actors.mobs.npcs.shopkeeper.talk_prison_intro=У мяне ёсць усё неабходнае для паспяховага прыгоды!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Хе-хе, здаецца, я дзесьці ў горадзе бачыў аб'яву аб вышуку з тваім імем. Мы што, уцякаем? О, ты ж невінаваты? Вядома, вядома... Не хвалюйся, у мяне ёсць справы важнейшыя, чым паведамляць на цябе, але, магчыма, табе варта купіць што-небудзь, каб пераканацца?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ты прыйшоў з гільдыі злодзеяў, каб ачысціць тэрыторыю? Не, проста за пакупкамі? Ну, заб'еш пару монстраў, пакуль будзеш тут. Не чакай зніжкі, я плачу вам добрыя грошы за ахову, людзі, а вы ледзьве абараняеце мяне тут.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Цікавая ў цябе пячатка, звычайна яны цэлыя. Ты нейкі зганьбаваны герой ці што? Што б ты ні зрабіў, гэта не мая справа, твае манеты ўсё яшчэ вартыя сваёй працы.
actors.mobs.npcs.shopkeeper.thief=Злодзей, злодзей!
actors.mobs.npcs.shopkeeper.warn=Глядзіце! Больш не буду папярэджваць.
actors.mobs.npcs.vaultlaser.desc=Гэты вартавы страляе лазерамі праз рэгулярныя прамежкі часу. _Паколькі гэта толькі выпрабавальная зона, лазеры вам не нашкодзяць._
actors.mobs.npcs.vaultlaser.name=лазерны вартавы сховішча
actors.mobs.npcs.vaultsentry.desc=Гэты вартавы скануе тэрыторыю па шаблоне. _Паколькі гэта толькі тэставая зона, вартавы нічога не зробіць, калі выявіць вас._
actors.mobs.npcs.vaultsentry.name=вартавы сканавання сховішчаў
actors.mobs.npcs.wandmaker.def_verb=заблакаваны
actors.mobs.npcs.wandmaker.desc=Гэты стары, але бадзёры джэнтльмен мае злёгку збянтэжаны выраз твару. Яго абараняе магічны шчыт.
actors.mobs.npcs.wandmaker.intro_1=Я прыйшоў сюды, каб знайсці рэдкі інгрэдыент для чароўнай палачкі, але заблудзіўся, і мой магічны шчыт слабее. Мне трэба будзе хутка сысці, але я не магу сыходзіць, не атрымаўшы тое, па што прыйшоў.
actors.mobs.npcs.wandmaker.intro_2=Калі ты можаш дастаць гэта для мяне, я з задавальненнем заплачу табе адной з маіх выдатна вырабленых палачак! Я ўзяў з сабой дзве, таму можаш узяць тую, якая табе больш падабаецца.
actors.mobs.npcs.wandmaker.intro_berry=Стары наглядчык гэтай турмы трымаў _гнільніцы_, і я шукаю адно з яе насення. Але расліна, напэўна, ужо здзічэла, таму прымусіць яе даць насенне можа быць складана. Яе сад павінен быць недзе тут. Паспрабуйце _трымацца далей ад яе ліянаў_, калі хочаце застацца цэлым і непашкоджаным. Выкарыстанне агню можа быць спакуслівым, але, калі ласка, не рабіце гэтага, вы заб'яце расліну і знішчыце яе насенне.
actors.mobs.npcs.wandmaker.intro_cleric=О, прывітанне, Ваша Высокасць! Які прыемны сюрпрыз — сустрэць вас у такім дэпрэсіўным месцы! Не хачу навязвацца, але, магчыма, у мяне ёсць для вас заданне.
actors.mobs.npcs.wandmaker.intro_duelist=О, прывітанне, міс! Які прыемны сюрпрыз — сустрэць героя ў такім дэпрэсіўным месцы! Калі вы хочаце дапамагчы старому чалавеку, у мяне можа быць для вас заданне.
actors.mobs.npcs.wandmaker.intro_dust=Я шукаю _трупальны пыл_. Гэта асаблівы від праклятай касцяной мукі, якую звычайна можна знайсці ў такіх месцах. Дзесьці тут павінна быць забарыкадаванае памяшканне, я ўпэўнены, што там з'явіцца пыл. Але будзьце асцярожныя, праклён, які нясе пыл, даволі моцны, _вярніся да мяне як мага хутчэй_, і я ачышчу яго для вас.
actors.mobs.npcs.wandmaker.intro_ember=Я шукаю _свежыя вуголлі_ ад нованароджанага элементаля агню. Элементалі звычайна з'яўляюцца, калі рытуал выкліку не кантралюецца, таму проста знайдзіце свечкі і месца для рытуалу, і я ўпэўнены, што вы зможаце знайсці адну з іх. Аднак вам варта _пазбягаць замыкання_ падчас барацьбы з ім, альбо вы можаце _трымаць пад рукой нейкі ледзяны прадмет._ Нованароджаныя элементалі даволі магутныя і хаатычныя, але яны не пераносяць холаду.
actors.mobs.npcs.wandmaker.intro_huntress=О, прывітанне, міс! Прыязны твар тут — прыемны сюрпрыз, ці не так? Насамрэч, клянуся, я ўжо бачыла ваш твар раней, але не магу дакладна сказаць... Ой, не хвалюйцеся, калі вы тут дзеля прыгод, магчыма, у мяне ёсць для вас заданне.
actors.mobs.npcs.wandmaker.intro_mage=О, прывітанне, %s! Я чуў, што вакол цябе і інстытута чараўнікоў быў нейкі шум? Ды не хвалюйся, мне ўвогуле ніколі не падабаліся гэтыя дурні. Калі хочаш, магу даць табе заданне.
actors.mobs.npcs.wandmaker.intro_rogue=О, Божа мой, ты мяне напалохаў! Я не сустракаў тут ніводнага бандыта, які б захаваў здаровы розум, значыць, ты, напэўна, з паверхні! Калі ты гатовы дапамагчы незнаёмцу, магчыма, у мяне ёсць для цябе заданне.
actors.mobs.npcs.wandmaker.intro_warrior=О, прывітанне! Які прыемны сюрпрыз — сустрэць воіна з поўначы ў такім дэпрэсіўным месцы! Напэўна, ты прайшоў даволі доўгі шлях, каб сюды дабрацца. Калі ты шукаеш прыгод, магчыма, у мяне ёсць для цябе заданне.
actors.mobs.npcs.wandmaker.name=стары майстар жазлоў
actors.mobs.npcs.wandmaker.reminder_berry=Пашанцавала з насеннем гніліцы, %s? Пашукайце пакой, поўны расліннасці.
actors.mobs.npcs.wandmaker.reminder_dust=Пашанцавала з трупным пылам, %s? Пашукай нейкія барыкады.
actors.mobs.npcs.wandmaker.reminder_ember=Пашанцавала з гэтымі вуголлямі, %s? Табе трэба знайсці чатыры свечкі і месца для рытуалу.
actors.mobs.phantompiranha.desc=Фантомныя піраньі — рэдкая парода піранняў з магічнымі здольнасцямі і жудаснымі напаўпразрыстымі целамі. Яны здольныя тэлепартавацца падчас нападу, каб уцячы або хутка падысці блізка да ворага!\n\nХоць з імі надакучліва змагацца, іх мяса цэніцца за свае магічныя ўласцівасці.
actors.mobs.phantompiranha.name=фантомная пірання
actors.mobs.phantompiranha.teleport_away=Прывідная пірання тэлепартуецца прэч...
actors.mobs.piranha.desc=Гэтых пажадлівых рыб вырошчваюць спецыяльна для абароны затопленых тэрыторый. Іх укус смяротны, таму лепш пазбягаць непасрэднай сустрэчы з імі.
actors.mobs.piranha.discover_hint=Вы можаце знайсці гэтага ворага ў любым месцы падзямелля.
actors.mobs.piranha.name=гіганцкая пірання
actors.mobs.pylon.desc_active=Энергетычная апора, прызначаная для рэгулявання электрычнасці, якая сілкуе абсталяванне ў гэтай зоне. Апора зараз перапаўняецца электрычнасцю, гэта, напэўна, тое, што перагружае DM-300!\n\nУ такім стане апоры ўразлівыя, але будуць прапускаць электрычнасць да бліжэйшых ячэек па гадзіннікавай стрэлцы. Дзякуючы цяжкай металічнай канструкцыі, апоры ўстойлівыя да вялікіх пашкоджанняў.
actors.mobs.pylon.desc_inactive=Энергетычная апора, прызначаная для рэгулявання электрычнасці, якая сілкуе машыны ў гэтай зоне. \n\nЭта апора ў цяперашні час неактыўная і неўспрымальная да пашкоджанняў.
actors.mobs.pylon.name=апора электраперадачы
actors.mobs.rat.desc=Сумчатыя пацукі — агрэсіўныя, але даволі слабыя насельнікі каналізацыі. Яны маюць моцны ўкус, але небяспечныя для жыцця толькі ў вялікай колькасці.
actors.mobs.rat.name=сумчаты пацук
actors.mobs.ripperdemon.desc=Гэтыя жахлівыя істоты з'яўляюцца вынікам таго, што шматлікія трупы гномаў у гэтым рэгіёне выкарыстоўваюцца дэманічнымі сіламі. Рыперы — гэта знясіленыя, прывідныя істоты, якія нагадваюць гномаў, але з паламанымі целамі і доўгімі вострымі кіпцюрамі з костак. \n\nДэманы-рыперы не асабліва трывалыя, але яны спрытныя і небяспечныя. Яны здольныя скакаць на вялікія адлегласці, каб хутка дабрацца да цэляў, перш чым праткнуць іх сваімі кіпцюрамі.
actors.mobs.ripperdemon.leap=Дэман-патрашыцель рыхтуецца скокнуць!
actors.mobs.ripperdemon.name=дэман-патрашыцель
actors.mobs.rotheart.desc=Плод гніліцы вельмі ўнікальны. Замест таго, каб гніць і забяспечваць пажыўнымі рэчывамі, плод расце, цвярдзее і ахінае насенне. Гэта абараняе ўнутраныя органы, якія растуць унутры плода. Гэты гіганцкі шар называюць сэрцам дарослай расліны гніліцы.
actors.mobs.rotheart.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.rotheart.name=гнілое сэрца
actors.mobs.rotlasher.desc=Гніланос — гэта частка каранёвай сістэмы дарослай гніланоснай расліны, а таксама яе асноўны сродак абароны. Гніланосы сляпыя і ўпіваюцца ў зямлю, але, пасля таго як выяўляюць пагрозу, люта атакуюць любую паблізу. Калі паблізу няма ворагаў, яны стаяць нерухома, спрабуючы зліцца з навакольнай расліннасцю.
actors.mobs.rotlasher.discover_hint=Вы можаце знайсці гэтага ворага падчас выканання пэўнага квэста.
actors.mobs.rotlasher.name=гніль лашэрам
actors.mobs.scorpio.desc=Гэтыя велізарныя дэманічныя істоты, падобныя на павукападобных, пазбягаюць блізкага бою, аддаючы перавагу страляць з вялікіх адлегласцей калечачымі зубчастымі шыпамі.
actors.mobs.scorpio.name=скарпіён
actors.mobs.senior.desc=Гэтыя манахі — фанатыкі, якія прысвяцілі сябе ахове таямніц свайго горада ад усіх чужынцаў. Яны не карыстаюцца ні даспехамі, ні зброяй, спадзеючыся толькі на мастацтва рукапашнага бою.
actors.mobs.senior.name=старэйшы манах
actors.mobs.shaman$blueshaman.spell_desc=Гэты шаман носіць сінюю маску і выкарыстоўвае магію, якая часова _павялічвае атрыманую шкоду._
actors.mobs.shaman$purpleshaman.spell_desc=Гэты шаман носіць фіялетавую маску і выкарыстоўвае магію, якая часова _зніжае вашу дакладнасць і ўхіленне._
actors.mobs.shaman$redshaman.spell_desc=Гэты шаман носіць чырвоную маску і выкарыстоўвае магію, якая часова _аслабляе вашу атакуючую сілу._
actors.mobs.shaman.bolt_kill=Чароўная стрэла забіла цябе...
actors.mobs.shaman.desc=Найразумнейшыя гнолы могуць авалодаць шаманскай магіяй. Гнолы-шаманы аддаюць перавагу баявым чарам, якімі папаўняюць недахоп сілы, і без ваганняў ужываюць іх супраць тых, хто ставіць пад сумнеў іх становішча ў племені.
actors.mobs.shaman.name=гнол-шаман
actors.mobs.skeleton.def_verb=заблакаваны
actors.mobs.skeleton.desc=Шкілеты складаюцца з костак няўдачлівых шукальнікаў прыгод і жыхароў падзямелля, ажыўленых злой магіяй з глыбінь. Атрымаўшы дастаткова пашкоджанняў, яны разлятаюцца выбухам костак.
actors.mobs.skeleton.explo_kill=Цябе забіў выбух костак...
actors.mobs.skeleton.name=шкілет
actors.mobs.slime.def_verb=заблакаваны
actors.mobs.slime.desc=Слізі — дзіўныя, злёгку чароўныя істоты з гумовым вонкавым целам і вадкім ядром. Гарадская каналізацыя забяспечвае іх дастатковым запасам вады і пажыўных рэчываў.\n\nЗ-за іх эластычнай вонкавай мембраны цяжка нанесці слізі больш за _6 адзінак шкоды_ адной атакай.
actors.mobs.slime.name=слізь
actors.mobs.snake.desc=Гэтыя велізарныя змеі здольныя хутка слізгаць вакол удараў, што робіць іх даволі цяжкапаражальнымі. Аднак магічныя атакі або нечаканыя атакі могуць заспець іх знянацку.\n\nВы можаце здзейсніць нечаканую атаку, атакуючы, знаходзячыся па-за полем зроку змяі. Адзін са спосабаў - дазволіць змяі пераследваць вас праз дзвярны праём, а затым _ўдарыць адразу пасля таго, як яна ўвойдзе ў дзверы._
actors.mobs.snake.hint=Паспрабуйце выкарыстаць кнопку "Агляд" на змяі, каб даведацца, як супрацьстаяць ёй.
actors.mobs.snake.name=каналізацыйная змяя
actors.mobs.spectralnecromancer.desc=Хоць шкілеты — гэта асноўная крыніца ежы для некрамантаў, некаторыя аддаюць перавагу іншым, менш цялесным паслугачам. Спектральныя некраманты выбралі прывідаў у якасці сваіх любімых паслугачоў! \n\n Асобныя прывіды не такія моцныя, як шкілеты, але гэтыя некраманты не баяцца заклікаць іх адразу!
actors.mobs.spectralnecromancer.name=спектральны некрамант
actors.mobs.spinner.desc=Гэтыя зеленаватыя касматыя пячорныя павукі пазбягаюць прамога бою. Яны чакаюць убаку, пакуль ахвяра, заблытаная ў іх павуцінні, павольна памірае ад атрутнага ўкусу.
actors.mobs.spinner.name=пячорны павук
actors.mobs.statue.def_verb=заблакаваны
actors.mobs.statue.desc=Можна падумаць, што гэта проста яшчэ адна з нежывых статуй гэтага падзямелля, але яе чырвоныя, зіхатлівыя вочы выдаюць гэта.
actors.mobs.statue.desc_weapon=Хоць сама статуя зроблена з каменя, _%s_, якім яна трымае, выглядае сапраўднай.
actors.mobs.statue.discover_hint=Вы можаце знайсці гэтага ворага ў любым месцы падзямелля.
actors.mobs.statue.name=аніміраваная статуя
actors.mobs.succubus.desc=Сукубы — дэманы ў абліччы спакуслівых дзяўчат з крыху гатычным выглядам. Сваёй магіяй сукуб можа зачараваць героя, і той не зможа нікога атакаваць, пакуль чары не знікнуць.
actors.mobs.succubus.name=сукуб
actors.mobs.swarm.desc=Смяротны рой мух злосна гудзе. Кожная немагічная атака падзяляе яго на два меншыя, але аднолькава небяспечныя роі.
actors.mobs.swarm.name=рой мух
actors.mobs.tengu$bombability$bombblob.desc=Тут клубіцца воблака перагрэтага дыму. Асцярожна, яно выбухне!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Яно прыліпла да зямлі, яго нельга зрушыць з месца!
actors.mobs.tengu$bombability$bombitem.desc=Тэнгу кінуў сюды дзіўную дымавую шашку, якая клубамі вырывае густы гарачы дым. Яна выдае гучны цокаючы гук, быццам вядзе адлік да выбуху!\n\nБомба прымацавана да зямлі, таму яе нельга падняць.
actors.mobs.tengu$bombability$bombitem.name=дымавая бомба
actors.mobs.tengu$fireability$fireblob.desc=Тэнгу кінуў дробны парашок, які, здаецца, пачынае парыцца і вось-вось загарэцца!
actors.mobs.tengu$shockerability$shockerblob.desc=Тут назапашваецца электрычная энергія, усё, што стаіць на гэтай плітцы, атрымае токавы разрад у наступны раз!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Яно выпрацоўвае занадта шмат электрычнасці, ты не можаш яго злавіць!
actors.mobs.tengu$shockerability$shockeritem.desc=Тэнгу кінуў сюды цікавую машыну, якая, здаецца, зроблена з дэталяў DM-100. Машына пастаянна выпраменьвае электрычную дугу вакол сябе, але, здаецца, гэта адбываецца па прадказальнай схеме.\n\nЗ усёй гэтай электрычнай дугай вакол яе няма ніякай магчымасці яе падняць.
actors.mobs.tengu$shockerability$shockeritem.name=Шокер
actors.mobs.tengu.defeated=Нарэшце вольны...
actors.mobs.tengu.desc=Тэнгу належаць да старажытнага клана забойцаў з такой жа назвай. Яны вядомыя частым выкарыстаннем сюрыкенаў і пастак.
actors.mobs.tengu.interesting=Давайце зробім гэта цікавым...
actors.mobs.tengu.name=Тэнгу
actors.mobs.tengu.notice_gotcha=Зразумеў, %s!
actors.mobs.tengu.notice_have=Цяпер ты ў мяне, %s!
actors.mobs.tengu.rankings_desc=Забіты тэнгу
actors.mobs.thief.carries=Злодзей носіць _%s._ Відавочна, што скрадзены.
actors.mobs.thief.desc=Нягледзячы на тое, што гэтыя зняволеныя свабодна блукаюць па сваіх камерах, гэта месца ўсё яшчэ застаецца іх турмой. З часам гэта месца забрала іх розум, а таксама іх свабоду. Даўно гэтыя вар'яты злодзеі і бандыты забыліся, хто яны і чаму крадуць.\n\nГэтыя ворагі хутчэй крадуць і ўцякаюць, чым змагаюцца. Трымайце іх навідавоку, інакш вы можаце больш ніколі не ўбачыць сваю скрадзеную рэч.
actors.mobs.thief.escapes=Злодзей уцячэ з вашым %s!
actors.mobs.thief.name=шалёны злодзей
actors.mobs.thief.stole=Злодзей скраў у цябе %s!
actors.mobs.tormentedspirit.desc=Пакутаваныя духі — гэта ў цэлым добразычлівыя духі, на якіх накладзены праклён. Пакуль яны праклятыя, яны будуць атакаваць як прывіды і будуць больш магутнымі!\n\nМагчыма, можна будзе ачысціць праклён, выкарыстоўваючы патрэбны прадмет, знаходзячыся побач з духам. Калі праклён будзе зняты, дух, безумоўна, будзе ўдзячны...
actors.mobs.tormentedspirit.name=пакутлівы дух
actors.mobs.tormentedspirit.thank_you=Дзякуй...
actors.mobs.vaultrat.desc=Гэты пацук мае некаторыя змены ў паводзінах, каб праверыць новага штучнага інтэлекту ворага ў сховішчы: \n_-_ Яго рух можна «пачуць» праз сцены\n_-_ Ён будзе блукаць па загадзя зададзеным патрулі\n_-_ Падчас блукання яго далёкасць выяўлення за напрамкам руху рэзка зніжаецца.\n_-_ Падчас сну далёкасць выяўлення яго таксама зніжаецца\n_-_ Калі ён выяўляе вас, ён «даследуе», перш чым пераключыцца на паляванне. Ворагі, якія даследуюць, рухаюцца да вас, але не атакуюць і іх лягчэй згубіцца за дзвярыма і кутамі.
actors.mobs.warlock.bolt_kill=Ценявая стрэла забіла цябе...
actors.mobs.warlock.desc=Калі дворфы пераключыліся з інжынернай справы на таемныя мастацтвы, уладу ў горадзе захапілі чарнакніжнікі. Яны пачалі з магіі стыхій, але хутка перайшлі да дэманалогіі і некрамантыі.
actors.mobs.warlock.name=дворф-чарнакніжнік
actors.mobs.wraith.desc=Прывід — гэта помслівы дух грэшніка, чыя магіла ці склеп былі парушаныя. Паколькі гэта эфемерная сутнасць, яе вельмі цяжка ўдарыць звычайнай зброяй.
actors.mobs.wraith.discover_hint=Вы можаце знайсці гэтага ворага ў любым месцы падзямелля.
actors.mobs.wraith.name=прывід
actors.mobs.yogdzewa$larva.desc=Гэтыя малюсенькія нашчадкі Ёг-Дзевы — простыя паслугачы, якіх лёгка стварыць. Хоць паасобку яны слабыя, іх хутка выклікаюць, і ў вялікай колькасці яны могуць стаць непераадольнымі.
actors.mobs.yogdzewa$larva.name=лічынка бога
actors.mobs.yogdzewa$larva.rankings_desc=Паглынуты Ёг-Дзевай
actors.mobs.yogdzewa$yogeye.rankings_desc=Паглынуты Ёг-Дзевай
actors.mobs.yogdzewa$yogripper.rankings_desc=Паглынуты Ёг-Дзевай
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Паглынуты Ёг-Дзевай
actors.mobs.yogdzewa.darkness=Цемра набліжаецца...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Ёг-Дзева — Старажытны Бог; вялікая пачвара, якая пранікае ў смяротныя светы і пажырае іх, каб падсілкоўваць свой бясконцы рост. Гномы, мабыць, прыцягнулі ўвагу гэтага касмічнага жаху, гуляючы з цёмнай магіяй, і з таго часу спрабуюць стрымаць яго.\n\nЁг-Дзева паходзіць з вымярэння сырога магічнага хаосу і не можа прыўнесці сваю сапраўдную форму ў гэты свет. Замест гэтага ён стварыў аватар і заклікаў дэманічных паслугачоў, каб яны выконвалі яго загады тут.\n\nГэта гіганцкае вока з'яўляецца цэнтрам сілы Ёг-Дзева ў гэтым свеце. Хоць само вока нерухомае, яно здольнае страляць магутнымі прамянямі дэманічнай магіі і заклікаць розных паслугачоў, каб дапамагчы сабе.
actors.mobs.yogdzewa.desc_spawners=Ты можаш адчуць хвалі дэманічнай энергіі, якія разлятаюцца ў вочы з верхніх паверхаў. Нешта, што ты пакінуў жывым там, наверсе, мусіць накіроўваць сваю энергію назад у Ёг-Дзеву. _Ёг выкарыстае гэтую энергію, каб выклікаць больш магутных паслугачоў!_
actors.mobs.yogdzewa.hope=ВАША. НАДЗЕЯ. — ГЭТА. ІЛЮЗІЯ!
actors.mobs.yogdzewa.name=Ёг-Дзева
actors.mobs.yogdzewa.notice=Я. БАЧУ. ЦЯБЕ.
actors.mobs.yogdzewa.rankings_desc=Паглынуты Ёг-Дзевай
actors.mobs.yogfist$brightfist.desc=Гэты кулак створаны з чыстай светлавой энергіі. Ён здольны страляць магутнымі прамянямі пякучага святла кожны ход! Гэтыя прамяні часова асляпляюць вас, а таксама наносяць значную шкоду. Кулак таксама здольны ненадоўга ахапіць арэну асляпляльным святлом, каб вы маглі ўцячы!\n\nАднак кулак не мае спецыяльных здольнасцей, якія ён мог бы выкарыстоўваць у блізкім бою.
actors.mobs.yogfist$brightfist.name=яркі кулак
actors.mobs.yogfist$brightfist.teleport=Кулак тэлепартуецца прэч у бліску святла, які сур'ёзна асляпляе цябе!
actors.mobs.yogfist$burningfist.desc=Вялізны кулак, ахоплены агнём. Пальцы з трэскам сціскаюцца, рассыпаючы жар па падлозе.
actors.mobs.yogfist$burningfist.name=палаючы кулак
actors.mobs.yogfist$darkfist.desc=Гэты кулак створаны з чыстай цёмнай энергіі. Ён здольны страляць магутнымі выбухамі цёмнай магіі кожны ход! Гэтыя выбухі аслабяць вашу крыніцу святла, а таксама нанясуць вялікую шкоду. Кулак таксама здольны на кароткі час ахінуць арэну цемрай, каб уцячы!\n\nАднак кулак не мае спецыяльных здольнасцей, якія ён мог бы выкарыстоўваць у блізкім бою.
actors.mobs.yogfist$darkfist.name=цёмны кулак
actors.mobs.yogfist$darkfist.teleport=Кулак тэлепартуецца прэч, выбухаючы цемрай і гасячы крыніцу святла!
actors.mobs.yogfist$rottingfist.desc=Велізарны кулак з гнілой плоці. Смярдзючая слізь сочыцца паміж пальцамі й пакідае плямы на камені.
actors.mobs.yogfist$rottingfist.name=гнілы кулак
actors.mobs.yogfist$rustedfist.desc=Гэты кулак зроблены з жывога металу. Гэта велізарная маса рухомага металу, якая валодае магутнымі атакамі ў блізкім бою і можа паралізаваць сваіх цэляў на адлегласці. З-за сваёй велізарнай масы кулак будзе атрымліваць любую нанесеную яму шкоду з цягам часу, а не адразу.\n\nАднак кулак негнучкі і не можа рухацца ў цесных праходах. Акрамя таго, хоць ён можа атрымліваць шкоду павольна, адкладзеная шкода будзе працягваць павялічвацца, калі па кулаку ўдараць некалькі разоў.
actors.mobs.yogfist$rustedfist.name=іржавы кулак
actors.mobs.yogfist$soiledfist.desc=Гэты кулак створаны з хаатычнай земляной магіі. Па меры руху ён пастаянна прымушае расліннасць прарастаць вакол сябе. Ён таксама можа страляць канцэнтраванымі землянымі выбухамі, якія аблоўліваюць яго цэль хуткарослымі ліянамі і каранямі!\n\nКулак атрымлівае сілу з гэтай расліннасці і будзе супраціўляцца пашкоджанням у залежнасці ад колькасці высокай або барозністай расліннасці побач!
actors.mobs.yogfist$soiledfist.name=брудны кулак
actors.mobs.yogfist.desc=Гэты кулак — адзін з аспектаў сілы Ёг-Дзевы. Кулакі звязаны з сілай Ёг-Дзевы і будуць абаронены ад любой шкоды, калі яны знаходзяцца блізка да вачэй.
actors.mobs.yogfist.invuln_warn=Кулак непаражальны, пакуль знаходзіцца побач з вокам!
actors.mobs.yogfist.rankings_desc=Паглынуты Ёг-Дзевай
actors.char.def_verb_evaded=ухіліўся
actors.char.enemy_hit=%s ударыў цябе
