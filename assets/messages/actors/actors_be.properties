actors.blobs.blizzard.desc=Тут кружыць завея.
actors.blobs.blizzard.name=завея
actors.blobs.confusiongas.desc=Тут кружыцца воблака газу блытаніны.
actors.blobs.confusiongas.name=газ для збянтэжанасці
actors.blobs.corrosivegas.desc=Тут кружыцца воблака смяротна небяспечнага едкага газу.
actors.blobs.corrosivegas.name=каразійны газ
actors.blobs.electricity.desc=Тут ярка іскрыцца электрычнае поле.
actors.blobs.electricity.name=электрычнасць
actors.blobs.electricity.ondeath=Ты быў шакаваны да смерці...
actors.blobs.electricity.rankings_desc=Удар токам
actors.blobs.fire.desc=Тут бушуе пажар.
actors.blobs.fire.name=агонь
actors.blobs.foliage.desc=Прамяні святла пранізваюць цемру падземнага саду.
actors.blobs.foliage.name=лісце
actors.blobs.freezing.desc=Паветра тут ненатуральна халоднае.
actors.blobs.freezing.name=ледзяное паветра
actors.blobs.goowarn.desc=Тут рояцца кавалачкі цёмнай энергіі!
actors.blobs.goowarn.name=цёмная энергія
actors.blobs.inferno.desc=Тут бушуе сапраўднае пекла.
actors.blobs.inferno.name=пекла
actors.blobs.paralyticgas.desc=Тут круціцца воблака паралітычнага газу.
actors.blobs.paralyticgas.name=паралітычны газ
actors.blobs.regrowth.name=адрастання
actors.blobs.sacrificialfire.desc=Тут ёсць алтар, на якім гарыць ахвярны агонь. Любая істота, забітая тут, будзе прынесена ў ахвяру духам падзямелля.\n\nМагчыма, калі будзе прынесена дастаткова ахвяр, будзе дадзена ўзнагарода?
actors.blobs.sacrificialfire.name=ахвярны агонь
actors.blobs.sacrificialfire.reward=Агонь успыхвае, а потым згасае, пакідаючы пасля сябе ўзнагароду!
actors.blobs.sacrificialfire.unworthy=Агонь паглынае тваю ахвяру, але не змяняецца.
actors.blobs.sacrificialfire.worthy=Агонь паглынае тваю ахвяру і становіцца мацнейшым.
actors.blobs.smokescreen.desc=Тут клубіцца воблака густога чорнага дыму.
actors.blobs.smokescreen.name=дымавая завеса
actors.blobs.stenchgas.desc=Тут клубіцца воблака смуроднага смуроду.
actors.blobs.stenchgas.name=смярдзючы газ
actors.blobs.stormcloud.desc=Тут кружыцца воблака вадзяной пары.
actors.blobs.stormcloud.name=навальнічныя хмары
actors.blobs.toxicgas.desc=Тут круціцца зеленаватае воблака таксічнага газу.
actors.blobs.toxicgas.name=таксічны газ
actors.blobs.toxicgas.ondeath=Ты памёр ад таксічнага газу...
actors.blobs.toxicgas.rankings_desc=Задушаны
actors.blobs.waterofawareness.desc=З вады гэтай студні выпраменьваецца сіла ведаў. Калі вы вып'еце з яе, вы зможаце цалкам вызначыць усе экіпіраваныя прадметы, вызначыць праклёны на ўсіх прадметах у вашым інвентары і адкрыць усе прадметы на бягучым паверсе.
actors.blobs.waterofawareness.name=вада ўсведамлення
actors.blobs.waterofawareness.procced=Калі вы робіце глыток, вы адчуваеце, як веды ўліваюцца ў ваш розум.
actors.blobs.waterofhealth.desc=З вады гэтай крыніцы выпраменьваецца сіла здароўя. Піццё з гэтай крыніцы загоіць вашы раны, здаволіць голад і ачысціць праклёны з любых паношаных рэчаў.
actors.blobs.waterofhealth.name=вада здароўя
actors.blobs.waterofhealth.procced=Калі ты робіш глыток, ты адчуваеш, як твае раны цалкам гояцца.
actors.blobs.web.desc=Тут усё пакрыта густой павуціннем. Усё, што дакранецца да павуціння або будзе кінута праз яго, парве яго, але таксама затрымаецца на месцы.
actors.blobs.web.name=павуцінне
actors.buffs.adrenaline.desc=Прыліў фізічнай сілы, адрэналін павялічыў як хуткасць атакі, так і перамяшчэння.\n\nАдрэналін дазваляе сваёй цэлі бегчы з хуткасцю ў 2 разы і атакаваць з хуткасцю ў 1,5 раза.\n\nХодаў засталося: %s.
actors.buffs.adrenaline.name=адрэналін
actors.buffs.adrenalinesurge.desc=Прыліў вялікай моцы, але, на жаль, не пастаянны.\n\nПавышэнне сілы: +%d.\nХадзіцца, пакуль узмацненне не аслабне: %s.
actors.buffs.adrenalinesurge.name=павышэнне сілы
actors.buffs.amok.desc=Амак выклікае ў сваёй цэлі стан моцнай лютасці і разгубленасці.\n\nКалі істота пад дымам, яна атакуе ўсё, што знаходзіцца побач, няхай гэта будзе сябар ці вораг.\n\nХадоў амока, што засталіся: %s.
actors.buffs.amok.name=амок
actors.buffs.arcanearmor.desc=Тонкі шчыт акружае вас, блакуючы частку шкоды ад магічных атак.\n\nВашы магічныя даспехі зараз узмацняюцца на: 0-%d.\n\nХадзяць, пакуль таемныя даспехі не аслабнуць: %s.
actors.buffs.arcanearmor.name=таемная браня
actors.buffs.artifactrecharge.desc=Энергія працякае праз вас, павялічваючы хуткасць зарадкі вашых артэфактаў.\n\nНа кожны артэфакт уплывае крыху па-рознаму, але ўсе яны будуць зараджацца значна хутчэй, чым звычайна.\n\nХадоў засталося: %s.
actors.buffs.artifactrecharge.name=падзарадка артэфактаў
actors.buffs.ascensionchallenge.almost=Ты адчуваеш, як хватка Ёга на амулеце пачынае слабець, ты амаль на месцы!
actors.buffs.ascensionchallenge.beckon=Амулет пачынае заклікаць далёкіх ворагаў.
actors.buffs.ascensionchallenge.break=Ты на хвілінку пераводзіш дыханне і адчуваеш, як твае раны пачынаюць зацягвацца!
actors.buffs.ascensionchallenge.damage=Амулет пачынае выпраменьваць цёмную энергію. Ён гарыць!
actors.buffs.ascensionchallenge.desc=Неяк Ёг-Дзева падтрымлівае ўплыў на гэты свет праз амулет і спрабуе спыніць ваша ўзыходжанне!\n\nСіла Ёга робіць падзямелле значна больш небяспечным, павялічваючы колькасць ворагаў і робячы іх мацнейшымі! Гэтая сіла будзе працягваць нарастаць, калі яе не кантраляваць, яе можна аслабіць, перамагаючы ворагаў, якія былі ўзмоцнены сілай Ёга.
actors.buffs.ascensionchallenge.desc_beckon=Амулет зараз _кліча далёкіх ворагаў_, папярэджваючы іх пра ваша месцазнаходжанне.
actors.buffs.ascensionchallenge.desc_clear=Цёмная энергія, якая выпраменьваецца з амулета, пакуль што аслаблена максімальна.
actors.buffs.ascensionchallenge.desc_damage=Энергія амулета стала настолькі моцнай, што _непасрэдна шкодзіць табе!_
actors.buffs.ascensionchallenge.desc_haste=Амулет зараз _паскарае далёкіх ворагаў_, дазваляючы ім хутчэй дабрацца да вас!
actors.buffs.ascensionchallenge.desc_slow=Амулет зараз _запавольвае вас_ і знішчае эфекты павышэння хуткасці!
actors.buffs.ascensionchallenge.haste=Амулет пачынае прыспешваць далёкіх ворагаў!
actors.buffs.ascensionchallenge.name=праклён амулета
actors.buffs.ascensionchallenge.on_kill=Цёмная энергія паглынае цябе...
actors.buffs.ascensionchallenge.slow=Амулет пачынае адчувацца як свінцовы груз у вашым інвентары!
actors.buffs.ascensionchallenge.weaken=Вы можаце адчуць, як праклён амулета трохі слабее.
actors.buffs.ascensionchallenge.weaken_info=Праклён амулета можна аслабіць, перамагчы большую колькасць ворагаў.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Калі вы пераможаце ворагаў, праклён амулета аслабне!
actors.buffs.barkskin.desc=Ваша скура зацвярдзелая, яна навобмацак шурпатая і цвёрдая, як кара.\n\nЗацвярдзелая скура павялічвае вашу эфектыўную браню, дазваляючы вам лепш абараняцца ад фізічнай атакі.\n\nВаша браня ў цяперашні час павялічваецца на: 0-%d.\nХадзяць, пакуль скура кары не аслабне: %s.\n\nКалі вы атрымліваеце скуру кары з некалькіх крыніц, будзе выкарыстоўвацца толькі самая моцная.
actors.buffs.barkskin.name=каровая скура
actors.buffs.barrier.desc=Трывалая бурбалка сілы, якая блакуе ўсе пашкоджанні.\n\nБар'ер будзе атрымліваць пашкоджанні ад таго, што ён абараняе, пакуль ёсць экраніроўка. Экраніроўка таксама будзе павольна змяншацца з цягам часу.\n\nЗасталося экраніроўкі: %d.
actors.buffs.barrier.name=бар'ер
actors.buffs.berserk.action_name=Берсерк
actors.buffs.berserk.angered=раззлаваны
actors.buffs.berserk.angered_desc=Цяжар траўмаў берсеркера ўзмацняе яго ўдары. Па меры таго, як берсеркер атрымлівае фізічную шкоду, яго лютасць нарастае, даючы яму бонусную шкоду. Шкода, блакіраваная бранёй, усё роўна ўлічваецца пры назапашванні лютасці.\n\nЛютасць з часам будзе згасаць. Чым меншы запас здароўя берсеркера, тым даўжэй ён будзе доўжыцца.\n\nПры 100%% лютасці берсеркер можа ўвайсці ў шаленства, што дае яму шчыт у залежнасці ад узроўню яго брані і адсутнага здароўя. Падчас берсерка яго абарона з часам змяншаецца, і як толькі яна скончыцца, яму давядзецца адпачыць, перш чым зноў аднавіць лютасць.\n\nБягучая лютасць: _%1$.0f%%_\n_+%2$.0f%%_ пашкоджанні\n\nШчыт берсерка пры бягучай брані і HP: _%3$d_
actors.buffs.berserk.berserk=берсеркінг
actors.buffs.berserk.berserk_desc=Страх і няўпэўненасць знікаюць, пакідаючы толькі гнеў. У гэтым стане Берсеркер надзвычай магутны, _наносячы +50%% шкоду і атрымліваючы бонус да экранавання,_ але таксама губляючы экранаванне кожны ход.\n\nКалі ўся яго экраніроўка зніжаецца да 0, берсеркерства скончыцца.\n\nПасля лютавання Берсеркеру трэба будзе аднавіцца, перш чым зноў адчуць лютасць.\n\nШчыта засталося: %d
actors.buffs.berserk.exhausted=знясілены
actors.buffs.berserk.no_seal=Табе патрэбна твая зламаная пячатка, каб звар'яцець!
actors.buffs.berserk.rankings_desc=Звар'яцеў да смерці
actors.buffs.berserk.recovering=аднаўляецца
actors.buffs.berserk.recovering_desc=Унутраная сіла мае свае межы. Берсеркер павінен адпачыць, перш чым зноў выкарыстоўваць сваю лютасць.\n\nПадчас аднаўлення Берсеркер не назапашвае лютасць ад атрыманай шкоды.
actors.buffs.berserk.recovering_desc_levels=Узроўні да аднаўлення: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Паварочваецца, пакуль не аднавіцца: _%d_
actors.buffs.bleeding.desc=З гэтай раны выцякае трывожная колькасць крыві.\n\nКрывазліццё прычыняе шкоду кожны ход. З кожным ходам шкода памяншаецца на выпадковую велічыню, пакуль крывацёк нарэшце не спыніцца.\n\nБягучая шкода ад крывацёку: %d.
actors.buffs.bleeding.heromsg=Ты крывавіш!
actors.buffs.bleeding.name=крывацёк
actors.buffs.bleeding.ondeath=Ты скончыў крывёю...
actors.buffs.bleeding.rankings_desc=Смерць ад страты крыві
actors.buffs.bless.desc=Выдатны выбух канцэнтрацыі, некаторыя кажуць, што ён натхнёны багамі.\n\nДабраславеньне павялічвае дакладнасць і ўхіленне на 25%%, робячы дабраславёнага значна больш эфектыўным у баі.\n\nХад дабраславеньня, што застаўся: %s.
actors.buffs.bless.name=благаслаўлёны
actors.buffs.blindness.desc=Асляпленне ператварае навакольны свет у цёмную імглу.\n\nПадчас асляплення дыяпазон зроку персанажа скарачаецца да адной клеткі, што робіць дыстанцыйныя атакі бескарыснымі і дае магчымасць лёгка згубіць з поля зроку далёкіх ворагаў. Акрамя таго, асляплены герой не можа чытаць скруткі або кнігі.\n\nЗасталося ачкоў сляпоты: %s.
actors.buffs.blindness.heromsg=Ты аслеп!
actors.buffs.blindness.name=аслеплены
actors.buffs.blobimmunity.desc=Нейкая дзіўная сіла ахінае вас тонкім ахоўным бар'ерам, блакуючы ўсе шкодныя паветраныя эфекты.\n\nПакуль дзейнічае гэты бар'ер, вы неўспрымальныя да ўсіх эфектаў, абмежаваных зонай.\n\nХадоў імунітэту засталося: %s.
actors.buffs.blobimmunity.name=ачышчальны бар'ер
actors.buffs.burning.burnsup=%s згарае!
actors.buffs.burning.desc=Мала што можа быць больш трывожным, чым апынуцца ў полымі.\n\nАгонь будзе наносіць шкоду кожны ход, пакуль не будзе патушаны вадой або не згасне. Агонь можна патушыць, ступіўшы ў ваду або пырскамі разбуральнага зелля.\n\nАкрамя таго, агонь можа запаліць лёгкаўзгаральную мясцовасць або прадметы, з якімі ён дакранецца.\n\nХадоў гарэння, што засталося: %s.
actors.buffs.burning.heromsg=Ты загарэўся!
actors.buffs.burning.name=паленне
actors.buffs.burning.ondeath=Ты згарэў жыўцом...
actors.buffs.burning.rankings_desc=Згарэў дашчэнту
actors.buffs.championenemy$antimagic.desc=Чэмпіёны па барацьбе з магіяй атрымліваюць на 50% менш шкоды і цалкам неўспрымальныя да магічных эфектаў.
actors.buffs.championenemy$antimagic.name=чэмпіён па антымагіі
actors.buffs.championenemy$blazing.desc=Палымяныя чэмпіёны наносяць на 25% больш шкоды ў блізкім бою, падпальваюць ворагаў, якіх атакуюць, маюць імунітэт да агню і распаўсюджваюць агонь вакол сябе пасля смерці. Аднак яны не могуць распаўсюджваць агонь па вадзе.
actors.buffs.championenemy$blazing.name=бліскучы чэмпіён
actors.buffs.championenemy$blessed.desc=Дабраславёныя чэмпіёны маюць 4-кратную дакладнасць і ўхіленне.
actors.buffs.championenemy$blessed.name=благаслаўлёны чэмпіён
actors.buffs.championenemy$giant.desc=Гіганцкія чэмпіёны атрымліваюць на 80% менш шкоды і маюць +1 да далёкасці атакі, але не могуць перамяшчацца ў замкнёных прасторах.
actors.buffs.championenemy$giant.name=гіганцкі чэмпіён
actors.buffs.championenemy$growing.desc=Чэмпіёны, якія развіваюцца, атрымліваюць пастаянна ўзрастаючы бонус да дакладнасці, ухілення, фізічнай шкоды і зніжэння атрыманай шкоды.\n\nБягучы прырост хуткасці/паляпшэння/шкоды: %1$d%%\nБягучае зніжэнне шкоды: %2$d%%
actors.buffs.championenemy$growing.name=чэмпіён па росце
actors.buffs.championenemy$projecting.desc=Праекцыйныя чэмпіёны наносяць на 25% больш шкоды ў блізкім бою і маюць +3 да далёкасці атакі.
actors.buffs.championenemy$projecting.name=праектуючы чэмпіён
actors.buffs.championenemy.warn=Ты адчуваеш смяротную прысутнасць.
actors.buffs.charm.cant_attack=Вы зачараваныя гэтым ворагам і не можаце яго атакаваць.
actors.buffs.charm.desc=Абаянне — гэта маніпулятыўная магія, якая можа часова прымусіць ворагаў любіць адзін аднаго.\n\nПерсанажы, на якіх распаўсюджваецца абаянне, не могуць непасрэдна атакаваць ворага, якім яны зачараваны. Аднак атакаваць іншыя мэты ўсё яшчэ можна. Шок болю скароціць працягласць абаяння.\n\nХадоў абаяння, што засталіся: %s.
actors.buffs.charm.heromsg=Ты зачараваная!
actors.buffs.charm.name=зачараваны
actors.buffs.chill.desc=Не зусім замарожаныя, але ўсё яшчэ занадта халодныя.\n\nАстуджаныя мэты выконваюць усе дзеянні павольней, у залежнасці ад таго, колькі хадоў засталося ў эфекте. У горшым выпадку гэта эквівалентна запаволенню.\n\nХадоў астуджэння, якія засталіся: %1$s.\nХуткасць зніжаецца на: %2$s%%
actors.buffs.chill.freezes=%s замярзае!
actors.buffs.chill.name=астуджаныя
actors.buffs.combo$combomove.clobber.desc=Адкідвае ворага на 2 клеткі назад, але не наносіць шкоды і не можа збіць у ямы. Павялічвае камбінацыю на 1.
actors.buffs.combo$combomove.clobber.empower_desc=Адкідвае ворага на _3 клеткі назад, выклікае галавакружэнне і можа збіваць у ямы,_ але не наносіць шкоды. Павялічвае камбінацыю на 1.
actors.buffs.combo$combomove.clobber.name=разбіць
actors.buffs.combo$combomove.crush.desc=Наносіць %d%% (камбінацыя*25%%) шкоды асноўнай цэлі і палову гэтай шкоды ўсім астатнім ворагам у зоне дзеяння 7x7. Скідае камбінацыю пры выкарыстанні.
actors.buffs.combo$combomove.crush.empower_desc=_Падскоквае да клеткі(-ак) %1$d_ і наносіць %2$d%% (камбінацыя*25%%) пашкоджанняў асноўнай цэлі і палову гэтай шкоды ўсім астатнім ворагам у зоне дзеяння 7x7. Скідае камбінацыю пры выкарыстанні.
actors.buffs.combo$combomove.crush.name=раздушыць
actors.buffs.combo$combomove.fury.desc=За кожную камбінацыю трапляе ў ворага адзін раз, кожны ўдар наносіць 60% шкоды і можа актываваць чары. Скідае камбінацыю пры выкарыстанні.
actors.buffs.combo$combomove.fury.empower_desc=_Падскоквае да клеткі(-ак) %d_ і трапляе па ворагу адзін раз за кожнае камбінаванае ўдарнае ўдар, кожны ўдар наносіць 60%% адзінак шкоды і можа актываваць зачараванні. Скідае камбінацыю пры выкарыстанні.
actors.buffs.combo$combomove.fury.name=лютасць
actors.buffs.combo$combomove.parry.desc=Пры актывацыі блакуе наступную атаку на працягу 1 ходу і імгненна адказвае на яе. Скідае камбінацыю, калі нічога не адбіваецца.
actors.buffs.combo$combomove.parry.empower_desc=Блакуе _усе атакі_ на працягу 1 ходу пры актывацыі і імгненна адказвае на іх. Скідае камбінацыю, калі нічога не адбіваецца.
actors.buffs.combo$combomove.parry.name=парыраваць
actors.buffs.combo$combomove.slam.desc=Наносіць %d%% (камбінацыя*20%%) адзінкі вашай здольнасці блакіраваць ўрон у якасці дадатковай шкоды. Скідае камбінацыю пры выкарыстанні.
actors.buffs.combo$combomove.slam.empower_desc=_Падскоквае на клетку(кі) %1$d_ і наносіць %2$d%% (камбінацыя*20%%) ад вашай сілы блакавання ўрону ў якасці дадатковай шкоды. Скідае камбінацыю пры выкарыстанні.
actors.buffs.combo$combomove.slam.name=шлёп
actors.buffs.combo.action_name=камбінаваная атака
actors.buffs.combo.bad_target=Вы павінны нацэліцца на ворага, які знаходзіцца ў зоне атакі.
actors.buffs.combo.combo=%d хіт-камбінацыя!
actors.buffs.combo.desc=Гладыятар набірае абароты, наносячы паспяховыя ўдары. Кожная атака павялічвае лічыльнік камбінацый на адзінку, але занадта доўгі перапынак паміж ударамі скіне лічыльнік камбінацый да 0. Пакуль у гладыятара ёсць камбінацыя, любы шчыт, які ён мае ад пашкоджанай пячаткі, не пачне знікаць.\n\nСтварэнне камбінацый адкрывае спецыяльныя камбінацыйныя атакі, якія немагчыма прамахнуцца! Розныя атакі адкрываюцца пры колькасці камбінацый 2, 4, 6, 8 і 10. Некаторыя рухі скідаюць камбінацый, а некаторыя не, але кожны рух можна выкарыстоўваць толькі адзін раз за сеанс камбінацый.\n\nБягучае камбінацыйнае дзеянне: %1$d.\n\nХад, пакуль не будзе страчана камбінацыйнае дзеянне: %2$s.
actors.buffs.combo.name=камбінацыя
actors.buffs.combo.prompt=Выберыце цэль для атакі.
actors.buffs.corrosion.desc=Магутная кіслата плавіць плоць, метал і косці з трывожнай хуткасцю.\n\nШкода ад карозіі павялічваецца з цягам часу, па меры таго, як цэль працягвае раставаць.\n\nАбароты карозіі, якія засталіся: %1$s.\nБягучая шкода ад карозіі: %2$d.
actors.buffs.corrosion.heromsg=Ты растаеш!
actors.buffs.corrosion.name=карозія
actors.buffs.corrosion.ondeath=Ты растаеш...
actors.buffs.corrosion.rankings_desc=Раствораны
actors.buffs.corruption.desc=Карупцыя пранікае ў сутнасць істоты, скажаючы яе супраць яе былой прыроды.\n\nКарупцыйныя істоты будуць атакаваць сваіх саюзнікаў і ігнараваць сваіх былых ворагаў. Карупцыя таксама разбуральная і павольна прывядзе да таго, што яе цэль паддасца.\n\nКарупцыя незваротная, яе наступствы сканчаюцца толькі смерцю.
actors.buffs.corruption.name=пашкоджаны
actors.buffs.cripple.desc=Ты ўпэўнены, што ногі не павінны згінацца такім чынам.\n\nПакалечаны скарачае хуткасць руху ўдвая, таму перамяшчэнне пліткі звычайна займае два хады замест аднаго.\n\nХадоў пакалечанага, што засталося: %s.
actors.buffs.cripple.heromsg=Ты калека!
actors.buffs.cripple.name=скалечаны
actors.buffs.daze.desc=Звон у вушах і затуманены зрок абцяжарваюць бой.\n\nПадчас ашаломлення дакладнасць і ўхіленне ад удараў зніжаюцца на 50%%, што значна ўскладняе як прызямленне, так і ўхіленне ад удараў.\n\nХод хадоў ашаломлення, якія засталіся: %s.
actors.buffs.daze.heromsg=Ты ашаломлены!
actors.buffs.daze.name=ашаломлены
actors.buffs.degrade.desc=Магутная цёмная магія высмоктвае сілу, якую скруткі паляпшэння надалі вашаму рыштунку!\n\nПадчас дэградацыі палепшанае рыштунак будзе разглядацца як ніжэйшага ўзроўню, чым яно ёсць на самой справе. _Кожнае паляпшэнне пасля +3 становіцца экспанентна слабейшым за папярэдняе._ Апісанні вашых прадметаў будуць змяняцца, каб адлюстраваць іх зніжаны ўзровень магутнасці.\n\nПадзенне не ўплывае на патрабаванні да сілы, зарады палачак, трываласць кідальнай зброі або артэфактаў.\n\nХадоў дэградацыі, што засталіся: %s. Выкарыстанне скрутка паляпшэння або зняцця праклёну неадкладна спыніць дэградацыю.
actors.buffs.degrade.heromsg=Ваша абсталяванне здаецца слабейшым!
actors.buffs.degrade.name=дэградаваны
actors.buffs.doom.desc=Цяжка працягваць, калі здаецца, што Сусвет хоча тваёй смерці.\n\nАсуджаныя персанажы атрымаюць +67% шкоды ад усіх крыніц.\n\nАсуджэнне пастаяннае, яго эфекты заканчваюцца толькі смерцю.
actors.buffs.doom.name=асуджаны
actors.buffs.dread.desc=Жах настолькі моцны, што прымусіць цэль цалкам уцячы з падзямелля!\n\nІстоты, ахопленыя жахам, будуць уцякаць ад суперніка з вялікай хуткасцю і цалкам знікнуць з падзямелля, як толькі знікнуць з поля зроку. Ворагі, пераможаныя такім чынам, атрымліваюць палову вопыту і не губляюць прадметаў. Шок болю скароціць працягласць жаху.\n\nХадоў жаху, што засталося: %d.
actors.buffs.dread.name=жах
actors.buffs.drowsy.desc=Магічная сіла перашкаджае цэлі не заснуць, праз некалькі хадоў яна ўпадае ў глыбокі магічны сон.\n\nГерой можа супрацьстаяць дрымотнасці, атрымліваючы шкоду або будучы ў поўным здароўі.\n\nХады да сну: %s.
actors.buffs.drowsy.name=сонны
actors.buffs.earthimbue.desc=Вы прасякнуты сілай зямлі!\n\nУсе фізічныя атакі зрушаць зямлю пад ворагам, на кароткі час калечачы яго.\n\nАбароты напаўнення зямлёй, што засталіся: %s.
actors.buffs.earthimbue.name=прасякнуты зямлёй
actors.buffs.enhancedrings.desc=Нядаўна выкарыстаны артэфакт Разбойніка ўзмацняе яго пярсцёнкі, даючы ім +1 узровень. \n\n Засталося хадоў: %s.
actors.buffs.enhancedrings.name=палепшаныя кольцы
actors.buffs.fireimbue.desc=Вы прасякнуты сілай агню!\n\nУсе фізічныя атакі маюць шанец падпаліць ворагаў. Акрамя таго, вы цалкам неўспрымальныя да ўздзеяння агню.\n\nХадоў напаўнення агнём, што засталося: %s.
actors.buffs.fireimbue.name=прасякнуты агнём
actors.buffs.foresight.desc=Вы нейкім чынам здольныя бачыць планіроўку навакольнага ландшафту сваім розумам.\n\nПад уздзеяннем прадбачання вам адкрываюцца ўсе пліткі ў шырокім радыусе, у тым ліку любыя сакрэтныя пасткі або дзверы.\n\nПакуль што засталося хадоў прадбачання: %s.
actors.buffs.foresight.name=прадбачанне
actors.buffs.frost.desc=Не блытаць з замярзаннем, гэта больш мяккае замярзанне проста ахінае цэль лёдам.\n\nЗамарожванне дзейнічае падобна да паралічу, робячы немагчымым дзеянне цэлі. У адрозненне ад паралічу, замарожванне неадкладна адмяняецца, калі цэль атрымлівае пашкоджанні, бо лёд разбіваецца.\n\nХадоў замарожвання, што засталіся: %s.
actors.buffs.frost.freezes=%s замярзае!
actors.buffs.frost.name=замарожаны
actors.buffs.frostimbue.desc=Вы напоўнены ледзяной сілай!\n\nУсе фізічныя атакі будуць паступова назапашваць холад на ворагах. Акрамя таго, вы цалкам неўспрымальныя да холаду.\n\nХодаў напаўнення лёдам, якія засталіся: %s.
actors.buffs.frostimbue.name=прасякнуты марозам
actors.buffs.fury.desc=Ты злуешся, ворагі не будуць любіць цябе, калі ты злуешся.\n\nA Унутры цябе палае вялікая лютасць, якая павялічвае шкоду, якую ты наносіш фізічнымі атакамі, на 50%%.\n\nГэтая лютасць будзе доўжыцца, пакуль у цябе будзе менш за 50%% здароўя.
actors.buffs.fury.heromsg=Ты пачынаеш лютаваць!
actors.buffs.fury.name=раз'юшаны
actors.buffs.gravitychaostracker.desc_duration=Незразумела, як доўга будзе доўжыцца эфект, але ён не можа доўжыцца вечна.
actors.buffs.gravitychaostracker.desc_intro=Кожныя некалькі хадоў усе персанажы на бягучым падзямеллі будуць кідацца ў выпадковым кірунку.
actors.buffs.gravitychaostracker.desc_positive=Здаецца, што вы і вашы саюзнікі неўспрымальныя.
actors.buffs.gravitychaostracker.name=гравітацыйны хаос
actors.buffs.greaterhaste.desc=Неверагодны прырост хуткасці, на імгненне здаецца, што ўсё астатняе спынілася.\n\nПад уздзеяннем большай хуткасці дзеянні руху зусім не займаюць часу, але іншыя дзеянні ўсё яшчэ выконваюцца з нармальнай хуткасцю. Кожны крок руху спажывае ход большай хуткасці.\n\nХадоў большай хуткасці, што засталося: %d.
actors.buffs.greaterhaste.name=большая паспешлівасць
actors.buffs.haste.desc=Энергія праходзіць праз вашы мышцы, дазваляючы вам бегаць з неверагоднай хуткасцю!\n\nПад уздзеяннем паспешнасці вы будзеце бегаць з хуткасцю ў 3 разы большай, але ўсе астатнія дзеянні будзеце выконваць з нармальнай хуткасцю.\n\nХадоў паспешнасці, што засталося: %s.
actors.buffs.haste.name=паспешлівасць
actors.buffs.healing.desc=Магічны сродак прымушае раны закрывацца, а плоць зрастацца.\n\nЗдароўе будзе паступова аднаўляцца кожны ход, пакуль не скончыцца эфект гаення. З часам колькасць гаення можа змяншацца.\n\nНаступнае гаенне: %d.\n\nЗасталося гаення: %d.
actors.buffs.healing.name=гаенне
actors.buffs.herodisguise.desc=Ілюзорная магія змяніла твой знешні выгляд! Эфект чыста касметычны, але ўсё роўна адчуваецца вельмі дзіўна.\n\n Засталіся хады маскіроўкі: %s.
actors.buffs.herodisguise.name=маскіроўка
actors.buffs.hex.desc=Цёмная магія, якая пагаршае канцэнтрацыю, злёгку дэзарыентуючы цэль.\n\nПраклён змяншае дакладнасць і ўхіленне на 20%%, што робіць цэль менш эфектыўнай у баі.\n\nХадоў праклёну, што засталося: %s.
actors.buffs.hex.heromsg=Цябе праклялі!
actors.buffs.hex.name=закляты
actors.buffs.holdfast.desc=Воін утрымлівае сваю пазіцыю, павялічваючы сваю браню на %1$d-%2$d і запавольваючы хуткасць распаду некаторых бафаў на %3$d%%. Гэта будзе доўжыцца, пакуль ён не зрушыцца.
actors.buffs.holdfast.name=трымайся моцна
actors.buffs.hunger.cursedhorn=Пракляты рог крадзе частку энергіі ежы, калі вы ясце.
actors.buffs.hunger.desc=Пачуццё голаду паступова ўзмацняецца па меры знаходжання ў падзямеллі, і ў рэшце рэшт вы пачнеце галадаць. Падчас галадання вы будзеце паступова губляць здароўе замест таго, каб аднаўляць яго.\n\nРаркіраванне важна! Калі ў вас ёсць лішняе здароўе, голад — нядрэнная ідэя, калі гэта азначае, што пазней будзе больш ежы. Эфектыўнае ракіраванне можа значна падоўжыць запас ежы!
actors.buffs.hunger.desc_intro_hungry=Вы можаце адчуць, як ваш страўнік кліча на ежу, але пакуль што гэта не надта тэрмінова.
actors.buffs.hunger.desc_intro_starving=Ты так галодны, што аж баліць.
actors.buffs.hunger.hungry=галодны
actors.buffs.hunger.ondeath=Ты памёр ад голаду...
actors.buffs.hunger.onhungry=Ты галодны.
actors.buffs.hunger.onstarving=Ты галадаеш!
actors.buffs.hunger.rankings_desc=Замораны голадам
actors.buffs.hunger.starving=галодны
actors.buffs.invisibility.desc=Вы цалкам зліваюцца з навакольным ландшафтам, таму вас немагчыма ўбачыць.\n\nПакуль вы нябачныя, ворагі не могуць атакаваць вас або сачыць за вамі. Фізічныя атакі і магічныя эфекты (напрыклад, скруткі і палачкі) неадкладна адключаць нябачнасць.\n\nХодаў нябачнасці, якія засталіся: %s.
actors.buffs.invisibility.name=нябачны
actors.buffs.invulnerability.desc=Гэты персанаж надзелены вялікай ахоўнай сілай, якая дае яму кароткі перыяд неўразлівасці!\n\nХадоў засталося: %s.
actors.buffs.invulnerability.name=непаражальны
actors.buffs.levitation.desc=Магічная сіла левітавае вас над зямлёй, прымушаючы вас адчуваць сябе бязважкім.\n\nЛевітавальныя персанажы рухаюцца бясшумна і ігнаруюць усе наземныя эфекты. Пасткі не спрацуюць, вада не патушыць агонь, расліны не будуць затоптаныя, карані не прамахнуцца, а над ямамі будуць лунаць паветры. Будзьце асцярожныя, бо ўсё гэта можа ўступіць у сілу ў тую ж секунду, як левітацыя скончыцца!\n\nАсталося хадоў левітацыі: %s.
actors.buffs.levitation.name=левітуючы
actors.buffs.lifelink.desc=Жыццёвая сіла гэтага персанажа звязана з іншым персанажам побач. Любая атрыманая шкода размяркоўваецца паміж імі.\n\nКожны раз, калі гэты персанаж атрымлівае шкоду, палова яе будзе нанесена цэлі, якая мае сувязь жыцця.\n\nХадоў сувязі жыцця, што засталіся: %s.
actors.buffs.lifelink.name=жыццёвая сувязь
actors.buffs.lifelink.ondeath=Шкода, звязаная з жыццём, забіла цябе...
actors.buffs.light.desc=Нават у самым цёмным падзямеллі пастаяннае святло побач заўсёды суцяшае.\n\nСвятло дапамагае стрымліваць цемру, дазваляючы бачыць на разумнай адлегласці, нягледзячы на навакольнае асяроддзе.\n\nКолькасць паваротаў асвятлення, што засталіся: %s.
actors.buffs.light.name=падсветлены
actors.buffs.lockedfloor.desc=Бягучы паверх заблакіраваны, і вы не можаце яго пакінуць!\n\nПакуль паверх заблакіраваны, вы не будзеце адчуваць голад і не будзеце атрымліваць шкоду ад голаду. Акрамя таго, калі вы не будзеце працаваць над перамогай над босам гэтага паверха, пасіўныя эфекты рэгенерацыі таксама спыняцца.\n\nАкрамя таго, калі вас ажывіць неблаславёны анкх, пакуль паверх заблакіраваны, то ён скіне налады.\n\nЗабіце боса гэтага паверха, каб зламаць замак.
actors.buffs.lockedfloor.name=падлога зачынена
actors.buffs.lostinventory.desc=Ваш інвентар згубіўся недзе ў падзямеллі! Вы не зможаце падабраць або выкарыстаць большасць прадметаў, пакуль не вернеце яго.
actors.buffs.lostinventory.name=страчаны інвентар
actors.buffs.magicalsight.desc=Неяк вы можаце бачыць розумам, а не вачыма.\n\nПакуль актыўны магічны зрок, вы зможаце бачыць скрозь усю мясцовасць у радыусе 12 плітак.\n\nХадоў магічнага зроку, якія засталіся: %s.
actors.buffs.magicalsight.name=чароўны від
actors.buffs.magicalsleep.desc=Гэты персанаж заснуў глыбокім магічным сном, з якога ён не прачнецца натуральным шляхам.\n\nМагічны сон падобны да звычайнага сну, за выключэннем таго, што толькі пашкоджанні прымушаюць цэль ачуняць.\n\nДля героя і яго саюзнікаў магічны сон мае некаторыя аднаўленчыя ўласцівасці, дазваляючы ім хутка аднаўляцца падчас адпачынку.
actors.buffs.magicalsleep.fallasleep=Ты пагружаешся ў глыбокі чароўны сон.
actors.buffs.magicalsleep.name=чароўны сон
actors.buffs.magicalsleep.toohealthy=Ты занадта здаровы і супраціўляешся жаданню заснуць.
actors.buffs.magicalsleep.wakeup=Вы прачынаецеся бадзёрымі і здаровымі.
actors.buffs.magicimmune.desc=Усе магічныя эфекты страцілі над вамі ўплыў, вы цалкам неўспрымальныя да іх.\n\nНягледзячы на імунітэт да магіі, усе шкодныя і карысныя магічныя эфекты не будуць на вас распаўсюджвацца, у тым ліку праклёны, чары, палачкі, скруткі, пярсцёнкі, артэфакты і г.д. Здольнасці гераічнай брані дастаткова моцныя, каб працаваць незалежна ад гэтага эфекту.\n\nХадоў магічнага імунітэту, што засталіся: %s.
actors.buffs.magicimmune.name=імунітэт да магіі
actors.buffs.mindvision.desc=Неяк ты здольны бачыць усіх істот на гэтым паверсе праз свой розум. Гэта дзіўнае пачуццё.\n\nУсе персанажы на гэтым паверсе бачныя табе, пакуль у цябе ёсць разумовы зрок. Бачанне істоты праз разумовы зрок лічыцца тым, што яна бачная або знаходзіцца побач, для многіх магічных эфектаў.\n\nАстатак розумовага зроку: %s.
actors.buffs.mindvision.name=зрок розуму
actors.buffs.momentum.action_name=фрыран
actors.buffs.momentum.momentum=нарошчванне імпульсу
actors.buffs.momentum.momentum_desc=Па меры руху Фрыраннер назапашвае імпульс, які ён можа выдаткаваць, каб пачаць фрыраннер.\n\nКожны зарад імпульсу дае два хады фрыранне, і Фрыраннер можа назапасіць да 10 зарадаў. Імпульс хутка губляецца, калі Фрыраннер перастае рухацца.\n\nБягучы зарад імпульсу: %d.
actors.buffs.momentum.resting=аднаўляецца
actors.buffs.momentum.resting_desc=Па меры руху Фрыраннер набірае імпульс, які ён можа выдаткаваць, каб пачаць фрыраннер.\n\nФрыраннеру патрэбен час, каб аднавіць сваю цягавітасць, перш чым зноў набіраць імпульс.\n\nЗасталося хадоў: %d.
actors.buffs.momentum.running=фрыранінг
actors.buffs.momentum.running_desc=Па меры руху Фрыраннер набірае імпульс, які ён можа выдаткаваць, каб пачаць фрыраннер.\n\nПадчас фрыраннерства Фрыраннер рухаецца з падвоенай хуткасцю і атрымлівае бонус да ўхілення ў залежнасці ад свайго ўзроўню.\n\nХадзін хадоў застаўся: %d.
actors.buffs.monkenergy$monkability$dash.desc=Імгненны рывок на адлегласць да 4 клетак. Гэтая здольнасць можа пераадольваць перашкоды, але не ворагаў або цвёрдую мясцовасць.
actors.buffs.monkenergy$monkability$dash.empower_desc=Імгненны рывок да _8 клетак_. Гэтая здольнасць можа пераадольваць перашкоды, але не ворагаў або цвёрдую мясцовасць.
actors.buffs.monkenergy$monkability$dash.name=працяжнік
actors.buffs.monkenergy$monkability$dash.prompt=Выберыце месцазнаходжанне
actors.buffs.monkenergy$monkability$dragonkick.desc=Разбуральны ўдар, які наносіць па тыпу %1$d-%2$d пашкоджанні і ігнаруючы браню. Удар адкідае цэль і паралізуе яе на кожнай клетцы, па якой яна праходзіць.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Разбуральны ўдар нагой, які наносіць _%1$d-%2$d пашкоджанняў_ і ігнаруючы браню. Удар нагой адкідае _ўсе суседнія цэлі_ і паралізуе іх на кожнай клетцы, па якой яны перамяшчаюцца.
actors.buffs.monkenergy$monkability$dragonkick.name=ўдар дракона
actors.buffs.monkenergy$monkability$flurry.desc=Два імгненныя ўдары, якія наносяць %1$d-%2$d шкоду і ігнаруюць браню. Гэтую здольнасць нельга выкарыстоўваць паўторна.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Два імгненныя ўдары, якія наносяць пашкоджанні %1$d-%2$d, ігнаруюць браню _і выкарыстоўваюць зачараванне вашай зброі._ Гэтую здольнасць нельга выкарыстоўваць паўторна.
actors.buffs.monkenergy$monkability$flurry.name=шквал удараў
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Манах засяроджана на наваколлі, прадчуваючы наступную атаку, накіраваную супраць яе. Пакуль яна засяроджаная, яна гарантавана адбівае наступную атаку.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=сканцэнтраваны
actors.buffs.monkenergy$monkability$focus.desc=Манах паварочваецца, каб засяродзіцца, дазваляючы ёй адбіць наступную атаку, накіраваную супраць яе.
actors.buffs.monkenergy$monkability$focus.empower_desc=Манах _імгненна_ факусуецца, дазваляючы ёй адбіць наступную атаку, накіраваную супраць яе.
actors.buffs.monkenergy$monkability$focus.name=фокус
actors.buffs.monkenergy$monkability$meditate.desc=Манах факусуе энергію ў сваім целе на 5 хадоў. Гэта здымае большасць негатыўных эфектаў і дае ёй 8 хадоў перазарадкі палачкі і артэфакта.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Манах факусуе энергію ў сваім целе на 5 хадоў. Гэта здымае большасць негатыўных эфектаў і дае ёй 8 хадоў перазарадкі палачкі і артэфакта. _Яна таксама атрымлівае 80% устойлівасці да ўрону падчас медытацыі і павольна аднаўляе 20% адсутнага здароўя._
actors.buffs.monkenergy$monkability$meditate.name=медытаваць
actors.buffs.monkenergy.action=Здольнасці манаха
actors.buffs.monkenergy.desc=Перамагаючы ворагаў, манах атрымлівае энергію, якую можа выкарыстоўваць для розных здольнасцей. Большасць ворагаў даюць 1 адзінку энергіі пасля паразы, і манах не губляе энергію з цягам часу. \n\nБягучая энергія: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Манах нядаўна выкарыстаў адну здольнасць і павінен пачакаць, перш чым выкарыстоўваць іншую.\n\nБягучы час аднаўлення: %d хады.
actors.buffs.monkenergy.name=энергія
actors.buffs.ooze.desc=Гэтая ліпкая кіслата прыліпае да плоці, павольна растапляючы яе.\n\nСлізь будзе наносіць пастаянную шкоду з цягам часу, але яе можна адразу змыць вадой.\n\nКолькасць застаўшыхся вільготных вільгот: %s.
actors.buffs.ooze.heromsg=Едкая слізь раз'ядае тваю плоць. Змый яе!
actors.buffs.ooze.name=едкі слізь
actors.buffs.ooze.ondeath=Ты растаеш...
actors.buffs.ooze.rankings_desc=Раствораны
actors.buffs.paralysis.desc=Часта найгоршае, што можна зрабіць, гэта нічога не рабіць.\n\nПараліч цалкам спыняе ўсе дзеянні, прымушаючы цэль чакаць, пакуль эфект не скончыцца. Боль ад атрымання шкоды можа прымусіць персанажаў супраціўляцца паралічу, выводзячы іх з-пад уздзеяння эфекту.\n\nЧасткі паралічу, што застаўся: %s.
actors.buffs.paralysis.heromsg=Ты паралізаваны!
actors.buffs.paralysis.name=паралізаваны
actors.buffs.paralysis.out=супраціўляўся паралічу
actors.buffs.physicalempower.desc=Вашы ўдары былі ўзмоцнены, што павялічвае колькасць шкоды, якую вы можаце нанесці, калі б'еце па ворагах фізічнымі атакамі.\n\nДадатковая шкода: %1$d.\nЗасталося ўдараў: %2$d.
actors.buffs.physicalempower.name=фізічна ўмацаваны
actors.buffs.pincushion.desc=Кідальная зброя, якую вы выкарысталі супраць гэтага персанажа, зараз прыліпла да яго і ўпадзе на падлогу пасля паразы. \n\nНа дадзены момант прымацаваны наступныя прадметы:
actors.buffs.pincushion.name=падушка для іголак
actors.buffs.poison.desc=Атрута пранікае ў цела, павольна парушаючы яго ўнутранае функцыянаванне.\n\nАтрута наносіць шкоду кожны ход, прапарцыйную часу да заканчэння тэрміну яе дзеяння.\n\nХадоў атруты, што засталіся: %s.
actors.buffs.poison.heromsg=Ты атручаны!
actors.buffs.poison.name=атручаны
actors.buffs.poison.ondeath=Ты памёр ад атруты...
actors.buffs.poison.rankings_desc=Паддаўся атруце
actors.buffs.preparation.action_name=падрыхтаваны страйк
actors.buffs.preparation.assassinated=забіты
actors.buffs.preparation.desc=Забойца цярпліва чакае, рыхтуючыся ўдарыць з ценю.
actors.buffs.preparation.desc_blink=Ён можа міргнуць у бок ворага, перш чым ударыць яго, з максімальнай дыстанцыяй _%d._
actors.buffs.preparation.desc_dmg=Яго наступная атака нанясе _%1$d%% бонусную шкоду_ і пакарае смерцю звычайных ворагаў са здароўем ніжэй за _%2$d%%_ або босаў са здароўем ніжэй за _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=Атака таксама, хутчэй за ўсё, нанясе большую шкоду.
actors.buffs.preparation.desc_invis_next=Павароты для мацнейшай атакі: _%d._
actors.buffs.preparation.desc_invis_time=Хады, праведзеныя ў нябачнасці: _%d._
actors.buffs.preparation.name=падрыхтоўка
actors.buffs.preparation.no_target=Там няма чаго атакаваць.
actors.buffs.preparation.out_of_reach=Гэтая мэта недасягальная.
actors.buffs.preparation.prompt=Выберыце цэль для атакі!\nМаксімальная адлегласць міргання: %d
actors.buffs.prismaticguard.desc=Вас ахоўвае прызматычная выява, якая зараз неактыўная. Калі з'явяцца ворагі, прызматычная выява ўступіць у дзеянне і абароніць вас!\n\nПакуль прызматычная выява неактыўная, яна будзе паступова аднаўляцца пасля любой атрыманай шкоды.\n\nБягучы запас здароўя: %d/%d.
actors.buffs.prismaticguard.desc_many=Гэта прызматычная выява таксама атрымлівае выгаду ад эфекту «Сіла многіх». Засталося хадоў: %d.
actors.buffs.prismaticguard.name=прызматычная гвардыя
actors.buffs.recharging.desc=Энергія працякае праз вас, павялічваючы хуткасць зарадкі вашых палачак і посіхаў.\n\nКожны ход гэтага ўзмацнення павялічвае бягучы зарад на чвэрць, акрамя звычайнай падзарадкі.\n\nХадоў падзарадкі, якія засталіся: %s.
actors.buffs.recharging.name=падзарадка
actors.buffs.revealedarea.desc=Герою часова адкрыта частка падзямелля. Ён будзе бачыць яе, дзе б ён ні знаходзіўся. \n\nХодаў засталося: %s.
actors.buffs.revealedarea.name=выяўленая зона
actors.buffs.revealedchar.desc=Гэты персанаж адкрываецца герою, ён будзе бачны, дзе б ён ні знаходзіўся.\n\nХадоў засталося: %s.
actors.buffs.revealedchar.name=раскрыта
actors.buffs.roots.desc=Карані (магічныя ці натуральныя) хапаюцца за ногі, прымушаючы іх апускацца на зямлю.\n\nКарані фіксуюць цэль на месцы, робячы рух і большасць здольнасцей руху немагчымымі. Іншыя дзеянні, у тым ліку эфекты тэлепартацыі, застаюцца ў сіле.\n\nАбароты кораня, што засталіся: %s.
actors.buffs.roots.heromsg=Ты не можаш рухацца!
actors.buffs.roots.name=укаранёны
actors.buffs.scrollempower.desc=Энергія з нядаўна прачытанага скрутка Мага напаўняе яго палачкі!\n\nПавышэнне ўзроўню: +%1$d.\nЗасталося запаў: %2$d.
actors.buffs.scrollempower.name=пракрутка
actors.buffs.shadows.desc=Вы зліваецеся з ценем вакол вас, што дае вам нябачнасць і запавольвае ваш метабалізм.\n\nПакуль вы нябачныя, ворагі не могуць атакаваць вас або сачыць за вамі. Большасць фізічных атак і магічных эфектаў (напрыклад, скруткі і палачкі) неадкладна адмяняюць нябачнасць. Акрамя таго, падчас зліцця з ценем ваш голад запавольваецца.\n\nВы застанецеся ў ценю, пакуль не пакінеце цень або пакуль вораг не дакранецца да вас.
actors.buffs.shadows.name=зліты з ценем
actors.buffs.slow.desc=Магія запаволення ўплывае на хуткасць цэлі, для яе ўсё рухаецца звышхутка.\n\nA Запаволены персанаж выконвае ўсе дзеянні ўдвая хутчэй, чым звычайна.\n\nХадоў запаволення, што засталося: %s.
actors.buffs.slow.name=запаволіўся
actors.buffs.snipersmark.action_name_snapshot=здымак
actors.buffs.snipersmark.action_name_sniper=снайперскі стрэл
actors.buffs.snipersmark.action_name_volley=залп
actors.buffs.snipersmark.desc=Снайпер засяроджваецца на цэлі, якую яна нядаўна атакавала. Яна можа выконваць спецыяльную атаку з дапамогай свайго лука, якая залежыць ад таго, як лук узмоцнены.\n\nНеўзмоцнены лук выстраляе _маментальны стрэл_, які наносіць паменшаную шкоду, але стральба не займае шмат часу.\n\nA Лук, узмоцнены на хуткасць, выстраляе _залп_ з трох стрэл. Кожная страла наносіць паменшаную шкоду, але ўсё яшчэ можа актываваць зачараванне. Гэты залп страляе за 1 ход.\n\nA Лук, узмоцнены на шкоду, выстраляе _снайперскі стрэл_. Гэты стрэл гарантавана трапіць у цэль, наносіць бонусную шкоду ў залежнасці ад адлегласці ад цэлі і страляе за 2 хады.\n\nЗасталося хадоў: %s.
actors.buffs.snipersmark.name=знак снайпера
actors.buffs.soulmark.desc=Чарадзей дакрануўся да душы гэтай істоты, што дазволіла яму аднаўляцца, калі яна атрымлівае фізічную шкоду.\n\nАсталося хадоў знака душы: %s.
actors.buffs.soulmark.name=пазначаная душа
actors.buffs.stamina.desc=У вас бясконцая цягавітасць, што дазваляе вам рухацца хутчэй!\n\nПад уздзеяннем цягавітасці вы будзеце бегчы з хуткасцю +50%%, але ўсе астатнія дзеянні будзеце выконваць з нармальнай хуткасцю.\n\nХадоў цягавітасці, што засталося: %s.
actors.buffs.stamina.name=цягавітасць
actors.buffs.terror.desc=Тэрор — гэта маніпулятыўная магія, якая ўводзіць цэль у некантралюемую паніку. \n\nЖахлівыя персанажы вымушаныя ўцякаць ад суперніка, імкнучыся паставіць паміж імі як мага больш дзвярэй і сцен. Аднак шок ад болю скароціць працягласць жаху. \n\nЗасталося хадоў жаху: %s.
actors.buffs.terror.name=жахнуты
actors.buffs.toxicimbue.desc=Вы прасякнуты атрутнай энергіяй!\n\nПа меры перамяшчэння з вас будзе пастаянна вырывацца таксічны газ, які наносіць шкоду вашым ворагам. Вы неўспрымальныя да таксічнага газу і атруты на працягу ўсяго эфекту, а таксама на працягу некалькіх хадоў пасля яго.\n\nХадоў таксічнага напаўнення, што засталося: %s.
actors.buffs.toxicimbue.name=прасякнуты таксічнасцю
actors.buffs.vertigo.desc=Хадзіць па прамой лініі можа быць складана, калі ўвесь свет круціцца.\n\nПад уздзеяннем галавакружэння персанажы, якія спрабуюць рухацца, будуць рухацца ў выпадковым кірунку, а не ў тым, у якім яны хацелі ісці.\n\nАбароты галавакружэння, якія засталіся: %s.
actors.buffs.vertigo.name=галавакружэнне
actors.buffs.vulnerable.desc=Магія ўразлівасці павялічвае ўсю фізічную шкоду, якую атрымлівае персанаж, на 33%%, пасля таго як гэтая шкода памяншаецца бранёй.\n\nХадоў уразлівасці, якія засталіся: %s.
actors.buffs.vulnerable.heromsg=Ты адчуваеш сябе слабым!
actors.buffs.vulnerable.name=уразлівы
actors.buffs.wandempower.desc=Вашы палачкі, якія наносяць шкоду, былі ўзмоцнены, што павялічвае колькасць нанесенай імі шкоды на некалькі ўдараў.\n\nДадатковая шкода: %1$d.\nЗасталося ўдараў: %2$d.
actors.buffs.wandempower.name=палачкі, надзеленыя сілай
actors.buffs.weakness.desc=Усё раптам здаецца значна цяжэйшым.\n\nАслабленне магіі зніжае фізічную сілу персанажа, прымушаючы яго наносіць на 33%% меншую шкоду.\n\nЗасталіся віражанні слабасці: %s.
actors.buffs.weakness.heromsg=Ты адчуваеш сябе аслабленым!
actors.buffs.weakness.name=аслаблены
actors.buffs.wellfed.desc=Вы адчуваеце сябе цалкам сытым і задаволеным.\n\nКалі вы добра накормлены, ваш голад не будзе павялічвацца, і з цягам часу вы будзеце аднаўляць дадатковую колькасць здароўя.\n\nХадоў засталося: %d.
actors.buffs.wellfed.name=добра накормлены
actors.char.def_verb=ухіліўся
actors.char.def_verb_blocked=заблакаваны
actors.char.defeat=Вы перамаглі %s.
actors.char.immune=імунны
actors.char.invulnerable=непаражальны
actors.char.kill=%s забіў цябе...
actors.hero.abilities.armorability.cost=Кошт аплаты: _%d_
actors.hero.abilities.armorability.no_target=Там няма чаго цэліцца!
actors.hero.abilities.armorability.prompt=Выберыце месцазнаходжанне для таргетынгу
actors.hero.abilities.armorability.self_target=Нельга нацэльвацца на сябе!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Цела Клірыка выпраменьвае прамяністую энергію. У гэтай форме Клірык атрымлівае 2 адзінкі далёкасці атакі (ад святой энергіі, якая з яго выпраменьваецца) і 10 адзінак абароны кожны раз, калі траціць зарад святога тома. Ён таксама можа выкарыстоўваць загаворы, якія адкрываюцца з дапамогай талентаў узнятай формы.\n\nШчыт, дадзены ўзнятай формай і яе загаворамі, не будзе знікаць звычайна, а імгненна знікне, калі ўзнятая форма заканчваецца.\n\nБягучая абарона: %1$d.\nХодаў засталося: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=узнёслая форма
actors.hero.abilities.cleric.ascendedform.desc=Клірык выпраменьвае з сябе святую энергію, прымаючы пашыраную прамяністую форму на працягу 10 хадоў. У гэтай форме Клірык можа чытаць новыя загаворы, атрымлівае 2 адзінкі далёкасці атакі, 30 адзінак абароны, а любыя дадатковыя загаворы, якія ён чытае, будуць даваць 10 адзінак абароны за кожны выкарыстаны зарад святога тома.\n\nАбарона ад узнесенай формы і яе загавораў звычайна не змяншаецца, а адразу ж знікае пасля заканчэння ўзнесенай формы. Здольнасць можна выкарыстоўваць паўторна для абнаўлення працягласці ўзнесенай формы.
actors.hero.abilities.cleric.ascendedform.name=узнёслая форма
actors.hero.abilities.cleric.ascendedform.short_desc=Клярык прымае _Узнёслы выгляд_, атрымліваючы новыя загаворы, далёкасць атакі і шчыты.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Копія аднаго з прыгодніцкіх спадарожнікаў Клірыка, зробленая з суцэльнага святла. Хоць яна мае форму іншага героя, яна не мае ніякіх яго ўнікальных здольнасцей. Гэты саюзнік будзе існаваць, пакуль на яго ўжываецца «Сіла многіх». \n\nГэтага саюзніка можна накіраваць бясплатна, паўторна выкарыстоўваючы здольнасць даспехаў «Сіла многіх».
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Ваш саюзнік рухаецца ў атаку!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Ваш саюзнік перамяшчаецца на гэтую пазіцыю.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Ваш саюзнік рухаецца, каб ісці за вамі.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Вы можаце знайсці гэтага персанажа з пэўнай здольнасцю даспехаў героя.
actors.hero.abilities.cleric.powerofmany$lightally.name=лёгкі саюзнік
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Гэты саюзнік атрымаў узмацненне «Моц многіх», што дае яму +25%% нанесенай шкоды і -25%% атрыманай шкоды. Ён таксама будзе дзяліцца сваім зрокам з клірыкам і зможа карыстацца сілай многіх загавораў.\n\n«Моц многіх» будзе захоўвацца, нават калі саюзнікі, такія як прызматычныя выявы, хаваюцца, але яе працягласць усё роўна будзе адлічвацца.\n\nХодаў, што засталося: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=сіла многіх
actors.hero.abilities.cleric.powerofmany.ally_exists=У вас ужо ёсць упэўнены саюзнік.
actors.hero.abilities.cleric.powerofmany.desc=Клярык перадае _Сілу Мноства_, якая альбо ўзмацняе існуючага саюзніка, альбо стварае новага ўзмоцненага на 100 хадоў. Выбар пустой прасторы стварае новага саюзніка.\n\nПад узмоцненым саюзнікам «Сілай Мноства», ён наносіць +25% шкоды, атрымлівае -25% шкоды і дзеліцца сваім зрокам з клірыкам. Ён таксама атрымлівае 25 адзінак абароны пры выкарыстанні гэтай здольнасці.\n\nКлярык таксама атрымлівае тры новыя загаворы, якія можна выкарыстоўваць толькі з узмоцненым саюзнікам. «Сіла Мноства» не скончыцца, пакуль адзін з гэтых загавораў актыўны.
actors.hero.abilities.cleric.powerofmany.name=сіла многіх
actors.hero.abilities.cleric.powerofmany.no_vision=Нельга выбіраць месца, якое не бачыце.
actors.hero.abilities.cleric.powerofmany.only_allies=Вы можаце толькі ўмацаваць саюзнікаў.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Накіруйце свайго светлага саюзніка
actors.hero.abilities.cleric.powerofmany.prompt_default=Выберыце саюзніка або месцазнаходжанне
actors.hero.abilities.cleric.powerofmany.short_desc=Клярык перадае _Сілу Многіх_, умацоўваючы існуючага саюзніка або ствараючы новага.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Прызначыць форму цела
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Прызначыць форму розуму
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Прызначыць форму духу
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Выберыце эфект, які будзе накладзены на Trinity. Дадатковая інфармацыя будзе паказана перад пацверджаннем.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Форма цела: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Форма розуму: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Форма духу: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Выберыце, якую форму Тройцы выкарыстоўваць. Эфекты розных формаў могуць быць актыўнымі адначасова.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Трыніці прымяняе эфект дыстанцыйнай алхімічнай сілы гэтага артэфакта коштам зарада _%2$s._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Трыніці будзе ўжываць пасіўны эфект аднаўлення здароўя гэтага артэфакта пры _+%1$d_ на працягу 20 хадоў, коштам зарада _%2$s._
actors.hero.abilities.cleric.trinity.cost=Кошт зарадкі гэтай здольнасці вар'іруецца, але часцей за ўсё складае _%d._
actors.hero.abilities.cleric.trinity.desc=Клірык атрымлівае _Тройцу_ здольнасцей даспехаў, якія можна прызначыць розным эфектам прадметаў з дапамогай трох новых загавораў. Кожны з гэтых загавораў сканцэнтраваны на эмуляцыі эфектаў розных відаў рыштунку, якія Клірык вызначыў падчас гэтага праходу: форма цела (зброя і даспехі), форма розуму (палачкі і кідальная зброя) і форма духу (кольцы і артэфакты).\n\nКожная форма Тройцы можа быць нададзена адным эфектам за раз, і Клірык выбірае, які з іх актываваць пры выкарыстанні Тройцы. Тройца не будзе дубляваць эфект таго, што ў вас ужо ёсць.
actors.hero.abilities.cleric.trinity.driedrose_use=Трыніці выкарыстае эфект гэтага артэфакта, каб выклікаць сапсаванага дружалюбнага прывіда з HP прывіда _+%1$d_, коштам зарада _%2$s._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Трыніці прымяняе гэты эфект на працягу хадоў _%1$d_ коштам _%2$s зарада._
actors.hero.abilities.cleric.trinity.etherealchains_use=Трыніці прымяняе эфект ланцужнога выклікання гэтага артэфакта з дасяжнасцю на _+%1$d_, коштам зарадкі _%2$s._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Трыніці прымяняе эфект перакусу гэтага артэфакта коштам _%2$s зарада._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Трыніці прымяняе эфект рабавання праціўніка гэтым артэфактам у _+%1$d_, зарабляючы _%2$s зарад._
actors.hero.abilities.cleric.trinity.name=тройца
actors.hero.abilities.cleric.trinity.no_duplicate=Трыніці не можа дубляваць эфект, які ў вас ужо ёсць!
actors.hero.abilities.cleric.trinity.no_imbue=Тройца пакуль не мае эфектаў ні для адной са сваіх формаў, выкарыстайце адно з яе загавораў!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Трыніці прымяняе гэты _магутны_ эфект для хадоў _%1$d_ коштам зарада _%2$s._
actors.hero.abilities.cleric.trinity.ring_use=Трыніці будзе ўжываць эфект гэтага пярсцёнка ў _+%1$d_ на працягу 20 хадоў, коштам зарада _%2$s_.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Трыніці прымяняе эфект кораня гэтага артэфакта з дапамогай выпадковага шкоднага насення, коштам зарада _%2$s._
actors.hero.abilities.cleric.trinity.short_desc=Клярык атрымлівае _Тройцу_ здольнасцей, якія імітуюць абсталяванне, якое ён бачыў, і могуць быць прызначаны з дапамогай новых загавораў.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Трыніці прымяняе эфект устаўкі гэтага артэфакта коштам _%2$s зарада._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Трыніці ўжыве эфект чараўніцтва гэтага артэфакта ў _+%1$d_, затраціўшы на гэта _%2$s зарад._
actors.hero.abilities.cleric.trinity.thrown_use=Трыніці кіне гэтую зброю ў _+%1$d_ коштам _%2$s зарада._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Трыніці прымяняе эфект замарожвання часу гэтага артэфакта з працягласцю ходу _%1$d_, коштам зарада _%2$s._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Трыніці прымяняе эфект выпадковага пракручвання гэтага артэфакта з шанцам _%1$d/10_, каб прапанаваць экзатычную версію без дадатковай аплаты, коштам _%2$s._
actors.hero.abilities.cleric.trinity.wand_multi_use=Трыніці заб'е гэтую _шматзарадную_ палачку пры _+%1$d_ коштам _%2$s_.
actors.hero.abilities.cleric.trinity.wand_use=Трыніці параніць гэтую палачку ў _+%1$d_, зарадзіўшы _%2$s._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Гэты персанаж удзельнічае ў дуэлі. Ён і любы з яго саюзнікаў або паслугачоў могуць дзейнічаць як звычайна, пакуль іншыя замарожаныя.\n\nДуэль будзе доўжыцца пэўны час, пакуль адзін з удзельнікаў не памрэ або пакуль удзельнікі не адыдуць адзін ад аднаго больш чым на 5 клетак.\n\nХады засталіся: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=удзельнік дуэлі
actors.hero.abilities.duelist.challenge.ally_target=Вы можаце кінуць выклік толькі ворагам.
actors.hero.abilities.duelist.challenge.already_dueling=Вы можаце ўдзельнічаць толькі ў адной дуэлі адначасова.
actors.hero.abilities.duelist.challenge.desc=Дуэлянт выклікае ворага, які знаходзіцца паблізу, на дуэль. Гэты вораг вымушаны змагацца з ім, у той час як усе астатнія ворагі часова замарожаныя ў часе.\n\nЦэль павінна быць дасягальнай і знаходзіцца ў межах 5 клетак ад дуэлянта. Дуэль працягваецца, пакуль не пройдзе 10 хадоў, вораг не памрэ, або дуэлянт не апынецца на адлегласці больш за 5 клетак ад ворага.\n\nЗамарожаныя ворагі непаражальныя. Саюзнікі дуэлянта не замарожваюцца гэтай здольнасцю, але калі цэллю з'яўляецца бос, яго паслугачы таксама не будуць замарожаныя.
actors.hero.abilities.duelist.challenge.distant_target=Гэты вораг занадта далёка, каб кінуць яму выклік.
actors.hero.abilities.duelist.challenge.name=выклік
actors.hero.abilities.duelist.challenge.prompt=Выберыце ворага, якому трэба кінуць выклік
actors.hero.abilities.duelist.challenge.short_desc=Дуэлянт _Выклікае_ ворага паблізу на дуэль, часова замарожваючы ўсіх астатніх ворагаў.
actors.hero.abilities.duelist.challenge.unreachable_target=Вы павінны быць у стане дасягнуць сваёй мэты.
actors.hero.abilities.duelist.elementalstrike.desc=Дуэлянт атакуе ворага або месцазнаходжанне, выконваючы звычайную атаку, якая гарантавана трапіць у ворага і распаўсюджвае магічны эфект, які распаўсюджваецца да 4 клетак у конусе ў 65 градусаў. Гэты магічны эфект залежыць ад зачаравання асноўнай зброі дуэлянта.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Элементальны ўдар без зачаравання выпусціць невялікі выбух магіі, які нанясе 6-12 адзінак шкоды ўсім ворагам у зоне дзеяння.
actors.hero.abilities.duelist.elementalstrike.name=стыхійны ўдар
actors.hero.abilities.duelist.elementalstrike.short_desc=Дуэлянтка выконвае _Элементальны ўдар_, распаўсюджваючы эфект у канічнай вобласці дзеяння ў залежнасці ад зачаравання яе зброі.
actors.hero.abilities.duelist.feint.bad_location=Вы не можаце пераехаць у гэтае месца.
actors.hero.abilities.duelist.feint.desc=Дуэлянт імітуе атаку, імчачыся да суседняй клеткі, пакідаючы пасля сябе імгненны рэшткавы вобраз. Ворагі, якія атакавалі дуэлянта, будуць атакаваць яго рэшткавы вобраз. \n\nВорагі, якія атакуюць рэшткавы вобраз, разгубляюцца, што адмяняе іх наступнае дзеянне і робіць іх адкрытымі для нечаканай атакі.
actors.hero.abilities.duelist.feint.name=абман
actors.hero.abilities.duelist.feint.prompt=Выберыце месца, куды імчацца
actors.hero.abilities.duelist.feint.short_desc=Дуэлянтка робіць фінты, імітуючы атаку, імчачыся да суседняй клеткі. Ворагі атакуюць яе рэшткавы вобраз, адкрываючы для сябе магчымасць контратакі.
actors.hero.abilities.duelist.feint.too_far=Гэта месца не знаходзіцца побач з вамі.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Паляўніца ненадоўга атрымлівае сілу, павялічваючы хуткасць перамяшчэння і атакі лукам.\n\nХадзі засталіся: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=сіла прыроды
actors.hero.abilities.huntress.naturespower.desc=Паляўнічая часова ўзмацняе сябе і свой лук сілай прыроды! Гэта доўжыцца 8 хадоў.\n\nНа працягу гэтага часу Паляўнічая рухаецца з хуткасцю ў 2 разы большай і атакуе лукам на 33% хутчэй. Бонусныя эфекты лука не спрацоўваюць, калі снайпер выкарыстоўвае свае спецыяльныя атакі.
actors.hero.abilities.huntress.naturespower.name=сіла прыроды
actors.hero.abilities.huntress.naturespower.short_desc=Паляўніца заклікае _Сілу Прыроды_, на кароткі час павялічваючы хуткасць свайго перамяшчэння і хуткастрэльнасць лука.
actors.hero.abilities.huntress.spectralblades.desc=Паляўніца кідае ў ворага спектральны клінок, які дзейнічае як дыстанцыйны ўдар з яе блізкай зброі. Усе звычайныя эфекты блізкай зброі актывуюцца, у тым ліку чары.
actors.hero.abilities.huntress.spectralblades.name=спектральныя ляза
actors.hero.abilities.huntress.spectralblades.short_desc=Паляўніца кідае ў цэль _Прыкметальныя лязы_, наносячы шкоду ў залежнасці ад яе бягучай зброі блізкага бою.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Чароўны ястраб, выкліканы Паляўнічай. Ён свеціцца яркім эфемерным сінім колерам, яго галава пастаянна круціцца, калі ён аглядае наваколле.\n\nХоць гэта і не вельмі моцны баец, яго хуткасць і зрок робяць яго выдатным для разведкі і адцягнення ворагаў.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Гарантаваныя засталіся ўхіленні: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Засталося хадоў: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Ваш ястраб рухаецца ў атаку!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Ваш ястраб перамяшчаецца ў гэтую пазіцыю.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Ваш ястраб рухаецца, каб ісці за вамі.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Вы можаце знайсці гэтага персанажа з пэўнай здольнасцю даспехаў героя.
actors.hero.abilities.huntress.spirithawk$hawkally.name=духоўны ястраб
actors.hero.abilities.huntress.spirithawk.desc=Паляўнічая заклікае духоўнага ястраба-знаёмага, якім можна кіраваць, выкарыстоўваючы здольнасць яшчэ раз падчас выкліку. Ястраб дзейнічае 100 хадоў, кіраванне ім не каштуе зарад. \n\nЯстраб мае мінімальны запас здароўя і атакуючую сілу, але ён хуткі, ухіляецца ад нападаў і дакладны. Ён увесь час дзеліць усё поле зроку з Паляўнічай. Ён неўспрымальны да ўсіх абмежаваных зонай эфектаў, такіх як агонь і атрутны газ. Ён не будзе атакаваць, калі на гэта не будзе спецыяльна накіравана.
actors.hero.abilities.huntress.spirithawk.name=духоўны ястраб
actors.hero.abilities.huntress.spirithawk.no_space=Няма вольнага месца побач з вамі.
actors.hero.abilities.huntress.spirithawk.short_desc=Паляўнічая заклікае _Духоўнага Ястраба_, які можа дапамагчы ёй разведваць месцазнаходжанне і адцягваць увагу ворагаў.
actors.hero.abilities.mage.elementalblast.desc=Маг выпраменьвае магічны выбух, які ахоплівае круглую вобласць на адлегласці да 4 клетак і наносіць да 15-25 адзінак шкоды. Канкрэтны эфект стыхійнага выбуху будзе адрознівацца ў залежнасці ад палачкі, устаўленай у посах мага.
actors.hero.abilities.mage.elementalblast.generic_desc=Эфект стыхійнага выбуху будзе падобны да эфекту палачкі пры ўдары па ворагу або саюзніку.
actors.hero.abilities.mage.elementalblast.name=стыхійны выбух
actors.hero.abilities.mage.elementalblast.no_staff=Вы не можаце выкарыстоўваць гэтую здольнасць без свайго персаналу.
actors.hero.abilities.mage.elementalblast.short_desc=Маг выпускае са свайго кія _Элементальны Выбух_, які ахоплівае вялікую плошчу вакол яго, і эфект залежыць ад палачкі ў яго кіі.
actors.hero.abilities.mage.warpbeacon.depths=Вы не можаце перамяшчацца паміж глыбінямі!
actors.hero.abilities.mage.warpbeacon.desc=Маг размяшчае маяк, які потым можна пераўтварыць у яго па жаданні. Размяшчэнне маяка займае 1 ход, але пераўтварэнне ў яго адбываецца імгненна.\n\nМаг па змаўчанні не можа перамяшчацца паміж паверхамі або выкарыстоўваць маяк, каб дабрацца да недаступных месцаў, такіх як замкнёныя пакоі. Маг можа тэлепартавацца ў ворагаў, што адштурхне іх убок.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Там маяк ставіць нельга!
actors.hero.abilities.mage.warpbeacon.locked_floor=Нельга пакідаць зачыненую падлогу!
actors.hero.abilities.mage.warpbeacon.name=варп-маяк
actors.hero.abilities.mage.warpbeacon.short_desc=Маг размяшчае ў сваім бягучым месцазнаходжанні _Маяк дэфармацыі_, у які ён можа імгненна тэлепартавацца назад.
actors.hero.abilities.mage.warpbeacon.too_far=Гэта месца занадта далёка!
actors.hero.abilities.mage.warpbeacon.window_cancel=адмяніць
actors.hero.abilities.mage.warpbeacon.window_clear=выразны маяк
actors.hero.abilities.mage.warpbeacon.window_desc=Ваш маяк зараз размешчаны на паверсе %d.
actors.hero.abilities.mage.warpbeacon.window_tele=тэлепартацыя да маяка
actors.hero.abilities.mage.wildmagic.desc=Маг вызваляе сілу сваіх палачак, выпадковым чынам страляючы імі да 4 разоў за адзін ход. Посах мага не ўлічваецца ў гэтым эфекте. \n\nКожная палачка таксама мае павышаны ўзровень на 2, максімум да +3. Гэтая здольнасць выкарыстоўвае палову зарада палачкі для кожнага ўдару, і ніводная палачка не можа быць выпушчана больш за 2 разы.
actors.hero.abilities.mage.wildmagic.name=дзікая магія
actors.hero.abilities.mage.wildmagic.no_wands=У цябе няма палачак, каб імі ўдарыць!
actors.hero.abilities.mage.wildmagic.short_desc=Маг вызваляе _Дзікую Магію_, якая змяшчаецца ў яго палачках, выпадковым чынам страляючы імі некалькі разоў у выбраную цэль на працягу аднаго ходу.
actors.hero.abilities.ratmogrify$transmograt.desc=Гэты вораг ператварыўся ў пацука. Вялікае паляпшэнне, калі хочаце ведаць маё меркаванне! - Кароль Пацукоў
actors.hero.abilities.ratmogrify$transmograt.name=пацучыная маразіта %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Забіты: пацукападобным ворагам
actors.hero.abilities.ratmogrify.cant_transform=Гэтага нельга іранізаваць!
actors.hero.abilities.ratmogrify.desc=Герой ператварае ворага ў пацука на 6 хадоў! Босы, саюзнікі і пацукі не могуць быць пацукападобнымі. \n\nПацукападобныя ворагі захоўваюць свае першапачатковыя характарыстыкі, але не маюць ніякіх здольнасцей.
actors.hero.abilities.ratmogrify.name=ратмагрыфікаваць
actors.hero.abilities.ratmogrify.short_desc=Герой _Пацучынай_ ператварае ворага! Гэта часова ператварае яго ў пацука без здольнасцей.
actors.hero.abilities.ratmogrify.too_strong=Гэты вораг занадта моцны, каб яго можна было пацукагрыфікаваць!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Гэты вораг быў пазначаны, што прывяло да атрымання дадатковай шкоды ў памеры 25%%, але таксама зрабіла яго немагчымым памерці, пакуль дзеянне пазнакі не скончыцца.\n\nЗасталося хадоў: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=пазначаны смерцю
actors.hero.abilities.rogue.deathmark.ally_target=Вы можаце пазначаць толькі ворагаў
actors.hero.abilities.rogue.deathmark.desc=Разбойнік ставіць метку на выбранага ворага, прымушаючы яго атрымліваць на 25% больш шкоды. Метка накладваецца імгненна і дзейнічае 5 хадоў.\n\nМечаныя ворагі атрымліваюць дадатковую шкоду, але не могуць памерці, пакуль тэрмін дзеяння меткі не скончыцца. Калі ў ворага 0 адзінак здароўя, калі метка скончыцца, ён адразу ж памрэ.
actors.hero.abilities.rogue.deathmark.name=смяротны знак
actors.hero.abilities.rogue.deathmark.short_desc=Разбойнік накладвае _Мэту смерці_ на абранага ворага. Пазначаныя ворагі атрымліваюць дадатковую шкоду, але не могуць памерці, пакуль дзеянне меткі не скончыцца.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Копія Разбойніка, створаная з цёмных ценяў. Яна стаіць нерухома, з пустымі вачыма і малюсенькімі пасмамі цемры, што ўздымаюцца з яе, як пара.\n\nКлон не з'яўляецца ідэальнай копіяй Разбойніка, але ўсё яшчэ нядрэнны баец, і пры наяўнасці патрэбных талентаў можа атрымаць выгаду ад рыштунку Разбойніка.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Ваш клон рухаецца ў атаку!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ваш клон перамяшчаецца на гэтую пазіцыю.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Ваш клон рухаецца, каб ісці за вамі.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Вы можаце знайсці гэтага персанажа з пэўнай здольнасцю даспехаў героя.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ценявы злодзей
actors.hero.abilities.rogue.shadowclone.desc=Разбойнік выклікае ценявога клона, якога можна накіраваць, каб ён дапамог яму ў баі. Кіраванне ценявога клона бясплатнае. \n\nКлон мае 80 адзінак здароўя, не мае броні і наносіць 10-20 адзінак шкоды. Усе гэтыя рысы можна палепшыць з дапамогай талентаў, так што клон атрымлівае перавагі ад зброі і броні героя.
actors.hero.abilities.rogue.shadowclone.name=ценявы клон
actors.hero.abilities.rogue.shadowclone.short_desc=Разбойнік выклікае _Ценявога клона_, якога можна накіраваць, каб ён дапамог яму ў баі.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Неяк ворагі лёгка пераконваюцца, што гэтая драўляная прынада — сапраўдны Злодзей!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Вы можаце знайсці гэтага персанажа з пэўнай здольнасцю даспехаў героя.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=драўляная прынада
actors.hero.abilities.rogue.smokebomb.desc=Разбойнік кідае дымавую бомбу і міргае на адлегласць да 6 клетак. Ён можа міргаць скрозь небяспекі і ворагаў, але не скрозь цвёрдую мясцовасць, такую як сцены.\n\nВорагі, якія знаходзяцца побач са старой пазіцыяй Разбойніка, будуць аслеплены на 5 хадоў.
actors.hero.abilities.rogue.smokebomb.fov=Вы можаце пераскочыць толькі на пустое месца ў вашым полі зроку.
actors.hero.abilities.rogue.smokebomb.name=дымавая бомба
actors.hero.abilities.rogue.smokebomb.prompt=Выберыце месца для пераходу
actors.hero.abilities.rogue.smokebomb.short_desc=Разбойнік кідае _дымавую бомбу_, міргаючы. Ён асляпляе ворагаў паблізу свайго старога месцазнаходжання.
actors.hero.abilities.warrior.endure$enduretracker.desc=Цяпер Воін наносіць бонусную шкоду ў залежнасці ад атрыманай шкоды.\n\nБонусная шкода: %1$d\nЗасталося ўдараў: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=цягавітасць
actors.hero.abilities.warrior.endure.desc=Воін трывае 3 хады, атрымліваючы палову шкоды ад усіх крыніц. Гэта зніжэнне ўжываецца да эфектаў супраціву пашкоджанням, такіх як браня.\n\nПасля трывання наступны ўдар воіна на працягу 10 хадоў атрымлівае бонусную шкоду. Гэтая бонусная шкода роўная палове ўсёй шкоды, нанесенай яму падчас трывання, да любых эфектаў зніжэння шкоды!\n\nКалі ў Воіна ёсць якая-небудзь камбінацыя, выкарыстанне гэтай здольнасці павялічвае яго пакінуты час на 3 хады.
actors.hero.abilities.warrior.endure.name=трываць
actors.hero.abilities.warrior.endure.short_desc=Воін _Цікавы_, прапускаючы некалькі хадоў, але атрымліваючы высокую ўстойлівасць да пашкоджанняў. Затым ён наносіць дадатковую шкоду ў залежнасці ад таго, што ён вытрымаў.
actors.hero.abilities.warrior.heroicleap.desc=Воін скача да вызначанага месца, пераскокваючы праз любых ворагаў або перашкоды на шляху. Аднак ён не можа пераскокваць сцены або іншую цвёрдую мясцовасць.
actors.hero.abilities.warrior.heroicleap.name=гераічны скачок
actors.hero.abilities.warrior.heroicleap.prompt=Выберыце кірунак для скачка
actors.hero.abilities.warrior.heroicleap.short_desc=Воін выконвае _Гераічны скачок_ да вызначанага месца, пралятаючы над ворагамі і небяспекамі.
actors.hero.abilities.warrior.shockwave.desc=Воін б'е па зямлі, ствараючы ўдарную хвалю, якая распаўсюджваецца на 5 клетак у конусе пад вуглом 60 градусаў.\n\nВорагі, якія трапляюць пад гэтую ўдарную хвалю, атрымліваюць паразы на 5 хадоў. Яны таксама атрымліваюць 5-10 адзінак шкоды, плюс дадаткова 1-2 адзінкі шкоды за кожны пункт сілы Воіна вышэй за 10.
actors.hero.abilities.warrior.shockwave.name=ударная хваля
actors.hero.abilities.warrior.shockwave.short_desc=Воін выпускае _Ударную хвалю_ у канічнай вобласці дзеяння, б'ючыся аб зямлю. Ворагі, якія трапілі пад ударную хвалю, атрымліваюць пашкоджанні і калекі.
actors.hero.hero.key_distracted=Замак не адчыніш цалкам, трэба будзе спрабаваць яшчэ раз.
actors.hero.hero.leave=Ты пакуль не можаш сысці, астатняя частка падзямелля чакае цябе ўнізе!
actors.hero.hero.level_cap=Ты не можаш стаць мацнейшым, але твой вопыт дае табе прыліў сіл!
actors.hero.hero.level_up=Павысь узровень!
actors.hero.hero.locked_chest=Гэты куфар зачынены, і ў вас няма адпаведнага ключа.
actors.hero.hero.locked_door=У вас няма адпаведнага ключа.
actors.hero.hero.name=ты
actors.hero.hero.new_level=Павысьце ўзровень! +Дакладнасць, +Ухіленне, +5 здароўя!
actors.hero.hero.new_talent=+1 бал таленту!
actors.hero.hero.noticed_smth=Ты нешта заўважыў.
actors.hero.hero.pain_resist=Боль дапамагае вам супраціўляцца жаданню заснуць.
actors.hero.hero.revive=Анкх выбухае жыццядайнай энергіяй!
actors.hero.hero.search=пошук
actors.hero.hero.search_distracted=Цяжка сканцэнтравацца, пошукі стамляюць.
actors.hero.hero.unspent=У вас ёсць нявыкарыстаныя ачкі талентаў!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Вы не можаце насіць з сабой: %s.
actors.hero.hero.you_now_have=Вы паднялі: %s.
actors.hero.heroclass.cleric=святар
actors.hero.heroclass.cleric_desc=Клірык пачынае з _унікальнай святой кнігай_, якую ён можа выкарыстоўваць для накладання розных загавораў.\n\nБольшасць талентаў клірыка сканцэнтраваны на вывучэнні або паляпшэнні загавораў.\n\nКлірык таксама пачынае з _дубінай_, тканымі даспехамі, бурдзюкам для вады і аксамітным мяшком.\n\nКлірык аўтаматычна ідэнтыфікуе:\n_-_ Скруткі ідэнтыфікацыі\n_-_ Зеллі чысціні\n_-_ Скруткі зняцця праклёну
actors.hero.heroclass.cleric_desc_short=Клірык — гэта боскі чарадзей, які выкарыстоўвае свой унікальны _святы том_ для перадачы боскай магіі. Ён можа _вывучаць і паляпшаць загаворы_ з дапамогай талентаў.
actors.hero.heroclass.cleric_unlock=Каб разблакіраваць Клірыка, _цалкам ачысціце праклён ад любога праклятага рыштунку._
actors.hero.heroclass.duelist=дуэлянт
actors.hero.heroclass.duelist_desc=Дуэлянт пачынае з _ўнікальнай рапірай_ са спецыяльнай здольнасцю, якая з цягам часу перазараджаецца.\n\nКожная зброя ў гульні мае _розную спецыяльную здольнасць_, якую можа выкарыстоўваць Дуэлянт.\n\nДуэлянт таксама пачынае з _двух кідальных шыпоў_, тканевых даспехаў, бурдзюка з вадой і аксамітнага мяшка.\n\nДуэлянт аўтаматычна ідэнтыфікуе:\n_-_ Скруткі ідэнтыфікацыі\n_-_ Зелля сілы\n_-_ Скруткі люстранога адлюстравання
actors.hero.heroclass.duelist_desc_short=Дуэлянт — майстар зброі, які можа выкарыстоўваць сваю зброю, каб актываваць _спецыяльную здольнасць зброі._ Гэтая спецыяльная здольнасць _розная для кожнай зброі._
actors.hero.heroclass.duelist_unlock=Каб разблакіраваць дуэлянта, _экіпіруйце зброю 2-га ўзроўню або вышэй без штрафу да сілы._
actors.hero.heroclass.huntress=паляўніца
actors.hero.heroclass.huntress_desc=Паляўнічая пачынае з _унікальнага духоўнага лука_, які можа страляць бясконцай колькасцю выкліканых стрэл.\n\nПаляўнічая можа падарожнічаць па высокай траве, _не затаптваючы яе_.\n\nПаляўнічая таксама пачынае з _пальчаткамі з шыпамі_, тканевымі даспехамі, бурдзюкам для вады і аксамітным мяшком.\n\nПаляўнічая аўтаматычна ідэнтыфікуе:\n_-_ Скруткі ідэнтыфікацыі\n_-_ Зелля розуму і бачання\n_-_ Скруткі калыханкі
actors.hero.heroclass.huntress_desc_short=Паляўніца — майстрыня кідальнай зброі і мае _магічны лук_ з бясконцай колькасцю стрэл. Яна таксама падарожнічае па высокай траве, _не топчучы яе._
actors.hero.heroclass.huntress_unlock=Каб разблакіраваць Паляўнічую, _ударыце ворагаў кідальнай зброяй 10 разоў за адну гульню._
actors.hero.heroclass.mage=маг
actors.hero.heroclass.mage_desc=Маг пачынае з _унікальнага посаха_, які зараджаецца значна хутчэй, чым палачка, і мае на 1 зарад больш. Посах _можна напоўніць любой палачкай_, якую Маг знойдзе ў падзямеллі.\n\nМаг таксама пачынае з _палачкай магічнага снарада_, набітай у яго посах, тканевыя даспехі, бурдзюк з вадой і аксамітны мяшочак.\n\nМаг аўтаматычна ідэнтыфікуе:\n_-_ Скруткі ідэнтыфікацыі\n_-_ Зеллі вадкага полымя\n_-_ Скруткі паляпшэння
actors.hero.heroclass.mage_desc_short=Маг — эксперт па таямнічай магіі, які носіць _магічны посах_, мацнейшы за чароўную палачку. Посах можна _напоўніць любой палачкай_, якую знойдзе Маг.
actors.hero.heroclass.mage_unlock=Каб разблакіраваць Мага, _выкарыстоўвайце скрутак паляпшэння, каб зрабіць прадмет мацнейшым._
actors.hero.heroclass.rogue=нягоднік
actors.hero.heroclass.rogue_desc=Разбойнік пачынае з _унікальнага Плашча Ценяў_, які ён можа выкарыстоўваць, каб стаць нябачным па жаданні.\n\nРазбойнік можа _выяўляць сакрэты і пасткі_ з вялікай адлегласці.\n\nРазбойнік таксама пачынае з _кінжала_, _трыма кідальнымі нажамі_, тканымі даспехамі, бурдзюкам для вады і аксамітным мяшком.\n\nРазбойнік аўтаматычна ідэнтыфікуе:\n_-_ Скруткі ідэнтыфікацыі\n_-_ Зеллі нябачнасці\n_-_ Скруткі магічнага картаграфавання
actors.hero.heroclass.rogue_desc_short=Разбойнік можа ўхіляцца ад ворагаў і наносіць удары з-за нябачнасці, выкарыстоўваючы свой _плашч ценяў_. Ён таксама _выяўляе сакрэты і пасткі_ з большай адлегласці.
actors.hero.heroclass.rogue_unlock=Каб разблакіраваць Разбойніка, _выканайце 10 нечаканых нападаў за адну гульню._
actors.hero.heroclass.warrior=воін
actors.hero.heroclass.warrior_desc=Воін пачынае з _ўнікальнай зламанай пячаткай_, якая дае яму выбух абароны, калі яго здароўе менш за палову. Пячатку можна перамяшчаць паміж даспехамі, і з яе дапамогай можна _перанесці адно паляпшэнне_.\n\nВоін таксама пачынае з _паношаным кароткім мячом_, _трыма кідальнымі камянямі_, тканевымі даспехамі, бурдзюкам для вады і аксамітным мяшком.\n\nВоін аўтаматычна ідэнтыфікуе:\n_-_ Скруткі ідэнтыфікацыі\n_-_ Зеллі лячэння\n_-_ Скруткі лютасці
actors.hero.heroclass.warrior_desc_short=Воін атрымлівае дадатковую шкоду дзякуючы абароне, якую дае яго _зламаная пячатка._ Пячатку можна перамяшчаць паміж даспехамі і _пераносіць адно паляпшэнне._
actors.hero.heroclass.warrior_unlock=Воін аўтаматычна разблакуецца.
actors.hero.herosubclass.assassin=забойца
actors.hero.herosubclass.assassin_desc=Забойца рыхтуецца да наступнага ўдару, калі становіцца нябачным. Чым даўжэй ён рыхтуецца, тым мацнейшай будзе яго наступная атака. Падрыхтоўка доўжыцца да 9 хадоў.\n\nПасля падрыхтоўкі забойца наносіць дадатковую шкоду пры наступнай атацы, можа міргнуць, каб паказаць цэль, і нават імгненна забівае дастаткова слабых ворагаў.
actors.hero.herosubclass.assassin_short_desc=_Забойца_ можа падрыхтаваць смяротны ўдар, пакуль ён нябачны. Чым даўжэй ён чакае, тым мацнейшай будзе атака.
actors.hero.herosubclass.battlemage=баявы маг
actors.hero.herosubclass.battlemage_desc=Баявы маг атрымлівае бонусны эфект кожны раз, калі ён наносіць удар у блізкім бою сваім посахам, быццам на яго посах накладзены дадатковыя чары. Гэтыя эфекты залежаць ад палачкі, якой надзеты яго посах, кожная палачка мае свой уласны эфект. Акрамя эфектаў палачкі, посах Баявога мага таксама атрымлівае 0,5 зарада, калі ён ім б'е.
actors.hero.herosubclass.battlemage_short_desc=_Баявы_ выклікае бонусныя эфекты пры баі ў блізкім бою сваім посахам. Гэтыя эфекты залежаць ад палачкі, якой надзелены яго посах.
actors.hero.herosubclass.berserker=берсеркер
actors.hero.herosubclass.berserker_desc=Берсеркер набірае лютасць, калі атрымлівае фізічную шкоду, у тым ліку шкоду, якую блакуе яго браня! Лютасць з часам паступова знікае, але павольней, калі ў яго мала здароўя.\n\nЛютасць можа прымусіць Берсеркера наносіць да +50% шкоды. Пры максімальнай лютасці ён можа ўвайсці ў стан вар'яцтва, атрымаўшы выбух шчыта і захоўваючы лютасць, пакуль у яго застаўся шчыт. Шчыт маштабуецца ў залежнасці ад узроўню браня Берсеркера і можа быць значна ўзмоцнены, калі ў яго мала здароўя. Берсеркеру патрэбен час, каб аднавіцца пасля таго, як ён увойдзе ў стан вар'яцтва.
actors.hero.herosubclass.berserker_short_desc=_Берсеркер_ назапашвае лютасць, калі атрымлівае шкоду. Лютасць павялічвае яго шкоду і можа быць актывавана на 100% для атрымання дадатковага шчыта.
actors.hero.herosubclass.champion=чэмпіён
actors.hero.herosubclass.champion_desc=Чэмпіёнка — майстар зброі блізкага бою, якая можа абсталяваць дадатковую зброю ў дадатак да асноўнай. Яе звычайныя атакі выкарыстоўваюць яе асноўную зброю, але яна можа імгненна змяніць сваю асноўную зброю і выкарыстоўваць здольнасці любой з іх.\n\nЯна таксама атрымлівае 2 дадатковыя максімальныя зарады здольнасцей зброі і +50% да хуткасці перазарадкі здольнасцей зброі.
actors.hero.herosubclass.champion_short_desc=_Чэмпіёнка_ можа валодаць двума відамі зброі і атрымлівае больш зарадаў. Яе звычайныя атакі выкарыстоўваюць яе асноўную зброю, але яна можа мяняць зброю і выкарыстоўваць здольнасці любой з іх.
actors.hero.herosubclass.freerunner=фрыраннер
actors.hero.herosubclass.freerunner_desc=Па меры руху Фрыраннер назапашвае імпульс. Ён можа атрымаць да 10 адзінак імпульсу пасля 10 хадоў бегу, але хутка губляе іх, калі спыняецца. Фрыраннер можа выкарыстаць свой імпульс, каб пачаць фрыраннер, па 2 хады за кожны пункт імпульсу.\n\nПры фрыранне Фрыраннер рухаецца з хуткасцю ў 2 разы вышэйшай і атрымлівае бонус да ўхілення прапарцыйна свайму ўзроўню. Пасля заканчэння фрыранне ёсць час аднаўлення, перш чым імпульс можна будзе зноў набраць.
actors.hero.herosubclass.freerunner_short_desc=_Фрыраннер_ набірае імпульс падчас бегу, які можна выкарыстаць для пачатку фрырану. Гэта дае яму бонус да хуткасці і магчымасці ўхілення на кароткі час.
actors.hero.herosubclass.gladiator=гладыятар
actors.hero.herosubclass.gladiator_desc=Гладыятар назапашвае адно ачко камбінацый кожны раз, калі ён здзяйсняе паспяховую атаку з дапамогай блізкай або кідальнай зброі. Калі Гладыятар не здзяйсняе паспяховую атаку на працягу 5 хадоў (15 хадоў пасля забойства), яго камбінацыйная атака скідаецца.\n\nA Калі ён назапашвае камбінацыйную атаку, Гладыятар можа выкарыстоўваць розныя здольнасці, якія гарантавана прыносяць трапнасць:\n2 Камбінацыйная атака: адкідае ворага назад, захоўвае камбінацыйную атаку\n4 Камбінацыйная атака: наносіць шкоду ў залежнасці ад даспехаў\n6 Камбінацыйная атака: адбівае ўдары, захоўвае камбінацыйную атаку\n8 Камбінацыйная атака: наносіць шкоду цэлі і бліжэйшым ворагам\n10 Камбінацыйная атака: атакуе адзін раз за кожную камбінацыйную атаку
actors.hero.herosubclass.gladiator_short_desc=_Гладыятар_ набірае камбінацыі, калі здзяйсняе паспяховыя атакі. Ён можа выкарыстоўваць камбінацыі, каб выкарыстоўваць унікальныя здольнасці.
actors.hero.herosubclass.monk=манах
actors.hero.herosubclass.monk_desc=Манах — майстар фізічнай тэхнікі. Перамагаючы ворагаў, яна атрымлівае энергію, якую можна выкарыстоўваць для розных абарончых і карысных здольнасцей. Гэтая энергія не знікае з часам, а мае абмежаванне ў залежнасці ад узроўню Манаха.\n\n1 Энергія: хутка ўдарыць кулакамі\n2 Энергія: сканцэнтравацца, каб ухіліцца ад наступнай атакі\n3 Энергія: імгненна кінуцца паблізу\n4 Энергія: адкінуць ворага нагой\n5 Энергія: медытаваць, каб ачысціць статусы і аднавіць зарад палачкі і артэфакта
actors.hero.herosubclass.monk_short_desc=_Манах_ назапашвае энергію падчас бою. Гэтую энергію можна выдаткаваць на розныя унікальныя здольнасці.
actors.hero.herosubclass.paladin=паладзін
actors.hero.herosubclass.paladin_desc=Паладзін атрымлівае мноства новых і палепшаных загавораў, якія падкрэсліваюць блізкі бой і сінергію са зброяй і даспехамі.\n\nЗагаворы паладзіна «_Святая зброя_» і «Святы ахоўны абарона» даюць большыя бонусы, больш не адмяняюць існуючыя чары і гліфы і могуць быць пашыраны шляхам выкарыстання іншых загавораў.\n\nПаладзін таксама атрымлівае загавор _Калечка_, які дазваляе яму гарантавана наносіць удар у блізкім бою з бонуснай шкодай і сілай зачаравання.
actors.hero.herosubclass.paladin_short_desc=_Паладзін_ атрымлівае новыя кароткадзейныя загаворы і ўзмоцненыя версіі святой зброі і аберага.
actors.hero.herosubclass.priest=святар
actors.hero.herosubclass.priest_desc=Святар атрымлівае мноства новых і палепшаных загавораў, якія падкрэсліваюць дыстанцыйны бой і сінергію з магічнымі прадметамі.\n\nСвятар можа бясплатна выкарыстоўваць _Пуцяводнае святло_ адзін раз кожныя 50 хадоў, асвятляць ворагаў, на якіх непасрэдна накіраваны любы з яго загавораў, і можа спажываць аслабленне асвятлення з саюзнікамі, палачкамі і некаторымі артэфактамі для дадатковай шкоды, роўнай іх узроўню + 5.\n\nСвятар таксама атрымлівае загавор _Ззянне_, які рассейвае цемру і ўплывае на ўсіх бачных ворагаў, актывуючы і накладваючы асвятленне і ненадоўга аглушаючы іх коштам 2 зарадаў.
actors.hero.herosubclass.priest_short_desc=_Жрэц_ атрымлівае новыя далёкабойныя загаворы і ўзмоцненую версію пуцяводнага святла.
actors.hero.herosubclass.sniper=снайпер
actors.hero.herosubclass.sniper_desc=Снайпер — майстар дыстанцыйнага бою, чые дыстанцыйныя атакі прабіваюць варожую браню. Калі яна атакуе ворага кідальнай зброяй, яна ставіць на яго снайперскую метку, што дазваляе ёй працягнуць спецыяльную атаку з лука. Гэтая спецыяльная атака залежыць ад таго, як узмоцнены яе лук.\n\nНеўзмоцнены лук выстраляе «маментальны стрэл», які наносіць паменшаную шкоду, але спрацоўвае імгненна. Хуткасны лук выстраляе залп з трох стрэл, якія наносяць паменшаную шкоду, усё яшчэ можа актываваць чары і страляе 1 ход. Пашкоджанні наносяць снайперскі стрэл, які гарантавана трапіць у цэль, наносіць бонусную шкоду ў залежнасці ад адлегласці і страляе 2 хады.
actors.hero.herosubclass.sniper_short_desc=_Снайперка_ можа прабіваць браню сваімі дыстанцыйнымі атакамі. Пасля ўдару кідальнай зброяй яна можа працягнуць атаку спецыяльнай зброяй з лука.
actors.hero.herosubclass.warden=наглядчык
actors.hero.herosubclass.warden_desc=Вартаўніца мае моцную сувязь з прыродай, што дае ёй мноства бонусных эфектаў, звязаных з травой і раслінамі. Яна здольная бачыць скрозь высокую і барознастую траву, як быццам гэта пустая прастора.\n\nВартаўніца прымушае траву прарастаць вакол любога насення, якое яна кідае або саджае, і атрымлівае спецыяльныя эфекты пры таптанні раслін. Гэтыя спецыяльныя эфекты замяняюць звычайныя эфекты раслін, гэта значыць, што ніводная расліна не будзе шкоднай для яе, калі яна на яе наступіць.
actors.hero.herosubclass.warden_short_desc=_Стражачка_ бачыць скрозь высокую траву і атрымлівае бонусныя эфекты, калі саджае насенне і топча расліны.
actors.hero.herosubclass.warlock=чарадзей
actors.hero.herosubclass.warlock_desc=У Чарадзея ёсць шанец накласці на персанажаў метку душы, калі ён выкарыстоўвае на іх палачкі. Шанс накласці метку душы і яе працягласць павялічваюцца з узроўнем палачкі.\n\nКалі вораг мае метку душы, Чарадзею будзе лячыцца 2 адзінкі здароўя за кожныя 5 адзінак нанесенай яму шкоды, але толькі пры атаках з блізкай або кідальнай зброі, а не з палачак!
actors.hero.herosubclass.warlock_short_desc=_Чараўнік_ мае шанец пазначаць душы ворагаў сваімі палачкамі. Ён будзе лячыцца кожны раз, калі наносіць фізічную шкоду пазначаным ворагам.
actors.hero.spells.auraofprotection$aurabuff.desc=Паладзін выпраменьвае вакол сябе ахоўную энергію.\n\nЛюбы саюзнік паблізу (у тым ліку сам Паладзін) атрымлівае паменшаную шкоду і на яго накладваецца эфект сімвала даспехаў Паладзіна з павялічанай сілай.\n\nХодаў засталося: %s.
actors.hero.spells.auraofprotection$aurabuff.name=аўра абароны
actors.hero.spells.auraofprotection.desc=Паладзін пачынае выпраменьваць ахоўную энергію ў зіхатлівай аўры вакол сябе на працягу 20 хадоў. Любы саюзнік у межах 2 клетак ад Паладзіна (уключаючы яго самога) атрымлівае %1$d%% меншую шкоду і атрымлівае эфект гліфа даспехаў Паладзіна з магутнасцю +%2$d%%.\n\nГэта зніжэнне шкоды адбываецца раней за іншыя эфекты, якія зніжаюць шкоду (напрыклад, даспехі). Павышэнне сілы гліфа будзе прымяняцца заўсёды, але гэты загавор не можа прымусіць гліф Паладзіна прымяняцца больш за адзін раз, калі персанаж ужо атрымлівае ад яго карысць (напрыклад, сам Паладзін або прызматычная выява).
actors.hero.spells.auraofprotection.name=аўра абароны
actors.hero.spells.auraofprotection.short_desc=Павялічвае абарону Паладзіна і бліжэйшых саюзнікаў.
actors.hero.spells.beamingray$beamingrayboost.desc=Гэты саюзнік нядаўна быў тэлепартаваны Прамянём, што дае яму бонусную шкоду супраць бліжэйшага ворага пасля тэлепартацыі. Сіла многіх таксама не мінае, калі гэтае ўзмацненне актыўнае. \n\nХодаў, што засталося: %s.
actors.hero.spells.beamingray$beamingrayboost.name=прамянёвы прамень
actors.hero.spells.beamingray.desc=Клярык пераўтварае сілу свайго саюзніка ў прамень святла, які накіроўвае яго ў пэўнае месца. Калі прамень сутыкаецца з ворагам, ён размяшчае саюзніка побач і накіроўвае яго на ворага.\n\nПрамень мае максімальную далёкасць дзеяння роўную клеткам %1$d і павялічвае бонусную шкоду ад «Моцы многіх» да +%2$d%% на 10 хадоў супраць бліжэйшага ворага ў радыусе 4 клетак. Прамень можа тэлепартаваць нават звычайна нерухомых саюзнікаў, але ў гэтых выпадках яго далёкасць дзеяння памяншаецца ўдвая.
actors.hero.spells.beamingray.name=прамянёвы прамень
actors.hero.spells.beamingray.no_space=Там няма месца для з'яўлення вашага саюзніка.
actors.hero.spells.beamingray.out_of_range=Гэта месца знаходзіцца па-за зонай дасяжнасці.
actors.hero.spells.beamingray.short_desc=Тэлепартуе вашага саюзніка і дае бонусную шкоду.
actors.hero.spells.blessspell.desc=Клярык накладвае святое дабраславеньне на сябе або на іншага персанажа, якога бачыць.\n\nПры накладанні на сябе эфект слабейшы, даючы %1$d хады дабраславеньня і %2$d бар'ер.\n\nПры накладанні на іншых персанажаў загавор мацнейшы, даючы %3$d хады дабраславеньня і %4$d лячэнне. Лішняе лячэнне пераўтвараецца ў бар'ер.
actors.hero.spells.blessspell.name=дабраслаўляць
actors.hero.spells.blessspell.short_desc=Благаслаўляе і абараняе Клірык, благаслаўляе і лечыць іншых.
actors.hero.spells.bodyform$bodyformbuff.desc=Целасклад Трыніці ў цяперашні час дае вам сілу зачаравання або гліфа, як быццам ён быў надзеты на вашу бягучую зброю або даспехі.\n\nЗвярніце ўвагу, што цела не можа даць яшчэ адну копію эфекту, ад якога вы ўжо атрымліваеце карысць.\n\nБягучы эфект: %1$s.\n\nХодаў, што засталося: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=форма цела
actors.hero.spells.bodyform.desc=Клярык выбірае чары або гліф, якія ён вызначыў у гэтым праходзе, і надзяляе іх эфектам «Трыніці». \n\nПры выкарыстанні «Трыніці» Клярык атрымлівае эфект абраных чар або гліфа на %d хады. Гэтыя часовыя чары або гліф будуць працаваць з любым эфектам, які б мелі звычайныя чары або гліф. \n\nГэты чар замяняе любы іншы эфект цела, якім у цяперашні час надзелена «Трыніці».
actors.hero.spells.bodyform.name=форма цела
actors.hero.spells.bodyform.short_desc=Прызначае Тройцу чарам або гліфу.
actors.hero.spells.cleanse.desc=Клярык здымае ўсе шкодныя статусы з сябе і бачных саюзнікаў. Пасля заканчэння дзеяння загавору ўсе персанажы, на якіх уздзейнічае загавор, таксама атрымліваюць хады імунітэту да аслабленняў %1$d і бар'ер %2$d.
actors.hero.spells.cleanse.name=ачысціць
actors.hero.spells.cleanse.short_desc=Здымае аслабленыя эфекты і дае абарону.
actors.hero.spells.clericspell.charge_cost=Кошт аплаты: %d
actors.hero.spells.clericspell.invalid_enemy=Вы не можаце нацэліцца на гэтага ворага.
actors.hero.spells.clericspell.invalid_target=Вы не можаце арыентавацца на гэтае месцазнаходжанне.
actors.hero.spells.clericspell.no_target=Там няма мэты.
actors.hero.spells.clericspell.prompt=Выберыце мэту
actors.hero.spells.divineintervention.desc=Клярык напаўняе сябе і саюзнікаў велізарнай колькасцю сілы са свайго тома, павышаючы ўзровень абарончага экрана %1$d усіх і пашыраючы Узнёслую форму на хады %2$d. Неверагодная абарончая сіла гэтага загавору суадносіцца з яго вельмі высокім коштам зарадкі.\n\nЯк і іншыя абарончыя экраны, дадзеныя Узнёслай формай, гэтыя экраны не знікаюць звычайна, а адразу ж знікаюць, калі заканчваецца Узнёслая форма.
actors.hero.spells.divineintervention.name=боскае ўмяшанне
actors.hero.spells.divineintervention.short_desc=Масіўнае ўзмацненне шчыта для клірыка і саюзнікаў.
actors.hero.spells.divinesense$divinesensetracker.desc=Гэты персанаж часова можа бачыць іншых істот паблізу сваімі думкамі!\n\nХодаў засталося: %s.
actors.hero.spells.divinesense$divinesensetracker.name=боскае пачуццё
actors.hero.spells.divinesense.desc=Клярык факусуе свае пачуцці на навакольным асяроддзі, атрымліваючы разумовы зрок з радыусам дзеяння клетак %d на працягу 50 хадоў. Гэты загавор не патрабуе часу для чытання.
actors.hero.spells.divinesense.name=боскае пачуццё
actors.hero.spells.divinesense.short_desc=Атрымайце часовае разумовае зрок у шырокім дыяпазоне.
actors.hero.spells.flash.desc=Клірык накіроўвае сваю ўзнесеную форму ў бліжэйшае месца і тэлепартуецца туды. Флэш можа тэлепартаваць Клірыка ў любое выяўленае месца, якое знаходзіцца ў зоне дасяжнасці і не занятае. Гэты загавор каштуе больш зарадаў тома кожны раз, калі ён выкарыстоўваецца ў той жа ўзнесенай форме.
actors.hero.spells.flash.name=успышка
actors.hero.spells.flash.prompt=Выберыце месцазнаходжанне
actors.hero.spells.flash.short_desc=Тэлепартацыя ў бліжэйшае месца.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Святар зноў зможа бясплатна выкарыстоўваць «Пуцяводнае святло» пасля заканчэння 50 хадоў. \n\nХадоў засталося: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Пуцяводнае святло
actors.hero.spells.guidinglight$illuminated.desc=Гэты персанаж свеціцца ў выніку ўдару пуцяводнага святла. Хоць свячэнне недастаткова моцнае, каб асвятліць навакольную прастору, магічны эфект значна палегчыць нанясенне ўдараў па ім для клірыка.
actors.hero.spells.guidinglight$illuminated.desc_generic=Іншыя героі ўсё яшчэ могуць выкарыстоўваць падсветку, каб атрымаць карысць ад таленту «Пякучае святло», але не атрымаюць ніякай дакладнасці.
actors.hero.spells.guidinglight$illuminated.desc_priest=Святар можа дадаткова спажываць асветленасць з дапамогай ззяння, удару палачкі, удару саюзніка або эфектаў некаторых артэфактаў. Выкарыстанне асветленасці такім чынам нанясе бонусную магічную шкоду, роўную ўзроўню Святара + 5.
actors.hero.spells.guidinglight$illuminated.name=падсветлены
actors.hero.spells.guidinglight.desc=Клярык выпускае стрэл магічнай энергіі, які паражае цэль, наносячы 2-8 адзінак пашкоджанняў і асвятляючы яе. Наступная неабмежаваная фізічная атака, зробленая супраць асветленага ворага, гарантавана параніць яго.
actors.hero.spells.guidinglight.desc_priest=_Гэтае заклён больш магутнае, калі яго выкарыстоўвае Святар._ Першае выкарыстанне заклёну кожныя 50 хадоў не патрабуе зарадаў фаліянтаў, а асвятленне будзе спажывацца ззяннем, палачкамі, іншымі персанажамі і артэфактамі, якія непасрэдна ўплываюць на ворагаў. Калі асвятленне выкарыстоўваецца такім чынам, яно наносіць бонусную магічную шкоду, роўную ўзроўню Святара + 5.
actors.hero.spells.guidinglight.name=Пуцяводнае святло
actors.hero.spells.guidinglight.short_desc=Наносіць магічную шкоду з далёкай адлегласці і гарантуе трапленне.
actors.hero.spells.hallowedground$hallowedterrain.desc=Тут асвячоная зямля. Асвячоная зямля запавольвае ворагаў, лечыць саюзнікаў і прымушае распаўсюджвацца траву.
actors.hero.spells.hallowedground.desc=Святар факусуе сваю боскую магію на зямлі побач, ствараючы %1$dx%1$d вобласць асвечанай мясцовасці на 20 хадоў.\n\nПры накладанні гэты загавор лечыць усіх саюзнікаў на 15 адзінак здароўя (здаровыя саюзнікі і святар атрымліваюць шчыт), ненадоўга прыгнятае ворагаў і распаўсюджвае кароткую траву.\n\nАсвечаная мясцовасць лечыць саюзнікаў на 1 адзінку здароўя за ход (здаровыя саюзнікі і святар атрымліваюць шчыт), калечыць ворагаў і выпадковым чынам выклікае рост высокай травы.\n\nАсвечаная мясцовасць знішчаецца агнём і ўтварае барозністую траву, калі пасіўныя эфекты рэгенерацыі адключаны або святар даўно не атрымліваў вопыт.
actors.hero.spells.hallowedground.name=святая зямля
actors.hero.spells.hallowedground.prompt=Выберыце месцазнаходжанне
actors.hero.spells.hallowedground.short_desc=Лечыць саюзнікаў, запавольвае ворагаў і распаўсюджвае траву ў зоне дзеяння.
actors.hero.spells.holyintuition.cursed=Вы адчуваеце, што ўнутры гэтага прадмета хаваецца злавесная магія.
actors.hero.spells.holyintuition.desc=Клярык факусуе свае пачуцці на прадмеце і вызначае, ці з'яўляецца ён праклятым, ці не, не апранаючы яго на прадмет.
actors.hero.spells.holyintuition.name=святая інтуіцыя
actors.hero.spells.holyintuition.prompt=выбраць прадмет
actors.hero.spells.holyintuition.short_desc=вызначае, ці з'яўляецца прадмет праклятым, ці не.
actors.hero.spells.holyintuition.uncursed=Гэты прадмет не ўтрымлівае злоснай магіі.
actors.hero.spells.holylance$lancecooldown.desc=Святар нядаўна выкарыстаў «Святое Дзіда» і павінен пачакаць, перш чым выкарыстоўваць яго зноў. \n\n Засталося хадоў: %s.
actors.hero.spells.holylance$lancecooldown.name=час аднаўлення святога дзіды
actors.hero.spells.holylance.desc=Святар канцэнтруе вялікую колькасць энергіі ў разбуральным кінутым са святла кап'і. Гэта кап'я наносіць %1$d-%2$d шкоду і заўсёды наносіць максімальную шкоду нежыці і дэманам.\n\nГэта загавор вельмі дарагі і мае час аднаўлення 30 хадоў.
actors.hero.spells.holylance.name=святое дзіда
actors.hero.spells.holylance.short_desc=Наносіць моцную магічную шкоду на дыстанцыйнай адлегласці.
actors.hero.spells.holyward$holyarmbuff.desc=Клярык напоўніў іх зношаныя даспехі святой энергіяй, часова перавызначыўшы любы існуючы гліф і прымусіўшы даспехі блакіраваць 1 дадатковы пункт пашкоджанняў.\n\nХодаў засталося: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Паладзін напоўніў свае зношаныя даспехі святой энергіяй, у выніку чаго даспехі блакуюць дадатковыя 3 адзінкі ўрону.\n\nНакладанне іншых загавораў падчас актыўнасці святога аберага падоўжыць яго працягласць на 10 хадоў за кожны выдаткаваны зарад.\n\nХадоў засталося: %s.
actors.hero.spells.holyward$holyarmbuff.name=святая палата
actors.hero.spells.holyward.desc=Клірык напаўняе свае зношаныя даспехі гліфамі святога святла, павялічваючы блакіроўку шкоды даспехамі на 1. Гэты загавор не патрабуе часу.\n\nГэты гліф дзейнічае 50 хадоў і перазапісвае любы карысны гліф, які мае даспех. Клірык атрымае карысць ад гэтага эфекту, нават калі ў яго няма даспехаў.
actors.hero.spells.holyward.desc_paladin=_Гэтае загавор больш магутнае, калі яго выкарыстоўвае Паладзін._ Дадатковае блакаванне ўрону павялічваецца да 3, загавор больш не перавызначае існуючыя гліфы, а чытанне іншых загавораў, пакуль актыўны Святы абярэг, падаўжае яго працягласць на 10 хадоў за кожны выкарыстаны зарад.
actors.hero.spells.holyward.glyph_desc=Гэты гліф нязначна павялічвае колькасць пашкоджанняў, якія можа блакаваць браня.
actors.hero.spells.holyward.glyph_name=%s святла
actors.hero.spells.holyward.name=святая палата
actors.hero.spells.holyward.short_desc=Часова перавызначае гліфы, каб павялічыць блакаванне брані.
actors.hero.spells.holyweapon$holywepbuff.desc=Клярык напоўніў сваю зношаную зброю святой энергіяй, часова адмяніўшы любыя існуючыя чары і прымусіўшы зброю наносіць дадатковыя 2 адзінкі магічнай шкоды пры кожнай атацы.\n\nХодаў засталося: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Паладзін напоўніў сваю зношаную зброю святой энергіяй, у выніку чаго іх атакі наносяць дадатковыя 6 адзінак магічнай шкоды.\n\nВыкарыстанне іншых загавораў, пакуль святая зброя актыўная, падоўжыць яе працягласць на 10 хадоў за кожны выдаткаваны зарад.\n\nХадоў засталося: %s.
actors.hero.spells.holyweapon$holywepbuff.name=святая зброя
actors.hero.spells.holyweapon.desc=Клярык зачароўвае сваю зношаную зброю святой энергіяй, прымушаючы зброю наносіць дадатковыя 2 адзінкі магічнай шкоды кожны раз, калі ён ударае ёю ворага. Гэты загавор не патрабуе часу на накладанне.\n\nГэта загавор дзейнічае 50 хадоў і адмяняе любыя карысныя загаворы, якія мае зброя на працягу яго тэрміну дзеяння. Удары без зброі таксама могуць атрымаць карысць ад гэтага эфекту.
actors.hero.spells.holyweapon.desc_paladin=_Гэтае заклёнанне больш магутнае, калі яго наносіць паладзін._ Дадатковая магічная шкода павялічваецца да 6, заклёнанне больш не адмяняе існуючыя чары, а накладанне іншых заклёнаў, пакуль актыўная святая зброя, падоўжыць яе працягласць на 10 хадоў за кожны выкарыстаны зарад.
actors.hero.spells.holyweapon.ench_desc=Ворагі, параненыя святой зброяй, атрымаюць дадатковую магічную шкоду.
actors.hero.spells.holyweapon.ench_name=святы %s
actors.hero.spells.holyweapon.name=святая зброя
actors.hero.spells.holyweapon.short_desc=Часова адмяняе чары, каб павялічыць шкоду.
actors.hero.spells.judgement.desc=Клірык б'е кулаком па зямлі, выклікаючы выбух святла, які наносіць шкоду ўсім ворагам, якіх ён бачыць. Гэта наносіць базавую шкоду %1$d-%2$d, але таксама наносіць дадатковую шкоду ў памеры 33%% за кожны загавор, які Клірык наклаў з моманту ўвабрання ў форму ўзнясення (або з моманту апошняга выкарыстання загавору «Правосуд»).\n\nУ цяперашні час «Правосуд» наносіць шкоду ў памеры %3$d-%4$d.
actors.hero.spells.judgement.name=меркаванне
actors.hero.spells.judgement.short_desc=Наносіць шкоду ўсім бачным ворагам.
actors.hero.spells.layonhands.desc=Паладзін перадае святую энергію праз свае рукі, лечачы або абараняючы ўсё, да чаго дакранаецца.\n\nПаладзін можа накласці гэты загавор на любога суседняга персанажа, каб даць яму %1$d лячэнне, або на сябе, каб атрымаць %1$d абарону. Лішняе лячэнне ад гэтага загавору пераўтвараецца ў абарону.\n\nГэта загавор дзейнічае імгненна і можа быць накладзены паўторна, але не можа даць больш за тры сеансы абароны адначасова.
actors.hero.spells.layonhands.name=пакласці на рукі
actors.hero.spells.layonhands.short_desc=Імгненна лечыць суседняга персанажа або накрывае паладзіна шчытом.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Клірык нядаўна наклаў на гэтага саюзніка «Сувязь жыцця».\n\nАкрамя звычайных пераваг «Сувязі жыцця», гэты персанаж таксама атрымлівае меншую шкоду, любыя станоўчыя загаворы Клірыка ўжываюцца як да Клірыка, так і да гэтага саюзніка, а не толькі да аднаго, і «Сіла многіх» не мінае, пакуль гэтае ўзмацненне актыўнае.\n\nХодаў засталося: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=абарона жыццёвай сувязі
actors.hero.spells.lifelinkspell.desc=Клірык умацоўвае сувязь паміж сабой і сваім узмоцненым саюзнікам. Дзякуючы гэтай узмоцненай сувязі любая атрыманая шкода будзе размеркавацца паміж героем і яго саюзнікам на працягу хадоў %1$d, а абарончае ўзмацненне «Моцы многасці» будзе павялічана да -%2$d%% атрыманай шкоды. Звярніце ўвагу, што шкода размяркоўваецца пасля брані, але да зніжэння шкоды ад «Моцы многасці».\n\nПакуль гэты эфект актыўны, карысныя загаворы Клірыка ўзроўню T3 або ніжэй будуць ужывацца як да Клірыка, так і да яго саюзніка, калі б яны проста ўжыліся да аднаго з іх.
actors.hero.spells.lifelinkspell.name=жыццёвая сувязь
actors.hero.spells.lifelinkspell.short_desc=Падзяляе ўрон з саюзнікам і памяншае атрыманы ім ўрон.
actors.hero.spells.mindform.desc=Клярык выбірае палачку або кідальную зброю, якую ён вызначыў у гэтым праходзе, і надзяляе яе эфектам «Трыніці». \n\nПры выкарыстанні «Трыніці» Клярык можа здзейсніць адну атаку, як быццам ён выкарыстоўвае абраны прадмет у +%d. Гэта выкліча ўсе эфекты, якія звычайна выклікае выкарыстанне гэтага тыпу прадмета. \n\nГэты загавор замяняе любы іншы эфект розуму, якім у цяперашні час надзелена «Трыніці».
actors.hero.spells.mindform.name=форма розуму
actors.hero.spells.mindform.short_desc=Прызначае Трыніці палачку або кідальную зброю.
actors.hero.spells.mnemonicprayer.desc=Святар прамаўляе малітву, якая падаўжае тэрмін дзеяння ўсіх узмацненняў або аслабленняў на пэўнай цэлі на хады %1$d. Гэты загавор не патрабуе часу для чытання. Станоўчыя эфекты будуць доўжыцца даўжэй на саюзніках (у тым ліку на самім святары), а шкодныя эфекты будуць доўжыцца даўжэй на ворагах. \n\nМнеманічная малітва можа падоўжыць дзеянне пэўнага ўзмацнення або аслаблення толькі адзін раз і не можа падоўжыць узмацненні, дадзеныя ад здольнасцей даспехаў.
actors.hero.spells.mnemonicprayer.name=мнеманічная малітва
actors.hero.spells.mnemonicprayer.short_desc=Падаўжае дзеянне бафаў/адмоўных эфектаў на саюзніка/ворага і паўторна накладвае падсветку.
actors.hero.spells.radiance.desc=Святар вывяргаецца святым святлом, аглушаючы ўсіх бачных ворагаў на 3 хады. Калі вораг ужо асветлены, «Ззянне» актывуе бонусную шкоду ад асвятлення, а затым накладзе аслабленне асвятлення. «Ззянне» таксама прымусіць святара свяціцца на 100 хадоў, калі бягучы паверх цёмны.
actors.hero.spells.radiance.name=ззянне
actors.hero.spells.radiance.short_desc=Падсвятляе і ненадоўга аглушае бачных ворагаў.
actors.hero.spells.recallinscription$useditemtracker.desc=Клярык нядаўна выкарыстаў прадмет, які працуе з загаворам адклікання з надпісам. Клярык можа выкарыстоўваць загавор, каб паўтарыць эфект прадмета.\n\nВыкарыстаны прадмет: %1$s.\n\nХодаў, што засталося: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=нядаўна выкарыстаная руна
actors.hero.spells.recallinscription.desc=Клярык выкарыстоўвае святую магію, каб паўтарыць эфект магічнай руны, знойдзенай на рунічным камені або скрутку, які ён выкарыстоўваў у апошнія хады %s. \n\nНадпіс адклікання нельга выкарыстоўваць для рэплікацыі скруткаў паляпшэння. Кошт зарадкі гэтага загавору залежыць ад таго, які прадмет выкарыстоўваўся нядаўна: 2 за рунічны камень, 3 за скрутак, 4 за экзатычны скрутак. Гэты кошт зарадкі таксама падвойваецца пры рэплікацыі скрутка трансмутацыі або алхімічных прадметаў, якія павінны быць выраблены з дапамогай трансмутацыі або паляпшэння.
actors.hero.spells.recallinscription.name=надпіс аб адкліканні
actors.hero.spells.recallinscription.short_desc=Паўтарае нядаўна выкарыстаны рунічны камень або скрутак.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Паміж гэтым персанажам і ворагам стаіць тонкі шчыт святла. Ён недастаткова моцны, каб цалкам блакаваць атакі, але змякчае іх.\n\nХодаў засталося: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=шчыт святла
actors.hero.spells.shieldoflight.desc=Клярык стварае тонкі светлавы бар'ер паміж сабой і ворагам, павялічваючы сілу блока сваёй брані супраць гэтага ворага на %1$d-%2$d на 5 хадоў.\n\nГэта загавор не патрабуе часу, але яго нельга выкарыстоўваць супраць некалькіх цэляў адначасова.
actors.hero.spells.shieldoflight.name=шчыт святла
actors.hero.spells.shieldoflight.short_desc=Дае часовую браню супраць цэлі.
actors.hero.spells.smite.desc=Паладзін напаўняе ўдар у блізкім бою праведнай разбуральнай сілай.\n\nАкрамя нанясення звычайнай шкоды ў блізкім бою, Smite гарантавана робіць неабмежаваныя атакі, мае сілу зачаравання +300%% і наносіць бонусную магічную шкоду %1$d - %2$d.\n\nБонусная магічная шкода Smite залежыць ад узроўню Паладзіна, і ён заўсёды будзе наносіць максімальную бонусную магічную шкоду супраць нежыці або дэманічных ворагаў.
actors.hero.spells.smite.name=пабіць
actors.hero.spells.smite.short_desc=Гарантуе ўдар з бонуснай шкодай і сілай чар.
actors.hero.spells.spiritform$spiritformbuff.desc=Духоўная форма Трыніці зараз дае вам сілу прадмета, як быццам вы яго ўжо абсталявалі.\n\nЗвярніце ўвагу, што духоўная форма не можа даць яшчэ адну копію эфекту, ад якога вы ўжо атрымліваеце карысць.\n\nБягучы эфект: %1$s.\n\nХодаў, што засталося: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=духоўная форма
actors.hero.spells.spiritform.desc=Клярык выбірае пярсцёнак або артэфакт, які ён вызначыў у гэтым праходзе (акрамя святога тома), і надзяляе яго эфектам Трыніці.\n\nКалі выбраны пярсцёнак, Трыніці дае эфект гэтаму пярсцёнку з тэмпературай +%1$d на 20 хадоў.\n\nКалі выбраны артэфакт, Трыніці паўтарае эфект гэтага артэфакта з тэмпературай +%2$d. Кожны артэфакт мае розныя спецыфічныя паводзіны і кошт зараду брані пры выкарыстанні з Трыніці.\n\nГэта загавор замяняе любы іншы духоўны эфект, якім у цяперашні час надзелена Трыніці.
actors.hero.spells.spiritform.name=духоўная форма
actors.hero.spells.spiritform.short_desc=Прысвойвае Трыніці пярсцёнку або артэфакту.
actors.hero.spells.stasis$stasisbuff.desc=У Клірыка зараз ёсць саюзнік, які захоўваецца ў стазісе. Усе станоўчыя эфекты на гэтага саюзніка захоўваюцца, у тым ліку «Моц многіх», і яны з'явяцца побач з Клірыкам пасля заканчэння эфекту. Эфект таксама можна спыніць раней, паўторна разыграўшы «Стазіс». \n\nСувязнік у стазісе: %1$s.\nХодаў засталося: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Ваш нерухомы саюзнік застаўся ззаду.
actors.hero.spells.stasis$stasisbuff.name=саюзнік у стазісе
actors.hero.spells.stasis.desc=Клірык факусуе сваю сувязь з саюзнікам на сабе, у выніку чаго саюзнік часова знаходзіцца ў своеасаблівым энергетычным стазісе ўнутры клірыка. Саюзнік будзе захоўвацца на працягу хадоў да %d, прычым усе станоўчыя эфекты на яго не залежаць ад часу знаходжання ў стазісе.\n\n Саюзнік з'явіцца побач з клірыкам, калі стазіс заканчваецца натуральным шляхам, або ён можа імгненна перакарыстаць загавор бясплатна, каб раней спыніць эфект. Стазіс можа нават перамяшчаць нерухомых саюзнікаў, але не можа перамяшчаць іх паміж паверхамі.
actors.hero.spells.stasis.name=застой
actors.hero.spells.stasis.short_desc=Выводзіць саюзніка з падзямелля і захоўвае яго.
actors.hero.spells.sunray.desc=Клярык выпускае ў цэль прамень асляпляльнага святла, наносячы %1$d-%2$d шкоду і асляпляючы яе на %3$d хады. Сонечны прамень заўсёды наносіць максімальную шкоду нежыці і дэманам.\n\nПасля ўдару гэтым заклёнам зрок ворага адрэгулюецца, не даючы яму зноў быць аслепленым. Аднак, калі праціўнік атрымае паўторны ўдар, будучы аслепленым гэтым заклёнам, то святло будзе невыносным і паралізуе яго.
actors.hero.spells.sunray.name=сонечны прамень
actors.hero.spells.sunray.short_desc=Наносіць магічную шкоду ад далёкай атакі і асляпляе цэль адзін раз.
actors.hero.spells.walloflight$lightwall.desc=Міготкія панэлі святла блакуюць тут праход.
actors.hero.spells.walloflight.desc=Паладын стварае перад сабой сцяну з панэляў суцэльнага святла таўшчынёй у 1 плітку і шырынёй %1$d, якая дзейнічае 20 хадоў.\n\nГэтая сцяна дзейнічае як звычайная, за выключэннем таго, што яе можна бачыць наскрозь. Ворагі, якія затрымаліся ў сцяне пры яе стварэнні, будуць на імгненне аглушаны і, калі магчыма, адкінуты назад. Усё, што затрымалася ў сцяне, зможа з яе выбрацца.\n\nСцяну можна выкарыстоўваць у любым з чатырох асноўных або чатырох дыяганальных напрамкаў. Калі сцяна ўжо актыўная, загавор можна бясплатна паўторна выкарыстаць, каб імгненна ачысціць сцяну.
actors.hero.spells.walloflight.early_end=Ты рассейваеш сцяну святла.
actors.hero.spells.walloflight.name=сцяна святла
actors.hero.spells.walloflight.short_desc=Стварае сцяну, якая блакуе ворагаў.
actors.hero.talent$aggressivebarriercooldown.desc=Вы нядаўна выкарыстоўвалі гэты талент і павінны пачакаць, перш чым выкарыстоўваць яго зноў. \n\nХадоў засталося: %s.
actors.hero.talent$aggressivebarriercooldown.name=час аднаўлення агрэсіўнага бар'ера
actors.hero.talent$combinedlethalityabilitytracker.executed=выкананы
actors.hero.talent$deadlyfollowuptracker.desc=Дуэлянтка нядаўна атакавала ворага кідальнай зброяй, яе блізкія атакі па той жа цэлі будуць мець павялічаную шкоду. \n\nХадзін застаўся: %s.
actors.hero.talent$deadlyfollowuptracker.name=смяротнае наступства
actors.hero.talent$followupstriketracker.desc=Паляўнічая нядаўна атакавала ворага кідальнай зброяй, яе наступная атака ў блізкім бою па той жа цэлі будзе мець павялічаную шкоду. \n\nХадзін застаўся: %s.
actors.hero.talent$followupstriketracker.name=паўторны страйк
actors.hero.talent$improvisedprojectilecooldown.desc=Вы нядаўна выкарыстоўвалі гэты талент і павінны пачакаць, перш чым выкарыстоўваць яго зноў. \n\nХадоў засталося: %s.
actors.hero.talent$improvisedprojectilecooldown.name=час аднаўлення імправізаваных снарадаў
actors.hero.talent$lethalhastecooldown.desc=Вы нядаўна выкарыстоўвалі гэты талент і павінны пачакаць, перш чым выкарыстоўваць яго зноў. \n\nХадоў засталося: %s.
actors.hero.talent$lethalhastecooldown.name=час аднаўлення смяротнай хуткасці
actors.hero.talent$lingeringmagictracker.desc=Маг нядаўна выкарыстаў посах або палачку, яго наступная фізічная атака нанясе дадатковую шкоду. \n\nХадзін застаўся: %s.
actors.hero.talent$lingeringmagictracker.name=зацяжная магія
actors.hero.talent$liquidagilacctracker.desc=Наступная звычайная атака дуэлянта ў блізкім бою атрымае бонус да дакладнасці. \n\nХадоў засталося: %s.
actors.hero.talent$liquidagilacctracker.name=спрытнасць вадкасці
actors.hero.talent$patientstriketracker.desc=Дуэлянтка толькі што правяла ход у чаканні, яе наступная атака ў блізкім бою нанясе дадатковую шкоду.
actors.hero.talent$patientstriketracker.name=забастоўка пацыентаў
actors.hero.talent$preciseassaulttracker.desc=Наступная звычайная атака дуэлянта ў блізкім бою атрымае бонус да дакладнасці. \n\nХадоў засталося: %s.
actors.hero.talent$preciseassaulttracker.name=дакладны напад
actors.hero.talent$provokedangertracker.desc=Воін нядаўна страціў свой шчыт, яго наступная фізічная атака нанясе дадатковую шкоду. \n\nХадзі засталіся: %s.
actors.hero.talent$provokedangertracker.name=выклікаў гнеў
