actors.blobs.blizzard.desc=Aquí azota una ventisca.
actors.blobs.blizzard.name=ventisca
actors.blobs.confusiongas.desc=Una nube de gas confuso se arremolina aquí.
actors.blobs.confusiongas.name=gas de confusión
actors.blobs.corrosivegas.desc=Una nube de gas cáustico mortal se arremolina aquí.
actors.blobs.corrosivegas.name=gas corrosivo
actors.blobs.electricity.desc=Aquí brilla un campo eléctrico.
actors.blobs.electricity.name=electricidad
actors.blobs.electricity.ondeath=Te quedaste de piedra...
actors.blobs.electricity.rankings_desc=Electrocutado
actors.blobs.fire.desc=Aquí hay un incendio.
actors.blobs.fire.name=fuego
actors.blobs.foliage.desc=Rayos de luz atraviesan la penumbra del jardín subterráneo.
actors.blobs.foliage.name=follaje
actors.blobs.freezing.desc=Aquí el aire es anormalmente frío.
actors.blobs.freezing.name=aire helado
actors.blobs.goowarn.desc=¡Partículas de energía oscura pululan por aquí!
actors.blobs.goowarn.name=energía oscura
actors.blobs.inferno.desc=Aquí reina un infierno.
actors.blobs.inferno.name=infierno
actors.blobs.paralyticgas.desc=Una nube de gas paralizante se arremolina aquí.
actors.blobs.paralyticgas.name=gas paralizante
actors.blobs.regrowth.name=rebrote
actors.blobs.sacrificialfire.desc=Aquí hay un altar con un fuego sacrificial ardiendo sobre él. Cualquier criatura que sea asesinada aquí será consumida como ofrenda a los espíritus de la mazmorra. ¿Tal vez se otorgará una recompensa si se realizan suficientes sacrificios?
actors.blobs.sacrificialfire.name=fuego sacrificial
actors.blobs.sacrificialfire.reward=El fuego se enciende y luego se disipa, ¡dejando una recompensa!
actors.blobs.sacrificialfire.unworthy=El fuego consume tu ofrenda, pero no la transforma.
actors.blobs.sacrificialfire.worthy=El fuego consume tu ofrenda y se fortalece.
actors.blobs.smokescreen.desc=Una densa nube de humo negro se arremolina aquí.
actors.blobs.smokescreen.name=cortina de humo
actors.blobs.stenchgas.desc=Una nube de hedor fétido se arremolina aquí.
actors.blobs.stenchgas.name=gas hediondo
actors.blobs.stormcloud.desc=Una nube de vapor de agua ondulante se arremolina aquí.
actors.blobs.stormcloud.name=nubes de tormenta
actors.blobs.toxicgas.desc=Una nube verdosa de gas tóxico se arremolina aquí.
actors.blobs.toxicgas.name=gas tóxico
actors.blobs.toxicgas.ondeath=Moriste por el gas tóxico...
actors.blobs.toxicgas.rankings_desc=Asfixiado
actors.blobs.waterofawareness.desc=El poder del conocimiento emana del agua de este pozo. Al beber de él, se identificarán todos los objetos equipados, las maldiciones que afecten a todos los objetos del inventario y se revelarán todos los objetos del piso actual.
actors.blobs.waterofawareness.name=agua de conciencia
actors.blobs.waterofawareness.procced=Al tomar un sorbo, sientes cómo el conocimiento inunda tu mente.
actors.blobs.waterofhealth.desc=El poder de la salud emana del agua de este pozo. Beber de ella curará tus heridas, saciará tu hambre y eliminará cualquier maldición que afecte a tus objetos desgastados.
actors.blobs.waterofhealth.name=agua de salud
actors.blobs.waterofhealth.procced=Al tomar un sorbo, sientes cómo tus heridas sanan por completo.
actors.blobs.web.desc=Una densa red lo cubre todo. Cualquier cosa que toque o atraviese la red la romperá, pero también quedará atrapada en su sitio.
actors.blobs.web.name=telaraña
actors.buffs.adrenaline.desc=Una oleada de poder físico, la adrenalina mejoró tanto la velocidad de ataque como la de movimiento.\n\nLa adrenalina permite a su objetivo correr a 2x de velocidad y atacar a 1,5x de velocidad.\n\nTurnos restantes: %s.
actors.buffs.adrenaline.name=adrenalina
actors.buffs.adrenalinesurge.desc=Un aumento de gran poder, pero lamentablemente no permanente.\n\nAumento de fuerza: +%d.\nTurnos hasta que el aumento se debilite: %s.
actors.buffs.adrenalinesurge.name=aumento de fuerza
actors.buffs.amok.desc=Amok provoca un estado de gran rabia y confusión en su objetivo.\n\nCuando una criatura es afectada por Amok, atacará a todo lo que esté cerca, ya sea amigo o enemigo.\n\nTurnos restantes de Amok: %s.
actors.buffs.amok.name=loco
actors.buffs.arcanearmor.desc=Un escudo delgado te rodea, bloqueando parte del daño de los ataques mágicos.\n\nTu armadura mágica está actualmente aumentada en: 0-%d.\n\nTurnos hasta que la armadura arcana se debilite: %s.
actors.buffs.arcanearmor.name=armadura arcana
actors.buffs.artifactrecharge.desc=La energía fluye a través de ti, aumentando la velocidad de carga de tus artefactos equipados.\n\nCada artefacto se ve afectado de forma ligeramente diferente, pero todos ganarán carga mucho más rápido de lo normal.\n\nTurnos restantes: %s.
actors.buffs.artifactrecharge.name=recarga de artefactos
actors.buffs.ascensionchallenge.almost=Sientes cómo el agarre de Yog sobre el amuleto comienza a debilitarse, ¡ya casi lo logras!
actors.buffs.ascensionchallenge.beckon=El amuleto comienza a llamar a enemigos lejanos.
actors.buffs.ascensionchallenge.break=¡Tómate un momento para recuperar el aliento y sentir cómo tus heridas comienzan a cicatrizar!
actors.buffs.ascensionchallenge.damage=El amuleto comienza a irradiar energía oscura. ¡Arde!
actors.buffs.ascensionchallenge.desc=De alguna manera, Yog-Dzewa mantiene su influencia en este mundo a través del amuleto, ¡y está tratando de detener tu ascenso! El poder de Yog está haciendo que la mazmorra sea mucho más peligrosa, aumentando el número de enemigos y haciéndolos más fuertes. Este poder seguirá creciendo si no se controla; puede debilitarse al derrotar a enemigos que han sido potenciados por el poder de Yog.
actors.buffs.ascensionchallenge.desc_beckon=El amuleto está actualmente _llamando a enemigos lejanos_, alertándolos de tu posición.
actors.buffs.ascensionchallenge.desc_clear=La energía oscura que irradia el amuleto se ha debilitado lo máximo posible por ahora.
actors.buffs.ascensionchallenge.desc_damage=¡La energía del amuleto se ha vuelto tan fuerte que te está perjudicando directamente!
actors.buffs.ascensionchallenge.desc_haste=¡El amuleto actualmente está _acelerando a los enemigos lejanos_, permitiéndoles llegar a ti más rápido!
actors.buffs.ascensionchallenge.desc_slow=¡El amuleto actualmente te está ralentizando y anulando los efectos que aumentan la velocidad!
actors.buffs.ascensionchallenge.haste=¡El amuleto comienza a apresurar a los enemigos lejanos!
actors.buffs.ascensionchallenge.name=La maldición del amuleto
actors.buffs.ascensionchallenge.on_kill=La energía oscura te consume...
actors.buffs.ascensionchallenge.slow=¡El amuleto empieza a sentirse como un lastre en tu inventario!
actors.buffs.ascensionchallenge.weaken=Puedes sentir cómo la maldición del amuleto se debilita ligeramente.
actors.buffs.ascensionchallenge.weaken_info=La maldición del amuleto puede debilitarse al derrotar a más enemigos.
actors.buffs.ascensionchallenge.weaken_info_no_kills=¡Si derrotas a los enemigos, la maldición del amuleto se debilitará!
actors.buffs.barkskin.desc=Tu piel está endurecida, se siente áspera y sólida como la corteza.\n\nLa piel endurecida aumenta tu armadura efectiva, lo que te permite defenderte mejor contra ataques físicos.\n\nTu armadura actualmente aumenta en: 0-%d.\nTurnos hasta que la piel de corteza se debilite: %s.\n\nSi recibes piel de corteza de múltiples fuentes, solo se aplicará la más fuerte.
actors.buffs.barkskin.name=piel de corteza
actors.buffs.barrier.desc=Una burbuja de fuerza duradera que bloquea todo daño.\n\nLa barrera recibirá daño por lo que sea que esté protegiendo mientras quede escudo. El escudo también se degradará lentamente con el tiempo.\n\nEscudo restante: %d.
actors.buffs.barrier.name=barrera
actors.buffs.berserk.action_name=Enloquecido
actors.buffs.berserk.angered=enfadado
actors.buffs.berserk.angered_desc=La gravedad de las heridas del Berserker fortalece sus golpes. A medida que el Berserker recibe daño físico, su furia aumentará, otorgándole daño adicional. El daño que es bloqueado por la armadura aún cuenta para aumentar la furia. La furia se desvanecerá con el tiempo. Cuanto menor sea la salud del Berserker, más durará. Con 100 de furia, el Berserker puede entrar en estado de furia, otorgándole un escudo basado en el nivel de su armadura y su salud faltante. Mientras está en estado de furia, su escudo se debilita con el tiempo y, una vez agotado, tendrá que descansar antes de volver a acumular furia.\n\nFuria actual: _%1$.0f%%_\n_+%2$.0f%%_ daño\n\nEscudo de furia con la armadura y los puntos de vida actuales: _%3$d_
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.berserk_desc=El miedo y la incertidumbre se desvanecen, dejando solo ira. En este estado, el Berserker es extremadamente poderoso, _infligiendo +50%% de daño y obteniendo escudo adicional_, pero también perdiendo escudo cada turno.\n\nCuando todo su escudo se reduce a 0, el berserker terminará.\n\nDespués de enfurecerse, el Berserker necesitará recuperarse antes de poder acumular ira nuevamente.\n\nEscudo restante: %d
actors.buffs.berserk.exhausted=exhausto
actors.buffs.berserk.no_seal=¡Necesitas tu sello roto para volverte loco!
actors.buffs.berserk.rankings_desc=Enloquecido hasta la muerte
actors.buffs.berserk.recovering=recuperante
actors.buffs.berserk.recovering_desc=La fuerza interior tiene sus límites. El Berserker debe descansar antes de volver a usar su furia.\n\nMientras se recupera, el Berserker no acumula furia al recibir daño.
actors.buffs.berserk.recovering_desc_levels=Niveles hasta la recuperación: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Turnos hasta recuperarse: _%d_
actors.buffs.bleeding.desc=Esa herida está sangrando una cantidad preocupante de sangre.\n\nEl sangrado causa daño cada turno. Cada turno el daño disminuye en una cantidad aleatoria, hasta que el sangrado finalmente se detiene.\n\nDaño actual por sangrado: %d.
actors.buffs.bleeding.heromsg=¡Estás sangrando!
actors.buffs.bleeding.name=sangría
actors.buffs.bleeding.ondeath=Te desangraste hasta morir...
actors.buffs.bleeding.rankings_desc=Murió desangrado
actors.buffs.bless.desc=Un gran estallido de concentración, algunos dicen que está inspirado por los dioses.\n\nLa bendición aumenta la precisión y la evasión en 25%%, haciendo que el bendecido sea mucho más efectivo en combate.\n\nTurnos de bendición restantes: %s.
actors.buffs.bless.name=bendecido
actors.buffs.blindness.desc=El cegamiento convierte el mundo circundante en una neblina oscura.\n\nMientras está cegado, el rango de visión de un personaje se reduce a una casilla, lo que hace que los ataques a distancia sean inútiles y hace que sea muy fácil perder de vista a los enemigos distantes. Además, un héroe cegado no puede leer pergaminos ni libros.\n\nTurnos de ceguera restantes: %s.
actors.buffs.blindness.heromsg=¡Estás cegado!
actors.buffs.blindness.name=cegado
actors.buffs.blobimmunity.desc=Una fuerza extraña te está envolviendo en una delgada barrera protectora, bloqueando todos los efectos dañinos transmitidos por el aire.\n\nEres inmune a todos los efectos de área limitada mientras dure esta barrera.\n\nTurnos de inmunidad restantes: %s.
actors.buffs.blobimmunity.name=barrera de purificación
actors.buffs.burning.burnsup=¡%s se quema!
actors.buffs.burning.desc=Pocas cosas son más angustiantes que estar envuelto en llamas.\n\nEl fuego infligirá daño cada turno hasta que se apague con agua o se extinga. El fuego se puede extinguir pisando agua o con el chapoteo de una poción destructora.\n\nAdemás, el fuego puede incendiar terrenos u objetos inflamables con los que entre en contacto.\n\nTurnos de ardor restantes: %s.
actors.buffs.burning.heromsg=¡Te prendes fuego!
actors.buffs.burning.name=incendio
actors.buffs.burning.ondeath=Moriste quemado...
actors.buffs.burning.rankings_desc=Reducido a cenizas
actors.buffs.championenemy$antimagic.desc=Los campeones antimagia reciben un 50% menos de daño y son completamente inmunes a los efectos mágicos.
actors.buffs.championenemy$antimagic.name=campeón antimagia
actors.buffs.championenemy$blazing.desc=Los campeones llameantes infligen un 25 % más de daño cuerpo a cuerpo, prenden fuego a los enemigos que atacan, son inmunes al fuego y lo propagan a su alrededor al morir. Sin embargo, no pueden propagar el fuego al agua.
actors.buffs.championenemy$blazing.name=campeón resplandeciente
actors.buffs.championenemy$blessed.desc=Los campeones bendecidos tienen 4 veces más precisión y evasión.
actors.buffs.championenemy$blessed.name=campeón bendito
actors.buffs.championenemy$giant.desc=Los campeones gigantes reciben un 80% menos de daño y tienen +1 de alcance de ataque, pero no pueden moverse a través de espacios cerrados.
actors.buffs.championenemy$giant.name=campeón gigante
actors.buffs.championenemy$growing.desc=Los campeones en crecimiento obtienen una bonificación que aumenta constantemente a la precisión, la evasión, el daño físico y una reducción del daño recibido.\n\nAumento actual de precisión/evasión/daño: %1$d%%\nReducción de daño actual: %2$d%%
actors.buffs.championenemy$growing.name=campeón en crecimiento
actors.buffs.championenemy$projecting.desc=Los campeones que proyectan daño infligen un 25 % más de daño cuerpo a cuerpo y tienen +3 de alcance de ataque.
actors.buffs.championenemy$projecting.name=campeón proyectado
actors.buffs.championenemy.warn=Sientes una presencia mortal.
actors.buffs.charm.cant_attack=Estás hechizado por ese enemigo y no puedes atacarlo.
actors.buffs.charm.desc=Un encantamiento es magia manipuladora que puede hacer que los enemigos se adoren temporalmente.\n\nLos personajes afectados por el encantamiento no pueden atacar directamente al enemigo que los ha encantado. Sin embargo, aún es posible atacar a otros objetivos. El shock del dolor disminuirá la duración del encantamiento.\n\nTurnos de encantamiento restantes: %s.
actors.buffs.charm.heromsg=¡Estás encantado!
actors.buffs.charm.name=Encantado
actors.buffs.chill.desc=No está completamente congelado, pero aún hace demasiado frío. Los objetivos enfriados realizan todas las acciones más lentamente, dependiendo de cuántos turnos queden del efecto. En el peor de los casos, esto equivale a una ralentización. Turnos de enfriamiento restantes: La velocidad se reduce en: La velocidad se reduce en:
actors.buffs.chill.freezes=¡%s se congela!
actors.buffs.chill.name=enfriado
actors.buffs.combo$combomove.clobber.desc=Aleja al enemigo 2 casillas, pero no le inflige daño y no puede empujarlo a pozos. Incrementa el combo en 1.
actors.buffs.combo$combomove.clobber.empower_desc=Aleja al enemigo 3 casillas, le provoca vértigo y puede empujarlo a pozos, pero no le inflige daño. Incrementa el combo en 1.
actors.buffs.combo$combomove.clobber.name=golpear
actors.buffs.combo$combomove.crush.desc=Inflige %d%% (combo*25%%) de daño al objetivo principal y la mitad de ese daño a todos los demás enemigos en un área de efecto de 7x7. Reinicia el combo al usarse.
actors.buffs.combo$combomove.crush.empower_desc=_Salta hasta la(s) casilla(s) %1$d_ y causa %2$d%% (combo*25%%) de daño al objetivo principal, y la mitad de ese daño a todos los demás enemigos en un área de 7x7. Reinicia el combo cuando se usa.
actors.buffs.combo$combomove.crush.name=aplastar
actors.buffs.combo$combomove.fury.desc=Golpea a un enemigo una vez por cada combo que tengas; cada golpe inflige un 60% de daño y puede activar encantamientos. Reinicia el combo al usarse.
actors.buffs.combo$combomove.fury.empower_desc=_Salta hasta la casilla %d_ y golpea a un enemigo una vez por cada combo que tengas. Cada golpe inflige 60%% de daño y puede activar encantamientos. Reinicia el combo al usarse.
actors.buffs.combo$combomove.fury.name=furia
actors.buffs.combo$combomove.parry.desc=Bloquea el siguiente ataque en 1 turno al activarse y contraataca instantáneamente. Reinicia el combo si no se bloquea ningún ataque.
actors.buffs.combo$combomove.parry.empower_desc=Bloquea _todos los ataques_ en 1 turno al activarse y contraataca instantáneamente. Reinicia el combo si no se bloquea ningún ataque.
actors.buffs.combo$combomove.parry.name=parar
actors.buffs.combo$combomove.slam.desc=Inflige %d%% (combo*20%%) de tu poder de bloqueo de daño como daño adicional. Reinicia el combo cuando se usa.
actors.buffs.combo$combomove.slam.empower_desc=_Salta a la(s) casilla(s) %1$d_ y causa %2$d%% (combo*20%%) de tu poder de bloqueo de daño como daño adicional. Reinicia el combo cuando se usa.
actors.buffs.combo$combomove.slam.name=golpe
actors.buffs.combo.action_name=ataque combinado
actors.buffs.combo.bad_target=Debes seleccionar como objetivo a un enemigo que esté dentro del alcance de ataque.
actors.buffs.combo.combo=¡Combo de %d!
actors.buffs.combo.desc=El gladiador gana impulso a medida que conecta golpes exitosos. Cada ataque aumenta el contador de combo en uno, pero si tarda demasiado entre golpes, el contador de combo se reiniciará a 0. Mientras el gladiador tenga combo, cualquier escudo que tenga de su sello roto no comenzará a desvanecerse.\n\n¡Construir combo desbloquea ataques especiales de combo que no pueden fallar! Se desbloquea un ataque diferente en el conteo de combo 2, 4, 6, 8 y 10. Algunos movimientos reinician el combo y otros no, pero cada movimiento solo se puede usar una vez por sesión de combo.\n\nCombo actual: %1$d.\n\nTurnos hasta que se pierda el combo: %2$s.
actors.buffs.combo.name=combo
actors.buffs.combo.prompt=Selecciona un objetivo para atacar.
actors.buffs.corrosion.desc=El ácido potente derrite la carne, el metal y el hueso a un ritmo alarmante.\n\nEl daño por corrosión aumenta con el tiempo, a medida que el objetivo continúa derritiéndose.\n\nTurnos de corrosión restantes: %1$s.\nDaño por corrosión actual: %2$d.
actors.buffs.corrosion.heromsg=¡Te estás derritiendo!
actors.buffs.corrosion.name=corrosión
actors.buffs.corrosion.ondeath=Te desvaneces...
actors.buffs.corrosion.rankings_desc=Disuelto
actors.buffs.corruption.desc=La corrupción se filtra en la esencia de un ser, retorciéndolo contra su naturaleza anterior.\n\nLas criaturas corruptas atacarán a sus aliados e ignorarán a sus antiguos enemigos. La corrupción también es dañina y hará que su objetivo sucumba lentamente.\n\nLa corrupción es permanente, sus efectos solo terminan con la muerte.
actors.buffs.corruption.name=corrupto
actors.buffs.cripple.desc=Estás bastante seguro de que las piernas no están hechas para doblarse de esa manera.\n\nLisiado reduce a la mitad la velocidad de movimiento, haciendo que mover una casilla normalmente tome dos turnos en lugar de uno.\n\nTurnos restantes de lisiado: %s.
actors.buffs.cripple.heromsg=¡Estás lisiado!
actors.buffs.cripple.name=lisiado
actors.buffs.daze.desc=El zumbido en los oídos y la visión borrosa dificultan la lucha.\n\nMientras está aturdido, la precisión y la evasión se reducen en 50%%, lo que hace que tanto acertar como esquivar golpes sea mucho más difícil.\n\nTurnos de aturdimiento restantes: %s.
actors.buffs.daze.heromsg=¡Estás aturdido!
actors.buffs.daze.name=aturdido
actors.buffs.degrade.desc=¡La poderosa magia oscura está agotando la fuerza que los pergaminos de mejora han aplicado a tu equipo!\n\nMientras esté degradado, el equipo mejorado se tratará como si fuera de un nivel inferior al que realmente es. _Cada mejora después de +3 se vuelve exponencialmente más débil que la anterior._ Las descripciones de tus objetos cambiarán para reflejar su nivel de poder reducido.\n\nLa degradación no afecta los requisitos de fuerza, las cargas de varita, la durabilidad de las armas arrojadizas o los artefactos.\n\nTurnos de degradación restantes: %s. Usar un pergamino de mejora o de eliminación de maldición terminará la degradación inmediatamente.
actors.buffs.degrade.heromsg=¡Sientes que tu equipo está más débil!
actors.buffs.degrade.name=degradado
actors.buffs.doom.desc=Es difícil seguir adelante cuando parece que el universo quiere que estés muerto.\n\nLos personajes condenados recibirán un +67% de daño de todas las fuentes.\n\nLa condena es permanente, sus efectos solo terminan con la muerte.
actors.buffs.doom.name=condenado
actors.buffs.dread.desc=¡Un terror tan grande que hará que su objetivo huya de la mazmorra por completo!\n\nLas criaturas afectadas por el miedo huirán de su oponente a gran velocidad y desaparecerán de la mazmorra por completo una vez que estén fuera de la vista. Los enemigos que son derrotados de esta manera otorgan la mitad de la experiencia y no sueltan objetos. El shock del dolor disminuirá la duración del miedo.\n\nTurnos de miedo restantes: %d.
actors.buffs.dread.name=miedo
actors.buffs.drowsy.desc=Una fuerza mágica dificulta mantenerse despierto, después de unos turnos, el objetivo caerá en un profundo sueño mágico.\n\nEl héroe puede resistir la somnolencia recibiendo daño o estando con la salud al máximo.\n\nTurnos hasta el sueño: %s.
actors.buffs.drowsy.name=soñoliento
actors.buffs.earthimbue.desc=¡Estás imbuido del poder de la tierra!\n\nTodos los ataques físicos moverán la tierra bajo el enemigo, paralizándolo por un corto tiempo.\n\nTurnos de imbuición de tierra restantes: %s.
actors.buffs.earthimbue.name=impregnado de tierra
actors.buffs.enhancedrings.desc=El artefacto usado recientemente por el Pícaro está potenciando sus anillos, otorgándoles +1 nivel.\n\nTurnos restantes: %s.
actors.buffs.enhancedrings.name=anillos realzados
actors.buffs.fireimbue.desc=¡Estás imbuido del poder del fuego!\n\nTodos los ataques físicos tendrán una probabilidad de prender fuego a los enemigos. Además, eres completamente inmune a los efectos del fuego.\n\nTurnos de imbuición de fuego restantes: %s.
actors.buffs.fireimbue.name=imbuido de fuego
actors.buffs.foresight.desc=De alguna manera, puedes ver el diseño del terreno circundante con tu mente.\n\nMientras estás bajo el efecto de la premonición, todas las casillas en un amplio radio se te revelan, incluyendo cualquier trampa o puerta secreta.\n\nTurnos de premonición restantes: %s.
actors.buffs.foresight.name=previsión
actors.buffs.frost.desc=No debe confundirse con la congelación total, esta congelación más benigna simplemente envuelve al objetivo en hielo.\n\nLa congelación actúa de forma similar a la parálisis, haciendo imposible que el objetivo actúe. A diferencia de la parálisis, la congelación se cancela inmediatamente si el objetivo recibe daño, ya que el hielo se romperá.\n\nTurnos de congelación restantes: %s.
actors.buffs.frost.freezes=¡%s se congela!
actors.buffs.frost.name=congelado
actors.buffs.frostimbue.desc=¡Estás imbuido de poder gélido!\n\nTodos los ataques físicos acumularán constantemente frío en los enemigos. Además, eres completamente inmune al frío.\n\nTurnos de imbuición de escarcha restantes: %s.
actors.buffs.frostimbue.name=impregnado de escarcha
actors.buffs.fury.desc=Estás enojado, a los enemigos no les gustarás cuando estés enojado.\n\nUna gran rabia arde en tu interior, aumentando el daño que infliges con ataques físicos en 50%%.\n\nEsta rabia durará mientras estés herido por debajo de 50%% salud.
actors.buffs.fury.heromsg=¡Te enfureces!
actors.buffs.fury.name=furioso
actors.buffs.gravitychaostracker.desc_duration=No está claro cuánto durará el efecto, pero no puede durar para siempre.
actors.buffs.gravitychaostracker.desc_intro=Cada pocos turnos, todos los personajes que se encuentren en el piso actual de la mazmorra serán lanzados en una dirección aleatoria.
actors.buffs.gravitychaostracker.desc_positive=Sin embargo, parece que tú y tus aliados sois inmunes.
actors.buffs.gravitychaostracker.name=Caos gravitatorio
actors.buffs.greaterhaste.desc=Un increíble aumento de velocidad, por un momento se siente como si todo lo demás estuviera quieto.\n\nMientras se está bajo los efectos de mayor prisa, las acciones de movimiento no toman tiempo en absoluto, pero otras acciones todavía se realizan a velocidad normal. Cada paso de movimiento consume un turno de mayor prisa.\n\nTurnos de mayor prisa restantes: %d.
actors.buffs.greaterhaste.name=mayor prisa
actors.buffs.haste.desc=La energía fluye a través de tus músculos, ¡permitiéndote correr a velocidades increíbles!\n\nMientras estés bajo los efectos de la prisa correrás a 3 veces la velocidad, pero realizarás todas las demás acciones a velocidad normal.\n\nTurnos de prisa restantes: %s.
actors.buffs.haste.name=prisa
actors.buffs.healing.desc=Un remedio mágico está haciendo que las heridas se cierren y la carne se regenere.\n\nCada turno la salud se regenerará constantemente hasta que expire el efecto curativo. La cantidad de curación puede disminuir con el tiempo.\n\nSiguiente curación: %d.\n\nCuración restante: %d.
actors.buffs.healing.name=cicatrización
actors.buffs.herodisguise.desc=¡La magia ilusoria ha alterado tu apariencia física! El efecto es puramente cosmético, pero se siente muy extraño de todos modos.\n\nTurnos de disfraz restantes: %s.
actors.buffs.herodisguise.name=ocultar
actors.buffs.hex.desc=Magia oscura que debilita la concentración, haciendo que el objetivo esté ligeramente desorientado.\n\nEl maleficio reduce la precisión y la evasión en 20%%, haciendo que el objetivo sea menos efectivo en combate.\n\nTurnos de maleficio restantes: %s.
actors.buffs.hex.heromsg=¡Has sido víctima de un hechizo!
actors.buffs.hex.name=embrujado
actors.buffs.holdfast.desc=El guerrero mantiene su posición, aumentando su armadura en %1$d-%2$d y reduciendo la tasa de desaparición de algunos potenciadores en %3$d%%. Esto durará hasta que se mueva.
actors.buffs.holdfast.name=Agárrate fuerte
actors.buffs.hunger.cursedhorn=El cuerno maldito roba parte de la energía de los alimentos mientras comes.
actors.buffs.hunger.desc=El hambre aumenta lentamente a medida que pasas tiempo en la mazmorra, eventualmente comenzarás a morir de hambre. Mientras mueres de hambre perderás salud lentamente en lugar de regenerarla.\n\n¡El racionamiento es importante! Si tienes salud de sobra, morir de hambre no es una mala idea si eso significa que habrá más comida más tarde. ¡Un racionamiento efectivo puede hacer que la comida dure mucho más!
actors.buffs.hunger.desc_intro_hungry=Puedes sentir que tu estómago te pide comida a gritos, pero aún no es demasiado urgente.
actors.buffs.hunger.desc_intro_starving=Tienes tanta hambre que duele.
actors.buffs.hunger.hungry=hambriento
actors.buffs.hunger.ondeath=Moriste de hambre...
actors.buffs.hunger.onhungry=Tienes hambre.
actors.buffs.hunger.onstarving=¡Te estás muriendo de hambre!
actors.buffs.hunger.rankings_desc=Murió de hambre
actors.buffs.hunger.starving=hambriento
actors.buffs.invisibility.desc=Estás completamente mimetizado con el terreno circundante, lo que te hace imposible de ver.\n\nMientras eres invisible, los enemigos no pueden atacarte ni seguirte. Los ataques físicos y los efectos mágicos (como pergaminos y varitas) cancelarán inmediatamente la invisibilidad.\n\nTurnos de invisibilidad restantes: %s.
actors.buffs.invisibility.name=invisible
actors.buffs.invulnerability.desc=Este personaje está imbuido de un gran poder protector, ¡otorgándole un breve período de invulnerabilidad!\n\nTurnos restantes: %s.
actors.buffs.invulnerability.name=invulnerable
actors.buffs.levitation.desc=Una fuerza mágica te está haciendo levitar sobre el suelo, haciéndote sentir ingrávido.\n\nLos personajes levitantes se mueven silenciosamente e ignoran todos los efectos basados en el suelo. Las trampas no se activarán, el agua no apagará el fuego, las plantas no serán pisoteadas, las raíces no las alcanzarán y los pozos se sobrevolarán. ¡Ten cuidado, ya que todas estas cosas pueden entrar en efecto en el segundo en que termine la levitación!\n\nTurnos de levitación restantes: %s.
actors.buffs.levitation.name=levitando
actors.buffs.lifelink.desc=La fuerza vital de este personaje está vinculada a otro personaje cercano. Cualquier daño recibido se comparte entre ellos.\n\nSiempre que este personaje reciba daño, la mitad se le infligirá al objetivo del vínculo vital en su lugar.\n\nTurnos restantes del vínculo vital: %s.
actors.buffs.lifelink.name=vínculo vital
actors.buffs.lifelink.ondeath=El daño relacionado con la vida te mató...
actors.buffs.light.desc=Incluso en la Mazmorra más Oscura, una luz constante a tu lado siempre es reconfortante.\n\nLa luz ayuda a mantener la oscuridad a raya, permitiéndote ver a una distancia razonable a pesar del entorno.\n\nTurnos de iluminación restantes: %s.
actors.buffs.light.name=iluminado
actors.buffs.lockedfloor.desc=El piso actual está bloqueado y no puedes salir de él. Mientras un piso esté bloqueado, no tendrás hambre ni sufrirás daño por inanición. Además, si no trabajas para derrotar al jefe de este piso, los efectos de regeneración pasiva también se detendrán. Además, si eres revivido por un ankh no bendecido mientras el piso está bloqueado, se reiniciará. Mata al jefe de este piso para romper el bloqueo.
actors.buffs.lockedfloor.name=El piso está cerrado.
actors.buffs.lostinventory.desc=¡Tu inventario se ha perdido en algún lugar de la mazmorra! No podrás recoger ni usar la mayoría de los objetos hasta que lo recuperes.
actors.buffs.lostinventory.name=inventario perdido
actors.buffs.magicalsight.desc=De alguna manera, puedes ver con tu mente, en lugar de con tus ojos.\n\nMientras la visión mágica esté activa, podrás ver a través de todo el terreno en un radio de 12 casillas.\n\nTurnos restantes de visión mágica: %s.
actors.buffs.magicalsight.name=visión mágica
actors.buffs.magicalsleep.desc=Este personaje ha caído en un sueño mágico profundo del que no despertará de forma natural.\n\nEl sueño mágico es similar al sueño normal, excepto que solo el daño hará que el objetivo despierte.\n\nPara el héroe y sus aliados, el sueño mágico tiene algunas propiedades restauradoras, lo que les permite curarse rápidamente mientras descansan.
actors.buffs.magicalsleep.fallasleep=Caes en un sueño profundo y mágico.
actors.buffs.magicalsleep.name=sueño mágico
actors.buffs.magicalsleep.toohealthy=Estás demasiado sano y resistes la tentación de dormir.
actors.buffs.magicalsleep.wakeup=Te despiertas sintiéndote renovado y saludable.
actors.buffs.magicimmune.desc=Todos los efectos mágicos han perdido su poder sobre ti, eres completamente inmune a ellos.\n\nMientras seas inmune a la magia, todos los efectos mágicos dañinos y beneficiosos no se aplicarán a ti, incluyendo maldiciones, encantamientos, varitas, pergaminos, anillos, artefactos, etc. Las habilidades de armadura heroica son lo suficientemente fuertes como para funcionar independientemente de este efecto.\n\nTurnos de inmunidad mágica restantes: %s.
actors.buffs.magicimmune.name=inmune a la magia
actors.buffs.mindvision.desc=De alguna manera, puedes ver a todas las criaturas de este piso a través de tu mente. Es una sensación extraña.\n\nTodos los personajes de este piso son visibles para ti mientras tengas visión mental. Ver a una criatura a través de la visión mental cuenta como si fuera vista o cercana para los propósitos de muchos efectos mágicos.\n\nTurnos de visión mental restantes: %s.
actors.buffs.mindvision.name=visión mental
actors.buffs.momentum.action_name=carrera libre
actors.buffs.momentum.momentum=cobrando impulso
actors.buffs.momentum.momentum_desc=Mientras se mueve, el Corredor Libre acumula impulso, que puede usar para comenzar a correr libremente.\n\nCada carga de impulso otorga dos turnos de carrera libre, y el Corredor Libre puede acumular hasta 10 cargas. El impulso se pierde rápidamente cuando el Corredor Libre deja de moverse.\n\nCarga de impulso actual: %d.
actors.buffs.momentum.resting=recuperante
actors.buffs.momentum.resting_desc=Mientras se mueve, el corredor libre genera impulso, que puede usar para comenzar a correr libremente.\n\nEl corredor libre necesita tiempo para recuperar su resistencia antes de generar impulso nuevamente.\n\nTurnos restantes: %d.
actors.buffs.momentum.running=parkour
actors.buffs.momentum.running_desc=Mientras se mueve, el Freerunner genera impulso, que puede usar para comenzar a correr libremente.\n\nMientras corre libremente, el Freerunner se mueve al doble de velocidad y obtiene evasión adicional según su nivel.\n\nTurnos restantes: %d.
actors.buffs.monkenergy$monkability$dash.desc=Un desplazamiento instantáneo de hasta 4 casillas de distancia. Esta habilidad puede atravesar obstáculos, pero no enemigos ni terreno sólido.
actors.buffs.monkenergy$monkability$dash.empower_desc=Un desplazamiento instantáneo de hasta _8 casillas_ de distancia. Esta habilidad puede atravesar obstáculos, pero no enemigos ni terreno sólido.
actors.buffs.monkenergy$monkability$dash.name=estrellarse
actors.buffs.monkenergy$monkability$dash.prompt=Seleccione una ubicación
actors.buffs.monkenergy$monkability$dragonkick.desc=Una patada devastadora que inflige %1$d-%2$d de daño e ignora la armadura. La patada aleja al objetivo y lo paraliza por cada casilla que recorra.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Una patada devastadora que inflige _%1$d-%2$d de daño_ e ignora la armadura. La patada repele a _todos los objetivos adyacentes_ y los paraliza por cada casilla que recorren.
actors.buffs.monkenergy$monkability$dragonkick.name=patada de dragón
actors.buffs.monkenergy$monkability$flurry.desc=Dos golpes instantáneos que infligen %1$d-%2$d de daño e ignoran la armadura. Esta habilidad no se puede usar repetidamente.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dos golpes instantáneos que infligen %1$d-%2$d de daño, ignoran la armadura y _usan el encantamiento de tu arma._ Esta habilidad no se puede usar repetidamente.
actors.buffs.monkenergy$monkability$flurry.name=ráfaga de golpes
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=La monja está concentrada en su entorno, anticipando el próximo ataque. Mientras está concentrada, tiene la garantía de parar el siguiente ataque.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=enfocado
actors.buffs.monkenergy$monkability$focus.desc=La monja aprovecha para concentrarse, lo que le permite parar el siguiente ataque dirigido contra ella.
actors.buffs.monkenergy$monkability$focus.empower_desc=El monje se concentra al instante, lo que le permite parar el siguiente ataque dirigido contra ella.
actors.buffs.monkenergy$monkability$focus.name=enfocar
actors.buffs.monkenergy$monkability$meditate.desc=La Monja concentra energía en su cuerpo durante 5 turnos. Esto elimina la mayoría de los efectos negativos y le otorga 8 turnos para recargar su varita y artefactos.
actors.buffs.monkenergy$monkability$meditate.empower_desc=La Monja concentra energía en su cuerpo durante 5 turnos. Esto elimina la mayoría de los efectos negativos y le otorga 8 turnos de recarga de varita y artefacto. _Además, obtiene un 80% de resistencia al daño mientras medita y se cura lentamente un 20% de sus puntos de vida perdidos._
actors.buffs.monkenergy$monkability$meditate.name=meditar
actors.buffs.monkenergy.action=Habilidades del monje
actors.buffs.monkenergy.desc=A medida que derrota enemigos, la Monja obtiene energía que puede usar en una variedad de habilidades. La mayoría de los enemigos otorgan 1 de energía al ser derrotados, y la Monja no pierde energía con el tiempo.\n\nEnergía actual: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=El Monje ha usado recientemente una habilidad y debe esperar antes de usar otra.\n\nTiempo de reutilización actual: %d turnos.
actors.buffs.monkenergy.name=energía
actors.buffs.ooze.desc=Este ácido pegajoso se adhiere a la carne, derritiéndola lentamente.\n\nEl lodo causará daños constantes con el tiempo, pero se puede lavar inmediatamente con agua.\n\nTurnos de lodo restantes: %s.
actors.buffs.ooze.heromsg=El fango corrosivo corroe tu carne. ¡Lávate!
actors.buffs.ooze.name=lodo cáustico
actors.buffs.ooze.ondeath=Te desvaneces...
actors.buffs.ooze.rankings_desc=Disuelto
actors.buffs.paralysis.desc=A menudo, lo peor que se puede hacer es no hacer nada en absoluto. La parálisis detiene por completo todas las acciones, obligando al objetivo a esperar hasta que el efecto desaparezca. El dolor de recibir daño puede hacer que los personajes resistan la parálisis, liberándolos del efecto. Turnos de parálisis restantes:
actors.buffs.paralysis.heromsg=¡Estás paralizado!
actors.buffs.paralysis.name=paralizado
actors.buffs.paralysis.out=resistió la parálisis
actors.buffs.physicalempower.desc=Tus golpes se han potenciado, aumentando la cantidad de daño que puedes infligir cuando golpeas a los enemigos con ataques físicos.\n\nDaño adicional: %1$d.\nGolpes restantes: %2$d.
actors.buffs.physicalempower.name=empoderado físicamente
actors.buffs.pincushion.desc=Las armas arrojadizas que has usado contra este personaje están actualmente adheridas a él y caerán al suelo después de que sea derrotado.\n\nLos siguientes elementos están actualmente adheridos:
actors.buffs.pincushion.name=acerico
actors.buffs.poison.desc=El veneno se abre camino a través del cuerpo, deteriorando lentamente su funcionamiento interno.\n\nEl veneno inflige daño cada turno proporcional al tiempo que falta para que expire.\n\nTurnos de veneno restantes: %s.
actors.buffs.poison.heromsg=¡Estás envenenado!
actors.buffs.poison.name=envenenado
actors.buffs.poison.ondeath=Moriste envenenado...
actors.buffs.poison.rankings_desc=Sucumbió al envenenamiento
actors.buffs.preparation.action_name=huelga preparada
actors.buffs.preparation.assassinated=asesinado
actors.buffs.preparation.desc=El asesino espera pacientemente, preparándose para atacar desde las sombras.
actors.buffs.preparation.desc_blink=Es capaz de teletransportarse hacia un enemigo antes de atacarlo, con una distancia máxima de _%d._
actors.buffs.preparation.desc_dmg=Su próximo ataque infligirá _%1$d%% daño adicional_, y ejecutará a los enemigos normales con menos de _%2$d%% salud_, o a los jefes con menos de _%3$d%% salud_.
actors.buffs.preparation.desc_dmg_likely=Es más probable que el ataque cause una mayor cantidad de daño.
actors.buffs.preparation.desc_invis_next=Turnos para un ataque más fuerte: _%d._
actors.buffs.preparation.desc_invis_time=Turnos transcurridos invisible: _%d._
actors.buffs.preparation.name=preparación
actors.buffs.preparation.no_target=No hay nada que atacar allí.
actors.buffs.preparation.out_of_reach=Ese objetivo está fuera de nuestro alcance.
actors.buffs.preparation.prompt=¡Selecciona un objetivo para atacar!\nDistancia máxima de parpadeo: %d
actors.buffs.prismaticguard.desc=Estás siendo protegido por una imagen prismática que actualmente está inactiva. Cuando haya enemigos presentes, la imagen prismática entrará en acción y te protegerá. Mientras esté inactiva, la imagen prismática se recuperará gradualmente de cualquier daño que haya recibido. Puntos de vida actuales:
actors.buffs.prismaticguard.desc_many=Esta imagen prismática también se beneficia del Poder de Muchos. Turnos restantes: %d.
actors.buffs.prismaticguard.name=Guardia prismático
actors.buffs.recharging.desc=La energía fluye a través de ti, mejorando la velocidad de carga de tus varitas y bastones.\n\nCada turno, esta mejora aumentará la carga actual en un cuarto, además de la recarga regular.\n\nTurnos de recarga restantes: %s.
actors.buffs.recharging.name=recargando
actors.buffs.revealedarea.desc=Un área de la mazmorra se ha revelado temporalmente al héroe. La verá sin importar dónde se encuentre.\n\nTurnos restantes: %s.
actors.buffs.revealedarea.name=área revelada
actors.buffs.revealedchar.desc=Este personaje se revela al héroe, será visible sin importar dónde esté.\n\nTurnos restantes: %s.
actors.buffs.revealedchar.name=reveló
actors.buffs.roots.desc=Las raíces (mágicas o naturales) se aferran a los pies, obligándolos a tocar el suelo.\n\nLas raíces inmovilizan a un objetivo, haciendo imposible el movimiento y la mayoría de las habilidades de movimiento. Otras acciones no se ven afectadas, incluidos los efectos de teletransportación.\n\nTurnos de raíz restantes: %s.
actors.buffs.roots.heromsg=¡No puedes moverte!
actors.buffs.roots.name=enraizado
actors.buffs.scrollempower.desc=¡La energía del pergamino que el mago leyó recientemente está potenciando sus varitas!\n\nAumento de nivel: +%1$d.\nZaps restantes: %2$d.
actors.buffs.scrollempower.name=Desplázate para empoderarte
actors.buffs.shadows.desc=Estás fusionado con las sombras que te rodean, lo que te otorga invisibilidad y ralentiza tu metabolismo.\n\nMientras eres invisible, los enemigos no pueden atacarte ni seguirte. La mayoría de los ataques físicos y efectos mágicos (como pergaminos y varitas) cancelarán inmediatamente la invisibilidad. Además, mientras estás fusionado con las sombras, tu ritmo de hambre se ralentiza.\n\nPermanecerás fusionado con las sombras hasta que salgas de ellas o un enemigo entre en contacto contigo.
actors.buffs.shadows.name=fusión de sombras
actors.buffs.slow.desc=La magia de ralentización afecta la velocidad del tiempo del objetivo, para ellos todo se mueve súper rápido.\n\nUn personaje ralentizado realiza todas las acciones en el doble del tiempo que normalmente tardarían.\n\nTurnos de ralentización restantes: %s.
actors.buffs.slow.name=ralentizado
actors.buffs.snipersmark.action_name_snapshot=instantánea
actors.buffs.snipersmark.action_name_sniper=disparo de francotirador
actors.buffs.snipersmark.action_name_volley=voleo
actors.buffs.snipersmark.desc=La francotiradora está enfocada en el objetivo que atacó más recientemente. Puede realizar un ataque especial con su arco que variará según cómo esté aumentado el arco.\n\nUn arco sin aumentar disparará un _disparo instantáneo_, que inflige daño reducido pero no tarda ningún tiempo en dispararse.\n\nUn arco aumentado para velocidad disparará una _ráfaga_ de tres flechas. Cada flecha infligirá daño reducido, pero aún puede activar el encantamiento. Esta ráfaga tarda 1 turno en dispararse.\n\nUn arco aumentado para daño disparará un _disparo de francotirador_. Este disparo tiene garantía de impacto, inflige daño adicional según la distancia al objetivo y tarda 2 turnos en dispararse.\n\nTurnos restantes: %s.
actors.buffs.snipersmark.name=marca del francotirador
actors.buffs.soulmark.desc=El brujo ha accedido al alma de esta criatura, lo que le permite curarla a medida que recibe daño físico.\n\nTurnos restantes de la marca del alma: %s.
actors.buffs.soulmark.name=alma marcada
actors.buffs.stamina.desc=Tienes resistencia ilimitada, ¡lo que permite un movimiento más rápido!\n\nMientras estés bajo los efectos de la resistencia correrás a +50%% velocidad, pero realizarás todas las demás acciones a velocidad normal.\n\nTurnos de resistencia restantes: %s.
actors.buffs.stamina.name=aguante
actors.buffs.terror.desc=El terror es magia manipuladora que fuerza a su objetivo a un pánico incontrolable.\n\nLos personajes aterrorizados se ven obligados a huir de su oponente, tratando de poner tantas puertas y paredes entre ellos como sea posible. Sin embargo, el shock del dolor disminuirá la duración del terror.\n\nTurnos de terror restantes: %s.
actors.buffs.terror.name=aterrorizado
actors.buffs.toxicimbue.desc=¡Estás imbuido de energía venenosa!\n\nA medida que te mueves, un gas tóxico emanará constantemente de ti, dañando a tus enemigos. Eres inmune al gas tóxico y al veneno durante la duración del efecto, así como durante algunos turnos posteriores.\n\nTurnos restantes de imbuición tóxica: %s.
actors.buffs.toxicimbue.name=imbuido de toxicidad
actors.buffs.vertigo.desc=Caminar en línea recta puede ser difícil cuando todo el mundo está girando.\n\nMientras están bajo los efectos del vértigo, los personajes que intenten moverse irán en una dirección aleatoria, en lugar de la que pretendían.\n\nTurnos de vértigo restantes: %s.
actors.buffs.vertigo.name=vértigo
actors.buffs.vulnerable.desc=La magia de vulnerabilidad aumenta todo el daño físico que recibe un personaje en 33%%, después de que ese daño se haya reducido por la armadura.\n\nTurnos de vulnerabilidad restantes: %s.
actors.buffs.vulnerable.heromsg=¡Te sientes frágil!
actors.buffs.vulnerable.name=vulnerable
actors.buffs.wandempower.desc=Tus varitas de daño han sido potenciadas, aumentando la cantidad de daño que infligen durante algunos golpes.\n\nDaño adicional: %1$d.\nGolpes restantes: %2$d.
actors.buffs.wandempower.name=varitas potenciadas
actors.buffs.weakness.desc=De repente, todo parece mucho más pesado.\n\nLa magia debilitadora reduce la fuerza física de un personaje, lo que provoca que inflija 33%% daño reducido.\n\nTurnos de debilidad restantes: %s.
actors.buffs.weakness.heromsg=¡Te sientes débil!
actors.buffs.weakness.name=debilitado
actors.buffs.wellfed.desc=Te sientes bastante satisfecho y lleno.\n\nMientras estés bien alimentado, tu hambre no aumentará y recuperarás una cantidad adicional de salud con el tiempo.\n\nTurnos restantes: %d.
actors.buffs.wellfed.name=bien alimentado
actors.char.def_verb=esquivado
actors.char.def_verb_blocked=obstruido
actors.char.defeat=Derrotaste a %s.
actors.char.immune=inmune
actors.char.invulnerable=invulnerable
actors.char.kill=%s te mató...
actors.hero.abilities.armorability.cost=Coste de la carga: _%d_
actors.hero.abilities.armorability.no_target=¡Ahí no hay nada que atacar!
actors.hero.abilities.armorability.prompt=Elige una ubicación a la que dirigirte.
actors.hero.abilities.armorability.self_target=¡No puedes apuntarte a ti mismo!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Energía radiante emana del cuerpo del Clérigo. Mientras está en esta forma, el Clérigo obtiene 2 de rango de ataque (de la energía sagrada que se proyecta desde él) y 10 de escudo cada vez que gasta una carga de tomo sagrado. También puede lanzar los hechizos que se desbloquean a través de los talentos de la forma ascendida.\n\nEl escudo otorgado por la forma ascendida y sus hechizos no se disipará normalmente, sino que se desvanecerá instantáneamente cuando la forma ascendida termine.\n\nEscudo actual: %1$d.\nTurnos restantes: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=forma ascendida
actors.hero.abilities.cleric.ascendedform.desc=El clérigo proyecta energía sagrada desde sí mismo, asumiendo una forma radiante extendida durante 10 turnos. Mientras está en esta forma, el clérigo puede lanzar nuevos hechizos, gana 2 de alcance de ataque, 30 de escudo, y cualquier hechizo adicional que lance otorgará 10 de escudo por cada carga de tomo sagrado utilizada.\n\nEl escudo de la forma ascendida y sus hechizos no se disipa normalmente, pero se desvanecerá inmediatamente una vez que la forma ascendida termine. La habilidad se puede volver a usar para refrescar la duración de la forma ascendida.
actors.hero.abilities.cleric.ascendedform.name=forma ascendida
actors.hero.abilities.cleric.ascendedform.short_desc=El clérigo adopta una _Forma Ascendida_, obteniendo nuevos hechizos, mayor alcance de ataque y capacidad de protección.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Una copia de uno de los compañeros de aventuras del Clérigo, hecha de luz sólida. Aunque tiene la forma de otro héroe, no posee ninguna de sus habilidades únicas. Este aliado persistirá mientras se le aplique Poder de Muchos.\n\nEste aliado puede ser dirigido sin coste alguno reutilizando la habilidad de armadura Poder de Muchos.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=¡Tu aliado se dispone a atacar!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Tu aliado se mueve a esa posición.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Tu aliado se dispone a seguirte.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Puedes encontrar a este personaje con una habilidad específica de armadura de héroe.
actors.hero.abilities.cleric.powerofmany$lightally.name=aliado de la luz
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Este aliado ha sido potenciado por Poder de Muchos, otorgándole +25%% de daño infligido y -25%% de daño recibido. También compartirá su rango de visión con el Clérigo y puede beneficiarse de los hechizos de poder de muchos.\n\nPoder de Muchos persistirá cuando aliados como imágenes prismáticas se escondan, pero su duración seguirá contando hacia atrás.\n\nTurnos restantes: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=poder de muchos
actors.hero.abilities.cleric.powerofmany.ally_exists=Ya tienes un aliado poderoso.
actors.hero.abilities.cleric.powerofmany.desc=El Clérigo canaliza el _Poder de Muchos_, que potencia a un aliado existente o crea uno nuevo potenciado durante 100 turnos. Seleccionar un espacio vacío crea un nuevo aliado.\n\nMientras está potenciado por el Poder de Muchos, cualquier aliado inflige +25% de daño, recibe -25% de daño y comparte su visión con el Clérigo. También obtienen 25 de escudo cuando se usa la habilidad.\n\nEl Clérigo también obtiene tres nuevos hechizos que solo se pueden lanzar con un aliado potenciado. El Poder de Muchos no terminará mientras uno de estos hechizos esté activo.
actors.hero.abilities.cleric.powerofmany.name=poder de muchos
actors.hero.abilities.cleric.powerofmany.no_vision=No puedes apuntar a una ubicación que no puedes ver.
actors.hero.abilities.cleric.powerofmany.only_allies=Solo puedes empoderar a tus aliados.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Dirige tu luz, aliado
actors.hero.abilities.cleric.powerofmany.prompt_default=Elige un aliado o una ubicación.
actors.hero.abilities.cleric.powerofmany.short_desc=El clérigo canaliza el _Poder de Muchos_, potenciando a un aliado existente o creando uno nuevo.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Asignar a la forma del cuerpo
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Asignar a la forma mental
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Asignar a forma espiritual
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Selecciona un efecto para infundir en Trinity. Se mostrará información adicional antes de la confirmación.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Forma del cuerpo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Forma mental: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Forma espiritual: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Selecciona qué forma de la Trinidad utilizar. Los efectos de las diferentes formas pueden estar activos simultáneamente.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity aplicará el efecto de alquimia remota de este artefacto, a un costo de _%2$s carga._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity aplicará el efecto de regeneración de salud pasiva de este artefacto a _+%1$d_ durante 20 turnos, a costa de _%2$s de carga._
actors.hero.abilities.cleric.trinity.cost=El coste de carga de esta habilidad varía, pero suele ser _%d._
actors.hero.abilities.cleric.trinity.desc=El clérigo obtiene una _Trinidad_ de habilidades de armadura, que se pueden asignar a varios efectos de objetos usando tres nuevos hechizos. Cada uno de estos hechizos se centra en emular los efectos de diferentes tipos de equipo que el clérigo ha identificado durante esta partida: forma corporal (armas y armaduras), forma mental (varitas y armas arrojadizas) y forma espiritual (anillos y artefactos).\n\nCada forma de Trinidad puede imbuirse con un efecto a la vez, y el clérigo elige cuál activar cuando usa Trinidad. Trinidad no duplicará el efecto de algo que ya tengas equipado.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity utilizará el efecto de este artefacto para invocar un espectro amistoso corrupto con los puntos de vida de un fantasma _+%1$d_, a costa de _%2$s carga._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity aplicará este efecto durante _%1$d turnos_ a costa de _%2$s carga._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity aplicará el efecto de lanzamiento en cadena de este artefacto con un alcance de _+%1$d_, a costa de _%2$s de carga._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity aplicará el efecto de refrigerio de este artefacto, a costa de una carga de _%2$s._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity aplicará el efecto de robo de enemigos de este artefacto en _+%1$d_, a costa de _%2$s de carga._
actors.hero.abilities.cleric.trinity.name=trinidad
actors.hero.abilities.cleric.trinity.no_duplicate=¡Trinidad no puede duplicar un efecto que ya tengas equipado!
actors.hero.abilities.cleric.trinity.no_imbue=Actualmente, Trinity no tiene ningún efecto establecido para ninguna de sus formas; ¡usa uno de sus hechizos!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity aplicará este _poderoso_ efecto durante _%1$d turnos_ a costa de _%2$s carga._
actors.hero.abilities.cleric.trinity.ring_use=Trinity aplicará el efecto de este anillo a _+%1$d_ durante 20 turnos, a un coste de _%2$s de carga._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity aplicará el efecto raíz de este artefacto con una semilla dañina aleatoria, a costa de una carga de _%2$s._
actors.hero.abilities.cleric.trinity.short_desc=El clérigo obtiene una _Trinidad_ de habilidades, que emulan el equipo que ha visto y que se pueden asignar mediante el uso de nuevos hechizos.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity aplicará el efecto de inserción de este artefacto, a costa de una carga de _%2$s._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity aplicará el efecto de adivinación de este artefacto en _+%1$d_, a costa de _%2$s de carga._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity lanzará esta arma a _+%1$d_ a costa de _%2$s de carga._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity aplicará el efecto de congelación del tiempo de este artefacto con una duración de _%1$d_ turno, a costa de _%2$s carga._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity aplicará el efecto de pergamino aleatorio de este artefacto con una probabilidad de _%1$d/10_ de ofrecer la versión exótica sin costo adicional, a un costo de _%2$s cargo._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity lanzará esta varita de _multicarga_ a _+%1$d_ a costa de _%2$s de carga._
actors.hero.abilities.cleric.trinity.wand_use=Trinity lanzará un rayo a esta varita a _+%1$d_ a un costo de _%2$s de carga._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Este personaje está participando en un duelo. A él, y a cualquiera de sus aliados o secuaces, se les permite actuar normalmente mientras que los demás están congelados.\n\nEl duelo durará una cantidad de tiempo determinada, hasta que un participante muera o hasta que los participantes se muevan a más de 5 casillas de distancia el uno del otro.\n\nTurnos restantes: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=participante en duelo
actors.hero.abilities.duelist.challenge.ally_target=Solo puedes desafiar a los enemigos.
actors.hero.abilities.duelist.challenge.already_dueling=Solo puedes participar en un duelo a la vez.
actors.hero.abilities.duelist.challenge.desc=La Duelista desafía a un enemigo cercano a un duelo. Ese enemigo se ve obligado a luchar contra ella mientras todos los demás enemigos son congelados temporalmente en el tiempo.\n\nEl objetivo debe ser alcanzable y estar a 5 casillas de la Duelista. El duelo dura hasta que pasen 10 turnos, el enemigo muera o la Duelista esté a más de 5 casillas del enemigo.\n\nLos enemigos congelados son invulnerables. Los aliados de la Duelista no son congelados por esta habilidad, pero si se selecciona a un jefe, sus secuaces tampoco serán congelados.
actors.hero.abilities.duelist.challenge.distant_target=Ese enemigo está demasiado lejos como para desafiarlo.
actors.hero.abilities.duelist.challenge.name=desafío
actors.hero.abilities.duelist.challenge.prompt=Elige un enemigo al que desafiar
actors.hero.abilities.duelist.challenge.short_desc=El Duelista _desafía_ a un enemigo cercano a un duelo, congelando temporalmente a todos los demás enemigos.
actors.hero.abilities.duelist.challenge.unreachable_target=Debes ser capaz de alcanzar tu objetivo.
actors.hero.abilities.duelist.elementalstrike.desc=El Duelista ataca a un enemigo o lugar con un ataque normal que garantiza el impacto y propaga un efecto mágico que se extiende hasta 4 casillas en un cono de 65 grados. Este efecto mágico varía según el encantamiento del arma principal del Duelista.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Un ataque elemental sin encantamiento liberará una pequeña ráfaga de magia, infligiendo entre 6 y 12 puntos de daño a todos los enemigos dentro del alcance.
actors.hero.abilities.duelist.elementalstrike.name=ataque elemental
actors.hero.abilities.duelist.elementalstrike.short_desc=La duelista realiza un _Golpe Elemental_, extendiendo un efecto en un área de efecto cónica basada en el encantamiento de su arma.
actors.hero.abilities.duelist.feint.bad_location=No puedes mudarte a ese lugar.
actors.hero.abilities.duelist.feint.desc=La Duelista simula un ataque mientras se desplaza rápidamente a una casilla adyacente, dejando tras de sí una imagen residual momentánea de sí misma. Los enemigos que atacaban a la Duelista atacarán en su lugar su imagen residual. Los enemigos que atacan la imagen residual se confunden, lo que cancela su siguiente acción y los deja vulnerables a un ataque sorpresa.
actors.hero.abilities.duelist.feint.name=finta
actors.hero.abilities.duelist.feint.prompt=Elige un lugar al que correr.
actors.hero.abilities.duelist.feint.short_desc=La duelista _finge_, simulando un ataque mientras se desplaza rápidamente a una casilla adyacente. Los enemigos atacarán su imagen residual, quedando expuestos a un contraataque.
actors.hero.abilities.duelist.feint.too_far=Esa ubicación no está cerca de usted.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=La Cazadora se potencia brevemente, aumentando su velocidad de movimiento y velocidad de ataque con su arco.\n\nTurnos restantes: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=el poder de la naturaleza
actors.hero.abilities.huntress.naturespower.desc=La Cazadora se potencia temporalmente a sí misma y a su arco con el poder de la naturaleza. Esto dura 8 turnos. Durante este tiempo, la Cazadora se mueve al doble de velocidad y ataca un 33 % más rápido con su arco. Los efectos adicionales del arco no se activan si la Francotiradora está usando sus ataques especiales.
actors.hero.abilities.huntress.naturespower.name=el poder de la naturaleza
actors.hero.abilities.huntress.naturespower.short_desc=La Cazadora invoca el Poder de la Naturaleza, aumentando su velocidad de movimiento y la cadencia de disparo de su arco durante un breve periodo de tiempo.
actors.hero.abilities.huntress.spectralblades.desc=La Cazadora lanza una hoja espectral contra un enemigo, que actúa como un ataque a distancia de su arma cuerpo a cuerpo. Se activarán todos los efectos normales de un arma cuerpo a cuerpo, incluidos los encantamientos.
actors.hero.abilities.huntress.spectralblades.name=hojas espectrales
actors.hero.abilities.huntress.spectralblades.short_desc=La Cazadora lanza _Espadas Espectrales_ a un objetivo, infligiendo daño dependiendo del arma cuerpo a cuerpo que tenga equipada en ese momento.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Un halcón mágico, invocado por la Cazadora. Brilla con un azul etéreo intenso, su cabeza se mueve constantemente mientras inspecciona el área. Aunque no es un gran luchador, su velocidad y visión lo hacen excelente para explorar y distraer enemigos.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Esquivas garantizadas restantes: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turnos restantes: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=¡Tu halcón se dispone a atacar!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Tu halcón se mueve a esa posición.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Tu halcón se mueve para seguirte.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Puedes encontrar a este personaje con una habilidad específica de armadura de héroe.
actors.hero.abilities.huntress.spirithawk$hawkally.name=halcón espiritual
actors.hero.abilities.huntress.spirithawk.desc=La Cazadora invoca un espíritu halcón familiar, que puede ser dirigido usando la habilidad nuevamente mientras está invocado. El halcón dura 100 turnos, dirigir al halcón no cuesta ninguna carga.\n\nEl halcón tiene salud y poder de ataque mínimos, pero es rápido, evasivo y preciso. Comparte todo su campo de visión con la Cazadora en todo momento. Es inmune a todos los efectos de área, como fuego y gas venenoso. No atacará a menos que se le ordene específicamente.
actors.hero.abilities.huntress.spirithawk.name=halcón espiritual
actors.hero.abilities.huntress.spirithawk.no_space=No hay espacio libre cerca de ti.
actors.hero.abilities.huntress.spirithawk.short_desc=La Cazadora invoca a un familiar, un Halcón Espiritual, que puede ayudarla a explorar lugares y distraer a los enemigos.
actors.hero.abilities.mage.elementalblast.desc=El mago emite una ráfaga mágica que cubre una región circular de hasta 4 casillas de distancia e inflige entre 15 y 25 puntos de daño. El efecto específico de la ráfaga elemental variará según la varita imbuida en el báculo del mago.
actors.hero.abilities.mage.elementalblast.generic_desc=El efecto de la explosión elemental será similar al efecto de la varita cuando se lanza contra un enemigo o un aliado.
actors.hero.abilities.mage.elementalblast.name=explosión elemental
actors.hero.abilities.mage.elementalblast.no_staff=No puedes usar esta habilidad sin tu bastón.
actors.hero.abilities.mage.elementalblast.short_desc=El mago emite una _explosión elemental_ desde su báculo, cubriendo una gran área a su alrededor con un efecto que varía según la varita que tenga en su báculo.
actors.hero.abilities.mage.warpbeacon.depths=¡No puedes teletransportarte entre profundidades!
actors.hero.abilities.mage.warpbeacon.desc=El mago coloca una baliza, a la que luego puede teletransportarse a voluntad. Colocar la baliza toma 1 turno, pero teletransportarse a ella es instantáneo.\n\nEl mago no puede teletransportarse entre pisos por defecto, ni usar la baliza para llegar a lugares inaccesibles como habitaciones cerradas. El mago puede teletransportarse hacia los enemigos, lo que los empujará a un lado.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=¡No puedes colocar una baliza allí!
actors.hero.abilities.mage.warpbeacon.locked_floor=¡No puedes abandonar un piso cerrado con llave!
actors.hero.abilities.mage.warpbeacon.name=baliza de teletransporte
actors.hero.abilities.mage.warpbeacon.short_desc=El mago coloca una _Baliza de Teletransporte_ en su ubicación actual, a la que puede teletransportarse instantáneamente.
actors.hero.abilities.mage.warpbeacon.too_far=¡Ese lugar está demasiado lejos!
actors.hero.abilities.mage.warpbeacon.window_cancel=Cancelar
actors.hero.abilities.mage.warpbeacon.window_clear=baliza clara
actors.hero.abilities.mage.warpbeacon.window_desc=Su baliza se encuentra actualmente en el piso %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teletransportarse a la baliza
actors.hero.abilities.mage.wildmagic.desc=El mago libera el poder de sus varitas, disparándolas aleatoriamente hasta 4 veces en un solo turno. El bastón del mago no está incluido en este efecto.\n\nCada varita también ve su nivel aumentado en 2, hasta +3. Esta habilidad usa media carga de varita por cada descarga, y ninguna varita puede ser disparada más de 2 veces.
actors.hero.abilities.mage.wildmagic.name=magia salvaje
actors.hero.abilities.mage.wildmagic.no_wands=¡No tienes varitas para lanzar rayos!
actors.hero.abilities.mage.wildmagic.short_desc=El mago desata la _Magia Salvaje_ contenida en sus varitas, disparándolas aleatoriamente varias veces contra un objetivo elegido durante un solo turno.
actors.hero.abilities.ratmogrify$transmograt.desc=Este enemigo se ha transformado en una rata. ¡Una gran mejora, si me preguntan! - Rey Rata
actors.hero.abilities.ratmogrify$transmograt.name=%s modificado
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Asesinado por: enemigo transformado en rata
actors.hero.abilities.ratmogrify.cant_transform=¡No puedes convertir eso en rata!
actors.hero.abilities.ratmogrify.desc=¡El héroe transforma a un enemigo en una rata durante 6 turnos! Los jefes, aliados y ratas no pueden ser transformados en ratas. Los enemigos transformados en ratas conservan sus estadísticas originales, pero no tienen ninguna habilidad.
actors.hero.abilities.ratmogrify.name=ratmogrificar
actors.hero.abilities.ratmogrify.short_desc=¡El héroe _transforma_ a un enemigo en rata! Esto lo convierte temporalmente en una rata sin habilidades.
actors.hero.abilities.ratmogrify.too_strong=¡Ese enemigo es demasiado fuerte para convertirlo en rata!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Este enemigo ha sido marcado, lo que provoca que reciba 25%% de daño adicional, pero también lo vuelve incapaz de morir hasta que termine la marca.\n\nTurnos restantes: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=Condenada a muerte
actors.hero.abilities.rogue.deathmark.ally_target=Solo puedes marcar enemigos
actors.hero.abilities.rogue.deathmark.desc=El Pícaro coloca una marca sobre un enemigo elegido, lo que provoca que reciba un 25 % de daño adicional. La marca se aplica instantáneamente y dura 5 turnos. Los enemigos marcados reciben daño adicional, pero no pueden morir hasta que la marca expire. Si un enemigo tiene 0 PV cuando la marca termina, morirá inmediatamente.
actors.hero.abilities.rogue.deathmark.name=marca de la muerte
actors.hero.abilities.rogue.deathmark.short_desc=El Pícaro coloca una _Marca de Muerte_ sobre un enemigo elegido. Los enemigos marcados reciben daño adicional, pero no pueden morir hasta que la marca desaparezca.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Una copia del Pícaro, hecha de oscuridad sombría. Permanece inmóvil, con ojos vacíos y diminutas volutas de oscuridad que se elevan de él como vapor.\n\nEl clon no es una copia perfecta del Pícaro, pero sigue siendo un luchador decente y puede beneficiarse del equipo del Pícaro con los talentos adecuados.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=¡Tu clon se mueve para atacar!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Tu clon se mueve a esa posición.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Tu clon se mueve para seguirte.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Puedes encontrar a este personaje con una habilidad específica de armadura de héroe.
actors.hero.abilities.rogue.shadowclone$shadowally.name=pícaro de las sombras
actors.hero.abilities.rogue.shadowclone.desc=El Pícaro invoca un mímico sombrío de sí mismo, al que puede dirigir para que lo ayude en combate. Dirigir al clon de sombra no cuesta energía. El clon tiene 80 PV, no tiene armadura y causa 10-20 de daño. Todas estas características se pueden mejorar con talentos, de modo que el clon se beneficie de las armas y armaduras del héroe.
actors.hero.abilities.rogue.shadowclone.name=clon de sombra
actors.hero.abilities.rogue.shadowclone.short_desc=El Pícaro invoca un _Clon de Sombra_, al que puede dirigir para que le ayude en combate.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=De alguna manera, los enemigos se convencen fácilmente de que este señuelo de madera es el verdadero Rogue.
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Puedes encontrar a este personaje con una habilidad específica de armadura de héroe.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=señuelo de madera
actors.hero.abilities.rogue.smokebomb.desc=El Pícaro lanza una bomba de humo y se teletransporta hasta 6 casillas de distancia. Puede teletransportarse a través de peligros y enemigos, pero no a través de terreno sólido como paredes. Los enemigos que estén adyacentes a la posición anterior del Pícaro quedarán cegados durante 5 turnos.
actors.hero.abilities.rogue.smokebomb.fov=Solo puedes saltar a una ubicación vacía dentro de tu campo de visión.
actors.hero.abilities.rogue.smokebomb.name=bomba de humo
actors.hero.abilities.rogue.smokebomb.prompt=Elige una ubicación a la que saltar.
actors.hero.abilities.rogue.smokebomb.short_desc=El Pícaro lanza una bomba de humo mientras se teletransporta. Ciega a los enemigos que se encuentren cerca de su antigua ubicación.
actors.hero.abilities.warrior.endure$enduretracker.desc=El guerrero ahora inflige daño adicional en función del daño que ha sufrido.\n\nDaño adicional: %1$d\nGolpes restantes: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=resistencia
actors.hero.abilities.warrior.endure.desc=El guerrero resiste durante 3 turnos, recibiendo la mitad del daño de todas las fuentes. Esta reducción se aplica antes de los efectos de resistencia al daño como la armadura.\n\nDespués de resistir, el siguiente golpe del guerrero dentro de 10 turnos obtiene daño adicional. ¡Este daño adicional es igual a la mitad de todo el daño infligido en él mientras resiste, antes de cualquier efecto de reducción de daño!\n\nSi el guerrero tiene algún combo, usar esta habilidad aumenta su tiempo restante en 3 turnos.
actors.hero.abilities.warrior.endure.name=perdurar
actors.hero.abilities.warrior.endure.short_desc=El guerrero _Resiste_, saltándose varios turnos pero obteniendo una alta resistencia al daño. Luego inflige daño adicional en función de lo que haya resistido.
actors.hero.abilities.warrior.heroicleap.desc=El guerrero salta hacia el lugar objetivo, pasando por encima de cualquier enemigo o obstáculo que se interponga en su camino. Sin embargo, no puede saltar muros ni otros terrenos sólidos.
actors.hero.abilities.warrior.heroicleap.name=salto heroico
actors.hero.abilities.warrior.heroicleap.prompt=Elige la dirección para saltar
actors.hero.abilities.warrior.heroicleap.short_desc=El guerrero realiza un _Salto Heroico_ hacia una ubicación específica, elevándose por encima de enemigos y peligros.
actors.hero.abilities.warrior.shockwave.desc=El Guerrero golpea el suelo, produciendo una onda expansiva que viaja hasta 5 casillas en un cono de 60 grados. Los enemigos atrapados en esta onda expansiva quedan incapacitados durante 5 turnos. También reciben 5-10 puntos de daño, más 1-2 puntos de daño adicionales por cada punto de fuerza que el Guerrero tenga por encima de 10.
actors.hero.abilities.warrior.shockwave.name=onda de choque
actors.hero.abilities.warrior.shockwave.short_desc=El guerrero libera una onda expansiva en un área de efecto cónica al golpear el suelo. Los enemigos atrapados en la onda expansiva resultan dañados y quedan incapacitados.
actors.hero.hero.key_distracted=No consigues abrir la cerradura, tendrás que seguir intentándolo.
actors.hero.hero.leave=¡Aún no puedes irte, el resto de la mazmorra te espera abajo!
actors.hero.hero.level_cap=¡No puedes volverte más fuerte, pero tus experiencias sí te dan un impulso de poder!
actors.hero.hero.level_up=¡Elevar a mismo nivel!
actors.hero.hero.locked_chest=Este cofre está cerrado con llave y no tienes la llave correspondiente.
actors.hero.hero.locked_door=No tienes una clave que coincida.
actors.hero.hero.name=tú
actors.hero.hero.new_level=¡Sube de nivel! +Precisión, +Evasión, +5 PV.
actors.hero.hero.new_talent=¡+1 punto de talento!
actors.hero.hero.noticed_smth=Has notado algo.
actors.hero.hero.pain_resist=El dolor te ayuda a resistir las ganas de dormir.
actors.hero.hero.revive=¡El ankh explota con energía vital!
actors.hero.hero.search=buscar
actors.hero.hero.search_distracted=Es difícil concentrarse, la búsqueda es agotadora.
actors.hero.hero.unspent=¡Tienes puntos de talento sin usar!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=No puedes llevar: %s.
actors.hero.hero.you_now_have=Usted recogió: %s.
actors.hero.heroclass.cleric=clérigo
actors.hero.heroclass.cleric_desc=El clérigo comienza con un _tomo sagrado único_, que puede usar para lanzar varios hechizos.\n\nLa mayoría de los talentos del clérigo se centran en aprender o mejorar hechizos.\n\nEl clérigo también comienza con _un garrote_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nEl clérigo identifica automáticamente:\n_-_ Pergaminos de Identificación\n_-_ Pociones de Pureza\n_-_ Pergaminos de Eliminar Maldición
actors.hero.heroclass.cleric_desc_short=El clérigo es un hechicero divino que utiliza su singular _tomo sagrado_ para canalizar magia divina. Puede _aprender y mejorar hechizos_ mediante talentos.
actors.hero.heroclass.cleric_unlock=Para desbloquear al Clérigo, _limpia completamente la maldición de cualquier pieza de equipo maldito._
actors.hero.heroclass.duelist=duelista
actors.hero.heroclass.duelist_desc=El Duelista comienza con un estoque único con una habilidad especial que se recarga con el tiempo. Cada arma del juego tiene una habilidad especial diferente que el Duelista puede usar. El Duelista también comienza con dos púas arrojadizas, armadura de tela, un odre de agua y una bolsa de terciopelo. El Duelista identifica automáticamente: Pergaminos de Identificación, Pociones de Fuerza, Pergaminos de Imagen Espejo.
actors.hero.heroclass.duelist_desc_short=La Duelista es una maestra de armas que puede usar su arma para activar una _habilidad especial de arma_. Esta habilidad especial es _diferente para cada arma._
actors.hero.heroclass.duelist_unlock=Para desbloquear al Duelista, _equipa un arma de nivel 2 o superior sin penalización de fuerza._
actors.hero.heroclass.huntress=cazadora
actors.hero.heroclass.huntress_desc=La Cazadora comienza con un _arco espiritual único_, que puede disparar un número infinito de flechas conjuradas.\n\nLa Cazadora puede viajar a través de la hierba alta _sin pisotearla_.\n\nLa Cazadora también comienza con _guantes con tachuelas_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nLa Cazadora identifica automáticamente:\n_-_ Pergaminos de Identificación\n_-_ Pociones de Visión Mental\n_-_ Pergaminos de Canción de Cuna
actors.hero.heroclass.huntress_desc_short=La Cazadora es una maestra en el manejo de armas arrojadizas y posee un arco mágico con flechas infinitas. Además, puede atravesar la hierba alta sin pisotearla.
actors.hero.heroclass.huntress_unlock=Para desbloquear a la Cazadora, _golpea a los enemigos con armas arrojadizas 10 veces en una partida._
actors.hero.heroclass.mage=mago
actors.hero.heroclass.mage_desc=El mago comienza con un bastón único, que se recarga significativamente más rápido que una varita y tiene 1 carga más. El bastón puede imbuirse con cualquier varita que el mago encuentre en la mazmorra. El mago también comienza con una varita de proyectil mágico imbuida en su bastón, armadura de tela, un odre de agua y una bolsa de terciopelo. El mago identifica automáticamente: Pergaminos de Identificación, Pociones de Llama Líquida, Pergaminos de Mejora.
actors.hero.heroclass.mage_desc_short=El mago es un experto en magia arcana y porta un bastón mágico más poderoso que una varita. El bastón puede imbuirse con cualquier varita que el mago encuentre.
actors.hero.heroclass.mage_unlock=Para desbloquear al Mago, _usa un pergamino de mejora para hacer que un objeto sea más fuerte._
actors.hero.heroclass.rogue=pícaro
actors.hero.heroclass.rogue_desc=El Pícaro comienza con una _capa de sombras única_, que puede usar para volverse invisible a voluntad.\n\nEl Pícaro puede _detectar secretos y trampas_ desde una mayor distancia.\n\nEl Pícaro también comienza con _una daga_, _tres cuchillos arrojadizos_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nEl Pícaro identifica automáticamente:\n_-_ Pergaminos de Identificación\n_-_ Pociones de Invisibilidad\n_-_ Pergaminos de Mapeo Mágico
actors.hero.heroclass.rogue_desc_short=El Pícaro puede evadir enemigos y atacar desde la invisibilidad usando su _capa de sombras_. También _detecta secretos y trampas_ desde una mayor distancia.
actors.hero.heroclass.rogue_unlock=Para desbloquear al Pícaro, _realiza 10 ataques sorpresa en una partida._
actors.hero.heroclass.warrior=guerrero
actors.hero.heroclass.warrior_desc=El Guerrero comienza con un _sello roto único_ que le otorga una ráfaga de escudo cuando su salud está por debajo de la mitad. El sello se puede mover entre armaduras y puede _transferir una sola mejora_ con él.\n\nEl Guerrero también comienza con una _espada corta desgastada_, _tres piedras arrojadizas_, armadura de tela, un odre de agua y una bolsa de terciopelo.\n\nEl Guerrero identifica automáticamente:\n_-_ Pergaminos de Identificación\n_-_ Pociones de Curación\n_-_ Pergaminos de Furia
actors.hero.heroclass.warrior_desc_short=El guerrero soporta daño adicional gracias al escudo que le otorga su sello roto. El sello se puede transferir entre armaduras y transfiere una única mejora.
actors.hero.heroclass.warrior_unlock=El guerrero se desbloquea automáticamente.
actors.hero.herosubclass.assassin=asesino
actors.hero.herosubclass.assassin_desc=El Asesino prepara su siguiente ataque cuando se vuelve invisible. Cuanto más tiempo se prepare, más poderoso será su siguiente ataque. La preparación se acumula hasta por 9 turnos.\n\nDespués de prepararse, el Asesino inflige daño adicional en su siguiente ataque, puede teletransportarse a su objetivo e incluso puede matar instantáneamente a los enemigos que sean lo suficientemente débiles.
actors.hero.herosubclass.assassin_short_desc=El Asesino puede preparar un ataque letal mientras es invisible. Cuanto más espere, más poderoso será el ataque.
actors.hero.herosubclass.battlemage=mago de batalla
actors.hero.herosubclass.battlemage_desc=El Mago de Batalla obtiene un efecto adicional al atacar cuerpo a cuerpo con su bastón, como si este tuviera un encantamiento extra. Estos efectos dependen de la varita con la que esté imbuido su bastón; cada varita tiene su propio efecto. Además de los efectos de la varita, el bastón del Mago de Batalla también recupera 0,5 cargas al atacar con él.
actors.hero.herosubclass.battlemage_short_desc=El _Mago de Batalla_ conjura efectos adicionales al luchar cuerpo a cuerpo con su bastón. Estos efectos dependen de la varita con la que esté imbuido su bastón.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=El Berserker gana furia al recibir daño físico, ¡incluido el daño que bloquea su armadura! La furia se desvanece gradualmente con el tiempo, pero se desvanece más lentamente si tiene poca salud. La furia puede hacer que el Berserker inflija hasta un +50% de daño. Con la furia máxima, puede entrar en estado de furia, obteniendo una explosión de escudo y manteniendo su furia mientras tenga escudo restante. El escudo escala con el nivel de la armadura del Berserker y puede aumentar enormemente si tiene poca salud. El Berserker necesita tiempo para recuperarse después de entrar en estado de furia.
actors.hero.herosubclass.berserker_short_desc=El Berserker acumula furia al recibir daño. La furia aumenta su daño y puede activarse al 100% para obtener un escudo adicional.
actors.hero.herosubclass.champion=campeón
actors.hero.herosubclass.champion_desc=La Campeona es una maestra de las armas cuerpo a cuerpo que puede equipar un arma secundaria además de su arma principal. Sus ataques regulares usan su arma principal, pero puede cambiar su arma principal instantáneamente y usar la habilidad de cualquiera de las dos armas.\n\nTambién obtiene 2 cargas máximas de habilidad de arma adicionales y +50% de velocidad de recarga de habilidad de arma.
actors.hero.herosubclass.champion_short_desc=La _Campeona_ puede empuñar dos armas y obtiene más cargas de arma. Sus ataques normales usan su arma principal, pero puede cambiar de arma y usar la habilidad de cualquiera de ellas.
actors.hero.herosubclass.freerunner=corredor libre
actors.hero.herosubclass.freerunner_desc=Mientras el Corredor Libre se mueve, acumula impulso. Puede ganar hasta 10 de impulso después de correr durante 10 turnos, pero lo pierde rápidamente si deja de moverse. El Corredor Libre puede usar su impulso para comenzar a correr libremente, durante 2 turnos por punto de impulso.\n\nCuando corre libremente, el Corredor Libre se mueve a 2x de velocidad y obtiene evasión adicional en proporción a su nivel. Una vez que termina el correr libremente, hay un tiempo de espera antes de que se pueda acumular impulso nuevamente.
actors.hero.herosubclass.freerunner_short_desc=El _Freerunner_ gana impulso al correr, lo que le permite iniciar el parkour. Esto le otorga velocidad y evasión adicionales durante un breve periodo.
actors.hero.herosubclass.gladiator=gladiador
actors.hero.herosubclass.gladiator_desc=El Gladiador acumula un punto de combo cada vez que realiza un ataque exitoso con un arma cuerpo a cuerpo o arrojadiza. Si el Gladiador no realiza un ataque exitoso dentro de 5 turnos (15 turnos después de una muerte), su combo se reinicia.\n\nA medida que acumula combo, el Gladiador puede usar una variedad de habilidades que garantizan un impacto:\n2 Combo: empuja al enemigo hacia atrás, conserva el combo\n4 Combo: inflige daño basado en la armadura\n6 Combo: para, conserva el combo\n8 Combo: daña al objetivo y a los enemigos cercanos\n10 Combo: ataca una vez por cada combo
actors.hero.herosubclass.gladiator_short_desc=El _Gladiador_ acumula combos al realizar ataques exitosos. Puede gastar combos para usar habilidades únicas.
actors.hero.herosubclass.monk=monje
actors.hero.herosubclass.monk_desc=La Monja es una maestra de la técnica física. Al derrotar enemigos, obtiene energía que puede usar en diversas habilidades defensivas y de utilidad. Esta energía no se desvanece con el tiempo, pero tiene un límite basado en el nivel de la Monja.\n\n1 Energía: golpear rápidamente con los puños\n2 Energía: concentrarse para esquivar el siguiente ataque\n3 Energía: correr instantáneamente cerca\n4 Energía: patear a un enemigo lejos\n5 Energía: meditar para eliminar estados alterados y restaurar la carga de la varita y el artefacto
actors.hero.herosubclass.monk_short_desc=El _Monje_ acumula energía mientras lucha. Esta energía puede utilizarse para desarrollar diversas habilidades únicas.
actors.hero.herosubclass.paladin=paladín
actors.hero.herosubclass.paladin_desc=El Paladín obtiene una variedad de hechizos nuevos y mejorados que enfatizan el combate cuerpo a cuerpo y la sinergia con armas y armaduras.\n\nLos hechizos _Arma Sagrada_ y _Protección Sagrada_ del Paladín otorgan mayores bonificaciones, ya no anulan los encantamientos y glifos existentes, y pueden extenderse lanzando otros hechizos.\n\nEl Paladín también obtiene el hechizo _Castigo_, que le permite realizar un golpe cuerpo a cuerpo garantizado con daño adicional y poder de encantamiento.
actors.hero.herosubclass.paladin_short_desc=El _Paladín_ obtiene nuevos hechizos de corto alcance y versiones potenciadas de arma sagrada y protección.
actors.hero.herosubclass.priest=sacerdote
actors.hero.herosubclass.priest_desc=El Sacerdote obtiene una variedad de hechizos nuevos y mejorados que enfatizan el combate a distancia y la sinergia con objetos mágicos.\n\nEl Sacerdote puede lanzar _Luz Guía_ gratis una vez cada 50 turnos, ilumina a los enemigos directamente apuntados por cualquiera de sus hechizos, y puede consumir el perjuicio de iluminación con aliados, varitas y algunos artefactos para obtener daño adicional igual a su nivel + 5.\n\nEl Sacerdote también obtiene el hechizo _Resplandor_, que disipa la oscuridad y afecta a todos los enemigos visibles, activando y aplicando iluminación y aturdiéndolos brevemente a costa de 2 cargas.
actors.hero.herosubclass.priest_short_desc=El _Sacerdote_ obtiene nuevos hechizos de largo alcance y una versión potenciada de la luz guía.
actors.hero.herosubclass.sniper=francotirador
actors.hero.herosubclass.sniper_desc=La Francotiradora es una maestra del combate a distancia, cuyos ataques a distancia perforan la armadura enemiga. Cuando ataca a un enemigo con un arma arrojadiza, coloca una marca de francotiradora sobre él, lo que le permite continuar con un ataque especial con su arco. Este ataque especial varía según cómo esté aumentado su arco.\n\nUn arco sin aumentar disparará un disparo instantáneo que inflige daño reducido pero dispara al instante. Un arco de velocidad disparará una andanada de tres flechas que infligen daño reducido, aún pueden activar encantamientos y tardan 1 turno en disparar. Un arco de daño disparará un disparo de francotirador que tiene un impacto garantizado, inflige daño adicional según la distancia y tarda 2 turnos en disparar.
actors.hero.herosubclass.sniper_short_desc=La _Francotiradora_ puede perforar la armadura con sus ataques a distancia. Tras golpear con un arma arrojadiza, puede rematar con un ataque especial con su arco.
actors.hero.herosubclass.warden=guardián
actors.hero.herosubclass.warden_desc=La Guardiana tiene una fuerte conexión con la naturaleza que le otorga una variedad de efectos adicionales relacionados con la hierba y las plantas. Puede ver a través de la hierba alta y surcada como si fuera espacio vacío. La Guardiana hace que la hierba brote alrededor de cualquier semilla que arroje o plante, y obtiene efectos especiales al pisotear plantas. Estos efectos especiales reemplazan los efectos regulares de las plantas, lo que significa que ninguna planta es dañina para ella al pisarla.
actors.hero.herosubclass.warden_short_desc=La _Guardián_ puede ver a través de la hierba alta y obtiene efectos adicionales cuando planta semillas y pisotea plantas.
actors.hero.herosubclass.warlock=brujo
actors.hero.herosubclass.warlock_desc=El Brujo tiene la posibilidad de infligir una marca de alma a los personajes cuando usa varitas sobre ellos. La probabilidad de aplicar una marca de alma y su duración aumentan con el nivel de la varita.\n\nCuando un enemigo tiene una marca de alma, el Brujo curará 2 puntos de vida por cada 5 puntos de daño que le inflija, ¡pero solo con ataques de armas cuerpo a cuerpo o arrojadizas, no con varitas!
actors.hero.herosubclass.warlock_short_desc=El Brujo tiene la posibilidad de marcar el alma de los enemigos con sus varitas. Se curará cada vez que inflija daño físico a los enemigos marcados.
actors.hero.spells.auraofprotection$aurabuff.desc=El Paladín está irradiando energía protectora a su alrededor.\n\nCualquier aliado cercano (incluido el propio Paladín) recibe daño reducido y obtiene el efecto del glifo de armadura del Paladín con poder aumentado.\n\nTurnos restantes: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura de protección
actors.hero.spells.auraofprotection.desc=El Paladín comienza a irradiar energía protectora en un aura brillante a su alrededor durante 20 turnos. Cualquier aliado dentro de 2 casillas del Paladín (incluido él mismo) recibe %1$d%% menos daño y obtiene el efecto del glifo de armadura del Paladín con +%2$d%% poder.\n\nEsta reducción de daño tiene lugar antes que otros efectos de reducción de daño (p. ej., armadura). El aumento de poder del glifo siempre se aplicará, pero este hechizo no puede hacer que el glifo del Paladín se aplique más de una vez si un personaje ya se está beneficiando de él (p. ej., el propio Paladín o una imagen prismática).
actors.hero.spells.auraofprotection.name=aura de protección
actors.hero.spells.auraofprotection.short_desc=Aumenta la defensa del Paladín y de los aliados cercanos.
actors.hero.spells.beamingray$beamingrayboost.desc=Este aliado fue teletransportado recientemente por Rayo Radiante, lo que le otorga daño adicional contra el enemigo más cercano después de la teletransportación. Poder de Muchos tampoco expirará mientras este beneficio esté activo.\n\nTurnos restantes: %s.
actors.hero.spells.beamingray$beamingrayboost.name=rayo radiante
actors.hero.spells.beamingray.desc=El clérigo canaliza el poder de su aliado en un rayo de luz que lo dirige a una ubicación. Si el rayo choca con un enemigo, colocará al aliado cerca y lo dirigirá hacia el enemigo. El rayo tiene un alcance máximo de casillas y aumentará el daño adicional de Poder de Muchos a +%2$d%% durante 10 turnos contra el enemigo más cercano dentro de 4 casillas. El rayo emisor puede incluso teletransportar aliados normalmente inmóviles, pero su alcance se reduce a la mitad en estos casos.
actors.hero.spells.beamingray.name=rayo radiante
actors.hero.spells.beamingray.no_space=No hay espacio para que aparezca tu aliado allí.
actors.hero.spells.beamingray.out_of_range=Esa ubicación está fuera de alcance.
actors.hero.spells.beamingray.short_desc=Teletransporta a tu aliado y le otorga daño adicional.
actors.hero.spells.blessspell.desc=El clérigo coloca una bendición sagrada sobre sí mismo o sobre otro personaje que pueda ver.\n\nCuando se lanza sobre sí mismo, el efecto es más débil, otorgando %1$d turnos de bendición y %2$d barrera.\n\nCuando se lanza sobre otros personajes, el hechizo es más poderoso, otorgando %3$d turnos de bendición y %4$d curación. El exceso de curación se convierte en barrera.
actors.hero.spells.blessspell.name=bendecir
actors.hero.spells.blessspell.short_desc=Bendice y protege al clérigo, bendice y sana a los demás.
actors.hero.spells.bodyform$bodyformbuff.desc=La forma corporal de Trinity actualmente te otorga el poder de un encantamiento o glifo, como si lo tuvieras equipado en tu arma o armadura actual.\n\nTen en cuenta que la forma corporal no puede proporcionar otra copia de un efecto del que ya te estás beneficiando.\n\nEfecto actual: %1$s.\n\nTurnos restantes: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=forma del cuerpo
actors.hero.spells.bodyform.desc=El clérigo elige un encantamiento o glifo que haya identificado en esta partida e imbuye a Trinity con su efecto.\n\nCuando se usa Trinity, el clérigo obtiene el efecto del encantamiento o glifo elegido durante %d turnos. Este encantamiento o glifo temporal funcionará con cualquier efecto que tendría un encantamiento o glifo normal.\n\nEste hechizo reemplaza cualquier otro efecto corporal con el que Trinity esté imbuido actualmente.
actors.hero.spells.bodyform.name=forma del cuerpo
actors.hero.spells.bodyform.short_desc=Asigna Trinidad a un encantamiento o glifo.
actors.hero.spells.cleanse.desc=El clérigo elimina todos los efectos de estado dañinos sobre sí mismo y los aliados visibles. Después de que el hechizo termine, todos los personajes afectados también obtienen %1$d turnos de inmunidad a desventajas y %2$d barrera.
actors.hero.spells.cleanse.name=limpiar
actors.hero.spells.cleanse.short_desc=Elimina efectos negativos y otorga protección.
actors.hero.spells.clericspell.charge_cost=Coste de la carga: %d
actors.hero.spells.clericspell.invalid_enemy=No puedes atacar a ese enemigo.
actors.hero.spells.clericspell.invalid_target=No puedes seleccionar esa ubicación.
actors.hero.spells.clericspell.no_target=Allí no hay ningún objetivo.
actors.hero.spells.clericspell.prompt=Elige un objetivo
actors.hero.spells.divineintervention.desc=El clérigo vierte una tremenda cantidad de poder de su tomo en sí mismo y en sus aliados, aumentando a todos a %1$d escudo y extendiendo la Forma Ascendida por %2$d turnos. El increíble poder defensivo de este hechizo se compara con su muy alto coste de carga.\n\nAl igual que otros escudos otorgados por la forma ascendida, este escudo no se disipa normalmente, sino que expirará inmediatamente cuando la forma ascendida termine.
actors.hero.spells.divineintervention.name=intervención divina
actors.hero.spells.divineintervention.short_desc=Gran mejora de escudo para el clérigo y sus aliados.
actors.hero.spells.divinesense$divinesensetracker.desc=Este personaje es capaz temporalmente de ver a otras criaturas cercanas con su mente!\n\nTurnos restantes: %s.
actors.hero.spells.divinesense$divinesensetracker.name=sentido divino
actors.hero.spells.divinesense.desc=El clérigo concentra sus sentidos en su entorno, obteniendo visión mental con un alcance de casillas %d durante 50 turnos. Este conjuro se lanza al instante.
actors.hero.spells.divinesense.name=sentido divino
actors.hero.spells.divinesense.short_desc=Obtén visión mental temporal en un amplio rango.
actors.hero.spells.flash.desc=El clérigo canaliza su forma ascendida en una ubicación cercana y se teletransporta allí. Flash puede teletransportar al clérigo a cualquier ubicación descubierta que esté dentro del alcance y desocupada. Este conjuro consume más cargas de tomo cada vez que se usa en la misma forma ascendida.
actors.hero.spells.flash.name=destello
actors.hero.spells.flash.prompt=Seleccione una ubicación
actors.hero.spells.flash.short_desc=Teletranspórtate a una ubicación cercana.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=El Sacerdote podrá lanzar Luz Guía gratis de nuevo después de que transcurran 50 turnos.\n\nTurnos restantes: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Luz guía
actors.hero.spells.guidinglight$illuminated.desc=Este personaje brilla como resultado de haber sido alcanzado por una luz guía. Si bien el brillo no es lo suficientemente intenso como para iluminar el área circundante, el efecto mágico facilitará enormemente que el clérigo le aseste golpes.
actors.hero.spells.guidinglight$illuminated.desc_generic=Otros héroes aún pueden usar la habilidad Iluminado para beneficiarse del talento Luz abrasadora, pero no ganarán precisión.
actors.hero.spells.guidinglight$illuminated.desc_priest=El Sacerdote puede consumir adicionalmente Iluminado con Resplandor, un Rayo de varita, un Golpe de un aliado o los efectos de algunos artefactos. Usar Iluminado de esta manera infligirá daño mágico adicional igual al nivel del Sacerdote + 5.
actors.hero.spells.guidinglight$illuminated.name=iluminado
actors.hero.spells.guidinglight.desc=El clérigo dispara un rayo de energía mágica que impacta en un objetivo, infligiéndole de 2 a 8 puntos de daño e iluminándolo. El siguiente ataque físico sin sobrecarga contra un enemigo iluminado tiene garantizado el impacto.
actors.hero.spells.guidinglight.desc_priest=_Este hechizo es más poderoso cuando lo lanza el Sacerdote._ El primer lanzamiento del hechizo cada 50 turnos no cuesta cargas de tomo, y la iluminación se consumirá por la radiación, las varitas, otros personajes y los artefactos que afecten directamente a los enemigos. Cuando se usa de esta manera, inflige daño mágico adicional igual al nivel del Sacerdote + 5.
actors.hero.spells.guidinglight.name=Luz guía
actors.hero.spells.guidinglight.short_desc=Inflige daño mágico a distancia y garantiza un impacto.
actors.hero.spells.hallowedground$hallowedterrain.desc=Este lugar ha sido consagrado. La tierra consagrada ralentiza a los enemigos, cura a los aliados y hace que la hierba se extienda.
actors.hero.spells.hallowedground.desc=El Sacerdote concentra su magia divina en el suelo cercano, creando un área de terreno sagrado %1$dx%1$d durante 20 turnos.\n\nCuando se lanza, este hechizo cura a todos los aliados por 15 HP (los aliados sanos y el Sacerdote obtienen escudo), enraíza brevemente a los enemigos y extiende hierba corta.\n\nEl terreno sagrado cura a los aliados por 1 HP por turno (los aliados sanos y el Sacerdote obtienen escudo), paraliza a los enemigos y hace crecer hierba alta aleatoriamente.\n\nEl terreno sagrado es destruido por el fuego y producirá hierba surcada si los efectos de regeneración pasiva están desactivados o el Sacerdote no ha ganado experiencia en un tiempo.
actors.hero.spells.hallowedground.name=tierra sagrada
actors.hero.spells.hallowedground.prompt=Seleccione una ubicación
actors.hero.spells.hallowedground.short_desc=Cura a los aliados, ralentiza a los enemigos y esparce hierba en un área de efecto.
actors.hero.spells.holyintuition.cursed=Percibes una magia maligna acechando en este objeto.
actors.hero.spells.holyintuition.desc=El clérigo concentra sus sentidos en un objeto y determina si está maldito o no sin necesidad de equiparlo.
actors.hero.spells.holyintuition.name=intuición sagrada
actors.hero.spells.holyintuition.prompt=elige un artículo
actors.hero.spells.holyintuition.short_desc=Indica si un objeto está maldito o no.
actors.hero.spells.holyintuition.uncursed=Este objeto está libre de magia malévola.
actors.hero.spells.holylance$lancecooldown.desc=El sacerdote ha lanzado recientemente Lanza Sagrada y debe esperar antes de volver a lanzarla.\n\nTurnos restantes: %s.
actors.hero.spells.holylance$lancecooldown.name=enfriamiento de la lanza sagrada
actors.hero.spells.holylance.desc=El Sacerdote concentra una gran cantidad de energía en una devastadora lanza arrojadiza hecha de luz. Esta lanza inflige %1$d-%2$d de daño y siempre inflige el daño máximo a objetivos no muertos y demoníacos.\n\nEste hechizo es muy costoso y tiene un tiempo de reutilización de 30 turnos.
actors.hero.spells.holylance.name=lanza santa
actors.hero.spells.holylance.short_desc=Inflige un gran daño mágico a distancia.
actors.hero.spells.holyward$holyarmbuff.desc=El clérigo ha imbuido su armadura desgastada con energía sagrada, anulando temporalmente cualquier glifo existente y haciendo que la armadura bloquee 1 punto de daño adicional.\n\nTurnos restantes: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=El Paladín ha imbuido su armadura desgastada con energía sagrada, lo que hace que la armadura bloquee 3 puntos de daño adicionales.\n\nLanzar otros hechizos mientras la protección sagrada está activa extenderá su duración en 10 turnos por cada carga gastada.\n\nTurnos restantes: %s.
actors.hero.spells.holyward$holyarmbuff.name=barrio sagrado
actors.hero.spells.holyward.desc=El clérigo imbuye su armadura usada con glifos de luz sagrada, aumentando el bloqueo de daño de la armadura en 1. Este hechizo no requiere tiempo de lanzamiento. Este glifo dura 50 turnos y anulará cualquier glifo beneficioso que tenga la armadura durante ese tiempo. El clérigo se beneficiará de este efecto incluso si no tiene armadura.
actors.hero.spells.holyward.desc_paladin=_Este hechizo es más poderoso cuando lo lanza el Paladín._ El bloqueo de daño adicional aumenta a 3, el hechizo ya no anula los glifos existentes y lanzar otros hechizos mientras la protección sagrada está activa extenderá su duración en 10 turnos por cada carga utilizada.
actors.hero.spells.holyward.glyph_desc=Este glifo aumenta ligeramente la cantidad de daño que la armadura puede bloquear.
actors.hero.spells.holyward.glyph_name=%s de luz
actors.hero.spells.holyward.name=barrio sagrado
actors.hero.spells.holyward.short_desc=Anula temporalmente los glifos para mejorar el bloqueo de armadura.
actors.hero.spells.holyweapon$holywepbuff.desc=El clérigo ha imbuido su arma desgastada con energía sagrada, anulando temporalmente cualquier encantamiento existente y haciendo que el arma inflija 2 puntos de daño mágico adicionales en cada ataque.\n\nTurnos restantes: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=El Paladín ha imbuido su arma desgastada con energía sagrada, lo que hace que sus ataques inflijan 6 puntos de daño mágico adicionales.\n\nLanzar otros hechizos mientras el arma sagrada está activa extenderá su duración en 10 turnos por cada carga gastada.\n\nTurnos restantes: %s.
actors.hero.spells.holyweapon$holywepbuff.name=arma sagrada
actors.hero.spells.holyweapon.desc=El clérigo encanta su arma usada con energía sagrada, lo que hace que el arma inflija 2 puntos de daño mágico adicionales cada vez que golpea a un enemigo con ella. Este hechizo no requiere tiempo de lanzamiento. Este encantamiento dura 50 turnos y anulará cualquier encantamiento beneficioso que tenga el arma durante ese tiempo. Los ataques sin armas también pueden beneficiarse de este efecto.
actors.hero.spells.holyweapon.desc_paladin=_Este hechizo es más poderoso cuando lo lanza el Paladín._ El daño mágico adicional aumenta a 6, el hechizo ya no anula los encantamientos existentes y lanzar otros hechizos mientras Arma Sagrada está activa extenderá su duración en 10 turnos por cada carga utilizada.
actors.hero.spells.holyweapon.ench_desc=Los enemigos alcanzados por un arma sagrada recibirán daño mágico adicional.
actors.hero.spells.holyweapon.ench_name=santo %s
actors.hero.spells.holyweapon.name=arma sagrada
actors.hero.spells.holyweapon.short_desc=Anula temporalmente los encantamientos para aumentar el daño.
actors.hero.spells.judgement.desc=El clérigo golpea el suelo con el puño, provocando una erupción de luz que inflige daño a todos los enemigos que puede ver. Esto inflige %1$d-%2$d de daño base, pero también inflige 33%% de daño adicional por cada hechizo que el clérigo haya lanzado desde que entró en forma ascendida (o desde que lanzó Juicio por última vez).\n\nActualmente Juicio infligirá %3$d-%4$d de daño.
actors.hero.spells.judgement.name=juicio
actors.hero.spells.judgement.short_desc=Daña a todos los enemigos visibles.
actors.hero.spells.layonhands.desc=El Paladín canaliza energía sagrada a través de sus manos, sanando o protegiendo todo lo que toca.\n\nEl Paladín puede lanzar este hechizo sobre cualquier personaje adyacente para darle %1$d sanación, o sobre sí mismo para obtener %1$d protección. La sanación sobrante de este hechizo se convierte en protección.\n\nEste hechizo se lanza instantáneamente y se puede lanzar repetidamente, pero no puede otorgar más de tres lanzamientos de protección a la vez.
actors.hero.spells.layonhands.name=imposición de manos
actors.hero.spells.layonhands.short_desc=Cura instantáneamente a un personaje adyacente o protege al Paladín.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=El clérigo lanzó recientemente Vínculo vital sobre este aliado.\n\nAdemás de los beneficios habituales de Vínculo vital, este personaje también recibe daño reducido, cualquier hechizo positivo de clérigo se aplica tanto al clérigo como a este aliado en lugar de solo a uno, y Poder de muchos no expirará mientras este beneficio esté activo.\n\nTurnos restantes: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=protección del vínculo vital
actors.hero.spells.lifelinkspell.desc=El Clérigo fortalece el vínculo entre él y su aliado potenciado. Con este vínculo potenciado, cualquier daño recibido se compartirá entre el héroe y su aliado durante %1$d turnos, y el aumento defensivo de Poder de Muchos aumentará a -%2$d%% daño recibido. Tenga en cuenta que el daño se comparte después de la armadura, pero antes de la reducción de daño de Poder de Muchos.\n\nMientras este efecto esté activo, los hechizos beneficiosos de Clérigo de T3 o inferior se aplicarán tanto al Clérigo como a su aliado si solo se hubieran aplicado a uno de ellos.
actors.hero.spells.lifelinkspell.name=vínculo vital
actors.hero.spells.lifelinkspell.short_desc=Comparte el daño con un aliado y reduce el daño que este recibe.
actors.hero.spells.mindform.desc=El clérigo elige una varita o armas arrojadizas que haya identificado en esta partida e imbuye a Trinity con su efecto.\n\nCuando se usa Trinity, el clérigo puede hacer un solo ataque como si estuviera usando el objeto elegido a +%d. Esto activará todos los efectos que normalmente se activarían al usar ese tipo de objeto.\n\nEste hechizo reemplaza cualquier otro efecto mental con el que Trinity esté imbuido actualmente.
actors.hero.spells.mindform.name=forma mental
actors.hero.spells.mindform.short_desc=Asigna la Trinidad a una varita o arma arrojadiza.
actors.hero.spells.mnemonicprayer.desc=El Sacerdote pronuncia una oración que extiende la duración de todos los beneficios o perjuicios en un objetivo específico por %1$d turnos. Este hechizo no requiere tiempo de lanzamiento. Los efectos positivos durarán más en los aliados (incluido el propio Sacerdote), y los efectos perjudiciales durarán más en los enemigos.\n\nLa Oración Mnemónica solo puede extender una instancia específica de un beneficio o perjuicio una vez, y no puede extender los beneficios otorgados por las habilidades de armadura.
actors.hero.spells.mnemonicprayer.name=oración mnemotécnica
actors.hero.spells.mnemonicprayer.short_desc=Extiende los efectos positivos/negativos sobre un aliado/enemigo y vuelve a aplicar el efecto iluminado.
actors.hero.spells.radiance.desc=El Sacerdote estalla en luz sagrada, aturdiendo a todos los enemigos visibles durante 3 turnos. Si un enemigo ya está iluminado, Resplandor activará el daño adicional de Iluminación y aplicará el perjuicio de Iluminación. Resplandor también hará que el Sacerdote brille durante 100 turnos si el piso actual está oscuro.
actors.hero.spells.radiance.name=resplandor
actors.hero.spells.radiance.short_desc=Ilumina y aturde brevemente a los enemigos visibles.
actors.hero.spells.recallinscription$useditemtracker.desc=El clérigo ha usado recientemente un objeto que funciona con el conjuro de recuerdo inscrito. El clérigo puede lanzar el conjuro para repetir el efecto del objeto.\n\nObjeto usado: %1$s.\n\nTurnos restantes: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=runa usada recientemente
actors.hero.spells.recallinscription.desc=El clérigo usa magia sagrada para volver a lanzar el efecto de una runa mágica encontrada en una piedra rúnica o pergamino que usó en los últimos %s turnos.\n\nRecordar Inscripción no se puede usar para replicar pergaminos de mejora. El costo de carga de este hechizo varía según el objeto que se usó recientemente: 2 para una piedra rúnica, 3 para un pergamino, 4 para un pergamino exótico. Este costo de carga también se duplica cuando se replica un pergamino de transmutación o objetos de alquimia que deben crearse usando transmutación o mejora.
actors.hero.spells.recallinscription.name=inscripción de recuperación
actors.hero.spells.recallinscription.short_desc=Repite una runa o pergamino usado recientemente.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Un delgado escudo de luz se interpone entre este personaje y un enemigo. No es lo suficientemente fuerte como para bloquear los ataques por completo, pero los debilitará.\n\nTurnos restantes: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=escudo de luz
actors.hero.spells.shieldoflight.desc=El clérigo crea una delgada barrera de luz entre él y un enemigo, aumentando el poder de bloqueo de su armadura contra ese enemigo en %1$d-%2$d durante 5 turnos.\n\nEste hechizo no requiere tiempo para ser lanzado, pero no puede ser utilizado contra múltiples objetivos simultáneamente.
actors.hero.spells.shieldoflight.name=escudo de luz
actors.hero.spells.shieldoflight.short_desc=Otorga armadura temporal contra un objetivo.
actors.hero.spells.smite.desc=El Paladín infunde un golpe cuerpo a cuerpo con un poder destructivo justo.\n\nAdemás de infligir daño cuerpo a cuerpo normal, Castigo hace que los ataques sin sobrecarga tengan un impacto garantizado, tiene +300%% poder de encantamiento e inflige %1$d - %2$d daño mágico adicional.\n\nEl daño mágico adicional de Castigo escala con el nivel del Paladín y siempre infligirá el máximo daño mágico adicional contra enemigos no muertos o demoníacos.
actors.hero.spells.smite.name=herir
actors.hero.spells.smite.short_desc=Garantiza un impacto con daño adicional y poder de encantamiento.
actors.hero.spells.spiritform$spiritformbuff.desc=La forma espiritual de Trinity actualmente te otorga el poder de un objeto, como si lo tuvieras equipado.\n\nTen en cuenta que la forma espiritual no puede proporcionar otra copia de un efecto del que ya te estás beneficiando.\n\nEfecto actual: %1$s.\n\nTurnos restantes: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=forma espiritual
actors.hero.spells.spiritform.desc=El clérigo elige un anillo o artefacto que haya identificado en esta partida (excepto el tomo sagrado) e imbuye a Trinity con su efecto.\n\nSi se elige un anillo, Trinity otorga el efecto de ese anillo a +%1$d durante 20 turnos.\n\nSi se elige un artefacto, Trinity replica el efecto de ese artefacto a +%2$d. Cada artefacto tiene comportamientos específicos diferentes y costes de carga de armadura cuando se usa con Trinity.\n\nEste hechizo reemplaza cualquier otro efecto de espíritu con el que Trinity esté imbuido actualmente.
actors.hero.spells.spiritform.name=forma espiritual
actors.hero.spells.spiritform.short_desc=Asigna la Trinidad a un anillo o artefacto.
actors.hero.spells.stasis$stasisbuff.desc=El clérigo tiene actualmente un aliado almacenado en estasis. Todos los efectos positivos sobre este aliado se conservan, incluido Poder de Muchos, y reaparecerán junto al clérigo cuando el efecto termine. El efecto también puede terminar antes de tiempo volviendo a lanzar Estasis.\n\nAliado en estasis: %1$s.\nTurnos restantes: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Tu aliado inmóvil se queda atrás.
actors.hero.spells.stasis$stasisbuff.name=aliado en estasis
actors.hero.spells.stasis.desc=El clérigo concentra su conexión con su aliado hacia sí mismo, lo que provoca que el aliado quede temporalmente en una especie de estasis energética dentro del clérigo. El aliado se conservará durante hasta %d turnos, y todos los efectos positivos sobre él no se verán afectados por su tiempo en estasis.\n\nEl aliado aparecerá junto al clérigo cuando la estasis termine naturalmente o puede volver a lanzar el hechizo instantáneamente sin coste alguno para terminar el efecto antes de tiempo. La estasis puede incluso mover aliados inmóviles, pero no puede transferirlos entre pisos.
actors.hero.spells.stasis.name=estasis
actors.hero.spells.stasis.short_desc=Elimina al aliado de la mazmorra y lo preserva.
actors.hero.spells.sunray.desc=El clérigo dispara un rayo de luz cegadora a un objetivo, infligiendo %1$d-%2$d de daño y cegándolo durante %3$d turnos. Rayo solar siempre inflige el daño máximo a objetivos no muertos y demoníacos.\n\nDespués de ser golpeado por este hechizo, la visión de un enemigo se ajustará, impidiendo que vuelva a ser cegado por él. Sin embargo, si es golpeado de nuevo mientras está cegado por este hechizo, entonces la luz es abrumadora y lo paraliza en su lugar.
actors.hero.spells.sunray.name=rayo de sol
actors.hero.spells.sunray.short_desc=Inflige daño mágico a distancia y ciega a un objetivo una vez.
actors.hero.spells.walloflight$lightwall.desc=Unos paneles de luz brillante bloquean el paso aquí.
actors.hero.spells.walloflight.desc=El Paladín crea un muro hecho de paneles de luz sólida directamente frente a sí mismo que tiene 1 casilla de espesor, %1$d casillas de ancho y dura 20 turnos.\n\nEste muro funciona igual que uno normal, excepto que se puede ver a través de él. Los enemigos que estén atrapados en el muro cuando se crea serán aturdidos momentáneamente y empujados hacia atrás si es posible. Cualquier cosa atascada en el muro podrá moverse fuera de él.\n\nEl muro se puede lanzar en cualquiera de las cuatro direcciones cardinales o las cuatro diagonales. Si un muro ya está activo, el hechizo se puede volver a usar gratis para despejar el muro instantáneamente.
actors.hero.spells.walloflight.early_end=Disipas el muro de luz.
actors.hero.spells.walloflight.name=pared de luz
actors.hero.spells.walloflight.short_desc=Crea un muro que bloquea a los enemigos.
actors.hero.talent$aggressivebarriercooldown.desc=Has usado recientemente este talento y debes esperar antes de volver a usarlo.\n\nTurnos restantes: %s.
actors.hero.talent$aggressivebarriercooldown.name=enfriamiento de barrera agresiva
actors.hero.talent$combinedlethalityabilitytracker.executed=ejecutado
actors.hero.talent$deadlyfollowuptracker.desc=La duelista ha atacado recientemente a un enemigo con un arma arrojadiza, sus ataques cuerpo a cuerpo contra el mismo objetivo tendrán daño aumentado.\n\nTurnos restantes: %s.
actors.hero.talent$deadlyfollowuptracker.name=seguimiento mortal
actors.hero.talent$followupstriketracker.desc=La Cazadora ha atacado recientemente a un enemigo con un arma arrojadiza, su próximo ataque cuerpo a cuerpo contra el mismo objetivo tendrá un daño aumentado.\n\nTurnos restantes: %s.
actors.hero.talent$followupstriketracker.name=ataque de seguimiento
actors.hero.talent$improvisedprojectilecooldown.desc=Has usado recientemente este talento y debes esperar antes de volver a usarlo.\n\nTurnos restantes: %s.
actors.hero.talent$improvisedprojectilecooldown.name=tiempo de recarga de proyectiles improvisados
actors.hero.talent$lethalhastecooldown.desc=Has usado recientemente este talento y debes esperar antes de volver a usarlo.\n\nTurnos restantes: %s.
actors.hero.talent$lethalhastecooldown.name=enfriamiento de prisa letal
actors.hero.talent$lingeringmagictracker.desc=El mago ha usado recientemente un bastón o varita, su próximo ataque físico infligirá daño adicional.\n\nTurnos restantes: %s.
actors.hero.talent$lingeringmagictracker.name=magia persistente
actors.hero.talent$liquidagilacctracker.desc=El siguiente ataque cuerpo a cuerpo regular del Duelista obtendrá precisión adicional.\n\nTurnos restantes: %s.
actors.hero.talent$liquidagilacctracker.name=agilidad líquida
actors.hero.talent$patientstriketracker.desc=La duelista acaba de pasar un turno esperando, su próximo ataque cuerpo a cuerpo infligirá daño adicional.
actors.hero.talent$patientstriketracker.name=huelga de pacientes
actors.hero.talent$preciseassaulttracker.desc=El siguiente ataque cuerpo a cuerpo regular del Duelista obtendrá precisión adicional.\n\nTurnos restantes: %s.
actors.hero.talent$preciseassaulttracker.name=asalto preciso
actors.hero.talent$provokedangertracker.desc=El guerrero ha perdido recientemente su escudo, su próximo ataque físico infligirá daño adicional.\n\nTurnos restantes: %s.
actors.hero.talent$provokedangertracker.name=provocó ira
actors.hero.talent$rejuvenatingstepscooldown.desc=Has usado recientemente este talento y debes esperar antes de volver a usarlo.\n\nTurnos restantes: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=pasos de rejuvenecimiento y enfriamiento
actors.hero.talent$satiatedspellstracker.desc=El siguiente hechizo que lance el clérigo le otorgará una pequeña cantidad de protección.
actors.hero.talent$satiatedspellstracker.name=Hechizo de protección
actors.hero.talent$searinglightcooldown.desc=Has usado recientemente este talento y debes esperar antes de volver a usarlo.\n\nTurnos restantes: %s.
actors.hero.talent$searinglightcooldown.name=Luz abrasadora
actors.hero.talent$seershotcooldown.desc=Has usado recientemente este talento y debes esperar antes de volver a usarlo.\n\nTurnos restantes: %s.
actors.hero.talent$seershotcooldown.name=enfriamiento del disparo del vidente
actors.hero.talent$swiftequipcooldown.desc=Has usado recientemente este talento y debes esperar antes de volver a usarlo.\n\nTurnos restantes: %s.
actors.hero.talent$swiftequipcooldown.name=enfriamiento rápido del equipo
actors.hero.talent.adventurers_intuition.desc=_+1:_ La duelista identifica las armas _2,5 veces más rápido_ y la armadura _1,75 veces más rápido_.\n\n_+2:_ La duelista identifica las armas _cuando las equipa_ y la armadura _2,5 veces más rápido_.
actors.hero.talent.adventurers_intuition.title=intuición del aventurero
actors.hero.talent.aggressive_barrier.desc=_+1:_ La Duelista obtiene _3 de escudo_ cuando usa una habilidad de arma y tiene un 50% o menos de salud.\n\n_+2:_ La Duelista obtiene _5 de escudo_ cuando usa una habilidad de arma y tiene un 50% o menos de salud.
actors.hero.talent.aggressive_barrier.meta_desc=Si este talento lo obtiene otro héroe, en su lugar otorgará un escudo al realizar un ataque cuerpo a cuerpo con poca salud, con un tiempo de reutilización de 50 turnos.
actors.hero.talent.aggressive_barrier.title=barrera agresiva
actors.hero.talent.ally_warp.desc=_+1:_ El mago puede seleccionar un aliado para intercambiar lugares instantáneamente con él, con un rango de _2 casillas_.\n\n_+2:_ El mago puede seleccionar un aliado para intercambiar lugares instantáneamente con él, con un rango de _4 casillas_.\n\n_+3:_ El mago puede seleccionar un aliado para intercambiar lugares instantáneamente con él, con un rango de _6 casillas_.\n\nEl mago no puede intercambiar lugares con aliados inmóviles.
actors.hero.talent.ally_warp.title=distorsión de aliado
actors.hero.talent.arcane_vision.desc=_+1:_ Cuando el Mago lanza un rayo a un enemigo, obtiene visión mental sobre él durante _10 turnos_.\n\n_+2:_ Cuando el Mago lanza un rayo a un enemigo, obtiene visión mental sobre él durante _15 turnos_.
actors.hero.talent.arcane_vision.title=visión arcana
actors.hero.talent.assassins_reach.desc=_+1:_ El rango de parpadeo del Asesino por nivel de preparación aumenta a _1/3/4/6 casillas_, desde 1/2/3/4.\n\n_+2:_ El rango de parpadeo del Asesino por nivel de preparación aumenta a _2/4/6/8 casillas_, desde 1/2/3/4.\n\n_+3:_ El rango de parpadeo del Asesino por nivel de preparación aumenta a _2/5/7/10 casillas_, desde 1/2/3/4.\n\nEste parpadeo puede atravesar peligros y enemigos, pero no terreno sólido como paredes.
actors.hero.talent.assassins_reach.title=alcance del asesino
actors.hero.talent.aura_of_protection.desc=_+1:_ El Paladín puede lanzar _Aura de Protección_, un hechizo que otorga al Paladín y a todos los aliados dentro de 2 casillas _20% de resistencia al daño_ y el efecto del glifo de armadura del Paladín con _+50% de poder_ durante 20 turnos, a un costo de 2 cargas.\n\n_+2:_ El Paladín puede lanzar _Aura de Protección_, un hechizo que otorga al Paladín y a todos los aliados dentro de 2 casillas _30% de resistencia al daño_ y el efecto del glifo de armadura del Paladín con _+75% de poder_ durante 20 turnos, a un costo de 2 cargas.\n\n_+3:_ El Paladín puede lanzar _Aura de Protección_, un hechizo que otorga al Paladín y a todos los aliados dentro de 2 casillas _40% de resistencia al daño_ y el efecto del glifo de armadura del Paladín con _+10 20 turnos, a un coste de 2 cargas.
actors.hero.talent.aura_of_protection.title=aura de protección
actors.hero.talent.backup_barrier.desc=_+1:_ El mago obtiene _3 de escudo_ cada vez que gasta la última carga en su bastón.\n\n_+2:_ El mago obtiene _5 de escudo_ cada vez que gasta la última carga en su bastón.
actors.hero.talent.backup_barrier.meta_desc=_Si este talento lo obtiene un héroe diferente_, se activará con la varita de mayor nivel de dicho héroe.
actors.hero.talent.backup_barrier.title=barrera de respaldo
actors.hero.talent.barkskin.desc=_+1:_ Al pisar hierba, la Guardiana obtiene _0-50% de su nivel_ en armadura de piel de corteza que se desvanece cada turno.\n\n_+2:_ Al pisar hierba, la Guardiana obtiene _0-100% de su nivel_ en armadura de piel de corteza que se desvanece cada turno.\n\n_+3:_ Al pisar hierba, la Guardiana obtiene _0-150% de su nivel_ en armadura de piel de corteza que se desvanece cada turno.
actors.hero.talent.barkskin.title=piel de corteza
actors.hero.talent.beaming_ray.desc=El clérigo puede lanzar Rayo Radiante desde un aliado potenciado a cambio de 1 carga. Este rayo atraviesa paredes y teletransporta al aliado a la ubicación seleccionada. Si hay un enemigo en esa ubicación, el aliado aparece junto a él y lo atacará. Beaming Ray puede incluso teletransportar aliados normalmente inmóviles, pero tiene la mitad del alcance al hacerlo.\n\n_+1:_ Beaming Ray tiene un alcance máximo de _4 casillas_ y aumenta la bonificación de Poder de Muchos a _+35% de daño_ contra el enemigo más cercano durante 10 turnos.\n\n_+2:_ Beaming Ray tiene un alcance máximo de _8 casillas_ y aumenta la bonificación de Poder de Muchos a _+40% de daño_ contra el enemigo más cercano durante 10 turnos.\n\n_+3:_ Beaming Ray tiene un alcance máximo de _12 casillas_ y aumenta la bonificación de Poder de Muchos a _+45% de daño_ contra el enemigo más cercano durante 10 turnos.\n\n_+4:_ Beaming Ray tiene un alcance máximo de _16 casillas_ y aumenta Poder de Bonificación de Many a _+50% de daño_ contra el enemigo más cercano durante 10 turnos.
actors.hero.talent.beaming_ray.title=rayo radiante
actors.hero.talent.blast_radius.desc=_+1:_ El radio de la explosión elemental aumenta a _5 casillas_, desde 4.\n\n_+2:_ El radio de la explosión elemental aumenta a _6 casillas_, desde 4.\n\n_+3:_ El radio de la explosión elemental aumenta a _7 casillas_, desde 4.\n\n_+4:_ El radio de la explosión elemental aumenta a _8 casillas_, desde 4.
actors.hero.talent.blast_radius.title=radio de explosión
actors.hero.talent.bless.desc=_+1:_ El clérigo puede lanzar _Bendición_, un hechizo que otorga _6 turnos de bendición y 10 de escudo_ cuando se lanza sobre sí mismo o _10 turnos de bendición y 10 de curación_ cuando se lanza sobre otro personaje, a un coste de 1 carga.\n\n_+2:_ El clérigo puede lanzar _Bendición_, un hechizo que otorga _10 turnos de bendición y 15 de escudo_ cuando se lanza sobre sí mismo o _15 turnos de bendición y 15 de curación_ cuando se lanza sobre otro personaje, a un coste de 1 carga.\n\nLa curación sobrante de este hechizo se convierte en escudo.
actors.hero.talent.bless.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar aumentará la precisión y la evasión del héroe y de todos los aliados en un 3% con +1 o en un 5% con +2.
actors.hero.talent.bless.title=bendecir
actors.hero.talent.body_form.desc=El clérigo puede lanzar _Forma Corporal_, que imbuye a Trinity con el poder de un encantamiento o glifo que el clérigo haya identificado en esta carrera, a un costo de 2 cargas.\n\n_+1:_ Cuando se usa Trinity, el clérigo obtiene el efecto elegido durante _20 turnos._\n\n_+2:_ Cuando se usa Trinity, el clérigo obtiene el efecto elegido durante _27 turnos._\n\n_+3:_ Cuando se usa Trinity, el clérigo obtiene el efecto elegido durante _33 turnos._\n\n_+4:_ Cuando se usa Trinity, el clérigo obtiene el efecto elegido durante _40 turnos._\n\nTrinity solo puede ser imbuida con un efecto corporal a la vez. El coste de carga de armadura de Trinity es mayor si el glifo elegido es raro y poderoso.
actors.hero.talent.body_form.title=forma del cuerpo
actors.hero.talent.body_replacement.desc=_+1:_ Después de parpadear, el Pícaro deja un señuelo de madera que tiene _20 de salud y 1-3 de armadura_.\n\n_+2:_ Después de parpadear, el Pícaro deja un señuelo de madera que tiene _40 de salud y 2-6 de armadura_.\n\n_+3:_ Después de parpadear, el Pícaro deja un señuelo de madera que tiene _60 de salud y 3-9 de armadura_.\n\n_+4:_ Después de parpadear, el Pícaro deja un señuelo de madera que tiene _80 de salud y 4-12 de armadura_.\n\nSolo un señuelo puede estar activo a la vez.
actors.hero.talent.body_replacement.title=reemplazo de cuerpo
actors.hero.talent.body_slam.desc=_+1:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño igual a _1-4 más 25%_ de su poder de bloqueo de daño.\n\n_+2:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño igual a _2-8 más 50%_ de su poder de bloqueo de daño.\n\n_+3:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño igual a _3-12 más 75%_ de su poder de bloqueo de daño.\n\n_+4:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes reciben daño igual a _4-16 más 100%_ de su poder de bloqueo de daño.
actors.hero.talent.body_slam.title=golpe corporal
actors.hero.talent.bounty_hunter.desc=_+1:_ Cuando el Asesino mata a un enemigo con un golpe preparado, su probabilidad de soltar un objeto aumenta en _2/4/8/16%_, por nivel de preparación.\n\n_+2:_ Cuando el Asesino mata a un enemigo con un golpe preparado, su probabilidad de soltar un objeto aumenta en _4/8/16/32%_, por nivel de preparación.\n\n_+3:_ Cuando el Asesino mata a un enemigo con un golpe preparado, su probabilidad de soltar un objeto aumenta en _6/12/24/48%_, por nivel de preparación.
actors.hero.talent.bounty_hunter.title=cazarrecompensas
actors.hero.talent.cached_rations.desc=_+1:_ El Pícaro puede encontrar _2 raciones de suministros_ colocadas en cofres mientras explora los siguientes pisos de la mazmorra.\n\n_+2:_ El Pícaro puede encontrar _3 raciones de suministros_ colocadas en cofres mientras explora los siguientes pisos de la mazmorra.\n\nLas raciones de suministros se comen rápidamente, restauran una cantidad moderada de saciedad, curan 5 puntos de vida y restauran 1 carga a la capa de sombras.
actors.hero.talent.cached_rations.title=raciones almacenadas
actors.hero.talent.cleanse.desc=_+1:_ El clérigo puede lanzar _Limpiar_, un hechizo que _elimina los efectos de estado negativos_ del clérigo y de cualquier aliado cercano, y les otorga _10 de escudo_, a un costo de 2 cargas.\n\n_+2:_ El clérigo puede lanzar _Limpiar_, un hechizo que _otorga 3 turnos de inmunidad a los estados negativos_ al clérigo y a cualquier aliado cercano, y les otorga _20 de escudo_, a un costo de 2 cargas.\n\n_+3:_ El clérigo puede lanzar _Limpiar_, un hechizo que _otorga 5 turnos de inmunidad a los estados negativos_ al clérigo y a cualquier aliado cercano, y les otorga _30 de escudo_, a un costo de 2 cargas.
actors.hero.talent.cleanse.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar limpiará los efectos de estado negativos en el héroe después de usar una varita o artefacto, 10/20/30% de las veces a +1/+2/+3.
actors.hero.talent.cleanse.title=limpiar
actors.hero.talent.cleave.desc=_+1:_ El tiempo extra que el Gladiador obtiene en una muerte aumenta a _30 turnos_, desde 15.\n\n_+2:_ El tiempo extra que el Gladiador obtiene en una muerte aumenta a _45 turnos_, desde 15.\n\n_+3:_ El tiempo extra que el Gladiador obtiene en una muerte aumenta a _60 turnos_, desde 15.
actors.hero.talent.cleave.title=adherirse
actors.hero.talent.cloned_armor.desc=_+1:_ El clon de sombra gana _12%_ del valor de armadura del héroe y tiene _25% de probabilidad_ de usar el glifo en la armadura del héroe.\n\n_+2:_ El clon de sombra gana _24%_ del valor de armadura del héroe y tiene _50% de probabilidad_ de usar el glifo en la armadura del héroe.\n\n_+3:_ El clon de sombra gana _36%_ del valor de armadura del héroe y tiene _75% de probabilidad_ de usar el glifo en la armadura del héroe.\n\n_+4:_ El clon de sombra gana _48%_ del valor de armadura del héroe y tiene _100% de probabilidad_ de usar el glifo en la armadura del héroe.
actors.hero.talent.cloned_armor.title=armadura clonada
actors.hero.talent.close_the_gap.desc=_+1:_ La duelista parpadea _hasta dos casillas_ hacia su objetivo al comenzar un duelo.\n\n_+2:_ La duelista parpadea _hasta tres casillas_ hacia su objetivo al comenzar un duelo.\n\n_+3:_ La duelista parpadea _hasta cuatro casillas_ hacia su objetivo al comenzar un duelo.\n\n_+4:_ La duelista parpadea _hasta cinco casillas_ hacia su objetivo al comenzar un duelo.\n\nEste parpadeo puede atravesar peligros y enemigos, pero no terreno sólido como paredes. El parpadeo se tiene en cuenta al determinar si un enemigo está dentro del alcance para ser desafiado.
actors.hero.talent.close_the_gap.title=cerrar la brecha
actors.hero.talent.combined_energy.desc=_+1:_ Si el Monje usa una habilidad de arma y una habilidad de _4+ energía_ dentro de 5 turnos de diferencia, recupera 1 energía gastada.\n\n_+2:_ Si el Monje usa una habilidad de arma y una habilidad de _3+ energía_ dentro de 5 turnos de diferencia, recupera 1 energía gastada.\n\n_+3:_ Si el Monje usa una habilidad de arma y una habilidad de _2+ energía_ dentro de 5 turnos de diferencia, recupera 1 energía gastada.
actors.hero.talent.combined_energy.title=energía combinada
actors.hero.talent.combined_lethality.desc=_+1:_ Si el Campeón ataca con un arma cuerpo a cuerpo inmediatamente después de usar la habilidad de un arma diferente, ese ataque ejecutará a cualquier enemigo que no sea jefe que quede con _menos del 13% de HP_.\n\n_+2:_ Si el Campeón ataca con un arma cuerpo a cuerpo inmediatamente después de usar la habilidad de un arma diferente, ese ataque ejecutará a cualquier enemigo que no sea jefe que quede con _menos del 27% de HP_.\n\n_+3:_ Si el Campeón ataca con un arma cuerpo a cuerpo inmediatamente después de usar la habilidad de un arma diferente, ese ataque ejecutará a cualquier enemigo que no sea jefe que quede con _menos del 40% de HP_.\n\nEste ataque puede ser un ataque normal de arma cuerpo a cuerpo o parte de una habilidad de arma.
actors.hero.talent.combined_lethality.title=letalidad combinada
actors.hero.talent.conserved_magic.desc=_+1:_ Cada descarga de magia salvaje ahora usa _0.33 cargas_ en lugar de 0.5, y la magia salvaje tiene una _25% de probabilidad_ de no gastar un turno.\n\n_+2:_ Cada descarga de magia salvaje ahora usa _0.225 cargas_ en lugar de 0.5, y la magia salvaje tiene una _50% de probabilidad_ de no gastar un turno.\n\n_+3:_ Cada descarga de magia salvaje ahora usa _0.15 cargas_ en lugar de 0.5, y la magia salvaje tiene una _75% de probabilidad_ de no gastar un turno.\n\n_+4:_ Cada descarga de magia salvaje ahora usa _0.1 cargas_ en lugar de 0.5, y la magia salvaje tiene una _100% de probabilidad_ de no gastar un turno.
actors.hero.talent.conserved_magic.title=magia conservada
actors.hero.talent.counter_ability.desc=_+1:_ Si la Duelista usa una habilidad de arma dentro de los 3 turnos de que su imagen residual sea atacada, recuperará instantáneamente _0.38 cargas_.\n\n_+2:_ Si la Duelista usa una habilidad de arma dentro de los 3 turnos de que su imagen residual sea atacada, recuperará instantáneamente _0.77 cargas_.\n\n_+3:_ Si la Duelista usa una habilidad de arma dentro de los 3 turnos de que su imagen residual sea atacada, recuperará instantáneamente _1.13 cargas_.\n\n_+4:_ Si la Duelista usa una habilidad de arma dentro de los 3 turnos de que su imagen residual sea atacada, recuperará instantáneamente _1.5 cargas_.
actors.hero.talent.counter_ability.title=capacidad de contrarrestar
actors.hero.talent.deadly_followup.desc=_+1:_ Cuando la Duelista golpea a un enemigo con un arma arrojadiza, le infligirá _10% más de daño cuerpo a cuerpo_ durante 5 turnos.\n\n_+2:_ Cuando la Duelista golpea a un enemigo con un arma arrojadiza, le infligirá _20% más de daño cuerpo a cuerpo_ durante 5 turnos.\n\n_+3:_ Cuando la Duelista golpea a un enemigo con un arma arrojadiza, le infligirá _30% más de daño cuerpo a cuerpo_ durante 5 turnos.
actors.hero.talent.deadly_followup.title=seguimiento mortal
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk se activa automáticamente si el Berserker está a punto de morir y la rabia está en o por encima del 100%, pero tiene un tiempo de reutilización de _3 niveles de héroe_ cuando esto sucede.\n\n_+2:_ Berserk se activa automáticamente si el Berserker está a punto de morir y la rabia está en o por encima del 100%, pero tiene un tiempo de reutilización de _2 niveles de héroe_ cuando esto sucede.\n\n_+3:_ Berserk se activa automáticamente si el Berserker está a punto de morir y la rabia está en o por encima del 100%, pero tiene un tiempo de reutilización de _1 nivel de héroe_ cuando esto sucede.\n\nTenga en cuenta que el Berserker seguirá muriendo si tiene 0 HP cuando finaliza el berserking.
actors.hero.talent.deathless_fury.title=furia inmortal
actors.hero.talent.deathly_durability.desc=_+1:_ Los enemigos muertos por la marca de la muerte le dan al Pícaro un escudo igual al _13%_ de sus puntos de vida cuando estaban marcados.\n\n_+2:_ Los enemigos muertos por la marca de la muerte le dan al Pícaro un escudo igual al _25%_ de sus puntos de vida cuando estaban marcados.\n\n_+3:_ Los enemigos muertos por la marca de la muerte le dan al Pícaro un escudo igual al _38%_ de sus puntos de vida cuando estaban marcados.\n\n_+4:_ Los enemigos muertos por la marca de la muerte le dan al Pícaro un escudo igual al _50%_ de sus puntos de vida cuando estaban marcados.
actors.hero.talent.deathly_durability.title=durabilidad mortal
actors.hero.talent.desperate_power.desc=_+1:_ Las varitas y el bastón del mago ganan _+1 nivel_ en su último rayo cuando les queda su última carga.\n\n_+2:_ Las varitas y el bastón del mago ganan _+2 niveles_ en su último rayo cuando les queda su última carga.\n\n_+3:_ Las varitas y el bastón del mago ganan _+3 niveles_ en su último rayo cuando les queda su última carga.
actors.hero.talent.desperate_power.title=poder desesperado
actors.hero.talent.directed_power.desc=_+1:_ El ataque directo de golpe elemental obtiene _+30% de poder de encantamiento_ por cada enemigo en el rango del efecto de golpe elemental, incluido el objetivo del ataque.\n\n_+2:_ El ataque directo de golpe elemental obtiene _+60% de poder de encantamiento_ por cada enemigo en el rango del efecto de golpe elemental, incluido el objetivo del ataque.\n\n_+3:_ El ataque directo de golpe elemental obtiene _+90% de poder de encantamiento_ por cada enemigo en el rango del efecto de golpe elemental, incluido el objetivo del ataque.\n\n_+4:_ El ataque directo de golpe elemental obtiene _+120% de poder de encantamiento_ por cada enemigo en el rango del efecto de golpe elemental, incluido el objetivo del ataque.
actors.hero.talent.directed_power.title=potencia dirigida
actors.hero.talent.divine_intervention.desc=_+1:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Intervención Divina_, que aumenta al Clérigo y a todos los aliados hasta _150 de escudo_ y extiende la Forma Ascendida por _3 turnos._\n\n_+2:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Intervención Divina_, que aumenta al Clérigo y a todos los aliados hasta _200 de escudo_ y extiende la Forma Ascendida por _4 turnos._\n\n_+3:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Intervención Divina_, que aumenta al Clérigo y a todos los aliados hasta _250 de escudo_ y extiende la Forma Ascendida por _5 turnos._\n\n_+4:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Intervención Divina_, que aumenta al Clérigo y todos los aliados hasta _300 de escudo_ y extiende la Forma Ascendida por _6 turnos._ \n\n La Intervención Divina cuesta la friolera de 5 cargas de tomo y solo se puede lanzar una vez en la misma forma ascendida.
actors.hero.talent.divine_intervention.title=intervención divina
actors.hero.talent.divine_sense.desc=_+1:_ El clérigo puede lanzar _Sentido Divino_, un hechizo que le otorga _8 casillas_ de Visión Mental durante 50 turnos y no requiere tiempo de lanzamiento, a un costo de 2 cargas.\n\n_+2:_ El clérigo puede lanzar _Sentido Divino_, un hechizo que le otorga _12 casillas_ de Visión Mental durante 50 turnos y no requiere tiempo de lanzamiento, a un costo de 2 cargas.
actors.hero.talent.divine_sense.meta_desc=_Si este talento lo obtiene otro héroe_, en su lugar le otorgará visión mental por un breve momento después de usar una varita o artefacto con un alcance de 3 casillas a +1 o 5 casillas a +2.
actors.hero.talent.divine_sense.title=sentido divino
actors.hero.talent.double_jump.desc=_+1:_ Si el Guerrero realiza un segundo salto dentro de 3 turnos, ese salto tiene un coste de carga _16% reducido_.\n\n_+2:_ Si el Guerrero realiza un segundo salto dentro de 3 turnos, ese salto tiene un coste de carga _30% reducido_.\n\n_+3:_ Si el Guerrero realiza un segundo salto dentro de 3 turnos, ese salto tiene un coste de carga _40% reducido_.\n\n_+4:_ Si el Guerrero realiza un segundo salto dentro de 3 turnos, ese salto tiene un coste de carga _50% reducido_.
actors.hero.talent.double_jump.title=salto doble
actors.hero.talent.double_mark.desc=_+1:_ Marcar un segundo objetivo al mismo tiempo que el primero tiene un coste de carga _30% reducido_.\n\n_+2:_ Marcar un segundo objetivo al mismo tiempo que el primero tiene un coste de carga _50% reducido_.\n\n_+3:_ Marcar un segundo objetivo al mismo tiempo que el primero tiene un coste de carga _65% reducido_.\n\n_+4:_ Marcar un segundo objetivo al mismo tiempo que el primero tiene un coste de carga _75% reducido_.
actors.hero.talent.double_mark.title=doble marca
actors.hero.talent.durable_projectiles.desc=_+1:_ Las armas arrojadizas tienen _+50% de durabilidad_ cuando las usa la Cazadora.\n\n_+2:_ Las armas arrojadizas tienen _+75% de durabilidad_ cuando las usa la Cazadora.
actors.hero.talent.durable_projectiles.title=proyectiles duraderos
actors.hero.talent.durable_tips.desc=_+1:_ Los dardos con punta tienen _2x durabilidad_ cuando el Guardián los usa.\n\n_+2:_ Los dardos con punta tienen _3x durabilidad_ cuando el Guardián los usa.\n\n_+3:_ Los dardos con punta tienen _4x durabilidad_ cuando el Guardián los usa.
actors.hero.talent.durable_tips.title=Puntas duraderas
actors.hero.talent.eagle_eye.desc=_+1:_ El rango de visión del halcón espiritual aumenta a _7 casillas_ de 6.\n\n_+2:_ El rango de visión del halcón espiritual aumenta a _8 casillas_ de 6.\n\n_+3:_ El rango de visión del halcón espiritual aumenta a _9 casillas_ de 6, y obtiene _2 casillas_ de visión mental.\n\n_+4:_ El rango de visión del halcón espiritual aumenta a _10 casillas_ de 6, y obtiene _3 casillas_ de visión mental.
actors.hero.talent.eagle_eye.title=ojo de águila
actors.hero.talent.elemental_power.desc=_+1:_ El poder de la explosión elemental aumenta en _25%_.\n\n_+2:_ El poder de la explosión elemental aumenta en _50%_.\n\n_+3:_ El poder de la explosión elemental aumenta en _75%_.\n\n_+4:_ El poder de la explosión elemental aumenta en _100%_.
actors.hero.talent.elemental_power.title=poder elemental
actors.hero.talent.elemental_reach.desc=_+1:_ El alcance del golpe elemental aumenta de 4 a _5 casillas_ y su ancho aumenta de 65 a _75 grados_.\n\n_+2:_ El alcance del golpe elemental aumenta de 4 a _6 casillas_ y su ancho aumenta de 65 a _85 grados_.\n\n_+3:_ El alcance del golpe elemental aumenta de 4 a _7 casillas_ y su ancho aumenta de 65 a _95 grados_.\n\n_+4:_ El alcance del golpe elemental aumenta de 4 a _8 casillas_ y su ancho aumenta de 65 a _105 grados_.
actors.hero.talent.elemental_reach.title=alcance elemental
actors.hero.talent.elimination_match.desc=_+1:_ Si el Duelista vuelve a desafiar dentro de los 3 turnos de un duelo que termina, ese desafío tiene un coste de carga _16% reducido_.\n\n_+2:_ Si el Duelista vuelve a desafiar dentro de los 3 turnos de un duelo que termina, ese desafío tiene un coste de carga _30% reducido_.\n\n_+3:_ Si el Duelista vuelve a desafiar dentro de los 3 turnos de un duelo que termina, ese desafío tiene un coste de carga _40% reducido_.\n\n_+4:_ Si el Duelista vuelve a desafiar dentro de los 3 turnos de un duelo que termina, ese desafío tiene un coste de carga _50% reducido_.
actors.hero.talent.elimination_match.title=partido de eliminación
actors.hero.talent.empowered_strike.desc=_+1:_ El primer golpe cuerpo a cuerpo del Mago de Batalla con su bastón después de usar el suyo inflige _+16% de daño_ y el efecto adicional del bastón obtiene _+50% de poder_.\n\n_+2:_ El primer golpe cuerpo a cuerpo del Mago de Batalla con su bastón después de usar el suyo inflige _+33% de daño_ y el efecto adicional del bastón obtiene _+100% de poder_.\n\n_+3:_ El primer golpe cuerpo a cuerpo del Mago de Batalla con su bastón después de usar el suyo inflige _+50% de daño_ y el efecto adicional del bastón obtiene _+150% de poder_.
actors.hero.talent.empowered_strike.title=huelga empoderada
actors.hero.talent.empowering_meal.desc=_+1:_ Comer comida otorga al mago _2 de daño adicional_ en las próximas 3 veces que cause daño con una varita.\n\n_+2:_ Comer comida otorga al mago _3 de daño adicional_ en las próximas 3 veces que cause daño con una varita.
actors.hero.talent.empowering_meal.title=comida energizante
actors.hero.talent.endless_rage.desc=_+1:_ El Berserker puede alcanzar un máximo de _116% de furia_.\n\n_+2:_ El Berserker puede alcanzar un máximo de _133% de furia_.\n\n_+3:_ El Berserker puede alcanzar un máximo de _150% de furia_.\n\nCada punto de furia por encima del 100% aumenta el escudo berserker en un 1% y reduce el tiempo de reutilización en un 1%, pero no aumenta la bonificación de daño más allá del +50%.
actors.hero.talent.endless_rage.title=furia sin fin
actors.hero.talent.energizing_meal.desc=_+1:_ Comer comida le quita al mago 1 turno y le otorga _5 turnos de recarga de varita_.\n\n_+2:_ Comer comida le quita al mago 1 turno y le otorga _8 turnos de recarga de varita_.
actors.hero.talent.energizing_meal.title=comida energizante
actors.hero.talent.enhanced_combo.desc=_+1:_ Cuando el combo del Gladiador es 7 o más, el alcance de retroceso de Clobber aumenta a 3, inflige vértigo y puede empujar a los enemigos a pozos.\n\n_+2:_ Además de los beneficios de +1, cuando el combo del Gladiador es 9 o más, Parry funciona en múltiples ataques.\n\n_+3:_ Además de los beneficios de +1 y +2, el Gladiador puede saltar hasta combo/3 casillas cuando usa Slam, Crush o Fury.
actors.hero.talent.enhanced_combo.title=combo mejorado
actors.hero.talent.enhanced_lethality.desc=_+1:_ El Asesino puede asesinar enemigos que queden con menos del _4/13/27/67% de salud_ por nivel de preparación, en lugar del 3/10/20/50%.\n\n_+2:_ El Asesino puede asesinar enemigos que queden con menos del _5/17/33/83% de salud_ por nivel de preparación, en lugar del 3/10/20/50%.\n\n_+3:_ El Asesino puede asesinar enemigos que queden con menos del _6/20/40/100% de salud_ por nivel de preparación, en lugar del 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=letalidad aumentada
actors.hero.talent.enhanced_rings.desc=_+1:_ Cuando el Pícaro usa un artefacto, sus anillos obtienen una mejora de +1 durante _3 turnos_.\n\n_+2:_ Cuando el Pícaro usa un artefacto, sus anillos obtienen una mejora de +1 durante _6 turnos_.\n\n_+3:_ Cuando el Pícaro usa un artefacto, sus anillos obtienen una mejora de +1 durante _9 turnos_.
actors.hero.talent.enhanced_rings.title=anillos realzados
actors.hero.talent.enlightening_meal.desc=_+1:_ Comer comida le quita al clérigo 1 turno y le otorga _0.67 cargas_ en su tomo sagrado.\n\n_+2:_ Comer comida le quita al clérigo 1 turno y le otorga _1 carga_ en su tomo sagrado.
actors.hero.talent.enlightening_meal.meta_desc=Si este talento lo adquiere otro héroe, le otorgará 2 turnos de recarga de varita y artefacto a +1, o 3 turnos a +2. No se puede usar para recargar el cuerno de la abundancia.
actors.hero.talent.enlightening_meal.title=Comida esclarecedora
actors.hero.talent.enraged_catalyst.desc=_+1:_ Los encantamientos y maldiciones en el arma del Berserker se activan con más frecuencia cuanto más furia tenga, hasta un máximo de _15% más a menudo_ al 100% de furia.\n\n_+2:_ Los encantamientos y maldiciones en el arma del Berserker se activan con más frecuencia cuanto más furia tenga, hasta un máximo de _30% más a menudo_ al 100% de furia.\n\n_+3:_ Los encantamientos y maldiciones en el arma del Berserker se activan con más frecuencia cuanto más furia tenga, hasta un máximo de _45% más a menudo_ al 100% de furia.
actors.hero.talent.enraged_catalyst.title=catalizador enfurecido
actors.hero.talent.evasive_armor.desc=_+1:_ Mientras corre libremente, el Freerunner gana _+1 evasión_ adicional por cada punto excedente de fuerza en su armadura.\n\n_+2:_ Mientras corre libre, el Freerunner gana _+2 evasión_ adicional por cada punto excedente de fuerza en su armadura.\n\n_+3:_ Mientras corre libre, el Freerunner gana un adicional _+3 evasión_ por cada punto sobrante de fuerza en su armadura.
actors.hero.talent.evasive_armor.title=armadura evasiva
actors.hero.talent.even_the_odds.desc=_+1:_ El Guerrero inflige un _5% de daño adicional_ por cada enemigo dentro de 2 casillas cuando termina la resistencia.\n\n_+2:_ El Guerrero inflige un _10% de daño adicional_ por cada enemigo dentro de 2 casillas cuando termina la resistencia.\n\n_+3:_ El Guerrero inflige un _15% de daño adicional_ por cada enemigo dentro de 2 casillas cuando termina la resistencia.\n\n_+4:_ El Guerrero inflige un _20% de daño adicional_ por cada enemigo dentro de 2 casillas cuando termina la resistencia.
actors.hero.talent.even_the_odds.title=igualar las probabilidades
actors.hero.talent.excess_charge.desc=_+1:_ Cuando el bastón del Mago de Batalla esté completamente cargado, su siguiente descarga le otorgará _0.67 de escudo_ por nivel del bastón.\n\n_+2:_ Cuando el bastón del Mago de Batalla esté completamente cargado, su siguiente descarga le otorgará _1.33 de escudo_ por nivel del bastón.\n\n_+3:_ Cuando el bastón del Mago de Batalla esté completamente cargado, su siguiente descarga le otorgará _2 de escudo_ por nivel del bastón.
actors.hero.talent.excess_charge.title=cargo adicional
actors.hero.talent.expanding_wave.desc=_+1:_ El alcance de Shockwave aumenta a _6 casillas_ de 5, y su ancho aumenta a _75 grados_ de 60.\n\n_+2:_ El alcance de Shockwave aumenta a _7 casillas_ de 5, y su ancho aumenta a _90 grados_ de 60.\n\n_+3:_ El alcance de Shockwave aumenta a _8 casillas_ de 5, y su ancho aumenta a _105 grados_ de 60.\n\n_+4:_ El alcance de Shockwave aumenta a _9 casillas_ de 5, y su ancho aumenta a _120 grados_ de 60.
actors.hero.talent.expanding_wave.title=onda en expansión
actors.hero.talent.expose_weakness.desc=_+1:_ Los enemigos que atacan la imagen residual del Duelista se vuelven débiles y vulnerables durante _2 turnos_.\n\n_+2:_ Los enemigos que atacan la imagen residual del Duelista se vuelven débiles y vulnerables durante _4 turnos_.\n\n_+3:_ Los enemigos que atacan la imagen residual del Duelista se vuelven débiles y vulnerables durante _6 turnos_.\n\n_+4:_ Los enemigos que atacan la imagen residual del Duelista se vuelven débiles y vulnerables durante _8 turnos_.
actors.hero.talent.expose_weakness.title=exponer debilidad
actors.hero.talent.fan_of_blades.desc=_+1:_ Las cuchillas espectrales pueden golpear hasta _1 objetivo adicional_ para un 50% de daño. El objetivo debe ser visible y estar dentro de un área de efecto de cono de _30 grados_.\n\n_+2:_ Las cuchillas espectrales pueden golpear hasta _2 objetivos adicionales_ para un 50% de daño. Los objetivos deben ser visibles y estar dentro de un área de efecto de cono de _60 grados_.\n\n_+3:_ Las cuchillas espectrales pueden golpear hasta _3 objetivos adicionales_ para un 50% de daño. Los objetivos deben ser visibles y estar dentro de un área de efecto de cono de _90 grados_.\n\n_+4:_ Las cuchillas espectrales pueden golpear hasta _4 objetivos adicionales_ para un 50% de daño. Los objetivos deben ser visibles y estar dentro de un área de efecto de cono de _120 grados_.
actors.hero.talent.fan_of_blades.title=ventilador de aspas
actors.hero.talent.farsight.desc=_+1:_ El rango de visión del francotirador aumenta en un 25 %.\n\n_+2:_ El rango de visión del francotirador aumenta en un 50 %.\n\n_+3:_ El rango de visión del francotirador aumenta en un 75 %.
actors.hero.talent.farsight.title=visión de futuro
actors.hero.talent.fear_the_reaper.desc=_+1:_ Cuando un enemigo marcado con la muerte llega a 0 puntos de vida, se vuelve _lisiado_.\n\n_+2:_ Cuando un enemigo marcado con la muerte llega a 0 puntos de vida, se vuelve _temeroso y lisiado_.\n\n_+3:_ Cuando un enemigo marcado con la muerte llega a 0 puntos de vida, se vuelve _temeroso y lisiado_ y los enemigos dentro de 3 casillas se vuelven _lisiados_.\n\n_+4:_ Cuando un enemigo marcado con la muerte llega a 0 puntos de vida, se vuelve _temeroso y lisiado_ y los enemigos dentro de 3 casillas se vuelven _temerosos y lisiados_.
actors.hero.talent.fear_the_reaper.title=teme a la muerte
actors.hero.talent.feigned_retreat.desc=_+1:_ Si un enemigo ataca la imagen residual de la Duelista, ella gana _2 turnos_ de prisa.\n\n_+2:_ Si un enemigo ataca la imagen residual de la Duelista, ella gana _4 turnos_ de prisa.\n\n_+3:_ Si un enemigo ataca la imagen residual de la Duelista, ella gana _6 turnos_ de prisa.\n\n_+4:_ Si un enemigo ataca la imagen residual de la Duelista, ella gana _8 turnos_ de prisa.
actors.hero.talent.feigned_retreat.title=retirada fingida
actors.hero.talent.fire_everything.desc=_+1:_ La magia salvaje ahora dispara _5 veces_ en lugar de 4, y cada varita tiene una _25% de probabilidad_ de ser utilizable 3 veces.\n\n_+2:_ La magia salvaje ahora dispara _6 veces_ en lugar de 4, y cada varita tiene una _50% de probabilidad_ de ser utilizable 3 veces.\n\n_+3:_ La magia salvaje ahora dispara _7 veces_ en lugar de 4, y cada varita tiene una _75% de probabilidad_ de ser utilizable 3 veces.\n\n_+4:_ La magia salvaje ahora dispara _8 veces_ en lugar de 4, y cada varita tiene una _100% de probabilidad_ de ser utilizable 3 veces.
actors.hero.talent.fire_everything.title=quemar todo
actors.hero.talent.flash.desc=_+1:_ Mientras esté en Forma Ascendida, el Clérigo puede lanzar _Flash_ para teletransportarse hasta _3 casillas_ de distancia.\n\n_+2:_ Mientras esté en Forma Ascendida, el Clérigo puede lanzar _Flash_ para teletransportarse hasta _4 casillas_ de distancia.\n\n_+3:_ Mientras esté en Forma Ascendida, el Clérigo puede lanzar _Flash_ para teletransportarse hasta _5 casillas_ de distancia.\n\n_+4:_ Mientras esté en Forma Ascendida, el Clérigo puede lanzar _Flash_ para teletransportarse hasta _6 casillas_ de distancia.\n\nFlash cuesta 2 cargas de tomo inicialmente, y 1 carga más por cada uso en la misma forma ascendida.
actors.hero.talent.flash.title=destello
actors.hero.talent.focused_meal.desc=_+1:_ Comer comida le quita a la Duelista 1 turno y le otorga _0.67 cargas_ en sus armas.\n\n_+2:_ Comer comida le quita a la Duelista 1 turno y le otorga _1 carga_ en sus armas.
actors.hero.talent.focused_meal.meta_desc=_Si este talento lo obtiene otro héroe_, en su lugar le otorgará daño adicional a su siguiente golpe igual a su nivel/3 con +1, o nivel/2 con +2.
actors.hero.talent.focused_meal.title=comida centrada
actors.hero.talent.followup_strike.desc=_+1:_ Cuando la Cazadora golpea a un enemigo con su arco o un arma arrojadiza, su siguiente ataque cuerpo a cuerpo contra ese enemigo inflige _2 de daño adicional_.\n\n_+2:_ Cuando la Cazadora golpea a un enemigo con su arco o un arma arrojadiza, su siguiente ataque cuerpo a cuerpo contra ese enemigo inflige _3 de daño adicional_.
actors.hero.talent.followup_strike.title=ataque de seguimiento
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Los ataques del halcón espiritual ciegan a los enemigos durante _2 turnos_.\n\n_+2:_ Los ataques del halcón espiritual ciegan a los enemigos durante _5 turnos_.\n\n_+3:_ Los ataques del halcón espiritual ciegan a los enemigos durante _5 turnos_ y los incapacitan durante _2 turnos_.\n\n_+4:_ Los ataques del halcón espiritual ciegan a los enemigos durante _5 turnos_ y los incapacitan durante _5 turnos_.
actors.hero.talent.go_for_the_eyes.title=ve a por los ojos
actors.hero.talent.growing_power.desc=_+1:_ Los aumentos de ataque y velocidad de movimiento del poder de la naturaleza aumentan a _38% y 125%_, desde 33% y 100%.\n\n_+2:_ Los aumentos de ataque y velocidad de movimiento del poder de la naturaleza aumentan a _42% y 150%_, desde 33% y 100%.\n\n_+3:_ Los aumentos de ataque y velocidad de movimiento del poder de la naturaleza aumentan a _46% y 175%_, desde 33% y 100%.\n\n_+4:_ Los aumentos de ataque y velocidad de movimiento del poder de la naturaleza aumentan a _50% y 200%_, desde 33% y 100%.
actors.hero.talent.growing_power.title=creciente poder
actors.hero.talent.hallowed_ground.desc=_+1:_ El Sacerdote puede lanzar _Tierra Sagrada_, un hechizo que consagra el terreno en un área de _3x3_ durante 20 turnos, a un costo de 2 cargas.\n\n_+2:_ El Sacerdote puede lanzar _Tierra Sagrada_, un hechizo que consagra el terreno en un área de _5x5_ durante 20 turnos, a un costo de 2 cargas.\n\n_+3:_ El Sacerdote puede lanzar _Tierra Sagrada_, un hechizo que consagra el terreno en un área de _7x7_ durante 20 turnos, a un costo de 2 cargas.\n\nCuando se lanza, Tierra Sagrada cura a los aliados por 15 PV, enraíza brevemente a los enemigos y extiende hierba corta. Después, cura lentamente a los aliados, paraliza a los enemigos y hace que crezca hierba alta aleatoriamente. El terreno sagrado otorga protección al sacerdote en lugar de curación y es destruido por el fuego.
actors.hero.talent.hallowed_ground.title=tierra sagrada
actors.hero.talent.hasty_retreat.desc=_+1:_ Después de parpadear, el Pícaro obtiene _1 turno_ de prisa e invisibilidad.\n\n_+2:_ Después de parpadear, el Pícaro obtiene _2 turnos_ de prisa e invisibilidad.\n\n_+3:_ Después de parpadear, el Pícaro obtiene _3 turnos_ de prisa e invisibilidad.\n\n_+4:_ Después de parpadear, el Pícaro obtiene _4 turnos_ de prisa e invisibilidad.
actors.hero.talent.hasty_retreat.title=retirada apresurada
actors.hero.talent.hearty_meal.desc=_+1:_ Comer alimentos cura al Guerrero por _4 HP_ cuando tiene un 33% o menos de salud.\n\n_+2:_ Comer alimentos cura al Guerrero por _6 HP_ cuando tiene un 33% o menos de salud.
actors.hero.talent.hearty_meal.title=comida abundante
actors.hero.talent.heightened_senses.desc=_+1:_ La Cazadora obtiene visión mental de los personajes que se encuentren a _2 casillas de su posición_.\n\n_+2:_ La Cazadora obtiene visión mental de los personajes que se encuentren a _3 casillas de su posición_.
actors.hero.talent.heightened_senses.title=sentidos agudizados
actors.hero.talent.heroic_energy.desc=_+1:_ La habilidad de armadura del héroe tiene un coste de carga _12% reducido_.\n\n_+2:_ La habilidad de armadura del héroe tiene un coste de carga _23% reducido_.\n\n_+3:_ La habilidad de armadura del héroe tiene un coste de carga _32% reducido_.\n\n_+4:_ La habilidad de armadura del héroe tiene un coste de carga _40% reducido_.
actors.hero.talent.heroic_energy.rat_title=energía rátroica
actors.hero.talent.heroic_energy.title=energía heroica
actors.hero.talent.hold_fast.desc=_+1:_ Cuando el Guerrero espera, obtiene _1-2 de armadura_ y ralentiza la disminución de los potenciadores de combo y escudo en _50%_ hasta que se mueve.\n\n_+2:_ Cuando el Guerrero espera, obtiene _2-4 de armadura_ y ralentiza la disminución de los potenciadores de combo y escudo en _75%_ hasta que se mueve.\n\n_+3:_ Cuando el Guerrero espera, obtiene _3-6 de armadura_ y ralentiza la disminución de los potenciadores de combo y escudo en _100%_ hasta que se mueve.
actors.hero.talent.hold_fast.title=Agárrate fuerte
actors.hero.talent.holy_intuition.desc=_+1:_ El clérigo puede lanzar _Intuición Sagrada_, un conjuro que revela si un objeto está maldito a un coste de _3 cargas._\n\n_+2:_ El clérigo puede lanzar _Intuición Sagrada_, un conjuro que revela si un objeto está maldito a un coste de _2 cargas._
actors.hero.talent.holy_intuition.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar le permitirá al héroe identificar el estado de maldición en un objeto maldito justo antes de equiparlo, el 15% de las veces en +1 o el 25% de las veces en +2.
actors.hero.talent.holy_intuition.title=intuición sagrada
actors.hero.talent.holy_lance.desc=_+1:_ El Sacerdote puede lanzar _Lanza Sagrada_, un hechizo devastador que inflige _30-55 de daño_ a un costo de 4 cargas.\n\n_+2:_ El Sacerdote puede lanzar _Lanza Sagrada_, un hechizo devastador que inflige _45-83 de daño_ a un costo de 4 cargas.\n\n_+3:_ El Sacerdote puede lanzar _Lanza Sagrada_, un hechizo devastador que inflige _60-110 de daño_ a un costo de 4 cargas.\n\nLanza Sagrada siempre inflige el daño máximo a enemigos demoníacos y no muertos. Lanza Sagrada tiene un tiempo de reutilización de 30 turnos antes de poder ser lanzada de nuevo.
actors.hero.talent.holy_lance.title=lanza santa
actors.hero.talent.impact_wave.desc=_+1:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _2 casillas_ hacia atrás y tienen un _25% de probabilidad_ de volverse vulnerables durante 5 turnos.\n\n_+2:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _3 casillas_ hacia atrás y tienen un _50% de probabilidad_ de volverse vulnerables durante 5 turnos.\n\n_+3:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _4 casillas_ hacia atrás y tienen un _75% de probabilidad_ de volverse vulnerables durante 5 turnos.\n\n_+4:_ Cuando el Guerrero aterriza después de saltar, todos los enemigos adyacentes son empujados _5 casillas_ hacia atrás y tienen un _100% de probabilidad_ de volverse vulnerables durante 5 turnos.
actors.hero.talent.impact_wave.title=onda de impacto
actors.hero.talent.improvised_projectiles.desc=_+1:_ El guerrero puede cegar a un enemigo durante _2 turnos_ arrojándole cualquier objeto que no sea un arma arrojadiza. Esto tiene un tiempo de reutilización de 50 turnos.\n\n_+2:_ El guerrero puede cegar a un enemigo durante _3 turnos_ arrojándole cualquier objeto que no sea un arma arrojadiza. Esto tiene un tiempo de reutilización de 50 turnos.
actors.hero.talent.improvised_projectiles.title=proyectiles improvisados
actors.hero.talent.inscribed_power.desc=_+1:_ Cuando el Mago lee un pergamino o usa un objeto de hechizo, sus _próximos 2 descargas de varita_ obtienen +2 niveles.\n\n_+2:_ Cuando el Mago lee un pergamino o usa un objeto de hechizo, sus _próximos 3 descargas de varita_ obtienen +2 niveles.\n\nEl número de descargas de varita mejoradas se duplica al usar un pergamino de mejora, transmutación o objetos de alquimia que deben crearse usando esos pergaminos.\n\nPara objetos de alquimia con cantidades de salida más altas (por ejemplo, la mayoría de los hechizos), este talento tiene una probabilidad de activarse en función de cuántos de ese objeto se produzcan.
actors.hero.talent.inscribed_power.title=poder inscrito
actors.hero.talent.inscribed_stealth.desc=_+1:_ El Pícaro obtiene _3 turnos_ de invisibilidad después de leer un pergamino o usar un objeto de hechizo.\n\n_+2:_ El Pícaro obtiene _5 turnos_ de invisibilidad después de leer un pergamino o usar un objeto de hechizo.\n\nLa duración de la invisibilidad se duplica al usar un pergamino de mejora, un pergamino de transmutación o objetos de alquimia que deben crearse usando esos pergaminos.\n\nPara objetos de alquimia con cantidades de producción más altas (por ejemplo, la mayoría de los hechizos), este talento tiene una probabilidad de activarse en función de cuántos de ese objeto se produzcan.
actors.hero.talent.inscribed_stealth.title=sigilo inscrito
actors.hero.talent.invigorating_meal.desc=_+1:_ Comer comida le toma a la Cazadora 1 turno (las bayas se comen instantáneamente) y le otorga _1 turno de prisa_.\n\n_+2:_ Comer comida le toma a la Cazadora 1 turno (las bayas se comen instantáneamente) y le otorga _2 turnos de prisa_.
actors.hero.talent.invigorating_meal.title=comida revitalizante
actors.hero.talent.invigorating_victory.desc=_+1:_ Si la Duelista derrota a su objetivo antes de que termine el duelo, se cura _5 HP más el 30% del daño_ que recibió durante el duelo.\n\n_+2:_ Si la Duelista derrota a su objetivo antes de que termine el duelo, se cura _10 HP más el 50% del daño_ que recibió durante el duelo.\n\n_+3:_ Si la Duelista derrota a su objetivo antes de que termine el duelo, se cura _15 HP más el 65% del daño_ que recibió durante el duelo.\n\n_+4:_ Si la Duelista derrota a su objetivo antes de que termine el duelo, se cura _20 HP más el 75% del daño_ que recibió durante el duelo.
actors.hero.talent.invigorating_victory.title=victoria vigorizante
actors.hero.talent.iron_stomach.desc=_+1:_ Comer comida le quita al Guerrero 1 turno y le otorga _75% de resistencia al daño_ mientras come.\n\n_+2:_ Comer comida le quita al Guerrero 1 turno y le otorga _100% de resistencia al daño_ mientras come.
actors.hero.talent.iron_stomach.title=estómago de hierro
actors.hero.talent.iron_will.desc=_+1:_ El escudo proporcionado por el sello del guerrero se _aumenta en 1_.\n\n_+2:_ El escudo proporcionado por el sello del guerrero se _aumenta en 2_.
actors.hero.talent.iron_will.meta_desc=_Si este talento lo obtiene un héroe diferente_, otorgará pasivamente una versión de escudo máximo de 1 o 2 del efecto de sello roto del Guerrero.
actors.hero.talent.iron_will.title=voluntad de hierro
actors.hero.talent.judgement.desc=_+1:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Juicio_, que inflige _10-20 de daño_ a todos los enemigos visibles.\n\n_+2:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Juicio_, que inflige _15-30 de daño_ a todos los enemigos visibles.\n\n_+3:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Juicio_, que inflige _20-40 de daño_ a todos los enemigos visibles.\n\n_+4:_ Mientras está en Forma Ascendida, el Clérigo puede lanzar _Juicio_, que inflige _25-50 de daño_ a todos los enemigos visibles.\n\nJuicio cuesta 3 cargas de tomo. El hechizo Juicio inflige un +33% de daño por cada hechizo que el clérigo haya lanzado desde que entró en forma ascendida o desde el último lanzamiento de Juicio.
actors.hero.talent.judgement.title=juicio
actors.hero.talent.lay_on_hands.desc=_+1:_ El Paladín puede lanzar _Imposición de Manos_, un hechizo que cura instantáneamente a un personaje cercano por _15 HP_, o le otorga al Paladín _15 de escudo_, a un costo de 1 carga.\n\n_+2:_ El Paladín puede lanzar _Imposición de Manos_, un hechizo que cura instantáneamente a un personaje cercano por _20 HP_, o le otorga al Paladín _20 de escudo_, a un costo de 1 carga.\n\n_+3:_ El Paladín puede lanzar _Imposición de Manos_, un hechizo que cura instantáneamente a un personaje cercano por _25 HP_, o le otorga al Paladín _25 de escudo_, a un costo de 1 carga.\n\nLa curación sobrante de este hechizo se convierte en escudo. El conjuro Imposición de Manos se puede lanzar repetidamente, pero no puede aplicar más de tres lanzamientos de protección a la vez.
actors.hero.talent.lay_on_hands.title=imposición de manos
actors.hero.talent.lethal_defense.desc=_+1:_ Cuando el Gladiador mata a un enemigo con un movimiento combinado, el tiempo de reutilización de su escudo de sello roto se reduce en 50 turnos.\n\n_+2:_ Cuando el Gladiador mata a un enemigo con un movimiento combinado, el tiempo de reutilización de su escudo de sello roto se reduce en 100 turnos.\n\n_+3:_ Cuando el Gladiador mata a un enemigo con un movimiento combinado, el tiempo de reutilización de su escudo de sello roto se reduce en 150 turnos.\n\nEl tiempo de reutilización del escudo se puede reducir hasta -150 turnos con este talento, lo que significa que estará disponible de nuevo inmediatamente una vez que se active.
actors.hero.talent.lethal_defense.title=defensa letal
actors.hero.talent.lethal_haste.desc=_+1:_ Cuando la Duelista asesta un golpe mortal a un enemigo con una habilidad de arma, obtiene _3 turnos_ de movimiento instantáneo.\n\n_+2:_ Cuando la Duelista asesta un golpe mortal a un enemigo con una habilidad de arma, obtiene _5 turnos_ de movimiento instantáneo.
actors.hero.talent.lethal_haste.meta_desc=Si este talento lo adquiere otro héroe, se activará con los ataques de armas normales, con un tiempo de reutilización de 100 turnos.
actors.hero.talent.lethal_haste.title=prisa letal
actors.hero.talent.lethal_momentum.desc=_+1:_ Cuando el Guerrero asesta un golpe mortal a un enemigo con un arma física, tiene un _67% de probabilidad_ de tomar 0 turnos.\n\n_+2:_ Cuando el Guerrero asesta un golpe mortal a un enemigo con un arma física, tiene un _100% de probabilidad_ de tomar 0 turnos.
actors.hero.talent.lethal_momentum.title=impulso letal
actors.hero.talent.life_link.desc=El clérigo puede lanzar _Vínculo vital_ entre sí mismo y un aliado potenciado a un coste de 2 cargas. Este hechizo hace que el daño se comparta entre el clérigo y su aliado, y hace que los hechizos de clérigo beneficiosos de nivel 3 o inferior se apliquen a ambos si alguno se ve afectado.\n\n_+1:_ Vínculo vital dura _10 turnos_ y aumenta la bonificación de Poder de muchos a _-35% del daño recibido._\n\n_+2:_ Vínculo vital dura _13 turnos_ y aumenta la bonificación de Poder de muchos a _-40% del daño recibido._\n\n_+3:_ Vínculo vital dura _17 turnos_ y aumenta la bonificación de Poder de muchos a _-45% del daño recibido._\n\n_+4:_ Vínculo vital dura _20 turnos_ y aumenta la bonificación de Poder de muchos a _-50% del daño recibido._
actors.hero.talent.life_link.title=vínculo vital
actors.hero.talent.light_cloak.desc=_+1:_ El Pícaro puede usar su capa de sombras cuando no está equipada, pero se recarga a _25% de velocidad_ cuando no está equipada.\n\n_+2:_ El Pícaro puede usar su capa de sombras cuando no está equipada, pero se recarga a _50% de velocidad_ cuando no está equipada.\n\n_+3:_ El Pícaro puede usar su capa de sombras cuando no está equipada, pero se recarga a _75% de velocidad_ cuando no está equipada.
actors.hero.talent.light_cloak.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar aumentará la velocidad de carga de todos los artefactos en un 7/13/20% en +1/+2/+3.
actors.hero.talent.light_cloak.title=capa de luz
actors.hero.talent.light_reading.desc=_+1:_ El clérigo puede usar su tomo sagrado cuando no está equipado, pero se recarga a _25% de velocidad_ cuando no está equipado.\n\n_+2:_ El clérigo puede usar su tomo sagrado cuando no está equipado, pero se recarga a _50% de velocidad_ cuando no está equipado.\n\n_+3:_ El clérigo puede usar su tomo sagrado cuando no está equipado, pero se recarga a _75% de velocidad_ cuando no está equipado.
actors.hero.talent.light_reading.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar aumentará la velocidad de recarga de todas las varitas en un 7/13/20% en +1/+2/+3.
actors.hero.talent.light_reading.title=Lectura ligera
actors.hero.talent.lingering_magic.desc=_+1:_ Cuando el mago lanza un rayo con una varita o bastón, su siguiente ataque físico inflige _1-2 de daño adicional_.\n\n_+2:_ Cuando el mago lanza un rayo con una varita o bastón, su siguiente ataque físico inflige _2 de daño adicional_.
actors.hero.talent.lingering_magic.title=magia persistente
actors.hero.talent.liquid_agility.desc=_+1:_ Al beber o lanzar una poción, brebaje o elixir, la Duelista tiene _3x de evasión_ y _3x de precisión_ en su siguiente ataque cuerpo a cuerpo dentro de 5 turnos.\n\n_+2:_ Al beber o lanzar una poción, brebaje o elixir, la Duelista tiene _evasión infinita_ y _precisión infinita_ en su siguiente ataque cuerpo a cuerpo dentro de 5 turnos.\n\nEsta bonificación dura un turno y ataque adicional cuando se usan pociones de fuerza, experiencia o artículos de alquimia que deben crearse usando esas pociones.\n\nPara artículos de alquimia con cantidades de producción más altas (por ejemplo, brebaje de agua), este talento tiene una probabilidad de activarse según la cantidad de ese artículo que se produzca.
actors.hero.talent.liquid_agility.title=agilidad líquida
actors.hero.talent.liquid_nature.desc=_+1:_ Cuando la Cazadora bebe o lanza una poción, brebaje o elixir, _hasta 4 casillas de hierba_ brotan en el área circundante, y los enemigos adyacentes quedan enraizados durante _1 turno_.\n\n_+2:_ Cuando la Cazadora bebe o lanza una poción, brebaje o elixir, _hasta 6 casillas de hierba_ brotan en el área circundante, y los enemigos adyacentes quedan enraizados durante _2 turnos_.\n\nLa cantidad de hierba y la duración de la raíz se duplican al usar pociones de fuerza, experiencia o artículos de alquimia que deben elaborarse con esas pociones.\n\nPara artículos de alquimia con cantidades de producción más altas (por ejemplo, brebaje de agua), este talento tiene una probabilidad de activarse en función de cuántos de ese artículo se produzcan.
actors.hero.talent.liquid_nature.title=naturaleza líquida
actors.hero.talent.liquid_willpower.desc=_+1:_ El guerrero obtiene _6.5% de su HP máximo en escudo_ al beber o lanzar una poción, brebaje o elixir.\n\n_+2:_ El guerrero obtiene _10% de su HP máximo en escudo_ al beber o lanzar una poción, brebaje o elixir.\n\nLa cantidad de escudo se duplica al usar pociones de fuerza, experiencia o artículos de alquimia que deben crearse usando esas pociones.\n\nPara artículos de alquimia con cantidades de producción más altas (por ejemplo, brebaje de agua), este talento tiene una probabilidad de activarse según la cantidad de ese artículo que se produzca.
actors.hero.talent.liquid_willpower.title=fuerza de voluntad líquida
actors.hero.talent.longrange_warp.desc=_+1:_ El mago ahora puede teletransportarse entre pisos, con un coste de carga del _150%_.\n\n_+2:_ El mago ahora puede teletransportarse entre pisos, con un coste de carga del _117%_.\n\n_+3:_ El mago ahora puede teletransportarse entre pisos, con un coste de carga del _83%_.\n\n_+4:_ El mago ahora puede teletransportarse entre pisos, con un coste de carga del _50%_.\n\nEl mago no puede usar la teletransportación de largo alcance para salir de un piso bloqueado.
actors.hero.talent.longrange_warp.title=Distorsión de largo alcance
actors.hero.talent.mind_form.desc=El clérigo puede lanzar _Forma Mental_, que imbuye a Trinity con el poder de una varita o arma arrojadiza que el clérigo haya usado en esta partida, a un costo de 3 cargas.\n\n_+1:_ Cuando se usa Trinity, el clérigo usa el efecto de descarga o lanzamiento del objeto elegido, como si fuera _+3._\n\n_+2:_ Cuando se usa Trinity, el clérigo usa el efecto de descarga o lanzamiento del objeto elegido, como si fuera _+4._\n\n_+3:_ Cuando se usa Trinity, el clérigo usa el efecto de descarga o lanzamiento del objeto elegido, como si fuera _+5._\n\n_+4:_ Cuando se usa Trinity, el clérigo usa el efecto de descarga o lanzamiento del objeto elegido, como si fuera _+6._\n\nTrinity solo puede ser imbuido con un efecto mental a la vez.
actors.hero.talent.mind_form.title=forma mental
actors.hero.talent.mnemonic_prayer.desc=_+1:_ El Sacerdote puede lanzar _Oración Mnemónica_, un hechizo que extiende las mejoras/penalizaciones en un aliado/enemigo durante _3 turnos_ con un coste de 1 carga.\n\n_+2:_ El Sacerdote puede lanzar _Oración Mnemónica_, un hechizo que extiende las mejoras/penalizaciones en un aliado/enemigo durante _4 turnos_ con un coste de 1 carga.\n\n_+3:_ El Sacerdote puede lanzar _Oración Mnemónica_, un hechizo que extiende las mejoras/penalizaciones en un aliado/enemigo durante _5 turnos_ con un coste de 1 carga.\n\nOración Mnemónica no requiere tiempo de lanzamiento. Oración Mnemónica solo puede extender una instancia particular de una mejora/penalización una vez, y no puede extender mejoras de habilidades de armadura.
actors.hero.talent.mnemonic_prayer.title=oración mnemotécnica
actors.hero.talent.monastic_vigor.desc=_+1:_ Si el Monje tiene _100% de energía_, sus habilidades se potencian.\n\n_+2:_ Si el Monje tiene _80% o más de energía_, sus habilidades se potencian.\n\n_+3:_ Si el Monje tiene _60% o más de energía_, sus habilidades se potencian.\n\nCuando se potencia:\n- Ráfaga aplica el encantamiento de tu arma\n- Enfoque es instantáneo\n- Carrera gana +4 de alcance\n- Patada de dragón inflige +50% de daño y aplica su efecto de retroceso y aturdimiento a todos los enemigos adyacentes\n- Meditar cura lentamente el 20% de los HP faltantes y otorga un 80% de resistencia al daño.
actors.hero.talent.monastic_vigor.title=vigor monástico
actors.hero.talent.mystical_charge.desc=_+1:_ Golpear con su bastón otorga al Mago de Batalla _0.5 turnos_ de recarga de artefacto.\n\n_+2:_ Golpear con su bastón otorga al Mago de Batalla _1 turno_ de recarga de artefacto.\n\n_+3:_ Golpear con su bastón otorga al Mago de Batalla _1.5 turnos_ de recarga de artefacto.
actors.hero.talent.mystical_charge.title=carga mística
actors.hero.talent.mystical_meal.desc=_+1:_ Comer comida le toma al Pícaro 1 turno (las raciones de suministro se comen instantáneamente) y le otorga _3 turnos de recarga de artefacto_.\n\n_+2:_ Comer comida le toma al Pícaro 1 turno (las raciones de suministro se comen instantáneamente) y le otorga _5 turnos de recarga de artefacto_.\n\nEste talento no se puede usar para dejar que el cuerno de la abundancia se recargue solo.
actors.hero.talent.mystical_meal.title=comida mística
actors.hero.talent.natures_aid.desc=_+1:_ La Cazadora obtiene 0-2 armadura de piel de corteza, que se desvanece cada _3 turnos_ cuando se activa el efecto de una planta en su visión.\n\n_+2:_ La Cazadora obtiene 0-2 armadura de piel de corteza, que se desvanece cada _5 turnos_ cuando se activa el efecto de una planta en su visión.
actors.hero.talent.natures_aid.title=ayuda de la naturaleza
actors.hero.talent.natures_bounty.desc=_+1:_ La Cazadora puede encontrar _4 bayas_ escondidas en la hierba alta mientras explora los siguientes pisos de la mazmorra.\n\n_+2:_ La Cazadora puede encontrar _6 bayas_ escondidas en la hierba alta mientras explora los siguientes pisos de la mazmorra.\n\nLas bayas se comen rápidamente, restauran una pequeña cantidad de saciedad y pueden contener una semilla utilizable.
actors.hero.talent.natures_bounty.title=la generosidad de la naturaleza
actors.hero.talent.natures_wrath.desc=_+1:_ Mientras el poder de la naturaleza está activo, los disparos del arco espiritual tienen una _8% de probabilidad_ de activar un efecto aleatorio de planta dañina.\n\n_+2:_ Mientras el poder de la naturaleza está activo, los disparos del arco espiritual tienen una _17% de probabilidad_ de activar un efecto aleatorio de planta dañina.\n\n_+3:_ Mientras el poder de la naturaleza está activo, los disparos del arco espiritual tienen una _25% de probabilidad_ de activar un efecto aleatorio de planta dañina.\n\n_+4:_ Mientras el poder de la naturaleza está activo, los disparos del arco espiritual tienen una _33% de probabilidad_ de activar un efecto aleatorio de planta dañina.\n\nLas plantas que se pueden activar son: hierba ciega, flor de fuego, casquete de hielo, musgo de la tristeza y enredadera de tormenta.
actors.hero.talent.natures_wrath.title=la ira de la naturaleza
actors.hero.talent.necromancers_minions.desc=_+1:_ Cuando un enemigo marcado con alma muere, el Brujo tiene un _13% de probabilidad_ de resucitarlo como un espectro corrupto.\n\n_+2:_ Cuando un enemigo marcado con alma muere, el Brujo tiene un _27% de probabilidad_ de resucitarlo como un espectro corrupto.\n\n_+3:_ Cuando un enemigo marcado con alma muere, el Brujo tiene un _40% de probabilidad_ de resucitarlo como un espectro corrupto.
actors.hero.talent.necromancers_minions.title=esbirros del nigromante
actors.hero.talent.patient_strike.desc=_+1:_ Si la Duelista espera antes de realizar un ataque cuerpo a cuerpo, infligirá _1-2 de daño adicional_.\n\n_+2:_ Si la Duelista espera antes de realizar un ataque cuerpo a cuerpo, infligirá _2 de daño adicional_.
actors.hero.talent.patient_strike.title=huelga de pacientes
actors.hero.talent.perfect_copy.desc=_+1:_ El clon de sombra gana _10%_ de los HP máximos del héroe y puede intercambiar lugares instantáneamente con el héroe hasta _1 casilla_ de distancia.\n\n_+2:_ El clon de sombra gana _20%_ de los HP máximos del héroe y puede intercambiar lugares instantáneamente con el héroe hasta _2 casillas_ de distancia.\n\n_+3:_ El clon de sombra gana _30%_ de los HP máximos del héroe y puede intercambiar lugares instantáneamente con el héroe hasta _3 casillas_ de distancia.\n\n_+4:_ El clon de sombra gana _40%_ de los HP máximos del héroe y puede intercambiar lugares instantáneamente con el héroe hasta _4 casillas_ de distancia.
actors.hero.talent.perfect_copy.title=copia perfecta
actors.hero.talent.point_blank.desc=_+1:_ Cuando la Cazadora usa su arco o un arma arrojadiza a corta distancia, tiene _-25% de precisión_, en lugar de -50%.\n\n_+2:_ Cuando la Cazadora usa su arco o un arma arrojadiza a corta distancia, tiene _precisión normal_, en lugar de -50%.\n\n_+3:_ Cuando la Cazadora usa su arco o un arma arrojadiza a corta distancia, tiene _+25% de precisión_, en lugar de -50%.\n\nTenga en cuenta que las armas arrojadizas o el arco espiritual siempre tienen +50% de precisión cuando se usan a distancia.
actors.hero.talent.point_blank.title=a quemarropa
actors.hero.talent.precise_assault.desc=_+1:_ Cuando la Duelista usa una habilidad de arma, obtiene _2x precisión_ en su próximo ataque cuerpo a cuerpo dentro de 5 turnos.\n\n_+2:_ Cuando la Duelista usa una habilidad de arma, obtiene _5x precisión_ en su próximo ataque cuerpo a cuerpo dentro de 5 turnos.\n\n_+3:_ Cuando la Duelista usa una habilidad de arma, obtiene _precisión infinita_ en su próximo ataque cuerpo a cuerpo dentro de 5 turnos.
actors.hero.talent.precise_assault.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar aumentará la precisión cuerpo a cuerpo en un 10% en +1, un 20% en +2 o un 30% en +3.
actors.hero.talent.precise_assault.title=asalto preciso
actors.hero.talent.projectile_momentum.desc=_+1:_ Mientras corres libremente, el Corredor Libre obtiene _+50% de precisión y +15% de daño_ con armas arrojadizas.\n\n_+2:_ Mientras corres libremente, el Corredor Libre obtiene _+100% de precisión y +30% de daño_ con armas arrojadizas.\n\n_+3:_ Mientras corres libremente, el Corredor Libre obtiene _+150% de precisión y +45% de daño_ con armas arrojadizas.
actors.hero.talent.projectile_momentum.title=impulso del proyectil
actors.hero.talent.projecting_blades.desc=_+1:_ Las cuchillas espectrales tienen _+25% de precisión_ y pueden penetrar hasta _2 casillas sólidas_.\n\n_+2:_ Las cuchillas espectrales tienen _+50% de precisión_ y pueden penetrar hasta _4 casillas sólidas_.\n\n_+3:_ Las cuchillas espectrales tienen _+75% de precisión_ y pueden penetrar hasta _6 casillas sólidas_.\n\n_+4:_ Las cuchillas espectrales tienen _+100% de precisión_ y pueden penetrar hasta _8 casillas sólidas_.
actors.hero.talent.projecting_blades.title=cuchillas salientes
actors.hero.talent.protective_shadows.desc=_+1:_ El Pícaro obtiene un escudo _cada dos turnos_ que es invisible, _hasta un máximo de 3_.\n\n_+2:_ El Pícaro obtiene un escudo _cada turno_ que es invisible, _hasta un máximo de 5_.
actors.hero.talent.protective_shadows.title=sombras protectoras
actors.hero.talent.provoked_anger.desc=_+1:_ Cuando cualquier mejora de escudo aplicada al Guerrero se rompe por daño, su siguiente ataque físico infligirá _3 de daño adicional_.\n\n_+2:_ Cuando cualquier mejora de escudo aplicada al Guerrero se rompe por daño, su siguiente ataque físico infligirá _5 de daño adicional_.
actors.hero.talent.provoked_anger.title=provocó ira
actors.hero.talent.ratforcements.desc=_+1:_ Usar ratmogrify en ti mismo _genera 1_ rata marsupial aliada junto a ti.\n\n_+2:_ Usar ratmogrify en ti mismo _genera 2_ ratas marsupiales aliadas junto a ti.\n\n_+3:_ Usar ratmogrify en ti mismo _genera 3_ ratas marsupiales aliadas junto a ti.\n\n_+4:_ Usar ratmogrify en ti mismo _genera 4_ ratas marsupiales aliadas junto a ti.
actors.hero.talent.ratforcements.title=refuerzos contra ratas
actors.hero.talent.ratlomacy.desc=_+1:_ Usar ratmogrify en un enemigo ratmogrificado lo vuelve amistoso y hace que la transformación sea permanente.\n\n_+2:_ Usar ratmogrify en un enemigo ratmogrificado lo vuelve amistoso, hace que la transformación sea permanente y le da _2 turnos_ de adrenalina.\n\n_+3:_ Usar ratmogrify en un enemigo ratmogrificado lo vuelve amistoso, hace que la transformación sea permanente y le da _4 turnos_ de adrenalina.\n\n_+4:_ Usar ratmogrify en un enemigo ratmogrificado lo vuelve amistoso, hace que la transformación sea permanente y le da _6 turnos_ de adrenalina.
actors.hero.talent.ratlomacy.title=ratalomacía
actors.hero.talent.ratsistance.desc=_+1:_ Los enemigos ratmogrificados hostiles infligen _-10% de daño_.\n\n_+2:_ Los enemigos ratmogrificados hostiles infligen _-19% de daño_.\n\n_+3:_ Los enemigos ratmogrificados hostiles infligen _-27% de daño_.\n\n_+4:_ Los enemigos ratmogrificados hostiles infligen _-35% de daño_.
actors.hero.talent.ratsistance.title=asistencia de ratas
actors.hero.talent.reactive_barrier.desc=_+1:_ El mago obtiene _2.5 de escudo_ por cada personaje afectado por explosión elemental, hasta un máximo de 5 personajes.\n\n_+2:_ El mago obtiene _5 de escudo_ por cada personaje afectado por explosión elemental, hasta un máximo de 6 personajes.\n\n_+3:_ El mago obtiene _7.5 de escudo_ por cada personaje afectado por explosión elemental, hasta un máximo de 7 personajes.\n\n_+4:_ El mago obtiene _10 de escudo_ por cada personaje afectado por explosión elemental, hasta un máximo de 8 personajes.
actors.hero.talent.reactive_barrier.title=barrera reactiva
actors.hero.talent.recall_inscription.desc=_+1:_ El clérigo puede lanzar _Recordar Inscripción_, un hechizo que le permite repetir el efecto de la última runa o pergamino que usó dentro de _10 turnos._\n\n_+2:_ El clérigo puede lanzar _Recordar Inscripción_, un hechizo que le permite repetir el efecto de la última runa o pergamino que usó dentro de _300 turnos._\n\nRecordar Inscripción no se puede usar con pergaminos de mejora. El coste de carga de este hechizo varía según el objeto usado recientemente: 2 para una runa, 3 para un pergamino, 4 para un pergamino exótico. Este coste de carga también se duplica cuando se usa con un pergamino de transmutación o con objetos de alquimia que deben crearse usando transmutación o mejora.
actors.hero.talent.recall_inscription.meta_desc=Si este talento lo obtiene otro héroe, en su lugar se reembolsará cualquier pergamino o runa el 10% de las veces con +1 o el 15% de las veces con +2. Los pergaminos de mejora están exentos de este efecto.
actors.hero.talent.recall_inscription.refunded=¡Se te ha reembolsado el importe del artículo!
actors.hero.talent.recall_inscription.title=inscripción de recuperación
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Cuando la Cazadora pisa hierba corta o brasas, estas se convierten en hierba alta que la Cazadora inmediatamente ara. Esto tiene un _tiempo de reutilización de 10 turnos_.\n\n_+2:_ Cuando la Cazadora pisa hierba corta o brasas, estas se convierten en hierba alta que la Cazadora inmediatamente ara. Esto tiene un _tiempo de reutilización de 5 turnos_.\n\nEste talento producirá hierba arañada si los efectos de regeneración pasiva están desactivados o el héroe no ha ganado experiencia en mucho tiempo.
actors.hero.talent.rejuvenating_steps.title=pasos rejuvenecedores
actors.hero.talent.remote_beacon.desc=_+1:_ El mago puede colocar una baliza en cualquier lugar dentro de _4 casillas_.\n\n_+2:_ El mago puede colocar una baliza en cualquier lugar dentro de _8 casillas_.\n\n_+3:_ El mago puede colocar una baliza en cualquier lugar dentro de _12 casillas_.\n\n_+4:_ El mago puede colocar una baliza en cualquier lugar dentro de _16 casillas_.\n\nEl mago no puede colocar balizas en lugares que sean inaccesibles.
actors.hero.talent.remote_beacon.title=Baliza remota
actors.hero.talent.rogues_foresight.desc=_+1:_ Cuando el Pícaro está en un nivel con una habitación secreta, tiene un _75% de probabilidad de notar_ que el nivel contiene un secreto.\n\n_+2:_ Cuando el Pícaro está en un nivel con una habitación secreta, tiene un _100% de probabilidad de notar_ que el nivel contiene un secreto.
actors.hero.talent.rogues_foresight.title=la previsión del pícaro
actors.hero.talent.runic_transference.desc=_+1:_ El sello roto del Guerrero puede transferir _glifos regulares_ de la misma manera que transfiere una mejora.\n\n_+2:_ El sello roto del Guerrero puede transferir _glifos regulares, poderosos y malditos_ de la misma manera que transfiere una mejora.\n\nEl sello solo puede transferir glifos si se aplicaron a la armadura cuando se colocó el sello.
actors.hero.talent.runic_transference.meta_desc=Si otro héroe adquiere esta habilidad, ayudará a que los glifos de tu armadura resistan ser eliminados por pergaminos de mejora. Los glifos comenzarán a perderse al mejorar desde el nivel 6 (desde el 4) a +1, o desde el nivel 7 (desde el 4) a +2. El nivel en el que se garantiza la pérdida de glifos permanece sin cambios en +8.
actors.hero.talent.runic_transference.title=transferencia rúnica
actors.hero.talent.satiated_spells.desc=_+1:_ Comer alimentos hace que el clérigo gane _3 escudos_ la próxima vez que lance un hechizo.\n\n_+2:_ Comer alimentos hace que el clérigo gane _5 escudos_ la próxima vez que lance un hechizo.
actors.hero.talent.satiated_spells.meta_desc=Si este talento lo obtiene otro héroe, le otorgará inmediatamente un escudo que comenzará a desaparecer normalmente después de 10 turnos.
actors.hero.talent.satiated_spells.title=Hechizos de saciedad
actors.hero.talent.scholars_intuition.desc=_+1:_ El mago identifica varitas _3 veces más rápido_.\n\n_+2:_ El mago identifica varitas _cuando las usa_.
actors.hero.talent.scholars_intuition.title=intuición del erudito
actors.hero.talent.searing_light.desc=_+1:_ Los ataques físicos del Clérigo contra enemigos iluminados por _Luz Guía_ infligen _+3 de daño._\n\n_+2:_ Los ataques físicos del Clérigo contra enemigos iluminados por _Luz Guía_ infligen _+5 de daño._
actors.hero.talent.searing_light.meta_desc=Si este talento lo obtiene un héroe diferente, otorgará su daño adicional después de que se use una varita o artefacto en un enemigo, con un tiempo de reutilización de 20 turnos.
actors.hero.talent.searing_light.title=Luz abrasadora
actors.hero.talent.seer_shot.desc=_+1:_ Cuando la Cazadora dispara una flecha al suelo, otorga visión en un área de 3x3 a su alrededor durante _5 turnos_. Esto tiene un tiempo de reutilización de 20 turnos.\n\n_+2:_ Cuando la Cazadora dispara una flecha al suelo, otorga visión en un área de 3x3 a su alrededor durante _10 turnos_. Esto tiene un tiempo de reutilización de 20 turnos.\n\n_+3:_ Cuando la Cazadora dispara una flecha al suelo, otorga visión en un área de 3x3 a su alrededor durante _15 turnos_. Esto tiene un tiempo de reutilización de 20 turnos.
actors.hero.talent.seer_shot.meta_desc=Si este talento lo adquiere otro héroe, se activará con cualquier arma arrojadiza.
actors.hero.talent.seer_shot.title=disparo del vidente
actors.hero.talent.shadow_blade.desc=_+1:_ El clon de sombra gana _8%_ del daño del héroe por turno y tiene _25% de probabilidad_ de usar el encantamiento en el arma del héroe.\n\n_+2:_ El clon de sombra gana _16%_ del daño del héroe por turno y tiene _50% de probabilidad_ de usar el encantamiento en el arma del héroe.\n\n_+3:_ El clon de sombra gana _24%_ del daño del héroe por turno y tiene _75% de probabilidad_ de usar el encantamiento en el arma del héroe.\n\n_+4:_ El clon de sombra gana _32%_ del daño del héroe por turno y tiene _100% de probabilidad_ de usar el encantamiento en el arma del héroe.
actors.hero.talent.shadow_blade.title=hoja de sombra
actors.hero.talent.shadow_step.desc=_+1:_ Si el pícaro usa bomba de humo mientras es invisible, ocurre instantáneamente y tiene un coste de carga _16% reducido_, pero tampoco ciega a los enemigos ni activa otros talentos.\n\n_+2:_ Si el pícaro usa bomba de humo mientras es invisible, ocurre instantáneamente y tiene un coste de carga _30% reducido_, pero tampoco ciega a los enemigos ni activa otros talentos.\n\n_+3:_ Si el pícaro usa bomba de humo mientras es invisible, ocurre instantáneamente y tiene un coste de carga _41% reducido_, pero tampoco ciega a los enemigos ni activa otros talentos.\n\n_+4:_ Si el pícaro usa bomba de humo mientras es invisible, ocurre instantáneamente y tiene un coste de carga _50% reducido_, pero tampoco ciega a los enemigos ni activa otros talentos.
actors.hero.talent.shadow_step.title=paso de sombra
actors.hero.talent.shared_enchantment.desc=_+1:_ Las armas arrojadizas tienen una _probabilidad del 33%_ de usar el encantamiento en el arco del francotirador.\n\n_+2:_ Las armas arrojadizas tienen una _probabilidad del 67%_ de usar el encantamiento en el arco del francotirador.\n\n_+3:_ Las armas arrojadizas tienen una _probabilidad del 100%_ de usar el encantamiento en el arco del francotirador.\n\nEl encantamiento del arco puede activarse además de cualquier encantamiento que ya tenga el arma arrojadiza.
actors.hero.talent.shared_enchantment.title=encanto compartido
actors.hero.talent.shared_upgrades.desc=_+1:_ Cuando la Francotiradora ataca con un arma arrojadiza mejorada, cada nivel aumenta la duración de la marca de francotiradora en 1 turno y el daño de su ataque especial en un 16%, hasta un máximo de _2 turnos y +33% de daño en +2_.\n\n_+2:_ Cuando la Francotiradora ataca con un arma arrojadiza mejorada, cada nivel aumenta la duración de la marca de francotiradora en 1 turno y el daño de su ataque especial en un 16%, hasta un máximo de _4 turnos y +67% de daño en +4_.\n\n_+3:_ Cuando la Francotiradora ataca con un arma arrojadiza mejorada, cada nivel aumenta la duración de la marca de francotiradora en 1 turno y el daño de su ataque especial en un 16%, hasta un máximo de _6 turnos y +100% de daño en +6_.
actors.hero.talent.shared_upgrades.title=actualizaciones compartidas
actors.hero.talent.shield_battery.desc=_+1:_ El mago puede seleccionarse a sí mismo con una varita para convertir todas sus cargas en escudo a una tasa de _4% de HP máximo por carga_.\n\n_+2:_ El mago puede seleccionarse a sí mismo con una varita para convertir todas sus cargas en escudo a una tasa de _6% de HP máximo por carga_.
actors.hero.talent.shield_battery.title=batería blindada
actors.hero.talent.shield_of_light.desc=_+1:_ El clérigo puede lanzar _Escudo de Luz_, un hechizo que se lanza instantáneamente y le otorga _2-4 de armadura_ contra un objetivo durante 5 turnos a costa de 1 carga.\n\n_+2:_ El clérigo puede lanzar _Escudo de Luz_, un hechizo que se lanza instantáneamente y le otorga _3-6 de armadura_ contra un objetivo durante 5 turnos a costa de 1 carga.
actors.hero.talent.shield_of_light.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar reducirá el daño físico recibido de tu enemigo objetivo en 1, el 33% de las veces en +1 o el 50% de las veces en +2.
actors.hero.talent.shield_of_light.title=escudo de luz
actors.hero.talent.shielding_dew.desc=_+1:_ Las gotas de rocío pueden proteger a la Guardiana cuando su salud está completa, hasta _20% de su HP máximo_.\n\n_+2:_ Las gotas de rocío pueden proteger a la Guardiana cuando su salud está completa, hasta _40% de su HP máximo_.\n\n_+3:_ Las gotas de rocío pueden proteger a la Guardiana cuando su salud está completa, hasta _60% de su HP máximo_.
actors.hero.talent.shielding_dew.title=rocío protector
actors.hero.talent.shock_force.desc=_+1:_ La onda expansiva inflige _20% más de daño_ y tiene un _25% de probabilidad_ de aturdir en lugar de incapacitar.\n\n_+2:_ La onda expansiva inflige _40% más de daño_ y tiene un _50% de probabilidad_ de aturdir en lugar de incapacitar.\n\n_+3:_ La onda expansiva inflige _60% más de daño_ y tiene un _75% de probabilidad_ de aturdir en lugar de incapacitar.\n\n_+4:_ La onda expansiva inflige _80% más de daño_ y tiene un _100% de probabilidad_ de aturdir en lugar de incapacitar.
actors.hero.talent.shock_force.title=fuerza de choque
actors.hero.talent.shrug_it_off.desc=_+1:_ La reducción de daño del Guerrero mientras resiste aumenta al 60%, desde el 50%.\n\n_+2:_ La reducción de daño del Guerrero mientras resiste aumenta al 68%, desde el 50%.\n\n_+3:_ La reducción de daño del Guerrero mientras resiste aumenta al 74%, desde el 50%.\n\n_+4:_ La reducción de daño del Guerrero mientras resiste aumenta al 80%, desde el 50%.
actors.hero.talent.shrug_it_off.title=encogerse de hombros
actors.hero.talent.silent_steps.desc=_+1:_ El Pícaro no despertará a los enemigos dormidos mientras esté a _3 o más casillas de distancia de ellos_.\n\n_+2:_ El Pícaro no despertará a los enemigos dormidos mientras no esté _adyacente a ellos_.
actors.hero.talent.silent_steps.title=pasos silenciosos
actors.hero.talent.soul_eater.desc=_+1:_ La marca del alma otorga _0.33 turnos_ de saciedad por cada daño físico infligido. Los enemigos marcados con el alma tienen un _10% de probabilidad_ de activar efectos al comer cuando mueren.\n\n_+2:_ La marca del alma otorga _0.67 turnos_ de saciedad por cada daño físico infligido. Los enemigos marcados con el alma tienen un _20% de probabilidad_ de activar efectos al comer cuando mueren.\n\n_+3:_ La marca del alma otorga _1 turno_ de saciedad por cada daño físico infligido. Los enemigos marcados con el alma tienen un _30% de probabilidad_ de activar efectos al comer cuando mueren.
actors.hero.talent.soul_eater.title=Devorador de almas
actors.hero.talent.soul_siphon.desc=_+1:_ El daño físico infligido por otros personajes activa la marca de alma del Brujo con una efectividad del _13%_.\n\n_+2:_ El daño físico infligido por otros personajes activa la marca de alma del Brujo con una efectividad del _27%_.\n\n_+3:_ El daño físico infligido por otros personajes activa la marca de alma del Brujo con una efectividad del _40%_.
actors.hero.talent.soul_siphon.title=sifón de almas
actors.hero.talent.speedy_stealth.desc=_+1:_ El Freerunner gana 2 acumulaciones de impulso por turno mientras es invisible.\n\n_+2:_ Además de los beneficios de +1, el freerunning ya no cuenta hacia atrás mientras el Freerunner es invisible.\n\n_+3:_ Además de los beneficios de +1 y +2, el Freerunner se mueve a 2x de velocidad mientras es invisible, independientemente de si está practicando freerunning o no.
actors.hero.talent.speedy_stealth.title=sigilo rápido
actors.hero.talent.spirit_blades.desc=_+1:_ Las cuchillas espectrales tienen un _30% de probabilidad_ de usar también el encantamiento en el arco espiritual.\n\n_+2:_ Las cuchillas espectrales tienen un _60% de probabilidad_ de usar también el encantamiento en el arco espiritual.\n\n_+3:_ Las cuchillas espectrales tienen un _90% de probabilidad_ de usar también el encantamiento en el arco espiritual.\n\n_+4:_ Las cuchillas espectrales tienen un _100% de probabilidad_ de usar también el encantamiento en el arco espiritual, y le da a cada encantamiento _+10% de poder_.
actors.hero.talent.spirit_blades.title=espadas espirituales
actors.hero.talent.spirit_form.desc=El clérigo puede lanzar _Forma espiritual_, que imbuye a Trinidad con el poder de un anillo o artefacto que el clérigo haya identificado en esta partida (excepto el tomo sagrado), a un coste de 4 cargas.\n\n_+1:_ Cuando se usa Trinidad, el clérigo obtendrá el efecto de un anillo en _+1_ durante 20 turnos, o activará el efecto de un artefacto en _+4._\n\n_+2:_ Cuando se usa Trinidad, el clérigo obtendrá el efecto de un anillo en _+2_ durante 20 turnos, o activará el efecto de un artefacto en _+6._\n\n_+3:_ Cuando se usa Trinidad, el clérigo obtendrá el efecto de un anillo en _+3_ durante 20 turnos, o activará el efecto de un artefacto en _+8._\n\n_+4:_ Cuando se usa Trinidad, el Clérigo obtendrá el efecto de un anillo en _+4_ durante 20 turnos, o activará el efecto de un artefacto en _+10._\n\nTrinidad solo puede ser imbuida con un efecto de espíritu a la vez. Los artefactos tienen efectos y costos de carga de armadura variados cuando son activados por Trinidad.
actors.hero.talent.spirit_form.title=forma espiritual
actors.hero.talent.stasis.desc=El clérigo puede lanzar _Estasis_ sobre un aliado potenciado a cambio de 2 cargas. Estasis expulsa temporalmente al aliado de la mazmorra y conserva la duración restante de todos los potenciadores, incluido Poder de Muchos. El aliado reaparecerá junto a ti cuando termine el efecto. Estasis se puede volver a lanzar instantáneamente y sin coste alguno para finalizar el efecto antes de tiempo. Estasis funciona en aliados inmóviles, pero no puede moverlos entre pisos de la mazmorra.\n\n_+1:_ Estasis dura un máximo de _60 turnos._\n\n_+2:_ Estasis dura un máximo de _90 turnos._\n\n_+3:_ Estasis dura un máximo de _120 turnos._\n\n_+4:_ Estasis dura un máximo de _150 turnos._\n\nEl clérigo también puede lanzar Rayo radiante cuando un aliado está en estasis para volver a invocarlo, o lanzar Vínculo vital para aplicar su efecto de forma preventiva. Sin embargo, los aliados no se benefician de Vínculo vital mientras están en estasis.
actors.hero.talent.stasis.title=estasis
actors.hero.talent.strengthening_meal.desc=_+1:_ Comer comida le otorga a la Duelista 3 de daño adicional las próximas _2 veces_ que golpea a un enemigo con un ataque físico.\n\n_+2:_ Comer comida le otorga a la Duelista 3 de daño adicional las próximas _3 veces_ que golpea a un enemigo con un ataque físico.
actors.hero.talent.strengthening_meal.title=comida fortalecedora
actors.hero.talent.striking_force.desc=_+1:_ El poder del efecto del golpe elemental aumenta en _30%_.\n\n_+2:_ El poder del efecto del golpe elemental aumenta en _60%_.\n\n_+3:_ El poder del efecto del golpe elemental aumenta en _90%_.\n\n_+4:_ El poder del efecto del golpe elemental aumenta en _120%_.
actors.hero.talent.striking_force.title=fuerza de ataque
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave tiene un _30% de probabilidad_ de usar también efectos al golpear como encantamientos y combos.\n\n_+2:_ Shockwave tiene un _60% de probabilidad_ de usar también efectos al golpear como encantamientos y combos.\n\n_+3:_ Shockwave tiene un _90% de probabilidad_ de usar también efectos al golpear como encantamientos y combos.\n\n_+4:_ Shockwave tiene un _100% de probabilidad_ de usar también efectos al golpear como encantamientos y combos, y otorga a los encantamientos _+20% de poder_.
actors.hero.talent.striking_wave.title=ola impactante
actors.hero.talent.strongman.desc=_+1:_ La fuerza del guerrero aumenta un 8%, redondeado hacia abajo.\n\n_+2:_ La fuerza del guerrero aumenta un 13%, redondeado hacia abajo.\n\n_+3:_ La fuerza del guerrero aumenta un 18%, redondeado hacia abajo.
actors.hero.talent.strongman.title=forzudo
actors.hero.talent.sucker_punch.desc=_+1:_ El Pícaro inflige _1-2 de daño adicional_ la primera vez que ataca por sorpresa a un enemigo.\n\n_+2:_ El Pícaro inflige _2 de daño adicional_ la primera vez que ataca por sorpresa a un enemigo.
actors.hero.talent.sucker_punch.title=lo inevitable
actors.hero.talent.sunray.desc=_+1:_ El clérigo puede lanzar _Rayo solar_, un hechizo que inflige _4-8 de daño_ y ciega al objetivo durante _4 turnos_, a un coste de 1 carga.\n\n_+2:_ El clérigo puede lanzar _Rayo solar_, un hechizo que inflige _6-12 de daño_ y ciega al objetivo durante _6 turnos_, a un coste de 1 carga.\n\nRayo solar solo puede cegar a cada objetivo una vez, pero si el objetivo ya está cegado por Rayo solar, entonces lo paraliza en su lugar. Rayo solar siempre inflige el daño máximo a enemigos demoníacos y no muertos.
actors.hero.talent.sunray.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar hará que las varitas y los artefactos cieguen a los enemigos durante 4 turnos, el 15% de las veces con +1 o el 25% de las veces con +2.
actors.hero.talent.sunray.title=rayo de sol
actors.hero.talent.survivalists_intuition.desc=_+1:_ La Cazadora identifica las armas arrojadizas _3 veces más rápido_.\n\n_+2:_ La Cazadora identifica las armas arrojadizas _cuando golpea con ellas_.
actors.hero.talent.survivalists_intuition.title=intuición de supervivencia
actors.hero.talent.sustained_retribution.desc=_+1:_ El Guerrero inflige _115% de daño adicional_ repartido en _2 golpes_, en lugar de 100% de daño adicional en 1 golpe.\n\n_+2:_ El Guerrero inflige _130% de daño adicional_ repartido en _3 golpes_, en lugar de 100% de daño adicional en 1 golpe.\n\n_+3:_ El Guerrero inflige _145% de daño adicional_ repartido en _4 golpes_, en lugar de 100% de daño adicional en 1 golpe.\n\n_+4:_ El Guerrero inflige _160% de daño adicional_ repartido en _5 golpes_, en lugar de 100% de daño adicional en 1 golpe.
actors.hero.talent.sustained_retribution.title=represalia sostenida
actors.hero.talent.swift_equip.desc=_+1:_ La Duelista puede cambiar su arma equipada instantáneamente _una vez_ cada 20 turnos.\n\n_+2:_ La Duelista puede cambiar su arma equipada instantáneamente _dos veces_ cada 20 turnos.\n\nSi la Duelista tiene este talento y no está en tiempo de reutilización, usar rápidamente un arma no equipada la equipará.
actors.hero.talent.swift_equip.title=equipo rápido
actors.hero.talent.swift_spirit.desc=_+1:_ La velocidad de movimiento del halcón espiritual aumenta a _2.5 casillas_ desde 2, y se garantiza que esquivará los primeros _2 ataques_ realizados contra él.\n\n_+2:_ La velocidad de movimiento del halcón espiritual aumenta a _3 casillas_ desde 2, y se garantiza que esquivará los primeros _4 ataques_ realizados contra él.\n\n_+3:_ La velocidad de movimiento del halcón espiritual aumenta a _3.5 casillas_ desde 2, y se garantiza que esquivará los primeros _6 ataques_ realizados contra él.\n\n_+4:_La velocidad de movimiento del halcón espiritual aumenta a _4 casillas_ desde 2, y se garantiza que esquivará los primeros _8 ataques_ realizados contra él.
actors.hero.talent.swift_spirit.title=espíritu veloz
actors.hero.talent.telefrag.desc=_+1:_ Si el Mago se transforma en otro personaje, le inflige _10-15 de daño_, pero también recibe _5 de daño_.\n\n_+2:_ Si el Mago se transforma en otro personaje, le inflige _20-30 de daño_, pero también recibe _10 de daño_.\n\n_+3:_ Si el Mago se transforma en otro personaje, le inflige _30-45 de daño_, pero también recibe _15 de daño_.\n\n_+4:_ Si el Mago se transforma en otro personaje, le inflige _40-60 de daño_, pero también recibe _20 de daño_.\n\nEl héroe no puede ser asesinado por este talento, el daño propio puede ser reducido por efectos de resistencia mágica.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ El Pícaro identifica los anillos _2 veces más rápido_, e identifica el tipo de anillo _cuando se lo equipa_.\n\n_+2:_ El Pícaro identifica los anillos _cuando se los equipa_, e identifica el tipo de anillo _cuando lo recoge_.
actors.hero.talent.thiefs_intuition.title=intuición de ladrón
actors.hero.talent.twin_upgrades.desc=_+1:_ Si una de las dos armas equipadas del Campeón tiene un nivel inferior y es _2 o más niveles inferior_ que la otra arma, se aumentará al nivel de la otra arma.\n\n_+2:_ Si una de las dos armas equipadas del Campeón tiene un nivel inferior y es _1 o más niveles inferior_ que la otra arma, se aumentará al nivel de la otra arma.\n\n_+3:_ Si una de las dos armas equipadas del Campeón tiene un nivel inferior y es _del mismo nivel o inferior_ que la otra arma, se aumentará al nivel de la otra arma.
actors.hero.talent.twin_upgrades.title=mejoras gemelas
actors.hero.talent.unencumbered_spirit.desc=_+1:_ El Monje obtiene _50% más de energía_ por cada pieza de equipo de _nivel 3 o inferior_ que esté usando.\n\n_+2:_ El Monje obtiene _75% más de energía_ por cada pieza de equipo de _nivel 2 o inferior_ que esté usando. El beneficio de nivel 3 no cambia.\n\n_+3:_ El Monje obtiene _100% más de energía_ por cada pieza de equipo de _nivel 1 o inferior_ que esté usando. Los beneficios de nivel 2 y 3 no cambian. También obtiene una armadura de tela y guantes con tachuelas gratis.\n\nTenga en cuenta que este talento no otorga ningún beneficio por estar desarmado o atacar con un Anillo de Fuerza.
actors.hero.talent.unencumbered_spirit.title=espíritu libre
actors.hero.talent.varied_charge.desc=_+1:_ La Campeona recupera instantáneamente _0.17 cargas de arma_ cuando usa dos habilidades de arma diferentes, sin límite de tiempo.\n\n_+2:_ La Campeona recupera instantáneamente _0.33 cargas de arma_ cuando usa dos habilidades de arma diferentes, sin límite de tiempo.\n\n_+3:_ La Campeona recupera instantáneamente _0.5 cargas de arma_ cuando usa dos habilidades de arma diferentes, sin límite de tiempo.
actors.hero.talent.varied_charge.title=cargo variable
actors.hero.talent.veterans_intuition.desc=_+1:_ El guerrero identifica las armas _1,75 veces más rápido_ y la armadura _2,5 veces más rápido_.\n\n_+2:_ El guerrero identifica las armas _2,5 veces más rápido_ y la armadura _cuando la equipa_.
actors.hero.talent.veterans_intuition.title=intuición de veterano
actors.hero.talent.wall_of_light.desc=_+1:_ El Paladín puede lanzar _Muro de Luz_, un hechizo que crea un muro sólido de _3 casillas de ancho_ frente al Paladín que repele a los enemigos y dura 20 turnos, a un costo de 3 cargas.\n\n_+2:_ El Paladín puede lanzar _Muro de Luz_, un hechizo que crea un muro sólido de _5 casillas de ancho_ frente al Paladín que repele a los enemigos y dura 20 turnos, a un costo de 3 cargas.\n\n_+3:_ El Paladín puede lanzar _Muro de Luz_, un hechizo que crea un muro sólido de _7 casillas de ancho_ frente al Paladín que repele a los enemigos y dura 20 turnos, a un costo de 3 cargas.\n\nEl muro se puede colocar cardinalmente o en diagonal, solo puede existir un muro a la vez.
actors.hero.talent.wall_of_light.title=pared de luz
actors.hero.talent.wand_preservation.desc=_+1:_ Cuando el Mago imbuye una nueva varita en su bastón, la varita antigua se devuelve en +0, _pero esto solo se puede hacer una vez._\n\n_+2:_ Cuando el Mago imbuye una nueva varita en su bastón, la varita antigua se devuelve en +0, _esto se puede repetir con un tiempo de reutilización de un nivel de héroe._
actors.hero.talent.wand_preservation.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar aumentará la cantidad de resina arcana obtenida al colocar una varita en un caldero de alquimia en 1 con +1, o en 2 con +2.
actors.hero.talent.wand_preservation.title=conservación de la varita
actors.hero.talent.weapon_recharging.desc=_+1:_ El Duelista obtiene una carga de arma cada _15 turnos_ cuando está bajo el efecto de mejoras de recarga de varita o artefacto.\n\n_+2:_ El Duelista obtiene una carga de arma cada _10 turnos_ cuando está bajo el efecto de mejoras de recarga de varita o artefacto.
actors.hero.talent.weapon_recharging.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar hará que inflija un +5% de daño cuerpo a cuerpo mientras se recarga a +1, o un +7,5% de daño cuerpo a cuerpo mientras se recarga a +2.
actors.hero.talent.weapon_recharging.title=recarga de armas
actors.hero.talent.wide_search.desc=_+1:_ El radio de búsqueda del Pícaro aumenta de un cuadrado de 5x5 a un círculo de _7x7_.\n\n_+2:_ El radio de búsqueda del Pícaro aumenta de un cuadrado de 5x5 a un cuadrado de _7x7_.
actors.hero.talent.wide_search.meta_desc=_Si este talento lo obtiene un héroe diferente_, en su lugar aumentará su radio de búsqueda de un cuadrado de 3x3 a un círculo de 5x5 con +1, o a un cuadrado de 5x5 con +2.
actors.hero.talent.wide_search.title=búsqueda amplia
actors.hero.talent.wild_momentum.desc=_+1:_ Matar a un enemigo con el arco espiritual prolonga la duración del poder de la naturaleza en _1 turno_. La duración se puede extender hasta un máximo de _2 turnos_.\n\n_+2:_ Matar a un enemigo con el arco espiritual prolonga la duración del poder de la naturaleza en _2 turnos_. La duración se puede extender hasta un máximo de _4 turnos_.\n\n_+3:_ Matar a un enemigo con el arco espiritual prolonga la duración del poder de la naturaleza en _3 turnos_. La duración se puede extender hasta un máximo de _6 turnos_.\n\n_+4:_ Matar a un enemigo con el arco espiritual prolonga la duración del poder de la naturaleza en _4 turnos_. La duración se puede extender hasta un máximo de _8 turnos_.
actors.hero.talent.wild_momentum.title=impulso salvaje
actors.hero.talent.wild_power.desc=_+1:_ Al usar magia salvaje, las varitas se potenciarán en _2 o 3, hasta +4_.\n\n_+2:_ Al usar magia salvaje, las varitas se potenciarán en _3, hasta +5_.\n\n_+3:_ Al usar magia salvaje, las varitas se potenciarán en _3 o 4, hasta +6_.\n\n_+4:_ Al usar magia salvaje, las varitas se potenciarán en _4, hasta +7_.
actors.hero.talent.wild_power.title=poder salvaje
actors.mobs.acidic.desc=Estas enormes criaturas demoníacas con aspecto de arácnidos evitan el combate cuerpo a cuerpo, prefiriendo lanzar afiladas púas dentadas desde largas distancias. Esta en particular parece estar cubierta de una sustancia corrosiva.
actors.mobs.acidic.name=escorpión ácido
actors.mobs.albino.desc=Se trata de una raza rara de rata marsupial, con pelaje blanco puro y dientes irregulares.
actors.mobs.albino.discover_hint=Es raro encontrar a este enemigo en una región específica de la mazmorra.
actors.mobs.albino.name=rata albina
actors.mobs.armoredbrute.desc=Los gnolls más veteranos suelen llevar armaduras poderosas para demostrar su estatus. Estas armaduras los hacen mucho más resistentes al daño físico, y su mayor disciplina les permite enfurecerse durante mucho más tiempo antes de sucumbir a sus heridas.
actors.mobs.armoredbrute.name=bruto acorazado
actors.mobs.armoredstatue.desc=Uno pensaría que es solo otra de las estatuas inanimadas de esta mazmorra, pero sus ojos rojos brillantes la delatan.\n\nParece estar en excelentes condiciones debido a la armadura que lleva puesta, podría ser muy difícil de matar.
actors.mobs.armoredstatue.desc_arm_wep=Aunque la estatua en sí está hecha de piedra, los _%1$s_ y _%2$s_ que empuña parecen reales.
actors.mobs.armoredstatue.name=estatua blindada
actors.mobs.bandit.desc=Los niveles más profundos de la mazmorra siempre han servido de escondite para todo tipo de criminales. No todos lograban mantener la mente despejada durante sus largos periodos lejos de la luz del día. Hace mucho tiempo, estos ladrones y bandidos desquiciados olvidaron quiénes eran y por qué robaban.
actors.mobs.bandit.name=bandido loco
actors.mobs.bat.desc=Estos ágiles y tenaces habitantes de las cuevas son mucho más peligrosos de lo que aparentan. Recuperan salud con cada ataque exitoso, lo que les permite derrotar a oponentes mucho más grandes.
actors.mobs.bat.name=murciélago vampiro
actors.mobs.bee.desc=A pesar de su pequeño tamaño, las abejas doradas suelen proteger su nido con fiereza. Esta está muy enfadada, mejor mantén la distancia.
actors.mobs.bee.desc_honey=A pesar de su pequeño tamaño, las abejas doradas suelen proteger su nido con fiereza. Esta en particular se ha calmado y parece querer seguirte.
actors.mobs.bee.discover_hint=Puedes encontrar a este personaje con un objeto específico.
actors.mobs.bee.name=abeja dorada
actors.mobs.brute$bruterage.desc=Este bruto gnoll se está muriendo, ¡pero quiere llevarte con él!\n\nEl bruto morirá cuando su escudo se agote, ya sea por el tiempo o si recibe daño. Mientras tanto, infligirá un daño enormemente aumentado, ¡así que ten cuidado!\n\nEscudo restante: %d.
actors.mobs.brute$bruterage.name=furia bruta
actors.mobs.brute.def_verb=obstruido
actors.mobs.brute.desc=Los brutos son los gnolls más grandes, fuertes y resistentes. Cuando quedan gravemente heridos, entran en frenesí e infligen aún más daño a sus enemigos.
actors.mobs.brute.enraged=enfurecido
actors.mobs.brute.name=bruto gnoll
actors.mobs.causticslime.desc=Este limo parece haber sido contaminado por la magia oscura que emana de las profundidades. Ha perdido su color verde habitual y gotea un líquido corrosivo.
actors.mobs.causticslime.discover_hint=Es raro encontrar a este enemigo en una región específica de la mazmorra.
actors.mobs.causticslime.name=limo cáustico
actors.mobs.crab.desc=Estos enormes cangrejos se encuentran en la cima de la cadena alimenticia en las alcantarillas. Son extremadamente rápidos y su grueso caparazón puede soportar fuertes golpes.
actors.mobs.crab.name=cangrejo de alcantarilla
actors.mobs.crystalguardian.def_verb=obstruido
actors.mobs.crystalguardian.desc=Estos grandes guardianes cristalinos casi parecen estatuas, si no fuera por sus brillantes ojos resplandecientes. El cristal endurecido del que están hechos hace que sean lentos pero muy resistentes, así que _es mejor dejarlos dormir en su nido de cristal el mayor tiempo posible._\n\nDebido a su tamaño, los guardianes cristalinos se moverán mucho más lentamente en espacios cerrados. También son tan resistentes que es imposible matarlos directamente. Pueden ser golpeados y neutralizados temporalmente, pero se levantarán de nuevo después de un tiempo.
actors.mobs.crystalguardian.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.crystalguardian.name=guardián de cristal
actors.mobs.crystalmimic.ate=¡El imitador se comió tu %s!
actors.mobs.crystalmimic.desc=Los mímicos son criaturas mágicas que pueden adoptar cualquier forma que deseen. En las mazmorras, casi siempre eligen la forma de un cofre del tesoro para atraer a aventureros desprevenidos. Los mímicos de cristal son más astutos que sus primos comunes y prefieren evitar el conflicto al robar botín. Intentarán huir corriendo una vez descubiertos y tienen la capacidad de reposicionar a los enemigos cuando atacan.
actors.mobs.crystalmimic.escaped=¡El mímico de cristal ha escapado!
actors.mobs.crystalmimic.name=imitador de cristal
actors.mobs.crystalspire.alert=¡La vibración crece y retumba por toda la cueva!
actors.mobs.crystalspire.desc=Esta gigantesca aguja de cristal ultraduro es probablemente la fuente de todas las extrañas criaturas cristalinas de esta cueva. Tus armas habituales son ineficaces contra ella, así que tendrás que usar tu pico si quieres destruirla. Asegúrate de estar preparado antes de empezar a romperla. Es probable que un cristal tan grande tarde un buen rato en ser extraído, y probablemente no podrás hacerlo sin interrupciones. La propia aguja incluso podría tener algún medio de defensa. Quizás los propios ataques de la aguja podrían usarse contra sus secuaces.
actors.mobs.crystalspire.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.crystalspire.name=aguja de cristal
actors.mobs.crystalspire.warning=El cristal vibra al golpearlo. Si sigues haciéndolo, sin duda llamarás la atención...
actors.mobs.crystalwisp.beam_kill=El rayo de luz te mató...
actors.mobs.crystalwisp.desc=Un pequeño trozo flotante y furioso de cristal endurecido que produce un brillo intenso. Aunque no es especialmente fuerte, los filamentos de cristal te dispararán un rayo de luz dañino si tienen un tiro despejado. Los filamentos son lo suficientemente pequeños como para moverse fácilmente a través de los diversos afloramientos de cristal, pero no pueden disparar a través de ellos.
actors.mobs.crystalwisp.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.crystalwisp.name=filamento de cristal
actors.mobs.demonspawner.desc=Esta retorcida amalgama de carne enana es responsable de crear demonios desgarradores a partir de los enanos que han muerto en esta región. Claramente, a los demonios no les importa usar todos los recursos a su alcance contra sus enemigos. Aunque visualmente aterradores, los generadores de demonios no tienen forma de moverse ni de defenderse directamente. Sin embargo, su considerable masa los hace difíciles de matar rápidamente, y generarán demonios desgarradores con mayor rapidez cuando se sientan amenazados. Los generadores de demonios parecen estar conectados a alguna fuente central de poder demoníaco. Matarlos podría debilitarla.
actors.mobs.demonspawner.name=engendro de demonios
actors.mobs.demonspawner.on_death=La energía demoníaca en este lugar parece disminuir a medida que muere el generador.
actors.mobs.dm100.desc=El DM-100 es un modelo primitivo de "máquina de defensa" enana, diseñada para proteger a los mineros enanos en las cuevas bajo esta prisión. Sin embargo, sus descargas eléctricas resultaron demasiado débiles, por lo que fueron donadas a la ciudad humana de la superficie. Permanecieron sin uso durante años y finalmente llegaron a la prisión, donde el alcaide inicialmente las consideró demasiado crueles. No obstante, a medida que los prisioneros se volvieron más rebeldes, se convirtieron en una necesidad.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=El rayo te mató...
actors.mobs.dm200.desc=El DM-200 es la segunda generación de la "máquina de defensa" enana, diseñada para proteger a los mineros enanos en las cuevas y la ciudad subterránea. Son mucho más grandes y robustos que sus predecesores, y atacan con devastadores puños hidráulicos. Su mayor tamaño es también su principal debilidad, ya que no pueden pasar por los estrechos túneles y puertas de la mazmorra. Los enanos lograron compensar la falta de movilidad del DM-200 permitiéndoles expulsar sus gases tóxicos hacia enemigos distantes o inalcanzables.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=¡El DM-200 dispara un chorro de gases de escape tóxicos!
actors.mobs.dm201.desc=Los enanos experimentaron brevemente con enfatizar más la falta de movilidad del DM-200 y crearon algunos modelos de DM que son completamente estacionarios. El DM-201 es un DM-200 modificado que actúa como una torreta centinela que no tiene capacidad de movimiento. A cambio de la falta de movilidad, los DM-201 tienen significativamente más durabilidad y poder de ataque.\n\nAs Los DM-201 no tienen motor para expulsar los gases de escape, ¡los enanos los equiparon con granadas de gas corrosivo! Sin embargo, los DM-201 son cuidadosos con estas granadas y solo las lanzarán cuando sean atacados a distancia.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=¡El DM-201 lanza una granada corrosiva!
actors.mobs.dm300.charge_lost=¡PILOTE DESTRUIDO! ¡VOLVIENDO A LA ENERGÍA LOCAL!
actors.mobs.dm300.charging=¡DAÑOS SUFRIENDO! ¡ACTIVANDO EL PILOTE DE ENERGÍA!
actors.mobs.dm300.charging_hint=¡El DM-300 es invulnerable mientras recibe energía de un pilón!
actors.mobs.dm300.def_verb=obstruido
actors.mobs.dm300.defeated=¡DAÑOS CRÍTICOS! INTENTANDO APAGADO-
actors.mobs.dm300.desc=Los enanos construyeron esta máquina hace varios siglos. Más tarde empezaron a sustituir sus máquinas por gólems, elementales e incluso demonios, lo que acabó llevando a su civilización a la decadencia. El DM-300 y otras máquinas similares se usaban para construir y excavar minas, y a veces para defender las ciudades.
actors.mobs.dm300.desc_supercharged=DM-300 está actualmente cargado completamente de energía eléctrica. En esta forma, DM-300 no puede ser dañado y se mueve al doble de velocidad. Además, su taladro ahora gira lo suficientemente rápido como para _perforar un túnel a través de roca sólida_, aunque se mueve mucho más lento al hacerlo.\n\nAtacar a DM-300 directamente es inútil mientras está sobrecargado, pero _algo en el área debe estar proporcionándole esta energía_, destruir eso podría debilitarlo.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=¡PERSONAL NO AUTORIZADO DETECTADO!
actors.mobs.dm300.pylons_destroyed=¡ALERTA! ¡INSETABILIDAD DETECTADA EN LA RED ELÉCTRICA!
actors.mobs.dm300.rankings_desc=Aplastado por el DM-300
actors.mobs.dm300.shield=El DM-300 obtiene la energía de los cables expuestos y se apantalla.
actors.mobs.dm300.supercharged=¡DESTRUYE! ¡DESTRUYE! ¡DESTRUYE!
actors.mobs.dwarfking$dkghoul.rankings_desc=Cayó ante el Rey de los Enanos
actors.mobs.dwarfking$dkgolem.rankings_desc=Cayó ante el Rey de los Enanos
actors.mobs.dwarfking$dkmonk.rankings_desc=Cayó ante el Rey de los Enanos
actors.mobs.dwarfking$dkwarlock.rankings_desc=Cayó ante el Rey de los Enanos
actors.mobs.dwarfking.defeated=Nos has... condenado a todos...
actors.mobs.dwarfking.desc=Hace muchos años, uno de los magos más poderosos de la corte enana descubrió secretos que le otorgaron un poder tremendo sobre la vida y la muerte. Pronto usó este poder para subyugar y corromper a sus iguales, a su rey y, finalmente, a todos los ciudadanos enanos. Ahora es rey, gobernante de una legión de súbditos no muertos. El Rey de los Enanos es un enemigo agresivo que intentará rodear y abrumar a sus enemigos con su horda de secuaces no muertos.
actors.mobs.dwarfking.enraged=No puedes matarme %s. ¡SOY INMORTAL!
actors.mobs.dwarfking.lifelink_1=¡Necesito tu esencia, esclavo!
actors.mobs.dwarfking.lifelink_2=¡Sangra por mí, esclavo!
actors.mobs.dwarfking.losing=¡No! No puedes hacer esto... no tienes ni idea de lo que hay debajo...
actors.mobs.dwarfking.name=Rey de los Enanos
actors.mobs.dwarfking.notice=¡Cómo te atreves! ¡No tienes ni idea de en qué te estás metiendo!
actors.mobs.dwarfking.rankings_desc=Cayó ante el Rey de los Enanos
actors.mobs.dwarfking.teleport_1=¡Ocúpate de ellos, esclavo!
actors.mobs.dwarfking.teleport_2=¡Mantenlos ocupados, esclavo!
actors.mobs.dwarfking.wave_1=¡Basta! ¡Levántense, mis esclavos!
actors.mobs.dwarfking.wave_2=¡Más! ¡Sangra por tu rey!
actors.mobs.dwarfking.wave_3=¡Inútiles! ¡MÁTALOS AHORA!
actors.mobs.ebonymimic.desc=Los mímicos son criaturas mágicas que pueden adoptar cualquier forma que deseen. En las mazmorras, casi siempre eligen la forma de un cofre del tesoro para atraer a aventureros desprevenidos. Los mímicos de ébano son mímicos sigilosos con la capacidad de volverse casi invisibles. Acechan en cosas con las que los aventureros probablemente interactúen, pero también contienen su propio botín. No son más resistentes que un mímico común una vez descubiertos, pero su mordisco sorpresa es devastador.
actors.mobs.ebonymimic.discover_hint=Puedes encontrar a este enemigo con un amuleto específico.
actors.mobs.ebonymimic.hidden_desc=Parece que hay algo aquí, pero es casi totalmente transparente.
actors.mobs.ebonymimic.hidden_name=contorno sospechoso
actors.mobs.ebonymimic.name=mímico de ébano
actors.mobs.ebonymimic.reveal=¡Había un imitador allí!
actors.mobs.elemental$chaoselemental.desc=Los elementales son criaturas caóticas que suelen crearse cuando la magia oculta poderosa no se controla adecuadamente. Los elementales tienen una inteligencia mínima y generalmente se asocian con un tipo particular de magia. Los elementales del caos son elementales raros y peligrosos que no se han estabilizado en un elemento en particular. Desatarán magia salvaje e impredecible cuando ataquen.
actors.mobs.elemental$chaoselemental.name=elemento caos
actors.mobs.elemental$fireelemental.desc=Los elementales son criaturas caóticas que suelen crearse cuando la magia oculta poderosa no se controla adecuadamente. Los elementales tienen una inteligencia mínima y generalmente se asocian con un tipo particular de magia. Los elementales de fuego son un tipo común de elemental que inflige daño con magia de fuego. Prenderán fuego a su objetivo con ataques cuerpo a cuerpo y ocasionalmente también pueden lanzar rayos de fuego.
actors.mobs.elemental$fireelemental.name=elemental de fuego
actors.mobs.elemental$frostelemental.desc=Los elementales son criaturas caóticas que suelen crearse cuando la magia oculta poderosa no se controla adecuadamente. Los elementales tienen una inteligencia mínima y generalmente se asocian con un tipo particular de magia. Los elementales de hielo son un tipo común de elemental que debilita a los enemigos con magia gélida. Congelarán a su objetivo con ataques cuerpo a cuerpo y ocasionalmente ataques a distancia. Su magia es mucho más efectiva en el agua.
actors.mobs.elemental$frostelemental.name=elemental de hielo
actors.mobs.elemental$newbornfireelemental.charging=¡El elemental se está cargando!
actors.mobs.elemental$newbornfireelemental.desc=Los elementales son criaturas caóticas que a menudo se crean cuando la magia oculta poderosa no se controla adecuadamente. Los elementales tienen una inteligencia mínima y generalmente se asocian con un tipo particular de magia. ¡Este elemental de fuego acaba de ser invocado, pero aún es bastante peligroso!
actors.mobs.elemental$newbornfireelemental.desc_ally=Debido a que este elemental fue invocado mediante un hechizo, tiene un poco más de control sobre sus llamas. Es incapaz de realizar ataques a distancia, pero prenderá fuego a los enemigos que ataque cuerpo a cuerpo.
actors.mobs.elemental$newbornfireelemental.desc_boss=Debido a la naturaleza caótica de su invocación, este elemental solo puede propagar fuego en ráfagas imprecisas después de cargar energía durante un turno.
actors.mobs.elemental$newbornfireelemental.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.elemental$newbornfireelemental.name=elemental de fuego recién nacido
actors.mobs.elemental$shockelemental.desc=Los elementales son criaturas caóticas que a menudo se crean cuando la magia oculta poderosa no se controla adecuadamente. Los elementales tienen una inteligencia mínima y generalmente están asociados con un tipo particular de magia. Los elementales de choque son un tipo menos común de elemental que interrumpe a sus enemigos con electricidad y destellos de luz. En el combate cuerpo a cuerpo, lanzarán electricidad a los enemigos cercanos y causarán daño adicional a su objetivo principal si están en el agua. Ocasionalmente también concentrarán una explosión de luz a distancia en su objetivo, cegándolo temporalmente.
actors.mobs.elemental$shockelemental.name=choque elemental
actors.mobs.eye.deathgaze_kill=La mirada mortal te mató...
actors.mobs.eye.desc=A este demonio también se lo conoce como «orbe de odio». En cuanto ve a un enemigo, usa su mirada mortal sin cuidado alguno, a menudo hiriendo también a sus aliados.
actors.mobs.eye.name=ojo maligno
actors.mobs.fetidrat.desc=Algo anda claramente mal con esta rata. Su pelaje negro grasiento y su piel podrida son muy diferentes de las ratas sanas que has visto antes. Sus ojos verde pálido la hacen parecer especialmente amenazante.\n\nLa rata lleva consigo una nube de hedor horrible, es abrumadoramente fuerte de cerca.\n\nUn moco oscuro gotea de la boca de la rata, come a través del suelo pero parece disolverse en el agua.
actors.mobs.fetidrat.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.fetidrat.name=rata fétida
actors.mobs.fungalcore.desc=Este hongo gigantesco debe ser la fuente de toda la actividad fúngica en esta cueva.
actors.mobs.fungalcore.name=núcleo fúngico
actors.mobs.fungalsentry.desc=Este hongo particularmente alto actúa como un punto de defensa para la red fúngica más grande que vive en esta cueva.\n\nEs inmóvil, pero disparará ráfagas precisas de veneno a cualquier cosa que se ponga dentro de su línea de visión. Si bien el impacto de estas ráfagas es bastante débil, _pueden acumular cantidades letales de veneno muy rápidamente_. Aunque se le puede matar, probablemente sea mejor evitarlo.
actors.mobs.fungalsentry.name=centinela fúngico
actors.mobs.fungalspinner.desc=Este tejedor de cuevas parece estar controlado por un hongo parásito. El hongo también ha cambiado sus habilidades, reemplazando sus telarañas y sacos de veneno con crecimiento fúngico.\n\nEl tejedor fúngico te escupirá vida vegetal en lugar de telarañas, esparciendo vegetación fúngica y pudiendo enraizarte. Aunque no puede envenenar, el tejedor fúngico obtendrá una resistencia sustancial al daño si está adyacente a cualquier hongo.
actors.mobs.fungalspinner.name=hilandero de hongos
actors.mobs.ghoul.desc=A medida que la sociedad enana comenzaba a colapsar lentamente y el actual rey de los enanos se hacía con el poder absoluto, aquellos que eran débiles o se resistían a él no eran bien tratados. Conforme el rey se volvía más hábil en el manejo de la magia oscura, doblegó a estos enanos a su voluntad, y ahora forman la infantería de su ejército. Los ghouls no son especialmente fuertes por sí solos, pero siempre viajan en grupos y son mucho más difíciles de matar en grandes cantidades. Cuando un ghoul es derrotado, se levantará de nuevo después de unos turnos siempre que haya otro ghoul cerca.
actors.mobs.ghoul.name=ghoul enano
actors.mobs.gnoll.desc=Los gnolls son humanoides parecidos a las hienas. Habitan en alcantarillas y mazmorras, aventurándose ocasionalmente a salir a la superficie para realizar incursiones. Los exploradores gnoll son miembros habituales de su manada; no son tan fuertes como los brutos ni tan inteligentes como los chamanes.
actors.mobs.gnoll.name=explorador gnoll
actors.mobs.gnollexile.desc=Este gnoll de pelaje gris tiene una gran marca en el hombro que lo identifica como exiliado. Los gnolls suelen ser exiliados de su sociedad por desobedecer órdenes o infringir las leyes. Los exiliados deben ser fuertes y astutos para sobrevivir; este parece saber usar la lanza que sostiene.
actors.mobs.gnollexile.desc_aggro=_El gnoll exiliado mira a su alrededor con furia._ Parece que algo lo ha hecho decidirse a luchar después de todo. ¡Cuidado con esa lanza!
actors.mobs.gnollexile.desc_passive=El gnoll exiliado no se mueve para atacar. No parece tan agresivo como los otros gnolls de aquí, y probablemente no cree que valga la pena luchar contra ti. Podrías dejarlo pasar, pero tiene una mochila que podría estar llena de objetos útiles...
actors.mobs.gnollexile.name=exiliado gnoll
actors.mobs.gnollexile.seen_aggro=¡El gnoll que empuña la lanza se dispone a atacar!
actors.mobs.gnollexile.seen_passive=El gnoll que empuña la lanza te mira con recelo, pero no se mueve para atacar.
actors.mobs.gnollgeomancer.alert=¡El geomante despierta! ¡Toda la cueva parece moverse mientras salta lejos riendo como un loco!
actors.mobs.gnollgeomancer.desc=Este imponente gnoll anciano debe ser la fuente de la magia que mueve la tierra en esta zona y el organizador de toda la actividad gnoll. A diferencia de los zapadores gnoll de la región, el geomante es muy hábil con la magia y no puede ser dañado por rocas que le arrojen o que caigan. Sin embargo, no tiene ninguna forma de luchar cuerpo a cuerpo.
actors.mobs.gnollgeomancer.desc_armor=El geomante está actualmente recubierto por una capa de armadura de roca. _Tendrás que acercarte y romperla con tu pico antes de poder dañar al geomante._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Un gnoll zapador cercano sostiene un dispositivo que potencia la armadura de roca del geomante. ¡No podrás dañarla en absoluto ahora mismo!_
actors.mobs.gnollgeomancer.desc_sleeping=Este chamán gnoll, de una altura impresionante, está rodeado por una capa de roca y parece casi una estatua. Si te fijas bien, puedes ver cómo la roca se mueve mágicamente al ritmo de la respiración del gnoll anciano. Es invulnerable mientras está encerrado en la roca y parece estar disfrutando de una siesta en la tierra. Probablemente puedas romper las capas de roca con tu pico, pero asegúrate de estar preparado para luchar cuando lo hagas. El geomante debe ser la fuente de la magia que mueve la tierra en este lugar y el organizador de toda la actividad gnoll. Derrotar a los gnolls dispersos por aquí antes de enfrentarte a él podría ser una buena idea.
actors.mobs.gnollgeomancer.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.gnollgeomancer.name=geomante gnoll
actors.mobs.gnollgeomancer.rock_kill=La roca que salió disparada te mató...
actors.mobs.gnollgeomancer.rockfall_kill=Las rocas que caían te mataron...
actors.mobs.gnollgeomancer.warning=El geomante comienza a agitarse. ¡Asegúrate de estar preparado antes de continuar!
actors.mobs.gnollguard.def_verb=obstruido
actors.mobs.gnollguard.desc=Un gnoll grande y de aspecto robusto que empuña una lanza y un escudo, pero sin casco. Es probable que estos guardias sean brutos en entrenamiento, reclutados para ayudar a proteger la mina de la fauna salvaje invasora. El guardia gnoll es lo suficientemente fuerte como para blandir la lanza con una mano, pero no la maneja muy bien. Necesitará bastante espacio abierto para atacar a distancia y te hará mucho menos daño si te acercas.
actors.mobs.gnollguard.desc_armor=_Un gnoll zapador cercano sostiene un dispositivo que otorga a este guardia una armadura de tierra, reduciendo considerablemente el daño que recibe._
actors.mobs.gnollguard.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.gnollguard.name=guardia gnoll
actors.mobs.gnollguard.spear_warn=¡El gnoll asesta un golpe brutal con la punta de su lanza!
actors.mobs.gnollsapper.desc=Un gnoll pequeño y débil, pero inteligente, con pelaje pálido y una bolsa llena de diversos artilugios. Probablemente estén aquí para ayudar en la prospección y extracción de oro oscuro, y cuentan con un guardia cerca para su protección. Son capaces de luchar, pero sus ataques son lamentablemente débiles, no más fuertes que los de un explorador gnoll. En lugar de luchar directamente, los zapadores prefieren usar los diversos artilugios que poseen para que el entorno rocoso ataque por ellos. Sin embargo, no conocen la magia de movimiento de tierras, por lo que es bastante probable que usen sus artilugios de forma imprudente. _Debería haber muchas maneras de usar sus ataques en su contra o contra su guardia._
actors.mobs.gnollsapper.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.gnollsapper.name=zapador gnoll
actors.mobs.gnolltrickster.desc=Una criatura de aspecto extraño, incluso para los estándares de los gnolls. Se encorva hacia adelante con una sonrisa maliciosa, casi acunando la bolsa que cuelga sobre su hombro. Sus ojos están muy abiertos con una extraña mezcla de miedo y excitación.\n\nHay una gran colección de dardos mal hechos en su bolsa, todos parecen tener puntas con diversas sustancias nocivas.
actors.mobs.gnolltrickster.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.gnolltrickster.name=embaucador gnoll
actors.mobs.goldenmimic.desc=Los mímicos son criaturas mágicas que pueden adoptar cualquier forma que deseen. En las mazmorras, casi siempre eligen la forma de un cofre del tesoro para atraer a aventureros desprevenidos. Los mímicos dorados son mímicos más resistentes que intentan atraer a los aventureros más fuertes. Tienen mejor botín, pero también son mucho más fuertes que los mímicos comunes.
actors.mobs.goldenmimic.name=mímico dorado
actors.mobs.golem.def_verb=obstruido
actors.mobs.golem.desc=Los enanos intentaron combinar sus conocimientos mecánicos con su recién descubierto poder para vincular elementales. Usaron espíritus de tierra como «alma» de los cuerpos mecánicos de los gólems, creyendo que serían los más dóciles. Aun así, el más mínimo error en el ritual podía hacer que se descontrolaran.
actors.mobs.golem.name=gólem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=Se sabe poco de la Masa viscosa. Quizá ni siquiera sea una criatura, sino una mezcla de sustancias de las alcantarillas que ha desarrollado un atisbo de voluntad propia.
actors.mobs.goo.enraged=enfurecido
actors.mobs.goo.gluuurp=¡GLUUUURP!
actors.mobs.goo.name=Masa viscosa
actors.mobs.goo.notice=¡GLURP-GLURP!
actors.mobs.goo.pumpup=¡Goo se está inflando!
actors.mobs.goo.rankings_desc=Absorbido por la sustancia viscosa
actors.mobs.greatcrab.def_verb=obstruido
actors.mobs.greatcrab.desc=Este cangrejo es gigantesco, incluso comparado con otros cangrejos de alcantarilla. Su caparazón azul está cubierto de grietas y percebes, lo que indica su antigüedad. Se mueve lentamente, apenas manteniendo el equilibrio con su enorme pinza. Aunque el cangrejo solo tiene una pinza, su tamaño lo compensa fácilmente. El cangrejo sostiene la pinza frente a cualquier amenaza, protegiéndose tras una impenetrable pared de caparazón. Sin embargo, el cangrejo no puede bloquear ataques que no ve venir, ni ataques de múltiples enemigos a la vez.
actors.mobs.greatcrab.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.greatcrab.name=cangrejo grande
actors.mobs.greatcrab.noticed=El cangrejo bloquea con su enorme pinza.
actors.mobs.guard.def_verb=obstruido
actors.mobs.guard.desc=Antes guardianes de la prisión, estos guardias se han vuelto tan inseparables como los reclusos. Deambulan como zombis, vagando sin rumbo por los pasillos en busca de cualquier cosa fuera de lugar, ¡como tú! Llevan cadenas alrededor de la cadera, posiblemente usadas para atraer enemigos a corta distancia.
actors.mobs.guard.name=guardia de prisión
actors.mobs.guard.scorpion=¡Ven aquí!
actors.mobs.hermitcrab.def_verb=obstruido
actors.mobs.hermitcrab.desc=Por alguna razón, ¡este cangrejo de alcantarilla ha decidido ponerse la parte superior rota de un barril en la cabeza! El peso extra lo ha ralentizado hasta la velocidad normal, pero también le ha proporcionado mucha más defensa. Sin embargo, ¿crees oír algo rebotando dentro del barril?
actors.mobs.hermitcrab.name=cangrejo ermitaño
actors.mobs.mimic.desc=Los mímicos son criaturas mágicas que pueden adoptar cualquier forma que deseen. En las mazmorras, casi siempre eligen la forma de un cofre del tesoro para atraer a aventureros desprevenidos. Los mímicos tienen una mordida desagradable, pero a menudo contienen más tesoros que un cofre normal.
actors.mobs.mimic.discover_hint=Puedes encontrar a este enemigo en cualquier parte de la mazmorra.
actors.mobs.mimic.hidden_hint=Este cofre tiene algo raro... Acercarse e intentar abrirlo podría ser una mala idea.
actors.mobs.mimic.name=mímico
actors.mobs.mimic.reveal=¡Ese pecho es un imitador!
actors.mobs.mob.died=Se oye algo morir a lo lejos.
actors.mobs.mob.discover_hint=Puedes encontrar a este enemigo en una región específica de la mazmorra.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Asesinado por: %s
actors.mobs.monk$focus.desc=Este monje está perfectamente concentrado en su objetivo y parece anticipar sus movimientos antes de que los realice.\n\nMientras está concentrado, el siguiente ataque físico dirigido contra este personaje fallará con seguridad, sin importar las circunstancias. Desviar este ataque consumirá la concentración del monje, y necesitará acumularla de nuevo para desviar otro ataque. Los monjes acumulan concentración más rápidamente mientras se mueven.
actors.mobs.monk$focus.name=enfocado
actors.mobs.monk.def_verb=obstruido
actors.mobs.monk.desc=Estos monjes fanáticos se consagraron a proteger los secretos de su ciudad de cualquier extranjero. No usan armas ni armaduras: confían por completo en el combate cuerpo a cuerpo.
actors.mobs.monk.name=monje enano
actors.mobs.monk.parried=paró
actors.mobs.necromancer$necroskeleton.desc=Este esqueleto ha sido invocado por un nigromante. Se comporta como un esqueleto normal y morirá cuando el nigromante que lo invocó sea asesinado.
actors.mobs.necromancer$necroskeleton.name=esqueleto de nigromante
actors.mobs.necromancer.desc=Estos aprendices de magos oscuros han acudido en masa a la prisión, ya que es el lugar perfecto para practicar su malvado oficio. Los nigromantes invocarán y darán poder a esqueletos para que luchen por ellos. Matar al nigromante también matará al esqueleto que invoque.
actors.mobs.necromancer.name=nigromante
actors.mobs.npcs.blacksmith.cant_enter_old=Esa zona no es accesible en esta partida. ¡Inicia una nueva partida para probar la nueva misión!
actors.mobs.npcs.blacksmith.def_verb=obstruido
actors.mobs.npcs.blacksmith.desc=Este herrero trol tiene el aspecto típico de los trols: es alto y delgado, y su piel se asemeja a la piedra tanto en color como en textura. El herrero trol está trasteando con herramientas desproporcionadamente pequeñas.
actors.mobs.npcs.blacksmith.enter_no=Aún no
actors.mobs.npcs.blacksmith.enter_yes=Estoy listo
actors.mobs.npcs.blacksmith.entrance_blocked=El camino de bajada está bloqueado.
actors.mobs.npcs.blacksmith.exit_no=Aún no
actors.mobs.npcs.blacksmith.exit_warn_crystal=Ese cristal gigante sigue ahí abajo. Te pagaré extra si lo destruyes.
actors.mobs.npcs.blacksmith.exit_warn_full=¿Terminaste? Tienes mucho oro, pero asegúrate de no haber dejado nada de tu equipo atrás. \n\n_Recuerda, no te dejaré volver a entrar una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Esa seta gigante sigue ahí abajo. Te pagaré extra si la matas.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ese gnoll geomante sigue ahí abajo. Te pagaré extra si lo matas.
actors.mobs.npcs.blacksmith.exit_warn_high=¿Terminaste? Parece que tienes una buena cantidad de oro, pero me vendría bien un poco más. Deberías poder conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver a entrar una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_low=¿Ya terminaste? No parece que tengas mucho oro. Deberías poder conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver a entrar una vez que subas._
actors.mobs.npcs.blacksmith.exit_warn_med=¿Terminaste? Al menos tienes algo de oro, pero definitivamente hay más en la mina. Deberías poder conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver a entrar una vez que salgas._
actors.mobs.npcs.blacksmith.exit_warn_none=¿Ya terminaste? ¡Apenas tienes oro! Deberías poder conseguir _40 piezas._\n\n_Recuerda, no te dejaré volver a entrar una vez que subas._
actors.mobs.npcs.blacksmith.exit_yes=He terminado
actors.mobs.npcs.blacksmith.get_lost=Estoy ocupado. ¡Piérdete!
actors.mobs.npcs.blacksmith.intro_quest_cleric=¡Hola, humano! Pareces alguien importante.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Ten cuidado, la mina es peligrosa para un humano pequeño como tú. Ha estado abandonada por un tiempo, y han comenzado a crecer un montón de cristales. Son brillantes, pero demasiado frágiles para valer algo, y tienen algunas cosas mágicas que los protegen. Son bastante fuertes, así que _ten cuidado donde extraes_ o llamarás su atención.\n\nTambién hay un _cristal gigante_ en algún lugar. Es mucho más duro, así que prepárate para una pelea si empiezas a romperlo. Apuesto a que romperlo ralentizará el crecimiento de todos los cristales, así que te pagaré extra si puedes hacerlo.
actors.mobs.npcs.blacksmith.intro_quest_duelist=¡Hola, humano! Pareces muy valiente.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Ten cuidado, la mina es peligrosa para un pequeño humano como tú. Hay una especie de monstruo de hongos que ha estado creciendo ahí abajo. Tiene centinelas de hongos que son realmente mortales si te ven, pero al menos no pueden levantarse y perseguirte. _Mantente fuera de la vista_ si quieres seguir con vida.\n\nI Te pagaré extra si logras acabar con el _hongo más grande_, pero requerirá un verdadero esfuerzo. Está conectado a un montón de nodos de micelio que están escondidos en las paredes. Tendrás que romper la mayoría de ellos antes de poder dañarlo realmente.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Ten cuidado, la mina es peligrosa para un pequeño humano como tú. Algunos gnolls también quieren el oro y ahora están destrozando el lugar. Son unas cosas estúpidas, así que su minería ha causado todo tipo de derrumbes y desprendimientos. Tendrás que excavar a través de ella, así que _busca roca removida recientemente._\n\nCreo que uno de los gnolls está causando la mayoría de los problemas, probablemente un _chamán geomante_ o algo así. Te pagaré extra si puedes encontrarlo y matarlo, pero estoy seguro de que se defenderá.
actors.mobs.npcs.blacksmith.intro_quest_huntress=¡Hola, humano! Pareces muy rápido.
actors.mobs.npcs.blacksmith.intro_quest_mage=¡Hola, humano! Pareces muy inteligente.
actors.mobs.npcs.blacksmith.intro_quest_rogue=¡Hola, humano! Pareces muy astuto.
actors.mobs.npcs.blacksmith.intro_quest_start=¿Quieres ser útil, eh? Sí, tengo algo que podrías hacer. Construí este taller encima de una vieja mina, está justo bajando esa escalera. Toma este pico y mina un poco de _mineral de oro oscuro_. 40 piezas deberían ser suficientes. La roca de abajo es bonita y blanda así que _podrás minar a través de las paredes con algo de esfuerzo._\n\n¿Qué quieres decir con cómo voy a pagar? Eres codicioso...\n\nVale, vale, puedo hacer algo de herrería para ti. Considérate afortunado, soy el único herrero por aquí.
actors.mobs.npcs.blacksmith.intro_quest_warrior=¡Hola, humano! Pareces muy duro.
actors.mobs.npcs.blacksmith.lost_pick=¿Me estás tomando el pelo? ¿Dónde está mi pico?
actors.mobs.npcs.blacksmith.name=herrero trol
actors.mobs.npcs.blacksmith.quest_start_prompt=¿Estás listo para bajar? Asegúrate de tener espacio libre para el oro.\n\n_¡Solo te decepcionaré ahí una vez!_
actors.mobs.npcs.blacksmith.reminder=¿Ya terminaste de hacerme perder el tiempo? La entrada a la mina está allí.
actors.mobs.npcs.blacksmith.reminder_crystal=Tráeme todo el oro que puedas, e intenta romper también el cristal grande.
actors.mobs.npcs.blacksmith.reminder_fungi=Tráeme todo el oro que puedas, e intenta matar también al hongo gigante.
actors.mobs.npcs.blacksmith.reminder_gnoll=Tráeme todo el oro que puedas, e intenta matar también al geomante gnoll.
actors.mobs.npcs.ghost.crab_1=Hola %s... Una vez fui como tú: fuerte y seguro de mí mismo... Pero fui asesinado por una criatura ancestral... No puedo abandonar este lugar... No hasta que me vengue... Mata al gran cangrejo que me quitó la vida... \n\nEs antinaturalmente viejo... Con una enorme pinza y un caparazón grueso... ¡Cuidado con su pinza! Debes sorprender al cangrejo o te bloqueará con ella...
actors.mobs.npcs.ghost.crab_2=Por favor... Ayúdame... A matar al crustáceo... \n\n_Siempre bloqueará... Cuando te vea venir..._
actors.mobs.npcs.ghost.desc=El fantasma apenas es visible. Parece una mancha informe de luz tenue con un rostro triste.
actors.mobs.npcs.ghost.find_me=Gracias... ven a buscarme...
actors.mobs.npcs.ghost.gnoll_1=Hola %s... Una vez fui como tú: fuerte y seguro de mí mismo... Pero fui asesinado por un enemigo astuto... No puedo abandonar este lugar... No hasta que me vengue... Mata al embaucador gnoll que me quitó la vida... \n\nNo es como los demás gnolls... Se esconde y usa armas arrojadizas... Cuidado con sus dardos venenosos e incendiarios, no ataques desde la distancia...
actors.mobs.npcs.ghost.gnoll_2=Por favor... Ayúdame... Acaba con el embaucador... \n\n_No dejes que te golpee... Acércate a él..._
actors.mobs.npcs.ghost.name=fantasma triste
actors.mobs.npcs.ghost.rat_1=Hola %s... Una vez fui como tú: fuerte y seguro de mí mismo... Pero fui asesinado por una bestia inmunda... No puedo abandonar este lugar... No hasta que me vengue... Mata a la rata fétida que me quitó la vida... \n\n Acecha en este piso... Esparciendo inmundicia por todas partes... Cuidado con su nube de hedor y su mordedura corrosiva, el ácido se disuelve en agua...
actors.mobs.npcs.ghost.rat_2=Por favor... Ayúdame... Mata a la abominación... \n\n_Combínala cerca del agua... Evita el hedor..._
actors.mobs.npcs.imp.cya=¡Hasta luego, %s!
actors.mobs.npcs.imp.desc=Los diablillos son demonios menores. No destacan ni por su fuerza ni por su talento mágico, pero son bastante inteligentes y sociables. Muchos diablillos prefieren vivir entre seres que no son demonios.
actors.mobs.npcs.imp.golems_1=En mi caso, son los _gólems_ los que hay que matar. Verás, voy a montar un pequeño negocio aquí, ¡pero esos estúpidos gólems son un desastre! ¡Es muy difícil negociar con esos trozos de granito errantes, malditos sean! Así que, por favor, mata... digamos _cuatro de ellos_ y te llevarás una recompensa.
actors.mobs.npcs.imp.golems_2=¿Cómo va tu safari de gólems? No olvides recoger esas fichas.
actors.mobs.npcs.imp.hey=¡Psst, %s!
actors.mobs.npcs.imp.intro=¿Eres aventurero? ¡Me encantan los aventureros! Siempre puedes contar con ellos si hay que eliminar a alguien, ¿verdad? ¡Por una recompensa, claro! ;)
actors.mobs.npcs.imp.monks_1=En mi caso, son los monjes los que hay que matar. Verás, voy a montar un pequeño negocio aquí, pero esos locos no compran nada y ahuyentarán a los demás clientes. Así que, por favor, mata... digamos, a cinco de ellos y te llevas una recompensa.
actors.mobs.npcs.imp.monks_2=¡Oh, sigues vivo! Sabía que tu kung-fu sería más fuerte ;) Solo no olvides recoger esas fichas.
actors.mobs.npcs.imp.name=ambicioso imp
actors.mobs.npcs.impshopkeeper.buyback=El duende te devuelve el objeto con alegría.
actors.mobs.npcs.impshopkeeper.desc=El duende ha montado una pequeña tienda en el límite de los pasillos interiores. Es agradable ver una cara amable, pero sus precios no parecen nada amigables.
actors.mobs.npcs.impshopkeeper.greetings=¡Hola, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=¿Qué hiciste, %s? ¡Compra rápido, tengo que salir de aquí!
actors.mobs.npcs.impshopkeeper.name=ambicioso imp
actors.mobs.npcs.impshopkeeper.thief=¡Pensé que podía confiar en ti!
actors.mobs.npcs.mirrorimage.desc=Esta ilusión se parece mucho a ti, pero es más pálida y tiembla un poco.
actors.mobs.npcs.mirrorimage.discover_hint=Puedes encontrar a este personaje con un pergamino específico.
actors.mobs.npcs.mirrorimage.name=imagen especular
actors.mobs.npcs.npc.discover_hint=Puedes encontrar a este personaje en una zona específica de la mazmorra.
actors.mobs.npcs.prismaticimage.desc=Esta ilusión brillante se parece mucho a ti, incluso parece empuñar tu arma y armadura actuales.\n\nLas imágenes prismáticas intentarán buscar y atraer la atención de los enemigos, usando su defensa y salud mejoradas para protegerte. Si bien no tienen el mismo poder ofensivo que las imágenes espejo, tienen una durabilidad mejorada, incluyendo recibir beneficios de tu armadura.\n\nCuando se reduce a 0 hp, las imágenes prismáticas se desvanecerán durante varios turnos y aún pueden ser curadas durante este tiempo. Cuando no hay enemigos presentes, las imágenes prismáticas se desvanecerán y se reunirán con su amo.
actors.mobs.npcs.prismaticimage.discover_hint=Puedes encontrar a este personaje con un pergamino específico.
actors.mobs.npcs.prismaticimage.name=imagen prismática
actors.mobs.npcs.ratking.confused=¿Qué...? ¿Dónde estoy? ¡Mi reino me necesita!
actors.mobs.npcs.ratking.crown_after=¿Disfrutando de tu nueva armadura? ¡No hay vuelta atrás!
actors.mobs.npcs.ratking.crown_clothes=¡Ponte algo de ropa! ¡No estás en condiciones de hablar con la realeza!
actors.mobs.npcs.ratking.crown_desc=¡Oh, ¿esa corona es para mí?! ¡Parece mucho más brillante que la mía, así que la acepto con gusto! De hecho, creo que puedo ofrecerte algo como recompensa por esta corona. ¡Un poder tremendo digno de un héroe como tú! ¿Te gustaría?
actors.mobs.npcs.ratking.crown_fine=¡Bien! De todas formas, no es que lo quisiera...
actors.mobs.npcs.ratking.crown_info=Cuéntame más primero.
actors.mobs.npcs.ratking.crown_no=Prefiero no...
actors.mobs.npcs.ratking.crown_thankyou=Jejeje, ¡gracias! ¡Ahora ve y enorgullece a tu rey!
actors.mobs.npcs.ratking.crown_yes=¡Por supuesto!
actors.mobs.npcs.ratking.desc=Esta rata es un poco más grande que una rata marsupial común. Lleva una pequeña corona en la cabeza.
actors.mobs.npcs.ratking.desc_birthday=Esta rata es un poco más grande que una rata marsupial común. Lleva un pequeño gorro de fiesta verde en lugar de su corona habitual. ¡Feliz cumpleaños, Rey Rata!
actors.mobs.npcs.ratking.desc_crown=Esta rata es un poco más grande que una rata marsupial común. Lleva una corona de rey enano en la cabeza.
actors.mobs.npcs.ratking.desc_winter=Esta rata es un poco más grande que una rata marsupial común. Lleva un pequeño sombrero festivo en lugar de su corona habitual. ¡Felices fiestas!
actors.mobs.npcs.ratking.discover_hint=Puedes encontrar a este personaje al final de una zona específica de la mazmorra.
actors.mobs.npcs.ratking.name=rey rata
actors.mobs.npcs.ratking.not_sleeping=¡No estoy durmiendo!
actors.mobs.npcs.ratking.what_is_it=¿Qué pasa? No tengo tiempo para estas tonterías. ¡Mi reino no se va a gobernar solo!
actors.mobs.npcs.sheep.baa!=¡Balido!
actors.mobs.npcs.sheep.baa.=Balido.
actors.mobs.npcs.sheep.baa...=Balido...
actors.mobs.npcs.sheep.baa?=¿Balido?
actors.mobs.npcs.sheep.def_verb=obstruido
actors.mobs.npcs.sheep.desc=Esta es una oveja mágica. ¿Qué tiene de mágico? Que no puedes matarla. Se quedará ahí parada hasta que se desvanezca mágicamente, rumiando con la mirada perdida.
actors.mobs.npcs.sheep.discover_hint=Puedes encontrar a este personaje con un objeto o trampa específicos.
actors.mobs.npcs.sheep.name=oveja
actors.mobs.npcs.shopkeeper.buyback=El dependiente devuelve el artículo a regañadientes.
actors.mobs.npcs.shopkeeper.desc=Este tipo corpulento parece más propio de un distrito comercial de una gran ciudad que de una mazmorra. Sus precios explican por qué prefiere hacer negocios aquí.
actors.mobs.npcs.shopkeeper.flee=¡El tendero huye!
actors.mobs.npcs.shopkeeper.name=tendero
actors.mobs.npcs.shopkeeper.sell=Vender un artículo
actors.mobs.npcs.shopkeeper.talk=Hablar
actors.mobs.npcs.shopkeeper.talk_ascent=No sé qué piensas hacer con ese amuleto, pero no quiero saber nada de él. Compra algo y sigue adelante, ¡ambos tenemos que irnos de aquí!
actors.mobs.npcs.shopkeeper.talk_caves=Gasta dinero, vive más.\n\nAh, y saluda de mi parte a ese herrero troll si lo ves. ¡Recuérdale al grandulón que todavía me debe dinero por el martillo que le vendí la semana pasada!
actors.mobs.npcs.shopkeeper.talk_city=Mis mercancías pueden mantenerte a salvo aquí abajo.\n\n... Y por favor, no te quedes por aquí. ¡Me costó muchísimo conseguir que los lugareños me dejaran en paz, no quiero que atraigas ningún problema!
actors.mobs.npcs.shopkeeper.talk_halls=Hola, ¡tengo precios especiales para cazadores de demonios!\n\n¡Oh, y ten cuidado ahí abajo! A los demonios de abajo no les importará lo valiente que seas. ¡No puedes volver a subir y gastar más dinero si estás muerto! ;)\n\n¿Los demonios son como yo? Jeje, para nada. Solo soy un tipo pequeño, no muy luchador, y he logrado mantener mi mente intacta. Los demonios de abajo son cosas mucho más fuertes, y todos han sido esclavizados por... bueno... solo ten cuidado ahí abajo.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Hola, Su Alteza, ¿o es Su Santidad ahora? Jeje, en cualquier caso, este no es lugar para usted; mucha gente se sentiría muy afligida si muriera. Seguro que tiene algo de dinero, ¿por qué no compra algo para evitarlo?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=¡Vaya, si no es el héroe viajero! Si intentas salvar otro pueblo, buena suerte, los peligros aquí son mucho peores que los de simples bandas de bandidos. Seguro que lo harás mejor que nadie, solo intenta no morir justo delante de mi tienda.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Parece que no estás en tu elemento, señorita. Los estrechos pasillos de las mazmorras no son tan espaciosos como los grandes salones o los bosques que rodean la ciudad, ¿verdad? Jeje, oh, no le hagas caso a mi divagación, ¿por qué no compras algo?
actors.mobs.npcs.shopkeeper.talk_prison_intro=¡Tengo todo lo que necesitas para una aventura exitosa!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Jeje, creo que he visto un cartel de "Se busca" con tu nombre en algún lugar de la ciudad. ¿Estás huyendo? ¿Ah, eres inocente? Claro, claro... No te preocupes, tengo cosas mejores que hacer que informar sobre ti, pero ¿quizás deberías comprar algo para estar seguro?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=¿Vienes del gremio de ladrones para limpiar la zona? ¿No? ¿Solo de compras? Bueno, aprovecha para matar a unos cuantos monstruos. No esperes ningún descuento, os pago una buena cantidad por protección y aquí abajo apenas me protegéis.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Tienes un sello interesante, normalmente están intactos. ¿Eres un héroe caído en desgracia o algo así? Bueno, lo que hayas hecho no es asunto mío, tus monedas siguen siendo válidas.
actors.mobs.npcs.shopkeeper.thief=¡Ladrón, ladrón!
actors.mobs.npcs.shopkeeper.warn=¡Ten cuidado! No te lo volveré a advertir.
actors.mobs.npcs.vaultlaser.desc=Este centinela dispara láseres a intervalos regulares. _Como se trata solo de una zona de pruebas, los láseres no te harán daño._
actors.mobs.npcs.vaultlaser.name=centinela láser de bóveda
actors.mobs.npcs.vaultsentry.desc=Este centinela está escaneando la zona siguiendo un patrón. _Como se trata solo de una zona de prueba, el centinela no hará nada si te detecta._
actors.mobs.npcs.vaultsentry.name=centinela de escaneo de bóveda
actors.mobs.npcs.wandmaker.def_verb=obstruido
actors.mobs.npcs.wandmaker.desc=Este anciano, pero de buena salud, luce una expresión ligeramente confusa. Está protegido por un escudo mágico.
actors.mobs.npcs.wandmaker.intro_1=I Vine aquí para encontrar un ingrediente raro para una varita, pero me he perdido y mi escudo mágico se está debilitando. Tendré que irme pronto, pero no puedo soportar irme sin conseguir lo que vine a buscar.
actors.mobs.npcs.wandmaker.intro_2=Si puedes conseguirme eso, con gusto te pagaré con una de mis varitas finamente elaboradas. Traje dos, así que puedes tomar la que prefieras.
actors.mobs.npcs.wandmaker.intro_berry=El antiguo alcaide de esta prisión tenía una planta de bayas podridas, y yo busco una de sus semillas. Probablemente la planta ya se haya asilvestrado, así que conseguir que me dé una semilla podría ser complicado. Su jardín debería estar por aquí cerca. Intenta mantenerte alejado de sus enredaderas si quieres salir ileso. Usar fuego puede ser tentador, pero por favor, no lo hagas, matarás la planta y destruirás sus semillas.
actors.mobs.npcs.wandmaker.intro_cleric=¡Oh, hola Su Alteza! ¡Qué grata sorpresa encontrarle en un lugar tan deprimente! Odio molestarle, pero quizás tenga una tarea para usted.
actors.mobs.npcs.wandmaker.intro_duelist=¡Oh, hola señorita! ¡Qué grata sorpresa encontrar a un héroe en un lugar tan deprimente! Si está dispuesta a ayudar a un anciano, tal vez tenga una tarea para usted.
actors.mobs.npcs.wandmaker.intro_dust=Busco polvo de cadáver. Es un tipo especial de harina de huesos maldita que suele aparecer en lugares como este. Seguro que hay una habitación cerrada por aquí cerca; estoy seguro de que aparecerá algo de polvo. Ten cuidado, la maldición que lleva es muy potente. Vuelve a contactarme cuanto antes y lo purificaré.
actors.mobs.npcs.wandmaker.intro_ember=Estoy buscando _brasas frescas_ de un elemental de fuego recién nacido. Los elementales suelen aparecer cuando un ritual de invocación no está controlado, así que solo necesitas algunas velas y un lugar para el ritual, y seguro que podrás hacer que aparezca uno. Sin embargo, _deberás evitar quedarte encerrado_ mientras luchas contra él, o podrías _tener a mano algún objeto que congele_. Los elementales recién nacidos son bastante poderosos y caóticos, pero no soportan el frío.
actors.mobs.npcs.wandmaker.intro_huntress=¡Oh, hola señorita! Una cara amable siempre es una grata sorpresa por aquí, ¿verdad? De hecho, juraría que la he visto antes, pero no logro recordar de dónde... Bueno, no importa, si viene en busca de aventuras, tal vez tenga una tarea para usted.
actors.mobs.npcs.wandmaker.intro_mage=¡Oh, hola %s! ¿He oído que ha habido algún revuelo entre tú y el Instituto de Magos? Bueno, no importa, nunca me han caído bien esos aguafiestas. Si te interesa, quizás tenga una tarea para ti.
actors.mobs.npcs.wandmaker.intro_rogue=¡Ay, Dios mío, me has asustado! No he conocido a ningún bandido de este lugar que conserve la cordura, ¡así que debes ser de la superficie! Si estás dispuesto a ayudar a un desconocido, tal vez tenga una tarea para ti.
actors.mobs.npcs.wandmaker.intro_warrior=¡Oh, hola! ¡Qué grata sorpresa encontrarme con un guerrero del norte en un lugar tan deprimente! Debes haber viajado bastante lejos para llegar hasta aquí. Si buscas aventura, tal vez tenga una misión para ti.
actors.mobs.npcs.wandmaker.name=viejo fabricante de varitas
actors.mobs.npcs.wandmaker.reminder_berry=¿Has tenido suerte con la semilla de Rotberry, %s? Busca una habitación llena de vegetación.
actors.mobs.npcs.wandmaker.reminder_dust=¿Has tenido suerte con el polvo de cadáver, %s? Busca algunas barricadas.
actors.mobs.npcs.wandmaker.reminder_ember=¿Has tenido suerte con esas brasas, %s? Necesitarás encontrar cuatro velas y el lugar del ritual.
actors.mobs.phantompiranha.desc=Las pirañas fantasma son una raza rara de pirañas con habilidades mágicas y cuerpos translúcidos inquietantes. Son capaces de teletransportarse mientras son atacadas, ya sea para escapar o para acercarse rápidamente a su enemigo. Aunque son molestas de combatir, su carne es apreciada por sus propiedades mágicas.
actors.mobs.phantompiranha.name=piraña fantasma
actors.mobs.phantompiranha.teleport_away=La piraña fantasma se teletransporta...
actors.mobs.piranha.desc=Estos peces carnívoros se crían específicamente para proteger las zonas inundadas. Su mordedura es mortal, por lo que es mejor evitar enfrentarse a ellos directamente.
actors.mobs.piranha.discover_hint=Puedes encontrar a este enemigo en cualquier parte de la mazmorra.
actors.mobs.piranha.name=piraña gigante
actors.mobs.pylon.desc_active=Un poste de energía, destinado a ayudar a regular la electricidad que alimenta la maquinaria en esta área. El poste está actualmente sobrecargado de energía eléctrica, ¡esto debe ser lo que está supercargando a DM-300!\n\nEn este estado los postes son vulnerables, pero generarán arcos eléctricos a las celdas cercanas en un patrón en el sentido de las agujas del reloj. Debido a su construcción de metal pesado, los postes son resistentes a grandes cantidades de daño.
actors.mobs.pylon.desc_inactive=Una torre de alta tensión, destinada a ayudar a regular la electricidad que alimenta la maquinaria en esta área.\n\nActualmente la torre está inactiva e inmune a los daños.
actors.mobs.pylon.name=torre eléctrica
actors.mobs.rat.desc=Las ratas marsupiales son habitantes agresivos pero bastante débiles de las alcantarillas. Tienen una mordedura desagradable, pero solo representan una amenaza mortal en grandes cantidades.
actors.mobs.rat.name=rata marsupial
actors.mobs.ripperdemon.desc=Estas horribles criaturas son el resultado de que las fuerzas demoníacas hayan utilizado los numerosos cadáveres de enanos de esta región. Los desgarradores son criaturas grotescas y demacradas que se asemejan a enanos, pero con cuerpos rotos y largas y afiladas garras de hueso. Los demonios desgarradores no son particularmente resistentes, pero son ágiles y peligrosos. Son capaces de saltar grandes distancias para alcanzar rápidamente a sus objetivos antes de cornearlos con sus garras.
actors.mobs.ripperdemon.leap=¡El demonio destripador se prepara para saltar!
actors.mobs.ripperdemon.name=demonio destripador
actors.mobs.rotheart.desc=El fruto de la Rotberry es muy singular. En lugar de pudrirse y aportar nutrientes, crece, se endurece y envuelve la semilla. Esto protege los órganos internos que se desarrollan en su interior. Esta esfera gigante se conoce como el corazón de la planta adulta de Rotberry.
actors.mobs.rotheart.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.rotheart.name=corazón podrido
actors.mobs.rotlasher.desc=El látigo de la podredumbre forma parte de la estructura radicular de la planta madura de la baya podrida y es su principal mecanismo de defensa. Los látigos son ciegos y están clavados en el suelo, pero atacan violentamente a cualquier amenaza cercana tras detectarla. Cuando no hay enemigos cerca, permanecen inmóviles, intentando mimetizarse con la vegetación circundante.
actors.mobs.rotlasher.discover_hint=Puedes encontrar a este enemigo durante una misión específica.
actors.mobs.rotlasher.name=látigo podrido
actors.mobs.scorpio.desc=Estas enormes criaturas demoníacas con aspecto de arácnidos evitan el combate cuerpo a cuerpo, prefiriendo disparar púas dentadas y paralizantes desde largas distancias.
actors.mobs.scorpio.name=Escorpión
actors.mobs.senior.desc=Estos monjes fanáticos se consagraron a proteger los secretos de su ciudad de cualquier extranjero. No usan armas ni armaduras: confían por completo en el combate cuerpo a cuerpo.
actors.mobs.senior.name=monje anciano
actors.mobs.shaman$blueshaman.spell_desc=Este chamán lleva una máscara azul y usará magia que aumenta temporalmente el daño que recibes.
actors.mobs.shaman$purpleshaman.spell_desc=Este chamán lleva una máscara morada y usará magia que reduce temporalmente tu precisión y evasión.
actors.mobs.shaman$redshaman.spell_desc=Este chamán lleva una máscara roja y usará magia que debilita temporalmente tu poder de ataque.
actors.mobs.shaman.bolt_kill=El rayo mágico te mató...
actors.mobs.shaman.desc=Los gnolls más inteligentes pueden aprender magia chamánica. Sus chamanes prefieren los hechizos de combate para compensar su falta de fuerza y no dudan en usarlos contra quienes cuestionan su posición en la tribu.
actors.mobs.shaman.name=chamán gnoll
actors.mobs.skeleton.def_verb=obstruido
actors.mobs.skeleton.desc=Los esqueletos están hechos con los huesos de aventureros desafortunados y habitantes de la mazmorra, animados por la magia maligna que emana de las profundidades. Cuando reciben suficiente daño, se deshacen en una explosión de huesos.
actors.mobs.skeleton.explo_kill=Moriste por la explosión de huesos...
actors.mobs.skeleton.name=esqueleto
actors.mobs.slime.def_verb=obstruido
actors.mobs.slime.desc=Los slimes son criaturas extrañas y ligeramente mágicas con un cuerpo exterior gomoso y un núcleo líquido. Las alcantarillas de la ciudad les proporcionan un amplio suministro de agua y nutrientes. Debido a su membrana exterior elástica, es difícil infligir más de _6 puntos de daño_ a los slimes con un solo ataque.
actors.mobs.slime.name=limo
actors.mobs.snake.desc=Estas serpientes gigantes son capaces de esquivar rápidamente los golpes, lo que las hace bastante difíciles de alcanzar. Sin embargo, los ataques mágicos o los ataques sorpresa pueden tomarlas por sorpresa. Puedes realizar un ataque sorpresa atacando cuando estés fuera del campo de visión de la serpiente. Una forma es dejar que una serpiente te persiga a través de una puerta y luego atacar justo después de que entre por la puerta.
actors.mobs.snake.hint=Prueba a usar el botón de examinar en una serpiente para aprender a contrarrestarlas.
actors.mobs.snake.name=serpiente de alcantarilla
actors.mobs.spectralnecromancer.desc=Si bien los esqueletos son el pan de cada día de un nigromante, algunos prefieren buscar otros esbirros menos corpóreos. ¡Los nigromantes espectrales han elegido a los espectros como sus esbirros predilectos!\n\nLos espectros individuales no son tan fuertes como los esqueletos, ¡pero estos nigromantes no tienen miedo de invocar a un grupo de ellos!
actors.mobs.spectralnecromancer.name=nigromante espectral
actors.mobs.spinner.desc=Estas arañas de las cavernas, peludas y verdosas, evitan el combate directo. Prefieren esperar a distancia mientras su víctima, atrapada en su telaraña, muere lentamente por su mordedura venenosa.
actors.mobs.spinner.name=araña de las cavernas
actors.mobs.statue.def_verb=obstruido
actors.mobs.statue.desc=Uno pensaría que es simplemente otra de las estatuas inanimadas de esta mazmorra, pero sus ojos rojos brillantes la delatan.
actors.mobs.statue.desc_weapon=Aunque la estatua en sí está hecha de piedra, el _%s_ que empuña parece real.
actors.mobs.statue.discover_hint=Puedes encontrar a este enemigo en cualquier parte de la mazmorra.
actors.mobs.statue.name=estatua animada
actors.mobs.succubus.desc=Las súcubos son demonios con aspecto de mujeres seductoras, de aire algo gótico. Su magia puede encantar a un héroe e impedirle atacar a cualquiera hasta que el encanto desaparezca.
actors.mobs.succubus.name=súcubo
actors.mobs.swarm.desc=El letal enjambre de moscas zumba furioso. Cualquier ataque no mágico lo dividirá en dos enjambres más pequeños, pero igualmente peligrosos.
actors.mobs.swarm.name=enjambre de moscas
actors.mobs.tengu$bombability$bombblob.desc=Una nube de humo sobrecalentado se eleva aquí. ¡Cuidado, va a explotar!
actors.mobs.tengu$bombability$bombitem.cant_pickup=¡Está pegado al suelo, no puedes moverlo!
actors.mobs.tengu$bombability$bombitem.desc=Tengu ha lanzado una extraña bomba de humo aquí, que está desprendiendo un humo denso y caliente. ¡Hace un fuerte tictac, como si estuviera contando hacia atrás para una explosión! La bomba se ha anclado al suelo, así que no puedes recogerla.
actors.mobs.tengu$bombability$bombitem.name=bomba de humo
actors.mobs.tengu$fireability$fireblob.desc=Tengu ha lanzado un polvo fino que parece estar prendiendo fuego al vapor; ¡está a punto de incendiarse!
actors.mobs.tengu$shockerability$shockerblob.desc=¡Aquí se está generando energía eléctrica! ¡Cualquier cosa que esté parada sobre esta casilla recibirá una descarga eléctrica en el próximo turno!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=¡Está generando demasiada electricidad, no puedes agarrarla!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu ha lanzado aquí una máquina curiosa, que parece estar hecha de piezas DM-100. La máquina emite constantemente arcos eléctricos a su alrededor, pero parece seguir un patrón predecible.\n\nCon todos los arcos eléctricos a su alrededor, es imposible que puedas recogerla.
actors.mobs.tengu$shockerability$shockeritem.name=Sorpresa desagradable
actors.mobs.tengu.defeated=Libre por fin...
actors.mobs.tengu.desc=Los Tengu pertenecen a un antiguo clan de asesinos del mismo nombre. Son conocidos por su abundante uso de shurikens y trampas.
actors.mobs.tengu.interesting=Hagamos que esto sea interesante...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=¡Te pillé, %s!
actors.mobs.tengu.notice_have=¡Ahora te tengo, %s!
actors.mobs.tengu.rankings_desc=Asesinado por el Tengu
actors.mobs.thief.carries=El ladrón lleva un _%s._ Robado obviamente.
actors.mobs.thief.desc=Aunque estos reclusos andan libres de sus celdas, este lugar sigue siendo su prisión. Con el tiempo, este lugar les ha arrebatado la cordura y la libertad. Hace mucho que estos ladrones y bandidos locos olvidaron quiénes eran y por qué robaban. Estos enemigos son más propensos a robar y huir que a luchar. Asegúrate de mantenerlos a la vista, o podrías no volver a ver jamás tu objeto robado.
actors.mobs.thief.escapes=¡El ladrón se lleva tu %s!
actors.mobs.thief.name=ladrón loco
actors.mobs.thief.stole=¡El ladrón te robó %s!
actors.mobs.tormentedspirit.desc=Los espíritus atormentados son espíritus bondadosos que han sido afectados por una maldición. Mientras estén malditos, atacarán como espectros, ¡y además serán más poderosos! Es posible limpiar la maldición usando el objeto adecuado junto al espíritu. Si se levanta la maldición, el espíritu seguramente estará agradecido...
actors.mobs.tormentedspirit.name=espíritu atormentado
actors.mobs.tormentedspirit.thank_you=Gracias...
actors.mobs.vaultrat.desc=Esta rata tiene algunos cambios de comportamiento para probar la nueva IA enemiga de la bóveda:\n_-_ Su movimiento puede ser 'escuchado' a través de las paredes\n_-_ Deambulará por una patrulla preestablecida\n_-_ Mientras deambula, tiene un rango de detección drásticamente reducido detrás de la dirección en la que se mueve.\n_-_ Mientras duerme, su rango de detección también se reduce\n_-_ Cuando te detecta, 'investigará' antes de cambiar a cazar. Los enemigos que investigan se mueven hacia ti pero no atacan y son más fáciles de perder detrás de puertas y esquinas.
actors.mobs.warlock.bolt_kill=El rayo de sombra te mató...
actors.mobs.warlock.desc=Cuando los enanos dejaron la ingeniería por las artes arcanas, los brujos tomaron el poder en la ciudad. Empezaron con la magia elemental, pero pronto pasaron a la demonología y la nigromancia.
actors.mobs.warlock.name=brujo enano
actors.mobs.wraith.desc=Un espectro es el espíritu vengativo de un pecador cuya tumba fue profanada. Al ser una entidad etérea, es muy difícil alcanzarlo con un arma común.
actors.mobs.wraith.discover_hint=Puedes encontrar a este enemigo en cualquier parte de la mazmorra.
actors.mobs.wraith.name=fantasma
actors.mobs.yogdzewa$larva.desc=Estas diminutas criaturas de Yog-Dzewa son simples secuaces fáciles de producir. Si bien individualmente son débiles, se invocan rápidamente y pueden volverse abrumadoras en grandes cantidades.
actors.mobs.yogdzewa$larva.name=larva de dios
actors.mobs.yogdzewa$larva.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa.darkness=La oscuridad se cierne cada vez más cerca...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa es un Dios Antiguo; una gran monstruosidad que llega a los mundos mortales y los devora para alimentar su crecimiento sin fin. Los enanos debieron haber atraído la atención de este horror cósmico mientras jugaban con magias oscuras, y han estado tratando de mantenerlo contenido desde entonces.\n\nYog-Dzewa se origina en una dimensión de caos mágico puro, y no puede traer su verdadera forma a este mundo. En cambio, ha creado avatares y convocado sirvientes demoníacos para que cumplan su mandato aquí.\n\nEste ojo gigante es el punto focal del poder de Yog-Dzewa en este mundo. Si bien el ojo en sí es inmóvil, es capaz de disparar poderosos rayos de magia demoníaca y convocar una variedad de sirvientes para ayudarlo.
actors.mobs.yogdzewa.desc_spawners=Puedes sentir oleadas de energía demoníaca que irradian hacia tus ojos desde los pisos superiores. Algo que dejaste con vida allá arriba debe estar canalizando energía de vuelta a Yog-Dzewa. ¡Yog usará esta energía para invocar secuaces más poderosos!
actors.mobs.yogdzewa.hope=¡TU ESPERANZA ES UNA ILUSIÓN!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=TE VEO.
actors.mobs.yogdzewa.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Este puño está formado por energía lumínica pura. ¡Es capaz de disparar potentes rayos de luz abrasadora en cada turno! Estos rayos te cegarán temporalmente además de infligir un gran daño. ¡El puño también es capaz de envolver brevemente la arena en una luz cegadora para escapar!\n\nSin embargo, el puño no tiene habilidades especiales que pueda usar en el rango cuerpo a cuerpo.
actors.mobs.yogfist$brightfist.name=puño brillante
actors.mobs.yogfist$brightfist.teleport=¡El puño se teletransporta en un destello de luz que te ciega por completo!
actors.mobs.yogfist$burningfist.desc=Un gran puño envuelto en llamas. Sus dedos crepitan al cerrarse y dejan caer brasas al suelo.
actors.mobs.yogfist$burningfist.name=puño ardiente
actors.mobs.yogfist$darkfist.desc=Este puño está formado por energía oscura pura. ¡Es capaz de disparar poderosas ráfagas de magia oscura en cada turno! Estas ráfagas debilitarán tu fuente de luz además de infligir un gran daño. ¡El puño también es capaz de envolver brevemente la arena en oscuridad para escapar!\n\nSin embargo, el puño no tiene habilidades especiales que pueda usar en el rango cuerpo a cuerpo.
actors.mobs.yogfist$darkfist.name=puño oscuro
actors.mobs.yogfist$darkfist.teleport=¡El puño se teletransporta en una explosión de oscuridad que extingue tu fuente de luz!
actors.mobs.yogfist$rottingfist.desc=Un enorme puño de carne podrida. Una baba pestilente se filtra entre sus dedos y mancha la piedra bajo él.
actors.mobs.yogfist$rottingfist.name=puño podrido
actors.mobs.yogfist$rustedfist.desc=Este puño está formado de metal vivo. Es una imponente masa de metal cambiante que posee poderosos ataques cuerpo a cuerpo y puede incapacitar a sus objetivos a distancia. Debido a su tremenda masa, el puño absorberá cualquier daño infligido con el tiempo, en lugar de inmediatamente. Sin embargo, el puño es inflexible y no puede moverse por pasajes estrechos. Además, si bien puede recibir daño lentamente, el daño diferido seguirá aumentando si el puño es golpeado varias veces.
actors.mobs.yogfist$rustedfist.name=puño oxidado
actors.mobs.yogfist$soiledfist.desc=Este puño se forma a partir de magia terrenal caótica. Al moverse, provoca constantemente el crecimiento de vegetación a su alrededor. ¡También puede lanzar explosiones de tierra concentradas que atrapan a su objetivo en enredaderas y raíces de rápido crecimiento! El puño obtiene su poder de esta vida vegetal y resistirá el daño en función de la cantidad de vegetación alta o surcada que haya cerca.
actors.mobs.yogfist$soiledfist.name=puño sucio
actors.mobs.yogfist.desc=Este puño es un aspecto del poder de Yog-Dzewa. Los puños están vinculados al poder de Yog-Dzewa y estarán protegidos de todo daño cuando estén cerca del ojo.
actors.mobs.yogfist.invuln_warn=¡El puño es invulnerable mientras está cerca del ojo!
actors.mobs.yogfist.rankings_desc=Devorado por Yog-Dzewa
