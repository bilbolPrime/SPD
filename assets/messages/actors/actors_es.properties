actors.mobs.elemental.desc=Los elementales de fuego errantes son un efecto secundario de invocar entidades mayores. Su naturaleza es tan caótica que ni el demonólogo más poderoso puede controlarlos.
actors.mobs.elemental.name=elemental de fuego
actors.mobs.king.desc=El último rey de los enanos conocía bien los secretos de la vida y la muerte. Convenció a su corte de participar en un ritual que debía darles juventud eterna. Al final solo él la consiguió, junto con un ejército de muertos vivientes.
actors.mobs.king.name=Rey de los Enanos
actors.mobs.npcs.bee.desc=Pese a su pequeño tamaño, las abejas doradas defienden ferozmente a su amo. Sin embargo, no viven mucho.
actors.mobs.npcs.bee.name=abeja dorada
actors.mobs.shielded.desc=Los brutos son los gnolls más grandes, fuertes y resistentes. Cuando quedan gravemente heridos, entran en frenesí e infligen aún más daño a sus enemigos.
actors.mobs.shielded.name=Bruto acorazado
actors.mobs.yog.desc=Yog-Dzewa es un Dios Antiguo, una poderosa entidad proveniente de los reinos del caos. Hace un siglo, los antiguos enanos apenas lograron vencer a su ejército de demonios, pero fueron incapaces de matar al dios. En su lugar, lo aprisionaron en las salas bajo su ciudad, creyendo que era demasiado débil para resucitar.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s lleva un _%s_. Obviamente robado.
actors.buffs.armorevasion.name=Evasión mejorada
actors.mobs.king.defeated=No puedes matarme, %s...Soy... inmortal...
