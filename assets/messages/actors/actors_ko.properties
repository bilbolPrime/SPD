actors.blobs.blizzard.desc=이곳에는 눈보라가 몰아치고 있습니다.
actors.blobs.blizzard.name=눈보라
actors.blobs.confusiongas.desc=이곳에는 혼란 가스 구름이 소용돌이치고 있습니다.
actors.blobs.confusiongas.name=혼란 가스
actors.blobs.corrosivegas.desc=치명적인 부식성 가스 구름이 이곳을 휘감고 있습니다.
actors.blobs.corrosivegas.name=부식성 가스
actors.blobs.electricity.desc=이곳에서 전기장이 밝게 번쩍이고 있습니다.
actors.blobs.electricity.name=전기
actors.blobs.electricity.ondeath=당신은 너무 충격을 받아서 죽을 뻔했잖아요...
actors.blobs.electricity.rankings_desc=감전사
actors.blobs.fire.desc=이곳에 화재가 발생하여 맹렬하게 타오르고 있습니다.
actors.blobs.fire.name=불
actors.blobs.foliage.desc=지하 정원의 어둠을 뚫고 한 줄기 빛이 쏟아져 들어온다.
actors.blobs.foliage.name=잎
actors.blobs.freezing.desc=이곳 공기는 이상하리만큼 춥습니다.
actors.blobs.freezing.name=영하의 공기
actors.blobs.goowarn.desc=암흑 에너지 입자들이 이곳에 떼를 지어 몰려들고 있어요!
actors.blobs.goowarn.name=암흑 에너지
actors.blobs.inferno.desc=여기는 지금 불길이 맹렬하게 타오르고 있어요.
actors.blobs.inferno.name=지옥
actors.blobs.paralyticgas.desc=이곳에는 마비 가스 구름이 소용돌이치고 있습니다.
actors.blobs.paralyticgas.name=마비 가스
actors.blobs.regrowth.name=재생
actors.blobs.sacrificialfire.desc=이곳에는 제단이 있고 그 위에는 제물을 바치는 불이 타오르고 있습니다. 이곳에서 죽임을 당한 모든 생명체는 던전의 정령들에게 바쳐지는 제물로 소비될 것입니다. 충분한 제물이 바쳐지면 보상이 주어질지도 모릅니다.
actors.blobs.sacrificialfire.name=희생 제의 불
actors.blobs.sacrificialfire.reward=불꽃이 활활 타오르다가 사라지면서 그 자리에 보상이 남겨진다!
actors.blobs.sacrificialfire.unworthy=불은 당신의 제물을 태워버리지만, 제물 자체는 변하지 않습니다.
actors.blobs.sacrificialfire.worthy=불길이 당신의 제물을 태우며 더욱 거세집니다.
actors.blobs.smokescreen.desc=짙은 검은 연기가 이곳에서 소용돌이치고 있습니다.
actors.blobs.smokescreen.name=연막
actors.blobs.stenchgas.desc=이곳에는 지독한 악취가 휘몰아치고 있다.
actors.blobs.stenchgas.name=악취 가스
actors.blobs.stormcloud.desc=이곳에는 수증기 구름이 솟아오르고 있습니다.
actors.blobs.stormcloud.name=폭풍 구름
actors.blobs.toxicgas.desc=녹색을 띤 유독가스 구름이 이곳에서 소용돌이치고 있습니다.
actors.blobs.toxicgas.name=독가스
actors.blobs.toxicgas.ondeath=당신은 독가스 때문에 죽었습니다...
actors.blobs.toxicgas.rankings_desc=질식했다
actors.blobs.waterofawareness.desc=이 우물물에는 지식의 힘이 깃들어 있다. 이 우물물을 마시면 장착한 모든 아이템의 식별이 완료되고, 소지품에 있는 모든 아이템의 저주가 드러나며, 현재 층에 있는 모든 아이템의 위치가 표시된다.
actors.blobs.waterofawareness.name=의식의 물
actors.blobs.waterofawareness.procced=한 모금 마시는 순간, 지식이 머릿속으로 쏟아져 들어오는 것을 느낄 수 있습니다.
actors.blobs.waterofhealth.desc=이 우물물에서는 건강의 기운이 뿜어져 나옵니다. 이 우물물을 마시면 상처가 낫고, 허기가 가시며, 낡은 물건에 걸린 저주도 풀립니다.
actors.blobs.waterofhealth.name=건강에 좋은 물
actors.blobs.waterofhealth.procced=한 모금 마시는 순간, 상처가 완전히 아물어가는 것을 느낄 수 있습니다.
actors.blobs.web.desc=두꺼운 거미줄이 이곳 전체를 뒤덮고 있습니다. 무엇이든 거미줄에 닿거나 거미줄 사이로 던져지면 거미줄은 끊어지지만, 동시에 그 자리에 꼼짝없이 박히게 됩니다.
actors.blobs.web.name=거미줄
actors.buffs.adrenaline.desc=아드레날린은 물리적 힘을 급증시켜 공격 속도와 이동 속도를 모두 향상시킵니다. 아드레날린은 대상에게 2배의 이동 속도와 1.5배의 공격 속도를 부여합니다. 남은 턴: 0턴.
actors.buffs.adrenaline.name=아드레날린
actors.buffs.adrenalinesurge.desc=엄청난 힘이 솟구쳤지만, 아쉽게도 영구적이지는 않습니다.\n\n힘 증가: +%d.\n증가 효과가 약해질 때까지 남은 턴 수: %s.
actors.buffs.adrenalinesurge.name=힘 강화
actors.buffs.amok.desc=아목은 대상에게 극심한 분노와 혼란 상태를 일으킵니다. 생물이 아목 상태가 되면 아군이든 적군이든 상관없이 주변의 모든 것을 공격합니다. 남은 아목 턴 수: 0.
actors.buffs.amok.name=아목
actors.buffs.arcanearmor.desc=얇은 보호막이 당신을 감싸고 마법 공격으로 인한 피해를 일부 막아줍니다. 당신의 마법 방어력은 현재 0만큼 강화되었습니다. 마법 방어력이 약해지기까지 남은 턴 수: 1턴.
actors.buffs.arcanearmor.name=신비로운 갑옷
actors.buffs.artifactrecharge.desc=에너지가 당신의 몸을 타고 흐르며 장착한 유물의 충전 속도를 높이고 있습니다. 각 유물은 약간씩 다르게 영향을 받지만, 모두 평소보다 훨씬 빠르게 충전됩니다. 남은 턴: 0턴.
actors.buffs.artifactrecharge.name=아티팩트 재충전
actors.buffs.ascensionchallenge.almost=요그가 부적을 쥔 손아귀의 힘이 약해지는 것이 느껴집니다. 거의 다 왔어요!
actors.buffs.ascensionchallenge.beckon=부적이 멀리 떨어진 적들을 향해 손짓하기 시작한다.
actors.buffs.ascensionchallenge.break=잠시 숨을 고르며 상처가 아물기 시작하는 것을 느껴보세요!
actors.buffs.ascensionchallenge.damage=부적에서 어두운 기운이 뿜어져 나오기 시작한다. 부적이 불타오른다!
actors.buffs.ascensionchallenge.desc=요그-제와는 어떻게 된 일인지 부적을 통해 이 세계에 영향력을 행사하며 당신의 상승을 막으려 하고 있습니다! 요그의 힘은 던전을 훨씬 더 위험하게 만들고, 적의 수를 늘리고 더욱 강하게 만들고 있습니다! 이 힘은 제어하지 않으면 계속해서 커지지만, 요그의 힘으로 강화된 적을 물리치면 약화시킬 수 있습니다.
actors.buffs.ascensionchallenge.desc_beckon=현재 부적은 멀리 있는 적들에게 당신의 위치를 알리고 있습니다.
actors.buffs.ascensionchallenge.desc_clear=부적에서 뿜어져 나오는 어둠의 에너지는 현재로서는 최대한 약화되었습니다.
actors.buffs.ascensionchallenge.desc_damage=부적의 에너지가 너무 강해져서 당신에게 직접적인 해를 끼치고 있어요!
actors.buffs.ascensionchallenge.desc_haste=이 부적은 현재 멀리 있는 적의 속도를 높여주어, 그들이 당신에게 더 빨리 도달하게 합니다!
actors.buffs.ascensionchallenge.desc_slow=현재 부적은 당신의 속도를 늦추고 있으며, 속도 증가 효과를 무효화하고 있습니다!
actors.buffs.ascensionchallenge.haste=부적이 멀리 있는 적들을 재촉하기 시작한다!
actors.buffs.ascensionchallenge.name=부적의 저주
actors.buffs.ascensionchallenge.on_kill=어둠의 에너지가 당신을 집어삼키고 있습니다...
actors.buffs.ascensionchallenge.slow=그 부적은 마치 인벤토리에서 납덩이처럼 무겁게 느껴지기 시작합니다!
actors.buffs.ascensionchallenge.weaken=부적의 저주가 약간 약해지는 것을 느낄 수 있습니다.
actors.buffs.ascensionchallenge.weaken_info=더 많은 적을 물리칠수록 부적의 저주를 약화시킬 수 있습니다.
actors.buffs.ascensionchallenge.weaken_info_no_kills=적들을 물리치면 부적의 저주가 약해질 거예요!
actors.buffs.barkskin.desc=피부가 단단해져서 나무껍질처럼 거칠고 단단해졌습니다. 단단해진 피부는 방어력을 높여 물리 공격에 대한 방어력을 향상시켜 줍니다. 현재 방어력 증가량은 0입니다. 나무껍질 효과가 약해지기까지 남은 턴 수는 1턴입니다. 여러 곳에서 나무껍질 효과를 얻을 경우, 가장 강력한 효과만 적용됩니다.
actors.buffs.barkskin.name=나무껍질
actors.buffs.barrier.desc=모든 피해를 막아주는 견고한 보호막입니다. 보호막이 남아있는 동안 보호 대상은 대신 피해를 입습니다. 보호막은 시간이 지남에 따라 서서히 감소합니다. 남은 보호막: %d.
actors.buffs.barrier.name=장벽
actors.buffs.berserk.action_name=맹렬한
actors.buffs.berserk.angered=화난
actors.buffs.berserk.angered_desc=광전사의 부상 정도가 심할수록 공격력이 강해집니다. 광전사는 물리적 피해를 입을수록 분노가 쌓여 추가 피해를 입힙니다. 갑옷으로 막힌 피해도 분노 축적에 포함됩니다. 분노는 시간이 지남에 따라 감소합니다. 광전사의 체력이 낮을수록 분노가 더 오래 지속됩니다. 분노가 100에 도달하면 광폭화 상태가 되어 갑옷과 잃은 체력에 비례하는 보호막을 얻습니다. 광폭화 상태에서 그의 보호막은 시간이 지남에 따라 감소하며, 보호막이 완전히 사라지면 다시 분노를 쌓기 전에 휴식을 취해야 합니다. 현재 분노: +2%2%3%% 현재 방어력과 체력에서의 광폭화 보호막:
actors.buffs.berserk.berserk=광폭화
actors.buffs.berserk.berserk_desc=두려움과 불확실성은 사라지고 오직 분노만이 남습니다. 이 상태에서 광전사는 극도로 강력해지며, _+50%%의 피해를 입히고 추가 보호막을 얻지만_ 매 턴마다 보호막을 잃습니다._ 보호막이 0이 되면 광전사 상태가 종료됩니다._ 광전사 상태 후에는 다시 분노를 쌓기 전에 회복 시간이 필요합니다._ 남은 보호막: %d
actors.buffs.berserk.exhausted=탈진한
actors.buffs.berserk.no_seal=광폭화하려면 봉인이 깨진 조각이 필요합니다!
actors.buffs.berserk.rankings_desc=광폭화로 죽음
actors.buffs.berserk.recovering=회복 중
actors.buffs.berserk.recovering_desc=내면의 힘에는 한계가 있다. 광전사는 다시 분노를 사용하기 전에 휴식을 취해야 한다. 회복하는 동안 광전사는 피해를 입어도 분노를 축적하지 못한다.
actors.buffs.berserk.recovering_desc_levels=회복까지 남은 수치: _%.2f_
actors.buffs.berserk.recovering_desc_turns=복구까지 남은 턴 수: _%d_
actors.buffs.bleeding.desc=그 상처에서 걱정스러울 정도로 많은 피가 새어 나오고 있습니다. 출혈은 매 턴마다 피해를 입힙니다. 매 턴마다 피해량은 무작위로 감소하며, 결국 출혈이 멈춥니다. 현재 출혈 피해량:
actors.buffs.bleeding.heromsg=피가 나고 있잖아!
actors.buffs.bleeding.name=출혈
actors.buffs.bleeding.ondeath=당신은 과다출혈로 사망했습니다...
actors.buffs.bleeding.rankings_desc=과다출혈로 사망
actors.buffs.bless.desc=엄청난 집중력 폭발, 어떤 이들은 신의 계시를 받았다고 말합니다. 축복은 명중률과 회피율을 25만큼 증가시켜, 축복받은 자를 전투에서 훨씬 더 효과적으로 만듭니다. 남은 축복 턴: 1턴.
actors.buffs.bless.name=축복 받은
actors.buffs.blindness.desc=실명은 주변 세상을 짙은 안개로 뒤덮습니다. 실명 상태에서는 시야 범위가 한 칸으로 줄어들어 원거리 공격이 불가능해지고 멀리 있는 적을 놓치기 쉽습니다. 또한, 실명한 영웅은 두루마리나 책을 읽을 수 없습니다. 남은 실명 지속 시간: 0턴.
actors.buffs.blindness.heromsg=당신은 눈이 멀었군요!
actors.buffs.blindness.name=눈이 먼
actors.buffs.blobimmunity.desc=어떤 불가사의한 힘이 당신을 얇은 보호막으로 감싸고 있어 모든 유해한 공기 매개 효과를 차단하고 있습니다. 이 보호막이 지속되는 동안 당신은 모든 지역 효과에 면역입니다. 남은 면역 턴 수: 0.
actors.buffs.blobimmunity.name=정화 장벽
actors.buffs.burning.burnsup=%s가 불타버렸어요!
actors.buffs.burning.desc=불길에 휩싸이는 것보다 더 끔찍한 일은 거의 없습니다. 불은 물에 의해 꺼지거나 저절로 꺼질 때까지 매 턴 피해를 줍니다. 불은 물에 발을 담그거나 파괴 물약을 뿌리면 끌 수 있습니다. 또한, 불은 접촉하는 가연성 지형이나 물건에 불을 붙일 수 있습니다. 남은 연소 턴 수: 0.
actors.buffs.burning.heromsg=불이 붙었어요!
actors.buffs.burning.name=타고 있는
actors.buffs.burning.ondeath=당신은 불에 타 죽었어요...
actors.buffs.burning.rankings_desc=재로 변해버린
actors.buffs.championenemy$antimagic.desc=마법 방지 챔피언은 받는 피해가 50% 감소하고 마법 효과에 완전히 면역입니다.
actors.buffs.championenemy$antimagic.name=안티매직 챔피언
actors.buffs.championenemy$blazing.desc=불타는 챔피언은 근접 공격력이 25% 증가하고, 공격하는 적에게 불을 붙이며, 화염에 면역이고, 죽을 때 주변에 불을 퍼뜨립니다. 단, 물 위에는 불을 퍼뜨릴 수 없습니다.
actors.buffs.championenemy$blazing.name=불타는 챔피언
actors.buffs.championenemy$blessed.desc=축복받은 챔피언은 명중률과 회피율이 4배입니다.
actors.buffs.championenemy$blessed.name=축복받은 챔피언
actors.buffs.championenemy$giant.desc=거대 챔피언은 받는 피해가 80% 감소하고 공격 사거리가 1 증가하지만, 좁은 공간을 통과할 수는 없습니다.
actors.buffs.championenemy$giant.name=거대 챔피언
actors.buffs.championenemy$growing.desc=성장하는 챔피언은 명중률, 회피율, 물리 공격력에 꾸준히 증가하는 보너스를 얻고, 받는 피해 감소 효과를 받습니다. (현재 명중률/회피율/공격력 증가: \n\n, 현재 피해 감소: %1$d%%\n, 현재 피해 감소: %2$d%%)
actors.buffs.championenemy$growing.name=성장하는 챔피언
actors.buffs.championenemy$projecting.desc=투사 능력을 가진 챔피언은 근접 공격 피해량이 25% 증가하고 공격 사거리가 3 증가합니다.
actors.buffs.championenemy$projecting.name=챔피언을 예상하다
actors.buffs.championenemy.warn=당신은 섬뜩한 기운을 느낍니다.
actors.buffs.charm.cant_attack=당신은 그 적에게 매료되어 공격할 수 없습니다.
actors.buffs.charm.desc=매혹은 적들이 일시적으로 서로를 숭배하게 만드는 조종 마법입니다. 매혹에 걸린 캐릭터는 매혹된 적을 직접 공격할 수 없습니다. 하지만 다른 대상을 공격하는 것은 여전히 가능합니다. 고통의 충격은 매혹 지속 시간을 감소시킵니다. 남은 매혹 지속 시간: 0턴.
actors.buffs.charm.heromsg=당신은 정말 매력적이에요!
actors.buffs.charm.name=매혹된
actors.buffs.chill.desc=완전히 얼지는 않았지만 여전히 너무 춥습니다. \n\n냉각된 대상은 효과 지속 시간에 따라 모든 행동을 느리게 수행합니다. 최악의 경우, 이는 이동 속도 감소와 같습니다.\n\n냉각 효과 지속 시간: %1$s.\n속도 감소량: %2$s%%
actors.buffs.chill.freezes=%s가 멈췄습니다!
actors.buffs.chill.name=냉장 보관
actors.buffs.combo$combomove.clobber.desc=적을 2칸 뒤로 밀어내지만, 피해는 주지 않으며 함정에 빠뜨리지는 못합니다. 콤보를 1 증가시킵니다.
actors.buffs.combo$combomove.clobber.empower_desc=적을 3칸 뒤로 밀쳐내고, 현기증을 유발하며, 함정에 빠뜨릴 수도 있지만, 피해는 주지 않습니다. 콤보를 1 증가시킵니다.
actors.buffs.combo$combomove.clobber.name=소지품
actors.buffs.combo$combomove.crush.desc=주 대상에게 %d%% (콤보*25%%)의 피해를 주고, 7x7 범위 내 모든 적에게는 그 절반의 피해를 줍니다. 사용 시 콤보가 초기화됩니다.
actors.buffs.combo$combomove.crush.empower_desc=_%1$d 타일로 도약_하여 주 대상에게 %2$d%% (콤보*25%%)의 피해를 주고, 7x7 범위 내 모든 적에게 그 절반의 피해를 줍니다. 사용 시 콤보가 초기화됩니다.
actors.buffs.combo$combomove.crush.name=으깨다
actors.buffs.combo$combomove.fury.desc=콤보당 한 번씩 적을 공격하며, 공격할 때마다 60%의 피해를 입히고 마법 효과를 발동시킬 수 있습니다. 사용 시 콤보가 초기화됩니다.
actors.buffs.combo$combomove.fury.empower_desc=_%d 타일로 도약_하여 보유한 콤보 수만큼 적을 공격합니다. 공격할 때마다 60%%의 피해를 입히고 마법 부여 효과를 발동시킬 수 있습니다. 사용 시 콤보가 초기화됩니다.
actors.buffs.combo$combomove.fury.name=격노
actors.buffs.combo$combomove.parry.desc=활성화 시 1턴 이내에 들어오는 다음 공격을 막고 즉시 반격합니다. 막는 공격이 없으면 콤보가 초기화됩니다.
actors.buffs.combo$combomove.parry.empower_desc=활성화 시 1턴 동안 모든 공격을 막고 즉시 반격합니다. 막는 공격이 없으면 콤보가 초기화됩니다.
actors.buffs.combo$combomove.parry.name=패리
actors.buffs.combo$combomove.slam.desc=%d%% (콤보*20%%)만큼의 피해 방어력을 추가 피해로 입힙니다. 사용 시 콤보가 초기화됩니다.
actors.buffs.combo$combomove.slam.empower_desc=_%1$d 타일로 도약_하여 추가 피해로 자신의 피해 방어력의 %2$d%% (콤보*20%%)를 입힙니다. 사용 시 콤보가 초기화됩니다.
actors.buffs.combo$combomove.slam.name=쾅
actors.buffs.combo.action_name=콤보 공격
actors.buffs.combo.bad_target=공격 범위 내에 있는 적을 목표로 삼아야 합니다.
actors.buffs.combo.combo=%d 콤보 공격!
actors.buffs.combo.desc=검투사는 공격을 성공시킬 때마다 기세를 얻습니다. 공격할 때마다 콤보 카운터가 1씩 증가하지만, 공격 사이에 너무 오랜 시간이 지나면 콤보 카운터가 0으로 초기화됩니다. 검투사가 콤보를 유지하는 동안에는 봉인이 깨지면서 얻은 방어막이 사라지지 않습니다. 콤보를 쌓으면 절대 빗나가지 않는 특수 콤보 공격이 해금됩니다! 콤보 카운터가 2, 4, 6, 8, 10에 도달할 때마다 다른 공격이 해금됩니다. 일부 기술은 콤보를 초기화하지만, 어떤 기술은 그렇지 않습니다. 각 기술은 콤보 세션당 한 번만 사용할 수 있습니다. 현재 콤보: 0. 콤보 카운터. 콤보가 사라질 때까지 남은 턴 수: 1턴.
actors.buffs.combo.name=콤보
actors.buffs.combo.prompt=공격할 대상을 선택하세요.
actors.buffs.corrosion.desc=강력한 산이 살, 금속, 뼈를 놀라운 속도로 녹여버립니다. 부식 손상은 시간이 지남에 따라 계속 증가하며, 대상은 계속해서 녹아내립니다. 남은 부식 횟수: 0회. 현재 부식 손상: 1회.
actors.buffs.corrosion.heromsg=녹아내리고 있잖아!
actors.buffs.corrosion.name=부식
actors.buffs.corrosion.ondeath=당신은 녹아내립니다...
actors.buffs.corrosion.rankings_desc=용해됨
actors.buffs.corruption.desc=타락은 존재의 본질에 스며들어 본래의 본성을 왜곡시킵니다. 타락한 생명체는 아군을 공격하고 이전의 적을 무시합니다. 또한 타락은 치명적인 피해를 입히며, 대상을 서서히 죽음으로 몰아넣습니다. 타락은 영구적이며, 그 영향은 오직 죽음으로만 끝납니다.
actors.buffs.corruption.name=손상된
actors.buffs.cripple.desc=다리가 그렇게 구부러지도록 만들어진 건 아니라는 걸 확실히 알겠죠? 절름발이는 이동 속도를 절반으로 줄여 타일 하나를 이동하는 데 보통 한 턴이 아닌 두 턴이 걸리게 합니다. 절름발이 효과가 지속되는 남은 턴 수: 0턴.
actors.buffs.cripple.heromsg=당신은 불구입니다!
actors.buffs.cripple.name=불구
actors.buffs.daze.desc=귀울림과 시야 흐림으로 인해 전투가 어려워집니다. (\n\n) 현기증이 나는 동안 명중률과 회피율이 50% 감소하여 공격을 명중시키거나 피하는 것이 훨씬 어려워집니다. (\n\n) 현기증 지속 시간: 1턴.
actors.buffs.daze.heromsg=정신이 멍해지셨군요!
actors.buffs.daze.name=멍한
actors.buffs.degrade.desc=강력한 어둠의 마법이 당신의 장비에 적용된 강화 주문서의 효능을 약화시키고 있습니다! (\n\n) 약화된 장비는 실제 레벨보다 낮은 레벨로 취급됩니다. +3 이후의 모든 강화는 이전 강화보다 기하급수적으로 약해집니다. 아이템 설명은 약화된 성능을 반영하여 변경됩니다. (\n\n) 약화는 힘 요구치, 지팡이 사용 횟수, 투척 무기의 내구도 또는 유물에는 영향을 미치지 않습니다. (\n\n) 남은 약화 턴 수: (%s) 강화 주문서 또는 저주 해제 주문서를 사용하면 약화가 즉시 종료됩니다.
actors.buffs.degrade.heromsg=장비 성능이 저하된 것 같습니다!
actors.buffs.degrade.name=타락한
actors.buffs.doom.desc=우주가 당신을 죽이려는 것 같을 때 계속 나아가는 건 정말 힘든 일이죠. 파멸에 처한 캐릭터는 모든 공격으로부터 67%의 추가 피해를 받습니다. 파멸은 영구적이며, 그 효과는 죽음으로만 끝납니다.
actors.buffs.doom.name=운명이 정해진
actors.buffs.dread.desc=공포는 너무나 커서 목표물이 던전에서 완전히 도망치게 만들 정도입니다! 공포에 휩싸인 적은 빠른 속도로 도망치며, 시야에서 사라지면 던전에서 완전히 사라집니다. 이렇게 처치한 적은 경험치를 절반만 획득하고 아이템을 드롭하지 않습니다. 고통의 충격은 공포 지속 시간을 줄여줍니다. 남은 공포 지속 시간: 0턴.
actors.buffs.dread.name=공포
actors.buffs.drowsy.desc=마법의 힘으로 인해 깨어 있기가 어려워지며, 몇 턴 후 대상은 깊은 마법적 잠에 빠지게 됩니다. 영웅은 피해를 입거나 체력이 최대치일 때 졸음을 저항할 수 있습니다. 잠들기까지 남은 턴 수: 0턴.
actors.buffs.drowsy.name=나른한
actors.buffs.earthimbue.desc=당신은 대지의 힘으로 충만합니다! 모든 물리적 공격은 적 아래의 땅을 움직여 잠시 동안 적을 무력화시킵니다. 남은 대지의 힘 부여 횟수: %s.
actors.buffs.earthimbue.name=흙으로 가득 찬
actors.buffs.enhancedrings.desc=도적이 최근에 사용한 유물이 그의 반지를 강화하여 레벨을 +1만큼 올려줍니다. 남은 턴:
actors.buffs.enhancedrings.name=강화된 링
actors.buffs.fireimbue.desc=당신은 불의 힘을 부여받았습니다! 모든 물리 공격은 일정 확률로 적에게 불을 붙일 수 있습니다. 또한, 당신은 불의 효과에 완전히 면역입니다. 남은 불의 부여 턴 수: 0.
actors.buffs.fireimbue.name=불로 가득 찬
actors.buffs.foresight.desc=당신은 어떤 방식으로든 마음으로 주변 지형의 배치를 볼 수 있습니다. 예지력의 효과가 지속되는 동안 넓은 반경 내의 모든 타일이 당신에게 드러나며, 비밀 함정이나 문도 포함됩니다. 예지력 지속 시간: 0턴.
actors.buffs.foresight.name=선견
actors.buffs.frost.desc=완전히 얼어붙는 것과는 달리, 이보다 온화한 동결은 대상을 얼음으로 감싸는 것입니다. 동결은 마비와 유사하게 작용하여 대상이 아무런 행동을 할 수 없게 만듭니다. 마비와 달리, 대상이 피해를 입으면 얼음이 깨지면서 동결 효과가 즉시 해제됩니다. 남은 동결 턴 수: 0턴.
actors.buffs.frost.freezes=%s가 멈췄습니다!
actors.buffs.frost.name=언
actors.buffs.frostimbue.desc=당신은 얼음의 힘으로 무장했습니다! 모든 물리 공격은 적에게 지속적으로 냉기를 중첩시킵니다. 또한, 당신은 추위에 완전히 면역입니다. 남은 냉기 부여 턴 수: %s.
actors.buffs.frostimbue.name=서리가 내린
actors.buffs.fury.desc=당신이 화가 나면 적들은 당신을 좋아하지 않을 겁니다. 엄청난 분노가 당신 안에서 타오르며, 물리 공격으로 입히는 피해량이 50만큼 증가합니다. 이 분노는 당신의 체력이 50 미만으로 떨어지는 동안 지속됩니다.
actors.buffs.fury.heromsg=당신은 몹시 화가 납니다!
actors.buffs.fury.name=맹렬한
actors.buffs.gravitychaostracker.desc_duration=그 효과가 얼마나 지속될지는 확실하지 않지만, 영원히 지속될 수는 없을 것이다.
actors.buffs.gravitychaostracker.desc_intro=몇 턴마다 현재 던전 층에 있는 모든 캐릭터가 무작위 방향으로 날아갑니다.
actors.buffs.gravitychaostracker.desc_positive=하지만 당신과 당신의 동맹들은 면역력이 있는 것 같군요.
actors.buffs.gravitychaostracker.name=중력 혼돈
actors.buffs.greaterhaste.desc=놀라운 속도 증가로 인해 잠시 동안 모든 것이 멈춰 있는 듯한 느낌이 듭니다. \n\n가속 효과가 지속되는 동안 이동 동작은 전혀 시간이 걸리지 않지만, 다른 동작은 정상 속도로 수행됩니다. 이동 한 걸음마다 가속 효과 턴이 1회 소모됩니다. \n\n남은 가속 효과 턴: %d.
actors.buffs.greaterhaste.name=더 빠른 속도
actors.buffs.haste.desc=에너지가 근육을 통해 흐르면서 엄청난 속도로 달릴 수 있게 됩니다!\n\n가속 효과를 받는 동안에는 3배속으로 달리지만, 다른 모든 행동은 정상 속도로 수행합니다.\n\n남은 가속 턴 수: %s.
actors.buffs.haste.name=서두름
actors.buffs.healing.desc=마법의 치료제가 상처를 아물게 하고 살을 붙입니다.\n\n매 턴마다 체력이 꾸준히 회복되며, 회복 효과가 사라질 때까지 지속됩니다. 회복량은 시간이 지남에 따라 감소할 수 있습니다.\n\n다음 회복량: %d.\n\n남은 회복량: %d.
actors.buffs.healing.name=치유
actors.buffs.herodisguise.desc=환영 마법으로 당신의 외모가 바뀌었습니다! 효과는 순전히 외형적인 것이지만, 그럼에도 불구하고 매우 이상한 기분이 듭니다. 변장 유지 남은 턴 수:
actors.buffs.herodisguise.name=위장하다
actors.buffs.hex.desc=집중력을 약화시켜 대상을 약간 혼란스럽게 만드는 어둠의 마법입니다. 저주는 명중률과 회피율을 20만큼 감소시켜 대상의 전투 효율을 떨어뜨립니다. 남은 저주 턴 수: 1턴.
actors.buffs.hex.heromsg=당신은 저주에 걸렸어요!
actors.buffs.hex.name=저주받은
actors.buffs.holdfast.desc=전사는 현재 위치를 유지하며 방어력을 %1$d-%2$d만큼 증가시키고 일부 버프의 감소 속도를 %3$d%%만큼 늦춥니다. 이 효과는 전사가 이동하기 전까지 지속됩니다.
actors.buffs.holdfast.name=꽉 붙잡으세요
actors.buffs.hunger.cursedhorn=저주받은 뿔은 당신이 음식을 먹을 때 음식의 에너지를 일부 빼앗아 갑니다.
actors.buffs.hunger.desc=던전에서 시간을 보낼수록 허기가 서서히 증가하며, 결국 굶주림에 시달리게 됩니다. 굶주리면 체력이 회복되는 대신 서서히 감소합니다. 식량 배급은 중요합니다! 체력이 충분하다면 나중에 더 많은 음식을 얻을 수 있으므로 굶는 것도 나쁘지 않습니다. 효율적인 배급을 통해 음식을 훨씬 더 오래 사용할 수 있습니다!
actors.buffs.hunger.desc_intro_hungry=배가 고파서 음식을 먹고 싶은 느낌이 들지만, 아직은 그렇게 급한 건 아니에요.
actors.buffs.hunger.desc_intro_starving=너무 배고파서 고통스러울 정도야.
actors.buffs.hunger.hungry=배고픈
actors.buffs.hunger.ondeath=당신은 굶어 죽었어요...
actors.buffs.hunger.onhungry=당신은 배고프군요.
actors.buffs.hunger.onstarving=당신은 굶주리고 있어요!
actors.buffs.hunger.rankings_desc=굶어 죽음
actors.buffs.hunger.starving=굶주린
actors.buffs.invisibility.desc=당신은 주변 지형에 완전히 녹아들어 보이지 않게 됩니다. 투명 상태인 동안 적들은 당신을 공격하거나 추적할 수 없습니다. 물리 공격과 마법 효과(두루마리나 지팡이 등)는 투명 상태를 즉시 해제합니다. 남은 투명 상태 지속 시간: 0턴.
actors.buffs.invisibility.name=보이지 않는
actors.buffs.invulnerability.desc=이 캐릭터는 강력한 보호력을 지니고 있어 짧은 시간 동안 무적 상태가 됩니다!\n\n남은 턴: %s.
actors.buffs.invulnerability.name=무적의
actors.buffs.levitation.desc=마법의 힘으로 당신은 공중에 떠올라 무중력 상태를 느끼고 있습니다. 공중에 떠 있는 캐릭터는 소리 없이 움직이며 지면의 모든 효과를 무시합니다. 함정은 발동하지 않고, 물은 불을 끄지 않으며, 식물은 밟히지 않고, 뿌리는 피해가며, 구덩이는 피할 수 있습니다. 하지만 공중 부양이 끝나는 순간 이러한 모든 것들이 적용될 수 있으니 조심하세요! 남은 공중 부양 시간: 0턴.
actors.buffs.levitation.name=공중부양
actors.buffs.lifelink.desc=이 캐릭터의 생명력은 근처의 다른 캐릭터와 연결되어 있습니다. 받는 피해는 연결된 캐릭터와 공유됩니다. 이 캐릭터가 피해를 입을 때마다 피해의 절반은 생명력 연결 대상에게 대신 적용됩니다. 남은 생명력 연결 턴: 0턴.
actors.buffs.lifelink.name=생명 연결
actors.buffs.lifelink.ondeath=생명과 연관된 피해가 당신을 죽였습니다...
actors.buffs.light.desc=가장 어두운 던전에서도 곁에 있는 은은한 빛은 언제나 위안이 됩니다. 빛은 어둠을 몰아내고 주변 환경에 관계없이 적당한 거리를 볼 수 있도록 도와줍니다. 남은 조명 턴 수: 0회.
actors.buffs.light.name=조명
actors.buffs.lockedfloor.desc=현재 층이 잠겨 있어 나갈 수 없습니다! 층이 잠겨 있는 동안에는 허기가 발생하지 않으며 굶주림으로 인한 피해를 입지 않습니다. 또한, 해당 층의 보스를 처치하지 않으면 패시브 회복 효과가 중단됩니다. 층이 잠겨 있는 동안 축복받지 않은 앙크로 부활하면 잠금 상태가 초기화됩니다. 해당 층의 보스를 처치하면 잠금이 해제됩니다.
actors.buffs.lockedfloor.name=해당 층이 잠겨 있습니다
actors.buffs.lostinventory.desc=던전 어딘가에서 소지품이 사라졌습니다! 소지품을 되찾기 전까지는 대부분의 아이템을 줍거나 사용할 수 없습니다.
actors.buffs.lostinventory.name=분실된 재고
actors.buffs.magicalsight.desc=어떻게 된 일인지 당신은 눈이 아닌 마음으로 볼 수 있습니다.\n\n마법 시야가 활성화된 동안 반경 12타일 내의 모든 지형을 투시할 수 있습니다.\n\n마법 시야 남은 턴: %s.
actors.buffs.magicalsight.name=마법 같은 광경
actors.buffs.magicalsleep.desc=이 캐릭터는 자연적으로는 깨어나지 않는 깊은 마법적 잠에 빠졌습니다. 마법적 잠은 일반 수면과 유사하지만, 피해를 입어야만 깨어납니다. 영웅과 아군에게 마법적 잠은 회복 효과를 제공하여 휴식하는 동안 빠르게 체력을 회복할 수 있게 해줍니다.
actors.buffs.magicalsleep.fallasleep=당신은 깊고 마법 같은 잠에 빠져듭니다.
actors.buffs.magicalsleep.name=마법 같은 잠
actors.buffs.magicalsleep.toohealthy=당신은 너무 건강해서 잠을 자고 싶은 충동을 억누를 수 있습니다.
actors.buffs.magicalsleep.wakeup=상쾌하고 건강한 기분으로 잠에서 깨어납니다.
actors.buffs.magicimmune.desc=모든 마법 효과가 당신에게서 사라졌습니다. 당신은 이제 마법에 완전히 면역입니다. 마법 면역 상태에서는 저주, 마법 부여, 지팡이, 두루마리, 반지, 유물 등 모든 해로운 마법 효과와 유익한 마법 효과가 당신에게 적용되지 않습니다. 영웅 갑옷의 능력은 이 효과와 관계없이 충분히 강력합니다. 남은 마법 면역 턴 수: 0턴.
actors.buffs.magicimmune.name=마법에 면역
actors.buffs.mindvision.desc=어떻게 된 일인지 당신은 정신력으로 이 층의 모든 생명체를 볼 수 있습니다. 이상한 느낌이네요. 정신력으로 생명체를 보는 것은 많은 마법 효과의 목적상 그 생명체가 실제로 보이거나 근처에 있는 것으로 간주됩니다. 정신력 사용 가능 횟수: 0회.
actors.buffs.mindvision.name=마음의 비전
actors.buffs.momentum.action_name=프리런
actors.buffs.momentum.momentum=모멘텀 구축
actors.buffs.momentum.momentum_desc=프리러너는 움직이면서 추진력을 축적하며, 이 추진력을 사용하여 프리러닝을 시작할 수 있습니다. 추진력 1회 충전 시 2턴의 프리러닝이 가능하며, 최대 10회까지 축적할 수 있습니다. 프리러너가 멈추면 추진력은 빠르게 사라집니다. 현재 추진력 충전량: 0회.
actors.buffs.momentum.resting=회복 중
actors.buffs.momentum.resting_desc=프리러너는 움직이면서 추진력을 얻고, 이 추진력을 이용해 프리러닝을 시작할 수 있습니다. 프리러너는 다시 추진력을 얻기 전에 체력을 회복할 시간이 필요합니다. 남은 턴: 0턴.
actors.buffs.momentum.running=프리러닝
actors.buffs.momentum.running_desc=프리러너는 이동하면서 추진력을 얻고, 이 추진력을 이용해 프리러닝을 시작할 수 있습니다. 프리러닝 중에는 이동 속도가 두 배가 되며, 레벨에 따라 추가 회피율을 얻습니다. 남은 턴: 0턴.
actors.buffs.monkenergy$monkability$dash.desc=최대 4칸까지 순간 이동. 이 능력은 위험 요소를 넘어갈 수 있지만, 적이나 단단한 지형을 통과할 수는 없습니다.
actors.buffs.monkenergy$monkability$dash.empower_desc=최대 8칸까지 순간 이동. 이 능력은 위험 요소를 넘어갈 수 있지만, 적이나 단단한 지형을 통과할 수는 없습니다.
actors.buffs.monkenergy$monkability$dash.name=대시
actors.buffs.monkenergy$monkability$dash.prompt=위치를 선택하세요
actors.buffs.monkenergy$monkability$dragonkick.desc=%1$d-%2$d의 피해를 입히고 방어력을 무시하는 파괴적인 발차기입니다. 발차기는 대상을 멀리 날려버리고 이동한 칸 수만큼 마비시킵니다.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=_%1$d-%2$d_의 피해를 입히고 방어력을 무시하는 파괴적인 발차기입니다. 이 발차기는 _인접한 모든 대상_을 날려버리고 이동한 칸 수만큼 마비시킵니다.
actors.buffs.monkenergy$monkability$dragonkick.name=드래곤킥
actors.buffs.monkenergy$monkability$flurry.desc=%1$d-%2$d의 피해를 입히고 방어력을 무시하는 두 번의 즉시 공격입니다. 이 능력은 반복해서 사용할 수 없습니다.
actors.buffs.monkenergy$monkability$flurry.empower_desc=%1$d-%2$d의 피해를 주는 두 번의 즉시 공격으로, 방어력을 무시하고 무기의 마법 부여 효과를 사용합니다. 이 능력은 반복해서 사용할 수 없습니다.
actors.buffs.monkenergy$monkability$flurry.name=연이은 타격
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=승려는 주변 상황에 집중하며 자신에게 가해질 다음 공격을 예측합니다. 이렇게 집중하고 있는 동안에는 다가오는 공격을 반드시 막아낼 수 있습니다.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=집중된
actors.buffs.monkenergy$monkability$focus.desc=승려는 정신을 집중하며 다음 공격을 막아냅니다.
actors.buffs.monkenergy$monkability$focus.empower_desc=승려는 순식간에 집중력을 되찾아 다음 공격을 막아냈다.
actors.buffs.monkenergy$monkability$focus.name=집중하다
actors.buffs.monkenergy$monkability$meditate.desc=수도승은 5턴 동안 몸에 에너지를 집중합니다. 이를 통해 대부분의 부정적인 효과가 제거되고, 지팡이와 유물을 8턴 동안 재충전할 수 있습니다.
actors.buffs.monkenergy$monkability$meditate.empower_desc=수도승은 5턴 동안 몸에 에너지를 집중합니다. 이를 통해 대부분의 부정적인 효과가 제거되고, 지팡이와 유물 재충전 시간이 8턴 동안 주어집니다. 또한 명상 중에는 피해 저항력이 80% 증가하고, 잃은 HP의 20%만큼 천천히 회복합니다.
actors.buffs.monkenergy$monkability$meditate.name=꾀하다
actors.buffs.monkenergy.action=승려 능력
actors.buffs.monkenergy.desc=수도사는 적을 물리칠 때마다 다양한 능력에 사용할 수 있는 에너지를 얻습니다. 대부분의 적은 처치 시 1의 에너지를 제공하며, 수도사는 시간이 지나도 에너지를 잃지 않습니다. (현재 에너지: %1$d/%2$d)
actors.buffs.monkenergy.desc_cooldown=수도사는 최근에 능력을 사용했으므로 다음 능력을 사용하기 전에 기다려야 합니다.\n\n현재 재사용 대기시간: %d턴.
actors.buffs.monkenergy.name=에너지
actors.buffs.ooze.desc=이 끈적끈적한 산은 살에 달라붙어 천천히 녹여버립니다. \n\n삼출액은 시간이 지남에 따라 지속적인 손상을 일으키지만, 물로 즉시 씻어낼 수 있습니다. \n\n남은 삼출액의 양: %s.
actors.buffs.ooze.heromsg=부식성 진물이 살을 파먹습니다. 깨끗이 씻어내세요!
actors.buffs.ooze.name=부식성 점액
actors.buffs.ooze.ondeath=당신은 녹아내립니다...
actors.buffs.ooze.rankings_desc=용해됨
actors.buffs.paralysis.desc=때로는 아무것도 하지 않는 것이 최악의 선택일 수 있습니다. 마비는 모든 행동을 완전히 멈추게 하여 효과가 사라질 때까지 기다리게 합니다. 피해를 입으면 고통으로 인해 마비에 저항할 수 있으며, 마비 효과에서 벗어날 수 있습니다. 남은 마비 지속 시간: 0턴.
actors.buffs.paralysis.heromsg=당신은 마비됐습니다!
actors.buffs.paralysis.name=마비된
actors.buffs.paralysis.out=저항성 마비
actors.buffs.physicalempower.desc=당신의 공격력이 강화되어 물리 공격으로 적을 공격할 때 더 많은 피해를 줄 수 있습니다.\n\n 추가 피해: %1$d.\n 남은 타격 횟수: %2$d.
actors.buffs.physicalempower.name=신체적으로 힘을 얻은
actors.buffs.pincushion.desc=이 캐릭터에게 사용한 투척 무기는 현재 캐릭터에 붙어 있으며, 캐릭터를 쓰러뜨리면 바닥에 떨어집니다.\n\n다음 아이템이 현재 부착되어 있습니다.
actors.buffs.pincushion.name=바늘꽂이
actors.buffs.poison.desc=독은 몸속으로 퍼져나가 서서히 내부 기능을 손상시킵니다. 독은 만료까지 남은 시간에 비례하여 매 턴마다 피해를 입힙니다. 남은 독의 턴 수: 0.
actors.buffs.poison.heromsg=당신은 독에 중독됐습니다!
actors.buffs.poison.name=독살된
actors.buffs.poison.ondeath=당신은 독살당했습니다...
actors.buffs.poison.rankings_desc=독에 중독되어 사망
actors.buffs.preparation.action_name=준비된 파업
actors.buffs.preparation.assassinated=암살당하다
actors.buffs.preparation.desc=암살자는 그림자 속에서 공격할 순간을 기다리며 인내심을 갖고 있다.
actors.buffs.preparation.desc_blink=그는 적을 공격하기 전에 순간이동으로 적 쪽으로 이동할 수 있으며, 최대 사거리는 _%d_입니다.
actors.buffs.preparation.desc_dmg=그의 다음 공격은 _%1$d%%의 추가 피해를 입히고, 체력이 _%2$d%% 이하인 일반 적이나 체력이 _%3$d%% 이하인 보스를 처형합니다.
actors.buffs.preparation.desc_dmg_likely=공격으로 더 큰 피해를 입힐 가능성도 높아집니다.
actors.buffs.preparation.desc_invis_next=더 강력한 공격을 위한 턴: _%d._
actors.buffs.preparation.desc_invis_time=투명 상태로 보낸 턴 수: _%d._
actors.buffs.preparation.name=준비
actors.buffs.preparation.no_target=그곳에는 공격할 대상이 없다.
actors.buffs.preparation.out_of_reach=그 목표는 달성 불가능합니다.
actors.buffs.preparation.prompt=공격할 대상을 선택하세요!\n최대 순간 이동 거리: %d
actors.buffs.prismaticguard.desc=당신은 현재 비활성화된 프리즘 이미지의 보호를 받고 있습니다. 적이 나타나면 프리즘 이미지가 즉시 작동하여 당신을 보호할 것입니다! 비활성화된 동안 프리즘 이미지는 입은 피해를 꾸준히 회복합니다. 현재 HP: %d/%d.
actors.buffs.prismaticguard.desc_many=이 프리즘 이미지는 다수의 힘의 효과를 받고 있습니다. 남은 턴 수: %d.
actors.buffs.prismaticguard.name=프리즈매틱 가드
actors.buffs.recharging.desc=에너지가 당신의 몸을 타고 흐르며 지팡이와 막대기의 충전 속도를 향상시키고 있습니다. 이 버프는 매 턴마다 일반 재충전에 더해 현재 충전량을 1/4씩 증가시킵니다. 남은 재충전 턴 수: 0턴.
actors.buffs.recharging.name=충전재
actors.buffs.revealedarea.desc=던전의 일부 지역이 영웅에게 일시적으로 공개되었습니다. 영웅은 어디에 있든 해당 지역을 볼 수 있습니다. 남은 턴: \n\n 남은 턴: %s.
actors.buffs.revealedarea.name=드러난 영역
actors.buffs.revealedchar.desc=이 캐릭터는 주인공에게 공개됩니다. 이 캐릭터는 어디에 있든 항상 보입니다. \n\n남은 턴: %s.
actors.buffs.revealedchar.name=노출된
actors.buffs.roots.desc=뿌리(마법 또는 자연)는 발을 붙잡아 땅에 고정시킵니다. 뿌리는 대상을 제자리에 묶어 이동 및 대부분의 이동 능력을 불가능하게 만듭니다. 순간 이동 효과를 포함한 다른 행동은 영향을 받지 않습니다. 남은 뿌리 유지 턴: 0턴.
actors.buffs.roots.heromsg=움직일 수 없어!
actors.buffs.roots.name=뿌리내린
actors.buffs.scrollempower.desc=마법사가 최근 읽은 두루마리의 에너지가 그의 지팡이를 강화하고 있습니다! 레벨 상승: +\n\n.\n남은 마법 횟수: %2$d.
actors.buffs.scrollempower.name=스크롤 권한 부여
actors.buffs.shadows.desc=당신은 주변 그림자에 녹아들어 투명해지고 신진대사가 느려집니다. 투명해진 동안 적들은 당신을 공격하거나 추적할 수 없습니다. 대부분의 물리 공격과 마법 효과(두루마리나 지팡이 등)는 투명화를 즉시 해제합니다. 또한, 그림자에 숨어 있는 동안 허기가 느려집니다. 그림자에서 나오거나 적과 접촉할 때까지 그림자에 숨어 있는 상태가 유지됩니다.
actors.buffs.shadows.name=그림자 융합
actors.buffs.slow.desc=느려짐 마법은 대상의 시간 흐름에 영향을 미쳐 모든 것이 초고속으로 움직이게 합니다. 느려진 캐릭터는 모든 행동을 평소보다 두 배 빠른 속도로 수행합니다. 느려짐 효과가 지속되는 턴이 남았습니다.
actors.buffs.slow.name=느려진
actors.buffs.snipersmark.action_name_snapshot=스냅 사진
actors.buffs.snipersmark.action_name_sniper=저격수 사격
actors.buffs.snipersmark.action_name_volley=발리
actors.buffs.snipersmark.desc=스나이퍼는 가장 최근에 공격한 목표물을 조준하고 있습니다. 그녀는 활을 이용해 특수 공격을 할 수 있는데, 이 공격은 활의 강화 상태에 따라 달라집니다. 강화되지 않은 활은 _스냅샷_을 발사합니다. 이 공격은 피해량은 적지만 발사 시간이 없습니다. 속도 강화 활은 _일제 사격_을 발사합니다. 각 화살은 피해량은 적지만 마법 부여 효과를 발동할 수 있습니다. 이 일제 사격은 1턴이 소요됩니다. 피해량 강화 활은 _스나이퍼 샷_을 발사합니다. 이 공격은 명중률이 100%이며, 목표물과의 거리에 따라 추가 피해를 줍니다. 발사 시간은 2턴입니다. 남은 턴: 0턴.
actors.buffs.snipersmark.name=저격수의 표식
actors.buffs.soulmark.desc=흑마법사는 이 생명체의 영혼에 접근하여 물리적 피해를 입을 때마다 치유할 수 있게 되었습니다. \n\n남은 영혼 표식 턴: %s.
actors.buffs.soulmark.name=영혼에 표시가 되어 있습니다.
actors.buffs.stamina.desc=당신은 무한한 체력을 가지고 있어 더욱 빠르게 움직일 수 있습니다! 체력 증가 효과를 받는 동안에는 +50의 속도로 달릴 수 있지만, 다른 모든 행동은 정상 속도로 수행합니다. 남은 체력 턴 수: 1턴.
actors.buffs.stamina.name=내구력
actors.buffs.terror.desc=공포는 대상을 통제할 수 없는 공황 상태에 빠뜨리는 교묘한 마법입니다. 공포에 질린 캐릭터는 상대방으로부터 도망치려 애쓰며, 가능한 한 많은 문과 벽으로 둘 사이를 가로막으려 합니다. 하지만 고통의 충격은 공포 지속 시간을 줄여줍니다. 남은 공포 턴 수: 0턴.
actors.buffs.terror.name=겁에 질렸다
actors.buffs.toxicimbue.desc=당신은 독성 에너지로 가득 차 있습니다! 움직일 때마다 독가스가 끊임없이 뿜어져 나와 적에게 피해를 줍니다. 이 효과가 지속되는 동안, 그리고 효과가 끝난 후 몇 턴 동안 당신은 독가스와 독에 면역입니다. 남은 독성 부여 턴 수: 0턴.
actors.buffs.toxicimbue.name=독성이 스며든
actors.buffs.vertigo.desc=세상이 빙빙 도는 것처럼 느껴질 때 똑바로 걷는 것은 어려울 수 있습니다. 현기증이 있는 동안 캐릭터는 움직이려고 하면 의도했던 방향이 아닌 무작위 방향으로 움직입니다. 남은 현기증 지속 시간: 0회.
actors.buffs.vertigo.name=선회
actors.buffs.vulnerable.desc=취약성 마법은 갑옷으로 감소된 피해량 이후 캐릭터가 받는 모든 물리 피해를 33%%만큼 증가시킵니다. 남은 취약성 턴 수: %s.
actors.buffs.vulnerable.heromsg=몸이 약해진 느낌이 드네요!
actors.buffs.vulnerable.name=취약한
actors.buffs.wandempower.desc=당신의 공격용 지팡이가 강화되어 몇 번의 공격 동안 공격력이 증가했습니다.\n\n 추가 피해: %1$d.\n 남은 공격 횟수: %2$d.
actors.buffs.wandempower.name=지팡이의 힘
actors.buffs.weakness.desc=모든 것이 갑자기 훨씬 더 무겁게 느껴집니다. 마법 약화는 캐릭터의 물리적 힘을 감소시켜 33만큼의 피해를 입힙니다. 남은 약화 턴: 1턴.
actors.buffs.weakness.heromsg=기력이 쇠약해진 느낌이 드시죠!
actors.buffs.weakness.name=약화된
actors.buffs.wellfed.desc=아주 만족스럽고 배가 부른 느낌입니다. 배가 부르면 허기가 더 이상 늘어나지 않고 시간이 지남에 따라 체력이 추가로 회복됩니다. 남은 턴: 0.
actors.buffs.wellfed.name=잘 먹었어요
actors.char.def_verb=피했다
actors.char.def_verb_blocked=막힌
actors.char.defeat=당신은 %s를 물리쳤습니다.
actors.char.immune=면역성 있는
actors.char.invulnerable=무적의
actors.char.kill=%s가 널 죽였어...
actors.hero.abilities.armorability.cost=청구 비용: _%d_
actors.hero.abilities.armorability.no_target=거기엔 공격할 대상이 아무것도 없어!
actors.hero.abilities.armorability.prompt=목표로 삼을 위치를 선택하세요
actors.hero.abilities.armorability.self_target=스스로를 표적으로 삼을 수는 없어요!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=성직자의 몸에서 찬란한 에너지가 뿜어져 나옵니다. 이 형태로 변신하면 성직자는 (몸에서 뿜어져 나오는 신성한 에너지 덕분에) 공격 사거리가 2 증가하고, 신성한 책을 사용할 때마다 보호막이 10 증가합니다. 또한 승천 형태의 특성을 통해 해금되는 주문들을 시전할 수 있습니다. 승천 형태와 그 주문으로 부여되는 보호막은 일반적인 방법으로는 감소하지 않지만, 승천 형태가 끝나면 즉시 사라집니다. 현재 보호막: 0. 남은 턴: 1.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=승천한 형태
actors.hero.abilities.cleric.ascendedform.desc=성직자는 자신에게서 신성한 에너지를 발산하여 10턴 동안 빛나는 형태로 변신합니다. 이 형태일 때 성직자는 새로운 주문을 시전할 수 있고, 공격 사거리가 2 증가하며, 보호막이 30이 됩니다. 또한 추가로 시전하는 모든 주문은 사용한 성서 충전량당 10의 보호막을 부여합니다. 승천 형태와 주문으로 얻는 보호막은 일반적인 방법으로는 감소하지 않지만, 승천 형태가 끝나면 즉시 사라집니다. 이 능력을 다시 사용하면 승천 형태의 지속 시간을 갱신할 수 있습니다.
actors.hero.abilities.cleric.ascendedform.name=승천한 형태
actors.hero.abilities.cleric.ascendedform.short_desc=성직자는 _승천 형태_를 취하여 새로운 주문, 공격 범위 및 보호막을 얻습니다.
actors.hero.abilities.cleric.powerofmany$lightally.desc=성직자의 모험 동료 중 한 명을 본뜬, 단단한 빛으로 만들어진 복제본입니다. 다른 영웅의 모습을 하고 있지만, 그 영웅의 고유 능력은 없습니다. 이 동료는 '다수의 힘' 갑옷 능력을 재사용하면 추가 비용 없이 조종할 수 있습니다.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=아군이 공격하러 이동합니다!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=아군이 그 위치로 이동합니다.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=당신의 동료가 당신을 따라오려고 움직입니다.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=이 캐릭터는 특정 영웅 갑옷 능력을 통해 찾을 수 있습니다.
actors.hero.abilities.cleric.powerofmany$lightally.name=빛의 동맹
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=이 아군은 다수의 힘으로 강화되어 공격력이 +25%% 증가하고 받는 피해가 -25%% 감소합니다. 또한 성직자와 시야 범위를 공유하며 다수의 힘 주문의 효과를 받을 수 있습니다. 다수의 힘은 프리즘 이미지와 같은 아군이 숨어도 유지되지만 지속 시간은 계속 감소합니다. 남은 턴: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=다수의 힘
actors.hero.abilities.cleric.powerofmany.ally_exists=당신에게는 이미 든든한 아군이 있습니다.
actors.hero.abilities.cleric.powerofmany.desc=성직자는 '다수의 힘'을 사용하여 기존 아군을 강화하거나 100턴 동안 강화된 새로운 아군을 생성합니다. 빈 공간을 대상으로 지정하면 새로운 아군이 생성됩니다. '다수의 힘'으로 강화된 모든 아군은 공격력이 25% 증가하고 받는 피해가 25% 감소하며, 성직자와 시야를 공유합니다. 또한, 이 능력을 사용할 때 25의 보호막을 얻습니다. 성직자는 강화된 아군과 함께만 시전할 수 있는 세 가지 새로운 주문을 얻습니다. 이 주문 중 하나가 활성화된 동안에는 '다수의 힘' 효과가 종료되지 않습니다.
actors.hero.abilities.cleric.powerofmany.name=다수의 힘
actors.hero.abilities.cleric.powerofmany.no_vision=보이지 않는 위치를 목표로 삼을 수는 없습니다.
actors.hero.abilities.cleric.powerofmany.only_allies=당신은 오직 동맹에게만 힘을 실어줄 수 있습니다.
actors.hero.abilities.cleric.powerofmany.prompt_ally=당신의 빛의 동맹을 향해 나아가세요
actors.hero.abilities.cleric.powerofmany.prompt_default=동맹 또는 위치를 선택하세요
actors.hero.abilities.cleric.powerofmany.short_desc=성직자는 '다수의 힘'을 활용하여 기존 아군을 강화하거나 새로운 아군을 만들어냅니다.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=본문 양식에 할당
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=마인드폼에 할당
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=영혼 형태에 할당
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=트리니티에 부여할 효과를 선택하세요. 확인 전에 추가 정보가 표시됩니다.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_본체 형태: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_마음의 형태: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=영혼 형태: %s.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=사용할 트리니티 형태를 선택하세요. 서로 다른 형태의 효과는 동시에 활성화될 수 있습니다.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=트리니티는 _%2$s 충전량_을 소모하여 이 유물의 원격 연금술 효과를 적용합니다.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=트리니티는 이 유물의 지속적 체력 회복 효과를 _+%1$d_만큼 20턴 동안 적용하며, _%2$s 충전량을 소모합니다._
actors.hero.abilities.cleric.trinity.cost=이 능력의 충전 비용은 다양하지만, 대부분 _%d_입니다.
actors.hero.abilities.cleric.trinity.desc=성직자는 세 가지 새로운 주문을 사용하여 다양한 아이템 효과에 적용할 수 있는 삼위일체 방어구 능력을 얻습니다. 각 주문은 성직자가 이번 플레이에서 발견한 다양한 종류의 장비 효과를 모방하는 데 중점을 둡니다. 육체 형태(무기와 갑옷), 정신 형태(지팡이와 투척 무기), 영혼 형태(반지와 유물)가 그것입니다. 각 삼위일체 형태에는 한 번에 하나의 효과만 부여할 수 있으며, 성직자는 삼위일체를 사용할 때 어떤 효과를 활성화할지 선택합니다. 삼위일체는 이미 장착한 아이템의 효과를 중복해서 적용하지 않습니다.
actors.hero.abilities.cleric.trinity.driedrose_use=트리니티는 이 유물의 효과를 사용하여 _%2$s_ 충전량을 소모하여 _+%1$d_ 유령의 HP를 가진 타락한 아군 망령을 소환합니다.
actors.hero.abilities.cleric.trinity.ench_glyph_use=트리니티는 _%2$s 충전량을 소모하여_%1$d 턴 동안_ 이 효과를 적용합니다.
actors.hero.abilities.cleric.trinity.etherealchains_use=트리니티는 이 아티팩트의 연쇄 시전 효과를 _+%1$d_만큼의 사거리로 적용하며, _%2$s의 충전량을 소모합니다.
actors.hero.abilities.cleric.trinity.hornofplenty_use=트리니티는 _%2$s 충전량_을 소모하여 이 유물의 간식 효과를 적용합니다.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=트리니티는 _+%1$d_의 속도로 이 유물의 적의 자원을 빼앗는 효과를 _%2$s 충전량_을 소모하여 적용합니다.
actors.hero.abilities.cleric.trinity.name=삼위 일체
actors.hero.abilities.cleric.trinity.no_duplicate=트리니티는 이미 장착한 효과를 중복해서 사용할 수 없습니다!
actors.hero.abilities.cleric.trinity.no_imbue=트리니티는 현재 어떤 형태에도 효과가 설정되어 있지 않으니, 주문 중 하나를 사용하세요!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=트리니티는 _%2$s 충전량_을 소모하여 _%1$d 턴_ 동안 이 _강력한_ 효과를 적용합니다.
actors.hero.abilities.cleric.trinity.ring_use=트리니티는 _%2$s 충전량을 소모하여_ 20턴 동안 이 반지의 효과를 _+%1$d_로 적용합니다.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=트리니티는 _%2$s 충전량_을 소모하여 무작위로 유해한 씨앗을 사용하여 이 유물의 근본 효과를 적용합니다.
actors.hero.abilities.cleric.trinity.short_desc=성직자는 자신이 본 장비를 모방한 세 가지 능력을 얻게 되는데, 이 능력들은 새로운 주문을 사용하여 부여할 수 있습니다.
actors.hero.abilities.cleric.trinity.skeletonkey_use=트리니티는 _%2$s 충전량_을 소모하여 이 아티팩트의 삽입 효과를 적용합니다.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=트리니티는 _+%1$d_의 확률로, _%2$s 충전량_을 소모하여 이 유물의 투시 효과를 적용합니다.
actors.hero.abilities.cleric.trinity.thrown_use=트리니티는 _%2$s 충전량을 소모하여 _+%1$d_에게 이 무기를 던집니다.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=트리니티는 이 유물의 시간 정지 효과를 _%1$d_ 턴 동안 적용하며, _%2$s 충전량을 소모합니다.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=트리니티는 이 유물의 무작위 스크롤 효과를 적용하여 _%1$d/10_ 확률로 추가 비용 없이 _%2$s 충전량_을 소모하여 희귀 버전을 제공합니다.
actors.hero.abilities.cleric.trinity.wand_multi_use=트리니티는 _%2$s_ 충전량을 소모하여 이 _다중 충전_ 지팡이를 _+%1$d_의 에너지로 충전할 것입니다.
actors.hero.abilities.cleric.trinity.wand_use=트리니티는 _%2$s의 충전량을 소모하여 _+%1$d_의 속도로 이 지팡이를 공격할 것입니다.
actors.hero.abilities.duelist.challenge$duelparticipant.desc=이 캐릭터는 결투에 참여하고 있습니다. 본인과 동료 또는 하수인은 다른 캐릭터가 정지된 동안 정상적으로 행동할 수 있습니다. 결투는 정해진 시간 동안 지속되며, 한 참가자가 사망하거나 참가자들이 서로 5칸 이상 멀어질 때까지 계속됩니다. 남은 턴: 0.
actors.hero.abilities.duelist.challenge$duelparticipant.name=결투 참가자
actors.hero.abilities.duelist.challenge.ally_target=적에게만 도전할 수 있습니다.
actors.hero.abilities.duelist.challenge.already_dueling=한 번에 하나의 결투에만 참여할 수 있습니다.
actors.hero.abilities.duelist.challenge.desc=결투사는 근처의 적에게 결투를 신청합니다. 결투사는 해당 적과 싸우게 되며, 주변의 모든 적은 일시적으로 얼어붙습니다. (\n\n) 대상은 결투사로부터 5칸 이내에 있어야 합니다. 결투는 10턴이 지나거나, 적이 죽거나, 결투사가 적으로부터 5칸 이상 멀어질 때까지 지속됩니다. (\n\n) 얼어붙은 적은 무적 상태가 됩니다. 결투사의 아군은 이 능력에 의해 얼어붙지 않지만, 보스를 대상으로 할 경우 보스의 하수인도 얼어붙지 않습니다.
actors.hero.abilities.duelist.challenge.distant_target=저 적은 너무 멀리 있어서 도전할 수 없다.
actors.hero.abilities.duelist.challenge.name=도전
actors.hero.abilities.duelist.challenge.prompt=도전할 적을 선택하세요
actors.hero.abilities.duelist.challenge.short_desc=결투사는 근처의 적에게 결투를 신청하여 다른 모든 적을 일시적으로 얼립니다.
actors.hero.abilities.duelist.challenge.unreachable_target=당신은 목표를 달성할 수 있어야 합니다.
actors.hero.abilities.duelist.elementalstrike.desc=결투사는 적이나 특정 위치를 공격하여 일반 공격을 가합니다. 이 공격은 반드시 명중하며, 최대 4칸 범위(65도 원뿔형)에 마법 효과를 확산시킵니다. 이 마법 효과는 결투사의 주 무기에 부여된 마법에 따라 달라집니다.
actors.hero.abilities.duelist.elementalstrike.generic_desc=마법 부여가 없는 일반 공격은 작은 마법 폭발을 일으켜 범위 내 모든 적에게 6~12의 피해를 줍니다.
actors.hero.abilities.duelist.elementalstrike.name=원소 공격
actors.hero.abilities.duelist.elementalstrike.short_desc=결투사는 무기 마법 부여에 따라 원뿔형 범위에 효과를 퍼뜨리는 _원소 공격_을 시전합니다.
actors.hero.abilities.duelist.feint.bad_location=그곳으로 이사할 수 없습니다.
actors.hero.abilities.duelist.feint.desc=결투사는 인접한 타일로 돌진하면서 공격하는 척하며, 순간적으로 자신의 잔상을 남깁니다. 결투사를 공격하던 적들은 대신 그녀의 잔상을 공격하게 됩니다. 잔상을 공격하는 적들은 혼란에 빠져 다음 행동을 할 수 없게 되며, 기습 공격에 취약해집니다.
actors.hero.abilities.duelist.feint.name=가장
actors.hero.abilities.duelist.feint.prompt=달려갈 위치를 선택하세요
actors.hero.abilities.duelist.feint.short_desc=결투사는 페인트를 사용하여 공격하는 척하면서 인접한 타일로 빠르게 이동합니다. 적들은 그녀의 잔상을 공격하게 되므로, 결투사는 반격할 기회를 얻게 됩니다.
actors.hero.abilities.duelist.feint.too_far=그곳은 당신의 위치와 인접해 있지 않습니다.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=사냥꾼은 잠시 동안 강화되어 이동 속도와 활 공격 속도가 증가합니다.\n\n남은 턴: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=자연의 힘
actors.hero.abilities.huntress.naturespower.desc=사냥꾼은 일시적으로 자신과 활에 자연의 힘을 불어넣습니다! 이 효과는 8턴 동안 지속됩니다. 이 시간 동안 사냥꾼은 이동 속도가 2배가 되고, 활 공격 속도가 33% 빨라집니다. 사냥꾼이 특수 공격을 사용 중일 때는 활 공격 보너스 효과가 발동하지 않습니다.
actors.hero.abilities.huntress.naturespower.name=자연의 힘
actors.hero.abilities.huntress.naturespower.short_desc=사냥꾼은 자연의 힘을 불러내어 짧은 시간 동안 이동 속도와 활의 연사 속도를 증가시킵니다.
actors.hero.abilities.huntress.spectralblades.desc=헌트리스는 적에게 유령의 칼날을 던지는데, 이는 근접 무기의 원거리 공격처럼 작용합니다. 마법 부여를 포함하여 근접 무기의 모든 일반적인 효과가 활성화됩니다.
actors.hero.abilities.huntress.spectralblades.name=스펙트럴 블레이드
actors.hero.abilities.huntress.spectralblades.short_desc=헌트리스는 대상에게 스펙트럴 블레이드를 던져 현재 장착한 근접 무기에 따라 피해를 입힙니다.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=사냥꾼이 소환한 마법의 매. 밝고 신비로운 푸른빛을 띠며, 끊임없이 머리를 움직여 주변을 살핍니다. 전투 능력은 뛰어나지 않지만, 빠른 속도와 넓은 시야 덕분에 정찰 및 적의 주의를 분산시키는 데 탁월합니다.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=남은 확실한 회피 기회: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=남은 턴 수: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=당신의 매가 공격하러 움직입니다!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=당신의 매는 그 위치로 이동합니다.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=당신의 매가 당신을 따라오려고 움직입니다.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=이 캐릭터는 특정 영웅 갑옷 능력을 통해 찾을 수 있습니다.
actors.hero.abilities.huntress.spirithawk$hawkally.name=스피릿 호크
actors.hero.abilities.huntress.spirithawk.desc=사냥꾼은 정령 매를 소환하며, 소환된 상태에서 능력을 다시 사용하면 매를 조종할 수 있습니다. 매는 100턴 동안 지속되며, 조종하는 데에는 능력이 소모되지 않습니다. 매는 체력과 공격력은 낮지만 빠르고 회피력이 뛰어나며 명중률이 높습니다. 매는 항상 사냥꾼과 시야를 공유하며, 화염이나 독가스 같은 범위 공격 효과에 면역입니다. 특별히 지시하지 않으면 공격하지 않습니다.
actors.hero.abilities.huntress.spirithawk.name=스피릿 호크
actors.hero.abilities.huntress.spirithawk.no_space=주변에 빈 공간이 없습니다.
actors.hero.abilities.huntress.spirithawk.short_desc=헌트리스는 정찰 및 적의 주의를 분산시키는 데 도움을 줄 수 있는 _스피릿 호크_를 소환합니다.
actors.hero.abilities.mage.elementalblast.desc=마법사는 최대 4칸 반경의 원형 영역에 15~25의 피해를 주는 마법 폭발을 일으킵니다. 이 마법 폭발의 구체적인 효과는 마법사의 지팡이에 장착된 마법봉의 종류에 따라 달라집니다.
actors.hero.abilities.mage.elementalblast.generic_desc=원소 폭발의 효과는 적이나 아군에게 마법 지팡이를 휘두를 때와 유사합니다.
actors.hero.abilities.mage.elementalblast.name=원소 폭발
actors.hero.abilities.mage.elementalblast.no_staff=스태프 없이는 이 능력을 사용할 수 없습니다.
actors.hero.abilities.mage.elementalblast.short_desc=마법사는 지팡이에서 원소 폭발을 일으켜 주변 넓은 지역에 영향을 미치는데, 그 효과는 지팡이에 달린 마법봉의 종류에 따라 달라집니다.
actors.hero.abilities.mage.warpbeacon.depths=깊이 사이를 순간 이동할 수는 없어!
actors.hero.abilities.mage.warpbeacon.desc=마법사는 순간이동 신호를 설치할 수 있으며, 이 신호가 설치된 곳으로 언제든 순간이동할 수 있습니다. 신호 설치에는 1턴이 소요되지만, 순간이동은 즉시 이루어집니다. 마법사는 기본적으로 층 사이를 순간이동할 수 없으며, 잠긴 방과 같이 접근할 수 없는 장소로 순간이동하기 위해 신호가 설치된 곳을 이용할 수도 없습니다. 마법사는 적에게 순간이동하여 적을 밀쳐낼 수 있습니다.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=거기에는 신호기를 설치할 수 없어요!
actors.hero.abilities.mage.warpbeacon.locked_floor=잠긴 층에서는 나갈 수 없습니다!
actors.hero.abilities.mage.warpbeacon.name=워프 비콘
actors.hero.abilities.mage.warpbeacon.short_desc=마법사는 현재 위치에 순간 이동 신호기를 설치하며, 그곳으로 즉시 순간 이동할 수 있습니다.
actors.hero.abilities.mage.warpbeacon.too_far=그곳은 너무 멀어요!
actors.hero.abilities.mage.warpbeacon.window_cancel=취소
actors.hero.abilities.mage.warpbeacon.window_clear=클리어 비콘
actors.hero.abilities.mage.warpbeacon.window_desc=현재 비콘은 %d 층에 설치되어 있습니다.
actors.hero.abilities.mage.warpbeacon.window_tele=비콘으로 순간이동
actors.hero.abilities.mage.wildmagic.desc=마법사는 지팡이에 담긴 힘을 해방하여 한 턴에 최대 4번까지 무작위로 발사합니다. 마법사의 지팡이는 이 효과에 포함되지 않습니다. 각 지팡이는 레벨이 2씩 증가하여 최대 +3까지 강화됩니다. 이 능력은 한 번 발사할 때마다 지팡이 충전량의 절반을 소모하며, 한 지팡이로 2번 이상 발사할 수 없습니다.
actors.hero.abilities.mage.wildmagic.name=야생의 마법
actors.hero.abilities.mage.wildmagic.no_wands=마법을 걸 지팡이가 없잖아!
actors.hero.abilities.mage.wildmagic.short_desc=마법사는 지팡이에 담긴 _야생 마법_을 해방시켜, 한 턴 동안 선택한 대상에게 무작위로 여러 번 발사합니다.
actors.hero.abilities.ratmogrify$transmograt.desc=이 적은 쥐로 변했군. 내 생각엔 훨씬 나아진군! - 쥐왕
actors.hero.abilities.ratmogrify$transmograt.name=쥐로 변형된 %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=처치 대상: 쥐로 변형된 적
actors.hero.abilities.ratmogrify.cant_transform=저건 쥐로 변신시킬 수 없어!
actors.hero.abilities.ratmogrify.desc=영웅이 적을 6턴 동안 쥐로 변신시킵니다! 보스, 아군, 그리고 쥐는 쥐로 변신할 수 없습니다. 쥐로 변신한 적은 원래 능력치를 유지하지만, 아무런 능력을 갖지 못합니다.
actors.hero.abilities.ratmogrify.name=쥐의 변신
actors.hero.abilities.ratmogrify.short_desc=영웅이 적을 쥐로 변신시킵니다! 이 기술은 적을 일시적으로 아무런 능력도 없는 쥐로 만듭니다.
actors.hero.abilities.ratmogrify.too_strong=저 적은 쥐로 변신시키기엔 너무 강해!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=이 적은 표식이 찍혔습니다. 이로 인해 25%%의 추가 피해를 입지만, 표식이 사라질 때까지 죽지 않습니다.\n\n남은 턴: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=죽음의 표식이 찍혔다
actors.hero.abilities.rogue.deathmark.ally_target=적만 표시할 수 있습니다.
actors.hero.abilities.rogue.deathmark.desc=도적은 선택한 적에게 표식을 남겨 25%의 추가 피해를 입힙니다. 표식은 즉시 적용되며 5턴 동안 지속됩니다. 표식이 찍힌 적은 추가 피해를 입지만 표식이 사라질 때까지 죽지 않습니다. 표식이 끝날 때 적의 HP가 0이면 즉시 죽습니다.
actors.hero.abilities.rogue.deathmark.name=죽음의 표식
actors.hero.abilities.rogue.deathmark.short_desc=도적은 선택한 적에게 죽음의 표식을 남깁니다. 표식이 있는 적은 추가 피해를 입지만, 표식이 사라질 때까지 죽지 않습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=어둠의 그림자로 만들어진 도적의 복제품. 꼼짝 않고 서 있는 그 복제품은 공허한 눈과 마치 증기처럼 피어오르는 작은 어둠의 조각들을 뿜어내고 있다. 이 복제품은 완벽한 도적의 복제품은 아니지만, 여전히 훌륭한 전투력을 지니고 있으며, 적절한 재능을 갖추면 도적의 장비를 활용할 수 있다.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=당신의 복제체가 공격하러 움직입니다!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=당신의 복제본이 그 위치로 이동합니다.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=당신의 복제인간이 당신을 따라 움직입니다.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=이 캐릭터는 특정 영웅 갑옷 능력을 통해 찾을 수 있습니다.
actors.hero.abilities.rogue.shadowclone$shadowally.name=그림자 도적
actors.hero.abilities.rogue.shadowclone.desc=도적은 자신과 똑같이 생긴 그림자 복제체를 소환하여 전투에서 자신을 돕도록 조종할 수 있습니다. 그림자 복제체를 조종하는 데는 아무런 비용이 들지 않습니다. 복제체는 체력 80, 방어력 없음, 공격력 10~20을 가지고 있습니다. 이러한 모든 특성은 특성을 통해 강화할 수 있으며, 복제체는 영웅이 가진 무기와 방어구의 효과를 받습니다.
actors.hero.abilities.rogue.shadowclone.name=섀도우 클론
actors.hero.abilities.rogue.shadowclone.short_desc=도적은 전투에서 자신을 돕도록 조종할 수 있는 그림자 복제체를 소환합니다.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=어쩐 일인지 적들은 이 나무 모형이 진짜 도적이라고 쉽게 믿어버린다!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=이 캐릭터는 특정 영웅 갑옷 능력을 통해 찾을 수 있습니다.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=나무로 만든 미끼
actors.hero.abilities.rogue.smokebomb.desc=도적은 연막탄을 던지고 최대 6칸 떨어진 곳으로 순간이동합니다. 위험 요소와 적을 통과할 수 있지만, 벽과 같은 단단한 지형은 통과할 수 없습니다. 도적이 지나간 위치에 인접한 적들은 5턴 동안 시야가 가려집니다.
actors.hero.abilities.rogue.smokebomb.fov=시야 내의 빈 위치로만 점프할 수 있습니다.
actors.hero.abilities.rogue.smokebomb.name=연막탄
actors.hero.abilities.rogue.smokebomb.prompt=이동할 위치를 선택하세요
actors.hero.abilities.rogue.smokebomb.short_desc=로그는 순간이동하면서 연막탄을 던집니다. 그러면 이전 위치 근처의 적들이 시야가 가려집니다.
actors.hero.abilities.warrior.endure$enduretracker.desc=전사는 이제 자신이 입은 피해량에 비례하여 추가 피해를 입힙니다.\n\n추가 피해: %1$d\n남은 타격 횟수: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=지구력
actors.hero.abilities.warrior.endure.desc=전사는 3턴 동안 모든 공격으로부터 받는 피해가 절반으로 줄어듭니다. 이 피해 감소 효과는 갑옷과 같은 피해 저항 효과가 적용되기 전에 발동됩니다. 3턴 동안 버티면 10턴 이내에 가하는 다음 공격에 추가 피해가 발생합니다. 이 추가 피해는 버티는 동안 받은 모든 피해의 절반에 해당하며, 피해 감소 효과가 적용되기 전 금액입니다. 전사가 콤보를 보유한 상태라면, 이 능력을 사용할 때 콤보의 남은 시간이 3턴 증가합니다.
actors.hero.abilities.warrior.endure.name=견디다
actors.hero.abilities.warrior.endure.short_desc=전사는 몇 턴을 건너뛰는 대신 높은 피해 저항력을 얻으며 '견뎌낸다' 스킬을 사용합니다. 그리고 견뎌낸 시간에 비례하여 추가 피해를 입힙니다.
actors.hero.abilities.warrior.heroicleap.desc=전사는 목표 지점을 향해 도약하며, 경로상의 적이나 위험 요소를 뛰어넘습니다. 단, 벽이나 기타 단단한 지형은 뛰어넘을 수 없습니다.
actors.hero.abilities.warrior.heroicleap.name=영웅적인 도약
actors.hero.abilities.warrior.heroicleap.prompt=도약할 방향을 선택하세요
actors.hero.abilities.warrior.heroicleap.short_desc=전사는 적과 위험 요소를 뛰어넘어 목표 지점으로 _영웅적인 도약_을 합니다.
actors.hero.abilities.warrior.shockwave.desc=전사가 땅을 내리쳐 최대 5칸, 60도 원뿔형 범위에 충격파를 발생시킵니다. 이 충격파에 휘말린 적은 5턴 동안 이동 불가 상태가 되며, 5~10의 피해를 입고, 전사의 힘이 10을 초과할 때마다 추가로 1~2의 피해를 입습니다.
actors.hero.abilities.warrior.shockwave.name=충격파
actors.hero.abilities.warrior.shockwave.short_desc=전사는 땅을 내리쳐 원뿔형 범위에 충격파를 발생시킵니다. 충격파에 휘말린 적들은 피해를 입고 이동 속도가 느려집니다.
actors.hero.hero.key_distracted=자물쇠가 완전히 열리지 않네요. 계속 시도해 보세요.
actors.hero.hero.leave=아직 떠날 수 없어, 던전의 나머지 부분이 아래에 기다리고 있어!
actors.hero.hero.level_cap=당신은 더 강해질 수는 없지만, 경험은 당신에게 엄청난 힘을 불어넣어 줍니다!
actors.hero.hero.level_up=레벨업하세요!
actors.hero.hero.locked_chest=이 상자는 잠겨 있고 당신은 맞는 열쇠가 없습니다.
actors.hero.hero.locked_door=일치하는 키가 없습니다.
actors.hero.hero.name=너
actors.hero.hero.new_level=레벨업! 명중률 증가, 회피율 증가, 체력 5 증가!
actors.hero.hero.new_talent=재능 포인트 +1!
actors.hero.hero.noticed_smth=당신은 무언가를 알아챘군요.
actors.hero.hero.pain_resist=통증은 잠을 자고 싶은 충동을 억제하는 데 도움이 됩니다.
actors.hero.hero.revive=앙크가 생명의 에너지로 폭발합니다!
actors.hero.hero.search=찾다
actors.hero.hero.search_distracted=집중하기 어렵고, 찾는 것 자체가 너무 힘들어요.
actors.hero.hero.unspent=사용하지 않은 특성 포인트가 있습니다!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=소지할 수 없는 번호: %s.
actors.hero.hero.you_now_have=당신이 선택한 항목은 %s입니다.
actors.hero.heroclass.cleric=성직자
actors.hero.heroclass.cleric_desc=성직자는 고유한 성서를 가지고 시작하며, 이를 사용하여 다양한 주문을 시전할 수 있습니다. 성직자의 특성은 대부분 주문을 배우거나 업그레이드하는 데 집중되어 있습니다. 또한 성직자는 곤봉, 천 갑옷, 물통, 벨벳 주머니를 가지고 시작합니다. 성직자는 자동으로 다음 아이템을 식별합니다. 식별 주문서, 정화 물약, 저주 해제 주문서
actors.hero.heroclass.cleric_desc_short=성직자는 고유한 성서를 사용하여 신성 마법을 시전하는 신성 마법사입니다. 특성을 통해 주문을 배우고 강화할 수 있습니다.
actors.hero.heroclass.cleric_unlock=저주받은 장비에 걸린 저주를 완전히 제거해야 성직자 직업을 해금할 수 있습니다.
actors.hero.heroclass.duelist=결투사
actors.hero.heroclass.duelist_desc=결투사는 시간이 지남에 따라 재충전되는 특수 능력을 가진 독특한 레이피어를 가지고 시작합니다. 게임 내 모든 무기는 결투사가 사용할 수 있는 각기 다른 특수 능력을 가지고 있습니다. 또한 결투사는 투척용 스파이크 두 개, 천 갑옷, 물통, 벨벳 주머니를 가지고 시작합니다. 결투사는 자동으로 다음 아이템들을 식별합니다. 식별 주문서, 강화 물약, 거울 이미지 주문서
actors.hero.heroclass.duelist_desc_short=결투사는 무기를 사용하여 특수한 무기 능력을 발동시킬 수 있는 무기 달인입니다. 이 특수 능력은 무기마다 다릅니다.
actors.hero.heroclass.duelist_unlock=결투가 특성을 해금하려면 공격력 페널티가 없는 2단계 이상의 무기를 장착하세요.
actors.hero.heroclass.huntress=여자 사냥꾼
actors.hero.heroclass.huntress_desc=사냥꾼은 무한정 소환 화살을 쏠 수 있는 특별한 영혼 활로 시작합니다. 사냥꾼은 키 큰 풀밭을 밟지 않고 지나갈 수 있습니다. 또한, 사냥꾼은 징 박힌 장갑, 천 갑옷, 물통, 벨벳 주머니를 가지고 시작합니다. 사냥꾼은 자동으로 다음 아이템들을 식별합니다: 식별 주문서, 정신 감지 물약, 자장가 주문서
actors.hero.heroclass.huntress_desc_short=사냥꾼은 투척 무기의 달인이며 화살이 무한히 발사되는 마법 활을 가지고 있습니다. 또한 키 큰 풀숲을 밟지 않고 이동할 수 있습니다.
actors.hero.heroclass.huntress_unlock=헌트리스를 잠금 해제하려면 한 게임에서 투척 무기로 적을 10번 공격하세요.
actors.hero.heroclass.mage=마술사
actors.hero.heroclass.mage_desc=마법사는 마법 지팡이보다 훨씬 빠르게 재충전되고 충전 횟수가 1회 더 많은 특별한 지팡이를 가지고 시작합니다. 이 지팡이에는 마법사가 던전에서 발견하는 모든 마법 지팡이의 마법을 부여할 수 있습니다. 또한 마법사는 지팡이에 마법 미사일이 부여된 지팡이, 천 갑옷, 물통, 벨벳 주머니를 가지고 시작합니다. 마법사는 자동으로 다음 아이템들을 식별합니다: 식별 주문서, 액체 불꽃 물약, 강화 주문서
actors.hero.heroclass.mage_desc_short=마법사는 마법 전문가이며, 지팡이보다 강력한 마법 지팡이를 가지고 다닙니다. 이 지팡이는 마법사가 발견한 어떤 지팡이의 힘이라도 불어넣을 수 있습니다.
actors.hero.heroclass.mage_unlock=마법사를 해금하려면 업그레이드 스크롤을 사용하여 아이템을 강화하세요.
actors.hero.heroclass.rogue=악당
actors.hero.heroclass.rogue_desc=도적은 고유한 그림자 망토를 가지고 시작하며, 이를 사용하여 마음대로 투명해질 수 있습니다. 도적은 더 먼 거리에서 비밀과 함정을 감지할 수 있습니다. 또한 도적은 단검, 투척용 나이프 세 자루, 천 갑옷, 물통, 벨벳 주머니를 가지고 시작합니다. 도적은 다음 아이템들을 자동으로 식별합니다. 식별 주문서, 투명 물약, 마법 지도 주문서
actors.hero.heroclass.rogue_desc_short=도적은 그림자 망토를 사용하여 적을 피하고 투명 상태에서 공격할 수 있습니다. 또한 더 먼 거리에서 비밀과 함정을 감지할 수 있습니다.
actors.hero.heroclass.rogue_unlock=로그를 잠금 해제하려면 한 게임에서 10번의 기습 공격을 수행하세요.
actors.hero.heroclass.warrior=전사
actors.hero.heroclass.warrior_desc=전사는 체력이 절반 이하로 떨어졌을 때 순간적으로 보호막을 부여하는 독특한 깨진 봉인을 가지고 시작합니다. 이 봉인은 갑옷 사이를 이동할 수 있으며, 하나의 업그레이드를 함께 옮길 수 있습니다. 또한, 전사는 낡은 단검, 투척용 돌 세 개, 천 갑옷, 물통, 벨벳 주머니를 가지고 시작합니다. 전사는 자동으로 다음 아이템들을 식별합니다: 식별 주문서, 회복 물약, 분노 주문서
actors.hero.heroclass.warrior_desc_short=전사는 '깨진 봉인'으로 얻는 보호막 덕분에 추가 피해를 견뎌냅니다. 이 봉인은 갑옷 간에 이동할 수 있으며, '하나의 업그레이드'를 전송합니다.
actors.hero.heroclass.warrior_unlock=워리어는 자동으로 잠금 해제됩니다.
actors.hero.herosubclass.assassin=암살자
actors.hero.herosubclass.assassin_desc=암살자는 투명화 상태가 되어 다음 공격을 준비합니다. 준비 시간이 길어질수록 다음 공격력은 더욱 강력해집니다. 준비 시간은 최대 9턴까지입니다. 준비 후, 암살자는 다음 공격에 추가 피해를 입히고, 목표물로 순간 이동할 수 있으며, 충분히 약한 적은 즉시 처치할 수도 있습니다.
actors.hero.herosubclass.assassin_short_desc=암살자는 투명화된 상태에서 치명적인 공격을 준비할 수 있습니다. 기다리는 시간이 길수록 공격력은 더욱 강력해집니다.
actors.hero.herosubclass.battlemage=전투 마법사
actors.hero.herosubclass.battlemage_desc=전투 마법사는 지팡이로 근접 공격을 할 때마다 마치 지팡이에 추가 마법이 걸린 것처럼 보너스 효과를 얻습니다. 이 효과는 지팡이에 부여된 마법봉의 종류에 따라 달라지며, 각 마법봉은 고유한 효과를 지닙니다. 마법봉 효과 외에도, 전투 마법사가 지팡이로 공격할 때마다 지팡이의 충전량이 0.5만큼 증가합니다.
actors.hero.herosubclass.battlemage_short_desc=전투 마법사는 지팡이를 들고 근접 전투를 벌일 때 추가 효과를 발동합니다. 이러한 효과는 지팡이에 부여된 마법의 종류에 따라 달라집니다.
actors.hero.herosubclass.berserker=맹렬한
actors.hero.herosubclass.berserker_desc=버서커는 갑옷으로 막히는 피해를 포함하여 물리 피해를 입을 때마다 분노가 쌓입니다! 분노는 시간이 지남에 따라 서서히 감소하지만, 체력이 낮을수록 더 천천히 줄어듭니다. 분노가 최대치에 도달하면 버서커는 최대 50%의 추가 피해를 입힐 수 있습니다. 분노가 최대치에 도달하면 광폭화 상태가 되어 순간적으로 보호막을 얻고, 보호막이 소진될 때까지 분노 상태를 유지합니다. 보호막은 버서커의 갑옷 레벨에 비례하며, 체력이 낮을수록 크게 증가합니다. 버서커는 광폭화 상태에서 회복하는 데 시간이 필요합니다.
actors.hero.herosubclass.berserker_short_desc=버서커는 피해를 입을수록 분노가 쌓입니다. 분노가 쌓이면 공격력이 증가하고, 100%에 도달하면 추가 보호막을 얻을 수 있습니다.
actors.hero.herosubclass.champion=챔피언
actors.hero.herosubclass.champion_desc=챔피언은 근접 무기의 달인으로, 주 무기 외에 보조 무기를 장착할 수 있습니다. 일반 공격은 주 무기를 사용하지만, 주 무기를 즉시 교체하여 두 무기의 능력을 모두 사용할 수 있습니다. 또한, 무기 능력 최대 사용 횟수가 2회 증가하고 무기 능력 재충전 속도가 50% 증가합니다.
actors.hero.herosubclass.champion_short_desc=챔피언은 두 개의 무기를 사용할 수 있으며, 더 많은 무기 사용 횟수를 가지고 있습니다. 일반 공격은 주 무기를 사용하지만, 무기를 교체하여 각 무기의 능력을 사용할 수 있습니다.
actors.hero.herosubclass.freerunner=프리러너
actors.hero.herosubclass.freerunner_desc=프리러너는 이동하면서 모멘텀을 쌓습니다. 10턴 동안 달리면 최대 10의 모멘텀을 얻을 수 있지만, 멈추면 빠르게 감소합니다. 프리러너는 모멘텀을 소모하여 프리러닝을 시작할 수 있으며, 모멘텀 1점당 2턴 동안 프리러닝을 지속합니다. 프리러닝 중에는 이동 속도가 2배가 되며, 레벨에 비례하여 회피율이 증가합니다. 프리러닝이 끝나면 일정 시간 동안 모멘텀을 다시 쌓을 수 없습니다.
actors.hero.herosubclass.freerunner_short_desc=프리러너는 달리면서 추진력을 얻는데, 이를 이용해 프리러닝을 시작할 수 있습니다. 프리러닝을 시작하면 짧은 시간 동안 속도와 회피율이 증가합니다.
actors.hero.herosubclass.gladiator=검투사
actors.hero.herosubclass.gladiator_desc=검투사는 근접 공격이나 투척 무기로 공격에 성공할 때마다 콤보 포인트를 1점씩 쌓습니다. 검투사가 5턴(적 처치 후 15턴) 이내에 공격에 성공하지 못하면 콤보가 초기화됩니다. 콤보가 쌓일수록 검투사는 다음과 같은 다양한 기술을 사용할 수 있으며, 이 기술들은 모두 명중이 보장됩니다. 콤보: 적을 뒤로 밀쳐내고 콤보를 유지합니다. 콤보: 방어력에 비례하는 피해를 줍니다. 콤보: 공격을 막고 콤보를 유지합니다. 콤보: 대상과 주변 적에게 피해를 줍니다. 콤보: 콤보 1회당 공격합니다.
actors.hero.herosubclass.gladiator_short_desc=글래디에이터는 공격에 성공할 때마다 콤보를 쌓습니다. 콤보를 소모하여 고유 능력을 사용할 수 있습니다.
actors.hero.herosubclass.monk=수도사
actors.hero.herosubclass.monk_desc=승려는 육체적인 기술의 달인입니다. 적을 물리칠 때마다 에너지를 얻으며, 이 에너지는 다양한 방어 및 유틸리티 능력에 사용할 수 있습니다. 이 에너지는 시간이 지나도 사라지지 않지만, 승려의 레벨에 따라 최대치가 정해져 있습니다. \n\n1 에너지: 주먹으로 빠르게 공격 \n2 에너지: 집중하여 다음 공격 회피 \n3 에너지: 근처로 순간 이동 \n4 에너지: 발차기로 적 날려버리기 \n5 에너지: 명상으로 상태 이상 해제 및 지팡이와 유물 충전량 회복
actors.hero.herosubclass.monk_short_desc=승려(Monk)는 전투 중에 에너지를 축적합니다. 이 에너지는 다양한 고유 능력에 사용할 수 있습니다.
actors.hero.herosubclass.paladin=무협가
actors.hero.herosubclass.paladin_desc=팔라딘은 근접 전투와 무기 및 갑옷과의 시너지를 강조하는 다양하고 새로운 주문과 업그레이드된 주문을 얻습니다. 팔라딘의 _성스러운 무기_와 _성스러운 보호막_ 주문은 더 큰 보너스를 제공하며, 기존의 마법 부여 및 문양을 덮어쓰지 않고, 다른 주문 시전으로 지속 시간을 연장할 수 있습니다. 또한 팔라딘은 추가 피해와 마법 부여 효과를 적용한 확정 근접 공격을 할 수 있는 _강타_ 주문을 얻습니다.
actors.hero.herosubclass.paladin_short_desc=팔라딘은 새로운 근거리 주문과 강화된 신성 무기 및 보호막을 얻습니다.
actors.hero.herosubclass.priest=성직자
actors.hero.herosubclass.priest_desc=사제는 원거리 전투와 마법 아이템과의 시너지를 강조하는 다양한 신규 및 업그레이드된 주문을 얻습니다. 사제는 50턴마다 한 번씩 무료로 _가이딩 라이트_를 시전할 수 있으며, 자신의 주문으로 직접 조준한 적을 밝히고, 아군, 지팡이, 일부 유물과 함께 조명 디버프를 소모하여 레벨 + 5에 해당하는 추가 피해를 입힐 수 있습니다. 또한 사제는 _래디언스_ 주문을 얻는데, 이 주문은 어둠을 없애고 모든 보이는 적에게 영향을 미쳐 조명 효과를 부여하고 잠시 기절시키며, 2회 사용 횟수가 소모됩니다.
actors.hero.herosubclass.priest_short_desc=사제는 새로운 장거리 주문과 강화된 형태의 인도하는 빛을 얻습니다.
actors.hero.herosubclass.sniper=저격병
actors.hero.herosubclass.sniper_desc=스나이퍼는 원거리 전투의 달인으로, 그녀의 원거리 공격은 적의 갑옷을 관통합니다. 투척 무기로 적을 공격하면 적에게 스나이퍼 표식을 남기고, 이를 이용해 활로 특수 공격을 가할 수 있습니다. 이 특수 공격은 활의 강화 상태에 따라 달라집니다. 강화되지 않은 활은 즉시 발사되지만 피해량은 적은 일반 화살을 발사합니다. 속도 강화 활은 피해량은 적지만 마법 부여 효과를 발동할 수 있는 세 발의 화살을 발사하며, 발사하는 데 1턴이 걸립니다. 피해량 강화 활은 거리에 비례하여 추가 피해를 주는 명중률 높은 스나이퍼 샷을 발사하며, 발사하는 데 2턴이 걸립니다.
actors.hero.herosubclass.sniper_short_desc=스나이퍼는 원거리 공격으로 갑옷을 관통할 수 있습니다. 투척 무기로 공격한 후에는 활을 이용한 특수 공격으로 연계할 수 있습니다.
actors.hero.herosubclass.warden=파수꾼
actors.hero.herosubclass.warden_desc=워든은 자연과 강한 유대감을 가지고 있어 풀과 식물에 관련된 다양한 보너스 효과를 부여받습니다. 그녀는 키가 크고 골이 진 풀 사이를 마치 빈 공간처럼 투명하게 볼 수 있습니다. 워든은 자신이 던지거나 심는 씨앗 주변에서 풀이 돋아나게 하며, 식물을 밟을 때 특수 효과를 얻습니다. 이 특수 효과는 일반적인 식물 효과를 대체하므로, 그녀가 밟는 어떤 식물도 해롭지 않습니다.
actors.hero.herosubclass.warden_short_desc=워든은 키 큰 풀숲을 투시할 수 있으며, 씨앗을 심거나 식물을 밟을 때 추가 효과를 얻습니다.
actors.hero.herosubclass.warlock=요술 장이
actors.hero.herosubclass.warlock_desc=마법사는 지팡이를 사용할 때 일정 확률로 적에게 영혼 표식을 새길 수 있습니다. 영혼 표식을 새길 확률과 지속 시간은 지팡이 레벨이 높을수록 증가합니다. 영혼 표식이 새겨진 적은 근접 공격이나 투척 무기 공격으로 입힌 피해 5당 2의 체력을 회복합니다. 단, 지팡이 공격으로는 회복되지 않습니다!
actors.hero.herosubclass.warlock_short_desc=워록은 지팡이를 사용하여 적에게 영혼 표식을 새길 확률이 있습니다. 표식이 새겨진 적에게 물리 피해를 입힐 때마다 체력이 회복됩니다.
actors.hero.spells.auraofprotection$aurabuff.desc=팔라딘이 자신 주변에 보호 에너지를 발산하고 있습니다. 주변의 모든 아군(팔라딘 자신 포함)은 받는 피해가 감소하고 팔라딘의 갑옷 문양 효과가 강화됩니다. 남은 턴: 0턴.
actors.hero.spells.auraofprotection$aurabuff.name=보호의 기운
actors.hero.spells.auraofprotection.desc=팔라딘은 20턴 동안 자신 주변에 반짝이는 오라 형태로 보호 에너지를 발산합니다. 팔라딘으로부터 2칸 이내에 있는 모든 아군(자신 포함)은 받는 피해가 %1$d%% 감소하고, 팔라딘의 갑옷 문양 효과를 +%2$d%%만큼 얻습니다. 이 피해 감소 효과는 다른 피해 감소 효과(예: 갑옷)보다 먼저 적용됩니다. 문양 효과 증가는 항상 적용되지만, 이미 해당 문양의 효과를 받고 있는 캐릭터(예: 팔라딘 자신 또는 프리즘 이미지)에게는 이 주문이 두 번 이상 적용될 수 없습니다.
actors.hero.spells.auraofprotection.name=보호의 기운
actors.hero.spells.auraofprotection.short_desc=팔라딘과 주변 아군의 방어력을 강화합니다.
actors.hero.spells.beamingray$beamingrayboost.desc=이 아군은 최근 Beaming Ray에 의해 순간 이동되었으며, 순간 이동 후 가장 가까운 적에게 추가 피해를 입힙니다. 또한 이 버프가 활성화된 동안에는 Power of Many 효과가 만료되지 않습니다. \n\n남은 턴: %s.
actors.hero.spells.beamingray$beamingrayboost.name=빛나는 광선
actors.hero.spells.beamingray.desc=성직자는 아군에게 힘을 집중시켜 빛줄기를 발사하여 특정 위치로 이동시킵니다. 빛줄기가 적과 충돌하면 아군을 그 근처에 배치하고 적을 향해 돌진하게 합니다. 이 빛줄기의 최대 사거리는 타일 수이며, 4칸 이내의 가장 가까운 적에게 10턴 동안 '다수의 힘' 추가 피해를 +2만큼 증가시킵니다. 이 빛줄기는 이동 불가능한 아군도 순간 이동시킬 수 있지만, 이 경우 사거리는 절반으로 줄어듭니다.
actors.hero.spells.beamingray.name=빛나는 광선
actors.hero.spells.beamingray.no_space=그곳에는 아군이 나타날 공간이 없습니다.
actors.hero.spells.beamingray.out_of_range=해당 위치는 통신 범위 밖입니다.
actors.hero.spells.beamingray.short_desc=아군을 순간 이동시키고 추가 피해를 부여합니다.
actors.hero.spells.blessspell.desc=성직자는 자신이나 시야 내에 있는 다른 캐릭터에게 신성한 축복을 내립니다. 자신에게 시전할 경우 효과가 약해져 %1$d 턴 동안 축복을 받고 %2$d만큼 보호막을 얻습니다. 다른 캐릭터에게 시전할 경우 주문의 위력이 강해져 %3$d 턴 동안 축복을 받고 %4$d만큼 치유합니다. 초과 치유량은 보호막으로 전환됩니다.
actors.hero.spells.blessspell.name=신을 하다
actors.hero.spells.blessspell.short_desc=성직자를 축복하고 보호하며, 다른 사람들을 축복하고 치유합니다.
actors.hero.spells.bodyform$bodyformbuff.desc=트리니티의 육체는 현재 마치 현재 무기나 갑옷에 해당 마법이나 문양을 장착한 것처럼 그 효과를 부여하고 있습니다. \n\n참고: 육체는 이미 적용 중인 효과를 추가로 부여할 수 없습니다.\n\n현재 효과: %1$s.\n\n남은 턴: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=신체 형태
actors.hero.spells.bodyform.desc=성직자는 이번 플레이에서 확인한 마법 부여 또는 문양 중 하나를 선택하여 트리니티에 그 효과를 부여합니다. 트리니티를 사용하면 성직자는 선택한 마법 부여 또는 문양의 효과를 0턴 동안 얻습니다. 이 임시 마법 부여 또는 문양은 일반 마법 부여 또는 문양의 효과와 마찬가지로 작동합니다. 이 주문은 트리니티에 현재 부여된 다른 모든 신체 효과를 대체합니다.
actors.hero.spells.bodyform.name=신체 형태
actors.hero.spells.bodyform.short_desc=마법이나 문양에 삼위일체를 부여합니다.
actors.hero.spells.cleanse.desc=성직자는 자신과 시야에 보이는 아군에게 걸린 모든 해로운 상태 이상을 제거합니다. 주문이 끝나면 영향을 받은 모든 캐릭터는 %1$d 턴 동안 디버프 면역을 얻고 %2$d 보호막을 받습니다.
actors.hero.spells.cleanse.name=고치다
actors.hero.spells.cleanse.short_desc=디버프를 제거하고 보호막을 부여합니다.
actors.hero.spells.clericspell.charge_cost=청구 비용: %d
actors.hero.spells.clericspell.invalid_enemy=저 적은 공격 대상으로 삼을 수 없습니다.
actors.hero.spells.clericspell.invalid_target=해당 위치를 대상으로 지정할 수 없습니다.
actors.hero.spells.clericspell.no_target=그곳에는 목표물이 없습니다.
actors.hero.spells.clericspell.prompt=목표를 선택하세요
actors.hero.spells.divineintervention.desc=성직자는 자신의 마도서에서 엄청난 양의 힘을 자신과 아군에게 쏟아부어, 모든 아군에게 %1$d만큼의 보호막을 부여하고 승천 형태를 %2$d턴 동안 연장합니다. 이 주문의 놀라운 방어력은 매우 높은 충전 비용과 상반됩니다. 다른 승천 형태 보호막과 마찬가지로, 이 보호막은 일반적인 방식으로 감소하지 않고 승천 형태가 종료되면 즉시 사라집니다.
actors.hero.spells.divineintervention.name=신의 개입
actors.hero.spells.divineintervention.short_desc=성직자와 아군에게 강력한 보호막 강화 효과를 부여합니다.
actors.hero.spells.divinesense$divinesensetracker.desc=이 캐릭터는 일시적으로 정신력으로 주변의 다른 생명체를 볼 수 있습니다!\n\n남은 턴: %s.
actors.hero.spells.divinesense$divinesensetracker.name=신성한 감각
actors.hero.spells.divinesense.desc=성직자는 주변 환경에 감각을 집중하여 50턴 동안 %d 타일 범위의 정신 시야를 얻습니다. 이 주문은 시전하는 데 시간이 걸리지 않습니다.
actors.hero.spells.divinesense.name=신성한 감각
actors.hero.spells.divinesense.short_desc=넓은 범위에 걸쳐 일시적으로 정신적 통찰력을 얻으세요.
actors.hero.spells.flash.desc=성직자는 자신의 승천한 형태를 근처 위치에 집중시킨 후 그곳으로 순간이동합니다. 섬광(Flash)은 사거리 내에 있고 사람이 없는 발견된 위치로 성직자를 순간이동시킬 수 있습니다. 이 주문은 동일한 승천한 형태로 사용할 때마다 마법서 사용 횟수가 증가합니다.
actors.hero.spells.flash.name=플래시
actors.hero.spells.flash.prompt=위치를 선택하세요
actors.hero.spells.flash.short_desc=가까운 장소로 순간이동합니다.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=사제는 50턴이 지나면 다시 무료로 인도하는 빛을 시전할 수 있습니다. 남은 턴: \n\n ...
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=길잡이 빛
actors.hero.spells.guidinglight$illuminated.desc=이 캐릭터는 인도하는 빛에 맞은 결과로 빛을 발하고 있습니다. 빛이 주변을 밝힐 만큼 강하지는 않지만, 이 마법 효과 덕분에 성직자가 이 캐릭터를 공격하기가 훨씬 쉬워질 것입니다.
actors.hero.spells.guidinglight$illuminated.desc_generic=다른 영웅들도 여전히 광휘를 사용하여 작열하는 빛 특성의 혜택을 받을 수 있지만, 명중률은 얻지 못합니다.
actors.hero.spells.guidinglight$illuminated.desc_priest=사제는 또한 빛나는 광채, 지팡이 공격, 아군의 공격 또는 일부 유물의 효과로 인해 광채를 추가로 소모할 수 있습니다. 이러한 방식으로 광채를 사용하면 사제의 레벨 + 5에 해당하는 추가 마법 피해를 입힙니다.
actors.hero.spells.guidinglight$illuminated.name=조명
actors.hero.spells.guidinglight.desc=성직자가 마법 에너지를 발사하여 대상을 명중시키면 2~8의 피해를 입히고 대상을 빛나게 합니다. 빛나게 된 적에게 가하는 다음 물리 공격은 무조건 명중합니다.
actors.hero.spells.guidinglight.desc_priest=이 주문은 사제가 시전할 때 더욱 강력해집니다. 50턴마다 처음 시전할 때는 마법서 사용 횟수가 소모되지 않으며, 광휘, 지팡이, 다른 캐릭터, 그리고 적에게 직접 영향을 주는 유물은 광휘를 소모합니다. 이러한 방식으로 광휘를 사용하면 사제의 레벨 + 5에 해당하는 추가 마법 피해를 입힙니다.
actors.hero.spells.guidinglight.name=길잡이 빛
actors.hero.spells.guidinglight.short_desc=원거리 마법 피해를 입히며 반드시 명중합니다.
actors.hero.spells.hallowedground$hallowedterrain.desc=이곳은 신성한 땅입니다. 신성한 땅은 적의 속도를 늦추고, 아군을 치유하며, 풀이 퍼지게 합니다.
actors.hero.spells.hallowedground.desc=사제는 근처 땅에 신성 마법을 집중시켜 20턴 동안 지속되는 신성한 지형(%1$dx%1$d)을 생성합니다. 이 마법이 시전되면 모든 아군의 HP를 15 회복시키고(건강한 아군과 사제는 보호막을 얻습니다), 적을 잠시 속박하며, 짧은 풀을 뿌립니다. 신성한 지형은 매 턴 아군의 HP를 1 회복시키고(건강한 아군과 사제는 보호막을 얻습니다), 적을 무력화시키며, 무작위로 키 큰 풀을 자라게 합니다. 신성한 지형은 불에 의해 파괴되며, 지속 회복 효과가 비활성화되었거나 사제가 일정 시간 동안 경험치를 획득하지 못한 경우 밭고랑이 있는 풀을 생성합니다.
actors.hero.spells.hallowedground.name=신성한 땅
actors.hero.spells.hallowedground.prompt=위치를 선택하세요
actors.hero.spells.hallowedground.short_desc=아군을 치유하고, 적의 이동 속도를 늦추며, 광역 범위에 풀을 뿌립니다.
actors.hero.spells.holyintuition.cursed=이 물건 안에 사악한 마법이 숨어 있음을 느낍니다.
actors.hero.spells.holyintuition.desc=성직자는 감각을 집중하여 어떤 물건에 저주가 걸렸는지 아닌지를 장비하지 않고도 판단할 수 있습니다.
actors.hero.spells.holyintuition.name=신성한 직관
actors.hero.spells.holyintuition.prompt=항목을 선택하세요
actors.hero.spells.holyintuition.short_desc=물건이 저주받았는지 아닌지를 식별합니다.
actors.hero.spells.holyintuition.uncursed=이 물건에는 악의적인 마법이 걸려 있지 않습니다.
actors.hero.spells.holylance$lancecooldown.desc=사제는 방금 성창을 시전했으므로 다시 시전하기 전에 기다려야 합니다. 남은 턴: \n\n ...
actors.hero.spells.holylance$lancecooldown.name=성스러운 창 재사용 대기시간
actors.hero.spells.holylance.desc=사제는 막대한 에너지를 집중시켜 빛으로 이루어진 파괴적인 투척창을 발사합니다. 이 창은 %1$d-%2$d의 피해를 입히며, 언데드와 악마 대상에게는 항상 최대 피해를 줍니다. 이 주문은 마나 소모가 매우 크며, 재사용 대기시간은 30턴입니다.
actors.hero.spells.holylance.name=성창
actors.hero.spells.holylance.short_desc=원거리에서 강력한 마법 피해를 입힙니다.
actors.hero.spells.holyward$holyarmbuff.desc=성직자는 자신이 착용한 갑옷에 신성한 에너지를 불어넣어 기존의 모든 문양을 일시적으로 덮어쓰고 갑옷이 추가로 1점의 피해를 막도록 했습니다.\n\n남은 턴: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=팔라딘은 자신이 착용한 갑옷에 신성한 에너지를 불어넣어 추가로 3점의 피해를 막아냅니다. 신성한 보호막이 활성화된 동안 다른 주문을 시전하면 소모한 충전량당 10턴씩 지속 시간이 연장됩니다. 남은 턴:
actors.hero.spells.holyward$holyarmbuff.name=성스러운 병동
actors.hero.spells.holyward.desc=성직자는 자신이 착용하는 갑옷에 신성한 빛의 문양을 새겨 넣어 갑옷의 피해 차단율을 1만큼 증가시킵니다. 이 주문은 시전 시간이 없습니다. 이 문양은 50턴 동안 지속되며, 그 기간 동안 갑옷에 있는 다른 모든 이로운 문양을 덮어씁니다. 성직자는 갑옷을 착용하지 않아도 이 효과를 받습니다.
actors.hero.spells.holyward.desc_paladin=이 주문은 성기사가 시전할 때 더욱 강력해집니다. 추가 피해 차단량이 3으로 증가하고, 기존 문양을 덮어쓰지 않으며, 신성한 보호막이 활성화된 상태에서 다른 주문을 시전하면 사용한 충전량당 지속 시간이 10턴씩 연장됩니다.
actors.hero.spells.holyward.glyph_desc=이 문양은 갑옷이 막을 수 있는 피해량을 약간 증가시킵니다.
actors.hero.spells.holyward.glyph_name=빛의 %s
actors.hero.spells.holyward.name=성스러운 병동
actors.hero.spells.holyward.short_desc=일시적으로 문양을 덮어쓰기하여 갑옷의 방어력을 높입니다.
actors.hero.spells.holyweapon$holywepbuff.desc=성직자는 자신이 착용한 무기에 신성한 에너지를 불어넣어 기존의 모든 마법 효과를 일시적으로 무효화하고 공격 시마다 추가로 2의 마법 피해를 입히도록 했습니다. 남은 턴:
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=팔라딘은 자신이 착용한 무기에 신성한 에너지를 불어넣어 공격 시 추가로 6의 마법 피해를 입힙니다. 신성한 무기가 활성화된 상태에서 다른 주문을 시전하면 소모한 충전량당 지속 시간이 10턴씩 연장됩니다. 남은 턴:
actors.hero.spells.holyweapon$holywepbuff.name=성스러운 무기
actors.hero.spells.holyweapon.desc=성직자는 자신이 착용한 무기에 신성한 에너지를 불어넣어 적을 공격할 때마다 추가로 2의 마법 피해를 입힙니다. 이 주문은 시전 시간이 없습니다. 이 마법 부여는 50턴 동안 지속되며, 해당 기간 동안 무기에 부여된 모든 이로운 마법 부여 효과를 무효화합니다. 맨손 공격에도 이 효과가 적용됩니다.
actors.hero.spells.holyweapon.desc_paladin=이 주문은 팔라딘이 시전할 때 더욱 강력해집니다. 추가 마법 피해량이 6으로 증가하고, 기존의 마법 부여 효과를 덮어쓰지 않으며, 신성한 무기가 활성화된 상태에서 다른 주문을 시전하면 사용한 충전량당 지속 시간이 10턴씩 연장됩니다.
actors.hero.spells.holyweapon.ench_desc=성스러운 무기에 맞은 적은 추가적인 마법 피해를 입습니다.
actors.hero.spells.holyweapon.ench_name=성스러운 %s
actors.hero.spells.holyweapon.name=성스러운 무기
actors.hero.spells.holyweapon.short_desc=일시적으로 마법 효과를 무효화하여 공격력을 증가시킵니다.
actors.hero.spells.judgement.desc=성직자가 주먹으로 땅을 내리쳐 빛의 폭발을 일으키고, 시야에 보이는 모든 적에게 피해를 입힙니다. 기본 피해량은 %1$d-%2$d이지만, 승천 형태에 들어간 이후(또는 마지막으로 심판을 시전한 이후) 성직자가 시전한 주문 하나당 추가로 33%%의 피해를 입힙니다. 현재 심판은 %3$d-%4$d의 피해를 입힙니다.
actors.hero.spells.judgement.name=심판
actors.hero.spells.judgement.short_desc=보이는 모든 적에게 피해를 줍니다.
actors.hero.spells.layonhands.desc=팔라딘은 손을 통해 신성한 에너지를 집중시켜 닿는 모든 것을 치유하거나 보호합니다. 팔라딘은 이 주문을 인접한 캐릭터에게 시전하여 %1$d 치유 효과를 부여하거나, 자신에게 시전하여 %1$d 보호막을 얻을 수 있습니다. 이 주문으로 얻는 치유 효과 중 초과분은 보호막으로 전환됩니다. 이 주문은 즉시 시전되며 반복해서 시전할 수 있지만, 한 번에 세 번 시전량에 해당하는 보호막을 부여할 수는 없습니다.
actors.hero.spells.layonhands.name=손을 얹다
actors.hero.spells.layonhands.short_desc=인접한 캐릭터를 즉시 치유하거나 팔라딘에게 보호막을 씌웁니다.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=성직자가 최근 이 아군에게 생명 연결(Life Link)을 시전했습니다. 생명 연결의 일반적인 효과 외에도, 이 캐릭터는 받는 피해가 감소하고, 성직자의 모든 긍정적인 주문 효과가 한쪽 아군에게만 적용되는 것이 아니라 성직자와 이 아군 모두에게 적용되며, 이 버프가 활성화된 동안에는 다수의 힘(Power of Many) 효과가 만료되지 않습니다. 남은 턴: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=생명 연결 보호
actors.hero.spells.lifelinkspell.desc=성직자는 자신과 강화된 아군 사이의 연결을 강화합니다. 이 강화된 연결을 통해, %1$d 턴 동안 받는 모든 피해는 영웅과 아군 모두에게 공유되며, '다수의 힘'의 방어력 증가 효과는 받는 피해 감소량 -%2$d%%로 증가합니다. 피해 공유는 방어력 적용 후, '다수의 힘'의 피해 감소 효과 적용 전에 이루어집니다. 이 효과가 활성화된 동안, 3단계 이하의 성직자 주문은 원래 둘 중 한 명에게만 적용되던 것이라면, 이제는 성직자와 아군 모두에게 적용됩니다.
actors.hero.spells.lifelinkspell.name=생명 연결
actors.hero.spells.lifelinkspell.short_desc=아군과 피해를 공유하고, 아군이 받는 피해를 감소시킵니다.
actors.hero.spells.mindform.desc=성직자는 이번 플레이에서 확인한 지팡이 또는 투척 무기 중 하나를 선택하고, 그 효과를 트리니티에 부여합니다. 트리니티를 사용하면, 성직자는 선택한 아이템을 사용하는 것처럼 +%d의 효과를 받아 한 번 공격할 수 있습니다. 이 공격은 해당 아이템을 사용할 때 일반적으로 발생하는 모든 효과를 발동시킵니다. 이 주문은 트리니티에 현재 부여된 다른 정신 효과를 대체합니다.
actors.hero.spells.mindform.name=마음의 형태
actors.hero.spells.mindform.short_desc=트리니티를 지팡이나 투척 무기에 부여합니다.
actors.hero.spells.mnemonicprayer.desc=사제는 특정 대상에게 적용된 모든 버프 또는 디버프의 지속 시간을 %1$d턴만큼 연장하는 기도를 외웁니다. 이 주문은 시전 시간이 없습니다. 아군(사제 자신 포함)에게는 긍정적인 효과가 더 오래 지속되고, 적에게는 부정적인 효과가 더 오래 지속됩니다. \n\n기억의 기도는 특정 버프 또는 디버프의 지속 시간을 한 번만 연장할 수 있으며, 방어구 능력으로 부여되는 버프는 연장할 수 없습니다.
actors.hero.spells.mnemonicprayer.name=기억술 기도
actors.hero.spells.mnemonicprayer.short_desc=아군/적에게 적용된 버프/디버프의 지속 시간을 늘리고, 광채 효과를 다시 부여합니다.
actors.hero.spells.radiance.desc=사제가 신성한 빛을 발산하여 시야에 보이는 모든 적을 3턴 동안 기절시킵니다. 적이 이미 빛에 휩싸여 있다면, 광채는 광채 효과의 추가 피해를 입히고 광채 디버프를 적용합니다. 또한, 현재 층이 어두울 경우 사제는 100턴 동안 빛을 발합니다.
actors.hero.spells.radiance.name=발광
actors.hero.spells.radiance.short_desc=시야에 보이는 적들을 비추고 잠시 기절시킵니다.
actors.hero.spells.recallinscription$useditemtracker.desc=성직자는 최근에 새겨진 소환 주문과 연동되는 아이템을 사용했습니다. 성직자는 해당 주문을 시전하여 아이템의 효과를 반복할 수 있습니다. \n\n사용된 아이템: %1$s.\n\n남은 턴: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=최근 사용된 룬
actors.hero.spells.recallinscription.desc=성직자는 신성 마법을 사용하여 지난 %s 턴 동안 사용한 룬석이나 두루마리에 새겨진 마법 룬의 효과를 다시 시전합니다. '복구 주문'은 강화 두루마리를 복제하는 데 사용할 수 없습니다. 이 주문의 사용 비용은 최근 사용한 아이템에 따라 다릅니다. 룬석은 2, 두루마리는 3, 특수 두루마리는 4입니다. 변환 두루마리 또는 변환이나 강화를 사용하여 제작해야 하는 연금술 아이템을 복제할 때는 사용 비용이 두 배가 됩니다.
actors.hero.spells.recallinscription.name=회상 비문
actors.hero.spells.recallinscription.short_desc=최근에 사용한 룬스톤이나 두루마리를 반복해서 사용합니다.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=이 캐릭터와 적 사이에는 얇은 빛의 방패가 놓여 있습니다. 공격을 완전히 막을 만큼 강력하지는 않지만, 공격의 피해를 줄여줍니다. 남은 턴:
actors.hero.spells.shieldoflight$shieldoflighttracker.name=빛의 방패
actors.hero.spells.shieldoflight.desc=성직자는 자신과 적 사이에 얇은 빛의 장벽을 생성하여 5턴 동안 해당 적에 대한 갑옷의 방어력을 %1$d-%2$d만큼 증가시킵니다. 이 주문은 시전 시간이 없지만 여러 대상에게 동시에 사용할 수 없습니다.
actors.hero.spells.shieldoflight.name=빛의 방패
actors.hero.spells.shieldoflight.short_desc=대상에게 일시적인 방어력을 부여합니다.
actors.hero.spells.smite.desc=팔라딘은 근접 공격에 정의로운 파괴력을 불어넣습니다. 일반적인 근접 공격 피해 외에도, 스마이트는 무게 제한이 없는 공격에 명중률을 보장하고, +300의 마법 강화 효과를 가지며, 추가 마법 피해를 입힙니다. 스마이트의 추가 마법 피해는 팔라딘의 레벨에 따라 증가하며, 언데드 또는 악마 적에게는 항상 최대 추가 마법 피해를 입힙니다.
actors.hero.spells.smite.name=강타
actors.hero.spells.smite.short_desc=추가 피해와 마법 부여 효과로 명중을 보장합니다.
actors.hero.spells.spiritform$spiritformbuff.desc=트리니티의 영혼 형태는 현재 마치 아이템을 장착한 것처럼 아이템의 힘을 부여하고 있습니다. \n\n참고: 영혼 형태는 이미 적용 중인 효과를 추가로 부여할 수 없습니다.\n\n현재 효과: %1$s.\n\n남은 턴: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=영혼의 형태
actors.hero.spells.spiritform.desc=성직자는 이번 플레이에서 확인한 반지나 유물(성서 제외) 중 하나를 선택하여 삼위일체에 그 효과를 부여합니다. 반지를 선택하면 삼위일체는 해당 반지의 효과를 20턴 동안 +%1$d만큼 부여합니다. 유물을 선택하면 삼위일체는 해당 유물의 효과를 +%2$d만큼 복제합니다. 각 유물은 삼위일체와 함께 사용할 때 서로 다른 특정 동작과 방어구 충전 비용을 가집니다. 이 주문은 삼위일체에 현재 부여된 다른 모든 정령 효과를 대체합니다.
actors.hero.spells.spiritform.name=영혼의 형태
actors.hero.spells.spiritform.short_desc=반지나 유물에 삼위일체를 부여합니다.
actors.hero.spells.stasis$stasisbuff.desc=현재 성직자는 아군 한 명을 정지 상태로 저장해 두었습니다. 이 아군에게 걸린 모든 긍정적 효과(다수의 힘 포함)는 유지되며, 효과가 끝나면 성직자 옆에 다시 나타납니다. 정지 마법을 다시 시전하면 효과를 조기에 종료할 수도 있습니다. \n\n 정지 상태 아군: %1$s.\n 남은 턴: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=움직일 수 없는 아군이 뒤에 남겨졌습니다.
actors.hero.spells.stasis$stasisbuff.name=정체 상태의 동맹
actors.hero.spells.stasis.desc=성직자는 아군과의 연결을 자신에게 집중시켜 아군을 일시적으로 성직자 내부의 에너지 정지 상태에 가둡니다. 아군은 최대 %d턴 동안 정지 상태로 유지되며, 정지 상태에 있는 동안 아군에게 걸린 모든 긍정적 효과는 영향을 받지 않습니다. 정지 상태가 자연적으로 해제되면 아군은 성직자 옆에 나타나며, 성직자는 비용 없이 즉시 주문을 다시 시전하여 효과를 조기에 종료할 수 있습니다. 정지 상태는 움직일 수 없는 아군을 이동시킬 수도 있지만, 층 사이를 이동시킬 수는 없습니다.
actors.hero.spells.stasis.name=정체
actors.hero.spells.stasis.short_desc=동료를 던전에서 꺼내고 보존합니다.
actors.hero.spells.sunray.desc=성직자가 대상에게 눈부신 빛줄기를 발사하여 %1$d-%2$d의 피해를 입히고 %3$d턴 동안 실명시킵니다. 햇살은 언데드와 악마 대상에게 항상 최대 피해를 줍니다. 이 주문에 맞은 적의 시야는 조정되어 다시는 실명되지 않습니다. 그러나 실명된 상태에서 다시 공격을 받으면 빛이 너무 강렬하여 마비됩니다.
actors.hero.spells.sunray.name=햇살
actors.hero.spells.sunray.short_desc=원거리 마법 피해를 입히고 대상을 한 번 실명시킵니다.
actors.hero.spells.walloflight$lightwall.desc=반짝이는 빛줄기들이 이곳의 통행을 막고 있습니다.
actors.hero.spells.walloflight.desc=팔라딘은 자신 바로 앞에 두께 1칸, 너비 %1$d칸의 빛 패널로 이루어진 벽을 생성합니다. 이 벽은 20턴 동안 지속됩니다. 이 벽은 일반 벽과 동일하게 작동하지만, 투명하게 보입니다. 벽이 생성될 때 벽에 갇힌 적은 잠시 기절하고 가능한 경우 뒤로 밀려납니다. 벽에 갇힌 적은 벽 밖으로 이동할 수 있습니다. 벽은 네 방향(동서남북) 또는 네 방향(대각선) 중 어느 방향으로든 생성할 수 있습니다. 이미 벽이 활성화된 경우, 이 주문을 무료로 다시 사용하여 즉시 벽을 제거할 수 있습니다.
actors.hero.spells.walloflight.early_end=당신은 빛의 장벽을 허물어뜨립니다.
actors.hero.spells.walloflight.name=빛의 벽
actors.hero.spells.walloflight.short_desc=적의 진로를 막는 벽을 생성합니다.
actors.hero.talent$aggressivebarriercooldown.desc=당신은 최근에 이 재능을 사용했으므로, 다시 사용하기 전에 기다려야 합니다. 남은 턴: \n\n %s
actors.hero.talent$aggressivebarriercooldown.name=공격적인 장벽 쿨다운
actors.hero.talent$combinedlethalityabilitytracker.executed=실행
actors.hero.talent$deadlyfollowuptracker.desc=결투사는 최근 투척 무기로 적을 공격했습니다. 같은 대상에 대한 그녀의 근접 공격은 피해량이 증가합니다. 남은 턴:
actors.hero.talent$deadlyfollowuptracker.name=치명적인 후속 조치
actors.hero.talent$followupstriketracker.desc=사냥꾼이 최근 투척 무기로 적을 공격했습니다. 같은 대상에 대한 다음 근접 공격은 피해량이 증가합니다. \n\n남은 턴: %s.
actors.hero.talent$followupstriketracker.name=후속 공격
actors.hero.talent$improvisedprojectilecooldown.desc=당신은 최근에 이 재능을 사용했으므로, 다시 사용하기 전에 기다려야 합니다. 남은 턴: \n\n %s
actors.hero.talent$improvisedprojectilecooldown.name=즉석 발사체 재사용 대기시간
actors.hero.talent$lethalhastecooldown.desc=당신은 최근에 이 재능을 사용했으므로, 다시 사용하기 전에 기다려야 합니다. 남은 턴: \n\n %s
actors.hero.talent$lethalhastecooldown.name=치명적인 가속 재사용 대기시간
actors.hero.talent$lingeringmagictracker.desc=마법사가 최근에 지팡이나 마법봉을 사용했으므로, 다음 물리 공격은 추가 피해를 입힙니다. 남은 턴:
actors.hero.talent$lingeringmagictracker.name=오래도록 남는 마법
actors.hero.talent$liquidagilacctracker.desc=결투사의 다음 일반 근접 공격은 명중률 보너스를 받습니다.\n\n남은 턴: %s.
actors.hero.talent$liquidagilacctracker.name=액체 민첩성
actors.hero.talent$patientstriketracker.desc=결투사는 방금 한 턴 동안 대기했으며, 다음 근접 공격은 추가 피해를 입힙니다.
actors.hero.talent$patientstriketracker.name=환자 파업
actors.hero.talent$preciseassaulttracker.desc=결투사의 다음 일반 근접 공격은 명중률 보너스를 받습니다.\n\n남은 턴: %s.
actors.hero.talent$preciseassaulttracker.name=정확한 공격
actors.hero.talent$provokedangertracker.desc=전사는 최근 보호막을 잃었으므로 다음 물리 공격은 추가 피해를 입힙니다. 남은 턴:
actors.hero.talent$provokedangertracker.name=분노를 유발하다
actors.hero.talent$rejuvenatingstepscooldown.desc=당신은 최근에 이 재능을 사용했으므로, 다시 사용하기 전에 기다려야 합니다. 남은 턴: \n\n %s
actors.hero.talent$rejuvenatingstepscooldown.name=활력 회복 단계 쿨다운
actors.hero.talent$satiatedspellstracker.desc=성직자가 다음에 시전하는 주문은 그들에게 약간의 보호막을 부여할 것입니다.
actors.hero.talent$satiatedspellstracker.name=보호 마법
actors.hero.talent$searinglightcooldown.desc=당신은 최근에 이 재능을 사용했으므로, 다시 사용하기 전에 기다려야 합니다. 남은 턴: \n\n %s
actors.hero.talent$searinglightcooldown.name=타오르는 빛
actors.hero.talent$seershotcooldown.desc=당신은 최근에 이 재능을 사용했으므로, 다시 사용하기 전에 기다려야 합니다. 남은 턴: \n\n %s
actors.hero.talent$seershotcooldown.name=시어 샷 쿨다운
actors.hero.talent$swiftequipcooldown.desc=당신은 최근에 이 재능을 사용했으므로, 다시 사용하기 전에 기다려야 합니다. 남은 턴: \n\n %s
actors.hero.talent$swiftequipcooldown.name=신속 장비 쿨다운
actors.hero.talent.adventurers_intuition.desc=+1: 결투사는 무기를 2.5배 더 빠르게, 갑옷을 1.75배 더 빠르게 식별합니다. +2: 결투사는 무기를 장착할 때 무기를 2.5배 더 빠르게 식별합니다.
actors.hero.talent.adventurers_intuition.title=모험가의 직감
actors.hero.talent.aggressive_barrier.desc=+1: 결투사는 무기 능력을 사용하고 체력이 50% 이하일 때 보호막 3을 얻습니다. +2: 결투사는 무기 능력을 사용하고 체력이 50% 이하일 때 보호막 5를 얻습니다.
actors.hero.talent.aggressive_barrier.meta_desc=만약 이 특성을 다른 영웅이 얻게 된다면, 체력이 낮을 때 근접 공격을 할 때 보호막을 부여하며, 재사용 대기시간은 50턴입니다.
actors.hero.talent.aggressive_barrier.title=공격적인 장벽
actors.hero.talent.ally_warp.desc=+1: 마법사는 2타일 범위 내에서 아군을 선택하여 즉시 위치를 바꿀 수 있습니다. +2: 마법사는 4타일 범위 내에서 아군을 선택하여 즉시 위치를 바꿀 수 있습니다. +3: 마법사는 6타일 범위 내에서 아군을 선택하여 즉시 위치를 바꿀 수 있습니다. 마법사는 움직일 수 없는 아군과는 위치를 바꿀 수 없습니다.
actors.hero.talent.ally_warp.title=동맹 워프
actors.hero.talent.arcane_vision.desc=+1: 마법사가 적에게 마법을 걸면 10턴 동안 적의 정신을 볼 수 있습니다. +2: 마법사가 적에게 마법을 걸면 15턴 동안 적의 정신을 볼 수 있습니다.
actors.hero.talent.arcane_vision.title=신비로운 시야
actors.hero.talent.assassins_reach.desc=+1: 암살자의 순간 이동 범위가 준비 레벨당 1/2/3/4 타일에서 1/3/4/6 타일로 증가합니다. +2: 암살자의 순간 이동 범위가 준비 레벨당 1/2/3/4 타일에서 2/4/6/8 타일로 증가합니다. +3: 암살자의 순간 이동 범위가 준비 레벨당 1/2/3/4 타일에서 2/5/7/10 타일로 증가합니다. 이 순간 이동은 위험 요소와 적을 통과할 수 있지만 벽과 같은 단단한 지형은 통과할 수 없습니다.
actors.hero.talent.assassins_reach.title=암살자의 사정거리
actors.hero.talent.aura_of_protection.desc=+1: 팔라딘은 2칸 사용 횟수를 소모하여 자신과 2칸 이내의 모든 아군에게 20%의 피해 저항과 팔라딘 갑옷 문양의 효과를 50% 증가시키는 마법인 '보호의 오라'를 20턴 동안 시전할 수 있습니다. +2: 팔라딘은 2칸 사용 횟수를 소모하여 자신과 2칸 이내의 모든 아군에게 30%의 피해 저항과 팔라딘 갑옷 문양의 효과를 75% 증가시키는 마법인 '보호의 오라'를 20턴 동안 시전할 수 있습니다. +3: 팔라딘은 2칸 이내의 모든 아군에게 40%의 피해 저항과 팔라딘 갑옷 문양의 효과를 50% 증가시키는 마법인 '보호의 오라'를 시전할 수 있습니다. 20턴 동안 _+100% 위력_을 발휘하며, 사용 횟수 2회를 소모합니다.
actors.hero.talent.aura_of_protection.title=보호의 기운
actors.hero.talent.backup_barrier.desc=+1: 마법사는 지팡이의 마지막 충전량을 소모할 때마다 보호막 3을 얻습니다. +2: 마법사는 지팡이의 마지막 충전량을 소모할 때마다 보호막 5를 얻습니다.
actors.hero.talent.backup_barrier.meta_desc=만약 이 재능을 다른 영웅이 얻게 된다면, 해당 영웅의 최고 레벨 지팡이에서 발동될 것입니다.
actors.hero.talent.backup_barrier.title=백업 장벽
actors.hero.talent.barkskin.desc=+1: 풀밭을 밟을 때, 수호자는 레벨의 0~50%에 해당하는 나무껍질 갑옷을 얻습니다. 이 갑옷은 매 턴마다 사라집니다. +2: 풀밭을 밟을 때, 수호자는 레벨의 0~100%에 해당하는 나무껍질 갑옷을 얻습니다. 이 갑옷은 매 턴마다 사라집니다. +3: 풀밭을 밟을 때, 수호자는 레벨의 0~150%에 해당하는 나무껍질 갑옷을 얻습니다. 이 갑옷은 매 턴마다 사라집니다.
actors.hero.talent.barkskin.title=나무껍질
actors.hero.talent.beaming_ray.desc=성직자는 강화된 아군에게 _빔 레이_를 1회 사용 횟수를 소모하여 시전할 수 있습니다. 이 광선은 벽을 통과하며 아군을 지정된 위치로 순간 이동시킵니다. 지정된 위치에 적이 있다면, 아군은 적 옆에 나타나 적을 공격합니다. 빔 레이는 일반적으로 움직일 수 없는 아군도 순간 이동시킬 수 있지만, 이 경우 사거리가 절반으로 줄어듭니다. \n\n_+1: 빔 레이의 최대 사거리는 4타일이며, 가장 가까운 적에게 10턴 동안 파워 오브 매니의 추가 피해를 35% 증가시킵니다. \n\n_+2: 빔 레이의 최대 사거리는 8타일이며, 가장 가까운 적에게 10턴 동안 파워 오브 매니의 추가 피해를 40% 증가시킵니다. \n\n_+3: 빔 레이의 최대 사거리는 12타일이며, 가장 가까운 적에게 10턴 동안 파워 오브 매니의 추가 피해를 45% 증가시킵니다. \n\n_+4: 빔 레이의 최대 사거리는 16타일입니다. 타일을 추가하고, 10턴 동안 가장 가까운 적에게 +50%의 추가 피해를 주는 '다수의 힘' 보너스를 증가시킵니다.
actors.hero.talent.beaming_ray.title=빛나는 광선
actors.hero.talent.blast_radius.desc=_+1:_ 원소 폭발의 반경이 4에서 _5타일_로 증가합니다.\n\n_+2:_ 원소 폭발의 반경이 4에서 _6타일_로 증가합니다.\n\n_+3:_ 원소 폭발의 반경이 4에서 _7타일_로 증가합니다.\n\n_+4:_ 원소 폭발의 반경이 4에서 _8타일_로 증가합니다.
actors.hero.talent.blast_radius.title=폭발 반경
actors.hero.talent.bless.desc=+1: 성직자는 자신에게 시전 시 6턴 동안 축복과 10의 보호막을 부여하거나, 다른 캐릭터에게 시전 시 10턴 동안 축복과 10의 치유를 부여하는 주문인 '축복'을 1회 사용 횟수를 소모하여 시전할 수 있습니다. +2: 성직자는 자신에게 시전 시 10턴 동안 축복과 15의 보호막을 부여하거나, 다른 캐릭터에게 시전 시 15턴 동안 축복과 15의 치유를 부여하는 주문인 '축복'을 1회 사용 횟수를 소모하여 시전할 수 있습니다. 이 주문으로 인한 초과 치유량은 보호막으로 전환됩니다.
actors.hero.talent.bless.meta_desc=만약 이 특성을 다른 영웅이 획득한다면, 해당 영웅과 모든 아군의 명중률과 회피율을 +1 레벨에서 3%, +2 레벨에서 5% 증가시킵니다.
actors.hero.talent.bless.title=신을 하다
actors.hero.talent.body_form.desc=성직자는 2회 사용 횟수를 소모하여 트리니티에게 자신이 이번 플레이에서 확인한 마법이나 문양의 힘을 부여하는 _몸체 형상_을 시전할 수 있습니다.\n\n_+1: 트리니티 사용 시, 성직자는 선택한 효과를 _20턴_ 동안 얻습니다.\n\n_+2: 트리니티 사용 시, 성직자는 선택한 효과를 _27턴_ 동안 얻습니다._\n\n_+3: 트리니티 사용 시, 성직자는 선택한 효과를 _33턴_ 동안 얻습니다._\n\n_+4: 트리니티 사용 시, 성직자는 선택한 효과를 _40턴_ 동안 얻습니다._\n\n 트리니티는 오직 한 번에 하나의 신체 효과만 부여받을 수 있습니다. 선택한 문양이 희귀하고 강력할수록 트리니티의 갑옷 충전 비용이 더 높아집니다.
actors.hero.talent.body_form.title=신체 형태
actors.hero.talent.body_replacement.desc=+1: 순간이동 후, 도적은 체력 20, 방어력 1~3의 나무 미끼를 남깁니다. +2: 순간이동 후, 도적은 체력 40, 방어력 2~6의 나무 미끼를 남깁니다. +3: 순간이동 후, 도적은 체력 60, 방어력 3~9의 나무 미끼를 남깁니다. +4: 순간이동 후, 도적은 체력 80, 방어력 4~12의 나무 미끼를 남깁니다. 한 번에 하나의 미끼만 활성화할 수 있습니다.
actors.hero.talent.body_replacement.title=신체 교체
actors.hero.talent.body_slam.desc=+1: 전사가 점프 후 착지할 때, 인접한 모든 적에게 전사의 피해 방어력의 25%에 _1-4_를 더한 피해를 입힙니다. +2: 전사가 점프 후 착지할 때, 인접한 모든 적에게 전사의 피해 방어력의 50%에 _2-8_을 더한 피해를 입힙니다. +3: 전사가 점프 후 착지할 때, 인접한 모든 적에게 전사의 피해 방어력의 75%에 _3-12_을 더한 피해를 입힙니다. +4: 전사가 점프 후 착지할 때, 인접한 모든 적에게 전사의 피해 방어력의 100%에 _4-16_을 더한 피해를 입힙니다.
actors.hero.talent.body_slam.title=바디 슬램
actors.hero.talent.bounty_hunter.desc=+1: 암살자가 준비된 공격으로 적을 처치할 때, 준비 레벨당 아이템 드롭 확률이 2/4/8/16%씩 증가합니다. +2: 암살자가 준비된 공격으로 적을 처치할 때, 준비 레벨당 아이템 드롭 확률이 4/8/16/32%씩 증가합니다. +3: 암살자가 준비된 공격으로 적을 처치할 때, 준비 레벨당 아이템 드롭 확률이 6/12/24/48%씩 증가합니다.
actors.hero.talent.bounty_hunter.title=현상금 사냥꾼
actors.hero.talent.cached_rations.desc=+1: 도적은 던전의 다음 몇 층을 탐험하는 동안 상자에서 _보급품 2개_를 찾을 수 있습니다. +2: 도적은 던전의 다음 몇 층을 탐험하는 동안 상자에서 _보급품 3개_를 찾을 수 있습니다. 보급품은 빠르게 섭취할 수 있으며, 적당한 포만감을 회복하고, 체력 5를 회복하며, 그림자 망토의 충전량을 1만큼 회복시켜 줍니다.
actors.hero.talent.cached_rations.title=저장된 식량
actors.hero.talent.cleanse.desc=+1: 성직자는 2회 사용 횟수를 소모하여 자신과 주변 아군에게 부정적인 상태 효과를 제거하고 10의 보호막을 부여하는 주문인 '정화'를 시전할 수 있습니다. +2: 성직자는 2회 사용 횟수를 소모하여 자신과 주변 아군에게 3턴 동안 부정적인 상태 효과에 대한 면역을 부여하고 20의 보호막을 부여하는 주문인 '정화'를 시전할 수 있습니다. +3: 성직자는 2회 사용 횟수를 소모하여 자신과 주변 아군에게 5턴 동안 부정적인 상태 효과에 대한 면역을 부여하고 30의 보호막을 부여하는 주문인 '정화'를 시전할 수 있습니다.
actors.hero.talent.cleanse.meta_desc=만약 이 특성을 다른 영웅이 얻게 된다면, 지팡이나 유물을 사용한 후 해당 영웅에게 걸린 부정적인 상태 효과를 10/20/30% 확률로 +1/+2/+3만큼 제거합니다.
actors.hero.talent.cleanse.title=고치다
actors.hero.talent.cleave.desc=_+1:_ 검투사가 적을 처치했을 때 얻는 추가 시간이 15에서 _30턴_으로 증가합니다.\n\n_+2:_ 검투사가 적을 처치했을 때 얻는 추가 시간이 15에서 _45턴_으로 증가합니다.\n\n_+3:_ 검투사가 적을 처치했을 때 얻는 추가 시간이 15에서 _60턴_으로 증가합니다.
actors.hero.talent.cleave.title=쪼개다
actors.hero.talent.cloned_armor.desc=+1: 그림자 복제본은 영웅 방어력의 12%를 얻고, 영웅의 갑옷에 있는 문양을 사용할 확률이 25%입니다. +2: 그림자 복제본은 영웅 방어력의 24%를 얻고, 영웅의 갑옷에 있는 문양을 사용할 확률이 50%입니다. +3: 그림자 복제본은 영웅 방어력의 36%를 얻고, 영웅의 갑옷에 있는 문양을 사용할 확률이 75%입니다. +4: 그림자 복제본은 영웅 방어력의 48%를 얻고, 영웅의 갑옷에 있는 문양을 사용할 확률이 100%입니다.
actors.hero.talent.cloned_armor.title=복제된 갑옷
actors.hero.talent.close_the_gap.desc=+1: 결투사는 결투를 시작할 때 목표물을 향해 최대 두 칸까지 순간이동합니다. +2: 결투사는 결투를 시작할 때 목표물을 향해 최대 세 칸까지 순간이동합니다. +3: 결투사는 결투를 시작할 때 목표물을 향해 최대 네 칸까지 순간이동합니다. +4: 결투사는 결투를 시작할 때 목표물을 향해 최대 다섯 칸까지 순간이동합니다. 이 순간이동은 장애물과 적을 통과할 수 있지만 벽과 같은 단단한 지형은 통과할 수 없습니다. 순간이동은 적이 결투 대상 범위 내에 있는지 판단할 때 고려됩니다.
actors.hero.talent.close_the_gap.title=격차를 좁히다
actors.hero.talent.combined_energy.desc=+1: 수도사가 5턴 이내에 무기 능력과 4 이상의 에너지를 소모하는 능력을 사용하면 소모한 에너지를 1 회복합니다. +2: 수도사가 5턴 이내에 무기 능력과 3 이상의 에너지를 소모하는 능력을 사용하면 소모한 에너지를 1 회복합니다. +3: 수도사가 5턴 이내에 무기 능력과 2 이상의 에너지를 소모하는 능력을 사용하면 소모한 에너지를 1 회복합니다.
actors.hero.talent.combined_energy.title=결합 에너지
actors.hero.talent.combined_lethality.desc=+1: 챔피언이 다른 무기의 능력을 사용한 직후 근접 무기로 공격하면, 체력이 13% 미만인 일반 적은 모두 즉사합니다. +2: 챔피언이 다른 무기의 능력을 사용한 직후 근접 무기로 공격하면, 체력이 27% 미만인 일반 적은 모두 즉사합니다. +3: 챔피언이 다른 무기의 능력을 사용한 직후 근접 무기로 공격하면, 체력이 40% 미만인 일반 적은 모두 즉사합니다. 이 공격은 일반 근접 무기 공격일 수도 있고, 무기 능력의 일부일 수도 있습니다.
actors.hero.talent.combined_lethality.title=결합 치사율
actors.hero.talent.conserved_magic.desc=+1: 야생 마법의 각 공격은 이제 0.5 대신 0.33의 충전량을 소모하며, 야생 마법이 턴을 소모하지 않을 확률이 25%입니다. +2: 야생 마법의 각 공격은 이제 0.5 대신 0.225의 충전량을 소모하며, 야생 마법이 턴을 소모하지 않을 확률이 50%입니다. +3: 야생 마법의 각 공격은 이제 0.5 대신 0.15의 충전량을 소모하며, 야생 마법이 턴을 소모하지 않을 확률이 75%입니다. +4: 야생 마법의 각 공격은 이제 0.5 대신 0.1의 충전량을 소모하며, 야생 마법이 턴을 소모하지 않을 확률이 100%입니다.
actors.hero.talent.conserved_magic.title=보존된 마법
actors.hero.talent.counter_ability.desc=+1: 결투사가 자신의 잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 즉시 0.38 충전량을 회복합니다. +2: 결투사가 자신의 잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 즉시 0.77 충전량을 회복합니다. +3: 결투사가 자신의 잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 즉시 1.13 충전량을 회복합니다. +4: 결투사가 자신의 잔상이 공격받은 후 3턴 이내에 무기 능력을 사용하면 즉시 1.5 충전량을 회복합니다.
actors.hero.talent.counter_ability.title=카운터 능력
actors.hero.talent.deadly_followup.desc=+1: 결투사가 투척 무기로 적을 명중시키면 5턴 동안 적에게 10% 추가 근접 피해를 입힙니다. +2: 결투사가 투척 무기로 적을 명중시키면 5턴 동안 20% 추가 근접 피해를 입힙니다. +3: 결투사가 투척 무기로 적을 명중시키면 5턴 동안 30% 추가 근접 피해를 입힙니다.
actors.hero.talent.deadly_followup.title=치명적인 후속 조치
actors.hero.talent.deathless_fury.desc=+1: 광폭화가 자동으로 발동됩니다. 광폭화 상태의 영웅이 죽기 직전이고 분노 게이지가 100% 이상일 경우 발동되지만, 재사용 대기시간은 영웅 레벨 3입니다. +2: 광폭화가 자동으로 발동됩니다. 광폭화 상태의 영웅이 죽기 직전이고 분노 게이지가 100% 이상일 경우 발동되지만, 재사용 대기시간은 영웅 레벨 2입니다. +3: 광폭화가 자동으로 발동됩니다. 광폭화 상태의 영웅이 죽기 직전이고 분노 게이지가 100% 이상일 경우 발동되지만, 재사용 대기시간은 영웅 레벨 1입니다. 참고로, 광폭화가 끝날 때 영웅의 체력이 0이면 사망합니다.
actors.hero.talent.deathless_fury.title=불멸의 분노
actors.hero.talent.deathly_durability.desc=+1: 죽음의 표식으로 처치된 적은 표식이 찍혔을 당시 체력의 13%에 해당하는 보호막을 도적에게 부여합니다. +2: 죽음의 표식으로 처치된 적은 표식이 찍혔을 당시 체력의 25%에 해당하는 보호막을 도적에게 부여합니다. +3: 죽음의 표식으로 처치된 적은 표식이 찍혔을 당시 체력의 38%에 해당하는 보호막을 도적에게 부여합니다. +4: 죽음의 표식으로 처치된 적은 표식이 찍혔을 당시 체력의 50%에 해당하는 보호막을 도적에게 부여합니다.
actors.hero.talent.deathly_durability.title=치명적인 내구성
actors.hero.talent.desperate_power.desc=+1: 마법사의 지팡이와 막대기는 마지막 충전량만 남았을 때 마지막 공격 시 레벨이 +1 증가합니다. +2: 마법사의 지팡이와 막대기는 마지막 충전량만 남았을 때 마지막 공격 시 레벨이 +2 증가합니다. +3: 마법사의 지팡이와 막대기는 마지막 충전량만 남았을 때 마지막 공격 시 레벨이 +3 증가합니다.
actors.hero.talent.desperate_power.title=절망적인 힘
actors.hero.talent.directed_power.desc=+1: 원소 공격의 직접 공격력은 공격 대상을 포함하여 원소 공격 효과 범위 내에 있는 적 하나당 +30%의 마법 부여 위력을 얻습니다. +2: 원소 공격의 직접 공격력은 공격 대상을 포함하여 원소 공격 효과 범위 내에 있는 적 하나당 +60%의 마법 부여 위력을 얻습니다. +3: 원소 공격의 직접 공격력은 공격 대상을 포함하여 원소 공격 효과 범위 내에 있는 적 하나당 +90%의 마법 부여 위력을 얻습니다. +4: 원소 공격의 직접 공격력은 공격 대상을 포함하여 원소 공격 효과 범위 내에 있는 적 하나당 +120%의 마법 부여 위력을 얻습니다.
actors.hero.talent.directed_power.title=지향성 전력
actors.hero.talent.divine_intervention.desc=+1: 승천 형태일 때, 성직자는 '신성한 개입'을 시전할 수 있습니다. 이 주문은 성직자와 모든 아군에게 최대 150의 보호막을 부여하고 승천 형태를 3턴 연장합니다. +2: 승천 형태일 때, 성직자는 '신성한 개입'을 시전할 수 있습니다. 이 주문은 성직자와 모든 아군에게 최대 200의 보호막을 부여하고 승천 형태를 4턴 연장합니다. +3: 승천 형태일 때, 성직자는 '신성한 개입'을 시전할 수 있습니다. 이 주문은 성직자와 모든 아군에게 최대 250의 보호막을 부여하고 승천 형태를 5턴 연장합니다. +4: 승천 형태일 때, 성직자는 _신성한 개입_은 성직자와 모든 아군에게 최대 _300의 보호막_을 부여하고 승천 형태 지속 시간을 _6턴_ 연장합니다. 하지만 _신성한 개입_은 무려 5개의 마법서 사용 횟수를 소모하며, 동일한 승천 형태에서는 한 번만 사용할 수 있습니다.
actors.hero.talent.divine_intervention.title=신의 개입
actors.hero.talent.divine_sense.desc=+1: 성직자는 2회 사용 횟수를 소모하여 50턴 동안 8칸의 정신 시야를 부여하는 주문인 '신성한 감각'을 시전할 수 있습니다. 이 주문은 시전 시간이 없으며, 시전에는 시간이 걸리지 않습니다. +2: 성직자는 2회 사용 횟수를 소모하여 50턴 동안 12칸의 정신 시야를 부여하는 주문인 '신성한 감각'을 시전할 수 있습니다. 이 주문은 시전 시간이 없으며, 시전에는 시간이 걸리지 않습니다.
actors.hero.talent.divine_sense.meta_desc=만약 이 특성을 다른 영웅이 얻게 된다면, 지팡이나 유물을 사용한 후 짧은 순간 동안 정신 시야를 부여받게 되며, 범위는 +1 보너스를 받으면 3타일, +2 보너스를 받으면 5타일입니다.
actors.hero.talent.divine_sense.title=신성한 감각
actors.hero.talent.double_jump.desc=+1: 전사가 3턴 이내에 두 번째 도약을 하면, 해당 도약의 충전 비용이 16% 감소합니다. +2: 전사가 3턴 이내에 두 번째 도약을 하면, 해당 도약의 충전 비용이 30% 감소합니다. +3: 전사가 3턴 이내에 두 번째 도약을 하면, 해당 도약의 충전 비용이 40% 감소합니다. +4: 전사가 3턴 이내에 두 번째 도약을 하면, 해당 도약의 충전 비용이 50% 감소합니다.
actors.hero.talent.double_jump.title=이중 점프
actors.hero.talent.double_mark.desc=+1: 첫 번째 목표물과 동시에 두 번째 목표물을 표시하면 비용이 30% 감소합니다. +2: 첫 번째 목표물과 동시에 두 번째 목표물을 표시하면 비용이 50% 감소합니다. +3: 첫 번째 목표물과 동시에 두 번째 목표물을 표시하면 비용이 65% 감소합니다. +4: 첫 번째 목표물과 동시에 두 번째 목표물을 표시하면 비용이 75% 감소합니다.
actors.hero.talent.double_mark.title=이중 표시
actors.hero.talent.durable_projectiles.desc=+1: 사냥꾼이 투척 무기를 사용하면 내구도가 50% 증가합니다. +2: 사냥꾼이 투척 무기를 사용하면 내구도가 75% 증가합니다.
actors.hero.talent.durable_projectiles.title=내구성이 뛰어난 발사체
actors.hero.talent.durable_tips.desc=+1: 워든이 뾰족한 다트를 사용하면 내구도가 2배 증가합니다. +2: 워든이 뾰족한 다트를 사용하면 내구도가 3배 증가합니다. +3: 워든이 뾰족한 다트를 사용하면 내구도가 4배 증가합니다.
actors.hero.talent.durable_tips.title=내구성이 뛰어난 팁
actors.hero.talent.eagle_eye.desc=+1: 영혼 매의 시야 범위가 6타일에서 7타일로 증가합니다. +2: 영혼 매의 시야 범위가 6타일에서 8타일로 증가합니다. +3: 영혼 매의 시야 범위가 6타일에서 9타일로 증가하고, 정신 시야가 2타일 추가됩니다. +4: 영혼 매의 시야 범위가 6타일에서 10타일로 증가하고, 정신 시야가 3타일 추가됩니다.
actors.hero.talent.eagle_eye.title=독수리의 눈
actors.hero.talent.elemental_power.desc=+1: 원소 폭발의 위력이 25% 증가합니다. +2: 원소 폭발의 위력이 50% 증가합니다. +3: 원소 폭발의 위력이 75% 증가합니다. +4: 원소 폭발의 위력이 100% 증가합니다.
actors.hero.talent.elemental_power.title=원소의 힘
actors.hero.talent.elemental_reach.desc=+1: 원소 공격의 범위가 4타일에서 5타일로, 폭이 65도에서 75도로 증가합니다. +2: 원소 공격의 범위가 4타일에서 6타일로, 폭이 65도에서 85도로 증가합니다. +3: 원소 공격의 범위가 4타일에서 7타일로, 폭이 65도에서 95도로 증가합니다. +4: 원소 공격의 범위가 4타일에서 8타일로, 폭이 65도에서 105도로 증가합니다.
actors.hero.talent.elemental_reach.title=원소의 도달 범위
actors.hero.talent.elimination_match.desc=+1: 결투 종료 후 3턴 이내에 결투사가 다시 도전하면, 해당 도전의 충전 비용이 16% 감소합니다. +2: 결투 종료 후 3턴 이내에 결투사가 다시 도전하면, 해당 도전의 충전 비용이 30% 감소합니다. +3: 결투 종료 후 3턴 이내에 결투사가 다시 도전하면, 해당 도전의 충전 비용이 40% 감소합니다. +4: 결투 종료 후 3턴 이내에 결투사가 다시 도전하면, 해당 도전의 충전 비용이 50% 감소합니다.
actors.hero.talent.elimination_match.title=탈락전
actors.hero.talent.empowered_strike.desc=+1: 전투 마법사가 지팡이로 마법을 시전한 후 첫 근접 공격 시 _+16%의 피해를 입히고_ 지팡이의 추가 효과가 _+50%의 위력을 얻습니다_. +2: 전투 마법사가 지팡이로 마법을 시전한 후 첫 근접 공격 시 _+33%의 피해를 입히고_ 지팡이의 추가 효과가 _+100%의 위력을 얻습니다_. +3: 전투 마법사가 지팡이로 마법을 시전한 후 첫 근접 공격 시 _+50%의 피해를 입히고_ 지팡이의 추가 효과가 _+150%의 위력을 얻습니다_.
actors.hero.talent.empowered_strike.title=권한 부여된 파업
actors.hero.talent.empowering_meal.desc=_+1:_ 음식을 먹으면 마법사가 지팡이로 공격하는 다음 3번의 공격에 _2의 추가 피해_를 얻습니다.\n\n_+2:_ 음식을 먹으면 마법사가 지팡이로 공격하는 다음 3번의 공격에 _3의 추가 피해_를 얻습니다.
actors.hero.talent.empowering_meal.title=힘을 주는 식사
actors.hero.talent.endless_rage.desc=+1: 광전사는 최대 116%의 분노에 도달할 수 있습니다. +2: 광전사는 최대 133%의 분노에 도달할 수 있습니다. +3: 광전사는 최대 150%의 분노에 도달할 수 있습니다. 분노가 100%를 초과할 때마다 광전 보호막이 1%씩 증가하고 재사용 대기시간이 1%씩 감소하지만, 피해 보너스는 +50%를 초과하여 증가하지 않습니다.
actors.hero.talent.endless_rage.title=끝없는 분노
actors.hero.talent.energizing_meal.desc=+1: 마법사가 음식을 먹으면 1턴이 소모되고 지팡이를 5턴 동안 재충전할 수 있습니다. +2: 마법사가 음식을 먹으면 1턴이 소모되고 지팡이를 8턴 동안 재충전할 수 있습니다.
actors.hero.talent.energizing_meal.title=활력을 주는 식사
actors.hero.talent.enhanced_combo.desc=+1: 검투사의 콤보가 7 이상이면 클로버의 넉백 범위가 3으로 증가하고, 현기증을 유발하며, 적을 함정으로 밀어 넣을 수 있습니다. +2: +1의 효과에 더해, 검투사의 콤보가 9 이상이면 패리가 여러 공격에 적용됩니다. +3: +1과 +2의 효과에 더해, 슬램, 크러시 또는 퓨리를 사용할 때 최대 콤보/3 칸까지 도약할 수 있습니다.
actors.hero.talent.enhanced_combo.title=강화된 콤보
actors.hero.talent.enhanced_lethality.desc=+1: 암살자는 준비 레벨당 적의 체력이 4/13/27/67% 미만으로 남았을 때 암살할 수 있는 횟수가 증가합니다(기존 3/10/20/50%에서 증가). +2: 암살자는 준비 레벨당 적의 체력이 5/17/33/83% 미만으로 남았을 때 암살할 수 있는 횟수가 증가합니다(기존 3/10/20/50%에서 증가). +3: 암살자는 준비 레벨당 적의 체력이 6/20/40/100% 미만으로 남았을 때 암살할 수 있는 횟수가 증가합니다(기존 3/10/20/50%에서 증가).
actors.hero.talent.enhanced_lethality.title=향상된 치사율
actors.hero.talent.enhanced_rings.desc=+1: 도적이 유물을 사용할 때, 그의 반지는 3턴 동안 +1 강화됩니다. +2: 도적이 유물을 사용할 때, 그의 반지는 6턴 동안 +1 강화됩니다. +3: 도적이 유물을 사용할 때, 그의 반지는 9턴 동안 +1 강화됩니다.
actors.hero.talent.enhanced_rings.title=강화된 링
actors.hero.talent.enlightening_meal.desc=+1: 음식을 먹으면 성직자는 1턴을 소모하고 성서에 0.67회 사용 횟수를 얻습니다. +2: 음식을 먹으면 성직자는 1턴을 소모하고 성서에 1회 사용 횟수를 얻습니다.
actors.hero.talent.enlightening_meal.meta_desc=이 특성을 다른 영웅이 획득할 경우, 지팡이와 유물의 재충전 속도가 +1로 2턴 증가하거나 +2로 3턴 증가합니다. 이 특성은 풍요의 뿔 자체의 재충전에는 사용할 수 없습니다.
actors.hero.talent.enlightening_meal.title=깨달음을 주는 식사
actors.hero.talent.enraged_catalyst.desc=+1: 광전사의 무기에 걸린 마법과 저주는 분노가 높을수록 발동 빈도가 증가하며, 분노 100%일 때 최대 15%까지 증가합니다. +2: 광전사의 무기에 걸린 마법과 저주는 분노가 높을수록 발동 빈도가 증가하며, 분노 100%일 때 최대 30%까지 증가합니다. +3: 광전사의 무기에 걸린 마법과 저주는 분노가 높을수록 발동 빈도가 증가하며, 분노 100%일 때 최대 45%까지 증가합니다.
actors.hero.talent.enraged_catalyst.title=격노한 촉매
actors.hero.talent.evasive_armor.desc=_+1:_ 프리런 동안 프리러너는 갑옷의 힘이 1점 초과될 때마다 추가로 _+1 회피_를 얻습니다.\n\n_+2:_ 프리런 동안 프리러너는 갑옷의 힘이 1점 초과될 때마다 추가로 _+2 회피_를 얻습니다.\n\n_+3:_ 프리런 동안 프리러너는 갑옷의 힘이 1점 초과될 때마다 추가로 _+3 회피_를 얻습니다.
actors.hero.talent.evasive_armor.title=회피 갑옷
actors.hero.talent.even_the_odds.desc=+1: 전사는 버티기 종료 시 2칸 이내의 적 하나당 추가로 5%의 보너스 피해를 입힙니다. +2: 전사는 버티기 종료 시 2칸 이내의 적 하나당 추가로 10%의 보너스 피해를 입힙니다. +3: 전사는 버티기 종료 시 2칸 이내의 적 하나당 추가로 15%의 보너스 피해를 입힙니다. +4: 전사는 버티기 종료 시 2칸 이내의 적 하나당 추가로 20%의 보너스 피해를 입힙니다.
actors.hero.talent.even_the_odds.title=확률을 균등하게
actors.hero.talent.excess_charge.desc=+1: 전투 마법사의 지팡이가 완전히 충전되면, 다음 공격 시 지팡이 레벨당 0.67의 보호막을 얻습니다. +2: 전투 마법사의 지팡이가 완전히 충전되면, 다음 공격 시 지팡이 레벨당 1.33의 보호막을 얻습니다. +3: 전투 마법사의 지팡이가 완전히 충전되면, 다음 공격 시 지팡이 레벨당 2의 보호막을 얻습니다.
actors.hero.talent.excess_charge.title=초과 요금
actors.hero.talent.expanding_wave.desc=+1: 쇼크웨이브의 범위가 5타일에서 6타일로, 폭이 60도에서 75도로 증가합니다. +2: 쇼크웨이브의 범위가 5타일에서 7타일로, 폭이 60도에서 90도로 증가합니다. +3: 쇼크웨이브의 범위가 5타일에서 8타일로, 폭이 60도에서 105도로 증가합니다. +4: 쇼크웨이브의 범위가 5타일에서 9타일로, 폭이 60도에서 120도로 증가합니다.
actors.hero.talent.expanding_wave.title=확장하는 파동
actors.hero.talent.expose_weakness.desc=+1: 결투사의 잔상을 공격하는 적은 2턴 동안 약화되고 취약해집니다. +2: 결투사의 잔상을 공격하는 적은 4턴 동안 약화되고 취약해집니다. +3: 결투사의 잔상을 공격하는 적은 6턴 동안 약화되고 취약해집니다. +4: 결투사의 잔상을 공격하는 적은 8턴 동안 약화되고 취약해집니다.
actors.hero.talent.expose_weakness.title=약점을 드러내다
actors.hero.talent.fan_of_blades.desc=+1: 스펙트럴 블레이드는 최대 1개의 추가 대상에게 50%의 피해를 입힐 수 있습니다. 대상은 시야에 있어야 하며 30도 원뿔형 범위 내에 있어야 합니다. +2: 스펙트럴 블레이드는 최대 2개의 추가 대상에게 50%의 피해를 입힐 수 있습니다. 대상은 시야에 있어야 하며 60도 원뿔형 범위 내에 있어야 합니다. +3: 스펙트럴 블레이드는 최대 3개의 추가 대상에게 50%의 피해를 입힐 수 있습니다. 대상은 시야에 있어야 하며 90도 원뿔형 범위 내에 있어야 합니다. +4: 스펙트럴 블레이드는 최대 4개의 추가 대상에게 50%의 피해를 입힐 수 있습니다. 대상은 시야에 있어야 하며 120도 원뿔형 범위 내에 있어야 합니다.
actors.hero.talent.fan_of_blades.title=날개 팬
actors.hero.talent.farsight.desc=+1: 저격수의 시야 범위가 25% 증가합니다. +2: 저격수의 시야 범위가 50% 증가합니다. +3: 저격수의 시야 범위가 75% 증가합니다.
actors.hero.talent.farsight.title=원거리 시력
actors.hero.talent.fear_the_reaper.desc=+1: 죽음 표시가 된 적이 체력이 0이 되면, 불구 상태가 됩니다. +2: 죽음 표시가 된 적이 체력이 0이 되면, 공포에 질리고 불구 상태가 됩니다. +3: 죽음 표시가 된 적이 체력이 0이 되면, 공포에 질리고 불구 상태가 되며, 주변 3칸 이내의 적들도 불구 상태가 됩니다. +4: 죽음 표시가 된 적이 체력이 0이 되면, 공포에 질리고 불구 상태가 되며, 주변 3칸 이내의 적들도 공포에 질리고 불구 상태가 됩니다.
actors.hero.talent.fear_the_reaper.title=죽음의 신을 두려워하라
actors.hero.talent.feigned_retreat.desc=+1: 적이 결투가의 잔상을 공격하면 결투가는 2턴 동안 신속 효과를 얻습니다. +2: 적이 결투가의 잔상을 공격하면 결투가는 4턴 동안 신속 효과를 얻습니다. +3: 적이 결투가의 잔상을 공격하면 결투가는 6턴 동안 신속 효과를 얻습니다. +4: 적이 결투가의 잔상을 공격하면 결투가는 8턴 동안 신속 효과를 얻습니다.
actors.hero.talent.feigned_retreat.title=가장된 후퇴
actors.hero.talent.fire_everything.desc=+1: 야생 마법 발동 횟수가 4회에서 5회로 증가했으며, 각 지팡이는 25% 확률로 3회 사용할 수 있습니다. +2: 야생 마법 발동 횟수가 4회에서 6회로 증가했으며, 각 지팡이는 50% 확률로 3회 사용할 수 있습니다. +3: 야생 마법 발동 횟수가 4회에서 7회로 증가했으며, 각 지팡이는 75% 확률로 3회 사용할 수 있습니다. +4: 야생 마법 발동 횟수가 4회에서 8회로 증가했으며, 각 지팡이는 100% 확률로 3회 사용할 수 있습니다.
actors.hero.talent.fire_everything.title=모든 것을 불태워버리세요
actors.hero.talent.flash.desc=+1: 승천 형태일 때, 성직자는 _플래시_를 시전하여 최대 _3타일_ 떨어진 곳으로 순간이동할 수 있습니다. +2: 승천 형태일 때, 성직자는 _플래시_를 시전하여 최대 _4타일_ 떨어진 곳으로 순간이동할 수 있습니다. +3: 승천 형태일 때, 성직자는 _플래시_를 시전하여 최대 _5타일_ 떨어진 곳으로 순간이동할 수 있습니다. +4: 승천 형태일 때, 성직자는 _플래시_를 시전하여 최대 _6타일_ 떨어진 곳으로 순간이동할 수 있습니다. _플래시_는 처음 사용할 때 마법서 충전량 2개를 소모하며, 같은 승천 형태에서 사용할 때마다 충전량 1개를 추가로 소모합니다.
actors.hero.talent.flash.title=플래시
actors.hero.talent.focused_meal.desc=+1: 음식을 먹으면 결투사는 1턴을 소모하고 무기에 0.67의 충전량을 얻습니다. +2: 음식을 먹으면 결투사는 1턴을 소모하고 무기에 1의 충전량을 얻습니다.
actors.hero.talent.focused_meal.meta_desc=만약 이 특성을 다른 영웅이 얻게 되면, 다음 공격에 해당 영웅의 레벨/3에 해당하는 추가 피해량(+1) 또는 레벨/2에 해당하는 추가 피해량(+2)을 부여합니다.
actors.hero.talent.focused_meal.title=집중적인 식사
actors.hero.talent.followup_strike.desc=_+1:_ 사냥꾼이 활이나 투척 무기로 적을 명중시키면, 그 적에 대한 다음 근접 공격에 _2의 추가 피해_를 입힙니다.\n\n_+2:_ 사냥꾼이 활이나 투척 무기로 적을 명중시키면, 그 적에 대한 다음 근접 공격에 _3의 추가 피해_를 입힙니다.
actors.hero.talent.followup_strike.title=후속 공격
actors.hero.talent.go_for_the_eyes.desc=+1: 영혼 매의 공격은 적을 2턴 동안 실명시킵니다. +2: 영혼 매의 공격은 적을 5턴 동안 실명시킵니다. +3: 영혼 매의 공격은 적을 5턴 동안 실명시키고 2턴 동안 무력화시킵니다. +4: 영혼 매의 공격은 적을 5턴 동안 실명시키고 5턴 동안 무력화시킵니다.
actors.hero.talent.go_for_the_eyes.title=눈을 노리세요
actors.hero.talent.growing_power.desc=+1: 자연의 힘으로 인한 공격력 및 이동 속도 증가 효과가 33% 및 100%에서 38% 및 125%로 증가합니다. +2: 자연의 힘으로 인한 공격력 및 이동 속도 증가 효과가 33% 및 100%에서 42% 및 150%로 증가합니다. +3: 자연의 힘으로 인한 공격력 및 이동 속도 증가 효과가 33% 및 100%에서 46% 및 175%로 증가합니다. +4: 자연의 힘으로 인한 공격력 및 이동 속도 증가 효과가 33% 및 100%에서 50% 및 200%로 증가합니다.
actors.hero.talent.growing_power.title=성장하는 힘
actors.hero.talent.hallowed_ground.desc=+1: 사제는 2회 사용 횟수를 소모하여 3x3 영역의 지형을 20턴 동안 신성하게 만드는 주문인 '성스러운 땅'을 시전할 수 있습니다. +2: 사제는 2회 사용 횟수를 소모하여 5x5 영역의 지형을 20턴 동안 신성하게 만드는 주문인 '성스러운 땅'을 시전할 수 있습니다. +3: 사제는 2회 사용 횟수를 소모하여 7x7 영역의 지형을 20턴 동안 신성하게 만드는 주문인 '성스러운 땅'을 시전할 수 있습니다. '성스러운 땅'이 시전되면 아군의 체력을 15 회복시키고, 적을 잠시 속박하며, 짧은 풀을 뿌립니다. 그 후, 신성한 땅은 아군을 천천히 치유하고 적을 무력화시키며, 무작위로 키 큰 풀을 자라게 합니다. 신성한 땅은 치유 대신 사제에게 보호막을 부여하며, 불에 의해 파괴됩니다.
actors.hero.talent.hallowed_ground.title=신성한 땅
actors.hero.talent.hasty_retreat.desc=+1: 순간이동 후 도적은 1턴 동안 가속과 투명화를 얻습니다. +2: 순간이동 후 도적은 2턴 동안 가속과 투명화를 얻습니다. +3: 순간이동 후 도적은 3턴 동안 가속과 투명화를 얻습니다. +4: 순간이동 후 도적은 4턴 동안 가속과 투명화를 얻습니다.
actors.hero.talent.hasty_retreat.title=급히 후퇴하다
actors.hero.talent.hearty_meal.desc=+1: 전사의 체력이 33% 이하일 때 음식을 먹으면 4 HP를 회복합니다. +2: 전사의 체력이 33% 이하일 때 음식을 먹으면 6 HP를 회복합니다.
actors.hero.talent.hearty_meal.title=충분한 식사
actors.hero.talent.heightened_senses.desc=_+1:_ 사냥꾼은 자신의 위치에서 _2칸 이내의 캐릭터에 대한 정신 시야를 얻습니다.\n\n_+2:_ 사냥꾼은 자신의 위치에서 _3칸 이내의 캐릭터에 대한 정신 시야를 얻습니다.
actors.hero.talent.heightened_senses.title=예민해진 감각
actors.hero.talent.heroic_energy.desc=+1: 영웅의 방어 능력 충전 비용이 12% 감소합니다. +2: 영웅의 방어 능력 충전 비용이 23% 감소합니다. +3: 영웅의 방어 능력 충전 비용이 32% 감소합니다. +4: 영웅의 방어 능력 충전 비용이 40% 감소합니다.
actors.hero.talent.heroic_energy.rat_title=라트로이 에너지
actors.hero.talent.heroic_energy.title=영웅적인 에너지
actors.hero.talent.hold_fast.desc=+1: 전사가 대기하면 방어력이 1~2 증가하고, 이동하기 전까지 콤보 및 보호막 버프의 감소 속도가 50% 감소합니다. +2: 전사가 대기하면 방어력이 2~4 증가하고, 이동하기 전까지 콤보 및 보호막 버프의 감소 속도가 75% 감소합니다. +3: 전사가 대기하면 방어력이 3~6 증가하고, 이동하기 전까지 콤보 및 보호막 버프의 감소 속도가 100% 감소합니다.
actors.hero.talent.hold_fast.title=꽉 붙잡으세요
actors.hero.talent.holy_intuition.desc=+1: 성직자는 3회 사용 횟수를 소모하여 아이템이 저주받았는지 여부를 알려주는 주문인 '신성한 직관'을 시전할 수 있습니다. +2: 성직자는 2회 사용 횟수를 소모하여 아이템이 저주받았는지 여부를 알려주는 주문인 '신성한 직관'을 시전할 수 있습니다.
actors.hero.talent.holy_intuition.meta_desc=만약 이 특성을 다른 영웅이 얻게 된다면, 해당 영웅은 저주받은 아이템을 장착하기 직전에 저주 상태를 확인할 수 있게 됩니다. +1 강화 시에는 15%, +2 강화 시에는 25%의 확률로 확인할 수 있습니다.
actors.hero.talent.holy_intuition.title=신성한 직관
actors.hero.talent.holy_lance.desc=+1: 사제는 4회 사용 횟수를 소모하여 30~55의 피해를 주는 강력한 주문인 성창을 시전할 수 있습니다. +2: 사제는 4회 사용 횟수를 소모하여 45~83의 피해를 주는 강력한 주문인 성창을 시전할 수 있습니다. +3: 사제는 4회 사용 횟수를 소모하여 60~110의 피해를 주는 강력한 주문인 성창을 시전할 수 있습니다. 성창은 악마와 언데드 적에게 항상 최대 피해를 줍니다. 성창은 30턴의 재사용 대기시간이 있습니다.
actors.hero.talent.holy_lance.title=성창
actors.hero.talent.impact_wave.desc=+1: 전사가 점프 후 착지할 때, 인접한 모든 적은 2칸 뒤로 밀려나고 25% 확률로 5턴 동안 무방비 상태가 됩니다. +2: 전사가 점프 후 착지할 때, 인접한 모든 적은 3칸 뒤로 밀려나고 50% 확률로 5턴 동안 무방비 상태가 됩니다. +3: 전사가 점프 후 착지할 때, 인접한 모든 적은 4칸 뒤로 밀려나고 75% 확률로 5턴 동안 무방비 상태가 됩니다. +4: 전사가 점프 후 착지할 때, 인접한 모든 적은 5칸 뒤로 밀려나고 100% 확률로 5턴 동안 무방비 상태가 됩니다.
actors.hero.talent.impact_wave.title=충격파
actors.hero.talent.improvised_projectiles.desc=+1: 전사는 투척 무기가 아닌 모든 아이템을 적에게 던져 2턴 동안 적의 시야를 가릴 수 있습니다. 재사용 대기시간은 50턴입니다. +2: 전사는 투척 무기가 아닌 모든 아이템을 적에게 던져 3턴 동안 적의 시야를 가릴 수 있습니다. 재사용 대기시간은 50턴입니다.
actors.hero.talent.improvised_projectiles.title=즉석에서 만든 발사체
actors.hero.talent.inscribed_power.desc=+1: 마법사가 두루마리를 읽거나 주문 아이템을 사용할 때, 다음 2번의 지팡이 공격에 +2 레벨이 추가됩니다. +2: 마법사가 두루마리를 읽거나 주문 아이템을 사용할 때, 다음 3번의 지팡이 공격에 +2 레벨이 추가됩니다. 강화, 변환 또는 해당 두루마리를 사용하여 제작해야 하는 연금술 아이템을 사용할 경우, 강화된 지팡이 공격 횟수가 두 배가 됩니다. 생산량이 많은 연금술 아이템(예: 대부분의 주문)의 경우, 해당 아이템의 생산량에 따라 이 특성이 발동될 확률이 있습니다.
actors.hero.talent.inscribed_power.title=새겨진 힘
actors.hero.talent.inscribed_stealth.desc=+1: 도적은 두루마리를 읽거나 주문 아이템을 사용한 후 3턴 동안 투명해집니다. +2: 도적은 두루마리를 읽거나 주문 아이템을 사용한 후 5턴 동안 투명해집니다. 강화 두루마리, 변환 두루마리 또는 해당 두루마리를 사용하여 제작해야 하는 연금술 아이템을 사용할 경우 투명화 지속 시간이 두 배가 됩니다. 생산량이 많은 연금술 아이템(예: 대부분의 주문)의 경우, 해당 아이템의 생산량에 따라 이 특성이 발동될 확률이 있습니다.
actors.hero.talent.inscribed_stealth.title=새겨진 은밀함
actors.hero.talent.invigorating_meal.desc=+1: 음식을 먹으면 사냥꾼은 1턴이 소요되며(열매는 즉시 섭취 가능) 1턴 동안 가속 효과를 얻습니다. +2: 음식을 먹으면 사냥꾼은 1턴이 소요되며(열매는 즉시 섭취 가능) 2턴 동안 가속 효과를 얻습니다.
actors.hero.talent.invigorating_meal.title=활력을 주는 식사
actors.hero.talent.invigorating_victory.desc=+1: 결투가가 끝나기 전에 상대를 쓰러뜨리면, 결투 중에 입은 피해량의 30%에 _5 HP를 더한 만큼_ 회복합니다. +2: 결투가가 끝나기 전에 상대를 쓰러뜨리면, 결투 중에 입은 피해량의 50%에 _10 HP를 더한 만큼_ 회복합니다. +3: 결투가가 끝나기 전에 상대를 쓰러뜨리면, 결투 중에 입은 피해량의 65%에 _15 HP를 더한 만큼_ 회복합니다. +4: 결투가가 끝나기 전에 상대를 쓰러뜨리면, 결투 중에 입은 피해량의 75%에 _20 HP를 더한 만큼_ 회복합니다.
actors.hero.talent.invigorating_victory.title=활력을 주는 승리
actors.hero.talent.iron_stomach.desc=+1: 음식을 먹으면 전사는 1턴을 소모하고 먹는 동안 75%의 피해 저항력을 얻습니다. +2: 음식을 먹으면 전사는 1턴을 소모하고 먹는 동안 100%의 피해 저항력을 얻습니다.
actors.hero.talent.iron_stomach.title=철 위장
actors.hero.talent.iron_will.desc=+1: 전사의 인장이 제공하는 보호막이 1만큼 증가합니다. +2: 전사의 인장이 제공하는 보호막이 2만큼 증가합니다.
actors.hero.talent.iron_will.meta_desc=만약 이 특성을 다른 영웅이 획득한다면, 전사의 봉인 파괴 효과와 유사한 1 또는 2 최대 보호막 버전이 자동으로 부여됩니다.
actors.hero.talent.iron_will.title=철의 의지
actors.hero.talent.judgement.desc=+1: 승천한 형태일 때, 성직자는 보이는 모든 적에게 10-20의 피해를 주는 _심판_을 시전할 수 있습니다. +2: 승천한 형태일 때, 성직자는 보이는 모든 적에게 15-30의 피해를 주는 _심판_을 시전할 수 있습니다. +3: 승천한 형태일 때, 성직자는 보이는 모든 적에게 20-40의 피해를 주는 _심판_을 시전할 수 있습니다. +4: 승천한 형태일 때, 성직자는 보이는 모든 적에게 25-50의 피해를 주는 _심판_을 시전할 수 있습니다. 심판은 마법서 3개를 소모합니다. 심판은 성직자가 승천한 이후 또는 마지막으로 심판을 시전한 이후 시전한 주문 하나당 33%의 추가 피해를 줍니다.
actors.hero.talent.judgement.title=심판
actors.hero.talent.lay_on_hands.desc=+1: 팔라딘은 1회 사용 횟수를 소모하여 주변 캐릭터의 HP를 즉시 15 회복시키거나 자신에게 15의 보호막을 부여하는 주문인 '손 얹기'를 시전할 수 있습니다. +2: 팔라딘은 1회 사용 횟수를 소모하여 주변 캐릭터의 HP를 즉시 20 회복시키거나 자신에게 20의 보호막을 부여하는 주문인 '손 얹기'를 시전할 수 있습니다. +3: 팔라딘은 1회 사용 횟수를 소모하여 주변 캐릭터의 HP를 즉시 25 회복시키거나 자신에게 25의 보호막을 부여하는 주문인 '손 얹기'를 시전할 수 있습니다. 이 주문으로 인한 초과 회복량은 보호막으로 전환됩니다. 손을 얹는 주문은 반복해서 시전할 수 있지만, 한 번에 세 번 시전 분량 이상의 보호막을 적용할 수는 없습니다.
actors.hero.talent.lay_on_hands.title=손을 얹다
actors.hero.talent.lethal_defense.desc=+1: 검투사가 콤보 공격으로 적을 처치하면, 파괴된 봉인 보호막의 재사용 대기시간이 50턴 감소합니다. +2: 검투사가 콤보 공격으로 적을 처치하면, 파괴된 봉인 보호막의 재사용 대기시간이 100턴 감소합니다. +3: 검투사가 콤보 공격으로 적을 처치하면, 파괴된 봉인 보호막의 재사용 대기시간이 150턴 감소합니다. 이 특성을 통해 보호막 재사용 대기시간을 최대 -150턴까지 줄일 수 있으며, 이는 보호막을 활성화하는 즉시 다시 사용할 수 있음을 의미합니다.
actors.hero.talent.lethal_defense.title=치명적인 방어
actors.hero.talent.lethal_haste.desc=+1: 결투사가 무기 능력으로 적에게 결정타를 날리면 3턴 동안 즉시 이동 능력을 얻습니다. +2: 결투사가 무기 능력으로 적에게 결정타를 날리면 5턴 동안 즉시 이동 능력을 얻습니다.
actors.hero.talent.lethal_haste.meta_desc=만약 이 특성을 다른 영웅이 획득한다면, 일반 무기 공격 시 발동하며 재사용 대기시간은 100턴입니다.
actors.hero.talent.lethal_haste.title=치명적인 속도
actors.hero.talent.lethal_momentum.desc=+1: 전사가 물리 무기로 적에게 결정타를 날리면 67% 확률로 턴이 0이 됩니다. +2: 전사가 물리 무기로 적에게 결정타를 날리면 100% 확률로 턴이 0이 됩니다.
actors.hero.talent.lethal_momentum.title=치명적인 추진력
actors.hero.talent.life_link.desc=성직자는 2회 사용 횟수를 소모하여 자신과 강화된 아군 사이에 _생명 연결_을 시전할 수 있습니다. 이 주문은 피해를 성직자와 아군에게 공유하게 하며, 둘 중 하나라도 영향을 받고 있다면 3단계 이하의 성직자 주문 효과가 둘 모두에게 적용되도록 합니다. \n\n_+1: 생명 연결이 10턴 동안 지속되며, 다수의 힘 보너스가 받는 피해를 -35%로 증가합니다. \n\n_+2: 생명 연결이 13턴 동안 지속되며, 다수의 힘 보너스가 받는 피해를 -40%로 증가합니다. \n\n_+3: 생명 연결이 17턴 동안 지속되며, 다수의 힘 보너스가 받는 피해를 -45%로 증가합니다. \n\n_+4: 생명 연결이 20턴 동안 지속되며, 다수의 힘 보너스가 받는 피해를 -50%로 증가합니다.
actors.hero.talent.life_link.title=생명 연결
actors.hero.talent.light_cloak.desc=+1: 도적은 그림자 망토를 장착하지 않은 상태에서도 사용할 수 있지만, 장착하지 않으면 재충전 속도가 25%로 느려집니다. +2: 도적은 그림자 망토를 장착하지 않은 상태에서도 사용할 수 있지만, 장착하지 않으면 재충전 속도가 50%로 느려집니다. +3: 도적은 그림자 망토를 장착하지 않은 상태에서도 사용할 수 있지만, 장착하지 않으면 재충전 속도가 75%로 느려집니다.
actors.hero.talent.light_cloak.meta_desc=만약 이 특성을 다른 영웅이 획득한다면, +1/+2/+3 강화 시 모든 유물의 충전 속도가 7/13/20% 증가합니다.
actors.hero.talent.light_cloak.title=가벼운 망토
actors.hero.talent.light_reading.desc=+1: 성직자는 성서를 장착하지 않은 상태에서도 사용할 수 있지만, 장착하지 않으면 재사용 속도가 25%로 감소합니다. +2: 성직자는 성서를 장착하지 않은 상태에서도 사용할 수 있지만, 장착하지 않으면 재사용 속도가 50%로 감소합니다. +3: 성직자는 성서를 장착하지 않은 상태에서도 사용할 수 있지만, 장착하지 않으면 재사용 속도가 75%로 감소합니다.
actors.hero.talent.light_reading.meta_desc=만약 이 특성을 다른 영웅이 얻게 되면, +1/+2/+3 레벨에서 모든 지팡이의 재충전 속도가 7/13/20% 증가합니다.
actors.hero.talent.light_reading.title=가볍게 읽기
actors.hero.talent.lingering_magic.desc=+1: 마법사가 지팡이나 막대기로 마법을 시전할 때, 다음 물리 공격에 1-2의 추가 피해를 줍니다. +2: 마법사가 지팡이나 막대기로 마법을 시전할 때, 다음 물리 공격에 2의 추가 피해를 줍니다.
actors.hero.talent.lingering_magic.title=오래도록 남는 마법
actors.hero.talent.liquid_agility.desc=+1: 결투사는 물약, 양조주 또는 비약을 마시거나 던질 때 회피율이 3배가 되고, 5턴 이내에 사용하는 다음 근접 공격의 명중률이 3배가 됩니다. +2: 결투사는 물약, 양조주 또는 비약을 마시거나 던질 때 회피율이 무한이 되고, 5턴 이내에 사용하는 다음 근접 공격의 명중률이 무한이 됩니다. 이 보너스는 힘의 물약, 경험치 물약 또는 해당 물약을 사용하여 제작해야 하는 연금술 아이템을 사용할 때 추가로 1턴과 1회 공격 동안 지속됩니다. 생산량이 많은 연금술 아이템(예: 아쿠아 브루)의 경우, 이 특성은 해당 아이템의 생산량에 따라 발동될 확률이 있습니다.
actors.hero.talent.liquid_agility.title=액체 민첩성
actors.hero.talent.liquid_nature.desc=+1: 사냥꾼이 물약, 양조주 또는 비약을 마시거나 던지면 주변에 최대 4칸의 풀이 돋아나고 인접한 적은 1턴 동안 움직일 수 없게 됩니다. +2: 사냥꾼이 물약, 양조주 또는 비약을 마시거나 던지면 주변에 최대 6칸의 풀이 돋아나고 인접한 적은 2턴 동안 움직일 수 없게 됩니다. 힘의 물약, 경험치 물약 또는 해당 물약을 사용하여 제작해야 하는 연금술 아이템을 사용할 경우, 풀이 돋아나는 양과 움직일 수 없게 되는 지속 시간이 두 배가 됩니다. 생산량이 많은 연금술 아이템(예: 아쿠아 브루)의 경우, 해당 아이템의 생산량에 따라 이 특성이 발동될 확률이 있습니다.
actors.hero.talent.liquid_nature.title=액체의 본질
actors.hero.talent.liquid_willpower.desc=+1: 전사는 물약, 양조주 또는 비약을 마시거나 던질 때 최대 HP의 6.5%에 해당하는 보호막을 얻습니다. +2: 전사는 물약, 양조주 또는 비약을 마시거나 던질 때 최대 HP의 10%에 해당하는 보호막을 얻습니다. 힘의 물약, 경험치 물약 또는 해당 물약을 사용하여 제작해야 하는 연금술 아이템을 사용할 때 보호막 양이 두 배가 됩니다. 생산량이 많은 연금술 아이템(예: 아쿠아 브루)의 경우, 해당 아이템의 생산량에 따라 이 특성이 발동될 확률이 있습니다.
actors.hero.talent.liquid_willpower.title=액체 의지력
actors.hero.talent.longrange_warp.desc=_+1:_ 마법사는 이제 _충전 비용의 150%_로 층 사이를 순간 이동할 수 있습니다.\n\n_+2:_ 마법사는 이제 _충전 비용의 117%_로 층 사이를 순간 이동할 수 있습니다.\n\n_+3:_ 마법사는 이제 _충전 비용의 83%_로 층 사이를 순간 이동할 수 있습니다.\n\n_+4:_ 마법사는 이제 _충전 비용의 50%_로 층 사이를 순간 이동할 수 있습니다.\n\n 마법사는 잠긴 층을 나가기 위해 장거리 순간 이동을 사용할 수 없습니다.
actors.hero.talent.longrange_warp.title=장거리 워프
actors.hero.talent.mind_form.desc=성직자는 _정신 형태_를 시전할 수 있으며, 이는 3회 사용 횟수를 소모하여 이번 플레이에서 사용했던 지팡이나 투척 무기의 힘을 트리니티에 부여합니다.\n\n_+1: 트리니티 사용 시, 선택한 아이템의 번개 또는 투척 효과를 마치 _+3_처럼 사용합니다.\n\n_+2: 트리니티 사용 시, 선택한 아이템의 번개 또는 투척 효과를 마치 _+4_처럼 사용합니다.\n\n_+3: 트리니티 사용 시, 선택한 아이템의 번개 또는 투척 효과를 마치 _+5_처럼 사용합니다.\n\n_+4: 트리니티 사용 시, 선택한 아이템의 번개 또는 투척 효과를 마치 _+5_처럼 사용합니다. 아이템은 마치 _+6._\n\nTrinity처럼 한 번에 하나의 정신 효과만 부여할 수 있습니다.
actors.hero.talent.mind_form.title=마음의 형태
actors.hero.talent.mnemonic_prayer.desc=+1: 사제는 1회 사용으로 아군/적에게 3턴 동안 버프/디버프 효과를 연장하는 주문인 '기억의 기도'를 시전할 수 있습니다. +2: 사제는 1회 사용으로 아군/적에게 4턴 동안 버프/디버프 효과를 연장하는 주문인 '기억의 기도'를 시전할 수 있습니다. +3: 사제는 1회 사용으로 아군/적에게 5턴 동안 버프/디버프 효과를 연장하는 주문인 '기억의 기도'를 시전할 수 있습니다. '기억의 기도'는 시전 시간이 없습니다. 기억의 기도는 특정 버프/디버프 효과를 한 번만 연장할 수 있으며, 방어구 능력으로 인한 버프는 연장할 수 없습니다.
actors.hero.talent.mnemonic_prayer.title=기억술 기도
actors.hero.talent.monastic_vigor.desc=+1: 수도승의 에너지가 100%일 경우, 능력이 강화됩니다. +2: 수도승의 에너지가 80% 이상일 경우, 능력이 강화됩니다. +3: 수도승의 에너지가 60% 이상일 경우, 능력이 강화됩니다. 강화 시: - 난무(Flurry)가 무기의 마법 부여를 적용합니다. - 집중(Focus)이 즉시 발동됩니다. - 돌진(Dash)의 사거리가 4 증가합니다. - 용의 발차기(Dragon Kick)의 피해량이 50% 증가하고, 주변의 모든 적에게 밀쳐내기 및 기절 효과를 부여합니다. - 명상(Meditation)이 잃은 HP의 20%를 천천히 회복하고 피해 저항력을 80% 부여합니다.
actors.hero.talent.monastic_vigor.title=수도승의 활력
actors.hero.talent.mystical_charge.desc=+1: 지팡이로 공격하면 전투 마법사는 0.5턴 동안 유물을 재충전할 수 있습니다. +2: 지팡이로 공격하면 전투 마법사는 1턴 동안 유물을 재충전할 수 있습니다. +3: 지팡이로 공격하면 전투 마법사는 1.5턴 동안 유물을 재충전할 수 있습니다.
actors.hero.talent.mystical_charge.title=신비로운 전하
actors.hero.talent.mystical_meal.desc=+1: 음식을 먹으면 도적은 1턴을 소모하고(보급품은 즉시 소모됨) 유물을 3턴 동안 재충전할 수 있습니다. +2: 음식을 먹으면 도적은 1턴을 소모하고(보급품은 즉시 소모됨) 유물을 5턴 동안 재충전할 수 있습니다. 이 특성은 풍요의 뿔을 재충전하는 데 사용할 수 없습니다.
actors.hero.talent.mystical_meal.title=신비로운 식사
actors.hero.talent.natures_aid.desc=+1: 사냥꾼은 시야에 식물의 효과가 발동될 때마다 3턴마다 사라지는 0-2의 나무껍질 갑옷을 얻습니다. +2: 사냥꾼은 시야에 식물의 효과가 발동될 때마다 5턴마다 사라지는 0-2의 나무껍질 갑옷을 얻습니다.
actors.hero.talent.natures_aid.title=자연의 도움
actors.hero.talent.natures_bounty.desc=_+1:_ 사냥꾼은 던전의 다음 몇 층을 탐험하면서 키 큰 풀숲에 숨겨진 _열매 4개_를 찾을 수 있습니다.\n\n_+2:_ 사냥꾼은 던전의 다음 몇 층을 탐험하면서 키 큰 풀숲에 숨겨진 _열매 6개_를 찾을 수 있습니다.\n\n열매는 빨리 먹을 수 있고, 포만감을 약간 회복시켜주며, 사용할 수 있는 씨앗이 들어있을 수도 있습니다.
actors.hero.talent.natures_bounty.title=자연의 풍요로움
actors.hero.talent.natures_wrath.desc=+1: 자연의 힘이 활성화된 동안, 영혼의 활에서 발사되는 화살은 8% 확률로 무작위 유해 식물 효과를 발동시킵니다. +2: 자연의 힘이 활성화된 동안, 영혼의 활에서 발사되는 화살은 17% 확률로 무작위 유해 식물 효과를 발동시킵니다. +3: 자연의 힘이 활성화된 동안, 영혼의 활에서 발사되는 화살은 25% 확률로 무작위 유해 식물 효과를 발동시킵니다. +4: 자연의 힘이 활성화된 동안, 영혼의 활에서 발사되는 화살은 33% 확률로 무작위 유해 식물 효과를 발동시킵니다. 발동될 수 있는 식물은 맹초, 불꽃꽃, 빙모, 슬픔이끼, 폭풍덩굴입니다.
actors.hero.talent.natures_wrath.title=자연의 분노
actors.hero.talent.necromancers_minions.desc=+1: 영혼 표식이 있는 적이 죽으면, 흑마법사는 13% 확률로 그 적을 타락한 망령으로 부활시킵니다. +2: 영혼 표식이 있는 적이 죽으면, 흑마법사는 27% 확률로 그 적을 타락한 망령으로 부활시킵니다. +3: 영혼 표식이 있는 적이 죽으면, 흑마법사는 40% 확률로 그 적을 타락한 망령으로 부활시킵니다.
actors.hero.talent.necromancers_minions.title=강령술사의 하수인들
actors.hero.talent.patient_strike.desc=+1: 결투사가 근접 공격을 하기 전에 잠시 기다리면 1-2의 추가 피해를 줍니다. +2: 결투사가 근접 공격을 하기 전에 잠시 기다리면 2의 추가 피해를 줍니다.
actors.hero.talent.patient_strike.title=환자 파업
actors.hero.talent.perfect_copy.desc=+1: 그림자 분신은 영웅 최대 HP의 10%를 얻고, 최대 1칸 떨어진 영웅과 즉시 위치를 바꿀 수 있습니다. +2: 그림자 분신은 영웅 최대 HP의 20%를 얻고, 최대 2칸 떨어진 영웅과 즉시 위치를 바꿀 수 있습니다. +3: 그림자 분신은 영웅 최대 HP의 30%를 얻고, 최대 3칸 떨어진 영웅과 즉시 위치를 바꿀 수 있습니다. +4: 그림자 분신은 영웅 최대 HP의 40%를 얻고, 최대 4칸 떨어진 영웅과 즉시 위치를 바꿀 수 있습니다.
actors.hero.talent.perfect_copy.title=완벽한 복사본
actors.hero.talent.point_blank.desc=+1: 사냥꾼이 근접 거리에서 활이나 투척 무기를 사용할 때 명중률이 -50%가 아닌 -25%로 감소합니다. +2: 사냥꾼이 근접 거리에서 활이나 투척 무기를 사용할 때 명중률이 -50%가 아닌 정상으로 감소합니다. +3: 사냥꾼이 근접 거리에서 활이나 투척 무기를 사용할 때 명중률이 -50%가 아닌 +25%로 증가합니다. 참고로 투척 무기나 영혼의 활은 원거리에서 사용할 경우 항상 명중률이 +50%입니다.
actors.hero.talent.point_blank.title=근거리에서
actors.hero.talent.precise_assault.desc=+1: 결투사가 무기 능력을 사용할 때, 5턴 이내에 다음 근접 공격의 명중률이 2배 증가합니다. +2: 결투사가 무기 능력을 사용할 때, 5턴 이내에 다음 근접 공격의 명중률이 5배 증가합니다. +3: 결투사가 무기 능력을 사용할 때, 5턴 이내에 다음 근접 공격의 명중률이 무한대가 됩니다.
actors.hero.talent.precise_assault.meta_desc=만약 이 특성을 다른 영웅이 얻게 되면, +1 레벨에서 근접 공격 명중률이 10%, +2 레벨에서 20%, +3 레벨에서 30% 증가합니다.
actors.hero.talent.precise_assault.title=정확한 공격
actors.hero.talent.projectile_momentum.desc=+1: 프리러닝 중, 프리러너는 투척 무기의 명중률 50% 증가 및 피해량 15% 증가 효과를 얻습니다. +2: 프리러닝 중, 프리러너는 투척 무기의 명중률 100% 증가 및 피해량 30% 증가 효과를 얻습니다. +3: 프리러닝 중, 프리러너는 투척 무기의 명중률 150% 증가 및 피해량 45% 증가 효과를 얻습니다.
actors.hero.talent.projectile_momentum.title=발사체 운동량
actors.hero.talent.projecting_blades.desc=+1: 스펙트럴 블레이드는 정확도가 25% 향상되었으며, 최대 2개의 단단한 타일을 관통할 수 있습니다. +2: 스펙트럴 블레이드는 정확도가 50% 향상되었으며, 최대 4개의 단단한 타일을 관통할 수 있습니다. +3: 스펙트럴 블레이드는 정확도가 75% 향상되었으며, 최대 6개의 단단한 타일을 관통할 수 있습니다. +4: 스펙트럴 블레이드는 정확도가 100% 향상되었으며, 최대 8개의 단단한 타일을 관통할 수 있습니다.
actors.hero.talent.projecting_blades.title=돌출형 블레이드
actors.hero.talent.protective_shadows.desc=+1: 도적은 투명 상태일 때마다 매 턴마다 보호막 1을 획득하며, 최대 3까지 가능합니다. +2: 도적은 투명 상태일 때마다 매 턴마다 보호막 1을 획득하며, 최대 5까지 가능합니다.
actors.hero.talent.protective_shadows.title=보호의 그림자
actors.hero.talent.provoked_anger.desc=+1: 전사에게 적용된 보호막 버프가 피해로 인해 파괴되면, 다음 물리 공격에 _3의 추가 피해_를 입힙니다. +2: 전사에게 적용된 보호막 버프가 피해로 인해 파괴되면, 다음 물리 공격에 _5의 추가 피해_를 입힙니다.
actors.hero.talent.provoked_anger.title=분노를 유발하다
actors.hero.talent.ratforcements.desc=_+1:_ 자신에게 쥐변신 스킬을 사용하면 옆에 아군 유대류 쥐 1마리가 생성됩니다.\n\n_+2:_ 자신에게 쥐변신 스킬을 사용하면 옆에 아군 유대류 쥐 2마리가 생성됩니다.\n\n_+3:_ 자신에게 쥐변신 스킬을 사용하면 옆에 아군 유대류 쥐 3마리가 생성됩니다.\n\n_+4:_ 자신에게 쥐변신 스킬을 사용하면 옆에 아군 유대류 쥐 4마리가 생성됩니다.
actors.hero.talent.ratforcements.title=쥐의 강제력
actors.hero.talent.ratlomacy.desc=+1: 쥐로 변신한 적에게 쥐 변신 스킬을 사용하면 아군이 되고 변신이 영구적으로 유지됩니다. +2: 쥐로 변신한 적에게 쥐 변신 스킬을 사용하면 아군이 되고 변신이 영구적으로 유지되며 아드레날린이 2턴 동안 지속됩니다. +3: 쥐로 변신한 적에게 쥐 변신 스킬을 사용하면 아군이 되고 변신이 영구적으로 유지되며 아드레날린이 4턴 동안 지속됩니다. +4: 쥐로 변신한 적에게 쥐 변신 스킬을 사용하면 아군이 되고 변신이 영구적으로 유지되며 아드레날린이 6턴 동안 지속됩니다.
actors.hero.talent.ratlomacy.title=쥐의 습성
actors.hero.talent.ratsistance.desc=_+1:_ 적대적인 쥐변신 적은 _-10%의 피해를 줍니다_.\n\n_+2:_ 적대적인 쥐변신 적은 _-19%의 피해를 줍니다_.\n\n_+3:_ 적대적인 쥐변신 적은 _-27%의 피해를 줍니다_.\n\n_+4:_ 적대적인 쥐변신 적은 _-35%의 피해를 줍니다_.
actors.hero.talent.ratsistance.title=쥐의 저항
actors.hero.talent.reactive_barrier.desc=+1: 마법사는 원소 폭발의 영향을 받는 캐릭터 하나당 2.5의 보호막을 얻습니다. 최대 5명까지 적용됩니다. +2: 마법사는 원소 폭발의 영향을 받는 캐릭터 하나당 5의 보호막을 얻습니다. 최대 6명까지 적용됩니다. +3: 마법사는 원소 폭발의 영향을 받는 캐릭터 하나당 7.5의 보호막을 얻습니다. 최대 7명까지 적용됩니다. +4: 마법사는 원소 폭발의 영향을 받는 캐릭터 하나당 10의 보호막을 얻습니다. 최대 8명까지 적용됩니다.
actors.hero.talent.reactive_barrier.title=반응성 장벽
actors.hero.talent.recall_inscription.desc=+1: 성직자는 마지막으로 사용한 룬스톤이나 두루마리의 효과를 10턴 이내에 반복할 수 있는 주문인 '주문 소환'을 시전할 수 있습니다. +2: 성직자는 마지막으로 사용한 룬스톤이나 두루마리의 효과를 300턴 이내에 반복할 수 있는 주문인 '주문 소환'을 시전할 수 있습니다. '주문 소환'은 강화 두루마리에는 사용할 수 없습니다. 이 주문의 사용 비용은 최근에 사용한 아이템에 따라 다릅니다. 룬스톤은 2, 두루마리는 3, 특수 두루마리는 4입니다. 변환 두루마리 또는 변환이나 강화를 통해 제작해야 하는 연금술 아이템과 함께 사용할 경우 사용 비용이 두 배가 됩니다.
actors.hero.talent.recall_inscription.meta_desc=이 특성을 다른 영웅이 획득할 경우, 10% 확률로 +1 강화 스크롤 또는 15% 확률로 +2 강화 스크롤을 환불해 줍니다. 강화 스크롤은 이 효과에서 제외됩니다.
actors.hero.talent.recall_inscription.refunded=주문하신 상품에 대한 환불이 완료되었습니다!
actors.hero.talent.recall_inscription.title=회상 비문
actors.hero.talent.rejuvenating_steps.desc=+1: 사냥꾼이 짧은 풀이나 불씨를 밟으면, 그것들이 키 큰 풀로 솟아오르고 사냥꾼은 즉시 그 풀밭에 밭고랑을 만듭니다. 이 효과는 10턴의 재사용 대기시간이 있습니다. +2: 사냥꾼이 짧은 풀이나 불씨를 밟으면, 그것들이 키 큰 풀로 솟아오르고 사냥꾼은 즉시 그 풀밭에 밭고랑을 만듭니다. 이 효과는 5턴의 재사용 대기시간이 있습니다. 이 특성은 지속 재생 효과가 비활성화되었거나 영웅이 오랫동안 경험치를 획득하지 못했을 경우 밭고랑을 만든 풀을 생성합니다.
actors.hero.talent.rejuvenating_steps.title=활력을 되찾는 단계
actors.hero.talent.remote_beacon.desc=+1: 마법사는 4타일 이내의 어느 위치에든 신호기를 설치할 수 있습니다. +2: 마법사는 8타일 이내의 어느 위치에든 신호기를 설치할 수 있습니다. +3: 마법사는 12타일 이내의 어느 위치에든 신호기를 설치할 수 있습니다. +4: 마법사는 16타일 이내의 어느 위치에든 신호기를 설치할 수 있습니다. 마법사는 접근할 수 없는 위치에는 신호기를 설치할 수 없습니다.
actors.hero.talent.remote_beacon.title=원격 비콘
actors.hero.talent.rogues_foresight.desc=+1: 도적이 비밀의 방이 있는 레벨에 있을 때, 그 레벨에 비밀이 있다는 것을 알아챌 확률이 75%입니다. +2: 도적이 비밀의 방이 있는 레벨에 있을 때, 그 레벨에 비밀이 있다는 것을 알아챌 확률이 100%입니다.
actors.hero.talent.rogues_foresight.title=도적의 예지력
actors.hero.talent.runic_transference.desc=+1: 전사의 깨진 봉인은 업그레이드를 전송하는 것과 같은 방식으로 일반 문양을 전송할 수 있습니다. +2: 전사의 깨진 봉인은 업그레이드를 전송하는 것과 같은 방식으로 일반, 강력, 저주 문양을 전송할 수 있습니다. 봉인은 봉인이 부착되었을 당시 갑옷에 적용되어 있던 문양만 전송할 수 있습니다.
actors.hero.talent.runic_transference.meta_desc=만약 이 특성을 다른 영웅이 획득한다면, 갑옷에 새겨진 문양이 강화 주문서로 제거되는 것을 막아주는 효과가 적용됩니다. 문양은 6레벨(기존 4레벨에서 상향 조정)부터 +1 강화 시, 또는 7레벨(기존 4레벨에서 상향 조정)부터 +2 강화 시 제거되기 시작합니다. 문양이 반드시 제거되는 레벨은 +8로 변경되지 않았습니다.
actors.hero.talent.runic_transference.title=룬 문자 전이
actors.hero.talent.satiated_spells.desc=+1: 음식을 먹으면 성직자는 다음에 주문을 시전할 때 보호막 3을 얻습니다. +2: 음식을 먹으면 성직자는 다음에 주문을 시전할 때 보호막 5를 얻습니다.
actors.hero.talent.satiated_spells.meta_desc=만약 이 특성을 다른 영웅이 획득한다면, 즉시 보호막을 부여하며, 이 보호막은 10턴 후에 정상적으로 감소하기 시작합니다.
actors.hero.talent.satiated_spells.title=만족한 주문
actors.hero.talent.scholars_intuition.desc=+1: 마법사는 지팡이를 3배 더 빠르게 식별합니다. +2: 마법사는 지팡이를 사용할 때 지팡이를 식별합니다.
actors.hero.talent.scholars_intuition.title=학자의 직관
actors.hero.talent.searing_light.desc=+1: 성직자가 '가이딩 라이트'로 비춰진 적에게 가하는 물리 공격은 +3의 추가 피해를 줍니다. +2: 성직자가 '가이딩 라이트'로 비춰진 적에게 가하는 물리 공격은 +5의 추가 피해를 줍니다.
actors.hero.talent.searing_light.meta_desc=만약 이 특성을 다른 영웅이 획득한다면, 지팡이나 유물을 적에게 사용한 후에 추가 피해를 입히게 되며, 재사용 대기시간은 20턴입니다.
actors.hero.talent.searing_light.title=타오르는 빛
actors.hero.talent.seer_shot.desc=+1: 사냥꾼이 땅에 화살을 쏘면, 화살 주변 3x3 범위에 5턴 동안 시야를 확보합니다. 재사용 대기시간은 20턴입니다. +2: 사냥꾼이 땅에 화살을 쏘면, 화살 주변 3x3 범위에 10턴 동안 시야를 확보합니다. 재사용 대기시간은 20턴입니다. +3: 사냥꾼이 땅에 화살을 쏘면, 화살 주변 3x3 범위에 15턴 동안 시야를 확보합니다. 재사용 대기시간은 20턴입니다.
actors.hero.talent.seer_shot.meta_desc=만약 이 특성을 다른 영웅이 얻게 된다면, 투척 무기를 사용할 때마다 발동됩니다.
actors.hero.talent.seer_shot.title=예언자 샷
actors.hero.talent.shadow_blade.desc=+1: 그림자 복제체는 매 턴 영웅 공격력의 8%를 얻고, 영웅의 무기에 부여된 마법을 사용할 확률이 25%입니다. +2: 그림자 복제체는 매 턴 영웅 공격력의 16%를 얻고, 영웅의 무기에 부여된 마법을 사용할 확률이 50%입니다. +3: 그림자 복제체는 매 턴 영웅 공격력의 24%를 얻고, 영웅의 무기에 부여된 마법을 사용할 확률이 75%입니다. +4: 그림자 복제체는 매 턴 영웅 공격력의 32%를 얻고, 영웅의 무기에 부여된 마법을 사용할 확률이 100%입니다.
actors.hero.talent.shadow_blade.title=그림자 칼날
actors.hero.talent.shadow_step.desc=+1: 도적이 은신 상태에서 연막탄을 사용하면 즉시 발동하고 충전 비용이 16% 감소하지만, 적의 시야를 가리거나 다른 특성을 발동시키지 않습니다. +2: 도적이 은신 상태에서 연막탄을 사용하면 즉시 발동하고 충전 비용이 30% 감소하지만, 적의 시야를 가리거나 다른 특성을 발동시키지 않습니다. +3: 도적이 은신 상태에서 연막탄을 사용하면 즉시 발동하고 충전 비용이 41% 감소하지만, 적의 시야를 가리거나 다른 특성을 발동시키지 않습니다. +4: 도적이 은신 상태에서 연막탄을 사용하면 즉시 발동하고 충전 비용이 50% 감소하지만, 적의 시야를 가리거나 다른 특성을 발동시키지 않습니다.
actors.hero.talent.shadow_step.title=그림자 단계
actors.hero.talent.shared_enchantment.desc=+1: 투척 무기는 저격수의 활에 부여된 마법이 적용될 확률이 33%입니다. +2: 투척 무기는 저격수의 활에 부여된 마법이 적용될 확률이 67%입니다. +3: 투척 무기는 저격수의 활에 부여된 마법이 적용될 확률이 100%입니다. 활의 마법은 투척 무기가 이미 가지고 있는 마법과 함께 발동될 수 있습니다.
actors.hero.talent.shared_enchantment.title=공유된 마법
actors.hero.talent.shared_upgrades.desc=+1: 스나이퍼가 업그레이드된 투척 무기로 공격할 때, 레벨이 오를 때마다 스나이퍼 표식 지속 시간이 1턴씩 증가하고 특수 공격의 피해량이 16%씩 증가합니다. 최대 레벨은 +2이며, 지속 시간은 2턴, 피해량은 33% 증가합니다. +2: 스나이퍼가 업그레이드된 투척 무기로 공격할 때, 레벨이 오를 때마다 스나이퍼 표식 지속 시간이 1턴씩 증가하고 특수 공격의 피해량이 16%씩 증가합니다. 최대 레벨은 +4이며, 피해량은 67% 증가합니다. +3: 스나이퍼가 업그레이드된 투척 무기로 공격할 때, 레벨이 오를 때마다 스나이퍼 표식 지속 시간이 1턴씩 증가하고 특수 공격의 피해량이 16%씩 증가합니다. 최대 레벨은 +6이며, 피해량은 100% 증가합니다.
actors.hero.talent.shared_upgrades.title=공유 업그레이드
actors.hero.talent.shield_battery.desc=+1: 마법사는 지팡이로 자신을 조준하여 모든 충전량을 최대 HP의 4%만큼 보호막으로 전환할 수 있습니다. +2: 마법사는 지팡이로 자신을 조준하여 모든 충전량을 최대 HP의 6%만큼 보호막으로 전환할 수 있습니다.
actors.hero.talent.shield_battery.title=차폐 배터리
actors.hero.talent.shield_of_light.desc=+1: 성직자는 1회 사용 횟수를 소모하여 즉시 시전하고 5턴 동안 대상에게 2-4의 방어력을 부여하는 주문인 '빛의 방패'를 시전할 수 있습니다. +2: 성직자는 1회 사용 횟수를 소모하여 즉시 시전하고 5턴 동안 대상에게 3-6의 방어력을 부여하는 주문인 '빛의 방패'를 시전할 수 있습니다.
actors.hero.talent.shield_of_light.meta_desc=이 특성을 다른 영웅이 획득할 경우, 대상 적에게 받는 물리 피해를 1만큼 감소시키며, +1일 때는 33%, +2일 때는 50%의 확률로 감소시킵니다.
actors.hero.talent.shield_of_light.title=빛의 방패
actors.hero.talent.shielding_dew.desc=+1: 이슬방울은 워든의 체력이 최대일 때 최대 HP의 20%까지 보호막을 씌워줍니다. +2: 이슬방울은 워든의 체력이 최대일 때 최대 HP의 40%까지 보호막을 씌워줍니다. +3: 이슬방울은 워든의 체력이 최대일 때 최대 HP의 60%까지 보호막을 씌워줍니다.
actors.hero.talent.shielding_dew.title=이슬을 가리다
actors.hero.talent.shock_force.desc=+1: 충격파의 피해량이 20% 증가하고, 이동 불가 대신 기절시킬 확률이 25%입니다. +2: 충격파의 피해량이 40% 증가하고, 이동 불가 대신 기절시킬 확률이 50%입니다. +3: 충격파의 피해량이 60% 증가하고, 이동 불가 대신 기절시킬 확률이 75%입니다. +4: 충격파의 피해량이 80% 증가하고, 이동 불가 대신 기절시킬 확률이 100%입니다.
actors.hero.talent.shock_force.title=충격력
actors.hero.talent.shrug_it_off.desc=+1: 전사의 버티는 동안 받는 피해 감소율이 50%에서 60%로 증가합니다. +2: 전사의 버티는 동안 받는 피해 감소율이 50%에서 68%로 증가합니다. +3: 전사의 버티는 동안 받는 피해 감소율이 50%에서 74%로 증가합니다. +4: 전사의 버티는 동안 받는 피해 감소율이 50%에서 80%로 증가합니다.
actors.hero.talent.shrug_it_off.title=대수롭지 않게 넘겨버려
actors.hero.talent.silent_steps.desc=+1: 도적은 적과 3칸 이상 떨어져 있을 때는 잠자는 적을 깨우지 않습니다. +2: 도적은 적과 인접해 있지 않을 때는 잠자는 적을 깨우지 않습니다.
actors.hero.talent.silent_steps.title=조용한 발걸음
actors.hero.talent.soul_eater.desc=+1: 영혼 표식은 물리 피해 1당 0.33턴의 포만감을 부여합니다. 영혼 표식이 있는 적은 죽을 때 10% 확률로 먹음 효과를 발동합니다. +2: 영혼 표식은 물리 피해 1당 0.67턴의 포만감을 부여합니다. 영혼 표식이 있는 적은 죽을 때 20% 확률로 먹음 효과를 발동합니다. +3: 영혼 표식은 물리 피해 1당 1턴의 포만감을 부여합니다. 영혼 표식이 있는 적은 죽을 때 30% 확률로 먹음 효과를 발동합니다.
actors.hero.talent.soul_eater.title=소울 이터
actors.hero.talent.soul_siphon.desc=+1: 다른 캐릭터가 가하는 물리 피해는 13%의 효과로 흑마법사의 영혼 표식을 발동시킵니다. +2: 다른 캐릭터가 가하는 물리 피해는 27%의 효과로 흑마법사의 영혼 표식을 발동시킵니다. +3: 다른 캐릭터가 가하는 물리 피해는 40%의 효과로 흑마법사의 영혼 표식을 발동시킵니다.
actors.hero.talent.soul_siphon.title=영혼 흡수
actors.hero.talent.speedy_stealth.desc=+1: 프리러너는 투명 상태일 때 턴당 모멘텀 스택 2개를 얻습니다. +2: +1의 이점 외에도, 프리러너가 투명 상태일 때는 프리러닝 스택이 더 이상 감소하지 않습니다. +3: +1과 +2의 이점 외에도, 프리러너는 투명 상태일 때 프리러닝 여부와 관계없이 2배의 속도로 이동합니다.
actors.hero.talent.speedy_stealth.title=빠른 은밀함
actors.hero.talent.spirit_blades.desc=+1: 스펙트럴 블레이드는 30% 확률로 스피릿 보우의 마법 부여 효과를 추가로 사용합니다. +2: 스펙트럴 블레이드는 60% 확률로 스피릿 보우의 마법 부여 효과를 추가로 사용합니다. +3: 스펙트럴 블레이드는 90% 확률로 스피릿 보우의 마법 부여 효과를 추가로 사용합니다. +4: 스펙트럴 블레이드는 100% 확률로 스피릿 보우의 마법 부여 효과를 추가로 사용하며, 각 마법 부여 효과에 +10%의 위력을 더합니다.
actors.hero.talent.spirit_blades.title=영혼의 칼날
actors.hero.talent.spirit_form.desc=성직자는 4회 사용 횟수를 소모하여 _영혼의 형태_를 시전할 수 있습니다. 이 주문은 성직자가 이번 플레이에서 확인한 반지 또는 유물(성서 제외)의 힘을 삼위일체에 부여합니다. _+1:_ 삼위일체를 사용하면 성직자는 20턴 동안 반지의 효과를 _+1_만큼 얻거나, 유물의 효과를 _+4_만큼 발동합니다.__+2:_ 삼위일체를 사용하면 성직자는 20턴 동안 반지의 효과를 _+2_만큼 얻거나, 유물의 효과를 _+6_만큼 발동합니다.__+3:_ 삼위일체를 사용하면 성직자는 20턴 동안 반지의 효과를 _+3_만큼 얻거나, 유물의 효과를 발동합니다. _+8._\n\n_+4:_ 삼위일체를 사용하면 성직자는 20턴 동안 반지의 효과를 _+4_만큼 얻거나, 유물의 효과를 _+10_만큼 발동시킵니다._\n\n 삼위일체는 한 번에 하나의 정령 효과만 부여할 수 있습니다. 유물은 삼위일체로 발동될 때 다양한 효과와 방어구 충전 비용을 가집니다.
actors.hero.talent.spirit_form.title=영혼의 형태
actors.hero.talent.stasis.desc=성직자는 2회 사용 횟수를 소모하여 강화된 아군에게 정지(Stasis)를 시전할 수 있습니다. 정지는 아군을 일시적으로 던전에서 제거하고, 다수의 힘(Power of Many)을 포함한 모든 버프의 남은 시간을 유지합니다. 효과가 끝나면 아군은 다시 성직자 옆에 나타납니다. 정지는 즉시, 그리고 사용 횟수 소모 없이 다시 시전하여 효과를 조기에 종료할 수 있습니다. 정지 마법은 움직일 수 없는 아군에게 효과가 있지만, 던전 층 사이를 이동시킬 수는 없습니다. \n\n_+1: 정지 마법은 최대 60턴 동안 지속됩니다._\n\n_+2: 정지 마법은 최대 90턴 동안 지속됩니다._\n\n_+3: 정지 마법은 최대 120턴 동안 지속됩니다._\n\n_+4: 정지 마법은 최대 150턴 동안 지속됩니다._\n\n 성직자는 아군이 정지 상태일 때 광선 마법을 시전하여 다시 소환하거나, 생명 연결 마법을 시전하여 미리 효과를 적용할 수 있습니다. 단, 아군은 정지 상태일 때는 생명 연결 마법의 효과를 받지 못합니다.
actors.hero.talent.stasis.title=정체
actors.hero.talent.strengthening_meal.desc=+1: 음식을 먹으면 결투사는 다음 2번의 물리 공격으로 적을 공격할 때마다 추가 피해 3을 얻습니다. +2: 음식을 먹으면 결투사는 다음 3번의 물리 공격으로 적을 공격할 때마다 추가 피해 3을 얻습니다.
actors.hero.talent.strengthening_meal.title=영양 강화 식사
actors.hero.talent.striking_force.desc=+1: 원소 공격 효과의 위력이 30% 증가합니다. +2: 원소 공격 효과의 위력이 60% 증가합니다. +3: 원소 공격 효과의 위력이 90% 증가합니다. +4: 원소 공격 효과의 위력이 120% 증가합니다.
actors.hero.talent.striking_force.title=타격력
actors.hero.talent.striking_wave.desc=+1: 충격파는 30% 확률로 마법 부여 및 콤보와 같은 적중 시 효과를 발동합니다. +2: 충격파는 60% 확률로 마법 부여 및 콤보와 같은 적중 시 효과를 발동합니다. +3: 충격파는 90% 확률로 마법 부여 및 콤보와 같은 적중 시 효과를 발동합니다. +4: 충격파는 100% 확률로 마법 부여 및 콤보와 같은 적중 시 효과를 발동하며, 마법 부여의 위력을 20% 증가시킵니다.
actors.hero.talent.striking_wave.title=강렬한 파도
actors.hero.talent.strongman.desc=+1: 전사의 힘이 8% 증가합니다(소수점 이하 버림). +2: 전사의 힘이 13% 증가합니다(소수점 이하 버림). +3: 전사의 힘이 18% 증가합니다(소수점 이하 버림).
actors.hero.talent.strongman.title=스트롱맨
actors.hero.talent.sucker_punch.desc=+1: 도적은 적을 처음 기습 공격할 때 1-2의 추가 피해를 줍니다. +2: 도적은 적을 처음 기습 공격할 때 2의 추가 피해를 줍니다.
actors.hero.talent.sucker_punch.title=기습 공격
actors.hero.talent.sunray.desc=+1: 성직자는 1 충전량을 소모하여 4~8의 피해를 주고 대상을 4턴 동안 실명시키는 주문인 _선레이_를 시전할 수 있습니다. +2: 성직자는 1 충전량을 소모하여 6~12의 피해를 주고 대상을 6턴 동안 실명시키는 주문인 _선레이_를 시전할 수 있습니다. 선레이는 대상을 한 번만 실명시킬 수 있지만, 대상이 이미 선레이로 실명된 상태라면 대신 마비를 걸습니다. 선레이는 악마와 언데드 적에게 항상 최대 피해를 줍니다.
actors.hero.talent.sunray.meta_desc=만약 이 특성을 다른 영웅이 얻게 된다면, 지팡이와 유물이 적의 시야를 4턴 동안 흐리게 만드는 효과를 가지게 되며, +1 보너스에서는 15%, +2 보너스에서는 25%의 확률로 발동합니다.
actors.hero.talent.sunray.title=햇살
actors.hero.talent.survivalists_intuition.desc=+1: 사냥꾼은 투척 무기를 3배 더 빠르게 식별합니다. +2: 사냥꾼은 투척 무기로 공격에 성공했을 때 그 무기를 식별합니다.
actors.hero.talent.survivalists_intuition.title=생존주의자의 직감
actors.hero.talent.sustained_retribution.desc=+1: 전사는 1회 공격에 100% 보너스 피해를 주는 대신, 2회 공격에 걸쳐 115% 보너스 피해를 줍니다. +2: 전사는 1회 공격에 100% 보너스 피해를 주는 대신, 3회 공격에 걸쳐 130% 보너스 피해를 줍니다. +3: 전사는 1회 공격에 100% 보너스 피해를 주는 대신, 4회 공격에 걸쳐 145% 보너스 피해를 줍니다. +4: 전사는 1회 공격에 100% 보너스 피해를 주는 대신, 5회 공격에 걸쳐 160% 보너스 피해를 줍니다.
actors.hero.talent.sustained_retribution.title=지속적인 응징
actors.hero.talent.swift_equip.desc=+1: 결투사는 20턴마다 한 번씩 장착한 무기를 즉시 교체할 수 있습니다. +2: 결투사는 20턴마다 두 번씩 장착한 무기를 즉시 교체할 수 있습니다. 이 특성을 보유하고 있고 재사용 대기시간이 아닐 경우, 장착하지 않은 무기를 빠르게 사용하면 장착됩니다.
actors.hero.talent.swift_equip.title=신속 장비
actors.hero.talent.swift_spirit.desc=+1: 영혼 매의 이동 속도가 2에서 2.5타일로 증가하고, 처음 2번의 공격은 반드시 회피합니다. +2: 영혼 매의 이동 속도가 2에서 3타일로 증가하고, 처음 4번의 공격은 반드시 회피합니다. +3: 영혼 매의 이동 속도가 2에서 3.5타일로 증가하고, 처음 6번의 공격은 반드시 회피합니다. +4: 영혼 매의 이동 속도가 2에서 4타일로 증가하고, 처음 8번의 공격은 반드시 회피합니다.
actors.hero.talent.swift_spirit.title=빠른 영혼
actors.hero.talent.telefrag.desc=+1: 마법사가 다른 캐릭터로 변신하면 10~15의 피해를 주지만, 자신도 5의 피해를 입습니다. +2: 마법사가 다른 캐릭터로 변신하면 20~30의 피해를 주지만, 자신도 10의 피해를 입습니다. +3: 마법사가 다른 캐릭터로 변신하면 30~45의 피해를 주지만, 자신도 15의 피해를 입습니다. +4: 마법사가 다른 캐릭터로 변신하면 40~60의 피해를 주지만, 자신도 20의 피해를 입습니다. 이 특성으로는 영웅이 죽지 않으며, 자신에게 주는 피해는 마법 저항 효과로 감소시킬 수 있습니다.
actors.hero.talent.telefrag.title=텔레프래그
actors.hero.talent.thiefs_intuition.desc=+1: 도적은 반지를 2배 더 빠르게 식별하고, 반지를 장착할 때 반지의 종류를 식별합니다. +2: 도적은 반지를 장착할 때 반지의 종류를 식별하고, 반지를 주울 때도 반지의 종류를 식별합니다.
actors.hero.talent.thiefs_intuition.title=도둑의 직감
actors.hero.talent.twin_upgrades.desc=+1: 챔피언이 장착한 두 무기 중 하나가 다른 무기보다 레벨이 낮고 티어가 2단계 이상 낮을 경우, 해당 무기는 다른 무기의 레벨로 상향 조정됩니다. +2: 챔피언이 장착한 두 무기 중 하나가 다른 무기보다 레벨이 낮고 티어가 1단계 이상 낮을 경우, 해당 무기는 다른 무기의 레벨로 상향 조정됩니다. +3: 챔피언이 장착한 두 무기 중 하나가 다른 무기보다 레벨이 낮고 티어가 같거나 낮을 경우, 해당 무기는 다른 무기의 레벨로 상향 조정됩니다.
actors.hero.talent.twin_upgrades.title=쌍둥이 업그레이드
actors.hero.talent.unencumbered_spirit.desc=+1: 수도사는 3단계 이하 장비를 착용할 때마다 에너지가 50% 증가합니다. +2: 수도사는 2단계 이하 장비를 착용할 때마다 에너지가 75% 증가합니다. 3단계 장비의 효과는 변경되지 않습니다. +3: 수도사는 1단계 이하 장비를 착용할 때마다 에너지가 100% 증가합니다. 2단계와 3단계 장비의 효과는 변경되지 않습니다. 또한 천 갑옷과 징 박힌 장갑을 무료로 얻습니다. 참고로 이 특성은 맨손 공격이나 힘의 반지를 착용한 상태에서 공격할 때는 아무런 효과가 없습니다.
actors.hero.talent.unencumbered_spirit.title=자유로운 정신
actors.hero.talent.varied_charge.desc=+1: 챔피언은 서로 다른 무기 능력을 두 번 사용하면 시간 제한 없이 즉시 무기 충전량 0.17을 회복합니다. +2: 챔피언은 서로 다른 무기 능력을 두 번 사용하면 시간 제한 없이 즉시 무기 충전량 0.33을 회복합니다. +3: 챔피언은 서로 다른 무기 능력을 두 번 사용하면 시간 제한 없이 즉시 무기 충전량 0.5를 회복합니다.
actors.hero.talent.varied_charge.title=다양한 요금
actors.hero.talent.veterans_intuition.desc=+1: 전사는 무기를 1.75배 더 빠르게, 갑옷을 2.5배 더 빠르게 식별합니다. +2: 전사는 무기를 2.5배 더 빠르게 식별하고, 갑옷을 착용하면 갑옷을 식별합니다.
actors.hero.talent.veterans_intuition.title=베테랑의 직감
actors.hero.talent.wall_of_light.desc=+1: 팔라딘은 3회 사용 횟수를 소모하여 팔라딘 앞에 3칸 너비의 단단한 벽을 생성하는 마법인 '빛의 벽'을 시전할 수 있습니다. 이 벽은 적을 밀쳐내고 20턴 동안 지속됩니다. +2: 팔라딘은 3회 사용 횟수를 소모하여 팔라딘 앞에 5칸 너비의 단단한 벽을 생성하는 마법인 '빛의 벽'을 시전할 수 있습니다. 이 벽은 적을 밀쳐내고 20턴 동안 지속됩니다. +3: 팔라딘은 3회 사용 횟수를 소모하여 팔라딘 앞에 7칸 너비의 단단한 벽을 생성하는 마법인 '빛의 벽'을 시전할 수 있습니다. 이 벽은 적을 밀쳐내고 20턴 동안 지속됩니다. 벽은 동서남북 방향 또는 대각선 방향으로 설치할 수 있으며, 한 위치에 하나의 벽만 존재할 수 있습니다. 시간.
actors.hero.talent.wall_of_light.title=빛의 벽
actors.hero.talent.wand_preservation.desc=+1: 마법사가 지팡이에 새로운 마법봉을 부여하면 기존 마법봉은 +0으로 되돌아갑니다. 단, 이는 한 번만 가능합니다. +2: 마법사가 지팡이에 새로운 마법봉을 부여하면 기존 마법봉은 +0으로 되돌아갑니다. 이 과정은 영웅 레벨 1만큼의 재사용 대기시간으로 반복할 수 있습니다.
actors.hero.talent.wand_preservation.meta_desc=만약 이 특성을 다른 영웅이 얻게 된다면, 연금술 솥에 지팡이를 넣을 때 얻는 마법 수지의 양이 +1일 때는 1만큼, +2일 때는 2만큼 증가합니다.
actors.hero.talent.wand_preservation.title=지팡이 보존
actors.hero.talent.weapon_recharging.desc=+1: 결투사는 지팡이 또는 유물 재충전 버프 효과를 받는 동안 15턴마다 무기 충전량을 1개 얻습니다. +2: 결투사는 지팡이 또는 유물 재충전 버프 효과를 받는 동안 10턴마다 무기 충전량을 1개 얻습니다.
actors.hero.talent.weapon_recharging.meta_desc=만약 이 특성을 다른 영웅이 얻게 되면, 재충전 속도가 +1일 때 근접 공격력이 5% 증가하고, 재충전 속도가 +2일 때 근접 공격력이 7.5% 증가합니다.
actors.hero.talent.weapon_recharging.title=무기 재충전 중
actors.hero.talent.wide_search.desc=+1: 도적의 탐색 반경이 5x5 정사각형에서 7x7 원형으로 증가합니다. +2: 도적의 탐색 반경이 5x5 정사각형에서 7x7 정사각형으로 증가합니다.
actors.hero.talent.wide_search.meta_desc=만약 이 특성을 다른 영웅이 얻게 되면, 탐색 반경이 +1 증가 시 3x3 정사각형에서 5x5 원형으로, +2 증가 시 5x5 정사각형으로 증가합니다.
actors.hero.talent.wide_search.title=광범위한 검색
actors.hero.talent.wild_momentum.desc=+1: 영혼의 활로 적을 처치하면 자연의 힘 지속 시간이 1턴 연장됩니다. 최대 2턴까지 연장할 수 있습니다. +2: 영혼의 활로 적을 처치하면 자연의 힘 지속 시간이 2턴 연장됩니다. 최대 4턴까지 연장할 수 있습니다. +3: 영혼의 활로 적을 처치하면 자연의 힘 지속 시간이 3턴 연장됩니다. 최대 6턴까지 연장할 수 있습니다. +4: 영혼의 활로 적을 처치하면 자연의 힘 지속 시간이 4턴 연장됩니다. 최대 8턴까지 연장할 수 있습니다.
actors.hero.talent.wild_momentum.title=엄청난 추진력
actors.hero.talent.wild_power.desc=+1: 야생 마법을 사용할 때, 지팡이의 공격력이 2 또는 3만큼 증가하며, 최대 +4까지 강화됩니다. +2: 야생 마법을 사용할 때, 지팡이의 공격력이 3만큼 증가하며, 최대 +5까지 강화됩니다. +3: 야생 마법을 사용할 때, 지팡이의 공격력이 3 또는 4만큼 증가하며, 최대 +6까지 강화됩니다. +4: 야생 마법을 사용할 때, 지팡이의 공격력이 4만큼 증가하며, 최대 +7까지 강화됩니다.
actors.hero.talent.wild_power.title=야생의 힘
actors.mobs.acidic.desc=이 거대한 거미처럼 생긴 악마 같은 생명체는 근접전을 피하고, 먼 거리에서 치명적인 톱니 모양의 가시를 발사하는 것을 선호합니다. 이 녀석은 부식성 점액을 흘리고 있는 것처럼 보입니다.
actors.mobs.acidic.name=산성 전갈자리
actors.mobs.albino.desc=이 종은 순백색 털과 톱니 모양의 이빨을 가진 희귀한 유대류 쥐입니다.
actors.mobs.albino.discover_hint=이 적은 던전의 특정 지역에서 드물게 나타납니다.
actors.mobs.albino.name=알비노 쥐
actors.mobs.armoredbrute.desc=최상위 계급의 놀 브루트들은 종종 강력한 갑옷을 착용하여 자신의 지위를 과시합니다. 이 갑옷은 이 브루트들을 물리적 피해에 훨씬 더 강하게 만들어주며, 뛰어난 절제력 덕분에 부상으로 쓰러지기 훨씬 전까지 오랫동안 분노 상태를 유지할 수 있습니다.
actors.mobs.armoredbrute.name=갑옷 입은 짐승
actors.mobs.armoredstatue.desc=언뜻 보면 이 던전에 있는 수많은 생명 없는 조각상 중 하나처럼 보일지 모르지만, 붉게 빛나는 눈이 그 정체를 드러냅니다. 입고 있는 갑옷 덕분에 상태가 매우 좋아 보여서, 죽이기가 상당히 어려울 것 같습니다.
actors.mobs.armoredstatue.desc_arm_wep=조각상 자체는 돌로 만들어졌지만, 조각상이 들고 있는 _%1$s_와 _%2$s_는 진짜처럼 보인다.
actors.mobs.armoredstatue.name=갑옷을 입은 조각상
actors.mobs.bandit.desc=지하 감옥 깊숙한 곳은 언제나 온갖 범죄자들의 은신처였다. 햇빛이 닿지 않는 깊은 곳에서 오랜 시간을 보내는 동안 제정신을 유지할 수 있는 범죄자는 많지 않았다. 오래전부터 이 미친 도둑들과 산적들은 자신들이 누구인지, 왜 도둑질을 하는지조차 잊어버렸다.
actors.mobs.bandit.name=미친 도적
actors.mobs.bat.desc=이 동굴에 사는 활기차고 끈질긴 생물들은 겉보기보다 훨씬 위험합니다. 공격에 성공할 때마다 체력을 회복하기 때문에 훨씬 큰 적도 물리칠 수 있습니다.
actors.mobs.bat.name=흡혈박쥐
actors.mobs.bee.desc=크기는 작지만, 황금벌은 자신의 벌집을 맹렬하게 지키는 경향이 있습니다. 이 벌은 굉장히 사나워 보이니, 거리를 두는 게 좋겠습니다.
actors.mobs.bee.desc_honey=크기는 작지만, 황금벌은 자신의 벌집을 맹렬하게 지키는 경향이 있습니다. 이 벌은 진정된 듯 당신을 따라오고 싶어하는 것 같습니다.
actors.mobs.bee.discover_hint=이 캐릭터는 특정 아이템을 사용하면 찾을 수 있습니다.
actors.mobs.bee.name=황금 꿀벌
actors.mobs.brute$bruterage.desc=이 그놀 괴물은 죽어가고 있지만, 당신을 데려가려 합니다! \n\n 이 괴물은 시간이 지나거나 피해를 입으면 보호막이 사라지면 죽습니다. 그동안에는 공격력이 크게 증가하니 조심하세요! \n\n남은 보호막: %d.
actors.mobs.brute$bruterage.name=무자비한 분노
actors.mobs.brute.def_verb=막힌
actors.mobs.brute.desc=흉폭한 놀은 모든 놀 중에서 가장 크고 강하며 질깁니다. 심한 상처를 입으면 광분하여 적에게 더 큰 피해를 줍니다.
actors.mobs.brute.enraged=성나게 하는
actors.mobs.brute.name=흉폭한 놀
actors.mobs.causticslime.desc=이 점액은 아래에서 뿜어져 나오는 어둠의 마법에 오염된 것 같습니다. 평소의 초록색을 잃고 부식성 점액이 줄줄 흘러내리고 있습니다.
actors.mobs.causticslime.discover_hint=이 적은 던전의 특정 지역에서 드물게 나타납니다.
actors.mobs.causticslime.name=부식성 점액
actors.mobs.crab.desc=이 거대한 게들은 하수도 생태계의 최상위 포식자입니다. 속도가 매우 빠르며 두꺼운 갑각은 강한 충격에도 견딜 수 있습니다.
actors.mobs.crab.name=하수구 게
actors.mobs.crystalguardian.def_verb=막힌
actors.mobs.crystalguardian.desc=이 거대한 수정 수호자들은 밝게 빛나는 눈이 아니었다면 마치 조각상처럼 보였을 것입니다. 단단한 수정으로 이루어져 있어 움직임은 느리지만 매우 강인하므로, 가능한 한 오랫동안 수정 둥지에서 잠들도록 내버려 두는 것이 좋습니다. 크기 때문에 수정 수호자들은 좁은 공간에서는 훨씬 느리게 움직입니다. 또한 내구성이 매우 강해서 즉사시키는 것은 불가능합니다. 공격을 받아 쓰러뜨리거나 일시적으로 무력화시킬 수는 있지만, 잠시 후 다시 일어섭니다.
actors.mobs.crystalguardian.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.crystalguardian.name=크리스탈 가디언
actors.mobs.crystalmimic.ate=모방자가 당신의 %s를 먹어버렸어요!
actors.mobs.crystalmimic.desc=미믹은 원하는 어떤 형태로든 변신할 수 있는 마법 생물입니다. 던전에서는 거의 항상 보물 상자 모양으로 변신하여 방심한 모험가들을 유인합니다. 수정 미믹은 일반 미믹보다 더 교활하며, 전리품을 훔칠 때 충돌을 피하는 것을 선호합니다. 발각되면 재빨리 도망치려 하고, 공격할 때 적의 위치를 바꾸는 능력을 가지고 있습니다.
actors.mobs.crystalmimic.escaped=수정 모방체가 탈출했다!
actors.mobs.crystalmimic.name=결정 모방체
actors.mobs.crystalspire.alert=진동이 점점 커져 동굴 전체로 퍼져나간다!
actors.mobs.crystalspire.desc=이 거대한 초경질 수정 첨탑은 아마도 이 동굴에 있는 모든 기묘한 수정 생물들의 근원일 것입니다. 일반 무기로는 파괴할 수 없으니, 곡괭이를 사용해야 합니다. 파괴를 시작하기 전에 철저히 준비하세요. 이렇게 큰 수정은 캐내는 데 시간이 오래 걸릴 뿐 아니라, 방해받지 않고 작업하기는 어려울 것입니다. 첨탑 자체에도 방어 수단이 있을지도 모릅니다. 어쩌면 첨탑의 공격을 역이용하여 하수인들을 공격할 수도 있을 것입니다.
actors.mobs.crystalspire.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.crystalspire.name=크리스탈 스파이어
actors.mobs.crystalspire.warning=수정을 두드리면 진동합니다. 이렇게 계속하면 분명 사람들의 시선을 끌게 될 겁니다...
actors.mobs.crystalwisp.beam_kill=그 빛줄기가 당신을 죽였습니다...
actors.mobs.crystalwisp.desc=작고 화난 듯한 단단한 수정 덩어리가 떠다니며 밝은 빛을 발하고 있습니다. 특별히 강하지는 않지만, 수정 조각들은 시야가 확보되면 피해를 주는 광선을 발사합니다. 수정 조각들은 크기가 작아서 다양한 수정 돌출부 사이를 쉽게 이동할 수 있지만, 수정을 뚫고 광선을 발사할 수는 없습니다.
actors.mobs.crystalwisp.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.crystalwisp.name=크리스탈 위스프
actors.mobs.demonspawner.desc=이 뒤틀린 드워프 살덩어리는 이 지역에서 죽은 드워프들로부터 리퍼 데몬을 만들어내는 원인입니다. 이 악마들은 적을 공격하기 위해 모든 수단을 동원하는 데 아무런 거리낌이 없어 보입니다. 시각적으로는 끔찍하지만, 악마 생성기는 움직이거나 스스로를 방어할 수단이 없습니다. 하지만 엄청난 크기 때문에 쉽게 처치하기 어렵고, 위협을 받으면 리퍼 데몬을 더 빠르게 생성합니다. 악마 생성기는 악마의 힘의 근원과 연결되어 있는 것으로 보이며, 이들을 처치하면 그 힘을 약화시킬 수 있습니다.
actors.mobs.demonspawner.name=악마 소환기
actors.mobs.demonspawner.on_death=이곳의 악마적인 에너지는 산란체가 죽으면서 약해지는 것 같습니다.
actors.mobs.dm100.desc=DM-100은 이 감옥 아래 동굴에서 광부들을 보호하기 위해 설계된 초기형 드워프 '방어 기계'입니다. 하지만 전기 충격이 너무 약해서 지상의 인간 도시에 기증되었습니다. 수년간 사용되지 않고 방치되다가 결국 이 감옥으로 옮겨졌는데, 처음에는 간수가 너무 잔인하다고 여겨 사용하지 않았습니다. 그러나 죄수들이 점점 더 통제 불능 상태가 되자 DM-100은 필수 불가결한 존재가 되었습니다.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=번개가 당신을 죽였군요...
actors.mobs.dm200.desc=DM-200은 드워프 광부들을 지하 동굴과 도시에서 보호하기 위해 설계된 2세대 드워프 '방어 기계'입니다. 이전 모델보다 훨씬 크고 육중하며, 파괴적인 유압식 주먹으로 공격합니다. 하지만 커진 크기는 동시에 가장 큰 약점이기도 한데, 던전의 좁은 터널과 출입구를 통과할 수 없다는 점입니다. 드워프들은 DM-200의 기동성 부족을 보완하기 위해 멀리 있는 적이나 접근할 수 없는 적에게 독성 배기가스를 뿜어낼 수 있도록 설계했습니다.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200은 유독성 배기가스를 뿜어냅니다!
actors.mobs.dm201.desc=드워프들은 DM-200의 기동성 부족을 더욱 강조하는 실험을 잠시 진행하여 완전히 고정된 DM 모델들을 만들어냈습니다. DM-201은 DM-200을 개조한 것으로, 이동 능력이 없는 감시 포탑 역할을 합니다. 기동성이 부족한 대신 DM-201은 내구성과 공격력이 훨씬 뛰어납니다. DM-201은 배기가스를 배출할 엔진이 없기 때문에 드워프들은 대신 부식성 가스 수류탄을 장착했습니다! 하지만 DM-201은 이 수류탄을 조심스럽게 사용하며, 원거리에서 공격받을 때만 투척합니다.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201이 부식성 수류탄을 던집니다!
actors.mobs.dm300.charge_lost=송전탑 파괴! 지역 전력 공급으로 전환!
actors.mobs.dm300.charging=피해 발생! 전력탑 가동!
actors.mobs.dm300.charging_hint=DM-300은 전력탑에서 에너지를 공급받는 동안 무적입니다!
actors.mobs.dm300.def_verb=막힌
actors.mobs.dm300.defeated=심각한 손상! 셧다운 시도 중-
actors.mobs.dm300.desc=이 기계는 수백 년 전 드워프들이 만들었습니다. 이후 드워프들은 기계 대신 골렘과 정령, 심지어 악마까지 부리기 시작했습니다. 결국 그것이 문명의 몰락을 불렀습니다. DM-300과 비슷한 기계들은 주로 건설과 채굴에 쓰였으며, 때로는 도시를 지키기도 했습니다.
actors.mobs.dm300.desc_supercharged=DM-300은 현재 전기 에너지로 가득 차 있습니다. 이 상태에서 DM-300은 피해를 입지 않으며 두 배 빠른 속도로 움직입니다! 또한, 드릴이 매우 빠르게 회전하여 단단한 바위를 뚫을 수 있지만, 이때 이동 속도는 훨씬 느려집니다. DM-300이 초강력 상태일 때는 직접 공격하는 것은 무의미하지만, 주변의 무언가가 DM-300에게 에너지를 공급하고 있을 것이므로, 그것을 파괴하면 DM-300의 힘이 약해질 수 있습니다.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=무단 출입자가 감지되었습니다!
actors.mobs.dm300.pylons_destroyed=경보! 전력망 불안정 감지!
actors.mobs.dm300.rankings_desc=DM-300에 짓밟혔다
actors.mobs.dm300.shield=DM-300은 노출된 전선에서 전력을 끌어와 자체적으로 차폐합니다!
actors.mobs.dm300.supercharged=파괴하라! 파괴하라! 파괴하라!
actors.mobs.dwarfking$dkghoul.rankings_desc=드워프 왕 앞에 쓰러졌다
actors.mobs.dwarfking$dkgolem.rankings_desc=드워프 왕 앞에 쓰러졌다
actors.mobs.dwarfking$dkmonk.rankings_desc=드워프 왕 앞에 쓰러졌다
actors.mobs.dwarfking$dkwarlock.rankings_desc=드워프 왕 앞에 쓰러졌다
actors.mobs.dwarfking.defeated=당신은... 우리 모두를 파멸로 몰아넣었어요...
actors.mobs.dwarfking.desc=수년 전, 드워프 궁정의 최고 마법사 중 한 명이 생과 사를 좌우하는 막강한 힘을 부여하는 비밀을 밝혀냈습니다. 그는 곧 이 힘을 이용하여 동료들과 왕, 그리고 결국 모든 드워프 시민을 타락시켰습니다. 이제 그는 언데드 군단을 다스리는 왕이 되었습니다. 드워프 왕은 공격적인 적이며, 언데드 하수인 무리를 이끌고 적을 포위하여 압도하려 할 것입니다.
actors.mobs.dwarfking.enraged=넌 날 죽일 수 없어, %s. 난 불멸이니까!
actors.mobs.dwarfking.lifelink_1=노예야, 네 정수가 필요해!
actors.mobs.dwarfking.lifelink_2=나를 위해 피를 흘려라, 노예야!
actors.mobs.dwarfking.losing=안 돼! 이러면 안 돼... 아래에 뭐가 있는지 넌 전혀 몰라...
actors.mobs.dwarfking.name=드워프의 왕
actors.mobs.dwarfking.notice=어떻게 감히! 당신은 지금 무슨 일에 참견하고 있는지 전혀 모르는군요!
actors.mobs.dwarfking.rankings_desc=드워프 왕 앞에 쓰러졌다
actors.mobs.dwarfking.teleport_1=저들을 처리해라, 노예야!
actors.mobs.dwarfking.teleport_2=노예야, 놈들을 바쁘게 해!
actors.mobs.dwarfking.wave_1=이제 그만! 내 노예들아, 일어나라!
actors.mobs.dwarfking.wave_2=더! 왕을 위해 피를 흘려라!
actors.mobs.dwarfking.wave_3=쓸모없어! 당장 죽여버려!
actors.mobs.ebonymimic.desc=미믹은 원하는 어떤 형태로든 변신할 수 있는 마법 생물입니다. 던전에서는 거의 항상 보물 상자 모양으로 변신하여 방심한 모험가들을 유인합니다. 에보니 미믹은 거의 투명해질 수 있는 능력을 가진 은밀한 미믹입니다. 모험가들이 접촉할 가능성이 높은 물건들에 숨어 있지만, 그 안에는 미믹이 숨겨져 있기도 합니다. 일단 발견되면 일반 미믹보다 특별히 더 강한 것은 아니지만, 기습 공격은 치명적입니다.
actors.mobs.ebonymimic.discover_hint=특정한 장신구를 착용하면 이 적을 찾을 수 있습니다.
actors.mobs.ebonymimic.hidden_desc=뭔가 있는 것 같긴 한데, 거의 완전히 투명해요.
actors.mobs.ebonymimic.hidden_name=의심스러운 윤곽
actors.mobs.ebonymimic.name=흑단 모방
actors.mobs.ebonymimic.reveal=거기에 모방범이 있었어요!
actors.mobs.elemental$chaoselemental.desc=정령은 강력한 오컬트 마법이 제대로 제어되지 않을 때 생성되는 혼돈의 존재입니다. 정령은 지능이 매우 낮으며, 대개 특정 유형의 마법과 연관되어 있습니다. 혼돈 정령은 특정 원소로 안정화되지 않은 희귀하고 위험한 정령으로, 공격 시 예측 불가능한 거친 마법을 휘두릅니다.
actors.mobs.elemental$chaoselemental.name=혼돈의 정령
actors.mobs.elemental$fireelemental.desc=정령은 강력한 오컬트 마법이 제대로 제어되지 않을 때 생성되는 혼돈의 생명체입니다. 정령은 지능이 매우 낮으며, 일반적으로 특정 유형의 마법과 연관되어 있습니다. 불의 정령은 흔한 정령 유형으로, 불의 마법으로 피해를 입힙니다. 근접 공격으로 대상을 불태우고, 때때로 화염구를 발사하기도 합니다.
actors.mobs.elemental$fireelemental.name=불의 정령
actors.mobs.elemental$frostelemental.desc=정령은 강력한 오컬트 마법이 제대로 제어되지 않을 때 생성되는 혼돈의 생명체입니다. 정령은 지능이 매우 낮으며, 일반적으로 특정 유형의 마법과 연관되어 있습니다. 서리 정령은 흔한 정령 유형으로, 냉기 마법으로 적을 약화시킵니다. 근접 공격과 가끔 원거리 공격으로 대상을 얼립니다. 서리 정령의 마법은 물 속에서 훨씬 더 효과적입니다.
actors.mobs.elemental$frostelemental.name=서리 정령
actors.mobs.elemental$newbornfireelemental.charging=정령이 충전 중입니다!
actors.mobs.elemental$newbornfireelemental.desc=정령은 강력한 오컬트 마법이 제대로 제어되지 않을 때 종종 생성되는 혼돈의 존재입니다. 정령은 지능이 매우 낮으며, 대개 특정 유형의 마법과 연관되어 있습니다. 이 불의 정령은 방금 소환되었지만 여전히 매우 위험합니다!
actors.mobs.elemental$newbornfireelemental.desc_ally=이 정령은 마법으로 소환되었기 때문에 불꽃을 좀 더 자유자재로 다룰 수 있습니다. 원거리 공격은 불가능하지만, 근접 공격으로 적에게 불을 붙일 수 있습니다.
actors.mobs.elemental$newbornfireelemental.desc_boss=소환 과정이 혼란스럽기 때문에, 이 정령은 한 턴 동안 충전한 후에도 정확도가 떨어지는 화염 공격만 퍼뜨릴 수 있습니다.
actors.mobs.elemental$newbornfireelemental.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.elemental$newbornfireelemental.name=갓 태어난 불의 정령
actors.mobs.elemental$shockelemental.desc=정령은 강력한 오컬트 마법이 제대로 제어되지 않을 때 생성되는 혼돈의 생명체입니다. 정령은 지능이 매우 낮으며, 대개 특정 유형의 마법과 연관되어 있습니다. 충격 정령은 흔하지 않은 유형의 정령으로, 전기와 섬광으로 적을 교란합니다. 근접전에서는 주변 적에게 전기 아크를 발생시키고, 적이 물 속에 있을 경우 주 대상에게 추가 피해를 입힙니다. 또한 때때로 원거리에서 목표물을 향해 빛줄기를 집중시켜 일시적으로 시야를 가립니다.
actors.mobs.elemental$shockelemental.name=충격 원소
actors.mobs.eye.deathgaze_kill=그 죽음의 시선이 너를 죽였어...
actors.mobs.eye.desc=이 악마는 '증오의 구체'라고도 불립니다. 적을 발견하면 무작정 죽음의 시선을 쏘아 대며, 아군까지 무시하고 다치게 하는 일이 잦습니다.
actors.mobs.eye.name=악마의 눈
actors.mobs.fetidrat.desc=이 쥐는 분명히 뭔가 잘못됐습니다. 기름지고 검은 털과 썩어가는 피부는 이전에 봤던 건강한 쥐들과는 너무나 다릅니다. 옅은 녹색 눈은 더욱 위협적으로 보입니다. 쥐는 지독한 악취를 풍기고 있는데, 가까이서 맡으면 그 냄새가 너무 강합니다. 쥐의 입에서는 검은 액체가 흘러나오고, 바닥을 파먹지만 물에는 녹는 것 같습니다.
actors.mobs.fetidrat.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.fetidrat.name=악취 나는 쥐
actors.mobs.fungalcore.desc=이 거대한 버섯이 이 동굴 안의 모든 곰팡이 활동의 근원임이 틀림없다.
actors.mobs.fungalcore.name=균류 핵
actors.mobs.fungalsentry.desc=이 유난히 키가 큰 버섯은 이 동굴에 서식하는 더 큰 균류 네트워크의 방어 거점 역할을 합니다. 움직이지는 않지만 시야에 들어오는 모든 것에 정확한 독을 발사합니다. 이 독의 위력은 비교적 약하지만, 매우 빠르게 치명적인 양의 독을 축적할 수 있습니다. 처치할 수는 있지만, 피하는 것이 가장 좋습니다.
actors.mobs.fungalsentry.name=곰팡이 파수꾼
actors.mobs.fungalspinner.desc=이 동굴 거미줄치는 생물은 기생 곰팡이에 의해 조종되는 것으로 보입니다. 곰팡이는 거미줄과 독주머니 대신 곰팡이 성장 능력을 부여하여 거미줄치의 능력을 변화시켰습니다. 이 곰팡이 거미줄치는 거미줄 대신 식물체를 뱉어내어 곰팡이 식물을 퍼뜨리고 플레이어를 뿌리박히게 할 수도 있습니다. 독을 사용하지는 않지만, 버섯 근처에 있으면 상당한 피해 저항력을 얻습니다.
actors.mobs.fungalspinner.name=균류 방적기
actors.mobs.ghoul.desc=드워프 사회가 서서히 붕괴하기 시작하고, 현 드워프 왕이 절대 권력을 장악하면서, 약하거나 그에게 저항하는 자들은 가혹한 대우를 받았습니다. 왕은 어둠의 마법을 다루는 데 더욱 능숙해지면서 이 드워프들을 자신의 뜻대로 조종했고, 이제 그들은 그의 군대의 보병이 되었습니다. 구울은 혼자서는 그다지 강하지 않지만, 항상 무리를 지어 다니며 수가 많을수록 죽이기가 훨씬 어렵습니다. 구울은 쓰러져도 근처에 다른 구울이 있는 한 몇 턴 후에 다시 일어납니다.
actors.mobs.ghoul.name=드워프 구울
actors.mobs.gnoll.desc=놀은 하이에나와 비슷하게 생긴 인간형 생명체입니다. 그들은 하수도와 지하 감옥에 살며, 때때로 지상으로 올라와 습격을 일삼습니다. 놀 정찰병은 무리의 정규 구성원이며, 브루트만큼 강하지도 않고 샤먼만큼 지능적이지도 않습니다.
actors.mobs.gnoll.name=놀 스카웃
actors.mobs.gnollexile.desc=이 회색 털의 놀은 어깨에 추방자임을 나타내는 커다란 표식이 있다. 놀들은 보통 명령을 무시하거나 법을 어겨서 사회에서 추방당한다. 추방자들은 살아남기 위해 강하고 영리해야 하는데, 이 놀은 손에 든 창을 능숙하게 다룰 줄 아는 것처럼 보인다.
actors.mobs.gnollexile.desc_aggro=그놀 추방자는 분노에 찬 눈으로 주위를 둘러보았다. 무언가가 그를 결국 싸우기로 결심하게 만든 모양이다. 저 창을 조심해!
actors.mobs.gnollexile.desc_passive=그놀 추방자는 공격하러 움직이지 않습니다. 여기 있는 다른 그놀들처럼 공격적인 것 같지도 않고, 아마도 당신과 싸우는 게 가치가 없다고 생각하는 것 같습니다. 그냥 지나가게 놔둬도 되지만, 배낭에 유용한 아이템이 가득 들어있을지도 모릅니다...
actors.mobs.gnollexile.name=놀 추방자
actors.mobs.gnollexile.seen_aggro=창을 든 놀이 공격하러 움직인다!
actors.mobs.gnollexile.seen_passive=창을 든 놀은 당신을 경계하는 눈빛으로 바라보지만, 공격하려 들지는 않습니다.
actors.mobs.gnollgeomancer.alert=풍수사가 깨어났다! 그가 미친 듯이 웃으며 뛰어오르자 동굴 전체가 흔들리는 듯했다!
actors.mobs.gnollgeomancer.desc=이 엄청나게 큰 거구의 놀은 이 지역의 온갖 토목 마법의 근원이자 모든 놀 활동을 총괄하는 장본인임이 틀림없다. 이 지역의 놀 공병들과는 달리, 이 지오맨서는 마법에 매우 능숙하여 던지거나 떨어지는 돌에 피해를 입지 않는다. 다만 근접 전투에는 전혀 능숙하지 않다.
actors.mobs.gnollgeomancer.desc_armor=지오맨서는 현재 바위 갑옷으로 둘러싸여 있습니다. 지오맨서에게 피해를 입히려면 가까이 다가가 곡괭이로 갑옷을 부숴야 합니다.
actors.mobs.gnollgeomancer.desc_armor_sapper=근처에 있는 놀 사퍼가 지오맨서의 바위 갑옷을 강화하는 장치를 들고 있습니다. 지금은 전혀 피해를 줄 수 없을 겁니다!
actors.mobs.gnollgeomancer.desc_sleeping=이 인상적인 키를 자랑하는 그놀 주술사는 바위층에 둘러싸여 마치 조각상처럼 보입니다. 자세히 보면 바위가 주술사의 숨소리에 맞춰 마법처럼 움직이는 것을 알 수 있습니다. 이렇게 바위에 둘러싸여 있는 동안에는 해를 입힐 수 없으며, 마치 흙 속에서 편안하게 낮잠을 즐기는 듯합니다. 곡괭이로 바위층을 부술 수는 있겠지만, 그럴 때는 싸울 준비를 단단히 하셔야 할 겁니다. 이 주변의 온갖 흙을 움직이는 마법은 분명 이 주술사의 소행이며, 모든 그놀 활동을 조장하는 존재일 것입니다. 싸우기 전에 주변에 흩어져 있는 그놀들을 먼저 처치하는 것이 좋을지도 모릅니다.
actors.mobs.gnollgeomancer.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.gnollgeomancer.name=그놀 지오맨서
actors.mobs.gnollgeomancer.rock_kill=날아온 바위가 당신을 죽였어요...
actors.mobs.gnollgeomancer.rockfall_kill=낙석에 맞아 죽었군요...
actors.mobs.gnollgeomancer.warning=풍수사가 움직이기 시작합니다. 계속하기 전에 준비가 되었는지 확인하세요!
actors.mobs.gnollguard.def_verb=막힌
actors.mobs.gnollguard.desc=창과 방패를 들고 있지만 투구는 쓰지 않은 크고 강인해 보이는 놀이 경비병으로 서 있습니다. 이들은 아마도 야생 동물의 침입으로부터 광산을 지키기 위해 동원된 훈련 중인 깡패들일 것입니다. 놀 경비병은 한 손으로 창을 휘두를 만큼 강하지만, 창을 능숙하게 다루지는 못합니다. 멀리서 공격하려면 상당히 넓은 공간이 필요하며, 가까이 다가가면 피해를 훨씬 덜 입힐 것입니다.
actors.mobs.gnollguard.desc_armor=근처에 있는 놀 사퍼가 이 경비병에게 흙 갑옷을 부여하는 장치를 들고 있는데, 이 갑옷은 경비병이 받는 피해를 크게 줄여줍니다.
actors.mobs.gnollguard.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.gnollguard.name=놀 가드
actors.mobs.gnollguard.spear_warn=놀이 창끝으로 맹렬한 일격을 가한다!
actors.mobs.gnollsapper.desc=작고 약하지만 지능이 뛰어난 놀은 옅은 털에 다양한 도구가 가득 담긴 가방을 메고 있습니다. 아마도 검은 금의 탐사와 채굴을 돕기 위해 온 것으로 보이며, 근처에 경비병이 배치되어 있습니다. 싸울 수는 있지만 공격력은 놀 정찰병보다 약할 뿐입니다. 직접 싸우기보다는 가지고 있는 다양한 도구를 이용해 바위투성이 환경을 공격하게 만드는 것을 선호합니다. 하지만 스스로는 땅을 움직이는 마법을 모르기 때문에 도구를 함부로 사용하는 경향이 있습니다. 따라서 그들의 공격을 역이용하거나 경비병을 공격할 수 있는 다양한 방법이 있을 것입니다.
actors.mobs.gnollsapper.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.gnollsapper.name=놀 사퍼
actors.mobs.gnolltrickster.desc=놀의 기준으로 봐도 기괴하게 생긴 생물체였다. 사악한 미소를 지으며 몸을 앞으로 구부리고 어깨에 멘 가방을 거의 감싸 안은 듯했다. 눈은 공포와 흥분이 기묘하게 뒤섞인 채 크게 뜨여 있었다. 가방 안에는 조잡하게 만들어진 다트가 가득 들어 있었는데, 다트 끝에는 각각 다른 유해 물질이 묻어 있는 듯했다.
actors.mobs.gnolltrickster.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.gnolltrickster.name=놀 트릭스터
actors.mobs.goldenmimic.desc=미믹은 원하는 어떤 형태로든 변신할 수 있는 마법 생물입니다. 던전에서는 대부분 보물 상자 모양으로 변신하여 방심한 모험가들을 유인합니다. 황금 미믹은 일반 미믹보다 훨씬 강하며, 가장 강한 모험가들을 노립니다. 황금 미믹은 더 좋은 전리품을 가지고 있지만, 일반 미믹보다 훨씬 강력합니다.
actors.mobs.goldenmimic.name=황금 모방
actors.mobs.golem.def_verb=막힌
actors.mobs.golem.desc=드워프들은 기계에 관한 지식과 새로 익힌 정령 속박술을 결합하려 했습니다. 가장 다루기 쉽다고 여긴 땅의 정령을 골렘의 기계 몸에 영혼으로 넣었습니다. 그래도 의식에서 아주 작은 실수만 저지르면 골렘이 날뛰곤 했습니다.
actors.mobs.golem.name=골렘
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=꿀꺽... 꿀꺽...
actors.mobs.goo.desc=구에 대해서는 알려진 것이 거의 없습니다. 어쩌면 생명체가 아니라, 하수도의 물질이 뭉쳐 희미한 자아를 갖게 된 것일지도 모릅니다.
actors.mobs.goo.enraged=성나게 하는
actors.mobs.goo.gluuurp=꿀꺽꿀꺽!
actors.mobs.goo.name=구
actors.mobs.goo.notice=꿀꺽꿀꺽!
actors.mobs.goo.pumpup=구가 스스로를 팽창시키고 있어요!
actors.mobs.goo.rankings_desc=끈적한 물질에 흡수됨
actors.mobs.greatcrab.def_verb=막힌
actors.mobs.greatcrab.desc=이 게는 다른 하수도 게와 비교해도 엄청나게 거대합니다. 푸른 껍데기는 갈라진 틈과 따개비로 뒤덮여 있어 오랜 세월을 견뎌왔음을 보여줍니다. 거대한 집게발로 간신히 균형을 잡으며 느릿느릿 움직입니다. 이 게는 집게발이 하나뿐이지만, 그 거대한 몸집이 이를 충분히 보완합니다. 게는 위협이 닥치면 집게발을 앞으로 내밀어 뚫을 수 없는 껍데기 벽으로 자신을 보호합니다. 하지만 예상치 못한 공격이나 여러 적의 동시 공격은 막을 수 없습니다.
actors.mobs.greatcrab.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.greatcrab.name=훌륭한 게
actors.mobs.greatcrab.noticed=게는 거대한 집게발로 막는다.
actors.mobs.guard.def_verb=막힌
actors.mobs.guard.desc=한때 감옥을 지키던 간수들은 이제 죄수들과 다를 바 없게 되었습니다. 그들은 마치 좀비처럼 비틀거리며 복도를 어슬렁거리며 이상한 것을 찾아 헤매는데, 당신도 그중 하나일 겁니다! 그들은 허리에 사슬을 차고 있는데, 아마도 적을 끌어당겨 근접전으로 유인하는 데 사용하는 것 같습니다.
actors.mobs.guard.name=교도관
actors.mobs.guard.scorpion=이리 와!
actors.mobs.hermitcrab.def_verb=막힌
actors.mobs.hermitcrab.desc=무슨 이유인지 모르겠지만, 이 하수도 게는 부서진 통의 윗부분을 머리에 쓰고 다니기로 작정한 것 같습니다! 무게 때문에 속도는 평소 수준으로 느려졌지만, 방어력은 훨씬 강해졌습니다. 그런데 통 안에서 뭔가가 튕겨 다니는 소리가 들리는 것 같지 않나요?
actors.mobs.hermitcrab.name=소라게
actors.mobs.mimic.desc=미믹은 원하는 어떤 형태로든 변신할 수 있는 마법 생물입니다. 던전에서는 거의 항상 보물 상자 모양으로 변신하여 방심한 모험가들을 유인합니다. 미믹은 물어뜯으면 독이 있지만, 일반 보물 상자보다 훨씬 더 많은 보물을 숨기고 있는 경우가 많습니다.
actors.mobs.mimic.discover_hint=이 적은 던전 어디에서든 찾을 수 있습니다.
actors.mobs.mimic.hidden_hint=이 상자 뭔가 이상한 느낌이 드는데... 다가가서 열어보는 건 좋지 않을 것 같아.
actors.mobs.mimic.name=미믹
actors.mobs.mimic.reveal=저 상자는 흉내쟁이야!
actors.mobs.mob.died=저 멀리서 무언가 죽는 소리가 들린다.
actors.mobs.mob.discover_hint=이 적은 던전의 특정 지역에서 찾을 수 있습니다.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=살해자: %s
actors.mobs.monk$focus.desc=이 승려는 목표물에 완벽하게 집중하고 있으며, 상대방의 움직임을 미리 예측하는 듯합니다. 집중하는 동안에는 어떤 상황에서도 이 캐릭터에게 가해지는 다음 물리 공격은 반드시 빗나갑니다. 이 공격을 막으면 승려의 집중력이 소모되므로, 다음 공격을 막으려면 집중력을 다시 채워야 합니다. 승려는 움직이는 동안 집중력을 더 빨리 채웁니다.
actors.mobs.monk$focus.name=집중된
actors.mobs.monk.def_verb=막힌
actors.mobs.monk.desc=이 수도승들은 모든 외부인으로부터 도시의 비밀을 지키는 데 몸 바친 광신도입니다. 갑옷이나 무기를 쓰지 않고 오직 맨손 무술에 의지합니다.
actors.mobs.monk.name=드워프 수도승
actors.mobs.monk.parried=막아냈다
actors.mobs.necromancer$necroskeleton.desc=이 해골은 강령술사가 소환한 것입니다. 일반 해골과 똑같이 행동하며, 소환한 강령술사가 죽으면 함께 죽습니다.
actors.mobs.necromancer$necroskeleton.name=강령술사의 해골
actors.mobs.necromancer.desc=이 어둠의 마법사 견습생들은 사악한 마법을 연습하기에 완벽한 장소인 감옥으로 몰려들었습니다. 강령술사들은 해골을 소환하고 강화하여 자신을 위해 싸우게 합니다. 강령술사를 죽이면 그가 소환한 해골도 함께 죽습니다.
actors.mobs.necromancer.name=점쟁이
actors.mobs.npcs.blacksmith.cant_enter_old=해당 지역은 이번 플레이에서는 접근할 수 없습니다. 새로운 퀘스트를 시도하려면 새 게임을 시작하세요!
actors.mobs.npcs.blacksmith.def_verb=막힌
actors.mobs.npcs.blacksmith.desc=이 트롤 대장장이는 여느 트롤과 마찬가지로 키가 크고 마르며, 피부는 색깔과 질감 모두 돌처럼 생겼다. 그는 몸에 비해 지나치게 작은 도구들을 만지작거리고 있다.
actors.mobs.npcs.blacksmith.enter_no=아직 아님
actors.mobs.npcs.blacksmith.enter_yes=준비됐어요
actors.mobs.npcs.blacksmith.entrance_blocked=내려가는 길이 막혀 있습니다.
actors.mobs.npcs.blacksmith.exit_no=아직 아님
actors.mobs.npcs.blacksmith.exit_warn_crystal=저 거대한 수정도 아직 저기 아래에 있어요. 그걸 파괴해 주시면 추가 금액을 드릴게요.
actors.mobs.npcs.blacksmith.exit_warn_full=다 챙겼어? 금화는 많이 얻었지만, 장비는 하나도 빠뜨리지 않았는지 잘 확인해. 한 번 올라오면 다시는 못 들어오게 할 거야.
actors.mobs.npcs.blacksmith.exit_warn_fungi=저 거대한 버섯도 아직 저기 아래에 있어요. 그거 죽여주시면 추가 돈 드릴게요.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=저 놀 지오맨서도 아직 저기 아래에 있어요. 처치해 주시면 추가 보상 드릴게요.
actors.mobs.npcs.blacksmith.exit_warn_high=다 모았어? 금은 꽤 많이 모았는데, 좀 더 필요해. 40개 정도는 모을 수 있을 거야. 잊지 마, 한 번 올라오면 다시는 못 들어오게 할 거야.
actors.mobs.npcs.blacksmith.exit_warn_low=벌써 끝냈어? 금화가 별로 없어 보이는데. _40개 정도는 얻을 수 있을 거야._\n\n_잊지 마, 한 번 올라오면 다시는 못 들어오게 할 거야._
actors.mobs.npcs.blacksmith.exit_warn_med=다 찾았어? 금은 좀 얻었지만, 광산에는 분명히 더 있을 거야. 40개 정도는 얻을 수 있을 걸. 명심해, 한번 올라오면 다시는 못 들어오게 할 거야.
actors.mobs.npcs.blacksmith.exit_warn_none=벌써 끝냈다고? 금화가 거의 없잖아! 40개는 얻을 수 있을 텐데. 명심해, 한 번 올라오면 다시는 못 들어오게 할 거야.
actors.mobs.npcs.blacksmith.exit_yes=끝났어요
actors.mobs.npcs.blacksmith.get_lost=나 바빠. 저리 가!
actors.mobs.npcs.blacksmith.intro_quest_cleric=이봐, 인간! 넌 중요한 사람처럼 보이는데.
actors.mobs.npcs.blacksmith.intro_quest_crystal=하지만 조심해, 너처럼 작은 인간에게는 광산이 위험해. 오랫동안 버려진 광산인데, 수정들이 자라기 시작했거든. 반짝거리긴 하지만 너무 깨지기 쉬워서 가치가 없고, 마법의 힘으로 보호받고 있어. 꽤 강력하니까 _어디서 캐는지_ 조심해야 해. 안 그러면 _들키게 될 거야._ 어딘가에 _거대한 수정_도 있어. 훨씬 더 단단하니까, 그걸 깨려고 하면 싸울 각오를 해야 할 거야. 하지만 그걸 부수면 수정의 성장이 느려질 테니, 네가 해내면 추가로 돈을 줄게.
actors.mobs.npcs.blacksmith.intro_quest_duelist=이봐, 인간! 넌 용감해 보이네.
actors.mobs.npcs.blacksmith.intro_quest_fungi=하지만 조심해, 그 광산은 너처럼 작은 인간에게는 위험해. 지하에 버섯 괴물이 자라고 있거든. 버섯 경비병들이 널 보면 아주 위험하지만, 적어도 일어나서 쫓아오지는 못해. 살아남고 싶다면 눈에 띄지 않도록 조심해. 가장 큰 버섯을 처치하면 추가 보상을 줄게. 하지만 꽤 힘들 거야. 벽 속에 숨겨진 균사체 덩어리들과 연결되어 있거든. 제대로 피해를 입히려면 먼저 그 덩어리들을 대부분 부숴야 할 거야.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=하지만 조심해, 너처럼 작은 인간에게는 광산이 위험해. 몇몇 놀들이 금에 눈이 멀어 광산을 엉망으로 만들고 있거든. 멍청한 놈들이라 광물을 캐느라 여기저기 무너지고 움푹 패였어. 그 사이를 뚫고 광물을 캐야 하니까, 최근에 파헤쳐진 바위를 잘 찾아봐. 내 생각엔 놀 중 하나가 대부분의 문제를 일으키고 있는 것 같아. 아마 지오맨서 샤먼 같은 놈일 거야. 그놈을 찾아서 처치해 주면 추가로 보상해 줄게. 하지만 분명히 반격할 거야.
actors.mobs.npcs.blacksmith.intro_quest_huntress=이봐, 인간! 꽤 빨라 보이네.
actors.mobs.npcs.blacksmith.intro_quest_mage=이봐, 인간! 똑똑해 보이네.
actors.mobs.npcs.blacksmith.intro_quest_rogue=이봐, 인간! 넌 꽤 교활해 보이는데.
actors.mobs.npcs.blacksmith.intro_quest_start=도움이 되고 싶어? 좋아, 네가 할 일이 있어. 내가 옛 광산 위에 작업장을 지었는데, 저 사다리 아래로 내려가면 돼. 이 곡괭이로 검은 금광석 좀 캐줘. 40개면 충분할 거야. 거기 바위가 부드러워서 좀 힘주면 벽도 뚫고 캘 수 있을 거야. "어떻게 돈을 내라는 거야? 욕심쟁이 같으니..." "알았어, 알았어. 대장장이 일을 해줄게. 운이 좋은 줄 알아. 여기 대장장이는 나밖에 없거든."
actors.mobs.npcs.blacksmith.intro_quest_warrior=이봐, 인간! 꽤 강해 보이는데.
actors.mobs.npcs.blacksmith.lost_pick=지금 농담하는 거야? 내 곡괭이는 어디 있어?!
actors.mobs.npcs.blacksmith.name=트롤 대장장이
actors.mobs.npcs.blacksmith.quest_start_prompt=내려갈 준비 됐어? 금화를 놓을 공간 좀 확보해 둬. \n\n_딱 한 번만 실망시켜 줄게!_
actors.mobs.npcs.blacksmith.reminder=내 시간 낭비 그만해? 광산 입구는 저쪽이야.
actors.mobs.npcs.blacksmith.reminder_crystal=금을 최대한 많이 가져오고, 큰 수정도 깨뜨려 봐.
actors.mobs.npcs.blacksmith.reminder_fungi=금을 최대한 많이 가져다주고, 거대 버섯도 처치해 봐.
actors.mobs.npcs.blacksmith.reminder_gnoll=최대한 많은 금화를 가져다주고, 놀 지오맨서도 처치해 봐.
actors.mobs.npcs.ghost.crab_1=안녕 %s... 나도 한때는 너처럼 강하고 자신감 넘쳤지... 하지만 고대의 괴물에게 죽임을 당했어... 복수하기 전까지는 이곳을 떠날 수 없어... 내 목숨을 앗아간 거대한 게를 처치해 줘... \n\n 그 게는 비정상적으로 늙었어... 거대한 외발톱과 두꺼운 껍데기를 가지고 있지... _그 게의 발톱을 조심해, 게를 기습해야 해. 그렇지 않으면 발톱으로 막아버릴 거야..._
actors.mobs.npcs.ghost.crab_2=제발... 도와주세요... 저 갑각류를 처치해 주세요...\n\n_저 녀석은 당신이 오는 것을 보면 항상 막을 거예요..._
actors.mobs.npcs.ghost.desc=유령은 거의 보이지 않는다. 마치 슬픈 얼굴을 한 희미한 빛의 형체 없는 점처럼 보인다.
actors.mobs.npcs.ghost.find_me=고마워... 날 찾아와...
actors.mobs.npcs.ghost.gnoll_1=안녕 %s... 한때 나도 너처럼 강하고 자신감 넘쳤지... 하지만 간교한 적에게 살해당했어... 복수하기 전까지는 이곳을 떠날 수 없어... 내 목숨을 앗아간 그놀 사기꾼을 처치해 줘... \n\n그 녀석은 다른 그놀들과는 달라... 숨어서 투척 무기를 사용해... 독침과 화염 화살을 조심해, 멀리서 공격하지 마...
actors.mobs.npcs.ghost.gnoll_2=제발... 도와주세요... 저 사기꾼을 처치해 주세요...\n\n_맞지 마세요... 가까이 다가가세요..._
actors.mobs.npcs.ghost.name=슬픈 유령
actors.mobs.npcs.ghost.rat_1=안녕 %s... 한때 나도 너처럼 강하고 자신감 넘쳤지... 하지만 끔찍한 짐승에게 죽임을 당했어... 복수하기 전까지는 이곳을 떠날 수 없어... 내 목숨을 앗아간 그 역겨운 쥐새끼를 죽여 버려... \n\n 그 쥐새끼는 이 바닥을 배회하며... 온 사방에 오물을 뿌리고 있어... 그 악취와 부식성 독을 조심해, 그 산은 물에 녹아...
actors.mobs.npcs.ghost.rat_2=제발... 도와주세요... 저 끔찍한 괴물을 처치해 주세요... 물가 근처에서 싸우세요... 악취를 피하세요...
actors.mobs.npcs.imp.cya=다음에 봐요, %s!
actors.mobs.npcs.imp.desc=임프는 하급 악마입니다. 힘이나 마법 재능은 뛰어나지 않지만, 매우 영리하고 사교적입니다. 많은 임프는 악마가 아닌 존재들과 함께 사는 것을 선호합니다.
actors.mobs.npcs.imp.golems_1=제 경우에는 골렘을 처치해야 합니다. 아시다시피, 저는 여기서 작은 사업을 시작하려고 하는데, 저 멍청한 골렘들이 사업에 방해가 되거든요! 이리저리 돌아다니는 화강암 덩어리들과 협상하는 건 정말 어려운 일이라고요! 그러니 제발... 한 네 마리 정도 처치해 주시면 보상을 드리겠습니다.
actors.mobs.npcs.imp.golems_2=골렘 탐험은 잘 진행되고 있나요? 토큰 챙기는 거 잊지 마세요!
actors.mobs.npcs.imp.hey=쉿, %s!
actors.mobs.npcs.imp.intro=당신은 모험가인가요? 저는 모험가들을 정말 좋아해요! 뭔가 처치해야 할 일이 생기면 언제나 모험가들에게 의지할 수 있잖아요, 그렇죠? 물론 현상금을 걸고서라도 말이에요 ;)
actors.mobs.npcs.imp.monks_1=제 경우에는 죽여야 할 대상이 바로 _승려_들입니다. 아시다시피, 제가 여기서 작은 장사를 시작하려고 하는데, 저 미치광이들은 아무것도 사지 않고 다른 손님들까지 쫓아낼 겁니다. 그러니 제발... 한 _5명_ 정도 죽여주시면 보상을 드리겠습니다.
actors.mobs.npcs.imp.monks_2=어머, 아직 살아계셨군요! 당신의 쿵푸 실력이 더 강할 줄 알았어요 ;) 토큰 챙기는 거 잊지 마세요.
actors.mobs.npcs.imp.name=야심 찬 악마
actors.mobs.npcs.impshopkeeper.buyback=요정은 쾌활하게 당신의 물건을 돌려줍니다.
actors.mobs.npcs.impshopkeeper.desc=그 요정은 내부 복도 경계에 작은 가게를 차려놓았군. 반가운 얼굴을 보니 좋긴 하지만, 가격은 전혀 친절해 보이지 않아.
actors.mobs.npcs.impshopkeeper.greetings=안녕하세요, %s님!
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s, 너 대체 무슨 짓을 한 거야? 빨리 쇼핑해, 나 여기서 나가야 해!
actors.mobs.npcs.impshopkeeper.name=야심 찬 악마
actors.mobs.npcs.impshopkeeper.thief=난 널 믿을 수 있을 거라고 생각했어!
actors.mobs.npcs.mirrorimage.desc=이 환영은 당신과 꼭 닮았지만, 더 창백하고 조금씩 꿈틀거립니다.
actors.mobs.npcs.mirrorimage.discover_hint=이 캐릭터는 특정 두루마리를 통해 얻을 수 있습니다.
actors.mobs.npcs.mirrorimage.name=거울상
actors.mobs.npcs.npc.discover_hint=이 캐릭터는 던전의 특정 지역에서 찾을 수 있습니다.
actors.mobs.npcs.prismaticimage.desc=이 반짝이는 환영은 당신과 매우 흡사하며, 마치 당신이 현재 사용하고 있는 무기와 갑옷을 휘두르는 것처럼 보입니다. 프리즘 이미지는 적의 시선을 끌어 집중시키며, 강화된 방어력과 체력으로 당신을 보호합니다. 거울 이미지만큼 강력한 공격력을 갖고 있지는 않지만, 당신의 갑옷 효과를 받는 등 내구성이 뛰어납니다. 프리즘 이미지는 체력이 0이 되면 몇 턴에 걸쳐 서서히 사라지며, 이 시간 동안에도 회복이 가능합니다. 적이 없을 때는 완전히 사라져 주인에게 돌아갑니다.
actors.mobs.npcs.prismaticimage.discover_hint=이 캐릭터는 특정 두루마리를 통해 얻을 수 있습니다.
actors.mobs.npcs.prismaticimage.name=프리즘 이미지
actors.mobs.npcs.ratking.confused=어... 여긴 어디지? 왕국이 날 필요로 해!
actors.mobs.npcs.ratking.crown_after=새 갑옷 마음에 드세요? 이제 되돌릴 수 없어요!
actors.mobs.npcs.ratking.crown_clothes=옷 좀 입어! 지금 상태로는 왕족이랑 얘기할 수 없어!
actors.mobs.npcs.ratking.crown_desc=어머, 저 왕관 제 건가요!? 제 것보다 훨씬 반짝거리네요. 기꺼이 받겠습니다! 사실, 이 왕관에 대한 보상으로 특별한 것을 드리고 싶습니다. 당신 같은 영웅에게 어울리는 엄청난 힘이죠! 어떠시겠어요?
actors.mobs.npcs.ratking.crown_fine=좋아! 어차피 내가 원했던 것도 아니었잖아...
actors.mobs.npcs.ratking.crown_info=먼저 좀 더 자세히 말씀해 주세요.
actors.mobs.npcs.ratking.crown_no=그러고 싶지 않아요...
actors.mobs.npcs.ratking.crown_thankyou=헤헤, 고마워! 자, 이제 가서 왕을 자랑스럽게 만들어주렴!
actors.mobs.npcs.ratking.crown_yes=물론!
actors.mobs.npcs.ratking.desc=이 쥐는 일반적인 유대류 쥐보다 조금 더 큽니다. 머리에는 작은 왕관을 쓰고 있습니다.
actors.mobs.npcs.ratking.desc_birthday=이 쥐는 일반적인 유대류 쥐보다 조금 더 큽니다. 평소에 쓰던 왕관 대신 작고 초록색 파티 모자를 쓰고 있네요. 쥐왕님, 생일 축하해요!
actors.mobs.npcs.ratking.desc_crown=이 쥐는 일반적인 유대류 쥐보다 조금 더 큽니다. 머리에는 난쟁이 왕관을 쓰고 있습니다.
actors.mobs.npcs.ratking.desc_winter=이 쥐는 일반적인 유대류 쥐보다 조금 더 큽니다. 평소에 쓰던 왕관 대신 작고 예쁜 크리스마스 모자를 쓰고 있네요. 즐거운 휴일 보내세요!
actors.mobs.npcs.ratking.discover_hint=이 캐릭터는 던전의 특정 지역 끝에서 찾을 수 있습니다.
actors.mobs.npcs.ratking.name=쥐왕
actors.mobs.npcs.ratking.not_sleeping=난 안 자고 있어!
actors.mobs.npcs.ratking.what_is_it=무슨 소리야? 이런 시시한 소리에 시간 낭비할 시간이 없어. 내 왕국은 저절로 다스려지지 않아!
actors.mobs.npcs.sheep.baa!=매매!
actors.mobs.npcs.sheep.baa.=매매.
actors.mobs.npcs.sheep.baa...=매매...
actors.mobs.npcs.sheep.baa?=매매?
actors.mobs.npcs.sheep.def_verb=막힌
actors.mobs.npcs.sheep.desc=이 양은 마법의 양입니다. 뭐가 그렇게 마법 같냐고요? 죽일 수가 없다는 거죠. 멍한 눈빛으로 되새김질을 하면서 마법처럼 사라질 때까지 그 자리에 서 있을 겁니다.
actors.mobs.npcs.sheep.discover_hint=이 캐릭터는 특정 아이템이나 함정을 이용하면 찾을 수 있습니다.
actors.mobs.npcs.sheep.name=양
actors.mobs.npcs.shopkeeper.buyback=가게 주인은 마지못해 당신의 물건을 돌려줍니다.
actors.mobs.npcs.shopkeeper.desc=이 뚱뚱한 남자는 지하 감옥보다는 대도시의 상업 지구에 더 어울릴 것 같다. 그가 이곳에서 장사하는 이유를 가격을 보면 알 수 있다.
actors.mobs.npcs.shopkeeper.flee=가게 주인이 도망쳤다!
actors.mobs.npcs.shopkeeper.name=가게 주인
actors.mobs.npcs.shopkeeper.sell=물건을 판매하세요
actors.mobs.npcs.shopkeeper.talk=말하다
actors.mobs.npcs.shopkeeper.talk_ascent=당신이 그 부적을 가지고 뭘 하려는 건지는 모르겠지만, 난 절대 필요 없어. 뭐라도 사서 떠나자. 우리 둘 다 여기를 떠나야 해!
actors.mobs.npcs.shopkeeper.talk_caves=돈 쓰면 오래 산다. 아, 그리고 그 트롤 대장장이 만나면 안부 좀 전해줘. 지난주에 내가 팔았던 망치 값 아직 안 갚았다고 그 얼간이한테 꼭 말해줘!
actors.mobs.npcs.shopkeeper.talk_city=제 물건들이 당신을 여기서 안전하게 지켜줄 겁니다. \n\n...그리고 제발 여기서 오래 머물지 마세요. 여기 주민들이 저를 내버려 두게 하는 데 엄청 오래 걸렸는데, 당신이 문제를 일으키는 걸 원치 않아요!
actors.mobs.npcs.shopkeeper.talk_halls=안녕하세요, 악마 사냥꾼들을 위한 특별 가격이 있어요! 아, 그리고 아래쪽은 조심하세요! 아래에 있는 악마들은 당신이 얼마나 용감한지 신경도 안 쓸 거예요. 죽으면 다시 올라와서 돈을 더 쓸 수 없잖아요! ;) 악마들이 저랑 비슷한가요? 헤헤, 전혀 아니에요. 전 그냥 몸집도 작고 싸움도 잘 못하지만, 정신은 멀쩡하게 유지하고 있을 뿐이에요. 아래에 있는 악마들은 훨씬 강하고, 모두... 음... 그냥 아래쪽은 조심하는 게 좋을 거예요.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=안녕하세요, 전하, 아니면 이제는 성하로 불리시나요? 하하, 어쨌든 여기는 당신이 있을 곳이 아닙니다. 당신이 죽으면 많은 사람들이 슬퍼할 겁니다. 하지만 돈이 좀 있으시니, 그런 일이 생기지 않도록 뭔가를 사시는 게 어떻겠습니까?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=어머, 여행하는 영웅이 아니신가! 다른 마을을 구하려는 거라면 행운을 빌어. 여기 위험은 좀도둑 떼보다 훨씬 심각하거든. 분명 당신이라면 누구보다 잘 해낼 거야. 다만 내 가게 바로 앞에서 죽지만 않으면 돼.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=아가씨, 좀 어색해 보이시네요. 좁은 지하 감옥 복도는 웅장한 홀이나 도시를 둘러싼 숲처럼 넓지 않잖아요? 헤헤, 제 수다는 신경 쓰지 마세요. 뭐라도 사시는 게 어떠세요?
actors.mobs.npcs.shopkeeper.talk_prison_intro=성공적인 모험에 필요한 모든 것을 갖추고 있습니다!
actors.mobs.npcs.shopkeeper.talk_prison_mage=헤헤, 시내 어딘가에서 당신 이름이 적힌 수배 전단을 본 것 같은데요. 도망 다니시는 건가요? 아, 당신은 무죄시군요? 물론이죠, 물론... 걱정 마세요, 당신에 대해 신고할 시간은 없어요. 하지만 확실히 하려면 뭐라도 사시는 게 어떨까요?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=도적 길드에서 이 지역을 정리하러 오셨습니까? 아니, 그냥 쇼핑 오셨나요? 그래도 온 김에 몬스터 몇 마리 처치하고 오십시오. 할인은 기대하지 마세요. 당신들한테 보호비를 꽤 많이 내고 있는데, 당신들이 날 겨우 지켜주고 있는 수준입니다.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=그거 참 특이한 인장이네요. 보통은 온전한 상태로 남아있거든요. 혹시 불명예스러운 영웅이라도 되시나요? 뭐, 무슨 일을 하셨든 제 알 바는 아니지만, 동전은 여전히 쓸만합니다.
actors.mobs.npcs.shopkeeper.thief=도둑, 도둑!
actors.mobs.npcs.shopkeeper.warn=조심하세요! 다시는 경고하지 않겠습니다.
actors.mobs.npcs.vaultlaser.desc=이 경비병은 일정한 간격으로 레이저를 발사하고 있습니다. _이곳은 테스트 구역이므로 레이저에 맞아도 실제로 다치지는 않습니다._
actors.mobs.npcs.vaultlaser.name=금고 레이저 경비대
actors.mobs.npcs.vaultsentry.desc=이 경비병은 일정한 패턴으로 주변을 스캔하고 있습니다. 이곳은 테스트 구역이므로 경비병이 당신을 감지하더라도 아무런 조치를 취하지 않습니다.
actors.mobs.npcs.vaultsentry.name=금고 스캔 경비원
actors.mobs.npcs.wandmaker.def_verb=막힌
actors.mobs.npcs.wandmaker.desc=이 나이 지긋하지만 건강한 신사는 약간 당황한 표정을 짓고 있다. 그는 마법 방패로 보호받고 있다.
actors.mobs.npcs.wandmaker.intro_1=I는 지팡이를 만들 희귀 재료를 찾으러 왔는데 길을 잃었고, 마법 방어막도 약해지고 있어요. 곧 떠나야 하지만, 원하는 걸 얻지 않고는 떠날 수가 없어요.
actors.mobs.npcs.wandmaker.intro_2=만약 그걸 구해다 주신다면, 제가 정성껏 만든 마법 지팡이 중 하나로 보답하겠습니다! 두 개를 가져왔으니, 마음에 드는 걸로 고르세요.
actors.mobs.npcs.wandmaker.intro_berry=이 감옥의 옛 간수는 썩은딸기나무를 키웠는데, 저는 그 씨앗을 얻고 싶습니다. 하지만 그 나무는 이미 야생으로 자라버렸을 테니 씨앗을 얻기는 쉽지 않을 겁니다. 아마 이 근처 어딘가에 있을 거예요. 무사히 돌아오고 싶다면 덩굴을 묶는 칼에 가까이 가지 마세요. 불을 지르고 싶은 유혹이 들겠지만, 절대 그러지 마세요. 나무도 죽고 씨앗도 파괴될 테니까요.
actors.mobs.npcs.wandmaker.intro_cleric=오, 전하! 이렇게 음울한 곳에서 뵙게 되어 정말 반갑습니다! 실례지만, 부탁드릴 일이 하나 있습니다.
actors.mobs.npcs.wandmaker.intro_duelist=어머, 아가씨! 이렇게 우울한 곳에서 영웅을 만나다니 정말 반갑네요! 늙은이를 도와주실 의향이 있으시다면, 부탁드릴 일이 하나 있습니다.
actors.mobs.npcs.wandmaker.intro_dust=시체 가루를 찾고 있어요. 저주받은 뼈가루인데, 보통 이런 곳에서 발견되죠. 이 근처 어딘가에 바리케이드로 막힌 방이 있을 거예요. 거기 가면 시체 가루가 나올 거라고 확신해요. 하지만 조심하세요. 그 가루에 깃든 저주는 아주 강력하거든요. 최대한 빨리 연락 주세요. 제가 정화해 드릴게요.
actors.mobs.npcs.wandmaker.intro_ember=갓 태어난 불의 정령에게서 _신선한 불씨_를 얻고 싶어요. 정령은 소환 의식이 제대로 진행되지 않을 때 나타나는 경우가 많으니, 양초 몇 개와 의식 장소를 찾으면 분명히 나타날 거예요. 정령과 싸울 때는 _갇힌 자세를 피하는_ 게 좋고, _냉동 아이템을 준비해 두는 것도_ 도움이 될 거예요. 갓 태어난 정령은 상당히 강력하고 혼란스럽지만, 추위에 약하거든요.
actors.mobs.npcs.wandmaker.intro_huntress=어머, 안녕하세요! 이렇게 반가운 얼굴을 보니 반갑네요. 사실, 어디선가 본 것 같은데… 기억이 잘 안 나네요. 아, 괜찮아요. 모험을 즐기러 오셨다면, 제가 드릴 일이 하나 있을지도 몰라요.
actors.mobs.npcs.wandmaker.intro_mage=안녕하세요, %s님! 마법사 학원과 관련된 소동이 있었다는 소식을 들었어요. 아, 됐습니다. 전 원래 그 고루한 사람들을 좋아하지 않았거든요. 괜찮으시다면, 부탁드릴 일이 하나 있습니다.
actors.mobs.npcs.wandmaker.intro_rogue=어머나, 깜짝 놀랐군요! 이 동네 산적 중에 제정신인 사람은 처음 보는데, 당신은 지상에서 온 게 틀림없어요! 낯선 사람을 도와줄 의향이 있다면, 부탁 하나 드려도 될까요?
actors.mobs.npcs.wandmaker.intro_warrior=오, 반갑습니다! 이렇게 음침한 곳에서 북쪽에서 온 전사를 만나다니 정말 반갑군요! 여기까지 오시느라 꽤 먼 길을 오셨겠군요. 모험을 좋아하신다면, 제가 드릴 일이 하나 있습니다.
actors.mobs.npcs.wandmaker.name=늙은 막대 제작자
actors.mobs.npcs.wandmaker.reminder_berry=%s님, 로트베리 씨앗 구하는 데 성공하셨나요? 식물로 가득 찬 방을 찾아보세요.
actors.mobs.npcs.wandmaker.reminder_dust=시체 가루는 좀 찾았어, %s? 바리케이드 좀 찾아봐.
actors.mobs.npcs.wandmaker.reminder_ember=%s님, 불씨 찾는 데 성공하셨나요? 양초 네 개와 의식 장소를 찾아야 할 거예요.
actors.mobs.phantompiranha.desc=팬텀 피라냐는 마법적인 능력과 섬뜩할 정도로 투명한 몸을 가진 희귀한 피라냐 종입니다. 공격을 받을 때 순간이동을 할 수 있는데, 이는 도망치거나 적에게 빠르게 접근하기 위한 것입니다. 싸우기는 까다롭지만, 그 고기는 마법적인 효능 때문에 귀하게 여겨집니다.
actors.mobs.phantompiranha.name=팬텀 피라냐
actors.mobs.phantompiranha.teleport_away=유령 피라냐가 순간이동으로 사라졌다...
actors.mobs.piranha.desc=이 육식성 물고기는 홍수 지역을 보호하기 위해 특별히 사육됩니다. 물리면 치명적이므로 직접 마주치는 것은 피하는 것이 가장 좋습니다.
actors.mobs.piranha.discover_hint=이 적은 던전 어디에서든 찾을 수 있습니다.
actors.mobs.piranha.name=거대 피라냐
actors.mobs.pylon.desc_active=이 송전탑은 이 지역의 기계 장치에 전력을 공급하는 전기를 조절하는 역할을 합니다. 현재 송전탑에는 엄청난 양의 전기가 흐르고 있는데, 이것이 바로 DM-300을 과충전시키는 원인임이 분명합니다! (\n\n) 이러한 상태에서 송전탑은 취약하지만, 시계 방향으로 주변 셀에 전기 아크를 발생시킵니다. 송전탑은 견고한 금속 구조 덕분에 상당한 손상에도 잘 견딥니다.
actors.mobs.pylon.desc_inactive=이 송전탑은 이 지역의 기계 장치에 전력을 공급하는 전기를 조절하는 데 도움을 주기 위해 세워졌습니다. (\n\n) 이 송전탑은 현재 비활성화되어 있으며 손상되지 않습니다.
actors.mobs.pylon.name=송전탑
actors.mobs.rat.desc=유대류쥐는 공격적이지만 비교적 약한 하수도 서식 동물입니다. 물리면 아프지만, 개체 수가 많아지지 않는 한 생명을 위협하지는 않습니다.
actors.mobs.rat.name=유대류쥐
actors.mobs.ripperdemon.desc=이 끔찍한 괴물들은 이 지역에 널린 수많은 드워프 시체들이 악마의 힘에 의해 이용된 결과물입니다. 리퍼는 드워프와 비슷하게 생겼지만 뼈로 된 길고 날카로운 발톱을 가진, 뼈만 앙상하게 남은 구울 같은 생명체입니다. 리퍼 악마는 내구성이 그다지 좋지 않지만 민첩하고 위험합니다. 먼 거리를 뛰어올라 목표물에 빠르게 접근한 후 발톱으로 찔러 죽일 수 있습니다.
actors.mobs.ripperdemon.leap=끔찍한 악마가 뛰어오를 준비를 한다!
actors.mobs.ripperdemon.name=리퍼 데몬
actors.mobs.rotheart.desc=로트베리 열매는 매우 독특합니다. 썩어서 영양분을 공급하는 대신, 열매는 자라면서 단단해지고 씨앗을 감쌉니다. 이 거대한 구형 열매는 열매 안에서 자라는 내부 기관을 보호하는 역할을 합니다. 이 거대한 열매는 다 자란 로트베리 식물의 심장이라고 불립니다.
actors.mobs.rotheart.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.rotheart.name=심장이 썩어버렸어
actors.mobs.rotlasher.desc=뿌리털은 다 자란 로트베리 식물의 뿌리 구조의 일부이며, 주요 방어 수단이기도 합니다. 뿌리털은 눈이 멀었고 땅에 박혀 있지만, 주변의 위협을 감지한 후에는 맹렬하게 공격합니다. 주변에 적이 없을 때는 움직이지 않고 주변 식물과 섞여 위장하려고 합니다.
actors.mobs.rotlasher.discover_hint=이 적은 특정 퀘스트를 진행하는 동안 만날 수 있습니다.
actors.mobs.rotlasher.name=썩은 채찍
actors.mobs.scorpio.desc=이 거대한 거미처럼 생긴 악마 같은 생명체들은 근접전을 피하고, 먼 거리에서 치명적인 톱니 모양의 가시를 발사하는 것을 선호합니다.
actors.mobs.scorpio.name=전갈
actors.mobs.senior.desc=이 수도승들은 모든 외부인으로부터 도시의 비밀을 지키는 데 몸 바친 광신도입니다. 갑옷이나 무기를 쓰지 않고 오직 맨손 무술에 의지합니다.
actors.mobs.senior.name=고승
actors.mobs.shaman$blueshaman.spell_desc=이 주술사는 파란색 가면을 쓰고 있으며, 일시적으로 받는 피해를 증가시키는 마법을 사용합니다.
actors.mobs.shaman$purpleshaman.spell_desc=이 주술사는 보라색 가면을 쓰고 있으며, 일시적으로 당신의 명중률과 회피율을 감소시키는 마법을 사용할 것입니다.
actors.mobs.shaman$redshaman.spell_desc=이 주술사는 붉은 가면을 쓰고 있으며, 일시적으로 당신의 공격력을 약화시키는 마법을 사용할 것입니다.
actors.mobs.shaman.bolt_kill=마법의 번개가 너를 죽였구나...
actors.mobs.shaman.desc=가장 영리한 놀은 주술을 익힐 수 있습니다. 놀 주술사는 부족한 힘을 메우려고 전투 주문을 즐겨 쓰며, 부족 내 지위에 의문을 품는 자에게도 주저 없이 사용합니다.
actors.mobs.shaman.name=놀 샤먼
actors.mobs.skeleton.def_verb=막힌
actors.mobs.skeleton.desc=해골은 불운한 모험가와 던전 주민의 뼈가 깊은 곳에서 흘러나온 사악한 마법으로 되살아난 것입니다. 충분한 피해를 입으면 뼛조각을 사방으로 터뜨리며 무너집니다.
actors.mobs.skeleton.explo_kill=당신은 뼈가 폭발하면서 사망했습니다...
actors.mobs.skeleton.name=해골
actors.mobs.slime.def_verb=막힌
actors.mobs.slime.desc=슬라임은 고무 같은 외피와 액체 속을 가진 기묘하고 약간 마법적인 생물입니다. 도시의 하수도는 슬라임에게 풍부한 물과 영양분을 제공합니다. 탄력 있는 외피 때문에 한 번의 공격으로 슬라임에게 6 이상의 피해를 입히기는 어렵습니다.
actors.mobs.slime.name=더러운 것
actors.mobs.snake.desc=이 거대한 뱀들은 공격을 재빨리 피해 미끄러지듯 움직일 수 있어 맞추기가 매우 어렵습니다. 하지만 마법 공격이나 기습 공격으로는 방심한 틈을 타 공격할 수 있습니다. 뱀의 시야 밖에서 공격하면 기습 공격을 할 수 있습니다. 한 가지 방법은 뱀이 문을 통과하도록 유인한 다음, 뱀이 문 안으로 들어간 직후에 공격하는 것입니다.
actors.mobs.snake.hint=뱀을 자세히 살펴보려면 '조사' 버튼을 사용해 보세요. 뱀에 대처하는 방법을 알 수 있을 겁니다.
actors.mobs.snake.name=하수구 뱀
actors.mobs.spectralnecromancer.desc=해골은 네크로맨서의 주력 하수인이지만, 어떤 네크로맨서들은 형체가 없는 다른 하수인을 선호하기도 합니다. 유령 네크로맨서들은 망령을 자신들의 주 하수인으로 선택합니다! 개별 망령은 해골만큼 강력하지는 않지만, 이 네크로맨서들은 망령 무리를 소환하는 것을 주저하지 않습니다!
actors.mobs.spectralnecromancer.name=유령 강령술사
actors.mobs.spinner.desc=털이 난 이 녹색 동굴 거미는 직접 싸우기를 꺼립니다. 거미줄에 걸린 먹잇감이 독니에 물려 천천히 죽어 가는 동안 멀리서 기다리는 쪽을 좋아합니다.
actors.mobs.spinner.name=동굴 거미
actors.mobs.statue.def_verb=막힌
actors.mobs.statue.desc=언뜻 보면 이 던전에 있는 수많은 생명 없는 조각상 중 하나일 뿐이라고 생각할 수도 있지만, 붉게 빛나는 눈이 그 정체를 드러냅니다.
actors.mobs.statue.desc_weapon=조각상 자체는 돌로 만들어졌지만, 조각상이 들고 있는 _%s_는 진짜처럼 보인다.
actors.mobs.statue.discover_hint=이 적은 던전 어디에서든 찾을 수 있습니다.
actors.mobs.statue.name=움직이는 조각상
actors.mobs.succubus.desc=서큐버스는 약간 고딕풍으로 꾸민 매혹적인 소녀 모습의 악마입니다. 마법으로 영웅을 홀릴 수 있으며, 홀린 영웅은 효과가 풀릴 때까지 아무것도 공격할 수 없습니다.
actors.mobs.succubus.name=서큐버스
actors.mobs.swarm.desc=치명적인 파리 떼가 성난 듯 윙윙거린다. 마법을 사용하지 않는 모든 공격은 이 파리 떼를 두 개의 더 작지만 똑같이 위험한 무리로 나눌 것이다.
actors.mobs.swarm.name=파리 떼
actors.mobs.tengu$bombability$bombblob.desc=초고온의 연기가 이곳에서 피어오르고 있어요. 조심하세요, 곧 폭발할 거예요!
actors.mobs.tengu$bombability$bombitem.cant_pickup=땅에 붙어 있어서 움직일 수가 없어요!
actors.mobs.tengu$bombability$bombitem.desc=텐구가 이상하게 생긴 연막탄을 던졌는데, 뜨거운 연기가 자욱하게 피어오르고 있어요. 마치 폭발 카운트다운을 하는 것처럼 큰 똑딱거리는 소리가 나고 있어요! 연막탄은 땅에 박혀 있어서 주울 수가 없어요.
actors.mobs.tengu$bombability$bombitem.name=연막탄
actors.mobs.tengu$fireability$fireblob.desc=텐구가 고운 가루를 던졌는데, 여기서 김이 나기 시작하는 것 같아. 곧 불이 붙을 것 같아!
actors.mobs.tengu$shockerability$shockerblob.desc=이곳에 전기 에너지가 축적되고 있습니다. 이 타일 위에 서 있는 것은 다음 턴에 감전될 것입니다!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=전기가 너무 많이 나와서 잡을 수가 없어!
actors.mobs.tengu$shockerability$shockeritem.desc=텐구가 DM-100 부품으로 만들어진 듯한 이상한 기계를 여기에 던져 놓았습니다. 기계는 끊임없이 주변에 전기 스파크를 튀기고 있는데, 마치 예측 가능한 패턴을 따르는 것 같습니다. 이렇게 전기 스파크가 사방으로 튀는 바람에 이걸 집어 올릴 방법은 전혀 없습니다.
actors.mobs.tengu$shockerability$shockeritem.name=소름 끼치게 하는 사람
actors.mobs.tengu.defeated=드디어 자유다...
actors.mobs.tengu.desc=텐구는 같은 이름을 가진 오래된 암살자 일족의 일원입니다. 수리검과 함정을 즐겨 쓰는 것으로 유명합니다.
actors.mobs.tengu.interesting=재밌게 만들어 봅시다...
actors.mobs.tengu.name=텐구
actors.mobs.tengu.notice_gotcha=알겠습니다, %s!
actors.mobs.tengu.notice_have=이제 널 잡았다, %s!
actors.mobs.tengu.rankings_desc=텐구에게 암살당함
actors.mobs.thief.carries=도둑은 _\n\n를 들고 있습니다. 분명히 도난당한 물건입니다.
actors.mobs.thief.desc=이곳 수감자들은 감방에서 자유롭게 돌아다니지만, 여전히 이곳은 그들의 감옥입니다. 시간이 흐르면서 이곳은 그들의 자유뿐 아니라 정신까지 앗아갔습니다. 오래전, 이 미친 도둑들과 산적들은 자신이 누구인지, 왜 도둑질을 하는지 잊어버렸습니다. 이 적들은 싸우기보다는 훔치고 도망치는 것을 더 좋아합니다. 항상 그들을 주시하십시오. 그렇지 않으면 훔친 물건을 영영 찾지 못할 수도 있습니다.
actors.mobs.thief.escapes=도둑이 당신의 %s를 훔쳐 달아났습니다!
actors.mobs.thief.name=미친 도둑
actors.mobs.thief.stole=도둑이 당신에게서 %s를 훔쳐갔습니다!
actors.mobs.tormentedspirit.desc=저주받은 영혼은 본래 선량한 영혼이지만 저주에 걸린 영혼입니다. 저주가 풀리지 않는 한 유령처럼 공격하며, 더욱 강력해집니다. 영혼 옆에서 적절한 아이템을 사용하면 저주를 풀 수 있을지도 모릅니다. 저주가 풀리면 영혼은 분명 감사할 것입니다.
actors.mobs.tormentedspirit.name=고통받는 영혼
actors.mobs.tormentedspirit.thank_you=감사합니다...
actors.mobs.vaultrat.desc=이 쥐는 새로운 금고 적 AI를 테스트하기 위해 몇 가지 행동 변화를 보입니다. 벽 너머로 움직임 소리가 들립니다. 미리 설정된 순찰 경로를 따라 돌아다닙니다. 순찰 중에는 이동 방향 뒤쪽의 감지 범위가 크게 줄어듭니다. 잠자는 동안에도 감지 범위가 줄어듭니다. 플레이어를 감지하면 사냥으로 전환하기 전에 '조사'를 합니다. 조사 중인 적은 플레이어 쪽으로 다가오지만 공격하지 않으며, 문이나 모퉁이 뒤에 숨어 있으면 쉽게 놓칠 수 있습니다.
actors.mobs.warlock.bolt_kill=그림자 번개가 너를 죽였구나...
actors.mobs.warlock.desc=드워프들의 관심이 공학에서 비술로 옮겨 가자 흑마법사들이 도시의 권력을 잡았습니다. 처음에는 원소 마법을 다뤘지만, 곧 악마술과 강령술로 눈을 돌렸습니다.
actors.mobs.warlock.name=드워프 마법사
actors.mobs.wraith.desc=유령은 무덤이나 묘지가 훼손된 죄인의 복수심에 불타는 영혼입니다. 유령은 비물질적인 존재이기 때문에 일반적인 무기로는 공격하기가 매우 어렵습니다.
actors.mobs.wraith.discover_hint=이 적은 던전 어디에서든 찾을 수 있습니다.
actors.mobs.wraith.name=망령
actors.mobs.yogdzewa$larva.desc=요그-제와의 이 작은 하수인들은 생산하기 쉬운 단순한 하수인입니다. 개별적으로는 약하지만, 빠르게 소환되어 수가 많아지면 엄청난 위력을 발휘합니다.
actors.mobs.yogdzewa$larva.name=신의 애벌레
actors.mobs.yogdzewa$larva.rankings_desc=요그-제와에게 잡아먹혔다
actors.mobs.yogdzewa$yogeye.rankings_desc=요그-제와에게 잡아먹혔다
actors.mobs.yogdzewa$yogripper.rankings_desc=요그-제와에게 잡아먹혔다
actors.mobs.yogdzewa$yogscorpio.rankings_desc=요그-제와에게 잡아먹혔다
actors.mobs.yogdzewa.darkness=어둠이 점점 더 가까이 다가온다...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=요그-제와는 고대 신이자, 필멸의 세계에까지 뻗어들어 그들을 집어삼키며 끝없는 성장을 이어가는 거대한 괴물입니다. 드워프들은 어둠의 마법을 가지고 장난치다가 이 우주적 공포의 관심을 끌게 되었고, 그 이후로 끊임없이 요그-제와를 봉인하려 애써 왔습니다. 요그-제와는 순수한 마법의 혼돈의 차원에서 왔으며, 자신의 진정한 모습을 이 세계에 드러낼 수 없습니다. 대신 아바타를 만들어내고 악마 하수인들을 소환하여 자신의 명령을 따르게 합니다. 이 거대한 눈은 이 세계에서 요그-제와의 힘이 집중되는 곳입니다. 눈 자체는 움직이지 않지만, 강력한 악마 마법 광선을 발사하고 다양한 하수인들을 소환하여 자신을 돕게 할 수 있습니다.
actors.mobs.yogdzewa.desc_spawners=위층에서 악마의 기운이 눈으로 뿜어져 나오는 것을 느낄 수 있습니다. 당신이 위층에 살려둔 무언가가 요그-제와에게 힘을 집중시키고 있는 것이 분명합니다. 요그는 이 에너지를 이용해 더욱 강력한 하수인들을 소환할 것입니다!
actors.mobs.yogdzewa.hope=당신의 희망은 환상일 뿐입니다!
actors.mobs.yogdzewa.name=요그-제와
actors.mobs.yogdzewa.notice=난. 널. 보고 있어.
actors.mobs.yogdzewa.rankings_desc=요그-제와에게 잡아먹혔다
actors.mobs.yogfist$brightfist.desc=이 주먹은 순수한 빛 에너지로 이루어져 있습니다. 매 턴마다 강력하고 타오르는 빛줄기를 발사할 수 있죠! 이 광선은 막대한 피해를 입히는 것 외에도 일시적으로 시야를 가립니다. 또한, 이 주먹은 잠시 동안 경기장을 눈부신 빛으로 뒤덮어 도망칠 수도 있습니다! 하지만 이 주먹은 근접전에서 사용할 수 있는 특별한 능력은 없습니다.
actors.mobs.yogfist$brightfist.name=밝은 주먹
actors.mobs.yogfist$brightfist.teleport=주먹이 눈부신 섬광과 함께 순간이동해서 당신의 눈을 멀게 합니다!
actors.mobs.yogfist$burningfist.desc=불길에 휩싸인 거대한 주먹. 손가락을 움켜쥘 때마다 타닥거리는 소리와 함께 바닥으로 불씨가 떨어진다.
actors.mobs.yogfist$burningfist.name=불타는 주먹
actors.mobs.yogfist$darkfist.desc=이 주먹은 순수한 어둠의 에너지로 이루어져 있습니다. 매 턴마다 강력한 어둠의 마법 공격을 발사할 수 있죠! 이 공격은 막대한 피해를 입히는 것 외에도 광원을 약화시킵니다. 또한, 이 주먹은 잠시 동안 경기장을 어둠으로 뒤덮어 도망칠 수도 있습니다! 하지만 근접전에서 사용할 수 있는 특별한 능력은 없습니다.
actors.mobs.yogfist$darkfist.name=다크 피스트
actors.mobs.yogfist$darkfist.teleport=주먹이 순식간에 어둠의 기운과 함께 사라져 버렸고, 그 빛은 순식간에 꺼져버렸습니다!
actors.mobs.yogfist$rottingfist.desc=썩은 살덩어리로 이루어진 거대한 주먹. 손가락 사이로 악취 나는 점액이 흘러나와 아래의 돌바닥을 더럽힌다.
actors.mobs.yogfist$rottingfist.name=썩어가는 주먹
actors.mobs.yogfist$rustedfist.desc=이 주먹은 살아있는 금속으로 이루어져 있습니다. 거대한 금속 덩어리가 끊임없이 움직이며 강력한 근접 공격을 가할 뿐만 아니라 원거리에서도 목표물을 무력화시킬 수 있습니다. 엄청난 질량 때문에 이 주먹은 받는 피해를 즉시 입는 것이 아니라 시간이 지남에 따라 흡수합니다. 하지만 이 주먹은 유연성이 없어 좁은 통로를 통과할 수 없습니다. 또한, 피해를 천천히 입더라도 여러 번 공격을 받으면 흡수되는 피해량이 계속 증가합니다.
actors.mobs.yogfist$rustedfist.name=녹슨 주먹
actors.mobs.yogfist$soiledfist.desc=이 주먹은 혼돈의 흙 마법으로 형성되었습니다. 움직일 때마다 주변에 끊임없이 식물이 돋아나게 합니다. 또한 집중된 흙 폭발을 발사하여 목표물을 빠르게 자라는 덩굴과 뿌리로 얽매어 버릴 수 있습니다! 이 주먹은 식물로부터 힘을 얻으며, 주변에 있는 키가 크거나 골이 진 식물의 양에 따라 피해 저항력이 달라집니다!
actors.mobs.yogfist$soiledfist.name=더러워진 주먹
actors.mobs.yogfist.desc=이 주먹은 요그-제와의 힘의 한 측면입니다. 주먹은 요그-제와의 힘과 연결되어 있으며, 눈 가까이에 있을 때 모든 피해로부터 보호받습니다.
actors.mobs.yogfist.invuln_warn=주먹은 눈 가까이에 있을 때는 무적이다!
actors.mobs.yogfist.rankings_desc=요그-제와에게 잡아먹혔다
actors.char.def_verb_evaded=회피했다
actors.char.enemy_hit=%s가 당신을 때렸습니다
actors.char.enemy_missed=당신 %2$s %1$s의 공격
actors.char.hit=%s가 %s를 공격했습니다.
actors.char.mob_missed=%1$s %2$s %3$s의 공격
actors.char.out_of_paralysis=그 고통은 %s를 마비 상태에서 깨어나게 했다.
actors.char.you_hit=%s를 입력하셨습니다.
actors.char.you_missed=%1$s %2$s 당신의 공격
actors.mobs.mob.fleeing=%s가 도망치고 있습니다
actors.mobs.mob.hunting=%s가 사냥 중입니다
actors.mobs.mob.passive=%s는 패시브입니다.
actors.mobs.mob.sleeping=%s는 잠들어 있습니다
actors.mobs.mob.wandering=%s는 방황하고 있습니다.
actors.mobs.elemental.desc=떠도는 불의 정령은 더 강력한 존재를 소환하다 생겨난 부산물입니다. 본성이 너무 혼란스러워 아무리 뛰어난 악마술사도 통제하지 못합니다.
actors.mobs.elemental.name=불의 정령
actors.mobs.king.desc=드워프의 마지막 왕은 삶과 죽음에 해박한 지식으로 유명했습니다. 왕은 신하들을 설득해 영원한 젊음을 준다는 의식에 참여시켰습니다. 결국 젊음을 얻은 것은 왕뿐이었고, 덤으로 언데드 군대까지 생겼습니다.
actors.mobs.king.name=드워프의 왕
actors.mobs.npcs.bee.desc=황금 벌은 몸집이 작아도 주인을 맹렬히 지킵니다. 다만 오래 살지는 못합니다.
actors.mobs.npcs.bee.name=황금 꿀벌
actors.mobs.shielded.desc=흉폭한 놀은 모든 놀 중에서 가장 크고 강하며 질깁니다. 심한 상처를 입으면 광분하여 적에게 더 큰 피해를 줍니다.
actors.mobs.shielded.name=방패를 든 흉폭한 놀
actors.mobs.yog.desc=요그-제와는 혼돈의 영역에서 온 강력한 존재인 고대 신입니다. 백 년 전, 고대 드워프들은 악마 군대와의 전쟁에서 간신히 승리했지만, 신 자체를 처치하지는 못했습니다. 그들은 요그-제와가 너무 약해 다시는 일어설 수 없을 것이라고 믿고 도시 지하의 지하 감옥에 가두었습니다.
actors.mobs.yog.name=요그-제와
actors.mobs.bandit.carries=%s가 _%s_를 소지하고 있습니다. 명백히 도난당한 것입니다.
actors.buffs.armorevasion.name=회피 증가
actors.mobs.king.defeated=당신은 날 죽일 수 없어. %s...나는...불멸이다...
