actors.blobs.blizzard.desc=这里正刮着暴风雪。
actors.blobs.blizzard.name=暴风雪
actors.blobs.confusiongas.desc=这里弥漫着一团混乱的气体。
actors.blobs.confusiongas.name=混乱气体
actors.blobs.corrosivegas.desc=这里正弥漫着一团致命的腐蚀性气体。
actors.blobs.corrosivegas.name=腐蚀性气体
actors.blobs.electricity.desc=这里电场闪烁着耀眼的光芒。
actors.blobs.electricity.name=电
actors.blobs.electricity.ondeath=你当时吓坏了……
actors.blobs.electricity.rankings_desc=触电
actors.blobs.fire.desc=这里火势猛烈。
actors.blobs.fire.name=火
actors.blobs.foliage.desc=几束光线刺破了地下花园的昏暗。
actors.blobs.foliage.name=叶子
actors.blobs.freezing.desc=这里的空气异常寒冷。
actors.blobs.freezing.name=冰冻空气
actors.blobs.goowarn.desc=这里聚集着大量的暗能量！
actors.blobs.goowarn.name=暗能量
actors.blobs.inferno.desc=这里燃起了熊熊大火。
actors.blobs.inferno.name=地狱
actors.blobs.paralyticgas.desc=这里正弥漫着一团麻痹性气体。
actors.blobs.paralyticgas.name=麻痹气体
actors.blobs.regrowth.name=再生
actors.blobs.sacrificialfire.desc=这里有一个祭坛，上面燃着祭祀之火。任何在此被杀死的生物都会被献祭给地牢的亡灵。或许献祭足够多的生物后会得到奖励？
actors.blobs.sacrificialfire.name=祭祀之火
actors.blobs.sacrificialfire.reward=火焰燃起，然后消散，留下奖励！
actors.blobs.sacrificialfire.unworthy=火焰吞噬了你的祭品，但自身却不会改变。
actors.blobs.sacrificialfire.worthy=火焰吞噬了你的祭品，并愈发旺盛。
actors.blobs.smokescreen.desc=这里正翻滚着一团浓浓的黑烟。
actors.blobs.smokescreen.name=烟幕
actors.blobs.stenchgas.desc=这里弥漫着一股恶臭。
actors.blobs.stenchgas.name=恶臭气体
actors.blobs.stormcloud.desc=这里正翻滚着滚滚水汽。
actors.blobs.stormcloud.name=暴风云
actors.blobs.toxicgas.desc=这里正盘旋着一团绿色的有毒气体。
actors.blobs.toxicgas.name=有毒气体
actors.blobs.toxicgas.ondeath=你死于有毒气体……
actors.blobs.toxicgas.rankings_desc=窒息
actors.blobs.waterofawareness.desc=这口井的水蕴含着知识的力量。饮用井水可以完全鉴定你装备的所有物品，鉴定你背包中所有物品上的诅咒，并显示当前楼层的所有物品。
actors.blobs.waterofawareness.name=意识之水
actors.blobs.waterofawareness.procced=当你啜饮一口时，你会感到知识涌入你的脑海。
actors.blobs.waterofhealth.desc=这口井的水蕴含着治愈的力量。饮用此井水可以治愈你的伤口，满足你的饥饿感，并洗净任何破损物品上的诅咒。
actors.blobs.waterofhealth.name=健康之水
actors.blobs.waterofhealth.procced=你喝了一口，感觉伤口完全愈合了。
actors.blobs.web.desc=这里到处都覆盖着一张厚厚的蛛网。任何触碰到或穿过蛛网的东西都会破坏它，但也会因此被困在原地。
actors.blobs.web.name=蜘蛛网
actors.buffs.adrenaline.desc=一股强大的体能涌现，肾上腺素增强了攻击和移动速度。肾上腺素使目标以 2 倍速度奔跑，以 1.5 倍速度攻击。剩余回合数：。
actors.buffs.adrenaline.name=肾上腺素
actors.buffs.adrenalinesurge.desc=一股强大的力量涌动，可惜并非永久。\n\n力量提升：+%d.\n提升效果减弱前的回合数：%s。
actors.buffs.adrenalinesurge.name=增强
actors.buffs.amok.desc=狂暴会使目标陷入极度愤怒和混乱的状态。当一个生物处于狂暴状态时，它会攻击附近的一切，无论敌友。狂暴剩余回合数：
actors.buffs.amok.name=阿莫克
actors.buffs.arcanearmor.desc=一道薄薄的护盾环绕着你，阻挡了部分魔法攻击的伤害。你的魔法护甲当前提升了：0-%d。持续回合数直到奥术护甲减弱：%s。
actors.buffs.arcanearmor.name=奥术护甲
actors.buffs.artifactrecharge.desc=能量在你体内奔涌，加快你装备的神器充能速度。每个神器受到的影响略有不同，但它们的充能速度都会比平时快得多。剩余回合数：。
actors.buffs.artifactrecharge.name=神器充能
actors.buffs.ascensionchallenge.almost=你感觉到尤格握着护身符的手开始松动，你快要成功了！
actors.buffs.ascensionchallenge.beckon=护身符开始向远方的敌人发出呼喊声。
actors.buffs.ascensionchallenge.break=你喘了口气，感觉伤口开始愈合！
actors.buffs.ascensionchallenge.damage=护身符开始散发出黑暗能量。它燃烧了！
actors.buffs.ascensionchallenge.desc=不知何故，尤格-泽瓦通过护身符继续影响着这个世界，并试图阻止你的晋升！尤格的力量让地牢变得更加危险，敌人数量增加，实力也更强！如果不加以控制，这股力量会不断增强。击败被尤格力量强化过的敌人可以削弱它。
actors.buffs.ascensionchallenge.desc_beckon=护身符目前正在向远处的敌人发出警报，让他们知道你的位置。
actors.buffs.ascensionchallenge.desc_clear=目前，护身符散发出的黑暗能量已被尽可能地削弱了。
actors.buffs.ascensionchallenge.desc_damage=护身符的能量变得如此强大，它正在直接伤害你！
actors.buffs.ascensionchallenge.desc_haste=护身符目前正在加速远处的敌人，让他们更快地接近你！
actors.buffs.ascensionchallenge.desc_slow=该护身符目前正在减慢你的速度，并抵消加速效果！
actors.buffs.ascensionchallenge.haste=护身符开始加速远处敌人的行动！
actors.buffs.ascensionchallenge.name=护身符的诅咒
actors.buffs.ascensionchallenge.on_kill=黑暗能量会吞噬你……
actors.buffs.ascensionchallenge.slow=护身符放在你的物品栏里就像一块铅块一样沉重！
actors.buffs.ascensionchallenge.weaken=你能感觉到护身符的诅咒稍微减弱了一些。
actors.buffs.ascensionchallenge.weaken_info=击败更多敌人可以削弱护身符的诅咒。
actors.buffs.ascensionchallenge.weaken_info_no_kills=如果你击败敌人，护身符的诅咒就会减弱！
actors.buffs.barkskin.desc=你的皮肤变得坚硬，摸起来粗糙而坚实，如同树皮。坚硬的皮肤会提升你的有效护甲值，使你更好地抵御物理攻击。你的护甲值当前提升了：0-0。树皮术持续生效，直到效果减弱：1-8。如果你从多个来源获得树皮术效果，则只有最强的效果生效。
actors.buffs.barkskin.name=树皮
actors.buffs.barrier.desc=一个持久的力场护罩，可以阻挡所有伤害。只要护罩还在，它就会承受它所保护的一切的伤害。护罩也会随着时间推移缓慢衰减。剩余护罩：
actors.buffs.barrier.name=障碍
actors.buffs.berserk.action_name=狂战士
actors.buffs.berserk.angered=愤怒
actors.buffs.berserk.angered_desc=狂战士的伤势越严重，其攻击力就越强。狂战士受到物理伤害时，怒气值会不断积攒，从而获得额外伤害。即使被护甲格挡的伤害也会计入怒气值。怒气值会随时间消退。狂战士的生命值越低，怒气值持续时间越长。当怒气值达到100时，狂战士可以进入狂暴状态，获得基于其护甲等级和已损失生命值的护盾。狂暴状态下，他的护盾会随时间衰减，护盾耗尽后他必须休息才能再次积攒怒气。当前怒气值：_%1$.0f%%_\n_+%2$.0f%%_ 伤害值\n\n当前护甲和生命值下的狂暴护盾值：_%3$d_
actors.buffs.berserk.berserk=狂暴
actors.buffs.berserk.berserk_desc=恐惧和不安逐渐消散，只剩下愤怒。在这种状态下，狂战士极其强大，造成额外50点伤害并获得额外护盾，但每回合也会失去一部分护盾。当所有护盾降至0时，狂暴状态结束。狂暴结束后，狂战士需要一段时间恢复才能再次积攒怒气。剩余护盾值：
actors.buffs.berserk.exhausted=筋疲力尽的
actors.buffs.berserk.no_seal=你需要打破封印才能狂暴！
actors.buffs.berserk.rankings_desc=狂暴至死
actors.buffs.berserk.recovering=恢复中
actors.buffs.berserk.recovering_desc=内在力量终有极限。狂战士必须休息才能再次使用狂怒之力。在恢复期间，狂战士不会因受到伤害而积攒狂怒之力。
actors.buffs.berserk.recovering_desc_levels=恢复水平：_%.2f_
actors.buffs.berserk.recovering_desc_turns=直到恢复为止的回合数：_%d_
actors.buffs.bleeding.desc=伤口正在大量流血，情况令人担忧。流血每回合都会造成伤害。每回合伤害都会随机减少，直到流血最终停止。当前流血伤害：。
actors.buffs.bleeding.heromsg=你流血了！
actors.buffs.bleeding.name=出血
actors.buffs.bleeding.ondeath=你因失血过多而死……
actors.buffs.bleeding.rankings_desc=流血致死
actors.buffs.bless.desc=一阵强烈的专注爆发，有人说这是神明的启示。祝福使命中率和闪避率提高25，使受祝福者在战斗中更加有效。祝福剩余回合数：1。
actors.buffs.bless.name=蒙福
actors.buffs.blindness.desc=致盲状态会将周围世界变成一片黑暗的迷雾。致盲状态下，角色的视野范围会缩小到一格，远程攻击将失效，并且很容易失去对远处敌人的追踪。此外，致盲状态下的英雄也无法阅读卷轴或书籍。剩余致盲回合数：0。
actors.buffs.blindness.heromsg=你瞎了！
actors.buffs.blindness.name=失明
actors.buffs.blobimmunity.desc=一股奇异的力量将你包裹在一层薄薄的保护屏障中，阻挡所有有害的空气传播效果。在此屏障存在期间，你免疫所有区域性效果。剩余免疫回合数：0。
actors.buffs.blobimmunity.name=净化屏障
actors.buffs.burning.burnsup=%s 烧毁了！
actors.buffs.burning.desc=没有什么比被火焰吞噬更令人痛苦的了。火焰每回合都会造成伤害，直到被水扑灭或熄灭为止。火焰可以通过踩入水中或被碎裂药水溅到来扑灭。此外，火焰可能会点燃它接触到的易燃地形或物品。剩余燃烧回合数：0。
actors.buffs.burning.heromsg=你着火了！
actors.buffs.burning.name=燃烧
actors.buffs.burning.ondeath=你被烧死了……
actors.buffs.burning.rankings_desc=烧成灰烬
actors.buffs.championenemy$antimagic.desc=反魔法英雄受到的伤害减少 50%，并且完全免疫魔法效果。
actors.buffs.championenemy$antimagic.name=反魔法冠军
actors.buffs.championenemy$blazing.desc=烈焰勇士的近战伤害提高25%，攻击敌人后会点燃敌人，自身免疫火焰伤害，死亡时会向周围散播火焰。但他们无法将火焰散播到水面上。
actors.buffs.championenemy$blazing.name=耀眼冠军
actors.buffs.championenemy$blessed.desc=受祝福的英雄拥有4倍的命中率和闪避率。
actors.buffs.championenemy$blessed.name=蒙福的冠军
actors.buffs.championenemy$giant.desc=巨型冠军受到的伤害减少 80%，攻击范围增加 1，但不能穿过封闭空间。
actors.buffs.championenemy$giant.name=巨人冠军
actors.buffs.championenemy$growing.desc=成长中的英雄会获得持续提升的命中率、闪避率、物理伤害加成，以及受到的伤害减免。当前命中率/闪避率/伤害加成：当前伤害减免：
actors.buffs.championenemy$growing.name=成长中的冠军
actors.buffs.championenemy$projecting.desc=投射型英雄的近战伤害提高 25%，攻击范围增加 3 格。
actors.buffs.championenemy$projecting.name=冠军的预测
actors.buffs.championenemy.warn=你感觉到一股致命的气息。
actors.buffs.charm.cant_attack=你被那个敌人迷惑了，无法攻击他。
actors.buffs.charm.desc=魅惑是一种操控魔法，可以使敌人暂时互相爱慕。受魅惑影响的角色无法直接攻击魅惑他们的敌人，但仍然可以攻击其他目标。痛苦的冲击会缩短魅惑的持续时间。剩余魅惑回合数：
actors.buffs.charm.heromsg=你被迷住了！
actors.buffs.charm.name=迷住了
actors.buffs.chill.desc=虽然还没完全冻住，但还是太冷了。受冻目标的所有行动速度都会降低，降低的幅度取决于冻伤效果剩余的回合数。最严重的情况下，相当于被减速。剩余冻伤回合数：0。速度降低量：2。
actors.buffs.chill.freezes=%s 卡住了！
actors.buffs.chill.name=冷藏
actors.buffs.combo$combomove.clobber.desc=将敌人击退2格，但不造成伤害，也无法将其击落到陷阱中。连击数增加1。
actors.buffs.combo$combomove.clobber.empower_desc=将敌人击退3格，使其眩晕，并有可能将其击落到陷阱中，但不造成伤害。连击数增加1。
actors.buffs.combo$combomove.clobber.name=重击
actors.buffs.combo$combomove.crush.desc=对主要目标造成 %d%% (连击数*25%%) 点伤害，并对 7x7 范围内的其他所有敌人造成该伤害的一半。使用后重置连击数。
actors.buffs.combo$combomove.crush.empower_desc=跃至 %1$d 格，对主要目标造成 %2$d%% (连击数*25%%) 点伤害，并对 7x7 范围内的其他敌人造成该伤害的一半。使用后重置连击数。
actors.buffs.combo$combomove.crush.name=压碎
actors.buffs.combo$combomove.fury.desc=每叠连击数对应一次攻击，每次攻击造成60%伤害，并可触发附魔效果。使用后重置连击数。
actors.buffs.combo$combomove.fury.empower_desc=跳跃至 %d 格，并根据你的连击数攻击敌人一次，每次攻击造成 60%% 点伤害，并可触发附魔效果。使用后重置连击数。
actors.buffs.combo$combomove.fury.name=愤怒
actors.buffs.combo$combomove.parry.desc=激活后，可在1回合内格挡下一次攻击，并立即反击。若未成功招架任何攻击，则重置连击。
actors.buffs.combo$combomove.parry.empower_desc=激活后，可在1回合内格挡所有攻击，并立即反击。若未成功招架任何攻击，则重置连击。
actors.buffs.combo$combomove.parry.name=招架
actors.buffs.combo$combomove.slam.desc=将你格挡伤害能力的 %d%% (连击数*20%%) 转化为额外伤害。使用后重置连击数。
actors.buffs.combo$combomove.slam.empower_desc=跃至 %1$d 个方格，并造成相当于你伤害格挡能力 %2$d%% (连击数*20%%) 的额外伤害。使用后重置连击数。
actors.buffs.combo$combomove.slam.name=猛击
actors.buffs.combo.action_name=连击
actors.buffs.combo.bad_target=你必须锁定攻击范围内的敌人。
actors.buffs.combo.combo=%d 连击！
actors.buffs.combo.desc=角斗士通过成功击中敌人来积攒连击数。每次攻击都会使连击数增加1，但如果两次攻击间隔过长，连击数就会重置为0。角斗士保持连击时，他破损封印所产生的任何护盾都不会消失。积累连击数可以解锁必定命中的特殊连击攻击！在连击数达到2、4、6、8和10时，会解锁不同的攻击。有些招式会重置连击数，有些则不会，但每个招式在每次连击中只能使用一次。当前连击数：0。连击数剩余回合数：1。
actors.buffs.combo.name=组合
actors.buffs.combo.prompt=选择攻击目标。
actors.buffs.corrosion.desc=强酸以惊人的速度腐蚀血肉、金属和骨骼。腐蚀损伤会随着目标持续腐蚀而增加。剩余腐蚀圈数：0。当前腐蚀损伤：1。
actors.buffs.corrosion.heromsg=你快要融化了！
actors.buffs.corrosion.name=腐蚀
actors.buffs.corrosion.ondeath=你渐渐融化……
actors.buffs.corrosion.rankings_desc=已解散
actors.buffs.corruption.desc=腐化会渗入生物的本质，使其背离原本的本性。被腐化的生物会攻击盟友，无视昔日的敌人。腐化本身也具有破坏性，会逐渐导致目标衰弱。腐化是永久性的，其影响只有在死亡时才会结束。
actors.buffs.corruption.name=腐败的
actors.buffs.cripple.desc=你很确定腿不应该那样弯曲。残疾使移动速度减半，移动一格通常需要两回合而不是一回合。残疾剩余回合数：
actors.buffs.cripple.heromsg=你残疾了！
actors.buffs.cripple.name=残疾的
actors.buffs.daze.desc=耳鸣和视力模糊使战斗变得困难。眩晕期间，命中率和闪避率降低 50，使攻击命中和闪避都变得更加困难。眩晕剩余回合数：。
actors.buffs.daze.heromsg=你神情恍惚！
actors.buffs.daze.name=茫然
actors.buffs.degrade.desc=强大的黑暗魔法正在削弱你装备上通过升级卷轴获得的力量！装备降级后，其等级将被视为低于实际等级。_+3之后的每次升级都会比上一次弱很多。_你的物品描述将随之改变，以反映其降低的等级。降级不会影响力量需求、魔杖充能、投掷武器的耐久度或神器。剩余降级回合数：0。使用升级卷轴或移除诅咒将立即结束降级。
actors.buffs.degrade.heromsg=你的装备感觉性能下降了！
actors.buffs.degrade.name=退化的
actors.buffs.doom.desc=当宇宙似乎想要你的命时，很难继续走下去。注定厄运的角色将受到来自所有来源的额外67%伤害。厄运是永久性的，其效果只有在死亡时才会结束。
actors.buffs.doom.name=注定失败
actors.buffs.dread.desc=一种极其恐怖的恐惧，足以让目标彻底逃离地牢！受恐惧影响的生物会高速逃离对手，一旦离开视线范围就会彻底消失在地牢中。以这种方式击败的敌人只会获得一半经验值，并且不会掉落任何物品。剧痛会缩短恐惧的持续时间。恐惧剩余回合数：0。
actors.buffs.dread.name=恐惧
actors.buffs.drowsy.desc=一股魔法力量使人难以保持清醒，几个回合后，目标将陷入深度魔法睡眠。英雄可以通过受到伤害或保持满血状态来抵抗困倦。睡眠所需回合数：0。
actors.buffs.drowsy.name=昏昏欲睡
actors.buffs.earthimbue.desc=你被赋予了大地之力！所有物理攻击都会使敌人脚下的土地移动，使其在短时间内行动受限。剩余大地之力回合数：
actors.buffs.earthimbue.name=充满泥土气息
actors.buffs.enhancedrings.desc=盗贼最近使用的神器正在强化他的戒指，使它们等级+1。剩余回合数：\n\n。
actors.buffs.enhancedrings.name=强化戒指
actors.buffs.fireimbue.desc=你被赋予了火焰之力！所有物理攻击都有几率点燃敌人。此外，你完全免疫火焰效果。剩余火焰附魔回合数：0。
actors.buffs.fireimbue.name=充满火焰
actors.buffs.foresight.desc=你似乎能够用意念看到周围地形的布局。在预知术的效果下，大范围内的所有地块都会向你显现，包括任何秘密陷阱或门。剩余预知术回合数：
actors.buffs.foresight.name=远见
actors.buffs.frost.desc=不要与完全冻结混淆，这种较为温和的冻结只是将目标包裹在冰中。冻结的效果类似于麻痹，使目标无法行动。与麻痹不同的是，如果目标受到伤害，冻结效果会立即解除，因为冰会破碎。剩余冻结回合数：
actors.buffs.frost.freezes=%s 卡住了！
actors.buffs.frost.name=冷冻
actors.buffs.frostimbue.desc=你被赋予了冰霜之力！所有物理攻击都会持续给敌人叠加冰冻效果。此外，你完全免疫寒冷。剩余冰霜附魔回合数：0。
actors.buffs.frostimbue.name=充满霜冻
actors.buffs.fury.desc=你怒火中烧，敌人不会喜欢你生气的样子。你体内燃起熊熊怒火，使你的物理攻击伤害提高50点。只要你的生命值低于50点，这种怒火就会持续存在。
actors.buffs.fury.heromsg=你勃然大怒！
actors.buffs.fury.name=狂怒
actors.buffs.gravitychaostracker.desc_duration=目前还不清楚这种效果会持续多久，但不可能永远持续下去。
actors.buffs.gravitychaostracker.desc_intro=每隔几个回合，当前地牢楼层的所有角色都会被随机扔向一个方向。
actors.buffs.gravitychaostracker.desc_positive=不过，你和你的盟友似乎不受影响。
actors.buffs.gravitychaostracker.name=重力混沌
actors.buffs.greaterhaste.desc=速度瞬间提升，仿佛周围的一切都静止了。在“疾行术”效果下，移动动作完全不耗时，但其他动作仍以正常速度进行。每移动一步都会消耗一回合“疾行术”。剩余“疾行术”回合数：0。
actors.buffs.greaterhaste.name=更加匆忙
actors.buffs.haste.desc=能量流遍你的肌肉，让你能够以惊人的速度奔跑！在加速效果下，你的奔跑速度将提升3倍，但其他所有动作仍以正常速度进行。剩余加速回合数：0。
actors.buffs.haste.name=匆忙
actors.buffs.healing.desc=一种神奇的疗法正在使伤口愈合，血肉愈合。每回合生命值都会稳定恢复，直到治疗效果消失。治疗量可能会随时间推移而减弱。下次治疗量：剩余治疗量：
actors.buffs.healing.name=康复
actors.buffs.herodisguise.desc=幻术改变了你的外貌！效果纯粹是外观上的，但感觉却很奇怪。剩余伪装回合数：\n\n。
actors.buffs.herodisguise.name=伪装
actors.buffs.hex.desc=黑暗魔法会削弱专注力，使目标略微失去方向感。诅咒会降低目标20点命中率和闪避率，使目标在战斗中效率降低。剩余诅咒回合数：
actors.buffs.hex.heromsg=你中了诅咒！
actors.buffs.hex.name=诅咒
actors.buffs.holdfast.desc=战士保持原地不动，护甲值提升 %1$d-%2$d，部分增益效果的衰减速度降低 %3$d%%。此效果持续到他移动为止。
actors.buffs.holdfast.name=坚守
actors.buffs.hunger.cursedhorn=诅咒之角会在你进食时窃取部分食物能量。
actors.buffs.hunger.desc=在地下城中待的时间越长，饥饿感会逐渐增强，最终你会开始挨饿。挨饿期间，你的生命值会缓慢下降，而不是自动恢复。合理分配食物至关重要！如果你还有剩余的生命值，挨饿也并非坏事，因为这意味着之后会有更多食物。有效的食物分配可以让食物维持更长时间！
actors.buffs.hunger.desc_intro_hungry=你能感觉到肚子在叫饿，但还没到饿的地步。
actors.buffs.hunger.desc_intro_starving=你饿得肚子都疼了。
actors.buffs.hunger.hungry=饥饿的
actors.buffs.hunger.ondeath=你饿死了……
actors.buffs.hunger.onhungry=你饿了。
actors.buffs.hunger.onstarving=你饿坏了！
actors.buffs.hunger.rankings_desc=饿死
actors.buffs.hunger.starving=饥饿
actors.buffs.invisibility.desc=你完全融入周围地形，变得无法被看见。隐身期间，敌人无法攻击或追踪你。物理攻击和魔法效果（例如卷轴和魔杖）会立即解除隐身状态。剩余隐身回合数：0。
actors.buffs.invisibility.name=无形的
actors.buffs.invulnerability.desc=该角色拥有强大的保护力，使其获得短暂的无敌状态！剩余回合数：\n\n。
actors.buffs.invulnerability.name=无敌的
actors.buffs.levitation.desc=一股魔法力量正将你悬浮在地面之上，让你感到失重。悬浮状态下的角色移动无声，并无视所有地面效果。陷阱不会触发，水无法灭火，植物不会被踩踏，树根不会穿透地面，陷阱会被悬浮在空中。小心，因为所有这些效果都会在悬浮状态结束后立即生效！剩余悬浮回合数：0。
actors.buffs.levitation.name=悬浮
actors.buffs.lifelink.desc=该角色的生命力与附近另一角色相连。他们受到的任何伤害都会分担。每当该角色受到伤害时，一半的伤害将转移给生命链接目标。生命链接剩余回合数：0。
actors.buffs.lifelink.name=生命链接
actors.buffs.lifelink.ondeath=生命相关的伤害夺走了你的生命……
actors.buffs.light.desc=即使在最黑暗的地牢中，身边稳定的光线也总能让人感到安心。光线有助于驱散黑暗，让你即使在恶劣的环境中也能看清相当远的距离。剩余照明圈数：
actors.buffs.light.name=照明
actors.buffs.lockedfloor.desc=当前楼层已锁定，您无法离开！楼层锁定期间，您不会获得饥饿值，也不会因饥饿而受到伤害。此外，如果您不努力击败此楼层的首领，被动回复效果也会停止。另外，如果您在楼层锁定期间被未受祝福的安卡复活，则该楼层将会重置。击败此楼层的首领即可解除锁定。
actors.buffs.lockedfloor.name=楼层已锁
actors.buffs.lostinventory.desc=你的物品栏在地下城某处丢失了！在找回物品之前，你将无法拾取或使用大多数物品。
actors.buffs.lostinventory.name=库存丢失
actors.buffs.magicalsight.desc=不知何故，你能够用心灵而非双眼去看。魔法视觉激活时，你将能够看穿半径 12 格内的所有地形。魔法视觉剩余回合数：0。
actors.buffs.magicalsight.name=神奇的景象
actors.buffs.magicalsleep.desc=该角色陷入了深度魔法睡眠，无法自然醒来。魔法睡眠与普通睡眠类似，区别在于只有受到伤害才能唤醒目标。对于英雄及其盟友而言，魔法睡眠具有一定的恢复效果，使他们能够在休息时快速恢复生命值。
actors.buffs.magicalsleep.fallasleep=你陷入了深深的、神奇的睡眠中。
actors.buffs.magicalsleep.name=神奇的睡眠
actors.buffs.magicalsleep.toohealthy=你身体很健康，所以不要想睡觉。
actors.buffs.magicalsleep.wakeup=你醒来后感觉神清气爽，身体健康。
actors.buffs.magicimmune.desc=所有魔法效果都已对你失效，你完全免疫它们。魔法免疫期间，所有有害和有益的魔法效果都将对你无效，包括诅咒、附魔、魔杖、卷轴、戒指、神器等等。英雄护甲技能强大到足以不受此效果影响。魔法免疫剩余回合数：0。
actors.buffs.magicimmune.name=免疫魔法
actors.buffs.mindvision.desc=不知何故，你能够通过意念看到这一层的所有生物。这是一种奇特的感觉。只要你拥有心灵视觉，这一层的所有角色对你来说都是可见的。通过心灵视觉看到一个生物，对于许多魔法效果而言，都算作你看到它或它在附近。心灵视觉剩余回合数：0。
actors.buffs.mindvision.name=心灵愿景
actors.buffs.momentum.action_name=自由奔跑
actors.buffs.momentum.momentum=势头正盛
actors.buffs.momentum.momentum_desc=随着跑酷者的移动，他会积攒动量，并可以用动量开始跑酷。每次动量积攒可使跑酷次数达到两次，跑酷者最多可积攒 10 次动量。跑酷者停止移动时，动量会迅速消失。当前动量：0。
actors.buffs.momentum.resting=恢复中
actors.buffs.momentum.resting_desc=随着他的移动，跑酷者会积蓄动能，他可以利用这些动能开始自由奔跑。跑酷者需要时间恢复体力才能再次积蓄动能。剩余回合数：0。
actors.buffs.momentum.running=跑酷
actors.buffs.momentum.running_desc=随着他的移动，跑酷者会积攒动量，他可以用这些动量开始自由奔跑。自由奔跑时，跑酷者的移动速度翻倍，并根据其等级获得额外的闪避能力。剩余回合数：0。
actors.buffs.monkenergy$monkability$dash.desc=瞬间冲刺最多4格。此技能可以越过障碍物，但无法穿过敌人或坚硬地形。
actors.buffs.monkenergy$monkability$dash.empower_desc=瞬间冲刺最多可移动 8 格。此能力可以越过障碍物，但无法穿过敌人或坚硬地形。
actors.buffs.monkenergy$monkability$dash.name=短跑
actors.buffs.monkenergy$monkability$dash.prompt=选择地点
actors.buffs.monkenergy$monkability$dragonkick.desc=一记威力惊人的踢击，造成 %1$d-%2$d 点伤害，并无视护甲。该踢击会将目标击退，并使其每移动一格就麻痹一次。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=一记威力惊人的踢击，造成_%1$d-%2$d点伤害，并无视护甲。该踢击会将所有相邻目标击退，并使其每移动一格便陷入麻痹状态。
actors.buffs.monkenergy$monkability$dragonkick.name=龙踢
actors.buffs.monkenergy$monkability$flurry.desc=两次瞬发攻击，造成 %1$d-%2$d 点伤害，无视护甲。此技能无法重复使用。
actors.buffs.monkenergy$monkability$flurry.empower_desc=两次瞬间攻击，造成 %1$d-%2$d 点伤害，无视护甲，并使用你武器的附魔效果。此技能不能重复使用。
actors.buffs.monkenergy$monkability$flurry.name=一阵猛攻
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=僧侣全神贯注于周围环境，预判着即将到来的攻击。在这种专注状态下，她必定能格挡住下一次攻击。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=专注
actors.buffs.monkenergy$monkability$focus.desc=僧侣转身集中精神，让她格挡住接下来对她的攻击。
actors.buffs.monkenergy$monkability$focus.empower_desc=僧侣瞬间集中精神，成功招架了接下来对她的攻击。
actors.buffs.monkenergy$monkability$focus.name=重点
actors.buffs.monkenergy$monkability$meditate.desc=僧侣将能量集中于体内，持续5回合。这可以清除大部分负面效果，并使她的魔杖和神器获得8回合的充能时间。
actors.buffs.monkenergy$monkability$meditate.empower_desc=僧侣将能量集中于体内，持续5回合。这可以清除大部分负面效果，并为她的魔杖和神器充能8回合。_冥想期间，她获得80%的伤害抗性，并缓慢恢复20%的已损失生命值。_
actors.buffs.monkenergy$monkability$meditate.name=幽思
actors.buffs.monkenergy.action=武僧能力
actors.buffs.monkenergy.desc=当她击败敌人时，僧侣会获得能量，这些能量可用于各种技能。大多数敌人被击败后会提供 1 点能量，而且僧侣的能量不会随时间流逝而减少。当前能量：\n\n。
actors.buffs.monkenergy.desc_cooldown=武僧最近使用了一项技能，必须等待一段时间才能使用另一项技能。当前冷却时间：%d 回合。
actors.buffs.monkenergy.name=活力
actors.buffs.ooze.desc=这种粘稠的酸液会附着在血肉上，慢慢地将其溶解。\n\n粘液会持续造成伤害，但可以立即用水冲洗掉。\n\n剩余粘液回合数：%s。
actors.buffs.ooze.heromsg=腐蚀性粘液会侵蚀你的血肉。赶紧把它洗掉！
actors.buffs.ooze.name=腐蚀性渗出物
actors.buffs.ooze.ondeath=你渐渐融化……
actors.buffs.ooze.rankings_desc=已解散
actors.buffs.paralysis.desc=很多时候，最糟糕的做法就是什么都不做。麻痹会完全阻止所有行动，迫使目标等待效果消失。受到伤害的痛苦可以使角色抵抗麻痹，从而摆脱麻痹效果。麻痹剩余回合数：0。
actors.buffs.paralysis.heromsg=你瘫痪了！
actors.buffs.paralysis.name=瘫痪
actors.buffs.paralysis.out=抵抗麻痹
actors.buffs.physicalempower.desc=你的攻击力得到提升，物理攻击命中敌人时造成的伤害量增加。额外伤害：剩余命中次数：1。
actors.buffs.physicalempower.name=身体强壮
actors.buffs.pincushion.desc=你用来攻击该角色的投掷武器目前粘在他们身上，击败他们后会掉落在地上。以下物品目前已附着在他们身上：
actors.buffs.pincushion.name=针垫
actors.buffs.poison.desc=毒素会逐渐侵蚀身体，缓慢损害其内部机能。毒素每回合造成的伤害与毒素剩余回合数成正比。毒素剩余回合数：
actors.buffs.poison.heromsg=你中毒了！
actors.buffs.poison.name=中毒
actors.buffs.poison.ondeath=你死于中毒……
actors.buffs.poison.rankings_desc=死于中毒
actors.buffs.preparation.action_name=准备罢工
actors.buffs.preparation.assassinated=被暗杀
actors.buffs.preparation.desc=刺客正耐心等待，准备从阴影中发动攻击。
actors.buffs.preparation.desc_blink=他可以在攻击敌人之前闪现到敌人身边，最大距离为_%d。_
actors.buffs.preparation.desc_dmg=他的下一次攻击将造成_%1$d%%额外伤害_，并处决生命值低于_%2$d%%的普通敌人，或生命值低于_%3$d%%的首领。
actors.buffs.preparation.desc_dmg_likely=这次攻击也更有可能造成更大的伤害。
actors.buffs.preparation.desc_invis_next=更强攻击的回合：_%d._
actors.buffs.preparation.desc_invis_time=回合数已消耗在不可见的位置：_%d._
actors.buffs.preparation.name=准备
actors.buffs.preparation.no_target=那里没有什么可以攻击的。
actors.buffs.preparation.out_of_reach=那个目标遥不可及。
actors.buffs.preparation.prompt=选择攻击目标！最大闪烁距离：
actors.buffs.prismaticguard.desc=你正受到一个棱镜影像的守护，该影像目前处于非激活状态。当敌人出现时，棱镜影像将立即行动并保护你！非激活状态下，棱镜影像会持续恢复所受到的任何伤害。当前生命值：
actors.buffs.prismaticguard.desc_many=这张棱镜般的图像也受益于“众生之力”。剩余轮数：%d。
actors.buffs.prismaticguard.name=棱镜守卫
actors.buffs.recharging.desc=能量在你体内奔涌，提升你的魔杖和法杖的充能速度。每回合，此增益效果将使当前充能值增加四分之一，此外还会进行常规充能。剩余充能回合数：0。
actors.buffs.recharging.name=充电
actors.buffs.revealedarea.desc=地牢的某个区域暂时对英雄显现，无论英雄身处何处都能看到它。剩余回合数：\n\n。
actors.buffs.revealedarea.name=显露区域
actors.buffs.revealedchar.desc=该角色将对英雄显现，无论身处何地都将可见。剩余回合数：\n\n。
actors.buffs.revealedchar.name=揭晓
actors.buffs.roots.desc=根须（魔法或自然）会抓住双脚，迫使它们倒在地上。根须会将目标锁定在原地，使其无法移动，也无法使用大多数移动能力。其他动作不受影响，包括传送效果。剩余根须回合数：0。
actors.buffs.roots.heromsg=你动不了！
actors.buffs.roots.name=根
actors.buffs.scrollempower.desc=法师最近阅读的卷轴中的能量正在增强他的魔杖！等级提升：+ ...
actors.buffs.scrollempower.name=滚动赋能
actors.buffs.shadows.desc=你融入周围的阴影之中，获得隐身效果并减缓新陈代谢。隐身期间，敌人无法攻击或追踪你。大多数物理攻击和魔法效果（例如卷轴和魔杖）会立即解除隐身状态。此外，暗影潜行期间，你的饥饿速度也会减慢。你会一直保持暗影潜行状态，直到你离开阴影或与敌人接触为止。
actors.buffs.shadows.name=影融合
actors.buffs.slow.desc=减速魔法会影响目标的时间流逝速度，对他们来说一切都飞速运转。被减速的角色执行所有动作所需的时间是正常情况下的两倍。剩余减速回合数：
actors.buffs.slow.name=减速
actors.buffs.snipersmark.action_name_snapshot=快照
actors.buffs.snipersmark.action_name_sniper=狙击射击
actors.buffs.snipersmark.action_name_volley=截击
actors.buffs.snipersmark.desc=狙击手会锁定她最近攻击过的目标。她可以用弓箭进行特殊攻击，攻击方式取决于弓箭的强化方式。未强化的弓箭会发射一次“快照”，伤害较低，但无需等待。强化速度的弓箭会发射三支箭的“齐射”。每支箭的伤害较低，但仍可以触发附魔效果。齐射需要1回合。强化伤害的弓箭会发射一次“狙击射击”。这次射击必定命中，伤害根据与目标的距离而增加，需要2回合。剩余回合数：0。
actors.buffs.snipersmark.name=狙击手的标记
actors.buffs.soulmark.desc=术士已汲取此生物的灵魂，使其能够在受到物理伤害时进行治疗。剩余灵魂印记回合数：\n\n。
actors.buffs.soulmark.name=灵魂印记
actors.buffs.stamina.desc=你拥有无穷的耐力，可以更快地移动！在耐力效果下，你的奔跑速度将提升50倍，但其他所有动作仍以正常速度进行。剩余耐力回合数：
actors.buffs.stamina.name=耐力
actors.buffs.terror.desc=恐惧是一种操控魔法，它能迫使目标陷入无法控制的恐慌。受恐惧影响的角色会被迫逃离对手，并尽可能地在彼此之间设置门和墙。然而，剧痛会缩短恐惧的持续时间。剩余的恐惧回合数：
actors.buffs.terror.name=吓坏了
actors.buffs.toxicimbue.desc=你被注入了剧毒能量！当你移动时，毒气会不断从你身上涌出，伤害你的敌人。在效果持续期间以及之后的几个回合内，你免疫毒气和中毒。剩余剧毒能量回合数：0。
actors.buffs.toxicimbue.name=充满毒性
actors.buffs.vertigo.desc=当整个世界都在旋转时，沿直线行走会变得很困难。眩晕期间，试图移动的角色会朝着随机方向移动，而不是朝着他们想要的方向移动。剩余眩晕回合数：0。
actors.buffs.vertigo.name=眩晕
actors.buffs.vulnerable.desc=易伤魔法使角色受到的所有物理伤害增加 33%%，该伤害在被护甲减少后增加。\n\n剩余易伤回合数：%s。
actors.buffs.vulnerable.heromsg=你感觉自己很脆弱！
actors.buffs.vulnerable.name=易受伤害的
actors.buffs.wandempower.desc=你的伤害魔杖已获得强化，在几次攻击中增加其造成的伤害。额外伤害：剩余攻击次数：1。
actors.buffs.wandempower.name=魔杖被赋予力量
actors.buffs.weakness.desc=一切突然变得沉重起来。虚弱魔法会降低角色的物理力量，使其造成的伤害减少33。剩余虚弱回合数：1。
actors.buffs.weakness.heromsg=你感到虚弱！
actors.buffs.weakness.name=减弱
actors.buffs.wellfed.desc=你感到非常满足和饱足。饱足后，你的饥饿值不会增加，并且你会随着时间的推移恢复额外的生命值。剩余回合数：。
actors.buffs.wellfed.name=吃得很好
actors.char.def_verb=躲避
actors.char.def_verb_blocked=已屏蔽
actors.char.defeat=你击败了 %s。
actors.char.immune=免疫
actors.char.invulnerable=无敌的
actors.char.kill=%s 杀了你……
actors.hero.abilities.armorability.cost=费用：_%d_
actors.hero.abilities.armorability.no_target=那里没有什么可以攻击的目标！
actors.hero.abilities.armorability.prompt=选择目标位置
actors.hero.abilities.armorability.self_target=你不能以自己为目标！
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=牧师的身体散发出耀眼的光芒。在此形态下，牧师的攻击范围增加2点（源自其散发的神圣能量），并且每次消耗圣典充能时获得10点护盾值。他们还可以施放通过升华形态天赋解锁的法术。升华形态及其法术提供的护盾值不会正常衰减，而是在升华形态结束时立即消失。当前护盾值：剩余回合数：
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=升华形式
actors.hero.abilities.cleric.ascendedform.desc=牧师从自身散发出神圣能量，进入持续10回合的光辉形态。在此形态下，牧师可以施放新的法术，攻击范围增加2点，获得30点护盾值，并且每次额外施放的法术都会根据消耗的圣典充能数量额外提供10点护盾值。升华形态及其法术提供的护盾值不会像普通形态那样衰减，而是在升华形态结束后立即消失。该能力可以再次使用以刷新升华形态的持续时间。
actors.hero.abilities.cleric.ascendedform.name=升华形式
actors.hero.abilities.cleric.ascendedform.short_desc=牧师进入_升华形态_，获得新的法术、攻击范围和护盾。
actors.hero.abilities.cleric.powerofmany$lightally.desc=这是牧师一位冒险伙伴的复制体，由实体光构成。虽然它拥有另一位英雄的外形，但它不具备该英雄的任何独特能力。只要“众生之力”对其生效，这位盟友就会一直存在。再次使用“众生之力”护甲能力，即可免费操控这位盟友。
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=你的盟友发起攻击！
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=你的盟友移动到那个位置。
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=你的盟友会跟随你。
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=你可以通过特定的英雄护甲技能找到这个角色。
actors.hero.abilities.cleric.powerofmany$lightally.name=轻微的盟友
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=这位盟友已获得“众生之力”的强化，使其造成的伤害+25%%，受到的伤害-25%%。他们还会与牧师共享视野范围，并能受益于“众生之力”法术。“众生之力”的效果会在诸如棱镜镜像之类的盟友隐匿时持续存在，但其持续时间仍会继续倒计时。剩余回合数：%s。
actors.hero.abilities.cleric.powerofmany$powerbuff.name=众人的力量
actors.hero.abilities.cleric.powerofmany.ally_exists=你已经拥有了一位强大的盟友。
actors.hero.abilities.cleric.powerofmany.desc=牧师引导“众生之力”，该技能可以强化一名现有盟友，或创造一名新的强化盟友，持续100回合。瞄准空位即可创造一名新的盟友。在“众生之力”的强化下，任何盟友造成的伤害提高25%，受到的伤害降低25%，并与牧师共享视野。此外，该盟友在使用该技能时还会获得25点护盾值。牧师还会获得三个新的法术，这些法术只能在拥有强化盟友的情况下施放。“众生之力”的持续时间不会随着这些法术的生效而结束。
actors.hero.abilities.cleric.powerofmany.name=众人的力量
actors.hero.abilities.cleric.powerofmany.no_vision=你无法瞄准你看不见的位置。
actors.hero.abilities.cleric.powerofmany.only_allies=你只能赋能盟友。
actors.hero.abilities.cleric.powerofmany.prompt_ally=引导你的光盟友
actors.hero.abilities.cleric.powerofmany.prompt_default=选择盟友或地点
actors.hero.abilities.cleric.powerofmany.short_desc=牧师引导“众生之力”，增强现有盟友的力量或创造新的盟友。
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=分配给身体形式
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=赋予心灵形态
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=赋予灵体形态
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=选择要赋予三位一体的效果。确认前将显示更多信息。
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_身体形态：%s。_
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=心智形态：%s。
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_灵体形态：%s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=选择使用哪种形式的三位一体。不同形式的效果可以同时生效。
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=三位一体将施放此神器远程炼金术效果，消耗_%2$s点能量。
actors.hero.abilities.cleric.trinity.chaliceofblood_use=三位一体将以消耗_%2$s能量的方式，使该神器被动恢复生命值，持续20回合，恢复量为_+%1$d_。
actors.hero.abilities.cleric.trinity.cost=这项能力的充能成本各不相同，但最常见的是_%d。_
actors.hero.abilities.cleric.trinity.desc=牧师获得一套名为“三位一体”的护甲能力，可通过三个新法术将其赋予不同的物品效果。这三个法术分别模拟牧师在本次游戏过程中发现的不同类型装备的效果：肉体形态（武器和护甲）、心灵形态（魔杖和投掷武器）以及精神形态（戒指和神器）。每种“三位一体”形态一次只能赋予一种效果，牧师在使用“三位一体”时可以选择激活哪一种效果。“三位一体”不会复制你已装备的物品的效果。
actors.hero.abilities.cleric.trinity.driedrose_use=三位一体将使用此神器的效果召唤一个被腐化的友方幽灵，其生命值相当于一个_+%1$d_幽灵，消耗_%2$s点能量。
actors.hero.abilities.cleric.trinity.ench_glyph_use=三位一体将施加此效果，持续_%1$d回合_，消耗_%2$s能量。
actors.hero.abilities.cleric.trinity.etherealchains_use=三位一体将以_+%1$d_的施法距离施放此神器连锁施法效果，消耗_%2$s点能量。
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity 将使用此神器进行吞噬效果，代价为 _%2$s 点数。_
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=三位一体将以消耗_%2$s点能量为代价，施加_+%1$d_的敌方掠夺效果。
actors.hero.abilities.cleric.trinity.name=三位一体
actors.hero.abilities.cleric.trinity.no_duplicate=三位一体无法复制你已经装备的效果！
actors.hero.abilities.cleric.trinity.no_imbue=三位一体目前没有任何形态的效果，请使用它的法术之一！
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=三位一体将以消耗 1 点能量为代价，施加此强大效果，持续 10 回合。
actors.hero.abilities.cleric.trinity.ring_use=三位一体将以消耗_%2$s能量的方式，在_+%1$d_回合内施加此戒指的效果。
actors.hero.abilities.cleric.trinity.sandalsofnature_use=三位一体将施加此神器根部效果，并随机分配一个有害种子，消耗_%2$s点能量。
actors.hero.abilities.cleric.trinity.short_desc=牧师获得了三位一体的能力，这些能力可以模拟他们见过的装备，并且可以通过使用新的法术来分配。
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity 将应用此神器插入效果，消耗 _%2$s 点数。_
actors.hero.abilities.cleric.trinity.talismanofforesight_use=三位一体将以_+%1$d_的法术力消耗_%2$s点数来施放此神器占卜效果。
actors.hero.abilities.cleric.trinity.thrown_use=Trinity会以消耗_%2$s点能量的方式将此武器投掷向_+%1$d_。
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=三位一体会施加此神器的时间冻结效果，持续_%1$d_回合，消耗_%2$s点能量。
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity 将应用此神器随机卷轴效果，有 _%1$d/10_ 的几率免费提供异域版本，但需支付 _%2$s 费用。
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity 将以 +%1$d 的能量消耗这根多重充能魔杖，能量值为 %2$s。
actors.hero.abilities.cleric.trinity.wand_use=Trinity 将以 _%2$s 的费用，在 _+%1$d_ 处使用这根魔杖。
actors.hero.abilities.duelist.challenge$duelparticipant.desc=该角色正在参与决斗。该角色及其盟友或随从可以正常行动，而其他角色则被冻结。决斗将持续一段固定的时间，直到一方死亡，或双方移动距离超过 5 格。剩余回合数：
actors.hero.abilities.duelist.challenge$duelparticipant.name=决斗参与者
actors.hero.abilities.duelist.challenge.ally_target=你只能挑战敌人。
actors.hero.abilities.duelist.challenge.already_dueling=你一次只能进行一场决斗。
actors.hero.abilities.duelist.challenge.desc=决斗者向附近的敌人发起决斗挑战。该敌人被迫与她战斗，而其他所有敌人则暂时被冻结在时间中。目标必须在决斗者的攻击范围内，且距离在决斗者5格以内。决斗持续10回合，直到敌人死亡，或者决斗者与敌人之间的距离超过5格。被冻结的敌人处于无敌状态。决斗者的盟友不会受到此技能的影响，但如果目标是首领，其手下也不会被冻结。
actors.hero.abilities.duelist.challenge.distant_target=那个敌人距离太远，无法挑战。
actors.hero.abilities.duelist.challenge.name=挑战
actors.hero.abilities.duelist.challenge.prompt=选择一个敌人来挑战
actors.hero.abilities.duelist.challenge.short_desc=决斗者向附近的敌人发起决斗挑战，暂时冻结所有其他敌人。
actors.hero.abilities.duelist.challenge.unreachable_target=你必须能够达成目标。
actors.hero.abilities.duelist.elementalstrike.desc=决斗者攻击敌人或目标区域，进行一次必定命中的普通攻击，并散播一个魔法效果，该效果以65度锥形范围传播，最多可达4格。该魔法效果会根据决斗者主武器上的附魔而有所不同。
actors.hero.abilities.duelist.elementalstrike.generic_desc=没有附魔的元素攻击会释放一小股魔法，对范围内的所有敌人造成 6-12 点伤害。
actors.hero.abilities.duelist.elementalstrike.name=元素打击
actors.hero.abilities.duelist.elementalstrike.short_desc=决斗者施展元素打击，根据武器附魔效果，在锥形范围内散播效果。
actors.hero.abilities.duelist.feint.bad_location=你不能搬到那个地方。
actors.hero.abilities.duelist.feint.desc=决斗者在冲刺到相邻方格时佯装攻击，留下一个短暂的残影。原本攻击决斗者的敌人会转而攻击她的残影。攻击残影的敌人会陷入混乱状态，取消其下一次行动，并使其容易受到突袭。
actors.hero.abilities.duelist.feint.name=佯攻
actors.hero.abilities.duelist.feint.prompt=选择一个地点冲刺
actors.hero.abilities.duelist.feint.short_desc=决斗者使用佯攻，在冲刺到相邻格子的同时假装攻击。敌人会攻击她的残影，从而露出破绽，让她有机会反击。
actors.hero.abilities.duelist.feint.too_far=那个地点离你并不相邻。
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=女猎手短暂获得强化，提高她的移动速度和弓箭攻击速度。剩余回合数：\n\n。
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然的力量
actors.hero.abilities.huntress.naturespower.desc=女猎手暂时以自然之力强化自身和弓箭！此效果持续8回合。在此期间，女猎手的移动速度提升2倍，弓箭攻击速度提升33%。如果狙击手正在使用特殊攻击，则弓箭的强化效果不会触发。
actors.hero.abilities.huntress.naturespower.name=自然的力量
actors.hero.abilities.huntress.naturespower.short_desc=女猎手召唤_自然之力_，在短时间内提高移动速度和弓箭射速。
actors.hero.abilities.huntress.spectralblades.desc=女猎手向敌人投掷出一把幽灵利刃，其效果如同使用近战武器进行远程攻击。近战武器的所有常规效果都会激活，包括附魔效果。
actors.hero.abilities.huntress.spectralblades.name=光谱刀片
actors.hero.abilities.huntress.spectralblades.short_desc=女猎手向目标投掷_幽灵之刃_，根据她当前装备的近战武器造成伤害。
actors.hero.abilities.huntress.spirithawk$hawkally.desc=一只由女猎手召唤的魔法鹰。它散发着明亮的空灵蓝光，头部不断转动，环顾四周。虽然它并不擅长战斗，但它的速度和视力使它成为侦察和分散敌人注意力的绝佳选择。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=剩余的保证闪避次数：%d。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=剩余圈数：%d。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=你的鹰准备攻击！
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=你的鹰飞到了那个位置。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=你的鹰会跟着你飞。
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=你可以通过特定的英雄护甲技能找到这个角色。
actors.hero.abilities.huntress.spirithawk$hawkally.name=灵鹰
actors.hero.abilities.huntress.spirithawk.desc=猎手召唤一只灵鹰伙伴，召唤期间可再次使用该技能来操控它。灵鹰持续100回合，操控灵鹰不消耗任何能量。灵鹰生命值和攻击力较低，但速度快、身手敏捷且精准。它始终与猎手共享整个视野。它免疫所有范围效果，例如火焰和毒气。除非受到明确指示，否则它不会主动攻击。
actors.hero.abilities.huntress.spirithawk.name=灵鹰
actors.hero.abilities.huntress.spirithawk.no_space=您附近没有空位。
actors.hero.abilities.huntress.spirithawk.short_desc=女猎手召唤一只_灵鹰_使魔，它可以帮助她侦察位置并分散敌人的注意力。
actors.hero.abilities.mage.elementalblast.desc=法师释放出一道魔法冲击波，覆盖半径最多4格的圆形区域，造成15-25点伤害。元素冲击波的具体效果取决于法师法杖上附魔的魔杖类型。
actors.hero.abilities.mage.elementalblast.generic_desc=元素爆破的效果与用魔杖攻击敌人或盟友时的效果类似。
actors.hero.abilities.mage.elementalblast.name=元素爆破
actors.hero.abilities.mage.elementalblast.no_staff=没有你的法师，你无法使用这项能力。
actors.hero.abilities.mage.elementalblast.short_desc=法师从他的法杖中发出元素冲击波，覆盖他周围的大片区域，其效果会根据他法杖中的魔杖而变化。
actors.hero.abilities.mage.warpbeacon.depths=你无法在不同的深度之间进行传送！
actors.hero.abilities.mage.warpbeacon.desc=法师放置一个信标，之后可以随意传送至该信标处。放置信标需要1回合，但传送至该信标处是瞬间完成的。默认情况下，法师无法在楼层之间传送，也无法使用信标到达无法进入的地方，例如锁着的房间。法师可以传送至敌人身边，将他们推开。
actors.hero.abilities.mage.warpbeacon.invalid_beacon=你不能在那里放置信标！
actors.hero.abilities.mage.warpbeacon.locked_floor=你不能离开已上锁的楼层！
actors.hero.abilities.mage.warpbeacon.name=跃迁信标
actors.hero.abilities.mage.warpbeacon.short_desc=法师在当前位置放置一个_传送信标_，他可以立即传送回该位置。
actors.hero.abilities.mage.warpbeacon.too_far=那个地方太远了！
actors.hero.abilities.mage.warpbeacon.window_cancel=取消
actors.hero.abilities.mage.warpbeacon.window_clear=清晰的信标
actors.hero.abilities.mage.warpbeacon.window_desc=您的信标当前位于 %d 层。
actors.hero.abilities.mage.warpbeacon.window_tele=传送至信标
actors.hero.abilities.mage.wildmagic.desc=法师释放魔杖中的力量，在一回合内随机发射最多4次。法师的法杖不参与此效果。每根魔杖的等级提升2级，最高可达+3。每次发射消耗半点魔杖能量，且每根魔杖最多只能发射2次。
actors.hero.abilities.mage.wildmagic.name=狂野魔法
actors.hero.abilities.mage.wildmagic.no_wands=你没有魔杖可以用来施法！
actors.hero.abilities.mage.wildmagic.short_desc=法师释放魔杖中蕴含的狂野魔法，在一回合内随机多次向选定的目标发射魔杖。
actors.hero.abilities.ratmogrify$transmograt.desc=这个敌人已经变成了一只老鼠。依我看，这可是个巨大的进步！——鼠王
actors.hero.abilities.ratmogrify$transmograt.name=鼠化 %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=被以下敌人杀死：鼠形敌人
actors.hero.abilities.ratmogrify.cant_transform=你不能把那东西变成老鼠！
actors.hero.abilities.ratmogrify.desc=英雄将一名敌人变成老鼠，持续6回合！首领、盟友和老鼠都无法被鼠化。被鼠化的敌人保留其原有属性，但没有任何技能。
actors.hero.abilities.ratmogrify.name=鼠形
actors.hero.abilities.ratmogrify.short_desc=英雄可以使用“鼠化”技能将敌人变成一只老鼠！这会暂时将敌人变成一只失去所有能力的老鼠。
actors.hero.abilities.ratmogrify.too_strong=那个敌人太强大了，无法被鼠化！
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=该敌人已被标记，使其受到 25%% 额外伤害，但同时也使其在标记结束前不会死亡。剩余回合数：%s。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=被标记为死亡
actors.hero.abilities.rogue.deathmark.ally_target=你只能标记敌人
actors.hero.abilities.rogue.deathmark.desc=盗贼会在选定的敌人身上施加一个标记，使其受到的伤害额外增加25%。标记立即生效，持续5回合。被标记的敌人会受到额外伤害，但在标记消失前不会死亡。如果敌人在标记结束时生命值为0，则会立即死亡。
actors.hero.abilities.rogue.deathmark.name=死亡标记
actors.hero.abilities.rogue.deathmark.short_desc=盗贼会在选定的敌人身上施加一个“死亡印记”。被标记的敌人会受到额外伤害，但在印记消失前不会死亡。
actors.hero.abilities.rogue.shadowclone$shadowally.desc=一个由阴影黑暗构成的盗贼复制品。它一动不动地站着，双眼空洞，缕缕黑暗如同蒸汽般从它身上升腾而起。这个复制品并非盗贼的完美复制品，但仍然是一位不错的战士，并且如果天赋合适，还能从盗贼的装备中获益。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=你的克隆体准备攻击！
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=你的克隆体移动到那个位置。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=你的克隆体会跟随你移动。
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=你可以通过特定的英雄护甲技能找到这个角色。
actors.hero.abilities.rogue.shadowclone$shadowally.name=暗影盗贼
actors.hero.abilities.rogue.shadowclone.desc=盗贼召唤一个自己的影子分身，可以指挥它协助自己战斗。指挥影子分身不消耗任何能量。分身拥有80点生命值，没有护甲，每次攻击造成10-20点伤害。所有这些属性都可以通过天赋进行强化，使分身能够受益于英雄所装备的武器和护甲。
actors.hero.abilities.rogue.shadowclone.name=影子克隆
actors.hero.abilities.rogue.shadowclone.short_desc=盗贼可以召唤一个暗影分身，并指挥它协助自己进行战斗。
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=不知何故，敌人很容易就相信这个木制诱饵就是真正的盗贼！
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=你可以通过特定的英雄护甲技能找到这个角色。
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木制诱饵
actors.hero.abilities.rogue.smokebomb.desc=盗贼投掷烟雾弹，并闪现至多6格远。他可以穿过障碍物和敌人，但无法穿过墙壁等实体地形。与盗贼原位置相邻的敌人将被致盲5回合。
actors.hero.abilities.rogue.smokebomb.fov=你只能跳到视野范围内的空位。
actors.hero.abilities.rogue.smokebomb.name=烟雾弹
actors.hero.abilities.rogue.smokebomb.prompt=选择要跳转到的位置
actors.hero.abilities.rogue.smokebomb.short_desc=盗贼在闪现离开的同时投掷了一枚烟雾弹。他会使原位置附近的敌人暂时失明。
actors.hero.abilities.warrior.endure$enduretracker.desc=战士现在会根据他所受到的伤害造成额外伤害。额外伤害：剩余攻击次数：
actors.hero.abilities.warrior.endure$enduretracker.name=耐力
actors.hero.abilities.warrior.endure.desc=战士持续忍耐3回合，受到的所有伤害减半。此减伤效果在护甲等伤害减免效果生效前计算。忍耐结束后，战士在接下来的10回合内受到的下一次攻击将获得额外伤害。此额外伤害等于忍耐期间所有伤害的一半（不计任何伤害减免效果）！如果战士拥有连击，使用此技能将使其剩余持续时间延长3回合。
actors.hero.abilities.warrior.endure.name=忍受
actors.hero.abilities.warrior.endure.short_desc=战士会“忍耐”，跳过几个回合，但获得极高的伤害抗性。然后，他会根据自己承受的伤害量造成额外伤害。
actors.hero.abilities.warrior.heroicleap.desc=战士跃向目标位置，越过沿途的敌人或障碍物。但他无法跃过墙壁或其他坚硬地形。
actors.hero.abilities.warrior.heroicleap.name=英勇一跃
actors.hero.abilities.warrior.heroicleap.prompt=选择跳跃方向
actors.hero.abilities.warrior.heroicleap.short_desc=战士向目标位置进行_英雄跳跃_，飞跃敌人和危险物。
actors.hero.abilities.warrior.shockwave.desc=战士猛击地面，产生一道冲击波，以60度锥形范围传播至多5格。被冲击波击中的敌人将瘫痪5回合。他们还会受到5-10点伤害，此外，战士每超过10点力量值，还会额外受到1-2点伤害。
actors.hero.abilities.warrior.shockwave.name=冲击波
actors.hero.abilities.warrior.shockwave.short_desc=战士猛击地面，释放锥形范围的冲击波。被冲击波击中的敌人会受到伤害并陷入残废状态。
actors.hero.hero.key_distracted=你打不开锁，得继续尝试。
actors.hero.hero.leave=你还不能离开，地牢的其余部分还在下方等着你！
actors.hero.hero.level_cap=你无法变得更强壮，但你的经历确实会给你带来强大的力量！
actors.hero.hero.level_up=升级！
actors.hero.hero.locked_chest=这个箱子上了锁，你没有匹配的钥匙。
actors.hero.hero.locked_door=您没有匹配的钥匙。
actors.hero.hero.name=你
actors.hero.hero.new_level=升级！命中率+，闪避率+，生命值+5！
actors.hero.hero.new_talent=+1 天赋点！
actors.hero.hero.noticed_smth=你注意到了一些事情。
actors.hero.hero.pain_resist=疼痛能帮助你抵抗睡意。
actors.hero.hero.revive=生命之符迸发出赋予生命的能量！
actors.hero.hero.search=搜索
actors.hero.hero.search_distracted=很难集中注意力，搜索很累人。
actors.hero.hero.unspent=你还有未使用的天赋点数！
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=你不能携带：%s。
actors.hero.hero.you_now_have=你捡到了：%s。
actors.hero.heroclass.cleric=牧师
actors.hero.heroclass.cleric_desc=牧师初始拥有一本独特的圣典，可用于施放各种法术。牧师的大部分天赋都集中在学习或升级法术上。此外，牧师初始还拥有一根木棒、布甲、一个水囊和一个天鹅绒袋。牧师会自动鉴定以下物品：鉴定卷轴、净化药水和移除诅咒卷轴。
actors.hero.heroclass.cleric_desc_short=牧师是神圣法术施放者，他们使用独特的圣典来引导神圣魔法。他们可以通过天赋来学习和升级法术。
actors.hero.heroclass.cleric_unlock=要解锁牧师职业，请彻底清除任何一件被诅咒装备上的诅咒。
actors.hero.heroclass.duelist=决斗者
actors.hero.heroclass.duelist_desc=决斗者初始装备一把独特的细剑，拥有随时间充能的特殊能力。游戏中每种武器都拥有不同的特殊能力，供决斗者使用。决斗者初始还拥有两根投掷尖刺、布甲、水囊和天鹅绒袋。决斗者会自动鉴定以下物品：鉴定卷轴、力量药水和镜像卷轴。
actors.hero.heroclass.duelist_desc_short=决斗者是一位武器大师，她可以使用自己的武器触发一种特殊的武器能力。这种特殊能力因武器而异。
actors.hero.heroclass.duelist_unlock=要解锁决斗者职业，_装备一把2级或更高阶且无力量惩罚的武器。_
actors.hero.heroclass.huntress=女猎手
actors.hero.heroclass.huntress_desc=女猎手初始拥有一把独特的灵弓，可以发射无限数量的召唤箭矢。女猎手可以穿过高草丛而不会踩踏它们。女猎手初始还拥有镶钉手套、布甲、水囊和天鹅绒小袋。女猎手会自动鉴定：鉴定卷轴、心灵视觉药水和催眠卷轴。
actors.hero.heroclass.huntress_desc_short=女猎手精通投掷武器，拥有一把箭矢无限的魔法弓。她还能穿过高高的草丛，而不会踩踏草丛。
actors.hero.heroclass.huntress_unlock=解锁女猎手：在一局游戏中用投掷武器击中敌人 10 次。
actors.hero.heroclass.mage=法师
actors.hero.heroclass.mage_desc=法师初始拥有一根独特的法杖，其充能速度远超魔杖，且充能次数也多一次。法师可以在地牢中找到任何魔杖并将其附魔到这根法杖上。此外，法师初始还拥有附魔于法杖上的魔法飞弹魔杖、布甲、水囊和天鹅绒小袋。法师会自动鉴定以下物品：鉴定卷轴、液态火焰药水和升级卷轴。
actors.hero.heroclass.mage_desc_short=这位法师精通奥术，他拥有一根比魔杖威力更强的魔法杖。这根魔法杖可以吸收法师找到的任何魔杖的力量。
actors.hero.heroclass.mage_unlock=要解锁法师，请使用升级卷轴来强化物品。
actors.hero.heroclass.rogue=流氓
actors.hero.heroclass.rogue_desc=盗贼初始拥有一件独特的暗影斗篷，可以随意隐身。盗贼还能从更远的距离侦测到秘密和陷阱。此外，盗贼初始还拥有匕首、三把飞刀、布甲、水袋和天鹅绒袋。盗贼会自动鉴定以下物品：鉴定卷轴、隐形药水和魔法地图卷轴。
actors.hero.heroclass.rogue_desc_short=盗贼可以利用他的“暗影斗篷”躲避敌人并从隐身状态发动攻击。他还可以从更远的距离“侦测到秘密和陷阱”。
actors.hero.heroclass.rogue_unlock=解锁“叛逆者”角色，需要在单局游戏中完成10次突袭。
actors.hero.heroclass.warrior=战士
actors.hero.heroclass.warrior_desc=战士初始拥有一件独特的破损封印，当生命值低于一半时，封印会为其提供短暂的护盾效果。该封印可以在不同盔甲间转移，并且可以转移一项升级。战士初始还拥有一把破旧的短剑、三块投掷石、布甲、一个水囊和一个天鹅绒袋。战士会自动鉴定以下物品：鉴定卷轴、治疗药水和狂怒卷轴。
actors.hero.heroclass.warrior_desc_short=战士的护盾由其破碎的封印提供，可以承受额外伤害。该封印可以在盔甲之间转移，并转移一次升级。
actors.hero.heroclass.warrior_unlock=战士角色自动解锁。
actors.hero.herosubclass.assassin=刺客
actors.hero.herosubclass.assassin_desc=刺客隐身时会准备下一次攻击。准备时间越长，下一次攻击威力越大。准备时间最多可累积9回合。准备完毕后，刺客的下一次攻击将造成额外伤害，可以瞬间移动到目标身边，甚至可以瞬间击杀足够弱小的敌人。
actors.hero.herosubclass.assassin_short_desc=刺客可以在隐身状态下准备致命一击。等待的时间越长，攻击威力就越大。
actors.hero.herosubclass.battlemage=战斗法师
actors.hero.herosubclass.battlemage_desc=战斗法师每次使用法杖进行近战攻击时，都会获得额外效果，如同法杖附有额外魔法一般。这些效果取决于法杖所附魔的魔杖类型，每根魔杖都有其独特的效果。除了魔杖效果之外，战斗法师每次使用法杖攻击时，法杖还会获得0.5层充能。
actors.hero.herosubclass.battlemage_short_desc=战斗法师在使用法杖进行近战时会施放额外效果。这些效果取决于法杖所附魔的魔杖类型。
actors.hero.herosubclass.berserker=狂战士
actors.hero.herosubclass.berserker_desc=狂战士受到物理伤害时会积攒怒气，即使是被护甲格挡的伤害也会积攒怒气！怒气会随时间逐渐消退，但生命值越低，消退速度越慢。怒气可使狂战士的伤害提升至多50%。怒气达到最大值时，狂战士会进入狂暴状态，获得短暂的护盾效果，并且只要护盾还在，怒气就会持续存在。护盾效果与狂战士的护甲等级成正比，生命值越低，护盾效果越强。狂战士进入狂暴状态后需要一段时间才能恢复。
actors.hero.herosubclass.berserker_short_desc=狂战士受到伤害时会积攒怒气。怒气可以提升他的伤害，并在怒气达到100%时激活，提供额外的护盾。
actors.hero.herosubclass.champion=冠军
actors.hero.herosubclass.champion_desc=冠军精通近战武器，除了主武器外，还可以装备副武器。她的普通攻击使用主武器，但她可以瞬间切换主武器并使用两把武器的技能。此外，她还会获得2层额外武器技能充能，以及50%的武器技能充能速度提升。
actors.hero.herosubclass.champion_short_desc=冠军角色可以同时使用两把武器，并且拥有更多武器充能次数。她的普通攻击使用主武器，但她可以切换武器并使用其中一把武器的技能。
actors.hero.herosubclass.freerunner=自由奔跑者
actors.hero.herosubclass.freerunner_desc=自由奔跑者移动时会积攒动量。奔跑10回合后最多可积攒10点动量，但一旦停止移动，动量会迅速消失。自由奔跑者可以消耗动量来进入自由奔跑状态，每点动量可持续2回合。自由奔跑时，自由奔跑者的移动速度提升2倍，并获得与等级成正比的额外闪避加成。自由奔跑结束后，需要等待一段时间才能再次积攒动量。
actors.hero.herosubclass.freerunner_short_desc=自由跑者在奔跑过程中会积蓄动能，可以用来发动自由跑。这能让他在短时间内获得额外的速度和闪避能力。
actors.hero.herosubclass.gladiator=角斗士
actors.hero.herosubclass.gladiator_desc=角斗士每次使用近战或投掷武器成功攻击时，都会积累一点连击数。如果角斗士在5回合内（击杀后15回合）没有成功攻击，则连击数重置。角斗士积累连击数时，可以使用多种必定命中的技能：连击2：击退敌人，保留连击数；连击4：造成基于护甲的伤害；连击6：格挡，保留连击数；连击8：对目标及其附近敌人造成伤害；连击10：每积累一点连击数，即可进行一次攻击。
actors.hero.herosubclass.gladiator_short_desc=角斗士通过成功攻击积攒连击数。他可以消耗连击数来使用特殊技能。
actors.hero.herosubclass.monk=僧
actors.hero.herosubclass.monk_desc=这位武僧精通体术。她击败敌人后会获得能量，这些能量可用于各种防御和辅助技能。能量不会随时间消散，但会根据武僧的等级达到上限。\n\n1 能量：快速挥拳攻击；\n2 能量：集中精神躲避下一次攻击；\n3 能量：瞬间向附近冲刺；\n4 能量：踢开敌人；\n5 能量：冥想以清除异常状态并恢复魔杖和神器的能量。
actors.hero.herosubclass.monk_short_desc=武僧在战斗中积攒能量。这些能量可以用来施展各种独特的技能。
actors.hero.herosubclass.paladin=圣骑士
actors.hero.herosubclass.paladin_desc=圣骑士获得了一系列全新升级的法术，这些法术强调近战以及与武器和盔甲的协同作用。圣骑士的“圣武器”和“圣盾”法术提供的加成更高，不再覆盖现有的附魔和符文，并且可以通过施放其他法术来延长持续时间。圣骑士还获得了“惩击”法术，该法术可以让他们进行一次必定命中的近战攻击，并附带额外的伤害和附魔效果。
actors.hero.herosubclass.paladin_short_desc=圣骑士获得了新的短程法术，以及强化版的圣武器和圣盾术。
actors.hero.herosubclass.priest=牧师
actors.hero.herosubclass.priest_desc=牧师获得了一系列全新和升级的法术，这些法术强调远程战斗以及与魔法物品的协同作用。牧师每50回合可以免费施放一次“指引之光”，照亮任何被其法术直接瞄准的敌人，并且可以与盟友、魔杖和一些神器一起消耗照明减益效果，造成相当于其等级+5的额外伤害。牧师还获得了“光辉”法术，该法术驱散黑暗并影响所有可见的敌人，触发并施加照明效果，并短暂眩晕他们，消耗2点充能。
actors.hero.herosubclass.priest_short_desc=牧师获得了新的远程法术和强化版的指引之光。
actors.hero.herosubclass.sniper=狙击手
actors.hero.herosubclass.sniper_desc=狙击手是远程战斗大师，她的远程攻击可以穿透敌人的护甲。当她用投掷武器攻击敌人时，会给敌人施加一个狙击标记，使她能够紧接着使用弓箭发动特殊攻击。这个特殊攻击会根据弓箭的强化程度而有所不同。未强化的弓箭会发射一发瞬射箭，伤害较低但瞬间完成。速射弓会发射三支箭矢，伤害较低，但仍能触发附魔效果，需要1回合才能发射。伤害弓会发射一发必定命中的狙击箭，伤害会根据距离而增加，需要2回合才能发射。
actors.hero.herosubclass.sniper_short_desc=狙击手可以用远程攻击穿透敌人的护甲。她先用投掷武器攻击，然后可以接上弓箭进行特殊攻击。
actors.hero.herosubclass.warden=典狱长
actors.hero.herosubclass.warden_desc=守卫者与自然有着紧密的联系，这赋予了她一系列与草和植物相关的额外效果。她能够看穿高高的、沟壑纵横的草丛，如同看到一片空旷的天空。守卫者投掷或种植的任何种子周围都会长出青草，践踏植物时也会获得特殊效果。这些特殊效果会取代植物原本的效果，这意味着任何植物对她来说都不会造成伤害。
actors.hero.herosubclass.warden_short_desc=守卫者可以透过高高的草丛看到东西，并且在播种和践踏植物时获得额外效果。
actors.hero.herosubclass.warlock=术士
actors.hero.herosubclass.warlock_desc=术士使用魔杖攻击角色时有几率施加灵魂印记。施加灵魂印记的几率和持续时间会随着魔杖等级的提升而增加。当敌人被施加灵魂印记时，术士每对其造成5点伤害，就会回复2点生命值，但只能通过近战或投掷武器攻击回复，魔杖攻击无效！
actors.hero.herosubclass.warlock_short_desc=术士有几率用魔杖给敌人施加灵魂印记。每当他对被标记的敌人造成物理伤害时，他都会恢复生命值。
actors.hero.spells.auraofprotection$aurabuff.desc=圣骑士周身散发着保护能量。附近任何盟友（包括圣骑士自身）受到的伤害减少，并获得圣骑士护甲符文的效果，且效果增强。剩余回合数：。
actors.hero.spells.auraofprotection$aurabuff.name=保护光环
actors.hero.spells.auraofprotection.desc=圣骑士开始散发出闪耀的保护能量光环，持续20回合。圣骑士周围2格内的任何盟友（包括自身）受到的伤害减少%1$d%%，并获得圣骑士护甲符文+%2$d%%的效果。此伤害减免效果优先于其他减伤效果（例如护甲）。符文效果的提升始终生效，但如果角色已经受益于此符文（例如圣骑士自身或其棱镜镜像），则此法术无法使圣骑士的符文效果重复生效。
actors.hero.spells.auraofprotection.name=保护光环
actors.hero.spells.auraofprotection.short_desc=提升圣骑士及其附近盟友的防御力。
actors.hero.spells.beamingray$beamingrayboost.desc=该盟友最近被光束射线传送，传送后对最近的敌人造成额外伤害。“众生之力”在此增益效果激活期间也不会消失。剩余回合数：\n\n。
actors.hero.spells.beamingray$beamingrayboost.name=光束
actors.hero.spells.beamingray.desc=牧师将盟友身上的力量转化为一道光束，将其传送至指定位置。若光束与敌人碰撞，则会将盟友传送至附近并引导其攻击敌人。光束最大射程为 0 格，并使“众生之力”的额外伤害提升 10 回合，作用于 4 格范围内最近的敌人。光束甚至可以传送原本无法移动的盟友，但此时其射程减半。
actors.hero.spells.beamingray.name=光束
actors.hero.spells.beamingray.no_space=那里没有你盟友出现的位置。
actors.hero.spells.beamingray.out_of_range=该位置超出范围。
actors.hero.spells.beamingray.short_desc=传送你的盟友并赋予额外伤害。
actors.hero.spells.blessspell.desc=牧师对自己或视线范围内的其他角色施加神圣祝福。对自己施放时效果较弱，提供 0 回合祝福和 1 个屏障。对其他角色施放时效果更强，提供 2 回合祝福和 3 个治疗。多余的治疗量会转化为屏障。
actors.hero.spells.blessspell.name=保佑
actors.hero.spells.blessspell.short_desc=祝福与护盾牧师，祝福并治疗他人。
actors.hero.spells.bodyform$bodyformbuff.desc=三位一体的形态目前赋予你一种附魔或符文的力量，如同你已将其装备在当前的武器或盔甲上一样。请注意，此形态无法提供你已受益效果的重复效果。当前效果：剩余回合数：
actors.hero.spells.bodyform$bodyformbuff.name=体型
actors.hero.spells.bodyform.desc=牧师选择本次轮回中已鉴定的附魔或符文，并将其效果赋予三位一体。当三位一体被使用时，牧师获得所选附魔或符文的效果，持续 %d 回合。此临时附魔或符文可与任何普通附魔或符文的效果叠加。此法术会替换三位一体当前所拥有的任何其他身体效果。
actors.hero.spells.bodyform.name=体型
actors.hero.spells.bodyform.short_desc=将三位一体赋予魔法或符文。
actors.hero.spells.cleanse.desc=牧师清除自身及可见盟友身上的所有有害状态效果。法术结束后，所有受影响的角色还将获得 %1$d 回合的减益免疫效果，以及 %2$d 护盾。
actors.hero.spells.cleanse.name=洁净
actors.hero.spells.cleanse.short_desc=清除减益效果并提供护盾。
actors.hero.spells.clericspell.charge_cost=费用：%d
actors.hero.spells.clericspell.invalid_enemy=你不能锁定那个敌人。
actors.hero.spells.clericspell.invalid_target=你无法指定该位置。
actors.hero.spells.clericspell.no_target=那里没有目标。
actors.hero.spells.clericspell.prompt=选择目标
actors.hero.spells.divineintervention.desc=牧师将法典中的大量力量注入自身和盟友体内，为所有人提供%1$d护盾，并将升华形态的持续时间延长%2$d回合。此法术强大的防御力与其极高的充能消耗相权衡。\n\n与其他升华形态提供的护盾一样，此护盾不会正常衰减，而是在升华形态结束时立即消失。
actors.hero.spells.divineintervention.name=神灵干预
actors.hero.spells.divineintervention.short_desc=大幅提升牧师及其盟友的护盾值。
actors.hero.spells.divinesense$divinesensetracker.desc=该角色暂时能够用心灵感应看到附近的其他生物！剩余回合数：\n\n。
actors.hero.spells.divinesense$divinesensetracker.name=神圣的感知
actors.hero.spells.divinesense.desc=牧师集中感官观察周围环境，获得范围为 %d 格的心灵视觉，持续 50 回合。此法术无需施法时间。
actors.hero.spells.divinesense.name=神圣的感知
actors.hero.spells.divinesense.short_desc=获得大范围的暂时性视觉体验。
actors.hero.spells.flash.desc=牧师在附近地点引导其升华形态并传送至该处。“闪现”法术可以将牧师传送至范围内任何已发现且无人占据的地点。每次以同一升华形态使用此法术，消耗的法术书能量都会增加。
actors.hero.spells.flash.name=闪光
actors.hero.spells.flash.prompt=选择地点
actors.hero.spells.flash.short_desc=传送至附近地点。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=50回合后，牧师将能够再次免费施放“指引之光”。剩余回合数：\n\n。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=指路明灯
actors.hero.spells.guidinglight$illuminated.desc=这个角色因受到指引之光的照射而散发出光芒。虽然这光芒不足以照亮周围区域，但这种魔法效果会让牧师更容易击中目标。
actors.hero.spells.guidinglight$illuminated.desc_generic=其他英雄仍然可以使用照明来受益于灼热之光天赋，但不会获得任何命中率加成。
actors.hero.spells.guidinglight$illuminated.desc_priest=牧师还可以利用光辉、魔杖电击、盟友的打击或某些神器的效果来吸收光辉。以这种方式使用光辉会造成相当于牧师等级+5的额外魔法伤害。
actors.hero.spells.guidinglight$illuminated.name=照明
actors.hero.spells.guidinglight.desc=牧师发射一道魔法能量束击中目标，造成2-8点伤害并使其发光。下一次对被发光的敌人进行的非负重物理攻击必定命中。
actors.hero.spells.guidinglight.desc_priest=由牧师施放此法术时威力更强。每50回合首次施放此法术无需消耗法术书能量，且光辉、魔杖、其他角色以及直接影响敌人的神器都会消耗光辉。以此方式使用光辉时，会造成相当于牧师等级+5的额外魔法伤害。
actors.hero.spells.guidinglight.name=指路明灯
actors.hero.spells.guidinglight.short_desc=造成远程魔法伤害，并保证命中。
actors.hero.spells.hallowedground$hallowedterrain.desc=这里已被圣化。圣地能减缓敌人的速度，治疗盟友，并使草地蔓延。
actors.hero.spells.hallowedground.desc=牧师将神圣魔法集中于附近的地面，创造一片持续20回合的神圣区域。施放此法术时，所有友军恢复15点生命值（健康的友军和牧师获得护盾），短暂地束缚敌人，并长出矮草。神圣区域每回合恢复友军1点生命值（健康的友军和牧师获得护盾），削弱敌人，并随机长出高草。神圣区域会被火焰摧毁，如果被动回复效果被禁用或牧师长时间未获得经验值，则会生成沟壑草。
actors.hero.spells.hallowedground.name=圣地
actors.hero.spells.hallowedground.prompt=选择地点
actors.hero.spells.hallowedground.short_desc=治疗友军，减缓敌人速度，并在范围内散播青草。
actors.hero.spells.holyintuition.cursed=你感觉到这件物品中潜藏着邪恶的魔法。
actors.hero.spells.holyintuition.desc=牧师将感官集中在一件物品上，无需装备即可判断该物品是否被诅咒。
actors.hero.spells.holyintuition.name=神圣直觉
actors.hero.spells.holyintuition.prompt=选择一件商品
actors.hero.spells.holyintuition.short_desc=判断一件物品是否被诅咒。
actors.hero.spells.holyintuition.uncursed=此物品不含邪恶魔法。
actors.hero.spells.holylance$lancecooldown.desc=牧师刚刚施放了圣枪术，必须等待一段时间才能再次施放。剩余回合数：\n\n。
actors.hero.spells.holylance$lancecooldown.name=圣枪冷却时间
actors.hero.spells.holylance.desc=牧师将大量能量凝聚成一枚威力巨大的光矛。这枚光矛造成 %1$d-%2$d 点伤害，并且对亡灵和恶魔目标始终造成最大伤害。\n\n此法术消耗极高，冷却时间为 30 回合。
actors.hero.spells.holylance.name=圣枪
actors.hero.spells.holylance.short_desc=造成大量远程魔法伤害。
actors.hero.spells.holyward$holyarmbuff.desc=牧师已将神圣能量注入其破旧的盔甲中，暂时覆盖任何现有的符文，使盔甲额外抵挡 1 点伤害。剩余回合数：\n\n。
actors.hero.spells.holyward$holyarmbuff.desc_paladin=圣骑士已将神圣能量注入其磨损的盔甲，使盔甲额外抵挡 3 点伤害。在神圣护盾激活期间施放其他法术，每消耗一次充能，其持续时间将延长 10 回合。剩余回合数：
actors.hero.spells.holyward$holyarmbuff.name=圣洁病房
actors.hero.spells.holyward.desc=牧师将圣光符文注入其穿戴的盔甲，使盔甲的伤害格挡能力提高1点。此法术无需施法时间。该符文持续50回合，并在此期间覆盖盔甲上任何增益符文。即使牧师没有穿戴盔甲，也能获得此效果。
actors.hero.spells.holyward.desc_paladin=圣骑士施放此法术时威力更强。额外格挡伤害增加至 3，该法术不再覆盖现有符文，且在圣洁守护激活期间施放其他法术，每消耗一次充能，其持续时间将延长 10 回合。
actors.hero.spells.holyward.glyph_desc=这个符文可以略微增加护甲能够阻挡的伤害量。
actors.hero.spells.holyward.glyph_name=%s 光
actors.hero.spells.holyward.name=圣洁病房
actors.hero.spells.holyward.short_desc=暂时覆盖符文效果以增强护甲格挡能力。
actors.hero.spells.holyweapon$holywepbuff.desc=牧师已将圣能注入其磨损的武器，暂时覆盖任何现有的附魔，并使该武器每次攻击额外造成 2 点魔法伤害。剩余回合数：\n\n。
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=圣骑士已将圣能注入其穿戴的武器，使其攻击额外造成 6 点魔法伤害。在圣武器激活期间施放其他法术，每消耗 1 层充能，其持续时间将延长 10 回合。剩余回合数：
actors.hero.spells.holyweapon$holywepbuff.name=圣武器
actors.hero.spells.holyweapon.desc=牧师用圣光能量附魔其穿戴的武器，使该武器每次攻击敌人时额外造成2点魔法伤害。此法术无需施法时间。此附魔持续50回合，并会覆盖武器上任何其他增益附魔。徒手攻击也能受益于此效果。
actors.hero.spells.holyweapon.desc_paladin=圣骑士施放此法术时威力更强。额外魔法伤害提升至 6，该法术不再覆盖现有附魔，且在圣武器激活期间施放其他法术，每消耗一次充能，其持续时间将延长 10 回合。
actors.hero.spells.holyweapon.ench_desc=被圣器击中的敌人会受到额外的魔法伤害。
actors.hero.spells.holyweapon.ench_name=神圣的 %s
actors.hero.spells.holyweapon.name=圣武器
actors.hero.spells.holyweapon.short_desc=暂时覆盖附魔效果以提升伤害。
actors.hero.spells.judgement.desc=牧师一拳击地，引发一道光芒爆发，对所有可见的敌人造成伤害。基础伤害为 %1$d-%2$d，此外，牧师自进入升华形态（或自上次施放“审判”）以来每施放一个法术，就会额外造成 33%% 的伤害。目前，“审判”的伤害为 %3$d-%4$d。
actors.hero.spells.judgement.name=判断
actors.hero.spells.judgement.short_desc=对所有可见敌人造成伤害。
actors.hero.spells.layonhands.desc=圣骑士通过双手引导神圣能量，治疗或保护所触及的一切。圣骑士可以对任何相邻角色施放此法术，为其提供治疗，或对自己施放此法术以获得护盾。此法术多余的治疗量将转化为护盾。此法术瞬发，可以重复施放，但一次最多只能提供相当于三次施法效果的护盾。
actors.hero.spells.layonhands.name=为手按
actors.hero.spells.layonhands.short_desc=立即治疗相邻角色或为圣骑士提供护盾。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=牧师最近对这位盟友施放了生命链接。除了生命链接的常规效果外，该角色还会受到更少的伤害，任何牧师的增益法术都会同时作用于牧师和这位盟友，而不是只作用于其中一人，并且“众生之力”在此增益效果生效期间不会消失。剩余回合数：0。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=生命链接保护
actors.hero.spells.lifelinkspell.desc=牧师强化自身与其强化盟友之间的联系。在此强化联系下，英雄及其盟友在 %1$d 回合内将共同承受所有伤害，并且“众生之力”的防御加成将提升至 -%2$d%% 点伤害。请注意，伤害是在护甲之后、“众生之力”减伤之前进行分摊的。\n\n在此效果激活期间，T3 或更低的牧师增益法术将同时作用于牧师及其盟友，如同这些法术原本只作用于其中一人一样。
actors.hero.spells.lifelinkspell.name=生命链接
actors.hero.spells.lifelinkspell.short_desc=与盟友分担伤害，并减少其受到的伤害。
actors.hero.spells.mindform.desc=牧师选择一件本轮游戏中已鉴定的魔杖或投掷武器，并将其效果赋予三位一体法术。当三位一体法术生效时，牧师可以进行一次攻击，如同使用所选物品一般，攻击力提升至+1。这将触发使用该类型物品通常会触发的所有效果。此法术会替换三位一体法术当前所附的任何其他精神效果。
actors.hero.spells.mindform.name=心形
actors.hero.spells.mindform.short_desc=将三位一体赋予魔杖或投掷武器。
actors.hero.spells.mnemonicprayer.desc=牧师念诵祷文，将特定目标身上所有增益或减益效果的持续时间延长 %1$d 回合。此法术无需施法时间。增益效果对友军（包括牧师自身）的持续时间会延长，而减益效果对敌人的持续时间会延长。\n\n“记忆祷文”只能将特定增益或减益效果的持续时间延长一次，且无法延长护甲技能提供的增益效果。
actors.hero.spells.mnemonicprayer.name=记忆祈祷
actors.hero.spells.mnemonicprayer.short_desc=延长友方/敌方身上的增益/减益效果，并重新施加照明效果。
actors.hero.spells.radiance.desc=祭司爆发出圣光，使所有可见的敌人昏迷3回合。如果敌人已被照亮，则“光辉”会触发“照亮”的额外伤害，并施加“照亮”减益效果。如果当前楼层为黑暗，则“光辉”还会使祭司自身发光100回合。
actors.hero.spells.radiance.name=辐射
actors.hero.spells.radiance.short_desc=照亮并短暂眩晕可见的敌人。
actors.hero.spells.recallinscription$useditemtracker.desc=牧师最近使用了一件与铭文“召回术”配合的物品。牧师可以施放该法术来重复该物品的效果。已使用物品：剩余回合数：
actors.hero.spells.recallinscription$useditemtracker.name=最近使用的符文
actors.hero.spells.recallinscription.desc=牧师使用神圣魔法重新施放最近 %s 回合内使用的符文石或卷轴上的魔法符文效果。“召回铭文”无法用于复制升级卷轴。此法术的充能消耗取决于最近使用的物品：符文石消耗 2 点，卷轴消耗 3 点，异域卷轴消耗 4 点。复制变形卷轴或必须使用变形或升级法术制作的炼金物品时，此法术的充能消耗也会翻倍。
actors.hero.spells.recallinscription.name=回忆铭文
actors.hero.spells.recallinscription.short_desc=重复使用最近一次使用的符文石或卷轴。
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=一道薄薄的光盾横亘在这个角色和敌人之间。它不足以完全阻挡攻击，但可以削弱攻击。剩余回合数：
actors.hero.spells.shieldoflight$shieldoflighttracker.name=光之盾
actors.hero.spells.shieldoflight.desc=牧师在自己和敌人之间创造一道薄薄的光之屏障，使自身护甲对该敌人的格挡效果提升 %1$d-%2$d，持续 5 回合。\n\n此法术施放无需时间，但不能同时对多个目标使用。
actors.hero.spells.shieldoflight.name=光之盾
actors.hero.spells.shieldoflight.short_desc=赋予目标暂时的护甲。
actors.hero.spells.smite.desc=圣骑士将正义的毁灭之力注入近战攻击。除了造成普通近战伤害外，“惩击”还能使无负重攻击必定命中，拥有+300的附魔效果，并造成额外的魔法伤害。惩击的额外魔法伤害会随着圣骑士等级的提升而增加，并且对亡灵或恶魔敌人始终造成最大额外魔法伤害。
actors.hero.spells.smite.name=惩击
actors.hero.spells.smite.short_desc=保证命中，并附带额外伤害和附魔效果。
actors.hero.spells.spiritform$spiritformbuff.desc=三位一体的灵体形态目前赋予你一件物品的力量，如同你装备了该物品一般。请注意，灵体形态无法提供你已受益效果的重复效果。当前效果：剩余回合数：
actors.hero.spells.spiritform$spiritformbuff.name=灵体
actors.hero.spells.spiritform.desc=牧师选择一枚已鉴定的戒指或神器（圣典除外），并将其效果赋予三位一体。如果选择的是戒指，则三位一体赋予该戒指的效果，持续20回合，效果强度为+0。如果选择的是神器，则三位一体复制该神器的效果，效果强度为+1。每件神器与三位一体配合使用时，其具体效果和护甲充能消耗各不相同。此法术会替换三位一体当前所拥有的任何其他灵体效果。
actors.hero.spells.spiritform.name=灵体
actors.hero.spells.spiritform.short_desc=将三位一体分配给戒指或神器。
actors.hero.spells.stasis$stasisbuff.desc=牧师当前有一名盟友处于静止状态。该盟友身上的所有增益效果（包括“众生之力”）都会被保留，并在效果结束后重新出现在牧师身边。也可以通过再次施放“静止”法术提前结束该效果。静止盟友：剩余回合数：
actors.hero.spells.stasis$stasisbuff.left_behind=你那行动不便的盟友被留在了后面。
actors.hero.spells.stasis$stasisbuff.name=处于静止状态的盟友
actors.hero.spells.stasis.desc=牧师将与盟友的联系集中于自身，使盟友暂时处于一种能量静止状态，这种状态会暂时停留在牧师体内。盟友最多会被保持静止状态 %d 回合，期间所有对其施加的增益效果均不受影响。静止状态自然结束后，盟友会出现在牧师身旁；或者牧师可以立即免费重新施放此法术，提前结束静止状态。静止状态甚至可以移动无法移动的盟友，但无法将其转移到其他楼层。
actors.hero.spells.stasis.name=停滞
actors.hero.spells.stasis.short_desc=将盟友从地牢中移除并保存下来。
actors.hero.spells.sunray.desc=牧师向目标发射一道致盲光束，造成 ZXQPH0-%2$d 点伤害，并使其失明 %3$d 回合。日光术对亡灵和恶魔目标始终造成最大伤害。\n\n 敌人被此法术击中后，其视力会进行调整，使其不再受到致盲效果的影响。但是，如果敌人在被此法术致盲期间再次受到攻击，则光束会变得过于强烈，使其麻痹。
actors.hero.spells.sunray.name=阳光
actors.hero.spells.sunray.short_desc=造成远程魔法伤害，并使目标致盲一次。
actors.hero.spells.walloflight$lightwall.desc=这里，闪烁的光幕阻挡了去路。
actors.hero.spells.walloflight.desc=圣骑士会在自己正前方创造一道由实心光板构成的墙，墙厚1格，宽%1$d格，持续20回合。这道墙的作用与普通墙类似，但可以透视。墙体生成时被困住的敌人会被短暂眩晕，并尽可能被击退。任何被困在墙内的物体都可以挣脱出来。这道墙可以向四个方位或四个对角线方向施放。如果墙体已经存在，可以免费再次使用该法术来立即清除它。
actors.hero.spells.walloflight.early_end=你驱散了光墙。
actors.hero.spells.walloflight.name=光之墙
actors.hero.spells.walloflight.short_desc=制造一道墙来阻挡敌人。
actors.hero.talent$aggressivebarriercooldown.desc=您最近已使用过此天赋，必须等待一段时间才能再次使用。剩余回合数：\n\n。
actors.hero.talent$aggressivebarriercooldown.name=攻击屏障冷却
actors.hero.talent$combinedlethalityabilitytracker.executed=执行
actors.hero.talent$deadlyfollowuptracker.desc=决斗者最近使用投掷武器攻击了一名敌人，她对同一目标的近战攻击将造成更高的伤害。剩余回合数：\n\n。
actors.hero.talent$deadlyfollowuptracker.name=致命的后续
actors.hero.talent$followupstriketracker.desc=女猎手最近用投掷武器攻击了一名敌人，她对同一目标的下一次近战攻击将造成更高的伤害。剩余回合数：\n\n。
actors.hero.talent$followupstriketracker.name=后续打击
actors.hero.talent$improvisedprojectilecooldown.desc=您最近已使用过此天赋，必须等待一段时间才能再次使用。剩余回合数：\n\n。
actors.hero.talent$improvisedprojectilecooldown.name=临时投掷物冷却时间
actors.hero.talent$lethalhastecooldown.desc=您最近已使用过此天赋，必须等待一段时间才能再次使用。剩余回合数：\n\n。
actors.hero.talent$lethalhastecooldown.name=致命急速冷却
actors.hero.talent$lingeringmagictracker.desc=法师最近使用过法杖或魔杖，他的下一次物理攻击将造成额外伤害。剩余回合数：\n\n。
actors.hero.talent$lingeringmagictracker.name=挥之不去的魔力
actors.hero.talent$liquidagilacctracker.desc=决斗者的下一次普通近战攻击将获得额外命中率。剩余回合数：\n\n。
actors.hero.talent$liquidagilacctracker.name=液态敏捷性
actors.hero.talent$patientstriketracker.desc=决斗者刚刚等待了一个回合，她的下一次近战攻击将造成额外伤害。
actors.hero.talent$patientstriketracker.name=病人罢工
actors.hero.talent$preciseassaulttracker.desc=决斗者的下一次普通近战攻击将获得额外命中率。剩余回合数：\n\n。
actors.hero.talent$preciseassaulttracker.name=精准打击
actors.hero.talent$provokedangertracker.desc=战士最近失去了护盾，他的下一次物理攻击将造成额外伤害。剩余回合数：\n\n。
actors.hero.talent$provokedangertracker.name=激怒
actors.hero.talent$rejuvenatingstepscooldown.desc=您最近已使用过此天赋，必须等待一段时间才能再次使用。剩余回合数：\n\n。
actors.hero.talent$rejuvenatingstepscooldown.name=恢复步骤冷却
actors.hero.talent$satiatedspellstracker.desc=牧师施放的下一个法术会给予他们少量的护盾。
actors.hero.talent$satiatedspellstracker.name=护盾法术
actors.hero.talent$searinglightcooldown.desc=您最近已使用过此天赋，必须等待一段时间才能再次使用。剩余回合数：\n\n。
actors.hero.talent$searinglightcooldown.name=灼热之光
actors.hero.talent$seershotcooldown.desc=您最近已使用过此天赋，必须等待一段时间才能再次使用。剩余回合数：\n\n。
actors.hero.talent$seershotcooldown.name=先知射击冷却时间
actors.hero.talent$swiftequipcooldown.desc=您最近已使用过此天赋，必须等待一段时间才能再次使用。剩余回合数：\n\n。
actors.hero.talent$swiftequipcooldown.name=快速装备冷却时间
actors.hero.talent.adventurers_intuition.desc=+1：决斗者识别武器的速度提高 2.5 倍，识别盔甲的速度提高 1.75 倍。+2：决斗者在装备武器时识别武器的速度提高 2.5 倍，识别盔甲的速度提高 2.5 倍。
actors.hero.talent.adventurers_intuition.title=冒险家的直觉
actors.hero.talent.aggressive_barrier.desc=+1：决斗者在使用武器技能且生命值低于或等于 50% 时获得 3 点护盾。+2：决斗者在使用武器技能且生命值低于或等于 50% 时获得 5 点护盾。
actors.hero.talent.aggressive_barrier.meta_desc=_如果该天赋由其他英雄获得_，则会在生命值较低时进行近战攻击时提供护盾，冷却时间为 50 回合。
actors.hero.talent.aggressive_barrier.title=攻击性屏障
actors.hero.talent.ally_warp.desc=+1：法师可以选择一名盟友立即与其交换位置，范围为2格。+2：法师可以选择一名盟友立即与其交换位置，范围为4格。+3：法师可以选择一名盟友立即与其交换位置，范围为6格。法师无法与无法移动的盟友交换位置。
actors.hero.talent.ally_warp.title=盟友传送
actors.hero.talent.arcane_vision.desc=+1：当法师用魔法攻击敌人时，他获得对该敌人的心灵视觉，持续10回合。+2：当法师用魔法攻击敌人时，他获得对该敌人的心灵视觉，持续15回合。
actors.hero.talent.arcane_vision.title=奥术视觉
actors.hero.talent.assassins_reach.desc=+1：刺客每升一级准备等级，闪现范围增加至 1/3/4/6 格，原为 1/2/3/4 格。+2：刺客每升一级准备等级，闪现范围增加至 2/4/6/8 格，原为 1/2/3/4 格。+3：刺客每升一级准备等级，闪现范围增加至 2/5/7/10 格，原为 1/2/3/4 格。此闪现可以穿过障碍物和敌人，但不能穿过墙壁等实体地形。
actors.hero.talent.assassins_reach.title=刺客的触及
actors.hero.talent.aura_of_protection.desc=+1：圣骑士可以施放“防护光环”，该法术使圣骑士及其周围2格内的所有盟友获得20%的伤害抗性，并使圣骑士的护甲符文效果提升50%，持续20回合，消耗2点能量。+2：圣骑士可以施放“防护光环”，该法术使圣骑士及其周围2格内的所有盟友获得30%的伤害抗性，并使圣骑士的护甲符文效果提升75%，持续20回合，消耗2点能量。+3：圣骑士可以施放“防护光环”，该法术使圣骑士及其周围2格内的所有盟友获得40%的伤害抗性，并使圣骑士的护甲符文效果提升75%，持续20回合，消耗2点能量。圣骑士的盔甲符文使力量提升 100%，持续 20 回合，消耗 2 次充能。
actors.hero.talent.aura_of_protection.title=保护光环
actors.hero.talent.backup_barrier.desc=+1：法师用完法杖的最后一层充能时，获得 3 点护盾值。+2：法师用完法杖的最后一层充能时，获得 5 点护盾值。
actors.hero.talent.backup_barrier.meta_desc=_如果该天赋由其他英雄获得_，则会从该英雄最高等级的魔杖触发。
actors.hero.talent.backup_barrier.title=后备屏障
actors.hero.talent.barkskin.desc=+1：当守望者踏入草地时，她会获得相当于自身等级0-50%的树皮护甲，该护甲每回合都会消失。+2：当守望者踏入草地时，她会获得相当于自身等级0-100%的树皮护甲，该护甲每回合都会消失。+3：当守望者踏入草地时，她会获得相当于自身等级0-150%的树皮护甲，该护甲每回合都会消失。
actors.hero.talent.barkskin.title=树皮
actors.hero.talent.beaming_ray.desc=牧师可以消耗1点充能，对一名强化过的盟友施放“光束射线”。这道射线可以穿墙，并将盟友传送到目标位置。如果该位置有敌人，盟友会出现在敌人旁边并攻击敌人。光束射线甚至可以传送通常无法移动的盟友，但传送距离减半。光束射线最大射程为4格，并使“群聚之力”的加成效果提升至对最近敌人造成+35%伤害，持续10回合。光束射线最大射程为8格，并使“群聚之力”的加成效果提升至对最近敌人造成+40%伤害，持续10回合。光束射线最大射程为12格，并使“群聚之力”的加成效果提升至对最近敌人造成+45%伤害，持续10回合。光束射线最大射程为_16 格，_并将“众生之力”的加成提升至_对最近的敌人造成 _+50% 的伤害_，持续 10 回合。
actors.hero.talent.beaming_ray.title=光束
actors.hero.talent.blast_radius.desc=_+1:_元素爆炸的半径从 4.\n\n_增加到 _5 格_；_+2:_元素爆炸的半径从 4.\n\n_增加到 _6 格_；_+3:_元素爆炸的半径从 4.\n\n_增加到 _7 格_；_+4:_元素爆炸的半径从 4.\n\n_增加到 _8 格_。
actors.hero.talent.blast_radius.title=爆炸半径
actors.hero.talent.bless.desc=+1：牧师可以施放“祝福术”，该法术对自己施放时可获得6回合的祝福效果和10点护盾值，对其他角色施放时可获得10回合的祝福效果和10点治疗值，消耗1点法力值。+2：牧师可以施放“祝福术”，该法术对自己施放时可获得10回合的祝福效果和15点护盾值，对其他角色施放时可获得15回合的祝福效果和15点治疗值，消耗1点法力值。此法术多余的治疗量将转化为护盾值。
actors.hero.talent.bless.meta_desc=_如果该天赋由其他英雄获得_，则会改为提升该英雄及其所有盟友的命中率和闪避率，+1 时提升 3%，+2 时提升 5%。
actors.hero.talent.bless.title=保佑
actors.hero.talent.body_form.desc=牧师可以施放“形体术”，消耗2点充能，使三位一体获得牧师在本轮游戏中已鉴定的附魔或符文的力量。当使用三位一体时，牧师获得所选效果，持续20回合。当使用三位一体时，牧师获得所选效果，持续27回合。当使用三位一体时，牧师获得所选效果，持续33回合。当使用三位一体时，牧师获得所选效果，持续40回合。一次只能赋予一种身体效果。如果选择的符文稀有且强大，三位一体护甲的充能消耗会更高。
actors.hero.talent.body_form.title=体型
actors.hero.talent.body_replacement.desc=+1：闪现后，盗贼会留下一个拥有20点生命值和1-3点护甲的木制诱饵。+2：闪现后，盗贼会留下一个拥有40点生命值和2-6点护甲的木制诱饵。+3：闪现后，盗贼会留下一个拥有60点生命值和3-9点护甲的木制诱饵。+4：闪现后，盗贼会留下一个拥有80点生命值和4-12点护甲的木制诱饵。一次只能有一个诱饵处于激活状态。
actors.hero.talent.body_replacement.title=身体置换
actors.hero.talent.body_slam.desc=+1：战士跳跃落地时，所有相邻敌人受到的伤害等于1-4点伤害加上其伤害格挡能力的25%。+2：战士跳跃落地时，所有相邻敌人受到的伤害等于2-8点伤害加上其伤害格挡能力的50%。+3：战士跳跃落地时，所有相邻敌人受到的伤害等于3-12点伤害加上其伤害格挡能力的75%。+4：战士跳跃落地时，所有相邻敌人受到的伤害等于4-16点伤害加上其伤害格挡能力的100%。
actors.hero.talent.body_slam.title=抱摔
actors.hero.talent.bounty_hunter.desc=+1：刺客使用预备攻击击杀敌人时，物品掉落几率每提升一级预备等级增加 2/4/8/16%。+2：刺客使用预备攻击击杀敌人时，物品掉落几率每提升一级预备等级增加 4/8/16/32%。+3：刺客使用预备攻击击杀敌人时，物品掉落几率每提升一级预备等级增加 6/12/24/48%。
actors.hero.talent.bounty_hunter.title=赏金猎人
actors.hero.talent.cached_rations.desc=+1：盗贼在探索地牢接下来的几层时，可以在宝箱中找到 2 份补给。+2：盗贼在探索地牢接下来的几层时，可以在宝箱中找到 3 份补给。补给可以快速食用，恢复适量的饱腹感，治疗 5 点生命值，并为暗影斗篷恢复 1 层充能。
actors.hero.talent.cached_rations.title=储备口粮
actors.hero.talent.cleanse.desc=+1：牧师可以施放“净化术”，该法术可以移除牧师和附近盟友身上的负面状态效果，并赋予他们10点护盾值，消耗2点法术力。+2：牧师可以施放“净化术”，该法术可以赋予牧师和附近盟友3回合的负面状态免疫，并赋予他们20点护盾值，消耗2点法术力。+3：牧师可以施放“净化术”，该法术可以赋予牧师和附近盟友5回合的负面状态免疫，并赋予他们30点护盾值，消耗2点法术力。
actors.hero.talent.cleanse.meta_desc=_如果该天赋由其他英雄获得_，则会在使用魔杖或神器后，有 10/20/30% 的几率清除该英雄身上的负面状态效果，同时提升 1/2/3 点。
actors.hero.talent.cleanse.title=洁净
actors.hero.talent.cleave.desc=_+1:_ 角斗士击杀敌人后获得的额外时间从 15 回合增加到 30 回合。_+2:_ 角斗士击杀敌人后获得的额外时间从 15 回合增加到 45 回合。_+3:_ 角斗士击杀敌人后获得的额外时间从 15 回合增加到 60 回合。
actors.hero.talent.cleave.title=劈开
actors.hero.talent.cloned_armor.desc=+1：暗影分身获得英雄护甲值的12%，并有25%的几率使用英雄护甲上的符文。+2：暗影分身获得英雄护甲值的24%，并有50%的几率使用英雄护甲上的符文。+3：暗影分身获得英雄护甲值的36%，并有75%的几率使用英雄护甲上的符文。+4：暗影分身获得英雄护甲值的48%，并有100%的几率使用英雄护甲上的符文。
actors.hero.talent.cloned_armor.title=克隆装甲
actors.hero.talent.close_the_gap.desc=+1：决斗者在开始决斗时会向目标闪现最多两格。+2：决斗者在开始决斗时会向目标闪现最多三格。+3：决斗者在开始决斗时会向目标闪现最多四格。+4：决斗者在开始决斗时会向目标闪现最多五格。这种闪现可以穿过障碍物和敌人，但无法穿过墙壁等实体地形。判断敌人是否在挑战范围内时，闪现效果会被考虑在内。
actors.hero.talent.close_the_gap.title=缩小差距
actors.hero.talent.combined_energy.desc=+1：如果武僧在5回合内先后使用武器技能和消耗4点或以上能量的技能，则恢复1点消耗的能量。+2：如果武僧在5回合内先后使用武器技能和消耗3点或以上能量的技能，则恢复1点消耗的能量。+3：如果武僧在5回合内先后使用武器技能和消耗2点或以上能量的技能，则恢复1点消耗的能量。
actors.hero.talent.combined_energy.title=联合能源
actors.hero.talent.combined_lethality.desc=+1：如果英雄在使用其他武器技能后立即使用近战武器攻击，则该攻击将处决任何生命值低于 13% 的非首领敌人。+2：如果英雄在使用其他武器技能后立即使用近战武器攻击，则该攻击将处决任何生命值低于 27% 的非首领敌人。+3：如果英雄在使用其他武器技能后立即使用近战武器攻击，则该攻击将处决任何生命值低于 40% 的非首领敌人。此攻击可以是普通的近战武器攻击，也可以是武器技能的一部分。
actors.hero.talent.combined_lethality.title=联合致死
actors.hero.talent.conserved_magic.desc=+1：每次狂野魔法的攻击现在消耗0.33点能量，而不是0.5点，并且狂野魔法有25%的几率不会消耗回合。+2：每次狂野魔法的攻击现在消耗0.225点能量，而不是0.5点，并且狂野魔法有50%的几率不会消耗回合。+3：每次狂野魔法的攻击现在消耗0.15点能量，而不是0.5点，并且狂野魔法有75%的几率不会消耗回合。+4：每次狂野魔法的攻击现在消耗0.1点能量，而不是0.5点，并且狂野魔法有100%的几率不会消耗回合。
actors.hero.talent.conserved_magic.title=守恒魔法
actors.hero.talent.counter_ability.desc=+1：如果决斗者在残影被攻击后的3回合内使用武器技能，她将立即恢复0.38点充能。+2：如果决斗者在残影被攻击后的3回合内使用武器技能，她将立即恢复0.77点充能。+3：如果决斗者在残影被攻击后的3回合内使用武器技能，她将立即恢复1.13点充能。+4：如果决斗者在残影被攻击后的3回合内使用武器技能，她将立即恢复1.5点充能。
actors.hero.talent.counter_ability.title=反制能力
actors.hero.talent.deadly_followup.desc=+1：决斗者使用投掷武器击中敌人时，在接下来的5回合内，她将对其造成额外10%的近战伤害。+2：决斗者使用投掷武器击中敌人时，在接下来的5回合内，她将对其造成额外20%的近战伤害。+3：决斗者使用投掷武器击中敌人时，在接下来的5回合内，她将对其造成额外30%的近战伤害。
actors.hero.talent.deadly_followup.title=致命的后续
actors.hero.talent.deathless_fury.desc=+1：狂暴会在狂战士即将死亡且怒气值达到或超过100%时自动触发，但此时会有3个英雄等级的冷却时间。+2：狂暴会在狂战士即将死亡且怒气值达到或超过100%时自动触发，但此时会有2个英雄等级的冷却时间。+3：狂暴会在狂战士即将死亡且怒气值达到或超过100%时自动触发，但此时会有1个英雄等级的冷却时间。注意：狂暴结束时，如果狂战士的生命值降至0，他仍然会死亡。
actors.hero.talent.deathless_fury.title=不死之怒
actors.hero.talent.deathly_durability.desc=+1：被死亡标记击杀的敌人会为盗贼提供相当于其被标记时生命值13%的护盾。+2：被死亡标记击杀的敌人会为盗贼提供相当于其被标记时生命值25%的护盾。+3：被死亡标记击杀的敌人会为盗贼提供相当于其被标记时生命值38%的护盾。+4：被死亡标记击杀的敌人会为盗贼提供相当于其被标记时生命值50%的护盾。
actors.hero.talent.deathly_durability.title=致命的耐久性
actors.hero.talent.desperate_power.desc=+1：法师的魔杖和法杖在充能即将耗尽时，最后一次施法会获得+1等级。+2：法师的魔杖和法杖在充能即将耗尽时，最后一次施法会获得+2等级。+3：法师的魔杖和法杖在充能即将耗尽时，最后一次施法会获得+3等级。
actors.hero.talent.desperate_power.title=绝望的力量
actors.hero.talent.directed_power.desc=+1：元素打击的直接攻击效果会根据其作用范围内敌人的数量（包括攻击目标）获得+30%的附魔强度。+2：元素打击的直接攻击效果会根据其作用范围内敌人的数量（包括攻击目标）获得+60%的附魔强度。+3：元素打击的直接攻击效果会根据其作用范围内敌人的数量（包括攻击目标）获得+90%的附魔强度。+4：元素打击的直接攻击效果会根据其作用范围内敌人的数量（包括攻击目标）获得+120%的附魔强度。
actors.hero.talent.directed_power.title=定向能
actors.hero.talent.divine_intervention.desc=+1：在升华形态下，牧师可以施放“神圣干预”，使牧师和所有盟友的护盾值提升至多150，并将升华形态的持续时间延长3回合。+2：在升华形态下，牧师可以施放“神圣干预”，使牧师和所有盟友的护盾值提升至多200，并将升华形态的持续时间延长4回合。+3：在升华形态下，牧师可以施放“神圣干预”，使牧师和所有盟友的护盾值提升至多250，并将升华形态的持续时间延长5回合。+4：在升华形态下，牧师可以施放_神圣干预_，使牧师和所有盟友的护盾值提升至多_300_，并使升华形态的持续时间延长_6回合。_神圣干预需要消耗5个书卷充能，并且在同一升华形态下只能施放一次。
actors.hero.talent.divine_intervention.title=神灵干预
actors.hero.talent.divine_sense.desc=+1：牧师可以施放“神圣感知”法术，该法术赋予他们8格心灵视觉，持续50回合，施法无需时间，消耗2点法力值。+2：牧师可以施放“神圣感知”法术，该法术赋予他们12格心灵视觉，持续50回合，施法无需时间，消耗2点法力值。
actors.hero.talent.divine_sense.meta_desc=_如果该天赋由其他英雄获得_，则会改为在使用魔杖或神器后短暂地赋予他们心灵视觉，范围为+1时3格或+2时5格。
actors.hero.talent.divine_sense.title=神圣的感知
actors.hero.talent.double_jump.desc=+1：如果战士在3回合内进行第二次跳跃，则该跳跃的充能消耗降低16%。+2：如果战士在3回合内进行第二次跳跃，则该跳跃的充能消耗降低30%。+3：如果战士在3回合内进行第二次跳跃，则该跳跃的充能消耗降低40%。+4：如果战士在3回合内进行第二次跳跃，则该跳跃的充能消耗降低50%。
actors.hero.talent.double_jump.title=双跳
actors.hero.talent.double_mark.desc=+1：同时标记第二个目标可降低30%的充能成本。+2：同时标记第二个目标可降低50%的充能成本。+3：同时标记第二个目标可降低65%的充能成本。+4：同时标记第二个目标可降低75%的充能成本。
actors.hero.talent.double_mark.title=双倍标记
actors.hero.talent.durable_projectiles.desc=_+1:_ 女猎手使用投掷武器时，耐久度增加 _50%_。\n\n_+2:_ 女猎手使用投掷武器时，耐久度增加 _75%_。
actors.hero.talent.durable_projectiles.title=耐用弹丸
actors.hero.talent.durable_tips.desc=_+1:_ 守卫者使用带尖镖的飞镖时，飞镖的耐久度增加 _2 倍_。\n\n_+2:_ 守卫者使用带尖镖的飞镖时，飞镖的耐久度增加 _3 倍_。\n\n_+3:_ 守卫者使用带尖镖的飞镖时，飞镖的耐久度增加 _4 倍_。
actors.hero.talent.durable_tips.title=耐用型笔尖
actors.hero.talent.eagle_eye.desc=+1：灵鹰的视野范围从 6 格增加到 7 格。+2：灵鹰的视野范围从 6 格增加到 8 格。+3：灵鹰的视野范围从 6 格增加到 9 格，并获得 2 格的心灵视野。+4：灵鹰的视野范围从 6 格增加到 10 格，并获得 3 格的心灵视野。
actors.hero.talent.eagle_eye.title=鹰眼
actors.hero.talent.elemental_power.desc=+1：元素爆破威力提升25%。+2：元素爆破威力提升50%。+3：元素爆破威力提升75%。+4：元素爆破威力提升100%。
actors.hero.talent.elemental_power.title=元素之力
actors.hero.talent.elemental_reach.desc=+1：元素打击的范围从 4 格增加到 5 格，宽度从 65 度增加到 75 度。+2：元素打击的范围从 4 格增加到 6 格，宽度从 65 度增加到 85 度。+3：元素打击的范围从 4 格增加到 7 格，宽度从 65 度增加到 95 度。+4：元素打击的范围从 4 格增加到 8 格，宽度从 65 度增加到 105 度。
actors.hero.talent.elemental_reach.title=元素范围
actors.hero.talent.elimination_match.desc=+1：如果决斗者在决斗结束后的3回合内再次发起挑战，则该挑战的充能消耗降低16%。+2：如果决斗者在决斗结束后的3回合内再次发起挑战，则该挑战的充能消耗降低30%。+3：如果决斗者在决斗结束后的3回合内再次发起挑战，则该挑战的充能消耗降低40%。+4：如果决斗者在决斗结束后的3回合内再次发起挑战，则该挑战的充能消耗降低50%。
actors.hero.talent.elimination_match.title=淘汰赛
actors.hero.talent.empowered_strike.desc=+1：战斗法师使用法杖进行电击后，第一次近战攻击造成的伤害提高16%，法杖的额外效果威力提高50%。+2：战斗法师使用法杖进行电击后，第一次近战攻击造成的伤害提高33%，法杖的额外效果威力提高100%。+3：战斗法师使用法杖进行电击后，第一次近战攻击造成的伤害提高50%，法杖的额外效果威力提高150%。
actors.hero.talent.empowered_strike.title=授权罢工
actors.hero.talent.empowering_meal.desc=_+1:_ 食用食物后，法师在接下来的 3 次使用魔杖造成伤害时，获得 _2 点额外伤害_。\n\n_+2:_ 食用食物后，法师在接下来的 3 次使用魔杖造成伤害时，获得 _3 点额外伤害_。
actors.hero.talent.empowering_meal.title=赋能餐
actors.hero.talent.endless_rage.desc=+1：狂战士的怒气最高可达116%。+2：狂战士的怒气最高可达133%。+3：狂战士的怒气最高可达150%。每超过100%的怒气值，狂暴护盾值增加1%，冷却时间减少1%，但伤害加成不会超过50%。
actors.hero.talent.endless_rage.title=无尽的愤怒
actors.hero.talent.energizing_meal.desc=+1：吃食物会使法师消耗 1 个回合，并使其获得 5 回合的魔杖充能。+2：吃食物会使法师消耗 1 个回合，并使其获得 8 回合的魔杖充能。
actors.hero.talent.energizing_meal.title=活力餐
actors.hero.talent.enhanced_combo.desc=+1：当角斗士的连击数达到7或更高时，“重击”的击退范围增加到3格，并附加眩晕效果，且可以将敌人击落到深渊中。+2：除了+1的增益效果外，当角斗士的连击数达到9或更高时，“格挡”可以对多次攻击生效。+3：除了+1和+2的增益效果外，角斗士在使用“猛击”、“粉碎”或“狂怒”时，可以跳跃最多3格的连击数。
actors.hero.talent.enhanced_combo.title=强化连击
actors.hero.talent.enhanced_lethality.desc=+1：刺客每提升一级准备等级，即可刺杀生命值低于 4/13/27/67% 的敌人，高于之前的 3/10/20/50%。+2：刺客每提升一级准备等级，即可刺杀生命值低于 5/17/33/83% 的敌人，高于之前的 3/10/20/50%。+3：刺客每提升一级准备等级，即可刺杀生命值低于 6/20/40/100% 的敌人，高于之前的 3/10/20/50%。
actors.hero.talent.enhanced_lethality.title=增强致死率
actors.hero.talent.enhanced_rings.desc=+1：当盗贼使用神器时，他的戒指获得+1升级，持续3回合。+2：当盗贼使用神器时，他的戒指获得+1升级，持续6回合。+3：当盗贼使用神器时，他的戒指获得+1升级，持续9回合。
actors.hero.talent.enhanced_rings.title=强化戒指
actors.hero.talent.enlightening_meal.desc=+1：牧师吃食物需要1个回合，并且其圣书获得0.67次充能。+2：牧师吃食物需要1个回合，并且其圣书获得1次充能。
actors.hero.talent.enlightening_meal.meta_desc=如果该天赋由其他英雄获得，则会改为提供魔杖和神器充能+1时2回合，或+2时3回合。此天赋不能用于丰饶号角的充能。
actors.hero.talent.enlightening_meal.title=启迪餐
actors.hero.talent.enraged_catalyst.desc=+1：狂战士武器上的附魔和诅咒会随着其怒气值的增加而更频繁地触发，在怒气值达到 100% 时，触发频率最高可提高 15%。+2：狂战士武器上的附魔和诅咒会随着其怒气值的增加而更频繁地触发，在怒气值达到 100% 时，触发频率最高可提高 30%。+3：狂战士武器上的附魔和诅咒会随着其怒气值的增加而更频繁地触发，在怒气值达到 100% 时，触发频率最高可提高 45%。
actors.hero.talent.enraged_catalyst.title=愤怒的催化剂
actors.hero.talent.evasive_armor.desc=_+1:_ 自由奔跑时，自由奔跑者的盔甲上每增加一点力量，自由奔跑者获得额外 _+1 躲避_。\n\n_+2:_ 自由奔跑时，自由奔跑者的盔甲上每增加一点力量，自由奔跑者获得额外 _+2 躲避_。\n\n_+3:_ 自由奔跑时，自由奔跑者获得他的护甲每增加一点力量，额外增加 _+3 躲避_。
actors.hero.talent.evasive_armor.title=闪避装甲
actors.hero.talent.even_the_odds.desc=+1：当“坚韧”状态结束时，战士对周围2格内的每个敌人造成额外5%的伤害。+2：当“坚韧”状态结束时，战士对周围2格内的每个敌人造成额外10%的伤害。+3：当“坚韧”状态结束时，战士对周围2格内的每个敌人造成额外15%的伤害。+4：当“坚韧”状态结束时，战士对周围2格内的每个敌人造成额外20%的伤害。
actors.hero.talent.even_the_odds.title=胜算均等
actors.hero.talent.excess_charge.desc=+1：当战斗法师的法杖充满能量时，其下一次电击将为他提供每级法杖0.67点护盾值。+2：当战斗法师的法杖充满能量时，其下一次电击将为他提供每级法杖1.33点护盾值。+3：当战斗法师的法杖充满能量时，其下一次电击将为他提供每级法杖2点护盾值。
actors.hero.talent.excess_charge.title=超额收费
actors.hero.talent.expanding_wave.desc=+1：冲击波的范围从 5 格增加到 6 格，宽度从 60 度增加到 75 度。+2：冲击波的范围从 5 格增加到 7 格，宽度从 60 度增加到 90 度。+3：冲击波的范围从 5 格增加到 8 格，宽度从 60 度增加到 105 度。+4：冲击波的范围从 5 格增加到 9 格，宽度从 60 度增加到 120 度。
actors.hero.talent.expanding_wave.title=膨胀波
actors.hero.talent.expose_weakness.desc=+1：攻击决斗者残影的敌人会变得虚弱且易伤，持续2回合。+2：攻击决斗者残影的敌人会变得虚弱且易伤，持续4回合。+3：攻击决斗者残影的敌人会变得虚弱且易伤，持续6回合。+4：攻击决斗者残影的敌人会变得虚弱且易伤，持续8回合。
actors.hero.talent.expose_weakness.title=暴露弱点
actors.hero.talent.fan_of_blades.desc=+1：幽灵之刃可额外攻击至多 1 个目标，造成 50% 的伤害。目标必须可见且位于 30 度锥形范围内。+2：幽灵之刃可额外攻击至多 2 个目标，造成 50% 的伤害。目标必须可见且位于 60 度锥形范围内。+3：幽灵之刃可额外攻击至多 3 个目标，造成 50% 的伤害。目标必须可见且位于 90 度锥形范围内。+4：幽灵之刃可额外攻击至多 4 个目标，造成 50% 的伤害。目标必须可见且位于 120 度锥形范围内。
actors.hero.talent.fan_of_blades.title=扇叶
actors.hero.talent.farsight.desc=_+1:_狙击手的视野范围_增加25%_。\n\n_+2:_狙击手的视野范围_增加50%_。\n\n_+3:_狙击手的视野范围_增加75%_。
actors.hero.talent.farsight.title=远见
actors.hero.talent.fear_the_reaper.desc=+1：当死亡标记的敌人生命值降至0时，他们会陷入残废状态。+2：当死亡标记的敌人生命值降至0时，他们会陷入恐惧和残废状态。+3：当死亡标记的敌人生命值降至0时，他们会陷入恐惧和残废状态，并且3格范围内的敌人也会陷入残废状态。+4：当死亡标记的敌人生命值降至0时，他们会陷入恐惧和残废状态，并且3格范围内的敌人也会陷入恐惧和残废状态。
actors.hero.talent.fear_the_reaper.title=畏惧死神
actors.hero.talent.feigned_retreat.desc=+1：如果敌人攻击决斗者的残影，她获得2回合的加速效果。+2：如果敌人攻击决斗者的残影，她获得4回合的加速效果。+3：如果敌人攻击决斗者的残影，她获得6回合的加速效果。+4：如果敌人攻击决斗者的残影，她获得8回合的加速效果。
actors.hero.talent.feigned_retreat.title=假装撤退
actors.hero.talent.fire_everything.desc=+1：狂野魔法的施法次数从 4 次增加到 5 次，每根魔杖有 25% 的几率可以使用 3 次。+2：狂野魔法的施法次数从 4 次增加到 6 次，每根魔杖有 50% 的几率可以使用 3 次。+3：狂野魔法的施法次数从 4 次增加到 7 次，每根魔杖有 75% 的几率可以使用 3 次。+4：狂野魔法的施法次数从 4 次增加到 8 次，每根魔杖有 100% 的几率可以使用 3 次。
actors.hero.talent.fire_everything.title=放火烧掉一切
actors.hero.talent.flash.desc=+1：在升华形态下，牧师可以施放“闪现术”传送至最多3格远的地方。+2：在升华形态下，牧师可以施放“闪现术”传送至最多4格远的地方。+3：在升华形态下，牧师可以施放“闪现术”传送至最多5格远的地方。+4：在升华形态下，牧师可以施放“闪现术”传送至最多6格远的地方。“闪现术”初始消耗2点法术能量，在同一升华形态下每次使用额外消耗1点法术能量。
actors.hero.talent.flash.title=闪光
actors.hero.talent.focused_meal.desc=+1：吃食物会使决斗者失去 1 个回合，并使她的武器获得 0.67 次充能。+2：吃食物会使决斗者失去 1 个回合，并使她的武器获得 1 次充能。
actors.hero.talent.focused_meal.meta_desc=_如果该天赋由其他英雄获得_，则会改为给予该英雄下一次攻击额外伤害，数值等于其等级/3（+1）或等级/2（+2）。
actors.hero.talent.focused_meal.title=专注餐
actors.hero.talent.followup_strike.desc=+1：当女猎手用弓箭或投掷武器击中敌人时，她对该敌人的下一次近战攻击将造成 2 点额外伤害。+2：当女猎手用弓箭或投掷武器击中敌人时，她对该敌人的下一次近战攻击将造成 3 点额外伤害。
actors.hero.talent.followup_strike.title=后续打击
actors.hero.talent.go_for_the_eyes.desc=+1：灵鹰的攻击使敌人失明2回合。+2：灵鹰的攻击使敌人失明5回合。+3：灵鹰的攻击使敌人失明5回合，并使其残废2回合。+4：灵鹰的攻击使敌人失明5回合，并使其残废5回合。
actors.hero.talent.go_for_the_eyes.title=瞄准眼睛
actors.hero.talent.growing_power.desc=+1：自然之力提供的攻击力和移动速度加成分别从 33% 和 100% 提升至 38% 和 125%。+2：自然之力提供的攻击力和移动速度加成分别从 33% 和 100% 提升至 42% 和 150%。+3：自然之力提供的攻击力和移动速度加成分别从 33% 和 100% 提升至 46% 和 175%。+4：自然之力提供的攻击力和移动速度加成分别从 33% 和 100% 提升至 50% 和 200%。
actors.hero.talent.growing_power.title=日益增长的力量
actors.hero.talent.hallowed_ground.desc=+1：牧师可以施放“圣地”法术，消耗2点法力值，将3x3区域内的地形圣化20回合。+2：牧师可以施放“圣地”法术，消耗2点法力值，将5x5区域内的地形圣化20回合。+3：牧师可以施放“圣地”法术，消耗2点法力值，将7x7区域内的地形圣化20回合。施放时，“圣地”会为友军恢复15点生命值，短暂地定身敌人，并散播矮草。之后，它会缓慢地为友军恢复生命值，削弱敌人，并随机生长出高草。圣地给予牧师护盾而不是治疗，并且会被火焰摧毁。
actors.hero.talent.hallowed_ground.title=圣地
actors.hero.talent.hasty_retreat.desc=+1：闪现后，盗贼获得1回合急速和隐身效果。+2：闪现后，盗贼获得2回合急速和隐身效果。+3：闪现后，盗贼获得3回合急速和隐身效果。+4：闪现后，盗贼获得4回合急速和隐身效果。
actors.hero.talent.hasty_retreat.title=仓促撤退
actors.hero.talent.hearty_meal.desc=+1：当战士生命值低于或等于 33% 时，食用食物可恢复 4 点生命值。+2：当战士生命值低于或等于 33% 时，食用食物可恢复 6 点生命值。
actors.hero.talent.hearty_meal.title=丰盛的一餐
actors.hero.talent.heightened_senses.desc=+1：女猎手获得对其位置周围 2 格范围内角色的心灵视觉。+2：女猎手获得对其位置周围 3 格范围内角色的心灵视觉。
actors.hero.talent.heightened_senses.title=感官增强
actors.hero.talent.heroic_energy.desc=+1：英雄的护甲技能充能消耗降低12%。+2：英雄的护甲技能充能消耗降低23%。+3：英雄的护甲技能充能消耗降低32%。+4：英雄的护甲技能充能消耗降低40%。
actors.hero.talent.heroic_energy.rat_title=老鼠能量
actors.hero.talent.heroic_energy.title=英雄能量
actors.hero.talent.hold_fast.desc=+1：战士等待时获得1-2点护甲，连击和护盾增益效果的衰减速度降低50%，直到他移动为止。+2：战士等待时获得2-4点护甲，连击和护盾增益效果的衰减速度降低75%，直到他移动为止。+3：战士等待时获得3-6点护甲，连击和护盾增益效果的衰减速度降低100%，直到他移动为止。
actors.hero.talent.hold_fast.title=坚守
actors.hero.talent.holy_intuition.desc=+1：牧师可以施放“神圣直觉”法术，消耗3点法力值，揭示一件物品是否被诅咒。+2：牧师可以施放“神圣直觉”法术，消耗2点法力值，揭示一件物品是否被诅咒。
actors.hero.talent.holy_intuition.meta_desc=_如果该天赋由其他英雄获得_，则该英雄可以在装备诅咒物品之前识别该物品的诅咒状态，+1 时有 15% 的几率，+2 时有 25% 的几率。
actors.hero.talent.holy_intuition.title=神圣直觉
actors.hero.talent.holy_lance.desc=+1：牧师可以施放“圣枪”，这是一个威力强大的法术，消耗4点能量，造成30-55点伤害。+2：牧师可以施放“圣枪”，这是一个威力强大的法术，消耗4点能量，造成45-83点伤害。+3：牧师可以施放“圣枪”，这是一个威力强大的法术，消耗4点能量，造成60-110点伤害。圣枪对恶魔和亡灵敌人总是造成最大伤害。圣枪的冷却时间为30回合。
actors.hero.talent.holy_lance.title=圣枪
actors.hero.talent.impact_wave.desc=+1：战士跳跃落地后，所有相邻敌人会被击退2格，并有25%的概率进入5回合的易伤状态。+2：战士跳跃落地后，所有相邻敌人会被击退3格，并有50%的概率进入5回合的易伤状态。+3：战士跳跃落地后，所有相邻敌人会被击退4格，并有75%的概率进入5回合的易伤状态。+4：战士跳跃落地后，所有相邻敌人会被击退5格，并有100%的概率进入5回合的易伤状态。
actors.hero.talent.impact_wave.title=冲击波
actors.hero.talent.improvised_projectiles.desc=+1：战士可以向敌人投掷任何非投掷武器的物品，使其致盲2回合。此技能冷却时间为50回合。+2：战士可以向敌人投掷任何非投掷武器的物品，使其致盲3回合。此技能冷却时间为50回合。
actors.hero.talent.improvised_projectiles.title=简易投掷物
actors.hero.talent.inscribed_power.desc=+1：当法师阅读卷轴或使用法术物品时，他的_接下来的2次魔杖攻击_获得+2级。+2：当法师阅读卷轴或使用法术物品时，他的_接下来的3次魔杖攻击_获得+2级。当使用升级、转化或炼金卷轴制作的物品时，强化魔杖攻击的次数翻倍。对于产量较高的炼金物品（例如大多数法术），此天赋有一定几率根据该物品的产量触发。
actors.hero.talent.inscribed_power.title=铭刻的力量
actors.hero.talent.inscribed_stealth.desc=+1：盗贼阅读卷轴或使用法术物品后获得 3 回合的隐身效果。+2：盗贼阅读卷轴或使用法术物品后获得 5 回合的隐身效果。使用升级卷轴、转化卷轴或必须使用这些卷轴制作的炼金物品时，隐身持续时间翻倍。对于产量较高的炼金物品（例如大多数法术），此天赋有一定几率根据该物品的产量触发。
actors.hero.talent.inscribed_stealth.title=铭刻的隐秘
actors.hero.talent.invigorating_meal.desc=+1：吃食物会使女猎手获得 1 回合（浆果会立即被吃掉），并赋予她 1 回合的加速效果。+2：吃食物会使女猎手获得 1 回合（浆果会立即被吃掉），并赋予她 2 回合的加速效果。
actors.hero.talent.invigorating_meal.title=令人精神焕发的一餐
actors.hero.talent.invigorating_victory.desc=+1：如果决斗者在决斗结束前击败目标，她将恢复5点生命值，外加决斗期间所受伤害的30%。+2：如果决斗者在决斗结束前击败目标，她将恢复10点生命值，外加决斗期间所受伤害的50%。+3：如果决斗者在决斗结束前击败目标，她将恢复15点生命值，外加决斗期间所受伤害的65%。+4：如果决斗者在决斗结束前击败目标，她将恢复20点生命值，外加决斗期间所受伤害的75%。
actors.hero.talent.invigorating_victory.title=令人振奋的胜利
actors.hero.talent.iron_stomach.desc=+1：战士吃食物会消耗1个回合，并在进食期间获得75%的伤害抗性。+2：战士吃食物会消耗1个回合，并在进食期间获得100%的伤害抗性。
actors.hero.talent.iron_stomach.title=铁胃
actors.hero.talent.iron_will.desc=_+1:_战士印记提供的护盾值_增加1_。\n\n_+2:_战士印记提供的护盾值_增加2_。
actors.hero.talent.iron_will.meta_desc=_如果该天赋由其他英雄获得_，则会被动地赋予战士破除封印效果的1或2点最大护盾值。
actors.hero.talent.iron_will.title=钢铁般的意志
actors.hero.talent.judgement.desc=+1：在升华形态下，牧师可以施放“审判”，对所有可见敌人造成10-20点伤害。+2：在升华形态下，牧师可以施放“审判”，对所有可见敌人造成15-30点伤害。+3：在升华形态下，牧师可以施放“审判”，对所有可见敌人造成20-40点伤害。+4：在升华形态下，牧师可以施放“审判”，对所有可见敌人造成25-50点伤害。“审判”消耗3点法术书充能。审判造成的伤害为牧师自进入升华形态以来或自上次施放审判以来每施放一个法术，伤害就增加 33%。
actors.hero.talent.judgement.title=判断
actors.hero.talent.lay_on_hands.desc=+1：圣骑士可以施放“圣疗术”，该法术可以立即为附近角色恢复15点生命值，或者为圣骑士提供15点护盾值，消耗1点能量。+2：圣骑士可以施放“圣疗术”，该法术可以立即为附近角色恢复20点生命值，或者为圣骑士提供20点护盾值，消耗1点能量。+3：圣骑士可以施放“圣疗术”，该法术可以立即为附近角色恢复25点生命值，或者为圣骑士提供25点护盾值，消耗1点能量。此法术的额外治疗量将转化为护盾值。圣疗术可以重复施放，但一次最多只能施加三次施法的护盾效果。
actors.hero.talent.lay_on_hands.title=为手按
actors.hero.talent.lethal_defense.desc=+1：当角斗士使用连击技能击杀敌人时，其破封护盾的冷却时间减少50回合。+2：当角斗士使用连击技能击杀敌人时，其破封护盾的冷却时间减少100回合。+3：当角斗士使用连击技能击杀敌人时，其破封护盾的冷却时间减少150回合。此天赋可将护盾冷却时间减少至-150回合，这意味着护盾激活后将立即再次可用。
actors.hero.talent.lethal_defense.title=致命防御
actors.hero.talent.lethal_haste.desc=+1：当决斗者使用武器技能击杀敌人时，她获得相当于 3 回合的瞬间移动力。+2：当决斗者使用武器技能击杀敌人时，她获得相当于 5 回合的瞬间移动力。
actors.hero.talent.lethal_haste.meta_desc=_如果该天赋由其他英雄获得_，则会改为通过普通武器攻击触发，冷却时间为100回合。
actors.hero.talent.lethal_haste.title=致命的匆忙
actors.hero.talent.lethal_momentum.desc=+1：当战士使用物理武器对敌人造成致命一击时，有 67% 的概率使敌人失去 0 个回合。+2：当战士使用物理武器对敌人造成致命一击时，有 100% 的概率使敌人失去 0 个回合。
actors.hero.talent.lethal_momentum.title=致命的动量
actors.hero.talent.life_link.desc=牧师可以消耗 2 点能量，在自己和一名强化盟友之间施放 _生命链接_。此法术会使牧师及其盟友分担伤害，并且如果其中一人受到影响，则3级或以下的牧师增益法术也会同时作用于两人。生命链接持续10回合，并将“众生之力”的加成提升至-35%受到的伤害。生命链接持续13回合，并将“众生之力”的加成提升至-40%受到的伤害。生命链接持续17回合，并将“众生之力”的加成提升至-45%受到的伤害。生命链接持续20回合，并将“众生之力”的加成提升至-50%受到的伤害。
actors.hero.talent.life_link.title=生命链接
actors.hero.talent.light_cloak.desc=+1：盗贼在未装备暗影斗篷时可以使用它，但未装备时冷却速度降低至25%。+2：盗贼在未装备暗影斗篷时可以使用它，但未装备时冷却速度降低至50%。+3：盗贼在未装备暗影斗篷时可以使用它，但未装备时冷却速度降低至75%。
actors.hero.talent.light_cloak.meta_desc=_如果该天赋由其他英雄获得_，则在+1/+2/+3时，所有神器的充能速度将提高7/13/20%。
actors.hero.talent.light_cloak.title=轻型斗篷
actors.hero.talent.light_reading.desc=+1：牧师在未装备圣典时可以使用圣典，但圣典冷却速度降低至25%。+2：牧师在未装备圣典时可以使用圣典，但圣典冷却速度降低至50%。+3：牧师在未装备圣典时可以使用圣典，但圣典冷却速度降低至75%。
actors.hero.talent.light_reading.meta_desc=_如果该天赋由其他英雄获得_，则在+1/+2/+3时，所有魔杖的充能速度将提高7/13/20%。
actors.hero.talent.light_reading.title=轻读
actors.hero.talent.lingering_magic.desc=+1：当法师使用魔杖或法杖进行攻击时，他的下一次物理攻击会造成 1-2 点额外伤害。+2：当法师使用魔杖或法杖进行攻击时，他的下一次物理攻击会造成 2 点额外伤害。
actors.hero.talent.lingering_magic.title=挥之不去的魔力
actors.hero.talent.liquid_agility.desc=+1：当决斗者饮用或投掷药水、酿造物或灵药时，其闪避率和命中率在5回合内的下一次近战攻击中提升3倍。+2：当决斗者饮用或投掷药水、酿造物或灵药时，其闪避率和命中率在5回合内的下一次近战攻击中无限提升。使用力量药水、经验药水或必须用这些药水制作的炼金物品时，此加成效果会额外持续一个回合和一次攻击。对于产量较高的炼金物品（例如水之酿造物），此天赋的触发几率取决于该物品的产量。
actors.hero.talent.liquid_agility.title=液态敏捷性
actors.hero.talent.liquid_nature.desc=+1：当女猎手饮用或投掷药水、酿造物或灵药时，周围区域最多会生长出 4 格草地，相邻的敌人会被定身 1 回合。+2：当女猎手饮用或投掷药水、酿造物或灵药时，周围区域最多会生长出 6 格草地，相邻的敌人会被定身 2 回合。使用力量药水、经验药水或必须用这些药水制作的炼金物品时，草地数量和定身持续时间会翻倍。对于产量较高的炼金物品（例如水之酿造物），此天赋的触发几率取决于该物品的产量。
actors.hero.talent.liquid_nature.title=液态
actors.hero.talent.liquid_willpower.desc=+1：战士饮用或投掷药水、酿造药剂或灵药时，获得相当于其最大生命值6.5%的护盾。+2：战士饮用或投掷药水、酿造药剂或灵药时，获得相当于其最大生命值10%的护盾。使用力量药水、经验药水或必须用这些药水制作的炼金物品时，护盾值翻倍。对于产量较高的炼金物品（例如水之酿造药剂），此天赋有一定几率根据该物品的产量触发。
actors.hero.talent.liquid_willpower.title=液体意志力
actors.hero.talent.longrange_warp.desc=+1：法师现在可以在楼层间传送，消耗150%的充能。+2：法师现在可以在楼层间传送，消耗117%的充能。+3：法师现在可以在楼层间传送，消耗83%的充能。+4：法师现在可以在楼层间传送，消耗50%的充能。法师无法使用远程传送离开已锁定的楼层。
actors.hero.talent.longrange_warp.title=远程跃迁
actors.hero.talent.mind_form.desc=牧师可以施放“心灵形态”，消耗3点充能，使三位一体获得牧师本次游戏过程中使用过的魔杖或投掷武器的力量。当使用三位一体时，牧师会使用所选物品的电击或投掷效果，如同使用过该物品一样。当使用三位一体时，牧师会使用所选物品的电击或投掷效果，如同使用过该物品一样。当使用三位一体时，牧师会使用所选物品的电击或投掷效果，如同使用过该物品一样。当使用三位一体时，牧师会使用所选物品的电击或投掷效果，如同使用过该物品一样。当使用三位一体时，牧师会使用所选物品的电击效果，如同使用过该物品一样。或投掷所选物品的效果，如同它是_+6._\n\nTrinity一次只能被赋予一个精神效果。
actors.hero.talent.mind_form.title=心形
actors.hero.talent.mnemonic_prayer.desc=+1：牧师可以施放“记忆祷言”，该法术消耗1点能量，可将友方/敌方身上的增益/减益效果延长3回合。+2：牧师可以施放“记忆祷言”，该法术消耗1点能量，可将友方/敌方身上的增益/减益效果延长4回合。+3：牧师可以施放“记忆祷言”，该法术消耗1点能量，可将友方/敌方身上的增益/减益效果延长5回合。“记忆祷言”施法无需时间。它只能将特定增益/减益效果延长一次，且无法延长护甲技能提供的增益效果。
actors.hero.talent.mnemonic_prayer.title=记忆祈祷
actors.hero.talent.monastic_vigor.desc=+1：如果武僧拥有100%能量，则其技能得到强化。+2：如果武僧拥有80%或以上能量，则其技能得到强化。+3：如果武僧拥有60%或以上能量，则其技能得到强化。强化后：- 乱舞会应用武器的附魔效果；- 专注术瞬发；- 冲刺攻击范围+4；- 龙踢伤害+50%，并对所有相邻敌人施加击退和眩晕效果；- 冥想缓慢恢复20%已损失生命值，并提供80%伤害抗性。
actors.hero.talent.monastic_vigor.title=修道院的活力
actors.hero.talent.mystical_charge.desc=+1：使用法杖攻击可使战斗法师获得相当于0.5回合的神器充能。+2：使用法杖攻击可使战斗法师获得相当于1回合的神器充能。+3：使用法杖攻击可使战斗法师获得相当于1.5回合的神器充能。
actors.hero.talent.mystical_charge.title=神秘能量
actors.hero.talent.mystical_meal.desc=+1：食用食物会使盗贼获得 1 个回合（补给口粮会立即被吃掉），并使其获得 3 回合的神器充能。+2：食用食物会使盗贼获得 1 个回合（补给口粮会立即被吃掉），并使其获得 5 回合的神器充能。此天赋不能用于使丰饶号角自行充能。
actors.hero.talent.mystical_meal.title=神秘的餐点
actors.hero.talent.natures_aid.desc=+1：女猎手获得0-2点树皮护甲，当植物的效果在她视野中激活时，该护甲每3回合消失一次。+2：女猎手获得0-2点树皮护甲，当植物的效果在她视野中激活时，该护甲每5回合消失一次。
actors.hero.talent.natures_aid.title=自然的援助
actors.hero.talent.natures_bounty.desc=+1：女猎手在探索地牢接下来的几层时，可以在高高的草丛中找到 4 颗浆果。+2：女猎手在探索地牢接下来的几层时，可以在高高的草丛中找到 6 颗浆果。浆果可以快速食用，恢复少量饱腹感，并且可能含有可用的种子。
actors.hero.talent.natures_bounty.title=大自然的馈赠
actors.hero.talent.natures_wrath.desc=+1：当自然之力激活时，灵弓的射击有 8% 的几率触发一种随机有害植物效果。+2：当自然之力激活时，灵弓的射击有 17% 的几率触发一种随机有害植物效果。+3：当自然之力激活时，灵弓的射击有 25% 的几率触发一种随机有害植物效果。+4：当自然之力激活时，灵弓的射击有 33% 的几率触发一种随机有害植物效果。可触发的植物包括：盲草、火焰花、冰帽、哀草和风暴藤。
actors.hero.talent.natures_wrath.title=大自然的愤怒
actors.hero.talent.necromancers_minions.desc=+1：当一个被灵魂标记的敌人死亡时，术士有 13% 的几率将其复活为堕落幽灵。+2：当一个被灵魂标记的敌人死亡时，术士有 27% 的几率将其复活为堕落幽灵。+3：当一个被灵魂标记的敌人死亡时，术士有 40% 的几率将其复活为堕落幽灵。
actors.hero.talent.necromancers_minions.title=死灵法师的爪牙
actors.hero.talent.patient_strike.desc=+1：如果决斗者在进行近战攻击前稍等片刻，她将造成 1-2 点额外伤害。+2：如果决斗者在进行近战攻击前稍等片刻，她将造成 2 点额外伤害。
actors.hero.talent.patient_strike.title=病人罢工
actors.hero.talent.perfect_copy.desc=+1：分身获得英雄最大生命值的10%，并可立即与英雄交换最多1格的位置。+2：分身获得英雄最大生命值的20%，并可立即与英雄交换最多2格的位置。+3：分身获得英雄最大生命值的30%，并可立即与英雄交换最多3格的位置。+4：分身获得英雄最大生命值的40%，并可立即与英雄交换最多4格的位置。
actors.hero.talent.perfect_copy.title=完美副本
actors.hero.talent.point_blank.desc=+1：当女猎手在近战范围内使用弓箭或投掷武器时，命中率降低25%，而非降低50%。+2：当女猎手在近战范围内使用弓箭或投掷武器时，命中率正常，而非降低50%。+3：当女猎手在近战范围内使用弓箭或投掷武器时，命中率提高25%，而非降低50%。注意：投掷武器或灵弓在远距离使用时始终具有50%的命中率。
actors.hero.talent.point_blank.title=近距离
actors.hero.talent.precise_assault.desc=+1：决斗者使用武器技能后，5回合内下一次近战攻击的命中率提升2倍。+2：决斗者使用武器技能后，5回合内下一次近战攻击的命中率提升5倍。+3：决斗者使用武器技能后，5回合内下一次近战攻击的命中率无限提升。
actors.hero.talent.precise_assault.meta_desc=_如果该天赋由其他英雄获得_，则会改为近战命中率提高10%（+1）、20%（+2）或30%（+3）。
actors.hero.talent.precise_assault.title=精准打击
actors.hero.talent.projectile_momentum.desc=+1：自由奔跑时，投掷武器的命中率提高 50%，伤害提高 15%。+2：自由奔跑时，投掷武器的命中率提高 100%，伤害提高 30%。+3：自由奔跑时，投掷武器的命中率提高 150%，伤害提高 45%。
actors.hero.talent.projectile_momentum.title=抛射体动量
actors.hero.talent.projecting_blades.desc=+1：光谱之刃的命中率提高 25%，最多可穿透 2 个实体方块。+2：光谱之刃的命中率提高 50%，最多可穿透 4 个实体方块。+3：光谱之刃的命中率提高 75%，最多可穿透 6 个实体方块。+4：光谱之刃的命中率提高 100%，最多可穿透 8 个实体方块。
actors.hero.talent.projecting_blades.title=突出的刀片
actors.hero.talent.protective_shadows.desc=+1：盗贼在隐身状态下每隔一回合获得一个护盾，最多可获得 3 个护盾。+2：盗贼在隐身状态下每回合获得一个护盾，最多可获得 5 个护盾。
actors.hero.talent.protective_shadows.title=保护性的阴影
actors.hero.talent.provoked_anger.desc=+1：当战士身上的任何护盾增益被伤害打破时，他的下一次物理攻击将造成 3 点额外伤害。+2：当战士身上的任何护盾增益被伤害打破时，他的下一次物理攻击将造成 5 点额外伤害。
actors.hero.talent.provoked_anger.title=激怒
actors.hero.talent.ratforcements.desc=对自身使用鼠形幻化后，会在你身边生成 1 只友方袋鼠。对自身使用鼠形幻化后，会在你身边生成 2 只友方袋鼠。对自身使用鼠形幻化后，会在你身边生成 3 只友方袋鼠。对自身使用鼠形幻化后，会在你身边生成 4 只友方袋鼠。
actors.hero.talent.ratforcements.title=鼠兵
actors.hero.talent.ratlomacy.desc=+1：对已幻化的敌人使用“鼠化”技能，使其变为友善状态，并使幻化状态永久生效。+2：对已幻化的敌人使用“鼠化”技能，使其变为友善状态，并使幻化状态永久生效，同时给予其2回合的肾上腺素效果。+3：对已幻化的敌人使用“鼠化”技能，使其变为友善状态，并使幻化状态永久生效，同时给予其4回合的肾上腺素效果。+4：对已幻化的敌人使用“鼠化”技能，使其变为友善状态，并使幻化状态永久生效，同时给予其6回合的肾上腺素效果。
actors.hero.talent.ratlomacy.title=拉特洛米
actors.hero.talent.ratsistance.desc=+1：敌对的鼠形敌人造成-10%伤害。+2：敌对的鼠形敌人造成-19%伤害。+3：敌对的鼠形敌人造成-27%伤害。+4：敌对的鼠形敌人造成-35%伤害。
actors.hero.talent.ratsistance.title=鼠类抵抗
actors.hero.talent.reactive_barrier.desc=+1：法师每受到元素冲击影响一个角色，便获得2.5点护盾值，最多影响5个角色。+2：法师每受到元素冲击影响一个角色，便获得5点护盾值，最多影响6个角色。+3：法师每受到元素冲击影响一个角色，便获得7.5点护盾值，最多影响7个角色。+4：法师每受到元素冲击影响一个角色，便获得10点护盾值，最多影响8个角色。
actors.hero.talent.reactive_barrier.title=反应屏障
actors.hero.talent.recall_inscription.desc=+1：牧师可以施放“召回铭文”法术，使其在10回合内重复使用上次使用的符文石或卷轴的效果。+2：牧师可以施放“召回铭文”法术，使其在300回合内重复使用上次使用的符文石或卷轴的效果。“召回铭文”不能与升级卷轴一起使用。该法术的充能消耗取决于最近使用的物品：符文石消耗2点，卷轴消耗3点，异域卷轴消耗4点。如果与转化卷轴或必须使用转化或升级合成的炼金物品一起使用，则充能消耗翻倍。
actors.hero.talent.recall_inscription.meta_desc=_如果该天赋由其他英雄获得_，则在+1时有10%的几率返还任何卷轴或符文石，在+2时有15%的几率返还任何卷轴或符文石。升级卷轴不受此效果影响。
actors.hero.talent.recall_inscription.refunded=您的商品已退款！
actors.hero.talent.recall_inscription.title=回忆铭文
actors.hero.talent.rejuvenating_steps.desc=+1：当女猎手踩到矮草或余烬时，它们会变成高草，女猎手会立即犁出一道沟壑。此技能冷却时间为10回合。+2：当女猎手踩到矮草或余烬时，它们会变成高草，女猎手会立即犁出一道沟壑。此技能冷却时间为5回合。如果被动回复效果被禁用或英雄长时间未获得经验值，此天赋将产生犁出的沟壑。
actors.hero.talent.rejuvenating_steps.title=恢复活力的步骤
actors.hero.talent.remote_beacon.desc=+1：法师可以在距离目标 4 格范围内的任意位置放置信标。+2：法师可以在距离目标 8 格范围内的任意位置放置信标。+3：法师可以在距离目标 12 格范围内的任意位置放置信标。+4：法师可以在距离目标 16 格范围内的任意位置放置信标。法师无法在无法到达的位置放置信标。
actors.hero.talent.remote_beacon.title=远程信标
actors.hero.talent.rogues_foresight.desc=+1：当盗贼处于有密室的关卡时，他有 75% 的几率注意到该关卡包含秘密。+2：当盗贼处于有密室的关卡时，他有 100% 的几率注意到该关卡包含秘密。
actors.hero.talent.rogues_foresight.title=盗贼的预见
actors.hero.talent.runic_transference.desc=+1：战士的破损封印可以像转移升级符文一样转移普通符文。+2：战士的破损封印可以像转移升级符文一样转移普通符文、强力符文和诅咒符文。封印只能转移在封印附加时已附加到盔甲上的符文。
actors.hero.talent.runic_transference.meta_desc=如果此天赋由其他英雄获得，则改为增强护甲上的符文抵抗升级卷轴移除的能力。符文会在护甲等级从4级升至6级（+1）或从4级升至7级（+2）时开始丢失。符文必定丢失的等级为+8，不变。
actors.hero.talent.runic_transference.title=符文转移
actors.hero.talent.satiated_spells.desc=+1：食用食物后，牧师下次施法时获得 3 点护盾值。+2：食用食物后，牧师下次施法时获得 5 点护盾值。
actors.hero.talent.satiated_spells.meta_desc=_如果该天赋由其他英雄获得_，则会立即给予护盾，护盾会在 10 回合后正常衰减。
actors.hero.talent.satiated_spells.title=满足咒语
actors.hero.talent.scholars_intuition.desc=+1：法师鉴定魔杖的速度提高 3 倍。+2：法师在使用魔杖时即可鉴定魔杖。
actors.hero.talent.scholars_intuition.title=学者的直觉
actors.hero.talent.searing_light.desc=+1：牧师对被“指引之光”照亮的敌人造成的物理攻击额外造成3点伤害。+2：牧师对被“指引之光”照亮的敌人造成的物理攻击额外造成5点伤害。
actors.hero.talent.searing_light.meta_desc=_如果该天赋由其他英雄获得_，则会在对敌人使用魔杖或神器后提供额外伤害，冷却时间为 20 回合。
actors.hero.talent.searing_light.title=灼热之光
actors.hero.talent.seer_shot.desc=+1：当女猎手向地面射箭时，会为其周围3x3范围内的区域提供视野，持续5回合。此技能冷却时间为20回合。+2：当女猎手向地面射箭时，会为其周围3x3范围内的区域提供视野，持续10回合。此技能冷却时间为20回合。+3：当女猎手向地面射箭时，会为其周围3x3范围内的区域提供视野，持续15回合。此技能冷却时间为20回合。
actors.hero.talent.seer_shot.meta_desc=如果该天赋由其他英雄获得，则可通过任何投掷武器触发。
actors.hero.talent.seer_shot.title=先知之枪
actors.hero.talent.shadow_blade.desc=+1：暗影分身每回合获得英雄8%的伤害加成，并有25%的几率使用英雄武器上的附魔。+2：暗影分身每回合获得英雄16%的伤害加成，并有50%的几率使用英雄武器上的附魔。+3：暗影分身每回合获得英雄24%的伤害加成，并有75%的几率使用英雄武器上的附魔。+4：暗影分身每回合获得英雄32%的伤害加成，并有100%的几率使用英雄武器上的附魔。
actors.hero.talent.shadow_blade.title=暗影之刃
actors.hero.talent.shadow_step.desc=+1：如果盗贼在隐身状态下使用烟雾弹，烟雾弹会立即生效，充能消耗降低16%，但不会致盲敌人或触发其他天赋。+2：如果盗贼在隐身状态下使用烟雾弹，烟雾弹会立即生效，充能消耗降低30%，但不会致盲敌人或触发其他天赋。+3：如果盗贼在隐身状态下使用烟雾弹，烟雾弹会立即生效，充能消耗降低41%，但不会致盲敌人或触发其他天赋。+4：如果盗贼在隐身状态下使用烟雾弹，烟雾弹会立即生效，充能消耗降低50%，但不会致盲敌人或触发其他天赋。
actors.hero.talent.shadow_step.title=影子步
actors.hero.talent.shared_enchantment.desc=+1：投掷武器有 33% 的几率使用狙击弓上的附魔。+2：投掷武器有 67% 的几率使用狙击弓上的附魔。+3：投掷武器有 100% 的几率使用狙击弓上的附魔。弓上的附魔可以叠加在投掷武器已有的附魔之上。
actors.hero.talent.shared_enchantment.title=共同的魅力
actors.hero.talent.shared_upgrades.desc=+1：狙击手使用升级后的投掷武器攻击时，每升一级，狙击标记的持续时间增加1回合，特殊攻击的伤害增加16%，最高可达+2级时增加2回合和33%的伤害。+2：狙击手使用升级后的投掷武器攻击时，每升一级，狙击标记的持续时间增加1回合，特殊攻击的伤害增加16%，最高可达+4级时增加4回合和67%的伤害。+3：狙击手使用升级后的投掷武器攻击时，每升一级，狙击标记的持续时间增加1回合，特殊攻击的伤害增加16%，最高可达+6级时增加6回合和100%的伤害。
actors.hero.talent.shared_upgrades.title=共享升级
actors.hero.talent.shield_battery.desc=+1：法师可以使用魔杖以自身为目标，将所有充能转化为护盾，每充能可恢复 4% 的最大生命值。+2：法师可以使用魔杖以自身为目标，将所有充能转化为护盾，每充能可恢复 6% 的最大生命值。
actors.hero.talent.shield_battery.title=护盾电池
actors.hero.talent.shield_of_light.desc=+1：牧师可以施放“光之盾”，这是一个立即施放的法术，消耗1点能量，使自身获得2-4点护甲，持续5回合，对抗目标。+2：牧师可以施放“光之盾”，这是一个立即施放的法术，消耗1点能量，使自身获得3-6点护甲，持续5回合，对抗目标。
actors.hero.talent.shield_of_light.meta_desc=_如果该天赋由其他英雄获得，则改为使目标敌人受到的物理伤害减少 1 点，+1 时有 33% 的几率减少 1 点，+2 时有 50% 的几率减少 1 点。
actors.hero.talent.shield_of_light.title=光之盾
actors.hero.talent.shielding_dew.desc=+1：露珠可以在守卫者生命值全满时为其提供护盾，最高可达其最大生命值的 20%。+2：露珠可以在守卫者生命值全满时为其提供护盾，最高可达其最大生命值的 40%。+3：露珠可以在守卫者生命值全满时为其提供护盾，最高可达其最大生命值的 60%。
actors.hero.talent.shielding_dew.title=遮蔽露水
actors.hero.talent.shock_force.desc=+1：冲击波造成的伤害提高20%，并且有25%的几率使目标昏迷而不是致残。+2：冲击波造成的伤害提高40%，并且有50%的几率使目标昏迷而不是致残。+3：冲击波造成的伤害提高60%，并且有75%的几率使目标昏迷而不是致残。+4：冲击波造成的伤害提高80%，并且有100%的几率使目标昏迷而不是致残。
actors.hero.talent.shock_force.title=冲击力
actors.hero.talent.shrug_it_off.desc=+1：战士在忍耐状态下的伤害减免从 50% 提升至 60%。+2：战士在忍耐状态下的伤害减免从 50% 提升至 68%。+3：战士在忍耐状态下的伤害减免从 50% 提升至 74%。+4：战士在忍耐状态下的伤害减免从 50% 提升至 80%。
actors.hero.talent.shrug_it_off.title=耸耸肩
actors.hero.talent.silent_steps.desc=+1：盗贼与熟睡的敌人之间相距 3 格或以上时，不会吵醒他们。+2：盗贼与熟睡的敌人之间不相邻时，不会吵醒他们。
actors.hero.talent.silent_steps.title=无声的脚步
actors.hero.talent.soul_eater.desc=+1：灵魂印记每造成一次物理伤害，即可获得0.33回合的饱食度。被灵魂印记的敌人死亡时有10%的几率触发进食效果。+2：灵魂印记每造成一次物理伤害，即可获得0.67回合的饱食度。被灵魂印记的敌人死亡时有20%的几率触发进食效果。+3：灵魂印记每造成一次物理伤害，即可获得1回合的饱食度。被灵魂印记的敌人死亡时有30%的几率触发进食效果。
actors.hero.talent.soul_eater.title=噬魂师
actors.hero.talent.soul_siphon.desc=+1：其他角色造成的物理伤害会以 13% 的效果触发术士的灵魂印记。+2：其他角色造成的物理伤害会以 27% 的效果触发术士的灵魂印记。+3：其他角色造成的物理伤害会以 40% 的效果触发术士的灵魂印记。
actors.hero.talent.soul_siphon.title=灵魂虹吸
actors.hero.talent.speedy_stealth.desc=+1：自由奔跑者在隐身状态下每回合获得2层动量。+2：除了+1的效果外，自由奔跑在隐身状态下不再进行倒计时。+3：除了+1和+2的效果外，自由奔跑者在隐身状态下移动速度翻倍，无论是否处于自由奔跑状态。
actors.hero.talent.speedy_stealth.title=快速隐身
actors.hero.talent.spirit_blades.desc=+1：幽灵之刃有 30% 的几率同时为灵弓附魔。+2：幽灵之刃有 60% 的几率同时为灵弓附魔。+3：幽灵之刃有 90% 的几率同时为灵弓附魔。+4：幽灵之刃有 100% 的几率同时为灵弓附魔，并且每个附魔的效果提升 10%。
actors.hero.talent.spirit_blades.title=灵刃
actors.hero.talent.spirit_form.desc=牧师可以施放“灵体形态”，消耗4点充能，将牧师在本轮游戏中鉴定出的戒指或神器（圣典除外）的力量赋予三位一体。+1：使用三位一体时，牧师将获得一枚戒指+1的效果，持续20回合；或者触发一件神器+4的效果。+2：使用三位一体时，牧师将获得一枚戒指+2的效果，持续20回合；或者触发一件神器+6的效果。+3：使用三位一体时，牧师将获得一枚戒指+3的效果，持续20回合；或者触发一件神器+3的效果。 _+8._\n\n_+4:_ 使用三位一体时，牧师将获得一枚戒指的效果，持续 20 回合，等级为 _+4_；或者触发一件神器的效果，等级为 _+10._\n\n。三位一体一次只能附魔一种灵体效果。神器在被三位一体触发时，其效果和护甲充能消耗各不相同。
actors.hero.talent.spirit_form.title=灵体
actors.hero.talent.stasis.desc=牧师可以消耗2点充能对一名已强化的盟友施放“静滞术”。静滞术会暂时将该盟友移出地牢，并保留所有增益效果的剩余时间，包括“群聚之力”。效果结束后，该盟友会重新出现在你身边。“静滞术”可以立即再次施放，且无需消耗充能，从而提前结束效果。静止状态对无法移动的盟友有效，但无法在地下城楼层之间移动他们。静止状态最多持续 60 回合。静止状态最多持续 90 回合。静止状态最多持续 120 回合。静止状态最多持续 150 回合。牧师还可以在盟友处于静止状态时施放光束射线来重新召唤他们，或者施放生命链接来预先施加其效果。但是，盟友在静止状态下无法从生命链接中受益。
actors.hero.talent.stasis.title=停滞
actors.hero.talent.strengthening_meal.desc=+1：吃食物后，决斗者在接下来的两次物理攻击中，每次攻击造成3点额外伤害。+2：吃食物后，决斗者在接下来的三次物理攻击中，每次攻击造成3点额外伤害。
actors.hero.talent.strengthening_meal.title=强化餐
actors.hero.talent.striking_force.desc=+1：元素打击的效果威力提升30%。+2：元素打击的效果威力提升60%。+3：元素打击的效果威力提升90%。+4：元素打击的效果威力提升120%。
actors.hero.talent.striking_force.title=打击力量
actors.hero.talent.striking_wave.desc=+1：冲击波有 30% 的几率触发命中效果，例如附魔和连击。+2：冲击波有 60% 的几率触发命中效果，例如附魔和连击。+3：冲击波有 90% 的几率触发命中效果，例如附魔和连击。+4：冲击波有 100% 的几率触发命中效果，例如附魔和连击，并且使附魔威力提升 20%。
actors.hero.talent.striking_wave.title=冲击波
actors.hero.talent.strongman.desc=+1：战士的力量提升 8%，向下取整。+2：战士的力量提升 13%，向下取整。+3：战士的力量提升 18%，向下取整。
actors.hero.talent.strongman.title=大力士
actors.hero.talent.sucker_punch.desc=+1：盗贼第一次突袭敌人时造成 1-2 点额外伤害。+2：盗贼第一次突袭敌人时造成 2 点额外伤害。
actors.hero.talent.sucker_punch.title=垂死挣扎
actors.hero.talent.sunray.desc=+1：牧师可以施放“日光术”，该法术造成4-8点伤害，并使目标失明4回合，消耗1点能量。+2：牧师可以施放“日光术”，该法术造成6-12点伤害，并使目标失明6回合，消耗1点能量。“日光术”只能使每个目标失明一次，但如果目标已被“日光术”致盲，则改为麻痹。对恶魔和亡灵敌人，“日光术”总是造成最大伤害。
actors.hero.talent.sunray.meta_desc=_如果该天赋由其他英雄获得_，则会使魔杖和神器使敌人失明 4 回合，+1 时有 15% 的几率，+2 时有 25% 的几率。
actors.hero.talent.sunray.title=阳光
actors.hero.talent.survivalists_intuition.desc=+1：女猎手识别投掷武器的速度提高 3 倍。+2：女猎手在投掷武器击中目标时即可识别它们。
actors.hero.talent.survivalists_intuition.title=生存者的直觉
actors.hero.talent.sustained_retribution.desc=+1：战士造成115%额外伤害，分2次攻击造成，而非1次攻击造成100%额外伤害。+2：战士造成130%额外伤害，分3次攻击造成，而非1次攻击造成100%额外伤害。+3：战士造成145%额外伤害，分4次攻击造成，而非1次攻击造成100%额外伤害。+4：战士造成160%额外伤害，分5次攻击造成，而非1次攻击造成100%额外伤害。
actors.hero.talent.sustained_retribution.title=持续报复
actors.hero.talent.swift_equip.desc=+1：决斗者每20回合可以瞬间切换一次已装备的武器。+2：决斗者每20回合可以瞬间切换两次已装备的武器。如果决斗者拥有此天赋且该天赋未处于冷却状态，则快速使用未装备的武器即可装备该武器。
actors.hero.talent.swift_equip.title=迅速装备
actors.hero.talent.swift_spirit.desc=+1：灵鹰的移动速度从 2 格提升至 2.5 格，并且必定闪避前 2 次攻击。+2：灵鹰的移动速度从 2 格提升至 3 格，并且必定闪避前 4 次攻击。+3：灵鹰的移动速度从 2 格提升至 3.5 格，并且必定闪避前 6 次攻击。+4：灵鹰的移动速度从 2 格提升至 4 格，并且必定闪避前 8 次攻击。
actors.hero.talent.swift_spirit.title=迅捷的灵魂
actors.hero.talent.telefrag.desc=+1：如果法师传送到另一个角色身上，他会对其造成10-15点伤害，但自身也会受到5点伤害。+2：如果法师传送到另一个角色身上，他会对其造成20-30点伤害，但自身也会受到10点伤害。+3：如果法师传送到另一个角色身上，他会对其造成30-45点伤害，但自身也会受到15点伤害。+4：如果法师传送到另一个角色身上，他会对其造成40-60点伤害，但自身也会受到20点伤害。该天赋不会杀死英雄，自身受到的伤害可以通过魔法抗性效果来降低。
actors.hero.talent.telefrag.title=远程击杀
actors.hero.talent.thiefs_intuition.desc=+1：盗贼鉴定戒指的速度提高 2 倍，并且在装备戒指时即可鉴定戒指的类型。+2：盗贼在装备戒指时即可鉴定戒指，并且在拾取戒指时即可鉴定戒指的类型。
actors.hero.talent.thiefs_intuition.title=盗贼的直觉
actors.hero.talent.twin_upgrades.desc=+1：如果冠军装备的两件武器中，有一件等级较低，且比另一件武器低2个或以上等级，则该武器的等级将被提升至与另一件武器相同的等级。+2：如果冠军装备的两件武器中，有一件等级较低，且比另一件武器低1个或以上等级，则该武器的等级将被提升至与另一件武器相同的等级。+3：如果冠军装备的两件武器中，有一件等级较低，且与另一件武器等级相同或更低，则该武器的等级将被提升至与另一件武器相同的等级。
actors.hero.talent.twin_upgrades.title=双升级
actors.hero.talent.unencumbered_spirit.desc=+1：武僧每使用一件3级或更低级别的装备，即可获得额外50%的能量。+2：武僧每使用一件2级或更低级别的装备，即可获得额外75%的能量。3级装备的效果不变。+3：武僧每使用一件1级或更低级别的装备，即可获得额外100%的能量。2级和3级装备的效果不变。此外，她还会获得一件免费的布甲和一副镶钉手套。注意：此天赋在徒手或使用力量之戒攻击时无效。
actors.hero.talent.unencumbered_spirit.title=不受束缚的精神
actors.hero.talent.varied_charge.desc=+1：冠军使用两种不同的武器技能后，立即恢复0.17点武器充能，无时间限制。+2：冠军使用两种不同的武器技能后，立即恢复0.33点武器充能，无时间限制。+3：冠军使用两种不同的武器技能后，立即恢复0.5点武器充能，无时间限制。
actors.hero.talent.varied_charge.title=不同收费
actors.hero.talent.veterans_intuition.desc=+1：战士识别武器的速度提高 1.75 倍，识别盔甲的速度提高 2.5 倍。+2：战士装备武器和盔甲时，识别速度提高 2.5 倍。
actors.hero.talent.veterans_intuition.title=老兵的直觉
actors.hero.talent.wall_of_light.desc=+1：圣骑士可以施放“光之墙”，该法术会在圣骑士前方生成一道3格宽的实体墙，击退敌人，持续20回合，消耗3点法力值。+2：圣骑士可以施放“光之墙”，该法术会在圣骑士前方生成一道5格宽的实体墙，击退敌人，持续20回合，消耗3点法力值。+3：圣骑士可以施放“光之墙”，该法术会在圣骑士前方生成一道7格宽的实体墙，击退敌人，持续20回合，消耗3点法力值。该墙可以沿直线或斜线放置。一次只能存在一堵墙。
actors.hero.talent.wall_of_light.title=光之墙
actors.hero.talent.wand_preservation.desc=+1：当法师将新魔杖注入法杖时，旧魔杖的等级变为+0，但此效果只能使用一次。+2：当法师将新魔杖注入法杖时，旧魔杖的等级变为+0，此效果可以重复使用，冷却时间为1个英雄等级。
actors.hero.talent.wand_preservation.meta_desc=_如果该天赋由其他英雄获得_，则将魔杖放入炼金罐时获得的奥术树脂数量将增加 1（+1 时）或 2（+2 时）。
actors.hero.talent.wand_preservation.title=魔杖保存
actors.hero.talent.weapon_recharging.desc=+1：决斗者在魔杖或神器充能增益效果下，每 15 回合获得 1 点武器充能。+2：决斗者在魔杖或神器充能增益效果下，每 10 回合获得 1 点武器充能。
actors.hero.talent.weapon_recharging.meta_desc=_如果该天赋由其他英雄获得_，则会使其在充能+1时造成+5%的近战伤害，或在充能+2时造成+7.5%的近战伤害。
actors.hero.talent.weapon_recharging.title=武器充能
actors.hero.talent.wide_search.desc=_+1:_ 盗贼的搜索半径从 5x5 正方形增加到 _7x7 圆_。\n\n_+2:_ 盗贼的搜索半径从 5x5 正方形增加到 _7x7 正方形_。
actors.hero.talent.wide_search.meta_desc=_如果该天赋由其他英雄获得_，则会将其搜索半径从 3x3 的正方形增加到 5x5 的圆形（+1），或从 5x5 的正方形增加到 2。
actors.hero.talent.wide_search.title=广泛搜索
actors.hero.talent.wild_momentum.desc=+1：使用灵弓击杀敌人可使自然之力持续时间延长1回合，最多可延长2回合。+2：使用灵弓击杀敌人可使自然之力持续时间延长2回合，最多可延长4回合。+3：使用灵弓击杀敌人可使自然之力持续时间延长3回合，最多可延长6回合。+4：使用灵弓击杀敌人可使自然之力持续时间延长4回合，最多可延长8回合。
actors.hero.talent.wild_momentum.title=狂野的势头
actors.hero.talent.wild_power.desc=_+1:_ 使用狂野魔法时，魔杖的威力将提升 _2 或 3，最高可达 +4_。\n\n_+2:_ 使用狂野魔法时，魔杖的威力将提升 _3，最高可达 +5_。\n\n_+3:_ 使用狂野魔法时，魔杖的威力将提升 _3 或 _4，最高可达 +6_。\n\n_+4:_ 使用狂野魔法时，魔杖的威力将提升 _4，最高可达 +7_。
actors.hero.talent.wild_power.title=野性力量
actors.mobs.acidic.desc=这些体型巨大的蛛形恶魔生物避免近身搏斗，更喜欢从远处发射威力强大的锯齿状尖刺。这只似乎浑身滴着腐蚀性黏液。
actors.mobs.acidic.name=酸性天蝎座
actors.mobs.albino.desc=这是一种罕见的袋鼠品种，拥有纯白色的皮毛和锯齿状的牙齿。
actors.mobs.albino.discover_hint=这种敌人很少会在地牢的特定区域出现。
actors.mobs.albino.name=白化大鼠
actors.mobs.armoredbrute.desc=地位最高的豺狼人蛮兽通常身着坚固的盔甲以彰显其身份。这身盔甲使它们对物理伤害的抵抗力大大增强，而它们自身更强的自律性也意味着它们能在伤重不治前持续狂暴更长时间。
actors.mobs.armoredbrute.name=装甲蛮兽
actors.mobs.armoredstatue.desc=你可能会认为它只是地牢里众多无生命的雕像之一，但它那双闪着红光的眼睛却暴露了它的身份。它看起来状态极佳，因为它穿着盔甲，可能很难被杀死。
actors.mobs.armoredstatue.desc_arm_wep=虽然雕像本身是用石头做的，但它所挥舞的_%1$s_和_%2$s_看起来很逼真。
actors.mobs.armoredstatue.name=盔甲雕像
actors.mobs.bandit.desc=地牢深处一直是各种罪犯的藏身之处。长时间远离阳光，并非所有人都能够保持清醒的头脑。很久以前，这些疯狂的盗贼和强盗早已忘记了自己是谁，也忘记了自己为何而偷窃。
actors.mobs.bandit.name=疯狂强盗
actors.mobs.bat.desc=这些生活在洞穴中的敏捷而顽强的生物远比看起来危险得多。它们每次成功攻击都能恢复生命值，这使它们能够击败体型远大于自己的对手。
actors.mobs.bat.name=吸血蝙蝠
actors.mobs.bee.desc=尽管体型很小，金蜜蜂却会拼命保护自己的巢穴。这只金蜜蜂非常生气，最好离它远点。
actors.mobs.bee.desc_honey=尽管体型很小，金蜂却会拼命保护自己的巢穴。这只金蜂已经被安抚了，似乎想跟着你走。
actors.mobs.bee.discover_hint=你可以通过特定物品找到这个角色。
actors.mobs.bee.name=金蜂
actors.mobs.brute$bruterage.desc=这只豺狼蛮兽快要死了，但它想拉你一起陪葬！当它的护盾消失时，它就会死亡，护盾消失的原因可能是时间到了，也可能是受到了伤害。在此期间，它的攻击力会大幅提升，所以要小心！剩余护盾值：
actors.mobs.brute$bruterage.name=蛮横的愤怒
actors.mobs.brute.def_verb=已屏蔽
actors.mobs.brute.desc=豺狼暴徒是豺狼人中体形最大、力气最强、最耐打的。受了重伤后，它们会陷入狂怒，对敌人造成更大的伤害。
actors.mobs.brute.enraged=愤怒
actors.mobs.brute.name=豺狼暴徒
actors.mobs.causticslime.desc=这团黏液似乎受到了下方散发出的黑暗魔法的污染。它失去了原本的绿色，并且滴落着腐蚀性的黏液。
actors.mobs.causticslime.discover_hint=这种敌人很少会在地牢的特定区域出现。
actors.mobs.causticslime.name=腐蚀性粘液
actors.mobs.crab.desc=这些巨型螃蟹位于下水道食物链的顶端。它们速度极快，厚实的甲壳能够承受重击。
actors.mobs.crab.name=下水道螃蟹
actors.mobs.crystalguardian.def_verb=已屏蔽
actors.mobs.crystalguardian.desc=这些巨大的水晶守卫者看起来几乎像雕像，除非它们那双闪着光芒的眼睛。它们由坚硬的水晶构成，这使得它们行动迟缓但极其坚韧，因此最好让它们尽可能长时间地待在水晶巢穴中休息。由于体型庞大，水晶守卫者在封闭空间内的移动速度会慢得多。它们也极其耐打，几乎不可能被彻底杀死。虽然它们可以被击倒并暂时失去行动能力，但过一会儿就会重新站起来。
actors.mobs.crystalguardian.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.crystalguardian.name=水晶守护者
actors.mobs.crystalmimic.ate=模仿者吃了你的 %s！
actors.mobs.crystalmimic.desc=拟态怪是一种魔法生物，可以随意变换形态。在地下城中，它们几乎总是选择宝箱的形状来引诱毫无戒心的冒险者。水晶拟态怪比普通的拟态怪更加狡猾，它们更喜欢在窃取战利品时避免冲突。一旦被发现，它们会试图快速逃跑，并且拥有在攻击时改变敌人位置的能力。
actors.mobs.crystalmimic.escaped=水晶仿生体逃脱了！
actors.mobs.crystalmimic.name=晶体模拟物
actors.mobs.crystalspire.alert=震动越来越强，隆隆声响彻整个洞穴！
actors.mobs.crystalspire.desc=这根巨大的超硬水晶尖塔很可能是洞穴里所有奇异水晶生物的源头。你的普通武器对它无效，所以如果你想摧毁它，就必须使用镐。_在开始破坏它之前，务必做好充分准备。_如此巨大的水晶可能需要很长时间才能挖掘完毕，而且你很可能无法在不受干扰的情况下完成。尖塔本身可能也拥有某种防御机制。_或许可以利用尖塔自身的攻击来对付它的爪牙。_
actors.mobs.crystalspire.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.crystalspire.name=水晶尖塔
actors.mobs.crystalspire.warning=敲击水晶时，它会震动。一直这样做肯定会引起别人的注意……
actors.mobs.crystalwisp.beam_kill=那道光束杀死了你……
actors.mobs.crystalwisp.desc=一小块愤怒的、漂浮的硬化水晶碎片，发出耀眼的光芒。虽然威力不大，但如果它们有机会，就会向你发射一道具有破坏性的光束。这些水晶碎片体积很小，可以轻松穿过各种水晶凸起，但它们无法穿透水晶发射光束。
actors.mobs.crystalwisp.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.crystalwisp.name=水晶薄雾
actors.mobs.demonspawner.desc=这种由矮人血肉扭曲而成的混合体，负责将这片区域内死去的矮人转化为撕裂恶魔。显然，这些恶魔毫不犹豫地利用一切资源来对付敌人。虽然恶魔生成器看起来十分恐怖，但它们既无法移动，也无法直接防御。不过，它们庞大的体型使得它们难以被迅速杀死，而且当受到威胁时，它们会更快地生成撕裂恶魔。恶魔生成器似乎与某种中央恶魔力量源泉相连。杀死它们或许能够削弱这种力量。
actors.mobs.demonspawner.name=恶魔生成器
actors.mobs.demonspawner.on_death=这里的恶魔能量似乎随着生成器的死亡而减弱。
actors.mobs.dm100.desc=DM-100是矮人早期研制的一种“防御机器”，原本是为了保护监狱下方洞穴中的矮人矿工而设计的。然而，它的电击威力太弱，于是被赠予了地上的人类城市。这些机器闲置多年，最终辗转到了监狱。典狱长最初认为它们过于残酷，不宜使用。但随着囚犯们越来越桀骜不驯，这些机器最终还是成了必需品。
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=闪电击中了你……
actors.mobs.dm200.desc=DM-200是矮人第二代“防御机器”，其设计目的是为了保护洞穴和地下城市的矮人矿工。它们比前代产品体型更大、更笨重，并使用威力巨大的液压拳套进行攻击。然而，体积的增大也是它们的主要弱点，因为它们无法进入地牢狭窄的隧道和门道。矮人们通过让DM-200向远处的敌人或它们无法攻击到的敌人排放有毒废气来弥补其机动性的不足。
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 喷射出一股有毒的废气！
actors.mobs.dm201.desc=矮人们曾短暂地尝试着进一步强化DM-200机动性不足的特性，并制造了一些完全固定不动的DM型号。DM-201是在DM-200的基础上进行改装而成的，它作为哨兵炮塔，完全丧失了移动能力。作为机动性不足的补偿，DM-201拥有显著提升的耐久性和攻击力。由于DM-201没有引擎来排放废气，矮人们便为其配备了腐蚀性毒气手雷！不过，DM-201使用这些手雷时非常谨慎，只有在受到远距离攻击时才会投掷。
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 投掷了一枚腐蚀性手榴弹！
actors.mobs.dm300.charge_lost=输电塔被毁！恢复本地供电！
actors.mobs.dm300.charging=持续受损！启动动力塔！
actors.mobs.dm300.charging_hint=DM-300 在被电塔供电时是刀枪不入的！
actors.mobs.dm300.def_verb=已屏蔽
actors.mobs.dm300.defeated=严重伤害！尝试关闭
actors.mobs.dm300.desc=这台机器是矮人在几个世纪前制造的。后来，矮人开始用魔像、元素生物，甚至恶魔取代机器，最终导致了文明的衰落。DM-300及同类机器通常用于建筑和采矿，有时也用于保卫城市。
actors.mobs.dm300.desc_supercharged=DM-300 目前充满电能。在这种状态下，DM-300 刀枪不入，移动速度翻倍！此外，它的钻头旋转速度也足以穿透坚硬的岩石，尽管此时它的移动速度会大幅降低。直接攻击处于超强充能状态的 DM-300 毫无意义，但周围一定有某种东西在为其提供能量，摧毁该能量源或许能削弱它。
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=发现未经授权人员！
actors.mobs.dm300.pylons_destroyed=警报！电网检测到不稳定！
actors.mobs.dm300.rankings_desc=被DM-300碾压
actors.mobs.dm300.shield=DM-300 从裸露的电线中汲取电力并屏蔽自身！
actors.mobs.dm300.supercharged=摧毁！摧毁！摧毁！
actors.mobs.dwarfking$dkghoul.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking$dkgolem.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking$dkmonk.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking$dkwarlock.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking.defeated=你……把我们都害惨了……
actors.mobs.dwarfking.desc=多年前，矮人宫廷中一位地位显赫的巫师发现了赋予他掌控生死的强大力量的秘密。他很快便滥用这种力量，征服并腐化了他的同僚、国王，最终控制了所有矮人子民。如今，他已成为国王，统治着一支亡灵大军。矮人王是一位极具侵略性的敌人，他会试图用他的亡灵大军包围并压制敌人。
actors.mobs.dwarfking.enraged=你杀不死我，%s。我是不死的！
actors.mobs.dwarfking.lifelink_1=我需要你的精华，奴隶！
actors.mobs.dwarfking.lifelink_2=奴隶，为我流血吧！
actors.mobs.dwarfking.losing=不！你不能这样做……你根本不知道下面是什么……
actors.mobs.dwarfking.name=矮人王
actors.mobs.dwarfking.notice=你竟敢这样！你根本不知道自己在干涉什么！
actors.mobs.dwarfking.rankings_desc=倒在了矮人王面前
actors.mobs.dwarfking.teleport_1=去对付他们，奴隶！
actors.mobs.dwarfking.teleport_2=让他们忙起来，奴隶！
actors.mobs.dwarfking.wave_1=够了！我的奴隶们，起来！
actors.mobs.dwarfking.wave_2=更多！为你的国王流血！
actors.mobs.dwarfking.wave_3=没用！立刻杀了他们！
actors.mobs.ebonymimic.desc=拟态怪是一种魔法生物，可以随意变换形状。在地下城中，它们几乎总是伪装成宝箱，引诱毫无防备的冒险者。黑檀拟态怪是一种隐秘的拟态怪，拥有近乎隐形的能力。它们潜伏在冒险者可能接触的物体上，但自身也藏有宝藏。一旦被发现，它们并不比普通的拟态怪更难对付，但它们的突袭却威力巨大。
actors.mobs.ebonymimic.discover_hint=你可以使用特定的饰品找到这个敌人。
actors.mobs.ebonymimic.hidden_desc=这里面似乎有些东西，但几乎完全透明。
actors.mobs.ebonymimic.hidden_name=可疑轮廓
actors.mobs.ebonymimic.name=乌木拟态
actors.mobs.ebonymimic.reveal=那里有个模仿者！
actors.mobs.elemental$chaoselemental.desc=元素生物是混乱的生物，通常在强大的神秘魔法失控时产生。元素生物智力低下，通常与某种特定类型的魔法相关联。混沌元素生物是罕见且危险的元素生物，它们尚未稳定地归属于任何特定元素。它们攻击时会释放狂野而不可预测的魔法。
actors.mobs.elemental$chaoselemental.name=混沌元素
actors.mobs.elemental$fireelemental.desc=元素生物是混乱的生物，通常在强大的神秘魔法失控时产生。元素生物智力低下，通常与某种特定类型的魔法相关联。火元素是一种常见的元素生物，它们使用火焰魔法造成伤害。它们会用近战攻击点燃目标，偶尔也会发射火球。
actors.mobs.elemental$fireelemental.name=火元素
actors.mobs.elemental$frostelemental.desc=元素生物是混乱的生物，通常在强大的神秘魔法失控时诞生。元素生物智力低下，通常与某种特定类型的魔法相关联。冰霜元素生物是一种常见的元素生物，它们会用冰冻魔法削弱敌人。它们会用近战攻击和偶尔的远程攻击来冰冻目标。它们的魔法在水中效果更佳。
actors.mobs.elemental$frostelemental.name=冰霜元素
actors.mobs.elemental$newbornfireelemental.charging=元素正在充能！
actors.mobs.elemental$newbornfireelemental.desc=元素生物是混乱的生物，通常在强大的神秘魔法失控时产生。元素生物智力低下，通常与某种特定类型的魔法相关联。这只火元素是刚刚召唤出来的，但仍然非常危险！
actors.mobs.elemental$newbornfireelemental.desc_ally=由于这个元素生物是由法术召唤而来，因此它对火焰的控制能力更强。它无法进行远程攻击，但会点燃近战攻击的敌人。
actors.mobs.elemental$newbornfireelemental.desc_boss=由于其召唤过程混乱，该元素生物只能在充能一回合后以不精确的方式散播火焰。
actors.mobs.elemental$newbornfireelemental.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.elemental$newbornfireelemental.name=新生火元素
actors.mobs.elemental$shockelemental.desc=元素生物是混乱的生物，通常在强大的神秘魔法失控时产生。元素生物智力低下，通常与某种特定类型的魔法相关联。电击元素是一种较为罕见的元素生物，它们会用电流和闪光干扰敌人。近战时，它们会向附近的敌人释放电弧，如果主要目标在水中，则会对其造成额外伤害。它们偶尔还会向目标发射一道远程光束，使其暂时失明。
actors.mobs.elemental$shockelemental.name=冲击元素
actors.mobs.eye.deathgaze_kill=那道死亡凝视杀死了你……
actors.mobs.eye.desc=这种恶魔又被称为“憎恨之球”。一旦发现敌人，它就会不顾一切地射出死亡凝视，常常连同伴也一起打伤。
actors.mobs.eye.name=邪眼
actors.mobs.fetidrat.desc=这只老鼠显然有问题。它油腻的黑色皮毛和腐烂的皮肤与你之前见过的健康老鼠截然不同。它那苍白的绿色眼睛更增添了几分凶神恶煞。这只老鼠身上散发着一股令人作呕的恶臭，近距离闻起来更是刺鼻难闻。黑色的黏液从老鼠嘴里流出来，它啃穿了地板，但似乎遇水就化了。
actors.mobs.fetidrat.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.fetidrat.name=臭老鼠
actors.mobs.fungalcore.desc=这朵巨大的蘑菇一定是这个洞穴里所有真菌活动的源头。
actors.mobs.fungalcore.name=真菌核心
actors.mobs.fungalsentry.desc=这朵特别高的蘑菇是洞穴中大型真菌网络的一道防线。它虽然无法移动，但会向任何进入其视线范围的生物发射精准的毒液冲击波。虽然这些冲击波的威力相对较弱，但_它们能迅速积累致命的毒素量_。虽然它可以被杀死，但最好还是避开它。
actors.mobs.fungalsentry.name=真菌哨兵
actors.mobs.fungalspinner.desc=这只洞穴织网蛛似乎被一种寄生真菌控制了。真菌也改变了它的能力，用真菌植株取代了蛛网和毒囊。真菌织网蛛会向你喷射植物而不是蛛网，传播真菌植被，并有可能将你困住。虽然它不会造成中毒，但如果它靠近蘑菇，就会获得显著的伤害抗性。
actors.mobs.fungalspinner.name=真菌纺丝器
actors.mobs.ghoul.desc=随着矮人社会逐渐瓦解，现任矮人国王攫取了绝对权力，那些弱小或反抗他的人都受到了不公正的对待。国王对黑暗魔法的运用日益精湛，他逐渐将这些矮人纳入自己的掌控，如今他们成了他军队的步兵。食尸鬼单独行动并不特别强大，但它们总是成群结队地行动，数量越多越难对付。_当一个食尸鬼被击败后，只要附近有另一个食尸鬼，它就会在几个回合后复活。_
actors.mobs.ghoul.name=矮人食尸鬼
actors.mobs.gnoll.desc=豺狼人是类似鬣狗的人形生物。它们栖息于下水道和地牢，偶尔会冒险来到地面劫掠。豺狼人斥候是其族群的普通成员，它们的力量不如蛮兽，智慧也不如萨满。
actors.mobs.gnoll.name=豺狼人侦察兵
actors.mobs.gnollexile.desc=这只灰毛豺狼人肩膀上有一道醒目的印记，表明它是一名流放者。豺狼人通常因为违抗命令或触犯法律而被逐出族群。流放者必须强大而狡猾才能生存，这只豺狼人看起来似乎很擅长使用它手中的长矛。
actors.mobs.gnollexile.desc_aggro=豺狼人流放者愤怒地环顾四周。看来它最终还是决定战斗了。小心那长矛！
actors.mobs.gnollexile.desc_passive=那只被放逐的豺狼人并没有攻击的意图。它看起来不像这里的其他豺狼人那样好斗，可能觉得跟你打架不值得。你可以放它走，但它背着一个背包，里面可能装满了有用的东西……
actors.mobs.gnollexile.name=豺狼人流放
actors.mobs.gnollexile.seen_aggro=手持长矛的豺狼人发起攻击！
actors.mobs.gnollexile.seen_passive=手持长矛的豺狼人警惕地看着你，但并没有攻击你。
actors.mobs.gnollgeomancer.alert=地卜师醒了！整个洞穴仿佛都随之移动，它一边疯狂大笑一边跃离洞穴！
actors.mobs.gnollgeomancer.desc=这位身材高大、气势逼人的豺狼人老者，想必是此地各种土方魔法的源头，也是所有豺狼人活动的组织者。与此地的豺狼人工兵不同，这位土方术士精通魔法，而且刀枪不入，不受投掷或坠落的岩石伤害。不过，它却不具备任何近战能力。
actors.mobs.gnollgeomancer.desc_armor=地术士目前被一层岩石盔甲包裹着。你需要靠近并用镐子凿开这层盔甲才能伤害到地术士。
actors.mobs.gnollgeomancer.desc_armor_sapper=附近有个豺狼人工兵拿着一个装置，正在强化地术士的岩石盔甲。你现在根本无法对其造成任何伤害！
actors.mobs.gnollgeomancer.desc_sleeping=这位身材高大的豺狼人萨满被一层岩石包裹着，看起来几乎像一尊雕像。仔细观察，你会发现岩石会随着这位年长豺狼人的呼吸而神奇地移动。它被这样包裹在岩石之中，刀枪不入，看起来正享受着真正的“土眠”。你或许可以用镐子凿开这些岩石层，但_务必做好战斗准备。_这位地脉术士一定是周围各种土方魔法的源头，也是所有豺狼人活动的组织者。_在与它战斗之前，最好先消灭散落在周围的豺狼人。_
actors.mobs.gnollgeomancer.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.gnollgeomancer.name=豺狼人地卜师
actors.mobs.gnollgeomancer.rock_kill=飞来的巨石砸死了你……
actors.mobs.gnollgeomancer.rockfall_kill=你被落石砸死了……
actors.mobs.gnollgeomancer.warning=风水师开始活动。请确保您已做好准备再继续！
actors.mobs.gnollguard.def_verb=已屏蔽
actors.mobs.gnollguard.desc=一个体型庞大、外表凶悍的豺狼人，手持长矛和盾牌，但没有戴头盔。这些守卫很可能是正在接受训练的蛮汉，被招募来保护矿井免受野生动物的侵扰。豺狼人守卫力大无穷，可以单手挥舞长矛，但使用技巧并不娴熟。_它需要相当开阔的空间才能进行远距离攻击，如果你靠近它，它对你造成的伤害会明显降低。_
actors.mobs.gnollguard.desc_armor=附近一名豺狼人工兵拿着一个装置，能赋予这名守卫泥土护甲，大幅降低他受到的伤害。
actors.mobs.gnollguard.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.gnollguard.name=豺狼人守卫
actors.mobs.gnollguard.spear_warn=豺狼人用长矛尖狠狠地击中了目标！
actors.mobs.gnollsapper.desc=一个体型矮小、力量较弱但智力超群的豺狼人，有着浅色的皮毛，背着一个装满各种小玩意儿的挎包。他们很可能是来协助勘探和开采暗金的，附近还有守卫保护。他们虽然具备战斗能力，但攻击力极其微弱，甚至不如豺狼人侦察兵。工兵们并不直接攻击，而是更倾向于利用各种小玩意儿让岩石环境为他们造成攻击。然而，他们自身并不掌握土方魔法，因此很可能会鲁莽地使用这些小玩意儿。应该有很多方法可以利用他们的攻击来对付他们，或者他们的守卫。
actors.mobs.gnollsapper.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.gnollsapper.name=豺狼人工兵
actors.mobs.gnolltrickster.desc=即使以豺狼人的标准来看，它也长相怪异。它弓着身子，咧着嘴露出邪恶的笑容，几乎是抱着挂在肩上的挎包。它的眼睛睁得大大的，既有恐惧又有兴奋，眼神十分复杂。挎包里装着一大堆做工粗糙的飞镖，每支飞镖的尖端似乎都涂有各种有害物质。
actors.mobs.gnolltrickster.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.gnolltrickster.name=豺狼人骗术师
actors.mobs.goldenmimic.desc=拟态怪是一种可以随意变换形状的魔法生物。在地下城中，它们几乎总是伪装成宝箱，以此引诱毫无戒心的冒险者。黄金拟态怪则更为强大，它们会试图吸引最强大的冒险者。它们掉落的战利品更加丰厚，但自身也比普通拟态怪强大得多。
actors.mobs.goldenmimic.name=金色拟态
actors.mobs.golem.def_verb=已屏蔽
actors.mobs.golem.desc=矮人试图将机械知识与新掌握的元素束缚术结合起来。他们把土之精灵放进魔像的机械身躯，作为它们的灵魂，因为这些精灵被认为最容易控制。尽管如此，仪式中哪怕出了一点差错，也可能让魔像失控。
actors.mobs.golem.name=魔像
actors.mobs.goo.!!!=！！！
actors.mobs.goo.defeated=咕噜咕噜……咕噜咕噜……
actors.mobs.goo.desc=人们对粘咕知之甚少。它或许根本不是生物，而是下水道里的各种物质聚成一团，渐渐有了些自己的意志。
actors.mobs.goo.enraged=愤怒
actors.mobs.goo.gluuurp=咕噜咕噜！
actors.mobs.goo.name=粘咕
actors.mobs.goo.notice=咕噜咕噜！
actors.mobs.goo.pumpup=Goo正在自我充气！
actors.mobs.goo.rankings_desc=被粘液吸收
actors.mobs.greatcrab.def_verb=已屏蔽
actors.mobs.greatcrab.desc=这只螃蟹体型巨大，即使与其他下水道螃蟹相比也毫不逊色。它蓝色的甲壳布满裂缝和藤壶，显示出它已相当古老。它行动缓慢，仅靠巨大的螯勉强保持平衡。虽然这只螃蟹只有一只螯，但它庞大的身躯足以弥补这一缺陷。螃蟹会用螯挡在威胁面前，用坚不可摧的甲壳保护自己。然而，螃蟹无法抵挡它看不到的攻击，也无法同时抵御多个敌人的攻击。
actors.mobs.greatcrab.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.greatcrab.name=大蟹
actors.mobs.greatcrab.noticed=螃蟹用它巨大的蟹钳阻挡。
actors.mobs.guard.def_verb=已屏蔽
actors.mobs.guard.desc=这些曾经的监狱守卫，如今早已与囚犯无异。他们像行尸走肉般蹒跚而行，漫无目的地在走廊里游荡，寻找任何异常之处，就像你一样！他们腰间挂着锁链，或许是用来将敌人拉近的。
actors.mobs.guard.name=狱警
actors.mobs.guard.scorpion=过来！
actors.mobs.hermitcrab.def_verb=已屏蔽
actors.mobs.hermitcrab.desc=不知何故，这只下水道螃蟹竟然把破损的桶身顶在了头上！额外的重量让它的速度降到了正常水平，但也大大增强了它的防御力。不过，你好像听到桶里有什么东西在晃动……
actors.mobs.hermitcrab.name=寄居蟹
actors.mobs.mimic.desc=拟态怪是一种魔法生物，可以随意变换形状。在地下城里，它们几乎总是选择宝箱的形状来引诱毫无戒心的冒险者。拟态怪的咬合力很强，但通常比普通的宝箱藏有更多宝物。
actors.mobs.mimic.discover_hint=你可以在地牢的任何地方遇到这种敌人。
actors.mobs.mimic.hidden_hint=这个箱子感觉有点不对劲……走上前去试图打开它可能不是个好主意。
actors.mobs.mimic.name=宝箱怪
actors.mobs.mimic.reveal=那个箱子是仿制品！
actors.mobs.mob.died=你听到远处传来什么东西死亡的声音。
actors.mobs.mob.discover_hint=你可以在地牢的特定区域找到这种敌人。
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=被击杀者：%s
actors.mobs.monk$focus.desc=这位僧侣的注意力完全集中在目标身上，似乎能预判对手的行动。专注状态下，无论在何种情况下，下一次针对他的物理攻击都必定落空。格挡这次攻击会消耗僧侣的专注值，需要重新积攒专注值才能再次格挡攻击。僧侣在移动中积攒专注值的速度更快。
actors.mobs.monk$focus.name=专注
actors.mobs.monk.def_verb=已屏蔽
actors.mobs.monk.desc=这些僧侣是一群狂热分子，一心守护城市的秘密，不让任何外人染指。他们不穿护甲，也不拿武器，只凭徒手格斗的本领作战。
actors.mobs.monk.name=矮人僧侣
actors.mobs.monk.parried=招架
actors.mobs.necromancer$necroskeleton.desc=这具骷髅是由一名死灵法师召唤的。它的行为与普通骷髅无异，当召唤它的死灵法师被杀死时，它也会随之死亡。
actors.mobs.necromancer$necroskeleton.name=死灵法师的骨架
actors.mobs.necromancer.desc=这些黑暗法师学徒蜂拥而至，因为这里是他们练习邪恶魔法的理想场所。死灵法师会召唤并强化骷髅为他们而战。杀死死灵法师也会杀死它召唤的骷髅。
actors.mobs.necromancer.name=死灵法师
actors.mobs.npcs.blacksmith.cant_enter_old=本次游戏无法进入该区域。请重新开始游戏以尝试新任务！
actors.mobs.npcs.blacksmith.def_verb=已屏蔽
actors.mobs.npcs.blacksmith.desc=这位巨魔铁匠的长相和其他巨魔一样：身材高挑精瘦，皮肤的颜色和质地都像石头一样坚硬。他正在摆弄着一些比例失调的小工具。
actors.mobs.npcs.blacksmith.enter_no=还没有
actors.mobs.npcs.blacksmith.enter_yes=我准备好了
actors.mobs.npcs.blacksmith.entrance_blocked=下山的路被堵住了。
actors.mobs.npcs.blacksmith.exit_no=还没有
actors.mobs.npcs.blacksmith.exit_warn_crystal=那块巨大的水晶还在下面。如果你把它毁掉，我会额外付钱。
actors.mobs.npcs.blacksmith.exit_warn_full=你搞定了？你带了不少金子，但确保你没落下任何装备。记住，你上来之后我就不让你再进来了。
actors.mobs.npcs.blacksmith.exit_warn_fungi=那朵巨型蘑菇还在下面呢。你要是能把它弄死，我愿意额外付钱。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=那个豺狼人地术士还在下面。你要是杀了它，我额外付钱。
actors.mobs.npcs.blacksmith.exit_warn_high=你弄完了吗？看起来你已经攒了不少金子，但我还需要一些。你应该能弄到40个。记住，一旦你上来，我就不会再让你进来了。
actors.mobs.npcs.blacksmith.exit_warn_low=这就完了？看起来你没弄到多少金子。你应该能拿到40个。记住，你上来之后我就不让你再进来了。
actors.mobs.npcs.blacksmith.exit_warn_med=你挖完了吗？你至少挖到了一些金子，但矿里肯定还有更多。你应该能挖到40块。记住，你上来之后我就不让你再进去了。
actors.mobs.npcs.blacksmith.exit_warn_none=这就完了？你几乎没拿到什么金币！你应该能拿到40个。记住，你上来之后我就不让你再进来了。
actors.mobs.npcs.blacksmith.exit_yes=我受够了
actors.mobs.npcs.blacksmith.get_lost=我很忙。滚开！
actors.mobs.npcs.blacksmith.intro_quest_cleric=嘿，人类！你看上去像个重要人物。
actors.mobs.npcs.blacksmith.intro_quest_crystal=不过要小心，矿井对你这样的小家伙来说很危险。它已经废弃很久了，里面长出了很多水晶。它们闪闪发光，但太脆弱了，没什么价值，而且还有一些魔法保护着它们。这些水晶很坚固，所以_小心你的矿井位置_，否则你会引起它们的注意。矿井里还有一颗_巨大的水晶_。它坚硬得多，所以如果你开始破坏它，做好战斗的准备。不过我敢打赌，砸碎它应该能减缓所有水晶的生长速度，所以如果你能做到，我会额外付你钱。
actors.mobs.npcs.blacksmith.intro_quest_duelist=嘿，人类！你看上去很勇敢。
actors.mobs.npcs.blacksmith.intro_quest_fungi=不过要小心，矿井对你这样的小家伙来说很危险。那里长着某种真菌怪物。它有蘑菇哨兵，如果被它们发现会非常致命，但至少它们不会站起来追你。_想活命就躲开_。如果你能干掉_最大的蘑菇_，我会额外付你钱，但这需要费一番功夫。它连接着许多隐藏在墙壁里的菌丝节点。你必须先破坏大部分菌丝节点才能真正对它造成伤害。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=不过要小心，矿井对你这样的小家伙来说很危险。有些豺狼人也想要黄金，现在它们正在破坏矿井。这些家伙很蠢，它们的采矿活动造成了各种各样的坍塌和塌方。你必须挖穿矿井，所以要留意最近被扰动过的岩石。我觉得其中一个豺狼人是罪魁祸首，可能是个地脉术士萨满之类的。如果你能找到并干掉它，我会额外付钱，但我肯定它会反击。
actors.mobs.npcs.blacksmith.intro_quest_huntress=嘿，人类！你看上去动作很快。
actors.mobs.npcs.blacksmith.intro_quest_mage=嘿，人类！你看上去很聪明。
actors.mobs.npcs.blacksmith.intro_quest_rogue=嘿，人类！你看上去像个狡猾的家伙。
actors.mobs.npcs.blacksmith.intro_quest_start=想帮帮忙？嗯，我这儿有个活儿你可以干。我把这间工坊建在一座旧矿井上面，梯子下去就到了。拿着这把镐，帮我挖点_暗金矿_。40块应该够了。下面的岩石很软，所以_你稍微费点劲就能挖穿岩壁_。什么？我怎么付钱？你太贪心了……好吧好吧，我可以帮你锻造。你走运了，我是这附近唯一的铁匠。
actors.mobs.npcs.blacksmith.intro_quest_warrior=嘿，人类！你看上去很厉害。
actors.mobs.npcs.blacksmith.lost_pick=你在开玩笑吗？我的镐呢？！
actors.mobs.npcs.blacksmith.name=巨魔铁匠
actors.mobs.npcs.blacksmith.quest_start_prompt=准备好下去了吗？确保你留出点空间放金子。我只会让你失望一次！
actors.mobs.npcs.blacksmith.reminder=你浪费我的时间够了吗？矿井入口就在那边。
actors.mobs.npcs.blacksmith.reminder_crystal=尽可能多地给我带些金子，还有，试着打破那块大水晶。
actors.mobs.npcs.blacksmith.reminder_fungi=尽可能多地给我带些金子，还有，尽量把巨型蘑菇干掉。
actors.mobs.npcs.blacksmith.reminder_gnoll=尽可能多地给我带些金子，还有，尽量把那个豺狼人地术士也干掉。
actors.mobs.npcs.ghost.crab_1=你好 %s……我曾经也像你一样——强大而自信……但我却被一只远古生物杀死了……我无法离开这里……除非我复仇成功……杀死那只夺走我性命的巨蟹……\n\n它异常古老……长着一只巨大的单爪和厚厚的甲壳……_小心它的爪子，你必须出其不意地攻击它，否则它会用爪子挡住你的去路……_
actors.mobs.npcs.ghost.crab_2=请……帮帮我……消灭这只甲壳类动物……它总是会挡住你的去路……只要它看到你靠近……
actors.mobs.npcs.ghost.desc=那鬼魂几乎看不见，看起来像一团模糊的光点，带着悲伤的表情。
actors.mobs.npcs.ghost.find_me=谢谢……来找我吧……
actors.mobs.npcs.ghost.gnoll_1=你好，%s……我曾经也像你一样——强大而自信……但我却被一个狡猾的敌人杀死了……我无法离开这里……除非我复仇成功……杀死那个夺走我性命的_豺狼人骗子_……\n\n它和其他豺狼人不一样……它会躲藏起来，还会使用投掷武器……_小心它投掷的毒镖和燃烧镖，不要远距离攻击……_
actors.mobs.npcs.ghost.gnoll_2=请……帮帮我……除掉那个骗子……别让它打到你……靠近它……
actors.mobs.npcs.ghost.name=悲伤的鬼魂
actors.mobs.npcs.ghost.rat_1=你好，%s……我曾经也像你一样——强大而自信……但我却被一只邪恶的野兽夺去了生命……我无法离开这里……除非我复仇成功……杀死那只夺走我性命的_臭老鼠_……\n\n它潜伏在这层楼里……到处散播污秽……_小心它散发的恶臭和腐蚀性的毒液，它的酸液溶于水……_
actors.mobs.npcs.ghost.rat_2=请……帮帮我……斩杀这怪物……在水边与它战斗……避开那恶臭……
actors.mobs.npcs.imp.cya=再见，%s！
actors.mobs.npcs.imp.desc=小恶魔是低阶恶魔。它们既不以力量见长，魔法天赋也平平，但却十分聪明且善于交际。许多小恶魔更喜欢与非恶魔为伍。
actors.mobs.npcs.imp.golems_1=就我而言，需要消灭的是_魔像_。你看，我打算在这里开个小生意，但这些愚蠢的魔像会拖累生意！跟这些游荡的花岗岩块谈判简直太难了，该死的！所以，请帮我杀掉……比如说_4个_，我会给你奖励。
actors.mobs.npcs.imp.golems_2=你的魔像狩猎之旅进行得怎么样了？别忘了收集那些代币哦。
actors.mobs.npcs.imp.hey=嘘，%s！
actors.mobs.npcs.imp.intro=你是冒险者吗？我超爱冒险者！要是需要干掉什么，他们总能帮上忙，对吧？当然是为了赏金啦 ;)
actors.mobs.npcs.imp.monks_1=就我而言，需要杀的是那些和尚。你看，我打算在这儿开个小店，但这些疯子自己什么也不买，还会吓跑其他顾客。所以，请你杀了……比如说，五个和尚，赏金给你。
actors.mobs.npcs.imp.monks_2=哦，你还活着！我就知道你的功夫会更强 ;) 别忘了把代币都拿走。
actors.mobs.npcs.imp.name=雄心勃勃的小鬼
actors.mobs.npcs.impshopkeeper.buyback=小恶魔兴高采烈地将你的物品归还给你。
actors.mobs.npcs.impshopkeeper.desc=小妖精在内厅边缘开了一家小店。看到一张友善的面孔固然令人高兴，但他的价格可一点也不友善。
actors.mobs.npcs.impshopkeeper.greetings=你好，%s！
actors.mobs.npcs.impshopkeeper.greetings_ascent=%s，你干了什么？快点购物，我得离开这里！
actors.mobs.npcs.impshopkeeper.name=雄心勃勃的小鬼
actors.mobs.npcs.impshopkeeper.thief=我以为我可以信任你！
actors.mobs.npcs.mirrorimage.desc=这个幻影和你十分相像，只是更苍白，还会微微抽动。
actors.mobs.npcs.mirrorimage.discover_hint=你可以通过特定的卷轴找到这个角色。
actors.mobs.npcs.mirrorimage.name=镜像
actors.mobs.npcs.npc.discover_hint=你可以在地牢的特定区域找到这个角色。
actors.mobs.npcs.prismaticimage.desc=这种闪烁的幻象与你极为相似，甚至看起来也像是在使用你当前的武器和盔甲。棱镜幻象会试图寻找并吸引敌人的注意力，利用其增强的防御力和生命值来保护你。虽然它们的攻击力不如镜像，但它们拥有更强的耐久性，并且能够获得你盔甲的加成。当生命值降至0时，棱镜幻象会在几个回合内逐渐消失，在此期间仍然可以被治疗。当周围没有敌人时，棱镜幻象会消失并重新回到它们的主人身边。
actors.mobs.npcs.prismaticimage.discover_hint=你可以通过特定的卷轴找到这个角色。
actors.mobs.npcs.prismaticimage.name=棱镜图像
actors.mobs.npcs.ratking.confused=什么……这是哪里？我的王国需要我！
actors.mobs.npcs.ratking.crown_after=喜欢你的新盔甲吗？可不能反悔！
actors.mobs.npcs.ratking.crown_clothes=穿上衣服！你现在这副样子根本没法跟皇室成员说话！
actors.mobs.npcs.ratking.crown_desc=哇哦，这顶王冠是给我的吗？！它看起来比我的闪亮多了，所以我欣然接受！其实，我想我可以给你一些东西作为这顶王冠的奖励。一种配得上你这样英雄的强大力量！你想要吗？
actors.mobs.npcs.ratking.crown_fine=好吧！反正我也不是想要……
actors.mobs.npcs.ratking.crown_info=请先详细说说。
actors.mobs.npcs.ratking.crown_no=我宁愿不……
actors.mobs.npcs.ratking.crown_thankyou=呵呵，谢谢！现在去让你的国王为你骄傲吧！
actors.mobs.npcs.ratking.crown_yes=当然！
actors.mobs.npcs.ratking.desc=这只老鼠比普通的袋鼠稍大一些。它的头上戴着一个小小的皇冠。
actors.mobs.npcs.ratking.desc_birthday=这只老鼠比普通的袋鼠略大一些。它头上戴着一顶小小的绿色派对帽，而不是它平常戴的王冠。鼠王生日快乐！
actors.mobs.npcs.ratking.desc_crown=这只老鼠比普通的袋鼠鼠稍大一些。它头上戴着矮人王冠。
actors.mobs.npcs.ratking.desc_winter=这只老鼠比一般的袋鼠鼠稍大一些。它戴着一顶小小的节日帽子，而不是它通常的王冠。节日快乐！
actors.mobs.npcs.ratking.discover_hint=你可以在地牢特定区域的尽头找到这个角色。
actors.mobs.npcs.ratking.name=鼠王
actors.mobs.npcs.ratking.not_sleeping=我睡不着！
actors.mobs.npcs.ratking.what_is_it=什么事？我没空理会这些无聊事。我的王国可不会自己统治！
actors.mobs.npcs.sheep.baa!=咩！
actors.mobs.npcs.sheep.baa.=咩。
actors.mobs.npcs.sheep.baa...=咩……
actors.mobs.npcs.sheep.baa?=咩？
actors.mobs.npcs.sheep.def_verb=已屏蔽
actors.mobs.npcs.sheep.desc=这是一只神奇的绵羊。它到底神奇在哪里？你杀不死它。它会一直站在那里，直到神奇地消失，同时反刍，眼神空洞。
actors.mobs.npcs.sheep.discover_hint=你可以通过特定的物品或陷阱找到这个角色。
actors.mobs.npcs.sheep.name=羊
actors.mobs.npcs.shopkeeper.buyback=店主很不情愿地退还了你的商品。
actors.mobs.npcs.shopkeeper.desc=这个身材魁梧的家伙看起来更像是大城市商业区的人，而不是地牢里的人。他的定价也解释了他为什么更喜欢在这里做生意。
actors.mobs.npcs.shopkeeper.flee=店主逃跑了！
actors.mobs.npcs.shopkeeper.name=店主
actors.mobs.npcs.shopkeeper.sell=出售物品
actors.mobs.npcs.shopkeeper.talk=讲话
actors.mobs.npcs.shopkeeper.talk_ascent=我不知道你打算怎么处理那个护身符，但我一点也不想掺和。买点别的东西然后离开吧，我们俩都得离开这个地方！
actors.mobs.npcs.shopkeeper.talk_caves=花钱，活得更久。哦，如果你看到那个巨魔铁匠，帮我问好。提醒他，他还没付我上周卖给他的锤子的钱呢！
actors.mobs.npcs.shopkeeper.talk_city=我的货物能保证你在这里的安全。\n\n……还有，请不要逗留太久。我费了好大劲才让当地人不再骚扰我，我可不想你惹来麻烦！
actors.mobs.npcs.shopkeeper.talk_halls=嘿，我这里有恶魔猎人的特价优惠！哦，对了，小心点！下面的恶魔才不管你有多勇敢。死了就没法再上来花钱了！;) 恶魔跟我一样吗？呵呵，完全不一样。我只是个小家伙，不怎么会打架，但我的理智还算清醒。下面的恶魔比我强大得多，而且它们都被……嗯……奴役了。总之，小心点。
actors.mobs.npcs.shopkeeper.talk_prison_cleric=你好啊，殿下，或者现在该叫你圣殿大人了？呵呵，不管怎样，这里不适合你，如果你死了，很多人都会非常难过。不过你肯定不缺钱，何不买点东西来避免这种情况发生呢？
actors.mobs.npcs.shopkeeper.talk_prison_duelist=哟，这不是旅行英雄吗！如果你是来拯救另一个城镇的，祝你好运，这里的危险比那些小匪帮严重得多。我相信你肯定比任何人都做得好，只是别死在我店门口。
actors.mobs.npcs.shopkeeper.talk_prison_huntress=小姐，你好像不太适应这里。狭窄的地牢走廊可不如宏伟的大厅或环绕城市的森林宽敞，对吧？呵呵，别在意我的絮叨，不如买点东西吧？
actors.mobs.npcs.shopkeeper.talk_prison_intro=我已经为你准备好了成功冒险所需的一切！
actors.mobs.npcs.shopkeeper.talk_prison_mage=呵呵，我好像在城里某个地方看到过你的通缉令。你这是在逃亡吗？哦，你是清白的？当然，当然……别担心，我还有更重要的事要做，没空去告发你。不过，或许你应该买点东西以防万一？
actors.mobs.npcs.shopkeeper.talk_prison_rogue=你是盗贼公会的，来清理这片区域的吗？不是，只是来购物的？既然来了，那就顺便杀几个怪吧。别指望打折，我付了你们一大笔保护费，你们却连我的安全都保障不了多少。
actors.mobs.npcs.shopkeeper.talk_prison_warrior=你这枚印章挺有意思的，通常都是完整的。你是落魄英雄之类的吗？不过你做过什么跟我没关系，你的硬币依然值钱。
actors.mobs.npcs.shopkeeper.thief=小偷！小偷！
actors.mobs.npcs.shopkeeper.warn=注意！我不会再警告你一次了。
actors.mobs.npcs.vaultlaser.desc=这个哨兵会定时发射激光。_由于这里只是测试区域，激光不会对你造成实际伤害。_
actors.mobs.npcs.vaultlaser.name=金库激光哨兵
actors.mobs.npcs.vaultsentry.desc=这个哨兵正在按特定模式扫描该区域。_由于这只是一个测试区域，即使哨兵检测到你，也不会采取任何行动。_
actors.mobs.npcs.vaultsentry.name=金库扫描哨兵
actors.mobs.npcs.wandmaker.def_verb=已屏蔽
actors.mobs.npcs.wandmaker.desc=这位年迈但身强体健的绅士脸上带着一丝困惑。他被一道魔法护盾保护着。
actors.mobs.npcs.wandmaker.intro_1=我来这里是为了寻找制作魔杖的稀有材料，但我迷路了，而且我的魔法护盾正在减弱。我很快就要离开了，但我舍不得空手而归。
actors.mobs.npcs.wandmaker.intro_2=如果你能帮我找到那个，我很乐意用我精心制作的魔杖之一来支付你报酬！我带了两根，你可以随便挑一根。
actors.mobs.npcs.wandmaker.intro_berry=这所监狱的老典狱长种了一株腐烂浆果，我想要它的一颗种子。不过这株植物现在可能已经野生了，所以想让它掉落种子可能有点难。它的地盘应该就在这附近。如果你想活命，就尽量避开它的藤蔓鞭笞者。用火烧它或许很诱人，但千万别这么做，你会把植物烧死，种子也会毁掉。
actors.mobs.npcs.wandmaker.intro_cleric=哦，殿下，您好！在这样阴郁的地方遇见您真是个惊喜！恕我冒昧，我或许可以委托您做件事。
actors.mobs.npcs.wandmaker.intro_duelist=哦，你好小姐！在这种萧条的地方遇到英雄真是个惊喜！如果你愿意帮助一位老人家，我或许可以交给你一项任务。
actors.mobs.npcs.wandmaker.intro_dust=我在找一些尸粉。那是一种特殊的诅咒骨粉，通常出现在这种地方。这附近应该有个被封锁的房间，我肯定能在那里找到一些尸粉。不过要小心，这尸粉的诅咒非常强大，找到之后尽快联系我，我会帮你净化它。
actors.mobs.npcs.wandmaker.intro_ember=我正在寻找新生火元素的_新鲜余烬_。元素通常会在召唤仪式失控时出现，所以只要找到一些蜡烛和仪式地点，我相信你就能召唤出一个。不过，战斗时你最好_避免把自己困在某个地方_，或者你可以_准备一些冰冻物品_。新生元素非常强大且混乱，但它们不耐寒。
actors.mobs.npcs.wandmaker.intro_huntress=哦，你好小姐！在这里见到一张友善的面孔真是令人惊喜，不是吗？事实上，我发誓我以前见过你，但一时想不起来……哦，没关系，如果你是来冒险的，我或许可以给你安排个任务。
actors.mobs.npcs.wandmaker.intro_mage=哦，你好啊 %s！我听说你和魔法学院之间有点小摩擦？哦，算了，反正我一直都不喜欢那些古板守旧的人。如果你愿意的话，我或许可以给你安排个任务。
actors.mobs.npcs.wandmaker.intro_rogue=我的天哪，你吓了我一跳！我还没见过哪个本地强盗还保持理智，看来你一定是来自地面！如果你愿意帮助一个陌生人，我或许可以给你安排个任务。
actors.mobs.npcs.wandmaker.intro_warrior=哦，你好啊！在这种荒凉的地方居然能遇到一位来自北方的勇士，真是个惊喜！想必你跋山涉水来到这里一定很远的路吧。如果你想找点刺激，我或许可以给你安排个任务。
actors.mobs.npcs.wandmaker.name=老魔杖匠
actors.mobs.npcs.wandmaker.reminder_berry=%s，你找到腐烂浆果种子了吗？找一个长满植物的房间。
actors.mobs.npcs.wandmaker.reminder_dust=%s，你找到尸粉了吗？找找路障。
actors.mobs.npcs.wandmaker.reminder_ember=%s，那些余烬找到了吗？你需要找到四根蜡烛和仪式地点。
actors.mobs.phantompiranha.desc=幻影食人鱼是一种罕见的食人鱼，拥有魔法能力和诡异的半透明身体。它们能够在受到攻击时瞬间移动，以便逃脱或迅速接近敌人！虽然它们很难对付，但它们的肉因其神奇的特性而备受珍视。
actors.mobs.phantompiranha.name=幻影食人鱼
actors.mobs.phantompiranha.teleport_away=幽灵食人鱼瞬间消失……
actors.mobs.piranha.desc=这些肉食性鱼类是专门为了保护洪水泛滥地区而培育的。它们的咬伤致命，所以最好避免与它们正面冲突。
actors.mobs.piranha.discover_hint=你可以在地牢的任何地方遇到这种敌人。
actors.mobs.piranha.name=巨型食人鱼
actors.mobs.pylon.desc_active=一座电力塔，用于调节该区域机械设备的电力供应。塔内电能正处于激增状态，这一定是DM-300超载的动力来源！在这种状态下，电力塔虽然脆弱，但会以顺时针方向向附近的电池放电。由于其采用重型金属结构，电力塔能够承受较大的损伤。
actors.mobs.pylon.desc_inactive=一座电力塔，旨在帮助调节为该区域机械设备供电的电力。该电力塔目前处于非激活状态，且不会受到损坏。
actors.mobs.pylon.name=输电塔
actors.mobs.rat.desc=袋鼠是生活在下水道中的一种具有攻击性但体质较弱的动物。它们的咬伤很厉害，但只有在数量众多时才会危及生命。
actors.mobs.rat.name=有袋鼠
actors.mobs.ripperdemon.desc=这些恐怖的生物是恶魔势力利用该地区众多矮人尸体所造就的。撕裂者是瘦骨嶙峋、面目狰狞的生物，外形酷似矮人，但身躯残破，长着由骨头构成的锋利长爪。撕裂者恶魔虽然并不特别耐打，但却敏捷而危险。它们能够跳跃很远的距离，迅速接近目标，然后用利爪将其撕碎。
actors.mobs.ripperdemon.leap=开膛手恶魔准备跃起！
actors.mobs.ripperdemon.name=开膛手恶魔
actors.mobs.rotheart.desc=腐莓的果实非常独特。它不会像其他果实那样腐烂分解，而是会继续生长、变硬，并将种子包裹起来。这层包裹为果实内部生长的器官提供了保护。这个巨大的球状物被称为成年腐莓植株的心脏。
actors.mobs.rotheart.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.rotheart.name=腐烂的心
actors.mobs.rotlasher.desc=腐烂鞭笞者是成熟腐烂浆果植株根系的一部分，也是它们的主要防御手段。鞭笞者双目失明，扎根于土壤中，但会在短暂探测到附近威胁后发起猛烈攻击。当附近没有敌人时，它们会静止不动，试图融入周围的植被中。
actors.mobs.rotlasher.discover_hint=你可以在某个特定任务中遇到这个敌人。
actors.mobs.rotlasher.name=腐烂鞭笞者
actors.mobs.scorpio.desc=这些巨大的蛛形恶魔生物避免近身战斗，更喜欢从远处发射具有毁灭性的锯齿状尖刺。
actors.mobs.scorpio.name=巨蝎
actors.mobs.senior.desc=这些僧侣是一群狂热分子，一心守护城市的秘密，不让任何外人染指。他们不穿护甲，也不拿武器，只凭徒手格斗的本领作战。
actors.mobs.senior.name=资深僧侣
actors.mobs.shaman$blueshaman.spell_desc=这位萨满戴着蓝色面具，会使用一种会暂时增加你受到的伤害的魔法。
actors.mobs.shaman$purpleshaman.spell_desc=这位萨满戴着紫色面具，会使用一种暂时降低你的命中率和闪避率的魔法。
actors.mobs.shaman$redshaman.spell_desc=这位萨满戴着红色面具，会使用魔法暂时削弱你的攻击力。
actors.mobs.shaman.bolt_kill=那道魔法闪电杀死了你……
actors.mobs.shaman.desc=最聪明的豺狼人能够掌握萨满法术。豺狼萨满偏爱战斗法术，用来弥补力量上的不足。谁敢质疑它们在部落中的地位，它们也会毫不犹豫地施法教训。
actors.mobs.shaman.name=豺狼人萨满
actors.mobs.skeleton.def_verb=已屏蔽
actors.mobs.skeleton.desc=骷髅由倒霉的冒险者和地牢居民的尸骨拼成，被深处涌出的邪恶魔法唤醒。受到足够的伤害后，它们会炸成四散的碎骨。
actors.mobs.skeleton.explo_kill=你被骨头爆炸炸死了……
actors.mobs.skeleton.name=骷髅
actors.mobs.slime.def_verb=已屏蔽
actors.mobs.slime.desc=史莱姆是一种奇特的、略带魔法气息的生物，它们有着橡胶般的外壳和液态的内核。城市下水道为它们提供了充足的水源和营养。由于它们富有弹性的外膜，任何一次攻击都很难对史莱姆造成超过6点的伤害。
actors.mobs.slime.name=粘液
actors.mobs.snake.desc=这些体型巨大的蛇能够迅速躲避攻击，因此很难击中它们。然而，魔法攻击或突袭却能出其不意地击中它们。你可以在蛇的视线之外发动突袭。一种方法是让蛇追着你穿过门口，然后在它刚进入门口时发动攻击。
actors.mobs.snake.hint=尝试使用“查看”按钮来观察蛇，了解如何对付它们。
actors.mobs.snake.name=下水道蛇
actors.mobs.spectralnecromancer.desc=骷髅是死灵法师的必备法宝，但有些死灵法师更喜欢其他非实体的仆从。幽灵死灵法师就选择了怨灵作为他们的首选仆从！单个怨灵虽然不如骷髅强大，但这些死灵法师并不害怕召唤一大群怨灵！
actors.mobs.spectralnecromancer.name=幽灵死灵法师
actors.mobs.spinner.desc=这些长着绿毛的洞穴蜘蛛不愿正面交战。它们更喜欢躲在远处，等着困在蛛网中的猎物因毒牙留下的伤口慢慢死去。
actors.mobs.spinner.name=洞穴蜘蛛
actors.mobs.statue.def_verb=已屏蔽
actors.mobs.statue.desc=你可能会认为它只是这个地牢里众多无生命的雕像之一，但它那闪着红光的眼睛却暴露了它的身份。
actors.mobs.statue.desc_weapon=虽然雕像本身是用石头做的，但它所挥舞的_%s_看起来是真的。
actors.mobs.statue.discover_hint=你可以在地牢的任何地方遇到这种敌人。
actors.mobs.statue.name=动画雕像
actors.mobs.succubus.desc=魅魔是外形酷似妖艳少女的恶魔，打扮还带着点哥特风。它们能用魔法魅惑英雄，使其在效果消退前无法攻击任何目标。
actors.mobs.succubus.name=魅魔
actors.mobs.swarm.desc=致命的蝇群愤怒地嗡嗡作响。任何非魔法攻击都会将其分裂成两群规模较小但同样危险的蝇群。
actors.mobs.swarm.name=一群苍蝇
actors.mobs.tengu$bombability$bombblob.desc=这里正冒出滚滚高温烟雾。小心，它要爆炸了！
actors.mobs.tengu$bombability$bombitem.cant_pickup=它粘在地上了，你根本动不了它！
actors.mobs.tengu$bombability$bombitem.desc=天狗在这里扔了一个奇形怪状的烟雾弹，正冒出滚滚浓烟。它发出响亮的滴答声，仿佛在倒计时即将爆炸！这枚烟雾弹已经固定在地面上，所以你无法捡起来。
actors.mobs.tengu$bombability$bombitem.name=烟雾弹
actors.mobs.tengu$fireability$fireblob.desc=天狗撒下了一些细粉，这些粉末似乎正在变成蒸汽，它即将燃烧！
actors.mobs.tengu$shockerability$shockerblob.desc=这里正在积聚电能，任何站在这块地砖上的物体下一回合都会受到电击！
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=它释放的电量太多了，你抓不住！
actors.mobs.tengu$shockerability$shockeritem.desc=天狗扔在这里一台奇特的机器，看起来像是用DM-100的零件组装的。这台机器周围不断产生电弧，但似乎遵循着某种可预测的模式。由于周围电弧不断，你根本不可能把它捡起来。
actors.mobs.tengu$shockerability$shockeritem.name=震惊
actors.mobs.tengu.defeated=终于自由了……
actors.mobs.tengu.desc=天狗是一个古老刺客宗族的成员，这个宗族也叫天狗。他们以大量使用手里剑和陷阱闻名。
actors.mobs.tengu.interesting=让我们让这件事变得有趣起来……
actors.mobs.tengu.name=天狗
actors.mobs.tengu.notice_gotcha=抓到你了，%s！
actors.mobs.tengu.notice_have=%s，你被我抓住了！
actors.mobs.tengu.rankings_desc=被天狗刺杀
actors.mobs.thief.carries=小偷携带了_\n\n显然是偷来的。
actors.mobs.thief.desc=虽然这些囚犯可以在牢房里自由活动，但这里仍然是他们的监狱。随着时间的推移，这个地方不仅夺走了他们的自由，也改变了他们的心智。很久以前，这些疯狂的盗贼和强盗就已经忘记了自己是谁，也忘记了他们偷窃的原因。这些敌人更倾向于偷窃后逃跑，而不是战斗。务必时刻注意他们，否则你可能再也找不回你偷来的东西了。
actors.mobs.thief.escapes=小偷偷溜走了你的 %s！
actors.mobs.thief.name=疯狂的小偷
actors.mobs.thief.stole=小偷从你那里偷走了 %s！
actors.mobs.tormentedspirit.desc=受折磨的灵魂原本是善良的，却被诅咒缠身。只要诅咒还在，它们就会像幽灵一样攻击，而且更加强大！或许可以在灵魂附近使用合适的物品来解除诅咒。如果诅咒被解除，灵魂一定会感激不尽……
actors.mobs.tormentedspirit.name=受折磨的灵魂
actors.mobs.tormentedspirit.thank_you=谢谢...
actors.mobs.vaultrat.desc=这只老鼠的行为有所改变，用于测试新的金库敌人AI：\n_-_ 它的移动声可以穿透墙壁被“听到”；\n_-_ 它会沿着预设的巡逻路线游荡；\n_-_ 游荡时，它移动方向后方的侦测范围会大幅缩小；\n_-_ 睡觉时，它的侦测范围也会缩小；\n_-_ 当它发现你时，会先进行“调查”，然后再转为狩猎。调查中的敌人会向你移动，但不会攻击，而且更容易躲在门后或角落里。
actors.mobs.warlock.bolt_kill=暗影闪电杀死了你……
actors.mobs.warlock.desc=当矮人的兴趣从工程转向秘术时，术士们掌握了城市的权力。他们起初研究元素魔法，却很快转向了恶魔学和死灵术。
actors.mobs.warlock.name=矮人术士
actors.mobs.wraith.desc=怨灵是罪人的复仇之魂，因其坟墓或陵墓遭到扰乱而化作怨灵。由于其虚幻缥缈，普通武器很难击中它。
actors.mobs.wraith.discover_hint=你可以在地牢的任何地方遇到这种敌人。
actors.mobs.wraith.name=幽灵
actors.mobs.yogdzewa$larva.desc=这些尤格-泽瓦的微小后代是很容易召唤的简单喽啰。虽然单个它们很弱，但召唤速度很快，数量众多时就能形成压倒性的局面。
actors.mobs.yogdzewa$larva.name=神的幼虫
actors.mobs.yogdzewa$larva.rankings_desc=被约格-泽瓦吞噬
actors.mobs.yogdzewa$yogeye.rankings_desc=被约格-泽瓦吞噬
actors.mobs.yogdzewa$yogripper.rankings_desc=被约格-泽瓦吞噬
actors.mobs.yogdzewa$yogscorpio.rankings_desc=被约格-泽瓦吞噬
actors.mobs.yogdzewa.darkness=黑暗逐渐逼近……
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=尤格-泽瓦是一位古老的神祇，一个庞大的怪物，它深入凡间，吞噬一切，以维持自身无尽的成长。矮人们一定是在玩弄黑暗魔法时引起了这宇宙恐怖的注意，此后便一直试图将其封印。尤格-泽瓦源自一个充满原始魔法混沌的维度，无法将其真身带到这个世界。因此，它创造了化身，并召唤恶魔仆从在此地为其效力。这只巨眼是尤格-泽瓦在这个世界力量的焦点。虽然巨眼本身无法移动，但它能够发射强大的恶魔魔法光束，并召唤各种各样的仆从来协助它。
actors.mobs.yogdzewa.desc_spawners=你能感觉到楼上涌来的阵阵魔力直冲眼眶。你留在楼上的某个东西肯定在把能量回流给尤格·泽瓦。尤格会利用这股能量召唤更强大的爪牙！
actors.mobs.yogdzewa.hope=你的希望只是幻觉！
actors.mobs.yogdzewa.name=约格-泽瓦
actors.mobs.yogdzewa.notice=我看见你。
actors.mobs.yogdzewa.rankings_desc=被约格-泽瓦吞噬
actors.mobs.yogfist$brightfist.desc=这只拳头由纯粹的光能构成，每回合都能发射出威力强大的灼热光束！这些光束除了造成大量伤害外，还会暂时使你失明。这只拳头还能短暂地用耀眼的光芒笼罩整个竞技场，以便逃脱！然而，这只拳头在近战范围内没有任何特殊能力。
actors.mobs.yogfist$brightfist.name=明亮的拳头
actors.mobs.yogfist$brightfist.teleport=拳头瞬间消失，伴随着一道强光，强光刺得你睁不开眼！
actors.mobs.yogfist$burningfist.desc=一只裹着烈火的巨拳。手指握紧时劈啪作响，余烬纷纷落到地上。
actors.mobs.yogfist$burningfist.name=燃烧的拳头
actors.mobs.yogfist$darkfist.desc=这只拳头由纯粹的黑暗能量构成，每回合都能发射威力强大的黑暗魔法冲击波！这些冲击波不仅会造成大量伤害，还会削弱你的光源。这只拳头还能短暂地将整个竞技场笼罩在黑暗之中，以便逃脱！然而，这只拳头在近战范围内没有任何特殊能力。
actors.mobs.yogfist$darkfist.name=黑拳
actors.mobs.yogfist$darkfist.teleport=拳头瞬间消失，伴随着一阵黑暗，熄灭了你的光源！
actors.mobs.yogfist$rottingfist.desc=一只腐肉堆成的巨大拳头。恶臭的黏液从指缝渗出，污染了下方的石面。
actors.mobs.yogfist$rottingfist.name=腐烂的拳头
actors.mobs.yogfist$rustedfist.desc=这只拳头由活体金属构成，是一团高耸的、不断移动的金属，拥有强大的近战攻击力，并能远程重创目标。由于其巨大的质量，这只拳头受到的伤害会随着时间推移而逐渐累积，而非立即生效。然而，这只拳头缺乏灵活性，无法进入狭窄的通道。此外，虽然它会缓慢承受伤害，但如果多次受到攻击，累积的伤害会持续增加。
actors.mobs.yogfist$rustedfist.name=生锈的拳头
actors.mobs.yogfist$soiledfist.desc=这只拳头由混乱的土系魔法构成。它移动时，周围会不断生长出植物。它还能发射高密度土系冲击波，将目标困在快速生长的藤蔓和根须之中！这只拳头从这些植物中汲取力量，并能根据附近高大或沟壑纵横的植物数量来抵抗伤害！
actors.mobs.yogfist$soiledfist.name=脏拳头
actors.mobs.yogfist.desc=这只拳头是尤格-泽瓦力量的一个方面。拳头与尤格-泽瓦的力量相连，当它靠近眼睛时，就能免受一切伤害。
actors.mobs.yogfist.invuln_warn=拳头靠近眼睛时是刀枪不入的！
actors.mobs.yogfist.rankings_desc=被约格-泽瓦吞噬
actors.char.def_verb_evaded=躲避
actors.char.enemy_hit=%s 击中你
actors.char.enemy_missed=你 %2$s %1$s 的攻击
actors.char.hit=%s 击中 %s
actors.char.mob_missed=%1$s %2$s %3$s 的攻击
actors.char.out_of_paralysis=疼痛使 %s 从麻痹状态中清醒过来。
actors.char.you_hit=你击中了 %s
actors.char.you_missed=%1$s %2$s 你的攻击
actors.mobs.mob.fleeing=%s 正在逃离
actors.mobs.mob.hunting=%s 正在狩猎
actors.mobs.mob.passive=%s 是被动的
actors.mobs.mob.sleeping=%s 正在睡觉
actors.mobs.mob.wandering=%s 正在游荡
actors.mobs.elemental.desc=游荡的火元素是召唤更强大存在时产生的副产物。它们的本性太过混乱，即便是最强大的恶魔学者也无法控制。
actors.mobs.elemental.name=火元素
actors.mobs.king.desc=矮人的末代国王以深谙生死之道闻名。他说服宫廷成员参加一场据说能让人永葆青春的仪式。结果只有他一人如愿，还附带得到了一支亡灵大军。
actors.mobs.king.name=矮人王
actors.mobs.npcs.bee.desc=金蜂虽小，却会凶猛地保护主人。不过，它们活不了多久。
actors.mobs.npcs.bee.name=金蜂
actors.mobs.shielded.desc=豺狼暴徒是豺狼人中体形最大、力气最强、最耐打的。受了重伤后，它们会陷入狂怒，对敌人造成更大的伤害。
actors.mobs.shielded.name=持盾暴徒
actors.mobs.yog.desc=尤格-泽瓦是一位古神，来自混沌领域的强大存在。一个世纪前，古老的矮人勉强战胜了它率领的恶魔大军，却未能将其杀死。于是，矮人们将它囚禁在城下的殿堂之中，认为它已虚弱到无法再次复活。
actors.mobs.yog.name=约格-泽瓦
actors.mobs.bandit.carries=%s 携带 _%s_。显然是偷来的。
actors.buffs.armorevasion.name=闪避提升
actors.mobs.king.defeated=你杀不死我。 %s我是……不朽的……
