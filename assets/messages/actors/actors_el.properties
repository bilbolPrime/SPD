actors.mobs.mob.sleeping=Ο %s κοιμάται
actors.mobs.mob.wandering=Ο %s περιπλανιέται
actors.mobs.elemental.desc=Τα περιπλανώμενα στοιχειακά της φωτιάς είναι παραπροϊόν της επίκλησης ισχυρότερων οντοτήτων. Η φύση τους είναι τόσο χαοτική, που ούτε ο ισχυρότερος δαιμονολόγος δεν μπορεί να τα ελέγξει.
actors.mobs.elemental.name=στοιχειακό της φωτιάς
actors.mobs.king.desc=Ο τελευταίος βασιλιάς των νάνων ήταν γνωστός για τη βαθιά γνώση του γύρω από τη ζωή και τον θάνατο. Έπεισε την αυλή του να συμμετάσχει σε μια τελετή που θα τους χάριζε αιώνια νεότητα. Τελικά την απέκτησε μόνο εκείνος — μαζί με έναν στρατό απέθαντων.
actors.mobs.king.name=Βασιλιάς των Νάνων
actors.mobs.npcs.bee.desc=Παρά το μικρό τους μέγεθος, οι χρυσές μέλισσες υπερασπίζονται άγρια τον αφέντη τους. Δεν ζουν όμως πολύ.
actors.mobs.npcs.bee.name=χρυσή μέλισσα
actors.mobs.shielded.desc=Οι κτηνώδεις είναι οι μεγαλύτεροι, δυνατότεροι και πιο ανθεκτικοί από όλα τα γκνολ. Όταν τραυματίζονται βαριά, αφηνιάζουν και προκαλούν ακόμη μεγαλύτερη ζημιά στους εχθρούς τους.
actors.mobs.shielded.name=κτηνώδες γκνολ με ασπίδα
actors.mobs.yog.desc=Ο Γιογκ-Ντζέβα είναι ένας Παλιός Θεός, μια ισχυρή οντότητα από τα βασίλεια του χάους. Πριν από έναν αιώνα, οι αρχαίοι νάνοι μόλις που κέρδισαν τον πόλεμο ενάντια στον στρατό των δαιμόνων τους, αλλά δεν μπόρεσαν να σκοτώσουν τον ίδιο τον θεό. Αντ' αυτού, τον φυλάκισαν στις αίθουσες κάτω από την πόλη τους, πιστεύοντας ότι ήταν πολύ αδύναμος για να επανέλθει ποτέ.
actors.mobs.yog.name=Γιογκ-Ντζέβα
actors.mobs.bandit.carries=Ο %s κουβαλάει ένα _%s_. Προφανώς είναι κλεμμένο.
actors.buffs.armorevasion.name=Αυξημένη αποφυγή
actors.mobs.king.defeated=Δεν μπορείς να με σκοτώσεις, %s... Είμαι... αθάνατος...
