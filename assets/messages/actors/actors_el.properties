actors.blobs.regrowth.name=αναγέννηση
actors.blobs.sacrificialfire.desc=Υπάρχει ένας βωμός εδώ με μια θυσιαστική φωτιά που καίει από πάνω του. Κάθε πλάσμα που σκοτώνεται εδώ θα καταναλώνεται ως προσφορά στα πνεύματα του μπουντρουμιού.\n\nΊσως να δοθεί κάποια ανταμοιβή αν γίνουν αρκετές θυσίες;
actors.blobs.sacrificialfire.name=θυσιαστική φωτιά
actors.blobs.sacrificialfire.reward=Η φωτιά φουντώνει και μετά διαλύεται, αφήνοντας πίσω της μια ανταμοιβή!
actors.blobs.sacrificialfire.unworthy=Η φωτιά κατακαίει την προσφορά σου, αλλά δεν αλλάζει.
actors.blobs.sacrificialfire.worthy=Η φωτιά κατακαίει την προσφορά σου και δυναμώνει.
actors.blobs.smokescreen.desc=Ένα σύννεφο πυκνού μαύρου καπνού στροβιλίζεται εδώ.
actors.blobs.smokescreen.name=προπέτασμα καπνού
actors.blobs.stenchgas.desc=Ένα σύννεφο δυσώδους δυσοσμίας στροβιλίζεται εδώ.
actors.blobs.stenchgas.name=δυσοσμία
actors.blobs.stormcloud.desc=Ένα σύννεφο από κυματιστούς υδρατμούς στροβιλίζεται εδώ.
actors.blobs.stormcloud.name=σύννεφα καταιγίδας
actors.blobs.toxicgas.desc=Ένα πρασινωπό σύννεφο τοξικού αερίου στροβιλίζεται εδώ.
actors.blobs.toxicgas.name=τοξικό αέριο
actors.blobs.toxicgas.ondeath=Πέθανε από το τοξικό αέριο...
actors.blobs.toxicgas.rankings_desc=Πνιγμένος
actors.blobs.waterofawareness.desc=Η δύναμη της γνώσης ακτινοβολεί από το νερό αυτού του πηγαδιού. Πίνοντας από το πηγάδι θα αναγνωρίσετε πλήρως όλα τα εξοπλισμένα αντικείμενα, θα εντοπίσετε τις κατάρες σε όλα τα αντικείμενα στο απόθεμά σας και θα αποκαλύψετε όλα τα αντικείμενα στον τρέχοντα όροφο.
actors.blobs.waterofawareness.name=νερό της επίγνωσης
actors.blobs.waterofawareness.procced=Καθώς πίνεις μια γουλιά, νιώθεις τη γνώση να ξεχύνεται στο μυαλό σου.
actors.blobs.waterofhealth.desc=Δύναμη υγείας ακτινοβολεί από το νερό αυτού του πηγαδιού. Πίνοντας από αυτό το πηγάδι θα γιατρέψετε τις πληγές σας, θα ικανοποιήσετε την πείνα σας και θα καθαρίσετε τις κατάρες από τυχόν φθαρμένα αντικείμενα.
actors.blobs.waterofhealth.name=νερό υγείας
actors.blobs.waterofhealth.procced=Καθώς πίνεις μια γουλιά, νιώθεις τις πληγές σου να επουλώνονται εντελώς.
actors.blobs.web.desc=Ένας παχύς ιστός καλύπτει τα πάντα εδώ. Οτιδήποτε αγγίξει ή πεταχτεί μέσα από τον ιστό θα τον σπάσει, αλλά θα κολλήσει και στη θέση του.
actors.blobs.web.name=ιστός αράχνης
actors.buffs.adrenaline.desc=Μια έκρηξη φυσικής δύναμης και αδρεναλίνης ενίσχυσε τόσο την επίθεση όσο και την ταχύτητα κίνησης.\n\nΗ αδρεναλίνη επιτρέπει στον στόχο της να τρέχει με 2x ταχύτητα και να επιτίθεται με 1,5x ταχύτητα.\n\nΣτροφές που απομένουν: %s.
actors.buffs.adrenaline.name=αδρεναλίνη
actors.buffs.adrenalinesurge.desc=Ένα κύμα μεγάλης ισχύος, αλλά δυστυχώς όχι μόνιμο. \n\nΕνίσχυση δύναμης: +%d.\nΣτρέφεται μέχρι να εξασθενήσει η ώθηση: %s.
actors.buffs.adrenalinesurge.name=ενίσχυση δύναμης
actors.buffs.amok.desc=Το Αμόκ προκαλεί μια κατάσταση μεγάλης οργής και σύγχυσης στον στόχο του. \n\n Όταν ένα πλάσμα είναι καπνισμένο, θα επιτεθεί σε οτιδήποτε βρίσκεται κοντά του, είτε είναι φίλος είτε εχθρός.\n\nΣτροφές του αμόκ που απομένουν: %s.
actors.buffs.amok.name=αμόκ
actors.buffs.arcanearmor.desc=Μια λεπτή ασπίδα σε περιβάλλει, μπλοκάροντας μέρος της ζημιάς από μαγικές επιθέσεις.\n\nΗ μαγική σου πανοπλία ενισχύεται αυτήν τη στιγμή από: 0-%d.\n\nΣτρέφεται μέχρι να αποδυναμωθεί η αόρατη πανοπλία: %s.
actors.buffs.arcanearmor.name=απόκρυφη πανοπλία
actors.buffs.artifactrecharge.desc=Η ενέργεια σε διαπερνά, αυξάνοντας τον ρυθμό φόρτισης των εξοπλισμένων αντικειμένων σου.\n\nΚάθε αντικείμενο επηρεάζεται λίγο διαφορετικά, αλλά όλα θα φορτιστούν πολύ πιο γρήγορα από το κανονικό.\n\nΣτροφές που απομένουν: %s.
actors.buffs.artifactrecharge.name=επαναφόρτιση τεχνουργημάτων
actors.buffs.ascensionchallenge.almost=Νιώθεις την λαβή του Γιογκ στο φυλαχτό να αρχίζει να εξασθενεί, σχεδόν τα κατάφερες!
actors.buffs.ascensionchallenge.beckon=Το φυλαχτό αρχίζει να καλεί μακρινούς εχθρούς.
actors.buffs.ascensionchallenge.break=Αφιερώνεις μια στιγμή για να πάρεις μια ανάσα και νιώθεις τις πληγές σου να αρχίζουν να κλείνουν!
actors.buffs.ascensionchallenge.damage=Το φυλαχτό αρχίζει να ακτινοβολεί σκοτεινή ενέργεια. Καίει!
actors.buffs.ascensionchallenge.desc=Κατά κάποιο τρόπο, ο Γιογκ-Ντζέβα διατηρεί την επιρροή του σε αυτόν τον κόσμο μέσω του φυλαχτού και προσπαθεί να σταματήσει την άνοδό σας! \n\nΗ δύναμη του Γιογκ κάνει το μπουντρούμι πολύ πιο επικίνδυνο, αυξάνοντας τον αριθμό των εχθρών και κάνοντάς τους πιο δυνατούς! Αυτή η δύναμη θα συνεχίσει να αναπτύσσεται αν αφεθεί ανεξέλεγκτη, μπορεί να αποδυναμωθεί νικώντας εχθρούς που έχουν ενισχυθεί από τη δύναμη του Γιογκ.
actors.buffs.ascensionchallenge.desc_beckon=Το φυλαχτό αυτή τη στιγμή _καλεί μακρινούς εχθρούς,_ ειδοποιώντας τους για τη θέση σου.
actors.buffs.ascensionchallenge.desc_clear=Η σκοτεινή ενέργεια που ακτινοβολεί από το φυλαχτό έχει αποδυναμωθεί όσο το δυνατόν περισσότερο προς το παρόν.
actors.buffs.ascensionchallenge.desc_damage=Η ενέργεια από το φυλαχτό έχει γίνει τόσο δυνατή που _σε βλάπτει άμεσα!_
actors.buffs.ascensionchallenge.desc_haste=Το φυλαχτό αυτή τη στιγμή _επισπεύδει τους μακρινούς εχθρούς,_ επιτρέποντάς τους να σε φτάσουν πιο γρήγορα!
actors.buffs.ascensionchallenge.desc_slow=Το φυλαχτό αυτή τη στιγμή _σε επιβραδύνει_ και ακυρώνει τα εφέ ενίσχυσης ταχύτητας!
actors.buffs.ascensionchallenge.haste=Το φυλαχτό αρχίζει να επιταχύνει τους μακρινούς εχθρούς!
actors.buffs.ascensionchallenge.name=κατάρα του φυλακτού
actors.buffs.ascensionchallenge.on_kill=Η σκοτεινή ενέργεια σε καταβροχθίζει...
actors.buffs.ascensionchallenge.slow=Το φυλαχτό αρχίζει να μοιάζει με μολύβδινο βάρος στο απόθεμά σας!
actors.buffs.ascensionchallenge.weaken=Μπορείς να νιώσεις την κατάρα του φυλαχτού να εξασθενεί ελαφρώς.
actors.buffs.ascensionchallenge.weaken_info=Η κατάρα του φυλαχτού μπορεί να αποδυναμωθεί νικώντας περισσότερους εχθρούς.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Αν νικήσεις τους εχθρούς, η κατάρα του φυλαχτού θα εξασθενήσει!
actors.buffs.barkskin.desc=Το δέρμα σας είναι σκληρυμένο, το νιώθετε τραχύ και συμπαγές σαν φλοιός ξύλου.\n\nΤο σκληρυμένο δέρμα αυξάνει την αποτελεσματική σας θωράκιση, επιτρέποντάς σας να αμύνεστε καλύτερα ενάντια σε σωματικές επιθέσεις.\n\nΗ θωράκισή σας αυτή τη στιγμή αυξάνεται κατά: 0-%d.\nΣτρέφεται μέχρι το φλοιό δέρματος να αποδυναμωθεί: %s.\n\nΕάν λάβετε φλοιό δέρματος από πολλές πηγές, θα εφαρμοστεί μόνο η ισχυρότερη.
actors.buffs.barkskin.name=φλοιός
actors.buffs.barrier.desc=Μια ανθεκτική φυσαλίδα δύναμης που μπλοκάρει κάθε ζημιά.\n\nΤο φράγμα θα δεχτεί ζημιά για ό,τι προστατεύει, εφόσον απομένει θωράκιση. Η θωράκιση θα φθείρεται επίσης αργά με την πάροδο του χρόνου.\n\nΥπόλοιπη θωράκιση: %d.
actors.buffs.barrier.name=εμπόδιο
actors.buffs.berserk.action_name=Εξω φρενών
actors.buffs.berserk.angered=θυμωμένος
actors.buffs.berserk.angered_desc=Η σοβαρότητα των τραυματισμών του Berserker ενισχύει τα χτυπήματά του. Καθώς ο Berserker δέχεται σωματική ζημιά, η οργή του θα αυξάνεται, δίνοντάς του επιπλέον ζημιά. Η ζημιά που μπλοκάρεται από την πανοπλία εξακολουθεί να μετράει για την αύξηση της οργής.\n\nΗ οργή θα εξασθενεί με την πάροδο του χρόνου. Όσο χαμηλότερη είναι η υγεία του Berserker, τόσο περισσότερο θα διαρκέσει.\n\nΜε οργή 100%%, ο Berserker μπορεί να γίνει μανιώδης, δίνοντάς του θωράκιση με βάση το επίπεδο της πανοπλίας του και τη ζωή που του λείπει. Ενώ βρίσκεται σε έξαλλη κατάσταση, η ασπίδα του φθίνει με την πάροδο του χρόνου και μόλις εξαντληθεί, θα πρέπει να ξεκουραστεί πριν ξαναχτίσει οργή.\n\nΤρέχουσα Οργή: _%1$.0f%%_\n_+%2$.0f%%_ ζημιά\n\nΑσπίδα Έξαφνου στην τρέχουσα θωράκιση και Ζωή: _%3$d_
actors.buffs.berserk.berserk=μαινόμενος
actors.buffs.berserk.berserk_desc=Ο φόβος και η αβεβαιότητα εξαφανίζονται, αφήνοντας μόνο θυμό. Σε αυτήν την κατάσταση, ο Berserker είναι εξαιρετικά ισχυρός, _προκαλώντας +50%% ζημιά και κερδίζοντας επιπλέον θωράκιση,_ αλλά χάνοντας επίσης θωράκιση σε κάθε γύρο.\n\nΌταν όλη η θωράκισή του μειωθεί στο 0, το berserking θα τελειώσει.\n\nΑφού οργιστεί, ο Berserker θα πρέπει να ανακάμψει πριν μπορέσει να χτίσει ξανά οργή.\n\nΥπόλοιπη ασπίδα: %d
actors.buffs.berserk.exhausted=εξαντλημένος
actors.buffs.berserk.no_seal=Χρειάζεσαι τη σπασμένη σφραγίδα σου για να τρελαθείς!
actors.buffs.berserk.rankings_desc=Έξαλλος μέχρι θανάτου
actors.buffs.berserk.recovering=αναρρώνω
actors.buffs.berserk.recovering_desc=Η εσωτερική δύναμη έχει τα όριά της. Ο Berserker πρέπει να ξεκουραστεί πριν χρησιμοποιήσει ξανά την οργή του. \n\n Κατά την ανάκαμψη, ο Berserker δεν συσσωρεύει οργή από το να δέχεται ζημιά.
actors.buffs.berserk.recovering_desc_levels=Επίπεδα μέχρι την ανάκτηση: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Γυρίζει μέχρι να ανακτηθεί: _%d_
actors.buffs.bleeding.desc=Αυτή η πληγή διαρρέει μια ανησυχητική ποσότητα αίματος. \n\nΗ αιμορραγία προκαλεί ζημιά σε κάθε στροφή. Σε κάθε στροφή η ζημιά μειώνεται κατά ένα τυχαίο ποσό, μέχρι να σταματήσει τελικά η αιμορραγία. \n\nΤρέχουσα ζημιά αιμορραγίας: %d.
actors.buffs.bleeding.heromsg=Αιμορραγείς!
actors.buffs.bleeding.name=αιμορραγία
actors.buffs.bleeding.ondeath=Αιμορραγούσες μέχρι θανάτου...
actors.buffs.bleeding.rankings_desc=Αιμορραγώντας μέχρι θανάτου
actors.buffs.bless.desc=Μια μεγάλη έκρηξη εστίασης, μερικοί λένε ότι είναι εμπνευσμένη από τους θεούς.\n\nΗ ευλογία αυξάνει την ακρίβεια και την αποφυγή κατά 25%%, καθιστώντας τον ευλογημένο πολύ πιο αποτελεσματικό στη μάχη.\n\nΥπόλοιπες στροφές του ευλογημένου: %s.
actors.buffs.bless.name=ευλογημένος
actors.buffs.blindness.desc=Η τύφλωση μετατρέπει τον περιβάλλοντα κόσμο σε μια σκοτεινή ομίχλη.\n\nΕνώ είναι τυφλωμένος, το οπτικό εύρος ενός χαρακτήρα μειώνεται σε ένα πλακίδιο, καθιστώντας τις επιθέσεις από απόσταση άχρηστες και καθιστώντας πολύ εύκολο να χάσετε τα ίχνη των μακρινών εχθρών. Επιπλέον, ένας τυφλωμένος ήρωας δεν μπορεί να διαβάσει πάπυρους ή βιβλία.\n\nΣτροφές τύφλωσης που απομένουν: %s.
actors.buffs.blindness.heromsg=Είσαι τυφλωμένος/η!
actors.buffs.blindness.name=τυφλωμένος
actors.buffs.blobimmunity.desc=Κάποια παράξενη δύναμη σε τυλίγει σε ένα λεπτό προστατευτικό φράγμα, μπλοκάροντας όλες τις επιβλαβείς αερομεταφερόμενες επιδράσεις.\n\nΕίσαι άτρωτος σε όλες τις επιδράσεις που σχετίζονται με την περιοχή όσο διαρκεί αυτό το φράγμα.\n\nΑύξηση της υπολειπόμενης ανοσίας: %s.
actors.buffs.blobimmunity.name=φράγμα καθαρισμού
actors.buffs.burning.burnsup=%s καίγεται!
actors.buffs.burning.desc=Λίγα πράγματα είναι πιο οδυνηρά από το να σε τυλίγουν οι φλόγες.\n\nΗ φωτιά θα προκαλεί ζημιά σε κάθε γύρο μέχρι να σβήσει από νερό ή να εκπνεύσει. Η φωτιά μπορεί να σβήσει μπαίνοντας στο νερό ή από την πιτσιλιά ενός θρυμματιστικού φίλτρου.\n\nΕπιπλέον, η φωτιά μπορεί να αναφλέξει εύφλεκτο έδαφος ή αντικείμενα με τα οποία έρχεται σε επαφή.\n\nΣτροφές καύσης που απομένουν: %s.
actors.buffs.burning.heromsg=Παίρνεις φωτιά!
actors.buffs.burning.name=καύση
actors.buffs.burning.ondeath=Κάηκες μέχρι θανάτου...
actors.buffs.burning.rankings_desc=Καμένη σε στάχτη
actors.buffs.championenemy$antimagic.desc=Οι αντιμαγικοί πρωταθλητές δέχονται 50% λιγότερη ζημιά και είναι εντελώς άτρωτοι στις μαγικές επιδράσεις.
actors.buffs.championenemy$antimagic.name=πρωταθλητής κατά της μαγείας
actors.buffs.championenemy$blazing.desc=Οι φλεγόμενοι ήρωες προκαλούν 25% περισσότερη ζημιά από κοντά, πυροδοτούν τους εχθρούς στους οποίους επιτίθενται, είναι άτρωτοι στη φωτιά και απλώνουν φωτιά γύρω τους καθώς πεθαίνουν. Ωστόσο, δεν μπορούν να απλώσουν φωτιά στο νερό.
actors.buffs.championenemy$blazing.name=φλεγόμενος πρωταθλητής
actors.buffs.championenemy$blessed.desc=Οι ευλογημένοι πρωταθλητές έχουν 4x ακρίβεια και αποφυγή.
actors.buffs.championenemy$blessed.name=ευλογημένος πρωταθλητής
actors.buffs.championenemy$giant.desc=Οι Γίγαντες Ήρωες δέχονται 80% λιγότερη ζημιά και έχουν +1 εμβέλεια επίθεσης, αλλά δεν μπορούν να κινηθούν μέσα από κλειστούς χώρους.
actors.buffs.championenemy$giant.name=γίγαντας πρωταθλητής
actors.buffs.championenemy$growing.desc=Οι αναπτυσσόμενοι πρωταθλητές κερδίζουν ένα σταθερά αυξανόμενο μπόνους στην ακρίβεια, την αποφυγή, τη φυσική ζημιά και μια μείωση στη ζημιά που δέχονται.\n\nΤρέχουσα ενίσχυση acc/eva/damg: %1$d%%\nΤρέχουσα μείωση ζημιάς: %2$d%%
actors.buffs.championenemy$growing.name=αναπτυσσόμενος πρωταθλητής
actors.buffs.championenemy$projecting.desc=Οι προβαλλόμενοι ήρωες προκαλούν 25% περισσότερη ζημιά από κοντά και έχουν εμβέλεια επίθεσης +3.
actors.buffs.championenemy$projecting.name=προβαλλόμενος πρωταθλητής
actors.buffs.championenemy.warn=Νιώθεις μια θανατηφόρα παρουσία.
actors.buffs.charm.cant_attack=Είσαι γοητευμένος από αυτόν τον εχθρό και δεν μπορείς να του επιτεθείς.
actors.buffs.charm.desc=Ένα φυλαχτό είναι μια χειριστική μαγεία που μπορεί να κάνει τους εχθρούς να λατρέψουν προσωρινά ο ένας τον άλλον.\n\nΟι χαρακτήρες που επηρεάζονται από τη γοητεία δεν μπορούν να επιτεθούν άμεσα στον εχθρό που τους γοητεύει. Η επίθεση σε άλλους στόχους εξακολουθεί να είναι δυνατή. Το σοκ του πόνου θα μειώσει τη διάρκεια της γοητείας.\n\nΥπόλοιπη σειρά γοητείας: %s.
actors.buffs.charm.heromsg=Είσαι μαγεμένος/η!
actors.buffs.charm.name=μαγεμένος
actors.buffs.chill.desc=Δεν είναι εντελώς παγωμένο, αλλά εξακολουθεί να είναι πολύ κρύο.\n\nΟι ψυχροί στόχοι εκτελούν όλες τις ενέργειες πιο αργά, ανάλογα με τον αριθμό των στροφών που απομένουν στο εφέ. Στη χειρότερη περίπτωση, αυτό ισοδυναμεί με επιβράδυνση.\n\nΥπόλοιπες στροφές ψύξης: %1$s.\nΗ ταχύτητα μειώνεται κατά: %2$s%%
actors.buffs.chill.freezes=Το %s παγώνει!
actors.buffs.chill.name=κατεψυγμένο
actors.buffs.combo$combomove.clobber.desc=Ρίχνει έναν εχθρό πίσω 2 πλακίδια, αλλά δεν προκαλεί ζημιά και δεν μπορεί να ρίξει σε λάκκους. Αυξάνει τον συνδυασμό κατά 1.
actors.buffs.combo$combomove.clobber.empower_desc=Ρίχνει έναν εχθρό προς τα πίσω _3 πλακίδια, προκαλεί ίλιγγο και μπορεί να χτυπήσει σε λάκκους,_ αλλά δεν προκαλεί ζημιά. Αυξάνει τον συνδυασμό κατά 1.
actors.buffs.combo$combomove.clobber.name=κοπανάω
actors.buffs.combo$combomove.crush.desc=Προκαλεί ζημιά %d%% (συνδυασμός*25%%) στον κύριο στόχο και τη μισή ζημιά σε όλους τους άλλους εχθρούς σε ένα AOE 7x7. Επαναφέρει τον συνδυασμό όταν χρησιμοποιείται.
actors.buffs.combo$combomove.crush.empower_desc=_Αυξάνεται σε πλακίδιο(α) %1$d_ και προκαλεί ζημιά %2$d%% (συνδυασμός*25%%) στον κύριο στόχο και τη μισή ζημιά σε όλους τους άλλους εχθρούς σε ένα AOE 7x7. Επαναφέρει τον συνδυασμό όταν χρησιμοποιείται.
actors.buffs.combo$combomove.crush.name=συντριβή
actors.buffs.combo$combomove.fury.desc=Χτυπάει έναν εχθρό μία φορά για κάθε συνδυασμό που έχεις. Κάθε χτύπημα προκαλεί 60% ζημιά και μπορεί να ενεργοποιήσει μαγικά. Επαναφέρει τον συνδυασμό όταν χρησιμοποιείται.
actors.buffs.combo$combomove.fury.empower_desc=_Πηδάει μέχρι το πλακίδιο(α) %d_ και χτυπάει έναν εχθρό μία φορά για κάθε συνδυασμό που έχεις. Κάθε χτύπημα προκαλεί ζημιά 60%% και μπορεί να ενεργοποιήσει μαγικά. Επαναφέρει τον συνδυασμό όταν χρησιμοποιείται.
actors.buffs.combo$combomove.fury.name=μανία
actors.buffs.combo$combomove.parry.desc=Μπλοκάρει την επόμενη επίθεση εντός 1 γύρου όταν ενεργοποιηθεί και ανταποδίδει αμέσως. Επαναφέρει τον συνδυασμό αν δεν αποκρουστεί τίποτα.
actors.buffs.combo$combomove.parry.empower_desc=Μπλοκάρει _όλες τις επιθέσεις_ εντός 1 γύρου όταν ενεργοποιηθεί και ανταποδίδει άμεσα. Επαναφέρει τον συνδυασμό αν δεν αποκρουστεί καμία.
actors.buffs.combo$combomove.parry.name=αποφεύγω
actors.buffs.combo$combomove.slam.desc=Προσφέρει %d%% (συνδυασμός*20%%) της ισχύος μπλοκαρίσματος ζημιάς σας ως επιπλέον ζημιά. Επαναφέρει τον συνδυασμό όταν χρησιμοποιείται.
actors.buffs.combo$combomove.slam.empower_desc=_Αυξάνεται στα πλακίδια %1$d_ και προκαλεί %2$d%% (συνδυασμός*20%%) της ισχύος μπλοκαρίσματος ζημιάς σας ως επιπλέον ζημιά. Επαναφέρει τον συνδυασμό όταν χρησιμοποιείται.
actors.buffs.combo$combomove.slam.name=χτύπημα
actors.buffs.combo.action_name=συνδυαστική επίθεση
actors.buffs.combo.bad_target=Πρέπει να στοχεύσετε έναν εχθρό σε εμβέλεια επίθεσης.
actors.buffs.combo.combo=%d επιτυχημένος συνδυασμός!
actors.buffs.combo.desc=Ο μονομάχος αυξάνει την ορμή του καθώς πετυχαίνει επιτυχημένα χτυπήματα. Κάθε επίθεση αυξάνει τον μετρητή συνδυασμών κατά ένα, αλλά η καθυστέρηση μεταξύ των χτυπημάτων θα τον επαναφέρει στο 0. Ενώ ο μονομάχος έχει συνδυασμό, οποιαδήποτε θωράκιση που έχει από τη σπασμένη σφραγίδα του δεν θα αρχίσει να εξασθενεί.\n\nΗ κατασκευή συνδυασμού ξεκλειδώνει ειδικές συνδυαστικές επιθέσεις που δεν πρέπει να αστοχήσουν! Μια διαφορετική επίθεση ξεκλειδώνεται στους συνδυασμούς 2, 4, 6, 8 και 10. Ορισμένες κινήσεις επαναφέρουν τον συνδυασμό και άλλες όχι, αλλά κάθε κίνηση μπορεί να χρησιμοποιηθεί μόνο μία φορά ανά συνεδρία συνδυασμού.\n\nΤρέχων συνδυασμός: %1$d.\n\nΓυρίζει μέχρι να χαθεί ο συνδυασμός: %2$s.
actors.buffs.combo.name=συνδυασμός
actors.buffs.combo.prompt=Επιλέξτε έναν στόχο για επίθεση.
actors.buffs.corrosion.desc=Ισχυρό οξύ λιώνει σάρκα, μέταλλο και οστά με ανησυχητικό ρυθμό.\n\nΗ ζημιά από τη διάβρωση αυξάνεται με την πάροδο του χρόνου, καθώς ο στόχος συνεχίζει να λιώνει.\n\nΥπόλοιπα φαινόμενα διάβρωσης: %1$s.\nΤρέχουσα ζημιά από τη διάβρωση: %2$d.
actors.buffs.corrosion.heromsg=Λιώνεις!
actors.buffs.corrosion.name=διάβρωση
actors.buffs.corrosion.ondeath=Λιώνεις...
actors.buffs.corrosion.rankings_desc=Διαλυμένο
actors.buffs.corruption.desc=Η διαφθορά διεισδύει στην ουσία ενός όντος, στρεβλώνοντάς το ενάντια στην προηγούμενη φύση του. \n\nΤα διεφθαρμένα πλάσματα θα επιτεθούν στους συμμάχους τους και θα αγνοήσουν τους πρώην εχθρούς τους. Η διαφθορά είναι επίσης καταστροφική και σιγά σιγά θα κάνει τον στόχο της να υποκύψει. \n\nΗ διαφθορά είναι μόνιμη, οι συνέπειές της καταλήγουν μόνο στον θάνατο.
actors.buffs.corruption.name=διεφθαρμένος
actors.buffs.cripple.desc=Είσαι σχεδόν σίγουρος ότι τα πόδια δεν είναι γραφτό να λυγίζουν έτσι.\n\nΤαχύτητα κίνησης των μισών με σακατεμένο άκρο, με αποτέλεσμα η μετακίνηση ενός πλακιδίου να διαρκεί συνήθως δύο γύρους αντί για έναν.\n\nΓύροι του σακατεμένου που απομένουν: %s.
actors.buffs.cripple.heromsg=Είσαι ανάπηρος/η!
actors.buffs.cripple.name=ανάπηρος
actors.buffs.daze.desc=Το βουητό στα αυτιά και η θολή όραση δυσκολεύουν τη μάχη.\n\nΕνώ είστε ζαλισμένοι, η ακρίβεια και η αποφυγή μειώνονται κατά 50%%, καθιστώντας πολύ πιο δύσκολη τόσο την προσγείωση όσο και την αποφυγή χτυπημάτων.\n\nΑπομένουσες στροφές ζάλης: %s.
actors.buffs.daze.heromsg=Είσαι ζαλισμένος/η!
actors.buffs.daze.name=ζαλισμένος
actors.buffs.degrade.desc=Η ισχυρή σκοτεινή μαγεία εξαντλεί τη δύναμη που έχουν εφαρμόσει οι πάπυροι αναβάθμισης στον εξοπλισμό σας!\n\nΕνώ υποβαθμίζεται, ο αναβαθμισμένος εξοπλισμός θα αντιμετωπίζεται σαν να είναι σε χαμηλότερο επίπεδο από ό,τι είναι στην πραγματικότητα. _Κάθε αναβάθμιση μετά το +3 γίνεται εκθετικά ασθενέστερη από την προηγούμενη._ Οι περιγραφές των αντικειμένων σας θα αλλάζουν ώστε να αντικατοπτρίζουν το μειωμένο επίπεδο ισχύος τους.\n\nΗ υποβάθμιση δεν επηρεάζει τις απαιτήσεις δύναμης, τις γομώσεις ραβδιών, την ανθεκτικότητα των εκτοξευόμενων όπλων ή τα αντικείμενα.\n\nΥπόλοιπος κύκλος υποβάθμισης: %s. Η χρήση ενός κυλίνδρου αναβάθμισης ή αφαίρεσης κατάρας θα τερματίσει αμέσως την υποβάθμιση.
actors.buffs.degrade.heromsg=Ο εξοπλισμός σας φαίνεται πιο αδύναμος!
actors.buffs.degrade.name=υποβαθμισμένος
actors.buffs.doom.desc=Είναι δύσκολο να συνεχίσεις όταν φαίνεται ότι το σύμπαν σε θέλει νεκρό.\n\nΟι καταδικασμένοι χαρακτήρες θα λάβουν +67% ζημιά από όλες τις πηγές.\n\nΗ καταστροφή είναι μόνιμη, οι επιπτώσεις της καταλήγουν μόνο σε θάνατο.
actors.buffs.doom.name=καταδικασμένος
actors.buffs.dread.desc=Ένας τρόμος τόσο μεγάλος που θα αναγκάσει τον στόχο του να εγκαταλείψει εντελώς το μπουντρούμι! \n\nΤα πλάσματα που επηρεάζονται από τον τρόμο θα τρέξουν μακριά από τον αντίπαλό τους με μεγάλη ταχύτητα και θα εξαφανιστούν εντελώς από το μπουντρούμι μόλις εξαφανιστούν από το οπτικό τους πεδίο. Οι εχθροί που ηττώνται με αυτόν τον τρόπο απονέμουν μισή εμπειρία και δεν ρίχνουν αντικείμενα. Το σοκ του πόνου θα μειώσει τη διάρκεια του τρόμου.\n\nΣτροφές τρόμου που απομένουν: %d.
actors.buffs.dread.name=φόβος
actors.buffs.drowsy.desc=Μια μαγική δύναμη δυσκολεύει να παραμείνει ξύπνιος. Μετά από μερικούς γύρους, ο στόχος θα πέσει σε βαθύ μαγικό ύπνο. \n\n. Ο ήρωας μπορεί να αντισταθεί στην υπνηλία δεχόμενος ζημιά ή διατηρώντας πλήρη υγεία. \n\n. Γυρίζει μέχρι να κοιμηθεί: %s.
actors.buffs.drowsy.name=μισοκοιμισμένος
actors.buffs.earthimbue.desc=Είσαι διαποτισμένος με τη δύναμη της γης! \n\n Όλες οι φυσικές επιθέσεις θα μετατοπίσουν τη γη κάτω από τον εχθρό, παραλύοντάς τον για μικρό χρονικό διάστημα. \n\n Στροφές της γης που απομένουν: %s.
actors.buffs.earthimbue.name=εμποτισμένο με γη
actors.buffs.enhancedrings.desc=Το πρόσφατα χρησιμοποιημένο τεχνούργημα του Rogue ενδυναμώνει τα δαχτυλίδια του, δίνοντάς τους επίπεδο +1. \n\nΥπολειπόμενοι γύροι: %s.
actors.buffs.enhancedrings.name=ενισχυμένα δαχτυλίδια
actors.buffs.fireimbue.desc=Είσαι εμποτισμένος με τη δύναμη της φωτιάς! \n\nΌλες οι φυσικές επιθέσεις θα έχουν την ευκαιρία να βάλουν φωτιά στους εχθρούς. Επιπλέον, είσαι εντελώς άτρωτος στις επιπτώσεις της φωτιάς.\n\nΣτροφές φωτιάς που απομένουν: %s.
actors.buffs.fireimbue.name=διαποτισμένος με φωτιά
actors.buffs.foresight.desc=Με κάποιο τρόπο μπορείς να δεις τη διάταξη του περιβάλλοντος εδάφους με το μυαλό σου. \n\nΕνώ υπό την επίδραση της προνοητικότητας, όλα τα πλακίδια σε μεγάλη ακτίνα σας αποκαλύπτονται, συμπεριλαμβανομένων τυχόν μυστικών παγίδων ή θυρών. \n\nΣτροφές προνοητικότητας που απομένουν: %s.
actors.buffs.foresight.name=πρόβλεψη
actors.buffs.frost.desc=Δεν πρέπει να συγχέεται με την κατάψυξη στερεού, αυτή η πιο ήπια κατάψυξη απλώς περιβάλλει τον στόχο σε πάγο. \n\nΗ κατάψυξη δρα παρόμοια με την παράλυση, καθιστώντας αδύνατη την δράση του στόχου. Σε αντίθεση με την παράλυση, η κατάψυξη ακυρώνεται αμέσως εάν ο στόχος υποστεί ζημιά, καθώς ο πάγος θα θρυμματιστεί. \n\nΥπόλοιπο πάγου που απομένει: %s.
actors.buffs.frost.freezes=Το %s παγώνει!
actors.buffs.frost.name=παγωμένος
actors.buffs.frostimbue.desc=Είσαι διαποτισμένος με παγωμένη δύναμη! \n\n Όλες οι φυσικές επιθέσεις θα επιβαρύνουν σταθερά τους εχθρούς με ψυχραιμία. Επιπλέον, είσαι εντελώς άτρωτος στο κρύο.\n\n Οι στροφές του παγετού που απομένουν σας διαποτίζουν με: %s.
actors.buffs.frostimbue.name=εμποτισμένο με παγετό
actors.buffs.fury.desc=Είσαι θυμωμένος, οι εχθροί δεν θα σε συμπαθήσουν όταν είσαι θυμωμένος.\n\nA Μεγάλη οργή καίει μέσα σου, αυξάνοντας τη ζημιά που αντιμετωπίζεις με σωματικές επιθέσεις κατά 50%%.\n\n Αυτή η οργή θα διαρκέσει για όσο διάστημα είσαι τραυματισμένος κάτω από 50%% ζωή.
actors.buffs.fury.heromsg=Γίνεσαι έξαλλος! (or) Γίνεσαι έξαλλος!
actors.buffs.fury.name=έξαλλος
actors.buffs.gravitychaostracker.desc_duration=Δεν είναι σαφές πόσο καιρό θα διαρκέσει το αποτέλεσμα, αλλά δεν μπορεί να διαρκέσει για πάντα.
actors.buffs.gravitychaostracker.desc_intro=Κάθε λίγες στροφές, όλοι οι χαρακτήρες στο τρέχον μπουντρούμι θα πετάγονται σε τυχαία κατεύθυνση.
actors.buffs.gravitychaostracker.desc_positive=Εσύ και οι σύμμαχοί σου φαίνεται να είστε άτρωτοι, ωστόσο.
actors.buffs.gravitychaostracker.name=χάος βαρύτητας
actors.buffs.greaterhaste.desc=Μια απίστευτη αύξηση ταχύτητας, για μια στιγμή νιώθεις σαν όλα τα άλλα να έχουν μείνει ακίνητα. \n\n Ενώ βρίσκονται υπό την επίδραση μεγαλύτερης βιασύνης, οι κινήσεις δεν χρειάζονται καθόλου χρόνο, αλλά άλλες ενέργειες εκτελούνται με κανονική ταχύτητα. Κάθε βήμα κίνησης καταναλώνει μια στροφή μεγαλύτερης βιασύνης. \n\nΣτροφές μεγαλύτερης βιασύνης που απομένουν: %d.
actors.buffs.greaterhaste.name=μεγαλύτερη βιασύνη
actors.buffs.haste.desc=Η ενέργεια ρέει μέσα από τους μύες σας, επιτρέποντάς σας να τρέχετε με απίστευτες ταχύτητες! \n\n Ενώ βρίσκεστε υπό την επίδραση της βιασύνης, θα τρέχετε με 3 φορές ταχύτητα, αλλά θα εκτελείτε όλες τις άλλες ενέργειες με κανονική ταχύτητα. \n\nΥπολειπόμενες στροφές βιασύνης: %s.
actors.buffs.haste.name=βιασύνη
actors.buffs.healing.desc=Ένα μαγικό φάρμακο κάνει τις πληγές να κλείνουν και τη σάρκα να δένει.\n\nΗ υγεία σε κάθε γύρο θα αναγεννάται σταθερά μέχρι να λήξει η θεραπευτική επίδραση. Η ποσότητα θεραπείας μπορεί να εξασθενίσει με την πάροδο του χρόνου.\n\nΕπόμενη θεραπεία: %d.\n\nΥπόλοιπο θεραπείας: %d.
actors.buffs.healing.name=φαρμακευτικός
actors.buffs.herodisguise.desc=Η απατηλή μαγεία έχει αλλάξει τη φυσική σου εμφάνιση! Το αποτέλεσμα είναι καθαρά αισθητικό, αλλά ανεξάρτητα από αυτό, σου φαίνεται πολύ παράξενο.\n\nΣτροφές μεταμφίεσης που απομένουν: %s.
actors.buffs.herodisguise.name=μεταμφίεση
actors.buffs.hex.desc=Σκοτεινή μαγεία που μειώνει την εστίαση, με αποτέλεσμα ο στόχος να αποπροσανατολίζεται ελαφρώς.\n\nΗ εξάγωνη βολή μειώνει την ακρίβεια και την αποφυγή κατά 20%%, καθιστώντας τον στόχο λιγότερο αποτελεσματικό στη μάχη.\n\nΥπόλοιπες στροφές εξαγώνου: %s.
actors.buffs.hex.heromsg=Σε έχουν κοροϊδέψει!
actors.buffs.hex.name=εξαγωνικός
actors.buffs.holdfast.desc=Ο Πολεμιστής διατηρεί τη θέση του, αυξάνοντας την πανοπλία του κατά %1$d-%2$d και επιβραδύνοντας τον ρυθμό μείωσης ορισμένων ενισχύσεων κατά %3$d%%. Αυτό θα διαρκέσει μέχρι να κινηθεί.
actors.buffs.holdfast.name=κρατήσου γερά
actors.buffs.hunger.cursedhorn=Το καταραμένο κέρατο κλέβει μέρος της ενέργειας της τροφής καθώς τρως.
actors.buffs.hunger.desc=Η πείνα αυξάνεται σιγά σιγά καθώς περνάτε χρόνο στο μπουντρούμι, και τελικά θα αρχίσετε να λιμοκτονείτε. Ενώ λιμοκτονείτε, θα χάνετε σιγά σιγά την υγεία σας αντί να την αναγεννάτε.\n\nΗ διαχείριση με δελτίο είναι σημαντική! Αν έχετε υγεία που σας περισσεύει, η πείνα δεν είναι κακή ιδέα, αν αυτό σημαίνει ότι θα υπάρχει περισσότερο φαγητό αργότερα. Η αποτελεσματική διαχείριση με δελτίο μπορεί να κάνει το φαγητό να διαρκέσει πολύ περισσότερο!
actors.buffs.hunger.desc_intro_hungry=Μπορείς να νιώσεις το στομάχι σου να ζητάει φαγητό, αλλά δεν είναι ακόμα πολύ επείγον.
actors.buffs.hunger.desc_intro_starving=Πεινάς τόσο πολύ που πονάς.
actors.buffs.hunger.hungry=πεινασμένος
actors.buffs.hunger.ondeath=Πέθανε από την πείνα...
actors.buffs.hunger.onhungry=Πεινάς.
actors.buffs.hunger.onstarving=Πεινάς!
actors.buffs.hunger.rankings_desc=Πέθανε από την πείνα
actors.buffs.hunger.starving=λιμοκτονώ
actors.buffs.invisibility.desc=Είσαι εντελώς αναμεμειγμένος με το περιβάλλον έδαφος, καθιστώντας αδύνατο να σε δεις.\n\nΕνώ είσαι αόρατος, οι εχθροί δεν μπορούν να σε επιτεθούν ή να σε ακολουθήσουν. Οι φυσικές επιθέσεις και τα μαγικά εφέ (όπως πάπυροι και ραβδιά) θα ακυρώσουν αμέσως την αορατότητά σου.\n\nΥπολειπόμενες στροφές αορατότητας: %s.
actors.buffs.invisibility.name=αόρατος
actors.buffs.invulnerability.desc=Αυτός ο χαρακτήρας είναι διαποτισμένος με μεγάλη προστατευτική δύναμη, που του παρέχει μια σύντομη περίοδο άτρωτου! \n\nΥπολειπόμενοι γύροι: %s.
actors.buffs.invulnerability.name=άτρωτος
actors.buffs.levitation.desc=Μια μαγική δύναμη σε αιωρεί πάνω από το έδαφος, κάνοντάς σε να νιώθεις χωρίς βάρος.\n\nΟι αιωρούμενοι χαρακτήρες κινούνται σιωπηλά και αγνοούν όλα τα εφέ που βρίσκονται στο έδαφος. Οι παγίδες δεν θα ενεργοποιηθούν, το νερό δεν θα σβήσει τη φωτιά, τα φυτά δεν θα ποδοπατηθούν, οι ρίζες θα χάσουν την όρασή τους και οι λάκκοι θα περάσουν από πάνω. Να είσαι προσεκτικός, καθώς όλα αυτά μπορούν να τεθούν σε ισχύ τη στιγμή που τελειώνει η αιώρηση!\n\nΑπομένουσες στροφές αιώρησης: %s.
actors.buffs.levitation.name=αιωρούμενος
actors.buffs.lifelink.desc=Η ζωτική δύναμη αυτού του χαρακτήρα συνδέεται με έναν άλλο χαρακτήρα που βρίσκεται κοντά. Οποιαδήποτε ζημιά δεχτεί μοιράζεται μεταξύ τους.\n\nΌποτε αυτός ο χαρακτήρας δέχεται ζημιά, η μισή της θα λαμβάνεται στον στόχο του συνδέσμου ζωής.\n\nΥπόλοιπος κύκλος συνδέσμου ζωής: %s.
actors.buffs.lifelink.name=κρίκος ζωής
actors.buffs.lifelink.ondeath=Η ζημιά που συνδέεται με τη ζωή σε σκότωσε...
actors.buffs.light.desc=Ακόμα και στο πιο σκοτεινό μπουντρούμι, ένα σταθερό φως στο πλευρό σας είναι πάντα παρήγορο. \n\nΤο φως βοηθά στην απομάκρυνση του σκοταδιού, επιτρέποντάς σας να βλέπετε σε λογική απόσταση ανεξάρτητα από το περιβάλλον. \n\nΥπόλοιπο φωτισμού: %s.
actors.buffs.light.name=φωτεινός
actors.buffs.lockedfloor.desc=Ο τρέχων όροφος είναι κλειδωμένος και δεν μπορείτε να τον αφήσετε!\n\nΕνώ ένας όροφος είναι κλειδωμένος, δεν θα πεινάσετε ούτε θα δεχθείτε ζημιά από την πείνα. Επιπλέον, αν δεν εργαστείτε για να νικήσετε τον αρχηγό αυτού του ορόφου, τα εφέ παθητικής αναγέννησης θα σταματήσουν επίσης.\n\nΕπιπλέον, αν αναβιώσετε από ένα μη ευλογημένο ankh ενώ ο όροφος είναι κλειδωμένος, τότε θα γίνει επαναφορά.\n\nΣκοτώστε τον αρχηγό αυτού του ορόφου για να σπάσετε την κλειδαριά.
actors.buffs.lockedfloor.name=το πάτωμα είναι κλειδωμένο
actors.buffs.lostinventory.desc=Το απόθεμά σου χάθηκε κάπου στο μπουντρούμι! Δεν θα μπορείς να μαζέψεις ή να χρησιμοποιήσεις τα περισσότερα αντικείμενα μέχρι να τα ανακτήσεις.
actors.buffs.lostinventory.name=χαμένο απόθεμα
actors.buffs.magicalsight.desc=Με κάποιο τρόπο μπορείς να βλέπεις με το μυαλό σου, αντί για τα μάτια σου. \n\nΕνώ η μαγική όραση είναι ενεργή, θα μπορείς να βλέπεις σε όλο το έδαφος σε ακτίνα 12 πλακιδίων. \n\nΣτροφές μαγικής όρασης που απομένουν: %s.
actors.buffs.magicalsight.name=μαγικό θέαμα
actors.buffs.magicalsleep.desc=Αυτός ο χαρακτήρας έχει πέσει σε έναν βαθύ μαγικό ύπνο από τον οποίο δεν θα ξυπνήσει φυσικά.\n\nΟ μαγικός ύπνος είναι παρόμοιος με τον κανονικό ύπνο, εκτός από το ότι μόνο η ζημιά θα προκαλέσει ξύπνημα στον στόχο.\n\nΓια τον ήρωα και τους συμμάχους του, ο μαγικός ύπνος έχει κάποιες αναζωογονητικές ιδιότητες, επιτρέποντάς τους να επουλώνονται γρήγορα ενώ ξεκουράζονται.
actors.buffs.magicalsleep.fallasleep=Πέφτεις σε έναν βαθύ μαγικό ύπνο.
actors.buffs.magicalsleep.name=μαγικός ύπνος
actors.buffs.magicalsleep.toohealthy=Είσαι πολύ υγιής και αντιστέκεσαι στην επιθυμία για ύπνο.
actors.buffs.magicalsleep.wakeup=Ξυπνάς νιώθοντας ανανεωμένος και υγιής.
actors.buffs.magicimmune.desc=Όλα τα μαγικά εφέ έχουν χάσει την επιρροή τους πάνω σας, είστε εντελώς απρόσβλητοι από αυτά.\n\nΕνώ είναι μαγικά άτρωτα, όλα τα επιβλαβή και χρήσιμα μαγικά εφέ δεν θα ισχύουν για εσάς, συμπεριλαμβανομένων των κατάρων, των μαγικών ραβδιών, των παπύρων, των δαχτυλιδιών, των αντικειμένων κ.λπ. Οι ικανότητες της ηρωικής πανοπλίας είναι αρκετά ισχυρές για να λειτουργήσουν ανεξάρτητα από αυτό το εφέ.\n\nΑπομένουσες στροφές μαγικής ασυλίας: %s.
actors.buffs.magicimmune.name=άτρωτος στη μαγεία
actors.buffs.mindvision.desc=Κατά κάποιο τρόπο, μπορείς να δεις όλα τα πλάσματα σε αυτόν τον όροφο μέσα από το μυαλό σου. Είναι ένα περίεργο συναίσθημα. \n\nΌλοι οι χαρακτήρες σε αυτόν τον όροφο είναι ορατοί σε εσένα, αρκεί να έχεις νοητική όραση. Το να βλέπεις ένα πλάσμα μέσα από τη νοητική όραση μετράει ως ορατό ή κοντά του για τους σκοπούς πολλών μαγικών εφέ.\n\nΥπόλοιπο όρασης στροφών του νου: %s.
actors.buffs.mindvision.name=όραση του μυαλού
actors.buffs.momentum.action_name=ελεύθερο τρέξιμο
actors.buffs.momentum.momentum=οικοδόμηση ορμής
actors.buffs.momentum.momentum_desc=Καθώς κινείται, ο Freerunner δημιουργεί ορμή, την οποία μπορεί να ξοδέψει για να ξεκινήσει το freerunning.\n\nΚάθε φορτίο ορμής δίνει δύο γύρους freerunning και ο Freerunner μπορεί να δημιουργήσει έως και 10 φορτίσεις. Η ορμή χάνεται γρήγορα όταν ο Freerunner σταματά να κινείται.\n\nΤρέχον φορτίο ορμής: %d.
actors.buffs.momentum.resting=αναρρώνω
actors.buffs.momentum.resting_desc=Καθώς κινείται, ο Freerunner αναπτύσσει ορμή, την οποία μπορεί να ξοδέψει για να ξεκινήσει το freerunning.\n\nΟ Freerunner χρειάζεται χρόνο για να ανακτήσει την αντοχή του πριν αναπτύξει ξανά ορμή.\n\nΣτροφές που απομένουν: %d.
actors.buffs.momentum.running=ελεύθερο τρέξιμο
actors.buffs.momentum.running_desc=Καθώς κινείται, ο Freerunner δημιουργεί ορμή, την οποία μπορεί να ξοδέψει για να ξεκινήσει το freerunning.\n\nΕνώ τρέχει freerunning, ο Freerunner κινείται με διπλάσια ταχύτητα και κερδίζει μπόνους αποφυγής με βάση το επίπεδό του.\n\nΣτροφές που απομένουν: %d.
actors.buffs.monkenergy$monkability$dash.desc=Μια άμεση ορμή σε απόσταση έως και 4 πλακιδίων. Αυτή η ικανότητα μπορεί να περάσει πάνω από κινδύνους, αλλά όχι μέσα από εχθρούς ή συμπαγές έδαφος.
actors.buffs.monkenergy$monkability$dash.empower_desc=Μια άμεση ορμή έως _8 πλακίδια_ μακριά. Αυτή η ικανότητα μπορεί να περάσει πάνω από κινδύνους, αλλά όχι μέσα από εχθρούς ή συμπαγές έδαφος.
actors.buffs.monkenergy$monkability$dash.name=παύλα
actors.buffs.monkenergy$monkability$dash.prompt=Επιλέξτε μια τοποθεσία
actors.buffs.monkenergy$monkability$dragonkick.desc=Ένα καταστροφικό λάκτισμα που προκαλεί ζημιά %1$d-%2$d και αγνοεί την πανοπλία. Το λάκτισμα ρίχνει τον στόχο μακριά και τον παραλύει για κάθε πλακίδιο που μετακινεί.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Ένα καταστροφικό λάκτισμα που προκαλεί _%1$d-%2$d ζημιά_ και αγνοεί την πανοπλία. Το λάκτισμα ρίχνει _όλους τους γειτονικούς στόχους_ μακριά και τους παραλύει για κάθε πλακίδιο που μετακινούν.
actors.buffs.monkenergy$monkability$dragonkick.name=κλωτσιά δράκου
actors.buffs.monkenergy$monkability$flurry.desc=Δύο άμεσα χτυπήματα που προκαλούν ζημιά %1$d-%2$d και αγνοούν την θωράκιση. Αυτή η ικανότητα δεν μπορεί να χρησιμοποιηθεί επανειλημμένα.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Δύο άμεσα χτυπήματα που προκαλούν ζημιά %1$d-%2$d, αγνοούν την πανοπλία _και χρησιμοποιούν τη γοητεία του όπλου σας._ Αυτή η ικανότητα δεν μπορεί να χρησιμοποιηθεί επανειλημμένα.
actors.buffs.monkenergy$monkability$flurry.name=καταιγίδα χτυπημάτων
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Η Μοναχός είναι συγκεντρωμένη στο περιβάλλον της, προσβλέποντας στην επόμενη επίθεση εναντίον της. Ενώ είναι συγκεντρωμένη, είναι εγγυημένο ότι θα αποκρούσει την επόμενη εισερχόμενη επίθεση.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=εστιασμένος
actors.buffs.monkenergy$monkability$focus.desc=Ο Μοναχός κάνει μια στροφή για να συγκεντρωθεί, αφήνοντάς την να αποκρούσει την επόμενη επίθεση εναντίον της.
actors.buffs.monkenergy$monkability$focus.empower_desc=Ο Μοναχός _αμέσως εστιάζει,_ αφήνοντάς την να αποκρούσει την επόμενη επίθεση εναντίον της.
actors.buffs.monkenergy$monkability$focus.name=εστία
actors.buffs.monkenergy$monkability$meditate.desc=Ο Μοναχός εστιάζει την ενέργεια στο σώμα της για 5 γύρους. Αυτό καθαρίζει τις περισσότερες αρνητικές επιπτώσεις και της δίνει 8 γύρους επαναφόρτισης ραβδιού και τεχνουργημάτων.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Ο Μοναχός εστιάζει την ενέργεια στο σώμα της για 5 γύρους. Αυτό εξαλείφει τις περισσότερες αρνητικές επιπτώσεις και της δίνει 8 γύρους επαναφόρτισης ραβδιού και τεχνουργημάτων. _Αποκτά επίσης 80% αντοχή στη ζημιά κατά τον διαλογισμό και θεραπεύεται αργά για το 20% της HP που της λείπει._
actors.buffs.monkenergy$monkability$meditate.name=σκέπτομαι
actors.buffs.monkenergy.action=Ικανότητες Μοναχού
actors.buffs.monkenergy.desc=Καθώς νικάει εχθρούς, η Μοναχός αποκτά ενέργεια που μπορεί να χρησιμοποιήσει σε μια ποικιλία ικανοτήτων. Οι περισσότεροι εχθροί δίνουν 1 ενέργεια όταν ηττηθεί και η Μοναχός δεν χάνει ενέργεια με την πάροδο του χρόνου.\n\nΤρέχουσα ενέργεια: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Ο Μοναχός χρησιμοποίησε πρόσφατα μια ικανότητα και πρέπει να περιμένει πριν χρησιμοποιήσει μια άλλη.\n\nΤρέχων χρόνος αναμονής: Γυρίζει ο %d.
actors.buffs.monkenergy.name=ενέργεια
actors.buffs.ooze.desc=Αυτό το κολλώδες οξύ προσκολλάται στη σάρκα, λιώνοντάς την αργά.\n\nΗ λίμνη θα προκαλεί συνεχή ζημιά με την πάροδο του χρόνου, αλλά μπορεί να ξεπλυθεί αμέσως με νερό.\n\nΠοσοστό λίμνης που απομένει: %s.
actors.buffs.ooze.heromsg=Η καυστική λάσπη τρώει τη σάρκα σου. Ξεπλύνετέ την!
actors.buffs.ooze.name=καυστική λάσπη
actors.buffs.ooze.ondeath=Λιώνεις...
actors.buffs.ooze.rankings_desc=Διαλυμένο
actors.buffs.paralysis.desc=Συχνά το χειρότερο πράγμα που μπορεί να κάνει κανείς είναι να μην κάνει τίποτα απολύτως.\n\nΗ παράλυση σταματά εντελώς όλες τις ενέργειες, αναγκάζοντας τον στόχο να περιμένει μέχρι να εξασθενήσει η επίδραση. Ο πόνος από τη ζημιά που δέχεται μπορεί να κάνει τους χαρακτήρες να αντισταθούν στην παράλυση, με αποτέλεσμα να χάσουν την ιδιότητά τους ως προς την επίδραση.\n\nΣτροφές παράλυσης που απομένουν: %s.
actors.buffs.paralysis.heromsg=Είσαι παράλυτος!
actors.buffs.paralysis.name=παράλυτος
actors.buffs.paralysis.out=αντιστάθηκε στην παράλυση
actors.buffs.physicalempower.desc=Τα χτυπήματά σας έχουν ενισχυθεί, αυξάνοντας την ποσότητα ζημιάς που μπορείτε να προκαλέσετε όταν χτυπάτε τους εχθρούς με φυσικές επιθέσεις.\n\nΜπόνους ζημιά: %1$d.\nΥπόλοιπα χτυπήματα: %2$d.
actors.buffs.physicalempower.name=σωματικά ενδυναμωμένος
actors.buffs.pincushion.desc=Τα όπλα που έχετε χρησιμοποιήσει εναντίον αυτού του χαρακτήρα είναι αυτήν τη στιγμή κολλημένα σε αυτόν και θα πέσουν στο πάτωμα αφού νικηθεί.\n\nΤα ακόλουθα αντικείμενα είναι αυτήν τη στιγμή συνδεδεμένα:
actors.buffs.pincushion.name=μαξιλαράκι για καρφίτσες
actors.buffs.poison.desc=Το δηλητήριο διαπερνά το σώμα, επηρεάζοντας αργά την εσωτερική του λειτουργία.\n\nΤο δηλητήριο προκαλεί ζημιά σε κάθε γύρο ανάλογη με το χρονικό διάστημα που θα λήξει.\n\nΓύροι δηλητηρίου που απομένουν: %s.
actors.buffs.poison.heromsg=Είσαι δηλητηριασμένος!
actors.buffs.poison.name=δηλητηριασμένος
actors.buffs.poison.ondeath=Πέθανε από δηλητήριο...
actors.buffs.poison.rankings_desc=Υπέκυψε στο δηλητήριο
actors.buffs.preparation.action_name=προετοιμασμένη απεργία
actors.buffs.preparation.assassinated=δολοφονήθηκε
actors.buffs.preparation.desc=Ο Δολοφόνος περιμένει υπομονετικά, ετοιμαζόμενος να επιτεθεί από τις σκιές.
actors.buffs.preparation.desc_blink=Είναι σε θέση να ανοιγοκλείνει τα μάτια του προς έναν εχθρό πριν τον χτυπήσει, με μέγιστη απόσταση _%d._
actors.buffs.preparation.desc_dmg=Η επόμενη επίθεσή του θα προκαλέσει _%1$d%% μπόνους ζημιά_ και θα εκτελέσει κανονικούς εχθρούς με ζωή κάτω από _%2$d%%_ ή αρχηγούς με ζωή κάτω από _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=Η επίθεση θα είναι επίσης πιο πιθανό να προκαλέσει μεγαλύτερη ζημιά.
actors.buffs.preparation.desc_invis_next=Στροφές για ισχυρότερη επίθεση: _%d._
actors.buffs.preparation.desc_invis_time=Γύροι που δαπανήθηκαν αόρατοι: _%d._
actors.buffs.preparation.name=παρασκευή
actors.buffs.preparation.no_target=Δεν υπάρχει τίποτα να επιτεθείς εκεί.
actors.buffs.preparation.out_of_reach=Αυτός ο στόχος είναι εκτός εμβέλειας.
actors.buffs.preparation.prompt=Επιλέξτε έναν στόχο για επίθεση! \nΜέγιστη απόσταση ανοιγοκλεισίματος: %d
actors.buffs.prismaticguard.desc=Σας φυλάει μια πρισματική εικόνα η οποία είναι ανενεργή αυτήν τη στιγμή. Όταν υπάρχουν εχθροί, η πρισματική εικόνα θα αναλάβει δράση και θα σας προστατεύσει! \n\nΕνώ είναι ανενεργή, η πρισματική εικόνα θα ανακάμπτει σταθερά από οποιαδήποτε ζημιά έχει υποστεί. \n\nΤρέχουσα Ζωή: %d/%d.
actors.buffs.prismaticguard.desc_many=Αυτή η πρισματική εικόνα επωφελείται επίσης από τη Δύναμη των Πολλών. Υπόλοιποι Στροφές: %d.
actors.buffs.prismaticguard.name=πρισματική φρουρά
actors.buffs.recharging.desc=Η ενέργεια σε διαπερνά, βελτιώνοντας τον ρυθμό φόρτισης των ραβδιών και των μπαστουνιών σου.\n\nΚάθε γύρος αυτής της ενίσχυσης θα αυξάνει την τρέχουσα φόρτιση κατά ένα τέταρτο, επιπλέον της κανονικής επαναφόρτισης.\n\nΥπολειπόμενοι γύροι επαναφόρτισης: %s.
actors.buffs.recharging.name=επαναφόρτιση
actors.buffs.revealedarea.desc=Μια περιοχή του μπουντρουμιού έχει αποκαλυφθεί προσωρινά στον ήρωα. Θα τη βλέπουν όπου κι αν βρίσκονται. \n\nΥπόλοιποι γύροι: %s.
actors.buffs.revealedarea.name=αποκαλυφθείσα περιοχή
actors.buffs.revealedchar.desc=Αυτός ο χαρακτήρας αποκαλύπτεται στον ήρωα. Θα είναι ορατός όπου κι αν βρίσκεται. \n\nΥπολειπόμενοι γύροι: %s.
actors.buffs.revealedchar.name=αποκάλυψε
actors.buffs.roots.desc=Οι ρίζες (μαγικές ή φυσικές) αρπάζουν τα πόδια, αναγκάζοντάς τα να πέσουν στο έδαφος.\n\nΟι ρίζες κλειδώνουν έναν στόχο στη θέση του, καθιστώντας αδύνατη την κίνηση και τις περισσότερες ικανότητες κίνησης. Άλλες ενέργειες δεν επηρεάζονται, συμπεριλαμβανομένων των εφέ τηλεμεταφοράς.\n\nΥπόλοιπη στροφή ρίζας: %s.
actors.buffs.roots.heromsg=Δεν μπορείς να κουνηθείς!
actors.buffs.roots.name=ριζωμένος
actors.buffs.scrollempower.desc=Η ενέργεια από τον πρόσφατα διαβάσμενο πάπυρο του Μάγου ενδυναμώνει τα ραβδιά του!\n\nΕνίσχυση Επιπέδου: +%1$d.\nΑπομένουν κενά: %2$d.
actors.buffs.scrollempower.name=κύλιση ενδυνάμωση
actors.buffs.shadows.desc=Αναμειγνύεστε με τις σκιές γύρω σας, χαρίζοντάς σας αορατότητα και επιβραδύνοντας τον μεταβολισμό σας.\n\nΕνώ είστε αόρατοι, οι εχθροί δεν μπορούν να σας επιτεθούν ή να σας ακολουθήσουν. Οι περισσότερες φυσικές επιθέσεις και μαγικά εφέ (όπως πάπυροι και ραβδιά) θα ακυρώσουν αμέσως την αορατότητα. Επιπλέον, ενώ συγχωνεύεστε με σκιές, ο ρυθμός πείνας σας επιβραδύνεται.\n\nΘα παραμείνετε συγχωνευμένοι με σκιές μέχρι να φύγετε από τις σκιές ή ένας εχθρός να έρθει σε επαφή μαζί σας.
actors.buffs.shadows.name=σκιασμένος
actors.buffs.slow.desc=Η μαγεία επιβράδυνσης επηρεάζει τον ρυθμό του στόχου, γι' αυτόν όλα κινούνται εξαιρετικά γρήγορα.\n\nA ένας χαρακτήρας που επιβραδύνεται εκτελεί όλες τις ενέργειες σε διπλάσιο χρόνο από αυτόν που θα χρειαζόταν κανονικά.\n\nΥπόλοιπος γύρος επιβράδυνσης: %s.
actors.buffs.slow.name=επιβραδύνθηκε
actors.buffs.snipersmark.action_name_snapshot=στιγμιότυπο
actors.buffs.snipersmark.action_name_sniper=βολή ελεύθερου σκοπευτή
actors.buffs.snipersmark.action_name_volley=ομοβροντία
actors.buffs.snipersmark.desc=Ο ελεύθερος σκοπευτής είναι εστιασμένος στον στόχο που επιτέθηκε πιο πρόσφατα. Είναι σε θέση να εκτελέσει μια ειδική επίθεση με το τόξο της, η οποία θα ποικίλλει ανάλογα με τον τρόπο με τον οποίο το τόξο είναι ενισχυμένο.\n\nΈνα μη ενισχυμένο τόξο θα ρίξει ένα _στιγμιότυπο_,_ το οποίο προκαλεί μειωμένη ζημιά αλλά δεν χρειάζεται χρόνο για να πυροδοτηθεί.\n\nA ένα τόξο ενισχυμένο για ταχύτητα θα ρίξει μια _ομοχλό_ τριών βελών. Κάθε βέλος θα προκαλέσει μειωμένη ζημιά, αλλά μπορεί ακόμα να ενεργοποιήσει τη μαγεία. Αυτή η ομοχλό χρειάζεται 1 γύρο για να πυροβολήσει.\n\nA ένα τόξο ενισχυμένο για ζημιά θα ρίξει μια _βολή ελεύθερου σκοπευτή._ Αυτή η βολή είναι εγγυημένη για να πετύχει, προκαλεί επιπλέον ζημιά με βάση την απόσταση από τον στόχο και χρειάζεται 2 γύρους για να πυροβολήσει.\n\nΥπόλοιποι γύροι: %s.
actors.buffs.snipersmark.name=σημάδι ελεύθερου σκοπευτή
actors.buffs.soulmark.desc=Ο μάγος έχει αγγίξει την ψυχή αυτού του πλάσματος, επιτρέποντάς του να θεραπευτεί καθώς αυτό δέχεται σωματική ζημιά.\n\nΑπομένουσα στροφή σημαδιού ψυχής: %s.
actors.buffs.soulmark.name=ψυχή σημαδεμένη
actors.buffs.stamina.desc=Έχεις ατελείωτη αντοχή, που σου επιτρέπει να κινείσαι πιο γρήγορα! \n\nΕνώ βρίσκεσαι υπό την επίδραση της αντοχής, θα τρέχεις με ταχύτητα +50%%, αλλά θα εκτελείς όλες τις άλλες ενέργειες με κανονική ταχύτητα.\n\nΣτροφές αντοχής που απομένουν: %s.
actors.buffs.stamina.name=σθένος
actors.buffs.terror.desc=Ο τρόμος είναι μια χειριστική μαγεία που αναγκάζει τον στόχο του να πανικοβληθεί ανεξέλεγκτα. \n\nΟι τρομοκρατημένοι χαρακτήρες αναγκάζονται να τρέξουν μακριά από τον αντίπαλό τους, προσπαθώντας να βάλουν όσο το δυνατόν περισσότερες πόρτες και τοίχους ανάμεσά τους. Το σοκ του πόνου, ωστόσο, θα μειώσει τη διάρκεια του τρόμου. \n\nΣτροφές τρόμου που απομένουν: %s.
actors.buffs.terror.name=τρομοκρατημένος
actors.buffs.toxicimbue.desc=Είσαι διαποτισμένος με δηλητηριώδη ενέργεια! \n\nΚαθώς κινείσαι, τοξικό αέριο θα εκτοξεύεται συνεχώς από πάνω σου, προκαλώντας ζημιά στους εχθρούς σου. Είσαι άτρωτος σε τοξικά αέρια και δηλητήρια για όλη τη διάρκεια της επίδρασης, καθώς και για μερικούς γύρους μετά.\n\nΣτροφές τοξικής εμποτισμού που απομένουν: %s.
actors.buffs.toxicimbue.name=εμποτισμένο με τοξικότητα
actors.buffs.vertigo.desc=Το περπάτημα σε ευθεία γραμμή μπορεί να είναι δύσκολο όταν ολόκληρος ο κόσμος γυρίζει. \n\nΕνώ βρίσκονται υπό την επίδραση του ιλίγγου, οι χαρακτήρες που προσπαθούν να κινηθούν θα πάνε σε τυχαία κατεύθυνση, αντί για αυτήν που σκόπευαν να πάνε.\n\nΣτροφές ιλίγγου που απομένουν: %s.
actors.buffs.vertigo.name=ίλιγγος
actors.buffs.vulnerable.desc=Η μαγεία ευαλωτότητας αυξάνει όλη τη φυσική ζημιά που δέχεται ένας χαρακτήρας κατά 33%%, αφού αυτή η ζημιά μειωθεί από την πανοπλία.\n\nΑύξηση των ευάλωτων προσώπων που απομένουν: %s.
actors.buffs.vulnerable.heromsg=Νιώθεις εύθραυστος/η!
actors.buffs.vulnerable.name=τρωτός
actors.buffs.wandempower.desc=Τα ραβδιά που προκαλούν ζημιά έχουν ενισχυθεί, αυξάνοντας την ποσότητα ζημιάς που προκαλούν για λίγα χτυπήματα.\n\nΜπόνους ζημιά: %1$d.\nΥπόλοιπα χτυπήματα: %2$d.
actors.buffs.wandempower.name=ενδυναμωμένα ραβδιά
actors.buffs.weakness.desc=Όλα ξαφνικά φαίνονται πολύ πιο βαριά.\n\nΗ αποδυνάμωση της μαγείας μειώνει τη φυσική δύναμη ενός χαρακτήρα, με αποτέλεσμα να προκαλεί 33%% μειωμένη ζημιά.\n\nΥπόλοιπες στροφές αδυναμίας: %s.
actors.buffs.weakness.heromsg=Νιώθεις αδύναμος/η!
actors.buffs.weakness.name=εξασθενημένος
actors.buffs.wellfed.desc=Νιώθεις αρκετά ικανοποιημένος και χορτάτος.\n\nΕνώ είσαι καλά χορτάτος, η πείνα σου δεν θα αυξηθεί και θα θεραπεύσεις μια επιπλέον ποσότητα υγείας με την πάροδο του χρόνου.\n\nΥπολειπόμενοι στροφές: %d.
actors.buffs.wellfed.name=καλοταϊσμένος
actors.char.def_verb=απέφυγε
actors.char.def_verb_blocked=μπλοκαρισμένο
actors.char.defeat=Νίκησες τον %s.
actors.char.immune=απρόσβλητος
actors.char.invulnerable=άτρωτος
actors.char.kill=%s σε σκότωσε...
actors.hero.abilities.armorability.cost=Κόστος χρέωσης: _%d_
actors.hero.abilities.armorability.no_target=Δεν υπάρχει τίποτα να στοχεύσεις εκεί!
actors.hero.abilities.armorability.prompt=Επιλέξτε μια τοποθεσία για στόχευση
actors.hero.abilities.armorability.self_target=Δεν μπορείς να στοχεύσεις τον εαυτό σου!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Ακτινοβολούμενη ενέργεια εκπέμπεται από το σώμα του Κληρικού. Ενώ βρίσκεται σε αυτή τη μορφή, ο Κληρικός αποκτά 2 βεληνεκές επίθεσης (από την ιερή ενέργεια που προβάλλεται από αυτόν) και 10 ασπίδες κάθε φορά που ξοδεύει μια φόρτιση ιερού τόμου. Είναι επίσης σε θέση να εκτελέσει τα ξόρκια που ξεκλειδώνονται μέσω των ταλέντων της ανερχόμενης μορφής.\n\nΗ ασπίδα που δίνεται από την ανερχόμενη μορφή και τα ξόρκια της δεν θα φθαρούν κανονικά, αλλά θα εξασθενίσουν αμέσως όταν τελειώσει η ανερχόμενη μορφή.\n\nΤρέχουσα θωράκιση: %1$d.\nΥπόλοιποι γύροι: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=ανυψωμένη μορφή
actors.hero.abilities.cleric.ascendedform.desc=Ο Κληρικός εκπέμπει ιερή ενέργεια από τον εαυτό του, αναλαμβάνοντας μια εκτεταμένη ακτινοβόλα μορφή για 10 γύρους. Ενώ βρίσκεται σε αυτή τη μορφή, ο Κληρικός μπορεί να κάνει νέα ξόρκια, κερδίζει 2 βεληνεκές επίθεσης, 30 ασπίδες και τυχόν επιπλέον ξόρκια που κάνει θα δίνουν 10 ασπίδες ανά ιερή φόρτιση που χρησιμοποιείται.\n\nΗ ασπίδα από την ανυψωμένη μορφή και τα ξόρκια της δεν μειώνεται κανονικά, αλλά θα εξασθενίσει αμέσως μόλις τελειώσει η ανυψωμένη μορφή. Η ικανότητα μπορεί να επαναχρησιμοποιηθεί για να ανανεώσει τη διάρκεια της ανυψωμένης μορφής.
actors.hero.abilities.cleric.ascendedform.name=ανυψωμένη μορφή
actors.hero.abilities.cleric.ascendedform.short_desc=Ο Κληρικός αποκτά _Ανυψωμένη Μορφή_, αποκτώντας νέα ξόρκια, εμβέλεια επίθεσης και ασπίδα.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Ένα αντίγραφο ενός από τους περιπετειώδεις συντρόφους του Κληρικού, φτιαγμένο από συμπαγές φως. Ενώ έχει το σχήμα ενός άλλου ήρωα, δεν διαθέτει καμία από τις μοναδικές ικανότητές τους. Αυτός ο σύμμαχος θα παραμείνει για όσο διάστημα εφαρμόζεται σε αυτόν η Δύναμη των Πολλών.\n\nΑυτός ο σύμμαχος μπορεί να κατευθυνθεί χωρίς κόστος χρησιμοποιώντας ξανά την ικανότητα θωράκισης Δύναμη των Πολλών.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Ο σύμμαχός σας κινείται για να επιτεθεί!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Ο σύμμαχός σας μετακινείται σε αυτήν τη θέση.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Ο σύμμαχός σου κινείται για να σε ακολουθήσει.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με μια συγκεκριμένη ικανότητα πανοπλίας ήρωα.
actors.hero.abilities.cleric.powerofmany$lightally.name=ελαφρύς σύμμαχος
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Αυτός ο σύμμαχος έχει ενδυναμωθεί από τη Δύναμη των Πολλών, η οποία του δίνει ζημιά +25%% που προκαλείται και ζημιά -25%% που δέχεται. Θα μοιράζονται επίσης την εμβέλεια όρασής τους με τον Κληρικό και μπορούν να επωφεληθούν από τη δύναμη πολλών ξορκιών.\n\nΗ Δύναμη των Πολλών θα επιμένει όταν σύμμαχοι όπως πρισματικές εικόνες κρύβονται, αλλά η διάρκειά της θα εξακολουθεί να μετράει αντίστροφα.\n\nΥπόλοιποι Γύροι: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=δύναμη πολλών
actors.hero.abilities.cleric.powerofmany.ally_exists=Έχετε ήδη έναν ισχυρό σύμμαχο.
actors.hero.abilities.cleric.powerofmany.desc=Ο Κληρικός διοχετεύει τη _Δύναμη των Πολλών_, η οποία είτε ενδυναμώνει έναν υπάρχοντα σύμμαχο είτε δημιουργεί έναν νέο ενδυναμωμένο για 100 γύρους. Η στόχευση μιας κενής θέσης δημιουργεί έναν νέο σύμμαχο.\n\nΕνώ ενδυναμώνεται από τη Δύναμη των Πολλών, οποιοσδήποτε σύμμαχος προκαλεί +25% ζημιά, δέχεται -25% ζημιά και μοιράζεται το όραμά του με τον Κληρικό. Κερδίζει επίσης 25 ασπίδες όταν χρησιμοποιείται η ικανότητα.\n\nΟ Κληρικός κερδίζει επίσης τρία νέα ξόρκια που μπορούν να εκτελεστούν μόνο με έναν ενδυναμωμένο σύμμαχο. Η Δύναμη των Πολλών δεν θα τελειώσει όσο ένα από αυτά τα ξόρκια είναι ενεργό.
actors.hero.abilities.cleric.powerofmany.name=δύναμη πολλών
actors.hero.abilities.cleric.powerofmany.no_vision=Δεν μπορείτε να στοχεύσετε μια τοποθεσία που δεν μπορείτε να δείτε.
actors.hero.abilities.cleric.powerofmany.only_allies=Μπορείτε μόνο να ενδυναμώσετε τους συμμάχους.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Κατευθύνετε τον φωτεινό σας σύμμαχο
actors.hero.abilities.cleric.powerofmany.prompt_default=Επιλέξτε έναν σύμμαχο ή μια τοποθεσία
actors.hero.abilities.cleric.powerofmany.short_desc=Ο Κληρικός διοχετεύει τη _Δύναμη των Πολλών_, ενδυναμώνοντας έναν υπάρχοντα σύμμαχο ή δημιουργώντας έναν νέο.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Ανάθεση σε μορφή σώματος
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Αντιστοίχιση σε φόρμα μυαλού
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Ανάθεση σε μορφή πνεύματος
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Επιλέξτε ένα εφέ που θα ενσωματωθεί στο Trinity. Πρόσθετες πληροφορίες θα εμφανιστούν πριν από την επιβεβαίωση.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Μορφή Σώματος: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Μορφή Νου: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Πνευματική Μορφή: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Επιλέξτε ποια μορφή της Τριάδας θα χρησιμοποιήσετε. Τα εφέ διαφορετικών μορφών μπορούν να είναι ενεργά ταυτόχρονα.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Η Τριάδα θα εφαρμόσει το απομακρυσμένο αλχημειακό εφέ αυτού του τεχνουργήματος, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Η Τριάδα θα εφαρμόσει την παθητική αναγέννηση ζωής αυτού του τεχνουργήματος στο _+%1$d_ για 20 γύρους, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.cost=Το κόστος χρέωσης αυτής της ικανότητας ποικίλλει, αλλά τις περισσότερες φορές είναι _%d._
actors.hero.abilities.cleric.trinity.desc=Ο Κληρικός αποκτά μια _Τριάδα_ ικανοτήτων πανοπλίας, οι οποίες μπορούν να αντιστοιχιστούν σε διάφορα εφέ αντικειμένων χρησιμοποιώντας τρία νέα ξόρκια. Κάθε ένα από αυτά τα ξόρκια εστιάζει στην εξομοίωση των εφέ διαφορετικών ειδών εξοπλισμού που ο Κληρικός έχει αναγνωρίσει κατά τη διάρκεια αυτής της εκτέλεσης: μορφή σώματος (όπλα και πανοπλία), μορφή μυαλού (ράβδοι και εκτοξευόμενα όπλα) και μορφή πνεύματος (δαχτυλίδια και αντικείμενα).\n\nΚάθε μορφή Τριάδας μπορεί να εμποτιστεί με ένα εφέ κάθε φορά και ο Κληρικός επιλέγει ποιο θα ενεργοποιήσει όταν χρησιμοποιεί την Τριάδα. Η Τριάδα δεν θα αντιγράψει το εφέ κάποιου πράγματος που έχετε ήδη εξοπλίσει.
actors.hero.abilities.cleric.trinity.driedrose_use=Η Τρίνιτι θα χρησιμοποιήσει την επίδραση αυτού του τεχνουργήματος για να καλέσει ένα διεφθαρμένο φιλικό φάντασμα με την Ζωή ενός φαντάσματος _+%1$d_, με κόστος τη φόρτιση _%2$s._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Το Trinity θα εφαρμόσει αυτό το εφέ για _%1$d στροφές_ με κόστος _%2$s χρέωσης._
actors.hero.abilities.cleric.trinity.etherealchains_use=Η Τριάδα θα εφαρμόσει το εφέ αλυσιδωτής εκτέλεσης αυτού του τεχνουργήματος με εμβέλεια _+%1$d_, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Η Τριάδα θα εφαρμόσει το εφέ σνακ αυτού του τεχνουργήματος, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Η Τριάδα θα εφαρμόσει την επίδραση ληστείας εχθρού αυτού του τεχνουργήματος στο _+%1$d_, με κόστος τη φόρτιση _%2$s._
actors.hero.abilities.cleric.trinity.name=τριάδα
actors.hero.abilities.cleric.trinity.no_duplicate=Η Τριάδα δεν μπορεί να αντιγράψει ένα εφέ που έχετε ήδη εξοπλίσει!
actors.hero.abilities.cleric.trinity.no_imbue=Η Τριάδα δεν έχει καμία επίδραση για καμία από τις μορφές της αυτήν τη στιγμή, χρησιμοποιήστε ένα από τα ξόρκια της!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Το Trinity θα εφαρμόσει αυτό το _ισχυρό_ εφέ για _%1$d στροφές_ με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.ring_use=Η Τριάδα θα εφαρμόσει το εφέ αυτού του δακτυλίου στο _+%1$d_ για 20 γύρους, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Το Trinity θα εφαρμόσει το φαινόμενο root αυτού του τεχνουργήματος με έναν τυχαίο επιβλαβή σπόρο, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.short_desc=Ο Κληρικός αποκτά μια _Τριάδα_ ικανοτήτων, οι οποίες μιμούνται τον εξοπλισμό που έχει δει και μπορούν να του ανατεθούν χρησιμοποιώντας νέα ξόρκια.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Το Trinity θα εφαρμόσει το εφέ εισαγωγής αυτού του τεχνουργήματος, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Η Τριάδα θα εφαρμόσει το εφέ scry αυτού του τεχνουργήματος στο _+%1$d_, με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.thrown_use=Η Τριάδα θα πετάξει αυτό το όπλο στον _+%1$d_ με κόστος την γόμωση _%2$s._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Η Τριάδα θα εφαρμόσει το εφέ παγώματος χρόνου αυτού του τεχνουργήματος με διάρκεια γύρου _%1$d_, με κόστος φόρτισης _%2$s._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Η Trinity θα εφαρμόσει το εφέ τυχαίας κύλισης αυτού του τεχνουργήματος με την ευκαιρία _%1$d/10_ να προσφέρει την εξωτική έκδοση χωρίς επιπλέον κόστος, με χρέωση _%2$s._
actors.hero.abilities.cleric.trinity.wand_multi_use=Το Trinity θα ενεργοποιήσει αυτό το _πολλαπλής φόρτισης_ ραβδί στο _+%1$d_ με κόστος _%2$s φόρτισης._
actors.hero.abilities.cleric.trinity.wand_use=Η Trinity θα καταστρέψει αυτό το ραβδί με _+%1$d_ με κόστος _%2$s φόρτισης._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Αυτός ο χαρακτήρας συμμετέχει σε μια μονομαχία. Αυτός, και οποιοσδήποτε από τους συμμάχους ή τους υπηρέτες του, επιτρέπεται να ενεργούν κανονικά, ενώ οι άλλοι είναι παγωμένοι.\n\nΗ μονομαχία θα διαρκέσει για ένα καθορισμένο χρονικό διάστημα, μέχρι να πεθάνει ένας συμμετέχων ή μέχρι οι συμμετέχοντες να απομακρυνθούν περισσότερα από 5 πλακίδια ο ένας από τον άλλον.\n\nΥπόλοιπος γύρος: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=συμμετέχων σε μονομαχία
actors.hero.abilities.duelist.challenge.ally_target=Μπορείτε να προκαλέσετε μόνο εχθρούς.
actors.hero.abilities.duelist.challenge.already_dueling=Μπορείτε να συμμετέχετε μόνο σε μία μονομαχία κάθε φορά.
actors.hero.abilities.duelist.challenge.desc=Ο Μονομάχος προκαλεί έναν κοντινό εχθρό σε μονομαχία. Αυτός ο εχθρός αναγκάζεται να τον πολεμήσει, ενώ όλοι οι άλλοι εχθροί είναι προσωρινά παγωμένοι στο χρόνο.\n\nΟ στόχος πρέπει να είναι προσβάσιμος και σε απόσταση 5 πλακιδίων από τον Μονομάχο. Η μονομαχία διαρκεί μέχρι να περάσουν 10 γύροι, ο εχθρός να πεθάνει ή ο Μονομάχος να απέχει περισσότερα από 5 πλακίδια από τον εχθρό.\n\nΟι παγωμένοι εχθροί είναι άτρωτοι. Οι σύμμαχοι του Μονομάχου δεν παγώνουν από αυτήν την ικανότητα, αλλά αν ένας αρχηγός γίνει στόχος, ούτε οι υπηρέτες του θα παγώσουν.
actors.hero.abilities.duelist.challenge.distant_target=Αυτός ο εχθρός είναι πολύ μακριά για να τον αμφισβητήσουμε.
actors.hero.abilities.duelist.challenge.name=πρόκληση
actors.hero.abilities.duelist.challenge.prompt=Διάλεξε έναν εχθρό για να τον προκαλέσεις
actors.hero.abilities.duelist.challenge.short_desc=Ο Μονομάχος _Προκαλεί_ έναν κοντινό εχθρό σε μονομαχία, παγώνοντας προσωρινά όλους τους άλλους εχθρούς.
actors.hero.abilities.duelist.challenge.unreachable_target=Πρέπει να είστε σε θέση να φτάσετε στον στόχο σας.
actors.hero.abilities.duelist.elementalstrike.desc=Ο Μονομάχος χτυπά έναν εχθρό ή μια τοποθεσία, εκτελώντας μια κανονική επίθεση που είναι εγγυημένη για να χτυπήσει και εξαπλώνοντας ένα μαγικό αποτέλεσμα που ταξιδεύει σε έως και 4 πλακίδια σε κώνο 65 μοιρών. Αυτό το μαγικό αποτέλεσμα ποικίλλει ανάλογα με τη γοητεία στο κύριο όπλο του Μονομάχου.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ένα στοιχειακό χτύπημα χωρίς μαγεία θα απελευθερώσει μια μικρή έκρηξη μαγείας, προκαλώντας 6-12 ζημιά σε όλους τους εχθρούς που βρίσκονται σε εμβέλεια.
actors.hero.abilities.duelist.elementalstrike.name=στοιχειακή απεργία
actors.hero.abilities.duelist.elementalstrike.short_desc=Η Μονομάχος εκτελεί ένα _Elemental Strike_, εξαπλώνοντας ένα εφέ σε ένα κωνικό AOE με βάση τη γοητεία του όπλου της.
actors.hero.abilities.duelist.feint.bad_location=Δεν μπορείτε να μετακινηθείτε σε αυτήν την τοποθεσία.
actors.hero.abilities.duelist.feint.desc=Η Μονομάχος προσποιείται μια επίθεση ενώ ορμάει σε ένα γειτονικό πλακίδιο, αφήνοντας πίσω της ένα στιγμιαίο είδωλο του εαυτού της. Οι εχθροί που επιτίθεντο στη Μονομάχο θα επιτεθούν στη δική της είδωλο.\n\nΟι εχθροί που επιτίθενται στη είδωλο μπερδεύονται, γεγονός που ακυρώνει την επόμενη ενέργειά τους και τους αφήνει εκτεθειμένους σε μια αιφνιδιαστική επίθεση.
actors.hero.abilities.duelist.feint.name=προσποίηση
actors.hero.abilities.duelist.feint.prompt=Επιλέξτε μια τοποθεσία για να σπεύσετε
actors.hero.abilities.duelist.feint.short_desc=Η Μονομάχος _Προσποιείται_, προσποιούμενη επίθεση ενώ ορμάει σε ένα γειτονικό πλακίδιο. Οι εχθροί θα επιτεθούν στο είδωλό της, αφήνοντάς τους εκτεθειμένους σε αντεπίθεση.
actors.hero.abilities.duelist.feint.too_far=Αυτή η τοποθεσία δεν είναι δίπλα σας.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Η Κυνηγός ενδυναμώνεται για λίγο, αυξάνοντας την Ταχύτητα Κίνησής της και την Ταχύτητα Επίθεσης με το τόξο της. \n\nΣτροφές που απομένουν: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=η δύναμη της φύσης
actors.hero.abilities.huntress.naturespower.desc=Η Κυνηγός ενδυναμώνει προσωρινά τον εαυτό της και το τόξο της με τη δύναμη της φύσης! Αυτό διαρκεί για 8 γύρους.\n\nΚατά τη διάρκεια αυτού του χρόνου, η Κυνηγός κινείται με 2x ταχύτητα και επιτίθεται 33% πιο γρήγορα με το τόξο της. Τα επιπλέον εφέ τόξου δεν ενεργοποιούνται αν ο Σκοπευτής χρησιμοποιεί τις ειδικές επιθέσεις του.
actors.hero.abilities.huntress.naturespower.name=η δύναμη της φύσης
actors.hero.abilities.huntress.naturespower.short_desc=Η Κυνηγός επικαλείται τη _Δύναμη της Φύσης_, αυξάνοντας την ταχύτητα κίνησής της και την ταχύτητα βολής του τόξου της για μικρό χρονικό διάστημα.
actors.hero.abilities.huntress.spectralblades.desc=Η Κυνηγός πετάει μια φασματική λεπίδα σε έναν εχθρό, η οποία λειτουργεί σαν χτύπημα από απόσταση από το όπλο μάχης σώμα με σώμα. Όλες οι συνήθεις επιδράσεις ενός όπλου μάχης σώμα με σώμα θα ενεργοποιηθούν, συμπεριλαμβανομένων των μαγικών όπλων.
actors.hero.abilities.huntress.spectralblades.name=φασματικές λεπίδες
actors.hero.abilities.huntress.spectralblades.short_desc=Η Κυνηγός πετάει _Φασματικές Λεπίδες_ σε έναν στόχο, προκαλώντας ζημιά ανάλογα με το όπλο μάχης σώμα με σώμα που είναι ήδη εξοπλισμένο.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Ένα μαγικό γεράκι, που έχει κληθεί από την Κυνηγό. Λάμπει με ένα φωτεινό αιθέριο μπλε, το κεφάλι του κινείται συνεχώς καθώς ερευνά την περιοχή. \n\n Αν και δεν είναι και τόσο μαχητικό, η ταχύτητα και η όρασή του το καθιστούν εξαιρετικό για την ανίχνευση και την αποστροφή της προσοχής των εχθρών.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Εγγυημένες αποφεύγσεις που απομένουν: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Στροφές που απομένουν: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Το γεράκι σου κινείται για να επιτεθεί!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Το γεράκι σου μετακινείται σε αυτή τη θέση.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Το γεράκι σου κινείται για να σε ακολουθήσει.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με μια συγκεκριμένη ικανότητα πανοπλίας ήρωα.
actors.hero.abilities.huntress.spirithawk$hawkally.name=πνευματικό γεράκι
actors.hero.abilities.huntress.spirithawk.desc=Η Κυνηγός καλεί ένα οικείο πνευματικό γεράκι, το οποίο μπορεί να κατευθυνθεί χρησιμοποιώντας ξανά την ικανότητα ενώ καλείται. Το γεράκι διαρκεί 100 γύρους, η κατεύθυνσή του δεν κοστίζει καμία χρέωση.\n\nΤο γεράκι έχει ελάχιστη ζωή και επιθετική δύναμη, αλλά είναι γρήγορο, διαφεύγον και ακριβές. Μοιράζεται ολόκληρο το οπτικό του πεδίο με την Κυνηγό ανά πάσα στιγμή. Είναι άτρωτο σε όλες τις επιδράσεις που σχετίζονται με την περιοχή, όπως η φωτιά και το δηλητηριώδες αέριο. Δεν θα επιτεθεί εκτός εάν του δοθούν συγκεκριμένες οδηγίες.
actors.hero.abilities.huntress.spirithawk.name=πνευματικό γεράκι
actors.hero.abilities.huntress.spirithawk.no_space=Δεν υπάρχει ελεύθερος χώρος κοντά σας.
actors.hero.abilities.huntress.spirithawk.short_desc=Η Κυνηγός καλεί ένα οικείο _Πνεύμα Γερακιού_, το οποίο μπορεί να τη βοηθήσει να ανιχνεύσει τοποθεσίες και να αποσπάσει την προσοχή των εχθρών.
actors.hero.abilities.mage.elementalblast.desc=Ο Μάγος εκπέμπει μια έκρηξη μαγείας, η οποία καλύπτει μια κυκλική περιοχή σε απόσταση έως και 4 πλακιδίων και προκαλεί έως και 15-25 ζημιά. Η συγκεκριμένη επίδραση της στοιχειακής έκρηξης θα ποικίλλει ανάλογα με το ραβδί που είναι εμποτισμένο στο ραβδί του Μάγου.
actors.hero.abilities.mage.elementalblast.generic_desc=Η επίδραση της στοιχειακής έκρηξης θα είναι παρόμοια με την επίδραση του ραβδιού όταν χτυπηθεί σε έναν εχθρό ή σύμμαχο.
actors.hero.abilities.mage.elementalblast.name=στοιχειακή έκρηξη
actors.hero.abilities.mage.elementalblast.no_staff=Δεν μπορείτε να χρησιμοποιήσετε αυτήν την ικανότητα χωρίς το προσωπικό σας.
actors.hero.abilities.mage.elementalblast.short_desc=Ο Μάγος εκπέμπει μια _Στοιχειώδη Έκρηξη_ από το ραβδί του, καλύπτοντας μια μεγάλη περιοχή γύρω του με ένα εφέ που ποικίλλει ανάλογα με το ραβδί στο ραβδί του.
actors.hero.abilities.mage.warpbeacon.depths=Δεν μπορείς να παραμορφώνεσαι ανάμεσα στα βάθη!
actors.hero.abilities.mage.warpbeacon.desc=Ο Μάγος τοποθετεί ένα φάρο, το οποίο στη συνέχεια μπορεί να παραμορφωθεί κατά βούληση. Η τοποθέτηση του φάρου διαρκεί 1 γύρο, αλλά η παραμόρφωση προς αυτό είναι στιγμιαία.\n\nΟ Μάγος δεν μπορεί να παραμορφωθεί μεταξύ ορόφων από προεπιλογή ή να χρησιμοποιήσει το φάρο για να φτάσει σε δυσπρόσιτα μέρη, όπως κλειδωμένα δωμάτια. Ο Μάγος μπορεί να τηλεμεταφερθεί σε εχθρούς, κάτι που θα τους απωθήσει.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Δεν μπορείς να τοποθετήσεις φάρο εκεί!
actors.hero.abilities.mage.warpbeacon.locked_floor=Δεν μπορείτε να φύγετε από ένα κλειδωμένο πάτωμα!
actors.hero.abilities.mage.warpbeacon.name=φάρος στημονιού
actors.hero.abilities.mage.warpbeacon.short_desc=Ο Μάγος τοποθετεί έναν _Φάρο Παραμόρφωσης_ στην τρέχουσα τοποθεσία του, στην οποία μπορεί να τηλεμεταφερθεί αμέσως.
actors.hero.abilities.mage.warpbeacon.too_far=Αυτή η τοποθεσία είναι πολύ μακριά!
actors.hero.abilities.mage.warpbeacon.window_cancel=ματαίωση
actors.hero.abilities.mage.warpbeacon.window_clear=καθαρός φάρος
actors.hero.abilities.mage.warpbeacon.window_desc=Το beacon σας βρίσκεται αυτήν τη στιγμή στον όροφο %d.
actors.hero.abilities.mage.warpbeacon.window_tele=τηλεμεταφορά σε φάρο
actors.hero.abilities.mage.wildmagic.desc=Ο Μάγος απελευθερώνει τη δύναμη στα ραβδιά του, πυροδοτώντας τα τυχαία έως και 4 φορές σε μία μόνο στροφή. Το ραβδί του Μάγου δεν περιλαμβάνεται σε αυτό το αποτέλεσμα.\n\nΚάθε ραβδί έχει επίσης το επίπεδό του ενισχυμένο κατά 2, έως και +3. Αυτή η ικανότητα χρησιμοποιεί μισό φορτίο ραβδιού για κάθε χτύπημα και κανένα ραβδί δεν μπορεί να πυροδοτηθεί περισσότερες από 2 φορές.
actors.hero.abilities.mage.wildmagic.name=άγρια μαγεία
actors.hero.abilities.mage.wildmagic.no_wands=Δεν έχεις ραβδιά για να κάνεις ζάπινγκ!
actors.hero.abilities.mage.wildmagic.short_desc=Ο Μάγος εξαπολύει την _Άγρια Μαγεία_ που περιέχεται στα ραβδιά του, εκτοξεύοντάς τα τυχαία πολλές φορές σε έναν επιλεγμένο στόχο σε μία μόνο στροφή.
actors.hero.abilities.ratmogrify$transmograt.desc=Αυτός ο εχθρός έχει μεταμορφωθεί σε αρουραίο. Μια μεγάλη βελτίωση, αν θέλετε τη γνώμη μου! - Βασιλιάς των Ποντικών
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Σκοτώθηκε από: εχθρό που έχει υποστεί ραματοποίηση
actors.hero.abilities.ratmogrify.cant_transform=Δεν μπορείς να το αποφύγεις αυτό!
actors.hero.abilities.ratmogrify.desc=Ο ήρωας μεταμορφώνει έναν εχθρό σε αρουραίο για 6 γύρους! Οι αρχηγοί, οι σύμμαχοι και οι αρουραίοι δεν μπορούν να γίνουν αρουραίοι.\n\nΟι εχθροί που έχουν υποστεί Ratmogrification διατηρούν τα αρχικά τους στατιστικά, αλλά δεν έχουν καμία ικανότητα.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=Ο ήρωας _Ratmogrifies_ έναν εχθρό! Αυτό τον μετατρέπει προσωρινά σε αρουραίο χωρίς ικανότητες.
actors.hero.abilities.ratmogrify.too_strong=Αυτός ο εχθρός είναι πολύ δυνατός για να τον εξοντώσουμε!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Αυτός ο εχθρός έχει μαρκαριστεί, με αποτέλεσμα να δέχεται 25%% μπόνους ζημιά, αλλά και να μην μπορεί να πεθάνει μέχρι να τελειώσει το σημάδι.\n\nΥπόλοιπο στροφών: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=σημαδεμένος για θάνατο
actors.hero.abilities.rogue.deathmark.ally_target=Μπορείτε να μαρκάρετε μόνο εχθρούς
actors.hero.abilities.rogue.deathmark.desc=Ο Απατεώνας τοποθετεί ένα σημάδι σε έναν επιλεγμένο εχθρό, με αποτέλεσμα να δέχεται 25% επιπλέον ζημιά. Το σημάδι εφαρμόζεται αμέσως και διαρκεί για 5 γύρους.\n\nΟι σημαδεμένοι εχθροί δέχονται επιπλέον ζημιά, αλλά δεν μπορούν να πεθάνουν μέχρι να λήξει το σημάδι. Εάν ένας εχθρός έχει 0 Ζωή όταν τελειώσει το σημάδι, θα πεθάνει αμέσως.
actors.hero.abilities.rogue.deathmark.name=σημάδι θανάτου
actors.hero.abilities.rogue.deathmark.short_desc=Ο Απατεώνας τοποθετεί ένα _Σημάδι Θανάτου_ σε έναν επιλεγμένο εχθρό. Οι σημαδεμένοι εχθροί δέχονται επιπλέον ζημιά, αλλά δεν μπορούν να πεθάνουν μέχρι να τελειώσει το σημάδι.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Ένα αντίγραφο του Rogue, φτιαγμένο από σκιερό σκοτάδι. Στέκεται ακίνητο, με άδεια μάτια και μικροσκοπικές τούφες σκότους να αναδύονται από αυτό σαν ατμός. \n\n. Ο κλώνος δεν είναι τέλειο αντίγραφο του Rogue, αλλά εξακολουθεί να είναι ένας αξιοπρεπής μαχητής και μπορεί να επωφεληθεί από τον εξοπλισμό του Rogue με τα κατάλληλα ταλέντα.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Ο κλώνος σου κινείται για να επιτεθεί!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ο κλώνος σας μετακινείται σε αυτήν τη θέση.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Ο κλώνος σου κινείται για να σε ακολουθήσει.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με μια συγκεκριμένη ικανότητα πανοπλίας ήρωα.
actors.hero.abilities.rogue.shadowclone$shadowally.name=σκιώδης απατεώνας
actors.hero.abilities.rogue.shadowclone.desc=Ο Rogue καλεί μια σκιώδη μίμηση του εαυτού του, η οποία μπορεί να κατευθυνθεί για να τον βοηθήσει στη μάχη. Η καθοδήγηση του κλώνου της σκιάς δεν κοστίζει καμία χρέωση.\n\nΟ κλώνος έχει 80 Ζωή, δεν έχει θωράκιση και προκαλεί 10-20 ζημιά. Όλα αυτά τα χαρακτηριστικά μπορούν να βελτιωθούν με ταλέντα, έτσι ώστε ο κλώνος να επωφελείται από τα όπλα και την θωράκιση που έχει ο ήρωας.
actors.hero.abilities.rogue.shadowclone.name=κλώνος σκιάς
actors.hero.abilities.rogue.shadowclone.short_desc=Ο Απατεώνας καλεί έναν _Κλώνο της Σκιάς_, ο οποίος μπορεί να κατευθυνθεί για να τον βοηθήσει στη μάχη.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Κατά κάποιο τρόπο, οι εχθροί πείθονται εύκολα ότι αυτό το ξύλινο δόλωμα είναι ο πραγματικός Απατεώνας!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με μια συγκεκριμένη ικανότητα πανοπλίας ήρωα.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=ξύλινο δόλωμα
actors.hero.abilities.rogue.smokebomb.desc=Ο Rogue πετάει μια βόμβα καπνού και ανοιγοκλείνει τα μάτια του σε απόσταση έως και 6 πλακιδίων. Μπορεί να ανοιγοκλείνει τα μάτια του μέσα από κινδύνους και εχθρούς, αλλά όχι μέσα από συμπαγές έδαφος όπως τοίχους.\n\nΟι εχθροί που βρίσκονται δίπλα στην παλιά θέση του Rogue θα τυφλώνονται για 5 γύρους.
actors.hero.abilities.rogue.smokebomb.fov=Μπορείτε να μεταβείτε μόνο σε μια κενή τοποθεσία στο οπτικό σας πεδίο.
actors.hero.abilities.rogue.smokebomb.name=βόμβα καπνού
actors.hero.abilities.rogue.smokebomb.prompt=Επιλέξτε μια τοποθεσία για να μεταβείτε
actors.hero.abilities.rogue.smokebomb.short_desc=Ο Απατεώνας πετάει μια _Βόμβα Καπνού_ ενώ ανοιγοκλείνει τα μάτια του. Τυφλωνει τους εχθρούς κοντά στην παλιά του τοποθεσία.
actors.hero.abilities.warrior.endure$enduretracker.desc=Ο Πολεμιστής προκαλεί πλέον επιπλέον ζημιά με βάση τη ζημιά που υπέστη.\n\nΕπιπλέον Ζημιά: %1$d\nΧτυπήματα αριστερά: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=αντοχή
actors.hero.abilities.warrior.endure.desc=Ο Πολεμιστής αντέχει για 3 γύρους, δεχόμενος τη μισή ζημιά από όλες τις πηγές. Αυτή η μείωση εφαρμόζεται πριν από τα εφέ αντίστασης στη ζημιά, όπως η θωράκιση.\n\nΑφού αντέξει, το επόμενο χτύπημα του πολεμιστή εντός 10 γύρων κερδίζει μπόνους ζημιά. Αυτή η μπόνους ζημιά είναι ίση με το μισό όλης της ζημιάς που του προκλήθηκε ενώ αντέχει, πριν από τυχόν εφέ μείωσης ζημιάς!\n\nΕάν ο Πολεμιστής έχει οποιονδήποτε συνδυασμό, η χρήση αυτής της ικανότητας αυξάνει τον υπολειπόμενο χρόνο του κατά 3 γύρους.
actors.hero.abilities.warrior.endure.name=υπομένω
actors.hero.abilities.warrior.endure.short_desc=Ο Πολεμιστής _Υπομένει_, παρακάμπτοντας αρκετούς γύρους αλλά αποκτώντας υψηλή αντοχή στη ζημιά. Στη συνέχεια, προκαλεί επιπλέον ζημιά με βάση ό,τι υπέμεινε.
actors.hero.abilities.warrior.heroicleap.desc=Ο Πολεμιστής πηδάει προς μια στοχευμένη τοποθεσία, προσπερνώντας τυχόν εχθρούς ή κινδύνους που βρίσκονται στο δρόμο του. Ωστόσο, δεν μπορεί να πηδήξει πάνω από τοίχους ή άλλο συμπαγές έδαφος.
actors.hero.abilities.warrior.heroicleap.name=ηρωικό άλμα
actors.hero.abilities.warrior.heroicleap.prompt=Επιλέξτε κατεύθυνση για να πηδήξετε
actors.hero.abilities.warrior.heroicleap.short_desc=Ο Πολεμιστής εκτελεί ένα _Ηρωικό Άλμα_ προς μια στοχευμένη τοποθεσία, πλέοντας πάνω από εχθρούς και κινδύνους.
actors.hero.abilities.warrior.shockwave.desc=Ο Πολεμιστής χτυπάει το έδαφος, παράγοντας ένα ωστικό κύμα που ταξιδεύει έως και 5 πλακίδια σε κώνο 60 μοιρών.\n\nΟι εχθροί που πλήττονται από αυτό το ωστικό κύμα χάνουν τη δύναμη τους για 5 γύρους. Δέχονται επίσης 5-10 ζημιά, συν 1-2 επιπλέον ζημιά για κάθε σημείο δύναμης που έχει ο Πολεμιστής πάνω από 10.
actors.hero.abilities.warrior.shockwave.name=κρουστικό κύμα
actors.hero.abilities.warrior.shockwave.short_desc=Ο Πολεμιστής εξαπολύει ένα _Κρυστικό Κύμα_ σε κωνικό AOE χτυπώντας το έδαφος. Οι εχθροί που παγιδεύονται στο κρουστικό κύμα υφίστανται ζημιά και ακρωτηριάζονται.
actors.hero.hero.key_distracted=Δεν μπορείς να ανοίξεις την κλειδαριά, θα πρέπει να συνεχίσεις να προσπαθείς.
actors.hero.hero.leave=Δεν μπορείς να φύγεις ακόμα, το υπόλοιπο μπουντρούμι σε περιμένει από κάτω!
actors.hero.hero.level_cap=Δεν μπορείς να γίνεις πιο δυνατός, αλλά οι εμπειρίες σου σου δίνουν μια έκρηξη δύναμης!
actors.hero.hero.level_up=Ανέβα επίπεδο!
actors.hero.hero.locked_chest=Αυτό το σεντούκι είναι κλειδωμένο και δεν έχεις αντίστοιχο κλειδί.
actors.hero.hero.locked_door=Δεν έχετε αντίστοιχο κλειδί.
actors.hero.hero.name=εσείς
actors.hero.hero.new_level=Ανέβα επίπεδο! +Ακρίβεια, +Διαφυγή, +5 Ζωή!
actors.hero.hero.new_talent=+1 Πόντος Ταλέντου!
actors.hero.hero.noticed_smth=Παρατήρησες κάτι.
actors.hero.hero.pain_resist=Ο πόνος σε βοηθά να αντισταθείς στην επιθυμία για ύπνο.
actors.hero.hero.revive=Το ankh εκρήγνυται με ζωογόνο ενέργεια!
actors.hero.hero.search=έρευνα
actors.hero.hero.search_distracted=Είναι δύσκολο να συγκεντρωθείς, η αναζήτηση είναι εξαντλητική.
actors.hero.hero.unspent=Έχετε αχρησιμοποίητους πόντους ταλέντου!
