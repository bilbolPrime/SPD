actors.hero.hero.you_cant_have=δεν μπορείς να κουβαλήσεις: %s.
actors.hero.hero.you_now_have=Παραλάβατε: %s.
actors.hero.heroclass.cleric=κληρικός
actors.hero.heroclass.cleric_desc=Ο Κληρικός ξεκινά με έναν _μοναδικό ιερό τόμο_, τον οποίο μπορεί να χρησιμοποιήσει για να κάνει διάφορα ξόρκια.\n\nΤα περισσότερα ταλέντα του Κληρικού επικεντρώνονται στην εκμάθηση ή την αναβάθμιση ξορκιών.\n\nΟ Κληρικός ξεκινά επίσης με _ένα ρόπαλο_, υφασμάτινη πανοπλία, ένα ασκί νερού και μια βελούδινη θήκη.\n\nΟ Κληρικός αναγνωρίζει αυτόματα:\n_-_ Πάπυροι Αναγνώρισης\n_-_ Φίλτρα Αγνότητας\n_-_ Πάπυροι Αφαίρεσης Κατάρας
actors.hero.heroclass.cleric_desc_short=Ο Κληρικός είναι ένας θεϊκός ξόρκι που χρησιμοποιεί τον μοναδικό του _ιερό τόμο_ για να διοχετεύσει θεϊκή μαγεία. Μπορεί _να μάθει και να αναβαθμίσει ξόρκια_ μέσω ταλέντων.
actors.hero.heroclass.cleric_unlock=Για να ξεκλειδώσετε τον Κληρικό, καθαρίστε πλήρως την κατάρα από οποιοδήποτε κομμάτι καταραμένου εξοπλισμού.
actors.hero.heroclass.duelist=μονομαχία
actors.hero.heroclass.duelist_desc=Η Μονομάχος ξεκινά με ένα _μοναδικό ξίφος_ με μια ειδική ικανότητα που επαναφορτίζεται με την πάροδο του χρόνου.\n\nΚάθε όπλο στο παιχνίδι έχει μια _διαφορετική ειδική ικανότητα_ που μπορεί να χρησιμοποιήσει ο Μονομάχος.\n\nΗ Μονομάχος ξεκινά επίσης με _δύο αιχμές ρίψης_, υφασμάτινη πανοπλία, ένα δέρμα νερού και μια βελούδινη θήκη.\n\nΗ Μονομάχος αναγνωρίζει αυτόματα:\n_-_ Πάπυροι Αναγνώρισης\n_-_ Φίλτρα Δύναμης\n_-_ Πάπυροι Εικόνας Καθρέφτη
actors.hero.heroclass.duelist_desc_short=Η Μονομάχος είναι μια εξπέρ στα όπλα που μπορεί να χρησιμοποιήσει το όπλο της για να ενεργοποιήσει μια _ειδική ικανότητα όπλου._ Αυτή η ειδική ικανότητα είναι _διαφορετική για κάθε όπλο._
actors.hero.heroclass.duelist_unlock=Για να ξεκλειδώσετε τη Μονομαχία, εξοπλίστε ένα όπλο βαθμίδας 2 ή υψηλότερης χωρίς ποινή δύναμης.
actors.hero.heroclass.huntress=κυνηγός
actors.hero.heroclass.huntress_desc=Η Κυνηγός ξεκινά με ένα _μοναδικό πνευματικό τόξο_, το οποίο μπορεί να ρίξει άπειρο αριθμό από επικαλούμενα βέλη.\n\nΗ Κυνηγός μπορεί να ταξιδέψει μέσα σε ψηλό γρασίδι _χωρίς να το πατήσει_.\n\nΗ Κυνηγός ξεκινά επίσης με _γάντια με τρουκς_, υφασμάτινη πανοπλία, ένα υδατοσφυρί και μια βελούδινη θήκη.\n\nΗ Κυνηγός αναγνωρίζει αυτόματα:\n_-_ Πάπυροι Αναγνώρισης\n_-_ Φίλτρα Όρασης Νου\n_-_ Πάπυροι Νανουρίσματος
actors.hero.heroclass.huntress_desc_short=Η Κυνηγός είναι δεξιοτέχνης στα όπλα που ρίχνονται και έχει ένα _μαγικό τόξο_ με άπειρα βέλη. Ταξιδεύει επίσης μέσα από ψηλό χορτάρι _χωρίς να το πατάει._
actors.hero.heroclass.huntress_unlock=Για να ξεκλειδώσετε την Κυνηγό _χτυπήστε τους εχθρούς με όπλα που πετάχτηκαν 10 φορές σε ένα παιχνίδι._
actors.hero.heroclass.mage=μάγος
actors.hero.heroclass.mage_desc=Ο Μάγος ξεκινά με ένα _μοναδικό ραβδί_, το οποίο επαναφορτίζεται σημαντικά πιο γρήγορα από ένα ραβδί και έχει 1 επιπλέον φόρτιση. Το ραβδί _μπορεί να εμποτιστεί με οποιοδήποτε ραβδί_ βρει ο Μάγος στο μπουντρούμι.\n\nΟ Μάγος ξεκινά επίσης με ένα _ραβδί μαγικού πυραύλου_ εμποτισμένο στο ραβδί του, υφασμάτινη πανοπλία, ένα δέρμα νερού και μια βελούδινη θήκη.\n\nΟ Μάγος αναγνωρίζει αυτόματα:\n_-_ Πάπυροι Αναγνώρισης\n_-_ Φίλτρα Υγρής Φλόγας\n_-_ Πάπυροι Αναβάθμισης
actors.hero.heroclass.mage_desc_short=Ο Μάγος είναι ειδικός στις απόκρυφες ιστορίες και κουβαλάει ένα _μαγικό ραβδί_ που είναι πιο δυνατό από ένα ραβδί. Το ραβδί μπορεί να _εμποτιστεί με οποιοδήποτε ραβδί_ βρει ο Μάγος.
actors.hero.heroclass.mage_unlock=Για να ξεκλειδώσεις τον Μάγο _χρησιμοποίησε έναν πάπυρο αναβάθμισης για να κάνεις ένα αντικείμενο πιο δυνατό._
actors.hero.heroclass.rogue=κατεργάρης
actors.hero.heroclass.rogue_desc=Ο Απατεώνας ξεκινά με έναν _μοναδικό Μανδύα Σκιών_, τον οποίο μπορεί να χρησιμοποιήσει για να γίνει αόρατος κατά βούληση.\n\nΟ Απατεώνας μπορεί _να _εντοπίσει μυστικά και παγίδες_ από μεγαλύτερη απόσταση.\n\nΟ Απατεώνας ξεκινά επίσης με _ένα στιλέτο_, _τρία μαχαίρια ρίψης_, υφασμάτινη πανοπλία, ένα δέρμα νερού και μια βελούδινη θήκη.\n\nΟ Απατεώνας αναγνωρίζει αυτόματα:\n_-_ Πάπυροι Αναγνώρισης\n_-_ Φίλτρα Αορατότητας\n_-_ Πάπυροι Μαγείας Χαρτογράφηση
actors.hero.heroclass.rogue_desc_short=Ο Απατεώνας μπορεί να αποφύγει τους εχθρούς και να επιτεθεί από την αορατότητα χρησιμοποιώντας τον _μανδύα των σκιών_ του. Επίσης _εντοπίζει μυστικά και παγίδες_ από μεγαλύτερη απόσταση.
actors.hero.heroclass.rogue_unlock=Για να ξεκλειδώσετε τον Rogue _εκτελέστε 10 αιφνιδιαστικές επιθέσεις σε ένα παιχνίδι._
actors.hero.heroclass.warrior=πολεμιστής
actors.hero.heroclass.warrior_desc=Ο Πολεμιστής ξεκινά με μια _μοναδική σπασμένη σφραγίδα_ που του δίνει μια έκρηξη ασπίδας όταν έχει κάτω από το μισό επίπεδο ζωής. Η σφραγίδα μπορεί να μετακινηθεί μεταξύ πανοπλιών και μπορεί να _μεταφέρει μία μόνο αναβάθμιση_ μαζί της.\n\nΟ Πολεμιστής ξεκινά επίσης με ένα _φθαρμένο κοντό σπαθί_, _τρεις πέτρες ρίψης_, υφασμάτινη πανοπλία, ένα δέρμα νερού και μια βελούδινη θήκη.\n\nΟ Πολεμιστής αναγνωρίζει αυτόματα:\n_-_ Πάπυροι Αναγνώρισης\n_-_ Φίλτρα Θεραπείας\n_-_ Πάπυροι Οργής
actors.hero.heroclass.warrior_desc_short=Ο Πολεμιστής υφίσταται επιπλέον ζημιά με την ασπίδα που του παρέχει η _σπασμένη σφραγίδα_ του. Η σφραγίδα μπορεί να μετακινηθεί μεταξύ πανοπλιών και _μεταφέρει μία μόνο αναβάθμιση._
actors.hero.heroclass.warrior_unlock=Ο Πολεμιστής ξεκλειδώνεται αυτόματα.
actors.hero.herosubclass.assassin=δολοφόνος
actors.hero.herosubclass.assassin_desc=Ο Δολοφόνος προετοιμάζει το επόμενο χτύπημά του όταν γίνεται αόρατος. Όσο περισσότερο προετοιμάζεται, τόσο πιο ισχυρή θα είναι η επόμενη επίθεσή του. Η προετοιμασία διαρκεί έως και 9 γύρους.\n\nΜετά την προετοιμασία, ο Δολοφόνος προκαλεί επιπλέον ζημιά στην επόμενη επίθεσή του, μπορεί να ανοιγοκλείνει τα μάτια του προς τον στόχο του και μπορεί ακόμη και να σκοτώσει αμέσως εχθρούς που είναι αρκετά αδύναμοι.
actors.hero.herosubclass.assassin_short_desc=Ο _Δολοφόνος_ μπορεί να προετοιμάσει ένα θανατηφόρο χτύπημα όσο είναι αόρατος. Όσο περισσότερο περιμένει, τόσο πιο ισχυρή θα είναι η επίθεση.
actors.hero.herosubclass.battlemage=μάγος μάχης
actors.hero.herosubclass.battlemage_desc=Ο Μάγος της Μάχης αποκτά ένα επιπλέον εφέ κάθε φορά που χτυπάει σε μάχη σώμα με σώμα με το ραβδί του, σαν να είχε το ραβδί του μια επιπλέον γοητεία. Αυτά τα εφέ εξαρτώνται από το ραβδί με το οποίο είναι εμποτισμένο το ραβδί του, κάθε ραβδί έχει το δικό του εφέ. Εκτός από τα εφέ του ραβδιού, το ραβδί του Μάγου της Μάχης θα κερδίζει επίσης 0,5 φορτίσεις όταν χτυπάει με αυτό.
actors.hero.herosubclass.battlemage_short_desc=Ο _Μάγος Μάχης_ προκαλεί επιπλέον εφέ όταν μάχεται σε μάχη σώμα με σώμα με το ραβδί του. Αυτά τα εφέ εξαρτώνται από το ραβδί με το οποίο είναι εμποτισμένο το ραβδί του.
actors.hero.herosubclass.berserker=μαινόμενος
actors.hero.herosubclass.berserker_desc=Ο Μαινόμενος αποκτά οργή καθώς δέχεται σωματική ζημιά, συμπεριλαμβανομένης ζημιάς που μπλοκάρεται από την πανοπλία του! Η οργή εξασθενεί σταθερά με την πάροδο του χρόνου, αλλά εξασθενεί πιο αργά αν έχει χαμηλή Ζωή.\n\nΗ οργή μπορεί να προκαλέσει στον Μαινόμενο έως και +50% ζημιά. Στη μέγιστη οργή μπορεί να γίνει μανιώδης, αποκτώντας μια έκρηξη θωράκισης και διατηρώντας την οργή του για όσο του απομένει θωράκιση. Η θωράκιση κλιμακώνεται με το επίπεδο της πανοπλίας του Μαινόμενου και μπορεί να ενισχυθεί σημαντικά αν έχει χαμηλή ζωή. Ο Μαινόμενος χρειάζεται χρόνο για να ανακάμψει αφού γίνει μανιασμένος.
actors.hero.herosubclass.berserker_short_desc=Ο _Μπερζέρκερ_ αυξάνει την οργή καθώς δέχεται ζημιά. Η οργή αυξάνει τη ζημιά του και μπορεί να ενεργοποιηθεί στο 100% για μπόνους θωράκιση.
actors.hero.herosubclass.champion=πρωταθλητής
actors.hero.herosubclass.champion_desc=Η Πρωταθλήτρια είναι μια εξπέρ στα όπλα μάχης σώμα με σώμα που μπορεί να εξοπλίσει ένα δευτερεύον όπλο εκτός από το κύριο. Οι τακτικές επιθέσεις της χρησιμοποιούν το κύριο όπλο της, αλλά μπορεί να αλλάξει το κύριο όπλο της αμέσως και να χρησιμοποιήσει την ικανότητα οποιουδήποτε από τα δύο όπλα.\n\nΚερδίζει επίσης 2 ακόμη μέγιστες φορτίσεις ικανότητας όπλου και +50% ταχύτητα επαναφόρτισης ικανότητας όπλου.
actors.hero.herosubclass.champion_short_desc=Η _Πρωταθλήτρια_ μπορεί να χειριστεί δύο όπλα και να λάβει περισσότερες γομώσεις όπλων. Οι τακτικές επιθέσεις της χρησιμοποιούν το κύριο όπλο της, αλλά μπορεί να ανταλλάξει όπλα και να χρησιμοποιήσει την ικανότητα οποιουδήποτε από τα δύο όπλα.
actors.hero.herosubclass.freerunner=ελεύθερος δρομέας
actors.hero.herosubclass.freerunner_desc=Καθώς ο Freerunner κινείται, δημιουργεί στοίβες ορμής. Μπορεί να κερδίσει έως και 10 ορμές αφού τρέξει για 10 γύρους, αλλά τη χάνει γρήγορα αν σταματήσει να κινείται. Ο freerunner μπορεί να χρησιμοποιήσει την ορμή του για να ξεκινήσει το freerunning, για 2 γύρους ανά σημείο ορμής.\n\nΌταν τρέχει freerunning, ο Freerunner κινείται με 2x ταχύτητα και αποκτά μπόνους αποφυγής ανάλογα με το επίπεδό του. Μόλις τελειώσει το freerunning, υπάρχει ένας χρόνος αναμονής πριν μπορέσει να ξαναχτιστεί η ορμή.
actors.hero.herosubclass.freerunner_short_desc=Ο _Freerunner_ αποκτά ορμή καθώς τρέχει, η οποία μπορεί να χρησιμοποιηθεί για να ξεκινήσει το freerunning. Αυτό του δίνει επιπλέον ταχύτητα και δυνατότητα αποφυγής για μικρό χρονικό διάστημα.
actors.hero.herosubclass.gladiator=μονομάχος
actors.hero.herosubclass.gladiator_desc=Ο Μονομάχος δημιουργεί έναν πόντο συνδυασμού κάθε φορά που κάνει μια επιτυχημένη επίθεση με μάχη σώμα με σώμα ή με όπλο που πετάχτηκε. Εάν ο Μονομάχος δεν κάνει μια επιτυχημένη επίθεση εντός 5 στροφών (15 στροφές μετά από μια εξόντωση), ο συνδυασμός του μηδενίζεται.\n\nAΚαθώς δημιουργεί συνδυασμό, ο Μονομάχος μπορεί να χρησιμοποιήσει μια ποικιλία ικανοτήτων που είναι εγγυημένα ότι θα πετύχει:\n2 Συνδυασμός: απωθήστε τον εχθρό, διατηρήστε τον συνδυασμό\n4 Συνδυασμός: προκαλέστε ζημιά με βάση την πανοπλία\n6 Συνδυασμός: αποκρούστε, διατηρήστε τον συνδυασμό\n8 Συνδυασμός: προκαλέστε ζημιά στον στόχο και στους κοντινούς εχθρούς\n10 Συνδυασμός: επιτεθείτε μία φορά για κάθε συνδυασμό
actors.hero.herosubclass.gladiator_short_desc=Ο _Μονομάχος_ χτίζει combo όταν κάνει επιτυχημένες επιθέσεις. Μπορεί να ξοδέψει combo για να χρησιμοποιήσει μοναδικές ικανότητες.
actors.hero.herosubclass.monk=καλόγερος
actors.hero.herosubclass.monk_desc=Ο Μοναχός είναι μάστορας της φυσικής τεχνικής. Καθώς νικάει τους εχθρούς, αποκτά ενέργεια που μπορεί να χρησιμοποιηθεί σε μια ποικιλία αμυντικών και ικανοτήτων που επικεντρώνονται στη χρησιμότητα. Αυτή η ενέργεια δεν εξασθενεί με την πάροδο του χρόνου, αλλά έχει ένα όριο που βασίζεται στο επίπεδο του Μοναχού.\n\n1 Ενέργεια: χτυπήστε γρήγορα με γροθιές\n2 Ενέργεια: εστιάστε για να αποφύγετε την επόμενη επίθεση\n3 Ενέργεια: ορμήστε αμέσως κοντά\n4 Ενέργεια: κλωτσήστε έναν εχθρό μακριά\n5 Ενέργεια: διαλογιστείτε για να καθαρίσετε καταστάσεις και να επαναφέρετε το φορτίο ραβδιού και τεχνουργημάτων
actors.hero.herosubclass.monk_short_desc=Ο _Μοναχός_ συσσωρεύει ενέργεια ενώ μάχεται. Αυτή η ενέργεια μπορεί να δαπανηθεί σε μια ποικιλία μοναδικών ικανοτήτων.
actors.hero.herosubclass.paladin=ιππότης
actors.hero.herosubclass.paladin_desc=Ο Παλαδίνος αποκτά μια ποικιλία από νέα και αναβαθμισμένα ξόρκια που δίνουν έμφαση στη μάχη σώμα με σώμα και στη συνέργεια με όπλα και πανοπλίες.\n\nΤα ξόρκια _Ιερό Όπλο_ και _Ιερό Φύλακα_ του Παλαδίνου δίνουν μεγαλύτερα μπόνους, δεν παρακάμπτουν πλέον τα υπάρχοντα ξόρκια και γλύφους και μπορούν να επεκταθούν με τη χρήση άλλων ξορκιών.\n\nΟ Παλαδίνος αποκτά επίσης το ξόρκι _Πληγμή_, το οποίο του επιτρέπει να εκτελέσει ένα εγγυημένο χτύπημα σώμα με σώμα με μπόνους ζημιά και δύναμη μαγείας.
actors.hero.herosubclass.paladin_short_desc=Ο _Παλαδίνος_ αποκτά νέα ξόρκια μικρής εμβέλειας και ενδυναμωμένες εκδόσεις ιερού όπλου και ματιού.
actors.hero.herosubclass.priest=παπάς
actors.hero.herosubclass.priest_desc=Ο Ιερέας αποκτά μια ποικιλία από νέα και αναβαθμισμένα ξόρκια που δίνουν έμφαση στη μάχη από απόσταση και στη συνέργεια με μαγικά αντικείμενα.\n\nΟ Ιερέας μπορεί να χρησιμοποιήσει το _Οδηγητικό Φως_ δωρεάν μία φορά κάθε 50 γύρους, φωτίζει τους εχθρούς που στοχεύονται άμεσα από οποιοδήποτε από τα ξόρκια του και μπορεί να καταναλώσει την αποδυνάμωση του φωτισμού με συμμάχους, ραβδιά και ορισμένα αντικείμενα για επιπλέον ζημιά ίση με το επίπεδό τους + 5.\n\nΟ Ιερέας αποκτά επίσης το ξόρκι _Λάμψη_, το οποίο διαλύει το σκοτάδι και επηρεάζει όλους τους ορατούς εχθρούς, ενεργοποιώντας και εφαρμόζοντας φωτισμό και ακινητοποιώντας τους για λίγο με κόστος 2 φορτίσεις.
actors.hero.herosubclass.priest_short_desc=Ο _Ιερέας_ αποκτά νέα ξόρκια μεγάλης εμβέλειας και μια ενισχυμένη εκδοχή καθοδηγητικού φωτός.
actors.hero.herosubclass.sniper=σκοπευτής ελεύθερος
actors.hero.herosubclass.sniper_desc=Ο ελεύθερος σκοπευτής είναι ένας μάστορας της μάχης από απόσταση, του οποίου οι επιθέσεις από απόσταση διαπερνούν την πανοπλία του εχθρού. Όταν επιτίθεται σε έναν εχθρό με ένα εκτοξευόμενο όπλο, τοποθετεί ένα σημάδι ελεύθερου σκοπευτή πάνω του, το οποίο του επιτρέπει να συνεχίσει με μια ειδική επίθεση από το τόξο του. Αυτή η ειδική επίθεση ποικίλλει ανάλογα με το πώς έχει ενισχυθεί το τόξο του.\n\nΈνα μη ενισχυμένο τόξο θα εκτοξεύσει ένα στιγμιότυπο που προκαλεί μειωμένη ζημιά, αλλά πυροδοτείται αμέσως. Ένα τόξο ταχύτητας θα εκτοξεύσει μια ομοβροντία τριών βελών που προκαλούν μειωμένη ζημιά, μπορεί ακόμα να ενεργοποιήσει μαγικά και χρειάζεται 1 γύρο για να πυροβολήσει. Ένα τόξο ζημιάς θα εκτοξεύσει μια βολή ελεύθερου σκοπευτή που είναι εγγυημένη για να πετύχει, προκαλεί επιπλέον ζημιά με βάση την απόσταση και χρειάζεται 2 γύρους για να πυροβολήσει.
actors.hero.herosubclass.sniper_short_desc=Ο _Ελεύθερος Σκοπευτής_ μπορεί να διαπεράσει την πανοπλία με τις επιθέσεις του από απόσταση. Αφού χτυπήσει με ένα εκτοξευόμενο όπλο, μπορεί να ακολουθήσει με μια ειδική επίθεση από το τόξο του.
actors.hero.herosubclass.warden=φύλακας
actors.hero.herosubclass.warden_desc=Ο Φύλακας έχει μια ισχυρή σύνδεση με τη φύση, η οποία της παρέχει μια ποικιλία από επιπλέον εφέ που σχετίζονται με το γρασίδι και τα φυτά. Είναι σε θέση να βλέπει μέσα από το ψηλό και αυλακωμένο γρασίδι σαν να ήταν κενός χώρος.\n\nΟ Φύλακας κάνει το γρασίδι να φυτρώνει γύρω από κάθε σπόρο που πετάει ή φυτεύει και αποκτά ειδικά εφέ όταν ποδοπατάει φυτά. Αυτά τα ειδικά εφέ αντικαθιστούν τα κανονικά εφέ φυτών, πράγμα που σημαίνει ότι κανένα φυτό δεν είναι επιβλαβές για να το πατήσει.
actors.hero.herosubclass.warden_short_desc=Η _Φύλακας_ μπορεί να δει μέσα από ψηλό γρασίδι και αποκτά επιπλέον επιδράσεις όταν φυτεύει σπόρους και ποδοπατά φυτά.
actors.hero.herosubclass.warlock=νεκρομάντης
actors.hero.herosubclass.warlock_desc=Ο Μάγος έχει την ευκαιρία να προκαλέσει ένα σημάδι ψυχής σε χαρακτήρες όταν χρησιμοποιεί ραβδιά πάνω τους. Η πιθανότητα να εφαρμοστεί ένα σημάδι ψυχής και η διάρκειά του αυξάνονται με το επίπεδο του ραβδιού.\n\nΌταν ένας εχθρός σημαδεύεται με ψυχή, ο Μάγος θα θεραπεύσει 2 hp για κάθε 5 ζημιές που του προκαλεί, αλλά μόνο με επιθέσεις από μάχη σώμα με σώμα ή όπλα που πετιούνται, όχι από ραβδιά!
actors.hero.herosubclass.warlock_short_desc=Ο _Μάγος_ έχει την ευκαιρία να σημαδέψει τους εχθρούς με τα ραβδιά του. Θα θεραπεύσει κάθε φορά που προκαλεί σωματική ζημιά στους σημαδεμένους εχθρούς.
actors.hero.spells.auraofprotection$aurabuff.desc=Ο Παλαδίνος ακτινοβολεί προστατευτική ενέργεια γύρω του.\n\nΟποιοσδήποτε κοντινός σύμμαχος (συμπεριλαμβανομένου του ίδιου του Παλαδίνου) δέχεται μειωμένη ζημιά και αποκτά την επίδραση του γλύφου πανοπλίας του Παλαδίνου με ενισχυμένη ισχύ.\n\nΥπόλοιποι γύροι: %s.
actors.hero.spells.auraofprotection$aurabuff.name=αύρα προστασίας
actors.hero.spells.auraofprotection.desc=Ο Παλαδίνος αρχίζει να ακτινοβολεί προστατευτική ενέργεια σε μια λαμπερή αύρα γύρω του για 20 γύρους. Οποιοσδήποτε σύμμαχος εντός 2 πλακιδίων του Παλαδίνου (συμπεριλαμβανομένου του εαυτού του) δέχεται %1$d%% λιγότερη ζημιά και αποκτά την επίδραση του συμβόλου πανοπλίας του Παλαδίνου στην ισχύ +%2$d%%.\n\nΑυτή η μείωση ζημιάς λαμβάνει χώρα πριν από άλλες επιδράσεις μείωσης ζημιάς (π.χ. πανοπλία). Η ενίσχυση ισχύος του συμβόλου θα εφαρμόζεται πάντα, αλλά αυτό το ξόρκι δεν μπορεί να προκαλέσει την εφαρμογή του συμβόλου του Παλαδίνου περισσότερες από μία φορές εάν ένας χαρακτήρας ήδη επωφελείται από αυτό (π.χ. ο ίδιος ο Παλαδίνος ή μια πρισματική εικόνα).
actors.hero.spells.auraofprotection.name=αύρα προστασίας
actors.hero.spells.auraofprotection.short_desc=Ενισχύει την άμυνα για τον Παλαδίνο και τους κοντινούς συμμάχους.
actors.hero.spells.beamingray$beamingrayboost.desc=Αυτός ο σύμμαχος τηλεμεταφέρθηκε πρόσφατα από την Ακτίνα Ακτίνας Ακτίνας, δίνοντάς του επιπλέον ζημιά ενάντια στον πλησιέστερο εχθρό μετά την τηλεμεταφορά. Η Δύναμη των Πολλών επίσης δεν θα λήξει όταν αυτή η ενίσχυση είναι ενεργή.\n\nΥπόλοιποι Γύροι: %s.
actors.hero.spells.beamingray$beamingrayboost.name=ακτινοβολούσα ακτίνα
actors.hero.spells.beamingray.desc=Ο Κληρικός διοχετεύει τη δύναμη του συμμάχου του σε μια ακτίνα φωτός που τον στέλνει σε μια τοποθεσία. Εάν η ακτίνα συγκρουστεί με έναν εχθρό, θα τοποθετήσει τον σύμμαχο κοντά του και θα τον κατευθύνει προς τον εχθρό.\n\nΗ ακτίνα έχει μέγιστη εμβέλεια πλακιδίων %1$d και θα αυξήσει την επιπλέον ζημιά της Δύναμης των Πολλών σε +%2$d%% για 10 γύρους ενάντια στον πλησιέστερο εχθρό εντός 4 πλακιδίων. Η ακτίνα δέσμης μπορεί ακόμη και να τηλεμεταφέρει κανονικά ακίνητους συμμάχους, αλλά η εμβέλειά της μειώνεται στο μισό σε αυτές τις περιπτώσεις.
actors.hero.spells.beamingray.name=ακτινοβολούσα ακτίνα
actors.hero.spells.beamingray.no_space=Δεν υπάρχει χώρος για να εμφανιστεί εκεί ο σύμμαχός σου.
actors.hero.spells.beamingray.out_of_range=Αυτή η τοποθεσία είναι εκτός εμβέλειας.
actors.hero.spells.beamingray.short_desc=Τηλεμεταφέρει τον σύμμαχό σας και δίνει επιπλέον ζημιά.
actors.hero.spells.blessspell.desc=Ο Κληρικός δίνει μια ιερή ευλογία στον εαυτό του ή σε έναν άλλο χαρακτήρα που μπορεί να δει.\n\nΌταν χρησιμοποιείται στον εαυτό του, το αποτέλεσμα είναι ασθενέστερο, δίνοντας %1$d εναλλαγές ευλογίας και %2$d φράγμα.\n\nΌταν χρησιμοποιείται σε άλλους χαρακτήρες, το ξόρκι είναι πιο ισχυρό, δίνοντας %3$d εναλλαγές ευλογίας και %4$d θεραπεία. Η υπερβολική θεραπεία μετατρέπεται σε φράγμα.
actors.hero.spells.blessspell.name=ευλογώ
actors.hero.spells.blessspell.short_desc=Ευλογεί και προστατεύει τον Κληρικό, ευλογεί και θεραπεύει τους άλλους.
actors.hero.spells.bodyform$bodyformbuff.desc=Η σωματική μορφή της Τριάδας σας δίνει αυτήν τη στιγμή τη δύναμη ενός ξορκιού ή ενός γλύφου, σαν να το είχατε εξοπλισμένο στο τρέχον όπλο ή την πανοπλία σας.\n\nΣημειώστε ότι η σωματική μορφή δεν μπορεί να παρέχει ένα άλλο αντίγραφο ενός εφέ από το οποίο ήδη επωφελείστε.\n\nΤρέχον εφέ: %1$s.\n\nΥπόλοιποι γύροι: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=σωματική μορφή
actors.hero.spells.bodyform.desc=Ο Κληρικός επιλέγει ένα ξόρκι ή ένα σύμβολο που έχει αναγνωρίσει αυτήν την εκτέλεση και προσδίδει στην Τρίνιτι την επίδρασή του.\n\nΌταν χρησιμοποιείται η Τρίνιτι, ο Κληρικός αποκτά την επίδραση της επιλεγμένης γοητείας ή του σύμβολου για τους γύρους %d. Αυτή η προσωρινή γοητεία ή σύμβολο θα λειτουργήσει με οποιοδήποτε αποτέλεσμα θα λειτουργούσε με μια κανονική γοητεία ή σύμβολο.\n\nΑυτό το ξόρκι αντικαθιστά οποιοδήποτε άλλο φαινόμενο σώματος με το οποίο είναι προσκολλημένη η Τρίνιτι αυτήν τη στιγμή.
actors.hero.spells.bodyform.name=σωματική μορφή
actors.hero.spells.bodyform.short_desc=Αντιστοιχίζει στην Τριάδα μια μαγεία ή ένα γλύφωμα.
actors.hero.spells.cleanse.desc=Ο Κληρικός εξαλείφει όλες τις επιβλαβείς επιδράσεις κατάστασης στον εαυτό του και στους ορατούς συμμάχους. Μετά το τέλος του ξορκιού, όλοι οι χαρακτήρες που επηρεάζονται αποκτούν επίσης εναλλαγές ασυλίας %1$d και φραγμού %2$d.
actors.hero.spells.cleanse.name=καθαρίζω
actors.hero.spells.cleanse.short_desc=Καθαρίζει τις αποδυναμώσεις και παρέχει θωράκιση.
actors.hero.spells.clericspell.charge_cost=Κόστος χρέωσης: %d
actors.hero.spells.clericspell.invalid_enemy=Δεν μπορείς να στοχεύσεις αυτόν τον εχθρό.
actors.hero.spells.clericspell.invalid_target=Δεν μπορείτε να στοχεύσετε αυτήν την τοποθεσία.
actors.hero.spells.clericspell.no_target=Δεν υπάρχει στόχος εκεί.
actors.hero.spells.clericspell.prompt=Επιλέξτε έναν στόχο
actors.hero.spells.divineintervention.desc=Ο Κληρικός διοχετεύει τεράστια ποσότητα δύναμης από τον τόμο του στον εαυτό του και στους συμμάχους του, ενισχύοντας όλους σε θωράκιση %1$d και επεκτείνοντας την Ανυψωμένη Μορφή κατά γύρους %2$d. Η απίστευτη αμυντική δύναμη αυτού του ξορκιού ζυγίζεται σε σχέση με το πολύ υψηλό κόστος φόρτισής του.\n\nΑκριβώς όπως και άλλες θωράκισεις που παρέχονται από την ανυψωμένη μορφή, αυτή η θωράκιση δεν φθίνει κανονικά, αλλά θα λήξει αμέσως όταν τελειώσει η ανυψωμένη μορφή.
actors.hero.spells.divineintervention.name=θεϊκή παρέμβαση
actors.hero.spells.divineintervention.short_desc=Τεράστια ενίσχυση ασπίδας για τον Κληρικό και τους συμμάχους.
actors.hero.spells.divinesense$divinesensetracker.desc=Αυτός ο χαρακτήρας είναι προσωρινά σε θέση να δει άλλα κοντινά πλάσματα με το μυαλό του!\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.spells.divinesense$divinesensetracker.name=θεϊκή αίσθηση
actors.hero.spells.divinesense.desc=Ο Κληρικός εστιάζει τις αισθήσεις του στο περιβάλλον του, αποκτώντας νοητική όραση με μια σειρά πλακιδίων %d για 50 γύρους. Αυτό το ξόρκι εκτελείται χωρίς καθυστέρηση.
actors.hero.spells.divinesense.name=θεϊκή αίσθηση
actors.hero.spells.divinesense.short_desc=Αποκτήστε προσωρινή νοητική όραση σε ένα ευρύ φάσμα.
actors.hero.spells.flash.desc=Ο Κληρικός διοχετεύει την ανυψωμένη μορφή του σε μια κοντινή τοποθεσία και τηλεμεταφέρεται εκεί. Ο Φλας μπορεί να τηλεμεταφέρει τον Κληρικό σε οποιαδήποτε ανακαλυφθείσα τοποθεσία που βρίσκεται εντός εμβέλειας και είναι ακατοίκητη. Αυτό το ξόρκι κοστίζει περισσότερες χρεώσεις τόμου κάθε φορά που χρησιμοποιείται στην ίδια ανυψωμένη μορφή.
actors.hero.spells.flash.name=λάμψη
actors.hero.spells.flash.prompt=Επιλέξτε μια τοποθεσία
actors.hero.spells.flash.short_desc=Τηλεμεταφέρετε σε μια κοντινή τοποθεσία.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Ο Ιερέας θα μπορεί να χρησιμοποιήσει ξανά το Guiding Light δωρεάν μετά από 50 γύρους.\n\nΥπόλοιποι γύροι: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Οδηγητικό Φως
actors.hero.spells.guidinglight$illuminated.desc=Αυτός ο χαρακτήρας λάμπει επειδή τον χτυπάει ένα φως-οδηγός. Ενώ η λάμψη δεν είναι αρκετά δυνατή για να φωτίσει τη γύρω περιοχή, το μαγικό αποτέλεσμα θα κάνει τα χτυπήματα που θα του επιτεθούν πολύ πιο εύκολα για τον Κληρικό.
actors.hero.spells.guidinglight$illuminated.desc_generic=Άλλοι ήρωες μπορούν ακόμα να χρησιμοποιήσουν το φωτισμένο για να επωφεληθούν από το ταλέντο του καυτού φωτός, αλλά δεν θα αποκτήσουν καμία ακρίβεια.
actors.hero.spells.guidinglight$illuminated.desc_priest=Ο Ιερέας μπορεί επιπλέον να καταναλώσει φωτισμένο με ακτινοβολία, ένα χτύπημα ραβδιού, χτύπημα από σύμμαχο ή επιδράσεις από κάποια αντικείμενα. Η χρήση φωτισμένου με αυτόν τον τρόπο θα προκαλέσει μπόνους μαγική ζημιά ίση με το επίπεδο + 5 του Ιερέα.
actors.hero.spells.guidinglight$illuminated.name=φωτεινός
actors.hero.spells.guidinglight.desc=Ο Κληρικός εξαπολύει μια βολή μαγικής ενέργειας που χτυπά έναν στόχο, προκαλώντας 2-8 ζημιές και φωτίζοντάς τον. Η επόμενη μη επιβαρυμένη φυσική επίθεση που θα γίνει εναντίον ενός φωτισμένου εχθρού είναι εγγυημένη ότι θα τον χτυπήσει.
actors.hero.spells.guidinglight.desc_priest=_Αυτό το ξόρκι είναι πιο ισχυρό όταν εκτελείται από τον Ιερέα._ Η πρώτη εκτέλεση του ξορκιού κάθε 50 γύρους δεν κοστίζει χρεώσεις τόμων και η λάμψη θα καταναλώνεται από λάμψη, ραβδιά, άλλους χαρακτήρες και αντικείμενα που επηρεάζουν άμεσα τους εχθρούς. Όταν η λάμψη χρησιμοποιείται με αυτόν τον τρόπο, προκαλεί μπόνους μαγική ζημιά ίση με το επίπεδο του Ιερέα + 5.
actors.hero.spells.guidinglight.name=Οδηγητικό Φως
actors.hero.spells.guidinglight.short_desc=Προκαλεί μαγική ζημιά από απόσταση και εγγυάται ένα χτύπημα.
actors.hero.spells.hallowedground$hallowedterrain.desc=Το έδαφος έχει αγιαστεί εδώ. Το αγιασμένο έδαφος επιβραδύνει τους εχθρούς, θεραπεύει τους συμμάχους και κάνει το γρασίδι να εξαπλώνεται.
actors.hero.spells.hallowedground.desc=Ο Ιερέας εστιάζει τη θεϊκή του μαγεία στο κοντινό έδαφος, δημιουργώντας μια περιοχή %1$dx%1$d ιερού εδάφους για 20 γύρους.\n\nΌταν εκτελείται, αυτό το ξόρκι θεραπεύει όλους τους συμμάχους για 15 ΖΩΗ (οι υγιείς σύμμαχοι και ο Ιερέας λαμβάνουν ασπίδα), ριζώνει για λίγο τους εχθρούς και απλώνει κοντό γρασίδι.\n\nΤο ιερό έδαφος θεραπεύει συμμάχους για 1 ΖΩΗ ανά γύρο (οι υγιείς σύμμαχοι και ο Ιερέας λαμβάνουν ασπίδα), παραλύει τους εχθρούς και προκαλεί τυχαία την ανάπτυξη ψηλού χόρτου.\n\nΤο ιερό έδαφος καταστρέφεται από φωτιά και θα παράγει αυλακωτό γρασίδι εάν οι επιδράσεις της παθητικής αναγέννησης είναι απενεργοποιημένες ή ο Ιερέας δεν έχει αποκτήσει εμπειρία για κάποιο χρονικό διάστημα.
actors.hero.spells.hallowedground.name=ιερό έδαφος
actors.hero.spells.hallowedground.prompt=Επιλέξτε μια τοποθεσία
actors.hero.spells.hallowedground.short_desc=Θεραπεύει συμμάχους, επιβραδύνει εχθρούς και απλώνει γρασίδι σε μια περιοχή δράσης.
actors.hero.spells.holyintuition.cursed=Νιώθεις μια κακόβουλη μαγεία να παραμονεύει μέσα σε αυτό το αντικείμενο.
actors.hero.spells.holyintuition.desc=Ο Κληρικός εστιάζει τις αισθήσεις του σε ένα αντικείμενο και αποφασίζει αν είναι καταραμένο ή όχι χωρίς να χρειάζεται να το εξοπλίσει.
actors.hero.spells.holyintuition.name=ιερή διαίσθηση
actors.hero.spells.holyintuition.prompt=επιλέξτε ένα στοιχείο
actors.hero.spells.holyintuition.short_desc=προσδιορίζει αν ένα αντικείμενο είναι καταραμένο ή όχι.
actors.hero.spells.holyintuition.uncursed=Αυτό το αντικείμενο είναι απαλλαγμένο από κακόβουλη μαγεία.
actors.hero.spells.holylance$lancecooldown.desc=Ο Ιερέας έριξε πρόσφατα την Αγία Λόγχη και πρέπει να περιμένει πριν την ξαναρίξει. \n\nΣτροφές που απομένουν: %s.
actors.hero.spells.holylance$lancecooldown.name=χρόνος αναμονής για την ιερή λόγχη
actors.hero.spells.holylance.desc=Ο Ιερέας συγκεντρώνει μια μεγάλη ποσότητα ενέργειας σε μια καταστροφική λόγχη φτιαγμένη από φως. Αυτή η λόγχη προκαλεί %1$d-%2$d ζημιά και πάντα προκαλεί τη μέγιστη ζημιά σε νεκροζώντανους και δαιμονικούς στόχους.\n\nΑυτό το ξόρκι είναι πολύ ακριβό και έχει χρόνο αναμονής 30 γύρους.
actors.hero.spells.holylance.name=ιερή λόγχη
actors.hero.spells.holylance.short_desc=Προκαλεί ισχυρή μαγική ζημιά από απόσταση.
actors.hero.spells.holyward$holyarmbuff.desc=Ο Κληρικός έχει εμποτίσει την φθαρμένη πανοπλία τους με ιερή ενέργεια, παρακάμπτοντας προσωρινά οποιοδήποτε υπάρχον σύμβολο και προκαλώντας την πανοπλία να μπλοκάρει 1 επιπλέον πόντο ζημιάς.\n\nΥπόλοιποι Γύροι: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Ο Παλαδίνος έχει εμποτίσει την φθαρμένη πανοπλία του με ιερή ενέργεια, με αποτέλεσμα η πανοπλία να μπλοκάρει 3 επιπλέον πόντους ζημιάς.\n\nΗ εκτέλεση άλλων ξορκιών ενώ το ιερό φύλακα είναι ενεργό θα παρατείνει τη διάρκειά του κατά 10 γύρους ανά φόρτιση που δαπανάται.\n\nΥπόλοιποι γύροι: %s.
actors.hero.spells.holyward$holyarmbuff.name=ιερός θάλαμος
actors.hero.spells.holyward.desc=Ο Κληρικός εμποτίζει την φθαρμένη πανοπλία του με σύμβολα ιερού φωτός, αυξάνοντας το μπλοκάρισμα ζημιάς της πανοπλίας κατά 1. Αυτό το ξόρκι δεν χρειάζεται χρόνο για να εκτελεστεί.\n\nΑυτό το σύμβολο διαρκεί για 50 γύρους και θα παρακάμψει οποιοδήποτε ευεργετικό σύμβολο έχει η πανοπλία για όσο διάστημα διαρκεί. Ο Κληρικός θα επωφεληθεί από αυτό το αποτέλεσμα ακόμα κι αν δεν έχει πανοπλία.
actors.hero.spells.holyward.desc_paladin=_Αυτό το ξόρκι είναι πιο ισχυρό όταν εκτελείται από τον Παλαδίνο._ Το πρόσθετο μπλοκάρισμα ζημιάς αυξάνεται σε 3, το ξόρκι δεν παρακάμπτει πλέον τα υπάρχοντα ιερά σύμβολα και η εκτέλεση άλλων ξορκιών ενώ ο ιερός φύλακας είναι ενεργός θα παρατείνει τη διάρκειά του κατά 10 γύρους ανά φόρτιση που χρησιμοποιείται.
actors.hero.spells.holyward.glyph_desc=Αυτό το σύμβολο αυξάνει ελαφρώς την ποσότητα ζημιάς που μπορεί να μπλοκάρει η θωράκιση.
actors.hero.spells.holyward.glyph_name=%s φωτός
actors.hero.spells.holyward.name=ιερός θάλαμος
actors.hero.spells.holyward.short_desc=Παρακάμπτει προσωρινά τα γλύφοι για να ενισχύσει το μπλοκάρισμα θωράκισης.
actors.hero.spells.holyweapon$holywepbuff.desc=Ο Κληρικός έχει εμποτίσει το φθαρμένο όπλο του με ιερή ενέργεια, παρακάμπτοντας προσωρινά οποιαδήποτε υπάρχουσα γοητεία και προκαλώντας το όπλο να προκαλεί 2 επιπλέον μαγική ζημιά σε κάθε επίθεση.\n\nΥπόλοιποι Γύροι: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Ο Παλαδίνος έχει εμποτίσει το φθαρμένο όπλο του με ιερή ενέργεια, με αποτέλεσμα οι επιθέσεις του να προκαλούν 6 επιπλέον μαγική ζημιά.\n\nΗ εκτέλεση άλλων ξορκιών ενώ το ιερό όπλο είναι ενεργό θα παρατείνει τη διάρκειά του κατά 10 γύρους ανά φόρτιση που ξοδεύεται.\n\nΥπόλοιποι γύροι: %s.
actors.hero.spells.holyweapon$holywepbuff.name=ιερό όπλο
actors.hero.spells.holyweapon.desc=Ο Κληρικός μαγεύει το φθαρμένο όπλο του με ιερή ενέργεια, προκαλώντας το όπλο να προκαλεί 2 επιπλέον μαγικές ζημιές κάθε φορά που χτυπά έναν εχθρό με αυτό. Αυτό το ξόρκι δεν χρειάζεται χρόνο για να εκτελεστεί.\n\nΑυτό το ξόρκι διαρκεί 50 γύρους και θα παρακάμψει οποιαδήποτε ευεργετική μαγεία έχει το όπλο για όσο διάστημα διαρκεί. Τα άοπλα χτυπήματα μπορούν επίσης να επωφεληθούν από αυτό το αποτέλεσμα.
actors.hero.spells.holyweapon.desc_paladin=_Αυτό το ξόρκι είναι πιο ισχυρό όταν εκτελείται από τον Παλαδίνο._ Η πρόσθετη μαγική ζημιά αυξάνεται στο 6, το ξόρκι δεν αντικαθιστά πλέον τα υπάρχοντα ξόρκια και η εκτέλεση άλλων ξορκιών ενώ το ιερό όπλο είναι ενεργό θα παρατείνει τη διάρκειά του κατά 10 γύρους ανά φόρτιση που χρησιμοποιείται.
actors.hero.spells.holyweapon.ench_desc=Οι εχθροί που χτυπιούνται από ένα ιερό όπλο θα δέχονται επιπλέον μαγική ζημιά.
actors.hero.spells.holyweapon.ench_name=άγιος %s
actors.hero.spells.holyweapon.name=ιερό όπλο
actors.hero.spells.holyweapon.short_desc=Παρακάμπτει προσωρινά τα μαγικά για να ενισχύσει τη ζημιά.
actors.hero.spells.judgement.desc=Ο Κληρικός χτυπάει τη γροθιά του στο έδαφος, προκαλώντας μια έκρηξη φωτός που προκαλεί ζημιά σε όλους τους εχθρούς που μπορούν να δουν. Αυτό προκαλεί ζημιά %1$d-%2$d στη βάση, αλλά προκαλεί επίσης επιπλέον ζημιά 33%% για κάθε ξόρκι που έχει κάνει ο Κληρικός από τότε που μπήκε σε ανοδική μορφή (ή από την τελευταία φορά που χρησιμοποίησε την Κρίση).\n\nΠρος το παρόν, η Κρίση θα προκαλεί ζημιά %3$d-%4$d.
actors.hero.spells.judgement.name=κρίση
actors.hero.spells.judgement.short_desc=Προκαλεί ζημιά σε όλους τους ορατούς εχθρούς.
actors.hero.spells.layonhands.desc=Ο Παλαδίνος διοχετεύει ιερή ενέργεια μέσα από τα χέρια του, θεραπεύοντας ή προστατεύοντας οτιδήποτε αγγίζει.\n\nΟ Παλαδίνος μπορεί να κάνει αυτό το ξόρκι σε οποιονδήποτε γειτονικό χαρακτήρα για να του δώσει θεραπεία %1$d ή στον εαυτό του για να κερδίσει θωράκιση %1$d. Η υπερβολική θεραπεία από αυτό το ξόρκι μετατρέπεται σε θωράκιση.\n\nΑυτό το ξόρκι γίνεται στιγμιαία και μπορεί να γίνει επανειλημμένα, αλλά δεν μπορεί να δώσει θωράκιση αξίας περισσότερων από τριών εκμεταλλεύσεων κάθε φορά.
actors.hero.spells.layonhands.name=βάζω τα χέρια μου στα χέρια
actors.hero.spells.layonhands.short_desc=Θεραπεύει άμεσα έναν γειτονικό χαρακτήρα ή προστατεύει τον Παλαδίνο.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Ο Κληρικός χρησιμοποίησε πρόσφατα τον Σύνδεσμο Ζωής σε αυτόν τον σύμμαχο.\n\nΕκτός από τα κανονικά οφέλη του Σύνδεσμου Ζωής, αυτός ο χαρακτήρας δέχεται επίσης μειωμένη ζημιά, τυχόν θετικά ξόρκια Κληρικού εφαρμόζονται τόσο στον Κληρικό όσο και σε αυτόν τον σύμμαχο αντί μόνο σε έναν, και η Δύναμη των Πολλών δεν θα λήξει όσο είναι ενεργή αυτή η ενίσχυση.\n\nΥπόλοιποι Γύροι: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=προστασία συνδέσμων ζωής
actors.hero.spells.lifelinkspell.desc=Ο Κληρικός ενισχύει τον σύνδεσμο μεταξύ του εαυτού του και του ενδυναμωμένου συμμάχου του. Με αυτόν τον ενδυναμωμένο σύνδεσμο, οποιαδήποτε ζημιά θα δεχτεί θα μοιραστεί τόσο στον ήρωα όσο και στον σύμμαχό του για τους γύρους %1$d, και η αμυντική ενίσχυση της Δύναμης των Πολλών θα αυξηθεί σε -%2$d%% ζημιά που δέχεται. Σημειώστε ότι η ζημιά μοιράζεται μετά την πανοπλία, αλλά πριν από τη μείωση ζημιάς της Δύναμης των Πολλών.\n\nΕνώ αυτή η επίδραση είναι ενεργή, τα ευεργετικά ξόρκια Κληρικών T3 ή χαμηλότερα θα ισχύουν τόσο για τον Κληρικό όσο και για τον σύμμαχό του, εάν θα είχαν εφαρμοστεί μόνο σε έναν από αυτούς.
actors.hero.spells.lifelinkspell.name=κρίκος ζωής
actors.hero.spells.lifelinkspell.short_desc=Μοιράζεται τη ζημιά με έναν σύμμαχο και μειώνει τη ζημιά που δέχεται.
actors.hero.spells.mindform.desc=Ο Κληρικός επιλέγει ένα ραβδί ή όπλα που έχουν πεταχτεί και τα οποία έχει αναγνωρίσει σε αυτήν την κίνηση και προσδίδει στην Τρίνιτι την επίδρασή της.\n\nΌταν χρησιμοποιείται η Τρίνιτι, ο Κληρικός μπορεί να κάνει μία μόνο επίθεση σαν να χρησιμοποιούσε το επιλεγμένο αντικείμενο στο +%d. Αυτό θα ενεργοποιήσει όλα τα εφέ που θα ενεργοποιούσε κανονικά η χρήση αυτού του τύπου αντικειμένου.\n\nΑυτό το ξόρκι αντικαθιστά οποιοδήποτε άλλο εφέ μυαλού με το οποίο είναι προσκολλημένη η Τρίνιτι.
actors.hero.spells.mindform.name=μορφή νου
actors.hero.spells.mindform.short_desc=Αναθέτει στην Τριάδα ένα ραβδί ή ένα εκτοξευόμενο όπλο.
actors.hero.spells.mnemonicprayer.desc=Ο Ιερέας εκφωνεί μια προσευχή που παρατείνει τη διάρκεια όλων των ενισχύσεων ή των αποδυναμώσεων σε έναν συγκεκριμένο στόχο κατά γύρους %1$d. Αυτό το ξόρκι δεν χρειάζεται χρόνο για να εκτελεστεί. Τα θετικά αποτελέσματα θα διαρκέσουν περισσότερο στους συμμάχους (συμπεριλαμβανομένου του ίδιου του Ιερέα) και τα επιβλαβή αποτελέσματα θα διαρκέσουν περισσότερο στους εχθρούς. \n\nΗ Μνημονική Προσευχή μπορεί να επεκτείνει μια συγκεκριμένη περίπτωση ενίσχυσης ή αποδυνάμωσης μόνο μία φορά και δεν μπορεί να επεκτείνει ενισχύσεις που δίνονται από ικανότητες θωράκισης.
actors.hero.spells.mnemonicprayer.name=μνημονική προσευχή
actors.hero.spells.mnemonicprayer.short_desc=Επεκτείνει τις ενισχύσεις/αποδυναμώσεις σε έναν σύμμαχο/εχθρό και εφαρμόζει ξανά τις φωτισμένες.
actors.hero.spells.radiance.desc=Ο Ιερέας εκρήγνυται με ιερό φως, ακινητοποιώντας όλους τους ορατούς εχθρούς για 3 γύρους. Εάν ένας εχθρός είναι ήδη φωτισμένος, η Ακτινοβολία θα ενεργοποιήσει την επιπλέον ζημιά της φωτισμένης και στη συνέχεια θα εφαρμόσει την αποδυνάμωση της φωτισμένης. Η Ακτινοβολία θα κάνει επίσης τον Ιερέα να λάμπει για 100 γύρους εάν το τρέχον πάτωμα είναι σκοτεινό.
actors.hero.spells.radiance.name=ακτινοβολία
actors.hero.spells.radiance.short_desc=Φωτίζει και ακινητοποιεί για λίγο τους ορατούς εχθρούς.
actors.hero.spells.recallinscription$useditemtracker.desc=Ο Κληρικός χρησιμοποίησε πρόσφατα ένα αντικείμενο που λειτουργεί με το χαραγμένο ξόρκι ανάκλησης. Ο Κληρικός μπορεί να εκτελέσει το ξόρκι για να επαναλάβει την επίδραση του αντικειμένου.\n\nΑντικείμενο που χρησιμοποιήθηκε: %1$s.\n\nΥπόλοιποι γύροι: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=πρόσφατα χρησιμοποιημένος ρούνος
actors.hero.spells.recallinscription.desc=Ο Κληρικός χρησιμοποιεί ιερή μαγεία για να αναπαράγει την επίδραση ενός μαγικού ρούνου που βρέθηκε σε μια ρουνική πέτρα ή πάπυρο που χρησιμοποίησε στους τελευταίους γύρους %s.\n\nΗ Επιγραφή Ανάκλησης δεν μπορεί να χρησιμοποιηθεί για την αντιγραφή παπύρων αναβάθμισης. Το κόστος χρέωσης αυτού του ξορκιού ποικίλλει ανάλογα με το αντικείμενο που χρησιμοποιήθηκε πρόσφατα: 2 για μια ρουνική πέτρα, 3 για έναν πάπυρο, 4 για έναν εξωτικό πάπυρο. Αυτό το κόστος χρέωσης διπλασιάζεται επίσης κατά την αντιγραφή ενός παπύρου μεταστοιχείωσης ή αντικειμένων αλχημείας που πρέπει να κατασκευαστούν χρησιμοποιώντας μεταστοιχείωση ή αναβάθμιση.
actors.hero.spells.recallinscription.name=επιγραφή ανάκλησης
actors.hero.spells.recallinscription.short_desc=Επαναλαμβάνει μια πρόσφατα χρησιμοποιημένη ρουνική πέτρα ή κύλιση.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Μια λεπτή ασπίδα φωτός στέκεται ανάμεσα σε αυτόν τον χαρακτήρα και έναν εχθρό. Δεν είναι αρκετά ισχυρή για να μπλοκάρει άμεσα τις επιθέσεις, αλλά θα τις απαλύνει.\n\nΥπόλοιποι Γύροι: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ασπίδα φωτός
actors.hero.spells.shieldoflight.desc=Ο Κληρικός δημιουργεί ένα λεπτό φράγμα φωτός μεταξύ του εαυτού του και ενός εχθρού, αυξάνοντας την ισχύ μπλοκαρίσματος της πανοπλίας του εναντίον αυτού του εχθρού κατά %1$d-%2$d για 5 γύρους.\n\nΑυτό το ξόρκι δεν χρειάζεται χρόνο για να εκτελεστεί, αλλά δεν μπορεί να χρησιμοποιηθεί εναντίον πολλαπλών στόχων ταυτόχρονα.
actors.hero.spells.shieldoflight.name=ασπίδα φωτός
actors.hero.spells.shieldoflight.short_desc=Χορηγεί προσωρινή θωράκιση εναντίον ενός στόχου.
actors.hero.spells.smite.desc=Ο Παλαδίνος εμπλουτίζει ένα χτύπημα σώμα με σώμα με δίκαιη καταστροφική δύναμη.\n\nΕκτός από την πρόκληση κανονικής ζημιάς σώμα με σώμα, το Πλήγμα κάνει επιθέσεις χωρίς επιπλοκές που εγγυώνται επιτυχία, έχει μαγική δύναμη +300%% και προκαλεί μπόνους μαγική ζημιά %1$d - %2$d.\n\nΗ μπόνους μαγική ζημιά του Πλήγματος κλιμακώνεται με το επίπεδο του Παλαδίνου και θα προκαλεί πάντα τη μέγιστη μπόνους μαγική ζημιά εναντίον νεκροζώντανων ή δαιμονικών εχθρών.
actors.hero.spells.smite.name=χτυπώ
actors.hero.spells.smite.short_desc=Εγγυάται ένα χτύπημα με επιπλέον ζημιά και μαγική δύναμη.
actors.hero.spells.spiritform$spiritformbuff.desc=Η πνευματική μορφή της Τριάδας σας δίνει αυτήν τη στιγμή τη δύναμη ενός αντικειμένου, σαν να την είχατε εξοπλιστεί.\n\nΣημειώστε ότι η πνευματική μορφή δεν μπορεί να παρέχει ένα άλλο αντίγραφο ενός εφέ από το οποίο ήδη επωφελείστε.\n\nΤρέχον εφέ: %1$s.\n\nΥπόλοιποι γύροι: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=μορφή πνεύματος
actors.hero.spells.spiritform.desc=Ο Κληρικός επιλέγει ένα δαχτυλίδι ή τεχνούργημα που έχει αναγνωρίσει σε αυτήν την εκτέλεση (εκτός από τον ιερό τόμο) και προσδίδει στην Τριάδα την επίδρασή του.\n\nΕάν επιλεγεί ένα δαχτυλίδι, τότε η Τριάδα παραχωρεί την επίδραση αυτού του δαχτυλιδιού στο +%1$d για 20 γύρους.\n\nΕάν επιλεγεί ένα τεχνούργημα, τότε η Τριάδα αναπαράγει την επίδραση αυτού του Τεχνουργήματος στο +%2$d. Κάθε τεχνούργημα έχει διαφορετικές συγκεκριμένες συμπεριφορές και κόστος φόρτισης θωράκισης όταν χρησιμοποιείται με την Τριάδα.\n\nΑυτό το ξόρκι αντικαθιστά οποιαδήποτε άλλη πνευματική επίδραση με την οποία είναι προσωμένη η Τριάδα αυτήν τη στιγμή.
actors.hero.spells.spiritform.name=μορφή πνεύματος
actors.hero.spells.spiritform.short_desc=Αντιστοιχίζει την Τριάδα σε ένα δαχτυλίδι ή ένα τεχνούργημα.
actors.hero.spells.stasis$stasisbuff.desc=Ο Κληρικός έχει αυτήν τη στιγμή έναν σύμμαχο αποθηκευμένο σε στάση. Όλες οι θετικές επιδράσεις σε αυτόν τον σύμμαχο διατηρούνται, συμπεριλαμβανομένης της Δύναμης των Πολλών, και θα εμφανιστούν ξανά δίπλα στον Κληρικό όταν λήξει η επίδραση. Η επίδραση μπορεί επίσης να τερματιστεί πρόωρα επαναχρησιμοποιώντας τη Στάση.\n\nΣύμμαχος σε στάση: %1$s.\nΥπόλοιποι Γύροι: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Ο ακίνητος σύμμαχός σου μένει πίσω.
actors.hero.spells.stasis$stasisbuff.name=σύμμαχος σε στασιμότητα
actors.hero.spells.stasis.desc=Ο Κληρικός εστιάζει τη σύνδεσή του με τον σύμμαχό του προς τον εαυτό του, με αποτέλεσμα ο σύμμαχος να παραμένει προσωρινά σε ένα είδος ενεργειακής στάσης μέσα στον Κληρικό. Ο σύμμαχος θα διατηρηθεί για έως και 2 γύρους, με όλες τις θετικές επιδράσεις σε αυτόν να μην επηρεάζονται από τον χρόνο που βρίσκεται σε στάση.\n\nΟ σύμμαχος θα εμφανίζεται δίπλα στον Κληρικό όταν η στάση τελειώσει φυσικά ή μπορεί να επαναχρησιμοποιήσει αμέσως το ξόρκι χωρίς κόστος για να τερματίσει την επίδραση νωρίς. Η στάση μπορεί ακόμη και να μετακινήσει ακίνητους συμμάχους, αλλά δεν μπορεί να τους μεταφέρει μεταξύ ορόφων.
actors.hero.spells.stasis.name=στάση
actors.hero.spells.stasis.short_desc=Αφαιρεί συμμάχους από το μπουντρούμι και τους διαφυλάσσει.
actors.hero.spells.sunray.desc=Ο Κληρικός εξαπολύει μια ακτίνα εκτυφλωτικού φωτός σε έναν στόχο, προκαλώντας ζημιά %1$d-%2$d και τυφλώνοντάς τους για τους γύρους %3$d. Η Ηλιαχτίδα προκαλεί πάντα τη μέγιστη ζημιά σε νεκροζώντανους και δαιμονικούς στόχους.\n\nΑφού χτυπηθεί με αυτό το ξόρκι, η όραση ενός εχθρού θα προσαρμοστεί, εμποδίζοντάς τον να τυφλωθεί ξανά από αυτό. Ωστόσο, αν χτυπηθεί ξανά ενώ είναι τυφλωμένος από αυτό το ξόρκι, τότε το φως είναι συντριπτικό και τον παραλύει.
actors.hero.spells.sunray.name=ηλιαχτίδα
actors.hero.spells.sunray.short_desc=Προκαλεί μαγική ζημιά από απόσταση και προκαλεί τυφλώσεις σε έναν στόχο μία φορά.
actors.hero.spells.walloflight$lightwall.desc=Λαμπερά πάνελ φωτός εμποδίζουν το πέρασμα εδώ.
actors.hero.spells.walloflight.desc=Ο Παλαδίνος δημιουργεί έναν τοίχο φτιαγμένο από πάνελ συμπαγούς φωτός ακριβώς μπροστά του, ο οποίος έχει πάχος 1 πλακίδιο, πλάτος %1$d πλακίδια, και διαρκεί 20 γύρους.\n\nΑυτός ο τοίχος λειτουργεί ακριβώς όπως ένας κανονικός, εκτός από το ότι είναι ορατός μέσα από αυτόν. Οι εχθροί που πιάνονται στον τοίχο όταν δημιουργείται θα ακινητοποιούνται στιγμιαία και θα σπρώχνονται προς τα πίσω, αν είναι δυνατόν. Οτιδήποτε κολλήσει στον τοίχο θα μπορεί να κινηθεί έξω από αυτόν.\n\nΟ τοίχος μπορεί να εκτελεστεί σε οποιαδήποτε από τις τέσσερις βασικές ή τέσσερις διαγώνιες κατευθύνσεις. Εάν ένας τοίχος είναι ήδη ενεργός, το ξόρκι μπορεί να επαναχρησιμοποιηθεί δωρεάν για να καθαρίσει αμέσως τον τοίχο.
actors.hero.spells.walloflight.early_end=Διαλύεις το τείχος του φωτός.
actors.hero.spells.walloflight.name=τοίχος φωτός
actors.hero.spells.walloflight.short_desc=Δημιουργεί ένα τείχος που μπλοκάρει τους εχθρούς.
actors.hero.talent$aggressivebarriercooldown.desc=Χρησιμοποιήσατε πρόσφατα αυτό το ταλέντο και πρέπει να περιμένετε πριν το χρησιμοποιήσετε ξανά.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$aggressivebarriercooldown.name=επιθετική αναμονή φραγμού
actors.hero.talent$combinedlethalityabilitytracker.executed=εκτελεσμένος
actors.hero.talent$deadlyfollowuptracker.desc=Ο Μονομάχος επιτέθηκε πρόσφατα σε έναν εχθρό με ένα εκτοξευμένο όπλο, και οι επιθέσεις σώμα με σώμα εναντίον του ίδιου στόχου θα έχουν ενισχύσει τη ζημιά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$deadlyfollowuptracker.name=θανατηφόρα συνέχεια
actors.hero.talent$followupstriketracker.desc=Η Κυνηγός επιτέθηκε πρόσφατα σε έναν εχθρό με ένα εκτοξευμένο όπλο και η επόμενη επίθεσή της σώμα με σώμα εναντίον του ίδιου στόχου θα έχει ενισχύσει τη ζημιά. \n\nΓύροι που απομένουν: %s.
actors.hero.talent$followupstriketracker.name=επακόλουθη απεργία
actors.hero.talent$improvisedprojectilecooldown.desc=Χρησιμοποιήσατε πρόσφατα αυτό το ταλέντο και πρέπει να περιμένετε πριν το χρησιμοποιήσετε ξανά.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$improvisedprojectilecooldown.name=αυτοσχέδια βλήματα αναμονής
actors.hero.talent$lethalhastecooldown.desc=Χρησιμοποιήσατε πρόσφατα αυτό το ταλέντο και πρέπει να περιμένετε πριν το χρησιμοποιήσετε ξανά.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$lethalhastecooldown.name=θανατηφόρα βιασύνη αναμονής
actors.hero.talent$lingeringmagictracker.desc=Ο Μάγος χρησιμοποίησε πρόσφατα ένα ραβδί ή μπαστούνι, η επόμενη φυσική του επίθεση θα προκαλέσει επιπλέον ζημιά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$lingeringmagictracker.name=παρατεταμένη μαγεία
actors.hero.talent$liquidagilacctracker.desc=Η επόμενη κανονική επίθεση σώμα με σώμα του Μονομάχου θα αποκτήσει επιπλέον ακρίβεια.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$liquidagilacctracker.name=υγρή ευκινησία
actors.hero.talent$patientstriketracker.desc=Η Μονομάχος μόλις πέρασε έναν γύρο περιμένοντας, η επόμενη επίθεση σώμα με σώμα θα προκαλέσει επιπλέον ζημιά.
actors.hero.talent$patientstriketracker.name=απεργία ασθενών
actors.hero.talent$preciseassaulttracker.desc=Η επόμενη κανονική επίθεση σώμα με σώμα του Μονομάχου θα αποκτήσει επιπλέον ακρίβεια.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$preciseassaulttracker.name=ακριβής επίθεση
actors.hero.talent$provokedangertracker.desc=Ο Πολεμιστής έχασε πρόσφατα την ασπίδα του, η επόμενη φυσική του επίθεση θα προκαλέσει επιπλέον ζημιά.\n\nΓύροι που απομένουν: %s.
actors.hero.talent$provokedangertracker.name=προκάλεσε θυμό
actors.hero.talent$rejuvenatingstepscooldown.desc=Χρησιμοποιήσατε πρόσφατα αυτό το ταλέντο και πρέπει να περιμένετε πριν το χρησιμοποιήσετε ξανά.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=αναζωογονητικά βήματα αναζωογόνησης
actors.hero.talent$satiatedspellstracker.desc=Το επόμενο ξόρκι που θα εκτελέσει ο Κληρικός θα τους δώσει μια μικρή ποσότητα θωράκισης.
actors.hero.talent$satiatedspellstracker.name=Ξόρκι Ασπίδας
actors.hero.talent$searinglightcooldown.desc=Χρησιμοποιήσατε πρόσφατα αυτό το ταλέντο και πρέπει να περιμένετε πριν το χρησιμοποιήσετε ξανά.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$searinglightcooldown.name=Φως που καίει
actors.hero.talent$seershotcooldown.desc=Χρησιμοποιήσατε πρόσφατα αυτό το ταλέντο και πρέπει να περιμένετε πριν το χρησιμοποιήσετε ξανά.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$seershotcooldown.name=χρόνος αναμονής για βολή μάντη
actors.hero.talent$swiftequipcooldown.desc=Χρησιμοποιήσατε πρόσφατα αυτό το ταλέντο και πρέπει να περιμένετε πριν το χρησιμοποιήσετε ξανά.\n\nΥπολειπόμενοι γύροι: %s.
actors.hero.talent$swiftequipcooldown.name=γρήγορη αναμονή εξοπλισμού
actors.hero.talent.adventurers_intuition.desc=_+1:_ Η Μονομάχος αναγνωρίζει όπλα _2,5 φορές πιο γρήγορα_ και πανοπλία _1,75 φορές πιο γρήγορα_.\n\n_+2:_ Η Μονομάχος αναγνωρίζει όπλα _όταν τα εξοπλίζει_ και πανοπλία _2,5 φορές πιο γρήγορα_.
actors.hero.talent.adventurers_intuition.title=η διαίσθηση του τυχοδιώκτη
actors.hero.talent.aggressive_barrier.desc=_+1:_ Η Μονομάχος κερδίζει _3 ασπίδες_ όταν χρησιμοποιεί μια ικανότητα όπλου και έχει ζωή στο 50% ή κάτω από αυτήν.\n\n_+2:_ Η Μονομάχος κερδίζει _5 ασπίδες_ όταν χρησιμοποιεί μια ικανότητα όπλου και έχει ζωή στο 50% ή κάτω από αυτήν.
actors.hero.talent.aggressive_barrier.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα παρέχει θωράκιση όταν εκτελείτε επίθεση σώμα με σώμα με χαμηλή ζωή, με χρόνο αναμονής 50 γύρους.
actors.hero.talent.aggressive_barrier.title=επιθετικό φράγμα
actors.hero.talent.ally_warp.desc=_+1:_ Ο Μάγος μπορεί να επιλέξει έναν σύμμαχο για να ανταλλάξει αμέσως θέσεις μαζί του, με εύρος _2 πλακιδίων_.\n\n_+2:_ Ο Μάγος μπορεί να επιλέξει έναν σύμμαχο για να ανταλλάξει αμέσως θέσεις μαζί του, με εύρος _4 πλακιδίων_.\n\n_+3:_ Ο Μάγος μπορεί να επιλέξει έναν σύμμαχο για να ανταλλάξει αμέσως θέσεις μαζί του, με εύρος _6 πλακιδίων_.\n\nΟ Μάγος δεν μπορεί να ανταλλάξει θέσεις με ακίνητους συμμάχους.
actors.hero.talent.ally_warp.title=σύμμαχος στημόνι
actors.hero.talent.arcane_vision.desc=_+1:_ Όταν ο Μάγος χτυπά έναν εχθρό, αποκτά νοητική όραση πάνω του για _10 γύρους_.\n\n_+2:_ Όταν ο Μάγος χτυπά έναν εχθρό, αποκτά νοητική όραση πάνω του για _15 γύρους_.
actors.hero.talent.arcane_vision.title=απόκρυφη όραση
actors.hero.talent.assassins_reach.desc=_+1:_ Το εύρος ανοιγοκλείσματος των ματιών του Assassin ανά επίπεδο προετοιμασίας αυξάνεται σε _1/3/4/6 πλακίδια_, από 1/2/3/4.\n\n_+2:_ Το εύρος ανοιγοκλείσματος των ματιών του Assassin ανά επίπεδο προετοιμασίας αυξάνεται σε _2/4/6/8 πλακίδια_, από 1/2/3/4.\n\n_+3:_ Το εύρος ανοιγοκλείσματος των ματιών του Assassin ανά επίπεδο προετοιμασίας αυξάνεται σε _2/5/7/10 πλακίδια_, από 1/2/3/4.\n\nΑυτό το ανοιγόκλεισμα μπορεί να περάσει μέσα από κινδύνους και εχθρούς, αλλά όχι μέσα από συμπαγές έδαφος όπως τοίχους.
actors.hero.talent.assassins_reach.title=εμβέλεια του δολοφόνου
actors.hero.talent.aura_of_protection.desc=_+1:_ Ο Παλαδίνος μπορεί να χρησιμοποιήσει την _Αύρα Προστασίας,_ ένα ξόρκι που δίνει στον Παλαδίνο και σε όλους τους συμμάχους εντός 2 πλακιδίων _20% αντίσταση στη ζημιά_ και την επίδραση του γλυφώματος πανοπλίας του Παλαδίνου σε _+50% ισχύ_ για 20 γύρους, με κόστος 2 φορτίσεις.\n\n_+2:_ Ο Παλαδίνος μπορεί να χρησιμοποιήσει την _Αύρα Προστασίας,_ ένα ξόρκι που δίνει στον Παλαδίνο και σε όλους τους συμμάχους εντός 2 πλακιδίων _30% αντίσταση στη ζημιά_ και την επίδραση του γλυφώματος πανοπλίας του Παλαδίνου σε _+75% ισχύ_ για 20 γύρους, με κόστος 2 φορτίσεις.\n\n_+3:_ Ο Παλαδίνος μπορεί να χρησιμοποιήσει την _Αύρα Προστασίας,_ ένα ξόρκι που δίνει στον Παλαδίνο και σε όλους τους συμμάχους εντός 2 πλακιδίων _40% αντίσταση στη ζημιά_ και την επίδραση του γλυφώματος πανοπλίας του Παλαδίνου σε _+100% ισχύ_ για 20 στροφές, με κόστος 2 φορτίσεις.
actors.hero.talent.aura_of_protection.title=αύρα προστασίας
actors.hero.talent.backup_barrier.desc=_+1:_ Ο Μάγος κερδίζει _3 ασπίδα_ κάθε φορά που ξοδεύει την τελευταία φόρτιση στο ραβδί του.\n\n_+2:_ Ο Μάγος κερδίζει _5 ασπίδα_ κάθε φορά που ξοδεύει την τελευταία φόρτιση στο ραβδί του.
actors.hero.talent.backup_barrier.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα ενεργοποιηθεί από το ραβδί υψηλότερου επιπέδου του ήρωα.
actors.hero.talent.backup_barrier.title=εφεδρικό φράγμα
actors.hero.talent.barkskin.desc=_+1:_ Όταν πατάει στο γρασίδι, ο Φύλακας κερδίζει _0-50% του επιπέδου της_ σε πανοπλία από δέρμα φλοιού, η οποία εξασθενεί σε κάθε γύρο.\n\n_+2:_ Όταν πατάει στο γρασίδι, ο Φύλακας κερδίζει _0-100% του επιπέδου της_ σε πανοπλία από δέρμα φλοιού, η οποία εξασθενεί σε κάθε γύρο.\n\n_+3:_ Όταν πατάει στο γρασίδι, ο Φύλακας κερδίζει _0-150% του επιπέδου της_ σε πανοπλία από δέρμα φλοιού, η οποία εξασθενεί σε κάθε γύρο.
actors.hero.talent.barkskin.title=φλοιός
actors.hero.talent.beaming_ray.desc=Ο Κληρικός μπορεί να εκπέμψει την _Ακτίνα Ακτίνας_ από έναν ενδυναμωμένο σύμμαχο με κόστος 1 φόρτισης. Αυτή η ακτίνα μπορεί να διαπεράσει τοίχους και να τηλεμεταφέρει τον σύμμαχο σε μια στοχευμένη τοποθεσία. Εάν ένας εχθρός βρίσκεται σε αυτήν την τοποθεσία, ο σύμμαχος εμφανίζεται δίπλα στον εχθρό και θα τον στοχεύσει. Η Ακτίνα Ακτίνας μπορεί ακόμη και να τηλεμεταφέρει κανονικά ακίνητους συμμάχους, αλλά έχει τη μισή εμβέλεια όταν το κάνει.\n\n_+1:_ Η Ακτίνα Ακτίνας έχει μέγιστη εμβέλεια _4 πλακιδίων_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _+35% ζημιά_ ενάντια στον πλησιέστερο εχθρό για 10 γύρους.\n\n_+2:_ Η Ακτίνα Ακτίνας έχει μέγιστη εμβέλεια _8 πλακιδίων_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _+40% ζημιά_ ενάντια στον πλησιέστερο εχθρό για 10 γύρους.\n\n_+3:_ Η Ακτίνα Ακτίνας έχει μέγιστη εμβέλεια _12 πλακιδίων_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _+45% ζημιά_ ενάντια στον πλησιέστερο εχθρό για 10 γύρους.\n\n_+4:_ Η Ακτίνα Ακτίνας έχει μέγιστη εμβέλεια _16 πλακίδια,_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _+50% ζημιά_ ενάντια στον πλησιέστερο εχθρό για 10 γύρους.
actors.hero.talent.beaming_ray.title=ακτινοβολούσα ακτίνα
actors.hero.talent.blast_radius.desc=_+1:_ Η ακτίνα της έκρηξης των στοιχείων αυξάνεται σε _5 πλακίδια_, από 4.\n\n_+2:_ Η ακτίνα της έκρηξης των στοιχείων αυξάνεται σε _6 πλακίδια_, από 4.\n\n_+3:_ Η ακτίνα της έκρηξης των στοιχείων αυξάνεται σε _7 πλακίδια_, από 4.\n\n_+4:_ Η ακτίνα της έκρηξης των στοιχείων αυξάνεται σε _8 πλακίδια_, από 4.
actors.hero.talent.blast_radius.title=ακτίνα έκρηξης
actors.hero.talent.bless.desc=_+1:_ Ο Κληρικός μπορεί να χρησιμοποιήσει το _Ευλογεί,_ ένα ξόρκι που δίνει _6 γύρους ευλογίας και 10 θωράκισης_ όταν εκτελείται στον εαυτό του ή _10 γύρους ευλογίας και 10 θεραπείες_ όταν εκτελείται σε άλλο χαρακτήρα, με κόστος 1 φόρτισης.\n\n_+2:_ Ο Κληρικός μπορεί να χρησιμοποιήσει το _Ευλογεί,_ ένα ξόρκι που δίνει _10 γύρους ευλογίας και 15 θωράκισης_ όταν εκτελείται στον εαυτό του ή _15 γύρους ευλογίας και 15 θεραπείες_ όταν εκτελείται σε άλλο χαρακτήρα, με κόστος 1 φόρτισης.\n\nΗ υπερβολική θεραπεία από αυτό το ξόρκι μετατρέπεται σε θωράκιση.
actors.hero.talent.bless.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα αυξηθεί η ακρίβεια και η αποφυγή για τον ήρωα και όλους τους συμμάχους κατά 3% στο +1 ή 5% στο +2.
actors.hero.talent.bless.title=ευλογώ
actors.hero.talent.body_form.desc=Ο Κληρικός μπορεί να χρησιμοποιήσει τη _Μορφή Σώματος_, η οποία προσδίδει στην Τριάδα τη δύναμη ενός ξορκιού ή γλύφου που έχει αναγνωρίσει σε αυτήν την εκτέλεση, με κόστος 2 φορτίσεις.\n\n_+1:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά το επιλεγμένο εφέ για _20 γύρους._\n\n_+2:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά το επιλεγμένο εφέ για _27 γύρους._\n\n_+3:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά το επιλεγμένο εφέ για _33 γύρους._\n\n_+4:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός αποκτά το επιλεγμένο εφέ για _40 γύρους._\n\nΗ Τριάδα μπορεί να προστεθεί μόνο σε ένα εφέ σώματος κάθε φορά. Το κόστος φόρτισης θωράκισης της Trinity είναι υψηλότερο αν το επιλεγμένο σύμβολο είναι σπάνιο και ισχυρό.
actors.hero.talent.body_form.title=σωματική μορφή
actors.hero.talent.body_replacement.desc=_+1:_ Αφού αναβοσβήσει, ο Rogue αφήνει ένα ξύλινο δόλωμα πίσω του που έχει _20 ζωή και 1-3 θωράκιση_.\n\n_+2:_ Αφού αναβοσβήσει, ο Rogue αφήνει ένα ξύλινο δόλωμα πίσω του που έχει _40 ζωή και 2-6 θωράκιση_.\n\n_+3:_ Αφού αναβοσβήσει, ο Rogue αφήνει ένα ξύλινο δόλωμα πίσω του που έχει _60 ζωή και 3-9 θωράκιση_.\n\n_+4:_ Αφού αναβοσβήσει, ο Rogue αφήνει ένα ξύλινο δόλωμα πίσω του που έχει _80 ζωή και 4-12 θωράκιση_.\n\nΜόνο ένα δόλωμα μπορεί να είναι ενεργό κάθε φορά.
actors.hero.talent.body_replacement.title=αντικατάσταση σώματος
actors.hero.talent.body_slam.desc=_+1:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί δέχονται ζημιά ίση με _1-4 συν 25%_ της δύναμης αποκλεισμού ζημιάς του.\n\n_+2:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί δέχονται ζημιά ίση με _2-8 συν 50%_ της δύναμης αποκλεισμού ζημιάς του.\n\n_+3:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί δέχονται ζημιά ίση με _3-12 συν 75%_ της δύναμης αποκλεισμού ζημιάς του.\n\n_+4:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί δέχονται ζημιά ίση με _4-16 συν 100%_ της δύναμης αποκλεισμού ζημιάς του.
actors.hero.talent.body_slam.title=χτύπημα σώματος
actors.hero.talent.bounty_hunter.desc=_+1:_ Όταν ο Assassin σκοτώνει έναν εχθρό με προετοιμασμένο χτύπημα, η πιθανότητα πτώσης αντικειμένου αυξάνεται κατά _2/4/8/16%_, ανά επίπεδο προετοιμασίας.\n\n_+2:_ Όταν ο Assassin σκοτώνει έναν εχθρό με προετοιμασμένο χτύπημα, η πιθανότητα πτώσης αντικειμένου αυξάνεται κατά _4/8/16/32%_, ανά επίπεδο προετοιμασίας.\n\n_+3:_ Όταν ο Assassin σκοτώνει έναν εχθρό με προετοιμασμένο χτύπημα, η πιθανότητα πτώσης αντικειμένου αυξάνεται κατά _6/12/24/48%_, ανά επίπεδο προετοιμασίας.
actors.hero.talent.bounty_hunter.title=κυνηγός κεφαλών
actors.hero.talent.cached_rations.desc=_+1:_ Ο Απατεώνας μπορεί να βρει _2 μερίδες προμηθειών_ τοποθετημένες σε κιβώτια, ενώ εξερευνά τους επόμενους ορόφους του μπουντρουμιού.\n\n_+2:_ Ο Απατεώνας μπορεί να βρει _3 μερίδες προμηθειών_ τοποθετημένες σε κιβώτια, ενώ εξερευνά τους επόμενους ορόφους του μπουντρουμιού.\n\nΟι μερίδες προμηθειών καταναλώνονται γρήγορα, αποκαθιστούν μια μέτρια ποσότητα κορεσμού, θεραπεύουν 5 hp και αποκαθιστούν 1 φόρτιση στον μανδύα των σκιών.
actors.hero.talent.cached_rations.title=αποθηκευμένες μερίδες
actors.hero.talent.cleanse.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει το _Καθαρισμός,_ ένα ξόρκι που _αφαιρεί τα αρνητικά εφέ κατάστασης_ από τον Κληρικό και τυχόν κοντινούς συμμάχους και τους δίνει _10 ασπίδα,_ με κόστος 2 φορτίσεις.\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει το _Καθαρισμός,_ ένα ξόρκι που _χορηγεί 3 γύρους ασυλίας αρνητικής κατάστασης_ στον Κληρικό και τυχόν κοντινούς συμμάχους και τους δίνει _20 ασπίδα,_ με κόστος 2 φορτίσεις.\n\n_+3:_ Ο Κληρικός μπορεί να εκτελέσει το _Καθαρισμός,_ ένα ξόρκι που _χορηγεί 5 γύρους ασυλίας αρνητικής κατάστασης_ στον Κληρικό και τυχόν κοντινούς συμμάχους και τους δίνει _30 ασπίδα,_ με κόστος 2 φορτίσεις.
actors.hero.talent.cleanse.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα καθαρίσει αντ' αυτού τις αρνητικές επιδράσεις κατάστασης στον ήρωα μετά τη χρήση ενός ραβδιού ή τεχνουργήματος, 10/20/30% του χρόνου στο +1/+2/+3.
actors.hero.talent.cleanse.title=καθαρίζω
actors.hero.talent.cleave.desc=_+1:_ Ο επιπλέον χρόνος που ο Μονομάχος καταφέρνει να σκοτώσει αυξάνεται σε _30 γύρους_, από 15.\n\n_+2:_ Ο επιπλέον χρόνος που ο Μονομάχος καταφέρνει να σκοτώσει αυξάνεται σε _45 γύρους_, από 15.\n\n_+3:_ Ο επιπλέον χρόνος που ο Μονομάχος καταφέρνει να σκοτώσει αυξάνεται σε _60 γύρους_, από 15.
actors.hero.talent.cleave.title=σχίζω
actors.hero.talent.cloned_armor.desc=_+1:_ Ο κλώνος της σκιάς κερδίζει _12%_ της αξίας πανοπλίας του ήρωα και έχει _25% πιθανότητα_ να χρησιμοποιήσει το σύμβολο στην πανοπλία του ήρωα.\n\n_+2:_ Ο κλώνος της σκιάς κερδίζει _24%_ της αξίας πανοπλίας του ήρωα και έχει _50% πιθανότητα_ να χρησιμοποιήσει το σύμβολο στην πανοπλία του ήρωα.\n\n_+3:_ Ο κλώνος της σκιάς κερδίζει _36%_ της αξίας πανοπλίας του ήρωα και έχει _75% πιθανότητα_ να χρησιμοποιήσει το σύμβολο στην πανοπλία του ήρωα.\n\n_+4:_ Ο κλώνος της σκιάς κερδίζει _48%_ της αξίας πανοπλίας του ήρωα και έχει _100% πιθανότητα_ να χρησιμοποιήσει το σύμβολο στην πανοπλία του ήρωα.
actors.hero.talent.cloned_armor.title=κλωνοποιημένη πανοπλία
actors.hero.talent.close_the_gap.desc=_+1:_ Η Μονομάχος αναβοσβήνει _έως δύο πλακίδια_ προς τον στόχο της όταν ξεκινά μια μονομαχία.\n\n_+2:_ Η Μονομάχος αναβοσβήνει _έως τρία πλακίδια_ προς τον στόχο της όταν ξεκινά μια μονομαχία.\n\n_+3:_ Η Μονομάχος αναβοσβήνει _έως τέσσερα πλακίδια_ προς τον στόχο της όταν ξεκινά μια μονομαχία.\n\n_+4:_ Η Μονομάχος αναβοσβήνει _έως πέντε πλακίδια_ προς τον στόχο της όταν ξεκινά μια μονομαχία.\n\nΑυτό το ανοιγοκλείσιμο μπορεί να περάσει μέσα από κινδύνους και εχθρούς, αλλά όχι από συμπαγές έδαφος όπως τοίχους. Το ανοιγοκλείσιμο λαμβάνεται υπόψη όταν καθορίζεται εάν ένας εχθρός βρίσκεται σε εμβέλεια για να προκληθεί.
actors.hero.talent.close_the_gap.title=κλείσε το χάσμα
actors.hero.talent.combined_energy.desc=_+1:_ Εάν ο Μοναχός χρησιμοποιήσει μια ικανότητα όπλου και μια ικανότητα _4+ ενέργειας_ εντός 5 γύρων η μία από την άλλη, ανακτά 1 ξοδευμένη ενέργεια.\n\n_+2:_ Εάν ο Μοναχός χρησιμοποιήσει μια ικανότητα όπλου και μια ικανότητα _3+ ενέργειας_ εντός 5 γύρων η μία από την άλλη, ανακτά 1 ξοδευμένη ενέργεια.\n\n_+3:_ Εάν ο Μοναχός χρησιμοποιήσει μια ικανότητα όπλου και μια ικανότητα _2+ ενέργειας_ εντός 5 γύρων η μία από την άλλη, ανακτά 1 ξοδευμένη ενέργεια.
actors.hero.talent.combined_energy.title=συνδυασμένη ενέργεια
actors.hero.talent.combined_lethality.desc=_+1:_ Εάν ο Πρωταθλητής επιτεθεί με όπλο μάχης σώμα με σώμα αμέσως μετά τη χρήση της ικανότητας διαφορετικού όπλου, η επίθεση αυτή θα εκτελέσει οποιονδήποτε εχθρό που δεν είναι αρχηγός και έχει _κάτω από 13% HP_.\n\n_+2:_ Εάν ο Πρωταθλητής επιτεθεί με όπλο μάχης σώμα με σώμα αμέσως μετά τη χρήση της ικανότητας διαφορετικού όπλου, η επίθεση αυτή θα εκτελέσει οποιονδήποτε εχθρό που δεν είναι αρχηγός και έχει _κάτω από 27% HP_.\n\n_+3:_ Εάν ο Πρωταθλητής επιτεθεί με όπλο μάχης σώμα με σώμα αμέσως μετά τη χρήση της ικανότητας διαφορετικού όπλου, η επίθεση αυτή θα εκτελέσει οποιονδήποτε εχθρό που δεν είναι αρχηγός και έχει _κάτω από 40% HP_.\n\nΑυτή η επίθεση μπορεί να είναι μια κανονική επίθεση με όπλο μάχης σώμα με σώμα ή μέρος μιας ικανότητας όπλου.
actors.hero.talent.combined_lethality.title=συνδυασμένη θνησιμότητα
actors.hero.talent.conserved_magic.desc=_+1:_ Κάθε χτύπημα από άγρια μαγεία χρησιμοποιεί πλέον _0,33 φορτίσεις_ αντί για 0,5, και η άγρια μαγεία έχει _25% πιθανότητα_ να μην ξοδέψει ούτε έναν γύρο.\n\n_+2:_ Κάθε χτύπημα από άγρια μαγεία χρησιμοποιεί πλέον _0,225 φορτίσεις_ αντί για 0,5, και η άγρια μαγεία έχει _50% πιθανότητα_ να μην ξοδέψει ούτε έναν γύρο.\n\n_+3:_ Κάθε χτύπημα από άγρια μαγεία χρησιμοποιεί πλέον _0,15 φορτίσεις_ αντί για 0,5, και η άγρια μαγεία έχει _75% πιθανότητα_ να μην ξοδέψει ούτε έναν γύρο.\n\n_+4:_ Κάθε χτύπημα από άγρια μαγεία χρησιμοποιεί πλέον _0,1 φορτίσεις_ αντί για 0,5, και η άγρια μαγεία έχει _100% πιθανότητα_ να μην ξοδέψει ούτε έναν γύρο.
actors.hero.talent.conserved_magic.title=διατηρημένη μαγεία
actors.hero.talent.counter_ability.desc=_+1:_ Εάν η Μονομάχος χρησιμοποιήσει μια ικανότητα όπλου εντός 3 γύρων από την επίθεση στην εικόνα της, θα ανακτήσει αμέσως _0,38 φορτίσεις_.\n\n_+2:_ Εάν η Μονομάχος χρησιμοποιήσει μια ικανότητα όπλου εντός 3 γύρων από την επίθεση στην εικόνα της, θα ανακτήσει αμέσως _0,77 φορτίσεις_.\n\n_+3:_ Εάν η Μονομάχος χρησιμοποιήσει μια ικανότητα όπλου εντός 3 γύρων από την επίθεση στην εικόνα της, θα ανακτήσει αμέσως _1,13 φορτίσεις_.\n\n_+4:_ Εάν η Μονομάχος χρησιμοποιήσει μια ικανότητα όπλου εντός 3 γύρων από την επίθεση στην εικόνα της, θα ανακτήσει αμέσως _1,5 φορτίσεις_.
actors.hero.talent.counter_ability.title=ικανότητα αντεπίθεσης
actors.hero.talent.deadly_followup.desc=_+1:_ Όταν η Μονομάχος χτυπήσει έναν εχθρό με ένα εκτοξευμένο όπλο, θα του προκαλέσει _10% περισσότερη ζημιά σε μάχη σώμα με σώμα_ για 5 γύρους.\n\n_+2:_ Όταν η Μονομάχος χτυπήσει έναν εχθρό με ένα εκτοξευμένο όπλο, θα του προκαλέσει _20% περισσότερη ζημιά σε μάχη σώμα με σώμα_ για 5 γύρους.\n\n_+3:_ Όταν η Μονομάχος χτυπήσει έναν εχθρό με ένα εκτοξευμένο όπλο, θα του προκαλέσει _30% περισσότερη ζημιά σε μάχη σώμα με σώμα_ για 5 γύρους.
actors.hero.talent.deadly_followup.title=θανατηφόρα συνέχεια
actors.hero.talent.deathless_fury.desc=_+1:_ Το Berserk ενεργοποιείται αυτόματα εάν ο Berserker πρόκειται να πεθάνει και η οργή είναι στο 100% ή πάνω, αλλά έχει χρόνο αναμονής _3 επίπεδα ήρωα_ όταν συμβεί αυτό.\n\n_+2:_ Το Berserk ενεργοποιείται αυτόματα εάν ο Berserker πρόκειται να πεθάνει και η οργή είναι στο 100% ή πάνω, αλλά έχει χρόνο αναμονής _2 επίπεδα ήρωα_ όταν συμβεί αυτό.\n\n_+3:_ Το Berserk ενεργοποιείται αυτόματα εάν ο Berserker πρόκειται να πεθάνει και η οργή είναι στο 100% ή πάνω, αλλά έχει χρόνο αναμονής _1 επίπεδο ήρωα_ όταν συμβεί αυτό.\n\nΣημειώστε ότι ο Berserker θα πεθάνει ακόμα εάν έχει 0 Ζωή όταν τελειώσει το berserking.
actors.hero.talent.deathless_fury.title=αθάνατη οργή
actors.hero.talent.deathly_durability.desc=_+1:_ Οι εχθροί που σκοτώνονται με το σημάδι θανάτου δίνουν στην θωράκιση Rogue ίση με _13%_ της hp τους όταν σημαδεύτηκαν.\n\n_+2:_ Οι εχθροί που σκοτώνονται με το σημάδι θανάτου δίνουν στην θωράκιση Rogue ίση με _25%_ της hp τους όταν σημαδεύτηκαν.\n\n_+3:_ Οι εχθροί που σκοτώνονται με το σημάδι θανάτου δίνουν στην θωράκιση Rogue ίση με _38%_ της hp τους όταν σημαδεύτηκαν.\n\n_+4:_ Οι εχθροί που σκοτώνονται με το σημάδι θανάτου δίνουν στην θωράκιση Rogue ίση με _50%_ της hp τους όταν σημαδεύτηκαν.
actors.hero.talent.deathly_durability.title=θανάσιμη ανθεκτικότητα
actors.hero.talent.desperate_power.desc=_+1:_ Τα ραβδιά και το μπαστούνι του Μάγου κερδίζουν _+1 επίπεδο_ στο τελικό τους χτύπημα όταν έχουν φτάσει στην τελευταία τους φόρτιση.\n\n_+2:_ Τα ραβδιά και το μπαστούνι του Μάγου κερδίζουν _+2 επίπεδα_ στο τελικό τους χτύπημα όταν έχουν φτάσει στην τελευταία τους φόρτιση.\n\n_+3:_ Τα ραβδιά και το μπαστούνι του Μάγου κερδίζουν _+3 επίπεδα_ στο τελικό τους χτύπημα όταν έχουν φτάσει στην τελευταία τους φόρτιση.
actors.hero.talent.desperate_power.title=απεγνωσμένη δύναμη
actors.hero.talent.directed_power.desc=_+1:_ Η άμεση επίθεση από στοιχειακό χτύπημα κερδίζει _+30% μαγευτική δύναμη_ για κάθε εχθρό εντός εμβέλειας του αποτελέσματος του στοιχειακού χτυπήματος, συμπεριλαμβανομένου του στόχου επίθεσης.\n\n_+2:_ Η άμεση επίθεση από στοιχειακό χτύπημα κερδίζει _+60% μαγευτική δύναμη_ για κάθε εχθρό εντός εμβέλειας του αποτελέσματος του στοιχειακού χτυπήματος, συμπεριλαμβανομένου του στόχου επίθεσης.\n\n_+3:_ Η άμεση επίθεση από στοιχειακό χτύπημα κερδίζει _+90% μαγευτική δύναμη_ για κάθε εχθρό εντός εμβέλειας του αποτελέσματος του στοιχειακού χτυπήματος, συμπεριλαμβανομένου του στόχου επίθεσης.\n\n_+4:_ Η άμεση επίθεση από στοιχειακό χτύπημα κερδίζει _+120% μαγευτική δύναμη_ για κάθε εχθρό εντός εμβέλειας του αποτελέσματος του στοιχειακού χτυπήματος, συμπεριλαμβανομένου του στόχου επίθεσης.
actors.hero.talent.directed_power.title=κατευθυνόμενη ισχύς
actors.hero.talent.divine_intervention.desc=_+1:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Θεία Επέμβαση,_ η οποία ενισχύει τον Κληρικό και όλους τους συμμάχους έως _150 θωράκιση_ και επεκτείνει την Ανυψωμένη Μορφή κατά _3 γύρους._\n\n_+2:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Θεία Επέμβαση,_ η οποία ενισχύει τον Κληρικό και όλους τους συμμάχους έως _200 θωράκιση_ και επεκτείνει την Ανυψωμένη Μορφή κατά _4 γύρους._\n\n_+3:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Θεία Επέμβαση,_ η οποία ενισχύει τον Κληρικό και όλους τους συμμάχους έως _250 θωράκιση_ και επεκτείνει την Ανυψωμένη Μορφή κατά _5 γύρους._\n\n_+4:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Θεία Επέμβαση,_ η οποία ενισχύει την Κληρικός και όλοι οι σύμμαχοι έχουν έως _300 θωράκιση_ και επεκτείνουν την Ανυψωμένη Μορφή κατά _6 γύρους._\n\nΗ Θεϊκή Επέμβαση κοστίζει ένα τεράστιο ποσό 5 τόμων και μπορεί να εκτελεστεί μόνο μία φορά στην ίδια ανυψωμένη μορφή.
actors.hero.talent.divine_intervention.title=θεϊκή παρέμβαση
actors.hero.talent.divine_sense.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει το _Θεία Αίσθηση,_ ένα ξόρκι που του δίνει _8 πλακίδια_ Όρασης Νοός για 50 γύρους και δεν χρειάζεται χρόνο για να εκτελέσει, με κόστος 2 φορτίσεις.\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει το _Θεία Αίσθηση,_ ένα ξόρκι που του δίνει _12 πλακίδια_ Όρασης Νοός για 50 γύρους και δεν χρειάζεται χρόνο για να εκτελέσει, με κόστος 2 φορτίσεις.
actors.hero.talent.divine_sense.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα του δώσει νοητική όραση για μια σύντομη στιγμή μετά τη χρήση ενός ραβδιού ή τεχνουργήματος με εύρος 3 πλακιδίων στο +1 ή 5 πλακιδίων στο +2.
actors.hero.talent.divine_sense.title=θεϊκή αίσθηση
actors.hero.talent.double_jump.desc=_+1:_ Εάν ο Πολεμιστής εκτελέσει ένα δεύτερο άλμα εντός 3 γύρων, αυτό το άλμα έχει _16% μειωμένο_ κόστος χρέωσης.\n\n_+2:_ Εάν ο Πολεμιστής εκτελέσει ένα δεύτερο άλμα εντός 3 γύρων, αυτό το άλμα έχει _30% μειωμένο_ κόστος χρέωσης.\n\n_+3:_ Εάν ο Πολεμιστής εκτελέσει ένα δεύτερο άλμα εντός 3 γύρων, αυτό το άλμα έχει _40% μειωμένο_ κόστος χρέωσης.\n\n_+4:_ Εάν ο Πολεμιστής εκτελέσει ένα δεύτερο άλμα εντός 3 γύρων, αυτό το άλμα έχει _50% μειωμένο_ κόστος χρέωσης.
actors.hero.talent.double_jump.title=διπλό άλμα
actors.hero.talent.double_mark.desc=_+1:_ Η σήμανση ενός δεύτερου στόχου ταυτόχρονα με τον πρώτο έχει _30% μειωμένο_ κόστος χρέωσης.\n\n_+2:_ Η σήμανση ενός δεύτερου στόχου ταυτόχρονα με τον πρώτο έχει _50% μειωμένο_ κόστος χρέωσης.\n\n_+3:_ Η σήμανση ενός δεύτερου στόχου ταυτόχρονα με τον πρώτο έχει _65% μειωμένο_ κόστος χρέωσης.\n\n_+4:_ Η σήμανση ενός δεύτερου στόχου ταυτόχρονα με τον πρώτο έχει _75% μειωμένο_ κόστος χρέωσης.
actors.hero.talent.double_mark.title=διπλό σημάδι
actors.hero.talent.durable_projectiles.desc=_+1:_ Τα πετούμενα όπλα έχουν _+50% ανθεκτικότητα_ όταν χρησιμοποιούνται από την Κυνηγό.\n\n_+2:_ Τα πετούμενα όπλα έχουν _+75% ανθεκτικότητα_ όταν χρησιμοποιούνται από την Κυνηγό.
actors.hero.talent.durable_projectiles.title=ανθεκτικά βλήματα
actors.hero.talent.durable_tips.desc=_+1:_ Τα βελάκια με μύτη έχουν _2x ανθεκτικότητα_ όταν τα χρησιμοποιεί ο Φύλακας.\n\n_+2:_ Τα βελάκια με μύτη έχουν _3x ανθεκτικότητα_ όταν τα χρησιμοποιεί ο Φύλακας.\n\n_+3:_ Τα βελάκια με μύτη έχουν _4x ανθεκτικότητα_ όταν τα χρησιμοποιεί ο Φύλακας.
actors.hero.talent.durable_tips.title=ανθεκτικές άκρες
actors.hero.talent.eagle_eye.desc=_+1:_ Το εύρος όρασης του πνευματικού γερακιού αυξάνεται σε _7 πλακίδια_ από 6.\n\n_+2:_ Το εύρος όρασης του πνευματικού γερακιού αυξάνεται σε _8 πλακίδια_ από 6.\n\n_+3:_ Το εύρος όρασης του πνευματικού γερακιού αυξάνεται σε _9 πλακίδια_ από 6 και αποκτά _2 πλακίδια_ νοητικής όρασης.\n\n_+4:_ Το εύρος όρασης του πνευματικού γερακιού αυξάνεται σε _10 πλακίδια_ από 6 και αποκτά _3 πλακίδια_ νοητικής όρασης.
actors.hero.talent.eagle_eye.title=μάτι του αετού
actors.hero.talent.elemental_power.desc=_+1:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _25%_.\n\n_+2:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _50%_.\n\n_+3:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _75%_.\n\n_+4:_ Η ισχύς της στοιχειακής έκρηξης αυξάνεται κατά _100%_.
actors.hero.talent.elemental_power.title=στοιχειακή δύναμη
actors.hero.talent.elemental_reach.desc=_+1:_ Η εμβέλεια του στοιχειακού χτυπήματος αυξάνεται σε _5 πλακίδια_ από 4 και το πλάτος του αυξάνεται σε _75 μοίρες_ από 65.\n\n_+2:_ Η εμβέλεια του στοιχειακού χτυπήματος αυξάνεται σε _6 πλακίδια_ από 4 και το πλάτος του αυξάνεται σε _85 μοίρες_ από 65.\n\n_+3:_ Η εμβέλεια του στοιχειακού χτυπήματος αυξάνεται σε _7 πλακίδια_ από 4 και το πλάτος του αυξάνεται σε _95 μοίρες_ από 65.\n\n_+4:_ Η εμβέλεια του στοιχειακού χτυπήματος αυξάνεται σε _8 πλακίδια_ από 4 και το πλάτος του αυξάνεται σε _105 μοίρες_ από 65.
actors.hero.talent.elemental_reach.title=στοιχειώδης εμβέλεια
actors.hero.talent.elimination_match.desc=_+1:_ Εάν ο Μονομάχος προκαλέσει ξανά εντός 3 γύρων από το τέλος μιας μονομαχίας, η πρόκληση αυτή έχει _16% μειωμένο_ κόστος χρέωσης.\n\n_+2:_ Εάν ο Μονομάχος προκαλέσει ξανά εντός 3 γύρων από το τέλος μιας μονομαχίας, η πρόκληση αυτή έχει _30% μειωμένο_ κόστος χρέωσης.\n\n_+3:_ Εάν ο Μονομάχος προκαλέσει ξανά εντός 3 γύρων από το τέλος μιας μονομαχίας, η πρόκληση αυτή έχει _40% μειωμένο_ κόστος χρέωσης.\n\n_+4:_ Εάν ο Μονομάχος προκαλέσει ξανά εντός 3 γύρων από το τέλος μιας μονομαχίας, η πρόκληση αυτή έχει _50% μειωμένο_ κόστος χρέωσης.
actors.hero.talent.elimination_match.title=αγώνας αποκλεισμού
actors.hero.talent.empowered_strike.desc=_+1:_ Το πρώτο χτύπημα σώμα με σώμα του Μάγου Μάγου με το ραβδί του μετά από χτύπημα με αυτό προκαλεί _+16% ζημιά_ και το επιπλέον αποτέλεσμα του ραβδιού παίρνει _+50% δύναμη_.\n\n_+2:_ Το πρώτο χτύπημα σώμα με σώμα του Μάγου με το ραβδί του μετά από χτύπημα με αυτό προκαλεί _+33% ζημιά_ και το επιπλέον αποτέλεσμα του ραβδιού παίρνει _+100% δύναμη_.\n\n_+3:_ Το πρώτο χτύπημα σώμα με σώμα του Μάγου με το ραβδί του μετά από χτύπημα με αυτό προκαλεί _+50% ζημιά_ και το επιπλέον αποτέλεσμα του ραβδιού παίρνει _+150% δύναμη_.
actors.hero.talent.empowered_strike.title=εξουσιοδοτημένη απεργία
actors.hero.talent.empowering_meal.desc=_+1:_ Η κατανάλωση φαγητού δίνει στον Μάγο _2 επιπλέον ζημιά_ στις επόμενες 3 φορές που προκαλεί ζημιά με ένα ραβδί.\n\n_+2:_ Η κατανάλωση φαγητού δίνει στον Μάγο _3 επιπλέον ζημιά_ στις επόμενες 3 φορές που προκαλεί ζημιά με ένα ραβδί.
actors.hero.talent.empowering_meal.title=ενδυναμωτικό γεύμα
actors.hero.talent.endless_rage.desc=_+1:_ Ο Berserker μπορεί να φτάσει σε μέγιστο _116% οργή_.\n\n_+2:_ Ο Berserker μπορεί να φτάσει σε μέγιστο _133% οργή_.\n\n_+3:_ Ο Berserker μπορεί να φτάσει σε μέγιστο _150% οργή_.\n\nΚάθε σημείο οργής πάνω από 100% αυξάνει την θωράκιση Berserk κατά 1% και μειώνει τον χρόνο αναμονής κατά 1%, αλλά δεν αυξάνει το μπόνους ζημιάς πέρα από +50%.
actors.hero.talent.endless_rage.title=ατελείωτη οργή
actors.hero.talent.energizing_meal.desc=_+1:_ Η κατανάλωση φαγητού παίρνει τη σειρά του Μάγου 1 και του δίνει _5 περιστροφές επαναφόρτισης του ραβδιού_.\n\n_+2:_ Η κατανάλωση φαγητού παίρνει τη σειρά του Μάγου 1 και του δίνει _8 περιστροφές επαναφόρτισης του ραβδιού_.
actors.hero.talent.energizing_meal.title=ενεργειακό γεύμα
actors.hero.talent.enhanced_combo.desc=_+1:_ Όταν ο συνδυασμός του Μονομάχου είναι 7 ή υψηλότερος, η εμβέλεια ανάκρουσης του Clobber αυξάνεται στο 3, προκαλεί ίλιγγο και μπορεί να ρίξει τους εχθρούς σε λάκκους.\n\n_+2:_ Εκτός από τα οφέλη του +1, όταν ο συνδυασμός του Μονομάχου είναι 9 ή υψηλότερος, ο Parry λειτουργεί σε πολλαπλές επιθέσεις.\n\n_+3:_ Εκτός από τα οφέλη του +1 και του +2, ο Μονομάχος μπορεί να πηδήξει μέχρι τα πλακίδια συνδυασμού/3 όταν χρησιμοποιεί Slam, Crush ή Fury.
actors.hero.talent.enhanced_combo.title=βελτιωμένος συνδυασμός
actors.hero.talent.enhanced_lethality.desc=_+1:_ Ο Δολοφόνος μπορεί να δολοφονήσει εχθρούς που έχουν με υγεία κάτω από _4/13/27/67%_ ανά επίπεδο προετοιμασίας, από 3/10/20/50%.\n\n_+2:_ Ο Δολοφόνος μπορεί να δολοφονήσει εχθρούς που έχουν με υγεία κάτω από _5/17/33/83%_ ανά επίπεδο προετοιμασίας, από 3/10/20/50%.\n\n_+3:_ Ο Δολοφόνος μπορεί να δολοφονήσει εχθρούς που έχουν με υγεία κάτω από _6/20/40/100%_ ανά επίπεδο προετοιμασίας, από 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=ενισχυμένη θνησιμότητα
actors.hero.talent.enhanced_rings.desc=_+1:_ Όταν ο Απατεώνας χρησιμοποιεί ένα τεχνούργημα, τα δαχτυλίδια του κερδίζουν +1 αναβάθμιση για _3 γύρους_.\n\n_+2:_ Όταν ο Απατεώνας χρησιμοποιεί ένα τεχνούργημα, τα δαχτυλίδια του κερδίζουν +1 αναβάθμιση για _6 γύρους_.\n\n_+3:_ Όταν ο Απατεώνας χρησιμοποιεί ένα τεχνούργημα, τα δαχτυλίδια του κερδίζουν +1 αναβάθμιση για _9 γύρους_.
actors.hero.talent.enhanced_rings.title=ενισχυμένα δαχτυλίδια
actors.hero.talent.enlightening_meal.desc=_+1:_ Η κατανάλωση φαγητού παίρνει τον Κληρικό σε 1 γύρο και του δίνει _0,67 χρεώσεις_ στον ιερό τόμο τους.\n\n_+2:_ Η κατανάλωση φαγητού παίρνει τον Κληρικό σε 1 γύρο και του δίνει _1 χρέωση_ στον ιερό τόμο τους.
actors.hero.talent.enlightening_meal.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα δώσει αντ' αυτού 2 γύρους επαναφόρτισης ραβδιού και τεχνουργήματος στο +1 ή 3 γύρους στο +2. Αυτό δεν μπορεί να χρησιμοποιηθεί για να επαναφορτιστεί το Κέρας της Αφθονίας.
actors.hero.talent.enlightening_meal.title=Διαφωτιστικό Γεύμα
actors.hero.talent.enraged_catalyst.desc=_+1:_ Τα ξόρκια και οι κατάρες στο όπλο του Berserker ενεργοποιούνται πιο συχνά όσο περισσότερη οργή έχει, έως το μέγιστο _15% πιο συχνά_ στο 100% οργή.\n\n_+2:_ Τα ξόρκια και οι κατάρες στο όπλο του Berserker ενεργοποιούνται πιο συχνά όσο περισσότερη οργή έχει, έως το μέγιστο _30% πιο συχνά_ στο 100% οργή.\n\n_+3:_ Τα ξόρκια και οι κατάρες στο όπλο του Berserker ενεργοποιούνται πιο συχνά όσο περισσότερη οργή έχει, έως το μέγιστο _45% πιο συχνά_ στο 100% οργή.
actors.hero.talent.enraged_catalyst.title=εξοργισμένος καταλύτης
actors.hero.talent.evasive_armor.desc=_+1:_ Κατά τη διάρκεια του freerunner, ο Freerunner κερδίζει επιπλέον _+1 αποφυγή_ ανά πλεονάζον σημείο δύναμης στην πανοπλία του. freerunning, ο Freerunner κερδίζει επιπλέον _+3 αποφυγή_ ανά πλεονάζον σημείο δύναμης στην πανοπλία του.
actors.hero.talent.evasive_armor.title=πανοπλία αποφυγής
actors.hero.talent.even_the_odds.desc=_+1:_ Ο Πολεμιστής προκαλεί επιπλέον _5% μπόνους ζημιά_ για κάθε εχθρό εντός 2 πλακιδίων όταν η αντοχή τελειώνει.\n\n_+2:_ Ο Πολεμιστής προκαλεί επιπλέον _10% μπόνους ζημιά_ για κάθε εχθρό εντός 2 πλακιδίων όταν η αντοχή τελειώνει.\n\n_+3:_ Ο Πολεμιστής προκαλεί επιπλέον _15% μπόνους ζημιά_ για κάθε εχθρό εντός 2 πλακιδίων όταν η αντοχή τελειώνει.\n\n_+4:_ Ο Πολεμιστής προκαλεί επιπλέον _20% μπόνους ζημιά_ για κάθε εχθρό εντός 2 πλακιδίων όταν η αντοχή τελειώνει.
actors.hero.talent.even_the_odds.title=ακόμη και οι πιθανότητες
actors.hero.talent.excess_charge.desc=_+1:_ Όταν το ραβδί του Μάγου της Μάχης είναι πλήρως φορτισμένο, το επόμενο χτύπημα θα του δώσει _0,67 θωράκιση_ ανά επίπεδο του ραβδιού.\n\n_+2:_ Όταν το ραβδί του Μάγου της Μάχης είναι πλήρως φορτισμένο, το επόμενο χτύπημα θα του δώσει _1,33 θωράκιση_ ανά επίπεδο του ραβδιού.\n\n_+3:_ Όταν το ραβδί του Μάγου της Μάχης είναι πλήρως φορτισμένο, το επόμενο χτύπημα θα του δώσει _2 θωράκιση_ ανά επίπεδο του ραβδιού.
actors.hero.talent.excess_charge.title=υπερβολική χρέωση
actors.hero.talent.expanding_wave.desc=_+1:_ Η εμβέλεια του Shockwave αυξάνεται σε _6 πλακίδια_ από 5 και το πλάτος του αυξάνεται σε _75 μοίρες_ από 60.\n\n_+2:_ Η εμβέλεια του Shockwave αυξάνεται σε _7 πλακίδια_ από 5 και το πλάτος του αυξάνεται σε _90 μοίρες_ από 60.\n\n_+3:_ Η εμβέλεια του Shockwave αυξάνεται σε _8 πλακίδια_ από 5 και το πλάτος του αυξάνεται σε _105 μοίρες_ από 60.\n\n_+4:_ Η εμβέλεια του Shockwave αυξάνεται σε _9 πλακίδια_ από 5 και το πλάτος του αυξάνεται σε _120 μοίρες_ από 60.
actors.hero.talent.expanding_wave.title=επεκτεινόμενο κύμα
actors.hero.talent.expose_weakness.desc=_+1:_ Οι εχθροί που επιτίθενται στο afterimage του Μονομάχου γίνονται αδύναμοι και ευάλωτοι για _2 γύρους_.\n\n_+2:_ Οι εχθροί που επιτίθενται στο afterimage του Μονομάχου γίνονται αδύναμοι και ευάλωτοι για _4 γύρους_.\n\n_+3:_ Οι εχθροί που επιτίθενται στο afterimage του Μονομάχου γίνονται αδύναμοι και ευάλωτοι για _6 γύρους_.\n\n_+4:_ Οι εχθροί που επιτίθενται στο afterimage του Μονομάχου γίνονται αδύναμοι και ευάλωτοι για _8 γύρους_.
actors.hero.talent.expose_weakness.title=αποκαλύψει την αδυναμία
actors.hero.talent.fan_of_blades.desc=_+1:_ Οι φασματικές λεπίδες μπορούν να χτυπήσουν έως _1 επιπλέον στόχο_ για 50% ζημιά. Ο στόχος πρέπει να είναι ορατός και εντός κώνου _30 μοιρών_ AOE.\n\n_+2:_ Οι φασματικές λεπίδες μπορούν να χτυπήσουν έως _2 επιπλέον στόχους_ για 50% ζημιά. Οι στόχοι πρέπει να είναι ορατοί και εντός κώνου _60 μοιρών_ AOE.\n\n_+3:_ Οι φασματικές λεπίδες μπορούν να χτυπήσουν έως _3 επιπλέον στόχους_ για 50% ζημιά. Οι στόχοι πρέπει να είναι ορατοί και εντός κώνου _90 μοιρών_ AOE.\n\n_+4:_ Οι φασματικές λεπίδες μπορούν να χτυπήσουν έως _4 επιπλέον στόχους_ για 50% ζημιά. Οι στόχοι πρέπει να είναι ορατοί και εντός κώνου _120 μοιρών_ AOE.
actors.hero.talent.fan_of_blades.title=ανεμιστήρας από λεπίδες
actors.hero.talent.farsight.desc=_+1:_ Η εμβέλεια όρασης του ελεύθερου σκοπευτή _αυξήθηκε κατά 25%_.\n\n_+2:_ Η εμβέλεια όρασης του ελεύθερου σκοπευτή _αυξήθηκε κατά 50%_.\n\n_+3:_ Η εμβέλεια όρασης του ελεύθερου σκοπευτή _αυξήθηκε κατά 75%_.
actors.hero.talent.farsight.title=υπερμετρωπία
actors.hero.talent.fear_the_reaper.desc=_+1:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει τα 0 hp, γίνεται _ακρωτηριασμένος_.\n\n_+2:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει τα 0 hp, γίνεται _φοβισμένος και ανάπηρος_.\n\n_+3:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει τα 0 hp, γίνεται _φοβισμένος και ανάπηρος_ και οι εχθροί εντός 3 πλακιδίων γίνονται _ανάπηροι_.\n\n_+4:_ Όταν ένας εχθρός με σημάδι θανάτου φτάσει τα 0 hp, γίνεται _φοβισμένος και ανάπηρος_ και οι εχθροί εντός 3 πλακιδίων γίνονται _φοβισμένοι και ανάπηροι_.
actors.hero.talent.fear_the_reaper.title=φοβάμαι τον θεριστή
actors.hero.talent.feigned_retreat.desc=_+1:_ Αν ένας εχθρός επιτεθεί στο οπισθοσκόπο του Μονομάχου, κερδίζει _2 γύρους_ ταχύτητας.\n\n_+2:_ Αν ένας εχθρός επιτεθεί στο οπισθοσκόπο του Μονομάχου, κερδίζει _4 γύρους_ ταχύτητας.\n\n_+3:_ Αν ένας εχθρός επιτεθεί στο οπισθοσκόπο του Μονομάχου, κερδίζει _6 γύρους_ ταχύτητας.\n\n_+4:_ Αν ένας εχθρός επιτεθεί στο οπισθοσκόπο του Μονομάχου, κερδίζει _8 γύρους_ ταχύτητας.
actors.hero.talent.feigned_retreat.title=προσποιητή υποχώρηση
actors.hero.talent.fire_everything.desc=_+1:_ Η άγρια μαγεία ενεργοποιείται τώρα _5 φορές_ από 4 και κάθε ραβδί έχει _25% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.\n\n_+2:_ Η άγρια μαγεία ενεργοποιείται τώρα _6 φορές_ από 4 και κάθε ραβδί έχει _50% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.\n\n_+3:_ Η άγρια μαγεία ενεργοποιείται τώρα _7 φορές_ από 4 και κάθε ραβδί έχει _75% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.\n\n_+4:_ Η άγρια μαγεία ενεργοποιείται τώρα _8 φορές_ από 4 και κάθε ραβδί έχει _100% πιθανότητα_ να χρησιμοποιηθεί 3 φορές.
actors.hero.talent.fire_everything.title=πυρπόλησε τα πάντα
actors.hero.talent.flash.desc=_+1:_ Ενώ βρίσκεται σε Αναληφθείσα Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει το _Flash_ για να τηλεμεταφερθεί έως _3 πλακίδια_ μακριά.\n\n_+2:_ Ενώ βρίσκεται σε Αναληφθείσα Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει το _Flash_ για να τηλεμεταφερθεί έως _4 πλακίδια_ μακριά.\n\n_+3:_ Ενώ βρίσκεται σε Αναληφθείσα Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει το _Flash_ για να τηλεμεταφερθεί έως _5 πλακίδια_ μακριά.\n\n_+4:_ Ενώ βρίσκεται σε Αναληφθείσα Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει το _Flash_ για να τηλεμεταφερθεί έως _6 πλακίδια_ μακριά.\n\nΤο Flash κοστίζει αρχικά 2 χρεώσεις τόμων και 1 επιπλέον χρέωση για κάθε χρήση στην ίδια αναληφθείσα μορφή.
actors.hero.talent.flash.title=λάμψη
actors.hero.talent.focused_meal.desc=_+1:_ Η κατανάλωση φαγητού παίρνει τη Μονομάχο σε 1 γύρο και της δίνει _0.67 φορτίσεις_ στα όπλα της.\n\n_+2:_ Η κατανάλωση φαγητού παίρνει τη Μονομάχο σε 1 γύρο και της δίνει _1 φορτιση_ στα όπλα της.
actors.hero.talent.focused_meal.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα δώσει επιπλέον ζημιά στο επόμενο χτύπημα ίση με το επίπεδο/3 στο +1 ή το επίπεδο/2 στο +2.
actors.hero.talent.focused_meal.title=εστιασμένο γεύμα
actors.hero.talent.followup_strike.desc=_+1:_ Όταν η Κυνηγός χτυπήσει έναν εχθρό με το τόξο της ή ένα εκτοξευμένο όπλο, η επόμενη επίθεσή της σώμα με σώμα εναντίον αυτού του εχθρού προκαλεί _2 επιπλέον ζημιά_.\n\n_+2:_ Όταν η Κυνηγός χτυπήσει έναν εχθρό με το τόξο της ή ένα εκτοξευμένο όπλο, η επόμενη επίθεσή της σώμα με σώμα εναντίον αυτού του εχθρού προκαλεί _3 επιπλέον ζημιά_.
actors.hero.talent.followup_strike.title=επακόλουθη απεργία
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Οι επιθέσεις από το πνευματικό γεράκι τυφλώνουν τους εχθρούς για _2 γύρους_.\n\n_+2:_ Οι επιθέσεις από το πνευματικό γεράκι τυφλώνουν τους εχθρούς για _5 γύρους_.\n\n_+3:_ Οι επιθέσεις από το πνευματικό γεράκι τυφλώνουν τους εχθρούς για _5 γύρους_ και τους παραλύουν για _2 γύρους_.\n\n_+4:_ Οι επιθέσεις από το πνευματικό γεράκι τυφλώνουν τους εχθρούς για _5 γύρους_ και τους παραλύουν για _5 γύρους_.
actors.hero.talent.go_for_the_eyes.title=πάω για τα μάτια
actors.hero.talent.growing_power.desc=_+1:_ Οι ενισχύσεις επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _38% και 125%_, από 33% και 100%.\n\n_+2:_ Οι ενισχύσεις επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _42% και 150%_, από 33% και 100%.\n\n_+3:_ Οι ενισχύσεις επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _46% και 175%_, από 33% και 100%.\n\n_+4:_ Οι ενισχύσεις επίθεσης και ταχύτητας κίνησης από τη δύναμη της φύσης αυξάνονται σε _50% και 200%_, από 33% και 100%.
actors.hero.talent.growing_power.title=αυξανόμενη δύναμη
actors.hero.talent.hallowed_ground.desc=_+1:_ Ο Ιερέας μπορεί να χρησιμοποιήσει το _Αγία Γη,_ ένα ξόρκι που αγιοποιεί έδαφος σε μια _περιοχή 3x3_ για 20 γύρους, με κόστος 2 φορτίσεις.\n\n_+2:_ Ο Ιερέας μπορεί να χρησιμοποιήσει το _Αγία Γη,_ ένα ξόρκι που αγιοποιεί έδαφος σε μια _περιοχή 5x5_ για 20 γύρους, με κόστος 2 φορτίσεις.\n\n_+3:_ Ο Ιερέας μπορεί να χρησιμοποιήσει το _Αγία Γη,_ ένα ξόρκι που αγιοποιεί έδαφος σε μια _περιοχή 7x7_ για 20 γύρους, με κόστος 2 φορτίσεις.\n\nΌταν εκτελείται, το Αγία Γη θεραπεύει συμμάχους για 15 Ζωή (Heallowed Ground), ριζώνει για λίγο τους εχθρούς και απλώνει κοντό γρασίδι. Στη συνέχεια, θεραπεύει αργά τους συμμάχους, παραλύει τους εχθρούς και προκαλεί την τυχαία ανάπτυξη ψηλού χόρτου. Το ιερό έδαφος παρέχει θωράκιση στον Ιερέα αντί για θεραπεία και καταστρέφεται από φωτιά.
actors.hero.talent.hallowed_ground.title=ιερό έδαφος
actors.hero.talent.hasty_retreat.desc=_+1:_ Αφού αναβοσβήσει, ο Rogue κερδίζει _1 στροφή_ βιασύνης και γίνεται αόρατος.\n\n_+2:_ Αφού αναβοσβήσει, ο Rogue κερδίζει _2 στροφές_ βιασύνης και γίνεται αόρατος.\n\n_+3:_ Αφού αναβοσβήσει, ο Rogue κερδίζει _3 στροφές_ βιασύνης και γίνεται αόρατος.\n\n_+4:_ Αφού αναβοσβήσει, ο Rogue κερδίζει _4 στροφές_ βιασύνης και γίνεται αόρατος.
actors.hero.talent.hasty_retreat.title=βιαστική υποχώρηση
actors.hero.talent.hearty_meal.desc=_+1:_ Η κατανάλωση τροφής θεραπεύει τον Πολεμιστή για _4 Ζωή_ όταν έχει ζωή στο 33% ή κάτω.\n\n_+2:_ Η κατανάλωση τροφής θεραπεύει τον Πολεμιστή για _6 Ζωή_ όταν έχει ζωή στο 33% ή κάτω.
actors.hero.talent.hearty_meal.title=χορταστικό γεύμα
actors.hero.talent.heightened_senses.desc=_+1:_ Η Κυνηγός αποκτά νοητική όραση σε χαρακτήρες εντός _2 πλακιδίων από τη θέση της_.\n\n_+2:_ Η Κυνηγός αποκτά νοητική όραση σε χαρακτήρες εντός _3 πλακιδίων από τη θέση της_.
actors.hero.talent.heightened_senses.title=οξυμένες αισθήσεις
actors.hero.talent.heroic_energy.desc=_+1:_ Η ικανότητα θωράκισης του ήρωα έχει _12% μειωμένο_ κόστος φόρτισης.\n\n_+2:_ Η ικανότητα θωράκισης του ήρωα έχει _23% μειωμένο_ κόστος φόρτισης.\n\n_+3:_ Η ικανότητα θωράκισης του ήρωα έχει _32% μειωμένο_ κόστος φόρτισης.\n\n_+4:_ Η ικανότητα θωράκισης του ήρωα έχει _40% μειωμένο_ κόστος φόρτισης.
actors.hero.talent.heroic_energy.rat_title=ρατροϊκή ενέργεια
actors.hero.talent.heroic_energy.title=ηρωική ενέργεια
actors.hero.talent.hold_fast.desc=_+1:_ Όταν ο Πολεμιστής περιμένει, κερδίζει _1-2 θωράκιση_ και επιβραδύνει τη μείωση των ενισχύσεων συνδυασμού και θωράκισης κατά _50%_ μέχρι να κινηθεί.\n\n_+2:_ Όταν ο Πολεμιστής περιμένει, κερδίζει _2-4 θωράκιση_ και επιβραδύνει τη μείωση των ενισχύσεων συνδυασμού και θωράκισης κατά _75%_ μέχρι να κινηθεί.\n\n_+3:_ Όταν ο Πολεμιστής περιμένει, κερδίζει _3-6 θωράκιση_ και επιβραδύνει τη μείωση των ενισχύσεων συνδυασμού και θωράκισης κατά _100%_ μέχρι να κινηθεί.
actors.hero.talent.hold_fast.title=κρατήσου γερά
actors.hero.talent.holy_intuition.desc=_+1:_ Ο Κληρικός μπορεί να χρησιμοποιήσει την _Ιερή Διαίσθηση,_ ένα ξόρκι που αποκαλύπτει εάν ένα αντικείμενο έχει καταραθεί με κόστος _3 φορτίσεις._\n\n_+2:_ Ο Κληρικός μπορεί να χρησιμοποιήσει την _Ιερή Διαίσθηση,_ ένα ξόρκι που αποκαλύπτει εάν ένα αντικείμενο έχει καταραθεί με κόστος _2 φορτίσεις._
actors.hero.talent.holy_intuition.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα επιτρέψει στον ήρωα να προσδιορίσει την κατάσταση κατάρας σε ένα καταραμένο αντικείμενο λίγο πριν το εξοπλίσει, 15% των περιπτώσεων στο +1 ή 25% των περιπτώσεων στο +2.
actors.hero.talent.holy_intuition.title=ιερή διαίσθηση
actors.hero.talent.holy_lance.desc=_+1:_ Ο Ιερέας μπορεί να χρησιμοποιήσει το _Ιερή Λόγχη,_ ένα καταστροφικό ξόρκι που προκαλεί _30-55 ζημιά_ με κόστος 4 φορτίσεις.\n\n_+2:_ Ο Ιερέας μπορεί να χρησιμοποιήσει το _Ιερή Λόγχη,_ ένα καταστροφικό ξόρκι που προκαλεί _45-83 ζημιά_ με κόστος 4 φορτίσεις.\n\n_+3:_ Ο Ιερέας μπορεί να χρησιμοποιήσει το _Ιερή Λόγχη,_ ένα καταστροφικό ξόρκι που προκαλεί _60-110 ζημιά_ με κόστος 4 φορτίσεις.\n\nΗ Ιερή Λόγχη προκαλεί πάντα τη μέγιστη ζημιά σε δαιμονικούς και νεκρό εχθρούς. Η Ιερή Λόγχη έχει χρόνο αναμονής 30 γύρους πριν μπορέσει να χρησιμοποιηθεί ξανά.
actors.hero.talent.holy_lance.title=ιερή λόγχη
actors.hero.talent.impact_wave.desc=_+1:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί ρίχνονται _2 πλακίδια_ πίσω και έχουν _25% πιθανότητα_ να γίνουν ευάλωτοι για 5 γύρους.\n\n_+2:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί ρίχνονται _3 πλακίδια_ πίσω και έχουν _50% πιθανότητα_ να γίνουν ευάλωτοι για 5 γύρους.\n\n_+3:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί ρίχνονται _4 πλακίδια_ πίσω και έχουν _75% πιθανότητα_ να γίνουν ευάλωτοι για 5 γύρους.\n\n_+4:_ Όταν ο Πολεμιστής προσγειωθεί μετά από άλμα, όλοι οι γειτονικοί εχθροί ρίχνονται _5 πλακίδια_ πίσω και έχουν _100% πιθανότητα_ να γίνουν ευάλωτοι για 5 γύρους.
actors.hero.talent.impact_wave.title=κύμα κρούσης
actors.hero.talent.improvised_projectiles.desc=_+1:_ Ο Πολεμιστής μπορεί να τυφλώσει έναν εχθρό για _2 γύρους_ πετώντας οποιοδήποτε αντικείμενο που δεν είναι όπλο που πετάγεται εναντίον του. Αυτό έχει χρόνο αναμονής 50 γύρους.\n\n_+2:_ Ο Πολεμιστής μπορεί να τυφλώσει έναν εχθρό για _3 γύρους_ πετώντας οποιοδήποτε αντικείμενο που δεν είναι όπλο που πετάγεται εναντίον του. Αυτό έχει χρόνο αναμονής 50 γύρους.
actors.hero.talent.improvised_projectiles.title=αυτοσχέδια βλήματα
actors.hero.talent.inscribed_power.desc=_+1:_ Όταν ο Μάγος διαβάζει έναν πάπυρο ή χρησιμοποιεί ένα αντικείμενο ξορκιού, τα _επόμενα 2 ραβδιά του zaps_ παίρνουν +2 επίπεδα.\n\n_+2:_ Όταν ο Μάγος διαβάζει έναν πάπυρο ή χρησιμοποιεί ένα αντικείμενο ξορκιού, τα _επόμενα 3 ραβδιά του zaps_ παίρνουν +2 επίπεδα.\n\nΟ αριθμός των ενισχυμένων zaps με ραβδί διπλασιάζεται όταν χρησιμοποιείται ένας πάπυρος αντικειμένων αναβάθμισης, μεταστοιχείωσης ή αλχημείας που πρέπει να κατασκευαστούν χρησιμοποιώντας αυτούς τους πάπυρους.\n\nΓια αντικείμενα αλχημείας με υψηλότερες ποσότητες εξόδου (π.χ. τα περισσότερα ξόρκια), αυτό το ταλέντο έχει την ευκαιρία να ενεργοποιηθεί με βάση το πόσα από αυτά τα αντικείμενα παράγονται.
actors.hero.talent.inscribed_power.title=εγγεγραμμένη δύναμη
actors.hero.talent.inscribed_stealth.desc=_+1:_ Ο Απατεώνας αποκτά _3 γύρους_ αορατότητας αφού διαβάσει έναν πάπυρο ή χρησιμοποιήσει ένα αντικείμενο ξορκιού.\n\n_+2:_ Ο Απατεώνας αποκτά _5 γύρους_ αορατότητας αφού διαβάσει έναν πάπυρο ή χρησιμοποιήσει ένα αντικείμενο ξορκιού.\n\nΗ διάρκεια αορατότητας διπλασιάζεται όταν χρησιμοποιείται ένας πάπυρος αναβάθμισης, ένας πάπυρος μεταστοιχείωσης ή αντικείμενα αλχημείας που πρέπει να κατασκευαστούν χρησιμοποιώντας αυτούς τους πάπυρους.\n\nΓια αντικείμενα αλχημείας με υψηλότερες ποσότητες εξόδου (π.χ. τα περισσότερα ξόρκια), αυτό το ταλέντο έχει την πιθανότητα να ενεργοποιηθεί με βάση το πόσο από αυτό το αντικείμενο παράγεται.
actors.hero.talent.inscribed_stealth.title=χαραγμένη μυστικότητα
actors.hero.talent.invigorating_meal.desc=_+1:_ Η κατανάλωση φαγητού απαιτεί 1 γύρο για την Κυνηγό (τα μούρα τρώγονται αμέσως) και της δίνει _1 γύρο βιασύνης_.\n\n_+2:_ Η κατανάλωση φαγητού απαιτεί 1 γύρο για την Κυνηγό (τα μούρα τρώγονται αμέσως) και της δίνει _2 γύρους βιασύνης_.
actors.hero.talent.invigorating_meal.title=αναζωογονητικό γεύμα
actors.hero.talent.invigorating_victory.desc=_+1:_ Αν η Μονομάχος νικήσει τον στόχο της πριν τελειώσει η μονομαχία, θεραπεύεται για _5 Ζωή συν 30% της ζημιάς_ που δέχτηκε κατά τη διάρκεια της μονομαχίας.\n\n_+2:_ Αν η Μονομάχος νικήσει τον στόχο της πριν τελειώσει η μονομαχία, θεραπεύεται για _10 Ζωή συν 50% της ζημιάς_ που δέχτηκε κατά τη διάρκεια της μονομαχίας.\n\n_+3:_ Αν η Μονομάχος νικήσει τον στόχο της πριν τελειώσει η μονομαχία, θεραπεύεται για _15 Ζωή συν 65% της ζημιάς_ που δέχτηκε κατά τη διάρκεια της μονομαχίας.\n\n_+4:_ Αν η Μονομάχος νικήσει τον στόχο της πριν τελειώσει η μονομαχία, θεραπεύεται για _20 Ζωή συν 75% της ζημιάς_ που δέχτηκε κατά τη διάρκεια της μονομαχίας.
actors.hero.talent.invigorating_victory.title=αναζωογονητική νίκη
actors.hero.talent.iron_stomach.desc=_+1:_ Η κατανάλωση φαγητού παίρνει τη σειρά του Πολεμιστή 1 και του δίνει _75% αντίσταση στη ζημιά_ ενώ τρώει.\n\n_+2:_ Η κατανάλωση φαγητού παίρνει τη σειρά του Πολεμιστή 1 και του δίνει _100% αντίσταση στη ζημιά_ ενώ τρώει.
actors.hero.talent.iron_stomach.title=σιδερένιο στομάχι
actors.hero.talent.iron_will.desc=_+1:_ Η ασπίδα που παρέχεται από τη σφραγίδα του Πολεμιστή _αυξάνεται κατά 1_.\n\n_+2:_ Η ασπίδα που παρέχεται από τη σφραγίδα του Πολεμιστή _αυξάνεται κατά 2_.
actors.hero.talent.iron_will.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα δώσει παθητικά μια έκδοση 1 ή 2 μέγιστων ασπίδων του εφέ σπασμένης σφραγίδας του Πολεμιστή.
actors.hero.talent.iron_will.title=σιδερένια θέληση
actors.hero.talent.judgement.desc=_+1:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Κρίση,_ η οποία προκαλεί _10-20 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\n_+2:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Κρίση,_ η οποία προκαλεί _15-30 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\n_+3:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Κρίση,_ η οποία προκαλεί _20-40 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\n_+4:_ Ενώ βρίσκεται σε Ανυψωμένη Μορφή, ο Κληρικός μπορεί να χρησιμοποιήσει την _Κρίση,_ η οποία προκαλεί _25-50 ζημιά_ σε όλους τους ορατούς εχθρούς.\n\nΗ Κρίση κοστίζει 3 χρεώσεις χρόνου. Η Κρίση προκαλεί +33% ζημιά για κάθε ξόρκι που έχει κάνει ο Κληρικός από τότε που μπήκε σε ανυψωμένη μορφή ή από την τελευταία χρήση της Κρίσης.
actors.hero.talent.judgement.title=κρίση
actors.hero.talent.lay_on_hands.desc=_+1:_ Ο Παλαδίνος μπορεί να εκτελέσει _Lay on Hands,_ ένα ξόρκι που θεραπεύει άμεσα έναν κοντινό χαρακτήρα για _15 HP,_ ή δίνει στον Παλαδίνο _15 θωράκιση,_ με κόστος 1 φόρτισης.\n\n_+2:_ Ο Παλαδίνος μπορεί να εκτελέσει _Lay on Hands,_ ένα ξόρκι που θεραπεύει άμεσα έναν κοντινό χαρακτήρα για _20 HP,_ ή δίνει στον Παλαδίνο _20 θωράκιση,_ με κόστος 1 φόρτισης.\n\n_+3:_ Ο Παλαδίνος μπορεί να εκτελέσει _Lay on Hands,_ ένα ξόρκι που θεραπεύει άμεσα έναν κοντινό χαρακτήρα για _25 HP,_ ή δίνει στον Παλαδίνο _25 θωράκιση,_ με κόστος 1 φόρτισης.\n\nΗ υπερβολική θεραπεία από αυτό το ξόρκι μετατρέπεται σε θωράκιση. Η λειτουργία Lay on Hands μπορεί να εκτελεστεί επανειλημμένα, αλλά δεν μπορεί να εφαρμόσει θωράκιση για περισσότερες από τρεις εκμεταλλεύσεις ταυτόχρονα.
actors.hero.talent.lay_on_hands.title=βάζω τα χέρια μου στα χέρια
actors.hero.talent.lethal_defense.desc=_+1:_ Όταν ο Μονομάχος σκοτώνει έναν εχθρό με μια συνδυαστική κίνηση, ο χρόνος αναμονής στην σπασμένη ασπίδα σφραγίδας του _μειώνεται κατά 50 γύρους_.\n\n_+2:_ Όταν ο Μονομάχος σκοτώνει έναν εχθρό με μια συνδυαστική κίνηση, ο χρόνος αναμονής στην σπασμένη ασπίδα σφραγίδας του _μειώνεται κατά 100 γύρους_.\n\n_+3:_ Όταν ο Μονομάχος σκοτώνει έναν εχθρό με μια συνδυαστική κίνηση, ο χρόνος αναμονής στην σπασμένη ασπίδα σφραγίδας του _μειώνεται κατά 150 γύρους_.\n\nΟ χρόνος αναμονής της ασπίδας μπορεί να μειωθεί έως και -150 γύρους από αυτό το ταλέντο, πράγμα που σημαίνει ότι θα είναι αμέσως ξανά διαθέσιμο μόλις ενεργοποιηθεί.
actors.hero.talent.lethal_defense.title=θανατηφόρα άμυνα
actors.hero.talent.lethal_haste.desc=_+1:_ Όταν η Μονομάχος πετυχαίνει ένα φονικό χτύπημα σε έναν εχθρό με ικανότητα όπλου, κερδίζει _3 γύρους_ άμεσης κίνησης.\n\n_+2:_ Όταν η Μονομάχος πετυχαίνει ένα φονικό χτύπημα σε έναν εχθρό με ικανότητα όπλου, κερδίζει _5 γύρους_ άμεσης κίνησης.
actors.hero.talent.lethal_haste.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα ενεργοποιηθεί με κανονικές επιθέσεις όπλων, με χρόνο αναμονής 100 στροφών.
actors.hero.talent.lethal_haste.title=θανατηφόρα βιασύνη
actors.hero.talent.lethal_momentum.desc=_+1:_ Όταν ο Πολεμιστής καταφέρνει ένα φονικό χτύπημα σε έναν εχθρό με ένα φυσικό όπλο, έχει _67% πιθανότητα_ να πάρει 0 γύρους.\n\n_+2:_ Όταν ο Πολεμιστής καταφέρνει ένα φονικό χτύπημα σε έναν εχθρό με ένα φυσικό όπλο, έχει _100% πιθανότητα_ να πάρει 0 γύρους.
actors.hero.talent.lethal_momentum.title=θανατηφόρα ορμή
actors.hero.talent.life_link.desc=Ο Κληρικός μπορεί να χρησιμοποιήσει τον _Δεσμό Ζωής_ μεταξύ του και ενός ενδυναμωμένου συμμάχου με κόστος 2 φορτίσεις. Αυτό το ξόρκι προκαλεί κατανομή ζημιάς μεταξύ του Κληρικού και του συμμάχου του, και προκαλεί την εφαρμογή ωφέλιμων ξορκιών κληρικού επιπέδου 3 ή χαμηλότερης και στους δύο, εάν επηρεάζεται κάποιος από τους δύο.\n\n_+1:_ Ο Σύνδεσμος Ζωής διαρκεί για _10 γύρους_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _-35% ζημιά που δέχεστε._\n\n_+2:_ Ο Σύνδεσμος Ζωής διαρκεί για _13 γύρους_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _-40% ζημιά που δέχεστε._\n\n_+3:_ Ο Σύνδεσμος Ζωής διαρκεί για _17 γύρους_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _-45% ζημιά που δέχεστε._\n\n_+4:_ Ο Σύνδεσμος Ζωής διαρκεί για _20 γύρους_ και αυξάνει το μπόνους της Δύναμης των Πολλών σε _-50% ζημιά που δέχεστε._
actors.hero.talent.life_link.title=κρίκος ζωής
actors.hero.talent.light_cloak.desc=_+1:_ Ο Απατεώνας μπορεί να χρησιμοποιήσει τον μανδύα των σκιών του όταν δεν είναι εξοπλισμένος, αλλά επαναφορτίζεται με _25% ταχύτητα_ όταν δεν είναι εξοπλισμένος.\n\n_+2:_ Ο Απατεώνας μπορεί να χρησιμοποιήσει τον μανδύα των σκιών του όταν δεν είναι εξοπλισμένος, αλλά επαναφορτίζεται με _50% ταχύτητα_ όταν δεν είναι εξοπλισμένος.\n\n_+3:_ Ο Απατεώνας μπορεί να χρησιμοποιήσει τον μανδύα των σκιών του όταν δεν είναι εξοπλισμένος, αλλά επαναφορτίζεται με _75% ταχύτητα_ όταν δεν είναι εξοπλισμένος.
actors.hero.talent.light_cloak.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα αυξηθεί η ταχύτητα φόρτισης όλων των αντικειμένων κατά 7/13/20% σε +1/+2/+3.
actors.hero.talent.light_cloak.title=ελαφρύς μανδύας
actors.hero.talent.light_reading.desc=_+1:_ Ο Κληρικός μπορεί να χρησιμοποιήσει τον ιερό τόμο του όταν δεν είναι εξοπλισμένος, αλλά επαναφορτίζεται με _25% ταχύτητα_ όταν δεν είναι εξοπλισμένος.\n\n_+2:_ Ο Κληρικός μπορεί να χρησιμοποιήσει τον ιερό τόμο του όταν δεν είναι εξοπλισμένος, αλλά επαναφορτίζεται με _50% ταχύτητα_ όταν δεν είναι εξοπλισμένος.\n\n_+3:_ Ο Κληρικός μπορεί να χρησιμοποιήσει τον ιερό τόμο του όταν δεν είναι εξοπλισμένος, αλλά επαναφορτίζεται με _75% ταχύτητα_ όταν δεν είναι εξοπλισμένος.
actors.hero.talent.light_reading.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα αυξηθεί η ταχύτητα επαναφόρτισης όλων των ραβδιών κατά 7/13/20% στο +1/+2/+3.
actors.hero.talent.light_reading.title=Ελαφριά ανάγνωση
actors.hero.talent.lingering_magic.desc=_+1:_ Όταν ο Μάγος κάνει τζόκινγκ με ένα ραβδί ή μπαστούνι, η επόμενη σωματική του επίθεση προκαλεί _1-2 επιπλέον ζημιά_.\n\n_+2:_ Όταν ο Μάγος κάνει τζόκινγκ με ένα ραβδί ή μπαστούνι, η επόμενη σωματική του επίθεση προκαλεί _2 επιπλέον ζημιά_.
actors.hero.talent.lingering_magic.title=παρατεταμένη μαγεία
actors.hero.talent.liquid_agility.desc=_+1:_ Όταν πίνει ή πετάει ένα φίλτρο, ρόφημα ή ελιξίριο, η Μονομάχος έχει _3x αποφυγή_ και _3x ακρίβεια_ στην επόμενη επίθεση σώμα με σώμα εντός 5 γύρων.\n\n_+2:_ Όταν πίνει ή πετάει ένα φίλτρο, ρόφημα ή ελιξίριο, η Μονομάχος έχει _άπειρη αποφυγή_ και _άπειρη ακρίβεια_ στην επόμενη επίθεση σώμα με σώμα εντός 5 γύρων.\n\nΑυτό το μπόνους διαρκεί για έναν επιπλέον γύρο και επίθεση όταν χρησιμοποιούνται φίλτρα δύναμης, εμπειρίας ή αντικείμενα αλχημείας που πρέπει να κατασκευαστούν χρησιμοποιώντας αυτά τα φίλτρα.\n\nΓια αντικείμενα αλχημείας με υψηλότερες ποσότητες παραγωγής (π.χ. υδάτινη παρασκευή), αυτό το ταλέντο έχει την ευκαιρία να ενεργοποιηθεί με βάση το πόσο από αυτό το αντικείμενο παράγεται.
actors.hero.talent.liquid_agility.title=υγρή ευκινησία
actors.hero.talent.liquid_nature.desc=_+1:_ Όταν η Κυνηγός πίνει ή πετάει ένα φίλτρο, ρόφημα ή ελιξίριο, _έως 4 πλακίδια γρασιδιού_ φυτρώνουν στη γύρω περιοχή και οι γειτονικοί εχθροί ριζώνονται για _1 γύρο_.\n\n_+2:_ Όταν η Κυνηγός πίνει ή πετάει ένα φίλτρο, ρόφημα ή ελιξίριο, _έως 6 πλακίδια γρασιδιού_ φυτρώνουν στη γύρω περιοχή και οι γειτονικοί εχθροί ριζώνονται για _2 γύρους_.\n\nΗ ποσότητα του γρασιδιού και της διάρκειας της ρίζας διπλασιάζεται όταν χρησιμοποιούνται φίλτρα δύναμης, εμπειρίας ή αντικειμένων αλχημείας που πρέπει να κατασκευαστούν χρησιμοποιώντας αυτά τα φίλτρα.\n\nΓια αντικείμενα αλχημείας με υψηλότερες ποσότητες παραγωγής (π.χ. ρόφημα νερού), αυτό το ταλέντο έχει την ευκαιρία να ενεργοποιηθεί με βάση το πόσο από αυτό το αντικείμενο παράγεται.
actors.hero.talent.liquid_nature.title=υγρή φύση
actors.hero.talent.liquid_willpower.desc=_+1:_ Ο Πολεμιστής κερδίζει _6,5% της μέγιστης Ζωής του σε θωράκιση_ όταν πίνει ή πετάει ένα φίλτρο, ένα ρόφημα ή ελιξίριο.\n\n_+2:_ Ο Πολεμιστής κερδίζει _10% της μέγιστης Ζωής του σε θωράκιση_ όταν πίνει ή πετάει ένα φίλτρο, ένα ρόφημα ή ελιξίριο.\n\nΗ ποσότητα της ασπίδας διπλασιάζεται όταν χρησιμοποιούνται φίλτρα δύναμης, εμπειρίας ή αντικείμενα αλχημείας που πρέπει να κατασκευαστούν χρησιμοποιώντας αυτά τα φίλτρα.\n\nΓια αντικείμενα αλχημείας με υψηλότερες ποσότητες παραγωγής (π.χ. υδάτινη μπύρα), αυτό το ταλέντο έχει την ευκαιρία να ενεργοποιηθεί με βάση το πόσο από αυτό το αντικείμενο παράγεται.
actors.hero.talent.liquid_willpower.title=υγρή δύναμη θέλησης
actors.hero.talent.longrange_warp.desc=_+1:_ Ο Μάγος μπορεί πλέον να στρεβλώνεται μεταξύ ορόφων, με _150% κόστος φόρτισης_.\n\n_+2:_ Ο Μάγος μπορεί πλέον να στρεβλώνεται μεταξύ ορόφων, με _117% κόστος φόρτισης_.\n\n_+3:_ Ο Μάγος μπορεί πλέον να στρεβλώνεται μεταξύ ορόφων, με _83% κόστος φόρτισης_.\n\n_+4:_ Ο Μάγος μπορεί πλέον να στρεβλώνεται μεταξύ ορόφων, με _50% κόστος φόρτισης_.\n\nΟ Μάγος δεν μπορεί να χρησιμοποιήσει στρέβλωση μεγάλης εμβέλειας για να φύγει από ένα κλειδωμένο δάπεδο.
actors.hero.talent.longrange_warp.title=Μακράς εμβέλειας στημόνι
actors.hero.talent.mind_form.desc=Ο Κληρικός μπορεί να χρησιμοποιήσει την _Μορφή Νου_, η οποία προσδίδει στην Τριάδα τη δύναμη ενός ραβδιού ή ενός όπλου που χρησιμοποίησε σε αυτήν την εκτέλεση, με κόστος 3 φορτίσεις.\n\n_+1:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί το εφέ ζάπινγκ ή ρίψης του επιλεγμένου αντικειμένου, σαν να ήταν _+3._\n\n_+2:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί το εφέ ζάπινγκ ή ρίψης του επιλεγμένου αντικειμένου, σαν να ήταν _+4._\n\n_+3:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί το εφέ ζάπινγκ ή ρίψης του επιλεγμένου αντικειμένου, σαν να ήταν _+5._\n\n_+4:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός χρησιμοποιεί το εφέ ζάπινγκ ή ρίψης του επιλεγμένου αντικειμένου, σαν να ήταν _+6._\n\nΗ Τριάδα μπορεί να εμπλουτιστεί μόνο με ένα εφέ μυαλού κάθε φορά.
actors.hero.talent.mind_form.title=μορφή νου
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Ο Ιερέας μπορεί να εκτελέσει την _Mnemonic Prayer,_ ένα ξόρκι που επεκτείνει ενισχύσεις/αποδυναμώσεις σε έναν σύμμαχο/εχθρό για _3 γύρους_ με κόστος 1 φόρτισης.\n\n_+2:_ Ο Ιερέας μπορεί να εκτελέσει την _Mnemonic Prayer,_ ένα ξόρκι που επεκτείνει ενισχύσεις/αποδυναμώσεις σε έναν σύμμαχο/εχθρό για _4 γύρους_ με κόστος 1 φόρτισης.\n\n_+3:_ Ο Ιερέας μπορεί να εκτελέσει την _Mnemonic Prayer,_ ένα ξόρκι που επεκτείνει ενισχύσεις/αποδυναμώσεις σε έναν σύμμαχο/εχθρό για _5 γύρους_ με κόστος 1 φόρτισης.\n\nΗ Mnemonic Prayer δεν χρειάζεται χρόνο για να εκτελεστεί. Η Mnemonic Prayer μπορεί να επεκτείνει μια συγκεκριμένη περίπτωση ενίσχυσης/αποδυνάμωσης μόνο μία φορά και δεν μπορεί να επεκτείνει ενισχύσεις από ικανότητες πανοπλίας.
actors.hero.talent.mnemonic_prayer.title=μνημονική προσευχή
actors.hero.talent.monastic_vigor.desc=_+1:_ Εάν ο Μοναχός έχει _100% ενέργεια_, οι ικανότητές του ενδυναμώνονται.\n\n_+2:_ Εάν ο Μοναχός έχει _80% ή περισσότερη ενέργεια_, οι ικανότητές του ενδυναμώνονται.\n\n_+3:_ Εάν ο Μοναχός έχει _60% ή περισσότερη ενέργεια_, οι ικανότητές του ενδυναμώνονται.\n\nΌταν ενδυναμώνεται:\n- Το Flurry εφαρμόζει τη γοητεία του όπλου σας\n- Η εστίαση είναι στιγμιαία\n- Η εφορμή κερδίζει +4 εμβέλεια\n- Το Dragon Kick προκαλεί +50% ζημιά και εφαρμόζει την επίδραση knockback και stun σε όλους τους γειτονικούς εχθρούς\n- Ο διαλογισμός θεραπεύει αργά το 20% της ελλείπουσας Ζωής και παρέχει 80% αντίσταση στη ζημιά.
actors.hero.talent.monastic_vigor.title=μοναστικό σθένος
actors.hero.talent.mystical_charge.desc=_+1:_ Το χτύπημα με το ραβδί του δίνει στον Μάγο της Μάχης επαναφόρτιση τεχνουργημάτων αξίας _0,5 στροφών_.\n\n_+2:_ Το χτύπημα με το ραβδί του δίνει στον Μάγο της Μάχης επαναφόρτιση τεχνουργημάτων αξίας _1 γύρου_.\n\n_+3:_ Το χτύπημα με το ραβδί του δίνει στον Μάγο της Μάχης επαναφόρτιση τεχνουργημάτων αξίας _1,5 γύρου_.
actors.hero.talent.mystical_charge.title=μυστικιστική φόρτιση
actors.hero.talent.mystical_meal.desc=_+1:_ Η κατανάλωση φαγητού παίρνει τη σειρά του Απατεώνα 1 (οι μερίδες προμηθειών καταναλώνονται αμέσως) και του δίνει _3 γύρους επαναφόρτισης τεχνουργημάτων_.\n\n_+2:_ Η κατανάλωση φαγητού παίρνει τη σειρά του Απατεώνα 1 (οι μερίδες προμηθειών καταναλώνονται αμέσως) και του δίνει _5 γύρους επαναφόρτισης τεχνουργημάτων_.\n\nΑυτό το ταλέντο δεν μπορεί να χρησιμοποιηθεί για να αφήσει το Κέρας της Αφθονίας να επαναφορτιστεί.
actors.hero.talent.mystical_meal.title=μυστικιστικό γεύμα
actors.hero.talent.natures_aid.desc=_+1:_ Η Κυνηγός αποκτά 0-2 θωράκιση από δέρμα φλοιού, η οποία εξασθενεί κάθε _3 γύρους_ όταν η επίδραση ενός φυτού ενεργοποιείται στο όραμά της.\n\n_+2:_ Η Κυνηγός αποκτά 0-2 θωράκιση από δέρμα φλοιού, η οποία εξασθενεί κάθε _5 γύρους_ όταν η επίδραση ενός φυτού ενεργοποιείται στο όραμά της.
actors.hero.talent.natures_aid.title=βοήθεια της φύσης
actors.hero.talent.natures_bounty.desc=_+1:_ Η Κυνηγός μπορεί να βρει _4 μούρα_ κρυμμένα σε ψηλό γρασίδι καθώς εξερευνά τους επόμενους ορόφους του μπουντρουμιού.\n\n_+2:_ Η Κυνηγός μπορεί να βρει _6 μούρα_ κρυμμένα σε ψηλό γρασίδι καθώς εξερευνά τους επόμενους ορόφους του μπουντρουμιού.\n\nΤα μούρα τρώγονται γρήγορα, αποκαθιστούν μια μικρή ποσότητα κορεσμού και μπορεί να περιέχουν έναν χρησιμοποιήσιμο σπόρο.
actors.hero.talent.natures_bounty.title=η γενναιοδωρία της φύσης
actors.hero.talent.natures_wrath.desc=_+1:_ Ενώ η δύναμη της φύσης είναι ενεργή, οι βολές από το πνευματικό τόξο έχουν _8% πιθανότητα_ να ενεργοποιήσουν μια τυχαία επιβλαβή επίδραση σε ένα φυτό.\n\n_+2:_ Ενώ η δύναμη της φύσης είναι ενεργή, οι βολές από το πνευματικό τόξο έχουν _17% πιθανότητα_ να ενεργοποιήσουν μια τυχαία επιβλαβή επίδραση σε ένα φυτό.\n\n_+3:_ Ενώ η δύναμη της φύσης είναι ενεργή, οι βολές από το πνευματικό τόξο έχουν _25% πιθανότητα_ να ενεργοποιήσουν μια τυχαία επιβλαβή επίδραση σε ένα φυτό.\n\n_+4:_ Ενώ η δύναμη της φύσης είναι ενεργή, οι βολές από το πνευματικό τόξο έχουν _33% πιθανότητα_ να ενεργοποιήσουν μια τυχαία επιβλαβή επίδραση σε ένα φυτό.\n\nΤα φυτά που μπορούν να ενεργοποιηθούν είναι: τυφλόχορτο, firebloom, icecap, sorrowmoss και stormvine.
actors.hero.talent.natures_wrath.title=η οργή της φύσης
actors.hero.talent.necromancers_minions.desc=_+1:_ Όταν ένας εχθρός με σήμανση ψυχής πεθάνει, ο Μάγος έχει _13% πιθανότητα_ να τον αναστήσει ως διεφθαρμένο φάντασμα.\n\n_+2:_ Όταν ένας εχθρός με σήμανση ψυχής πεθάνει, ο Μάγος έχει _27% πιθανότητα_ να τον αναστήσει ως διεφθαρμένο φάντασμα.\n\n_+3:_ Όταν ένας εχθρός με σήμανση ψυχής πεθάνει, ο Μάγος έχει _40% πιθανότητα_ να τον αναστήσει ως διεφθαρμένο φάντασμα.
actors.hero.talent.necromancers_minions.title=υπηρέτες του νεκρομάντη
actors.hero.talent.patient_strike.desc=_+1:_ Εάν η Μονομάχος περιμένει πριν εκτελέσει μια επίθεση σώμα με σώμα, θα προκαλέσει _1-2 επιπλέον ζημιά_.\n\n_+2:_ Εάν η Μονομάχος περιμένει πριν εκτελέσει μια επίθεση σώμα με σώμα, θα προκαλέσει _2 επιπλέον ζημιά_.
actors.hero.talent.patient_strike.title=απεργία ασθενών
actors.hero.talent.perfect_copy.desc=_+1:_ Ο κλώνος της σκιάς κερδίζει _10%_ της μέγιστης Ζωής του ήρωα και μπορεί να ανταλλάξει άμεσα θέσεις με τον ήρωα σε απόσταση έως _1 πλακιδίου_.\n\n_+2:_ Ο κλώνος της σκιάς κερδίζει _20%_ της μέγιστης Ζωής του ήρωα και μπορεί να ανταλλάξει άμεσα θέσεις με τον ήρωα σε απόσταση έως _2 πλακιδίων_.\n\n_+3:_ Ο κλώνος της σκιάς κερδίζει _30%_ της μέγιστης Ζωής του ήρωα και μπορεί να ανταλλάξει άμεσα θέσεις με τον ήρωα σε απόσταση έως _3 πλακιδίων_.\n\n_+4:_ Ο κλώνος της σκιάς κερδίζει _40%_ της μέγιστης Ζωής του ήρωα και μπορεί να ανταλλάξει άμεσα θέσεις με τον ήρωα σε απόσταση έως _4 πλακιδίων_.
actors.hero.talent.perfect_copy.title=τέλειο αντίγραφο
actors.hero.talent.point_blank.desc=_+1:_ Όταν η Κυνηγός χρησιμοποιεί το τόξο της ή ένα όπλο που πετάχτηκε σε απόσταση σώμα με σώμα, έχει _-25% ακρίβεια,_ αντί για -50%.\n\n_+2:_ Όταν η Κυνηγός χρησιμοποιεί το τόξο της ή ένα όπλο που πετάχτηκε σε απόσταση σώμα με σώμα, έχει _κανονική ακρίβεια,_ αντί για -50%.\n\n_+3:_ Όταν η Κυνηγός χρησιμοποιεί το τόξο της ή ένα όπλο που πετάχτηκε σε απόσταση σώμα με σώμα, έχει _+25% ακρίβεια,_ αντί για -50%.\n\nΣημειώστε ότι τα όπλα που πετάχτηκαν ή το πνευματικό τόξο έχουν πάντα +50% ακρίβεια όταν χρησιμοποιούνται από απόσταση.
actors.hero.talent.point_blank.title=απότομα
actors.hero.talent.precise_assault.desc=_+1:_ Όταν η Μονομάχος χρησιμοποιεί μια ικανότητα όπλου, κερδίζει _2x ακρίβεια_ στην επόμενη επίθεση σώμα με σώμα εντός 5 γύρων.\n\n_+2:_ Όταν η Μονομάχος χρησιμοποιεί μια ικανότητα όπλου, κερδίζει _5x ακρίβεια_ στην επόμενη επίθεση σώμα με σώμα εντός 5 γύρων.\n\n_+3:_ Όταν η Μονομάχος χρησιμοποιεί μια ικανότητα όπλου, κερδίζει _άπειρη ακρίβεια_ στην επόμενη επίθεση σώμα με σώμα εντός 5 γύρων.
actors.hero.talent.precise_assault.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα αυξηθεί η ακρίβεια στις μάχες σώμα με σώμα κατά 10% στο +1, 20% στο +2 ή 30% στο +3.
actors.hero.talent.precise_assault.title=ακριβής επίθεση
actors.hero.talent.projectile_momentum.desc=_+1:_ Ενώ τρέχει ελεύθερα, ο Freerunner κερδίζει _+50% ακρίβεια και +15% ζημιά_ με ρίψη όπλων.\n\n_+2:_ Ενώ τρέχει ελεύθερα, ο Freerunner κερδίζει _+100% ακρίβεια και +30% ζημιά_ με ρίψη όπλων.\n\n_+3:_ Ενώ τρέχει ελεύθερα, ο Freerunner κερδίζει _+150% ακρίβεια και +45% ζημιά_ με ρίψη όπλων.
actors.hero.talent.projectile_momentum.title=ορμή βλήματος
actors.hero.talent.projecting_blades.desc=_+1:_ Οι φασματικές λεπίδες έχουν _+25% ακρίβεια_ και μπορούν να διεισδύσουν σε _2 συμπαγή πλακίδια_.\n\n_+2:_ Οι φασματικές λεπίδες έχουν _+50% ακρίβεια_ και μπορούν να διεισδύσουν σε _4 συμπαγή πλακίδια_.\n\n_+3:_ Οι φασματικές λεπίδες έχουν _+75% ακρίβεια_ και μπορούν να διεισδύσουν σε _6 συμπαγή πλακίδια_.\n\n_+4:_ Οι φασματικές λεπίδες έχουν _+100% ακρίβεια_ και μπορούν να διεισδύσουν σε _8 συμπαγή πλακίδια_.
actors.hero.talent.projecting_blades.title=προεξέχουσες λεπίδες
actors.hero.talent.protective_shadows.desc=_+1:_ Ο Απατεώνας κερδίζει μία θωράκιση _κάθε γύρο_ που είναι αόρατος, _με μέγιστο 3_.\n\n_+2:_ Ο Απατεώνας κερδίζει μία θωράκιση _κάθε γύρο_ που είναι αόρατος, _με μέγιστο 5_.
actors.hero.talent.protective_shadows.title=προστατευτικές σκιές
actors.hero.talent.provoked_anger.desc=_+1:_ Όταν οποιαδήποτε ενίσχυση θωράκισης που εφαρμόζεται στον Πολεμιστή σπάσει από ζημιά, η επόμενη φυσική του επίθεση θα προκαλέσει _3 επιπλέον ζημιά_.\n\n_+2:_ Όταν οποιαδήποτε ενίσχυση θωράκισης που εφαρμόζεται στον Πολεμιστή σπάσει από ζημιά, η επόμενη φυσική του επίθεση θα προκαλέσει _5 επιπλέον ζημιά_.
actors.hero.talent.provoked_anger.title=προκάλεσε θυμό
actors.hero.talent.ratforcements.desc=_+1:_ Χρησιμοποιώντας το ratmogrify στον εαυτό σας _γεννάει 1_ σύμμαχο μαρσιποφόρο αρουραίο δίπλα σας.\n\n_+2:_ Χρησιμοποιώντας το ratmogrify στον εαυτό σας _γεννάει 2_ σύμμαχο μαρσιποφόρο αρουραίο δίπλα σας.\n\n_+3:_ Χρησιμοποιώντας το ratmogrify στον εαυτό σας _γεννάει 3_ σύμμαχο μαρσιποφόρο αρουραίο δίπλα σας.\n\n_+4:_ Χρησιμοποιώντας το ratmogrify στον εαυτό σας _γεννάει 4_ σύμμαχο μαρσιποφόρο αρουραίο δίπλα σας.
actors.hero.talent.ratforcements.title=επιθέσεις αρουραίων
actors.hero.talent.ratlomacy.desc=_+1:_ Η χρήση του ratmogrify σε έναν ratmogrified εχθρό τον κάνει φιλικό και κάνει τον μετασχηματισμό μόνιμο.\n\n_+2:_ Η χρήση του ratmogrify σε έναν ratmogrified εχθρό τον κάνει φιλικό, κάνει τον μετασχηματισμό μόνιμο και του δίνει _2 γύρους_ αδρεναλίνης.\n\n_+3:_ Η χρήση του ratmogrify σε έναν ratmogrified εχθρό τον κάνει φιλικό, κάνει τον μετασχηματισμό μόνιμο και του δίνει _4 γύρους_ αδρεναλίνης.\n\n_+4:_ Η χρήση του ratmogrify σε έναν ratmogrified εχθρό τον κάνει φιλικό, κάνει τον μετασχηματισμό μόνιμο και του δίνει _6 γύρους_ αδρεναλίνης.
actors.hero.talent.ratlomacy.title=ρατομακία
actors.hero.talent.ratsistance.desc=_+1:_ Εχθρικοί ratmogrified εχθροί προκαλούν _-10% ζημιά_.\n\n_+2:_ Εχθρικοί ratmogrified εχθροί προκαλούν _-19% ζημιά_.\n\n_+3:_ Εχθρικοί ratmogrified εχθροί προκαλούν _-27% ζημιά_.\n\n_+4:_ Εχθρικοί ratmogrified εχθροί προκαλούν _-35% ζημιά_.
actors.hero.talent.ratsistance.title=αρουραίων
actors.hero.talent.reactive_barrier.desc=_+1:_ Ο Μάγος κερδίζει _2,5 θωράκιση_ για κάθε χαρακτήρα που επηρεάζεται από έκρηξη στοιχείων, με μέγιστο αριθμό 5 χαρακτήρων.\n\n_+2:_ Ο Μάγος κερδίζει _5 θωράκιση_ για κάθε χαρακτήρα που επηρεάζεται από έκρηξη στοιχείων, με μέγιστο αριθμό 6 χαρακτήρων.\n\n_+3:_ Ο Μάγος κερδίζει _7,5 θωράκιση_ για κάθε χαρακτήρα που επηρεάζεται από έκρηξη στοιχείων, με μέγιστο αριθμό 7 χαρακτήρων.\n\n_+4:_ Ο Μάγος κερδίζει _10 θωράκιση_ για κάθε χαρακτήρα που επηρεάζεται από έκρηξη στοιχείων, με μέγιστο αριθμό 8 χαρακτήρων.
actors.hero.talent.reactive_barrier.title=αντιδραστικό φράγμα
actors.hero.talent.recall_inscription.desc=_+1:_ Ο Κληρικός μπορεί να χρησιμοποιήσει την _Επιγραφή Ανάκλησης,_ ένα ξόρκι που του επιτρέπει να επαναλάβει την επίδραση της τελευταίας ρουνικής πέτρας ή πάπυρο που χρησιμοποίησε εντός _10 γύρων._\n\n_+2:_ Ο Κληρικός μπορεί να χρησιμοποιήσει την _Επιγραφή Ανάκλησης,_ ένα ξόρκι που του επιτρέπει να επαναλάβει την επίδραση της τελευταίας ρουνικής πέτρας ή πάπυρο που χρησιμοποίησε εντός _300 γύρων._\n\nΗ Επιγραφή Ανάκλησης δεν μπορεί να χρησιμοποιηθεί με πάπυρους αναβάθμισης. Το κόστος χρέωσης αυτού του ξορκιού ποικίλλει ανάλογα με το αντικείμενο που χρησιμοποιήθηκε πρόσφατα: 2 για μια ρουνική πέτρα, 3 για έναν πάπυρο, 4 για έναν εξωτικό πάπυρο. Αυτό το κόστος χρέωσης διπλασιάζεται επίσης όταν χρησιμοποιείται με έναν πάπυρο μεταστοιχείωσης ή αντικείμενα αλχημείας που πρέπει να κατασκευαστούν χρησιμοποιώντας μεταστοιχείωση ή αναβάθμιση.
actors.hero.talent.recall_inscription.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα επιστρέψει χρήματα για οποιονδήποτε πάπυρο ή ρουνική πέτρα το 10% των περιπτώσεων στο +1 ή το 15% των περιπτώσεων στο +2. Οι Πάπυροι Αναβάθμισης εξαιρούνται από αυτό το αποτέλεσμα.
actors.hero.talent.recall_inscription.refunded=Το προϊόν σας επιστράφηκε!
actors.hero.talent.recall_inscription.title=επιγραφή ανάκλησης
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Όταν η Κυνηγός πατήσει σε κοντό γρασίδι ή κάρβουνα, ξεπηδούν σε ψηλό γρασίδι το οποίο η Κυνηγός σκεπάζει αμέσως. Αυτό έχει χρόνο αναμονής _10 γύρους_.\n\n_+2:_ Όταν η Κυνηγός πατήσει σε κοντό γρασίδι ή κάρβουνα, ξεπηδούν σε ψηλό γρασίδι το οποίο η Κυνηγός σκεπάζει αμέσως. Αυτό έχει χρόνο αναμονής _5 γύρους_.\n\nΑυτό το ταλέντο θα παράγει αυλακωμένο γρασίδι εάν οι επιδράσεις παθητικής αναγέννησης είναι απενεργοποιημένες ή ο ήρωας δεν έχει αποκτήσει εμπειρία για μεγάλο χρονικό διάστημα.
actors.hero.talent.rejuvenating_steps.title=αναζωογονητικά βήματα
actors.hero.talent.remote_beacon.desc=_+1:_ Ο Μάγος μπορεί να τοποθετήσει ένα beacon σε οποιαδήποτε τοποθεσία εντός _4 πλακιδίων_.\n\n_+2:_ Ο Μάγος μπορεί να τοποθετήσει ένα beacon σε οποιαδήποτε τοποθεσία εντός _8 πλακιδίων_.\n\n_+3:_ Ο Μάγος μπορεί να τοποθετήσει ένα beacon σε οποιαδήποτε τοποθεσία εντός _12 πλακιδίων_.\n\n_+4:_ Ο Μάγος μπορεί να τοποθετήσει ένα beacon σε οποιαδήποτε τοποθεσία εντός _16 πλακιδίων_.\n\nΟ Μάγος δεν μπορεί να τοποθετήσει beacon σε τοποθεσίες που είναι απρόσιτες.
actors.hero.talent.remote_beacon.title=Απομακρυσμένος Φάρος
actors.hero.talent.rogues_foresight.desc=_+1:_ Όταν ο Ληστής βρίσκεται σε επίπεδο με ένα μυστικό δωμάτιο, έχει _75% πιθανότητα να παρατηρήσει_ ότι το επίπεδο περιέχει ένα μυστικό.\n\n_+2:_ Όταν ο Ληστής βρίσκεται σε επίπεδο με ένα μυστικό δωμάτιο, έχει _100% πιθανότητα να παρατηρήσει_ ότι το επίπεδο περιέχει ένα μυστικό.
actors.hero.talent.rogues_foresight.title=η διορατικότητα του απατεώνα
actors.hero.talent.runic_transference.desc=_+1:_ Η σπασμένη σφραγίδα του Πολεμιστή μπορεί να μεταφέρει _κανονικά σύμβολα_ με τον ίδιο τρόπο που μεταφέρει μια αναβάθμιση.\n\n_+2:_ Η σπασμένη σφραγίδα του Πολεμιστή μπορεί να μεταφέρει _κανονικά, ισχυρά σύμβολα και σύμβολα κατάρας_ με τον ίδιο τρόπο που μεταφέρει μια αναβάθμιση.\n\nΗ σφραγίδα μπορεί να μεταφέρει σύμβολα μόνο αν εφαρμόστηκαν στην πανοπλία όταν ήταν τοποθετημένη η σφραγίδα.
actors.hero.talent.runic_transference.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα βοηθήσει τα γλύφοι στην πανοπλία σας να αντισταθούν στην αφαίρεσή τους από τους πάπυρους αναβάθμισης. Τα γλύφοι θα αρχίσουν να χάνονται κατά την αναβάθμιση από το επίπεδο 6 (από 4) στο +1 ή το επίπεδο 7 (από 4) στο +2. Το επίπεδο όπου τα γλύφοι είναι εγγυημένα ότι θα χαθούν παραμένει αμετάβλητο στο +8.
actors.hero.talent.runic_transference.title=ρουνική μεταφορά
actors.hero.talent.satiated_spells.desc=_+1:_ Η κατανάλωση φαγητού προκαλεί στον Κληρικό να κερδίσει _3 ασπίδα_ την επόμενη φορά που θα κάνει ένα ξόρκι.\n\n_+2:_ Η κατανάλωση φαγητού προκαλεί στον Κληρικό να κερδίσει _5 ασπίδα_ την επόμενη φορά που θα κάνει ένα ξόρκι.
actors.hero.talent.satiated_spells.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα παρέχει αμέσως θωράκιση, η οποία θα αρχίσει να μειώνεται κανονικά μετά από 10 γύρους.
actors.hero.talent.satiated_spells.title=Ξόρκια για χορτάτους
actors.hero.talent.scholars_intuition.desc=_+1:_ Ο Μάγος αναγνωρίζει τα ραβδιά _3 φορές πιο γρήγορα_.\n\n_+2:_ Ο Μάγος αναγνωρίζει τα ραβδιά _όταν τα χρησιμοποιεί_.
actors.hero.talent.scholars_intuition.title=η διαίσθηση του μελετητή
actors.hero.talent.searing_light.desc=_+1:_ Οι σωματικές επιθέσεις του Κληρικού σε εχθρούς που φωτίζονται από το _Οδηγό Φως_ προκαλούν _+3 ζημιά._\n\n_+2:_ Οι σωματικές επιθέσεις του Κληρικού σε εχθρούς που φωτίζονται από το _Οδηγό Φως_ προκαλούν _+5 ζημιά._
actors.hero.talent.searing_light.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα δώσει την επιπλέον ζημιά του αφού χρησιμοποιηθεί ένα ραβδί ή ένα τεχνούργημα σε έναν εχθρό, με χρόνο αναμονής 20 γύρους.
actors.hero.talent.searing_light.title=Φως που καίει
actors.hero.talent.seer_shot.desc=_+1:_ Όταν η Κυνηγός εκτοξεύει ένα βέλος στο έδαφος, παρέχει όραση σε μια περιοχή 3x3 γύρω του για _5 γύρους_. Αυτό έχει χρόνο αναμονής 20 γύρους.\n\n_+2:_ Όταν η Κυνηγός εκτοξεύει ένα βέλος στο έδαφος, παρέχει όραση σε μια περιοχή 3x3 γύρω του για _10 γύρους_. Αυτό έχει χρόνο αναμονής 20 γύρους.\n\n_+3:_ Όταν η Κυνηγός εκτοξεύει ένα βέλος στο έδαφος, παρέχει όραση σε μια περιοχή 3x3 γύρω του για _15 γύρους_. Αυτό έχει χρόνο αναμονής 20 γύρους.
actors.hero.talent.seer_shot.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα ενεργοποιηθεί από οποιοδήποτε όπλο που θα ριχθεί.
actors.hero.talent.seer_shot.title=βολή μάντη
actors.hero.talent.shadow_blade.desc=_+1:_ Ο κλώνος της σκιάς κερδίζει _8%_ της ζημιάς του ήρωα ανά γύρο και έχει _25% πιθανότητα_ να χρησιμοποιήσει τη γοητεία στο όπλο του ήρωα.\n\n_+2:_ Ο κλώνος της σκιάς κερδίζει _16%_ της ζημιάς του ήρωα ανά γύρο και έχει _50% πιθανότητα_ να χρησιμοποιήσει τη γοητεία στο όπλο του ήρωα.\n\n_+3:_ Ο κλώνος της σκιάς κερδίζει _24%_ της ζημιάς του ήρωα ανά γύρο και έχει _75% πιθανότητα_ να χρησιμοποιήσει τη γοητεία στο όπλο του ήρωα.\n\n_+4:_ Ο κλώνος της σκιάς κερδίζει _32%_ της ζημιάς του ήρωα ανά γύρο και έχει _100% πιθανότητα_ να χρησιμοποιήσει τη γοητεία στο όπλο του ήρωα.
actors.hero.talent.shadow_blade.title=λεπίδα σκιάς
actors.hero.talent.shadow_step.desc=_+1:_ Εάν ο απατεώνας χρησιμοποιήσει βόμβα καπνού ενώ είναι αόρατος, αυτό συμβαίνει αμέσως και έχει _16% μειωμένο_ κόστος φόρτισης, αλλά επίσης δεν τυφλώνει τους εχθρούς ούτε ενεργοποιεί άλλα ταλέντα.\n\n_+2:_ Εάν ο απατεώνας χρησιμοποιήσει βόμβα καπνού ενώ είναι αόρατος, αυτό συμβαίνει αμέσως και έχει _30% μειωμένο_ κόστος φόρτισης, αλλά επίσης δεν τυφλώνει τους εχθρούς ούτε ενεργοποιεί άλλα ταλέντα.\n\n_+3:_ Εάν ο απατεώνας χρησιμοποιήσει βόμβα καπνού ενώ είναι αόρατος, αυτό συμβαίνει αμέσως και έχει _41% μειωμένο_ κόστος φόρτισης, αλλά επίσης δεν τυφλώνει τους εχθρούς ούτε ενεργοποιεί άλλα ταλέντα.\n\n_+4:_ Εάν ο απατεώνας χρησιμοποιήσει βόμβα καπνού ενώ είναι αόρατος, αυτό συμβαίνει αμέσως και έχει _50% μειωμένο_ κόστος φόρτισης, αλλά επίσης δεν τυφλώνει τους εχθρούς ούτε ενεργοποιεί άλλα ταλέντα.
actors.hero.talent.shadow_step.title=σκιώδες βήμα
actors.hero.talent.shared_enchantment.desc=_+1:_ Τα εκτοξευόμενα όπλα έχουν _33% πιθανότητα_ να χρησιμοποιήσουν τη μαγεία στο τόξο του ελεύθερου σκοπευτή.\n\n_+2:_ Τα εκτοξευόμενα όπλα έχουν _67% πιθανότητα_ να χρησιμοποιήσουν τη μαγεία στο τόξο του ελεύθερου σκοπευτή.\n\n_+3:_ Τα εκτοξευόμενα όπλα έχουν _100% πιθανότητα_ να χρησιμοποιήσουν τη μαγεία στο τόξο του ελεύθερου σκοπευτή.\n\nΗ μαγεία του τόξου μπορεί να ενεργοποιηθεί επιπλέον της μαγείας που ήδη έχει το εκτοξευόμενο όπλο.
actors.hero.talent.shared_enchantment.title=κοινή γοητεία
actors.hero.talent.shared_upgrades.desc=_+1:_ Όταν ο ελεύθερος σκοπευτής επιτίθεται με ένα αναβαθμισμένο όπλο που ρίχνεται, κάθε επίπεδο αυξάνει τη διάρκεια του σημαδιού του ελεύθερου σκοπευτή κατά 1 γύρο και τη ζημιά της ειδικής επίθεσής του κατά 16%, σε μέγιστο _2 γύρους και +33% ζημιά στο +2_.\n\n_+2:_ Όταν ο ελεύθερος σκοπευτής επιτίθεται με ένα αναβαθμισμένο όπλο που ρίχνεται, κάθε επίπεδο αυξάνει τη διάρκεια του σημαδιού του ελεύθερου σκοπευτή κατά 1 γύρο και τη ζημιά της ειδικής επίθεσής του κατά 16%, σε μέγιστο _4 γύρους και +67% ζημιά στο +4_.\n\n_+3:_ Όταν ο ελεύθερος σκοπευτής επιτίθεται με ένα αναβαθμισμένο όπλο που ρίχνεται, κάθε επίπεδο αυξάνει τη διάρκεια του σημαδιού του ελεύθερου σκοπευτή κατά 1 γύρο και τη ζημιά της ειδικής επίθεσής του κατά 16%, σε μέγιστο _6 γύρους και +100% ζημιά στο +6_.
actors.hero.talent.shared_upgrades.title=κοινόχρηστες αναβαθμίσεις
actors.hero.talent.shield_battery.desc=_+1:_ Ο Μάγος μπορεί να αυτοστόχευσε με ένα ραβδί για να μετατρέψει όλα τα φορτία του σε θωράκιση με ρυθμό _4% μέγιστης HP ανά φόρτιση_.\n\n_+2:_ Ο Μάγος μπορεί να αυτοστόχευσε με ένα ραβδί για να μετατρέψει όλα τα φορτία του σε θωράκιση με ρυθμό _6% μέγιστης HP ανά φόρτιση_.
actors.hero.talent.shield_battery.title=μπαταρία ασπίδας
actors.hero.talent.shield_of_light.desc=_+1:_ Ο Κληρικός μπορεί να χρησιμοποιήσει την _Ασπίδα Φωτός,_ ένα ξόρκι που εκτελείται αμέσως και του δίνει _2-4 πανοπλίες_ εναντίον ενός στόχου για 5 γύρους με κόστος 1 φόρτισης.\n\n_+2:_ Ο Κληρικός μπορεί να χρησιμοποιήσει την _Ασπίδα Φωτός,_ ένα ξόρκι που εκτελείται αμέσως και του δίνει _3-6 πανοπλίες_ εναντίον ενός στόχου για 5 γύρους με κόστος 1 φόρτισης.
actors.hero.talent.shield_of_light.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα μειώσει τη σωματική ζημιά που δέχεστε από τον στοχευμένο εχθρό σας κατά 1, 33% των περιπτώσεων στο +1 ή 50% των περιπτώσεων στο +2.
actors.hero.talent.shield_of_light.title=ασπίδα φωτός
actors.hero.talent.shielding_dew.desc=_+1:_ Οι Δροσοσταλίδες μπορούν να προστατεύσουν τον Φύλακα όταν η υγεία της είναι πλήρης, έως _20% της μέγιστης HP της_.\n\n_+2:_ Οι Δροσοσταλίδες μπορούν να προστατεύσουν τον Φύλακα όταν η υγεία της είναι πλήρης, έως _40% της μέγιστης HP της_.\n\n_+3:_ Οι Δροσοσταλίδες μπορούν να προστατεύσουν τον Φύλακα όταν η υγεία της είναι πλήρης, έως _60% της μέγιστης HP της_.
actors.hero.talent.shielding_dew.title=προστατευτική δροσιά
actors.hero.talent.shock_force.desc=_+1:_ Το Shockwave προκαλεί _20% περισσότερη ζημιά_ και έχει _25% πιθανότητα_ να ακινητοποιήσει αντί να παραλύσει.\n\n_+2:_ Το Shockwave προκαλεί _40% περισσότερη ζημιά_ και έχει _50% πιθανότητα_ να ακινητοποιήσει αντί να παραλύσει.\n\n_+3:_ Το Shockwave προκαλεί _60% περισσότερη ζημιά_ και έχει _75% πιθανότητα_ να ακινητοποιήσει αντί να παραλύσει.\n\n_+4:_ Το Shockwave προκαλεί _80% περισσότερη ζημιά_ και έχει _100% πιθανότητα_ να ακινητοποιήσει αντί να παραλύσει.
actors.hero.talent.shock_force.title=δύναμη κρούσης
actors.hero.talent.shrug_it_off.desc=_+1:_ Η μείωση ζημιάς του Πολεμιστή ενώ διαρκεί _αυξάνεται στο 60%_, από 50%.\n\n_+2:_ Η μείωση ζημιάς του Πολεμιστή ενώ διαρκεί _αυξάνεται στο 68%_, από 50%.\n\n_+3:_ Η μείωση ζημιάς του Πολεμιστή ενώ διαρκεί _αυξάνεται στο 74%_, από 50%.\n\n_+4:_ Η μείωση ζημιάς του Πολεμιστή ενώ διαρκεί _αυξάνεται στο 80%_, από 50%.
actors.hero.talent.shrug_it_off.title=αγνοήστε το
actors.hero.talent.silent_steps.desc=_+1:_ Ο Ληστής δεν θα ξυπνήσει κοιμισμένους εχθρούς όσο βρίσκεται _3 ή περισσότερα πλακίδια μακριά τους_.\n\n_+2:_ Ο Ληστής δεν θα ξυπνήσει κοιμισμένους εχθρούς όσο _δεν βρίσκεται δίπλα τους_.
actors.hero.talent.silent_steps.title=σιωπηλά βήματα
actors.hero.talent.soul_eater.desc=_+1:_ Το σημάδι ψυχής δίνει _0,33 γύρους_ κορεσμού για κάθε σωματική ζημιά που προκαλείται. Οι εχθροί που έχουν σημαδευτεί με ψυχή έχουν _10% πιθανότητα_ να ενεργοποιήσουν εφέ on-eat όταν πεθαίνουν.\n\n_+2:_ Το σημάδι ψυχής δίνει _0,67 γύρους_ κορεσμού για κάθε σωματική ζημιά που προκαλείται. Οι εχθροί που έχουν σημαδευτεί με ψυχή έχουν _20% πιθανότητα_ να ενεργοποιήσουν εφέ on-eat όταν πεθαίνουν.\n\n_+3:_ Το σημάδι ψυχής δίνει _1 γύρο_ κορεσμού για κάθε σωματική ζημιά που προκαλείται. Οι εχθροί που έχουν σημαδευτεί με ψυχή έχουν _30% πιθανότητα_ να ενεργοποιήσουν εφέ on-eat όταν πεθαίνουν.
actors.hero.talent.soul_eater.title=ψυχοφάγος
actors.hero.talent.soul_siphon.desc=_+1:_ Η σωματική ζημιά που προκαλείται από άλλους χαρακτήρες ενεργοποιεί το σημάδι ψυχής του Μάγου σε _13% αποτελεσματικότητα_.\n\n_+2:_ Η σωματική ζημιά που προκαλείται από άλλους χαρακτήρες ενεργοποιεί το σημάδι ψυχής του Μάγου σε _27% αποτελεσματικότητα_.\n\n_+3:_ Η σωματική ζημιά που προκαλείται από άλλους χαρακτήρες ενεργοποιεί το σημάδι ψυχής του Μάγου σε _40% αποτελεσματικότητα_.
actors.hero.talent.soul_siphon.title=σιφόνι ψυχής
actors.hero.talent.speedy_stealth.desc=_+1:_ Ο Freerunner κερδίζει 2 στοίβες ορμής ανά γύρο όσο είναι αόρατος.\n\n_+2:_ Εκτός από τα οφέλη του +1, το freerunning δεν μετράει πλέον αντίστροφα όσο ο Freerunner είναι αόρατος.\n\n_+3:_ Εκτός από τα οφέλη του +1 και του +2, ο Freerunner κινείται με 2x ταχύτητα ενώ είναι αόρατος, ανεξάρτητα από το αν τρέχει ελεύθερα ή όχι.
actors.hero.talent.speedy_stealth.title=γρήγορη μυστικότητα
actors.hero.talent.spirit_blades.desc=_+1:_ Οι φασματικές λεπίδες έχουν _30% πιθανότητα_ να χρησιμοποιήσουν και τη μαγεία στο πνευματικό τόξο.\n\n_+2:_ Οι φασματικές λεπίδες έχουν _60% πιθανότητα_ να χρησιμοποιήσουν και τη μαγεία στο πνευματικό τόξο.\n\n_+3:_ Οι φασματικές λεπίδες έχουν _90% πιθανότητα_ να χρησιμοποιήσουν και τη μαγεία στο πνευματικό τόξο.\n\n_+4:_ Οι φασματικές λεπίδες έχουν _100% πιθανότητα_ να χρησιμοποιήσουν και τη μαγεία στο πνευματικό τόξο και δίνουν σε κάθε μαγεία _+10% δύναμη_.
actors.hero.talent.spirit_blades.title=λεπίδες πνεύματος
actors.hero.talent.spirit_form.desc=Ο Κληρικός μπορεί να χρησιμοποιήσει την _Πνευματική Μορφή_, η οποία προσδίδει στην Τριάδα τη δύναμη ενός δαχτυλιδιού ή τεχνουργήματος που ο Κληρικός έχει αναγνωρίσει σε αυτήν την εκτέλεση (εκτός από τον ιερό τόμο), με κόστος 4 φορτίσεις.\n\n_+1:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει ένα εφέ δαχτυλιδιού στο _+1_ για 20 γύρους ή θα ενεργοποιήσει ένα εφέ τεχνουργήματος στο _+4._\n\n_+2:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει ένα εφέ δαχτυλιδιού στο _+2_ για 20 γύρους ή θα ενεργοποιήσει ένα εφέ τεχνουργήματος στο _+6._\n\n_+3:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει ένα εφέ δαχτυλιδιού στο _+3_ για 20 γύρους ή θα ενεργοποιήσει ένα εφέ τεχνουργήματος στο _+8._\n\n_+4:_ Όταν χρησιμοποιείται η Τριάδα, ο Κληρικός θα αποκτήσει την επίδραση ενός δαχτυλιδιού στις _+4_ για 20 γύρους ή θα ενεργοποιήσει την επίδραση ενός τεχνουργήματος στις _+10._\n\nΗ Τριάδα μπορεί να εμπλουτιστεί μόνο με μία επίδραση πνεύματος κάθε φορά. Τα Τεχνουργήματα έχουν ποικίλα αποτελέσματα και κόστος φόρτισης θωράκισης όταν ενεργοποιούνται από την Τριάδα.
actors.hero.talent.spirit_form.title=μορφή πνεύματος
actors.hero.talent.stasis.desc=Ο Κληρικός μπορεί να χρησιμοποιήσει _Στάση_ σε έναν ενδυναμωμένο σύμμαχο με κόστος 2 φορτίσεις. Η Στάση αφαιρεί προσωρινά τον σύμμαχο από το μπουντρούμι και διατηρεί τον υπόλοιπο χρόνο σε όλες τις ενισχύσεις, συμπεριλαμβανομένης της Δύναμης των Πολλών. Ο σύμμαχος θα επανεμφανιστεί δίπλα σας όταν τελειώσει η επίδραση. Η Στάση μπορεί να χρησιμοποιηθεί ξανά άμεσα και χωρίς κόστος για να τερματιστεί η επίδραση πρόωρα. Η Στάση λειτουργεί σε ακίνητους συμμάχους, αλλά δεν μπορεί να τους μετακινήσει μεταξύ των ορόφων των μπουντρουμιών.\n\n_+1:_ Η Στάση διαρκεί για μέγιστο _60 γύρους._\n\n_+2:_ Η Στάση διαρκεί για μέγιστο _90 γύρους._\n\n_+3:_ Η Στάση διαρκεί για μέγιστο _120 γύρους._\n\n_+4:_ Η Στάση διαρκεί για μέγιστο _150 γύρους._\n\nΟ Κληρικός μπορεί επίσης να χρησιμοποιήσει την Ακτίνα Ακτίνας όταν ένας σύμμαχος βρίσκεται σε στάση για να τον ανακαλέσει ξανά ή να χρησιμοποιήσει τον Σύνδεσμο Ζωής για να εφαρμόσει προληπτικά την επίδρασή του. Οι Σύμμαχοι, ωστόσο, δεν επωφελούνται από τον Σύνδεσμο Ζωής όσο βρίσκονται σε στάση.
actors.hero.talent.stasis.title=στάση
actors.hero.talent.strengthening_meal.desc=_+1:_ Η κατανάλωση φαγητού δίνει στη Μονομάχο 3 μπόνους ζημιά τις επόμενες _2 φορές_ που χτυπάει έναν εχθρό με σωματική επίθεση.\n\n_+2:_ Η κατανάλωση φαγητού δίνει στη Μονομάχο 3 μπόνους ζημιά τις επόμενες _3 φορές_ που χτυπάει έναν εχθρό με σωματική επίθεση.
actors.hero.talent.strengthening_meal.title=ενισχυτικό γεύμα
actors.hero.talent.striking_force.desc=_+1:_ Η ισχύς του αποτελέσματος του στοιχειακού χτυπήματος αυξάνεται κατά _30%_.\n\n_+2:_ Η ισχύς του αποτελέσματος του στοιχειακού χτυπήματος αυξάνεται κατά _60%_.\n\n_+3:_ Η ισχύς του αποτελέσματος του στοιχειακού χτυπήματος αυξάνεται κατά _90%_.\n\n_+4:_ Η ισχύς του αποτελέσματος του στοιχειακού χτυπήματος αυξάνεται κατά _120%_.
actors.hero.talent.striking_force.title=δύναμη κρούσης
actors.hero.talent.striking_wave.desc=_+1:_ Το Shockwave έχει _30% πιθανότητα_ να χρησιμοποιήσει επίσης εφέ κατά το χτύπημα, όπως μαγικά και συνδυαστικά.\n\n_+2:_ Το Shockwave έχει _60% πιθανότητα_ να χρησιμοποιήσει επίσης εφέ κατά το χτύπημα, όπως μαγικά και συνδυαστικά.\n\n_+3:_ Το Shockwave έχει _90% πιθανότητα_ να χρησιμοποιήσει επίσης εφέ κατά το χτύπημα, όπως μαγικά και συνδυαστικά.\n\n_+4:_ Το Shockwave έχει _100% πιθανότητα_ να χρησιμοποιήσει επίσης εφέ κατά το χτύπημα, όπως μαγικά και συνδυαστικά, και δίνει μαγικά _+20% ισχύ_.
actors.hero.talent.striking_wave.title=χτυπητικό κύμα
actors.hero.talent.strongman.desc=_+1:_ Η δύναμη του Πολεμιστή _αυξάνεται κατά 8%_, στρογγυλοποιείται προς τα κάτω. \n\n_+2:_ Η δύναμη του Πολεμιστή _αυξάνεται κατά 13%_, στρογγυλοποιείται προς τα κάτω. \n\n_+3:_ Η δύναμη του Πολεμιστή _αυξάνεται κατά 18%_, στρογγυλοποιείται προς τα κάτω.
actors.hero.talent.strongman.title=ισχυρός άνδρας
actors.hero.talent.sucker_punch.desc=_+1:_ Ο Ληστής προκαλεί _1-2 επιπλέον ζημιά_ την πρώτη φορά που αιφνιδιάζει έναν εχθρό.\n\n_+2:_ Ο Ληστής προκαλεί _2 επιπλέον ζημιά_ την πρώτη φορά που αιφνιδιάζει έναν εχθρό.
actors.hero.talent.sucker_punch.title=γροθιά
actors.hero.talent.sunray.desc=_+1:_ Ο Κληρικός μπορεί να εκτελέσει την _Sunray,_ ένα ξόρκι που προκαλεί _4-8 ζημιά_ και τυφλώνει τον στόχο για _4 γύρους,_ με κόστος 1 φόρτισης.\n\n_+2:_ Ο Κληρικός μπορεί να εκτελέσει την _Sunray,_ ένα ξόρκι που προκαλεί _6-12 ζημιά_ και τυφλώνει τον στόχο για _6 γύρους,_ με κόστος 1 φόρτισης.\n\nΗ Sunray μπορεί να τυφλώσει κάθε στόχο μόνο μία φορά, αλλά αν ο στόχος έχει ήδη τυφλωθεί από την Sunray, τότε αντίθετα παραλύει. Η Sunray προκαλεί πάντα τη μέγιστη ζημιά σε δαιμονικούς και νεκρό εχθρούς.
actors.hero.talent.sunray.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα προκαλέσει ραβδιά και αντικείμενα που θα τυφλώνουν τους εχθρούς για 4 γύρους, 15% του χρόνου στο +1 ή 25% του χρόνου στο +2.
actors.hero.talent.sunray.title=ηλιαχτίδα
actors.hero.talent.survivalists_intuition.desc=_+1:_ Η Κυνηγός αναγνωρίζει τα εκτοξευόμενα όπλα _3 φορές πιο γρήγορα_.\n\n_+2:_ Η Κυνηγός αναγνωρίζει τα εκτοξευόμενα όπλα _όταν χτυπάει με αυτά_.
actors.hero.talent.survivalists_intuition.title=η διαίσθηση του επιβιωτή
actors.hero.talent.sustained_retribution.desc=_+1:_ Ο Πολεμιστής προκαλεί _115% μπόνους ζημιά_ κατανεμημένη σε _2 χτυπήματα_, αντί για 100% μπόνους ζημιά σε 1 χτύπημα.\n\n_+2:_ Ο Πολεμιστής προκαλεί _130% μπόνους ζημιά_ κατανεμημένη σε _3 χτυπήματα_, αντί για 100% μπόνους ζημιά σε 1 χτύπημα.\n\n_+3:_ Ο Πολεμιστής προκαλεί _145% μπόνους ζημιά_ κατανεμημένη σε _4 χτυπήματα_, αντί για 100% μπόνους ζημιά σε 1 χτύπημα.\n\n_+4:_ Ο Πολεμιστής προκαλεί _160% μπόνους ζημιά_ κατανεμημένη σε _5 χτυπήματα_, αντί για 100% μπόνους ζημιά σε 1 χτύπημα.
actors.hero.talent.sustained_retribution.title=διαρκής τιμωρία
actors.hero.talent.swift_equip.desc=_+1:_ Ο Μονομάχος μπορεί να αλλάξει το εξοπλισμένο όπλο του αμέσως _μία φορά_ κάθε 20 γύρους.\n\n_+2:_ Ο Μονομάχος μπορεί να αλλάξει το εξοπλισμένο όπλο του αμέσως _δύο φορές_ κάθε 20 γύρους.\n\nΕάν ο Μονομάχος έχει αυτό το ταλέντο και δεν είναι σε αναμονή, η γρήγορη χρήση ενός μη εξοπλισμένου όπλου θα το εξοπλίσει.
actors.hero.talent.swift_equip.title=γρήγορος εξοπλισμός
actors.hero.talent.swift_spirit.desc=_+1:_ Η ταχύτητα κίνησης του πνευματικού γερακιού αυξάνεται σε _2,5 πλακίδια_ από 2 και είναι εγγυημένο ότι θα αποφύγει τις πρώτες _2 επιθέσεις_ που θα γίνουν εναντίον του.\n\n_+2:_ Η ταχύτητα κίνησης του πνευματικού γερακιού αυξάνεται σε _3 πλακίδια_ από 2 και είναι εγγυημένο ότι θα αποφύγει τις πρώτες _4 επιθέσεις_ που θα γίνουν εναντίον του.\n\n_+3:_ Η ταχύτητα κίνησης του πνευματικού γερακιού αυξάνεται σε _3,5 πλακίδια_ από 2 και είναι εγγυημένο ότι θα αποφύγει τις πρώτες _6 επιθέσεις_ που θα γίνουν εναντίον του.\n\n_+4:_Η ταχύτητα κίνησης του πνευματικού γερακιού αυξάνεται σε _4 πλακίδια_ από 2 και είναι εγγυημένο ότι θα αποφύγει τις πρώτες _8 επιθέσεις_ που θα γίνουν εναντίον του.
actors.hero.talent.swift_spirit.title=ορμητικό πνεύμα
actors.hero.talent.telefrag.desc=_+1:_ Αν ο Μάγος μετατραπεί σε άλλο χαρακτήρα, προκαλεί _10-15 ζημιά_ σε αυτόν, αλλά δέχεται και _5 ζημιά_.\n\n_+2:_ Αν ο Μάγος μετατραπεί σε άλλο χαρακτήρα, του προκαλεί _20-30 ζημιά_ σε αυτόν, αλλά δέχεται και _10 ζημιά_.\n\n_+3:_ Αν ο Μάγος μετατραπεί σε άλλο χαρακτήρα, του προκαλεί _30-45 ζημιά_ σε αυτόν, αλλά δέχεται και _15 ζημιά_.\n\n_+4:_ Αν ο Μάγος μετατραπεί σε άλλο χαρακτήρα, του προκαλεί _40-60 ζημιά_ σε αυτόν, αλλά δέχεται και _20 ζημιά_.\n\nΟ ήρωας δεν μπορεί να σκοτωθεί από αυτό το ταλέντο, η ζημιά στον εαυτό του μπορεί να μειωθεί με εφέ αντίστασης μαγείας.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Ο Απατεώνας αναγνωρίζει δαχτυλίδια _2 φορές πιο γρήγορα_ και αναγνωρίζει τον τύπο ενός δαχτυλιδιού _όταν το φοράει_.\n\n_+2:_ Ο Απατεώνας αναγνωρίζει δαχτυλίδια _όταν τα φοράει_ και αναγνωρίζει τον τύπο ενός δαχτυλιδιού _όταν το πιάνει_.
actors.hero.talent.thiefs_intuition.title=η διαίσθηση του κλέφτη
actors.hero.talent.twin_upgrades.desc=_+1:_ Εάν ένα από τα δύο εξοπλισμένα όπλα του Πρωταθλητή έχει χαμηλότερο επίπεδο και είναι _2 ή περισσότερες βαθμίδες χαμηλότερο_ από το άλλο όπλο, θα ενισχυθεί στο επίπεδο του άλλου όπλου.\n\n_+2:_ Εάν ένα από τα δύο εξοπλισμένα όπλα του Πρωταθλητή έχει χαμηλότερο επίπεδο και είναι _1 ή περισσότερες βαθμίδες χαμηλότερο_ από το άλλο όπλο, θα ενισχυθεί στο επίπεδο του άλλου όπλου.\n\n_+3:_ Εάν ένα από τα δύο εξοπλισμένα όπλα του Πρωταθλητή έχει χαμηλότερο επίπεδο και είναι _το ίδιο ή χαμηλότερο_ επίπεδο_ από το άλλο όπλο, θα ενισχυθεί στο επίπεδο του άλλου όπλου.
actors.hero.talent.twin_upgrades.title=διπλές αναβαθμίσεις
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Ο Μοναχός κερδίζει _50% περισσότερη ενέργεια_ για κάθε κομμάτι εξοπλισμού _βαθμίδας 3 ή χαμηλότερης_ που χρησιμοποιεί.\n\n_+2:_ Ο Μοναχός κερδίζει _75% περισσότερη ενέργεια_ για κάθε κομμάτι εξοπλισμού _βαθμίδας 2 ή χαμηλότερης_ που χρησιμοποιεί. Το πλεονέκτημα της βαθμίδας 3 παραμένει αμετάβλητο.\n\n_+3:_ Ο Μοναχός κερδίζει _100% περισσότερη ενέργεια_ για κάθε κομμάτι εξοπλισμού _βαθμίδας 1 ή χαμηλότερης_ που χρησιμοποιεί. Τα οφέλη των βαθμίδων 2 και 3 παραμένουν αμετάβλητα. Κερδίζει επίσης μια δωρεάν υφασμάτινη πανοπλία και γάντια με καρφιά.\n\nΣημειώστε ότι αυτό το ταλέντο δεν προσφέρει κανένα όφελος από το να είναι άοπλος ή να επιτίθεται με Δαχτυλίδι Δύναμης.
actors.hero.talent.unencumbered_spirit.title=αφόρητο πνεύμα
actors.hero.talent.varied_charge.desc=_+1:_ Η Πρωταθλήτρια ανακτά αμέσως _0,17 γεμίσεις όπλων_ όταν χρησιμοποιεί δύο διαφορετικές ικανότητες όπλων, χωρίς χρονικό όριο.\n\n_+2:_ Η Πρωταθλήτρια ανακτά αμέσως _0,33 γεμίσεις όπλων_ όταν χρησιμοποιεί δύο διαφορετικές ικανότητες όπλων, χωρίς χρονικό όριο.\n\n_+3:_ Η Πρωταθλήτρια ανακτά αμέσως _0,5 γεμίσεις όπλων_ όταν χρησιμοποιεί δύο διαφορετικές ικανότητες όπλων, χωρίς χρονικό όριο.
actors.hero.talent.varied_charge.title=ποικίλη χρέωση
actors.hero.talent.veterans_intuition.desc=_+1:_ Ο Πολεμιστής αναγνωρίζει όπλα _1,75 φορές πιο γρήγορα_ και πανοπλία _2,5 φορές πιο γρήγορα_.\n\n_+2:_ Ο Πολεμιστής αναγνωρίζει όπλα _2,5 φορές πιο γρήγορα_ και πανοπλία _όταν τα εξοπλίζει_.
actors.hero.talent.veterans_intuition.title=η διαίσθηση ενός βετεράνου
actors.hero.talent.wall_of_light.desc=_+1:_ Ο Παλαδίνος μπορεί να εκτελέσει το _Τείχος Φωτός,_ ένα ξόρκι που δημιουργεί ένα συμπαγές τοίχο πλάτους _3 πλακιδίων_ μπροστά από τον Παλαδίνο, το οποίο απωθεί τους εχθρούς και διαρκεί για 20 γύρους, με κόστος 3 φορτίσεις.\n\n_+2:_ Ο Παλαδίνος μπορεί να εκτελέσει το _Τείχος Φωτός,_ ένα ξόρκι που δημιουργεί ένα συμπαγές τοίχο πλάτους _5 πλακιδίων_ μπροστά από τον Παλαδίνο, το οποίο απωθεί τους εχθρούς και διαρκεί για 20 γύρους, με κόστος 3 φορτίσεις.\n\n_+3:_ Ο Παλαδίνος μπορεί να εκτελέσει το _Τείχος Φωτός,_ ένα ξόρκι που δημιουργεί ένα συμπαγές τοίχο πλάτους _7 πλακιδίων_ μπροστά από τον Παλαδίνο, το οποίο απωθεί τους εχθρούς και διαρκεί για 20 γύρους, με κόστος 3 φορτίσεις.\n\n Το τοίχος μπορεί να τοποθετηθεί πλευρικά ή διαγώνια, μόνο ένα τοίχος μπορεί να υπάρχει κάθε φορά.
actors.hero.talent.wall_of_light.title=τοίχος φωτός
actors.hero.talent.wand_preservation.desc=_+1:_ Όταν ο Μάγος εισάγει ένα νέο ραβδί στο ραβδί του, το παλιό ραβδί επιστρέφεται στο +0, _αλλά αυτό μπορεί να γίνει μόνο μία φορά._\n\n_+2:_ Όταν ο Μάγος εισάγει ένα νέο ραβδί στο ραβδί του, το παλιό ραβδί επιστρέφεται στο +0, _αυτό μπορεί να επαναληφθεί με χρόνο αναμονής ενός επιπέδου ήρωα._
actors.hero.talent.wand_preservation.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα αυξηθεί η ποσότητα της ρητίνης από μυστηρίου που αποκτάται όταν βάζετε ένα ραβδί σε ένα δοχείο αλχημείας κατά 1 στο +1 ή κατά 2 στο +2.
actors.hero.talent.wand_preservation.title=συντήρηση ραβδιού
actors.hero.talent.weapon_recharging.desc=_+1:_ Ο Μονομάχος κερδίζει μία φόρτιση όπλου κάθε _15 γύρους_ όταν βρίσκεται υπό την επίδραση ενισχύσεων επαναφόρτισης ραβδιού ή τεχνουργήματος.\n\n_+2:_ Ο Μονομάχος κερδίζει μία φόρτιση όπλου κάθε _10 γύρους_ όταν βρίσκεται υπό την επίδραση ενισχύσεων επαναφόρτισης ραβδιού ή τεχνουργήματος.
actors.hero.talent.weapon_recharging.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, θα προκαλέσει +5% ζημιά σε μάχη σώμα με σώμα κατά την επαναφόρτιση στο +1 ή +7,5% ζημιά σε μάχη σώμα με σώμα κατά την επαναφόρτιση στο +2.
actors.hero.talent.weapon_recharging.title=επαναφόρτιση όπλων
actors.hero.talent.wide_search.desc=_+1:_ Η ακτίνα αναζήτησης του Rogue αυξάνεται από τετράγωνο 5x5 σε κύκλο _7x7_.\n\n_+2:_ Η ακτίνα αναζήτησης του Rogue αυξάνεται από τετράγωνο 5x5 σε τετράγωνο _7x7_.
actors.hero.talent.wide_search.meta_desc=_Εάν αυτό το ταλέντο αποκτηθεί από διαφορετικό ήρωα_, η ακτίνα αναζήτησής του θα αυξηθεί από τετράγωνο 3x3 σε κύκλο 5x5 στο +1 ή σε τετράγωνο 5x5 στο +2.
actors.hero.talent.wide_search.title=ευρεία αναζήτηση
actors.hero.talent.wild_momentum.desc=_+1:_ Η εξόντωση ενός εχθρού με το πνευματικό τόξο παρατείνει τη διάρκεια της δύναμης της φύσης κατά _1 γύρο_. Η διάρκεια μπορεί να παραταθεί κατά _2 γύρους_ το μέγιστο.\n\n_+2:_ Η εξόντωση ενός εχθρού με το πνευματικό τόξο παρατείνει τη διάρκεια της δύναμης της φύσης κατά _2 γύρους_. Η διάρκεια μπορεί να παραταθεί κατά _4 γύρους_ το μέγιστο.\n\n_+3:_ Η εξόντωση ενός εχθρού με το πνευματικό τόξο παρατείνει τη διάρκεια της δύναμης της φύσης κατά _3 γύρους_. Η διάρκεια μπορεί να παραταθεί κατά _6 γύρους_ το μέγιστο.\n\n_+4:_ Η εξόντωση ενός εχθρού με το πνευματικό τόξο παρατείνει τη διάρκεια της δύναμης της φύσης κατά _4 γύρους_. Η διάρκεια μπορεί να παραταθεί κατά _8 γύρους_ το μέγιστο.
actors.hero.talent.wild_momentum.title=άγρια ορμή
actors.hero.talent.wild_power.desc=_+1:_ Όταν χρησιμοποιείτε άγρια μαγεία, τα ραβδιά θα ενισχύονται κατά _2 ή 3, έως +4_.\n\n_+2:_ Όταν χρησιμοποιείτε άγρια μαγεία, τα ραβδιά θα ενισχύονται κατά _3, έως +5_.\n\n_+3:_ Όταν χρησιμοποιείτε άγρια μαγεία, τα ραβδιά θα ενισχύονται κατά _3 ή 4, έως +6_.\n\n_+4:_ Όταν χρησιμοποιείτε άγρια μαγεία, τα ραβδιά θα ενισχύονται κατά _4, έως +7_.
actors.hero.talent.wild_power.title=άγρια δύναμη
actors.mobs.acidic.desc=Αυτά τα τεράστια δαιμονικά πλάσματα που μοιάζουν με αραχνοειδή αποφεύγουν τις μάχες σώμα με σώμα, προτιμώντας να πυροβολούν με παραλυτικά οδοντωτά καρφιά από μεγάλες αποστάσεις. Αυτό φαίνεται να στάζει διαβρωτική λάσπη.
actors.mobs.acidic.name=όξινος σκορπιός
actors.mobs.albino.desc=Πρόκειται για μια σπάνια ράτσα μαρσιποφόρου αρουραίου, με καθαρό λευκό τρίχωμα και οδοντωτά δόντια.
actors.mobs.albino.discover_hint=Σπάνια μπορείς να βρεις αυτόν τον εχθρό σε μια συγκεκριμένη περιοχή του μπουντρουμιού.
actors.mobs.albino.name=αλμπίνος αρουραίος
actors.mobs.armoredbrute.desc=Τα πιο ανώτερα θηρία των gnoll συχνά φορούν ισχυρή πανοπλία για να δείξουν την ιδιότητά τους. Η πανοπλία κάνει αυτά τα θηρία πολύ πιο ανθεκτικά στη σωματική ζημιά, και η μεγαλύτερη πειθαρχία τους σημαίνει ότι μπορούν να οργιστούν για πολύ περισσότερο χρόνο πριν υποκύψουν στα τραύματά τους.
actors.mobs.armoredbrute.name=θωρακισμένο θηρίο
actors.mobs.armoredstatue.desc=Θα νόμιζε κανείς ότι είναι απλώς ένα από τα άψυχα αγάλματα αυτού του μπουντρουμιού, αλλά τα κόκκινα λαμπερά μάτια του το προδίδουν. \n\n Φαίνεται να είναι σε άριστη κατάσταση λόγω της πανοπλίας που φοράει, μπορεί να είναι πολύ δύσκολο να το σκοτώσεις.
actors.mobs.armoredstatue.desc_arm_wep=Ενώ το ίδιο το άγαλμα είναι φτιαγμένο από πέτρα, τα _%1$s_ και _%2$s_ που κρατάει μοιάζουν με αληθινά.
actors.mobs.armoredstatue.name=θωρακισμένο άγαλμα
actors.mobs.bandit.desc=Τα βαθύτερα επίπεδα του μπουντρουμιού ήταν πάντα κρυψώνα για κάθε είδους εγκληματίες. Δεν μπορούσαν όλοι να διατηρήσουν καθαρό μυαλό κατά τη διάρκεια των παρατεταμένων περιόδων που βρίσκονταν τόσο μακριά από το φως της ημέρας. Πριν από πολύ καιρό, αυτοί οι τρελοί κλέφτες και ληστές είχαν ξεχάσει ποιοι είναι και γιατί κλέβουν.
actors.mobs.bandit.name=τρελός ληστής
actors.mobs.bat.desc=Αυτοί οι ζωηροί και επίμονοι κάτοικοι των σπηλαίων είναι πολύ πιο επικίνδυνοι από ό,τι φαίνονται. Αναπληρώνουν την υγεία τους με κάθε επιτυχημένη επίθεση, η οποία τους επιτρέπει να νικούν πολύ μεγαλύτερους αντιπάλους.
actors.mobs.bat.name=νυχτερίδα βρικόλακα
actors.mobs.bee.desc=Παρά το μικρό τους μέγεθος, οι χρυσές μέλισσες τείνουν να προστατεύουν το σπίτι τους με σθένος. Αυτή είναι πολύ τρελή, καλύτερα να κρατάτε αποστάσεις.
actors.mobs.bee.desc_honey=Παρά το μικρό τους μέγεθος, οι χρυσές μέλισσες τείνουν να προστατεύουν σθεναρά το σπίτι τους. Αυτή η μέλισσα έχει ηρεμήσει και φαίνεται να θέλει να σας ακολουθήσει.
actors.mobs.bee.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με ένα συγκεκριμένο αντικείμενο.
actors.mobs.bee.name=χρυσή μέλισσα
actors.mobs.brute$bruterage.desc=Αυτό το θηρίο του gnoll πεθαίνει, αλλά θέλει να σε πάρει μαζί του! \n\nΤο θηρίο θα πεθάνει όταν η θωράκισή του φθαρεί, είτε λόγω χρόνου είτε αν υποστεί ζημιά. Στο μεταξύ, θα προκαλέσει σημαντικά αυξημένη ζημιά, οπότε προσέξτε! \n\nΑσπίδα που απομένει: %d.
actors.mobs.brute$bruterage.name=ωμή οργή
actors.mobs.brute.def_verb=μπλοκαρισμένο
actors.mobs.brute.desc=Οι κτηνώδεις είναι οι μεγαλύτεροι, δυνατότεροι και πιο ανθεκτικοί από όλα τα γκνολ. Όταν τραυματίζονται βαριά, αφηνιάζουν και προκαλούν ακόμη μεγαλύτερη ζημιά στους εχθρούς τους.
actors.mobs.brute.enraged=εξοργισμένος
actors.mobs.brute.name=κτηνώδες γκνολ
actors.mobs.causticslime.desc=Αυτή η λάσπη φαίνεται να έχει μολυνθεί από τη σκοτεινή μαγεία που πηγάζει από κάτω. Έχει χάσει το συνηθισμένο της πράσινο χρώμα και στάζει καυστική λάσπη.
actors.mobs.causticslime.discover_hint=Σπάνια μπορείς να βρεις αυτόν τον εχθρό σε μια συγκεκριμένη περιοχή του μπουντρουμιού.
actors.mobs.causticslime.name=καυστική λάσπη
actors.mobs.crab.desc=Αυτά τα τεράστια καβούρια βρίσκονται στην κορυφή της τροφικής αλυσίδας στους υπονόμους. Είναι εξαιρετικά γρήγορα και το παχύ καβούκι τους μπορεί να αντέξει ισχυρά χτυπήματα.
actors.mobs.crab.name=καβούρι υπονόμων
actors.mobs.crystalguardian.def_verb=μπλοκαρισμένο
actors.mobs.crystalguardian.desc=Αυτοί οι μεγάλοι κρυστάλλινοι φύλακες μοιάζουν σχεδόν με αγάλματα, αν δεν υπήρχαν τα λαμπερά τους μάτια. Ο σκληρυμένος κρύσταλλος από τον οποίο είναι κατασκευασμένοι τους κάνει να είναι νωθροί αλλά πολύ ανθεκτικοί, οπότε _είναι καλύτερο να τους αφήνετε να κοιμούνται στην κρυστάλλινη φωλιά τους για όσο το δυνατόν περισσότερο._\n\nΛόγω του μεγέθους τους, οι κρυστάλλινοι φύλακες κινούνται πολύ πιο αργά σε κλειστούς χώρους. Είναι επίσης τόσο ανθεκτικοί που είναι αδύνατο να τους σκοτώσεις αμέσως. Μπορούν να χτυπηθούν και να ακινητοποιηθούν προσωρινά, αλλά απλώς θα ξανασηκωθούν μετά από λίγο.
actors.mobs.crystalguardian.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.crystalguardian.name=κρυστάλλινος φύλακας
actors.mobs.crystalmimic.ate=Ο μιμητής έφαγε το %s σου!
actors.mobs.crystalmimic.desc=Οι μιμητές είναι μαγικά πλάσματα που μπορούν να πάρουν οποιοδήποτε σχήμα επιθυμούν. Στα μπουντρούμια σχεδόν πάντα επιλέγουν το σχήμα ενός σεντουκιού θησαυρού, προκειμένου να προσελκύσουν ανυποψίαστους τυχοδιώκτες.\n\nΟι κρυστάλλινοι μιμητές είναι πιο δύσπιστοι από τους συνηθισμένους ξαδέρφους τους και προτιμούν να αποφεύγουν τις συγκρούσεις ενώ κλέβουν λάφυρα. Θα προσπαθήσουν να τρέξουν μακριά μόλις ανακαλυφθούν και έχουν την ικανότητα να επανατοποθετούν τους εχθρούς όταν επιτίθενται.
actors.mobs.crystalmimic.escaped=Το κρυστάλλινο μιμούμενο έχει δραπετεύσει!
actors.mobs.crystalmimic.name=κρυστάλλινο μιμητικό
actors.mobs.crystalspire.alert=Η δόνηση μεγαλώνει και βροντάει σε όλη τη σπηλιά!
actors.mobs.crystalspire.desc=Αυτή η γιγάντια κορυφή από εξαιρετικά σκληρό κρύσταλλο είναι πιθανώς η πηγή όλων των παράξενων κρυστάλλινων πλασμάτων σε αυτή τη σπηλιά. Τα συνηθισμένα σας όπλα είναι αναποτελεσματικά εναντίον της, επομένως θα χρειαστεί να χρησιμοποιήσετε την αξίνα σας αν θέλετε να την καταστρέψετε.\n\n_Βεβαιωθείτε ότι είστε προετοιμασμένοι πριν ξεκινήσετε να την σπάτε._ Ένας τόσο μεγάλος κρύσταλλος είναι πιθανό να χρειαστεί λίγο χρόνο για να διαπεράσει κανείς και πιθανότατα δεν θα μπορείτε να το κάνετε ανενόχλητοι. Η ίδια η κορυφή μπορεί να έχει και κάποια μέσα για να αμυνθεί. _Ίσως οι δικές της επιθέσεις της κορυφής θα μπορούσαν να χρησιμοποιηθούν εναντίον των υπηρετών της._
actors.mobs.crystalspire.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.crystalspire.name=κρυστάλλινο κωδωνοστάσιο
actors.mobs.crystalspire.warning=Ο κρύσταλλος δονείται καθώς τον χτυπάς. Συνεχίζοντας έτσι, είναι σίγουρο ότι θα τραβήξεις την προσοχή πάνω σου...
actors.mobs.crystalwisp.beam_kill=Η δέσμη φωτός σε σκότωσε...
actors.mobs.crystalwisp.desc=Ένα μικρό θυμωμένο, αιωρούμενο κομμάτι σκληρυμένου κρυστάλλου που παράγει μια λαμπερή λάμψη. Αν και δεν είναι ιδιαίτερα ισχυρές, οι κρυστάλλινες τούφες θα εκτοξεύσουν μια καταστροφική δέσμη φωτός προς το μέρος σας αν έχουν μια καθαρή βολή.\n\nΟι τούφες είναι αρκετά μικρές για να κινούνται εύκολα μέσα από τις διάφορες κρυσταλλικές προεξοχές, αλλά δεν είναι σε θέση να τις διαπεράσουν.
actors.mobs.crystalwisp.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.crystalwisp.name=κρυστάλλινο λούστρο
actors.mobs.demonspawner.desc=Αυτό το στριφογυριστό αμάλγαμα σάρκας νάνων είναι υπεύθυνο για τη δημιουργία δαιμόνων-αντεροβγάλτη από τους νάνους που έχουν πεθάνει σε αυτήν την περιοχή. Σαφώς οι δαίμονες δεν βλέπουν κανένα πρόβλημα να χρησιμοποιήσουν κάθε πόρο που μπορούν εναντίον των εχθρών τους.\n\nΕνώ είναι οπτικά τρομακτικοί, οι δημιουργοί δαιμόνων δεν έχουν μέσα να κινηθούν ή να αμυνθούν άμεσα. Ωστόσο, η σημαντική μάζα τους τους καθιστά δύσκολο να τους σκοτώσετε γρήγορα, και θα δημιουργήσουν δαίμονες-αντεροβγάλτες πιο γρήγορα όταν απειλούνται.\n\n_Οι δημιουργοί δαιμόνων φαίνεται να συνδέονται με κάποια κεντρική πηγή δαιμονικής δύναμης. Η θανάτωσή τους μπορεί να την αποδυναμώσει._
actors.mobs.demonspawner.name=δημητριακός
actors.mobs.demonspawner.on_death=Η δαιμονική ενέργεια εδώ φαίνεται να μειώνεται καθώς ο δημιουργός πεθαίνει.
actors.mobs.dm100.desc=Το DM-100 είναι ένα πρώιμο μοντέλο «αμυντικής μηχανής» των νάνων, το οποίο σχεδιάστηκε για να προστατεύει τους νάνους ανθρακωρύχους στις σπηλιές κάτω από αυτή τη φυλακή. Τα ηλεκτρικά τους σοκ αποδείχθηκαν πολύ ασθενή, κι έτσι δωρίστηκαν στην ανθρώπινη πόλη από πάνω. Δεν χρησιμοποιήθηκαν για χρόνια και τελικά κατέληξαν στη φυλακή, όπου ο φύλακας αρχικά τα θεώρησε πολύ σκληρά για να τα χρησιμοποιήσει. Ωστόσο, καθώς οι κρατούμενοι γίνονταν πιο άτακτοι, έγιναν απαραίτητα.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Ο κεραυνός σε σκότωσε...
actors.mobs.dm200.desc=Το DM-200 είναι η δεύτερη γενιά «αμυντικής μηχανής» των νάνων, η οποία σχεδιάστηκε για να προστατεύει τους νάνους ανθρακωρύχους στις σπηλιές και την πόλη από κάτω. Είναι πολύ μεγαλύτερα και πιο ογκώδη από τους προκατόχους τους και επιτίθενται με καταστροφικές υδραυλικές γροθιές.\n\nΤο αυξημένο μέγεθός τους είναι επίσης η κύρια αδυναμία τους, καθώς δεν μπορούν να χωρέσουν στις στενές σήραγγες και τις πόρτες του μπουντρουμιού. Οι νάνοι ήταν σε θέση να αντισταθμίσουν την έλλειψη κινητικότητας του DM-200 επιτρέποντάς τους να εξαπολύουν τα τοξικά καυσαέρια τους σε μακρινούς εχθρούς ή σε εχθρούς που δεν μπορούν να φτάσουν.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Το DM-200 εκτοξεύει ένα πίδακα τοξικών καυσαερίων!
actors.mobs.dm201.desc=Οι νάνοι πειραματίστηκαν για λίγο δίνοντας μεγαλύτερη έμφαση στην έλλειψη κινητικότητας του DM-200 και δημιούργησαν ορισμένα μοντέλα DM που είναι εντελώς ακίνητα. Το DM-201 είναι ένα αναβαθμισμένο DM-200 που λειτουργεί ως πυργίσκος φρουράς χωρίς δυνατότητα κίνησης. Σε αντάλλαγμα για την έλλειψη κινητικότητας, τα DM-201 έχουν σημαντικά μεγαλύτερη ανθεκτικότητα και επιθετική ισχύ.\n\nA Τα DM-201 δεν έχουν κινητήρα για την εξαέρωση των καυσαερίων, αντίθετα οι νάνοι τα εξόπλισαν με διαβρωτικές χειροβομβίδες αερίου! Τα DM-201 είναι προσεκτικά με αυτές τις χειροβομβίδες, ωστόσο, και θα τις ρίξουν μόνο όταν δέχονται επίθεση από απόσταση.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Το DM-201 εκτοξεύει μια διαβρωτική χειροβομβίδα!
actors.mobs.dm300.charge_lost=ΚΑΤΑΣΤΡΑΦΗΚΕ ΠΥΛΩΝΑΣ! ΕΠΙΣΤΡΟΦΗ ΣΤΗΝ ΤΟΠΙΚΗ ΕΝΕΡΓΕΙΑ!
actors.mobs.dm300.charging=ΥΠΟΣΤΗΡΙΖΟΝΤΑΣ ΖΗΜΙΑ! ΕΝΕΡΓΟΠΟΙΩΝΤΑΣ ΠΥΛΩΝΑ ΙΣΧΥΟΣ!
actors.mobs.dm300.charging_hint=Το DM-300 είναι άτρωτο ενώ τροφοδοτείται από έναν πυλώνα!
actors.mobs.dm300.def_verb=μπλοκαρισμένο
actors.mobs.dm300.defeated=ΚΡΙΣΙΜΗ ΖΗΜΙΑ! ΠΡΟΣΠΑΘΕΙΑ ΚΛΕΙΣΙΜΑΤΟΣ-
actors.mobs.dm300.desc=Αυτή η μηχανή κατασκευάστηκε από τους νάνους πριν από αρκετούς αιώνες. Αργότερα άρχισαν να αντικαθιστούν τις μηχανές με γκόλεμ, στοιχειακά πλάσματα, ακόμη και δαίμονες. Αυτό οδήγησε τελικά τον πολιτισμό τους στην παρακμή. Το DM-300 και παρόμοιες μηχανές χρησιμοποιούνταν κυρίως για οικοδομές και εξόρυξη, αλλά μερικές φορές και για την άμυνα της πόλης.
actors.mobs.dm300.desc_supercharged=Το DM-300 είναι αυτήν τη στιγμή φορτισμένο με ηλεκτρική ενέργεια. Σε αυτή τη μορφή, το DM-300 δεν μπορεί να υποστεί ζημιά και κινείται με διπλάσια ταχύτητα! Επιπλέον, το τρυπάνι του περιστρέφεται πλέον αρκετά γρήγορα ώστε να _διασχίζει τούνελ μέσα από συμπαγή βράχο,_ αν και κινείται πολύ πιο αργά όταν το κάνει αυτό.\n\nΗ άμεση επίθεση στο DM-300 είναι άσκοπη όσο είναι υπερφορτισμένο, αλλά _κάτι στην περιοχή πρέπει να του παρέχει αυτή την ενέργεια,_ καταστρέφοντάς το που μπορεί να το αποδυναμώσει.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ΕΝΤΟΠΙΣΤΗΚΕ ΜΗ ΕΞΟΥΣΙΟΔΟΤΗΜΕΝΟ ΠΡΟΣΩΠΙΚΟ!
