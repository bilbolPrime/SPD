actors.blobs.foliage.desc=Ακτίνες φωτός διαπερνούν το σκοτεινό μέρος του υπόγειου κήπου.
actors.blobs.foliage.name=φύλλωμα
actors.blobs.freezing.desc=Ο αέρας εδώ είναι αφύσικα παγωμένος.
actors.blobs.freezing.name=παγωμένος αέρας
actors.blobs.goowarn.desc=Στίγματα σκοτεινής ενέργειας σμήνονται εδώ!
actors.blobs.goowarn.name=σκοτεινή ενέργεια
actors.blobs.inferno.desc=Μια κόλαση μαίνεται εδώ.
