actors.mobs.dm300.rankings_desc=Συντριμμένος από το DM-300
actors.mobs.dm300.shield=Το DM-300 τραβάει ρεύμα από τα εκτεθειμένα καλώδια και θωρακίζεται!
actors.mobs.dm300.supercharged=ΚΑΤΑΣΤΡΕΨΤΕ! ΚΑΤΑΣΤΡΕΨΤΕ! ΚΑΤΑΣΤΡΕΨΤΕ!
actors.mobs.dwarfking$dkghoul.rankings_desc=Έπεσε Ενώπιον του Βασιλιά των Νάνων
actors.mobs.dwarfking$dkgolem.rankings_desc=Έπεσε Ενώπιον του Βασιλιά των Νάνων
