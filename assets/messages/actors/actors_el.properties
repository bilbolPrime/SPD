actors.mobs.dwarfking.defeated=Μας έχεις... καταδικάσει όλους...
actors.mobs.dwarfking.desc=Πριν από πολλά χρόνια, ένας από τους υψηλότερους μάγους στην αυλή των νάνων αποκάλυψε μυστικά που του έδιναν τεράστια δύναμη πάνω στη ζωή και τον θάνατο. Σύντομα χρησιμοποίησε αυτή τη δύναμη, υποτάσσοντας και διαφθείροντας τους συνομηλίκους του, τον βασιλιά του και τελικά κάθε νάνο πολίτη. Τώρα είναι βασιλιάς, κυβερνήτης μιας λεγεώνας από νεκροζώντανους υπηκόους. \n\n Ο Βασιλιάς των Νάνων είναι ένας επιθετικός εχθρός, που θα προσπαθήσει να περικυκλώσει και να κατακλύσει τους εχθρούς του με την ορδή των νεκροζώντανων υπηκόων του.
actors.mobs.dwarfking.enraged=Δεν μπορείς να με σκοτώσεις %s. ΕΙΜΑΙ. ΑΘΑΝΑΤΟΣ!
actors.mobs.dwarfking.lifelink_1=Έχω ανάγκη την ουσία σου, σκλάβε!
actors.mobs.dwarfking.lifelink_2=Αιμορραγήστε για μένα, σκλάβε!
actors.mobs.dwarfking.losing=Όχι! Δεν μπορείς να το κάνεις αυτό... δεν έχεις ιδέα τι κρύβεται από κάτω...
actors.mobs.dwarfking.name=Βασιλιάς των Νάνων
actors.mobs.dwarfking.notice=Πώς τολμάς! Δεν έχεις ιδέα σε τι ανακατεύεσαι!
actors.mobs.dwarfking.rankings_desc=Έπεσε Ενώπιον του Βασιλιά των Νάνων
actors.mobs.dwarfking.teleport_1=Αντιμετώπισέ τους, σκλάβε!
actors.mobs.dwarfking.teleport_2=Κράτα τους απασχολημένους, σκλάβε!
actors.mobs.dwarfking.wave_1=Αρκετά! Σηκωθείτε σκλάβοι μου!
actors.mobs.dwarfking.wave_2=Περισσότερα! Αιμορραγήστε για τον βασιλιά σας!
actors.mobs.dwarfking.wave_3=Άχρηστος! ΣΚΟΤΩΣΤΕ ΤΟΥΣ ΤΩΡΑ!
actors.mobs.ebonymimic.desc=Οι μιμητές είναι μαγικά πλάσματα που μπορούν να πάρουν οποιοδήποτε σχήμα επιθυμούν. Στα μπουντρούμια σχεδόν πάντα επιλέγουν το σχήμα ενός σεντουκιού θησαυρού, προκειμένου να προσελκύσουν ανυποψίαστους τυχοδιώκτες.\n\nΟι έβενοι μιμητές είναι κρυφοί μιμητές με την ικανότητα να γίνονται σχεδόν αόρατοι. Κρύβονται σε πράγματα με τα οποία είναι πιθανό να αλληλεπιδράσουν οι τυχοδιώκτες, αλλά περιέχουν και δικά τους λάφυρα. Δεν είναι πιο σκληροί από έναν κανονικό μιμητή μόλις ανακαλυφθούν, αλλά το ξαφνικό τους δάγκωμα είναι καταστροφικό.
actors.mobs.ebonymimic.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό με ένα συγκεκριμένο μπιχλιμπίδι.
actors.mobs.ebonymimic.hidden_desc=Φαίνεται να υπάρχει κάτι εδώ, αλλά είναι σχεδόν εντελώς διαφανές.
actors.mobs.ebonymimic.hidden_name=ύποπτο περίγραμμα
actors.mobs.ebonymimic.name=έβενο μιμείται
actors.mobs.ebonymimic.reveal=Υπήρχε ένας μιμητής εκεί!
actors.mobs.elemental$chaoselemental.desc=Τα Στοιχειακά είναι χαοτικά πλάσματα που δημιουργούνται συχνά όταν η ισχυρή απόκρυφη μαγεία δεν ελέγχεται σωστά. Τα Στοιχειακά έχουν ελάχιστη νοημοσύνη και συνήθως συνδέονται με ένα συγκεκριμένο είδος μαγείας.\n\nΤα στοιχειώδη του χάους είναι σπάνια και επικίνδυνα στοιχειώδη που δεν έχουν σταθεροποιηθεί σε ένα συγκεκριμένο στοιχείο. Θα εξαπολύσουν άγρια απρόβλεπτη μαγεία όταν επιτεθούν.
actors.mobs.elemental$chaoselemental.name=στοιχειώδες χάος
actors.mobs.elemental$fireelemental.desc=Τα Στοιχειακά είναι χαοτικά πλάσματα που δημιουργούνται συχνά όταν η ισχυρή απόκρυφη μαγεία δεν ελέγχεται σωστά. Τα Στοιχειακά έχουν ελάχιστη νοημοσύνη και συνήθως συνδέονται με ένα συγκεκριμένο είδος μαγείας.\n\nΤα Στοιχειακά της Φωτιάς είναι ένας κοινός τύπος Στοιχειακών που προκαλεί ζημιά με πύρινη μαγεία. Θα βάλουν φωτιά στον στόχο τους με επιθέσεις σώμα με σώμα και μπορούν περιστασιακά να εκτοξεύσουν και βολές φωτιάς.
actors.mobs.elemental$fireelemental.name=στοιχειώδης φωτιά
actors.mobs.elemental$frostelemental.desc=Τα Στοιχειακά είναι χαοτικά πλάσματα που δημιουργούνται συχνά όταν η ισχυρή απόκρυφη μαγεία δεν ελέγχεται σωστά. Τα Στοιχειακά έχουν ελάχιστη νοημοσύνη και συνήθως συνδέονται με ένα συγκεκριμένο είδος μαγείας.\n\nΤα Παγωμένα Στοιχειακά είναι ένας κοινός τύπος Στοιχειακών που αποδυναμώνει τους εχθρούς με ανατριχιαστική μαγεία. Θα ανακουφίσουν τον στόχο τους με μάχη σώμα με σώμα και περιστασιακές επιθέσεις από απόσταση. Η μαγεία τους είναι πολύ πιο αποτελεσματική στο νερό.
actors.mobs.elemental$frostelemental.name=στοιχειώδης παγετός
actors.mobs.elemental$newbornfireelemental.charging=Το στοιχειώδες φορτίζει!
actors.mobs.elemental$newbornfireelemental.desc=Τα Στοιχειακά είναι χαοτικά πλάσματα που συχνά δημιουργούνται όταν η ισχυρή απόκρυφη μαγεία δεν ελέγχεται σωστά. Τα Στοιχειακά έχουν ελάχιστη νοημοσύνη και συνήθως συνδέονται με ένα συγκεκριμένο είδος μαγείας.\n\nΑυτό το στοιχειώδες της φωτιάς έχει πρόσφατα κληθεί, αλλά εξακολουθεί να είναι αρκετά επικίνδυνο!
actors.mobs.elemental$newbornfireelemental.desc_ally=Επειδή αυτό το στοιχειώδες κλήθηκε από ένα ξόρκι, έχει λίγο περισσότερο έλεγχο πάνω στη φλόγα του. Δεν είναι σε θέση να κάνει επιθέσεις από απόσταση, αλλά θα πυροδοτήσει τους εχθρούς στους οποίους επιτίθεται σε μάχη σώμα με σώμα.
actors.mobs.elemental$newbornfireelemental.desc_boss=Λόγω της χαοτικής φύσης της επίκλησής του, αυτό το στοιχειώδες μπορεί να εξαπλώσει φωτιά μόνο σε ανακριβείς εκρήξεις αφού επιτεθεί για έναν γύρο.
actors.mobs.elemental$newbornfireelemental.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.elemental$newbornfireelemental.name=νεογέννητο στοιχειώδες φωτιάς
actors.mobs.elemental$shockelemental.desc=Τα Στοιχειακά είναι χαοτικά πλάσματα που δημιουργούνται συχνά όταν η ισχυρή απόκρυφη μαγεία δεν ελέγχεται σωστά. Τα Στοιχειακά έχουν ελάχιστη νοημοσύνη και συνήθως συνδέονται με ένα συγκεκριμένο είδος μαγείας.\n\nΤα σοκαριστικά στοιχειώδη είναι ένας λιγότερο συνηθισμένος τύπος στοιχειακού που διαταράσσει τους εχθρούς του με ηλεκτρισμό και λάμψεις φωτός. Σε μάχη σώμα με σώμα, θα εκπέμπουν ηλεκτρισμό σε κοντινούς εχθρούς και θα προκαλούν επιπλέον ζημιά στον κύριο στόχο τους εάν βρίσκονται στο νερό. Επίσης, περιστασιακά θα εστιάζουν μια μακρινή έκρηξη φωτός στον στόχο τους, τυφλώνοντάς τον προσωρινά.
actors.mobs.elemental$shockelemental.name=στοιχειώδες σοκ
actors.mobs.eye.deathgaze_kill=Το βλέμμα του θανάτου σε σκότωσε...
actors.mobs.eye.desc=Αυτός ο δαίμονας είναι γνωστός και ως «σφαίρα μίσους». Μόλις δει εχθρό, χρησιμοποιεί απερίσκεπτα το θανατηφόρο βλέμμα του, συχνά αδιαφορώντας για τους συμμάχους του και τραυματίζοντάς τους.
actors.mobs.eye.name=κακό μάτι
actors.mobs.fetidrat.desc=Κάτι δεν πάει καλά με αυτόν τον αρουραίο. Η λιπαρή μαύρη γούνα και το σάπιο δέρμα του είναι πολύ διαφορετικά από τα υγιείς αρουραίους που έχετε δει προηγουμένως. Τα ανοιχτόχρωμα πράσινα μάτια του τον κάνουν να φαίνεται ιδιαίτερα απειλητικός.\n\nΟ αρουραίος κουβαλάει ένα σύννεφο απαίσιας δυσοσμίας, η οποία είναι εξαιρετικά έντονη από κοντά.\n\nΣκούρα υγρά στάζουν από το στόμα του αρουραίου, τρώει από το πάτωμα αλλά φαίνεται να διαλύεται στο νερό.
actors.mobs.fetidrat.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.fetidrat.name=δύσοσμος αρουραίος
actors.mobs.fungalcore.desc=Αυτό το γιγάντιο μανιτάρι πρέπει να είναι η πηγή όλης της μυκητιακής δραστηριότητας σε αυτή τη σπηλιά.
actors.mobs.fungalcore.name=μυκητιακός πυρήνας
actors.mobs.fungalsentry.desc=Αυτό το ιδιαίτερα ψηλό μανιτάρι λειτουργεί ως σημείο άμυνας για το μεγαλύτερο δίκτυο μυκήτων που ζει σε αυτή τη σπηλιά.\n\nΕίναι ακίνητο, αλλά θα εκτοξεύσει ακριβείς ριπές δηλητηρίου σε οτιδήποτε μπει στο οπτικό του πεδίο. Ενώ η επίδραση αυτών των ριπών είναι αρκετά ασθενής, _μπορούν να συσσωρεύσουν θανατηφόρες ποσότητες δηλητηρίου πολύ γρήγορα._ Ενώ μπορεί να σκοτωθεί, είναι πιθανώς καλύτερο να το αποφύγετε.
actors.mobs.fungalsentry.name=μυκητιακός φρουρός
actors.mobs.fungalspinner.desc=Αυτός ο μύκητας που στροβιλίζεται σε σπηλιές φαίνεται να ελέγχεται από έναν παρασιτικό μύκητα. Ο μύκητας έχει επίσης αλλάξει τις ικανότητές του, αντικαθιστώντας τους ιστούς και τους σάκους δηλητηρίου του με μύκητες που αναπτύσσονται σε αυτούς.\n\nΟ μύκητας που στροβιλίζεται σε σπηλιές θα σας φτύσει φυτική ζωή αντί για ιστούς, εξαπλώνοντας μυκητιακή βλάστηση και ενδεχομένως να σας προκαλέσει ρίζες. Ενώ δεν μπορεί να δηλητηριάσει, ο μύκητας που στροβιλίζεται σε σπηλιές θα αποκτήσει σημαντική αντοχή στις ζημιές εάν βρίσκεται δίπλα σε μανιτάρια.
actors.mobs.fungalspinner.name=μυκητιακός κλώστης
actors.mobs.ghoul.desc=Καθώς η κοινωνία των νάνων άρχισε σιγά σιγά να καταρρέει και ο τωρινός βασιλιάς των νάνων κατέλαβε την απόλυτη εξουσία, όσοι ήταν αδύναμοι ή που του αντιστέκονταν δεν τυγχάνουν καλής μεταχείρισης. Καθώς ο βασιλιάς γινόταν πιο επιδέξιος στη χρήση σκοτεινής μαγείας, υπάκουσε αυτούς τους νάνους στη θέλησή του και τώρα αποτελούν τους πεζούς του στρατού του.\n\nΤα φαντάσματα δεν είναι ιδιαίτερα δυνατά μόνα τους, αλλά πάντα ταξιδεύουν σε ομάδες και είναι πολύ πιο δύσκολο να σκοτωθούν σε μεγάλους αριθμούς. _Όταν ένα φάντασμα ηττηθεί, θα επανέλθει μετά από μερικούς γύρους, αρκεί ένα άλλο φάντασμα να βρίσκεται κοντά._
actors.mobs.ghoul.name=νάνος γκουλ
actors.mobs.gnoll.desc=Οι Γνόλ είναι ανθρωποειδή που μοιάζουν με ύαινες. Ζουν σε υπονόμους και μπουντρούμια, ανεβαίνοντας κατά καιρούς για να κάνουν επιδρομές στην επιφάνεια. Οι ανιχνευτές Γνόλ είναι τακτικά μέλη της αγέλης τους, δεν είναι τόσο δυνατοί όσο τα θηρία και δεν είναι τόσο έξυπνοι όσο οι σαμάνοι.
actors.mobs.gnoll.name=ανιχνευτής gnoll
actors.mobs.gnollexile.desc=Αυτό το γκνολ με γκρίζα γούνα έχει ένα μεγάλο σημάδι στον ώμο του, που το υποδηλώνει ως εξόριστο. Οι γκνολ συνήθως εξορίζονται από την κοινωνία τους επειδή αγνοούν εντολές ή παραβιάζουν νόμους. Οι εξόριστοι πρέπει να είναι δυνατοί και έξυπνοι για να επιβιώσουν, και αυτός φαίνεται ότι ξέρει πώς να χρησιμοποιεί το δόρυ που κρατάει.
actors.mobs.gnollexile.desc_aggro=_Ο εξόριστος gnoll κοιτάζει γύρω του θυμωμένα._ Φαίνεται ότι κάτι τον έχει κάνει τελικά να αποφασίσει να πολεμήσει. Πρόσεχε αυτό το δόρυ!
actors.mobs.gnollexile.desc_passive=_Ο εξόριστος gnoll δεν κινείται για επίθεση._ Δεν φαίνεται τόσο επιθετικός όσο οι άλλοι gnoll εδώ, και μάλλον δεν πιστεύει ότι αξίζει τον κόπο να σε πολεμήσει. Θα μπορούσες απλώς να τον αφήσεις να περάσει, αλλά έχει ένα σακίδιο που μπορεί να είναι γεμάτο με χρήσιμα αντικείμενα...
actors.mobs.gnollexile.name=εξορία του gnoll
actors.mobs.gnollexile.seen_aggro=Ο γκνολ με το δόρυ κινείται για να επιτεθεί!
actors.mobs.gnollexile.seen_passive=Ο gnoll που κραδαίνει δόρυ σε κοιτάζει επιφυλακτικά, αλλά δεν κινείται για να επιτεθεί.
actors.mobs.gnollgeomancer.alert=Ο γεωμάντης ξυπνάει! Ολόκληρη η σπηλιά φαίνεται να μετακινείται καθώς πηδάει μακριά ενώ γελάει τρελά!
actors.mobs.gnollgeomancer.desc=Αυτό το εντυπωσιακά ψηλό, ανώτερο gnoll πρέπει να είναι η πηγή των διαφόρων μαγικών τεχνασμάτων που κινούν τη γη εδώ και ο οργανωτής όλης της δραστηριότητας των gnoll. Σε αντίθεση με τους σκαπανείς gnoll στην περιοχή, ο γεωμάντης είναι αρκετά επιδέξιος με τη μαγεία του και δεν μπορεί να υποστεί ζημιά από πεταμένες ή πεσμένες πέτρες. Δεν έχει όμως κανέναν τρόπο να πολεμήσει σε μάχη σώμα με σώμα.
actors.mobs.gnollgeomancer.desc_armor=Ο γεωμάντης είναι προς το παρόν τυλιγμένος σε ένα στρώμα από πέτρινη πανοπλία. _Θα πρέπει να πλησιάσεις κοντά και να τη σπάσεις με την αξίνα σου πριν προλάβεις να του προκαλέσεις ζημιά._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Ένας κοντινός σκαπανέας του gnoll κρατάει μια συσκευή που ενδυναμώνει την πανοπλία του γεωμάντη. Δεν θα μπορείς να της κάνεις καμία ζημιά τώρα!_
actors.mobs.gnollgeomancer.desc_sleeping=Αυτός ο εντυπωσιακά ψηλός σαμάνος gnoll περιβάλλεται από ένα στρώμα βράχου και μοιάζει σχεδόν με άγαλμα. Κοιτάζοντας προσεκτικά, μπορείτε να δείτε τον βράχο να κινείται μαγικά στον ρυθμό της αναπνοής του ανώτερου gnoll. Δεν μπορεί να τον βλάψει κανείς όσο είναι τυλιγμένος σε βράχο έτσι, και φαίνεται να απολαμβάνει έναν κυριολεκτικό υπνάκο στο χώμα. \n\n Μπορείτε πιθανώς να σπάσετε τα στρώματα του βράχου με την αξίνα σας, αλλά _να είστε σίγουροι ότι είστε έτοιμοι για μάχη όταν το κάνετε._ Ο γεωμάντης πρέπει να είναι η πηγή των διαφόρων μαγικών κινήσεων της γης εδώ και ο οργανωτής όλης της δραστηριότητας των gnoll. _Το να νικήσετε τους gnoll που είναι διάσπαρτοι εδώ πριν τους πολεμήσετε μπορεί να είναι καλή ιδέα._
actors.mobs.gnollgeomancer.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.gnollgeomancer.name=γεωμάντης gnoll
actors.mobs.gnollgeomancer.rock_kill=Ο ιπτάμενος βράχος σε σκότωσε...
actors.mobs.gnollgeomancer.rockfall_kill=Οι πέτρες που έπεφταν σε σκότωσαν...
actors.mobs.gnollgeomancer.warning=Ο γεωμάντης αρχίζει να κινείται. Βεβαιωθείτε ότι είστε έτοιμοι πριν συνεχίσετε!
actors.mobs.gnollguard.def_verb=μπλοκαρισμένο
actors.mobs.gnollguard.desc=Ένα μεγάλο και σκληροτράχηλο gnoll που κρατάει δόρυ και ασπίδα, αλλά χωρίς κράνος. Αυτοί οι φρουροί είναι πιθανότατα θηρία σε εκπαίδευση, που έχουν δεσμευτεί να βοηθούν στην προστασία του ορυχείου από την εισβολή της άγριας ζωής.\n\nΟ φρουρός gnoll είναι αρκετά δυνατός για να κρατάει το δόρυ με το ένα χέρι, αλλά δεν μπορεί να το χρησιμοποιήσει πολύ καλά. _Θα χρειαστεί αρκετά ανοιχτό χώρο για να επιτεθεί από απόσταση και θα σας προκαλέσει αισθητά λιγότερη ζημιά αν πλησιάσετε κοντά._
actors.mobs.gnollguard.desc_armor=_Ένας κοντινός σκαπανέας του gnoll κρατάει μια συσκευή που παρέχει σε αυτόν τον φρουρό χωμάτινη πανοπλία, μειώνοντας σημαντικά τη ζημιά που δέχεται._
actors.mobs.gnollguard.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.gnollguard.name=φρουρός gnoll
actors.mobs.gnollguard.spear_warn=Το gnoll καταφέρνει ένα άγριο χτύπημα με την άκρη του δόρατός του!
actors.mobs.gnollsapper.desc=Ένα μικρό και αδύναμο αλλά έξυπνο gnoll με ανοιχτόχρωμη γούνα και μια τσάντα γεμάτη με διάφορα εργαλεία. Είναι πιθανό να είναι εδώ για να βοηθήσουν στην αναζήτηση και την εξόρυξη σκούρου χρυσού, και έχουν μια κοντινή φρουρά για προστασία. Είναι ικανά να πολεμήσουν, αλλά οι επιθέσεις τους είναι αξιοθρήνητα αδύναμες, όχι ισχυρότερες από έναν ανιχνευτή gnoll.\n\nΑντί να πολεμούν απευθείας, οι σκαπανείς προτιμούν να χρησιμοποιούν τα διάφορα εργαλεία που έχουν για να κάνουν το βραχώδες περιβάλλον να τους επιτεθεί. Δεν γνωρίζουν οι ίδιοι μαγεία που κινεί τη γη, και έτσι είναι πολύ πιθανό να χρησιμοποιήσουν τα gadget τους απερίσκεπτα. _Θα πρέπει να υπάρχουν πολλοί τρόποι να χρησιμοποιήσετε τις επιθέσεις τους εναντίον τους, ή εναντίον της φρουράς τους._
actors.mobs.gnollsapper.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.gnollsapper.name=σκαπανέας του gnoll
actors.mobs.gnolltrickster.desc=Ένα πλάσμα με παράξενη εμφάνιση, ακόμα και για τα πρότυπα των gnoll. Σκύβει μπροστά με ένα πονηρό χαμόγελο, σχεδόν κρατώντας στην αγκαλιά του την τσάντα που κρέμεται πάνω από τον ώμο του. Τα μάτια του είναι ορθάνοιχτα από ένα παράξενο μείγμα φόβου και ενθουσιασμού.\n\nΥπάρχει μια μεγάλη συλλογή από κακοφτιαγμένα βελάκια στην τσάντα του, όλα σαν να είναι γεμάτα με διάφορες βλαβερές ουσίες.
actors.mobs.gnolltrickster.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.gnolltrickster.name=απατεώνας του gnoll
actors.mobs.goldenmimic.desc=Οι μιμητές είναι μαγικά πλάσματα που μπορούν να πάρουν οποιοδήποτε σχήμα επιθυμούν. Στα μπουντρούμια σχεδόν πάντα επιλέγουν το σχήμα ενός σεντουκιού θησαυρού, για να δελεάσουν ανυποψίαστους τυχοδιώκτες.\n\nΟι χρυσοί μιμητές είναι πιο σκληροί μιμητές που προσπαθούν να προσελκύσουν τους πιο δυνατούς τυχοδιώκτες. Έχουν καλύτερα λάφυρα, αλλά είναι επίσης πολύ πιο δυνατοί από τους κανονικούς μιμητές.
actors.mobs.goldenmimic.name=χρυσό μίμηση
actors.mobs.golem.def_verb=μπλοκαρισμένο
actors.mobs.golem.desc=Οι νάνοι προσπάθησαν να συνδυάσουν τις γνώσεις τους στη μηχανική με τη νέα τους δύναμη να δεσμεύουν στοιχειακά πλάσματα. Χρησιμοποίησαν πνεύματα της γης ως ψυχές για τα μηχανικά σώματα των γκόλεμ, θεωρώντας τα πιο εύκολα στον έλεγχο. Κι όμως, το παραμικρό λάθος στην τελετή μπορούσε να τα κάνει να ξεφύγουν.
actors.mobs.golem.name=γκόλεμ
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=γκλουρπ... γκλουρπ...
actors.mobs.goo.desc=Λίγα είναι γνωστά για τη Γλίτσα. Ίσως να μην είναι καν πλάσμα, αλλά ένα συνονθύλευμα ουσιών από τους υπονόμους που απέκτησε τα πρώτα ίχνη δικής του θέλησης.
actors.mobs.goo.enraged=εξοργισμένος
actors.mobs.goo.gluuurp=ΓΛΟΥΟΥΟΥΡΠ!
actors.mobs.goo.name=Γλίτσα
actors.mobs.goo.notice=ΓΚΛΟΥΡΠ-ΓΚΛΟΥΡΠ!
actors.mobs.goo.pumpup=Η Goo ανεβάζει τον πήχη!
actors.mobs.goo.rankings_desc=Απορροφημένο από την γλίτσα
actors.mobs.greatcrab.def_verb=μπλοκαρισμένο
actors.mobs.greatcrab.desc=Αυτό το καβούρι είναι γιγάντιο, ακόμη και σε σύγκριση με άλλα καβούρια του αποχετευτικού συστήματος. Το μπλε καβούκι του είναι καλυμμένο με ρωγμές και πεταλίδες, γεγονός που δείχνει μεγάλη ηλικία. Κινείται αργά, διατηρώντας μόλις και μετά βίας την ισορροπία του με το τεράστιο νύχι του.\n\nΕνώ το καβούρι έχει μόνο ένα νύχι, το μέγεθός του αντισταθμίζει εύκολα. Το καβούρι κρατά το νύχι μπροστά από οποιαδήποτε απειλή, θωρακισμένο πίσω από ένα αδιαπέραστο τοίχο από καβούκι. Ωστόσο, το καβούρι δεν μπορεί να εμποδίσει επιθέσεις που δεν βλέπει να έρχονται ή επιθέσεις από πολλούς εχθρούς ταυτόχρονα.
actors.mobs.greatcrab.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.greatcrab.name=μεγάλο καβούρι
actors.mobs.greatcrab.noticed=Το καβούρι μπλοκάρει με το τεράστιο νύχι του.
actors.mobs.guard.def_verb=μπλοκαρισμένο
actors.mobs.guard.desc=Αυτοί οι φρουροί, που κάποτε ήταν φύλακες της φυλακής, δεν έχουν πλέον καμία διαφορά από τους κρατούμενους. Σέρνονται σαν ζόμπι, περιπλανώμενοι άθελά τους στους διαδρόμους αναζητώντας οτιδήποτε παράταιρο, όπως εσείς! \n\nΚουβαλούν αλυσίδες γύρω από τους γοφούς τους, πιθανώς χρησιμοποιούνται για να τραβούν τους εχθρούς από κοντινή απόσταση.
actors.mobs.guard.name=δεσμοφύλακας
actors.mobs.guard.scorpion=Έλα εδώ!
actors.mobs.hermitcrab.def_verb=μπλοκαρισμένο
actors.mobs.hermitcrab.desc=Για τον έναν ή τον άλλο λόγο, αυτό το καβούρι του υπονόμου αποφάσισε να φορέσει το σπασμένο πάνω μέρος ενός βαρελιού στο κεφάλι του! Το επιπλέον βάρος το έχει επιβραδύνει σε κανονική ταχύτητα, αλλά του έχει δώσει επίσης σημαντικά μεγαλύτερη άμυνα. Νομίζεις όμως ότι ακούς κάτι να αναπηδά μέσα στο βαρέλι...
actors.mobs.hermitcrab.name=παγούρι ερημίτης
actors.mobs.mimic.desc=Οι μιμητές είναι μαγικά πλάσματα που μπορούν να πάρουν οποιοδήποτε σχήμα επιθυμούν. Στα μπουντρούμια σχεδόν πάντα επιλέγουν το σχήμα ενός σεντουκιού θησαυρού, για να προσελκύσουν ανυποψίαστους τυχοδιώκτες.
actors.mobs.mimic.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό οπουδήποτε στο μπουντρούμι.
actors.mobs.mimic.hidden_hint=Κάτι δεν πάει καλά με αυτό το σεντούκι... Το να πλησιάσω και να προσπαθήσω να το ανοίξω μπορεί να είναι κακή ιδέα.
actors.mobs.mimic.name=μίμος
actors.mobs.mimic.reveal=Αυτό το στήθος είναι μίμηση!
actors.mobs.mob.died=Ακούς κάτι να πεθαίνει από μακριά.
actors.mobs.mob.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό σε μια συγκεκριμένη περιοχή του μπουντρουμιού.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Σκοτώθηκε από: %s
actors.mobs.monk$focus.desc=Αυτός ο μοναχός είναι απόλυτα συγκεντρωμένος στον στόχο του και φαίνεται να προβλέπει τις κινήσεις του πριν τις κάνει.\n\nΕνώ είναι συγκεντρωμένος, η επόμενη φυσική επίθεση εναντίον αυτού του χαρακτήρα είναι εγγυημένη ότι θα αστοχήσει, ανεξάρτητα από τις συνθήκες. Η απόκρουση αυτής της επίθεσης θα εξαντλήσει την εστίαση του μοναχού και θα πρέπει να την αυξήσει ξανά για να αποκρούσει μια άλλη επίθεση. Οι μοναχοί αναπτύσσουν την εστίαση πιο γρήγορα ενώ κινούνται.
actors.mobs.monk$focus.name=εστιασμένος
actors.mobs.monk.def_verb=μπλοκαρισμένο
actors.mobs.monk.desc=Αυτοί οι μοναχοί είναι φανατικοί, αφοσιωμένοι στην προστασία των μυστικών της πόλης τους από κάθε ξένο. Δεν χρησιμοποιούν πανοπλίες ή όπλα και βασίζονται αποκλειστικά στην τέχνη της άοπλης μάχης.
actors.mobs.monk.name=νάνος μοναχός
actors.mobs.monk.parried=απέκρουσε
actors.mobs.necromancer$necroskeleton.desc=Αυτός ο σκελετός έχει κληθεί από έναν νεκρομάντη. Συμπεριφέρεται ακριβώς όπως ένας κανονικός σκελετός και θα πεθάνει όταν ο νεκρομάντης που τον κάλεσε σκοτωθεί.
actors.mobs.necromancer$necroskeleton.name=σκελετός νεκρομάντη
actors.mobs.necromancer.desc=Αυτοί οι μαθητευόμενοι σκοτεινοί μάγοι έχουν συρρεύσει στη φυλακή, καθώς είναι το ιδανικό μέρος για να εξασκήσουν την κακή τους τέχνη. \n\nΟι νεκρομάντες θα καλέσουν και θα ενδυναμώσουν σκελετούς να πολεμήσουν γι' αυτούς. Σκοτώνοντας τον νεκρομάντη θα σκοτωθεί και ο σκελετός που καλεί.
actors.mobs.necromancer.name=νεκρομάντις
actors.mobs.npcs.blacksmith.cant_enter_old=Αυτή η περιοχή δεν είναι προσβάσιμη σε αυτήν την εκτέλεση. Παίξτε ένα νέο παιχνίδι για να δοκιμάσετε τη νέα αποστολή!
actors.mobs.npcs.blacksmith.def_verb=μπλοκαρισμένο
actors.mobs.npcs.blacksmith.desc=Αυτός ο σιδηρουργός τρολ μοιάζει με όλα τα τρολ: είναι ψηλός και αδύνατος, και το δέρμα του μοιάζει με πέτρα τόσο στο χρώμα όσο και στην υφή. Ο σιδηρουργός τρολ πειραματίζεται με δυσανάλογα μικρά εργαλεία.
actors.mobs.npcs.blacksmith.enter_no=Οχι ακόμη
actors.mobs.npcs.blacksmith.enter_yes=Είμαι έτοιμος
actors.mobs.npcs.blacksmith.entrance_blocked=Ο δρόμος προς τα κάτω είναι μπλοκαρισμένος.
actors.mobs.npcs.blacksmith.exit_no=Οχι ακόμη
actors.mobs.npcs.blacksmith.exit_warn_crystal=Αυτός ο γιγάντιος κρύσταλλος είναι ακόμα εκεί κάτω. Θα πληρώσω επιπλέον αν τον καταστρέψετε.
actors.mobs.npcs.blacksmith.exit_warn_full=Τελείωσες; Έχεις πολύ χρυσό, αλλά βεβαιώσου ότι δεν έχεις αφήσει πίσω σου κανέναν από τον εξοπλισμό σου.\n\n_Να θυμάσαι, δεν θα σε αφήσω να ξαναμπείς μόλις ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Αυτό το γιγάντιο μανιτάρι είναι ακόμα εκεί κάτω. Θα πληρώσω επιπλέον αν το σκοτώσεις.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Αυτός ο γεωμάντης του gnoll είναι ακόμα εκεί κάτω. Θα πληρώσω επιπλέον αν τον σκοτώσεις.
actors.mobs.npcs.blacksmith.exit_warn_high=Τελείωσες; Φαίνεται ότι έχεις αρκετή ποσότητα χρυσού, αλλά θα μου χρειαζόταν λίγο περισσότερο. Θα πρέπει να μπορείς να πάρεις _40 κομμάτια._\n\n_Να θυμάσαι, δεν θα σε αφήσω να ξαναμπείς μόλις ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_low=Τελείωσες ήδη; Δεν φαίνεται να έχεις πολύ χρυσό. Θα πρέπει να μπορείς να πάρεις _40 κομμάτια._\n\n_Να θυμάσαι, δεν θα σε αφήσω να ξαναμπείς μόλις ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_med=Τελείωσες; Έχεις τουλάχιστον λίγο χρυσό, αλλά σίγουρα υπάρχει κι άλλο στο ορυχείο. Θα πρέπει να μπορείς να βρεις _40 κομμάτια._\n\n_Να θυμάσαι, δεν θα σε αφήσω να ξαναμπείς μόλις ανέβεις._
actors.mobs.npcs.blacksmith.exit_warn_none=Τελείωσες ήδη; Δεν έχεις σχεδόν καθόλου χρυσό! Θα πρέπει να μπορείς να πάρεις _40 κομμάτια._\n\n_Να θυμάσαι, δεν θα σε αφήσω να ξαναμπείς μόλις ανέβεις._
actors.mobs.npcs.blacksmith.exit_yes=Τελείωσα
actors.mobs.npcs.blacksmith.get_lost=Είμαι απασχολημένος. Χάσου!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Γεια σου Άνθρωπε! Φαίνεσαι σημαντικός.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Προσοχή όμως, το ορυχείο είναι επικίνδυνο για ένα μικρό ανθρωπάκι σαν εσένα. Έχει εγκαταλειφθεί εδώ και καιρό και ένα σωρό κρύσταλλοι έχουν αρχίσει να φυτρώνουν. Είναι λαμπεροί, αλλά πολύ εύθραυστοι για να αξίζουν οτιδήποτε, και έχουν μερικά μαγικά πράγματα που τους προστατεύουν. Είναι αρκετά δυνατοί, οπότε _να είσαι προσεκτικός πού εξορύσσεις_ αλλιώς θα τραβήξεις την προσοχή τους.\n\nΥπάρχει και ένας _γιγάντιος κρύσταλλος_ κάπου. Είναι πολύ πιο ανθεκτικός, οπότε να είσαι προετοιμασμένος για μάχη αν αρχίσεις να τον σπάς. Στοιχηματίζω όμως ότι αν τον σπάσεις θα επιβραδύνει την ανάπτυξη των κρυστάλλων, οπότε θα πληρώσω επιπλέον αν μπορείς.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Γεια σου Άνθρωπε! Φαίνεσαι γενναίος.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Προσοχή όμως, το ορυχείο είναι επικίνδυνο για ένα μικρό ανθρωπάκι σαν εσένα. Υπάρχει κάποιο είδος τέρατος-μύκητα που φυτρώνει εκεί κάτω. Έχει φρουρούς-μανιτάρια που είναι πραγματικά θανατηφόροι αν σε δουν, αλλά τουλάχιστον δεν μπορούν να σηκωθούν και να σε κυνηγήσουν. _Μείνε μακριά από τα μάτια_ αν θέλεις να μείνεις ζωντανός.\n\nΘα πληρώσω επιπλέον αν καταφέρεις να εξοντώσεις το _μεγαλύτερο μανιτάρι_, αλλά θα χρειαστεί λίγη πραγματική προσπάθεια. Συνδέεται με μια σειρά από κόμβους μυκηλίου που είναι κρυμμένοι στους τοίχους. Θα πρέπει να σπάσεις τους περισσότερους πριν προλάβεις να του προκαλέσεις πραγματική ζημιά.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Προσοχή όμως, το ορυχείο είναι επικίνδυνο για ένα μικρό ανθρωπάκι σαν εσένα. Κάποια gnoll θέλουν κι αυτά τον χρυσό και τώρα καταστρέφουν το μέρος. Είναι ηλίθια πράγματα, οπότε η εξόρυξή τους έχει προκαλέσει κάθε είδους καταρρεύσεις και καταρρεύσεις. Θα πρέπει να κάνεις εξόρυξη μέσα από αυτό, οπότε _ψάξε για πρόσφατα διαταραγμένο βράχο._\n\nΝομίζω ότι ένα από τα gnoll προκαλεί το μεγαλύτερο μέρος του προβλήματος, πιθανώς ένας _γεωμάντης σαμάνος_ ή κάτι τέτοιο. Θα πληρώσω επιπλέον, αν μπορείς να το βρεις και να το σκοτώσεις, αλλά είμαι σίγουρος ότι θα αντεπιτεθεί.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Γεια σου Άνθρωπε! Φαίνεσαι γρήγορος.
actors.mobs.npcs.blacksmith.intro_quest_mage=Γεια σου Άνθρωπε! Φαίνεσαι έξυπνος.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Γεια σου Άνθρωπε! Μοιάζεις με ύπουλο.
actors.mobs.npcs.blacksmith.intro_quest_start=Θέλεις να φανείς χρήσιμος, ε; Ναι, έχω κάτι που θα μπορούσες να κάνεις. Έφτιαξα αυτό το εργαστήριο πάνω σε ένα παλιό ορυχείο, είναι ακριβώς κάτω από αυτή τη σκάλα. Πάρε αυτή την αξίνα και εξόρυξε λίγο _σκούρο χρυσό μετάλλευμα. 40 κομμάτια_ θα πρέπει να είναι αρκετά. Η πέτρα από κάτω είναι ωραία και μαλακή, οπότε _θα μπορείς να σκάψεις μέσα από τους τοίχους με λίγη προσπάθεια._\n\nΤι εννοείς, πώς θα πληρώσω; Είσαι άπληστος...\n\nΕντάξει, εντάξει, μπορώ να κάνω κάποια σιδεράκια για σένα. Θεωρήστε τον εαυτό σας τυχερό, είμαι ο μόνος σιδηρουργός εκεί γύρω.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Γεια σου Άνθρωπε! Φαίνεσαι σκληρός.
actors.mobs.npcs.blacksmith.lost_pick=Πλάκα μου κάνεις; Πού είναι η αξίνα μου;!
actors.mobs.npcs.blacksmith.name=τρολ σιδηρουργός
actors.mobs.npcs.blacksmith.quest_start_prompt=Είσαι έτοιμος να κατέβεις; Βεβαιώσου ότι έχεις λίγο ελεύθερο χώρο για το χρυσό. \n\n_Σε απογοητεύω μόνο μία φορά!
actors.mobs.npcs.blacksmith.reminder=Σταμάτησες να σπαταλάς τον χρόνο μου; Η είσοδος του ορυχείου είναι εκεί πέρα.
actors.mobs.npcs.blacksmith.reminder_crystal=Φέρε μου όσο περισσότερο χρυσάφι μπορείς, και προσπάθησε να σπάσεις και τον μεγάλο κρύσταλλο.
actors.mobs.npcs.blacksmith.reminder_fungi=Φέρε μου όσο περισσότερο χρυσό μπορείς και προσπάθησε να σκοτώσεις και το γιγάντιο μανιτάρι.
actors.mobs.npcs.blacksmith.reminder_gnoll=Φέρε μου όσο περισσότερο χρυσό μπορείς και προσπάθησε να σκοτώσεις και τον γεωμάντη των gnoll.
actors.mobs.npcs.ghost.crab_1=Γεια σου %s... Κάποτε ήμουν σαν εσένα - δυνατός και γεμάτος αυτοπεποίθηση... Αλλά με σκότωσε ένα αρχαίο πλάσμα... Δεν μπορώ να φύγω από αυτό το μέρος... Όχι μέχρι να πάρω εκδίκηση... Σκότωσε το _μεγάλο καβούρι,_ που μου πήρε τη ζωή...\n\nΕίναι αφύσικα γέρος... Με ένα τεράστιο μόνο νύχι και ένα παχύ κέλυφος... _Πρόσεχε το νύχι του, πρέπει να αιφνιδιάσεις το καβούρι αλλιώς θα μπλοκάρει με αυτό..._
actors.mobs.npcs.ghost.crab_2=Παρακαλώ... Βοήθησέ με... Σκότωσε το Οστρακοειδές...\n\n_Θα μπλοκάρει πάντα... Όταν σε δει να έρχεσαι..._
actors.mobs.npcs.ghost.desc=Το φάντασμα είναι μόλις ορατό. Μοιάζει με μια άμορφη κηλίδα αμυδρού φωτός με ένα θλιμμένο πρόσωπο.
actors.mobs.npcs.ghost.find_me=Ευχαριστώ... ελάτε να με βρείτε...
actors.mobs.npcs.ghost.gnoll_1=Γεια σου %s... Κάποτε ήμουν σαν εσένα - δυνατός και γεμάτος αυτοπεποίθηση... Αλλά με σκότωσε ένας ύπουλος εχθρός... Δεν μπορώ να φύγω από αυτό το μέρος... Όχι μέχρι να πάρω εκδίκηση... Σκότωσε τον _απατεώνα gnoll,_ που μου πήρε τη ζωή...\n\nΔεν είναι σαν τους άλλους gnoll... Κρύβεται και χρησιμοποιεί όπλα που πετάγονται... _Πρόσεχε τα δηλητηριώδη και εμπρηστικά βέλη του, μην επιτίθεσαι από απόσταση..._
actors.mobs.npcs.ghost.gnoll_2=Σε παρακαλώ... Βοήθησέ με... Σκότωσε τον απατεώνα...\n\n_Μην το αφήσεις να σε χτυπήσει... Πλησίασέ το..._
actors.mobs.npcs.ghost.name=θλιβερό φάντασμα
actors.mobs.npcs.ghost.rat_1=Γεια σου %s... Κάποτε ήμουν σαν εσένα - δυνατός και γεμάτος αυτοπεποίθηση... Αλλά με σκότωσε ένα βρωμερό θηρίο... Δεν μπορώ να φύγω από αυτό το μέρος... Όχι μέχρι να πάρω εκδίκηση... Σκότωσε τον _βρωμερό αρουραίο,_ που μου πήρε τη ζωή...\n\nΠαραμονεύει σε αυτό το πάτωμα... Σκορπίζει βρωμιά παντού... _Προσοχή, το σύννεφο της βρωμιάς και του διαβρωτικού δαγκώματος, το οξύ διαλύεται στο νερό..._
actors.mobs.npcs.ghost.rat_2=Σε παρακαλώ... Βοήθησέ με... Σκότωσε το βδέλυγμα...\n\n_Πολέμησέ το κοντά στο νερό... Απόφυγε τη δυσοσμία..._
actors.mobs.npcs.imp.cya=Τα λέμε, %s!
actors.mobs.npcs.imp.desc=Τα διαβολάκια είναι κατώτεροι δαίμονες. Δεν διακρίνονται ούτε για τη δύναμή τους ούτε για το μαγικό τους ταλέντο, αλλά είναι αρκετά έξυπνα και κοινωνικά. Πολλά διαβολάκια προτιμούν να ζουν ανάμεσα σε μη δαίμονες.
actors.mobs.npcs.imp.golems_1=Στην περίπτωσή μου, είναι τα _γκόλεμ_ που πρέπει να σκοτωθούν. Βλέπεις, θα ξεκινήσω μια μικρή επιχείρηση εδώ, αλλά αυτά τα ηλίθια γκόλεμ είναι κακά για τις επιχειρήσεις! Είναι πολύ δύσκολο να διαπραγματευτείς με περιπλανώμενους σβόλους γρανίτη, γαμώτο! Οπότε σε παρακαλώ σκότωσε... ας πούμε _4_ από αυτούς_ και η ανταμοιβή είναι δική σου.
actors.mobs.npcs.imp.golems_2=Πώς πάει το σαφάρι με το γκόλεμ; Απλώς μην ξεχάσεις να πάρεις αυτά τα μάρκες.
actors.mobs.npcs.imp.hey=Ψστ, %s!
actors.mobs.npcs.imp.intro=Είσαι τυχοδιώκτης; Λατρεύω τους τυχοδιώκτες! Μπορείς πάντα να βασιστείς σε αυτούς αν χρειαστεί να σκοτώσεις κάτι, σωστά; Για μια αμοιβή φυσικά ;)
actors.mobs.npcs.imp.monks_1=Στην περίπτωσή μου, είναι _μοναχοί_ που πρέπει να σκοτωθούν. Βλέπετε, θα ξεκινήσω μια μικρή επιχείρηση εδώ, αλλά αυτοί οι τρελοί δεν αγοράζουν τίποτα οι ίδιοι και θα τρομάξουν τους άλλους πελάτες. Οπότε, σας παρακαλώ, σκοτώστε... ας πούμε _5 από αυτούς_ και η ανταμοιβή είναι δική σας.
actors.mobs.npcs.imp.monks_2=Ω, είσαι ακόμα ζωντανός! Ήξερα ότι το κουνγκ-φου σου θα ήταν πιο δυνατό ;) Απλώς μην ξεχάσεις να πάρεις αυτές τις μάρκες.
actors.mobs.npcs.imp.name=φιλόδοξος διαβολικός
actors.mobs.npcs.impshopkeeper.buyback=Το διαβολάκι επιστρέφει χαρούμενα το αντικείμενό σου.
actors.mobs.npcs.impshopkeeper.desc=Ο διαβολάκι έχει στήσει ένα μικρό μαγαζάκι στα όρια των εσωτερικών διαδρόμων. Είναι ωραίο να βλέπεις ένα φιλικό πρόσωπο, αλλά οι τιμές του σίγουρα δεν φαίνονται φιλικές.
actors.mobs.npcs.impshopkeeper.greetings=Γεια σου, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Τι έκανες %s; Ψώνισε γρήγορα, πρέπει να φύγω από εδώ!
actors.mobs.npcs.impshopkeeper.name=φιλόδοξος διαβολικός
actors.mobs.npcs.impshopkeeper.thief=Νόμιζα ότι μπορούσα να σε εμπιστευτώ!
actors.mobs.npcs.mirrorimage.desc=Αυτή η ψευδαίσθηση σου μοιάζει πολύ, αλλά είναι πιο χλωμή και κάνει μικρούς σπασμούς.
actors.mobs.npcs.mirrorimage.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με έναν συγκεκριμένο πάπυρο.
actors.mobs.npcs.mirrorimage.name=κατοπτρική εικόνα
actors.mobs.npcs.npc.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα σε μια συγκεκριμένη περιοχή του μπουντρουμιού.
actors.mobs.npcs.prismaticimage.desc=Αυτή η λαμπερή ψευδαίσθηση έχει μεγάλη ομοιότητα με εσάς, φτάνοντας στο σημείο να φαίνεται ότι χειρίζεστε το τρέχον όπλο και την πανοπλία σας.\n\nΟι πρισματικές εικόνες θα προσπαθήσουν να αναζητήσουν και να τραβήξουν την προσοχή από τους εχθρούς, χρησιμοποιώντας την ενισχυμένη άμυνα και υγεία τους για να σας προστατεύσουν. Ενώ δεν έχουν την ίδια επιθετική δύναμη με τις εικόνες καθρέφτη, έχουν βελτιωμένη ανθεκτικότητα, συμπεριλαμβανομένης της λήψης οφελών από την πανοπλία σας.\n\nΌταν μειωθούν σε 0 hp, οι πρισματικές εικόνες θα εξασθενίσουν σε αρκετούς γύρους και μπορούν ακόμα να θεραπευτούν κατά τη διάρκεια αυτής της περιόδου. Όταν δεν υπάρχουν εχθροί, οι πρισματικές εικόνες θα εξασθενίσουν και θα επανενωθούν με τον κύριό τους.
actors.mobs.npcs.prismaticimage.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με έναν συγκεκριμένο πάπυρο.
actors.mobs.npcs.prismaticimage.name=πρισματική εικόνα
actors.mobs.npcs.ratking.confused=Τι... Πού βρίσκομαι; Το βασίλειό μου με χρειάζεται!
actors.mobs.npcs.ratking.crown_after=Απολαμβάνεις τη νέα σου πανοπλία; Δεν χρειάζεται να κάνεις πίσω!
actors.mobs.npcs.ratking.crown_clothes=Βάλε μερικά ρούχα! Δεν είσαι σε θέση να μιλήσεις σε βασιλιάδες!
actors.mobs.npcs.ratking.crown_desc=Ωωω, αυτό το στέμμα είναι για μένα; Φαίνεται πολύ πιο λαμπερό από το δικό μου, οπότε το δέχομαι ευγενικά! \n\n Μάλιστα, νομίζω ότι μπορώ να σου προσφέρω κάτι ως ανταμοιβή για αυτό το στέμμα. Μια τρομερή δύναμη που αρμόζει σε έναν ήρωα σαν εσένα! Θα σου άρεσε αυτό;
actors.mobs.npcs.ratking.crown_fine=Εντάξει! Δεν είναι ότι το ήθελα κιόλας...
actors.mobs.npcs.ratking.crown_info=Πες μου περισσότερα πρώτα.
actors.mobs.npcs.ratking.crown_no=Θα προτιμούσα όχι...
actors.mobs.npcs.ratking.crown_thankyou=Χεχεχε, ευχαριστώ! Τώρα πήγαινε και κάνε τον βασιλιά σου περήφανο!
actors.mobs.npcs.ratking.crown_yes=Φυσικά!
actors.mobs.npcs.ratking.desc=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κανονικό μαρσιποφόρο αρουραίο. Φοράει ένα μικροσκοπικό στέμμα στο κεφάλι του.
actors.mobs.npcs.ratking.desc_birthday=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κανονικό μαρσιποφόρο αρουραίο. Φοράει ένα μικροσκοπικό πράσινο καπέλο αντί για το συνηθισμένο του στέμμα. Χρόνια πολλά Βασιλιά των Ποντικών!
actors.mobs.npcs.ratking.desc_crown=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κανονικό μαρσιποφόρο αρουραίο. Φοράει το στέμμα ενός νάνου βασιλιά στο κεφάλι του.
actors.mobs.npcs.ratking.desc_winter=Αυτός ο αρουραίος είναι λίγο μεγαλύτερος από έναν κανονικό μαρσιποφόρο αρουραίο. Φοράει ένα μικροσκοπικό εορταστικό καπέλο αντί για το συνηθισμένο του στέμμα. Καλές Γιορτές!
actors.mobs.npcs.ratking.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα στο τέλος μιας συγκεκριμένης περιοχής του μπουντρουμιού.
actors.mobs.npcs.ratking.name=βασιλιάς αρουραίων
actors.mobs.npcs.ratking.not_sleeping=Δεν κοιμάμαι!
actors.mobs.npcs.ratking.what_is_it=Τι συμβαίνει; Δεν έχω χρόνο για αυτές τις ανοησίες. Το βασίλειό μου δεν θα αυτοκυβερνηθεί!
actors.mobs.npcs.sheep.baa!=Βέλασμα!
actors.mobs.npcs.sheep.baa.=Βέλασμα.
actors.mobs.npcs.sheep.baa...=Βέλασμα...
actors.mobs.npcs.sheep.baa?=Βέλασμα;
actors.mobs.npcs.sheep.def_verb=μπλοκαρισμένο
actors.mobs.npcs.sheep.desc=Αυτό είναι ένα μαγικό πρόβατο. Τι είναι τόσο μαγικό σε αυτό; Δεν μπορείς να το σκοτώσεις. Θα στέκεται εκεί μέχρι να εξαφανιστεί μαγικά, ενώ παράλληλα θα μασάει την τροφή του με ένα άδειο βλέμμα.
actors.mobs.npcs.sheep.discover_hint=Μπορείτε να βρείτε αυτόν τον χαρακτήρα με ένα συγκεκριμένο αντικείμενο ή παγίδα.
actors.mobs.npcs.sheep.name=πρόβατα
actors.mobs.npcs.shopkeeper.buyback=Ο καταστηματάρχης επιστρέφει απρόθυμα το προϊόν σας.
actors.mobs.npcs.shopkeeper.desc=Αυτός ο γεροδεμένος τύπος φαίνεται πιο κατάλληλος για μια εμπορική περιοχή σε κάποια μεγάλη πόλη παρά για ένα μπουντρούμι. Οι τιμές του εξηγούν γιατί προτιμά να κάνει δουλειές εδώ.
actors.mobs.npcs.shopkeeper.flee=Ο καταστηματάρχης φεύγει τρέχοντας!
actors.mobs.npcs.shopkeeper.name=καταστηματάρχης
actors.mobs.npcs.shopkeeper.sell=Πουλήστε ένα αντικείμενο
actors.mobs.npcs.shopkeeper.talk=Ομιλία
actors.mobs.npcs.shopkeeper.talk_ascent=Δεν ξέρω τι σκοπεύεις να κάνεις με αυτό το φυλαχτό, αλλά εγώ δεν θέλω να έχω κανένα ρόλο σε αυτό. Αγόρασε κάτι και προχώρα, πρέπει να φύγουμε και οι δύο από εδώ!
actors.mobs.npcs.shopkeeper.talk_caves=Ξόδεψε χρήματα, ζήσε περισσότερο. \n\nΩ, και πες μου γεια σε αυτόν τον σιδηρουργό Τρολ αν τον δεις. Υπενθύμισέ του ότι μου χρωστάει ακόμα χρήματα για εκείνο το σφυρί που του πούλησα την περασμένη εβδομάδα!
actors.mobs.npcs.shopkeeper.talk_city=Τα εμπορεύματά μου μπορούν να σε κρατήσουν ασφαλή εδώ κάτω. \n\n... Και μην περιφέρεσαι αργά, αν θέλεις. Μου πήρε μια αιωνιότητα για να πείσω τους ντόπιους εδώ κάτω να με αφήσουν ήσυχο, δεν θέλω να δημιουργείς προβλήματα!
actors.mobs.npcs.shopkeeper.talk_halls=Γεια σας, έχω ειδικές τιμές για κυνηγούς δαιμόνων!\n\nΩ, και να είστε προσεκτικοί εκεί κάτω! Οι δαίμονες από κάτω δεν θα νοιαστούν πόσο θαρραλέοι είστε. Δεν μπορείτε να επιστρέψετε και να ξοδέψετε περισσότερα χρήματα αν είστε νεκροί! ;)\n\nΕίναι οι δαίμονες σαν εμένα; Χαχα, καθόλου. Είμαι απλώς ένας μικρός τύπος, όχι και τόσο μαχητής, και έχω καταφέρει να κρατήσω το μυαλό μου άθικτο. Οι δαίμονες από κάτω είναι πολύ πιο δυνατά πλάσματα, και όλοι τους έχουν υποδουλωθεί από... ε... απλώς να είστε προσεκτικοί εκεί κάτω.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Γεια σας, Υψηλότατε, ή μήπως τώρα είναι η Αγιότητά σας; Χαχα, έτσι κι αλλιώς δεν είναι μέρος για εσάς, πολλοί άνθρωποι θα ήταν πολύ συντετριμμένοι αν καταλήξετε νεκροί. Σίγουρα έχετε κάποια νομίσματα, γιατί να μην αγοράσετε κάτι για να το αποτρέψετε αυτό;
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Λοιπόν, αν δεν είναι ο ταξιδιώτης ήρωας! Αν προσπαθείς να σώσεις μια άλλη πόλη, τότε καλή τύχη, οι κίνδυνοι εδώ είναι πολύ χειρότεροι από ό,τι από μικροσυμμορίες ληστών. Είμαι σίγουρος ότι θα τα καταφέρεις καλύτερα από οποιονδήποτε άλλον, απλώς προσπάθησε να μην πεθάνεις ακριβώς έξω από το κατάστημά μου.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Φαίνεται πως είσαι εκτός εαυτού, δεσποινίς. Οι στενοί διάδρομοι των μπουντρουμιών δεν είναι τόσο ευρύχωροι όσο οι μεγάλες αίθουσες ή τα δάση που περιβάλλουν την πόλη, έτσι δεν είναι; Χαχα, μην σε πειράζει που φλυαρώ, γιατί να μην αγοράσεις κάτι;
actors.mobs.npcs.shopkeeper.talk_prison_intro=Έχω όλα όσα χρειάζεσαι για μια επιτυχημένη περιπέτεια!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Χαχα, νομίζω ότι έχω δει μια αφίσα καταζητούμενων με το όνομά σου κάπου στην πόλη. Είμαστε καταζητούμενοι, είμαστε φυγάδες; Ω, είσαι αθώος, έτσι δεν είναι; Φυσικά, φυσικά... Μην ανησυχείς, έχω καλύτερα πράγματα να κάνω από το να σε αναφέρω, αλλά ίσως θα έπρεπε να αγοράσεις κάτι για να είσαι σίγουρος;
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ήρθες από τη συντεχνία των κλεφτών για να καθαρίσεις την περιοχή; Όχι, απλώς ψωνίζεις; Σκότωσε μερικά τέρατα όσο είσαι εδώ ούτως ή άλλως. Μην περιμένεις έκπτωση, σας πληρώνω καλά χρήματα για προστασία και εσείς με το ζόρι με κρατάτε ασφαλή εδώ κάτω.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Αυτή είναι μια ενδιαφέρουσα σφραγίδα που έχεις εκεί, συνήθως είναι άθικτες. Είσαι ένας ατιμασμένος ήρωας ή κάτι τέτοιο; Λοιπόν, ό,τι κι αν έχεις κάνει δεν με αφορά, τα νομίσματά σου είναι ακόμα καλά.
actors.mobs.npcs.shopkeeper.thief=Κλέφτη, Κλέφτη!
actors.mobs.npcs.shopkeeper.warn=Πρόσεχε! Δεν θα σε προειδοποιήσω ξανά.
actors.mobs.npcs.vaultlaser.desc=Αυτός ο φρουρός εκτοξεύει λέιζερ σε τακτά χρονικά διαστήματα. _Καθώς πρόκειται απλώς για μια περιοχή δοκιμών, τα λέιζερ δεν θα σας βλάψουν στην πραγματικότητα._
actors.mobs.npcs.vaultlaser.name=φρουρός λέιζερ θησαυροφυλακίου
actors.mobs.npcs.vaultsentry.desc=Αυτός ο φρουρός σαρώνει την περιοχή με ένα μοτίβο. _Καθώς πρόκειται απλώς για μια περιοχή δοκιμών, ο φρουρός δεν θα κάνει τίποτα αν σας εντοπίσει._
actors.mobs.npcs.vaultsentry.name=φρουρός σάρωσης θησαυροφυλάκων
actors.mobs.npcs.wandmaker.def_verb=μπλοκαρισμένο
actors.mobs.npcs.wandmaker.desc=Αυτός ο ηλικιωμένος αλλά εύσωμος κύριος έχει μια ελαφρώς μπερδεμένη έκφραση. Προστατεύεται από μια μαγική ασπίδα.
actors.mobs.npcs.wandmaker.intro_1=Ήρθα εδώ για να βρω ένα σπάνιο συστατικό για ένα ραβδί, αλλά χάθηκα και η μαγική μου ασπίδα εξασθενεί. Θα πρέπει να φύγω σύντομα, αλλά δεν αντέχω να φύγω χωρίς να πάρω αυτό για το οποίο ήρθα.
actors.mobs.npcs.wandmaker.intro_2=Αν μπορείς να μου το πάρεις αυτό, θα χαρώ να σε πληρώσω με ένα από τα καλοφτιαγμένα μου ραβδιά! Έφερα δύο μαζί μου, οπότε μπορείς να πάρεις όποιο προτιμάς.
actors.mobs.npcs.wandmaker.intro_berry=Ο γέρος φύλακας αυτής της φυλακής διατηρούσε ένα φυτό βατόμουρου, και εγώ κυνηγάω έναν από τους σπόρους του. Το φυτό πιθανότατα έχει αγριέψει πλέον, οπότε το να το πείσουμε να δώσει έναν σπόρο μπορεί να είναι δύσκολο. Ο κήπος του θα πρέπει να είναι κάπου εδώ γύρω. Προσπαθήστε να _κρατηθείτε μακριά από τα κληματόδεντρα_ του αν θέλετε να παραμείνετε όρθιοι. Η χρήση φωτιάς μπορεί να είναι δελεαστική, αλλά σας παρακαλώ μην το κάνετε, θα σκοτώσετε το φυτό και θα καταστρέψετε τους σπόρους του.
actors.mobs.npcs.wandmaker.intro_cleric=Ω, γεια σας Υψηλότατε! Τι ευχάριστη έκπληξη που σας γνώρισα σε ένα τόσο θλιβερό μέρος! Δεν θέλω να σας επιβάλλω, αλλά ίσως έχω μια δουλειά να σας κάνω.
actors.mobs.npcs.wandmaker.intro_duelist=Ω, γεια σας δεσποινίς! Τι ευχάριστη έκπληξη να συναντάς έναν ήρωα σε ένα τόσο θλιβερό μέρος! Αν θέλεις να βοηθήσεις έναν ηλικιωμένο, ίσως έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.intro_dust=Ψάχνω για λίγη _σκόνη πτώματος_. Είναι ένα ιδιαίτερο είδος καταραμένου οστεάλευρου που συνήθως εμφανίζεται σε μέρη σαν κι αυτό. Θα έπρεπε να υπάρχει ένα οδοφραγμένο δωμάτιο κάπου εδώ γύρω, είμαι σίγουρος ότι θα εμφανιστεί λίγη σκόνη εκεί. Να είσαι προσεκτικός όμως, η κατάρα που κουβαλάει η σκόνη είναι αρκετά ισχυρή, _επιστρέψτε μου όσο πιο γρήγορα μπορείτε_ και θα το καθαρίσω για εσάς.
actors.mobs.npcs.wandmaker.intro_ember=Ψάχνω για _φρέσκα κάρβουνα_ από ένα νεογέννητο στοιχειώδες φωτιάς. Τα Στοιχειώδη συνήθως εμφανίζονται όταν μια τελετουργία επίκλησης δεν ελέγχεται, οπότε απλώς βρείτε μερικά κεριά και μια τελετουργική τοποθεσία και είμαι σίγουρος ότι μπορείτε να βρείτε ένα. Θα πρέπει να _αποφύγετε να εγκλωβιστείτε_ ενώ παλεύετε με αυτό, ή θα μπορούσατε να _έχετε κάποιο είδος παγωτού πρόχειρου._ Τα νεογέννητα Στοιχειώδη είναι αρκετά ισχυρά και χαοτικά, αλλά δεν αντέχουν το κρύο.
actors.mobs.npcs.wandmaker.intro_huntress=Ω, γεια σας δεσποινίς! Ένα φιλικό πρόσωπο είναι μια ευχάριστη έκπληξη εδώ κάτω, έτσι δεν είναι; Μάλιστα, ορκίζομαι ότι έχω ξαναδεί το πρόσωπό σας, αλλά δεν μπορώ να το προσδιορίσω... Ω, μην ανησυχείτε, αν είστε εδώ για περιπέτεια, μπορεί να έχω μια δουλειά για εσάς.
actors.mobs.npcs.wandmaker.intro_mage=Ω, γεια σου %s! Άκουσα ότι υπήρξε κάποια φασαρία σχετικά με εσένα και το ινστιτούτο μάγων; Α, μην πειράζει, ποτέ δεν μου άρεσαν αυτοί οι κολλημένοι στη λάσπη ούτως ή άλλως. Αν θέλεις, ίσως έχω μια εργασία για σένα.
actors.mobs.npcs.wandmaker.intro_rogue=Θεέ μου, με τρόμαξες! Δεν έχω γνωρίσει ληστή από αυτό το μέρος που να έχει ακόμα τα λογικά του, οπότε πρέπει να είσαι από την επιφάνεια! Αν θέλεις να βοηθήσεις έναν άγνωστο, ίσως έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.intro_warrior=Ω, γεια σας! Τι ευχάριστη έκπληξη να συναντάς έναν πολεμιστή από τον βορρά σε ένα τόσο θλιβερό μέρος! Πρέπει να έχεις ταξιδέψει αρκετά μακριά για να φτάσεις εδώ. Αν ψάχνεις για περιπέτεια, ίσως έχω μια δουλειά για σένα.
actors.mobs.npcs.wandmaker.name=γέρος ραβδοποιός
actors.mobs.npcs.wandmaker.reminder_berry=Καμία τύχη με έναν σπόρο Rotberry, %s; Ψάξε για ένα δωμάτιο γεμάτο βλάστηση.
actors.mobs.npcs.wandmaker.reminder_dust=Τύχη με τη σκόνη πτώματος, %s; Ψάξε για μερικά οδοφράγματα.
actors.mobs.npcs.wandmaker.reminder_ember=Σταμάτα να βρεις τα κάρβουνα, %s; Θα χρειαστεί να βρεις τέσσερα κεριά και τον τόπο της τελετουργίας.
actors.mobs.phantompiranha.desc=Τα φαντασματικά πιράνχας είναι μια σπάνια ράτσα πιράνχας με μαγικές ικανότητες και απόκοσμα ημιδιαφανή σώματα. Είναι ικανά να τηλεμεταφέρονται καθώς δέχονται επίθεση, είτε για να ξεφύγουν είτε για να πλησιάσουν γρήγορα τον εχθρό τους!\n\nΕνώ είναι ενοχλητικά στην καταπολέμηση τους, το κρέας τους είναι πολύτιμο για τις μαγικές του ιδιότητες.
actors.mobs.phantompiranha.name=φάντασμα πιράνχα
actors.mobs.phantompiranha.teleport_away=Το φάντασμα πιράνχα τηλεμεταφέρεται μακριά...
actors.mobs.piranha.desc=Αυτά τα σαρκοφάγα ψάρια εκτρέφονται ειδικά για την προστασία των πλημμυρισμένων περιοχών. Το δάγκωμά τους είναι θανατηφόρο, επομένως είναι καλύτερο να αποφεύγετε να τα αντιμετωπίζετε άμεσα.
actors.mobs.piranha.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό οπουδήποτε στο μπουντρούμι.
actors.mobs.piranha.name=γιγάντιο πιράνχα
actors.mobs.pylon.desc_active=Ένας πυλώνας ισχύος, που έχει σκοπό να βοηθήσει στη ρύθμιση του ηλεκτρικού ρεύματος που τροφοδοτεί τα μηχανήματα σε αυτήν την περιοχή. Ο πυλώνας αυτή τη στιγμή υπερχειλίζει από ηλεκτρική ενέργεια, και αυτό πρέπει να είναι που υπερφορτώνει το DM-300!\n\nΣε αυτήν την κατάσταση, οι πυλώνες είναι ευάλωτοι, αλλά θα εκπέμπουν ηλεκτρικό ρεύμα σε κοντινά κελιά δεξιόστροφα. Λόγω της βαριάς μεταλλικής κατασκευής τους, οι πυλώνες είναι ανθεκτικοί σε μεγάλες ζημιές.
actors.mobs.pylon.desc_inactive=Ένας πυλώνας ισχύος, που έχει ως στόχο να βοηθά στη ρύθμιση του ηλεκτρικού ρεύματος που τροφοδοτεί τα μηχανήματα σε αυτήν την περιοχή. \n\n Ο πυλώνας είναι προς το παρόν ανενεργός και άτρωτος σε ζημιές.
actors.mobs.pylon.name=πυλώνας ισχύος
actors.mobs.rat.desc=Οι μαρσιποφόροι αρουραίοι είναι επιθετικοί αλλά μάλλον αδύναμοι κάτοικοι των υπονόμων. Έχουν ένα άσχημο δάγκωμα, αλλά είναι απειλητικοί για τη ζωή μόνο σε μεγάλους αριθμούς.
actors.mobs.rat.name=μαρσιποφόρος αρουραίος
actors.mobs.ripperdemon.desc=Αυτά τα φρικτά πλάσματα είναι το αποτέλεσμα των πολλών πτωμάτων νάνων σε αυτήν την περιοχή που χρησιμοποιούνται από δαιμονικές δυνάμεις. Οι Rippers είναι αδυνατισμένα, μακάβρια πλάσματα που μοιάζουν με νάνους, αλλά με σπασμένα σώματα και μακριά, αιχμηρά νύχια φτιαγμένα από κόκαλα.\n\nΟι δαίμονες Rippers δεν είναι ιδιαίτερα ανθεκτικοί, αλλά είναι ευκίνητοι και επικίνδυνοι. Είναι ικανοί να πηδούν μεγάλες αποστάσεις για να φτάσουν γρήγορα σε στόχους πριν τους καρφώσουν με τα νύχια τους.
actors.mobs.ripperdemon.leap=Ο δαίμονας-αντεροβγάλτης ετοιμάζεται να πηδήξει!
actors.mobs.ripperdemon.name=δαίμονας αντεροβγάλτης
actors.mobs.rotheart.desc=Ο καρπός του Rotberry είναι πολύ μοναδικός. Αντί να σαπίζει και να παρέχει θρεπτικά συστατικά, ο καρπός αναπτύσσεται, σκληραίνει και περιβάλλει τον σπόρο. Παρέχει προστασία στα εσωτερικά όργανα που αναπτύσσονται μέσα στον καρπό. Αυτή η γιγάντια σφαίρα αναφέρεται ως η καρδιά ενός ενήλικου φυτού rotberry.
actors.mobs.rotheart.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.rotheart.name=σάπια καρδιά
actors.mobs.rotlasher.desc=Το σαράκι είναι μέρος της ριζικής δομής ενός ώριμου φυτού rotberry, και επίσης το κύριο μέσο άμυνάς του. Τα σαράκια είναι τυφλά και καρφωμένα στο έδαφος, αλλά θα επιτεθούν βίαια σε οποιαδήποτε κοντινή απειλή αφού αφιερώσουν λίγο χρόνο για να τα εντοπίσουν. Όταν δεν υπάρχουν κοντινοί εχθροί, στέκονται ακίνητοι, προσπαθώντας να ενωθούν με την γύρω βλάστηση.
actors.mobs.rotlasher.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό κατά τη διάρκεια μιας συγκεκριμένης αποστολής.
actors.mobs.rotlasher.name=σάπιος μαστιγωτής
actors.mobs.scorpio.desc=Αυτά τα τεράστια δαιμονικά πλάσματα που μοιάζουν με αραχνοειδή αποφεύγουν τις μάχες σώμα με σώμα, προτιμώντας να πυροβολούν με παραλυτικά οδοντωτά καρφιά από μεγάλες αποστάσεις.
actors.mobs.scorpio.name=Σκορπιός
actors.mobs.senior.desc=Αυτοί οι μοναχοί είναι φανατικοί, αφοσιωμένοι στην προστασία των μυστικών της πόλης τους από κάθε ξένο. Δεν χρησιμοποιούν πανοπλίες ή όπλα και βασίζονται αποκλειστικά στην τέχνη της άοπλης μάχης.
actors.mobs.senior.name=ανώτερος μοναχός
actors.mobs.shaman$blueshaman.spell_desc=Αυτός ο σαμάνος φοράει μπλε μάσκα και θα χρησιμοποιήσει μαγεία που προσωρινά _αυξάνει τη ζημιά που δέχεσαι._
actors.mobs.shaman$purpleshaman.spell_desc=Αυτός ο σαμάνος φοράει μια μωβ μάσκα και θα χρησιμοποιήσει μαγεία που προσωρινά _μειώνει την ακρίβεια και την αποφυγή σου._
actors.mobs.shaman$redshaman.spell_desc=Αυτός ο σαμάνος φοράει κόκκινη μάσκα και θα χρησιμοποιήσει μαγεία που προσωρινά _αδυνατίζει την επιθετική σου δύναμη._
actors.mobs.shaman.bolt_kill=Το μαγικό μπουλόνι σε σκότωσε...
actors.mobs.shaman.desc=Τα πιο έξυπνα γκνολ μπορούν να μάθουν σαμανική μαγεία. Οι σαμάνοι τους προτιμούν πολεμικά ξόρκια για να αναπληρώσουν την έλλειψη δύναμης και δεν διστάζουν να τα χρησιμοποιήσουν εναντίον όποιου αμφισβητεί τη θέση τους στη φυλή.
actors.mobs.shaman.name=σαμάνος γκνολ
actors.mobs.skeleton.def_verb=μπλοκαρισμένο
actors.mobs.skeleton.desc=Οι σκελετοί αποτελούνται από κόκαλα άτυχων τυχοδιωκτών και κατοίκων του μπουντρουμιού, που ζωντάνεψαν από την κακή μαγεία των βαθύτερων επιπέδων. Όταν υποστούν αρκετή ζημιά, διαλύονται σε μια έκρηξη από κόκαλα.
actors.mobs.skeleton.explo_kill=Σκοτώθηκες από την έκρηξη των οστών...
actors.mobs.skeleton.name=σκελετός
actors.mobs.slime.def_verb=μπλοκαρισμένο
actors.mobs.slime.desc=Οι γλίτσες είναι παράξενα, ελαφρώς μαγικά πλάσματα με ελαστικό εξωτερικό σώμα και υγρό πυρήνα. Οι αποχετεύσεις της πόλης τους παρέχουν άφθονο νερό και θρεπτικά συστατικά. \n\nΛόγω της ελαστικής εξωτερικής τους μεμβράνης, είναι δύσκολο να προκληθεί περισσότερο από _6 ζημιά_ στις γλίτσες από οποιαδήποτε επίθεση.
actors.mobs.slime.name=λάσπη
actors.mobs.snake.desc=Αυτά τα υπερμεγέθη φίδια είναι ικανά να γλιστρούν γρήγορα γύρω από τα χτυπήματα, καθιστώντας τα αρκετά δύσκολα στο να τα χτυπήσει κανείς. Ωστόσο, οι μαγικές επιθέσεις ή οι αιφνιδιαστικές επιθέσεις είναι ικανές να τα πιάσουν αιφνιδιαστικά.\n\nΜπορείτε να εκτελέσετε μια αιφνιδιαστική επίθεση επιτιθέμενοι ενώ βρίσκεστε μακριά από το οπτικό πεδίο του φιδιού. Ένας τρόπος είναι να αφήσετε ένα φίδι να σας κυνηγήσει μέσα από μια πόρτα και στη συνέχεια _να σας χτυπήσει αμέσως μόλις μπει στην πόρτα._
actors.mobs.snake.hint=Δοκιμάστε να χρησιμοποιήσετε το κουμπί εξέτασης σε ένα φίδι για να μάθετε πώς να το αντιμετωπίσετε.
actors.mobs.snake.name=φίδι υπονόμων
actors.mobs.spectralnecromancer.desc=Ενώ οι σκελετοί είναι το ψωμί και το βούτυρο ενός νεκρομάντη, κάποιοι προτιμούν να αναζητούν άλλους, λιγότερο σωματικούς υπηρέτες. Οι φασματικοί νεκρομάντες έχουν επιλέξει τα φαντάσματα ως τους υπηρέτες της επιλογής τους! \n\nΤα μεμονωμένα φαντάσματα δεν είναι τόσο δυνατά όσο οι σκελετοί, αλλά αυτοί οι νεκρομάντες δεν φοβούνται να καλέσουν πολλά από αυτά!
actors.mobs.spectralnecromancer.name=φασματικός νεκρομάντης
actors.mobs.spinner.desc=Αυτές οι πρασινωπές, τριχωτές αράχνες των σπηλαίων αποφεύγουν την άμεση μάχη. Προτιμούν να περιμένουν από μακριά, όσο το θύμα τους, παγιδευμένο στον ιστό τους, πεθαίνει αργά από το δηλητηριώδες δάγκωμα.
actors.mobs.spinner.name=αράχνη των σπηλαίων
actors.mobs.statue.def_verb=μπλοκαρισμένο
actors.mobs.statue.desc=Θα νόμιζε κανείς ότι είναι απλώς ένα από τα άψυχα αγάλματα αυτού του μπουντρουμιού, αλλά τα κόκκινα, λαμπερά μάτια του το προδίδουν.
actors.mobs.statue.desc_weapon=Ενώ το ίδιο το άγαλμα είναι φτιαγμένο από πέτρα, το _%s_ που κρατάει μοιάζει αληθινό.
actors.mobs.statue.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό οπουδήποτε στο μπουντρούμι.
actors.mobs.statue.name=κινούμενο άγαλμα
actors.mobs.succubus.desc=Οι σούκουμπους είναι δαίμονες που μοιάζουν με σαγηνευτικά κορίτσια με κάπως γοτθική εμφάνιση. Με τη μαγεία τους μπορούν να γοητεύσουν έναν ήρωα, κάνοντάς τον ανίκανο να επιτεθεί σε οτιδήποτε μέχρι να λυθούν τα μάγια.
actors.mobs.succubus.name=σουκούμπους
actors.mobs.swarm.desc=Το θανατηφόρο σμήνος μυγών βουίζει θυμωμένα. Κάθε μη μαγική επίθεση θα το χωρίσει σε δύο μικρότερα αλλά εξίσου επικίνδυνα σμήνη.
actors.mobs.swarm.name=σμήνος από μύγες
actors.mobs.tengu$bombability$bombblob.desc=Ένα σύννεφο υπερθερμασμένου καπνού υψώνεται εδώ. Προσοχή, θα εκραγεί!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Έχει κολλήσει στο έδαφος, δεν μπορείς να το κουνήσεις!
actors.mobs.tengu$bombability$bombitem.desc=Ο Τένγκου έχει πετάξει μια παράξενη βόμβα καπνού εδώ, η οποία φουσκώνει έναν πυκνό, καυτό καπνό. Κάνει έναν δυνατό, τικ-τακ, σαν να μετράει αντίστροφα για την έκρηξη! \n\nΗ βόμβα έχει αγκυροβολήσει στο έδαφος, οπότε δεν μπορείς να την πιάσεις.
actors.mobs.tengu$bombability$bombitem.name=βόμβα καπνού
actors.mobs.tengu$fireability$fireblob.desc=Ο Τένγκου έριξε μια λεπτή σκόνη που φαίνεται να πιάνει ατμό εδώ, πρόκειται να ανάψει!
actors.mobs.tengu$shockerability$shockerblob.desc=Ηλεκτρική ενέργεια συσσωρεύεται εδώ, οτιδήποτε στέκεται πάνω σε αυτό το πλακίδιο θα σοκαριστεί την επόμενη σειρά!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Βγάζει πολύ ρεύμα, δεν μπορείς να το πιάσεις!
actors.mobs.tengu$shockerability$shockeritem.desc=Ο Τένγκου έχει ρίξει εδώ μια περίεργη μηχανή, η οποία φαίνεται να είναι φτιαγμένη από εξαρτήματα DM-100. Η μηχανή παράγει συνεχώς ηλεκτρικό τόξο γύρω της, αλλά φαίνεται να ακολουθεί ένα προβλέψιμο μοτίβο. \n\nΜε όλο αυτό το ηλεκτρικό τόξο γύρω της, δεν υπάρχει τρόπος να το καταλάβεις.
actors.mobs.tengu$shockerability$shockeritem.name=Τινάσσων
actors.mobs.tengu.defeated=Επιτέλους ελεύθεροι...
actors.mobs.tengu.desc=Οι Τένγκου ανήκουν σε μια αρχαία φατρία δολοφόνων με το ίδιο όνομα. Είναι γνωστοί για την εκτεταμένη χρήση σούρικεν και παγίδων.
actors.mobs.tengu.interesting=Ας το κάνουμε ενδιαφέρον...
actors.mobs.tengu.name=Τένγκου
actors.mobs.tengu.notice_gotcha=Κατάλαβα, %s!
actors.mobs.tengu.notice_have=Σε έχω τώρα, %s!
actors.mobs.tengu.rankings_desc=Δολοφονήθηκε από τους Τένγκου
actors.mobs.thief.carries=Ο κλέφτης κουβαλάει ένα _%s._ Προφανώς είναι κλεμμένο.
actors.mobs.thief.desc=Αν και αυτοί οι κρατούμενοι περιφέρονται ελεύθεροι από τα κελιά τους, αυτό το μέρος εξακολουθεί να είναι η φυλακή τους. Με την πάροδο του χρόνου, αυτό το μέρος έχει πάρει το μυαλό τους καθώς και την ελευθερία τους. Πριν από πολύ καιρό, αυτοί οι τρελοί κλέφτες και ληστές έχουν ξεχάσει ποιοι είναι και γιατί κλέβουν. \n\n Αυτοί οι εχθροί είναι πιο πιθανό να κλέψουν και να τρέξουν παρά να πολεμήσουν. Φροντίστε να τους έχετε στο οπτικό σας πεδίο, αλλιώς μπορεί να μην ξαναδείτε ποτέ το κλεμμένο σας αντικείμενο.
actors.mobs.thief.escapes=Ο κλέφτης τη γλιτώνει με το %s σου!
actors.mobs.thief.name=τρελός κλέφτης
actors.mobs.thief.stole=Ο κλέφτης σου έκλεψε το %s!
actors.mobs.tormentedspirit.desc=Τα βασανισμένα πνεύματα είναι κατά τα άλλα καλοπροαίρετα πνεύματα που έχουν πληγεί από μια κατάρα. Όσο είναι καταραμένα, θα επιτίθενται σαν φάντασμα και είναι επίσης πιο ισχυρά!\n\nΊσως είναι δυνατό να καθαρίσετε την κατάρα χρησιμοποιώντας το σωστό αντικείμενο ενώ βρίσκεστε δίπλα στο πνεύμα. Αν η κατάρα λυθεί, το πνεύμα σίγουρα θα είναι ευγνώμον...
actors.mobs.tormentedspirit.name=βασανισμένο πνεύμα
actors.mobs.tormentedspirit.thank_you=Σας ευχαριστώ...
actors.mobs.vaultrat.desc=Αυτός ο αρουραίος έχει κάποιες αλλαγές στη συμπεριφορά του για να δοκιμάσει τη νέα Τεχνητή Νοημοσύνη του εχθρού στο θησαυροφυλάκιο: \n_-_ Η κίνησή του μπορεί να «ακουστεί» μέσα από τοίχους \n_-_ Θα περιπλανηθεί κατά μήκος μιας προκαθορισμένης περιπολίας \n_-_ Ενώ περιπλανιέται, έχει μειωμένο εύρος ανίχνευσης πίσω από την κατεύθυνση στην οποία κινείται. \n_-_ Ενώ κοιμάται, το εύρος ανίχνευσης είναι επίσης μειωμένο \n_-_ Όταν σας ανιχνεύσει, θα «ερευνήσει» πριν αλλάξει σε κυνήγι. Οι εχθροί που ερευνούν κινούνται προς το μέρος σας, αλλά δεν επιτίθενται και είναι πιο εύκολο να τους χάσετε πίσω από πόρτες και γωνίες.
actors.mobs.warlock.bolt_kill=Η σκιά σε σκότωσε...
actors.mobs.warlock.desc=Όταν οι νάνοι έστρεψαν το ενδιαφέρον τους από τη μηχανική στις απόκρυφες τέχνες, οι σκοτεινοί μάγοι πήραν την εξουσία στην πόλη. Ξεκίνησαν με στοιχειακή μαγεία, αλλά σύντομα πέρασαν στη δαιμονολογία και τη νεκρομαντεία.
actors.mobs.warlock.name=νάνος μάγος
actors.mobs.wraith.desc=Ένα φάντασμα είναι ένα εκδικητικό πνεύμα ενός αμαρτωλού, του οποίου ο τάφος ή ο τάφος διαταράχθηκε. Όντας μια αιθέρια οντότητα, είναι πολύ δύσκολο να το χτυπήσεις με ένα κανονικό όπλο.
actors.mobs.wraith.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό οπουδήποτε στο μπουντρούμι.
actors.mobs.wraith.name=φάντασμα
actors.mobs.yogdzewa$larva.desc=Αυτά τα μικροσκοπικά γέννηματα των Γιογκ-Ντζέβα είναι απλά υπηρέτες που είναι εύκολο να παραχθούν. Ενώ είναι αδύναμοι ατομικά, καλούνται γρήγορα και μπορούν να γίνουν συντριπτικοί σε μεγάλους αριθμούς.
actors.mobs.yogdzewa$larva.name=προνύμφη του Θεού
actors.mobs.yogdzewa$larva.rankings_desc=Καταβροχθισμένος από τον Γιογκ-Ντζέβα
actors.mobs.yogdzewa$yogeye.rankings_desc=Καταβροχθισμένος από τον Γιογκ-Ντζέβα
actors.mobs.yogdzewa$yogripper.rankings_desc=Καταβροχθισμένος από τον Γιογκ-Ντζέβα
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Καταβροχθισμένος από τον Γιογκ-Ντζέβα
actors.mobs.yogdzewa.darkness=Το σκοτάδι πλησιάζει όλο και πιο κοντά...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Ο Γιογκ-Ντζέβα είναι ένας Παλιός Θεός. Ένα μεγάλο τέρας που φτάνει στους θνητούς κόσμους και τους καταβροχθίζει για να τροφοδοτήσει την ατελείωτη ανάπτυξή του. Οι νάνοι πρέπει να έχουν προσελκύσει την προσοχή αυτού του κοσμικού τρόμου ενώ έπαιζαν με σκοτεινές μαγείες και έκτοτε προσπαθούν να τον συγκρατήσουν.\n\nΟ Γιογκ-Ντζέβα προέρχεται από μια διάσταση ακατέργαστου μαγικού χάους και δεν μπορεί να φέρει την πραγματική του μορφή σε αυτόν τον κόσμο. Αντ' αυτού, έχει δημιουργήσει avatars και έχει καλέσει δαιμονικούς υπηκόους για να κάνουν τις εντολές του εδώ.\n\nΑυτό το γιγάντιο μάτι είναι το επίκεντρο της δύναμης του Γιογκ-Ντζέβα σε αυτόν τον κόσμο. Ενώ το ίδιο το μάτι είναι ακίνητο, είναι ικανό να εκτοξεύει ισχυρές ακτίνες δαιμονικής μαγείας και να καλεί μια ποικιλία υπηκόων για να το βοηθήσουν.
actors.mobs.yogdzewa.desc_spawners=Μπορείς να νιώσεις κύματα δαιμονικής ενέργειας να ακτινοβολούν στο μάτι από τους πάνω ορόφους. Κάτι που άφησες ζωντανό εκεί πάνω πρέπει να διοχετεύει δύναμη πίσω στον Γιογκ-Ντζέβα. _Ο Γιογκ θα χρησιμοποιήσει αυτήν την ενέργεια για να καλέσει πιο ισχυρούς υπηρέτες!_
actors.mobs.yogdzewa.hope=Η. ΕΛΠΙΔΑ. ΣΟΥ. ΕΙΝΑΙ. ΜΙΑ. ΨΕΥΔΑΙΣΘΗΣΗ!
actors.mobs.yogdzewa.name=Γιογκ-Ντζέβα
actors.mobs.yogdzewa.notice=ΕΓΩ. ΒΛΕΠΩ. ΣΕΝΑ.
actors.mobs.yogdzewa.rankings_desc=Καταβροχθισμένος από τον Γιογκ-Ντζέβα
actors.mobs.yogfist$brightfist.desc=Αυτή η γροθιά αποτελείται από καθαρή φωτεινή ενέργεια. Είναι ικανή να εκτοξεύει ισχυρές ακτίνες καυτού φωτός σε κάθε στροφή! Αυτές οι δέσμες θα σας τυφλώσουν προσωρινά, εκτός από το ότι θα προκαλέσουν μεγάλη ζημιά. Η γροθιά είναι επίσης ικανή να κατακλύσει για λίγο την αρένα με εκτυφλωτικό φως προκειμένου να ξεφύγει!\n\nΗ γροθιά, ωστόσο, δεν έχει ειδικές ικανότητες που να μπορεί να χρησιμοποιήσει σε μάχη σώμα με σώμα.
actors.mobs.yogfist$brightfist.name=φωτεινή γροθιά
actors.mobs.yogfist$brightfist.teleport=Η γροθιά τηλεμεταφέρεται μακριά σε μια λάμψη φωτός που σε τυφλώνει σοβαρά!
actors.mobs.yogfist$burningfist.desc=Μια πελώρια γροθιά τυλιγμένη στις φλόγες. Τα δάχτυλά της τρίζουν καθώς κλείνουν, σκορπίζοντας κάρβουνα στο πάτωμα.
actors.mobs.yogfist$burningfist.name=φλεγόμενη γροθιά
actors.mobs.yogfist$darkfist.desc=Αυτή η γροθιά αποτελείται από καθαρή σκοτεινή ενέργεια. Είναι ικανή να εξαπολύει ισχυρές εκρήξεις σκοτεινής μαγείας σε κάθε στροφή! Αυτές οι εκρήξεις θα αποδυναμώσουν την πηγή φωτός σας, εκτός από το ότι θα προκαλέσουν μεγάλη ζημιά. Η γροθιά είναι επίσης ικανή να κατακλύσει για λίγο την αρένα στο σκοτάδι για να ξεφύγει!\n\nΗ γροθιά, ωστόσο, δεν έχει ειδικές ικανότητες που να μπορεί να χρησιμοποιήσει σε μάχη σώμα με σώμα.
actors.mobs.yogfist$darkfist.name=σκοτεινή γροθιά
actors.mobs.yogfist$darkfist.teleport=Η γροθιά τηλεμεταφέρεται μακριά σε μια έκρηξη σκότους που σβήνει την πηγή φωτός σας!
actors.mobs.yogfist$rottingfist.desc=Μια τεράστια γροθιά από σάπια σάρκα. Δύσοσμη γλίτσα στάζει ανάμεσα στα δάχτυλά της και λερώνει την πέτρα από κάτω.
actors.mobs.yogfist$rottingfist.name=σάπια γροθιά
actors.mobs.yogfist$rustedfist.desc=Αυτή η γροθιά είναι φτιαγμένη από ζωντανό μέταλλο. Είναι μια πανύψηλη μάζα από κινούμενο μέταλλο που έχει ισχυρές επιθέσεις σώμα με σώμα και μπορεί να παραλύσει τους στόχους της από απόσταση. Λόγω της τεράστιας μάζας της, η γροθιά θα δεχτεί οποιαδήποτε ζημιά της προκληθεί με την πάροδο του χρόνου, αντί για αμέσως.\n\nΗ γροθιά είναι άκαμπτη, ωστόσο, και δεν μπορεί να κινηθεί σε στενά περάσματα. Επιπλέον, ενώ μπορεί να δεχτεί ζημιά αργά, η αναβαλλόμενη ζημιά θα συνεχίσει να αυξάνεται εάν η γροθιά χτυπηθεί πολλές φορές.
actors.mobs.yogfist$rustedfist.name=σκουριασμένη γροθιά
actors.mobs.yogfist$soiledfist.desc=Αυτή η γροθιά σχηματίζεται από χαοτική γήινη μαγεία. Καθώς κινείται, θα προκαλεί συνεχώς βλάστηση γύρω της. Μπορεί επίσης να εκτοξεύσει συγκεντρωμένες γήινες εκρήξεις που θα παγιδεύσουν τον στόχο της σε ταχέως αναπτυσσόμενα κλήματα και ρίζες!\n\nΗ γροθιά αντλεί δύναμη από αυτή τη φυτική ζωή και θα αντισταθεί στη ζημιά με βάση την ποσότητα ψηλής ή αυλακωτής βλάστησης κοντά της!
actors.mobs.yogfist$soiledfist.name=λερωμένη γροθιά
actors.mobs.yogfist.desc=Αυτή η γροθιά είναι μια πτυχή της δύναμης του Γιογκ-Ντζέβα. Οι γροθιές συνδέονται με τη δύναμη του Γιογκ-Ντζέβα και θα προστατεύονται από κάθε ζημιά όταν βρίσκονται κοντά στο μάτι.
actors.mobs.yogfist.invuln_warn=Η γροθιά είναι άτρωτη όταν βρίσκεται κοντά στο μάτι!
actors.mobs.yogfist.rankings_desc=Καταβροχθισμένος από τον Γιογκ-Ντζέβα
