actors.blobs.foliage.desc=Sinar-sinar cahaya menembus kegelapan taman bawah tanah.
actors.blobs.foliage.name=dedaunan
actors.blobs.freezing.desc=Udara di sini sangat dingin, tidak seperti biasanya.
