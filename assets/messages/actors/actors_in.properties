actors.blobs.regrowth.name=pertumbuhan kembali
actors.blobs.sacrificialfire.desc=Di sini terdapat sebuah altar dengan api kurban yang menyala di atasnya. Setiap makhluk yang dibunuh di sini akan dimakan sebagai persembahan kepada roh-roh penjara bawah tanah. Mungkin akan diberikan hadiah jika cukup banyak kurban yang dipersembahkan?
actors.blobs.sacrificialfire.name=api kurban
actors.blobs.sacrificialfire.reward=Api berkobar lalu padam, meninggalkan hadiah di belakangnya!
actors.blobs.sacrificialfire.unworthy=Api melahap persembahanmu, tetapi tidak berubah.
actors.blobs.sacrificialfire.worthy=Api melahap persembahanmu dan semakin membesar.
actors.blobs.smokescreen.desc=Kepulan asap hitam tebal berputar-putar di sini.
actors.blobs.smokescreen.name=tabir asap
actors.blobs.stenchgas.desc=Kepulan bau busuk yang menyengat berputar-putar di sini.
actors.blobs.stenchgas.name=gas bau busuk
actors.blobs.stormcloud.desc=Gumpalan uap air yang mengepul berputar-putar di sini.
actors.blobs.stormcloud.name=awan badai
actors.blobs.toxicgas.desc=Awan kehijauan berisi gas beracun berputar-putar di sini.
actors.blobs.toxicgas.name=gas beracun
actors.blobs.toxicgas.ondeath=Anda meninggal karena gas beracun...
actors.blobs.toxicgas.rankings_desc=Tercekik
actors.blobs.waterofawareness.desc=Kekuatan pengetahuan terpancar dari air sumur ini. Minum dari sumur ini akan sepenuhnya mengidentifikasi semua item yang Anda kenakan, mengidentifikasi kutukan pada semua item di inventaris Anda, dan mengungkapkan semua item di lantai saat ini.
actors.blobs.waterofawareness.name=air kesadaran
actors.blobs.waterofawareness.procced=Saat Anda menyesapnya, Anda merasakan pengetahuan mengalir ke dalam pikiran Anda.
actors.blobs.waterofhealth.desc=Kekuatan kesehatan terpancar dari air sumur ini. Minum dari sumur ini akan menyembuhkan luka Anda, menghilangkan rasa lapar, dan membersihkan kutukan pada barang-barang yang sudah usang.
actors.blobs.waterofhealth.name=air kesehatan
actors.blobs.waterofhealth.procced=Saat Anda menyesapnya, Anda merasakan luka Anda sembuh sepenuhnya.
actors.blobs.web.desc=Jaring tebal menutupi segalanya di sini. Apa pun yang menyentuh atau dilemparkan melalui jaring itu akan merusaknya, tetapi juga akan terjebak di tempatnya.
actors.blobs.web.name=jaring laba-laba
actors.buffs.adrenaline.desc=Lonjakan kekuatan fisik, adrenalin meningkatkan kecepatan serangan dan pergerakan.\n\nAdrenalin memungkinkan targetnya berlari dengan kecepatan 2x, dan menyerang dengan kecepatan 1,5x.\n\nGiliran tersisa: %s.
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenalinesurge.desc=Gelombang kekuatan yang besar, tetapi sayangnya tidak permanen.\n\nPeningkatan kekuatan: +%d.\nGiliran hingga peningkatan melemah: %s.
actors.buffs.adrenalinesurge.name=peningkatan kekuatan
actors.buffs.amok.desc=Amok menyebabkan keadaan amarah dan kebingungan yang hebat pada targetnya. Ketika suatu makhluk terkena amok, mereka akan menyerang apa pun yang ada di dekat mereka, baik itu teman maupun musuh. Jumlah giliran amok yang tersisa: 0.
actors.buffs.amok.name=amuk
actors.buffs.arcanearmor.desc=Perisai tipis mengelilingi Anda, menghalangi sebagian kerusakan dari serangan sihir.\n\nArmor sihir Anda saat ini ditingkatkan sebesar: 0-%d.\n\nGiliran hingga armor sihir melemah: %s.
actors.buffs.arcanearmor.name=baju besi misterius
actors.buffs.artifactrecharge.desc=Energi mengalir melalui Anda, meningkatkan laju pengisian artefak yang Anda kenakan.\n\nSetiap artefak terpengaruh sedikit berbeda, tetapi semuanya akan terisi daya jauh lebih cepat dari biasanya.\n\nGiliran tersisa: %s.
actors.buffs.artifactrecharge.name=pengisian ulang artefak
actors.buffs.ascensionchallenge.almost=Kau merasakan cengkeraman Yog pada jimat itu mulai melemah, kau hampir sampai!
actors.buffs.ascensionchallenge.beckon=Jimat itu mulai memanggil musuh-musuh yang berada di kejauhan.
actors.buffs.ascensionchallenge.break=Anda mengambil waktu sejenak untuk menarik napas dan merasakan luka Anda mulai menutup!
actors.buffs.ascensionchallenge.damage=Jimat itu mulai memancarkan energi gelap. Jimat itu terbakar!
actors.buffs.ascensionchallenge.desc=Entah bagaimana Yog-Dzewa mempertahankan pengaruhnya di dunia ini melalui jimat tersebut, dan mencoba menghentikan kenaikanmu! Kekuatan Yog membuat ruang bawah tanah jauh lebih berbahaya, meningkatkan jumlah musuh dan membuat mereka lebih kuat! Kekuatan ini akan terus meningkat jika dibiarkan tanpa kendali, dan dapat dilemahkan dengan mengalahkan musuh yang telah diperkuat oleh kekuatan Yog.
actors.buffs.ascensionchallenge.desc_beckon=Jimat itu saat ini sedang _memanggil musuh yang berada di kejauhan,_ memberi tahu mereka tentang posisi Anda.
actors.buffs.ascensionchallenge.desc_clear=Energi gelap yang terpancar dari jimat tersebut telah dilemahkan semaksimal mungkin untuk saat ini.
actors.buffs.ascensionchallenge.desc_damage=Energi dari jimat itu telah menjadi sangat kuat sehingga _secara langsung membahayakanmu!_
actors.buffs.ascensionchallenge.desc_haste=Jimat ini saat ini mempercepat pergerakan musuh yang jauh, memungkinkan mereka untuk mencapai Anda lebih cepat!
actors.buffs.ascensionchallenge.desc_slow=Jimat ini saat ini memperlambat gerakanmu, dan meniadakan efek peningkatan kecepatan!
actors.buffs.ascensionchallenge.haste=Jimat itu mulai mempercepat pergerakan musuh yang jauh!
actors.buffs.ascensionchallenge.name=kutukan jimat
actors.buffs.ascensionchallenge.on_kill=Energi gelap itu melahapmu...
actors.buffs.ascensionchallenge.slow=Jimat itu mulai terasa seperti beban berat di inventaris Anda!
actors.buffs.ascensionchallenge.weaken=Anda bisa merasakan kutukan jimat itu sedikit melemah.
actors.buffs.ascensionchallenge.weaken_info=Kutukan jimat tersebut dapat dilemahkan dengan mengalahkan lebih banyak musuh.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Jika kamu mengalahkan musuh, kutukan jimat itu akan melemah!
actors.buffs.barkskin.desc=Kulitmu mengeras, terasa kasar dan padat seperti kulit kayu. Kulit yang mengeras meningkatkan armor efektifmu, memungkinkanmu untuk bertahan lebih baik terhadap serangan fisik. Armormu saat ini meningkat sebesar: 0-%d. Giliran sampai kulit kayu melemah: %s. Jika kamu menerima kulit kayu dari beberapa sumber, hanya yang terkuat yang akan berlaku.
actors.buffs.barkskin.name=kulit kayu
actors.buffs.barrier.desc=Sebuah gelembung kekuatan tahan lama yang memblokir semua kerusakan.\n\nPenghalang akan menerima kerusakan untuk apa pun yang dilindunginya selama masih ada perisai yang tersisa. Perisai juga akan perlahan-lahan melemah seiring waktu.\n\nPerisai yang tersisa: %d.
actors.buffs.barrier.name=penghalang
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=marah
actors.buffs.berserk.angered_desc=Tingkat keparahan luka Berserker memperkuat serangannya. Saat Berserker menerima kerusakan fisik, amarahnya akan meningkat, memberinya bonus kerusakan. Kerusakan yang diblokir oleh armor tetap dihitung untuk meningkatkan amarah. Amarah akan memudar seiring waktu. Semakin rendah kesehatan Berserker, semakin lama amarahnya akan bertahan. Pada 100 amarah, Berserker dapat mengamuk, memberinya perisai berdasarkan tingkat armor dan kesehatannya yang hilang. Saat mengamuk, perisainya akan melemah seiring waktu dan setelah habis, dia harus beristirahat sebelum dapat mengumpulkan amarah lagi. Amarah Saat Ini: Kerusakan: Perisai Mengamuk pada Armor dan HP Saat Ini:
actors.buffs.berserk.berserk=mengamuk
actors.buffs.berserk.berserk_desc=Rasa takut dan ketidakpastian akan hilang, hanya menyisakan amarah. Dalam keadaan ini, Berserker sangat kuat, memberikan +50 kerusakan dan mendapatkan bonus perisai, tetapi juga kehilangan perisai setiap giliran. Ketika semua perisainya berkurang menjadi 0, amukan akan berakhir. Setelah mengamuk, Berserker perlu memulihkan diri sebelum dapat membangun amarah lagi. Perisai Tersisa:
actors.buffs.berserk.exhausted=lelah
actors.buffs.berserk.no_seal=Kamu butuh segel yang rusak itu untuk mengamuk!
actors.buffs.berserk.rankings_desc=Mengamuk sampai Mati
actors.buffs.berserk.recovering=pulih
actors.buffs.berserk.recovering_desc=Kekuatan batin memiliki batasnya. Sang Berserker harus beristirahat sebelum menggunakan amarahnya lagi. Saat memulihkan diri, Berserker tidak akan menambah amarah dari kerusakan yang diterimanya.
actors.buffs.berserk.recovering_desc_levels=Tingkat hingga pulih: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Putaran hingga pulih: _%d_
actors.buffs.bleeding.desc=Luka itu mengeluarkan darah dalam jumlah yang mengkhawatirkan. Pendarahan menyebabkan kerusakan setiap giliran. Setiap giliran, kerusakan berkurang secara acak, hingga pendarahan akhirnya berhenti. Kerusakan pendarahan saat ini: Kerusakan pendarahan saat ini:
actors.buffs.bleeding.heromsg=Kamu berdarah!
actors.buffs.bleeding.name=perdarahan
actors.buffs.bleeding.ondeath=Kamu meninggal karena kehabisan darah...
actors.buffs.bleeding.rankings_desc=Mati kehabisan darah
actors.buffs.bless.desc=Peningkatan fokus yang luar biasa, beberapa orang mengatakan itu diilhami oleh para dewa. \n\nBerkah meningkatkan akurasi dan penghindaran sebesar 25%%, membuat yang diberkati jauh lebih efektif dalam pertempuran. \n\nSisa giliran berkah: %s.
actors.buffs.bless.name=diberkati
actors.buffs.blindness.desc=Efek kebutaan mengubah dunia di sekitarnya menjadi kabut gelap. Saat buta, jangkauan penglihatan karakter berkurang menjadi satu petak, membuat serangan jarak jauh tidak berguna dan sangat mudah kehilangan jejak musuh yang jauh. Selain itu, pahlawan yang buta tidak dapat membaca gulungan atau buku. Jumlah giliran kebutaan yang tersisa: 0.
actors.buffs.blindness.heromsg=Kamu dibutakan!
actors.buffs.blindness.name=buta
actors.buffs.blobimmunity.desc=Suatu kekuatan aneh menyelimutimu dalam penghalang pelindung tipis, menghalangi semua efek berbahaya yang berasal dari udara.\n\nKamu kebal terhadap semua efek yang terbatas pada area tertentu selama penghalang ini aktif.\n\nSisa putaran kekebalan: %s.
actors.buffs.blobimmunity.name=penghalang pemurnian
actors.buffs.burning.burnsup=%s terbakar habis!
actors.buffs.burning.desc=Sedikit hal yang lebih menyedihkan daripada dilalap api. Api akan menimbulkan kerusakan setiap giliran hingga dipadamkan oleh air atau padam. Api dapat dipadamkan dengan menginjak air, atau dari percikan ramuan penghancur. Selain itu, api dapat membakar medan atau benda yang mudah terbakar yang bersentuhan dengannya. Jumlah giliran terbakar yang tersisa: 0.
actors.buffs.burning.heromsg=Kamu terbakar!
actors.buffs.burning.name=pembakaran
actors.buffs.burning.ondeath=Kau terbakar sampai mati...
actors.buffs.burning.rankings_desc=Terbakar Menjadi Abu
actors.buffs.championenemy$antimagic.desc=Champion anti-sihir menerima 50% lebih sedikit kerusakan dan sepenuhnya kebal terhadap efek sihir.
actors.buffs.championenemy$antimagic.name=juara anti-sihir
actors.buffs.championenemy$blazing.desc=Para champion tipe Blazing memberikan 25% lebih banyak damage jarak dekat, membakar musuh yang mereka serang, kebal terhadap api, dan menyebarkan api di sekitar mereka saat mereka mati. Namun, mereka tidak dapat menyebarkan api ke air.
actors.buffs.championenemy$blazing.name=juara yang bersinar
actors.buffs.championenemy$blessed.desc=Para champion yang diberkati memiliki akurasi dan penghindaran 4x lipat.
actors.buffs.championenemy$blessed.name=juara yang diberkati
actors.buffs.championenemy$giant.desc=Champion raksasa menerima 80% lebih sedikit kerusakan dan memiliki jangkauan serangan +1, tetapi tidak dapat bergerak melalui ruang tertutup.
actors.buffs.championenemy$giant.name=juara raksasa
actors.buffs.championenemy$growing.desc=Champion yang sedang berkembang mendapatkan bonus yang terus meningkat untuk akurasi, penghindaran, kerusakan fisik, dan pengurangan kerusakan yang diterima.\n\nPeningkatan akurasi/penghindaran/kerusakan saat ini: %1$d%%\nPengurangan kerusakan saat ini: %2$d%%
actors.buffs.championenemy$growing.name=juara yang sedang berkembang
actors.buffs.championenemy$projecting.desc=Champion yang memiliki kemampuan proyeksi memberikan 25% lebih banyak damage jarak dekat dan memiliki jangkauan serangan +3.
actors.buffs.championenemy$projecting.name=memproyeksikan juara
actors.buffs.championenemy.warn=Anda merasakan kehadiran yang mematikan.
actors.buffs.charm.cant_attack=Anda terpesona oleh musuh itu dan tidak dapat menyerangnya.
actors.buffs.charm.desc=Mantra adalah sihir manipulatif yang dapat membuat musuh saling mengagumi untuk sementara waktu. Karakter yang terkena mantra tidak dapat menyerang musuh yang memikat mereka secara langsung. Namun, menyerang target lain masih dimungkinkan. Rasa sakit yang ditimbulkan akan mengurangi durasi mantra. Jumlah giliran mantra yang tersisa: %s.
actors.buffs.charm.heromsg=Anda terpesona!
actors.buffs.charm.name=terpesona
actors.buffs.chill.desc=Tidak sepenuhnya beku, tetapi masih terlalu dingin.\n\nTarget yang kedinginan melakukan semua tindakan lebih lambat, tergantung pada berapa banyak giliran yang tersisa dalam efek tersebut. Pada kondisi terburuknya, ini setara dengan diperlambat.\n\nJumlah giliran kedinginan yang tersisa: %1$s.\nKecepatan berkurang sebesar: %2$s%%
actors.buffs.chill.freezes=%s mengalami pembekuan!
actors.buffs.chill.name=dingin
actors.buffs.combo$combomove.clobber.desc=Mendorong musuh mundur 2 petak, tetapi tidak menimbulkan kerusakan dan tidak dapat menjatuhkannya ke dalam jurang. Menambah kombo sebanyak 1.
actors.buffs.combo$combomove.clobber.empower_desc=Mendorong musuh mundur _3 petak, menimbulkan vertigo, dan dapat menjatuhkannya ke dalam jurang,_ tetapi tidak menimbulkan kerusakan. Menambah kombo sebanyak 1.
actors.buffs.combo$combomove.clobber.name=mengkritik
actors.buffs.combo$combomove.crush.desc=Menimbulkan kerusakan %d%% (kombo*25%%) pada target utama, dan setengah dari kerusakan tersebut pada semua musuh lain dalam area 7x7. Mengatur ulang kombo saat digunakan.
actors.buffs.combo$combomove.crush.empower_desc=Melompat hingga %1$d petak dan memberikan kerusakan %2$d%% (kombo*25%%) pada target utama, dan setengah dari kerusakan tersebut pada semua musuh lain dalam area 7x7. Mengatur ulang kombo saat digunakan.
actors.buffs.combo$combomove.crush.name=menghancurkan
actors.buffs.combo$combomove.fury.desc=Menyerang musuh sekali untuk setiap kombo yang Anda miliki, setiap serangan memberikan 60% kerusakan dan dapat memicu mantra. Mengatur ulang kombo saat digunakan.
actors.buffs.combo$combomove.fury.empower_desc=Melompat hingga %d petak dan mengenai musuh sekali untuk setiap kombo yang Anda miliki, setiap serangan memberikan 60%% kerusakan dan dapat memicu mantra. Mengatur ulang kombo saat digunakan.
actors.buffs.combo$combomove.fury.name=kemarahan
actors.buffs.combo$combomove.parry.desc=Memblokir serangan berikutnya dalam 1 giliran saat diaktifkan, dan langsung membalasnya. Mengatur ulang kombo jika tidak ada yang ditangkis.
actors.buffs.combo$combomove.parry.empower_desc=Memblokir _semua serangan_ dalam 1 giliran saat diaktifkan, dan langsung membalasnya. Mengatur ulang kombo jika tidak ada yang ditangkis.
actors.buffs.combo$combomove.parry.name=menangkis
actors.buffs.combo$combomove.slam.desc=Memberikan %d%% (kombo*20%%) dari kekuatan memblokir kerusakan Anda sebagai kerusakan bonus. Mengatur ulang kombo saat digunakan.
actors.buffs.combo$combomove.slam.empower_desc=Melompat hingga %1$d petak dan memberikan %2$d%% (kombo*20%%) dari kekuatan penahan kerusakan Anda sebagai kerusakan bonus. Mengatur ulang kombo saat digunakan.
actors.buffs.combo$combomove.slam.name=membanting
actors.buffs.combo.action_name=serangan kombo
actors.buffs.combo.bad_target=Anda harus membidik musuh yang berada dalam jangkauan serangan.
actors.buffs.combo.combo=%d berhasil melakukan kombo!
actors.buffs.combo.desc=Gladiator membangun momentum saat ia berhasil melancarkan pukulan. Setiap serangan meningkatkan penghitung kombo sebanyak satu, tetapi jeda terlalu lama antar pukulan akan mengatur ulang penghitung kombo menjadi 0. Selama gladiator memiliki kombo, perisai yang ia miliki dari segelnya yang rusak tidak akan mulai memudar. Membangun kombo membuka serangan kombo khusus yang tidak mungkin meleset! Serangan yang berbeda dibuka pada hitungan kombo 2, 4, 6, 8, dan 10. Beberapa gerakan mengatur ulang kombo dan beberapa tidak, tetapi setiap gerakan hanya dapat digunakan sekali per sesi kombo. Kombo saat ini: ZXQPH0. Giliran hingga kombo hilang: ZXQPH1.
actors.buffs.combo.name=kombinasi
actors.buffs.combo.prompt=Pilih target yang akan diserang.
actors.buffs.corrosion.desc=Asam kuat melarutkan daging, logam, dan tulang dengan kecepatan yang mengkhawatirkan. Kerusakan korosi meningkat seiring waktu, karena target terus melarut. Jumlah putaran korosi yang tersisa: 0. Kerusakan korosi saat ini: 1.
actors.buffs.corrosion.heromsg=Kamu meleleh!
actors.buffs.corrosion.name=korosi
actors.buffs.corrosion.ondeath=Kau meleleh...
actors.buffs.corrosion.rankings_desc=Larut
actors.buffs.corruption.desc=Korupsi meresap ke dalam esensi suatu makhluk, memutarbalikkan mereka melawan sifat asli mereka. Makhluk yang terkontaminasi akan menyerang sekutu mereka, dan mengabaikan musuh mereka sebelumnya. Korupsi juga merusak, dan perlahan akan menyebabkan targetnya menyerah. Korupsi bersifat permanen, efeknya hanya berakhir dengan kematian.
actors.buffs.corruption.name=rusak
actors.buffs.cripple.desc=Anda cukup yakin kaki tidak seharusnya menekuk seperti itu.\n\nKelemahan mengurangi kecepatan gerak menjadi setengahnya, sehingga memindahkan satu petak biasanya membutuhkan dua giliran, bukan satu.\n\nSisa giliran kelemahan: %s.
actors.buffs.cripple.heromsg=Kamu cacat!
actors.buffs.cripple.name=lumpuh
actors.buffs.daze.desc=Telinga berdenging dan penglihatan kabur membuat pertarungan menjadi sulit. Saat linglung, akurasi dan penghindaran berkurang 50%, sehingga mendaratkan dan menghindari pukulan menjadi jauh lebih sulit. Jumlah giliran linglung yang tersisa: 1.
actors.buffs.daze.heromsg=Kamu tampak linglung!
actors.buffs.daze.name=linglung
actors.buffs.degrade.desc=Sihir gelap yang kuat sedang menguras kekuatan yang telah diberikan gulungan peningkatan pada peralatan Anda! Saat terdegradasi, perlengkapan yang telah ditingkatkan akan diperlakukan seolah-olah levelnya lebih rendah dari yang sebenarnya. Setiap peningkatan setelah +3 menjadi jauh lebih lemah daripada yang sebelumnya. Deskripsi item Anda akan berubah untuk mencerminkan tingkat kekuatannya yang berkurang. Degradasi tidak memengaruhi persyaratan kekuatan, muatan tongkat sihir, daya tahan senjata lempar, atau artefak. Jumlah giliran degradasi yang tersisa: 0. Menggunakan gulungan peningkatan atau penghapusan kutukan akan mengakhiri degradasi dengan segera.
actors.buffs.degrade.heromsg=Peralatan Anda terasa lebih lemah!
actors.buffs.degrade.name=terdegradasi
actors.buffs.doom.desc=Sulit untuk terus maju ketika sepertinya alam semesta menginginkan kematianmu. Karakter yang terkena kutukan akan menerima +67% kerusakan dari semua sumber. Kutukan bersifat permanen, efeknya hanya berakhir saat kematian.
actors.buffs.doom.name=ditakdirkan
actors.buffs.dread.desc=Teror yang begitu hebat sehingga akan menyebabkan targetnya melarikan diri dari penjara bawah tanah sepenuhnya!\n\nMakhluk yang terkena kengerian akan berlari menjauhi lawannya dengan kecepatan tinggi, dan akan menghilang sepenuhnya dari penjara bawah tanah begitu mereka tidak terlihat. Musuh yang dikalahkan dengan cara ini memberikan setengah poin pengalaman dan tidak menjatuhkan item apa pun. Guncangan rasa sakit akan mengurangi durasi kengerian.\n\nGiliran kengerian yang tersisa: %d.
actors.buffs.dread.name=rasa takut
actors.buffs.drowsy.desc=Suatu kekuatan magis membuat sulit untuk tetap terjaga, setelah beberapa giliran, target akan jatuh ke dalam tidur magis yang dalam.\n\nSang pahlawan dapat melawan rasa kantuk dengan menerima kerusakan atau dengan berada dalam kondisi kesehatan penuh.\n\nGiliran hingga tertidur: %s.
actors.buffs.drowsy.name=mengantuk
actors.buffs.earthimbue.desc=Anda diberkahi dengan kekuatan bumi!\n\nSemua serangan fisik akan menggeser bumi di bawah musuh, melumpuhkan mereka untuk waktu singkat.\n\nGiliran penguatan bumi tersisa: %s.
actors.buffs.earthimbue.name=dipenuhi dengan unsur bumi
actors.buffs.enhancedrings.desc=Artefak yang baru saja digunakan oleh Rogue memperkuat cincinnya, memberinya +1 level.\n\nGiliran tersisa: %s.
actors.buffs.enhancedrings.name=cincin yang ditingkatkan
actors.buffs.fireimbue.desc=Anda diberkahi dengan kekuatan api!\n\nSemua serangan fisik akan memiliki peluang untuk membakar musuh. Selain itu, Anda sepenuhnya kebal terhadap efek api.\n\nSisa giliran penguatan api: %s.
actors.buffs.fireimbue.name=dipenuhi dengan api
actors.buffs.foresight.desc=Anda entah bagaimana mampu melihat tata letak medan di sekitar Anda dengan pikiran Anda. Saat berada di bawah pengaruh kemampuan melihat masa depan, semua ubin dalam radius yang luas akan terungkap kepada Anda, termasuk jebakan atau pintu rahasia apa pun. Jumlah giliran melihat masa depan yang tersisa: %s.
actors.buffs.foresight.name=tinjauan ke masa depan
actors.buffs.frost.desc=Jangan disamakan dengan pembekuan padat, pembekuan yang lebih ringan ini hanya membungkus target dalam es. Pembekuan bertindak mirip dengan kelumpuhan, membuat target tidak dapat bertindak. Tidak seperti kelumpuhan, pembekuan segera dibatalkan jika target menerima kerusakan, karena es akan hancur. Jumlah giliran pembekuan yang tersisa: %s.
actors.buffs.frost.freezes=%s mengalami pembekuan!
actors.buffs.frost.name=beku
actors.buffs.frostimbue.desc=Kamu diberkahi dengan kekuatan es!\n\nSemua serangan fisik akan secara bertahap menambah efek dingin pada musuh. Selain itu, kamu sepenuhnya kebal terhadap dingin.\n\nSisa giliran penguatan es: %s.
actors.buffs.frostimbue.name=diselimuti embun beku
actors.buffs.fury.desc=Kamu marah, musuh tidak akan menyukaimu saat kamu marah. Kemarahan besar membara di dalam dirimu, meningkatkan kerusakan yang kamu berikan dengan serangan fisik sebesar 50. Kemarahan ini akan berlangsung selama kamu terluka di bawah 50.
actors.buffs.fury.heromsg=Kamu menjadi sangat marah!
actors.buffs.fury.name=sangat marah
actors.buffs.gravitychaostracker.desc_duration=Tidak jelas berapa lama efeknya akan berlangsung, tetapi tidak mungkin berlangsung selamanya.
actors.buffs.gravitychaostracker.desc_intro=Setiap beberapa giliran, semua karakter di lantai penjara bawah tanah saat ini akan dilempar ke arah acak.
actors.buffs.gravitychaostracker.desc_positive=Namun, Anda dan sekutu Anda tampaknya kebal.
actors.buffs.gravitychaostracker.name=kekacauan gravitasi
actors.buffs.greaterhaste.desc=Peningkatan kecepatan yang luar biasa, untuk sesaat terasa seolah-olah segala sesuatu di sekitarnya berhenti. Saat berada di bawah pengaruh kecepatan yang lebih besar, tindakan bergerak tidak membutuhkan waktu sama sekali, tetapi tindakan lain masih dilakukan dengan kecepatan normal. Setiap langkah gerakan menghabiskan satu giliran kecepatan yang lebih besar. Giliran kecepatan yang lebih besar yang tersisa: %d.
actors.buffs.greaterhaste.name=tergesa-gesa yang lebih besar
actors.buffs.haste.desc=Energi mengalir melalui otot Anda, memungkinkan Anda berlari dengan kecepatan luar biasa! Saat berada di bawah pengaruh kecepatan, Anda akan berlari dengan kecepatan 3x lipat, tetapi akan melakukan semua tindakan lain dengan kecepatan normal. Jumlah giliran kecepatan yang tersisa: %s.
actors.buffs.haste.name=bergegas
actors.buffs.healing.desc=Ramuan ajaib menyebabkan luka menutup dan daging menyambung.\n\nSetiap giliran, kesehatan akan terus beregenerasi hingga efek penyembuhan berakhir. Jumlah penyembuhan mungkin akan berkurang seiring waktu.\n\nPenyembuhan berikutnya: %d.\n\nSisa penyembuhan: %d.
actors.buffs.healing.name=penyembuhan
actors.buffs.herodisguise.desc=Sihir ilusi telah mengubah penampilan fisikmu! Efeknya murni kosmetik, tetapi tetap terasa sangat aneh.\n\nJumlah giliran penyamaran yang tersisa: %s.
actors.buffs.herodisguise.name=samaran
actors.buffs.hex.desc=Sihir gelap yang menguras fokus, membuat target sedikit disorientasi.\n\nHexing mengurangi akurasi dan penghindaran sebesar 20%%, membuat target kurang efektif dalam pertempuran.\n\nJumlah giliran hex tersisa: %s.
actors.buffs.hex.heromsg=Kamu telah terkena kutukan!
actors.buffs.hex.name=dikutuk
actors.buffs.holdfast.desc=Sang Prajurit mempertahankan posisinya, meningkatkan armornya sebesar %1$d-%2$d dan memperlambat laju penurunan beberapa buff sebesar %3$d%%. Ini akan berlangsung hingga dia bergerak.
actors.buffs.holdfast.name=berpegang teguh
actors.buffs.hunger.cursedhorn=Tanduk terkutuk itu mencuri sebagian energi makanan saat kamu makan.
actors.buffs.hunger.desc=Rasa lapar perlahan meningkat seiring waktu yang Anda habiskan di ruang bawah tanah, akhirnya Anda akan mulai kelaparan. Saat kelaparan, Anda akan perlahan kehilangan kesehatan alih-alih memulihkannya.\n\nPenjatahan itu penting! Jika Anda memiliki kesehatan yang cukup, kelaparan bukanlah ide yang buruk jika itu berarti akan ada lebih banyak makanan nanti. Penjatahan yang efektif dapat membuat makanan bertahan jauh lebih lama!
actors.buffs.hunger.desc_intro_hungry=Anda bisa merasakan perut Anda keroncongan, tetapi belum terlalu mendesak.
actors.buffs.hunger.desc_intro_starving=Kamu sangat lapar sampai rasanya sakit.
actors.buffs.hunger.hungry=lapar
actors.buffs.hunger.ondeath=Kamu mati kelaparan...
actors.buffs.hunger.onhungry=Kamu lapar.
actors.buffs.hunger.onstarving=Kamu sangat lapar!
actors.buffs.hunger.rankings_desc=Mati kelaparan
actors.buffs.hunger.starving=kelaparan
actors.buffs.invisibility.desc=Anda sepenuhnya menyatu dengan medan di sekitarnya, sehingga Anda tidak mungkin terlihat. Saat Anda tidak terlihat, musuh tidak dapat menyerang atau mengikuti Anda. Serangan fisik dan efek magis (seperti gulungan dan tongkat sihir) akan segera membatalkan efek tidak terlihat. Jumlah giliran tidak terlihat yang tersisa: 0.
actors.buffs.invisibility.name=tak terlihat
actors.buffs.invulnerability.desc=Karakter ini dipenuhi dengan kekuatan pelindung yang hebat, memberikannya kekebalan sementara!\n\nGiliran tersisa: %s.
actors.buffs.invulnerability.name=kebal
actors.buffs.levitation.desc=Sebuah kekuatan magis mengangkatmu di atas tanah, membuatmu merasa tanpa bobot. Karakter yang melayang bergerak tanpa suara dan mengabaikan semua efek berbasis tanah. Jebakan tidak akan aktif, air tidak akan memadamkan api, tanaman tidak akan terinjak, akar akan meleset, dan lubang akan dilewati. Hati-hati, karena semua hal ini dapat berlaku begitu levitasi berakhir! Jumlah giliran levitasi yang tersisa: %s.
actors.buffs.levitation.name=melayang
actors.buffs.lifelink.desc=Kekuatan hidup karakter ini terhubung dengan karakter lain di dekatnya. Setiap kerusakan yang diterima akan dibagi di antara mereka.\n\nSetiap kali karakter ini menerima kerusakan, setengahnya akan diberikan kepada target tautan hidup.\n\nGiliran tautan hidup yang tersisa: %s.
actors.buffs.lifelink.name=hubungan kehidupan
actors.buffs.lifelink.ondeath=Kerusakan yang terkait dengan kehidupan itu membunuhmu...
actors.buffs.light.desc=Bahkan di Ruang Bawah Tanah Tergelap sekalipun, cahaya yang stabil di sisimu selalu menenangkan. Cahaya membantu menahan kegelapan, memungkinkanmu untuk melihat jarak yang cukup jauh meskipun lingkungannya gelap. Jumlah putaran penerangan yang tersisa: %s.
actors.buffs.light.name=diterangi
actors.buffs.lockedfloor.desc=Lantai saat ini terkunci, dan Anda tidak dapat meninggalkannya!\n\nSaat lantai terkunci, Anda tidak akan merasa lapar atau menerima kerusakan akibat kelaparan. Selain itu, jika Anda tidak berusaha mengalahkan bos lantai ini, efek regenerasi pasif juga akan berhenti.\n\nSelain itu, jika Anda dihidupkan kembali oleh ankh yang tidak diberkati saat lantai terkunci, maka lantai akan direset.\n\nBunuh bos lantai ini untuk memecahkan kuncinya.
actors.buffs.lockedfloor.name=lantai terkunci
actors.buffs.lostinventory.desc=Inventaris Anda hilang di suatu tempat di dalam ruang bawah tanah! Anda tidak akan dapat mengambil atau menggunakan sebagian besar item sampai Anda menemukannya kembali.
actors.buffs.lostinventory.name=inventaris yang hilang
actors.buffs.magicalsight.desc=Entah bagaimana Anda dapat melihat dengan pikiran Anda, bukan dengan mata Anda.\n\nSaat penglihatan magis aktif, Anda akan dapat melihat menembus semua medan dalam radius 12 ubin.\n\nSisa giliran penglihatan magis: %s.
actors.buffs.magicalsight.name=pemandangan magis
actors.buffs.magicalsleep.desc=Karakter ini telah jatuh ke dalam tidur magis yang dalam yang tidak akan mereka bangunkan secara alami. Tidur magis mirip dengan tidur biasa, kecuali bahwa hanya kerusakan yang akan menyebabkan target bangun. Bagi sang pahlawan dan sekutunya, tidur magis memiliki beberapa sifat pemulihan, memungkinkan mereka untuk pulih dengan cepat saat beristirahat.
actors.buffs.magicalsleep.fallasleep=Anda pun terlelap dalam tidur magis yang mendalam.
actors.buffs.magicalsleep.name=tidur ajaib
actors.buffs.magicalsleep.toohealthy=Kamu terlalu sehat, dan tahan keinginan untuk tidur.
actors.buffs.magicalsleep.wakeup=Anda bangun dengan perasaan segar dan sehat.
actors.buffs.magicimmune.desc=Semua efek magis telah kehilangan pengaruhnya padamu, kamu benar-benar kebal terhadapnya.\n\nSelama kebal sihir, semua efek magis yang berbahaya dan bermanfaat tidak akan berlaku padamu, termasuk kutukan, mantra, tongkat sihir, gulungan, cincin, artefak, dll. Kemampuan baju besi heroik cukup kuat untuk berfungsi terlepas dari efek ini.\n\nSisa giliran kekebalan sihir: %s.
actors.buffs.magicimmune.name=kebal terhadap sihir
actors.buffs.mindvision.desc=Entah bagaimana, Anda dapat melihat semua makhluk di lantai ini melalui pikiran Anda. Ini perasaan yang aneh. Semua karakter di lantai ini terlihat oleh Anda selama Anda memiliki penglihatan pikiran. Melihat makhluk melalui penglihatan pikiran dianggap sebagai makhluk yang terlihat atau berada di dekat Anda untuk keperluan banyak efek magis. Jumlah giliran penglihatan pikiran yang tersisa: Jumlah giliran penglihatan pikiran yang tersisa: Jumlah giliran penglihatan pikiran yang tersisa.
actors.buffs.mindvision.name=visi pikiran
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum=membangun momentum
actors.buffs.momentum.momentum_desc=Saat bergerak, Freerunner membangun momentum, yang dapat ia gunakan untuk memulai freerunning. Setiap muatan momentum memberikan dua putaran freerunning, dan Freerunner dapat mengumpulkan hingga 10 muatan. Momentum akan cepat hilang saat Freerunner berhenti bergerak. Muatan momentum saat ini: %d.
actors.buffs.momentum.resting=pulih
actors.buffs.momentum.resting_desc=Saat bergerak, Freerunner membangun momentum, yang dapat ia gunakan untuk memulai freerunning.\n\nFreerunner membutuhkan waktu untuk memulihkan staminanya sebelum membangun momentum lagi.\n\nGiliran tersisa: %d.
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.running_desc=Saat bergerak, Freerunner membangun momentum, yang dapat ia gunakan untuk memulai freerunning. Saat melakukan freerunning, Freerunner bergerak dengan kecepatan ganda dan mendapatkan bonus penghindaran berdasarkan levelnya. Giliran tersisa: Giliran 0.
actors.buffs.monkenergy$monkability$dash.desc=Kemampuan melesat cepat hingga 4 petak. Kemampuan ini dapat melewati rintangan, tetapi tidak dapat menembus musuh atau medan padat.
actors.buffs.monkenergy$monkability$dash.empower_desc=Lari cepat hingga _8 petak_ jauhnya. Kemampuan ini dapat melewati rintangan, tetapi tidak dapat menembus musuh atau medan padat.
actors.buffs.monkenergy$monkability$dash.name=garis pendek
actors.buffs.monkenergy$monkability$dash.prompt=Pilih Lokasi
actors.buffs.monkenergy$monkability$dragonkick.desc=Tendangan dahsyat yang memberikan kerusakan sebesar %1$d-%2$d dan mengabaikan armor. Tendangan ini mendorong target menjauh dan melumpuhkannya untuk setiap petak yang dilaluinya.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Tendangan dahsyat yang memberikan kerusakan sebesar _%1$d-%2$d_ dan mengabaikan armor. Tendangan ini menjauhkan _semua target yang berdekatan_ dan melumpuhkan mereka untuk setiap petak yang mereka tempuh.
actors.buffs.monkenergy$monkability$dragonkick.name=tendangan naga
actors.buffs.monkenergy$monkability$flurry.desc=Dua serangan instan yang memberikan kerusakan sebesar %1$d-%2$d dan mengabaikan armor. Kemampuan ini tidak dapat digunakan berulang kali.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dua serangan instan yang memberikan kerusakan sebesar %1$d-%2$d, mengabaikan armor, dan menggunakan mantra senjata Anda. Kemampuan ini tidak dapat digunakan berulang kali.
actors.buffs.monkenergy$monkability$flurry.name=rentetan pukulan
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Sang Biksu memfokuskan perhatiannya pada lingkungan sekitar, mengantisipasi serangan berikutnya yang ditujukan kepadanya. Dengan fokus tersebut, ia dijamin dapat menangkis serangan yang datang selanjutnya.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=terfokus
actors.buffs.monkenergy$monkability$focus.desc=Sang Biksu mengambil giliran untuk berkonsentrasi, membiarkannya menangkis serangan berikutnya yang dilancarkan kepadanya.
actors.buffs.monkenergy$monkability$focus.empower_desc=Sang Biksu langsung berkonsentrasi, sehingga ia dapat menangkis serangan berikutnya yang dilancarkan kepadanya.
actors.buffs.monkenergy$monkability$focus.name=fokus
actors.buffs.monkenergy$monkability$meditate.desc=Sang Biksu memfokuskan energi ke tubuhnya selama 5 giliran. Ini menghilangkan sebagian besar efek negatif dan memberinya 8 giliran untuk mengisi ulang tongkat sihir dan artefak.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Sang Biksu memfokuskan energi ke tubuhnya selama 5 giliran. Ini menghilangkan sebagian besar efek negatif dan memberinya 8 giliran pengisian ulang tongkat sihir dan artefak. _Dia juga mendapatkan 80% ketahanan terhadap kerusakan saat bermeditasi, dan perlahan memulihkan 20% dari HP-nya yang hilang._
actors.buffs.monkenergy$monkability$meditate.name=merenungkan
actors.buffs.monkenergy.action=Kemampuan Biksu
actors.buffs.monkenergy.desc=Saat mengalahkan musuh, Biksu mendapatkan energi yang dapat digunakannya untuk berbagai kemampuan. Sebagian besar musuh memberikan 1 energi saat dikalahkan, dan Biksu tidak kehilangan energi seiring waktu. Energi saat ini: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Sang Biksu baru saja menggunakan suatu kemampuan, dan harus menunggu sebelum menggunakan kemampuan lain.\n\nWaktu pendinginan saat ini: %d giliran.
actors.buffs.monkenergy.name=energi
actors.buffs.ooze.desc=Asam lengket ini menempel pada daging, perlahan-lahan melarutkannya.\n\nCairan lengket akan menyebabkan kerusakan yang konsisten dari waktu ke waktu, tetapi dapat segera dibersihkan dengan air.\n\nJumlah putaran cairan lengket yang tersisa: %s.
actors.buffs.ooze.heromsg=Cairan korosif mengikis dagingmu. Bersihkanlah!
actors.buffs.ooze.name=cairan korosif
actors.buffs.ooze.ondeath=Kau meleleh...
actors.buffs.ooze.rankings_desc=Larut
actors.buffs.paralysis.desc=Seringkali hal terburuk yang bisa dilakukan adalah tidak melakukan apa pun sama sekali. \n\nKelumpuhan sepenuhnya menghentikan semua tindakan, memaksa target untuk menunggu hingga efeknya hilang. Rasa sakit akibat menerima kerusakan dapat menyebabkan karakter melawan kelumpuhan, membebaskan mereka dari efek tersebut. \n\nGiliran kelumpuhan yang tersisa: %s.
actors.buffs.paralysis.heromsg=Anda lumpuh!
actors.buffs.paralysis.name=lumpuh
actors.buffs.paralysis.out=melawan kelumpuhan
actors.buffs.physicalempower.desc=Seranganmu telah diperkuat, meningkatkan jumlah kerusakan yang dapat kamu berikan saat mengenai musuh dengan serangan fisik. Kerusakan bonus: %1$d.\n Sisa serangan: %2$d.
actors.buffs.physicalempower.name=diberdayakan secara fisik
actors.buffs.pincushion.desc=Senjata lempar yang Anda gunakan terhadap karakter ini saat ini menempel padanya dan akan jatuh ke lantai setelah dia dikalahkan.\n\nItem-item berikut saat ini terpasang:
actors.buffs.pincushion.name=bantalan
actors.buffs.poison.desc=Racun merambat ke seluruh tubuh, perlahan-lahan mengganggu fungsi internalnya.\n\nRacun memberikan kerusakan setiap giliran sebanding dengan berapa lama waktu hingga efeknya berakhir.\n\nJumlah giliran racun yang tersisa: %s.
actors.buffs.poison.heromsg=Anda diracuni!
actors.buffs.poison.name=keracunan
actors.buffs.poison.ondeath=Kamu meninggal karena racun...
actors.buffs.poison.rankings_desc=Meninggal karena Racun
actors.buffs.preparation.action_name=serangan yang disiapkan
actors.buffs.preparation.assassinated=dibunuh
actors.buffs.preparation.desc=Sang pembunuh bayaran sedang menunggu dengan sabar, bersiap untuk menyerang dari balik bayangan.
actors.buffs.preparation.desc_blink=Dia mampu berteleportasi ke arah musuh sebelum menyerang mereka, dengan jarak maksimal _%d._
actors.buffs.preparation.desc_dmg=Serangan berikutnya akan memberikan _%1$d%% kerusakan bonus_, dan akan mengeksekusi musuh biasa di bawah _%2$d%% kesehatan_, atau bos di bawah _%3$d%% kesehatan_.
actors.buffs.preparation.desc_dmg_likely=Serangan tersebut juga kemungkinan besar akan menimbulkan kerusakan yang lebih besar.
actors.buffs.preparation.desc_invis_next=Giliran untuk serangan yang lebih kuat: _%d._
actors.buffs.preparation.desc_invis_time=Giliran yang dihabiskan dalam keadaan tak terlihat: _%d._
actors.buffs.preparation.name=persiapan
actors.buffs.preparation.no_target=Tidak ada yang bisa diserang di sana.
actors.buffs.preparation.out_of_reach=Target itu tidak mungkin tercapai.
actors.buffs.preparation.prompt=Pilih target untuk diserang!\nJarak kedipan maksimum: %d
actors.buffs.prismaticguard.desc=Anda dilindungi oleh gambar prisma yang saat ini tidak aktif. Ketika musuh hadir, gambar prisma akan aktif dan melindungi Anda! Saat tidak aktif, gambar prisma akan pulih secara bertahap dari kerusakan yang dideritanya. HP saat ini: HP0/HP1.
actors.buffs.prismaticguard.desc_many=Gambar prisma ini juga mendapat manfaat dari Kekuatan Banyak. Giliran Tersisa: %d.
actors.buffs.prismaticguard.name=Penjaga prismatik
actors.buffs.recharging.desc=Energi mengalir melalui Anda, meningkatkan kecepatan pengisian tongkat sihir dan staf Anda. Setiap giliran, buff ini akan meningkatkan muatan saat ini sebesar seperempat, di samping pengisian ulang reguler. Jumlah giliran pengisian ulang yang tersisa: %s.
actors.buffs.recharging.name=mengisi ulang
actors.buffs.revealedarea.desc=Sebagian area penjara bawah tanah telah terungkap sementara kepada sang pahlawan. Mereka akan melihatnya di mana pun mereka berada.\n\nGiliran tersisa: %s.
actors.buffs.revealedarea.name=area yang terungkap
actors.buffs.revealedchar.desc=Karakter ini terungkap kepada sang pahlawan, Mereka akan terlihat di mana pun mereka berada.\n\nGiliran tersisa: %s.
actors.buffs.revealedchar.name=terungkap
actors.buffs.roots.desc=Akar (magis atau alami) mencengkeram kaki, memaksa kaki jatuh ke tanah. Akar mengunci target di tempatnya, membuat pergerakan dan sebagian besar kemampuan pergerakan menjadi tidak mungkin. Tindakan lain tidak terpengaruh, termasuk efek teleportasi. Jumlah giliran akar yang tersisa: 0.
actors.buffs.roots.heromsg=Kamu tidak bisa bergerak!
actors.buffs.roots.name=berakar
actors.buffs.scrollempower.desc=Energi dari gulungan yang baru saja dibaca oleh Penyihir itu memperkuat tongkat sihirnya!\n\nPeningkatan Level: +%1$d.\nSisa Serangan: %2$d.
actors.buffs.scrollempower.name=gulir memberdayakan
actors.buffs.shadows.desc=Anda menyatu dengan bayangan di sekitar Anda, memberi Anda kemampuan menghilang dan memperlambat metabolisme Anda. Saat Anda menghilang, musuh tidak dapat menyerang atau mengikuti Anda. Sebagian besar serangan fisik dan efek magis (seperti gulungan dan tongkat sihir) akan segera membatalkan kemampuan menghilang. Selain itu, saat menyatu dengan bayangan, tingkat rasa lapar Anda melambat. Anda akan tetap menyatu dengan bayangan sampai Anda meninggalkan bayangan atau musuh bersentuhan dengan Anda.
actors.buffs.shadows.name=bayangan menyatu
actors.buffs.slow.desc=Sihir perlambatan memengaruhi laju waktu target; bagi mereka, semuanya bergerak sangat cepat. Karakter yang diperlambat melakukan semua tindakan dalam waktu dua kali lipat dari waktu normal. Jumlah giliran perlambatan yang tersisa: %s.
actors.buffs.slow.name=melambat
actors.buffs.snipersmark.action_name_snapshot=foto
actors.buffs.snipersmark.action_name_sniper=tembakan penembak jitu
actors.buffs.snipersmark.action_name_volley=tembakan
actors.buffs.snipersmark.desc=Sniper membidik target yang baru saja diserangnya. Dia mampu melakukan serangan khusus dengan busurnya yang akan bervariasi tergantung pada bagaimana busur tersebut ditingkatkan. Busur yang tidak ditingkatkan akan menembakkan _snapshot_, yang memberikan kerusakan yang lebih rendah tetapi tidak membutuhkan waktu untuk menembak. Busur yang ditingkatkan untuk kecepatan akan menembakkan _volley_ tiga anak panah. Setiap anak panah akan memberikan kerusakan yang lebih rendah, tetapi masih dapat mengaktifkan enchantment. Volley ini membutuhkan 1 giliran untuk menembak. Busur yang ditingkatkan untuk kerusakan akan menembakkan _sniper shot_. Tembakan ini dijamin mengenai target, memberikan kerusakan bonus berdasarkan jarak dari target, dan membutuhkan 2 giliran untuk menembak. Giliran tersisa: 0.
actors.buffs.snipersmark.name=tanda penembak jitu
actors.buffs.soulmark.desc=Penyihir itu telah memanfaatkan jiwa makhluk ini, memungkinkannya untuk menyembuhkan saat makhluk itu menerima kerusakan fisik.\n\nJumlah giliran tanda jiwa yang tersisa: %s.
actors.buffs.soulmark.name=jiwa ditandai
actors.buffs.stamina.desc=Anda memiliki stamina tak terbatas, memungkinkan pergerakan lebih cepat! Saat berada di bawah pengaruh stamina, Anda akan berlari dengan kecepatan +50, tetapi akan melakukan semua tindakan lain dengan kecepatan normal. Jumlah giliran stamina yang tersisa: 1.
actors.buffs.stamina.name=daya tahan
actors.buffs.terror.desc=Teror adalah sihir manipulatif yang memaksa targetnya ke dalam kepanikan yang tak terkendali. Karakter yang ketakutan dipaksa untuk lari dari lawannya, mencoba menempatkan sebanyak mungkin pintu dan dinding di antara mereka. Namun, guncangan rasa sakit akan mengurangi durasi teror. Jumlah giliran teror yang tersisa: %s.
actors.buffs.terror.name=ketakutan
actors.buffs.toxicimbue.desc=Anda dirasuki energi beracun! Saat Anda bergerak, gas beracun akan terus mengepul dari tubuh Anda, merusak musuh Anda. Anda kebal terhadap gas beracun dan racun selama efek berlangsung, serta beberapa giliran setelahnya. Jumlah giliran pengaruh racun yang tersisa: 0.
actors.buffs.toxicimbue.name=mengandung racun
actors.buffs.vertigo.desc=Berjalan lurus bisa jadi sulit ketika seluruh dunia berputar. Saat berada di bawah pengaruh vertigo, karakter yang mencoba bergerak akan bergerak ke arah acak, bukan ke arah yang mereka inginkan. Jumlah giliran vertigo yang tersisa: %s.
actors.buffs.vertigo.name=vertigo
actors.buffs.vulnerable.desc=Sihir kerentanan meningkatkan semua kerusakan fisik yang diterima karakter sebesar 33%%, setelah kerusakan tersebut dikurangi oleh armor.\n\nJilid tersisa: %s.
actors.buffs.vulnerable.heromsg=Kamu merasa rapuh!
actors.buffs.vulnerable.name=rentan
actors.buffs.wandempower.desc=Tongkat sihirmu yang menghasilkan kerusakan telah diperkuat, meningkatkan jumlah kerusakan yang ditimbulkannya untuk beberapa serangan. Kerusakan bonus: %1$d.\n Serangan tersisa: %2$d.
actors.buffs.wandempower.name=tongkat sihir yang diberdayakan
actors.buffs.weakness.desc=Semuanya tiba-tiba terasa jauh lebih berat.\n\nSihir pelemah mengurangi kekuatan fisik karakter, menyebabkan mereka memberikan kerusakan yang berkurang.33%%\n\nGiliran kelemahan yang tersisa: %s.
actors.buffs.weakness.heromsg=Kamu merasa lemah!
actors.buffs.weakness.name=melemah
actors.buffs.wellfed.desc=Anda merasa cukup puas dan kenyang.\n\nSelama sudah kenyang, rasa lapar Anda tidak akan bertambah, dan Anda akan memulihkan sejumlah kesehatan tambahan seiring waktu.\n\nGiliran tersisa: %d.
actors.buffs.wellfed.name=makan dengan baik
actors.char.def_verb=menghindar
actors.char.def_verb_blocked=diblokir
actors.char.defeat=Anda mengalahkan %s.
actors.char.immune=imun
actors.char.invulnerable=kebal
actors.char.kill=%s membunuhmu...
actors.hero.abilities.armorability.cost=Biaya pengisian daya: _%d_
actors.hero.abilities.armorability.no_target=Tidak ada yang bisa ditargetkan di sana!
actors.hero.abilities.armorability.prompt=Pilih lokasi yang ingin ditargetkan
actors.hero.abilities.armorability.self_target=Kamu tidak bisa menargetkan dirimu sendiri!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Energi bercahaya memancar dari tubuh Pendeta. Saat dalam wujud ini, Pendeta mendapatkan jangkauan serangan 2 (dari energi suci yang terpancar dari mereka), dan perisai 10 setiap kali mereka menggunakan muatan buku suci. Mereka juga dapat mengucapkan mantra yang dibuka melalui bakat wujud yang telah ditingkatkan. Perisai yang diberikan oleh wujud yang telah ditingkatkan dan mantranya tidak akan berkurang secara normal, tetapi akan langsung hilang saat wujud yang telah ditingkatkan berakhir. Perisai saat ini: 0. Giliran tersisa: 1.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=bentuk yang naik
actors.hero.abilities.cleric.ascendedform.desc=Pendeta memancarkan energi suci dari dirinya sendiri, mengambil wujud bercahaya yang diperpanjang selama 10 putaran. Saat dalam wujud ini, Pendeta dapat merapal mantra baru, mendapatkan jangkauan serangan 2, perisai 30, dan setiap mantra tambahan yang dirapalnya akan memberikan perisai 10 per muatan buku suci yang digunakan. Perisai dari wujud yang telah mencapai tingkatan lebih tinggi dan mantranya tidak berkurang secara normal, tetapi akan segera hilang setelah wujud tersebut berakhir. Kemampuan ini dapat digunakan kembali untuk memperbarui durasi wujud yang telah mencapai tingkatan lebih tinggi.
actors.hero.abilities.cleric.ascendedform.name=bentuk yang naik
actors.hero.abilities.cleric.ascendedform.short_desc=Sang Pendeta mengambil _Bentuk yang Lebih Tinggi_, memperoleh mantra baru, jangkauan serangan, dan perisai.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Salinan salah satu teman petualangan Pendeta, terbuat dari cahaya padat. Meskipun memiliki bentuk pahlawan lain, ia tidak memiliki kemampuan unik mereka. Sekutu ini akan bertahan selama Kekuatan Banyak diterapkan padanya.\n\nSekutu ini dapat diarahkan tanpa biaya dengan menggunakan kembali kemampuan armor Kekuatan Banyak.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Sekutumu bergerak untuk menyerang!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Sekutumu bergerak ke posisi itu.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Sekutumu bergerak untuk mengikutimu.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Anda dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.
actors.hero.abilities.cleric.powerofmany$lightally.name=sekutu cahaya
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Sekutu ini telah diberdayakan oleh Kekuatan Banyak, memberi mereka +25%% kerusakan yang ditimbulkan dan -25%% kerusakan yang diterima. Mereka juga akan berbagi jangkauan penglihatan mereka dengan Pendeta, dan dapat memperoleh manfaat dari mantra kekuatan banyak.\n\nKekuatan Banyak akan tetap ada ketika sekutu seperti gambar prismatik bersembunyi, tetapi durasinya akan tetap dihitung mundur.\n\nGiliran Tersisa: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=kekuatan banyak orang
actors.hero.abilities.cleric.powerofmany.ally_exists=Anda sudah memiliki sekutu yang berdaya.
actors.hero.abilities.cleric.powerofmany.desc=Pendeta menyalurkan _Kekuatan Banyak_, yang memberdayakan sekutu yang sudah ada atau menciptakan sekutu baru yang diberdayakan selama 100 giliran. Menargetkan ruang kosong akan menciptakan sekutu baru. Saat diberdayakan oleh Kekuatan Banyak, sekutu mana pun memberikan +25% kerusakan, menerima -25% kerusakan, dan berbagi penglihatan mereka dengan Pendeta. Mereka juga mendapatkan 25 perisai saat kemampuan ini digunakan. Pendeta juga mendapatkan tiga mantra baru yang hanya dapat diucapkan dengan sekutu yang diberdayakan. Kekuatan Banyak tidak akan berakhir saat salah satu mantra ini aktif.
actors.hero.abilities.cleric.powerofmany.name=kekuatan banyak orang
actors.hero.abilities.cleric.powerofmany.no_vision=Anda tidak bisa membidik lokasi yang tidak bisa Anda lihat.
actors.hero.abilities.cleric.powerofmany.only_allies=Anda hanya dapat memberdayakan sekutu.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Arahkan cahayamu, sekutu
actors.hero.abilities.cleric.powerofmany.prompt_default=Pilih sekutu atau lokasi
actors.hero.abilities.cleric.powerofmany.short_desc=Sang Pendeta menyalurkan _Kekuatan Banyak_, memberdayakan sekutu yang sudah ada atau menciptakan sekutu baru.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Tetapkan ke bentuk tubuh
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Tetapkan ke bentuk pikiran
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Tetapkan ke bentuk roh
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Pilih efek yang ingin diintegrasikan ke dalam Trinity. Informasi tambahan akan ditampilkan sebelum konfirmasi.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Bentuk Tubuh: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Bentuk Pikiran: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=Bentuk Roh: %s.
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Pilih bentuk Trinitas mana yang ingin digunakan. Efek dari berbagai bentuk dapat aktif secara bersamaan.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity akan menerapkan efek alkimia jarak jauh artefak ini, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity akan menerapkan efek regenerasi kesehatan pasif artefak ini pada _+%1$d_ selama 20 giliran, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.cost=Biaya pengisian kemampuan ini bervariasi, tetapi paling sering adalah _%d._
actors.hero.abilities.cleric.trinity.desc=Pendeta memperoleh _Trinitas_ kemampuan baju besi, yang dapat diberikan pada berbagai efek item dengan menggunakan tiga mantra baru. Masing-masing mantra ini berfokus pada meniru efek dari berbagai jenis peralatan yang telah diidentifikasi oleh Pendeta selama permainan ini: bentuk tubuh (senjata dan baju besi), bentuk pikiran (tongkat sihir dan senjata lempar), dan bentuk roh (cincin dan artefak). Setiap bentuk Trinitas dapat diisi dengan satu efek pada satu waktu, dan Pendeta memilih mana yang akan diaktifkan saat menggunakan Trinitas. Trinitas tidak akan menduplikasi efek dari sesuatu yang sudah Anda kenakan.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity akan menggunakan efek artefak ini untuk memanggil hantu ramah yang rusak dengan HP sebesar _+%1$d_ hantu, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity akan menerapkan efek ini selama _%1$d giliran_ dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity akan menerapkan efek pemanggilan berantai artefak ini dengan jangkauan _+%1$d_, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity akan menerapkan efek ngemil artefak ini, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity akan menerapkan efek perampokan musuh dari artefak ini pada _+%1$d_, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.name=Trinitas
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity tidak dapat menduplikasi efek yang sudah Anda pasang!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity saat ini tidak memiliki efek yang ditetapkan untuk bentuk apa pun, gunakan salah satu mantranya!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity akan menerapkan efek _dahsyat_ ini selama _%1$d giliran_ dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.ring_use=Trinity akan menerapkan efek cincin ini pada _+%1$d_ selama 20 putaran, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity akan menerapkan efek dasar artefak ini dengan benih berbahaya acak, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.short_desc=Pendeta memperoleh _Trinitas_ kemampuan, yang meniru peralatan yang pernah mereka lihat dan dapat diberikan dengan menggunakan mantra baru.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity akan menerapkan efek sisipan artefak ini, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity akan menerapkan efek scry artefak ini pada _+%1$d_, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity akan melemparkan senjata ini ke _+%1$d_ dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity akan menerapkan efek pembekuan waktu artefak ini dengan durasi _%1$d_ giliran, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity akan menerapkan efek gulir acak artefak ini dengan peluang _%1$d/10_ untuk menawarkan versi eksotis tanpa biaya tambahan, dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity akan menyetrum tongkat _multi-charge_ ini pada _+%1$d_ dengan biaya _%2$s muatan._
actors.hero.abilities.cleric.trinity.wand_use=Trinity akan menyetrum tongkat ini di _+%1$d_ dengan biaya _%2$s muatan._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Karakter ini berpartisipasi dalam duel. Mereka, dan sekutu atau antek mereka, diizinkan untuk bertindak normal sementara yang lain dibekukan.\n\nDuel akan berlangsung selama waktu yang ditentukan, sampai salah satu peserta mati, atau sampai para peserta bergerak lebih dari 5 petak menjauh satu sama lain.\n\nGiliran tersisa: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=peserta duel
actors.hero.abilities.duelist.challenge.ally_target=Anda hanya bisa menantang musuh.
actors.hero.abilities.duelist.challenge.already_dueling=Anda hanya dapat mengikuti satu duel dalam satu waktu.
actors.hero.abilities.duelist.challenge.desc=Sang Duelis menantang musuh terdekat untuk berduel. Musuh tersebut dipaksa untuk melawannya sementara semua musuh lainnya untuk sementara waktu dibekukan.\n\nTarget harus dapat dijangkau dan berada dalam jarak 5 petak dari Sang Duelis. Duel berlangsung hingga 10 giliran berlalu, musuh mati, atau Sang Duelis berada lebih dari 5 petak jauhnya dari musuh.\n\nMusuh yang dibekukan kebal. Sekutu Sang Duelis tidak dibekukan oleh kemampuan ini, tetapi jika bos yang ditargetkan, anak buahnya juga tidak akan dibekukan.
actors.hero.abilities.duelist.challenge.distant_target=Musuh itu terlalu jauh untuk dihadapi.
actors.hero.abilities.duelist.challenge.name=tantangan
actors.hero.abilities.duelist.challenge.prompt=Pilih musuh untuk ditantang
actors.hero.abilities.duelist.challenge.short_desc=Sang Duelis menantang musuh terdekat untuk berduel, membekukan sementara semua musuh lainnya.
actors.hero.abilities.duelist.challenge.unreachable_target=Anda harus mampu mencapai target Anda.
actors.hero.abilities.duelist.elementalstrike.desc=Sang Duelis menyerang musuh atau lokasi, melakukan serangan biasa yang dijamin mengenai sasaran dan menyebarkan efek magis yang menjangkau hingga 4 petak dalam kerucut 65 derajat. Efek magis ini bervariasi tergantung pada mantra pada senjata utama Sang Duelis.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Serangan elemen tanpa mantra akan melepaskan semburan sihir kecil, memberikan 6-12 kerusakan pada semua musuh dalam jangkauan.
actors.hero.abilities.duelist.elementalstrike.name=serangan elemen
actors.hero.abilities.duelist.elementalstrike.short_desc=Sang Duelis melakukan _Serangan Elemen_, menyebarkan efek dalam area efek berbentuk kerucut berdasarkan pesona senjatanya.
actors.hero.abilities.duelist.feint.bad_location=Anda tidak bisa pindah ke lokasi itu.
actors.hero.abilities.duelist.feint.desc=Duelis berpura-pura menyerang sambil melesat ke petak yang berdekatan, meninggalkan bayangan dirinya sesaat. Musuh yang menyerang Duelis akan menyerang bayangannya sebagai gantinya. Musuh yang menyerang bayangan tersebut menjadi bingung, yang membatalkan tindakan mereka selanjutnya dan membuat mereka rentan terhadap serangan mendadak.
actors.hero.abilities.duelist.feint.name=membohong
actors.hero.abilities.duelist.feint.prompt=Pilih lokasi untuk bergegas ke sana.
actors.hero.abilities.duelist.feint.short_desc=Duelis melakukan _Feint_, berpura-pura menyerang sambil melesat ke petak yang berdekatan. Musuh akan menyerang bayangannya, membuat mereka rentan terhadap serangan balik.
actors.hero.abilities.duelist.feint.too_far=Lokasi itu tidak berdekatan dengan Anda.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Sang Pemburu mendapatkan peningkatan kekuatan sesaat, meningkatkan kecepatan gerak dan kecepatan serangannya dengan busurnya.\n\nGiliran tersisa: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=kekuatan alam
actors.hero.abilities.huntress.naturespower.desc=Sang Pemburu untuk sementara waktu memperkuat dirinya dan busurnya dengan kekuatan alam! Ini berlangsung selama 8 putaran. Selama waktu ini, Sang Pemburu bergerak dengan kecepatan 2x lipat, dan menyerang 33% lebih cepat dengan busurnya. Efek bonus busur tidak akan aktif jika Sang Penembak Jitu sedang menggunakan serangan spesialnya.
actors.hero.abilities.huntress.naturespower.name=kekuatan alam
actors.hero.abilities.huntress.naturespower.short_desc=Sang Pemburu wanita menggunakan _Kekuatan Alam_, meningkatkan kecepatan geraknya dan laju tembakan busurnya untuk waktu singkat.
actors.hero.abilities.huntress.spectralblades.desc=Sang Pemburu melemparkan pedang spektral ke arah musuh, yang berfungsi seperti serangan jarak jauh dari senjata jarak dekatnya. Semua efek normal dari senjata jarak dekat akan aktif, termasuk mantra.
actors.hero.abilities.huntress.spectralblades.name=bilah spektral
actors.hero.abilities.huntress.spectralblades.short_desc=Sang Pemburu melemparkan _Spectral Blades_ ke arah target, menimbulkan kerusakan tergantung pada senjata jarak dekat yang sedang ia gunakan.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Seekor elang ajaib, dipanggil oleh Sang Pemburu. Ia memancarkan cahaya biru eterik yang terang, kepalanya terus bergerak-gerak saat mengamati area sekitarnya. Meskipun bukan petarung yang hebat, kecepatan dan penglihatannya membuatnya sangat baik untuk melakukan pengintaian dan mengalihkan perhatian musuh.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Jumlah kesempatan menghindar yang dijamin tersisa: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Giliran tersisa: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Elangmu bergerak untuk menyerang!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Elang Anda bergerak ke posisi itu.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Burung elangmu bergerak mengikutimu.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Anda dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.
actors.hero.abilities.huntress.spirithawk$hawkally.name=elang roh
actors.hero.abilities.huntress.spirithawk.desc=Sang Pemburu memanggil familiar elang roh, yang dapat diarahkan dengan menggunakan kemampuan tersebut lagi saat dipanggil. Elang tersebut bertahan selama 100 giliran, mengarahkan elang tidak membutuhkan biaya apa pun. Elang tersebut memiliki kesehatan dan kekuatan menyerang minimal, tetapi cepat, lincah, dan akurat. Ia selalu berbagi seluruh bidang pandangnya dengan Sang Pemburu. Ia kebal terhadap semua efek yang terbatas pada area tertentu, seperti api dan gas beracun. Ia tidak akan menyerang kecuali diarahkan secara khusus.
actors.hero.abilities.huntress.spirithawk.name=elang roh
actors.hero.abilities.huntress.spirithawk.no_space=Tidak ada tempat parkir kosong di dekat Anda.
actors.hero.abilities.huntress.spirithawk.short_desc=Sang Pemburu memanggil familiar _Spirit Hawk_, yang dapat membantunya mengintai lokasi dan mengalihkan perhatian musuh.
actors.hero.abilities.mage.elementalblast.desc=Penyihir memancarkan ledakan sihir yang meliputi area melingkar hingga 4 petak jauhnya dan memberikan kerusakan hingga 15-25. Efek spesifik dari ledakan elemen akan bervariasi tergantung pada tongkat sihir yang terpasang pada staf Penyihir.
actors.hero.abilities.mage.elementalblast.generic_desc=Efek dari ledakan elemen akan mirip dengan efek tongkat sihir saat diarahkan ke musuh atau sekutu.
actors.hero.abilities.mage.elementalblast.name=ledakan elemen
actors.hero.abilities.mage.elementalblast.no_staff=Anda tidak dapat menggunakan kemampuan ini tanpa staf Anda.
actors.hero.abilities.mage.elementalblast.short_desc=Penyihir itu memancarkan Ledakan Elemen dari tongkatnya, meliputi area luas di sekitarnya dengan efek yang bervariasi tergantung pada tongkat sihir yang ada di dalam tongkatnya.
actors.hero.abilities.mage.warpbeacon.depths=Kamu tidak bisa berpindah antar kedalaman!
actors.hero.abilities.mage.warpbeacon.desc=Penyihir menempatkan suar, yang kemudian dapat dituju dengan teleportasi sesuka hati. Menempatkan suar membutuhkan 1 giliran, tetapi teleportasi ke sana berlangsung seketika. Penyihir tidak dapat melakukan teleportasi antar lantai secara default, atau menggunakan suar untuk mencapai tempat-tempat yang tidak dapat diakses seperti ruangan terkunci. Penyihir dapat berteleportasi ke arah musuh, yang akan mendorong mereka ke samping.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Anda tidak bisa memasang suar di sana!
actors.hero.abilities.mage.warpbeacon.locked_floor=Anda tidak bisa meninggalkan lantai yang terkunci!
actors.hero.abilities.mage.warpbeacon.name=suar warp
actors.hero.abilities.mage.warpbeacon.short_desc=Sang Penyihir menempatkan sebuah _Warping Beacon_ di lokasinya saat ini, yang dapat ia gunakan untuk berteleportasi kembali secara instan.
actors.hero.abilities.mage.warpbeacon.too_far=Lokasi itu terlalu jauh!
actors.hero.abilities.mage.warpbeacon.window_cancel=membatalkan
actors.hero.abilities.mage.warpbeacon.window_clear=suar yang jelas
actors.hero.abilities.mage.warpbeacon.window_desc=Beacon Anda saat ini ditempatkan di lantai %d.
actors.hero.abilities.mage.warpbeacon.window_tele=berteleportasi ke suar
actors.hero.abilities.mage.wildmagic.desc=Penyihir melepaskan kekuatan tongkat sihirnya, menembakkannya secara acak hingga 4 kali dalam satu giliran. Tongkat sihir Penyihir tidak termasuk dalam efek ini. Setiap tongkat sihir juga ditingkatkan levelnya sebesar 2, hingga +3. Kemampuan ini menggunakan setengah muatan tongkat sihir untuk setiap tembakan, dan tidak ada satu tongkat sihir pun yang dapat ditembakkan lebih dari 2 kali.
actors.hero.abilities.mage.wildmagic.name=sihir liar
actors.hero.abilities.mage.wildmagic.no_wands=Kamu tidak punya tongkat sihir untuk menyetrum!
actors.hero.abilities.mage.wildmagic.short_desc=Penyihir itu melepaskan _Sihir Liar_ yang terkandung dalam tongkat sihirnya, menembakkannya secara acak beberapa kali ke target yang dipilih dalam satu giliran.
actors.hero.abilities.ratmogrify$transmograt.desc=Musuh ini telah berubah menjadi tikus. Sebuah peningkatan besar, menurutku! - Raja Tikus
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Dibunuh oleh: musuh yang telah berubah menjadi tikus
actors.hero.abilities.ratmogrify.cant_transform=Kamu tidak bisa mengubahnya menjadi tikus!
actors.hero.abilities.ratmogrify.desc=Sang pahlawan mengubah musuh menjadi tikus selama 6 giliran! Bos, sekutu, dan tikus tidak dapat diubah menjadi tikus. Musuh yang telah diubah menjadi tikus mempertahankan statistik aslinya, tetapi tidak memiliki kemampuan apa pun.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=Sang pahlawan _Ratmogrifies_ (mengubah musuh menjadi tikus)! Ini untuk sementara mengubah mereka menjadi tikus tanpa kemampuan apa pun.
actors.hero.abilities.ratmogrify.too_strong=Musuh itu terlalu kuat untuk diubah menjadi tikus!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Musuh ini telah ditandai, menyebabkan mereka menerima 25%% kerusakan bonus, tetapi juga membuat mereka tidak dapat mati sampai tanda tersebut berakhir.\n\n Giliran tersisa: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=ditandai untuk mati
actors.hero.abilities.rogue.deathmark.ally_target=Anda hanya bisa menandai musuh.
actors.hero.abilities.rogue.deathmark.desc=Sang Penjahat (Rogue) memberi tanda pada musuh yang dipilih, menyebabkan mereka menerima 25% kerusakan ekstra. Tanda tersebut diterapkan secara instan dan berlangsung selama 5 giliran. Musuh yang ditandai menerima kerusakan bonus tetapi tidak dapat mati sampai tanda tersebut berakhir. Jika musuh memiliki 0 HP saat tanda berakhir, mereka akan langsung mati.
actors.hero.abilities.rogue.deathmark.name=tanda kematian
actors.hero.abilities.rogue.deathmark.short_desc=Sang Penjahat (Rogue) memberikan Tanda Kematian (Death Mark) pada musuh yang dipilih. Musuh yang ditandai menerima kerusakan tambahan, tetapi tidak dapat mati sampai tanda tersebut hilang.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Sebuah tiruan dari Rogue, terbuat dari kegelapan yang pekat. Ia berdiri diam, dengan mata kosong dan gumpalan kecil kegelapan yang naik darinya seperti uap.\n\n Klon ini bukanlah tiruan sempurna dari Rogue, tetapi tetap merupakan petarung yang cukup baik, dan dapat memanfaatkan perlengkapan Rogue dengan bakat yang tepat.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Klonmu bergerak untuk menyerang!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Klon Anda bergerak ke posisi itu.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Klon Anda bergerak untuk mengikuti Anda.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Anda dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.
actors.hero.abilities.rogue.shadowclone$shadowally.name=penjahat bayangan
actors.hero.abilities.rogue.shadowclone.desc=Sang Rogue memanggil tiruan bayangan dirinya sendiri, yang dapat diarahkan untuk membantunya dalam pertempuran. Mengarahkan klon bayangan tidak memerlukan biaya apa pun. Klon tersebut memiliki 80 HP, tanpa armor, dan memberikan kerusakan 10-20. Semua sifat ini dapat ditingkatkan dengan talenta, sehingga klon tersebut mendapatkan manfaat dari senjata dan armor yang dimiliki sang pahlawan.
actors.hero.abilities.rogue.shadowclone.name=klon bayangan
actors.hero.abilities.rogue.shadowclone.short_desc=Sang Rogue memanggil _Klon Bayangan_, yang dapat diarahkan untuk membantunya dalam pertempuran.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Entah bagaimana, musuh dengan mudah diyakinkan bahwa umpan kayu ini adalah Rogue yang asli!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Anda dapat menemukan karakter ini dengan kemampuan armor pahlawan tertentu.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=umpan kayu
actors.hero.abilities.rogue.smokebomb.desc=Sang Penjahat melemparkan bom asap dan berteleportasi hingga 6 petak jauhnya. Dia dapat berteleportasi menembus rintangan dan musuh, tetapi tidak menembus medan padat seperti dinding. Musuh yang berdekatan dengan posisi lama Sang Penjahat akan dibutakan selama 5 giliran.
actors.hero.abilities.rogue.smokebomb.fov=Anda hanya dapat melompat ke lokasi kosong dalam bidang pandang Anda.
actors.hero.abilities.rogue.smokebomb.name=bom asap
actors.hero.abilities.rogue.smokebomb.prompt=Pilih lokasi tujuan Anda
actors.hero.abilities.rogue.smokebomb.short_desc=Si Rogue melemparkan Bom Asap sambil berteleportasi. Dia membutakan musuh di dekat lokasi lamanya.
actors.hero.abilities.warrior.endure$enduretracker.desc=Prajurit sekarang memberikan kerusakan bonus berdasarkan kerusakan yang dia terima. Kerusakan Bonus: %1$d\n Sisa Serangan: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=ketahanan
actors.hero.abilities.warrior.endure.desc=Prajurit bertahan selama 3 giliran, menerima setengah kerusakan dari semua sumber. Pengurangan ini diterapkan sebelum efek penahan kerusakan seperti armor. Setelah bertahan, serangan berikutnya dari prajurit dalam 10 giliran mendapatkan kerusakan bonus. Kerusakan bonus ini sama dengan setengah dari semua kerusakan yang ditimbulkan padanya saat bertahan, sebelum efek pengurangan kerusakan apa pun! Jika Prajurit memiliki kombo, menggunakan kemampuan ini meningkatkan waktu tersisanya sebanyak 3 giliran.
actors.hero.abilities.warrior.endure.name=menderita
actors.hero.abilities.warrior.endure.short_desc=Sang Prajurit Bertahan, melewati beberapa giliran tetapi mendapatkan ketahanan kerusakan yang tinggi. Kemudian dia memberikan kerusakan bonus berdasarkan apa yang telah dia tahan.
actors.hero.abilities.warrior.heroicleap.desc=Sang Prajurit melompat menuju lokasi yang dituju, melewati musuh atau rintangan apa pun yang menghalangi jalannya. Namun, ia tidak dapat melompati tembok atau medan padat lainnya.
actors.hero.abilities.warrior.heroicleap.name=lompatan heroik
actors.hero.abilities.warrior.heroicleap.prompt=Pilih arah untuk melompat
actors.hero.abilities.warrior.heroicleap.short_desc=Sang Prajurit melakukan Lompatan Heroik menuju lokasi yang ditargetkan, melayang di atas musuh dan rintangan.
actors.hero.abilities.warrior.shockwave.desc=Sang Prajurit membanting tanah, menghasilkan gelombang kejut yang menjalar hingga 5 petak dalam kerucut 60 derajat. Musuh yang terkena gelombang kejut ini akan lumpuh selama 5 giliran. Mereka juga menerima 5-10 kerusakan, ditambah 1-2 kerusakan tambahan untuk setiap poin kekuatan yang dimiliki Prajurit di atas 10.
actors.hero.abilities.warrior.shockwave.name=gelombang kejut
actors.hero.abilities.warrior.shockwave.short_desc=Sang Prajurit melepaskan Gelombang Kejut dalam area efek berbentuk kerucut dengan membanting tanah. Musuh yang terkena gelombang kejut akan mengalami kerusakan dan lumpuh.
actors.hero.hero.key_distracted=Anda tidak bisa membuka kuncinya, Anda harus terus mencoba.
actors.hero.hero.leave=Kamu belum bisa pergi, sisa ruang bawah tanah menanti di bawah!
actors.hero.hero.level_cap=Anda tidak bisa menjadi lebih kuat, tetapi pengalaman Anda memberi Anda lonjakan kekuatan!
actors.hero.hero.level_up=Naik level!
actors.hero.hero.locked_chest=Peti ini terkunci dan Anda tidak memiliki kunci yang cocok.
actors.hero.hero.locked_door=Anda tidak memiliki kunci yang cocok.
actors.hero.hero.name=Anda
actors.hero.hero.new_level=Naik level! +Akurasi, +Penghindaran, +5 HP!
actors.hero.hero.new_talent=+1 Poin Bakat!
actors.hero.hero.noticed_smth=Anda memperhatikan sesuatu.
actors.hero.hero.pain_resist=Rasa sakit itu membantu Anda menahan keinginan untuk tidur.
actors.hero.hero.revive=Ankh memancarkan energi yang memberi kehidupan!
actors.hero.hero.search=mencari
actors.hero.hero.search_distracted=Sulit untuk berkonsentrasi, pencarian itu melelahkan.
actors.hero.hero.unspent=Kamu memiliki poin bakat yang belum terpakai!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Anda tidak dapat membawa: %s.
actors.hero.hero.you_now_have=Anda menerima panggilan dari: %s.
actors.hero.heroclass.cleric=pendeta
actors.hero.heroclass.cleric_desc=Pendeta memulai permainan dengan sebuah kitab suci unik, yang dapat mereka gunakan untuk merapal berbagai mantra. Sebagian besar bakat Pendeta berfokus pada mempelajari atau meningkatkan mantra. Pendeta juga memulai permainan dengan sebuah pentungan, baju besi kain, kantung air, dan kantung beludru. Pendeta secara otomatis mengidentifikasi: Gulungan Identifikasi Ramuan Kemurnian
actors.hero.heroclass.cleric_desc_short=Pendeta adalah pengguna sihir ilahi yang menggunakan kitab suci unik mereka untuk menyalurkan sihir ilahi. Mereka dapat mempelajari dan meningkatkan mantra melalui bakat.
actors.hero.heroclass.cleric_unlock=Untuk membuka karakter Cleric, bersihkan sepenuhnya kutukan pada setiap peralatan yang terkutuk.
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc=Sang Duelis memulai permainan dengan pedang rapier unik dengan kemampuan khusus yang dapat diisi ulang seiring waktu. Setiap senjata dalam permainan memiliki kemampuan khusus yang berbeda yang dapat digunakan oleh Sang Duelis. Sang Duelis juga memulai permainan dengan dua tombak lempar, baju besi kain, kantung air, dan kantung beludru. Sang Duelis secara otomatis mengidentifikasi: Gulungan Identifikasi, Ramuan Kekuatan, Gulungan Citra Cermin.
actors.hero.heroclass.duelist_desc_short=Duelist adalah seorang ahli senjata yang dapat menggunakan senjatanya untuk memicu kemampuan senjata khusus. Kemampuan khusus ini berbeda untuk setiap senjata.
actors.hero.heroclass.duelist_unlock=Untuk membuka Duelist, lengkapi senjata tingkat 2 atau lebih tinggi tanpa penalti kekuatan.
actors.hero.heroclass.huntress=pemburu wanita
actors.hero.heroclass.huntress_desc=Sang Pemburu memulai permainan dengan busur roh unik yang dapat menembakkan panah sihir dalam jumlah tak terbatas. Sang Pemburu dapat melewati rerumputan tinggi tanpa menginjaknya. Sang Pemburu juga memulai permainan dengan sarung tangan bertabur, baju besi kain, kantung air, dan kantung beludru. Sang Pemburu secara otomatis mengidentifikasi: Gulungan Identifikasi, Ramuan Penglihatan Pikiran, Gulungan Lagu Pengantar Tidur.
actors.hero.heroclass.huntress_desc_short=Sang Pemburu adalah ahli senjata lempar dan memiliki busur ajaib dengan anak panah tak terbatas. Dia juga mampu melewati rerumputan tinggi tanpa menginjaknya.
actors.hero.heroclass.huntress_unlock=Untuk membuka karakter Huntress, pukul musuh dengan senjata lempar sebanyak 10 kali dalam satu permainan.
actors.hero.heroclass.mage=penyihir
actors.hero.heroclass.mage_desc=Sang Penyihir memulai dengan tongkat unik, yang mengisi daya jauh lebih cepat daripada tongkat sihir biasa dan memiliki 1 muatan lebih banyak. Tongkat tersebut dapat diisi dengan tongkat sihir apa pun yang ditemukan Penyihir di ruang bawah tanah. Penyihir juga memulai dengan tongkat sihir panah ajaib yang diisi ke dalam tongkatnya, baju besi kain, kantung air, dan kantung beludru. Penyihir secara otomatis mengidentifikasi: Gulungan Identifikasi Ramuan Api Cair
actors.hero.heroclass.mage_desc_short=Penyihir adalah ahli ilmu gaib dan membawa tongkat sihir yang lebih kuat daripada tongkat biasa. Tongkat itu dapat diisi dengan kekuatan tongkat sihir apa pun yang ditemukan Penyihir.
actors.hero.heroclass.mage_unlock=Untuk membuka karakter Penyihir, gunakan gulungan peningkatan untuk membuat item lebih kuat.
actors.hero.heroclass.rogue=penipu
actors.hero.heroclass.rogue_desc=Sang Pencuri memulai permainan dengan Jubah Bayangan yang unik, yang dapat ia gunakan untuk menjadi tak terlihat sesuka hati. Sang Pencuri dapat mendeteksi rahasia dan jebakan dari jarak yang lebih jauh. Sang Pencuri juga memulai permainan dengan belati, tiga pisau lempar, baju besi kain, kantung air, dan kantung beludru. Sang Pencuri secara otomatis mengidentifikasi: Gulungan Identifikasi, Ramuan Tak Terlihat, Gulungan Pemetaan Sihir.
actors.hero.heroclass.rogue_desc_short=Sang Rogue dapat menghindari musuh dan menyerang dari balik wujud tak terlihat menggunakan _jubah bayangannya_. Dia juga _mendeteksi rahasia dan jebakan_ dari jarak yang lebih jauh.
actors.hero.heroclass.rogue_unlock=Untuk membuka karakter Rogue, lakukan 10 serangan mendadak dalam satu permainan.
actors.hero.heroclass.warrior=prajurit
actors.hero.heroclass.warrior_desc=Sang Prajurit memulai permainan dengan segel rusak unik yang memberinya perlindungan tambahan saat kesehatannya di bawah setengah. Segel tersebut dapat dipindahkan antar baju besi, dan dapat mentransfer satu peningkatan bersamanya. Sang Prajurit juga memulai permainan dengan pedang pendek usang, tiga batu lempar, baju besi kain, kantung air, dan kantung beludru. Sang Prajurit secara otomatis mengidentifikasi: Gulungan Identifikasi, Ramuan Penyembuhan, dan Gulungan Amarah.
actors.hero.heroclass.warrior_desc_short=Sang Prajurit mampu menahan kerusakan tambahan dengan perisai yang diberikan oleh _segel yang rusak._ Segel tersebut dapat dipindahkan antar baju zirah dan _mentransfer satu peningkatan._
actors.hero.heroclass.warrior_unlock=Prajurit tersebut terbuka secara otomatis.
actors.hero.herosubclass.assassin=pembunuh
actors.hero.herosubclass.assassin_desc=Sang Assassin mempersiapkan serangan berikutnya saat ia menjadi tak terlihat. Semakin lama ia mempersiapkan diri, semakin kuat serangan berikutnya. Persiapan berlangsung hingga 9 giliran. Setelah mempersiapkan diri, Assassin memberikan bonus damage pada serangan berikutnya, dapat berteleportasi ke targetnya, dan bahkan dapat langsung membunuh musuh yang cukup lemah.
actors.hero.herosubclass.assassin_short_desc=Sang _Assassin_ dapat mempersiapkan serangan mematikan saat dia tidak terlihat. Semakin lama dia menunggu, semakin kuat serangannya.
actors.hero.herosubclass.battlemage=penyihir perang
actors.hero.herosubclass.battlemage_desc=Battlemage mendapatkan efek bonus setiap kali dia menyerang dalam pertarungan jarak dekat dengan tongkatnya, seolah-olah tongkatnya memiliki mantra tambahan. Efek ini bergantung pada tongkat sihir yang diresapi oleh tongkatnya, setiap tongkat sihir memiliki efeknya sendiri. Selain efek tongkat sihir, tongkat Battlemage juga akan mendapatkan 0,5 muatan setiap kali dia menyerang dengannya.
actors.hero.herosubclass.battlemage_short_desc=_Battlemage_ memunculkan efek bonus saat bertarung jarak dekat dengan tongkatnya. Efek ini bergantung pada tongkat sihir yang diresapi oleh tongkatnya.
actors.hero.herosubclass.berserker=pengamuk
actors.hero.herosubclass.berserker_desc=Berserker mendapatkan amarah saat menerima kerusakan fisik, termasuk kerusakan yang diblokir oleh armornya! Amarah akan berkurang secara bertahap seiring waktu, tetapi akan berkurang lebih lambat jika HP-nya rendah. Amarah dapat menyebabkan Berserker memberikan kerusakan hingga +50%. Pada amarah maksimal, ia dapat mengamuk, mendapatkan perisai tambahan dan mempertahankan amarahnya selama perisai masih ada. Perisai tersebut meningkat seiring dengan level armor Berserker, dan dapat ditingkatkan secara besar-besaran jika kesehatannya rendah. Berserker membutuhkan waktu untuk pulih setelah mengamuk.
actors.hero.herosubclass.berserker_short_desc=_Berserker_ mengumpulkan amarah saat menerima kerusakan. Amarah meningkatkan kerusakannya dan dapat diaktifkan pada 100% untuk mendapatkan perisai tambahan.
actors.hero.herosubclass.champion=juara
actors.hero.herosubclass.champion_desc=Sang Juara adalah ahli senjata jarak dekat yang dapat melengkapi senjata sekunder selain senjata utamanya. Serangan regulernya menggunakan senjata utamanya, tetapi dia dapat langsung mengganti senjata utamanya dan menggunakan kemampuan senjata mana pun. Dia juga mendapatkan 2 muatan kemampuan senjata maksimal tambahan dan kecepatan pengisian ulang kemampuan senjata +50%.
actors.hero.herosubclass.champion_short_desc=Sang Juara dapat menggunakan dua senjata dan mendapatkan lebih banyak muatan senjata. Serangan regulernya menggunakan senjata utamanya, tetapi dia dapat menukar senjata dan menggunakan kemampuan senjata mana pun.
actors.hero.herosubclass.freerunner=pelari bebas
actors.hero.herosubclass.freerunner_desc=Saat Freerunner bergerak, ia membangun tumpukan momentum. Ia dapat memperoleh hingga 10 momentum setelah berlari selama 10 putaran, tetapi akan cepat kehilangan momentum tersebut jika berhenti bergerak. Freerunner dapat menggunakan momentumnya untuk memulai freerunning, selama 2 putaran per poin momentum. Saat melakukan freerunning, Freerunner bergerak dengan kecepatan 2x, dan mendapatkan bonus penghindaran sebanding dengan levelnya. Setelah freerunning berakhir, ada waktu pendinginan sebelum momentum dapat dibangun kembali.
actors.hero.herosubclass.freerunner_short_desc=_Freerunner_ membangun momentum saat berlari, yang dapat digunakan untuk memulai freerunning. Ini memberinya bonus kecepatan dan penghindaran untuk waktu singkat.
actors.hero.herosubclass.gladiator=budak
actors.hero.herosubclass.gladiator_desc=Gladiator membangun satu poin kombo setiap kali dia berhasil melakukan serangan dengan senjata jarak dekat atau senjata lempar. Jika Gladiator tidak berhasil melakukan serangan dalam 5 giliran (15 giliran setelah membunuh), kombonya direset. Saat membangun kombo, Gladiator dapat menggunakan berbagai kemampuan yang dijamin mengenai target: Kombo 2: mendorong musuh mundur, mempertahankan kombo. Kombo 3: memberikan kerusakan berdasarkan armor. Kombo 4: menangkis, mempertahankan kombo. Kombo 5: memberikan kerusakan pada target dan musuh di dekatnya. Kombo 6: menyerang sekali untuk setiap kombo.
actors.hero.herosubclass.gladiator_short_desc=Gladiator membangun kombo saat melakukan serangan yang berhasil. Dia dapat menggunakan kombo tersebut untuk menggunakan kemampuan unik.
actors.hero.herosubclass.monk=biarawan
actors.hero.herosubclass.monk_desc=Sang Biksu adalah ahli teknik fisik. Saat ia mengalahkan musuh, ia mendapatkan energi yang dapat digunakan untuk berbagai kemampuan defensif dan utilitas. Energi ini tidak berkurang seiring waktu, tetapi memiliki batasan berdasarkan level Biksu.\n\n1 Energi: menyerang dengan cepat menggunakan tinju\n2 Energi: fokus untuk menghindari serangan berikutnya\n3 Energi: langsung melesat ke dekatnya\n4 Energi: menendang musuh menjauh\n5 Energi: bermeditasi untuk menghilangkan status dan memulihkan daya tongkat sihir & artefak
actors.hero.herosubclass.monk_short_desc=Sang _Biksu_ mengumpulkan energi saat bertarung. Energi ini dapat digunakan untuk berbagai kemampuan unik.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_desc=Paladin mendapatkan berbagai mantra baru dan yang ditingkatkan yang menekankan pertarungan jarak dekat dan sinergi dengan senjata dan baju besi. Mantra _Senjata Suci_ dan _Perlindungan Suci_ Paladin memberikan bonus yang lebih besar, tidak lagi menimpa mantra dan glif yang ada, dan dapat diperpanjang dengan menggunakan mantra lain. Paladin juga mendapatkan mantra _Smite_, yang memungkinkan mereka melakukan serangan jarak dekat yang dijamin dengan bonus kerusakan dan kekuatan mantra.
actors.hero.herosubclass.paladin_short_desc=Paladin mendapatkan mantra jarak dekat baru dan versi yang lebih kuat dari senjata suci dan perisai.
actors.hero.herosubclass.priest=pendeta
actors.hero.herosubclass.priest_desc=Pendeta mendapatkan berbagai mantra baru dan yang ditingkatkan yang menekankan pertempuran jarak jauh dan sinergi dengan item magis. Pendeta dapat menggunakan _Cahaya Penuntun_ secara gratis sekali setiap 50 giliran, menerangi musuh yang ditargetkan langsung oleh mantra mereka, dan dapat mengonsumsi debuff penerangan dengan sekutu, tongkat sihir, dan beberapa artefak untuk bonus kerusakan yang setara dengan level mereka + 5. Pendeta juga mendapatkan mantra _Cahaya_, yang menghilangkan kegelapan dan memengaruhi semua musuh yang terlihat, memicu dan menerapkan penerangan serta membuat mereka pingsan sesaat dengan biaya 2 muatan.
actors.hero.herosubclass.priest_short_desc=Sang _Pendeta_ memperoleh mantra jarak jauh baru dan versi yang lebih kuat dari cahaya penuntun.
actors.hero.herosubclass.sniper=penembak jitu
actors.hero.herosubclass.sniper_desc=Sniper adalah ahli dalam pertarungan jarak jauh, yang serangan jarak jauhnya mampu menembus armor musuh. Ketika dia menyerang musuh dengan senjata lempar, dia akan memberi tanda penembak jitu pada musuh tersebut, yang memungkinkannya untuk melakukan serangan khusus dari busurnya. Serangan khusus ini bervariasi tergantung pada bagaimana busurnya ditingkatkan. Busur yang tidak ditingkatkan akan menembakkan tembakan cepat yang memberikan kerusakan lebih rendah tetapi menembak secara instan. Busur kecepatan akan menembakkan rentetan tiga anak panah yang memberikan kerusakan lebih rendah, masih dapat mengaktifkan mantra, dan membutuhkan 1 giliran untuk menembak. Busur kerusakan akan menembakkan tembakan penembak jitu yang dijamin mengenai sasaran, memberikan kerusakan bonus berdasarkan jarak, dan membutuhkan 2 giliran untuk menembak.
actors.hero.herosubclass.sniper_short_desc=Sang Penembak Jitu dapat menembus baju zirah dengan serangan jarak jauhnya. Setelah menyerang dengan senjata lempar, dia dapat melanjutkan dengan serangan khusus dari busurnya.
actors.hero.herosubclass.warden=sipir
actors.hero.herosubclass.warden_desc=Sang Penjaga memiliki hubungan yang kuat dengan alam yang memberinya berbagai efek bonus yang berkaitan dengan rumput dan tanaman. Dia mampu melihat menembus rumput tinggi dan bergelombang seolah-olah itu adalah ruang kosong. Sang Penjaga menyebabkan rumput tumbuh di sekitar benih apa pun yang dia lempar atau tanam, dan mendapatkan efek khusus saat menginjak tanaman. Efek khusus ini menggantikan efek tanaman biasa, artinya tidak ada tanaman yang berbahaya jika diinjaknya.
actors.hero.herosubclass.warden_short_desc=Sang _Warden_ dapat melihat menembus rerumputan tinggi dan mendapatkan efek bonus ketika dia menanam benih dan menginjak tanaman.
actors.hero.herosubclass.warlock=ahli sihir
actors.hero.herosubclass.warlock_desc=Penyihir memiliki peluang untuk memberikan tanda jiwa pada karakter ketika dia menggunakan tongkat sihir pada mereka. Peluang untuk menerapkan tanda jiwa dan durasinya meningkat seiring dengan level tongkat sihir. Ketika musuh diberi tanda jiwa, Penyihir akan memulihkan 2 hp untuk setiap 5 kerusakan yang dia berikan kepada mereka, tetapi hanya dengan serangan dari senjata jarak dekat atau senjata lempar, bukan dari tongkat sihir!
actors.hero.herosubclass.warlock_short_desc=Penyihir memiliki peluang untuk menandai jiwa musuh dengan tongkat sihirnya. Dia akan sembuh setiap kali memberikan kerusakan fisik pada musuh yang ditandai.
actors.hero.spells.auraofprotection$aurabuff.desc=Paladin memancarkan energi pelindung di sekitarnya.\n\nSekutu terdekat mana pun (termasuk Paladin sendiri) menerima pengurangan kerusakan dan mendapatkan efek dari glyph armor Paladin dengan kekuatan yang ditingkatkan.\n\nGiliran Tersisa: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura perlindungan
actors.hero.spells.auraofprotection.desc=Paladin mulai memancarkan energi pelindung dalam aura berkilauan di sekeliling dirinya selama 20 giliran. Sekutu mana pun dalam jarak 2 petak dari Paladin (termasuk dirinya sendiri) menerima kerusakan %1$d%% lebih sedikit, dan mendapatkan efek dari glif baju besi Paladin dengan kekuatan +%2$d%%. Pengurangan kerusakan ini terjadi sebelum efek pengurangan kerusakan lainnya (misalnya, baju besi). Peningkatan kekuatan glif akan selalu berlaku, tetapi mantra ini tidak dapat menyebabkan glif Paladin berlaku lebih dari sekali jika karakter sudah mendapatkan manfaat darinya (misalnya, Paladin itu sendiri, atau gambar prismatik).
actors.hero.spells.auraofprotection.name=aura perlindungan
actors.hero.spells.auraofprotection.short_desc=Meningkatkan pertahanan untuk Paladin dan sekutu di dekatnya.
actors.hero.spells.beamingray$beamingrayboost.desc=Sekutu ini baru-baru ini diteleportasi oleh Sinar Pancaran, memberi mereka bonus kerusakan terhadap musuh terdekat setelah teleportasi. Kekuatan Banyak juga tidak akan berakhir saat buff ini aktif.\n\nGiliran Tersisa: %s.
actors.hero.spells.beamingray$beamingrayboost.name=sinar yang memancar
actors.hero.spells.beamingray.desc=Pendeta menyalurkan kekuatan sekutunya ke dalam seberkas cahaya yang memancarkannya ke suatu lokasi. Jika berkas cahaya tersebut bertabrakan dengan musuh, ia akan menempatkan sekutu di dekatnya dan mengarahkannya ke arah musuh. Berkas cahaya tersebut memiliki jangkauan maksimum 0 petak, dan akan meningkatkan bonus kerusakan Kekuatan Banyak menjadi +2 selama 10 putaran terhadap musuh terdekat dalam jarak 4 petak. Berkas cahaya bahkan dapat memindahkan sekutu yang biasanya tidak bergerak, tetapi jangkauannya berkurang setengah dalam kasus ini.
actors.hero.spells.beamingray.name=sinar yang memancar
actors.hero.spells.beamingray.no_space=Tidak ada ruang bagi sekutu Anda untuk muncul di sana.
actors.hero.spells.beamingray.out_of_range=Lokasi itu berada di luar jangkauan.
actors.hero.spells.beamingray.short_desc=Memindahkan sekutu Anda ke teleportasi dan memberikan bonus damage.
actors.hero.spells.blessspell.desc=Pendeta memberikan berkat suci pada diri mereka sendiri atau karakter lain yang dapat mereka lihat. Saat diberikan pada diri sendiri, efeknya lebih lemah, memberikan %1$d giliran berkat dan %2$d perisai. Saat diberikan pada karakter lain, mantranya lebih ampuh, memberikan %3$d giliran berkat dan %4$d penyembuhan. Kelebihan penyembuhan diubah menjadi perisai.
actors.hero.spells.blessspell.name=memberkati
actors.hero.spells.blessspell.short_desc=Memberkati & melindungi Pendeta, memberkati & menyembuhkan orang lain.
actors.hero.spells.bodyform$bodyformbuff.desc=Wujud tubuh Trinity saat ini memberimu kekuatan mantra atau glif, seolah-olah kamu telah melengkapinya pada senjata atau baju besimu saat ini. \n\nPerhatikan bahwa wujud tubuh tidak dapat memberikan salinan lain dari efek yang sudah kamu manfaatkan. \n\nEfek Saat Ini: %1$s.\n\nGiliran Tersisa: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=bentuk tubuh
actors.hero.spells.bodyform.desc=Pendeta memilih mantra atau simbol yang telah mereka identifikasi dalam putaran ini dan memberikan efeknya pada Trinity. Saat Trinity digunakan, Pendeta mendapatkan efek dari mantra atau simbol yang dipilih selama %d putaran. Mantra atau simbol sementara ini akan bekerja dengan efek apa pun yang dimiliki mantra atau simbol biasa. Mantra ini menggantikan efek tubuh lain yang saat ini dimiliki Trinity.
actors.hero.spells.bodyform.name=bentuk tubuh
actors.hero.spells.bodyform.short_desc=Memberikan atribut Trinity pada sebuah mantra atau glif.
actors.hero.spells.cleanse.desc=Pendeta menghilangkan semua efek status berbahaya pada diri mereka sendiri dan sekutu yang terlihat. Setelah mantra berakhir, semua karakter yang terkena dampak juga mendapatkan kekebalan terhadap efek negatif selama %1$d giliran, dan perisai selama %2$d.
actors.hero.spells.cleanse.name=membersihkan
actors.hero.spells.cleanse.short_desc=Menghilangkan efek negatif dan memberikan perlindungan.
actors.hero.spells.clericspell.charge_cost=Biaya pengisian daya: %d
actors.hero.spells.clericspell.invalid_enemy=Anda tidak bisa menargetkan musuh itu.
actors.hero.spells.clericspell.invalid_target=Anda tidak dapat menargetkan lokasi tersebut.
actors.hero.spells.clericspell.no_target=Tidak ada target di sana.
actors.hero.spells.clericspell.prompt=Pilih target
actors.hero.spells.divineintervention.desc=Pendeta mencurahkan sejumlah besar kekuatan dari kitabnya ke dirinya sendiri dan sekutunya, meningkatkan perisai semua orang hingga %1$d dan memperpanjang Bentuk Ascended selama %2$d giliran. Kekuatan pertahanan luar biasa dari mantra ini diimbangi dengan biaya pengisiannya yang sangat tinggi.\n\nSama seperti perisai lain yang diberikan oleh bentuk ascended, perisai ini tidak berkurang secara normal, tetapi akan segera berakhir ketika bentuk ascended berakhir.
actors.hero.spells.divineintervention.name=campur tangan ilahi
actors.hero.spells.divineintervention.short_desc=Peningkatan perisai besar-besaran untuk Pendeta dan sekutunya.
actors.hero.spells.divinesense$divinesensetracker.desc=Karakter ini untuk sementara dapat melihat makhluk lain di dekatnya dengan pikirannya!\n\nGiliran tersisa: %s.
actors.hero.spells.divinesense$divinesensetracker.name=indra ilahi
actors.hero.spells.divinesense.desc=Pendeta memfokuskan indra mereka pada lingkungan sekitar, memperoleh penglihatan pikiran dengan jangkauan ubin %d selama 50 putaran. Mantra ini tidak membutuhkan waktu untuk diucapkan.
actors.hero.spells.divinesense.name=indra ilahi
actors.hero.spells.divinesense.short_desc=Dapatkan visi pikiran sementara dalam berbagai bidang.
actors.hero.spells.flash.desc=Pendeta menyalurkan wujud ascension mereka di lokasi terdekat dan berteleportasi ke sana. Flash dapat memindahkan Pendeta ke lokasi mana pun yang telah ditemukan, berada dalam jangkauan, dan tidak ditempati. Mantra ini membutuhkan lebih banyak muatan buku setiap kali digunakan dalam wujud ascension yang sama.
actors.hero.spells.flash.name=kilatan
actors.hero.spells.flash.prompt=Pilih Lokasi
actors.hero.spells.flash.short_desc=Berteleportasi ke lokasi terdekat.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Pendeta akan dapat menggunakan Guiding Light secara gratis lagi setelah 50 giliran berlalu.\n\nGiliran tersisa: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Cahaya Penuntun
actors.hero.spells.guidinglight$illuminated.desc=Karakter ini bersinar akibat terkena cahaya penuntun. Meskipun cahayanya tidak cukup terang untuk menerangi area sekitarnya, efek magisnya akan membuat Pendeta lebih mudah untuk melancarkan serangan padanya.
actors.hero.spells.guidinglight$illuminated.desc_generic=Hero lain masih bisa menggunakan Illuminated untuk mendapatkan manfaat dari talent Searing Light, tetapi tidak akan mendapatkan peningkatan akurasi.
actors.hero.spells.guidinglight$illuminated.desc_priest=Pendeta juga dapat mengonsumsi energi yang dipancarkan oleh cahaya, serangan tongkat sihir, serangan dari sekutu, atau efek dari beberapa artefak. Menggunakan energi yang dipancarkan dengan cara ini akan memberikan bonus kerusakan sihir yang setara dengan level Pendeta + 5.
actors.hero.spells.guidinglight$illuminated.name=diterangi
actors.hero.spells.guidinglight.desc=Pendeta menembakkan semburan energi magis yang mengenai target, memberikan kerusakan 2-8 dan menerangi mereka. Serangan fisik berikutnya yang tidak terbebani yang dilakukan terhadap musuh yang diterangi dijamin akan mengenai mereka.
actors.hero.spells.guidinglight.desc_priest=Mantra ini lebih ampuh jika diucapkan oleh Pendeta. Penggunaan pertama mantra setiap 50 giliran tidak memerlukan muatan buku mantra, dan iluminasi akan dikonsumsi oleh pancaran cahaya, tongkat sihir, karakter lain, dan artefak yang secara langsung mempengaruhi musuh. Ketika iluminasi digunakan dengan cara ini, ia memberikan kerusakan sihir bonus yang setara dengan level Pendeta + 5.
actors.hero.spells.guidinglight.name=Cahaya Penuntun
actors.hero.spells.guidinglight.short_desc=Menimbulkan kerusakan sihir jarak jauh dan menjamin serangan mengenai sasaran.
actors.hero.spells.hallowedground$hallowedterrain.desc=Tanah di sini telah disucikan. Tanah suci memperlambat musuh, menyembuhkan sekutu, dan menyebabkan rumput tumbuh.
actors.hero.spells.hallowedground.desc=Pendeta memfokuskan sihir ilahi mereka ke tanah di dekatnya, menciptakan area tanah suci seluas %1$dx%1$d selama 20 giliran.\n\nSaat diucapkan, mantra ini menyembuhkan semua sekutu sebesar 15 HP (sekutu yang sehat dan Pendeta mendapatkan perisai), mengikat musuh untuk sementara, dan menyebarkan rumput pendek.\n\nTanah suci menyembuhkan sekutu sebesar 1 HP per giliran (sekutu yang sehat dan Pendeta mendapatkan perisai), melumpuhkan musuh, dan secara acak menyebabkan rumput tinggi tumbuh.\n\nTanah suci dihancurkan oleh api, dan akan menghasilkan rumput yang beralur jika efek regenerasi pasif dinonaktifkan atau Pendeta belum mendapatkan pengalaman dalam beberapa waktu.
actors.hero.spells.hallowedground.name=tanah suci
actors.hero.spells.hallowedground.prompt=Pilih Lokasi
actors.hero.spells.hallowedground.short_desc=Menyembuhkan sekutu, memperlambat musuh, dan menyebarkan rumput dalam area luas.
actors.hero.spells.holyintuition.cursed=Anda merasakan sihir jahat bersembunyi di dalam benda ini.
actors.hero.spells.holyintuition.desc=Pendeta memfokuskan indra mereka pada suatu benda dan menentukan apakah benda itu terkutuk atau tidak tanpa harus memakainya.
actors.hero.spells.holyintuition.name=intuisi suci
actors.hero.spells.holyintuition.prompt=pilih item
actors.hero.spells.holyintuition.short_desc=Mengidentifikasi apakah suatu barang terkutuk atau tidak.
actors.hero.spells.holyintuition.uncursed=Barang ini bebas dari sihir jahat.
actors.hero.spells.holylance$lancecooldown.desc=Sang Pendeta baru saja menggunakan Tombak Suci, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.spells.holylance$lancecooldown.name=cooldown tombak suci
actors.hero.spells.holylance.desc=Pendeta memusatkan sejumlah besar energi ke dalam tombak lempar yang dahsyat yang terbuat dari cahaya. Tombak ini memberikan kerusakan %1$d-%2$d dan selalu memberikan kerusakan maksimum pada target mayat hidup dan iblis.\n\n Mantra ini sangat mahal, dan memiliki waktu pendinginan 30 putaran.
actors.hero.spells.holylance.name=tombak suci
actors.hero.spells.holylance.short_desc=Menimbulkan kerusakan sihir jarak jauh yang besar.
actors.hero.spells.holyward$holyarmbuff.desc=Pendeta telah menyalurkan energi suci ke baju zirah usangnya, untuk sementara mengesampingkan semua glif yang ada dan menyebabkan baju zirah tersebut memblokir tambahan 1 poin kerusakan.\n\nGiliran Tersisa: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladin telah menyalurkan energi suci ke baju zirah usangnya, menyebabkan baju zirah tersebut memblokir tambahan 3 poin kerusakan. Menggunakan mantra lain saat perlindungan suci aktif akan memperpanjang durasinya selama 10 giliran per muatan yang digunakan. Giliran Tersisa:
actors.hero.spells.holyward$holyarmbuff.name=bangsal suci
actors.hero.spells.holyward.desc=Pendeta menyematkan glif cahaya suci pada baju zirah usangnya, meningkatkan kemampuan baju zirah dalam menahan kerusakan sebesar 1. Mantra ini tidak memerlukan waktu untuk diucapkan. Glif ini bertahan selama 50 giliran, dan akan menggantikan glif bermanfaat apa pun yang dimiliki baju zirah selama durasi tersebut. Pendeta akan mendapatkan manfaat dari efek ini bahkan jika mereka tidak memiliki baju zirah.
actors.hero.spells.holyward.desc_paladin=Mantra ini menjadi lebih ampuh jika diucapkan oleh Paladin. Kemampuan memblokir kerusakan tambahan meningkat menjadi 3, mantra ini tidak lagi menimpa glif yang sudah ada, dan mengucapkan mantra lain saat perlindungan suci aktif akan memperpanjang durasinya sebanyak 10 giliran per muatan yang digunakan.
actors.hero.spells.holyward.glyph_desc=Simbol ini sedikit meningkatkan jumlah kerusakan yang dapat diblokir oleh armor.
actors.hero.spells.holyward.glyph_name=%s cahaya
actors.hero.spells.holyward.name=bangsal suci
actors.hero.spells.holyward.short_desc=Mengganti sementara glif untuk meningkatkan kemampuan memblokir armor.
actors.hero.spells.holyweapon$holywepbuff.desc=Pendeta telah menyalurkan energi suci ke senjata usangnya, untuk sementara mengesampingkan semua mantra yang ada dan menyebabkan senjata tersebut memberikan tambahan 2 kerusakan sihir pada setiap serangan.\n\nGiliran Tersisa: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladin telah menyalurkan energi suci ke senjata usangnya, menyebabkan serangannya memberikan tambahan 6 kerusakan sihir. Menggunakan mantra lain saat senjata suci aktif akan memperpanjang durasinya selama 10 giliran per muatan yang digunakan. Giliran Tersisa:
actors.hero.spells.holyweapon$holywepbuff.name=senjata suci
actors.hero.spells.holyweapon.desc=Pendeta menyihir senjata usangnya dengan energi suci, menyebabkan senjata tersebut memberikan tambahan 2 kerusakan sihir setiap kali mereka menyerang musuh dengannya. Mantra ini tidak membutuhkan waktu untuk diucapkan. Mantra ini berlangsung selama 50 putaran, dan akan menimpa mantra bermanfaat apa pun yang dimiliki senjata selama durasi tersebut. Serangan tanpa senjata juga dapat memperoleh manfaat dari efek ini.
actors.hero.spells.holyweapon.desc_paladin=Mantra ini menjadi lebih ampuh jika diucapkan oleh Paladin. Kerusakan sihir tambahan meningkat menjadi 6, mantra ini tidak lagi menimpa mantra yang sudah ada, dan mengucapkan mantra lain saat senjata suci aktif akan memperpanjang durasinya sebanyak 10 giliran per muatan yang digunakan.
actors.hero.spells.holyweapon.ench_desc=Musuh yang terkena serangan senjata suci akan menerima kerusakan sihir tambahan.
actors.hero.spells.holyweapon.ench_name=suci %s
actors.hero.spells.holyweapon.name=senjata suci
actors.hero.spells.holyweapon.short_desc=Untuk sementara menonaktifkan efek sihir untuk meningkatkan kerusakan.
actors.hero.spells.judgement.desc=Pendeta membanting tinjunya ke tanah, menyebabkan semburan cahaya yang memberikan kerusakan pada semua musuh yang dapat dilihatnya. Ini memberikan kerusakan dasar sebesar %1$d-%2$d, tetapi juga memberikan kerusakan tambahan sebesar 33%% untuk setiap mantra yang telah diucapkan Pendeta sejak memasuki wujud yang lebih tinggi (atau sejak terakhir kali mereka mengucapkan Penghakiman). Saat ini Penghakiman akan memberikan kerusakan sebesar %3$d-%4$d.
actors.hero.spells.judgement.name=keputusan
actors.hero.spells.judgement.short_desc=Menimbulkan kerusakan pada semua musuh yang terlihat.
actors.hero.spells.layonhands.desc=Paladin menyalurkan energi suci melalui tangan mereka, menyembuhkan atau melindungi apa pun yang mereka sentuh. Paladin dapat menggunakan mantra ini pada karakter yang berdekatan untuk memberi mereka penyembuhan, atau pada diri mereka sendiri untuk mendapatkan perisai. Kelebihan penyembuhan dari mantra ini diubah menjadi perisai. Mantra ini digunakan secara instan dan dapat digunakan berulang kali, tetapi tidak dapat memberikan lebih dari tiga kali penggunaan perisai sekaligus.
actors.hero.spells.layonhands.name=meletakkan tangan
actors.hero.spells.layonhands.short_desc=Menyembuhkan karakter di sebelahnya secara instan atau melindungi Paladin.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Pendeta baru-baru ini menggunakan Life Link pada sekutu ini. Selain manfaat Life Link yang biasa, karakter ini juga menerima pengurangan kerusakan, mantra Pendeta positif apa pun diterapkan pada Pendeta dan sekutu ini, bukan hanya satu, dan Power of Many tidak akan berakhir selama buff ini aktif. Sisa Giliran: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=perlindungan hubungan hidup
actors.hero.spells.lifelinkspell.desc=Pendeta memperkuat hubungan antara dirinya dan sekutunya yang telah diberdayakan. Dengan hubungan yang diberdayakan ini, setiap kerusakan yang diterima akan dibagi antara pahlawan dan sekutunya selama %1$d giliran, dan peningkatan pertahanan Power of Many akan ditingkatkan menjadi -%2$d%% kerusakan yang diterima. Perhatikan bahwa kerusakan dibagi setelah armor, tetapi sebelum pengurangan kerusakan Power of Many.\n\nSelama efek ini aktif, mantra Pendeta yang bermanfaat dengan T3 atau di bawahnya akan berlaku untuk Pendeta dan sekutunya seolah-olah mantra tersebut hanya berlaku untuk salah satu dari mereka.
actors.hero.spells.lifelinkspell.name=hubungan kehidupan
actors.hero.spells.lifelinkspell.short_desc=Berbagi kerusakan dengan sekutu, dan mengurangi kerusakan yang diterima sekutu.
actors.hero.spells.mindform.desc=Pendeta memilih tongkat sihir atau senjata lempar yang telah mereka identifikasi dalam permainan ini dan memberikan efeknya pada Trinity. Saat Trinity digunakan, Pendeta dapat melakukan satu serangan seolah-olah mereka menggunakan item yang dipilih dengan kekuatan +0. Ini akan memicu semua efek yang biasanya dipicu oleh penggunaan item jenis itu. Mantra ini menggantikan efek pikiran lain yang saat ini dimiliki Trinity.
actors.hero.spells.mindform.name=bentuk pikiran
actors.hero.spells.mindform.short_desc=Memberikan atribut Trinity pada tongkat sihir atau senjata lempar.
actors.hero.spells.mnemonicprayer.desc=Pendeta mengucapkan doa yang memperpanjang durasi semua buff atau debuff pada target tertentu sebanyak %1$d giliran. Mantra ini tidak membutuhkan waktu untuk diucapkan. Efek positif akan bertahan lebih lama pada sekutu (termasuk Pendeta itu sendiri), dan efek negatif akan bertahan lebih lama pada musuh.\n\nDoa Mnemonic hanya dapat memperpanjang satu contoh buff atau debuff tertentu sekali, dan tidak dapat memperpanjang buff yang diberikan dari kemampuan armor.
actors.hero.spells.mnemonicprayer.name=doa mnemonik
actors.hero.spells.mnemonicprayer.short_desc=Memperpanjang efek buff/debuff pada sekutu/musuh, & menerapkan kembali efek illuminated.
actors.hero.spells.radiance.desc=Sang Pendeta memancarkan cahaya suci, membuat semua musuh yang terlihat tertegun selama 3 giliran. Jika musuh sudah diterangi, Radiance akan memicu bonus kerusakan iluminasi dan kemudian menerapkan debuff iluminasi. Radiance juga akan menyebabkan Pendeta bersinar selama 100 giliran jika lantai saat ini gelap.
actors.hero.spells.radiance.name=cahaya
actors.hero.spells.radiance.short_desc=Menerangi dan melumpuhkan musuh yang terlihat untuk sementara waktu.
actors.hero.spells.recallinscription$useditemtracker.desc=Pendeta baru-baru ini menggunakan sebuah item yang bekerja dengan mantra pemanggilan kembali yang tertulis. Pendeta dapat mengucapkan mantra tersebut untuk mengulangi efek item tersebut.\n\nItem Digunakan: %1$s.\n\nGiliran Tersisa: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=rune yang baru saja digunakan
actors.hero.spells.recallinscription.desc=Pendeta menggunakan sihir suci untuk mengulang efek rune magis yang ditemukan pada batu rune atau gulungan yang mereka gunakan dalam %s giliran terakhir.\n\n Mantra Recall Inscription tidak dapat digunakan untuk mereplikasi gulungan peningkatan. Biaya penggunaan mantra ini bervariasi tergantung pada item yang baru saja digunakan: 2 untuk batu rune, 3 untuk gulungan, 4 untuk gulungan eksotis. Biaya penggunaan ini juga digandakan saat mereplikasi gulungan transmutasi, atau item alkimia yang harus dibuat menggunakan transmutasi atau peningkatan.
actors.hero.spells.recallinscription.name=ingat kembali prasasti
actors.hero.spells.recallinscription.short_desc=Mengulangi runestone atau gulungan yang baru saja digunakan.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Perisai cahaya tipis berdiri di antara karakter ini dan musuh. Perisai ini tidak cukup kuat untuk memblokir serangan secara langsung, tetapi akan melemahkan serangan tersebut.\n\nGiliran Tersisa: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=perisai cahaya
actors.hero.spells.shieldoflight.desc=Pendeta menciptakan penghalang cahaya tipis antara dirinya dan musuh, meningkatkan kekuatan blokir baju besinya terhadap musuh tersebut sebesar %1$d-%2$d selama 5 putaran.\n\n Mantra ini tidak memerlukan waktu untuk diucapkan, tetapi tidak dapat digunakan terhadap beberapa target secara bersamaan.
actors.hero.spells.shieldoflight.name=perisai cahaya
actors.hero.spells.shieldoflight.short_desc=Memberikan perlindungan sementara terhadap target.
actors.hero.spells.smite.desc=Paladin memberikan serangan jarak dekat dengan kekuatan penghancur yang benar. Selain memberikan kerusakan jarak dekat normal, Smite membuat serangan tanpa beban dijamin mengenai sasaran, memiliki kekuatan sihir +300, dan memberikan kerusakan sihir bonus - ZXQPH1 - ZXQPH2. Kerusakan sihir bonus Smite meningkat seiring dengan level Paladin, dan akan selalu memberikan kerusakan sihir bonus maksimum terhadap musuh undead atau iblis.
actors.hero.spells.smite.name=memukul
actors.hero.spells.smite.short_desc=Menjamin serangan yang mengenai target dengan bonus kerusakan dan kekuatan sihir.
actors.hero.spells.spiritform$spiritformbuff.desc=Wujud roh Trinity saat ini memberimu kekuatan sebuah item, seolah-olah kamu telah melengkapinya. \n\nPerhatikan bahwa wujud roh tidak dapat memberikan salinan lain dari efek yang sudah kamu manfaatkan. \n\nEfek Saat Ini: %1$s.\n\nGiliran Tersisa: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=bentuk roh
actors.hero.spells.spiritform.desc=Pendeta memilih cincin atau artefak yang telah mereka identifikasi dalam putaran ini (kecuali kitab suci) dan memberikan efeknya kepada Trinity. Jika cincin dipilih, maka Trinity memberikan efek cincin tersebut dengan +0 selama 20 putaran. Jika artefak dipilih, maka Trinity mereplikasi efek Artefak tersebut dengan +1. Setiap artefak memiliki perilaku spesifik dan biaya muatan armor yang berbeda saat digunakan dengan Trinity. Mantra ini menggantikan efek roh lain yang saat ini dimiliki Trinity.
actors.hero.spells.spiritform.name=bentuk roh
actors.hero.spells.spiritform.short_desc=Menugaskan Trinity ke sebuah cincin atau artefak.
actors.hero.spells.stasis$stasisbuff.desc=Saat ini, Pendeta memiliki sekutu yang disimpan dalam keadaan stasis. Semua efek positif pada sekutu ini dipertahankan, termasuk Kekuatan Banyak, dan mereka akan muncul kembali di sebelah Pendeta ketika efek berakhir. Efek juga dapat diakhiri lebih awal dengan menggunakan kembali mantra Stasis.\n\nSekutu dalam stasis: %1$s.\nGiliran Tersisa: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Sekutumu yang tak bergerak tertinggal.
actors.hero.spells.stasis$stasisbuff.name=sekutu dalam keadaan statis
actors.hero.spells.stasis.desc=Pendeta memfokuskan koneksi mereka dengan sekutu mereka ke arah diri mereka sendiri, menyebabkan sekutu tersebut untuk sementara ditahan dalam semacam keadaan statis energi di dalam Pendeta. Sekutu akan terpelihara hingga %d giliran, dengan semua efek positif pada mereka tidak terpengaruh oleh waktu mereka dalam keadaan statis.\n\nSekutu akan muncul di sebelah Pendeta ketika keadaan statis berakhir secara alami atau mereka dapat langsung mengucapkan kembali mantra tersebut tanpa biaya untuk mengakhiri efeknya lebih awal. Keadaan statis bahkan dapat memindahkan sekutu yang tidak bergerak, tetapi tidak dapat memindahkan mereka antar lantai.
actors.hero.spells.stasis.name=keadaan statis
actors.hero.spells.stasis.short_desc=Mengeluarkan sekutu dari penjara bawah tanah dan menyimpannya.
actors.hero.spells.sunray.desc=Pendeta menembakkan sinar cahaya menyilaukan ke target, memberikan kerusakan %1$d-%2$d dan membutakan mereka selama %3$d giliran. Sinar Matahari selalu memberikan kerusakan maksimum pada target mayat hidup dan iblis.\n\nSetelah terkena mantra ini, penglihatan musuh akan menyesuaikan diri, mencegah mereka dibutakan lagi. Namun, jika mereka terkena lagi saat dibutakan oleh mantra ini, maka cahayanya akan sangat menyilaukan dan malah melumpuhkan mereka.
actors.hero.spells.sunray.name=sinar matahari
actors.hero.spells.sunray.short_desc=Menimbulkan kerusakan sihir jarak jauh dan membutakan target sekali.
actors.hero.spells.walloflight$lightwall.desc=Panel-panel cahaya yang berkilauan menghalangi jalan di sini.
actors.hero.spells.walloflight.desc=Paladin menciptakan dinding yang terbuat dari panel cahaya padat tepat di depannya, setebal 1 ubin, selebar %1$d ubin, dan bertahan selama 20 putaran. Dinding ini berfungsi seperti dinding biasa, kecuali dapat dilihat tembus. Musuh yang terjebak di dinding saat dibuat akan tertegun sesaat dan terdorong mundur jika memungkinkan. Apa pun yang terjebak di dinding akan dapat bergerak keluar. Dinding dapat dilemparkan ke salah satu dari empat arah mata angin atau empat arah diagonal. Jika dinding sudah aktif, mantra dapat digunakan kembali secara gratis untuk langsung membersihkan dinding.
actors.hero.spells.walloflight.early_end=Anda menghilangkan dinding cahaya itu.
actors.hero.spells.walloflight.name=dinding cahaya
actors.hero.spells.walloflight.short_desc=Menciptakan dinding yang menghalangi musuh.
actors.hero.talent$aggressivebarriercooldown.desc=Anda baru saja menggunakan bakat ini, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$aggressivebarriercooldown.name=pendinginan penghalang agresif
actors.hero.talent$combinedlethalityabilitytracker.executed=dieksekusi
actors.hero.talent$deadlyfollowuptracker.desc=Sang Duelis baru saja menyerang musuh dengan senjata lempar, serangan jarak dekatnya terhadap target yang sama akan memiliki peningkatan kerusakan.\n\nGiliran tersisa: %s.
actors.hero.talent$deadlyfollowuptracker.name=tindak lanjut yang mematikan
actors.hero.talent$followupstriketracker.desc=Sang Pemburu baru saja menyerang musuh dengan senjata lempar, serangan jarak dekatnya berikutnya terhadap target yang sama akan memiliki peningkatan kerusakan.\n\nGiliran tersisa: %s.
actors.hero.talent$followupstriketracker.name=serangan lanjutan
actors.hero.talent$improvisedprojectilecooldown.desc=Anda baru saja menggunakan bakat ini, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$improvisedprojectilecooldown.name=pendinginan proyektil improvisasi
actors.hero.talent$lethalhastecooldown.desc=Anda baru saja menggunakan bakat ini, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$lethalhastecooldown.name=cooldown kecepatan mematikan
actors.hero.talent$lingeringmagictracker.desc=Penyihir baru saja menggunakan tongkat atau tongkat sihir, serangan fisik berikutnya akan memberikan kerusakan bonus.\n\nGiliran tersisa: %s.
actors.hero.talent$lingeringmagictracker.name=keajaiban yang masih terasa
actors.hero.talent$liquidagilacctracker.desc=Serangan jarak dekat reguler Duelist berikutnya akan mendapatkan bonus akurasi.\n\nGiliran tersisa: %s.
actors.hero.talent$liquidagilacctracker.name=kelincahan cair
actors.hero.talent$patientstriketracker.desc=Sang Duelis baru saja menghabiskan satu giliran untuk menunggu, serangan jarak dekatnya berikutnya akan memberikan kerusakan bonus.
actors.hero.talent$patientstriketracker.name=pemogokan pasien
actors.hero.talent$preciseassaulttracker.desc=Serangan jarak dekat reguler Duelist berikutnya akan mendapatkan bonus akurasi.\n\nGiliran tersisa: %s.
actors.hero.talent$preciseassaulttracker.name=serangan tepat
actors.hero.talent$provokedangertracker.desc=Prajurit baru saja kehilangan perisainya, serangan fisik berikutnya akan memberikan kerusakan bonus.\n\nGiliran tersisa: %s.
actors.hero.talent$provokedangertracker.name=memicu kemarahan
actors.hero.talent$rejuvenatingstepscooldown.desc=Anda baru saja menggunakan bakat ini, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=langkah-langkah peremajaan pendinginan
actors.hero.talent$satiatedspellstracker.desc=Mantra selanjutnya yang diucapkan oleh Pendeta akan memberinya sedikit perlindungan.
actors.hero.talent$satiatedspellstracker.name=Mantra Perisai
actors.hero.talent$searinglightcooldown.desc=Anda baru saja menggunakan bakat ini, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$searinglightcooldown.name=Cahaya yang Menyala
actors.hero.talent$seershotcooldown.desc=Anda baru saja menggunakan bakat ini, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$seershotcooldown.name=waktu pendinginan tembakan peramal
actors.hero.talent$swiftequipcooldown.desc=Anda baru saja menggunakan bakat ini, dan harus menunggu sebelum menggunakannya lagi.\n\nGiliran tersisa: %s.
actors.hero.talent$swiftequipcooldown.name=cooldown perlengkapan cepat
actors.hero.talent.adventurers_intuition.desc=_+1:_ Duelis mengidentifikasi senjata _2,5x lebih cepat_ dan baju besi _1,75x lebih cepat_.\n\n_+2:_ Duelis mengidentifikasi senjata _saat dia melengkapinya_ dan baju besi _2,5x lebih cepat_.
actors.hero.talent.adventurers_intuition.title=intuisi petualang
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duelis mendapatkan _3 perisai_ saat dia menggunakan kemampuan senjata dan kesehatannya berada di atau di bawah 50%.\n\n_+2:_ Duelis mendapatkan _5 perisai_ saat dia menggunakan kemampuan senjata dan kesehatannya berada di atau di bawah 50%.
actors.hero.talent.aggressive_barrier.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, talenta ini akan memberikan perisai saat melakukan serangan jarak dekat pada kondisi kesehatan rendah, dengan waktu pendinginan 50 giliran.
actors.hero.talent.aggressive_barrier.title=penghalang agresif
actors.hero.talent.ally_warp.desc=_+1:_ Penyihir dapat memilih sekutu untuk langsung bertukar tempat dengannya, dengan jangkauan _2 petak_.\n\n_+2:_ Penyihir dapat memilih sekutu untuk langsung bertukar tempat dengannya, dengan jangkauan _4 petak_.\n\n_+3:_ Penyihir dapat memilih sekutu untuk langsung bertukar tempat dengannya, dengan jangkauan _6 petak_.\n\nPenyihir tidak dapat bertukar tempat dengan sekutu yang tidak bergerak.
actors.hero.talent.ally_warp.title=sekutu warp
actors.hero.talent.arcane_vision.desc=_+1:_ Saat Penyihir menyerang musuh dengan sihir, ia mendapatkan penglihatan pikiran terhadap musuh tersebut selama _10 giliran_.\n\n_+2:_ Saat Penyihir menyerang musuh dengan sihir, ia mendapatkan penglihatan pikiran terhadap musuh tersebut selama _15 giliran_.
actors.hero.talent.arcane_vision.title=penglihatan gaib
actors.hero.talent.assassins_reach.desc=_+1:_ Jangkauan kedipan Assassin per level persiapan ditingkatkan menjadi _1/3/4/6 petak_, dari 1/2/3/4.\n\n_+2:_ Jangkauan kedipan Assassin per level persiapan ditingkatkan menjadi _2/4/6/8 petak_, dari 1/2/3/4.\n\n_+3:_ Jangkauan kedipan Assassin per level persiapan ditingkatkan menjadi _2/5/7/10 petak_, dari 1/2/3/4.\n\n Kedipan ini dapat menembus rintangan dan musuh, tetapi tidak menembus medan padat seperti dinding.
actors.hero.talent.assassins_reach.title=jangkauan pembunuh
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladin dapat menggunakan _Aura Perlindungan_, mantra yang memberikan Paladin dan semua sekutu dalam jarak 2 petak _resistensi kerusakan 20%_ dan efek glif baju besi Paladin dengan kekuatan _+50%_ selama 20 giliran, dengan biaya 2 muatan.\n\n_+2:_ Paladin dapat menggunakan _Aura Perlindungan_, mantra yang memberikan Paladin dan semua sekutu dalam jarak 2 petak _resistensi kerusakan 30%_ dan efek glif baju besi Paladin dengan kekuatan _+75%_ selama 20 giliran, dengan biaya 2 muatan.\n\n_+3:_ Paladin dapat menggunakan _Aura Perlindungan_, mantra yang memberikan Paladin dan semua sekutu dalam jarak 2 petak _resistensi kerusakan 40%_ dan efek glif baju besi Paladin dengan kekuatan _+100%_ kekuatan_ selama 20 putaran, dengan biaya 2 muatan.
actors.hero.talent.aura_of_protection.title=aura perlindungan
actors.hero.talent.backup_barrier.desc=_+1:_ Penyihir mendapatkan _3 perisai_ setiap kali dia menghabiskan muatan terakhir di tongkatnya.\n\n_+2:_ Penyihir mendapatkan _5 perisai_ setiap kali dia menghabiskan muatan terakhir di tongkatnya.
actors.hero.talent.backup_barrier.meta_desc=Jika talenta ini diperoleh oleh hero lain, talenta ini akan diaktifkan dari tongkat sihir level tertinggi hero tersebut.
actors.hero.talent.backup_barrier.title=penghalang cadangan
actors.hero.talent.barkskin.desc=_+1:_ Saat menginjak rumput, Warden mendapatkan _0-50% dari levelnya_ dalam armor kulit kayu yang memudar setiap giliran.\n\n_+2:_ Saat menginjak rumput, Warden mendapatkan _0-100% dari levelnya_ dalam armor kulit kayu yang memudar setiap giliran.\n\n_+3:_ Saat menginjak rumput, Warden mendapatkan _0-150% dari levelnya_ dalam armor kulit kayu yang memudar setiap giliran.
actors.hero.talent.barkskin.title=kulit kayu
actors.hero.talent.beaming_ray.desc=Pendeta dapat menggunakan _Beaming Ray_ dari sekutu yang telah diperkuat dengan biaya 1 muatan. Sinar ini dapat menembus dinding dan memindahkan sekutu ke lokasi yang ditargetkan. Jika ada musuh di lokasi tersebut, sekutu akan muncul di sebelah musuh dan akan menargetkannya. Sinar Bercahaya bahkan dapat memindahkan sekutu yang biasanya tidak bergerak, tetapi jangkauannya berkurang setengah saat melakukannya.\n\n_+1: Sinar Bercahaya memiliki jangkauan maksimum 4 petak, dan meningkatkan bonus Kekuatan Banyak menjadi +35% kerusakan terhadap musuh terdekat selama 10 putaran.\n\n_+2: Sinar Bercahaya memiliki jangkauan maksimum 8 petak, dan meningkatkan bonus Kekuatan Banyak menjadi +40% kerusakan terhadap musuh terdekat selama 10 putaran.\n\n_+3: Sinar Bercahaya memiliki jangkauan maksimum 12 petak, dan meningkatkan bonus Kekuatan Banyak menjadi +45% kerusakan terhadap musuh terdekat selama 10 putaran.\n\n_+4: Sinar Bercahaya memiliki jangkauan maksimum 16 petak, dan meningkatkan Kekuatan Banyak menjadi +45% kerusakan terhadap musuh terdekat selama 10 putaran. Bonus Many berupa _+50% kerusakan_ terhadap musuh terdekat selama 10 giliran.
actors.hero.talent.beaming_ray.title=sinar yang memancar
actors.hero.talent.blast_radius.desc=_+1:_ Radius ledakan elemen ditingkatkan menjadi _5 ubin_, dari 4.\n\n_+2:_ Radius ledakan elemen ditingkatkan menjadi _6 ubin_, dari 4.\n\n_+3:_ Radius ledakan elemen ditingkatkan menjadi _7 ubin_, dari 4.\n\n_+4:_ Radius ledakan elemen ditingkatkan menjadi _8 ubin_, dari 4.
actors.hero.talent.blast_radius.title=radius ledakan
actors.hero.talent.bless.desc=_+1:_ Pendeta dapat merapal _Berkah,_ mantra yang memberikan _6 giliran berkah dan 10 perisai_ ketika dirapal pada diri sendiri atau _10 giliran berkah dan 10 penyembuhan_ ketika dirapal pada karakter lain, dengan biaya 1 muatan.\n\n_+2:_ Pendeta dapat merapal _Berkah,_ mantra yang memberikan _10 giliran berkah dan 15 perisai_ ketika dirapal pada diri sendiri atau _15 giliran berkah dan 15 penyembuhan_ ketika dirapal pada karakter lain, dengan biaya 1 muatan.\n\nKelebihan penyembuhan dari mantra ini diubah menjadi perisai.
actors.hero.talent.bless.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, talenta ini akan meningkatkan akurasi dan penghindaran untuk hero tersebut dan semua sekutunya sebesar 3% pada +1 atau 5% pada +2.
actors.hero.talent.bless.title=memberkati
actors.hero.talent.body_form.desc=Pendeta dapat menggunakan _Bentuk Tubuh_, yang memberikan kekuatan mantra atau glif yang telah diidentifikasi Pendeta dalam permainan ini kepada Trinity, dengan biaya 2 muatan.\n\n_+1:_ Saat Trinity digunakan, Pendeta mendapatkan efek yang dipilih selama _20 putaran._\n\n_+2:_ Saat Trinity digunakan, Pendeta mendapatkan efek yang dipilih selama _27 putaran._\n\n_+3:_ Saat Trinity digunakan, Pendeta mendapatkan efek yang dipilih selama _33 putaran._\n\n_+4:_ Saat Trinity digunakan, Pendeta mendapatkan efek yang dipilih selama _40 putaran._\n\nTrinity hanya dapat diberi satu efek tubuh dalam satu waktu. Biaya pengisian armor Trinity lebih tinggi jika glyph yang dipilih langka dan kuat.
actors.hero.talent.body_form.title=bentuk tubuh
actors.hero.talent.body_replacement.desc=_+1:_ Setelah berkedip, Rogue meninggalkan umpan kayu yang memiliki _20 kesehatan dan 1-3 armor_.\n\n_+2:_ Setelah berkedip, Rogue meninggalkan umpan kayu yang memiliki _40 kesehatan dan 2-6 armor_.\n\n_+3:_ Setelah berkedip, Rogue meninggalkan umpan kayu yang memiliki _60 kesehatan dan 3-9 armor_.\n\n_+4:_ Setelah berkedip, Rogue meninggalkan umpan kayu yang memiliki _80 kesehatan dan 4-12 armor_.\n\nHanya satu umpan yang dapat aktif pada satu waktu.
actors.hero.talent.body_replacement.title=penggantian tubuh
actors.hero.talent.body_slam.desc=_+1:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya menerima kerusakan sebesar _1-4 ditambah 25%_ dari kekuatan penahan kerusakannya.\n\n_+2:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya menerima kerusakan sebesar _2-8 ditambah 50%_ dari kekuatan penahan kerusakannya.\n\n_+3:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya menerima kerusakan sebesar _3-12 ditambah 75%_ dari kekuatan penahan kerusakannya.\n\n_+4:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya menerima kerusakan sebesar _4-16 ditambah 100%_ dari kekuatan penahan kerusakannya.
actors.hero.talent.body_slam.title=bantingan tubuh
actors.hero.talent.bounty_hunter.desc=_+1:_ Saat Assassin membunuh musuh dengan serangan yang telah dipersiapkan, peluang jatuhnya item meningkat sebesar _2/4/8/16%_, per level persiapan.\n\n_+2:_ Saat Assassin membunuh musuh dengan serangan yang telah dipersiapkan, peluang jatuhnya item meningkat sebesar _4/8/16/32%_, per level persiapan.\n\n_+3:_ Saat Assassin membunuh musuh dengan serangan yang telah dipersiapkan, peluang jatuhnya item meningkat sebesar _6/12/24/48%_, per level persiapan.
actors.hero.talent.bounty_hunter.title=pemburu hadiah
actors.hero.talent.cached_rations.desc=_+1:_ Sang Rogue dapat menemukan _2 ransum persediaan_ yang ditempatkan di dalam peti saat ia menjelajahi beberapa lantai berikutnya di ruang bawah tanah.\n\n_+2:_ Sang Rogue dapat menemukan _3 ransum persediaan_ yang ditempatkan di dalam peti saat ia menjelajahi beberapa lantai berikutnya di ruang bawah tanah.\n\nRansum persediaan dimakan dengan cepat, mengembalikan rasa kenyang dalam jumlah sedang, menyembuhkan 5 hp, dan mengembalikan 1 muatan jubah bayangan.
actors.hero.talent.cached_rations.title=ransum yang disimpan
actors.hero.talent.cleanse.desc=_+1:_ Pendeta dapat merapal _Cleanse_, mantra yang _menghilangkan efek status negatif_ dari Pendeta dan sekutu terdekat, serta memberi mereka _10 perisai_, dengan biaya 2 muatan.\n\n_+2:_ Pendeta dapat merapal _Cleanse_, mantra yang _memberikan kekebalan status negatif selama 3 giliran_ kepada Pendeta dan sekutu terdekat, serta memberi mereka _20 perisai_, dengan biaya 2 muatan.\n\n_+3:_ Pendeta dapat merapal _Cleanse_, mantra yang _memberikan kekebalan status negatif selama 5 giliran kepada Pendeta dan sekutu terdekat, serta memberi mereka _30 perisai_, dengan biaya 2 muatan.
actors.hero.talent.cleanse.meta_desc=_Jika bakat ini diperoleh oleh hero yang berbeda_ bakat ini akan membersihkan efek status negatif pada hero tersebut setelah menggunakan tongkat sihir atau artefak, 10/20/30% dari waktu dengan +1/+2/+3.
actors.hero.talent.cleanse.title=membersihkan
actors.hero.talent.cleave.desc=_+1:_ Waktu tambahan yang didapatkan Gladiator setelah membunuh ditingkatkan menjadi _30 giliran_, dari 15.\n\n_+2:_ Waktu tambahan yang didapatkan Gladiator setelah membunuh ditingkatkan menjadi _45 giliran_, dari 15.\n\n_+3:_ Waktu tambahan yang didapatkan Gladiator setelah membunuh ditingkatkan menjadi _60 giliran_, dari 15.
actors.hero.talent.cleave.title=membelah
actors.hero.talent.cloned_armor.desc=_+1:_ Klon bayangan mendapatkan _12%_ dari nilai armor hero, dan memiliki _peluang 25%_ untuk menggunakan glif pada armor hero.\n\n_+2:_ Klon bayangan mendapatkan _24%_ dari nilai armor hero, dan memiliki _peluang 50%_ untuk menggunakan glif pada armor hero.\n\n_+3:_ Klon bayangan mendapatkan _36%_ dari nilai armor hero, dan memiliki _peluang 75%_ untuk menggunakan glif pada armor hero.\n\n_+4:_ Klon bayangan mendapatkan _48%_ dari nilai armor hero, dan memiliki _peluang 100%_ untuk menggunakan glif pada armor hero.
actors.hero.talent.cloned_armor.title=baju besi kloning
actors.hero.talent.close_the_gap.desc=_+1:_ Duelis berteleportasi _hingga dua petak_ ke arah targetnya saat memulai duel.\n\n_+2:_ Duelis berteleportasi _hingga tiga petak_ ke arah targetnya saat memulai duel.\n\n_+3:_ Duelis berteleportasi _hingga empat petak_ ke arah targetnya saat memulai duel.\n\n_+4:_ Duelis berteleportasi _hingga lima petak_ ke arah targetnya saat memulai duel.\n\nTeleportasi ini dapat menembus rintangan dan musuh, tetapi tidak dapat menembus medan padat seperti dinding. Teleportasi ini diperhitungkan saat menentukan apakah musuh berada dalam jangkauan untuk ditantang.
actors.hero.talent.close_the_gap.title=menutup kesenjangan
actors.hero.talent.combined_energy.desc=_+1:_ Jika Biksu menggunakan kemampuan senjata dan kemampuan dengan energi _4+_ dalam waktu 5 giliran satu sama lain, dia mendapatkan kembali 1 energi yang telah digunakan.\n\n_+2:_ Jika Biksu menggunakan kemampuan senjata dan kemampuan dengan energi _3+_ dalam waktu 5 giliran satu sama lain, dia mendapatkan kembali 1 energi yang telah digunakan.\n\n_+3:_ Jika Biksu menggunakan kemampuan senjata dan kemampuan dengan energi _2+_ dalam waktu 5 giliran satu sama lain, dia mendapatkan kembali 1 energi yang telah digunakan.
actors.hero.talent.combined_energy.title=energi gabungan
actors.hero.talent.combined_lethality.desc=_+1:_ Jika Champion menyerang dengan senjata jarak dekat segera setelah menggunakan kemampuan senjata lain, serangan itu akan mengeksekusi musuh non-bos yang tersisa dengan _HP di bawah 13%_.\n\n_+2:_ Jika Champion menyerang dengan senjata jarak dekat segera setelah menggunakan kemampuan senjata lain, serangan itu akan mengeksekusi musuh non-bos yang tersisa dengan _HP di bawah 27%_.\n\n_+3:_ Jika Champion menyerang dengan senjata jarak dekat segera setelah menggunakan kemampuan senjata lain, serangan itu akan mengeksekusi musuh non-bos yang tersisa dengan _HP di bawah 40%_.\n\nSerangan ini dapat berupa serangan senjata jarak dekat biasa, atau bagian dari kemampuan senjata.
actors.hero.talent.combined_lethality.title=gabungan mematikan
actors.hero.talent.conserved_magic.desc=_+1:_ Setiap serangan sihir liar sekarang menggunakan _0,33 muatan_ alih-alih 0,5, dan sihir liar memiliki _peluang 25%_ untuk tidak menghabiskan giliran.\n\n_+2:_ Setiap serangan sihir liar sekarang menggunakan _0,225 muatan_ alih-alih 0,5, dan sihir liar memiliki _peluang 50%_ untuk tidak menghabiskan giliran.\n\n_+3:_ Setiap serangan sihir liar sekarang menggunakan _0,15 muatan_ alih-alih 0,5, dan sihir liar memiliki _peluang 75%_ untuk tidak menghabiskan giliran.\n\n_+4:_ Setiap serangan sihir liar sekarang menggunakan _0,1 muatan_ alih-alih 0,5, dan sihir liar memiliki _peluang 100%_ untuk tidak menghabiskan giliran.
actors.hero.talent.conserved_magic.title=sihir yang dilestarikan
actors.hero.talent.counter_ability.desc=_+1:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangannya diserang, dia akan langsung mendapatkan kembali _0,38 muatan_.\n\n_+2:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangannya diserang, dia akan langsung mendapatkan kembali _0,77 muatan_.\n\n_+3:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangannya diserang, dia akan langsung mendapatkan kembali _1,13 muatan_.\n\n_+4:_ Jika Duelis menggunakan kemampuan senjata dalam 3 giliran setelah bayangannya diserang, dia akan langsung mendapatkan kembali _1,5 muatan_.
actors.hero.talent.counter_ability.title=kemampuan melawan
actors.hero.talent.deadly_followup.desc=_+1:_ Saat Duelis mengenai musuh dengan senjata lempar, dia akan memberikan _10% lebih banyak kerusakan jarak dekat_ kepada mereka selama 5 putaran.\n\n_+2:_ Saat Duelis mengenai musuh dengan senjata lempar, dia akan memberikan _20% lebih banyak kerusakan jarak dekat_ kepada mereka selama 5 putaran.\n\n_+3:_ Saat Duelis mengenai musuh dengan senjata lempar, dia akan memberikan _30% lebih banyak kerusakan jarak dekat_ kepada mereka selama 5 putaran.
actors.hero.talent.deadly_followup.title=tindak lanjut yang mematikan
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk akan aktif secara otomatis jika Berserker hampir mati dan amarahnya mencapai atau melebihi 100%, tetapi memiliki waktu pendinginan _3 level hero_ ketika ini terjadi.\n\n_+2:_ Berserk akan aktif secara otomatis jika Berserker hampir mati dan amarahnya mencapai atau melebihi 100%, tetapi memiliki waktu pendinginan _2 level hero_ ketika ini terjadi.\n\n_+3:_ Berserk akan aktif secara otomatis jika Berserker hampir mati dan amarahnya mencapai atau melebihi 100%, tetapi memiliki waktu pendinginan _1 level hero_ ketika ini terjadi.\n\nPerhatikan bahwa Berserker akan tetap mati jika ia memiliki 0 HP ketika berserk berakhir.
actors.hero.talent.deathless_fury.title=amarah abadi
actors.hero.talent.deathly_durability.desc=_+1:_ Musuh yang dibunuh oleh tanda kematian memberi Rogue perisai setara dengan _13%_ dari HP mereka saat ditandai.\n\n_+2:_ Musuh yang dibunuh oleh tanda kematian memberi Rogue perisai setara dengan _25%_ dari HP mereka saat ditandai.\n\n_+3:_ Musuh yang dibunuh oleh tanda kematian memberi Rogue perisai setara dengan _38%_ dari HP mereka saat ditandai.\n\n_+4:_ Musuh yang dibunuh oleh tanda kematian memberi Rogue perisai setara dengan _50%_ dari HP mereka saat ditandai.
actors.hero.talent.deathly_durability.title=daya tahan yang mematikan
actors.hero.talent.desperate_power.desc=_+1:_ Tongkat dan staf Penyihir mendapatkan _+1 level_ pada serangan terakhir mereka ketika daya yang mereka miliki tinggal sedikit.\n\n_+2:_ Tongkat dan staf Penyihir mendapatkan _+2 level_ pada serangan terakhir mereka ketika daya yang mereka miliki tinggal sedikit.\n\n_+3:_ Tongkat dan staf Penyihir mendapatkan _+3 level_ pada serangan terakhir mereka ketika daya yang mereka miliki tinggal sedikit.
actors.hero.talent.desperate_power.title=kekuatan putus asa
actors.hero.talent.directed_power.desc=_+1:_ Serangan langsung dari Elemental Strike mendapatkan _+30% kekuatan sihir_ untuk setiap musuh dalam jangkauan efek Elemental Strike, termasuk target serangan.\n\n_+2:_ Serangan langsung dari Elemental Strike mendapatkan _+60% kekuatan sihir_ untuk setiap musuh dalam jangkauan efek Elemental Strike, termasuk target serangan.\n\n_+3:_ Serangan langsung dari Elemental Strike mendapatkan _+90% kekuatan sihir_ untuk setiap musuh dalam jangkauan efek Elemental Strike, termasuk target serangan.\n\n_+4:_ Serangan langsung dari Elemental Strike mendapatkan _+120% kekuatan sihir_ untuk setiap musuh dalam jangkauan efek Elemental Strike, termasuk target serangan.
actors.hero.talent.directed_power.title=daya terarah
actors.hero.talent.divine_intervention.desc=_+1:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Intervensi Ilahi_, yang meningkatkan perlindungan Pendeta dan semua sekutunya hingga _150_ dan memperpanjang Wujud Ascended selama _3 giliran._\n\n_+2:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Intervensi Ilahi_, yang meningkatkan perlindungan Pendeta dan semua sekutunya hingga _200_ dan memperpanjang Wujud Ascended selama _4 giliran._\n\n_+3:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Intervensi Ilahi_, yang meningkatkan perlindungan Pendeta dan semua sekutunya hingga _250_ dan memperpanjang Wujud Ascended selama _5 giliran._\n\n_+4:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Intervensi Ilahi_, yang meningkatkan kemampuan Pendeta dan semua sekutunya hingga _300 perisai_ dan memperpanjang Bentuk Ascended selama _6 giliran._\n\nIntervensi Ilahi membutuhkan 5 muatan buku mantra, dan hanya dapat digunakan sekali dalam bentuk ascended yang sama.
actors.hero.talent.divine_intervention.title=campur tangan ilahi
actors.hero.talent.divine_sense.desc=_+1:_ Pendeta dapat merapal _Divine Sense_, sebuah mantra yang memberinya _8 petak_ Penglihatan Pikiran selama 50 giliran dan tidak memerlukan waktu untuk dirapal, dengan biaya 2 muatan.\n\n_+2:_ Pendeta dapat merapal _Divine Sense_, sebuah mantra yang memberinya _12 petak_ Penglihatan Pikiran selama 50 giliran dan tidak memerlukan waktu untuk dirapal, dengan biaya 2 muatan.
actors.hero.talent.divine_sense.meta_desc=_Jika bakat ini diperoleh oleh pahlawan yang berbeda_ bakat ini akan memberi mereka penglihatan pikiran untuk sesaat setelah menggunakan tongkat sihir atau artefak dengan jangkauan 3 petak pada +1 atau 5 petak pada +2.
actors.hero.talent.divine_sense.title=indra ilahi
actors.hero.talent.double_jump.desc=_+1:_ Jika Prajurit melakukan lompatan kedua dalam 3 giliran, biaya pengisian lompatan tersebut berkurang _16%_.\n\n_+2:_ Jika Prajurit melakukan lompatan kedua dalam 3 giliran, biaya pengisian lompatan tersebut berkurang _30%_.\n\n_+3:_ Jika Prajurit melakukan lompatan kedua dalam 3 giliran, biaya pengisian lompatan tersebut berkurang _40%_.\n\n_+4:_ Jika Prajurit melakukan lompatan kedua dalam 3 giliran, biaya pengisian lompatan tersebut berkurang _50%_.
actors.hero.talent.double_jump.title=lompatan ganda
actors.hero.talent.double_mark.desc=_+1:_ Menandai target kedua bersamaan dengan target pertama memiliki biaya pengisian daya yang _berkurang 30%_.\n\n_+2:_ Menandai target kedua bersamaan dengan target pertama memiliki biaya pengisian daya yang _berkurang 50%_.\n\n_+3:_ Menandai target kedua bersamaan dengan target pertama memiliki biaya pengisian daya yang _berkurang 65%_.\n\n_+4:_ Menandai target kedua bersamaan dengan target pertama memiliki biaya pengisian daya yang _berkurang 75%_.
actors.hero.talent.double_mark.title=tanda ganda
actors.hero.talent.durable_projectiles.desc=_+1:_ Senjata lempar memiliki daya tahan _+50%_ saat digunakan oleh Huntress.\n\n_+2:_ Senjata lempar memiliki daya tahan _+75%_ saat digunakan oleh Huntress.
actors.hero.talent.durable_projectiles.title=proyektil tahan lama
actors.hero.talent.durable_tips.desc=_+1:_ Anak panah berujung runcing memiliki daya tahan 2x lipat saat digunakan oleh Sipir.\n\n_+2:_ Anak panah berujung runcing memiliki daya tahan 3x lipat saat digunakan oleh Sipir.\n\n_+3:_ Anak panah berujung runcing memiliki daya tahan 4x lipat saat digunakan oleh Sipir.
actors.hero.talent.durable_tips.title=ujung yang tahan lama
actors.hero.talent.eagle_eye.desc=_+1:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _7 petak_ dari 6.\n\n_+2:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _8 petak_ dari 6.\n\n_+3:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _9 petak_ dari 6, dan mendapatkan _2 petak_ penglihatan pikiran.\n\n_+4:_ Jangkauan penglihatan elang roh ditingkatkan menjadi _10 petak_ dari 6, dan mendapatkan _3 petak_ penglihatan pikiran.
actors.hero.talent.eagle_eye.title=mata elang
actors.hero.talent.elemental_power.desc=_+1:_ Kekuatan ledakan elemen meningkat sebesar _25%_.\n\n_+2:_ Kekuatan ledakan elemen meningkat sebesar _50%_.\n\n_+3:_ Kekuatan ledakan elemen meningkat sebesar _75%_.\n\n_+4:_ Kekuatan ledakan elemen meningkat sebesar _100%_.
actors.hero.talent.elemental_power.title=kekuatan elemen
actors.hero.talent.elemental_reach.desc=_+1:_ Jangkauan serangan elemen ditingkatkan menjadi _5 petak_ dari 4, dan lebarnya ditingkatkan menjadi _75 derajat_ dari 65.\n\n_+2:_ Jangkauan serangan elemen ditingkatkan menjadi _6 petak_ dari 4, dan lebarnya ditingkatkan menjadi _85 derajat_ dari 65.\n\n_+3:_ Jangkauan serangan elemen ditingkatkan menjadi _7 petak_ dari 4, dan lebarnya ditingkatkan menjadi _95 derajat_ dari 65.\n\n_+4:_ Jangkauan serangan elemen ditingkatkan menjadi _8 petak_ dari 4, dan lebarnya ditingkatkan menjadi _105 derajat_ dari 65.
actors.hero.talent.elemental_reach.title=jangkauan elemen
actors.hero.talent.elimination_match.desc=_+1:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki biaya pengisian daya yang _dikurangi 16%_.\n\n_+2:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki biaya pengisian daya yang _dikurangi 30%_.\n\n_+3:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki biaya pengisian daya yang _dikurangi 40%_.\n\n_+4:_ Jika Duelis menantang lagi dalam 3 giliran setelah duel berakhir, tantangan tersebut memiliki biaya pengisian daya yang _dikurangi 50%_.
actors.hero.talent.elimination_match.title=pertandingan eliminasi
actors.hero.talent.empowered_strike.desc=_+1:_ Serangan jarak dekat pertama Battlemage dengan tongkatnya setelah menyetrumnya memberikan _+16% kerusakan_ dan efek bonus tongkat mendapatkan _+50% kekuatan_.\n\n_+2: Serangan jarak dekat pertama Battlemage dengan tongkatnya setelah menyetrumnya memberikan _+33% kerusakan_ dan efek bonus tongkat mendapatkan _+100% kekuatan_.\n\n_+3: Serangan jarak dekat pertama Battlemage dengan tongkatnya setelah menyetrumnya memberikan _+50% kerusakan_ dan efek bonus tongkat mendapatkan _+150% kekuatan_.
actors.hero.talent.empowered_strike.title=pemogokan yang diberdayakan
actors.hero.talent.empowering_meal.desc=_+1:_ Memakan makanan memberi Penyihir _2 bonus kerusakan_ pada 3 kali berikutnya dia memberikan kerusakan dengan tongkat sihir.\n\n_+2:_ Memakan makanan memberi Penyihir _3 bonus kerusakan_ pada 3 kali berikutnya dia memberikan kerusakan dengan tongkat sihir.
actors.hero.talent.empowering_meal.title=makanan yang memberdayakan
actors.hero.talent.endless_rage.desc=_+1:_ Berserker dapat mencapai maksimal _116% amarah_.\n\n_+2:_ Berserker dapat mencapai maksimal _133% amarah_.\n\n_+3:_ Berserker dapat mencapai maksimal _150% amarah_.\n\nSetiap poin amarah di atas 100% meningkatkan perisai berserk sebesar 1% dan mengurangi cooldown sebesar 1%, tetapi tidak meningkatkan bonus damage melebihi +50%.
actors.hero.talent.endless_rage.title=amarah tak berujung
actors.hero.talent.energizing_meal.desc=_+1:_ Memakan makanan membutuhkan 1 giliran bagi Penyihir dan memberinya _5 giliran untuk mengisi ulang tongkat sihir_.\n\n_+2:_ Memakan makanan membutuhkan 1 giliran bagi Penyihir dan memberinya _8 giliran untuk mengisi ulang tongkat sihir_.
actors.hero.talent.energizing_meal.title=makanan yang memberi energi
actors.hero.talent.enhanced_combo.desc=_+1:_ Saat kombo Gladiator mencapai 7 atau lebih tinggi, jangkauan dorongan Clobber meningkat menjadi 3, menimbulkan vertigo, dan dapat menjatuhkan musuh ke dalam jurang.\n\n_+2:_ Selain manfaat +1, saat kombo Gladiator mencapai 9 atau lebih tinggi, Parry berfungsi pada beberapa serangan.\n\n_+3:_ Selain manfaat +1 dan +2, Gladiator dapat melompat hingga kombo/3 petak saat menggunakan Slam, Crush, atau Fury.
actors.hero.talent.enhanced_combo.title=kombinasi yang disempurnakan
actors.hero.talent.enhanced_lethality.desc=_+1:_ Assassin dapat membunuh musuh yang tersisa dengan kesehatan di bawah _4/13/27/67%_ per level persiapan, naik dari 3/10/20/50%.\n\n_+2:_ Assassin dapat membunuh musuh yang tersisa dengan kesehatan di bawah _5/17/33/83%_ per level persiapan, naik dari 3/10/20/50%.\n\n_+3:_ Assassin dapat membunuh musuh yang tersisa dengan kesehatan di bawah _6/20/40/100%_ per level persiapan, naik dari 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=peningkatan tingkat mematikan
actors.hero.talent.enhanced_rings.desc=_+1:_ Saat Rogue menggunakan artefak, cincinnya mendapatkan peningkatan +1 selama _3 putaran_.\n\n_+2:_ Saat Rogue menggunakan artefak, cincinnya mendapatkan peningkatan +1 selama _6 putaran_.\n\n_+3:_ Saat Rogue menggunakan artefak, cincinnya mendapatkan peningkatan +1 selama _9 putaran_.
actors.hero.talent.enhanced_rings.title=cincin yang ditingkatkan
actors.hero.talent.enlightening_meal.desc=_+1:_ Memakan makanan membutuhkan 1 giliran bagi Pendeta dan memberi mereka _0,67 muatan_ pada kitab suci mereka.\n\n_+2:_ Memakan makanan membutuhkan 1 giliran bagi Pendeta dan memberi mereka _1 muatan_ pada kitab suci mereka.
actors.hero.talent.enlightening_meal.meta_desc=Jika talenta ini diperoleh oleh hero yang berbeda, maka talenta ini akan memberikan 2 giliran pengisian ulang tongkat sihir dan artefak dengan bonus +1, atau 3 giliran dengan bonus +2. Talenta ini tidak dapat digunakan untuk mengisi ulang tanduk kelimpahan.
actors.hero.talent.enlightening_meal.title=Santapan yang Mencerahkan
actors.hero.talent.enraged_catalyst.desc=_+1:_ Mantra dan kutukan pada senjata Berserker lebih sering aktif seiring meningkatnya amarahnya, hingga maksimal _15% lebih sering_ pada amarah 100%.\n\n_+2:_ Mantra dan kutukan pada senjata Berserker lebih sering aktif seiring meningkatnya amarahnya, hingga maksimal _30% lebih sering_ pada amarah 100%.\n\n_+3:_ Mantra dan kutukan pada senjata Berserker lebih sering aktif seiring meningkatnya amarahnya, hingga maksimal _45% lebih sering_ pada amarah 100%.
actors.hero.talent.enraged_catalyst.title=katalis yang marah
actors.hero.talent.evasive_armor.desc=_+1:_ Saat berlari bebas, Freerunner mendapat tambahan _+1 penghindaran_ per kelebihan poin kekuatan pada armornya.\n\n_+2:_ Saat berlari bebas, Freerunner mendapat tambahan _+2 penghindaran_ per kelebihan poin kekuatan pada armornya.\n\n_+3:_ Saat berlari bebas, Freerunner mendapat tambahan _+3 penghindaran_ per titik kekuatan berlebih pada armornya.
actors.hero.talent.evasive_armor.title=baju besi penghindar
actors.hero.talent.even_the_odds.desc=_+1:_ Prajurit memberikan tambahan _kerusakan bonus 5%_ untuk setiap musuh dalam jarak 2 petak saat efek bertahan berakhir.\n\n_+2:_ Prajurit memberikan tambahan _kerusakan bonus 10%_ untuk setiap musuh dalam jarak 2 petak saat efek bertahan berakhir.\n\n_+3:_ Prajurit memberikan tambahan _kerusakan bonus 15%_ untuk setiap musuh dalam jarak 2 petak saat efek bertahan berakhir.\n\n_+4:_ Prajurit memberikan tambahan _kerusakan bonus 20%_ untuk setiap musuh dalam jarak 2 petak saat efek bertahan berakhir.
actors.hero.talent.even_the_odds.title=menyamakan peluang
actors.hero.talent.excess_charge.desc=_+1:_ Saat tongkat Battlemage terisi penuh, serangan berikutnya akan memberinya _0,67 perisai_ per level tongkat.\n\n_+2:_ Saat tongkat Battlemage terisi penuh, serangan berikutnya akan memberinya _1,33 perisai_ per level tongkat.\n\n_+3:_ Saat tongkat Battlemage terisi penuh, serangan berikutnya akan memberinya _2 perisai_ per level tongkat.
actors.hero.talent.excess_charge.title=biaya tambahan
actors.hero.talent.expanding_wave.desc=_+1:_ Jangkauan Shockwave ditingkatkan menjadi _6 petak_ dari 5, dan lebarnya ditingkatkan menjadi _75 derajat_ dari 60.\n\n_+2:_ Jangkauan Shockwave ditingkatkan menjadi _7 petak_ dari 5, dan lebarnya ditingkatkan menjadi _90 derajat_ dari 60.\n\n_+3:_ Jangkauan Shockwave ditingkatkan menjadi _8 petak_ dari 5, dan lebarnya ditingkatkan menjadi _105 derajat_ dari 60.\n\n_+4:_ Jangkauan Shockwave ditingkatkan menjadi _9 petak_ dari 5, dan lebarnya ditingkatkan menjadi _120 derajat_ dari 60.
actors.hero.talent.expanding_wave.title=gelombang yang meluas
actors.hero.talent.expose_weakness.desc=_+1:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _2 giliran_.\n\n_+2:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _4 giliran_.\n\n_+3:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _6 giliran_.\n\n_+4:_ Musuh yang menyerang bayangan Duelis menjadi lemah dan rentan selama _8 giliran_.
actors.hero.talent.expose_weakness.title=mengungkap kelemahan
actors.hero.talent.fan_of_blades.desc=_+1:_ Bilah spektral dapat mengenai hingga _1 target tambahan_ dengan kerusakan 50%. Target harus terlihat dan berada dalam area efek kerucut _30 derajat_.\n\n_+2:_ Bilah spektral dapat mengenai hingga _2 target tambahan_ dengan kerusakan 50%. Target harus terlihat dan berada dalam area efek kerucut _60 derajat_.\n\n_+3:_ Bilah spektral dapat mengenai hingga _3 target tambahan_ dengan kerusakan 50%. Target harus terlihat dan berada dalam area efek kerucut _90 derajat_.\n\n_+4:_ Bilah spektral dapat mengenai hingga _4 target tambahan_ dengan kerusakan 50%. Target harus terlihat dan berada dalam area efek kerucut _120 derajat_.
actors.hero.talent.fan_of_blades.title=kipas bilah
actors.hero.talent.farsight.desc=_+1:_ Jangkauan penglihatan Sniper _ditingkatkan sebesar 25%_.\n\n_+2:_ Jangkauan penglihatan Sniper _ditingkatkan sebesar 50%_.\n\n_+3:_ Jangkauan penglihatan Sniper _ditingkatkan sebesar 75%_.
actors.hero.talent.farsight.title=pandangan jauh
actors.hero.talent.fear_the_reaper.desc=_+1:_ Ketika musuh yang ditandai kematian mencapai 0 hp, mereka menjadi _lumpuh_.\n\n_+2:_ Ketika musuh yang ditandai kematian mencapai 0 hp, mereka menjadi _ketakutan dan lumpuh_.\n\n_+3:_ Ketika musuh yang ditandai kematian mencapai 0 hp, mereka menjadi _ketakutan dan lumpuh_ dan musuh dalam jarak 3 petak menjadi _lumpuh_.\n\n_+4:_ Ketika musuh yang ditandai kematian mencapai 0 hp, mereka menjadi _ketakutan dan lumpuh_ dan musuh dalam jarak 3 petak menjadi _ketakutan dan lumpuh_.
actors.hero.talent.fear_the_reaper.title=takutlah pada malaikat maut
actors.hero.talent.feigned_retreat.desc=_+1:_ Jika musuh menyerang bayangan Duelis, dia mendapatkan _2 giliran_ kecepatan.\n\n_+2:_ Jika musuh menyerang bayangan Duelis, dia mendapatkan _4 giliran_ kecepatan.\n\n_+3:_ Jika musuh menyerang bayangan Duelis, dia mendapatkan _6 giliran_ kecepatan.\n\n_+4:_ Jika musuh menyerang bayangan Duelis, dia mendapatkan _8 giliran_ kecepatan.
actors.hero.talent.feigned_retreat.title=mundur pura-pura
actors.hero.talent.fire_everything.desc=_+1:_ Sihir liar sekarang menembak _5 kali_ naik dari 4, dan setiap tongkat sihir memiliki _peluang 25%_ untuk dapat digunakan 3 kali.\n\n_+2:_ Sihir liar sekarang menembak _6 kali_ naik dari 4, dan setiap tongkat sihir memiliki _peluang 50%_ untuk dapat digunakan 3 kali.\n\n_+3:_ Sihir liar sekarang menembak _7 kali_ naik dari 4, dan setiap tongkat sihir memiliki _peluang 75%_ untuk dapat digunakan 3 kali.\n\n_+4:_ Sihir liar sekarang menembak _8 kali_ naik dari 4, dan setiap tongkat sihir memiliki _peluang 100%_ untuk dapat digunakan 3 kali.
actors.hero.talent.fire_everything.title=bakar semuanya
actors.hero.talent.flash.desc=_+1:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Flash_ untuk berteleportasi hingga _3 petak_ jauhnya.\n\n_+2:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Flash_ untuk berteleportasi hingga _4 petak_ jauhnya.\n\n_+3:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Flash_ untuk berteleportasi hingga _5 petak_ jauhnya.\n\n_+4:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Flash_ untuk berteleportasi hingga _6 petak_ jauhnya.\n\nFlash awalnya membutuhkan 2 muatan buku sihir, dan 1 muatan tambahan untuk setiap penggunaan dalam wujud ascended yang sama.
actors.hero.talent.flash.title=kilatan
actors.hero.talent.focused_meal.desc=_+1:_ Memakan makanan membutuhkan 1 giliran bagi Duelis dan memberinya _0,67 muatan_ pada senjatanya.\n\n_+2:_ Memakan makanan membutuhkan 1 giliran bagi Duelis dan memberinya _1 muatan_ pada senjatanya.
actors.hero.talent.focused_meal.meta_desc=_Jika talenta ini diperoleh oleh hero lain_, talenta ini akan memberikan bonus damage pada serangan berikutnya yang setara dengan level/3 hero tersebut pada +1, atau level/2 hero tersebut pada +2.
actors.hero.talent.focused_meal.title=makanan terfokus
actors.hero.talent.followup_strike.desc=_+1:_ Saat Pemburu mengenai musuh dengan busur atau senjata lemparnya, serangan jarak dekat berikutnya terhadap musuh tersebut memberikan _2 kerusakan bonus_.\n\n_+2:_ Saat Pemburu mengenai musuh dengan busur atau senjata lemparnya, serangan jarak dekat berikutnya terhadap musuh tersebut memberikan _3 kerusakan bonus_.
actors.hero.talent.followup_strike.title=serangan lanjutan
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Serangan dari elang roh membutakan musuh selama _2 giliran_.\n\n_+2:_ Serangan dari elang roh membutakan musuh selama _5 giliran_.\n\n_+3:_ Serangan dari elang roh membutakan musuh selama _5 giliran_ dan melumpuhkan mereka selama _2 giliran_.\n\n_+4:_ Serangan dari elang roh membutakan musuh selama _5 giliran_ dan melumpuhkan mereka selama _5 giliran_.
actors.hero.talent.go_for_the_eyes.title=bidik matanya
actors.hero.talent.growing_power.desc=_+1:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam ditingkatkan menjadi _38% dan 125%_, dari 33% dan 100%.\n\n_+2:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam ditingkatkan menjadi _42% dan 150%_, dari 33% dan 100%.\n\n_+3:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam ditingkatkan menjadi _46% dan 175%_, dari 33% dan 100%.\n\n_+4:_ Peningkatan serangan dan kecepatan gerak dari kekuatan alam ditingkatkan menjadi _50% dan 200%_, dari 33% dan 100%.
actors.hero.talent.growing_power.title=kekuatan yang tumbuh
actors.hero.talent.hallowed_ground.desc=_+1:_ Pendeta dapat merapal _Tanah Suci_, mantra yang menyucikan medan di area _3x3_ selama 20 giliran, dengan biaya 2 muatan.\n\n_+2:_ Pendeta dapat merapal _Tanah Suci_, mantra yang menyucikan medan di area _5x5_ selama 20 giliran, dengan biaya 2 muatan.\n\n_+3:_ Pendeta dapat merapal _Tanah Suci_, mantra yang menyucikan medan di area _7x7_ selama 20 giliran, dengan biaya 2 muatan.\n\nSaat dirapal, Tanah Suci menyembuhkan sekutu sebesar 15 HP, mengikat musuh untuk sementara, dan menyebarkan rumput pendek. Setelah itu, mantra ini perlahan menyembuhkan sekutu, melumpuhkan musuh, dan menyebabkan rumput tinggi tumbuh secara acak. Tanah suci memberikan perlindungan kepada Pendeta alih-alih penyembuhan dan hancur oleh api.
actors.hero.talent.hallowed_ground.title=tanah suci
actors.hero.talent.hasty_retreat.desc=_+1:_ Setelah berkedip, Rogue mendapatkan _1 giliran_ kecepatan dan tembus pandang.\n\n_+2:_ Setelah berkedip, Rogue mendapatkan _2 giliran_ kecepatan dan tembus pandang.\n\n_+3:_ Setelah berkedip, Rogue mendapatkan _3 giliran_ kecepatan dan tembus pandang.\n\n_+4:_ Setelah berkedip, Rogue mendapatkan _4 giliran_ kecepatan dan tembus pandang.
actors.hero.talent.hasty_retreat.title=mundur terburu-buru
actors.hero.talent.hearty_meal.desc=_+1:_ Memakan makanan menyembuhkan Prajurit sebesar _4 HP_ ketika kesehatannya berada pada atau di bawah 33%.\n\n_+2:_ Memakan makanan menyembuhkan Prajurit sebesar _6 HP_ ketika kesehatannya berada pada atau di bawah 33%.
actors.hero.talent.hearty_meal.title=makanan yang mengenyangkan
actors.hero.talent.heightened_senses.desc=_+1:_ Sang Pemburu mendapatkan penglihatan pikiran pada karakter dalam jarak _2 petak dari posisinya_.\n\n_+2:_ Sang Pemburu mendapatkan penglihatan pikiran pada karakter dalam jarak _3 petak dari posisinya_.
actors.hero.talent.heightened_senses.title=indra yang lebih tajam
actors.hero.talent.heroic_energy.desc=_+1:_ Biaya pengisian kemampuan armor hero berkurang _12%_.\n\n_+2: Biaya pengisian kemampuan armor hero berkurang _23%_.\n\n_+3: Biaya pengisian kemampuan armor hero berkurang _32%_.\n\n_+4: Biaya pengisian kemampuan armor hero berkurang _40%_.
actors.hero.talent.heroic_energy.rat_title=energi ratroik
actors.hero.talent.heroic_energy.title=energi heroik
actors.hero.talent.hold_fast.desc=_+1:_ Saat Prajurit menunggu, ia mendapatkan _1-2 armor_ dan memperlambat penurunan buff kombo dan perisai sebesar _50%_ hingga ia bergerak.\n\n_+2:_ Saat Prajurit menunggu, ia mendapatkan _2-4 armor_ dan memperlambat penurunan buff kombo dan perisai sebesar _75%_ hingga ia bergerak.\n\n_+3:_ Saat Prajurit menunggu, ia mendapatkan _3-6 armor_ dan memperlambat penurunan buff kombo dan perisai sebesar _100%_ hingga ia bergerak.
actors.hero.talent.hold_fast.title=berpegang teguh
actors.hero.talent.holy_intuition.desc=_+1:_ Pendeta dapat merapal _Intuisi Suci_, mantra yang mengungkapkan apakah suatu barang terkutuk atau tidak dengan biaya _3 muatan._\n\n_+2:_ Pendeta dapat merapal _Intuisi Suci_, mantra yang mengungkapkan apakah suatu barang terkutuk atau tidak dengan biaya _2 muatan._
actors.hero.talent.holy_intuition.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, talenta ini akan memungkinkan hero tersebut untuk mengidentifikasi status kutukan pada item terkutuk tepat sebelum memakainya, dengan peluang 15% pada +1 atau 25% pada +2.
actors.hero.talent.holy_intuition.title=intuisi suci
actors.hero.talent.holy_lance.desc=_+1:_ Pendeta dapat menggunakan _Holy Lance_, mantra dahsyat yang memberikan _30-55 kerusakan_ dengan biaya 4 muatan.\n\n_+2:_ Pendeta dapat menggunakan _Holy Lance_, mantra dahsyat yang memberikan _45-83 kerusakan_ dengan biaya 4 muatan.\n\n_+3:_ Pendeta dapat menggunakan _Holy Lance_, mantra dahsyat yang memberikan _60-110 kerusakan_ dengan biaya 4 muatan.\n\nHoly Lance selalu memberikan kerusakan maksimum pada musuh iblis dan mayat hidup. Holy Lance memiliki waktu pendinginan 30 giliran sebelum dapat digunakan kembali.
actors.hero.talent.holy_lance.title=tombak suci
actors.hero.talent.impact_wave.desc=_+1:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya terlempar _2 petak_ ke belakang dan memiliki _peluang 25%_ untuk menjadi rentan selama 5 giliran.\n\n_+2:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya terlempar _3 petak_ ke belakang dan memiliki _peluang 50%_ untuk menjadi rentan selama 5 giliran.\n\n_+3:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya terlempar _4 petak_ ke belakang dan memiliki _peluang 75%_ untuk menjadi rentan selama 5 giliran.\n\n_+4:_ Saat Prajurit mendarat setelah melompat, semua musuh di sekitarnya terlempar _5 petak_ ke belakang dan memiliki _peluang 100%_ untuk menjadi rentan selama 5 giliran.
actors.hero.talent.impact_wave.title=gelombang benturan
actors.hero.talent.improvised_projectiles.desc=_+1:_ Prajurit dapat membutakan musuh selama _2 putaran_ dengan melempar benda apa pun yang bukan senjata lempar ke arah mereka. Ini memiliki waktu pendinginan 50 putaran.\n\n_+2:_ Prajurit dapat membutakan musuh selama _3 putaran_ dengan melempar benda apa pun yang bukan senjata lempar ke arah mereka. Ini memiliki waktu pendinginan 50 putaran.
actors.hero.talent.improvised_projectiles.title=proyektil improvisasi
actors.hero.talent.inscribed_power.desc=_+1:_ Saat Penyihir membaca gulungan atau menggunakan item mantra, _2 serangan tongkat sihir berikutnya_ mendapatkan +2 level.\n\n_+2:_ Saat Penyihir membaca gulungan atau menggunakan item mantra, _3 serangan tongkat sihir berikutnya_ mendapatkan +2 level.\n\nJumlah serangan tongkat sihir yang ditingkatkan digandakan saat menggunakan gulungan peningkatan, transmutasi, atau item alkimia yang harus dibuat menggunakan gulungan tersebut.\n\nUntuk item alkimia dengan kuantitas keluaran yang lebih tinggi (misalnya sebagian besar mantra), bakat ini memiliki peluang untuk dipicu berdasarkan berapa banyak item tersebut yang diproduksi.
actors.hero.talent.inscribed_power.title=kekuatan tertulis
actors.hero.talent.inscribed_stealth.desc=_+1:_ Rogue mendapatkan _3 giliran_ tembus pandang setelah membaca gulungan atau menggunakan item mantra.\n\n_+2:_ Rogue mendapatkan _5 giliran_ tembus pandang setelah membaca gulungan atau menggunakan item mantra.\n\nDurasi tembus pandang digandakan saat menggunakan gulungan peningkatan, gulungan transmutasi, atau item alkimia yang harus dibuat menggunakan gulungan tersebut.\n\nUntuk item alkimia dengan kuantitas output yang lebih tinggi (misalnya sebagian besar mantra), bakat ini memiliki peluang untuk aktif berdasarkan berapa banyak item tersebut yang diproduksi.
actors.hero.talent.inscribed_stealth.title=terukir siluman
actors.hero.talent.invigorating_meal.desc=_+1:_ Memakan makanan membutuhkan 1 giliran bagi Pemburu (buah beri dimakan seketika) dan memberinya _1 giliran kecepatan_.\n\n_+2:_ Memakan makanan membutuhkan 1 giliran bagi Pemburu (buah beri dimakan seketika) dan memberinya _2 giliran kecepatan_.
actors.hero.talent.invigorating_meal.title=makanan yang menyegarkan
actors.hero.talent.invigorating_victory.desc=_+1:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, ia memulihkan _5 HP ditambah 30% dari kerusakan_ yang diterimanya selama duel.\n\n_+2:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, ia memulihkan _10 HP ditambah 50% dari kerusakan_ yang diterimanya selama duel.\n\n_+3:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, ia memulihkan _15 HP ditambah 65% dari kerusakan_ yang diterimanya selama duel.\n\n_+4:_ Jika Duelis mengalahkan targetnya sebelum duel berakhir, ia memulihkan _20 HP ditambah 75% dari kerusakan_ yang diterimanya selama duel.
actors.hero.talent.invigorating_victory.title=kemenangan yang membangkitkan semangat
actors.hero.talent.iron_stomach.desc=_+1:_ Memakan makanan membutuhkan 1 giliran bagi Prajurit dan memberinya _75% ketahanan terhadap kerusakan_ saat makan.\n\n_+2:_ Memakan makanan membutuhkan 1 giliran bagi Prajurit dan memberinya _100% ketahanan terhadap kerusakan_ saat makan.
actors.hero.talent.iron_stomach.title=perut besi
actors.hero.talent.iron_will.desc=_+1:_ Perisai yang diberikan oleh segel Prajurit _ditingkatkan sebesar 1_.\n\n_+2:_ Perisai yang diberikan oleh segel Prajurit _ditingkatkan sebesar 2_.
actors.hero.talent.iron_will.meta_desc=Jika talenta ini diperoleh oleh hero yang berbeda, maka secara pasif akan memberikan versi perisai maksimal 1 atau 2 dari efek segel rusak milik Warrior.
actors.hero.talent.iron_will.title=tekad baja
actors.hero.talent.judgement.desc=_+1:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Judgement_, yang memberikan _10-20 kerusakan_ kepada semua musuh yang terlihat.\n\n_+2:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Judgement_, yang memberikan _15-30 kerusakan_ kepada semua musuh yang terlihat.\n\n_+3:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Judgement_, yang memberikan _20-40 kerusakan_ kepada semua musuh yang terlihat.\n\n_+4:_ Saat dalam Wujud Ascended, Pendeta dapat menggunakan _Judgement_, yang memberikan _25-50 kerusakan_ kepada semua musuh yang terlihat.\n\n_Judgement membutuhkan 3 muatan buku sihir. Judgement memberikan +33% kerusakan untuk setiap mantra yang telah diucapkan oleh Cleric sejak memasuki bentuk ascended atau sejak pengucapan Judgement terakhir.
actors.hero.talent.judgement.title=keputusan
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladin dapat menggunakan _Lay on Hands_, mantra yang langsung menyembuhkan karakter di dekatnya sebesar _15 HP_, atau memberi Paladin _15 perisai_, dengan biaya 1 muatan.__+2:_ Paladin dapat menggunakan _Lay on Hands_, mantra yang langsung menyembuhkan karakter di dekatnya sebesar _20 HP_, atau memberi Paladin _20 perisai_, dengan biaya 1 muatan.__+3:_ Paladin dapat menggunakan _Lay on Hands_, mantra yang langsung menyembuhkan karakter di dekatnya sebesar _25 HP_, atau memberi Paladin _25 perisai_, dengan biaya 1 muatan.__Kelebihan penyembuhan dari mantra ini diubah menjadi perisai. Lay on Hands dapat diucapkan berulang kali, tetapi tidak dapat memberikan perlindungan lebih dari tiga kali pengucapan sekaligus.
actors.hero.talent.lay_on_hands.title=meletakkan tangan
actors.hero.talent.lethal_defense.desc=_+1:_ Saat Gladiator membunuh musuh dengan gerakan kombo, cooldown perisai segel pecahnya dikurangi 50 giliran.\n\n_+2: Saat Gladiator membunuh musuh dengan gerakan kombo, cooldown perisai segel pecahnya dikurangi 100 giliran.\n\n_+3: Saat Gladiator membunuh musuh dengan gerakan kombo, cooldown perisai segel pecahnya dikurangi 150 giliran.\n\n Cooldown perisai dapat dikurangi hingga serendah -150 giliran dengan talenta ini, yang berarti akan segera tersedia kembali setelah diaktifkan.
actors.hero.talent.lethal_defense.title=pertahanan mematikan
actors.hero.talent.lethal_haste.desc=_+1:_ Saat Duelis memberikan pukulan mematikan pada musuh dengan kemampuan senjata, dia mendapatkan _3 giliran_ pergerakan instan.\n\n_+2:_ Saat Duelis memberikan pukulan mematikan pada musuh dengan kemampuan senjata, dia mendapatkan _5 giliran_ pergerakan instan.
actors.hero.talent.lethal_haste.meta_desc=Jika talenta ini diperoleh oleh hero yang berbeda, talenta ini akan aktif melalui serangan senjata biasa, dengan waktu pendinginan 100 giliran.
actors.hero.talent.lethal_haste.title=kecepatan mematikan
actors.hero.talent.lethal_momentum.desc=_+1:_ Saat Prajurit memberikan pukulan mematikan pada musuh dengan senjata fisik, ia memiliki peluang _67%_ untuk tidak mengambil giliran.\n\n_+2:_ Saat Prajurit memberikan pukulan mematikan pada musuh dengan senjata fisik, ia memiliki peluang _100%_ untuk tidak mengambil giliran.
actors.hero.talent.lethal_momentum.title=momentum mematikan
actors.hero.talent.life_link.desc=Pendeta dapat menggunakan mantra _Life Link_ antara dirinya dan sekutu yang telah diperkuat dengan biaya 2 muatan. Mantra ini menyebabkan kerusakan dibagi antara Pendeta dan sekutunya, dan menyebabkan mantra pendeta bermanfaat tingkat 3 atau lebih rendah berlaku untuk keduanya jika salah satu dari mereka terkena dampaknya.\n\n_+1:_ Life Link berlangsung selama _10 putaran_ dan meningkatkan bonus Power of Many menjadi _-35% kerusakan yang diterima._\n\n_+2:_ Life Link berlangsung selama _13 putaran_ dan meningkatkan bonus Power of Many menjadi _-40% kerusakan yang diterima._\n\n_+3:_ Life Link berlangsung selama _17 putaran_ dan meningkatkan bonus Power of Many menjadi _-45% kerusakan yang diterima._\n\n_+4:_ Life Link berlangsung selama _20 putaran_ dan meningkatkan bonus Power of Many menjadi _-50% kerusakan yang diterima._
actors.hero.talent.life_link.title=hubungan kehidupan
actors.hero.talent.light_cloak.desc=_+1:_ Rogue dapat menggunakan jubah bayangannya saat tidak dikenakan, tetapi pengisian ulangnya _25% lebih cepat_ saat tidak dikenakan.\n\n_+2:_ Rogue dapat menggunakan jubah bayangannya saat tidak dikenakan, tetapi pengisian ulangnya _50% lebih cepat_ saat tidak dikenakan.\n\n_+3:_ Rogue dapat menggunakan jubah bayangannya saat tidak dikenakan, tetapi pengisian ulangnya _75% lebih cepat_ saat tidak dikenakan.
actors.hero.talent.light_cloak.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, maka talenta ini akan meningkatkan kecepatan pengisian semua artefak sebesar 7/13/20% pada +1/+2/+3.
actors.hero.talent.light_cloak.title=jubah tipis
actors.hero.talent.light_reading.desc=_+1:_ Pendeta dapat menggunakan kitab sucinya meskipun tidak sedang dikenakan, tetapi pengisian ulangnya hanya 25% kecepatannya saat tidak dikenakan.\n\n_+2:_ Pendeta dapat menggunakan kitab sucinya meskipun tidak sedang dikenakan, tetapi pengisian ulangnya hanya 50% kecepatannya saat tidak dikenakan.\n\n_+3:_ Pendeta dapat menggunakan kitab sucinya meskipun tidak sedang dikenakan, tetapi pengisian ulangnya hanya 75% kecepatannya saat tidak dikenakan.
actors.hero.talent.light_reading.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, maka talenta ini akan meningkatkan kecepatan pengisian ulang semua tongkat sihir sebesar 7/13/20% pada +1/+2/+3.
actors.hero.talent.light_reading.title=Bacaan ringan
actors.hero.talent.lingering_magic.desc=_+1:_ Saat Penyihir menyerang dengan tongkat sihir atau staf, serangan fisik berikutnya memberikan _1-2 kerusakan bonus_.\n\n_+2:_ Saat Penyihir menyerang dengan tongkat sihir atau staf, serangan fisik berikutnya memberikan _2 kerusakan bonus_.
actors.hero.talent.lingering_magic.title=keajaiban yang masih terasa
actors.hero.talent.liquid_agility.desc=_+1:_ Saat meminum atau melempar ramuan, minuman, atau eliksir, Duelis memiliki _3x penghindaran_, dan memiliki _3x akurasi_ pada serangan jarak dekat berikutnya dalam 5 giliran.\n\n_+2:_ Saat meminum atau melempar ramuan, minuman, atau eliksir, Duelis memiliki _penghindaran tak terbatas_, dan memiliki _akurasi tak terbatas_ pada serangan jarak dekat berikutnya dalam 5 giliran.\n\nBonus ini berlangsung selama satu giliran dan serangan tambahan saat menggunakan ramuan kekuatan, pengalaman, atau item alkimia yang harus dibuat menggunakan ramuan tersebut.\n\nUntuk item alkimia dengan kuantitas keluaran yang lebih tinggi (misalnya, minuman air), bakat ini memiliki peluang untuk terpicu berdasarkan berapa banyak item tersebut yang diproduksi.
actors.hero.talent.liquid_agility.title=kelincahan cair
actors.hero.talent.liquid_nature.desc=_+1:_ Saat Pemburu meminum atau melempar ramuan, minuman, atau eliksir, _hingga 4 petak rumput_ tumbuh di area sekitarnya, dan musuh di dekatnya akan terikat selama _1 giliran_.\n\n_+2:_ Saat Pemburu meminum atau melempar ramuan, minuman, atau eliksir, _hingga 6 petak rumput_ tumbuh di area sekitarnya, dan musuh di dekatnya akan terikat selama _2 giliran_.\n\nJumlah rumput dan durasi terikat digandakan saat menggunakan ramuan kekuatan, pengalaman, atau item alkimia yang harus dibuat menggunakan ramuan tersebut.\n\nUntuk item alkimia dengan kuantitas keluaran yang lebih tinggi (misalnya, minuman air), bakat ini memiliki peluang untuk terpicu berdasarkan berapa banyak item tersebut yang diproduksi.
actors.hero.talent.liquid_nature.title=sifat cair
actors.hero.talent.liquid_willpower.desc=_+1:_ Prajurit mendapatkan _6,5% dari HP maksimalnya dalam perisai_ saat meminum atau melempar ramuan, minuman, atau eliksir.\n\n_+2:_ Prajurit mendapatkan _10% dari HP maksimalnya dalam perisai_ saat meminum atau melempar ramuan, minuman, atau eliksir.\n\nJumlah perisai digandakan saat menggunakan ramuan kekuatan, pengalaman, atau item alkimia yang harus dibuat menggunakan ramuan tersebut.\n\nUntuk item alkimia dengan kuantitas output yang lebih tinggi (misalnya, minuman air), bakat ini memiliki peluang untuk aktif berdasarkan berapa banyak item tersebut yang diproduksi.
actors.hero.talent.liquid_willpower.title=kemauan cair
actors.hero.talent.longrange_warp.desc=_+1:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya pengisian 150%.\n\n_+2:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya pengisian 117%.\n\n_+3:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya pengisian 83%.\n\n_+4:_ Penyihir sekarang dapat berpindah antar lantai, dengan biaya pengisian 50%.\n\nPenyihir tidak dapat menggunakan teleportasi jarak jauh untuk meninggalkan lantai yang terkunci.
actors.hero.talent.longrange_warp.title=Warp Jarak Jauh
actors.hero.talent.mind_form.desc=Pendeta dapat menggunakan _Mind Form_, yang memberikan kekuatan tongkat sihir atau senjata lempar yang telah digunakan Pendeta dalam permainan ini kepada Trinity, dengan biaya 3 muatan. _+1:_ Saat Trinity digunakan, Pendeta menggunakan efek sengatan atau lemparan dari item yang dipilih, seolah-olah itu adalah _+3._ _+2:_ Saat Trinity digunakan, Pendeta menggunakan efek sengatan atau lemparan dari item yang dipilih, seolah-olah itu adalah _+4._ _+3:_ Saat Trinity digunakan, Pendeta menggunakan efek sengatan atau lemparan dari item yang dipilih, seolah-olah itu adalah _+5._ _+4:_ Saat Trinity digunakan, Pendeta menggunakan efek sengatan atau lemparan dari item yang dipilih, seolah-olah itu adalah _+6._\n\nTrinity hanya dapat diisi dengan satu efek pikiran dalam satu waktu.
actors.hero.talent.mind_form.title=bentuk pikiran
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Pendeta dapat menggunakan _Doa Mnemonik_, mantra yang memperpanjang buff/debuff pada sekutu/musuh selama _3 putaran_ dengan biaya 1 muatan.\n\n_+2:_ Pendeta dapat menggunakan _Doa Mnemonik_, mantra yang memperpanjang buff/debuff pada sekutu/musuh selama _4 putaran_ dengan biaya 1 muatan.\n\n_+3:_ Pendeta dapat menggunakan _Doa Mnemonik_, mantra yang memperpanjang buff/debuff pada sekutu/musuh selama _5 putaran_ dengan biaya 1 muatan.\n\nDoa Mnemonik tidak memerlukan waktu untuk digunakan. Doa Mnemonik hanya dapat memperpanjang buff/debuff tertentu sekali, dan tidak dapat memperpanjang buff dari kemampuan armor.
actors.hero.talent.mnemonic_prayer.title=doa mnemonik
actors.hero.talent.monastic_vigor.desc=_+1:_ Jika Biksu memiliki _energi 100%_, kemampuannya diperkuat.\n\n_+2:_ Jika Biksu memiliki _energi 80% atau lebih_, kemampuannya diperkuat.\n\n_+3:_ Jika Biksu memiliki _energi 60% atau lebih_, kemampuannya diperkuat.\n\nSaat diperkuat:\n- Flurry menerapkan mantra senjata Anda\n- Fokus instan\n- Dash mendapatkan jangkauan +4\n- Tendangan Naga memberikan +50% kerusakan dan menerapkan efek dorongan mundur dan setrum ke semua musuh di sekitarnya\n- Meditasi perlahan menyembuhkan 20% HP yang hilang dan memberikan 80% ketahanan terhadap kerusakan.
actors.hero.talent.monastic_vigor.title=semangat monastik
actors.hero.talent.mystical_charge.desc=_+1:_ Menyerang dengan tongkatnya memberi Battlemage _0,5 giliran_ untuk mengisi ulang artefak.\n\n_+2:_ Menyerang dengan tongkatnya memberi Battlemage _1 giliran_ untuk mengisi ulang artefak.\n\n_+3:_ Menyerang dengan tongkatnya memberi Battlemage _1,5 giliran_ untuk mengisi ulang artefak.
actors.hero.talent.mystical_charge.title=muatan mistis
actors.hero.talent.mystical_meal.desc=_+1:_ Memakan makanan membutuhkan 1 giliran Rogue (jatah persediaan dimakan seketika) dan memberinya _3 giliran pengisian ulang artefak_.\n\n_+2:_ Memakan makanan membutuhkan 1 giliran Rogue (jatah persediaan dimakan seketika) dan memberinya _5 giliran pengisian ulang artefak_.\n\nTalenta ini tidak dapat digunakan untuk membiarkan tanduk kelimpahan mengisi ulang dirinya sendiri.
actors.hero.talent.mystical_meal.title=makanan mistis
actors.hero.talent.natures_aid.desc=_+1:_ Sang Pemburu mendapatkan 0-2 armor kulit kayu, yang memudar setiap _3 putaran_ ketika efek tanaman diaktifkan dalam penglihatannya.\n\n_+2:_ Sang Pemburu mendapatkan 0-2 armor kulit kayu, yang memudar setiap _5 putaran_ ketika efek tanaman diaktifkan dalam penglihatannya.
actors.hero.talent.natures_aid.title=bantuan alam
actors.hero.talent.natures_bounty.desc=_+1:_ Sang Pemburu dapat menemukan _4 buah beri_ yang tersembunyi di rerumputan tinggi saat ia menjelajahi beberapa lantai berikutnya di ruang bawah tanah.\n\n_+2:_ Sang Pemburu dapat menemukan _6 buah beri_ yang tersembunyi di rerumputan tinggi saat ia menjelajahi beberapa lantai berikutnya di ruang bawah tanah.\n\nBuah beri dimakan dengan cepat, mengembalikan sedikit rasa kenyang, dan mungkin mengandung biji yang dapat digunakan.
actors.hero.talent.natures_bounty.title=kekayaan alam
actors.hero.talent.natures_wrath.desc=_+1:_ Saat kekuatan alam aktif, tembakan dari busur roh memiliki peluang 8% untuk memicu efek tanaman berbahaya secara acak.\n\n_+2: Saat kekuatan alam aktif, tembakan dari busur roh memiliki peluang 17% untuk memicu efek tanaman berbahaya secara acak.\n\n_+3: Saat kekuatan alam aktif, tembakan dari busur roh memiliki peluang 25% untuk memicu efek tanaman berbahaya secara acak.\n\n_+4: Saat kekuatan alam aktif, tembakan dari busur roh memiliki peluang 33% untuk memicu efek tanaman berbahaya secara acak.\n\nTanaman yang dapat dipicu adalah: blindweed, firebloom, icecap, sorrowmoss, dan stormvine.
actors.hero.talent.natures_wrath.title=murka alam
actors.hero.talent.necromancers_minions.desc=_+1:_ Saat musuh yang ditandai jiwanya mati, Warlock memiliki peluang 13% untuk membangkitkannya sebagai hantu yang rusak.\n\n_+2:_ Saat musuh yang ditandai jiwanya mati, Warlock memiliki peluang 27% untuk membangkitkannya sebagai hantu yang rusak.\n\n_+3:_ Saat musuh yang ditandai jiwanya mati, Warlock memiliki peluang 40% untuk membangkitkannya sebagai hantu yang rusak.
actors.hero.talent.necromancers_minions.title=antek-antek ahli sihir
actors.hero.talent.patient_strike.desc=_+1:_ Jika Duelis menunggu sebelum melakukan serangan jarak dekat, dia akan memberikan _1-2 kerusakan bonus_.\n\n_+2:_ Jika Duelis menunggu sebelum melakukan serangan jarak dekat, dia akan memberikan _2 kerusakan bonus_.
actors.hero.talent.patient_strike.title=pemogokan pasien
actors.hero.talent.perfect_copy.desc=_+1:_ Klon bayangan mendapatkan _10%_ dari HP maksimal hero, dan dapat langsung bertukar tempat dengan hero hingga _1 petak_ jauhnya.\n\n_+2:_ Klon bayangan mendapatkan _20%_ dari HP maksimal hero, dan dapat langsung bertukar tempat dengan hero hingga _2 petak_ jauhnya.\n\n_+3:_ Klon bayangan mendapatkan _30%_ dari HP maksimal hero, dan dapat langsung bertukar tempat dengan hero hingga _3 petak_ jauhnya.\n\n_+4:_ Klon bayangan mendapatkan _40%_ dari HP maksimal hero, dan dapat langsung bertukar tempat dengan hero hingga _4 petak_ jauhnya.
actors.hero.talent.perfect_copy.title=salinan sempurna
actors.hero.talent.point_blank.desc=_+1:_ Saat Pemburu menggunakan busur atau senjata lempar pada jarak dekat, akurasinya menjadi _-25%_, bukan -50%.\n\n_+2:_ Saat Pemburu menggunakan busur atau senjata lempar pada jarak dekat, akurasinya _normal_, bukan -50%.\n\n_+3:_ Saat Pemburu menggunakan busur atau senjata lempar pada jarak dekat, akurasinya menjadi _+25%_, bukan -50%.\n\nPerhatikan bahwa senjata lempar atau busur roh selalu memiliki akurasi +50% saat digunakan dari jarak jauh.
actors.hero.talent.point_blank.title=langsung saja
actors.hero.talent.precise_assault.desc=_+1:_ Saat Duelis menggunakan kemampuan senjata, dia mendapatkan _akurasi 2x_ pada serangan jarak dekat berikutnya dalam 5 giliran.\n\n_+2:_ Saat Duelis menggunakan kemampuan senjata, dia mendapatkan _akurasi 5x_ pada serangan jarak dekat berikutnya dalam 5 giliran.\n\n_+3:_ Saat Duelis menggunakan kemampuan senjata, dia mendapatkan _akurasi tak terbatas_ pada serangan jarak dekat berikutnya dalam 5 giliran.
actors.hero.talent.precise_assault.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, maka akurasi serangan jarak dekat akan meningkat sebesar 10% pada +1, 20% pada +2, atau 30% pada +3.
actors.hero.talent.precise_assault.title=serangan tepat
actors.hero.talent.projectile_momentum.desc=_+1:_ Saat melakukan freerunning, Freerunner mendapatkan _+50% akurasi dan +15% kerusakan_ dengan senjata lempar.\n\n_+2:_ Saat melakukan freerunning, Freerunner mendapatkan _+100% akurasi dan +30% kerusakan_ dengan senjata lempar.\n\n_+3:_ Saat melakukan freerunning, Freerunner mendapatkan _+150% akurasi dan +45% kerusakan_ dengan senjata lempar.
actors.hero.talent.projectile_momentum.title=momentum proyektil
actors.hero.talent.projecting_blades.desc=_+1:_ Bilah spektral memiliki akurasi _+25%_, dan dapat menembus hingga _2 ubin padat_.\n\n_+2:_ Bilah spektral memiliki akurasi _+50%_, dan dapat menembus hingga _4 ubin padat_.\n\n_+3:_ Bilah spektral memiliki akurasi _+75%_, dan dapat menembus hingga _6 ubin padat_.\n\n_+4:_ Bilah spektral memiliki akurasi _+100%_, dan dapat menembus hingga _8 ubin padat_.
actors.hero.talent.projecting_blades.title=bilah yang menonjol
actors.hero.talent.protective_shadows.desc=_+1:_ Rogue mendapatkan satu perisai _setiap dua giliran_ saat dia tidak terlihat, _hingga maksimal 3_.\n\n_+2:_ Rogue mendapatkan satu perisai _setiap giliran_ saat dia tidak terlihat, _hingga maksimal 5_.
actors.hero.talent.protective_shadows.title=bayangan pelindung
actors.hero.talent.provoked_anger.desc=_+1:_ Saat buff perisai apa pun yang diterapkan pada Prajurit dihancurkan oleh kerusakan, serangan fisik berikutnya akan memberikan _3 kerusakan bonus_.\n\n_+2:_ Saat buff perisai apa pun yang diterapkan pada Prajurit dihancurkan oleh kerusakan, serangan fisik berikutnya akan memberikan _5 kerusakan bonus_.
actors.hero.talent.provoked_anger.title=memicu kemarahan
actors.hero.talent.ratforcements.desc=_+1:_ Menggunakan ratmogrify pada diri sendiri _menghasilkan 1_ tikus marsupial sekutu di sebelah Anda.\n\n_+2:_ Menggunakan ratmogrify pada diri sendiri _menghasilkan 2_ tikus marsupial sekutu di sebelah Anda.\n\n_+3:_ Menggunakan ratmogrify pada diri sendiri _menghasilkan 3_ tikus marsupial sekutu di sebelah Anda.\n\n_+4:_ Menggunakan ratmogrify pada diri sendiri _menghasilkan 4_ tikus marsupial sekutu di sebelah Anda.
actors.hero.talent.ratforcements.title=bala bantuan
actors.hero.talent.ratlomacy.desc=_+1:_ Menggunakan ratmogrify pada musuh yang telah berubah menjadi ratmogrify membuat mereka bersahabat dan transformasi menjadi permanen.\n\n_+2:_ Menggunakan ratmogrify pada musuh yang telah berubah menjadi ratmogrify membuat mereka bersahabat, transformasi menjadi permanen, dan memberi mereka _2 putaran_ adrenalin.\n\n_+3:_ Menggunakan ratmogrify pada musuh yang telah berubah menjadi ratmogrify membuat mereka bersahabat, transformasi menjadi permanen, dan memberi mereka _4 putaran_ adrenalin.\n\n_+4:_ Menggunakan ratmogrify pada musuh yang telah berubah menjadi ratmogrify membuat mereka bersahabat, transformasi menjadi permanen, dan memberi mereka _6 putaran_ adrenalin.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratsistance.desc=_+1:_ Musuh berwujud tikus yang bermusuhan memberikan _-10% kerusakan_.\n\n_+2:_ Musuh berwujud tikus yang bermusuhan memberikan _-19% kerusakan_.\n\n_+3:_ Musuh berwujud tikus yang bermusuhan memberikan _-27% kerusakan_.\n\n_+4:_ Musuh berwujud tikus yang bermusuhan memberikan _-35% kerusakan_.
actors.hero.talent.ratsistance.title=perlawanan tikus
actors.hero.talent.reactive_barrier.desc=_+1:_ Penyihir mendapatkan _2,5 perisai_ untuk setiap karakter yang terkena ledakan elemen, hingga maksimal 5 karakter.\n\n_+2:_ Penyihir mendapatkan _5 perisai_ untuk setiap karakter yang terkena ledakan elemen, hingga maksimal 6 karakter.\n\n_+3:_ Penyihir mendapatkan _7,5 perisai_ untuk setiap karakter yang terkena ledakan elemen, hingga maksimal 7 karakter.\n\n_+4:_ Penyihir mendapatkan _10 perisai_ untuk setiap karakter yang terkena ledakan elemen, hingga maksimal 8 karakter.
actors.hero.talent.reactive_barrier.title=penghalang reaktif
actors.hero.talent.recall_inscription.desc=_+1:_ Pendeta dapat merapal _Recall Inscription_, sebuah mantra yang memungkinkan mereka mengulangi efek runestone atau gulungan terakhir yang mereka gunakan dalam _10 giliran._\n\n_+2:_ Pendeta dapat merapal _Recall Inscription_, sebuah mantra yang memungkinkan mereka mengulangi efek runestone atau gulungan terakhir yang mereka gunakan dalam _300 giliran._\n\n_Recall Inscription tidak dapat digunakan dengan gulungan peningkatan. Biaya muatan mantra ini bervariasi berdasarkan item mana yang baru saja digunakan: 2 untuk runestone, 3 untuk gulungan, 4 untuk gulungan eksotis. Biaya muatan ini juga digandakan saat digunakan dengan gulungan transmutasi, atau item alkimia yang harus dibuat menggunakan transmutasi atau peningkatan.
actors.hero.talent.recall_inscription.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, talenta ini akan mengembalikan gulungan atau runestone sebanyak 10% dari waktu pada +1 atau 15% dari waktu pada +2. Gulungan Peningkatan dikecualikan dari efek ini.
actors.hero.talent.recall_inscription.refunded=Barang Anda telah dikembalikan dananya!
actors.hero.talent.recall_inscription.title=ingat kembali prasasti
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Saat Huntress menginjak rumput pendek atau bara api, rumput tersebut akan tumbuh menjadi rumput tinggi yang segera dibajak oleh Huntress. Ini memiliki _cooldown 10 giliran_.\n\n_+2:_ Saat Huntress menginjak rumput pendek atau bara api, rumput tersebut akan tumbuh menjadi rumput tinggi yang segera dibajak oleh Huntress. Ini memiliki _cooldown 5 giliran_.\n\nTalenta ini akan menghasilkan rumput yang dibajak jika efek regenerasi pasif dinonaktifkan atau hero belum mendapatkan exp dalam waktu lama.
actors.hero.talent.rejuvenating_steps.title=langkah-langkah peremajaan
actors.hero.talent.remote_beacon.desc=_+1:_ Penyihir dapat menempatkan suar di lokasi mana pun dalam jarak _4 ubin_.\n\n_+2:_ Penyihir dapat menempatkan suar di lokasi mana pun dalam jarak _8 ubin_.\n\n_+3:_ Penyihir dapat menempatkan suar di lokasi mana pun dalam jarak _12 ubin_.\n\n_+4:_ Penyihir dapat menempatkan suar di lokasi mana pun dalam jarak _16 ubin_.\n\nPenyihir tidak dapat menempatkan suar di lokasi yang tidak dapat diakses.
actors.hero.talent.remote_beacon.title=Suar Jarak Jauh
actors.hero.talent.rogues_foresight.desc=_+1:_ Saat Rogue berada di level dengan ruangan rahasia, ia memiliki peluang 75% untuk menyadari bahwa level tersebut berisi rahasia.\n\n_+2:_ Saat Rogue berada di level dengan ruangan rahasia, ia memiliki peluang 100% untuk menyadari bahwa level tersebut berisi rahasia.
actors.hero.talent.rogues_foresight.title=pandangan jauh si nakal
actors.hero.talent.runic_transference.desc=_+1:_ Segel Prajurit yang rusak dapat mentransfer _glif biasa_ dengan cara yang sama seperti mentransfer peningkatan.\n\n_+2:_ Segel Prajurit yang rusak dapat mentransfer _glif biasa, kuat, dan kutukan_ dengan cara yang sama seperti mentransfer peningkatan.\n\nSegel hanya dapat mentransfer glif jika glif tersebut diterapkan pada baju besi saat segel terpasang.
actors.hero.talent.runic_transference.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, talenta ini akan membantu glyph pada armor Anda agar tidak mudah dihapus oleh scroll peningkatan. Glyph akan mulai hilang saat peningkatan dari level 6 (dari 4) pada +1, atau level 7 (dari 4) pada +2. Level di mana glyph pasti hilang tetap sama, yaitu +8.
actors.hero.talent.runic_transference.title=transfer rune
actors.hero.talent.satiated_spells.desc=_+1:_ Memakan makanan menyebabkan Pendeta mendapatkan _3 perisai_ pada saat berikutnya mereka mengucapkan mantra.\n\n_+2:_ Memakan makanan menyebabkan Pendeta mendapatkan _5 perisai_ pada saat berikutnya mereka mengucapkan mantra.
actors.hero.talent.satiated_spells.meta_desc=Jika talenta ini diperoleh oleh hero yang berbeda, talenta ini akan langsung memberikan perisai, yang akan mulai berkurang secara normal setelah 10 giliran.
actors.hero.talent.satiated_spells.title=Mantra yang Terpuaskan
actors.hero.talent.scholars_intuition.desc=_+1:_ Penyihir mengidentifikasi tongkat sihir _3x lebih cepat_.\n\n_+2:_ Penyihir mengidentifikasi tongkat sihir _saat dia menggunakannya_.
actors.hero.talent.scholars_intuition.title=intuisi seorang sarjana
actors.hero.talent.searing_light.desc=_+1:_ Serangan fisik Pendeta terhadap musuh yang diterangi oleh _Cahaya Penuntun_ memberikan _+3 kerusakan._\n\n_+2:_ Serangan fisik Pendeta terhadap musuh yang diterangi oleh _Cahaya Penuntun_ memberikan _+5 kerusakan._
actors.hero.talent.searing_light.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, talenta ini akan memberikan bonus damage setelah tongkat sihir atau artefak digunakan pada musuh, dengan cooldown 20 giliran.
actors.hero.talent.searing_light.title=Cahaya yang Menyala
actors.hero.talent.seer_shot.desc=_+1:_ Saat Huntress menembakkan panah ke tanah, ia memberikan penglihatan di area 3x3 di sekitarnya selama _5 putaran_. Ini memiliki waktu pendinginan 20 putaran.\n\n_+2:_ Saat Huntress menembakkan panah ke tanah, ia memberikan penglihatan di area 3x3 di sekitarnya selama _10 putaran_. Ini memiliki waktu pendinginan 20 putaran.\n\n_+3:_ Saat Huntress menembakkan panah ke tanah, ia memberikan penglihatan di area 3x3 di sekitarnya selama _15 putaran_. Ini memiliki waktu pendinginan 20 putaran.
actors.hero.talent.seer_shot.meta_desc=Jika talenta ini diperoleh oleh hero yang berbeda, talenta ini akan aktif dari senjata lempar apa pun.
actors.hero.talent.seer_shot.title=tembakan peramal
actors.hero.talent.shadow_blade.desc=_+1:_ Klon bayangan mendapatkan _8%_ dari kerusakan hero per giliran, dan memiliki _peluang 25%_ untuk menggunakan mantra pada senjata hero.\n\n_+2:_ Klon bayangan mendapatkan _16%_ dari kerusakan hero per giliran, dan memiliki _peluang 50%_ untuk menggunakan mantra pada senjata hero.\n\n_+3:_ Klon bayangan mendapatkan _24%_ dari kerusakan hero per giliran, dan memiliki _peluang 75%_ untuk menggunakan mantra pada senjata hero.\n\n_+4:_ Klon bayangan mendapatkan _32%_ dari kerusakan hero per giliran, dan memiliki _peluang 100%_ untuk menggunakan mantra pada senjata hero.
actors.hero.talent.shadow_blade.title=pedang bayangan
actors.hero.talent.shadow_step.desc=_+1:_ Jika rogue menggunakan bom asap saat tak terlihat, efeknya terjadi seketika dan memiliki biaya pengisian daya yang _berkurang 16%_, tetapi juga tidak membutakan musuh atau memicu talenta lainnya.\n\n_+2:_ Jika rogue menggunakan bom asap saat tak terlihat, efeknya terjadi seketika dan memiliki biaya pengisian daya yang _berkurang 30%_, tetapi juga tidak membutakan musuh atau memicu talenta lainnya.\n\n_+3:_ Jika rogue menggunakan bom asap saat tak terlihat, efeknya terjadi seketika dan memiliki biaya pengisian daya yang _berkurang 41%_, tetapi juga tidak membutakan musuh atau memicu talenta lainnya.\n\n_+4:_ Jika rogue menggunakan bom asap saat tak terlihat, efeknya terjadi seketika dan memiliki biaya pengisian daya yang _berkurang 50%_, tetapi juga tidak membutakan musuh atau memicu talenta lainnya.
actors.hero.talent.shadow_step.title=langkah bayangan
actors.hero.talent.shared_enchantment.desc=_+1:_ Senjata lempar memiliki peluang _33%_ untuk menggunakan mantra pada busur Sniper.\n\n_+2:_ Senjata lempar memiliki peluang _67%_ untuk menggunakan mantra pada busur Sniper.\n\n_+3:_ Senjata lempar memiliki peluang _100%_ untuk menggunakan mantra pada busur Sniper.\n\n Mantra pada busur dapat aktif selain mantra apa pun yang sudah dimiliki senjata lempar.
actors.hero.talent.shared_enchantment.title=pesona bersama
actors.hero.talent.shared_upgrades.desc=_+1:_ Saat Sniper menyerang dengan senjata lempar yang ditingkatkan, setiap level meningkatkan durasi tanda Sniper sebanyak 1 giliran dan kerusakan serangan spesialnya sebesar 16%, hingga maksimal _2 giliran dan +33% kerusakan pada +2_.\n\n_+2:_ Saat Sniper menyerang dengan senjata lempar yang ditingkatkan, setiap level meningkatkan durasi tanda Sniper sebanyak 1 giliran dan kerusakan serangan spesialnya sebesar 16%, hingga maksimal _4 giliran dan +67% kerusakan pada +4_.\n\n_+3:_ Saat Sniper menyerang dengan senjata lempar yang ditingkatkan, setiap level meningkatkan durasi tanda Sniper sebanyak 1 giliran dan kerusakan serangan spesialnya sebesar 16%, hingga maksimal _6 giliran dan +100% kerusakan pada +6_.
actors.hero.talent.shared_upgrades.title=peningkatan bersama
actors.hero.talent.shield_battery.desc=_+1:_ Penyihir dapat menargetkan dirinya sendiri dengan tongkat sihir untuk mengubah semua muatannya menjadi perisai dengan tingkat _4% HP maksimal per muatan_.\n\n_+2:_ Penyihir dapat menargetkan dirinya sendiri dengan tongkat sihir untuk mengubah semua muatannya menjadi perisai dengan tingkat _6% HP maksimal per muatan_.
actors.hero.talent.shield_battery.title=baterai pelindung
actors.hero.talent.shield_of_light.desc=_+1:_ Pendeta dapat merapal _Perisai Cahaya_, mantra yang dirapal secara instan dan memberikan _2-4 armor_ terhadap target selama 5 putaran dengan biaya 1 muatan.\n\n_+2:_ Pendeta dapat merapal _Perisai Cahaya_, mantra yang dirapal secara instan dan memberikan _3-6 armor_ terhadap target selama 5 putaran dengan biaya 1 muatan.
actors.hero.talent.shield_of_light.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, talenta ini akan mengurangi damage fisik yang diterima dari musuh target Anda sebesar 1, 33% dari waktu pada +1 atau 50% dari waktu pada +2.
actors.hero.talent.shield_of_light.title=perisai cahaya
actors.hero.talent.shielding_dew.desc=_+1:_ Tetesan embun dapat melindungi Warden saat kesehatannya penuh, hingga _20% dari HP maksimalnya_.\n\n_+2:_ Tetesan embun dapat melindungi Warden saat kesehatannya penuh, hingga _40% dari HP maksimalnya_.\n\n_+3:_ Tetesan embun dapat melindungi Warden saat kesehatannya penuh, hingga _60% dari HP maksimalnya_.
actors.hero.talent.shielding_dew.title=embun pelindung
actors.hero.talent.shock_force.desc=_+1:_ Gelombang kejut memberikan _20% lebih banyak kerusakan_ dan memiliki _peluang 25%_ untuk membuat lawan pingsan alih-alih lumpuh.\n\n_+2:_ Gelombang kejut memberikan _40% lebih banyak kerusakan_ dan memiliki _peluang 50%_ untuk membuat lawan pingsan alih-alih lumpuh.\n\n_+3:_ Gelombang kejut memberikan _60% lebih banyak kerusakan_ dan memiliki _peluang 75%_ untuk membuat lawan pingsan alih-alih lumpuh.\n\n_+4:_ Gelombang kejut memberikan _80% lebih banyak kerusakan_ dan memiliki _peluang 100%_ untuk membuat lawan pingsan alih-alih lumpuh.
actors.hero.talent.shock_force.title=gaya kejut
actors.hero.talent.shrug_it_off.desc=_+1:_ Pengurangan kerusakan Prajurit saat bertahan ditingkatkan menjadi 60%, dari 50%.\n\n_+2:_ Pengurangan kerusakan Prajurit saat bertahan ditingkatkan menjadi 68%, dari 50%.\n\n_+3:_ Pengurangan kerusakan Prajurit saat bertahan ditingkatkan menjadi 74%, dari 50%.\n\n_+4:_ Pengurangan kerusakan Prajurit saat bertahan ditingkatkan menjadi 80%, dari 50%.
actors.hero.talent.shrug_it_off.title=mengabaikannya
actors.hero.talent.silent_steps.desc=_+1:_ Rogue tidak akan membangunkan musuh yang sedang tidur selama dia berada _3 petak atau lebih jauh dari mereka_.\n\n_+2:_ Rogue tidak akan membangunkan musuh yang sedang tidur selama dia _tidak berdekatan dengan mereka_.
actors.hero.talent.silent_steps.title=langkah senyap
actors.hero.talent.soul_eater.desc=_+1:_ Tanda jiwa memberikan _0,33 giliran_ rasa kenyang untuk setiap kerusakan fisik yang ditimbulkan. Musuh yang ditandai jiwa memiliki _peluang 10%_ untuk memicu efek makan saat mereka mati.\n\n_+2:_ Tanda jiwa memberikan _0,67 giliran_ rasa kenyang untuk setiap kerusakan fisik yang ditimbulkan. Musuh yang ditandai jiwa memiliki _peluang 20%_ untuk memicu efek makan saat mereka mati.\n\n_+3:_ Tanda jiwa memberikan _1 giliran_ rasa kenyang untuk setiap kerusakan fisik yang ditimbulkan. Musuh yang ditandai jiwa memiliki _peluang 30%_ untuk memicu efek makan saat mereka mati.
actors.hero.talent.soul_eater.title=pemakan jiwa
actors.hero.talent.soul_siphon.desc=_+1:_ Kerusakan fisik yang ditimbulkan oleh karakter lain memicu tanda jiwa Warlock dengan efektivitas _13%_.\n\n_+2:_ Kerusakan fisik yang ditimbulkan oleh karakter lain memicu tanda jiwa Warlock dengan efektivitas _27%_.\n\n_+3:_ Kerusakan fisik yang ditimbulkan oleh karakter lain memicu tanda jiwa Warlock dengan efektivitas _40%_.
actors.hero.talent.soul_siphon.title=penyedot jiwa
actors.hero.talent.speedy_stealth.desc=_+1:_ Freerunner mendapatkan 2 tumpukan momentum per giliran saat dia tidak terlihat.\n\n_+2:_ Selain manfaat +1, freerunning tidak lagi menghitung mundur saat Freerunner tidak terlihat.\n\n_+3:_ Selain manfaat +1 dan +2, Freerunner bergerak dengan kecepatan 2x saat tidak terlihat, terlepas dari apakah dia sedang melakukan freerunning atau tidak.
actors.hero.talent.speedy_stealth.title=siluman cepat
actors.hero.talent.spirit_blades.desc=_+1:_ Pedang Spektral memiliki peluang _30%_ untuk juga menggunakan mantra pada Busur Roh.\n\n_+2:_ Pedang Spektral memiliki peluang _60%_ untuk juga menggunakan mantra pada Busur Roh.\n\n_+3:_ Pedang Spektral memiliki peluang _90%_ untuk juga menggunakan mantra pada Busur Roh.\n\n_+4:_ Pedang Spektral memiliki peluang _100%_ untuk juga menggunakan mantra pada Busur Roh, dan memberikan setiap mantra _+10% kekuatan_.
actors.hero.talent.spirit_blades.title=pedang roh
actors.hero.talent.spirit_form.desc=Pendeta dapat menggunakan _Bentuk Roh_, yang memberikan kekuatan cincin atau artefak yang telah diidentifikasi Pendeta dalam permainan ini (kecuali kitab suci) kepada Trinity, dengan biaya 4 muatan. _+1:_ Saat Trinity digunakan, Pendeta akan mendapatkan efek cincin sebesar _+1_ selama 20 giliran, atau akan memicu efek artefak sebesar _+4_._ _+2:_ Saat Trinity digunakan, Pendeta akan mendapatkan efek cincin sebesar _+2_ selama 20 giliran, atau akan memicu efek artefak sebesar _+6_._ _+3:_ Saat Trinity digunakan, Pendeta akan mendapatkan efek cincin sebesar _+3_ selama 20 giliran, atau akan memicu efek artefak sebesar _+4_. _+8._\n\n_+4:_ Saat Trinity digunakan, Cleric akan mendapatkan efek cincin sebesar _+4_ selama 20 giliran, atau akan memicu efek artefak sebesar _+10._\n\nTrinity hanya dapat diisi dengan satu efek roh dalam satu waktu. Artefak memiliki efek dan biaya pengisian armor yang berbeda-beda saat dipicu oleh Trinity.
actors.hero.talent.spirit_form.title=bentuk roh
actors.hero.talent.stasis.desc=Pendeta dapat menggunakan _Stasis_ pada sekutu yang telah diperkuat dengan biaya 2 muatan. Stasis untuk sementara waktu mengeluarkan sekutu dari ruang bawah tanah dan mempertahankan sisa waktu pada semua buff, termasuk Power of Many. Sekutu akan muncul kembali di samping Anda ketika efeknya berakhir. Stasis dapat diaktifkan kembali secara instan dan tanpa biaya untuk mengakhiri efeknya lebih awal. Stasis bekerja pada sekutu yang tidak bergerak, tetapi tidak dapat memindahkan mereka antar lantai penjara bawah tanah.\n\n_+1:_ Stasis berlangsung maksimal 60 putaran._\n\n_+2:_ Stasis berlangsung maksimal 90 putaran._\n\n_+3:_ Stasis berlangsung maksimal 120 putaran._\n\n_+4:_ Stasis berlangsung maksimal 150 putaran._\n\nPendeta juga dapat menggunakan Beaming Ray ketika sekutu berada dalam stasis untuk memanggil mereka kembali, atau menggunakan Life Link untuk menerapkan efeknya terlebih dahulu. Namun, sekutu tidak mendapatkan manfaat dari Life Link saat berada dalam stasis.
actors.hero.talent.stasis.title=keadaan statis
actors.hero.talent.strengthening_meal.desc=_+1:_ Memakan makanan memberi Duelist 3 bonus kerusakan pada _2 kali_ berikutnya saat dia menyerang musuh dengan serangan fisik.\n\n_+2:_ Memakan makanan memberi Duelist 3 bonus kerusakan pada _3 kali_ berikutnya saat dia menyerang musuh dengan serangan fisik.
actors.hero.talent.strengthening_meal.title=makanan penguat
actors.hero.talent.striking_force.desc=_+1:_ Kekuatan efek serangan elemen ditingkatkan sebesar _30%_.\n\n_+2:_ Kekuatan efek serangan elemen ditingkatkan sebesar _60%_.\n\n_+3:_ Kekuatan efek serangan elemen ditingkatkan sebesar _90%_.\n\n_+4:_ Kekuatan efek serangan elemen ditingkatkan sebesar _120%_.
actors.hero.talent.striking_force.title=kekuatan penyerang
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave memiliki peluang _30%_ untuk juga menggunakan efek serangan seperti mantra dan kombo.\n\n_+2:_ Shockwave memiliki peluang _60%_ untuk juga menggunakan efek serangan seperti mantra dan kombo.\n\n_+3:_ Shockwave memiliki peluang _90%_ untuk juga menggunakan efek serangan seperti mantra dan kombo.\n\n_+4:_ Shockwave memiliki peluang _100%_ untuk juga menggunakan efek serangan seperti mantra dan kombo, dan memberikan mantra _+20% kekuatan_.
actors.hero.talent.striking_wave.title=gelombang yang menghantam
actors.hero.talent.strongman.desc=_+1:_ Kekuatan Prajurit meningkat sebesar 8%, dibulatkan ke bawah.\n\n_+2:_ Kekuatan Prajurit meningkat sebesar 13%, dibulatkan ke bawah.\n\n_+3:_ Kekuatan Prajurit meningkat sebesar 18%, dibulatkan ke bawah.
actors.hero.talent.strongman.title=pria kuat
actors.hero.talent.sucker_punch.desc=_+1:_ Rogue memberikan _1-2 kerusakan bonus_ pada serangan kejutan pertama terhadap musuh.\n\n_+2:_ Rogue memberikan _2 kerusakan bonus_ pada serangan kejutan pertama terhadap musuh.
actors.hero.talent.sucker_punch.title=pukulan mendadak
actors.hero.talent.sunray.desc=_+1:_ Pendeta dapat merapal _Sunray_, mantra yang memberikan _4-8 kerusakan_ dan membutakan target selama _4 putaran_, dengan biaya 1 muatan.\n\n_+2:_ Pendeta dapat merapal _Sunray_, mantra yang memberikan _6-12 kerusakan_ dan membutakan target selama _6 putaran_, dengan biaya 1 muatan.\n\nSunray hanya dapat membutakan setiap target sekali, tetapi jika target sudah dibutakan oleh Sunray maka mantra ini akan melumpuhkannya. Sunray selalu memberikan kerusakan maksimum pada musuh iblis dan mayat hidup.
actors.hero.talent.sunray.meta_desc=_Jika bakat ini diperoleh oleh hero yang berbeda_, maka tongkat sihir dan artefak akan membutakan musuh selama 4 giliran, 15% dari waktu pada +1 atau 25% dari waktu pada +2.
actors.hero.talent.sunray.title=sinar matahari
actors.hero.talent.survivalists_intuition.desc=_+1:_ Sang Pemburu mengidentifikasi senjata lempar _3x lebih cepat_.\n\n_+2:_ Sang Pemburu mengidentifikasi senjata lempar _ketika dia mengenai target dengan senjata tersebut_.
actors.hero.talent.survivalists_intuition.title=intuisi seorang penyintas
actors.hero.talent.sustained_retribution.desc=_+1:_ Prajurit memberikan _kerusakan bonus 115%_ yang tersebar selama _2 serangan_, bukan 100% kerusakan bonus dalam 1 serangan.\n\n_+2:_ Prajurit memberikan _kerusakan bonus 130%_ yang tersebar selama _3 serangan_, bukan 100% kerusakan bonus dalam 1 serangan.\n\n_+3:_ Prajurit memberikan _kerusakan bonus 145%_ yang tersebar selama _4 serangan_, bukan 100% kerusakan bonus dalam 1 serangan.\n\n_+4:_ Prajurit memberikan _kerusakan bonus 160%_ yang tersebar selama _5 serangan_, bukan 100% kerusakan bonus dalam 1 serangan.
actors.hero.talent.sustained_retribution.title=pembalasan yang berkelanjutan
actors.hero.talent.swift_equip.desc=_+1:_ Duelis dapat mengganti senjata yang sedang digunakannya secara instan _satu kali_ setiap 20 giliran.\n\n_+2:_ Duelis dapat mengganti senjata yang sedang digunakannya secara instan _dua kali_ setiap 20 giliran.\n\nJika Duelis memiliki bakat ini dan tidak dalam masa pendinginan, menggunakan senjata yang tidak sedang digunakan dengan cepat akan memasangnya.
actors.hero.talent.swift_equip.title=perlengkapan cepat
actors.hero.talent.swift_spirit.desc=_+1:_ Kecepatan gerak elang roh ditingkatkan menjadi _2,5 petak_ dari 2, dan dijamin dapat menghindari _2 serangan_ pertama yang dilancarkan terhadapnya.\n\n_+2:_ Kecepatan gerak elang roh ditingkatkan menjadi _3 petak_ dari 2, dan dijamin dapat menghindari _4 serangan_ pertama yang dilancarkan terhadapnya.\n\n_+3:_ Kecepatan gerak elang roh ditingkatkan menjadi _3,5 petak_ dari 2, dan dijamin dapat menghindari _6 serangan_ pertama yang dilancarkan terhadapnya.\n\n_+4:_ Kecepatan gerak elang roh ditingkatkan menjadi _4 petak_ dari 2, dan dijamin dapat menghindari _8 serangan_ pertama yang dilancarkan terhadapnya.
actors.hero.talent.swift_spirit.title=semangat yang cepat
actors.hero.talent.telefrag.desc=_+1:_ Jika Mage berteleportasi ke karakter lain, dia memberikan _10-15 kerusakan_ padanya, tetapi juga menerima _5 kerusakan_.\n\n_+2:_ Jika Mage berteleportasi ke karakter lain, dia memberikan _20-30 kerusakan_ padanya, tetapi juga menerima _10 kerusakan_.\n\n_+3:_ Jika Mage berteleportasi ke karakter lain, dia memberikan _30-45 kerusakan_ padanya, tetapi juga menerima _15 kerusakan_.\n\n_+4:_ Jika Mage berteleportasi ke karakter lain, dia memberikan _40-60 kerusakan_ padanya, tetapi juga menerima _20 kerusakan_.\n\nHero tidak dapat dibunuh oleh talenta ini, kerusakan diri dapat dikurangi oleh efek resistensi sihir.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Rogue mengidentifikasi cincin _2x lebih cepat_, dan mengidentifikasi jenis cincin _saat dia memakainya_.\n\n_+2:_ Rogue mengidentifikasi cincin _saat dia memakainya_, dan mengidentifikasi jenis cincin _saat dia mengambilnya_.
actors.hero.talent.thiefs_intuition.title=intuisi pencuri
actors.hero.talent.twin_upgrades.desc=_+1:_ Jika salah satu dari dua senjata yang dilengkapi oleh Sang Juara memiliki level lebih rendah dan _2 tingkat atau lebih rendah_ daripada senjata lainnya, levelnya akan ditingkatkan ke level senjata lainnya.\n\n_+2:_ Jika salah satu dari dua senjata yang dilengkapi oleh Sang Juara memiliki level lebih rendah dan _1 tingkat atau lebih rendah_ daripada senjata lainnya, levelnya akan ditingkatkan ke level senjata lainnya.\n\n_+3:_ Jika salah satu dari dua senjata yang dilengkapi oleh Sang Juara memiliki level lebih rendah dan _bersama atau lebih rendah_ daripada senjata lainnya, levelnya akan ditingkatkan ke level senjata lainnya.
actors.hero.talent.twin_upgrades.title=peningkatan kembar
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Biksu mendapatkan _50% lebih banyak energi_ untuk setiap perlengkapan _tingkat 3 atau lebih rendah_ yang dia gunakan.\n\n_+2:_ Biksu mendapatkan _75% lebih banyak energi_ untuk setiap perlengkapan _tingkat 2 atau lebih rendah_ yang dia gunakan. Manfaat tingkat 3 tidak berubah.\n\n_+3:_ Biksu mendapatkan _100% lebih banyak energi_ untuk setiap perlengkapan _tingkat 1 atau lebih rendah_ yang dia gunakan. Manfaat tingkat 2 dan 3 tidak berubah. Dia juga mendapatkan baju zirah kain dan sarung tangan bertabur secara gratis.\n\nPerhatikan bahwa bakat ini tidak memberikan manfaat dari tidak bersenjata atau menyerang dengan Cincin Kekuatan.
actors.hero.talent.unencumbered_spirit.title=semangat yang tak terbebani
actors.hero.talent.varied_charge.desc=_+1:_ Sang Juara langsung mendapatkan kembali _0,17 muatan senjata_ saat dia menggunakan dua kemampuan senjata yang berbeda, tanpa batas waktu.\n\n_+2:_ Sang Juara langsung mendapatkan kembali _0,33 muatan senjata_ saat dia menggunakan dua kemampuan senjata yang berbeda, tanpa batas waktu.\n\n_+3:_ Sang Juara langsung mendapatkan kembali _0,5 muatan senjata_ saat dia menggunakan dua kemampuan senjata yang berbeda, tanpa batas waktu.
actors.hero.talent.varied_charge.title=biaya bervariasi
actors.hero.talent.veterans_intuition.desc=_+1:_ Prajurit mengidentifikasi senjata _1,75x lebih cepat_ dan baju besi _2,5x lebih cepat_.\n\n_+2:_ Prajurit mengidentifikasi senjata _2,5x lebih cepat_ dan baju besi _saat dia memakainya_.
actors.hero.talent.veterans_intuition.title=intuisi veteran
actors.hero.talent.wall_of_light.desc=_+1:_ Paladin dapat menggunakan _Wall of Light_, mantra yang menciptakan dinding padat selebar _3 petak_ di depan Paladin yang mendorong musuh menjauh dan bertahan selama 20 giliran, dengan biaya 3 muatan.\n\n_+2:_ Paladin dapat menggunakan _Wall of Light_, mantra yang menciptakan dinding padat selebar _5 petak_ di depan Paladin yang mendorong musuh menjauh dan bertahan selama 20 giliran, dengan biaya 3 muatan.\n\n_+3:_ Paladin dapat menggunakan _Wall of Light_, mantra yang menciptakan dinding padat selebar _7 petak_ di depan Paladin yang mendorong musuh menjauh dan bertahan selama 20 giliran, dengan biaya 3 muatan.\n\nDinding dapat ditempatkan secara kardinal atau diagonal, hanya satu dinding yang dapat ada pada satu waktu.
actors.hero.talent.wall_of_light.title=dinding cahaya
actors.hero.talent.wand_preservation.desc=_+1:_ Saat Penyihir memasukkan tongkat sihir baru ke dalam tongkatnya, tongkat sihir lama dikembalikan dengan +0, _tetapi ini hanya dapat dilakukan sekali._\n\n_+2:_ Saat Penyihir memasukkan tongkat sihir baru ke dalam tongkatnya, tongkat sihir lama dikembalikan dengan +0, _ini dapat diulang dengan waktu pendinginan satu level pahlawan._
actors.hero.talent.wand_preservation.meta_desc=_Jika bakat ini diperoleh oleh pahlawan yang berbeda_, bakat ini akan meningkatkan jumlah resin arcane yang diperoleh saat memasukkan tongkat sihir ke dalam panci alkimia sebanyak 1 pada +1, atau sebanyak 2 pada +2.
actors.hero.talent.wand_preservation.title=pelestarian tongkat sihir
actors.hero.talent.weapon_recharging.desc=_+1:_ Duelis mendapatkan satu muatan senjata setiap _15 giliran_ saat berada di bawah pengaruh buff pengisian ulang tongkat sihir atau artefak.\n\n_+2:_ Duelis mendapatkan satu muatan senjata setiap _10 giliran_ saat berada di bawah pengaruh buff pengisian ulang tongkat sihir atau artefak.
actors.hero.talent.weapon_recharging.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, maka hero tersebut akan memberikan tambahan +5% damage jarak dekat saat mengisi ulang di +1, atau tambahan +7,5% damage jarak dekat saat mengisi ulang di +2.
actors.hero.talent.weapon_recharging.title=pengisian ulang senjata
actors.hero.talent.wide_search.desc=_+1:_ Radius pencarian Rogue ditingkatkan dari persegi 5x5 menjadi lingkaran 7x7.\n\n_+2:_ Radius pencarian Rogue ditingkatkan dari persegi 5x5 menjadi persegi 7x7.
actors.hero.talent.wide_search.meta_desc=_Jika talenta ini diperoleh oleh hero yang berbeda_, radius pencarian mereka akan meningkat dari kotak 3x3 menjadi lingkaran 5x5 pada +1, atau kotak 5x5 pada +2.
actors.hero.talent.wide_search.title=pencarian luas
actors.hero.talent.wild_momentum.desc=_+1:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam sebanyak _1 giliran_. Durasi dapat diperpanjang maksimal _2 giliran_.\n\n_+2:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam sebanyak _2 giliran_. Durasi dapat diperpanjang maksimal _4 giliran_.\n\n_+3:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam sebanyak _3 giliran_. Durasi dapat diperpanjang maksimal _6 giliran_.\n\n_+4:_ Membunuh musuh dengan busur roh memperpanjang durasi kekuatan alam sebanyak _4 giliran_. Durasi dapat diperpanjang maksimal _8 giliran_.
actors.hero.talent.wild_momentum.title=momentum liar
actors.hero.talent.wild_power.desc=_+1:_ Saat menggunakan sihir liar, tongkat sihir akan ditingkatkan sebesar _2 atau 3_, hingga +4_.\n\n_+2:_ Saat menggunakan sihir liar, tongkat sihir akan ditingkatkan sebesar _3_, hingga +5_.\n\n_+3:_ Saat menggunakan sihir liar, tongkat sihir akan ditingkatkan sebesar _3 atau 4_, hingga +6_.\n\n_+4:_ Saat menggunakan sihir liar, tongkat sihir akan ditingkatkan sebesar _4_, hingga +7_.
actors.hero.talent.wild_power.title=kekuatan liar
actors.mobs.acidic.desc=Makhluk iblis raksasa mirip laba-laba ini menghindari pertempuran jarak dekat, lebih memilih menembakkan duri bergerigi yang melumpuhkan dari jarak jauh. Yang satu ini tampaknya meneteskan cairan korosif.
actors.mobs.acidic.name=kalajengking asam
actors.mobs.albino.desc=Ini adalah jenis tikus marsupial yang langka, dengan bulu putih bersih dan gigi bergerigi.
actors.mobs.albino.discover_hint=Anda jarang dapat menemukan musuh ini di wilayah tertentu di dalam ruang bawah tanah.
actors.mobs.albino.name=tikus albino
actors.mobs.armoredbrute.desc=Para gnoll berbadan besar yang paling senior sering mengenakan baju zirah yang kuat untuk menunjukkan status mereka. Baju zirah tersebut membuat para gnoll ini jauh lebih tahan terhadap kerusakan fisik, dan kedisiplinan mereka yang lebih tinggi berarti mereka dapat mengamuk lebih lama sebelum menyerah karena luka-luka mereka.
actors.mobs.armoredbrute.name=makhluk buas lapis baja
actors.mobs.armoredstatue.desc=Anda mungkin mengira itu hanyalah salah satu patung tak bernyawa di ruang bawah tanah ini, tetapi mata merahnya yang berc bercahaya membongkar rahasianya. Tampaknya dalam kondisi sangat baik karena baju zirah yang dikenakannya, mungkin akan sangat sulit untuk membunuhnya.
actors.mobs.armoredstatue.desc_arm_wep=Meskipun patungnya sendiri terbuat dari batu, _%1$s_ dan _%2$s_ yang dipegangnya tampak nyata.
actors.mobs.armoredstatue.name=patung lapis baja
actors.mobs.bandit.desc=Tingkat terdalam penjara bawah tanah selalu menjadi tempat persembunyian bagi semua jenis penjahat. Tidak semua dari mereka mampu menjaga kewarasan selama periode panjang mereka jauh dari sinar matahari. Dahulu kala, para pencuri dan bandit gila ini telah lupa siapa mereka dan mengapa mereka mencuri.
actors.mobs.bandit.name=bandit gila
actors.mobs.bat.desc=Para penghuni gua yang gesit dan gigih ini jauh lebih berbahaya daripada yang terlihat. Mereka memulihkan kesehatan mereka dengan setiap serangan yang berhasil, yang memungkinkan mereka untuk mengalahkan lawan yang jauh lebih besar.
actors.mobs.bat.name=kelelawar vampir
actors.mobs.bee.desc=Meskipun ukurannya kecil, lebah emas cenderung melindungi sarangnya dengan sangat gigih. Lebah ini sangat marah, sebaiknya jaga jarak.
actors.mobs.bee.desc_honey=Meskipun ukurannya kecil, lebah emas cenderung melindungi sarangnya dengan gigih. Lebah ini telah ditenangkan, dan tampaknya ingin mengikuti Anda.
actors.mobs.bee.discover_hint=Anda dapat menemukan karakter ini dengan item tertentu.
actors.mobs.bee.name=lebah emas
actors.mobs.brute$bruterage.desc=Gnoll buas ini sedang sekarat, tetapi ingin membawamu bersamanya! \n\nGnoll buas ini akan mati ketika perisainya habis, baik karena waktu atau jika ia terluka. Sementara itu, ia akan memberikan kerusakan yang jauh lebih besar, jadi waspadalah! \n\nSisa perisai: %d.
actors.mobs.brute$bruterage.name=amarah brutal
actors.mobs.brute.def_verb=diblokir
actors.mobs.brute.desc=Gnoll bengis adalah yang paling besar, kuat, dan tangguh di antara para gnoll. Saat terluka parah, mereka mengamuk dan menimbulkan kerusakan yang lebih besar pada musuh.
actors.mobs.brute.enraged=sangat marah
actors.mobs.brute.name=gnoll bengis
actors.mobs.causticslime.desc=Lendir ini tampaknya telah tercemar oleh sihir gelap yang berasal dari bawah. Warnanya yang biasanya hijau telah hilang, dan meneteskan cairan korosif.
actors.mobs.causticslime.discover_hint=Anda jarang dapat menemukan musuh ini di wilayah tertentu di dalam ruang bawah tanah.
actors.mobs.causticslime.name=lendir kaustik
actors.mobs.crab.desc=Kepiting-kepiting raksasa ini berada di puncak rantai makanan di saluran pembuangan. Mereka sangat cepat dan cangkang tebal mereka dapat menahan benturan keras.
actors.mobs.crab.name=kepiting selokan
actors.mobs.crystalguardian.def_verb=diblokir
actors.mobs.crystalguardian.desc=Para penjaga kristal besar ini hampir terlihat seperti patung, jika bukan karena mata mereka yang bersinar terang. Kristal keras yang membentuk mereka membuat mereka lambat tetapi sangat tangguh, jadi sebaiknya biarkan mereka tidur di sarang kristal mereka selama mungkin. Karena ukurannya, penjaga kristal akan bergerak jauh lebih lambat di ruang tertutup. Mereka juga sangat tahan lama sehingga tidak mungkin dibunuh begitu saja. Mereka dapat dikalahkan dan dinonaktifkan sementara, tetapi mereka akan bangkit kembali setelah beberapa saat.
actors.mobs.crystalguardian.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.crystalguardian.name=penjaga kristal
actors.mobs.crystalmimic.ate=Mimic itu memakan %s-mu!
actors.mobs.crystalmimic.desc=Mimik adalah makhluk magis yang dapat mengambil bentuk apa pun yang mereka inginkan. Di ruang bawah tanah, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat petualang yang tidak curiga. Mimik kristal lebih licik daripada sepupu mereka yang biasa, dan lebih suka menghindari konflik saat mencuri harta rampasan. Mereka akan mencoba berlari menjauh setelah ditemukan, dan memiliki kemampuan untuk memposisikan ulang musuh saat menyerang.
actors.mobs.crystalmimic.escaped=Peniru kristal itu telah melarikan diri!
actors.mobs.crystalmimic.name=tiruan kristal
actors.mobs.crystalspire.alert=Getaran itu semakin kuat dan bergemuruh di seluruh gua!
actors.mobs.crystalspire.desc=Puncak kristal ultra keras raksasa ini mungkin merupakan sumber dari semua makhluk kristal aneh di gua ini. Senjata biasa Anda tidak efektif melawannya, jadi Anda perlu menggunakan beliung jika ingin menghancurkannya. Pastikan Anda siap sebelum mulai menghancurkannya. Kristal sebesar ini kemungkinan akan membutuhkan waktu lama untuk ditambang, dan Anda mungkin tidak akan bisa melakukannya tanpa gangguan. Puncak itu sendiri bahkan mungkin memiliki beberapa cara untuk mempertahankan diri. Mungkin serangan puncak itu sendiri dapat digunakan melawan para pengikutnya.
actors.mobs.crystalspire.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.crystalspire.name=puncak kristal
actors.mobs.crystalspire.warning=Kristal itu bergetar saat Anda memukulnya. Jika Anda terus melakukan ini, pasti akan menarik perhatian orang...
actors.mobs.crystalwisp.beam_kill=Sinar itu membunuhmu...
actors.mobs.crystalwisp.desc=Sebongkah kecil kristal keras yang mengambang dan memancarkan cahaya terang. Meskipun tidak terlalu kuat, gumpalan kristal akan menembakkan sinar cahaya yang merusak ke arah Anda jika mereka memiliki kesempatan yang jelas. Gumpalan kristal cukup kecil untuk dengan mudah bergerak melalui berbagai tonjolan kristal, tetapi mereka tidak mampu menembus tonjolan tersebut.
actors.mobs.crystalwisp.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.crystalwisp.name=gumpalan kristal
actors.mobs.demonspawner.desc=Gabungan daging kurcaci yang berbelit-belit ini bertanggung jawab menciptakan iblis perobek dari para kurcaci yang telah mati di wilayah ini. Jelas, para iblis tidak melihat masalah dalam menggunakan setiap sumber daya yang mereka miliki untuk melawan musuh mereka. Meskipun secara visual menakutkan, penghasil iblis tidak memiliki cara untuk bergerak atau membela diri secara langsung. Massa mereka yang besar membuat mereka sulit dibunuh dengan cepat, dan mereka akan menghasilkan iblis perobek lebih cepat ketika mereka berada di bawah ancaman. Penghasil iblis tampaknya terhubung ke beberapa sumber kekuatan iblis pusat. Membunuh mereka dapat melemahkannya.
actors.mobs.demonspawner.name=penampung iblis
actors.mobs.demonspawner.on_death=Energi iblis di sini tampaknya berkurang seiring matinya makhluk yang memunculkannya.
actors.mobs.dm100.desc=DM-100 adalah model awal 'mesin pertahanan' kurcaci yang dirancang untuk melindungi penambang kurcaci di gua-gua di bawah penjara ini. Namun, sengatan listriknya terbukti terlalu lemah, sehingga mesin-mesin itu diberikan kepada kota manusia di atasnya. Mesin-mesin itu tidak digunakan selama bertahun-tahun dan akhirnya sampai ke penjara, di mana sipir awalnya menganggapnya terlalu kejam untuk digunakan. Namun, seiring para tahanan menjadi semakin sulit dikendalikan, mesin-mesin itu menjadi suatu kebutuhan.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Sambaran petir itu membunuhmu...
actors.mobs.dm200.desc=DM-200 adalah generasi kedua dari 'mesin pertahanan' kurcaci, yang dirancang untuk melindungi penambang kurcaci di gua dan kota di bawahnya. Mereka jauh lebih besar dan lebih berat daripada pendahulunya, dan menyerang dengan tinju hidrolik yang menghancurkan. Ukuran mereka yang lebih besar juga merupakan kelemahan utama mereka, karena mereka tidak dapat masuk ke terowongan dan pintu sempit di ruang bawah tanah. Para kurcaci mampu mengimbangi kurangnya mobilitas DM-200 dengan memungkinkan mereka untuk membuang asap knalpot beracun mereka ke musuh yang jauh, atau musuh yang tidak dapat mereka jangkau.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 menyemburkan semburan gas buang beracun!
actors.mobs.dm201.desc=Para kurcaci sempat bereksperimen dengan lebih menekankan kurangnya mobilitas DM-200 dan menciptakan beberapa model DM yang sepenuhnya tidak bergerak. DM-201 adalah DM-200 yang dimodifikasi dan berfungsi sebagai menara penjaga yang tidak memiliki kemampuan bergerak. Sebagai gantinya, DM-201 memiliki daya tahan dan daya serang yang jauh lebih besar. Karena DM-201 tidak memiliki mesin untuk membuang gas buang, para kurcaci malah melengkapinya dengan granat gas korosif! Namun, DM-201 berhati-hati dengan granat ini dan hanya akan melemparkannya ketika diserang dari jarak jauh.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 meluncurkan granat korosif!
actors.mobs.dm300.charge_lost=TIANG LISTRIK HANCUR! KEMBALI MENGGUNAKAN LISTRIK LOKAL!
actors.mobs.dm300.charging=MENGALAMI KERUSAKAN! MENGAKTIFKAN TIANG DAYA!
actors.mobs.dm300.charging_hint=DM-300 kebal terhadap serangan selama sedang dialiri daya oleh pylon!
actors.mobs.dm300.def_verb=diblokir
actors.mobs.dm300.defeated=KERUSAKAN KRITIS! UPAYA PEMATIAN-
actors.mobs.dm300.desc=Mesin ini dibuat oleh para kurcaci beberapa abad lalu. Belakangan, mereka mulai mengganti mesin dengan golem, elemental, bahkan iblis. Pada akhirnya, hal itu membawa peradaban mereka menuju kehancuran. DM-300 dan mesin sejenis biasanya dipakai untuk pembangunan dan penambangan, kadang juga untuk mempertahankan kota.
actors.mobs.dm300.desc_supercharged=DM-300 saat ini terisi penuh energi listrik. Dalam bentuk ini, DM-300 tidak dapat rusak dan bergerak dengan kecepatan dua kali lipat! Selain itu, bornya sekarang berputar cukup cepat untuk _menembus batuan padat_, meskipun ia bergerak jauh lebih lambat saat melakukan ini. Menyerang DM-300 secara langsung tidak ada gunanya saat ia terisi penuh energi, tetapi _sesuatu di area tersebut pasti memberinya energi ini_, menghancurkannya dapat melemahkannya.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=PERSONEL TIDAK BERWENANG TERDETEKSI!
actors.mobs.dm300.pylons_destroyed=PERINGATAN! KETIDAKSTABILAN TERDETEKSI PADA JARINGAN LISTRIK!
actors.mobs.dm300.rankings_desc=Hancur oleh DM-300
actors.mobs.dm300.shield=DM-300 mengambil daya dari kabel yang terbuka dan melindungi dirinya sendiri!
actors.mobs.dm300.supercharged=HANCURKAN! HANCURKAN! HANCURKAN!
actors.mobs.dwarfking$dkghoul.rankings_desc=Jatuh di Hadapan Raja Kurcaci
actors.mobs.dwarfking$dkgolem.rankings_desc=Jatuh di Hadapan Raja Kurcaci
actors.mobs.dwarfking$dkmonk.rankings_desc=Jatuh di Hadapan Raja Kurcaci
actors.mobs.dwarfking$dkwarlock.rankings_desc=Jatuh di Hadapan Raja Kurcaci
actors.mobs.dwarfking.defeated=Kau telah... mencelakakan kita semua...
actors.mobs.dwarfking.desc=Bertahun-tahun yang lalu, salah satu penyihir tertinggi di istana kurcaci menemukan rahasia yang memberinya kekuatan luar biasa atas hidup dan mati. Dia segera menggunakan kekuatan ini, menundukkan dan merusak rekan-rekannya, rajanya, dan akhirnya setiap warga kurcaci. Sekarang dia adalah raja, penguasa atas legiun bawahan mayat hidup. Raja Kurcaci adalah musuh yang agresif, yang akan mencoba mengepung dan mengalahkan musuh-musuhnya dengan gerombolan antek mayat hidupnya.
actors.mobs.dwarfking.enraged=Kau tak bisa membunuhku %s. Aku. Abadi!
actors.mobs.dwarfking.lifelink_1=Aku membutuhkan esensimu, budak!
actors.mobs.dwarfking.lifelink_2=Berdarahlah untukku, budak!
actors.mobs.dwarfking.losing=Tidak! Kau tidak bisa melakukan ini... kau tidak tahu apa yang ada di bawah sana...
actors.mobs.dwarfking.name=Raja Kurcaci
actors.mobs.dwarfking.notice=Beraninya kau! Kau tidak tahu apa yang sedang kau campuri!
actors.mobs.dwarfking.rankings_desc=Jatuh di Hadapan Raja Kurcaci
actors.mobs.dwarfking.teleport_1=Hadapi mereka, budak!
actors.mobs.dwarfking.teleport_2=Buat mereka sibuk, budak!
actors.mobs.dwarfking.wave_1=Cukup! Bangkitlah, hamba-hambaku!
actors.mobs.dwarfking.wave_2=Lebih banyak lagi! Berkorbanlah untuk rajamu!
actors.mobs.dwarfking.wave_3=Tidak berguna! BUNUH MEREKA SEKARANG JUGA!
actors.mobs.ebonymimic.desc=Mimik adalah makhluk magis yang dapat mengambil bentuk apa pun yang mereka inginkan. Di ruang bawah tanah, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat petualang yang tidak curiga. Mimik Ebony adalah mimik yang lihai dengan kemampuan untuk membuat diri mereka hampir tak terlihat. Mereka bersembunyi di benda-benda yang kemungkinan besar akan berinteraksi dengan para petualang, tetapi juga menyimpan harta karun mereka sendiri. Mereka tidak lebih tangguh daripada mimik biasa setelah ditemukan, tetapi gigitan kejutan mereka sangat mematikan.
actors.mobs.ebonymimic.discover_hint=Anda dapat menemukan musuh ini dengan menggunakan perhiasan tertentu.
actors.mobs.ebonymimic.hidden_desc=Sepertinya ada sesuatu di sini, tetapi hampir sepenuhnya transparan.
actors.mobs.ebonymimic.hidden_name=garis besar yang mencurigakan
actors.mobs.ebonymimic.name=tiruan ebony
actors.mobs.ebonymimic.reveal=Ada peniru di sana!
actors.mobs.elemental$chaoselemental.desc=Elemental adalah makhluk kacau yang sering tercipta ketika sihir okultisme yang kuat tidak dikendalikan dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya terkait dengan jenis sihir tertentu. Elemental kekacauan adalah elemental langka dan berbahaya yang belum stabil pada elemen tertentu. Mereka akan melepaskan sihir liar yang tidak terduga saat menyerang.
actors.mobs.elemental$chaoselemental.name=elemen kekacauan
actors.mobs.elemental$fireelemental.desc=Elemental adalah makhluk kacau yang sering tercipta ketika sihir okultisme yang kuat tidak dikendalikan dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu. Elemental api adalah jenis elemental umum yang memberikan kerusakan dengan sihir api. Mereka akan membakar target mereka dengan serangan jarak dekat, dan kadang-kadang juga dapat menembakkan semburan api.
actors.mobs.elemental$fireelemental.name=elemen api
actors.mobs.elemental$frostelemental.desc=Elemental adalah makhluk kacau yang sering tercipta ketika sihir okultisme yang kuat tidak dikendalikan dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu. Elemental es adalah jenis elemental umum yang melemahkan musuh dengan sihir yang membekukan. Mereka akan membekukan target mereka dengan serangan jarak dekat dan sesekali serangan jarak jauh. Sihir mereka jauh lebih efektif di dalam air.
actors.mobs.elemental$frostelemental.name=elemen es
actors.mobs.elemental$newbornfireelemental.charging=Elemen tersebut sedang mengisi daya!
actors.mobs.elemental$newbornfireelemental.desc=Elemental adalah makhluk kacau yang sering tercipta ketika sihir okultisme yang kuat tidak dikendalikan dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu. Elemental api ini baru saja dipanggil, tetapi masih cukup berbahaya!
actors.mobs.elemental$newbornfireelemental.desc_ally=Karena elemental ini dipanggil melalui mantra, ia memiliki sedikit lebih banyak kendali atas apinya. Ia tidak mampu melakukan serangan jarak jauh, tetapi akan membakar musuh yang diserangnya dalam pertarungan jarak dekat.
actors.mobs.elemental$newbornfireelemental.desc_boss=Karena sifat pemanggilannya yang kacau, elemental ini hanya dapat menyebarkan api dalam semburan yang tidak akurat setelah mengisi daya selama satu giliran.
actors.mobs.elemental$newbornfireelemental.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.elemental$newbornfireelemental.name=elemen api yang baru lahir
actors.mobs.elemental$shockelemental.desc=Elemental adalah makhluk kacau yang sering tercipta ketika sihir okultisme yang kuat tidak dikendalikan dengan benar. Elemental memiliki kecerdasan minimal, dan biasanya dikaitkan dengan jenis sihir tertentu. Elemental kejut adalah jenis elemental yang kurang umum yang mengganggu musuhnya dengan listrik dan kilatan cahaya. Dalam pertarungan jarak dekat, mereka akan memancarkan listrik ke musuh di dekatnya, dan memberikan kerusakan tambahan pada target utama mereka jika berada di dalam air. Mereka juga kadang-kadang akan memfokuskan ledakan cahaya jarak jauh ke target mereka, membutakan mereka untuk sementara waktu.
actors.mobs.elemental$shockelemental.name=elemen kejut
actors.mobs.eye.deathgaze_kill=Tatapan maut itu membunuhmu...
actors.mobs.eye.desc=Iblis ini juga dijuluki "bola kebencian". Begitu melihat musuh, ia menggunakan tatapan mautnya tanpa berpikir, sering kali mengabaikan dan melukai sekutunya sendiri.
actors.mobs.eye.name=mata jahat
actors.mobs.fetidrat.desc=Jelas ada yang salah dengan tikus ini. Bulunya yang hitam berminyak dan kulitnya yang membusuk sangat berbeda dari tikus sehat yang pernah Anda lihat sebelumnya. Mata hijaunya yang pucat membuatnya tampak sangat mengancam. Tikus itu membawa awan bau busuk yang mengerikan, baunya sangat menyengat dari dekat. Cairan kental berwarna gelap menetes dari mulut tikus, ia menggerogoti lantai tetapi tampaknya larut dalam air.
actors.mobs.fetidrat.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.fetidrat.name=tikus busuk
actors.mobs.fungalcore.desc=Jamur raksasa ini pastilah sumber dari semua aktivitas jamur di gua ini.
actors.mobs.fungalcore.name=inti jamur
actors.mobs.fungalsentry.desc=Jamur yang sangat tinggi ini berfungsi sebagai titik pertahanan bagi jaringan jamur yang lebih besar yang hidup di gua ini. Jamur ini tidak bergerak, tetapi akan menembakkan semburan racun yang tepat sasaran ke apa pun yang berada dalam garis pandangnya. Meskipun dampak semburan ini relatif lemah, _racun yang dihasilkan dapat menumpuk dalam jumlah yang mematikan dengan sangat cepat._ Meskipun dapat dibunuh, mungkin lebih baik untuk menghindarinya.
actors.mobs.fungalsentry.name=penjaga jamur
actors.mobs.fungalspinner.desc=Laba-laba gua ini tampaknya dikendalikan oleh jamur parasit. Jamur tersebut juga telah mengubah kemampuannya, menggantikan jaring dan kantung racunnya dengan pertumbuhan jamur. Laba-laba jamur ini akan menyemburkan tumbuhan ke arah Anda alih-alih jaring, menyebarkan vegetasi jamur dan berpotensi membuat Anda tidak bisa bergerak. Meskipun tidak dapat meracuni, laba-laba jamur akan mendapatkan ketahanan terhadap kerusakan yang cukup besar jika berada di dekat jamur.
actors.mobs.fungalspinner.name=pemintal jamur
actors.mobs.ghoul.desc=Ketika masyarakat kurcaci perlahan mulai runtuh, dan raja kurcaci saat ini merebut kekuasaan absolut, mereka yang lemah atau yang menentangnya tidak diperlakukan dengan baik. Saat raja semakin mahir menggunakan sihir gelap, ia membengkokkan para kurcaci ini sesuai kehendaknya, dan sekarang mereka menjadi prajurit infanteri pasukannya. Ghoul tidak terlalu kuat sendirian, tetapi selalu bepergian dalam kelompok dan jauh lebih sulit untuk dibunuh dalam jumlah besar. _Ketika ghoul dikalahkan, ia akan bangkit kembali setelah beberapa giliran selama ada ghoul lain di dekatnya._
actors.mobs.ghoul.name=hantu kurcaci
actors.mobs.gnoll.desc=Gnoll adalah humanoid mirip hyena. Mereka tinggal di selokan dan ruang bawah tanah, sesekali naik ke permukaan untuk menyerang. Gnoll pengintai adalah anggota biasa dari kelompok mereka, mereka tidak sekuat para berandal dan tidak secerdas para dukun.
actors.mobs.gnoll.name=pengintai gnoll
actors.mobs.gnollexile.desc=Gnoll berbulu abu-abu ini memiliki tanda besar di bahunya, yang menandakan bahwa ia adalah seorang buangan. Gnoll biasanya diasingkan dari masyarakat mereka karena mengabaikan perintah atau melanggar hukum. Para buangan harus kuat dan cerdik untuk bertahan hidup, dan gnoll ini tampaknya tahu cara menggunakan tombak yang dipegangnya.
actors.mobs.gnollexile.desc_aggro=_Gnoll yang diasingkan itu melihat sekeliling dengan marah._ Sepertinya sesuatu telah membuatnya memutuskan untuk bertarung. Hati-hati dengan tombak itu!
actors.mobs.gnollexile.desc_passive=_Gnoll yang diasingkan itu tidak bergerak untuk menyerang._ Ia tampaknya tidak seagresif gnoll lain di sini, dan mungkin tidak berpikir bahwa melawanmu sepadan. Kau bisa membiarkannya saja, tetapi ia memiliki ransel yang mungkin penuh dengan barang-barang berguna...
actors.mobs.gnollexile.name=pengasingan gnoll
actors.mobs.gnollexile.seen_aggro=Gnoll yang memegang tombak bergerak untuk menyerang!
actors.mobs.gnollexile.seen_passive=Gnoll yang memegang tombak itu menatapmu dengan waspada, tetapi tidak bergerak untuk menyerang.
actors.mobs.gnollgeomancer.alert=Sang ahli geomansi terbangun! Seluruh gua tampak bergeser saat ia melompat pergi sambil tertawa terbahak-bahak!
actors.mobs.gnollgeomancer.desc=Gnoll senior yang bertubuh sangat tinggi ini pastilah sumber dari berbagai sihir penggerak tanah di sekitar sini, dan pengatur semua aktivitas gnoll. Tidak seperti gnoll penyerang di daerah ini, geomancer ini cukup mahir dengan sihirnya, dan tidak dapat terluka oleh batu yang dilempar atau jatuh. Namun, ia tidak memiliki cara untuk bertarung dalam pertarungan jarak dekat.
actors.mobs.gnollgeomancer.desc_armor=Ahli geomansi itu saat ini terbungkus dalam lapisan pelindung batu. _Anda perlu mendekat dan menghancurkannya dengan beliung Anda sebelum dapat melukai ahli geomansi tersebut._
actors.mobs.gnollgeomancer.desc_armor_sapper=Seorang gnoll penjinak ranjau di dekat sini memegang sebuah alat yang memperkuat baju zirah batu sang geomancer. Kau tidak akan bisa merusaknya sama sekali saat ini!
actors.mobs.gnollgeomancer.desc_sleeping=Dukun gnoll yang sangat tinggi ini dikelilingi oleh lapisan batu, dan tampak hampir seperti patung. Jika dilihat lebih dekat, Anda dapat melihat batu itu bergerak secara ajaib seiring dengan pernapasan gnoll senior tersebut. Ia tidak dapat terluka saat terbungkus batu seperti ini, dan tampaknya sedang menikmati tidur nyenyak di dalam tanah. Anda mungkin dapat menembus lapisan batu dengan beliung Anda, tetapi pastikan Anda siap bertarung saat melakukannya. Geomancer ini pasti merupakan sumber dari berbagai sihir penggerak tanah di sekitar sini, dan pengatur semua aktivitas gnoll. Mengalahkan gnoll yang tersebar di sekitar sini sebelum melawannya mungkin merupakan ide yang bagus.
actors.mobs.gnollgeomancer.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.gnollgeomancer.name=ahli geomansi gnoll
actors.mobs.gnollgeomancer.rock_kill=Batu besar yang beterbangan itu membunuhmu...
actors.mobs.gnollgeomancer.rockfall_kill=Batu-batu yang berjatuhan itu membunuhmu...
actors.mobs.gnollgeomancer.warning=Sang ahli geomansi mulai bergerak. Pastikan Anda siap sebelum melanjutkan!
actors.mobs.gnollguard.def_verb=diblokir
actors.mobs.gnollguard.desc=Gnoll besar dan tampak tangguh memegang tombak dan perisai, tetapi tanpa helm. Para penjaga ini kemungkinan adalah preman yang sedang dilatih, yang dipaksa membantu melindungi tambang dari satwa liar yang mengganggu. Penjaga gnoll cukup kuat untuk memegang tombak dengan satu tangan, tetapi tidak dapat menggunakannya dengan baik. Ia membutuhkan ruang yang cukup terbuka untuk menyerang dari jarak jauh, dan akan menyebabkan kerusakan yang jauh lebih sedikit jika Anda mendekat.
actors.mobs.gnollguard.desc_armor=Seorang penjinak gnoll di dekatnya memegang sebuah alat yang memberikan penjaga ini baju besi dari tanah, yang sangat mengurangi kerusakan yang diterimanya.
actors.mobs.gnollguard.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.gnollguard.name=penjaga gnoll
actors.mobs.gnollguard.spear_warn=Gnoll itu melayangkan pukulan ganas dengan ujung tombaknya!
actors.mobs.gnollsapper.desc=Gnoll kecil dan lemah namun cerdas dengan bulu pucat dan tas berisi berbagai macam peralatan. Mereka kemungkinan berada di sini untuk membantu eksplorasi dan penambangan emas gelap, dan memiliki penjaga di dekatnya untuk perlindungan. Mereka mampu bertarung, tetapi serangan mereka sangat lemah, tidak lebih kuat dari pengintai gnoll. Alih-alih bertarung secara langsung, para insinyur lebih suka menggunakan berbagai peralatan yang mereka miliki untuk membuat lingkungan berbatu menyerang mereka. Namun, mereka sendiri tidak mengetahui sihir penggerak tanah, sehingga kemungkinan besar akan menggunakan peralatan mereka secara sembarangan. Seharusnya ada banyak cara untuk menggunakan serangan mereka melawan mereka, atau penjaga mereka.
actors.mobs.gnollsapper.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.gnollsapper.name=penjinak gnoll
actors.mobs.gnolltrickster.desc=Makhluk yang tampak aneh, bahkan menurut standar gnoll. Ia membungkuk ke depan dengan seringai jahat, hampir memeluk tas yang tergantung di bahunya. Matanya melebar dengan campuran aneh antara rasa takut dan kegembiraan. Ada banyak koleksi anak panah yang dibuat dengan buruk di dalam tasnya, semuanya tampak dilapisi dengan berbagai zat berbahaya.
actors.mobs.gnolltrickster.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.gnolltrickster.name=penipu gnoll
actors.mobs.goldenmimic.desc=Mimik adalah makhluk magis yang dapat mengambil bentuk apa pun yang mereka inginkan. Di ruang bawah tanah, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat para petualang yang tidak curiga. Mimik emas adalah mimik yang lebih tangguh yang mencoba menarik para petualang terkuat. Mereka memiliki jarahan yang lebih baik, tetapi juga jauh lebih kuat daripada mimik biasa.
actors.mobs.goldenmimic.name=peniru emas
actors.mobs.golem.def_verb=diblokir
actors.mobs.golem.desc=Para kurcaci mencoba menggabungkan pengetahuan mesin mereka dengan kemampuan baru untuk mengikat elemental. Mereka memakai roh tanah sebagai jiwa bagi tubuh mekanis golem, karena roh itu dianggap paling mudah dikendalikan. Meski begitu, kesalahan sekecil apa pun dalam ritual bisa membuat golem lepas kendali.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=Tak banyak yang diketahui tentang Goo. Mungkin ia bahkan bukan makhluk hidup, melainkan gumpalan zat dari selokan yang mulai memiliki kehendaknya sendiri.
actors.mobs.goo.enraged=sangat marah
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Goo sedang memompa dirinya sendiri!
actors.mobs.goo.rankings_desc=Terserap oleh Lendir
actors.mobs.greatcrab.def_verb=diblokir
actors.mobs.greatcrab.desc=Kepiting ini sangat besar, bahkan dibandingkan dengan kepiting selokan lainnya. Cangkang birunya dipenuhi retakan dan teritip, menunjukkan usianya yang sudah sangat tua. Ia bergerak perlahan, hampir tidak bisa menjaga keseimbangan dengan capitnya yang besar. Meskipun kepiting ini hanya memiliki satu capit, ukurannya yang besar dengan mudah mengimbanginya. Kepiting ini menahan capitnya di depan ancaman apa pun, melindungi dirinya di balik dinding cangkang yang tak tertembus. Namun, kepiting ini tidak dapat memblokir serangan yang tidak terlihatnya, atau serangan dari banyak musuh sekaligus.
actors.mobs.greatcrab.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.greatcrab.name=kepiting besar
actors.mobs.greatcrab.noticed=Kepiting itu menangkis dengan capitnya yang besar.
actors.mobs.guard.def_verb=diblokir
actors.mobs.guard.desc=Dulunya penjaga penjara, para sipir ini sudah lama tidak berbeda dengan para narapidana. Mereka berjalan tertatih-tatih seperti zombie, tanpa otak berkeliaran di lorong-lorong mencari apa pun yang tidak pada tempatnya, seperti kamu! Mereka membawa rantai di pinggang mereka, mungkin digunakan untuk menarik musuh ke jarak dekat.
actors.mobs.guard.name=penjaga penjara
actors.mobs.guard.scorpion=Kemarilah!
actors.mobs.hermitcrab.def_verb=diblokir
actors.mobs.hermitcrab.desc=Entah kenapa, kepiting selokan ini memutuskan untuk mengenakan bagian atas tong yang rusak di kepalanya! Bobot tambahan itu memperlambat gerakannya hingga kecepatan normal, tetapi juga memberinya pertahanan yang jauh lebih besar. Tapi, sepertinya kamu mendengar sesuatu memantul di dalam tong itu...
actors.mobs.hermitcrab.name=kepiting pertapa
actors.mobs.mimic.desc=Mimik adalah makhluk ajaib yang dapat mengambil bentuk apa pun yang mereka inginkan. Di ruang bawah tanah, mereka hampir selalu memilih bentuk peti harta karun, untuk memikat para petualang yang tidak curiga. Mimik memiliki gigitan yang menyakitkan, tetapi seringkali menyimpan lebih banyak harta karun daripada peti biasa.
actors.mobs.mimic.discover_hint=Anda dapat menemukan musuh ini di mana saja di dalam ruang bawah tanah.
actors.mobs.mimic.hidden_hint=Ada yang aneh dengan peti ini... Mendekat dan mencoba membukanya mungkin bukan ide yang bagus.
actors.mobs.mimic.name=mimik
actors.mobs.mimic.reveal=Dada itu adalah peniru!
actors.mobs.mob.died=Anda mendengar sesuatu mati di kejauhan.
actors.mobs.mob.discover_hint=Anda dapat menemukan musuh ini di wilayah tertentu di dalam ruang bawah tanah.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Dibunuh oleh: %s
actors.mobs.monk$focus.desc=Biksu ini sangat fokus pada targetnya, dan tampaknya mengantisipasi gerakan mereka sebelum mereka melakukannya. Saat fokus, serangan fisik berikutnya yang dilancarkan terhadap karakter ini dijamin akan meleset, apa pun keadaannya. Menangkis serangan ini akan menghabiskan fokus biksu, dan mereka perlu membangunnya kembali untuk menangkis serangan lain. Biksu membangun fokus lebih cepat saat mereka bergerak.
actors.mobs.monk$focus.name=terfokus
actors.mobs.monk.def_verb=diblokir
actors.mobs.monk.desc=Para biksu ini adalah kaum fanatik yang mengabdikan diri untuk menjaga rahasia kota dari semua orang luar. Mereka tak memakai zirah ataupun senjata, hanya mengandalkan keahlian bertarung tangan kosong.
actors.mobs.monk.name=biksu kurcaci
actors.mobs.monk.parried=menangkis
actors.mobs.necromancer$necroskeleton.desc=Kerangka ini telah dipanggil oleh seorang ahli sihir necromancer. Ia berperilaku seperti kerangka biasa, dan akan mati ketika necromancer yang memanggilnya terbunuh.
actors.mobs.necromancer$necroskeleton.name=kerangka ahli sihir
actors.mobs.necromancer.desc=Para penyihir gelap pemula ini berbondong-bondong ke penjara, karena tempat itu adalah tempat yang sempurna untuk mempraktikkan ilmu jahat mereka. Para ahli sihir hitam akan memanggil dan memberdayakan kerangka untuk bertarung bagi mereka. Membunuh ahli sihir hitam juga akan membunuh kerangka yang dipanggilnya.
actors.mobs.necromancer.name=ahli nujum
actors.mobs.npcs.blacksmith.cant_enter_old=Area tersebut tidak dapat diakses pada permainan ini. Mainkan permainan baru untuk mencoba misi baru!
actors.mobs.npcs.blacksmith.def_verb=diblokir
actors.mobs.npcs.blacksmith.desc=Pandai besi troll ini tampak seperti semua troll lainnya: ia tinggi dan kurus, dan kulitnya menyerupai batu baik dari segi warna maupun tekstur. Pandai besi troll itu sedang mengutak-atik alat-alat yang ukurannya tidak proporsional.
actors.mobs.npcs.blacksmith.enter_no=Belum
actors.mobs.npcs.blacksmith.enter_yes=Aku Siap
actors.mobs.npcs.blacksmith.entrance_blocked=Jalan turun terblokir.
actors.mobs.npcs.blacksmith.exit_no=Belum
actors.mobs.npcs.blacksmith.exit_warn_crystal=Kristal raksasa itu masih ada di bawah sana juga. Aku akan bayar lebih jika kau menghancurkannya.
actors.mobs.npcs.blacksmith.exit_warn_full=Sudah selesai? Kamu sudah mendapatkan banyak emas, tetapi pastikan kamu tidak meninggalkan perlengkapanmu. Ingat, aku tidak akan mengizinkanmu masuk kembali setelah kamu muncul.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Jamur raksasa itu masih ada di bawah sana juga. Aku akan bayar lebih jika kau membunuhnya.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ahli geomansi gnoll itu masih ada di bawah sana juga. Aku akan bayar lebih jika kau membunuhnya.
actors.mobs.npcs.blacksmith.exit_warn_high=Sudah selesai? Sepertinya kamu sudah mendapatkan cukup banyak emas, tapi aku butuh sedikit lagi. Kamu seharusnya bisa mendapatkan _40 keping._\n\n_Ingat, aku tidak akan mengizinkanmu masuk kembali setelah kamu naik ke atas._
actors.mobs.npcs.blacksmith.exit_warn_low=Kamu sudah selesai? Sepertinya kamu tidak punya banyak emas. Kamu seharusnya bisa mendapatkan _40 keping._\n\n_Ingat, aku tidak akan mengizinkanmu masuk kembali setelah kamu naik ke atas._
actors.mobs.npcs.blacksmith.exit_warn_med=Sudah selesai? Setidaknya kamu sudah mendapatkan emas, tapi pasti masih ada lebih banyak lagi di tambang. Kamu seharusnya bisa mendapatkan 40 keping. Ingat, aku tidak akan membiarkanmu masuk kembali setelah kamu naik ke atas.
actors.mobs.npcs.blacksmith.exit_warn_none=Kamu sudah selesai? Kamu hampir tidak punya emas sama sekali! Kamu seharusnya bisa mendapatkan _40 keping._\n\n_Ingat, aku tidak akan membiarkanmu masuk kembali setelah kamu naik._
actors.mobs.npcs.blacksmith.exit_yes=Aku sudah selesai
actors.mobs.npcs.blacksmith.get_lost=Aku sibuk. Pergi sana!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hei Manusia! Kau tampak seperti orang penting.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Hati-hati, tambang ini berbahaya untuk manusia kecil sepertimu. Tambang ini sudah lama ditinggalkan, dan banyak kristal mulai tumbuh. Kristal-kristal itu berkilau, tetapi terlalu rapuh untuk bernilai apa pun, dan mereka memiliki beberapa benda magis yang melindunginya. Mereka cukup kuat, jadi berhati-hatilah di mana kamu menambang atau kamu akan menarik perhatian mereka. Ada juga kristal raksasa di suatu tempat. Kristal itu jauh lebih keras, jadi bersiaplah untuk bertarung jika kamu mulai menghancurkannya. Aku yakin menghancurkannya akan memperlambat pertumbuhan semua kristal, jadi aku akan membayar lebih jika kamu bisa melakukannya.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hei Manusia! Kau tampak seperti orang yang pemberani.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Hati-hati, tambang itu berbahaya bagi manusia kecil sepertimu. Ada semacam monster jamur yang tumbuh di sana. Ia memiliki penjaga jamur yang sangat mematikan jika mereka melihatmu, tetapi setidaknya mereka tidak bisa bangun dan mengejarmu. _Tetaplah bersembunyi_ jika kamu ingin tetap hidup.\n\nAku akan membayar lebih jika kamu berhasil mengalahkan _jamur terbesar_, tetapi itu akan membutuhkan usaha yang sungguh-sungguh. Jamur itu terhubung ke sejumlah simpul miselium yang tersembunyi di dinding. Kamu harus menghancurkan sebagian besar simpul itu sebelum kamu benar-benar dapat merusaknya.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Hati-hati, tambang ini berbahaya bagi manusia kecil sepertimu. Beberapa gnoll juga menginginkan emas dan sekarang mereka merusak tempat ini. Mereka makhluk bodoh, jadi penambangan mereka telah menyebabkan berbagai macam runtuhan dan longsor. Kamu harus menambang melewatinya, jadi carilah batuan yang baru saja terganggu. Kurasa salah satu gnoll yang menyebabkan sebagian besar masalah, mungkin seorang dukun geomancer atau semacamnya. Aku akan membayar lebih, jika kamu bisa menemukan dan membunuhnya, tapi aku yakin ia akan melawan balik.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hei Manusia! Kamu terlihat seperti orang yang cepat.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hei Manusia! Kamu terlihat seperti orang yang pintar.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hei Manusia! Kau terlihat seperti orang yang licik.
actors.mobs.npcs.blacksmith.intro_quest_start=Mau berguna, ya? Ya, aku punya sesuatu yang bisa kau lakukan. Aku membangun bengkel ini di atas tambang tua, letaknya di bawah tangga itu. Ambil beliung ini dan tambang bijih emas gelap untukku. 40 buah seharusnya cukup. Batuan di bawah sana bagus dan lunak sehingga kau bisa menambang menembus dinding dengan sedikit usaha. Apa maksudmu, bagaimana aku akan membayar? Dasar serakah... Oke, oke, aku bisa membantumu menempa. Anggap dirimu beruntung, aku satu-satunya pandai besi di sekitar sini.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hei Manusia! Kamu terlihat seperti orang yang tangguh.
actors.mobs.npcs.blacksmith.lost_pick=Apa kau bercanda? Di mana beliungku?!
actors.mobs.npcs.blacksmith.name=pandai besi troll
actors.mobs.npcs.blacksmith.quest_start_prompt=Kamu siap turun? Pastikan kamu punya ruang kosong untuk emasnya.\n\n_Aku hanya akan mengecewakanmu sekali saja!_
actors.mobs.npcs.blacksmith.reminder=Kau sudah selesai membuang-buang waktuku? Pintu masuk tambangnya ada di sana.
actors.mobs.npcs.blacksmith.reminder_crystal=Bawalah emas sebanyak mungkin, dan cobalah untuk menghancurkan kristal besar itu juga.
actors.mobs.npcs.blacksmith.reminder_fungi=Bawalah emas sebanyak mungkin untukku, dan cobalah bunuh jamur raksasa itu juga.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bawalah emas sebanyak mungkin untukku, dan cobalah bunuh juga ahli geomansi gnoll itu.
actors.mobs.npcs.ghost.crab_1=Halo %s... Dulu aku sepertimu - kuat dan percaya diri... Tapi aku dibunuh oleh makhluk purba... Aku tak bisa meninggalkan tempat ini... Tidak sampai aku membalas dendam... Membunuh _kepiting raksasa_ yang telah merenggut nyawaku... \n\n Ia sangat tua... Dengan satu capit besar dan cangkang tebal... _Waspadalah terhadap capitnya, kau harus mengejutkan kepiting itu atau ia akan memblokirmu dengan capitnya..._
actors.mobs.npcs.ghost.crab_2=Tolong... Bantu aku... Bunuh Crustacea itu...\n\n_Ia akan selalu memblokir... Saat melihatmu datang..._
actors.mobs.npcs.ghost.desc=Hantu itu hampir tidak terlihat. Ia tampak seperti titik cahaya redup tanpa bentuk dengan wajah sedih.
actors.mobs.npcs.ghost.find_me=Terima kasih... temukan aku...
actors.mobs.npcs.ghost.gnoll_1=Halo %s... Dulu aku sepertimu - kuat dan percaya diri... Tapi aku dibunuh oleh musuh yang licik... Aku tak bisa meninggalkan tempat ini... Tidak sampai aku membalas dendam... Bunuh _gnoll penipu_ yang telah merenggut nyawaku... \n\n Ia tidak seperti gnoll lainnya... Ia bersembunyi dan menggunakan senjata lempar... _Waspadalah terhadap anak panahnya yang beracun dan membakar, jangan menyerang dari jarak jauh..._
actors.mobs.npcs.ghost.gnoll_2=Tolong... Bantu aku... Bunuh si penipu...\n\n_Jangan sampai mengenaimu... Dekati dia..._
actors.mobs.npcs.ghost.name=hantu sedih
actors.mobs.npcs.ghost.rat_1=Halo %s... Dulu aku sepertimu - kuat dan percaya diri... Tapi aku dibunuh oleh binatang buas yang menjijikkan... Aku tak bisa meninggalkan tempat ini... Tidak sampai aku membalas dendam... Bunuh tikus busuk itu, yang telah merenggut nyawaku... \n\n Ia berkeliaran di lantai ini... Menyebarkan kotoran ke mana-mana... Waspadalah terhadap awan bau busuk dan gigitan korosifnya, asamnya larut dalam air...
actors.mobs.npcs.ghost.rat_2=Kumohon... Bantu aku... Bunuh makhluk mengerikan itu...\n\n_Lawan dia di dekat air... Hindari baunya..._
actors.mobs.npcs.imp.cya=Sampai jumpa, %s!
actors.mobs.npcs.imp.desc=Imp adalah iblis tingkat rendah. Mereka tidak terkenal karena kekuatan atau bakat sihir mereka, tetapi mereka cukup cerdas dan ramah. Banyak imp lebih suka hidup di antara makhluk bukan iblis.
actors.mobs.npcs.imp.golems_1=Dalam kasus saya, yang perlu dibunuh adalah _golem_. Begini, saya akan memulai bisnis kecil di sini, tetapi golem-golem bodoh itu merugikan bisnis! Sangat sulit bernegosiasi dengan gumpalan granit yang berkeliaran, sialan mereka! Jadi tolong bunuh... katakanlah _4 ekor_ dan Anda akan mendapatkan hadiah.
actors.mobs.npcs.imp.golems_2=Bagaimana safari golemmu? Jangan lupa untuk mengambil token-token itu.
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.intro=Apakah kamu seorang petualang? Aku suka petualang! Kamu selalu bisa mengandalkan mereka jika ada sesuatu yang perlu dibunuh, kan? Tentu saja dengan imbalan hadiah ;)
actors.mobs.npcs.imp.monks_1=Dalam kasus saya, yang perlu dibunuh adalah para biksu. Begini, saya akan memulai bisnis kecil di sini, tetapi orang-orang gila itu tidak membeli apa pun dan akan menakut-nakuti pelanggan lain. Jadi, tolong bunuh... katakanlah 5 dari mereka dan Anda akan mendapatkan hadiah.
actors.mobs.npcs.imp.monks_2=Oh, kau masih hidup! Aku tahu kung-fu-mu pasti lebih hebat ;) Jangan lupa ambil token-token itu ya.
actors.mobs.npcs.imp.name=imp yang ambisius
actors.mobs.npcs.impshopkeeper.buyback=Si peri kecil dengan riang mengembalikan barang Anda.
actors.mobs.npcs.impshopkeeper.desc=Si peri kecil telah membuka toko kecil di perbatasan aula dalam. Senang melihat wajah yang ramah, tetapi harganya sama sekali tidak ramah.
actors.mobs.npcs.impshopkeeper.greetings=Halo, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Apa yang kamu lakukan %s? Belanja cepat, aku harus pergi dari sini!
actors.mobs.npcs.impshopkeeper.name=imp yang ambisius
actors.mobs.npcs.impshopkeeper.thief=Kupikir aku bisa mempercayaimu!
actors.mobs.npcs.mirrorimage.desc=Ilusi ini sangat mirip denganmu, tetapi lebih pucat dan sedikit berkedut.
actors.mobs.npcs.mirrorimage.discover_hint=Anda dapat menemukan karakter ini dengan gulungan tertentu.
actors.mobs.npcs.mirrorimage.name=gambar cermin
actors.mobs.npcs.npc.discover_hint=Anda dapat menemukan karakter ini di wilayah tertentu di dalam ruang bawah tanah.
actors.mobs.npcs.prismaticimage.desc=Ilusi berkilauan ini sangat mirip dengan Anda, bahkan tampak seperti menggunakan senjata dan baju besi Anda saat ini. Gambar prismatik akan mencoba mencari dan menarik perhatian musuh, menggunakan pertahanan dan kesehatan mereka yang ditingkatkan untuk melindungi Anda. Meskipun mereka tidak memiliki kekuatan ofensif yang sama dengan gambar cermin, mereka memiliki daya tahan yang ditingkatkan, termasuk menerima manfaat dari baju besi Anda. Ketika HP berkurang menjadi 0, gambar prismatik akan memudar selama beberapa giliran, dan masih dapat disembuhkan selama waktu ini. Ketika tidak ada musuh, gambar prismatik akan memudar dan bergabung kembali dengan tuannya.
actors.mobs.npcs.prismaticimage.discover_hint=Anda dapat menemukan karakter ini dengan gulungan tertentu.
actors.mobs.npcs.prismaticimage.name=gambar prisma
actors.mobs.npcs.ratking.confused=Apa... Di mana aku? Kerajaanku membutuhkanku!
actors.mobs.npcs.ratking.crown_after=Apakah Anda menikmati baju zirah baru Anda? Tidak ada jalan kembali!
actors.mobs.npcs.ratking.crown_clothes=Pakai baju dulu! Kamu tidak dalam kondisi yang pantas untuk berbicara dengan bangsawan!
actors.mobs.npcs.ratking.crown_desc=Oh, apakah mahkota itu untukku!? Kelihatannya jauh lebih berkilau daripada milikku, jadi dengan senang hati aku menerimanya!\n\nSebenarnya, kurasa aku bisa menawarkan sesuatu sebagai hadiah untuk mahkota ini. Kekuatan luar biasa yang pantas untuk seorang pahlawan sepertimu! Apakah kau menginginkannya?
actors.mobs.npcs.ratking.crown_fine=Baiklah! Lagipula aku memang tidak menginginkannya...
actors.mobs.npcs.ratking.crown_info=Ceritakan lebih lanjut dulu.
actors.mobs.npcs.ratking.crown_no=Saya lebih memilih tidak...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, terima kasih! Sekarang pergilah dan buat rajamu bangga!
actors.mobs.npcs.ratking.crown_yes=Tentu saja!
actors.mobs.npcs.ratking.desc=Tikus ini sedikit lebih besar dari tikus marsupial biasa. Ia mengenakan mahkota kecil di kepalanya.
actors.mobs.npcs.ratking.desc_birthday=Tikus ini sedikit lebih besar dari tikus marsupial biasa. Ia mengenakan topi pesta hijau kecil sebagai pengganti mahkota biasanya. Selamat ulang tahun, Raja Tikus!
actors.mobs.npcs.ratking.desc_crown=Tikus ini sedikit lebih besar dari tikus marsupial biasa. Ia mengenakan mahkota raja kerdil di kepalanya.
actors.mobs.npcs.ratking.desc_winter=Tikus ini sedikit lebih besar dari tikus marsupial biasa. Ia mengenakan topi kecil meriah sebagai pengganti mahkota biasanya. Selamat Liburan!
actors.mobs.npcs.ratking.discover_hint=Anda dapat menemukan karakter ini di ujung wilayah tertentu di dalam ruang bawah tanah.
actors.mobs.npcs.ratking.name=raja tikus
actors.mobs.npcs.ratking.not_sleeping=Aku tidak tidur!
actors.mobs.npcs.ratking.what_is_it=Apa ini? Aku tidak punya waktu untuk omong kosong ini. Kerajaanku tidak akan memerintah dirinya sendiri!
actors.mobs.npcs.sheep.baa!=Baa!
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.baa?=Baa?
actors.mobs.npcs.sheep.def_verb=diblokir
actors.mobs.npcs.sheep.desc=Ini adalah domba ajaib. Apa yang begitu ajaib tentangnya? Kau tidak bisa membunuhnya. Ia akan berdiri di sana sampai menghilang secara ajaib, sambil mengunyah makanan dengan tatapan kosong.
actors.mobs.npcs.sheep.discover_hint=Anda dapat menemukan karakter ini dengan item atau jebakan tertentu.
actors.mobs.npcs.sheep.name=domba
actors.mobs.npcs.shopkeeper.buyback=Penjaga toko dengan berat hati mengembalikan barang Anda.
actors.mobs.npcs.shopkeeper.desc=Pria bertubuh gemuk ini lebih cocok berada di kawasan perdagangan di kota besar daripada di penjara bawah tanah. Harga yang ia tetapkan menjelaskan mengapa ia lebih suka berbisnis di sini.
actors.mobs.npcs.shopkeeper.flee=Penjaga toko itu melarikan diri!
actors.mobs.npcs.shopkeeper.name=pemilik toko
actors.mobs.npcs.shopkeeper.sell=Jual barang
actors.mobs.npcs.shopkeeper.talk=Bicara
actors.mobs.npcs.shopkeeper.talk_ascent=Aku tidak tahu apa yang kau rencanakan dengan jimat itu, tapi aku tidak mau terlibat. Beli sesuatu dan pergilah, kita berdua harus meninggalkan tempat ini!
actors.mobs.npcs.shopkeeper.talk_caves=Habiskan uang, hiduplah lebih lama.\n\nOh dan sampaikan salamku kepada pandai besi Troll itu jika kau bertemu dengannya. Ingatkan si bodoh itu bahwa dia masih berhutang uang padaku untuk palu yang kujual padanya minggu lalu!
actors.mobs.npcs.shopkeeper.talk_city=Barang dagangan saya dapat menjaga Anda tetap aman di sini.\n\n...Dan jangan berlama-lama di sini. Butuh waktu lama untuk membuat penduduk setempat di sini meninggalkan saya sendirian, saya tidak ingin Anda menarik masalah!
actors.mobs.npcs.shopkeeper.talk_halls=Hei, aku punya harga spesial untuk pemburu iblis!\n\nOh, dan hati-hati di bawah sana! Para iblis di bawah tidak akan peduli seberapa berani kamu. Kamu tidak bisa kembali ke atas dan menghabiskan lebih banyak uang jika kamu sudah mati! ;)\n\nApakah para iblis seperti aku? Hehe, tidak sama sekali. Aku hanya orang kecil, bukan petarung yang hebat, dan aku berhasil menjaga kewarasanku. Para iblis di bawah jauh lebih kuat, dan mereka semua telah diperbudak oleh... yah... hati-hati saja di bawah sana.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Halo Yang Mulia, atau sekarang Anda dipanggil Yang Mulia Raja? Hehe, bagaimanapun juga ini bukan tempat yang tepat untuk Anda, banyak orang akan sangat sedih jika Anda sampai meninggal. Tapi Anda pasti punya banyak uang, kenapa tidak membeli sesuatu untuk mencegah hal itu?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Wah, ini dia sang pahlawan pengembara! Jika kau mencoba menyelamatkan kota lain, semoga beruntung, bahaya di sini jauh lebih buruk daripada geng bandit kecil. Aku yakin kau akan melakukannya lebih baik daripada siapa pun, hanya saja jangan sampai mati tepat di depan tokoku.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Anda sepertinya tidak cocok di sini, Nona. Lorong-lorong penjara bawah tanah yang sempit tidak seluas aula besar atau hutan yang mengelilingi kota, bukan? Hehe, oh, jangan pedulikan ocehan saya, kenapa tidak membeli sesuatu saja?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Aku punya semua yang kamu butuhkan untuk petualangan yang sukses!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, sepertinya aku pernah melihat poster buronan dengan namamu di suatu tempat di kota ini. Sedang buron ya? Oh, kau tidak bersalah ya? Tentu saja, tentu saja... Jangan khawatir, aku punya hal yang lebih penting untuk dilakukan daripada melaporkanmu, tapi mungkin kau sebaiknya membeli sesuatu untuk berjaga-jaga?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Apakah kau datang dari perkumpulan pencuri untuk membersihkan area ini? Bukan, hanya berbelanja? Baiklah, bunuh saja beberapa monster selagi kau di sini. Jangan harap diskon juga, aku membayar uang perlindungan yang cukup besar kepada kalian dan kalian hampir tidak bisa melindungiku di sini.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Segel yang menarik yang kau punya, biasanya segel utuh. Kau pahlawan yang tercela atau semacamnya? Yah, apa pun yang telah kau lakukan bukanlah urusanku, koinmu masih berlaku.
actors.mobs.npcs.shopkeeper.thief=Pencuri, Pencuri!
actors.mobs.npcs.shopkeeper.warn=Hati-hati! Aku tidak akan memperingatkanmu lagi.
actors.mobs.npcs.vaultlaser.desc=Penjaga ini menembakkan laser secara berkala. Karena ini hanya area uji coba, laser tersebut sebenarnya tidak akan membahayakan Anda.
actors.mobs.npcs.vaultlaser.name=penjaga laser brankas
actors.mobs.npcs.vaultsentry.desc=Penjaga ini sedang memindai area tersebut dengan pola tertentu. Karena ini hanya area uji coba, penjaga tidak akan melakukan apa pun jika mendeteksi Anda.
actors.mobs.npcs.vaultsentry.name=penjaga pemindai brankas
actors.mobs.npcs.wandmaker.def_verb=diblokir
actors.mobs.npcs.wandmaker.desc=Pria tua yang sehat ini tampak sedikit bingung. Ia dilindungi oleh perisai sihir.
actors.mobs.npcs.wandmaker.intro_1=I datang ke sini untuk mencari bahan langka untuk tongkat sihir, tetapi saya tersesat, dan perisai sihir saya melemah. Saya harus segera pergi, tetapi tidak tahan pergi tanpa mendapatkan apa yang saya cari.
actors.mobs.npcs.wandmaker.intro_2=Jika kau bisa mendapatkan itu untukku, aku akan dengan senang hati membayarmu dengan salah satu tongkat sihirku yang dibuat dengan indah! Aku membawa dua, jadi kau bisa mengambil yang mana pun yang kau suka.
actors.mobs.npcs.wandmaker.intro_berry=Sipir tua penjara ini memelihara tanaman rotberry, dan saya ingin mendapatkan salah satu bijinya. Tanaman itu mungkin sudah tumbuh liar sekarang, jadi mendapatkan bijinya mungkin agak sulit. Kebunnya seharusnya berada di sekitar sini. Cobalah untuk menjauh dari cambuk sulurnya jika Anda ingin tetap selamat. Menggunakan api mungkin menggoda, tetapi tolong jangan, Anda akan membunuh tanaman itu dan menghancurkan bijinya.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, halo Yang Mulia! Sungguh kejutan yang menyenangkan bertemu Anda di tempat yang suram ini! Maaf mengganggu, tapi saya mungkin punya tugas untuk Anda.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, halo nona! Sungguh kejutan yang menyenangkan bertemu seorang pahlawan di tempat yang begitu menyedihkan! Jika Anda bersedia membantu orang tua ini, saya mungkin punya tugas untuk Anda.
actors.mobs.npcs.wandmaker.intro_dust=Aku sedang mencari _debu mayat_. Itu adalah jenis tepung tulang terkutuk khusus yang biasanya muncul di tempat-tempat seperti ini. Pasti ada ruangan yang dibarikade di sekitar sini, aku yakin beberapa debu akan muncul di sana. Tapi hati-hati, kutukan yang dibawa debu itu cukup kuat, _hubungi aku secepat mungkin_ dan aku akan membersihkannya untukmu.
actors.mobs.npcs.wandmaker.intro_ember=Aku sedang mencari _bara api segar_ dari elemental api yang baru lahir. Elemental biasanya muncul ketika ritual pemanggilan tidak terkendali, jadi cukup temukan beberapa lilin dan tempat ritual, dan aku yakin kamu bisa memunculkannya. Kamu sebaiknya _menghindari mengurung diri_ saat melawannya, atau kamu bisa _menyimpan semacam benda pembeku._ Elemental yang baru lahir cukup kuat dan kacau, tetapi mereka tidak tahan dingin.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, halo nona! Wajah ramah adalah kejutan yang menyenangkan di sini, bukan? Sebenarnya, aku yakin pernah melihat wajahmu sebelumnya, tapi aku tidak ingat di mana... Ah, sudahlah, jika kau di sini untuk berpetualang, mungkin aku punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_mage=Oh, halo %s! Kudengar ada keributan mengenai dirimu dan institut penyihir? Ah, sudahlah, aku memang tidak pernah menyukai orang-orang yang kaku itu. Jika kau bersedia, mungkin aku punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_rogue=Astaga, kau membuatku terkejut! Aku belum pernah bertemu bandit dari tempat ini yang masih waras, jadi kau pasti berasal dari permukaan! Jika kau bersedia membantu orang asing, mungkin aku punya tugas untukmu.
actors.mobs.npcs.wandmaker.intro_warrior=Oh, halo! Sungguh kejutan yang menyenangkan bertemu dengan seorang prajurit dari utara di tempat yang suram ini! Anda pasti telah menempuh perjalanan yang cukup jauh untuk sampai di sini. Jika Anda mencari petualangan, saya mungkin punya tugas untuk Anda.
actors.mobs.npcs.wandmaker.name=pembuat tongkat sihir tua
actors.mobs.npcs.wandmaker.reminder_berry=Apakah kamu berhasil mendapatkan biji Rotberry, %s? Carilah ruangan yang penuh dengan tanaman.
actors.mobs.npcs.wandmaker.reminder_dust=Apakah kamu beruntung mendapatkan debu mayat, %s? Cari beberapa barikade.
actors.mobs.npcs.wandmaker.reminder_ember=Apakah kamu berhasil menemukan bara api itu, %s? Kamu perlu menemukan empat lilin dan lokasi ritualnya.
actors.mobs.phantompiranha.desc=Piranha hantu adalah jenis piranha langka dengan kemampuan magis dan tubuh tembus pandang yang menyeramkan. Mereka mampu berteleportasi saat diserang, baik untuk melarikan diri atau untuk dengan cepat mendekati musuh mereka! Meskipun menyebalkan untuk dilawan, daging mereka dihargai karena sifat magisnya.
actors.mobs.phantompiranha.name=piranha hantu
actors.mobs.phantompiranha.teleport_away=Ikan piranha hantu itu berteleportasi pergi...
actors.mobs.piranha.desc=Ikan karnivora ini dibiakkan secara khusus untuk melindungi daerah yang tergenang banjir. Gigitannya mematikan, jadi sebaiknya hindari berhadapan langsung dengan mereka.
actors.mobs.piranha.discover_hint=Anda dapat menemukan musuh ini di mana saja di dalam ruang bawah tanah.
actors.mobs.piranha.name=piranha raksasa
actors.mobs.pylon.desc_active=Sebuah tiang listrik, yang dimaksudkan untuk membantu mengatur listrik yang memberi daya pada mesin di area ini. Tiang listrik tersebut saat ini dibanjiri energi listrik, ini pasti yang memberi daya super pada DM-300!\n\nDalam keadaan ini, tiang listrik rentan, tetapi akan memancarkan listrik ke sel-sel terdekat dalam pola searah jarum jam. Karena konstruksi logamnya yang berat, tiang listrik tahan terhadap kerusakan dalam jumlah besar.
actors.mobs.pylon.desc_inactive=Sebuah tiang listrik, yang dimaksudkan untuk membantu mengatur aliran listrik yang menggerakkan mesin-mesin di area ini.\n\nTiang listrik ini saat ini tidak aktif dan kebal terhadap kerusakan.
actors.mobs.pylon.name=tiang listrik
actors.mobs.rat.desc=Tikus marsupial adalah hewan agresif namun relatif lemah yang hidup di saluran pembuangan. Gigitannya menyakitkan, tetapi hanya mengancam jiwa jika jumlahnya banyak.
actors.mobs.rat.name=tikus marsupial
actors.mobs.ripperdemon.desc=Makhluk-makhluk mengerikan ini adalah hasil dari banyaknya mayat kurcaci di wilayah ini yang dimanfaatkan oleh kekuatan iblis. Ripper adalah makhluk-makhluk mengerikan yang kurus kering dan menyerupai kurcaci, tetapi dengan tubuh yang hancur dan cakar panjang tajam yang terbuat dari tulang. Setan Ripper tidak terlalu tahan banting, tetapi mereka lincah dan berbahaya. Mereka mampu melompat jauh untuk dengan cepat mencapai target sebelum menusuknya dengan cakar mereka.
actors.mobs.ripperdemon.leap=Setan pembantai bersiap untuk melompat!
actors.mobs.ripperdemon.name=iblis perobek
actors.mobs.rotheart.desc=Buah Rotberry sangat unik. Alih-alih membusuk dan menyediakan nutrisi, buah tersebut tumbuh, mengeras, dan membungkus bijinya. Buah ini memberikan perlindungan bagi organ-organ internal yang tumbuh di dalamnya. Bola raksasa ini disebut sebagai jantung tanaman Rotberry dewasa.
actors.mobs.rotheart.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.rotheart.name=jantung yang membusuk
actors.mobs.rotlasher.desc=Rot lasher adalah bagian dari struktur akar tanaman rotberry dewasa, dan juga merupakan sarana pertahanan utama mereka. Lasher buta dan tertancap di tanah, tetapi akan menyerang dengan ganas ancaman apa pun di dekatnya setelah beberapa saat mendeteksinya. Ketika tidak ada musuh di dekatnya, mereka berdiri tanpa bergerak, mencoba menyatu dengan vegetasi di sekitarnya.
actors.mobs.rotlasher.discover_hint=Anda dapat menemukan musuh ini selama misi tertentu.
actors.mobs.rotlasher.name=pemusnah
actors.mobs.scorpio.desc=Makhluk iblis raksasa mirip laba-laba ini menghindari pertempuran jarak dekat, lebih memilih menembakkan duri bergerigi yang melumpuhkan dari jarak jauh.
actors.mobs.scorpio.name=kalajengking
actors.mobs.senior.desc=Para biksu ini adalah kaum fanatik yang mengabdikan diri untuk menjaga rahasia kota dari semua orang luar. Mereka tak memakai zirah ataupun senjata, hanya mengandalkan keahlian bertarung tangan kosong.
actors.mobs.senior.name=biksu senior
actors.mobs.shaman$blueshaman.spell_desc=Dukun ini mengenakan topeng biru, dan akan menggunakan sihir yang untuk sementara meningkatkan kerusakan yang Anda terima.
actors.mobs.shaman$purpleshaman.spell_desc=Dukun ini mengenakan topeng ungu, dan akan menggunakan sihir yang untuk sementara _mengurangi akurasi dan penghindaran Anda._
actors.mobs.shaman$redshaman.spell_desc=Dukun ini mengenakan topeng merah, dan akan menggunakan sihir yang untuk sementara _melemahkan kekuatan seranganmu._
actors.mobs.shaman.bolt_kill=Petir ajaib itu membunuhmu...
actors.mobs.shaman.desc=Gnoll yang paling cerdas bisa menguasai sihir dukun. Dukun gnoll mengandalkan mantra tempur untuk menutupi kekurangan tenaga, dan tak ragu memakainya pada siapa pun yang mempertanyakan kedudukan mereka dalam suku.
actors.mobs.shaman.name=dukun gnoll
actors.mobs.skeleton.def_verb=diblokir
actors.mobs.skeleton.desc=Kerangka tersusun dari tulang para petualang malang dan penghuni ruang bawah tanah, yang dihidupkan oleh sihir jahat dari kedalaman. Setelah cukup rusak, mereka hancur dalam ledakan tulang.
actors.mobs.skeleton.explo_kill=Kau tewas akibat ledakan tulang...
actors.mobs.skeleton.name=kerangka
actors.mobs.slime.def_verb=diblokir
actors.mobs.slime.desc=Slime adalah makhluk aneh, sedikit magis, dengan tubuh luar seperti karet dan inti cair. Saluran pembuangan kota menyediakan pasokan air dan nutrisi yang melimpah bagi mereka. Karena membran luarnya yang elastis, sulit untuk memberikan lebih dari 6 kerusakan pada slime dari satu serangan.
actors.mobs.slime.name=lendir
actors.mobs.snake.desc=Ular-ular raksasa ini mampu dengan cepat menghindari serangan, sehingga cukup sulit untuk dipukul. Namun, serangan sihir atau serangan mendadak mampu membuat mereka lengah. Anda dapat melakukan serangan mendadak dengan menyerang saat berada di luar pandangan ular. Salah satu caranya adalah membiarkan ular mengejar Anda melalui ambang pintu dan kemudian menyerang tepat setelah ular masuk ke dalam pintu.
actors.mobs.snake.hint=Cobalah menggunakan tombol periksa pada ular untuk mempelajari cara melawannya.
actors.mobs.snake.name=ular selokan
actors.mobs.spectralnecromancer.desc=Meskipun kerangka adalah andalan seorang ahli sihir necromancer, beberapa lebih memilih untuk mencari antek lain yang kurang berwujud. Necromancer spektral telah memilih hantu sebagai antek pilihan mereka! Hantu individu tidak sekuat kerangka, tetapi para necromancer ini tidak takut untuk memanggil banyak hantu!
actors.mobs.spectralnecromancer.name=ahli sihir spektral
actors.mobs.spinner.desc=Laba-laba gua berbulu kehijauan ini menghindari pertarungan langsung. Mereka lebih suka menunggu dari jauh, sementara korbannya yang terjerat jaring perlahan mati akibat gigitan beracun.
actors.mobs.spinner.name=pemintal gua
actors.mobs.statue.def_verb=diblokir
actors.mobs.statue.desc=Anda mungkin mengira itu hanyalah salah satu patung tak bernyawa di ruang bawah tanah ini, tetapi mata merahnya yang berc bercahaya membongkar rahasianya.
actors.mobs.statue.desc_weapon=Meskipun patungnya sendiri terbuat dari batu, _%s_ yang dipegangnya tampak nyata.
actors.mobs.statue.discover_hint=Anda dapat menemukan musuh ini di mana saja di dalam ruang bawah tanah.
actors.mobs.statue.name=patung animasi
actors.mobs.succubus.desc=Sukubus adalah iblis yang menyerupai gadis menggoda dengan gaya agak gotik. Sihirnya dapat memikat seorang pahlawan, sehingga ia tak bisa menyerang apa pun sampai pesonanya lenyap.
actors.mobs.succubus.name=sukubus
actors.mobs.swarm.desc=Kawanan lalat yang mematikan itu berdengung dengan marah. Setiap serangan non-magis akan memecahnya menjadi dua kawanan yang lebih kecil namun sama berbahayanya.
actors.mobs.swarm.name=kawanan lalat
actors.mobs.tengu$bombability$bombblob.desc=Kepulan asap yang sangat panas membubung di sini. Awas, ini akan meledak!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Benda itu menempel di tanah, kamu tidak bisa memindahkannya!
actors.mobs.tengu$bombability$bombitem.desc=Tengu telah melemparkan bom asap aneh ke sini, yang mengeluarkan asap tebal dan panas. Bom itu mengeluarkan suara detikan keras, seolah-olah sedang menghitung mundur menuju ledakan! Bom itu tertancap di tanah, jadi kamu tidak bisa mengambilnya.
actors.mobs.tengu$bombability$bombitem.name=bom asap
actors.mobs.tengu$fireability$fireblob.desc=Tengu telah melemparkan bubuk halus yang tampaknya berubah menjadi uap di sini, bubuk itu akan segera terbakar!
actors.mobs.tengu$shockerability$shockerblob.desc=Energi listrik sedang menumpuk di sini, apa pun yang berdiri di atas ubin ini akan tersengat listrik pada giliran berikutnya!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Ini menghasilkan terlalu banyak listrik, kamu tidak bisa meraihnya!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu telah melemparkan sebuah mesin aneh ke sini, yang tampaknya terbuat dari komponen DM-100. Mesin itu terus-menerus memancarkan percikan listrik di sekitarnya, tetapi tampaknya mengikuti pola yang dapat diprediksi. Dengan semua percikan listrik di sekitarnya, tidak mungkin Anda dapat mengambilnya.
actors.mobs.tengu$shockerability$shockeritem.name=Mengejutkan
actors.mobs.tengu.defeated=Akhirnya bebas...
actors.mobs.tengu.desc=Tengu adalah anggota klan pembunuh kuno yang juga bernama Tengu. Mereka terkenal sering memakai shuriken dan perangkap.
actors.mobs.tengu.interesting=Mari kita buat ini menarik...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Ketahuan, %s!
actors.mobs.tengu.notice_have=Sekarang aku sudah menangkapmu, %s!
actors.mobs.tengu.rankings_desc=Dibunuh oleh Tengu
actors.mobs.thief.carries=Pencuri itu membawa _%s._ Jelas sekali barang curian.
actors.mobs.thief.desc=Meskipun para narapidana ini bebas berkeliaran di luar sel mereka, tempat ini tetaplah penjara mereka. Seiring waktu, tempat ini telah merampas pikiran dan kebebasan mereka. Dahulu kala, para pencuri dan bandit gila ini telah lupa siapa mereka dan mengapa mereka mencuri. Musuh-musuh ini lebih cenderung mencuri dan melarikan diri daripada melawan. Pastikan untuk selalu mengawasi mereka, atau Anda mungkin tidak akan pernah melihat barang curian Anda lagi.
actors.mobs.thief.escapes=Pencuri itu berhasil membawa kabur %s Anda!
actors.mobs.thief.name=pencuri gila
actors.mobs.thief.stole=Pencuri itu mencuri %s darimu!
actors.mobs.tormentedspirit.desc=Roh yang tersiksa adalah roh yang pada dasarnya baik hati yang telah terkena kutukan. Selama mereka terkutuk, mereka akan menyerang seperti hantu, dan juga lebih kuat! Mungkin kutukan tersebut dapat dihilangkan dengan menggunakan benda yang tepat saat berada di dekat roh tersebut. Jika kutukan tersebut terangkat, roh itu pasti akan berterima kasih...
actors.mobs.tormentedspirit.name=roh yang tersiksa
actors.mobs.tormentedspirit.thank_you=Terima kasih...
actors.mobs.vaultrat.desc=Tikus ini memiliki beberapa perubahan perilaku untuk menguji AI musuh brankas yang baru:\n_-_ Pergerakannya dapat 'terdengar' melalui dinding\n_-_ Ia akan berkeliaran di sepanjang patroli yang telah ditentukan\n_-_ Saat berkeliaran, jangkauan deteksinya berkurang tajam di belakang arah pergerakannya.\n_-_ Saat tidur, jangkauan deteksinya juga berkurang\n_-_ Saat mendeteksi Anda, ia akan 'menyelidiki' sebelum beralih ke berburu. Musuh yang sedang menyelidiki bergerak ke arah Anda tetapi tidak menyerang dan lebih mudah untuk dihindari di balik pintu dan sudut.
actors.mobs.warlock.bolt_kill=Petir bayangan itu membunuhmu...
actors.mobs.warlock.desc=Ketika minat para kurcaci beralih dari teknik ke ilmu gaib, para penyihir gelap merebut kekuasaan di kota. Mereka memulai dengan sihir unsur, lalu beralih ke ilmu iblis dan sihir kematian.
actors.mobs.warlock.name=penyihir kurcaci
actors.mobs.wraith.desc=Hantu adalah roh pendendam dari seorang pendosa, yang kuburan atau makamnya diganggu. Karena merupakan entitas eterik, sangat sulit untuk mengenainya dengan senjata biasa.
actors.mobs.wraith.discover_hint=Anda dapat menemukan musuh ini di mana saja di dalam ruang bawah tanah.
actors.mobs.wraith.name=hantu
actors.mobs.yogdzewa$larva.desc=Makhluk-makhluk kecil keturunan Yog-Dzewa ini adalah antek-antek sederhana yang mudah diproduksi. Meskipun secara individu lemah, mereka dipanggil dengan cepat dan dapat menjadi sangat kuat dalam jumlah besar.
actors.mobs.yogdzewa$larva.name=larva dewa
actors.mobs.yogdzewa$larva.rankings_desc=Ditelan oleh Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Ditelan oleh Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Ditelan oleh Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Ditelan oleh Yog-Dzewa
actors.mobs.yogdzewa.darkness=Kegelapan semakin mendekat...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa adalah Dewa Kuno; monster besar yang menjangkau dunia fana dan melahapnya untuk memicu pertumbuhannya yang tak berujung. Para kurcaci pasti telah menarik perhatian kengerian kosmik ini saat bermain-main dengan sihir gelap, dan telah berusaha untuk menahannya sejak saat itu. Yog-Dzewa berasal dari dimensi kekacauan magis mentah, dan tidak dapat membawa wujud aslinya ke dunia ini. Sebagai gantinya, ia telah menciptakan avatar dan memanggil antek-antek iblis untuk melakukan perintahnya di sini. Mata raksasa ini adalah titik fokus kekuatan Yog-Dzewa di dunia ini. Meskipun mata itu sendiri tidak bergerak, ia mampu menembakkan sinar sihir iblis yang kuat dan memanggil berbagai antek untuk membantunya.
actors.mobs.yogdzewa.desc_spawners=Kau bisa merasakan gelombang energi iblis memancar ke mata dari lantai atas. Sesuatu yang kau biarkan hidup di sana pasti menyalurkan kekuatan kembali ke Yog-Dzewa. _Yog akan menggunakan energi ini untuk memanggil antek-antek yang lebih kuat!_
actors.mobs.yogdzewa.hope=HARAPANMU HANYALAH ILUSI!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=AKU. MELIHAT.MU.
actors.mobs.yogdzewa.rankings_desc=Ditelan oleh Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Kepalan tangan ini terbentuk dari energi cahaya murni. Ia mampu menembakkan sinar cahaya yang sangat kuat dan menyengat setiap giliran! Sinar ini akan membutakan Anda sementara waktu selain memberikan kerusakan yang besar. Kepalan tangan ini juga mampu menyelimuti arena dengan cahaya yang menyilaukan untuk melarikan diri! Namun, kepalan tangan ini tidak memiliki kemampuan khusus yang dapat digunakan dalam jarak dekat.
actors.mobs.yogfist$brightfist.name=kepalan tangan terang
actors.mobs.yogfist$brightfist.teleport=Kepalan tangan itu berteleportasi dalam kilatan cahaya yang benar-benar membutakanmu!
actors.mobs.yogfist$burningfist.desc=Tinju besar berselubung api. Jari-jarinya berderak saat mengepal, menjatuhkan bara ke lantai.
actors.mobs.yogfist$burningfist.name=kepalan tangan yang membara
actors.mobs.yogfist$darkfist.desc=Kepalan tangan ini terbentuk dari energi gelap murni. Ia mampu menembakkan ledakan sihir gelap yang kuat setiap giliran! Ledakan ini akan melemahkan sumber cahaya Anda selain memberikan kerusakan besar. Kepalan tangan ini juga mampu menyelimuti arena dalam kegelapan untuk melarikan diri! Namun, kepalan tangan ini tidak memiliki kemampuan khusus yang dapat digunakan dalam jarak dekat.
actors.mobs.yogfist$darkfist.name=kepalan tangan gelap
actors.mobs.yogfist$darkfist.teleport=Kepalan tangan itu berteleportasi dalam ledakan kegelapan yang memadamkan sumber cahayamu!
actors.mobs.yogfist$rottingfist.desc=Tinju raksasa dari daging busuk. Lendir berbau menusuk merembes di sela-sela jarinya dan mengotori batu di bawahnya.
actors.mobs.yogfist$rottingfist.name=kepalan tangan yang membusuk
actors.mobs.yogfist$rustedfist.desc=Kepalan tangan ini terbuat dari logam hidup. Ia merupakan massa logam yang menjulang tinggi dan dapat berubah bentuk, memiliki serangan jarak dekat yang kuat, dan dapat melumpuhkan targetnya dari jarak jauh. Karena massanya yang sangat besar, kepalan tangan ini akan menerima kerusakan yang ditimbulkan secara bertahap, bukan secara langsung. Namun, kepalan tangan ini tidak fleksibel dan tidak dapat bergerak ke lorong-lorong sempit. Selain itu, meskipun mungkin menerima kerusakan secara perlahan, kerusakan yang tertunda akan terus meningkat jika kepalan tangan tersebut terkena serangan beberapa kali.
actors.mobs.yogfist$rustedfist.name=kepalan tangan berkarat
actors.mobs.yogfist$soiledfist.desc=Kepalan tangan ini terbentuk dari sihir tanah yang kacau. Saat bergerak, ia akan terus menerus menyebabkan tumbuh-tumbuhan tumbuh di sekitarnya. Ia juga dapat menembakkan ledakan tanah terkonsentrasi yang akan menjebak targetnya dalam sulur dan akar yang tumbuh dengan cepat! Kepalan tangan ini memperoleh kekuatan dari kehidupan tumbuhan ini, dan akan menahan kerusakan berdasarkan jumlah vegetasi tinggi atau berlekuk di dekatnya!
actors.mobs.yogfist$soiledfist.name=kepalan tangan kotor
actors.mobs.yogfist.desc=Kepalan tangan ini merupakan salah satu aspek kekuatan Yog-Dzewa. Kepalan tangan dikaitkan dengan kekuatan Yog-Dzewa, dan akan terlindungi dari segala kerusakan ketika berada dekat dengan mata.
actors.mobs.yogfist.invuln_warn=Kepalan tangan kebal saat berada di dekat mata!
actors.mobs.yogfist.rankings_desc=Ditelan oleh Yog-Dzewa
actors.char.def_verb_evaded=menghindari
actors.char.enemy_hit=%s menyerangmu
actors.char.enemy_missed=Seranganmu %2$s %1$s
actors.char.hit=%s mengenai %s
actors.char.mob_missed=Serangan %1$s %2$s %3$s
actors.char.out_of_paralysis=Rasa sakit itu menyadarkan %s dari kelumpuhan.
actors.char.you_hit=Anda menekan %s
actors.char.you_missed=%1$s %2$s seranganmu
actors.mobs.mob.fleeing=%s sedang melarikan diri
actors.mobs.mob.hunting=%s sedang berburu
actors.mobs.mob.passive=%s bersifat pasif
actors.mobs.mob.sleeping=%s sedang tidur
actors.mobs.mob.wandering=%s sedang berkeliaran
actors.mobs.elemental.desc=Elemental api yang berkeliaran adalah sisa dari pemanggilan makhluk yang lebih kuat. Sifat mereka terlalu kacau untuk dikendalikan, bahkan oleh ahli ilmu iblis terkuat sekalipun.
actors.mobs.elemental.name=elemental api
actors.mobs.king.desc=Raja terakhir para kurcaci dikenal sangat memahami kehidupan dan kematian. Ia membujuk anggota istananya untuk mengikuti ritual yang konon akan memberi mereka masa muda abadi. Pada akhirnya, hanya sang raja yang mendapatkannya — beserta pasukan mayat hidup.
actors.mobs.king.name=Raja Kurcaci
actors.mobs.npcs.bee.desc=Meski kecil, lebah emas melindungi tuannya dengan ganas. Namun, umur mereka tak panjang.
actors.mobs.npcs.bee.name=lebah emas
actors.mobs.shielded.desc=Gnoll bengis adalah yang paling besar, kuat, dan tangguh di antara para gnoll. Saat terluka parah, mereka mengamuk dan menimbulkan kerusakan yang lebih besar pada musuh.
actors.mobs.shielded.name=gnoll bengis berperisai
actors.mobs.yog.desc=Yog-Dzewa adalah Dewa Kuno, entitas kuat dari alam kekacauan. Seabad yang lalu, para kurcaci kuno nyaris memenangkan perang melawan pasukan iblisnya, tetapi tidak mampu membunuh dewa itu sendiri. Sebagai gantinya, mereka kemudian memenjarakannya di aula di bawah kota mereka, karena percaya bahwa dewa itu terlalu lemah untuk bangkit kembali.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s membawa _%s_. Jelas sekali barang curian.
actors.buffs.armorevasion.name=Lebih lincah
actors.mobs.king.defeated=Kau tidak bisa membunuhku, %s... Aku ... abadi...
