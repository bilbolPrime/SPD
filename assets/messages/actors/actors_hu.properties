actors.blobs.sacrificialfire.desc=Van itt egy oltár, tetején áldozati tűz ég. Minden itt megölt lényt elfogyasztanak, felajánlva a kazamata szellemeinek.\n\nTalán jutalmat kapnak, ha elég áldozatot mutatnak be?
actors.blobs.sacrificialfire.name=áldozati tűz
actors.blobs.sacrificialfire.reward=A tűz fellobban, majd eloszlik, jutalmat hagyva maga után!
actors.blobs.sacrificialfire.unworthy=A tűz megemészti az áldozatodat, de nem változik.
actors.blobs.sacrificialfire.worthy=A tűz megemészti az áldozatodat és egyre erősebbé válik.
actors.blobs.smokescreen.desc=Sűrű, fekete füstfelhő kavarog itt.
