actors.blobs.toxicgas.desc=Egy zöldes, mérgező gázfelhő kavarog itt.
actors.blobs.toxicgas.name=mérgező gáz
actors.blobs.toxicgas.ondeath=Meghaltál a mérgező gáztól...
actors.blobs.toxicgas.rankings_desc=Megfulladt
actors.blobs.waterofawareness.desc=A kút vizéből tudás ereje árad. A kútból iszva teljes mértékben azonosíthatod az összes felszerelt tárgyat, a leltárodban lévő összes tárgyon lévő átkokat, és felfeded az aktuális szinten lévő összes tárgyat.
actors.blobs.waterofawareness.name=a tudatosság vize
actors.blobs.waterofawareness.procced=Ahogy kortyolsz egyet, úgy érzed, tudás árad az elmédbe.
actors.blobs.waterofhealth.desc=Az egészség ereje sugárzik ebből a kútból. Ha ebből a kútból iszol, begyógyítja a sebeidet, csillapítja az éhségedet, és letörli az átkokat a kopott tárgyakról.
actors.blobs.waterofhealth.name=az egészség vize
actors.blobs.waterofhealth.procced=Ahogy belekortyolsz, érzed, hogy a sebeid teljesen begyógyulnak.
actors.blobs.web.desc=Egy vastag háló borít mindent itt. Bármi, ami hozzáér a hálóhoz, vagy átrepül rajta, elszakítja azt, de egyben a helyén is marad.
actors.blobs.web.name=pókháló
actors.buffs.adrenaline.desc=A fizikai erő fellendülése és az adrenalin fokozta mind a támadási, mind a mozgási sebességet.\n\nAz adrenalin lehetővé teszi, hogy a célpont kétszeres sebességgel fusson, és 1,5-szeres sebességgel támadjon.\n\nHátralévő körök: %s.
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenalinesurge.desc=Hatalmas erőhullám, de sajnos nem állandó.\n\nErőnövelés: +%d.\nFordul, amíg a lendület gyengül: %s.
actors.buffs.adrenalinesurge.name=erőnövelés
actors.buffs.amok.desc=Az ámokfutás nagy dühöt és zavartságot okoz a célpontjában.\n\nAmikor egy lény füstöl, megtámad mindent, ami a közelében van, legyen az barát vagy ellenség.\n\nHátralévő ámokfutások száma: %s.
actors.buffs.amok.name=ámokfutó
actors.buffs.arcanearmor.desc=Egy vékony pajzs vesz körül, amely blokkolja a mágikus támadások sebzésének egy részét.\n\nA mágikus páncélodat jelenleg a következő erősíti: 0-%d.\n\nFordul, amíg az arkán páncél gyengül: %s.
actors.buffs.arcanearmor.name=arkán páncél
actors.buffs.artifactrecharge.desc=Energia áramlik át rajtad, növelve a felszerelt ereklyéid töltődési sebességét.\n\nMinden ereklyére egy kicsit másképp hat, de mindegyik sokkal gyorsabban töltődik fel a szokásosnál.\n\nHátralévő körök: %s.
actors.buffs.artifactrecharge.name=tárgy feltöltése
actors.buffs.ascensionchallenge.almost=Érzed, hogy Yog szorítása az amuletten gyengülni kezd, már majdnem ott vagy!
actors.buffs.ascensionchallenge.beckon=Az amulett hívni kezdi a távoli ellenségeket.
actors.buffs.ascensionchallenge.break=Egy pillanatra levegőt veszel, és érzed, ahogy a sebeid kezdenek bezárulni!
actors.buffs.ascensionchallenge.damage=Az amulett sötét energiát kezd sugározni. Ég!
actors.buffs.ascensionchallenge.desc=Yog-Dzewa valahogyan az amuletten keresztül befolyást gyakorol erre a világra, és megpróbálja megakadályozni a felemelkedésedet! ZXQPH0 ZXQZXQPH1 ZXQ Yog ereje sokkal veszélyesebbé teszi a kazamatát, növeli az ellenségek számát és erősebbé teszi őket! Ez a hatalom folyamatosan épül, ha nem ellenőrizzük, és gyengíthető, ha legyőzzük azokat az ellenségeket, akiket Yog ereje erősített fel.
actors.buffs.ascensionchallenge.desc_beckon=Az amulett jelenleg _távoli ellenségeket hív,_ figyelmeztetve őket a helyzetedre.
actors.buffs.ascensionchallenge.desc_clear=Az amulettből sugárzó sötét energiát egyelőre a lehető legnagyobb mértékben gyengítették.
actors.buffs.ascensionchallenge.desc_damage=Az amulett energiája annyira megerősödött, hogy _közvetlenül árt neked!_
actors.buffs.ascensionchallenge.desc_haste=Az amulett jelenleg _a távoli ellenségeket sürgeti,_ lehetővé téve számukra, hogy gyorsabban elérjenek hozzád!
actors.buffs.ascensionchallenge.desc_slow=Az amulett jelenleg _lassít téged_, és semlegesíti a sebességnövelő hatásokat!
actors.buffs.ascensionchallenge.haste=Az amulett siettetni kezdi a távoli ellenségeket!
actors.buffs.ascensionchallenge.name=az amulett átka
actors.buffs.ascensionchallenge.on_kill=A sötét energia elnyel téged...
actors.buffs.ascensionchallenge.slow=Az amulett kezd úgy érződni, mint egy ólomsúly a leltárodban!
actors.buffs.ascensionchallenge.weaken=Érezheted, ahogy az amulett átka kissé gyengül.
actors.buffs.ascensionchallenge.weaken_info=Az amulett átka gyengíthető több ellenség legyőzésével.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Ha legyőzöd az ellenségeidet, az amulett átka gyengülni fog!
actors.buffs.barkskin.desc=A bőröd megkeményedett, érdes és szilárd tapintású, mint a fakéreg.\n\nA megkeményedett bőr növeli a hatékony páncélodat, lehetővé téve a jobb védekezést a fizikai támadások ellen.\n\nA páncélod jelenleg ennyivel nőtt: 0-%d.\nFordul, amíg a fakéregbőr gyengül: %s.\n\nHa több forrásból is kapsz fakéregbőrt, csak a legerősebb lesz érvényes.
actors.buffs.barkskin.name=kéregbőr
actors.buffs.barrier.desc=Egy tartós erőbuborék, amely minden sebzést blokkol.\n\nA gát mindaddig sebzést szenved el a védett dologért, amíg van még védelem. Az árnyékolás idővel lassan elhalványul.\n\nFennmaradó árnyékolás: %d.
actors.buffs.barrier.name=akadály
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=feldühödött
actors.buffs.berserk.angered_desc=A Berserker sérüléseinek súlyossága erősíti az ütéseit. Ahogy a berserker fizikai sebzést szenved el, a dühe egyre növekszik, ami bónusz sebzést biztosít neki. A páncél által blokkolt sebzés továbbra is beleszámít a düh építésébe.\n\nA düh idővel elhalványul. Minél alacsonyabb a berserker életereje, annál tovább tart.\n\n100%% dühszintnél a Berserker dühöngni kezdhet, ami a páncélja szintje és a hiányzó életereje alapján pajzsot ad neki. Miközben dühöng, a pajzsa idővel gyengül, és ha elfogy, pihennie kell, mielőtt újra dühöngeni kezd.\n\nJelenlegi düh: _%1$.0f%%_\n_+%2$.0f%%_ sebzés\n\nDühöngés pajzsa jelenlegi páncéllal és HP-vel: _%3$d_
actors.buffs.berserk.berserk=őrjöngés
actors.buffs.berserk.berserk_desc=A félelem és a bizonytalanság elpárolog, csak a haragot hagyva maga után. Ebben az állapotban a Berserker rendkívül erős, _+50%% sebzést okoz és bónusz pajzsot kap,_ de minden körben veszít a pajzsából.\n\nAmikor minden pajzsa 0-ra csökken, a berserkerkedés véget ér.\n\nA dühöngés után a Berserkernek regenerálódnia kell, mielőtt újra dühönghetne.\n\nMegmaradt pajzs: %d
actors.buffs.berserk.exhausted=kimerült
actors.buffs.berserk.no_seal=Szükséged van a feltört pecsétedre a megvaduláshoz!
actors.buffs.berserk.rankings_desc=Halálra őrülve
actors.buffs.berserk.recovering=felépülés
actors.buffs.berserk.recovering_desc=A belső erőnek is vannak határai. A Berserkernek pihennie kell, mielőtt újra használhatja a dühét.\n\nA felépülés során a Berserker nem épít fel dühöt a sebzésből.
actors.buffs.berserk.recovering_desc_levels=Szintek a visszanyerésig: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Fordulások a visszaszerzésig: _%d_
actors.buffs.bleeding.desc=Abból a sebből aggasztó mennyiségű vér szivárog.\n\nA vérzés minden körben sebzést okoz. Minden körben véletlenszerű mennyiséggel csökken a sebzés, amíg a vérzés végül el nem áll.\n\nJelenlegi vérzési sebzés: %d.
actors.buffs.bleeding.heromsg=Vérzel!
actors.buffs.bleeding.name=vérzés
actors.buffs.bleeding.ondeath=Halálra véreztél...
actors.buffs.bleeding.rankings_desc=Vérzésbe fulladt
actors.buffs.bless.desc=Egy hatalmas fókuszlöket, egyesek szerint az istenek ihlették.\n\nAz áldás 25%%-val növeli a pontosságot és a kitérés képességét, így az áldott sokkal hatékonyabb a harcban.\n\nHátralévő áldáskörök: %s.
actors.buffs.bless.name=áldott
actors.buffs.blindness.desc=A vakság sötét köddé változtatja a környező világot.\n\nVak állapotban a karakter látótere egyetlen mezőre csökken, ami használhatatlanná teszi a távolsági támadásokat, és nagyon könnyűvé teszi a távoli ellenségek szem elől tévesztését. Ezenkívül a megvakított hős nem tud tekercseket vagy könyveket olvasni.\n\nHátralévő vaksági fordulatok száma: %s.
actors.buffs.blindness.heromsg=Meg vagy vakítva!
actors.buffs.blindness.name=megvakított
actors.buffs.blobimmunity.desc=Valami furcsa erő egy vékony védőréteggel vesz körül, blokkolva minden káros levegőbeli hatást.\n\nAmíg ez a gát fennáll, immunis vagy minden területhez kötött hatásra.\n\nAz immunitás fennmaradó fordulatai: %s.
actors.buffs.blobimmunity.name=tisztítógát
actors.buffs.burning.burnsup=%s elég!
actors.buffs.burning.desc=Kevés dolog van, ami jobban elkeserít, mint lángok borítják be az embert.\n\nA tűz minden körben sebzést okoz, amíg víz el nem oltja, vagy amíg meg nem hal. A tüzet el lehet oltani vízbe lépve, vagy egy szétfröccsenő bájitaltól.\n\nEzenkívül a tűz meggyújthatja a gyúlékony terepet vagy tárgyakat, amelyekkel érintkezésbe kerül.\n\nHátralévő égési körök száma: %s.
actors.buffs.burning.heromsg=Lángot fogsz!
actors.buffs.burning.name=égő
actors.buffs.burning.ondeath=Halálra égtél...
actors.buffs.burning.rankings_desc=Hamuvá égett
actors.buffs.championenemy$antimagic.desc=Az antimágia bajnokok 50%-kal kevesebb sebzést szenvednek el, és teljesen immunisak a mágikus hatásokra.
actors.buffs.championenemy$antimagic.name=antimágia bajnok
actors.buffs.championenemy$blazing.desc=A Lángoló bajnokok 25%-kal több közelharci sebzést okoznak, lángra lobbantják a megtámadott ellenfeleket, immunisak a tűzre, és halálukkor tüzet terjesztenek maguk körül. Vízre azonban nem tudnak tüzet terjeszteni.
actors.buffs.championenemy$blazing.name=lángoló bajnok
actors.buffs.championenemy$blessed.desc=Az áldott bajnokok négyszeres pontossággal és kitéréssel rendelkeznek.
actors.buffs.championenemy$blessed.name=áldott bajnok
actors.buffs.championenemy$giant.desc=Az Óriás bajnokok 80%-kal kevesebb sebzést szenvednek el és +1 támadási távolságuk van, de nem tudnak zárt tereken áthaladni.
actors.buffs.championenemy$giant.name=óriásbajnok
actors.buffs.championenemy$growing.desc=A növekvő hősök folyamatosan növekvő bónuszt kapnak a pontosságra, a kitérésre, a fizikai sebzésre, és csökken a bekapott sebzésük.\n\nJelenlegi access/evakuálás/sebzés növelés: %1$d%%\nJelenlegi sebzéscsökkentés: %2$d%%
actors.buffs.championenemy$growing.name=növekvő bajnok
actors.buffs.championenemy$projecting.desc=A kiálló hősök 25%-kal több közelharci sebzést okoznak, és +3 támadási távolsággal rendelkeznek.
actors.buffs.championenemy$projecting.name=vetítő bajnok
actors.buffs.championenemy.warn=Halálos jelenlétet érzel.
actors.buffs.charm.cant_attack=Elbűvöl téged az ellenség, és nem támadhatod meg.
actors.buffs.charm.desc=A bűbáj egy manipulatív mágia, amivel az ellenségek ideiglenesen imádni tudják egymást.\n\nA bűbáj által érintett karakterek nem tudják közvetlenül megtámadni azt az ellenséget, akitől elbűvölték őket. Más célpontok megtámadása azonban továbbra is lehetséges. A fájdalom sokkja csökkenti a bűbáj időtartamát.\n\nHátralévő bűbáj körök száma: %s.
actors.buffs.charm.heromsg=El vagy varázsolva!
actors.buffs.charm.name=elbűvölt
actors.buffs.chill.desc=Nem teljesen fagyott meg, de még mindig túl hideg.\n\nA lehűtött célpontok minden akciót lassabban hajtanak végre, attól függően, hogy hány kör van még hátra a hatásból. A legrosszabb esetben ez a lassulásnak felel meg.\n\nHátralévő hideg körök: %1$s.\nA sebesség csökken: %2$s%%
actors.buffs.chill.freezes=A %s lefagy!
actors.buffs.chill.name=hűtött
actors.buffs.combo$combomove.clobber.desc=2 mezőt hátralök egy ellenfelet, de nem okoz sebzést és nem tud gödrökbe lökni. 1-gyel növeli a kombó értékét.
actors.buffs.combo$combomove.clobber.empower_desc=Hátralök egy ellenséget _3 mezőt, szédülést okoz, és gödrökbe lökheti,_ de nem okoz sebzést. 1-gyel növeli a kombót.
actors.buffs.combo$combomove.clobber.name=cókmók
actors.buffs.combo$combomove.crush.desc=%d%% (kombó*25%%) sebzést okoz az elsődleges célpontnak, és ennek a felét az összes többi ellenfélnek 7x7-es AOE-ben. Használat után visszaállítja a kombót.
actors.buffs.combo$combomove.crush.empower_desc=_Felugrik %1$d mezőre/mezőkre_ és %2$d%% (kombó*25%%) sebzést okoz az elsődleges célpontnak, és ennek a felét az összes többi ellenfélnek egy 7x7-es AOE-ben. Használat után visszaállítja a kombót.
actors.buffs.combo$combomove.crush.name=összetörni
actors.buffs.combo$combomove.fury.desc=Minden egyes meglévő kombóddal egyszer eltalál egy ellenséget, minden találat 60% sebzést okoz és varázslatokat aktiválhat. Használat után visszaállítja a kombót.
actors.buffs.combo$combomove.fury.empower_desc=_Felugrik a %d mezőre/mezőkre_ és minden meglévő kombinációd után egyszer eltalál egy ellenséget. Minden találat 60%% sebzést okoz és varázslatokat aktiválhat. Használat után visszaállítja a kombót.
actors.buffs.combo$combomove.fury.name=düh
actors.buffs.combo$combomove.parry.desc=Aktiváláskor 1 körön belül blokkolja a következő támadást, és azonnal megtorolja. Visszaállítja a kombót, ha semmi sem kerül hárításra.
actors.buffs.combo$combomove.parry.empower_desc=Aktiváláskor 1 körön belül blokkolja _az összes támadást_, és azonnal megtorolja őket. Visszaállítja a kombót, ha semmi sem kerül hárításra.
actors.buffs.combo$combomove.parry.name=elhárít
actors.buffs.combo$combomove.slam.desc=Bónusz sebzést okoz a sebzésblokkoló képességedből %d%% (kombó*20%%)-t. Használat után visszaállítja a kombót.
actors.buffs.combo$combomove.slam.empower_desc=_Felugrik a %1$d mező(k)re_ és bónusz sebzést okoz a sebzésblokkoló képességedből %2$d%% (kombináció*20%%). Használat után visszaállítja a kombót.
actors.buffs.combo$combomove.slam.name=becsapódás
actors.buffs.combo.action_name=kombinált támadás
actors.buffs.combo.bad_target=Támadási távolságon belül kell megcéloznod egy ellenséget.
actors.buffs.combo.combo=%d telitalálat!
actors.buffs.combo.desc=A gladiátor lendületet vesz, ahogy sikeres csapásokat mér. Minden támadás eggyel növeli a kombószámlálót, de ha túl sokáig telik el a találatok között, a kombószámláló nullára áll vissza. Amíg a gladiátornak kombója van, a feltört pecsétje által kapott pajzs nem kezd elhalványulni.\n\nA kombóépítés különleges kombótámadásokat old fel, amelyeket nem lehet elhibázni! Egy másik támadás oldható fel 2, 4, 6, 8 és 10 kombószámnál. Néhány mozdulat visszaállítja a kombót, néhány nem, de minden mozdulat csak egyszer használható kombómenetenként.\n\nJelenlegi kombináció: %1$d.\n\nFordulások a kombó elvesztéséig: %2$s.
actors.buffs.combo.name=kombináció
actors.buffs.combo.prompt=Válassz ki egy célpontot a támadáshoz.
actors.buffs.corrosion.desc=Az erős sav riasztó sebességgel olvasztja el a húst, a fémet és a csontot.\n\nA korróziós károk az idő múlásával nőnek, ahogy a célpont folyamatosan olvad.\n\nA fennmaradó korróziós fordulatok száma: %1$s.\nJelenlegi korróziós károk: %2$d.
actors.buffs.corrosion.heromsg=Olvadsz!
actors.buffs.corrosion.name=korrózió
actors.buffs.corrosion.ondeath=Elolvadsz...
actors.buffs.corrosion.rankings_desc=Feloldott
actors.buffs.corruption.desc=A romlás beszivárog egy lény lényegébe, és szembefordítja őt korábbi természetével.\n\nA romlott lények megtámadják szövetségeseiket, és figyelmen kívül hagyják korábbi ellenségeiket. A romlás szintén káros, és lassan a célpont eleséséhez vezet.\n\nA romlás állandó, hatásai csak halállal szűnnek meg.
actors.buffs.corruption.name=megrongált
actors.buffs.cripple.desc=Elég biztos vagy benne, hogy a lábak nem arra valók, hogy így hajoljanak.\n\nA nyomorék a felére csökkenti a mozgási sebességet, így egy mező mozgatása általában két kört vesz igénybe egy helyett.\n\nA nyomorék hátralévő körei: %s.
actors.buffs.cripple.heromsg=Te nyomorék vagy!
actors.buffs.cripple.name=nyomorék
actors.buffs.daze.desc=A csengő fülek és a homályos látás megnehezíti a harcot.\n\nKábult állapotban a pontosság és a kitérés 50%%-val csökken, így mind a leszállás, mind az ütések kitérése sokkal nehezebb.\n\nMégmaradó kábultsági fordulatok: %s.
actors.buffs.daze.heromsg=Kábult vagy!
actors.buffs.daze.name=kábult
actors.buffs.degrade.desc=Az erőteljes sötét mágia elszívja azt az erőt, amit a fejlesztési tekercsek a felszerelésedre vittek!\n\nLeépülés közben a fejlesztett felszereléseket úgy kezeli a rendszer, mintha alacsonyabb szintűek lennének, mint amilyenek valójában. _+3 után minden fejlesztés exponenciálisan gyengébb lesz az előzőnél._ A tárgyaid leírása a csökkentett erőszintjüknek megfelelően megváltozik.\n\nA leépülés nem befolyásolja az erőkövetelményeket, a pálcák töltetét, a dobófegyverek tartósságát vagy a tárgyakat.\n\nHátralévő leépülési körök száma: %s. Egy fejlesztési tekercs vagy átokeltávolítási tekercs azonnal véget vet a leépülésnek.
actors.buffs.degrade.heromsg=Gyengébbnek érzed a felszerelésed!
actors.buffs.degrade.name=leromlott
actors.buffs.doom.desc=Nehéz folytatni, amikor úgy tűnik, az univerzum a halálodra vágyik.\n\nA végzetre ítélt karakterek +67% sebzést kapnak minden forrásból.\n\nA végzet végleges, hatásai csak halállal szűnnek meg.
actors.buffs.doom.name=kudarcra ítélt
actors.buffs.dread.desc=Egy olyan nagy rettegés, ami arra készteti a célpontot, hogy teljesen elmeneküljön a kazamatából!\n\nA rettegés által érintett lények nagy sebességgel menekülnek ellenfelük elől, és amint eltűnnek a szemük elől, teljesen eltűnnek a kazamatából. Az így legyőzött ellenségek a tapasztalati pontjuk felét kapják, és nem dobnak tárgyakat. A fájdalom sokkja csökkenti a rettegés időtartamát.\n\nA rettegés fennmaradó fordulatai: %d.
actors.buffs.dread.name=retteg
actors.buffs.drowsy.desc=Egy mágikus erő megnehezíti az ébren maradást, néhány kör után a célpont mély mágikus álomba merül.\n\nA hős sebzést elszenvedve vagy teljes életerővel tud ellenállni az álmosságnak.\n\nFordulások elalvásig: %s.
actors.buffs.drowsy.name=álmos
actors.buffs.earthimbue.desc=A föld erejével vagy átitatva!\n\nMinden fizikai támadás a földet az ellenség alatt mozgatja, rövid időre megbénítva őket.\n\nHátralévő földdel átitatott körök: %s.
actors.buffs.earthimbue.name=földdel átitatott
actors.buffs.enhancedrings.desc=A Zsivány nemrégiben használt ereklyéje felerősíti a gyűrűit, +1 szintet adva nekik.\n\nHátralévő körök: %s.
actors.buffs.enhancedrings.name=fokozott gyűrűk
actors.buffs.fireimbue.desc=A tűz ereje hatja át!\n\nMinden fizikai támadásnak lehetősége lesz lángra lobbantani az ellenséget. Ezenkívül teljesen immunis vagy a tűz hatásaira.\n\nHátralévő tűzáthatások száma: %s.
actors.buffs.fireimbue.name=tűzzel átitatott
actors.buffs.foresight.desc=Valamilyen módon képes vagy látni a környező terep elrendezését az elméddel.\n\nAz előrelátás hatása alatt egy széles sugarú körön belül minden mező feltárul előtted, beleértve a titkos csapdákat és ajtókat is.\n\nAz előrelátás fennmaradó körei: %s.
actors.buffs.foresight.name=előrelátás
actors.buffs.frost.desc=Nem összekeverendő a fagyasztószilárd anyaggal, ez az ártalmatlanabb fagyás egyszerűen jégbe burkolja a célpontot.\n\nA fagyás hasonlóan működik, mint a bénulás, lehetetlenné téve a célpont számára a cselekvést. A bénulással ellentétben a fagyás azonnal megszakad, ha a célpont megsérül, mivel a jég széttörik.\n\nHátralévő fagyási fordulók száma: %s.
actors.buffs.frost.freezes=A %s lefagy!
actors.buffs.frost.name=fagyasztott
actors.buffs.frostimbue.desc=Jeges erő hatja át!\n\nMinden fizikai támadás fokozatosan fagyossá teszi az ellenfeleket. Ráadásul teljesen immunis vagy a hidegre.\n\nHátralévő dérhatású töltés fordulatszáma: %s.
actors.buffs.frostimbue.name=fagyos
actors.buffs.fury.desc=Dühös vagy, az ellenségek nem fognak kedvelni, ha dühös vagy.\n\nHatalmas düh ég benned, ami 50%%-val növeli a fizikai támadásokkal okozott sebzést.\n\nEz a düh addig tart, amíg 50%% életerő alatt vagy.
actors.buffs.fury.heromsg=Dühös leszel!
actors.buffs.fury.name=dühös
actors.buffs.gravitychaostracker.desc_duration=Nem világos, hogy meddig tart a hatás, de nem tarthat örökké.
actors.buffs.gravitychaostracker.desc_intro=Néhány körönként az aktuális kazamata szintjén lévő összes karakter véletlenszerű irányba fog elmozdulni.
actors.buffs.gravitychaostracker.desc_positive=Te és a szövetségeseid viszont immunisak vagytok rá.
actors.buffs.gravitychaostracker.name=gravitációs káosz
actors.buffs.greaterhaste.desc=Hihetetlen sebességnövekedés, egy pillanatra úgy tűnik, mintha minden más megállna.\n\nA nagyobb sietség hatása alatt a mozgási mozdulatok egyáltalán nem vesznek igénybe időt, de a többi cselekvés továbbra is normál sebességgel történik. Minden mozgáslépés egy nagyobb sietségű fordulatot vesz igénybe.\n\nA megmaradt nagyobb sietségű fordulatok száma: %d.
actors.buffs.greaterhaste.name=nagyobb sietség
actors.buffs.haste.desc=Energia áramlik az izmaidban, lehetővé téve a hihetetlen sebességgel futást!\n\nA sietség hatása alatt háromszoros sebességgel futsz, de minden más tevékenységet normál sebességgel végzel.\n\nA fennmaradó sietségfordulatok száma: %s.
actors.buffs.haste.name=sietség
actors.buffs.healing.desc=Egy varázslatos gyógymód a sebek bezáródását és a hús összehúzódását okozza.\n\nMinden körben az életerő folyamatosan regenerálódik, amíg a gyógyító hatás le nem jár. A gyógyulás mértéke idővel csökkenhet.\n\nKövetkező gyógyulás: %d.\n\nHáromló gyógyulás: %d.
actors.buffs.healing.name=gyógyító
actors.buffs.herodisguise.desc=Az illuzórikus mágia megváltoztatta a fizikai megjelenésedet! A hatás pusztán kozmetikai, de ettől függetlenül nagyon furcsa érzés. \n\nAz álruhában maradt fordulatok száma: %s.
actors.buffs.herodisguise.name=álruha
actors.buffs.hex.desc=Sötét mágia, ami elveszi a fókuszt, és kissé dezorientálja a célpontot.\n\nA szitkozódás 20-zal csökkenti a pontosságot és a kitérést, ami miatt a célpont kevésbé hatékony a harcban.\n\nHátralévő szitkozódási körök: %s.
actors.buffs.hex.heromsg=Megátkoztak!
actors.buffs.hex.name=megátkozott
actors.buffs.holdfast.desc=A Harcos tartja a pozícióját, páncélját %1$d-%2$d értékekkel növeli, és egyes erősítések gyengülési sebességét %3$d%% értékekkel lassítja. Ez addig tart, amíg el nem mozog.
actors.buffs.holdfast.name=kapaszkodj erősen
actors.buffs.hunger.cursedhorn=Az elátkozott szarv ellopja az étel energiájának egy részét, miközben eszel.
actors.buffs.hunger.desc=Az éhség lassan növekszik, ahogy időt töltesz a kazamatában, végül elkezdesz éhezni. Éhezés közben lassan veszítesz életerőt ahelyett, hogy regenerálódna.\n\nA jegyrendszer fontos! Ha van felesleges életerőd, az éhezés nem rossz ötlet, ha ez azt jelenti, hogy később több élelem lesz. A hatékony jegyrendszerrel sokkal tovább tarthat az étel!
actors.buffs.hunger.desc_intro_hungry=Érzed, ahogy a gyomrod étel után kiált, de még nem túl sürgető.
actors.buffs.hunger.desc_intro_starving=Annyira éhes vagy, hogy fáj.
actors.buffs.hunger.hungry=éhes
actors.buffs.hunger.ondeath=Éhen haltál...
actors.buffs.hunger.onhungry=Éhes vagy.
actors.buffs.hunger.onstarving=Éhes vagy!
actors.buffs.hunger.rankings_desc=Éheztetés halálra
actors.buffs.hunger.starving=éhező
actors.buffs.invisibility.desc=Teljesen beleolvadsz a környező terepbe, így lehetetlenné válik a láthatatlanságod.\n\nAmíg láthatatlan vagy, az ellenségek nem tudnak megtámadni vagy követni. A fizikai támadások és a mágikus hatások (például tekercsek és pálcák) azonnal megszüntetik a láthatatlanságot.\n\nHátralévő láthatatlansági körök száma: %s.
actors.buffs.invisibility.name=láthatatlan
actors.buffs.invulnerability.desc=Ez a karakter hatalmas védelmező erővel van felruházva, ami rövid ideig sebezhetetlenné teszi őt!\n\nHátralévő körök: %s.
actors.buffs.invulnerability.name=sebezhetetlen
actors.buffs.levitation.desc=Egy mágikus erő lebegtet a föld fölé, amitől súlytalannak érzed magad.\n\nA lebegő karakterek csendben mozognak, és figyelmen kívül hagyják a földi hatásokat. A csapdák nem aktiválódnak, a víz nem oltja el a tüzet, a növényeket nem tapossák el, a gyökerek nem találnak célt, és a gödrök felett lebegnek. Légy óvatos, mert ezek a dolgok a lebegés befejeződése után azonnal életbe léphetnek!\n\nHátralévő lebegési körök száma: %s.
actors.buffs.levitation.name=lebegő
actors.buffs.lifelink.desc=Ennek a karakternek az életereje egy másik, a közelben tartózkodó karakterhez kapcsolódik. A beérkező sebzést megosztják egymás között.\n\nAmikor ez a karakter sebzést szenved, annak fele az életkapu célpontjára kerül.\n\nHátralévő életkapu körök száma: %s.
actors.buffs.lifelink.name=életkapcsolat
actors.buffs.lifelink.ondeath=Az élettel járó kár megölt téged...
actors.buffs.light.desc=Még a legsötétebb kazamatában is megnyugtató egy melletted lévő állandó fény.\n\nA fény segít távol tartani a sötétséget, lehetővé téve, hogy a környezeti hatásoktól függetlenül ésszerű távolságra láss.\n\nHátralévő megvilágítási fordulatok száma: %s.
actors.buffs.light.name=megvilágított
actors.buffs.lockedfloor.desc=Az aktuális szint zárva van, és nem tudod elhagyni!\n\nAmíg egy szint zárva van, nem fogsz éhséget érezni, és nem kapsz sebzést az éhezéstől. Ezenkívül, ha nem dolgozol az szint főellenségének legyőzésén, a passzív regenerációs hatások is megszűnnek.\n\nTovábbá, ha egy áldatlan ankh újraéleszt, miközben a szint zárva van, akkor az alaphelyzetbe áll.\n\nÖld meg az szint főellenségét, hogy feltörd a zárat.
actors.buffs.lockedfloor.name=a padló zárva van
actors.buffs.lostinventory.desc=A felszerelésed valahol elveszett a kazamatában! A legtöbb tárgyat nem fogod tudni felvenni vagy használni, amíg vissza nem szerzed.
actors.buffs.lostinventory.name=elveszett készlet
actors.buffs.magicalsight.desc=Valahogy képes vagy az elméddel látni, a szemed helyett.\n\nAmíg a mágikus látás aktív, 12 csempés sugarú körben átlátsz az összes terepen.\n\nHátralévő mágikus látási körök száma: %s.
actors.buffs.magicalsight.name=varázslatos látvány
actors.buffs.magicalsleep.desc=Ez a karakter mély mágikus álomba merült, amelyből természetes úton nem fog felébredni.\n\nA mágikus alvás hasonló a normál alváshoz, azzal a különbséggel, hogy csak a sebzés okozza a célpont felébredését.\n\nA hős és szövetségesei számára a mágikus alvásnak vannak helyreállító tulajdonságai, amelyek lehetővé teszik számukra, hogy pihenés közben gyorsan gyógyuljanak.
actors.buffs.magicalsleep.fallasleep=Mély, varázslatos álomba merülsz.
actors.buffs.magicalsleep.name=varázslatos alvás
actors.buffs.magicalsleep.toohealthy=Túl egészséges vagy, és ellenállsz az alvás utáni vágynak.
actors.buffs.magicalsleep.wakeup=Felfrissülve és egészségesen ébredsz.
actors.buffs.magicimmune.desc=Minden mágikus hatás elvesztette feletted a hatalmát, teljesen érzéketlen vagy rájuk.\n\nMíg a mágikus immunitásod minden káros és hasznos mágikus hatásra érvényes, beleértve az átkokat, varázslatokat, pálcákat, tekercseket, gyűrűket, tárgyakat stb. A hősi páncél képességei elég erősek ahhoz, hogy ettől a hatástól függetlenül működjenek.\n\nA mágikus immunitás fennmaradó körei: %s.
actors.buffs.magicimmune.name=immunis a mágiára
actors.buffs.mindvision.desc=Valahogy képes vagy látni az összes lényt ezen a szinten az elmédben. Furcsa érzés.\n\nMinden karakter látható számodra ezen a szinten, amíg van elméd látással. Ha egy lényt elmédben látsz, az sok mágikus hatás szempontjából úgy számít, mintha látnád vagy a közeledben lenne.\n\nHátralévő elméd látásának fordulatai: %s.
actors.buffs.mindvision.name=elmelátás
actors.buffs.momentum.action_name=szabadfutás
actors.buffs.momentum.momentum=lendületet építeni
actors.buffs.momentum.momentum_desc=Ahogy mozog, a Szabadonfutó lendületet gyűjt, amelyet elkölthet a szabadfutás megkezdésére.\n\nMinden lendülettöltés két körös szabadfutást biztosít, és a Szabadonfutó akár 10 töltetet is gyűjthet. A lendület gyorsan elvész, amikor a Szabadonfutó megáll.\n\nJelenlegi lendülettöltés: %d.
actors.buffs.momentum.resting=felépülés
actors.buffs.momentum.resting_desc=Ahogy mozog, a Szabadonfutó lendületet gyűjt, amit elkölthet a szabadfutás megkezdésére.\n\nA Szabadonfutónak időre van szüksége az állóképesség visszanyeréséhez, mielőtt újra lendületet nyerne.\n\nHátralévő körök: %d.
actors.buffs.momentum.running=szabadon futás
actors.buffs.momentum.running_desc=Ahogy mozog, a Szabadon futó lendületet gyűjt, amelyet elkölthet a szabad futás megkezdésére.\n\nSzabadon futás közben a Szabadon futó dupla sebességgel mozog, és a szintje alapján bónusz kitéréseket kap.\n\nHátralévő körök: %d.
actors.buffs.monkenergy$monkability$dash.desc=Azonnali roham akár 4 mezőnyi távolságra. Ez a képesség áthatolhat veszélyeken, de nem ellenségeken vagy szilárd terepen.
actors.buffs.monkenergy$monkability$dash.empower_desc=Azonnali roham akár _8 mező_ távolságra. Ez a képesség áthatolhat veszélyeken, de nem ellenségeken vagy szilárd terepen.
actors.buffs.monkenergy$monkability$dash.name=gondolatjel
actors.buffs.monkenergy$monkability$dash.prompt=Válasszon egy helyszínt
actors.buffs.monkenergy$monkability$dragonkick.desc=Egy pusztító rúgás, ami %1$d-%2$d sebzést okoz és figyelmen kívül hagyja a páncélt. A rúgás ellöki a célpontot, és minden egyes mezőnként megbénítja.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Egy pusztító rúgás, ami _%1$d-%2$d sebzést okoz_ és figyelmen kívül hagyja a páncélt. A rúgás _az összes szomszédos célpontot_ eltaszítja, és minden egyes mezőnként, amin mozognak, megbénítja őket.
actors.buffs.monkenergy$monkability$dragonkick.name=sárkányrúgás
actors.buffs.monkenergy$monkability$flurry.desc=Két azonnali találat, melyek %1$d-%2$d sebzést okoznak és figyelmen kívül hagyják a páncélt. Ez a képesség nem használható ismételten.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Két azonnali találat, melyek %1$d-%2$d sebzést okoznak, figyelmen kívül hagyják a páncélt _és használják a fegyvered varázslatát_. Ez a képesség nem használható ismételten.
actors.buffs.monkenergy$monkability$flurry.name=ütések özöne
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=A Szerzetes a környezetére koncentrál, és a következő ellene irányuló támadásra számít. Amíg fókuszált, garantáltan kivédi a következő támadást.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=összpontosított
actors.buffs.monkenergy$monkability$focus.desc=A Szerzetes ismét összpontosít, hagyva, hogy a lány hárítsa a következő ellene irányuló támadást.
actors.buffs.monkenergy$monkability$focus.empower_desc=A szerzetes _azonnal összpontosít,_ hagyva, hogy a lány hárítsa a következő ellene irányuló támadást.
actors.buffs.monkenergy$monkability$focus.name=fókusz
actors.buffs.monkenergy$monkability$meditate.desc=A szerzetes 5 körre energiát fókuszál a testébe. Ez a legtöbb negatív hatást semlegesíti, és 8 környi pálca- és tárgytöltést biztosít számára.
actors.buffs.monkenergy$monkability$meditate.empower_desc=A szerzetes 5 körre energiát fókuszál a testébe. Ez a legtöbb negatív hatást semlegesíti, és 8 környi pálca- és tárgytöltést biztosít neki. _Meditáció közben 80%-os sebzésállóságot is kap, és lassan gyógyul a hiányzó életerő 20%-ával._
actors.buffs.monkenergy$monkability$meditate.name=elmélkedik
actors.buffs.monkenergy.action=Szerzetes képességek
actors.buffs.monkenergy.desc=Ahogy legyőzi az ellenségeket, a szerzetes energiát nyer, amelyet különféle képességekre használhat fel. A legtöbb ellenség 1 energiát ad legyőzéskor, és a szerzetes nem veszít energiát az idő múlásával. \n\nJelenlegi energia: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=A szerzetes nemrég használt egy képességet, és várnia kell, mielőtt egy másikat használna.\n\nJelenlegi lehűlési idő: %d körök.
actors.buffs.monkenergy.name=energia
actors.buffs.ooze.desc=Ez a ragacsos sav a húshoz tapad, és lassan elolvasztja azt.\n\nAz iszap idővel állandó sebzést okoz, de azonnal lemosható vízzel.\n\nA megmaradt iszapfoltok száma: %s.
actors.buffs.ooze.heromsg=Maró váladék eszi a húsodat. Mosd le!
actors.buffs.ooze.name=maró iszap
actors.buffs.ooze.ondeath=Elolvadsz...
actors.buffs.ooze.rankings_desc=Feloldott
actors.buffs.paralysis.desc=Sokszor a legrosszabb, amit tehetsz, az az, hogy semmit sem teszel.\n\nA bénulás teljesen leállítja az összes cselekvést, arra kényszerítve a célpontot, hogy megvárja, amíg a hatás elmúlik. A sebzés okozta fájdalom miatt a karakterek ellenállnak a bénulásnak, megtörve őket a hatás alól.\n\nA bénulás fennmaradó fordulatai: %s.
actors.buffs.paralysis.heromsg=Megbénultál!
actors.buffs.paralysis.name=bénult
actors.buffs.paralysis.out=ellenállt a bénulásnak
actors.buffs.physicalempower.desc=Megerősödtek az ütéseid, így megnő a fizikai támadásokkal okozta sebzés mértéke.\n\nBónusz sebzés: %1$d.\nMegmaradt találatok: %2$d.
actors.buffs.physicalempower.name=fizikailag felhatalmazott
actors.buffs.pincushion.desc=A karakter ellen használt dobófegyverek jelenleg hozzáragadtak, és a legyőzésük után a földre fognak hullani. \n\n Jelenleg a következő tárgyak vannak csatolva:
actors.buffs.pincushion.name=tűpárna
actors.buffs.poison.desc=A méreg végighalad a testen, lassan károsítva annak belső működését.\n\nA méreg minden körben a lejártáig hátralévő idővel arányos sebzést okoz.\n\nHátralévő méregkörök száma: %s.
actors.buffs.poison.heromsg=Meg vagy mérgezve!
actors.buffs.poison.name=mérgezett
actors.buffs.poison.ondeath=Mérgezésben haltál meg...
actors.buffs.poison.rankings_desc=Engedelmeskedett a méregnek
actors.buffs.preparation.action_name=előkészített sztrájk
actors.buffs.preparation.assassinated=meggyilkolt
actors.buffs.preparation.desc=Az Assassin türelmesen vár, és készül lecsapni az árnyékból.
actors.buffs.preparation.desc_blink=Képes egy pislogással az ellenfél felé csapni, mielőtt lecsapna rá, maximum _%d._ távolságból.
actors.buffs.preparation.desc_dmg=A következő támadása _%1$d%% bónusz sebzést_ okoz, és a _%2$d%% életerő alatti_ ellenfeleket, vagy a _%3$d%% életerő alatti_ főellenfeleket végez ki.
actors.buffs.preparation.desc_dmg_likely=A támadás nagyobb valószínűséggel fog nagyobb sebzést okozni.
actors.buffs.preparation.desc_invis_next=Erősebb támadásért körök: _%d._
actors.buffs.preparation.desc_invis_time=Láthatatlanná tett körök: _%d._
actors.buffs.preparation.name=készítmény
actors.buffs.preparation.no_target=Nincs ott mit támadni.
actors.buffs.preparation.out_of_reach=Ez a cél elérhetetlen.
actors.buffs.preparation.prompt=Válassz ki egy célpontot a támadáshoz!\nMaximális pislogási távolság: %d
actors.buffs.prismaticguard.desc=Egy prizmás kép véd, amely jelenleg inaktív. Amikor ellenségek vannak jelen, a prizmás kép akcióba lendül és megvéd téged!\n\nInaktív állapotban a prizmás kép folyamatosan regenerálódik az elszenvedett sebzések után.\n\nJelenlegi HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Ez a prizmás kép a Sok Hatalma képességből is profitál. Hátralévő körök: %d.
actors.buffs.prismaticguard.name=prizmás védőburkolat
actors.buffs.recharging.desc=Energia áramlik benned, növelve a pálcáid és botjaid töltődési sebességét.\n\nEz a buff minden körben negyedével növeli az aktuális töltést a normál újratöltésen felül.\n\nHátralévő újratöltési körök száma: %s.
actors.buffs.recharging.name=újratöltés
actors.buffs.revealedarea.desc=A kazamata egy részét ideiglenesen felfedték a hős számára. Bárhol is vannak, látni fogják.\n\nHátralévő körök: %s.
actors.buffs.revealedarea.name=felfedett terület
actors.buffs.revealedchar.desc=Ez a karakter felfedődik a hős előtt. Látható lesz, bárhol is van. \n\nHátralévő körök: %s.
actors.buffs.revealedchar.name=felfedte
actors.buffs.roots.desc=A gyökerek (mágikus vagy természetes) megragadják a lábakat, és a földre kényszerítik őket.\n\nA gyökerek a helyükön tartják a célpontot, így a mozgás és a legtöbb mozgási képesség lehetetlenné válik. A többi műveletet, beleértve a teleportációs hatásokat is, ez nem érinti.\n\nHátralévő gyökérkörök száma: %s.
actors.buffs.roots.heromsg=Nem mozdulhatsz!
actors.buffs.roots.name=gyökeres
actors.buffs.scrollempower.desc=A Mágus nemrég elolvasott tekercsének energiája erőt ad pálcáinak!\n\nSzintnövelés: +%1$d.\nHátralévő Zaps: %2$d.
actors.buffs.scrollempower.name=görgetés felhatalmazás
actors.buffs.shadows.desc=Beleolvadsz a körülötted lévő árnyékokba, ami láthatatlanná tesz és lelassítja az anyagcserédet.\n\nAmíg láthatatlan vagy, az ellenségek nem tudnak megtámadni vagy követni téged. A legtöbb fizikai támadás és mágikus hatás (például a tekercsek és a pálcák) azonnal megszünteti a láthatatlanságot. Ezenkívül árnyékolvadás közben az éhséged üteme lelassul.\n\nÁrnyolvadásban maradsz, amíg el nem hagyod az árnyékot, vagy egy ellenség kapcsolatba nem kerül veled.
actors.buffs.shadows.name=árnyékolvadt
actors.buffs.slow.desc=A lassító mágia befolyásolja a célpont időbeli sebességét, számukra minden szupergyorsan mozog.\n\nA lelassított karakter minden akciót kétszer annyi idő alatt hajt végre, mint amennyit normális esetben tenne.\n\nA lassítás hátralévő körei: %s.
actors.buffs.slow.name=lelassult
actors.buffs.snipersmark.action_name_snapshot=pillanatkép
actors.buffs.snipersmark.action_name_sniper=mesterlövész lövés
actors.buffs.snipersmark.action_name_volley=sortűz
actors.buffs.snipersmark.desc=A mesterlövész a legutóbb megtámadott célpontra van fókuszálva. Képes egy speciális támadást végrehajtani az íjával, amely az íj kiegészítésének módjától függően változik.\n\nEgy kiegészítés nélküli íj egy _pillanatlövést_ lő, amely csökkentett sebzést okoz, de a lövéshez nincs szükség időre.\n\nEgy sebességre bővített íj három nyílból álló _sortüzet_ lő ki. Minden nyíl csökkentett sebzést okoz, de továbbra is aktiválhatja a varázslatot. A sortüzet 1 körre lehet kilőni.\n\nEgy sebzésre bővített íj egy _mesterlövész lövést_ lő ki.Ez a lövés garantáltan talál, a célponttól való távolság alapján bónusz sebzést okoz, és 2 körre van szükség a lövéshez.\n\nHátralévő körök: %s.
actors.buffs.snipersmark.name=mesterlövész jele
actors.buffs.soulmark.desc=A boszorkánymester hozzáfért a lény lelkéhez, lehetővé téve számára a gyógyulást, miközben az fizikai sérülést szenved.\n\nHátralévő lélekjelenség körök száma: %s.
actors.buffs.soulmark.name=lélekjelölt
actors.buffs.stamina.desc=Végtelen kitartásod van, ami lehetővé teszi a gyorsabb mozgást!\n\nA kitartás hatása alatt +50%% sebességgel fogsz futni, de minden más tevékenységet normál sebességgel fogsz végrehajtani.\n\nHátralévő kitartás körök száma: %s.
actors.buffs.stamina.name=kitartás
actors.buffs.terror.desc=A terror egy manipulatív mágia, amely a célpontját kontrollálhatatlan pánikba kényszeríti.\n\nA rémült karakterek kénytelenek menekülni ellenfelük elől, megpróbálva minél több ajtót és falat maguk közé tenni. A fájdalom sokkja azonban csökkenti a terror időtartamát.\n\nA terror fennmaradó fordulatai: %s.
actors.buffs.terror.name=rémült
actors.buffs.toxicimbue.desc=Mérgező energia hatja át!\n\nAhogy mozogsz, folyamatosan mérgező gáz száll fel belőled, sebzést okozva az ellenségeidnek. A hatás időtartama alatt, valamint az azt követő néhány körben immunis vagy a mérgező gázokra és a méregre.\n\nA mérgező sugárzás fennmaradó köreinek száma: %s.
actors.buffs.toxicimbue.name=toxicitástól átitatott
actors.buffs.vertigo.desc=Nehéz lehet egyenes vonalban járni, amikor az egész világ forog.\n\nSzédülés hatása alatt a mozogni próbáló karakterek véletlenszerű irányba indulnak el ahelyett, amelyikbe menni szándékoztak.\n\nMaradék szédülési fordulatok száma: %s.
actors.buffs.vertigo.name=szédülés
actors.buffs.vulnerable.desc=A sebezhetőségi mágia 33%%-val növeli a karakter által elszenvedett összes fizikai sebzést, miután a páncél csökkentette a sebzést.\n\nA fennmaradó sebezhető körök száma: %s.
actors.buffs.vulnerable.heromsg=Törékenynek érzed magad!
actors.buffs.vulnerable.name=sebezhető
actors.buffs.wandempower.desc=A sebzést okozó pálcáid felerősödtek, néhány találattal megnövelve az általuk okozott sebzés mértékét.\n\nBónusz sebzés: %1$d.\nMegmaradt találatok: %2$d.
actors.buffs.wandempower.name=felhatalmazott pálcák
actors.buffs.weakness.desc=Hirtelen minden sokkal nehezebbnek tűnik.\n\nA gyengülő mágia csökkenti a karakter fizikai erejét, aminek következtében 33%% csökkentett sebzést okoz.\n\nHátralévő gyengeségi fordulatok: %s.
actors.buffs.weakness.heromsg=Gyengültnek érzed magad!
actors.buffs.weakness.name=legyengült
actors.buffs.wellfed.desc=Elégedettnek és jóllakottnak érzed magad.\n\nJól táplált vagy, az éhséged nem fog fokozódni, és idővel további életerőt gyógyulsz.\n\nHátralévő körök: %d.
actors.buffs.wellfed.name=jól táplált
actors.char.def_verb=kitért
actors.char.def_verb_blocked=zárolt
actors.char.defeat=legyőzted a %s-t.
actors.char.immune=immunis
actors.char.invulnerable=sebezhetetlen
actors.char.kill=%s megölt téged...
actors.hero.abilities.armorability.cost=Díjköltség: _%d_
actors.hero.abilities.armorability.no_target=Nincs ott semmi célpont!
actors.hero.abilities.armorability.prompt=Válasszon egy célzott helyet
actors.hero.abilities.armorability.self_target=Nem célozhatod meg magad!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Sugárzó energia árad a Klerikus testéből. Ebben a formában a Klerikus 2 támadási távolságot nyer (a belőlük áradó szent energiának köszönhetően), és 10 pajzsot, valahányszor elkölt egy szent kötet töltetet. Képesek varázslatokat is használni, amelyeket a felemelkedett forma tehetségein keresztül lehet feloldani. \n\nA felemelkedett forma és varázslatai által biztosított pajzs nem gyengül el normálisan, hanem azonnal elhalványul, amikor a felemelkedett forma véget ér. \n\nJelenlegi pajzs: %1$d.\nHátralévő körök száma: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=felemelkedett forma
actors.hero.abilities.cleric.ascendedform.desc=A Klerikus szent energiát bocsát ki magából, 10 körre kiterjesztett sugárzó formát öltve. Ebben a formában a Klerikus új varázslatokat vetíthet, 2 támadási távolságot, 30 pajzsot kap, és minden további varázslat, amit vet, 10 pajzsot biztosít szent könyvenként. \n\n A felemelkedett forma és varázslatai elleni pajzs nem gyengül normális esetben, hanem azonnal elhalványul, amint a felemelkedett forma véget ér. A képesség újra felhasználható a felemelkedett forma időtartamának frissítésére.
actors.hero.abilities.cleric.ascendedform.name=felemelkedett forma
actors.hero.abilities.cleric.ascendedform.short_desc=A Klerikus _Felemelkedett Formát_ ölt, új varázslatokat, támadási hatótávolságot és pajzsot kap.
actors.hero.abilities.cleric.powerofmany$lightally.desc=A Klerikus egyik kalandozó társának másolata, szilárd fényből. Bár egy másik hős alakját ölti, nem rendelkezik azok egyedi képességeivel. Ez a szövetséges mindaddig fennmarad, amíg a Sok Ereje alkalmazva van rá.\n\nEz a szövetséges ingyenesen irányítható a Sok Ereje páncélképesség újrafelhasználásával.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=A szövetségesed támadásba lendül!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=A szövetségesed arra a pozícióra lép.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=A szövetségesed követni mozdul.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Ezt a karaktert egy adott hőspáncél képességgel találhatod meg.
actors.hero.abilities.cleric.powerofmany$lightally.name=könnyű szövetséges
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Ezt a szövetségest a Sok Ereje képesség erősítette meg, ami +25%% kiosztott és -25%% elszenvedett sebzést ad neki. Emellett megosztja látóterét a Pappal, és profitálhat a Sok Ereje varázslatokból.\n\nA Sok Ereje akkor is fennáll, amikor a szövetségesek, például a prizmás képek elrejtőznek, de az időtartama továbbra is visszaszámol.\n\nHátralévő körök: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=sokak hatalma
actors.hero.abilities.cleric.powerofmany.ally_exists=Már van egy felhatalmazott szövetségesed.
actors.hero.abilities.cleric.powerofmany.desc=A Klerikus a _Sok Erejét_ használja, ami vagy egy meglévő szövetségest erősít meg, vagy egy újat hoz létre 100 körre. Egy üres mező megcélzása új szövetségest hoz létre.\n\nAmíg a Sok Ereje felhatalmazza, minden szövetségese +25% sebzést okoz, -25% sebzést szenved el, és megosztja a látását a Klerikussal. Emellett 25 pajzsot is kap, amikor a képességet használja.\n\nA Klerikus emellett három új varázslatot is kap, amelyeket csak egy felhatalmazott szövetségessel lehet elsütni. A Sok Ereje nem ér véget, amíg ezek közül a varázslatok közül valamelyik aktív.
actors.hero.abilities.cleric.powerofmany.name=sokak hatalma
actors.hero.abilities.cleric.powerofmany.no_vision=Nem célozhatsz meg olyan helyet, amit nem látsz.
actors.hero.abilities.cleric.powerofmany.only_allies=Csak szövetségeseket tudsz felhatalmazni.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Irányítsd a fény szövetségesedet
actors.hero.abilities.cleric.powerofmany.prompt_default=Válassz egy szövetségest vagy helyszínt
actors.hero.abilities.cleric.powerofmany.short_desc=A Klerikus a _Sokak Erejét_ használja fel, megerősítve egy meglévő szövetségest, vagy létrehozva egy újat.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Testformához rendelni
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Hozzárendelés az elmeformához
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Szellemformához rendelni
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Válassz ki egy effektust, amelyet be szeretnél illeszteni a Trinitybe. További információk jelennek meg a megerősítés előtt.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Testforma: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Elmeforma: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Szellemforma: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Válaszd ki a Trinity melyik formáját szeretnéd használni. A különböző formák hatásai egyszerre is aktívak lehetnek.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity alkalmazza majd ennek az ereklyének a távoli alkímiai hatását, _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity ennek az ereklyének a passzív életerő-regenerációját _+%1$d_ szinten fogja alkalmazni 20 körre, _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.cost=Ennek a képességnek a díja változó, de leggyakrabban _%d._
actors.hero.abilities.cleric.trinity.desc=A Klerikus egy _Hármasság_ páncélképességet kap, amelyek három új varázslat használatával különböző tárgyhatásokhoz rendelhetők. Mindegyik varázslat a Klerikus által a menet során azonosított különböző felszerelések hatásainak emulálására összpontosít: testforma (fegyverek és páncél), elmeforma (pálcák és dobófegyverek), valamint szellemforma (gyűrűk és tárgyak).\n\nMinden Háromságforma egyszerre egy hatással ruházható fel, és a Klerikus választja ki, hogy melyiket aktiválja a Háromság használatakor. A Háromság nem fogja lemásolni egy már felszerelt tárgy hatását.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity ennek az ereklyének a hatását fogja használni egy megrontott baráti lidérc megidézésére, egy _+%1$d_ szellem életerejével, _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.ench_glyph_use=A Trinity ezt a hatást _%1$d körökre_ fogja alkalmazni _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.etherealchains_use=A Trinity ennek az ereklyének a láncvető hatását fogja alkalmazni _+%1$d_ hatótávolsággal, _%2$s töltés költségével._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity _%2$s töltet árán fogja alkalmazni ennek az ereklyének a nassolási hatását._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity _+%1$d_ ponton fogja alkalmazni az ereklye ellenséges rabló hatását, _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.name=Szentháromság
actors.hero.abilities.cleric.trinity.no_duplicate=A Trinity nem tud lemásolni egy olyan effektet, amivel már rendelkezel!
actors.hero.abilities.cleric.trinity.no_imbue=A Trinity jelenleg egyik formájához sem rendelkezik beállított hatással, használd az egyik varázslatát!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity ezt az _erőteljes_ hatást _%1$d körökre_ fogja alkalmazni _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.ring_use=Trinity ennek a gyűrűnek a hatását _+%1$d_ ponton fogja alkalmazni 20 körre, _%2$s töltés árán._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity ennek az ereklyének a gyökérhatását egy véletlenszerű, káros maggal fogja alkalmazni, _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.short_desc=A Klerikus egy _Hármasság_ képességet nyer, amelyek utánozzák a már látott felszereléseket, és új varázslatok használatával rendelhetők hozzájuk.
actors.hero.abilities.cleric.trinity.skeletonkey_use=A Trinity _%2$s töltés_ árán fogja alkalmazni ennek az ereklyének a beszúrási hatását.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity ennek az ereklyének a sikító hatását _+%1$d_ pontban fogja alkalmazni, _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity ezt a fegyvert _+%1$d_-ra fogja dobni _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity ennek az ereklyének az időbefagyasztó hatását _%1$d_ kör időtartammal fogja alkalmazni, _%2$s töltet árán._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=A Trinity _%1$d/10_ esélyt ad arra, hogy az ereklye véletlenszerű görgetési hatását alkalmazva további költségek nélkül, _%2$s díj ellenében kínálja fel az egzotikus verziót._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity _+%1$d_ sebességgel, _%2$s töltés árán le fogja lőni ezt a _többszörözős_ pálcát._
actors.hero.abilities.cleric.trinity.wand_use=Trinity _+%1$d_ ütéssel _%2$s töltet árán le fogja lőni ezt a pálcát._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Ez a karakter párbajban vesz részt. Ő, valamint szövetségesei vagy minionjai a szokásos módon cselekedhetnek, míg a többiek lefagynak. ZXQPH1 ZXQZXQPH2 ZXQ A párbaj egy meghatározott ideig tart, amíg az egyik résztvevő meg nem hal, vagy amíg a résztvevők több mint 5 mezőt el nem távolítanak egymástól. ZXQPH3 ZXQZXQPH4 ZXQ Hátralévő körök: ZXQPH0 ZXQ.
actors.hero.abilities.duelist.challenge$duelparticipant.name=párbaj résztvevője
actors.hero.abilities.duelist.challenge.ally_target=Csak az ellenségeket hívhatod ki.
actors.hero.abilities.duelist.challenge.already_dueling=Egyszerre csak egy párbajban lehetsz.
actors.hero.abilities.duelist.challenge.desc=A Párbajozó kihív egy közeli ellenséget párbajra. Az ellenség kénytelen harcolni vele, míg az összes többi ellenség ideiglenesen megfagy az időben.\n\nA célpontnak elérhetőnek kell lennie, és a Párbajozó 5 mezőjén belül kell lennie. A párbaj addig tart, amíg 10 kör el nem telik, az ellenség meg nem hal, vagy a Párbajozó több mint 5 mezőnyire van az ellenségtől.\n\nA megfagyott ellenségek sebezhetetlenek. A Párbajozó szövetségeseit nem fagyasztja meg ez a képesség, de ha egy főellenséget céloznak meg, annak lényei sem fagynak meg.
actors.hero.abilities.duelist.challenge.distant_target=Az ellenség túl messze van ahhoz, hogy szembeszálljon vele.
actors.hero.abilities.duelist.challenge.name=kihívás
actors.hero.abilities.duelist.challenge.prompt=Válassz ki egy ellenséget, akit kihívsz
actors.hero.abilities.duelist.challenge.short_desc=A Párbajozó _Kihív_ egy közeli ellenséget párbajra, ideiglenesen lefagyasztva az összes többi ellenséget.
actors.hero.abilities.duelist.challenge.unreachable_target=Képesnek kell lenned elérni a célodat.
actors.hero.abilities.duelist.elementalstrike.desc=A Párbajozó lecsap egy ellenségre vagy helyszínre, egy garantáltan találó normál támadást végrehajtva, és egy mágikus hatást terjesztve ki, amely akár 4 mezőt is elérhet egy 65 fokos kúpban. Ez a mágikus hatás a Párbajozó elsődleges fegyverének varázslatától függően változik.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Egy varázslat nélküli elementális csapás egy kis mágikus löketet bocsát ki, 6-12 sebzést okozva minden ellenfélnek a hatótávolságon belül.
actors.hero.abilities.duelist.elementalstrike.name=elemi csapás
actors.hero.abilities.duelist.elementalstrike.short_desc=A Párbajozó egy _Elemi Csapást_ hajt végre, ami egy kúpos AOE-ben terjed ki, a fegyvervarázslatán alapuló effektussal.
actors.hero.abilities.duelist.feint.bad_location=Nem tudsz arra a helyre költözni.
actors.hero.abilities.duelist.feint.desc=A Párbajozó támadást színlel, miközben egy szomszédos mezőre rohan, és egy pillanatra egy utóképet hagy maga után. Az őt támadó ellenségek ehelyett az ő utóképét támadják meg. Az utóképet támadó ellenségek összezavarodnak, ami megszakítja a következő akciójukat, és meglepetésszerű támadásnak teszik ki őket.
actors.hero.abilities.duelist.feint.name=tettetés
actors.hero.abilities.duelist.feint.prompt=Válassz egy helyet, ahová sietni szeretnél
actors.hero.abilities.duelist.feint.short_desc=A Párbajozó _Csel_, támadást színlel, miközben egy szomszédos mezőre rohan. Az ellenfelek megtámadják az utóképét, amivel esélyük nyílik egy ellentámadásra.
actors.hero.abilities.duelist.feint.too_far=Az a helyszín nincs a közeledben.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=A Vadásznő rövid időre megerősödik, íjával megnövelve mozgási és támadási sebességét.\n\nHátralévő körök: %s
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=a természet ereje
actors.hero.abilities.huntress.naturespower.desc=A Vadásznő ideiglenesen felvértezi magát és íját a természet erejével! Ez 8 körig tart.\n\nEz idő alatt a Vadásznő kétszeres sebességgel mozog, és 33%-kal gyorsabban támad az íjával. A bónusz íjhatások nem aktiválódnak, ha a Mesterlövész a speciális támadásait használja.
actors.hero.abilities.huntress.naturespower.name=a természet ereje
actors.hero.abilities.huntress.naturespower.short_desc=A Vadásznő a _Természet Erejét_ hívja segítségül, rövid időre megnövelve mozgási sebességét és íja tűzgyorsaságát.
actors.hero.abilities.huntress.spectralblades.desc=A Vadásznő egy kísértetkardot dob az ellenfélre, ami úgy működik, mint egy távolsági csapás a közelharci fegyveréből. A közelharci fegyverek összes szokásos hatása aktiválódik, beleértve a varázslatokat is.
actors.hero.abilities.huntress.spectralblades.name=spektrális pengék
actors.hero.abilities.huntress.spectralblades.short_desc=A Vadásznő _Spektrális Pengéket_ dob a célpontra, a jelenleg felszerelt közelharci fegyverétől függő sebzést okozva.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Egy varázslatos sólyom, akit a Vadásznő idéz meg. Élénk, éteri kéken izzik, feje folyamatosan mozog, miközben a területet pásztázza. \n\n Bár nem különösebben jó harcos, sebessége és látása kiválóvá teszi az ellenségek felderítésére és elterelésére.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Garantáltan fennmaradó kitérés: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Hátralévő körök: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=A sólymod támadásra indul!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=A sólymod abba a pozícióba mozdul.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=A sólymod követni akar téged.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Ezt a karaktert egy adott hőspáncél képességgel találhatod meg.
actors.hero.abilities.huntress.spirithawk$hawkally.name=szellemi sólyom
actors.hero.abilities.huntress.spirithawk.desc=A Vadásznő megidéz egy szellemsólyom-familiust, akit a képesség újbóli használatával lehet irányítani, amíg megidézve van. A sólyom 100 körig tart, az irányítása ingyenes. \n\nA sólyom minimális életerővel és támadóerővel rendelkezik, de gyors, kitérő és pontos. Teljes látóterét mindig megosztja a Vadásznővel. Immunis minden területhez kötött hatásra, például a tűzre és a mérges gázra. Nem támad, hacsak nem kifejezetten erre utasítják.
actors.hero.abilities.huntress.spirithawk.name=szellemi sólyom
actors.hero.abilities.huntress.spirithawk.no_space=Nincs szabad hely a közeledben.
actors.hero.abilities.huntress.spirithawk.short_desc=A Vadásznő megidéz egy _Szellemsólyom_ familiárist, ami segíthet neki felderíteni a helyszíneket és elterelni az ellenségek figyelmét.
actors.hero.abilities.mage.elementalblast.desc=A Mágus egy varázslatos robbanást bocsát ki, amely legfeljebb 4 mezőnyi távolságra lévő kör alakú területet fed le, és legfeljebb 15-25 sebzést okoz. Az elementális robbanás konkrét hatása a mágus botjába helyezett pálcától függ.
actors.hero.abilities.mage.elementalblast.generic_desc=Az elementális robbanás hatása hasonló lesz ahhoz, mint amikor egy pálcával lecsapunk egy ellenségre vagy szövetségesre.
actors.hero.abilities.mage.elementalblast.name=elemi robbanás
actors.hero.abilities.mage.elementalblast.no_staff=Ezt a képességet a személyzeted nélkül nem tudod használni.
actors.hero.abilities.mage.elementalblast.short_desc=A Mágus egy _Elementális Robbanást_ bocsát ki a botjából, ami nagy területet befed maga körül, melynek hatása a botjában lévő pálcától függően változik.
actors.hero.abilities.mage.warpbeacon.depths=Nem lehet a mélységek között ugrálni!
actors.hero.abilities.mage.warpbeacon.desc=A Mágus elhelyez egy jelzőtűt, amely tetszés szerint eltéríthető. A jelző lehelyezése 1 kört vesz igénybe, de az odatérítés azonnal megtörténik. \n\n A Mágus alapértelmezés szerint nem tud emeletek között téríteni, és a jelzőt nem használhatja megközelíthetetlen helyek, például bezárt szobák elérésére. A Mágus beleteleportálhat az ellenségekbe, ami félrelöki őket.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Oda nem lehet jelzőfényt helyezni!
actors.hero.abilities.mage.warpbeacon.locked_floor=A zárt emeletet nem hagyhatod el!
actors.hero.abilities.mage.warpbeacon.name=warp jeladó
actors.hero.abilities.mage.warpbeacon.short_desc=A Mágus egy _Torzító Jelzőtűt_ helyez az aktuális helyére, amire azonnal visszateleportálhat.
actors.hero.abilities.mage.warpbeacon.too_far=Az a helyszín túl messze van!
actors.hero.abilities.mage.warpbeacon.window_cancel=mégsem
actors.hero.abilities.mage.warpbeacon.window_clear=tiszta jelzőfény
actors.hero.abilities.mage.warpbeacon.window_desc=A jelzőfény jelenleg a %d emeleten található.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportálni a jeladóhoz
actors.hero.abilities.mage.wildmagic.desc=A Mágus szabadjára engedi pálcái erejét, véletlenszerűen legfeljebb 4 alkalommal lőve velük egyetlen körben. A Mágus botja nem része ennek a hatásnak. ZXQPH0 ZXQ ZXQPH1 ZXQ Minden pálca szintje 2-vel nő, maximum +3-ig. Ez a képesség fél pálca töltetet használ el minden egyes villámcsapáshoz, és egyetlen pálcát sem lehet 2-nél többször elsütni.
actors.hero.abilities.mage.wildmagic.name=vad varázslat
actors.hero.abilities.mage.wildmagic.no_wands=Nincsenek pálcáid, amikkel lecsaphatsz!
actors.hero.abilities.mage.wildmagic.short_desc=A Mágus szabadjára engedi a pálcáiban lévő _Vad Mágiát_, és egyetlen kör alatt véletlenszerűen többször tüzel egy kiválasztott célpontra.
actors.hero.abilities.ratmogrify$transmograt.desc=Ez az ellenség patkányná változott. Ha engem kérdeztek, ez hatalmas előrelépés! - Patkánykirály
actors.hero.abilities.ratmogrify$transmograt.name=ratmogriffed %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Megölte: patkánymámoros ellenség
actors.hero.abilities.ratmogrify.cant_transform=Ezt nem lehet elbagatellizálni!
actors.hero.abilities.ratmogrify.desc=A hős 6 körre patkányná változtat egy ellenséget! Főellenfeleket, szövetségeseket és patkányokat nem lehet patkánymódosítani. A patkánymódosított ellenfelek megtartják eredeti tulajdonságaikat, de nem rendelkeznek képességekkel.
actors.hero.abilities.ratmogrify.name=patkánymogrifikáció
actors.hero.abilities.ratmogrify.short_desc=A hős _Patkányként_ támad_ egy ellenséget! Ez ideiglenesen képességek nélküli patkányná változtatja.
actors.hero.abilities.ratmogrify.too_strong=Az ellenség túl erős ahhoz, hogy patkányokat emlegessen!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Ez az ellenség megjelölésre került, ami miatt 25%% bónusz sebzést szenvedett el, de a jelölés elmúlásáig nem halhat meg.\n\nHátralévő körök: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=halálra jelölve
actors.hero.abilities.rogue.deathmark.ally_target=Csak az ellenségeket jelölheted meg
actors.hero.abilities.rogue.deathmark.desc=A Zsivány egy jelet helyez egy kiválasztott ellenfélre, aminek következtében az 25% extra sebzést szenved el. A jel azonnal megjelenik és 5 körig tart. A megjelölt ellenfelek bónusz sebzést szenvednek el, de nem halhatnak meg, amíg a jel le nem jár. Ha egy ellenfélnek 0 ÉP-je van, amikor a jel lejár, azonnal meghal.
actors.hero.abilities.rogue.deathmark.name=haláljel
actors.hero.abilities.rogue.deathmark.short_desc=A Zsivány egy _Haláljelet_ helyez el egy kiválasztott ellenfélre. A megjelölt ellenfelek bónusz sebzést szenvednek el, de nem halhatnak meg, amíg a jel el nem múlik.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=A Zsivány egy másolata, árnyékos sötétségből. Mozdulatlanul áll, üres szemekkel és apró sötétségfoszlányokkal, mint a gőz, szállnak fel belőle. \n\n A klón nem a Zsivány tökéletes másolata, de még mindig egy tisztességes harcos, és a megfelelő tehetségekkel profitálhat a Zsivány felszereléséből.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=A klónod támadásra indul!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=A klónod arra a pozícióra mozog.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=A klónod követni kezd téged.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Ezt a karaktert egy adott hőspáncél képességgel találhatod meg.
actors.hero.abilities.rogue.shadowclone$shadowally.name=árnyék gazember
actors.hero.abilities.rogue.shadowclone.desc=A Zsivány megidézi saját árnyékutánzatát, akit irányítva segíthet neki a harcban. Az árnyékklón irányítása ingyenes. ZXQPH0 ZXQ ZXQPH1 ZXQ A klón 80 ÉP-vel rendelkezik, nincs páncélja, és 10-20 sebzést okoz. Mindezek a tulajdonságok fejleszthetők tehetségekkel, így a klón profitálhat a hős fegyvereiből és páncéljából.
actors.hero.abilities.rogue.shadowclone.name=árnyékklón
actors.hero.abilities.rogue.shadowclone.short_desc=A Zsivány megidéz egy _Árnyékklónt_, akit arra lehet irányítani, hogy segítsen neki a harcban.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Valahogy az ellenségek könnyen meggyőződnek arról, hogy ez a fából készült csali az igazi Tolvaj!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Ezt a karaktert egy adott hőspáncél képességgel találhatod meg.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=fa csali
actors.hero.abilities.rogue.smokebomb.desc=A Zsivány eldob egy füstbombát és legfeljebb 6 mezőnyire pislog. Veszélyeken és ellenségeken keresztül tud pislogni, de szilárd terepen, például falakon nem. A Zsivány régi pozíciójával szomszédos ellenségek 5 körre megvakulnak.
actors.hero.abilities.rogue.smokebomb.fov=Csak a látómeződ üres pontjára ugorhatsz.
actors.hero.abilities.rogue.smokebomb.name=füstbomba
actors.hero.abilities.rogue.smokebomb.prompt=Válasszon egy helyet, ahová ugrani szeretne
actors.hero.abilities.rogue.smokebomb.short_desc=A Zsivány pislogva dob le egy _Füstbombát_. Megvakítja az ellenséget a régi tartózkodási helye közelében.
actors.hero.abilities.warrior.endure$enduretracker.desc=A Harcos mostantól az elszenvedett sebzés alapján bónusz sebzést okoz.\n\nBónusz sebzés: %1$d\nMég találatok: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=kitartás
actors.hero.abilities.warrior.endure.desc=A Harcos 3 körig bírja ki, minden forrásból a sebzés felét szenvedi el. Ez a csökkentés a sebzést elhárító hatások, például a páncél előtt érvényesül.\n\nKitartás után a harcos következő 10 körön belüli találata bónusz sebzést kap. Ez a bónusz sebzés megegyezik a kitartás alatt okozott összes sebzés felével, a sebzéscsökkentő hatások előtt!\n\nHa a Harcosnak van bármilyen kombinációja, ennek a képességnek a használata 3 körrel növeli a hátralévő idejét.
actors.hero.abilities.warrior.endure.name=elviselni
actors.hero.abilities.warrior.endure.short_desc=A Harcos _Kitart_, kihagy több kört, de magas sebzéstűrő képességet szerez. Ezután bónusz sebzést okoz az elviselt sebzések alapján.
actors.hero.abilities.warrior.heroicleap.desc=A Harcos egy célzott helyszín felé ugrik, átszelve az útjába kerülő ellenségeket vagy veszélyeket. Falakat vagy más szilárd terepet azonban nem tud átugrani.
actors.hero.abilities.warrior.heroicleap.name=hősies ugrás
actors.hero.abilities.warrior.heroicleap.prompt=Válaszd ki az ugrás irányát
actors.hero.abilities.warrior.heroicleap.short_desc=A Harcos egy _Hősies Ugrást_ hajt végre egy célzott helyszín felé, átrepülve az ellenségek és a veszélyek felett.
actors.hero.abilities.warrior.shockwave.desc=A harcos a földre csapódik, egy lökéshullámot keltve, amely akár 5 mezőt is áthatol egy 60 fokos kúpban. Az ebbe a lökéshullámba kerülő ellenségek 5 körre megbénulnak. Emellett 5-10 sebzést szenvednek el, plusz további 1-2 sebzést minden olyan erőpontért, amellyel a harcos 10 feletti erejével rendelkezik.
actors.hero.abilities.warrior.shockwave.name=lökéshullám
actors.hero.abilities.warrior.shockwave.short_desc=A Harcos kúpos AOE-ben egy _Lökéshullámot_ bocsát ki a földre csapva. A lökéshullámba kerülő ellenfelek megsérülnek és megbénulnak.
actors.hero.hero.key_distracted=Nem tudod teljesen kinyitni a zárat, tovább kell próbálkoznod.
actors.hero.hero.leave=Még nem mehetsz el, a kazamata többi része lent vár rád!
actors.hero.hero.level_cap=Nem tudsz erősebbé válni, de a tapasztalataid erőt adnak!
actors.hero.hero.level_up=Szintlépés!
actors.hero.hero.locked_chest=Ez a láda zárva van, és nincs hozzá illő kulcsod.
actors.hero.hero.locked_door=Nincs egyező kulcsod.
actors.hero.hero.name=te
actors.hero.hero.new_level=Szintlépés! +Pontosság, +Kitérés, +5 ÉP!
actors.hero.hero.new_talent=+1 Tehetségpont!
actors.hero.hero.noticed_smth=Észrevettél valamit.
actors.hero.hero.pain_resist=A fájdalom segít ellenállni az alvás utáni vágynak.
actors.hero.hero.revive=Az ankh életadó energiával robban fel!
actors.hero.hero.search=keresés
actors.hero.hero.search_distracted=Nehéz koncentrálni, a keresés kimerítő.
actors.hero.hero.unspent=Vannak elköltetlen tehetségpontjaid!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=nem viheted: %s.
actors.hero.hero.you_now_have=felvetted: %s.
actors.hero.heroclass.cleric=pap
actors.hero.heroclass.cleric_desc=A Klerikus egy _egyedi szent kötettel_ kezd, amelyet különféle varázslatok kimondására használhat.\n\nA Klerikus tehetségeinek nagy része a varázslatok tanulására vagy fejlesztésére összpontosít.\n\nA Klerikus emellett _egy bottal_, szövetpáncéllal, víztömlővel és bársony erszénynyel kezd.\n\nA Klerikus automatikusan azonosítja:\n_-_ Azonosító tekercsek\n_-_ Tisztasági italok\n_-_ Átok eltávolításának tekercsei
actors.hero.heroclass.cleric_desc_short=A Klerikus egy isteni varázsló, aki egyedi _szent könyvét_ használja isteni mágia közvetítésére. _Találtságain keresztül _tanulhat és fejleszthet varázslatokat_.
actors.hero.heroclass.cleric_unlock=A Klerikus feloldásához _teljesen tisztítsd meg az átkot bármely elátkozott felszerelésről._
actors.hero.heroclass.duelist=párbajozó
actors.hero.heroclass.duelist_desc=A Párbajozó egy _egyedi rapierrel_ kezd, amelynek különleges képessége idővel újratöltődik.\n\nA játékban minden fegyvernek _különböző különleges képessége_ van, amelyet a Párbajozó használhat.\n\nA Párbajozó ezenkívül _két dobókarral_, szövetpáncéllal, egy víztömlővel és egy bársony tasakká válik.\n\nA Párbajozó automatikusan azonosítja a következőket:\n_-_ Azonosító tekercsek\n_-_ Erőital \n_-_ Tükörkép tekercsek
actors.hero.heroclass.duelist_desc_short=A Párbajozó egy fegyvermester, aki a fegyverével egy _különleges fegyverképességet_ aktiválhat. Ez a különleges képesség _minden fegyvernél más._
actors.hero.heroclass.duelist_unlock=A Párbajozó feloldásához _szerelkezz fel egy 2. szintű vagy magasabb szintű fegyverrel erőbüntetés nélkül._
actors.hero.heroclass.huntress=vadásznő
actors.hero.heroclass.huntress_desc=A Vadásznő egy _egyedi szellemíjjal_ kezd, amivel végtelen számú megidézett nyilat tud kilőni.\n\nA Vadásznő magas fűben _anélkül _át tud taposni_.\n\nA Vadásznő _szegecses kesztyűkkel_, szövetpáncéllal, víztömlővel és bársony tasakokkal is kezd.\n\nA Vadásznő automatikusan azonosítja a következőket:\n_-_ Azonosító tekercsek\n_-_ Elmeitalok Látás Italai\n_-_ Altatódal Tekercsek
actors.hero.heroclass.huntress_desc_short=A Vadásznő a dobófegyverek mestere, és egy végtelen számú nyíllal ellátott _varázsíjjal_ rendelkezik. Magas fűben is _anélkül közlekedik, _hogy letaposná_.
actors.hero.heroclass.huntress_unlock=A Vadásznő feloldásához _dobófegyverekkel 10-szer üsd meg az ellenséget egy játékban._
actors.hero.heroclass.mage=mágus
actors.hero.heroclass.mage_desc=A Mágus egy _egyedi bottal_ kezd, ami lényegesen gyorsabban töltődik, mint egy pálca, és eggyel több töltete van. A bot _bármelyik pálcával_ átitatható, amit a Mágus a kazamatában talál.\n\nA Mágus ezenkívül egy botjába ágyazott _varázslövedék pálcával_, szövetpáncéllal, víztömlővel és bársony tasakká alakítja át.\n\nA Mágus automatikusan azonosítja:\n_-_ Azonosító tekercsek\n_-_ Folyékony láng főzetei\n_-_ Fejlesztési tekercsek
actors.hero.heroclass.mage_desc_short=A Mágus egy arkán szakértő, és egy pálcánál erősebb _mágikus botot_ hord. A bot _bármelyik pálcával_ átitatható, amit a Mágus talál.
actors.hero.heroclass.mage_unlock=A Mágus feloldásához _használj egy fejlesztési tekercset, hogy erősebbé tedd a tárgyat._
actors.hero.heroclass.rogue=gazember
actors.hero.heroclass.rogue_desc=A Zsivány egy _egyedi Árnyékköpennyel_ kezd, amellyel tetszés szerint láthatatlanná válhat.\n\nA Zsivány nagyobb távolságból _képes titkokat és csapdákat_ észlelni.\n\nA Zsivány ezenkívül _egy tőrrel_, _három dobókéssel_, szövetpáncéllal, egy víztömlővel és egy bársony erszénynyel kezd.\n\nA Zsivány automatikusan azonosítja a következőket:\n_-_ Azonosító tekercsek\n_-_ Láthatatlanná tévő italok\n_-_ Mágikus térképezés tekercsei
actors.hero.heroclass.rogue_desc_short=A Zsivány kitérhet az ellenség elől és láthatatlanságból lecsaphat _árnyékköpenye_ segítségével. Nagyobb távolságból _észlel titkokat és csapdákat_ is.
actors.hero.heroclass.rogue_unlock=A Zsivány feloldásához _hajts végre 10 meglepetéstámadást egy játékban._
actors.hero.heroclass.warrior=harcos
actors.hero.heroclass.warrior_desc=A Harcos egy _egyedi, feltört pecséttel_ kezd, amely egy _védőáramlatot biztosít neki, amikor az életereje a felénél alacsonyabb. A pecsét páncélok között mozgatható, és _egyetlen fejlesztést_ lehet vele átvinni.\n\nA Harcos ezenkívül egy _kopott rövidkarddal_, _három dobókővel_, szövetpáncéllal, egy víztömlővel és egy bársony erszénynyel kezd.\n\nA Harcos automatikusan azonosítja:\n_-_ Azonosító Tekercsek\n_-_ Gyógyító Italok\n_-_ Düh Tekercsek
actors.hero.heroclass.warrior_desc_short=A Harcos extra sebzést szenved el a _feltört pecsétje_ által biztosított pajzsnak köszönhetően. A pecsét áthelyezhető a páncélok között, és _egyetlen fejlesztést visz át_.
actors.hero.heroclass.warrior_unlock=A Harcos automatikusan feloldódik.
actors.hero.herosubclass.assassin=orgyilkos
actors.hero.herosubclass.assassin_desc=Az Assassin akkor készíti elő a következő támadását, amikor láthatatlanná válik. Minél tovább készül, annál erősebb lesz a következő támadása. A felkészülés legfeljebb 9 körre elegendő. \n\nA felkészülés után az Assassin bónusz sebzést okoz a következő támadásánál, pisloghat a célpontjára, és azonnal megölheti a kellően gyenge ellenfeleket is.
actors.hero.herosubclass.assassin_short_desc=Az _Assassin_ képes halálos csapást mérni, miközben láthatatlan. Minél tovább vár, annál erősebb lesz a támadás.
actors.hero.herosubclass.battlemage=csatamágus
actors.hero.herosubclass.battlemage_desc=A csatamágus bónusz hatást kap, valahányszor közelharcban a botjával csap le, mintha a botja extra varázslattal rendelkezne. Ezek a hatások attól függenek, hogy milyen pálcával van ellátva a botja, minden pálcának megvan a saját hatása. A pálcahatásokon felül a csatamágus botja 0,5 töltetet is kap, amikor vele csap le.
actors.hero.herosubclass.battlemage_short_desc=A _Csatamágus_ bónusz hatásokat idéz elő közelharcban a botjával. Ezek a hatások attól függenek, hogy milyen pálcával van átitatva a botja.
actors.hero.herosubclass.berserker=dühöngő
actors.hero.herosubclass.berserker_desc=A Berserker dührohamot kap, ahogy fizikai sebzést szenved, beleértve a páncélja által blokkolt sebzést is! A düh idővel fokozatosan elmúlik, de lassabban, ha alacsony az életereje.\n\nA düh akár +50% sebzést is okozhat a Berserkernek. Maximális dühöngésnél dühönghet, ami egy pajzslöketet eredményez, és a dühét addig tartja, amíg van még pajzsa. A pajzs a dühöngő páncéljának szintjével arányos, és jelentősen megnőhet, ha alacsony az életereje. A Berserkernek időre van szüksége a regenerálódáshoz, miután dühöngni kezdett.
actors.hero.herosubclass.berserker_short_desc=A _Berserker_ dühöng, ahogy sebzést szenved. A düh növeli a sebzését, és 100%-os szinten aktiválható bónusz pajzsként.
actors.hero.herosubclass.champion=bajnok
actors.hero.herosubclass.champion_desc=A Bajnok a közelharci fegyverek mestere, aki az elsődleges fegyvere mellett egy másodlagos fegyvert is fel tud szerelni. Normál támadásaihoz az elsődleges fegyverét használja, de azonnal lecserélheti azt, és bármelyik fegyver képességét használhatja.\n\nEmellett 2-vel nagyobb maximális fegyverképesség-töltést és +50%-kal nagyobb fegyverképesség-újratöltési sebességet kap.
actors.hero.herosubclass.champion_short_desc=A _Bajnok_ két fegyvert tud használni és több fegyvertöltést kap. A szokásos támadásai az elsődleges fegyverét használják, de válthat fegyvereket és bármelyik fegyver képességét használhatja.
actors.hero.herosubclass.freerunner=szabadúszó
actors.hero.herosubclass.freerunner_desc=Ahogy a szabadfutó mozog, lendületet gyűjt. 10 kör futása után akár 10 lendületet is szerezhet, de gyorsan elveszíti, ha megáll. A szabadfutó felhasználhatja lendületét a szabadfutás megkezdéséhez, lendületpontonként 2 körre.\n\nSzabadon futás közben a szabadfutó kétszeres sebességgel mozog, és szintjével arányosan bónusz kitéréseket kap. A szabadfutás vége után van egy lehűlési idő, mielőtt a lendületet újra lehetne építeni.
actors.hero.herosubclass.freerunner_short_desc=A _Szabadfutó_ futás közben lendületet vesz, amit felhasználhat a szabadfutás megkezdésére. Ez rövid ideig bónusz sebességet és kitérési lehetőséget biztosít számára.
actors.hero.herosubclass.gladiator=gladiátor
actors.hero.herosubclass.gladiator_desc=A Gladiátor egy kombópontot épít minden alkalommal, amikor sikeres közelharci vagy dobófegyveres támadást hajt végre. Ha a Gladiátor 5 körön belül (gyilkosság után 15 körön belül) nem hajt végre sikeres támadást, a kombója visszaáll az eredeti állapotba.\n\nA kombó építésekor a Gladiátor számos garantáltan találó képességet használhat:\n2 Kombó: hátralöki az ellenséget, megőrzi a kombót\n4 Kombó: páncél alapján sebzést okoz\n6 Kombó: hárít, megőrzi a kombót\n8 Kombó: sebzést okoz a célpontnak és a közeli ellenségeknek\n10 Kombó: minden kombóval egyszer támad
actors.hero.herosubclass.gladiator_short_desc=A _Gladiátor_ kombókat épít, amikor sikeres támadásokat hajt végre. Kombók elköltésével egyedi képességeket használhat.
actors.hero.herosubclass.monk=szerzetes
actors.hero.herosubclass.monk_desc=A Szerzetes a fizikai technikák mestere. Ahogy legyőzi az ellenségeket, energiát nyer, amelyet különféle védekező és hasznosság-orientált képességekre használhat fel. Ez az energia idővel nem halványul, de a Szerzetes szintje alapján felső határt szab.\n\n1 Energia: gyors ökölcsapás\n2 Energia: fókusz a következő támadás kikerülésére\n3 Energia: azonnali roham a közelben\n4 Energia: elrúg egy ellenséget\n5 Energia: meditáció az állapotok törléséhez és a pálca és az ereklye töltésének visszaállításához
actors.hero.herosubclass.monk_short_desc=A _Szerzetes_ harc közben energiát gyűjt. Ezt az energiát számos egyedi képességre lehet fordítani.
actors.hero.herosubclass.paladin=levente
actors.hero.herosubclass.paladin_desc=A paladin számos új és továbbfejlesztett varázslatot kap, amelyek a közelharcot, valamint a fegyverekkel és páncélokkal való szinergiát hangsúlyozzák.\n\nA paladin _Szent Fegyver_ és _Szent Oszlop_ varázslatai nagyobb bónuszokat adnak, már nem írják felül a meglévő varázslatokat és szimbólumokat, és más varázslatokkal meghosszabbíthatók.\n\nA paladin emellett megkapja a _Smite_ varázslatot is, amely lehetővé teszi számára, hogy garantált közelharci találatot hajtson végre bónusz sebzéssel és varázslatos erővel.
actors.hero.herosubclass.paladin_short_desc=A _Paladin_ új rövid hatótávolságú varázslatokat, valamint a szent fegyverek és wardok felhatalmazott változatait kapja.
actors.hero.herosubclass.priest=pap
actors.hero.herosubclass.priest_desc=A Pap számos új és továbbfejlesztett varázslatot kap, amelyek a távolsági harcot és a mágikus tárgyakkal való szinergiát hangsúlyozzák.\n\nA Pap 50 körönként egyszer ingyen használhatja a _Vezetőfényt_, megvilágítja a varázslatai által közvetlenül célba vett ellenségeket, és a megvilágítás gyengítését szövetségesekkel, pálcákkal és néhány ereklyével elfogyaszthatja a szintjüknek megfelelő bónusz sebzésért + 5.\n\nA Pap emellett megkapja a _Ragyogás_ varázslatot is, amely eloszlatja a sötétséget és minden látható ellenségre hatással van, 2 töltet árán megvilágítva és rövid időre elkábítva őket.
actors.hero.herosubclass.priest_short_desc=A _Pap_ új, nagy hatótávolságú varázslatokat és a fényvezető fény felhatalmazott változatát kapja.
actors.hero.herosubclass.sniper=orvlövész
actors.hero.herosubclass.sniper_desc=A Mesterlövész a távolsági harc mestere, akinek távolsági támadásai áthatolnak az ellenség páncélján. Amikor dobófegyverrel támad egy ellenséget, mesterlövész jelet helyez rá, ami lehetővé teszi számára, hogy egy speciális támadást indítson íjából. Ez a különleges támadás az íja kiegészítésétől függően változik.\n\nEgy kiegészítés nélküli íj egy pillanatfelvételt lő, amely csökkentett sebzést okoz, de azonnal tüzel. Egy gyors íj három nyílból álló sortüzet lő, amely csökkentett sebzést okoz, továbbra is aktiválhatja a varázslatokat, és 1 kört vesz igénybe a tüzeléshez. Egy sebzést okozó íj egy mesterlövész lövést lő, amely garantáltan talál, a távolságtól függően bónusz sebzést okoz, és 2 kört vesz igénybe a tüzeléshez.
actors.hero.herosubclass.sniper_short_desc=A _Mesterlövész_ távolsági támadásaival át tud ütni a páncélon. Miután dobófegyverrel lecsapott, egy speciális támadást is indíthat íjjal.
actors.hero.herosubclass.warden=gondnok
actors.hero.herosubclass.warden_desc=Az Őr erős kapcsolatban áll a természettel, ami számos bónuszhatást biztosít számára a fűvel és a növényekkel kapcsolatban. Képes átlátni a magas és barázdált fűszálakon, mintha üres tér lenne.\n\nAz Őr fűszálakat növeszt minden eldobott vagy elültetett mag körül, és különleges hatásokat ér el, amikor növényeket tapos. Ezek a speciális hatások felváltják a szokásos növényhatásokat, ami azt jelenti, hogy egyetlen növényre sem ártalmas, ha rálép.
actors.hero.herosubclass.warden_short_desc=Az _Őr_ átlát a magas fűben, és bónusz hatásokat kap, amikor magokat vet és növényeket tapos.
actors.hero.herosubclass.warlock=boszorkánymester
actors.hero.herosubclass.warlock_desc=A Warlocknak lehetősége van lélekjelet helyezni a karakterekre, amikor pálcát használ rajtuk. A lélekjel alkalmazásának esélye és annak időtartama a pálca szintjével növekszik.\n\nAmikor egy ellenfél lélekjelet kapott, a Warlock minden 5 okozott sebzés után 2 életerő-pontot gyógyít, de csak közelharci vagy dobófegyveres támadás esetén, pálcás támadás esetén nem!
actors.hero.herosubclass.warlock_short_desc=A _Warlock_-nak lehetősége van lélekkel megjelölni az ellenségeket a pálcáival. Valahányszor fizikai sebzést okoz a megjelölt ellenfeleknek, gyógyít.
actors.hero.spells.auraofprotection$aurabuff.desc=A paladin védelmező energiát sugároz maga köré.\n\nBármely közeli szövetséges (beleértve magát a paladint is) csökkentett sebzést szenved el, és megkapja a paladin páncéljelének fokozott erejét.\n\nHátralévő körök: %s.
actors.hero.spells.auraofprotection$aurabuff.name=a védelem aurája
actors.hero.spells.auraofprotection.desc=A paladin 20 körön keresztül védelmező energiát sugároz maga körül csillogó aurában. Bármely szövetséges, aki a paladin 2 mezőjén belül van (beleértve saját magát is), %1$d%% kevesebb sebzést szenved el, és megkapja a paladin páncéljelének hatását +%2$d%% erővel.\n\nEz a sebzéscsökkentés a többi sebzéscsökkentő hatás (pl. páncél) előtt történik. A jelképerő-növelés mindig érvényesül, de ez a varázslat nem okozhatja, hogy a paladin jelképe egynél többször érvényesüljön, ha egy karakter már részesül belőle (pl. maga a paladin, vagy egy prizmatikus kép).
actors.hero.spells.auraofprotection.name=a védelem aurája
actors.hero.spells.auraofprotection.short_desc=Megnöveli a paladin és a közeli szövetségesek védelmét.
actors.hero.spells.beamingray$beamingrayboost.desc=Ezt a szövetségest nemrég teleportálta a Sugárzó Sugár, ami bónusz sebzést adott neki a teleportálás utáni legközelebbi ellenféllel szemben. A Sokak Ereje nem jár le, amíg ez a buff aktív. \n\nHátralévő körök: %s.
actors.hero.spells.beamingray$beamingrayboost.name=sugárzó sugár
actors.hero.spells.beamingray.desc=A Klerikus a szövetségesén lévő erőt egy fénysugárrá alakítja, amely egy adott helyre sugározza őket. Ha a sugár egy ellenséggel ütközik, a szövetségest a közelbe helyezi, és az ellenség felé irányítja.\n\nA sugár maximális hatótávolsága %1$d mezőkig terjed, és a Sokak Ereje bónusz sebzését +%2$d%%-ra növeli 10 körre a legközelebbi, 4 mezőn belüli ellenféllel szemben. A sugárzó sugár akár a mozdulatlan szövetségeseket is képes teleportálni, de a hatótávolsága ilyen esetekben a felére csökken.
actors.hero.spells.beamingray.name=sugárzó sugár
actors.hero.spells.beamingray.no_space=Nincs ott hely a szövetségesednek megjelenni.
actors.hero.spells.beamingray.out_of_range=A helyszín hatótávolságon kívül esik.
actors.hero.spells.beamingray.short_desc=Teleportálja a szövetségesedet és bónusz sebzést ad.
actors.hero.spells.blessspell.desc=A Klerikus szent áldást helyez magára vagy egy másik karakterre, akit lát.\n\nHa magukra varázsolják, a hatás gyengébb, %1$d áldásköröket és %2$d akadályt ad.\n\nHa más karakterekre varázsolják, a varázslat erősebb, %3$d áldásköröket és %4$d gyógyítást ad. A felesleges gyógyítás akadálytá alakul.
actors.hero.spells.blessspell.name=áldás
actors.hero.spells.blessspell.short_desc=Megáldja és megvédi a klerikust, megáldja és meggyógyítja másokat.
actors.hero.spells.bodyform$bodyformbuff.desc=Trinity testformája jelenleg egy varázslat vagy jel erejét adja meg neked, mintha az a jelenlegi fegyvereden vagy páncélodon lenne.\n\nMegjegyzés: a testforma nem biztosíthat egy olyan hatás újabb másolatát, amelyből már részesülsz.\n\nJelenlegi hatás: %1$s.\n\nHátralévő körök: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=testalkat
actors.hero.spells.bodyform.desc=A Klerikus kiválaszt egy varázslatot vagy jelet, amelyet ebben a körben azonosított, és felruházza a Trinity-t annak hatásával.\n\nAmikor a Trinity-t használjuk, a Klerikus elnyeri a kiválasztott varázslat vagy jel hatását %d körökre. Ez az ideiglenes varázslat vagy jel bármilyen hatással működik, mint egy normál varázslat vagy jel.\n\nEz a varázslat minden más, a Trinity-t jelenleg felruházó testhatást felvált.
actors.hero.spells.bodyform.name=testalkat
actors.hero.spells.bodyform.short_desc=Szentháromságot rendel egy varázslathoz vagy szimbólumhoz.
actors.hero.spells.cleanse.desc=A Klerikus minden káros állapothatást megszüntet magán és látható szövetségesein. A varázslat vége után az összes érintett karakter %1$d körökre csökkentett debuff immunitást és %2$d akadályt is kap.
actors.hero.spells.cleanse.name=tisztít
actors.hero.spells.cleanse.short_desc=Megszünteti a debuffokat és pajzsot ad.
actors.hero.spells.clericspell.charge_cost=Díjköltség: %d
actors.hero.spells.clericspell.invalid_enemy=Nem célozhatod meg az ellenséget.
actors.hero.spells.clericspell.invalid_target=Nem célozhatod meg azt a helyet.
actors.hero.spells.clericspell.no_target=Nincs ott célpont.
actors.hero.spells.clericspell.prompt=Válasszon egy célt
actors.hero.spells.divineintervention.desc=A Klerikus rengeteg erőt áraszt a kötetéből önmagába és szövetségeseibe, %1$d pajzsra erősítve mindenkit, és %2$d körökkel kiterjesztve az Felemelkedett Formát. Ennek a varázslatnak a hihetetlen védekező ereje a nagyon magas töltési költséggel mérlegelendő. \n\nA felemelkedett forma által biztosított többi pajzshoz hasonlóan ez a pajzs sem gyengül normál esetben, hanem azonnal megszűnik, amikor a felemelkedett forma véget ér.
actors.hero.spells.divineintervention.name=isteni beavatkozás
actors.hero.spells.divineintervention.short_desc=Jelentős pajzsnövelés Clericnek és szövetségeseinek.
actors.hero.spells.divinesense$divinesensetracker.desc=Ez a karakter ideiglenesen képes látni a közeli lényeket az elméjével!\n\nHátralévő körök: %s.
actors.hero.spells.divinesense$divinesensetracker.name=isteni érzék
actors.hero.spells.divinesense.desc=A Klerikus érzékszerveivel a környezetére összpontosít, %d csempetávolsággal 50 körre szóló mentális látást szerezve. Ez a varázslat gyorsan elsüthető.
actors.hero.spells.divinesense.name=isteni érzék
actors.hero.spells.divinesense.short_desc=Nyerj ideiglenes elmelátást széles tartományban.
actors.hero.spells.flash.desc=A Klerikus egy közeli helyszínen jeleníti meg felemelkedett formáját, és oda teleportál. A Villám képes a Klerikust bármelyik felfedezett, hatótávolságon belüli és üres helyre teleportálni. Ez a varázslat minden alkalommal több kötetnyi töltetbe kerül, amikor ugyanabban a felemelkedett formában használják.
actors.hero.spells.flash.name=vaku
actors.hero.spells.flash.prompt=Válasszon egy helyszínt
actors.hero.spells.flash.short_desc=Teleportálj egy közeli helyre.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=A Pap 50 kör eltelte után újra ingyen használhatja a Vezérfényt.\n\nHátralévő körök: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Irányító fény
actors.hero.spells.guidinglight$illuminated.desc=Ez a karakter fénylő fény hatására világít. Bár a fény nem elég erős ahhoz, hogy megvilágítsa a környező területet, a mágikus hatás megkönnyíti a Klerikus számára a csapások becsapódását.
actors.hero.spells.guidinglight$illuminated.desc_generic=Más hősök továbbra is használhatják a megvilágított képességet, hogy profitáljanak a perzselő fény tehetségéből, de a pontosságuk nem javul.
actors.hero.spells.guidinglight$illuminated.desc_priest=A Pap ezen felül fogyaszthat ragyogással megvilágított lényeket, pálcaütést, szövetséges csapást vagy bizonyos ereklyék hatásait. A megvilágított lény használata a Pap szintjével megegyező mágikus sebzést + 5 okoz.
actors.hero.spells.guidinglight$illuminated.name=megvilágított
actors.hero.spells.guidinglight.desc=A Klerikus egy mágikus energianyalábot lő ki, ami eltalálja a célpontot, 2-8 sebzést okozva és megvilágítva azt. A következő, megvilágított ellenfél ellen irányuló, nem terhelt fizikai támadás garantáltan eltalálja.
actors.hero.spells.guidinglight.desc_priest=_Ez a varázslat erősebb, ha a Pap használja._ A varázslat 50 körönkénti első elsütése nem kerül kötettöltésbe, és a megvilágítást a ragyogás, a pálcák, más karakterek és az ellenséget közvetlenül befolyásoló tárgyak fogyasztják. Amikor a megvilágítást ilyen módon használják, a Pap szintjével megegyező bónusz mágikus sebzést okoz + 5.
actors.hero.spells.guidinglight.name=Irányító fény
actors.hero.spells.guidinglight.short_desc=Távolsági mágikus sebzést okoz és garantált találatot.
actors.hero.spells.hallowedground$hallowedterrain.desc=A földet itt megszentelték. A megszentelt föld lelassítja az ellenségeket, gyógyítja a szövetségeseket és elősegíti a fű terjedését.
actors.hero.spells.hallowedground.desc=A Pap isteni mágiáját a közeli földbe fókuszálja, ami egy %1$dx%1$d megszentelt terepet hoz létre 20 körre.\n\nAmikor elsütik, ez a varázslat minden szövetségesét 15 ÉP-vel gyógyítja (az egészséges szövetségesek és a Pap pajzsot kap), rövid időre gyökeret ereszt az ellenségekben, és rövid füvet terít szét.\n\nA megszentelt terep körönként 1 ÉP-vel gyógyítja a szövetségeseket (az egészséges szövetségesek és a Pap pajzsot kap), megbénítja az ellenségeket, és véletlenszerűen magas fű növekedését okozza.\n\nA megszentelt terepet tűz pusztítja el, és barázdált füvet hoz létre, ha a passzív regenerációs hatások le vannak tiltva, vagy a Pap egy ideje nem szerzett tapasztalati pontot.
actors.hero.spells.hallowedground.name=szent föld
actors.hero.spells.hallowedground.prompt=Válasszon egy helyszínt
actors.hero.spells.hallowedground.short_desc=Gyógyítja a szövetségeseket, lelassítja az ellenségeket és füvet terjeszt egy AOE-ben.
actors.hero.spells.holyintuition.cursed=Rosszindulatú mágia lappang ebben a tárgyban.
actors.hero.spells.holyintuition.desc=A Klerikus érzékszerveit egy tárgyra összpontosítja, és anélkül, hogy fel kellene szerelnie, megállapítja, hogy az átkozott-e vagy sem.
actors.hero.spells.holyintuition.name=szent intuíció
actors.hero.spells.holyintuition.prompt=válassz egy elemet
actors.hero.spells.holyintuition.short_desc=azonosítja, hogy egy tárgy átkozott-e vagy sem.
actors.hero.spells.holyintuition.uncursed=Ez a tárgy mentes a rosszindulatú mágiától.
actors.hero.spells.holylance$lancecooldown.desc=A Pap nemrégiben elsütötte a Szent Lándzsát, és várnia kell, mielőtt újra elsütné. \n\nHátralévő körök: %s.
actors.hero.spells.holylance$lancecooldown.name=szent lándzsa lehűlési ideje
actors.hero.spells.holylance.desc=A Pap nagy mennyiségű energiát koncentrál egy pusztító, fényből készült dobólándzsába. Ez a lándzsa %1$d-%2$d sebzést okoz, és mindig maximális sebzést okoz az élőhalott és démoni célpontoknak. \n\nEz a varázslat nagyon drága, és 30 körös a hűlési ideje.
actors.hero.spells.holylance.name=szent lándzsa
actors.hero.spells.holylance.short_desc=Nagy távolsági mágikus sebzést okoz.
actors.hero.spells.holyward$holyarmbuff.desc=A Klerikus szent energiával itatta át a kopott páncéljukat, ideiglenesen felülírva minden meglévő jelet, és a páncél 1 plusz sebzésponttal blokkolva azt.\n\nHátralévő körök: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=A paladin szent energiával itatta át kopott páncélját, aminek következtében a páncél további 3 sebzéspontot blokkol.\n\nHa más varázslatokat is elsütsz, miközben a szent őrség aktív, az időtartama elköltött töltetenként 10 körrel meghosszabbodik.\n\nHátralévő körök: %s.
actors.hero.spells.holyward$holyarmbuff.name=szent kórterem
actors.hero.spells.holyward.desc=A Klerikus szent fény jeleivel itatja át kopott páncélját, 1-gyel növelve a páncél sebzésblokkolását. A varázslat elsütése gyors.\n\nEz a jel 50 körig tart, és ez idő alatt felülírja a páncélon lévő hasznos jeleket. A Klerikus akkor is profitál ebből a hatásból, ha nincs páncélja.
actors.hero.spells.holyward.desc_paladin=_Ez a varázslat erősebb, ha a paladin használja._ A további sebzésblokkolás 3-ra nőtt, a varázslat már nem írja felül a meglévő szimbólumokat, és ha más varázslatokat használsz, miközben a szent őrség aktív, akkor a varázslat időtartama 10 körrel meghosszabbodik töltetenként.
actors.hero.spells.holyward.glyph_desc=Ez a jel kissé megnöveli a páncél által blokkolható sebzés mértékét.
actors.hero.spells.holyward.glyph_name=%s fény
actors.hero.spells.holyward.name=szent kórterem
actors.hero.spells.holyward.short_desc=Ideiglenesen felülírja a szimbólumokat a páncélblokkolás fokozása érdekében.
actors.hero.spells.holyweapon$holywepbuff.desc=A Klerikus szent energiával itatta át a viselt fegyverét, ideiglenesen felülírva minden meglévő varázslatot, és azt okozva, hogy a fegyver minden támadásnál 2 extra mágikus sebzést okoz.\n\nHátralévő körök: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=A paladin szent energiával itatta át kopott fegyverét, aminek következtében támadásai további 6 mágikus sebzést okoznak.\n\nHa más varázslatokat is elsütsz, miközben a szent fegyver aktív, a hatóideje töltésenként 10 körrel meghosszabbodik.\n\nHátralévő körök: %s.
actors.hero.spells.holyweapon$holywepbuff.name=szent fegyver
actors.hero.spells.holyweapon.desc=A Klerikus szent energiával varázsolja el viselt fegyverét, aminek következtében a fegyver további 2 mágikus sebzést okoz, valahányszor eltalál vele egy ellenséget. A varázslat elsütése gyors. \n\nEz a varázslat 50 körig tart, és ez idő alatt felülírja a fegyver minden jótékony varázslatát. Fegyvertelen csapásokra is érvényes ez a hatás.
actors.hero.spells.holyweapon.desc_paladin=_Ez a varázslat erősebb, ha a paladin használja._ A további mágikus sebzés 6-ra nő, a varázslat már nem írja felül a meglévő varázslatokat, és ha más varázslatokat használsz, miközben a szent fegyver aktív, akkor a varázslat időtartama 10 körrel meghosszabbodik töltésenként.
actors.hero.spells.holyweapon.ench_desc=A szent fegyverrel eltalált ellenségek extra mágikus sebzést szenvednek el.
actors.hero.spells.holyweapon.ench_name=szent %s
actors.hero.spells.holyweapon.name=szent fegyver
actors.hero.spells.holyweapon.short_desc=Ideiglenesen felülírja a varázslatokat a sebzés növelése érdekében.
actors.hero.spells.judgement.desc=A Klerikus öklével a földre csap, ami egy fénykitörést okoz, ami minden általa látott ellenfélnek sebzést okoz. Ez %1$d-%2$d sebzést okoz az alapon, de további 33%% sebzést okoz minden egyes varázslatért, amit a Klerikus a felemelkedett formába lépett (vagy mióta utoljára használta az Ítéletet). \n\nJelenleg az Ítélet %3$d-%4$d sebzést okoz.
actors.hero.spells.judgement.name=ítélet
actors.hero.spells.judgement.short_desc=Minden látható ellenfelet megsebesít.
actors.hero.spells.layonhands.desc=A paladin szent energiát bocsát ki a kezükön keresztül, gyógyítva vagy védve bármit, amit megérint.\n\nA paladin ezt a varázslatot bármelyik szomszédos karakterre elsütheti, hogy gyógyítson vagy védjen mindent, amit megérint.%1$d gyógyító hatást gyakoroljon rá, vagy önmagára, hogy pajzsot vagy védőpajzsot szerezzen. A varázslatból származó többletgyógyítás pajzsmá alakul.\n\nEz a varázslat azonnal elsüthető és ismételten elsüthető, de egyszerre legfeljebb háromszoros pajzsot adhat.
actors.hero.spells.layonhands.name=kézrátétel
actors.hero.spells.layonhands.short_desc=Azonnal meggyógyít egy szomszédos karaktert, vagy pajzzsal látja el a paladint.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=A Cleric nemrégiben Life Link képességet használt erre a szövetségesre.\n\nAz Life Link szokásos előnyei mellett ez a karakter csökkentett sebzést is elszenved, a pozitív Cleric varázslatok mind a Clericre, mind erre a szövetségesre vonatkoznak, nem csak egyre, és a Sok Hatalma nem jár le, amíg ez a buff aktív.\n\nHátralévő körök: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=életkapcsolat-védelem
actors.hero.spells.lifelinkspell.desc=A Klerikus megerősíti a kapcsolatot önmaga és felhatalmazott szövetségese között. Ezzel a felhatalmazott kapcsolattal a hős és szövetségese között minden elszenvedett sebzés megoszlik a %1$d körökben, és a Sok Ereje védekező bónusza -%2$d%% elszenvedett sebzésre nő. Megjegyzendő, hogy a sebzés a páncél után, de a Sok Ereje sebzéscsökkentése előtt oszlik meg.\n\nAmíg ez a hatás aktív, a T3 vagy alacsonyabb erősségű hasznos Klerikus varázslatok mind a Klerikusra, mind a szövetségesére vonatkoznak, mintha csak az egyikükre hatottak volna.
actors.hero.spells.lifelinkspell.name=életkapcsolat
actors.hero.spells.lifelinkspell.short_desc=Megosztja a sebzést egy szövetségesével, és csökkenti az általa elszenvedett sebzést.
actors.hero.spells.mindform.desc=A Klerikus kiválaszt egy pálcát vagy dobófegyvert, amelyet ebben a menetben azonosított, és felruházza a Trinity-t annak hatásával.\n\nAmikor a Trinity-t használjuk, a Klerikus egyetlen támadást hajthat végre, mintha a kiválasztott tárgyat használná +%d-nál. Ez minden olyan hatást kivált, amelyet az adott típusú tárgy használata általában kiváltana.\n\nEz a varázslat minden más elmehatást felülír, amellyel a Trinity jelenleg fel van ruházva.
actors.hero.spells.mindform.name=elmeforma
actors.hero.spells.mindform.short_desc=A Szentháromságot egy pálcához vagy dobófegyverhez rendeli.
actors.hero.spells.mnemonicprayer.desc=A Pap egy imát mond, amely %1$d körökkel meghosszabbítja az összes buff vagy debuff időtartamát egy adott célponton. A varázslat elsütése nem vesz igénybe időt. A pozitív hatások tovább tartanak a szövetségeseken (beleértve magát a Papot is), a káros hatások pedig tovább tartanak az ellenségeken. \n\n Az emlékezetes ima csak egyszer hosszabbíthatja meg a buff vagy debuff adott példányát, és nem hosszabbíthatja meg a páncél képességekből származó buffokat.
actors.hero.spells.mnemonicprayer.name=emlékeztető ima
actors.hero.spells.mnemonicprayer.short_desc=Meghosszabbítja a buffokat/debuffokat egy szövetségesre/ellenségre, és újra aktiválja őket megvilágítva.
actors.hero.spells.radiance.desc=A Pap szent fényt bocsát ki, 3 körre elkábítva az összes látható ellenfelet. Ha egy ellenfél már meg van világítva, a Ragyogás aktiválja a Világítás bónusz sebzését, majd alkalmazza a Világítás gyengítését. A Ragyogás hatására a Pap 100 körre világít, ha az aktuális szint sötét.
actors.hero.spells.radiance.name=ragyogás
actors.hero.spells.radiance.short_desc=Megvilágítja és rövid időre elkábítja a látható ellenségeket.
actors.hero.spells.recallinscription$useditemtracker.desc=A Klerikus nemrég használt egy tárgyat, ami működik a feliratos visszahívás varázslattal. A Klerikus a varázslattal megismételheti a tárgy hatását.\n\nFelhasznált tárgy: %1$s.\n\nHátralévő körök: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=nemrég használt rúna
actors.hero.spells.recallinscription.desc=A Klerikus szent mágiát használ, hogy újra felhasználja egy olyan mágikus rúna hatását, amelyet egy, a legutóbbi %s körben használt rúnakövön vagy tekercsen talált. A \n\n Visszahívás felirattal nem lehet fejlesztő tekercseket másolni. Ennek a varázslatnak a töltési költsége attól függ, hogy melyik tárgyat használták legutóbb: 2 egy rúnakőért, 3 egy tekercsért, 4 egy egzotikus tekercsért. Ez a töltési költség megduplázódik, ha egy transzmutációs tekercset, vagy olyan alkímiai tárgyat másolnak, amelyet transzmutációval vagy fejlesztéssel kell elkészíteni.
actors.hero.spells.recallinscription.name=visszahívási felirat
actors.hero.spells.recallinscription.short_desc=Megismétli a nemrég használt rúnakövet vagy tekercset.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Egy vékony fénypajzs áll a karakter és az ellenség között. Nem elég erős ahhoz, hogy teljesen blokkolja a támadásokat, de tompítja azokat. \n\nHátralévő körök: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=fénypajzs
actors.hero.spells.shieldoflight.desc=A Klerikus egy vékony fényréteget hoz létre maga és egy ellenség között, amivel 5 körre %1$d-%2$d lépésekben növeli páncélja blokkoló erejét az ellenféllel szemben.\n\nEz a varázslat nem tart sokáig, de nem használható több célpont ellen egyszerre.
actors.hero.spells.shieldoflight.name=fénypajzs
actors.hero.spells.shieldoflight.short_desc=Ideiglenes páncélt biztosít a célpont ellen.
actors.hero.spells.smite.desc=A Paladin igazságos pusztító erővel ruházza fel a közelharci csapást.\n\nA normál közelharci sebzés mellett Smite garantáltan találó, nem terhelt támadásokat is okoz, +300%% varázsereje van, és %1$d - %2$d bónusz mágikus sebzést okoz.\n\nSmite bónusz mágikus sebzése a Paladin szintjével arányos, és mindig maximális bónusz mágikus sebzést okoz élőhalott vagy démoni ellenfelek ellen.
actors.hero.spells.smite.name=csapás
actors.hero.spells.smite.short_desc=Garantált találat bónusz sebzéssel és varázslatos erővel.
actors.hero.spells.spiritform$spiritformbuff.desc=Trinity szellemformája jelenleg egy tárgy erejét adja neked, mintha fel lenne szerelve vele.\n\nMegjegyzés: a szellemforma nem képes egy már meglévő hatás másolatát biztosítani.\n\nJelenlegi hatás: %1$s.\n\nHátralévő körök: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=szellemforma
actors.hero.spells.spiritform.desc=A Klerikus kiválaszt egy gyűrűt vagy tárgyat, amelyet ebben a körben azonosított (kivéve a szent kötetet), és felruházza Trinity-t a hatásával.\n\nHa egy gyűrűt választanak, akkor a Trinity +%1$d fokon 20 körre megadja a gyűrű hatását.\n\nHa egy tárgyat választanak, akkor a Trinity megismétli az tárgy hatását +%2$d fokon. Minden tárgynak más a specifikus viselkedése és a páncéltöltés költsége, ha a Trinity-vel használják.\n\nEz a varázslat minden más szellemhatást felülír, amellyel a Trinity jelenleg felruházva van.
actors.hero.spells.spiritform.name=szellemforma
actors.hero.spells.spiritform.short_desc=Háromságot rendel egy gyűrűhöz vagy tárgyhoz.
actors.hero.spells.stasis$stasisbuff.desc=A Klerikusnak jelenleg van egy szövetségese a sztázisban. Minden pozitív hatás, ami a szövetségesre hatással van, megmarad, beleértve a Sokak Erejét is, és újra megjelennek a Klerikus mellett, amikor a hatás véget ér. A hatás korábban is befejezhető a sztázis újrahasznosításával.\n\nSzövetséges a sztázisban: %1$s.\nHátralévő körök: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Mozdulatlan szövetségesed hátramarad.
actors.hero.spells.stasis$stasisbuff.name=stagnált szövetséges
actors.hero.spells.stasis.desc=A Klerikus a szövetségesével való kapcsolatát magára összpontosítja, aminek következtében a szövetséges ideiglenesen egyfajta energia-sztázisban marad a Klerikuson belül. A szövetséges legfeljebb %d körökig megmarad, a sztázisban töltött idő nem befolyásolja a rá gyakorolt pozitív hatásokat. \n\n A szövetséges a Klerikus mellett jelenik meg, amikor a sztázis természetes úton véget ér, vagy azonnal és ingyenesen újraindíthatja a varázslatot, hogy a hatás idő előtt véget vessen. A sztázis akár mozdulatlan szövetségeseidet is mozgathatja, de nem helyezheti át őket emeletek között.
actors.hero.spells.stasis.name=pangás
actors.hero.spells.stasis.short_desc=Eltávolítja a szövetségest a kazamatából és megőrzi őt.
actors.hero.spells.sunray.desc=A Pap vakító fénysugarat lő ki a célpontra, %1$d-%2$d sebzést okozva és %3$d körökre megvakítva őket. A Napsugár mindig maximális sebzést okoz az élőhalott és démoni célpontoknak. \n\nMiután ezzel a varázslattal eltalálták az ellenfelet, a látása igazodik, megakadályozva, hogy újra megvakítsa. Ha azonban a varázslat megvakítása közben ismét eltalálják, akkor a fény elsöprő erejű, és megbénítja őket.
actors.hero.spells.sunray.name=napsugár
actors.hero.spells.sunray.short_desc=Távolsági varázssebzést okoz és egyszer megvakítja a célpontot.
actors.hero.spells.walloflight$lightwall.desc=Csillogó fénypanelek zárják el az utat.
actors.hero.spells.walloflight.desc=A paladin egy tömör fénypanelekből álló falat hoz létre közvetlenül maga előtt, ami 1 mező vastag, %1$d mező széles, és 20 körig tart.\n\nEz a fal ugyanúgy működik, mint egy normál fal, azzal a különbséggel, hogy át lehet látni rajta. Az ellenségek, amelyek a falba szorulnak, amikor az létrejön, egy pillanatra elkábítóak, és ha lehetséges, hátratolódnak. Bármi, ami a falban ragadt, ki tud mozdulni belőle.\n\nA fal a négy fő égtáj vagy a négy átlós irány bármelyikében varázsolható. Ha egy fal már aktív, a varázslat ingyenesen újra felhasználható a fal azonnali megtisztítására.
actors.hero.spells.walloflight.early_end=Eloszlatod a fény falát.
actors.hero.spells.walloflight.name=fényfal
actors.hero.spells.walloflight.short_desc=Falat hoz létre, ami blokkolja az ellenséget.
actors.hero.talent$aggressivebarriercooldown.desc=Nemrég használtad ezt a tehetséget, és várnod kell, mielőtt újra használhatnád.\n\nHátralévő körök: %s.
actors.hero.talent$aggressivebarriercooldown.name=agresszív akadályhűtés
actors.hero.talent$combinedlethalityabilitytracker.executed=kivégezték
