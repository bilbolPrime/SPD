actors.hero.talent.elimination_match.desc=_+1:_ Ha a Párbajozó a párbaj befejezését követő 3 körön belül újra kihívást jelent, a kihívás töltetköltsége _16%-kal csökken_.\n\n_+2:_ Ha a Párbajozó a párbaj befejezését követő 3 körön belül újra kihívást jelent, a kihívás töltetköltsége _30%-kal csökken_.\n\n_+3:_ Ha a Párbajozó a párbaj befejezését követő 3 körön belül újra kihívást jelent, a kihívás töltetköltsége _40%-kal csökken_.\n\n_+4:_ Ha a Párbajozó a párbaj befejezését követő 3 körön belül újra kihívást jelent, a kihívás töltetköltsége _50%-kal csökken_.
actors.hero.talent.elimination_match.title=kieséses mérkőzés
actors.hero.talent.empowered_strike.desc=_+1:_ A csatamágus első közelharci csapása a botjával a Zapping után _+16% sebzést okoz_, és a bot bónusz hatása _+50% erőt kap_.\n\n_+2:_ A csatamágus első közelharci csapása a botjával a Zapping után _+33% sebzést okoz_, és a bot bónusz hatása _+100% erőt kap_.\n\n_+3:_ A csatamágus első közelharci csapása a botjával a Zapping után _+50% sebzést okoz_, és a bot bónusz hatása _+150% erőt kap_.
actors.hero.talent.empowered_strike.title=felhatalmazott sztrájk
actors.hero.talent.empowering_meal.desc=_+1:_ Az étel evése _2 bónusz sebzést_ ad a mágusnak a következő 3 alkalommal, amikor pálcával sebzést okoz.\n\n_+2:_ Az étel evése _3 bónusz sebzést_ ad a mágusnak a következő 3 alkalommal, amikor pálcával sebzést okoz.
actors.hero.talent.empowering_meal.title=erőt adó étkezés
actors.hero.talent.endless_rage.desc=_+1:_ A Berserker maximum _116%-os dühkitörést_ érhet el.\n\n_+2:_ A Berserker maximum _133%-os dühkitörést_ érhet el.\n\n_+3:_ A Berserker maximum _150%-os dühkitörést_ érhet el.\n\nMinden 100% feletti dühkitörés 1%-kal növeli a Berserk pajzsát és 1%-kal csökkenti a lehűlési időt, de a sebzésbónuszt nem növeli +50%-nál nagyobbra.
actors.hero.talent.endless_rage.title=végtelen düh
actors.hero.talent.energizing_meal.desc=_+1:_ Az étel evése a Mágus 1. körét veszi igénybe, és _5 pálca újratöltési kört_ biztosít számára.\n\n_+2:_ Az étel evése a Mágus 1. körét veszi igénybe, és _8 pálca újratöltési kört_ biztosít számára.
actors.hero.talent.energizing_meal.title=energizáló étkezés
actors.hero.talent.enhanced_combo.desc=_+1:_ Amikor a Gladiátor kombója 7 vagy magasabb, Clobber hátralökési távolsága 3-ra nő, szédülést okoz, és gödrökbe lökheti az ellenséget.\n\n_+2:_ A +1 előnyei mellett, amikor a Gladiátor kombója 9 vagy magasabb, a Parry több támadásra is képes.\n\n_+3:_ A +1 és +2 előnyei mellett a Gladiátor akár 3 kombót/mezőket is ugorhat Csapás, Összetörés vagy Düh használatakor.
actors.hero.talent.enhanced_combo.title=továbbfejlesztett kombináció
actors.hero.talent.enhanced_lethality.desc=_+1:_ Az Assassin képes meggyilkolni azokat az ellenfeleket, akiknek az életereje _4/13/27/67%_ alatt van felkészültségi szinttől függően, a korábbi 3/10/20/50%-ról felfelé haladva.\n\n_+2:_ Az Assassin képes meggyilkolni azokat az ellenfeleket, akiknek az életereje _5/17/33/83%_ alatt van felkészültségi szinttől függően, a korábbi 3/10/20/50%-ról felfelé haladva.\n\n_+3:_ Az Assassin képes meggyilkolni azokat az ellenfeleket, akiknek az életereje _6/20/40/100%_ alatt van felkészültségi szinttől függően, a korábbi 3/10/20/50%-ról felfelé haladva.
actors.hero.talent.enhanced_lethality.title=fokozott halálozási arány
actors.hero.talent.enhanced_rings.desc=_+1:_ Amikor a Zsivány egy ereklyét használ, gyűrűi +1 fejlesztést kapnak _3 körre_.\n\n_+2:_ Amikor a Zsivány egy ereklyét használ, gyűrűi +1 fejlesztést kapnak _6 körre_.\n\n_+3:_ Amikor a Zsivány egy ereklyét használ, gyűrűi +1 fejlesztést kapnak _9 körre_.
actors.hero.talent.enhanced_rings.title=fokozott gyűrűk
actors.hero.talent.enlightening_meal.desc=_+1:_ Az étel evése 1 kört vesz igénybe a paptól, és _0,67 töltetet_ ad neki a szent kötetén.\n\n_+2:_ Az étel evése 1 kört vesz igénybe a paptól, és _1 töltetet_ ad neki a szent kötetén.
actors.hero.talent.enlightening_meal.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett 2 pálca- és ereklye-kört tölt fel +1-gyel, vagy 3 kört +2-vel. Ez nem használható fel a Bőségszaru újratöltésére.
actors.hero.talent.enlightening_meal.title=Felvilágosító étkezés
actors.hero.talent.enraged_catalyst.desc=_+1:_ A Berserker fegyverén lévő varázslatok és átkok annál gyakrabban aktiválódnak, minél több düh van benne, maximum _15%-kal gyakrabban_ 100%-os dühöngésnél.\n\n_+2:_ A Berserker fegyverén lévő varázslatok és átkok annál gyakrabban aktiválódnak, minél több düh van benne, maximum _30%-kal gyakrabban_ 100%-os dühöngésnél.\n\n_+3:_ A Berserker fegyverén lévő varázslatok és átkok annál gyakrabban aktiválódnak, minél több düh van benne, maximum _45%-kal gyakrabban_ 100%-os dühöngésnél.
actors.hero.talent.enraged_catalyst.title=feldühödött katalizátor
actors.hero.talent.evasive_armor.desc=_+1:_ Szabadfutás közben a Freerunner további _+1 kitérést kap_ minden erőfölösségi pontonként a páncélján.\n\n_+2:_ Szabadfutás közben a Freerunner további _+2 kitérést kap_ minden többleterőpontonként a páncélján. a Freerunner további _+3 kitérést_ kap minden erőfölösségi pontonként a páncélján.
actors.hero.talent.evasive_armor.title=kitérő páncél
actors.hero.talent.even_the_odds.desc=_+1:_ A Harcos további _5% bónusz sebzést_ okoz minden 2 mezőn belüli ellenfélnek, amikor a Kitartás véget ér.\n\n_+2:_ A Harcos további _10% bónusz sebzést_ okoz minden 2 mezőn belüli ellenfélnek, amikor a Kitartás véget ér.\n\n_+3:_ A Harcos további _15% bónusz sebzést_ okoz minden 2 mezőn belüli ellenfélnek, amikor a Kitartás véget ér.\n\n_+4:_ A Harcos további _20% bónusz sebzést_ okoz minden 2 mezőn belüli ellenfélnek, amikor a Kitartás véget ér.
actors.hero.talent.even_the_odds.title=kiegyenlíti az esélyeket
actors.hero.talent.excess_charge.desc=_+1:_ Amikor a csatamágus botja teljesen fel van töltve, a következő roham szintjei után _0,67 pajzsot_ ad neki.\n\n_+2:_ Amikor a csatamágus botja teljesen fel van töltve, a következő roham szintjei után _1,33 pajzsot_ ad neki.\n\n_+3:_ Amikor a csatamágus botja teljesen fel van töltve, a következő roham szintjei után _2 pajzsot_ ad neki.
actors.hero.talent.excess_charge.title=többletdíj
