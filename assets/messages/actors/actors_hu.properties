actors.hero.talent.durable_tips.desc=_+1:_ A hegyes dárdák _2-szeres tartósságúak_, amikor az Őrző használja őket.\n\n_+2:_ A hegyes dárdák _3-szoros tartósságúak_, amikor az Őrző használja őket.\n\n_+3:_ A hegyes dárdák _4-szeres tartósságúak_, amikor az Őrző használja őket.
actors.hero.talent.durable_tips.title=tartós tippek
actors.hero.talent.eagle_eye.desc=_+1:_ A szellemsólyom látótávolsága 6-ról _7 csempére_ nőtt.\n\n_+2:_ A szellemsólyom látótávolsága 6-ról _8 csempére_ nőtt.\n\n_+3:_ A szellemsólyom látótávolsága 6-ról _9 csempére_ nőtt, és _2 csempét_ kap elmelátást.\n\n_+4:_ A szellemsólyom látótávolsága 6-ról _10 csempére_ nőtt, és _3 csempét_ kap elmelátást.
actors.hero.talent.eagle_eye.title=sasszem
actors.hero.talent.elemental_power.desc=_+1:_ Az elemi robbanás ereje _25%-kal_ nőtt.\n\n_+2:_ Az elemi robbanás ereje _50%-kal_ nőtt.\n\n_+3:_ Az elemi robbanás ereje _75%-kal_ nőtt.\n\n_+4:_ Az elemi robbanás ereje _100%-kal_ nőtt.
