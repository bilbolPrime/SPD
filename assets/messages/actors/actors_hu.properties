actors.hero.talent.adventurers_intuition.desc=_+1:_ A Párbajozó _2,5-szer gyorsabban_ azonosítja a fegyvereket és _1,75-szer gyorsabban_ a páncélt.\n\n_+2:_ A Párbajozó _akkor azonosítja a fegyvereket, _amikor felölti azokat_, és _2,5-szer gyorsabban_ a páncélt.
actors.hero.talent.adventurers_intuition.title=kalandor intuíciója
actors.hero.talent.aggressive_barrier.desc=_+1:_ A Párbajozó _3 pajzsot_ kap, amikor fegyverképességet használ és az életereje 50% vagy az alatt van.\n\n_+2:_ A Párbajozó _5 pajzsot_ kap, amikor fegyverképességet használ és az életereje 50% vagy az alatt van.
actors.hero.talent.aggressive_barrier.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett pajzsot biztosít közelharci támadáskor alacsony életerővel, 50 körös lehűlési idővel.
actors.hero.talent.aggressive_barrier.title=agresszív gát
actors.hero.talent.ally_warp.desc=_+1:_ A Mágus kiválaszthat egy szövetségesét, hogy azonnal helyet cseréljen vele, _2-es mezőtartományban_.\n\n_+2:_ A Mágus kiválaszthat egy szövetségesét, hogy azonnal helyet cseréljen vele, _4-es mezőtartományban_.\n\n_+3:_ A Mágus kiválaszthat egy szövetségesét, hogy azonnal helyet cseréljen vele, _6-os mezőtartományban_.\n\n A Mágus nem cserélhet helyet mozdulatlan szövetségeseivel.
actors.hero.talent.ally_warp.title=szövetséges torzítás
actors.hero.talent.arcane_vision.desc=_+1:_ Amikor a Mágus megöl egy ellenséget, _10 körre_ tudatállapotot kap rá.\n\n_+2:_ Amikor a Mágus megöl egy ellenséget, _15 körre_ tudatállapotot kap rá.
actors.hero.talent.arcane_vision.title=arkán látomás
actors.hero.talent.assassins_reach.desc=_+1:_ Az Orgyilkos pislogási hatótávolsága felkészültségi szintenként _1/3/4/6 csempére_ nőtt, az 1/2/3/4-ről.\n\n_+2:_ Az Orgyilkos pislogási hatótávolsága felkészültségi szintenként _2/4/6/8 csempére_ nőtt, az 1/2/3/4-ről.\n\n_+3:_ Az Orgyilkos pislogási hatótávolsága felkészültségi szintenként _2/5/7/10 csempére_ nőtt, az 1/2/3/4-ről.\n\nEz a pislogás áthatolhat veszélyeken és ellenségeken, de szilárd terepen, például falakon nem.
actors.hero.talent.assassins_reach.title=bérgyilkos hatóköre
actors.hero.talent.aura_of_protection.desc=_+1:_ A paladin elsütheti a _Védelem Auráját_, egy olyan varázslatot, amely a paladinnak és 2 mezőn belüli összes szövetségesének _20% sebzéstűrést_ és a paladin páncéljának hatását _+50% erővel_ biztosítja 20 körre, 2 töltet árán.\n\n_+2:_ A paladin elsütheti a _Védelem Auráját_, egy olyan varázslatot, amely a paladinnak és 2 mezőn belüli összes szövetségesének _30% sebzéstűrést_ és a paladin páncéljának hatását _+75% erővel_ biztosítja 20 körre, 2 töltet árán.\n\n_+3:_ A paladin elsütheti a _Védelem Auráját_, egy olyan varázslatot, amely a paladinnak és 2 mezőn belüli összes szövetségesének _40% sebzéstűrést_ és a paladin páncéljának hatását _+100% teljesítmény_ 20 körre, 2 töltés árán.
actors.hero.talent.aura_of_protection.title=a védelem aurája
actors.hero.talent.backup_barrier.desc=_+1:_ A Mágus _3 pajzsot_ kap, valahányszor elkölti a botja utolsó töltetét.\n\n_+2:_ A Mágus _5 pajzsot_ kap, valahányszor elkölti a botja utolsó töltetét.
actors.hero.talent.backup_barrier.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg,_ akkor a hős legmagasabb szintű pálcájáról aktiválódik.
actors.hero.talent.backup_barrier.title=biztonsági korlát
actors.hero.talent.barkskin.desc=_+1:_ Fűbe lépve az Őrző _szintjének _0-50%-át_ növeli kéregbőr páncéljában, ami minden körben elhalványul.\n\n_+2:_ Fűbe lépve az Őrző _szintjének _0-100%-át_ növeli kéregbőr páncéljában, ami minden körben elhalványul.\n\n_+3:_ Fűbe lépve az Őrző _szintjének _0-150%-át_ növeli kéregbőr páncéljában, ami minden körben elhalványul.
actors.hero.talent.barkskin.title=kéregbőr
actors.hero.talent.beaming_ray.desc=A Klerikus 1 töltet árán képes _Sugarat_ használni egy felhatalmazott szövetségeséből. Ez a sugár áthatol a falakon és a szövetségesét egy célzott helyre teleportálja. Ha egy ellenség tartózkodik azon a helyen, a szövetséges megjelenik mellette és célba veszi őt. A Sugárzó Sugár még a mozdulatlan szövetségeseidet is képes teleportálni, de ilyenkor a hatótávolsága fele akkora, mint amennyit tesz.\n\n_+1:_ A Sugárzó Sugár maximális hatótávolsága _4 mező,_ és a Sokak Ereje bónuszát _+35% sebzésre_ növeli a legközelebbi ellenféllel szemben 10 körre.\n\n_+2:_ A Sugárzó Sugár maximális hatótávolsága _8 mező,_ és a Sokak Ereje bónuszát _+40% sebzésre_ növeli a legközelebbi ellenféllel szemben 10 körre.\n\n_+3:_ A Sugárzó Sugár maximális hatótávolsága _12 mező,_ és a Sokak Ereje bónuszát _+45% sebzésre_ növeli a legközelebbi ellenféllel szemben 10 körre.\n\n_+4:_ A Sugárzó Sugár maximális hatótávolsága _16 mező,_ és a A Sokak Ereje bónusza _+50% sebzés_ a legközelebbi ellenfél ellen 10 körön keresztül.
actors.hero.talent.beaming_ray.title=sugárzó sugár
actors.hero.talent.blast_radius.desc=_+1:_ Az elemi robbanás sugara _5 csempére_ nőtt, a korábbi 4.\n\n_+2:_ Az elemi robbanás sugara _6 csempére_ nőtt, a korábbi 4.\n\n_+3:_ Az elemi robbanás sugara _7 csempére_ nőtt, a korábbi 4.\n\n_+4:_ Az elemi robbanás sugara _8 csempére_ nőtt, a korábbi 4.
actors.hero.talent.blast_radius.title=robbanási sugár
actors.hero.talent.bless.desc=_+1:_ A Pap használhatja az _Áldás_ varázslatot, amely _6 kör áldást és 10 pajzsot_ ad, ha önmagára varázsolja, vagy _10 kör áldást és 10 gyógyulást_, ha egy másik karakterre varázsolja, 1 töltet árán.\n\n_+2:_ A Pap használhatja az _Áldás_ varázslatot, amely _10 kör áldást és 15 pajzsot_ ad, ha önmagára varázsolja, vagy _15 kör áldást és 15 gyógyulást_, ha egy másik karakterre varázsolja, 1 töltet árán.\n\nA varázslatból származó többlet gyógyítás pajzsmá alakul.
actors.hero.talent.bless.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett a hős és az összes szövetségese pontosságát és kitérés-sebességét növeli 3%-kal +1-nél vagy 5%-kal +2-nél.
actors.hero.talent.bless.title=áldás
actors.hero.talent.body_form.desc=A Klerikus 2 töltet árán elsütheti a _Testformát_, ami a Klerikus által ebben a menetben azonosított varázslat vagy jel erejével ruházza fel Trinity-t.\n\n_+1:_ A Trinity használatakor a Klerikus _20 körre elnyeri a választott hatást._\n\n_+2:_ A Trinity használatakor a Klerikus _27 körre elnyeri a választott hatást._\n\n_+3:_ A Trinity használatakor a Klerikus _33 körre elnyeri a választott hatást._\n\n_+4:_ A Trinity használatakor a Klerikus _40 körre elnyeri a választott hatást._\n\nA Trinity egyszerre csak egy testhatással ruházható fel. Trinity páncéljának ára magasabb, ha a választott jel ritka és erős.
actors.hero.talent.body_form.title=testalkat
actors.hero.talent.body_replacement.desc=_+1:_ Pislogás után a Zsivány egy _20 életerővel és 1-3 páncéllal rendelkező fa csalit hagy maga után._\n\n_+2:_ Pislogás után a Zsivány egy _40 életerővel és 2-6 páncéllal rendelkező fa csalit hagy maga után._\n\n_+3:_ Pislogás után a Zsivány egy _60 életerővel és 3-9 páncéllal rendelkező fa csalit hagy maga után._\n\n_+4:_ Pislogás után a Zsivány egy _80 életerővel és 4-12 páncéllal rendelkező fa csalit hagy maga után._\n\nEgyszerre csak egy csali lehet aktív.
actors.hero.talent.body_replacement.title=testcsere
actors.hero.talent.body_slam.desc=_+1:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _1-4 plusz a sebzésblokkoló erejének 25%-a_ sebzést szenved el.\n\n_+2:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _2-8 plusz a sebzésblokkoló erejének 50%-a_ sebzést szenved el.\n\n_+3:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _3-12 plusz a sebzésblokkoló erejének 75%-a_ sebzést szenved el.\n\n_+4:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellenség _4-16 plusz a sebzésblokkoló erejének 100%-a_ sebzést szenved el.
actors.hero.talent.body_slam.title=testcsapás
actors.hero.talent.bounty_hunter.desc=_+1:_ Amikor az Assassin előkészített csapással öl meg egy ellenséget, a tárgyleesési esélye _2/4/8/16%-kal_ nő, a felkészültség szintjétől függően.\n\n_+2:_ Amikor az Assassin előkészített csapással öl meg egy ellenséget, a tárgyleesési esélye _4/8/16/32%-kal_ nő, a felkészültség szintjétől függően.\n\n_+3:_ Amikor az Assassin előkészített csapással öl meg egy ellenséget, a tárgyleesési esélye _6/12/24/48%-kal_ nő, a felkészültség szintjétől függően.
actors.hero.talent.bounty_hunter.title=fejvadász
actors.hero.talent.cached_rations.desc=_+1:_ A Zsivány _2 ellátmányadagot_ találhat a ládákban, miközben a kazamata következő néhány emeletét felfedezi.\n\n_+2:_ A Zsivány _3 ellátmányadagot_ találhat a ládákban, miközben a kazamata következő néhány emeletét felfedezi.\n\nAz ellátmányadagokat gyorsan elfogyasztják, mérsékelt mennyiségű jóllakottságot töltenek vissza, 5 életerőt gyógyítanak, és 1 töltetet töltenek vissza az Árnyékköpenybe.
actors.hero.talent.cached_rations.title=tárolt adagok
actors.hero.talent.cleanse.desc=_+1:_ A Klerikus elsütheti a _Megtisztítás_ varázslatot, amely _eltávolítja a negatív státuszhatásokat_ a Klerikusról és a közeli szövetségeseiről, és _10 pajzsot ad nekik_ 2 töltet áráért.\n\n_+2:_ A Klerikus elsütheti a _Megtisztítás_ varázslatot, amely _3 körös negatív státuszimmunitást ad_ a Klerikusnak és a közeli szövetségeseinek, és _20 pajzsot ad nekik_ 2 töltet áráért.\n\n_+3:_ A Klerikus elsütheti a _Megtisztítás_ varázslatot, amely _5 körös negatív státuszimmunitást ad_ a Klerikusnak és a közeli szövetségeseinek, és _30 pajzsot ad nekik_ 2 töltet áráért.
actors.hero.talent.cleanse.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg,_ akkor ehelyett a hős negatív státuszhatásait semlegesíti egy pálca vagy ereklye használata után, az esetek 10/20/30%-ában +1/+2/+3 erősítéssel.
actors.hero.talent.cleanse.title=tisztít
actors.hero.talent.cleave.desc=_+1:_ A Gladiátor ölésre fordított extra ideje _30 körre_ nő, a korábbi 15-ről.\n\n_+2:_ A Gladiátor ölésre fordított extra ideje _45 körre_ nő, a korábbi 15-ről.\n\n_+3:_ A Gladiátor ölésre fordított extra ideje _60 körre_ nő, a korábbi 15-ről.
actors.hero.talent.cleave.title=hasít
actors.hero.talent.cloned_armor.desc=_+1:_ Az árnyékklón a hős páncélértékének _12%-át_ nyeri, és _25% esélye van_ arra, hogy a hős páncélján lévő jelet használja.\n\n_+2:_ Az árnyékklón a hős páncélértékének _24%-át_ nyeri, és _50% esélye van_ arra, hogy a hős páncélján lévő jelet használja.\n\n_+3:_ Az árnyékklón a hős páncélértékének _36%-át_ nyeri, és _75% esélye van_ arra, hogy a hős páncélján lévő jelet használja.\n\n_+4:_ Az árnyékklón a hős páncélértékének _48%-át_ nyeri, és _100% esélye van_ arra, hogy a hős páncélján lévő jelet használja.
actors.hero.talent.cloned_armor.title=klónozott páncél
actors.hero.talent.close_the_gap.desc=_+1:_ A Párbajozó _legfeljebb két mezőt_ pislog a célpontja felé párbaj indításakor.\n\n_+2:_ A Párbajozó _legfeljebb három mezőt_ pislog a célpontja felé párbaj indításakor.\n\n_+3:_ A Párbajozó _legfeljebb négy mezőt_ pislog a célpontja felé párbaj indításakor.\n\n_+4:_ A Párbajozó _legfeljebb öt mezőt_ pislog a célpontja felé párbaj indításakor.\n\nEz a pislogás áthatolhat veszélyeken és ellenségeken, de szilárd terepen, például falakon nem. A pislogást figyelembe veszi a rendszer annak megállapításakor, hogy egy ellenség a kihívás hatótávolságán belül van-e.
actors.hero.talent.close_the_gap.title=áthidalni a szakadékot
actors.hero.talent.combined_energy.desc=_+1:_ Ha a Szerzetes 5 körön belül egy fegyverképességet és egy _4+ energia_ képességet használ, akkor 1 elhasznált energiát nyer vissza.\n\n_+2:_ Ha a Szerzetes 5 körön belül egy fegyverképességet és egy _3+ energia_ képességet használ, akkor 1 elhasznált energiát nyer vissza.\n\n_+3:_ Ha a Szerzetes 5 körön belül egy fegyverképességet és egy _2+ energia_ képességet használ, akkor 1 elhasznált energiát nyer vissza.
actors.hero.talent.combined_energy.title=kombinált energia
actors.hero.talent.combined_lethality.desc=_+1:_ Ha a Bajnok közelharci fegyverrel támad közvetlenül egy másik fegyver képességének használata után, a támadás kivégzi az összes nem főellenséget, akinek _HP-je 13% alatt van_.\n\n_+2:_ Ha a Bajnok közelharci fegyverrel támad közvetlenül egy másik fegyver képességének használata után, a támadás kivégzi az összes nem főellenséget, akinek _HP-je 27% alatt van_.\n\n_+3:_ Ha a Bajnok közelharci fegyverrel támad közvetlenül egy másik fegyver képességének használata után, a támadás kivégzi az összes nem főellenséget, akinek _HP-je 40% alatt van_.\n\nEz a támadás lehet egy normál közelharci fegyveres támadás, vagy egy fegyver képességének része.
actors.hero.talent.combined_lethality.title=kombinált halálozási arány
actors.hero.talent.conserved_magic.desc=_+1:_ Minden vadmágiából származó zap mostantól _0,33 töltetet_ használ 0,5 helyett, és a vadmágiából _25% esély_ van arra, hogy ne töltsön el egy kört sem.\n\n_+2:_ Minden vadmágiából származó zap mostantól _0,225 töltetet_ használ 0,5 helyett, és a vadmágiából _50% esély_ van arra, hogy ne töltsön el egy kört sem.\n\n_+3:_ Minden vadmágiából származó zap mostantól _0,15 töltetet_ használ 0,5 helyett, és a vadmágiából _75% esély_ van arra, hogy ne töltsön el egy kört sem.\n\n_+4:_ Minden vadmágiából származó zap mostantól _0,1 töltetet_ használ 0,5 helyett, és a vadmágiából _100% esély_ van arra, hogy ne töltsön el egy kört sem.
actors.hero.talent.conserved_magic.title=konzervált mágia
actors.hero.talent.counter_ability.desc=_+1:_ Ha a Párbajozó az utóképének támadását követő 3 körön belül fegyverképességet használ, azonnal _0,38 töltetet_ kap vissza.\n\n_+2:_ Ha a Párbajozó az utóképének támadását követő 3 körön belül fegyverképességet használ, azonnal _0,77 töltetet_ kap vissza.\n\n_+3:_ Ha a Párbajozó az utóképének támadását követő 3 körön belül fegyverképességet használ, azonnal _1,13 töltetet_ kap vissza.\n\n_+4:_ Ha a Párbajozó az utóképének támadását követő 3 körön belül fegyverképességet használ, azonnal _1,5 töltetet_ kap vissza.
actors.hero.talent.counter_ability.title=ellenképesség
actors.hero.talent.deadly_followup.desc=_+1:_ Amikor a Párbajozó dobófegyverrel talál el egy ellenséget, _10%-kal több közelharci sebzést_ okoz neki 5 körön keresztül.\n\n_+2:_ Amikor a Párbajozó dobófegyverrel talál el egy ellenséget, _20%-kal több közelharci sebzést_ okoz neki 5 körön keresztül.\n\n_+3:_ Amikor a Párbajozó dobófegyverrel talál el egy ellenséget, _30%-kal több közelharci sebzést_ okoz neki 5 körön keresztül.
actors.hero.talent.deadly_followup.title=halálos folytatás
actors.hero.talent.deathless_fury.desc=_+1:_ A Berserk automatikusan aktiválódik, ha a Berserker halálra készül, és a dühe eléri vagy meghaladja a 100%-ot, de _3 hősszint_ van a töltési ideje, amikor ez megtörténik.\n\n_+2:_ A Berserk automatikusan aktiválódik, ha a Berserker halálra készül, és a dühe eléri vagy meghaladja a 100%-ot, de _2 hősszint_ van a töltési ideje, amikor ez megtörténik.\n\n_+3:_ A Berserk automatikusan aktiválódik, ha a Berserker halálra készül, és a dühe eléri vagy meghaladja a 100%-ot, de _1 hősszint_ van a töltési ideje, amikor ez megtörténik.\n\nMegjegyzendő, hogy a Berserker akkor is meghal, ha 0 HP-ja van a dühöngés végén.
actors.hero.talent.deathless_fury.title=halhatatlan düh
actors.hero.talent.deathly_durability.desc=_+1:_ A haláljel által megölt ellenfelek megjelölt életpontjuk _13%-ának megfelelő védelmet nyújtanak a Zsiványnak.\n\n_+2:_ A haláljel által megölt ellenfelek megjelölt életpontjuk _25%-ának megfelelő védelmet nyújtanak a Zsiványnak.\n\n_+3:_ A haláljel által megölt ellenfelek megjelölt életpontjuk _38%-ának megfelelő védelmet nyújtanak a Zsiványnak.\n\n_+4:_ A haláljel által megölt ellenfelek megjelölt életpontjuk _50%-ának megfelelő védelmet nyújtanak a Zsiványnak.
actors.hero.talent.deathly_durability.title=halálos tartósság
actors.hero.talent.desperate_power.desc=_+1:_ A Mágus pálcái és botja _+1 szintet_ kapnak az utolsó rohamukkor, amikor már csak az utolsó töltetük van.\n\n_+2:_ A Mágus pálcái és botja _+2 szintet_ kapnak az utolsó rohamukkor, amikor már csak az utolsó töltetük van.\n\n_+3:_ A Mágus pálcái és botja _+3 szintet_ kapnak az utolsó rohamukkor, amikor már csak az utolsó töltetük van.
actors.hero.talent.desperate_power.title=kétségbeesett hatalom
actors.hero.talent.directed_power.desc=_+1:_ Az elementális csapásból származó közvetlen támadás _+30% varázserőt_ nyer minden ellenfél után az elementális csapás hatótávolságán belül, beleértve a célpontot is.\n\n_+2:_ Az elementális csapásból származó közvetlen támadás _+60% varázserőt_ nyer minden ellenfél után az elementális csapás hatótávolságán belül, beleértve a célpontot is.\n\n_+3:_ Az elementális csapásból származó közvetlen támadás _+90% varázserőt_ nyer minden ellenfél után az elementális csapás hatótávolságán belül, beleértve a célpontot is.\n\n_+4:_ Az elementális csapásból származó közvetlen támadás _+120% varázserőt_ nyer minden ellenfél után az elementális csapás hatótávolságán belül, beleértve a célpontot is.
actors.hero.talent.directed_power.title=irányított erő
actors.hero.talent.divine_intervention.desc=_+1:_ Felemelkedett Formában a Klerikus használhatja az _Isteni Beavatkozást_, ami _150-es pajzsmal növeli a Klerikus és minden szövetségese _3 körrel való pajzsát_, és _3 körrel meghosszabbítja a Felemelkedett Formát._\n\n_+2:_ Felemelkedett Formában a Klerikus használhatja az _Isteni Beavatkozást_, ami _200-as pajzsmal növeli a Klerikus és minden szövetségese _4 körrel való pajzsát_, és _4 körrel meghosszabbítja a Felemelkedett Formát._\n\n_+3:_ Felemelkedett Formában a Klerikus használhatja az _Isteni Beavatkozást_, ami _250-es pajzsmal növeli a Klerikus és minden szövetségese _5 körrel való pajzsát_, és _5 körrel meghosszabbítja a Felemelkedett Formát._\n\n_+4:_ Felemelkedett Formában a Klerikus használhatja az _Isteni Beavatkozást_, ami növeli a Pap és minden szövetségese _300-as pajzsmal_ növeli az Felemelkedett Formáját, és _6 körrel meghosszabbítja azt._\n\nAz Isteni Beavatkozás hatalmas, 5 kötetes töltetbe kerül, és ugyanabban a felemelkedett formában csak egyszer lehet elsütni.
actors.hero.talent.divine_intervention.title=isteni beavatkozás
actors.hero.talent.divine_sense.desc=_+1:_ A Klerikus elsütheti az _Isteni Érzéket_, egy olyan varázslatot, amely _8 mezőt_ ad neki 50 körre, és idő nélkül megsütheti, 2 töltet áráért.\n\n_+2:_ A Klerikus elsütheti az _Isteni Érzéket_, egy olyan varázslatot, amely _12 mezőt_ ad neki 50 körre, és idő nélkül megsütheti, 2 töltet áráért.
actors.hero.talent.divine_sense.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett egy rövid pillanatra elméjének látást biztosít számára, miután egy 3 mezőnyi hatótávolságú pálcát vagy tárgyat használt +1-gyel vagy 5 mezőnyit +2-vel.
actors.hero.talent.divine_sense.title=isteni érzék
actors.hero.talent.double_jump.desc=_+1:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, az ugrás töltetköltsége _16%-kal csökken_.\n\n_+2:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, az ugrás töltetköltsége _30%-kal csökken_.\n\n_+3:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, az ugrás töltetköltsége _40%-kal csökken_.\n\n_+4:_ Ha a harcos 3 körön belül egy második ugrást hajt végre, az ugrás töltetköltsége _50%-kal csökken_.
actors.hero.talent.double_jump.title=dupla ugrás
actors.hero.talent.double_mark.desc=_+1:_ Egy második célpont megjelölése az elsővel egy időben _30%-kal_ csökkentett_ töltényköltséggel jár.\n\n_+2:_ Egy második célpont megjelölése az elsővel egy időben _50%-kal_ csökkentett_ töltényköltséggel jár.\n\n_+3:_ Egy második célpont megjelölése az elsővel egy időben _65%-kal_ csökkentett_ töltényköltséggel jár.\n\n_+4:_ Egy második célpont megjelölése az elsővel egy időben _75%-kal_ csökkentett_ töltényköltséggel jár.
actors.hero.talent.double_mark.title=dupla jegy
actors.hero.talent.durable_projectiles.desc=_+1:_ A dobófegyverek _+50%-os tartóssággal_ rendelkeznek, ha a Vadásznő használja őket.\n\n_+2:_ A dobófegyverek _+75%-os tartóssággal_ rendelkeznek, ha a Vadásznő használja őket.
