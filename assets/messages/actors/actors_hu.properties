actors.hero.talent.expose_weakness.desc=_+1:_ A Párbajozó utóképét támadó ellenségek _2 körre_ gyengévé és sebezhetővé válnak.\n\n_+2:_ A Párbajozó utóképét támadó ellenségek _4 körre_ gyengévé és sebezhetővé válnak.\n\n_+3:_ A Párbajozó utóképét támadó ellenségek _6 körre_ gyengévé és sebezhetővé válnak.\n\n_+4:_ A Párbajozó utóképét támadó ellenségek _8 körre_ gyengévé és sebezhetővé válnak.
