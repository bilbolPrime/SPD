actors.mobs.mob.wandering=%s vándorol
actors.mobs.elemental.desc=A kóbor tűzelementálok nagyobb hatalmú lények megidézésének melléktermékei. Természetük annyira zabolátlan, hogy még a leghatalmasabb démonológus sem képes uralni őket.
actors.mobs.elemental.name=tűzelementál
actors.mobs.king.desc=A törpök utolsó királya híres volt az élet és a halál titkainak mély ismeretéről. Rávette udvartartását, hogy vegyenek részt egy örök fiatalságot ígérő szertartáson. Végül csak ő kapta meg — és mellé egy élőholt sereget is.
actors.mobs.king.name=Törpök Királya
actors.mobs.npcs.bee.desc=Kis termetük ellenére az aranyméhek elszántan védik gazdájukat. Az életük viszont rövid.
actors.mobs.npcs.bee.name=arany méh
actors.mobs.shielded.desc=A vadállatok a gnollok legnagyobb, legerősebb és legszívósabb tagjai. Súlyos sérülésektől dührohamot kapnak, és még nagyobbat sebeznek az ellenségeiken.
actors.mobs.shielded.name=pajzsos vadállat
actors.mobs.yog.desc=Yog-Dzewa egy Öreg Isten, egy hatalmas entitás a káosz birodalmából. Egy évszázaddal ezelőtt az ősi törpök alig győzték le a háborút a démonok serege ellen, de magát az istent sem tudták megölni. Ehelyett bebörtönözték a városuk alatti csarnokokban, abban a hitben, hogy túl gyenge ahhoz, hogy valaha is feltámadjon.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s egy _%s_-t hord magánál. Nyilvánvalóan lopott.
actors.buffs.armorevasion.name=Fokozott kitérés
actors.mobs.king.defeated=Nem ölhetsz meg engem, %s... én... halhatatlan vagyok...
