actors.hero.talent.fan_of_blades.desc=_+1:_ A spektrális pengék akár _1 további célpontot_ is eltalálhatnak 50% sebzést okozva. A célpontnak láthatónak és egy _30 fokos_ kúpon belül kell lennie a hatókörében.\n\n_+2:_ A spektrális pengék akár _2 további célpontot_ is eltalálhatnak 50% sebzést okozva. A célpontoknak láthatónak és egy _60 fokos_ kúpon belül kell lenniük a hatókörében.\n\n_+3:_ A spektrális pengék akár _3 további célpontot_ is eltalálhatnak 50% sebzést okozva. A célpontoknak láthatónak és egy _90 fokos_ kúpon belül kell lenniük a hatókörében.\n\n_+4:_ A spektrális pengék akár _4 további célpontot_ is eltalálhatnak 50% sebzést okozva. A célpontoknak láthatónak és egy _120 fokos_ kúpon belül kell lenniük a hatókörében.
actors.hero.talent.fan_of_blades.title=pengéjű ventilátor
actors.hero.talent.farsight.desc=_+1:_ A mesterlövész látótávolsága _25%-kal_ megnőtt.\n\n_+2:_ A mesterlövész látótávolsága _50%-kal_ megnőtt.\n\n_+3:_ A mesterlövész látótávolsága _75%-kal_ megnőtt.
actors.hero.talent.farsight.title=távollátás
actors.hero.talent.fear_the_reaper.desc=_+1:_ Amikor egy haláljelölt ellenség eléri a 0 életerőt, _megnyomorodik_.\n\n_+2:_ Amikor egy haláljelölt ellenség eléri a 0 életerőt, _félelem sújtja és megnyomorodik_.\n\n_+3:_ Amikor egy haláljelölt ellenség eléri a 0 életerőt, _félelem sújtja és megnyomorodik_, a 3 mezőn belüli ellenségek pedig _megnyomorodnak_.\n\n_+4:_ Amikor egy haláljelölt ellenség eléri a 0 életerőt, _félelem sújtja és megnyomorodik_, a 3 mezőn belüli ellenségek pedig _félelem sújtja és megnyomorodik_.
actors.hero.talent.fear_the_reaper.title=félj a kaszástól
actors.hero.talent.feigned_retreat.desc=_+1:_ Ha egy ellenség megtámadja a Párbajozó utóképét, _2 kört_ gyorsaságot kap.\n\n_+2:_ Ha egy ellenség megtámadja a Párbajozó utóképét, _4 kört_ gyorsaságot kap.\n\n_+3:_ Ha egy ellenség megtámadja a Párbajozó utóképét, _6 kört_ gyorsaságot kap.\n\n_+4:_ Ha egy ellenség megtámadja a Párbajozó utóképét, _8 kört_ gyorsaságot kap.
actors.hero.talent.feigned_retreat.title=színlelt visszavonulás
actors.hero.talent.fire_everything.desc=_+1:_ A vad mágia mostantól _5-ször_ sül el 4-ről, és minden pálca _25% esélye_ van arra, hogy 3-szor használható.\n\n_+2:_ A vad mágia mostantól _6-szor_ sül el 4-ről, és minden pálca _50% esélye_ van arra, hogy 3-szor használható.\n\n_+3:_ A vad mágia mostantól _7-szer_ sül el 4-ről, és minden pálca _75% esélye_ van arra, hogy 3-szor használható.\n\n_+4:_ A vad mágia mostantól _8-szor_ sül el 4-ről, és minden pálca _100% esélye_ van arra, hogy 3-szor használható.
actors.hero.talent.fire_everything.title=mindent kilőni
actors.hero.talent.flash.desc=_+1:_ Felemelkedett formában a Klerikus a _Villanás_ képességgel akár _3 mező_ távolságra teleportálhat.\n\n_+2:_ Felemelkedett formában a Klerikus a _Villanás_ képességgel akár _4 mező_ távolságra teleportálhat.\n\n_+3:_ Felemelkedett formában a Klerikus a _Villanás_ képességgel akár _5 mező_ távolságra teleportálhat.\n\n_+4:_ Felemelkedett formában a Klerikus a _Villanás_ képességgel akár _6 mező_ távolságra teleportálhat.\n\nA Villám kezdetben 2 kötet töltetbe kerül, és további 1 töltetbe kerül minden egyes felhasználásért ugyanabban a felemelkedett formában.
actors.hero.talent.flash.title=vaku
actors.hero.talent.focused_meal.desc=_+1:_ Az étel evése 1 kört vesz igénybe a Párbajozó számára, és _0,67 töltetet_ ad a fegyvereire.\n\n_+2:_ Az étel evése 1 kört vesz igénybe a Párbajozó számára, és _1 töltetet_ ad a fegyvereire.
actors.hero.talent.focused_meal.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor a következő találatára bónusz sebzést ad, amely megegyezik a 3. szintjével +1-nél, vagy a 2. szintjével +2-nél.
actors.hero.talent.focused_meal.title=fókuszált étkezés
actors.hero.talent.followup_strike.desc=_+1:_ Amikor a Vadásznő íjával vagy dobófegyverével eltalál egy ellenséget, a következő közelharci támadása az adott ellenség ellen _2 bónusz sebzést_ okoz.\n\n_+2:_ Amikor a Vadásznő íjával vagy dobófegyverével eltalál egy ellenséget, a következő közelharci támadása az adott ellenség ellen _3 bónusz sebzést_ okoz.
actors.hero.talent.followup_strike.title=követő sztrájk
actors.hero.talent.go_for_the_eyes.desc=_+1:_ A szellemhéja támadásai _2 körre_ megvakítják az ellenségeket.\n\n_+2:_ A szellemhéja támadásai _5 körre_ megvakítják az ellenségeket.\n\n_+3:_ A szellemhéja támadásai _5 körre_ megvakítják az ellenségeket, és _2 körre_ megbénítják őket.\n\n_+4:_ A szellemhéja támadásai _5 körre_ megvakítják az ellenségeket, és _5 körre_ megbénítják őket.
actors.hero.talent.go_for_the_eyes.title=menj a szemekért
actors.hero.talent.growing_power.desc=_+1:_ A természet erejéből származó támadási és mozgássebesség-növelések _38%-ra és 125%-ra_ nőttek, a korábbi 33%-ról és 100%-ról.\n\n_+2:_ A természet erejéből származó támadási és mozgássebesség-növelések _42%-ra és 150%-ra_ nőttek, a korábbi 33%-ról és 100%-ról.\n\n_+3:_ A természet erejéből származó támadási és mozgássebesség-növelések _46%-ra és 175%-ra_ nőttek, a korábbi 33%-ról és 100%-ról.\n\n_+4:_ A természet erejéből származó támadási és mozgássebesség-növelések _50%-ra és 200%-ra_ nőttek, a korábbi 33%-ról és 100%-ról.
actors.hero.talent.growing_power.title=növekvő erő
actors.hero.talent.hallowed_ground.desc=_+1:_ A Pap elsütheti a _Megszentelt Föld_ varázslatot, amely megszentelje a terepet egy _3x3-as területen_ 20 körig, 2 töltet áráért.\n\n_+2:_ A Pap elsütheti a _Megszentelt Föld_ varázslatot, amely megszentelje a terepet egy _5x5-ös területen_ 20 körig, 2 töltet áráért.\n\n_+3:_ A Pap elsütheti a _Megszentelt Föld_ varázslatot, amely megszentelje a terepet egy _7x7-es területen_ 20 körig, 2 töltet áráért.\n\nElsütésekor a Megszentelt Föld 15 ÉP-vel gyógyítja a szövetségeseket, rövid időre gyökerestül elpusztítja az ellenségeket, és rövid füvet terjeszt. Utána lassan gyógyítja a szövetségeseket, megbénítja az ellenségeket, és véletlenszerűen magas füvet növeszt. A megszentelt föld gyógyítás helyett pajzsot ad a papnak, és tűz pusztítja el.
actors.hero.talent.hallowed_ground.title=szent föld
actors.hero.talent.hasty_retreat.desc=_+1:_ Pislogás után a Gazember _1 kört_ gyorsaságot és láthatatlanságot nyer.\n\n_+2:_ Pislogás után a Gazember _2 kört_ gyorsaságot és láthatatlanságot nyer.\n\n_+3:_ Pislogás után a Gazember _3 kört_ gyorsaságot és láthatatlanságot nyer.\n\n_+4:_ Pislogás után a Gazember _4 kört_ gyorsaságot és láthatatlanságot nyer.
actors.hero.talent.hasty_retreat.title=sietős visszavonulás
actors.hero.talent.hearty_meal.desc=_+1:_ Az étel evése _4 ÉP_-vel gyógyítja a Harcost, ha az életereje 33% vagy az alatt van.\n\n_+2:_ Az étel evése _6 ÉP_-vel gyógyítja a Harcost, ha az életereje 33% vagy az alatt van.
actors.hero.talent.hearty_meal.title=kiadós étkezés
actors.hero.talent.heightened_senses.desc=_+1:_ A Vadásznő tudatállapotot kap a _pozíciójától _2 mezőn belüli karaktereken_.\n\n_+2:_ A Vadásznő tudatállapotot kap a _pozíciójától _3 mezőn belüli_ karaktereken.
actors.hero.talent.heightened_senses.title=fokozott érzékek
actors.hero.talent.heroic_energy.desc=_+1:_ A hős páncélképességének _12%-kal csökkentett_ töltetköltsége van.\n\n_+2:_ A hős páncélképességének _23%-kal csökkentett_ töltetköltsége van.\n\n_+3:_ A hős páncélképességének _32%-kal csökkentett_ töltetköltsége van.\n\n_+4:_ A hős páncélképességének _40%-kal csökkentett_ töltetköltsége van.
actors.hero.talent.heroic_energy.rat_title=ratroikus energia
actors.hero.talent.heroic_energy.title=hősies energia
actors.hero.talent.hold_fast.desc=_+1:_ Amikor a harcos vár, _1-2 páncélt_ kap, és _50%-kal_ lelassítja a kombó- és pajzserősítések gyengülését, amíg mozogni nem kezd.\n\n_+2:_ Amikor a harcos vár, _2-4 páncélt_ kap, és _75%-kal_ lelassítja a kombó- és pajzserősítések gyengülését, amíg mozogni nem kezd.\n\n_+3:_ Amikor a harcos vár, _3-6 páncélt_ kap, és _100%-kal_ lelassítja a kombó- és pajzserősítések gyengülését, amíg mozogni nem kezd.
actors.hero.talent.hold_fast.title=kapaszkodj erősen
actors.hero.talent.holy_intuition.desc=_+1:_ A Klerikus _3 töltet árán elsütheti a _Szent Intuíció_ varázslatot, amely felfedi, hogy egy tárgy átkozott-e._\n\n_+2:_ A Klerikus _2 töltet árán elsütheti a _Szent Intuíció_ varázslatot, amely felfedi, hogy egy tárgy átkozott-e._
actors.hero.talent.holy_intuition.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett lehetővé teszi a hős számára, hogy azonosítsa az átkozott tárgy átokállapotát közvetlenül a felszerelése előtt, az esetek 15%-ában +1-gyel, vagy 25%-ában +2-vel.
actors.hero.talent.holy_intuition.title=szent intuíció
actors.hero.talent.holy_lance.desc=_+1:_ A Pap elsütheti a _Szent Lándzsát,_ egy pusztító varázslatot, amely _30-55 sebzést_ okoz 4 töltet árán.\n\n_+2:_ A Pap elsütheti a _Szent Lándzsát,_ egy pusztító varázslatot, amely _45-83 sebzést_ okoz 4 töltet árán.\n\n_+3:_ A Pap elsütheti a _Szent Lándzsát,_ egy pusztító varázslatot, amely _60-110 sebzést_ okoz 4 töltet árán.\n\nA Szent Lándzsa mindig maximális sebzést okoz a démoni és élőhalott ellenfeleknek. A Szent Lándzsának 30 körös hűlési ideje van, mielőtt újra elsüthető lenne.
actors.hero.talent.holy_lance.title=szent lándzsa
actors.hero.talent.impact_wave.desc=_+1:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellensége _2 mezőt_ hátralökődik, és _25% esélye_ van arra, hogy 5 körre sebezhetővé váljon.\n\n_+2:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellensége _3 mezőt_ hátralökődik, és _50% esélye_ van arra, hogy 5 körre sebezhetővé váljon.\n\n_+3:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellensége _4 mezőt_ hátralökődik, és _75% esélye_ van arra, hogy 5 körre sebezhetővé váljon.\n\n_+4:_ Amikor a harcos ugrás után földet ér, minden szomszédos ellensége _5 mezőt_ hátralökődik, és _100% esélye_ van arra, hogy 5 körre sebezhetővé váljon.
actors.hero.talent.impact_wave.title=becsapódási hullám
actors.hero.talent.improvised_projectiles.desc=_+1:_ A Harcos _2 körre_ megvakíthatja az ellenséget azzal, hogy bármilyen, nem dobófegyver tárgyat dob rá. Ennek 50 körös töltési ideje van. \n\n_+2:_ A Harcos _3 körre_ megvakíthatja az ellenséget azzal, hogy bármilyen, nem dobófegyver tárgyat dob rá. Ennek 50 körös töltési ideje van.
actors.hero.talent.improvised_projectiles.title=rögtönzött lövedékek
actors.hero.talent.inscribed_power.desc=_+1:_ Amikor a Mágus elolvas egy tekercset vagy varázslatot használ, _következő 2 pálcája_ +2 szintet kap.\n\n_+2:_ Amikor a Mágus elolvas egy tekercset vagy varázslatot használ, _következő 3 pálcája_ +2 szintet kap.\n\nA továbbfejlesztett pálcák száma megduplázódik, ha olyan tekercset használsz, amely fejlesztési, átalakítási vagy alkímiai tárgyakat tartalmaz, és amelyeket ezekkel a tekercsekkel kell elkészíteni.\n\nMagasabb mennyiségű alkímiai tárgyak esetén (pl. a legtöbb varázslat) ennek a tehetségnek az aktiválódási esélye az adott tárgy mennyiségének előállítási mennyisége alapján van.
actors.hero.talent.inscribed_power.title=beírt hatalom
actors.hero.talent.inscribed_stealth.desc=_+1:_ A Zsivány _3 környi_ láthatatlanságot kap egy tekercs elolvasása vagy egy varázslat használata után.\n\n_+2:_ A Zsivány _5 környi_ láthatatlanságot kap egy tekercs elolvasása vagy egy varázslat használata után.\n\nA láthatatlanság időtartama megduplázódik, ha fejlesztési tekercset, átalakítási tekercset vagy olyan alkímiai tárgyakat használ, amelyeket ezeknek a tekercseknek a felhasználásával kell elkészíteni.\n\nMagasabb mennyiségű alkímiai tárgyak esetén (pl. a legtöbb varázslat) ennek a tehetségnek az aktiválódási esélye az adott tárgy mennyiségének előállítása alapján van.
actors.hero.talent.inscribed_stealth.title=feliratos lopakodás
actors.hero.talent.invigorating_meal.desc=_+1:_ Az étel evése 1 kört vesz igénybe a Vadásznőtől (a bogyókat azonnal megeszi), és _1 kör sietséget ad neki_.\n\n_+2:_ Az étel evése 1 kört vesz igénybe a Vadásznőtől (a bogyókat azonnal megeszi), és _2 kör sietséget ad neki_.
actors.hero.talent.invigorating_meal.title=élénkítő étkezés
actors.hero.talent.invigorating_victory.desc=_+1:_ Ha a Párbajozó legyőzi a célpontját a párbaj vége előtt, _5 ÉP-t gyógyul plusz a párbaj során elszenvedett sebzés 30%-át_ gyógyul.\n\n_+2:_ Ha a Párbajozó legyőzi a célpontját a párbaj vége előtt, _10 ÉP-t gyógyul plusz a párbaj során elszenvedett sebzés 50%-át_ gyógyul.\n\n_+3:_ Ha a Párbajozó legyőzi a célpontját a párbaj vége előtt, _15 ÉP-t gyógyul plusz a párbaj során elszenvedett sebzés 65%-át_ gyógyul.\n\n_+4:_ Ha a Párbajozó legyőzi a célpontját a párbaj vége előtt, _20 ÉP-t gyógyul plusz a párbaj során elszenvedett sebzés 75%-át_ gyógyul.
actors.hero.talent.invigorating_victory.title=élénkítő győzelem
actors.hero.talent.iron_stomach.desc=_+1:_ Az étel evése 1 kört vesz igénybe a Harcostól, és _75% sebzéstűrést_ biztosít számára evés közben.\n\n_+2:_ Az étel evése 1 kört vesz igénybe a Harcostól, és _100% sebzéstűrést_ biztosít számára evés közben.
actors.hero.talent.iron_stomach.title=vas gyomor
actors.hero.talent.iron_will.desc=_+1:_ A harcos pecsétje által nyújtott pajzs _1-gyel_ nő.\n\n_+2:_ A harcos pecsétje által nyújtott pajzs _2-vel_ nő.
actors.hero.talent.iron_will.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor passzívan biztosítja a Harcos Feltört pecsétjének 1 vagy 2 maximális pajzserősségű változatát.
actors.hero.talent.iron_will.title=vas akarat
actors.hero.talent.judgement.desc=_+1:_ Felemelkedett formában a Klerikus használhatja az _Ítéletet_, amely _10-20 sebzést_ okoz minden látható ellenségnek.\n\n_+2:_ Felemelkedett formában a Klerikus használhatja az _Ítéletet_, amely _15-30 sebzést_ okoz minden látható ellenségnek.\n\n_+3:_ Felemelkedett formában a Klerikus használhatja az _Ítéletet_, amely _20-40 sebzést_ okoz minden látható ellenségnek.\n\n_+4:_ Felemelkedett formában a Klerikus használhatja az _Ítéletet_, amely _25-50 sebzést_ okoz minden látható ellenségnek.\n\nAz Ítélet 3 kötetes töltetbe kerül. Az Ítélet +33% sebzést okoz minden varázslatért, amit a Klerikus a felemelkedett formába lépett, vagy az Ítélet utolsó elsütése óta elsütött.
actors.hero.talent.judgement.title=ítélet
actors.hero.talent.lay_on_hands.desc=_+1:_ A paladin használhatja a _Kézrátétel_ varázslatot, amely azonnal _15 ÉP-vel gyógyít meg egy közeli karaktert,_ vagy _15 pajzsot ad neki,_ 1 töltet áráért.\n\n_+2:_ A paladin használhatja a _Kézrátétel_ varázslatot, amely azonnal _20 ÉP-vel gyógyít meg egy közeli karaktert,_ vagy _20 pajzsot ad neki,_ 1 töltet áráért.\n\n_+3:_ A paladin használhatja a _Kézrátétel_ varázslatot, amely azonnal _25 ÉP-vel gyógyít meg egy közeli karaktert,_ vagy _25 pajzsot ad neki,_ 1 töltet áráért.\n\nA varázslatból származó többletgyógyítás pajzsmá alakul. A Kézrátétel ismételten is elsüthető, de egyszerre nem alkalmazható háromnál több értékű pajzs.
actors.hero.talent.lay_on_hands.title=kézrátétel
actors.hero.talent.lethal_defense.desc=_+1:_ Amikor a Gladiátor kombó mozdulattal megöl egy ellenséget, a feltört pecsétpajzsának töltési ideje _50 körrel csökken_.\n\n_+2:_ Amikor a Gladiátor kombó mozdulattal megöl egy ellenséget, a feltört pecsétpajzsának töltési ideje _100 körrel csökken_.\n\n_+3:_ Amikor a Gladiátor kombó mozdulattal megöl egy ellenséget, a feltört pecsétpajzsának töltési ideje _150 körrel csökken_.\n\nEz a tehetség akár -150 körre is csökkentheti a pajzs töltési idejét, ami azt jelenti, hogy azonnal újra elérhető lesz, miután aktiválták.
actors.hero.talent.lethal_defense.title=halálos védelem
actors.hero.talent.lethal_haste.desc=_+1:_ Amikor a Párbajozó halálos csapást mér egy fegyverképességgel rendelkező ellenségre, _3 kör_ értékű azonnali mozgást kap.\n\n_+2:_ Amikor a Párbajozó halálos csapást mér egy fegyverképességgel rendelkező ellenségre, _5 kör_ értékű azonnali mozgást kap.
actors.hero.talent.lethal_haste.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor normál fegyveres támadásokkal aktiválódik, 100 körös töltési idővel.
actors.hero.talent.lethal_haste.title=halálos sietség
actors.hero.talent.lethal_momentum.desc=_+1:_ Amikor a Harcos fizikai fegyverrel halálos csapást mér egy ellenségre, _67% esélye_ van arra, hogy 0 kört tegyen meg.\n\n_+2:_ Amikor a Harcos fizikai fegyverrel halálos csapást mér egy ellenségre, _100% esélye_ van arra, hogy 0 kört tegyen meg.
actors.hero.talent.lethal_momentum.title=halálos lendület
actors.hero.talent.life_link.desc=A Klerikus 2 töltet árán elsütheti az _Életkapcsolatot_ maga és egy felhatalmazott szövetségese között. Ez a varázslat megosztott sebzést okoz a Pap és szövetségese között, és ha bármelyikre hatással van, a 3. vagy alacsonyabb szintű hasznos papi varázslatok mindkettőre hatással lesznek.\n\n_+1:_ Az Életkapcsolat _10 körig_ tart, és a Sokak Ereje bónuszát _-35%-ra növeli az elszenvedett sebzést._\n\n_+2:_ Az Életkapcsolat _13 körig_ tart, és a Sokak Ereje bónuszát _-40%-ra növeli az elszenvedett sebzést._\n\n_+3:_ Az Életkapcsolat _17 körig_ tart, és a Sokak Ereje bónuszát _-45%-ra növeli az elszenvedett sebzést._\n\n_+4:_ Az Életkapcsolat _20 körig_ tart, és a Sokak Ereje bónuszát _-50%-ra növeli az elszenvedett sebzést._
actors.hero.talent.life_link.title=életkapcsolat
actors.hero.talent.light_cloak.desc=_+1:_ A Zsivány használhatja az árnyékköpenyt, amikor nincs felszerelve, de felszerelés nélkül _25%-os sebességgel_ töltődik újra.\n\n_+2:_ A Zsivány használhatja az árnyékköpenyt, amikor nincs felszerelve, de felszerelés nélkül _50%-os sebességgel_ töltődik újra.\n\n_+3:_ A Zsivány használhatja az árnyékköpenyt, amikor nincs felszerelve, de felszerelés nélkül _75%-os sebességgel_ töltődik újra.
actors.hero.talent.light_cloak.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg,_ akkor az összes ereklye töltési sebességét növeli 7/13/20%-kal +1/+2/+3 szinten.
actors.hero.talent.light_cloak.title=könnyű köpeny
actors.hero.talent.light_reading.desc=_+1:_ A Klerikus használhatja a szent könyvét, amikor nincs felszerelve, de felszerelés nélkül _25%-os sebességgel_ töltődik újra.\n\n_+2:_ A Klerikus használhatja a szent könyvét, amikor nincs felszerelve, de felszerelés nélkül _50%-os sebességgel_ töltődik újra.\n\n_+3:_ A Klerikus használhatja a szent könyvét, amikor nincs felszerelve, de felszerelés nélkül _75%-os sebességgel_ töltődik újra.
actors.hero.talent.light_reading.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg,_ akkor az összes pálca újratöltési sebességét növeli 7/13/20%-kal +1/+2/+3 szinten.
actors.hero.talent.light_reading.title=Könnyű olvasás
actors.hero.talent.lingering_magic.desc=_+1:_ Amikor a Mágus pálcával vagy bottal csap le, a következő fizikai támadása _1-2 bónusz sebzést_ okoz.\n\n_+2:_ Amikor a Mágus pálcával vagy bottal csap le, a következő fizikai támadása _2 bónusz sebzést_ okoz.
actors.hero.talent.lingering_magic.title=elhúzódó varázslat
actors.hero.talent.liquid_agility.desc=_+1:_ Amikor egy bájitalt, főzetet vagy elixírt iszik vagy dob, a Párbajozó _3-szoros kitérővel_ rendelkezik, és _3-szoros pontossággal_ rendelkezik a következő közelharci támadásában 5 körön belül.\n\n_+2:_ Amikor egy bájitalt, főzetet vagy elixírt iszik vagy dob, a Párbajozó _végtelen kitérővel_ rendelkezik, és _végtelen pontossággal_ rendelkezik a következő közelharci támadásában 5 körön belül.\n\nEz a bónusz egy további körre és támadásra érvényes, ha olyan erő-, tapasztalati főzeteket vagy alkímiai tárgyakat használ, amelyeket ezekkel a főzetekkel kell elkészíteni.\n\nMagasabb mennyiségű alkímiai tárgyak (pl. vízfőzet) esetén ennek a tehetségnek az aktiválódási esélye az adott tárgy mennyiségének előállításától függ.
actors.hero.talent.liquid_agility.title=folyékony mozgékonyság
actors.hero.talent.liquid_nature.desc=_+1:_ Amikor a Vadásznő iszik vagy eldob egy főzetet, italt vagy elixírt, _legfeljebb 4 fűlap_ nő ki a környező területen, és a szomszédos ellenségek _1 körre_ megsemmisülnek.\n\n_+2:_ Amikor a Vadásznő iszik vagy eldob egy főzetet, italt vagy elixírt, _legfeljebb 6 fűlap_ nő ki a környező területen, és a szomszédos ellenségek _2 körre_ megsemmisülnek.\n\nA fű mennyisége és a gyökér időtartama megduplázódik, ha olyan erő-, tapasztalati vagy alkímiai tárgyakat használunk, amelyeket ezekkel a főzetekkel kell elkészíteni.\n\nMagasabb mennyiségű alkímiai tárgyak (pl. vízfőzet) esetén ennek a tehetségnek az aktiválódási esélye az adott tárgy mennyiségének előállításától függ.
actors.hero.talent.liquid_nature.title=folyékony természet
actors.hero.talent.liquid_willpower.desc=_+1:_ A harcos _maximális HP-jának 6,5%-át nyeri pajzsban_, amikor iszik vagy eldob egy főzetet, italt vagy elixírt.\n\n_+2:_ A harcos _maximális HP-jának 10%-át nyeri pajzsban_, amikor iszik vagy eldob egy főzetet, italt vagy elixírt.\n\nA pajzs mennyisége megduplázódik, ha olyan erő-, tapasztalati vagy alkímiai tárgyakat használunk, amelyeket ezekből a főzetekből kell készíteni.\n\nMagasabb mennyiségű alkímiai tárgyak (pl. vízfőzet) esetén ennek a tehetségnek az esélye van az adott tárgy mennyiségének előállítására.
actors.hero.talent.liquid_willpower.title=folyékony akaraterő
actors.hero.talent.longrange_warp.desc=_+1:_ A Mágus mostantól _150%-os töltényköltségért_ tud téríteni az emeletek között.\n\n_+2:_ A Mágus mostantól _117%-os töltényköltségért_ tud téríteni az emeletek között.\n\n_+3:_ A Mágus mostantól _83%-os töltényköltségért_ tud téríteni az emeletek között.\n\n_+4:_ A Mágus mostantól _50%-os töltényköltségért_ tud téríteni az emeletek között.\n\n A Mágus nem használhat nagy hatótávolságú térítést egy zárolt emelet elhagyására.
actors.hero.talent.longrange_warp.title=Nagy hatótávolságú Warp
actors.hero.talent.mind_form.desc=A Klerikus 3 töltet árán elsütheti az _Elmeformát_, ami a Szentháromságot egy pálca vagy dobófegyver erejével ruházza fel, amit a Klerikus ebben a menetben használt.\n\n_+1:_ A Szentháromság használatakor a Klerikus a kiválasztott tárgy dobóhatását használja, mintha _+3 lenne._\n\n_+2:_ A Szentháromság használatakor a Klerikus a kiválasztott tárgy dobóhatását használja, mintha _+4 lenne._\n\n_+3:_ A Szentháromság használatakor a Klerikus a kiválasztott tárgy dobóhatását használja, mintha _+5 lenne._\n\n_+4:_ A Szentháromság használatakor a Klerikus a kiválasztott tárgy dobóhatását használja, mintha _+6._\n\nA Szentháromság egyszerre csak egy elmehatással ruházható fel.
actors.hero.talent.mind_form.title=elmeforma
actors.hero.talent.mnemonic_prayer.desc=_+1:_ A Pap elsütheti az _Memónia imát_, egy varázslatot, amely _3 körre_ meghosszabbítja a buffokat/debuffokat egy szövetségesre/ellenségre 1 töltetköltségért.\n\n_+2:_ A Pap elsütheti az _Memónia imát_, egy varázslatot, amely _4 körre_ meghosszabbítja a buffokat/debuffokat egy szövetségesre/ellenségre 1 töltetköltségért.\n\n_+3:_ A Pap elsütheti az _Memónia imát_, egy varázslatot, amely _5 körre_ meghosszabbítja a buffokat/debuffokat egy szövetségesre/ellenségre 1 töltetköltségért.\n\nA mnemonikus ima elsüttetése nem tart sokáig. A mnemonikus ima csak egyszer hosszabbíthatja meg a buffok/debuffok egy adott példányát, és nem hosszabbíthatja meg a páncél képességekből származó buffokat.
actors.hero.talent.mnemonic_prayer.title=emlékeztető ima
actors.hero.talent.monastic_vigor.desc=_+1:_ Ha a szerzetes _100% energiával_ rendelkezik, a képességei felerősödnek.\n\n_+2:_ Ha a szerzetes _80% vagy több energiával_ rendelkezik, a képességei felerősödnek.\n\n_+3:_ Ha a szerzetes _60% vagy több energiával_ rendelkezik, a képességei felerősödnek.\n\nFelerősödve:\n- A Flurry alkalmazza a fegyvered varázslatát\n- A fókusz azonnali\n- A roham +4-gyel növeli a hatótávolságát\n- A Sárkányrúgás +50% sebzést okoz, és a hátralökés és a kábítás hatását alkalmazza az összes szomszédos ellenfélre\n- A meditáció lassan gyógyítja a hiányzó HP 20%-át, és 80% sebzésállóságot biztosít.
actors.hero.talent.monastic_vigor.title=szerzetesi erő
actors.hero.talent.mystical_charge.desc=_+1:_ A botjával való csapás _0,5 kör_ értékű tárgy újratöltést biztosít a csatamágusnak.\n\n_+2:_ A botjával való csapás _1 kör_ értékű tárgy újratöltést biztosít a csatamágusnak.\n\n_+3:_ A botjával való csapás _1,5 kör_ értékű tárgy újratöltést biztosít a csatamágusnak.
actors.hero.talent.mystical_charge.title=misztikus töltés
actors.hero.talent.mystical_meal.desc=_+1:_ Az étel evése 1 kört vesz igénybe a Zsivány számára (azonnal megeszi az ellátmányt), és _3 kört ad neki az ereklye újratöltésére_.\n\n_+2:_ Az étel evése 1 kört vesz igénybe a Zsivány számára (azonnal megeszi az ellátmányt), és _5 kört ad neki az ereklye újratöltésére_.\n\nEz a tehetség nem használható a Bőségszaru újratöltésére.
actors.hero.talent.mystical_meal.title=misztikus étkezés
actors.hero.talent.natures_aid.desc=_+1:_ A Vadásznő 0-2 kéregbőr páncélt kap, ami _3 körönként_ elhalványul, amikor egy növény hatása aktiválódik a látóterében.\n\n_+2:_ A Vadásznő 0-2 kéregbőr páncélt kap, ami _5 körönként_ elhalványul, amikor egy növény hatása aktiválódik a látóterében.
actors.hero.talent.natures_aid.title=a természet segítsége
actors.hero.talent.natures_bounty.desc=_+1:_ A Vadásznő _4 bogyót_ találhat a magas fűben elrejtve, miközben a kazamata következő néhány emeletét fedezi fel.\n\n_+2:_ A Vadásznő _6 bogyót_ találhat a magas fűben elrejtve, miközben a kazamata következő néhány emeletét fedezi fel.\n\nA bogyókat gyorsan elfogyasztjuk, kis mennyiségű jóllakottságot biztosítanak, és tartalmazhatnak egy használható magot.
actors.hero.talent.natures_bounty.title=a természet kincsei
actors.hero.talent.natures_wrath.desc=_+1:_ Amíg a természet ereje aktív, a szellemíj lövéseinek _8% esélye_ van egy véletlenszerű káros növényhatás kiváltására.\n\n_+2:_ Amíg a természet ereje aktív, a szellemíj lövéseinek _17% esélye_ van egy véletlenszerű káros növényhatás kiváltására.\n\n_+3:_ Amíg a természet ereje aktív, a szellemíj lövéseinek _25% esélye_ van egy véletlenszerű káros növényhatás kiváltására.\n\n_+4:_ Amíg a természet ereje aktív, a szellemíj lövéseinek _33% esélye_ van egy véletlenszerű káros növényhatás kiváltására.\n\nA kiváltható növények a következők: vakfű, tűzvirág, jégsapka, bánatmoha és viharszőlő.
actors.hero.talent.natures_wrath.title=a természet haragja
actors.hero.talent.necromancers_minions.desc=_+1:_ Amikor egy lélekkel megjelölt ellenség meghal, a Warlocknak _13% esélye_ van arra, hogy megrontott lidércként keltse fel.\n\n_+2:_ Amikor egy lélekkel megjelölt ellenség meghal, a Warlocknak _27% esélye_ van arra, hogy megrontott lidércként keltse fel.\n\n_+3:_ Amikor egy lélekkel megjelölt ellenség meghal, a Warlocknak _40% esélye_ van arra, hogy megrontott lidércként keltse fel.
actors.hero.talent.necromancers_minions.title=nekromanta csatlósai
actors.hero.talent.patient_strike.desc=_+1:_ Ha a Párbajozó vár a közelharci támadás végrehajtása előtt, _1-2 bónusz sebzést_ okoz.\n\n_+2:_ Ha a Párbajozó vár a közelharci támadás végrehajtása előtt, _2 bónusz sebzést_ okoz.
actors.hero.talent.patient_strike.title=betegsztrájk
actors.hero.talent.perfect_copy.desc=_+1:_ Az árnyékklón a hős maximális életpontjának _10%-át_ nyeri, és azonnal helyet cserélhet a hőssel legfeljebb _1 mező_ távolságra.\n\n_+2:_ Az árnyékklón a hős maximális életpontjának _20%-át_ nyeri, és azonnal helyet cserélhet a hőssel legfeljebb _2 mező_ távolságra.\n\n_+3:_ Az árnyékklón a hős maximális életpontjának _30%-át_ nyeri, és azonnal helyet cserélhet a hőssel legfeljebb _3 mező_ távolságra.\n\n_+4:_ Az árnyékklón a hős maximális életpontjának _40%-át_ nyeri, és azonnal helyet cserélhet a hőssel legfeljebb _4 mező_ távolságra.
actors.hero.talent.perfect_copy.title=tökéletes másolat
actors.hero.talent.point_blank.desc=_+1:_ Amikor a Vadásznő közelharcban használja íját vagy dobófegyverét, akkor _-25% pontossággal rendelkezik,_ a -50% helyett.\n\n_+2:_ Amikor a Vadásznő közelharcban használja íját vagy dobófegyverét, akkor _normál pontossággal rendelkezik,_ a -50% helyett.\n\n_+3:_ Amikor a Vadásznő közelharcban használja íját vagy dobófegyverét, akkor _+25% pontossággal rendelkezik,_ a -50% helyett.\n\nMegjegyzendő, hogy a dobófegyverek vagy a szellemíj mindig +50%-os pontossággal rendelkeznek, ha távolról használják.
actors.hero.talent.point_blank.title=teljesen üres
actors.hero.talent.precise_assault.desc=_+1:_ Amikor a Párbajozó fegyverképességet használ, _2-szeres pontosságot_ kap a következő közelharci támadásánál 5 körön belül.\n\n_+2:_ Amikor a Párbajozó fegyverképességet használ, _5-szörös pontosságot_ kap a következő közelharci támadásánál 5 körön belül.\n\n_+3:_ Amikor a Párbajozó fegyverképességet használ, _végtelen pontosságot_ kap a következő közelharci támadásánál 5 körön belül.
actors.hero.talent.precise_assault.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett a közelharci pontosságot +1-nél 10%-kal, +2-nél 20%-kal, +3-nál pedig 30%-kal növeli.
actors.hero.talent.precise_assault.title=pontos támadás
actors.hero.talent.projectile_momentum.desc=_+1:_ Szabadfutás közben a Szabadfutó _+50% pontosságot és +15% sebzést_ nyer dobófegyverekkel.\n\n_+2:_ Szabadfutás közben a Szabadfutó _+100% pontosságot és +30% sebzést_ nyer dobófegyverekkel.\n\n_+3:_ Szabadfutás közben a Szabadfutó _+150% pontosságot és +45% sebzést_ nyer dobófegyverekkel.
actors.hero.talent.projectile_momentum.title=lövedék lendülete
actors.hero.talent.projecting_blades.desc=_+1:_ A spektrális pengék _+25%-os pontossággal_ rendelkeznek, és akár _2 tömör csempét is behatolhatnak_.\n\n_+2:_ A spektrális pengék _+50%-os pontossággal_ rendelkeznek, és akár _4 tömör csempét is behatolhatnak_.\n\n_+3:_ A spektrális pengék _+75%-os pontossággal_ rendelkeznek, és akár _6 tömör csempét is behatolhatnak_.\n\n_+4:_ A spektrális pengék _+100%-os pontossággal_ rendelkeznek, és akár _8 tömör csempét is behatolhatnak_.
actors.hero.talent.projecting_blades.title=kiálló pengék
actors.hero.talent.protective_shadows.desc=_+1:_ A Zsivány egy pajzsot kap _minden második körben_, amíg láthatatlanná válik, _maximum 3-ig_.\n\n_+2:_ A Zsivány egy pajzsot kap _minden körben_, amíg láthatatlanná válik, _maximum 5-ig_.
actors.hero.talent.protective_shadows.title=védő árnyékok
actors.hero.talent.provoked_anger.desc=_+1:_ Amikor a harcosra alkalmazott bármelyik pajzs erősítés sebzést szenved, a következő fizikai támadása _3 bónusz sebzést_ okoz.\n\n_+2:_ Amikor a harcosra alkalmazott bármelyik pajzs erősítés sebzést szenved, a következő fizikai támadása _5 bónusz sebzést_ okoz.
actors.hero.talent.provoked_anger.title=kiváltott harag
actors.hero.talent.ratforcements.desc=_+1:_ A ratmogrify használatakor _1_ szövetséges erszényes patkányt teremtesz magad mellett.\n\n_+2:_ A ratmogrify használatakor _2_ szövetséges erszényes patkányt teremtesz magad mellett.\n\n_+3:_ A ratmogrify használatakor _3_ szövetséges erszényes patkányt teremtesz magad mellett.\n\n_+4:_ A ratmogrify használatakor _4_ szövetséges erszényes patkányt teremtesz magad mellett.
actors.hero.talent.ratforcements.title=patkányerőszakok
actors.hero.talent.ratlomacy.desc=_+1:_ A ratmogrify használata egy ratmogriffed ellenféllel barátságossá teszi őt, és az átalakulást véglegessé teszi.\n\n_+2:_ A ratmogrify használata egy ratmogriffed ellenféllel barátságossá teszi őt, az átalakulást véglegessé teszi, és _2 kör_ adrenalinlöketet ad neki.\n\n_+3:_ A ratmogrify használata egy ratmogriffed ellenféllel barátságossá teszi őt, az átalakulást véglegessé teszi, és _4 kör_ adrenalinlöketet ad neki.\n\n_+4:_ A ratmogrify használata egy ratmogriffed ellenféllel barátságossá teszi őt, az átalakulást véglegessé teszi, és _6 kör_ adrenalinlöketet ad neki.
actors.hero.talent.ratlomacy.title=patkányság
actors.hero.talent.ratsistance.desc=_+1:_ Az ellenséges, patkánymámorral teli ellenségek _-10% sebzést okoznak_.\n\n_+2:_ Az ellenséges, patkánymámorral teli ellenségek _-19% sebzést okoznak_.\n\n_+3:_ Az ellenséges, patkánymámorral teli ellenségek _-27% sebzést okoznak_.\n\n_+4:_ Az ellenséges, patkánymámorral teli ellenségek _-35% sebzést okoznak_.
actors.hero.talent.ratsistance.title=patkányállóság
actors.hero.talent.reactive_barrier.desc=_+1:_ A Mágus _2,5 pajzsot_ kap minden elemi robbanás által érintett karakterért, maximum 5 karakterig.\n\n_+2:_ A Mágus _5 pajzsot_ kap minden elemi robbanás által érintett karakterért, maximum 6 karakterig.\n\n_+3:_ A Mágus _7,5 pajzsot_ kap minden elemi robbanás által érintett karakterért, maximum 7 karakterig.\n\n_+4:_ A Mágus _10 pajzsot_ kap minden elemi robbanás által érintett karakterért, maximum 8 karakterig.
actors.hero.talent.reactive_barrier.title=reaktív gát
actors.hero.talent.recall_inscription.desc=_+1:_ A Klerikus elsütheti a _Visszahívó Felirat_ varázslatot, amely lehetővé teszi számára, hogy megismételje az utoljára használt rúnakő vagy tekercs hatását _10 körön belül._\n\n_+2:_ A Klerikus elsütheti a _Visszahívó Felirat_ varázslatot, amely lehetővé teszi számára, hogy megismételje az utoljára használt rúnakő vagy tekercs hatását _300 körön belül._\n\nA Visszahívó Felirat nem használható fejlesztendő tekercsekkel. A varázslat töltési költsége attól függ, hogy melyik tárgyat használták legutóbb: 2 egy rúnakőért, 3 egy tekercsért, 4 egy egzotikus tekercsért. Ez a töltési költség megduplázódik, ha transzmutációs tekercssel, vagy olyan alkímiai tárgyakkal használják, amelyeket transzmutációval vagy fejlesztéssel kell elkészíteni.
actors.hero.talent.recall_inscription.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett minden tekercs vagy rúnakő értékét visszatéríti az esetek 10%-ában +1-gyel, vagy az esetek 15%-ában +2-vel. A Fejlesztés tekercsek mentesülnek ettől a hatástól.
actors.hero.talent.recall_inscription.refunded=A terméket visszatérítettük!
actors.hero.talent.recall_inscription.title=visszahívási felirat
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Amikor a Vadásznő rövid fűre vagy parázsra lép, az magas fűbe ugrik, amit a Vadásznő azonnal megszánt. Ennek _10 körös töltési ideje van_.\n\n_+2:_ Amikor a Vadásznő rövid fűre vagy parázsra lép, az magas fűbe ugrik, amit a Vadásznő azonnal megszánt. Ennek _5 körös töltési ideje van_.\n\nEz a tehetség megszántott füvet eredményez, ha a passzív regenerációs hatások le vannak tiltva, vagy a hős hosszú ideje nem szerzett tapasztalati pontot.
actors.hero.talent.rejuvenating_steps.title=fiatalító lépések
actors.hero.talent.remote_beacon.desc=_+1:_ A Mágus _4 mezőn belül bárhová elhelyezhet jeladót_.\n\n_+2:_ A Mágus _8 mezőn belül bárhová elhelyezhet jeladót_.\n\n_+3:_ A Mágus _12 mezőn belül bárhová elhelyezhet jeladót_.\n\n_+4:_ A Mágus _16 mezőn belül bárhová elhelyezhet jeladót_.\n\n A Mágus nem helyezhet jeladókat megközelíthetetlen helyekre.
actors.hero.talent.remote_beacon.title=Távoli jelzőfény
actors.hero.talent.rogues_foresight.desc=_+1:_ Amikor a Zsivány egy titkos szobával rendelkező szinten van, _75% esélye van arra,_ hogy a szint titkot tartalmaz.\n\n_+2:_ Amikor a Zsivány egy titkos szobával rendelkező szinten van, _100% esélye van arra,_ hogy a szint titkot tartalmaz.
actors.hero.talent.rogues_foresight.title=gazember előrelátása
actors.hero.talent.runic_transference.desc=_+1:_ A Harcos feltört pecsétje _normál szimbólumokat_ tud átvinni ugyanúgy, mint egy fejlesztést.\n\n_+2:_ A Harcos feltört pecsétje _normál, erős és átok szimbólumokat_ tud átvinni ugyanúgy, mint egy fejlesztést.\n\n A pecsét csak akkor tud szimbólumokat átvinni, ha azokat a páncélra helyezték, amikor a pecsétet rögzítették.
actors.hero.talent.runic_transference.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor az segít ellenállni a páncélodon lévő szimbólumoknak a fejlesztési tekercsek okozta eltávolításnak. A szimbólumok +1-gyel 6. szintről (4-ről fel) vagy +2-vel 7. szintről (4-ről fel) fejlesztve kezdenek elveszni. A szint, ahol a szimbólumok garantáltan elvesznek, változatlanul +8.
actors.hero.talent.runic_transference.title=rúnaátvitel
actors.hero.talent.satiated_spells.desc=_+1:_ Az étel evése miatt a pap _3 pajzsot_ kap a következő varázslatnál.\n\n_+2:_ Az étel evése miatt a pap _5 pajzsot_ kap a következő varázslatnál.
actors.hero.talent.satiated_spells.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor azonnal pajzsot ad, ami 10 kör után a szokásos módon elkezd gyengülni.
actors.hero.talent.satiated_spells.title=Jóllakott varázslatok
actors.hero.talent.scholars_intuition.desc=_+1:_ A Mágus _3-szor gyorsabban azonosítja a pálcákat_.\n\n_+2:_ A Mágus _amikor használja őket_, azonosítja a pálcákat.
actors.hero.talent.scholars_intuition.title=tudós intuíciója
actors.hero.talent.searing_light.desc=_+1:_ A Pap fizikai támadásai a _Vezetőfény_ által megvilágított ellenfelek ellen _+3 sebzést okoznak._\n\n_+2:_ A Pap fizikai támadásai a _Vezetőfény_ által megvilágított ellenfelek ellen _+5 sebzést okoznak._
actors.hero.talent.searing_light.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett egy pálca vagy ereklye ellenségen való használata után adja a bónusz sebzést, 20 körös hűlési idővel.
actors.hero.talent.searing_light.title=Perzselő fény
actors.hero.talent.seer_shot.desc=_+1:_ Amikor a Vadásznő a földre lő egy nyilat, _5 körre_ látást biztosít egy körülötte lévő 3x3-as területen. Ennek 20 körös töltési ideje van.\n\n_+2:_ Amikor a Vadásznő a földre lő egy nyilat, _10 körre_ látást biztosít egy körülötte lévő 3x3-as területen. Ennek 20 körös töltési ideje van.\n\n_+3:_ Amikor a Vadásznő a földre lő egy nyilat, _15 körre_ látást biztosít egy körülötte lévő 3x3-as területen. Ennek 20 körös töltési ideje van.
actors.hero.talent.seer_shot.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg,_ akkor bármilyen eldobott fegyverrel aktiválódik.
actors.hero.talent.seer_shot.title=látnok lövés
actors.hero.talent.shadow_blade.desc=_+1:_ Az árnyékklón körönként a hős sebzésének _8%-át_ nyeri, és _25% esélye van_ arra, hogy a varázslatot a hős fegyverén használja.\n\n_+2:_ Az árnyékklón körönként a hős sebzésének _16%-át_ nyeri, és _50% esélye van_ arra, hogy a varázslatot a hős fegyverén használja.\n\n_+3:_ Az árnyékklón körönként a hős sebzésének _24%-át_ nyeri, és _75% esélye van_ arra, hogy a varázslatot a hős fegyverén használja.\n\n_+4:_ Az árnyékklón körönként a hős sebzésének _32%-át_ nyeri, és _100% esélye van_ arra, hogy a varázslatot a hős fegyverén használja.
actors.hero.talent.shadow_blade.title=árnyékpenge
actors.hero.talent.shadow_step.desc=_+1:_ Ha a gazember láthatatlan állapotban füstbombát használ, az azonnal megtörténik, és _16%-kal csökkentett_ töltési költséggel jár, de nem vakítja meg az ellenségeket, és nem aktivál más tehetségeket.\n\n_+2:_ Ha a gazember láthatatlan állapotban füstbombát használ, az azonnal megtörténik, és _30%-kal csökkentett_ töltési költséggel jár, de nem vakítja meg az ellenségeket, és nem aktivál más tehetségeket.\n\n_+3:_ Ha a gazember láthatatlan állapotban füstbombát használ, az azonnal megtörténik, és _41%-kal csökkentett_ töltési költséggel jár, de nem vakítja meg az ellenségeket, és nem aktivál más tehetségeket.\n\n_+4:_ Ha a gazember láthatatlan állapotban füstbombát használ, az azonnal megtörténik, és _50%-kal csökkentett_ töltési költséggel jár, de nem vakítja meg az ellenségeket, és nem aktivál más tehetségeket.
actors.hero.talent.shadow_step.title=árnyéklépés
actors.hero.talent.shared_enchantment.desc=_+1:_ A dobófegyvereknek _33% esélyük_ van arra, hogy a mesterlövész íján lévő varázslatot használják.\n\n_+2:_ A dobófegyvereknek _67% esélyük_ van arra, hogy a mesterlövész íján lévő varázslatot használják.\n\n_+3:_ A dobófegyvereknek _100% esélyük_ van arra, hogy a mesterlövész íján lévő varázslatot használják.\n\n Az íj varázslata a dobófegyveren már meglévő varázslaton felül aktiválódhat.
actors.hero.talent.shared_enchantment.title=megosztott varázslat
actors.hero.talent.shared_upgrades.desc=_+1:_ Amikor a mesterlövész fejlesztett dobófegyverrel támad, minden szint 1 körrel növeli a mesterlövész jelének időtartamát és 16%-kal a speciális támadásának sebzését, maximum _2 körre és +33% sebzésre +2_-nél.\n\n_+2:_ Amikor a mesterlövész fejlesztett dobófegyverrel támad, minden szint 1 körrel növeli a mesterlövész jelének időtartamát és 16%-kal a speciális támadásának sebzését, maximum _4 körre és +67% sebzésre +4_-nél.\n\n_+3:_ Amikor a mesterlövész fejlesztett dobófegyverrel támad, minden szint 1 körrel növeli a mesterlövész jelének időtartamát és 16%-kal a speciális támadásának sebzését, maximum _6 körre és +100% sebzésre +6_-nál.
actors.hero.talent.shared_upgrades.title=megosztott fejlesztések
actors.hero.talent.shield_battery.desc=_+1:_ A Mágus pálcával célba veheti önmagát, így minden töltését árnyékolássá alakíthatja, _4%-os maximális életerő/töltés_ sebességgel.\n\n_+2:_ A Mágus pálcával célba veheti önmagát, így minden töltését árnyékolássá alakíthatja, _6%-os maximális életerő/töltés_ sebességgel.
actors.hero.talent.shield_battery.title=pajzs akkumulátor
actors.hero.talent.shield_of_light.desc=_+1:_ A Klerikus elsütheti a _Fénypajzs_ varázslatot, amely azonnal elsüthető, és _2-4 páncélt_ ad neki egy célpont ellen 5 körre, 1 töltet áráért.\n\n_+2:_ A Klerikus elsütheti a _Fénypajzs_ varázslatot, amely azonnal elsüthető, és _3-6 páncélt_ ad neki egy célpont ellen 5 körre, 1 töltet áráért.
actors.hero.talent.shield_of_light.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett 1-gyel csökkenti a célzott ellenfél fizikai sebzését, +1-gyel az esetek 33%-ában, +2-vel pedig az esetek 50%-ában.
actors.hero.talent.shield_of_light.title=fénypajzs
actors.hero.talent.shielding_dew.desc=_+1:_ A harmatcseppek megvédhetik az Őrzőt, amikor az életereje tele van, maximum _maximális Életpontjainak 20%-áig_.\n\n_+2:_ A harmatcseppek megvédhetik az Őrzőt, amikor az életereje tele van, maximum _maximális Életpontjainak 40%-áig_.\n\n_+3:_ A harmatcseppek megvédhetik az Őrzőt, amikor az életereje tele van, maximum _maximális Életpontjainak 60%-áig_.
actors.hero.talent.shielding_dew.title=árnyékoló harmat
actors.hero.talent.shock_force.desc=_+1:_ A Lökéshullám _20%-kal több sebzést okoz_ és _25% esélye van a kábításra a megbénítás helyett.\n\n_+2:_ A Lökéshullám _40%-kal több sebzést okoz_ és _50% esélye van a kábításra a megbénítás helyett.\n\n_+3:_ A Lökéshullám _60%-kal több sebzést okoz_ és _75% esélye van a kábításra a megbénítás helyett.\n\n_+4:_ A Lökéshullám _80%-kal több sebzést okoz_ és _100% esélye van a kábításra a megbénítás helyett.
actors.hero.talent.shock_force.title=lökéserő
actors.hero.talent.shrug_it_off.desc=_+1:_ A harcos sebzéscsökkentése kitartás közben _60%-ra_ nőtt 50%-ról.\n\n_+2:_ A harcos sebzéscsökkentése kitartás közben _68%-ra_ nőtt 50%-ról.\n\n_+3:_ A harcos sebzéscsökkentése kitartás közben _74%-ra_ nőtt 50%-ról.\n\n_+4:_ A harcos sebzéscsökkentése kitartás közben _80%-ra_ nőtt 50%-ról.
actors.hero.talent.shrug_it_off.title=lerázza magáról
actors.hero.talent.silent_steps.desc=_+1:_ A Zsivány nem ébreszti fel az alvó ellenségeket, amíg _3 vagy több mezőnyire van tőlük_.\n\n_+2:_ A Zsivány nem ébreszti fel az alvó ellenségeket, amíg _nem mellettük áll_.
actors.hero.talent.silent_steps.title=csendes léptek
actors.hero.talent.soul_eater.desc=_+1:_ A lélekjel _0,33 kör_ jóllakottságot ad minden okozott fizikai sebzésért. A lélekkel jelölt ellenfeleknek _10% esélyük_ van arra, hogy evés közbeni hatásokat váltsanak ki, amikor meghalnak.\n\n_+2:_ A lélekjel _0,67 kör_ jóllakottságot ad minden okozott fizikai sebzésért. A lélekkel jelölt ellenfeleknek _20% esélyük_ van arra, hogy evés közbeni hatásokat váltsanak ki, amikor meghalnak.\n\n_+3:_ A lélekjel _1 kör_ jóllakottságot ad minden okozott fizikai sebzésért. A lélekkel jelölt ellenfeleknek _30% esélyük_ van arra, hogy evés közbeni hatásokat váltsanak ki, amikor meghalnak.
actors.hero.talent.soul_eater.title=lélekevő
actors.hero.talent.soul_siphon.desc=_+1:_ Más karakterek által okozott fizikai sebzés _13%-os hatékonysággal aktiválja a Warlock lélekjelét_.\n\n_+2:_ Más karakterek által okozott fizikai sebzés _27%-os hatékonysággal aktiválja a Warlock lélekjelét_.\n\n_+3:_ Más karakterek által okozott fizikai sebzés _40%-os hatékonysággal aktiválja a Warlock lélekjelét_.
actors.hero.talent.soul_siphon.title=lélek szifon
actors.hero.talent.speedy_stealth.desc=_+1:_ A Szabadonfutó láthatatlan állapotban körönként 2 lendületjelzőt kap.\n\n_+2:_ A +1 előnyei mellett a szabadfutás mostantól nem számol vissza, amíg a Szabadonfutó láthatatlan.\n\n_+3:_ A +1 és +2 előnyei mellett a Szabadonfutó láthatatlan állapotban kétszeres sebességgel mozog, függetlenül attól, hogy szabadonfut-e vagy sem.
actors.hero.talent.speedy_stealth.title=gyors lopakodás
actors.hero.talent.spirit_blades.desc=_+1:_ A Spektrális pengék _30% esélye_ van arra, hogy a varázslatot a szellemíjon is használják.\n\n_+2:_ A Spektrális pengék _60% esélye_ van arra, hogy a varázslatot a szellemíjon is használják.\n\n_+3:_ A Spektrális pengék _90% esélye_ van arra, hogy a varázslatot a szellemíjon is használják.\n\n_+4:_ A Spektrális pengék _100% esélye_ van arra, hogy a varázslatot a szellemíjon is használják, és minden varázslatnak _+10% erőt_ ad.
actors.hero.talent.spirit_blades.title=szellempengék
actors.hero.talent.spirit_form.desc=A Klerikus 4 töltet árán használhatja a _Szellemformát_, ami a Szentháromságot egy általa ebben a körben azonosított gyűrű vagy tárgy erejével ruházza fel (a szent kötet kivételével).\n\n_+1:_ A Szentháromság használatakor a Klerikus gyűrű hatását kapja _+1_ ponton 20 körre, vagy egy tárgy hatását aktiválja _+4_ ponton._\n\n_+2:_ A Szentháromság használatakor a Klerikus gyűrű hatását kapja _+2_ ponton 20 körre, vagy egy tárgy hatását aktiválja _+6_ ponton._\n\n_+3:_ A Szentháromság használatakor a Klerikus gyűrű hatását kapja _+3_ ponton 20 körre, vagy egy tárgy hatását aktiválja _+8._\n\n_+4:_ A Trinity használatakor a Klerikus _+4_ lépésben 20 körre megkapja egy gyűrű hatását, vagy _+10 lépésben aktiválja egy tárgy hatását._\n\nA Trinity egyszerre csak egy szellemhatással ruházható fel. Az ereklyéknek változó hatásai és páncélköltségeik vannak, amikor a Trinity aktiválja őket.
actors.hero.talent.spirit_form.title=szellemforma
actors.hero.talent.stasis.desc=A Klerikus 2 töltet árán varázsolhat _Sztázist_ egy felerősödött szövetségesre. A Sztázis ideiglenesen eltávolítja a szövetségest a kazamatából, és megőrzi a fennmaradó időt az összes erősítésnél, beleértve a Sokak Erejét is. A szövetséges újra megjelenik melletted, amikor a hatás véget ér. A Sztázis azonnal és ingyenesen újra varázsolható, hogy a hatás korábban véget vessen. A sztázis a mozdulatlan szövetségesekre hat, de nem tudja őket a kazamata szintjei között mozgatni.\n\n_+1:_ A sztázis maximum _60 körig tart._\n\n_+2:_ A sztázis maximum _90 körig tart._\n\n_+3:_ A sztázis maximum _120 körig tart._\n\n_+4:_ A sztázis maximum _150 körig tart._\n\nA Klerikus a Sugárzó Sugarat is használhatja, amikor egy szövetséges sztázisban van, hogy újraidézze őt, vagy az Életkapcsolatot, hogy megelőző jelleggel alkalmazza a hatását. A szövetségesek azonban nem részesülnek az Életkapcsolat előnyeiből sztázisban.
actors.hero.talent.stasis.title=pangás
actors.hero.talent.strengthening_meal.desc=_+1:_ Az étel evése bónusz sebzést ad a Párbajozó 3-nak a következő _2 alkalommal_, amikor fizikai támadással eltalál egy ellenfelet.\n\n_+2:_ Az étel evése bónusz sebzést ad a Párbajozó 3-nak a következő _3 alkalommal_, amikor fizikai támadással eltalál egy ellenfelet.
actors.hero.talent.strengthening_meal.title=erősítő étkezés
actors.hero.talent.striking_force.desc=_+1:_ Az elementális csapás hatásának ereje _30%-kal_ nő.\n\n_+2:_ Az elementális csapás hatásának ereje _60%-kal_ nő.\n\n_+3:_ Az elementális csapás hatásának ereje _90%-kal_ nő.\n\n_+4:_ Az elementális csapás hatásának ereje _120%-kal_ nő.
actors.hero.talent.striking_force.title=csapásmérő erő
actors.hero.talent.striking_wave.desc=_+1:_ A Lökéshullám _30% esélye_ van arra, hogy találati hatásokat, például varázslatokat és kombókat is használjon.\n\n_+2:_ A Lökéshullám _60% esélye_ van arra, hogy találati hatásokat, például varázslatokat és kombókat is használjon.\n\n_+3:_ A Lökéshullám _90% esélye_ van arra, hogy találati hatásokat, például varázslatokat és kombókat is használjon.\n\n_+4:_ A Lökéshullám _100% esélye_ van arra, hogy találati hatásokat, például varázslatokat és kombókat is használjon, és _+20% erőt_ ad a varázslatoknak.
actors.hero.talent.striking_wave.title=feltűnő hullám
actors.hero.talent.strongman.desc=_+1:_ A harcos ereje _8%-kal_ nő, lefelé kerekítve.\n\n_+2:_ A harcos ereje _13%-kal_ nő, lefelé kerekítve.\n\n_+3:_ A harcos ereje _18%-kal_ nő, lefelé kerekítve.
actors.hero.talent.strongman.title=erős ember
actors.hero.talent.sucker_punch.desc=_+1:_ A Zsivány _1-2 bónusz sebzést_ okoz, amikor először meglepetésszerűen támad egy ellenséget. \n\n_+2:_ A Zsivány _2 bónusz sebzést_ okoz, amikor először támad egy ellenséget.
actors.hero.talent.sucker_punch.title=balekütés
actors.hero.talent.sunray.desc=_+1:_ A Klerikus elsütheti a _Napsugár_ varázslatot, amely _4-8 sebzést okoz_ és _4 körre_ megvakítja a célpontot, 1 töltet árán.\n\n_+2:_ A Klerikus elsütheti a _Napsugár_ varázslatot, amely _6-12 sebzést okoz_ és _6 körre_ megvakítja a célpontot, 1 töltet árán.\n\nA Napsugár csak egyszer vakíthatja meg a célpontokat, de ha a célpontot már megvakította a Napsugár, akkor megbénítja. A Napsugár mindig maximális sebzést okoz a démoni és élőhalott ellenfeleknek.
actors.hero.talent.sunray.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor pálcák és ereklyék fogják megvakítani az ellenfeleket 4 körre, az esetek 15%-ában +1-gyel, vagy 25%-ában +2-vel.
actors.hero.talent.sunray.title=napsugár
actors.hero.talent.survivalists_intuition.desc=_+1:_ A Vadásznő _3-szor gyorsabban azonosítja a dobott fegyvereket_.\n\n_+2:_ A Vadásznő _amikor eltalálja őket_.
actors.hero.talent.survivalists_intuition.title=túlélő intuíciója
actors.hero.talent.sustained_retribution.desc=_+1:_ A Harcos _115% bónusz sebzést_ okoz _2 találatra elosztva_, ahelyett, hogy 100%-os bónusz sebzést okozna 1 találatban.\n\n_+2:_ A Harcos _130% bónusz sebzést_ okoz _3 találatra elosztva_, ahelyett, hogy 100%-os bónusz sebzést okozna 1 találatban.\n\n_+3:_ A Harcos _145% bónusz sebzést_ okoz _4 találatra elosztva_, ahelyett, hogy 100%-os bónusz sebzést okozna 1 találatban.\n\n_+4:_ A Harcos _160% bónusz sebzést_ okoz _5 találatra elosztva_, ahelyett, hogy 100%-os bónusz sebzést okozna 1 találatban.
actors.hero.talent.sustained_retribution.title=tartós megtorlás
actors.hero.talent.swift_equip.desc=_+1:_ A Párbajozó 20 körönként _egyszer_ azonnal lecserélheti a felszerelt fegyverét.\n\n_+2:_ A Párbajozó 20 körönként _kétszer_ azonnal lecserélheti a felszerelt fegyverét.\n\nHa a Párbajozó rendelkezik ezzel a tehetséggel, és az nincs lehűlési időben, akkor egy felszerelt fegyver gyorshasználatával felszerelheti azt.
actors.hero.talent.swift_equip.title=gyors felszerelés
actors.hero.talent.swift_spirit.desc=_+1:_ A szellemsólyom mozgási sebessége 2-ről _2,5 mezőre_ nő, és garantáltan kitér az első _2 ellene irányuló támadást_.\n\n_+2:_ A szellemsólyom mozgási sebessége 2-ről _3 mezőre_ nő, és garantáltan kitér az első _4 ellene irányuló támadást_.\n\n_+3:_ A szellemsólyom mozgási sebessége 2-ről _3,5 mezőre_ nő, és garantáltan kitér az első _6 ellene irányuló támadást_.\n\n_+4:_ A szellemsólyom mozgási sebessége 2-ről _4 mezőre_ nő, és garantáltan kitér az első _8 ellene irányuló támadást_.
actors.hero.talent.swift_spirit.title=gyors szellem
actors.hero.talent.telefrag.desc=_+1:_ Ha a Mágus egy másik karakterré változik, _10-15 sebzést_ okoz neki, de _5 sebzést is szenved_.\n\n_+2:_ Ha a Mágus egy másik karakterré változik, _20-30 sebzést_ okoz neki, de _10 sebzést is szenved_.\n\n_+3:_ Ha a Mágus egy másik karakterré változik, _30-45 sebzést_ okoz neki, de _15 sebzést is szenved_.\n\n_+4:_ Ha a Mágus egy másik karakterré változik, _40-60 sebzést_ okoz neki, de _20 sebzést is szenved_.\n\nA hőst nem lehet megölni ezzel a tehetséggel, az önsebzés csökkenthető a mágia ellenállási hatásaival.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ A Zsivány _2-szer gyorsabban_ azonosítja a gyűrűket, és _amikor felveszi_ a gyűrű típusát.\n\n_+2:_ A Zsivány _amikor felveszi_ a gyűrűket, és _amikor felveszi_ a gyűrű típusát.
actors.hero.talent.thiefs_intuition.title=tolvaj intuíciója
actors.hero.talent.twin_upgrades.desc=_+1:_ Ha a Bajnok két felszerelt fegyvere közül az egyik alacsonyabb szintű és _2 vagy több szinttel alacsonyabb_, mint a másik fegyver, akkor a másik fegyver szintjére lesz felturbózza.\n\n_+2:_ Ha a Bajnok két felszerelt fegyvere közül az egyik alacsonyabb szintű és _1 vagy több szinttel alacsonyabb_, mint a másik fegyver, akkor a másik fegyver szintjére lesz felturbózza.\n\n_+3:_ Ha a Bajnok két felszerelt fegyvere közül az egyik alacsonyabb szintű és _ugyanolyan szintű vagy alacsonyabb_, mint a másik fegyver, akkor a másik fegyver szintjére lesz felturbózza.
actors.hero.talent.twin_upgrades.title=ikerfejlesztések
actors.hero.talent.unencumbered_spirit.desc=_+1:_ A szerzetes _50%-kal több energiát_ nyer minden egyes _3. szintű vagy alacsonyabb_ felszerelésért, amit használ.\n\n_+2:_ A szerzetes _75%-kal több energiát_ nyer minden egyes _2. szintű vagy alacsonyabb_ felszerelésért, amit használ. A 3. szintű előny változatlan marad.\n\n_+3:_ A szerzetes _100%-kal több energiát_ nyer minden egyes _1. szintű vagy alacsonyabb_ felszerelésért, amit használ. A 2. és 3. szintű előnyök változatlanok maradnak. Ezenkívül ingyenes szövetpáncélt és szegecses kesztyűt is kap.\n\nMegjegyzendő, hogy ez a tehetség nem ad előnyt fegyvertelenségből vagy az Erőgyűrűvel való támadásból.
actors.hero.talent.unencumbered_spirit.title=tehermentes szellem
actors.hero.talent.varied_charge.desc=_+1:_ A Bajnok azonnal _0,17 fegyvertöltetet_ kap vissza, amikor két különböző fegyverképességet használ, időkorlát nélkül.\n\n_+2:_ A Bajnok azonnal _0,33 fegyvertöltetet_ kap vissza, amikor két különböző fegyverképességet használ, időkorlát nélkül.\n\n_+3:_ A Bajnok azonnal _0,5 fegyvertöltetet_ kap vissza, amikor két különböző fegyverképességet használ, időkorlát nélkül.
actors.hero.talent.varied_charge.title=változó díj
actors.hero.talent.veterans_intuition.desc=_+1:_ A Harcos _1,75-szer gyorsabban_ azonosítja a fegyvereit és _2,5-szer gyorsabban_ a páncélját.\n\n_+2:_ A Harcos _2,5-szer gyorsabban_ azonosítja a fegyvereit és a _páncélját, amikor _felveszi azt_.
actors.hero.talent.veterans_intuition.title=veterán intuíciója
actors.hero.talent.wall_of_light.desc=_+1:_ A paladin használhatja a _Fényfalat_, egy olyan varázslatot, amely egy _3 mező széles_ tömör falat hoz létre a paladin előtt, ami eltaszítja az ellenségeket, és 20 körig tart, 3 töltet árán.\n\n_+2:_ A paladin használhatja a _Fényfalat_, egy olyan varázslatot, amely egy _5 mező széles_ tömör falat hoz létre a paladin előtt, ami eltaszítja az ellenségeket, és 20 körig tart, 3 töltet árán.\n\n_+3:_ A paladin használhatja a _Fényfalat_, egy olyan varázslatot, amely egy _7 mező széles_ tömör falat hoz létre a paladin előtt, ami eltaszítja az ellenségeket, és 20 körig tart, 3 töltet árán.\n\nA fal kardinálisan vagy átlósan helyezhető el, egyszerre csak egy fal létezhet.
actors.hero.talent.wall_of_light.title=fényfal
actors.hero.talent.wand_preservation.desc=_+1:_ Amikor a Mágus egy új pálcát helyez a botjába, a régi pálca +0-val kerül vissza, _de ez csak egyszer lehetséges._\n\n_+2:_ Amikor a Mágus egy új pálcát helyez a botjába, a régi pálca +0-val kerül vissza, _ez megismételhető egy hősszintnyi lehűlési idővel._
actors.hero.talent.wand_preservation.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor ehelyett 1-gyel növeli a pálcának egy alkímiai edénybe helyezésekor kapott arkángyanta mennyiségét +1-nél, vagy 2-vel +2-nél.
actors.hero.talent.wand_preservation.title=pálca megőrzése
actors.hero.talent.weapon_recharging.desc=_+1:_ A Párbajozó _15 körönként_ kap egy fegyvertöltést, amikor pálca vagy tárgy újratöltő bónuszok hatása alatt áll.\n\n_+2:_ A Párbajozó _10 körönként_ kap egy fegyvertöltést, amikor pálca vagy tárgy újratöltő bónuszok hatása alatt áll.
actors.hero.talent.weapon_recharging.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor +1-gyel való újratöltéskor +5% közelharci sebzést okoz, vagy +2-vel való újratöltéskor +7,5% közelharci sebzést.
actors.hero.talent.weapon_recharging.title=fegyver újratöltés
actors.hero.talent.wide_search.desc=_+1:_ A Zsivány keresési sugarát 5x5-ös négyzetről _7x7-es körre_ növelték.\n\n_+2:_ A Zsivány keresési sugarát 5x5-ös négyzetről _7x7-es négyzetre_ növelték.
actors.hero.talent.wide_search.meta_desc=_Ha ezt a tehetséget egy másik hős szerzi meg_, akkor a keresési sugarát +1-gyel egy 3x3-as négyzetről egy 5x5-ös körre, +2-vel pedig egy 5x5-ös négyzetre növeli.
actors.hero.talent.wide_search.title=széles körű keresés
actors.hero.talent.wild_momentum.desc=_+1:_ Egy ellenség megölése szellemíjjal _1 körrel_ meghosszabbítja a természet erejének időtartamát. Az időtartam maximum _2 körrel_ meghosszabbítható.\n\n_+2:_ Egy ellenség megölése szellemíjjal _2 körrel_ meghosszabbítja a természet erejének időtartamát. Az időtartam maximum _4 körrel_ meghosszabbítható.\n\n_+3:_ Egy ellenség megölése szellemíjjal _3 körrel_ meghosszabbítja a természet erejének időtartamát. Az időtartam maximum _6 körrel_ meghosszabbítható.\n\n_+4:_ Egy ellenség megölése szellemíjjal _4 körrel_ meghosszabbítja a természet erejének időtartamát. Az időtartam maximum _8 körrel_ meghosszabbítható.
actors.hero.talent.wild_momentum.title=vad lendület
actors.hero.talent.wild_power.desc=_+1:_ Vadmágia használatakor a pálcák _2 vagy 3 egységgel erősödnek, maximum +4_-ig.\n\n_+2:_ Vadmágia használatakor a pálcák _3 egységgel erősödnek, maximum +5_-ig.\n\n_+3:_ Vadmágia használatakor a pálcák _3 vagy 4 egységgel erősödnek, maximum +6_-ig.\n\n_+4:_ Vadmágia használatakor a pálcák _4 egységgel erősödnek, maximum +7_-ig.
actors.hero.talent.wild_power.title=vad erő
actors.mobs.acidic.desc=Ezek a hatalmas, pókszerű démoni lények kerülik a közelharcot, inkább nagy távolságból lőnek ki bénító, fűrészes tüskéket. Úgy tűnik, ez a lény maró váladéktól csöpög.
actors.mobs.acidic.name=savas skorpió
actors.mobs.albino.desc=Ez egy ritka erszényes patkányfajta, tiszta fehér szőrzettel és szaggatott fogakkal.
actors.mobs.albino.discover_hint=Ritkán találhatod meg ezt az ellenséget a kazamata egy adott régiójában.
actors.mobs.albino.name=albínó patkány
actors.mobs.armoredbrute.desc=A legidősebb gnoll bestiák gyakran erős páncélt viselnek státuszuk kifejezésére. A páncél sokkal ellenállóbbá teszi ezeket a bestiákat a fizikai sérülésekkel szemben, és nagyobb fegyelmük azt jelenti, hogy sokkal tovább tudnak dühöngeni, mielőtt megadják magukat sebeiknek.
actors.mobs.armoredbrute.name=páncélos bestia
actors.mobs.armoredstatue.desc=Azt gondolnád, hogy csak egy a kazamata élettelen szobrai közül, de a vörösen izzó szemei elárulják.\n\nÚgy tűnik, nagyszerű állapotban van a rajta lévő páncélnak köszönhetően, ami miatt nagyon nehéz lehet megölni.
actors.mobs.armoredstatue.desc_arm_wep=Bár maga a szobor kőből készült, a _%1$s_ és _%2$s_, amiket visel, valóságosnak tűnnek.
actors.mobs.armoredstatue.name=páncélos szobor
actors.mobs.bandit.desc=A kazamata mélyebb szintjei mindig is mindenféle bűnöző rejtekhelyéül szolgáltak. Nem mindegyikük tudott tiszta elmét megőrizni a napfénytől távol töltött hosszabb időszakok alatt. Ezek az őrült tolvajok és banditák régen elfelejtették, kik ők és miért lopnak.
actors.mobs.bandit.name=őrült bandita
actors.mobs.bat.desc=A barlangok fürge és kitartó lakói sokkal veszélyesebbek, mint amilyennek látszanak. Minden sikeres támadással feltöltik az életerejüket, ami lehetővé teszi számukra, hogy sokkal nagyobb ellenfeleket győzzenek le.
actors.mobs.bat.name=vámpírdenevér
actors.mobs.bee.desc=Kis méretük ellenére az aranyméhek hajlamosak vadul védeni otthonukat. Ez a méh nagyon mérges, jobb, ha távol tartod magad tőlük.
actors.mobs.bee.desc_honey=Kis méretük ellenére az aranyméhek hajlamosak hevesen védeni otthonukat. Ez a méh már megnyugodott, és úgy tűnik, követni akar téged.
actors.mobs.bee.discover_hint=Ezt a karaktert egy adott tárggyal találhatod meg.
actors.mobs.bee.name=arany méh
actors.mobs.brute$bruterage.desc=Ez a gnoll bestia haldoklik, de téged is magával akar vinni!\n\nA bestia akkor hal meg, amikor a pajzsa elhasználódik, akár az idő múlása, akár a sérülés miatt. Addig is hatalmas sebzést fog okozni, szóval vigyázz!\n\nMegmaradt pajzs: %d.
actors.mobs.brute$bruterage.name=nyers düh
actors.mobs.brute.def_verb=zárolt
actors.mobs.brute.desc=A vadállatok a gnollok legnagyobb, legerősebb és legszívósabb tagjai. Súlyos sérülésektől dührohamot kapnak, és még nagyobbat sebeznek az ellenségeiken.
actors.mobs.brute.enraged=feldühített
actors.mobs.brute.name=gnoll vadállat
actors.mobs.causticslime.desc=Úgy tűnik, ezt a nyálkát beszennyezte az alulról áradó sötét mágia. Elvesztette szokásos zöld színét, és maró hatású váladéktól csöpög.
actors.mobs.causticslime.discover_hint=Ritkán találhatod meg ezt az ellenséget a kazamata egy adott régiójában.
actors.mobs.causticslime.name=maró nyálka
actors.mobs.crab.desc=Ezek a hatalmas rákok a csatornákban található tápláléklánc csúcsán állnak. Rendkívül gyorsak, és vastag páncéljuk ellenáll a nehéz ütéseknek.
actors.mobs.crab.name=csatornarák
actors.mobs.crystalguardian.def_verb=zárolt
actors.mobs.crystalguardian.desc=Ezek a nagy kristályőrzők szinte szobroknak tűnnek, ha nem lennének a fényesen izzó szemük. A megkeményedett kristály, amiből készültek, lassúvá, de nagyon szívóssá teszi őket, ezért _a legjobb, ha a lehető leghosszabb ideig hagyjuk őket a kristályfészkükben aludni._\n\nMéretük miatt a kristályőrök sokkal lassabban mozognak zárt terekben. Annyira tartósak is, hogy lehetetlen őket egyből megölni. Le lehet őket verni és ideiglenesen megbénítani, de egy kis idő múlva újra talpra állnak.
actors.mobs.crystalguardian.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.crystalguardian.name=kristályőrző
actors.mobs.crystalmimic.ate=A mimika megette a %s-dat!
actors.mobs.crystalmimic.desc=A mimikák mágikus lények, amelyek bármilyen formát felvehetnek. A kazamatákban szinte mindig egy kincsesláda alakját választják, hogy becsalogassák a gyanútlan kalandorokat. A kristálymimikák trükkösebbek, mint a szokásos unokatestvéreik, és a zsákmány ellopása közben inkább kerülik a konfliktusokat. Miután felfedezték őket, megpróbálnak elfutni, és képesek áthelyezni az ellenséget, amikor támadnak.
actors.mobs.crystalmimic.escaped=A kristálymimikáló megszökött!
actors.mobs.crystalmimic.name=kristály utánzó
actors.mobs.crystalspire.alert=A rezgés egyre erősödik és végigdübörög az egész barlangon!
actors.mobs.crystalspire.desc=Ez a gigantikus, ultrakemény kristályból készült torony valószínűleg a barlang összes furcsa kristálylényének a forrása. A szokásos fegyvereid hatástalanok ellene, ezért a csákányodat kell használnod, ha el akarod pusztítani.\n\n_Győződj meg róla, hogy felkészültél, mielőtt elkezded a feltörését._ Egy ilyen nagy kristály kibányászása valószínűleg eltart egy ideig, és valószínűleg nem leszel képes zavartalanul megtenni. Magának a toronynak is lehetnek védekező eszközei._Talán a torony saját támadásait is be lehetne vetni a csatlósai ellen._
actors.mobs.crystalspire.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.crystalspire.name=kristálytorony
actors.mobs.crystalspire.warning=A kristály rezeg, amikor megütöd. Ha ezt folyamatosan fent tartod, biztosan felhívod magadra a figyelmet...
actors.mobs.crystalwisp.beam_kill=A fénysugár megölt téged...
actors.mobs.crystalwisp.desc=Egy apró, dühös, lebegő, megkeményedett kristálydarab, amely fényes fényt bocsát ki. Bár nem különösebben erősek, a kristályrombolók káros fénysugarat lőnek rád, ha tiszta lövésre van szükségük. A rovat elég kicsi ahhoz, hogy könnyen áthaladjon a különböző kristálykibúvásokon, de nem képes átlőni rajtuk.
actors.mobs.crystalwisp.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.crystalwisp.name=kristálycsóva
actors.mobs.demonspawner.desc=Ez a csavarodó törpe húskeverék felelős a démonok létrehozásáért a régióban elpusztult törpökből. A démonok egyértelműen nem látnak problémát abban, hogy minden lehetséges erőforrást bevessenek ellenségeik ellen.\n\nBár vizuálisan félelmetesek, a démonspawnolóknak nincs módjuk mozogni vagy közvetlenül megvédeni magukat. Jelentős tömegük miatt azonban nehéz őket gyorsan megölni, és gyorsabban hozzanak létre démonspawnolókat, ha veszélyben vannak.\n\n_Úgy tűnik, hogy a démonspawnolók valamilyen központi démoni erőforráshoz kapcsolódnak. Megölésük gyengítheti azt._
actors.mobs.demonspawner.name=démonszülő
actors.mobs.demonspawner.on_death=A démoni energia itt csökkenni látszik, ahogy a spawnoló meghal.
actors.mobs.dm100.desc=A DM-100 egy korai törpe „védelmi gép” modell, amelyet a börtön alatti barlangokban élő törpe bányászok védelmére terveztek. Elektromos sokkjaik azonban túl gyengének bizonyultak, ezért ajándékba adták őket a felettük lévő emberi városnak. Évekig nem használták őket, végül a börtönbe kerültek, ahol az őr kezdetben túl kegyetlennek ítélte őket a használatukhoz. Ahogy azonban a foglyok egyre rakoncátlanabbá váltak, nélkülözhetetlenné váltak.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Megölt téged a villámcsapás...
actors.mobs.dm200.desc=A DM-200 a törpe „védelmi gépezet” második generációja, amelyet a barlangokban és az alattuk lévő városban élő törpe bányászok védelmére terveztek. Sokkal nagyobbak és testesebbek, mint elődeik, és pusztító hidraulikus ököllel támadnak. Megnövekedett méretük egyben elsődleges gyengeségük is, mivel nem férnek be a kazamata szűk alagútjaiba és ajtóiba. A törpök képesek voltak kompenzálni a DM-200 mobilitásának hiányát azzal, hogy lehetővé tették számukra, hogy mérgező kipufogógázaikat távoli, vagy általuk el nem érhető ellenségekre fújják.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=A DM-200 mérgező kipufogógáz-sugarat lövell ki!
actors.mobs.dm201.desc=A törpök röviden kísérleteztek azzal, hogy jobban hangsúlyozzák a DM-200 mobilitásának hiányát, és néhány teljesen álló DM modellt is létrehoztak. A DM-201 egy átalakított DM-200, amely őrtoronyként működik, de nem rendelkezik mozgásképességgel. A mobilitás hiánya miatt a DM-201-esek lényegesen nagyobb tartóssággal és támadóerővel rendelkeznek.\n\nMivel a DM-201-eseknek nincs motorjuk, amiből kivezethessék a kipufogógázt, a törpök ehelyett maró gázgránátokkal szerelték fel őket! A DM-201-esek azonban óvatosak ezekkel a gránátokkal, és csak akkor dobálják őket, ha távolról támadják őket.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=A DM-201 egy korrozív gránátot lő ki!
actors.mobs.dm300.charge_lost=VEZETÉKTÁVOLSÁG MEGSEMMISÍTVE! VISSZAÁLLÍTÁS A HELYI ÁRAMHOZ!
actors.mobs.dm300.charging=SÉRÜLÉS! AKTIVÁLÓ ENERGIAPILON!
actors.mobs.dm300.charging_hint=A DM-300 sebezhetetlen, miközben egy villanyoszlop táplálja!
actors.mobs.dm300.def_verb=zárolt
actors.mobs.dm300.defeated=KRITIKUS SÉRÜLÉS! BEKAPCSOLÁSI PRÓBÁLAT
actors.mobs.dm300.desc=Ezt a gépet a törpök építették több évszázaddal ezelőtt. Később a gépeket gólemekkel, elementálokkal, sőt démonokkal kezdték helyettesíteni. Ez végül a civilizációjuk hanyatlásához vezetett. A DM-300 és a hasonló gépek főként építkezésre és bányászatra szolgáltak, de néha a város védelmére is használták őket.
actors.mobs.dm300.desc_supercharged=A DM-300 jelenleg tele van elektromos energiával. Ebben a formában a DM-300 nem sebződik meg, és dupla sebességgel mozog! Ráadásul a fúrója most már elég gyorsan forog ahhoz, hogy _szilárd sziklán fúrjon alagutat,_ bár eközben sokkal lassabban mozog.\n\nA DM-300 közvetlen támadása értelmetlen, amíg fel van töltve, de _valaminek a környéken energiát kell szolgáltatnia neki,_ ami elpusztíthatja, és gyengítheti.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=Illetéktelen személy észlelve!
actors.mobs.dm300.pylons_destroyed=FIGYELEM! INSTABILITÁS ÉRZÉKELVE AZ ELEKTROMOS HÁLÓZATBAN!
actors.mobs.dm300.rankings_desc=A DM-300 összetörte
actors.mobs.dm300.shield=A DM-300 a szabadon lévő vezetékekből nyeri az áramot, és ezzel árnyékolja magát!
actors.mobs.dm300.supercharged=ELPUSZTÍTS! ELPUSZTÍTS! ELPUSZTÍTS!
actors.mobs.dwarfking$dkghoul.rankings_desc=A törpök királya előtt elesett
actors.mobs.dwarfking$dkgolem.rankings_desc=A törpök királya előtt elesett
actors.mobs.dwarfking$dkmonk.rankings_desc=A törpök királya előtt elesett
actors.mobs.dwarfking$dkwarlock.rankings_desc=A törpök királya előtt elesett
actors.mobs.dwarfking.defeated=Mindannyiunkat... vesztére ítéltél...
actors.mobs.dwarfking.desc=Sok évvel ezelőtt a törp udvar egyik legnagyobb varázslója olyan titkokat fedett fel, amelyek óriási hatalmat adtak neki az élet és a halál felett. Hamarosan ezt a hatalmat kamatoztatta, leigázva és megrontva társait, királyát, és végül minden törp polgárt. Most ő a király, uralkodik egy légió élőhalott alattvaló felett. A törpök királya egy agresszív ellenség, aki megpróbálja bekeríteni és elárasztani ellenségeit élőhalott csatlósai hordájával.
actors.mobs.dwarfking.enraged=Nem ölhetsz meg, %s. ÉN. HALHATATLAN VAGYOK!
actors.mobs.dwarfking.lifelink_1=Szükségem van a lényegedre, rabszolga!
actors.mobs.dwarfking.lifelink_2=Vérezz értem, rabszolga!
actors.mobs.dwarfking.losing=Nem! Ezt nem teheted... fogalmad sincs, mi van odalent...
actors.mobs.dwarfking.name=Törpök Királya
actors.mobs.dwarfking.notice=Hogy merészeled! Fogalmad sincs, mibe avatkozol bele!
actors.mobs.dwarfking.rankings_desc=A törpök királya előtt elesett
actors.mobs.dwarfking.teleport_1=Bánj velük, rabszolga!
actors.mobs.dwarfking.teleport_2=Tartsd őket elfoglalva, rabszolga!
actors.mobs.dwarfking.wave_1=Elég! Keljetek fel, rabszolgáim!
actors.mobs.dwarfking.wave_2=Több! Vérezzetek a királyotokért!
actors.mobs.dwarfking.wave_3=Haszontalanok! ÖLJÉTEK MOST!
actors.mobs.ebonymimic.desc=A mimikák mágikus lények, amelyek bármilyen formát felvehetnek. A kazamatákban szinte mindig egy kincsesláda alakját választják, hogy becsalogassák a gyanútlan kalandorokat. Az ébenfa mimikák lopakodó mimikák, akik képesek szinte láthatatlanná tenni magukat. Olyan dolgokon leselkednek, amelyekkel a kalandorok valószínűleg kapcsolatba lépnek, de saját zsákmányt is rejtenek. Nem keményebbek, mint egy sima mimik, ha egyszer felfedezik őket, de meglepetésszerű harapásuk pusztító.
actors.mobs.ebonymimic.discover_hint=Ezt az ellenséget egy adott csecsebecsével találhatod meg.
actors.mobs.ebonymimic.hidden_desc=Úgy tűnik, van itt valami, de szinte teljesen átlátszó.
actors.mobs.ebonymimic.hidden_name=gyanús körvonal
actors.mobs.ebonymimic.name=ébenfa utánzó
actors.mobs.ebonymimic.reveal=Volt ott egy utánzó!
actors.mobs.elemental$chaoselemental.desc=Az elementálok kaotikus lények, amelyek gyakran akkor jönnek létre, amikor az erős okkult mágiát nem kontrollálják megfelelően. Az elementálok minimális intelligenciával rendelkeznek, és általában egy adott típusú mágiához kapcsolódnak. \n\n A káosz elementálok ritka és veszélyes elementálok, amelyek nem stabilizálódtak egy adott elemhez. Támadáskor vad, kiszámíthatatlan mágiát szabadítanak fel.
actors.mobs.elemental$chaoselemental.name=káosz elementális
actors.mobs.elemental$fireelemental.desc=Az elementálok kaotikus lények, amelyek gyakran akkor jönnek létre, amikor az erős okkult mágiát nem megfelelően kontrollálják. Az elementálok minimális intelligenciával rendelkeznek, és általában egy adott típusú mágiához kapcsolódnak. \n\n A tűz elementálok az elementálok egy gyakori típusa, amely tüzes mágiával okoz sebzést. Közelharci támadásokkal lángra lobbantják a célpontjukat, és alkalmanként tűzcsóvákat is képesek lőni.
actors.mobs.elemental$fireelemental.name=tűz elementál
actors.mobs.elemental$frostelemental.desc=Az elementálok kaotikus lények, amelyek gyakran akkor jönnek létre, amikor az erős okkult mágiát nem kontrollálják megfelelően. Az elementálok minimális intelligenciával rendelkeznek, és általában egy adott típusú mágiához kapcsolódnak. A fagyelementálok az elementálok egy gyakori típusa, amelyek dermesztő mágiával gyengítik az ellenségeket. Közelharci és alkalmanként távolsági támadásokkal lehűtik a célpontjukat. Mágiájuk sokkal hatékonyabb vízben.
actors.mobs.elemental$frostelemental.name=fagy elementális
actors.mobs.elemental$newbornfireelemental.charging=Az elementál töltődik!
actors.mobs.elemental$newbornfireelemental.desc=Az elementálok kaotikus lények, amelyek gyakran akkor jönnek létre, amikor az erős okkult mágiát nem kontrollálják megfelelően. Az elementálok minimális intelligenciával rendelkeznek, és általában egy bizonyos típusú mágiához kapcsolódnak. \n\nEz a tűzelementál frissen idézett, de még mindig elég veszélyes!
actors.mobs.elemental$newbornfireelemental.desc_ally=Mivel ezt az elementált varázslattal idézték meg, jobban tudja irányítani a lángját. Nem képes távolsági támadásokat végrehajtani, de közelharcban meggyújtja azokat az ellenfeleket, akiket megtámad.
actors.mobs.elemental$newbornfireelemental.desc_boss=Az idézésének kaotikus természete miatt ez az elementál egy kör rohamozása után csak pontatlan lövésekkel képes tüzet terjeszteni.
actors.mobs.elemental$newbornfireelemental.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.elemental$newbornfireelemental.name=újszülött tűz elementál
actors.mobs.elemental$shockelemental.desc=Az elementálok kaotikus lények, amelyek gyakran akkor jönnek létre, amikor az erős okkult mágiát nem kontrollálják megfelelően. Az elementálok minimális intelligenciával rendelkeznek, és általában egy adott típusú mágiához kapcsolódnak. A sokkelementálok egy kevésbé gyakori elementáltípus, amely elektromossággal és fényvillanásokkal zavarja meg ellenségeit. Közelharcban elektromos ívet küldenek a közeli ellenségeknek, és bónusz sebzést okoznak elsődleges célpontjuknak, ha vízben vannak. Alkalmanként egy távolsági fénycsóvát is fókuszálnak a célpontjukra, ideiglenesen megvakítva őket.
actors.mobs.elemental$shockelemental.name=sokk elemi
actors.mobs.eye.deathgaze_kill=A halálos tekintet megölt téged...
actors.mobs.eye.desc=Ezt a démont a gyűlölet gömbjének is nevezik. Ha ellenséget lát, meggondolatlanul használja halálos pillantását, gyakran a szövetségeseit sem kímélve.
actors.mobs.eye.name=gonosz szem
actors.mobs.fetidrat.desc=Valami egyértelműen nincs rendben ezzel a patkánnyal. Zsíros fekete bundája és rothadó bőre nagyon eltér az egészséges patkányokétól, amiket korábban láttál. Halványzöld szemei különösen fenyegetővé teszik.\n\nA patkány szörnyű bűzfelhőt hordoz magával, közelről lenyűgözően erős.\n\nSötét váladék csöpög a patkány szájából, átrágja magát a padlón, de úgy tűnik, vízben oldódik.
actors.mobs.fetidrat.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.fetidrat.name=büdös patkány
actors.mobs.fungalcore.desc=Ennek az óriási gombának kell lennie a barlang összes gombatevékenységének forrásának.
actors.mobs.fungalcore.name=gombás mag
actors.mobs.fungalsentry.desc=Ez a különösen magas gomba védekezőpontként szolgál a barlangban élő nagyobb gombahálózat számára.\n\nMozdulatlan, de precíz mérgező lövöldéseket lő ki bármire, ami a látóterébe kerül. Bár ezeknek a lövöldözéseknek a hatása meglehetősen gyenge, _nagyon gyorsan halálos mennyiségű mérget tudnak felhalmozni_. Bár elpusztítható, valószínűleg a legjobb elkerülni.
actors.mobs.fungalsentry.name=gombás őrszem
actors.mobs.fungalspinner.desc=Úgy tűnik, hogy ezt a barlangi fonójátékot egy parazita gomba irányítja. A gomba a képességeit is megváltoztatta, hálóját és méregzsákjait gombanövényzet váltotta fel.\n\nA gombafonó háló helyett növényi életet köp rád, gombás vegetációt terjesztve, és potenciálisan gyökeret eresztve benned. Bár nem tud mérgezni, a gombafonó jelentős sebzésállóságra tesz szert, ha gombák közelében van.
actors.mobs.fungalspinner.name=gombás fonó
actors.mobs.ghoul.desc=Ahogy a törpe társadalom lassan összeomlott, és a törpök jelenlegi királya magához ragadta az abszolút hatalmat, a gyengékkel vagy azokkal, akik ellenálltak neki, nem bántak jól. Ahogy a király egyre ügyesebben használta a sötét mágiát, ezeket a törpéket az akarata alá hajtotta, és most ők alkotják seregének gyalogosait.\n\nA szellemek önmagukban nem különösebben erősek, de mindig csoportokban utaznak, és sokkal nehezebb őket nagy számban megölni._Amikor egy szellemet legyőznek, néhány kör után újra feltámad, amíg egy másik szellem a közelben van._
actors.mobs.ghoul.name=törpe kísértet
actors.mobs.gnoll.desc=A gnollok hiénaszerű humanoidok. Csatornákban és kazamatákban élnek, időről időre felmerészkednek, hogy fosztogassák a felszínt. A gnoll felderítők a falkájuk rendszeres tagjai, nem olyan erősek, mint a bestiák, és nem olyan intelligensek, mint a sámánok.
actors.mobs.gnoll.name=gnoll felderítő
actors.mobs.gnollexile.desc=Ennek a szürke szőrű gnollnak egy nagy jel van a vállán, ami száműzöttre utal. A gnollokat általában azért száműzik a társadalmukból, mert figyelmen kívül hagyják a parancsokat vagy megszegik a törvényeket. A száműzötteknek erőseknek és ravaszoknak kell lenniük a túléléshez, ez a gnoll úgy tűnik, tudja, hogyan kell használni a lándzsát, amit a kezében tart.
actors.mobs.gnollexile.desc_aggro=_A gnoll száműzött dühösen körülnéz._ Úgy tűnik, valami mégis a harcra késztette. Vigyázz azzal a lándzsával!
actors.mobs.gnollexile.desc_passive=_A gnoll száműzött nem mozdul támadásra._ Nem tűnik olyan agresszívnek, mint a többi gnoll itt, és valószínűleg nem gondolja úgy, hogy megéri veled harcolni. Hagyhatnád csak úgy a fenébe, de van egy hátizsákja, ami tele lehet hasznos tárgyakkal...
actors.mobs.gnollexile.name=gnoll száműzetés
actors.mobs.gnollexile.seen_aggro=A lándzsát forgató gnoll támadásra indul!
actors.mobs.gnollexile.seen_passive=A lándzsát forgató gnoll gyanakvóan néz rád, de nem mozdul, hogy támadjon.
actors.mobs.gnollgeomancer.alert=A geománus felébred! Az egész barlang elmozdulni látszik, miközben őrülten nevetve elugrik!
actors.mobs.gnollgeomancer.desc=Ez a lenyűgözően magas rangú gnoll lehet a környékbeli földmozgató mágiák forrása, és az összes gnoll tevékenység szervezője. A környékbeli gnoll utászokkal ellentétben a geomancer meglehetősen jártas a mágiájában, és nem sebződik sem a dobott, sem a lehulló szikláktól. Közelharcban azonban nem tud harcolni.
actors.mobs.gnollgeomancer.desc_armor=A geománc jelenleg egy réteg sziklapáncélzattal van körülvéve. _Közel kell menned hozzá, és a csákányoddal le kell törnöd, mielőtt kárt tehetnél benne._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Egy közeli gnoll utász egy olyan eszközt tart a kezében, ami felerősíti a geomanta sziklapáncélját. Most egyáltalán nem fogod tudni megsebesíteni!_
actors.mobs.gnollgeomancer.desc_sleeping=Ez a lenyűgözően magas gnoll sámán egy kőzetréteggel van körülvéve, és szinte szoborra hasonlít. Közelebbről nézve látható, ahogy a szikla varázslatosan mozog az idősebb gnoll légzésének idejében. Amíg ilyen kőzetbe van zárva, nem érheti baja, és úgy tűnik, mintha szó szerint egy földes szunyókálást élvezne.\n\nValószínűleg áttörheted a kőzetrétegeket a csákányoddal, de _győződj meg róla, hogy készen állsz a harcra, amikor ezt teszed._ A geomancernek kell lennie a különféle földmozgató mágiák forrásának errefelé, és az összes gnoll tevékenység szervezőjének. _Jó ötlet lehet legyőzni az itt szétszórt gnollokat, mielőtt harcolnál velük._
actors.mobs.gnollgeomancer.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.rock_kill=A repülő szikla megölt téged...
actors.mobs.gnollgeomancer.rockfall_kill=A hulló sziklák megöltek...
actors.mobs.gnollgeomancer.warning=A geománus mocorogni kezd. Győződj meg róla, hogy készen állsz, mielőtt folytatod!
actors.mobs.gnollguard.def_verb=zárolt
actors.mobs.gnollguard.desc=Egy nagy és kemény külsejű gnoll, aki lándzsát és pajzzsal forgat, de sisak nélkül. Ezek az őrök valószínűleg kiképzett brutális alakok, akiket arra köteleztek, hogy segítsenek megvédeni a bányát a betolakodó vadon élő állatoktól.\n\nA gnoll őr elég erős ahhoz, hogy egy kézben tudja forgatni a lándzsát, de nem tudja jól használni. _Meglehetősen nyílt térre lesz szüksége a távoli támadáshoz, és lényegesen kevesebb sebzést fog okozni, ha közel mész._
actors.mobs.gnollguard.desc_armor=_Egy közeli gnoll utász egy olyan eszközt tart a kezében, amely földpáncélt ad ennek az őrnek, jelentősen csökkentve az általa elszenvedett sebzést._
actors.mobs.gnollguard.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.gnollguard.name=gnoll őr
actors.mobs.gnollguard.spear_warn=A gnoll kegyetlen csapást mér lándzsája hegyével!
actors.mobs.gnollsapper.desc=Egy apró és gyenge, de intelligens gnoll világos szőrrel és egy különféle kütyükkel teli táskával. Valószínűleg azért vannak itt, hogy segítsenek a sötét arany feltárásában és bányászatában, és egy közeli őr is van a védelmükhöz. Képesek harcolni, de a támadásaik szánalmasan gyengék, nem erősebbek, mint egy gnoll felderítőé.\n\nA közvetlen harc helyett az utászok inkább a rendelkezésükre álló különféle kütyüket használják, hogy a sziklás környezetet támadják meg helyettük. Maguk azonban nem ismerik a földmozgató mágiát, ezért valószínűleg meggondolatlanul használják a kütyüket. _Sokféleképpen lehetne felhasználni a támadásaikat ellenük, vagy az őrségük ellen._
actors.mobs.gnollsapper.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.gnollsapper.name=gnoll utász
actors.mobs.gnolltrickster.desc=Furcsa kinézetű teremtmény, még gnoll mércével mérve is. Gonosz vigyorral előregörnyed, szinte ringatja a vállán lógó táskát. Szeme tágra nyílt, furcsa keveréke a félelemnek és az izgalomnak. \n\n A táskájában egy nagy gyűjtemény rosszul elkészített dárda van, amelyek mindegyikének hegye különféle káros anyagokkal van tele.
actors.mobs.gnolltrickster.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.gnolltrickster.name=gnoll szélhámos
actors.mobs.goldenmimic.desc=A mimikák mágikus lények, amelyek bármilyen formát felvehetnek. A kazamatákban szinte mindig egy kincsesláda alakját választják, hogy becsalogassák a gyanútlan kalandorokat.\n\nAz aranymimikák keményebb mimikák, amelyek megpróbálják magukhoz vonzani a legerősebb kalandorokat. Jobb zsákmányuk van, de sokkal erősebbek is, mint a normál mimikák.
actors.mobs.goldenmimic.name=arany utánzó
actors.mobs.golem.def_verb=zárolt
actors.mobs.golem.desc=A törpök a gépekről szerzett tudásukat az elementálok megkötésének újonnan felfedezett erejével próbálták ötvözni. A gólemek géptestébe földszellemeket ültettek lélek gyanánt, mert ezeket tartották a legkönnyebben irányíthatónak. Ennek ellenére a szertartás legapróbb hibája is elszabadíthatta a gólemet.
actors.mobs.golem.name=gólem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=görcsög... görcsög...
actors.mobs.goo.desc=A Ragacsról keveset tudni. Lehet, hogy nem is élőlény, csupán a csatornák anyagainak egyvelege, amelyben kialakult a szabad akarat csírája.
actors.mobs.goo.enraged=feldühített
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.name=Ragacs
actors.mobs.goo.notice=GLÜRP-GLÜRP!
actors.mobs.goo.pumpup=Goo pumpálja magát!
actors.mobs.goo.rankings_desc=Elnyeli a Goo
actors.mobs.greatcrab.def_verb=zárolt
actors.mobs.greatcrab.desc=Ez a rák óriási, még más csatornarákokhoz képest is. Kék páncélját repedések és kagylók borítják, ami nagy korra utal. Lassan mozog, alig tartja egyensúlyát hatalmas karmával.\n\nBár a ráknak csak egy karma van, a mérete könnyen kompenzálja. A rák a karmát minden fenyegetés elé tartja, egy áthatolhatatlan páncélfal mögé bújva. Azonban a rák nem tudja blokkolni a nem látott támadásokat, vagy több ellenség egyidejű támadásait.
actors.mobs.greatcrab.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.greatcrab.name=nagy rák
actors.mobs.greatcrab.noticed=A rák hatalmas karmával blokkol.
actors.mobs.guard.def_verb=zárolt
actors.mobs.guard.desc=A börtön egykori őrei már régen semmiben sem különböznek a raboktól. Zombik módjára csoszognak, agyatlanul bolyonganak a folyosókon, valami oda nem illőt keresve, akárcsak te! \n\n Láncokat hordanak a csípőjükön, valószínűleg arra használják, hogy közel vonzzák az ellenséget.
actors.mobs.guard.name=börtönőr
actors.mobs.guard.scorpion=Gyere ide!
actors.mobs.hermitcrab.def_verb=zárolt
actors.mobs.hermitcrab.desc=Valamiért ez a csatornarák úgy döntött, hogy egy hordó törött felső részét viseli a fején! A plusz súly ugyan visszalassította a normál sebességére, de jóval nagyobb védelmet is biztosított számára. De azt hiszed, hallani fogod, ahogy valami pattog a hordó belsejében...
actors.mobs.hermitcrab.name=remeterák
actors.mobs.mimic.desc=A mimikák mágikus lények, amelyek bármilyen formát felvehetnek. A kazamatákban szinte mindig egy kincsesláda alakját választják, hogy becsalogassák a gyanútlan kalandorokat. A mimikák csúnya harapásúak, de gyakran több kincset rejtenek, mint egy normál láda.
actors.mobs.mimic.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.
actors.mobs.mimic.hidden_hint=Valami nem stimmel ezzel a ládával... Odamenni és megpróbálni kinyitni lehet, hogy rossz ötlet.
actors.mobs.mimic.name=utánzó
actors.mobs.mimic.reveal=Az a mellkas egy utánzó!
actors.mobs.mob.died=Hallod, hogy valami meghal a távolban.
actors.mobs.mob.discover_hint=Ezt az ellenséget a kazamata egy adott régiójában találhatod meg.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Megölte: %s
actors.mobs.monk$focus.desc=Ez a szerzetes tökéletesen figyeli a célpontot, és úgy tűnik, előre látja a mozdulatait, mielőtt azok megteszik azokat.\n\nAmíg fókuszált, a karakter ellen irányuló következő fizikai támadás garantáltan célt téveszt, bármilyen körülmények között is. A támadás hárítása felemészti a szerzetes fókuszát, és újra kell fejlesztenie azt, hogy egy másik támadást is kivédhessen. A szerzetesek gyorsabban építik fel a fókuszt mozgás közben.
actors.mobs.monk$focus.name=összpontosított
actors.mobs.monk.def_verb=zárolt
actors.mobs.monk.desc=Ezek a szerzetesek megszállottan védik városuk titkait minden idegentől. Sem páncélt, sem fegyvert nem használnak, csak a pusztakezes harcban bíznak.
actors.mobs.monk.name=törpe szerzetes
actors.mobs.monk.parried=kivédett
actors.mobs.necromancer$necroskeleton.desc=Ezt a csontvázat egy nekromanta idézte meg. Úgy viselkedik, mint egy átlagos csontváz, és meghal, amikor a megidéző nekromanta meghal.
actors.mobs.necromancer$necroskeleton.name=nekromanta csontváza
actors.mobs.necromancer.desc=Ezek a sötét mágus tanoncok özönlöttek a börtönbe, mivel ez a tökéletes hely gonosz mesterségük gyakorlására. A nekromanták csontvázakat idéznek meg és adnak erőt nekik, hogy harcolhassanak értük. A nekromanta megölése az általa megidézett csontvázat is megöli.
actors.mobs.necromancer.name=nekromanta
actors.mobs.npcs.blacksmith.cant_enter_old=Ez a terület nem elérhető ezen a meneten. Játssz egy új játékot, hogy kipróbáld az új küldetést!
actors.mobs.npcs.blacksmith.def_verb=zárolt
actors.mobs.npcs.blacksmith.desc=Ez a troll kovács úgy néz ki, mint minden troll: magas és sovány, a bőre pedig színében és textúrájában is kőre hasonlít. A troll kovács aránytalanul kicsi szerszámokkal babrál.
actors.mobs.npcs.blacksmith.enter_no=Még nem
actors.mobs.npcs.blacksmith.enter_yes=Kész vagyok
actors.mobs.npcs.blacksmith.entrance_blocked=A lefelé vezető út el van zárva.
actors.mobs.npcs.blacksmith.exit_no=Még nem
actors.mobs.npcs.blacksmith.exit_warn_crystal=Az az óriási kristály még mindig ott lent van. Többet fizetek, ha elpusztítod.
actors.mobs.npcs.blacksmith.exit_warn_full=Kész vagy? Sok aranyad van, de győződj meg róla, hogy nem hagytad ott a felszerelésedet.\n\n_Ne feledd, nem engedlek vissza, ha egyszer feljöttél._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Az az óriási gomba is ott lent van még. Fizetek még, ha megölöd.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Az a gnoll geomancer még mindig ott lent van. Fizetek még, ha megölöd.
actors.mobs.npcs.blacksmith.exit_warn_high=Kész vagy? Úgy tűnik, jó sok aranyad van, de nekem még egy kicsit jobban jönne. _40 darabot kellene szerezned._\n\n_Ne feledd, ha egyszer feljöttél, nem engedlek vissza._
actors.mobs.npcs.blacksmith.exit_warn_low=Már végeztél? Úgy tűnik, nincs sok aranyad. _40 darabot kellene szerezned._\n\n_Ne feledd, ha egyszer feljöttél, nem engedlek vissza._
actors.mobs.npcs.blacksmith.exit_warn_med=Kész vagy? Legalább van egy kis aranyad, de határozottan van még több a bányában. _40 darabot kellene tudnod szerezni._\n\n_Ne feledd, nem engedlek vissza, ha egyszer feljöttél._
actors.mobs.npcs.blacksmith.exit_warn_none=Már végeztél? Alig van egy csepp aranyad sem! _40 darabot kellene szerezned._\n\n_Ne feledd, ha egyszer feljöttél, nem engedlek vissza._
actors.mobs.npcs.blacksmith.exit_yes=Kész vagyok
actors.mobs.npcs.blacksmith.get_lost=El vagyok foglalva. Tűnj el!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Szia Ember! Úgy nézel ki, mint egy fontos ember.
actors.mobs.npcs.blacksmith.intro_quest_crystal=De vigyázz, a bánya veszélyes egy hozzád hasonló apró emberke számára. Egy ideje elhagyatott, és egy csomó kristály kezdett növekedni. Fényesek, de túl törékenyek ahhoz, hogy bármit is érjenek, és van bennük valami varázslatos dolog, ami védi őket. Elég erősek, szóval _vigyázz, hol bányászol_, különben felkelted a figyelmüket.\n\nVan valahol egy _óriáskristály_ is. Sokkal erősebb, szóval készülj fel egy harcra, ha elkezded törni. Fogadok, hogy ha összetöröd, az lelassítja a kristálynövekedést, szóval fizetek érte, ha meg tudod csinálni.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hé, Ember! Bátornak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_fungi=De vigyázz, a bánya veszélyes egy hozzád hasonló kis emberke számára. Valamiféle gombaszörnyeteg nő ott lent. Gombaőrszemek vannak, amik nagyon halálosak, ha meglátnak, de legalább nem tudnak felkelni és üldözőbe venni. _Maradj szem elől_, ha életben akarsz maradni.\n\nPluszt fizetek, ha sikerül legyőznöd a _legnagyobb gombát_, de ehhez komoly erőfeszítésre lesz szükség. Egy csomó micéliumcsomóhoz kapcsolódik, amik a falakban rejtőznek. A legtöbbjüket el kell törnöd, mielőtt igazán kárt tehetnél benne.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=De vigyázz, a bánya veszélyes egy hozzád hasonló kis emberke számára. Néhány gnoll is akarja az aranyat, és most tönkreteszi a helyet. Hülye jószágok, ezért a bányászatuk mindenféle összeomlásokat és beomlásokat okozott. Át kell bányásznod rajta, szóval _keress nemrég megbolygatott sziklát_\n\nSzerintem az egyik gnoll okozza a legtöbb bajt, valószínűleg egy _geomancer sámán_ vagy valami ilyesmi. Fizetek rá többet, ha megtalálod és megölöd, de biztos vagyok benne, hogy vissza fog küzdeni.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Szia Ember! Úgy tűnik, gyors fickó vagy.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hé, Ember! Okosnak tűnsz.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hé, Ember! Úgy nézel ki, mint egy sunyi.
actors.mobs.npcs.blacksmith.intro_quest_start=Hasznos akarsz lenni, mi? Igen, van valami, amit csinálhatsz. Egy régi bánya tetejére építettem ezt a műhelyt, csak le kell menned azon a létrán. Fogd a csákányodat, és bányássz nekem egy kis _sötét aranyércet_. 40 darab_ elég lesz. A lenti kő szép puha, így _egy kis erőfeszítéssel át tudsz majd ásni a falakon._\n\nHogy érted, hogy hogyan fogok fizetni? Te kapzsi...\n\nOké, oké, tudok neked kovácsolni. Szerencsésnek mondhatod magad, én vagyok az egyetlen kovács a környéken.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hé, Ember! Kemény fickónak tűnsz.
actors.mobs.npcs.blacksmith.lost_pick=Viccelsz velem? Hol van a csákányom?!
actors.mobs.npcs.blacksmith.name=troll kovács
actors.mobs.npcs.blacksmith.quest_start_prompt=Készen állsz a lemerülésre? Győződj meg róla, hogy van elég szabad helyed az aranynak. \n\n_Csak egyszer engedlek le!_
actors.mobs.npcs.blacksmith.reminder=Ragaszkodtál az időmhöz? A bánya bejárata ott van.
actors.mobs.npcs.blacksmith.reminder_crystal=Hozz annyi aranyat, amennyit csak tudsz, és próbáld meg összetörni a nagy kristályt is.
actors.mobs.npcs.blacksmith.reminder_fungi=Hozz nekem annyi aranyat, amennyit csak tudsz, és próbáld meg megölni az óriásgombát is.
actors.mobs.npcs.blacksmith.reminder_gnoll=Hozz nekem annyi aranyat, amennyit csak tudsz, és próbáld meg megölni a gnoll geomancert is.
actors.mobs.npcs.ghost.crab_1=Szia %s... Egykor én is olyan voltam, mint te - erős és magabiztos... De megölt egy ősi teremtmény... Nem hagyhatom el ezt a helyet... Amíg bosszút nem állok... Öld meg a _nagy rákot,_ amelyik elvette az életemet...\n\nTermészetellenesen öreg... Egyetlen hatalmas ollóval és vastag páncéllal... _Vigyázz a karmával, meg kell lepned a rákot, különben eláll vele..._
actors.mobs.npcs.ghost.crab_2=Kérlek... Segíts... Öld meg a rákot...\n\n_Mindig blokkolni fog... Amikor meglát, hogy közeledsz..._
actors.mobs.npcs.ghost.desc=A szellem alig látható. Úgy néz ki, mint egy alaktalan, halvány fényfolt, szomorú arccal.
actors.mobs.npcs.ghost.find_me=Köszönöm... keress meg...
actors.mobs.npcs.ghost.gnoll_1=Szia %s... Egykor én is olyan voltam, mint te - erős és magabiztos... De egy ravasz ellenség ölt meg... Nem hagyhatom el ezt a helyet... Amíg bosszút nem állok... Öld meg a _gnoll szélhámost,_ aki elvette az életemet...\n\nNem olyan, mint a többi gnoll... Elrejtőzik és dobófegyvereket használ... _Óvakodj a mérgező és gyújtó dárdáitól, ne támadj távolról..._
actors.mobs.npcs.ghost.gnoll_2=Kérlek... Segíts... Öld meg a szélhámost...\n\n_Ne hagyd, hogy eltaláljon... Gyere közel hozzá..._
actors.mobs.npcs.ghost.name=szomorú szellem
actors.mobs.npcs.ghost.rat_1=Szia %s... Egykor én is olyan voltam, mint te - erős és magabiztos... De megölt egy ocsmány vadállat... Nem hagyhatom el ezt a helyet... Amíg bosszút nem állok... Öld meg a _bűzös patkányt,_ amely elvette az életemet...\n\nEzen a padlón lopakodik... Mindenhol mocskot terjeszt... _Óvakodj a bűzfelhőjétől és maró csípésétől, a sav vízben oldódik..._
actors.mobs.npcs.ghost.rat_2=Kérlek... Segíts... Öld meg az utálatosságot...\n\n_Harcolj ellene víz közelében... Kerüld a bűzt..._
actors.mobs.npcs.imp.cya=Viszlát, %s!
actors.mobs.npcs.imp.desc=A koboldok alacsonyabb rendű démonok. Sem erejükről, sem mágikus tehetségükről nem nevezetesek, de meglehetősen okosak és társaságkedvelők. Sok kobold szívesebben él nem démonok között.
actors.mobs.npcs.imp.golems_1=Az én esetemben a _golemeket_ kell megölni. Látod, el fogok indítani egy kis üzletet, de ezek a hülye gólemek rosszak az üzletnek! Nagyon nehéz alkudozni a vándorló gránitrögökkel, a fene egye meg őket! Szóval kérlek, ölj meg... mondjuk _4-et belőlük_, és jutalmad van.
actors.mobs.npcs.imp.golems_2=Hogy halad a gólem szafarid? Csak ne felejtsd el megszerezni a zsetonokat.
actors.mobs.npcs.imp.hey=Pszt, %s!
actors.mobs.npcs.imp.intro=Kalandor vagy? Imádom a kalandorokat! Mindig számíthatsz rájuk, ha valamit meg kell ölni, ugye? Természetesen jutalomért ;)
actors.mobs.npcs.imp.monks_1=Az én esetemben _szerzeteseket_ kell megölni. Látod, én egy kis vállalkozást fogok indítani, de ezek az őrültek maguk nem vesznek semmit, és elriasztják a többi vásárlót. Szóval kérlek, ölj meg... mondjuk _5-öt közülük_, és tiéd a jutalom.
actors.mobs.npcs.imp.monks_2=Ó, még élsz! Tudtam, hogy a kung-fud erősebb lesz ;) Csak ne felejtsd el megszerezni azokat a zsetonokat.
actors.mobs.npcs.imp.name=ambiciózus imp
actors.mobs.npcs.impshopkeeper.buyback=A kobold vidáman visszaadja a tárgyadat.
actors.mobs.npcs.impshopkeeper.desc=A kobold egy kis boltot rendezett be a belső folyosók szélén. Jó látni egy barátságos arcot, de az árai biztosan nem tűnnek barátságosnak.
actors.mobs.npcs.impshopkeeper.greetings=Szia, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Mit csináltál, %s? Vásárolj gyorsan, muszáj kijutnom innen!
actors.mobs.npcs.impshopkeeper.name=ambiciózus imp
actors.mobs.npcs.impshopkeeper.thief=Azt hittem, megbízhatok benned!
actors.mobs.npcs.mirrorimage.desc=Ez az illúzió nagyon hasonlít rád, de sápadtabb és kissé rángatózik.
actors.mobs.npcs.mirrorimage.discover_hint=Ezt a karaktert egy adott tekercssel találhatod meg.
actors.mobs.npcs.mirrorimage.name=tükörkép
actors.mobs.npcs.npc.discover_hint=Ezt a karaktert a kazamata egy adott régiójában találhatod meg.
actors.mobs.npcs.prismaticimage.desc=Ez a csillogó illúzió nagyon hasonlít rád, sőt úgy tűnik, mintha a jelenlegi fegyveredet és páncélodat viselné.\n\nA prizmatikus képek megpróbálják felkutatni és elterelni az ellenségek figyelmét, fokozott védekezésüket és életerejüket felhasználva a védelmedre. Bár nem rendelkeznek ugyanolyan támadó erejükkel, mint a tükörképek, fokozott tartóssággal rendelkeznek, beleértve a páncélodból származó előnyök élvezetét is.\n\nHa 0 életerőre csökkented, a prizmatikus képek több kör alatt elhalványulnak, és ez idő alatt továbbra is gyógyíthatók. Ha nincsenek jelen ellenségek, a prizmatikus képek elhalványulnak és visszatérnek gazdájukhoz.
actors.mobs.npcs.prismaticimage.discover_hint=Ezt a karaktert egy adott tekercssel találhatod meg.
actors.mobs.npcs.prismaticimage.name=prizmás kép
actors.mobs.npcs.ratking.confused=Mi... Hol vagyok? A királyságomnak szüksége van rám!
actors.mobs.npcs.ratking.crown_after=Élvezed az új páncélodat? Nincs visszavágás!
actors.mobs.npcs.ratking.crown_clothes=Öltözz fel! Nem vagy abban az állapotban, hogy királyi családdal beszélj!
actors.mobs.npcs.ratking.crown_desc=Ó, az a korona nekem való!? Sokkal fényesebbnek tűnik, mint az enyém, szóval kegyesen elfogadom! \n\n Sőt, azt hiszem, felajánlhatok neked valamit jutalmul ezért a koronáért. Hatalmas erő, ami egy olyan hőshöz illik, mint te! Tetszene neked?
actors.mobs.npcs.ratking.crown_fine=Rendben! Nem mintha én akartam volna...
actors.mobs.npcs.ratking.crown_info=Előbb mondj többet.
actors.mobs.npcs.ratking.crown_no=Inkább nem...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, köszönöm! Most pedig menj, és tedd büszkévé a királyodat!
actors.mobs.npcs.ratking.crown_yes=Természetesen!
actors.mobs.npcs.ratking.desc=Ez a patkány egy kicsit nagyobb, mint egy átlagos erszényes patkány. Egy apró koronát visel a fején.
actors.mobs.npcs.ratking.desc_birthday=Ez a patkány egy kicsit nagyobb, mint egy átlagos erszényes patkány. Egy apró zöld partikalapot visel a szokásos koronája helyett. Boldog születésnapot Patkánykirály!
actors.mobs.npcs.ratking.desc_crown=Ez a patkány egy kicsit nagyobb, mint egy átlagos erszényes patkány. Törpekirályi koronát visel a fején.
actors.mobs.npcs.ratking.desc_winter=Ez a patkány egy kicsit nagyobb, mint egy átlagos erszényes patkány. Egy apró, ünnepi kalapot visel a szokásos koronája helyett. Kellemes ünnepeket!
actors.mobs.npcs.ratking.discover_hint=Ezt a karaktert a kazamata egy adott régiójának végén találhatod.
actors.mobs.npcs.ratking.name=patkánykirály
actors.mobs.npcs.ratking.not_sleeping=Nem alszom!
actors.mobs.npcs.ratking.what_is_it=Mi az? Nincs időm erre az ostobaságra. A királyságom nem fog uralkodni önmagán!
actors.mobs.npcs.sheep.baa!=Béget!
actors.mobs.npcs.sheep.baa.=Béget.
actors.mobs.npcs.sheep.baa...=Béget...
actors.mobs.npcs.sheep.baa?=Béget?
actors.mobs.npcs.sheep.def_verb=zárolt
actors.mobs.npcs.sheep.desc=Ez egy varázsbárány. Mi olyan varázslatos benne? Nem lehet megölni. Ott fog állni, amíg varázsütésre el nem halványul, miközben üres tekintettel kérődzik.
actors.mobs.npcs.sheep.discover_hint=Ezt a karaktert egy adott tárggyal vagy csapdával találhatod meg.
actors.mobs.npcs.sheep.name=juh
actors.mobs.npcs.shopkeeper.buyback=A boltos vonakodva visszaadja a terméket.
actors.mobs.npcs.shopkeeper.desc=Ez a testes fickó inkább egy nagyváros kereskedelmi negyedébe illik, mint egy kazamatába. Az árai megmagyarázzák, miért szívesebben köt itt üzletet.
actors.mobs.npcs.shopkeeper.flee=A boltos menekül!
actors.mobs.npcs.shopkeeper.name=boltos
actors.mobs.npcs.shopkeeper.sell=Eladni egy terméket
actors.mobs.npcs.shopkeeper.talk=Beszélgetés
actors.mobs.npcs.shopkeeper.talk_ascent=Nem tudom, mit tervezel azzal az amulettel, de én nem akarok belőle semmit. Vegyél valamit, és lépj tovább, mindkettőnknek el kell hagynunk ezt a helyet!
actors.mobs.npcs.shopkeeper.talk_caves=Költs pénzt, élj tovább. \n\nÓ, és köszönj nekem annak a troll kovácsnak, ha látod. Emlékeztesd a fickót, hogy még mindig tartozik nekem pénzzel azért a kalapácsért, amit múlt héten eladtam neki!
actors.mobs.npcs.shopkeeper.talk_city=Az áruim biztonságban tudnak tartani itt lent. \n\n...És ne ácsorogj itt, ha kérhetsz. Egy örökkévalóságba telt, mire rávettem a helyieket, hogy hagyjanak békén, nem akarom, hogy bajt keverj!
actors.mobs.npcs.shopkeeper.talk_halls=Sziasztok, különleges ajánlataim vannak démonvadászoknak!\n\nÓ, és legyetek óvatosak odalent! A lenti démonokat nem érdekli, milyen bátrak vagytok. Nem jöhettek vissza és költhettek több pénzt, ha meghaltatok! ;)\n\nA démonok olyanok, mint én? Hehe, egyáltalán nem. Csak egy apró fickó vagyok, nem valami jó harcos, és sikerült megőriznem az elmémet. A lenti démonok sokkal erősebbek, és mindannyian rabszolgasorba estek... nos... csak legyetek óvatosak odalent.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nos, üdv, Felség, vagy most Szentatya? Hehe, akárhogy is, ez nem neked való hely, sokan kétségbeesnének, ha meghalnál. De biztosan van néhány érméd, miért nem veszel valamit, ami segít ezt megelőzni?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Nos, ha nem az utazó hősről van szó! Ha egy másik várost próbálsz megmenteni, akkor sok szerencsét, a veszélyek itt sokkal nagyobbak, mint a piti banditák bandái. Biztos vagyok benne, hogy jobban fogsz járni, mint bárki más, csak próbálj meg nem meghalni a boltom előtt.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Úgy tűnik, nem vagy otthon, kisasszony. A szűk kazamatafolyosók nem olyan tágasak, mint a nagytermek vagy a várost körülvevő erdők, ugye? Hehe, ó, ne haragudj a fecsegésemre, miért nem veszel valamit?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Minden megvan nálam, ami egy sikeres kalandhoz kell!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, mintha láttam volna valahol a városban egy körözési plakátot a neveddel. Szökésben vagyunk, ugye? Ó, ártatlan vagy, ugye? Persze, persze... Ne aggódj, van jobb dolgom is, mint hogy beszámoljak rólad, de talán venned kellene valamit, hogy biztosra menj?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=A tolvajok céhétől jöttél, hogy megtisztítsd a környéket? Nem, csak vásárolni jöttél? Akkor ölj meg pár szörnyet, amíg itt vagy. Ne számíts kedvezményre sem, jó védelmi pénzt fizetek nektek, ti meg alig vigyáztok rám itt lent.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Érdekes ez a pecsét, általában egy darabban vannak. Kegyvesztett hős vagy, vagy mi? Bármit is tettél, az nem az én dolgom, az érméid még mindig jók.
actors.mobs.npcs.shopkeeper.thief=Tolvaj, tolvaj!
actors.mobs.npcs.shopkeeper.warn=Figyelj! Nem foglak többet figyelmeztetni.
actors.mobs.npcs.vaultlaser.desc=Ez az őrszem rendszeres időközönként lézereket lő ki. _Mivel ez csak egy tesztelési terület, a lézerek valójában nem fognak ártani neked._
actors.mobs.npcs.vaultlaser.name=boltozat lézeres őrszem
actors.mobs.npcs.vaultsentry.desc=Ez az őrszem egy mintázat szerint pásztázza a területet. _Mivel ez csak egy tesztelési terület, az őrszem nem tesz semmit, ha észlel téged._
actors.mobs.npcs.vaultsentry.name=trezor szkennelő őrszem
actors.mobs.npcs.wandmaker.def_verb=zárolt
actors.mobs.npcs.wandmaker.desc=Ez az idős, mégis egészséges úriember kissé zavart arckifejezést visel. Egy mágikus pajzs védi.
actors.mobs.npcs.wandmaker.intro_1=Azért jöttem, hogy egy ritka hozzávalót találjak egy pálcához, de eltévedtem, és a mágikus pajzsom gyengül. Hamarosan mennem kell, de nem bírom elviselni, hogy anélkül menjek, amiért jöttem.
actors.mobs.npcs.wandmaker.intro_2=Ha ezt meg tudod szerezni nekem, boldogan fizetek neked egy finoman kidolgozott pálcámmal! Kettőt hoztam magammal, így azt választhatod, amelyiket szeretnéd.
actors.mobs.npcs.wandmaker.intro_berry=Ennek a börtönnek az öreg felügyelője tartott egy _rothadós szedernövényt_, és én az egyik magjára lennék kíváncsi. A növény valószínűleg már elvadult, szóval nehéz lehet rávenni, hogy leadjon egy magot. A kertjének valahol itt kellene lennie. Próbálj _távol maradni a kúszónövényeitől_, ha egy darabban akarsz maradni. A tűz használata csábító lehet, de kérlek, ne tedd, mert megölöd a növényt és elpusztítod a magjait.
actors.mobs.npcs.wandmaker.intro_cleric=Ó, üdvözlöm, Felség! Milyen kellemes meglepetés, hogy ilyen lehangoló helyen találkozunk! Nem szívesen erőltetem a dolgot, de lehet, hogy van egy feladatom a számára.
actors.mobs.npcs.wandmaker.intro_duelist=Ó, szia kisasszony! Micsoda kellemes meglepetés egy hőssel találkozni egy ilyen lehangoló helyen! Ha kedvet kaptál egy öregemberhez, talán van egy feladatom a számodra.
actors.mobs.npcs.wandmaker.intro_dust=_Holtport_ keresek._ Ez egy különleges, elátkozott csontliszt, ami általában ilyen helyeken szokott felbukkanni. Kell lennie itt valahol egy elbarikádozott szobának, biztos vagyok benne, hogy felbukkan majd ott némi por. De légy óvatos, a por átoka elég erős, _amint tudsz,_ és megtisztítom neked.
actors.mobs.npcs.wandmaker.intro_ember=Friss parazsat keresek egy újszülött tűzelementáltól. Az elementálok általában akkor bukkannak fel, amikor egy idéző rituálét nem lehet kontrollálni, szóval csak keress néhány gyertyát és egy rituális helyet, és biztos vagyok benne, hogy sikerül egyet felbukkantatni. A harc közben azonban _kerüld el, hogy beskatulyázd magad_, vagy _tarts kéznél valami fagyasztó tárgyat_. Az újszülött elementálok elég erősek és kaotikusak, de nem bírják a hideget.
actors.mobs.npcs.wandmaker.intro_huntress=Ó, szia kisasszony! Kellemes meglepetés errefelé egy barátságos arc, nem igaz? Sőt, esküszöm, már láttam az arcát, de nem tudom pontosan, mi az... De mindegy, ha kalandvágyból jött, lehet, hogy van egy feladatom a számára.
actors.mobs.npcs.wandmaker.intro_mage=Ó, szia %s! Hallottam, hogy volt egy kis felhajtás körülötted és a varázslóintézet körül? De mindegy, sosem szerettem az ilyen ügyeskedőket. Ha hajlandó vagy, talán van egy feladatom a számodra.
actors.mobs.npcs.wandmaker.intro_rogue=Ó, istenem, megijesztettél! Még nem találkoztam egyetlen banditával sem innen, akinek megmaradt volna az ép esze, szóval biztosan a felszínről származol! Ha hajlandó vagy segíteni egy idegennek, lehet, hogy van egy feladatom a számodra.
actors.mobs.npcs.wandmaker.intro_warrior=Ó, szia! Micsoda kellemes meglepetés egy északi harcossal találkozni egy ilyen lehangoló helyen! Biztosan elég messziről érkeztél ide. Ha kalandra vágysz, talán van egy feladatom a számodra.
actors.mobs.npcs.wandmaker.name=öreg pálcakészítő
actors.mobs.npcs.wandmaker.reminder_berry=Sikerült egy Rotberry maggal, %s? Keressen egy növényekkel teli szobát.
actors.mobs.npcs.wandmaker.reminder_dust=Sikerült holttestporral foglalkoznod, %s? Keress néhány barikádot.
actors.mobs.npcs.wandmaker.reminder_ember=Sikerült a parázslal, %s? Meg kell találnod négy gyertyát és a rituális helyszínt.
actors.mobs.phantompiranha.desc=A fantompiranják egy ritka piranhafajta, mágikus képességekkel és hátborzongató, áttetsző testtel. Képesek teleportálni, amikor támadják őket, akár menekülni, akár gyorsan az ellenség közelébe kerülni! \n\n Bár a harc idegesítő, a húsukat mágikus tulajdonságaik miatt nagyra értékelik.
actors.mobs.phantompiranha.name=fantom piranha
actors.mobs.phantompiranha.teleport_away=A fantompiranha elteleportál...
actors.mobs.piranha.desc=Ezeket a húsevő halakat kifejezetten az elárasztott területek védelmére tenyésztik. A harapásuk halálos, ezért a legjobb elkerülni a közvetlen találkozást velük.
actors.mobs.piranha.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.
actors.mobs.piranha.name=óriás piranha
actors.mobs.pylon.desc_active=Egy elektromos oszlop, amelynek célja a területen található gépeket működtető elektromosság szabályozása. Az oszlop jelenleg tele van elektromos energiával, ez lehet az, ami a DM-300-at feltölti!Ebben az állapotban az oszlopok sebezhetőek, de az óramutató járásával megegyező irányban áramot bocsátanak ki a közeli cellákba. Nehézfém szerkezetük miatt az oszlopok ellenállnak a nagymértékű sérüléseknek.
actors.mobs.pylon.desc_inactive=Egy elektromos oszlop, amelynek célja a területen lévő gépeket működtető elektromosság szabályozása. \n\n Az oszlop jelenleg inaktív és immunis a sérülésekre.
actors.mobs.pylon.name=villanyoszlop
actors.mobs.rat.desc=Az erszényes patkányok agresszív, de meglehetősen gyenge csatornalakók. Rosszul harapnak, de csak nagy számban jelentenek életveszélyt.
actors.mobs.rat.name=erszényes patkány
actors.mobs.ripperdemon.desc=Ezek a szörnyű teremtmények annak az eredményei, hogy ebben a régióban számos törpe holttestet találtak, amelyeket démoni erők használtak fel. A Hasfelmetszők lesoványodott, hátborzongató lények, amelyek törpékre hasonlítanak, de törött testtel és hosszú, éles, csontból készült karmokkal. A Hasfelmetszők démonai nem különösebben tartósak, de fürgeek és veszélyesek. Képesek nagy távolságokat ugrani, hogy gyorsan elérjék a célpontokat, mielőtt karmaikkal felmarnák azokat.
actors.mobs.ripperdemon.leap=A hasfelmetsző démon ugrásra készül!
actors.mobs.ripperdemon.name=hasfelmetsző démon
actors.mobs.rotheart.desc=A rotberry termése nagyon egyedi. A rothadás és a tápanyagok biztosítása helyett a termés növekszik, megkeményedik és körülveszi a magot. Védelmet nyújt a termés belsejében növekvő belső szerveknek. Ezt az óriási gömböt a kifejlett rotberry növény szívének nevezik.
actors.mobs.rotheart.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.rotheart.name=rothadó szív
actors.mobs.rotlasher.desc=A rothadórágó a kifejlett rothadóbogyó gyökérzetének része, és egyben elsődleges védekezőeszköze is. A rothadórágók vakok és a földbe szúródnak, de miután egy pillanatra észreveszik azokat, hevesen megtámadnak minden közeli fenyegetést. Ha nincsenek a közelben ellenségek, mozdulatlanul állnak, és megpróbálnak beolvadni a környező növényzetbe.
actors.mobs.rotlasher.discover_hint=Ezt az ellenséget egy adott küldetés során találhatod meg.
actors.mobs.rotlasher.name=rothadásgátló
actors.mobs.scorpio.desc=Ezek a hatalmas, pókszerű démoni lények kerülik a közelharcot, inkább nagy távolságból lőnek ki bénító, fűrészes tüskéket.
actors.mobs.scorpio.name=Skorpió
actors.mobs.senior.desc=Ezek a szerzetesek megszállottan védik városuk titkait minden idegentől. Sem páncélt, sem fegyvert nem használnak, csak a pusztakezes harcban bíznak.
actors.mobs.senior.name=idősebb szerzetes
actors.mobs.shaman$blueshaman.spell_desc=Ez a sámán kék maszkot visel, és olyan mágiát fog használni, amely ideiglenesen _növeli az elszenvedett sebzést_.
actors.mobs.shaman$purpleshaman.spell_desc=Ez a sámán lila maszkot visel, és olyan mágiát fog használni, amely ideiglenesen _csökkenti a pontosságodat és a kitérő képességedet_.
actors.mobs.shaman$redshaman.spell_desc=Ez a sámán vörös maszkot visel, és olyan mágiát fog használni, amely ideiglenesen _gyengíti a támadóerődet_.
actors.mobs.shaman.bolt_kill=A varázsvillám megölt téged...
actors.mobs.shaman.desc=A legeszesebb gnollok megtanulhatják a sámánmágiát. A gnoll sámánok harci varázslatokkal pótolják testi erejük hiányát, és habozás nélkül vetik be őket azok ellen, akik megkérdőjelezik helyüket a törzsben.
actors.mobs.shaman.name=gnoll sámán
actors.mobs.skeleton.def_verb=zárolt
actors.mobs.skeleton.desc=A csontvázakat szerencsétlen kalandozók és a kazamata lakóinak csontjaiból keltette életre a mélyből áradó gonosz mágia. Ha elég sérülést szenvednek, csontrobbanással hullanak darabokra.
actors.mobs.skeleton.explo_kill=Csontok robbanása ölt meg...
actors.mobs.skeleton.name=csontváz
actors.mobs.slime.def_verb=zárolt
actors.mobs.slime.desc=A nyálkák furcsa, enyhén mágikus lények, gumiszerű külső testtel és folyékony maggal. A városi csatornák bőséges víz- és tápanyagellátást biztosítanak számukra.\n\nRugalmas külső membránjuk miatt nehéz egyetlen támadásból _6-nál több sebzést_ okozni a nyálkáknak.
actors.mobs.slime.name=iszap
actors.mobs.snake.desc=Ezek a túlméretezett kígyók képesek gyorsan kikerülni az ütéseket, így meglehetősen nehéz őket eltalálni. A mágikus támadások vagy a meglepetésszerű támadások azonban váratlanul érhetik őket.\n\nMeglepetésszerű támadást úgy is végrehajthatsz, hogy a kígyó látóterén kívül támadsz. Az egyik módja, ha hagyod, hogy egy kígyó átkergessen egy ajtón, majd _közvetlenül azután csapsz le rád, hogy belépett az ajtón._
actors.mobs.snake.hint=Próbáld ki a kígyók vizsgálat gombját, hogy megtanuld, hogyan védekezhetsz ellenük.
actors.mobs.snake.name=csatorna kígyó
actors.mobs.spectralnecromancer.desc=Míg a csontvázak a nekromanták kenyerét és vajat jelentik, néhányan szívesebben keresnek más, kevésbé anyagi lényeket. A kísértet nekromanták a lidérceket választották kegyenceiknek! Az egyes lidércek nem olyan erősek, mint a csontvázak, de ezek a nekromanták nem félnek belőlük egy csapatot megidézni!
actors.mobs.spectralnecromancer.name=kísérteties nekromanta
actors.mobs.spinner.desc=Ezek a zöldes, szőrös barlangi pókok kerülik a közvetlen harcot. Inkább távolról várják, hogy a hálójukba gabalyodott áldozat lassan belehaljon a mérges harapásba.
actors.mobs.spinner.name=barlangi pók
actors.mobs.statue.def_verb=zárolt
actors.mobs.statue.desc=Azt gondolnád, hogy ez csak egy a kazamata élettelen szobrai közül, de a vörösen izzó szemei elárulják.
actors.mobs.statue.desc_weapon=Bár maga a szobor kőből készült, a _%s_, amit a kezeiben tart, valódinak tűnik.
actors.mobs.statue.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.
actors.mobs.statue.name=animált szobor
actors.mobs.succubus.desc=A szukkubuszok csábító, kissé gótikus külsejű lányokra emlékeztető démonok. Varázsukkal elbűvölhetik a hőst, aki a bűbáj elmúltáig senkit sem tud megtámadni.
actors.mobs.succubus.name=szukubusz
actors.mobs.swarm.desc=A halálos legyek rajja dühösen zümmög. Minden nem mágikus támadás két kisebb, de ugyanolyan veszélyes rajra osztja.
actors.mobs.swarm.name=legyek rajja
actors.mobs.tengu$bombability$bombblob.desc=Túlhevített füstfelhő gomolyog itt. Vigyázz, fel fog robbanni!
actors.mobs.tengu$bombability$bombitem.cant_pickup=A földhöz ragadt, nem lehet megmozdítani!
actors.mobs.tengu$bombability$bombitem.desc=Tengu egy furcsa kinézetű füstbombát dobott ide, ami sűrű, forró füstöt gomolygat. Hangos ketyegést hallat, mintha robbanásig számolna vissza! \n\n A bomba a földhöz rögzült, így nem tudod felvenni.
actors.mobs.tengu$bombability$bombitem.name=füstbomba
actors.mobs.tengu$fireability$fireblob.desc=Tengu finom port dobott oda, ami úgy tűnik, gőzzé kezd válni, mindjárt meggyullad!
actors.mobs.tengu$shockerability$shockerblob.desc=Elektromos energia gyűlik itt, bármi, ami ezen a mezőn áll, áramütést kap a következő körben!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Túl sok áramot ad le, nem lehet megfogni!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu egy különös gépet dobott ide, ami úgy tűnik, DM-100 alkatrészekből készült. A gép folyamatosan elektromos íveket generál maga körül, de úgy tűnik, hogy ez egy kiszámítható mintázat szerint halad. \n\n A körülötte lévő összes elektromos ív miatt ezt semmiképpen sem lehet észrevenni.
actors.mobs.tengu$shockerability$shockeritem.name=Ócskaság
actors.mobs.tengu.defeated=Végre szabadon...
actors.mobs.tengu.desc=A tenguk egy ősi, szintén Tengu nevű orgyilkosklán tagjai. Előszeretettel használnak dobócsillagokat és csapdákat.
actors.mobs.tengu.interesting=Tegyük ezt érdekessé...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Megvan, %s!
actors.mobs.tengu.notice_have=Most már megvannálak, %s!
actors.mobs.tengu.rankings_desc=A Tengu meggyilkolta
actors.mobs.thief.carries=A tolvaj egy _%s-t hord magánál._ Nyilvánvalóan ellopták.
actors.mobs.thief.desc=Bár ezek a rabok szabadon kószálhatnak celláikból, ez a hely továbbra is a börtönük. Idővel ez a hely elvette az eszüket és a szabadságukat is. Ezek az őrült tolvajok és banditák régen elfelejtették, kik ők és miért lopnak. \n\nEzek az ellenségek nagyobb valószínűséggel lopnak és menekülnek, mint harcolnak. Ügyelj arra, hogy szem előtt tartsd őket, különben lehet, hogy soha többé nem látod az ellopott tárgyat.
actors.mobs.thief.escapes=A tolvaj megússza a %s-dat!
actors.mobs.thief.name=őrült tolvaj
actors.mobs.thief.stole=A tolvaj ellopta tőled a %s-t!
actors.mobs.tormentedspirit.desc=A gyötört szellemek egyébként jóindulatú szellemek, akiket átok sújtott. Amíg átokkal vannak átkozva, úgy támadnak, mint egy kísértet, és erősebbek is! \n\nLehetséges, hogy az átkot a megfelelő tárgy használatával lehet megtisztítani a szellem mellett. Ha az átok feloldódik, a szellem biztosan hálás lesz...
actors.mobs.tormentedspirit.name=gyötrődő szellem
actors.mobs.tormentedspirit.thank_you=Köszönöm...
actors.mobs.vaultrat.desc=Ennek a patkánynak néhány viselkedésbeli változtatása történt, hogy tesztelje az új boltozat ellenséges mesterséges intelligenciáját:\n_-_ Mozgása falakon keresztül „hallható”.\n_-_ Egy előre beállított járőrvonal mentén fog barangolni.\n_-_ Barangolással jelentősen csökken az észlelési tartománya a mozgásirány mögött.\n_-_ Alvás közben az észlelési tartománya is csökken.\n_-_ Amikor észlel téged, „nyomozni” kezd, mielőtt vadászatra vált. A nyomozó ellenségek feléd mozognak, de nem támadnak, és könnyebb elveszíteni őket az ajtók és sarkok mögött.
actors.mobs.warlock.bolt_kill=Az árnyékvillanás megölt téged...
actors.mobs.warlock.desc=Amikor a törpök érdeklődése a mérnöki tudományokról a mágia felé fordult, a boszorkánymesterek vették át a hatalmat a városban. Elemi mágiával kezdték, de hamar áttértek a démonológiára és a nekromanciára.
actors.mobs.warlock.name=törpe boszorkánymester
actors.mobs.wraith.desc=A lidérc egy bűnös bosszúálló szelleme, akinek a sírját vagy kriptáját megbolygatták. Mivel éterikus lény, nagyon nehéz eltalálni hagyományos fegyverrel.
actors.mobs.wraith.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.
actors.mobs.wraith.name=lidérc
actors.mobs.yogdzewa$larva.desc=Ezek az apró Yog-Dzewa lények egyszerű lények, akiket könnyű előállítani. Bár egyenként gyengék, gyorsan megidézhetők, és nagy számban elsöprő erővel bírhatnak.
actors.mobs.yogdzewa$larva.name=isten lárvája
actors.mobs.yogdzewa$larva.rankings_desc=Yog-Dzewa felfalta
actors.mobs.yogdzewa$yogeye.rankings_desc=Yog-Dzewa felfalta
actors.mobs.yogdzewa$yogripper.rankings_desc=Yog-Dzewa felfalta
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Yog-Dzewa felfalta
actors.mobs.yogdzewa.darkness=A sötétség egyre közelebb húz...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa egy Öreg Isten; egy hatalmas szörnyeteg, amely behatol a halandók világába, és felfalja azokat, hogy táplálja végtelen növekedését. A törpöknek sötét mágiával játszadozva kellett felkelteniük ennek a kozmikus horrornak a figyelmét, és azóta is próbálják kordában tartani. ZXQPH0 ZXQ ZXQPH1 ZXQ Yog-Dzewa a nyers mágikus káosz dimenziójából származik, és nem tudja behozni valódi formáját ebbe a világba. Ehelyett avatárokat hozott létre, és démoni lényeket idézett meg, hogy teljesítsék a parancsait. ZXQPH2 ZXQ ZXQPH3 ZXQ Ez az óriási szem Yog-Dzewa erejének középpontja ebben a világban. Míg maga a szem mozdulatlan, képes erőteljes démoni mágiasugarakat lőni, és különféle lényeket idézni meg segítségül.
actors.mobs.yogdzewa.desc_spawners=Érezheted, ahogy a fenti emeletekről démoni energiahullámok áradnak a szemedbe. Valami, amit életben hagytál odafent, biztosan energiát juttat vissza Yog-Dzewába. _Yog ezt az energiát fogja felhasználni még erősebb lények megidézésére!_
actors.mobs.yogdzewa.hope=A. REMÉNYED. EGY. ILLÚZIÓ!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=LÁTNI TÉGED.
actors.mobs.yogdzewa.rankings_desc=Yog-Dzewa felfalta
actors.mobs.yogfist$brightfist.desc=Ez az ököl tiszta fényenergiából áll. Képes minden körben erős, perzselő fénysugarakat lőni! Ezek a sugarak ideiglenesen megvakítanak a súlyos sebzés mellett. Az ököl arra is képes, hogy rövid időre vakító fénybe borítsa az arénát, hogy elmenekülhess! \n\n Az ökölnek azonban nincsenek különleges képességei, amelyeket közelharcban használhatna.
actors.mobs.yogfist$brightfist.name=fényes ököl
actors.mobs.yogfist$brightfist.teleport=Az ököl egy fényvillanással teleportál el, ami komolyan megvakít!
actors.mobs.yogfist$burningfist.desc=Lángokba burkolózó hatalmas ököl. Ujjai összezárulva ropognak, és parazsat szórnak a padlóra.
actors.mobs.yogfist$burningfist.name=égő ököl
actors.mobs.yogfist$darkfist.desc=Ez az ököl tiszta sötét energiából áll. Képes minden körben erős sötét mágia lökéseket kilőni! Ezek a lökések a súlyos sebzés okozása mellett gyengítik a fényforrásodat is. Az ököl arra is képes, hogy rövid időre sötétségbe borítsa az arénát, hogy elmenekülhess! \n\n Az ökölnek azonban nincsenek különleges képességei, amelyeket közelharcban használhatna.
actors.mobs.yogfist$darkfist.name=sötét ököl
actors.mobs.yogfist$darkfist.teleport=Az ököl egy sötétséghullámban teleportál el, ami kioltja a fényforrásodat!
actors.mobs.yogfist$rottingfist.desc=Rothadó húsból álló hatalmas ököl. Ujjai között bűzös nyálka szivárog, beszennyezve alatta a követ.
actors.mobs.yogfist$rottingfist.name=rothadó ököl
actors.mobs.yogfist$rustedfist.desc=Ez az ököl élő fémből készült. Egy hatalmas, mozgó fémtömeg, amely erős közelharci támadásokkal bír, és távolról is képes megbénítani a célpontjait. Hatalmas tömege miatt az ököl a rá mért sebzést idővel, ahelyett, hogy azonnal elszenvedné. Az ököl azonban rugalmatlan, és nem tud szűk átjárókba behatolni. Ezenkívül, bár lassan szenvedhet sebzést, a késleltetett sebzés folyamatosan növekszik, ha az öklöt többször eltalálják.
actors.mobs.yogfist$rustedfist.name=rozsdás ököl
actors.mobs.yogfist$soiledfist.desc=Ez az ököl kaotikus földmágiából formálódik. Mozgása során folyamatosan növényzetet növeszt maga körül. Koncentrált földsugarakat is képes kilőni, amelyek a gyorsan növő indák és gyökerek közé hálózzák be a célpontot! \n\n Az ököl erejét ebből a növényi életből nyeri, és a közelében lévő magas vagy barázdált növényzet mennyiségétől függően képes ellenállni a sebzésnek!
actors.mobs.yogfist$soiledfist.name=piszkos ököl
actors.mobs.yogfist.desc=Ez az ököl Yog-Dzewa erejének egyik aspektusa. Az ököl Yog-Dzewa erejéhez kapcsolódik, és minden sérüléstől védve van, ha a szem közelében van.
actors.mobs.yogfist.invuln_warn=Az ököl sebezhetetlen, amíg a szem közelében van!
actors.mobs.yogfist.rankings_desc=Yog-Dzewa felfalta
