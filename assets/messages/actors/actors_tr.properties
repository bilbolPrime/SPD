actors.mobs.mob.wandering=%s dolaşıyor
actors.mobs.elemental.desc=Başıboş ateş elementalleri, daha güçlü varlıkları çağırırken ortaya çıkan bir yan üründür. Doğaları öylesine kaotiktir ki en güçlü iblisbilimci bile onları kontrol edemez.
actors.mobs.elemental.name=ateş elementali
actors.mobs.king.desc=Cücelerin son kralı, yaşam ve ölüm hakkındaki derin bilgisiyle tanınırdı. Sarayındakileri, onlara sonsuz gençlik verecek bir ayine katılmaya ikna etti. Sonunda bunu yalnızca kendisi elde etti; yanında da bir ölümsüz ordusu kazandı.
actors.mobs.king.name=Cücelerin Kralı
actors.mobs.npcs.bee.desc=Altın arılar küçük olmalarına rağmen sahiplerini hırsla korur. Yine de pek uzun yaşamazlar.
actors.mobs.npcs.bee.name=altın arı
actors.mobs.shielded.desc=Kabadayılar gnoll'ların en iri, en güçlü ve en dayanıklı olanlarıdır. Ağır yaralandıklarında öfkeye kapılır ve düşmanlarına daha da fazla hasar verirler.
actors.mobs.shielded.name=kalkanlı kabadayı
actors.mobs.yog.desc=Yog-Dzewa, kaos diyarlarından gelen güçlü bir varlık olan Kadim Tanrı'dır. Bir asır önce, kadim cüceler iblis ordusuna karşı savaşı zar zor kazanmış, ancak tanrının kendisini öldürmeyi başaramamışlardı. Bunun yerine, bir daha asla yükselemeyecek kadar zayıf olduğuna inanarak onu şehirlerinin altındaki salonlara hapsetmişlerdi.
actors.mobs.yog.name=Yog-Dzewa
