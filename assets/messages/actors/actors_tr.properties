actors.hero.talent$swiftequipcooldown.desc=Bu yeteneği yakın zamanda kullandınız ve tekrar kullanmadan önce beklemeniz gerekiyor.\n\nKalan tur sayısı: %s.
actors.hero.talent$swiftequipcooldown.name=hızlı ekipman bekleme süresi
actors.hero.talent.adventurers_intuition.desc=_+1:_ Düellocu silahları _2,5 kat daha hızlı_ ve zırhları _1,75 kat daha hızlı_ tanımlar.\n\n_+2:_ Düellocu silahları _kuşandığında_ ve zırhları _2,5 kat daha hızlı_ tanımlar.
actors.hero.talent.adventurers_intuition.title=maceracının sezgisi
actors.hero.talent.aggressive_barrier.desc=_+1:_ Düellocu, silah yeteneği kullandığında ve canı %50 veya daha az olduğunda _3 kalkan_ kazanır.\n\n_+2:_ Düellocu, silah yeteneği kullandığında ve canı %50 veya daha az olduğunda _5 kalkan_ kazanır.
actors.hero.talent.aggressive_barrier.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, düşük can seviyesindeyken yakın dövüş saldırısı yaparken 50 turluk bekleme süresiyle kalkan sağlar.
actors.hero.talent.aggressive_barrier.title=agresif bariyer
actors.hero.talent.ally_warp.desc=_+1:_ Büyücü, 2 karelik bir menzil içinde anında yer değiştirmek için bir müttefik seçebilir.\n\n_+2:_ Büyücü, 4 karelik bir menzil içinde anında yer değiştirmek için bir müttefik seçebilir.\n\n_+3:_ Büyücü, 6 karelik bir menzil içinde anında yer değiştirmek için bir müttefik seçebilir.\n\nBüyücü, hareketsiz müttefiklerle yer değiştiremez.
actors.hero.talent.ally_warp.title=müttefik çarpıtma
actors.hero.talent.arcane_vision.desc=_+1:_ Büyücü bir düşmana büyü yaptığında, _10 tur_ boyunca düşman üzerinde zihinsel görüş kazanır.\n\n_+2:_ Büyücü bir düşmana büyü yaptığında, _15 tur_ boyunca düşman üzerinde zihinsel görüş kazanır.
actors.hero.talent.arcane_vision.title=gizemli görüş
actors.hero.talent.assassins_reach.desc=_+1:_ Suikastçının hazırlık seviyesi başına ışınlanma menzili 1/2/3/4 kareden _1/3/4/6 kareye_ yükseltildi.\n\n_+2:_ Suikastçının hazırlık seviyesi başına ışınlanma menzili 1/2/3/4 kareden _2/4/6/8 kareye_ yükseltildi.\n\n_+3:_ Suikastçının hazırlık seviyesi başına ışınlanma menzili 1/2/3/4 kareden _2/5/7/10 kareye_ yükseltildi.\n\nBu ışınlanma tehlikelerden ve düşmanlardan geçebilir, ancak duvarlar gibi katı arazilerden geçemez.
actors.hero.talent.assassins_reach.title=suikastçının erişimi
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladin, 2 yük karşılığında, kendisine ve 2 kare içindeki tüm müttefiklerine %20 hasar direnci ve Paladin zırh glifinin etkisini 20 tur boyunca %50 güç artışıyla veren bir büyü olan _Koruma Aurası_nı kullanabilir.\n\n_+2:_ Paladin, 2 yük karşılığında, kendisine ve 2 kare içindeki tüm müttefiklerine %30 hasar direnci ve Paladin zırh glifinin etkisini 20 tur boyunca %75 güç artışıyla veren bir büyü olan _Koruma Aurası_nı kullanabilir.\n\n_+3:_ Paladin, kendisine ve 2 kare içindeki tüm müttefiklerine %40 hasar direnci ve Paladin zırh glifinin etkisini 20 tur boyunca veren bir büyü olan _Koruma Aurası_nı kullanabilir. 20 tur boyunca %100 daha fazla güç, 2 kullanım hakkı karşılığında.
actors.hero.talent.aura_of_protection.title=koruma aurası
actors.hero.talent.backup_barrier.desc=_+1:_ Büyücü, asasındaki son şarjı kullandığında _3 kalkan_ kazanır.\n\n_+2:_ Büyücü, asasındaki son şarjı kullandığında _5 kalkan_ kazanır.
actors.hero.talent.backup_barrier.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bu yetenek kahramanın en yüksek seviyeli asasından tetiklenecektir.
actors.hero.talent.backup_barrier.title=yedek bariyer
actors.hero.talent.barkskin.desc=_+1:_ Çimlere bastığında, Muhafız her turda kaybolan ağaç kabuğu zırhında seviyesinin _%0-50'si_ kadar kazanır.\n\n_+2:_ Çimlere bastığında, Muhafız her turda kaybolan ağaç kabuğu zırhında seviyesinin _%0-100'ü_ kadar kazanır.\n\n_+3:_ Çimlere bastığında, Muhafız her turda kaybolan ağaç kabuğu zırhında seviyesinin _%0-150'si_ kadar kazanır.
actors.hero.talent.barkskin.title=kabuk derisi
actors.hero.talent.beaming_ray.desc=Rahip, güçlendirilmiş bir müttefikten 1 yük karşılığında _Işın Işını_ büyüsünü kullanabilir. Bu ışın duvarlardan geçebilir ve müttefiki hedef alınan bir konuma ışınlar. Eğer o konumda bir düşman varsa, müttefik düşmanın yanında belirir ve onu hedef alır. Işınlama, normalde hareketsiz olan müttefikleri bile ışınlayabilir, ancak bunu yaparken menzili yarıya iner.\n\n_+1:_ Işınlamanın maksimum menzili _4 karedir_ ve Çoklu Güç'ün bonusunu en yakın düşmana karşı 10 tur boyunca _+%35 hasar_ olarak artırır.\n\n_+2:_ Işınlamanın maksimum menzili _8 karedir_ ve Çoklu Güç'ün bonusunu en yakın düşmana karşı 10 tur boyunca _+%40 hasar_ olarak artırır.\n\n_+3:_ Işınlamanın maksimum menzili _12 karedir_ ve Çoklu Güç'ün bonusunu en yakın düşmana karşı 10 tur boyunca _+%45 hasar_ olarak artırır.\n\n_+4:_ Işınlamanın maksimum menzili _16 karo_ ve Çoklu Güç'ün bonusunu en yakın düşmana karşı 10 tur boyunca _+%50 hasar_ olarak artırır.
actors.hero.talent.beaming_ray.title=ışın
actors.hero.talent.blast_radius.desc=_+1:_ Element patlamasının yarıçapı 4'ten 5 kareye çıkarıldı. _+2:_ Element patlamasının yarıçapı 4'ten 6 kareye çıkarıldı. _+3:_ Element patlamasının yarıçapı 4'ten 7 kareye çıkarıldı. _+4:_ Element patlamasının yarıçapı 4'ten 8 kareye çıkarıldı.
actors.hero.talent.blast_radius.title=patlama yarıçapı
actors.hero.talent.bless.desc=_+1:_ Rahip, kendine uygulandığında _6 tur kutsama ve 10 kalkan_ veya başka bir karaktere uygulandığında _10 tur kutsama ve 10 iyileştirme_ sağlayan _Kutsama_ büyüsünü 1 yük karşılığında kullanabilir.\n\n_+2:_ Rahip, kendine uygulandığında _10 tur kutsama ve 15 kalkan_ veya başka bir karaktere uygulandığında _15 tur kutsama ve 15 iyileştirme_ sağlayan _Kutsama_ büyüsünü 1 yük karşılığında kullanabilir.\n\nBu büyüden gelen fazla iyileştirme kalkanlamaya dönüştürülür.
actors.hero.talent.bless.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bu yetenek kahramanın ve tüm müttefiklerinin isabet ve kaçınma oranlarını +1 seviyesinde %3, +2 seviyesinde ise %5 oranında artıracaktır.
actors.hero.talent.bless.title=kutsasın
actors.hero.talent.body_form.desc=Rahip, 2 kullanım karşılığında, bu oyunda belirlediği bir büyünün veya sembolün gücünü Trinity'ye aşılayan _Vücut Formu_ büyüsünü kullanabilir. \n\n_+1:_ Trinity kullanıldığında, Rahip seçilen etkiyi _20 tur boyunca_ kazanır. \n\n_+2:_ Trinity kullanıldığında, Rahip seçilen etkiyi _27 tur boyunca_ kazanır. \n\n_+3:_ Trinity kullanıldığında, Rahip seçilen etkiyi _33 tur boyunca_ kazanır. \n\n_+4:_ Trinity kullanıldığında, Rahip seçilen etkiyi _40 tur boyunca_ kazanır. \n\n Trinity yalnızca aşılanabilir. Tek seferde yalnızca bir vücut etkisi uygulanır. Seçilen glif nadir ve güçlü ise Trinity'nin zırh şarj maliyeti daha yüksektir.
actors.hero.talent.body_form.title=vücut formu
actors.hero.talent.body_replacement.desc=_+1:_ Göz kırptıktan sonra, Haydut arkasında _20 can ve 1-3 zırha_ sahip tahta bir yem bırakır.\n\n_+2:_ Göz kırptıktan sonra, Haydut arkasında _40 can ve 2-6 zırha_ sahip tahta bir yem bırakır.\n\n_+3:_ Göz kırptıktan sonra, Haydut arkasında _60 can ve 3-9 zırha_ sahip tahta bir yem bırakır.\n\n_+4:_ Göz kırptıktan sonra, Haydut arkasında _80 can ve 4-12 zırha_ sahip tahta bir yem bırakır.\n\nAynı anda yalnızca bir yem aktif olabilir.
actors.hero.talent.body_replacement.title=vücut değişimi
actors.hero.talent.body_slam.desc=_+1:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar, hasar engelleme gücünün %25'i artı _1-4_ kadar hasar alır.\n\n_+2:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar, hasar engelleme gücünün %50'si artı _2-8_ kadar hasar alır.\n\n_+3:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar, hasar engelleme gücünün %75'i artı _3-12_ kadar hasar alır.\n\n_+4:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar, hasar engelleme gücünün %100'ü artı _4-16_ kadar hasar alır.
actors.hero.talent.body_slam.title=vücut çarpması
actors.hero.talent.bounty_hunter.desc=_+1:_ Suikastçı, hazırlıklı bir vuruşla düşmanı öldürdüğünde, hazırlık seviyesi başına eşya düşürme şansı %2/%4/%8/%16 artar.\n\n_+2:_ Suikastçı, hazırlıklı bir vuruşla düşmanı öldürdüğünde, hazırlık seviyesi başına eşya düşürme şansı %4/%8/%16/%32 artar.\n\n_+3:_ Suikastçı, hazırlıklı bir vuruşla düşmanı öldürdüğünde, hazırlık seviyesi başına eşya düşürme şansı %6/%12/%24/%48 artar.
actors.hero.talent.bounty_hunter.title=ödül avcısı
actors.hero.talent.cached_rations.desc=_+1:_ Haydut, zindanın sonraki birkaç katını keşfederken sandıklarda _2 erzak paketi_ bulabilir.\n\n_+2:_ Haydut, zindanın sonraki birkaç katını keşfederken sandıklarda _3 erzak paketi_ bulabilir.\n\nErzak paketleri hızlıca tüketilir, orta derecede tokluk hissi verir, 5 can puanı iyileştirir ve gölge pelerinine 1 şarj kazandırır.
actors.hero.talent.cached_rations.title=depolanmış erzaklar
actors.hero.talent.cleanse.desc=_+1:_ Rahip, kendisinden ve yakındaki müttefiklerinden olumsuz durum etkilerini kaldıran ve onlara 10 kalkan sağlayan _Temizleme_ büyüsünü 2 kullanım karşılığında kullanabilir.\n\n_+2:_ Rahip, kendisinden ve yakındaki müttefiklerinden 3 tur boyunca olumsuz durum bağışıklığı sağlayan ve onlara 20 kalkan sağlayan _Temizleme_ büyüsünü 2 kullanım karşılığında kullanabilir.\n\n_+3:_ Rahip, kendisinden ve yakındaki müttefiklerinden 5 tur boyunca olumsuz durum bağışıklığı sağlayan ve onlara 30 kalkan sağlayan _Temizleme_ büyüsünü 2 kullanım karşılığında kullanabilir.
actors.hero.talent.cleanse.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, asa veya eser kullandıktan sonra kahramanın üzerindeki olumsuz durum etkilerini %10/20/30 olasılıkla +1/+2/+3 artırarak temizler.
actors.hero.talent.cleanse.title=temizlemek
actors.hero.talent.cleave.desc=_+1:_ Gladyatörün öldürme başına kazandığı ekstra süre 15'ten _30 tura_ çıkarıldı. _+2:_ Gladyatörün öldürme başına kazandığı ekstra süre 15'ten _45 tura_ çıkarıldı. _+3:_ Gladyatörün öldürme başına kazandığı ekstra süre 15'ten _60 tura_ çıkarıldı.
actors.hero.talent.cleave.title=yarık
actors.hero.talent.cloned_armor.desc=_+1:_ Gölge klon, kahramanın zırh değerinin %12'sini kazanır ve kahramanın zırhındaki sembolü kullanma şansı %25'tir.\n\n_+2:_ Gölge klon, kahramanın zırh değerinin %24'ünü kazanır ve kahramanın zırhındaki sembolü kullanma şansı %50'dir.\n\n_+3:_ Gölge klon, kahramanın zırh değerinin %36'sını kazanır ve kahramanın zırhındaki sembolü kullanma şansı %75'tir.\n\n_+4:_ Gölge klon, kahramanın zırh değerinin %48'ini kazanır ve kahramanın zırhındaki sembolü kullanma şansı %100'dür.
actors.hero.talent.cloned_armor.title=klonlanmış zırh
actors.hero.talent.close_the_gap.desc=_+1:_ Düellocu, düelloya başlarken hedefine doğru _en fazla iki kare_ kadar ışınlanır.\n\n_+2:_ Düellocu, düelloya başlarken hedefine doğru _en fazla üç kare_ kadar ışınlanır.\n\n_+3:_ Düellocu, düelloya başlarken hedefine doğru _en fazla dört kare_ kadar ışınlanır.\n\n_+4:_ Düellocu, düelloya başlarken hedefine doğru _en fazla beş kare_ kadar ışınlanır.\n\nBu ışınlanma, engellerden ve düşmanlardan geçebilir, ancak duvarlar gibi katı arazilerden geçemez. Düşmanın meydan okunabilecek menzilde olup olmadığını belirlerken ışınlanma dikkate alınır.
actors.hero.talent.close_the_gap.title=boşluğu kapat
actors.hero.talent.combined_energy.desc=_+1:_ Keşiş, birbirini takip eden 5 tur içinde bir silah yeteneği ve _4+ enerji_ gerektiren bir yetenek kullanırsa, harcanan 1 enerjiyi geri kazanır.\n\n_+2:_ Keşiş, birbirini takip eden 5 tur içinde bir silah yeteneği ve _3+ enerji gerektiren bir yetenek kullanırsa, harcanan 1 enerjiyi geri kazanır.\n\n_+3:_ Keşiş, birbirini takip eden 5 tur içinde bir silah yeteneği ve _2+ enerji gerektiren bir yetenek kullanırsa, harcanan 1 enerjiyi geri kazanır.
actors.hero.talent.combined_energy.title=birleşik enerji
actors.hero.talent.combined_lethality.desc=_+1:_ Şampiyon, farklı bir silahın yeteneğini kullandıktan hemen sonra yakın dövüş silahıyla saldırırsa, bu saldırı, canı %13'ün altında kalan patron olmayan tüm düşmanları öldürür.\n\n_+2:_ Şampiyon, farklı bir silahın yeteneğini kullandıktan hemen sonra yakın dövüş silahıyla saldırırsa, bu saldırı, canı %27'nin altında kalan patron olmayan tüm düşmanları öldürür.\n\n_+3:_ Şampiyon, farklı bir silahın yeteneğini kullandıktan hemen sonra yakın dövüş silahıyla saldırırsa, bu saldırı, canı %40'ın altında kalan patron olmayan tüm düşmanları öldürür.\n\nBu saldırı, normal bir yakın dövüş silahı saldırısı veya bir silah yeteneğinin parçası olabilir.
actors.hero.talent.combined_lethality.title=birleşik ölümcüllük
actors.hero.talent.conserved_magic.desc=_+1:_ Vahşi büyünün her bir darbesi artık 0,5 yerine 0,33 yük kullanıyor ve vahşi büyünün tur harcamama olasılığı %25.\n\n_+2:_ Vahşi büyünün her bir darbesi artık 0,5 yerine 0,225 yük kullanıyor ve vahşi büyünün tur harcamama olasılığı %50.\n\n_+3:_ Vahşi büyünün her bir darbesi artık 0,5 yerine 0,15 yük kullanıyor ve vahşi büyünün tur harcamama olasılığı %75.\n\n_+4:_ Vahşi büyünün her bir darbesi artık 0,5 yerine 0,1 yük kullanıyor ve vahşi büyünün tur harcamama olasılığı %100.
actors.hero.talent.conserved_magic.title=korunmuş sihir
actors.hero.talent.counter_ability.desc=_+1:_ Düellocu, hayalet görüntüsüne saldırı yapıldıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, anında _0,38 yük_ geri kazanır.\n\n_+2:_ Düellocu, hayalet görüntüsüne saldırı yapıldıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, anında _0,77 yük_ geri kazanır.\n\n_+3:_ Düellocu, hayalet görüntüsüne saldırı yapıldıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, anında _1,13 yük_ geri kazanır.\n\n_+4:_ Düellocu, hayalet görüntüsüne saldırı yapıldıktan sonraki 3 tur içinde bir silah yeteneği kullanırsa, anında _1,5 yük_ geri kazanır.
actors.hero.talent.counter_ability.title=karşı yetenek
actors.hero.talent.deadly_followup.desc=_+1:_ Düellocu fırlattığı bir silahla bir düşmana vurduğunda, 5 tur boyunca ona %10 daha fazla yakın dövüş hasarı verir.\n\n_+2:_ Düellocu fırlattığı bir silahla bir düşmana vurduğunda, 5 tur boyunca ona %20 daha fazla yakın dövüş hasarı verir.\n\n_+3:_ Düellocu fırlattığı bir silahla bir düşmana vurduğunda, 5 tur boyunca ona %30 daha fazla yakın dövüş hasarı verir.
actors.hero.talent.deadly_followup.title=ölümcül takip
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk, Berserker ölmek üzereyken ve öfke seviyesi %100 veya üzerindeyken otomatik olarak tetiklenir, ancak bu durumda _3 kahraman seviyesi_ kadar bekleme süresi vardır.\n\n_+2:_ Berserk, Berserker ölmek üzereyken ve öfke seviyesi %100 veya üzerindeyken otomatik olarak tetiklenir, ancak bu durumda _2 kahraman seviyesi_ kadar bekleme süresi vardır.\n\n_+3:_ Berserk, Berserker ölmek üzereyken ve öfke seviyesi %100 veya üzerindeyken otomatik olarak tetiklenir, ancak bu durumda _1 kahraman seviyesi_ kadar bekleme süresi vardır.\n\nBerserk sona erdiğinde 0 HP'si olsa bile Berserker'ın öleceğini unutmayın.
actors.hero.talent.deathless_fury.title=ölümsüz öfke
actors.hero.talent.deathly_durability.desc=_+1:_ Ölüm işaretiyle öldürülen düşmanlar, Rogue'a işaretlendikleri zamanki canlarının %13'üne eşit bir kalkan sağlar.\n\n_+2:_ Ölüm işaretiyle öldürülen düşmanlar, Rogue'a işaretlendikleri zamanki canlarının %25'ine eşit bir kalkan sağlar.\n\n_+3:_ Ölüm işaretiyle öldürülen düşmanlar, Rogue'a işaretlendikleri zamanki canlarının %38'ine eşit bir kalkan sağlar.\n\n_+4:_ Ölüm işaretiyle öldürülen düşmanlar, Rogue'a işaretlendikleri zamanki canlarının %50'sine eşit bir kalkan sağlar.
actors.hero.talent.deathly_durability.title=ölümcül dayanıklılık
actors.hero.talent.desperate_power.desc=_+1:_ Büyücünün asaları ve değnekleri, son şarjları kaldığında son vuruşlarında _+1 seviye_ kazanır.\n\n_+2:_ Büyücünün asaları ve değnekleri, son şarjları kaldığında son vuruşlarında _+2 seviye_ kazanır.\n\n_+3:_ Büyücünün asaları ve değnekleri, son şarjları kaldığında son vuruşlarında _+3 seviye_ kazanır.
actors.hero.talent.desperate_power.title=çaresiz güç
actors.hero.talent.directed_power.desc=_+1:_ Element vuruşundan gelen doğrudan saldırı, saldırı hedefi de dahil olmak üzere element vuruşunun etki alanındaki her düşman için _%30 büyü gücü_ kazanır.\n\n_+2:_ Element vuruşundan gelen doğrudan saldırı, saldırı hedefi de dahil olmak üzere element vuruşunun etki alanındaki her düşman için _%60 büyü gücü_ kazanır.\n\n_+3:_ Element vuruşundan gelen doğrudan saldırı, saldırı hedefi de dahil olmak üzere element vuruşunun etki alanındaki her düşman için _%90 büyü gücü_ kazanır.\n\n_+4:_ Element vuruşundan gelen doğrudan saldırı, saldırı hedefi de dahil olmak üzere element vuruşunun etki alanındaki her düşman için _%120 büyü gücü_ kazanır.
actors.hero.talent.directed_power.title=yönlendirilmiş güç
actors.hero.talent.divine_intervention.desc=_+1:_ Yükselmiş Formdayken, Rahip _İlahi Müdahale_ büyüsünü kullanabilir; bu büyü, Rahip ve tüm müttefiklerinin kalkanını _150'ye kadar_ artırır ve Yükselmiş Formu _3 tur_ uzatır._\n\n_+2:_ Yükselmiş Formdayken, Rahip _İlahi Müdahale_ büyüsünü kullanabilir; bu büyü, Rahip ve tüm müttefiklerinin kalkanını _200'e kadar_ artırır ve Yükselmiş Formu _4 tur_ uzatır._\n\n_+3:_ Yükselmiş Formdayken, Rahip _İlahi Müdahale_ büyüsünü kullanabilir; bu büyü, Rahip ve tüm müttefiklerinin kalkanını _250'ye kadar_ artırır ve Yükselmiş Formu _5 tur_ uzatır._\n\n_+4:_ Yükselmiş Formdayken Rahip, _İlahi Müdahale_ büyüsünü kullanabilir; bu büyü, Rahip ve tüm müttefiklerinin kalkanını _300'e kadar_ artırır ve Yükselmiş Formu _6 tur_ uzatır. İlahi Müdahale, tam 5 büyü kitabı yüküne mal olur ve aynı yükselmiş formda yalnızca bir kez kullanılabilir.
actors.hero.talent.divine_intervention.title=ilahi müdahale
actors.hero.talent.divine_sense.desc=_+1:_ Rahip, 50 tur boyunca 8 karelik Zihin Görüşü sağlayan ve zaman almayan, 2 yük karşılığında _İlahi Algı_ büyüsünü yapabilir.\n\n_+2:_ Rahip, 50 tur boyunca 12 karelik Zihin Görüşü sağlayan ve zaman almayan, 2 yük karşılığında _İlahi Algı_ büyüsünü yapabilir.
actors.hero.talent.divine_sense.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine +1'de 3 kare veya +2'de 5 kare menzilli bir asa veya eser kullandıktan sonra kısa bir süreliğine zihin görüşü kazandırır.
actors.hero.talent.divine_sense.title=ilahi duygu
