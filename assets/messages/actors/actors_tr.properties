actors.hero.talent.holy_intuition.desc=_+1:_ Rahip, bir eşyanın lanetli olup olmadığını ortaya çıkaran _Kutsal Sezgi_ büyüsünü _3 kullanım bedeliyle_ kullanabilir. _+2:_ Rahip, bir eşyanın lanetli olup olmadığını ortaya çıkaran _Kutsal Sezgi_ büyüsünü _2 kullanım bedeliyle_ kullanabilir.
actors.hero.talent.holy_intuition.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, kahramanın lanetli bir eşyayı kuşanmadan hemen önce lanet durumunu belirlemesini sağlar; bu, +1 seviyesinde %15, +2 seviyesinde ise %25 olasılıkla gerçekleşir.
actors.hero.talent.holy_intuition.title=kutsal sezgi
actors.hero.talent.holy_lance.desc=_+1:_ Rahip, 4 yük karşılığında _30-55 hasar_ veren yıkıcı bir büyü olan _Kutsal Mızrak_'ı kullanabilir.\n\n_+2:_ Rahip, 4 yük karşılığında _45-83 hasar_ veren yıkıcı bir büyü olan _Kutsal Mızrak_'ı kullanabilir.\n\n_+3:_ Rahip, 4 yük karşılığında _60-110 hasar_ veren yıkıcı bir büyü olan _Kutsal Mızrak_'ı kullanabilir.\n\nKutsal Mızrak, iblis ve ölümsüz düşmanlara her zaman maksimum hasar verir. Kutsal Mızrak'ın tekrar kullanılabilmesi için 30 turluk bir bekleme süresi vardır.
actors.hero.talent.holy_lance.title=kutsal mızrak
actors.hero.talent.impact_wave.desc=_+1:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _2 kare_ geriye savrulur ve 5 tur boyunca savunmasız hale gelme olasılıkları %25'tir.\n\n_+2:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _3 kare_ geriye savrulur ve 5 tur boyunca savunmasız hale gelme olasılıkları %50'dir.\n\n_+3:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _4 kare_ geriye savrulur ve 5 tur boyunca savunmasız hale gelme olasılıkları %75'tir.\n\n_+4:_ Savaşçı zıpladıktan sonra yere indiğinde, bitişik tüm düşmanlar _5 kare_ geriye savrulur ve 5 tur boyunca savunmasız hale gelme olasılıkları %100'dür.
actors.hero.talent.impact_wave.title=etki dalgası
actors.hero.talent.improvised_projectiles.desc=_+1:_ Savaşçı, fırlatılan bir silah olmayan herhangi bir eşyayı düşmana fırlatarak düşmanı _2 tur_ boyunca kör edebilir. Bunun 50 tur bekleme süresi vardır.\n\n_+2:_ Savaşçı, fırlatılan bir silah olmayan herhangi bir eşyayı düşmana fırlatarak düşmanı _3 tur_ boyunca kör edebilir. Bunun 50 tur bekleme süresi vardır.
actors.hero.talent.improvised_projectiles.title=doğaçlama mermiler
actors.hero.talent.inscribed_power.desc=_+1:_ Büyücü bir parşömen okuduğunda veya bir büyü eşyası kullandığında, sonraki 2 asa darbesi +2 seviye kazanır.\n\n_+2:_ Büyücü bir parşömen okuduğunda veya bir büyü eşyası kullandığında, sonraki 3 asa darbesi +2 seviye kazanır.\n\nGeliştirilmiş asa darbelerinin sayısı, bu parşömenler kullanılarak üretilmesi gereken yükseltme, dönüşüm veya simya eşyalarının parşömenini kullanırken iki katına çıkar.\n\nDaha yüksek çıktı miktarlarına sahip simya eşyaları için (örneğin çoğu büyü), bu yeteneğin tetiklenme şansı, o eşyadan ne kadar üretildiğine bağlıdır.
actors.hero.talent.inscribed_power.title=yazılı güç
actors.hero.talent.inscribed_stealth.desc=_+1:_ Haydut, bir parşömen okuduktan veya bir büyü eşyası kullandıktan sonra _3 tur_ görünmezlik kazanır.\n\n_+2:_ Haydut, bir parşömen okuduktan veya bir büyü eşyası kullandıktan sonra _5 tur_ görünmezlik kazanır.\n\nYükseltme parşömeni, dönüşüm parşömeni veya bu parşömenler kullanılarak üretilmesi gereken simya eşyaları kullanıldığında görünmezlik süresi iki katına çıkar.\n\nDaha yüksek çıktı miktarlarına sahip simya eşyaları için (örneğin çoğu büyü), bu yeteneğin tetiklenme şansı, o eşyadan ne kadar üretildiğine bağlıdır.
actors.hero.talent.inscribed_stealth.title=yazılı gizlilik
actors.hero.talent.invigorating_meal.desc=_+1:_ Yiyecek yemek Avcı'nın 1 turunu alır (meyveler anında yenir) ve ona _1 tur hızlanma_ kazandırır.\n\n_+2:_ Yiyecek yemek Avcı'nın 1 turunu alır (meyveler anında yenir) ve ona _2 tur hızlanma_ kazandırır.
