actors.blobs.sacrificialfire.desc=Burada üzerinde kurban ateşi yanan bir sunak var. Burada öldürülen her yaratık, zindanın ruhlarına sunulan bir kurban olarak tüketilecektir. Belki de yeterince kurban verilirse bir ödül verilir?
