actors.hero.talent.invigorating_victory.desc=_+1:_ Düellocu, düello bitmeden önce hedefini yenerse, düello sırasında aldığı hasarın %30'u artı 5 HP iyileşir.\n\n_+2:_ Düellocu, düello bitmeden önce hedefini yenerse, düello sırasında aldığı hasarın %50'si artı 10 HP iyileşir.\n\n_+3:_ Düellocu, düello bitmeden önce hedefini yenerse, düello sırasında aldığı hasarın %65'i artı 15 HP iyileşir.\n\n_+4:_ Düellocu, düello bitmeden önce hedefini yenerse, düello sırasında aldığı hasarın %75'i artı 20 HP iyileşir.
actors.hero.talent.invigorating_victory.title=canlandırıcı zafer
actors.hero.talent.iron_stomach.desc=_+1:_ Yemek yemek Savaşçının 1 turunu alır ve yemek yerken ona %75 hasar direnci kazandırır.\n\n_+2:_ Yemek yemek Savaşçının 1 turunu alır ve yemek yerken ona %100 hasar direnci kazandırır.
actors.hero.talent.iron_stomach.title=demir mide
actors.hero.talent.iron_will.desc=_+1:_ Savaşçı mührünün sağladığı kalkan _1 artırılır_.\n\n_+2:_ Savaşçı mührünün sağladığı kalkan _2 artırılır_.
