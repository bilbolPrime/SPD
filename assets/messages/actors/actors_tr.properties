actors.hero.talent.hold_fast.desc=_+1:_ Savaşçı beklediğinde _1-2 zırh_ kazanır ve hareket edene kadar kombo ve kalkan güçlendirmelerinin azalmasını _%50_ yavaşlatır.\n\n_+2:_ Savaşçı beklediğinde _2-4 zırh_ kazanır ve hareket edene kadar kombo ve kalkan güçlendirmelerinin azalmasını _%75_ yavaşlatır.\n\n_+3:_ Savaşçı beklediğinde _3-6 zırh_ kazanır ve hareket edene kadar kombo ve kalkan güçlendirmelerinin azalmasını _%100_ yavaşlatır.
