actors.hero.talent.iron_will.title=demir irade
actors.hero.talent.judgement.desc=_+1:_ Yükselmiş Formdayken, Rahip tüm görünür düşmanlara _10-20 hasar_ veren _Yargı_ büyüsünü kullanabilir.\n\n_+2:_ Yükselmiş Formdayken, Rahip tüm görünür düşmanlara _15-30 hasar_ veren _Yargı_ büyüsünü kullanabilir.\n\n_+3:_ Yükselmiş Formdayken, Rahip tüm görünür düşmanlara _20-40 hasar_ veren _Yargı_ büyüsünü kullanabilir.\n\n_+4:_ Yükselmiş Formdayken, Rahip tüm görünür düşmanlara _25-50 hasar_ veren _Yargı_ büyüsünü kullanabilir.\n\nYargı büyüsü 3 büyü kitabı kullanım bedeline mal olur. Yargı, Rahibin yükselmiş forma girdikten sonra veya Yargı'nın son kullanımından bu yana kullandığı her büyü için %33 daha fazla hasar verir.
actors.hero.talent.judgement.title=karar
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladin, yakındaki bir karakteri anında _15 HP_ iyileştiren veya Paladine _15 kalkan_ kazandıran _Lay on Hands_ büyüsünü 1 yük karşılığında kullanabilir.\n\n_+2:_ Paladin, yakındaki bir karakteri anında _20 HP_ iyileştiren veya Paladine _20 kalkan_ kazandıran _Lay on Hands_ büyüsünü 1 yük karşılığında kullanabilir.\n\n_+3:_ Paladin, yakındaki bir karakteri anında _25 HP_ iyileştiren veya Paladine _25 kalkan_ kazandıran _Lay on Hands_ büyüsünü 1 yük karşılığında kullanabilir.\n\nBu büyüden gelen fazla iyileştirme kalkana dönüştürülür. Şifa verme büyüsü tekrar tekrar kullanılabilir, ancak aynı anda üç büyünün sağladığı korumadan fazlasını uygulayamaz.
actors.hero.talent.lay_on_hands.title=elleri üzerine koy
actors.hero.talent.lethal_defense.desc=_+1:_ Gladyatör bir düşmanı kombo hareketle öldürdüğünde, kırık mühür kalkanının bekleme süresi _50 tur azaltılır_.\n\n_+2:_ Gladyatör bir düşmanı kombo hareketle öldürdüğünde, kırık mühür kalkanının bekleme süresi _100 tur azaltılır_.\n\n_+3:_ Gladyatör bir düşmanı kombo hareketle öldürdüğünde, kırık mühür kalkanının bekleme süresi _150 tur azaltılır_.\n\n Bu yetenek sayesinde kalkanın bekleme süresi -150 tura kadar düşürülebilir, bu da etkinleştirildikten hemen sonra tekrar kullanılabilir olacağı anlamına gelir.
actors.hero.talent.lethal_defense.title=ölümcül savunma
actors.hero.talent.lethal_haste.desc=_+1:_ Düellocu, silah yeteneğiyle bir düşmana öldürücü darbe indirdiğinde, _3 tur_ değerinde anlık hareket kazanır.\n\n_+2:_ Düellocu, silah yeteneğiyle bir düşmana öldürücü darbe indirdiğinde, _5 tur_ değerinde anlık hareket kazanır.
actors.hero.talent.lethal_haste.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine normal silah saldırılarıyla tetiklenir ve 100 turluk bir bekleme süresi olur.
actors.hero.talent.lethal_haste.title=ölümcül acele
actors.hero.talent.lethal_momentum.desc=_+1:_ Savaşçı, fiziksel bir silahla düşmana öldürücü bir darbe indirdiğinde, 0 tur alma olasılığı %67'dir.\n\n_+2:_ Savaşçı, fiziksel bir silahla düşmana öldürücü bir darbe indirdiğinde, 0 tur alma olasılığı %100'dür.
actors.hero.talent.lethal_momentum.title=ölümcül ivme
actors.hero.talent.life_link.desc=Rahip, 2 kullanım bedeli karşılığında kendisiyle güçlendirilmiş bir müttefiki arasında _Yaşam Bağlantısı_ büyüsünü yapabilir. Bu büyü, hasarın Rahip ve müttefiki arasında paylaşılmasına neden olur ve eğer etkilenen taraf varsa, 3. seviye veya daha düşük seviyedeki faydalı rahip büyülerinin her ikisine de uygulanmasını sağlar.\n\n_+1:_ Yaşam Bağlantısı _10 tur_ sürer ve Çoklu Güç'ün alınan hasar bonusunu _-%35'e_ yükseltir._\n\n_+2:_ Yaşam Bağlantısı _13 tur_ sürer ve Çoklu Güç'ün alınan hasar bonusunu _-%40'a_ yükseltir._\n\n_+3:_ Yaşam Bağlantısı _17 tur_ sürer ve Çoklu Güç'ün alınan hasar bonusunu _-%45'e_ yükseltir._\n\n_+4:_ Yaşam Bağlantısı _20 tur_ sürer ve Çoklu Güç'ün alınan hasar bonusunu _-%50'ye_ yükseltir._
actors.hero.talent.life_link.title=yaşam bağlantısı
actors.hero.talent.light_cloak.desc=_+1:_ Haydut, gölge pelerinini takılı değilken de kullanabilir, ancak takılı değilken %25 hızla şarj olur.\n\n_+2:_ Haydut, gölge pelerinini takılı değilken de kullanabilir, ancak takılı değilken %50 hızla şarj olur.\n\n_+3:_ Haydut, gölge pelerinini takılı değilken de kullanabilir, ancak takılı değilken %75 hızla şarj olur.
actors.hero.talent.light_cloak.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine tüm eserlerin şarj hızını +1/+2/+3 seviyesinde %7/13/20 oranında artıracaktır.
actors.hero.talent.light_cloak.title=hafif pelerin
actors.hero.talent.light_reading.desc=_+1:_ Rahip, kutsal kitabını kuşanmadığı zamanlarda da kullanabilir, ancak kuşanmadığında %25 hızla şarj olur.\n\n_+2:_ Rahip, kutsal kitabını kuşanmadığı zamanlarda da kullanabilir, ancak kuşanmadığında %50 hızla şarj olur.\n\n_+3:_ Rahip, kutsal kitabını kuşanmadığı zamanlarda da kullanabilir, ancak kuşanmadığında %75 hızla şarj olur.
actors.hero.talent.light_reading.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine tüm asaların şarj hızını +1/+2/+3 seviyesinde %7/13/20 oranında artıracaktır.
actors.hero.talent.light_reading.title=Hafif Okuma
actors.hero.talent.lingering_magic.desc=_+1:_ Büyücü asa veya değnekle vurduğunda, sonraki fiziksel saldırısı _1-2 bonus hasar_ verir.\n\n_+2:_ Büyücü asa veya değnekle vurduğunda, sonraki fiziksel saldırısı _2 bonus hasar_ verir.
actors.hero.talent.lingering_magic.title=kalıcı sihir
actors.hero.talent.liquid_agility.desc=_+1:_ Bir iksir, karışım veya şifalı içecek içerken veya fırlatırken, Düellocu 5 tur içinde bir sonraki yakın dövüş saldırısında _3 kat kaçınma_ ve _3 kat isabet_ kazanır.\n\n_+2:_ Bir iksir, karışım veya şifalı içecek içerken veya fırlatırken, Düellocu 5 tur içinde bir sonraki yakın dövüş saldırısında _sonsuz kaçınma_ ve _sonsuz isabet_ kazanır.\n\nBu bonus, güç, deneyim iksirleri veya bu iksirleri kullanarak üretilmesi gereken simya eşyaları kullanıldığında bir ek tur ve saldırı boyunca sürer.\n\nDaha yüksek çıktı miktarlarına sahip simya eşyaları için (örneğin, su karışımı), bu yeteneğin tetiklenme şansı, o eşyadan ne kadar üretildiğine bağlıdır.
actors.hero.talent.liquid_agility.title=sıvı çevikliği
actors.hero.talent.liquid_nature.desc=_+1:_ Avcı bir iksir, karışım veya şifalı su içtiğinde veya fırlattığında, çevredeki alanda _en fazla 4 çimen karesi_ filizlenir ve bitişik düşmanlar _1 tur_ boyunca köklenir.\n\n_+2:_ Avcı bir iksir, karışım veya şifalı su içtiğinde veya fırlattığında, çevredeki alanda _en fazla 6 çimen karesi_ filizlenir ve bitişik düşmanlar _2 tur_ boyunca köklenir.\n\nGüç, deneyim veya bu iksirlerle üretilmesi gereken simya eşyaları kullanıldığında çimen miktarı ve köklenme süresi iki katına çıkar.\n\nDaha yüksek çıktı miktarlarına sahip simya eşyaları için (örneğin, su karışımı), bu yeteneğin tetiklenme şansı, bu eşyadan ne kadar üretildiğine bağlıdır.
actors.hero.talent.liquid_nature.title=sıvı doğası
actors.hero.talent.liquid_willpower.desc=_+1:_ Savaşçı, bir iksir, karışım veya şifalı su içtiğinde veya fırlattığında maksimum HP'sinin %6,5'i kadar kalkan kazanır.\n\n_+2:_ Savaşçı, bir iksir, karışım veya şifalı su içtiğinde veya fırlattığında maksimum HP'sinin %10'u kadar kalkan kazanır.\n\nKalkan miktarı, güç, deneyim iksirleri veya bu iksirlerle üretilmesi gereken simya eşyaları kullanıldığında iki katına çıkar.\n\nDaha yüksek çıktı miktarlarına sahip simya eşyaları için (örneğin, su karışımı), bu yeteneğin tetiklenme şansı, o eşyadan ne kadar üretildiğine bağlıdır.
actors.hero.talent.liquid_willpower.title=sıvı irade
actors.hero.talent.longrange_warp.desc=_+1:_ Büyücü artık katlar arasında %150 şarj maliyetiyle ışınlanabilir.\n\n_+2:_ Büyücü artık katlar arasında %117 şarj maliyetiyle ışınlanabilir.\n\n_+3:_ Büyücü artık katlar arasında %83 şarj maliyetiyle ışınlanabilir.\n\n_+4:_ Büyücü artık katlar arasında %50 şarj maliyetiyle ışınlanabilir.\n\nBüyücü, kilitli bir kattan ayrılmak için uzun menzilli ışınlanmayı kullanamaz.
actors.hero.talent.longrange_warp.title=Uzun Menzilli Çarpıtma
actors.hero.talent.mind_form.desc=Rahip, 3 kullanım bedeli karşılığında, bu turda kullandığı bir asa veya fırlatılan silahın gücünü Trinity'ye aktaran _Zihin Formu_ büyüsünü kullanabilir. _+1:_ Trinity kullanıldığında, Rahip seçilen eşyanın yıldırım veya fırlatma etkisini, sanki _+3_miş gibi kullanır. _+2:_ Trinity kullanıldığında, Rahip seçilen eşyanın yıldırım veya fırlatma etkisini, sanki _+4_miş gibi kullanır. _+3:_ Trinity kullanıldığında, Rahip seçilen eşyanın yıldırım veya fırlatma etkisini, sanki _+5_miş gibi kullanır. _+4:_ Trinity kullanıldığında, Rahip seçilen eşyanın yıldırım veya fırlatma etkisini, sanki _+5_miş gibi kullanır. _+6._\n\nTrinity'ye aynı anda yalnızca bir zihin etkisi yüklenebilir.
actors.hero.talent.mind_form.title=zihin formu
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Rahip, bir müttefik/düşman üzerindeki güçlendirme/zayıflatma etkilerini 1 yük karşılığında _3 tur_ uzatan bir büyü olan _Hafıza Duası_nı kullanabilir.\n\n_+2:_ Rahip, bir müttefik/düşman üzerindeki güçlendirme/zayıflatma etkilerini 1 yük karşılığında _4 tur_ uzatan bir büyü olan _Hafıza Duası_nı kullanabilir.\n\n_+3:_ Rahip, bir müttefik/düşman üzerindeki güçlendirme/zayıflatma etkilerini 1 yük karşılığında _5 tur_ uzatan bir büyü olan _Hafıza Duası_nı kullanabilir.\n\nHafıza Duası'nın kullanımı zaman almaz. Hafıza Duası, belirli bir güçlendirme/zayıflatma etkisini yalnızca bir kez uzatabilir ve zırh yeteneklerinden gelen güçlendirmeleri uzatamaz.
actors.hero.talent.mnemonic_prayer.title=ezberleme duası
actors.hero.talent.monastic_vigor.desc=_+1:_ Keşişin enerjisi %100 ise yetenekleri güçlenir.\n\n_+2:_ Keşişin enerjisi %80 veya daha fazla ise yetenekleri güçlenir.\n\n_+3:_ Keşişin enerjisi %60 veya daha fazla ise yetenekleri güçlenir.\n\nGüçlendirildiğinde:\n- Hızlı Saldırı, silahınızın büyüsünü uygular\n- Odaklanma anında gerçekleşir\n- Atılma menzili +4 artar\n- Ejderha Tekmesi %50 daha fazla hasar verir ve geri itme ve sersemletme etkisini tüm bitişik düşmanlara uygular\n- Meditasyon, eksik HP'nin %20'sini yavaşça iyileştirir ve %80 hasar direnci sağlar.
actors.hero.talent.monastic_vigor.title=manastır canlılığı
actors.hero.talent.mystical_charge.desc=_+1:_ Asasıyla vurmak, Savaş Büyücüsüne _0,5 tur_ değerinde eser şarjı kazandırır.\n\n_+2:_ Asasıyla vurmak, Savaş Büyücüsüne _1 tur_ değerinde eser şarjı kazandırır.\n\n_+3:_ Asasıyla vurmak, Savaş Büyücüsüne _1,5 tur_ değerinde eser şarjı kazandırır.
actors.hero.talent.mystical_charge.title=mistik yük
actors.hero.talent.mystical_meal.desc=_+1:_ Yemek yemek, Haydut'un 1 turunu alır (erzaklar anında tüketilir) ve ona _3 tur boyunca eser şarjı_ kazandırır.\n\n_+2:_ Yemek yemek, Haydut'un 1 turunu alır (erzaklar anında tüketilir) ve ona _5 tur boyunca eser şarjı_ kazandırır.\n\nBu yetenek, bereket boynuzunun kendini şarj etmesine izin vermek için kullanılamaz.
actors.hero.talent.mystical_meal.title=mistik yemek
actors.hero.talent.natures_aid.desc=_+1:_ Avcı, görüş alanında bir bitkinin etkisi aktifleştiğinde her _3 turda_ kaybolan 0-2 ağaç kabuğu zırhı kazanır.\n\n_+2:_ Avcı, görüş alanında bir bitkinin etkisi aktifleştiğinde her _5 turda_ kaybolan 0-2 ağaç kabuğu zırhı kazanır.
actors.hero.talent.natures_aid.title=doğanın yardımı
actors.hero.talent.natures_bounty.desc=_+1:_ Avcı, zindanın sonraki birkaç katını keşfederken uzun otların arasında gizlenmiş _4 meyve_ bulabilir.\n\n_+2:_ Avcı, zindanın sonraki birkaç katını keşfederken uzun otların arasında gizlenmiş _6 meyve_ bulabilir.\n\n Meyveler hızlıca yenir, az miktarda tokluk hissi verir ve kullanılabilir bir tohum içerebilir.
actors.hero.talent.natures_bounty.title=doğanın cömertliği
actors.hero.talent.natures_wrath.desc=_+1:_ Doğa gücü aktifken, ruh yayından yapılan atışların rastgele zararlı bir bitki etkisi tetikleme olasılığı %8'dir.\n\n_+2:_ Doğa gücü aktifken, ruh yayından yapılan atışların rastgele zararlı bir bitki etkisi tetikleme olasılığı %17'dir.\n\n_+3:_ Doğa gücü aktifken, ruh yayından yapılan atışların rastgele zararlı bir bitki etkisi tetikleme olasılığı %25'tir.\n\n_+4:_ Doğa gücü aktifken, ruh yayından yapılan atışların rastgele zararlı bir bitki etkisi tetikleme olasılığı %33'tür.\n\n Tetiklenebilecek bitkiler şunlardır: kör otu, ateş çiçeği, buz şapkası, keder yosunu ve fırtına sarmaşığı.
actors.hero.talent.natures_wrath.title=doğanın gazabı
actors.hero.talent.necromancers_minions.desc=_+1:_ Ruhla işaretlenmiş bir düşman öldüğünde, Büyücünün onu yozlaşmış bir hayalet olarak diriltme şansı %13'tür.\n\n_+2:_ Ruhla işaretlenmiş bir düşman öldüğünde, Büyücünün onu yozlaşmış bir hayalet olarak diriltme şansı %27'dir.\n\n_+3:_ Ruhla işaretlenmiş bir düşman öldüğünde, Büyücünün onu yozlaşmış bir hayalet olarak diriltme şansı %40'tır.
actors.hero.talent.necromancers_minions.title=nekromancer'ın hizmetkarları
actors.hero.talent.patient_strike.desc=_+1:_ Düellocu yakın dövüş saldırısı yapmadan önce beklerse, _1-2 bonus hasar_ verir.\n\n_+2:_ Düellocu yakın dövüş saldırısı yapmadan önce beklerse, _2 bonus hasar_ verir.
actors.hero.talent.patient_strike.title=hasta grevi
actors.hero.talent.perfect_copy.desc=_+1:_ Gölge klon, kahramanın maksimum canının %10'unu kazanır ve kahramanla en fazla 1 kare uzaklıkta anında yer değiştirebilir.\n\n_+2:_ Gölge klon, kahramanın maksimum canının %20'sini kazanır ve kahramanla en fazla 2 kare uzaklıkta anında yer değiştirebilir.\n\n_+3:_ Gölge klon, kahramanın maksimum canının %30'unu kazanır ve kahramanla en fazla 3 kare uzaklıkta anında yer değiştirebilir.\n\n_+4:_ Gölge klon, kahramanın maksimum canının %40'ını kazanır ve kahramanla en fazla 4 kare uzaklıkta anında yer değiştirebilir.
actors.hero.talent.perfect_copy.title=mükemmel kopya
actors.hero.talent.point_blank.desc=_+1:_ Avcı, yayını veya fırlatılan bir silahı yakın mesafede kullandığında isabet oranı -%50 yerine -%25 olur.\n\n_+2:_ Avcı, yayını veya fırlatılan bir silahı yakın mesafede kullandığında isabet oranı -%50 yerine normal olur.\n\n_+3:_ Avcı, yayını veya fırlatılan bir silahı yakın mesafede kullandığında isabet oranı -%50 yerine +%25 olur.\n\nNot: Fırlatılan silahlar veya ruh yayı, uzaktan kullanıldığında her zaman +%50 isabet oranına sahiptir.
actors.hero.talent.point_blank.title=net
actors.hero.talent.precise_assault.desc=_+1:_ Düellocu bir silah yeteneği kullandığında, 5 tur içindeki bir sonraki yakın dövüş saldırısında _2 kat isabet_ kazanır.\n\n_+2:_ Düellocu bir silah yeteneği kullandığında, 5 tur içindeki bir sonraki yakın dövüş saldırısında _5 kat isabet_ kazanır.\n\n_+3:_ Düellocu bir silah yeteneği kullandığında, 5 tur içindeki bir sonraki yakın dövüş saldırısında _sonsuz isabet_ kazanır.
actors.hero.talent.precise_assault.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine yakın dövüş isabet oranını +1'de %10, +2'de %20 veya +3'te %30 artıracaktır.
actors.hero.talent.precise_assault.title=kesin saldırı
actors.hero.talent.projectile_momentum.desc=_+1:_ Serbest koşu sırasında, Serbest Koşucu fırlatılan silahlarla _%50 isabet ve %15 hasar artışı_ kazanır.\n\n_+2:_ Serbest koşu sırasında, Serbest Koşucu fırlatılan silahlarla _%100 isabet ve %30 hasar artışı_ kazanır.\n\n_+3:_ Serbest koşu sırasında, Serbest Koşucu fırlatılan silahlarla _%150 isabet ve %45 hasar artışı_ kazanır.
actors.hero.talent.projectile_momentum.title=mermi momentumu
actors.hero.talent.projecting_blades.desc=_+1:_ Spektral bıçakların isabet oranı %25 daha yüksektir ve 2 katı karoya kadar delebilir.\n\n_+2:_ Spektral bıçakların isabet oranı %50 daha yüksektir ve 4 katı karoya kadar delebilir.\n\n_+3:_ Spektral bıçakların isabet oranı %75 daha yüksektir ve 6 katı karoya kadar delebilir.\n\n_+4:_ Spektral bıçakların isabet oranı %100 daha yüksektir ve 8 katı karoya kadar delebilir.
actors.hero.talent.projecting_blades.title=çıkıntılı bıçaklar
actors.hero.talent.protective_shadows.desc=_+1:_ Haydut, görünmez olduğu her iki turda bir kalkan kazanır, en fazla 3'e kadar.\n\n_+2:_ Haydut, görünmez olduğu her turda bir kalkan kazanır, en fazla 5'e kadar.
actors.hero.talent.protective_shadows.title=koruyucu gölgeler
actors.hero.talent.provoked_anger.desc=_+1:_ Savaşçıya uygulanan herhangi bir kalkan güçlendirmesi hasar nedeniyle kırıldığında, bir sonraki fiziksel saldırısı _3 ek hasar_ verecektir.\n\n_+2:_ Savaşçıya uygulanan herhangi bir kalkan güçlendirmesi hasar nedeniyle kırıldığında, bir sonraki fiziksel saldırısı _5 ek hasar_ verecektir.
actors.hero.talent.provoked_anger.title=öfkeye yol açtı
actors.hero.talent.ratforcements.desc=_+1:_ Kendinize Ratmogrify uygulayarak yanınıza 1 müttefik keseli sıçan _oluşturursunuz.\n\n_+2:_ Kendinize Ratmogrify uygulayarak yanınıza 2 müttefik keseli sıçan _oluşturursunuz.\n\n_+3:_ Kendinize Ratmogrify uygulayarak yanınıza 3 müttefik keseli sıçan _oluşturursunuz.\n\n_+4:_ Kendinize Ratmogrify uygulayarak yanınıza 4 müttefik keseli sıçan _oluşturursunuz.
actors.hero.talent.ratforcements.title=yaptırımlar
actors.hero.talent.ratlomacy.desc=_+1:_ Ratmogrify büyüsünü ratmogrify edilmiş bir düşmana uygulamak, onları dost canlısı yapar ve dönüşümü kalıcı hale getirir.\n\n_+2:_ Ratmogrify büyüsünü ratmogrify edilmiş bir düşmana uygulamak, onları dost canlısı yapar, dönüşümü kalıcı hale getirir ve onlara _2 tur_ adrenalin verir.\n\n_+3:_ Ratmogrify büyüsünü ratmogrify edilmiş bir düşmana uygulamak, onları dost canlısı yapar, dönüşümü kalıcı hale getirir ve onlara _4 tur_ adrenalin verir.\n\n_+4:_ Ratmogrify büyüsünü ratmogrify edilmiş bir düşmana uygulamak, onları dost canlısı yapar, dönüşümü kalıcı hale getirir ve onlara _6 tur_ adrenalin verir.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratsistance.desc=_+1:_ Düşman sıçanlaşmış düşmanlar _-10% hasar_ verir.\n\n_+2:_ Düşman sıçanlaşmış düşmanlar _-19% hasar_ verir.\n\n_+3:_ Düşman sıçanlaşmış düşmanlar _-27% hasar_ verir.\n\n_+4:_ Düşman sıçanlaşmış düşmanlar _-35% hasar_ verir.
actors.hero.talent.ratsistance.title=fare direnci
actors.hero.talent.reactive_barrier.desc=_+1:_ Büyücü, element patlamasından etkilenen her karakter için _2,5 kalkan_ kazanır, en fazla 5 karakter.\n\n_+2:_ Büyücü, element patlamasından etkilenen her karakter için _5 kalkan_ kazanır, en fazla 6 karakter.\n\n_+3:_ Büyücü, element patlamasından etkilenen her karakter için _7,5 kalkan_ kazanır, en fazla 7 karakter.\n\n_+4:_ Büyücü, element patlamasından etkilenen her karakter için _10 kalkan_ kazanır, en fazla 8 karakter.
actors.hero.talent.reactive_barrier.title=reaktif bariyer
actors.hero.talent.recall_inscription.desc=_+1:_ Rahip, kullandığı son rün taşı veya parşömenin etkisini _10 tur_ içinde tekrarlamasını sağlayan _Yazıtı Geri Çağırma_ büyüsünü kullanabilir. _+2:_ Rahip, kullandığı son rün taşı veya parşömenin etkisini _300 tur_ içinde tekrarlamasını sağlayan _Yazıtı Geri Çağırma_ büyüsünü kullanabilir. _Yazıtı Geri Çağırma, yükseltme parşömenleriyle kullanılamaz. Bu büyünün kullanım maliyeti, yakın zamanda kullanılan eşyaya bağlı olarak değişir: rün taşı için 2, parşömen için 3, egzotik parşömen için 4. Bu kullanım maliyeti, dönüşüm parşömeni veya dönüşüm veya yükseltme kullanılarak üretilmesi gereken simya eşyalarıyla kullanıldığında da iki katına çıkar.
actors.hero.talent.recall_inscription.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine herhangi bir parşömen veya rün taşının %10 olasılıkla +1 veya %15 olasılıkla +2 olarak iadesini sağlar. Yükseltme parşömenleri bu etkiden muaftır.
actors.hero.talent.recall_inscription.refunded=Ödemeniz iade edildi!
actors.hero.talent.recall_inscription.title=hatırlama yazısı
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Avcı kısa otlara veya közlere bastığında, bunlar hemen uzun otlara dönüşür ve Avcı bunları hemen sürer. Bunun _10 tur bekleme süresi_ vardır.\n\n_+2:_ Avcı kısa otlara veya közlere bastığında, bunlar hemen uzun otlara dönüşür ve Avcı bunları hemen sürer. Bunun _5 tur bekleme süresi_ vardır.\n\nBu yetenek, pasif yenilenme etkileri devre dışı bırakıldığında veya kahraman uzun süredir deneyim kazanmadığında sürülmüş otlar üretir.
actors.hero.talent.rejuvenating_steps.title=gençleştirici adımlar
actors.hero.talent.remote_beacon.desc=_+1:_ Büyücü, _4 kare_ içindeki herhangi bir yere işaret feneri yerleştirebilir.\n\n_+2:_ Büyücü, _8 kare_ içindeki herhangi bir yere işaret feneri yerleştirebilir.\n\n_+3:_ Büyücü, _12 kare_ içindeki herhangi bir yere işaret feneri yerleştirebilir.\n\n_+4:_ Büyücü, _16 kare_ içindeki herhangi bir yere işaret feneri yerleştirebilir.\n\nBüyücü, erişilemeyen yerlere işaret feneri yerleştiremez.
actors.hero.talent.remote_beacon.title=Uzaktan İşaretleyici
actors.hero.talent.rogues_foresight.desc=_+1:_ Haydut, gizli bir oda bulunan bir seviyedeyken, seviyenin gizli bir oda içerdiğini fark etme olasılığı %75'tir._\n\n_+2:_ Haydut, gizli bir oda bulunan bir seviyedeyken, seviyenin gizli bir oda içerdiğini fark etme olasılığı %100'dür.
actors.hero.talent.rogues_foresight.title=haydutun öngörüsü
actors.hero.talent.runic_transference.desc=_+1:_ Savaşçının kırık mührü, yükseltmeyi aktardığı gibi _normal sembolleri_ de aktarabilir.\n\n_+2:_ Savaşçının kırık mührü, yükseltmeyi aktardığı gibi _normal, güçlü ve lanet sembollerini_ de aktarabilir.\n\nMühür, yalnızca mühür takılıyken zırha uygulanmış sembolleri aktarabilir.
actors.hero.talent.runic_transference.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine zırhınızdaki sembollerin yükseltme parşömenleri tarafından kaldırılmasına karşı direncini artıracaktır. Semboller, +1'de 6. seviyeden (4. seviyeden) veya +2'de 7. seviyeden (4. seviyeden) itibaren yükseltildiğinde kaybolmaya başlayacaktır. Sembollerin kesinlikle kaybolacağı seviye +8'de değişmeden kalır.
actors.hero.talent.runic_transference.title=runik aktarım
actors.hero.talent.satiated_spells.desc=_+1:_ Yemek yemek, Rahibin bir sonraki büyü yapışında _3 kalkan_ kazanmasına neden olur.\n\n_+2:_ Yemek yemek, Rahibin bir sonraki büyü yapışında _5 kalkan_ kazanmasına neden olur.
actors.hero.talent.satiated_spells.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine anında kalkan sağlayacak ve bu kalkan 10 tur sonra normal şekilde azalmaya başlayacaktır.
actors.hero.talent.satiated_spells.title=Doygunluk Büyüleri
actors.hero.talent.scholars_intuition.desc=_+1:_ Büyücü asaları _3 kat daha hızlı_ tanımlar.\n\n_+2:_ Büyücü asaları _kullandığı zaman_ tanımlar.
actors.hero.talent.scholars_intuition.title=bilim insanının sezgisi
actors.hero.talent.searing_light.desc=_+1:_ Rahibin _Yol Gösteren Işık_ ile aydınlatılmış düşmanlara yaptığı fiziksel saldırılar _+3 hasar verir._\n\n_+2:_ Rahibin _Yol Gösteren Işık_ ile aydınlatılmış düşmanlara yaptığı fiziksel saldırılar _+5 hasar verir._
actors.hero.talent.searing_light.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine düşmana asa veya eser kullanıldıktan sonra 20 turluk bekleme süresiyle bonus hasar verecektir.
actors.hero.talent.searing_light.title=Yakıcı Işık
actors.hero.talent.seer_shot.desc=_+1:_ Avcı yere ok attığında, etrafındaki 3x3'lük bir alanda _5 tur_ boyunca görüş sağlar. Bunun 20 turluk bir bekleme süresi vardır.\n\n_+2:_ Avcı yere ok attığında, etrafındaki 3x3'lük bir alanda _10 tur_ boyunca görüş sağlar. Bunun 20 turluk bir bekleme süresi vardır.\n\n_+3:_ Avcı yere ok attığında, etrafındaki 3x3'lük bir alanda _15 tur_ boyunca görüş sağlar. Bunun 20 turluk bir bekleme süresi vardır.
actors.hero.talent.seer_shot.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, fırlatılan herhangi bir silahtan tetiklenecektir.
actors.hero.talent.seer_shot.title=kahin atışı
actors.hero.talent.shadow_blade.desc=_+1:_ Gölge klon, her turda kahramanın hasarının %8'ini kazanır ve kahramanın silahındaki büyüyü kullanma şansı %25'tir.\n\n_+2:_ Gölge klon, her turda kahramanın hasarının %16'sını kazanır ve kahramanın silahındaki büyüyü kullanma şansı %50'dir.\n\n_+3:_ Gölge klon, her turda kahramanın hasarının %24'ünü kazanır ve kahramanın silahındaki büyüyü kullanma şansı %75'tir.\n\n_+4:_ Gölge klon, her turda kahramanın hasarının %32'sini kazanır ve kahramanın silahındaki büyüyü kullanma şansı %100'dür.
actors.hero.talent.shadow_blade.title=gölge bıçağı
actors.hero.talent.shadow_step.desc=_+1:_ Haydut görünmezken sis bombası kullanırsa, anında gerçekleşir ve şarj maliyeti %16 azalır, ancak düşmanları kör etmez veya diğer yetenekleri tetiklemez.\n\n_+2:_ Haydut görünmezken sis bombası kullanırsa, anında gerçekleşir ve şarj maliyeti %30 azalır, ancak düşmanları kör etmez veya diğer yetenekleri tetiklemez.\n\n_+3:_ Haydut görünmezken sis bombası kullanırsa, anında gerçekleşir ve şarj maliyeti %41 azalır, ancak düşmanları kör etmez veya diğer yetenekleri tetiklemez.\n\n_+4:_ Haydut görünmezken sis bombası kullanırsa, anında gerçekleşir ve şarj maliyeti %50 azalır, ancak düşmanları kör etmez veya diğer yetenekleri tetiklemez.
actors.hero.talent.shadow_step.title=gölge adımı
actors.hero.talent.shared_enchantment.desc=_+1:_ Fırlatılan silahların, Keskin Nişancı yayındaki büyüyü kullanma şansı %33'tür.\n\n_+2:_ Fırlatılan silahların, Keskin Nişancı yayındaki büyüyü kullanma şansı %67'dir.\n\n_+3:_ Fırlatılan silahların, Keskin Nişancı yayındaki büyüyü kullanma şansı %100'dür.\n\nYayın büyüsü, fırlatılan silahın zaten sahip olduğu büyüye ek olarak tetiklenebilir.
actors.hero.talent.shared_enchantment.title=paylaşılan büyü
actors.hero.talent.shared_upgrades.desc=_+1:_ Keskin nişancı, yükseltilmiş fırlatma silahıyla saldırdığında, her seviye keskin nişancı işaretinin süresini 1 tur ve özel saldırısının hasarını %16 artırır; maksimum süre +2'de _2 tur ve +%33 hasar_ olur.\n\n_+2:_ Keskin nişancı, yükseltilmiş fırlatma silahıyla saldırdığında, her seviye keskin nişancı işaretinin süresini 1 tur ve özel saldırısının hasarını %16 artırır; maksimum süre +4'te _4 tur ve +%67 hasar_ olur.\n\n_+3:_ Keskin nişancı, yükseltilmiş fırlatma silahıyla saldırdığında, her seviye keskin nişancı işaretinin süresini 1 tur ve özel saldırısının hasarını %16 artırır; maksimum süre +6'da _6 tur ve +%100 hasar_ olur.
actors.hero.talent.shared_upgrades.title=paylaşılan yükseltmeler
actors.hero.talent.shield_battery.desc=_+1:_ Büyücü, asasıyla kendine hedef alarak tüm yüklerini, yük başına _maksimum HP'nin %4'ü_ oranında kalkanlamaya dönüştürebilir.\n\n_+2:_ Büyücü, asasıyla kendine hedef alarak tüm yüklerini, yük başına _maksimum HP'nin %6'sı_ oranında kalkanlamaya dönüştürebilir.
actors.hero.talent.shield_battery.title=koruma pili
actors.hero.talent.shield_of_light.desc=_+1:_ Rahip, anında uygulanan ve 1 yük karşılığında hedefe karşı 5 tur boyunca _2-4 zırh_ sağlayan _Işık Kalkanı_ büyüsünü yapabilir.\n\n_+2:_ Rahip, anında uygulanan ve 1 yük karşılığında hedefe karşı 5 tur boyunca _3-6 zırh_ sağlayan _Işık Kalkanı_ büyüsünü yapabilir.
actors.hero.talent.shield_of_light.meta_desc=_Bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine hedeflediğiniz düşmandan alınan fiziksel hasarı %33 oranında (+1 seviyesinde) veya %50 oranında (+2 seviyesinde) azaltır.
actors.hero.talent.shield_of_light.title=ışık kalkanı
actors.hero.talent.shielding_dew.desc=_+1:_ Çiğ damlaları, Muhafızın canı tam doluyken, maksimum canının %20'sine kadar kalkan görevi görebilir.\n\n_+2:_ Çiğ damlaları, Muhafızın canı tam doluyken, maksimum canının %40'ına kadar kalkan görevi görebilir.\n\n_+3:_ Çiğ damlaları, Muhafızın canı tam doluyken, maksimum canının %60'ına kadar kalkan görevi görebilir.
actors.hero.talent.shielding_dew.title=çiğden koruyucu
actors.hero.talent.shock_force.desc=_+1:_ Şok dalgası %20 daha fazla hasar verir ve sakatlamak yerine sersemletme şansı %25'tir.\n\n_+2:_ Şok dalgası %40 daha fazla hasar verir ve sakatlamak yerine sersemletme şansı %50'dir.\n\n_+3:_ Şok dalgası %60 daha fazla hasar verir ve sakatlamak yerine sersemletme şansı %75'tir.\n\n_+4:_ Şok dalgası %80 daha fazla hasar verir ve sakatlamak yerine sersemletme şansı %100'dür.
actors.hero.talent.shock_force.title=şok kuvveti
actors.hero.talent.shrug_it_off.desc=_+1:_ Savaşçının dayanıklılık sırasında hasar azaltma oranı %50'den %60'a yükseltildi.\n\n_+2:_ Savaşçının dayanıklılık sırasında hasar azaltma oranı %50'den %68'e yükseltildi.\n\n_+3:_ Savaşçının dayanıklılık sırasında hasar azaltma oranı %50'den %74'e yükseltildi.\n\n_+4:_ Savaşçının dayanıklılık sırasında hasar azaltma oranı %50'den %80'e yükseltildi.
actors.hero.talent.shrug_it_off.title=omuz silkip geçmek
actors.hero.talent.silent_steps.desc=_+1:_ Haydut, _onlardan 3 veya daha fazla kare uzakta_ olduğu sürece uyuyan düşmanları uyandırmaz.\n\n_+2:_ Haydut, _onlara bitişik_ olmadığı sürece uyuyan düşmanları uyandırmaz.
actors.hero.talent.silent_steps.title=sessiz adımlar
actors.hero.talent.soul_eater.desc=_+1:_ Ruh işareti, verilen her fiziksel hasar için _0,33 tur_ tokluk sağlar. Ruh işareti taşıyan düşmanların öldüklerinde yeme etkilerini tetikleme şansı %10'dur.\n\n_+2:_ Ruh işareti, verilen her fiziksel hasar için _0,67 tur_ tokluk sağlar. Ruh işareti taşıyan düşmanların öldüklerinde yeme etkilerini tetikleme şansı %20'dir.\n\n_+3:_ Ruh işareti, verilen her fiziksel hasar için _1 tur_ tokluk sağlar. Ruh işareti taşıyan düşmanların öldüklerinde yeme etkilerini tetikleme şansı %30'dur.
actors.hero.talent.soul_eater.title=ruh yiyici
actors.hero.talent.soul_siphon.desc=_+1:_ Diğer karakterler tarafından verilen fiziksel hasar, Büyücünün ruh işaretini %13 etkinlikte tetikler.\n\n_+2:_ Diğer karakterler tarafından verilen fiziksel hasar, Büyücünün ruh işaretini %27 etkinlikte tetikler.\n\n_+3:_ Diğer karakterler tarafından verilen fiziksel hasar, Büyücünün ruh işaretini %40 etkinlikte tetikler.
actors.hero.talent.soul_siphon.title=ruh emici
actors.hero.talent.speedy_stealth.desc=_+1:_ Serbest koşucu, görünmezken her turda 2 ivme kazanır.\n\n_+2:_ +1'in avantajlarına ek olarak, serbest koşucu görünmezken artık serbest koşu süresi geri saymaz.\n\n_+3:_ +1 ve +2'nin avantajlarına ek olarak, serbest koşucu görünmezken, serbest koşu yapıp yapmadığına bakılmaksızın 2 kat hızda hareket eder.
actors.hero.talent.speedy_stealth.title=hızlı gizlilik
actors.hero.talent.spirit_blades.desc=_+1:_ Hayalet bıçakların, ruh yayı üzerindeki büyüyü de kullanma şansı %30'dur.\n\n_+2:_ Hayalet bıçakların, ruh yayı üzerindeki büyüyü de kullanma şansı %60'tır.\n\n_+3:_ Hayalet bıçakların, ruh yayı üzerindeki büyüyü de kullanma şansı %90'dır.\n\n_+4:_ Hayalet bıçakların, ruh yayı üzerindeki büyüyü de kullanma şansı %100'dür ve her büyüye %10 güç artışı sağlar.
actors.hero.talent.spirit_blades.title=ruh bıçakları
actors.hero.talent.spirit_form.desc=Rahip, 4 kullanım bedeli karşılığında, bu turda belirlediği bir yüzüğün veya eserin (kutsal kitap hariç) gücünü Trinity'ye aşılayan _Ruh Formu_ büyüsünü kullanabilir. _+1:_ Trinity kullanıldığında, Rahip 20 tur boyunca _+1_ seviyesinde bir yüzüğün etkisini kazanır veya _+4 seviyesinde bir eserin etkisini tetikler. _+2:_ Trinity kullanıldığında, Rahip 20 tur boyunca _+2_ seviyesinde bir yüzüğün etkisini kazanır veya _+6 seviyesinde bir eserin etkisini tetikler. _+3:_ Trinity kullanıldığında, Rahip 20 tur boyunca _+3_ seviyesinde bir yüzüğün etkisini kazanır veya _+4 seviyesinde bir eserin etkisini tetikler. _+8._\n\n_+4:_ Trinity kullanıldığında, Rahip 20 tur boyunca _+4_ seviyesinde bir yüzüğün etkisini kazanır veya _+10_ seviyesinde bir eserin etkisini tetikler._\n\nTrinity'ye aynı anda yalnızca bir ruh etkisi yüklenebilir. Eserler, Trinity tarafından tetiklendiğinde çeşitli etkilere ve zırh yükü maliyetlerine sahiptir.
actors.hero.talent.spirit_form.title=ruh formu
actors.hero.talent.stasis.desc=Rahip, güçlendirilmiş bir müttefike 2 yük karşılığında _Durdurma_ büyüsünü uygulayabilir. Durdurma, müttefiki geçici olarak zindandan uzaklaştırır ve Çoklu Güç de dahil olmak üzere tüm güçlendirmelerin kalan süresini korur. Etki sona erdiğinde müttefik yanınızda yeniden belirir. Durdurma büyüsü, etkiyi erken sonlandırmak için anında ve hiçbir maliyet olmadan yeniden uygulanabilir. Stasis, hareketsiz müttefikler üzerinde etkilidir ancak onları zindan katları arasında hareket ettiremez.\n\n_+1:_ Stasis en fazla _60 tur sürer._\n\n_+2:_ Stasis en fazla _90 tur sürer._\n\n_+3:_ Stasis en fazla _120 tur sürer._\n\n_+4:_ Stasis en fazla _150 tur sürer._\n\nRahip, bir müttefik stasis halindeyken onu yeniden çağırmak için Işınlama Büyüsü'nü veya etkisini önceden uygulamak için Yaşam Bağlantısı'nı kullanabilir. Ancak müttefikler stasis halindeyken Yaşam Bağlantısı'ndan faydalanamazlar.
actors.hero.talent.stasis.title=durgunluk
actors.hero.talent.strengthening_meal.desc=_+1:_ Yemek yemek, Düellocuya bir düşmana fiziksel saldırıyla vurduğu sonraki _2_ seferde 3 bonus hasar kazandırır.\n\n_+2:_ Yemek yemek, Düellocuya bir düşmana fiziksel saldırıyla vurduğu sonraki _3_ seferde 3 bonus hasar kazandırır.
actors.hero.talent.strengthening_meal.title=güçlendirici öğün
actors.hero.talent.striking_force.desc=_+1:_ Elementel saldırının etkisinin gücü %30 artırılır.\n\n_+2:_ Elementel saldırının etkisinin gücü %60 artırılır.\n\n_+3:_ Elementel saldırının etkisinin gücü %90 artırılır.\n\n_+4:_ Elementel saldırının etkisinin gücü %120 artırılır.
actors.hero.talent.striking_force.title=vurucu güç
actors.hero.talent.striking_wave.desc=_+1:_ Şok dalgasının, büyüler ve kombolar gibi vuruş etkilerini de kullanma şansı %30'dur.\n\n_+2:_ Şok dalgasının, büyüler ve kombolar gibi vuruş etkilerini de kullanma şansı %60'tır.\n\n_+3:_ Şok dalgasının, büyüler ve kombolar gibi vuruş etkilerini de kullanma şansı %90'dır.\n\n_+4:_ Şok dalgasının, büyüler ve kombolar gibi vuruş etkilerini de kullanma şansı %100'dür ve büyülere %20 güç artışı sağlar.
actors.hero.talent.striking_wave.title=çarpıcı dalga
actors.hero.talent.strongman.desc=_+1:_ Savaşçının gücü %8 artırılır (aşağı yuvarlanır).\n\n_+2:_ Savaşçının gücü %13 artırılır (aşağı yuvarlanır).\n\n_+3:_ Savaşçının gücü %18 artırılır (aşağı yuvarlanır).
actors.hero.talent.strongman.title=güçlü adam
actors.hero.talent.sucker_punch.desc=_+1:_ Haydut, düşmana ilk kez sürpriz saldırı yaptığında _1-2 bonus hasar_ verir.\n\n_+2:_ Haydut, düşmana ilk kez sürpriz saldırı yaptığında _2 bonus hasar_ verir.
actors.hero.talent.sucker_punch.title=Sucker Punch
actors.hero.talent.sunray.desc=_+1:_ Rahip, 1 yük karşılığında _4-8 hasar_ veren ve hedefi _4 tur_ boyunca kör eden _Güneş Işını_ büyüsünü kullanabilir.\n\n_+2:_ Rahip, 1 yük karşılığında _6-12 hasar_ veren ve hedefi _6 tur_ boyunca kör eden _Güneş Işını_ büyüsünü kullanabilir.\n\nGüneş Işını her hedefi yalnızca bir kez kör edebilir, ancak hedef zaten Güneş Işını tarafından kör edilmişse, bunun yerine felç eder. Güneş Işını her zaman iblis ve ölümsüz düşmanlara maksimum hasar verir.
actors.hero.talent.sunray.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine asaların ve eserlerin düşmanları 4 tur boyunca kör etmesine neden olur; bu etki +1 seviyesinde %15, +2 seviyesinde ise %25 olasılıkla gerçekleşir.
actors.hero.talent.sunray.title=güneş ışını
actors.hero.talent.survivalists_intuition.desc=_+1:_ Avcı, fırlatılan silahları _3 kat daha hızlı_ tespit eder.\n\n_+2:_ Avcı, fırlatılan silahları _onlarla vurduğunda_ tespit eder.
actors.hero.talent.survivalists_intuition.title=hayatta kalma uzmanının sezgisi
actors.hero.talent.sustained_retribution.desc=_+1:_ Savaşçı, tek vuruşta %100 bonus hasar yerine, 2 vuruşa yayılmış %115 bonus hasar verir.\n\n_+2:_ Savaşçı, tek vuruşta %100 bonus hasar yerine, 3 vuruşa yayılmış %130 bonus hasar verir.\n\n_+3:_ Savaşçı, tek vuruşta %100 bonus hasar yerine, 4 vuruşa yayılmış %145 bonus hasar verir.\n\n_+4:_ Savaşçı, tek vuruşta %100 bonus hasar yerine, 5 vuruşa yayılmış %160 bonus hasar verir.
actors.hero.talent.sustained_retribution.title=sürekli intikam
actors.hero.talent.swift_equip.desc=_+1:_ Düellocu, her 20 turda bir kez, donanımlı silahını anında değiştirebilir.\n\n_+2:_ Düellocu, her 20 turda iki kez, donanımlı silahını anında değiştirebilir.\n\nEğer Düellocu bu yeteneğe sahipse ve bekleme süresinde değilse, donatılmamış bir silahı hızlıca kullanmak, silahı donatacaktır.
actors.hero.talent.swift_equip.title=hızlı ekipman
actors.hero.talent.swift_spirit.desc=_+1:_ Ruh şahin'in hareket hızı 2'den 2,5 kareye çıkarılır ve kendisine yapılan ilk 2 saldırıdan kesinlikle kaçınır.\n\n_+2:_ Ruh şahin'in hareket hızı 2'den 3 kareye çıkarılır ve kendisine yapılan ilk 4 saldırıdan kesinlikle kaçınır.\n\n_+3:_ Ruh şahin'in hareket hızı 2'den 3,5 kareye çıkarılır ve kendisine yapılan ilk 6 saldırıdan kesinlikle kaçınır.\n\n_+4:_ Ruh şahin'in hareket hızı 2'den 4 kareye çıkarılır ve kendisine yapılan ilk 8 saldırıdan kesinlikle kaçınır.
actors.hero.talent.swift_spirit.title=hızlı ruh
actors.hero.talent.telefrag.desc=_+1:_ Büyücü başka bir karaktere dönüşürse, ona _10-15 hasar_ verir, ancak aynı zamanda _5 hasar_ alır.\n\n_+2:_ Büyücü başka bir karaktere dönüşürse, ona _20-30 hasar_ verir, ancak aynı zamanda _10 hasar_ alır.\n\n_+3:_ Büyücü başka bir karaktere dönüşürse, ona _30-45 hasar_ verir, ancak aynı zamanda _15 hasar_ alır.\n\n_+4:_ Büyücü başka bir karaktere dönüşürse, ona _40-60 hasar_ verir, ancak aynı zamanda _20 hasar_ alır.\n\nKahraman bu yetenekle öldürülemez, kendine verilen hasar büyü direnci etkileriyle azaltılabilir.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Haydut yüzükleri _2 kat daha hızlı_ tanımlar ve bir yüzüğü taktığı anda türünü belirler.\n\n_+2:_ Haydut yüzükleri _taktığı anda_ tanımlar ve bir yüzüğü aldığı anda türünü belirler.
actors.hero.talent.thiefs_intuition.title=hırsızın sezgisi
actors.hero.talent.twin_upgrades.desc=_+1:_ Şampiyonun donattığı iki silahtan birinin seviyesi diğer silahtan _2 veya daha fazla kademe düşükse_, diğer silahın seviyesine yükseltilir.\n\n_+2:_ Şampiyonun donattığı iki silahtan birinin seviyesi diğer silahtan _1 veya daha fazla kademe düşükse_, diğer silahın seviyesine yükseltilir.\n\n_+3:_ Şampiyonun donattığı iki silahtan birinin seviyesi diğer silahtan _aynı kademede veya daha düşükse_, diğer silahın seviyesine yükseltilir.
actors.hero.talent.twin_upgrades.title=ikiz yükseltmeler
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Keşiş, kullandığı her _3. seviye veya daha düşük_ ekipman parçası için _%50 daha fazla enerji_ kazanır.\n\n_+2:_ Keşiş, kullandığı her _2. seviye veya daha düşük_ ekipman parçası için _%75 daha fazla enerji_ kazanır. 3. seviye avantajı değişmez.\n\n_+3:_ Keşiş, kullandığı her _1. seviye veya daha düşük_ ekipman parçası için _%100 daha fazla enerji_ kazanır. 2. ve 3. seviye avantajları değişmez. Ayrıca ücretsiz bir kumaş zırh ve çivili eldiven kazanır.\n\nNot: Bu yetenek, silahsız olmaktan veya Güç Yüzüğü ile saldırmaktan herhangi bir fayda sağlamaz.
actors.hero.talent.unencumbered_spirit.title=özgür ruh
actors.hero.talent.varied_charge.desc=_+1:_ Şampiyon, iki farklı silah yeteneği kullandığında, zaman sınırlaması olmaksızın anında _0,17 silah şarjı_ kazanır.\n\n_+2:_ Şampiyon, iki farklı silah yeteneği kullandığında, zaman sınırlaması olmaksızın anında _0,33 silah şarjı_ kazanır.\n\n_+3:_ Şampiyon, iki farklı silah yeteneği kullandığında, zaman sınırlaması olmaksızın anında _0,5 silah şarjı_ kazanır.
actors.hero.talent.varied_charge.title=değişken ücret
actors.hero.talent.veterans_intuition.desc=_+1:_ Savaşçı, silahları _1,75 kat daha hızlı_ ve zırhları _2,5 kat daha hızlı_ tanımlar.\n\n_+2:_ Savaşçı, silahları _2,5 kat daha hızlı_ ve zırhları _kuşandığında_ tanımlar.
actors.hero.talent.veterans_intuition.title=deneyimli birinin sezgisi
actors.hero.talent.wall_of_light.desc=_+1:_ Paladin, 3 yük karşılığında, Paladinin önünde 3 karo genişliğinde, düşmanları uzaklaştıran ve 20 tur süren sağlam bir duvar oluşturan _Işık Duvarı_ büyüsünü kullanabilir.\n\n_+2:_ Paladin, 3 yük karşılığında, Paladinin önünde 5 karo genişliğinde, düşmanları uzaklaştıran ve 20 tur süren sağlam bir duvar oluşturan _Işık Duvarı_ büyüsünü kullanabilir.\n\n_+3:_ Paladin, 3 yük karşılığında, Paladinin önünde 7 karo genişliğinde, düşmanları uzaklaştıran ve 20 tur süren sağlam bir duvar oluşturan _Işık Duvarı_ büyüsünü kullanabilir.\n\nDuvar, ana veya çapraz olarak yerleştirilebilir, aynı anda yalnızca bir duvar bulunabilir. zaman.
actors.hero.talent.wall_of_light.title=ışık duvarı
actors.hero.talent.wand_preservation.desc=_+1:_ Büyücü asasına yeni bir asa yerleştirdiğinde, eski asa +0 olarak geri döner, _ancak bu yalnızca bir kez yapılabilir._\n\n_+2:_ Büyücü asasına yeni bir asa yerleştirdiğinde, eski asa +0 olarak geri döner, _bu işlem bir kahraman seviyesi bekleme süresiyle tekrarlanabilir._
actors.hero.talent.wand_preservation.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bir asayı simya kazanına koyarken elde edilen büyülü reçine miktarını +1 seviyesinde 1, +2 seviyesinde ise 2 artıracaktır.
actors.hero.talent.wand_preservation.title=asa koruma
actors.hero.talent.weapon_recharging.desc=_+1:_ Düellocu, asa veya eser şarj etme takviyelerinin etkisi altındayken her _15 turda_ bir silah şarjı kazanır.\n\n_+2:_ Düellocu, asa veya eser şarj etme takviyelerinin etkisi altındayken her _10 turda_ bir silah şarjı kazanır.
actors.hero.talent.weapon_recharging.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, bunun yerine +1 seviyesinde şarj olurken +5% yakın dövüş hasarı veya +2 seviyesinde şarj olurken +7.5% yakın dövüş hasarı vermelerini sağlayacaktır.
actors.hero.talent.weapon_recharging.title=silah şarjı
actors.hero.talent.wide_search.desc=_+1:_ Haydutun arama yarıçapı 5x5 kareden _7x7 daireye_ artırıldı.\n\n_+2:_ Haydutun arama yarıçapı 5x5 kareden _7x7 kareye_ artırıldı.
actors.hero.talent.wide_search.meta_desc=_Eğer bu yetenek farklı bir kahraman tarafından kazanılırsa_, arama yarıçapını +1 seviyesinde 3x3 kareden 5x5 daireye veya +2 seviyesinde 5x5 kareye çıkaracaktır.
actors.hero.talent.wide_search.title=geniş arama
actors.hero.talent.wild_momentum.desc=_+1:_ Ruh yayıyla bir düşmanı öldürmek, doğanın gücünün süresini _1 tur_ uzatır. Süre en fazla _2 tur_ uzatılabilir.\n\n_+2:_ Ruh yayıyla bir düşmanı öldürmek, doğanın gücünün süresini _2 tur_ uzatır. Süre en fazla _4 tur_ uzatılabilir.\n\n_+3:_ Ruh yayıyla bir düşmanı öldürmek, doğanın gücünün süresini _3 tur_ uzatır. Süre en fazla _6 tur_ uzatılabilir.\n\n_+4:_ Ruh yayıyla bir düşmanı öldürmek, doğanın gücünün süresini _4 tur_ uzatır. Süre en fazla _8 tur_ uzatılabilir.
actors.hero.talent.wild_momentum.title=vahşi ivme
actors.hero.talent.wild_power.desc=_+1:_ Vahşi büyü kullanıldığında, asalar +4'e kadar _2 veya 3 artırılır.\n\n_+2:_ Vahşi büyü kullanıldığında, asalar +5'e kadar _3 artırılır.\n\n_+3:_ Vahşi büyü kullanıldığında, asalar +6'ya kadar _3 veya 4 artırılır.\n\n_+4:_ Vahşi büyü kullanıldığında, asalar +7'ye kadar _4 artırılır.
actors.hero.talent.wild_power.title=vahşi güç
actors.mobs.acidic.desc=Bu devasa örümcek benzeri şeytani yaratıklar yakın dövüşten kaçınıyor ve uzun mesafelerden ölümcül, testere dişli dikenler fırlatmayı tercih ediyorlar. Bu yaratığın üzerinden aşındırıcı bir sıvı damlıyor gibi görünüyor.
actors.mobs.acidic.name=asidik akrep
actors.mobs.albino.desc=Bu, bembeyaz kürkü ve tırtıklı dişleriyle nadir görülen bir keseli sıçan türüdür.
actors.mobs.albino.discover_hint=Bu düşmanı zindanın belirli bir bölgesinde nadiren bulabilirsiniz.
actors.mobs.albino.name=albino sıçan
actors.mobs.armoredbrute.desc=En kıdemli gnoll canavarları, statülerini göstermek için genellikle güçlü zırhlar giyerler. Zırh, bu canavarları fiziksel hasara karşı çok daha dayanıklı hale getirir ve daha yüksek disiplinleri sayesinde yaralarına yenik düşmeden önce çok daha uzun süre öfkelenebilirler.
actors.mobs.armoredbrute.name=zırhlı vahşi
actors.mobs.armoredstatue.desc=Bu zindanın cansız heykellerinden biri olduğunu düşünebilirsiniz, ancak kırmızı parlayan gözleri onu ele veriyor. Giydiği zırh sayesinde çok iyi durumda görünüyor, öldürmesi çok zor olabilir.
actors.mobs.armoredstatue.desc_arm_wep=Heykelin kendisi taştan yapılmış olsa da, elinde tuttuğu _%1$s_ ve _%2$s_ gerçek gibi görünüyor.
actors.mobs.armoredstatue.name=zırhlı heykel
actors.mobs.bandit.desc=Zindanın daha derin katmanları her zaman her türden suçlunun saklandığı yer olmuştur. Gün ışığından bu kadar uzun süre uzak kaldıkları süre boyunca hepsi akıl sağlığını koruyamamıştır. Çok uzun zaman önce, bu çılgın hırsızlar ve haydutlar kim olduklarını ve neden çaldıklarını unutmuşlardır.
actors.mobs.bandit.name=çılgın haydut
actors.mobs.bat.desc=Bu çevik ve azimli mağara sakinleri göründüklerinden çok daha tehlikelidir. Her başarılı saldırıda sağlıklarını yenilerler, bu da çok daha büyük rakipleri alt etmelerini sağlar.
actors.mobs.bat.name=vampir yarasa
actors.mobs.bee.desc=Küçük boyutlarına rağmen, altın arılar yuvalarını şiddetle koruma eğilimindedir. Bu arı çok kızgın, ondan uzak durmak daha iyi olur.
actors.mobs.bee.desc_honey=Küçük boyutlarına rağmen, altın arılar yuvalarını şiddetle koruma eğilimindedir. Bu arı sakinleştirilmiş ve sizi takip etmek istiyor gibi görünüyor.
actors.mobs.bee.discover_hint=Bu karakteri belirli bir eşya ile bulabilirsiniz.
actors.mobs.bee.name=altın arı
actors.mobs.brute$bruterage.desc=Bu gnoll canavarı ölüyor ama seni de yanında götürmek istiyor!\n\nCanavar, kalkanı zamanla veya hasar gördüğünde ölecek. Bu arada, verdiği hasar çok daha fazla olacak, bu yüzden dikkatli ol!\n\nKalan kalkan: %d.
actors.mobs.brute$bruterage.name=vahşi öfke
actors.mobs.brute.def_verb=engellendi
actors.mobs.brute.desc=Kabadayılar gnoll'ların en iri, en güçlü ve en dayanıklı olanlarıdır. Ağır yaralandıklarında öfkeye kapılır ve düşmanlarına daha da fazla hasar verirler.
actors.mobs.brute.enraged=öfkeli
actors.mobs.brute.name=gnoll kabadayısı
actors.mobs.causticslime.desc=Bu balçık, aşağıdan yayılan karanlık büyü tarafından kirletilmiş gibi görünüyor. Her zamanki yeşil rengini kaybetmiş ve yakıcı bir sıvı akıyor.
actors.mobs.causticslime.discover_hint=Bu düşmanı zindanın belirli bir bölgesinde nadiren bulabilirsiniz.
actors.mobs.causticslime.name=yakıcı balçık
actors.mobs.crab.desc=Bu dev yengeçler kanalizasyonlardaki besin zincirinin en tepesinde yer alıyor. Son derece hızlılar ve kalın kabukları ağır darbelere dayanabiliyor.
actors.mobs.crab.name=kanalizasyon yengeci
actors.mobs.crystalguardian.def_verb=engellendi
actors.mobs.crystalguardian.desc=Bu büyük kristal koruyucular, parlak parlayan gözleri olmasaydı neredeyse heykellere benziyorlardı. Sertleşmiş kristalden yapılmış olmaları onları yavaş ama çok dayanıklı kılıyor, bu yüzden onları mümkün olduğunca uzun süre kristal yuvalarında uyumaya bırakmak en iyisi. Boyutları nedeniyle, kristal koruyucular kapalı alanlarda çok daha yavaş hareket ederler. Ayrıca o kadar dayanıklıdırlar ki, onları tamamen öldürmek imkansızdır. Yıkılabilir ve geçici olarak etkisiz hale getirilebilirler, ancak kısa bir süre sonra tekrar ayağa kalkarlar.
actors.mobs.crystalguardian.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.crystalguardian.name=kristal koruyucu
actors.mobs.crystalmimic.ate=Taklitçi senin %s'nu yedi!
actors.mobs.crystalmimic.desc=Taklitçiler, istedikleri herhangi bir şekle bürünebilen büyülü yaratıklardır. Zindanlarda, şüphelenmeyen maceracıları cezbetmek için neredeyse her zaman bir hazine sandığı şeklini seçerler. Kristal taklitçiler, normal kuzenlerinden daha kurnazdır ve ganimet çalarken çatışmadan kaçınmayı tercih ederler. Keşfedildiklerinde kaçmaya çalışırlar ve saldırdıklarında düşmanların yerini değiştirme yeteneğine sahiptirler.
actors.mobs.crystalmimic.escaped=Kristal taklitçi kaçtı!
actors.mobs.crystalmimic.name=kristal taklidi
actors.mobs.crystalspire.alert=Titreşim giderek artıyor ve tüm mağarayı saran bir uğultu yayılıyor!
actors.mobs.crystalspire.desc=Bu devasa, son derece sert kristal kule, muhtemelen bu mağaradaki tüm garip kristal yaratıkların kaynağıdır. Normal silahlarınız ona karşı etkisizdir, bu yüzden onu yok etmek istiyorsanız kazmanızı kullanmanız gerekecek. Bu kadar büyük bir kristali kazmak muhtemelen biraz zaman alacaktır ve muhtemelen rahatsız edilmeden yapamayacaksınız. Kulenin kendisinin de kendini savunma yöntemleri olabilir. Belki de kulenin kendi saldırıları, hizmetkarlarına karşı kullanılabilir.
actors.mobs.crystalspire.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.crystalspire.name=kristal kule
actors.mobs.crystalspire.warning=Kristale vurduğunuzda titreşir. Bunu sürdürmek kesinlikle dikkatleri üzerinize çekecektir...
actors.mobs.crystalwisp.beam_kill=Işık huzmesi seni öldürdü...
actors.mobs.crystalwisp.desc=Parlak bir ışık yayan, sertleşmiş kristalden yapılmış küçük, kızgın, yüzen bir parça. Kristal parçacıkları özellikle güçlü olmasa da, net bir görüş açısına sahip olduklarında size zarar verici bir ışın fırlatırlar. Kristal parçacıklar, çeşitli kristal çıkıntıları arasında kolayca hareket edebilecek kadar küçüktür, ancak içlerinden ışın fırlatamazlar.
actors.mobs.crystalwisp.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.crystalwisp.name=kristal tüy
actors.mobs.demonspawner.desc=Bu çarpık cüce eti karışımı, bu bölgede ölen cücelerden yırtıcı iblisler yaratmaktan sorumludur. İblislerin, düşmanlarına karşı kullanabilecekleri her kaynağı kullanmakta bir sakınca görmedikleri açıkça ortadadır. Görsel olarak korkutucu olsalar da, iblis üreyen yaratıkların hareket etme veya kendilerini doğrudan savunma imkanları yoktur. Ancak, büyük kütleleri onları hızlıca öldürmeyi zorlaştırır ve tehdit altında olduklarında daha hızlı yırtıcı iblisler üretirler. İblis üreyen yaratıklar, şeytani gücün merkezi bir kaynağına bağlı gibi görünmektedir. Onları öldürmek bu gücü zayıflatabilir.
actors.mobs.demonspawner.name=şeytan yumurtlayıcısı
actors.mobs.demonspawner.on_death=Buradaki şeytani enerji, yaratık öldükçe azalıyor gibi görünüyor.
actors.mobs.dm100.desc=DM-100, bu hapishanenin altındaki mağaralarda çalışan cüce madencileri korumak için tasarlanmış, cücelerin erken dönem "savunma makinelerinden" biridir. Ancak elektrik şoklarının çok zayıf olduğu anlaşıldı ve bu nedenle yukarıdaki insan şehrine hediye edildiler. Yıllarca kullanılmadan kaldılar ve sonunda hapishaneye ulaştılar; burada gardiyan başlangıçta onları kullanmayı çok acımasız buldu. Ancak mahkumlar daha da asi hale geldikçe, bir zorunluluk haline geldiler.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Yıldırım seni öldürdü...
actors.mobs.dm200.desc=DM-200, cüce madencileri mağaralarda ve aşağıdaki şehirde korumak için tasarlanmış ikinci nesil cüce "savunma makinesi"dir. Seleflerinden çok daha büyük ve hantal olan bu makineler, yıkıcı hidrolik yumruklarla saldırır. Artan boyutları aynı zamanda en büyük zayıflıklarıdır, çünkü zindanın dar tünellerine ve kapılarına sığamazlar. Cüceler, DM-200'ün hareket kabiliyetindeki eksikliği, zehirli egzoz gazlarını uzaktaki düşmanlara veya ulaşamadıkları düşmanlara püskürtmelerine izin vererek telafi edebildiler.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 zehirli egzoz gazı püskürtüyor!
actors.mobs.dm201.desc=Cüceler, DM-200'ün hareket kabiliyetinin azlığını daha fazla vurgulamayı kısa bir süre denediler ve tamamen sabit duran bazı DM modelleri yarattılar. DM-201, hareket kabiliyeti olmayan bir nöbetçi taret görevi gören, sonradan donatılmış bir DM-200'dür. Hareket kabiliyetinin azlığına karşılık, DM-201'ler önemli ölçüde daha fazla dayanıklılığa ve saldırı gücüne sahiptir. DM-201'lerin egzoz gazı tahliyesi için bir motoru olmadığı için, cüceler bunun yerine onları aşındırıcı gaz bombalarıyla donattılar! Ancak DM-201'ler bu bombaları dikkatli kullanır ve yalnızca uzaktan saldırıya uğradıklarında fırlatırlar.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 aşındırıcı bir el bombası fırlatıyor!
actors.mobs.dm300.charge_lost=DİREK YIKILDI! YEREL ELEKTRİK KAYNAĞINA GERİ DÖNÜLÜYOR!
actors.mobs.dm300.charging=HASAR VAR! GÜÇ DİREĞİ AKTİVE EDİLİYOR!
actors.mobs.dm300.charging_hint=DM-300, bir pilon tarafından enerjilendirildiği sürece hasar almaz!
actors.mobs.dm300.def_verb=engellendi
actors.mobs.dm300.defeated=CİDDİ HASAR! KAPATMA GİRİŞİMİ-
actors.mobs.dm300.desc=Bu makineyi cüceler yüzyıllar önce yaptı. Daha sonra makinelerin yerine golemler, elementaller, hatta iblisler kullanmaya başladılar. Sonunda bu, uygarlıklarının çöküşüne yol açtı. DM-300 ve benzeri makineler genellikle inşaat ve madencilikte, bazen de şehir savunmasında kullanılırdı.
actors.mobs.dm300.desc_supercharged=DM-300 şu anda tamamen elektrik enerjisiyle yüklü. Bu haldeyken DM-300 hasar görmez ve iki kat hızda hareket eder! Ayrıca, matkabı artık katı kayayı delebilecek kadar hızlı dönüyor, ancak bunu yaparken çok daha yavaş hareket ediyor. DM-300'e doğrudan saldırmak, aşırı yüklü haldeyken anlamsızdır, ancak bölgedeki bir şey ona bu enerjiyi sağlıyor olmalı; bunu yok etmek onu zayıflatabilir.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=YETKİSİZ PERSONEL TESPİT EDİLDİ!
actors.mobs.dm300.pylons_destroyed=UYARI! ELEKTRİK ŞEBEKESİNDE İSTİKRARSIZLIK TESPİT EDİLDİ!
actors.mobs.dm300.rankings_desc=DM-300 tarafından ezildi
actors.mobs.dm300.shield=DM-300, gücünü açıkta bulunan kablolardan alıyor ve kendini koruyor!
actors.mobs.dm300.supercharged=YOK ET! YOK ET! YOK ET!
actors.mobs.dwarfking$dkghoul.rankings_desc=Cüceler Kralının Önünde Düştü
actors.mobs.dwarfking$dkgolem.rankings_desc=Cüceler Kralının Önünde Düştü
actors.mobs.dwarfking$dkmonk.rankings_desc=Cüceler Kralının Önünde Düştü
actors.mobs.dwarfking$dkwarlock.rankings_desc=Cüceler Kralının Önünde Düştü
actors.mobs.dwarfking.defeated=Hepimizi mahvettin...
actors.mobs.dwarfking.desc=Uzun yıllar önce, cüce sarayının en yüksek rütbeli büyücülerinden biri, ona yaşam ve ölüm üzerinde muazzam bir güç veren sırlar keşfetti. Bu gücü kısa sürede kullanarak, akranlarını, kralını ve sonunda tüm cüce vatandaşlarını boyunduruk altına aldı ve yozlaştırdı. Şimdi o, ölümsüz tebaasından oluşan bir lejyonun hükümdarı olan kraldır. Cücelerin Kralı, düşmanlarını ölümsüz hizmetkarlarından oluşan ordusuyla kuşatıp alt etmeye çalışacak saldırgan bir düşmandır.
actors.mobs.dwarfking.enraged=Beni öldüremezsin %s. Ben ölümsüzüm!
actors.mobs.dwarfking.lifelink_1=Senin özüne ihtiyacım var, köle!
actors.mobs.dwarfking.lifelink_2=Benim için kan akıt, köle!
actors.mobs.dwarfking.losing=Hayır! Bunu yapamazsın... aşağıda ne olduğunu bilmiyorsun...
actors.mobs.dwarfking.name=Cücelerin Kralı
actors.mobs.dwarfking.notice=Nasıl cüret edersin! Ne tür bir müdahalede bulunduğunun farkında bile değilsin!
actors.mobs.dwarfking.rankings_desc=Cüceler Kralının Önünde Düştü
actors.mobs.dwarfking.teleport_1=Onlarla başa çık, köle!
actors.mobs.dwarfking.teleport_2=Onları meşgul tut, köle!
actors.mobs.dwarfking.wave_1=Yeter! Kalkın kölelerim!
actors.mobs.dwarfking.wave_2=Daha fazlası! Kralınız için kan dökün!
actors.mobs.dwarfking.wave_3=İşe yaramazlar! HEMEN ÖLDÜRÜN ONLARI!
actors.mobs.ebonymimic.desc=Taklitçiler, istedikleri herhangi bir şekle bürünebilen büyülü yaratıklardır. Zindanlarda, şüphelenmeyen maceracıları cezbetmek için neredeyse her zaman bir hazine sandığı şeklini seçerler. Abanoz taklitçiler, kendilerini neredeyse görünmez hale getirme yeteneğine sahip gizli taklitçilerdir. Maceracıların etkileşime girme olasılığının yüksek olduğu şeylerin üzerinde gizlenirler, ancak kendi ganimetlerini de içerirler. Keşfedildikten sonra normal bir taklitçiden daha güçlü değillerdir, ancak ani ısırıkları yıkıcıdır.
actors.mobs.ebonymimic.discover_hint=Bu düşmanı belirli bir tılsımla bulabilirsiniz.
actors.mobs.ebonymimic.hidden_desc=Burada bir şeyler var gibi görünüyor, ama neredeyse tamamen şeffaf.
actors.mobs.ebonymimic.hidden_name=şüpheli hat
actors.mobs.ebonymimic.name=abanoz taklitçisi
actors.mobs.ebonymimic.reveal=Orada bir taklitçi vardı!
actors.mobs.elemental$chaoselemental.desc=Elementaller, güçlü okült büyünün düzgün kontrol edilmediği durumlarda sıklıkla ortaya çıkan kaotik yaratıklardır. Elementallerin zekası minimaldir ve genellikle belirli bir büyü türüyle ilişkilendirilirler. Kaos elementalleri, belirli bir elemente henüz yerleşmemiş nadir ve tehlikeli elementallerdir. Saldırdıklarında vahşi ve tahmin edilemez büyüler açığa çıkarırlar.
actors.mobs.elemental$chaoselemental.name=kaos elementi
actors.mobs.elemental$fireelemental.desc=Elementaller, güçlü okült büyünün düzgün kontrol edilmediği durumlarda sıklıkla yaratılan kaotik yaratıklardır. Elementallerin zekası minimaldir ve genellikle belirli bir büyü türüyle ilişkilendirilirler. Ateş elementalleri, ateşli büyüyle hasar veren yaygın bir elemental türüdür. Hedeflerini yakın dövüş saldırılarıyla ateşe verirler ve zaman zaman ateş topları da fırlatabilirler.
actors.mobs.elemental$fireelemental.name=ateş elementi
actors.mobs.elemental$frostelemental.desc=Elementaller, güçlü okült büyünün düzgün kontrol edilmediği durumlarda sıklıkla ortaya çıkan kaotik yaratıklardır. Elementallerin zekası minimaldir ve genellikle belirli bir büyü türüyle ilişkilendirilirler. Buz elementalleri, düşmanları dondurucu büyüyle zayıflatan yaygın bir elemental türüdür. Hedeflerini yakın dövüş ve ara sıra menzilli saldırılarla dondururlar. Büyüleri suda çok daha etkilidir.
actors.mobs.elemental$frostelemental.name=don elementi
actors.mobs.elemental$newbornfireelemental.charging=Elementel enerji topluyor!
actors.mobs.elemental$newbornfireelemental.desc=Elementaller, güçlü okült büyünün düzgün kontrol edilmediği durumlarda sıklıkla yaratılan kaotik yaratıklardır. Elementallerin zekası minimaldir ve genellikle belirli bir büyü türüyle ilişkilendirilirler. Bu ateş elementi yeni çağrılmış olsa da oldukça tehlikelidir!
actors.mobs.elemental$newbornfireelemental.desc_ally=Bu element bir büyüyle çağrıldığı için alevini biraz daha kontrol edebiliyor. Menzilli saldırı yapamıyor, ancak yakın dövüşte saldırdığı düşmanları tutuşturabiliyor.
actors.mobs.elemental$newbornfireelemental.desc_boss=Çağırma sürecinin kaotik doğası nedeniyle, bu element bir tur boyunca şarj olduktan sonra ancak isabetsiz patlamalar şeklinde ateş yayabilir.
actors.mobs.elemental$newbornfireelemental.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.elemental$newbornfireelemental.name=yeni doğan ateş elementi
actors.mobs.elemental$shockelemental.desc=Elementaller, güçlü okült büyünün düzgün kontrol edilmediği durumlarda sıklıkla yaratılan kaotik yaratıklardır. Elementallerin zekası minimaldir ve genellikle belirli bir büyü türüyle ilişkilendirilirler. Şok elementalleri, düşmanlarını elektrik ve ışık parlamalarıyla etkisiz hale getiren daha az yaygın bir elemental türüdür. Yakın dövüşte, yakındaki düşmanlara elektrik yayarlar ve eğer hedefleri sudaysa, birincil hedeflerine ek hasar verirler. Ayrıca zaman zaman hedeflerine uzaktan bir ışık patlaması odaklayarak onları geçici olarak kör ederler.
actors.mobs.elemental$shockelemental.name=şok elementi
actors.mobs.eye.deathgaze_kill=Ölümcül bakışlar seni öldürdü...
actors.mobs.eye.desc=Bu iblise «nefret küresi» de denir. Bir düşman gördüğünde ölümcül bakışını düşünmeden kullanır; çoğu zaman müttefiklerini umursamaz ve onları da yaralar.
actors.mobs.eye.name=kötücül göz
actors.mobs.fetidrat.desc=Bu farede açıkça bir sorun var. Yağlı siyah kürkü ve çürümüş derisi, daha önce gördüğünüz sağlıklı farelerden çok farklı. Soluk yeşil gözleri onu özellikle tehditkar gösteriyor. Fare, korkunç bir koku bulutu taşıyor, yakından bakıldığında son derece güçlü. Farenin ağzından koyu renkli bir sıvı sızıyor, zemini deliyor ama suda çözünüyor gibi görünüyor.
actors.mobs.fetidrat.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.fetidrat.name=pis fare
actors.mobs.fungalcore.desc=Bu devasa mantar, mağaradaki tüm mantar faaliyetlerinin kaynağı olmalı.
actors.mobs.fungalcore.name=mantar çekirdeği
actors.mobs.fungalsentry.desc=Bu özellikle uzun mantar, bu mağarada yaşayan daha büyük mantar ağının savunma noktası görevi görüyor. Hareketsizdir, ancak görüş alanına giren her şeye hassas zehir patlamaları fırlatır. Bu patlamaların etkisi oldukça zayıf olsa da, çok hızlı bir şekilde ölümcül miktarda zehir biriktirebilirler. Öldürülebilir olsa da, ondan uzak durmak muhtemelen en iyisidir.
actors.mobs.fungalsentry.name=mantar nöbetçisi
actors.mobs.fungalspinner.desc=Bu mağara örümcek ağını parazit bir mantar kontrol ediyor gibi görünüyor. Mantar ayrıca yeteneklerini de değiştirmiş, ağını ve zehir keselerini mantar büyümesiyle değiştirmiştir. Mantar örümcek ağı yerine size bitki örtüsü püskürtecek, mantar bitki örtüsünü yayacak ve potansiyel olarak sizi kök saldıracaktır. Zehirleyemese de, mantar örümcek herhangi bir mantarın yanında bulunursa önemli ölçüde hasar direnci kazanacaktır.
actors.mobs.fungalspinner.name=mantar örümceği
actors.mobs.ghoul.desc=Cüce toplumu yavaş yavaş çökmeye başlarken ve cücelerin mevcut kralı mutlak gücü ele geçirirken, zayıf olanlar veya ona direnenler iyi muamele görmedi. Kral karanlık büyüyü kullanmada daha da ustalaştıkça, bu cüceleri kendi iradesine boyun eğdirdi ve şimdi onlar ordusunun piyadelerini oluşturuyorlar. Hortlaklar tek başlarına özellikle güçlü değillerdir, ancak her zaman gruplar halinde seyahat ederler ve büyük sayılarda öldürülmeleri çok daha zordur. Bir hortlak yenildiğinde, yakınlarda başka bir hortlak olduğu sürece birkaç tur sonra tekrar dirilir.
actors.mobs.ghoul.name=cüce hortlak
actors.mobs.gnoll.desc=Gnoll'lar sırtlan benzeri insansı yaratıklardır. Kanalizasyonlarda ve zindanlarda yaşarlar ve zaman zaman yüzeye çıkarak baskınlar düzenlerler. Gnoll izcileri, sürülerinin düzenli üyeleridir; kaba kuvvet kullananlar kadar güçlü, şamanlar kadar zeki değillerdir.
actors.mobs.gnoll.name=gnoll izci
actors.mobs.gnollexile.desc=Bu gri kürklü gnoll'un omzunda, sürgün olduğunu gösteren büyük bir işaret var. Gnoll'lar genellikle emirleri görmezden geldikleri veya yasaları çiğnedikleri için toplumlarından sürgün edilirler. Sürgünlerin hayatta kalabilmek için güçlü ve kurnaz olmaları gerekir; bu gnoll elinde tuttuğu mızrağı nasıl kullanacağını biliyor gibi görünüyor.
actors.mobs.gnollexile.desc_aggro=_Sürgündeki gnoll öfkeyle etrafına bakınıyor._ Görünüşe göre bir şey onu sonunda savaşmaya karar vermeye itmiş. Şu mızrağa dikkat edin!
actors.mobs.gnollexile.desc_passive=_Sürgündeki gnoll saldırmak için hareket etmiyor._ Buradaki diğer gnoll'lar kadar agresif görünmüyor ve muhtemelen sizinle savaşmanın buna değmeyeceğini düşünüyor. Geçmesine izin verebilirsiniz, ancak içinde faydalı eşyalar dolu olabilecek bir sırt çantası var...
actors.mobs.gnollexile.name=gnoll sürgünü
actors.mobs.gnollexile.seen_aggro=Mızrak kullanan gnoll saldırıya geçiyor!
actors.mobs.gnollexile.seen_passive=Mızrak kullanan gnoll size şüpheyle bakıyor ama saldırmak için hareket etmiyor.
actors.mobs.gnollgeomancer.alert=Yerbilimci uyanıyor! Çılgınca kahkahalar atarak uzaklaşırken, tüm mağara sanki yer değiştiriyor gibi görünüyor!
actors.mobs.gnollgeomancer.desc=Bu etkileyici derecede uzun boylu yaşlı gnoll, buradaki çeşitli toprak hareket ettirici büyülerin kaynağı ve tüm gnoll faaliyetlerinin düzenleyicisi olmalı. Bölgedeki gnoll istihkamcılarının aksine, bu jeomancer büyüsünde oldukça yetenekli ve fırlatılan veya düşen kayalardan zarar görmüyor. Ancak yakın dövüşte savaşma yeteneği yok.
actors.mobs.gnollgeomancer.desc_armor=Yer büyücüsü şu anda bir kaya zırhı tabakasıyla kaplı. Yer büyücüsüne zarar verebilmek için önce yaklaşıp kazmanızla bu zırhı kırmanız gerekecek.
actors.mobs.gnollgeomancer.desc_armor_sapper=_Yakındaki bir gnoll istihkamcısı, jeomancer'ın kaya zırhını güçlendiren bir cihaz tutuyor. Şu anda ona hiçbir şekilde zarar veremezsiniz!_
actors.mobs.gnollgeomancer.desc_sleeping=Bu etkileyici derecede uzun boylu gnoll şamanı, bir kaya tabakasıyla çevrili ve neredeyse bir heykel gibi görünüyor. Yakından bakarsanız, kayanın yaşlı gnoll'un nefes alışverişiyle senkronize olarak sihirli bir şekilde hareket ettiğini görebilirsiniz. Bu şekilde kayanın içinde hapsolmuşken zarar görmez ve kelimenin tam anlamıyla toprak uykusunun tadını çıkarıyor gibi görünüyor. Muhtemelen kazmanızla kaya katmanlarını kırabilirsiniz, ancak bunu yaparken bir dövüşe hazır olduğunuzdan emin olun. Jeomancer, buradaki çeşitli toprak hareket ettirici büyünün kaynağı ve tüm gnoll faaliyetlerinin düzenleyicisi olmalı. Onunla savaşmadan önce etrafta dağılmış gnoll'ları yenmek iyi bir fikir olabilir.
actors.mobs.gnollgeomancer.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.gnollgeomancer.name=gnoll jeomancer
actors.mobs.gnollgeomancer.rock_kill=Uçan kaya parçası seni öldürdü...
actors.mobs.gnollgeomancer.rockfall_kill=Düşen kayalar seni öldürdü...
actors.mobs.gnollgeomancer.warning=Yerbilimcisi harekete geçmeye başlıyor. Devam etmeden önce hazır olduğunuzdan emin olun!
actors.mobs.gnollguard.def_verb=engellendi
actors.mobs.gnollguard.desc=Mızrak ve kalkan kullanan, ancak miğferi olmayan, iri ve sert görünümlü bir gnoll. Bu muhafızlar muhtemelen eğitim gören kaba kuvvet kullanan, madeni istilacı vahşi yaşamdan korumaya yardımcı olmak için görevlendirilen kişilerdir. Gnoll muhafızı mızrağı tek elle kullanabilecek kadar güçlüdür, ancak çok iyi kullanamaz. Uzaktan saldırmak için oldukça açık bir alana ihtiyacı olacak ve yaklaştığınızda size önemli ölçüde daha az hasar verecektir.
actors.mobs.gnollguard.desc_armor=Yakındaki bir gnoll istihkamcısı, bu muhafıza toprak zırhı veren ve aldığı hasarı büyük ölçüde azaltan bir cihaz tutuyor.
actors.mobs.gnollguard.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.gnollguard.name=gnoll muhafızı
actors.mobs.gnollguard.spear_warn=Gnoll, mızrağının ucuyla acımasız bir darbe indiriyor!
actors.mobs.gnollsapper.desc=Soluk kürklü ve çeşitli aletlerle dolu bir çantaya sahip, küçük ve zayıf ama zeki bir gnoll. Muhtemelen burada kara altın arama ve madenciliğine yardımcı olmak için bulunuyorlar ve korunmak için yakınlarında bir muhafızları var. Savaşma yetenekleri var, ancak saldırıları acınacak derecede zayıf, bir gnoll izcisinden daha güçlü değil. Doğrudan savaşmak yerine, istihkamcılar kayalık ortamın kendileri için saldırmasını sağlamak için sahip oldukları çeşitli aletleri kullanmayı tercih ederler. Ancak kendileri toprak hareket ettirme büyüsü bilmiyorlar, bu yüzden aletlerini pervasızca kullanmaları oldukça muhtemel. _Onların saldırılarını onlara veya muhafızlarına karşı kullanmanın birçok yolu olmalı._
actors.mobs.gnollsapper.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.gnollsapper.name=gnoll istihkamcısı
actors.mobs.gnolltrickster.desc=Gnoll standartlarına göre bile tuhaf görünümlü bir yaratık. Kötücül bir sırıtışla öne doğru eğiliyor, neredeyse omzunda asılı duran çantayı kucaklıyor. Gözleri, garip bir korku ve heyecan karışımıyla kocaman açılmış. Çantasında çok sayıda kalitesiz ok var, hepsi çeşitli zararlı maddelerle kaplanmış gibi görünüyor.
actors.mobs.gnolltrickster.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.gnolltrickster.name=gnoll hilebazı
actors.mobs.goldenmimic.desc=Taklitçiler, istedikleri herhangi bir şekle bürünebilen büyülü yaratıklardır. Zindanlarda, şüphelenmeyen maceracıları cezbetmek için neredeyse her zaman bir hazine sandığı şeklini seçerler. Altın taklitçiler, en güçlü maceracıları cezbetmeye çalışan daha dayanıklı taklitçilerdir. Daha iyi ganimetlere sahiptirler, ancak normal taklitçilerden çok daha güçlüdürler.
actors.mobs.goldenmimic.name=altın taklitçi
actors.mobs.golem.def_verb=engellendi
actors.mobs.golem.desc=Cüceler, mekanik bilgilerini yeni öğrendikleri elemental bağlama gücüyle birleştirmeye çalıştı. Golemlerin mekanik bedenlerine ruh olarak, en kolay kontrol edildiklerine inandıkları toprak ruhlarını yerleştirdiler. Buna rağmen ayindeki en ufak hata bile golemin kontrolden çıkmasına yetebilirdi.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=gıcır gıcır...
actors.mobs.goo.desc=Balçık hakkında pek bir şey bilinmiyor. Belki de bir yaratık bile değil, kanalizasyondaki maddelerin bir araya gelip kendi iradesini kazanmaya başlamış hâli.
actors.mobs.goo.enraged=öfkeli
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.name=Balçık
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Goo kendini şişiriyor!
actors.mobs.goo.rankings_desc=Yapışkan madde tarafından emildi
actors.mobs.greatcrab.def_verb=engellendi
actors.mobs.greatcrab.desc=Bu yengeç, diğer kanalizasyon yengeçlerine kıyasla bile devasa. Mavi kabuğu çatlaklar ve midye kabuklarıyla kaplı, oldukça yaşlı olduğunu gösteriyor. Dev pençesiyle zar zor dengede durarak yavaşça hareket ediyor. Yengecin sadece bir pençesi olmasına rağmen, büyüklüğü bunu kolayca telafi ediyor. Yengeç, pençesini herhangi bir tehdidin önüne kaldırarak, kendisini aşılmaz bir kabuk duvarının arkasına saklıyor. Ancak, yengeç göremediği saldırıları veya aynı anda birden fazla düşmandan gelen saldırıları engelleyemiyor.
actors.mobs.greatcrab.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.greatcrab.name=büyük yengeç
actors.mobs.greatcrab.noticed=Yengeç, devasa kıskaçlarıyla engeli aşıyor.
actors.mobs.guard.def_verb=engellendi
actors.mobs.guard.desc=Bir zamanlar hapishanenin bekçileri olan bu gardiyanlar, çoktan mahkumlardan farksız hale geldiler. Zombiler gibi sendeliyorlar, beyinsizce koridorlarda dolaşıp, sizin gibi, yerinden çıkmış herhangi bir şey arıyorlar! Muhtemelen düşmanları yakın mesafeye çekmek için kullanılan zincirleri kalçalarında taşıyorlar.
actors.mobs.guard.name=hapishane gardiyanı
actors.mobs.guard.scorpion=Buraya gel!
actors.mobs.hermitcrab.def_verb=engellendi
actors.mobs.hermitcrab.desc=Nedense bu lağım yengeci, kırık bir fıçının üst kısmını kafasına takmaya karar vermiş! Ek ağırlık hızını normale döndürmüş, ancak aynı zamanda ona önemli ölçüde daha fazla savunma gücü sağlamış. Yine de fıçının içinde bir şeylerin sekip durduğunu duyabiliyorsunuz sanırım...
actors.mobs.hermitcrab.name=yengeç
actors.mobs.mimic.desc=Taklitçiler, istedikleri herhangi bir şekle bürünebilen büyülü yaratıklardır. Zindanlarda, şüphelenmeyen maceracıları cezbetmek için neredeyse her zaman bir hazine sandığı şeklini seçerler. Taklitçilerin kötü bir ısırığı vardır, ancak genellikle normal bir sandıktan daha fazla hazine içerirler.
actors.mobs.mimic.discover_hint=Bu düşmanı zindanın herhangi bir yerinde bulabilirsiniz.
actors.mobs.mimic.hidden_hint=Bu sandıkta bir gariplik var... Yanına gidip açmaya çalışmak kötü bir fikir olabilir.
actors.mobs.mimic.name=taklitçi
actors.mobs.mimic.reveal=O göğüs bir taklitçi!
actors.mobs.mob.died=Uzaktan bir şeyin öldüğünü duyuyorsunuz.
actors.mobs.mob.discover_hint=Bu düşmanı zindanın belirli bir bölgesinde bulabilirsiniz.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Öldüren: %s
actors.mobs.monk$focus.desc=Bu keşiş hedefine mükemmel bir şekilde odaklanmış durumda ve rakibin hamlelerini daha yapmadan tahmin ediyor gibi görünüyor. Odaklanmış haldeyken, bu karaktere karşı yapılan bir sonraki fiziksel saldırı, koşullar ne olursa olsun, kesinlikle ıskalayacaktır. Bu saldırıyı savuşturmak keşişin odağını tüketecek ve başka bir saldırıyı savuşturmak için tekrar odaklanması gerekecektir. Keşişler hareket halindeyken daha hızlı odaklanma kazanırlar.
actors.mobs.monk$focus.name=odaklı
actors.mobs.monk.def_verb=engellendi
actors.mobs.monk.desc=Bu keşişler, şehirlerinin sırlarını bütün yabancılardan korumaya adanmış fanatiklerdir. Zırh ya da silah kullanmaz, yalnızca silahsız dövüş sanatlarına güvenirler.
actors.mobs.monk.name=cüce keşiş
actors.mobs.monk.parried=savuşturdu
actors.mobs.necromancer$necroskeleton.desc=Bu iskelet bir nekromancer tarafından çağrılmıştır. Tıpkı normal bir iskelet gibi davranır ve onu çağıran nekromancer öldürüldüğünde ölür.
actors.mobs.necromancer$necroskeleton.name=nekromancer'ın iskeleti
actors.mobs.necromancer.desc=Bu çırak karanlık büyücüler, kötü sanatlarını uygulamak için mükemmel bir yer olduğu için hapishaneye akın ettiler. Necromancer'lar, kendileri için savaşmaları için iskeletler çağıracak ve onlara güç verecekler. Necromancer'ı öldürmek, çağırdığı iskeleti de öldürecektir.
actors.mobs.necromancer.name=büyücü
actors.mobs.npcs.blacksmith.cant_enter_old=Bu oyun turunda o bölgeye erişim mümkün değil. Yeni görevi denemek için yeni bir oyun başlatın!
actors.mobs.npcs.blacksmith.def_verb=engellendi
actors.mobs.npcs.blacksmith.desc=Bu trol demircisi, tüm troller gibi görünüyor: uzun ve ince, derisi ise hem rengi hem de dokusuyla taşa benziyor. Trol demircisi, orantısız derecede küçük aletlerle uğraşıyor.
actors.mobs.npcs.blacksmith.enter_no=Henüz değil
actors.mobs.npcs.blacksmith.enter_yes=Ben hazırım
actors.mobs.npcs.blacksmith.entrance_blocked=Aşağıya inen yol kapalı.
actors.mobs.npcs.blacksmith.exit_no=Henüz değil
actors.mobs.npcs.blacksmith.exit_warn_crystal=O dev kristal de hâlâ orada duruyor. Onu yok edersen fazladan para öderim.
actors.mobs.npcs.blacksmith.exit_warn_full=İşin bitti mi? Bolca altın kazandın, ama eşyalarından hiçbirini geride bırakmadığından emin ol. Unutma, yukarı çıktıktan sonra seni tekrar içeri almayacağım.
actors.mobs.npcs.blacksmith.exit_warn_fungi=O dev mantar da hâlâ orada duruyor. Onu öldürürsen fazladan para öderim.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=O gnoll büyücüsü de hâlâ orada. Onu öldürürsen fazladan para öderim.
actors.mobs.npcs.blacksmith.exit_warn_high=İşin bitti mi? Görünüşe göre epey altın toplamışsın, ama biraz dahaına ihtiyacım var. _40 parça_ elde edebilmelisin. Unutma, yukarı çıktığında seni tekrar içeri almayacağım._
actors.mobs.npcs.blacksmith.exit_warn_low=Bitirdin mi zaten? Çok fazla altının yok gibi görünüyor. _40 parça_ alabilirsin. Unutma, yukarı çıktığında seni tekrar içeri almayacağım._
actors.mobs.npcs.blacksmith.exit_warn_med=İşin bitti mi? En azından biraz altın buldun, ama madende kesinlikle daha fazlası var. _40 parça_ çıkarabilmelisin. Unutma, yukarı çıktıktan sonra seni tekrar içeri almayacağım._
actors.mobs.npcs.blacksmith.exit_warn_none=Bitirdin mi zaten? Neredeyse hiç altının yok! 40 parça daha alabilmelisin. Unutma, yukarı çıktığında seni tekrar içeri almayacağım.
actors.mobs.npcs.blacksmith.exit_yes=Bitirdim
actors.mobs.npcs.blacksmith.get_lost=Meşgulüm. Kaybol!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey İnsan! Önemli biri gibi görünüyorsun.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Dikkatli ol, maden senin gibi küçük bir insan için tehlikeli. Bir süredir terk edilmiş ve bir sürü kristal büyümeye başlamış. Parlaklar ama çok kırılgan oldukları için hiçbir işe yaramazlar ve onları koruyan bazı sihirli şeyler var. Oldukça güçlüler, bu yüzden _nerede madencilik yaptığına dikkat et_ yoksa dikkatlerini çekersin. Bir yerde _dev bir kristal_ de var. Çok daha sert, bu yüzden kırmaya başlarsan bir kavgaya hazır ol. Ama eminim onu kırmak tüm kristal büyümesini yavaşlatacaktır, bu yüzden bunu yapabilirsen fazladan ödeme yaparım.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey İnsan! Çok cesur birine benziyorsun.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Dikkatli ol, maden senin gibi küçük bir insan için tehlikeli. Orada bir çeşit mantar canavarı büyüyor. Seni görürlerse çok ölümcül olan mantar nöbetçileri var, ama en azından kalkıp seni kovalayamıyorlar. Hayatta kalmak istiyorsan _gözden uzak dur_. _En büyük mantarı_ alt etmeyi başarırsan ekstra ödeme yapacağım, ama bu gerçekten çaba gerektirecek. Duvarlarda gizlenmiş bir sürü miselyum düğümüne bağlı. Ona gerçekten zarar verebilmek için önce çoğunu kırman gerekecek.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Dikkatli ol, maden senin gibi küçük bir insan için tehlikeli. Bazı gnoll'lar da altını istiyor ve şimdi ortalığı mahvediyorlar. Aptal yaratıklar oldukları için madencilikleri her türlü çökme ve mağara göçüğüne neden oldu. Bunların arasından kazman gerekecek, bu yüzden _son zamanlarda bozulmuş kayaları ara._ Sanırım sorunların çoğunu gnoll'lardan biri, muhtemelen bir _jeomancer şamanı_ veya benzeri bir şey çıkarıyor. Onu bulup öldürürsen fazladan ödeme yaparım, ama eminim karşılık verecektir.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey İnsan! Çok hızlı birine benziyorsun.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey İnsan! Çok zeki birine benziyorsun.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey İnsan! Çok sinsi birine benziyorsun.
actors.mobs.npcs.blacksmith.intro_quest_start=Faydalı olmak mı istiyorsun, ha? Evet, yapabileceğin bir şeyim var. Bu atölyeyi eski bir madenin üzerine kurdum, şu merdivenden aşağı inmen gerekiyor. Şu kazmayı al ve bana biraz _koyu altın cevheri_ çıkar. 40 parça yeterli olur. Oradaki kaya güzel ve yumuşak, bu yüzden _biraz çabayla duvarları delebilirsin._ Ne demek, nasıl ödeyeceğim? Açgözlüsün... Tamam, tamam, senin için biraz demircilik yapabilirim. Kendini şanslı say, etraftaki tek demirci benim.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey İnsan! Çok sert birine benziyorsun.
actors.mobs.npcs.blacksmith.lost_pick=Şaka mı yapıyorsun? Kazmam nerede?!
actors.mobs.npcs.blacksmith.name=trol demirci
actors.mobs.npcs.blacksmith.quest_start_prompt=Aşağı inmeye hazır mısın? Altın için biraz boş yerin olduğundan emin ol.\n\n_Seni oraya sadece bir kere bırakacağım!_
actors.mobs.npcs.blacksmith.reminder=Vaktimi boşa harcamayı bitirdin mi? Maden girişi şurada.
actors.mobs.npcs.blacksmith.reminder_crystal=Bana olabildiğince çok altın getirin ve büyük kristali de kırmaya çalışın.
actors.mobs.npcs.blacksmith.reminder_fungi=Bana olabildiğince çok altın getirin ve dev mantarı da öldürmeye çalışın.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bana olabildiğince çok altın getirin ve gnoll jeomancer'ı da öldürmeye çalışın.
actors.mobs.npcs.ghost.crab_1=Merhaba %s... Bir zamanlar senin gibiydim - güçlü ve kendinden emin... Ama kadim bir yaratık tarafından öldürüldüm... Buradan ayrılamam... İntikamımı alana kadar... Hayatımı alan _büyük yengeci_ öldür... \n\nOlağanüstü yaşlı... Kocaman tek bir pençesi ve kalın bir kabuğu var... _Pençesine dikkat et, yengeci şaşırtmalısın yoksa pençesiyle seni bloke eder..._
actors.mobs.npcs.ghost.crab_2=Lütfen... Bana yardım edin... Kabuklu yaratığı öldürün... \n\n_Sizi gördüğünde her zaman engelleyecektir..._
actors.mobs.npcs.ghost.desc=Hayalet zar zor görülebiliyor. Hüzünlü bir yüze sahip, şekilsiz, soluk bir ışık noktası gibi görünüyor.
actors.mobs.npcs.ghost.find_me=Teşekkür ederim... beni bulmaya gelin...
actors.mobs.npcs.ghost.gnoll_1=Merhaba %s... Bir zamanlar senin gibiydim - güçlü ve kendinden emin... Ama hain bir düşman tarafından öldürüldüm... Buradan ayrılamam... İntikamımı alana kadar... Hayatımı alan _hilebaz gnoll'u öldür... \n\nDiğer gnoll'lara benzemiyor... Gizleniyor ve fırlatılan silahlar kullanıyor... _Zehirli ve yakıcı oklarına dikkat edin, uzaktan saldırmayın..._
actors.mobs.npcs.ghost.gnoll_2=Lütfen... Bana yardım edin... Hilebazı alt edin... \n\n_Size isabet etmesine izin vermeyin... Ona yaklaşın..._
actors.mobs.npcs.ghost.name=üzgün hayalet
actors.mobs.npcs.ghost.rat_1=Merhaba %s... Bir zamanlar senin gibiydim - güçlü ve kendinden emin... Ama iğrenç bir canavar tarafından öldürüldüm... Buradan ayrılamam... İntikamımı alana kadar... Hayatımı alan o iğrenç fareyi öldür... \n\n Bu katta dolaşıyor... Her yere pislik saçıyor... _Koku bulutundan ve aşındırıcı ısırığından sakının, asit suda çözünür..._
actors.mobs.npcs.ghost.rat_2=Lütfen... Bana yardım edin... Bu iğrenç yaratığı öldürün... \n\n_Suyun yakınında savaşın... Kokudan uzak durun..._
actors.mobs.npcs.imp.cya=Görüşürüz, %s!
actors.mobs.npcs.imp.desc=Cinler, daha küçük iblislerdir. Ne güçleriyle ne de sihir yetenekleriyle dikkat çekerler, ancak oldukça zeki ve sosyaldirler. Birçok cin, iblis olmayanlar arasında yaşamayı tercih eder.
actors.mobs.npcs.imp.golems_1=Benim durumumda öldürülmesi gerekenler _golemler_. Bakın, burada küçük bir iş kuracağım ama bu aptal golemler işleri bozuyor! Gezgin granit yığınlarıyla pazarlık yapmak çok zor, lanet olsun onlara! Bu yüzden lütfen... diyelim ki _4 tanesini_ öldürün ve ödülünüzü alın.
actors.mobs.npcs.imp.golems_2=Golem avınız nasıl gidiyor? Jetonları almayı unutmayın.
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.intro=Maceracı mısınız? Maceracıları çok severim! Bir şeyin öldürülmesi gerektiğinde her zaman onlara güvenebilirsiniz, değil mi? Tabii ki ödül karşılığında ;)
actors.mobs.npcs.imp.monks_1=Benim durumumda öldürülmesi gerekenler _keşişler_. Bakın, burada küçük bir iş kuracağım ama bu manyaklar kendileri hiçbir şey satın almıyorlar ve diğer müşterileri de korkutup kaçıracaklar. Bu yüzden lütfen... diyelim ki _5 tanesini_ öldürün, ödül sizin olsun.
actors.mobs.npcs.imp.monks_2=Ha, hâlâ hayattasın! Kungfu'nun daha güçlü olacağını biliyordum ;) Sadece jetonları almayı unutma.
actors.mobs.npcs.imp.name=hırslı şeytan
actors.mobs.npcs.impshopkeeper.buyback=Cin, eşyanızı neşeyle size geri verir.
actors.mobs.npcs.impshopkeeper.desc=Cin, iç salonların sınırında küçük bir dükkan açmış. Tanıdık bir yüz görmek güzel, ama fiyatları hiç de dostane görünmüyor.
actors.mobs.npcs.impshopkeeper.greetings=Merhaba, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Ne yaptın %s? Çabuk alışveriş yap, buradan çıkmam lazım!
actors.mobs.npcs.impshopkeeper.name=hırslı şeytan
actors.mobs.npcs.impshopkeeper.thief=Sana güvenebileceğimi sanıyordum!
actors.mobs.npcs.mirrorimage.desc=Bu yanılsama sana çok benziyor ama daha soluk ve hafifçe seğiriyor.
actors.mobs.npcs.mirrorimage.discover_hint=Bu karakteri belirli bir parşömenle bulabilirsiniz.
actors.mobs.npcs.mirrorimage.name=ayna görüntüsü
actors.mobs.npcs.npc.discover_hint=Bu karakteri zindanın belirli bir bölgesinde bulabilirsiniz.
actors.mobs.npcs.prismaticimage.desc=Bu parıldayan illüzyon size çok benziyor, hatta mevcut silahınızı ve zırhınızı kullanıyor gibi görünüyor. Prizmatik görüntüler, gelişmiş savunmaları ve sağlıklarını kullanarak sizi korumak için düşmanlardan dikkat çekmeye çalışacak. Ayna görüntülerine göre aynı saldırı gücüne sahip olmasalar da, zırhınızdan faydalanmak da dahil olmak üzere gelişmiş dayanıklılığa sahipler. Canları 0'a düştüğünde, prizmatik görüntüler birkaç tur içinde kaybolacak ve bu süre zarfında hala iyileştirilebilirler. Düşman yokken, prizmatik görüntüler kaybolacak ve efendilerine geri dönecektir.
actors.mobs.npcs.prismaticimage.discover_hint=Bu karakteri belirli bir parşömenle bulabilirsiniz.
actors.mobs.npcs.prismaticimage.name=prizmatik görüntü
actors.mobs.npcs.ratking.confused=Ne... Neredeyim ben? Krallığımın bana ihtiyacı var!
actors.mobs.npcs.ratking.crown_after=Yeni zırhınızın tadını çıkarıyor musunuz? Geri dönüş yok!
actors.mobs.npcs.ratking.crown_clothes=Üzerine biraz giyin! Kraliyet ailesiyle konuşacak durumda değilsin!
actors.mobs.npcs.ratking.crown_desc=Ooo, bu taç benim için mi!? Benimkinden çok daha parlak görünüyor, bu yüzden memnuniyetle kabul ediyorum! Aslında, bu taç için size bir şey teklif edebilirim. Sizin gibi bir kahramana yakışır muazzam bir güç! Bunu ister misiniz?
actors.mobs.npcs.ratking.crown_fine=Tamam! Zaten bunu istemiyordum ki...
actors.mobs.npcs.ratking.crown_info=Önce bana daha fazla bilgi verin.
actors.mobs.npcs.ratking.crown_no=İstemem...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, teşekkürler! Şimdi git ve kralını gururlandır!
actors.mobs.npcs.ratking.crown_yes=Elbette!
actors.mobs.npcs.ratking.desc=Bu sıçan, normal bir keseli sıçandan biraz daha büyük. Başında minik bir taç takıyor.
actors.mobs.npcs.ratking.desc_birthday=Bu fare, normal bir keseli fareden biraz daha büyük. Her zamanki tacı yerine minik yeşil bir parti şapkası takıyor. Fare Kral'ın doğum günü kutlu olsun!
actors.mobs.npcs.ratking.desc_crown=Bu sıçan, normal bir keseli sıçandan biraz daha büyük. Başında cüce kral tacı takıyor.
actors.mobs.npcs.ratking.desc_winter=Bu fare, normal bir keseli fareden biraz daha büyük. Her zamanki tacı yerine minik bir bayram şapkası takmış. Mutlu Bayramlar!
actors.mobs.npcs.ratking.discover_hint=Bu karakteri zindanın belirli bir bölgesinin sonunda bulabilirsiniz.
actors.mobs.npcs.ratking.name=fare kralı
actors.mobs.npcs.ratking.not_sleeping=Uyuyamıyorum!
actors.mobs.npcs.ratking.what_is_it=Bu da ne? Bu saçmalıklarla uğraşacak vaktim yok. Krallığım kendi kendini yönetmeyecek!
actors.mobs.npcs.sheep.baa!=Mea!
actors.mobs.npcs.sheep.baa.=Mea.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.baa?=Baa?
actors.mobs.npcs.sheep.def_verb=engellendi
actors.mobs.npcs.sheep.desc=Bu sihirli bir koyun. Peki sihirli olan ne? Onu öldüremezsiniz. Sihirli bir şekilde yok olana kadar orada duracak, bu sırada boş bir bakışla geviş getirecek.
actors.mobs.npcs.sheep.discover_hint=Bu karakteri belirli bir eşya veya tuzak kullanarak bulabilirsiniz.
actors.mobs.npcs.sheep.name=koyun
actors.mobs.npcs.shopkeeper.buyback=Dükkan sahibi istemeyerek de olsa eşyanızı size geri veriyor.
actors.mobs.npcs.shopkeeper.desc=Bu tıknaz adam, bir zindandan ziyade büyük bir şehrin ticaret bölgesine daha uygun görünüyor. Fiyatları da neden burada iş yapmayı tercih ettiğini açıklıyor.
actors.mobs.npcs.shopkeeper.flee=Dükkân sahibi kaçtı!
actors.mobs.npcs.shopkeeper.name=dükkâncı
actors.mobs.npcs.shopkeeper.sell=Bir eşya sat
actors.mobs.npcs.shopkeeper.talk=Konuşmak
actors.mobs.npcs.shopkeeper.talk_ascent=O muskayla ne yapmayı planladığınızı bilmiyorum ama ben bunun bir parçası olmak istemiyorum. Başka bir şey satın alın ve yolunuza devam edin, ikimizin de bu yerden ayrılması gerekiyor!
actors.mobs.npcs.shopkeeper.talk_caves=Para harca, daha uzun yaşa.\n\nAh, bir de onu görürsen o trol demirciye benden selam söyle. O kabadayıya geçen hafta sattığım çekiç için hâlâ bana borcu olduğunu hatırlat!
actors.mobs.npcs.shopkeeper.talk_city=Burada sattığım ürünler sizi güvende tutabilir. \n\n... Ve lütfen burada oyalanmayın. Buradaki yerlilerin beni rahat bırakması çok uzun sürdü, başınıza bela açmanızı istemiyorum!
actors.mobs.npcs.shopkeeper.talk_halls=Merhaba, iblis avcıları için özel fiyatlarım var! \n\nAyrıca aşağıda dikkatli olun! Aşağıdaki iblisler ne kadar cesur olduğunuzu umursamayacaklar. Ölüyseniz yukarı çıkıp daha fazla para harcayamazsınız! ;) \n\nİblisler benim gibi mi? Hehe, hiç de değil. Ben sadece ufak tefek biriyim, pek savaşçı değilim ve aklımı korumayı başardım. Aşağıdaki iblisler çok daha güçlü şeyler ve hepsi... şey... aşağıda dikkatli olun.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Merhaba Majesteleri, yoksa artık Kutsal Hazretleri mi demeliyim? Hehe, her iki durumda da burası sizin için uygun bir yer değil, ölürseniz birçok insan çok üzülür. Ama eminim ki biraz paranız vardır, neden bunun önüne geçmek için bir şeyler satın almıyorsunuz?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=İşte gezgin kahraman! Başka bir kasabayı kurtarmaya çalışıyorsanız, iyi şanslar, buradaki tehlikeler sıradan haydut çetelerinden çok daha büyük. Eminim herkesten daha iyisini yapacaksınız, sadece dükkanımın hemen önünde ölmemeye çalışın.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Hanımefendi, bu ortama pek aşina değilsiniz galiba. Dar zindan koridorları, büyük salonlar veya şehri çevreleyen ormanlar kadar geniş değil, değil mi? Hehe, lafı fazla uzatmayayım, neden bir şey satın almıyorsunuz?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Başarılı bir macera için ihtiyacınız olan her şeye sahibim!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, sanırım şehrin bir yerinde senin adının yazılı olduğu bir arama ilanı gördüm. Kaçak mısın? Yoksa masum musun? Tabii ki, tabii ki... Üzülme, seni ihbar etmekten daha iyi işlerim var, ama emin olmak için bir şey satın alsan iyi olur belki?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Bölgeyi temizlemek için hırsızlar loncasından mı geldiniz? Hayır, sadece alışveriş mi yapıyorsunuz? Madem buradasınız, birkaç canavarı da öldürün. İndirim de beklemeyin, size iyi haraç ödüyorum ve burada beni zar zor koruyorsunuz.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=İlginç bir mührünüz var orada, genellikle tek parça halinde olurlar. Gözden düşmüş bir kahraman mısınız yoksa? Neyse, ne yaptıysanız beni ilgilendirmez, paralarınız hala geçerli.
actors.mobs.npcs.shopkeeper.thief=Hırsız, hırsız!
actors.mobs.npcs.shopkeeper.warn=İzleyin! Bir daha uyarmayacağım.
actors.mobs.npcs.vaultlaser.desc=Bu nöbetçi düzenli aralıklarla lazer ışını ateşliyor. _Burası sadece bir test alanı olduğu için lazerler size zarar vermeyecektir._
actors.mobs.npcs.vaultlaser.name=kasa lazer nöbetçisi
actors.mobs.npcs.vaultsentry.desc=Bu nöbetçi, bölgeyi belirli bir düzende tarıyor. _Burası sadece bir test alanı olduğu için, nöbetçi sizi tespit etse bile hiçbir şey yapmayacak._
actors.mobs.npcs.vaultsentry.name=kasa tarama nöbetçisi
actors.mobs.npcs.wandmaker.def_verb=engellendi
actors.mobs.npcs.wandmaker.desc=Bu yaşlı ama dinç beyefendinin yüzünde hafif bir şaşkınlık ifadesi var. Sihirli bir kalkanla korunuyor.
actors.mobs.npcs.wandmaker.intro_1=I, bir asa için nadir bir malzeme bulmak için buraya geldim, ama kayboldum ve sihirli kalkanım zayıflıyor. Yakında ayrılmam gerekecek, ama aradığımı almadan gitmeye dayanamam.
actors.mobs.npcs.wandmaker.intro_2=Bunu benim için temin edebilirseniz, size özenle yapılmış sihirli değneklerimden biriyle ödeme yapmaktan mutluluk duyarım! Yanımda iki tane getirdim, hangisini tercih ederseniz onu alabilirsiniz.
actors.mobs.npcs.wandmaker.intro_berry=Bu hapishanenin eski gardiyanı bir _çürük meyvesi bitkisi_ besliyordu ve ben de onun tohumlarından birini arıyorum. Bitki muhtemelen artık vahşileşmiştir, bu yüzden ondan tohum almak zor olabilir. Bahçesi buralarda bir yerde olmalı. Eğer sağ salim kalmak istiyorsanız, _sarmaşıklarından uzak durmaya_ çalışın. Ateş kullanmak cazip gelebilir ama lütfen yapmayın, bitkiyi öldürür ve tohumlarını yok edersiniz.
actors.mobs.npcs.wandmaker.intro_cleric=Ah, merhaba Majesteleri! Böylesine kasvetli bir yerde sizinle karşılaşmak ne hoş bir sürpriz! Rahatsızlık vermek istemem ama sizin için bir görevim olabilir.
actors.mobs.npcs.wandmaker.intro_duelist=Merhaba hanımefendi! Böylesine kasvetli bir yerde bir kahramanla karşılaşmak ne hoş bir sürpriz! Yaşlı bir adama yardım etmek isterseniz, sizin için bir görevim olabilir.
actors.mobs.npcs.wandmaker.intro_dust=Ceset tozu arıyorum. Bu, genellikle bu gibi yerlerde ortaya çıkan özel bir tür lanetli kemik unu. Buralarda bir yerlerde barikatlı bir oda olmalı, eminim orada biraz toz çıkacaktır. Ancak dikkatli olun, tozun taşıdığı lanet oldukça güçlü, bana en kısa sürede geri dönün, ben de sizin için temizleyeceğim.
actors.mobs.npcs.wandmaker.intro_ember=Yeni doğmuş bir ateş elementalinden _taze közler_ arıyorum. Elementaller genellikle çağırma ritüeli kontrol altında olmadığında ortaya çıkarlar, bu yüzden sadece birkaç mum ve bir ritüel alanı bulun, eminim birini ortaya çıkarabilirsiniz. Ancak onunla savaşırken _kendinizi bir köşeye sıkıştırmaktan_ kaçınmalısınız veya _yanınızda bir tür dondurucu eşya bulundurabilirsiniz._ Yeni doğmuş elementaller oldukça güçlü ve kaotiktir, ancak soğuğa dayanamazlar.
actors.mobs.npcs.wandmaker.intro_huntress=Merhaba hanımefendi! Burada böyle güler yüzlü birini görmek hoş bir sürpriz, değil mi? Aslında, yemin ederim yüzünüzü daha önce görmüş gibiyim ama hatırlayamıyorum... Neyse, eğer macera için buradaysanız, sizin için bir görevim olabilir.
actors.mobs.npcs.wandmaker.intro_mage=Merhaba %s! Senin ve büyücüler enstitüsüyle ilgili bir sorun olduğunu duydum? Neyse, boş ver, zaten o sıkıcı tipleri hiç sevmedim. Eğer istersen, senin için bir görevim olabilir.
actors.mobs.npcs.wandmaker.intro_rogue=Aman Tanrım, beni çok korkuttun! Bu yerden aklı başında bir haydutla hiç karşılaşmadım, demek ki sen yüzeyden geliyorsun! Eğer bir yabancıya yardım etmeye hazırsan, senin için bir görevim olabilir.
actors.mobs.npcs.wandmaker.intro_warrior=Merhaba! Böylesine kasvetli bir yerde kuzeyden gelen bir savaşçıyla karşılaşmak ne hoş bir sürpriz! Buraya gelmek için epey yol kat etmiş olmalısınız. Eğer macera arıyorsanız, sizin için bir görevim olabilir.
actors.mobs.npcs.wandmaker.name=yaşlı asa yapımcısı
actors.mobs.npcs.wandmaker.reminder_berry=%s, Rotberry tohumu bulma konusunda şansın yaver gitti mi? Bitki örtüsüyle dolu bir oda ara.
actors.mobs.npcs.wandmaker.reminder_dust=Ceset tozu konusunda bir gelişme var mı, %s? Birkaç barikat arayın.
actors.mobs.npcs.wandmaker.reminder_ember=%s, o közlerle ilgili bir gelişme var mı? Dört mum ve ritüel alanını bulmanız gerekecek.
actors.mobs.phantompiranha.desc=Hayalet piranalar, sihirli yeteneklere ve ürkütücü saydam vücutlara sahip nadir bir pirana türüdür. Saldırıya uğradıklarında kaçmak veya düşmanlarına hızla yaklaşmak için ışınlanabilirler! Savaşması sinir bozucu olsa da, etleri sihirli özellikleri nedeniyle çok değerlidir.
actors.mobs.phantompiranha.name=hayalet piranha
actors.mobs.phantompiranha.teleport_away=Hayalet pirana ışınlanarak uzaklaşıyor...
actors.mobs.piranha.desc=Bu etçil balıklar özellikle su baskınına uğramış bölgeleri korumak için yetiştirilir. Isırıkları ölümcül olduğundan, onlarla doğrudan karşı karşıya gelmekten kaçınmak en iyisidir.
actors.mobs.piranha.discover_hint=Bu düşmanı zindanın herhangi bir yerinde bulabilirsiniz.
actors.mobs.piranha.name=dev piranha
actors.mobs.pylon.desc_active=Bu bölgedeki makineleri çalıştıran elektriği düzenlemeye yardımcı olmak için tasarlanmış bir elektrik direği. Direk şu anda elektrik enerjisiyle dolu, bu da DM-300'ü süper şarj eden şey olmalı! Bu durumda direkler savunmasızdır, ancak saat yönünde yakındaki hücrelere elektrik atlaması yaparlar. Ağır metal yapıları nedeniyle direkler büyük miktarda hasara karşı dayanıklıdır.
actors.mobs.pylon.desc_inactive=Bu bölgedeki makineleri çalıştıran elektriği düzenlemeye yardımcı olmak amacıyla yapılmış bir elektrik direği. \n\nDirek şu anda devre dışı ve hasara karşı bağışıklıdır.
actors.mobs.pylon.name=elektrik direği
actors.mobs.rat.desc=Keseli sıçanlar, kanalizasyonlarda yaşayan saldırgan ancak oldukça zayıf canlılardır. Isırıkları oldukça tehlikelidir, ancak yalnızca çok sayıda olduklarında hayati tehlike oluştururlar.
actors.mobs.rat.name=keseli sıçan
actors.mobs.ripperdemon.desc=Bu korkunç yaratıklar, bu bölgedeki çok sayıda cüce cesedinin şeytani güçler tarafından kullanılmasının sonucudur. Ripperlar, cücelere benzeyen, ancak kırık bedenleri ve kemikten yapılmış uzun, keskin pençeleri olan zayıf, hortlak benzeri yaratıklardır. Ripper iblisleri özellikle dayanıklı değildir, ancak çevik ve tehlikelidirler. Hedeflerine hızla ulaşmak ve pençeleriyle onları parçalamak için büyük mesafeler sıçrayabilirler.
actors.mobs.ripperdemon.leap=Yırtıcı iblis atlamaya hazırlanıyor!
actors.mobs.ripperdemon.name=yırtıcı şeytan
actors.mobs.rotheart.desc=Çürük meyvesi oldukça benzersizdir. Çürüyerek besin sağlamak yerine, meyve büyür, sertleşir ve tohumu içine alır. Bu, meyvenin içinde büyüyen iç organlar için koruma sağlar. Bu dev küreye, yetişkin bir çürük meyvesi bitkisinin kalbi denir.
actors.mobs.rotheart.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.rotheart.name=çürük kalp
actors.mobs.rotlasher.desc=Çürük kırbacı, olgun bir çürük meyvesi bitkisinin kök yapısının bir parçasıdır ve aynı zamanda başlıca savunma aracıdır. Kırbaçlar kördür ve toprağa saplanmıştır, ancak yakındaki herhangi bir tehdidi tespit ettikten sonra şiddetli bir şekilde saldırırlar. Yakınlarda düşman olmadığında, çevredeki bitki örtüsüyle karışmaya çalışarak hareketsiz dururlar.
actors.mobs.rotlasher.discover_hint=Bu düşmanı belirli bir görev sırasında bulabilirsiniz.
actors.mobs.rotlasher.name=çürük kırbaç
actors.mobs.scorpio.desc=Bu devasa, örümcek benzeri şeytani yaratıklar yakın dövüşten kaçınır ve uzun mesafelerden ölümcül, testere dişli dikenler fırlatmayı tercih ederler.
actors.mobs.scorpio.name=akrep
actors.mobs.senior.desc=Bu keşişler, şehirlerinin sırlarını bütün yabancılardan korumaya adanmış fanatiklerdir. Zırh ya da silah kullanmaz, yalnızca silahsız dövüş sanatlarına güvenirler.
actors.mobs.senior.name=kıdemli keşiş
actors.mobs.shaman$blueshaman.spell_desc=Bu şaman mavi bir maske takıyor ve geçici olarak aldığınız hasarı artıran bir sihir kullanacak.
actors.mobs.shaman$purpleshaman.spell_desc=Bu şaman mor bir maske takıyor ve geçici olarak isabet oranınızı ve kaçınma yeteneğinizi azaltan bir sihir kullanacak.
actors.mobs.shaman$redshaman.spell_desc=Bu şaman kırmızı bir maske takıyor ve saldırı gücünüzü geçici olarak zayıflatan bir sihir kullanacak.
actors.mobs.shaman.bolt_kill=Büyülü ok seni öldürdü...
actors.mobs.shaman.desc=En zeki gnoll'lar şaman büyüsünde ustalaşabilir. Gnoll şamanları güç eksikliklerini savaş büyüleriyle kapatır ve kabiledeki yerlerini sorgulayanlara karşı bunları kullanmaktan çekinmez.
actors.mobs.shaman.name=gnoll şamanı
actors.mobs.skeleton.def_verb=engellendi
actors.mobs.skeleton.desc=İskeletler, derinlerden sızan kara büyünün canlandırdığı talihsiz maceracıların ve zindan sakinlerinin kemiklerinden oluşur. Yeterince hasar aldıklarında kemikleri etrafa savurarak parçalanırlar.
actors.mobs.skeleton.explo_kill=Kemiklerin patlaması sonucu öldün...
actors.mobs.skeleton.name=iskelet
actors.mobs.slime.def_verb=engellendi
actors.mobs.slime.desc=Sümüksü yaratıklar, kauçuk benzeri dış gövdeleri ve sıvı iç kısımlarıyla garip, biraz da büyülü yaratıklardır. Şehir kanalizasyonları onlara bol miktarda su ve besin sağlar. Esnek dış zarları nedeniyle, sümüksü yaratıklara tek bir saldırıyla 6'dan fazla hasar vermek zordur.
actors.mobs.slime.name=balçık
actors.mobs.snake.desc=Bu devasa yılanlar, darbelerden hızla sıyrılıp kaçabildikleri için vurulmaları oldukça zordur. Ancak büyülü saldırılar veya sürpriz saldırılar onları hazırlıksız yakalayabilir. Yılanın görüş alanının dışındayken saldırarak sürpriz bir saldırı gerçekleştirebilirsiniz. Bunun bir yolu, yılanın sizi bir kapıdan kovalamasına izin vermek ve ardından kapıya girdikten hemen sonra saldırmaktır.
actors.mobs.snake.hint=Yılanlara karşı nasıl mücadele edeceğinizi öğrenmek için yılan üzerindeki inceleme düğmesini kullanmayı deneyin.
actors.mobs.snake.name=kanalizasyon yılanı
actors.mobs.spectralnecromancer.desc=İskeletler bir nekromancer'ın olmazsa olmazı olsa da, bazıları daha az cisimsel olan diğer hizmetkarları tercih eder. Spektral nekromancer'lar, tercih ettikleri hizmetkar olarak hayaletleri seçmişlerdir! Bireysel hayaletler iskeletler kadar güçlü olmasa da, bu nekromancer'lar bir sürü hayalet çağırmaktan çekinmezler!
actors.mobs.spectralnecromancer.name=spektral nekromancer
actors.mobs.spinner.desc=Bu yeşilimsi, tüylü mağara örümcekleri doğrudan dövüşmekten kaçınır. Ağlarına dolanan kurbanları zehirli ısırıklarından yavaşça ölürken uzakta beklemeyi tercih ederler.
actors.mobs.spinner.name=mağara örümceği
actors.mobs.statue.def_verb=engellendi
actors.mobs.statue.desc=Bunun zindanın cansız heykellerinden biri olduğunu düşünebilirsiniz, ancak kırmızı parlayan gözleri onu ele veriyor.
actors.mobs.statue.desc_weapon=Heykelin kendisi taştan yapılmış olsa da, elinde tuttuğu _%s_ gerçek gibi görünüyor.
actors.mobs.statue.discover_hint=Bu düşmanı zindanın herhangi bir yerinde bulabilirsiniz.
actors.mobs.statue.name=hareketli heykel
actors.mobs.succubus.desc=Sukkubuslar, biraz gotik tarzda giyinen baştan çıkarıcı kızlara benzeyen iblislerdir. Büyüleriyle bir kahramanı etkileyebilirler; kahraman büyü geçene kadar hiçbir şeye saldıramaz.
actors.mobs.succubus.name=sukkubus
actors.mobs.swarm.desc=Ölümcül sinek sürüsü öfkeyle vızıldıyor. Büyüsel olmayan her saldırı, onu iki küçük ama aynı derecede tehlikeli sürüye ayıracak.
actors.mobs.swarm.name=sinek sürüsü
actors.mobs.tengu$bombability$bombblob.desc=Burada aşırı ısınmış bir duman bulutu yükseliyor. Dikkat edin, patlayacak!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Yere yapışmış, hareket ettiremiyorsunuz!
actors.mobs.tengu$bombability$bombitem.desc=Tengu buraya garip görünümlü bir sis bombası attı ve bombadan yoğun, sıcak bir duman yükseliyor. Patlamaya doğru geri sayım yapıyormuş gibi yüksek bir tıkırtı sesi çıkarıyor! Bomba yere sabitlendiği için onu kaldıramıyorsunuz.
actors.mobs.tengu$bombability$bombitem.name=sis bombası
actors.mobs.tengu$fireability$fireblob.desc=Tengu ince bir toz fırlattı ve bu toz burada buhara dönüşüyor, alev almak üzere!
actors.mobs.tengu$shockerability$shockerblob.desc=Burada elektrik enerjisi birikiyor, bu karo üzerinde duran her şey bir sonraki turda elektrik çarpmasına maruz kalacak!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Çok fazla elektrik üretiyor, yakalayamazsınız!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu buraya DM-100 parçalarından yapılmış gibi görünen tuhaf bir makine bırakmış. Makine sürekli olarak etrafında elektrik kıvılcımları saçıyor, ancak tahmin edilebilir bir düzende ilerliyor gibi görünüyor. Etrafında sürekli elektrik kıvılcımları saçıldığı için bunu kaldırmanız imkansız.
actors.mobs.tengu$shockerability$shockeritem.name=Şok edici
actors.mobs.tengu.defeated=Sonunda özgürüm...
actors.mobs.tengu.desc=Tengular, yine Tengu adı verilen eski bir suikastçı klanının üyeleridir. Şuriken ve tuzakları bolca kullanmalarıyla tanınırlar.
actors.mobs.tengu.interesting=Bunu daha ilgi çekici hale getirelim...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Anladım, %s!
actors.mobs.tengu.notice_have=Şimdi seni yakaladım, %s!
actors.mobs.tengu.rankings_desc=Tengu tarafından suikaste uğradı
actors.mobs.thief.carries=Hırsız _%s_ taşıyor. Belli ki çalınmış.
actors.mobs.thief.desc=Bu mahkumlar hücrelerinden özgürce dolaşsalar da, burası hala onların hapishanesi. Zamanla, burası onların zihinlerini ve özgürlüklerini de ele geçirdi. Çok uzun zaman önce, bu çılgın hırsızlar ve haydutlar kim olduklarını ve neden çaldıklarını unuttular. Bu düşmanlar savaşmaktan çok çalmaya ve kaçmaya daha meyillidirler. Onları gözünüzden kaçırmayın, yoksa çalıntı eşyanızı bir daha asla göremeyebilirsiniz.
actors.mobs.thief.escapes=Hırsız %s'nuzu çaldı ve kaçtı!
actors.mobs.thief.name=çılgın hırsız
actors.mobs.thief.stole=Hırsız sizden %s'yu çaldı!
actors.mobs.tormentedspirit.desc=Azap çeken ruhlar, aslında iyi huylu olan ancak bir lanete maruz kalmış ruhlardır. Lanetli oldukları sürece bir hayalet gibi saldırırlar ve daha güçlüdürler! Ruhun yanındayken doğru eşyayı kullanarak laneti temizlemek mümkün olabilir. Lanet kalkarsa, ruh kesinlikle minnettar olacaktır...
actors.mobs.tormentedspirit.name=işkence görmüş ruh
actors.mobs.tormentedspirit.thank_you=Teşekkür ederim...
actors.mobs.vaultrat.desc=Bu fare, yeni kasa düşmanı yapay zekasını test etmek için bazı davranış değişiklikleri yaptı: \n_-_ Hareketleri duvarların arasından 'duyulabilir'. \n_-_ Önceden belirlenmiş bir devriye boyunca dolaşacak. \n_-_ Dolaşırken, hareket ettiği yönün arkasındaki tespit menzili önemli ölçüde azalır. \n_-_ Uyurken de tespit menzili azalır. \n_-_ Sizi tespit ettiğinde, avlanmaya geçmeden önce 'araştırma' yapacak. Araştırma yapan düşmanlar size doğru hareket eder ancak saldırmaz ve kapıların ve köşelerin arkasında kaybolmaları daha kolaydır.
actors.mobs.warlock.bolt_kill=Gölge oku seni öldürdü...
actors.mobs.warlock.desc=Cücelerin ilgisi mühendislikten gizli ilimlere kayınca kara büyücüler şehirde iktidarı ele geçirdi. Element büyüsüyle başladılar ama çok geçmeden iblisbilime ve ölü büyücülüğüne yöneldiler.
actors.mobs.warlock.name=cüce büyücü
actors.mobs.wraith.desc=Hayalet, mezarı veya türbesi rahatsız edilmiş bir günahkarın intikamcı ruhudur. Eterik bir varlık olduğu için, normal bir silahla vurmak çok zordur.
actors.mobs.wraith.discover_hint=Bu düşmanı zindanın herhangi bir yerinde bulabilirsiniz.
actors.mobs.wraith.name=hayalet
actors.mobs.yogdzewa$larva.desc=Yog-Dzewa'nın bu minik yavruları, üretilmesi kolay basit kölelerdir. Tek başlarına zayıf olsalar da, hızla çağrılırlar ve büyük sayılarda ezici bir güç haline gelebilirler.
actors.mobs.yogdzewa$larva.name=Tanrı'nın larvaları
actors.mobs.yogdzewa$larva.rankings_desc=Yog-Dzewa tarafından yutuldu.
actors.mobs.yogdzewa$yogeye.rankings_desc=Yog-Dzewa tarafından yutuldu.
actors.mobs.yogdzewa$yogripper.rankings_desc=Yog-Dzewa tarafından yutuldu.
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Yog-Dzewa tarafından yutuldu.
actors.mobs.yogdzewa.darkness=Karanlık giderek yaklaşıyor...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa, ölümlü dünyalara uzanan ve sonsuz büyümesini beslemek için onları yutan büyük bir canavar olan Kadim bir Tanrı'dır. Cüceler, karanlık büyülerle oynarken bu kozmik dehşetin dikkatini çekmiş olmalı ve o zamandan beri onu kontrol altında tutmaya çalışıyorlar. Yog-Dzewa, ham büyülü kaos boyutundan kaynaklanır ve gerçek formunu bu dünyaya getiremez. Bunun yerine, burada emrini yerine getirmek için avatarlar yaratmış ve şeytani hizmetkarlar çağırmıştır. Bu dev göz, Yog-Dzewa'nın bu dünyadaki gücünün odak noktasıdır. Gözün kendisi hareketsiz olsa da, güçlü şeytani büyü ışınları fırlatabilir ve kendisine yardımcı olmak için çeşitli hizmetkarlar çağırabilir.
actors.mobs.yogdzewa.desc_spawners=Üst katlardan gözünüze doğru yayılan şeytani enerji dalgalarını hissedebiliyorsunuz. Yukarıda hayatta bıraktığınız bir şey, Yog-Dzewa'ya güç aktarıyor olmalı. _Yog bu enerjiyi daha güçlü hizmetkarlar çağırmak için kullanacak!_
actors.mobs.yogdzewa.hope=UMUDUNUZ BİR İLLÜZYON!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=SENİ GÖRÜYORUM.
actors.mobs.yogdzewa.rankings_desc=Yog-Dzewa tarafından yutuldu.
actors.mobs.yogfist$brightfist.desc=Bu yumruk, saf ışık enerjisinden oluşmuştur. Her turda yakıcı ışık ışınları fırlatabilir! Bu ışınlar, ağır hasar vermenin yanı sıra sizi geçici olarak kör edecektir. Yumruk ayrıca kaçmak için arenayı kısa süreliğine kör edici bir ışıkla kaplayabilir! \n\nAncak yumruğun yakın dövüş menzilinde kullanabileceği özel bir yeteneği yoktur.
actors.mobs.yogfist$brightfist.name=parlak yumruk
actors.mobs.yogfist$brightfist.teleport=Yumruk, sizi ciddi anlamda kör eden bir ışık parlamasıyla ışınlanarak ortadan kayboluyor!
actors.mobs.yogfist$burningfist.desc=Alevlerle kaplı dev bir yumruk. Parmakları kapanırken çıtırdıyor ve yere korlar dökülüyor.
actors.mobs.yogfist$burningfist.name=yanan yumruk
actors.mobs.yogfist$darkfist.desc=Bu yumruk, saf karanlık enerjiden oluşmuştur. Her turda güçlü karanlık büyü patlamaları fırlatabilir! Bu patlamalar, ağır hasar vermenin yanı sıra ışık kaynağınızı da zayıflatacaktır. Yumruk ayrıca kaçmak için arenayı kısa süreliğine karanlığa boğabilir! \n\nAncak yumruğun yakın dövüş menzilinde kullanabileceği özel bir yeteneği yoktur.
actors.mobs.yogfist$darkfist.name=karanlık yumruk
actors.mobs.yogfist$darkfist.teleport=Yumruk, ışık kaynağınızı söndüren bir karanlık patlamasıyla ışınlanarak uzaklaşıyor!
actors.mobs.yogfist$rottingfist.desc=Çürümüş etten kocaman bir yumruk. Parmaklarının arasından pis kokulu bir balçık sızıyor, altındaki taşları lekeliyor.
actors.mobs.yogfist$rottingfist.name=çürüyen yumruk
actors.mobs.yogfist$rustedfist.desc=Bu yumruk, canlı metalden yapılmıştır. Güçlü yakın dövüş saldırılarına sahip, hareketli metalden oluşan devasa bir kütledir ve hedeflerini uzaktan da sakatlayabilir. Muazzam kütlesi nedeniyle, yumruğa verilen hasar anında değil, zaman içinde yavaş yavaş emilir. Ancak yumruk esnek değildir ve dar geçitlere giremez. Ayrıca, yavaş yavaş hasar alsa da, yumruğa birden fazla kez vurulursa, ertelenen hasar artmaya devam eder.
actors.mobs.yogfist$rustedfist.name=paslı yumruk
actors.mobs.yogfist$soiledfist.desc=Bu yumruk, kaotik toprak büyüsünden oluşmuştur. Hareket ettikçe etrafında sürekli olarak bitki örtüsü filizlenmesine neden olur. Ayrıca, hedefini hızla büyüyen sarmaşıklar ve köklerle saran yoğun toprak patlamaları da fırlatabilir! \n\nYumruk, bu bitki yaşamından güç alır ve yakınındaki uzun veya oluklu bitki örtüsünün miktarına bağlı olarak hasara karşı direnç gösterir!
actors.mobs.yogfist$soiledfist.name=kirli yumruk
actors.mobs.yogfist.desc=Bu yumruk, Yog-Dzewa'nın gücünün bir yönüdür. Yumruklar Yog-Dzewa'nın gücüyle bağlantılıdır ve göze yakın olduklarında her türlü hasardan korunurlar.
actors.mobs.yogfist.invuln_warn=Yumruk, göze yakın olduğu sürece zarar görmez!
actors.mobs.yogfist.rankings_desc=Yog-Dzewa tarafından yutuldu.
