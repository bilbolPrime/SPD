actors.blobs.waterofawareness.desc=Bu kuyunun suyundan bilgi gücü yayılıyor. Kuyudan su içmek, üzerinizdeki tüm eşyaları tam olarak tanımlamanızı, envanterinizdeki tüm eşyalar üzerindeki lanetleri belirlemenizi ve bulunduğunuz kattaki tüm eşyaları ortaya çıkarmanızı sağlayacaktır.
actors.blobs.waterofawareness.name=farkındalık suyu
actors.blobs.waterofawareness.procced=Bir yudum aldığınızda, zihninize bilgi akışını hissedersiniz.
actors.blobs.waterofhealth.desc=Bu kuyunun suyundan sağlık gücü yayılıyor. Bu kuyudan içmek yaralarınızı iyileştirir, açlığınızı giderir ve yıpranmış eşyalar üzerindeki lanetleri temizler.
actors.blobs.waterofhealth.name=sağlık suyu
actors.blobs.waterofhealth.procced=Bir yudum aldığınızda, yaralarınızın tamamen iyileştiğini hissedersiniz.
actors.blobs.web.desc=Burada her yer kalın bir ağla kaplı. Ağa dokunan veya içinden atılan her şey onu kıracak, ama aynı zamanda yerinde sıkışıp kalacak.
actors.blobs.web.name=örümcek ağı
actors.buffs.adrenaline.desc=Ani bir fiziksel güç artışı, adrenalin hem saldırı hem de hareket hızını artırdı.\n\nAdrenalin, hedefinin 2 kat hızda koşmasını ve 1,5 kat hızda saldırmasını sağlar.\n\nKalan tur sayısı: %s.
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenalinesurge.desc=Büyük bir güç artışı, ama ne yazık ki kalıcı değil.\n\nGüç artışı: +%d.\nGüç artışının zayıflamasına kadar geçen tur sayısı: %s.
actors.buffs.adrenalinesurge.name=güç artışı
actors.buffs.amok.desc=Amok, hedefinde büyük bir öfke ve kafa karışıklığı durumuna neden olur. Bir yaratık amok durumuna girdiğinde, ister dost ister düşman olsun, yakınındaki her şeye saldırır. Kalan amok süresi:
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Etrafınızı saran ince bir kalkan, büyülü saldırılardan gelen hasarın bir kısmını engelliyor. Büyülü zırhınız şu anda şu kadar güçlendirilmiş durumda: 0-%d. Büyülü zırh zayıflayana kadar geçen tur sayısı: %s.
actors.buffs.arcanearmor.name=gizemli zırh
actors.buffs.artifactrecharge.desc=Vücudunuzdan enerji akıyor ve bu da donattığınız eşyaların şarj olma hızını artırıyor. Her eşya biraz farklı şekilde etkileniyor, ancak hepsi normalden çok daha hızlı şarj olacak. Kalan tur sayısı:
actors.buffs.artifactrecharge.name=eser şarjı
actors.buffs.ascensionchallenge.almost=Yog'un muska üzerindeki tutuşunun zayıflamaya başladığını hissediyorsunuz, neredeyse başardınız!
actors.buffs.ascensionchallenge.beckon=Muska, uzaktaki düşmanlara seslenmeye başlar.
actors.buffs.ascensionchallenge.break=Bir an nefesinizi toparlayın ve yaralarınızın iyileşmeye başladığını hissedin!
actors.buffs.ascensionchallenge.damage=Muska karanlık enerji yaymaya başlıyor. Yanıyor!
actors.buffs.ascensionchallenge.desc=Yog-Dzewa bir şekilde tılsım aracılığıyla bu dünyada etkisini sürdürüyor ve yükselişinizi durdurmaya çalışıyor! Yog'un gücü zindanı çok daha tehlikeli hale getiriyor, düşman sayısını artırıyor ve onları daha güçlü kılıyor! Bu güç kontrol edilmezse artmaya devam edecek, Yog'un gücüyle güçlendirilmiş düşmanları yenerek zayıflatılabilir.
actors.buffs.ascensionchallenge.desc_beckon=Muska şu anda uzaktaki düşmanlara seslenerek konumunuzu bildiriyor.
actors.buffs.ascensionchallenge.desc_clear=Tılsımdan yayılan karanlık enerji şimdilik olabildiğince zayıflatıldı.
actors.buffs.ascensionchallenge.desc_damage=Tılsımdaki enerji o kadar güçlendi ki, _doğrudan size zarar veriyor!_
actors.buffs.ascensionchallenge.desc_haste=Bu tılsım şu anda uzaktaki düşmanları hızlandırıyor ve size daha hızlı ulaşmalarını sağlıyor!
actors.buffs.ascensionchallenge.desc_slow=Bu tılsım şu anda sizi yavaşlatıyor ve hız artırıcı etkileri etkisiz hale getiriyor!
actors.buffs.ascensionchallenge.haste=Tılsım, uzaktaki düşmanları hızlandırmaya başlıyor!
actors.buffs.ascensionchallenge.name=muskanın laneti
actors.buffs.ascensionchallenge.on_kill=Karanlık enerji sizi tüketiyor...
actors.buffs.ascensionchallenge.slow=Tılsım, envanterinizde kurşun ağırlığı gibi gelmeye başlıyor!
actors.buffs.ascensionchallenge.weaken=Tılsımın lanetinin biraz zayıfladığını hissedebilirsiniz.
actors.buffs.ascensionchallenge.weaken_info=Tılsımın laneti, daha fazla düşmanı yenerek zayıflatılabilir.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Düşmanları yenerseniz, tılsımın laneti zayıflayacaktır!
actors.buffs.barkskin.desc=Cildiniz sertleşti, ağaç kabuğu gibi pürüzlü ve sert bir his veriyor. Sertleşmiş cilt, etkili zırhınızı artırarak fiziksel saldırılara karşı daha iyi savunmanızı sağlar. Zırhınız şu anda şu kadar artırıldı: 0-%d. Kabuk derisi zayıflayana kadar tur sayısı: %s. Birden fazla kaynaktan kabuk derisi alırsanız, yalnızca en güçlü olanı uygulanır.
actors.buffs.barkskin.name=kabuk derisi
actors.buffs.barrier.desc=Tüm hasarı engelleyen dayanıklı bir güç kalkanı.\n\nKalan kalkan: %d.
actors.buffs.barrier.name=bariyer
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=öfkelendi
actors.buffs.berserk.angered_desc=Berserker'ın aldığı yaraların şiddeti, darbelerini güçlendirir. Berserker fiziksel hasar aldıkça öfkesi artar ve ona bonus hasar verir. Zırh tarafından engellenen hasar bile öfke birikimine katkıda bulunur. Öfke zamanla azalır. Berserker'ın sağlığı ne kadar düşükse, öfke o kadar uzun sürer. 100 öfke seviyesinde, Berserker çılgına dönebilir ve zırh seviyesine ve eksik sağlığına bağlı olarak kalkan kazanır. Öfke halindeyken kalkanı zamanla azalır ve tükendiğinde tekrar öfke biriktirmeden önce dinlenmesi gerekir.\n\nMevcut Öfke: _%1$.0f%%_\n_+%2$.0f%%_ hasar\n\nMevcut zırh ve HP'de öfke kalkanı: _%3$d_
actors.buffs.berserk.berserk=çılgınlık
actors.buffs.berserk.berserk_desc=Korku ve belirsizlik kaybolur, geriye sadece öfke kalır. Bu durumda Berserker son derece güçlüdür, +50%% hasar verir ve bonus kalkan kazanır, ancak her turda kalkan kaybeder.\n\nTüm kalkanı 0'a düştüğünde, öfke hali sona erer.\n\nÖfkelendikten sonra, Berserker tekrar öfke biriktirebilmek için iyileşmelidir.\n\nKalan Kalkan: %d
actors.buffs.berserk.exhausted=yorgun
actors.buffs.berserk.no_seal=Çılgına dönmek için kırık mührünüze ihtiyacınız var!
actors.buffs.berserk.rankings_desc=Çılgınca Ölüme
actors.buffs.berserk.recovering=iyileşiyor
actors.buffs.berserk.recovering_desc=İçsel gücün de sınırları vardır. Berserker, öfkesini tekrar kullanmadan önce dinlenmelidir. İyileşme sürecinde Berserker, aldığı hasardan dolayı öfke biriktirmez.
actors.buffs.berserk.recovering_desc_levels=İyileşene kadarki seviyeler: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Kurtarılana kadar geçen süre: _%d_
actors.buffs.bleeding.desc=Bu yaradan endişe verici miktarda kan sızıyor. \n\nKanama her turda hasara neden olur. Her turda hasar rastgele bir miktarda azalır, ta ki kanama sonunda durana kadar. \n\nMevcut kanama hasarı: %d.
actors.buffs.bleeding.heromsg=Kanıyorsunuz!
actors.buffs.bleeding.name=kanama
actors.buffs.bleeding.ondeath=Kan kaybından öldün...
actors.buffs.bleeding.rankings_desc=Kan kaybından öldü
actors.buffs.bless.desc=Büyük bir odaklanma patlaması, bazıları bunun tanrılardan ilham aldığını söylüyor. \n\nKutsama, isabet ve kaçınmayı %25 artırır, kutsanmış kişiyi savaşta çok daha etkili hale getirir. \n\nKalan kutsama süresi: %s.
actors.buffs.bless.name=kutsanmış
actors.buffs.blindness.desc=Körlük, çevredeki dünyayı karanlık bir sis haline getirir. Körlük halindeyken, karakterin görüş alanı bir kareye düşer, bu da menzilli saldırıları işe yaramaz hale getirir ve uzaktaki düşmanları takip etmeyi çok kolaylaştırır. Ayrıca, kör bir kahraman parşömen veya kitap okuyamaz. Kalan körlük süresi:
actors.buffs.blindness.heromsg=Gözleriniz kör olmuş!
actors.buffs.blindness.name=kör
actors.buffs.blobimmunity.desc=Garip bir güç sizi ince bir koruyucu bariyerle sarıyor ve havadan bulaşan tüm zararlı etkileri engelliyor. Bu bariyer var olduğu sürece, alanla ilgili tüm etkilere karşı bağışıklısınız. Kalan bağışıklık süresi:
actors.buffs.blobimmunity.name=arıtma bariyeri
actors.buffs.burning.burnsup=%s yanıyor!
actors.buffs.burning.desc=Alevler içinde kalmaktan daha üzücü çok az şey vardır. \n\nAlevler, suyla söndürülene veya sona erene kadar her turda hasar verir. Alevler, suya basılarak veya yıkıcı bir iksirin sıçramasıyla söndürülebilir. \n\nAyrıca, alevler temas ettiği yanıcı arazileri veya eşyaları tutuşturabilir. \n\nKalan yanma süresi: %s.
actors.buffs.burning.heromsg=Alev alıyorsun!
actors.buffs.burning.name=yanma
actors.buffs.burning.ondeath=Yanarak öldün...
actors.buffs.burning.rankings_desc=Kül haline geldi
actors.buffs.championenemy$antimagic.desc=Büyü karşıtı şampiyonlar %50 daha az hasar alır ve büyülü etkilere karşı tamamen bağışıklıdır.
actors.buffs.championenemy$antimagic.name=anti-büyü şampiyonu
actors.buffs.championenemy$blazing.desc=Alevli şampiyonlar %25 daha fazla yakın dövüş hasarı verir, saldırdıkları düşmanları tutuşturur, ateşe karşı bağışıklıdır ve öldüklerinde etraflarına ateş yayarlar. Ancak suya ateş yayamazlar.
actors.buffs.championenemy$blazing.name=alevli şampiyon
actors.buffs.championenemy$blessed.desc=Kutsanmış şampiyonların isabet ve kaçınma yetenekleri 4 kat daha yüksektir.
actors.buffs.championenemy$blessed.name=kutsanmış şampiyon
actors.buffs.championenemy$giant.desc=Dev şampiyonlar %80 daha az hasar alır ve +1 saldırı menziline sahiptir, ancak kapalı alanlardan geçemezler.
actors.buffs.championenemy$giant.name=dev şampiyon
actors.buffs.championenemy$growing.desc=Gelişen şampiyonlar, isabet, kaçınma, fiziksel hasar ve alınan hasarda azalma konusunda sürekli artan bir bonus kazanırlar.\n\nMevcut isabet/kaçınma/hasar artışı: %1$d%%\nMevcut hasar azaltma: %2$d%%
actors.buffs.championenemy$growing.name=büyüyen şampiyon
actors.buffs.championenemy$projecting.desc=Projeksiyon yeteneğine sahip şampiyonlar %25 daha fazla yakın dövüş hasarı verir ve +3 saldırı menziline sahiptir.
actors.buffs.championenemy$projecting.name=şampiyonu tahmin etmek
actors.buffs.championenemy.warn=Ölümcül bir varlığın varlığını hissediyorsunuz.
actors.buffs.charm.cant_attack=Düşmanınız sizi büyüledi ve ona saldıramıyorsunuz.
actors.buffs.charm.desc=Büyü, düşmanların geçici olarak birbirlerine hayran kalmalarını sağlayabilen manipülatif bir büyüdür. Büyüden etkilenen karakterler, büyülendikleri düşmana doğrudan saldıramazlar. Ancak diğer hedeflere saldırmak hala mümkündür. Acı şoku, büyünün süresini kısaltacaktır. Kalan büyü süresi:
actors.buffs.charm.heromsg=Büyülendiniz!
actors.buffs.charm.name=Charmed
actors.buffs.chill.desc=Tam olarak donmuş değil, ama yine de çok soğuk.\n\nSoğutulmuş hedefler, etkinin süresine bağlı olarak tüm eylemleri daha yavaş gerçekleştirir. En kötü durumda, bu yavaşlamaya eşdeğerdir.\n\nKalan soğukluk süresi: %1$s.\nHız şu kadar azalır: %2$s%%
actors.buffs.chill.freezes=%s donuyor!
actors.buffs.chill.name=soğutulmuş
actors.buffs.combo$combomove.clobber.desc=Düşmanı 2 kare geriye iter, ancak hasar vermez ve çukurlara itilemez. Kombo sayısını 1 artırır.
actors.buffs.combo$combomove.clobber.empower_desc=Düşmanı 3 kare geriye iter, baş dönmesine neden olur ve çukurlara düşürebilir, ancak hasar vermez. Kombo sayısını 1 artırır.
actors.buffs.combo$combomove.clobber.name=darbe
actors.buffs.combo$combomove.crush.desc=Birincil hedefe %d%% (kombo*25%%) hasar verir ve 7x7'lik bir alandaki diğer tüm düşmanlara bunun yarısı kadar hasar verir. Kullanıldığında kombo sıfırlanır.
actors.buffs.combo$combomove.crush.empower_desc=_%1$d karesine sıçrar_ ve birincil hedefe %2$d%% (kombo*25%%) hasar verir ve 7x7'lik bir alandaki diğer tüm düşmanlara bu hasarın yarısını verir. Kullanıldığında kombo sıfırlanır.
actors.buffs.combo$combomove.crush.name=ezmek
actors.buffs.combo$combomove.fury.desc=Sahip olduğunuz her kombo için düşmana bir kez vurur, her vuruş %60 hasar verir ve büyüleri tetikleyebilir. Kullanıldığında kombo sıfırlanır.
actors.buffs.combo$combomove.fury.empower_desc=_%d kare yukarı sıçrar_ ve sahip olduğunuz her kombo için bir düşmana bir kez vurur, her vuruş 60%% hasar verir ve büyüleri tetikleyebilir. Kullanıldığında kombo sıfırlanır.
actors.buffs.combo$combomove.fury.name=öfke
actors.buffs.combo$combomove.parry.desc=Etkinleştirildiğinde, bir tur içinde bir sonraki saldırıyı engeller ve anında karşılık verir. Hiçbir şey savuşturulmazsa kombo sıfırlanır.
actors.buffs.combo$combomove.parry.empower_desc=Etkinleştirildiğinde 1 tur içinde _tüm saldırıları_ engeller ve anında karşılık verir. Hiçbir saldırı savuşturulmazsa kombo sıfırlanır.
actors.buffs.combo$combomove.parry.name=savuşturma
actors.buffs.combo$combomove.slam.desc=Hasar engelleme gücünüzün %d%% (kombo*20%%) kadarını bonus hasar olarak verir. Kullanıldığında kombo sıfırlanır.
actors.buffs.combo$combomove.slam.empower_desc=_%1$d kareye kadar sıçrar_ ve hasar engelleme gücünüzün %2$d%% (kombo*20%%) kadarını bonus hasar olarak verir. Kullanıldığında kombo sıfırlanır.
actors.buffs.combo$combomove.slam.name=çarpmak
actors.buffs.combo.action_name=kombo saldırı
actors.buffs.combo.bad_target=Saldırı menzili içindeki bir düşmanı hedeflemelisiniz.
actors.buffs.combo.combo=%d kombo vuruşu!
actors.buffs.combo.desc=Gladyatör, başarılı vuruşlar yaptıkça ivme kazanır. Her saldırı kombo sayacını bir artırır, ancak vuruşlar arasında çok uzun süre geçmesi kombo sayacını sıfırlar. Gladyatör kombo yaparken, kırık mühründen kaynaklanan kalkanı kaybolmaya başlamaz. Kombo oluşturmak, ıskalanamayan özel kombo saldırılarının kilidini açar! 2, 4, 6, 8 ve 10 kombo sayısında farklı bir saldırı kilidi açılır. Bazı hareketler komboyu sıfırlar, bazıları sıfırlamaz, ancak her hareket kombo seansı başına yalnızca bir kez kullanılabilir. Mevcut kombo: Kombo: Kombo kaybedilene kadar tur sayısı: Kombo ...
actors.buffs.combo.name=kombinasyon
actors.buffs.combo.prompt=Saldırılacak hedefi seçin.
actors.buffs.corrosion.desc=Güçlü asit, eti, metali ve kemiği endişe verici bir hızla eritir.\n\nKorozyon hasarı, hedef erimeye devam ettikçe zamanla artar.\n\nKalan korozyon dönüş sayısı: %1$s.\nMevcut korozyon hasarı: %2$d.
actors.buffs.corrosion.heromsg=Erimeye başlıyorsun!
actors.buffs.corrosion.name=korozyon
actors.buffs.corrosion.ondeath=Eriyip gidiyorsun...
actors.buffs.corrosion.rankings_desc=Çözülmüş
actors.buffs.corruption.desc=Yozlaşma, bir varlığın özüne sızarak onu eski doğasına aykırı hale getirir. Yozlaşmış yaratıklar müttefiklerine saldırır ve eski düşmanlarını görmezden gelir. Yozlaşma aynı zamanda zarar vericidir ve hedefinin yavaş yavaş teslim olmasına neden olur. Yozlaşma kalıcıdır, etkileri ancak ölümle sona erer.
actors.buffs.corruption.name=bozulmuş
actors.buffs.cripple.desc=Bacakların o şekilde bükülmemesi gerektiğinden oldukça eminsin.\n\nSakatlık hareket hızını yarıya indirir, bu da bir kareyi hareket ettirmenin genellikle bir yerine iki tur sürmesine neden olur.\n\nKalan sakatlık süresi: %s.
actors.buffs.cripple.heromsg=Sen sakatsın!
actors.buffs.cripple.name=sakat
actors.buffs.daze.desc=Kulak çınlaması ve bulanık görme, dövüşmeyi zorlaştırır. Sersemlemiş haldeyken isabet ve kaçınma oranı %50 azalır, bu da hem vuruş yapmayı hem de vuruşlardan kaçınmayı çok daha zorlaştırır. Kalan sersemleme süresi: 1 tur.
actors.buffs.daze.heromsg=Sersemlemiş durumdasın!
actors.buffs.daze.name=sersemlemiş
actors.buffs.degrade.desc=Güçlü kara büyü, yükseltme parşömenlerinin ekipmanınıza uyguladığı gücü tüketiyor! \n\nYıpranmış haldeyken, yükseltilmiş ekipman, gerçekte olduğundan daha düşük bir seviyedeymiş gibi işlem görecektir. _+3'ten sonraki her yükseltme, bir öncekinden katlanarak daha zayıf hale gelir._ Eşyalarınızın açıklamaları, azaltılmış güç seviyelerini yansıtacak şekilde değişecektir. \n\nYıpranma, güç gereksinimlerini, asa şarjlarını, fırlatılan silahların dayanıklılığını veya eserleri etkilemez. \n\nKalan yıpranma süresi: %s. Bir yükseltme veya laneti kaldırma parşömeni kullanmak, yıpranmayı hemen sona erdirecektir.
actors.buffs.degrade.heromsg=Ekipmanınız daha güçsüz hissediliyor!
actors.buffs.degrade.name=bozulmuş
actors.buffs.doom.desc=Evrenin seni öldürmek istediği zaman devam etmek zor.\n\nLanetli karakterler tüm kaynaklardan %67 daha fazla hasar alacak.\n\nLanet kalıcıdır, etkileri ancak ölümle sona erer.
actors.buffs.doom.name=mahkum
actors.buffs.dread.desc=Öyle büyük bir dehşet ki, hedeflediği yaratığın zindandan tamamen kaçmasına neden olacak! Korkudan etkilenen yaratıklar rakiplerinden yüksek hızda kaçacak ve görüş alanından çıktıklarında zindandan tamamen kaybolacaklar. Bu şekilde yenilen düşmanlar yarı deneyim puanı kazandırır ve eşya düşürmez. Acı şoku, korkunun süresini kısaltacaktır. Kalan korku süresi:
actors.buffs.dread.name=korku
actors.buffs.drowsy.desc=Büyülü bir güç uyanık kalmayı zorlaştırıyor; birkaç tur sonra hedef derin bir büyülü uykuya dalacak. Kahraman, hasar alarak veya tam sağlıkta olarak uyuşukluğa karşı koyabilir. Uykuya dalana kadar kalan tur sayısı: %s.
actors.buffs.drowsy.name=uykulu
actors.buffs.earthimbue.desc=Toprağın gücüyle donatılıyorsunuz! \n\nTüm fiziksel saldırılar düşmanın altındaki toprağı kaydırarak onları kısa süreliğine etkisiz hale getirecektir. \n\nToprağın dönüşleri kalanlara şu gücü verir: %s.
actors.buffs.earthimbue.name=toprakla dolu
actors.buffs.enhancedrings.desc=Haydutun yakın zamanda kullandığı eser, yüzüklerini güçlendirerek onlara +1 seviye kazandırıyor.\n\nKalan tur sayısı: %s.
actors.buffs.enhancedrings.name=geliştirilmiş halkalar
actors.buffs.fireimbue.desc=Ateşin gücüyle donatılıyorsunuz! \n\nTüm fiziksel saldırıların düşmanları alevlendirme şansı olacak. Ayrıca, ateşin etkilerine karşı tamamen bağışıklısınız. \n\nAteş turları kalanlara şu kadar güç katıyor: %s.
actors.buffs.fireimbue.name=ateşle dolu
actors.buffs.foresight.desc=Bir şekilde zihninizle çevredeki arazinin düzenini görebiliyorsunuz. Öngörü etkisi altındayken, geniş bir yarıçaptaki tüm karolar, gizli tuzaklar veya kapılar da dahil olmak üzere size görünür. Kalan öngörü süresi:
actors.buffs.foresight.name=öngörü
actors.buffs.frost.desc=Tamamen donmayla karıştırılmamalıdır; bu daha zararsız donma, hedefi buzla kaplar. Donma, felç gibi etki ederek hedefin hareket etmesini imkansız hale getirir. Felçten farklı olarak, hedef hasar alırsa buz parçalanacağı için donma hemen iptal edilir. Kalan donma süresi:
actors.buffs.frost.freezes=%s donuyor!
actors.buffs.frost.name=dondurulmuş
actors.buffs.frostimbue.desc=Buz gücüyle donatılıyorsunuz! \n\nTüm fiziksel saldırılar düşmanlara sürekli olarak soğuk etkisi uygulayacak. Ayrıca, soğuğa karşı tamamen bağışıklısınız. \n\nDonma turları kalanlara şu etkiyi uygular: %s.
actors.buffs.frostimbue.name=donla kaplı
actors.buffs.fury.desc=Kızgınsın, düşmanların kızgınken senden hoşlanmayacaklar. İçinizde büyük bir öfke yanıyor, bu da fiziksel saldırılarla verdiğiniz hasarı %50 artırıyor. Bu öfke, sağlığınız %50'nin altına düştüğü sürece devam edecek.
actors.buffs.fury.heromsg=Çok sinirleniyorsunuz!
actors.buffs.fury.name=çok öfkeli
actors.buffs.gravitychaostracker.desc_duration=Etkinin ne kadar süreceği belli değil, ancak sonsuza kadar süremez.
actors.buffs.gravitychaostracker.desc_intro=Her birkaç turda bir, zindanın mevcut katındaki tüm karakterler rastgele bir yöne fırlatılacak.
actors.buffs.gravitychaostracker.desc_positive=Siz ve müttefikleriniz ise bağışıklı görünüyorsunuz.
actors.buffs.gravitychaostracker.name=yerçekimi kaosu
actors.buffs.greaterhaste.desc=İnanılmaz bir hız artışı, bir an için her şeyin durduğu hissi veriyor. Daha hızlı hareket etme etkisindeyken, hareket eylemleri hiç zaman almıyor, ancak diğer eylemler normal hızda gerçekleştiriliyor. Her hareket adımı, daha hızlı hareket etme süresinden bir tur tüketiyor. Kalan daha hızlı hareket etme turu sayısı:
actors.buffs.greaterhaste.name=daha büyük acele
actors.buffs.haste.desc=Kaslarınızda enerji akışı olur ve inanılmaz hızlarda koşmanıza olanak tanır! Hızlanma etkisindeyken 3 kat hızda koşarsınız, ancak diğer tüm eylemleri normal hızda gerçekleştirirsiniz. Kalan hızlanma turu: %s.
actors.buffs.haste.name=acele
actors.buffs.healing.desc=Büyülü bir çare yaraların kapanmasına ve etin iyileşmesine neden oluyor. Her turda, iyileştirici etki sona erene kadar sağlık sürekli olarak yenilenecektir. İyileşme miktarı zamanla azalabilir. Sonraki iyileşme: %d. Kalan iyileşme: %d.
actors.buffs.healing.name=iyileştirme
actors.buffs.herodisguise.desc=Hayali sihir fiziksel görünümünüzü değiştirdi! Etki tamamen kozmetiktir, ancak yine de çok garip hissettiriyor. \n\nKalan kılık değiştirme süresi: %s.
actors.buffs.herodisguise.name=kılık değiştirmek
actors.buffs.hex.desc=Odaklanmayı azaltan ve hedefi hafifçe sersemleten karanlık büyü. \n\nBüyü, isabet ve kaçınmayı %20 azaltır, hedefi savaşta daha az etkili hale getirir. \n\nKalan büyü süresi: %s.
actors.buffs.hex.heromsg=Sana büyü yapıldı!
actors.buffs.hex.name=lanetli
actors.buffs.holdfast.desc=Savaşçı pozisyonunu koruyor, zırhını %1$d-%2$d kadar artırıyor ve bazı güçlendirmelerin azalma hızını %3$d%% kadar yavaşlatıyor. Bu durum, hareket edene kadar devam edecek.
actors.buffs.holdfast.name=Dayan
actors.buffs.hunger.cursedhorn=Lanetli boynuz, yemek yerken besin enerjisinin bir kısmını çalıyor.
actors.buffs.hunger.desc=Zindanda zaman geçirdikçe açlık yavaş yavaş artar ve sonunda açlıktan ölmeye başlarsınız. Açlıktan ölürken sağlığınız yenilenmek yerine yavaş yavaş azalır. Yiyecekleri idareli kullanmak önemlidir! Eğer yeterli sağlığınız varsa, daha sonra daha fazla yiyecek olacağı anlamına geliyorsa aç kalmak kötü bir fikir değildir. Etkili bir şekilde yiyecekleri idareli kullanmak, yiyeceklerin çok daha uzun süre dayanmasını sağlayabilir!
actors.buffs.hunger.desc_intro_hungry=Karnınızın yemek istediğini hissedebilirsiniz, ancak henüz çok acil bir durum değil.
actors.buffs.hunger.desc_intro_starving=O kadar açsın ki, karın ağrıyor.
actors.buffs.hunger.hungry=aç
actors.buffs.hunger.ondeath=Açlıktan öldün...
actors.buffs.hunger.onhungry=Acıktınız.
actors.buffs.hunger.onstarving=Açlıktan ölüyorsun!
actors.buffs.hunger.rankings_desc=Açlıktan öldü
actors.buffs.hunger.starving=açlıktan ölme
actors.buffs.invisibility.desc=Çevredeki araziyle tamamen bütünleşiyorsunuz, bu da sizi görünmez kılıyor. Görünmez olduğunuz sürece düşmanlar size saldıramaz veya sizi takip edemez. Fiziksel saldırılar ve büyülü etkiler (parşömenler ve asalar gibi) görünmezliği anında iptal eder. Kalan görünmezlik süresi:
actors.buffs.invisibility.name=görünmez
actors.buffs.invulnerability.desc=Bu karakter, ona kısa bir süre için yenilmezlik sağlayan büyük bir koruyucu güce sahiptir!\n\nKalan tur sayısı: %s.
actors.buffs.invulnerability.name=yenilmez
actors.buffs.levitation.desc=Büyülü bir güç sizi yerden kaldırıyor ve ağırlıksız hissetmenizi sağlıyor. Havada süzülen karakterler sessizce hareket eder ve yere bağlı tüm etkileri görmezden gelir. Tuzaklar tetiklenmez, su ateşi söndürmez, bitkiler ezilmez, kökler ıskalar ve çukurların üzerinden geçilir. Dikkatli olun, çünkü tüm bunlar havada süzülme sona erdiği anda devreye girebilir! Kalan havada süzülme süresi:
actors.buffs.levitation.name=havada süzülme
actors.buffs.lifelink.desc=Bu karakterin yaşam gücü yakındaki başka bir karaktere bağlıdır. Alınan hasar aralarında paylaşılır. \n\nBu karakter hasar aldığında, hasarın yarısı yaşam bağlantısı hedefine verilir. \n\nKalan yaşam bağlantısı süresi: %s.
actors.buffs.lifelink.name=yaşam bağlantısı
actors.buffs.lifelink.ondeath=Hayati tehlike arz eden hasar seni öldürdü...
actors.buffs.light.desc=En karanlık zindanda bile, yanınızda sabit bir ışık her zaman rahatlatıcıdır. Işık, karanlığı uzak tutmaya yardımcı olur ve ortama rağmen makul bir mesafeyi görmenizi sağlar. Kalan aydınlatma süresi:
actors.buffs.light.name=aydınlatılmış
actors.buffs.lockedfloor.desc=Mevcut kat kilitli ve buradan ayrılamazsınız! \n\nBir kat kilitliyken açlık hissetmezsiniz veya açlıktan hasar almazsınız. Ayrıca, bu katın patronunu yenmek için çalışmazsanız, pasif yenilenme etkileri de durur. \n\nEk olarak, kat kilitliyken kutsanmamış bir ankh tarafından diriltilirseniz, kat sıfırlanır. \n\nKilidi kırmak için bu katın patronunu öldürün.
actors.buffs.lockedfloor.name=Kat kilitli.
actors.buffs.lostinventory.desc=Envanteriniz zindanın bir yerinde kayboldu! Eşyalarınızı geri alana kadar çoğu eşyayı alamayacak veya kullanamayacaksınız.
actors.buffs.lostinventory.name=kayıp envanter
actors.buffs.magicalsight.desc=Bir şekilde gözlerinizle değil, zihninizle görebiliyorsunuz.\n\nBüyülü görüş aktifken, 12 kare yarıçapındaki tüm araziyi görebileceksiniz.\n\nKalan büyülü görüş süresi: %s.
actors.buffs.magicalsight.name=büyülü manzara
actors.buffs.magicalsleep.desc=Bu karakter, doğal yollarla uyanamayacağı derin bir büyülü uykuya dalmıştır. Büyülü uyku, normal uykuya benzer, ancak hedef yalnızca hasar aldığında uyanır. Kahraman ve müttefikleri için büyülü uykunun bazı iyileştirici özellikleri vardır ve dinlenirken hızla iyileşmelerini sağlar.
actors.buffs.magicalsleep.fallasleep=Büyülü, derin bir uykuya dalıyorsunuz.
actors.buffs.magicalsleep.name=büyülü uyku
actors.buffs.magicalsleep.toohealthy=Çok sağlıklısınız ve uyku isteğine karşı koyuyorsunuz.
actors.buffs.magicalsleep.wakeup=Uyandığınızda kendinizi dinlenmiş ve sağlıklı hissediyorsunuz.
actors.buffs.magicimmune.desc=Büyüsel etkilerin tamamı üzerinizdeki etkisini kaybetti, onlara karşı tamamen bağışıklısınız. Büyü bağışıklığı süresince, lanetler, büyüler, asalar, parşömenler, yüzükler, eserler vb. dahil olmak üzere tüm zararlı ve faydalı büyüsel etkiler size uygulanmayacaktır. Kahraman zırhı yetenekleri, bu etkiden bağımsız olarak çalışacak kadar güçlüdür. Büyü bağışıklığının kalan süresi: %s.
actors.buffs.magicimmune.name=büyüye karşı bağışıklık
actors.buffs.mindvision.desc=Bir şekilde bu kattaki tüm yaratıkları zihniniz aracılığıyla görebiliyorsunuz. Garip bir his.\n\n ...
actors.buffs.mindvision.name=zihin görüşü
actors.buffs.momentum.action_name=serbest koşu
actors.buffs.momentum.momentum=ivme kazanmak
actors.buffs.momentum.momentum_desc=Hareket ettikçe, Serbest Koşucu ivme kazanır ve bu ivmeyi serbest koşuya başlamak için kullanabilir. Her ivme yükü iki tur serbest koşu sağlar ve Serbest Koşucu en fazla 10 yük biriktirebilir. Serbest Koşucu hareket etmeyi bıraktığında ivme hızla kaybolur. Mevcut ivme yükü: %d.
actors.buffs.momentum.resting=iyileşiyor
actors.buffs.momentum.resting_desc=Serbest koşucu hareket ettikçe ivme kazanır ve bu ivmeyi serbest koşuya başlamak için kullanabilir. Serbest koşucunun tekrar ivme kazanmadan önce dayanıklılığını geri kazanması için zamana ihtiyacı vardır. Kalan tur sayısı:
actors.buffs.momentum.running=serbest koşu
actors.buffs.momentum.running_desc=Hareket ettikçe, Serbest Koşucu ivme kazanır ve bu ivmeyi serbest koşuya başlamak için kullanabilir. Serbest koşu sırasında, Serbest Koşucu iki kat hızda hareket eder ve seviyesine bağlı olarak bonus kaçınma kazanır. Kalan tur sayısı:
actors.buffs.monkenergy$monkability$dash.desc=4 kare uzağa kadar anında atılma yeteneği. Bu yetenek engellerin üzerinden geçebilir, ancak düşmanların veya sert arazinin içinden geçemez.
actors.buffs.monkenergy$monkability$dash.empower_desc=_8 kare_ uzaklığa kadar anında atılma yeteneği. Bu yetenek engellerin üzerinden geçebilir, ancak düşmanların veya sert arazinin içinden geçemez.
actors.buffs.monkenergy$monkability$dash.name=çizgi
actors.buffs.monkenergy$monkability$dash.prompt=Bir konum seçin
actors.buffs.monkenergy$monkability$dragonkick.desc=Zırhı görmezden gelen ve %1$d-%2$d hasar veren yıkıcı bir tekme. Tekme hedefi uzağa savurur ve kat ettiği her kare için felç eder.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Zırhı görmezden gelen ve _%1$d-%2$d hasar_ veren yıkıcı bir tekme. Tekme, _tüm bitişik hedefleri_ uzağa savurur ve gittikleri her kare için onları felç eder.
actors.buffs.monkenergy$monkability$dragonkick.name=ejderha tekmesi
actors.buffs.monkenergy$monkability$flurry.desc=Zırhı görmezden gelen ve %1$d-%2$d hasar veren iki anlık saldırı. Bu yetenek tekrar tekrar kullanılamaz.
actors.buffs.monkenergy$monkability$flurry.empower_desc=%1$d-%2$d hasar veren, zırhı görmezden gelen ve silahınızın büyüsünü kullanan iki anlık vuruş. Bu yetenek tekrar tekrar kullanılamaz.
actors.buffs.monkenergy$monkability$flurry.name=bir dizi darbe
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Keşiş, çevresine odaklanmış bir şekilde, kendisine yapılacak bir sonraki saldırıyı bekliyor. Odaklandığı sürece, gelecek bir sonraki saldırıyı savuşturması garanti altındadır.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=odaklı
actors.buffs.monkenergy$monkability$focus.desc=Keşiş dikkatini toplamak için bir an bekler ve kendisine yöneltilen bir sonraki saldırıyı savuşturmasına izin verir.
actors.buffs.monkenergy$monkability$focus.empower_desc=Keşiş anında odaklanarak kendisine yöneltilen bir sonraki saldırıyı savuşturur.
actors.buffs.monkenergy$monkability$focus.name=odak
actors.buffs.monkenergy$monkability$meditate.desc=Keşiş, 5 tur boyunca enerjiyi vücuduna yoğunlaştırır. Bu, olumsuz etkilerin çoğunu ortadan kaldırır ve ona 8 tur boyunca asa ve eserlerini yeniden şarj etme olanağı sağlar.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Keşiş, 5 tur boyunca enerjisini vücuduna yoğunlaştırır. Bu, olumsuz etkilerin çoğunu ortadan kaldırır ve ona 8 tur boyunca asa ve eşya şarjı sağlar. _Ayrıca meditasyon yaparken %80 hasar direnci kazanır ve eksik canının %20'si kadar yavaşça iyileşir._
actors.buffs.monkenergy$monkability$meditate.name=meditasyon yap
actors.buffs.monkenergy.action=Keşiş Yetenekleri
actors.buffs.monkenergy.desc=Keşiş düşmanları yendikçe, çeşitli yeteneklerinde kullanabileceği enerji kazanır. Çoğu düşman yenildiğinde 1 enerji verir ve Keşiş zamanla enerji kaybetmez. Mevcut enerji: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Keşiş yakın zamanda bir yetenek kullandı ve başka bir yetenek kullanmadan önce beklemesi gerekiyor. Mevcut bekleme süresi: %d tur.
actors.buffs.monkenergy.name=enerji
actors.buffs.ooze.desc=Bu yapışkan asit ete yapışarak onu yavaşça eritir. \n\nBu sıvı zamanla sürekli hasara yol açar, ancak suyla hemen yıkanabilir. \n\nKalan sıvı miktarı: %s.
actors.buffs.ooze.heromsg=Aşındırıcı sıvı etinizi yakar. Yıkayarak temizleyin!
actors.buffs.ooze.name=yakıcı çamur
actors.buffs.ooze.ondeath=Eriyip gidiyorsun...
actors.buffs.ooze.rankings_desc=Çözülmüş
actors.buffs.paralysis.desc=Çoğu zaman yapılacak en kötü şey hiçbir şey yapmamaktır.\n\nFelç, tüm eylemleri tamamen durdurur ve hedefi etki geçene kadar beklemeye zorlar. Hasar almaktan kaynaklanan acı, karakterlerin felce karşı direnç göstermesine ve etkiden kurtulmasına neden olabilir.\n\nKalan felç süresi: %s.
actors.buffs.paralysis.heromsg=Felç oldunuz!
actors.buffs.paralysis.name=felçli
actors.buffs.paralysis.out=felce karşı koydu
actors.buffs.physicalempower.desc=Vuruşlarınız güçlendirildi, bu da düşmanlara fiziksel saldırılarla vurduğunuzda verebileceğiniz hasar miktarını artırıyor.\n\nBonus hasar: %1$d.\nKalan vuruş sayısı: %2$d.
actors.buffs.physicalempower.name=fiziksel olarak güçlendirilmiş
actors.buffs.pincushion.desc=Bu karaktere karşı kullandığınız fırlatma silahları şu anda ona yapışmış durumda ve yenildikten sonra yere düşecekler. Şu anda aşağıdaki öğeler ona yapışmış durumda:
actors.buffs.pincushion.name=iğne yastığı
actors.buffs.poison.desc=Zehir vücutta yavaş yavaş ilerleyerek iç işleyişini bozar.\n\nZehir, etkisi geçene kadar geçen süreye orantılı olarak her turda hasar verir.\n\nKalan zehir süresi: %s.
actors.buffs.poison.heromsg=Zehirlendiniz!
actors.buffs.poison.name=zehirlenmiş
actors.buffs.poison.ondeath=Zehirlenme sonucu öldün...
actors.buffs.poison.rankings_desc=Zehirlenmeye yenik düştü
actors.buffs.preparation.action_name=hazırlıklı grev
actors.buffs.preparation.assassinated=suikaste uğradı
actors.buffs.preparation.desc=Suikastçı, gölgelerden saldırmak için sabırla bekliyor ve hazırlanıyor.
actors.buffs.preparation.desc_blink=Düşmana saldırmadan önce ona doğru göz kırpabiliyor, maksimum menzili _%d_.
actors.buffs.preparation.desc_dmg=Sonraki saldırısı _%1$d%% bonus hasar_ verecek ve _%2$d%% canının altında olan normal düşmanları veya _%3$d%% canının altında olan patronları_ öldürecektir.
actors.buffs.preparation.desc_dmg_likely=Saldırının daha büyük miktarda hasar verme olasılığı da daha yüksek olacaktır.
actors.buffs.preparation.desc_invis_next=Daha güçlü saldırı için dönüşler: _%d._
actors.buffs.preparation.desc_invis_time=Görünmez olarak geçirilen tur sayısı: _%d._
actors.buffs.preparation.name=hazırlık
actors.buffs.preparation.no_target=Orada saldırılacak bir şey yok.
actors.buffs.preparation.out_of_reach=Bu hedef ulaşılamaz durumda.
actors.buffs.preparation.prompt=Saldırmak istediğiniz hedefi seçin!\nMaksimum ışınlanma mesafesi: %d
actors.buffs.prismaticguard.desc=Şu anda pasif durumda olan prizmatik bir görüntü tarafından korunuyorsunuz. Düşmanlar ortaya çıktığında prizmatik görüntü harekete geçecek ve sizi koruyacak! \n\nPasif durumdayken, prizmatik görüntü aldığı hasarlardan istikrarlı bir şekilde iyileşecektir. \n\nMevcut HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Bu prizmatik görüntü de Çoklu Güç'ten faydalanıyor. Kalan Dönüş Sayısı: %d.
actors.buffs.prismaticguard.name=prizmatik Muhafız
actors.buffs.recharging.desc=Enerji vücudunuzda akıyor ve asalarınızın ve değneklerinizin şarj olma hızını artırıyor. \n\nBu güçlendirme her turda mevcut şarjı dörtte bir oranında artıracak, ayrıca normal şarjı da artıracak. \n\nKalan şarj turu sayısı: %s.
actors.buffs.recharging.name=şarj etme
actors.buffs.revealedarea.desc=Zindanın bir bölümü kahramana geçici olarak gösterildi. Kahraman nerede olursa olsun bu bölümü görecek.\n\nKalan tur sayısı: %s.
actors.buffs.revealedarea.name=ortaya çıkarılan alan
actors.buffs.revealedchar.desc=Bu karakter kahramana gösterilir, nerede olursa olsun görünür olacaktır. \n\nKalan tur sayısı: %s.
actors.buffs.revealedchar.name=açıklığa kavuşmuş
actors.buffs.roots.desc=Kökler (büyülü veya doğal) ayaklara yapışarak onları yere doğru bastırır.\n\nKökler hedefi yerinde kilitler, hareket etmeyi ve çoğu hareket yeteneğini imkansız hale getirir. Işınlanma efektleri de dahil olmak üzere diğer eylemler etkilenmez.\n\nKalan kök süresi: %s.
actors.buffs.roots.heromsg=Hareket edemezsin!
actors.buffs.roots.name=köklü
actors.buffs.scrollempower.desc=Büyücünün yeni okuduğu parşömeninden gelen enerji, asalarını güçlendiriyor! \n\nSeviye Artışı: +%1$d.\nKalan Zaps: %2$d.
actors.buffs.scrollempower.name=kaydırmayı güçlendirin
actors.buffs.shadows.desc=Çevrenizdeki gölgelerle bütünleşerek görünmezlik kazanır ve metabolizmanız yavaşlar. Görünmezken düşmanlar size saldıramaz veya sizi takip edemez. Çoğu fiziksel saldırı ve büyülü etki (parşömenler ve asalar gibi) görünmezliği anında iptal eder. Ayrıca, gölgelerle bütünleşmiş haldeyken açlık hızınız yavaşlar. Gölgelerden çıkana veya bir düşman sizinle temas kurana kadar gölgelerle bütünleşmiş halde kalırsınız.
actors.buffs.shadows.name=gölgeye karışmış
actors.buffs.slow.desc=Yavaşlatma büyüsü hedefin zaman hızını etkiler, onlar için her şey süper hızlı hareket eder. Yavaşlatılmış bir karakter, normalde alacağı sürenin iki katında tüm eylemleri gerçekleştirir. Kalan yavaşlatma süresi:
actors.buffs.slow.name=yavaşladı
actors.buffs.snipersmark.action_name_snapshot=anlık görüntü
actors.buffs.snipersmark.action_name_sniper=keskin nişancı atışı
actors.buffs.snipersmark.action_name_volley=voleybol
actors.buffs.snipersmark.desc=Keskin Nişancı, en son saldırdığı hedefe odaklanmıştır. Yayının nasıl güçlendirildiğine bağlı olarak değişen özel bir saldırı gerçekleştirebilir. \n\nGüçlendirilmemiş bir yay, azaltılmış hasar veren ancak ateşlenmesi zaman almayan bir _ani atış_ yapar. \n\nHız için güçlendirilmiş bir yay, üç oktan oluşan bir _saldırı_ yapar. Her ok azaltılmış hasar verir, ancak yine de büyüyü etkinleştirebilir. Bu salvo 1 tur sürer. \n\nHasar için güçlendirilmiş bir yay, bir _keskin nişancı atışı_ yapar. Bu atışın isabet etmesi garantidir, hedefe olan mesafeye bağlı olarak bonus hasar verir ve ateşlenmesi 2 tur sürer. \n\nKalan Tur Sayısı: %s.
actors.buffs.snipersmark.name=keskin nişancının işareti
actors.buffs.soulmark.desc=Büyücü, bu yaratığın ruhuna erişerek, fiziksel hasar alırken onu iyileştirebiliyor.\n\nKalan ruh işareti süresi: %s.
actors.buffs.soulmark.name=ruh işaretlendi
actors.buffs.stamina.desc=Sınırsız dayanıklılığınız sayesinde daha hızlı hareket edebilirsiniz! Dayanıklılık etkisindeyken +50 hızda koşacaksınız, ancak diğer tüm eylemleri normal hızda gerçekleştireceksiniz. Kalan dayanıklılık turu:
actors.buffs.stamina.name=dayanıklılık
actors.buffs.terror.desc=Terör, hedefini kontrol edilemez bir paniğe sürükleyen manipülatif bir büyüdür. Korkmuş karakterler, rakiplerinden kaçmak zorunda kalır ve aralarına mümkün olduğunca çok kapı ve duvar koymaya çalışırlar. Ancak acı şoku, terörün süresini kısaltacaktır. Kalan terör süresi:
actors.buffs.terror.name=dehşete düşmüş
actors.buffs.toxicimbue.desc=Zehirli enerjiyle dolusunuz! \n\n Hareket ettikçe sürekli olarak sizden zehirli gaz yayılacak ve düşmanlarınıza zarar verecektir. Etki süresince ve sonrasında birkaç tur boyunca zehirli gaza ve zehre karşı bağışıklısınız. \n\n Kalan zehirli etki süresi: %s.
actors.buffs.toxicimbue.name=zehirlilikle dolu
actors.buffs.vertigo.desc=Tüm dünya dönerken düz bir çizgide yürümek zor olabilir. Baş dönmesi etkisindeyken hareket etmeye çalışan karakterler, gitmeyi amaçladıkları yön yerine rastgele bir yöne giderler. Kalan baş dönmesi süresi:
actors.buffs.vertigo.name=baş dönmesi
actors.buffs.vulnerable.desc=Zayıflık büyüsü, zırh tarafından azaltıldıktan sonra bir karakterin aldığı tüm fiziksel hasarı 33%% artırır. Kalan zayıflık süresi: %s.
actors.buffs.vulnerable.heromsg=Kendinizi kırılgan hissediyorsunuz!
actors.buffs.vulnerable.name=hassas
actors.buffs.wandempower.desc=Hasar veren asalarınız güçlendirildi ve birkaç vuruş boyunca verdikleri hasar miktarı arttı.\n\nBonus hasar: %1$d.\nKalan vuruş sayısı: %2$d.
actors.buffs.wandempower.name=sihirli değneklerle güçlendirilmiş
actors.buffs.weakness.desc=Her şey birdenbire çok daha ağır görünüyor.\n\nZayıflatıcı büyü, bir karakterin fiziksel gücünü azaltarak, verdiği hasarı %33 azaltıyor.\n\nKalan zayıflık turu: %s.
actors.buffs.weakness.heromsg=Kendinizi güçsüz hissediyorsunuz!
actors.buffs.weakness.name=zayıflamış
actors.buffs.wellfed.desc=Oldukça memnun ve tok hissediyorsunuz. İyi beslendiğinizde açlığınız artmayacak ve zamanla ek olarak sağlık puanı kazanacaksınız. Kalan tur sayısı:
actors.buffs.wellfed.name=iyi beslenmiş
actors.char.def_verb=atlattı
actors.char.def_verb_blocked=engellendi
actors.char.defeat=%s'yu yendiniz.
actors.char.immune=bağışıklık
actors.char.invulnerable=yenilmez
actors.char.kill=%s seni öldürdü...
actors.hero.abilities.armorability.cost=Şarj ücreti: _%d_
actors.hero.abilities.armorability.no_target=Orada hedef alınacak bir şey yok!
actors.hero.abilities.armorability.prompt=Hedeflemek istediğiniz konumu seçin.
actors.hero.abilities.armorability.self_target=Kendinizi hedef alamazsınız!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Rahibin bedeninden parlak enerji yayılıyor. Bu formdayken Rahip, (kendinden yayılan kutsal enerjiden dolayı) 2 saldırı menzili kazanır ve her kutsal kitap yükü harcadığında 10 kalkan kazanır. Ayrıca, yükselmiş formun yetenekleriyle açılan büyüleri de kullanabilir. Yükselmiş formun ve büyülerinin sağladığı kalkan normalde azalmaz, ancak yükselmiş form sona erdiğinde anında kaybolur. Mevcut kalkan: Kalan tur sayısı:
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=yükselmiş form
actors.hero.abilities.cleric.ascendedform.desc=Rahip, kendinden kutsal enerji yayarak 10 tur boyunca uzatılmış bir ışık formuna bürünür. Bu formdayken Rahip yeni büyüler yapabilir, 2 saldırı menzili kazanır, 30 kalkan kazanır ve yaptığı her ek büyü, kullanılan her kutsal kitap yükü başına 10 kalkan sağlar. Yükselmiş formdan ve büyülerinden gelen kalkan normalde azalmaz, ancak yükselmiş form sona erdiğinde hemen kaybolur. Bu yetenek, yükselmiş formun süresini yenilemek için tekrar kullanılabilir.
actors.hero.abilities.cleric.ascendedform.name=yükselmiş form
actors.hero.abilities.cleric.ascendedform.short_desc=Rahip, yeni büyüler, saldırı menzili ve kalkan kazanarak _Yükselmiş Bir Form_ alır.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Rahibin macera arkadaşlarından birinin, katı ışıktan yapılmış bir kopyası. Başka bir kahramanın şekline sahip olsa da, onların benzersiz yeteneklerinden hiçbirine sahip değildir. Bu müttefik, Çoklu Güç zırh yeteneği ona uygulandığı sürece varlığını sürdürecektir. Bu müttefik, Çoklu Güç zırh yeteneğini yeniden kullanarak hiçbir maliyet olmadan yönlendirilebilir.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Müttefikiniz saldırıya geçiyor!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Müttefikiniz o pozisyona geçer.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Müttefikiniz sizi takip etmek için harekete geçiyor.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Bu karakteri belirli bir kahraman zırhı yeteneğiyle bulabilirsiniz.
actors.hero.abilities.cleric.powerofmany$lightally.name=hafif müttefik
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Bu müttefik, Çoklu Güç ile güçlendirildi ve bu da ona +25%% hasar verme ve -25%% hasar alma avantajı sağlıyor. Ayrıca görüş alanını Rahip ile paylaşacak ve Çoklu Güç büyülerinden faydalanabilecek. Çoklu Güç, prizmatik görüntüler gibi müttefikler saklandığında da devam edecek, ancak süresi yine de geri saymaya devam edecek. Kalan Tur Sayısı: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=çokluğun gücü
actors.hero.abilities.cleric.powerofmany.ally_exists=Zaten güçlü bir müttefikiniz var.
actors.hero.abilities.cleric.powerofmany.desc=Rahip, mevcut bir müttefiki güçlendiren veya 100 tur boyunca güçlendirilmiş yeni bir müttefik yaratan _Çokluğun Gücü_nü kullanır. Boş bir alanı hedeflemek yeni bir müttefik yaratır. Çokluğun Gücü ile güçlendirildiğinde, herhangi bir müttefik %25 daha fazla hasar verir, %25 daha az hasar alır ve görüş alanını Rahip ile paylaşır. Ayrıca yetenek kullanıldığında 25 kalkan kazanırlar. Rahip ayrıca, yalnızca güçlendirilmiş bir müttefikle birlikte kullanılabilen üç yeni büyü kazanır. Bu büyülerden biri aktifken Çokluğun Gücü sona ermez.
actors.hero.abilities.cleric.powerofmany.name=çokluğun gücü
actors.hero.abilities.cleric.powerofmany.no_vision=Göremediğiniz bir konumu hedefleyemezsiniz.
actors.hero.abilities.cleric.powerofmany.only_allies=Sadece müttefiklerinizi güçlendirebilirsiniz.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Işık müttefikinizi yönlendirin
actors.hero.abilities.cleric.powerofmany.prompt_default=Bir müttefik veya konum seçin
actors.hero.abilities.cleric.powerofmany.short_desc=Rahip, _Çokluğun Gücünü_ kanalize ederek mevcut bir müttefiki güçlendirir veya yeni bir müttefik yaratır.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Gövde formuna atayın
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Zihne atama formu
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Ruh formuna atayın
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Trinity'ye eklenecek bir efekt seçin. Onaylamadan önce ek bilgiler gösterilecektir.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Vücut Şekli: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Zihin Formu: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Ruh Formu: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Kullanılacak Trinity biçimini seçin. Farklı biçimlerin etkileri aynı anda aktif olabilir.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity, bu eserin uzaktan simya etkisini _%2$s şarj_ karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity, bu eserin pasif sağlık yenileme etkisini _+%1$d_ seviyesinde 20 tur boyunca, _%2$s şarj_ karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.cost=Bu yeteneğin kullanım maliyeti değişkenlik gösterir, ancak çoğunlukla _%d_'dir.
actors.hero.abilities.cleric.trinity.desc=Rahip, üç yeni büyü kullanarak çeşitli eşya efektlerine atanabilen bir zırh yeteneği üçlüsü kazanır. Bu büyülerden her biri, Rahibin bu oyun sırasında belirlediği farklı ekipman türlerinin etkilerini taklit etmeye odaklanır: beden formu (silahlar ve zırhlar), zihin formu (asalar ve fırlatılan silahlar) ve ruh formu (yüzükler ve eserler). Her Üçlü formuna aynı anda yalnızca bir efekt yüklenebilir ve Rahip, Üçlü'yü kullanırken hangisini etkinleştireceğini seçer. Üçlü, zaten donattığınız bir şeyin etkisini kopyalamaz.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity, bu eserin etkisini kullanarak, _%2$s yük_ karşılığında, _+%1$d_ hayaletin can puanına sahip, bozulmuş dost bir hayalet çağıracak.
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity bu etkiyi _%1$d tur_ boyunca _%2$s ücret karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity, bu eserin zincirleme büyü etkisini _%2$s_ bedel karşılığında _+%1$d_ menzilinde uygulayacaktır.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity, bu eserin "atıştırmalık" etkisini _%2$s şarjı_ karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity, bu eserin düşman yağmalama etkisini _+%1$d_'da, _%2$s yük_ karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.name=üçlü
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity, halihazırda donattığınız bir efekti kopyalayamaz!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity'nin şu anda hiçbir formu için belirlenmiş bir etkisi yok, lütfen büyülerinden birini kullanın!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity bu _güçlü_ etkiyi _%1$d tur_ boyunca _%2$s bedel karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.ring_use=Trinity, bu yüzüğün etkisini 20 tur boyunca +%1$d seviyesinde uygulayacak ve bunun maliyeti %2$s enerji olacak.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity, bu eserin kök etkisini rastgele zararlı bir tohum kullanarak, _%2$s_ bedel karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.short_desc=Rahip, gördüğü ekipmanları taklit eden ve yeni büyüler kullanılarak atanabilen bir _Üçlü_ yetenek kazanır.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity, bu eserin ekleme etkisini _%2$s_ bedeli karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity, bu eserin scry etkisini _+%1$d_ anında, _%2$s şarj maliyetiyle uygulayacaktır.
actors.hero.abilities.cleric.trinity.thrown_use=Trinity bu silahı _%2$s şarj karşılığında _+%1$d_'ya fırlatacak.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity, bu eserin zaman dondurma etkisini _%1$d_ tur süresince, _%2$s şarj_ karşılığında uygulayacaktır.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity, bu eserin rastgele kaydırma efektini _%1$d/10_ olasılıkla uygulayarak, _%2$s_ bedel karşılığında egzotik versiyonunu ek bir ücret ödemeden sunacaktır.
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity, bu çoklu şarjlı sihirli değneği +%1$d noktasında _%2$s şarj karşılığında şarj edecek.
actors.hero.abilities.cleric.trinity.wand_use=Trinity bu asayı _+%1$d_ konumunda _%2$s_ ücret karşılığında ışınlayacak.
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Bu karakter bir düelloya katılıyor. Kendisi ve müttefikleri veya hizmetkarları normal şekilde hareket edebilirken diğerleri donmuş halde kalır. Düello, katılımcılardan biri ölene kadar veya katılımcılar birbirlerinden 5 kareden fazla uzaklaşana kadar belirli bir süre devam edecektir. Kalan tur sayısı:
actors.hero.abilities.duelist.challenge$duelparticipant.name=düello katılımcısı
actors.hero.abilities.duelist.challenge.ally_target=Sadece düşmanlara meydan okuyabilirsiniz.
actors.hero.abilities.duelist.challenge.already_dueling=Aynı anda yalnızca bir düelloya katılabilirsiniz.
actors.hero.abilities.duelist.challenge.desc=Düellocu, yakındaki bir düşmanı düelloya davet eder. Bu düşman onunla savaşmak zorunda kalırken, diğer tüm düşmanlar geçici olarak zaman içinde dondurulur. Hedef, Düellocuya ulaşılabilir ve 5 kare mesafede olmalıdır. Düello, 10 tur geçene, düşman ölene veya Düellocu düşmandan 5 kareden daha uzaklaşana kadar sürer. Dondurulmuş düşmanlar dokunulmazdır. Düellocunun müttefikleri bu yetenekle dondurulmaz, ancak bir patron hedef alınırsa, onun yardımcıları da dondurulmaz.
actors.hero.abilities.duelist.challenge.distant_target=O düşman, meydan okuyamayacak kadar uzakta.
actors.hero.abilities.duelist.challenge.name=meydan okumak
actors.hero.abilities.duelist.challenge.prompt=Meydan okumak istediğiniz bir düşman seçin.
actors.hero.abilities.duelist.challenge.short_desc=Düellocu, yakındaki bir düşmanı düelloya davet eder ve diğer tüm düşmanları geçici olarak dondurur.
actors.hero.abilities.duelist.challenge.unreachable_target=Hedefinize ulaşabilmelisiniz.
actors.hero.abilities.duelist.elementalstrike.desc=Düellocu, düşmana veya bir yere saldırarak, isabeti garanti eden normal bir saldırı gerçekleştirir ve 65 derecelik bir koni içinde 4 kareye kadar yayılan büyülü bir etki oluşturur. Bu büyülü etki, Düellocunun birincil silahındaki büyüye bağlı olarak değişir.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Büyüsüz bir element saldırısı, menzil içindeki tüm düşmanlara 6-12 hasar veren küçük bir sihir patlaması yayar.
actors.hero.abilities.duelist.elementalstrike.name=element saldırısı
actors.hero.abilities.duelist.elementalstrike.short_desc=Düellocu, silahının büyüsüne bağlı olarak konik bir alanda etki yayan bir _Elementel Saldırı_ gerçekleştirir.
actors.hero.abilities.duelist.feint.bad_location=Oraya taşınamazsınız.
actors.hero.abilities.duelist.feint.desc=Düellocu, bitişik bir kareye doğru hızla ilerlerken sahte bir saldırı yapar ve arkasında anlık bir hayalet görüntüsü bırakır. Düellocuya saldıran düşmanlar, bunun yerine hayalet görüntüsüne saldırırlar. Hayalet görüntüsüne saldıran düşmanlar şaşkına döner, bu da bir sonraki eylemlerini iptal eder ve onları sürpriz bir saldırıya açık hale getirir.
actors.hero.abilities.duelist.feint.name=çalım
actors.hero.abilities.duelist.feint.prompt=Hızlıca gitmek istediğiniz konumu seçin.
actors.hero.abilities.duelist.feint.short_desc=Düellocu, saldırı taklidi yaparak bitişik bir kareye doğru hızla ilerler. Düşmanlar onun hayalet görüntüsüne saldıracak ve bu da onları karşı saldırıya açık hale getirecektir.
actors.hero.abilities.duelist.feint.too_far=O konum size bitişik değil.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Avcı kadın kısa süreliğine güçlendirilir, bu da hareket hızını ve yayıyla saldırı hızını artırır.\n\nKalan tur sayısı: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=doğanın gücü
actors.hero.abilities.huntress.naturespower.desc=Avcı, kendisini ve yayını geçici olarak doğanın gücüyle güçlendirir! Bu etki 8 tur sürer. Bu süre boyunca Avcı, 2 kat daha hızlı hareket eder ve yayıyla %33 daha hızlı saldırır. Nişancı özel saldırılarını kullanıyorsa, yay bonusu etkileri tetiklenmez.
actors.hero.abilities.huntress.naturespower.name=doğanın gücü
actors.hero.abilities.huntress.naturespower.short_desc=Avcı kadın, _Doğanın Gücünü_ çağırarak hareket hızını ve yayının atış hızını kısa bir süreliğine artırır.
actors.hero.abilities.huntress.spectralblades.desc=Avcı kadın, düşmana hayalet bir kılıç fırlatır; bu kılıç, yakın dövüş silahının menzilli bir saldırısı gibi etki eder. Büyüler de dahil olmak üzere, yakın dövüş silahının tüm normal etkileri aktif hale gelir.
actors.hero.abilities.huntress.spectralblades.name=spektral bıçaklar
actors.hero.abilities.huntress.spectralblades.short_desc=Avcı kadın, hedef aldığı yere Hayalet Bıçaklar fırlatır ve bu bıçaklar, şu anda kullandığı yakın dövüş silahına bağlı olarak hasar verir.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Avcı Kadın tarafından çağrılan büyülü bir şahin. Parlak, esrarengiz bir mavi renkte parlıyor ve etrafı gözlemlerken başını sürekli hareket ettiriyor. Savaşçı olmasa da hızı ve görüş yeteneği onu keşif ve düşmanların dikkatini dağıtmak için mükemmel kılıyor.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Kalan garantili kaçış sayısı: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Kalan hamle sayısı: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Şahininiz saldırıya geçmek için harekete geçiyor!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Şahininiz o konuma hareket eder.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Şahininiz sizi takip etmek için hareket eder.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Bu karakteri belirli bir kahraman zırhı yeteneğiyle bulabilirsiniz.
actors.hero.abilities.huntress.spirithawk$hawkally.name=ruh şahini
actors.hero.abilities.huntress.spirithawk.desc=Avcı, ruhani bir şahin yoldaşı çağırır ve bu şahin, çağrıldığı sırada yeteneği tekrar kullanarak yönlendirilebilir. Şahin 100 tur boyunca kalır ve şahini yönlendirmek herhangi bir şarj gerektirmez. Şahinin canı ve saldırı gücü minimum düzeydedir, ancak hızlı, kaçınmacı ve isabetlidir. Görüş alanının tamamını her zaman Avcı ile paylaşır. Ateş ve zehirli gaz gibi tüm alan etkili etkilere karşı bağışıklıdır. Özel olarak yönlendirilmedikçe saldırmaz.
actors.hero.abilities.huntress.spirithawk.name=ruh şahini
actors.hero.abilities.huntress.spirithawk.no_space=Yakınınızda boş yer yok.
actors.hero.abilities.huntress.spirithawk.short_desc=Avcı kadın, yerleri keşfetmesine ve düşmanların dikkatini dağıtmasına yardımcı olabilecek bir Ruh Şahini yoldaşı çağırır.
actors.hero.abilities.mage.elementalblast.desc=Büyücü, 4 kare uzaklığa kadar dairesel bir alanı kapsayan ve 15-25 hasar veren bir sihir patlaması yayar. Element patlamasının özel etkisi, Büyücünün asasına yerleştirilmiş olan asaya göre değişir.
actors.hero.abilities.mage.elementalblast.generic_desc=Element patlamasının etkisi, asanın düşmana veya müttefike doğrultulduğunda verdiği etkiye benzer olacaktır.
actors.hero.abilities.mage.elementalblast.name=element patlaması
actors.hero.abilities.mage.elementalblast.no_staff=Bu yeteneği personeliniz olmadan kullanamazsınız.
actors.hero.abilities.mage.elementalblast.short_desc=Büyücü, asasından bir _Element Patlaması_ yayar ve bu patlama, asasındaki değneğe bağlı olarak değişen bir etkiyle etrafındaki geniş bir alanı kaplar.
actors.hero.abilities.mage.warpbeacon.depths=Derinlikler arasında ışınlanarak geçiş yapamazsınız!
actors.hero.abilities.mage.warpbeacon.desc=Büyücü bir işaret yerleştirir ve bu işarete istenildiği zaman ışınlanabilir. İşaret yerleştirmek 1 tur sürer, ancak ona ışınlanmak anında gerçekleşir. Büyücü varsayılan olarak katlar arasında ışınlanamaz veya kilitli odalar gibi erişilemeyen yerlere ulaşmak için işareti kullanamaz. Büyücü düşmanların içine ışınlanabilir ve bu da onları kenara itecektir.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Oraya işaret feneri yerleştiremezsiniz!
actors.hero.abilities.mage.warpbeacon.locked_floor=Kilitli bir kattan çıkamazsınız!
actors.hero.abilities.mage.warpbeacon.name=ışınlanma işaretçisi
actors.hero.abilities.mage.warpbeacon.short_desc=Büyücü, bulunduğu yere bir Işınlanma İşareti yerleştirir ve bu sayede anında o yere ışınlanabilir.
actors.hero.abilities.mage.warpbeacon.too_far=O konum çok uzak!
actors.hero.abilities.mage.warpbeacon.window_cancel=iptal etmek
actors.hero.abilities.mage.warpbeacon.window_clear=açık işaret
actors.hero.abilities.mage.warpbeacon.window_desc=Sinyal vericiniz şu anda %d katında bulunmaktadır.
actors.hero.abilities.mage.warpbeacon.window_tele=işaret noktasına ışınlan
actors.hero.abilities.mage.wildmagic.desc=Büyücü, asalarının gücünü serbest bırakarak, tek bir turda rastgele 4 defaya kadar ateş eder. Büyücünün asası bu etkiye dahil değildir. Her asanın seviyesi de 2 artırılır, en fazla +3'e kadar. Bu yetenek, her atış için asa şarjının yarısını kullanır ve hiçbir asa 2 defadan fazla ateşlenemez.
actors.hero.abilities.mage.wildmagic.name=vahşi sihir
actors.hero.abilities.mage.wildmagic.no_wands=Elektrik vermek için sihirli değneğiniz yok!
actors.hero.abilities.mage.wildmagic.short_desc=Büyücü, asalarında bulunan Vahşi Büyüyü serbest bırakır ve tek bir tur içinde seçtiği hedefe rastgele birden fazla kez ateş eder.
actors.hero.abilities.ratmogrify$transmograt.desc=Bu düşman bir fareye dönüştürüldü. Bana sorarsanız büyük bir gelişme! - Fare Kralı
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Öldüren: fareye dönüşmüş düşman
actors.hero.abilities.ratmogrify.cant_transform=Bunu fareye dönüştüremezsin!
actors.hero.abilities.ratmogrify.desc=Kahraman, bir düşmanı 6 tur boyunca fareye dönüştürür! Patronlar, müttefikler ve fareler fareye dönüştürülemez. Fareye dönüştürülen düşmanlar orijinal özelliklerini korur, ancak hiçbir yeteneğe sahip olmazlar.
actors.hero.abilities.ratmogrify.name=sıçanlaştırmak
actors.hero.abilities.ratmogrify.short_desc=Kahraman, bir düşmanı _Ratmogrify_ eder! Bu, düşmanı geçici olarak hiçbir yeteneği olmayan bir fareye dönüştürür.
actors.hero.abilities.ratmogrify.too_strong=O düşman, fareye dönüşemeyecek kadar güçlü!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Bu düşman işaretlendi, bu da ona 25%% ek hasar vermesine neden oldu, ancak işaret sona erene kadar da ölemez hale geldi.\n\nKalan tur sayısı: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=ölüme mahkum edildi
actors.hero.abilities.rogue.deathmark.ally_target=Sadece düşmanları işaretleyebilirsiniz.
actors.hero.abilities.rogue.deathmark.desc=Haydut, seçtiği düşmana bir işaret koyar ve bu işaret, düşmanın %25 daha fazla hasar almasına neden olur. İşaret anında uygulanır ve 5 tur boyunca devam eder. İşaretli düşmanlar bonus hasar alır ancak işaret sona erene kadar ölemezler. Eğer bir düşmanın canı işaret sona erdiğinde 0 ise, anında ölür.
actors.hero.abilities.rogue.deathmark.name=ölüm işareti
actors.hero.abilities.rogue.deathmark.short_desc=Haydut, seçtiği bir düşmana _Ölüm İşareti_ yerleştirir. İşaretli düşmanlar ek hasar alır, ancak işaret sona erene kadar ölemezler.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Gölge karanlığından yapılmış bir Haydut kopyası. Boş gözlerle ve üzerinden buhar gibi yükselen minik karanlık parçacıklarıyla dimdik duruyor. Klon, Haydut'un mükemmel bir kopyası değil, ancak yine de iyi bir savaşçı ve doğru yeteneklerle Haydut'un ekipmanından faydalanabilir.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Klonunuz saldırıya geçiyor!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Klonunuz o konuma hareket eder.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Klonunuz sizi takip etmek için hareket eder.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Bu karakteri belirli bir kahraman zırhı yeteneğiyle bulabilirsiniz.
actors.hero.abilities.rogue.shadowclone$shadowally.name=gölge haydut
actors.hero.abilities.rogue.shadowclone.desc=Haydut, kendisinin gölge bir kopyasını çağırır ve bu kopyayı savaşta kendisine yardımcı olması için yönlendirebilir. Gölge kopyasını yönlendirmek herhangi bir ücret gerektirmez. Kopyanın 80 canı vardır, zırhı yoktur ve 10-20 hasar verir. Bu özelliklerin tümü yeteneklerle geliştirilebilir, böylece kopya kahramanın sahip olduğu silah ve zırhlardan faydalanabilir.
actors.hero.abilities.rogue.shadowclone.name=gölge klon
actors.hero.abilities.rogue.shadowclone.short_desc=Haydut, savaşta kendisine yardımcı olması için yönlendirebileceği bir Gölge Klonu çağırır.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Nedense, düşmanlar bu tahta maketin gerçek Haydut olduğuna kolayca ikna oluyorlar!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Bu karakteri belirli bir kahraman zırhı yeteneğiyle bulabilirsiniz.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=ahşap yem
actors.hero.abilities.rogue.smokebomb.desc=Haydut bir sis bombası atar ve 6 kare uzağa ışınlanır. Tehlikelerin ve düşmanların içinden ışınlanabilir, ancak duvarlar gibi katı arazilerin içinden ışınlanamaz. Haydutun eski konumuna bitişik düşmanlar 5 tur boyunca kör olur.
actors.hero.abilities.rogue.smokebomb.fov=Yalnızca görüş alanınızdaki boş bir konuma atlayabilirsiniz.
actors.hero.abilities.rogue.smokebomb.name=sis bombası
actors.hero.abilities.rogue.smokebomb.prompt=Gitmek istediğiniz konumu seçin.
actors.hero.abilities.rogue.smokebomb.short_desc=Haydut, gözlerini kırpıştırarak uzaklaşırken bir _Duman Bombası_ atar. Eski konumunun yakınındaki düşmanları kör eder.
actors.hero.abilities.warrior.endure$enduretracker.desc=Savaşçı artık aldığı hasara bağlı olarak ek hasar veriyor.\n\nEk Hasar: %1$d\nKalan Vuruş Sayısı: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=dayanıklılık
actors.hero.abilities.warrior.endure.desc=Savaşçı 3 tur boyunca dayanır ve tüm kaynaklardan gelen hasarın yarısını alır. Bu azalma, zırh gibi hasar direnci etkilerinden önce uygulanır. Dayanıklılık süresi sona erdikten sonra, savaşçının 10 tur içindeki bir sonraki vuruşu bonus hasar kazanır. Bu bonus hasar, dayanıklılık süresi boyunca kendisine verilen tüm hasarın yarısına eşittir (hasar azaltma etkilerinden önce)! Savaşçının herhangi bir kombo yeteneği varsa, bu yeteneği kullanmak kalan süresini 3 tur artırır.
actors.hero.abilities.warrior.endure.name=dayanmak
actors.hero.abilities.warrior.endure.short_desc=Savaşçı, birkaç tur atlayarak ancak yüksek hasar direnci kazanarak _dayanır_. Ardından, dayanma gücüne bağlı olarak ek hasar verir.
actors.hero.abilities.warrior.heroicleap.desc=Savaşçı, hedeflediği yere doğru atlayarak yolundaki düşmanları veya engelleri aşar. Ancak duvarların veya diğer katı arazilerin üzerinden atlayamaz.
actors.hero.abilities.warrior.heroicleap.name=kahramanca atlayış
actors.hero.abilities.warrior.heroicleap.prompt=Sıçramak için yön seçin
actors.hero.abilities.warrior.heroicleap.short_desc=Savaşçı, düşmanların ve tehlikelerin üzerinden süzülerek hedeflediği yere doğru kahramanca bir atılım gerçekleştirir.
actors.hero.abilities.warrior.shockwave.desc=Savaşçı yere vurarak 60 derecelik bir koni içinde 5 kareye kadar yayılan bir şok dalgası oluşturur. Bu şok dalgasına yakalanan düşmanlar 5 tur boyunca sakat kalır. Ayrıca 5-10 hasar alırlar ve Savaşçının 10'un üzerindeki her güç puanı için ek olarak 1-2 hasar daha alırlar.
actors.hero.abilities.warrior.shockwave.name=şok dalgası
actors.hero.abilities.warrior.shockwave.short_desc=Savaşçı, yere vurarak konik bir alanda _Şok Dalgası_ yayar. Şok dalgasına yakalanan düşmanlar hasar görür ve sakat kalır.
actors.hero.hero.key_distracted=Kilidi tam olarak açamıyorsunuz, denemeye devam etmeniz gerekecek.
actors.hero.hero.leave=Henüz buradan ayrılamazsınız, zindanın geri kalanı sizi aşağıda bekliyor!
actors.hero.hero.level_cap=Daha güçlü olamazsınız, ancak yaşadığınız deneyimler size ani bir güç artışı sağlar!
actors.hero.hero.level_up=Seviye atla!
actors.hero.hero.locked_chest=Bu sandık kilitli ve sizde ona uygun anahtar yok.
actors.hero.hero.locked_door=Uygun bir anahtarınız yok.
actors.hero.hero.name=Sen
actors.hero.hero.new_level=Seviye atla! +İsabet, +Kaçınma, +5 Can!
actors.hero.hero.new_talent=+1 Yetenek Puanı!
actors.hero.hero.noticed_smth=Bir şey fark ettiniz.
actors.hero.hero.pain_resist=Ağrı, uykuya dalma isteğine karşı koymanıza yardımcı olur.
actors.hero.hero.revive=Ankh, yaşam veren enerjiyle adeta patlıyor!
actors.hero.hero.search=aramak
actors.hero.hero.search_distracted=Konsantre olmak zor, arama yapmak yorucu.
actors.hero.hero.unspent=Henüz kullanılmamış yetenek puanlarınız var!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Şunu taşıyamazsınız: %s.
actors.hero.hero.you_now_have=Şunu aldınız: %s.
actors.hero.heroclass.cleric=din adamı
actors.hero.heroclass.cleric_desc=Rahip, çeşitli büyüler yapmak için kullanabileceği _benzersiz bir kutsal kitapla_ başlar. Rahibin yeteneklerinin çoğu, büyü öğrenmeye veya büyüleri geliştirmeye odaklanmıştır. Rahip ayrıca _bir sopa_, kumaş zırh, bir su tulumu ve kadife bir kese ile başlar. Rahip otomatik olarak şunları tanımlar: _Tanımlama Parşömenleri_, _Arındırma İksirleri_, _Laneti Kaldırma Parşömenleri_
actors.hero.heroclass.cleric_desc_short=Rahip, kendine özgü kutsal kitabını kullanarak ilahi büyüyü yönlendiren ilahi bir büyücüdür. Yetenekleri aracılığıyla büyüler öğrenebilir ve geliştirebilir.
actors.hero.heroclass.cleric_unlock=Rahip sınıfının kilidini açmak için, lanetli herhangi bir ekipman üzerindeki laneti tamamen temizleyin.
actors.hero.heroclass.duelist=düellocu
actors.hero.heroclass.duelist_desc=Düellocu, zamanla şarj olan özel bir yeteneğe sahip _benzersiz bir kılıçla_ başlar. Oyundaki her silahın, Düellocunun kullanabileceği _farklı bir özel yeteneği_ vardır. Düellocu ayrıca _iki fırlatma sivri ucu_, kumaş zırh, bir su tulumu ve kadife bir kese ile başlar. Düellocu otomatik olarak şunları tanımlar: _Tanımlama Parşömenleri_, Güç İksirleri_, Ayna Görüntüsü Parşömenleri_
actors.hero.heroclass.duelist_desc_short=Düellocu, silahını kullanarak _özel bir silah yeteneğini_ tetikleyebilen bir silah ustasıdır. Bu özel yetenek _her silah için farklıdır._
actors.hero.heroclass.duelist_unlock=Düellocu özelliğini açmak için, güç kaybı olmayan 2. seviye veya daha yüksek bir silah kuşanın.
actors.hero.heroclass.huntress=avcı
actors.hero.heroclass.huntress_desc=Avcı, sonsuz sayıda büyülü ok fırlatabilen _benzersiz bir ruh yayı_ ile başlar. Avcı, uzun otların arasından _ezmeden_ geçebilir. Avcı ayrıca _çivili eldivenler_, kumaş zırh, su tulumu ve kadife kese ile başlar. Avcı otomatik olarak şunları tanımlar: _Tanımlama Parşömenleri_, _Zihin Görüşü İksirleri_, _Ninni Parşömenleri_
actors.hero.heroclass.huntress_desc_short=Avcı Kadın fırlatma silahlarında ustadır ve sonsuz sayıda oka sahip sihirli bir yayı vardır. Ayrıca uzun otların arasından ezmeden geçebilir.
actors.hero.heroclass.huntress_unlock=Avcı karakterinin kilidini açmak için _bir oyunda düşmanlara fırlatılan silahlarla 10 kez vurun._
actors.hero.heroclass.mage=büyücü
actors.hero.heroclass.mage_desc=Büyücü, asadan çok daha hızlı şarj olan ve 1 şarj hakkı daha fazla olan _benzersiz bir asa_ ile başlar. Asa, Büyücünün zindanda bulduğu _herhangi bir asa ile güçlendirilebilir_. Büyücü ayrıca asasına işlenmiş _büyülü füze asası_, kumaş zırh, su tulumu ve kadife kese ile başlar. Büyücü otomatik olarak şunları tanımlar: \n_-_ Tanımlama Parşömenleri \n_-_ Sıvı Alev İksirleri \n_-_ Yükseltme Parşömenleri
actors.hero.heroclass.mage_desc_short=Büyücü, gizemli ilimler konusunda uzmandır ve asadan daha güçlü bir sihirli asa taşır. Asa, Büyücünün bulduğu herhangi bir asa ile donatılabilir.
actors.hero.heroclass.mage_unlock=Büyücü sınıfının kilidini açmak için, bir eşyayı daha güçlü hale getirmek üzere bir yükseltme parşömeni kullanın.
actors.hero.heroclass.rogue=haydut
actors.hero.heroclass.rogue_desc=Haydut, istediği zaman görünmez olmak için kullanabileceği benzersiz bir Gölge Pelerini ile başlar. Haydut, daha uzak mesafeden sırları ve tuzakları tespit edebilir. Haydut ayrıca bir hançer, üç fırlatma bıçağı, kumaş zırh, su tulumu ve kadife kese ile başlar. Haydut otomatik olarak şunları tanımlar: Tanımlama Parşömenleri, Görünmezlik İksirleri, Büyü Haritalama Parşömenleri.
actors.hero.heroclass.rogue_desc_short=Haydut, _gölge pelerini_ kullanarak düşmanlardan kaçabilir ve görünmezken saldırabilir. Ayrıca daha uzak mesafeden _sırları ve tuzakları_ tespit edebilir.
actors.hero.heroclass.rogue_unlock=Haydut karakterinin kilidini açmak için _bir oyunda 10 sürpriz saldırı gerçekleştirin._
actors.hero.heroclass.warrior=savaşçı
actors.hero.heroclass.warrior_desc=Savaşçı, canı yarıdan azaldığında ona ani bir kalkan sağlayan _benzersiz kırık bir mühürle_ başlar. Mühür zırhlar arasında taşınabilir ve onunla _tek bir yükseltmeyi_ aktarabilir. Savaşçı ayrıca _yıpranmış bir kısa kılıç_, _üç fırlatma taşı_, kumaş zırh, bir su tulumu ve kadife bir kese ile başlar. Savaşçı otomatik olarak şunları tanımlar: _Tanımlama Parşömenleri_ _-_ Şifa İksirleri_ _-_ Öfke Parşömenleri_
actors.hero.heroclass.warrior_desc_short=Savaşçı, kırık mührünün sağladığı kalkan sayesinde ekstra hasara dayanır. Mühür, zırhlar arasında taşınabilir ve tek bir yükseltmeyi aktarır.
actors.hero.heroclass.warrior_unlock=Savaşçı otomatik olarak kilidi açılır.
actors.hero.herosubclass.assassin=suikastçı
actors.hero.herosubclass.assassin_desc=Suikastçı görünmez olduğunda bir sonraki saldırısını hazırlar. Hazırlık süresi ne kadar uzun olursa, bir sonraki saldırısı o kadar güçlü olur. Hazırlık süresi 9 tura kadar sürer. Hazırlıktan sonra, Suikastçı bir sonraki saldırısında bonus hasar verir, hedefine ışınlanabilir ve hatta yeterince zayıf düşmanları anında öldürebilir.
actors.hero.herosubclass.assassin_short_desc=Suikastçı görünmezken ölümcül bir saldırı hazırlayabilir. Ne kadar uzun süre beklerse, saldırı o kadar güçlü olur.
actors.hero.herosubclass.battlemage=savaş büyücüsü
actors.hero.herosubclass.battlemage_desc=Savaş Büyücüsü, asasıyla yakın dövüşte her vuruş yaptığında, asasının ek bir büyüye sahipmiş gibi bonus bir etki kazanır. Bu etkiler, asasının büyülendiği asaya bağlıdır; her asanın kendine özgü bir etkisi vardır. Asa etkilerine ek olarak, Savaş Büyücüsünün asası, vuruş yaptığında 0,5 şarj daha kazanır.
actors.hero.herosubclass.battlemage_short_desc=Savaş Büyücüsü, asasıyla yakın dövüşte savaşırken ek etkiler yaratır. Bu etkiler, asasının içine yerleştirilmiş olan sihirli değneğe bağlıdır.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=Berserker, zırhı tarafından engellenen hasar da dahil olmak üzere fiziksel hasar aldıkça öfke kazanır! Öfke zamanla yavaş yavaş azalır, ancak düşük can seviyesindeyken daha yavaş azalır. Öfke, Berserker'ın %50'ye kadar daha fazla hasar vermesine neden olabilir. Maksimum öfke seviyesindeyken çılgına dönebilir, bir kalkan patlaması kazanabilir ve kalkanı kaldığı sürece öfkesini koruyabilir. Kalkan, Berserker'ın zırh seviyesiyle orantılıdır ve düşük can seviyesindeyken büyük ölçüde artırılabilir. Berserker, çılgına döndükten sonra toparlanmak için zamana ihtiyaç duyar.
actors.hero.herosubclass.berserker_short_desc=Berserker, hasar aldıkça öfke biriktirir. Öfke, hasarını artırır ve %100'e ulaştığında bonus kalkan için etkinleştirilebilir.
actors.hero.herosubclass.champion=şampiyon
actors.hero.herosubclass.champion_desc=Şampiyon, birincil silahına ek olarak ikincil bir silah da kuşanabilen, yakın dövüş silahlarında usta bir karakterdir. Normal saldırılarında birincil silahını kullanır, ancak birincil silahını anında değiştirebilir ve her iki silahın yeteneğini de kullanabilir. Ayrıca 2 adet daha fazla maksimum silah yeteneği şarjı ve %50 daha hızlı silah yeteneği şarjı kazanır.
actors.hero.herosubclass.champion_short_desc=Şampiyon iki silah kullanabilir ve daha fazla silah şarjı kazanır. Normal saldırılarında birincil silahını kullanır, ancak silah değiştirebilir ve her iki silahın yeteneğini de kullanabilir.
actors.hero.herosubclass.freerunner=serbest koşucu
actors.hero.herosubclass.freerunner_desc=Serbest koşucu hareket ettikçe ivme biriktirir. 10 tur koştuktan sonra 10'a kadar ivme kazanabilir, ancak hareket etmeyi bırakırsa hızla kaybeder. Serbest koşucu, her bir ivme puanı için 2 tur boyunca serbest koşuya başlamak için ivmesini kullanabilir. Serbest koşudayken serbest koşucu 2 kat hızda hareket eder ve seviyesine orantılı olarak bonus kaçınma kazanır. Serbest koşu sona erdiğinde, tekrar ivme biriktirilebilmesi için bir bekleme süresi vardır.
actors.hero.herosubclass.freerunner_short_desc=Serbest koşucu, koşarken ivme kazanır ve bu ivmeyi serbest koşuya başlamak için kullanabilir. Bu ona kısa bir süreliğine bonus hız ve kaçınma yeteneği kazandırır.
actors.hero.herosubclass.gladiator=gladyatör
actors.hero.herosubclass.gladiator_desc=Gladyatör, yakın dövüş veya fırlatma silahıyla yaptığı her başarılı saldırıda bir kombo puanı kazanır. Gladyatör 5 tur içinde (öldürme işleminden sonra 15 tur) başarılı bir saldırı yapmazsa, kombo puanı sıfırlanır. Kombo puanı kazanırken Gladyatör, isabeti garanti eden çeşitli yetenekler kullanabilir: Kombo: Düşmanı geri iter, komboyu korur Kombo: Zırha bağlı olarak hasar verir Kombo: Savunma yapar, komboyu korur Kombo: Hedefe ve yakındaki düşmanlara hasar verir Kombo: Her kombo için bir kez saldırır
actors.hero.herosubclass.gladiator_short_desc=Gladyatör, başarılı saldırılar yaptığında kombo biriktirir. Biriktirdiği komboları kullanarak benzersiz yeteneklerini kullanabilir.
actors.hero.herosubclass.monk=keşiş
actors.hero.herosubclass.monk_desc=Keşiş, fiziksel teknik konusunda ustadır. Düşmanlarını yendikçe, çeşitli savunma ve yardımcı yeteneklerde kullanabileceği enerji kazanır. Bu enerji zamanla azalmaz, ancak Keşiş'in seviyesine bağlı olarak bir üst sınırı vardır. \n\n1 Enerji: Yumruklarla hızlıca vurun\n2 Enerji: Bir sonraki saldırıdan kaçınmak için odaklanın\n3 Enerji: Anında yakındaki bir yere atlayın\n4 Enerji: Bir düşmanı tekmeleyerek uzaklaştırın\n5 Enerji: Durumları temizlemek ve asa ve eser şarjını yenilemek için meditasyon yapın
actors.hero.herosubclass.monk_short_desc=Keşiş, savaşırken enerji biriktirir. Bu enerji, çeşitli benzersiz yetenekler için kullanılabilir.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_desc=Paladin, yakın dövüşü ve silah ve zırhlarla olan sinerjiyi vurgulayan çeşitli yeni ve geliştirilmiş büyüler kazanır. Paladinin _Kutsal Silah_ ve _Kutsal Kalkan_ büyüleri daha büyük bonuslar sağlar, artık mevcut büyüler ve glifleri geçersiz kılmaz ve diğer büyüler kullanılarak uzatılabilir. Paladin ayrıca, bonus hasar ve büyü gücüyle garantili bir yakın dövüş vuruşu yapmalarını sağlayan _Vurma_ büyüsünü de kazanır.
actors.hero.herosubclass.paladin_short_desc=Paladin, yeni kısa menzilli büyüler ve kutsal silah ile kalkanın güçlendirilmiş versiyonlarını kazanır.
actors.hero.herosubclass.priest=rahip
actors.hero.herosubclass.priest_desc=Rahip, menzilli savaşa ve büyülü eşyalarla sinerjiye odaklanan çeşitli yeni ve geliştirilmiş büyüler kazanır. Rahip, her 50 turda bir ücretsiz olarak _Yol Gösteren Işık_ büyüsünü kullanabilir, büyülerinin doğrudan hedeflediği düşmanları aydınlatır ve müttefikleri, asaları ve bazı eserlerle aydınlatma zayıflatmasını tüketerek seviyelerine + 5'e eşit bonus hasar verebilir. Rahip ayrıca, karanlığı dağıtan ve tüm görünür düşmanları etkileyen, aydınlatmayı tetikleyen ve uygulayan ve 2 kullanım bedeli karşılığında onları kısa süreliğine sersemleten _Işıltı_ büyüsünü de kazanır.
actors.hero.herosubclass.priest_short_desc=Rahip, yeni uzun menzilli büyüler ve geliştirilmiş bir yol gösterici ışık yeteneği kazanır.
actors.hero.herosubclass.sniper=keskin nişancı
actors.hero.herosubclass.sniper_desc=Keskin Nişancı, menzilli saldırıları düşman zırhını delebilen, menzilli savaşta usta bir karakterdir. Fırlatılan bir silahla düşmana saldırdığında, düşmanın üzerine bir keskin nişancı işareti koyar; bu da ona yayından özel bir saldırı yapma olanağı sağlar. Bu özel saldırı, yayının nasıl güçlendirildiğine bağlı olarak değişir. Güçlendirilmemiş bir yay, azaltılmış hasar veren ancak anında ateş eden bir anlık atış yapar. Hızlı bir yay, azaltılmış hasar veren, yine de büyüleri etkinleştirebilen ve ateş etmesi 1 tur süren üç oktan oluşan bir salvo ateşler. Hasar yayı, isabet etmesi garanti olan, mesafeye bağlı olarak bonus hasar veren ve ateş etmesi 2 tur süren bir keskin nişancı atışı yapar.
actors.hero.herosubclass.sniper_short_desc=Keskin Nişancı, menzilli saldırılarıyla zırhı delebilir. Fırlattığı silahla vurduktan sonra, yayından özel bir saldırı daha gerçekleştirebilir.
actors.hero.herosubclass.warden=gardiyan
actors.hero.herosubclass.warden_desc=Muhafız, doğayla güçlü bir bağa sahiptir ve bu bağ ona çimen ve bitkilerle ilgili çeşitli bonus etkiler kazandırır. Uzun ve kıvrımlı çimenlerin arasından sanki boşlukmuş gibi görebilir. Muhafız, attığı veya ektiği her tohumun etrafında çimenlerin filizlenmesine neden olur ve bitkileri ezdiğinde özel etkiler kazanır. Bu özel etkiler, normal bitki etkilerinin yerini alır; yani üzerine bastığı hiçbir bitki onun için zararlı değildir.
actors.hero.herosubclass.warden_short_desc=Muhafız, uzun otların arasından görebilir ve tohum ektiğinde ve bitkileri ezdiğinde ek etkiler kazanır.
actors.hero.herosubclass.warlock=falcı
actors.hero.herosubclass.warlock_desc=Büyücü, asa kullandığında karakterlere ruh işareti uygulama şansına sahiptir. Ruh işareti uygulama şansı ve süresi asa seviyesiyle artar. Bir düşmana ruh işareti uygulandığında, Büyücü ona verdiği her 5 hasar için 2 can puanı iyileştirir, ancak bu sadece yakın dövüş veya fırlatılan silahlarla yapılan saldırılar için geçerlidir, asa ile yapılan saldırılar için geçerli değildir!
actors.hero.herosubclass.warlock_short_desc=Büyücü, asalarıyla düşmanlarına ruh işareti koyma şansına sahiptir. İşaretlenmiş düşmanlara fiziksel hasar verdiğinde iyileşir.
actors.hero.spells.auraofprotection$aurabuff.desc=Paladin etrafına koruyucu enerji yayıyor. Yakındaki herhangi bir müttefik (Paladin'in kendisi de dahil) daha az hasar alır ve Paladin'in zırh glifinin etkisini artırılmış güçle kazanır. Kalan Tur Sayısı:
actors.hero.spells.auraofprotection$aurabuff.name=koruma aurası
actors.hero.spells.auraofprotection.desc=Paladin, 20 tur boyunca etrafında parıldayan bir aura içinde koruyucu enerji yaymaya başlar. Paladinin 2 kare yakınındaki herhangi bir müttefik (kendisi dahil) %1$d%% daha az hasar alır ve Paladinin zırh glifinin etkisini +%2$d%% güçle kazanır.\n\nBu hasar azaltma, diğer hasar azaltıcı etkilerden (örneğin zırh) önce gerçekleşir. Glif güç artışı her zaman uygulanır, ancak bir karakter zaten bundan faydalanıyorsa (örneğin Paladinin kendisi veya prizmatik bir görüntü), bu büyü Paladinin glifinin birden fazla kez uygulanmasına neden olamaz.
actors.hero.spells.auraofprotection.name=koruma aurası
actors.hero.spells.auraofprotection.short_desc=Paladin ve yakındaki müttefiklerinin savunmasını güçlendirir.
actors.hero.spells.beamingray$beamingrayboost.desc=Bu müttefik yakın zamanda Işınlama Işını ile ışınlandı ve ışınlanmanın ardından en yakın düşmana karşı bonus hasar verdi. Bu güçlendirme aktifken Çoklu Güç de sona ermez.\n\nKalan Tur Sayısı: %s.
actors.hero.spells.beamingray$beamingrayboost.name=ışın
actors.hero.spells.beamingray.desc=Rahip, müttefikinin gücünü bir ışın demetine dönüştürerek onu bir yere ışınlar. Işın bir düşmanla çarpışırsa, müttefiki yakındaki bir yere yerleştirir ve düşmana doğru yönlendirir. Işın, maksimum %1$d kare menzile sahiptir ve 4 kare içindeki en yakın düşmana karşı 10 tur boyunca Çoklu Güç'ün bonus hasarını +%2$d%% artırır. Işın demeti, normalde hareketsiz olan müttefikleri bile ışınlayabilir, ancak bu durumlarda menzili yarıya iner.
actors.hero.spells.beamingray.name=ışın
actors.hero.spells.beamingray.no_space=Müttefikinizin orada görünmesi için yer yok.
actors.hero.spells.beamingray.out_of_range=O konum menzil dışında.
actors.hero.spells.beamingray.short_desc=Müttefikinizi ışınlar ve ek hasar verir.
actors.hero.spells.blessspell.desc=Rahip, kendisine veya görebildiği başka bir karaktere kutsal bir kutsama uygular. \n\nKendisine uygulandığında etkisi daha zayıftır ve %1$d tur kutsama ve %2$d kalkan sağlar. \n\nDiğer karakterlere uygulandığında büyü daha güçlüdür ve %3$d tur kutsama ve %4$d iyileştirme sağlar. Fazla iyileştirme kalkana dönüştürülür.
actors.hero.spells.blessspell.name=kutsasın
actors.hero.spells.blessspell.short_desc=Din adamını kutsar ve korur, başkalarını kutsar ve iyileştirir.
actors.hero.spells.bodyform$bodyformbuff.desc=Trinity'nin beden formu şu anda size, mevcut silahınızda veya zırhınızda takılıymış gibi bir büyü veya sembolün gücünü veriyor.\n\nDikkat: Beden formu, zaten yararlandığınız bir etkinin başka bir kopyasını sağlayamaz.\n\nMevcut Etki: %1$s.\n\nKalan Tur Sayısı: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=vücut formu
actors.hero.spells.bodyform.desc=Rahip, bu turda belirlediği bir büyü veya sembolü seçer ve Trinity'ye etkisini yükler. \n\n Trinity kullanıldığında, Rahip seçilen büyü veya sembolün etkisini %d tur boyunca kazanır. Bu geçici büyü veya sembol, normal bir büyü veya sembolün sahip olduğu herhangi bir etkiyle çalışır. \n\n Bu büyü, Trinity'nin şu anda yüklü olduğu diğer tüm vücut etkilerinin yerini alır.
actors.hero.spells.bodyform.name=vücut formu
actors.hero.spells.bodyform.short_desc=Trinity'yi bir büyüye veya sembole atar.
actors.hero.spells.cleanse.desc=Rahip, kendisi ve görünürdeki müttefikleri üzerindeki tüm zararlı durum etkilerini ortadan kaldırır. Büyü sona erdikten sonra, etkilenen tüm karakterler ayrıca %1$d tur boyunca olumsuz etki bağışıklığı ve %2$d kalkan kazanır.
actors.hero.spells.cleanse.name=temizlemek
actors.hero.spells.cleanse.short_desc=Olumsuz etkileri ortadan kaldırır ve kalkan sağlar.
actors.hero.spells.clericspell.charge_cost=Şarj ücreti: %d
actors.hero.spells.clericspell.invalid_enemy=O düşmanı hedef alamazsın.
actors.hero.spells.clericspell.invalid_target=O konumu hedefleyemezsiniz.
actors.hero.spells.clericspell.no_target=Orada hedef yok.
actors.hero.spells.clericspell.prompt=Bir hedef seçin
actors.hero.spells.divineintervention.desc=Rahip, kitabından muazzam miktarda gücü kendisine ve müttefiklerine aktararak herkesi %1$d kalkanına yükseltir ve Yükselmiş Formu %2$d tur uzatır. Bu büyünün inanılmaz savunma gücü, çok yüksek kullanım maliyetiyle dengelenir. Tıpkı yükselmiş formun sağladığı diğer kalkanlar gibi, bu kalkan da normalde azalmaz, ancak yükselmiş form sona erdiğinde hemen sona erer.
actors.hero.spells.divineintervention.name=ilahi müdahale
actors.hero.spells.divineintervention.short_desc=Rahip ve müttefiklerine muazzam kalkan takviyesi.
actors.hero.spells.divinesense$divinesensetracker.desc=Bu karakter geçici olarak yakındaki diğer yaratıkları zihniyle görebiliyor!\n\nKalan tur sayısı: %s.
actors.hero.spells.divinesense$divinesensetracker.name=ilahi duygu
actors.hero.spells.divinesense.desc=Rahip, duyularını çevresine odaklayarak 50 tur boyunca %d karelik bir menzilde zihin görüşü kazanır. Bu büyünün uygulanması zaman almaz.
actors.hero.spells.divinesense.name=ilahi duygu
actors.hero.spells.divinesense.short_desc=Geniş bir alanda geçici zihinsel görüş yeteneği kazanın.
actors.hero.spells.flash.desc=Rahip, yükselmiş formunu yakındaki bir konumda yönlendirir ve oraya ışınlanır. Flash, Rahibi menzil içindeki ve boş olan herhangi bir keşfedilmiş konuma ışınlayabilir. Bu büyü, aynı yükselmiş formda her kullanıldığında daha fazla büyü kitabı yükü tüketir.
actors.hero.spells.flash.name=flaş
actors.hero.spells.flash.prompt=Bir konum seçin
actors.hero.spells.flash.short_desc=Yakındaki bir konuma ışınlan.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Rahip, 50 tur geçtikten sonra tekrar ücretsiz olarak Yol Gösteren Işık büyüsünü kullanabilecektir.\n\nKalan tur sayısı: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Yol Gösteren Işık
actors.hero.spells.guidinglight$illuminated.desc=Bu karakter, yol gösterici ışık tarafından vurulması sonucu parlıyor. Parıltı çevreyi aydınlatacak kadar güçlü olmasa da, bu büyülü etki, rahibin ona darbe indirmesini çok daha kolaylaştıracak.
actors.hero.spells.guidinglight$illuminated.desc_generic=Diğer kahramanlar da aydınlatıcı özelliği kullanarak yakıcı ışık yeteneğinden faydalanabilirler, ancak isabet oranlarında herhangi bir artış olmaz.
actors.hero.spells.guidinglight$illuminated.desc_priest=Rahip ayrıca, ışıkla aydınlatılmış, asa darbesi, bir müttefikin saldırısı veya bazı eserlerin etkilerini de kullanabilir. Bu şekilde aydınlatılmış kullanmak, Rahibin seviyesi + 5'e eşit miktarda ek büyü hasarı verir.
actors.hero.spells.guidinglight$illuminated.name=aydınlatılmış
actors.hero.spells.guidinglight.desc=Rahip, hedefe isabet eden ve 2-8 hasar veren, ayrıca hedefi aydınlatan büyülü bir enerji oku fırlatır. Aydınlatılmış bir düşmana karşı yapılan bir sonraki engelsiz fiziksel saldırının hedefe isabet etmesi garantilidir.
actors.hero.spells.guidinglight.desc_priest=_Bu büyü, Rahip tarafından kullanıldığında daha güçlüdür._ Büyünün her 50 turda bir ilk kullanımı büyü kitabı ücreti gerektirmez ve aydınlatma, ışık, asalar, diğer karakterler ve düşmanları doğrudan etkileyen eserler tarafından tüketilir. Aydınlatma bu şekilde kullanıldığında, Rahibin seviyesi + 5'e eşit ek büyü hasarı verir.
actors.hero.spells.guidinglight.name=Yol Gösteren Işık
actors.hero.spells.guidinglight.short_desc=Uzaktan büyü hasarı verir ve isabeti garanti eder.
actors.hero.spells.hallowedground$hallowedterrain.desc=Buradaki toprak kutsanmıştır. Kutsal toprak düşmanları yavaşlatır, müttefikleri iyileştirir ve otların yayılmasına neden olur.
actors.hero.spells.hallowedground.desc=Rahip, ilahi büyüsünü yakındaki toprağa odaklayarak 20 tur boyunca kutsal bir alan oluşturur. Bu büyü kullanıldığında, tüm müttefikleri 15 HP iyileştirir (sağlıklı müttefikler ve Rahip kalkan kazanır), düşmanları kısa süreliğine sabitler ve kısa otlar yayar. Kutsal alan, her turda müttefikleri 1 HP iyileştirir (sağlıklı müttefikler ve Rahip kalkan kazanır), düşmanları sakat bırakır ve rastgele uzun otların büyümesine neden olur. Kutsal alan ateşle yok edilir ve pasif yenilenme etkileri devre dışı bırakılırsa veya Rahip bir süredir deneyim puanı kazanmamışsa, oluklu otlar üretir.
actors.hero.spells.hallowedground.name=kutsal toprak
actors.hero.spells.hallowedground.prompt=Bir konum seçin
actors.hero.spells.hallowedground.short_desc=Müttefikleri iyileştirir, düşmanları yavaşlatır ve geniş bir alana çimen yayar.
actors.hero.spells.holyintuition.cursed=Bu eşyanın içinde kötü niyetli bir büyünün gizlendiğini hissediyorsunuz.
actors.hero.spells.holyintuition.desc=Rahip, duyularını bir eşyaya odaklayarak, onu kuşanmasına gerek kalmadan lanetli olup olmadığını belirler.
actors.hero.spells.holyintuition.name=kutsal sezgi
actors.hero.spells.holyintuition.prompt=bir öğe seçin
actors.hero.spells.holyintuition.short_desc=Bir eşyanın lanetli olup olmadığını belirler.
actors.hero.spells.holyintuition.uncursed=Bu ürün kötü niyetli büyüden arındırılmıştır.
actors.hero.spells.holylance$lancecooldown.desc=Rahip yakın zamanda Kutsal Mızrak büyüsünü kullandı ve tekrar kullanmadan önce beklemesi gerekiyor.\n\nKalan tur sayısı: %s.
actors.hero.spells.holylance$lancecooldown.name=kutsal mızrak bekleme süresi
actors.hero.spells.holylance.desc=Rahip, büyük miktarda enerjiyi ışıktan yapılmış yıkıcı bir fırlatma mızrağına yoğunlaştırır. Bu mızrak %1$d-%2$d hasar verir ve ölümsüz ve iblis hedeflere her zaman maksimum hasar verir.\n\nBu büyü çok pahalıdır ve 30 tur bekleme süresi vardır.
actors.hero.spells.holylance.name=kutsal mızrak
actors.hero.spells.holylance.short_desc=Yüksek menzilli büyü hasarı verir.
actors.hero.spells.holyward$holyarmbuff.desc=Rahip, giydiği zırhı kutsal enerjiyle doldurarak, mevcut tüm sembolleri geçici olarak geçersiz kıldı ve zırhın fazladan 1 puan hasar engellemesini sağladı.\n\nKalan Tur Sayısı: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladin, giydiği zırhı kutsal enerjiyle doldurarak zırhın fazladan 3 puan hasar engellemesini sağladı. Kutsal koruma aktifken başka büyüler yapmak, harcanan her şarj başına süresini 10 tur uzatacaktır. Kalan Tur Sayısı:
actors.hero.spells.holyward$holyarmbuff.name=kutsal koğuş
actors.hero.spells.holyward.desc=Rahip, giydiği zırha kutsal ışık sembolleri yerleştirerek zırhın hasar engelleme özelliğini 1 artırır. Bu büyü, hiçbir zaman almaz. Bu sembol 50 tur boyunca etkilidir ve zırhın sahip olduğu tüm faydalı sembolleri bu süre boyunca geçersiz kılar. Rahip, zırhı olmasa bile bu etkiden faydalanır.
actors.hero.spells.holyward.desc_paladin=_Bu büyü, Paladin tarafından kullanıldığında daha güçlüdür._ Ek hasar engelleme miktarı 3'e çıkarılır, büyü artık mevcut glifleri geçersiz kılmaz ve kutsal koruma aktifken başka büyüler kullanmak, kullanılan her şarj başına süresini 10 tur uzatır.
actors.hero.spells.holyward.glyph_desc=Bu sembol, zırhın engelleyebileceği hasar miktarını biraz artırır.
actors.hero.spells.holyward.glyph_name=%s ışığı
actors.hero.spells.holyward.name=kutsal koğuş
actors.hero.spells.holyward.short_desc=Zırh engelleme özelliğini artırmak için sembolleri geçici olarak geçersiz kılar.
actors.hero.spells.holyweapon$holywepbuff.desc=Rahip, taktığı silaha kutsal enerji aşıladı, mevcut tüm büyüleri geçici olarak geçersiz kıldı ve silahın her saldırıda fazladan 2 büyülü hasar vermesine neden oldu.\n\nKalan Tur Sayısı: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladin, giydiği silaha kutsal enerji aşıladı ve bu da saldırılarının ekstra 6 büyülü hasar vermesine neden oldu. Kutsal silah aktifken başka büyüler yapmak, harcanan her şarj başına süresini 10 tur uzatacaktır. Kalan Tur Sayısı:
actors.hero.spells.holyweapon$holywepbuff.name=kutsal silah
actors.hero.spells.holyweapon.desc=Rahip, taktığı silahı kutsal enerjiyle büyüleyerek, silahın düşmana her vuruşunda ek 2 büyülü hasar vermesini sağlar. Bu büyü, zaman almaz. Bu büyü 50 tur sürer ve silahın sahip olduğu tüm faydalı büyüleri bu süre boyunca geçersiz kılar. Silahsız vuruşlar da bu etkiden faydalanabilir.
actors.hero.spells.holyweapon.desc_paladin=_Bu büyü, Paladin tarafından kullanıldığında daha güçlüdür._ Ek büyülü hasar 6'ya çıkarılır, büyü artık mevcut büyüleri geçersiz kılmaz ve kutsal silah aktifken başka büyüler kullanmak, kullanılan her şarj başına süresini 10 tur uzatır.
actors.hero.spells.holyweapon.ench_desc=Kutsal bir silahla vurulan düşmanlar ekstra büyülü hasar alırlar.
actors.hero.spells.holyweapon.ench_name=kutsal %s
actors.hero.spells.holyweapon.name=kutsal silah
actors.hero.spells.holyweapon.short_desc=Hasarı artırmak için büyüleri geçici olarak geçersiz kılar.
actors.hero.spells.judgement.desc=Rahip yumruğunu yere vurarak, görebildiği tüm düşmanlara hasar veren bir ışık patlaması yaratır. Bu, temel olarak %1$d-%2$d hasar verir, ancak Rahip'in yükselmiş forma girdikten sonra (veya en son Yargı büyüsünü kullandığından beri) kullandığı her büyü için ek olarak 33%% hasar verir. Şu anda Yargı büyüsü %3$d-%4$d hasar verecektir.
actors.hero.spells.judgement.name=karar
actors.hero.spells.judgement.short_desc=Görünürdeki tüm düşmanlara hasar verir.
actors.hero.spells.layonhands.desc=Paladin, elleri aracılığıyla kutsal enerjiyi yönlendirir ve dokunduğu her şeyi iyileştirir veya korur. Paladin bu büyüyü yanındaki herhangi bir karaktere uygulayarak onlara iyileştirme sağlayabilir veya kendilerine uygulayarak kalkan kazandırabilir. Bu büyüden gelen fazla iyileştirme kalkana dönüştürülür. Bu büyü anında uygulanır ve tekrar tekrar uygulanabilir, ancak bir seferde üç uygulama değerinden fazla kalkan sağlayamaz.
actors.hero.spells.layonhands.name=elleri üzerine koy
actors.hero.spells.layonhands.short_desc=Yakındaki bir karakteri anında iyileştirir veya Paladini koruma kalkanıyla korur.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Rahip yakın zamanda bu müttefike Yaşam Bağlantısı büyüsünü uyguladı.\n\nYaşam Bağlantısı'nın normal faydalarına ek olarak, bu karakter daha az hasar alır, olumlu Rahip büyüleri sadece birine değil, hem Rahibe hem de bu müttefike uygulanır ve bu güçlendirme aktifken Çoklu Güç etkisi sona ermez.\n\nKalan Tur Sayısı: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=yaşam bağlantısı koruması
actors.hero.spells.lifelinkspell.desc=Rahip, kendisi ile güçlendirilmiş müttefiki arasındaki bağı güçlendirir. Bu güçlendirilmiş bağ sayesinde, alınan herhangi bir hasar %1$d tur boyunca hem kahraman hem de müttefiki arasında paylaşılır ve Çoklu Güç'ün savunma artışı -%2$d%% alınan hasara yükseltilir. Hasarın zırhtan sonra, ancak Çoklu Güç'ün hasar azaltımından önce paylaşıldığını unutmayın. Bu etki aktifken, T3 veya daha düşük seviyedeki faydalı Rahip büyüleri, yalnızca birine uygulanacak olsaydı, hem Rahip hem de müttefikine uygulanır.
actors.hero.spells.lifelinkspell.name=yaşam bağlantısı
actors.hero.spells.lifelinkspell.short_desc=Müttefikiyle hasarı paylaşır ve müttefikinin aldığı hasarı azaltır.
actors.hero.spells.mindform.desc=Rahip, bu turda belirlediği bir asa veya fırlatma silahı seçer ve Trinity'ye etkisini yükler. \n\n Trinity kullanıldığında, Rahip seçilen eşyayı +%d ile kullanıyormuş gibi tek bir saldırı yapabilir. Bu, o tür eşyayı kullanmanın normalde tetikleyeceği tüm etkileri tetikleyecektir. \n\n Bu büyü, Trinity'nin şu anda yüklü olduğu diğer tüm zihin etkilerinin yerini alır.
actors.hero.spells.mindform.name=zihin formu
actors.hero.spells.mindform.short_desc=Trinity'yi bir asa veya fırlatılan silaha atar.
actors.hero.spells.mnemonicprayer.desc=Rahip, belirli bir hedef üzerindeki tüm güçlendirme veya zayıflatma etkilerinin süresini %1$d tur uzatan bir dua okur. Bu büyüyü yapmak zaman almaz. Olumlu etkiler müttefikler (Rahip de dahil) üzerinde daha uzun süre devam ederken, zararlı etkiler düşmanlar üzerinde daha uzun süre devam eder. \n\nAkılda Kalıcı Dua, belirli bir güçlendirme veya zayıflatma etkisinin süresini yalnızca bir kez uzatabilir ve zırh yeteneklerinden kaynaklanan güçlendirmeleri uzatamaz.
actors.hero.spells.mnemonicprayer.name=ezberleme duası
actors.hero.spells.mnemonicprayer.short_desc=Bir müttefik/düşman üzerindeki güçlendirme/zayıflatma etkilerini uzatır ve aydınlatma etkisini yeniden uygular.
actors.hero.spells.radiance.desc=Rahip kutsal bir ışıkla parlayarak, görünen tüm düşmanları 3 tur boyunca sersemletir. Eğer bir düşman zaten aydınlatılmışsa, Işıltı, aydınlatmanın bonus hasarını tetikler ve ardından aydınlatılmış zayıflatma etkisini uygular. Işıltı ayrıca, mevcut kat karanlıksa Rahibin 100 tur boyunca parlamasına neden olur.
actors.hero.spells.radiance.name=parlaklık
actors.hero.spells.radiance.short_desc=Görünür düşmanları aydınlatır ve kısa süreliğine sersemletir.
actors.hero.spells.recallinscription$useditemtracker.desc=Rahip yakın zamanda, üzerine yazılmış geri çağırma büyüsüyle çalışan bir eşya kullandı. Rahip, eşyanın etkisini tekrarlamak için büyüyü kullanabilir.\n\nKullanılan Eşya: %1$s.\n\nKalan Tur Sayısı: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=yakın zamanda kullanılan rün
actors.hero.spells.recallinscription.desc=Rahip, son %s turda kullandığı bir rün taşı veya parşömen üzerinde bulunan büyülü bir rünün etkisini yeniden oluşturmak için kutsal büyü kullanır. Geri Çağırma Yazıtı, yükseltme parşömenlerini çoğaltmak için kullanılamaz. Bu büyünün kullanım maliyeti, yakın zamanda hangi eşyanın kullanıldığına bağlı olarak değişir: rün taşı için 2, parşömen için 3, egzotik parşömen için 4. Bu kullanım maliyeti, bir dönüşüm parşömenini veya dönüşüm veya yükseltme kullanılarak üretilmesi gereken simya eşyalarını çoğaltırken de iki katına çıkar.
actors.hero.spells.recallinscription.name=hatırlama yazısı
actors.hero.spells.recallinscription.short_desc=Yakın zamanda kullanılan bir rün taşı veya parşömeni tekrarlar.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Bu karakter ile düşman arasında ince bir ışık kalkanı duruyor. Saldırıları doğrudan engellemek için yeterince güçlü değil, ancak onları yumuşatacak.\n\nKalan Tur Sayısı: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=ışık kalkanı
actors.hero.spells.shieldoflight.desc=Rahip, kendisiyle düşman arasına ince bir ışık bariyeri oluşturur ve bu bariyer, düşmana karşı zırhının bloklama gücünü 5 tur boyunca %1$d-%2$d kadar artırır.\n\nBu büyü, zaman almaz ancak aynı anda birden fazla hedefe karşı kullanılamaz.
actors.hero.spells.shieldoflight.name=ışık kalkanı
actors.hero.spells.shieldoflight.short_desc=Hedefe karşı geçici zırh sağlar.
actors.hero.spells.smite.desc=Paladin, yakın dövüş saldırısına haklı bir yıkıcı güç katar. Normal yakın dövüş hasarına ek olarak, Smite, engellenmemiş saldırıların isabet etmesini garanti eder, +300 büyü gücüne sahiptir ve %1$d - %2$d arasında bonus büyü hasarı verir. Smite'ın bonus büyü hasarı, Paladin'in seviyesiyle orantılıdır ve ölümsüz veya iblis düşmanlara karşı her zaman maksimum bonus büyü hasarı verir.
actors.hero.spells.smite.name=vurmak
actors.hero.spells.smite.short_desc=Ekstra hasar ve büyü gücüyle isabet garantisi verir.
actors.hero.spells.spiritform$spiritformbuff.desc=Trinity'nin ruh formu şu anda size, sanki kuşanmışsınız gibi bir eşyanın gücünü veriyor. \n\nNot: Ruh formu, zaten yararlandığınız bir etkinin başka bir kopyasını sağlayamaz. \n\nMevcut Etki: %1$s.\n\nKalan Tur Sayısı: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=ruh formu
actors.hero.spells.spiritform.desc=Rahip, bu turda tespit ettiği bir yüzüğü veya eseri (kutsal kitap hariç) seçer ve Trinity'ye etkisini yükler. \n\nEğer bir yüzük seçilirse, Trinity o yüzüğün etkisini 20 tur boyunca +%1$d ile verir. \n\nEğer bir eser seçilirse, Trinity o eserin etkisini +%2$d ile kopyalar. Her eserin Trinity ile kullanıldığında farklı özel davranışları ve zırh yükü maliyetleri vardır. \n\nBu büyü, Trinity'nin şu anda yüklenmiş olduğu diğer tüm ruh etkilerinin yerini alır.
actors.hero.spells.spiritform.name=ruh formu
actors.hero.spells.spiritform.short_desc=Trinity'yi bir yüzüğe veya esere atar.
actors.hero.spells.stasis$stasisbuff.desc=Rahip şu anda hareketsiz halde bir müttefiki tutuyor. Bu müttefik üzerindeki tüm olumlu etkiler, Çoklu Güç de dahil olmak üzere korunur ve etki sona erdiğinde Rahibin yanında yeniden belirir. Etki, Hareketsizleştirme büyüsünü yeniden kullanarak da erken sonlandırılabilir. Hareketsiz haldeki müttefik: %1$s.\nKalan Tur Sayısı: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Hareket edemeyen müttefikiniz geride kaldı.
actors.hero.spells.stasis$stasisbuff.name=durgunlukta müttefik
actors.hero.spells.stasis.desc=Rahip, müttefikiyle olan bağlantısını kendine doğru odaklayarak, müttefikin geçici olarak rahibin içinde bir tür enerji durağanlığı içinde tutulmasına neden olur. Müttefik, %d tura kadar korunacak ve durağanlık süresi boyunca üzerindeki tüm olumlu etkiler etkilenmeyecektir. Durağanlık doğal olarak sona erdiğinde müttefik rahibin yanında belirecektir veya rahip, etkiyi erken sonlandırmak için hiçbir bedel ödemeden büyüyü anında yeniden uygulayabilir. Durağanlık, hareketsiz müttefikleri bile hareket ettirebilir, ancak onları katlar arasında transfer edemez.
actors.hero.spells.stasis.name=durgunluk
actors.hero.spells.stasis.short_desc=Müttefiki zindandan çıkarır ve korur.
actors.hero.spells.sunray.desc=Rahip, hedefe kör edici bir ışın fırlatır, %1$d-%2$d hasar verir ve hedefi %3$d tur boyunca kör eder. Güneş ışını her zaman ölümsüz ve iblis hedeflere maksimum hasar verir. Bu büyüyle vurulduktan sonra düşmanın görüşü düzelir ve tekrar kör olmasını engeller. Ancak, bu büyüyle kör haldeyken tekrar vurulurlarsa, ışık çok güçlü olur ve onları felç eder.
actors.hero.spells.sunray.name=güneş ışını
actors.hero.spells.sunray.short_desc=Uzaktan büyü hasarı verir ve hedefi bir kez kör eder.
actors.hero.spells.walloflight$lightwall.desc=Burada ışık huzmelerinden oluşan paneller geçişi engelliyor.
actors.hero.spells.walloflight.desc=Paladin, doğrudan önünde, 1 karo kalınlığında, %1$d karo genişliğinde ve 20 tur boyunca süren, katı ışık panellerinden oluşan bir duvar yaratır. Bu duvar, içinden görülebilmesi dışında normal bir duvar gibi davranır. Oluşturulduğunda duvara yakalanan düşmanlar anlık olarak sersemletilir ve mümkünse geri itilir. Duvara sıkışan her şey duvardan çıkabilir. Duvar, dört ana veya dört çapraz yönden herhangi birine atılabilir. Zaten aktif bir duvar varsa, büyü duvarı anında temizlemek için ücretsiz olarak yeniden kullanılabilir.
actors.hero.spells.walloflight.early_end=Işık duvarını dağıtıyorsun.
actors.hero.spells.walloflight.name=ışık duvarı
actors.hero.spells.walloflight.short_desc=Düşmanları engelleyen bir duvar oluşturur.
actors.hero.talent$aggressivebarriercooldown.desc=Bu yeteneği yakın zamanda kullandınız ve tekrar kullanmadan önce beklemeniz gerekiyor.\n\nKalan tur sayısı: %s.
actors.hero.talent$aggressivebarriercooldown.name=agresif bariyer soğuması
actors.hero.talent$combinedlethalityabilitytracker.executed=uygulanmış
actors.hero.talent$deadlyfollowuptracker.desc=Düellocu yakın zamanda fırlatılan bir silahla bir düşmana saldırdı, aynı hedefe karşı yaptığı yakın dövüş saldırılarının hasarı artırılacak.\n\nKalan tur sayısı: %s.
actors.hero.talent$deadlyfollowuptracker.name=ölümcül takip
actors.hero.talent$followupstriketracker.desc=Avcı kadın yakın zamanda fırlatılan bir silahla bir düşmana saldırdı, aynı hedefe karşı bir sonraki yakın dövüş saldırısının hasarı artırılacak.\n\nKalan tur sayısı: %s.
actors.hero.talent$followupstriketracker.name=takip grevi
actors.hero.talent$improvisedprojectilecooldown.desc=Bu yeteneği yakın zamanda kullandınız ve tekrar kullanmadan önce beklemeniz gerekiyor.\n\nKalan tur sayısı: %s.
actors.hero.talent$improvisedprojectilecooldown.name=doğaçlama mermilerin soğuma süresi
actors.hero.talent$lethalhastecooldown.desc=Bu yeteneği yakın zamanda kullandınız ve tekrar kullanmadan önce beklemeniz gerekiyor.\n\nKalan tur sayısı: %s.
actors.hero.talent$lethalhastecooldown.name=ölümcül hız bekleme süresi
actors.hero.talent$lingeringmagictracker.desc=Büyücü yakın zamanda asa veya değnek kullandı, bir sonraki fiziksel saldırısı bonus hasar verecek.\n\nKalan tur sayısı: %s.
actors.hero.talent$lingeringmagictracker.name=kalıcı sihir
actors.hero.talent$liquidagilacctracker.desc=Düellocunun bir sonraki normal yakın dövüş saldırısı bonus isabet oranı kazanacak.\n\nKalan tur sayısı: %s.
actors.hero.talent$liquidagilacctracker.name=sıvı çevikliği
actors.hero.talent$patientstriketracker.desc=Düellocu bir tur bekledi, bir sonraki yakın dövüş saldırısı ek hasar verecek.
actors.hero.talent$patientstriketracker.name=hasta grevi
actors.hero.talent$preciseassaulttracker.desc=Düellocunun bir sonraki normal yakın dövüş saldırısı bonus isabet oranı kazanacak.\n\nKalan tur sayısı: %s.
actors.hero.talent$preciseassaulttracker.name=kesin saldırı
actors.hero.talent$provokedangertracker.desc=Savaşçı kalkanını kaybetti, bir sonraki fiziksel saldırısı bonus hasar verecek.\n\nKalan tur sayısı: %s.
actors.hero.talent$provokedangertracker.name=öfkeye yol açtı
actors.hero.talent$rejuvenatingstepscooldown.desc=Bu yeteneği yakın zamanda kullandınız ve tekrar kullanmadan önce beklemeniz gerekiyor.\n\nKalan tur sayısı: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=canlandırıcı adımlar soğuma
actors.hero.talent$satiatedspellstracker.desc=Rahibin yapacağı bir sonraki büyü, onlara az miktarda kalkan sağlayacak.
actors.hero.talent$satiatedspellstracker.name=Kalkan Büyüsü
actors.hero.talent$searinglightcooldown.desc=Bu yeteneği yakın zamanda kullandınız ve tekrar kullanmadan önce beklemeniz gerekiyor.\n\nKalan tur sayısı: %s.
