actors.hero.talent$lethalhastecooldown.desc=Du hast dieses Talent kürzlich eingesetzt und musst warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$lethalhastecooldown.name=Tödliche Eile Abklingzeit
actors.hero.talent$lingeringmagictracker.desc=Der Magier hat kürzlich einen Stab oder Zauberstab benutzt, sein nächster physischer Angriff verursacht Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$lingeringmagictracker.name=anhaltender Zauber
actors.hero.talent$liquidagilacctracker.desc=Der nächste reguläre Nahkampfangriff des Duellanten erhält einen Genauigkeitsbonus.\n\nVerbleibende Züge: %s.
actors.hero.talent$liquidagilacctracker.name=Flüssigkeitsbeweglichkeit
actors.hero.talent$patientstriketracker.desc=Die Duellantin hat soeben eine Runde gewartet, ihr nächster Nahkampfangriff verursacht Bonusschaden.
actors.hero.talent$patientstriketracker.name=Patientenstreik
actors.hero.talent$preciseassaulttracker.desc=Der nächste reguläre Nahkampfangriff des Duellanten erhält einen Genauigkeitsbonus.\n\nVerbleibende Züge: %s.
actors.hero.talent$preciseassaulttracker.name=präziser Angriff
actors.hero.talent$provokedangertracker.desc=Der Krieger hat kürzlich seinen Schutzschild verloren, sein nächster physischer Angriff verursacht Bonusschaden.\n\nVerbleibende Züge: %s.
actors.hero.talent$provokedangertracker.name=provozierten Zorn
actors.hero.talent$rejuvenatingstepscooldown.desc=Du hast dieses Talent kürzlich eingesetzt und musst warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=Verjüngende Schritte Abkühlung
actors.hero.talent$satiatedspellstracker.desc=Der nächste Zauber, den der Kleriker wirkt, wird ihm einen kleinen Schutz gewähren.
actors.hero.talent$satiatedspellstracker.name=Schutzzauber
actors.hero.talent$searinglightcooldown.desc=Du hast dieses Talent kürzlich eingesetzt und musst warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$searinglightcooldown.name=gleißendes Licht
