actors.hero.talent$seershotcooldown.name=Abklingzeit des Seherschusses
actors.hero.talent$swiftequipcooldown.desc=Du hast dieses Talent kürzlich eingesetzt und musst warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$swiftequipcooldown.name=Schnelle Ausrüstung Abklingzeit
actors.hero.talent.adventurers_intuition.desc=+1: Die Duellantin erkennt Waffen 2,5x schneller und Rüstungen 1,75x schneller. +2: Die Duellantin erkennt Waffen beim Ausrüsten und Rüstungen 2,5x schneller.
actors.hero.talent.adventurers_intuition.title=Intuition des Abenteurers
actors.hero.talent.aggressive_barrier.desc=+1: Die Duellantin erhält 3 Schildpunkte, wenn sie eine Waffenfähigkeit einsetzt und ihre Gesundheit bei oder unter 50 % liegt. +2: Die Duellantin erhält 5 Schildpunkte, wenn sie eine Waffenfähigkeit einsetzt und ihre Gesundheit bei oder unter 50 % liegt.
actors.hero.talent.aggressive_barrier.meta_desc=Wird dieses Talent von einem anderen Helden erworben, gewährt es stattdessen einen Schild bei Nahkampfangriffen mit geringer Gesundheit, mit einer Abklingzeit von 50 Runden.
actors.hero.talent.aggressive_barrier.title=aggressive Barriere
actors.hero.talent.ally_warp.desc=+1: Der Magier kann einen Verbündeten auswählen, um mit ihm sofort den Platz zu tauschen (Reichweite: 2 Felder). +2: Der Magier kann einen Verbündeten auswählen, um mit ihm sofort den Platz zu tauschen (Reichweite: 4 Felder). +3: Der Magier kann einen Verbündeten auswählen, um mit ihm sofort den Platz zu tauschen (Reichweite: 6 Felder). Der Magier kann nicht mit unbeweglichen Verbündeten den Platz tauschen.
actors.hero.talent.ally_warp.title=Verbündeten-Warp
actors.hero.talent.arcane_vision.desc=+1: Wenn der Magier einen Gegner mit einem Blitzzauber belegt, erhält er für 10 Runden Gedankensicht auf diesen. +2: Wenn der Magier einen Gegner mit einem Blitzzauber belegt, erhält er für 15 Runden Gedankensicht auf diesen.
actors.hero.talent.arcane_vision.title=arkane Vision
actors.hero.talent.assassins_reach.desc=+1: Die Reichweite des Teleports des Assassinen wird pro Vorbereitungsstufe auf 1/3/4/6 Felder erhöht (vorher 1/2/3/4). +2: Die Reichweite des Teleports des Assassinen wird pro Vorbereitungsstufe auf 2/4/6/8 Felder erhöht (vorher 1/2/3/4). +3: Die Reichweite des Teleports des Assassinen wird pro Vorbereitungsstufe auf 2/5/7/10 Felder erhöht (vorher 1/2/3/4). Dieser Teleport kann Hindernisse und Gegner durchdringen, jedoch nicht festes Gelände wie Wände.
actors.hero.talent.assassins_reach.title=Reichweite des Attentäters
actors.hero.talent.aura_of_protection.desc=+1: Der Paladin kann „Aura des Schutzes“ wirken, einen Zauber, der dem Paladin und allen Verbündeten innerhalb von 2 Feldern 20 % Schadensresistenz und den Effekt der Rüstungsglyphe des Paladins mit +50 % Stärke für 20 Runden gewährt. Kosten: 2 Ladungen. +2: Der Paladin kann „Aura des Schutzes“ wirken, einen Zauber, der dem Paladin und allen Verbündeten innerhalb von 2 Feldern 30 % Schadensresistenz und den Effekt der Rüstungsglyphe des Paladins mit +75 % Stärke für 20 Runden gewährt. Kosten: 2 Ladungen. +3: Der Paladin kann „Aura des Schutzes“ wirken, einen Zauber, der dem Paladin und allen Verbündeten innerhalb von 2 Feldern 40 % Schadensresistenz und den Effekt der Rüstungsglyphe des Paladins mit +75 % Stärke für 20 Runden gewährt. +100 % Leistung für 20 Runden, auf Kosten von 2 Ladungen.
actors.hero.talent.aura_of_protection.title=Aura des Schutzes
actors.hero.talent.backup_barrier.desc=+1: Der Magier erhält 3 Schildpunkte, wenn er die letzte Ladung seines Stabs verbraucht. +2: Der Magier erhält 5 Schildpunkte, wenn er die letzte Ladung seines Stabs verbraucht.
actors.hero.talent.backup_barrier.meta_desc=Wird dieses Talent von einem anderen Helden erlangt, wird es stattdessen durch den Zauberstab mit der höchsten Stufe dieses Helden ausgelöst.
actors.hero.talent.backup_barrier.title=Backup-Barriere
actors.hero.talent.barkskin.desc=+1: Beim Betreten von Gras erhält die Wächterin 0–50 % ihres Levels an Rindenhautrüstung, die jede Runde verblasst. +2: Beim Betreten von Gras erhält die Wächterin 0–100 % ihres Levels an Rindenhautrüstung, die jede Runde verblasst. +3: Beim Betreten von Gras erhält die Wächterin 0–150 % ihres Levels an Rindenhautrüstung, die jede Runde verblasst.
actors.hero.talent.barkskin.title=Rindenhaut
actors.hero.talent.beaming_ray.desc=Der Kleriker kann von einem gestärkten Verbündeten aus den Zauber „Strahlender Strahl“ wirken, was eine Ladung kostet. Dieser Strahl durchdringt Wände und teleportiert den Verbündeten zu einem Zielort. Befindet sich dort ein Gegner, erscheint der Verbündete neben ihm und greift ihn an. Der Strahl kann sogar normalerweise unbewegliche Verbündete teleportieren, hat dabei aber die halbe Reichweite. \n\n_+1: Der Strahl hat eine maximale Reichweite von 4 Feldern und erhöht den Bonus von „Kraft der Vielen“ 10 Runden lang auf +35 % Schaden gegen den nächsten Gegner. \n\n_+2: Der Strahl hat eine maximale Reichweite von 8 Feldern und erhöht den Bonus von „Kraft der Vielen“ 10 Runden lang auf +40 % Schaden gegen den nächsten Gegner. \n\n_+3: Der Strahl hat eine maximale Reichweite von 12 Feldern und erhöht den Bonus von „Kraft der Vielen“ 10 Runden lang auf +45 % Schaden gegen den nächsten Gegner. \n\n_+4: Der Strahl hat eine maximale Reichweite von _16 Felder,_ und erhöht den Bonus von "Macht der Vielen" auf _+50% Schaden_ gegen den nächsten Feind für 10 Runden.
actors.hero.talent.beaming_ray.title=strahlender Strahl
actors.hero.talent.blast_radius.desc=+1: Der Radius der Elementarexplosion wird von 4 auf 5 Felder erhöht. +2: Der Radius der Elementarexplosion wird von 4 auf 6 Felder erhöht. +3: Der Radius der Elementarexplosion wird von 4 auf 7 Felder erhöht. +4: Der Radius der Elementarexplosion wird von 4 auf 8 Felder erhöht.
actors.hero.talent.blast_radius.title=Explosionsradius
actors.hero.talent.bless.desc=+1: Der Kleriker kann den Zauber „Segen“ wirken, der bei Anwendung auf sich selbst 6 Runden Segen und 10 Schutz gewährt oder bei Anwendung auf einen anderen Charakter 10 Runden Segen und 10 Heilung. Kosten: 1 Ladung. +2: Der Kleriker kann den Zauber „Segen“ wirken, der bei Anwendung auf sich selbst 10 Runden Segen und 15 Schutz gewährt oder bei Anwendung auf einen anderen Charakter 15 Runden Segen und 15 Heilung. Kosten: 1 Ladung. Überschüssige Heilung durch diesen Zauber wird in Schutz umgewandelt.
actors.hero.talent.bless.meta_desc=Wird dieses Talent von einem anderen Helden erworben, so erhöht es stattdessen die Treffsicherheit und Ausweichchance des Helden und aller Verbündeten um 3 % bei +1 bzw. 5 % bei +2.
actors.hero.talent.bless.title=segnen
actors.hero.talent.body_form.desc=Der Kleriker kann „Körpergestalt“ wirken, wodurch Trinity die Kraft einer Verzauberung oder Glyphe erhält, die der Kleriker in diesem Durchgang ausgewählt hat. Die Kosten hierfür betragen 2 Ladungen. +1: Bei Anwendung von „Körpergestalt“ erhält der Kleriker den gewählten Effekt für 20 Runden. +2: Bei Anwendung von „Körpergestalt“ erhält der Kleriker den gewählten Effekt für 27 Runden. +3: Bei Anwendung von „Körpergestalt“ erhält der Kleriker den gewählten Effekt für 33 Runden. +4: Bei Anwendung von „Körpergestalt“ erhält der Kleriker den gewählten Effekt für 40 Runden. „Körpergestalt“ kann immer nur mit einem Körpereffekt gleichzeitig erfüllt werden. Die Kosten für die Rüstungsladung von Trinity sind höher, wenn die gewählte Glyphe selten und mächtig ist.
actors.hero.talent.body_form.title=Körperform
actors.hero.talent.body_replacement.desc=+1: Nach dem Blinzeln hinterlässt der Schurke eine Holzattrappe mit 20 Lebenspunkten und 1-3 Rüstung. +2: Nach dem Blinzeln hinterlässt der Schurke eine Holzattrappe mit 40 Lebenspunkten und 2-6 Rüstung. +3: Nach dem Blinzeln hinterlässt der Schurke eine Holzattrappe mit 60 Lebenspunkten und 3-9 Rüstung. +4: Nach dem Blinzeln hinterlässt der Schurke eine Holzattrappe mit 80 Lebenspunkten und 4-12 Rüstung. Es kann immer nur eine Attrappe aktiv sein.
actors.hero.talent.body_replacement.title=Körperersatz
actors.hero.talent.body_slam.desc=+1: Wenn der Krieger nach einem Sprung landet, erleiden alle angrenzenden Gegner Schaden in Höhe von 1–4 plus 25 % seiner Schadensblockierkraft. +2: Wenn der Krieger nach einem Sprung landet, erleiden alle angrenzenden Gegner Schaden in Höhe von 2–8 plus 50 % seiner Schadensblockierkraft. +3: Wenn der Krieger nach einem Sprung landet, erleiden alle angrenzenden Gegner Schaden in Höhe von 3–12 plus 75 % seiner Schadensblockierkraft. +4: Wenn der Krieger nach einem Sprung landet, erleiden alle angrenzenden Gegner Schaden in Höhe von 4–16 plus 100 % seiner Schadensblockierkraft.
actors.hero.talent.body_slam.title=Körperschlag
actors.hero.talent.bounty_hunter.desc=+1: Wenn der Assassine einen Gegner mit einem vorbereiteten Schlag tötet, erhöht sich seine Chance auf Beute um 2/4/8/16 % pro Vorbereitungsstufe. +2: Wenn der Assassine einen Gegner mit einem vorbereiteten Schlag tötet, erhöht sich seine Chance auf Beute um 4/8/16/32 % pro Vorbereitungsstufe. +3: Wenn der Assassine einen Gegner mit einem vorbereiteten Schlag tötet, erhöht sich seine Chance auf Beute um 6/12/24/48 % pro Vorbereitungsstufe.
actors.hero.talent.bounty_hunter.title=Kopfgeldjäger
actors.hero.talent.cached_rations.desc=+1: Der Schurke findet beim Erkunden der nächsten Ebenen des Dungeons 2 Versorgungsrationen in Truhen. +2: Der Schurke findet beim Erkunden der nächsten Ebenen des Dungeons 3 Versorgungsrationen in Truhen. Versorgungsrationen werden schnell verzehrt, stellen eine moderate Sättigung wieder her, heilen 5 Trefferpunkte und laden den Schattenumhang um 1 Ladung auf.
actors.hero.talent.cached_rations.title=eingelagerte Rationen
actors.hero.talent.cleanse.desc=+1: Der Kleriker kann „Reinigung“ wirken, einen Zauber, der negative Statuseffekte vom Kleriker und allen Verbündeten in der Nähe entfernt und ihnen 10 Schildpunkte gewährt. Kosten: 2 Ladungen. +2: Der Kleriker kann „Reinigung“ wirken, einen Zauber, der dem Kleriker und allen Verbündeten in der Nähe 3 Runden lang Immunität gegen negative Statuseffekte gewährt und ihnen 20 Schildpunkte gewährt. Kosten: 2 Ladungen. +3: Der Kleriker kann „Reinigung“ wirken, einen Zauber, der dem Kleriker und allen Verbündeten in der Nähe 5 Runden lang Immunität gegen negative Statuseffekte gewährt und ihnen 30 Schildpunkte gewährt. Kosten: 2 Ladungen.
actors.hero.talent.cleanse.meta_desc=Wird dieses Talent von einem anderen Helden erworben, werden stattdessen negative Statuseffekte auf den Helden nach der Benutzung eines Zauberstabs oder Artefakts in 10/20/30% der Fälle mit einem Bonus von +1/+2/+3 entfernt.
actors.hero.talent.cleanse.title=reinigen
actors.hero.talent.cleave.desc=+1: Die zusätzliche Zeit, die der Gladiator nach einem Kill erhält, wird von 15 auf 30 Runden erhöht. +2: Die zusätzliche Zeit, die der Gladiator nach einem Kill erhält, wird von 15 auf 45 Runden erhöht. +3: Die zusätzliche Zeit, die der Gladiator nach einem Kill erhält, wird von 15 auf 60 Runden erhöht.
actors.hero.talent.cleave.title=spalten
actors.hero.talent.cloned_armor.desc=+1: Der Schattenklon erhält 12 % des Rüstungswerts des Helden und hat eine Chance von 25 %, die Glyphe auf der Rüstung des Helden zu verwenden. +2: Der Schattenklon erhält 24 % des Rüstungswerts des Helden und hat eine Chance von 50 %, die Glyphe auf der Rüstung des Helden zu verwenden. +3: Der Schattenklon erhält 36 % des Rüstungswerts des Helden und hat eine Chance von 75 %, die Glyphe auf der Rüstung des Helden zu verwenden. +4: Der Schattenklon erhält 48 % des Rüstungswerts des Helden und hat eine Chance von 100 %, die Glyphe auf der Rüstung des Helden zu verwenden.
actors.hero.talent.cloned_armor.title=geklonte Rüstung
actors.hero.talent.close_the_gap.desc=+1: Die Duellantin teleportiert sich beim Beginn eines Duells bis zu zwei Felder weit auf ihr Ziel zu. +2: Die Duellantin teleportiert sich beim Beginn eines Duells bis zu drei Felder weit auf ihr Ziel zu. +3: Die Duellantin teleportiert sich beim Beginn eines Duells bis zu vier Felder weit auf ihr Ziel zu. +4: Die Duellantin teleportiert sich beim Beginn eines Duells bis zu fünf Felder weit auf ihr Ziel zu. Dieser Teleport kann Hindernisse und Gegner durchdringen, jedoch nicht festes Gelände wie Wände. Der Teleport wird bei der Bestimmung der Reichweite eines Gegners berücksichtigt.
actors.hero.talent.close_the_gap.title=die Lücke schließen
actors.hero.talent.combined_energy.desc=+1: Nutzt der Mönch innerhalb von 5 Runden eine Waffenfähigkeit und eine Fähigkeit mit 4 oder mehr Energie, erhält er 1 verbrauchte Energie zurück. +2: Nutzt der Mönch innerhalb von 5 Runden eine Waffenfähigkeit und eine Fähigkeit mit 3 oder mehr Energie, erhält er 1 verbrauchte Energie zurück. +3: Nutzt der Mönch innerhalb von 5 Runden eine Waffenfähigkeit und eine Fähigkeit mit 2 oder mehr Energie, erhält er 1 verbrauchte Energie zurück.
actors.hero.talent.combined_energy.title=kombinierte Energie
actors.hero.talent.combined_lethality.desc=+1: Greift der Champion unmittelbar nach dem Einsatz einer anderen Waffenfähigkeit mit einer Nahkampfwaffe an, werden alle verbleibenden Gegner (außer Bosse) mit weniger als 13 % HP durch diesen Angriff getötet. +2: Greift der Champion unmittelbar nach dem Einsatz einer anderen Waffenfähigkeit mit einer Nahkampfwaffe an, werden alle verbleibenden Gegner (außer Bosse) mit weniger als 27 % HP durch diesen Angriff getötet. +3: Greift der Champion unmittelbar nach dem Einsatz einer anderen Waffenfähigkeit mit einer Nahkampfwaffe an, werden alle verbleibenden Gegner (außer Bosse) mit weniger als 40 % HP durch diesen Angriff getötet. Dieser Angriff kann ein normaler Nahkampfangriff oder Teil einer Waffenfähigkeit sein.
actors.hero.talent.combined_lethality.title=kombinierte Letalität
actors.hero.talent.conserved_magic.desc=+1: Jeder Blitz der Wilden Magie verbraucht nun 0,33 Ladungen statt 0,5, und die Wilde Magie hat eine Chance von 25 %, keinen Zug zu verbrauchen. +2: Jeder Blitz der Wilden Magie verbraucht nun 0,225 Ladungen statt 0,5, und die Wilde Magie hat eine Chance von 50 %, keinen Zug zu verbrauchen. +3: Jeder Blitz der Wilden Magie verbraucht nun 0,15 Ladungen statt 0,5, und die Wilde Magie hat eine Chance von 75 %, keinen Zug zu verbrauchen. +4: Jeder Blitz der Wilden Magie verbraucht nun 0,1 Ladungen statt 0,5, und die Wilde Magie hat eine Chance von 100 %, keinen Zug zu verbrauchen.
actors.hero.talent.conserved_magic.title=bewahrte Magie
actors.hero.talent.counter_ability.desc=+1: Nutzt die Duellantin innerhalb von 3 Runden nach dem Angriff auf ihr Nachbild eine Waffenfähigkeit, erhält sie sofort 0,38 Ladungen zurück. +2: Nutzt die Duellantin innerhalb von 3 Runden nach dem Angriff auf ihr Nachbild eine Waffenfähigkeit, erhält sie sofort 0,77 Ladungen zurück. +3: Nutzt die Duellantin innerhalb von 3 Runden nach dem Angriff auf ihr Nachbild eine Waffenfähigkeit, erhält sie sofort 1,13 Ladungen zurück. +4: Nutzt die Duellantin innerhalb von 3 Runden nach dem Angriff auf ihr Nachbild eine Waffenfähigkeit, erhält sie sofort 1,5 Ladungen zurück.
actors.hero.talent.counter_ability.title=Konterfähigkeit
actors.hero.talent.deadly_followup.desc=+1: Wenn die Duellantin einen Gegner mit einer Wurfwaffe trifft, verursacht sie 5 Runden lang 10 % mehr Nahkampfschaden. +2: Wenn die Duellantin einen Gegner mit einer Wurfwaffe trifft, verursacht sie 5 Runden lang 20 % mehr Nahkampfschaden. +3: Wenn die Duellantin einen Gegner mit einer Wurfwaffe trifft, verursacht sie 5 Runden lang 30 % mehr Nahkampfschaden.
actors.hero.talent.deadly_followup.title=tödliche Folge
actors.hero.talent.deathless_fury.desc=+1: Berserker wird automatisch ausgelöst, wenn der Berserker kurz vor dem Tod steht und seine Wut bei 100 % oder darüber liegt. Die Abklingzeit beträgt dann 3 Heldenstufen. +2: Berserker wird automatisch ausgelöst, wenn der Berserker kurz vor dem Tod steht und seine Wut bei 100 % oder darüber liegt. Die Abklingzeit beträgt dann 2 Heldenstufen. +3: Berserker wird automatisch ausgelöst, wenn der Berserker kurz vor dem Tod steht und seine Wut bei 100 % oder darüber liegt. Die Abklingzeit beträgt dann 1 Heldenstufe. Hinweis: Der Berserker stirbt weiterhin, wenn er beim Ende des Berserker-Zustands 0 HP hat.
actors.hero.talent.deathless_fury.title=unsterbliche Wut
actors.hero.talent.deathly_durability.desc=+1: Gegner, die durch das Todesmal getötet werden, gewähren dem Schurken einen Schild in Höhe von 13 % ihrer ursprünglichen Trefferpunkte. +2: Gegner, die durch das Todesmal getötet werden, gewähren dem Schurken einen Schild in Höhe von 25 % ihrer ursprünglichen Trefferpunkte. +3: Gegner, die durch das Todesmal getötet werden, gewähren dem Schurken einen Schild in Höhe von 38 % ihrer ursprünglichen Trefferpunkte. +4: Gegner, die durch das Todesmal getötet werden, gewähren dem Schurken einen Schild in Höhe von 50 % ihrer ursprünglichen Trefferpunkte.
actors.hero.talent.deathly_durability.title=tödliche Haltbarkeit
actors.hero.talent.desperate_power.desc=+1: Die Zauberstäbe und Stäbe des Magiers erhalten bei ihrem letzten Einsatz +1 Stufe, wenn sie nur noch eine Ladung haben. +2: Die Zauberstäbe und Stäbe des Magiers erhalten bei ihrem letzten Einsatz +2 Stufen, wenn sie nur noch eine Ladung haben. +3: Die Zauberstäbe und Stäbe des Magiers erhalten bei ihrem letzten Einsatz +3 Stufen, wenn sie nur noch eine Ladung haben.
actors.hero.talent.desperate_power.title=verzweifelte Macht
actors.hero.talent.directed_power.desc=+1: Der direkte Angriff von Elementarschlag erhält +30 % Verzauberungskraft für jeden Gegner im Wirkungsbereich von Elementarschlag, einschließlich des Angriffsziels. +2: Der direkte Angriff von Elementarschlag erhält +60 % Verzauberungskraft für jeden Gegner im Wirkungsbereich von Elementarschlag, einschließlich des Angriffsziels. +3: Der direkte Angriff von Elementarschlag erhält +90 % Verzauberungskraft für jeden Gegner im Wirkungsbereich von Elementarschlag, einschließlich des Angriffsziels. +4: Der direkte Angriff von Elementarschlag erhält +120 % Verzauberungskraft für jeden Gegner im Wirkungsbereich von Elementarschlag, einschließlich des Angriffsziels.
actors.hero.talent.directed_power.title=gerichtete Energie
actors.hero.talent.divine_intervention.desc=+1: In aufgestiegener Form kann der Kleriker „Göttliche Intervention“ wirken, wodurch der Kleriker und alle Verbündeten bis zu 150 Schildpunkte erhalten und die aufgestiegene Form um 3 Runden verlängert wird. +2: In aufgestiegener Form kann der Kleriker „Göttliche Intervention“ wirken, wodurch der Kleriker und alle Verbündeten bis zu 200 Schildpunkte erhalten und die aufgestiegene Form um 4 Runden verlängert wird. +3: In aufgestiegener Form kann der Kleriker „Göttliche Intervention“ wirken, wodurch der Kleriker und alle Verbündeten bis zu 250 Schildpunkte erhalten und die aufgestiegene Form um 5 Runden verlängert wird. +4: In aufgestiegener Form kann der Kleriker „Göttliche Intervention“ wirken, wodurch der Kleriker und alle Verbündeten bis zu 250 Schildpunkte erhalten und die aufgestiegene Form um 5 Runden verlängert wird. Intervention, die den Kleriker und alle Verbündeten um bis zu 300 Schildpunkte erhöht und die Aufgestiegene Form um 6 Runden verlängert. Göttliche Intervention kostet sage und schreibe 5 Foliantenladungen und kann nur einmal in derselben aufgestiegenen Form gewirkt werden.
actors.hero.talent.divine_intervention.title=göttliches Eingreifen
actors.hero.talent.divine_sense.desc=+1: Der Kleriker kann „Göttliche Wahrnehmung“ wirken, einen Zauber, der ihm 50 Runden lang 8 Felder Geistessicht gewährt und keine Wirkzeit benötigt. Er kostet 2 Ladungen. +2: Der Kleriker kann „Göttliche Wahrnehmung“ wirken, einen Zauber, der ihm 50 Runden lang 12 Felder Geistessicht gewährt und keine Wirkzeit benötigt. Er kostet 2 Ladungen.
actors.hero.talent.divine_sense.meta_desc=Wenn dieses Talent von einem anderen Helden erlangt wird, gewährt es ihm stattdessen für einen kurzen Moment Gedankensicht nach der Benutzung eines Zauberstabs oder Artefakts mit einer Reichweite von 3 Feldern bei +1 oder 5 Feldern bei +2.
actors.hero.talent.divine_sense.title=göttliches Gespür
actors.hero.talent.double_jump.desc=+1: Führt der Krieger innerhalb von 3 Runden einen zweiten Sprung aus, sind die Aufladekosten um 16 % reduziert. +2: Führt der Krieger innerhalb von 3 Runden einen zweiten Sprung aus, sind die Aufladekosten um 30 % reduziert. +3: Führt der Krieger innerhalb von 3 Runden einen zweiten Sprung aus, sind die Aufladekosten um 40 % reduziert. +4: Führt der Krieger innerhalb von 3 Runden einen zweiten Sprung aus, sind die Aufladekosten um 50 % reduziert.
actors.hero.talent.double_jump.title=Doppelsprung
actors.hero.talent.double_mark.desc=+1: Das gleichzeitige Markieren eines zweiten Ziels mit dem ersten reduziert die Ladekosten um 30 %. +2: Das gleichzeitige Markieren eines zweiten Ziels mit dem ersten reduziert die Ladekosten um 50 %. +3: Das gleichzeitige Markieren eines zweiten Ziels mit dem ersten reduziert die Ladekosten um 65 %. +4: Das gleichzeitige Markieren eines zweiten Ziels mit dem ersten reduziert die Ladekosten um 75 %.
actors.hero.talent.double_mark.title=Doppelmarke
actors.hero.talent.durable_projectiles.desc=+1: Wurfwaffen haben +50 % Haltbarkeit, wenn sie von der Jägerin benutzt werden. +2: Wurfwaffen haben +75 % Haltbarkeit, wenn sie von der Jägerin benutzt werden.
actors.hero.talent.durable_projectiles.title=langlebige Geschosse
actors.hero.talent.durable_tips.desc=+1: Pfeile mit Spitze haben die doppelte Haltbarkeit, wenn der Wächter sie benutzt. +2: Pfeile mit Spitze haben die dreifache Haltbarkeit, wenn der Wächter sie benutzt. +3: Pfeile mit Spitze haben die vierfache Haltbarkeit, wenn der Wächter sie benutzt.
actors.hero.talent.durable_tips.title=langlebige Spitzen
actors.hero.talent.eagle_eye.desc=+1: Die Sichtweite des Geisterfalken wird von 6 auf 7 Felder erhöht. +2: Die Sichtweite des Geisterfalken wird von 6 auf 8 Felder erhöht. +3: Die Sichtweite des Geisterfalken wird von 6 auf 9 Felder erhöht, und er erhält zusätzlich 2 Felder Geistessicht. +4: Die Sichtweite des Geisterfalken wird von 6 auf 10 Felder erhöht, und er erhält zusätzlich 3 Felder Geistessicht.
actors.hero.talent.eagle_eye.title=Adlerauge
actors.hero.talent.elemental_power.desc=+1: Die Stärke des Elementarschlags wird um 25 % erhöht. +2: Die Stärke des Elementarschlags wird um 50 % erhöht. +3: Die Stärke des Elementarschlags wird um 75 % erhöht. +4: Die Stärke des Elementarschlags wird um 100 % erhöht.
actors.hero.talent.elemental_power.title=Elementarkraft
actors.hero.talent.elemental_reach.desc=+1: Die Reichweite des Elementarschlags wird von 4 auf 5 Felder erhöht, und seine Breite wird von 65 auf 75 Grad erhöht. +2: Die Reichweite des Elementarschlags wird von 4 auf 6 Felder erhöht, und seine Breite wird von 65 auf 85 Grad erhöht. +3: Die Reichweite des Elementarschlags wird von 4 auf 7 Felder erhöht, und seine Breite wird von 65 auf 95 Grad erhöht. +4: Die Reichweite des Elementarschlags wird von 4 auf 8 Felder erhöht, und seine Breite wird von 65 auf 105 Grad erhöht.
actors.hero.talent.elemental_reach.title=elementare Reichweite
actors.hero.talent.elimination_match.desc=+1: Fordert der Duellant innerhalb von 3 Runden nach Duellende erneut heraus, sind die Ladekosten dieser Herausforderung um 16 % reduziert. +2: Fordert der Duellant innerhalb von 3 Runden nach Duellende erneut heraus, sind die Ladekosten dieser Herausforderung um 30 % reduziert. +3: Fordert der Duellant innerhalb von 3 Runden nach Duellende erneut heraus, sind die Ladekosten dieser Herausforderung um 40 % reduziert. +4: Fordert der Duellant innerhalb von 3 Runden nach Duellende erneut heraus, sind die Ladekosten dieser Herausforderung um 50 % reduziert.
actors.hero.talent.elimination_match.title=Ausscheidungsspiel
actors.hero.talent.empowered_strike.desc=+1: Der erste Nahkampfangriff des Kampfmagiers mit seinem Stab nach dem Einsatz des Zaubers verursacht +16 % Schaden und der Bonus-Effekt des Stabs erhält +50 % Stärke. +2: Der erste Nahkampfangriff des Kampfmagiers mit seinem Stab nach dem Einsatz des Zaubers verursacht +33 % Schaden und der Bonus-Effekt des Stabs erhält +100 % Stärke. +3: Der erste Nahkampfangriff des Kampfmagiers mit seinem Stab nach dem Einsatz des Zaubers verursacht +50 % Schaden und der Bonus-Effekt des Stabs erhält +150 % Stärke.
actors.hero.talent.empowered_strike.title=ermächtigter Streik
actors.hero.talent.empowering_meal.desc=+1: Der Verzehr von Nahrung gewährt dem Magier bei den nächsten 3 Zaubern, die er mit einem Zauberstab verursacht, 2 Bonusschaden. +2: Der Verzehr von Nahrung gewährt dem Magier bei den nächsten 3 Zaubern, die er mit einem Zauberstab verursacht, 3 Bonusschaden.
actors.hero.talent.empowering_meal.title=stärkende Mahlzeit
actors.hero.talent.endless_rage.desc=+1: Der Berserker kann maximal 116 % Wut erreichen. +2: Der Berserker kann maximal 133 % Wut erreichen. +3: Der Berserker kann maximal 150 % Wut erreichen. Jeder Wutpunkt über 100 % erhöht den Berserkerschild um 1 % und verringert die Abklingzeit um 1 %, erhöht aber den Schadensbonus nicht über +50 % hinaus.
actors.hero.talent.endless_rage.title=endlose Wut
actors.hero.talent.energizing_meal.desc=+1: Der Magier benötigt durch das Essen 1 Runde und erhält dafür 5 Runden Zauberstabaufladung. +2: Der Magier benötigt durch das Essen 1 Runde und erhält dafür 8 Runden Zauberstabaufladung.
actors.hero.talent.energizing_meal.title=energiespendende Mahlzeit
actors.hero.talent.enhanced_combo.desc=+1: Ab einer Kombo des Gladiators von 7 oder höher erhöht sich die Rückstoßreichweite von Clobber auf 3, verursacht Schwindel und kann Gegner in Gruben stoßen. +2: Zusätzlich zu den Vorteilen von +1 wirkt Parieren bei einer Kombo des Gladiators von 9 oder höher auf mehrere Angriffe. +3: Zusätzlich zu den Vorteilen von +1 und +2 kann der Gladiator bei der Verwendung von Slam, Crush oder Fury bis zu Kombo/3 Felder weit springen.
actors.hero.talent.enhanced_combo.title=verbesserte Kombination
actors.hero.talent.enhanced_lethality.desc=+1: Der Assassine kann Gegner mit weniger als 4/13/27/67 % Gesundheit pro Vorbereitungsstufe ausschalten (vorher 3/10/20/50 %). +2: Der Assassine kann Gegner mit weniger als 5/17/33/83 % Gesundheit pro Vorbereitungsstufe ausschalten (vorher 3/10/20/50 %). +3: Der Assassine kann Gegner mit weniger als 6/20/40/100 % Gesundheit pro Vorbereitungsstufe ausschalten (vorher 3/10/20/50 %).
actors.hero.talent.enhanced_lethality.title=erhöhte Letalität
actors.hero.talent.enhanced_rings.desc=+1: Wenn der Schurke ein Artefakt benutzt, erhalten seine Ringe für 3 Runden eine Verbesserung von +1. +2: Wenn der Schurke ein Artefakt benutzt, erhalten seine Ringe für 6 Runden eine Verbesserung von +1. +3: Wenn der Schurke ein Artefakt benutzt, erhalten seine Ringe für 9 Runden eine Verbesserung von +1.
actors.hero.talent.enhanced_rings.title=verbesserte Ringe
actors.hero.talent.enlightening_meal.desc=+1: Der Kleriker benötigt 1 Runde, um zu essen, und erhält 0,67 Ladungen auf sein heiliges Buch. +2: Der Kleriker benötigt 1 Runde, um zu essen, und erhält 1 Ladung auf sein heiliges Buch.
actors.hero.talent.enlightening_meal.meta_desc=Wird dieses Talent von einem anderen Helden erworben, gewährt es stattdessen 2 Runden lang eine Aufladung von Zauberstab und Artefakt mit +1 oder 3 Runden lang mit +2. Es kann nicht verwendet werden, um das Füllhorn aufzuladen.
actors.hero.talent.enlightening_meal.title=Erleuchtende Mahlzeit
actors.hero.talent.enraged_catalyst.desc=+1: Verzauberungen und Flüche auf der Waffe des Berserkers werden umso häufiger ausgelöst, je höher seine Wut ist, bis maximal 15 % häufiger bei 100 % Wut. +2: Verzauberungen und Flüche auf der Waffe des Berserkers werden umso häufiger ausgelöst, je höher seine Wut ist, bis maximal 30 % häufiger bei 100 % Wut. +3: Verzauberungen und Flüche auf der Waffe des Berserkers werden umso häufiger ausgelöst, je höher seine Wut ist, bis maximal 45 % häufiger bei 100 % Wut.
actors.hero.talent.enraged_catalyst.title=wütender Katalysator
actors.hero.talent.evasive_armor.desc=_+1:_ Während des Freilaufens erhält der Freerunner zusätzlich _+1 Ausweichen_ pro überschüssigem Stärkepunkt auf seiner Rüstung zusätzlich _+3 Ausweichen_ pro überschüssigem Stärkepunkt seiner Rüstung.
actors.hero.talent.evasive_armor.title=Ausweichpanzerung
actors.hero.talent.even_the_odds.desc=+1: Der Krieger verursacht nach Ablauf der Ausdauer zusätzlich 5 % Bonusschaden für jeden Gegner innerhalb von 2 Feldern. +2: Der Krieger verursacht nach Ablauf der Ausdauer zusätzlich 10 % Bonusschaden für jeden Gegner innerhalb von 2 Feldern. +3: Der Krieger verursacht nach Ablauf der Ausdauer zusätzlich 15 % Bonusschaden für jeden Gegner innerhalb von 2 Feldern. +4: Der Krieger verursacht nach Ablauf der Ausdauer zusätzlich 20 % Bonusschaden für jeden Gegner innerhalb von 2 Feldern.
actors.hero.talent.even_the_odds.title=Chancen ausgleichen
actors.hero.talent.excess_charge.desc=+1: Wenn der Stab des Kampfmagiers vollständig aufgeladen ist, gewährt ihm sein nächster Blitz 0,67 Schildpunkte pro Stufe des Stabs. +2: Wenn der Stab des Kampfmagiers vollständig aufgeladen ist, gewährt ihm sein nächster Blitz 1,33 Schildpunkte pro Stufe des Stabs. +3: Wenn der Stab des Kampfmagiers vollständig aufgeladen ist, gewährt ihm sein nächster Blitz 2 Schildpunkte pro Stufe des Stabs.
actors.hero.talent.excess_charge.title=Überschussgebühr
actors.hero.talent.expanding_wave.desc=+1: Die Reichweite der Schockwelle wird von 5 auf 6 Felder erhöht, und ihre Breite wird von 60 auf 75 Grad erhöht. +2: Die Reichweite der Schockwelle wird von 5 auf 7 Felder erhöht, und ihre Breite wird von 60 auf 90 Grad erhöht. +3: Die Reichweite der Schockwelle wird von 5 auf 8 Felder erhöht, und ihre Breite wird von 60 auf 105 Grad erhöht. +4: Die Reichweite der Schockwelle wird von 5 auf 9 Felder erhöht, und ihre Breite wird von 60 auf 120 Grad erhöht.
actors.hero.talent.expanding_wave.title=sich ausdehnende Welle
actors.hero.talent.expose_weakness.desc=+1: Gegner, die das Nachbild des Duellanten angreifen, werden für 2 Runden geschwächt und verwundbar. +2: Gegner, die das Nachbild des Duellanten angreifen, werden für 4 Runden geschwächt und verwundbar. +3: Gegner, die das Nachbild des Duellanten angreifen, werden für 6 Runden geschwächt und verwundbar. +4: Gegner, die das Nachbild des Duellanten angreifen, werden für 8 Runden geschwächt und verwundbar.
actors.hero.talent.expose_weakness.title=Schwächen aufdecken
actors.hero.talent.fan_of_blades.desc=+1: Spektralklingen können bis zu 1 zusätzliches Ziel mit 50 % Schaden treffen. Das Ziel muss sichtbar sein und sich innerhalb eines 30°-Kegels im Wirkungsbereich befinden. +2: Spektralklingen können bis zu 2 zusätzliche Ziele mit 50 % Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines 60°-Kegels im Wirkungsbereich befinden. +3: Spektralklingen können bis zu 3 zusätzliche Ziele mit 50 % Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines 90°-Kegels im Wirkungsbereich befinden. +4: Spektralklingen können bis zu 4 zusätzliche Ziele mit 50 % Schaden treffen. Die Ziele müssen sichtbar sein und sich innerhalb eines 120°-Kegels im Wirkungsbereich befinden.
actors.hero.talent.fan_of_blades.title=Fächer mit Flügeln
actors.hero.talent.farsight.desc=+1: Die Sichtweite des Scharfschützen wird um 25 % erhöht. +2: Die Sichtweite des Scharfschützen wird um 50 % erhöht. +3: Die Sichtweite des Scharfschützen wird um 75 % erhöht.
actors.hero.talent.farsight.title=Weitsicht
actors.hero.talent.fear_the_reaper.desc=+1: Wenn ein Gegner mit dem Todessymbol 0 Trefferpunkte erreicht, wird er verkrüppelt. +2: Wenn ein Gegner mit dem Todessymbol 0 Trefferpunkte erreicht, wird er verängstigt und verkrüppelt. +3: Wenn ein Gegner mit dem Todessymbol 0 Trefferpunkte erreicht, wird er verängstigt und verkrüppelt, und Gegner im Umkreis von 3 Feldern werden verkrüppelt. +4: Wenn ein Gegner mit dem Todessymbol 0 Trefferpunkte erreicht, wird er verängstigt und verkrüppelt, und Gegner im Umkreis von 3 Feldern werden verängstigt und verkrüppelt.
actors.hero.talent.fear_the_reaper.title=Fürchte den Tod
actors.hero.talent.feigned_retreat.desc=+1: Wenn ein Gegner das Nachbild der Duellantin angreift, erhält sie 2 Runden Eile. +2: Wenn ein Gegner das Nachbild der Duellantin angreift, erhält sie 4 Runden Eile. +3: Wenn ein Gegner das Nachbild der Duellantin angreift, erhält sie 6 Runden Eile. +4: Wenn ein Gegner das Nachbild der Duellantin angreift, erhält sie 8 Runden Eile.
actors.hero.talent.feigned_retreat.title=vorgetäuschter Rückzug
actors.hero.talent.fire_everything.desc=+1: Wilde Magie wird nun 5-mal statt 4 Mal ausgelöst, und jeder Zauberstab hat eine Chance von 25 %, 3-mal verwendbar zu sein. +2: Wilde Magie wird nun 6-mal statt 4 Mal ausgelöst, und jeder Zauberstab hat eine Chance von 50 %, 3-mal verwendbar zu sein. +3: Wilde Magie wird nun 7-mal statt 4 Mal ausgelöst, und jeder Zauberstab hat eine Chance von 75 %, 3-mal verwendbar zu sein. +4: Wilde Magie wird nun 8-mal statt 4 Mal ausgelöst, und jeder Zauberstab hat eine Chance von 100 %, 3-mal verwendbar zu sein.
actors.hero.talent.fire_everything.title=Feuer alles
actors.hero.talent.flash.desc=+1: In aufgestiegener Form kann der Kleriker Blitz wirken und sich bis zu 3 Felder weit teleportieren. +2: In aufgestiegener Form kann der Kleriker Blitz wirken und sich bis zu 4 Felder weit teleportieren. +3: In aufgestiegener Form kann der Kleriker Blitz wirken und sich bis zu 5 Felder weit teleportieren. +4: In aufgestiegener Form kann der Kleriker Blitz wirken und sich bis zu 6 Felder weit teleportieren. Blitz kostet anfänglich 2 Zauberbuchladungen und 1 weitere Ladung für jede Anwendung in derselben aufgestiegenen Form.
actors.hero.talent.flash.title=Blitz
actors.hero.talent.focused_meal.desc=+1: Durch das Essen benötigt die Duellantin 1 Runde und erhält 0,67 Ladungen auf ihre Waffen. +2: Durch das Essen benötigt die Duellantin 1 Runde und erhält 1 Ladung auf ihre Waffen.
actors.hero.talent.focused_meal.meta_desc=Wird dieses Talent von einem anderen Helden erworben, gewährt es stattdessen einen Bonusschaden für seinen nächsten Treffer in Höhe von Stufe/3 bei +1 oder Stufe/2 bei +2.
actors.hero.talent.focused_meal.title=fokussierte Mahlzeit
actors.hero.talent.followup_strike.desc=+1: Wenn die Jägerin einen Gegner mit ihrem Bogen oder einer Wurfwaffe trifft, verursacht ihr nächster Nahkampfangriff gegen diesen Gegner 2 zusätzlichen Schaden. +2: Wenn die Jägerin einen Gegner mit ihrem Bogen oder einer Wurfwaffe trifft, verursacht ihr nächster Nahkampfangriff gegen diesen Gegner 3 zusätzlichen Schaden.
actors.hero.talent.followup_strike.title=Folgeschlag
actors.hero.talent.go_for_the_eyes.desc=+1: Angriffe des Geisterfalken blenden Gegner für 2 Runden. +2: Angriffe des Geisterfalken blenden Gegner für 5 Runden. +3: Angriffe des Geisterfalken blenden Gegner für 5 Runden und schwächen sie für 2 Runden. +4: Angriffe des Geisterfalken blenden Gegner für 5 Runden und schwächen sie für 5 Runden.
actors.hero.talent.go_for_the_eyes.title=Greife die Augen an
actors.hero.talent.growing_power.desc=+1: Die Angriffs- und Bewegungsgeschwindigkeitsboni durch Naturkraft wurden von 33 % und 100 % auf 38 % bzw. 125 % erhöht. +2: Die Angriffs- und Bewegungsgeschwindigkeitsboni durch Naturkraft wurden von 33 % und 100 % auf 42 % bzw. 150 % erhöht. +3: Die Angriffs- und Bewegungsgeschwindigkeitsboni durch Naturkraft wurden von 33 % und 100 % auf 46 % bzw. 175 % erhöht. +4: Die Angriffs- und Bewegungsgeschwindigkeitsboni durch Naturkraft wurden von 33 % und 100 % auf 50 % bzw. 200 % erhöht.
actors.hero.talent.growing_power.title=wachsende Macht
actors.hero.talent.hallowed_ground.desc=+1: Der Priester kann „Geweihter Boden“ wirken, einen Zauber, der das Gelände in einem 3x3-Feld für 20 Runden heiligt. Kosten: 2 Ladungen. +2: Der Priester kann „Geweihter Boden“ wirken, einen Zauber, der das Gelände in einem 5x5-Feld für 20 Runden heiligt. Kosten: 2 Ladungen. +3: Der Priester kann „Geweihter Boden“ wirken, einen Zauber, der das Gelände in einem 7x7-Feld für 20 Runden heiligt. Kosten: 2 Ladungen. Beim Wirken heilt „Geweihter Boden“ Verbündete um 15 LP, fesselt Gegner kurzzeitig und lässt kurzes Gras wachsen. Anschließend heilt er Verbündete langsam, schwächt Gegner und lässt zufällig hohes Gras wachsen. Geweihter Boden gewährt dem Priester Schutz anstelle von Heilung und wird durch Feuer zerstört.
actors.hero.talent.hallowed_ground.title=heiliger Boden
actors.hero.talent.hasty_retreat.desc=+1: Nach dem Blinzeln erhält der Schurke 1 Runde lang Eile und Unsichtbarkeit. +2: Nach dem Blinzeln erhält der Schurke 2 Runden lang Eile und Unsichtbarkeit. +3: Nach dem Blinzeln erhält der Schurke 3 Runden lang Eile und Unsichtbarkeit. +4: Nach dem Blinzeln erhält der Schurke 4 Runden lang Eile und Unsichtbarkeit.
actors.hero.talent.hasty_retreat.title=überstürzter Rückzug
actors.hero.talent.hearty_meal.desc=+1: Der Verzehr von Nahrung heilt den Krieger um 4 LP, wenn seine Gesundheit bei oder unter 33 % liegt. +2: Der Verzehr von Nahrung heilt den Krieger um 6 LP, wenn seine Gesundheit bei oder unter 33 % liegt.
actors.hero.talent.hearty_meal.title=herzhafte Mahlzeit
actors.hero.talent.heightened_senses.desc=+1: Die Jägerin erhält Gedankensicht auf Charaktere innerhalb von 2 Feldern um ihre Position. +2: Die Jägerin erhält Gedankensicht auf Charaktere innerhalb von 3 Feldern um ihre Position.
actors.hero.talent.heightened_senses.title=geschärfte Sinne
actors.hero.talent.heroic_energy.desc=+1: Die Rüstungsfähigkeit des Helden hat 12 % reduzierte Ladekosten. +2: Die Rüstungsfähigkeit des Helden hat 23 % reduzierte Ladekosten. +3: Die Rüstungsfähigkeit des Helden hat 32 % reduzierte Ladekosten. +4: Die Rüstungsfähigkeit des Helden hat 40 % reduzierte Ladekosten.
actors.hero.talent.heroic_energy.rat_title=rotherische Energie
actors.hero.talent.heroic_energy.title=heroische Energie
actors.hero.talent.hold_fast.desc=+1: Wenn der Krieger wartet, erhält er 1-2 Rüstung und der Abbau von Kombo- und Schildverstärkungen wird um 50 % verlangsamt, bis er sich bewegt. +2: Wenn der Krieger wartet, erhält er 2-4 Rüstung und der Abbau von Kombo- und Schildverstärkungen wird um 75 % verlangsamt, bis er sich bewegt. +3: Wenn der Krieger wartet, erhält er 3-6 Rüstung und der Abbau von Kombo- und Schildverstärkungen wird um 100 % verlangsamt, bis er sich bewegt.
actors.hero.talent.hold_fast.title=festhalten
actors.hero.talent.holy_intuition.desc=+1: Der Kleriker kann „Heilige Intuition“ wirken, einen Zauber, der enthüllt, ob ein Gegenstand verflucht ist. Die Kosten hierfür betragen 3 Ladungen. +2: Der Kleriker kann „Heilige Intuition“ wirken, einen Zauber, der enthüllt, ob ein Gegenstand verflucht ist. Die Kosten hierfür betragen 2 Ladungen.
actors.hero.talent.holy_intuition.meta_desc=Wird dieses Talent von einem anderen Helden erworben, so ermöglicht es dem Helden stattdessen, den Fluchstatus eines verfluchten Gegenstands kurz vor dessen Anlegen zu erkennen, und zwar in 15 % der Fälle bei +1 oder in 25 % der Fälle bei +2.
actors.hero.talent.holy_intuition.title=heilige Intuition
actors.hero.talent.holy_lance.desc=+1: Der Priester kann „Heilige Lanze“ wirken, einen verheerenden Zauber, der 30–55 Schaden verursacht und 4 Ladungen kostet. +2: Der Priester kann „Heilige Lanze“ wirken, einen verheerenden Zauber, der 45–83 Schaden verursacht und 4 Ladungen kostet. +3: Der Priester kann „Heilige Lanze“ wirken, einen verheerenden Zauber, der 60–110 Schaden verursacht und 4 Ladungen kostet. „Heilige Lanze“ verursacht immer maximalen Schaden an dämonischen und untoten Gegnern. Die Abklingzeit von „Heilige Lanze“ beträgt 30 Runden.
actors.hero.talent.holy_lance.title=Heilige Lanze
actors.hero.talent.impact_wave.desc=+1: Wenn der Krieger nach einem Sprung landet, werden alle angrenzenden Gegner 2 Felder zurückgestoßen und haben eine Chance von 25 %, für 5 Runden verwundbar zu sein. +2: Wenn der Krieger nach einem Sprung landet, werden alle angrenzenden Gegner 3 Felder zurückgestoßen und haben eine Chance von 50 %, für 5 Runden verwundbar zu sein. +3: Wenn der Krieger nach einem Sprung landet, werden alle angrenzenden Gegner 4 Felder zurückgestoßen und haben eine Chance von 75 %, für 5 Runden verwundbar zu sein. +4: Wenn der Krieger nach einem Sprung landet, werden alle angrenzenden Gegner 5 Felder zurückgestoßen und haben eine Chance von 100 %, für 5 Runden verwundbar zu sein.
actors.hero.talent.impact_wave.title=Aufprallwelle
actors.hero.talent.improvised_projectiles.desc=+1: Der Krieger kann einen Gegner für 2 Runden blenden, indem er einen beliebigen Gegenstand (außer einer Wurfwaffe) nach ihm wirft. Die Abklingzeit beträgt 50 Runden. +2: Der Krieger kann einen Gegner für 3 Runden blenden, indem er einen beliebigen Gegenstand (außer einer Wurfwaffe) nach ihm wirft. Die Abklingzeit beträgt 50 Runden.
actors.hero.talent.improvised_projectiles.title=improvisierte Geschosse
actors.hero.talent.inscribed_power.desc=+1: Wenn der Magier eine Schriftrolle liest oder einen Zaubergegenstand benutzt, erhalten seine nächsten 2 Zauberstabzauber +2 Stufen. +2: Wenn der Magier eine Schriftrolle liest oder einen Zaubergegenstand benutzt, erhalten seine nächsten 3 Zauberstabzauber +2 Stufen. Die Anzahl der verstärkten Zauberstabzauber verdoppelt sich, wenn eine Schriftrolle von Aufwertungs-, Transmutations- oder Alchemiegegenständen verwendet wird, die mit diesen Schriftrollen hergestellt werden müssen. Bei Alchemiegegenständen mit höherer Produktionsmenge (z. B. den meisten Zaubern) besteht eine Chance, dass dieses Talent ausgelöst wird, abhängig davon, wie viele dieser Gegenstände hergestellt werden.
actors.hero.talent.inscribed_power.title=eingeschriebene Kraft
actors.hero.talent.inscribed_stealth.desc=+1: Der Schurke erhält nach dem Lesen einer Schriftrolle oder der Verwendung eines Zaubergegenstands 3 Runden Unsichtbarkeit. +2: Der Schurke erhält nach dem Lesen einer Schriftrolle oder der Verwendung eines Zaubergegenstands 5 Runden Unsichtbarkeit. Die Dauer der Unsichtbarkeit verdoppelt sich bei Verwendung einer Schriftrolle der Aufwertung, einer Schriftrolle der Transmutation oder Alchemiegegenständen, die mithilfe dieser Schriftrollen hergestellt werden müssen. Bei Alchemiegegenständen mit höherer Produktionsmenge (z. B. den meisten Zaubern) besteht eine Chance, dass dieses Talent ausgelöst wird, abhängig von der Anzahl der hergestellten Gegenstände.
actors.hero.talent.inscribed_stealth.title=eingeschriebene Heimlichkeit
actors.hero.talent.invigorating_meal.desc=+1: Das Essen kostet die Jägerin 1 Runde (Beeren werden sofort gegessen) und gewährt ihr 1 Runde Eile. +2: Das Essen kostet die Jägerin 1 Runde (Beeren werden sofort gegessen) und gewährt ihr 2 Runden Eile.
actors.hero.talent.invigorating_meal.title=stärkende Mahlzeit
actors.hero.talent.invigorating_victory.desc=+1: Besiegt die Duellantin ihr Ziel vor Ende des Duells, heilt sie sich um 5 LP plus 30 % des erlittenen Schadens. +2: Besiegt die Duellantin ihr Ziel vor Ende des Duells, heilt sie sich um 10 LP plus 50 % des erlittenen Schadens. +3: Besiegt die Duellantin ihr Ziel vor Ende des Duells, heilt sie sich um 15 LP plus 65 % des erlittenen Schadens. +4: Besiegt die Duellantin ihr Ziel vor Ende des Duells, heilt sie sich um 20 LP plus 75 % des erlittenen Schadens.
actors.hero.talent.invigorating_victory.title=belebender Sieg
actors.hero.talent.iron_stomach.desc=+1: Der Krieger benötigt 1 Runde, um zu essen, und erhält währenddessen 75 % Schadensresistenz. +2: Der Krieger benötigt 1 Runde, um zu essen, und erhält währenddessen 100 % Schadensresistenz.
actors.hero.talent.iron_stomach.title=Eiserner Magen
actors.hero.talent.iron_will.desc=+1: Der durch das Siegel des Kriegers gewährte Schild wird um 1 erhöht. +2: Der durch das Siegel des Kriegers gewährte Schild wird um 2 erhöht.
actors.hero.talent.iron_will.meta_desc=Wenn dieses Talent von einem anderen Helden erworben wird, gewährt es passiv eine Version des Siegelbruch-Effekts des Kriegers mit 1 oder 2 maximalen Schildpunkten.
actors.hero.talent.iron_will.title=eiserner Wille
actors.hero.talent.judgement.desc=+1: In aufgestiegener Gestalt kann der Kleriker „Urteil“ wirken, das allen sichtbaren Feinden 10–20 Schaden zufügt. +2: In aufgestiegener Gestalt kann der Kleriker „Urteil“ wirken, das allen sichtbaren Feinden 15–30 Schaden zufügt. +3: In aufgestiegener Gestalt kann der Kleriker „Urteil“ wirken, das allen sichtbaren Feinden 20–40 Schaden zufügt. +4: In aufgestiegener Gestalt kann der Kleriker „Urteil“ wirken, das allen sichtbaren Feinden 25–50 Schaden zufügt. „Urteil“ kostet 3 Zauberbuchladungen. Urteil verursacht +33% Schaden für jeden Zauber, den der Kleriker seit dem Eintritt in die aufgestiegene Form oder seit dem letzten Wirken von Urteil gewirkt hat.
actors.hero.talent.judgement.title=Urteil
actors.hero.talent.lay_on_hands.desc=+1: Der Paladin kann „Handauflegen“ wirken, einen Zauber, der einen nahen Charakter sofort um 15 TP heilt oder dem Paladin 15 Schildpunkte gewährt. Kosten: 1 Ladung. +2: Der Paladin kann „Handauflegen“ wirken, einen Zauber, der einen nahen Charakter sofort um 20 TP heilt oder dem Paladin 20 Schildpunkte gewährt. Kosten: 1 Ladung. +3: Der Paladin kann „Handauflegen“ wirken, einen Zauber, der einen nahen Charakter sofort um 25 TP heilt oder dem Paladin 25 Schildpunkte gewährt. Kosten: 1 Ladung. Überschüssige Heilung durch diesen Zauber wird in Schildpunkte umgewandelt. Der Zauber „Handauflegen“ kann wiederholt gewirkt werden, jedoch kann er nicht mehr als drei Schutzwirkungen gleichzeitig erzielen.
actors.hero.talent.lay_on_hands.title=Handauflegen
actors.hero.talent.lethal_defense.desc=+1: Wenn der Gladiator einen Gegner mit einer Kombo tötet, wird die Abklingzeit seines Schildes „Gebrochenes Siegel“ um 50 Runden reduziert. +2: Wenn der Gladiator einen Gegner mit einer Kombo tötet, wird die Abklingzeit seines Schildes „Gebrochenes Siegel“ um 100 Runden reduziert. +3: Wenn der Gladiator einen Gegner mit einer Kombo tötet, wird die Abklingzeit seines Schildes „Gebrochenes Siegel“ um 150 Runden reduziert. Die Schildabklingzeit kann durch dieses Talent auf bis zu -150 Runden reduziert werden, was bedeutet, dass der Schild nach der Aktivierung sofort wieder verfügbar ist.
actors.hero.talent.lethal_defense.title=tödliche Verteidigung
actors.hero.talent.lethal_haste.desc=+1: Wenn die Duellantin einem Gegner mit einer Waffenfähigkeit den Todesstoß versetzt, erhält sie 3 Runden lang sofortige Bewegung. +2: Wenn die Duellantin einem Gegner mit einer Waffenfähigkeit den Todesstoß versetzt, erhält sie 5 Runden lang sofortige Bewegung.
actors.hero.talent.lethal_haste.meta_desc=Wird dieses Talent von einem anderen Helden erlangt, wird es stattdessen bei normalen Waffenangriffen ausgelöst, mit einer Abklingzeit von 100 Runden.
actors.hero.talent.lethal_haste.title=tödliche Eile
actors.hero.talent.lethal_momentum.desc=+1: Wenn der Krieger einem Gegner mit einer physischen Waffe den Todesstoß versetzt, besteht eine Chance von 67 %, dass er 0 Runden benötigt. +2: Wenn der Krieger einem Gegner mit einer physischen Waffe den Todesstoß versetzt, besteht eine Chance von 100 %, dass er 0 Runden benötigt.
actors.hero.talent.lethal_momentum.title=tödlicher Impuls
actors.hero.talent.life_link.desc=Der Kleriker kann _Lebensverbindung_ zwischen sich und einem gestärkten Verbündeten zum Preis von 2 Ladungen wirken. Dieser Zauber teilt den Schaden zwischen dem Kleriker und seinem Verbündeten auf und bewirkt, dass positive Klerikerzauber der Stufe 3 oder niedriger auf beide wirken, falls einer von ihnen betroffen ist. \n\n_+1: Lebensverbindung hält 10 Runden an und erhöht den Bonus von „Macht der Vielen“ auf -35 % erlittenen Schaden. \n\n_+2: Lebensverbindung hält 13 Runden an und erhöht den Bonus von „Macht der Vielen“ auf -40 % erlittenen Schaden. \n\n_+3: Lebensverbindung hält 17 Runden an und erhöht den Bonus von „Macht der Vielen“ auf -45 % erlittenen Schaden. \n\n_+4: Lebensverbindung hält 20 Runden an und erhöht den Bonus von „Macht der Vielen“ auf -50 % erlittenen Schaden.
actors.hero.talent.life_link.title=Lebensverbindung
actors.hero.talent.light_cloak.desc=+1: Der Schurke kann seinen Schattenumhang auch ohne Ausrüstung benutzen, aber er lädt sich im abgelegten Zustand mit 25 % Geschwindigkeit wieder auf. +2: Der Schurke kann seinen Schattenumhang auch ohne Ausrüstung benutzen, aber er lädt sich im abgelegten Zustand mit 50 % Geschwindigkeit wieder auf. +3: Der Schurke kann seinen Schattenumhang auch ohne Ausrüstung benutzen, aber er lädt sich im abgelegten Zustand mit 75 % Geschwindigkeit wieder auf.
actors.hero.talent.light_cloak.meta_desc=Wird dieses Talent von einem anderen Helden erworben, erhöht es stattdessen die Aufladegeschwindigkeit aller Artefakte um 7/13/20% bei +1/+2/+3.
actors.hero.talent.light_cloak.title=leichter Umhang
actors.hero.talent.light_reading.desc=+1: Der Kleriker kann sein heiliges Buch auch ohne Ausrüstung benutzen, es lädt sich aber mit 25 % Geschwindigkeit wieder auf. +2: Der Kleriker kann sein heiliges Buch auch ohne Ausrüstung benutzen, es lädt sich aber mit 50 % Geschwindigkeit wieder auf. +3: Der Kleriker kann sein heiliges Buch auch ohne Ausrüstung benutzen, es lädt sich aber mit 75 % Geschwindigkeit wieder auf.
actors.hero.talent.light_reading.meta_desc=Wird dieses Talent von einem anderen Helden erworben, erhöht es stattdessen die Aufladegeschwindigkeit aller Zauberstäbe um 7/13/20% bei +1/+2/+3.
actors.hero.talent.light_reading.title=Leichte Lektüre
actors.hero.talent.lingering_magic.desc=+1: Wenn der Magier mit einem Zauberstab oder Stab zuschlägt, verursacht sein nächster physischer Angriff 1-2 Bonusschaden. +2: Wenn der Magier mit einem Zauberstab oder Stab zuschlägt, verursacht sein nächster physischer Angriff 2 Bonusschaden.
actors.hero.talent.lingering_magic.title=anhaltender Zauber
actors.hero.talent.liquid_agility.desc=+1: Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers erhält die Duellantin 3-fache Ausweichchance und 3-fache Treffsicherheit bei ihrem nächsten Nahkampfangriff innerhalb von 5 Runden. +2: Beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers erhält die Duellantin unendliche Ausweichchance und unendliche Treffsicherheit bei ihrem nächsten Nahkampfangriff innerhalb von 5 Runden. Dieser Bonus hält eine zusätzliche Runde und einen zusätzlichen Angriff an, wenn Tränke der Stärke, Erfahrung oder Alchemiegegenstände verwendet werden, die mit diesen Tränken hergestellt werden müssen. Bei Alchemiegegenständen mit höherer Produktionsmenge (z. B. Wasserbräu) besteht eine Chance, dass dieses Talent ausgelöst wird, abhängig von der Menge des hergestellten Gegenstands.
actors.hero.talent.liquid_agility.title=Flüssigkeitsbeweglichkeit
actors.hero.talent.liquid_nature.desc=+1: Wenn die Jägerin einen Trank, ein Gebräu oder ein Elixier trinkt oder wirft, sprießen bis zu 4 Grasfelder in der Umgebung, und angrenzende Gegner werden für 1 Runde festgehalten. +2: Wenn die Jägerin einen Trank, ein Gebräu oder ein Elixier trinkt oder wirft, sprießen bis zu 6 Grasfelder in der Umgebung, und angrenzende Gegner werden für 2 Runden festgehalten. Die Menge des Grases und die Dauer der Festhaltung verdoppeln sich bei der Verwendung von Stärke-, Erfahrungstränken oder Alchemiegegenständen, die mit diesen Tränken hergestellt werden müssen. Bei Alchemiegegenständen mit höherer Produktionsmenge (z. B. Wasserbräu) besteht eine Chance, dass dieses Talent ausgelöst wird, basierend auf der Anzahl der hergestellten Gegenstände.
actors.hero.talent.liquid_nature.title=flüssiger Charakter
actors.hero.talent.liquid_willpower.desc=+1: Der Krieger erhält beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers 6,5 % seiner maximalen LP als Schild. +2: Der Krieger erhält beim Trinken oder Werfen eines Tranks, Gebräus oder Elixiers 10 % seiner maximalen LP als Schild. Der Schildwert verdoppelt sich bei der Verwendung von Stärke-, Erfahrungstränken oder Alchemiegegenständen, die mit diesen Tränken hergestellt werden müssen. Bei Alchemiegegenständen mit höherer Produktionsmenge (z. B. Wasserbräu) besteht eine Chance, dass dieses Talent ausgelöst wird, abhängig von der Anzahl der hergestellten Gegenstände.
actors.hero.talent.liquid_willpower.title=Flüssige Willenskraft
actors.hero.talent.longrange_warp.desc=+1: Der Magier kann sich nun zwischen den Ebenen teleportieren, die Kosten betragen 150 % der Ladung. +2: Der Magier kann sich nun zwischen den Ebenen teleportieren, die Kosten betragen 117 % der Ladung. +3: Der Magier kann sich nun zwischen den Ebenen teleportieren, die Kosten betragen 83 % der Ladung. +4: Der Magier kann sich nun zwischen den Ebenen teleportieren, die Kosten betragen 50 % der Ladung. Der Magier kann keine Teleportation über große Entfernungen nutzen, um eine gesperrte Ebene zu verlassen.
actors.hero.talent.longrange_warp.title=Langstrecken-Warp
actors.hero.talent.mind_form.desc=Der Kleriker kann „Geistesgestalt“ wirken, wodurch Trinity die Kraft eines Zauberstabs oder einer Wurfwaffe erhält, die der Kleriker in diesem Durchgang verwendet hat. Die Wirkung kostet 3 Ladungen. _+6._\n\nTrinity kann jeweils nur mit einem Geisteseffekt erfüllt werden.
actors.hero.talent.mind_form.title=Geistesform
actors.hero.talent.mnemonic_prayer.desc=+1: Der Priester kann „Mnemonisches Gebet“ wirken, einen Zauber, der Stärkungs-/Schwächungseffekte auf einen Verbündeten/Feind für 3 Runden verlängert (1 Ladung). +2: Der Priester kann „Mnemonisches Gebet“ wirken, einen Zauber, der Stärkungs-/Schwächungseffekte auf einen Verbündeten/Feind für 4 Runden verlängert (1 Ladung). +3: Der Priester kann „Mnemonisches Gebet“ wirken, einen Zauber, der Stärkungs-/Schwächungseffekte auf einen Verbündeten/Feind für 5 Runden verlängert (1 Ladung). „Mnemonisches Gebet“ benötigt keine Zeit zum Wirken. „Mnemonisches Gebet“ kann einen bestimmten Stärkungs-/Schwächungseffekt nur einmal verlängern und keine Stärkungseffekte von Rüstungsfähigkeiten.
actors.hero.talent.mnemonic_prayer.title=Gedächtnisgebet
actors.hero.talent.monastic_vigor.desc=+1: Wenn der Mönch 100 % Energie hat, werden seine Fähigkeiten verstärkt. +2: Wenn der Mönch 80 % oder mehr Energie hat, werden seine Fähigkeiten verstärkt. +3: Wenn der Mönch 60 % oder mehr Energie hat, werden seine Fähigkeiten verstärkt. Verstärkt: - Wirbelwind wendet die Waffenverzauberung an. - Fokus ist sofort aktiv. - Sprint erhält +4 Reichweite. - Drachenkick verursacht +50 % Schaden und stößt alle angrenzenden Gegner zurück und betäubt sie. - Meditation heilt langsam 20 % der fehlenden HP und gewährt 80 % Schadensresistenz.
actors.hero.talent.monastic_vigor.title=klösterliche Kraft
actors.hero.talent.mystical_charge.desc=+1: Ein Schlag mit seinem Stab gewährt dem Kampfmagier Artefaktaufladung für 0,5 Runden. +2: Ein Schlag mit seinem Stab gewährt dem Kampfmagier Artefaktaufladung für 1 Runde. +3: Ein Schlag mit seinem Stab gewährt dem Kampfmagier Artefaktaufladung für 1,5 Runden.
actors.hero.talent.mystical_charge.title=mystische Ladung
actors.hero.talent.mystical_meal.desc=+1: Der Schurke benötigt 1 Runde, um Nahrung zu sich zu nehmen (Vorratsrationen werden sofort verzehrt) und erhält 3 Runden Zeit, um sein Artefakt aufzuladen. +2: Der Schurke benötigt 1 Runde, um Nahrung zu sich zu nehmen (Vorratsrationen werden sofort verzehrt) und erhält 5 Runden Zeit, um sein Artefakt aufzuladen. Dieses Talent kann nicht verwendet werden, um das Füllhorn aufzuladen.
actors.hero.talent.mystical_meal.title=mystische Mahlzeit
actors.hero.talent.natures_aid.desc=+1: Die Jägerin erhält 0-2 Rindenhaut-Rüstung, die alle 3 Runden abnimmt, wenn der Effekt einer Pflanze in ihrem Sichtfeld aktiviert wird. +2: Die Jägerin erhält 0-2 Rindenhaut-Rüstung, die alle 5 Runden abnimmt, wenn der Effekt einer Pflanze in ihrem Sichtfeld aktiviert wird.
actors.hero.talent.natures_aid.title=Hilfe der Natur
actors.hero.talent.natures_bounty.desc=+1: Die Jägerin kann beim Erkunden der nächsten Ebenen des Dungeons 4 Beeren im hohen Gras finden. +2: Die Jägerin kann beim Erkunden der nächsten Ebenen des Dungeons 6 Beeren im hohen Gras finden. Beeren werden schnell verzehrt, stillen kurz den Hunger und können einen nützlichen Samen enthalten.
actors.hero.talent.natures_bounty.title=Naturschätze
actors.hero.talent.natures_wrath.desc=+1: Solange die Naturkraft aktiv ist, besteht bei Schüssen mit dem Geisterbogen eine Chance von 8 %, einen zufälligen schädlichen Pflanzeneffekt auszulösen. +2: Solange die Naturkraft aktiv ist, besteht bei Schüssen mit dem Geisterbogen eine Chance von 17 %, einen zufälligen schädlichen Pflanzeneffekt auszulösen. +3: Solange die Naturkraft aktiv ist, besteht bei Schüssen mit dem Geisterbogen eine Chance von 25 %, einen zufälligen schädlichen Pflanzeneffekt auszulösen. +4: Solange die Naturkraft aktiv ist, besteht bei Schüssen mit dem Geisterbogen eine Chance von 33 %, einen zufälligen schädlichen Pflanzeneffekt auszulösen. Folgende Pflanzen können ausgelöst werden: Blindkraut, Feuerblüte, Eiskappe, Trauermoos und Sturmranke.
actors.hero.talent.natures_wrath.title=der Zorn der Natur
actors.hero.talent.necromancers_minions.desc=+1: Wenn ein mit einem Seelenzeichen versehener Feind stirbt, besteht für den Hexenmeister eine Chance von 13 %, ihn als verdorbenen Geist wiederzuerwecken. +2: Wenn ein mit einem Seelenzeichen versehener Feind stirbt, besteht für den Hexenmeister eine Chance von 27 %, ihn als verdorbenen Geist wiederzuerwecken. +3: Wenn ein mit einem Seelenzeichen versehener Feind stirbt, besteht für den Hexenmeister eine Chance von 40 %, ihn als verdorbenen Geist wiederzuerwecken.
actors.hero.talent.necromancers_minions.title=Diener des Nekromanten
actors.hero.talent.patient_strike.desc=+1: Wartet die Duellantin, bevor sie einen Nahkampfangriff ausführt, verursacht sie 1-2 Bonusschaden. +2: Wartet die Duellantin, bevor sie einen Nahkampfangriff ausführt, verursacht sie 2 Bonusschaden.
actors.hero.talent.patient_strike.title=Patientenstreik
actors.hero.talent.perfect_copy.desc=+1: Der Schattenklon erhält 10 % der maximalen HP des Helden und kann sofort mit ihm die Plätze tauschen (bis zu 1 Feld entfernt). +2: Der Schattenklon erhält 20 % der maximalen HP des Helden und kann sofort mit ihm die Plätze tauschen (bis zu 2 Felder entfernt). +3: Der Schattenklon erhält 30 % der maximalen HP des Helden und kann sofort mit ihm die Plätze tauschen (bis zu 3 Felder entfernt). +4: Der Schattenklon erhält 40 % der maximalen HP des Helden und kann sofort mit ihm die Plätze tauschen (bis zu 4 Felder entfernt).
actors.hero.talent.perfect_copy.title=perfekte Kopie
actors.hero.talent.point_blank.desc=+1: Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf einsetzt, beträgt die Treffsicherheit -25 % statt -50 %. +2: Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf einsetzt, beträgt die Treffsicherheit normale Werte statt -50 %. +3: Wenn die Jägerin ihren Bogen oder eine Wurfwaffe im Nahkampf einsetzt, beträgt die Treffsicherheit +25 % statt -50 %. Hinweis: Wurfwaffen und der Geisterbogen haben auf Distanz immer eine Treffsicherheit von +50 %.
actors.hero.talent.point_blank.title=Punktgenau
actors.hero.talent.precise_assault.desc=+1: Wenn die Duellantin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Runden bei ihrem nächsten Nahkampfangriff die doppelte Treffsicherheit. +2: Wenn die Duellantin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Runden bei ihrem nächsten Nahkampfangriff die fünffache Treffsicherheit. +3: Wenn die Duellantin eine Waffenfähigkeit einsetzt, erhält sie innerhalb von 5 Runden bei ihrem nächsten Nahkampfangriff unbegrenzte Treffsicherheit.
actors.hero.talent.precise_assault.meta_desc=Wird dieses Talent von einem anderen Helden erworben, erhöht es stattdessen die Nahkampfgenauigkeit um 10 % bei +1, um 20 % bei +2 oder um 30 % bei +3.
actors.hero.talent.precise_assault.title=präziser Angriff
actors.hero.talent.projectile_momentum.desc=+1: Beim Freerunning erhält der Freerunner +50 % Treffsicherheit und +15 % Schaden mit Wurfwaffen. +2: Beim Freerunning erhält der Freerunner +100 % Treffsicherheit und +30 % Schaden mit Wurfwaffen. +3: Beim Freerunning erhält der Freerunner +150 % Treffsicherheit und +45 % Schaden mit Wurfwaffen.
actors.hero.talent.projectile_momentum.title=Projektilimpuls
actors.hero.talent.projecting_blades.desc=+1: Spektralklingen haben eine um 25 % höhere Genauigkeit und können bis zu 2 feste Felder durchdringen. +2: Spektralklingen haben eine um 50 % höhere Genauigkeit und können bis zu 4 feste Felder durchdringen. +3: Spektralklingen haben eine um 75 % höhere Genauigkeit und können bis zu 6 feste Felder durchdringen. +4: Spektralklingen haben eine um 100 % höhere Genauigkeit und können bis zu 8 feste Felder durchdringen.
actors.hero.talent.projecting_blades.title=hervorstehende Klingen
actors.hero.talent.protective_shadows.desc=+1: Der Schurke erhält in jeder zweiten Runde, in der er unsichtbar ist, einen Schild, bis maximal 3. +2: Der Schurke erhält in jeder Runde, in der er unsichtbar ist, einen Schild, bis maximal 5.
actors.hero.talent.protective_shadows.title=schützende Schatten
actors.hero.talent.provoked_anger.desc=+1: Wird ein Schutzbuff des Kriegers durch Schaden gebrochen, verursacht sein nächster physischer Angriff 3 zusätzlichen Schaden. +2: Wird ein Schutzbuff des Kriegers durch Schaden gebrochen, verursacht sein nächster physischer Angriff 5 zusätzlichen Schaden.
actors.hero.talent.provoked_anger.title=provozierten Zorn
actors.hero.talent.ratforcements.desc=+1: Die Anwendung von Rattenverwandlung auf dich selbst lässt 1 verbündete Beutelratte neben dir erscheinen. +2: Die Anwendung von Rattenverwandlung auf dich selbst lässt 2 verbündete Beutelratten neben dir erscheinen. +3: Die Anwendung von Rattenverwandlung auf dich selbst lässt 3 verbündete Beutelratten neben dir erscheinen. +4: Die Anwendung von Rattenverwandlung auf dich selbst lässt 4 verbündete Beutelratten neben dir erscheinen.
actors.hero.talent.ratforcements.title=Rattendurchsetzungen
actors.hero.talent.ratlomacy.desc=+1: Die Anwendung von „Rattenverwandlung“ auf einen bereits verwandlungsfähigen Gegner macht ihn freundlich und die Verwandlung bleibt bestehen. +2: Die Anwendung von „Rattenverwandlung“ auf einen bereits verwandlungsfähigen Gegner macht ihn freundlich, die Verwandlung bleibt bestehen und er erhält 2 Runden lang Adrenalin. +3: Die Anwendung von „Rattenverwandlung“ auf einen bereits verwandlungsfähigen Gegner macht ihn freundlich, die Verwandlung bleibt bestehen und er erhält 4 Runden lang Adrenalin. +4: Die Anwendung von „Rattenverwandlung“ auf einen bereits verwandlungsfähigen Gegner macht ihn freundlich, die Verwandlung bleibt bestehen und er erhält 6 Runden lang Adrenalin.
actors.hero.talent.ratlomacy.title=Ratlomacy
actors.hero.talent.ratsistance.desc=+1: Feindliche, rattenverwandelte Gegner verursachen -10 % Schaden. +2: Feindliche, rattenverwandelte Gegner verursachen -19 % Schaden. +3: Feindliche, rattenverwandelte Gegner verursachen -27 % Schaden. +4: Feindliche, rattenverwandelte Gegner verursachen -35 % Schaden.
actors.hero.talent.ratsistance.title=Widerstand
actors.hero.talent.reactive_barrier.desc=+1: Der Magier erhält 2,5 Schildpunkte für jeden von einem Elementarschlag betroffenen Charakter, maximal jedoch für 5 Charaktere. +2: Der Magier erhält 5 Schildpunkte für jeden von einem Elementarschlag betroffenen Charakter, maximal jedoch für 6 Charaktere. +3: Der Magier erhält 7,5 Schildpunkte für jeden von einem Elementarschlag betroffenen Charakter, maximal jedoch für 7 Charaktere. +4: Der Magier erhält 10 Schildpunkte für jeden von einem Elementarschlag betroffenen Charakter, maximal jedoch für 8 Charaktere.
actors.hero.talent.reactive_barrier.title=reaktive Barriere
actors.hero.talent.recall_inscription.desc=+1: Der Kleriker kann „Inschrift zurückrufen“ wirken, einen Zauber, der es ihm erlaubt, den Effekt des zuletzt verwendeten Runensteins oder der Schriftrolle innerhalb von 10 Runden zu wiederholen. +2: Der Kleriker kann „Inschrift zurückrufen“ wirken, einen Zauber, der es ihm erlaubt, den Effekt des zuletzt verwendeten Runensteins oder der Schriftrolle innerhalb von 300 Runden zu wiederholen. „Inschrift zurückrufen“ kann nicht mit Schriftrollen der Aufwertung verwendet werden. Die Kosten für die Aufladung dieses Zaubers variieren je nach dem zuletzt verwendeten Gegenstand: 2 für einen Runenstein, 3 für eine Schriftrolle, 4 für eine exotische Schriftrolle. Diese Kosten verdoppeln sich auch bei Verwendung mit einer Schriftrolle der Transmutation oder Alchemiegegenständen, die durch Transmutation oder Aufwertung hergestellt werden müssen.
actors.hero.talent.recall_inscription.meta_desc=Wird dieses Talent von einem anderen Helden erworben, werden stattdessen Schriftrollen oder Runensteine in 10 % der Fälle bei +1 bzw. in 15 % der Fälle bei +2 erstattet. Aufwertungsschriftrollen sind von diesem Effekt ausgenommen.
actors.hero.talent.recall_inscription.refunded=Ihr Artikel wurde erstattet!
actors.hero.talent.recall_inscription.title=Erinnerungsschrift
actors.hero.talent.rejuvenating_steps.desc=+1: Wenn die Jägerin auf kurzes Gras oder Glut tritt, wächst daraus hohes Gras, das die Jägerin sofort in Furchen gräbt. Diese Fähigkeit hat eine Abklingzeit von 10 Runden. +2: Wenn die Jägerin auf kurzes Gras oder Glut tritt, wächst daraus hohes Gras, das die Jägerin sofort in Furchen gräbt. Diese Fähigkeit hat eine Abklingzeit von 5 Runden. Dieses Talent erzeugt gefurchtes Gras, wenn passive Regenerationseffekte deaktiviert sind oder der Held längere Zeit keine Erfahrungspunkte gesammelt hat.
actors.hero.talent.rejuvenating_steps.title=Verjüngungsschritte
actors.hero.talent.remote_beacon.desc=+1: Der Magier kann an jedem beliebigen Ort innerhalb von 4 Feldern ein Leuchtfeuer platzieren. +2: Der Magier kann an jedem beliebigen Ort innerhalb von 8 Feldern ein Leuchtfeuer platzieren. +3: Der Magier kann an jedem beliebigen Ort innerhalb von 12 Feldern ein Leuchtfeuer platzieren. +4: Der Magier kann an jedem beliebigen Ort innerhalb von 16 Feldern ein Leuchtfeuer platzieren. Der Magier kann keine Leuchtfeuer an unzugänglichen Orten platzieren.
actors.hero.talent.remote_beacon.title=Fernbeacon
actors.hero.talent.rogues_foresight.desc=+1: Befindet sich der Schurke auf einem Level mit einem Geheimraum, besteht eine 75%ige Chance, dass er bemerkt, dass das Level ein Geheimnis enthält. +2: Befindet sich der Schurke auf einem Level mit einem Geheimraum, besteht eine 100%ige Chance, dass er bemerkt, dass das Level ein Geheimnis enthält.
actors.hero.talent.rogues_foresight.title=die Weitsicht des Schurken
actors.hero.talent.runic_transference.desc=+1: Das zerbrochene Siegel des Kriegers kann normale Glyphen auf dieselbe Weise übertragen wie eine Aufwertung. +2: Das zerbrochene Siegel des Kriegers kann normale, mächtige und Fluchglyphen auf dieselbe Weise übertragen wie eine Aufwertung. Das Siegel kann nur Glyphen übertragen, die auf der Rüstung angebracht waren, als das Siegel angebracht wurde.
actors.hero.talent.runic_transference.meta_desc=Wird dieses Talent von einem anderen Helden erworben, so verhindert es stattdessen, dass Glyphen auf eurer Rüstung durch Aufwertungsrollen entfernt werden. Glyphen gehen verloren, wenn ihr von Stufe 6 (vorher 4) auf +1 oder von Stufe 7 (vorher 4) auf +2 aufwertet. Die Stufe, ab der Glyphen garantiert verloren gehen, bleibt bei +8 unverändert.
actors.hero.talent.runic_transference.title=Runenübertragung
actors.hero.talent.satiated_spells.desc=+1: Durch den Verzehr von Nahrung erhält der Kleriker beim nächsten Zauberwirken 3 Schildpunkte. +2: Durch den Verzehr von Nahrung erhält der Kleriker beim nächsten Zauberwirken 5 Schildpunkte.
actors.hero.talent.satiated_spells.meta_desc=Wenn dieses Talent von einem anderen Helden erworben wird, gewährt es stattdessen sofort einen Schutzschild, der nach 10 Runden normal abklingt.
actors.hero.talent.satiated_spells.title=Sättigungszauber
actors.hero.talent.scholars_intuition.desc=+1: Der Magier erkennt Zauberstäbe 3x schneller. +2: Der Magier erkennt Zauberstäbe, wenn er sie benutzt.
actors.hero.talent.scholars_intuition.title=Intuition des Gelehrten
actors.hero.talent.searing_light.desc=+1: Die physischen Angriffe des Klerikers auf Gegner, die vom „Leitenden Licht“ erleuchtet werden, verursachen +3 Schaden. +2: Die physischen Angriffe des Klerikers auf Gegner, die vom „Leitenden Licht“ erleuchtet werden, verursachen +5 Schaden.
actors.hero.talent.searing_light.meta_desc=Wird dieses Talent von einem anderen Helden erworben, gewährt es stattdessen seinen Bonusschaden, nachdem ein Zauberstab oder ein Artefakt gegen einen Gegner eingesetzt wurde, mit einer Abklingzeit von 20 Runden.
actors.hero.talent.searing_light.title=gleißendes Licht
actors.hero.talent.seer_shot.desc=+1: Wenn die Jägerin einen Pfeil auf den Boden schießt, erhält sie 5 Runden lang Sicht in einem 3x3-Feld um sich herum. Die Abklingzeit beträgt 20 Runden. +2: Wenn die Jägerin einen Pfeil auf den Boden schießt, erhält sie 10 Runden lang Sicht in einem 3x3-Feld um sich herum. Die Abklingzeit beträgt 20 Runden. +3: Wenn die Jägerin einen Pfeil auf den Boden schießt, erhält sie 15 Runden lang Sicht in einem 3x3-Feld um sich herum. Die Abklingzeit beträgt 20 Runden.
actors.hero.talent.seer_shot.meta_desc=Wenn dieses Talent von einem anderen Helden erlangt wird, wird es durch jede Wurfwaffe ausgelöst.
actors.hero.talent.seer_shot.title=Seherschuss
actors.hero.talent.shadow_blade.desc=+1: Der Schattenklon erhält 8 % des Schadens des Helden pro Runde und hat eine Chance von 25 %, die Verzauberung auf die Waffe des Helden anzuwenden. +2: Der Schattenklon erhält 16 % des Schadens des Helden pro Runde und hat eine Chance von 50 %, die Verzauberung auf die Waffe des Helden anzuwenden. +3: Der Schattenklon erhält 24 % des Schadens des Helden pro Runde und hat eine Chance von 75 %, die Verzauberung auf die Waffe des Helden anzuwenden. +4: Der Schattenklon erhält 32 % des Schadens des Helden pro Runde und hat eine Chance von 100 %, die Verzauberung auf die Waffe des Helden anzuwenden.
actors.hero.talent.shadow_blade.title=Schattenklinge
actors.hero.talent.shadow_step.desc=+1: Wenn der Schurke im unsichtbaren Zustand eine Rauchbombe einsetzt, wird diese sofort gezündet und die Aufladekosten sind um 16 % reduziert. Gegner werden dadurch nicht geblendet und andere Talente werden nicht ausgelöst. +2: Wenn der Schurke im unsichtbaren Zustand eine Rauchbombe einsetzt, wird diese sofort gezündet und die Aufladekosten sind um 30 % reduziert. Gegner werden dadurch nicht geblendet und andere Talente werden nicht ausgelöst. +3: Wenn der Schurke im unsichtbaren Zustand eine Rauchbombe einsetzt, wird diese sofort gezündet und die Aufladekosten sind um 41 % reduziert. Gegner werden dadurch nicht geblendet und andere Talente werden nicht ausgelöst. +4: Wenn der Schurke im unsichtbaren Zustand eine Rauchbombe einsetzt, wird diese sofort gezündet und die Aufladekosten sind um 50 % reduziert. Gegner werden dadurch nicht geblendet und andere Talente werden nicht ausgelöst.
actors.hero.talent.shadow_step.title=Schattenschritt
actors.hero.talent.shared_enchantment.desc=+1: Wurfwaffen haben eine Chance von 33 %, die Verzauberung des Scharfschützenbogens zu verwenden. +2: Wurfwaffen haben eine Chance von 67 %, die Verzauberung des Scharfschützenbogens zu verwenden. +3: Wurfwaffen haben eine Chance von 100 %, die Verzauberung des Scharfschützenbogens zu verwenden. Die Verzauberung des Bogens kann zusätzlich zu der bereits vorhandenen Verzauberung der Wurfwaffe ausgelöst werden.
actors.hero.talent.shared_enchantment.title=gemeinsame Verzauberung
actors.hero.talent.shared_upgrades.desc=+1: Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, erhöht sich mit jedem Level die Dauer des Scharfschützen-Marks um 1 Runde und der Schaden ihres Spezialangriffs um 16 %, bis maximal 2 Runden und +33 % Schaden bei +2. +2: Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, erhöht sich mit jedem Level die Dauer des Scharfschützen-Marks um 1 Runde und der Schaden ihres Spezialangriffs um 16 %, bis maximal 4 Runden und +67 % Schaden bei +4. +3: Wenn die Scharfschützin mit einer verbesserten Wurfwaffe angreift, erhöht sich mit jedem Level die Dauer des Scharfschützen-Marks um 1 Runde und der Schaden ihres Spezialangriffs um 16 %, bis maximal 6 Runden und +100 % Schaden bei +6.
actors.hero.talent.shared_upgrades.title=gemeinsame Upgrades
actors.hero.talent.shield_battery.desc=+1: Der Magier kann sich selbst mit einem Zauberstab als Ziel auswählen und alle seine Ladungen in einen Schild umwandeln, wobei jede Ladung 4 % seiner maximalen HP verbraucht. +2: Der Magier kann sich selbst mit einem Zauberstab als Ziel auswählen und alle seine Ladungen in einen Schild umwandeln, wobei jede Ladung 6 % seiner maximalen HP verbraucht.
actors.hero.talent.shield_battery.title=Schutzbatterie
actors.hero.talent.shield_of_light.desc=+1: Der Kleriker kann „Schild des Lichts“ wirken, einen Zauber, der sofort gewirkt wird und ihm für 5 Runden 2–4 Rüstung gegen ein Ziel gewährt (Kosten: 1 Ladung). +2: Der Kleriker kann „Schild des Lichts“ wirken, einen Zauber, der sofort gewirkt wird und ihm für 5 Runden 3–6 Rüstung gegen ein Ziel gewährt (Kosten: 1 Ladung).
actors.hero.talent.shield_of_light.meta_desc=Wird dieses Talent von einem anderen Helden erworben, so verringert es stattdessen den erlittenen physischen Schaden durch den anvisierten Gegner um 1, und zwar in 33 % der Fälle bei +1 oder in 50 % der Fälle bei +2.
actors.hero.talent.shield_of_light.title=Schild des Lichts
actors.hero.talent.shielding_dew.desc=+1: Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu 20 % ihrer maximalen HP. +2: Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu 40 % ihrer maximalen HP. +3: Tautropfen können die Wächterin schützen, wenn ihre Gesundheit voll ist, bis zu 60 % ihrer maximalen HP.
actors.hero.talent.shielding_dew.title=Schutztau
actors.hero.talent.shock_force.desc=+1: Schockwelle verursacht 20 % mehr Schaden und hat eine Chance von 25 %, zu betäuben statt zu verkrüppeln. +2: Schockwelle verursacht 40 % mehr Schaden und hat eine Chance von 50 %, zu betäuben statt zu verkrüppeln. +3: Schockwelle verursacht 60 % mehr Schaden und hat eine Chance von 75 %, zu betäuben statt zu verkrüppeln. +4: Schockwelle verursacht 80 % mehr Schaden und hat eine Chance von 100 %, zu betäuben statt zu verkrüppeln.
actors.hero.talent.shock_force.title=Stoßkraft
actors.hero.talent.shrug_it_off.desc=+1: Die Schadensreduktion des Kriegers während des Überlebens wird von 50 % auf 60 % erhöht. +2: Die Schadensreduktion des Kriegers während des Überlebens wird von 50 % auf 68 % erhöht. +3: Die Schadensreduktion des Kriegers während des Überlebens wird von 50 % auf 74 % erhöht. +4: Die Schadensreduktion des Kriegers während des Überlebens wird von 50 % auf 80 % erhöht.
actors.hero.talent.shrug_it_off.title=Achselzucken
actors.hero.talent.silent_steps.desc=+1: Der Schurke weckt schlafende Feinde nicht auf, solange er mindestens 3 Felder von ihnen entfernt ist. +2: Der Schurke weckt schlafende Feinde nicht auf, solange er nicht neben ihnen steht.
actors.hero.talent.silent_steps.title=lautlose Schritte
actors.hero.talent.soul_eater.desc=+1: Seelenmal gewährt 0,33 Runden Sättigung für jeden verursachten physischen Schaden. Seelenmal-Gegner haben eine Chance von 10 %, beim Tod Effekte auszulösen, die beim Verzehr ausgelöst werden. +2: Seelenmal gewährt 0,67 Runden Sättigung für jeden verursachten physischen Schaden. Seelenmal-Gegner haben eine Chance von 20 %, beim Tod Effekte auszulösen, die beim Verzehr ausgelöst werden. +3: Seelenmal gewährt 1 Runde Sättigung für jeden verursachten physischen Schaden. Seelenmal-Gegner haben eine Chance von 30 %, beim Tod Effekte auszulösen, die beim Verzehr ausgelöst werden.
actors.hero.talent.soul_eater.title=Seelenfresser
actors.hero.talent.soul_siphon.desc=+1: Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenmal des Hexenmeisters mit einer Effektivität von 13 % aus. +2: Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenmal des Hexenmeisters mit einer Effektivität von 27 % aus. +3: Physischer Schaden, der von anderen Charakteren verursacht wird, löst das Seelenmal des Hexenmeisters mit einer Effektivität von 40 % aus.
actors.hero.talent.soul_siphon.title=Seelensiphon
actors.hero.talent.speedy_stealth.desc=+1: Der Freerunner erhält 2 Momentum-Stapel pro Runde, solange er unsichtbar ist. +2: Zusätzlich zu den Vorteilen von +1 läuft das Freerunning nicht mehr ab, solange der Freerunner unsichtbar ist. +3: Zusätzlich zu den Vorteilen von +1 und +2 bewegt sich der Freerunner mit doppelter Geschwindigkeit, solange er unsichtbar ist, unabhängig davon, ob er Freerunning betreibt oder nicht.
actors.hero.talent.speedy_stealth.title=schnelle Heimlichkeit
actors.hero.talent.spirit_blades.desc=+1: Spektralklingen haben eine 30%ige Chance, die Verzauberung auch auf den Geisterbogen anzuwenden. +2: Spektralklingen haben eine 60%ige Chance, die Verzauberung auch auf den Geisterbogen anzuwenden. +3: Spektralklingen haben eine 90%ige Chance, die Verzauberung auch auf den Geisterbogen anzuwenden. +4: Spektralklingen haben eine 100%ige Chance, die Verzauberung auch auf den Geisterbogen anzuwenden und verleihen jeder Verzauberung +10% Stärke.
actors.hero.talent.spirit_blades.title=Geisterklingen
actors.hero.talent.spirit_form.desc=Der Kleriker kann „Geistergestalt“ wirken, wodurch Trinity die Macht eines Rings oder Artefakts erhält, das der Kleriker in diesem Durchgang identifiziert hat (außer dem heiligen Buch). Die Wirkung kostet 4 Ladungen. \n\n_+1: Wenn Trinity eingesetzt wird, erhält der Kleriker 20 Runden lang den Effekt eines Rings auf +1 oder löst den Effekt eines Artefakts auf +4 aus. \n\n_+2: Wenn Trinity eingesetzt wird, erhält der Kleriker 20 Runden lang den Effekt eines Rings auf +2 oder löst den Effekt eines Artefakts auf +6 aus. \n\n_+3: Wenn Trinity eingesetzt wird, erhält der Kleriker 20 Runden lang den Effekt eines Rings auf +3 oder löst den Effekt eines Artefakts auf +4 aus. +8.\n\n+4: Bei Verwendung von Trinity erhält der Kleriker 20 Runden lang den Effekt eines Rings bei +4 oder löst den Effekt eines Artefakts bei +10 aus. Trinity kann immer nur mit einem Geistereffekt gleichzeitig verstärkt werden. Artefakte haben unterschiedliche Effekte und Rüstungsladungskosten, wenn sie durch Trinity ausgelöst werden.
actors.hero.talent.spirit_form.title=Geisterform
actors.hero.talent.stasis.desc=Der Kleriker kann einen gestärkten Verbündeten mit dem Zauber „Stasis“ belegen, was 2 Aufladungen kostet. Stasis entfernt den Verbündeten vorübergehend aus dem Dungeon und erhält die verbleibende Wirkungsdauer aller Stärkungszauber, einschließlich „Macht der Vielen“. Der Verbündete erscheint wieder neben dem Kleriker, sobald der Effekt endet. Stasis kann sofort und kostenlos erneut gewirkt werden, um den Effekt vorzeitig zu beenden. Stasis wirkt auf unbewegliche Verbündete, kann sie aber nicht zwischen Dungeon-Ebenen bewegen. \n\n_+1:_ Stasis hält maximal 60 Runden an. \n\n_+2:_ Stasis hält maximal 90 Runden an. \n\n_+3:_ Stasis hält maximal 120 Runden an. \n\n_+4:_ Stasis hält maximal 150 Runden an. \n\nDer Kleriker kann außerdem Strahlender Strahl wirken, während sich ein Verbündeter in Stasis befindet, um ihn wiederzubeleben, oder Lebensband wirken, um dessen Effekt präventiv anzuwenden. Verbündete profitieren jedoch nicht von Lebensband, während sie sich in Stasis befinden.
actors.hero.talent.stasis.title=Stase
actors.hero.talent.strengthening_meal.desc=+1: Durch den Verzehr von Nahrung erhält die Duellantin bei den nächsten 2 Treffern mit einem physischen Angriff 3 Bonusschaden. +2: Durch den Verzehr von Nahrung erhält die Duellantin bei den nächsten 3 Treffern mit einem physischen Angriff 3 Bonusschaden.
actors.hero.talent.strengthening_meal.title=stärkende Mahlzeit
actors.hero.talent.striking_force.desc=+1: Die Stärke des Elementarschlags wird um 30 % erhöht. +2: Die Stärke des Elementarschlags wird um 60 % erhöht. +3: Die Stärke des Elementarschlags wird um 90 % erhöht. +4: Die Stärke des Elementarschlags wird um 120 % erhöht.
actors.hero.talent.striking_force.title=Schlagkraft
actors.hero.talent.striking_wave.desc=+1: Schockwelle hat eine 30%ige Chance, zusätzlich Treffereffekte wie Verzauberungen und Kombos auszulösen. +2: Schockwelle hat eine 60%ige Chance, zusätzlich Treffereffekte wie Verzauberungen und Kombos auszulösen. +3: Schockwelle hat eine 90%ige Chance, zusätzlich Treffereffekte wie Verzauberungen und Kombos auszulösen. +4: Schockwelle hat eine 100%ige Chance, zusätzlich Treffereffekte wie Verzauberungen und Kombos auszulösen und verleiht Verzauberungen +20% Stärke.
actors.hero.talent.striking_wave.title=Schlagwelle
actors.hero.talent.strongman.desc=+1: Die Stärke des Kriegers wird um 8 % erhöht (abgerundet). +2: Die Stärke des Kriegers wird um 13 % erhöht (abgerundet). +3: Die Stärke des Kriegers wird um 18 % erhöht (abgerundet).
actors.hero.talent.strongman.title=Kraftprotz
actors.hero.talent.sucker_punch.desc=+1: Der Schurke verursacht beim ersten Überraschungsangriff auf einen Gegner 1-2 Bonusschaden. +2: Der Schurke verursacht beim ersten Überraschungsangriff auf einen Gegner 2 Bonusschaden.
actors.hero.talent.sucker_punch.title=Sucker Punch
actors.hero.talent.sunray.desc=+1: Der Kleriker kann Sonnenstrahl wirken, einen Zauber, der 4–8 Schaden verursacht und das Ziel für 4 Runden blendet. Kosten: 1 Ladung. +2: Der Kleriker kann Sonnenstrahl wirken, einen Zauber, der 6–12 Schaden verursacht und das Ziel für 6 Runden blendet. Kosten: 1 Ladung. Sonnenstrahl kann jedes Ziel nur einmal blenden. Ist das Ziel bereits von Sonnenstrahl geblendet, wird es stattdessen gelähmt. Dämonischen und untoten Gegnern verursacht Sonnenstrahl immer maximalen Schaden.
actors.hero.talent.sunray.meta_desc=Wird dieses Talent von einem anderen Helden erworben, so bewirkt es stattdessen, dass Zauberstäbe und Artefakte Gegner für 4 Runden blenden, und zwar in 15 % der Fälle bei +1 oder in 25 % der Fälle bei +2.
actors.hero.talent.sunray.title=Sonnenstrahl
actors.hero.talent.survivalists_intuition.desc=+1: Die Jägerin erkennt geworfene Waffen 3x schneller. +2: Die Jägerin erkennt geworfene Waffen, wenn sie damit trifft.
actors.hero.talent.survivalists_intuition.title=Intuition des Überlebenskünstlers
actors.hero.talent.sustained_retribution.desc=+1: Der Krieger verursacht 115 % Bonusschaden verteilt auf 2 Treffer anstatt 100 % Bonusschaden mit einem Treffer. +2: Der Krieger verursacht 130 % Bonusschaden verteilt auf 3 Treffer anstatt 100 % Bonusschaden mit einem Treffer. +3: Der Krieger verursacht 145 % Bonusschaden verteilt auf 4 Treffer anstatt 100 % Bonusschaden mit einem Treffer. +4: Der Krieger verursacht 160 % Bonusschaden verteilt auf 5 Treffer anstatt 100 % Bonusschaden mit einem Treffer.
actors.hero.talent.sustained_retribution.title=anhaltende Vergeltung
actors.hero.talent.swift_equip.desc=+1: Die Duellantin kann ihre ausgerüstete Waffe einmal alle 20 Runden sofort wechseln. +2: Die Duellantin kann ihre ausgerüstete Waffe zweimal alle 20 Runden sofort wechseln. Besitzt die Duellantin dieses Talent und ist es nicht in der Abklingzeit, wird durch die schnelle Verwendung einer nicht ausgerüsteten Waffe diese ausgerüstet.
actors.hero.talent.swift_equip.title=schnelle Ausrüstung
actors.hero.talent.swift_spirit.desc=+1: Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf 2,5 Felder erhöht, und er weicht garantiert den ersten 2 Angriffen aus. +2: Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf 3 Felder erhöht, und er weicht garantiert den ersten 4 Angriffen aus. +3: Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf 3,5 Felder erhöht, und er weicht garantiert den ersten 6 Angriffen aus. +4: Die Bewegungsgeschwindigkeit des Geisterfalken wird von 2 auf 4 Felder erhöht, und er weicht garantiert den ersten 8 Angriffen aus.
actors.hero.talent.swift_spirit.title=schneller Geist
actors.hero.talent.telefrag.desc=+1: Wenn der Magier in einen anderen Charakter teleportiert, verursacht er 10–15 Schaden, erleidet aber selbst 5 Schaden. +2: Wenn der Magier in einen anderen Charakter teleportiert, verursacht er 20–30 Schaden, erleidet aber selbst 10 Schaden. +3: Wenn der Magier in einen anderen Charakter teleportiert, verursacht er 30–45 Schaden, erleidet aber selbst 15 Schaden. +4: Wenn der Magier in einen anderen Charakter teleportiert, verursacht er 40–60 Schaden, erleidet aber selbst 20 Schaden. Der Held kann durch dieses Talent nicht getötet werden; der Selbstschaden kann durch Magieresistenz-Effekte reduziert werden.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=+1: Der Schurke erkennt Ringe doppelt so schnell und identifiziert den Ringtyp, wenn er ihn anlegt. +2: Der Schurke erkennt Ringe, wenn er sie anlegt, und identifiziert den Ringtyp, wenn er sie aufhebt.
actors.hero.talent.thiefs_intuition.title=Die Intuition eines Diebes
actors.hero.talent.twin_upgrades.desc=+1: Wenn eine der beiden ausgerüsteten Waffen des Champions eine niedrigere Stufe hat und mindestens zwei Stufen niedriger ist als die andere Waffe, wird sie auf die Stufe der anderen Waffe angehoben. +2: Wenn eine der beiden ausgerüsteten Waffen des Champions eine niedrigere Stufe hat und mindestens eine Stufe niedriger ist als die andere Waffe, wird sie auf die Stufe der anderen Waffe angehoben. +3: Wenn eine der beiden ausgerüsteten Waffen des Champions eine niedrigere Stufe hat und mindestens die gleiche Stufe wie die andere Waffe besitzt, wird sie auf die Stufe der anderen Waffe angehoben.
actors.hero.talent.twin_upgrades.title=Doppel-Upgrades
actors.hero.talent.unencumbered_spirit.desc=+1: Der Mönch erhält 50 % mehr Energie für jedes Ausrüstungsteil der Stufe 3 oder niedriger, das er trägt. +2: Der Mönch erhält 75 % mehr Energie für jedes Ausrüstungsteil der Stufe 2 oder niedriger, das er trägt. Der Bonus der Stufe 3 bleibt unverändert. +3: Der Mönch erhält 100 % mehr Energie für jedes Ausrüstungsteil der Stufe 1 oder niedriger, das er trägt. Die Boni der Stufen 2 und 3 bleiben unverändert. Er erhält außerdem eine kostenlose Stoffrüstung und genietete Handschuhe. Hinweis: Dieses Talent gewährt keinen Vorteil beim unbewaffneten Kampf oder beim Angriff mit einem Ring der Macht.
actors.hero.talent.unencumbered_spirit.title=ungehinderter Geist
actors.hero.talent.varied_charge.desc=+1: Die Heldin erhält sofort 0,17 Waffenladungen zurück, wenn sie zwei verschiedene Waffenfähigkeiten einsetzt, ohne Zeitlimit. +2: Die Heldin erhält sofort 0,33 Waffenladungen zurück, wenn sie zwei verschiedene Waffenfähigkeiten einsetzt, ohne Zeitlimit. +3: Die Heldin erhält sofort 0,5 Waffenladungen zurück, wenn sie zwei verschiedene Waffenfähigkeiten einsetzt, ohne Zeitlimit.
actors.hero.talent.varied_charge.title=unterschiedliche Gebühr
actors.hero.talent.veterans_intuition.desc=+1: Der Krieger erkennt Waffen 1,75x schneller und Rüstungen 2,5x schneller. +2: Der Krieger erkennt Waffen 2,5x schneller und Rüstungen, wenn er sie anlegt.
actors.hero.talent.veterans_intuition.title=Intuition eines Veteranen
actors.hero.talent.wall_of_light.desc=+1: Der Paladin kann „Lichtmauer“ wirken, einen Zauber, der eine 3 Felder breite, feste Mauer vor dem Paladin erschafft. Diese Mauer stößt Feinde zurück und hält 20 Runden lang an. Der Zauber kostet 3 Ladungen. +2: Der Paladin kann „Lichtmauer“ wirken, einen Zauber, der eine 5 Felder breite, feste Mauer vor dem Paladin erschafft. Diese Mauer stößt Feinde zurück und hält 20 Runden lang an. Der Zauber kostet 3 Ladungen. +3: Der Paladin kann „Lichtmauer“ wirken, einen Zauber, der eine 7 Felder breite, feste Mauer vor dem Paladin erschafft. Diese Mauer stößt Feinde zurück und hält 20 Runden lang an. Der Zauber kostet 3 Ladungen. Die Mauer kann in den Himmelsrichtungen oder diagonal platziert werden. Es kann immer nur eine Mauer gleichzeitig existieren.
actors.hero.talent.wall_of_light.title=Lichtwand
actors.hero.talent.wand_preservation.desc=+1: Wenn der Magier einen neuen Zauberstab in seinen Stab einsetzt, wird der alte Zauberstab mit +0 zurückgegeben. Dies ist jedoch nur einmal möglich. +2: Wenn der Magier einen neuen Zauberstab in seinen Stab einsetzt, wird der alte Zauberstab mit +0 zurückgegeben. Dies kann mit einer Abklingzeit von einem Heldenlevel wiederholt werden.
actors.hero.talent.wand_preservation.meta_desc=Wird dieses Talent von einem anderen Helden erworben, erhöht es stattdessen die Menge an arkanem Harz, die beim Einlegen eines Zauberstabs in einen Alchemiekessel gewonnen wird, um 1 bei +1 oder um 2 bei +2.
actors.hero.talent.wand_preservation.title=Zauberstab-Aufbewahrung
actors.hero.talent.weapon_recharging.desc=+1: Der Duellant erhält alle 15 Runden eine Waffenladung, wenn er unter dem Einfluss von Zauberstab- oder Artefakt-Aufladeboni steht. +2: Der Duellant erhält alle 10 Runden eine Waffenladung, wenn er unter dem Einfluss von Zauberstab- oder Artefakt-Aufladeboni steht.
actors.hero.talent.weapon_recharging.meta_desc=Wenn dieses Talent von einem anderen Helden erlernt wird, bewirkt es stattdessen, dass dieser +5 % Nahkampfschaden verursacht, während er sich mit +1 auflädt, oder +7,5 % Nahkampfschaden verursacht, während er sich mit +2 auflädt.
actors.hero.talent.weapon_recharging.title=Waffenaufladung
actors.hero.talent.wide_search.desc=+1: Der Suchradius des Schurken wird von einem 5x5-Quadrat auf einen 7x7-Kreis erhöht. +2: Der Suchradius des Schurken wird von einem 5x5-Quadrat auf ein 7x7-Quadrat erhöht.
actors.hero.talent.wide_search.meta_desc=Wenn dieses Talent von einem anderen Helden erworben wird, erhöht es stattdessen dessen Suchradius von einem 3x3-Quadrat auf einen 5x5-Kreis bei +1 oder auf ein 5x5-Quadrat bei +2.
actors.hero.talent.wide_search.title=breite Suche
actors.hero.talent.wild_momentum.desc=+1: Das Töten eines Gegners mit dem Geisterbogen verlängert die Dauer der Naturkraft um 1 Runde. Die Dauer kann um maximal 2 Runden verlängert werden. +2: Das Töten eines Gegners mit dem Geisterbogen verlängert die Dauer der Naturkraft um 2 Runden. Die Dauer kann um maximal 4 Runden verlängert werden. +3: Das Töten eines Gegners mit dem Geisterbogen verlängert die Dauer der Naturkraft um 3 Runden. Die Dauer kann um maximal 6 Runden verlängert werden. +4: Das Töten eines Gegners mit dem Geisterbogen verlängert die Dauer der Naturkraft um 4 Runden. Die Dauer kann um maximal 8 Runden verlängert werden.
actors.hero.talent.wild_momentum.title=ungeheure Dynamik
actors.hero.talent.wild_power.desc=+1: Bei der Anwendung von Wildmagie werden Zauberstäbe um 2 oder 3 verstärkt, bis maximal +4. +2: Bei der Anwendung von Wildmagie werden Zauberstäbe um 3 verstärkt, bis maximal +5. +3: Bei der Anwendung von Wildmagie werden Zauberstäbe um 3 oder 4 verstärkt, bis maximal +6. +4: Bei der Anwendung von Wildmagie werden Zauberstäbe um 4 verstärkt, bis maximal +7.
actors.hero.talent.wild_power.title=Wilde Kraft
actors.mobs.acidic.desc=Diese riesigen, spinnenartigen Dämonenwesen meiden den Nahkampf und feuern lieber aus großer Entfernung lähmende, gezackte Stacheln ab. Dieses hier scheint von ätzendem Schleim zu triefen.
actors.mobs.acidic.name=saurer Skorpion
actors.mobs.albino.desc=Dies ist eine seltene Beutelrattenart mit reinweißem Fell und gezackten Zähnen.
actors.mobs.albino.discover_hint=Diesen Gegner findet man nur selten in einem bestimmten Bereich des Dungeons.
actors.mobs.albino.name=Albino-Ratte
actors.mobs.armoredbrute.desc=Die ranghöchsten Gnoll-Brutalos tragen oft mächtige Rüstungen, um ihren Status zu demonstrieren. Die Rüstungen machen diese Brutalos deutlich widerstandsfähiger gegen physische Angriffe, und ihre größere Disziplin ermöglicht es ihnen, viel länger zu toben, bevor sie ihren Wunden erliegen.
actors.mobs.armoredbrute.name=gepanzerter Grobian
actors.mobs.armoredstatue.desc=Man könnte meinen, es sei nur eine weitere der leblosen Statuen dieses Verlieses, doch die rot glühenden Augen verraten es. Aufgrund seiner Rüstung scheint es in hervorragendem Zustand zu sein; es dürfte sehr schwer zu töten sein.
actors.mobs.armoredstatue.desc_arm_wep=Während die Statue selbst aus Stein gefertigt ist, sehen die _%1$s_ und _%2$s_, die sie hält, echt aus.
actors.mobs.armoredstatue.name=gepanzerte Statue
actors.mobs.bandit.desc=Die tieferen Ebenen des Verlieses waren schon immer ein Versteck für allerlei Kriminelle. Nicht alle von ihnen konnten in der langen Zeit fernab des Tageslichts einen klaren Kopf bewahren. Vor langer Zeit haben diese verrückten Diebe und Banditen vergessen, wer sie sind und warum sie stehlen.
actors.mobs.bandit.name=verrückter Bandit
actors.mobs.bat.desc=Diese flinken und zähen Höhlenbewohner sind viel gefährlicher, als sie aussehen. Mit jedem erfolgreichen Angriff regenerieren sie ihre Lebensenergie, wodurch sie selbst deutlich größere Gegner besiegen können.
actors.mobs.bat.name=Vampirfledermaus
actors.mobs.bee.desc=Trotz ihrer geringen Größe verteidigen Goldbienen ihr Nest sehr vehement. Diese hier ist besonders wütend, halte dich besser fern.
actors.mobs.bee.desc_honey=Trotz ihrer geringen Größe verteidigen Goldbienen ihr Nest sehr vehement. Diese hier ist besänftigt und scheint Ihnen folgen zu wollen.
actors.mobs.bee.discover_hint=Diese Figur ist mit einem bestimmten Gegenstand verbunden.
actors.mobs.bee.name=goldene Biene
actors.mobs.brute$bruterage.desc=Dieser Gnoll-Brutalo ist im Sterben, will dich aber mit in den Tod reißen! ZXQPH1 ZXQ ZXQ PH2 ZXQ Der Brutalo stirbt, sobald sein Schutz nachlässt, entweder durch Zeitablauf oder wenn er Schaden erleidet. In der Zwischenzeit verursacht er deutlich mehr Schaden, also sei vorsichtig! ZXQPH3 ZXQ ZXQ PH4 ZXQ Verbleibender Schutz: ZXQPH0 ZXQ.
actors.mobs.brute$bruterage.name=rohe Wut
actors.mobs.brute.def_verb=blockiert
actors.mobs.brute.desc=Brutalos sind die größten, stärksten und zähesten aller Gnolle. Werden sie schwer verwundet, geraten sie in Raserei und fügen ihren Feinden noch mehr Schaden zu.
actors.mobs.brute.enraged=wütend
actors.mobs.brute.name=Gnoll-Brutalo
actors.mobs.causticslime.desc=Dieser Schleim scheint von der dunklen Magie aus der Tiefe verdorben zu sein. Er hat seine gewohnte grüne Farbe verloren und tropft von ätzendem Schleim.
actors.mobs.causticslime.discover_hint=Diesen Gegner findet man nur selten in einem bestimmten Bereich des Dungeons.
actors.mobs.causticslime.name=ätzender Schleim
actors.mobs.crab.desc=Diese riesigen Krabben stehen an der Spitze der Nahrungskette in der Kanalisation. Sie sind extrem schnell und ihr dicker Panzer hält selbst heftigen Schlägen stand.
actors.mobs.crab.name=Kanalisationskrabbe
actors.mobs.crystalguardian.def_verb=blockiert
actors.mobs.crystalguardian.desc=Diese großen Kristallwächter sähen fast wie Statuen aus, wären da nicht ihre hell leuchtenden Augen. Das gehärtete Kristall, aus dem sie bestehen, macht sie zwar träge, aber extrem widerstandsfähig. Daher ist es ratsam, sie so lange wie möglich in ihrem Kristallnest schlafen zu lassen. Aufgrund ihrer Größe bewegen sich Kristallwächter in geschlossenen Räumen deutlich langsamer. Sie sind außerdem so widerstandsfähig, dass sie praktisch nicht sofort getötet werden können. Man kann sie zwar besiegen und vorübergehend außer Gefecht setzen, aber sie stehen nach kurzer Zeit wieder auf.
actors.mobs.crystalguardian.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.crystalguardian.name=Kristallwächter
actors.mobs.crystalmimic.ate=Der Mimik hat dein %s gefressen!
actors.mobs.crystalmimic.desc=Mimics sind magische Wesen, die jede beliebige Gestalt annehmen können. In Dungeons wählen sie fast immer die Form einer Schatztruhe, um ahnungslose Abenteurer anzulocken. Kristall-Mimics sind gerissener als ihre gewöhnlichen Verwandten und meiden Konflikte beim Stehlen von Beute. Sobald sie entdeckt werden, versuchen sie zu fliehen und können Gegner beim Angriff neu positionieren.
actors.mobs.crystalmimic.escaped=Der Kristallnachahmer ist entkommen!
actors.mobs.crystalmimic.name=Kristallimitation
actors.mobs.crystalspire.alert=Die Vibrationen nehmen zu und hallen durch die ganze Höhle!
actors.mobs.crystalspire.desc=Diese gigantische Spitze aus extrem hartem Kristall ist vermutlich die Quelle all der seltsamen kristallinen Kreaturen in dieser Höhle. Deine normalen Waffen sind wirkungslos, also musst du deine Spitzhacke benutzen, wenn du sie zerstören willst. Stelle sicher, dass du gut vorbereitet bist, bevor du anfängst, sie abzubauen. Es wird wahrscheinlich eine Weile dauern, einen so großen Kristall abzubauen, und du wirst es vermutlich nicht ungestört schaffen. Die Spitze selbst könnte sogar über Verteidigungsmechanismen verfügen. Vielleicht lassen sich die Angriffe der Spitze gegen ihre eigenen Kreaturen einsetzen.
actors.mobs.crystalspire.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.crystalspire.name=Kristallspitze
actors.mobs.crystalspire.warning=Der Kristall vibriert, wenn man ihn anschlägt. Wenn man das fortsetzt, wird man unweigerlich Aufmerksamkeit auf sich ziehen...
actors.mobs.crystalwisp.beam_kill=Der Lichtstrahl hat dich getötet...
actors.mobs.crystalwisp.desc=Ein kleiner, wütender, schwebender Brocken aus gehärtetem Kristall, der hell leuchtet. Kristall-Irrlichter sind zwar nicht besonders stark, können aber bei freier Sicht einen schädlichen Lichtstrahl auf dich abfeuern. Sie sind klein genug, um sich problemlos durch die verschiedenen Kristallformationen zu bewegen, aber sie können nicht durch sie hindurchschießen.
actors.mobs.crystalwisp.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.crystalwisp.name=Kristallirschel
actors.mobs.demonspawner.desc=Dieses verzerrte Amalgam aus Zwergenfleisch ist dafür verantwortlich, aus den in dieser Region gefallenen Zwergen Ripperdämonen zu erschaffen. Offenbar schrecken die Dämonen nicht davor zurück, jede ihnen zur Verfügung stehende Ressource gegen ihre Feinde einzusetzen. Obwohl sie furchterregend aussehen, können sich Dämonenbrutstätten weder bewegen noch direkt verteidigen. Ihre beträchtliche Masse macht sie jedoch schwer zu töten, und sie erzeugen umso schneller Ripperdämonen, wenn sie bedroht werden. Dämonenbrutstätten scheinen mit einer zentralen Quelle dämonischer Macht verbunden zu sein. Ihre Vernichtung könnte diese schwächen.
actors.mobs.demonspawner.name=Dämonen-Spawner
actors.mobs.demonspawner.on_death=Die dämonische Energie scheint hier nachzulassen, wenn der Erzeuger stirbt.
actors.mobs.dm100.desc=Die DM-100 ist ein frühes Modell einer zwergischen „Verteidigungsmaschine“, die zum Schutz der Zwergenbergleute in den Höhlen unterhalb dieses Gefängnisses entwickelt wurde. Ihre elektrischen Schocks erwiesen sich jedoch als zu schwach, weshalb sie der darüberliegenden Menschenstadt geschenkt wurden. Jahrelang blieben sie ungenutzt und gelangten schließlich ins Gefängnis, wo der Gefängnisdirektor sie zunächst für zu grausam hielt. Als die Gefangenen jedoch immer unruhiger wurden, erwiesen sie sich als notwendig.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Der Blitzschlag hat dich getötet...
actors.mobs.dm200.desc=Die DM-200 ist die zweite Generation der zwergischen „Verteidigungsmaschinen“ und wurde zum Schutz der zwergischen Bergleute in den Höhlen und der darunterliegenden Stadt entwickelt. Sie ist deutlich größer und massiger als ihre Vorgänger und greift mit verheerenden hydraulischen Fäusten an. Ihre Größe ist zugleich ihre größte Schwäche, da sie nicht durch die engen Tunnel und Türen des Verlieses passt. Die Zwerge konnten die mangelnde Mobilität der DM-200 jedoch kompensieren, indem sie ihre giftigen Abgase auf entfernte oder unerreichbare Feinde abfeuerten.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Die DM-200 stößt einen Strahl giftiger Abgase aus!
actors.mobs.dm201.desc=Die Zwerge experimentierten kurzzeitig damit, die mangelnde Mobilität des DM-200 stärker zu betonen und entwickelten einige DM-Modelle, die völlig stationär sind. Der DM-201 ist ein umgebauter DM-200, der als Geschützturm ohne Bewegungsfähigkeit dient. Im Gegenzug für die fehlende Mobilität verfügt der DM-201 über deutlich höhere Widerstandsfähigkeit und Angriffskraft. Da der DM-201 keinen Motor besitzt, der Abgase abführt, rüsteten die Zwerge ihn stattdessen mit ätzenden Gasgranaten aus! Der DM-201 geht jedoch vorsichtig mit diesen Granaten um und wirft sie nur, wenn er aus der Ferne angegriffen wird.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Die DM-201 wirft eine ätzende Granate!
actors.mobs.dm300.charge_lost=Strommast zerstört! Rückkehr zur lokalen Stromversorgung!
actors.mobs.dm300.charging=BESCHÄDIGUNG ERHALTEN! STROMPYLON AKTIVIEREN!
actors.mobs.dm300.charging_hint=DM-300 ist unverwundbar, solange es von einem Strommast mit Energie versorgt wird!
actors.mobs.dm300.def_verb=blockiert
actors.mobs.dm300.defeated=KRITISCHER SCHADEN! VERSUCH, DIE SCHÜTZE ZU LEISTEN
actors.mobs.dm300.desc=Diese Maschine wurde vor mehreren Jahrhunderten von den Zwergen gebaut. Später ersetzten sie ihre Maschinen durch Golems, Elementare und sogar Dämonen. Das führte schließlich zum Niedergang ihrer Zivilisation. Der DM-300 und ähnliche Maschinen wurden meist beim Bauen und im Bergbau eingesetzt, gelegentlich auch zur Verteidigung der Städte.
actors.mobs.dm300.desc_supercharged=DM-300 ist derzeit vollständig mit elektrischer Energie aufgeladen. In diesem Zustand ist DM-300 unverwundbar und bewegt sich mit doppelter Geschwindigkeit! Außerdem dreht sich sein Bohrer nun schnell genug, um sich durch festes Gestein zu graben, obwohl er sich dabei deutlich langsamer bewegt. DM-300 direkt anzugreifen ist sinnlos, solange er aufgeladen ist, aber irgendetwas in der Umgebung muss ihm diese Energie liefern; dessen Zerstörung könnte ihn schwächen.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=UNBEFUGTES PERSONAL ERKANNT!
actors.mobs.dm300.pylons_destroyed=ALARM! INSTABILITÄT IM STROMNETZ ERKANNT!
actors.mobs.dm300.rankings_desc=Zerquetscht von der DM-300
actors.mobs.dm300.shield=Der DM-300 bezieht seinen Strom aus den freiliegenden Drähten und schirmt sich selbst ab!
actors.mobs.dm300.supercharged=ZERSTÖREN! ZERSTÖREN! ZERSTÖREN!
actors.mobs.dwarfking$dkghoul.rankings_desc=Gefallen vor dem König der Zwerge
actors.mobs.dwarfking$dkgolem.rankings_desc=Gefallen vor dem König der Zwerge
actors.mobs.dwarfking$dkmonk.rankings_desc=Gefallen vor dem König der Zwerge
actors.mobs.dwarfking$dkwarlock.rankings_desc=Gefallen vor dem König der Zwerge
actors.mobs.dwarfking.defeated=Du hast... uns alle verdammt...
actors.mobs.dwarfking.desc=Vor vielen Jahren entdeckte einer der mächtigsten Zauberer am Zwergenhof Geheimnisse, die ihm ungeheure Macht über Leben und Tod verliehen. Er nutzte diese Macht bald, unterwarf und korrumpierte seine Standesgenossen, seinen König und schließlich jeden einzelnen Zwergenbürger. Nun ist er König, Herrscher über eine Legion untoter Untertanen. Der Zwergenkönig ist ein aggressiver Feind, der versuchen wird, seine Gegner mit seiner Horde untoter Diener einzukreisen und zu überwältigen.
actors.mobs.dwarfking.enraged=Du kannst mich nicht töten, %s. ICH BIN UNSTERBLICH!
actors.mobs.dwarfking.lifelink_1=Ich brauche dein Wesen, Sklave!
actors.mobs.dwarfking.lifelink_2=Blute für mich, Sklave!
actors.mobs.dwarfking.losing=Nein! Das kannst du nicht tun... du hast keine Ahnung, was dich darunter erwartet...
actors.mobs.dwarfking.name=König der Zwerge
actors.mobs.dwarfking.notice=Wie kannst du es wagen! Du hast keine Ahnung, womit du dich da einmischst!
actors.mobs.dwarfking.rankings_desc=Gefallen vor dem König der Zwerge
actors.mobs.dwarfking.teleport_1=Kümmere dich um sie, Sklave!
actors.mobs.dwarfking.teleport_2=Halte sie beschäftigt, Sklave!
actors.mobs.dwarfking.wave_1=Genug! Erhebt euch, meine Sklaven!
actors.mobs.dwarfking.wave_2=Mehr! Blutet für euren König!
actors.mobs.dwarfking.wave_3=Nutzlos! TÖTET SIE JETZT!
actors.mobs.ebonymimic.desc=Mimics sind magische Wesen, die jede beliebige Gestalt annehmen können. In Dungeons wählen sie fast immer die Form einer Schatztruhe, um ahnungslose Abenteurer anzulocken. Ebenholz-Mimics sind heimtückische Mimics, die sich nahezu unsichtbar machen können. Sie lauern an Gegenständen, mit denen Abenteurer interagieren, und bergen selbst Beute. Sind sie erst einmal entdeckt, sind sie nicht stärker als gewöhnliche Mimics, doch ihr Überraschungsbiss ist verheerend.
actors.mobs.ebonymimic.discover_hint=Diesen Gegner kann man mit einem bestimmten Schmuckstück aufspüren.
actors.mobs.ebonymimic.hidden_desc=Da scheint etwas dran zu sein, aber es ist fast völlig durchsichtig.
actors.mobs.ebonymimic.hidden_name=verdächtige Kontur
actors.mobs.ebonymimic.name=Ebenholzimitat
actors.mobs.ebonymimic.reveal=Da war ein Imitator!
actors.mobs.elemental$chaoselemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn mächtige okkulte Magie nicht kontrolliert wird. Sie besitzen nur geringe Intelligenz und sind meist mit einer bestimmten Magieart verbunden. Chaos-Elementare sind seltene und gefährliche Wesen, die sich noch nicht auf ein bestimmtes Element festgelegt haben. Bei einem Angriff entfesseln sie wilde und unberechenbare Magie.
actors.mobs.elemental$chaoselemental.name=Chaos-Elementar
actors.mobs.elemental$fireelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn mächtige okkulte Magie nicht kontrolliert wird. Sie besitzen nur geringe Intelligenz und sind meist mit einer bestimmten Magieart verbunden. Feuerelementare sind eine häufige Art von Elementaren, die mit Feuermagie Schaden verursachen. Sie setzen ihr Ziel mit Nahkampfangriffen in Brand und können gelegentlich auch Feuerblitze verschießen.
actors.mobs.elemental$fireelemental.name=Feuerelementar
actors.mobs.elemental$frostelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn mächtige okkulte Magie nicht kontrolliert wird. Sie besitzen nur geringe Intelligenz und sind meist mit einer bestimmten Magieart verbunden. Frostelementare sind eine häufige Elementarart, die Feinde mit Kältemagie schwächt. Sie schwächen ihr Ziel mit Nahkampfangriffen und gelegentlich auch mit Fernkampfangriffen. Ihre Magie ist im Wasser deutlich wirksamer.
actors.mobs.elemental$frostelemental.name=Frostelementar
actors.mobs.elemental$newbornfireelemental.charging=Das Elementarwesen lädt sich auf!
actors.mobs.elemental$newbornfireelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn mächtige okkulte Magie nicht richtig kontrolliert wird. Elementare besitzen nur geringe Intelligenz und sind üblicherweise mit einer bestimmten Art von Magie verbunden. Dieser Feuerelementar ist frisch beschworen, aber dennoch ziemlich gefährlich!
actors.mobs.elemental$newbornfireelemental.desc_ally=Da dieses Elementarwesen durch einen Zauber beschworen wurde, hat es etwas mehr Kontrolle über seine Flamme. Es kann keine Fernangriffe ausführen, aber Gegner, die es im Nahkampf angreift, werden in Brand gesetzt.
actors.mobs.elemental$newbornfireelemental.desc_boss=Aufgrund der chaotischen Natur seiner Beschwörung kann dieses Elementarwesen erst nach einer Aufladerunde ungenaue Feuerstöße abgeben.
actors.mobs.elemental$newbornfireelemental.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.elemental$newbornfireelemental.name=neugeborenes Feuerelementar
actors.mobs.elemental$shockelemental.desc=Elementare sind chaotische Wesen, die oft entstehen, wenn mächtige okkulte Magie nicht kontrolliert wird. Sie besitzen nur geringe Intelligenz und sind meist mit einer bestimmten Magieart verbunden. Schockelementare sind eine seltenere Art von Elementaren, die ihre Feinde mit Elektrizität und Lichtblitzen schwächen. Im Nahkampf entladen sie Blitze auf nahe Gegner und verursachen Bonusschaden an ihrem Hauptziel, wenn dieses sich im Wasser befindet. Gelegentlich bündeln sie auch einen Lichtstrahl auf ihr Ziel und blenden es kurzzeitig.
actors.mobs.elemental$shockelemental.name=Schockelementar
actors.mobs.eye.deathgaze_kill=Der Todesblick hat dich getötet...
actors.mobs.eye.desc=Dieser Dämon wird auch „Kugel des Hasses“ genannt. Sobald er einen Feind sieht, setzt er seinen Todesblick rücksichtslos ein und verletzt dabei oft auch seine eigenen Verbündeten.
actors.mobs.eye.name=böses Auge
actors.mobs.fetidrat.desc=Mit dieser Ratte stimmt eindeutig etwas nicht. Ihr fettiges, schwarzes Fell und die verrottende Haut unterscheiden sich stark von den gesunden Ratten, die Sie bisher gesehen haben. Ihre hellgrünen Augen lassen sie besonders bedrohlich wirken. Die Ratte verströmt einen widerlichen Gestank, der aus der Nähe unerträglich stark ist. Dunkler Schleim tropft aus dem Maul der Ratte; er frisst sich durch den Boden, scheint sich aber in Wasser aufzulösen.
actors.mobs.fetidrat.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.fetidrat.name=stinkende Ratte
actors.mobs.fungalcore.desc=Dieser gigantische Pilz muss die Quelle aller Pilzaktivitäten in dieser Höhle sein.
actors.mobs.fungalcore.name=Pilzkern
actors.mobs.fungalsentry.desc=Dieser besonders hohe Pilz dient als Verteidigungspunkt für das größere Pilznetzwerk in dieser Höhle. Er ist unbeweglich, feuert aber präzise Giftstöße auf alles ab, was in sein Sichtfeld gerät. Obwohl die Wirkung dieser Stöße relativ schwach ist, können sie sich sehr schnell zu tödlichen Giftmengen summieren. Man kann ihn zwar töten, aber es ist ratsam, ihm aus dem Weg zu gehen.
actors.mobs.fungalsentry.name=Pilzwächter
actors.mobs.fungalspinner.desc=Dieser Höhlenspinner scheint von einem parasitären Pilz kontrolliert zu werden. Der Pilz hat seine Fähigkeiten verändert und seine Spinnweben und Giftsäcke durch Pilzbewuchs ersetzt. Der Pilzspinner spuckt nun Pflanzen statt Spinnweben, breitet Pilzvegetation aus und kann dich möglicherweise festsetzen. Er kann zwar nicht vergiften, erhält aber eine deutlich höhere Schadensresistenz, wenn er sich in der Nähe von Pilzen befindet.
actors.mobs.fungalspinner.name=Pilzspinner
actors.mobs.ghoul.desc=Als die Zwergengesellschaft langsam zu zerfallen begann und der damalige Zwergenkönig die absolute Macht an sich riss, wurden die Schwachen und Widersacher schlecht behandelt. Mit zunehmender Meisterschaft in der dunklen Magie unterwarf er die Zwerge seinem Willen, und nun bilden sie die Fußsoldaten seiner Armee. Ghule sind einzeln nicht besonders stark, reisen aber stets in Gruppen und sind in großer Zahl deutlich schwerer zu töten. Wird ein Ghul besiegt, erhebt er sich nach einigen Runden wieder, sofern sich ein anderer Ghul in der Nähe befindet.
actors.mobs.ghoul.name=Zwergenghul
actors.mobs.gnoll.desc=Gnolle sind hyänenartige Humanoide. Sie leben in Abwasserkanälen und Verliesen und wagen sich gelegentlich an die Oberfläche, um Beutezüge zu unternehmen. Gnoll-Späher sind feste Mitglieder ihres Rudels; sie sind weder so stark wie Grobiane noch so intelligent wie Schamanen.
actors.mobs.gnoll.name=Gnoll-Späher
actors.mobs.gnollexile.desc=Dieser graufellige Gnoll trägt ein großes Mal auf der Schulter, das ihn als Verbannten kennzeichnet. Gnolle werden üblicherweise aus ihrer Gesellschaft verbannt, weil sie Befehle missachten oder Gesetze brechen. Verbannte müssen stark und klug sein, um zu überleben; dieser hier scheint den Speer, den er trägt, gut zu beherrschen.
actors.mobs.gnollexile.desc_aggro=Der verbannte Gnoll blickt sich wütend um. Offenbar hat ihn etwas doch zum Kampf bewogen. Vorsicht vor dem Speer!
actors.mobs.gnollexile.desc_passive=Der verbannte Gnoll greift nicht an. Er wirkt nicht so aggressiv wie die anderen Gnolle hier und hält einen Kampf gegen dich wahrscheinlich nicht für lohnenswert. Du könntest ihn einfach vorbeiziehen lassen, aber er hat einen Rucksack, der möglicherweise nützliche Gegenstände enthält …
actors.mobs.gnollexile.name=Gnoll-Exil
actors.mobs.gnollexile.seen_aggro=Der speerbewehrte Gnoll setzt zum Angriff an!
actors.mobs.gnollexile.seen_passive=Der speertragende Gnoll beäugt dich misstrauisch, rührt sich aber nicht, um anzugreifen.
actors.mobs.gnollgeomancer.alert=Der Geomant erwacht! Die gesamte Höhle scheint sich zu verschieben, als er unter wahnsinnigem Lachen davonspringt!
actors.mobs.gnollgeomancer.desc=Dieser beeindruckend große, ältere Gnoll muss die Quelle der hier wirkenden, erdbebenverursachenden Magie und der Organisator aller Gnoll-Aktivitäten sein. Anders als die Gnoll-Sprengmeister in der Gegend ist der Geomant äußerst geschickt in seiner Magie und kann durch geworfene oder herabfallende Steine nicht verletzt werden. Im Nahkampf ist er jedoch machtlos.
actors.mobs.gnollgeomancer.desc_armor=Der Geomant ist derzeit von einer Gesteinsrüstung umgeben. _Du musst nah herangehen und sie mit deiner Spitzhacke aufbrechen, bevor du den Geomanten verletzen kannst._
actors.mobs.gnollgeomancer.desc_armor_sapper=Ein Gnoll-Sprengmeister in der Nähe hält ein Gerät, das die Steinrüstung des Geomanten verstärkt. Du kannst sie im Moment überhaupt nicht beschädigen!
actors.mobs.gnollgeomancer.desc_sleeping=Dieser beeindruckend große Gnoll-Schamane ist von einer Gesteinsschicht umgeben und wirkt fast wie eine Statue. Bei genauerem Hinsehen kann man beobachten, wie sich das Gestein magisch im Takt mit dem Atem des älteren Gnos bewegt. So eingeschlossen ist er unverwundbar und scheint ein Nickerchen im Erdreich zu genießen. Mit der Spitzhacke kann man die Gesteinsschichten wahrscheinlich durchbrechen, aber sei dir bewusst, dass du dann auf einen Kampf vorbereitet sein wirst. Der Geomant muss die Quelle der verschiedenen erdbebenartigen Magien hier und der Organisator aller Gnoll-Aktivitäten sein. Es wäre ratsam, die hier verstreuten Gnolle zu besiegen, bevor man gegen ihn kämpft.
actors.mobs.gnollgeomancer.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.gnollgeomancer.name=Gnoll-Geomant
actors.mobs.gnollgeomancer.rock_kill=Der umherfliegende Felsbrocken hat dich getötet...
actors.mobs.gnollgeomancer.rockfall_kill=Die herabfallenden Felsen haben dich getötet...
actors.mobs.gnollgeomancer.warning=Der Geomant erwacht. Sei bereit, bevor du fortfährst!
actors.mobs.gnollguard.def_verb=blockiert
actors.mobs.gnollguard.desc=Ein großer, robust wirkender Gnoll, bewaffnet mit Speer und Schild, aber ohne Helm. Diese Wachen sind vermutlich Auszubildende, die gezwungen wurden, die Mine vor eindringenden Wildtieren zu schützen. Der Gnoll ist stark genug, den Speer einhändig zu führen, kann ihn aber nicht besonders gut einsetzen. Er benötigt relativ viel Freiraum, um aus der Ferne anzugreifen, und richtet deutlich weniger Schaden an, wenn man ihm zu nahe kommt.
actors.mobs.gnollguard.desc_armor=Ein Gnoll-Sprengmeister in der Nähe hält ein Gerät, das diesem Wächter eine irdene Rüstung verleiht und so den erlittenen Schaden erheblich reduziert.
actors.mobs.gnollguard.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.gnollguard.name=Gnollwächter
actors.mobs.gnollguard.spear_warn=Der Gnoll versetzt seinem Speer einen vernichtenden Hieb!
actors.mobs.gnollsapper.desc=Ein kleiner, schwacher, aber intelligenter Gnoll mit hellem Fell und einem Beutel voller allerlei Apparaturen. Wahrscheinlich helfen sie hier bei der Suche und dem Abbau von dunklem Gold und werden von einem Wächter in der Nähe beschützt. Sie können zwar kämpfen, aber ihre Angriffe sind kläglich schwach, nicht stärker als die eines Gnoll-Spähers. Anstatt direkt zu kämpfen, nutzen die Pioniere lieber ihre Apparaturen, um die felsige Umgebung für sich angreifen zu lassen. Da sie selbst keine Erdbewegungsmagie beherrschen, setzen sie ihre Apparaturen wahrscheinlich leichtsinnig ein. Es dürfte viele Möglichkeiten geben, ihre Angriffe gegen sie oder ihren Wächter zu verwenden.
actors.mobs.gnollsapper.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.gnollsapper.name=Gnoll-Sprengmeister
actors.mobs.gnolltrickster.desc=Ein seltsam anmutendes Wesen, selbst für Gnoll-Verhältnisse. Es beugt sich mit einem boshaften Grinsen nach vorn und hält den über der Schulter hängenden Beutel fast wie ein Arm. Seine Augen sind weit aufgerissen, ein seltsamer Ausdruck von Angst und Aufregung. In seinem Beutel befindet sich eine große Sammlung schlecht gefertigter Pfeile, die alle mit verschiedenen giftigen Substanzen präpariert zu sein scheinen.
actors.mobs.gnolltrickster.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.gnolltrickster.name=Gnoll-Schwindler
actors.mobs.goldenmimic.desc=Mimics sind magische Wesen, die jede beliebige Gestalt annehmen können. In Dungeons wählen sie fast immer die Form einer Schatztruhe, um ahnungslose Abenteurer anzulocken. Goldene Mimics sind besonders zäh und versuchen, die stärksten Abenteurer anzulocken. Sie besitzen wertvollere Beute, sind aber auch deutlich stärker als gewöhnliche Mimics.
actors.mobs.goldenmimic.name=goldener Mimik
actors.mobs.golem.def_verb=blockiert
actors.mobs.golem.desc=Die Zwerge versuchten, ihr Wissen über Maschinen mit ihrer neuen Kunst der Elementarbindung zu verbinden. Sie gaben den mechanischen Körpern der Golems Erdgeister als „Seele“, weil diese als besonders fügsam galten. Doch schon der kleinste Fehler im Ritual konnte sie außer Kontrolle geraten lassen.
actors.mobs.golem.name=Golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=gluck... gluck...
actors.mobs.goo.desc=Über Goo ist wenig bekannt. Vielleicht ist es nicht einmal ein Lebewesen, sondern nur eine Ansammlung von Stoffen aus der Kanalisation, die einen Hauch von eigenem Willen entwickelt hat.
actors.mobs.goo.enraged=wütend
actors.mobs.goo.gluuurp=Glucks!
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Die Flüssigkeit pumpt sich selbst auf!
actors.mobs.goo.rankings_desc=Vom Schleim absorbiert
actors.mobs.greatcrab.def_verb=blockiert
actors.mobs.greatcrab.desc=Diese Krabbe ist gigantisch, selbst im Vergleich zu anderen Kanalisationskrabben. Ihr blauer Panzer ist rissig und mit Seepocken bewachsen, was auf ein hohes Alter hindeutet. Schwerfällig watschelt sie umher und kann mit ihrer gewaltigen Schere kaum das Gleichgewicht halten. Obwohl die Krabbe nur eine Schere besitzt, gleicht ihre Größe dies mühelos aus. Sie hält die Schere vor jede Bedrohung und schützt sich hinter einem undurchdringlichen Panzer. Allerdings kann sie Angriffe, die sie nicht kommen sieht, oder Angriffe von mehreren Feinden gleichzeitig nicht abwehren.
actors.mobs.greatcrab.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.greatcrab.name=Riesenkrabbe
actors.mobs.greatcrab.noticed=Die Krabbe blockt mit ihrer massiven Schere.
actors.mobs.guard.def_verb=blockiert
actors.mobs.guard.desc=Einst die Wächter des Gefängnisses, unterscheiden sich diese Wachen längst nicht mehr von den Insassen. Sie schlurfen wie Zombies, hirnlos durch die Gänge auf der Suche nach allem, was nicht dorthin gehört – genau wie du! Sie tragen Ketten an der Hüfte, vermutlich um Feinde heranzuziehen.
actors.mobs.guard.name=Gefängniswärter
actors.mobs.guard.scorpion=Komm her!
actors.mobs.hermitcrab.def_verb=blockiert
actors.mobs.hermitcrab.desc=Aus irgendeinem Grund hat diese Kanalisationskrabbe beschlossen, den zerbrochenen oberen Teil eines Fasses auf dem Kopf zu tragen! Das zusätzliche Gewicht hat sie zwar auf normale Geschwindigkeit verlangsamt, ihr aber auch deutlich mehr Schutz gegeben. Man könnte fast meinen, etwas im Fass herumklappern zu hören …
actors.mobs.hermitcrab.name=Einsiedlerkrebs
actors.mobs.mimic.desc=Mimics sind magische Wesen, die jede beliebige Gestalt annehmen können. In Dungeons wählen sie fast immer die Form einer Schatztruhe, um ahnungslose Abenteurer anzulocken. Mimics haben einen schmerzhaften Biss, bergen aber oft mehr Schätze als eine gewöhnliche Truhe.
actors.mobs.mimic.discover_hint=Diesen Gegner kann man überall im Dungeon finden.
actors.mobs.mimic.hidden_hint=Irgendwas an dieser Truhe wirkt seltsam... Hinzugehen und zu versuchen, sie zu öffnen, könnte eine schlechte Idee sein.
actors.mobs.mimic.name=Mimik
actors.mobs.mimic.reveal=Diese Truhe ist ein Mimikry!
actors.mobs.mob.died=Du hörst etwas in der Ferne sterben.
actors.mobs.mob.discover_hint=Diesen Gegner findet man in einem bestimmten Bereich des Dungeons.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Getötet von: %s
actors.mobs.monk$focus.desc=Dieser Mönch hat sein Ziel vollkommen im Visier und scheint dessen Züge vorauszusehen. Solange er konzentriert ist, wird der nächste physische Angriff gegen ihn garantiert fehlschlagen, egal unter welchen Umständen. Das Parieren dieses Angriffs verbraucht die Konzentration des Mönchs, die er für einen weiteren Angriff wieder aufbauen muss. Mönche regenerieren ihre Konzentration schneller, während sie sich bewegen.
actors.mobs.monk$focus.name=fokussiert
actors.mobs.monk.def_verb=blockiert
actors.mobs.monk.desc=Diese fanatischen Mönche haben sich dem Schutz der Geheimnisse ihrer Stadt vor allen Fremden verschrieben. Sie tragen weder Waffen noch Rüstung und verlassen sich ganz auf ihre Kunst des unbewaffneten Kampfes.
actors.mobs.monk.name=Zwergenmönch
actors.mobs.monk.parried=pariert
actors.mobs.necromancer$necroskeleton.desc=Dieses Skelett wurde von einem Nekromanten beschworen. Es verhält sich wie ein normales Skelett und stirbt, wenn der Nekromant, der es beschworen hat, getötet wird.
actors.mobs.necromancer$necroskeleton.name=Skelett eines Nekromanten
actors.mobs.necromancer.desc=Diese angehenden dunklen Magier sind in Scharen in das Gefängnis geströmt, da es der perfekte Ort ist, um ihre finsteren Künste zu üben. Nekromanten beschwören und stärken Skelette, die für sie kämpfen. Tötet man den Nekromanten, stirbt auch das von ihm beschworene Skelett.
actors.mobs.necromancer.name=Nekromant
actors.mobs.npcs.blacksmith.cant_enter_old=Dieser Bereich ist in diesem Spieldurchgang nicht zugänglich. Starte ein neues Spiel, um die neue Quest auszuprobieren!
actors.mobs.npcs.blacksmith.def_verb=blockiert
actors.mobs.npcs.blacksmith.desc=Dieser Trollschmied sieht aus wie alle Trolle: groß und schlank, und seine Haut ähnelt in Farbe und Beschaffenheit Stein. Der Trollschmied hantiert mit unverhältnismäßig kleinen Werkzeugen.
actors.mobs.npcs.blacksmith.enter_no=Noch nicht
actors.mobs.npcs.blacksmith.enter_yes=Ich bin bereit
actors.mobs.npcs.blacksmith.entrance_blocked=Der Weg nach unten ist versperrt.
actors.mobs.npcs.blacksmith.exit_no=Noch nicht
actors.mobs.npcs.blacksmith.exit_warn_crystal=Der riesige Kristall ist auch noch da unten. Ich zahle extra, wenn ihr ihn zerstört.
actors.mobs.npcs.blacksmith.exit_warn_full=Fertig? Du hast jede Menge Gold, aber achte darauf, dass du keine Ausrüstung vergessen hast. Denk dran: Sobald du oben bist, lasse ich dich nicht mehr rein.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Der Riesenpilz ist auch noch da unten. Ich zahle extra, wenn du ihn tötest.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Der Gnoll-Geomant ist auch noch da unten. Ich zahle extra, wenn du ihn tötest.
actors.mobs.npcs.blacksmith.exit_warn_high=Fertig? Du hast anscheinend schon einiges an Gold, aber ein bisschen mehr wäre gut. Du solltest 40 Stück bekommen. Denk dran: Sobald du oben bist, kommst du nicht mehr rein.
actors.mobs.npcs.blacksmith.exit_warn_low=Schon fertig? Sieht nicht so aus, als hättest du viel Gold. Du solltest 40 Stück bekommen können. Denk dran, wenn du oben bist, lasse ich dich nicht mehr rein.
actors.mobs.npcs.blacksmith.exit_warn_med=Fertig? Du hast zumindest etwas Gold, aber in der Mine ist definitiv noch mehr. Du solltest 40 Stück finden können. Denk dran: Sobald du oben bist, lasse ich dich nicht mehr rein.
actors.mobs.npcs.blacksmith.exit_warn_none=Schon fertig? Du hast ja kaum Gold! Du solltest 40 Stück bekommen. Denk dran, wenn du oben bist, lasse ich dich nicht mehr rein.
actors.mobs.npcs.blacksmith.exit_yes=Ich bin fertig
actors.mobs.npcs.blacksmith.get_lost=Ich bin beschäftigt. Verschwinde!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hey Mensch! Du siehst nach einem wichtigen Menschen aus.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Aber Vorsicht, die Mine ist gefährlich für einen kleinen Menschen wie dich. Sie ist schon eine Weile verlassen, und überall wachsen Kristalle. Sie glänzen, sind aber viel zu zerbrechlich, um etwas zu taugen, und werden von magischen Kräften beschützt. Sie sind ziemlich stark, also sei vorsichtig, wo du abbaust, sonst ziehst du ihre Aufmerksamkeit auf dich. Irgendwo gibt es auch einen riesigen Kristall. Der ist viel widerstandsfähiger, also sei auf einen Kampf gefasst, wenn du ihn zerbrichst. Ich wette aber, dass das Zerschlagen das Kristallwachstum verlangsamt, also zahle ich extra, wenn du es schaffst.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hey Mensch! Du siehst echt mutig aus.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Aber Vorsicht, die Mine ist gefährlich für einen kleinen Menschen wie dich. Dort unten wächst eine Art Pilzmonster. Es hat Pilzwächter, die tödlich sind, wenn sie dich sehen, aber zumindest können sie dich nicht verfolgen. Bleib außer Sichtweite, wenn du überleben willst. Ich zahle extra, wenn du es schaffst, den größten Pilz zu besiegen, aber das wird einiges an Mühe kosten. Er ist mit einer Menge Myzelknoten verbunden, die in den Wänden versteckt sind. Du musst die meisten davon zerstören, bevor du ihm wirklich Schaden zufügen kannst.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Aber Vorsicht, die Mine ist gefährlich für einen kleinen Menschen wie dich. Ein paar Gnolle wollen auch das Gold und verwüsten jetzt alles. Sie sind dumme Viecher, deshalb hat ihr Abbau alle möglichen Einstürze und Höhlen verursacht. Du musst dich da durchgraben, also halte Ausschau nach frisch aufgewühltem Gestein. Ich glaube, einer der Gnolle macht den größten Ärger, wahrscheinlich ein Geomanten-Schamane oder so. Ich zahle extra, wenn du ihn findest und tötest, aber ich bin sicher, er wird sich wehren.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hey Mensch! Du scheinst ja ein flinker Kerl zu sein.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hey Mensch! Du siehst aus wie ein kluger Kerl.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hey Mensch! Du siehst ganz schön hinterlistig aus.
actors.mobs.npcs.blacksmith.intro_quest_start=Willst du nützlich sein, was? Ja, ich hätte da was für dich. Ich hab diese Werkstatt über einer alten Mine gebaut, gleich da unten an der Leiter. Nimm die Spitzhacke und bau mir etwas Dunkelgolderz ab. 40 Stück sollten reichen. Das Gestein da unten ist schön weich, also kannst du dich mit etwas Mühe durch die Wände graben. Was meinst du, wie soll ich bezahlen? Du bist gierig... Okay, okay, ich kann dir was schmieden. Sei froh, ich bin der einzige Schmied weit und breit.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hey Mensch! Du siehst nach einem harten Kerl aus.
actors.mobs.npcs.blacksmith.lost_pick=Willst du mich veräppeln? Wo ist meine Spitzhacke?!
actors.mobs.npcs.blacksmith.name=Trollschmied
actors.mobs.npcs.blacksmith.quest_start_prompt=Bist du bereit, abzutauchen? Sorg dafür, dass du noch Platz für das Gold hast. \n\n_Ich lasse dich da unten nur einmal im Stich!_
actors.mobs.npcs.blacksmith.reminder=Hast du meine Zeit verschwendet? Der Mineneingang ist dort drüben.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring mir so viel Gold wie möglich und versuche auch, den großen Kristall zu zerbrechen.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring mir so viel Gold wie möglich und versuche auch, den Riesenpilz zu töten.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bringt mir so viel Gold wie möglich und versucht auch, den Gnoll-Geomanten zu töten.
actors.mobs.npcs.ghost.crab_1=Hallo %s... Einst war ich wie du – stark und selbstbewusst... Doch ein uraltes Wesen tötete mich... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich Rache genommen habe... Erlege die _große Krabbe_, die mir das Leben genommen hat... \n\n Sie ist unnatürlich alt... Mit einer gewaltigen Schere und einem dicken Panzer... _Hüte dich vor ihrer Schere, du musst die Krabbe überraschen, sonst blockt sie damit..._
actors.mobs.npcs.ghost.crab_2=Bitte... Hilf mir... Besiege das Krustentier...\n\n_Es wird dich immer blockieren... sobald es dich kommen sieht..._
actors.mobs.npcs.ghost.desc=Der Geist ist kaum zu erkennen. Er sieht aus wie ein formloser, schwacher Lichtfleck mit einem traurigen Gesicht.
actors.mobs.npcs.ghost.find_me=Danke... komm und such mich...
actors.mobs.npcs.ghost.gnoll_1=Hallo %s... Einst war ich wie du – stark und selbstbewusst... Doch ein hinterlistiger Feind tötete mich... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich Rache genommen habe... Töte den _Gnoll-Trickser_, der mir das Leben genommen hat... \n\n Er ist anders als die anderen Gnolle... Er versteckt sich und benutzt Wurfwaffen... _Hütet euch vor seinen giftigen und brennenden Pfeilen, greift ihn nicht aus der Ferne an..._
actors.mobs.npcs.ghost.gnoll_2=Bitte... Hilf mir... Besiege den Trickster...\n\n_Lass dich nicht treffen... Geh ihm nahe..._
actors.mobs.npcs.ghost.name=trauriger Geist
actors.mobs.npcs.ghost.rat_1=Hallo %s... Einst war ich wie du – stark und selbstbewusst... Doch ein abscheuliches Biest tötete mich... Ich kann diesen Ort nicht verlassen... Nicht, bevor ich Rache genommen habe... Töte die _stinkende Ratte_, die mir das Leben genommen hat... \n\n Sie streift durch diese Etage... und verbreitet überall Dreck... _Hütet euch vor ihrer Gestankwolke und ihrem ätzenden Biss, die Säure löst sich in Wasser auf..._
actors.mobs.npcs.ghost.rat_2=Bitte... Hilf mir... Vernichte das Ungeheuer...\n\n_Kämpfe in der Nähe von Wasser... Vermeide den Gestank..._
actors.mobs.npcs.imp.cya=Wir sehen uns, %s!
actors.mobs.npcs.imp.desc=Kobolde sind niedere Dämonen. Sie zeichnen sich weder durch Stärke noch durch magische Fähigkeiten aus, sind aber recht intelligent und gesellig. Viele Kobolde leben bevorzugt unter Nicht-Dämonen.
actors.mobs.npcs.imp.golems_1=In meinem Fall sind es die Golems, die vernichtet werden müssen. Ich möchte hier nämlich ein kleines Geschäft eröffnen, aber diese blöden Golems sind geschäftsschädigend! Es ist verdammt schwierig, mit diesen herumirrenden Granitklumpen zu verhandeln! Also bitte, töten Sie... sagen wir mal 4 von ihnen, und Sie erhalten eine Belohnung.
actors.mobs.npcs.imp.golems_2=Wie läuft deine Golem-Safari? Vergiss nur nicht, dir die Marken zu schnappen.
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.intro=Bist du ein Abenteurer? Ich liebe Abenteurer! Auf sie ist immer Verlass, wenn es darum geht, jemanden zu töten, oder? Natürlich gegen eine Belohnung ;)
actors.mobs.npcs.imp.monks_1=In meinem Fall sind es die Mönche, die getötet werden müssen. Ich möchte hier nämlich ein kleines Geschäft eröffnen, aber diese Verrückten kaufen selbst nichts und vergraulen andere Kunden. Also bitte töten Sie... sagen wir mal 5 von ihnen, und Sie erhalten eine Belohnung.
actors.mobs.npcs.imp.monks_2=Oh, du lebst ja noch! Ich wusste, dass dein Kung-Fu stärker sein würde ;) Vergiss nur nicht, dir die Jetons zu schnappen.
actors.mobs.npcs.imp.name=ehrgeiziger Kobold
actors.mobs.npcs.impshopkeeper.buyback=Der Kobold gibt Ihnen Ihren Gegenstand fröhlich zurück.
actors.mobs.npcs.impshopkeeper.desc=Der Kobold hat am Rande der inneren Hallen einen kleinen Laden eröffnet. Es ist schön, ein bekanntes Gesicht zu sehen, aber seine Preise scheinen alles andere als günstig zu sein.
actors.mobs.npcs.impshopkeeper.greetings=Hallo, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Was hast du gemacht, %s? Schnell einkaufen, ich muss hier weg!
actors.mobs.npcs.impshopkeeper.name=ehrgeiziger Kobold
actors.mobs.npcs.impshopkeeper.thief=Ich dachte, ich könnte dir vertrauen!
actors.mobs.npcs.mirrorimage.desc=Diese Illusion sieht dir sehr ähnlich, ist aber blasser und zuckt ein wenig.
actors.mobs.npcs.mirrorimage.discover_hint=Diese Figur kann man mithilfe einer bestimmten Schriftrolle finden.
actors.mobs.npcs.mirrorimage.name=Spiegelbild
actors.mobs.npcs.npc.discover_hint=Diesen Charakter findet man in einem bestimmten Bereich des Dungeons.
actors.mobs.npcs.prismaticimage.desc=Diese schimmernde Illusion ähnelt dir sehr und scheint sogar deine aktuelle Waffe und Rüstung zu tragen. Prismatische Bilder versuchen, die Aufmerksamkeit von Feinden auf sich zu ziehen und dich mit ihrer erhöhten Verteidigung und Gesundheit zu schützen. Obwohl sie nicht die gleiche Angriffskraft wie Spiegelbilder besitzen, sind sie widerstandsfähiger und profitieren von deiner Rüstung. Wenn ihre Lebenspunkte auf 0 sinken, verschwinden prismatische Bilder über mehrere Runden und können währenddessen geheilt werden. Sind keine Feinde anwesend, verschwinden prismatische Bilder und kehren zu ihrem Meister zurück.
actors.mobs.npcs.prismaticimage.discover_hint=Diese Figur kann man mithilfe einer bestimmten Schriftrolle finden.
actors.mobs.npcs.prismaticimage.name=prismatisches Bild
actors.mobs.npcs.ratking.confused=Was... Wo bin ich? Mein Königreich braucht mich!
actors.mobs.npcs.ratking.crown_after=Gefällt dir deine neue Rüstung? Kein Zurück!
actors.mobs.npcs.ratking.crown_clothes=Zieh dir was an! Du bist nicht in der Verfassung, mit dem Königshaus zu reden!
actors.mobs.npcs.ratking.crown_desc=Oh, ist diese Krone für mich?! Sie glänzt viel mehr als meine, also nehme ich sie dankend an! Tatsächlich glaube ich, dass ich dir als Belohnung für diese Krone etwas anbieten kann. Eine gewaltige Macht, die einem Helden wie dir würdig ist! Möchtest du das?
actors.mobs.npcs.ratking.crown_fine=Na gut! Ich wollte es ja sowieso nicht...
actors.mobs.npcs.ratking.crown_info=Erzähl mir erst mehr.
actors.mobs.npcs.ratking.crown_no=Ich möchte es lieber nicht...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, danke! Jetzt geh und mach deinen König stolz!
actors.mobs.npcs.ratking.crown_yes=Natürlich!
actors.mobs.npcs.ratking.desc=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt eine winzige Krone auf dem Kopf.
actors.mobs.npcs.ratking.desc_birthday=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt einen winzigen grünen Partyhut anstelle ihrer üblichen Krone. Alles Gute zum Geburtstag, Rattenkönig!
actors.mobs.npcs.ratking.desc_crown=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt eine Zwergenkönigskrone auf dem Kopf.
actors.mobs.npcs.ratking.desc_winter=Diese Ratte ist etwas größer als eine gewöhnliche Beutelratte. Sie trägt ein kleines Festtagshütchen anstelle ihrer üblichen Krone. Frohe Feiertage!
actors.mobs.npcs.ratking.discover_hint=Diesen Charakter findet man am Ende eines bestimmten Abschnitts des Dungeons.
actors.mobs.npcs.ratking.name=Rattenkönig
actors.mobs.npcs.ratking.not_sleeping=Ich schlafe nicht!
actors.mobs.npcs.ratking.what_is_it=Was soll das? Ich habe keine Zeit für diesen Unsinn. Mein Königreich regiert sich nicht von selbst!
actors.mobs.npcs.sheep.baa!=Mäh!
actors.mobs.npcs.sheep.baa.=Mäh.
actors.mobs.npcs.sheep.baa...=Mäh...
actors.mobs.npcs.sheep.baa?=Mäh?
actors.mobs.npcs.sheep.def_verb=blockiert
actors.mobs.npcs.sheep.desc=Das ist ein magisches Schaf. Was ist so magisch daran? Man kann es nicht töten. Es steht einfach da, bis es sich auf magische Weise auflöst, und kaut dabei mit leerem Blick wieder.
actors.mobs.npcs.sheep.discover_hint=Diesen Charakter findet man bei einem bestimmten Gegenstand oder einer bestimmten Falle.
actors.mobs.npcs.sheep.name=Schaf
actors.mobs.npcs.shopkeeper.buyback=Der Ladenbesitzer gibt Ihnen Ihren Artikel widerwillig zurück.
actors.mobs.npcs.shopkeeper.desc=Dieser stämmige Kerl wirkt eher wie jemand, der in ein Geschäftsviertel einer Großstadt passt als in ein Verlies. Seine Preise erklären, warum er es vorzieht, hier Geschäfte zu machen.
actors.mobs.npcs.shopkeeper.flee=Der Ladenbesitzer flieht!
actors.mobs.npcs.shopkeeper.name=Ladenbesitzer
actors.mobs.npcs.shopkeeper.sell=Verkaufe einen Artikel
actors.mobs.npcs.shopkeeper.talk=Sprechen
actors.mobs.npcs.shopkeeper.talk_ascent=Ich weiß nicht, was du mit dem Amulett vorhast, aber ich will damit nichts zu tun haben. Kauf dir was und geh weiter, wir müssen beide hier weg!
actors.mobs.npcs.shopkeeper.talk_caves=Gib Geld aus, lebe länger. Oh, und grüß den Trollschmied von mir, falls du ihn siehst. Erinner den Trottel daran, dass er mir immer noch Geld für den Hammer schuldet, den ich ihm letzte Woche verkauft habe!
actors.mobs.npcs.shopkeeper.talk_city=Meine Waren können euch hier unten schützen. \n\n... Und bitte, lungert nicht herum. Es hat ewig gedauert, bis die Einheimischen mich hier in Ruhe gelassen haben, ich will nicht, dass ihr Ärger bekommt!
actors.mobs.npcs.shopkeeper.talk_halls=Hey, ich hab Sonderpreise für Dämonenjäger! \n\n Oh, und sei vorsichtig da unten! Den Dämonen ist es egal, wie mutig du bist. Du kannst nicht wieder hochkommen und mehr Geld ausgeben, wenn du tot bist! ;) \n\n Sind die Dämonen wie ich? Hehe, überhaupt nicht. Ich bin nur ein kleiner Kerl, kein großer Kämpfer, und ich habe es geschafft, meinen Verstand zu bewahren. Die Dämonen da unten sind viel stärkere Wesen, und sie wurden alle versklavt von... nun ja... sei einfach vorsichtig da unten.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nun, hallo Eure Hoheit, oder Eure Heiligkeit? Hehe, wie dem auch sei, dies ist nicht der richtige Ort für Sie. Viele wären sehr bestürzt, wenn Sie hier ums Leben kämen. Sie haben aber sicher etwas Geld, warum kaufen Sie nicht etwas, um das zu verhindern?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Na, wenn das nicht der reisende Held ist! Wenn du versuchst, eine andere Stadt zu retten, dann viel Glück, die Gefahren hier sind viel schlimmer als die von kleinen Banden. Ich bin sicher, du schaffst das besser als jeder andere, pass nur auf, dass du nicht direkt vor meinem Laden stirbst.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Du scheinst dich hier etwas verloren zu fühlen, meine Liebe. Enge Verliesgänge sind nicht so geräumig wie große Hallen oder die Wälder rund um die Stadt, oder? Hehe, ach, vergiss mein Geschwafel, warum kaufst du dir nicht etwas?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Ich habe alles, was Sie für ein erfolgreiches Abenteuer brauchen!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, ich glaube, ich habe irgendwo in der Stadt ein Fahndungsplakat mit deinem Namen gesehen. Bist du auf der Flucht? Ach, du bist unschuldig? Natürlich, natürlich … Keine Sorge, ich habe Besseres zu tun, als dich zu verpfeifen, aber vielleicht solltest du dir zur Sicherheit etwas kaufen?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Seid ihr von der Diebesgilde, um die Gegend zu säubern? Nein, nur zum Einkaufen? Na gut, dann erledigt doch trotzdem ein paar Monster, wenn ihr schon mal hier seid. Erwartet aber keinen Rabatt, ich zahle euch gutes Schutzgeld, und ihr haltet mich hier unten kaum in Sicherheit.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Das ist ja ein interessantes Siegel, die sind normalerweise noch ganz. Bist du etwa ein in Ungnade gefallener Held oder so? Nun, was auch immer du getan hast, geht mich nichts an, deine Münzen sind noch gültig.
actors.mobs.npcs.shopkeeper.thief=Dieb, Dieb!
actors.mobs.npcs.shopkeeper.warn=Pass auf! Ich warne dich nicht noch einmal.
actors.mobs.npcs.vaultlaser.desc=Diese Wache feuert in regelmäßigen Abständen Laser ab. _Da es sich hier nur um ein Testgebiet handelt, stellen die Laser keine Gefahr für Sie dar._
actors.mobs.npcs.vaultlaser.name=Tresor-Laserwache
actors.mobs.npcs.vaultsentry.desc=Diese Wache scannt die Umgebung nach einem festgelegten Muster. Da es sich hier nur um einen Testbereich handelt, wird die Wache nichts unternehmen, falls sie Sie erfasst.
actors.mobs.npcs.vaultsentry.name=Tresor-Scanner
actors.mobs.npcs.wandmaker.def_verb=blockiert
actors.mobs.npcs.wandmaker.desc=Der alte, aber rüstige Herr trägt einen leicht verwirrten Gesichtsausdruck. Er ist durch einen magischen Schild geschützt.
actors.mobs.npcs.wandmaker.intro_1=Ich bin hierher gekommen, um eine seltene Zutat für einen Zauberstab zu finden, aber ich habe mich verirrt und mein magischer Schutzschild wird schwächer. Ich muss bald aufbrechen, aber ich kann es nicht ertragen, ohne das zu gehen, wofür ich gekommen bin.
actors.mobs.npcs.wandmaker.intro_2=Wenn du mir das besorgen kannst, bezahle ich dich gerne mit einem meiner kunstvoll gefertigten Zauberstäbe! Ich habe zwei mitgebracht, du kannst dir also den aussuchen, der dir besser gefällt.
actors.mobs.npcs.wandmaker.intro_berry=Der alte Gefängniswärter dieses Gefängnisses hatte eine Rotbeerpflanze, und ich suche einen ihrer Samen. Die Pflanze ist wahrscheinlich inzwischen verwildert, daher könnte es schwierig werden, einen Samen zu bekommen. Ihr Garten müsste sich irgendwo hier befinden. Halte dich von ihren Ranken fern, wenn du unversehrt bleiben willst. Feuer zu benutzen mag verlockend sein, aber bitte tu es nicht, du würdest die Pflanze und ihre Samen zerstören.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, hallo Eure Hoheit! Welch eine angenehme Überraschung, Euch an einem so trostlosen Ort zu treffen! Ich möchte Euch nur ungern belästigen, aber ich hätte da vielleicht eine Aufgabe für Euch.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hallo, junge Dame! Welch eine angenehme Überraschung, in so einem trostlosen Ort einem Helden zu begegnen! Wenn Sie Lust haben, einem alten Mann zu helfen, hätte ich vielleicht eine Aufgabe für Sie.
actors.mobs.npcs.wandmaker.intro_dust=Ich suche Leichenstaub. Es ist eine besondere Art verfluchtes Knochenmehl, das man normalerweise an solchen Orten findet. Hier in der Nähe müsste es einen verbarrikadierten Raum geben; da findet man bestimmt etwas Staub. Aber Vorsicht, der Fluch im Staub ist ziemlich stark. Melde dich so schnell wie möglich, dann reinige ich ihn für dich.
actors.mobs.npcs.wandmaker.intro_ember=Ich suche nach frischen Glutresten eines neugeborenen Feuerelementars. Elementare erscheinen normalerweise, wenn ein Beschwörungsritual nicht kontrolliert wird. Suche dir also einfach ein paar Kerzen und einen Ritualplatz, dann kannst du bestimmt einen herbeirufen. Vermeide es aber, dich im Kampf einzukesseln, oder halte etwas zum Einfrieren bereit. Neugeborene Elementare sind ziemlich mächtig und unberechenbar, aber sie vertragen keine Kälte.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hallo, junge Dame! Ein freundliches Gesicht ist hier unten eine angenehme Überraschung, nicht wahr? Ich schwöre, ich habe Ihr Gesicht schon einmal gesehen, aber ich kann mich einfach nicht erinnern, woher... Ach, egal, wenn Sie auf der Suche nach Abenteuern sind, hätte ich vielleicht eine Aufgabe für Sie.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hallo %s! Ich habe gehört, es gab da wohl Ärger zwischen dir und dem Zaubererinstitut? Ach, egal, ich mochte diese Langweiler sowieso nie. Wenn du willst, hätte ich vielleicht eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_rogue=Oh je, du hast mich erschreckt! Ich kenne keinen Banditen von hier, der noch bei Verstand ist, also musst du von der Oberfläche kommen! Wenn du einem Fremden helfen willst, hätte ich vielleicht eine Aufgabe für dich.
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hallo! Welch eine angenehme Überraschung, in so einem trostlosen Ort einen Krieger aus dem Norden anzutreffen! Ihr müsst eine weite Reise hinter euch haben. Falls Ihr auf der Suche nach Abenteuern seid, hätte ich vielleicht eine Aufgabe für Euch.
actors.mobs.npcs.wandmaker.name=alter Zauberstabmacher
actors.mobs.npcs.wandmaker.reminder_berry=Hat es mit dem Rotberry-Samen %s geklappt? Suche nach einem Raum voller Vegetation.
actors.mobs.npcs.wandmaker.reminder_dust=Irgendwelche Ergebnisse mit Leichenstaub, %s? Halte Ausschau nach Barrikaden.
actors.mobs.npcs.wandmaker.reminder_ember=Hast du mit den Glutresten etwas erreicht, %s? Du musst vier Kerzen und den Ritualort finden.
actors.mobs.phantompiranha.desc=Phantompiranhas sind eine seltene Piranhaart mit magischen Fähigkeiten und einem unheimlich durchscheinenden Körper. Sie können sich teleportieren, wenn sie angegriffen werden, um entweder zu fliehen oder sich ihrem Feind schnell zu nähern! Obwohl sie lästige Gegner sind, ist ihr Fleisch aufgrund seiner magischen Eigenschaften sehr begehrt.
actors.mobs.phantompiranha.name=Phantom-Piranha
actors.mobs.phantompiranha.teleport_away=Der Phantom-Piranha teleportiert sich weg...
actors.mobs.piranha.desc=Diese fleischfressenden Fische werden speziell zum Schutz von Überschwemmungsgebieten gezüchtet. Ihr Biss ist tödlich, daher sollte man ihnen möglichst aus dem Weg gehen.
actors.mobs.piranha.discover_hint=Diesen Gegner kann man überall im Dungeon finden.
actors.mobs.piranha.name=Riesenpiranha
actors.mobs.pylon.desc_active=Ein Strommast dient der Regulierung der Stromversorgung der Maschinen in diesem Bereich. Der Mast ist derzeit stark aufgeladen; dies dürfte die Ursache für die Superladung von DM-300 sein! In diesem Zustand sind Masten zwar verwundbar, leiten aber im Uhrzeigersinn elektrische Entladungen zu benachbarten Zellen. Aufgrund ihrer massiven Metallkonstruktion sind Masten jedoch widerstandsfähig gegen größere Beschädigungen.
actors.mobs.pylon.desc_inactive=Ein Strommast, der dazu dient, die Elektrizität zu regulieren, die die Maschinen in diesem Bereich antreibt.\n\nDer Mast ist derzeit inaktiv und immun gegen Beschädigungen.
actors.mobs.pylon.name=Strommast
actors.mobs.rat.desc=Beutelratten sind aggressive, aber eher schwache Bewohner der Kanalisation. Ihr Biss ist schmerzhaft, aber nur in großer Zahl lebensbedrohlich.
actors.mobs.rat.name=Beutelratte
actors.mobs.ripperdemon.desc=Diese grauenhaften Kreaturen sind das Ergebnis der Nutzung der vielen Zwergenleichen in dieser Region durch dämonische Mächte. Ripper sind abgemagerte, grässliche Wesen, die Zwergen ähneln, aber zerfetzte Körper und lange, scharfe Knochenklauen besitzen. Ripperdämonen sind nicht besonders widerstandsfähig, aber agil und gefährlich. Sie können weite Sprünge machen, um ihre Ziele schnell zu erreichen und sie dann mit ihren Klauen aufzuspießen.
actors.mobs.ripperdemon.leap=Der Ripperdämon macht sich zum Sprung bereit!
actors.mobs.ripperdemon.name=Ripper-Dämon
actors.mobs.rotheart.desc=Die Frucht der Rotbeere ist einzigartig. Anstatt zu verrotten und Nährstoffe freizusetzen, wächst sie, härtet aus und umschließt den Samen. Sie schützt die inneren Organe, die im Inneren der Frucht heranwachsen. Diese riesige Kugel wird als Herz der ausgewachsenen Rotbeerpflanze bezeichnet.
actors.mobs.rotheart.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.rotheart.name=verfaultes Herz
actors.mobs.rotlasher.desc=Die Fäulnispeitsche ist Teil des Wurzelwerks einer ausgewachsenen Fäulnisbeere und zugleich deren wichtigste Verteidigungswaffe. Die Peitschen sind blind und im Boden verankert, greifen aber jede nahe Bedrohung nach kurzem Erfassen heftig an. Befinden sich keine Feinde in der Nähe, verharren sie regungslos und versuchen, sich in der umgebenden Vegetation zu tarnen.
actors.mobs.rotlasher.discover_hint=Diesen Gegner findet man im Rahmen einer bestimmten Quest.
actors.mobs.rotlasher.name=Rot-Lasher
actors.mobs.scorpio.desc=Diese riesigen, spinnenartigen Dämonenwesen meiden den Nahkampf und feuern lieber aus großer Entfernung lähmende, gezackte Stacheln ab.
actors.mobs.scorpio.name=Skorpion
actors.mobs.senior.desc=Diese fanatischen Mönche haben sich dem Schutz der Geheimnisse ihrer Stadt vor allen Fremden verschrieben. Sie tragen weder Waffen noch Rüstung und verlassen sich ganz auf ihre Kunst des unbewaffneten Kampfes.
actors.mobs.senior.name=hochrangiger Mönch
actors.mobs.shaman$blueshaman.spell_desc=Dieser Schamane trägt eine blaue Maske und wird Magie einsetzen, die den erlittenen Schaden vorübergehend erhöht.
actors.mobs.shaman$purpleshaman.spell_desc=Dieser Schamane trägt eine violette Maske und wird Magie einsetzen, die eure Treffsicherheit und Ausweichfähigkeit vorübergehend verringert.
actors.mobs.shaman$redshaman.spell_desc=Dieser Schamane trägt eine rote Maske und wird Magie einsetzen, die eure Angriffskraft vorübergehend schwächt.
actors.mobs.shaman.bolt_kill=Der magische Blitz hat dich getötet...
actors.mobs.shaman.desc=Die klügsten Gnolle können schamanische Magie erlernen. Gnollschamanen bevorzugen Kampfzauber, um ihre geringe Körperkraft auszugleichen. Sie setzen sie ohne Zögern gegen jeden ein, der ihre Stellung im Stamm infrage stellt.
actors.mobs.shaman.name=Gnoll-Schamane
actors.mobs.skeleton.def_verb=blockiert
actors.mobs.skeleton.desc=Skelette bestehen aus den Knochen unglücklicher Abenteurer und Bewohner des Dungeons. Böse Magie aus der Tiefe hat sie zum Leben erweckt. Haben sie genug Schaden erlitten, zerplatzen sie in einer Explosion aus Knochen.
actors.mobs.skeleton.explo_kill=Du wurdest durch die Explosion von Knochen getötet...
actors.mobs.skeleton.name=Skelett
actors.mobs.slime.def_verb=blockiert
actors.mobs.slime.desc=Schleime sind seltsame, leicht magische Wesen mit einem gummiartigen Körper und einem flüssigen Kern. Die Kanalisation der Stadt bietet ihnen reichlich Wasser und Nährstoffe. Aufgrund ihrer elastischen Außenmembran ist es schwierig, Schleimen mit einem einzigen Angriff mehr als 6 Schadenspunkte zuzufügen.
actors.mobs.slime.name=Schleim
actors.mobs.snake.desc=Diese riesigen Schlangen können Schlägen blitzschnell ausweichen und sind daher schwer zu treffen. Magische oder Überraschungsangriffe können sie jedoch unvorbereitet treffen. Man kann einen Überraschungsangriff ausführen, indem man angreift, während man sich außerhalb des Sichtfelds der Schlange befindet. Eine Möglichkeit ist, sich von einer Schlange durch einen Türrahmen verfolgen zu lassen und dann zuzuschlagen, sobald sie im Türrahmen verschwunden ist.
actors.mobs.snake.hint=Versuche, mit der Untersuchungsfunktion bei einer Schlange herauszufinden, wie du sie kontern kannst.
actors.mobs.snake.name=Abwasserschlange
actors.mobs.spectralnecromancer.desc=Während Skelette für Nekromanten unverzichtbar sind, bevorzugen manche andere, weniger körperlose Diener. Spektrale Nekromanten haben Geisterwesen zu ihren bevorzugten Dienern auserkoren! Einzelne Geisterwesen sind zwar nicht so stark wie Skelette, aber diese Nekromanten scheuen sich nicht, gleich mehrere von ihnen zu beschwören!
actors.mobs.spectralnecromancer.name=spektraler Nekromant
actors.mobs.spinner.desc=Diese grünlichen, haarigen Höhlenspinnen meiden den direkten Kampf. Sie warten lieber in sicherer Entfernung, während ihr Opfer im Netz festhängt und langsam an ihrem giftigen Biss stirbt.
actors.mobs.spinner.name=Höhlenspinner
actors.mobs.statue.def_verb=blockiert
actors.mobs.statue.desc=Man könnte meinen, es handele sich nur um eine weitere der leblosen Statuen dieses Verlieses, aber ihre rot leuchtenden Augen verraten sie.
actors.mobs.statue.desc_weapon=Während die Statue selbst aus Stein gefertigt ist, sieht das _%s_, das sie hält, echt aus.
actors.mobs.statue.discover_hint=Diesen Gegner kann man überall im Dungeon finden.
actors.mobs.statue.name=animierte Statue
actors.mobs.succubus.desc=Sukkuben sind Dämonen in Gestalt verführerischer Frauen mit einem leicht düsteren Aussehen. Ihre Magie kann einen Helden bezaubern, sodass er nichts mehr angreifen kann, bis der Zauber nachlässt.
actors.mobs.succubus.name=Sukkubus
actors.mobs.swarm.desc=Der tödliche Fliegenschwarm summt wütend. Jeder nichtmagische Angriff teilt ihn in zwei kleinere, aber ebenso gefährliche Schwärme.
actors.mobs.swarm.name=Schwarm von Fliegen
actors.mobs.tengu$bombability$bombblob.desc=Hier steigt eine Wolke aus überhitztem Rauch auf. Vorsicht, es wird explodieren!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Es klebt am Boden fest, man kann es nicht bewegen!
actors.mobs.tengu$bombability$bombitem.desc=Tengu hat hier eine seltsam aussehende Rauchbombe geworfen, aus der dichter, heißer Rauch quillt. Sie tickt laut, als würde sie einen Countdown bis zur Explosion herunterzählen! Die Bombe steckt fest im Boden, man kann sie also nicht aufheben.
actors.mobs.tengu$bombability$bombitem.name=Rauchbombe
actors.mobs.tengu$fireability$fireblob.desc=Tengu hat ein feines Pulver verstreut, das hier anscheinend Dampf aufnimmt, es wird sich gleich entzünden!
actors.mobs.tengu$shockerability$shockerblob.desc=Hier baut sich elektrische Energie auf, alles, was auf dieser Fliese steht, wird in der nächsten Runde einen Stromschlag bekommen!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Es produziert zu viel Strom, man kann es nicht anfassen!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu hat hier eine seltsame Maschine platziert, die anscheinend aus DM-100-Teilen besteht. Um die Maschine herum entladen sich ständig elektrische Funken, die einem vorhersehbaren Muster folgen. \n\n Bei all den Funken, die um sie herum entladen, kann man sie unmöglich aufheben.
actors.mobs.tengu$shockerability$shockeritem.name=Schocker
actors.mobs.tengu.defeated=Endlich frei...
actors.mobs.tengu.desc=Tengu gehören einem alten Assassinenclan gleichen Namens an. Sie sind für ihren ausgiebigen Einsatz von Shuriken und Fallen bekannt.
actors.mobs.tengu.interesting=Machen wir das Ganze interessant...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Erwischt, %s!
actors.mobs.tengu.notice_have=Ich habe dich jetzt, %s!
actors.mobs.tengu.rankings_desc=Ermordet von den Tengu
actors.mobs.thief.carries=Der Dieb trägt ein _%s._ Offensichtlich gestohlen.
actors.mobs.thief.desc=Obwohl diese Insassen frei herumlaufen, ist dieser Ort immer noch ihr Gefängnis. Mit der Zeit hat er ihnen sowohl ihren Verstand als auch ihre Freiheit geraubt. Vor langer Zeit haben diese verrückten Diebe und Banditen vergessen, wer sie sind und warum sie stehlen. Diese Feinde stehlen und fliehen eher, als dass sie kämpfen. Behalte sie im Auge, sonst siehst du deine Beute vielleicht nie wieder.
actors.mobs.thief.escapes=Der Dieb entkommt mit Ihrem %s!
actors.mobs.thief.name=verrückter Dieb
actors.mobs.thief.stole=Der Dieb hat dir %s gestohlen!
actors.mobs.tormentedspirit.desc=Gepeinigte Geister sind ansonsten gutmütige Geister, die von einem Fluch befallen wurden. Solange sie verflucht sind, greifen sie wie ein Gespenst an und sind zudem viel mächtiger! Es ist möglicherweise möglich, den Fluch zu brechen, indem man den richtigen Gegenstand in der Nähe des Geistes verwendet. Wenn der Fluch gebrochen ist, wird der Geist sicherlich dankbar sein...
actors.mobs.tormentedspirit.name=gequälter Geist
actors.mobs.tormentedspirit.thank_you=Danke schön...
actors.mobs.vaultrat.desc=Diese Ratte zeigt einige Verhaltensänderungen, um die neue KI der Vault-Gegner zu testen: \n_-_ Ihre Bewegungen sind durch Wände „hörbar“. \n_-_ Sie patrouilliert auf einem voreingestellten Pfad. \n_-_ Während sie patrouilliert, ist ihre Erfassungsreichweite hinter ihrer Bewegungsrichtung stark reduziert. \n_-_ Auch im Schlaf ist ihre Erfassungsreichweite reduziert. \n_-_ Sobald sie dich entdeckt, untersucht sie dich, bevor sie zur Jagd übergeht. Untersuchende Gegner bewegen sich auf dich zu, greifen aber nicht an und lassen sich leichter hinter Türen und Ecken abschütteln.
actors.mobs.warlock.bolt_kill=Der Schattenblitz hat dich getötet...
actors.mobs.warlock.desc=Als die Zwerge sich von der Technik den arkanen Künsten zuwandten, kamen Hexenmeister in der Stadt an die Macht. Sie begannen mit Elementarmagie, wechselten aber bald zur Dämonologie und Nekromantie.
actors.mobs.warlock.name=Zwergenhexenmeister
actors.mobs.wraith.desc=Ein Geistwesen ist der rachsüchtige Geist eines Sünders, dessen Grab geschändet wurde. Da es sich um ein ätherisches Wesen handelt, ist es mit einer gewöhnlichen Waffe sehr schwer zu treffen.
actors.mobs.wraith.discover_hint=Diesen Gegner kann man überall im Dungeon finden.
actors.mobs.wraith.name=Gespenst
actors.mobs.yogdzewa$larva.desc=Diese winzigen Geschöpfe von Yog-Dzewa sind einfache Diener, die leicht zu erschaffen sind. Einzeln sind sie zwar schwach, aber sie werden schnell beschworen und können in großer Zahl übermächtig werden.
actors.mobs.yogdzewa$larva.name=Gottes Larve
actors.mobs.yogdzewa$larva.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogdzewa.darkness=Die Dunkelheit rückt näher...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa ist ein Alter Gott, ein gewaltiges Ungeheuer, das in die Welten der Sterblichen eindringt und sie verschlingt, um sein endloses Wachstum zu nähren. Die Zwerge müssen die Aufmerksamkeit dieses kosmischen Schreckens auf sich gezogen haben, als sie mit dunkler Magie experimentierten, und versuchen seither, ihn einzudämmen. Yog-Dzewa stammt aus einer Dimension rohen magischen Chaos und kann seine wahre Gestalt nicht in diese Welt bringen. Stattdessen hat er Avatare erschaffen und dämonische Diener beschworen, die ihm hier gehorchen. Dieses riesige Auge ist der Brennpunkt von Yog-Dzewas Macht in dieser Welt. Obwohl das Auge selbst unbeweglich ist, kann es mächtige Strahlen dämonischer Magie abfeuern und eine Vielzahl von Dienern herbeirufen, die ihm beistehen.
actors.mobs.yogdzewa.desc_spawners=Du spürst, wie Wellen dämonischer Energie von den oberen Stockwerken zu deinen Augen strömen. Irgendetwas, das du dort oben am Leben gelassen hast, muss seine Kraft zurück nach Yog-Dzewa leiten. _Yog wird diese Energie nutzen, um noch mächtigere Diener zu beschwören!_
actors.mobs.yogdzewa.hope=DEINE HOFFNUNG IST EINE ILLUSION!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=ICH SEHE DICH.
actors.mobs.yogdzewa.rankings_desc=Verschlungen von Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Diese Faust besteht aus reiner Lichtenergie. Sie kann in jeder Runde mächtige Strahlen gleißenden Lichts abfeuern! Diese Strahlen blenden dich kurzzeitig und verursachen zusätzlich schweren Schaden. Die Faust kann die Arena außerdem kurzzeitig in blendendes Licht hüllen, um zu entkommen! Die Faust besitzt jedoch keine besonderen Fähigkeiten, die sie im Nahkampf einsetzen kann.
actors.mobs.yogfist$brightfist.name=helle Faust
actors.mobs.yogfist$brightfist.teleport=Die Faust teleportiert sich in einem Lichtblitz weg, der dich ernsthaft blendet!
actors.mobs.yogfist$burningfist.desc=Eine gewaltige Faust, von Feuer umhüllt. Ihre Finger knistern beim Schließen und lassen Glut auf den Boden rieseln.
actors.mobs.yogfist$burningfist.name=brennende Faust
actors.mobs.yogfist$darkfist.desc=Diese Faust besteht aus reiner dunkler Energie. Sie kann jede Runde mächtige Blitze dunkler Magie abfeuern! Diese Blitze schwächen eure Lichtquelle und verursachen zusätzlich schweren Schaden. Die Faust kann die Arena außerdem kurzzeitig in Dunkelheit hüllen, um zu entkommen! Die Faust besitzt jedoch keine besonderen Fähigkeiten, die sie im Nahkampf einsetzen kann.
actors.mobs.yogfist$darkfist.name=dunkle Faust
actors.mobs.yogfist$darkfist.teleport=Die Faust teleportiert sich in einer Explosion der Dunkelheit davon, die deine Lichtquelle auslöscht!
actors.mobs.yogfist$rottingfist.desc=Eine riesige Faust aus verwesendem Fleisch. Zwischen ihren Fingern sickert übler Schleim hervor und befleckt den Stein darunter.
actors.mobs.yogfist$rottingfist.name=verrottende Faust
actors.mobs.yogfist$rustedfist.desc=Diese Faust besteht aus lebendigem Metall. Sie ist eine gewaltige Masse aus sich ständig veränderndem Metall, die über mächtige Nahkampfangriffe verfügt und Ziele aus der Ferne schwer verletzen kann. Aufgrund ihrer enormen Masse erleidet die Faust jeden Schaden nicht sofort, sondern über einen längeren Zeitraum. Die Faust ist jedoch unflexibel und kann sich nicht durch enge Passagen bewegen. Obwohl sie langsam Schaden erleidet, erhöht sich der verzögerte Schaden bei mehreren Treffern.
actors.mobs.yogfist$rustedfist.name=verrostete Faust
actors.mobs.yogfist$soiledfist.desc=Diese Faust ist aus chaotischer Erdmagie geformt. Während sie sich bewegt, lässt sie ständig Vegetation um sich herum sprießen. Sie kann außerdem konzentrierte Erdstrahlen abfeuern, die ihr Ziel in schnell wachsenden Ranken und Wurzeln fangen! Die Faust bezieht ihre Kraft aus dieser Pflanzenwelt und ist widerstandsfähiger gegen Schaden, je mehr hohe oder gefurchte Vegetation sich in ihrer Nähe befindet!
actors.mobs.yogfist$soiledfist.name=beschmutzte Faust
actors.mobs.yogfist.desc=Diese Faust ist ein Aspekt von Yog-Dzewas Macht. Fäuste sind mit der Macht von Yog-Dzewa verbunden und werden vor jeglichem Schaden geschützt, wenn sie sich in der Nähe des Auges befinden.
actors.mobs.yogfist.invuln_warn=Die Faust ist unverwundbar, solange sie sich in der Nähe des Auges befindet!
actors.mobs.yogfist.rankings_desc=Verschlungen von Yog-Dzewa
actors.char.def_verb_evaded=ausgewichen
actors.char.enemy_hit=%s trifft dich
actors.char.enemy_missed=Du %2$s %1$ss Angriff
actors.char.hit=%s traf %s
actors.char.mob_missed=Angriff von %1$s %2$s %3$s
actors.char.out_of_paralysis=Der Schmerz riss %s aus der Lähmung.
actors.char.you_hit=Sie haben %s eingegeben
actors.char.you_missed=%1$s %2$s Ihr Angriff
actors.mobs.mob.fleeing=%s flieht
actors.mobs.mob.hunting=%s ist auf der Jagd
actors.mobs.mob.passive=%s ist passiv
actors.mobs.mob.sleeping=%s schläft
actors.mobs.mob.wandering=%s wandert
actors.mobs.elemental.desc=Umherziehende Feuerelementare entstehen als Nebenprodukt bei der Beschwörung mächtigerer Wesen. Ihre Natur ist so chaotisch, dass selbst der mächtigste Dämonologe sie nicht beherrschen kann.
actors.mobs.elemental.name=Feuerelementar
actors.mobs.king.desc=Der letzte Zwergenkönig kannte die Geheimnisse von Leben und Tod. Er überredete seinen Hofstaat zu einem Ritual, das ihnen ewige Jugend schenken sollte. Am Ende bekam nur er sie, zusammen mit einer Armee von Untoten.
actors.mobs.king.name=König der Zwerge
actors.mobs.npcs.bee.desc=Trotz ihrer geringen Größe verteidigen goldene Bienen ihren Herrn erbittert. Allerdings leben sie nicht lange.
actors.mobs.npcs.bee.name=goldene Biene
actors.mobs.shielded.desc=Brutalos sind die größten, stärksten und zähesten aller Gnolle. Werden sie schwer verwundet, geraten sie in Raserei und fügen ihren Feinden noch mehr Schaden zu.
actors.mobs.shielded.name=Brutalo mit Schild
actors.mobs.yog.desc=Yog-Dzewa ist ein Alter Gott, ein mächtiges Wesen aus den Reichen des Chaos. Vor einem Jahrhundert errangen die alten Zwerge nur knapp den Sieg über sein Dämonenheer, konnten den Gott selbst aber nicht töten. Stattdessen sperrten sie ihn in die Hallen unter ihrer Stadt, da sie ihn für zu schwach hielten, um jemals wieder aufzuerstehen.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s enthält ein _%s_. Offensichtlich gestohlen.
actors.buffs.armorevasion.name=Wendig
actors.mobs.king.defeated=Du kannst mich nicht töten. %s... Ich bin... unsterblich...
