actors.blobs.blizzard.desc=Hier tobt ein Schneesturm.
actors.blobs.blizzard.name=Schneesturm
actors.blobs.confusiongas.desc=Hier wirbelt eine Wolke aus Verwirrungsgas.
actors.blobs.confusiongas.name=Verwirrungsgas
actors.blobs.corrosivegas.desc=Hier wirbelt eine Wolke aus tödlichem, ätzendem Gas.
actors.blobs.corrosivegas.name=korrosives Gas
actors.blobs.electricity.desc=Hier sprüht ein elektrisches Feld hell Funken.
actors.blobs.electricity.name=Strom
actors.blobs.electricity.ondeath=Du warst zu Tode geschockt...
actors.blobs.electricity.rankings_desc=Stromschlag
actors.blobs.fire.desc=Hier wütet ein Feuer.
actors.blobs.fire.name=Feuer
actors.blobs.foliage.desc=Lichtstrahlen durchdringen die Dunkelheit des unterirdischen Gartens.
actors.blobs.foliage.name=Laub
actors.blobs.freezing.desc=Die Luft ist hier unnatürlich kalt.
actors.blobs.freezing.name=eisige Luft
actors.blobs.goowarn.desc=Hier wimmelt es von Flecken dunkler Energie!
actors.blobs.goowarn.name=Dunkle Energie
actors.blobs.inferno.desc=Hier wütet ein Inferno.
actors.blobs.inferno.name=Inferno
actors.blobs.paralyticgas.desc=Hier wirbelt eine Wolke aus lähmendem Gas.
actors.blobs.paralyticgas.name=Lähmungsgas
actors.blobs.regrowth.name=Nachwachsen
actors.blobs.sacrificialfire.desc=Hier befindet sich ein Altar, auf dem ein Opferfeuer brennt. Jedes Wesen, das hier getötet wird, wird den Geistern des Verlieses als Opfergabe dargebracht. Vielleicht wird eine Belohnung gewährt, wenn genügend Opfer dargebracht werden?
actors.blobs.sacrificialfire.name=Opferfeuer
actors.blobs.sacrificialfire.reward=Das Feuer lodert auf und erlischt dann wieder – und hinterlässt eine Belohnung!
actors.blobs.sacrificialfire.unworthy=Das Feuer verzehrt deine Opfergabe, aber verändert sich nicht.
actors.blobs.sacrificialfire.worthy=Das Feuer verzehrt deine Opfergabe und wird immer stärker.
actors.blobs.smokescreen.desc=Hier wirbelt eine dichte, schwarze Rauchwolke.
actors.blobs.smokescreen.name=Nebelwand
actors.blobs.stenchgas.desc=Hier wirbelt eine Wolke fauligen Gestanks.
actors.blobs.stenchgas.name=Stinkgas
actors.blobs.stormcloud.desc=Hier wirbelt eine Wolke aus aufsteigendem Wasserdampf.
actors.blobs.stormcloud.name=Gewitterwolken
actors.blobs.toxicgas.desc=Hier wirbelt eine grünliche Wolke aus giftigem Gas.
actors.blobs.toxicgas.name=giftiges Gas
actors.blobs.toxicgas.ondeath=Du bist an dem giftigen Gas gestorben...
actors.blobs.toxicgas.rankings_desc=Erstickt
actors.blobs.waterofawareness.desc=Die Macht des Wissens strahlt vom Wasser dieses Brunnens aus. Wer daraus trinkt, erkennt alle ausgerüsteten Gegenstände, deckt alle Flüche in seinem Inventar auf und enthüllt alle Gegenstände auf der aktuellen Ebene.
actors.blobs.waterofawareness.name=Wasser des Bewusstseins
actors.blobs.waterofawareness.procced=Beim ersten Schluck spürst du, wie Wissen in deinen Geist strömt.
actors.blobs.waterofhealth.desc=Von diesem Brunnen geht heilende Kraft aus. Wer von seinem Wasser trinkt, dessen Wunden werden geheilt, der Hunger gestillt und abgenutzte Gegenstände von Flüchen befreit.
actors.blobs.waterofhealth.name=Wasser der Gesundheit
actors.blobs.waterofhealth.procced=Beim ersten Schluck spürst du, wie deine Wunden vollständig verheilen.
actors.blobs.web.desc=Hier ist alles von einem dichten Spinnennetz bedeckt. Alles, was das Netz berührt oder hindurchgeworfen wird, zerreißt es, bleibt aber auch daran kleben.
actors.blobs.web.name=Spinnennetz
actors.buffs.adrenaline.desc=Ein Adrenalinschub steigerte sowohl Angriffs- als auch Bewegungsgeschwindigkeit. \n\nAdrenalin ermöglicht es dem Ziel, mit doppelter Geschwindigkeit zu rennen und mit 1,5-facher Geschwindigkeit anzugreifen. \n\nVerbleibende Züge: %s.
actors.buffs.adrenaline.name=Adrenalin
actors.buffs.adrenalinesurge.desc=Ein plötzlicher Kraftschub, der jedoch leider nicht von Dauer ist.\n\nStärke-Boost: +%d.\nRunden bis zum Nachlassen des Boosts: %s.
actors.buffs.adrenalinesurge.name=Kraftzuwachs
actors.buffs.amok.desc=Amok versetzt sein Ziel in einen Zustand großer Wut und Verwirrung. Wenn eine Kreatur von Amok getrieben wird, greift sie alles in ihrer Nähe an, ob Freund oder Feind. Verbleibende Amok-Runden: 0.
actors.buffs.amok.name=Amok
actors.buffs.arcanearmor.desc=Ein dünner Schild umgibt dich und blockiert einen Teil des Schadens durch magische Angriffe. Deine magische Rüstung ist derzeit um 0-1 verstärkt. Runden bis zur Schwächung der arkanen Rüstung: 1
actors.buffs.arcanearmor.name=Arkane Rüstung
actors.buffs.artifactrecharge.desc=Energie durchströmt dich und erhöht die Ladegeschwindigkeit deiner ausgerüsteten Artefakte. Jedes Artefakt ist etwas anders betroffen, aber alle laden sich deutlich schneller als normal auf. Verbleibende Züge:
actors.buffs.artifactrecharge.name=Artefaktaufladung
actors.buffs.ascensionchallenge.almost=Du spürst, wie Yogs Griff um das Amulett nachlässt, du hast es fast geschafft!
actors.buffs.ascensionchallenge.beckon=Das Amulett beginnt, ferne Feinde anzurufen.
actors.buffs.ascensionchallenge.break=Du nimmst dir einen Moment Zeit, um durchzuatmen und spürst, wie deine Wunden zu heilen beginnen!
actors.buffs.ascensionchallenge.damage=Das Amulett beginnt, dunkle Energie auszustrahlen. Es brennt!
actors.buffs.ascensionchallenge.desc=Yog-Dzewa übt auf irgendeine Weise durch das Amulett Einfluss auf diese Welt aus und versucht, deinen Aufstieg zu verhindern! Yogs Macht macht den Dungeon deutlich gefährlicher, erhöht die Anzahl der Feinde und macht sie stärker! Diese Macht wird immer stärker, wenn sie nicht eingedämmt wird. Sie kann geschwächt werden, indem man Feinde besiegt, die durch Yogs Macht gestärkt wurden.
actors.buffs.ascensionchallenge.desc_beckon=Das Amulett ruft derzeit nach weit entfernten Feinden und macht sie auf Ihre Position aufmerksam.
actors.buffs.ascensionchallenge.desc_clear=Die vom Amulett ausgehende dunkle Energie wurde vorerst so weit wie möglich abgeschwächt.
actors.buffs.ascensionchallenge.desc_damage=Die Energie des Amuletts ist so stark geworden, dass sie dir direkt schadet!
actors.buffs.ascensionchallenge.desc_haste=Das Amulett beschleunigt derzeit die Ankunft entfernter Feinde, sodass diese dich schneller erreichen können!
actors.buffs.ascensionchallenge.desc_slow=Das Amulett bremst dich momentan aus und hebt geschwindigkeitssteigernde Effekte auf!
actors.buffs.ascensionchallenge.haste=Das Amulett beschleunigt die Angriffe ferner Feinde!
actors.buffs.ascensionchallenge.name=Fluch des Amuletts
actors.buffs.ascensionchallenge.on_kill=Die dunkle Energie verschlingt dich...
actors.buffs.ascensionchallenge.slow=Das Amulett fühlt sich in deinem Inventar langsam wie ein Bleigewicht an!
actors.buffs.ascensionchallenge.weaken=Man kann spüren, wie der Fluch des Amuletts etwas nachlässt.
actors.buffs.ascensionchallenge.weaken_info=Der Fluch des Amuletts kann durch das Besiegen weiterer Feinde abgeschwächt werden.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Wenn ihr Feinde besiegt, schwächt sich der Fluch des Amuletts ab!
actors.buffs.barkskin.desc=Deine Haut ist verhärtet und fühlt sich rau und fest wie Baumrinde an. Die verhärtete Haut erhöht deine effektive Rüstung und ermöglicht dir so eine bessere Verteidigung gegen physische Angriffe. Deine Rüstung ist aktuell um 0 erhöht. Runden bis die Rindenhaut schwächer wird: Wenn du Rindenhaut aus mehreren Quellen erhältst, wird nur die stärkste angewendet.
actors.buffs.barkskin.name=Rindenhaut
actors.buffs.barrier.desc=Eine beständige Schutzblase, die jeglichen Schaden abwehrt. Die Barriere erleidet Schaden für das, was sie schützt, solange Schutz vorhanden ist. Der Schutz nimmt mit der Zeit langsam ab. Verbleibender Schutz:
actors.buffs.barrier.name=Barriere
actors.buffs.berserk.action_name=Berserker
actors.buffs.berserk.angered=verärgert
actors.buffs.berserk.angered_desc=Die Schwere der Verletzungen des Berserkers verstärkt seine Schläge. Mit jedem erlittenen physischen Schaden steigt seine Wut und gewährt ihm Bonusschaden. Auch durch Rüstung abgewehrter Schaden trägt zum Wutaufbau bei. Die Wut lässt mit der Zeit nach. Je niedriger die Gesundheit des Berserkers, desto länger hält sie an. Bei 100 Wutpunkten kann der Berserker in einen Raserei-Rausch verfallen und erhält einen Schild, dessen Stärke von seiner Rüstung und seiner fehlenden Gesundheit abhängt. Während seines Berserkerrausches verringert sich sein Schild mit der Zeit. Sobald er aufgebraucht ist, muss er sich ausruhen, bevor er erneut Wut aufbauen kann. Aktuelle Wut: _%1$.0f%%_\n_+%2$.0f%%_ Schaden\n\n Berserkerschild bei aktueller Rüstung und HP: _%3$d_
actors.buffs.berserk.berserk=Berserker
actors.buffs.berserk.berserk_desc=Furcht und Unsicherheit verfliegen, nur Wut bleibt zurück. In diesem Zustand ist der Berserker extrem mächtig, verursacht +50 Schaden und erhält zusätzlichen Schild, verliert aber auch jede Runde Schild. Sobald sein Schild auf 0 reduziert ist, endet der Berserkerrausch. Nach dem Wutanfall muss sich der Berserker erholen, bevor er erneut Wut aufbauen kann. Verbleibender Schild: 1
actors.buffs.berserk.exhausted=erschöpft
actors.buffs.berserk.no_seal=Du brauchst dein gebrochenes Siegel, um in Raserei zu verfallen!
actors.buffs.berserk.rankings_desc=Im Berserkerrausch zu Tode
actors.buffs.berserk.recovering=sich erholen
actors.buffs.berserk.recovering_desc=Innere Stärke hat ihre Grenzen. Der Berserker muss sich ausruhen, bevor er seine Wut erneut entfesseln kann. Während der Erholungsphase baut der Berserker durch erlittenen Schaden keine Wut auf.
actors.buffs.berserk.recovering_desc_levels=Werte bis zur Wiederherstellung: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Runden bis zur Wiederherstellung: _%d_
actors.buffs.bleeding.desc=Aus dieser Wunde blutet besorgniserregend stark. \n\n Die Blutung verursacht jede Runde Schaden. Der Schaden verringert sich jede Runde um einen zufälligen Wert, bis die Blutung schließlich aufhört. \n\n Aktueller Blutungsschaden: %d.
actors.buffs.bleeding.heromsg=Du blutest!
actors.buffs.bleeding.name=Blutung
actors.buffs.bleeding.ondeath=Du bist verblutet...
actors.buffs.bleeding.rankings_desc=Verblutet
actors.buffs.bless.desc=Ein gewaltiger Konzentrationsschub, manche sagen, er sei von den Göttern inspiriert. \n\n Der Segen erhöht Treffsicherheit und Ausweichen um 25%%, wodurch der Gesegnete im Kampf deutlich effektiver wird. \n\n Verbleibende Segensrunden: %s.
actors.buffs.bless.name=gesegnet
actors.buffs.blindness.desc=Die Blendung hüllt die Umgebung in einen dunklen Nebel. Während der Blendung ist die Sichtweite eines Charakters auf ein Feld reduziert, wodurch Fernkampfangriffe wirkungslos werden und man leicht entfernte Feinde aus den Augen verliert. Außerdem kann ein geblendeter Held keine Schriftrollen oder Bücher lesen. Verbleibende Runden der Blindheit: 0.
actors.buffs.blindness.heromsg=Du bist blind!
actors.buffs.blindness.name=geblendet
actors.buffs.blobimmunity.desc=Eine seltsame Kraft hüllt dich in eine dünne Schutzbarriere, die alle schädlichen Einflüsse aus der Luft abwehrt. Du bist immun gegen alle Flächeneffekte, solange diese Barriere anhält. Verbleibende Immunitäts-Deaktivierungen:
actors.buffs.blobimmunity.name=Reinigungsbarriere
actors.buffs.burning.burnsup=%s brennt durch!
actors.buffs.burning.desc=Wenige Dinge sind beunruhigender, als von Flammen umhüllt zu werden. Feuer verursacht jede Runde Schaden, bis es durch Wasser gelöscht wird oder erlischt. Feuer kann gelöscht werden, indem man ins Wasser tritt oder von einem zersplitternden Trank getroffen wird. Zusätzlich kann das Feuer brennbares Gelände oder Gegenstände, mit denen es in Berührung kommt, entzünden. Verbleibende Brennrunden: 0.
actors.buffs.burning.heromsg=Du fängst Feuer!
actors.buffs.burning.name=Verbrennung
actors.buffs.burning.ondeath=Du bist verbrannt...
actors.buffs.burning.rankings_desc=Zu Asche verbrannt
actors.buffs.championenemy$antimagic.desc=Antimagie-Champions erleiden 50 % weniger Schaden und sind vollständig immun gegen magische Effekte.
actors.buffs.championenemy$antimagic.name=Antimagie-Champion
actors.buffs.championenemy$blazing.desc=Feuernde Champions verursachen 25 % mehr Nahkampfschaden, setzen angegriffene Gegner in Brand, sind immun gegen Feuer und verbreiten beim Tod Feuer um sich herum. Sie können jedoch kein Feuer auf Wasser übertragen.
actors.buffs.championenemy$blazing.name=flammender Champion
actors.buffs.championenemy$blessed.desc=Gesegnete Champions verfügen über 4-fache Treffsicherheit und Ausweichchance.
actors.buffs.championenemy$blessed.name=gesegneter Champion
actors.buffs.championenemy$giant.desc=Riesige Champions erleiden 80 % weniger Schaden und haben eine um 1 erhöhte Angriffsreichweite, können sich aber nicht durch geschlossene Räume bewegen.
actors.buffs.championenemy$giant.name=Riesen-Champion
actors.buffs.championenemy$growing.desc=Aufsteigende Champions erhalten einen stetig steigenden Bonus auf Treffsicherheit, Ausweichen, physischen Schaden und eine Schadensreduktion. Aktueller Treffsicherheits-/Ausweich-/Schadensbonus: Aktuelle Schadensreduktion:
actors.buffs.championenemy$growing.name=wachsender Champion
actors.buffs.championenemy$projecting.desc=Champions mit Projektionseffekt verursachen 25 % mehr Nahkampfschaden und haben eine um 3 erhöhte Angriffsreichweite.
actors.buffs.championenemy$projecting.name=projizierter Champion
actors.buffs.championenemy.warn=Du spürst eine tödliche Präsenz.
actors.buffs.charm.cant_attack=Du bist von diesem Feind verzaubert und kannst ihn nicht angreifen.
actors.buffs.charm.desc=Ein Zauber ist manipulative Magie, die Feinde vorübergehend einander anhimmeln lässt. Charaktere, die von einem Zauber betroffen sind, können den verzauberten Feind nicht direkt angreifen. Angriffe auf andere Ziele sind jedoch weiterhin möglich. Der Schmerzschock verkürzt die Zauberdauer. Verbleibende Zauberrunden: 0.
actors.buffs.charm.heromsg=Du bist verzaubert!
actors.buffs.charm.name=Fasziniert
actors.buffs.chill.desc=Nicht ganz gefroren, aber immer noch viel zu kalt. Unterkühlte Ziele führen alle Aktionen langsamer aus, abhängig von der verbleibenden Dauer des Effekts. Im schlimmsten Fall entspricht dies einer Verlangsamung. Verbleibende Kälterunden: 0. Geschwindigkeit reduziert um:
actors.buffs.chill.freezes=%s friert ein!
actors.buffs.chill.name=gekühlt
actors.buffs.combo$combomove.clobber.desc=Stößt einen Gegner 2 Felder zurück, verursacht aber keinen Schaden und kann ihn nicht in Gruben stoßen. Erhöht die Kombo um 1.
actors.buffs.combo$combomove.clobber.empower_desc=Stößt einen Gegner 3 Felder zurück, verursacht Schwindel und kann ihn in Gruben stoßen, fügt ihm aber keinen Schaden zu. Erhöht die Kombo um 1.
actors.buffs.combo$combomove.clobber.name=Klamotten
actors.buffs.combo$combomove.crush.desc=Verursacht %d%% (Kombo*25%%) Schaden am Hauptziel und die Hälfte dieses Schadens an allen anderen Gegnern in einem 7x7-Bereich. Setzt die Kombo bei Benutzung zurück.
actors.buffs.combo$combomove.crush.empower_desc=Springt bis zu %1$d Feldern hoch und verursacht %2$d%% (Kombo*25%%) Schaden am Hauptziel und die Hälfte dieses Schadens an allen anderen Gegnern in einem 7x7-Feld. Setzt die Kombo bei Benutzung zurück.
actors.buffs.combo$combomove.crush.name=zerquetschen
actors.buffs.combo$combomove.fury.desc=Trifft einen Gegner einmal pro Kombo. Jeder Treffer verursacht 60 % Schaden und kann Verzauberungen auslösen. Setzt die Kombo bei Benutzung zurück.
actors.buffs.combo$combomove.fury.empower_desc=Springt bis zu %d Felder(n) und trifft einen Gegner einmal pro Kombo. Jeder Treffer verursacht 60%% Schaden und kann Verzauberungen auslösen. Setzt die Kombo bei Benutzung zurück.
actors.buffs.combo$combomove.fury.name=Wut
actors.buffs.combo$combomove.parry.desc=Blockiert nach Aktivierung den nächsten Angriff innerhalb einer Runde und kontert sofort. Setzt die Kombo zurück, falls kein Angriff pariert wird.
actors.buffs.combo$combomove.parry.empower_desc=Blockt nach Aktivierung innerhalb einer Runde alle Angriffe und kontert sofort. Setzt die Kombo zurück, falls kein Angriff pariert wird.
actors.buffs.combo$combomove.parry.name=parieren
actors.buffs.combo$combomove.slam.desc=Verursacht %d%% (Combo*20%%) deiner Schadensblockierkraft als Bonusschaden. Setzt die Combo bei Benutzung zurück.
actors.buffs.combo$combomove.slam.empower_desc=Springt auf %1$d Felder und verursacht %2$d%% (Combo*20%%) deiner Schadensblockierkraft als Bonusschaden. Setzt die Combo bei Benutzung zurück.
actors.buffs.combo$combomove.slam.name=zuschlagen
actors.buffs.combo.action_name=Kombinationsangriff
actors.buffs.combo.bad_target=Du musst einen Gegner in Angriffsreichweite anvisieren.
actors.buffs.combo.combo=%d Trefferkombination!
actors.buffs.combo.desc=Der Gladiator baut Schwung auf, indem er Treffer landet. Jeder Angriff erhöht den Kombozähler um eins, aber wenn zu lange zwischen den Treffern vergeht, wird der Kombozähler auf 0 zurückgesetzt. Solange der Gladiator eine Kombo hat, beginnt sein Schutzschild durch das gebrochene Siegel nicht zu schwinden. Durch den Aufbau einer Kombo werden spezielle Komboangriffe freigeschaltet, die nicht verfehlen können! Bei 2, 4, 6, 8 und 10 Kombopunkten wird jeweils ein anderer Angriff freigeschaltet. Manche Angriffe setzen die Kombo zurück, manche nicht, aber jeder Angriff kann nur einmal pro Kombositzung verwendet werden. Aktuelle Kombo: 0. Züge bis zum Verlust der Kombo: 1.
actors.buffs.combo.name=Combo
actors.buffs.combo.prompt=Wähle ein Ziel zum Angreifen aus.
actors.buffs.corrosion.desc=Starke Säure löst Fleisch, Metall und Knochen in alarmierender Geschwindigkeit auf. Der Korrosionsschaden nimmt mit der Zeit zu, da das Ziel weiter aufgelöst wird. Verbleibende Korrosionszyklen: 0. Aktueller Korrosionsschaden: 1.
actors.buffs.corrosion.heromsg=Du schmelzt ja!
actors.buffs.corrosion.name=Korrosion
actors.buffs.corrosion.ondeath=Du zerfällst dahin...
actors.buffs.corrosion.rankings_desc=aufgelöst
actors.buffs.corruption.desc=Verderbnis dringt in das Wesen eines Wesens ein und verdreht es seiner ursprünglichen Natur. Verderbte Kreaturen greifen ihre Verbündeten an und ignorieren ihre ehemaligen Feinde. Verderbnis ist zudem schädlich und führt langsam zum Untergang des Ziels. Verderbnis ist permanent; ihre Auswirkungen enden erst mit dem Tod.
actors.buffs.corruption.name=beschädigt
actors.buffs.cripple.desc=Du bist dir ziemlich sicher, dass Beine nicht dafür gemacht sind, sich so zu biegen.\n\nVerkrüppelt halbiert die Bewegungsgeschwindigkeit, sodass das Bewegen eines Feldes normalerweise zwei Züge statt einem dauert.\n\nVerbleibende Züge der Verkrüppelung: %s.
actors.buffs.cripple.heromsg=Du bist verkrüppelt!
actors.buffs.cripple.name=verkrüppelt
actors.buffs.daze.desc=Ohrensausen und verschwommenes Sehen erschweren den Kampf. Während der Benommenheit sind Treffsicherheit und Ausweichen um 50 reduziert, was das Treffen und Ausweichen von Schlägen deutlich erschwert. Verbleibende Benommenheitsrunden:
actors.buffs.daze.heromsg=Du bist benommen!
actors.buffs.daze.name=benommen
actors.buffs.degrade.desc=Mächtige dunkle Magie schwächt die Wirkung von Aufwertungsrollen auf eure Ausrüstung! \n\nAbgeschwächte, aufgewertete Ausrüstung wird so behandelt, als wäre sie von einer niedrigeren Stufe als sie tatsächlich ist. _Jede Aufwertung nach +3 wird exponentiell schwächer als die vorherige._ Die Beschreibungen eurer Gegenstände ändern sich, um ihre reduzierte Stärke widerzuspiegeln. \n\nDie Abschwächung hat keine Auswirkungen auf Stärkeanforderungen, Zauberstabladungen, die Haltbarkeit von Wurfwaffen oder Artefakte. \n\nVerbleibende Abschwächungsrunden: %s. Die Verwendung einer Aufwertungsrolle oder eines Fluchaufhebungsrollen beendet die Abschwächung sofort.
actors.buffs.degrade.heromsg=Ihre Ausrüstung fühlt sich schwächer an!
actors.buffs.degrade.name=abgebaut
actors.buffs.doom.desc=Es ist schwer, weiterzumachen, wenn es scheint, als wolle das Universum dich tot sehen. Verdammte Charaktere erleiden 67 % mehr Schaden aus allen Quellen. Das Verhängnis ist permanent, seine Auswirkungen enden nur mit dem Tod.
actors.buffs.doom.name=zum Scheitern verurteilt
actors.buffs.dread.desc=Ein Schrecken, der so groß ist, dass sein Ziel den Dungeon vollständig verlässt! Kreaturen, die von Furcht ergriffen sind, fliehen mit hoher Geschwindigkeit vor ihrem Gegner und verschwinden vollständig aus dem Dungeon, sobald sie außer Sichtweite sind. Besiegte Gegner gewähren nur die Hälfte der Erfahrungspunkte und lassen keine Gegenstände fallen. Der Schmerzschock verkürzt die Dauer der Furcht. Verbleibende Furchtrunden: 0
actors.buffs.dread.name=Furcht
actors.buffs.drowsy.desc=Eine magische Kraft erschwert das Wachbleiben. Nach wenigen Runden fällt das Ziel in einen tiefen magischen Schlaf. Der Held kann der Schläfrigkeit widerstehen, indem er Schaden erleidet oder über volle Gesundheit verfügt. Runden bis zum Schlaf: 0.
actors.buffs.drowsy.name=schläfrig
actors.buffs.earthimbue.desc=Du bist mit der Macht der Erde erfüllt! ZXQPH1 ZXQ ZXQ PH2 ZXQ Alle physischen Angriffe werden die Erde unter dem Feind verschieben und ihn für kurze Zeit schwächen. ZXQPH3 ZXQ ZXQ PH4 ZXQ Verbleibende Erdverstärkungsrunden: ZXQPH0 ZXQ.
actors.buffs.earthimbue.name=durchdrungen von Erde
actors.buffs.enhancedrings.desc=Das kürzlich vom Schurken benutzte Artefakt verstärkt seine Ringe und verleiht ihnen +1 Stufe.\n\nVerbleibende Züge: %s.
actors.buffs.enhancedrings.name=verbesserte Ringe
actors.buffs.fireimbue.desc=Du bist mit der Macht des Feuers erfüllt! Alle physischen Angriffe haben eine Chance, Gegner in Brand zu setzen. Außerdem bist du vollständig immun gegen die Effekte von Feuer. Verbleibende Runden der Feuerverzauberung: 0.
actors.buffs.fireimbue.name=vom Feuer durchdrungen
actors.buffs.foresight.desc=Du bist auf irgendeine Weise in der Lage, die Anordnung des umliegenden Geländes mit deinen Gedanken wahrzunehmen.\n\nUnter dem Einfluss der Voraussicht werden dir alle Felder in einem weiten Radius enthüllt, einschließlich aller geheimen Fallen oder Türen.\n\nVerbleibende Runden der Voraussicht: %s.
actors.buffs.foresight.name=Voraussicht
actors.buffs.frost.desc=Nicht zu verwechseln mit vollständigem Einfrieren: Dieses harmlosere Einfrieren umschließt das Ziel lediglich mit Eis. \n\n Das Einfrieren wirkt ähnlich wie Lähmung und macht das Ziel handlungsunfähig. Im Gegensatz zur Lähmung wird das Einfrieren sofort aufgehoben, wenn das Ziel Schaden erleidet, da das Eis zerbricht. \n\n Verbleibende Einfrierzyklen: %s.
actors.buffs.frost.freezes=%s friert ein!
actors.buffs.frost.name=gefroren
actors.buffs.frostimbue.desc=Du bist mit eisiger Macht erfüllt! Alle physischen Angriffe belegen Gegner kontinuierlich mit Kälte. Zusätzlich bist du vollständig immun gegen Kälte. Verbleibende Frostverzauberungen: 0
actors.buffs.frostimbue.name=durchdrungen von Frost
actors.buffs.fury.desc=Du bist wütend, und deine Feinde mögen dich nicht, wenn du wütend bist. Eine große Wut entbrennt in dir und erhöht den Schaden deiner physischen Angriffe um 50. Diese Wut hält an, solange deine Gesundheit unter 50 liegt.
actors.buffs.fury.heromsg=Du wirst wütend!
actors.buffs.fury.name=wütend
actors.buffs.gravitychaostracker.desc_duration=Es ist unklar, wie lange der Effekt anhalten wird, aber er kann nicht ewig dauern.
actors.buffs.gravitychaostracker.desc_intro=Etwa alle paar Runden werden alle Charaktere auf der aktuellen Dungeon-Ebene in eine zufällige Richtung geschleudert.
actors.buffs.gravitychaostracker.desc_positive=Du und deine Verbündeten scheinen jedoch immun zu sein.
actors.buffs.gravitychaostracker.name=Gravitationschaos
actors.buffs.greaterhaste.desc=Ein unglaublicher Geschwindigkeitsschub, für einen Moment scheint alles um einen herum stillzustehen. Während Bewegungsaktionen unter dem Einfluss von „Höhere Eile“ sofort ausgeführt werden, werden andere Aktionen weiterhin in normaler Geschwindigkeit ausgeführt. Jeder Bewegungsschritt verbraucht eine Runde „Höhere Eile“. Verbleibende Runden „Höhere Eile“: 0.
actors.buffs.greaterhaste.name=größere Eile
actors.buffs.haste.desc=Energie durchströmt deine Muskeln und ermöglicht dir unglaubliche Geschwindigkeiten! ZXQPH1 ZXQ ZXQ PH2 ZXQ Unter dem Einfluss von Hast läufst du mit dreifacher Geschwindigkeit, führst aber alle anderen Aktionen in normaler Geschwindigkeit aus. ZXQPH3 ZXQ ZXQ PH4 ZXQ Verbleibende Hast-Runden: ZXQPH0 ZXQ.
actors.buffs.haste.name=Eile
actors.buffs.healing.desc=Ein magisches Heilmittel lässt Wunden sich schließen und das Gewebe heilen. Jede Runde regeneriert sich die Gesundheit stetig, bis der Heilungseffekt nachlässt. Die Heilung kann mit der Zeit abnehmen. Nächste Heilung: [%d] [\n\n] Verbleibende Heilung: [%d]
actors.buffs.healing.name=Heilung
actors.buffs.herodisguise.desc=Illusionäre Magie hat dein Aussehen verändert! Der Effekt ist rein kosmetisch, fühlt sich aber trotzdem sehr seltsam an. ZXQPH1 ZXQ ZXQ PH2 ZXQ Verbleibende Verkleidungszyklen: ZXQPH0 ZXQ.
actors.buffs.herodisguise.name=Verkleidung
actors.buffs.hex.desc=Dunkle Magie, die die Konzentration schwächt und das Ziel leicht desorientiert. \n\nVerhexung verringert Treffsicherheit und Ausweichen um 20%% und macht das Ziel im Kampf weniger effektiv. \n\nVerbleibende Hex-Runden: %s.
actors.buffs.hex.heromsg=Du wurdest verhext!
actors.buffs.hex.name=verhext
actors.buffs.holdfast.desc=Der Krieger hält seine Position, erhöht seine Rüstung um %1$d-%2$d und verlangsamt die Abklingrate einiger Stärkungszauber um %3$d%%. Dieser Zustand hält an, bis er sich bewegt.
actors.buffs.holdfast.name=festhalten
actors.buffs.hunger.cursedhorn=Das verfluchte Horn stiehlt dir beim Essen einen Teil der Nahrungsenergie.
actors.buffs.hunger.desc=Der Hunger nimmt mit der Zeit im Dungeon langsam zu, bis du schließlich verhungerst. Während des Hungerns verlierst du langsam Gesundheit, anstatt sie zu regenerieren. \n\nRationierung ist wichtig! Wenn du noch genügend Gesundheit übrig hast, ist Hungern keine schlechte Idee, wenn es bedeutet, dass später mehr Nahrung verfügbar ist. Effektive Rationierung kann die Nahrung deutlich verlängern!
actors.buffs.hunger.desc_intro_hungry=Du spürst, wie dein Magen nach Essen verlangt, aber es ist noch nicht allzu dringend.
actors.buffs.hunger.desc_intro_starving=Du bist so hungrig, dass es weh tut.
actors.buffs.hunger.hungry=hungrig
actors.buffs.hunger.ondeath=Du bist verhungert...
actors.buffs.hunger.onhungry=Du hast Hunger.
actors.buffs.hunger.onstarving=Du verhungerst!
actors.buffs.hunger.rankings_desc=Verhungert
actors.buffs.hunger.starving=verhungern
actors.buffs.invisibility.desc=Du verschmilzt vollständig mit der Umgebung und bist somit unsichtbar. Während du unsichtbar bist, können dich Feinde weder angreifen noch verfolgen. Physische Angriffe und magische Effekte (wie Schriftrollen und Zauberstäbe) heben die Unsichtbarkeit sofort auf. Verbleibende Unsichtbarkeitsrunden: 0
actors.buffs.invisibility.name=unsichtbar
actors.buffs.invulnerability.desc=Dieser Charakter ist mit großer Schutzkraft erfüllt, die ihm für kurze Zeit Unverwundbarkeit verleiht!\n\nVerbleibende Züge: %s.
actors.buffs.invulnerability.name=unverwundbar
actors.buffs.levitation.desc=Eine magische Kraft lässt dich über dem Boden schweben und verleiht dir ein schwereloses Gefühl. Schwebende Charaktere bewegen sich lautlos und ignorieren alle Effekte am Boden. Fallen werden nicht ausgelöst, Wasser löscht kein Feuer, Pflanzen werden nicht zertrampelt, Wurzeln verfehlen ihr Ziel und Gruben werden überflogen. Sei vorsichtig, denn all diese Effekte können sofort nach dem Ende der Schwebephase eintreten! Verbleibende Schwebephasen: 0
actors.buffs.levitation.name=schwebend
actors.buffs.lifelink.desc=Die Lebenskraft dieser Figur ist mit einer anderen Figur in der Nähe verbunden. Jeglicher erlittener Schaden wird zwischen ihnen geteilt. Immer wenn diese Figur Schaden erleidet, wird die Hälfte davon stattdessen dem Ziel der Lebensverbindung zugefügt. Verbleibende Runden der Lebensverbindung: 0.
actors.buffs.lifelink.name=Lebensverbindung
actors.buffs.lifelink.ondeath=Der lebensbedingte Schaden hat dich getötet...
actors.buffs.light.desc=Selbst im finstersten Verlies ist ein stetiges Licht an deiner Seite immer beruhigend. Licht hilft, die Dunkelheit fernzuhalten und ermöglicht es dir, trotz der Umgebung eine angemessene Entfernung zu sehen. Verbleibende Beleuchtungsstufen: 0.
actors.buffs.light.name=beleuchtet
actors.buffs.lockedfloor.desc=Diese Ebene ist gesperrt und du kannst sie nicht verlassen! Solange eine Ebene gesperrt ist, verspürst du keinen Hunger und erleidest keinen Schaden durch Verhungern. Außerdem werden passive Regenerationseffekte gestoppt, wenn du den Boss dieser Ebene nicht besiegst. Wenn du durch ein ungesegnetes Ankh wiederbelebt wirst, während die Ebene gesperrt ist, wird sie zurückgesetzt. Besiege den Boss dieser Ebene, um die Sperre aufzuheben.
actors.buffs.lockedfloor.name=Der Boden ist verriegelt
actors.buffs.lostinventory.desc=Dein Inventar ist irgendwo im Dungeon verloren gegangen! Du kannst die meisten Gegenstände erst wieder aufheben oder benutzen, wenn du es zurückgeholt hast.
actors.buffs.lostinventory.name=verlorenes Inventar
actors.buffs.magicalsight.desc=Du bist irgendwie in der Lage, mit deinem Geist statt mit deinen Augen zu sehen.\n\nSolange die magische Sicht aktiv ist, kannst du in einem Radius von 12 Feldern durch jedes Terrain sehen.\n\nVerbleibende Runden der magischen Sicht: %s.
actors.buffs.magicalsight.name=magischer Anblick
actors.buffs.magicalsleep.desc=Diese Figur ist in einen tiefen magischen Schlaf gefallen, aus dem sie nicht auf natürliche Weise erwachen wird. Der magische Schlaf ähnelt dem normalen Schlaf, nur dass das Ziel durch Schaden aufwacht. Für den Helden und seine Verbündeten besitzt der magische Schlaf regenerative Eigenschaften, die es ihnen ermöglichen, sich während der Ruhephase schnell zu heilen.
actors.buffs.magicalsleep.fallasleep=Du fällst in einen tiefen, magischen Schlaf.
actors.buffs.magicalsleep.name=magischer Schlaf
actors.buffs.magicalsleep.toohealthy=Du bist zu gesund und widerstehst dem Drang zu schlafen.
actors.buffs.magicalsleep.wakeup=Sie wachen erfrischt und gesund auf.
actors.buffs.magicimmune.desc=Alle magischen Effekte haben ihre Wirkung auf dich verloren, du bist völlig immun gegen sie. ZXQPH1 ZXQ ZXQ PH2 ZXQ Solange du magieimmun bist, wirken weder schädliche noch nützliche magische Effekte auf dich, einschließlich Flüche, Verzauberungen, Zauberstäbe, Schriftrollen, Ringe, Artefakte usw. Heldenrüstungsfähigkeiten sind stark genug, um trotz dieses Effekts zu funktionieren. ZXQPH3 ZXQ ZXQ PH4 ZXQ Verbleibende Runden Magieimmunität: ZXQPH0 ZXQ.
actors.buffs.magicimmune.name=Immun gegen Magie
actors.buffs.mindvision.desc=Du kannst irgendwie alle Kreaturen auf dieser Ebene durch deine Gedanken sehen. Es ist ein seltsames Gefühl. Alle Charaktere auf dieser Ebene sind für dich sichtbar, solange du Gedankensicht besitzt. Eine Kreatur durch Gedankensicht zu sehen, zählt für viele magische Effekte als gesehen oder in der Nähe. Verbleibende Gedankensicht-Runden: 0.
actors.buffs.mindvision.name=Geistige Vision
actors.buffs.momentum.action_name=Freerun
actors.buffs.momentum.momentum=zunehmende Dynamik
actors.buffs.momentum.momentum_desc=Während er sich bewegt, baut der Freerunner Schwung auf, den er für Freerunning einsetzen kann. Jede Schwungladung ermöglicht zwei Freerunning-Runden, und der Freerunner kann bis zu 10 Ladungen ansammeln. Der Schwung geht schnell verloren, sobald der Freerunner anhält. Aktueller Schwung: 0.
actors.buffs.momentum.resting=sich erholen
actors.buffs.momentum.resting_desc=Während er sich bewegt, baut der Freerunner Schwung auf, den er für Freerunning nutzen kann. Der Freerunner benötigt Zeit, um seine Ausdauer wiederherzustellen, bevor er erneut Schwung aufbauen kann. Verbleibende Züge: 0
actors.buffs.momentum.running=Freilauf
actors.buffs.momentum.running_desc=Während er sich bewegt, baut der Freerunner Schwung auf, den er für den Freerunning-Angriff nutzen kann. Beim Freerunning bewegt sich der Freerunner mit doppelter Geschwindigkeit und erhält einen Ausweichbonus basierend auf seinem Level. Verbleibende Züge: 0.
actors.buffs.monkenergy$monkability$dash.desc=Ein blitzschneller Sprint über bis zu 4 Felder. Diese Fähigkeit kann Hindernisse überwinden, aber nicht durch Gegner oder festes Gelände hindurch.
actors.buffs.monkenergy$monkability$dash.empower_desc=Ein blitzschneller Sprint bis zu 8 Felder weit. Diese Fähigkeit kann Hindernisse überwinden, aber nicht durch Gegner oder festes Gelände hindurch.
actors.buffs.monkenergy$monkability$dash.name=Bindestrich
actors.buffs.monkenergy$monkability$dash.prompt=Wählen Sie einen Standort
actors.buffs.monkenergy$monkability$dragonkick.desc=Ein verheerender Tritt, der %1$d-%2$d Schaden verursacht und Rüstung ignoriert. Der Tritt schleudert das Ziel weg und lähmt es für jedes Feld, das es zurücklegt.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Ein verheerender Tritt, der _%1$d-%2$d Schaden_ verursacht und Rüstung ignoriert. Der Tritt stößt _alle angrenzenden Ziele_ zurück und lähmt sie für jedes Feld, das sie zurücklegen.
actors.buffs.monkenergy$monkability$dragonkick.name=Drachentritt
actors.buffs.monkenergy$monkability$flurry.desc=Zwei sofortige Angriffe, die %1$d-%2$d Schaden verursachen und Rüstung ignorieren. Diese Fähigkeit kann nicht wiederholt eingesetzt werden.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Zwei sofortige Angriffe, die %1$d-%2$d Schaden verursachen, Rüstung ignorieren und die Verzauberung eurer Waffe nutzen. Diese Fähigkeit kann nicht wiederholt eingesetzt werden.
actors.buffs.monkenergy$monkability$flurry.name=Schlaghagel
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Die Mönchin konzentriert sich auf ihre Umgebung und antizipiert den nächsten Angriff. In dieser Konzentration wird sie den nächsten Angriff mit Sicherheit abwehren.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=fokussiert
actors.buffs.monkenergy$monkability$focus.desc=Die Mönchin konzentriert sich nun und kann den nächsten Angriff abwehren.
actors.buffs.monkenergy$monkability$focus.empower_desc=Die Mönchin konzentriert sich sofort und lässt sich so den nächsten Angriff abwehren.
actors.buffs.monkenergy$monkability$focus.name=Fokus
actors.buffs.monkenergy$monkability$meditate.desc=Die Mönchin konzentriert fünf Runden lang Energie in ihrem Körper. Dadurch werden die meisten negativen Effekte beseitigt und sie kann ihren Zauberstab und ihr Artefakt acht Runden lang wieder aufladen.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Die Mönchin konzentriert fünf Runden lang Energie in ihrem Körper. Dadurch werden die meisten negativen Effekte aufgehoben und sie kann ihren Zauberstab und ihr Artefakt acht Runden lang aufladen. Während der Meditation erhält sie außerdem 80 % Schadensresistenz und heilt sich langsam um 20 % ihrer fehlenden Lebenspunkte.
actors.buffs.monkenergy$monkability$meditate.name=meditieren
actors.buffs.monkenergy.action=Mönchsfähigkeiten
actors.buffs.monkenergy.desc=Besiegte Gegner bringen der Mönch Energie ein, die er für verschiedene Fähigkeiten nutzen kann. Die meisten besiegten Gegner gewähren 1 Energiepunkt, und der Mönch verliert keine Energie. Aktuelle Energie:
actors.buffs.monkenergy.desc_cooldown=Der Mönch hat vor Kurzem eine Fähigkeit eingesetzt und muss warten, bevor er eine weitere einsetzen kann.\n\nAktuelle Abklingzeit: %d Runden.
actors.buffs.monkenergy.name=Energie
actors.buffs.ooze.desc=Diese klebrige Säure haftet am Fleisch und zersetzt es langsam. Der Schleim verursacht mit der Zeit stetigen Schaden, kann aber sofort mit Wasser abgewaschen werden. Verbleibende Schleim-Umdrehungen:
actors.buffs.ooze.heromsg=Ätzender Schlamm frisst dein Fleisch. Wasch ihn ab!
actors.buffs.ooze.name=ätzender Schlamm
actors.buffs.ooze.ondeath=Du zerfällst dahin...
actors.buffs.ooze.rankings_desc=aufgelöst
actors.buffs.paralysis.desc=Oft ist es das Schlimmste, gar nichts zu tun. \n\n Die Lähmung unterbricht alle Aktionen vollständig und zwingt das Ziel, zu warten, bis der Effekt nachlässt. Der Schmerz durch erlittenen Schaden kann dazu führen, dass Charaktere der Lähmung widerstehen und sich so aus dem Effekt befreien. \n\n Verbleibende Lähmungsrunden: %s.
actors.buffs.paralysis.heromsg=Du bist gelähmt!
actors.buffs.paralysis.name=gelähmt
actors.buffs.paralysis.out=widerstandener Lähmung
actors.buffs.physicalempower.desc=Deine Schläge wurden verstärkt, wodurch der Schaden, den du mit physischen Angriffen anrichten kannst, erhöht wird. Bonusschaden: 0.0. Verbleibende Treffer: 1.0.
actors.buffs.physicalempower.name=körperlich gestärkt
actors.buffs.pincushion.desc=Die Wurfwaffen, die du gegen diesen Charakter eingesetzt hast, haften derzeit an ihm und fallen nach seiner Niederlage zu Boden.\n\nFolgende Gegenstände sind derzeit angebracht:
actors.buffs.pincushion.name=Nadelkissen
actors.buffs.poison.desc=Das Gift breitet sich im Körper aus und beeinträchtigt langsam seine inneren Funktionen. \n\nDas Gift verursacht jede Runde Schaden, der proportional zu seiner verbleibenden Wirkungsdauer ist. \n\nVerbleibende Giftrunden: %s.
actors.buffs.poison.heromsg=Du bist vergiftet!
actors.buffs.poison.name=vergiftet
actors.buffs.poison.ondeath=Du bist an einer Vergiftung gestorben...
actors.buffs.poison.rankings_desc=Dem Gift erlegen
actors.buffs.preparation.action_name=vorbereiteter Angriff
actors.buffs.preparation.assassinated=ermordet
actors.buffs.preparation.desc=Der Assassine wartet geduldig und bereitet sich darauf vor, aus dem Schatten zuzuschlagen.
actors.buffs.preparation.desc_blink=Er kann sich zu einem Gegner hinteleportieren, bevor er ihn angreift, mit einer maximalen Entfernung von _%d._
actors.buffs.preparation.desc_dmg=Sein nächster Angriff verursacht _%1$d%% Bonusschaden_ und exekutiert normale Gegner mit weniger als _%2$d%% Gesundheit_ oder Bosse mit weniger als _%3$d%% Gesundheit_.
actors.buffs.preparation.desc_dmg_likely=Der Angriff wird mit größerer Wahrscheinlichkeit auch einen größeren Schaden anrichten.
actors.buffs.preparation.desc_invis_next=Züge für stärkeren Angriff: _%d._
actors.buffs.preparation.desc_invis_time=Unsichtbar verbrachte Runden: _%d._
actors.buffs.preparation.name=Vorbereitung
actors.buffs.preparation.no_target=Dort gibt es nichts anzugreifen.
actors.buffs.preparation.out_of_reach=Dieses Ziel ist außer Reichweite.
actors.buffs.preparation.prompt=Wähle ein Ziel zum Angreifen! \n Maximale Blinkdistanz: %d
actors.buffs.prismaticguard.desc=Du wirst von einem prismatischen Bild beschützt, das momentan inaktiv ist. Sobald Feinde in der Nähe sind, wird das prismatische Bild aktiv und beschützt dich! \n\n Solange es inaktiv ist, regeneriert sich das prismatische Bild stetig von erlittenem Schaden. \n\n Aktuelle LP: %d/%d.
actors.buffs.prismaticguard.desc_many=Dieses prismatische Bild profitiert ebenfalls von der Macht der Vielen. Verbleibende Züge: %d.
actors.buffs.prismaticguard.name=prismatischer Wächter
actors.buffs.recharging.desc=Energie durchströmt dich und beschleunigt das Aufladen deiner Zauberstäbe und Stäbe. Jede Runde erhöht dieser Buff die aktuelle Ladung um ein Viertel, zusätzlich zur regulären Aufladung. Verbleibende Aufladerunden: 0.
actors.buffs.recharging.name=Aufladen
actors.buffs.revealedarea.desc=Ein Bereich des Dungeons wurde dem Helden vorübergehend enthüllt. Er wird ihn sehen, egal wo er sich befindet. ZXQPH1 ZXQ ZXQ PH2 ZXQ Verbleibende Züge: ZXQPH0 ZXQ.
actors.buffs.revealedarea.name=freigelegtes Gebiet
actors.buffs.revealedchar.desc=Diese Figur wird dem Helden enthüllt. Sie ist überall sichtbar. ZXQPH1 ZXQ ZXQ PH2 ZXQ Verbleibende Züge: ZXQPH0 ZXQ.
actors.buffs.revealedchar.name=enthüllt
actors.buffs.roots.desc=Wurzeln (magisch oder natürlich) packen die Füße und zwingen sie zu Boden. Wurzeln fixieren ein Ziel, sodass Bewegung und die meisten Bewegungsfähigkeiten unmöglich werden. Andere Aktionen, einschließlich Teleportationseffekte, sind davon nicht betroffen. Verbleibende Wurzelumdrehungen: 0
actors.buffs.roots.heromsg=Du kannst dich nicht bewegen!
actors.buffs.roots.name=verwurzelt
actors.buffs.scrollempower.desc=Die Energie aus der Schriftrolle, die der Magier kürzlich gelesen hat, stärkt seine Zauberstäbe!\n\nLevel Boost: +%1$d.\nVerbleibende Zaps: %2$d.
actors.buffs.scrollempower.name=Scrollen Sie, um sich zu stärken
actors.buffs.shadows.desc=Du verschmilzt mit den Schatten um dich herum, was dir Unsichtbarkeit verleiht und deinen Stoffwechsel verlangsamt. Solange du unsichtbar bist, können dich Feinde weder angreifen noch verfolgen. Die meisten physischen Angriffe und magischen Effekte (wie Schriftrollen und Zauberstäbe) heben die Unsichtbarkeit sofort auf. Außerdem ist dein Hungergefühl während der Schattenverschmelzung verlangsamt. Du bleibst so lange in Schattenverschmelzung, bis du die Schatten verlässt oder ein Feind mit dir in Kontakt kommt.
actors.buffs.shadows.name=Schattenverschmelzung
actors.buffs.slow.desc=Verlangsamungsmagie beeinflusst die Zeitwahrnehmung des Ziels; für es bewegt sich alles rasend schnell. Ein verlangsamter Charakter benötigt für alle Aktionen die doppelte Zeit. Verbleibende Verlangsamungsrunden:
actors.buffs.slow.name=verlangsamt
actors.buffs.snipersmark.action_name_snapshot=Schnappschuss
actors.buffs.snipersmark.action_name_sniper=Scharfschützenschuss
actors.buffs.snipersmark.action_name_volley=Volley
actors.buffs.snipersmark.desc=Die Scharfschützin hat das Ziel im Visier, das sie zuletzt angegriffen hat. Sie kann mit ihrem Bogen einen Spezialangriff ausführen, der von der Art der Bogenverstärkung abhängt. Ein nicht verstärkter Bogen verschießt einen Schnellschuss, der reduzierten Schaden verursacht, aber keine Zeit zum Abfeuern benötigt. Ein auf Geschwindigkeit verstärkter Bogen verschießt eine Salve von drei Pfeilen. Jeder Pfeil verursacht reduzierten Schaden, kann aber dennoch Verzauberungen aktivieren. Diese Salve benötigt eine Runde. Ein auf Schaden verstärkter Bogen verschießt einen Scharfschützenschuss. Dieser Schuss trifft garantiert, verursacht Bonusschaden basierend auf der Entfernung zum Ziel und benötigt zwei Runden zum Abfeuern. Verbleibende Runden: 0.
actors.buffs.snipersmark.name=Scharfschützenmarke
actors.buffs.soulmark.desc=Der Hexenmeister hat sich mit der Seele dieser Kreatur verbunden, wodurch sie sich heilen kann, während sie physischen Schaden erleidet.\n\nVerbleibende Runden des Seelenzeichens: %s.
actors.buffs.soulmark.name=Seele markiert
actors.buffs.stamina.desc=Du verfügst über unbegrenzte Ausdauer, was dir schnellere Bewegungen ermöglicht!\n\nUnter dem Einfluss von Ausdauer läufst du mit +50%% Geschwindigkeit, führst aber alle anderen Aktionen in normaler Geschwindigkeit aus.\n\nVerbleibende Ausdauerrunden: %s.
actors.buffs.stamina.name=Ausdauer
actors.buffs.terror.desc=Terror ist manipulative Magie, die ihr Ziel in unkontrollierbare Panik versetzt. Verängstigte Charaktere sind gezwungen, vor ihrem Gegner zu fliehen und versuchen, so viele Türen und Wände wie möglich zwischen sich und ihren Gegner zu bringen. Der Schock des Schmerzes verkürzt jedoch die Dauer des Terrors. Verbleibende Terrorrunden: 0.
actors.buffs.terror.name=verängstigt
actors.buffs.toxicimbue.desc=Du bist von giftiger Energie erfüllt! ZXQPH1 ZXQ ZXQ PH2 ZXQ Während du dich bewegst, strömt ständig giftiges Gas von dir aus und fügt deinen Feinden Schaden zu. Du bist während der Wirkungsdauer und für einige Runden danach immun gegen giftiges Gas und Gift. ZXQPH3 ZXQ ZXQ PH4 ZXQ Verbleibende Runden der Giftwirkung: ZXQPH0 ZXQ.
actors.buffs.toxicimbue.name=durchdrungen von Toxizität
actors.buffs.vertigo.desc=In einer geraden Linie zu gehen, kann schwierig sein, wenn sich die ganze Welt dreht. ZXQPH1 ZXQ ZXQ PH2 ZXQ Unter dem Einfluss von Schwindel bewegen sich Charaktere, die versuchen, sich zu bewegen, in eine zufällige Richtung, anstatt in die, in die sie sich eigentlich bewegen wollten. ZXQPH3 ZXQ ZXQ PH4 ZXQ Verbleibende Schwindelrunden: ZXQPH0 ZXQ.
actors.buffs.vertigo.name=Schwindel
actors.buffs.vulnerable.desc=Verwundbarkeitsmagie erhöht jeglichen physischen Schaden, den ein Charakter erleidet, um 33%%, nachdem dieser Schaden durch Rüstung reduziert wurde.\n\n Verbleibende Verwundbarkeitsrunden: %s.
actors.buffs.vulnerable.heromsg=Du fühlst dich zerbrechlich!
actors.buffs.vulnerable.name=verletzlich
actors.buffs.wandempower.desc=Eure Zauberstäbe, die Schaden verursachen, wurden verstärkt, wodurch der Schaden, den sie für einige Treffer verursachen, erhöht wird.\n\nBonusschaden: %1$d.\nVerbleibende Treffer: %2$d.
actors.buffs.wandempower.name=Zauberstäbe mit Kraft
actors.buffs.weakness.desc=Plötzlich wirkt alles viel schwerer. Schwächungsmagie verringert die physische Stärke eines Charakters, wodurch er 33%% weniger Schaden verursacht. Verbleibende Schwächungsrunden: %s.
actors.buffs.weakness.heromsg=Du fühlst dich geschwächt!
actors.buffs.weakness.name=geschwächt
actors.buffs.wellfed.desc=Du fühlst dich satt und zufrieden.\n\nSolange du gut genährt bist, steigt dein Hunger nicht an und du regenerierst mit der Zeit zusätzlich Gesundheit.\n\nVerbleibende Züge: %d.
actors.buffs.wellfed.name=gut genährt
actors.char.def_verb=ausgewichen
actors.char.def_verb_blocked=blockiert
actors.char.defeat=Du hast %s besiegt.
actors.char.immune=immun
actors.char.invulnerable=unverwundbar
actors.char.kill=%s hat dich getötet...
actors.hero.abilities.armorability.cost=Ladekosten: _%d_
actors.hero.abilities.armorability.no_target=Da gibt es nichts, worauf man zielen könnte!
actors.hero.abilities.armorability.prompt=Wählen Sie einen Zielort aus.
actors.hero.abilities.armorability.self_target=Du kannst dich nicht selbst ins Visier nehmen!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Strahlende Energie geht vom Körper des Klerikers aus. In dieser Gestalt erhält der Kleriker 2 Angriffsreichweite (durch die von ihm ausgehende heilige Energie) und 10 Schildpunkte, sobald er eine Ladung eines heiligen Buches verbraucht. Er kann außerdem die Zauber wirken, die durch die Talente der aufgestiegenen Gestalt freigeschaltet werden. Der durch die aufgestiegene Gestalt und ihre Zauber gewährte Schild verfällt nicht normal, sondern verschwindet sofort, sobald die aufgestiegene Gestalt endet. Aktueller Schild: 0. Verbleibende Runden: 1.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=aufgestiegene Form
actors.hero.abilities.cleric.ascendedform.desc=Der Kleriker projiziert heilige Energie und nimmt für 10 Runden eine erweiterte, strahlende Gestalt an. In dieser Gestalt kann er neue Zauber wirken, erhält 2 Angriffsreichweite, 30 Schildpunkte und jeder weitere Zauber gewährt 10 Schildpunkte pro verwendeter Heiliger-Buch-Ladung. Der Schild der aufgestiegenen Gestalt und ihrer Zauber verfällt nicht normal, sondern verschwindet sofort, sobald die aufgestiegene Gestalt endet. Die Fähigkeit kann erneut eingesetzt werden, um die Dauer der aufgestiegenen Gestalt zu verlängern.
actors.hero.abilities.cleric.ascendedform.name=aufgestiegene Form
actors.hero.abilities.cleric.ascendedform.short_desc=Der Kleriker nimmt eine _Aufgestiegene Form_ an und erhält dadurch neue Zauber, eine größere Angriffsreichweite und einen Schild.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Eine Kopie eines der Abenteuergefährten des Klerikers, erschaffen aus reinem Licht. Obwohl sie die Gestalt eines anderen Helden hat, besitzt sie keine seiner einzigartigen Fähigkeiten. Dieser Verbündete bleibt bestehen, solange die Rüstungsfähigkeit „Macht der Vielen“ auf ihn wirkt. Dieser Verbündete kann kostenlos gelenkt werden, indem die Rüstungsfähigkeit „Macht der Vielen“ erneut eingesetzt wird.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Dein Verbündeter greift an!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Dein Verbündeter begibt sich auf diese Position.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Dein Verbündeter folgt dir.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Diesen Charakter findet man mit einer bestimmten Heldenrüstungsfähigkeit.
actors.hero.abilities.cleric.powerofmany$lightally.name=Lichtverbündeter
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Dieser Verbündete wurde durch die Macht der Vielen gestärkt, wodurch er +25%% Schaden verursacht und -25%% Schaden erleidet. Er teilt außerdem seine Sichtweite mit dem Kleriker und profitiert von Zaubern der Macht der Vielen.\n\nDie Macht der Vielen bleibt bestehen, wenn sich Verbündete wie prismatische Bilder verstecken, ihre Dauer läuft jedoch weiter ab.\n\nVerbleibende Runden: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=Macht der Vielen
actors.hero.abilities.cleric.powerofmany.ally_exists=Sie haben bereits einen einflussreichen Verbündeten.
actors.hero.abilities.cleric.powerofmany.desc=Der Kleriker kanalisiert die „Macht der Vielen“, die entweder einen bestehenden Verbündeten stärkt oder einen neuen, gestärkten Verbündeten für 100 Runden erschafft. Wird ein leerer Bereich anvisiert, entsteht ein neuer Verbündeter. Solange die „Macht der Vielen“ wirkt, verursacht jeder Verbündete +25 % Schaden, erleidet -25 % Schaden und teilt seine Sicht mit dem Kleriker. Außerdem erhält er 25 Schildpunkte, wenn die Fähigkeit eingesetzt wird. Der Kleriker erhält zudem drei neue Zauber, die nur mit einem gestärkten Verbündeten gewirkt werden können. Die „Macht der Vielen“ endet nicht, solange einer dieser Zauber aktiv ist.
actors.hero.abilities.cleric.powerofmany.name=Macht der Vielen
actors.hero.abilities.cleric.powerofmany.no_vision=Man kann keinen Ort anvisieren, den man nicht sehen kann.
actors.hero.abilities.cleric.powerofmany.only_allies=Man kann nur Verbündete stärken.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Richte dein Licht, Verbündeter
actors.hero.abilities.cleric.powerofmany.prompt_default=Wähle einen Verbündeten oder einen Ort
actors.hero.abilities.cleric.powerofmany.short_desc=Der Kleriker kanalisiert die _Macht der Vielen_, um einen bestehenden Verbündeten zu stärken oder einen neuen zu erschaffen.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Dem Körperformular zuweisen
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Dem Mind-Formular zuordnen
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Der Geisterform zuweisen
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Wählen Sie einen Effekt aus, der in Trinity angewendet werden soll. Weitere Informationen werden vor der Bestätigung angezeigt.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Körperform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Geistform: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Geistgestalt: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Wählen Sie die gewünschte Form von Trinity aus. Die Effekte verschiedener Formen können gleichzeitig aktiv sein.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity wird den Fernalchemie-Effekt dieses Artefakts anwenden, was _%2$s Ladung kostet.
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity wird den passiven Gesundheitsregenerationseffekt dieses Artefakts für 20 Runden mit _+%1$d_ anwenden, wobei _%2$s Ladungen verbraucht werden.
actors.hero.abilities.cleric.trinity.cost=Die Kosten für das Aufladen dieser Fähigkeit variieren, betragen aber meistens _%d._
actors.hero.abilities.cleric.trinity.desc=Der Kleriker erhält eine „Dreifaltigkeit“ von Rüstungsfähigkeiten, die mithilfe dreier neuer Zauber verschiedenen Gegenstandseffekten zugewiesen werden können. Jeder dieser Zauber konzentriert sich darauf, die Effekte unterschiedlicher Ausrüstungsarten zu imitieren, die der Kleriker in diesem Durchgang identifiziert hat: Körperform (Waffen und Rüstungen), Geistesform (Zauberstäbe und Wurfwaffen) und Spiritusform (Ringe und Artefakte). Jede Dreifaltigkeitsform kann jeweils mit einem Effekt versehen werden, und der Kleriker wählt bei der Anwendung von Dreifaltigkeit den zu aktivierenden Effekt aus. Dreifaltigkeit dupliziert nicht den Effekt bereits ausgerüsteter Gegenstände.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity wird den Effekt dieses Artefakts nutzen, um einen korrumpierten, freundlichen Geist mit den Trefferpunkten eines _+%1$d_ Geistes zu beschwören, was _%2$s Ladungen kostet.
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity wird diesen Effekt für _%1$d Runden_ anwenden, wobei _%2$s Ladungen anfallen.
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity wird den Kettenzauber-Effekt dieses Artefakts mit einer Reichweite von _+%1$d_ anwenden, zum Preis von _%2$s Ladungen.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity wird den Snacking-Effekt dieses Artefakts anwenden, was _%2$s Ladung kostet.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity wird den feindlichen Raubeffekt dieses Artefakts bei _+%1$d_ anwenden, auf Kosten von _%2$s Ladungen.
actors.hero.abilities.cleric.trinity.name=Dreieinigkeit
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity kann keinen Effekt duplizieren, den du bereits ausgerüstet hast!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity hat derzeit für keine ihrer Formen einen festgelegten Effekt; verwende einen ihrer Zauber!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity wird diesen _mächtigen_ Effekt für _%1$d Runden_ anwenden, wobei _%2$s Ladungen verbraucht werden.
actors.hero.abilities.cleric.trinity.ring_use=Trinity wird den Effekt dieses Rings für 20 Runden bei _+%1$d_ anwenden, was _%2$s Ladungen kostet.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity wird den Wurzeleffekt dieses Artefakts mit einem zufälligen schädlichen Startwert anwenden, was _%2$s Ladung kostet.
actors.hero.abilities.cleric.trinity.short_desc=Der Kleriker erhält eine _Dreifaltigkeit_ an Fähigkeiten, die Ausrüstung nachahmen, die er gesehen hat, und die durch den Einsatz neuer Zauber zugewiesen werden können.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity wird den Einfügeeffekt dieses Artefakts anwenden, was _%2$s Ladung kostet.
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity wird den Wahrsageeffekt dieses Artefakts bei _+%1$d_ anwenden, auf Kosten von _%2$s Ladungen.
actors.hero.abilities.cleric.trinity.thrown_use=Trinity wird diese Waffe auf _+%1$d_ werfen, was _%2$s Ladung kostet.
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity wird den Zeitstopp-Effekt dieses Artefakts mit einer Dauer von _%1$d_ Runden anwenden, was _%2$s Ladungen kostet.
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity wendet den zufälligen Schriftrolleneffekt dieses Artefakts mit einer Wahrscheinlichkeit von _%1$d/10_ an, um die exotische Version ohne zusätzliche Kosten, jedoch gegen eine Gebühr von _%2$s_, anzubieten.
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity wird diesen _mehrfach aufladbaren_ Zauberstab mit _+%1$d_ aufladen, was _%2$s_ Ladung kostet.
actors.hero.abilities.cleric.trinity.wand_use=Trinity wird diesen Zauberstab mit _+%1$d_ zum Preis von _%2$s Ladung bestrahlen.
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Diese Figur nimmt an einem Duell teil. Sie und ihre Verbündeten oder Diener dürfen sich normal verhalten, während andere eingefroren sind. Das Duell dauert eine festgelegte Zeit, bis ein Teilnehmer stirbt oder die Teilnehmer sich mehr als 5 Felder voneinander entfernen. Verbleibende Züge: 0
actors.hero.abilities.duelist.challenge$duelparticipant.name=Duellteilnehmer
actors.hero.abilities.duelist.challenge.ally_target=Du kannst nur Feinde herausfordern.
actors.hero.abilities.duelist.challenge.already_dueling=Man kann immer nur in einem Duell gleichzeitig sein.
actors.hero.abilities.duelist.challenge.desc=Die Duellantin fordert einen Gegner in der Nähe zum Duell heraus. Dieser Gegner ist gezwungen, gegen sie zu kämpfen, während alle anderen Gegner vorübergehend in der Zeit eingefroren sind. Das Ziel muss erreichbar und innerhalb von 5 Feldern von der Duellantin sein. Das Duell dauert bis zum Ablauf von 10 Runden, bis der Gegner stirbt oder die Duellantin mehr als 5 Felder vom Gegner entfernt ist. Eingefrorene Gegner sind unverwundbar. Die Verbündeten der Duellantin werden durch diese Fähigkeit nicht eingefroren, aber wenn ein Boss anvisiert wird, werden auch seine Diener nicht eingefroren.
actors.hero.abilities.duelist.challenge.distant_target=Dieser Feind ist zu weit entfernt, um ihn herauszufordern.
actors.hero.abilities.duelist.challenge.name=Herausforderung
actors.hero.abilities.duelist.challenge.prompt=Wähle einen Gegner, den du herausfordern willst.
actors.hero.abilities.duelist.challenge.short_desc=Der Duellant fordert einen Gegner in der Nähe zum Duell heraus und friert dabei vorübergehend alle anderen Gegner ein.
actors.hero.abilities.duelist.challenge.unreachable_target=Sie müssen in der Lage sein, Ihr Ziel zu erreichen.
actors.hero.abilities.duelist.elementalstrike.desc=Der Duellant greift einen Gegner oder einen Ort an und führt einen normalen Angriff aus, der garantiert trifft und einen magischen Effekt auslöst, der sich in einem 65-Grad-Kegel bis zu 4 Felder weit ausbreitet. Dieser magische Effekt variiert je nach Verzauberung der Hauptwaffe des Duellanten.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Ein Elementarschlag ohne Verzauberung setzt einen kleinen Magieausbruch frei, der allen Feinden in Reichweite 6-12 Schaden zufügt.
actors.hero.abilities.duelist.elementalstrike.name=Elementarschlag
actors.hero.abilities.duelist.elementalstrike.short_desc=Die Duellantin führt einen _Elementarschlag_ aus, der einen Effekt in einem kegelförmigen Wirkungsbereich verbreitet, der auf der Verzauberung ihrer Waffe basiert.
actors.hero.abilities.duelist.feint.bad_location=Sie können nicht an diesen Ort ziehen.
actors.hero.abilities.duelist.feint.desc=Die Duellantin täuscht einen Angriff an, während sie auf ein angrenzendes Feld sprintet und dabei kurzzeitig ein Nachbild von sich hinterlässt. Gegner, die die Duellantin angegriffen haben, greifen stattdessen ihr Nachbild an. Gegner, die das Nachbild angreifen, werden verwirrt, wodurch ihre nächste Aktion abgebrochen wird und sie einem Überraschungsangriff ausgesetzt sind.
actors.hero.abilities.duelist.feint.name=Finte
actors.hero.abilities.duelist.feint.prompt=Wähle einen Ort aus, zu dem du sprinten möchtest.
actors.hero.abilities.duelist.feint.short_desc=Die Duellantin täuscht einen Angriff an, während sie auf ein angrenzendes Feld sprintet. Gegner greifen ihr Nachbild an und sind so einem Gegenangriff ausgesetzt.
actors.hero.abilities.duelist.feint.too_far=Dieser Standort befindet sich nicht in Ihrer Nähe.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Die Jägerin erhält kurzzeitig einen Stärkungszauber, der ihre Bewegungs- und Angriffsgeschwindigkeit mit ihrem Bogen erhöht.\n\nVerbleibende Züge: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=die Kraft der Natur
actors.hero.abilities.huntress.naturespower.desc=Die Jägerin verstärkt sich und ihren Bogen vorübergehend mit der Macht der Natur! Dieser Effekt hält 8 Runden an. Während dieser Zeit bewegt sich die Jägerin doppelt so schnell und greift mit ihrem Bogen 33 % schneller an. Die Bonus-Bogeneffekte werden nicht ausgelöst, wenn die Scharfschützin ihre Spezialangriffe einsetzt.
actors.hero.abilities.huntress.naturespower.name=die Kraft der Natur
actors.hero.abilities.huntress.naturespower.short_desc=Die Jägerin ruft die _Kraft der Natur_ an und erhöht so für kurze Zeit ihre Bewegungsgeschwindigkeit und die Feuerrate ihres Bogens.
actors.hero.abilities.huntress.spectralblades.desc=Die Jägerin schleudert eine Geisterklinge auf einen Feind, die wie ein Fernkampfangriff ihrer Nahkampfwaffe wirkt. Alle normalen Effekte einer Nahkampfwaffe werden aktiviert, einschließlich Verzauberungen.
actors.hero.abilities.huntress.spectralblades.name=Spektralklingen
actors.hero.abilities.huntress.spectralblades.short_desc=Die Jägerin wirft _Spektralklingen_ auf ein Ziel und verursacht Schaden, der von ihrer aktuell ausgerüsteten Nahkampfwaffe abhängt.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Ein magischer Falke, von der Jägerin herbeigerufen. Er leuchtet in einem hellen, ätherischen Blau und sein Kopf bewegt sich ständig, während er die Gegend absucht. Obwohl er kein besonders starker Kämpfer ist, eignen sich seine Geschwindigkeit und sein Sehvermögen hervorragend zum Spähen und Ablenken von Feinden.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Verbleibende garantierte Ausweichmanöver: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Verbleibende Umdrehungen: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Dein Falke greift an!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Ihr Falke bewegt sich in diese Position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Dein Falke folgt dir.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Diesen Charakter findet man mit einer bestimmten Heldenrüstungsfähigkeit.
actors.hero.abilities.huntress.spirithawk$hawkally.name=Geisterfalke
actors.hero.abilities.huntress.spirithawk.desc=Die Jägerin beschwört einen Geisterfalken als Vertrauten, der durch erneuten Einsatz der Fähigkeit gelenkt werden kann, solange er beschworen ist. Der Falke bleibt 100 Runden lang bestehen; das Lenken des Falken kostet keine Energie. Der Falke verfügt über geringe Lebenspunkte und Angriffskraft, ist aber schnell, ausweichend und treffsicher. Er teilt sein gesamtes Sichtfeld permanent mit der Jägerin. Er ist immun gegen alle Flächeneffekte wie Feuer und Giftgas. Er greift nur an, wenn er explizit dazu aufgefordert wird.
actors.hero.abilities.huntress.spirithawk.name=Geisterfalke
actors.hero.abilities.huntress.spirithawk.no_space=In Ihrer Nähe ist kein Platz mehr frei.
actors.hero.abilities.huntress.spirithawk.short_desc=Die Jägerin beschwört einen _Geisterfalken_ als Vertrauten, der ihr helfen kann, Orte auszukundschaften und Feinde abzulenken.
actors.hero.abilities.mage.elementalblast.desc=Der Magier entfesselt einen magischen Strahl, der einen kreisförmigen Bereich mit bis zu vier Feldern Radius abdeckt und 15–25 Schadenspunkte verursacht. Die genaue Wirkung des Elementarstrahls hängt vom Zauberstab ab, der im Stab des Magiers steckt.
actors.hero.abilities.mage.elementalblast.generic_desc=Die Wirkung des Elementarstoßes ist ähnlich der Wirkung des Zauberstabs, wenn er auf einen Feind oder Verbündeten gerichtet wird.
actors.hero.abilities.mage.elementalblast.name=Elementarschlag
actors.hero.abilities.mage.elementalblast.no_staff=Diese Fähigkeit kannst du nicht ohne deine Mitarbeiter nutzen.
actors.hero.abilities.mage.elementalblast.short_desc=Der Magier erzeugt mit seinem Stab einen _Elementarstoß_, der einen großen Bereich um ihn herum erfasst. Die Wirkung variiert je nach dem Zauberstab in seinem Stab.
actors.hero.abilities.mage.warpbeacon.depths=Man kann nicht zwischen verschiedenen Tiefen hin- und herspringen!
actors.hero.abilities.mage.warpbeacon.desc=Der Magier platziert ein Leuchtfeuer, zu dem er sich nach Belieben teleportieren kann. Das Platzieren des Leuchtfeuers dauert eine Runde, die Teleportation dorthin erfolgt jedoch sofort. Der Magier kann standardmäßig nicht zwischen Ebenen teleportieren oder das Leuchtfeuer nutzen, um unzugängliche Orte wie verschlossene Räume zu erreichen. Der Magier kann sich in Gegner hineinteleportieren, wodurch diese beiseite gestoßen werden.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Dort kann man keinen Leuchtfeuerplatz platzieren!
actors.hero.abilities.mage.warpbeacon.locked_floor=Man kann eine abgeschlossene Etage nicht verlassen!
actors.hero.abilities.mage.warpbeacon.name=Warp-Leuchtfeuer
actors.hero.abilities.mage.warpbeacon.short_desc=Der Magier platziert einen _Warping-Leuchtfeuer_ an seinem aktuellen Standort, zu dem er sich sofort zurückteleportieren kann.
actors.hero.abilities.mage.warpbeacon.too_far=Dieser Standort ist zu weit entfernt!
actors.hero.abilities.mage.warpbeacon.window_cancel=stornieren
actors.hero.abilities.mage.warpbeacon.window_clear=klares Leuchtfeuer
actors.hero.abilities.mage.warpbeacon.window_desc=Ihr Beacon befindet sich derzeit auf Etage %d.
actors.hero.abilities.mage.warpbeacon.window_tele=Teleport zum Leuchtfeuer
actors.hero.abilities.mage.wildmagic.desc=Der Magier entfesselt die Kraft seiner Zauberstäbe und feuert sie in einer Runde bis zu viermal zufällig ab. Der Stab des Magiers ist von diesem Effekt nicht betroffen. Jeder Zauberstab erhält zudem eine um 2 erhöhte Stufe, maximal +3. Diese Fähigkeit verbraucht pro Schuss eine halbe Zauberstabladung, und kein Zauberstab kann mehr als zweimal abgefeuert werden.
actors.hero.abilities.mage.wildmagic.name=wilde Magie
actors.hero.abilities.mage.wildmagic.no_wands=Du hast keine Zauberstäbe zum Zappen!
actors.hero.abilities.mage.wildmagic.short_desc=Der Magier entfesselt die in seinen Zauberstäben enthaltene _Wilde Magie_ und feuert sie in einer einzigen Runde mehrmals zufällig auf ein gewähltes Ziel ab.
actors.hero.abilities.ratmogrify$transmograt.desc=Dieser Feind wurde in eine Ratte verwandelt. Eine deutliche Verbesserung, wenn ihr mich fragt! – Rattenkönig
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Getötet von: einem ratmogrifizierten Feind
actors.hero.abilities.ratmogrify.cant_transform=Das kann man nicht ratmogrifizieren!
actors.hero.abilities.ratmogrify.desc=Der Held verwandelt einen Gegner für 6 Runden in eine Ratte! Bosse, Verbündete und Ratten können nicht in Ratten verwandelt werden. Rattenverwandelte Gegner behalten ihre ursprünglichen Werte, haben aber keine Fähigkeiten mehr.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=Der Held _verwandelt_ einen Feind in eine Ratte! Dadurch wird dieser vorübergehend in eine Ratte ohne Fähigkeiten verwandelt.
actors.hero.abilities.ratmogrify.too_strong=Dieser Feind ist zu stark, um ihn zu ratmogrifizieren!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Dieser Gegner wurde markiert, wodurch er 25%% Bonusschaden erleidet, aber auch unsterblich wird, bis die Markierung endet.\n\nVerbleibende Züge: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=Zum Tode verurteilt
actors.hero.abilities.rogue.deathmark.ally_target=Man kann nur Feinde markieren
actors.hero.abilities.rogue.deathmark.desc=Der Schurke belegt einen ausgewählten Gegner mit einem Mal, wodurch dieser 25 % mehr Schaden erleidet. Das Mal wird sofort angewendet und hält 5 Runden an. Markierte Gegner erleiden Bonusschaden, können aber erst sterben, wenn das Mal abgelaufen ist. Hat ein Gegner 0 LP, wenn das Mal endet, stirbt er sofort.
actors.hero.abilities.rogue.deathmark.name=Todeszeichen
actors.hero.abilities.rogue.deathmark.short_desc=Der Schurke belegt einen ausgewählten Feind mit einem Todesmal. Gezeichnete Feinde erleiden Bonusschaden, können aber erst sterben, wenn das Mal endet.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Eine Kopie des Schurken, erschaffen aus schattenhafter Dunkelheit. Sie steht regungslos da, mit leeren Augen, aus denen winzige Dunkelheitsfetzen wie Dampf aufsteigen. Der Klon ist keine perfekte Kopie des Schurken, aber dennoch ein brauchbarer Kämpfer und kann mit den richtigen Talenten von dessen Ausrüstung profitieren.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Dein Klon greift an!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Ihr Klon bewegt sich an diese Position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Dein Klon folgt dir.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Diesen Charakter findet man mit einer bestimmten Heldenrüstungsfähigkeit.
actors.hero.abilities.rogue.shadowclone$shadowally.name=Schattenschurke
actors.hero.abilities.rogue.shadowclone.desc=Der Schurke beschwört ein schattenhaftes Abbild seiner selbst, das er im Kampf einsetzen kann. Das Steuern des Schattenklons kostet keine Ladung. Der Klon besitzt 80 Trefferpunkte, keine Rüstung und verursacht 10–20 Schaden. Alle diese Eigenschaften lassen sich durch Talente verbessern, sodass der Klon von den Waffen und der Rüstung des Helden profitiert.
actors.hero.abilities.rogue.shadowclone.name=Schattenklon
actors.hero.abilities.rogue.shadowclone.short_desc=Der Schurke beschwört einen Schattenklon, der ihm im Kampf zur Seite stehen kann.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Irgendwie lassen sich die Feinde leicht davon überzeugen, dass diese hölzerne Attrappe der wahre Schurke ist!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Diesen Charakter findet man mit einer bestimmten Heldenrüstungsfähigkeit.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=Holzlockvogel
actors.hero.abilities.rogue.smokebomb.desc=Der Schurke wirft eine Rauchbombe und teleportiert sich bis zu 6 Felder weit. Er kann sich durch Hindernisse und Gegner teleportieren, aber nicht durch festes Gelände wie Wände. Gegner, die sich in der Nähe der vorherigen Position des Schurken befinden, werden für 5 Runden geblendet.
actors.hero.abilities.rogue.smokebomb.fov=Du kannst nur zu einem leeren Ort in deinem Sichtfeld springen.
actors.hero.abilities.rogue.smokebomb.name=Rauchbombe
actors.hero.abilities.rogue.smokebomb.prompt=Wähle einen Ort aus, zu dem du springen möchtest.
actors.hero.abilities.rogue.smokebomb.short_desc=Der Schurke wirft eine Rauchbombe und teleportiert sich weg. Er blendet Feinde in der Nähe seines vorherigen Standorts.
actors.hero.abilities.warrior.endure$enduretracker.desc=Der Krieger verursacht nun Bonusschaden basierend auf dem erlittenen Schaden. Bonusschaden: \n\nVerbleibende Treffer: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=Ausdauer
actors.hero.abilities.warrior.endure.desc=Der Krieger ist 3 Runden lang immun und erleidet nur halben Schaden aus allen Quellen. Diese Schadensreduktion wird vor Schadensresistenzeffekten wie Rüstung angewendet. Nach Ablauf der Immunität verursacht der nächste Treffer des Kriegers innerhalb von 10 Runden Bonusschaden. Dieser Bonusschaden entspricht der Hälfte des gesamten Schadens, der ihm während der Immunität zugefügt wurde, vor jeglichen Schadensreduktionseffekten! Verfügt der Krieger über eine Kombo, verlängert die Nutzung dieser Fähigkeit deren verbleibende Dauer um 3 Runden.
actors.hero.abilities.warrior.endure.name=aushalten
actors.hero.abilities.warrior.endure.short_desc=Der Krieger hält durch, überspringt mehrere Runden, erhält aber eine hohe Schadensresistenz. Anschließend verursacht er Bonusschaden basierend auf dem erlittenen Schaden.
actors.hero.abilities.warrior.heroicleap.desc=Der Krieger springt auf ein anvisiertes Ziel zu und überwindet dabei alle Feinde und Hindernisse. Über Mauern oder anderes festes Gelände kann er jedoch nicht springen.
actors.hero.abilities.warrior.heroicleap.name=Heldenhafter Sprung
actors.hero.abilities.warrior.heroicleap.prompt=Wähle die Sprungrichtung.
actors.hero.abilities.warrior.heroicleap.short_desc=Der Krieger vollführt einen _heroischen Sprung_ zu einem anvisierten Ort und gleitet dabei über Feinde und Gefahren hinweg.
actors.hero.abilities.warrior.shockwave.desc=Der Krieger schlägt auf den Boden und erzeugt eine Schockwelle, die sich in einem 60°-Kegel bis zu 5 Felder weit ausbreitet. Gegner, die von dieser Schockwelle erfasst werden, sind 5 Runden lang geschwächt. Sie erleiden außerdem 5–10 Schadenspunkte sowie zusätzlich 1–2 Schadenspunkte für jeden Stärkepunkt des Kriegers über 10.
actors.hero.abilities.warrior.shockwave.name=Schockwelle
actors.hero.abilities.warrior.shockwave.short_desc=Der Krieger erzeugt durch einen Schlag auf den Boden eine Schockwelle in einem kegelförmigen Wirkungsbereich. Gegner, die von der Schockwelle getroffen werden, erleiden Schaden und werden kampfunfähig.
actors.hero.hero.key_distracted=Das Schloss lässt sich nicht ganz öffnen, Sie müssen es weiter versuchen.
actors.hero.hero.leave=Du kannst noch nicht gehen, der Rest des Verlieses erwartet dich unten!
actors.hero.hero.level_cap=Du kannst dadurch nicht stärker werden, aber deine Erfahrungen verleihen dir einen Kraftschub!
actors.hero.hero.level_up=Aufsteigen!
actors.hero.hero.locked_chest=Diese Truhe ist verschlossen und Sie haben keinen passenden Schlüssel.
actors.hero.hero.locked_door=Sie haben keinen passenden Schlüssel.
actors.hero.hero.name=Du
actors.hero.hero.new_level=Levelaufstieg! +Treffsicherheit, +Ausweichen, +5 LP!
actors.hero.hero.new_talent=+1 Talentpunkt!
actors.hero.hero.noticed_smth=Dir ist etwas aufgefallen.
actors.hero.hero.pain_resist=Der Schmerz hilft dir, dem Drang zum Schlafen zu widerstehen.
actors.hero.hero.revive=Das Ankh explodiert vor lebensspendender Energie!
actors.hero.hero.search=suchen
actors.hero.hero.search_distracted=Es ist schwer, sich zu konzentrieren, die Suche ist anstrengend.
actors.hero.hero.unspent=Du hast noch ungenutzte Talentpunkte!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Sie können nicht mitführen: %s.
actors.hero.hero.you_now_have=Sie haben Folgendes empfangen: %s.
actors.hero.heroclass.cleric=Kleriker
actors.hero.heroclass.cleric_desc=Der Kleriker beginnt mit einem einzigartigen heiligen Buch, mit dem er verschiedene Zauber wirken kann. Die meisten Talente des Klerikers konzentrieren sich auf das Erlernen oder Verbessern von Zaubern. Der Kleriker beginnt außerdem mit einem Knüppel, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel. Der Kleriker identifiziert automatisch: Schriftrollen der Identifizierung, Tränke der Reinheit, Schriftrollen der Fluchaufhebung.
actors.hero.heroclass.cleric_desc_short=Der Kleriker ist ein göttlicher Zauberwirker, der mithilfe seines einzigartigen heiligen Buches göttliche Magie wirkt. Er kann Zauber durch Talente erlernen und verbessern.
actors.hero.heroclass.cleric_unlock=Um den Kleriker freizuschalten, muss der Fluch auf allen verfluchten Ausrüstungsgegenständen vollständig entfernt werden.
actors.hero.heroclass.duelist=Duellant
actors.hero.heroclass.duelist_desc=Der Duellant beginnt mit einem einzigartigen Rapier mit einer Spezialfähigkeit, die sich mit der Zeit wieder auflädt. Jede Waffe im Spiel besitzt eine andere Spezialfähigkeit, die der Duellant einsetzen kann. Der Duellant startet außerdem mit zwei Wurfspießen, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel. Der Duellant identifiziert automatisch: Schriftrollen der Identifizierung, Tränke der Stärke und Schriftrollen des Spiegelbildes.
actors.hero.heroclass.duelist_desc_short=Die Duellantin ist eine Waffenmeisterin, die ihre Waffe nutzen kann, um eine _spezielle Waffenfähigkeit_ auszulösen. Diese Spezialfähigkeit _ist für jede Waffe unterschiedlich._
actors.hero.heroclass.duelist_unlock=Um den Duellanten freizuschalten, muss eine Waffe der Stufe 2 oder höher ohne Stärkeabzug ausgerüstet werden.
actors.hero.heroclass.huntress=Jägerin
actors.hero.heroclass.huntress_desc=Die Jägerin beginnt mit einem einzigartigen Geisterbogen, der unendlich viele beschworene Pfeile abfeuern kann. Sie kann sich durch hohes Gras bewegen, ohne es zu zertreten. Außerdem besitzt sie zu Beginn genietete Handschuhe, eine Stoffrüstung, einen Wasserschlauch und einen Samtbeutel. Die Jägerin erkennt automatisch: Schriftrollen der Identifizierung, Tränke der Geistessicht und Schriftrollen des Wiegenlieds.
actors.hero.heroclass.huntress_desc_short=Die Jägerin beherrscht Wurfwaffen meisterhaft und besitzt einen magischen Bogen mit unendlich vielen Pfeilen. Außerdem kann sie sich durch hohes Gras bewegen, ohne es zu zertreten.
actors.hero.heroclass.huntress_unlock=Um die Jägerin freizuschalten, musst du Gegner in einem Spiel 10 Mal mit Wurfwaffen treffen.
actors.hero.heroclass.mage=Magier
actors.hero.heroclass.mage_desc=Der Magier beginnt mit einem einzigartigen Stab, der sich deutlich schneller auflädt als ein Zauberstab und eine Ladung mehr besitzt. Der Stab kann mit jedem Zauberstab verstärkt werden, den der Magier im Dungeon findet. Der Magier beginnt außerdem mit einem Zauberstab des Magischen Geschosses, der in seinen Stab, eine Stoffrüstung, einen Wasserschlauch und einen Samtbeutel eingebettet ist. Der Magier identifiziert automatisch: Schriftrollen der Identifizierung, Tränke der Flüssigen Flamme, Schriftrollen der Verbesserung.
actors.hero.heroclass.mage_desc_short=Der Magier ist ein Experte für arkane Magie und trägt einen magischen Stab, der stärker ist als ein Zauberstab. Der Stab kann mit jedem Zauberstab, den der Magier findet, verstärkt werden.
actors.hero.heroclass.mage_unlock=Um den Magier freizuschalten, verwende eine Aufwertungsrolle, um einen Gegenstand zu verstärken.
actors.hero.heroclass.rogue=Schurke
actors.hero.heroclass.rogue_desc=Der Schurke beginnt mit einem einzigartigen Schattenumhang, mit dem er sich nach Belieben unsichtbar machen kann. Er kann Geheimnisse und Fallen aus größerer Entfernung aufspüren. Außerdem verfügt er zu Beginn über einen Dolch, drei Wurfmesser, eine Stoffrüstung, einen Wasserschlauch und einen Samtbeutel. Der Schurke identifiziert automatisch: Schriftrollen der Identifizierung, Tränke der Unsichtbarkeit und Schriftrollen der magischen Kartierung.
actors.hero.heroclass.rogue_desc_short=Der Schurke kann Feinden ausweichen und mithilfe seines Schattenmantels aus der Unsichtbarkeit heraus angreifen. Außerdem kann er Geheimnisse und Fallen aus größerer Entfernung aufspüren.
actors.hero.heroclass.rogue_unlock=Um den Schurken freizuschalten, musst du 10 Überraschungsangriffe in einem Spiel ausführen.
actors.hero.heroclass.warrior=Krieger
actors.hero.heroclass.warrior_desc=Der Krieger beginnt mit einem einzigartigen, zerbrochenen Siegel, das ihm einen Schutzschild verleiht, sobald seine Gesundheit unter die Hälfte fällt. Das Siegel kann zwischen verschiedenen Rüstungen übertragen werden und überträgt dabei eine einzelne Verbesserung. Der Krieger beginnt außerdem mit einem abgenutzten Kurzschwert, drei Wurfsteinen, einer Stoffrüstung, einem Wasserschlauch und einem Samtbeutel. Der Krieger erkennt automatisch: Schriftrollen der Identifizierung, Heiltränke und Schriftrollen des Zorns.
actors.hero.heroclass.warrior_desc_short=Der Krieger erleidet durch den Schutzschild seines _gebrochenen Siegels_ zusätzlichen Schaden. Das Siegel kann zwischen verschiedenen Rüstungen übertragen werden und _überträgt eine einzelne Verbesserung._
actors.hero.heroclass.warrior_unlock=Der Krieger wird automatisch freigeschaltet.
actors.hero.herosubclass.assassin=Attentäter
actors.hero.herosubclass.assassin_desc=Der Assassine bereitet seinen nächsten Angriff vor, während er unsichtbar wird. Je länger die Vorbereitung dauert, desto stärker wird sein nächster Angriff. Die Vorbereitungszeit beträgt bis zu 9 Runden. Nach der Vorbereitung verursacht der Assassine Bonusschaden bei seinem nächsten Angriff, kann sich zu seinem Ziel teleportieren und sogar schwache Gegner sofort töten.
actors.hero.herosubclass.assassin_short_desc=Der Assassine kann einen tödlichen Angriff vorbereiten, während er unsichtbar ist. Je länger er wartet, desto verheerender wird der Angriff sein.
actors.hero.herosubclass.battlemage=Kampfmagier
actors.hero.herosubclass.battlemage_desc=Der Kampfmagier erhält einen Bonuseffekt, wenn er im Nahkampf mit seinem Stab zuschlägt, als ob sein Stab zusätzlich verzaubert wäre. Diese Effekte hängen vom Zauberstab ab, mit dem sein Stab durchdrungen ist; jeder Zauberstab hat seinen eigenen Effekt. Zusätzlich zu den Zauberstab-Effekten erhält der Stab des Kampfmagiers bei jedem Angriff 0,5 Ladungen.
actors.hero.herosubclass.battlemage_short_desc=Der Kampfmagier beschwört Bonuseffekte, wenn er im Nahkampf mit seinem Stab kämpft. Diese Effekte hängen von dem Zauberstab ab, mit dem sein Stab durchdrungen ist.
actors.hero.herosubclass.berserker=Berserker
actors.hero.herosubclass.berserker_desc=Der Berserker gerät in Wut, wenn er physischen Schaden erleidet, selbst wenn dieser von seiner Rüstung abgefangen wird! Die Wut lässt mit der Zeit nach, jedoch langsamer, wenn seine Lebenspunkte niedrig sind. Wut kann den Schaden des Berserkers um bis zu 50 % erhöhen. Bei maximaler Wut kann er in einen Berserkerrausch verfallen, wodurch er kurzzeitig einen Schild erhält und seine Wut so lange aufrechterhält, wie sein Schild noch aktiv ist. Die Stärke des Schildes skaliert mit der Rüstungsstufe des Berserkers und kann bei niedrigen Lebenspunkten massiv erhöht werden. Der Berserker benötigt Zeit, um sich nach einem Berserkerrausch zu erholen.
actors.hero.herosubclass.berserker_short_desc=Der Berserker baut Wut auf, wenn er Schaden erleidet. Wut erhöht seinen Schaden und kann bei 100 % für zusätzlichen Schild aktiviert werden.
actors.hero.herosubclass.champion=Champion
actors.hero.herosubclass.champion_desc=Die Heldin ist eine Meisterin im Nahkampf und kann neben ihrer Primärwaffe eine Sekundärwaffe ausrüsten. Ihre normalen Angriffe nutzen ihre Primärwaffe, doch sie kann diese blitzschnell wechseln und die jeweilige Fähigkeit der Waffe einsetzen. Außerdem erhält sie 2 zusätzliche maximale Waffenfähigkeitsladungen und +50 % Aufladegeschwindigkeit für Waffenfähigkeiten.
actors.hero.herosubclass.champion_short_desc=Die _Championin_ kann zwei Waffen gleichzeitig führen und erhält mehr Waffenladungen. Ihre normalen Angriffe erfolgen mit ihrer Primärwaffe, sie kann aber die Waffen wechseln und die jeweilige Fähigkeit der Waffe nutzen.
actors.hero.herosubclass.freerunner=Freerunner
actors.hero.herosubclass.freerunner_desc=Während sich der Freerunner bewegt, sammelt er Momentum an. Nach 10 Runden kann er bis zu 10 Momentum-Punkte sammeln, verliert diese aber schnell wieder, sobald er stehen bleibt. Der Freerunner kann sein Momentum nutzen, um Freerunning zu starten (2 Runden pro Momentum-Punkt). Beim Freerunning bewegt er sich doppelt so schnell und erhält einen Bonus auf seine Ausweichchance, der proportional zu seinem Level ist. Nach dem Freerunning muss eine Abklingzeit eingehalten werden, bevor sich erneut Momentum aufbauen lässt.
actors.hero.herosubclass.freerunner_short_desc=Der Freerunner baut beim Laufen Schwung auf, den er für Freerunning nutzen kann. Dadurch erhält er kurzzeitig Bonusgeschwindigkeit und Ausweichfähigkeit.
actors.hero.herosubclass.gladiator=Gladiator
actors.hero.herosubclass.gladiator_desc=Der Gladiator erhält jedes Mal einen Kombopunkt, wenn er einen Nahkampf- oder Wurfwaffenangriff erfolgreich ausführt. Gelingt ihm innerhalb von 5 Runden (15 Runden nach einem Kill) kein erfolgreicher Angriff, wird seine Kombo zurückgesetzt. Mit steigender Kombo kann der Gladiator verschiedene Fähigkeiten einsetzen, die garantiert treffen: 2. Kombo: Gegner zurückstoßen, Kombo erhalten; 3. Kombo: Schaden basierend auf der Rüstung verursachen; 4. Kombo: Parieren, Kombo erhalten; 5. Kombo: Ziel und nahe Gegnern Schaden zufügen; 6. Kombo: Einmal pro Kombo angreifen.
actors.hero.herosubclass.gladiator_short_desc=Der Gladiator baut Kombos auf, wenn er erfolgreiche Angriffe ausführt. Er kann Kombos ausgeben, um einzigartige Fähigkeiten einzusetzen.
actors.hero.herosubclass.monk=Mönch
actors.hero.herosubclass.monk_desc=Die Mönchin ist eine Meisterin der Nahkampftechniken. Besiegte Gegner sammeln Energie, die sie für verschiedene defensive und unterstützende Fähigkeiten einsetzen kann. Diese Energie nimmt nicht mit der Zeit ab, ist aber abhängig vom Level der Mönchin begrenzt. \n\n1 Energie: Schneller Faustschlag \n2 Energie: Konzentration zum Ausweichen des nächsten Angriffs \n3 Energie: Blitzschneller Sprint in die Nähe \n4 Energie: Gegner wegstoßen \n5 Energie: Meditation zum Entfernen von Statuseffekten und Aufladen von Zauberstab und Artefakt.
actors.hero.herosubclass.monk_short_desc=Der Mönch sammelt im Kampf Energie. Diese Energie kann er für eine Vielzahl einzigartiger Fähigkeiten einsetzen.
actors.hero.herosubclass.paladin=Paladin
actors.hero.herosubclass.paladin_desc=Der Paladin erhält eine Vielzahl neuer und verbesserter Zauber, die den Nahkampf und die Synergie mit Waffen und Rüstungen betonen. Die Zauber „Heilige Waffe“ und „Heiliger Schutz“ des Paladins gewähren höhere Boni, überschreiben keine bestehenden Verzauberungen und Glyphen mehr und können durch das Wirken anderer Zauber verlängert werden. Der Paladin erhält außerdem den Zauber „Zerschmettern“, mit dem er einen garantierten Nahkampftreffer mit Bonusschaden und Verzauberungsstärke ausführen kann.
actors.hero.herosubclass.paladin_short_desc=Der Paladin erhält neue Zauber mit kurzer Reichweite sowie verstärkte Versionen von Heilige Waffe und Heiliger Schutz.
actors.hero.herosubclass.priest=Priester
actors.hero.herosubclass.priest_desc=Der Priester erhält eine Vielzahl neuer und verbesserter Zauber, die den Fernkampf und die Synergie mit magischen Gegenständen betonen. Er kann einmal alle 50 Runden kostenlos „Leitendes Licht“ wirken, das Gegner, die direkt von seinen Zaubern anvisiert werden, erleuchtet und den Erleuchtungs-Debuff mit Verbündeten, Zauberstäben und einigen Artefakten verbrauchen kann, um zusätzlichen Schaden in Höhe seiner Stufe + 5 zu verursachen. Außerdem erhält er den Zauber „Strahlkraft“, der Dunkelheit vertreibt und alle sichtbaren Gegner betrifft. Er löst den Erleuchtungs-Debuff aus, wendet ihn an und betäubt die Gegner kurzzeitig. Der Zauber kostet 2 Ladungen.
actors.hero.herosubclass.priest_short_desc=Der Priester erhält neue Fernkampfzauber und eine verstärkte Version von Leitlicht.
actors.hero.herosubclass.sniper=Scharfschütze
actors.hero.herosubclass.sniper_desc=Die Scharfschützin ist eine Meisterin des Fernkampfs. Ihre Angriffe durchdringen die Rüstung ihrer Gegner. Wenn sie einen Feind mit einer Wurfwaffe angreift, markiert sie ihn mit einem Scharfschützen-Zeichen, wodurch sie mit einem Spezialangriff ihres Bogens nachsetzen kann. Dieser Spezialangriff variiert je nach den Verbesserungen ihres Bogens. Ein nicht verbesserter Bogen verschießt einen Schnellschuss, der reduzierten Schaden verursacht, aber sofort abgefeuert wird. Ein Geschwindigkeitsbogen verschießt drei Pfeile, die ebenfalls reduzierten Schaden verursachen, aber weiterhin Verzauberungen aktivieren können und eine Runde zum Abfeuern benötigen. Ein Schadensbogen verschießt einen Scharfschützenschuss, der garantiert trifft, Bonusschaden basierend auf der Entfernung verursacht und zwei Runden zum Abfeuern benötigt.
actors.hero.herosubclass.sniper_short_desc=Die Scharfschützin kann mit ihren Fernkampfangriffen Rüstungen durchdringen. Nach einem Treffer mit einer Wurfwaffe kann sie mit einem Spezialangriff aus ihrem Bogen nachsetzen.
actors.hero.herosubclass.warden=Aufseher
actors.hero.herosubclass.warden_desc=Die Wächterin besitzt eine tiefe Verbindung zur Natur, die ihr verschiedene Bonuseffekte im Zusammenhang mit Gras und Pflanzen verleiht. Sie kann durch hohes und gefurchtes Gras hindurchsehen, als wäre es leerer Raum. Die Wächterin lässt Gras um jeden Samen sprießen, den sie wirft oder pflanzt, und erhält Spezialeffekte, wenn sie Pflanzen zertritt. Diese Spezialeffekte ersetzen die normalen Pflanzeneffekte, sodass keine Pflanze für sie schädlich ist, wenn sie darauf tritt.
actors.hero.herosubclass.warden_short_desc=Die Wächterin kann durch hohes Gras hindurchsehen und erhält Bonuseffekte, wenn sie Samen pflanzt und Pflanzen zertritt.
actors.hero.herosubclass.warlock=Hexenmeister
actors.hero.herosubclass.warlock_desc=Der Hexenmeister hat die Chance, Charaktere mit einem Seelenmal zu belegen, wenn er Zauberstäbe gegen sie einsetzt. Die Chance, ein Seelenmal anzuwenden, und seine Dauer erhöhen sich mit der Stufe des Zauberstabs. Wenn ein Gegner mit einem Seelenmal belegt ist, heilt der Hexenmeister ihn um 2 Lebenspunkte für je 5 Schadenspunkte, die er ihm zufügt – jedoch nur bei Angriffen mit Nahkampfwaffen oder Wurfwaffen, nicht mit Zauberstäben!
actors.hero.herosubclass.warlock_short_desc=Der Hexenmeister hat die Chance, Feinde mit seinen Zauberstäben zu seelenmarkieren. Er heilt sich jedes Mal, wenn er markierten Feinden physischen Schaden zufügt.
actors.hero.spells.auraofprotection$aurabuff.desc=Der Paladin strahlt schützende Energie um sich herum aus. Alle Verbündeten in der Nähe (einschließlich des Paladins selbst) erleiden weniger Schaden und erhalten den Effekt der Rüstungsglyphe des Paladins mit erhöhter Stärke. Verbleibende Züge:
actors.hero.spells.auraofprotection$aurabuff.name=Aura des Schutzes
actors.hero.spells.auraofprotection.desc=Der Paladin strahlt 20 Runden lang schützende Energie in Form einer funkelnden Aura um sich herum aus. Alle Verbündeten innerhalb von 2 Feldern um den Paladin (einschließlich des Paladins selbst) erleiden %1$d%% weniger Schaden und erhalten den Effekt der Rüstungsglyphe des Paladins mit +%2$d%% Stärke.\n\n Diese Schadensreduktion wirkt vor anderen schadensreduzierenden Effekten (z. B. Rüstung). Die Glyphenstärkeerhöhung wird immer angewendet, jedoch kann dieser Zauber die Glyphe des Paladins nicht mehr als einmal aktivieren, wenn ein Charakter bereits davon profitiert (z. B. der Paladin selbst oder ein prismatisches Bild).
actors.hero.spells.auraofprotection.name=Aura des Schutzes
actors.hero.spells.auraofprotection.short_desc=Erhöht die Verteidigung des Paladins und naher Verbündeter.
actors.hero.spells.beamingray$beamingrayboost.desc=Dieser Verbündete wurde kürzlich von Beaming Ray teleportiert, wodurch er nach der Teleportation Bonusschaden gegen den nächsten Gegner erleidet. Die Macht der Vielen läuft ebenfalls nicht ab, solange dieser Buff aktiv ist. \n\n Verbleibende Züge: %s.
actors.hero.spells.beamingray$beamingrayboost.name=strahlender Strahl
actors.hero.spells.beamingray.desc=Der Kleriker bündelt die Kraft seines Verbündeten in einem Lichtstrahl, der ihn an einen Zielort teleportiert. Trifft der Strahl auf einen Gegner, wird der Verbündete in dessen Nähe platziert und auf den Gegner zugelenkt. Der Strahl hat eine maximale Reichweite von %1$d Feldern und erhöht den Bonusschaden von „Macht der Vielen“ für 10 Runden gegen den nächsten Gegner innerhalb von 4 Feldern auf +%2$d%%. Der Strahl kann sogar normalerweise unbewegliche Verbündete teleportieren, seine Reichweite halbiert sich in diesen Fällen jedoch.
actors.hero.spells.beamingray.name=strahlender Strahl
actors.hero.spells.beamingray.no_space=Dort ist kein Platz für deinen Verbündeten.
actors.hero.spells.beamingray.out_of_range=Dieser Standort liegt außerhalb der Reichweite.
actors.hero.spells.beamingray.short_desc=Teleportiert euren Verbündeten und gewährt Bonusschaden.
actors.hero.spells.blessspell.desc=Der Kleriker belegt sich selbst oder einen anderen sichtbaren Charakter mit einem heiligen Segen. Wird der Segen auf sich selbst gewirkt, ist der Effekt schwächer und gewährt 0 Segensrunden und 1 Barriere. Wird der Zauber auf andere Charaktere gewirkt, ist er stärker und gewährt 2 Segensrunden und 3 Heilung. Überschüssige Heilung wird in Barriere umgewandelt.
actors.hero.spells.blessspell.name=segnen
actors.hero.spells.blessspell.short_desc=Segnet und beschützt den Kleriker, segnet und heilt andere.
actors.hero.spells.bodyform$bodyformbuff.desc=Trinitys Körperform verleiht dir aktuell die Kraft einer Verzauberung oder Glyphe, als ob diese auf deiner aktuellen Waffe oder Rüstung ausgerüstet wäre. Beachte, dass die Körperform keine weitere Kopie eines Effekts erzeugen kann, von dem du bereits profitierst. Aktueller Effekt: %1$s. \n\n Verbleibende Züge: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=Körperform
actors.hero.spells.bodyform.desc=Der Kleriker wählt eine Verzauberung oder Glyphe, die er in diesem Durchgang identifiziert hat, und verleiht Trinity deren Effekt. Wenn Trinity eingesetzt wird, erhält der Kleriker für %d Runden den Effekt der gewählten Verzauberung oder Glyphe. Diese temporäre Verzauberung oder Glyphe funktioniert mit jedem Effekt, den auch eine reguläre Verzauberung oder Glyphe hätte. Dieser Zauber ersetzt jeden anderen Körpereffekt, mit dem Trinity aktuell erfüllt ist.
actors.hero.spells.bodyform.name=Körperform
actors.hero.spells.bodyform.short_desc=Weist Trinity einer Verzauberung oder Glyphe zu.
actors.hero.spells.cleanse.desc=Der Kleriker entfernt alle schädlichen Statuseffekte von sich selbst und sichtbaren Verbündeten. Nach Ende des Zaubers erhalten alle betroffenen Charaktere außerdem %1$d Runden Immunität gegen Schwächungszauber und %2$d Barriere.
actors.hero.spells.cleanse.name=reinigen
actors.hero.spells.cleanse.short_desc=Entfernt negative Statuseffekte und gewährt Schutzschilde.
actors.hero.spells.clericspell.charge_cost=Ladekosten: %d
actors.hero.spells.clericspell.invalid_enemy=Du kannst diesen Gegner nicht anvisieren.
actors.hero.spells.clericspell.invalid_target=Diese Position kann nicht anvisiert werden.
actors.hero.spells.clericspell.no_target=Dort gibt es kein Ziel.
actors.hero.spells.clericspell.prompt=Wählen Sie ein Ziel aus
actors.hero.spells.divineintervention.desc=Der Kleriker leitet eine gewaltige Menge an Macht aus seinem Zauberbuch in sich und seine Verbündeten, wodurch alle einen Schild von %1$d erhalten und die Aufgestiegene Form um %2$d Runden verlängert wird. Die unglaubliche Verteidigungskraft dieses Zaubers steht im Widerspruch zu seinen sehr hohen Aufladekosten. Wie andere Schilde, die durch die Aufgestiegene Form gewährt werden, verfällt auch dieser Schild nicht normal, sondern endet sofort, sobald die Aufgestiegene Form endet.
actors.hero.spells.divineintervention.name=göttliches Eingreifen
actors.hero.spells.divineintervention.short_desc=Massiver Schildbonus für Kleriker und Verbündete.
actors.hero.spells.divinesense$divinesensetracker.desc=Diese Figur kann vorübergehend andere Kreaturen in der Nähe mit ihren Gedanken sehen!\n\nVerbleibende Züge: %s.
actors.hero.spells.divinesense$divinesensetracker.name=göttliches Gespür
actors.hero.spells.divinesense.desc=Der Kleriker konzentriert seine Sinne auf die Umgebung und erhält dadurch für 50 Runden eine Art Geistessicht mit einer Reichweite von %d Feldern. Dieser Zauber kann sofort gewirkt werden.
actors.hero.spells.divinesense.name=göttliches Gespür
actors.hero.spells.divinesense.short_desc=Erlangen Sie vorübergehende geistige Visionen in einem weiten Bereich.
actors.hero.spells.flash.desc=Der Kleriker kanalisiert seine aufgestiegene Gestalt an einem nahegelegenen Ort und teleportiert sich dorthin. Blitz kann den Kleriker zu jedem entdeckten, freien Ort in Reichweite teleportieren. Dieser Zauber verbraucht bei jeder Anwendung in derselben aufgestiegenen Gestalt zusätzliche Zauberbuchladungen.
actors.hero.spells.flash.name=Blitz
actors.hero.spells.flash.prompt=Wählen Sie einen Standort
actors.hero.spells.flash.short_desc=Teleportiere dich zu einem nahegelegenen Ort.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Der Priester kann nach 50 Runden erneut kostenlos Leitendes Licht wirken.\n\nVerbleibende Runden: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Leitlicht
actors.hero.spells.guidinglight$illuminated.desc=Diese Figur leuchtet, weil sie von einem leitenden Lichtstrahl getroffen wurde. Obwohl das Leuchten nicht stark genug ist, um die Umgebung zu erhellen, erleichtert der magische Effekt dem Kleriker das Treffen mit ihr erheblich.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andere Helden können zwar weiterhin „Erleuchtet“ verwenden, um vom Talent „Sengendes Licht“ zu profitieren, erhalten dadurch aber keine zusätzliche Treffsicherheit.
actors.hero.spells.guidinglight$illuminated.desc_priest=Der Priester kann zusätzlich „Erleuchtet von Glanz“, einen Zauberstabblitz, einen Angriff eines Verbündeten oder Effekte bestimmter Artefakte nutzen. Die Nutzung von „Erleuchtet“ auf diese Weise verursacht zusätzlichen magischen Schaden in Höhe der Priesterstufe + 5.
actors.hero.spells.guidinglight$illuminated.name=beleuchtet
actors.hero.spells.guidinglight.desc=Der Kleriker entfesselt einen magischen Energieblitz, der ein Ziel trifft, 2–8 Schaden verursacht und es erleuchtet. Der nächste nicht behinderte physische Angriff gegen einen erleuchteten Gegner trifft ihn garantiert.
actors.hero.spells.guidinglight.desc_priest=Dieser Zauber ist mächtiger, wenn er vom Priester gewirkt wird. Die erste Anwendung alle 50 Runden kostet keine Zauberbuchladungen. Die Erleuchtung wird durch Strahlkraft, Zauberstäbe, andere Charaktere und Artefakte verbraucht, die Feinde direkt beeinflussen. Wird der Zauber auf diese Weise eingesetzt, verursacht er zusätzlichen Magieschaden in Höhe der Priesterstufe + 5.
actors.hero.spells.guidinglight.name=Leitlicht
actors.hero.spells.guidinglight.short_desc=Verursacht magischen Fernkampfschaden und garantiert einen Treffer.
actors.hero.spells.hallowedground$hallowedterrain.desc=Dieser Ort wurde geweiht. Geweihter Boden verlangsamt Feinde, heilt Verbündete und lässt Gras wachsen.
actors.hero.spells.hallowedground.desc=Der Priester konzentriert seine göttliche Magie in den Boden nahe der Stelle und erschafft so ein heiliges Gebiet (%1$dx%1$d), das 20 Runden lang bestehen bleibt. Beim Wirken des Zaubers werden alle Verbündeten um 15 LP geheilt (gesunde Verbündete und der Priester erhalten einen Schild), Gegner werden kurzzeitig festgehalten und kurzes Gras wächst. Das heilige Gebiet heilt Verbündete um 1 LP pro Runde (gesunde Verbündete und der Priester erhalten einen Schild), schwächt Gegner und lässt zufällig hohes Gras wachsen. Das heilige Gebiet wird durch Feuer zerstört und erzeugt gefurchtes Gras, wenn passive Regenerationseffekte deaktiviert sind oder der Priester längere Zeit keine Erfahrungspunkte gesammelt hat.
actors.hero.spells.hallowedground.name=heiliger Boden
actors.hero.spells.hallowedground.prompt=Wählen Sie einen Standort
actors.hero.spells.hallowedground.short_desc=Heilt Verbündete, verlangsamt Feinde und verbreitet Gras in einem Wirkungsbereich.
actors.hero.spells.holyintuition.cursed=Du spürst, dass in diesem Gegenstand bösartige Magie lauert.
actors.hero.spells.holyintuition.desc=Der Kleriker konzentriert seine Sinne auf einen Gegenstand und kann feststellen, ob er verflucht ist oder nicht, ohne ihn ausrüsten zu müssen.
actors.hero.spells.holyintuition.name=heilige Intuition
actors.hero.spells.holyintuition.prompt=Wählen Sie einen Artikel aus
actors.hero.spells.holyintuition.short_desc=Stellt fest, ob ein Gegenstand verflucht ist oder nicht.
actors.hero.spells.holyintuition.uncursed=Dieser Gegenstand ist frei von böswilliger Magie.
actors.hero.spells.holylance$lancecooldown.desc=Der Priester hat vor Kurzem Heilige Lanze gewirkt und muss warten, bevor er sie erneut wirken kann.\n\nVerbleibende Züge: %s.
actors.hero.spells.holylance$lancecooldown.name=Abklingzeit der heiligen Lanze
actors.hero.spells.holylance.desc=Der Priester konzentriert eine gewaltige Energiemenge in einen verheerenden Lichtspeer. Dieser Speer verursacht %1$d-%2$d Schaden und richtet gegen Untote und Dämonen stets maximalen Schaden an.\n\n Dieser Zauber ist sehr teuer und hat eine Abklingzeit von 30 Runden.
actors.hero.spells.holylance.name=Heilige Lanze
actors.hero.spells.holylance.short_desc=Verursacht hohen magischen Fernkampfschaden.
actors.hero.spells.holyward$holyarmbuff.desc=Der Kleriker hat seine abgenutzte Rüstung mit heiliger Energie erfüllt, wodurch jegliche vorhandene Glyphe vorübergehend außer Kraft gesetzt wird und die Rüstung zusätzlich 1 Schadenspunkt abwehrt. \n\n Verbleibende Züge: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Der Paladin hat seine abgenutzte Rüstung mit heiliger Energie erfüllt, wodurch die Rüstung zusätzlich 3 Schadenspunkte abwehrt. Das Wirken anderer Zauber, während der Heilige Schutz aktiv ist, verlängert seine Dauer um 10 Runden pro verbrauchter Ladung. Verbleibende Runden:
actors.hero.spells.holyward$holyarmbuff.name=heiliger Bezirk
actors.hero.spells.holyward.desc=Der Kleriker erfüllt seine abgenutzte Rüstung mit Glyphen heiligen Lichts, wodurch deren Schadensblockierung um 1 erhöht wird. Dieser Zauber benötigt keine Zeit zum Wirken. Diese Glyphe hält 50 Runden an und überschreibt für diese Dauer alle anderen positiven Glyphen der Rüstung. Der Kleriker profitiert von diesem Effekt auch dann, wenn er keine Rüstung trägt.
actors.hero.spells.holyward.desc_paladin=Dieser Zauber ist mächtiger, wenn er vom Paladin gewirkt wird. Der zusätzliche Schadensblock wird auf 3 erhöht, der Zauber überschreibt keine bestehenden Glyphen mehr, und das Wirken anderer Zauber, während Heiliger Schutz aktiv ist, verlängert seine Dauer um 10 Runden pro verwendeter Ladung.
actors.hero.spells.holyward.glyph_desc=Dieses Glyphe erhöht geringfügig den Schaden, den Rüstungen abwehren können.
actors.hero.spells.holyward.glyph_name=%s des Lichts
actors.hero.spells.holyward.name=heiliger Bezirk
actors.hero.spells.holyward.short_desc=Überschreibt vorübergehend Glyphen, um die Blockchance der Rüstung zu erhöhen.
actors.hero.spells.holyweapon$holywepbuff.desc=Der Kleriker hat seine abgenutzte Waffe mit heiliger Energie erfüllt, wodurch jegliche bestehende Verzauberung vorübergehend außer Kraft gesetzt wird und die Waffe bei jedem Angriff zusätzlich 2 magischen Schaden verursacht. \n\n Verbleibende Züge: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Der Paladin hat seine abgenutzte Waffe mit heiliger Energie erfüllt, wodurch seine Angriffe zusätzlich 6 magischen Schaden verursachen. Das Wirken anderer Zauber, während die heilige Waffe aktiv ist, verlängert ihre Wirkungsdauer um 10 Runden pro verbrauchter Ladung. Verbleibende Runden:
actors.hero.spells.holyweapon$holywepbuff.name=heilige Waffe
actors.hero.spells.holyweapon.desc=Der Kleriker verzaubert seine getragene Waffe mit heiliger Energie, wodurch diese bei jedem Treffer gegen einen Feind zusätzlich 2 magischen Schaden verursacht. Dieser Zauber benötigt keine Zeit zum Wirken. Diese Verzauberung hält 50 Runden an und überschreibt währenddessen alle anderen positiven Verzauberungen der Waffe. Auch unbewaffnete Angriffe profitieren von diesem Effekt.
actors.hero.spells.holyweapon.desc_paladin=Dieser Zauber ist mächtiger, wenn er vom Paladin gewirkt wird. Der zusätzliche magische Schaden wird auf 6 erhöht, der Zauber überschreibt keine bestehenden Verzauberungen mehr, und das Wirken anderer Zauber, während die Heilige Waffe aktiv ist, verlängert ihre Wirkungsdauer um 10 Runden pro verwendeter Ladung.
actors.hero.spells.holyweapon.ench_desc=Feinde, die von einer heiligen Waffe getroffen werden, erleiden zusätzlichen magischen Schaden.
actors.hero.spells.holyweapon.ench_name=heiliges %s
actors.hero.spells.holyweapon.name=heilige Waffe
actors.hero.spells.holyweapon.short_desc=Überschreibt vorübergehend Verzauberungen, um den Schaden zu erhöhen.
actors.hero.spells.judgement.desc=Der Kleriker schlägt mit der Faust auf den Boden und erzeugt so eine Lichtexplosion, die allen sichtbaren Feinden Schaden zufügt. Der Basisschaden beträgt %1$d-%2$d, zusätzlich werden jedoch 33%% Schaden für jeden Zauber verursacht, den der Kleriker seit dem Erreichen seiner aufgestiegenen Form (oder seit dem letzten Wirken von „Urteil“) gewirkt hat. Aktuell verursacht „Urteil“ %3$d-%4$d Schaden.
actors.hero.spells.judgement.name=Urteil
actors.hero.spells.judgement.short_desc=Fügt allen sichtbaren Feinden Schaden zu.
actors.hero.spells.layonhands.desc=Der Paladin kanalisiert heilige Energie durch seine Hände und heilt oder schützt alles, was er berührt. Der Paladin kann diesen Zauber auf einen beliebigen benachbarten Charakter wirken, um ihm Heilung zu verleihen, oder auf sich selbst, um einen Schutz zu erhalten. Überschüssige Heilung durch diesen Zauber wird in Schutz umgewandelt. Dieser Zauber wird augenblicklich gewirkt und kann wiederholt eingesetzt werden, gewährt aber maximal drei Schutzwirkungen gleichzeitig.
actors.hero.spells.layonhands.name=Handauflegen
actors.hero.spells.layonhands.short_desc=Heilt sofort einen benachbarten Charakter oder schützt den Paladin.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Der Kleriker hat kürzlich Lebensband auf diesen Verbündeten gewirkt. Zusätzlich zu den regulären Vorteilen von Lebensband erleidet dieser Charakter reduzierten Schaden, positive Klerikerzauber wirken sowohl auf den Kleriker als auch auf diesen Verbündeten anstatt nur auf einen, und die Macht der Vielen läuft nicht aus, solange dieser Stärkungszauber aktiv ist. Verbleibende Züge: 0
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=Lebensverbindungsschutz
actors.hero.spells.lifelinkspell.desc=Der Kleriker stärkt die Verbindung zwischen sich und seinem gestärkten Verbündeten. Durch diese verstärkte Verbindung wird jeglicher erlittener Schaden für %1$d Runden zwischen dem Helden und seinem Verbündeten geteilt, und der Verteidigungsbonus von „Macht der Vielen“ wird auf -%2$d%% erlittenen Schaden erhöht. Beachte, dass der Schaden nach der Rüstung, aber vor der Schadensreduktion von „Macht der Vielen“ geteilt wird.\n\n Solange dieser Effekt aktiv ist, wirken vorteilhafte Klerikerzauber der Stufe 3 oder niedriger sowohl auf den Kleriker als auch auf seinen Verbündeten, als ob sie nur auf einen von ihnen gewirkt hätten.
actors.hero.spells.lifelinkspell.name=Lebensverbindung
actors.hero.spells.lifelinkspell.short_desc=Teilt den Schaden mit einem Verbündeten und verringert dessen erlittenen Schaden.
actors.hero.spells.mindform.desc=Der Kleriker wählt einen Zauberstab oder eine Wurfwaffe, die er in diesem Durchgang identifiziert hat, und verleiht Trinity deren Effekt. Wenn Trinity eingesetzt wird, kann der Kleriker einen einzelnen Angriff ausführen, als würde er den gewählten Gegenstand verwenden. Dadurch werden alle Effekte ausgelöst, die die Verwendung dieses Gegenstandstyps normalerweise auslösen würde. Dieser Zauber ersetzt alle anderen Gedankeneffekte, mit denen Trinity derzeit erfüllt ist.
actors.hero.spells.mindform.name=Geistesform
actors.hero.spells.mindform.short_desc=Weist Trinity einem Zauberstab oder einer Wurfwaffe zu.
actors.hero.spells.mnemonicprayer.desc=Der Priester spricht ein Gebet, das die Wirkungsdauer aller Stärkungs- und Schwächungszauber auf einem bestimmten Ziel um %1$d Runden verlängert. Dieser Zauber benötigt keine Zeit zum Wirken. Positive Effekte halten länger auf Verbündete (einschließlich des Priesters selbst), negative Effekte länger auf Feinde. Das Erinnerungsgebet kann einen Stärkungs- oder Schwächungszauber nur einmalig verlängern und keine Stärkungszauber von Rüstungsfertigkeiten.
actors.hero.spells.mnemonicprayer.name=Gedächtnisgebet
actors.hero.spells.mnemonicprayer.short_desc=Verlängert Stärkungs-/Schwächungseffekte auf einen Verbündeten/Feind und wendet den Effekt „Erleuchtet“ erneut an.
actors.hero.spells.radiance.desc=Der Priester erstrahlt in heiligem Licht und betäubt alle sichtbaren Gegner für 3 Runden. Ist ein Gegner bereits erleuchtet, löst „Strahlkraft“ den Bonusschaden von „Erleuchtung“ aus und belegt ihn anschließend mit dem Debuff „Erleuchtet“. Ist die Ebene dunkel, leuchtet der Priester durch „Strahlkraft“ 100 Runden lang.
actors.hero.spells.radiance.name=Glanz
actors.hero.spells.radiance.short_desc=Leuchtet sichtbare Feinde auf und betäubt sie kurzzeitig.
actors.hero.spells.recallinscription$useditemtracker.desc=Der Kleriker hat kürzlich einen Gegenstand benutzt, der mit dem Zauber „Eingeschriebene Erinnerung“ funktioniert. Der Kleriker kann den Zauber wirken, um die Wirkung des Gegenstands zu wiederholen. \n\nVerwendeter Gegenstand: %1$s.\n\nVerbleibende Züge: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=kürzlich verwendete Rune
actors.hero.spells.recallinscription.desc=Der Kleriker nutzt heilige Magie, um den Effekt einer magischen Rune, die er in den letzten %s Runden auf einem Runenstein oder einer Schriftrolle gefunden hat, erneut zu wirken. Die Inschrift kann nicht verwendet werden, um Schriftrollen der Aufwertung zu replizieren. Die Kosten dieser Zauberladung variieren je nach verwendetem Gegenstand: 2 für einen Runenstein, 3 für eine Schriftrolle, 4 für eine exotische Schriftrolle. Diese Kosten verdoppeln sich außerdem beim Replizieren einer Schriftrolle der Transmutation oder von Alchemiegegenständen, die durch Transmutation oder Aufwertung hergestellt werden müssen.
actors.hero.spells.recallinscription.name=Erinnerungsschrift
actors.hero.spells.recallinscription.short_desc=Wiederholt einen kürzlich verwendeten Runenstein oder eine Schriftrolle.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Ein dünner Lichtschild trennt diese Figur von einem Gegner. Er ist nicht stark genug, um Angriffe vollständig abzuwehren, schwächt sie aber ab. \n\n Verbleibende Züge: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=Schild des Lichts
actors.hero.spells.shieldoflight.desc=Der Kleriker erschafft eine dünne Lichtbarriere zwischen sich und einem Feind, wodurch die Blockkraft seiner Rüstung gegen diesen Feind für 5 Runden um %1$d-%2$d erhöht wird.\n\nDieser Zauber benötigt keine Zeit zum Wirken, kann aber nicht gleichzeitig gegen mehrere Ziele eingesetzt werden.
actors.hero.spells.shieldoflight.name=Schild des Lichts
actors.hero.spells.shieldoflight.short_desc=Gewährt einem Ziel vorübergehende Rüstung.
actors.hero.spells.smite.desc=Der Paladin verleiht einem Nahkampfangriff gerechte Zerstörungskraft. Zusätzlich zum normalen Nahkampfschaden sorgt „Zerschmettern“ dafür, dass Angriffe ohne Behinderung garantiert treffen, erhält +300 Verzauberungskraft und verursacht zusätzlichen magischen Schaden. Der zusätzliche magische Schaden von „Zerschmettern“ skaliert mit der Stufe des Paladins und verursacht gegen Untote oder Dämonen stets maximalen magischen Schaden.
actors.hero.spells.smite.name=schlagen
actors.hero.spells.smite.short_desc=Garantiert einen Treffer mit Bonusschaden und Verzauberungskraft.
actors.hero.spells.spiritform$spiritformbuff.desc=Trinitys Geisterform verleiht dir aktuell die Kraft eines Gegenstands, als ob du ihn ausgerüstet hättest. Beachte, dass die Geisterform keine weitere Kopie eines Effekts erzeugen kann, von dem du bereits profitierst. Aktueller Effekt: %1$s. \n\n Verbleibende Züge: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=Geisterform
actors.hero.spells.spiritform.desc=Der Kleriker wählt einen Ring oder ein Artefakt, das er in diesem Durchgang identifiziert hat (außer dem heiligen Buch), und verleiht Trinity dessen Effekt. Wird ein Ring gewählt, gewährt Trinity dessen Effekt für 20 Runden zu +%1$d. Wird ein Artefakt gewählt, repliziert Trinity dessen Effekt zu +%2$d. Jedes Artefakt hat unterschiedliche spezifische Verhaltensweisen und Rüstungsladungskosten in Verbindung mit Trinity. Dieser Zauber ersetzt jeden anderen Geistereffekt, mit dem Trinity derzeit erfüllt ist.
actors.hero.spells.spiritform.name=Geisterform
actors.hero.spells.spiritform.short_desc=Weist Trinity einem Ring oder Artefakt zu.
actors.hero.spells.stasis$stasisbuff.desc=Der Kleriker hat derzeit einen Verbündeten in Stasis. Alle positiven Effekte auf diesen Verbündeten bleiben erhalten, einschließlich „Macht der Vielen“, und er erscheint nach Ablauf des Effekts wieder neben dem Kleriker. Der Effekt kann auch vorzeitig beendet werden, indem Stasis erneut gewirkt wird.
actors.hero.spells.stasis$stasisbuff.left_behind=Ihr unbeweglicher Verbündeter bleibt zurück.
actors.hero.spells.stasis$stasisbuff.name=Verbündeter in der Stagnation
actors.hero.spells.stasis.desc=Der Kleriker konzentriert seine Verbindung zu seinem Verbündeten auf sich selbst, wodurch dieser vorübergehend in einer Art Energiestarre im Inneren des Klerikers gefangen gehalten wird. Der Verbündete bleibt bis zu %d Runden lang erhalten, wobei alle positiven Effekte auf ihn während der Stasis nicht beeinträchtigt werden. Der Verbündete erscheint neben dem Kleriker, sobald die Stasis auf natürliche Weise endet, oder der Kleriker kann den Zauber kostenlos erneut wirken, um den Effekt vorzeitig zu beenden. Stasis kann sogar unbewegliche Verbündete bewegen, jedoch nicht zwischen Ebenen transferieren.
actors.hero.spells.stasis.name=Stase
actors.hero.spells.stasis.short_desc=Entfernt einen Verbündeten aus dem Verlies und bewahrt ihn.
actors.hero.spells.sunray.desc=Der Kleriker schleudert einen blendenden Lichtstrahl auf ein Ziel, der %1$d-%2$d Schaden verursacht und es für %3$d Runden blendet. Sonnenstrahl verursacht immer maximalen Schaden an Untoten und Dämonen. Nachdem ein Gegner von diesem Zauber getroffen wurde, passt sich sein Sehvermögen an, sodass er nicht erneut geblendet werden kann. Wird er jedoch erneut getroffen, während er von diesem Zauber geblendet ist, ist das Licht überwältigend und lähmt ihn stattdessen.
actors.hero.spells.sunray.name=Sonnenstrahl
actors.hero.spells.sunray.short_desc=Verursacht magischen Fernkampfschaden und blendet das Ziel einmal.
actors.hero.spells.walloflight$lightwall.desc=Schimmernde Lichtpaneele versperren hier den Weg.
actors.hero.spells.walloflight.desc=Der Paladin erschafft direkt vor sich eine Wand aus Lichtpaneelen. Diese ist 1 Feld dick, 0 Felder breit und hält 20 Runden lang. Die Wand funktioniert wie eine normale Wand, ist aber durchsichtig. Gegner, die sich beim Erschaffen der Wand darin befinden, werden kurzzeitig betäubt und, wenn möglich, zurückgestoßen. Alles, was in der Wand gefangen ist, kann sie verlassen. Die Wand kann in alle vier Himmelsrichtungen oder diagonal gewirkt werden. Ist bereits eine Wand aktiv, kann der Zauber kostenlos erneut eingesetzt werden, um sie sofort zu entfernen.
actors.hero.spells.walloflight.early_end=Du zerstreust die Lichtwand.
actors.hero.spells.walloflight.name=Lichtwand
actors.hero.spells.walloflight.short_desc=Erschafft eine Mauer, die Feinde blockiert.
actors.hero.talent$aggressivebarriercooldown.desc=Du hast dieses Talent kürzlich eingesetzt und musst warten, bevor du es erneut einsetzen kannst.\n\nVerbleibende Züge: %s.
actors.hero.talent$aggressivebarriercooldown.name=aggressive Barriere-Abkühlung
actors.hero.talent$combinedlethalityabilitytracker.executed=ausgeführt
actors.hero.talent$deadlyfollowuptracker.desc=Die Duellantin hat kürzlich einen Gegner mit einer Wurfwaffe angegriffen; ihre Nahkampfangriffe gegen dasselbe Ziel verursachen erhöhten Schaden. \n\n Verbleibende Züge: %s.
actors.hero.talent$deadlyfollowuptracker.name=tödliche Folge
actors.hero.talent$followupstriketracker.desc=Die Jägerin hat kürzlich einen Gegner mit einer Wurfwaffe angegriffen; ihr nächster Nahkampfangriff gegen dasselbe Ziel verursacht erhöhten Schaden. \n\n Verbleibende Züge: %s.
