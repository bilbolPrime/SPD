actors.hero.talent.adventurers_intuition.desc=_+1:_ De Duelist identificeert wapens _2,5x sneller_ en bepantsering _1,75x sneller_.\n\n_+2:_ De Duelist identificeert wapens _wanneer ze deze uitrust_ en bepantsering _2,5x sneller_.
actors.hero.talent.adventurers_intuition.title=avonturiersintuïtie
actors.hero.talent.aggressive_barrier.desc=_+1:_ De Duelist krijgt _3 schildpunten_ wanneer ze een wapenvaardigheid gebruikt en haar gezondheid op of onder 50% is.\n\n_+2:_ De Duelist krijgt _5 schildpunten_ wanneer ze een wapenvaardigheid gebruikt en haar gezondheid op of onder 50% is.
actors.hero.talent.aggressive_barrier.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan een schild geven bij een mêlee-aanval met weinig levenspunten, met een afkoeltijd van 50 beurten.
actors.hero.talent.aggressive_barrier.title=agressieve barrière
actors.hero.talent.ally_warp.desc=_+1:_ De magiër kan een bondgenoot selecteren om direct van plaats te wisselen, met een bereik van _2 tegels_.\n\n_+2:_ De magiër kan een bondgenoot selecteren om direct van plaats te wisselen, met een bereik van _4 tegels_.\n\n_+3:_ De magiër kan een bondgenoot selecteren om direct van plaats te wisselen, met een bereik van _6 tegels_.\n\nDe magiër kan niet van plaats wisselen met immobiele bondgenoten.
actors.hero.talent.ally_warp.title=bondgenoot teleporteren
actors.hero.talent.arcane_vision.desc=_+1:_ Wanneer de magiër een vijand raakt met een bliksemstraal, krijgt hij gedurende _10 beurten_ mentaal zicht op die vijand.\n\n_+2:_ Wanneer de magiër een vijand raakt met een bliksemstraal, krijgt hij gedurende _15 beurten_ mentaal zicht op die vijand.
actors.hero.talent.arcane_vision.title=geheimzinnige visie
actors.hero.talent.assassins_reach.desc=_+1:_ Het teleportatiebereik van de Assassin per voorbereidingsniveau wordt vergroot naar _1/3/4/6 tegels_, van 1/2/3/4.\n\n_+2:_ Het teleportatiebereik van de Assassin per voorbereidingsniveau wordt vergroot naar _2/4/6/8 tegels_, van 1/2/3/4.\n\n_+3:_ Het teleportatiebereik van de Assassin per voorbereidingsniveau wordt vergroot naar _2/5/7/10 tegels_, van 1/2/3/4.\n\nDeze teleportatie kan door gevaren en vijanden heen, maar niet door vast terrein zoals muren.
actors.hero.talent.assassins_reach.title=bereik van de moordenaar
actors.hero.talent.aura_of_protection.desc=_+1:_ De Paladijn kan _Aura van Bescherming_ uitspreken, een spreuk die de Paladijn en alle bondgenoten binnen 2 vakjes _20% schadeweerstand_ geeft en het effect van de Paladijns pantserglyph met _+50% kracht_ gedurende 20 beurten, tegen een kostprijs van 2 ladingen.\n\n_+2:_ De Paladijn kan _Aura van Bescherming_ uitspreken, een spreuk die de Paladijn en alle bondgenoten binnen 2 vakjes _30% schadeweerstand_ geeft en het effect van de Paladijns pantserglyph met _+75% kracht_ gedurende 20 beurten, tegen een kostprijs van 2 ladingen.\n\n_+3:_ De Paladijn kan _Aura van Bescherming_ uitspreken, een spreuk die de Paladijn en alle bondgenoten binnen 2 vakjes _40% schadeweerstand_ geeft en het effect van de Paladijns pantserglyph met _+100% vermogen_ gedurende 20 beurten, tegen de kosten van 2 ladingen.
actors.hero.talent.aura_of_protection.title=aura van bescherming
actors.hero.talent.backup_barrier.desc=_+1:_ De magiër krijgt _3 schildpunten_ wanneer hij de laatste lading in zijn staf gebruikt.\n\n_+2:_ De magiër krijgt _5 schildpunten_ wanneer hij de laatste lading in zijn staf gebruikt.
actors.hero.talent.backup_barrier.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, zal deze in plaats daarvan worden geactiveerd door de toverstaf van het hoogste niveau van die held.
actors.hero.talent.backup_barrier.title=back-up barrière
actors.hero.talent.barkskin.desc=_+1:_ Wanneer de Warden in het gras stapt, krijgt ze _0-50% van haar level_ aan schorspantser, dat elke beurt vervaagt.\n\n_+2:_ Wanneer de Warden in het gras stapt, krijgt ze _0-100% van haar level_ aan schorspantser, dat elke beurt vervaagt.\n\n_+3:_ Wanneer de Warden in het gras stapt, krijgt ze _0-150% van haar level_ aan schorspantser, dat elke beurt vervaagt.
actors.hero.talent.barkskin.title=schorshuid
actors.hero.talent.beaming_ray.desc=De geestelijke kan _Straal_ oproepen vanaf een versterkte bondgenoot voor 1 lading. Deze straal kan door muren heen gaan en teleporteert de bondgenoot naar een gekozen locatie. Als er een vijand op die locatie is, verschijnt de bondgenoot naast de vijand en zal deze aanvallen. Beaming Ray kan zelfs normaal immobiele bondgenoten teleporteren, maar heeft daarbij een half bereik.\n\n_+1:_ Beaming Ray heeft een maximaal bereik van _4 tegels_ en verhoogt de bonus van Power of Many naar _+35% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.\n\n_+2:_ Beaming Ray heeft een maximaal bereik van _8 tegels_ en verhoogt de bonus van Power of Many naar _+40% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.\n\n_+3:_ Beaming Ray heeft een maximaal bereik van _12 tegels_ en verhoogt de bonus van Power of Many naar _+45% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.\n\n_+4:_ Beaming Ray heeft een maximaal bereik van _16 tegels,_ en verhoogt de bonus van Power of Many naar _+50% schade_ tegen de dichtstbijzijnde vijand gedurende 10 beurten.
actors.hero.talent.beaming_ray.title=stralende straal
actors.hero.talent.blast_radius.desc=_+1:_ De straal van de elementaire explosie wordt vergroot naar _5 tegels_, van 4.\n\n_+2:_ De straal van de elementaire explosie wordt vergroot naar _6 tegels_, van 4.\n\n_+3:_ De straal van de elementaire explosie wordt vergroot naar _7 tegels_, van 4.\n\n_+4:_ De straal van de elementaire explosie wordt vergroot naar _8 tegels_, van 4.
actors.hero.talent.blast_radius.title=explosieradius
actors.hero.talent.bless.desc=_+1:_ De geestelijke kan _Zegen_ uitspreken, een spreuk die _6 beurten zegen en 10 schild_ geeft wanneer deze op zichzelf wordt uitgesproken of _10 beurten zegen en 10 genezing_ wanneer deze op een ander personage wordt uitgesproken, tegen de kosten van 1 lading.\n\n_+2:_ De geestelijke kan _Zegen_ uitspreken, een spreuk die _10 beurten zegen en 15 schild_ geeft wanneer deze op zichzelf wordt uitgesproken of _15 beurten zegen en 15 genezing_ wanneer deze op een ander personage wordt uitgesproken, tegen de kosten van 1 lading.\n\nOvertollige genezing van deze spreuk wordt omgezet in schild.
actors.hero.talent.bless.meta_desc=_Als dit talent door een andere held wordt verkregen_, zal het in plaats daarvan de nauwkeurigheid en ontwijking van de held en alle bondgenoten met 3% verhogen bij +1 of met 5% bij +2.
actors.hero.talent.bless.title=zegenen
actors.hero.talent.body_form.desc=De geestelijke kan _Lichaamsvorm_ gebruiken, waarmee Trinity de kracht krijgt van een betovering of glyph die de geestelijke in deze run heeft gekozen, tegen een kostprijs van 2 ladingen.\n\n_+1:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het gekozen effect gedurende _20 beurten._\n\n_+2:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het gekozen effect gedurende _27 beurten._\n\n_+3:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het gekozen effect gedurende _33 beurten._\n\n_+4:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het gekozen effect gedurende _40 beurten._\n\nTrinity kan slechts met één lichaamseffect tegelijk worden doordrenkt. De kosten voor het opladen van Trinity's pantser zijn hoger als het gekozen symbool zeldzaam en krachtig is.
actors.hero.talent.body_form.title=lichaamsvorm
actors.hero.talent.body_replacement.desc=_+1:_ Na het teleporteren laat de Rogue een houten lokvogel achter met _20 levenspunten en 1-3 pantser_.\n\n_+2:_ Na het teleporteren laat de Rogue een houten lokvogel achter met _40 levenspunten en 2-6 pantser_.\n\n_+3:_ Na het teleporteren laat de Rogue een houten lokvogel achter met _60 levenspunten en 3-9 pantser_.\n\n_+4:_ Na het teleporteren laat de Rogue een houten lokvogel achter met _80 levenspunten en 4-12 pantser_.\n\nEr kan slechts één lokvogel tegelijk actief zijn.
actors.hero.talent.body_replacement.title=lichaamsvervanging
actors.hero.talent.body_slam.desc=_+1:_ Wanneer de krijger landt na een sprong, lopen alle aangrenzende vijanden schade op gelijk aan _1-4 plus 25%_ van zijn schadeblokkerende kracht.\n\n_+2:_ Wanneer de krijger landt na een sprong, lopen alle aangrenzende vijanden schade op gelijk aan _2-8 plus 50%_ van zijn schadeblokkerende kracht.\n\n_+3:_ Wanneer de krijger landt na een sprong, lopen alle aangrenzende vijanden schade op gelijk aan _3-12 plus 75%_ van zijn schadeblokkerende kracht.\n\n_+4:_ Wanneer de krijger landt na een sprong, lopen alle aangrenzende vijanden schade op gelijk aan _4-16 plus 100%_ van zijn schadeblokkerende kracht.
actors.hero.talent.body_slam.title=lichaamsslam
actors.hero.talent.bounty_hunter.desc=_+1:_ Wanneer de Assassin een vijand doodt met een voorbereide aanval, wordt de kans op een voorwerp dat hij laat vallen verhoogd met _2/4/8/16%_ per niveau van voorbereiding.\n\n_+2:_ Wanneer de Assassin een vijand doodt met een voorbereide aanval, wordt de kans op een voorwerp dat hij laat vallen verhoogd met _4/8/16/32%_ per niveau van voorbereiding.\n\n_+3:_ Wanneer de Assassin een vijand doodt met een voorbereide aanval, wordt de kans op een voorwerp dat hij laat vallen verhoogd met _6/12/24/48%_ per niveau van voorbereiding.
actors.hero.talent.bounty_hunter.title=premiejager
actors.hero.talent.cached_rations.desc=_+1:_ De schurk kan _2 rantsoenen_ vinden in kisten terwijl hij de volgende paar verdiepingen van de kerker verkent.\n\n_+2:_ De schurk kan _3 rantsoenen_ vinden in kisten terwijl hij de volgende paar verdiepingen van de kerker verkent.\n\nRantsoenen worden snel opgegeten, herstellen een matige hoeveelheid verzadiging, genezen 5 hp en herstellen 1 lading van de schaduwmantel.
actors.hero.talent.cached_rations.title=opgeslagen rantsoenen
actors.hero.talent.cleanse.desc=_+1:_ De geestelijke kan _Reinigen_ uitspreken, een spreuk die _negatieve status-effecten_ van de geestelijke en alle nabije bondgenoten verwijdert en hen _10 schild_ geeft, tegen een kostprijs van 2 ladingen.\n\n_+2:_ De geestelijke kan _Reinigen_ uitspreken, een spreuk die _3 beurten immuniteit tegen negatieve status_ verleent aan de geestelijke en alle nabije bondgenoten en hen _20 schild_ geeft, tegen een kostprijs van 2 ladingen.\n\n_+3:_ De geestelijke kan _Reinigen_ uitspreken, een spreuk die _5 beurten immuniteit tegen negatieve status_ verleent aan de geestelijke en alle nabije bondgenoten en hen _30 schild_ geeft, tegen een kostprijs van 2 ladingen.
actors.hero.talent.cleanse.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, zal deze in plaats daarvan negatieve status-effecten op de held verwijderen na het gebruik van een toverstaf of artefact, in 10/20/30% van de gevallen met een bonus van +1/+2/+3.
actors.hero.talent.cleanse.title=reinigen
actors.hero.talent.cleave.desc=_+1:_ De extra tijd die de Gladiator krijgt na een kill wordt verhoogd naar _30 beurten_, van 15.\n\n_+2:_ De extra tijd die de Gladiator krijgt na een kill wordt verhoogd naar _45 beurten_, van 15.\n\n_+3:_ De extra tijd die de Gladiator krijgt na een kill wordt verhoogd naar _60 beurten_, van 15.
actors.hero.talent.cleave.title=splijten
actors.hero.talent.cloned_armor.desc=_+1:_ De schaduwkloon krijgt _12%_ van de pantserwaarde van de held en heeft _25% kans_ om het glyph op het pantser van de held te gebruiken.\n\n_+2:_ De schaduwkloon krijgt _24%_ van de pantserwaarde van de held en heeft _50% kans_ om het glyph op het pantser van de held te gebruiken.\n\n_+3:_ De schaduwkloon krijgt _36%_ van de pantserwaarde van de held en heeft _75% kans_ om het glyph op het pantser van de held te gebruiken.\n\n_+4:_ De schaduwkloon krijgt _48%_ van de pantserwaarde van de held en heeft _100% kans_ om het glyph op het pantser van de held te gebruiken.
actors.hero.talent.cloned_armor.title=gekloond pantser
actors.hero.talent.close_the_gap.desc=_+1:_ De Duelist teleporteert _tot twee tegels_ richting haar doelwit bij aanvang van een duel.\n\n_+2:_ De Duelist teleporteert _tot drie tegels_ richting haar doelwit bij aanvang van een duel.\n\n_+3:_ De Duelist teleporteert _tot vier tegels_ richting haar doelwit bij aanvang van een duel.\n\n_+4:_ De Duelist teleporteert _tot vijf tegels_ richting haar doelwit bij aanvang van een duel.\n\nDeze teleportatie kan door obstakels en vijanden heen gaan, maar niet door vast terrein zoals muren. De teleportatie wordt meegenomen bij het bepalen of een vijand binnen bereik is om uitgedaagd te worden.
actors.hero.talent.close_the_gap.title=dicht de kloof
actors.hero.talent.combined_energy.desc=_+1:_ Als de Monnik binnen 5 beurten een wapenvaardigheid en een vaardigheid met _4+ energie_ gebruikt, krijgt ze 1 verbruikte energie terug.\n\n_+2:_ Als de Monnik binnen 5 beurten een wapenvaardigheid en een vaardigheid met _3+ energie_ gebruikt, krijgt ze 1 verbruikte energie terug.\n\n_+3:_ Als de Monnik binnen 5 beurten een wapenvaardigheid en een vaardigheid met _2+ energie_ gebruikt, krijgt ze 1 verbruikte energie terug.
actors.hero.talent.combined_energy.title=gecombineerde energie
actors.hero.talent.combined_lethality.desc=_+1:_ Als de Kampioen direct na het gebruiken van een vaardigheid van een ander wapen een mêlee-aanval uitvoert, zal die aanval alle niet-baasvijanden doden die nog _minder dan 13% HP_ hebben.\n\n_+2:_ Als de Kampioen direct na het gebruiken van een vaardigheid van een ander wapen een mêlee-aanval uitvoert, zal die aanval alle niet-baasvijanden doden die nog _minder dan 27% HP_ hebben.\n\n_+3:_ Als de Kampioen direct na het gebruiken van een vaardigheid van een ander wapen een mêlee-aanval uitvoert, zal die aanval alle niet-baasvijanden doden die nog _minder dan 40% HP_ hebben.\n\nDeze aanval kan een normale mêlee-aanval zijn, of onderdeel van een wapenvaardigheid.
actors.hero.talent.combined_lethality.title=gecombineerde dodelijkheid
actors.hero.talent.conserved_magic.desc=_+1:_ Elke blikseminslag van wilde magie gebruikt nu _0,33 ladingen_ in plaats van 0,5, en wilde magie heeft een _25% kans_ om geen beurt te verbruiken.\n\n_+2:_ Elke blikseminslag van wilde magie gebruikt nu _0,225 ladingen_ in plaats van 0,5, en wilde magie heeft een _50% kans_ om geen beurt te verbruiken.\n\n_+3:_ Elke blikseminslag van wilde magie gebruikt nu _0,15 ladingen_ in plaats van 0,5, en wilde magie heeft een _75% kans_ om geen beurt te verbruiken.\n\n_+4:_ Elke blikseminslag van wilde magie gebruikt nu _0,1 ladingen_ in plaats van 0,5, en wilde magie heeft een _100% kans_ om geen beurt te verbruiken.
actors.hero.talent.conserved_magic.title=geconserveerde magie
actors.hero.talent.counter_ability.desc=_+1:_ Als de Duelist een wapenvaardigheid gebruikt binnen 3 beurten nadat haar nabeeld is aangevallen, krijgt ze direct _0,38 ladingen_ terug.\n\n_+2:_ Als de Duelist een wapenvaardigheid gebruikt binnen 3 beurten nadat haar nabeeld is aangevallen, krijgt ze direct _0,77 ladingen_ terug.\n\n_+3:_ Als de Duelist een wapenvaardigheid gebruikt binnen 3 beurten nadat haar nabeeld is aangevallen, krijgt ze direct _1,13 ladingen_ terug.\n\n_+4:_ Als de Duelist een wapenvaardigheid gebruikt binnen 3 beurten nadat haar nabeeld is aangevallen, krijgt ze direct _1,5 ladingen_ terug.
actors.hero.talent.counter_ability.title=tegenvermogen
actors.hero.talent.deadly_followup.desc=_+1:_ Wanneer de Duelist een vijand raakt met een werpwapen, zal ze gedurende 5 beurten _10% meer mêlee-schade_ aan die vijand toebrengen.\n\n_+2:_ Wanneer de Duelist een vijand raakt met een werpwapen, zal ze gedurende 5 beurten _20% meer mêlee-schade_ aan die vijand toebrengen.\n\n_+3:_ Wanneer de Duelist een vijand raakt met een werpwapen, zal ze gedurende 5 beurten _30% meer mêlee-schade_ aan die vijand toebrengen.
actors.hero.talent.deadly_followup.title=dodelijke vervolgactie
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk wordt automatisch geactiveerd als de Berserker op het punt staat te sterven en zijn woede 100% of hoger is, maar er is een afkoeltijd van _3 heldenniveaus_ wanneer dit gebeurt.\n\n_+2:_ Berserk wordt automatisch geactiveerd als de Berserker op het punt staat te sterven en zijn woede 100% of hoger is, maar er is een afkoeltijd van _2 heldenniveaus_ wanneer dit gebeurt.\n\n_+3:_ Berserk wordt automatisch geactiveerd als de Berserker op het punt staat te sterven en zijn woede 100% of hoger is, maar er is een afkoeltijd van _1 heldenniveau_ wanneer dit gebeurt.\n\nMerk op dat de Berserker nog steeds zal sterven als hij 0 HP heeft wanneer de berserk eindigt.
actors.hero.talent.deathless_fury.title=onsterfelijke woede
actors.hero.talent.deathly_durability.desc=_+1:_ Vijanden die door een doodsmerk worden gedood, geven de Schurk een schild gelijk aan _13%_ van hun HP op het moment dat ze werden gemarkeerd.\n\n_+2:_ Vijanden die door een doodsmerk worden gedood, geven de Schurk een schild gelijk aan _25%_ van hun HP op het moment dat ze werden gemarkeerd.\n\n_+3:_ Vijanden die door een doodsmerk worden gedood, geven de Schurk een schild gelijk aan _38%_ van hun HP op het moment dat ze werden gemarkeerd.\n\n_+4:_ Vijanden die door een doodsmerk worden gedood, geven de Schurk een schild gelijk aan _50%_ van hun HP op het moment dat ze werden gemarkeerd.
actors.hero.talent.deathly_durability.title=dodelijke duurzaamheid
actors.hero.talent.desperate_power.desc=_+1:_ De toverstaf en staf van de magiër krijgen _+1 niveau_ bij hun laatste bliksemstoot wanneer ze nog maar één lading over hebben.\n\n_+2:_ De toverstaf en staf van de magiër krijgen _+2 niveaus_ bij hun laatste bliksemstoot wanneer ze nog maar één lading over hebben.\n\n_+3:_ De toverstaf en staf van de magiër krijgen _+3 niveaus_ bij hun laatste bliksemstoot wanneer ze nog maar één lading over hebben.
actors.hero.talent.desperate_power.title=wanhopige macht
actors.hero.talent.directed_power.desc=_+1:_ De directe aanval van Elemental Strike krijgt _+30% betoveringskracht_ voor elke vijand binnen het bereik van het effect van Elemental Strike, inclusief het aanvalsdoel.\n\n_+2:_ De directe aanval van Elemental Strike krijgt _+60% betoveringskracht_ voor elke vijand binnen het bereik van het effect van Elemental Strike, inclusief het aanvalsdoel.\n\n_+3:_ De directe aanval van Elemental Strike krijgt _+90% betoveringskracht_ voor elke vijand binnen het bereik van het effect van Elemental Strike, inclusief het aanvalsdoel.\n\n_+4:_ De directe aanval van Elemental Strike krijgt _+120% betoveringskracht_ voor elke vijand binnen het bereik van het effect van Elemental Strike, inclusief het aanvalsdoel.
actors.hero.talent.directed_power.title=gerichte kracht
actors.hero.talent.divine_intervention.desc=_+1:_ Terwijl de geestelijke in Verheven Vorm is, kan hij/zij _Goddelijke Interventie_ uitspreken, wat de geestelijke en alle bondgenoten een schild van _150_ geeft en de Verheven Vorm met _3 beurten_ verlengt._\n\n_+2:_ Terwijl de geestelijke in Verheven Vorm is, kan hij/zij _Goddelijke Interventie_ uitspreken, wat de geestelijke en alle bondgenoten een schild van _200_ geeft en de Verheven Vorm met _4 beurten_ verlengt._\n\n_+3:_ Terwijl de geestelijke in Verheven Vorm is, kan hij/zij _Goddelijke Interventie_ uitspreken, wat de geestelijke en alle bondgenoten een schild van _250_ geeft en de Verheven Vorm met _5 beurten_ verlengt._\n\n_+4:_ Terwijl de geestelijke in Verheven Vorm is, kan hij/zij _Goddelijke Interventie_, die de geestelijke en alle bondgenoten een schild van maximaal 300 geeft en de Verheven Vorm met 6 beurten verlengt._\n\nGoddelijke Interventie kost maar liefst 5 tome-ladingen en kan slechts één keer in dezelfde verheven vorm worden gebruikt.
actors.hero.talent.divine_intervention.title=goddelijke interventie
actors.hero.talent.divine_sense.desc=_+1:_ De geestelijke kan _Goddelijk Zintuig_ uitspreken, een spreuk die hem _8 tegels_ van Geestelijk Zicht_ geeft gedurende 50 beurten en geen tijd kost om uit te spreken, tegen een kostprijs van 2 ladingen.\n\n_+2:_ De geestelijke kan _Goddelijk Zintuig_ uitspreken, een spreuk die hem _12 tegels_ van Geestelijk Zicht_ geeft gedurende 50 beurten en geen tijd kost om uit te spreken, tegen een kostprijs van 2 ladingen.
actors.hero.talent.divine_sense.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, zal deze held in plaats daarvan gedurende een kort moment telepathie verkrijgen na gebruik van een toverstaf of artefact met een bereik van 3 tegels bij +1 of 5 tegels bij +2.
actors.hero.talent.divine_sense.title=goddelijk gevoel
actors.hero.talent.double_jump.desc=_+1:_ Als de krijger binnen 3 beurten een tweede sprong uitvoert, zijn de oplaadkosten van die sprong _16% lager_.\n\n_+2:_ Als de krijger binnen 3 beurten een tweede sprong uitvoert, zijn de oplaadkosten van die sprong _30% lager_.\n\n_+3:_ Als de krijger binnen 3 beurten een tweede sprong uitvoert, zijn de oplaadkosten van die sprong _40% lager_.\n\n_+4:_ Als de krijger binnen 3 beurten een tweede sprong uitvoert, zijn de oplaadkosten van die sprong _50% lager_.
actors.hero.talent.double_jump.title=dubbelsprong
actors.hero.talent.double_mark.desc=_+1:_ Het markeren van een tweede doelwit tegelijk met het eerste heeft een _30% lagere_ kosten.\n\n_+2:_ Het markeren van een tweede doelwit tegelijk met het eerste heeft een _50% lagere_ kosten.\n\n_+3:_ Het markeren van een tweede doelwit tegelijk met het eerste heeft een _65% lagere_ kosten.\n\n_+4:_ Het markeren van een tweede doelwit tegelijk met het eerste heeft een _75% lagere_ kosten.
actors.hero.talent.double_mark.title=dubbele markering
actors.hero.talent.durable_projectiles.desc=_+1:_ Werpwapens hebben _+50% duurzaamheid_ wanneer ze door de Jageres worden gebruikt.\n\n_+2:_ Werpwapens hebben _+75% duurzaamheid_ wanneer ze door de Jageres worden gebruikt.
actors.hero.talent.durable_projectiles.title=duurzame projectielen
actors.hero.talent.durable_tips.desc=_+1:_ Pijlen met een punt hebben _2x duurzaamheid_ wanneer de Warden ze gebruikt.\n\n_+2:_ Pijlen met een punt hebben _3x duurzaamheid_ wanneer de Warden ze gebruikt.\n\n_+3:_ Pijlen met een punt hebben _4x duurzaamheid_ wanneer de Warden ze gebruikt.
actors.hero.talent.durable_tips.title=duurzame tips
actors.hero.talent.eagle_eye.desc=_+1:_ Het zichtbereik van de geesthavik wordt vergroot van 6 naar 7 tegels.\n\n_+2:_ Het zichtbereik van de geesthavik wordt vergroot van 6 naar 8 tegels.\n\n_+3:_ Het zichtbereik van de geesthavik wordt vergroot van 6 naar 9 tegels en hij krijgt 2 tegels aan geestelijk zicht.\n\n_+4:_ Het zichtbereik van de geesthavik wordt vergroot van 6 naar 10 tegels en hij krijgt 3 tegels aan geestelijk zicht.
actors.hero.talent.eagle_eye.title=adelaarsblik
actors.hero.talent.elemental_power.desc=_+1:_ De kracht van de elementaire explosie wordt met _25%_ verhoogd.\n\n_+2:_ De kracht van de elementaire explosie wordt met _50%_ verhoogd.\n\n_+3:_ De kracht van de elementaire explosie wordt met _75%_ verhoogd.\n\n_+4:_ De kracht van de elementaire explosie wordt met _100%_ verhoogd.
actors.hero.talent.elemental_power.title=elementaire kracht
actors.hero.talent.elemental_reach.desc=_+1:_ Het bereik van de elementaire aanval wordt vergroot van 4 naar 5 tegels en de breedte van 65 naar 75 graden.\n\n_+2:_ Het bereik van de elementaire aanval wordt vergroot van 4 naar 6 tegels en de breedte van 65 naar 85 graden.\n\n_+3:_ Het bereik van de elementaire aanval wordt vergroot van 4 naar 7 tegels en de breedte van 65 naar 95 graden.\n\n_+4:_ Het bereik van de elementaire aanval wordt vergroot van 4 naar 8 tegels en de breedte van 65 naar 105 graden.
actors.hero.talent.elemental_reach.title=elementair bereik
actors.hero.talent.elimination_match.desc=_+1:_ Als de Duelist binnen 3 beurten na het einde van een duel opnieuw een uitdaging aangaat, zijn de kosten voor die uitdaging _16% lager_.\n\n_+2:_ Als de Duelist binnen 3 beurten na het einde van een duel opnieuw een uitdaging aangaat, zijn de kosten voor die uitdaging _30% lager_.\n\n_+3:_ Als de Duelist binnen 3 beurten na het einde van een duel opnieuw een uitdaging aangaat, zijn de kosten voor die uitdaging _40% lager_.\n\n_+4:_ Als de Duelist binnen 3 beurten na het einde van een duel opnieuw een uitdaging aangaat, zijn de kosten voor die uitdaging _50% lager_.
actors.hero.talent.elimination_match.title=eliminatiewedstrijd
actors.hero.talent.empowered_strike.desc=_+1:_ De eerste mêlee-aanval van de Strijdmagiër met zijn staf na een bliksemaanval richt _+16% schade_ aan en het bonuseffect van de staf krijgt _+50% kracht_.\n\n_+2:_ De eerste mêlee-aanval van de Strijdmagiër met zijn staf na een bliksemaanval richt _+33% schade_ aan en het bonuseffect van de staf krijgt _+100% kracht_.\n\n_+3:_ De eerste mêlee-aanval van de Strijdmagiër met zijn staf na een bliksemaanval richt _+50% schade_ aan en het bonuseffect van de staf krijgt _+150% kracht_.
actors.hero.talent.empowered_strike.title=gemobiliseerde staking
actors.hero.talent.empowering_meal.desc=_+1:_ Het eten van voedsel geeft de magiër _2 bonusschade_ op de volgende 3 keer dat hij schade toebrengt met een toverstaf.\n\n_+2:_ Het eten van voedsel geeft de magiër _3 bonusschade_ op de volgende 3 keer dat hij schade toebrengt met een toverstaf.
actors.hero.talent.empowering_meal.title=een maaltijd die energie geeft
actors.hero.talent.endless_rage.desc=_+1:_ De Berserker kan maximaal _116% woede_ bereiken.\n\n_+2:_ De Berserker kan maximaal _133% woede_ bereiken.\n\n_+3:_ De Berserker kan maximaal _150% woede_ bereiken.\n\nElk punt woede boven de 100% verhoogt de berserk-schilding met 1% en verkort de afkoeltijd met 1%, maar verhoogt de schadebonus niet boven de +50%.
actors.hero.talent.endless_rage.title=eindeloze woede
actors.hero.talent.energizing_meal.desc=_+1:_ Het eten van voedsel kost de magiër 1 beurt en geeft hem _5 beurten om zijn toverstaf op te laden_.\n\n_+2:_ Het eten van voedsel kost de magiër 1 beurt en geeft hem _8 beurten om zijn toverstaf op te laden_.
actors.hero.talent.energizing_meal.title=energieke maaltijd
actors.hero.talent.enhanced_combo.desc=_+1:_ Wanneer de combo van de Gladiator 7 of hoger is, neemt het terugstootbereik van Clobber toe tot 3, veroorzaakt het duizeligheid en kan het vijanden in putten slaan.\n\n_+2:_ Naast de voordelen van +1 werkt Parry op meerdere aanvallen wanneer de combo van de Gladiator 9 of hoger is.\n\n_+3:_ Naast de voordelen van +1 en +2 kan de Gladiator tot combo/3 tegels omhoog springen bij gebruik van Slam, Crush of Fury.
actors.hero.talent.enhanced_combo.title=verbeterde combinatie
actors.hero.talent.enhanced_lethality.desc=_+1:_ De Assassin kan vijanden uitschakelen die onder _4/13/27/67% gezondheid_ achterblijven per voorbereidingsniveau, in plaats van 3/10/20/50%.\n\n_+2:_ De Assassin kan vijanden uitschakelen die onder _5/17/33/83% gezondheid_ achterblijven per voorbereidingsniveau, in plaats van 3/10/20/50%.\n\n_+3:_ De Assassin kan vijanden uitschakelen die onder _6/20/40/100% gezondheid_ achterblijven per voorbereidingsniveau, in plaats van 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=verhoogde dodelijkheid
actors.hero.talent.enhanced_rings.desc=_+1:_ Wanneer de Schurk een artefact gebruikt, krijgen zijn ringen een upgrade van +1 gedurende _3 beurten_.\n\n_+2:_ Wanneer de Schurk een artefact gebruikt, krijgen zijn ringen een upgrade van +1 gedurende _6 beurten_.\n\n_+3:_ Wanneer de Schurk een artefact gebruikt, krijgen zijn ringen een upgrade van +1 gedurende _9 beurten_.
actors.hero.talent.enhanced_rings.title=verbeterde ringen
actors.hero.talent.enlightening_meal.desc=_+1:_ Het eten van voedsel kost de geestelijke 1 beurt en geeft hem _0,67 ladingen_ op zijn heilige boek.\n\n_+2:_ Het eten van voedsel kost de geestelijke 1 beurt en geeft hem _1 lading_ op zijn heilige boek.
actors.hero.talent.enlightening_meal.meta_desc=_Als een andere held dit talent verkrijgt_, geeft het in plaats daarvan 2 beurten opladen van toverstaf en artefacten met +1, of 3 beurten met +2. Dit kan niet worden gebruikt om de hoorn des overvloeds zichzelf te laten opladen.
actors.hero.talent.enlightening_meal.title=Verhelderende maaltijd
actors.hero.talent.enraged_catalyst.desc=_+1:_ Betoveringen en vloeken op het wapen van de Berserker worden vaker geactiveerd naarmate hij meer woede heeft, tot een maximum van _15% vaker_ bij 100% woede.\n\n_+2:_ Betoveringen en vloeken op het wapen van de Berserker worden vaker geactiveerd naarmate hij meer woede heeft, tot een maximum van _30% vaker_ bij 100% woede.\n\n_+3:_ Betoveringen en vloeken op het wapen van de Berserker worden vaker geactiveerd naarmate hij meer woede heeft, tot een maximum van _45% vaker_ bij 100% woede.
actors.hero.talent.enraged_catalyst.title=woedende katalysator
actors.hero.talent.evasive_armor.desc=_+1:_ Tijdens het freerunnen krijgt de Freerunner een extra _+1 ontwijking_ per overtollig krachtpunt op zijn pantser.\n\n_+2:_ Tijdens het freerunnen krijgt de Freerunner een extra _+2 ontwijking_ per overtollig krachtpunt op zijn pantser.\n\n_+3:_ Tijdens het freerunnen krijgt de Freerunner een extra _+3 ontwijkingen_ per overtollig krachtpunt op zijn pantser.
actors.hero.talent.evasive_armor.title=ontwijkend pantser
actors.hero.talent.even_the_odds.desc=_+1:_ De krijger deelt 5% extra schade toe aan elke vijand binnen 2 vakjes wanneer de verdediging eindigt.\n\n_+2:_ De krijger deelt 10% extra schade toe aan elke vijand binnen 2 vakjes wanneer de verdediging eindigt.\n\n_+3:_ De krijger deelt 15% extra schade toe aan elke vijand binnen 2 vakjes wanneer de verdediging eindigt.\n\n_+4:_ De krijger deelt 20% extra schade toe aan elke vijand binnen 2 vakjes wanneer de verdediging eindigt.
actors.hero.talent.even_the_odds.title=gelijke kansen
actors.hero.talent.excess_charge.desc=_+1:_ Wanneer de staf van de Strijdmagiër volledig is opgeladen, geeft zijn volgende bliksemstoot hem _0,67 schildpunten_ per niveau van de staf.\n\n_+2:_ Wanneer de staf van de Strijdmagiër volledig is opgeladen, geeft zijn volgende bliksemstoot hem _1,33 schildpunten_ per niveau van de staf.\n\n_+3:_ Wanneer de staf van de Strijdmagiër volledig is opgeladen, geeft zijn volgende bliksemstoot hem _2 schildpunten_ per niveau van de staf.
actors.hero.talent.excess_charge.title=extra kosten
actors.hero.talent.expanding_wave.desc=_+1:_ Het bereik van Shockwave wordt vergroot van 5 naar 6 tegels en de breedte van 60 naar 75 graden.\n\n_+2:_ Het bereik van Shockwave wordt vergroot van 5 naar 7 tegels en de breedte van 60 naar 90 graden.\n\n_+3:_ Het bereik van Shockwave wordt vergroot van 5 naar 8 tegels en de breedte van 60 naar 105 graden.\n\n_+4:_ Het bereik van Shockwave wordt vergroot van 5 naar 9 tegels en de breedte van 60 naar 120 graden.
actors.hero.talent.expanding_wave.title=uitbreidende golf
actors.hero.talent.expose_weakness.desc=_+1:_ Vijanden die het nagelbeeld van de Duelist aanvallen, worden zwak en kwetsbaar gedurende _2 beurten_.\n\n_+2:_ Vijanden die het nagelbeeld van de Duelist aanvallen, worden zwak en kwetsbaar gedurende _4 beurten_.\n\n_+3:_ Vijanden die het nagelbeeld van de Duelist aanvallen, worden zwak en kwetsbaar gedurende _6 beurten_.\n\n_+4:_ Vijanden die het nagelbeeld van de Duelist aanvallen, worden zwak en kwetsbaar gedurende _8 beurten_.
actors.hero.talent.expose_weakness.title=zwakke punten blootleggen
actors.hero.talent.fan_of_blades.desc=_+1:_ Spectrale messen kunnen tot _1 extra doelwit_ raken voor 50% schade. Het doelwit moet zichtbaar zijn en zich binnen een kegelvormig gebied van _30 graden_ bevinden.\n\n_+2:_ Spectrale messen kunnen tot _2 extra doelwitten_ raken voor 50% schade. De doelwitten moeten zichtbaar zijn en zich binnen een kegelvormig gebied van _60 graden_ bevinden.\n\n_+3:_ Spectrale messen kunnen tot _3 extra doelwitten_ raken voor 50% schade. De doelwitten moeten zichtbaar zijn en zich binnen een kegelvormig gebied van _90 graden_ bevinden.\n\n_+4:_ Spectrale messen kunnen tot _4 extra doelwitten_ raken voor 50% schade. De doelwitten moeten zichtbaar zijn en zich binnen een kegelvormig gebied van _120 graden_ bevinden.
actors.hero.talent.fan_of_blades.title=waaier van messen
actors.hero.talent.farsight.desc=_+1:_ Het zichtbereik van de sluipschutter wordt met 25% vergroot.\n\n_+2:_ Het zichtbereik van de sluipschutter wordt met 50% vergroot.\n\n_+3:_ Het zichtbereik van de sluipschutter wordt met 75% vergroot.
actors.hero.talent.farsight.title=vooruitziendheid
actors.hero.talent.fear_the_reaper.desc=_+1:_ Wanneer een vijand met een doodsmarkering 0 hp bereikt, wordt deze _verlamd_.\n\n_+2:_ Wanneer een vijand met een doodsmarkering 0 hp bereikt, wordt deze _gevreesd en verlamd_.\n\n_+3:_ Wanneer een vijand met een doodsmarkering 0 hp bereikt, wordt deze _gevreesd en verlamd_ en worden vijanden binnen 3 tegels _verlamd_.\n\n_+4:_ Wanneer een vijand met een doodsmarkering 0 hp bereikt, wordt deze _gevreesd en verlamd_ en worden vijanden binnen 3 tegels _gevreesd en verlamd_.
actors.hero.talent.fear_the_reaper.title=vrees de dood
actors.hero.talent.feigned_retreat.desc=_+1:_ Als een vijand het nagelbeeld van de Duelist aanvalt, krijgt ze _2 beurten_ haast.\n\n_+2:_ Als een vijand het nagelbeeld van de Duelist aanvalt, krijgt ze _4 beurten_ haast.\n\n_+3:_ Als een vijand het nagelbeeld van de Duelist aanvalt, krijgt ze _6 beurten_ haast.\n\n_+4:_ Als een vijand het nagelbeeld van de Duelist aanvalt, krijgt ze _8 beurten_ haast.
actors.hero.talent.feigned_retreat.title=geveinsde terugtrekking
actors.hero.talent.fire_everything.desc=_+1:_ Wilde magie wordt nu _5 keer_ geactiveerd in plaats van 4, en elke toverstaf heeft een _25% kans_ om 3 keer te worden gebruikt.\n\n_+2:_ Wilde magie wordt nu _6 keer_ geactiveerd in plaats van 4, en elke toverstaf heeft een _50% kans_ om 3 keer te worden gebruikt.\n\n_+3:_ Wilde magie wordt nu _7 keer_ geactiveerd in plaats van 4, en elke toverstaf heeft een _75% kans_ om 3 keer te worden gebruikt.\n\n_+4:_ Wilde magie wordt nu _8 keer_ geactiveerd in plaats van 4, en elke toverstaf heeft een _100% kans_ om 3 keer te worden gebruikt.
actors.hero.talent.fire_everything.title=Alles in de fik steken
actors.hero.talent.flash.desc=_+1:_ In de Verheven Vorm kan de Klerk _Flash_ gebruiken om tot _3 tegels_ weg te teleporteren.\n\n_+2:_ In de Verheven Vorm kan de Klerk _Flash_ gebruiken om tot _4 tegels_ weg te teleporteren.\n\n_+3:_ In de Verheven Vorm kan de Klerk _Flash_ gebruiken om tot _5 tegels_ weg te teleporteren.\n\n_+4:_ In de Verheven Vorm kan de Klerk _Flash_ gebruiken om tot _6 tegels_ weg te teleporteren.\n\nFlash kost aanvankelijk 2 tome-ladingen en 1 extra lading voor elk gebruik in dezelfde verheven vorm.
actors.hero.talent.flash.title=flash
actors.hero.talent.focused_meal.desc=_+1:_ Het eten van voedsel kost de Duelist 1 beurt en geeft haar _0,67 ladingen_ op haar wapens.\n\n_+2:_ Het eten van voedsel kost de Duelist 1 beurt en geeft haar _1 lading_ op haar wapens.
actors.hero.talent.focused_meal.meta_desc=_Als dit talent door een andere held wordt verkregen_, zal het in plaats daarvan bonusschade toekennen aan hun volgende aanval gelijk aan hun niveau/3 met +1, of niveau/2 met +2.
actors.hero.talent.focused_meal.title=gerichte maaltijd
actors.hero.talent.followup_strike.desc=_+1:_ Wanneer de Jageres een vijand raakt met haar boog of een werpwapen, brengt haar volgende mêlee-aanval tegen die vijand _2 bonusschade_ toe.\n\n_+2:_ Wanneer de Jageres een vijand raakt met haar boog of een werpwapen, brengt haar volgende mêlee-aanval tegen die vijand _3 bonusschade_ toe.
actors.hero.talent.followup_strike.title=vervolgstaking
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Aanvallen van de geesthavik verblinden vijanden gedurende _2 beurten_.\n\n_+2:_ Aanvallen van de geesthavik verblinden vijanden gedurende _5 beurten_.\n\n_+3:_ Aanvallen van de geesthavik verblinden vijanden gedurende _5 beurten_ en verlammen ze gedurende _2 beurten_.\n\n_+4:_ Aanvallen van de geesthavik verblinden vijanden gedurende _5 beurten_ en verlammen ze gedurende _5 beurten_.
actors.hero.talent.go_for_the_eyes.title=richt je op de ogen
actors.hero.talent.growing_power.desc=_+1:_ De aanvals- en bewegingssnelheidsboosts van de natuurkracht worden verhoogd naar _38% en 125%_, van 33% en 100%.\n\n_+2:_ De aanvals- en bewegingssnelheidsboosts van de natuurkracht worden verhoogd naar _42% en 150%_, van 33% en 100%.\n\n_+3:_ De aanvals- en bewegingssnelheidsboosts van de natuurkracht worden verhoogd naar _46% en 175%_, van 33% en 100%.\n\n_+4:_ De aanvals- en bewegingssnelheidsboosts van de natuurkracht worden verhoogd naar _50% en 200%_, van 33% en 100%.
actors.hero.talent.growing_power.title=groeiende macht
actors.hero.talent.hallowed_ground.desc=_+1:_ De Priester kan _Heilige Grond_ uitspreken, een spreuk die terrein heiligt in een gebied van _3x3_ gedurende 20 beurten, tegen een kostprijs van 2 ladingen.\n\n_+2:_ De Priester kan _Heilige Grond_ uitspreken, een spreuk die terrein heiligt in een gebied van _5x5_ gedurende 20 beurten, tegen een kostprijs van 2 ladingen.\n\n_+3:_ De Priester kan _Heilige Grond_ uitspreken, een spreuk die terrein heiligt in een gebied van _7x7_ gedurende 20 beurten, tegen een kostprijs van 2 ladingen.\n\nWanneer het wordt uitgesproken, geneest Heilige Grond bondgenoten met 15 HP, wortelt vijanden kortstondig en verspreidt kort gras. Daarna geneest het langzaam bondgenoten, verzwakt het vijanden en zorgt het ervoor dat er willekeurig hoog gras groeit. Heilige grond biedt de priester bescherming in plaats van genezing en wordt door vuur vernietigd.
actors.hero.talent.hallowed_ground.title=heilige grond
actors.hero.talent.hasty_retreat.desc=_+1:_ Na het knipperen krijgt de Schurk _1 beurt_ haast en onzichtbaarheid.\n\n_+2:_ Na het knipperen krijgt de Schurk _2 beurten_ haast en onzichtbaarheid.\n\n_+3:_ Na het knipperen krijgt de Schurk _3 beurten_ haast en onzichtbaarheid.\n\n_+4:_ Na het knipperen krijgt de Schurk _4 beurten_ haast en onzichtbaarheid.
actors.hero.talent.hasty_retreat.title=haastige terugtrekking
actors.hero.talent.hearty_meal.desc=_+1:_ Het eten van voedsel geneest de krijger met _4 HP_ wanneer zijn gezondheid 33% of lager is.\n\n_+2:_ Het eten van voedsel geneest de krijger met _6 HP_ wanneer zijn gezondheid 33% of lager is.
actors.hero.talent.hearty_meal.title=stevige maaltijd
actors.hero.talent.heightened_senses.desc=_+1:_ De Jageres krijgt telepathie op personages binnen _2 tegels van haar positie_.\n\n_+2:_ De Jageres krijgt telepathie op personages binnen _3 tegels van haar positie_.
actors.hero.talent.heightened_senses.title=verscherpte zintuigen
actors.hero.talent.heroic_energy.desc=_+1:_ De pantservaardigheid van de held heeft 12% lagere laadkosten.\n\n_+2:_ De pantservaardigheid van de held heeft 23% lagere laadkosten.\n\n_+3:_ De pantservaardigheid van de held heeft 32% lagere laadkosten.\n\n_+4:_ De pantservaardigheid van de held heeft 40% lagere laadkosten.
actors.hero.talent.heroic_energy.rat_title=ratroïsche energie
actors.hero.talent.heroic_energy.title=heldhaftige energie
actors.hero.talent.hold_fast.desc=_+1:_ Wanneer de krijger wacht, krijgt hij _1-2 pantser_ en wordt de afname van combo- en schildbuffs met _50%_ vertraagd totdat hij beweegt.\n\n_+2:_ Wanneer de krijger wacht, krijgt hij _2-4 pantser_ en wordt de afname van combo- en schildbuffs met _75%_ vertraagd totdat hij beweegt.\n\n_+3:_ Wanneer de krijger wacht, krijgt hij _3-6 pantser_ en wordt de afname van combo- en schildbuffs met _100%_ vertraagd totdat hij beweegt.
actors.hero.talent.hold_fast.title=houd stand
actors.hero.talent.holy_intuition.desc=_+1:_ De geestelijke kan _Heilige Intuïtie_ uitspreken, een spreuk die onthult of een voorwerp vervloekt is, tegen een kostprijs van _3 ladingen._\n\n_+2:_ De geestelijke kan _Heilige Intuïtie_ uitspreken, een spreuk die onthult of een voorwerp vervloekt is, tegen een kostprijs van _2 ladingen._
actors.hero.talent.holy_intuition.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, kan de held hiermee de vloekstatus van een vervloekt voorwerp identificeren vlak voordat hij het uitrust, in 15% van de gevallen bij +1 of in 25% van de gevallen bij +2.
actors.hero.talent.holy_intuition.title=heilige intuïtie
actors.hero.talent.holy_lance.desc=_+1:_ De priester kan _Heilige Lans_ uitspreken, een verwoestende spreuk die _30-55 schade_ toebrengt voor 4 ladingen.\n\n_+2:_ De priester kan _Heilige Lans_ uitspreken, een verwoestende spreuk die _45-83 schade_ toebrengt voor 4 ladingen.\n\n_+3:_ De priester kan _Heilige Lans_ uitspreken, een verwoestende spreuk die _60-110 schade_ toebrengt voor 4 ladingen.\n\nHeilige Lans brengt altijd maximale schade toe aan demonische en ondode vijanden. Heilige Lans heeft een afkoeltijd van 30 beurten voordat deze opnieuw kan worden uitgesproken.
actors.hero.talent.holy_lance.title=heilige lans
actors.hero.talent.impact_wave.desc=_+1:_ Wanneer de krijger landt na een sprong, worden alle aangrenzende vijanden _2 tegels_ naar achteren geduwd en hebben ze _25% kans_ om gedurende 5 beurten kwetsbaar te worden.\n\n_+2:_ Wanneer de krijger landt na een sprong, worden alle aangrenzende vijanden _3 tegels_ naar achteren geduwd en hebben ze _50% kans_ om gedurende 5 beurten kwetsbaar te worden.\n\n_+3:_ Wanneer de krijger landt na een sprong, worden alle aangrenzende vijanden _4 tegels_ naar achteren geduwd en hebben ze _75% kans_ om gedurende 5 beurten kwetsbaar te worden.\n\n_+4:_ Wanneer de krijger landt na een sprong, worden alle aangrenzende vijanden _5 tegels_ naar achteren geduwd en hebben ze _100% kans_ om gedurende 5 beurten kwetsbaar te worden.
actors.hero.talent.impact_wave.title=impactgolf
actors.hero.talent.improvised_projectiles.desc=_+1:_ De krijger kan een vijand _2 beurten_ verblinden door een voorwerp (geen werpwapen) naar hem te gooien. Dit heeft een afkoeltijd van 50 beurten.\n\n_+2:_ De krijger kan een vijand _3 beurten_ verblinden door een voorwerp (geen werpwapen) naar hem te gooien. Dit heeft een afkoeltijd van 50 beurten.
actors.hero.talent.improvised_projectiles.title=geïmproviseerde projectielen
actors.hero.talent.inscribed_power.desc=_+1:_ Wanneer de magiër een perkament leest of een spreukitem gebruikt, krijgen zijn _volgende 2 toverstafaanvallen_ +2 niveaus.\n\n_+2:_ Wanneer de magiër een perkament leest of een spreukitem gebruikt, krijgen zijn _volgende 3 toverstafaanvallen_ +2 niveaus.\n\nHet aantal verbeterde toverstafaanvallen wordt verdubbeld bij gebruik van een perkament voor upgrades, transmutaties of alchemie-items die met behulp van die perkamenten moeten worden vervaardigd.\n\nVoor alchemie-items met een hogere output (bijv. de meeste spreuken) heeft dit talent een kans om te activeren op basis van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.inscribed_power.title=ingeschreven kracht
actors.hero.talent.inscribed_stealth.desc=_+1:_ De Schurk krijgt _3 beurten_ onzichtbaarheid na het lezen van een perkament of het gebruiken van een spreukitem.\n\n_+2:_ De Schurk krijgt _5 beurten_ onzichtbaarheid na het lezen van een perkament of het gebruiken van een spreukitem.\n\nDe duur van de onzichtbaarheid wordt verdubbeld bij gebruik van een upgrade-perkament, een transmutatie-perkament of alchemie-items die met behulp van die perkamenten moeten worden gemaakt.\n\nVoor alchemie-items met een hogere output (bijv. de meeste spreuken) heeft dit talent een kans om te activeren, afhankelijk van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.inscribed_stealth.title=gegraveerde stealth
actors.hero.talent.invigorating_meal.desc=_+1:_ Het eten van voedsel kost de Jageres 1 beurt (bessen worden direct gegeten) en geeft haar _1 beurt haast_.\n\n_+2:_ Het eten van voedsel kost de Jageres 1 beurt (bessen worden direct gegeten) en geeft haar _2 beurten haast_.
actors.hero.talent.invigorating_meal.title=verkwikkende maaltijd
actors.hero.talent.invigorating_victory.desc=_+1:_ Als de Duelist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _5 HP plus 30% van de schade_ die ze tijdens het duel heeft opgelopen.\n\n_+2:_ Als de Duelist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _10 HP plus 50% van de schade_ die ze tijdens het duel heeft opgelopen.\n\n_+3:_ Als de Duelist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _15 HP plus 65% van de schade_ die ze tijdens het duel heeft opgelopen.\n\n_+4:_ Als de Duelist haar doelwit verslaat voordat het duel eindigt, geneest ze voor _20 HP plus 75% van de schade_ die ze tijdens het duel heeft opgelopen.
actors.hero.talent.invigorating_victory.title=verkwikkende overwinning
actors.hero.talent.iron_stomach.desc=_+1:_ Het eten van voedsel kost de krijger 1 beurt en geeft hem _75% schadebestendigheid_ tijdens het eten.\n\n_+2:_ Het eten van voedsel kost de krijger 1 beurt en geeft hem _100% schadebestendigheid_ tijdens het eten.
actors.hero.talent.iron_stomach.title=ijzeren maag
actors.hero.talent.iron_will.desc=_+1:_ Het schild dat het zegel van de Krijger biedt, wordt met 1 verhoogd.\n\n_+2:_ Het schild dat het zegel van de Krijger biedt, wordt met 2 verhoogd.
actors.hero.talent.iron_will.meta_desc=_Als een andere held dit talent verkrijgt_, zal het passief een versie van het gebroken zegel-effect van de Krijger verlenen met maximaal 1 of 2 schildpunten.
actors.hero.talent.iron_will.title=ijzer zal
actors.hero.talent.judgement.desc=_+1:_ In de Verheven Vorm kan de Klerk _Oordeel_ uitspreken, wat _10-20 schade_ toebrengt aan alle zichtbare vijanden.\n\n_+2:_ In de Verheven Vorm kan de Klerk _Oordeel_ uitspreken, wat _15-30 schade_ toebrengt aan alle zichtbare vijanden.\n\n_+3:_ In de Verheven Vorm kan de Klerk _Oordeel_ uitspreken, wat _20-40 schade_ toebrengt aan alle zichtbare vijanden.\n\n_+4:_ In de Verheven Vorm kan de Klerk _Oordeel_ uitspreken, wat _25-50 schade_ toebrengt aan alle zichtbare vijanden.\n\n_Oordeel kost 3 tome-ladingen. Judgement deelt 33% extra schade toe voor elke spreuk die de geestelijke heeft uitgesproken sinds hij zijn verheven vorm heeft bereikt of sinds de laatste keer dat Judgement is uitgesproken.
actors.hero.talent.judgement.title=oordeel
actors.hero.talent.lay_on_hands.desc=_+1:_ De Paladijn kan _Handoplegging_ uitspreken, een spreuk die een nabijgelegen personage direct geneest met _15 HP_ of de Paladijn _15 schild_ geeft, tegen een kostprijs van 1 lading.\n\n_+2:_ De Paladijn kan _Handoplegging_ uitspreken, een spreuk die een nabijgelegen personage direct geneest met _20 HP_ of de Paladijn _20 schild_ geeft, tegen een kostprijs van 1 lading.\n\n_+3:_ De Paladijn kan _Handoplegging_ uitspreken, een spreuk die een nabijgelegen personage direct geneest met _25 HP_ of de Paladijn _25 schild_ geeft, tegen een kostprijs van 1 lading.\n\nOvertollige genezing van deze spreuk wordt omgezet in schild. Handoplegging kan herhaaldelijk worden gebruikt, maar kan niet meer dan de bescherming van drie spreuken tegelijk bieden.
actors.hero.talent.lay_on_hands.title=handoplegging
actors.hero.talent.lethal_defense.desc=_+1:_ Wanneer de Gladiator een vijand doodt met een combo-aanval, wordt de afkoeltijd van zijn gebroken zegel-schild met 50 beurten verkort.\n\n_+2:_ Wanneer de Gladiator een vijand doodt met een combo-aanval, wordt de afkoeltijd van zijn gebroken zegel-schild met 100 beurten verkort.\n\n_+3:_ Wanneer de Gladiator een vijand doodt met een combo-aanval, wordt de afkoeltijd van zijn gebroken zegel-schild met 150 beurten verkort.\n\nDe afkoeltijd van het schild kan door dit talent tot wel -150 beurten worden verkort, wat betekent dat het direct weer beschikbaar is zodra het is geactiveerd.
actors.hero.talent.lethal_defense.title=dodelijke verdediging
actors.hero.talent.lethal_haste.desc=_+1:_ Wanneer de Duelist een dodelijke slag toebrengt aan een vijand met een wapenvaardigheid, krijgt ze _3 beurten_ aan directe beweging.\n\n_+2:_ Wanneer de Duelist een dodelijke slag toebrengt aan een vijand met een wapenvaardigheid, krijgt ze _5 beurten_ aan directe beweging.
actors.hero.talent.lethal_haste.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, wordt deze in plaats daarvan geactiveerd bij normale wapenaanvallen, met een afkoeltijd van 100 beurten.
actors.hero.talent.lethal_haste.title=dodelijke haast
actors.hero.talent.lethal_momentum.desc=_+1:_ Wanneer de krijger een vijand een dodelijke slag toebrengt met een fysiek wapen, heeft deze _67% kans_ om 0 beurten te nemen.\n\n_+2:_ Wanneer de krijger een vijand een dodelijke slag toebrengt met een fysiek wapen, heeft deze _100% kans_ om 0 beurten te nemen.
actors.hero.talent.lethal_momentum.title=dodelijk momentum
actors.hero.talent.life_link.desc=De geestelijke kan _Levensverbinding_ tussen zichzelf en een versterkte bondgenoot oproepen tegen een kostprijs van 2 ladingen. Deze spreuk zorgt ervoor dat schade wordt gedeeld tussen de geestelijke en zijn bondgenoot, en zorgt ervoor dat gunstige geestelijke spreuken van niveau 3 of lager op beiden van toepassing zijn als een van beiden wordt getroffen.\n\n_+1:_ Levensverbinding duurt 10 beurten en verhoogt de bonus van Kracht van Velen naar -35% ontvangen schade._\n\n_+2:_ Levensverbinding duurt 13 beurten en verhoogt de bonus van Kracht van Velen naar -40% ontvangen schade._\n\n_+3:_ Levensverbinding duurt 17 beurten en verhoogt de bonus van Kracht van Velen naar -45% ontvangen schade._\n\n_+4:_ Levensverbinding duurt 20 beurten en verhoogt de bonus van Kracht van Velen naar -50% ontvangen schade._
actors.hero.talent.life_link.title=levenslink
actors.hero.talent.light_cloak.desc=_+1:_ De Schurk kan zijn schaduwmantel gebruiken wanneer deze niet is uitgerust, maar deze laadt op met _25% van de normale snelheid_ wanneer deze niet is uitgerust.\n\n_+2:_ De Schurk kan zijn schaduwmantel gebruiken wanneer deze niet is uitgerust, maar deze laadt op met _50% van de normale snelheid_ wanneer deze niet is uitgerust.\n\n_+3:_ De Schurk kan zijn schaduwmantel gebruiken wanneer deze niet is uitgerust, maar deze laadt op met _75% van de normale snelheid_ wanneer deze niet is uitgerust.
actors.hero.talent.light_cloak.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan de oplaadsnelheid van alle artefacten met 7/13/20% verhogen bij +1/+2/+3.
actors.hero.talent.light_cloak.title=lichtmantel
actors.hero.talent.light_reading.desc=_+1:_ De geestelijke kan zijn heilige boek gebruiken wanneer het niet is uitgerust, maar het laadt op met _25% snelheid_ wanneer het niet is uitgerust.\n\n_+2:_ De geestelijke kan zijn heilige boek gebruiken wanneer het niet is uitgerust, maar het laadt op met _50% snelheid_ wanneer het niet is uitgerust.\n\n_+3:_ De geestelijke kan zijn heilige boek gebruiken wanneer het niet is uitgerust, maar het laadt op met _75% snelheid_ wanneer het niet is uitgerust.
actors.hero.talent.light_reading.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan de oplaadsnelheid van alle toverstaven met 7/13/20% verhogen bij +1/+2/+3.
actors.hero.talent.light_reading.title=Lichte lectuur
actors.hero.talent.lingering_magic.desc=_+1:_ Wanneer de magiër een bliksemstraal afvuurt met een toverstaf of staf, richt zijn volgende fysieke aanval _1-2 bonusschade_ aan.\n\n_+2:_ Wanneer de magiër een bliksemstraal afvuurt met een toverstaf of staf, richt zijn volgende fysieke aanval _2 bonusschade_ aan.
actors.hero.talent.lingering_magic.title=aanhoudende magie
actors.hero.talent.liquid_agility.desc=_+1:_ Wanneer de Duelist een drankje, brouwsel of elixer drinkt of gooit, heeft ze _3x ontwijking_ en _3x nauwkeurigheid_ op haar volgende mêlee-aanval binnen 5 beurten.\n\n_+2:_ Wanneer de Duelist een drankje, brouwsel of elixer drinkt of gooit, heeft ze _oneindige ontwijking_ en _oneindige nauwkeurigheid_ op haar volgende mêlee-aanval binnen 5 beurten.\n\nDeze bonus duurt één extra beurt en aanval bij gebruik van krachtdrankjes, ervaringsdrankjes of alchemie-items die met die drankjes gemaakt moeten worden.\n\nVoor alchemie-items met een hogere output (bijv. aquabrouwsel) heeft dit talent een kans om te activeren, afhankelijk van hoeveel van dat item er geproduceerd wordt.
actors.hero.talent.liquid_agility.title=vloeibare behendigheid
actors.hero.talent.liquid_nature.desc=_+1:_ Wanneer de Jageres een drankje, brouwsel of elixer drinkt of gooit, ontspruiten er maximaal 4 grasvelden in de omgeving en worden aangrenzende vijanden 1 beurt lang vastgezet.\n\n_+2:_ Wanneer de Jageres een drankje, brouwsel of elixer drinkt of gooit, ontspruiten er maximaal 6 grasvelden in de omgeving en worden aangrenzende vijanden 2 beurten lang vastgezet.\n\nDe hoeveelheid gras en de duur van de vastzetting worden verdubbeld bij gebruik van krachtdrankjes, ervaringsdrankjes of alchemie-items die met behulp van die drankjes moeten worden gemaakt.\n\nVoor alchemie-items met een hogere opbrengst (bijv. waterbrouwsel) heeft dit talent een kans om te activeren, afhankelijk van hoeveel van dat item er wordt geproduceerd.
actors.hero.talent.liquid_nature.title=vloeibare aard
actors.hero.talent.liquid_willpower.desc=_+1:_ De krijger krijgt _6,5% van zijn maximale HP aan schild_ bij het drinken of gooien van een drankje, brouwsel of elixer.\n\n_+2:_ De krijger krijgt _10% van zijn maximale HP aan schild_ bij het drinken of gooien van een drankje, brouwsel of elixer.\n\nDe hoeveelheid schild wordt verdubbeld bij gebruik van krachtdrankjes, ervaringsdrankjes of alchemie-items die met die drankjes moeten worden gemaakt.\n\nVoor alchemie-items met een hogere opbrengst (bijv. waterbrouwsel) heeft dit talent een kans om te activeren, afhankelijk van hoeveel van dat item wordt geproduceerd.
actors.hero.talent.liquid_willpower.title=vloeibare wilskracht
actors.hero.talent.longrange_warp.desc=_+1:_ De magiër kan nu tussen verdiepingen teleporteren, tegen _150% van de kosten_.\n\n_+2:_ De magiër kan nu tussen verdiepingen teleporteren, tegen _117% van de kosten_.\n\n_+3:_ De magiër kan nu tussen verdiepingen teleporteren, tegen _83% van de kosten_.\n\n_+4:_ De magiër kan nu tussen verdiepingen teleporteren, tegen _50% van de kosten_.\n\nDe magiër kan geen teleportatie over lange afstand gebruiken om een afgesloten verdieping te verlaten.
actors.hero.talent.longrange_warp.title=Langeafstandswarp
actors.hero.talent.mind_form.desc=De geestelijke kan _Geestvorm_ oproepen, waardoor Trinity de kracht krijgt van een toverstaf of werpwapen dat de geestelijke in deze run heeft gebruikt, tegen een kostprijs van 3 ladingen. \n\n_+1:_ Wanneer Trinity wordt gebruikt, gebruikt de geestelijke het bliksem- of werpeffect van het gekozen voorwerp alsof het _+3 is._\n\n_+2:_ Wanneer Trinity wordt gebruikt, gebruikt de geestelijke het bliksem- of werpeffect van het gekozen voorwerp alsof het _+4 is._\n\n_+3:_ Wanneer Trinity wordt gebruikt, gebruikt de geestelijke het bliksem- of werpeffect van het gekozen voorwerp alsof het _+5 is._\n\n_+4:_ Wanneer Trinity wordt gebruikt, gebruikt de geestelijke het bliksem- of werpeffect van het gekozen voorwerp alsof het _+6._\n\nTrinity kan slechts met één geesteffect tegelijk worden doordrenkt.
actors.hero.talent.mind_form.title=geestvorm
actors.hero.talent.mnemonic_prayer.desc=_+1:_ De Priester kan _Mnemonic Prayer_ uitspreken, een spreuk die buffs/debuffs op een bondgenoot/vijand met _3 beurten_ verlengt voor 1 lading.\n\n_+2:_ De Priester kan _Mnemonic Prayer_ uitspreken, een spreuk die buffs/debuffs op een bondgenoot/vijand met _4 beurten_ verlengt voor 1 lading.\n\n_+3:_ De Priester kan _Mnemonic Prayer_ uitspreken, een spreuk die buffs/debuffs op een bondgenoot/vijand met _5 beurten_ verlengt voor 1 lading.\n\nMnemonic Prayer kost geen tijd om uit te spreken. Mnemonic Prayer kan een specifieke instantie van een buff/debuff slechts één keer verlengen en kan geen buffs van pantservaardigheden verlengen.
actors.hero.talent.mnemonic_prayer.title=geheugensteuntje gebed
actors.hero.talent.monastic_vigor.desc=_+1:_ Als de monnik _100% energie_ heeft, worden haar vaardigheden versterkt.\n\n_+2:_ Als de monnik _80% of meer energie_ heeft, worden haar vaardigheden versterkt.\n\n_+3:_ Als de monnik _60% of meer energie_ heeft, worden haar vaardigheden versterkt.\n\nWanneer versterkt:\n- Flurry past de betovering van je wapen toe\n- Focus is direct\n- Dash krijgt +4 bereik\n- Dragon Kick doet +50% schade en past het terugstoot- en verdovingseffect toe op alle aangrenzende vijanden\n- Meditate geneest langzaam 20% van de ontbrekende HP en geeft 80% schadebestendigheid.
actors.hero.talent.monastic_vigor.title=monastieke kracht
actors.hero.talent.mystical_charge.desc=_+1:_ Door met zijn staf te slaan, krijgt de Strijdmagiër _0,5 beurten_ de tijd om zijn artefacten op te laden.\n\n_+2:_ Door met zijn staf te slaan, krijgt de Strijdmagiër _1 beurt_ de tijd om zijn artefacten op te laden.\n\n_+3:_ Door met zijn staf te slaan, krijgt de Strijdmagiër _1,5 beurten_ de tijd om zijn artefacten op te laden.
actors.hero.talent.mystical_charge.title=mystieke lading
actors.hero.talent.mystical_meal.desc=_+1:_ Het eten van voedsel kost de Schurk 1 beurt (rantsoenen worden direct gegeten) en geeft hem _3 beurten om artefacten op te laden_.\n\n_+2:_ Het eten van voedsel kost de Schurk 1 beurt (rantsoenen worden direct gegeten) en geeft hem _5 beurten om artefacten op te laden_.\n\nDeze vaardigheid kan niet worden gebruikt om de hoorn des overvloeds zichzelf te laten opladen.
actors.hero.talent.mystical_meal.title=mystieke maaltijd
actors.hero.talent.natures_aid.desc=_+1:_ De Jageres krijgt 0-2 pantser van boomschors, dat elke _3 beurten_ verdwijnt wanneer het effect van een plant in haar zichtveld wordt geactiveerd.\n\n_+2:_ De Jageres krijgt 0-2 pantser van boomschors, dat elke _5 beurten_ verdwijnt wanneer het effect van een plant in haar zichtveld wordt geactiveerd.
actors.hero.talent.natures_aid.title=hulp van de natuur
actors.hero.talent.natures_bounty.desc=_+1:_ De Jageres kan _4 bessen_ vinden die verborgen liggen in het hoge gras terwijl ze de volgende paar verdiepingen van de kerker verkent.\n\n_+2:_ De Jageres kan _6 bessen_ vinden die verborgen liggen in het hoge gras terwijl ze de volgende paar verdiepingen van de kerker verkent.\n\nBessen worden snel gegeten, geven een beetje verzadiging en kunnen een bruikbaar zaadje bevatten.
actors.hero.talent.natures_bounty.title=de overvloed van de natuur
actors.hero.talent.natures_wrath.desc=_+1:_ Zolang de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _8%_ om een willekeurig schadelijk planteneffect te activeren.\n\n_+2:_ Zolang de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _17%_ om een willekeurig schadelijk planteneffect te activeren.\n\n_+3:_ Zolang de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _25%_ om een willekeurig schadelijk planteneffect te activeren.\n\n_+4:_ Zolang de kracht van de natuur actief is, hebben schoten van de geestboog een kans van _33%_ om een willekeurig schadelijk planteneffect te activeren.\n\nDe planten die geactiveerd kunnen worden zijn: blindkruid, vuurbloem, ijskap, verdrietmos en stormwijnstok.
actors.hero.talent.natures_wrath.title=de toorn van de natuur
actors.hero.talent.necromancers_minions.desc=_+1:_ Wanneer een vijand met een zielmarkering sterft, heeft de Warlock _13% kans_ om hem als een verdorven geest te laten herrijzen.\n\n_+2:_ Wanneer een vijand met een zielmarkering sterft, heeft de Warlock _27% kans_ om hem als een verdorven geest te laten herrijzen.\n\n_+3:_ Wanneer een vijand met een zielmarkering sterft, heeft de Warlock _40% kans_ om hem als een verdorven geest te laten herrijzen.
actors.hero.talent.necromancers_minions.title=handlangers van de necromancer
actors.hero.talent.patient_strike.desc=_+1:_ Als de Duelist wacht voordat ze een mêlee-aanval uitvoert, zal ze _1-2 bonusschade_ toebrengen.\n\n_+2:_ Als de Duelist wacht voordat ze een mêlee-aanval uitvoert, zal ze _2 bonusschade_ toebrengen.
actors.hero.talent.patient_strike.title=patiëntenstaking
actors.hero.talent.perfect_copy.desc=_+1:_ De schaduwkloon krijgt _10%_ van de maximale HP van de held en kan direct van plaats wisselen met de held tot op _1 tegel_ afstand.\n\n_+2:_ De schaduwkloon krijgt _20%_ van de maximale HP van de held en kan direct van plaats wisselen met de held tot op _2 tegels_ afstand.\n\n_+3:_ De schaduwkloon krijgt _30%_ van de maximale HP van de held en kan direct van plaats wisselen met de held tot op _3 tegels_ afstand.\n\n_+4:_ De schaduwkloon krijgt _40%_ van de maximale HP van de held en kan direct van plaats wisselen met de held tot op _4 tegels_ afstand.
actors.hero.talent.perfect_copy.title=perfecte kopie
actors.hero.talent.point_blank.desc=_+1:_ Wanneer de Jageres haar boog of een werpwapen op korte afstand gebruikt, heeft deze _-25% nauwkeurigheid_ in plaats van -50%.\n\n_+2:_ Wanneer de Jageres haar boog of een werpwapen op korte afstand gebruikt, heeft deze _normale nauwkeurigheid_ in plaats van -50%.\n\n_+3:_ Wanneer de Jageres haar boog of een werpwapen op korte afstand gebruikt, heeft deze _+25% nauwkeurigheid_ in plaats van -50%.\n\nMerk op dat werpwapens of de geestboog altijd +50% nauwkeurigheid hebben wanneer ze op afstand worden gebruikt.
actors.hero.talent.point_blank.title=zonder omhaal
actors.hero.talent.precise_assault.desc=_+1:_ Wanneer de Duelist een wapenvaardigheid gebruikt, krijgt ze _2x nauwkeurigheid_ op haar volgende mêlee-aanval binnen 5 beurten.\n\n_+2:_ Wanneer de Duelist een wapenvaardigheid gebruikt, krijgt ze _5x nauwkeurigheid_ op haar volgende mêlee-aanval binnen 5 beurten.\n\n_+3:_ Wanneer de Duelist een wapenvaardigheid gebruikt, krijgt ze _oneindige nauwkeurigheid_ op haar volgende mêlee-aanval binnen 5 beurten.
actors.hero.talent.precise_assault.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan de nauwkeurigheid bij mêlee-aanvallen met 10% verhogen bij +1, met 20% bij +2 of met 30% bij +3.
actors.hero.talent.precise_assault.title=precieze aanval
actors.hero.talent.projectile_momentum.desc=_+1:_ Tijdens het freerunning krijgt de Freerunner _+50% nauwkeurigheid en +15% schade_ met werpwapens.\n\n_+2:_ Tijdens het freerunning krijgt de Freerunner _+100% nauwkeurigheid en +30% schade_ met werpwapens.\n\n_+3:_ Tijdens het freerunning krijgt de Freerunner _+150% nauwkeurigheid en +45% schade_ met werpwapens.
actors.hero.talent.projectile_momentum.title=projectielimpuls
actors.hero.talent.projecting_blades.desc=_+1:_ Spectrale messen hebben een nauwkeurigheid van _+25%_ en kunnen tot _2 massieve tegels_ doorboren.\n\n_+2:_ Spectrale messen hebben een nauwkeurigheid van _+50% en kunnen tot _4 massieve tegels_ doorboren.\n\n_+3:_ Spectrale messen hebben een nauwkeurigheid van _+75% en kunnen tot _6 massieve tegels_ doorboren.\n\n_+4:_ Spectrale messen hebben een nauwkeurigheid van _+100% en kunnen tot _8 massieve tegels_ doorboren.
actors.hero.talent.projecting_blades.title=uitstekende bladen
actors.hero.talent.protective_shadows.desc=_+1:_ De Schurk krijgt één schildpunt _om de beurt_ dat hij onzichtbaar is, _tot een maximum van 3_.\n\n_+2:_ De Schurk krijgt één schildpunt _elke beurt_ dat hij onzichtbaar is, _tot een maximum van 5_.
actors.hero.talent.protective_shadows.title=beschermende schaduwen
actors.hero.talent.provoked_anger.desc=_+1:_ Wanneer een schildbuff die op de krijger is toegepast, door schade wordt verbroken, zal zijn volgende fysieke aanval _3 bonusschade_ toebrengen.\n\n_+2:_ Wanneer een schildbuff die op de krijger is toegepast, door schade wordt verbroken, zal zijn volgende fysieke aanval _5 bonusschade_ toebrengen.
actors.hero.talent.provoked_anger.title=uitgelokte woede
actors.hero.talent.ratforcements.desc=_+1:_ Ratmogrify op jezelf gebruiken _spawnt 1_ bondgenoot buidelrat naast je.\n\n_+2:_ Ratmogrify op jezelf gebruiken _spawnt 2_ bondgenoten buidelratten naast je.\n\n_+3:_ Ratmogrify op jezelf gebruiken _spawnt 3_ bondgenoten buidelratten naast je.\n\n_+4:_ Ratmogrify op jezelf gebruiken _spawnt 4_ bondgenoten buidelratten naast je.
actors.hero.talent.ratforcements.title=ratificaties
actors.hero.talent.ratlomacy.desc=_+1:_ Het gebruik van ratmogrify op een geratmogrificeerde vijand maakt hem vriendelijk en de transformatie permanent.\n\n_+2:_ Het gebruik van ratmogrify op een geratmogrificeerde vijand maakt hem vriendelijk, de transformatie permanent en geeft hem _2 beurten_ adrenaline.\n\n_+3:_ Het gebruik van ratmogrify op een geratmogrificeerde vijand maakt hem vriendelijk, de transformatie permanent en geeft hem _4 beurten_ adrenaline.\n\n_+4:_ Het gebruik van ratmogrify op een geratmogrificeerde vijand maakt hem vriendelijk, de transformatie permanent en geeft hem _6 beurten_ adrenaline.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratsistance.desc=_+1:_ Vijandige vijanden met rattenvermomming richten _-10% schade_ aan.\n\n_+2:_ Vijandige vijanden met rattenvermomming richten _-19% schade_ aan.\n\n_+3:_ Vijandige vijanden met rattenvermomming richten _-27% schade_ aan.\n\n_+4:_ Vijandige vijanden met rattenvermomming richten _-35% schade_ aan.
actors.hero.talent.ratsistance.title=rattenresistentie
actors.hero.talent.reactive_barrier.desc=_+1:_ De magiër krijgt _2,5 schildpunten_ voor elk personage dat door een elementaire explosie wordt getroffen, tot een maximum van 5 personages.\n\n_+2:_ De magiër krijgt _5 schildpunten_ voor elk personage dat door een elementaire explosie wordt getroffen, tot een maximum van 6 personages.\n\n_+3:_ De magiër krijgt _7,5 schildpunten_ voor elk personage dat door een elementaire explosie wordt getroffen, tot een maximum van 7 personages.\n\n_+4:_ De magiër krijgt _10 schildpunten_ voor elk personage dat door een elementaire explosie wordt getroffen, tot een maximum van 8 personages.
actors.hero.talent.reactive_barrier.title=reactieve barrière
actors.hero.talent.recall_inscription.desc=_+1:_ De geestelijke kan _Inscriptie terugroepen_ uitspreken, een spreuk waarmee hij het effect van de laatst gebruikte runensteen of perkamentrol binnen _10 beurten_ kan herhalen._\n\n_+2:_ De geestelijke kan _Inscriptie terugroepen_ uitspreken, een spreuk waarmee hij het effect van de laatst gebruikte runensteen of perkamentrol binnen _300 beurten_ kan herhalen._\n\n_Inscriptie terugroepen kan niet worden gebruikt met upgrade-perkamentrollen. De kosten van deze spreuk variëren afhankelijk van welk voorwerp recent is gebruikt: 2 voor een runensteen, 3 voor een perkamentrol, 4 voor een exotische perkamentrol. Deze kosten worden ook verdubbeld bij gebruik met een transmutatie-perkamentrol of alchemie-voorwerpen die moeten worden gemaakt met behulp van transmutatie of upgrade.
actors.hero.talent.recall_inscription.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, wordt in plaats daarvan elke perkamentrol of runensteen in 10% van de gevallen met +1 of in 15% van de gevallen met +2 terugbetaald. Perkamentrollen van verbetering zijn van dit effect uitgezonderd.
actors.hero.talent.recall_inscription.refunded=Je hebt je geld teruggekregen!
actors.hero.talent.recall_inscription.title=herinneringsinscriptie
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Wanneer de Jageres op kort gras of gloeiende kooltjes stapt, springen deze op tot hoog gras dat de Jageres onmiddellijk ploegt. Dit heeft een afkoeltijd van 10 beurten. \n\n_+2:_ Wanneer de Jageres op kort gras of gloeiende kooltjes stapt, springen deze op tot hoog gras dat de Jageres onmiddellijk ploegt. Dit heeft een afkoeltijd van 5 beurten. \n\nDeze vaardigheid zorgt voor geploegd gras als passieve regeneratie-effecten zijn uitgeschakeld of als de held lange tijd geen ervaringspunten heeft verdiend.
actors.hero.talent.rejuvenating_steps.title=verjongende stappen
actors.hero.talent.remote_beacon.desc=_+1:_ De magiër kan een baken plaatsen op elke locatie binnen _4 tegels_.\n\n_+2:_ De magiër kan een baken plaatsen op elke locatie binnen _8 tegels_.\n\n_+3:_ De magiër kan een baken plaatsen op elke locatie binnen _12 tegels_.\n\n_+4:_ De magiër kan een baken plaatsen op elke locatie binnen _16 tegels_.\n\nDe magiër kan geen bakens plaatsen op ontoegankelijke locaties.
actors.hero.talent.remote_beacon.title=Externe baken
actors.hero.talent.rogues_foresight.desc=_+1:_ Wanneer de Schurk zich in een level met een geheime kamer bevindt, heeft hij _75% kans_ om te ontdekken dat het level een geheim bevat.\n\n_+2:_ Wanneer de Schurk zich in een level met een geheime kamer bevindt, heeft hij _100% kans_ om te ontdekken dat het level een geheim bevat.
actors.hero.talent.rogues_foresight.title=het vooruitziende vermogen van de schurk
actors.hero.talent.runic_transference.desc=_+1:_ Het gebroken zegel van de Krijger kan _gewone glyphs_ overdragen op dezelfde manier als een upgrade.\n\n_+2:_ Het gebroken zegel van de Krijger kan _gewone, krachtige en vloekglyphs_ overdragen op dezelfde manier als een upgrade.\n\nHet zegel kan alleen glyphs overdragen als deze op het pantser waren aangebracht toen het zegel werd bevestigd.
actors.hero.talent.runic_transference.meta_desc=_Als een andere held dit talent verkrijgt_, zorgt het er in plaats daarvan voor dat de symbolen op je pantser beter bestand zijn tegen verwijdering door upgrade-rollen. Symbolen zullen verloren gaan bij een upgrade van niveau 6 (van 4) met +1, of niveau 7 (van 4) met +2. Het niveau waarop symbolen gegarandeerd verloren gaan, blijft ongewijzigd op +8.
actors.hero.talent.runic_transference.title=runenoverdracht
actors.hero.talent.satiated_spells.desc=_+1:_ Door voedsel te eten krijgt de geestelijke _3 schildpunten_ de volgende keer dat hij een spreuk uitspreekt.\n\n_+2:_ Door voedsel te eten krijgt de geestelijke _5 schildpunten_ de volgende keer dat hij een spreuk uitspreekt.
actors.hero.talent.satiated_spells.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan direct een schild geven, dat na 10 beurten normaal gesproken begint af te nemen.
actors.hero.talent.satiated_spells.title=Verzadigde spreuken
actors.hero.talent.scholars_intuition.desc=_+1:_ De magiër herkent toverstokken _3x sneller_.\n\n_+2:_ De magiër herkent toverstokken _wanneer hij ze gebruikt_.
actors.hero.talent.scholars_intuition.title=geleerde intuïtie
actors.hero.talent.searing_light.desc=_+1:_ De fysieke aanvallen van de geestelijke op vijanden die verlicht worden door _Guiding Light_ richten _+3 schade aan._\n\n_+2:_ De fysieke aanvallen van de geestelijke op vijanden die verlicht worden door _Guiding Light_ richten _+5 schade aan._
actors.hero.talent.searing_light.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, zal deze in plaats daarvan de bonussschade toekennen nadat een toverstaf of artefact op een vijand is gebruikt, met een afkoeltijd van 20 beurten.
actors.hero.talent.searing_light.title=Verblindend licht
actors.hero.talent.seer_shot.desc=_+1:_ Wanneer de Jageres een pijl op de grond schiet, geeft ze zicht in een gebied van 3x3 eromheen gedurende _5 beurten_. Dit heeft een afkoeltijd van 20 beurten.\n\n_+2:_ Wanneer de Jageres een pijl op de grond schiet, geeft ze zicht in een gebied van 3x3 eromheen gedurende _10 beurten_. Dit heeft een afkoeltijd van 20 beurten.\n\n_+3:_ Wanneer de Jageres een pijl op de grond schiet, geeft ze zicht in een gebied van 3x3 eromheen gedurende _15 beurten_. Dit heeft een afkoeltijd van 20 beurten.
actors.hero.talent.seer_shot.meta_desc=_Als deze vaardigheid door een andere held wordt verkregen_, wordt deze geactiveerd door elk geworpen wapen.
actors.hero.talent.seer_shot.title=ziener schot
actors.hero.talent.shadow_blade.desc=_+1:_ De schaduwkloon krijgt _8%_ van de schade van de held per beurt en heeft _25% kans_ om de betovering op het wapen van de held te gebruiken.\n\n_+2:_ De schaduwkloon krijgt _16%_ van de schade van de held per beurt en heeft _50% kans_ om de betovering op het wapen van de held te gebruiken.\n\n_+3:_ De schaduwkloon krijgt _24%_ van de schade van de held per beurt en heeft _75% kans_ om de betovering op het wapen van de held te gebruiken.\n\n_+4:_ De schaduwkloon krijgt _32%_ van de schade van de held per beurt en heeft _100% kans_ om de betovering op het wapen van de held te gebruiken.
actors.hero.talent.shadow_blade.title=schaduwzwaard
actors.hero.talent.shadow_step.desc=_+1:_ Als de schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit direct en zijn de oplaadkosten _16% lager_, maar hij verblindt vijanden niet en activeert geen andere talenten.\n\n_+2:_ Als de schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit direct en zijn de oplaadkosten _30% lager_, maar hij verblindt vijanden niet en activeert geen andere talenten.\n\n_+3:_ Als de schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit direct en zijn de oplaadkosten _41% lager_, maar hij verblindt vijanden niet en activeert geen andere talenten.\n\n_+4:_ Als de schurk een rookbom gebruikt terwijl hij onzichtbaar is, gebeurt dit direct en zijn de oplaadkosten _50% lager_, maar hij verblindt vijanden niet en activeert geen andere talenten.
actors.hero.talent.shadow_step.title=schaduwstap
actors.hero.talent.shared_enchantment.desc=_+1:_ Werpwapens hebben een kans van _33%_ om de betovering van de Sniper's boog te gebruiken.\n\n_+2:_ Werpwapens hebben een kans van _67%_ om de betovering van de Sniper's boog te gebruiken.\n\n_+3:_ Werpwapens hebben een kans van _100%_ om de betovering van de Sniper's boog te gebruiken.\n\nDe betovering van de boog kan worden geactiveerd naast de betovering die het werpwapen al heeft.
actors.hero.talent.shared_enchantment.title=gedeelde betovering
actors.hero.talent.shared_upgrades.desc=_+1:_ Wanneer de Sniper aanvalt met een verbeterd werpwapen, verhoogt elk niveau de duur van de snipermarkering met 1 beurt en de schade van haar speciale aanval met 16%, tot een maximum van _2 beurten en +33% schade bij +2_.\n\n_+2:_ Wanneer de Sniper aanvalt met een verbeterd werpwapen, verhoogt elk niveau de duur van de snipermarkering met 1 beurt en de schade van haar speciale aanval met 16%, tot een maximum van _4 beurten en +67% schade bij +4_.\n\n_+3:_ Wanneer de Sniper aanvalt met een verbeterd werpwapen, verhoogt elk niveau de duur van de snipermarkering met 1 beurt en de schade van haar speciale aanval met 16%, tot een maximum van _6 beurten en +100% schade bij +6_.
actors.hero.talent.shared_upgrades.title=gedeelde upgrades
actors.hero.talent.shield_battery.desc=_+1:_ De magiër kan zichzelf met een toverstaf als doelwit kiezen om al zijn ladingen om te zetten in schilden met een snelheid van _4% van de maximale HP per lading_.\n\n_+2:_ De magiër kan zichzelf met een toverstaf als doelwit kiezen om al zijn ladingen om te zetten in schilden met een snelheid van _6% van de maximale HP per lading_.
actors.hero.talent.shield_battery.title=schildbatterij
actors.hero.talent.shield_of_light.desc=_+1:_ De geestelijke kan _Schild van Licht_ uitspreken, een spreuk die direct wordt uitgesproken en hem _2-4 pantser_ geeft tegen een doelwit gedurende 5 beurten voor de kosten van 1 lading.\n\n_+2:_ De geestelijke kan _Schild van Licht_ uitspreken, een spreuk die direct wordt uitgesproken en hem _3-6 pantser_ geeft tegen een doelwit gedurende 5 beurten voor de kosten van 1 lading.
actors.hero.talent.shield_of_light.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan de fysieke schade die je van je doelwitvijand oploopt met 1 verminderen, in 33% van de gevallen bij +1 of in 50% van de gevallen bij +2.
actors.hero.talent.shield_of_light.title=schild van licht
actors.hero.talent.shielding_dew.desc=_+1:_ Dauwdruppels kunnen de Warden beschermen wanneer haar gezondheid volledig is, tot _20% van haar maximale HP_.\n\n_+2:_ Dauwdruppels kunnen de Warden beschermen wanneer haar gezondheid volledig is, tot _40% van haar maximale HP_.\n\n_+3:_ Dauwdruppels kunnen de Warden beschermen wanneer haar gezondheid volledig is, tot _60% van haar maximale HP_.
actors.hero.talent.shielding_dew.title=beschermende dauw
actors.hero.talent.shock_force.desc=_+1:_ Schokgolf richt _20% meer schade_ aan en heeft _25% kans_ om te verdoven in plaats van te verlammen.\n\n_+2:_ Schokgolf richt _40% meer schade_ aan en heeft _50% kans_ om te verdoven in plaats van te verlammen.\n\n_+3:_ Schokgolf richt _60% meer schade_ aan en heeft _75% kans_ om te verdoven in plaats van te verlammen.\n\n_+4:_ Schokgolf richt _80% meer schade_ aan en heeft _100% kans_ om te verdoven in plaats van te verlammen.
actors.hero.talent.shock_force.title=schokkracht
actors.hero.talent.shrug_it_off.desc=_+1:_ De schadebeperking van de krijger tijdens het doorstaan van een aanval wordt verhoogd naar 60%, van 50%.\n\n_+2:_ De schadebeperking van de krijger tijdens het doorstaan van een aanval wordt verhoogd naar 68%, van 50%.\n\n_+3:_ De schadebeperking van de krijger tijdens het doorstaan van een aanval wordt verhoogd naar 74%, van 50%.\n\n_+4:_ De schadebeperking van de krijger tijdens het doorstaan van een aanval wordt verhoogd naar 80%, van 50%.
actors.hero.talent.shrug_it_off.title=haal je schouders op
actors.hero.talent.silent_steps.desc=_+1:_ De Schurk zal slapende vijanden niet wakker maken als hij _3 of meer tegels van hen verwijderd is_.\n\n_+2:_ De Schurk zal slapende vijanden niet wakker maken als hij _niet naast hen staat_.
actors.hero.talent.silent_steps.title=stille stappen
actors.hero.talent.soul_eater.desc=_+1:_ Zielmarkering geeft _0,33 beurten_ verzadiging voor elke toegebrachte fysieke schade. Vijanden met een zielmarkering hebben een _10% kans_ om effecten te activeren wanneer ze sterven na het eten.\n\n_+2:_ Zielmarkering geeft _0,67 beurten_ verzadiging voor elke toegebrachte fysieke schade. Vijanden met een zielmarkering hebben een _20% kans_ om effecten te activeren wanneer ze sterven na het eten.\n\n_+3:_ Zielmarkering geeft _1 beurt_ verzadiging voor elke toegebrachte fysieke schade. Vijanden met een zielmarkering hebben een _30% kans_ om effecten te activeren wanneer ze sterven na het eten.
actors.hero.talent.soul_eater.title=zieleneter
actors.hero.talent.soul_siphon.desc=_+1:_ Fysieke schade toegebracht door andere personages activeert het zielenmerk van de Warlock met _13% effectiviteit_.\n\n_+2:_ Fysieke schade toegebracht door andere personages activeert het zielenmerk van de Warlock met _27% effectiviteit_.\n\n_+3:_ Fysieke schade toegebracht door andere personages activeert het zielenmerk van de Warlock met _40% effectiviteit_.
actors.hero.talent.soul_siphon.title=zielenafzuiger
actors.hero.talent.speedy_stealth.desc=_+1:_ De Freerunner krijgt 2 stapels momentum per beurt terwijl hij onzichtbaar is.\n\n_+2:_ Naast de voordelen van +1 telt de Freerunner niet langer af terwijl hij onzichtbaar is.\n\n_+3:_ Naast de voordelen van +1 en +2 beweegt de Freerunner met 2x snelheid terwijl hij onzichtbaar is, ongeacht of hij aan het freerunnen is of niet.
actors.hero.talent.speedy_stealth.title=snelle stealth
actors.hero.talent.spirit_blades.desc=_+1:_ Spectrale zwaarden hebben een kans van _30%_ om de betovering ook op de geestboog toe te passen.\n\n_+2:_ Spectrale zwaarden hebben een kans van _60%_ om de betovering ook op de geestboog toe te passen.\n\n_+3:_ Spectrale zwaarden hebben een kans van _90%_ om de betovering ook op de geestboog toe te passen.\n\n_+4:_ Spectrale zwaarden hebben een kans van _100%_ om de betovering ook op de geestboog toe te passen, en het geeft elke betovering _+10% kracht_.
actors.hero.talent.spirit_blades.title=geestenzwaarden
actors.hero.talent.spirit_form.desc=De geestelijke kan _Geestvorm_ oproepen, waardoor Trinity de kracht krijgt van een ring of artefact dat de geestelijke in deze run heeft geïdentificeerd (met uitzondering van het heilige boek), tegen een kostprijs van 4 ladingen.\n\n_+1:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het effect van een ring met _+1_ gedurende 20 beurten, of activeert hij het effect van een artefact met _+4._\n\n_+2:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het effect van een ring met _+2_ gedurende 20 beurten, of activeert hij het effect van een artefact met _+6._\n\n_+3:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het effect van een ring met _+3_ gedurende 20 beurten, of activeert hij het effect van een artefact met _+8._\n\n_+4:_ Wanneer Trinity wordt gebruikt, krijgt de geestelijke het effect van een ring met _+4_ gedurende 20 beurten, of activeert hij het effect van een artefact met _+10_._\n\nTrinity kan slechts met één geesteffect tegelijk worden doordrenkt. Artefacten hebben verschillende effecten en pantserkosten wanneer ze door Trinity worden geactiveerd.
actors.hero.talent.spirit_form.title=geestverschijning
actors.hero.talent.stasis.desc=De geestelijke kan _Stasis_ op een versterkte bondgenoot werpen voor 2 ladingen. Stasis verwijdert de bondgenoot tijdelijk uit de kerker en behoudt de resterende tijd van alle buffs, inclusief Power of Many. De bondgenoot verschijnt weer naast je wanneer het effect eindigt. Stasis kan direct en kosteloos opnieuw worden geworpen om het effect voortijdig te beëindigen. Stasis werkt op immobiele bondgenoten, maar kan ze niet verplaatsen tussen kerkerverdiepingen. \n\n_+1: Stasis duurt maximaal 60 beurten. \n\n_+2: Stasis duurt maximaal 90 beurten. \n\n_+3: Stasis duurt maximaal 120 beurten. \n\n_+4: Stasis duurt maximaal 150 beurten. \n\nDe geestelijke kan ook Beaming Ray gebruiken wanneer een bondgenoot in stasis is om hem of haar opnieuw op te roepen, of Life Link gebruiken om het effect ervan preventief toe te passen. Bondgenoten profiteren echter niet van Life Link terwijl ze in stasis zijn.
actors.hero.talent.stasis.title=stilstand
actors.hero.talent.strengthening_meal.desc=_+1:_ Het eten van voedsel geeft de Duelist 3 bonusschade de volgende _2 keer_ dat ze een vijand raakt met een fysieke aanval.\n\n_+2:_ Het eten van voedsel geeft de Duelist 3 bonusschade de volgende _3 keer_ dat ze een vijand raakt met een fysieke aanval.
actors.hero.talent.strengthening_meal.title=voedzame maaltijd
actors.hero.talent.striking_force.desc=_+1:_ De kracht van het effect van de elementaire aanval wordt met _30%_ verhoogd.\n\n_+2:_ De kracht van het effect van de elementaire aanval wordt met _60%_ verhoogd.\n\n_+3:_ De kracht van het effect van de elementaire aanval wordt met _90%_ verhoogd.\n\n_+4:_ De kracht van het effect van de elementaire aanval wordt met _120%_ verhoogd.
actors.hero.talent.striking_force.title=slagkracht
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave heeft _30% kans_ om ook effecten bij een treffer te gebruiken, zoals betoveringen en combo's.\n\n_+2:_ Shockwave heeft _60% kans_ om ook effecten bij een treffer te gebruiken, zoals betoveringen en combo's.\n\n_+3:_ Shockwave heeft _90% kans_ om ook effecten bij een treffer te gebruiken, zoals betoveringen en combo's.\n\n_+4:_ Shockwave heeft _100% kans_ om ook effecten bij een treffer te gebruiken, zoals betoveringen en combo's, en het geeft betoveringen _+20% kracht_.
actors.hero.talent.striking_wave.title=opvallende golf
actors.hero.talent.strongman.desc=_+1:_ De kracht van de krijger wordt met 8% verhoogd, naar beneden afgerond.\n\n_+2:_ De kracht van de krijger wordt met 13% verhoogd, naar beneden afgerond.\n\n_+3:_ De kracht van de krijger wordt met 18% verhoogd, naar beneden afgerond.
actors.hero.talent.strongman.title=sterke man
actors.hero.talent.sucker_punch.desc=_+1:_ De Schurk deelt _1-2 bonusschade_ uit de eerste keer dat hij een vijand verrast.\n\n_+2:_ De Schurk deelt _2 bonusschade_ uit de eerste keer dat hij een vijand verrast.
actors.hero.talent.sucker_punch.title=verrassingsaanval
actors.hero.talent.sunray.desc=_+1:_ De geestelijke kan _Zonnestraal_ uitspreken, een spreuk die _4-8 schade_ toebrengt en het doelwit _4 beurten_ verblindt,_ tegen een kostprijs van 1 lading.\n\n_+2:_ De geestelijke kan _Zonnestraal_ uitspreken, een spreuk die _6-12 schade_ toebrengt en het doelwit _6 beurten_ verblindt,_ tegen een kostprijs van 1 lading.\n\nZonnestraal kan elk doelwit slechts één keer verblinden, maar als het doelwit al verblind is door Zonnestraal, dan verlamt het in plaats daarvan. Zonnestraal brengt altijd maximale schade toe aan demonische en ondode vijanden.
actors.hero.talent.sunray.meta_desc=_Als een andere held dit talent verkrijgt_, zorgt het er in plaats daarvan voor dat toverstaven en artefacten vijanden 4 beurten lang verblinden, in 15% van de gevallen met een bonus van +1 of in 25% van de gevallen met een bonus van +2.
actors.hero.talent.sunray.title=zonnestraal
actors.hero.talent.survivalists_intuition.desc=_+1:_ De Jageres herkent geworpen wapens _3x sneller_.\n\n_+2:_ De Jageres herkent geworpen wapens _wanneer ze ermee raakt_.
actors.hero.talent.survivalists_intuition.title=overlevingsintuïtie
actors.hero.talent.sustained_retribution.desc=_+1:_ De krijger deelt _115% bonusschade_ verdeeld over _2 treffers_, in plaats van 100% bonusschade in 1 treffer.\n\n_+2:_ De krijger deelt _130% bonusschade_ verdeeld over _3 treffers_, in plaats van 100% bonusschade in 1 treffer.\n\n_+3:_ De krijger deelt _145% bonusschade_ verdeeld over _4 treffers_, in plaats van 100% bonusschade in 1 treffer.\n\n_+4:_ De krijger deelt _160% bonusschade_ verdeeld over _5 treffers_, in plaats van 100% bonusschade in 1 treffer.
actors.hero.talent.sustained_retribution.title=aanhoudende vergelding
actors.hero.talent.swift_equip.desc=_+1:_ De Duelist kan haar uitgeruste wapen direct wisselen _één keer_ elke 20 beurten.\n\n_+2:_ De Duelist kan haar uitgeruste wapen direct wisselen _twee keer_ elke 20 beurten.\n\nAls de Duelist dit talent heeft en het niet in afkoeltijd is, zal het snel gebruiken van een niet-uitgerust wapen het uitrusten.
actors.hero.talent.swift_equip.title=snel uitrusten
actors.hero.talent.swift_spirit.desc=_+1:_ De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar 2,5 tegels, en hij ontwijkt gegarandeerd de eerste 2 aanvallen.\n\n_+2:_ De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar 3 tegels, en hij ontwijkt gegarandeerd de eerste 4 aanvallen.\n\n_+3:_ De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar 3,5 tegels, en hij ontwijkt gegarandeerd de eerste 6 aanvallen.\n\n_+4:_ De bewegingssnelheid van de geesthavik wordt verhoogd van 2 naar 4 tegels, en hij ontwijkt gegarandeerd de eerste 8 aanvallen.
actors.hero.talent.swift_spirit.title=snelle geest
actors.hero.talent.telefrag.desc=_+1:_ Als de magiër in een ander personage verandert, brengt hij _10-15 schade_ toe, maar loopt hij zelf ook _5 schade_ op.\n\n_+2:_ Als de magiër in een ander personage verandert, brengt hij _20-30 schade_ toe, maar loopt hij zelf ook _10 schade_ op.\n\n_+3:_ Als de magiër in een ander personage verandert, brengt hij _30-45 schade_ toe, maar loopt hij zelf ook _15 schade_ op.\n\n_+4:_ Als de magiër in een ander personage verandert, brengt hij _40-60 schade_ toe, maar loopt hij zelf ook _20 schade_ op.\n\nDe held kan niet gedood worden door dit talent; de zelf toegebrachte schade kan verminderd worden door magische weerstandseffecten.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ De Schurk herkent ringen _2x sneller_ en identificeert het type ring _wanneer hij deze uitrust_.\n\n_+2:_ De Schurk herkent ringen _wanneer hij ze uitrust_ en identificeert het type ring _wanneer hij deze oppakt_.
actors.hero.talent.thiefs_intuition.title=dievenintuïtie
actors.hero.talent.twin_upgrades.desc=_+1:_ Als een van de twee uitgeruste wapens van de Kampioen een lager niveau heeft en _2 of meer niveaus lager_ is dan het andere wapen, wordt het verhoogd naar het niveau van het andere wapen.\n\n_+2:_ Als een van de twee uitgeruste wapens van de Kampioen een lager niveau heeft en _1 of meer niveaus lager_ is dan het andere wapen, wordt het verhoogd naar het niveau van het andere wapen.\n\n_+3:_ Als een van de twee uitgeruste wapens van de Kampioen een lager niveau heeft en _hetzelfde niveau of lager_ is dan het andere wapen, wordt het verhoogd naar het niveau van het andere wapen.
actors.hero.talent.twin_upgrades.title=dubbele upgrades
actors.hero.talent.unencumbered_spirit.desc=_+1:_ De monnik krijgt _50% meer energie_ voor elk stuk uitrusting van _niveau 3 of lager_ dat ze gebruikt.\n\n_+2:_ De monnik krijgt _75% meer energie_ voor elk stuk uitrusting van _niveau 2 of lager_ dat ze gebruikt. Het voordeel van niveau 3 blijft ongewijzigd.\n\n_+3:_ De monnik krijgt _100% meer energie_ voor elk stuk uitrusting van _niveau 1 of lager_ dat ze gebruikt. De voordelen van niveau 2 en 3 blijven ongewijzigd. Ze krijgt ook een gratis stoffen harnas en handschoenen met noppen.\n\nLet op: dit talent geeft geen voordeel van ongewapend zijn of aanvallen met een Ring van Kracht.
actors.hero.talent.unencumbered_spirit.title=onbelemmerde geest
actors.hero.talent.varied_charge.desc=_+1:_ De kampioen herstelt direct _0,17 wapenladingen_ wanneer ze twee verschillende wapenvaardigheden gebruikt, zonder tijdslimiet.\n\n_+2:_ De kampioen herstelt direct _0,33 wapenladingen_ wanneer ze twee verschillende wapenvaardigheden gebruikt, zonder tijdslimiet.\n\n_+3:_ De kampioen herstelt direct _0,5 wapenladingen_ wanneer ze twee verschillende wapenvaardigheden gebruikt, zonder tijdslimiet.
actors.hero.talent.varied_charge.title=variabele kosten
actors.hero.talent.veterans_intuition.desc=_+1:_ De krijger herkent wapens _1,75x sneller_ en bepantsering _2,5x sneller_.\n\n_+2:_ De krijger herkent wapens _2,5x sneller_ en bepantsering _wanneer hij deze uitrust_.
actors.hero.talent.veterans_intuition.title=veteranenintuïtie
actors.hero.talent.wall_of_light.desc=_+1:_ De Paladijn kan _Muur van Licht_ uitspreken, een spreuk die een _3 tegels brede_ massieve muur voor de Paladijn creëert die vijanden wegduwt en 20 beurten meegaat, tegen een kostprijs van 3 ladingen.\n\n_+2:_ De Paladijn kan _Muur van Licht_ uitspreken, een spreuk die een _5 tegels brede_ massieve muur voor de Paladijn creëert die vijanden wegduwt en 20 beurten meegaat, tegen een kostprijs van 3 ladingen.\n\n_+3:_ De Paladijn kan _Muur van Licht_ uitspreken, een spreuk die een _7 tegels brede_ massieve muur voor de Paladijn creëert die vijanden wegduwt en 20 beurten meegaat, tegen een kostprijs van 3 ladingen.\n\nDe muur kan in de hoofdrichting of diagonaal worden geplaatst, er kan slechts één muur tegelijk bestaan. tijd.
actors.hero.talent.wall_of_light.title=muur van licht
actors.hero.talent.wand_preservation.desc=_+1:_ Wanneer de magiër een nieuwe toverstaf in zijn staf plaatst, wordt de oude toverstaf teruggegeven met +0, _maar dit kan slechts eenmaal worden gedaan._\n\n_+2:_ Wanneer de magiër een nieuwe toverstaf in zijn staf plaatst, wordt de oude toverstaf teruggegeven met +0, _dit kan worden herhaald met een afkoelperiode van één heldenniveau._
actors.hero.talent.wand_preservation.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan de hoeveelheid arcane hars die wordt verkregen bij het plaatsen van een toverstaf in een alchemieketel verhogen met 1 bij +1, of met 2 bij +2.
actors.hero.talent.wand_preservation.title=toverstaf conservering
actors.hero.talent.weapon_recharging.desc=_+1:_ De Duelist krijgt elke _15 beurten_ één wapenlading erbij wanneer hij/zij onder invloed is van toverstaf- of artefact-oplaadbuffs.\n\n_+2:_ De Duelist krijgt elke _10 beurten_ één wapenlading erbij wanneer hij/zij onder invloed is van toverstaf- of artefact-oplaadbuffs.
actors.hero.talent.weapon_recharging.meta_desc=_Als een andere held dit talent verkrijgt_, zal deze held in plaats daarvan +5% mêlee-schade toebrengen tijdens het opladen met +1, of +7,5% mêlee-schade tijdens het opladen met +2.
actors.hero.talent.weapon_recharging.title=wapen opladen
actors.hero.talent.wide_search.desc=_+1:_ De zoekradius van de Rogue wordt vergroot van een 5x5 vierkant naar een 7x7 cirkel.\n\n_+2:_ De zoekradius van de Rogue wordt vergroot van een 5x5 vierkant naar een 7x7 vierkant.
actors.hero.talent.wide_search.meta_desc=_Als een andere held dit talent verkrijgt_, zal het in plaats daarvan hun zoekradius vergroten van een vierkant van 3x3 naar een cirkel van 5x5 bij +1, of naar een vierkant van 5x5 bij +2.
actors.hero.talent.wide_search.title=brede zoekopdracht
actors.hero.talent.wild_momentum.desc=_+1:_ Het doden van een vijand met de geestboog verlengt de duur van de natuurkracht met _1 beurt_. De duur kan met maximaal _2 beurten_ worden verlengd.\n\n_+2:_ Het doden van een vijand met de geestboog verlengt de duur van de natuurkracht met _2 beurten_. De duur kan met maximaal _4 beurten_ worden verlengd.\n\n_+3:_ Het doden van een vijand met de geestboog verlengt de duur van de natuurkracht met _3 beurten_. De duur kan met maximaal _6 beurten_ worden verlengd.\n\n_+4:_ Het doden van een vijand met de geestboog verlengt de duur van de natuurkracht met _4 beurten_. De duur kan met maximaal _8 beurten_ worden verlengd.
actors.hero.talent.wild_momentum.title=wilde dynamiek
actors.hero.talent.wild_power.desc=_+1:_ Bij gebruik van wilde magie worden toverstokken versterkt met _2 of 3, tot maximaal +4_.\n\n_+2:_ Bij gebruik van wilde magie worden toverstokken versterkt met _3, tot maximaal +5_.\n\n_+3:_ Bij gebruik van wilde magie worden toverstokken versterkt met _3 of 4, tot maximaal +6_.\n\n_+4:_ Bij gebruik van wilde magie worden toverstokken versterkt met _4, tot maximaal +7_.
actors.hero.talent.wild_power.title=wilde kracht
actors.mobs.acidic.desc=Deze enorme, spinachtige, demonische wezens vermijden gevechten van dichtbij en geven er de voorkeur aan om verlammende, gekartelde stekels van grote afstand af te vuren. Deze lijkt te druipen van bijtend slijm.
actors.mobs.acidic.name=zure schorpioen
actors.mobs.albino.desc=Dit is een zeldzaam ras buidelratten, met een spierwitte vacht en gekartelde tanden.
actors.mobs.albino.discover_hint=Je kunt deze vijand zelden in een specifiek gedeelte van de kerker aantreffen.
actors.mobs.albino.name=albino rat
actors.mobs.armoredbrute.desc=De meest ervaren gnoll-bruten dragen vaak een krachtig pantser om hun status te tonen. Het pantser maakt deze bruten veel weerbaarder tegen fysieke schade, en hun grotere discipline betekent dat ze veel langer kunnen doorrazen voordat ze bezwijken aan hun verwondingen.
actors.mobs.armoredbrute.name=gepantserde bruut
actors.mobs.armoredstatue.desc=Je zou denken dat het gewoon weer een van de levenloze beelden in deze kerker is, maar de roodgloeiende ogen verraden het. Het lijkt in uitstekende conditie te zijn gezien het pantser dat het draagt; het zou wel eens heel moeilijk te doden kunnen zijn.
actors.mobs.armoredstatue.desc_arm_wep=Hoewel het beeld zelf van steen is gemaakt, zien de _%1$s_ en _%2$s_ die het vasthoudt er echt uit.
actors.mobs.armoredstatue.name=gepantserd standbeeld
actors.mobs.bandit.desc=De diepere krochten van de kerker zijn altijd een schuilplaats geweest voor allerlei criminelen. Niet iedereen kon echter helder van geest blijven tijdens hun lange verblijf zo ver van het daglicht. Lang geleden zijn deze waanzinnige dieven en bandieten vergeten wie ze zijn en waarom ze stelen.
actors.mobs.bandit.name=gekke bandiet
actors.mobs.bat.desc=Deze kwieke en vasthoudende grotbewoners zijn veel gevaarlijker dan ze lijken. Ze herstellen hun gezondheid met elke succesvolle aanval, waardoor ze veel grotere tegenstanders kunnen verslaan.
actors.mobs.bat.name=vampier vleermuis
actors.mobs.bee.desc=Ondanks hun kleine formaat verdedigen gouden bijen hun nest fel. Deze is wel heel erg boos, dus je kunt beter afstand houden.
actors.mobs.bee.desc_honey=Ondanks hun kleine formaat beschermen gouden bijen hun nest fel. Deze is gekalmeerd en lijkt je te willen volgen.
actors.mobs.bee.discover_hint=Je kunt dit personage vinden met behulp van een specifiek voorwerp.
actors.mobs.bee.name=gouden bij
actors.mobs.brute$bruterage.desc=Deze brute gnoll is aan het sterven, maar wil je meeslepen!\n\nDe brute zal sterven wanneer zijn schild verdwijnt, hetzij door de tijd, hetzij door schade. In de tussentijd zal hij enorm veel meer schade aanrichten, dus pas op!\n\nResterend schild: %d.
actors.mobs.brute$bruterage.name=brute woede
actors.mobs.brute.def_verb=geblokkeerd
actors.mobs.brute.desc=Bruten zijn de grootste, sterkste en taaiste gnolls. Als ze zwaar gewond raken, worden ze razend en brengen ze hun vijanden nog meer schade toe.
actors.mobs.brute.enraged=woedend
actors.mobs.brute.name=gnoll bruut
actors.mobs.causticslime.desc=Dit slijm lijkt besmet te zijn door de duistere magie die van onderaf komt. Het heeft zijn gebruikelijke groene kleur verloren en druipt van een bijtende substantie.
actors.mobs.causticslime.discover_hint=Je kunt deze vijand zelden in een specifiek gedeelte van de kerker aantreffen.
actors.mobs.causticslime.name=bijtend slijm
actors.mobs.crab.desc=Deze enorme krabben staan aan de top van de voedselketen in de riolen. Ze zijn extreem snel en hun dikke schild kan zware klappen weerstaan.
actors.mobs.crab.name=rioolkrab
actors.mobs.crystalguardian.def_verb=geblokkeerd
actors.mobs.crystalguardian.desc=Deze grote kristallen bewakers lijken bijna op standbeelden, ware het niet voor hun fel gloeiende ogen. Het geharde kristal waaruit ze bestaan, maakt ze traag maar oersterk, dus het is het beste om ze zo lang mogelijk in hun kristallen nest te laten slapen. Vanwege hun grootte bewegen kristallen bewakers zich veel langzamer in afgesloten ruimtes. Ze zijn ook zo duurzaam dat ze onmogelijk direct te doden zijn. Ze kunnen wel verslagen en tijdelijk uitgeschakeld worden, maar ze staan na een tijdje gewoon weer op.
actors.mobs.crystalguardian.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.crystalguardian.name=kristallen bewaker
actors.mobs.crystalmimic.ate=De mimic heeft je %s opgegeten!
actors.mobs.crystalmimic.desc=Mimics zijn magische wezens die elke gewenste vorm kunnen aannemen. In kerkers kiezen ze bijna altijd de vorm van een schatkist om nietsvermoedende avonturiers te lokken. Kristallen mimics zijn listiger dan hun gewone soortgenoten en vermijden liever conflicten tijdens het stelen van buit. Ze zullen proberen weg te rennen zodra ze ontdekt worden en hebben het vermogen om vijanden te verplaatsen wanneer ze aanvallen.
actors.mobs.crystalmimic.escaped=De kristallen mimic is ontsnapt!
actors.mobs.crystalmimic.name=kristalimitatie
actors.mobs.crystalspire.alert=De trilling neemt toe en dreunt door de hele grot!
actors.mobs.crystalspire.desc=Deze gigantische toren van ultrahard kristal is waarschijnlijk de bron van alle vreemde kristalwezens in deze grot. Je gewone wapens zijn er niet tegen opgewassen, dus je zult je houweel moeten gebruiken als je hem wilt vernietigen. Zorg dat je goed voorbereid bent voordat je begint met hakken. Zo'n groot kristal zal waarschijnlijk een hele tijd kosten om te hakken, en je zult het waarschijnlijk niet ongestoord kunnen doen. De toren zelf heeft misschien zelfs een manier om zichzelf te verdedigen. Misschien kunnen de aanvallen van de toren zelf wel tegen zijn handlangers worden gebruikt.
actors.mobs.crystalspire.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.crystalspire.name=kristallen torenspits
actors.mobs.crystalspire.warning=Het kristal trilt als je erop slaat. Als je dit volhoudt, zul je zeker de aandacht op je vestigen...
actors.mobs.crystalwisp.beam_kill=De lichtstraal heeft je gedood...
actors.mobs.crystalwisp.desc=Een klein, boos, zwevend stukje gehard kristal dat een heldere gloed uitstraalt. Hoewel ze niet bijzonder sterk zijn, kunnen kristalslierten een schadelijke lichtstraal op je afschieten als ze vrij zicht hebben. Kristalslierten zijn klein genoeg om zich gemakkelijk door de verschillende kristaluitstulpingen te bewegen, maar ze kunnen er niet doorheen schieten.
actors.mobs.crystalwisp.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.crystalwisp.name=kristal sliert
actors.mobs.demonspawner.desc=Deze kronkelende mengeling van dwergenvlees is verantwoordelijk voor het ontstaan van ripperdemonen uit de dwergen die in dit gebied zijn gestorven. Het is duidelijk dat de demonen er geen probleem mee hebben om alle mogelijke middelen tegen hun vijanden in te zetten. Hoewel ze er visueel angstaanjagend uitzien, kunnen demonenscheppers zich niet bewegen of direct verdedigen. Hun aanzienlijke massa maakt het echter moeilijk om ze snel te doden, en ze zullen sneller ripperdemonen voortbrengen wanneer ze bedreigd worden. Demonenscheppers lijken verbonden te zijn met een centrale bron van demonische kracht. Het doden ervan kan deze bron verzwakken.
actors.mobs.demonspawner.name=demonenspawner
actors.mobs.demonspawner.on_death=De demonische energie lijkt hier af te nemen naarmate de voortbrenger sterft.
actors.mobs.dm100.desc=De DM-100 is een vroeg model van een dwergse 'verdedigingsmachine', ontworpen om dwergse mijnwerkers in de grotten onder deze gevangenis te beschermen. De elektrische schokken bleken echter te zwak, en daarom werden ze geschonken aan de mensenstad erboven. Ze bleven jarenlang ongebruikt en belandden uiteindelijk in de gevangenis, waar de bewaker ze aanvankelijk te wreed vond om te gebruiken. Naarmate de gevangenen echter onhandelbaarder werden, werden ze een noodzaak.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Je bent gedood door de blikseminslag...
actors.mobs.dm200.desc=De DM-200 is de tweede generatie dwergse 'verdedigingsmachines', ontworpen om dwergse mijnwerkers in de grotten en de stad eronder te beschermen. Ze zijn veel groter en zwaarder dan hun voorgangers en vallen aan met verwoestende hydraulische vuisten. Hun toegenomen formaat is tevens hun grootste zwakte, omdat ze niet door de smalle tunnels en deuropeningen van de kerker passen. De dwergen wisten het gebrek aan mobiliteit van de DM-200 te compenseren door ze in staat te stellen hun giftige uitlaatgassen af te voeren op vijanden op afstand, of op vijanden die ze zelf niet kunnen bereiken.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=De DM-200 stoot een straal giftige uitlaatgassen uit!
actors.mobs.dm201.desc=De dwergen experimenteerden kortstondig met het benadrukken van het gebrek aan mobiliteit van de DM-200 en creëerden enkele DM-modellen die volledig stationair zijn. De DM-201 is een aangepaste DM-200 die fungeert als een bewakingstoren zonder bewegingsmogelijkheid. In ruil voor het gebrek aan mobiliteit hebben DM-201's aanzienlijk meer duurzaamheid en aanvalskracht. Omdat DM-201's geen motor hebben om uitlaatgassen af te voeren, hebben de dwergen ze in plaats daarvan uitgerust met corrosieve gasgranaten! DM-201's zijn echter voorzichtig met deze granaten en gooien ze alleen wanneer ze van afstand worden aangevallen.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=De DM-201 lanceert een corrosieve granaat!
actors.mobs.dm300.charge_lost=SYSTEEMVERNIETIGD! TERUG NAAR LOKALE STROOMVOORZIENING!
actors.mobs.dm300.charging=SCHADE OPLOPEN! STROOMPAAL ACTIVEREN!
actors.mobs.dm300.charging_hint=DM-300 is onkwetsbaar zolang het door een mast van energie wordt voorzien!
actors.mobs.dm300.def_verb=geblokkeerd
actors.mobs.dm300.defeated=ERNSTIGE SCHADE! POGING TOT UITSCHAKELEN-
actors.mobs.dm300.desc=Deze machine is eeuwen geleden door de dwergen gebouwd. Later vervingen ze hun machines door golems, elementalen en zelfs demonen. Dat leidde uiteindelijk tot de ondergang van hun beschaving. De DM-300 en soortgelijke machines werden gebruikt in de bouw en mijnbouw, en soms voor de verdediging van steden.
actors.mobs.dm300.desc_supercharged=DM-300 is momenteel volledig opgeladen met elektrische energie. In deze vorm kan DM-300 niet beschadigd worden en beweegt hij met dubbele snelheid! Bovendien draait zijn boor nu snel genoeg om door massief gesteente te boren, hoewel hij daarbij wel veel langzamer beweegt. Het is zinloos om DM-300 direct aan te vallen zolang hij is opgeladen, maar er moet iets in de omgeving zijn dat hem van deze energie voorziet. Het vernietigen daarvan kan hem verzwakken.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ONBEVOEGD PERSONEEL GEDETECTEERD!
actors.mobs.dm300.pylons_destroyed=WAARSCHUWING! INSTABILITEIT GEDETECTEERD IN HET ELEKTRICITEITSNET!
actors.mobs.dm300.rankings_desc=Verpletterd door de DM-300
actors.mobs.dm300.shield=De DM-300 haalt zijn stroom uit de blootliggende draden en schermt zichzelf af!
actors.mobs.dm300.supercharged=VERNIETIG! VERNIETIG! VERNIETIG!
actors.mobs.dwarfking$dkghoul.rankings_desc=Viel voor de koning der dwergen
actors.mobs.dwarfking$dkgolem.rankings_desc=Viel voor de koning der dwergen
actors.mobs.dwarfking$dkmonk.rankings_desc=Viel voor de koning der dwergen
actors.mobs.dwarfking$dkwarlock.rankings_desc=Viel voor de koning der dwergen
actors.mobs.dwarfking.defeated=Je hebt ons allemaal ten onder gebracht...
actors.mobs.dwarfking.desc=Vele jaren geleden ontdekte een van de machtigste tovenaars aan het dwergenhof geheimen die hem enorme macht over leven en dood gaven. Hij gebruikte deze macht al snel om zijn gelijken, zijn koning en uiteindelijk elke dwergenburger te onderwerpen en te corrumperen. Nu is hij koning, heerser over een legioen ondode onderdanen. De Koning der Dwergen is een agressieve vijand die zal proberen zijn tegenstanders te omsingelen en te overweldigen met zijn horde ondode volgelingen.
actors.mobs.dwarfking.enraged=Je kunt me niet doden, %s. IK. BEN. ONSTERFELIJK!
actors.mobs.dwarfking.lifelink_1=Ik heb jouw essentie nodig, slaaf!
actors.mobs.dwarfking.lifelink_2=Bloed voor mij, slaaf!
actors.mobs.dwarfking.losing=Nee! Dit kun je niet doen... je hebt geen idee wat er onder de oppervlakte schuilgaat...
actors.mobs.dwarfking.name=Koning der Dwergen
actors.mobs.dwarfking.notice=Hoe durf je! Je hebt geen flauw benul waar je je mee bemoeit!
actors.mobs.dwarfking.rankings_desc=Viel voor de koning der dwergen
actors.mobs.dwarfking.teleport_1=Reken met ze af, slaaf!
actors.mobs.dwarfking.teleport_2=Houd ze bezig, slaaf!
actors.mobs.dwarfking.wave_1=Genoeg! Sta op, mijn slaven!
actors.mobs.dwarfking.wave_2=Meer! Bloed voor je koning!
actors.mobs.dwarfking.wave_3=Nutteloos! MAAK ZE NU DOOD!
actors.mobs.ebonymimic.desc=Mimics zijn magische wezens die elke gewenste vorm kunnen aannemen. In kerkers kiezen ze bijna altijd de vorm van een schatkist om nietsvermoedende avonturiers te lokken. Ebony mimics zijn sluipende mimics met het vermogen om zichzelf bijna onzichtbaar te maken. Ze loeren op plekken waar avonturiers waarschijnlijk mee in aanraking komen, maar dragen ook hun eigen buit met zich mee. Eenmaal ontdekt zijn ze niet sterker dan een gewone mimic, maar hun verrassingsaanval is verwoestend.
actors.mobs.ebonymimic.discover_hint=Je kunt deze vijand vinden met behulp van een specifiek snuisterijtje.
actors.mobs.ebonymimic.hidden_desc=Er lijkt hier iets aan de hand te zijn, maar het is bijna volledig transparant.
actors.mobs.ebonymimic.hidden_name=verdachte omtrek
actors.mobs.ebonymimic.name=ebbenhout imitatie
actors.mobs.ebonymimic.reveal=Er was een imitator aanwezig!
actors.mobs.elemental$chaoselemental.desc=Elementalen zijn chaotische wezens die vaak ontstaan wanneer krachtige occulte magie niet goed wordt beheerst. Elementalen hebben minimale intelligentie en worden meestal geassocieerd met een bepaald type magie. Chaos-elementalen zijn zeldzame en gevaarlijke elementalen die zich niet aan een specifiek element hebben gebonden. Ze zullen wilde, onvoorspelbare magie ontketenen wanneer ze aanvallen.
actors.mobs.elemental$chaoselemental.name=chaos elementaal
actors.mobs.elemental$fireelemental.desc=Elementalen zijn chaotische wezens die vaak ontstaan wanneer krachtige occulte magie niet goed wordt beheerst. Elementalen hebben minimale intelligentie en worden meestal geassocieerd met een bepaald type magie. Vuur-elementalen zijn een veelvoorkomend type elementaal dat schade toebrengt met vuurmagie. Ze steken hun doelwit in brand met mêlee-aanvallen en kunnen af en toe ook vuurstralen afschieten.
actors.mobs.elemental$fireelemental.name=vuurelementaal
actors.mobs.elemental$frostelemental.desc=Elementalen zijn chaotische wezens die vaak ontstaan wanneer krachtige occulte magie niet goed wordt beheerst. Elementalen hebben minimale intelligentie en worden meestal geassocieerd met een bepaald type magie. Vorst-elementalen zijn een veelvoorkomend type elementaal dat vijanden verzwakt met bevriezende magie. Ze bevriezen hun doelwit met mêlee-aanvallen en af en toe met aanvallen op afstand. Hun magie is veel effectiever in water.
actors.mobs.elemental$frostelemental.name=vorstelementaal
actors.mobs.elemental$newbornfireelemental.charging=Het element laadt zich op!
actors.mobs.elemental$newbornfireelemental.desc=Elementalen zijn chaotische wezens die vaak ontstaan wanneer krachtige occulte magie niet goed wordt beheerst. Elementalen hebben minimale intelligentie en worden meestal geassocieerd met een bepaald type magie. Deze vuurelementaal is net opgeroepen, maar nog steeds behoorlijk gevaarlijk!
actors.mobs.elemental$newbornfireelemental.desc_ally=Omdat dit elementaal wezen door een spreuk is opgeroepen, heeft het iets meer controle over zijn vlam. Het kan geen aanvallen op afstand uitvoeren, maar zal vijanden die het van dichtbij aanvalt in brand steken.
actors.mobs.elemental$newbornfireelemental.desc_boss=Vanwege de chaotische manier waarop dit element wordt opgeroepen, kan het na een beurt opladen alleen maar onnauwkeurige vuurstoten verspreiden.
actors.mobs.elemental$newbornfireelemental.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.elemental$newbornfireelemental.name=pasgeboren vuurelementaal
actors.mobs.elemental$shockelemental.desc=Elementalen zijn chaotische wezens die vaak ontstaan wanneer krachtige occulte magie niet goed wordt beheerst. Elementalen hebben minimale intelligentie en worden meestal geassocieerd met een bepaald type magie. Schokelementalen zijn een minder voorkomend type elementaal dat zijn vijanden verstoort met elektriciteit en lichtflitsen. In een lijfgevecht zullen ze elektrische ontladingen naar nabijgelegen vijanden afvuren en extra schade toebrengen aan hun primaire doelwit als deze zich in het water bevindt. Af en toe zullen ze ook een lichtstraal op afstand op hun doelwit richten, waardoor deze tijdelijk verblind wordt.
actors.mobs.elemental$shockelemental.name=schok elementair
actors.mobs.eye.deathgaze_kill=Die dodelijke blik heeft je gedood...
actors.mobs.eye.desc=Deze demon wordt ook wel een 'bol van haat' genoemd. Zodra hij een vijand ziet, gebruikt hij zijn dodelijke blik zonder terughoudendheid, waarbij hij vaak ook zijn bondgenoten verwondt.
actors.mobs.eye.name=boos oog
actors.mobs.fetidrat.desc=Er is duidelijk iets mis met deze rat. Zijn vettige zwarte vacht en rottende huid verschillen sterk van de gezonde ratten die je eerder hebt gezien. Zijn lichtgroene ogen geven hem een bijzonder dreigende uitstraling. De rat verspreidt een vreselijke stank, die van dichtbij overweldigend sterk is. Donkere, slijmerige substantie druipt uit de bek van de rat; hij vreet zich een weg door de vloer, maar lijkt in water op te lossen.
actors.mobs.fetidrat.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.fetidrat.name=stinkende rat
actors.mobs.fungalcore.desc=Deze gigantische paddenstoel moet wel de bron zijn van alle schimmelactiviteit in deze grot.
actors.mobs.fungalcore.name=schimmelkern
actors.mobs.fungalsentry.desc=Deze bijzonder hoge paddenstoel dient als verdedigingslinie voor het grotere schimmelnetwerk dat in deze grot leeft. Hij is onbeweeglijk, maar schiet precieze gifstralen af op alles wat binnen zijn gezichtsveld komt. Hoewel de impact van deze stralen vrij zwak is, kunnen ze zeer snel dodelijke hoeveelheden gif ophopen. Hoewel hij gedood kan worden, is het waarschijnlijk het beste om hem te vermijden.
actors.mobs.fungalsentry.name=schimmelwachter
actors.mobs.fungalspinner.desc=Deze grotspinner lijkt te worden bestuurd door een parasitaire schimmel. De schimmel heeft ook zijn eigenschappen veranderd en zijn web en gifzakjes vervangen door schimmelgroei. De schimmelspinner spuwt planten naar je in plaats van webben, verspreidt schimmelvegetatie en kan je mogelijk vastzetten. Hoewel hij niet kan vergiftigen, krijgt de schimmelspinner aanzienlijke schadebestendigheid als hij zich in de buurt van paddenstoelen bevindt.
actors.mobs.fungalspinner.name=paddenstoel spinner
actors.mobs.ghoul.desc=Naarmate de dwergenmaatschappij langzaam instortte en de huidige koning van de dwergen de absolute macht greep, werden de zwakken of degenen die zich tegen hem verzetten slecht behandeld. Naarmate de koning bedrevener werd in het hanteren van zwarte magie, dwong hij deze dwergen tot zijn wil, en nu vormen ze de voetsoldaten van zijn leger. Ghouls zijn op zichzelf niet bijzonder sterk, maar reizen altijd in groepen en zijn veel moeilijker te doden in grote aantallen. _Wanneer een ghoul verslagen is, zal hij na een paar beurten weer opstaan, zolang er maar een andere ghoul in de buurt is._
actors.mobs.ghoul.name=dwerggeest
actors.mobs.gnoll.desc=Gnolls zijn humanoïden die op hyena's lijken. Ze leven in riolen en kerkers en wagen zich zo nu en dan naar de oppervlakte om te plunderen. Gnoll-verkenners zijn vaste leden van hun roedel; ze zijn niet zo sterk als brute wezens en niet zo intelligent als sjamanen.
actors.mobs.gnoll.name=gnoll verkenner
actors.mobs.gnollexile.desc=Deze grijsbehaarde gnoll heeft een groot teken op zijn schouder, wat aangeeft dat hij een balling is. Gnolls worden meestal verbannen uit hun samenleving omdat ze bevelen negeren of wetten overtreden. Ballingen moeten sterk en slim zijn om te overleven, en deze lijkt te weten hoe hij de speer die hij vasthoudt moet gebruiken.
actors.mobs.gnollexile.desc_aggro=De verbannen gnoll kijkt woedend om zich heen. Het lijkt erop dat iets hem er toch toe heeft aangezet om te vechten. Pas op voor die speer!
actors.mobs.gnollexile.desc_passive=De verbannen gnoll valt niet aan. Hij lijkt niet zo agressief als de andere gnolls hier en vindt het waarschijnlijk niet de moeite waard om tegen je te vechten. Je zou hem gewoon kunnen laten lopen, maar hij heeft een rugzak die vol handige spullen zou kunnen zitten...
actors.mobs.gnollexile.name=gnoll ballingschap
actors.mobs.gnollexile.seen_aggro=De speerzwaaiende gnoll maakt zich klaar om aan te vallen!
actors.mobs.gnollexile.seen_passive=De speerzwaaiende gnoll kijkt je wantrouwend aan, maar valt niet aan.
actors.mobs.gnollgeomancer.alert=De geomancer ontwaakt! De hele grot lijkt te verschuiven terwijl hij lachend wegspringt!
actors.mobs.gnollgeomancer.desc=Deze indrukwekkend lange, ervaren gnoll moet wel de bron zijn van alle aardverplaatsingsmagie hier, en de organisator van alle gnoll-activiteiten. In tegenstelling tot de gnoll-sappeurs in de omgeving is de geomancer zeer bedreven in zijn magie en kan hij niet beschadigd worden door gegooide of vallende stenen. Hij kan echter niet vechten in lijf-aan-lijfgevechten.
actors.mobs.gnollgeomancer.desc_armor=De geomancer is momenteel ingesloten in een laag rotspantser. Je moet dichtbij komen en dit pantser met je houweel wegbreken voordat je de geomancer kunt beschadigen.
actors.mobs.gnollgeomancer.desc_armor_sapper=Een nabijgelegen gnoll-sappeur houdt een apparaat vast dat het rotspantser van de geomancer van energie voorziet. Je kunt het op dit moment absoluut niet beschadigen!
actors.mobs.gnollgeomancer.desc_sleeping=Deze indrukwekkend lange gnoll-sjamaan is omgeven door een laag rots en lijkt bijna op een standbeeld. Als je goed kijkt, zie je de rots op magische wijze bewegen, synchroon met de ademhaling van de oudere gnoll. Hij kan niet worden beschadigd zolang hij zo in rots is ingekapseld en lijkt te genieten van een letterlijk dutje in de aarde. Je kunt waarschijnlijk met je houweel door de rotslagen heen breken, maar _zorg ervoor dat je klaar bent voor een gevecht als je dat doet._ De geomancer moet de bron zijn van de verschillende aardverplaatsende magie hier, en de organisator van alle gnoll-activiteiten. _Het is misschien een goed idee om de gnolls die hier verspreid zijn te verslaan voordat je tegen hem vecht._
actors.mobs.gnollgeomancer.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.gnollgeomancer.name=gnoll geomancer
actors.mobs.gnollgeomancer.rock_kill=De vliegende kei heeft je gedood...
actors.mobs.gnollgeomancer.rockfall_kill=De vallende rotsen hebben je gedood...
actors.mobs.gnollgeomancer.warning=De geomancer begint in beweging te komen. Zorg dat je er klaar voor bent voordat je verdergaat!
actors.mobs.gnollguard.def_verb=geblokkeerd
actors.mobs.gnollguard.desc=Een grote en stoere gnoll met een speer en een schild, maar zonder helm. Deze bewakers zijn waarschijnlijk getrainde krachtpatsers, die zijn ingezet om de mijn te beschermen tegen indringende wilde dieren. De gnoll is sterk genoeg om de speer met één hand te hanteren, maar kan er niet erg goed mee omgaan. _Hij heeft voldoende open ruimte nodig om van afstand aan te vallen en zal aanzienlijk minder schade toebrengen als je dichterbij komt._
actors.mobs.gnollguard.desc_armor=Een nabijgelegen gnoll-sappeur heeft een apparaat in zijn bezit dat deze bewaker een aarden pantser geeft, waardoor de schade die hij oploopt aanzienlijk wordt verminderd.
actors.mobs.gnollguard.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.gnollguard.name=gnoll bewaker
actors.mobs.gnollguard.spear_warn=De gnoll deelt een venijnige slag uit met de punt van zijn speer!
actors.mobs.gnollsapper.desc=Een kleine en zwakke, maar intelligente gnoll met een bleke vacht en een tas vol diverse gadgets. Ze zijn hier waarschijnlijk om te helpen bij het zoeken naar en delven van donker goud, en hebben een bewaker in de buurt voor bescherming. Ze kunnen vechten, maar hun aanvallen zijn erbarmelijk zwak, niet sterker dan een gnoll-verkenner. In plaats van direct te vechten, geven de geniesoldaten er de voorkeur aan om hun verschillende gadgets te gebruiken om de rotsachtige omgeving voor hen te laten aanvallen. Ze beheersen zelf echter geen magie om aarde te verplaatsen, en zullen hun gadgets daarom waarschijnlijk roekeloos gebruiken. _Er zouden veel manieren moeten zijn om hun aanvallen tegen hen of hun bewaker te gebruiken._
actors.mobs.gnollsapper.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.gnollsapper.name=gnoll sapper
actors.mobs.gnolltrickster.desc=Een vreemd uitziend wezen, zelfs naar gnoll-maatstaven. Het is voorovergebogen met een gemene grijns, bijna alsof het de tas die over zijn schouder hangt, koestert. Zijn ogen staan wijd open met een vreemde mengeling van angst en opwinding. Er zit een grote verzameling slecht gemaakte pijltjes in zijn tas, die allemaal lijken te zijn voorzien van verschillende schadelijke stoffen.
actors.mobs.gnolltrickster.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.gnolltrickster.name=gnoll bedrieger
actors.mobs.goldenmimic.desc=Mimics zijn magische wezens die elke gewenste vorm kunnen aannemen. In kerkers kiezen ze bijna altijd de vorm van een schatkist om nietsvermoedende avonturiers te lokken. Gouden mimics zijn sterkere mimics die de sterkste avonturiers proberen aan te trekken. Ze hebben betere buit, maar zijn ook veel sterker dan gewone mimics.
actors.mobs.goldenmimic.name=gouden imitatie
actors.mobs.golem.def_verb=geblokkeerd
actors.mobs.golem.desc=De dwergen probeerden hun kennis van machines te combineren met hun nieuwe vermogen om elementalen te binden. Ze gebruikten aardgeesten als 'ziel' voor de mechanische lichamen van golems, omdat ze die het makkelijkst te beheersen vonden. Toch kon de kleinste fout in het ritueel tot een uitbarsting leiden.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=slurp... slurp...
actors.mobs.goo.desc=Er is weinig bekend over Goo. Misschien is het niet eens een wezen, maar een mengsel van stoffen uit de riolen dat een begin van een eigen wil heeft gekregen.
actors.mobs.goo.enraged=woedend
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.name=Smurrie
actors.mobs.goo.notice=Glurp-glurp!
actors.mobs.goo.pumpup=Goo is zichzelf aan het oppeppen!
actors.mobs.goo.rankings_desc=Opgeslokt door de smurrie
actors.mobs.greatcrab.def_verb=geblokkeerd
actors.mobs.greatcrab.desc=Deze krab is gigantisch, zelfs vergeleken met andere rioolkrabben. Zijn blauwe schild is bedekt met scheuren en zeepokken, wat wijst op zijn hoge leeftijd. Hij beweegt zich langzaam voort, nauwelijks in evenwicht met zijn enorme schaar. Hoewel de krab maar één schaar heeft, compenseert zijn grootte dat ruimschoots. De krab houdt de schaar voor elke bedreiging en beschermt zichzelf met een ondoordringbare muur van pantser. De krab kan echter geen aanvallen blokkeren die hij niet ziet aankomen, of aanvallen van meerdere vijanden tegelijk.
actors.mobs.greatcrab.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.greatcrab.name=grote krab
actors.mobs.greatcrab.noticed=De krab blokkeert met zijn enorme klauw.
actors.mobs.guard.def_verb=geblokkeerd
actors.mobs.guard.desc=Ooit waren zij de bewakers van de gevangenis, maar nu verschillen ze niet meer van de gevangenen. Ze strompelen als zombies, hersenloos ronddwalend door de gangen op zoek naar alles wat er niet thuishoort, zoals jij! Ze dragen kettingen om hun heupen, mogelijk om vijanden dichterbij te trekken.
actors.mobs.guard.name=gevangenisbewaker
actors.mobs.guard.scorpion=Kom hierheen!
actors.mobs.hermitcrab.def_verb=geblokkeerd
actors.mobs.hermitcrab.desc=Om de een of andere reden heeft deze rioolkrab besloten om het afgebroken bovenste deel van een vat op zijn kop te dragen! Het extra gewicht heeft hem weliswaar tot zijn normale snelheid teruggebracht, maar het biedt hem ook aanzienlijk meer bescherming. Je denkt echter dat je iets hoort stuiteren in het vat...
actors.mobs.hermitcrab.name=heremietkrab
actors.mobs.mimic.desc=Mimics zijn magische wezens die elke gewenste vorm kunnen aannemen. In kerkers kiezen ze bijna altijd de vorm van een schatkist om nietsvermoedende avonturiers te lokken. Mimics kunnen venijnig bijten, maar bevatten vaak meer schatten dan een gewone kist.
actors.mobs.mimic.discover_hint=Je kunt deze vijand overal in de kerker tegenkomen.
actors.mobs.mimic.hidden_hint=Er klopt iets niet aan deze kist... Het is misschien geen goed idee om ernaartoe te lopen en te proberen hem open te maken.
actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=Die borstkas is een imitatie!
actors.mobs.mob.died=Je hoort in de verte iets sterven.
actors.mobs.mob.discover_hint=Je kunt deze vijand in een specifiek gedeelte van de kerker vinden.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Gedood door: %s
actors.mobs.monk$focus.desc=Deze monnik is perfect gefocust op zijn doelwit en lijkt hun bewegingen te anticiperen voordat ze die uitvoeren. Zolang hij gefocust is, mist de volgende fysieke aanval op dit personage gegarandeerd, ongeacht de omstandigheden. Het pareren van deze aanval kost de monnik focus, en hij moet die opnieuw opbouwen om een volgende aanval te pareren. Monniken bouwen sneller focus op terwijl ze bewegen.
actors.mobs.monk$focus.name=gericht
actors.mobs.monk.def_verb=geblokkeerd
actors.mobs.monk.desc=Deze fanatieke monniken hebben hun leven gewijd aan het beschermen van de geheimen van hun stad tegen buitenstaanders. Ze gebruiken geen wapens of pantser en vertrouwen volledig op hun ongewapende vechtkunst.
actors.mobs.monk.name=dwergmonnik
actors.mobs.monk.parried=gepareerd
actors.mobs.necromancer$necroskeleton.desc=Dit skelet is opgeroepen door een necromancer. Het gedraagt zich net als een gewoon skelet en zal sterven wanneer de necromancer die het heeft opgeroepen, wordt gedood.
actors.mobs.necromancer$necroskeleton.name=skelet van een necromancer
actors.mobs.necromancer.desc=Deze leerling-duistere magiërs zijn massaal naar de gevangenis getrokken, omdat het de perfecte plek is om hun duistere kunsten te beoefenen. Necromancers roepen skeletten op en geven ze kracht om voor hen te vechten. Het doden van de necromancer doodt ook het skelet dat hij oproept.
actors.mobs.necromancer.name=necromancer
actors.mobs.npcs.blacksmith.cant_enter_old=Dat gebied is niet toegankelijk tijdens deze speelsessie. Start een nieuw spel om de nieuwe missie te proberen!
actors.mobs.npcs.blacksmith.def_verb=geblokkeerd
actors.mobs.npcs.blacksmith.desc=Deze trollensmid ziet eruit zoals alle trollen eruitzien: hij is lang en slank, en zijn huid lijkt qua kleur en textuur op steen. De trollensmid is aan het knutselen met onevenredig kleine gereedschappen.
actors.mobs.npcs.blacksmith.enter_no=Nog niet
actors.mobs.npcs.blacksmith.enter_yes=Ik ben er klaar voor.
actors.mobs.npcs.blacksmith.entrance_blocked=De weg naar beneden is geblokkeerd.
actors.mobs.npcs.blacksmith.exit_no=Nog niet
actors.mobs.npcs.blacksmith.exit_warn_crystal=Dat gigantische kristal ligt daar beneden ook nog steeds. Ik betaal extra als je het vernietigt.
actors.mobs.npcs.blacksmith.exit_warn_full=Ben je klaar? Je hebt een hoop goud, maar zorg ervoor dat je niets van je spullen bent vergeten.\n\n_Onthoud, ik laat je niet meer binnen als je eenmaal boven bent._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Die gigantische paddenstoel staat daar beneden ook nog. Ik betaal extra als je hem doodmaakt.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Die gnoll-geomancer is daar beneden ook nog steeds. Ik betaal extra als je hem doodt.
actors.mobs.npcs.blacksmith.exit_warn_high=Ben je klaar? Je hebt blijkbaar een flinke hoeveelheid goud, maar ik kan nog wel wat meer gebruiken. Je zou 40 stuks moeten kunnen krijgen. Onthoud, ik laat je niet meer binnen als je eenmaal boven bent.
actors.mobs.npcs.blacksmith.exit_warn_low=Ben je al klaar? Je lijkt niet veel goud te hebben. Je zou 40 stuks moeten kunnen krijgen. Onthoud, ik laat je niet meer binnen als je eenmaal boven bent.
actors.mobs.npcs.blacksmith.exit_warn_med=Ben je klaar? Je hebt in ieder geval wat goud, maar er zit zeker nog meer in de mijn. Je zou wel 40 stukken moeten kunnen vinden. Onthoud, ik laat je niet meer binnen als je eenmaal boven bent.
actors.mobs.npcs.blacksmith.exit_warn_none=Ben je al klaar? Je hebt bijna geen goud! Je zou 40 stuks moeten kunnen krijgen. Onthoud, ik laat je niet meer binnen als je eenmaal boven bent.
actors.mobs.npcs.blacksmith.exit_yes=Ik ben klaar.
actors.mobs.npcs.blacksmith.get_lost=Ik heb het druk. Ga weg!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hé mens! Je ziet eruit als een belangrijk persoon.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Pas op, de mijn is gevaarlijk voor een klein mensje zoals jij. Hij is al een tijdje verlaten en er zijn een hoop kristallen begonnen te groeien. Ze glanzen, maar zijn te fragiel om iets waard te zijn, en ze worden beschermd door een of ander magisch voorwerp. Ze zijn behoorlijk sterk, dus _wees voorzichtig waar je mijnt_, anders trek je hun aandacht. Er is ook ergens een _gigantisch kristal_. Dat is een stuk harder, dus wees voorbereid op een gevecht als je het probeert te breken. Ik wed dat het kapotslaan ervan de kristalgroei zal vertragen, dus ik betaal je extra als je het kunt.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hé mens! Je ziet er dapper uit.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Pas op, de mijn is gevaarlijk voor een klein mensje zoals jij. Er groeit een soort schimmelmonster daaronder. Het heeft paddenstoelwachters die echt dodelijk zijn als ze je zien, maar ze kunnen je tenminste niet achtervolgen. _Blijf uit het zicht_ als je wilt overleven. Ik betaal extra als je de _grootste paddenstoel_ weet te verslaan, maar dat zal wel wat moeite kosten. Hij is verbonden met een heleboel myceliumknopen die in de muren verborgen zitten. Je zult de meeste moeten breken voordat je hem echt schade kunt toebrengen.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Pas op, de mijn is gevaarlijk voor een klein mensje zoals jij. Sommige gnolls willen het goud ook hebben en nu richten ze een ravage aan. Het zijn domme wezens, dus hun mijnbouw heeft allerlei instortingen en grotverzakkingen veroorzaakt. Je zult erdoorheen moeten graven, dus _zoek naar recent verstoorde rotsen._ Ik denk dat een van de gnolls de meeste problemen veroorzaakt, waarschijnlijk een _geomancer sjamaan_ of zoiets. Ik betaal extra als je hem kunt vinden en doden, maar ik weet zeker dat hij zich zal verzetten.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hé mens! Je ziet eruit alsof je er snel bij bent.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hé mens! Je ziet eruit als een slimme.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hé mens! Je ziet eruit als een sluwe vos.
actors.mobs.npcs.blacksmith.intro_quest_start=Wil je nuttig zijn, hè? Ja, ik heb wel iets wat je kunt doen. Ik heb deze werkplaats bovenop een oude mijn gebouwd, hij is net onderaan die ladder. Pak deze houweel en hak wat donkergouderts voor me. 40 stukken zouden genoeg moeten zijn. De rots daar beneden is lekker zacht, dus je kunt met wat moeite door de muren heen hakken. Wat bedoel je, hoe ga ik betalen? Je bent een gierigaard... Oké, oké, ik kan wel wat smeden voor je doen. Beschouw jezelf maar als gelukkig, ik ben de enige smid in de buurt.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hé mens! Jij ziet eruit als een stoere kerel.
actors.mobs.npcs.blacksmith.lost_pick=Maak je een grapje? Waar is mijn houweel?!
actors.mobs.npcs.blacksmith.name=trollensmid
actors.mobs.npcs.blacksmith.quest_start_prompt=Ben je klaar om naar beneden te gaan? Zorg dat je genoeg ruimte hebt voor het goud. \n\n_Ik laat je daar maar één keer in de steek!_
actors.mobs.npcs.blacksmith.reminder=Heb je mijn tijd verspild? De ingang van de mijn is daar.
actors.mobs.npcs.blacksmith.reminder_crystal=Breng me zoveel goud als je kunt, en probeer ook het grote kristal te breken.
actors.mobs.npcs.blacksmith.reminder_fungi=Breng me zoveel mogelijk goud en probeer ook de gigantische paddenstoel te doden.
actors.mobs.npcs.blacksmith.reminder_gnoll=Breng me zoveel mogelijk goud en probeer ook de gnoll-geomancer te doden.
actors.mobs.npcs.ghost.crab_1=Hallo %s... Ooit was ik net als jij - sterk en zelfverzekerd... Maar ik werd gedood door een oeroud wezen... Ik kan deze plek niet verlaten... Niet voordat ik wraak heb genomen... De _grote krab_ die mijn leven heeft genomen, heb ik gedood... \n\nHij is onnatuurlijk oud... Met een enorme enkele klauw en een dik schild... _Pas op voor zijn klauw, je moet de krab verrassen, anders blokkeert hij je aanval ermee..._
actors.mobs.npcs.ghost.crab_2=Alsjeblieft... Help me... Versla het schaaldier...\n\n_Het zal altijd blokkeren... Als het je ziet aankomen..._
actors.mobs.npcs.ghost.desc=De geest is nauwelijks zichtbaar. Het lijkt op een vormeloze vlek van zwak licht met een bedroefd gezicht.
actors.mobs.npcs.ghost.find_me=Dankjewel... kom me opzoeken...
actors.mobs.npcs.ghost.gnoll_1=Hallo %s... Ooit was ik net als jij - sterk en zelfverzekerd... Maar ik werd gedood door een verraderlijke vijand... Ik kan deze plek niet verlaten... Niet voordat ik wraak heb genomen... Dood de _gnoll-bedrieger_ die mijn leven heeft genomen... \n\nHij is niet zoals de andere gnolls... Hij verstopt zich en gebruikt werpwapens... _Pas op voor zijn giftige en brandende pijlen, val niet van afstand aan..._
actors.mobs.npcs.ghost.gnoll_2=Alsjeblieft... Help me... Versla de bedrieger...\n\n_Laat het je niet raken... Kom er dichtbij..._
actors.mobs.npcs.ghost.name=droevige geest
actors.mobs.npcs.ghost.rat_1=Hallo %s... Ooit was ik net als jij - sterk en zelfverzekerd... Maar ik werd gedood door een afschuwelijk beest... Ik kan deze plek niet verlaten... Niet voordat ik wraak heb genomen... Ik dood de _stinkende rat_ die mijn leven heeft genomen... \n\n Hij dwaalt over deze verdieping... Verspreidt overal vuil... _Pas op voor zijn stankwolk en bijtende beet, het zuur lost op in water..._
actors.mobs.npcs.ghost.rat_2=Alstublieft... Help me... Versla het monster...\n\n_Vecht ertegen in de buurt van water... Vermijd de stank..._
actors.mobs.npcs.imp.cya=Tot ziens, %s!
actors.mobs.npcs.imp.desc=Kobolden zijn mindere demonen. Ze staan niet bekend om hun kracht of magische talenten, maar ze zijn wel erg slim en sociaal. Veel kobolden leven het liefst tussen niet-demonen.
actors.mobs.npcs.imp.golems_1=In mijn geval zijn het _golems_ die gedood moeten worden. Kijk, ik wil hier een klein bedrijfje beginnen, maar die stomme golems zijn slecht voor de zaken! Het is heel moeilijk om te onderhandelen met ronddwalende granieten brokken, verdorie! Dus dood alsjeblieft... laten we zeggen _vier_ en je krijgt een beloning.
actors.mobs.npcs.imp.golems_2=Hoe gaat het met je golem-safari? Vergeet vooral niet om die tokens te pakken.
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.intro=Ben jij een avonturier? Ik ben dol op avonturiers! Je kunt altijd op ze rekenen als er iets gedood moet worden, toch? Voor een premie natuurlijk ;)
actors.mobs.npcs.imp.monks_1=In mijn geval zijn het _monniken_ die gedood moeten worden. Kijk, ik wil hier een klein bedrijfje beginnen, maar die idioten kopen zelf niets en jagen andere klanten weg. Dus, dood er alsjeblieft... laten we zeggen _vijf_ en je krijgt een beloning.
actors.mobs.npcs.imp.monks_2=Oh, je leeft nog! Ik wist wel dat je kungfu sterker zou zijn ;) Vergeet alleen niet die tokens te pakken.
actors.mobs.npcs.imp.name=ambitieuze duivel
actors.mobs.npcs.impshopkeeper.buyback=Het kaboutertje geeft je je artikel vrolijk terug.
actors.mobs.npcs.impshopkeeper.desc=De kabouter heeft een winkeltje geopend aan de rand van de binnenhallen. Het is fijn om een vriendelijk gezicht te zien, maar zijn prijzen lijken allesbehalve vriendelijk.
actors.mobs.npcs.impshopkeeper.greetings=Hallo, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Wat heb je gedaan, %s? Snel winkelen, ik moet hier weg!
actors.mobs.npcs.impshopkeeper.name=ambitieuze duivel
actors.mobs.npcs.impshopkeeper.thief=Ik dacht dat ik je kon vertrouwen!
actors.mobs.npcs.mirrorimage.desc=Deze illusie lijkt veel op je, maar is bleker en maakt kleine schokkerige bewegingen.
actors.mobs.npcs.mirrorimage.discover_hint=Je kunt dit personage vinden met behulp van een specifieke perkamentrol.
actors.mobs.npcs.mirrorimage.name=spiegelbeeld
actors.mobs.npcs.npc.discover_hint=Je kunt dit personage in een specifiek gedeelte van de kerker vinden.
actors.mobs.npcs.prismaticimage.desc=Deze glinsterende illusie lijkt sprekend op jou en lijkt zelfs je huidige wapen en pantser te dragen. Prismatische beelden proberen de aandacht van vijanden op zich te vestigen en deze af te leiden, waarbij ze hun verbeterde verdediging en gezondheid gebruiken om jou te beschermen. Hoewel ze niet dezelfde aanvalskracht hebben als spiegelbeelden, beschikken ze over een verbeterde duurzaamheid en profiteren ze van de voordelen van je pantser. Wanneer hun HP tot 0 is gereduceerd, zullen prismatische beelden over een aantal beurten vervagen en kunnen ze gedurende deze tijd nog steeds worden genezen. Wanneer er geen vijanden aanwezig zijn, zullen prismatische beelden vervagen en zich weer bij hun meester voegen.
actors.mobs.npcs.prismaticimage.discover_hint=Je kunt dit personage vinden met behulp van een specifieke perkamentrol.
actors.mobs.npcs.prismaticimage.name=prismatisch beeld
actors.mobs.npcs.ratking.confused=Wat... Waar ben ik? Mijn koninkrijk heeft me nodig!
actors.mobs.npcs.ratking.crown_after=Ben je tevreden met je nieuwe harnas? Geen weg terug!
actors.mobs.npcs.ratking.crown_clothes=Trek wat kleren aan! Je bent niet in de stemming om met royalty te praten!
actors.mobs.npcs.ratking.crown_desc=Ooh, is die kroon voor mij?! Hij ziet er veel glanzender uit dan de mijne, dus ik neem hem graag aan!\n\nSterker nog, ik denk dat ik je iets kan aanbieden als beloning voor deze kroon. Een enorme kracht die een held zoals jij waardig is! Zou je dat willen?
actors.mobs.npcs.ratking.crown_fine=Prima! Ik wilde het toch niet per se hebben...
actors.mobs.npcs.ratking.crown_info=Vertel me eerst meer.
actors.mobs.npcs.ratking.crown_no=Liever niet...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, dankjewel! Ga nu je koning trots maken!
actors.mobs.npcs.ratking.crown_yes=Natuurlijk!
actors.mobs.npcs.ratking.desc=Deze rat is iets groter dan een gewone buidelrat. Hij draagt een klein kroontje op zijn kop.
actors.mobs.npcs.ratking.desc_birthday=Deze rat is iets groter dan een gewone buidelrat. Hij draagt een klein groen feestmutsje in plaats van zijn gebruikelijke kroon. Fijne verjaardag, Rattenkoning!
actors.mobs.npcs.ratking.desc_crown=Deze rat is iets groter dan een gewone buidelrat. Hij draagt een dwergkoningskroon op zijn kop.
actors.mobs.npcs.ratking.desc_winter=Deze rat is iets groter dan een gewone buidelrat. Hij draagt een klein feestelijk hoedje in plaats van zijn gebruikelijke kroon. Fijne feestdagen!
actors.mobs.npcs.ratking.discover_hint=Je kunt dit personage vinden aan het einde van een specifiek gedeelte van de kerker.
actors.mobs.npcs.ratking.name=rattenkoning
actors.mobs.npcs.ratking.not_sleeping=Ik slaap niet!
actors.mobs.npcs.ratking.what_is_it=Wat is dit? Ik heb geen tijd voor deze onzin. Mijn koninkrijk regeert zichzelf niet!
actors.mobs.npcs.sheep.baa!=Baa!
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.baa?=Baa?
actors.mobs.npcs.sheep.def_verb=geblokkeerd
actors.mobs.npcs.sheep.desc=Dit is een magisch schaap. Wat is er zo magisch aan? Je kunt het niet doden. Het blijft daar staan tot het op magische wijze verdwijnt, terwijl het ondertussen met een lege blik herkauwt.
actors.mobs.npcs.sheep.discover_hint=Je kunt dit personage vinden met behulp van een specifiek voorwerp of een val.
actors.mobs.npcs.sheep.name=schaap
actors.mobs.npcs.shopkeeper.buyback=De winkelier geeft je artikel met tegenzin terug.
actors.mobs.npcs.shopkeeper.desc=Deze corpulente man lijkt meer thuis te horen in een handelswijk van een grote stad dan in een kerker. Zijn prijzen verklaren waarom hij liever hier zaken doet.
actors.mobs.npcs.shopkeeper.flee=De winkelier slaat op de vlucht!
actors.mobs.npcs.shopkeeper.name=winkelier
actors.mobs.npcs.shopkeeper.sell=Verkoop een artikel
actors.mobs.npcs.shopkeeper.talk=Gesprek
actors.mobs.npcs.shopkeeper.talk_ascent=Ik heb geen idee wat je met dat amulet van plan bent, maar ik wil er niets mee te maken hebben. Koop iets anders en ga verder, we moeten allebei hier weg!
actors.mobs.npcs.shopkeeper.talk_caves=Geef geld uit, leef langer.\n\nOh, en doe de groeten aan die trollensmid als je hem ziet. Herinner die sukkel eraan dat hij me nog steeds geld schuldig is voor die hamer die ik hem vorige week verkocht!
actors.mobs.npcs.shopkeeper.talk_city=Mijn spullen kunnen je hier beneden veilig houden.\n\n...En blijf alsjeblieft niet rondhangen. Het heeft een eeuwigheid geduurd voordat de lokale bevolking me hier met rust liet, ik wil niet dat je problemen veroorzaakt!
actors.mobs.npcs.shopkeeper.talk_halls=Hallo daar, ik heb speciale prijzen voor demonenjagers!\n\nOh, en pas op daaronder! De demonen beneden geven er niets om hoe dapper je bent. Je kunt niet meer naar boven komen en meer geld uitgeven als je dood bent! ;)\n\nZijn de demonen net als ik? Haha, helemaal niet. Ik ben maar een klein ventje, geen vechter, en ik heb mijn verstand nog intact weten te houden. De demonen beneden zijn veel sterkere wezens, en ze zijn allemaal tot slaaf gemaakt door... nou ja... pas gewoon op daaronder.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Nou hallo daar, Uwe Hoogheid, of is het nu Uwe Heiligheid? Haha, hoe dan ook, dit is niet de plek voor u. Veel mensen zouden behoorlijk ontzet zijn als u hier dood zou komen te staan. Maar u heeft vast wel wat geld, waarom koopt u niet iets om dat te voorkomen?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Kijk eens wie we daar hebben, de reizende held! Als je probeert een andere stad te redden, veel succes dan, de gevaren hier zijn veel groter dan die van kleine bandietenbendes. Ik weet zeker dat je het beter zult doen dan wie dan ook, probeer alleen niet vlak voor mijn winkel te sterven.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=U lijkt zich niet helemaal op uw gemak te voelen, juffrouw. Smalle kerkergangen zijn toch niet zo ruim als grote zalen of de bossen rondom de stad, of wel? Haha, ach, let niet op mijn gezwam, waarom koopt u niet gewoon iets?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Ik heb alles wat je nodig hebt voor een geslaagd avontuur!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Haha, ik denk dat ik ergens in de stad een opsporingsposter met jouw naam erop heb gezien. Ben je op de vlucht? Oh, je bent onschuldig, hè? Natuurlijk, natuurlijk... Maak je geen zorgen, ik heb wel betere dingen te doen dan je aan te geven, maar misschien moet je toch iets kopen om zeker te zijn?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Ben je van het dievengilde gekomen om het gebied te zuiveren? Nee, gewoon om te winkelen? Nou, dood dan meteen een paar monsters. Verwacht trouwens geen korting, ik betaal jullie een flink bedrag aan beschermingsgeld en jullie bieden me hier beneden nauwelijks bescherming.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Dat is een interessant zegel dat je daar hebt, die zijn normaal gesproken heel. Ben je een gevallen held of zoiets? Nou ja, wat je ook gedaan hebt, het gaat me niets aan, je munten zijn nog steeds goed.
actors.mobs.npcs.shopkeeper.thief=Dief, dief!
actors.mobs.npcs.shopkeeper.warn=Pas op! Ik waarschuw je niet nog een keer.
actors.mobs.npcs.vaultlaser.desc=Deze bewaker vuurt met regelmatige tussenpozen lasers af. _Aangezien dit slechts een testgebied is, zullen de lasers u geen daadwerkelijke schade toebrengen._
actors.mobs.npcs.vaultlaser.name=kluis laserbewaker
actors.mobs.npcs.vaultsentry.desc=Deze bewaker scant het gebied volgens een vast patroon. _Aangezien dit slechts een testgebied is, zal de bewaker niets doen als hij u detecteert._
actors.mobs.npcs.vaultsentry.name=kluis scannende bewaker
actors.mobs.npcs.wandmaker.def_verb=geblokkeerd
actors.mobs.npcs.wandmaker.desc=Deze oude, maar nog steeds kwieke heer heeft een ietwat verwarde uitdrukking op zijn gezicht. Hij wordt beschermd door een magisch schild.
actors.mobs.npcs.wandmaker.intro_1=Ik kwam hier om een zeldzaam ingrediënt voor een toverstaf te vinden, maar ik ben verdwaald en mijn magische schild verzwakt. Ik moet zo meteen vertrekken, maar ik kan het niet verdragen om weg te gaan zonder te krijgen waarvoor ik gekomen ben.
actors.mobs.npcs.wandmaker.intro_2=Als je dat voor me kunt regelen, betaal ik je graag met een van mijn prachtig vervaardigde toverstokken! Ik heb er twee meegenomen, dus je mag kiezen welke je het liefst hebt.
actors.mobs.npcs.wandmaker.intro_berry=De oude gevangenisdirecteur had een rotbesplant en ik ben op zoek naar een zaadje ervan. De plant is waarschijnlijk inmiddels verwilderd, dus het kan lastig zijn om er een zaadje uit te krijgen. De tuin zou hier in de buurt moeten zijn. Probeer uit de buurt te blijven van de ranken als je heelhuids wilt blijven. Vuur gebruiken is misschien verleidelijk, maar doe het alsjeblieft niet, je doodt de plant en vernietigt de zaadjes.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, hallo Uwe Hoogheid! Wat een aangename verrassing u te ontmoeten op zo'n deprimerende plek! Ik wil u niet tot last zijn, maar ik heb misschien een taak voor u.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, hallo juffrouw! Wat een aangename verrassing om een held te ontmoeten op zo'n deprimerende plek! Als u een oude man wilt helpen, heb ik misschien een taak voor u.
actors.mobs.npcs.wandmaker.intro_dust=Ik ben op zoek naar lijkstof. Het is een speciaal soort vervloekt beendermeel dat meestal opduikt op plekken zoals deze. Er moet hier ergens een afgesloten ruimte zijn, ik weet zeker dat je daar wat stof zult vinden. Wees wel voorzichtig, want de vloek die de stof met zich meedraagt is behoorlijk krachtig. Neem zo snel mogelijk contact met me op, dan zal ik het voor je zuiveren.
actors.mobs.npcs.wandmaker.intro_ember=Ik ben op zoek naar verse gloeiende kooltjes van een pasgeboren vuurelementaal. Elementalen verschijnen meestal wanneer een oproepingsritueel niet onder controle is, dus zoek wat kaarsen en een rituele plek en ik weet zeker dat je er eentje tevoorschijn kunt toveren. Je moet er wel voor zorgen dat je jezelf niet insluit tijdens het gevecht, of je kunt een vriesvoorwerp bij de hand houden. Pasgeboren elementalen zijn behoorlijk krachtig en chaotisch, maar ze kunnen niet tegen de kou.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, hallo juffrouw! Een vriendelijk gezicht is een aangename verrassing hier beneden, nietwaar? Sterker nog, ik zweer dat ik uw gezicht eerder heb gezien, maar ik kan er mijn vinger niet op leggen... Ach, geeft niet, als u hier bent voor een avontuur, heb ik misschien wel een taak voor u.
actors.mobs.npcs.wandmaker.intro_mage=Oh, hallo %s! Ik hoorde dat er wat ophef was over jou en het tovenaarsinstituut? Ach, laat maar, ik heb die zeurpieten toch nooit gemocht. Als je het ziet zitten, heb ik misschien een taakje voor je.
actors.mobs.npcs.wandmaker.intro_rogue=O jee, je hebt me laten schrikken! Ik heb nog nooit een bandiet uit deze streek ontmoet die nog bij zijn volle verstand is, dus je moet wel van de oppervlakte komen! Als je een vreemdeling wilt helpen, heb ik misschien wel een taak voor je.
actors.mobs.npcs.wandmaker.intro_warrior=Oh, hallo daar! Wat een aangename verrassing om een krijger uit het noorden te ontmoeten op zo'n sombere plek! Je moet een flinke reis hebben afgelegd om hier te komen. Als je op zoek bent naar avontuur, heb ik misschien wel een opdracht voor je.
actors.mobs.npcs.wandmaker.name=oude toverstokkenmaker
actors.mobs.npcs.wandmaker.reminder_berry=Heb je al een Rotberry-zaadje gevonden, %s? Zoek een ruimte vol planten.
actors.mobs.npcs.wandmaker.reminder_dust=Heb je al iets gevonden met lijkstof, %s? Zoek naar barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Heb je al iets gevonden met die gloeiende kooltjes, %s? Je moet vier kaarsen en de rituele plek vinden.
actors.mobs.phantompiranha.desc=Fantoompiranha's zijn een zeldzame piranhasoort met magische vermogens en een griezelig doorschijnend lichaam. Ze kunnen teleporteren wanneer ze worden aangevallen, om te ontsnappen of om snel dicht bij hun vijand te komen! Hoewel ze lastig te bevechten zijn, wordt hun vlees gewaardeerd vanwege de magische eigenschappen.
actors.mobs.phantompiranha.name=spookpiranha
actors.mobs.phantompiranha.teleport_away=De spookpiranha teleporteert weg...
actors.mobs.piranha.desc=Deze vleesetende vissen worden speciaal gekweekt om overstroomde gebieden te beschermen. Hun beet is dodelijk, dus het is het beste om ze niet direct tegen te komen.
actors.mobs.piranha.discover_hint=Je kunt deze vijand overal in de kerker tegenkomen.
actors.mobs.piranha.name=reuzenpiranha
actors.mobs.pylon.desc_active=Een hoogspanningsmast, bedoeld om de elektriciteit te reguleren die de machines in dit gebied van stroom voorziet. De mast is momenteel gevuld met elektrische energie; dit moet DM-300 wel van stroom voorzien! In deze toestand zijn masten kwetsbaar, maar ze zullen in een cirkelvormige beweging elektriciteit naar nabijgelegen cellen overbrengen. Dankzij hun zware metalen constructie zijn masten bestand tegen grote beschadigingen.
actors.mobs.pylon.desc_inactive=Een hoogspanningsmast, bedoeld om de elektriciteit te reguleren die de machines in dit gebied van stroom voorziet. De mast is momenteel inactief en kan niet beschadigd raken.
actors.mobs.pylon.name=elektriciteitsmast
actors.mobs.rat.desc=Buidelratten zijn agressieve maar tamelijk zwakke bewoners van de riolen. Ze kunnen gemeen bijten, maar vormen alleen een levensbedreigende situatie als ze in grote aantallen voorkomen.
actors.mobs.rat.name=buidelrat
actors.mobs.ripperdemon.desc=Deze afschuwelijke wezens zijn het resultaat van de vele dwergenlijken in deze regio die door demonische krachten worden gebruikt. Rippers zijn uitgemergelde, griezelige wezens die op dwergen lijken, maar met gebroken lichamen en lange, scherpe klauwen van bot. Ripper-demonen zijn niet bijzonder sterk, maar ze zijn wel behendig en gevaarlijk. Ze kunnen grote afstanden springen om snel hun doelwitten te bereiken voordat ze die met hun klauwen doorboren.
actors.mobs.ripperdemon.leap=De ripperdemon maakt zich klaar om te springen!
actors.mobs.ripperdemon.name=ripper demon
actors.mobs.rotheart.desc=De vrucht van de rotbes is heel bijzonder. In plaats van te rotten en voedingsstoffen te leveren, groeit de vrucht, wordt hard en omsluit het zaad. Het biedt bescherming aan de interne organen die in de vrucht groeien. Deze gigantische bol wordt het hart van een volwassen rotbesplant genoemd.
actors.mobs.rotheart.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.rotheart.name=rot hart
actors.mobs.rotlasher.desc=De wortelstok is een onderdeel van de wortelstructuur van een volwassen rotbesplant en tevens hun belangrijkste verdedigingsmiddel. Wormstokken zijn blind en zitten vast in de grond, maar vallen na een korte observatie elke nabijgelegen bedreiging hevig aan. Als er geen vijanden in de buurt zijn, blijven ze roerloos staan en proberen ze op te gaan in de omringende vegetatie.
actors.mobs.rotlasher.discover_hint=Je kunt deze vijand tegenkomen tijdens een specifieke missie.
actors.mobs.rotlasher.name=rotte zweep
actors.mobs.scorpio.desc=Deze enorme, spinachtige, demonische wezens vermijden gevechten van dichtbij en geven er de voorkeur aan om verlammende, gekartelde stekels van grote afstand af te vuren.
actors.mobs.scorpio.name=Schorpioen
actors.mobs.senior.desc=Deze fanatieke monniken hebben hun leven gewijd aan het beschermen van de geheimen van hun stad tegen buitenstaanders. Ze gebruiken geen wapens of pantser en vertrouwen volledig op hun ongewapende vechtkunst.
actors.mobs.senior.name=oudere monnik
actors.mobs.shaman$blueshaman.spell_desc=Deze sjamaan draagt een blauw masker en gebruikt magie die de schade die je oploopt tijdelijk verhoogt.
actors.mobs.shaman$purpleshaman.spell_desc=Deze sjamaan draagt een paars masker en gebruikt magie die je nauwkeurigheid en ontwijking tijdelijk vermindert.
actors.mobs.shaman$redshaman.spell_desc=Deze sjamaan draagt een rood masker en gebruikt magie die je aanvalskracht tijdelijk verzwakt.
actors.mobs.shaman.bolt_kill=De magische bliksemstraal heeft je gedood...
actors.mobs.shaman.desc=De slimste gnolls kunnen sjamanistische magie leren. Gnollsjamanen gebruiken vooral gevechtsspreuken om hun gebrek aan spierkracht te compenseren. Ze zetten die zonder aarzelen in tegen wie hun positie in de stam betwist.
actors.mobs.shaman.name=gnoll sjamaan
actors.mobs.skeleton.def_verb=geblokkeerd
actors.mobs.skeleton.desc=Skeletten bestaan uit de botten van ongelukkige avonturiers en bewoners van de kerker, tot leven gewekt door kwade magie uit de diepte. Na genoeg schade vallen ze uiteen in een explosie van botten.
actors.mobs.skeleton.explo_kill=Je bent omgekomen door de explosie van botten...
actors.mobs.skeleton.name=skelet
actors.mobs.slime.def_verb=geblokkeerd
actors.mobs.slime.desc=Slimes zijn vreemde, ietwat magische wezens met een rubberachtig omhulsel en een vloeibare kern. De riolering van de stad voorziet hen van een ruime hoeveelheid water en voedingsstoffen. Vanwege hun elastische buitenmembraan is het moeilijk om slimes meer dan 6 schade toe te brengen met één enkele aanval.
actors.mobs.slime.name=slijm
actors.mobs.snake.desc=Deze gigantische slangen kunnen zich razendsnel om aanvallen heen kronkelen, waardoor ze moeilijk te raken zijn. Magische aanvallen of verrassingsaanvallen kunnen ze echter wel verrassen. Je kunt een verrassingsaanval uitvoeren door aan te vallen terwijl de slang je niet kan zien. Een manier is om een slang je door een deuropening te laten achtervolgen en dan toe te slaan vlak nadat hij de deur is binnengegaan.
actors.mobs.snake.hint=Probeer de knop 'onderzoeken' op een slang te gebruiken om te leren hoe je ze kunt bestrijden.
actors.mobs.snake.name=rioolslang
actors.mobs.spectralnecromancer.desc=Hoewel skeletten de belangrijkste hulpbron zijn voor necromancers, geven sommigen de voorkeur aan andere, minder fysieke wezens. Spectrale necromancers hebben geesten als hun favoriete wezens gekozen! Individuele geesten zijn niet zo sterk als skeletten, maar deze necromancers schromen er niet voor om er een heleboel op te roepen!
actors.mobs.spectralnecromancer.name=spectrale necromancer
actors.mobs.spinner.desc=Deze groenige, harige grotspinnen mijden een rechtstreeks gevecht. Ze wachten liever op afstand terwijl hun slachtoffer vastzit in hun web en langzaam sterft aan hun giftige beet.
actors.mobs.spinner.name=grotspinner
actors.mobs.statue.def_verb=geblokkeerd
actors.mobs.statue.desc=Je zou denken dat het gewoon weer een van de vele levenloze beelden in deze kerker is, maar de roodgloeiende ogen verraden het.
actors.mobs.statue.desc_weapon=Hoewel het beeld zelf van steen is gemaakt, ziet de _%s_ die het vasthoudt er echt uit.
actors.mobs.statue.discover_hint=Je kunt deze vijand overal in de kerker tegenkomen.
actors.mobs.statue.name=geanimeerd beeld
actors.mobs.succubus.desc=Succubi zijn demonen die eruitzien als verleidelijke vrouwen met een wat gotisch uiterlijk. Met hun magie kunnen ze een held betoveren, zodat die niets kan aanvallen totdat de betovering uitwerkt.
actors.mobs.succubus.name=succubus
actors.mobs.swarm.desc=De dodelijke zwerm vliegen zoemt woedend. Elke niet-magische aanval zal hem in twee kleinere, maar even gevaarlijke zwermen splitsen.
actors.mobs.swarm.name=zwerm vliegen
actors.mobs.tengu$bombability$bombblob.desc=Hier stijgt een wolk gloeiendhete rook op. Pas op, het gaat ontploffen!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Het zit vast aan de grond, je kunt het niet verplaatsen!
actors.mobs.tengu$bombability$bombitem.desc=Tengu heeft hier een vreemd uitziende rookbom gegooid, waaruit dikke, hete rook opstijgt. Hij maakt een luid tikkend geluid, alsof hij aftelt naar een explosie! De bom zit vast in de grond, dus je kunt hem niet oppakken.
actors.mobs.tengu$bombability$bombitem.name=rookbom
actors.mobs.tengu$fireability$fireblob.desc=Tengu heeft een fijn poeder gegooid dat hier lijkt samen te smelten tot stoom; het staat op het punt te ontbranden!
actors.mobs.tengu$shockerability$shockerblob.desc=Hier bouwt zich elektrische energie op; alles wat op dit vakje staat, krijgt de volgende beurt een schok!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Het geeft te veel stroom af, je kunt het niet pakken!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu heeft hier een merkwaardige machine neergezet, die blijkbaar is gemaakt van DM-100 onderdelen. De machine spuwt constant elektrische vonken uit, maar dit lijkt een voorspelbaar patroon te volgen. Met al die elektrische vonken eromheen is het onmogelijk om dit op te pakken.
actors.mobs.tengu$shockerability$shockeritem.name=Schokkend
actors.mobs.tengu.defeated=Eindelijk vrij...
actors.mobs.tengu.desc=Tengu horen bij een oude sluipmoordenaarsclan met dezelfde naam. Ze staan bekend om hun veelvuldige gebruik van shuriken en vallen.
actors.mobs.tengu.interesting=Laten we er iets interessants van maken...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Ik heb je te pakken, %s!
actors.mobs.tengu.notice_have=Ik heb je nu te pakken, %s!
actors.mobs.tengu.rankings_desc=Vermoord door de Tengu
actors.mobs.thief.carries=De dief draagt een _%s_. Uiteraard gestolen.
actors.mobs.thief.desc=Hoewel deze gevangenen vrij rondlopen in hun cel, is deze plek nog steeds hun gevangenis. In de loop der tijd heeft deze plek niet alleen hun vrijheid, maar ook hun verstand aangetast. Lang geleden zijn deze gestoorde dieven en bandieten vergeten wie ze zijn en waarom ze stelen. Deze vijanden stelen en vluchten eerder dan dat ze vechten. Zorg ervoor dat je ze in de gaten houdt, anders zie je je gestolen spullen misschien nooit meer terug.
actors.mobs.thief.escapes=De dief gaat er vandoor met jouw %s!
actors.mobs.thief.name=gestoorde dief
actors.mobs.thief.stole=De dief heeft %s van je gestolen!
actors.mobs.tormentedspirit.desc=Gekwelde geesten zijn van nature goedaardige geesten die door een vloek zijn getroffen. Zolang ze vervloekt zijn, vallen ze aan als een geestverschijning en zijn ze bovendien krachtiger! Het is mogelijk om de vloek op te heffen door het juiste voorwerp te gebruiken terwijl je naast de geest staat. Als de vloek is opgeheven, zal de geest je zeker dankbaar zijn...
actors.mobs.tormentedspirit.name=gekwelde geest
actors.mobs.tormentedspirit.thank_you=Bedankt...
actors.mobs.vaultrat.desc=Deze rat vertoont enkele gedragsveranderingen om de nieuwe AI van vijanden in de kluis te testen: \n_-_ Zijn bewegingen zijn door muren heen te 'horen'. \n_-_ Hij loopt langs een vooraf ingestelde patrouilleroute. \n_-_ Tijdens het rondlopen is zijn detectiebereik aanzienlijk kleiner in de richting waarin hij beweegt. \n_-_ Tijdens het slapen is zijn detectiebereik ook kleiner. \n_-_ Wanneer hij je detecteert, zal hij je 'onderzoeken' voordat hij overschakelt naar de jacht. Onderzoekende vijanden bewegen zich naar je toe, maar vallen niet aan en zijn gemakkelijker te missen achter deuren en hoeken.
actors.mobs.warlock.bolt_kill=De schaduwflits heeft je gedood...
actors.mobs.warlock.desc=Toen de dwergen hun aandacht van techniek naar de duistere kunsten verlegden, grepen de tovenaars de macht in de stad. Ze begonnen met elementaire magie, maar stapten al snel over op demonologie en necromantie.
actors.mobs.warlock.name=dwergtovenaar
actors.mobs.wraith.desc=Een geest is de wraakzuchtige geest van een zondaar wiens graf of tombe is verstoord. Omdat het een etherische entiteit is, is het erg moeilijk om hem met een gewoon wapen te raken.
actors.mobs.wraith.discover_hint=Je kunt deze vijand overal in de kerker tegenkomen.
actors.mobs.wraith.name=geest
actors.mobs.yogdzewa$larva.desc=Deze kleine nakomelingen van Yog-Dzewa zijn simpele handlangers die gemakkelijk te produceren zijn. Hoewel ze individueel zwak zijn, worden ze snel opgeroepen en kunnen ze in grote aantallen overweldigend worden.
actors.mobs.yogdzewa$larva.name=gods larve
actors.mobs.yogdzewa$larva.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogdzewa.darkness=De duisternis wordt steeds dichterbij...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa is een Oude God; een gigantisch monster dat zich in sterfelijke werelden begeeft en ze verslindt om zijn eindeloze groei te voeden. De dwergen moeten de aandacht van deze kosmische verschrikking hebben getrokken toen ze met duistere magie speelden, en hebben sindsdien geprobeerd hem in bedwang te houden. Yog-Dzewa is afkomstig uit een dimensie van pure magische chaos en kan zijn ware vorm niet in deze wereld aannemen. In plaats daarvan heeft hij avatars gecreëerd en demonische handlangers opgeroepen om zijn bevelen hier uit te voeren. Dit gigantische oog is het middelpunt van Yog-Dzewa's macht in deze wereld. Hoewel het oog zelf onbeweeglijk is, kan het krachtige stralen demonische magie afvuren en diverse handlangers oproepen om hem te helpen.
actors.mobs.yogdzewa.desc_spawners=Je voelt golven van demonische energie vanuit de verdiepingen erboven naar je ogen stralen. Iets dat je daar boven in leven hebt gelaten, moet energie terugvoeren naar Yog-Dzewa. _Yog zal deze energie gebruiken om krachtigere handlangers op te roepen!_
actors.mobs.yogdzewa.hope=JOUW HOOP IS EEN ILLUSIE!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=IK. ZIE. JE.
actors.mobs.yogdzewa.rankings_desc=Verslonden door Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Deze vuist is gevormd uit pure lichtenergie. Hij kan bij elke beurt krachtige, verblindende lichtstralen afvuren! Deze stralen zullen je tijdelijk verblinden en bovendien zware schade toebrengen. De vuist kan ook de arena kortstondig in verblindend licht hullen om te ontsnappen! De vuist heeft echter geen speciale vaardigheden die hij in de mêlee kan gebruiken.
actors.mobs.yogfist$brightfist.name=heldere vuist
actors.mobs.yogfist$brightfist.teleport=De vuist verdwijnt in een flits van licht die je ernstig verblindt!
actors.mobs.yogfist$burningfist.desc=Een reusachtige vuist, gehuld in vuur. De vingers knetteren als ze zich sluiten en strooien gloeiende kooltjes op de vloer.
actors.mobs.yogfist$burningfist.name=brandende vuist
actors.mobs.yogfist$darkfist.desc=Deze vuist is gevormd uit pure duistere energie. Hij kan elke beurt krachtige stralen duistere magie afvuren! Deze stralen verzwakken je lichtbron en richten bovendien zware schade aan. De vuist kan de arena ook kortstondig in duisternis hullen om te ontsnappen! De vuist heeft echter geen speciale vaardigheden die hij in de mêlee kan gebruiken.
actors.mobs.yogfist$darkfist.name=donkere vuist
actors.mobs.yogfist$darkfist.teleport=De vuist teleporteert weg in een explosie van duisternis die je lichtbron dooft!
actors.mobs.yogfist$rottingfist.desc=Een enorme vuist van rottend vlees. Stinkend slijm sijpelt tussen de vingers door en bevlekt de steen eronder.
actors.mobs.yogfist$rottingfist.name=rottende vuist
actors.mobs.yogfist$rustedfist.desc=Deze vuist is gemaakt van levend metaal. Het is een torenhoge massa van bewegend metaal met krachtige mêlee-aanvallen en kan zijn doelwitten op afstand verlammen. Door zijn enorme massa zal de vuist schade geleidelijk incasseren in plaats van direct. De vuist is echter onbuigzaam en kan zich niet door smalle doorgangen bewegen. Bovendien, hoewel de schade langzaam kan worden opgelopen, zal de uitgestelde schade blijven toenemen als de vuist meerdere keren wordt geraakt.
actors.mobs.yogfist$rustedfist.name=verroeste vuist
actors.mobs.yogfist$soiledfist.desc=Deze vuist is gevormd uit chaotische aardmagie. Terwijl hij beweegt, zal hij constant vegetatie eromheen laten ontspruiten. Hij kan ook geconcentreerde aardstralen afvuren die zijn doelwit in snelgroeiende wijnranken en wortels vangen! De vuist ontleent zijn kracht aan deze planten en zal schade weerstaan op basis van de hoeveelheid hoge of gegroefde vegetatie in de buurt!
actors.mobs.yogfist$soiledfist.name=vuile vuist
actors.mobs.yogfist.desc=Deze vuist is een aspect van Yog-Dzewa's kracht. Vuisten zijn verbonden met de kracht van Yog-Dzewa en zullen beschermd zijn tegen alle schade wanneer ze zich dicht bij het oog bevinden.
actors.mobs.yogfist.invuln_warn=De vuist is onkwetsbaar zolang hij zich in de buurt van het oog bevindt!
actors.mobs.yogfist.rankings_desc=Verslonden door Yog-Dzewa
actors.char.def_verb_evaded=ontweken
actors.char.enemy_hit=%s heeft je geraakt
actors.char.enemy_missed=Jij %2$s %1$s's aanval
actors.char.hit=%s raakte %s
actors.char.mob_missed=%1$s %2$s %3$s's aanval
actors.char.out_of_paralysis=De pijn rukte %s uit zijn verlamming.
actors.char.you_hit=Je hebt %s geraakt.
actors.char.you_missed=%1$s %2$s jouw aanval
actors.mobs.mob.fleeing=%s is op de vlucht
actors.mobs.mob.hunting=%s is aan het jagen.
actors.mobs.mob.passive=%s is passief
actors.mobs.mob.sleeping=%s slaapt
actors.mobs.mob.wandering=%s dwaalt rond
actors.mobs.elemental.desc=Rondzwervende vuurelementalen ontstaan als bijproduct van het oproepen van grotere wezens. Hun aard is zo chaotisch dat zelfs de machtigste demonoloog ze niet kan beheersen.
actors.mobs.elemental.name=vuurelementaal
actors.mobs.king.desc=De laatste dwergenkoning kende de geheimen van leven en dood. Hij haalde zijn hovelingen over om mee te doen aan een ritueel dat hun eeuwige jeugd moest schenken. Uiteindelijk kreeg alleen hij die, met een leger ondoden erbij.
actors.mobs.king.name=Koning der Dwergen
actors.mobs.npcs.bee.desc=Ondanks hun kleine formaat verdedigen gouden bijen hun meester fel. Ze leven alleen niet erg lang.
actors.mobs.npcs.bee.name=gouden bij
actors.mobs.shielded.desc=Bruten zijn de grootste, sterkste en taaiste gnolls. Als ze zwaar gewond raken, worden ze razend en brengen ze hun vijanden nog meer schade toe.
actors.mobs.shielded.name=bruut met schild
actors.mobs.yog.desc=Yog-Dzewa is een Oude God, een machtige entiteit uit de rijken van de chaos. Een eeuw geleden wonnen de oude dwergen ternauwernood de oorlog tegen zijn leger van demonen, maar ze waren niet in staat de god zelf te doden. In plaats daarvan sloten ze hem op in de hallen onder hun stad, in de overtuiging dat hij te zwak was om ooit nog op te staan.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s heeft een _%s_ bij zich. Overduidelijk gestolen.
actors.buffs.armorevasion.name=Ontwijkend
actors.mobs.king.defeated=Je kunt me niet doden. %s... Ik ben... onsterfelijk...
