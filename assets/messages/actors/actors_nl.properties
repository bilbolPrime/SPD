actors.blobs.blizzard.desc=Hier woedt een sneeuwstorm.
actors.blobs.blizzard.name=sneeuwstorm
actors.blobs.confusiongas.desc=Hier dwarrelt een wolk van verwarrend gas rond.
actors.blobs.confusiongas.name=verwarring gas
actors.blobs.corrosivegas.desc=Hier dwarrelt een wolk van dodelijk bijtend gas rond.
actors.blobs.corrosivegas.name=corrosief gas
actors.blobs.electricity.desc=Hier gloeit een elektrisch veld fel.
actors.blobs.electricity.name=elektriciteit
actors.blobs.electricity.ondeath=Je schrok je dood...
actors.blobs.electricity.rankings_desc=geëlektrocuteerd
actors.blobs.fire.desc=Hier woedt een hevige brand.
actors.blobs.fire.name=vuur
actors.blobs.foliage.desc=Lichtstralen doorbreken de duisternis van de ondergrondse tuin.
actors.blobs.foliage.name=gebladerte
actors.blobs.freezing.desc=De lucht is hier onnatuurlijk koud.
actors.blobs.freezing.name=vrieslucht
actors.blobs.goowarn.desc=Hier wemelt het van kleine stipjes donkere energie!
actors.blobs.goowarn.name=donkere energie
actors.blobs.inferno.desc=Hier woedt een inferno.
actors.blobs.inferno.name=hel
actors.blobs.paralyticgas.desc=Hier wervelt een wolk van verlammend gas rond.
actors.blobs.paralyticgas.name=verlammend gas
actors.blobs.regrowth.name=hergroei
actors.blobs.sacrificialfire.desc=Hier staat een altaar met een brandend offervuur erop. Elk wezen dat hier gedood wordt, zal als offer aan de geesten van de kerker worden verteerd. Misschien krijg je wel een beloning als er genoeg offers worden gebracht?
actors.blobs.sacrificialfire.name=offervuur
actors.blobs.sacrificialfire.reward=Het vuur laait op en dooft dan uit, en laat een beloning achter!
actors.blobs.sacrificialfire.unworthy=Het vuur verteert je offer, maar verandert er niets aan.
actors.blobs.sacrificialfire.worthy=Het vuur verteert je offer en wordt steeds sterker.
actors.blobs.smokescreen.desc=Hier dwarrelt een dikke, zwarte rookwolk rond.
actors.blobs.smokescreen.name=rookgordijn
actors.blobs.stenchgas.desc=Hier hangt een wolk van walgelijke stank.
actors.blobs.stenchgas.name=stankgas
actors.blobs.stormcloud.desc=Hier dwarrelt een wolk van opstijgende waterdamp rond.
actors.blobs.stormcloud.name=onweerswolken
actors.blobs.toxicgas.desc=Hier dwarrelt een groenige wolk giftig gas rond.
actors.blobs.toxicgas.name=giftig gas
actors.blobs.toxicgas.ondeath=Je bent overleden door het giftige gas...
actors.blobs.toxicgas.rankings_desc=Verstikt
actors.blobs.waterofawareness.desc=De kracht van kennis straalt uit het water van deze bron. Door uit de bron te drinken, worden alle uitgeruste voorwerpen volledig geïdentificeerd, worden vloeken op alle voorwerpen in je inventaris onthuld en worden alle voorwerpen op de huidige verdieping zichtbaar.
actors.blobs.waterofawareness.name=water van bewustzijn
actors.blobs.waterofawareness.procced=Bij elke slok voel je hoe kennis je geest binnenstroomt.
actors.blobs.waterofhealth.desc=De kracht van gezondheid straalt uit van het water in deze bron. Drinken uit deze bron geneest wonden, stilt de honger en verwijdert vloeken van alle voorwerpen die je draagt.
actors.blobs.waterofhealth.name=water van gezondheid
actors.blobs.waterofhealth.procced=Bij elke slok voel je hoe je wonden volledig genezen.
actors.blobs.web.desc=Alles is hier bedekt met een dik web. Alles wat het web aanraakt of erdoorheen wordt gegooid, breekt het, maar blijft er ook in vastzitten.
actors.blobs.web.name=spinneweb
actors.buffs.adrenaline.desc=Een golf van fysieke kracht, adrenaline versterkt zowel de aanvals- als de bewegingssnelheid.\n\nAdrenaline stelt het doelwit in staat om met 2x snelheid te rennen en met 1,5x snelheid aan te vallen.\n\nResterende beurten: %s.
actors.buffs.adrenaline.name=adrenaline
actors.buffs.adrenalinesurge.desc=Een golf van enorme kracht, maar helaas niet permanent.\n\nKrachtboost: +%d.\nBeurten totdat de boost verzwakt: %s.
actors.buffs.adrenalinesurge.name=krachtverhoging
actors.buffs.amok.desc=Amok veroorzaakt een staat van grote woede en verwarring bij het doelwit.\n\nWanneer een wezen in amok raakt, valt het alles in de buurt aan, of het nu vriend of vijand is.\n\nAantal resterende beurten van amok: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Een dun schild omringt je en blokkeert een deel van de schade van magische aanvallen. Je magische pantser wordt momenteel versterkt met: 0-%d. Beurten totdat het magische pantser verzwakt: %s.
actors.buffs.arcanearmor.name=geheim pantser
actors.buffs.artifactrecharge.desc=Energie stroomt door je heen, waardoor je uitgeruste artefacten sneller opladen. Elk artefact wordt iets anders beïnvloed, maar ze laden allemaal veel sneller op dan normaal. Resterende beurten: \n\n Elk artefact wordt iets anders beïnvloed, maar ze laden allemaal veel sneller op dan normaal.
actors.buffs.artifactrecharge.name=artefact opladen
actors.buffs.ascensionchallenge.almost=Je voelt dat Yogs greep op het amulet begint te verzwakken, je bent er bijna!
actors.buffs.ascensionchallenge.beckon=Het amulet begint vijanden in de verte aan te roepen.
actors.buffs.ascensionchallenge.break=Neem even de tijd om op adem te komen en voel hoe je wonden beginnen te helen!
actors.buffs.ascensionchallenge.damage=Het amulet begint donkere energie uit te stralen. Het brandt!
actors.buffs.ascensionchallenge.desc=Op de een of andere manier behoudt Yog-Dzewa via het amulet invloed op deze wereld en probeert hij je opmars te stoppen! De kracht van Yog maakt de kerker veel gevaarlijker, waardoor het aantal vijanden toeneemt en ze sterker worden! Deze kracht zal blijven toenemen als er niets aan gedaan wordt. Je kunt hem verzwakken door vijanden te verslaan die door Yog's kracht zijn versterkt.
actors.buffs.ascensionchallenge.desc_beckon=Het amulet zendt momenteel signalen uit naar vijanden in de verte, om hen te waarschuwen voor je positie.
actors.buffs.ascensionchallenge.desc_clear=De duistere energie die van het amulet uitstraalt, is voorlopig zoveel mogelijk verzwakt.
actors.buffs.ascensionchallenge.desc_damage=De energie van het amulet is zo sterk geworden dat het je _direct schaadt!_
actors.buffs.ascensionchallenge.desc_haste=Het amulet zorgt er momenteel voor dat vijanden op afstand sneller bij je kunnen komen!
actors.buffs.ascensionchallenge.desc_slow=Het amulet vertraagt je momenteel en heft snelheidsverhogende effecten op!
actors.buffs.ascensionchallenge.haste=Het amulet begint vijanden op afstand te lokken!
actors.buffs.ascensionchallenge.name=de vloek van het amulet
actors.buffs.ascensionchallenge.on_kill=De donkere energie verteert je...
actors.buffs.ascensionchallenge.slow=Het amulet begint aan te voelen als een loden gewicht in je inventaris!
actors.buffs.ascensionchallenge.weaken=Je voelt dat de vloek van het amulet iets afzwakt.
actors.buffs.ascensionchallenge.weaken_info=De vloek van het amulet kan worden verzwakt door meer vijanden te verslaan.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Als je vijanden verslaat, zal de vloek van het amulet verzwakken!
actors.buffs.barkskin.desc=Je huid is verhard, voelt ruw en hard aan als boomschors. De verharde huid verhoogt je effectieve pantser, waardoor je je beter kunt verdedigen tegen fysieke aanvallen. Je pantser is momenteel verhoogd met: 0 - 0. Het duurt tot de schorshuid verzwakt: 1. Als je schorshuid van meerdere bronnen ontvangt, wordt alleen de sterkste toegepast.
actors.buffs.barkskin.name=schorshuid
actors.buffs.barrier.desc=Een duurzame krachtbubbel die alle schade blokkeert.\n\nDe barrière absorbeert schade voor datgene wat hij beschermt, zolang er nog schildkracht over is. De schildkracht zal na verloop van tijd ook langzaam afnemen.\n\nResterende schildkracht: %d.
actors.buffs.barrier.name=barrière
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=boos
actors.buffs.berserk.angered_desc=De ernst van de verwondingen van de Berserker versterkt zijn slagen. Naarmate de Berserker fysieke schade oploopt, neemt zijn woede toe, waardoor hij bonusschade krijgt. Schade die door pantser wordt geblokkeerd, telt nog steeds mee voor het opbouwen van woede. De woede neemt na verloop van tijd af. Hoe lager de gezondheid van de Berserker, hoe langer de woede aanhoudt. Bij 100% woede kan de Berserker in een razernij raken, waardoor hij een schild krijgt op basis van het niveau van zijn pantser en zijn ontbrekende gezondheid. Tijdens zijn berserk-modus neemt zijn schild na verloop van tijd af en zodra het op is, moet hij rusten voordat hij zijn woede weer kan opbouwen. Huidige woede: +1%1%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%2%3 ...
actors.buffs.berserk.berserk=razernij
actors.buffs.berserk.berserk_desc=Angst en onzekerheid verdwijnen, en alleen woede blijft over. In deze staat is de Berserker extreem krachtig, _richt +50%% schade aan en krijgt bonusschild_, maar verliest ook elke beurt schild.\n\nWanneer al zijn schild tot 0 is gereduceerd, eindigt het berserken.\n\nNa het woeden moet de Berserker herstellen voordat hij opnieuw woede kan opbouwen.\n\nResterend schild: %d
actors.buffs.berserk.exhausted=uitgeput
actors.buffs.berserk.no_seal=Je hebt je gebroken zegel nodig om in een razernij te raken!
actors.buffs.berserk.rankings_desc=Dood in een vlaag van woede
actors.buffs.berserk.recovering=herstellen
actors.buffs.berserk.recovering_desc=Innerlijke kracht kent zijn grenzen. De Berserker moet rusten voordat hij zijn woede weer kan gebruiken. Tijdens het herstellen bouwt de Berserker geen woede op door de schade die hij oploopt.
actors.buffs.berserk.recovering_desc_levels=Niveaus tot herstel: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Aantal beurten tot herstel: _%d_
actors.buffs.bleeding.desc=Die wond lekt een zorgwekkende hoeveelheid bloed.\n\nBloeding veroorzaakt elke beurt schade. Elke beurt neemt de schade met een willekeurig bedrag af, totdat de bloeding uiteindelijk stopt.\n\nHuidige bloedingsschade: %d.
actors.buffs.bleeding.heromsg=Je bloedt!
actors.buffs.bleeding.name=bloeding
actors.buffs.bleeding.ondeath=Je bent doodgebloed...
actors.buffs.bleeding.rankings_desc=Doodgebloed
actors.buffs.bless.desc=Een enorme concentratieboost, sommigen zeggen dat het door de goden is geïnspireerd. \n\nZegen verhoogt de nauwkeurigheid en ontwijking met 25%%, waardoor de gezegende veel effectiever is in de strijd. \n\nAantal resterende beurten van de zegen: %s.
actors.buffs.bless.name=gezegend
actors.buffs.blindness.desc=Verblinding verandert de omringende wereld in een donkere waas.\n\nTijdens verblinding wordt het zichtbereik van een personage beperkt tot één tegel, waardoor aanvallen op afstand nutteloos worden en het heel gemakkelijk is om vijanden in de verte uit het oog te verliezen. Bovendien kan een verblinde held geen perkamenten of boeken lezen.\n\nAantal beurten van blindheid resterend: %s.
actors.buffs.blindness.heromsg=Je bent verblind!
actors.buffs.blindness.name=blind
actors.buffs.blobimmunity.desc=Een of andere vreemde kracht omhult je met een dunne beschermende barrière, die alle schadelijke effecten in de lucht blokkeert. Je bent immuun voor alle gebiedsgebonden effecten zolang deze barrière actief is. Aantal beurten immuniteit resterend: 0
actors.buffs.blobimmunity.name=zuiveringsbarrière
actors.buffs.burning.burnsup=%s brandt op!
actors.buffs.burning.desc=Er zijn maar weinig dingen zo beangstigend als door vlammen overspoeld te worden. Het vuur zal elke beurt schade toebrengen totdat het door water wordt geblust of uitdooft. Vuur kan worden geblust door in water te stappen of door de plons van een vernietigend drankje. Bovendien kan het vuur brandbaar terrein of voorwerpen waarmee het in contact komt, doen ontbranden. Aantal resterende beurten van het vuur: 0.
actors.buffs.burning.heromsg=Je vat vlam!
actors.buffs.burning.name=brandend
actors.buffs.burning.ondeath=Je bent levend verbrand...
actors.buffs.burning.rankings_desc=Verbrand tot as
actors.buffs.championenemy$antimagic.desc=Kampioenen met antimagische eigenschappen incasseren 50% minder schade en zijn volledig immuun voor magische effecten.
actors.buffs.championenemy$antimagic.name=antimagische kampioen
actors.buffs.championenemy$blazing.desc=Vlammende kampioenen richten 25% meer mêlee-schade aan, steken vijanden die ze aanvallen in brand, zijn immuun voor vuur en verspreiden vuur om zich heen wanneer ze sterven. Ze kunnen echter geen vuur op water verspreiden.
actors.buffs.championenemy$blazing.name=vlammende kampioen
actors.buffs.championenemy$blessed.desc=Gezegende kampioenen hebben 4x meer nauwkeurigheid en ontwijking.
actors.buffs.championenemy$blessed.name=gezegende kampioen
actors.buffs.championenemy$giant.desc=Reusachtige kampioenen incasseren 80% minder schade en hebben een +1 aanvalsradius, maar kunnen zich niet door afgesloten ruimtes bewegen.
actors.buffs.championenemy$giant.name=reuzenkampioen
actors.buffs.championenemy$growing.desc=Naarmate kampioenen sterker worden, krijgen ze een steeds grotere bonus op nauwkeurigheid, ontwijking, fysieke schade en een vermindering van de ontvangen schade.\n\nHuidige acc/eva/dmg boost: %1$d%%\nHuidige schadevermindering: %2$d%%
actors.buffs.championenemy$growing.name=groeiende kampioen
actors.buffs.championenemy$projecting.desc=Kampioenen met projectielen richten 25% meer mêlee-schade aan en hebben +3 aanvalsradius.
actors.buffs.championenemy$projecting.name=projecterende kampioen
actors.buffs.championenemy.warn=Je voelt een dodelijke aanwezigheid.
actors.buffs.charm.cant_attack=Je bent betoverd door die vijand en kunt hem niet aanvallen.
actors.buffs.charm.desc=Een betovering is manipulatieve magie die ervoor kan zorgen dat vijanden elkaar tijdelijk aanbidden. Personages die door een betovering worden beïnvloed, kunnen de vijand die hen betoverd heeft niet direct aanvallen. Het is echter nog steeds mogelijk om andere doelen aan te vallen. De schok van pijn verkort de duur van de betovering. Aantal resterende beurten van de betovering: 0.
actors.buffs.charm.heromsg=Je bent betoverd!
actors.buffs.charm.name=betoverd
actors.buffs.chill.desc=Niet helemaal bevroren, maar toch veel te koud.\n\nGekoelde doelen voeren alle acties langzamer uit, afhankelijk van het aantal resterende beurten van het effect. In het ergste geval is dit gelijk aan vertraging.\n\nResterende beurten van koeling: %1$s.\nSnelheid wordt verminderd met: %2$s%%
actors.buffs.chill.freezes=%s loopt vast!
actors.buffs.chill.name=gekoeld
actors.buffs.combo$combomove.clobber.desc=Stoot een vijand 2 vakjes achteruit, maar brengt geen schade toe en kan niet in een afgrond vallen. Verhoogt de combo met 1.
actors.buffs.combo$combomove.clobber.empower_desc=Stoot een vijand 3 vakjes achteruit, veroorzaakt duizeligheid en kan hem in een afgrond gooien, maar brengt geen schade toe. Verhoogt de combo met 1.
actors.buffs.combo$combomove.clobber.name=slaan
actors.buffs.combo$combomove.crush.desc=Veroorzaakt %d%% (combo*25%%) schade aan het primaire doelwit en de helft daarvan aan alle andere vijanden in een 7x7 gebied. Reset de combo na gebruik.
actors.buffs.combo$combomove.crush.empower_desc=Springt omhoog naar %1$d tegel(s) en brengt %2$d%% (combo*25%%) schade toe aan het primaire doelwit, en de helft van die schade aan alle andere vijanden in een 7x7 AOE. Reset de combo na gebruik.
actors.buffs.combo$combomove.crush.name=verbrijzeling
actors.buffs.combo$combomove.fury.desc=Raakt een vijand één keer voor elke combo die je hebt, elke treffer richt 60% schade aan en kan betoveringen activeren. Reset de combo na gebruik.
actors.buffs.combo$combomove.fury.empower_desc=Springt omhoog naar %d tegel(s) en raakt een vijand één keer voor elke combo die je hebt. Elke treffer doet 60%% schade en kan betoveringen activeren. Reset de combo na gebruik.
actors.buffs.combo$combomove.fury.name=woede
actors.buffs.combo$combomove.parry.desc=Blokkeert de volgende aanval binnen 1 beurt na activering en beantwoordt deze direct met een tegenaanval. Reset de combo als er niets wordt gepareerd.
actors.buffs.combo$combomove.parry.empower_desc=Blokkeert _alle aanvallen_ binnen 1 beurt na activering en beantwoordt deze direct met een tegenaanval. Reset de combo als er niets wordt gepareerd.
actors.buffs.combo$combomove.parry.name=pareren
actors.buffs.combo$combomove.slam.desc=Deelt %d%% (combo*20%%) van je schadeblokkeringskracht uit als bonusschade. Reset de combo na gebruik.
actors.buffs.combo$combomove.slam.empower_desc=_Springt omhoog naar %1$d tegel(s)_ en deelt %2$d%% (combo*20%%) van je schadeblokkeringskracht als bonusschade uit. Reset de combo na gebruik.
actors.buffs.combo$combomove.slam.name=dichtslaan
actors.buffs.combo.action_name=combo-aanval
actors.buffs.combo.bad_target=Je moet een vijand binnen aanvalsbereik als doelwit kiezen.
actors.buffs.combo.combo=%d hit combo!
actors.buffs.combo.desc=De gladiator bouwt momentum op naarmate hij succesvolle klappen uitdeelt. Elke aanval verhoogt de combo-teller met één, maar als er te lang tussen de slagen zit, wordt de combo-teller gereset naar 0. Zolang de gladiator een combo heeft, zal de bescherming die hij heeft door zijn verbroken zegel niet verdwijnen.\n\nHet opbouwen van een combo ontgrendelt speciale combo-aanvallen die niet kunnen missen! Een andere aanval wordt ontgrendeld bij 2, 4, 6, 8 en 10 combo's. Sommige aanvallen resetten de combo en sommige niet, maar elke aanval kan slechts één keer per combo-sessie worden gebruikt.\n\nHuidige combo: %1$d.\n\nAantal beurten tot de combo verloren gaat: %2$s.
actors.buffs.combo.name=combinatie
actors.buffs.combo.prompt=Kies een doelwit om aan te vallen.
actors.buffs.corrosion.desc=Krachtig zuur smelt vlees, metaal en botten in een alarmerend tempo weg.\n\nDe corrosieschade neemt in de loop van de tijd toe, naarmate het doelwit verder wegsmelt.\n\nAantal resterende corrosiebeurten: %1$s.\nHuidige corrosieschade: %2$d.
actors.buffs.corrosion.heromsg=Je smelt!
actors.buffs.corrosion.name=corrosie
actors.buffs.corrosion.ondeath=Je smelt weg...
actors.buffs.corrosion.rankings_desc=Opgelost
actors.buffs.corruption.desc=Corruptie dringt door tot in de essentie van een wezen en verdraait het tot iets dat afwijkt van zijn oorspronkelijke aard. Gecorrupteerde wezens vallen hun bondgenoten aan en negeren hun voormalige vijanden. Corruptie is ook schadelijk en zorgt ervoor dat het doelwit langzaam bezwijkt. Corruptie is permanent; de effecten ervan eindigen pas bij de dood.
actors.buffs.corruption.name=corrupt
actors.buffs.cripple.desc=Je bent er vrij zeker van dat benen niet bedoeld zijn om zo te buigen.\n\nEen kreupelheid halveert de bewegingssnelheid, waardoor het verplaatsen van een tegel meestal twee beurten duurt in plaats van één.\n\nAantal resterende beurten van de kreupelheid: %s.
actors.buffs.cripple.heromsg=Je bent invalide!
actors.buffs.cripple.name=kreupel
actors.buffs.daze.desc=Suizende oren en wazig zicht maken vechten moeilijk.\n\nTijdens een verdoving worden nauwkeurigheid en ontwijking met 50 verminderd, waardoor het veel moeilijker wordt om slagen uit te delen en te ontwijken.\n\nAantal resterende beurten van verdoving: %s.
actors.buffs.daze.heromsg=Je bent verward!
actors.buffs.daze.name=versuft
actors.buffs.degrade.desc=Krachtige duistere magie ondermijnt de kracht die upgrade-rollen aan je uitrusting hebben toegevoegd!\n\nTerwijl je uitrusting is gedegradeerd, wordt deze behandeld alsof deze een lager niveau heeft dan in werkelijkheid het geval is. _Elke upgrade na +3 wordt exponentieel zwakker dan de vorige._ De beschrijvingen van je items zullen veranderen om hun verlaagde krachtniveau weer te geven.\n\nDegradatie heeft geen invloed op krachtvereisten, toverstafladingen, duurzaamheid van werpwapens of artefacten.\n\nAantal resterende beurten van degradatie: %s. Het gebruik van een upgrade- of vloekverwijderingsrol beëindigt de degradatie onmiddellijk.
actors.buffs.degrade.heromsg=Je apparatuur voelt zwakker aan!
actors.buffs.degrade.name=gedegradeerd
actors.buffs.doom.desc=Het is moeilijk om door te gaan als het lijkt alsof het universum je dood wil hebben.\n\nPersonages die gedoemd zijn, ontvangen +67% schade van alle bronnen.\n\nDe ondergang is permanent, de effecten ervan eindigen pas bij de dood.
actors.buffs.doom.name=gedoemd
actors.buffs.dread.desc=Een angst zo groot dat het doelwit de kerker volledig zal ontvluchten!\n\nWezens die door angst worden getroffen, rennen met hoge snelheid weg van hun tegenstander en verdwijnen volledig uit de kerker zodra ze uit het zicht zijn. Vijanden die op deze manier worden verslagen, leveren halve ervaringspunten op en laten geen voorwerpen vallen. De schok van de pijn verkort de duur van de angst.\n\nAantal beurten van angst resterend: %d.
actors.buffs.dread.name=draad
actors.buffs.drowsy.desc=Een magische kracht maakt het moeilijk om wakker te blijven; na een paar beurten zal het doelwit in een diepe magische slaap vallen. De held kan slaperigheid tegengaan door schade op te lopen of door een volle gezondheid te hebben. Beurten tot slaap: 0.
actors.buffs.drowsy.name=slaperig
actors.buffs.earthimbue.desc=Je bent doordrenkt met de kracht van de aarde!\n\nAlle fysieke aanvallen zullen de aarde onder de vijand verschuiven, waardoor deze voor korte tijd verlamd raakt.\n\nAantal beurten aarde-doordrenking resterend: %s.
actors.buffs.earthimbue.name=doordrenkt met aarde
actors.buffs.enhancedrings.desc=Het artefact dat de Schurk onlangs heeft gebruikt, versterkt zijn ringen en geeft ze +1 niveau.\n\nAantal resterende beurten: %s.
actors.buffs.enhancedrings.name=verbeterde ringen
actors.buffs.fireimbue.desc=Je bent doordrenkt met de kracht van vuur!\n\nAlle fysieke aanvallen hebben een kans om vijanden in brand te steken. Bovendien ben je volledig immuun voor de effecten van vuur.\n\nAantal beurten van vuurdoordrenking resterend: %s.
actors.buffs.fireimbue.name=doordrenkt met vuur
actors.buffs.foresight.desc=Je bent op de een of andere manier in staat om de plattegrond van het omliggende terrein met je geest te zien.\n\nTerwijl je onder invloed van vooruitziendheid bent, worden alle tegels in een grote straal aan je onthuld, inclusief eventuele geheime vallen of deuren.\n\nAantal resterende beurten van vooruitziendheid: %s.
actors.buffs.foresight.name=vooruitziendheid
actors.buffs.frost.desc=Niet te verwarren met volledig bevriezen, deze mildere vorm van bevriezing omsluit het doelwit simpelweg met ijs. Bevriezing werkt vergelijkbaar met verlamming, waardoor het doelwit niet meer kan handelen. In tegenstelling tot verlamming wordt bevriezing onmiddellijk opgeheven als het doelwit schade oploopt, omdat het ijs dan verbrijzelt. Resterende beurten van bevriezing: 0
actors.buffs.frost.freezes=%s loopt vast!
actors.buffs.frost.name=bevroren
actors.buffs.frostimbue.desc=Je bent doordrenkt met ijzige kracht!\n\nAlle fysieke aanvallen zullen de vijanden gestaag bevriezen. Bovendien ben je volledig immuun voor de kou.\n\nAantal resterende beurten van vorstbezwering: %s.
actors.buffs.frostimbue.name=doordrenkt met vorst
actors.buffs.fury.desc=Je bent boos, en vijanden zullen je niet aardig vinden als je boos bent. Een grote woede brandt in je, waardoor de schade die je aanricht met fysieke aanvallen met 50 toeneemt. Deze woede duurt zolang je gewond bent en je gezondheid onder de 50 komt.
actors.buffs.fury.heromsg=Je wordt woedend!
actors.buffs.fury.name=woest
actors.buffs.gravitychaostracker.desc_duration=Het is niet duidelijk hoe lang het effect zal aanhouden, maar het kan niet eeuwig duren.
actors.buffs.gravitychaostracker.desc_intro=Om de paar beurten worden alle personages op de huidige verdieping van de kerker in een willekeurige richting gegooid.
actors.buffs.gravitychaostracker.desc_positive=Jij en je bondgenoten lijken echter immuun te zijn.
actors.buffs.gravitychaostracker.name=zwaartekrachtchaos
actors.buffs.greaterhaste.desc=Een ongelooflijke snelheidsboost, even lijkt het alsof alles om je heen stilstaat.\n\nTijdens het effect van verhoogde snelheid duren bewegingsacties helemaal geen tijd, maar andere acties worden nog steeds met normale snelheid uitgevoerd. Elke bewegingsstap verbruikt een beurt van verhoogde snelheid.\n\nAantal resterende beurten van verhoogde snelheid: %d.
actors.buffs.greaterhaste.name=grotere haast
actors.buffs.haste.desc=Energie stroomt door je spieren, waardoor je met ongelooflijke snelheden kunt rennen!\n\nTerwijl je onder invloed van haast bent, ren je met 3x snelheid, maar voer je alle andere acties uit met normale snelheid.\n\nAantal resterende beurten van haast: %s.
actors.buffs.haste.name=haast
actors.buffs.healing.desc=Een magisch middel zorgt ervoor dat wonden sluiten en vlees aan elkaar groeit.\n\nElke beurt regenereert de gezondheid gestaag totdat het genezende effect uitwerkt. De hoeveelheid genezing kan na verloop van tijd afnemen.\n\nVolgende genezing: %d.\n\nResterende genezing: %d.
actors.buffs.healing.name=genezing
actors.buffs.herodisguise.desc=Illusoirische magie heeft je uiterlijk veranderd! Het effect is puur cosmetisch, maar voelt desalniettemin erg vreemd aan.\n\nAantal resterende vermommingen: %s.
actors.buffs.herodisguise.name=vermomming
actors.buffs.hex.desc=Duistere magie die de concentratie ondermijnt, waardoor het doelwit licht gedesoriënteerd raakt.\n\nHet betoveren vermindert de nauwkeurigheid en ontwijking met 20%%, waardoor het doelwit minder effectief is in de strijd.\n\nAantal beurten van de betovering resterend: %s.
actors.buffs.hex.heromsg=Je bent vervloekt!
actors.buffs.hex.name=vervloekt
actors.buffs.holdfast.desc=De krijger behoudt zijn positie, verhoogt zijn pantser met %1$d-%2$d en vertraagt de afname van sommige buffs met %3$d%%. Dit duurt totdat hij zich verplaatst.
actors.buffs.holdfast.name=houd stand
actors.buffs.hunger.cursedhorn=De vervloekte hoorn onttrekt een deel van de energie uit je voeding tijdens het eten.
actors.buffs.hunger.desc=Je honger neemt langzaam toe naarmate je langer in de kerker bent, uiteindelijk zul je verhongeren. Tijdens het verhongeren verlies je langzaam levenspunten in plaats van dat ze herstellen.\n\nRationering is belangrijk! Als je nog levenspunten over hebt, is verhongeren geen slecht idee als dat betekent dat er later meer voedsel beschikbaar is. Effectieve rantsoenering kan ervoor zorgen dat je voedsel veel langer meegaat!
actors.buffs.hunger.desc_intro_hungry=Je voelt je maag wel knorren, maar het is nog niet echt dringend.
actors.buffs.hunger.desc_intro_starving=Je hebt zo'n honger dat het pijn doet.
actors.buffs.hunger.hungry=hongerig
actors.buffs.hunger.ondeath=Je bent van de honger omgekomen...
actors.buffs.hunger.onhungry=Je hebt honger.
actors.buffs.hunger.onstarving=Je hebt vreselijke honger!
actors.buffs.hunger.rankings_desc=Doodgehongerd
actors.buffs.hunger.starving=honger lijden
actors.buffs.invisibility.desc=Je gaat volledig op in het omringende terrein, waardoor je onzichtbaar bent. Terwijl je onzichtbaar bent, kunnen vijanden je niet aanvallen of volgen. Fysieke aanvallen en magische effecten (zoals spreuken en toverstaven) zullen de onzichtbaarheid onmiddellijk opheffen. Aantal beurten onzichtbaarheid resterend: 0.
actors.buffs.invisibility.name=onzichtbaar
actors.buffs.invulnerability.desc=Dit personage is doordrenkt met een grote beschermende kracht, waardoor het gedurende een korte periode onkwetsbaar is!\n\nAantal resterende beurten: %s.
actors.buffs.invulnerability.name=onkwetsbaar
actors.buffs.levitation.desc=Een magische kracht laat je boven de grond zweven, waardoor je je gewichtloos voelt.\n\nZXQPersonages bewegen geruisloos en negeren alle effecten op de grond. Vallen worden niet geactiveerd, water blust geen vuur, planten worden niet vertrapt, wortels missen de grond en je zweeft boven kuilen. Wees voorzichtig, want al deze dingen kunnen in werking treden zodra de levitatie eindigt!\n\nAantal resterende beurten van levitatie: %s.
actors.buffs.levitation.name=levitatie
actors.buffs.lifelink.desc=De levenskracht van dit personage is verbonden met een ander personage in de buurt. Alle opgelopen schade wordt tussen hen gedeeld.\n\nWanneer dit personage schade oploopt, wordt de helft daarvan toegebracht aan het levenskrachtdoelwit.\n\nAantal resterende beurten van de levenskrachtverbinding: %s.
actors.buffs.lifelink.name=levenslink
actors.buffs.lifelink.ondeath=De levensgerelateerde schade heeft je gedood...
actors.buffs.light.desc=Zelfs in de donkerste kerker is een constant licht aan je zijde altijd geruststellend.\n\nLicht helpt de duisternis te verdrijven, waardoor je ondanks de omgeving een redelijke afstand kunt zien.\n\nResterende verlichting: %s.
actors.buffs.light.name=verlicht
actors.buffs.lockedfloor.desc=De huidige verdieping is vergrendeld en je kunt deze niet verlaten!\n\nZolang een verdieping vergrendeld is, krijg je geen honger en lijd je geen schade door verhongering. Bovendien, als je niet werkt aan het verslaan van de baas van deze verdieping, zullen passieve regeneratie-effecten ook stoppen.\n\nAls je bovendien wordt gereanimeerd door een ongezegen ankh terwijl de verdieping vergrendeld is, wordt deze gereset.\n\nVersla de baas van deze verdieping om de vergrendeling te verbreken.
actors.buffs.lockedfloor.name=De vloer is afgesloten.
actors.buffs.lostinventory.desc=Je inventaris is ergens in de kerker kwijtgeraakt! Je kunt de meeste voorwerpen niet oppakken of gebruiken totdat je je inventaris hebt teruggevonden.
actors.buffs.lostinventory.name=verloren voorraad
actors.buffs.magicalsight.desc=Op de een of andere manier kun je met je geest zien in plaats van met je ogen.\n\nZolang magisch zicht actief is, kun je door alle terreinen heen kijken binnen een straal van 12 tegels.\n\nAantal resterende beurten magisch zicht: %s.
actors.buffs.magicalsight.name=magisch gezicht
actors.buffs.magicalsleep.desc=Dit personage is in een diepe magische slaap gevallen waaruit hij of zij niet vanzelf zal ontwaken. Magische slaap is vergelijkbaar met normale slaap, behalve dat alleen schade het doelwit wakker maakt. Voor de held en zijn of haar bondgenoten heeft magische slaap enkele herstellende eigenschappen, waardoor ze snel kunnen genezen tijdens het rusten.
actors.buffs.magicalsleep.fallasleep=Je valt in een diepe, magische slaap.
actors.buffs.magicalsleep.name=magische slaap
actors.buffs.magicalsleep.toohealthy=Je bent kerngezond, weersta de drang om te slapen.
actors.buffs.magicalsleep.wakeup=Je wordt uitgerust en gezond wakker.
actors.buffs.magicimmune.desc=Alle magische effecten hebben geen grip meer op je, je bent er volledig immuun voor.\n\nTerwijl je immuun bent voor magie, zijn alle schadelijke en nuttige magische effecten niet op je van toepassing, inclusief vloeken, betoveringen, toverstaven, spreuken, ringen, artefacten, enz. De vaardigheden van je heldhaftige pantser zijn sterk genoeg om te werken, ongeacht dit effect.\n\nAantal beurten van resterende magische immuniteit: %s.
actors.buffs.magicimmune.name=immuun voor magie
actors.buffs.mindvision.desc=Op de een of andere manier kun je alle wezens op deze verdieping via je geest zien. Het is een vreemd gevoel.\n\nAlle personages op deze verdieping zijn voor jou zichtbaar zolang je geestzicht hebt. Het zien van een wezen via geestzicht telt als gezien worden of in de buurt zijn voor veel magische effecten.\n\nAantal resterende beurten geestzicht: %s.
actors.buffs.mindvision.name=geestesvisie
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum=momentum opbouwen
actors.buffs.momentum.momentum_desc=Terwijl hij beweegt, bouwt de Freerunner momentum op, dat hij kan gebruiken om te freerunnen. Elke momentumlading geeft twee beurten freerunning, en de Freerunner kan tot 10 ladingen opbouwen. Momentum gaat snel verloren wanneer de Freerunner stopt met bewegen. Huidige momentumlading: Huidige momentumlading: Huidige momentumlading: 0
actors.buffs.momentum.resting=herstellen
actors.buffs.momentum.resting_desc=Terwijl hij beweegt, bouwt de Freerunner momentum op, dat hij kan gebruiken om te beginnen met freerunning.\n\nDe Freerunner heeft tijd nodig om zijn uithoudingsvermogen te herstellen voordat hij weer momentum kan opbouwen.\n\nResterende beurten: %d.
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.running_desc=Terwijl hij beweegt, bouwt de Freerunner momentum op, dat hij kan gebruiken om te beginnen met freerunning.\n\nTijdens het freerunning beweegt de Freerunner met dubbele snelheid en krijgt hij bonusontwijking op basis van zijn niveau.\n\nResterende beurten: %d.
actors.buffs.monkenergy$monkability$dash.desc=Een razendsnelle sprint tot wel 4 tegels afstand. Deze vaardigheid kan over obstakels heen gaan, maar niet door vijanden of vast terrein.
actors.buffs.monkenergy$monkability$dash.empower_desc=Een razendsnelle sprint tot wel 8 tegels afstand. Deze vaardigheid kan over obstakels heen gaan, maar niet door vijanden of vast terrein.
actors.buffs.monkenergy$monkability$dash.name=streepje
actors.buffs.monkenergy$monkability$dash.prompt=Kies een locatie
actors.buffs.monkenergy$monkability$dragonkick.desc=Een verwoestende trap die %1$d-%2$d schade toebrengt en pantser negeert. De trap stoot het doelwit weg en verlamt het voor elke tegel die het aflegt.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Een verwoestende trap die _%1$d-%2$d schade_ toebrengt en pantser negeert. De trap stoot _alle aangrenzende doelen_ weg en verlamt ze voor elke tegel die ze afleggen.
actors.buffs.monkenergy$monkability$dragonkick.name=drakentrap
actors.buffs.monkenergy$monkability$flurry.desc=Twee directe aanvallen die %1$d-%2$d schade toebrengen en pantser negeren. Deze vaardigheid kan niet herhaaldelijk worden gebruikt.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Twee directe aanvallen die %1$d-%2$d schade toebrengen, pantser negeren _en de betovering van je wapen gebruiken._ Deze vaardigheid kan niet herhaaldelijk worden gebruikt.
actors.buffs.monkenergy$monkability$flurry.name=een stortvloed aan slagen
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=De monnik is gefocust op haar omgeving en anticipeert op de volgende aanval. Door deze focus kan ze de aanval gegarandeerd afweren.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=gericht
actors.buffs.monkenergy$monkability$focus.desc=De monnik neemt even de tijd om zich te concentreren en de volgende aanval af te weren.
actors.buffs.monkenergy$monkability$focus.empower_desc=De monnik concentreert zich onmiddellijk, waardoor ze de volgende aanval op haar kan afweren.
actors.buffs.monkenergy$monkability$focus.name=focus
actors.buffs.monkenergy$monkability$meditate.desc=De monnik concentreert energie in haar lichaam gedurende 5 beurten. Dit verwijdert de meeste negatieve effecten en geeft haar 8 beurten de tijd om haar toverstaf en artefacten op te laden.
actors.buffs.monkenergy$monkability$meditate.empower_desc=De monnik concentreert energie in haar lichaam gedurende 5 beurten. Dit verwijdert de meeste negatieve effecten en geeft haar 8 beurten om haar toverstaf en artefacten op te laden. _Tijdens het mediteren krijgt ze ook 80% schadebestendigheid en geneest ze langzaam voor 20% van haar ontbrekende HP._
actors.buffs.monkenergy$monkability$meditate.name=mediteren
actors.buffs.monkenergy.action=Monniksvaardigheden
actors.buffs.monkenergy.desc=Naarmate ze vijanden verslaat, verkrijgt de monnik energie die ze kan gebruiken voor verschillende vaardigheden. De meeste vijanden leveren 1 energiepunt op bij hun overwinning, en de monnik verliest geen energie na verloop van tijd.\n\nHuidige energie: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=De monnik heeft zojuist een vaardigheid gebruikt en moet wachten voordat hij een andere kan gebruiken.\n\nHuidige afkoeltijd: %d beurten.
actors.buffs.monkenergy.name=energie
actors.buffs.ooze.desc=Dit kleverige zuur hecht zich aan het vlees en laat het langzaam wegsmelten.\n\nHet slijm zal in de loop van de tijd constante schade toebrengen, maar kan direct met water worden afgewassen.\n\nAantal beurten resterend slijm: %s.
actors.buffs.ooze.heromsg=Bijtende substantie tast je huid aan. Was het weg!
actors.buffs.ooze.name=bijtende smurrie
actors.buffs.ooze.ondeath=Je smelt weg...
actors.buffs.ooze.rankings_desc=Opgelost
actors.buffs.paralysis.desc=Vaak is niets doen het slechtste wat je kunt doen. Verlamming legt alle acties volledig stil, waardoor het doelwit moet wachten tot het effect is uitgewerkt. De pijn van het oplopen van schade kan ervoor zorgen dat personages weerstand bieden tegen verlamming, waardoor ze uit het effect worden bevrijd. Aantal beurten van verlamming resterend: 0.
actors.buffs.paralysis.heromsg=Je bent verlamd!
actors.buffs.paralysis.name=verlamd
actors.buffs.paralysis.out=verzette zich tegen verlamming
actors.buffs.physicalempower.desc=Je slagen zijn versterkt, waardoor je meer schade kunt aanrichten wanneer je vijanden raakt met fysieke aanvallen.\n\nBonusschade: %1$d.\nResterende treffers: %2$d.
actors.buffs.physicalempower.name=fysiek bekrachtigd
actors.buffs.pincushion.desc=De geworpen wapens die je tegen dit personage hebt gebruikt, zitten er momenteel aan vast en vallen op de grond nadat ze verslagen zijn.\n\nDe volgende items zijn momenteel bevestigd:
actors.buffs.pincushion.name=speldenkussen
actors.buffs.poison.desc=Het gif verspreidt zich door het lichaam en verstoort langzaam de interne functies. Het gif brengt elke beurt schade toe, evenredig aan de tijd die het nog duurt voordat het uitwerkt. Aantal beurten met resterend gif: 0.
actors.buffs.poison.heromsg=Je bent vergiftigd!
actors.buffs.poison.name=vergiftigd
actors.buffs.poison.ondeath=Je bent gestorven door vergiftiging...
actors.buffs.poison.rankings_desc=Bezweken aan vergiftiging
actors.buffs.preparation.action_name=voorbereide staking
actors.buffs.preparation.assassinated=vermoord
actors.buffs.preparation.desc=De huurmoordenaar wacht geduldig af, klaar om vanuit de schaduwen toe te slaan.
actors.buffs.preparation.desc_blink=Hij kan met een teleportatiebeweging naar een vijand toe bewegen voordat hij toeslaat, met een maximale afstand van _%d._
actors.buffs.preparation.desc_dmg=Zijn volgende aanval zal _%1$d%% bonusschade_ toebrengen en zal normale vijanden uitschakelen met minder dan _%2$d%% levenspunten_, of bazen met minder dan _%3$d%% levenspunten_.
actors.buffs.preparation.desc_dmg_likely=De aanval zal waarschijnlijk ook meer schade aanrichten.
actors.buffs.preparation.desc_invis_next=Draaien voor een krachtigere aanval: _%d._
actors.buffs.preparation.desc_invis_time=Aantal beurten onzichtbaar doorgebracht: _%d._
actors.buffs.preparation.name=voorbereiding
actors.buffs.preparation.no_target=Er valt daar niets aan te vallen.
actors.buffs.preparation.out_of_reach=Dat doel is onbereikbaar.
actors.buffs.preparation.prompt=Selecteer een doelwit om aan te vallen!\nMaximale knipperafstand: %d
actors.buffs.prismaticguard.desc=Je wordt bewaakt door een prismatisch beeld dat momenteel inactief is. Wanneer er vijanden aanwezig zijn, zal het prismatische beeld in actie komen en je beschermen! \n\nTerwijl het inactief is, zal het prismatische beeld gestaag herstellen van alle opgelopen schade. \n\nHuidige HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Ook dit prismatische beeld profiteert van de Kracht van Velen. Resterende beurten: %d.
actors.buffs.prismaticguard.name=prismatische bewaker
actors.buffs.recharging.desc=Energie stroomt door je heen, waardoor je toverstokken en staf sneller opladen.\n\nElke beurt verhoogt deze buff de huidige lading met een kwart, bovenop de normale oplaadtijd.\n\nAantal resterende oplaadbeurten: %s.
actors.buffs.recharging.name=opladen
actors.buffs.revealedarea.desc=Een gedeelte van de kerker is tijdelijk zichtbaar voor de held. Hij zal het zien, ongeacht waar hij zich bevindt.\n\nResterende beurten: %s.
actors.buffs.revealedarea.name=onthuld gebied
actors.buffs.revealedchar.desc=Dit personage wordt aan de held onthuld. Ze zullen zichtbaar zijn, waar ze zich ook bevinden.\n\nResterende beurten: %s.
actors.buffs.revealedchar.name=onthuld
actors.buffs.roots.desc=Wortels (magisch of natuurlijk) grijpen naar de voeten en dwingen ze naar de grond.\n\nWortels vergrendelen een doelwit, waardoor beweging en de meeste bewegingsvaardigheden onmogelijk worden. Andere acties worden niet beïnvloed, inclusief teleportatie-effecten.\n\nAantal beurten van de wortel resterend: %s.
actors.buffs.roots.heromsg=Je kunt niet bewegen!
actors.buffs.roots.name=geworteld
actors.buffs.scrollempower.desc=De energie van de zojuist door de magiër gelezen perkamentrol versterkt zijn toverstokken!\n\nNiveauverhoging: +%1$d.\nAantal resterende spreuken: %2$d.
actors.buffs.scrollempower.name=scrollen versterken
actors.buffs.shadows.desc=Je versmelt met de schaduwen om je heen, waardoor je onzichtbaar wordt en je stofwisseling vertraagt. Zolang je onzichtbaar bent, kunnen vijanden je niet aanvallen of volgen. De meeste fysieke aanvallen en magische effecten (zoals spreuken en toverstaven) zullen je onzichtbaarheid onmiddellijk opheffen. Bovendien wordt je honger vertraagd zolang je in de schaduwen bent. Je blijft in de schaduwen totdat je de schaduwen verlaat of een vijand je aanraakt.
actors.buffs.shadows.name=schaduw versmolten
actors.buffs.slow.desc=Magie die de tijd vertraagt, beïnvloedt de tijdsbeleving van het doelwit; voor hen beweegt alles supersnel. Een vertraagd personage voert alle acties uit in twee keer de tijd die ze normaal nodig zouden hebben. Aantal resterende beurten van vertraging: 0.
actors.buffs.slow.name=vertraagd
actors.buffs.snipersmark.action_name_snapshot=momentopname
actors.buffs.snipersmark.action_name_sniper=scherpschuttersschot
actors.buffs.snipersmark.action_name_volley=volley
actors.buffs.snipersmark.desc=De Sniper heeft haar vizier gericht op het doelwit dat ze het laatst heeft aangevallen. Ze kan een speciale aanval uitvoeren met haar boog, die varieert afhankelijk van hoe de boog is verbeterd.\n\nEen niet-verbeterde boog vuurt een _snapshot_ af, die minder schade aanricht maar geen tijd kost om af te vuren.\n\nEen boog die is verbeterd voor snelheid vuurt een _salvo_ van drie pijlen af. Elke pijl richt minder schade aan, maar kan nog steeds een betovering activeren. Dit salvo duurt 1 beurt om af te vuren.\n\nEen boog die is verbeterd voor schade vuurt een _sniper shot_ af. Dit schot raakt gegarandeerd het doelwit, richt bonusschade aan op basis van de afstand tot het doelwit en duurt 2 beurten om af te vuren.\n\nResterende beurten: %s.
actors.buffs.snipersmark.name=scherpschuttersmerk
actors.buffs.soulmark.desc=De tovenaar heeft toegang gekregen tot de ziel van dit wezen, waardoor hij het kan genezen terwijl het fysieke schade oploopt.\n\nAantal resterende beurten van zielsmarkering: %s.
actors.buffs.soulmark.name=ziel gemarkeerd
actors.buffs.stamina.desc=Je hebt een oneindig uithoudingsvermogen, waardoor je sneller kunt bewegen!\n\nTerwijl je onder invloed bent van uithoudingsvermogen ren je met +50%% snelheid, maar voer je alle andere acties uit met normale snelheid.\n\nAantal beurten resterend uithoudingsvermogen: %s.
actors.buffs.stamina.name=weerstand
actors.buffs.terror.desc=Terreur is manipulatieve magie die het doelwit in een oncontroleerbare paniek brengt. Verschrikte personages worden gedwongen weg te rennen van hun tegenstander en proberen zoveel mogelijk deuren en muren tussen hen in te plaatsen. De schok van de pijn zal de duur van de terreur echter verkorten. Resterende beurten van terreur: 0
actors.buffs.terror.name=doodsbang
actors.buffs.toxicimbue.desc=Je bent doordrenkt met giftige energie!\n\nTerwijl je beweegt, zal er constant giftig gas uit je opstijgen, dat je vijanden schade toebrengt. Je bent immuun voor giftig gas en gif gedurende de duur van het effect, en ook nog een paar beurten daarna.\n\nAantal beurten resterend van de giftige doordrenking: %s.
actors.buffs.toxicimbue.name=doordrenkt met toxiciteit
actors.buffs.vertigo.desc=Het is lastig om in een rechte lijn te lopen als de hele wereld draait.\n\nTijdens de effecten van duizeligheid zullen personages die proberen te bewegen in een willekeurige richting gaan, in plaats van de richting die ze van plan waren.\n\nAantal resterende beurten van duizeligheid: %s.
actors.buffs.vertigo.name=hoogtevrees
actors.buffs.vulnerable.desc=Kwetsbaarheidsmagie verhoogt alle fysieke schade die een personage oploopt met 33%%, nadat die schade is verminderd door pantser.\n\nAantal beurten van kwetsbaarheid resterend: %s.
actors.buffs.vulnerable.heromsg=Je voelt je kwetsbaar!
actors.buffs.vulnerable.name=kwetsbaar
actors.buffs.wandempower.desc=Je toverstaven die schade toebrengen zijn versterkt, waardoor ze gedurende een paar treffers meer schade aanrichten.\n\nBonusschade: %1$d.\nResterende treffers: %2$d.
actors.buffs.wandempower.name=toverstokken versterkt
actors.buffs.weakness.desc=Alles lijkt ineens veel zwaarder. Verzwakkende magie vermindert de fysieke kracht van een personage, waardoor ze 33%% minder schade toebrengen. Aantal beurten van zwakte resterend: %s.
actors.buffs.weakness.heromsg=Je voelt je verzwakt!
actors.buffs.weakness.name=verzwakt
actors.buffs.wellfed.desc=Je voelt je behoorlijk voldaan en vol.\n\nZolang je goed gevoed bent, zal je honger niet toenemen en zul je na verloop van tijd extra gezondheid herstellen.\n\nResterende beurten: %d.
actors.buffs.wellfed.name=goed gevoed
actors.char.def_verb=ontweken
actors.char.def_verb_blocked=geblokkeerd
actors.char.defeat=Je hebt %s verslagen.
actors.char.immune=immuun
actors.char.invulnerable=onkwetsbaar
actors.char.kill=%s heeft je vermoord...
actors.hero.abilities.armorability.cost=Laadkosten: _%d_
actors.hero.abilities.armorability.no_target=Daar valt niets op aan te vallen!
actors.hero.abilities.armorability.prompt=Kies een locatie om op te richten
actors.hero.abilities.armorability.self_target=Je kunt jezelf niet als doelwit kiezen!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Er straalt energie uit het lichaam van de geestelijke. In deze vorm krijgt de geestelijke 2 aanvalsradius (door de heilige energie die van hem uitstraalt) en 10 schildpunten telkens wanneer hij een heilige tome-lading gebruikt. Hij kan ook de spreuken uitspreken die via de talenten van de verheven vorm worden ontgrendeld. Het schild dat de verheven vorm en de bijbehorende spreuken bieden, zullen niet normaal afnemen, maar zullen onmiddellijk verdwijnen wanneer de verheven vorm eindigt. Huidige schildpunten: 0. Aantal beurten resterend: 1.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=verheven vorm
actors.hero.abilities.cleric.ascendedform.desc=De geestelijke projecteert heilige energie vanuit zichzelf en neemt gedurende 10 beurten een uitgebreide, stralende vorm aan. In deze vorm kan de geestelijke nieuwe spreuken uitspreken, krijgt hij 2 aanvalsradius, 30 schildpunten en elke extra spreuk die hij uitspreekt, geeft 10 schildpunten per gebruikte lading van het heilige boek. De schildpunten van de verheven vorm en de bijbehorende spreuken nemen normaal gesproken niet af, maar verdwijnen onmiddellijk zodra de verheven vorm eindigt. De vaardigheid kan opnieuw worden gebruikt om de duur van de verheven vorm te verlengen.
actors.hero.abilities.cleric.ascendedform.name=verheven vorm
actors.hero.abilities.cleric.ascendedform.short_desc=De geestelijke neemt een _verheven vorm_ aan, waardoor hij nieuwe spreuken, een groter aanvalsbereik en een schild krijgt.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Een kopie van een van de avontuurlijke metgezellen van de geestelijke, gemaakt van massief licht. Hoewel het de vorm heeft van een andere held, beschikt het niet over diens unieke vaardigheden. Deze bondgenoot blijft bestaan zolang de Kracht van Velen op hem is toegepast. Deze bondgenoot kan kosteloos worden bestuurd door de pantservaardigheid Kracht van Velen opnieuw te gebruiken.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Je bondgenoot gaat in de aanval!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Je bondgenoot neemt die positie in.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Je bondgenoot volgt je.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Je kunt dit personage vinden met een specifieke heldenpantservaardigheid.
actors.hero.abilities.cleric.powerofmany$lightally.name=lichte bondgenoot
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Deze bondgenoot is versterkt door Power of Many, waardoor hij/zij +25%% schade toebrengt en -25%% schade ontvangt. Hij/zij deelt ook zijn/haar zichtbereik met de geestelijke en kan profiteren van Power of Many-spreuken.\n\nPower of Many blijft actief wanneer bondgenoten zoals prismatische beelden zich verbergen, maar de duur ervan blijft wel aftellen.\n\nResterende beurten: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=macht van velen
actors.hero.abilities.cleric.powerofmany.ally_exists=Je hebt al een bekwame bondgenoot.
actors.hero.abilities.cleric.powerofmany.desc=De geestelijke kanaliseert de _Kracht van Velen_, die een bestaande bondgenoot versterkt of een nieuwe versterkte bondgenoot creëert voor 100 beurten. Door een lege ruimte te selecteren, wordt een nieuwe bondgenoot gecreëerd. Zolang een bondgenoot versterkt is door de Kracht van Velen, deelt elke bondgenoot +25% schade, ontvangt -25% schade en deelt zijn zicht met de geestelijke. Ze krijgen ook 25 schildpunten wanneer de vaardigheid wordt gebruikt. De geestelijke krijgt bovendien drie nieuwe spreuken die alleen kunnen worden uitgesproken met een versterkte bondgenoot. De Kracht van Velen eindigt niet zolang een van deze spreuken actief is.
actors.hero.abilities.cleric.powerofmany.name=macht van velen
actors.hero.abilities.cleric.powerofmany.no_vision=Je kunt geen locatie selecteren die je niet kunt zien.
actors.hero.abilities.cleric.powerofmany.only_allies=Je kunt alleen bondgenoten sterker maken.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Richt je licht op je bondgenoot.
actors.hero.abilities.cleric.powerofmany.prompt_default=Kies een bondgenoot of locatie
actors.hero.abilities.cleric.powerofmany.short_desc=De geestelijke kanaliseert de _Kracht van Velen_, waarmee hij een bestaande bondgenoot versterkt of een nieuwe creëert.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Toewijzen aan het lichaamsformulier
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Wijs toe aan de mentale vorm
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Wijs toe aan de geestvorm
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Selecteer een effect dat aan Trinity moet worden toegevoegd. Aanvullende informatie wordt weergegeven voordat de bevestiging plaatsvindt.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Body Form: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Geestvorm: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Geestvorm: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Kies welke vorm van Drievuldigheid je wilt gebruiken. De effecten van verschillende vormen kunnen tegelijkertijd actief zijn.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity zal het alchemie-effect op afstand van dit artefact toepassen, ten koste van _%2$s lading._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity zal het passieve gezondheidsregeneratie-effect van dit artefact toepassen met een waarde van _+%1$d_ gedurende 20 beurten, tegen een kostprijs van _%2$s_.
actors.hero.abilities.cleric.trinity.cost=De kosten voor het opladen van deze vaardigheid variëren, maar bedragen meestal _%d._
actors.hero.abilities.cleric.trinity.desc=De geestelijke krijgt een Drievuldigheid aan pantservaardigheden, die aan verschillende itemeffecten kunnen worden toegewezen met behulp van drie nieuwe spreuken. Elk van deze spreuken is gericht op het nabootsen van de effecten van verschillende soorten uitrusting die de geestelijke tijdens deze speelsessie heeft geïdentificeerd: lichaamsvorm (wapens en pantser), geestvorm (toverstokken en werpwapens) en zielsvorm (ringen en artefacten). Elke Drievuldigheidsvorm kan met één effect tegelijk worden doordrenkt, en de geestelijke kiest welke hij wil activeren bij het gebruik van Drievuldigheid. Drievuldigheid zal het effect van iets dat je al hebt uitgerust niet dupliceren.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity zal het effect van dit artefact gebruiken om een verdorven, bevriende geest op te roepen met de HP van een _+%1$d_ geest, tegen de kosten van _%2$s lading._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity zal dit effect gedurende _%1$d beurten_ toepassen tegen een kostprijs van _%2$s lading._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity zal het kettingeffect van dit artefact toepassen met een bereik van _+%1$d_, tegen een kostprijs van _%2$s_.
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity zal het snackeffect van dit artefact toepassen, ten koste van _%2$s lading._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity zal het vijandroofeffect van dit artefact toepassen met een waarde van _+%1$d_, ten koste van _%2$s_ lading.
actors.hero.abilities.cleric.trinity.name=drie-eenheid
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity kan een effect dat je al hebt uitgerust niet dupliceren!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity heeft momenteel geen effecten ingesteld voor welke vorm dan ook; gebruik een van haar spreuken!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity zal dit krachtige effect gedurende %1$d beurten toepassen, ten koste van %2$s lading.
actors.hero.abilities.cleric.trinity.ring_use=Trinity zal het effect van deze ring toepassen met een lading van _+%1$d_ gedurende 20 beurten, ten koste van _%2$s_.
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity zal het worteleffect van dit artefact toepassen met een willekeurige schadelijke zaadwaarde, ten koste van _%2$s lading._
actors.hero.abilities.cleric.trinity.short_desc=De geestelijke krijgt een _Drie-eenheid_ van vaardigheden, die uitrusting nabootsen die hij heeft gezien en die kunnen worden toegewezen door nieuwe spreuken te gebruiken.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity zal het invoegeffect van dit artefact toepassen, ten koste van _%2$s lading._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity zal het scry-effect van dit artefact toepassen op _+%1$d_, tegen een kostprijs van _%2$s_.
actors.hero.abilities.cleric.trinity.thrown_use=Trinity zal dit wapen naar _+%1$d_ gooien, ten koste van _%2$s lading._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity zal het tijdbevriezingseffect van dit artefact toepassen met een duur van _%1$d_ beurten, ten koste van _%2$s lading._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity zal het willekeurige scroll-effect van dit artefact toepassen met een kans van _%1$d/10_ om de exotische versie zonder extra kosten aan te bieden, tegen een kostprijs van _%2$s_.
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity zal deze toverstaf met meerdere ladingen activeren met een energie van +%1$d, wat een energiekost van 1ZXQQ kost.
actors.hero.abilities.cleric.trinity.wand_use=Trinity zal deze toverstaf met een snelheid van _+%1$d_ bestralen, wat een lading van _%2$s_ kost.
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Dit personage neemt deel aan een duel. Zij, en al hun bondgenoten of handlangers, mogen normaal handelen terwijl anderen bevroren zijn. Het duel duurt een bepaalde tijd, totdat een van de deelnemers sterft, of totdat de deelnemers meer dan 5 vakjes van elkaar verwijderd zijn. Resterende beurten: 0
actors.hero.abilities.duelist.challenge$duelparticipant.name=deelnemer aan een duel
actors.hero.abilities.duelist.challenge.ally_target=Je kunt alleen vijanden uitdagen.
actors.hero.abilities.duelist.challenge.already_dueling=Je kunt maar aan één duel tegelijk deelnemen.
actors.hero.abilities.duelist.challenge.desc=De Duelist daagt een nabijgelegen vijand uit tot een duel. Die vijand wordt gedwongen om tegen haar te vechten, terwijl alle andere vijanden tijdelijk in de tijd bevroren zijn. Het doelwit moet bereikbaar zijn en zich binnen 5 tegels van de Duelist bevinden. Het duel duurt tot er 10 beurten verstrijken, de vijand sterft of de Duelist zich op meer dan 5 tegels afstand van de vijand bevindt. Bevroren vijanden zijn onkwetsbaar. De bondgenoten van de Duelist worden niet bevroren door deze vaardigheid, maar als een baas wordt aangevallen, worden zijn handlangers ook niet bevroren.
actors.hero.abilities.duelist.challenge.distant_target=Die vijand is te ver weg om uit te dagen.
actors.hero.abilities.duelist.challenge.name=uitdaging
actors.hero.abilities.duelist.challenge.prompt=Kies een vijand om uit te dagen.
actors.hero.abilities.duelist.challenge.short_desc=De Duelist daagt een nabijgelegen vijand uit tot een duel, waardoor alle andere vijanden tijdelijk worden bevroren.
actors.hero.abilities.duelist.challenge.unreachable_target=Je moet je doel kunnen bereiken.
actors.hero.abilities.duelist.elementalstrike.desc=De Duelist valt een vijand of locatie aan met een reguliere aanval die gegarandeerd raakt en een magisch effect verspreidt dat zich uitstrekt tot 4 tegels in een kegel van 65 graden. Dit magische effect varieert afhankelijk van de betovering op het primaire wapen van de Duelist.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Een elementaire aanval zonder betovering zal een kleine uitbarsting van magie vrijgeven, die 6-12 schade toebrengt aan alle vijanden binnen bereik.
actors.hero.abilities.duelist.elementalstrike.name=elementaire aanval
actors.hero.abilities.duelist.elementalstrike.short_desc=De Duelist voert een _Elementaire Aanval_ uit, waarbij ze een effect verspreidt in een kegelvormig gebied op basis van de betovering op haar wapen.
actors.hero.abilities.duelist.feint.bad_location=Je kunt niet naar die locatie verhuizen.
actors.hero.abilities.duelist.feint.desc=De Duelist simuleert een aanval terwijl ze naar een aangrenzend vakje sprint, waarbij ze een kortstondig nagelbeeld van zichzelf achterlaat. Vijanden die de Duelist aanvielen, zullen in plaats daarvan haar nagelbeeld aanvallen. Vijanden die het nagelbeeld aanvallen raken in de war, waardoor hun volgende actie wordt geannuleerd en ze kwetsbaar worden voor een verrassingsaanval.
actors.hero.abilities.duelist.feint.name=schijnbeweging
actors.hero.abilities.duelist.feint.prompt=Kies een locatie waar je naartoe wilt sprinten.
actors.hero.abilities.duelist.feint.short_desc=De Duelist _Fine_, waarbij ze een aanval simuleert terwijl ze naar een aangrenzend vakje sprint. Vijanden zullen haar schijnbeeld aanvallen, waardoor ze kwetsbaar worden voor een tegenaanval.
actors.hero.abilities.duelist.feint.too_far=Die locatie bevindt zich niet naast u.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=De Jageres krijgt kortstondig extra kracht, waardoor haar bewegingssnelheid en aanvalssnelheid met haar boog toenemen.\n\nAantal resterende beurten: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=de kracht van de natuur
actors.hero.abilities.huntress.naturespower.desc=De Jageres versterkt zichzelf en haar boog tijdelijk met de kracht van de natuur! Dit duurt 8 beurten. Gedurende deze tijd beweegt de Jageres met dubbele snelheid en valt ze 33% sneller aan met haar boog. De bonuseffecten van de boog worden niet geactiveerd als de Schutter haar speciale aanvallen gebruikt.
actors.hero.abilities.huntress.naturespower.name=de kracht van de natuur
actors.hero.abilities.huntress.naturespower.short_desc=De Jageres roept de Kracht van de Natuur aan, waardoor haar bewegingssnelheid en de vuursnelheid van haar boog gedurende korte tijd toenemen.
actors.hero.abilities.huntress.spectralblades.desc=De Jageres werpt een spookachtig zwaard naar een vijand, dat werkt als een aanval op afstand met haar mêleewapen. Alle normale effecten van een mêleewapen worden geactiveerd, inclusief betoveringen.
actors.hero.abilities.huntress.spectralblades.name=spectrale bladen
actors.hero.abilities.huntress.spectralblades.short_desc=De Jageres werpt _Spectrale Klingen_ naar een doelwit, waarbij de schade afhankelijk is van haar momenteel uitgeruste mêlee-wapen.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Een magische havik, opgeroepen door de Jageres. Hij gloeit helder, etherisch blauw en zijn kop beweegt voortdurend heen en weer terwijl hij de omgeving overziet. Hoewel hij geen vechter is, maken zijn snelheid en zicht hem uitstekend geschikt voor verkenning en het afleiden van vijanden.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Resterende gegarandeerde ontwijkingen: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Resterende beurten: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Je havik maakt zich klaar om aan te vallen!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Je havik beweegt zich naar die positie.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Je havik vliegt achter je aan.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Je kunt dit personage vinden met een specifieke heldenpantservaardigheid.
actors.hero.abilities.huntress.spirithawk$hawkally.name=geesthavik
actors.hero.abilities.huntress.spirithawk.desc=De Jageres roept een geesthavik op als vertrouwd dier. Deze havik kan worden bestuurd door de vaardigheid opnieuw te gebruiken terwijl hij is opgeroepen. De havik blijft 100 beurten actief en het besturen ervan kost geen energie. De havik heeft minimale levenspunten en aanvalskracht, maar is snel, ontwijkend en nauwkeurig. Hij deelt zijn volledige gezichtsveld te allen tijde met de Jageres. Hij is immuun voor alle gebiedsgebonden effecten, zoals vuur en giftig gas. Hij zal niet aanvallen tenzij hij specifiek wordt aangestuurd.
actors.hero.abilities.huntress.spirithawk.name=geesthavik
actors.hero.abilities.huntress.spirithawk.no_space=Er is geen vrije parkeerplaats bij u in de buurt.
actors.hero.abilities.huntress.spirithawk.short_desc=De Jageres roept een Geesthavik als metgezel op, die haar kan helpen locaties te verkennen en vijanden af te leiden.
actors.hero.abilities.mage.elementalblast.desc=De magiër stoot een magische straal uit die een cirkelvormig gebied tot 4 tegels breed bestrijkt en 15 tot 25 schade toebrengt. Het specifieke effect van de elementaire straal varieert afhankelijk van de toverstaf die in de staf van de magiër is verwerkt.
actors.hero.abilities.mage.elementalblast.generic_desc=Het effect van de elementaire explosie zal vergelijkbaar zijn met het effect van de toverstaf wanneer deze op een vijand of bondgenoot wordt gericht.
actors.hero.abilities.mage.elementalblast.name=elementaire explosie
actors.hero.abilities.mage.elementalblast.no_staff=Je kunt deze vaardigheid niet gebruiken zonder je personeel.
actors.hero.abilities.mage.elementalblast.short_desc=De magiër stoot een _elementaire explosie_ uit zijn staf, die een groot gebied om hem heen bedekt met een effect dat varieert afhankelijk van het type toverstaf in zijn staf.
actors.hero.abilities.mage.warpbeacon.depths=Je kunt niet zomaar tussen verschillende diepten teleporteren!
actors.hero.abilities.mage.warpbeacon.desc=De magiër plaatst een baken, waarnaar men vervolgens naar believen kan teleporteren. Het plaatsen van het baken duurt 1 beurt, maar het teleporteren ernaartoe is direct. De magiër kan standaard niet tussen verdiepingen teleporteren of het baken gebruiken om ontoegankelijke plaatsen zoals afgesloten kamers te bereiken. De magiër kan wel naar vijanden teleporteren, waardoor ze opzij worden geduwd.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Je kunt daar geen baken plaatsen!
actors.hero.abilities.mage.warpbeacon.locked_floor=Je kunt een afgesloten verdieping niet verlaten!
actors.hero.abilities.mage.warpbeacon.name=warp baken
actors.hero.abilities.mage.warpbeacon.short_desc=De magiër plaatst een teleportatiebaken op zijn huidige locatie, waarnaar hij direct kan terugteleporteren.
actors.hero.abilities.mage.warpbeacon.too_far=Die locatie is te ver weg!
actors.hero.abilities.mage.warpbeacon.window_cancel=annuleren
actors.hero.abilities.mage.warpbeacon.window_clear=helder baken
actors.hero.abilities.mage.warpbeacon.window_desc=Uw baken bevindt zich momenteel op verdieping %d.
actors.hero.abilities.mage.warpbeacon.window_tele=Teleporteer naar baken
actors.hero.abilities.mage.wildmagic.desc=De magiër ontketent de kracht in zijn toverstaven en vuurt ze willekeurig tot wel 4 keer af in één beurt. De staf van de magiër is niet inbegrepen in dit effect. Elke toverstaf krijgt bovendien een niveauverhoging van 2, tot maximaal +3. Deze vaardigheid verbruikt een halve toverstaflading voor elke aanval, en geen enkele toverstaf kan meer dan 2 keer worden afgevuurd.
actors.hero.abilities.mage.wildmagic.name=wilde magie
actors.hero.abilities.mage.wildmagic.no_wands=Je hebt geen toverstokken om mee te bliksemen!
actors.hero.abilities.mage.wildmagic.short_desc=De magiër ontketent de _Wilde Magie_ die in zijn toverstokken besloten ligt en vuurt deze willekeurig meerdere keren af op een gekozen doelwit gedurende één beurt.
actors.hero.abilities.ratmogrify$transmograt.desc=Deze vijand is veranderd in een rat. Een flinke verbetering, als je het mij vraagt! - Rattenkoning
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Gedood door: een ratachtige vijand
actors.hero.abilities.ratmogrify.cant_transform=Dat kun je niet veranderen in een rat!
actors.hero.abilities.ratmogrify.desc=De held verandert een vijand gedurende 6 beurten in een rat! Bazen, bondgenoten en ratten kunnen niet in een rat veranderd worden. Vijanden die in een rat veranderd zijn, behouden hun oorspronkelijke statistieken, maar hebben geen vaardigheden meer.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=De held _Ratmogrificeert_ een vijand! Hierdoor verandert de vijand tijdelijk in een rat zonder enige vaardigheden.
actors.hero.abilities.ratmogrify.too_strong=Die vijand is te sterk om te vermommen als een rat!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Deze vijand is gemarkeerd, waardoor hij 25%% bonus schade oploopt, maar ook niet kan sterven totdat de markering verdwijnt.\n\nResterende beurten: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=bestempeld voor de dood
actors.hero.abilities.rogue.deathmark.ally_target=Je kunt alleen vijanden markeren.
actors.hero.abilities.rogue.deathmark.desc=De Schurk plaatst een markering op een gekozen vijand, waardoor deze 25% extra schade oploopt. De markering wordt direct aangebracht en blijft 5 beurten actief. Gemarkeerde vijanden lopen extra schade op, maar kunnen niet sterven totdat de markering verdwijnt. Als een vijand 0 HP heeft wanneer de markering verdwijnt, zal hij onmiddellijk sterven.
actors.hero.abilities.rogue.deathmark.name=doodsmerk
actors.hero.abilities.rogue.deathmark.short_desc=De Schurk plaatst een _Doodsteken_ op een gekozen vijand. Gemarkeerde vijanden lopen extra schade op, maar kunnen niet sterven totdat het teken verdwijnt.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Een kopie van de Rogue, gemaakt van schimmige duisternis. Hij staat roerloos, met lege ogen en kleine sliertjes duisternis die eruit opstijgen als stoom. De kloon is geen perfecte kopie van de Rogue, maar is desalniettemin een degelijke vechter en kan met de juiste talenten profiteren van de uitrusting van de Rogue.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Je kloon komt in beweging om aan te vallen!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Je kloon verplaatst zich naar die positie.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Je kloon beweegt zich om je te volgen.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Je kunt dit personage vinden met een specifieke heldenpantservaardigheid.
actors.hero.abilities.rogue.shadowclone$shadowally.name=schaduw schurk
actors.hero.abilities.rogue.shadowclone.desc=De Schurk roept een schaduwachtige kopie van zichzelf op, die hij kan aansturen om hem te helpen in de strijd. Het aansturen van de schaduwkloon kost geen energie. De kloon heeft 80 HP, geen pantser en brengt 10-20 schade toe. Al deze eigenschappen kunnen worden verbeterd met talenten, waardoor de kloon profiteert van de wapens en het pantser van de held.
actors.hero.abilities.rogue.shadowclone.name=schaduwkloon
actors.hero.abilities.rogue.shadowclone.short_desc=De Schurk roept een Schaduwkloon op, die hij kan aansturen om hem te helpen in de strijd.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Op de een of andere manier zijn vijanden er gemakkelijk van overtuigd dat deze houten nepfiguur de echte Schurk is!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Je kunt dit personage vinden met een specifieke heldenpantservaardigheid.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=houten lokvogel
actors.hero.abilities.rogue.smokebomb.desc=De Schurk gooit een rookbom en teleporteert tot 6 tegels verder. Hij kan door obstakels en vijanden heen teleporteren, maar niet door vast terrein zoals muren. Vijanden die grenzen aan de oude positie van de Schurk worden 5 beurten lang verblind.
actors.hero.abilities.rogue.smokebomb.fov=Je kunt alleen naar een lege plek in je gezichtsveld springen.
actors.hero.abilities.rogue.smokebomb.name=rookbom
actors.hero.abilities.rogue.smokebomb.prompt=Kies een locatie om naartoe te springen
actors.hero.abilities.rogue.smokebomb.short_desc=De Rogue gooit een rookbom neer terwijl hij wegflitst. Hij verblindt vijanden in de buurt van zijn oude locatie.
actors.hero.abilities.warrior.endure$enduretracker.desc=De krijger deelt nu bonusschade uit op basis van de schade die hij heeft opgelopen.\n\nBonusschade: %1$d\nLast treffers: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=uithoudingsvermogen
actors.hero.abilities.warrior.endure.desc=De krijger houdt het 3 beurten vol en ontvangt de helft van de schade van alle bronnen. Deze vermindering wordt toegepast vóór schadebeperkende effecten zoals pantser. Na het volhouden krijgt de volgende aanval van de krijger binnen 10 beurten bonusschade. Deze bonusschade is gelijk aan de helft van alle schade die hem is toegebracht tijdens het volhouden, vóór eventuele schadebeperkende effecten! Als de krijger een combo heeft, verlengt het gebruik van deze vaardigheid de resterende tijd met 3 beurten.
actors.hero.abilities.warrior.endure.name=volhouden
actors.hero.abilities.warrior.endure.short_desc=De krijger _houdt het vol_, slaat een aantal beurten over maar verkrijgt een hoge schadeweerstand. Vervolgens deelt hij bonusschade uit op basis van wat hij heeft doorstaan.
actors.hero.abilities.warrior.heroicleap.desc=De krijger springt naar een beoogde locatie en gaat daarbij over alle vijanden of obstakels heen. Hij kan echter niet over muren of ander vast terrein springen.
actors.hero.abilities.warrior.heroicleap.name=heldhaftige sprong
actors.hero.abilities.warrior.heroicleap.prompt=Kies de richting waarin je wilt springen.
actors.hero.abilities.warrior.heroicleap.short_desc=De krijger voert een heldhaftige sprong uit naar een beoogde locatie, waarbij hij boven vijanden en gevaren zweeft.
actors.hero.abilities.warrior.shockwave.desc=De krijger slaat met zijn vuist op de grond, waardoor een schokgolf ontstaat die zich tot 5 tegels ver uitstrekt in een kegel van 60 graden. Vijanden die door deze schokgolf worden geraakt, zijn 5 beurten lang verzwakt. Ze lopen ook 5-10 schade op, plus 1-2 extra schade voor elk punt kracht dat de krijger boven de 10 heeft.
actors.hero.abilities.warrior.shockwave.name=schokgolf
actors.hero.abilities.warrior.shockwave.short_desc=De krijger laat een schokgolf los in een kegelvormig gebied door op de grond te slaan. Vijanden die door de schokgolf worden geraakt, raken beschadigd en worden verlamd.
actors.hero.hero.key_distracted=Je krijgt het slot niet helemaal open, je zult het moeten blijven proberen.
actors.hero.hero.leave=Je kunt nog niet weg, de rest van de kerker wacht beneden!
actors.hero.hero.level_cap=Je kunt niet sterker worden, maar je ervaringen geven je wel een enorme boost!
actors.hero.hero.level_up=Ga een niveau omhoog!
actors.hero.hero.locked_chest=Deze kist is op slot en u heeft geen bijbehorende sleutel.
actors.hero.hero.locked_door=Je hebt geen bijbehorende sleutel.
actors.hero.hero.name=Jij
actors.hero.hero.new_level=Ga een level omhoog! +Nauwkeurigheid, +Ontwijking, +5 HP!
actors.hero.hero.new_talent=+1 Talentpunt!
actors.hero.hero.noticed_smth=Je hebt iets opgemerkt.
actors.hero.hero.pain_resist=De pijn helpt je de drang om te slapen te weerstaan.
actors.hero.hero.revive=De ankh barst los met levensgevende energie!
actors.hero.hero.search=zoekopdracht
actors.hero.hero.search_distracted=Het is moeilijk om me te concentreren, zoeken is uitputtend.
actors.hero.hero.unspent=Je hebt nog ongebruikte talentpunten!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Je kunt niet meenemen: %s.
actors.hero.hero.you_now_have=Je hebt het volgende ontvangen: %s.
actors.hero.heroclass.cleric=geestelijke
actors.hero.heroclass.cleric_desc=De geestelijke begint met een uniek heilig boek, waarmee hij of zij verschillende spreuken kan uitspreken. De meeste talenten van de geestelijke zijn gericht op het leren of verbeteren van spreuken. De geestelijke begint ook met een knuppel, stoffen harnas, een waterzak en een fluwelen buidel. De geestelijke identificeert automatisch: - Identificatierollen - Zuiveringsdrankjes
actors.hero.heroclass.cleric_desc_short=De geestelijke is een goddelijke tovenaar die zijn unieke heilige boek gebruikt om goddelijke magie te kanaliseren. Hij kan spreuken leren en verbeteren via talenten.
actors.hero.heroclass.cleric_unlock=Om de geestelijke te ontgrendelen, moet je de vloek op alle vervloekte uitrustingsstukken volledig verwijderen.
actors.hero.heroclass.duelist=duelist
actors.hero.heroclass.duelist_desc=De Duelist begint met een _unieke rapier_ met een speciale vaardigheid die na verloop van tijd oplaadt. Elk wapen in het spel heeft een _andere speciale vaardigheid_ die de Duelist kan gebruiken. De Duelist begint ook met _twee werpspikes_, stoffen harnas, een waterzak en een fluwelen buidel. De Duelist identificeert automatisch: - Rollen van Identificatie - Rollen van Kracht - Rollen van Spiegelbeeld
actors.hero.heroclass.duelist_desc_short=De Duelist is een wapenmeester die haar wapen kan gebruiken om een speciale wapenvaardigheid te activeren. Deze speciale vaardigheid verschilt per wapen.
actors.hero.heroclass.duelist_unlock=Om de Duelist te ontgrendelen, moet je een wapen van niveau 2 of hoger uitrusten zonder krachtstraf.
actors.hero.heroclass.huntress=jachtvrouw
actors.hero.heroclass.huntress_desc=De Jageres begint met een unieke geestboog, waarmee ze een oneindig aantal opgeroepen pijlen kan afvuren. De Jageres kan door hoog gras lopen zonder het te vertrappen. De Jageres begint ook met handschoenen met noppen, stoffen harnas, een waterzak en een fluwelen buidel. De Jageres identificeert automatisch: - Identificatierollen - Drankjes van Geestzicht - Drankjes van Slaapliedje
actors.hero.heroclass.huntress_desc_short=De Jageres is een meester in het werpen van wapens en heeft een magische boog met oneindig veel pijlen. Ze beweegt zich ook door hoog gras zonder het te vertrappen.
actors.hero.heroclass.huntress_unlock=Om de Huntress vrij te spelen, moet je vijanden 10 keer raken met werpwapens in één spel.
actors.hero.heroclass.mage=magiër
actors.hero.heroclass.mage_desc=De magiër begint met een unieke staf, die aanzienlijk sneller oplaadt dan een toverstaf en 1 lading meer heeft. De staf kan worden doordrenkt met elke toverstaf die de magiër in de kerker vindt. De magiër begint ook met een toverstaf van magische projectielen, een stoffen harnas, een waterzak en een fluwelen buidel. De magiër identificeert automatisch: - Identificatierollen - Drankjes van vloeibare vlam - Drankjes van vloeibare vlam - Upgraderollen
actors.hero.heroclass.mage_desc_short=De magiër is een expert in de occulte kunsten en draagt een magische staf die sterker is dan een toverstaf. De staf kan worden doordrenkt met elke toverstaf die de magiër vindt.
actors.hero.heroclass.mage_unlock=Om de magiër te ontgrendelen, gebruik je een upgrade-rol om een voorwerp sterker te maken.
actors.hero.heroclass.rogue=schurk
actors.hero.heroclass.rogue_desc=De Schurk begint met een unieke Schaduwmantel, waarmee hij naar believen onzichtbaar kan worden. De Schurk kan geheimen en vallen van grotere afstand detecteren. De Schurk begint ook met een dolk, drie werpmessen, stoffen harnas, een waterzak en een fluwelen buidel. De Schurk identificeert automatisch: - Identificatierollen - Onzichtbaarheidsdrankjes - Magische Kaartrollen
actors.hero.heroclass.rogue_desc_short=De Schurk kan vijanden ontwijken en vanuit onzichtbaarheid toeslaan met behulp van zijn schaduwmantel. Hij kan bovendien geheimen en vallen van grotere afstand opsporen.
actors.hero.heroclass.rogue_unlock=Om de Rogue te ontgrendelen, moet je 10 verrassingsaanvallen uitvoeren in één spel.
actors.hero.heroclass.warrior=strijder
actors.hero.heroclass.warrior_desc=De krijger begint met een uniek gebroken zegel dat hem een tijdelijke bescherming geeft wanneer zijn gezondheid onder de helft is. Het zegel kan tussen pantsers worden verplaatst en kan één upgrade overdragen. De krijger begint ook met een versleten kortzwaard, drie werpstenen, een stoffen pantser, een waterzak en een fluwelen buidel. De krijger identificeert automatisch: - Identificatierollen - Genezingsdrankjes - Woederollen
actors.hero.heroclass.warrior_desc_short=De krijger kan extra schade incasseren dankzij het schild dat hij krijgt door zijn _gebroken zegel_. Het zegel kan tussen pantsers worden verplaatst en _draagt één upgrade over._
actors.hero.heroclass.warrior_unlock=De krijger wordt automatisch ontgrendeld.
actors.hero.herosubclass.assassin=moordenaar
actors.hero.herosubclass.assassin_desc=De huurmoordenaar bereidt zijn volgende aanval voor wanneer hij onzichtbaar wordt. Hoe langer hij zich voorbereidt, hoe krachtiger zijn volgende aanval zal zijn. De voorbereiding duurt maximaal 9 beurten. Na de voorbereiding brengt de huurmoordenaar extra schade toe met zijn volgende aanval, kan hij naar zijn doelwit teleporteren en kan hij zelfs zwakke vijanden direct doden.
actors.hero.herosubclass.assassin_short_desc=De _Assassin_ kan een dodelijke aanval voorbereiden terwijl hij onzichtbaar is. Hoe langer hij wacht, hoe krachtiger de aanval zal zijn.
actors.hero.herosubclass.battlemage=strijdmagiër
actors.hero.herosubclass.battlemage_desc=De Strijdmagiër krijgt een bonuseffect telkens wanneer hij in de mêlee toeslaat met zijn staf, alsof zijn staf een extra betovering heeft. Deze effecten zijn afhankelijk van de toverstaf waarmee zijn staf is doordrenkt; elke toverstaf heeft zijn eigen effect. Naast de toverstafeffecten krijgt de staf van de Strijdmagiër ook 0,5 ladingen wanneer hij ermee toeslaat.
actors.hero.herosubclass.battlemage_short_desc=De _Battlemage_ activeert bonuseffecten tijdens gevechten van dichtbij met zijn staf. Deze effecten zijn afhankelijk van de toverstaf waarmee zijn staf is doordrenkt.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=De Berserker bouwt woede op naarmate hij fysieke schade oploopt, inclusief schade die door zijn pantser wordt geblokkeerd! Woede neemt geleidelijk af, maar langzamer als hij weinig HP heeft. Woede kan ervoor zorgen dat de Berserker tot wel 50% meer schade aanricht. Bij maximale woede kan hij in een berserk-toestand raken, waardoor hij een tijdelijke beschermingsboost krijgt en zijn woede behoudt zolang hij nog bescherming heeft. De bescherming schaalt mee met het niveau van het berserkerpantser en kan enorm worden versterkt als hij weinig HP heeft. De Berserker heeft tijd nodig om te herstellen nadat hij in een berserk-toestand is geraakt.
actors.hero.herosubclass.berserker_short_desc=De Berserker bouwt woede op naarmate hij schade oploopt. Woede verhoogt zijn schade en kan bij 100% geactiveerd worden voor extra schildkracht.
actors.hero.herosubclass.champion=kampioen
actors.hero.herosubclass.champion_desc=De Kampioen is een meester in mêlee-wapens en kan naast haar primaire wapen ook een secundair wapen uitrusten. Haar normale aanvallen gebruiken haar primaire wapen, maar ze kan haar primaire wapen direct wisselen en de vaardigheid van een van beide wapens gebruiken. Ze krijgt ook 2 extra maximale wapenvaardigheidsladingen en +50% snellere herlaadtijd van haar wapenvaardigheid.
actors.hero.herosubclass.champion_short_desc=De _Champion_ kan twee wapens hanteren en krijgt meer wapenladingen. Haar normale aanvallen gebruiken haar primaire wapen, maar ze kan van wapen wisselen en de speciale vaardigheid van beide wapens gebruiken.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_desc=Terwijl de Freerunner beweegt, bouwt hij momentum op. Hij kan tot 10 momentumpunten verzamelen na 10 beurten rennen, maar verliest dit snel als hij stopt met bewegen. De Freerunner kan zijn momentum gebruiken om te freerunnen, gedurende 2 beurten per momentumpunt. Tijdens het freerunnen beweegt de Freerunner met dubbele snelheid en krijgt hij bonusontwijking in verhouding tot zijn niveau. Zodra het freerunnen eindigt, is er een afkoelperiode voordat er opnieuw momentum kan worden opgebouwd.
actors.hero.herosubclass.freerunner_short_desc=De _Freerunner_ bouwt momentum op tijdens het rennen, wat gebruikt kan worden om te freerunnen. Dit geeft hem tijdelijk bonussnelheid en ontwijkingsvermogen.
actors.hero.herosubclass.gladiator=gladiator
actors.hero.herosubclass.gladiator_desc=De Gladiator bouwt één combo-punt op telkens wanneer hij een succesvolle aanval uitvoert met een mêlee- of werpwapen. Als de Gladiator binnen 5 beurten (15 beurten na een kill) geen succesvolle aanval uitvoert, wordt zijn combo gereset. Terwijl hij combo opbouwt, kan de Gladiator verschillende vaardigheden gebruiken die gegarandeerd raak zijn: Combo: stoot vijand achteruit, behoudt combo. Combo: 4: richt schade aan op basis van pantser. Combo: pareer, behoudt combo. Combo: 8: beschadig doelwit en nabijgelegen vijanden. Combo: 10: val één keer aan voor elke combo.
actors.hero.herosubclass.gladiator_short_desc=De _Gladiator_ bouwt combo's op wanneer hij succesvolle aanvallen uitvoert. Hij kan combo's gebruiken om unieke vaardigheden in te zetten.
actors.hero.herosubclass.monk=monnik
actors.hero.herosubclass.monk_desc=De Monnik is een meester in fysieke technieken. Door vijanden te verslaan, verkrijgt ze energie die ze kan gebruiken voor diverse verdedigende en ondersteunende vaardigheden. Deze energie neemt niet af na verloop van tijd, maar heeft een maximum dat afhankelijk is van het niveau van de Monnik.\n\n1 Energie: snel slaan met de vuisten\n2 Energie: focussen om de volgende aanval te ontwijken\n3 Energie: direct sprinten naar een nabijgelegen locatie\n4 Energie: een vijand wegschoppen\n5 Energie: mediteren om statusproblemen op te heffen en de lading van toverstaf en artefacten te herstellen
actors.hero.herosubclass.monk_short_desc=De monnik bouwt energie op tijdens gevechten. Deze energie kan worden gebruikt voor diverse unieke vaardigheden.
actors.hero.herosubclass.paladin=paladijn
actors.hero.herosubclass.paladin_desc=De Paladijn krijgt een verscheidenheid aan nieuwe en verbeterde spreuken die de nadruk leggen op gevechten van dichtbij en synergie met wapens en bepantsering. De spreuken _Heilig Wapen_ en _Heilige Bescherming_ van de Paladijn geven grotere bonussen, overschrijven niet langer bestaande betoveringen en glyphs, en kunnen worden uitgebreid door andere spreuken uit te spreken. De Paladijn krijgt ook de spreuk _Slag_, waarmee hij een gegarandeerde aanval van dichtbij kan uitvoeren met bonus schade en betoveringskracht.
actors.hero.herosubclass.paladin_short_desc=De Paladin krijgt nieuwe spreuken voor de korte afstand en verbeterde versies van heilige wapens en beschermingsspreuken.
actors.hero.herosubclass.priest=priester
actors.hero.herosubclass.priest_desc=De Priester krijgt een verscheidenheid aan nieuwe en verbeterde spreuken die de nadruk leggen op gevechten op afstand en synergie met magische voorwerpen. De Priester kan _Guiding Light_ eens per 50 beurten gratis gebruiken, waardoor vijanden die direct door een van zijn spreuken worden geraakt, worden verlicht. De Priester kan de verlichtingsdebuff samen met bondgenoten, toverstaven en sommige artefacten gebruiken voor bonusschade gelijk aan zijn niveau + 5. De Priester krijgt ook de spreuk _Radiance_, die duisternis verdrijft en alle zichtbare vijanden beïnvloedt, waardoor verlichting wordt geactiveerd en toegepast en ze kortstondig worden verdoofd, tegen een kostprijs van 2 ladingen.
actors.hero.herosubclass.priest_short_desc=De _Priester_ krijgt nieuwe spreuken met een groot bereik en een verbeterde versie van het leidend licht.
actors.hero.herosubclass.sniper=sluipschutter
actors.hero.herosubclass.sniper_desc=De Sniper is een meester in gevechten op afstand, waarbij haar aanvallen het pantser van de vijand doorboren. Wanneer ze een vijand aanvalt met een werpwapen, plaatst ze een sniper-markering op hem, waardoor ze een vervolgaanval met haar boog kan uitvoeren. Deze speciale aanval varieert afhankelijk van hoe haar boog is verbeterd. Een niet-verbeterde boog vuurt een snelle aanval af die minder schade aanricht, maar direct vuurt. Een snelle boog vuurt een salvo van drie pijlen af die minder schade aanrichten, nog steeds betoveringen kunnen activeren en 1 beurt nodig hebben om af te vuren. Een boog die schade aanricht, vuurt een sniper-schot af dat gegarandeerd raakt, bonusschade aanricht op basis van afstand en 2 beurten nodig heeft om af te vuren.
actors.hero.herosubclass.sniper_short_desc=De _Sniper_ kan met haar afstandsaanvallen pantser doorboren. Na een aanval met een werpwapen kan ze een vervolgaanval uitvoeren met haar boog.
actors.hero.herosubclass.warden=bewaker
actors.hero.herosubclass.warden_desc=De Warden heeft een sterke band met de natuur, wat haar diverse bonuseffecten met betrekking tot gras en planten oplevert. Ze kan dwars door hoog en gegroefd gras heen kijken alsof het lege ruimte is. De Warden zorgt ervoor dat er gras opkomt rondom elk zaadje dat ze strooit of plant, en krijgt speciale effecten wanneer ze op planten trapt. Deze speciale effecten vervangen de normale planteffecten, wat betekent dat geen enkele plant schadelijk voor haar is om op te trappen.
actors.hero.herosubclass.warden_short_desc=De _Warden_ kan door hoog gras heen kijken en krijgt bonuseffecten wanneer ze zaadjes plant en planten vertrapt.
actors.hero.herosubclass.warlock=tovenaar
actors.hero.herosubclass.warlock_desc=De Warlock heeft een kans om een zielsmerk op personages aan te brengen wanneer hij toverstokken op hen gebruikt. De kans om een zielsmerk aan te brengen en de duur ervan nemen toe met het toverstokniveau. Wanneer een vijand een zielsmerk heeft, geneest de Warlock 2 hp voor elke 5 schade die hij aanricht, maar alleen met aanvallen van mêlee- of werpwapens, niet met toverstokken!
actors.hero.herosubclass.warlock_short_desc=De _Warlock_ heeft een kans om vijanden met zijn toverstaf te markeren. Hij geneest zichzelf telkens wanneer hij fysieke schade toebrengt aan gemarkeerde vijanden.
actors.hero.spells.auraofprotection$aurabuff.desc=De Paladijn straalt beschermende energie om zich heen uit.\n\nElke nabijgelegen bondgenoot (inclusief de Paladijn zelf) loopt minder schade op en krijgt het effect van de pantserglyph van de Paladijn met verhoogde kracht.\n\nResterende beurten: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura van bescherming
actors.hero.spells.auraofprotection.desc=De Paladijn begint beschermende energie uit te stralen in een sprankelende aura om zich heen gedurende 20 beurten. Elke bondgenoot binnen 2 tegels van de Paladijn (inclusief de Paladijn zelf) ontvangt %1$d%% minder schade en krijgt het effect van de pantserglyph van de Paladijn met +%2$d%% kracht.\n\nDeze schadevermindering vindt plaats vóór andere schadeverminderende effecten (bijv. pantser). De krachtversterking van de glyph is altijd van toepassing, maar deze spreuk kan er niet voor zorgen dat de glyph van de Paladijn meer dan eens van toepassing is als een personage er al van profiteert (bijv. de Paladijn zelf, of een prismatisch beeld).
actors.hero.spells.auraofprotection.name=aura van bescherming
actors.hero.spells.auraofprotection.short_desc=Verhoogt de verdediging van de Paladijn en nabije bondgenoten.
actors.hero.spells.beamingray$beamingrayboost.desc=Deze bondgenoot is onlangs geteleporteerd door Beaming Ray, waardoor hij bonus schade toebrengt aan de dichtstbijzijnde vijand na de teleportatie. Power of Many zal ook niet verlopen wanneer deze buff actief is.\n\nAantal beurten resterend: %s.
actors.hero.spells.beamingray$beamingrayboost.name=stralende straal
actors.hero.spells.beamingray.desc=De geestelijke kanaliseert de kracht van zijn bondgenoot in een lichtstraal die hem naar een locatie teleporteert. Als de straal een vijand raakt, plaatst hij de bondgenoot in de buurt en richt hem naar de vijand. De straal heeft een maximaal bereik van 0 tegels en verhoogt de bonussschade van Kracht van Velen tot +1 tegel gedurende 10 beurten tegen de dichtstbijzijnde vijand binnen 4 tegels. De stralende straal kan zelfs normaal immobiele bondgenoten teleporteren, maar in dat geval wordt het bereik gehalveerd.
actors.hero.spells.beamingray.name=stralende straal
actors.hero.spells.beamingray.no_space=Er is geen ruimte voor je bondgenoot om daar te verschijnen.
actors.hero.spells.beamingray.out_of_range=Die locatie ligt buiten bereik.
actors.hero.spells.beamingray.short_desc=Teleporteert je bondgenoot en geeft bonus schade.
actors.hero.spells.blessspell.desc=De geestelijke plaatst een heilige zegen op zichzelf of een ander personage dat hij kan zien. Wanneer de spreuk op zichzelf wordt toegepast, is het effect zwakker en geeft het %1$d beurten zegen en %2$d barrière. Wanneer de spreuk op andere personages wordt toegepast, is deze krachtiger en geeft het %3$d beurten zegen en %4$d genezing. Overtollige genezing wordt omgezet in een barrière.
actors.hero.spells.blessspell.name=zegenen
actors.hero.spells.blessspell.short_desc=De geestelijke zegent en beschermt hem, en geneest anderen.
actors.hero.spells.bodyform$bodyformbuff.desc=Trinity's lichaamsvorm geeft je momenteel de kracht van een betovering of glyph, alsof je deze op je huidige wapen of pantser hebt uitgerust.\n\nLet op: de lichaamsvorm kan geen tweede kopie geven van een effect waar je al van profiteert.\n\nHuidig effect: %1$s.\n\nResterende beurten: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=lichaamsvorm
actors.hero.spells.bodyform.desc=De geestelijke kiest een betovering of glyph die hij/zij deze run heeft geïdentificeerd en doordrenkt Trinity met het effect ervan. Wanneer Trinity wordt gebruikt, krijgt de geestelijke het effect van de gekozen betovering of glyph gedurende %d beurten. Deze tijdelijke betovering of glyph werkt met elk effect dat een normale betovering of glyph ook zou werken. Deze spreuk vervangt elk ander lichaamseffect waarmee Trinity momenteel is doordrenkt.
actors.hero.spells.bodyform.name=lichaamsvorm
actors.hero.spells.bodyform.short_desc=Wijs Trinity toe aan een betovering of glyph.
actors.hero.spells.cleanse.desc=De geestelijke verwijdert alle schadelijke status-effecten bij zichzelf en zichtbare bondgenoten. Na afloop van de spreuk krijgen alle getroffen personages ook %1$d beurten immuniteit tegen debuffs en een %2$d schild.
actors.hero.spells.cleanse.name=reinigen
actors.hero.spells.cleanse.short_desc=Verwijdert negatieve effecten en biedt bescherming.
actors.hero.spells.clericspell.charge_cost=Oplaadkosten: %d
actors.hero.spells.clericspell.invalid_enemy=Je kunt die vijand niet als doelwit kiezen.
actors.hero.spells.clericspell.invalid_target=Je kunt die locatie niet selecteren.
actors.hero.spells.clericspell.no_target=Er is daar geen doelwit.
actors.hero.spells.clericspell.prompt=Kies een doelwit
actors.hero.spells.divineintervention.desc=De geestelijke giet een enorme hoeveelheid kracht uit zijn of haar tome in zichzelf en bondgenoten, waardoor iedereen een schild van %1$d krijgt en de Verheven Vorm met %2$d beurten wordt verlengd. De ongelooflijke verdedigingskracht van deze spreuk wordt afgewogen tegen de zeer hoge kosten. Net als andere schilden die door de Verheven Vorm worden verleend, neemt dit schild niet normaal af, maar vervalt het onmiddellijk wanneer de Verheven Vorm eindigt.
actors.hero.spells.divineintervention.name=goddelijke interventie
actors.hero.spells.divineintervention.short_desc=Enorme schildversterking voor de geestelijke en zijn bondgenoten.
actors.hero.spells.divinesense$divinesensetracker.desc=Dit personage kan tijdelijk andere wezens in de buurt met zijn/haar gedachten zien!\n\nResterende beurten: %s.
actors.hero.spells.divinesense$divinesensetracker.name=goddelijk gevoel
actors.hero.spells.divinesense.desc=De geestelijke concentreert zich op zijn omgeving en verkrijgt een soort geestelijk zicht met een bereik van %d tegels gedurende 50 beurten. Deze spreuk kan direct worden uitgesproken.
actors.hero.spells.divinesense.name=goddelijk gevoel
actors.hero.spells.divinesense.short_desc=Verkrijg tijdelijk mentaal zicht op een breed gebied.
actors.hero.spells.flash.desc=De geestelijke kanaliseert zijn verheven vorm op een nabijgelegen locatie en teleporteert daarheen. Flash kan de geestelijke teleporteren naar elke ontdekte locatie die binnen bereik en onbezet is. Deze spreuk kost meer toverboekladingen elke keer dat hij in dezelfde verheven vorm wordt gebruikt.
actors.hero.spells.flash.name=flash
actors.hero.spells.flash.prompt=Kies een locatie
actors.hero.spells.flash.short_desc=Teleporteer naar een nabijgelegen locatie.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=De priester kan Guiding Light na 50 beurten weer gratis gebruiken.\n\nAantal resterende beurten: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Leidend Licht
actors.hero.spells.guidinglight$illuminated.desc=Dit personage gloeit doordat het geraakt is door een leidend licht. Hoewel de gloed niet sterk genoeg is om de omgeving te verlichten, zal het magische effect het voor de geestelijke veel gemakkelijker maken om hem te raken.
actors.hero.spells.guidinglight$illuminated.desc_generic=Andere helden kunnen nog steeds 'Illuminated' gebruiken om te profiteren van het talent 'Searing Light', maar zullen geen extra nauwkeurigheid verkrijgen.
actors.hero.spells.guidinglight$illuminated.desc_priest=De priester kan bovendien verlichte energie, een toverstafaanval, een aanval van een bondgenoot of effecten van bepaalde artefacten absorberen. Het gebruik van verlichte energie op deze manier levert extra magische schade op gelijk aan het niveau van de priester + 5.
actors.hero.spells.guidinglight$illuminated.name=verlicht
actors.hero.spells.guidinglight.desc=De geestelijke vuurt een straal magische energie af die een doelwit raakt, 2-8 schade toebrengt en het doelwit verlicht. De volgende fysieke aanval die zonder belemmeringen op een verlichte vijand wordt uitgevoerd, zal deze gegarandeerd raken.
actors.hero.spells.guidinglight.desc_priest=_Deze spreuk is krachtiger wanneer hij door de Priester wordt uitgesproken._ De eerste keer dat de spreuk elke 50 beurten wordt uitgesproken, kost geen toverboekkosten, en verlichting wordt verbruikt door straling, toverstaven, andere personages en artefacten die vijanden direct beïnvloeden. Wanneer verlichting op deze manier wordt gebruikt, richt het bonusmagische schade aan gelijk aan het niveau van de Priester + 5.
actors.hero.spells.guidinglight.name=Leidend Licht
actors.hero.spells.guidinglight.short_desc=Deelde magische schade uit op afstand en garandeerde een treffer.
actors.hero.spells.hallowedground$hallowedterrain.desc=De grond is hier geheiligd. Geheiligde grond vertraagt vijanden, geneest bondgenoten en zorgt ervoor dat gras groeit.
actors.hero.spells.hallowedground.desc=De priester concentreert zijn goddelijke magie in de nabijgelegen grond, waardoor een gebied van gewijd terrein ontstaat dat 20 beurten lang bestaat. Wanneer deze spreuk wordt uitgesproken, geneest hij alle bondgenoten met 15 HP (gezonde bondgenoten en de priester krijgen een schild), wortelt hij vijanden kortstondig en laat hij kort gras groeien. Het gewijde terrein geneest bondgenoten met 1 HP per beurt (gezonde bondgenoten en de priester krijgen een schild), verzwakt vijanden en zorgt er willekeurig voor dat er hoog gras groeit. Gewijd terrein wordt vernietigd door vuur en produceert geploegd gras als passieve regeneratie-effecten zijn uitgeschakeld of als de priester al een tijdje geen ervaringspunten heeft verdiend.
actors.hero.spells.hallowedground.name=heilige grond
actors.hero.spells.hallowedground.prompt=Kies een locatie
actors.hero.spells.hallowedground.short_desc=Geneest bondgenoten, vertraagt vijanden en verspreidt gras in een gebied.
actors.hero.spells.holyintuition.cursed=Je voelt dat er kwaadaardige magie in dit voorwerp schuilt.
actors.hero.spells.holyintuition.desc=De geestelijke richt zijn zintuigen op een voorwerp en bepaalt of het vervloekt is of niet, zonder het te hoeven dragen.
actors.hero.spells.holyintuition.name=heilige intuïtie
actors.hero.spells.holyintuition.prompt=kies een item
actors.hero.spells.holyintuition.short_desc=Geeft aan of een voorwerp vervloekt is of niet.
actors.hero.spells.holyintuition.uncursed=Dit voorwerp is vrij van kwaadaardige magie.
actors.hero.spells.holylance$lancecooldown.desc=De priester heeft zojuist Heilige Lans gebruikt en moet wachten voordat hij deze opnieuw kan gebruiken.\n\nAantal resterende beurten: %s.
actors.hero.spells.holylance$lancecooldown.name=heilige lans afkoeltijd
actors.hero.spells.holylance.desc=De priester concentreert een grote hoeveelheid energie in een verwoestende, geworpen lans van licht. Deze lans richt %1$d-%2$d schade aan en brengt altijd maximale schade toe aan ondoden en demonische doelen.\n\nDeze spreuk is erg duur en heeft een afkoeltijd van 30 beurten.
actors.hero.spells.holylance.name=heilige lans
actors.hero.spells.holylance.short_desc=Richt aanzienlijke magische schade aan op afstand.
actors.hero.spells.holyward$holyarmbuff.desc=De geestelijke heeft zijn versleten pantser doordrenkt met heilige energie, waardoor alle bestaande glyphs tijdelijk worden overschreven en het pantser 1 punt extra schade blokkeert.\n\nResterende beurten: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=De Paladijn heeft zijn versleten pantser doordrenkt met heilige energie, waardoor het pantser 3 extra schadepunten blokkeert.\n\nHet uitspreken van andere spreuken terwijl heilige bescherming actief is, verlengt de duur ervan met 10 beurten per verbruikte lading.\n\nResterende beurten: %s.
actors.hero.spells.holyward$holyarmbuff.name=heilige wijk
actors.hero.spells.holyward.desc=De geestelijke doordrenkt zijn versleten pantser met glyphs van heilig licht, waardoor de schadeblokkering van het pantser met 1 toeneemt. Deze spreuk kost geen tijd om uit te spreken.\n\nDeze glyph blijft 50 beurten actief en overschrijft gedurende die tijd elke gunstige glyph die het pantser heeft. De geestelijke profiteert van dit effect, zelfs als hij geen pantser draagt.
actors.hero.spells.holyward.desc_paladin=_Deze spreuk is krachtiger wanneer hij door de Paladijn wordt uitgesproken._ De extra schadeblokkering wordt verhoogd naar 3, de spreuk overschrijft geen bestaande glyphs meer en het uitspreken van andere spreuken terwijl Holy Ward actief is, verlengt de duur ervan met 10 beurten per gebruikte lading.
actors.hero.spells.holyward.glyph_desc=Dit symbool verhoogt de hoeveelheid schade die bepantsering kan blokkeren enigszins.
actors.hero.spells.holyward.glyph_name=%s van licht
actors.hero.spells.holyward.name=heilige wijk
actors.hero.spells.holyward.short_desc=Vervangt tijdelijk glyphs om de pantserblokkering te versterken.
actors.hero.spells.holyweapon$holywepbuff.desc=De geestelijke heeft zijn gedragen wapen doordrenkt met heilige energie, waardoor alle bestaande betoveringen tijdelijk worden opgeheven en het wapen bij elke aanval 2 extra magische schade toebrengt.\n\nResterende beurten: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=De Paladijn heeft zijn gedragen wapen doordrenkt met heilige energie, waardoor zijn aanvallen 6 extra magische schade toebrengen.\n\nHet uitspreken van andere spreuken terwijl het heilige wapen actief is, verlengt de duur ervan met 10 beurten per verbruikte lading.\n\nResterende beurten: %s.
actors.hero.spells.holyweapon$holywepbuff.name=heilig wapen
actors.hero.spells.holyweapon.desc=De geestelijke betovert zijn gedragen wapen met heilige energie, waardoor het wapen 2 extra magische schade toebrengt telkens wanneer hij er een vijand mee raakt. Deze spreuk kan direct worden uitgesproken. Deze betovering duurt 50 beurten en overschrijft gedurende die tijd elke andere gunstige betovering die het wapen heeft. Ook ongewapende aanvallen kunnen van dit effect profiteren.
actors.hero.spells.holyweapon.desc_paladin=_Deze spreuk is krachtiger wanneer hij door de Paladijn wordt uitgesproken._ De extra magische schade wordt verhoogd tot 6, de spreuk heft bestaande betoveringen niet langer op en het uitspreken van andere spreuken terwijl heilig wapen actief is, verlengt de duur ervan met 10 beurten per gebruikte lading.
actors.hero.spells.holyweapon.ench_desc=Vijanden die door een heilig wapen worden geraakt, zullen extra magische schade oplopen.
actors.hero.spells.holyweapon.ench_name=heilige %s
actors.hero.spells.holyweapon.name=heilig wapen
actors.hero.spells.holyweapon.short_desc=Vervangt tijdelijk betoveringen om de schade te verhogen.
actors.hero.spells.judgement.desc=De geestelijke slaat met zijn vuist op de grond, waardoor een uitbarsting van licht ontstaat die schade toebrengt aan alle vijanden die hij kan zien. Dit veroorzaakt standaard %1$d-%2$d schade, maar ook een extra 33%% schade voor elke spreuk die de geestelijke heeft uitgesproken sinds hij zijn verheven vorm heeft bereikt (of sinds hij voor het laatst Oordeel heeft uitgesproken). Momenteel veroorzaakt Oordeel %3$d-%4$d schade.
actors.hero.spells.judgement.name=oordeel
actors.hero.spells.judgement.short_desc=Beschadigt alle zichtbare vijanden.
actors.hero.spells.layonhands.desc=De Paladijn kanaliseert heilige energie door zijn handen en geneest of beschermt alles wat hij aanraakt. De Paladijn kan deze spreuk op elk aangrenzend personage uitspreken om hem genezing te geven, of op zichzelf om bescherming te krijgen. Overtollige genezing van deze spreuk wordt omgezet in bescherming. Deze spreuk wordt direct uitgesproken en kan herhaaldelijk worden uitgesproken, maar kan niet meer dan de bescherming van drie spreuken tegelijk bieden.
actors.hero.spells.layonhands.name=handoplegging
actors.hero.spells.layonhands.short_desc=Geneest direct een aangrenzend personage of beschermt de Paladijn met een schild.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=De geestelijke heeft zojuist Levensverbinding op deze bondgenoot toegepast.\n\nNaast de gebruikelijke voordelen van Levensverbinding, loopt dit personage ook minder schade op, worden alle positieve spreuken van de geestelijke zowel op de geestelijke als op deze bondgenoot toegepast in plaats van slechts op één, en verloopt Kracht van Velen niet zolang deze buff actief is.\n\nResterende beurten: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=levenslink bescherming
actors.hero.spells.lifelinkspell.desc=De geestelijke versterkt de band tussen zichzelf en zijn bekrachtigde bondgenoot. Dankzij deze bekrachtigde band wordt alle opgelopen schade gedurende %1$d beurten gedeeld tussen de held en zijn bondgenoot, en wordt de verdedigingsbonus van Power of Many verhoogd tot -%2$d%% opgelopen schade. Merk op dat de schade wordt gedeeld na de pantsering, maar vóór de schadevermindering van Power of Many.\n\nZolang dit effect actief is, zijn gunstige spreuken van de geestelijke met een vaardigheidsniveau van 3 of lager van toepassing op zowel de geestelijke als zijn bondgenoot, alsof ze anders slechts op één van hen van toepassing zouden zijn geweest.
actors.hero.spells.lifelinkspell.name=levenslink
actors.hero.spells.lifelinkspell.short_desc=Deelt schade met een bondgenoot en vermindert de schade die deze oploopt.
actors.hero.spells.mindform.desc=De geestelijke kiest een toverstaf of werpwapen dat hij/zij deze run heeft geïdentificeerd en doordrenkt Trinity met het effect ervan. Wanneer Trinity wordt gebruikt, kan de geestelijke een enkele aanval uitvoeren alsof hij/zij het gekozen voorwerp gebruikt met een +%d-bonus. Dit activeert alle effecten die normaal gesproken door het gebruik van dat type voorwerp worden geactiveerd. Deze spreuk vervangt elk ander geesteffect waarmee Trinity momenteel is doordrenkt.
actors.hero.spells.mindform.name=geestvorm
actors.hero.spells.mindform.short_desc=Wijs Trinity toe aan een toverstaf of een werpwapen.
actors.hero.spells.mnemonicprayer.desc=De priester spreekt een gebed uit dat de duur van alle buffs of debuffs op een specifiek doelwit met %1$d beurten verlengt. Deze spreuk kost geen tijd om uit te spreken. Positieve effecten duren langer op bondgenoten (inclusief de priester zelf), en schadelijke effecten duren langer op vijanden. \n\nMnemonic Prayer kan een specifieke instantie van een buff of debuff slechts één keer verlengen en kan geen buffs verlengen die worden toegekend door pantservaardigheden.
actors.hero.spells.mnemonicprayer.name=geheugensteuntje gebed
actors.hero.spells.mnemonicprayer.short_desc=Verlengt buffs/debuffs op een bondgenoot/vijand en past verlichte effecten opnieuw toe.
actors.hero.spells.radiance.desc=De Priester barst los in heilig licht, waardoor alle zichtbare vijanden 3 beurten lang verblind worden. Als een vijand al verlicht is, activeert Radiance de bonussschade van Illuminate en past vervolgens het Illuminated-debuff toe. Radiance zorgt er ook voor dat de Priester 100 beurten lang gloeit als de huidige verdieping donker is.
actors.hero.spells.radiance.name=straling
actors.hero.spells.radiance.short_desc=Verlicht en verlamt zichtbare vijanden kortstondig.
actors.hero.spells.recallinscription$useditemtracker.desc=De geestelijke heeft onlangs een voorwerp gebruikt dat werkt met de spreuk 'Inscribed Recall'. De geestelijke kan de spreuk opnieuw gebruiken om het effect van het voorwerp te herhalen.\n\nGebruikt voorwerp: %1$s.\n\nResterende beurten: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=recent gebruikte rune
actors.hero.spells.recallinscription.desc=De geestelijke gebruikt heilige magie om het effect van een magische rune te herhalen die gevonden is op een runensteen of perkamentrol die hij in de afgelopen %s beurten heeft gebruikt.\n\nRecall Inscription kan niet worden gebruikt om perkamentrollen voor upgrades te dupliceren. De kosten van deze spreuk variëren afhankelijk van welk voorwerp recentelijk is gebruikt: 2 voor een runensteen, 3 voor een perkamentrol, 4 voor een exotische perkamentrol. Deze kosten worden ook verdubbeld bij het dupliceren van een perkamentrol voor transmutatie, of alchemie-voorwerpen die moeten worden gemaakt met behulp van transmutatie of upgrade.
actors.hero.spells.recallinscription.name=herinneringsinscriptie
actors.hero.spells.recallinscription.short_desc=Herhaalt een recent gebruikte runensteen of perkament.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Een dun schild van licht staat tussen dit personage en een vijand. Het is niet sterk genoeg om aanvallen volledig te blokkeren, maar het zal ze wel verzwakken.\n\nResterende beurten: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=schild van licht
actors.hero.spells.shieldoflight.desc=De geestelijke creëert een dunne lichtbarrière tussen zichzelf en een vijand, waardoor de blokkeringskracht van zijn pantser tegen die vijand met %1$d-%2$d gedurende 5 beurten wordt verhoogd.\n\nDeze spreuk kan direct worden uitgesproken, maar kan niet gelijktijdig tegen meerdere doelen worden gebruikt.
actors.hero.spells.shieldoflight.name=schild van licht
actors.hero.spells.shieldoflight.short_desc=Verleent tijdelijke bescherming tegen een doelwit.
actors.hero.spells.smite.desc=De Paladin geeft een mêlee-aanval een rechtvaardige, vernietigende kracht. Naast het toebrengen van normale mêlee-schade, zorgt Smite ervoor dat aanvallen zonder belemmeringen gegarandeerd raak zijn, heeft het +300 betoveringskracht en brengt het %1$d - %2$d bonus magische schade toe. De bonus magische schade van Smite schaalt met het niveau van de Paladin en zal altijd maximale bonus magische schade toebrengen aan ondode of demonische vijanden.
actors.hero.spells.smite.name=slaan
actors.hero.spells.smite.short_desc=Garandeert een treffer met bonus schade en betoveringskracht.
actors.hero.spells.spiritform$spiritformbuff.desc=Trinity's geestvorm geeft je momenteel de kracht van een voorwerp, alsof je het uitgerust hebt.\n\nLet op: de geestvorm kan geen tweede kopie geven van een effect waar je al van profiteert.\n\nHuidig effect: %1$s.\n\nResterende beurten: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=geestverschijning
actors.hero.spells.spiritform.desc=De geestelijke kiest een ring of artefact dat hij/zij in deze run heeft geïdentificeerd (met uitzondering van het heilige boek) en doordrenkt Trinity met het effect ervan.\n\nAls een ring wordt gekozen, verleent Trinity het effect van die ring met +%1$d gedurende 20 beurten.\n\nAls een artefact wordt gekozen, repliceert Trinity het effect van dat artefact met +%2$d. Elk artefact heeft verschillende specifieke gedragingen en pantserkosten wanneer het met Trinity wordt gebruikt.\n\nDeze spreuk vervangt elk ander geesteffect waarmee Trinity momenteel is doordrenkt.
actors.hero.spells.spiritform.name=geestverschijning
actors.hero.spells.spiritform.short_desc=Wijs Trinity toe aan een ring of artefact.
actors.hero.spells.stasis$stasisbuff.desc=De geestelijke heeft momenteel een bondgenoot in stasis. Alle positieve effecten op deze bondgenoot blijven behouden, inclusief Kracht van Velen, en hij of zij zal weer naast de geestelijke verschijnen wanneer het effect eindigt. Het effect kan ook voortijdig worden beëindigd door Stasis opnieuw te casten.\n\nBondgenoot in stasis: %1$s.\nResterende beurten: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Je onbeweeglijke bondgenoot blijft achter.
actors.hero.spells.stasis$stasisbuff.name=bondgenoot in stilstand
actors.hero.spells.stasis.desc=De geestelijke richt de verbinding met zijn bondgenoot op zichzelf, waardoor de bondgenoot tijdelijk in een soort energiestasis in de geestelijke wordt vastgehouden. De bondgenoot blijft maximaal %d beurten in deze stasis, waarbij alle positieve effecten op hem niet worden beïnvloed door de tijd die hij in stasis doorbrengt. De bondgenoot verschijnt naast de geestelijke wanneer de stasis vanzelf eindigt, of hij kan de spreuk direct en kosteloos opnieuw uitspreken om het effect voortijdig te beëindigen. Stasis kan zelfs immobiele bondgenoten verplaatsen, maar kan ze niet tussen verdiepingen verplaatsen.
actors.hero.spells.stasis.name=stilstand
actors.hero.spells.stasis.short_desc=Haalt een bondgenoot uit de kerker en bewaart hem.
actors.hero.spells.sunray.desc=De geestelijke vuurt een verblindende lichtstraal af op een doelwit, die %1$d-%2$d schade toebrengt en het doelwit %3$d beurten lang verblindt. Zonnestraal brengt altijd maximale schade toe aan ondoden en demonische doelwitten.\n\nNadat een vijand door deze spreuk is geraakt, zal zijn zicht zich aanpassen, waardoor hij niet opnieuw verblind kan worden. Als hij echter opnieuw wordt geraakt terwijl hij verblind is door deze spreuk, is het licht overweldigend en verlamt het hem in plaats daarvan.
actors.hero.spells.sunray.name=zonnestraal
actors.hero.spells.sunray.short_desc=Deelt magische schade op afstand uit en verblindt een doelwit eenmaal.
actors.hero.spells.walloflight$lightwall.desc=Glinsterende lichtpanelen blokkeren hier de doorgang.
actors.hero.spells.walloflight.desc=De Paladijn creëert een muur van panelen van massief licht recht voor zich, die 1 tegel dik en 0 tegels breed is en 20 beurten meegaat. Deze muur werkt net als een normale muur, behalve dat je erdoorheen kunt kijken. Vijanden die in de muur gevangen zitten wanneer deze wordt gecreëerd, worden even verdoofd en, indien mogelijk, teruggeduwd. Alles wat in de muur vastzit, kan eruit bewegen. De muur kan in elk van de vier hoofdrichtingen of vier diagonale richtingen worden geworpen. Als een muur al actief is, kan de spreuk gratis opnieuw worden gebruikt om de muur direct te verwijderen.
actors.hero.spells.walloflight.early_end=Je verdrijft de lichtmuur.
actors.hero.spells.walloflight.name=muur van licht
actors.hero.spells.walloflight.short_desc=Creëert een muur die vijanden tegenhoudt.
