actors.mobs.mob.wandering=%sはさまよっています
actors.mobs.elemental.desc=さまよう火の精霊は、より強大な存在を召喚した際に生まれる副産物だ。その本性はあまりにも混沌としており、最も優れた悪魔学者でさえ制御できない。
actors.mobs.elemental.name=火の精霊
actors.mobs.king.desc=ドワーフ最後の王は、生と死に深い知識を持つことで知られていた。王は廷臣たちを説得し、永遠の若さを授けるという儀式に参加させた。だが、若さを手にしたのは王ただ一人だった。おまけに不死者の軍勢まで手に入れたのだ。
actors.mobs.king.name=ドワーフの王
actors.mobs.npcs.bee.desc=黄金の蜂は小さいながらも、主人を激しく守ろうとする。ただし、その命は長くない。
actors.mobs.npcs.bee.name=黄金の蜂
actors.mobs.shielded.desc=ブルートはノールの中でも最も大きく、力強く、頑丈だ。深手を負うと狂暴になり、敵にさらに大きな傷を負わせる。
actors.mobs.shielded.name=盾持ちブルート
actors.mobs.yog.desc=ヨグ＝ドージェワは古の神であり、混沌の領域から来た強力な存在である。100年前、古代ドワーフたちはその悪魔軍との戦いに辛うじて勝利したが、神自身を倒すことはできなかった。そこで彼らは、ヨグ＝ドージェワは弱体化しており二度と復活できないだろうと考え、都市の地下の広間に幽閉したのである。
actors.mobs.yog.name=ヨグ＝ドージェワ
actors.mobs.bandit.carries=%sは_%s_を所持している。明らかに盗品だ。
actors.buffs.armorevasion.name=回避上昇
actors.mobs.king.defeated=あなたは私を殺すことはできない、 %s…私は…不死身だ…
