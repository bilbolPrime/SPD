actors.blobs.blizzard.desc=猛吹雪が吹き荒れている。
actors.blobs.blizzard.name=ブリザード
actors.blobs.confusiongas.desc=混乱のガスが渦巻いている。
actors.blobs.confusiongas.name=混乱ガス
actors.blobs.corrosivegas.desc=猛毒のガスが渦巻いている。
actors.blobs.corrosivegas.name=腐食性ガス
actors.blobs.electricity.desc=電気のフィールドがここで明るくスパークしている。
actors.blobs.electricity.name=電気
actors.blobs.electricity.ondeath=あなたは死ぬほどショックを受けた...。
actors.blobs.electricity.rankings_desc=感電死
actors.blobs.fire.desc=火事だ。
actors.blobs.fire.name=火災
actors.blobs.foliage.desc=地下の庭の暗がりを光線が貫いている。
actors.blobs.foliage.name=木の葉
actors.blobs.freezing.desc=ここは空気が不自然に冷たい。
actors.blobs.freezing.name=氷気
actors.blobs.goowarn.desc=ダークエネルギーの塊がここに群がっている！
actors.blobs.goowarn.name=ダークエネルギー
actors.blobs.inferno.desc=ここでは地獄が繰り広げられている。
actors.blobs.inferno.name=インフェルノ
actors.blobs.paralyticgas.desc=麻痺ガスの雲が渦巻いている。
actors.blobs.paralyticgas.name=麻痺性ガス
actors.blobs.regrowth.name=再生
actors.blobs.sacrificialfire.desc=ここには祭壇があり、その上で生贄の火が燃えている。ここで殺されたクリーチャーは、ダンジョンの精霊への捧げ物として消費される。\n\n十分な生贄が捧げられれば、報酬が与えられるのだろうか？
actors.blobs.sacrificialfire.name=いけび
actors.blobs.sacrificialfire.reward=火は燃え上がり、やがて消えていく！
actors.blobs.sacrificialfire.unworthy=火は捧げ物を焼き尽くすが、変わることはない。
actors.blobs.sacrificialfire.worthy=火は捧げ物を焼き尽くし、さらに強くなる。
actors.blobs.smokescreen.desc=濃い黒煙が渦巻いている。
actors.blobs.smokescreen.name=煙幕
actors.blobs.stenchgas.desc=悪臭が渦巻いている。
actors.blobs.stenchgas.name=悪臭ガス
actors.blobs.stormcloud.desc=水蒸気の雲が渦巻いている。
actors.blobs.stormcloud.name=嵐雲
actors.blobs.toxicgas.desc=緑がかった有毒ガスの雲が渦巻いている。
actors.blobs.toxicgas.name=有毒ガス
actors.blobs.toxicgas.ondeath=あなたは毒ガスで死んだ...。
actors.blobs.toxicgas.rankings_desc=窒息
actors.blobs.waterofawareness.desc=この井戸の水からは知識の力が放たれている。この井戸の水を飲むと、装備しているアイテムがすべて識別され、インベントリにあるすべてのアイテムの呪いが識別され、現在のフロアにあるすべてのアイテムが明らかになる。
actors.blobs.waterofawareness.name=意識の水
actors.blobs.waterofawareness.procced=一口飲むと、知識が頭の中に流れ込んでくるのを感じる。
actors.blobs.waterofhealth.desc=この井戸の水からは健康の力が放たれている。この井戸の水を飲むと、傷が癒やされ、空腹が満たされ、身につけた物の呪いが浄化される。
actors.blobs.waterofhealth.name=健康の水
actors.blobs.waterofhealth.procced=一口飲むと、傷が完全に癒えるのを感じる。
actors.blobs.web.desc=分厚い網がすべてを覆っている。この網に触れたり投げられたりしたものは壊れるが、その場から動けなくもなる。
actors.blobs.web.name=クモの巣
actors.buffs.adrenaline.desc=アドレナリンは攻撃と移動のスピードを向上させる。\n\nアドレナリンは対象を2倍速で走らせ、1.5倍速で攻撃する。\n\n残りターン%s。
actors.buffs.adrenaline.name=アドレナリン
actors.buffs.adrenalinesurge.desc=大いなる力の波が押し寄せたが、残念ながら永続的なものではなかった。\n\n体力アップ：+%d。\nブーストが弱まるまでのターン：%s。
actors.buffs.adrenalinesurge.name=ストレングス・ブースト
actors.buffs.amok.desc=Amokは対象に大きな怒りと混乱状態を引き起こす。\n\nクリーチャーはアモーク状態になると、敵味方問わず近くにいるものを攻撃する。\n\nアモークの残りターン%s。
actors.buffs.amok.name=アモック
actors.buffs.arcanearmor.desc=薄いシールドがあなたを取り囲み、魔法攻撃によるダメージの一部を防いでいる。\n\nあなたの魔法アーマーは現在0-%d.\n\nアーケイン・アーマーが弱体化するまでのターン：%s.
actors.buffs.arcanearmor.name=アーケインアーマー
actors.buffs.artifactrecharge.desc=エネルギーが体内を駆け巡り、装備しているアーティファクトのチャージ率が上がる。\n\nアーティファクトによって影響は多少異なるが、すべてのアーティファクトのチャージ速度が通常より速くなる。\n\n残りターン%s。
actors.buffs.artifactrecharge.name=アーティファクト充電
actors.buffs.ascensionchallenge.almost=ヨグがお守りを握る力が弱まり始めたのを感じる！
actors.buffs.ascensionchallenge.beckon=お守りは遠くの敵に呼びかけ始める。
actors.buffs.ascensionchallenge.break=息を整え、傷口がふさがり始めるのを感じる！
actors.buffs.ascensionchallenge.damage=アミュレットがダークエネルギーを放ち始める。燃える！
actors.buffs.ascensionchallenge.desc=どういうわけかヨグ＝デゼヴァはお守りを通してこの世界に影響力を持ち続け、あなたの上昇を止めようとしている！\n\nヨグの力はダンジョンをより危険にし、敵の数を増やし、強くしている！この力は放っておくとどんどん増えていく。ヨグの力によって強化された敵を倒すことで弱体化させることができる。
actors.buffs.ascensionchallenge.desc_beckon=お守りは現在、遠くの敵に呼びかけ、あなたの位置を知らせている。
actors.buffs.ascensionchallenge.desc_clear=アミュレットから放射されるダークエネルギーは、今のところ可能な限り弱まっている。
actors.buffs.ascensionchallenge.desc_damage=お守りのエネルギーが強くなりすぎて、あなたを直接傷つけているんだ！
actors.buffs.ascensionchallenge.desc_haste=このお守りは現在、遠くの敵の動きを速め、自分への到達を早めている！
actors.buffs.ascensionchallenge.desc_slow=アミュレットは現在、あなたの動きを鈍らせ、スピードアップ効果を無効にしている！
actors.buffs.ascensionchallenge.haste=お守りは遠くの敵を急き立て始める！
actors.buffs.ascensionchallenge.name=お守りの呪い
actors.buffs.ascensionchallenge.on_kill=闇のエネルギーがあなたを蝕む...。
actors.buffs.ascensionchallenge.slow=アミュレットは、在庫の中で鉛の重りのように感じ始める！
actors.buffs.ascensionchallenge.weaken=お守りの呪いが少し弱まるのを感じる。
actors.buffs.ascensionchallenge.weaken_info=アミュレットの呪いは、より多くの敵を倒すことで弱めることができる。
actors.buffs.ascensionchallenge.weaken_info_no_kills=敵を倒すとアミュレットの呪いが弱まる！
actors.buffs.barkskin.desc=肌は硬くなり、樹皮のようにざらざらとした感触だ。\n\n硬くなった皮膚は有効な装甲を増加させ、物理的な攻撃からよりよく身を守ることができる。\n\nあなたの装甲は現在0-%d。\nバークスキンが弱まるまでのターン数%s。\n\n複数のソースからbarkskinを受け取った場合、最も強いもののみが適用される。
actors.buffs.barkskin.name=バークスキン
actors.buffs.barrier.desc=あらゆるダメージを防ぐ耐久力のある力の泡。\n\nシールドが残っている限り、バリアは守っているものに対してダメージを受ける。また、シールドは時間とともに徐々に減衰する。\n\nシールド残量%d。
actors.buffs.barrier.name=バリア
actors.buffs.berserk.action_name=ベルセルク
actors.buffs.berserk.angered=腹立たしい
actors.buffs.berserk.angered_desc=バーサーカーは負傷の度合いによって打撃が強化される。バーサーカーは物理ダメージを受けると怒りが蓄積し、ボーナスダメージを与える。アーマーで防がれたダメージも怒りの蓄積にカウントされる。\n\nRageは時間の経過とともに薄れていく。バーサーカーのヘルスが低いほど長く続く。\n\nレイジが100%%になるとバーサーカーはバーサークすることができ、アーマーのレベルと不足しているヘルスに応じたシールドが付与される。バーサーク中はシールドが時間経過とともに減少し、シールドが切れると再びレイジを溜める前に休まなければならない。\n\n現在のレイジ: _%1$.0f%%_\n_+%2$.0f%%_ダメージ\n\n現在の装甲とHPでバーサークシールド：%3$d_
actors.buffs.berserk.berserk=バーサーキング
actors.buffs.berserk.berserk_desc=恐怖と不安は消え去り、怒りだけが残る。この状態のバーサーカーは非常に強力で、＋50%%のダメージを与え、ボーナス・シールドを得るが、毎ターンシールドを失う。\n\nシールドがすべて0になるとバーサーキングは終了する。\n\n激昂した後、バーサーカーは再び激昂する前に回復する必要がある。\n\nシールド残量%d
actors.buffs.berserk.exhausted=疲労困憊
actors.buffs.berserk.no_seal=バーサークするには封印が解けている必要がある！
actors.buffs.berserk.rankings_desc=ベルセルク・トゥ・デス
actors.buffs.berserk.recovering=回復
actors.buffs.berserk.recovering_desc=内なる力には限界がある。バーサーカーは再び怒りを使う前に休息しなければならない。\n\n回復している間、バーサーカーはダメージを受けても怒りを溜めない。
actors.buffs.berserk.recovering_desc_levels=回復するまでのレベル_%.2f_
actors.buffs.berserk.recovering_desc_turns=回復するまでのターン%d_
actors.buffs.bleeding.desc=傷口から心配な量の血が漏れている。\n\n出血は毎ターンダメージを与える。出血が止まるまで、毎ターンダメージはランダムに減少する。\n\n現在の出血ダメージ%d.
actors.buffs.bleeding.heromsg=出血している！
actors.buffs.bleeding.name=出血
actors.buffs.bleeding.ondeath=出血多量で死んだ
actors.buffs.bleeding.rankings_desc=死ぬまで血まみれ
actors.buffs.bless.desc=神々からインスピレーションを得たとも言われる、素晴らしい集中力の爆発だ。\n\n祝福を受けると命中率と回避率が25%%上昇し、戦闘においてより効果的になる。\n\n祝福の残りターン%s。
actors.buffs.bless.name=恵まれた
actors.buffs.blindness.desc=目眩ましは周囲を暗い靄に変える。\n\n失明中は視界が1タイル分狭くなるため、範囲攻撃は役に立たず、遠くの敵を見失いやすくなる。さらに、盲目のヒーローは巻物や本を読むことができない。\n\n盲目の残りターン%s。
actors.buffs.blindness.heromsg=盲目になっている！
actors.buffs.blindness.name=盲目
actors.buffs.blobimmunity.desc=何か不思議な力があなたを薄い防護壁で包み込み、空気中の有害な影響を遮断しているのだ。\n\nこのバリアが持続している間、君はすべてのエリア・バウンド効果を受けない。\n\n残り免疫ターン%s。
actors.buffs.blobimmunity.name=浄化バリア
actors.buffs.burning.burnsup=%sが燃え尽きる！
actors.buffs.burning.desc=炎に包まれることほど苦しいことはない。\n\n炎は水で消すか、燃え尽きるまで毎ターンダメージを与える。火は水の中に入ったり、砕けるポーションの水しぶきで消すことができる。\n\nさらに、火は燃えやすい地形や接触したアイテムに引火することがある。\n\n残り燃焼ターン%s.
actors.buffs.burning.heromsg=火がつく！
actors.buffs.burning.name=燃焼
actors.buffs.burning.ondeath=焼け死んだ
actors.buffs.burning.rankings_desc=灰燼に帰す
actors.buffs.championenemy$antimagic.desc=アンチマジック・チャンピオンは受けるダメージが50％減少し、魔法効果を完全に受けなくなる。
actors.buffs.championenemy$antimagic.name=アンチマジックチャンピオン
actors.buffs.championenemy$blazing.desc=ブレイジング・チャンピオンは近接ダメージが25%増加し、攻撃した敵を発火させ、炎に対する免疫を持ち、死ぬと周囲に炎を撒き散らす。ただし、水の上に火を撒くことはできない。
actors.buffs.championenemy$blazing.name=燃えるチャンピオン
actors.buffs.championenemy$blessed.desc=祝福されたチャンピオンは4倍の命中率と回避を持つ。
actors.buffs.championenemy$blessed.name=ブリーデッド・チャンピオン
actors.buffs.championenemy$giant.desc=ジャイアント・チャンピオンは受けるダメージが80％減少し、攻撃範囲が＋1されるが、閉ざされた空間を移動することはできない。
actors.buffs.championenemy$giant.name=ジャイアント・チャンピオン
actors.buffs.championenemy$growing.desc=成長したチャンピオンは命中率、回避率、物理ダメージ、被ダメージの減少に着実にボーナスを得る。\n\n現在のAcc/Eva/Dmgブーストzxqph0zxqzxqph1zxq\n現在のダメージ軽減zxqph2zxqzxqph3zxq
actors.buffs.championenemy$growing.name=グローイング・チャンピオン
actors.buffs.championenemy$projecting.desc=Projectionのチャンピオンは近接ダメージが25%増加し、攻撃範囲が+3される。
actors.buffs.championenemy$projecting.name=プロジェクション・チャンピオン
actors.buffs.championenemy.warn=死の気配を感じる。
actors.buffs.charm.cant_attack=あなたはその敵に魅了され、攻撃することができない。
actors.buffs.charm.desc=チャームとは、敵同士を一時的に慕わせることができる操作魔法である。\n\nチャームの効果を受けたキャラクターは、チャームを受けた敵を直接攻撃することはできない。しかし、他のターゲットへの攻撃は可能である。痛みのショックはチャームの持続時間を短くする。\n\nチャームの残りターン%s.
actors.buffs.charm.heromsg=あなたは魅力的だ！
actors.buffs.charm.name=ゆうえん
actors.buffs.chill.desc=凍っているとは言えないが、それでも寒すぎる。\n\n冷やされた対象は、効果の残りターン数に応じて、すべての行動の実行が遅くなる。最悪の場合、これは動きが鈍くなるのと同じである。\n\n凍結の残りターン数%1$s。\n速度が低下する%2$s%%
actors.buffs.chill.freezes=%sがフリーズ！
actors.buffs.chill.name=チルド
actors.buffs.combo$combomove.clobber.desc=敵を2タイルノックバックさせるが、ダメージは与えず、落とし穴にはノックバックさせない。コンボ数が1増加する。
actors.buffs.combo$combomove.clobber.empower_desc=敵を3タイル後退させ、眩暈を与え、落とし穴に叩き込む。コンボ数が1増加する。
actors.buffs.combo$combomove.clobber.name=クラバー
actors.buffs.combo$combomove.crush.desc=メインターゲットに%d%%(コンボ*25%%)のダメージを与え、7×7AOE内の他の全ての敵にその半分のダメージを与える。使用するとコンボがリセットされる。
actors.buffs.combo$combomove.crush.empower_desc=%1$dタイル_まで跳躍し、メインターゲットに%2$d%%(コンボ*25%%)ダメージを与え、7×7AOE内の他の全ての敵にその半分のダメージを与える。使用するとコンボがリセットされる。
actors.buffs.combo$combomove.crush.name=クラッシュ
actors.buffs.combo$combomove.fury.desc=コンボ1つにつき1回敵にヒットし、1回につき60%のダメージを与え、エンチャントを発動できる。使用するとコンボがリセットされる。
actors.buffs.combo$combomove.fury.empower_desc=%dタイルまで跳躍し、コンボ1つにつき1回敵にヒットする。使用するとコンボがリセットされる。
actors.buffs.combo$combomove.fury.name=激情
actors.buffs.combo$combomove.parry.desc=発動後1ターン以内に次の攻撃をブロックし、即座に反撃する。何も受け流されなかった場合はコンボがリセットされる。
actors.buffs.combo$combomove.parry.empower_desc=発動時に1ターン以内の全ての攻撃をブロックし、即座に反撃する。何も受け流されなかった場合はコンボがリセットされる。
actors.buffs.combo$combomove.parry.name=往なす
actors.buffs.combo$combomove.slam.desc=自分のダメージブロック力の%d%%（コンボ*20%%）をボーナスダメージとして与える。使用するとコンボがリセットされる。
actors.buffs.combo$combomove.slam.empower_desc=%1$dタイル_まで跳躍し、自分のダメージブロック力の%2$d%%（コンボ*20%%）をボーナスダメージとして与える。使用するとコンボがリセットされる。
actors.buffs.combo$combomove.slam.name=スラム
actors.buffs.combo.action_name=コンボアタック
actors.buffs.combo.bad_target=攻撃範囲内にいる敵を対象としなければならない。
actors.buffs.combo.combo=%dのヒットコンボ！
actors.buffs.combo.desc=剣闘士は打撃を成功させるごとに勢いを増す。コンボカウンターは攻撃するたびに1ずつ増えるが、コンボを打つ間隔が空きすぎると0にリセットされる。\n\nコンボを重ねると、ミスの許されない特殊なコンボ攻撃がアンロックされる！コンボ数が2、4、6、8、10になると異なる攻撃がアンロックされる。コンボがリセットされる技とリセットされない技があるが、それぞれの技は1回のコンボにつき1回しか使用できない。\n\n現在のコンボ%1$d。\n\nコンボが切れるまでのターン数%2$s。
actors.buffs.combo.name=コンボ
actors.buffs.combo.prompt=攻撃対象を選択する。
actors.buffs.corrosion.desc=強力な酸が肉、金属、骨を驚くべき速さで溶かしていく。\n\n腐食ダメージは時間の経過とともに増加し、対象は溶け続ける。\n\n腐食の残りターン%1$s。\n現在の腐食ダメージ：%2$d。
actors.buffs.corrosion.heromsg=あなたは溶けている！
actors.buffs.corrosion.name=腐食
actors.buffs.corrosion.ondeath=溶けていく...
actors.buffs.corrosion.rankings_desc=溶解
actors.buffs.corruption.desc=腐敗は存在の本質に染み込み、かつての本性に反して捻じ曲げられる。\n\n腐敗したクリーチャーは味方を攻撃し、かつての敵を無視する。腐敗はダメージも与え、対象を徐々に屈服させる。\n\n腐敗は永続的で、その影響は死によってのみ終わる。
actors.buffs.corruption.name=汚い
actors.buffs.cripple.desc=脚はあんな風に曲がるものではないはずだ。\n\n不自由になると移動速度が半分になり、タイルの移動に通常1ターンではなく2ターンかかるようになる。\n\n残りのターン%s。
actors.buffs.cripple.heromsg=あなたは不自由だ！
actors.buffs.cripple.name=片輪
actors.buffs.daze.desc=耳鳴りがし、視界がぼやけるため、闘うことが困難になる。\n\n朦朧としている間は命中率と回避率が50%%低下し、打撃の着地と回避が非常に難しくなる。\n\n残り時間%s。
actors.buffs.daze.heromsg=意識が朦朧としている！
actors.buffs.daze.name=ぼうぜん
actors.buffs.degrade.desc=強力な闇の魔法が、アップグレードの巻物で装備に施された力を奪っている！\n\n劣化している間、アップグレードされた装備は実際のレベルよりも低いものとして扱われる。3以降のアップグレードは指数関数的に弱くなります。\n\nアイテムの説明文は、低下したパワーレベルを反映するように変更されます。劣化は、必要戦力、ワンド・チャージ、投擲武器の耐久度、アーティファクトには影響しません。\n\n劣化の残りターン%s。アップグレードの巻物や呪いを解く巻物を使用すると、劣化は即座に終了する。
actors.buffs.degrade.heromsg=機材が弱く感じる！
actors.buffs.degrade.name=劣化した
actors.buffs.doom.desc=宇宙が自分の死を望んでいるように思えるとき、進み続けるのは難しい。\n\n絶体絶命のキャラクターは、すべてのソースから＋67％のダメージを受ける。\n\n破滅は永続的であり、その効果は死によってのみ終了する。
actors.buffs.doom.name=あがったり
actors.buffs.dread.desc=対象がダンジョンから完全に逃げ出すほどの恐怖！\n\nドレッドに侵されたクリーチャーは相手から高速で逃げ出し、姿が見えなくなるとダンジョンから完全に姿を消す。この方法で倒された敵は経験値が半分になり、アイテムを落とさない。痛みのショックはドレッドの持続時間を短くする。\n\nドレッドの残りターン%d.
actors.buffs.dread.name=恐怖
actors.buffs.drowsy.desc=魔法の力によって起きていることが難しくなり、数ターン後、対象は深い魔法の眠りに落ちる。\n\nヒーローはダメージを受けるか、ヘルスが満タンであることで眠気に耐えることができる。\n\n眠りまでのターン数%s.
actors.buffs.drowsy.name=眠い
actors.buffs.earthimbue.desc=あなたには大地の力が宿っている！\n\nすべての物理攻撃は敵の下に大地を移動させ、短時間、敵を動けなくする。\n\n残り土のターン：%s.
actors.buffs.earthimbue.name=つちまみれ
actors.buffs.enhancedrings.desc=ローグが最近使用したアーティファクトはリングに力を与え、レベルを＋1する。\n\n残りターン%s.
actors.buffs.enhancedrings.name=エンハンスド・リング
actors.buffs.fireimbue.desc=あなたには炎の力が宿っている！\n\nすべての物理攻撃は確率で敵を燃え上がらせる。さらに、あなたは炎の影響を完全に受けない。\n\n残り火のターン%s。
actors.buffs.fireimbue.name=ひがこもる
actors.buffs.foresight.desc=なんとなく周囲の地形の配置が頭で見えてくる。\n\n予見の効果を受けている間は、秘密の罠やドアも含め、広い範囲にあるすべてのタイルが明らかになる。\n\n予見の残りターン%s。
actors.buffs.foresight.name=先見の明
actors.buffs.frost.desc=フリージング・ソリッドと混同されないように、より穏やかなこのフリージングは、単に対象を氷で包むだけである。\n\n凍結は麻痺と似たような働きをし、対象の行動を不可能にする。麻痺とは異なり、対象がダメージを受けると氷は砕け散り、凍結は即座に解除される。\n\n凍結の残りターン%s。
actors.buffs.frost.freezes=%sがフリーズ！
actors.buffs.frost.name=フローズン
actors.buffs.frostimbue.desc=あなたには氷の力が宿っている！\n\nすべての物理攻撃は敵に着実に寒さを蓄積する。さらに、あなたは寒さに完全に免疫がある。\n\n霜の残りターン%s。
actors.buffs.frostimbue.name=霜が降りた
actors.buffs.fury.desc=あなたが怒っていると、敵はあなたを嫌いになる。\n\nあなたの中で大きな怒りが燃え上がり、物理攻撃で与えるダメージが50%%増加する。\n\nこの怒りは体力が50%%以下の怪我をしている限り続く。
actors.buffs.fury.heromsg=あなたは激怒する！
actors.buffs.fury.name=激しい
actors.buffs.gravitychaostracker.desc_duration=効果がいつまで続くかは不明だが、永遠に続くことはないだろう。
actors.buffs.gravitychaostracker.desc_intro=数ターンごとに、現在のダンジョンフロアにいるすべてのキャラクターがランダムな方向に投げ出される。
actors.buffs.gravitychaostracker.desc_positive=しかし、あなたとあなたの味方は免疫があるようだ。
actors.buffs.gravitychaostracker.name=重力カオス
actors.buffs.greaterhaste.desc=信じられないほどのスピードアップで、一瞬、他のすべてが止まっているように感じる。\n\nグレーター・ヘイストの効果を受けている間は、移動行動にはまったく時間がかからないが、その他の行動は通常のスピードで行われる。一歩移動するごとにグレーター・ヘイストのターンを消費する。\n\n大いなるヘイストの残りターン：%d。
actors.buffs.greaterhaste.name=大急ぎ
actors.buffs.haste.desc=エネルギーが筋肉を通り、信じられないようなスピードで走ることができる！\n\nヘイストの効果中は3倍のスピードで走るが、それ以外の行動は通常のスピードで行う。\n\nヘイスト残りターン%s。
actors.buffs.haste.name=急ぎ
actors.buffs.healing.desc=魔法のような治療法は、傷を閉じさせ、肉を編む。\n\nヒーリング効果が切れるまで、毎ターン着実にヘルスが回復する。回復量は時間経過とともに減少することがある。\n\n次のヒール%d。\n\n残りのヒーリング%d。
actors.buffs.healing.name=ヒーリング
actors.buffs.herodisguise.desc=幻覚魔法により、あなたの外見が変化した！その効果は純粋に外見的なものだが、それとは関係なく非常に奇妙な感じがする。\n\n残り変装ターン%s。
actors.buffs.herodisguise.name=変装
actors.buffs.hex.desc=集中力を奪い、対象をわずかに混乱させる暗黒魔法。\n\nHexingは命中率と回避率を20%%低下させ、対象を戦闘不能にする。\n\nヘックスの残りターン%s。
actors.buffs.hex.heromsg=あなたは呪いをかけられている！
actors.buffs.hex.name=呪われた
actors.buffs.holdfast.desc=ウォリアーはその位置をキープし、アーマーを%1$d-%2$d増加させ、一部のバフの減衰速度を%3$d%%遅らせる。これは彼が移動するまで続く。
actors.buffs.holdfast.name=まもりぬく
actors.buffs.hunger.cursedhorn=呪いの角は、食べるときに食べ物のエネルギーの一部を奪う。
actors.buffs.hunger.desc=空腹はダンジョンで時間を過ごすにつれて徐々に増していき、最終的には飢え始める。飢えている間、体力は回復する代わりに徐々に減っていく。\n\n配給は重要だ！もし体力に余裕があるなら、飢えるのも悪くない。効果的な配給によって、食料を長持ちさせることができる！
actors.buffs.hunger.desc_intro_hungry=胃が食べ物を求めているのを感じるが、まだそれほど切迫していない。
actors.buffs.hunger.desc_intro_starving=お腹が空いて痛いよ。
actors.buffs.hunger.hungry=腹ペコ
actors.buffs.hunger.ondeath=あなたは餓死した
actors.buffs.hunger.onhungry=お腹が空いているんだね。
actors.buffs.hunger.onstarving=あなたは飢えている！
actors.buffs.hunger.rankings_desc=飢え死に
actors.buffs.hunger.starving=はらペコ
actors.buffs.invisibility.desc=周囲の地形に完全に溶け込んでいるため、姿を確認することはできない。\n\nあなたが透明になっている間、敵はあなたを攻撃することも、追いかけることもできない。物理攻撃や魔法効果（巻物や杖など）は即座に透明化を解除する。\n\n透明状態の残りターン%s。
actors.buffs.invisibility.name=インビジブル
actors.buffs.invulnerability.desc=このキャラクターは偉大な守護の力に満たされており、短期間不死身になることができる！\n\n残りターン%s.
actors.buffs.invulnerability.name=不死身
actors.buffs.levitation.desc=不思議な力があなたを浮遊させ、無重力に感じさせる。\n\n浮遊するキャラクターは静かに移動し、地上にあるすべての効果を無視する。トラップは発動せず、水は火を消さず、植物は踏みつぶされず、根は外れ、落とし穴はホバリングする。浮遊が終わった瞬間にこれらの効果が発動することもあるので注意しよう！\n\n浮遊の残りターン%s。
actors.buffs.levitation.name=浮遊
actors.buffs.lifelink.desc=このキャラクターの生命力は、近くにいる別のキャラクターとリンクしている。受けたダメージはそのキャラクター間で共有される。\n\nこのキャラクターがダメージを受けるたび、その半分が代わりにライフリンク先に与えられる。\n\nライフリンクの残りターン%s。
actors.buffs.lifelink.name=ライフリンク
actors.buffs.lifelink.ondeath=人生とリンクしたダメージがあなたを殺した......。
actors.buffs.light.desc=暗闇のダンジョンでも、傍らに安定した光があれば、いつも安心できる。\n\n光は暗闇を抑えるのに役立ち、環境にもかかわらず適度な距離を見ることができる。\n\n残り照明ターン数%s.
actors.buffs.light.name=照明付き
actors.buffs.lockedfloor.desc=現在のフロアはロックされており、そこから出ることはできない！\n\nフロアがロックされている間は、空腹を得ることも、飢餓によるダメージを受けることもありません。また、このフロアのボスを倒す努力をしないと、パッシブリジェネレーションの効果も停止します。\n\nさらに、フロアがロックされている間に祝福されていないアンクによって復活させられた場合、その効果はリセットされる。\n\nこのフロアのボスを倒してロックを解除しよう。
actors.buffs.lockedfloor.name=フロアロック
actors.buffs.lostinventory.desc=インベントリがダンジョンのどこかに紛失してしまいました！それを取り戻すまで、ほとんどのアイテムを拾ったり使ったりすることはできません。
actors.buffs.lostinventory.name=ロストインベントリー
actors.buffs.magicalsight.desc=どういうわけか、目ではなく心で見ることができる。\n\n魔法視力が発動している間は、半径12タイル内のすべての地形を見通すことができる。\n\n魔法視力の残りターン%s.
actors.buffs.magicalsight.name=魔眼
actors.buffs.magicalsleep.desc=このキャラクターは深い魔法の眠りに落ちており、自然に目覚めることはない。\n\n魔法の眠りは通常の眠りと似ているが、ダメージによってのみ目覚めることができる。\n\nヒーローとその味方にとって、魔法の眠りには回復効果があり、休んでいる間に急速に回復することができる。
actors.buffs.magicalsleep.fallasleep=深い魔法の眠りにつく。
actors.buffs.magicalsleep.name=マジカル・スリープ
actors.buffs.magicalsleep.toohealthy=あなたはあまりに健康で、眠りたい衝動に駆られる。
actors.buffs.magicalsleep.wakeup=目覚めは爽やかで健康的だ。
actors.buffs.magicimmune.desc=すべての魔法の効果が失われ、あなたはそれらに対して完全に無害になる。\n\n魔法を受けない間は、呪い、エンチャント、杖、巻物、指輪、アーティファクトなど、有害な魔法効果も有用な魔法効果もすべて適用されない。ヒロイック・アーマーのアビリティは、この効果に関係なく機能するほど強力である。\n\n魔法免疫の残りターン%s。
actors.buffs.magicimmune.name=魔法が効かない
actors.buffs.mindvision.desc=どういうわけか、あなたは心を通してこのフロアにいるすべての生き物を見ることができる。奇妙な感覚だ。\n\nあなたが心眼を持っている限り、このフロアにいるすべてのキャラクターがあなたには見える。マインド・ビジョンによってクリーチャーが見えるということは、多くの魔法効果において、そのクリーチャーが見えている、あるいは近くにいるということにカウントされる。\n\nマインド・ビジョンの残りターン%s。
actors.buffs.mindvision.name=マインドビジョン
actors.buffs.momentum.action_name=フリーラン
actors.buffs.momentum.momentum=勢いをつける
actors.buffs.momentum.momentum_desc=フリーランナーは移動するにつれて勢いを増し、その勢いを消費してフリーランニングを開始することができる。\n\n運動量のチャージ1つにつき2ターンのフリーランニングが可能で、Freerunnerは最大10チャージまでチャージできる。Freerunnerの動きが止まると勢いは急速に失われる。\n\n現在のモメンタムチャージ%d。
actors.buffs.momentum.resting=回復
actors.buffs.momentum.resting_desc=フリーランナーは移動するにつれて勢いを増し、その勢いを消費してフリーランニングを開始することができる。\n\nフリーランナーはスタミナを回復させる時間が必要である。\n\n残りターン%d。
actors.buffs.momentum.running=フリーランニング
actors.buffs.momentum.running_desc=フリーランナーは移動するにつれて勢いを増し、その勢いを消費してフリーランニングを開始することができる。\n\nフリーランニング中は倍速で移動し、レベルに応じたボーナス回避を得る。\n\n残りターン%d。
actors.buffs.monkenergy$monkability$dash.desc=最大4タイル先までダッシュする。このアビリティはハザードを越えることはできるが、敵や固い地形を通り抜けることはできない。
actors.buffs.monkenergy$monkability$dash.empower_desc=最大8タイル先までダッシュする。このアビリティはハザードを越えることはできるが、敵や固い地形を通り抜けることはできない。
actors.buffs.monkenergy$monkability$dash.name=ダッシュ
actors.buffs.monkenergy$monkability$dash.prompt=場所を選ぶ
actors.buffs.monkenergy$monkability$dragonkick.desc=%1$d-%2$dダメージを与え、アーマーを無視する破壊的なキック。蹴りは対象を殴り飛ばし、タイルを移動するごとに麻痺させる。
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=%1$d-%2$dダメージを与え、アーマーを無視する。このキックは_隣接するすべてのターゲットをノック・アウェイし、タイルを移動するごとに麻痺させる。
actors.buffs.monkenergy$monkability$dragonkick.name=ドラゴンキック
actors.buffs.monkenergy$monkability$flurry.desc=%1$d-%2$dダメージを与え、アーマーを無視する2回のインスタント・ストライク。このアビリティは繰り返し使用できない。
actors.buffs.monkenergy$monkability$flurry.empower_desc=%1$d-%2$dダメージを与え、アーマーを無視し、武器のエンチャントを使用する2回のインスタント・ストライク。
actors.buffs.monkenergy$monkability$flurry.name=殴り合い
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=モンクは周囲に集中し、次の攻撃を予測する。集中している間は、次に来る攻撃を確実に受け流すことができる。
actors.buffs.monkenergy$monkability$focus$focusbuff.name=集中
actors.buffs.monkenergy$monkability$focus.desc=修道士は一転して集中し、次の攻撃を受け流す。
actors.buffs.monkenergy$monkability$focus.empower_desc=モンクは瞬時に集中し、次の攻撃を受け流す。
actors.buffs.monkenergy$monkability$focus.name=フォーカス
actors.buffs.monkenergy$monkability$meditate.desc=モンクは5ターンの間、エネルギーを身体に集中させる。これにより、ほとんどの悪影響が取り除かれ、杖とアーティファクトを8ターン充電できる。
actors.buffs.monkenergy$monkability$meditate.empower_desc=モンクは5ターンの間、エネルギーを身体に集中させる。これにより、ほとんどのマイナス効果を解除し、杖とアーティファクトを8ターン充電できる。また、瞑想中は80%のダメージ耐性を獲得し、失われたHPの20%をゆっくりと回復する。
actors.buffs.monkenergy$monkability$meditate.name=こごらす
actors.buffs.monkenergy.action=モンクのアビリティ
actors.buffs.monkenergy.desc=敵を倒すとエネルギーを獲得し、さまざまなアビリティに使用できる。ほとんどの敵は倒すと1エネルギーが得られ、時間が経ってもエネルギーは減らない。\n\n現在のエネルギーzxqph0zxq/zxqph1zxq。
actors.buffs.monkenergy.desc_cooldown=そのモンクは最近アビリティを使用したので、次のアビリティを使用する前に待たなければならない。\n\n現在のクールダウン%dターン。
actors.buffs.monkenergy.name=エネルギー
actors.buffs.ooze.desc=このネバネバした酸が肉にまとわりつき、ゆっくりと肉を溶かしていく。\n\nウーズは時間とともに一定のダメージを与えるが、すぐに水で洗い流すことができる。\n\nウーズの残りターン数%s.
actors.buffs.ooze.heromsg=腐食性の滲出液があなたの肉を食べる。洗い流せ！
actors.buffs.ooze.name=苛性溶液
actors.buffs.ooze.ondeath=溶けていく...
actors.buffs.ooze.rankings_desc=溶解
actors.buffs.paralysis.desc=最悪なのは何もしないことだ。\n\n麻痺はすべての行動を完全に停止させ、対象は効果が切れるまで待つことを強いられる。ダメージを受けたときの痛みによって、キャラクターが麻痺に抵抗し、効果が切れることもある。\n\n麻痺の残りターン%s。
actors.buffs.paralysis.heromsg=あなたは麻痺している！
actors.buffs.paralysis.name=麻痺した
actors.buffs.paralysis.out=抵抗性麻痺
actors.buffs.physicalempower.desc=あなたの打撃がパワーアップし、物理攻撃で敵にヒットしたときに与えられるダメージの量が増えた。\n\nボーナスダメージ%1$d。\n残りヒット数%2$d。
actors.buffs.physicalempower.name=フィジカル・エンパワーメント
actors.buffs.pincushion.desc=このキャラクターに対して使用した投擲武器は、現在そのキャラクターに張り付いており、倒された後は床に落ちる。\n\n現在、以下のアイテムが装着されています：
actors.buffs.pincushion.name=ピンクッション
actors.buffs.poison.desc=毒は体内で作用し、徐々に体内機能を低下させる。\n\n毒は毎ターン、効果が切れるまでの時間に比例してダメージを与える。\n\n毒の残りターン%s。
actors.buffs.poison.heromsg=あなたは毒されている！
actors.buffs.poison.name=毒入り
actors.buffs.poison.ondeath=あなたは毒で死んだ...。
actors.buffs.poison.rankings_desc=毒に冒された
actors.buffs.preparation.action_name=準備ストライキ
actors.buffs.preparation.assassinated=暗殺者
actors.buffs.preparation.desc=アサシンは辛抱強く待っており、影から攻撃する準備をしている。
actors.buffs.preparation.desc_blink=敵を攻撃する前に敵に向かって瞬きをすることができ、その最大距離は_%d._。
actors.buffs.preparation.desc_dmg=彼の次の攻撃は_%1$d%%ボーナスダメージ_を与え、_%2$d%%体力_以下の通常の敵、または_%3$d%%体力_以下のボスを処刑する。
actors.buffs.preparation.desc_dmg_likely=また、攻撃はより大きなダメージを与えやすくなる。
actors.buffs.preparation.desc_invis_next=より強い攻撃のためのターン：%d._。
actors.buffs.preparation.desc_invis_time=使用済みは見えなくなる_%d._
actors.buffs.preparation.name=準備
actors.buffs.preparation.no_target=そこに攻撃するものは何もない。
actors.buffs.preparation.out_of_reach=その目標は手の届かないところにある。
actors.buffs.preparation.prompt=攻撃対象を選択する！\n最大ブリンク距離%d
actors.buffs.prismaticguard.desc=あなたはプリズムのイメージに守られている。敵が現れると、プリズム・イメージは行動を開始し、あなたを守る！\n\nアクティブでない間、プリズム・イメージは受けたダメージから着実に回復する。\n\n現在のHPzxqph0zxq/zxqph1zxq.
actors.buffs.prismaticguard.desc_many=このプリズムのイメージもまた、《多数の力》の恩恵を受けている。残りターン：%d。
actors.buffs.prismaticguard.name=プリズムガード
actors.buffs.recharging.desc=エネルギーがあなたの中を駆け巡り、杖やステッキのチャージ率が向上する。\n\nこのバフは毎ターン、通常のチャージに加えて現在のチャージを1/4増加させる。\n\n残りチャージターン%s。
actors.buffs.recharging.name=充電
actors.buffs.revealedarea.desc=ダンジョン内のあるエリアが、一時的に主人公に公開された。\n\n残りターン%s.
actors.buffs.revealedarea.name=明らかになった領域
actors.buffs.revealedchar.desc=このキャラクターは主人公の前に姿を現す。\n\n残りターン%s.
actors.buffs.revealedchar.name=明らかに
actors.buffs.roots.desc=根（魔法または自然）が足をつかみ、地面に押しつける。\n\n根は対象をその場に固定し、移動やほとんどの移動能力を不可能にする。テレポート効果を含め、他の行動には影響しない。\n\n根の残りターン%s。
actors.buffs.roots.heromsg=動くことはできない！
actors.buffs.roots.name=根付き
actors.buffs.scrollempower.desc=魔道士が最近読んだ巻物のエネルギーが彼の杖に力を与えている！\n\nレベルアップ：+%1$d.\n残りザップ数%2$d。
actors.buffs.scrollempower.name=スクロール・エンパワー
actors.buffs.shadows.desc=あなたは周囲の影に溶け込み、見えなくなり、代謝が落ちる。\n\n透明になっている間、敵は君を攻撃したり追ったりすることができない。ほとんどの物理攻撃や魔法効果（巻物や杖など）は即座に透明化を解除する。さらに、シャドーメルド中は空腹速度が遅くなる。\n\n影から離れるか、敵があなたに接触するまで、あなたは影に包まれたままである。
actors.buffs.shadows.name=影が薄い
actors.buffs.slow.desc=スロー・マジックはターゲットの時間速度に影響を与え、彼らにとってはすべてが超高速で動いている。\n\nスローされたキャラクターはすべての行動を通常の2倍の時間で行う。\n\nスローの残りターン%s。
actors.buffs.slow.name=遅い
actors.buffs.snipersmark.action_name_snapshot=スナップショット
actors.buffs.snipersmark.action_name_sniper=狙撃
actors.buffs.snipersmark.action_name_volley=バレー
actors.buffs.snipersmark.desc=スナイパーは最近攻撃したターゲットに照準を合わせる。弓を使った特殊攻撃が可能で、弓の強化方法によって異なる。\n\nオーグメンテーションされていない弓はスナップショットを放つ。\n\nスピードアップのためにオーグメンテーションされた弓は、3本の矢からなる_ボレー_を放つ。各矢のダメージは減少するが、エンチャントを発動させることができる。この矢は1ターンで放たれる。\n\nこの射撃は命中が保証され、標的との距離に応じてボーナスダメージを与え、射撃に2ターンかかる。\n\n残りターン%s。
actors.buffs.snipersmark.name=狙撃痕
actors.buffs.soulmark.desc=ウォーロックはこのクリーチャーの魂を利用し、物理的ダメージを受けると回復することができる。\n\nソウルマークの残りターン%s。
actors.buffs.soulmark.name=せいき
actors.buffs.stamina.desc=無限のスタミナを持ち、より速く移動できる！\n\nスタミナの効果中は+50%%のスピードで走りますが、それ以外の行動は通常のスピードで行います。\n\n残りスタミナターン%s。
actors.buffs.stamina.name=スタミナ
actors.buffs.terror.desc=恐怖とは、対象を制御不能のパニックに追い込む操作魔法である。\n\n恐怖に陥ったキャラクターは相手から逃げることを余儀なくされ、できるだけ多くのドアや壁を間に挟もうとする。しかし、痛みのショックは恐怖の持続時間を短くする。\n\n恐怖の残りターン%s.
actors.buffs.terror.name=慄然
actors.buffs.toxicimbue.desc=あなたには毒のエネルギーが宿っている！\n\n動き回るたびに毒ガスが吹き出し、敵にダメージを与える。あなたは効果時間中とその後数ターンの間、毒ガスと毒に対する免疫がある。\n\nターンの間、毒が残る：%s。
actors.buffs.toxicimbue.name=毒性を帯びた
actors.buffs.vertigo.desc=世界全体が回転しているとき、まっすぐ歩くことは難しい。\n\nめまいの影響を受けている間、移動しようとするキャラクターは、意図した方向ではなく、ランダムな方向に進んでしまう。\n\nめまいの残りターン%s.
actors.buffs.vertigo.name=めまい
actors.buffs.vulnerable.desc=脆弱性の魔法は、キャラクターが受けるすべての物理ダメージを33%%増加させる。\n\n残りターン%s。
actors.buffs.vulnerable.heromsg=もろさを感じる！
actors.buffs.vulnerable.name=傷つきやすい
actors.buffs.wandempower.desc=ダメージを与える杖がパワーアップし、数ヒットの間、与えるダメージが増加する。\n\nボーナスダメージ：%1$d。\n残りヒット数%2$d。
actors.buffs.wandempower.name=ワンズ・エンパワード
actors.buffs.weakness.desc=すべてが急に重く感じられる。\n\n弱体化魔法はキャラクターの体力を減少させ、与えるダメージが33%%減少する。\n\n弱体化の残りターン%s。
actors.buffs.weakness.heromsg=弱っていると感じる！
actors.buffs.weakness.name=弱った
actors.buffs.wellfed.desc=満足感と満腹感がある。\n\n十分な栄養を摂っている間は、空腹感が増すことはなく、時間の経過とともに体力が回復していく。\n\n残りターン%d.
actors.buffs.wellfed.name=栄養満点
actors.char.def_verb=身をかわす
actors.char.defeat=あなたは%sを破った。
actors.char.immune=免疫
actors.char.invulnerable=不死身
actors.char.kill=%sに殺されたのか...。
actors.hero.abilities.armorability.cost=料金%d_
actors.hero.abilities.armorability.no_target=そこに狙いはない！
actors.hero.abilities.armorability.prompt=ターゲットとする場所を選ぶ
actors.hero.abilities.armorability.self_target=自分をターゲットにすることはできない！
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=クレリックの体から放射エネルギーが発せられる。この形態にある間、クレリックは攻撃範囲を2広げ（自分から放出される聖なるエネルギーによる）、聖なるトームのチャージを消費するたびにシールドを10得る。また、アセンデッドフォームのタレントによってアンロックされる呪文を唱えることができる。\n\nアセンデッドフォームとその呪文によって与えられるシールドは通常減衰しないが、アセンデッドフォームが終了すると即座に消滅する。\n\n現在のシールド%1$d.\n残りターン数%2$d。
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=しんこうけい
actors.hero.abilities.cleric.ascendedform.desc=クレリックは自分自身から聖なるエネルギーを投射し、10ターンの間、拡張された放射形態をとる。この形態にある間、クレリックは新たな呪文を唱えることができ、攻撃範囲2、シールド30を得る。\n\nアセンデッドフォームとその呪文によるシールドは通常減衰しないが、アセンデッドフォームが終了すると即座に薄れる。アセンデッド・フォームの持続時間をリフレッシュするために、この能力を再使用することができる。
actors.hero.abilities.cleric.ascendedform.name=しんこうけい
actors.hero.abilities.cleric.ascendedform.short_desc=クレリックは_アセンデッドフォームになり、新たな呪文、攻撃範囲、シールドを得る。
actors.hero.abilities.cleric.powerofmany$lightally.desc=クレリックの冒険仲間のコピーで、固体の光でできている。他のヒーローの形をしているが、そのヒーロー特有の能力は持たない。この仲間はPower of Manyが適用されている限り持続する。\n\nこの味方はPower of Manyのアーマーアビリティを再使用することで、コストをかけずに指示することができる。
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=味方が攻撃に移る！
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=味方はその位置に移動する。
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=味方があなたの後を追って移動する。
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=このキャラクターは特定のヒーローアーマー能力を持つ。
actors.hero.abilities.cleric.powerofmany$lightally.name=軽い味方
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=この味方はPower of Manyによってパワーアップしており、与えるダメージ+25%%、受けるダメージ-25%%を与える。また、クレリックと視界を共有し、パワー・オブ・メニーの恩恵を受けることができる。\n\nPower of Manyはプリズム・イメージのような味方が隠れても持続するが、持続時間はカウントダウンする。\n\n残りターン%s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=多勢
actors.hero.abilities.cleric.powerofmany.ally_exists=あなたにはすでに力強い味方がいる。
actors.hero.abilities.cleric.powerofmany.desc=クレリックは_Power of Many_をチャネリングし、100ターンの間、既存の味方をパワーアップさせるか、新たにパワーアップした味方を生み出す。何もない場所をターゲットにすると新たな味方を生み出す。\n\nPower of Manyによってパワーアップしている間、味方は＋25％のダメージを与え、-25％のダメージを受け、クレリックと視界を共有する。また、能力使用時に25のシールドを得る。\n\nクレリックはまた、パワーが与えられた味方としか唱えられない3つの新しい呪文も得る。これらの呪文が発動している間、Power of Manyは終了しない。
actors.hero.abilities.cleric.powerofmany.name=多勢
actors.hero.abilities.cleric.powerofmany.no_vision=見えない場所は狙えない。
actors.hero.abilities.cleric.powerofmany.only_allies=味方にしか力を与えることはできない。
actors.hero.abilities.cleric.powerofmany.prompt_ally=光を味方に
actors.hero.abilities.cleric.powerofmany.prompt_default=同盟国または場所を選ぶ
actors.hero.abilities.cleric.powerofmany.short_desc=クレリックは_Power of Many_をチャネリングし、既存の味方に力を与えたり、新たな味方を生み出したりする。
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=ボディ・フォームに割り当てる
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=マインドフォームに割り当てる
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=スピリット・フォームに割り当てる
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=トリニティに吹き込むエフェクトを選択します。確認の前に追加情報が表示されます。
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_ボディフォーム%s._。
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_マインドフォーム%s._。
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Spirit Form：%s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=トリニティのどのフォームを使用するかを選択する。異なるフォームの効果を同時に有効にすることができる。
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=トリニティはこのアーティファクトの遠隔錬金術の効果を_%2$sのコストで適用する_。
actors.hero.abilities.cleric.trinity.chaliceofblood_use=トリニティはこのアーティファクトのパッシブ・ヘルスのリジェネ効果を20ターンの間_+%1$d_で適用する。
actors.hero.abilities.cleric.trinity.cost=この能力のチャージ・コストはさまざまだが、多くの場合_%d._である。
actors.hero.abilities.cleric.trinity.desc=クレリックはアーマー・アビリティの_Trinity_を獲得し、3つの新しい呪文を使うことでさまざまなアイテムの効果に割り当てることができる。これらの呪文はそれぞれ、クレリックがこの作戦中に確認したさまざまな種類の装備品の効果をエミュレートすることに焦点を当てている：ボディ・フォーム（武器と鎧）、マインド・フォーム（杖と投擲武器）、スピリット・フォーム（指輪とアーティファクト）。\n\n三位一体の各形態は一度に1つの効果を付与することができ、クレリックは三位一体の使用時にどれを発動するかを選ぶ。トリニティはすでに装備しているものと効果が重複することはない。
actors.hero.abilities.cleric.trinity.driedrose_use=トリニティはこのアーティファクトの効果で、_+%1$d_ゴーストのHPを持つ堕落した味方の亡者を召喚する。
actors.hero.abilities.cleric.trinity.ench_glyph_use=トリニティはこの効果を_%1$dターンの間_適用する。
actors.hero.abilities.cleric.trinity.etherealchains_use=トリニティはこのアーティファクトのチェーン・キャスト効果を_+%1$d_のリーチで適用し、_%2$sのコストを支払う。
actors.hero.abilities.cleric.trinity.hornofplenty_use=トリニティはこのアーティファクトのスナッキング効果を、_%2$sのコストで適用する_。
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=トリニティはこのアーティファクトの敵から奪う効果を_+%1$d_で、_%2$sのコストで適用する。
actors.hero.abilities.cleric.trinity.name=三位一体
actors.hero.abilities.cleric.trinity.no_duplicate=トリニティは、すでに装備している効果を複製することはできない！
actors.hero.abilities.cleric.trinity.no_imbue=トリニティは現在、どの形態にも効果が設定されていない！
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=トリニティはこの強力な効果を_%1$dターンの間_適用する。
actors.hero.abilities.cleric.trinity.ring_use=トリニティはこのリングの効果を20ターンの間、_+%1$d_で適用する。
actors.hero.abilities.cleric.trinity.sandalsofnature_use=トリニティはこのアーティファクトの根源効果を、_%2$sのコストで、ランダムな有害な種で適用する。
actors.hero.abilities.cleric.trinity.short_desc=クレリックは「三位一体」のアビリティを得る。これらのアビリティは見たことのある装備品を模したもので、新しい呪文を使うことで割り振ることができる。
actors.hero.abilities.cleric.trinity.skeletonkey_use=%2$sのコストで、トリニティはこのアーティファクトのインサート効果を適用する。
actors.hero.abilities.cleric.trinity.talismanofforesight_use=トリニティはこのアーティファクトの scry 効果を _+%1$d_ で、_%2$s のコストで適用する。
actors.hero.abilities.cleric.trinity.thrown_use=トリニティはこの武器を_+%1$d_に投げつける。
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=トリニティはこのアーティファクトの時間凍結の効果を_%1$d_ターン継続させるが、_%2$s_チャージを消費する。
actors.hero.abilities.cleric.trinity.unstablespellbook_use=トリニティはこのアーティファクトのランダム・スクロールの効果を_%1$d/10_の確率で適用し、_%2$sのコストでエキゾチック・バージョンを追加コストなしで提供する。
actors.hero.abilities.cleric.trinity.wand_multi_use=トリニティは_+%1$d_でこの_マルチチャージ_ワンドを_+%2$sチャージ_でザッピングする。
actors.hero.abilities.cleric.trinity.wand_use=トリニティはこの杖を_+%1$d_でザッピングする。
actors.hero.abilities.duelist.challenge$duelparticipant.desc=このキャラクターはデュエルに参加している。彼らやその味方や手下は、他の者が凍結されている間、普通に行動することが許される。\n\n決闘は決められた時間、参加者のどちらかが死ぬまで、または参加者が互いに5タイル以上離れるまで続く。\n\n残りターン%d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=デュエル参加者
actors.hero.abilities.duelist.challenge.ally_target=敵にしか挑戦できない。
actors.hero.abilities.duelist.challenge.already_dueling=一度に1つの決闘しかできない。
actors.hero.abilities.duelist.challenge.desc=デュエリストは近くにいる敵に決闘を申し込む。その敵は彼女と戦うことを余儀なくされ、他の敵は一時的に時間が止まってしまう。\n\n対象はDuelistから5タイル以内にいる到達可能な敵でなければならない。決闘は10ターン経過するか、敵が死亡するか、デュエリストが敵から5タイル以上離れるまで続く。\n\n凍った敵は無敵である。デュエリストの味方はこの能力で凍結されないが、ボスをターゲットにした場合はそのミニオンも凍結されない。
actors.hero.abilities.duelist.challenge.distant_target=その敵は挑戦するには遠すぎる。
actors.hero.abilities.duelist.challenge.name=挑戦
actors.hero.abilities.duelist.challenge.prompt=挑戦する敵を選ぶ
actors.hero.abilities.duelist.challenge.short_desc=デュエリストは近くの敵に決闘を申し込む。
actors.hero.abilities.duelist.challenge.unreachable_target=目標に到達できなければならない。
actors.hero.abilities.duelist.elementalstrike.desc=デュエリストは敵または場所を攻撃し、命中が保証された通常攻撃を行い、65度の円錐状に最大4タイルまで移動する魔法効果を撒き散らす。この魔法効果はデュエリストの主武器のエンチャントによって変化する。
actors.hero.abilities.duelist.elementalstrike.generic_desc=エンチャント無しのエレメンタルストライクは小さな魔法を放ち、範囲内の全ての敵に6～12ダメージを与える。
actors.hero.abilities.duelist.elementalstrike.name=要素攻撃
actors.hero.abilities.duelist.elementalstrike.short_desc=デュエリストは_エレメンタルストライクを行い、武器エンチャントに基づいた効果を円錐状のAOEに広げる。
actors.hero.abilities.duelist.feint.bad_location=その場所に移動することはできない。
actors.hero.abilities.duelist.feint.desc=デュエリストは隣接するタイルにダッシュしながら攻撃をフェイクし、自分の残像を一瞬残す。デュエリストを攻撃していた敵は、代わりに彼女の残像を攻撃する。\n\n残像を攻撃した敵は混乱し、次の行動をキャンセルして奇襲を受ける隙を作る。
actors.hero.abilities.duelist.feint.name=フェイント
actors.hero.abilities.duelist.feint.prompt=ダッシュする場所を選ぶ
actors.hero.abilities.duelist.feint.short_desc=デュエリストは_Feints_し、隣接するタイルにダッシュしながら攻撃のフリをする。敵は彼女の残像を攻撃し、反撃を受ける隙を作る。
actors.hero.abilities.duelist.feint.too_far=その場所はあなたに隣接していない。
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=ハントレスが一時的にパワーアップし、移動速度と弓の攻撃速度が上がる。\n\n残りターン%s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=自然の力
actors.hero.abilities.huntress.naturespower.desc=ハントレスは一時的に自身と弓を自然の力で強化する！これは8ターン持続する。\n\nこの間、ハントレスの移動速度は2倍になり、弓での攻撃速度は33%速くなる。スナイパーが特殊攻撃を使用している場合、弓のボーナス効果は発動しない。
actors.hero.abilities.huntress.naturespower.name=自然の力
actors.hero.abilities.huntress.naturespower.short_desc=ハントレスは_自然の力_を呼び出し、移動速度と弓の発射速度を短時間上昇させる。
actors.hero.abilities.huntress.spectralblades.desc=ハントレスは敵に向かってスペクトラル・ブレードを放つが、これは近接武器による範囲攻撃のように機能する。エンチャントを含め、近接武器の通常の効果がすべて発動する。
actors.hero.abilities.huntress.spectralblades.name=スペクトルブレード
actors.hero.abilities.huntress.spectralblades.short_desc=ハントレスは_Spectral Blades_を対象に投げつけ、現在装備している近接武器に応じたダメージを与える。
actors.hero.abilities.huntress.spirithawk$hawkally.desc=ハントレスが召喚した魔法の鷹。鮮やかなエーテルブルーに光り、頭を常に動かして辺りを見回している。\n\n戦闘能力はあまり高くないが、そのスピードと視力は敵を偵察し、注意をそらすのに優れている。
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=保証されたドッジ残り%d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=残りターン数%d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=鷹が攻撃に移る！
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=鷹はその位置に移動する。
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=鷹があなたの後を追う。
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=このキャラクターは特定のヒーローアーマー能力を持つ。
actors.hero.abilities.huntress.spirithawk$hawkally.name=鶚
actors.hero.abilities.huntress.spirithawk.desc=ハントレスは精霊の鷹を召喚する。タカは100ターン持続し、タカに指示を与えるのにチャージはかからない。\n\n鷹の体力と攻撃力は最低だが、素早くて回避能力が高く、正確である。常にハントレスと視界を共有している。火や毒ガスのようなエリア・バウンド効果を受けない。特に指示がない限り攻撃はしない。
actors.hero.abilities.huntress.spirithawk.name=鶚
actors.hero.abilities.huntress.spirithawk.no_space=近くにフリースペースはない。
actors.hero.abilities.huntress.spirithawk.short_desc=ハントレスは_Spirit Hawkを召喚し、偵察や敵の注意をそらすのに役立つ。
actors.hero.abilities.mage.elementalblast.desc=魔道士は魔力の爆風を放ち、最大4タイル先までの円形領域をカバーし、最大15～25ダメージを与える。エレメンタルブラストの具体的な効果は、メイジの杖に仕込まれているワンドによって異なる。
actors.hero.abilities.mage.elementalblast.generic_desc=エレメンタルブラストの効果は、敵や味方にザッピングしたときの杖の効果と似ている。
actors.hero.abilities.mage.elementalblast.name=エレメンタルブラスト
actors.hero.abilities.mage.elementalblast.no_staff=スタッフなしではこの能力は使えない。
actors.hero.abilities.mage.elementalblast.short_desc=杖から_エレメンタルブラスト_を放ち、杖のワンドによって異なる効果で周囲を広く覆う。
actors.hero.abilities.mage.warpbeacon.depths=深度間をワープすることはできない！
actors.hero.abilities.mage.warpbeacon.desc=メイジはビーコンを設置し、そこに自由にワープすることができる。ビーコンを設置するには1ターンかかるが、ビーコンにワープするのは一瞬である。\n\nメイジはデフォルトではフロア間をワープしたり、ビーコンを使って鍵のかかった部屋などアクセスできない場所に行くことはできない。メイジは敵の中にテレポートすることができ、敵を押しのけることができる。
actors.hero.abilities.mage.warpbeacon.invalid_beacon=そこにビーコンを置くことはできない！
actors.hero.abilities.mage.warpbeacon.locked_floor=施錠されたフロアから出ることはできない！
actors.hero.abilities.mage.warpbeacon.name=ワープビーコン
actors.hero.abilities.mage.warpbeacon.short_desc=魔道士は現在地に_Warping Beacon_を置き、そこから即座にテレポートで戻ることができる。
actors.hero.abilities.mage.warpbeacon.too_far=あの場所は遠すぎる！
actors.hero.abilities.mage.warpbeacon.window_cancel=キャンセル
actors.hero.abilities.mage.warpbeacon.window_clear=クリアビーコン
actors.hero.abilities.mage.warpbeacon.window_desc=あなたのビーコンは現在%d階に設置されています。
actors.hero.abilities.mage.warpbeacon.window_tele=テレポート・トゥ・ビーコン
actors.hero.abilities.mage.wildmagic.desc=Mageは杖のパワーを解き放ち、1ターンに最大4回まで杖をランダムに発射する。杖はこの効果に含まれない。\n\n各ワンドのレベルも2ずつ上がり、最大で+3される。このアビリティは1回発射するごとに杖のチャージを半分消費し、1本の杖を2回以上発射することはできない。
actors.hero.abilities.mage.wildmagic.name=ワイルドマジック
actors.hero.abilities.mage.wildmagic.no_wands=あなたはザッピングする杖を持っていない！
actors.hero.abilities.mage.wildmagic.short_desc=メイジは杖に込められた_ワイルド・マジックを放ち、1ターンの間に選んだターゲットにランダムに複数回放つ。
actors.hero.abilities.ratmogrify$transmograt.desc=この敵はネズミに変身した。私に言わせれば、大きな進歩だ！ - ネズミの王
actors.hero.abilities.ratmogrify$transmograt.name=ラットモグリファイド %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=戦死者：ネズミ化した敵
actors.hero.abilities.ratmogrify.cant_transform=それをネズミ算式にすることはできない！
actors.hero.abilities.ratmogrify.desc=ヒーローは6ターンの間、敵をネズミに変身させる！ボス、味方、ラットは変身できない。\n\nラット化した敵は元のステータスを維持するが、アビリティを持たない。
actors.hero.abilities.ratmogrify.name=ラットモグリファイ
actors.hero.abilities.ratmogrify.short_desc=ヒーローは敵を_Ratmogrifize_する！これにより、敵は一時的に何の能力も持たないネズミに変身する。
actors.hero.abilities.ratmogrify.too_strong=あの敵はラットモグリフィケーションするには強すぎる！
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=この敵はマークされ、25%%のボーナスダメージを受ける。\n\n残りターン%s。
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=死相
actors.hero.abilities.rogue.deathmark.ally_target=マークできるのは敵のみ
actors.hero.abilities.rogue.deathmark.desc=選んだ敵に印をつけ、25％の追加ダメージを与える。マークは即座に適用され、5ターン持続する。\n\nマークされた敵はボーナスダメージを受けるが、マークが切れるまで死ぬことはない。マークが切れた時点で敵のHPが0の場合、即座に死亡する。
actors.hero.abilities.rogue.deathmark.name=死印
actors.hero.abilities.rogue.deathmark.short_desc=ローグは選んだ敵に_死の印_をつける。マークされた敵はボーナス・ダメージを受けるが、マークが終了するまで死ぬことはない。
actors.hero.abilities.rogue.shadowclone$shadowally.desc=影のような闇から作られたローグのコピー。それはじっと佇み、虚ろな目と、そこから湯気のように立ち上る小さな闇のしずくを持っている。\n\nこのクローンはローグの完全なコピーではないが、それでもまともなファイターであり、適切な才能があればローグの装備の恩恵を受けることができる。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=あなたのクローンが攻撃に移る！
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=あなたのクローンはその位置に移動する。
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=あなたのクローンがあなたの後を追って動く。
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=このキャラクターは特定のヒーローアーマー能力を持つ。
actors.hero.abilities.rogue.shadowclone$shadowally.name=シャドウローグ
actors.hero.abilities.rogue.shadowclone.desc=ローグは自分自身の影を模したクローンを召喚し、戦闘を支援させることができる。影のクローンにチャージはかからない。\n\nクローンのHPは80で、アーマーはなく、10～20のダメージを与える。これらの特性はすべてタレントで改善することができ、クローンはヒーローが持つ武器やアーマーの恩恵を受けることができる。
actors.hero.abilities.rogue.shadowclone.name=シャドークローン
actors.hero.abilities.rogue.shadowclone.short_desc=ローグは_Shadow Clone_を召喚し、戦闘を支援させることができる。
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=どういうわけか、敵はこの木製のおとりこそが本物のローグだと簡単に信じ込んでしまう！
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=このキャラクターは特定のヒーローアーマー能力を持つ。
actors.hero.abilities.rogue.smokebomb$ninjalog.name=木製デコイ
actors.hero.abilities.rogue.smokebomb.desc=ローグは煙爆弾を投げ下ろし、6タイル先まで瞬きをする。ハザードや敵の間を通り抜けることはできるが、壁などの固い地形を通り抜けることはできない。\n\nローグの元の位置に隣接している敵は5ターンの間、目が見えなくなる。
actors.hero.abilities.rogue.smokebomb.fov=視野内の何もない場所にしかジャンプできない。
actors.hero.abilities.rogue.smokebomb.name=発煙筒
actors.hero.abilities.rogue.smokebomb.prompt=ジャンプする場所を選ぶ
actors.hero.abilities.rogue.smokebomb.short_desc=ローグはまばたきをしながら_Smoke Bomb_を投げる。元の居場所付近の敵の目をくらませる。
actors.hero.abilities.warrior.endure$enduretracker.desc=ウォリアーは耐えたダメージに応じたボーナスダメージを与えるようになった。\n\nボーナスダメージ%1$d\n左ヒット: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=我慢
actors.hero.abilities.warrior.endure.desc=Warriorは3ターンの間、すべてのソースから受けるダメージが半分になる。この減少はアーマーなどのダメージ抵抗効果の前に適用される。\n\n耐えた後、10ターン以内の戦士の次の攻撃はボーナス・ダメージを得る。このボーナス・ダメージは、耐える間に彼に与えられたすべてのダメージの半分に等しく、ダメージ軽減効果の前に適用される！\n\n戦士にコンボがある場合、このアビリティを使用すると残り時間が3ターン増加する。
actors.hero.abilities.warrior.endure.name=耐える
actors.hero.abilities.warrior.endure.short_desc=戦士は_耐える_、数ターンをスキップするが、高いダメージ耐性を得る。そして、耐えたダメージに応じたボーナスダメージを与える。
actors.hero.abilities.warrior.heroicleap.desc=ウォリアーは狙った場所に向かって跳躍し、邪魔な敵や危険を乗り越える。ただし、壁や固い地形を飛び越えることはできない。
actors.hero.abilities.warrior.heroicleap.name=雄飛
actors.hero.abilities.warrior.heroicleap.prompt=跳ぶ方向を選ぶ
actors.hero.abilities.warrior.heroicleap.short_desc=ウォリアーは敵や危険の上空を航行しながら、狙った場所に向かって_Heroic Leap_を行う。
actors.hero.abilities.warrior.shockwave.desc=ウォリアーは地面を叩きつけ、60度の円錐状に最大5タイルまで伝わる衝撃波を発生させる。\n\nこの衝撃波に巻き込まれた敵は5ターンの間戦闘不能になる。また、5～10ダメージを受け、さらにウォリアーの体力が10を超えるごとに1～2ダメージを追加する。
actors.hero.abilities.warrior.shockwave.name=ショックウェーブ
actors.hero.abilities.warrior.shockwave.short_desc=ウォリアーは地面を叩きつけて円錐状のAOEに_Shockwave_を放つ。衝撃波に巻き込まれた敵はダメージを受け、戦闘不能になる。
actors.hero.hero.key_distracted=鍵がなかなか開かないんだ。
actors.hero.hero.leave=まだ出ちゃダメだよ、下にダンジョンの残りが待っているんだから！
actors.hero.hero.level_cap=強くなることはできないが、経験がパワーを与えてくれる！
actors.hero.hero.level_up=レベルアップ！
actors.hero.hero.locked_chest=このチェストには鍵がかかっていて、あなたはその鍵を持っていない。
actors.hero.hero.locked_door=一致するキーがない
actors.hero.hero.name=あなた
actors.hero.hero.new_level=レベルアップ！+精度、回避、HP+5！
actors.hero.hero.new_talent=タレントポイント+1
actors.hero.hero.noticed_smth=あなたはあることに気づいた。
actors.hero.hero.pain_resist=痛みは眠りたい衝動を抑えてくれる。
actors.hero.hero.revive=アンクは生命エネルギーを爆発させる！
actors.hero.hero.search=探索
actors.hero.hero.search_distracted=集中するのは難しいし、検索するのは疲れる。
actors.hero.hero.unspent=未使用のタレント・ポイントがある！
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=あなたは運べない%s。
actors.hero.hero.you_now_have=あなたが拾った%s。
actors.hero.heroclass.cleric=クレリック
actors.hero.heroclass.cleric_desc=クレリックは、さまざまな呪文を唱えるために使用できる、固有の聖なる宝珠を持つ。\n\nクレリックの才能のほとんどは、呪文の習得やアップグレードに集中している。\n\nクレリックはまた、棍棒、布製の鎧、水筒、ビロードのポーチを持っている。\n\nクレリックは自動的に識別する：\n_識別の巻物\n純潔のポーション\n_呪い除去の巻物
actors.hero.heroclass.cleric_desc_short=クレリックは神聖な魔法を使うスペルキャスターである。彼らは才能によって呪文を学び、アップグレードすることができる。
actors.hero.heroclass.cleric_unlock=クレリックのロックを解除するには、呪われた装備品の呪いを完全に浄化します。
actors.hero.heroclass.duelist=決闘者
actors.hero.heroclass.duelist_desc=デュエリストは、時間経過とともにチャージされる特殊能力を持つ「ユニーク・レイピア」を持ってスタートする。\n\nゲームに登場するすべての武器には、デュエリストが使用できる別の特殊能力がある。\n\nデュエリストはまた、_投げ槍2本、布製の鎧、水筒、ビロードのポーチを持ってスタートする。\n\nデュエリストは自動的に識別する：\n_識別の巻物\n"強さのポーション\n鏡像の巻物
actors.hero.heroclass.duelist_desc_short=デュエリストは武器の達人であり、自分の武器を使って武器の特殊能力を発動させることができる。 この特殊能力は武器ごとに異なる。
actors.hero.heroclass.duelist_unlock=デュエリストをアンロックするには、体力ペナルティのないティア2以上の武器を装備すること。
actors.hero.heroclass.huntress=ハントレス
actors.hero.heroclass.huntress_desc=ハントレスは、無限に矢を放つことができるユニークな弓を持っている。\n\nハントレスは背の高い草を踏まずに移動できる。\n\nハントレスはまた、_スタッズ付きの手袋_、布製の鎧、ウォータースキン、ベルベットのポーチを持っている。\n\nハントレスは自動的に識別する：\n_識別の巻物\n"マインド・ビジョンのポーション\n"子守歌の巻物
actors.hero.heroclass.huntress_desc_short=ハントレスは投擲武器の達人であり、無限の矢を持つ_魔法の弓を持っている。彼女はまた、背の高い草を踏みつけることなく移動する。
actors.hero.heroclass.huntress_unlock=ハントレスをアンロックするには、「1試合中に投擲武器で敵を10回殴る」。
actors.hero.heroclass.mage=メイジ
actors.hero.heroclass.mage_desc=杖は杖よりもチャージが早く、チャージ量も1多い。この杖には、ダンジョン内で見つけた杖を装着することができる。\n\nこの杖には、ダンジョンで見つけた杖であればどのようなものでも、_魔法ミサイルの杖_を埋め込むことができる。\n\n魔道士は自動的に識別する：\n_識別の巻物\n炎のポーション\nアップグレードの巻物
actors.hero.heroclass.mage_desc_short=メイジはアーケインの専門家であり、杖よりも強力な_魔法の杖_を携えている。その杖には、メイジが見つけたどんなワンドでも_埋め込むことができる。
actors.hero.heroclass.mage_unlock=魔道士のロックを解除するには、アイテムを強くするためにアップグレードの巻物を使用します。
actors.hero.heroclass.rogue=小悪党
actors.hero.heroclass.rogue_desc=ローグは影をまとったマントからスタートし、このマントで自由に透明になることができる。\n\nローグはより遠くから秘密や罠を発見することができる。\n\nローグはまた、短剣、投げナイフ3本、布製の鎧、水筒、ベルベットのポーチを装備している。\n\nローグは自動的に識別する：\n_識別の巻物\n"透明ポーション\n"マジック・マッピングの巻物
actors.hero.heroclass.rogue_desc_short=また、より遠くから秘密や罠を発見することもできる。
actors.hero.heroclass.rogue_unlock=ローグのロックを解除するには、1試合で10回の奇襲攻撃を行うこと。
actors.hero.heroclass.warrior=戦士
actors.hero.heroclass.warrior_desc=ウォリアーは、ヘルスが半分以下になったときにシールドのバーストを与える、_ユニークな壊れた封印_を持ってスタートする。この封印はアーマー間で移動させることができ、1つのアップグレードを転送することができる。\n\nウォリアーはまた、_着古したショートソード_、_投石_3個、布製の鎧、ウォータースキン、ベルベットのポーチを持ってスタートする。\n\nウォリアーは自動的に識別する：\n_識別の巻物\n治癒のポーション\n憤怒の巻物
actors.hero.heroclass.warrior_desc_short=ウォリアーは、破れたシールによって与えられたシールドで追加ダメージに耐える。 シールはアーマー間で移動させることができ、1つのアップグレードを転送する。
actors.hero.heroclass.warrior_unlock=ウォリアーは自動的にアンロックされる。
actors.hero.herosubclass.assassin=アサシン
actors.hero.herosubclass.assassin_desc=アサシンは透明になってから次の攻撃の準備をする。準備が長ければ長いほど、次の攻撃はより強力になる。準備は最大9ターンまで継続する。\n\n準備完了後、アサシンは次の攻撃にボーナスダメージを与え、ターゲットにブリンクし、弱った敵を即死させることもできる。
actors.hero.herosubclass.assassin_short_desc=アサシンは透明になっている間に致命的な攻撃を準備することができる。待つ時間が長ければ長いほど、その攻撃は強力になる。
actors.hero.herosubclass.battlemage=バトルメイジ
actors.hero.herosubclass.battlemage_desc=バトル・メイジは杖で近接攻撃を行なうたびに、あたかも杖に追加エンチャントが施されているかのようなボーナス効果を得る。これらの効果は杖に付与されているワンドに依存し、どのワンドにも独自の効果がある。杖の効果に加え、バトルメイジの杖は攻撃時に0.5チャージを得る。
actors.hero.herosubclass.battlemage_short_desc=バトルメイジは杖を使った近接戦闘にボーナス効果をもたらす。これらの効果は杖に付与されているワンドによって異なる。
actors.hero.herosubclass.berserker=バーサーカー
actors.hero.herosubclass.berserker_desc=Berserkerはアーマーで防がれたダメージも含め、物理ダメージを受けるとRageを得る！怒りは時間経過とともに徐々に消えていくが、HPが低い場合はよりゆっくりと消えていく。\n\n怒りによってバーサーカーは最大+50%のダメージを与えることができる。レイジが最大になるとバーサーク状態になり、バーストシールドを獲得し、シールドが残っている限りレイジを維持することができる。シールドはバーサーカーのアーマーのレベルに応じて変化し、ヘルスが低い場合は大幅に増加する。バーサーカーはバーサークした後に回復する時間が必要である。
actors.hero.herosubclass.berserker_short_desc=バーサーカーはダメージを受けると怒りを蓄積する。Rageはダメージを増加させ、100%でボーナスシールドを発動することができる。
actors.hero.herosubclass.champion=チャンピオン
actors.hero.herosubclass.champion_desc=チャンピオンは近接武器の達人であり、プライマリー・ウェポンに加えてセカンダリー・ウェポンを装備することができる。通常攻撃には主武器を使用するが、瞬時に主武器を持ち替え、どちらの武器の能力も使用することができる。\n\nまた、武器アビリティの最大チャージ数が2増加し、武器アビリティのチャージ速度が+50%される。
actors.hero.herosubclass.champion_short_desc=Champion_は2つの武器を使うことができ、より多くのウェポン・チャージを得ることができる。通常攻撃は主武器を使用するが、武器を持ち替えてどちらの武器の能力も使用できる。
actors.hero.herosubclass.freerunner=フリーランナー
actors.hero.herosubclass.freerunner_desc=Freerunnerは移動するにつれて勢いを増す。10ターン走ると最大10まで勢いを増すことができるが、動きを止めると急速に勢いを失う。Freerunnerは勢いを使い切ることで、勢い1点につき2ターンの間、フリーランニングを始めることができる。\n\nフリーランニング中は2倍の速度で移動し、レベルに比例したボーナス回避を得る。フリーランニングが終了すると、再び勢いをつけるまでにクールダウンがある。
actors.hero.herosubclass.freerunner_short_desc=Freerunner_は走ることで勢いを増し、それを利用してフリーランニングを始めることができる。これによりしばらくの間、スピードと回避のボーナスが得られる。
actors.hero.herosubclass.gladiator=グラディエーター
actors.hero.herosubclass.gladiator_desc=剣闘士は近接武器または投擲武器による攻撃を成功させるたびに1ポイントのコンボを蓄積する。剣闘士が5ターン以内（キル後15ターン以内）に攻撃を成功させなかった場合、コンボはリセットされる。\n\nコンボを溜めていくと、剣闘士は命中が保証されたさまざまなアビリティを使用できるようになる：\n2コンボ：敵をノックバックさせ、コンボを維持する。\n4コンボ：アーマーに応じたダメージを与える\n6コンボ：パリィ、コンボ維持\n8コンボ：ターゲットと近くの敵にダメージを与える\n10コンボ：コンボごとに1回攻撃
actors.hero.herosubclass.gladiator_short_desc=グラディエーターは攻撃を成功させるとコンボが溜まる。コンボを消費してユニークアビリティを使用することができる。
actors.hero.herosubclass.monk=お坊さん
actors.hero.herosubclass.monk_desc=モンクはフィジカル・テクニックの達人である。敵を倒すとエネルギーを得ることができ、このエネルギーは防御やユーティリティに特化したさまざまなアビリティに使用できる。このエネルギーは時間が経っても衰えることはないが、モンクのレベルに応じた上限がある。\n\n1エナジー：拳で素早く攻撃する。\n2エナジー：集中して次の攻撃をかわす\n3エナジー：瞬時に近くにダッシュ\n4エナジー：敵を蹴り飛ばす\n5エナジー：瞑想してステータスをクリアし、杖とアーティファクトのチャージを回復する。
actors.hero.herosubclass.monk_short_desc=モンクは戦っている間にエネルギーを蓄積する。このエネルギーは様々なユニークな能力に使うことができる。
actors.hero.herosubclass.paladin=義侠の士
actors.hero.herosubclass.paladin_desc=パラディンは近接戦闘を重視し、武器や防具とのシナジーを重視した様々な新呪文やアップグレードされた呪文を得る。\n\nパラディンの_Holy Weapon_と_Holy Ward_呪文はより大きなボーナスを与え、既存のエンチャントやグリフを上書きしなくなり、他の呪文を唱えることで拡張できる。\n\nパラディンはまた、ボーナス・ダメージとエンチャント・パワーで近接攻撃を確実にヒットさせる_Smite_呪文を得る。
actors.hero.herosubclass.paladin_short_desc=パラディンは新たな近距離呪文と、ホーリーウェポンとウォードのパワーアップ版を得る。
actors.hero.herosubclass.priest=僧侶
actors.hero.herosubclass.priest_desc=プリーストは、範囲戦闘や魔法のアイテムとの相乗効果を重視した、さまざまな新しい呪文やアップグレードされた呪文を得る。\n\nプリーストは50ターンに1度、_Guiding Light_を無料で唱えることができ、自分の呪文が直接ターゲットした敵を照らし、味方や杖、一部のアーティファクトでイルミネーション・デバフを消費し、そのレベル＋5に等しいボーナス・ダメージを与えることができる。\n\nさらにプリーストは_Radiance_呪文も得る。これは暗闇を払拭し、見えている敵すべてに効果を及ぼし、2チャージを消費してilluminateを発動・適用し、敵を短時間気絶させる。
actors.hero.herosubclass.priest_short_desc=プリーストは新しい遠距離呪文と、パワーアップした導きの光を得る。
actors.hero.herosubclass.sniper=スナイパー
actors.hero.herosubclass.sniper_desc=スナイパーは射撃戦の達人で、その射撃攻撃は敵の装甲を貫く。投擲武器で敵を攻撃すると、敵にスナイパーマークを付け、弓の特殊攻撃で追撃することができる。この特殊攻撃は弓の強化方法によって変化する。\n\n強化されていない弓はスナップショットを放ち、ダメージは軽減されるが即座に発射される。スピードボウは3本の矢を放ち、ダメージは減少するがエンチャントを発動させることができ、発射までに1ターンかかる。ダメージボウは命中が保証され、距離に応じてボーナスダメージを与えるスナイパーショットを放つ。
actors.hero.herosubclass.sniper_short_desc=スナイパーは範囲攻撃で装甲を貫くことができる。投擲武器で攻撃した後、弓による特殊攻撃で追撃することができる。
actors.hero.herosubclass.warden=刑務所長
actors.hero.herosubclass.warden_desc=ウォーデンは自然との強い結びつきがあり、草や植物に関するさまざまなボーナス効果を得ることができる。背の高い草や生い茂った草を、まるで何もない空間のように見通すことができる。\n\nウォーデンは自分が撒いたり植えたりした種の周囲に草を生やし、植物を踏みつけると特殊効果を得る。これらの特殊効果は通常の植物効果に取って代わる。
actors.hero.herosubclass.warden_short_desc=Warden_は背の高い草を見通すことができ、種を植えたり植物を踏みつけたりする際にボーナス効果を得る。
actors.hero.herosubclass.warlock=ワーロック
actors.hero.herosubclass.warlock_desc=ウォーロックはキャラクターにワンドを使用したとき、ソウル・マークを与えるチャンスがある。ソウル・マークを与える確率とその持続時間はワンドのレベルに応じて増加する。\n\n敵にソウル・マークが与えられると、ウォーロックは敵に与えたダメージ5ごとにHPを2回復する！
actors.hero.herosubclass.warlock_short_desc=Warlock_は杖で敵をソウルマークするチャンスがある。マークされた敵に物理ダメージを与えるたびに回復する。
actors.hero.spells.auraofprotection$aurabuff.desc=パラディンは自分の周囲に保護エネルギーを放射している。\n\n近くにいる味方（パラディン自身を含む）はダメージを軽減され、パラディンのアーマー・グリフの効果を得てパワーが上昇する。\n\n残りターン%s.
actors.hero.spells.auraofprotection$aurabuff.name=ほごオーラ
actors.hero.spells.auraofprotection.desc=パラディンは20ターンの間、自身の周囲に輝くオーラで保護エネルギーを放射し始める。パラディンの2タイル以内にいる味方（自身を含む）は受けるダメージが%1$d%%減少し、パワー+%2$d%%でパラディンのアーマーグリフの効果を得る。\n\nこのダメージ軽減は他のダメージ軽減効果(アーマーなど)よりも先に行われる。グリフ威力ブーストは常に適用されるが、この呪文はパラディンのグリフが既に恩恵を受けているキャラクター（パラディン自身やプリズム・イメージなど）に複数回適用させることはできない。
actors.hero.spells.auraofprotection.name=ほごオーラ
actors.hero.spells.auraofprotection.short_desc=パラディンと近くの味方の防御力を上げる。
actors.hero.spells.beamingray$beamingrayboost.desc=この味方は最近Beaming Rayによってテレポートされ、テレポート後に最も近い敵に対してボーナスダメージを与える。また、このバフが発動している間はPower of Manyが切れることはない。\n\n残りターン%s.
actors.hero.spells.beamingray$beamingrayboost.name=こうせん
actors.hero.spells.beamingray.desc=クレリックは味方のパワーを光線に変換し、その光線をある場所に照射する。光線が敵にぶつかると、味方を近くに配置し、敵に向かわせる。\n\n光線の最大射程は%1$dタイルで、4タイル以内にいる最も近い敵に対して10ターンの間、Power of Manyのボーナス・ダメージを+%2$d%%に増加させる。Beaming rayは通常動けない味方をテレポートさせることもできるが、その場合は射程が半分になる。
actors.hero.spells.beamingray.name=こうせん
actors.hero.spells.beamingray.no_space=そこに味方が登場するスペースはない。
actors.hero.spells.beamingray.out_of_range=その場所は圏外だ。
actors.hero.spells.beamingray.short_desc=味方をテレポートさせ、ボーナスダメージを与える。
actors.hero.spells.blessspell.desc=クレリックは自分自身か、目に見える他のキャラクターに聖なる加護を与える。\n\n自分自身にかけると効果は弱まり、%1$dターンの祝福と%2$dのバリアを与える。\n\n他のキャラクターにかけるとより強力になり、%3$dターンの祝福と%4$dのヒーリングを与える。余ったヒーリングはバリアに変換される。
actors.hero.spells.blessspell.name=恵む
actors.hero.spells.blessspell.short_desc=クレリックに祝福と盾、他者に祝福と回復を与える。
actors.hero.spells.bodyform$bodyformbuff.desc=トリニティのボディフォームは、現在使用している武器や防具に装備しているかのように、エンチャントやグリフのパワーを与えている。\n\nなお、ボディ・フォームはすでに恩恵を受けている効果の別のコピーを与えることはできない。\n\n現在の効果%1$s。\n\n残りターン：%2$s.
actors.hero.spells.bodyform$bodyformbuff.name=体型
actors.hero.spells.bodyform.desc=クレリックはこの作戦で確認したエンチャントかグリフを1つ選び、トリニティにその効果を与える。\n\nTrinityが使用されると、クレリックは%dターンの間、選ばれたエンチャントまたはグリフの効果を得る。この一時的なエンチャントやグリフは、通常のエンチャントやグリフと同じ効果を持つ。\n\nこのスペルはTrinityが現在付与されている他のボディ効果に取って代わる。
actors.hero.spells.bodyform.name=体型
actors.hero.spells.bodyform.short_desc=Trinityをエンチャントやグリフに割り当てる。
actors.hero.spells.cleanse.desc=自身と見えている味方の有害な状態異常を全て解除する。呪文終了後、影響を受けた全てのキャラクターは%1$dターンのデバフ免疫と%2$dバリアを得る。
actors.hero.spells.cleanse.name=清める
actors.hero.spells.cleanse.short_desc=デバフを解除し、シールドを付与する。
actors.hero.spells.clericspell.charge_cost=料金%d
actors.hero.spells.clericspell.invalid_enemy=その敵をターゲットにすることはできない。
actors.hero.spells.clericspell.invalid_target=その場所をターゲットにすることはできない。
actors.hero.spells.clericspell.no_target=そこに目標はない。
actors.hero.spells.clericspell.prompt=ターゲットを選ぶ
actors.hero.spells.divineintervention.desc=クレリックはトームから莫大なパワーを自身と味方に注ぎ込み、全員を%1$dシールドにブーストし、Ascended Formを%2$dターン延長する。この呪文の驚異的な防御力は、非常に高いチャージ・コストと天秤にかけたものである。\n\nアセンデッドフォームで付与される他のシールドと同様に、このシールドは通常減衰しないが、アセンデッドフォームが終了すると即座に消滅する。
actors.hero.spells.divineintervention.name=神の介入
actors.hero.spells.divineintervention.short_desc=クレリックと味方のシールドを大幅に強化する。
actors.hero.spells.divinesense$divinesensetracker.desc=このキャラクターは一時的に近くの他のクリーチャーを心で見ることができる！\n\n残りターン%s.
actors.hero.spells.divinesense$divinesensetracker.name=神通力
actors.hero.spells.divinesense.desc=クレリックは周囲に感覚を集中させ、50ターンの間、%dタイルの範囲のマインド・ビジョンを得る。この呪文を唱えるのに時間はかからない。
actors.hero.spells.divinesense.name=神通力
actors.hero.spells.divinesense.short_desc=広い範囲で一時的な視野を得る。
actors.hero.spells.flash.desc=クレリックは昇天した姿を近くの場所にチャネリングし、そこにテレポートする。フラッシュはクレリックを、範囲内にあり誰もいない発見された場所にテレポートさせることができる。この魔法は同じアセンデッドフォームで使うたびにトーム・チャージを消費する。
actors.hero.spells.flash.name=フラッシュ
actors.hero.spells.flash.prompt=場所を選ぶ
actors.hero.spells.flash.short_desc=近くの場所にテレポートする。
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Priestは50ターン経過すると、再び無料でGuiding Lightを唱えられるようになる。\n\n残りターン%s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=ガイディング・ライト
actors.hero.spells.guidinglight$illuminated.desc=このキャラクターは導きの光に打たれた結果、光り輝いている。この光は周囲を明るくするほど強くないが、魔法の効果によってクレリックは打撃を当てやすくなる。
actors.hero.spells.guidinglight$illuminated.desc_generic=他のヒーローは灼熱の光のタレントの恩恵を受けるためにilluminatedを使用することができるが、命中率は得られない。
actors.hero.spells.guidinglight$illuminated.desc_priest=プリーストはさらに、輝き、ワンド・ザップ、味方からの攻撃、いくつかのアーティファクトからの効果でilluminatedを消費できる。この方法でilluminatedを使用すると、プリーストのレベル＋5に等しいボーナス魔法ダメージを与える。
actors.hero.spells.guidinglight$illuminated.name=照明付き
actors.hero.spells.guidinglight.desc=クレリックは魔法エネルギーの稲妻を放ち、対象を攻撃して2～8ダメージを与え、照らし出す。照らされた敵に対して次に行う非エンカウントの物理攻撃は命中が保証される。
actors.hero.spells.guidinglight.desc_priest=この呪文はプリーストが唱えるとより強力になる。_50ターンごとに最初に唱える呪文はトーム・チャージを消費せず、イルミネーションは敵に直接影響を与えるラディアンス、ワンド、他のキャラクター、アーティファクトによって消費される。イルミネーションがこのように使用されると、プリーストのレベル＋5に等しいボーナス魔法ダメージを与える。
actors.hero.spells.guidinglight.name=ガイディング・ライト
actors.hero.spells.guidinglight.short_desc=範囲魔法ダメージを与え、命中を保証する。
actors.hero.spells.hallowedground$hallowedterrain.desc=この地は神聖化されている。神聖な地面は敵の動きを遅くし、味方を回復させ、草を広げる。
actors.hero.spells.hallowedground.desc=プリーストは神聖な魔法を近くの地面に集中させ、20ターンの間、神聖な地形の%1$dx%1$dエリアを作り出す。\n\nこの魔法を唱えると、味方全体のHPを15回復し（健康な味方とプリーストはシールドを得る）、敵を短時間根こそぎにし、短い草を広げる。\n\n神聖な地形は1ターンにつき味方のHPを1回復し（健康な味方とプリーストはシールドを得る）、敵を戦闘不能にし、ランダムで背の高い草が生える。\n\n神聖な地形は火によって破壊され、パッシブのリジェネ効果が無効になっているか、プリーストがしばらくExpを獲得していない場合、草が生える。
actors.hero.spells.hallowedground.name=聖地
actors.hero.spells.hallowedground.prompt=場所を選ぶ
actors.hero.spells.hallowedground.short_desc=味方を回復し、敵をスロウにし、AOEで草を撒く。
actors.hero.spells.holyintuition.cursed=あなたはこのアイテムに潜む邪悪な魔力を感じる。
actors.hero.spells.holyintuition.desc=クレリックはアイテムに感覚を集中させ、装備することなくそれが呪われているかどうかを判断する。
actors.hero.spells.holyintuition.name=聖なる直感
actors.hero.spells.holyintuition.prompt=項目を選択する
actors.hero.spells.holyintuition.short_desc=アイテムが呪われているかどうかを識別する。
actors.hero.spells.holyintuition.uncursed=このアイテムには邪悪な魔法は使われていない。
actors.hero.spells.holylance$lancecooldown.desc=司祭は最近《聖なる槍》を唱えたので、再び唱える前に待たなければならない。\n\n残りターン%s.
actors.hero.spells.holylance$lancecooldown.name=ホーリーランス・クールダウン
actors.hero.spells.holylance.desc=プリーストは大量のエネルギーを光でできた破壊的な投げ槍に集中させる。このランスは%1$d-%2$dのダメージを与え、アンデッドと悪魔の対象には常に最大ダメージを与える。\n\nこの呪文は非常に高価で、クールダウンは30ターンである。
actors.hero.spells.holylance.name=聖槍
actors.hero.spells.holylance.short_desc=大ダメージを与える。
actors.hero.spells.holyward$holyarmbuff.desc=そのクレリックは着用した鎧に聖なるエネルギーを吹き込み、既存のグリフを一時的に無効化し、その鎧が追加で1ポイントのダメージをブロックする。\n\n残りターン%s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=パラディンは身に着けた鎧に聖なるエネルギーを吹き込み、その鎧は3ポイントの追加ダメージを防ぐ。\n\n聖なる結界が発動している間に他の呪文を唱えると、1チャージ消費につき10ターン持続時間が延長される。\n\n残りターン%s.
actors.hero.spells.holyward$holyarmbuff.name=聖区
actors.hero.spells.holyward.desc=この呪文を唱えるのに時間はかからない。\n\nこのグリフは50ターンの間持続し、その間アーマーが持つ有益なグリフを上書きする。クレリックはアーマーを持っていなくてもこの効果の恩恵を受ける。
actors.hero.spells.holyward.desc_paladin=この呪文はパラディンが唱えるとより強力になる。追加のダメージブロックは3に増加し、この呪文は既存のグリフを上書きしなくなり、聖なる結界がアクティブな状態で他の呪文を唱えると、使用したチャージ1つにつきその持続時間が10ターン延長される。
actors.hero.spells.holyward.glyph_desc=このグリフはアーマーがブロックできるダメージ量をわずかに増加させる。
actors.hero.spells.holyward.glyph_name=光の%s
actors.hero.spells.holyward.name=聖区
actors.hero.spells.holyward.short_desc=アーマーブロックを強化するグリフを一時的に上書きする。
actors.hero.spells.holyweapon$holywepbuff.desc=クレリックは身につけた武器に聖なるエネルギーを吹き込み、既存のエンチャントを一時的に無効化し、その武器は各攻撃に2魔法ダメージを追加で与える。\n\n残りターン%s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=パラディンは身に着けた武器に聖なるエネルギーを吹き込み、その攻撃は追加で6魔法ダメージを与える。\n\n聖なる武器がアクティブな状態で他の呪文を唱えると、1チャージ消費につき10ターン持続時間が延長される。\n\n残りターン%s.
actors.hero.spells.holyweapon$holywepbuff.name=聖なる武器
actors.hero.spells.holyweapon.desc=クレリックは身に着けている武器に聖なるエネルギーをエンチャントし、その武器で敵を攻撃するたびに追加の魔法ダメージを2与える。この魔法を発動するのに時間はかからない。\n\nこのエンチャントは50ターンの間持続し、その間その武器が持つあらゆる有益なエンチャントを上書きする。武器を使わない攻撃にもこの効果がある。
actors.hero.spells.holyweapon.desc_paladin=この呪文はパラディンが唱えるとより強力になる。追加の魔法ダメージは6に増加し、呪文は既存のエンチャントを上書きしなくなり、聖なる武器がアクティブな状態で他の呪文を唱えると、使用したチャージ1つにつきその持続時間が10ターン延長される。
actors.hero.spells.holyweapon.ench_desc=聖なる武器で攻撃された敵は、魔法による追加ダメージを受ける。
actors.hero.spells.holyweapon.ench_name=ホーリー%s
actors.hero.spells.holyweapon.name=聖なる武器
actors.hero.spells.holyweapon.short_desc=一時的にエンチャントを無効にしてダメージを増加させる。
actors.hero.spells.judgement.desc=クレリックは拳を地面に叩きつけ、光の噴出を引き起こし、目に見える全ての敵にダメージを与える。これは基本で%1$d-%2$dのダメージを与えるが、昇天形態に入ってから（あるいは最後にジャッジメントを唱えてから）クレリックが唱えた呪文1つにつき33%%の追加ダメージを与える。\n\n現在Judgementは%3$d-%4$dダメージを与える。
actors.hero.spells.judgement.name=ジャッジメント
actors.hero.spells.judgement.short_desc=目に見えるすべての敵にダメージを与える。
actors.hero.spells.layonhands.desc=パラディンは手を通して聖なるエネルギーを流し、触れたものを癒したり守ったりする。\n\nパラディンはこの呪文を隣接するキャラクターに唱えて%1$dのヒーリングを与えるか、自分自身に唱えて%1$dのシールドを得ることができる。この呪文による余分なヒーリングはシールドに変換される。\n\nこの呪文は瞬時に唱えられ、繰り返し唱えることができるが、一度に3キャスト分以上のシールドを与えることはできない。
actors.hero.spells.layonhands.name=てをかける
actors.hero.spells.layonhands.short_desc=隣接するキャラクターを即座に回復するか、パラディンをシールドする。
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=クレリックは最近この味方にライフリンクを唱えた。\n\n通常のLife Linkの効果に加え、このキャラクターはダメージを軽減され、クレリックの呪文は片方だけでなくクレリックとこの味方の両方に適用され、このバフが発動している間はPower of Manyの効果が切れない。\n\n残りターン%s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=ライフリンク保護
actors.hero.spells.lifelinkspell.desc=クレリックは自身とパワーアップした味方とのリンクを強化する。このパワーアップしたリンクでは、%1$dターンの間、受けたダメージはヒーローと味方の両方で共有され、Power of Manyの防御力ブーストは-%2$d%%ダメージに増加する。ダメージはアーマーの後、Power of Manyのダメージ軽減の前に共有されることに注意。\n\nこの効果が発動している間、T3以下の有益なクレリックの呪文は、片方だけに適用されるのであれば、クレリックとその味方の両方に適用される。
actors.hero.spells.lifelinkspell.name=ライフリンク
actors.hero.spells.lifelinkspell.short_desc=味方とダメージを共有し、受けるダメージを軽減する。
actors.hero.spells.mindform.desc=クレリックはこのランで確認した杖か投擲武器を選び、トリニティにその効果を与える。\n\nTrinityが使用されると、クレリックは選んだアイテムを＋%dで使用しているかのように1回攻撃できる。これにより、その種類のアイテムを使用することで通常発動するすべての効果が発動する。\n\nこの魔法はTrinityが現在付与されている他のマインド効果に取って代わる。
actors.hero.spells.mindform.name=しんけい
actors.hero.spells.mindform.short_desc=トリニティを杖や投擲武器に割り当てる。
actors.hero.spells.mnemonicprayer.desc=プリーストは特定の対象の全てのバフやデバフの効果時間を%1$dターン延長する祈りを唱える。この呪文を唱えるのに時間はかからない。味方(プリースト自身を含む)にはプラスの効果が、敵にはマイナスの効果が長く続く。\n\nMnemonic Prayerは特定のバフやデバフを一度だけ延長することができ、アーマーアビリティから付与されるバフを延長することはできない。
actors.hero.spells.mnemonicprayer.name=念仏
actors.hero.spells.mnemonicprayer.short_desc=味方/敵のバフ/デバフを延長し、照らされた状態で再付与する。
actors.hero.spells.radiance.desc=プリーストは聖なる光を噴出し、3ターンの間、目に見える全ての敵を魅了する。敵が既に照らされている場合、Radianceはilluminateのボーナスダメージを発動し、その後illuminatedのデバフを適用する。また、現在のフロアが暗い場合、Radianceは100ターンの間プリーストを光らせる。
actors.hero.spells.radiance.name=輝き
actors.hero.spells.radiance.short_desc=目に見える敵を照らし、短時間スタンさせる。
actors.hero.spells.recallinscription$useditemtracker.desc=クレリックは最近、銘記された想起呪文と連動するアイテムを使用した。クレリックはその呪文を唱えてアイテムの効果を繰り返すことができる。\n\n使用したアイテム%1$s。\n\n残りターン%2$s.
actors.hero.spells.recallinscription$useditemtracker.name=最近使用したルーン
actors.hero.spells.recallinscription.desc=クレリックは聖なる魔法を使い、直近の%sターンに使用したルーンストーンや巻物にある魔法のルーンの効果を再び唱える。\n\nリコール・インスクリプションはアップグレードのスクロールの複製には使用できない。このスペルのチャージ・コストは最近使用したアイテムによって異なる：ルーンストーンは2、スクロールは3、エキゾチック・スクロールは4。ルーンストーンの場合は2、スクロールの場合は3、エキゾチックスクロールの場合は4。転成のスクロールや、転成やアップグレードを使って作らなければならない錬金術のアイテムを複製する場合も、このチャージコストは2倍になる。
actors.hero.spells.recallinscription.name=リコール碑文
actors.hero.spells.recallinscription.short_desc=最近使用したルーンストーンやスクロールを繰り返す。
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=このキャラクターと敵の間には薄い光の盾が立っている。攻撃を完全にブロックできるほど強力ではないが、攻撃を和らげることはできる。\n\n残りターン%s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=光の盾
actors.hero.spells.shieldoflight.desc=自身と敵の間に薄い光のバリアを張り、その敵に対するアーマーのブロック力を5ターンの間%1$d-%2$d増加させる。\n\nこの魔法を発動するのに時間はかからないが、複数の対象に対して同時に使用することはできない。
actors.hero.spells.shieldoflight.name=光の盾
actors.hero.spells.shieldoflight.short_desc=対象に一時的な装甲を与える。
actors.hero.spells.smite.desc=パラディンは近接攻撃に正義の破壊力を吹き込む。\n\nSmiteは通常の近接ダメージに加え、エンチャントされていない攻撃の命中を保証し、+300%%のエンチャントパワーを持ち、%1$d～%2$dのボーナス魔法ダメージを与える。\n\nSmiteのボーナス魔法ダメージはパラディンのレベルに応じて変化し、アンデッドや悪魔の敵に対しては常に最大のボーナス魔法ダメージを与える。
actors.hero.spells.smite.name=スマイト
actors.hero.spells.smite.short_desc=ボーナスダメージとエンチャントパワーでヒットを保証する。
actors.hero.spells.spiritform$spiritformbuff.desc=トリニティのスピリット・フォームは現在、あたかもアイテムを装備しているかのように、あなたにアイテムのパワーを与えている。\n\nスピリット・フォームは、あなたがすでに恩恵を受けている効果の別のコピーを提供することはできないことに注意。\n\n現在の効果%1$s.\n\n残りターン%2$s.
actors.hero.spells.spiritform$spiritformbuff.name=精神形
actors.hero.spells.spiritform.desc=クレリックはこの作戦で確認した指輪かアーティファクト（聖なる書物を除く）を1つ選び、トリニティにその効果を与える。\n\n指輪が選ばれた場合、Trinityはその指輪の効果を20ターンの間+%1$dで付与する。\n\nアーティファクトが選ばれた場合、Trinityはそのアーティファクトの効果を+%2$dで複製する。それぞれのアーティファクトは、Trinityと併用したときの挙動やアーマーチャージコストが異なる。\n\nこのスペルはTrinityが現在付与されている他のスピリット効果に取って代わる。
actors.hero.spells.spiritform.name=精神形
actors.hero.spells.spiritform.short_desc=トリニティをリングまたはアーティファクトに割り当てる。
actors.hero.spells.stasis$stasisbuff.desc=クレリックは現在、味方をスタシスに保存している。この味方はPower of Manyを含むすべてのプラスの効果を維持され、効果が終了するとクレリックの隣に再び現れる。この効果はStasisを再度唱えることで早期に終了させることもできる。\n\nスタシス状態の味方%1$s.\n残りターン%2$s。
actors.hero.spells.stasis$stasisbuff.left_behind=動けない味方は置き去りにされる。
actors.hero.spells.stasis$stasisbuff.name=停滞する味方
actors.hero.spells.stasis.desc=クレリックは味方とのつながりを自分自身に向けて集中させ、味方を一時的にクレリックの中で一種のエネルギー・スタシスに保持させる。その味方は最大%dターンの間維持され、その味方に与えられるすべてのプラスの効果は、スタシスにいる時間の影響を受けない。\n\nスタシスが自然に終了すると味方はクレリックの隣に現れる。Stasisは動かない味方を移動させることもできるが、フロア間で移動させることはできない。
actors.hero.spells.stasis.name=うっ血
actors.hero.spells.stasis.short_desc=味方をダンジョンから出して保存する。
actors.hero.spells.sunray.desc=クレリックは対象に向かってまばゆい光線を放ち、%1$d-%2$dのダメージを与え、%3$dターンの間盲目にする。Sunrayはアンデッドと悪魔を対象に常に最大ダメージを与える。\n\nこの魔法を受けた敵の視界は調整され、再びこの魔法で盲目になることはない。しかし、この魔法で盲目になった状態で再び攻撃を受けると、光に圧倒され、代わりに麻痺させられる。
actors.hero.spells.sunray.name=サンレイ
actors.hero.spells.sunray.short_desc=範囲魔法ダメージを与え、対象を1回盲目にする。
actors.hero.spells.walloflight$lightwall.desc=光のパネルが通路をふさいでいる。
actors.hero.spells.walloflight.desc=厚さ1タイル、幅%1$dタイル、20ターンの間持続する。\n\nこの壁は通常の壁と同じように機能するが、透視することができる。壁が作られた時に壁に挟まれた敵は一瞬気絶し、可能であれば押し戻される。壁にはまった敵は壁から出ることができる。\n\n壁は4つの枢軸方向または4つの対角線方向のいずれかに投げることができる。壁がすでにアクティブになっている場合、呪文は無料で再使用でき、即座に壁を取り除くことができる。
actors.hero.spells.walloflight.early_end=あなたは光の壁を消す。
actors.hero.spells.walloflight.name=光の壁
actors.hero.spells.walloflight.short_desc=敵を遮る壁を作る。
actors.hero.talent$aggressivebarriercooldown.desc=この才能は最近使用したものであり、再度使用する前に待たなければならない。\n\n残りターン%s.
actors.hero.talent$aggressivebarriercooldown.name=アグレッシブ・バリア・クールダウン
actors.hero.talent$combinedlethalityabilitytracker.executed=実行済み
actors.hero.talent$deadlyfollowuptracker.desc=デュエリストが最近投擲武器で敵を攻撃した場合、同じターゲットに対する近接攻撃のダメージが増加する。\n\n残りターン%s.
actors.hero.talent$deadlyfollowuptracker.name=致命的なフォローアップ
actors.hero.talent$followupstriketracker.desc=ハントレスが最近投擲武器で敵を攻撃した場合、同じターゲットに対する次の近接攻撃のダメージが増加する。\n\n残りターン%s.
actors.hero.talent$followupstriketracker.name=ついげき
actors.hero.talent$improvisedprojectilecooldown.desc=この才能は最近使用したものであり、再度使用する前に待たなければならない。\n\n残りターン%s.
actors.hero.talent$improvisedprojectilecooldown.name=即席弾のクールダウン
actors.hero.talent$lethalhastecooldown.desc=この才能は最近使用したものであり、再度使用する前に待たなければならない。\n\n残りターン%s.
actors.hero.talent$lethalhastecooldown.name=リーサル・ヘイスト・クールダウン
actors.hero.talent$lingeringmagictracker.desc=最近杖かワンドを使用した場合、次の物理攻撃はボーナスダメージを与える。\n\n残りターン%s.
actors.hero.talent$lingeringmagictracker.name=余韻マジック
actors.hero.talent$liquidagilacctracker.desc=デュエリストの次の通常近接攻撃はボーナス命中率を得る。\n\n残りターン：%s.
actors.hero.talent$liquidagilacctracker.name=液体アジリティ
actors.hero.talent$patientstriketracker.desc=デュエリストは1ターン待機し、次の近接攻撃でボーナスダメージを与える。
actors.hero.talent$patientstriketracker.name=患者ストライキ
actors.hero.talent$preciseassaulttracker.desc=デュエリストの次の通常近接攻撃はボーナス命中率を得る。\n\n残りターン：%s.
actors.hero.talent$preciseassaulttracker.name=強襲
actors.hero.talent$provokedangertracker.desc=戦士は最近シールドを失い、次の物理攻撃はボーナスダメージを与える。\n\n残りターン%s.
actors.hero.talent$provokedangertracker.name=いかり
actors.hero.talent$rejuvenatingstepscooldown.desc=この才能は最近使用したものであり、再度使用する前に待たなければならない。\n\n残りターン%s.
actors.hero.talent$rejuvenatingstepscooldown.name=若返りのステップ・クールダウン
actors.hero.talent$satiatedspellstracker.desc=クレリックが次に唱える呪文は、彼らに少量のシールドを与える。
actors.hero.talent$satiatedspellstracker.name=シールド・スペル
actors.hero.talent$searinglightcooldown.desc=この才能は最近使用したものであり、再度使用する前に待たなければならない。\n\n残りターン%s.
actors.hero.talent$searinglightcooldown.name=灼熱の光
actors.hero.talent$seershotcooldown.desc=この才能は最近使用したものであり、再度使用する前に待たなければならない。\n\n残りターン%s.
actors.hero.talent$seershotcooldown.name=シーアショットクールダウン
actors.hero.talent$swiftequipcooldown.desc=この才能は最近使用したものであり、再度使用する前に待たなければならない。\n\n残りターン%s.
actors.hero.talent$swiftequipcooldown.name=スウィフト装備のクールダウン
actors.hero.talent.adventurers_intuition.desc=デュエリストは武器を2.5倍速く、鎧を1.75倍速く識別する。\n\n_+2:_ デュエリストは武器を_装備時に_識別し、防具を_2.5倍速く識別する。
actors.hero.talent.adventurers_intuition.title=冒険家の勘
actors.hero.talent.aggressive_barrier.desc=武器アビリティを使用し、ヘルスが50％以下のとき、デュエリストは3シールドを得る。\n\n_+2:_ デュエリストは武器能力を使用し、ヘルスが50%以下のとき、_5シールドを得る。
actors.hero.talent.aggressive_barrier.meta_desc=このタレントが別のヒーローによって獲得された場合、代わりにヘルスが低い状態で近接攻撃を行う際にシールドを付与する。
actors.hero.talent.aggressive_barrier.title=アグレッシブバリア
actors.hero.talent.ally_warp.desc=その魔道士は味方を1人選び、2タイルの範囲で即座にその場所と入れ替わることができる。\n\n_+2:_ その魔道士は、_4タイルの範囲_で、味方を選んで即座にその場と入れ替わることができる。\n\n_+3:_ その魔道士は、_6タイルの範囲_で、味方を選んで即座にその相手と場所を入れ替えることができる。\n\n魔道士は動かない味方と場所を入れ替えることはできない。
actors.hero.talent.ally_warp.title=アリーワープ
actors.hero.talent.arcane_vision.desc=魔道士は敵をザッピングすると、_10ターンの間、その敵を見ることができる。\n\n_+2:_ 魔道士が敵をザッピングした時、_15ターンの間、その敵のマインド・ビジョンを得る。
actors.hero.talent.arcane_vision.title=アーケインビジョン
actors.hero.talent.assassins_reach.desc=_+1:_ アサシンの瞬きの準備レベルごとの範囲は、1/2/3/4から_1/3/4/6タイル_に増加する。\n\n_+2:_ アサシンの準備レベルごとの瞬きの範囲は、1/2/3/4から_2/4/6/8タイル_に増加する。\n\n_+3:_ アサシンの瞬きの範囲が、1/2/3/4から_2/5/7/10タイル_に増加する。\n\nこのブリンクは危険や敵を通り抜けることができるが、壁のような固い地形を通り抜けることはできない。
actors.hero.talent.assassins_reach.title=アサシンズリーチ
actors.hero.talent.aura_of_protection.desc=_+1:_ パラディンは2チャージを消費して、パラディンと2タイル以内のすべての味方に_20%のダメージ耐性_と、パラディンのアーマー・グリフの効果を_+50%のパワー_で20ターンの間与える呪文、_保護のオーラ_を唱えることができる。\n\n2:_+2:_ パラディンは2チャージ消費で、20ターンの間、パラディンと2タイル以内の味方に_30%のダメージ耐性_と_+75%の威力でパラディンのアーマー・グリフの効果を与える呪文、_保護のオーラ_を唱えることができる。\n\n_+3:_ パラディンは2チャージ消費で、パラディンと2タイル以内の味方に_40%のダメージ耐性_と_+100%の威力でパラディンのアーマー・グリフの効果を20ターンの間与える_保護のオーラ_を唱えることができる。
actors.hero.talent.aura_of_protection.title=ほごオーラ
actors.hero.talent.backup_barrier.desc=杖の最後のチャージを消費するたび、魔道士は_3シールドを得る。\n\n_+2:_ 魔道士は杖の最後のチャージを消費するたび、_5シールド_を得る。
actors.hero.talent.backup_barrier.meta_desc=この才能を別のヒーローが得た場合、代わりにそのヒーローの最高レベルのワンドから発動する。
actors.hero.talent.backup_barrier.title=バックアップバリア
actors.hero.talent.barkskin.desc=_+1:_草を踏むと、ウォーデンは自分のレベルの_0-50%の樹皮の鎧を得る。\n\n_+2:_草むらを踏むと、ウォーデンは毎ターン退色するバークスキン装甲を_レベルの0～100%得る。\n\n_+3:_ 草を踏むと、ウォーデンは毎ターン衰えるバークスキン装甲を_レベルの0～150%得る。
actors.hero.talent.barkskin.title=バークスキン
actors.hero.talent.beaming_ray.desc=クレリックはパワーアップした味方から_Beaming Ray_を1チャージで唱えることができる。この光線は壁を通り抜け、味方を狙った場所にテレポートさせることができる。その場所に敵がいる場合、味方は敵の隣に現れ、その敵をターゲットする。Beaming Rayは通常動かない味方をテレポートさせることもできるが、その際の射程は半分になる。\n\nBeaming Rayの最大射程は4タイルであり、10ターンの間最も近い敵に対してPower of Manyのボーナスを_+35%ダメージ_に増加させる。\n\nBeaming Rayの最大射程は8タイルで、10ターンの間最も近い敵に対してPower of Manyのボーナスを+40%のダメージに増加させる。\n\n10 ターンの間、最も近い敵に対して Power of Many のボーナスを +45% のダメージに増加させる。\n\n10 ターンの間、最も近い敵に対して Power of Many のボーナスを _+50% のダメージに増加させる。
actors.hero.talent.beaming_ray.title=こうせん
actors.hero.talent.blast_radius.desc=エレメンタル・ブラストの半径が4タイルから5タイルに増加。\n\n_+2:_ エレメンタル・ブラストの半径が4から_6タイル_に増加する。\n\n_+3:_ エレメンタル・ブラストの半径を4から_7タイル_に増加。\n\n_+4:_ エレメンタル・ブラストの半径が4から_8タイル_に増加。
actors.hero.talent.blast_radius.title=ブラスト半径
actors.hero.talent.bless.desc=_+1:_ クレリックは、自身に唱えた場合は6ターンの祝福と10回のシールドを、他のキャラクターに唱えた場合は10ターンの祝福と10回のヒーリングを与える呪文、_Blessを、1チャージを消費して唱えることができる。\n\n_+2:_ クレリックは、自身に唱えたときに10ターンの祝福と15ターンの遮蔽を、他のキャラクターに唱えたときに15ターンの祝福と15ターンの回復を与える呪文、_Bless,_を、1チャージで唱えることができる。\n\nこの呪文による余剰の回復はシールドに変換される。
actors.hero.talent.bless.meta_desc=この才能を別のヒーローが得た場合、代わりにヒーローと味方全員の命中と回避が+1で3%、+2で5%上昇する。
actors.hero.talent.bless.title=恵む
actors.hero.talent.body_form.desc=クレリックは_Body Form_を唱えることができ、これはトリニティにエンチャントやグリフのパワーを与える。\n\nトリニティが使用されたとき、クレリックは選ばれた効果を_20ターン_得る。\n\nトリニティが使用されたとき、クレリックは選ばれた効果を27ターンの間得る。\n\n_+3:_トリニティが使用されたとき、クレリックは選ばれた効果を_33ターンの間得る。\n\n_+4:_トリニティが使われたとき、クレリックは選ばれた効果を_40ターンの間得る。\n\nTrinityは一度に1つの効果しか付与できない。選ばれたグリフがレアで強力な場合、Trinityのアーマーチャージ・コストは高くなる。
actors.hero.talent.body_form.title=体型
actors.hero.talent.body_replacement.desc=まばたきの後、ローグは体力20、装甲1～3の木製のおとり1体を残す。\n\n_+2:_ まばたきの後、ローグは体力_40、装甲_2～6の木のおとり1体を残す。\n\n_+3:_ まばたきの後、ローグは体力_60、装甲_3～9の木のおとり1体を残す。\n\n_+4:_ まばたきの後、ローグは体力_80、装甲4～12_の木のおとり1体を残す。\n\n一度にアクティブにできる囮は1体のみである。
actors.hero.talent.body_replacement.title=ボディ交換
actors.hero.talent.body_slam.desc=戦士がジャンプして着地したとき、隣接するすべての敵に_1-4+ダメージブロック力の25%_のダメージを与える。\n\n_+2:_ 戦士がジャンプ後に着地したとき、隣接するすべての敵は_2-8と彼のダメージブロック力の50%_に等しいダメージを受ける。\n\n戦士がジャンプ後に着地したとき、隣接するすべての敵は_3-12に彼のダメージブロック力の75%_を足したダメージを受ける。\n\n戦士がジャンプ後に着地したとき、隣接するすべての敵は_4-16に彼のダメージブロック力の100%_を加えたダメージを受ける。
actors.hero.talent.body_slam.title=ボディースラム
actors.hero.talent.bounty_hunter.desc=_+1:_アサシンが準備された攻撃で敵を倒したとき、そのアイテムのドロップ確率が準備のレベルごとに_2/4/8/16%増加する。\n\n_+2:_ アサシンが準備攻撃で敵を倒した時、そのアイテム落下確率は準備のレベル毎に_4/8/16/32%_増加する。\n\n_+3:_アサシンが準備攻撃で敵を倒した時、そのアイテムドロップ確率は準備レベルごとに_6/12/24/48%_増加する。
actors.hero.talent.bounty_hunter.title=賞金稼ぎ
actors.hero.talent.cached_rations.desc=_+1:_ローグはダンジョンの次の数フロアを探索する間、チェストの中に_補給食2個を見つけることができる。\n\n_+2:_ローグはダンジョンの次の数階を探索する間、宝箱の中に置かれた_補給食3個を見つけることができる。\n\n補給食はすぐに食べられ、適度な満腹感を回復し、HPを5回復し、影のマントのチャージを1回復する。
actors.hero.talent.cached_rations.title=キャッシュ配給
actors.hero.talent.cleanse.desc=_+1:_クレリックはクレリックとその近くにいる味方の_マイナス状態異常を除去し、_10シールドを与える_呪文、_浄化を唱えることができる。\n\n_+2:_ クレリックはクレリックとその近くにいる味方に3ターンの状態異常免除を与え、2チャージで_20シールド_を与える呪文、_浄化_を唱えることができる。\n\n_+3:_クレリックはクレリックとその近くの味方に5ターンの状態異常耐性_を与え、2チャージで_30シールド_を与える呪文、_浄化_を唱えることができる。
actors.hero.talent.cleanse.meta_desc=この才能を別のヒーローが得た場合、代わりにワンドやアーティファクトを使用した後のヒーローのマイナスステータス効果を10/20/30%の確率で+1/+2/+3で浄化する。
actors.hero.talent.cleanse.title=清める
actors.hero.talent.cleave.desc=_+1:_剣闘士がキルした際に得られる追加時間は、15ターンから_30ターンに増加する。\n\n_+2:_ 剣闘士がキルした際に得られる追加時間は、15ターンから_45ターンに増加する。\n\n剣闘士がキルで得る追加時間は15ターンから60ターンに増加する。
actors.hero.talent.cleave.title=裂く
actors.hero.talent.cloned_armor.desc=_+1:_シャドウ・クローンはヒーローのアーマー値の_12%を獲得し、ヒーローのアーマーに_25%の確率でグリフを使用する。\n\n_+2:_ 影のクローンはヒーローのアーマー値の_24%_を獲得し、ヒーローのアーマーに_50%の確率でグリフを使用する。\n\n_+3:_ 影のクローンは英雄の鎧の値の_36%_を得、英雄の鎧に_75%の確率でグリフを使用する。\n\n_+4:_ 影のクローンは英雄の鎧の値の_48%_を得、英雄の鎧に_100%の確率でグリフを使用する。
actors.hero.talent.cloned_armor.title=クローンアーマー
actors.hero.talent.close_the_gap.desc=_+1:_デュエリストは決闘を始めるとき、対象に向かって_タイル2枚分まで_瞬きをする。\n\n_+2:_ 決闘者は決闘開始時に対象に向かって_最大3タイル_まで瞬きをする。\n\n_+3:_ 決闘開始時、決闘者は対象に向かって_最大4タイル_まばたきする。\n\n_+4:_ 決闘開始時、決闘者は対象に向かって5タイルまで瞬きをする。\n\nこのブリンクはハザードや敵を通り抜けることができるが、壁のような固い地形を通り抜けることはできない。このブリンクは、敵が挑戦可能な範囲内にいるかどうかを判定する際に考慮される。
actors.hero.talent.close_the_gap.title=差を埋める
actors.hero.talent.combined_energy.desc=モンクが5ターン以内に武器能力とエネルギー4+の能力を使用した場合、消費したエネルギーを1回復する。\n\n_+2:_ モンクが互いに5ターン以内に武器能力と_3+エネルギー_能力を使用した場合、消費したエネルギーを1回復する。\n\n_+3:_ モンクが互いに5ターン以内に武器能力と_2+エネルギー_能力を使用した場合、消費したエネルギーを1回復する。
actors.hero.talent.combined_energy.title=複合エネルギー
actors.hero.talent.combined_lethality.desc=別の武器のアビリティを使った直後にチャンピオンが近接武器で攻撃した場合、その攻撃はボス以外の敵のHPが13%以下の時に発動する。\n\n_+2:_ チャンピオンが別の武器のアビリティを使用した直後に近接武器で攻撃した場合、その攻撃はHPが27%以下のボス以外の敵を攻撃する。\n\n_+3:_ チャンピオンが別の武器のアビリティを使用した直後に近接武器で攻撃した場合、その攻撃はHP_40%以下で残っているボス以外の敵を処刑する。\n\nこの攻撃は通常の近接武器攻撃でも、武器アビリティの一部でも構わない。
actors.hero.talent.combined_lethality.title=複合致死率
actors.hero.talent.conserved_magic.desc=野生の魔法による各ザップは0.5ではなく0.33の電荷を消費するようになり、野生の魔法は25％の確率でターンを消費しない。\n\n_+2:_ 野生の魔法による各ザップは0.5の代わりに_0.225の電荷を使用するようになり、野生の魔法は_50％の確率でターンを消費しない。\n\nターンを消費しない確率は_75%である。\n\n_+4:_ 野生の魔法による各ザップは0.5の代わりに_0.1チャージを使用するようになり、野生の魔法は_100％の確率でターンを消費しない。
actors.hero.talent.conserved_magic.title=保存魔法
actors.hero.talent.counter_ability.desc=残像が攻撃されてから3ターン以内に武器能力を使用した場合、即座に0.38チャージを回復する。\n\n_+2:_ 残像が攻撃されてから3ターン以内にデュエリストが武器能力を使用した場合、即座に_0.77チャージ_を回復する。\n\n_+3:_ 残像が攻撃されてから3ターン以内に武器能力を使用した場合、_1.13チャージ_を即座に回復する。\n\n_+4:_残像が攻撃されてから3ターン以内にデュエリストが武器能力を使用した場合、_1.5チャージ_を即座に回復する。
actors.hero.talent.counter_ability.title=カウンター能力
actors.hero.talent.deadly_followup.desc=投擲武器で敵を攻撃した場合、5ターンの間、敵に与える近接ダメージが10％増加する。\n\n_+2:_デュエリストが投げ武器で敵を攻撃した時、5ターンの間、その敵に与える近接ダメージが_20%増加する。\n\n_+3:_デュエリストが投擲武器で敵を攻撃した時、その敵に5ターンの間_30%の近接ダメージを与える。
actors.hero.talent.deadly_followup.title=致命的なフォローアップ
actors.hero.talent.deathless_fury.desc=バーサーカーが死にかけ、怒りが100％以上になった場合、自動的にバーサークが発動する。\n\nバーサーカーが死にかけ、激怒が100%以上であれば自動的に発動するが、その際のクールダウンは_2ヒーローレベル_である。\n\nBerserk _+3:_ BerserkはBerserkerが死にかけで怒りが100%以上の場合に自動的に発動するが、その際のクールダウンは_1ヒーローレベル_である。\n\nBerserking終了時にHPが0であればBerserkerは死亡する。
actors.hero.talent.deathless_fury.title=死なき怒り
actors.hero.talent.deathly_durability.desc=死の印によって殺された敵は、その印が付けられたときのHPの_13%_に相当するシールドをローグに与える。\n\n_+2:_死の印によって殺された敵は、印をつけられた時のHPの_25%_のシールドをローグに与える。\n\n_+3:_死の印によって殺された敵は、その印がつけられていた時のHPの_38%_のシールドをローグに与える。\n\n_+4:_死の印によって殺された敵は、その印がつけられていた時のHPの_50%_のシールドをローグに与える。
actors.hero.talent.deathly_durability.title=死に物狂い
actors.hero.talent.desperate_power.desc=魔道士の杖と杖は、最後のチャージがなくなったとき、最後のザップで_+1レベル_を得る。\n\n_+2:_ メイジの杖と杖は、最後のチャージがなくなったとき、最後のザップで_+2レベル_増加する。\n\n_+3:_ 魔道士の杖とステッキは、最後のチャージがなくなったとき、最後のザップで_+3レベル_増加する。
actors.hero.talent.desperate_power.title=死力
actors.hero.talent.directed_power.desc=_+1:_エレメンタルストライクの直接攻撃は、攻撃対象を含むエレメンタルストライクの効果範囲内にいる敵1体につき、_+30%のエンチャントパワー_を得る。\n\n_+2:_ エレメンタル・ストライクの直接攻撃は、攻撃対象を含むエレメンタル・ストライクの効果範囲内にいる各敵につき、_+60%のエンチャント・パワーを得る。\n\n_+3:_ エレメンタル・ストライクの直接攻撃は、攻撃対象を含むエレメンタル・ストライクの効果範囲内にいる各敵につき、_+90%のエンチャント・パワーを得る。\n\n_+4:_ エレメンタル・ストライクの直接攻撃は、攻撃対象を含むエレメンタル・ストライクの効果範囲内にいる各敵につき、_+120%のエンチャント・パワーを得る。
actors.hero.talent.directed_power.title=指向性パワー
actors.hero.talent.divine_intervention.desc=Ascended Formにいる間、クレリックは_Divine Interventionを唱えることができる。\n\nAscended Formにいる間、クレリックは_Divine Intervention_を唱えることができ、クレリックとすべての味方のシールドを_200まで増加させ、Ascended Formを_4ターン延長する。\n\n_+3:_昇天した姿の間、クレリックは_神聖なる介入_を唱えることができる。\n\nAscended Formの間、クレリックは_Divine Intervention_を唱えることができ、クレリックとすべての味方のシールドを_300まで増加させ、Ascended Formを_6ターン延長する。\n\nディヴァイン・インターベンションはなんと5トーム・チャージを消費し、同じアセンデッド・フォームでは1度しか唱えられない。
actors.hero.talent.divine_intervention.title=神の介入
actors.hero.talent.divine_sense.desc=_+1:_クレリックは_Divine Sense、_8タイル_のMind Visionを50ターンの間与える呪文、_を唱えることができる。\n\n_+2:_クレリックは50ターンの間、_12タイル_のマインド・ヴィジョンを与える呪文、_Divine Senseを唱えることができる。
actors.hero.talent.divine_sense.meta_desc=この才能を別のヒーローが得た場合、代わりに、杖やアーティファクトを使用した後、+1なら3タイル、+2なら5タイルの範囲で、一瞬だけマインドビジョンを与える。
actors.hero.talent.divine_sense.title=神通力
actors.hero.talent.double_jump.desc=戦士が3ターン以内に2回目の跳躍を行う場合、その跳躍のチャージ・コストは16％軽減される。\n\n_+2:_ 戦士が3ターン以内に2回目の跳躍を行う場合、その跳躍のチャージ・コストは_30％軽減される。\n\n_+3:_ 戦士が3ターン以内に2回目の跳躍を行う場合、その跳躍のチャージ・コストは_40％軽減される。\n\n_+4:_ 戦士が3ターン以内に2回目の跳躍を行う場合、その跳躍のチャージ・コストは_50％軽減される。
actors.hero.talent.double_jump.title=二重跳び
actors.hero.talent.double_mark.desc=_+1:_1つ目の標的と同時に2つ目の標的に印をつける場合、チャージ・コストは_30％軽減される。\n\n_+2:_ 1つ目の標的と同時に2つ目の標的をマークする場合、チャージ・コストは_50%減少する。\n\n_+3:_ 最初の標的と同時に2番目の標的をマークする場合、チャージ・コストは_65%減少する。\n\n_+4:_ 最初の標的と同時に2番目の標的をマークする場合、チャージ・コストは_75%減少する。
actors.hero.talent.double_mark.title=ダブルマーク
actors.hero.talent.durable_projectiles.desc=_+1:_ハントレスが使用すると、投擲武器の耐久力が_+50%になる。\n\n_+2:_ハントレスが使用した場合、投擲武器の耐久力は_+75%になる。
actors.hero.talent.durable_projectiles.title=耐久性のある弾丸
actors.hero.talent.durable_tips.desc=_+1:_先端のダーツは、ウォーデンが使うと_2倍の耐久力を持つ。\n\n_+2:_ 先端が尖ったダーツは、ウォーデンが使用すると_3倍の耐久力を持つ。\n\n_+3:_ 先端が尖ったダーツは、ウォーデンが使用すると_4倍の耐久力を持つ。
actors.hero.talent.durable_tips.title=丈夫なチップ
actors.hero.talent.eagle_eye.desc=霊鷹の視認範囲が6タイルから7タイルに増加する。\n\n_+2:_ 霊鷹の視界の範囲が6タイルから8タイルに増加する。\n\n_+3:_ 霊鷹の視界の範囲が6から_9タイル_に増加し、_2タイル_の心眼を得る。\n\n_+4:_ 霊鷹の視野が6から_10タイル_に増加し、_3タイル_の心眼を得る。
actors.hero.talent.eagle_eye.title=鷹の目
actors.hero.talent.elemental_power.desc=エレメンタルブラストの威力が_25%増加する。\n\n_+2:_ エレメンタル・ブラストの威力が_50%増加する。\n\n_+3:_ エレメンタル・ブラストの威力が_75%増加する。\n\n_+4:_ エレメンタル・ブラストの威力が_100%増加する。
actors.hero.talent.elemental_power.title=ようりょく
actors.hero.talent.elemental_reach.desc=エレメンタルストライクの範囲は4タイルから5タイルに、幅は65度から75度に拡大される。\n\n_+2:_ エレメンタル・ストライクの射程は4から_6タイルに、幅は65から_85度に増加する。\n\n_+3:_ エレメンタル・ストライクの射程が4から_7タイルに、幅が65から_95度に増加する。\n\n_+4:_ エレメンタル・ストライクの射程が4から_8タイルに、幅が65から_105度に増加する。
actors.hero.talent.elemental_reach.title=要素リーチ
actors.hero.talent.elimination_match.desc=_+1:_デュエリストがデュエル終了後3ターン以内に再度挑戦する場合、その挑戦のチャージコストは_16%減少する。\n\n_+2:_デュエリストがデュエル終了後3ターン以内に再挑戦する場合、その挑戦のチャージコストは_30%減少する。\n\n_+3:_ デュエリストがデュエル終了後3ターン以内に再挑戦した場合、その挑戦のチャージコストは_40%減少する。\n\n_+4:_ デュエリストがデュエル終了後3ターン以内に再挑戦した場合、その挑戦のチャージコストは_50%減少する。
actors.hero.talent.elimination_match.title=イリミネーション・マッチ
actors.hero.talent.empowered_strike.desc=杖でザッピングした後の最初の近接攻撃は_+16%のダメージを与え、杖のボーナス効果は_+50%の威力を得る。\n\nその杖のボーナス効果は_+100%の威力を得る。\n\n3:_ 魔法剣士が杖でザッピングした後の最初の近接攻撃は_+50%のダメージを与え、杖のボーナス効果は_+150%の威力を得る。
actors.hero.talent.empowered_strike.title=エンパワースト
actors.hero.talent.empowering_meal.desc=食べ物を食べることで、魔道士は次に杖でダメージを与える3回に2ボーナスダメージを与える。\n\n_+2:_ 食べ物を食べると、魔道士は次に杖でダメージを与える3回に_3のボーナス・ダメージ_を与える。
actors.hero.talent.empowering_meal.title=エンパワーメント・ミール
actors.hero.talent.endless_rage.desc=_+1:_バーサーカーは最大で_116%の怒り_に達することができる。\n\n_+2:_ バーサーカーは最大で怒り_133%に達する。\n\n_+3:_ バーサーカーは最大で_150%の激怒_に達することができる。\n\n100%以上の激怒はバーサークのシールドを1%増加させ、クールダウンを1%減少させるが、ダメージボーナスを+50%以上増加させることはない。
actors.hero.talent.endless_rage.title=とめどない怒り
actors.hero.talent.energizing_meal.desc=食料を食べると魔道士は1ターンを要し、5ターンの杖の再チャージが可能になる。\n\n_+2:_ 食べ物を食べると魔道士は1ターンかかり、_8ターンの杖の充電_を与えられる。
actors.hero.talent.energizing_meal.title=エナジャイジング・ミール
actors.hero.talent.enhanced_combo.desc=_+1:_剣闘士のコンボが7以上の場合、Clobberのノックバック範囲が3に広がり、めまいを与え、敵を落とし穴に叩き込むことができる。\n\n_+2:_+1の効果に加え、剣闘士のコンボが9以上の場合、パリィが複数の攻撃に効果を発揮する。\n\n_+3:_+1と+2の効果に加え、剣闘士はSlam、Crush、Furyの使用時にコンボ/3タイルまで跳躍できる。
actors.hero.talent.enhanced_combo.title=エンハンスド・コンボ
actors.hero.talent.enhanced_lethality.desc=アサシンは準備1レベルにつき4/13/27/67%以下の体力の敵を暗殺できる。\n\n_+2:_ アサシンは準備1段階につき_5/17/33/83%以下の体力の敵を、3/10/20/50%から暗殺できる。\n\n3:_+3:_ アサシンは準備1段階につき_6/20/40/100%以下の体力の敵を、3/10/20/50%から暗殺できる。
actors.hero.talent.enhanced_lethality.title=殺傷力強化
actors.hero.talent.enhanced_rings.desc=_+1:_ローグがアーティファクトを使用したとき、その指輪は_3ターンの間_+1のアップグレードを得る。\n\n_+2:_ ローグがアーティファクトを使用したとき、その指輪は_6ターンの間+1のアップグレードを得る。\n\n_+3:_ ローグがアーティファクトを使用したとき、その指輪は_9ターンの間+1のアップグレードを得る。
actors.hero.talent.enhanced_rings.title=エンハンスド・リング
actors.hero.talent.enlightening_meal.desc=食べ物を食べると、クレリックは1ターンを要し、その聖なる書物に_0.67チャージ_を与える。\n\n_+2:_ 食べ物を食べるとクレリックに1ターンかかり、聖なるトームに_1チャージ_される。
actors.hero.talent.enlightening_meal.meta_desc=この才能を別のヒーローが得た場合、代わりにワンドとアーティファクトのリチャージが+1なら2ターン、+2なら3ターン付与される。これはHorn of plentyのリチャージには使用できない。
actors.hero.talent.enlightening_meal.title=啓発的な食事
actors.hero.talent.enraged_catalyst.desc=憤怒が100%の場合、最大で15%の頻度で発動する。\n\n_+2:_ バーサーカーの武器のエンチャントと呪いは、彼の激怒が大きいほど頻繁に発動し、激怒が100%の場合、最大で_30%の頻度で発動する。\n\n怒りが100%のとき、最大で_45%の確率で発動する。
actors.hero.talent.enraged_catalyst.title=激昂触媒
actors.hero.talent.evasive_armor.desc=_+1:_フリーランニング中、Freerunnerは追加で_+1回避_を得る。\n\n_+2:_ 自走している間、Freerunnerは鎧の強度の超過1点につき_+2 回避_を追加で得る。\n\n_+3:_ 自走している間、Freerunnerは鎧の体力1点超過につき_+3 回避_を追加で得る。
actors.hero.talent.evasive_armor.title=回避鎧
actors.hero.talent.even_the_odds.desc=_+1:_ 戦士は耐久終了時に2タイル以内の敵1体につき、追加で_5%のボーナス・ダメージ_を与える。\n\n_+2:_ 耐久終了時、戦士は2タイル以内の全ての敵に追加の_10%のボーナス・ダメージを与える。\n\n_+3:_ 戦士は耐えが終了したとき、2タイル以内のすべての敵に追加の_15%のボーナス・ダメージを与える。\n\n_+4:_ 戦士は耐えが終了したとき、2タイル以内のすべての敵に追加の_20%のボーナス・ダメージを与える。
actors.hero.talent.even_the_odds.title=勝っても負けても
actors.hero.talent.excess_charge.desc=バトルメイジの杖がフルチャージされると、次のザップで杖のレベルにつき_0.67のシールドが付与される。\n\n_+2:_戦闘魔導士の杖がフル充電されているとき、次のザップで杖のレベルにつき_1.33のシールドを与える。\n\n_+3:_戦闘魔導士の杖がフル充電されると、次のザップで杖のレベルにつき_2シールド_を与える。
actors.hero.talent.excess_charge.title=超過料金
actors.hero.talent.expanding_wave.desc=衝撃波の範囲は5タイルから6タイルに、幅は60度から75度に拡大される。\n\n_+2:_ 衝撃波の射程は5から_7タイルに、幅は60から_90度に増加する。\n\n_+3:_ 衝撃波の射程は5から_8タイルに、幅は60から_105度に増加する。\n\n_+4:_ 衝撃波の範囲は5から_9タイルに、幅は60から_120度に増加する。
actors.hero.talent.expanding_wave.title=膨張波
actors.hero.talent.expose_weakness.desc=_+1:_デュエリストの残像を攻撃した敵は弱体化し、_2ターンの間_弱体化する。\n\n_+2:_デュエリストの残像を攻撃した敵は弱体化し、_4ターンの間弱体化する。\n\n_+3:_デュエリストの残像を攻撃した敵は_6ターンの間弱体化し、弱体化しやすくなる。\n\n_+4:_デュエリストの残像を攻撃した敵は_8ターンの間弱体化し、弱体化しやすくなる。
actors.hero.talent.expose_weakness.title=弱点をさらけ出す
actors.hero.talent.fan_of_blades.desc=_+1:_スペクトラル・ブレードは追加で1体まで命中し、50%のダメージを与える。対象は視認可能で、30度の円錐のAOE内にいなければならない。\n\n_+2:_ スペクトラル・ブレードは追加で2体までの目標に命中し、50％のダメージを与える。対象は視認可能で、_60度の円錐のAOE内にいなければならない。\n\n_+3:_スペクトラル・ブレードは追加で3体までの対象に命中し、50％のダメージを与える。対象は視認可能で、かつ90度の円錐AOE内にいなければならない。\n\n_+4:_スペクトラル・ブレードは追加で4体までの対象に命中し、50％のダメージを与える。対象は視認可能で、かつ120度の円錐AOE内にいなければならない。
actors.hero.talent.fan_of_blades.title=羽根扇
actors.hero.talent.farsight.desc=スナイパーの視界が25%広がる。\n\n_+2:_ 狙撃手の視界の範囲が_50%広がる。\n\n_+3:_ 狙撃手の視界が_75%広がる。
actors.hero.talent.farsight.title=ファースライト
actors.hero.talent.fear_the_reaper.desc=死印のついた敵はHPが0になると、_戦闘不能_になる。\n\n_+2:_ 死亡マークのついた敵のHPが0になると、_恐怖と廃人_になる。\n\n_+3:_ 死亡マークのついた敵のHPが0になると、_恐怖と廃人_になり、3タイル以内の敵は_廃人_になる。\n\n_+4:_ 死亡マークのついた敵のHPが0になると、_恐怖と廃人_になり、3タイル以内の敵は_恐怖と廃人_になる。
actors.hero.talent.fear_the_reaper.title=死神を恐れる
actors.hero.talent.feigned_retreat.desc=敵がそのデュエリストの残像を攻撃した場合、そのデュエリストは_2ターン_のヘイストを得る。\n\n_+2:_敵がデュエリストの残像を攻撃した場合、_4ターン_のヘイストを得る。\n\n_+3:_ 敵がデュエリストの残像を攻撃した場合、_6ターン_のヘイストを得る。\n\n_+4:_敵がデュエリストの残像を攻撃した場合、_8ターン_のヘイストを得る。
actors.hero.talent.feigned_retreat.title=素知らぬ顔
actors.hero.talent.fire_everything.desc=野生の魔法は4回から5回発射されるようになり、それぞれの杖は25％の確率で3回使用できる。\n\n野生の魔法が4回から6回に増加し、それぞれの杖が50％の確率で3回使用可能になる。\n\n野生の魔法が4回から7回に増加し、それぞれの杖が75％の確率で3回使用可能になる。\n\n野生の魔法が4回から8回に増加し、それぞれの杖が_100%の確率で3回使用可能になる。
actors.hero.talent.fire_everything.title=すべてを燃やす
actors.hero.talent.flash.desc=_+1:_昇天形態の間、クレリックは_Flash_を唱えて_3タイル_先までテレポートできる。\n\n_+2:_ Ascended Formの間、クレリックは_Flash_を唱えて_4タイル_先までテレポートできる。\n\n_+3:_ Ascended Formの状態で、クレリックは_Flash_を唱えて_5タイル_先までテレポートできる。\n\n_+4:_ Ascended Formの状態で、クレリックは_Flash_を唱えて_6タイル_先までテレポートできる。\n\nフラッシュは最初にトーム・チャージ2個を消費し、同じアセンデッドフォームで使用するたびにチャージが1個増える。
actors.hero.talent.flash.title=フラッシュ
actors.hero.talent.focused_meal.desc=食べ物を食べると、デュエリストは1ターンかかり、武器に_0.67チャージ_される。\n\n_+2:_食べ物を食べると、デュエリストは1ターンかかり、武器に_1チャージ_される。
actors.hero.talent.focused_meal.meta_desc=この才能を別のヒーローが得た場合、代わりにそのヒーローの次のヒットに、レベル3なら+1、レベル2なら+2に等しいボーナスダメージを与える。
actors.hero.talent.focused_meal.title=フォーカス・ミール
actors.hero.talent.followup_strike.desc=弓か投擲武器で敵に命中した場合、その敵に対する次の近接攻撃はボーナスダメージ_2を与える。\n\n_+2:_ 狩人が弓か投擲武器で敵に命中したとき、その敵に対する次の近接攻撃は_3のボーナス・ダメージを与える。
actors.hero.talent.followup_strike.title=ついげき
actors.hero.talent.go_for_the_eyes.desc=_+1:_霊鷹からの攻撃は_2ターンの間_敵の目をくらませる。\n\n_+2:_霊鷹からの攻撃は_5ターンの間_敵の目を見えなくする。\n\n_+3:_霊鷹からの攻撃は_5ターンの間_敵の目を見えなくし、_2ターンの間_敵を動けなくする。\n\n_+4:_精霊の鷹からの攻撃は_5ターンの間_敵の目をくらませ、_5ターンの間_敵を戦闘不能にする。
actors.hero.talent.go_for_the_eyes.title=目を狙う
actors.hero.talent.growing_power.desc=自然の力による攻撃力と移動速度の上昇率が、33％と100％から、38％と125％に上昇する。\n\n_+2:_ 自然の力による攻撃力と移動速度が、33%と100%から、_42%と150%に増加する。\n\n3:_ 自然の力による攻撃力と移動速度が、33%と100%から、_46%と175%に増加する。\n\n自然の力による攻撃力と移動速度が、33%と100%から_50%と200%に増加。
actors.hero.talent.growing_power.title=成長力
actors.hero.talent.hallowed_ground.desc=_+1:_ プリーストは2チャージで、_3×3エリア_の地形を20ターンの間神聖化する呪文、_Hallowed Groundを唱えることができる。\n\n_+2:_ 司祭は、2コストで20ターンの間、_5×5 領域の地形を神聖化する呪文、_Hallowed Groundを唱えることができる。\n\n_+3:_ 司祭は、2コストで20ターンの間、_7×7エリア_の地形を神聖化する呪文、_Hallowed Groundを唱えることができる。\n\n発動すると、味方のHPを15回復し、敵を短時間根こそぎにし、短い草を広げる。その後、ゆっくりと味方を回復し、敵を戦闘不能にし、背の高い草をランダムに生やす。Hallowed Groundは回復の代わりにPriestにシールドを付与し、炎によって破壊される。
actors.hero.talent.hallowed_ground.title=聖地
actors.hero.talent.hasty_retreat.desc=まばたきの後、ローグは_1ターン_のヘイストと透明を得る。\n\n_+2:_ 瞬き後、ローグは_2ターン_のヘイストと透明を得る。\n\n_+3:_ 瞬き後、ローグは_3ターン_のヘイストと透明を得る。\n\n_+4:_ 瞬き後、ローグは_4ターン_のヘイストと透明を得る。
actors.hero.talent.hasty_retreat.title=そそう
actors.hero.talent.hearty_meal.desc=体力が33％以下のとき、食べ物を食べると戦士のHPが4回復する。\n\n_+2:_ 体力が33%以下のとき、食べ物を食べると戦士のHPを6回復する。
actors.hero.talent.hearty_meal.title=ボリューム満点
actors.hero.talent.heightened_senses.desc=_+1:_狩人は自分の位置から_2タイル以内にいるキャラクターのマインド・ビジョンを得る。\n\n_+2:_狩人は自分の位置から_3タイル_以内にいるキャラクターの心眼を得る。
actors.hero.talent.heightened_senses.title=きょうかんかく
actors.hero.talent.heroic_energy.desc=_+1:_ ヒーローのアーマー能力はチャージコストが_12%減少する。\n\n_+2:_ ヒーローのアーマー能力はチャージコストが_23%減少する。\n\n_+3:_ ヒーローのアーマー能力はチャージ・コストが_32%減少する。\n\n_+4:_ ヒーローのアーマー能力はチャージ・コストが_40%減少する。
actors.hero.talent.heroic_energy.rat_title=ラトロイック・エネルギー
actors.hero.talent.heroic_energy.title=英雄的エネルギー
actors.hero.talent.hold_fast.desc=ウォリアーは待機している間、アーマーを1～2個獲得し、移動するまでコンボとシールドバフの減衰を50%遅くする。\n\n戦士が待機しているとき、_2-4アーマー_を獲得し、移動するまでコンボとシールドバフの減衰を_75%_遅らせる。\n\n3:_ 戦士が待機すると_3-6アーマー_を獲得し、移動するまでコンボとシールドバフの減衰を_100%_遅らせる。
actors.hero.talent.hold_fast.title=まもりぬく
actors.hero.talent.holy_intuition.desc=クレリックは、アイテムが呪われているかどうかを明らかにする呪文、_聖なる直感を_3チャージで唱えることができる。\n\n_+2:_クレリックは_アイテムが呪われているかどうかを明らかにする呪文_聖なる直感を_2チャージで唱えることができる。
actors.hero.talent.holy_intuition.meta_desc=この才能を別のヒーローが獲得した場合、代わりにヒーローは呪われたアイテムを装備する直前に、+1なら15%、+2なら25%の確率で呪いの状態を識別できるようになる。
actors.hero.talent.holy_intuition.title=聖なる直感
actors.hero.talent.holy_lance.desc=聖なる槍》は4チャージで_30～55ダメージを与える破壊的な呪文である。\n\n_+2:_ 司祭は、4コストで_45～83ダメージを与える破壊的な呪文_聖槍を唱えることができる。\n\n_+3:_ 司祭は4コストで_60-110ダメージを与える破壊的な呪文_聖槍を唱えることができる。\n\n聖槍は常に悪魔とアンデッドの敵に最大ダメージを与える。Holy Lanceは30ターンのクールダウンを経て再び唱えることができる。
actors.hero.talent.holy_lance.title=聖槍
actors.hero.talent.impact_wave.desc=戦士がジャンプして着地すると、隣接するすべての敵は2タイル後退し、25％の確率で5ターンの間弱体化する。\n\n戦士がジャンプ後に着地したとき、隣接するすべての敵は_3タイル_後退し、_50%の確率で_5ターンの間弱体化する。\n\n_+3:_戦士がジャンプ後に着地したとき、隣接するすべての敵は_4タイル_後退し、_75%の確率で5ターンの間弱体化する。\n\n_+4:_戦士がジャンプ後に着地したとき、隣接するすべての敵は_5タイル_後ろに倒され、_100％の確率で5ターンの間弱体化する。
actors.hero.talent.impact_wave.title=衝撃波
actors.hero.talent.improvised_projectiles.desc=ウォリアーは投げ武器以外のアイテムを敵に投げつけることで、_2ターンの間_敵の目をくらませることができる。クールダウンは50ターン。\n\n_+2:_ ウォリアーは投げ武器でないアイテムを敵に投げつけることで、_3ターンの間_敵の目をくらませることができる。これには50ターンのクールダウンがある。
actors.hero.talent.improvised_projectiles.title=そくだん
actors.hero.talent.inscribed_power.desc=魔道士が巻物を読んだりスペル・アイテムを使用したりすると、次の2回のワンド・ザップは＋2レベルされる。\n\n_+2:_ 魔道士が巻物を読むか呪文アイテムを使用すると、その次の3つのワンドザップ_は+2レベルを得る。\n\n強化されたワンド・ザップの数は、アップグレードの巻物、変成の巻物、または錬金術の巻物を使用し、それらの巻物を使用して製作しなければならないアイテムを使用する場合、2倍になる。\n\n出力量の多い錬金術アイテム（ほとんどの呪文など）の場合、この才能はそのアイテムの生産数に応じて発動するチャンスがある。
actors.hero.talent.inscribed_power.title=刻まれた力
actors.hero.talent.inscribed_stealth.desc=_+1:_ローグは巻物を読んだり呪文アイテムを使用した後、_3ターン_の透明状態を得る。\n\n_+2:_ ローグは巻物を読んだり呪文アイテムを使用したりすると、_5ターン_透明状態を得る。\n\nアップグレードの巻物、変成の巻物、錬金術のアイテムを使用した場合、それらの巻物を使って作らなければならない場合、透明状態の持続時間は2倍になる。\n\n生産量の多い錬金術アイテム（ほとんどの呪文など）の場合、この才能はそのアイテムの生産量に応じて発動するチャンスがある。
actors.hero.talent.inscribed_stealth.title=内接ステルス
actors.hero.talent.invigorating_meal.desc=食べ物を食べると1ターンを要し（ベリーは即座に食べられる）、1ターンのヘイストを与える。\n\n_+2:_ 食べ物を食べると、ハントレスは1ターンかかり（ベリーは即座に食べられる）、_2ターンのヘイストを付与される。
actors.hero.talent.invigorating_meal.title=元気の出る食事
actors.hero.talent.invigorating_victory.desc=_+1:_決闘者が決闘終了前に対象を倒した場合、その決闘中に受けたダメージの30%に_5HPを足した値だけ回復する。\n\n_+2:_ 決闘が終わる前に決闘者が対象を倒した場合、HP10と決闘中に受けたダメージの50%を回復する。\n\n_+3:_ 決闘が終わる前に決闘者が対象を倒した場合、HP15と決闘中に受けたダメージの65%を回復する。\n\n_+4:_デュエリストが決闘終了前に対象を倒した場合、_HP20と決闘中に受けたダメージの75%を回復する。
actors.hero.talent.invigorating_victory.title=爽快な勝利
actors.hero.talent.iron_stomach.desc=食料を食べると戦士は1ターンかかり、食べている間75％のダメージ耐性を得る。\n\n_+2:_ 食べ物を食べると戦士は1ターンかかり、食べている間_100%のダメージ耐性を得る。
actors.hero.talent.iron_stomach.title=胃鉄
actors.hero.talent.iron_will.desc=戦士の印章によって与えられるシールドは1増加する。\n\n_+2:_ 戦士の印章によって与えられる盾は_2_増加する。
actors.hero.talent.iron_will.meta_desc=このタレントが別のヒーローによって獲得された場合、パッシブでWarriorのブロークンシール効果の1または2最大シールドバージョンを付与する。
actors.hero.talent.iron_will.title=鉄の意志
actors.hero.talent.judgement.desc=_+1:_昇天した姿の間、クレリックは目に見えるすべての敵に_10～20のダメージを与える_裁き_を唱えることができる。\n\n_+2:_ Ascended Formの間、クレリックは_Judgement,_を唱えることができる。\n\n\n\n\n\nJudgementはトーム・チャージを3消費する。Judgementは昇天形態に入ってから、あるいは最後にJudgementを唱えてからクレリックが唱えた呪文1つにつき＋33％のダメージを与える。
actors.hero.talent.judgement.title=ジャッジメント
actors.hero.talent.lay_on_hands.desc=_+1:_ パラディンは_Lay on Hands,_を唱えることができる。この呪文は近くのキャラクターを即座に_15HP回復し_、あるいはパラディンに_15シールドを与える。\n\n_+2:_ パラディンは、1チャージ消費で、近くのキャラクターを_20 HP_回復するか_20シールド_付与する_レイ・オン・ハンズ_を唱えることができる。\n\n_+3:_ パラディンは1チャージで、近くのキャラクターを_25HP分_即座に回復させるか_25シールドを付与する_レイ・オン・ハンズ_を唱えることができる。\n\nこの呪文による余分な回復はシールドに変換される。レイ・オン・ハンズは繰り返し唱えることができるが、一度に3キャスト分以上のシールドを与えることはできない。
actors.hero.talent.lay_on_hands.title=てをかける
actors.hero.talent.lethal_defense.desc=_+1:_剣闘士がコンボ技で敵を倒した時、封印解除のクールダウンが50ターン減少する。\n\n_+2:_剣闘士がコンボ技で敵を倒した時、彼の破れ封じのシールドのクールダウンは_100ターン減少する。\n\n_+3:_剣闘士がコンボ技で敵を倒した時、その破邪の封印のシールドのクールダウンは_150ターン減少する。\n\nシールドのクールダウンはこのタレントによって-150ターンまで減少させることができる。
actors.hero.talent.lethal_defense.title=リーサルディフェンス
actors.hero.talent.lethal_haste.desc=_+1:_デュエリストが武器能力で敵に必殺の一撃を与えたとき、_3ターン_分の瞬間移動を得る。\n\n_+2:_デュエリストが武器能力を持つ敵に必殺の一撃を当てたとき、_5ターン_分の瞬間移動を得る。
actors.hero.talent.lethal_haste.meta_desc=この才能を別のヒーローが得た場合、代わりに通常の武器攻撃で発動し、100ターンのクールダウンを持つ。
actors.hero.talent.lethal_haste.title=ちし
actors.hero.talent.lethal_momentum.desc=_+1:_戦士が物理武器で敵に必殺の一撃を加えたとき、_67％の確率でターン数が0になる。\n\n_+2:_ 戦士が物理武器を持つ敵に必殺の一撃を当てたとき、_100％の確率で0ターンになる。
actors.hero.talent.lethal_momentum.title=リーサルモメンタム
actors.hero.talent.life_link.desc=クレリックは自身とパワーアップした味方の間に_Life Link_を2チャージで唱えることができる。この呪文はクレリックとその味方の間でダメージを共有させ、どちらかが影響を受けている場合、Tier3以下の有益なクレリック呪文を両方に適用させる。\n\nライフ・リンクは10ターン持続し、パワー・オブ・メニーのボーナスを受けるダメージの35%に増加させる。\n\n_+2:_ ライフ・リンクは_13ターン持続し、パワー・オブ・メイニーのボーナスを_-40%のダメージに増加させる。\n\n_+3:_ ライフ・リンクは_17ターン_持続し、パワー・オブ・メイニーのボーナスを_-45%のダメージに増加させる_(_)\n\nライフ・リンクは20ターン持続し、「パワー・オブ・メニー」のボーナスを_-50%のダメージに増加させる。
actors.hero.talent.life_link.title=ライフリンク
actors.hero.talent.light_cloak.desc=_+1:_ローグは装備していないときでも影のマントを使うことができるが、装備していないときは_25％の速度で再チャージされる。\n\n_+2:_ ローグは装備していないときに影のマントを使用できるが、装備していないときに_50%の速度でチャージされる。\n\n_+3:_ ローグは装備していないときに影のマントを使用できるが、装備していないときに_75%の速度でチャージされる。
actors.hero.talent.light_cloak.meta_desc=この才能を他のヒーローが得た場合、代わりにすべてのアーティファクトのチャージ速度が+1/+2/+3で7/13/20%増加する。
actors.hero.talent.light_cloak.title=ライトマント
actors.hero.talent.light_reading.desc=クレリックは装備していないときでも聖なる書物を使用できるが、装備していないときのチャージ速度は_25%である。\n\n_+2:_ クレリックは装備していないときにその聖なるトームを使用できるが、装備していないときのチャージ速度は_50%である。\n\n_+3:_クレリックは装備していないときに聖なるトームを使用できるが、装備していないときのチャージ速度は_75%である。
actors.hero.talent.light_reading.meta_desc=この才能を別のヒーローが得た場合、代わりにすべての杖のチャージ速度が+1/+2/+3で7/13/20%増加する。
actors.hero.talent.light_reading.title=ライトリーディング
actors.hero.talent.lingering_magic.desc=_+1:_ 杖か杖でザッピングしたとき、次の物理攻撃は_1-2のボーナスダメージを与える。\n\n_+2:_ 魔法士が杖かスタッフでザッピングしたとき、その次の物理攻撃は_2ボーナス・ダメージ_を与える。
actors.hero.talent.lingering_magic.title=余韻マジック
actors.hero.talent.liquid_agility.desc=_+1:_ポーション、ブリュー、エリクサーを飲むか投げるかしているとき、デュエリストは_3倍の回避_を持ち、5ターン以内の次の近接攻撃に_3倍の命中_を持つ。\n\n_+2:_ポーション、ブリュー、エリクサーを飲むか投げるかしたとき、デュエリストは_無限回避_を持ち、5ターン以内の次の近接攻撃に_無限命中_を持つ。\n\nこのボーナスは、力のポーション、経験のポーション、またはそれらのポーションを使用して作られなければならない錬金術のアイテムを使用する場合、追加の1ターンと攻撃の間持続する。\n\n生産量の多い錬金術アイテム（例：アクア・ブリュー）の場合、この才能はそのアイテムの生産量に応じて発動する。
actors.hero.talent.liquid_agility.title=液体アジリティ
actors.hero.talent.liquid_nature.desc=_+1:_ハントレスがポーション、ブリュー、エリクサーを飲むか投げると、周囲に最大4枚の草タイルが生え、隣接する敵は_1ターンの間根こそぎになる。\n\n_+2:_ハントレスがポーション、ブリュー、エリクサーを飲むか投げると、周囲に最大6枚の草タイルが生え、隣接する敵は_2ターンの間根こそぎになる。\n\n草の量と根の持続時間は、力のポーション、経験のポーション、またはそれらのポーションを使用してクラフトしなければならない錬金術アイテムを使用した場合、2倍になる。\n\n生産量の多い錬金術アイテム（例：アクア・ブリュー）の場合、この才能はそのアイテムの生産数に応じて発動する。
actors.hero.talent.liquid_nature.title=液性
actors.hero.talent.liquid_willpower.desc=_+1:_戦士はポーション、醸造酒、エリクサーを飲んだり投げたりすると、最大HPの6.5%のシールドを得る。\n\n_+2:_ 戦士はポーション、醸造酒、エリクサーを飲んだり投げたりすると、_最大HPの10%のシールドを得る。\n\n体力、経験、錬金術のポーションを使用する場合、シールドの量は2倍になる。\n\n生産量の多い錬金術アイテム（例：アクア・ブリュー）の場合、この才能はそのアイテムの生産量に応じて発動するチャンスがある。
actors.hero.talent.liquid_willpower.title=液体意志力
actors.hero.talent.longrange_warp.desc=魔道士は階をまたいでワープできるようになった。\n\n_+2:_ 魔法士は_117%のコストでフロア間をワープできるようになった。\n\n_+3:_ チャージコスト_83%で、魔道士はフロア間をワープできるようになった。\n\n_+4:_ 魔法士は_50%のコストでフロア間をワープできるようになった。\n\nロックされたフロアから離れるために長距離ワープを使用することはできない。
actors.hero.talent.longrange_warp.title=ロングレンジ・ワープ
actors.hero.talent.mind_form.desc=クレリックは_マインド・フォームを唱えることができ、これはトリニティに、クレリックがこのランで使用した杖か投擲武器のパワーを与える。\n\nトリニティが使用されたとき、クレリックは選ばれたアイテムのザップかスローの効果を、あたかもそれが_+3._であるかのように使用する。\n\n_+2:_トリニティが使用されたとき、クレリックは選ばれたアイテムのザップかスローの効果を、_+4._であるかのように使用する。\n\n_+3:_トリニティが使用されたとき、クレリックは選ばれたアイテムのザップかスローの効果を、_+5._であるかのように使用する。\n\n_+4:_トリニティが使用されたとき、クレリックは選ばれたアイテムのザップかスローの効果を、あたかも_+6._であるかのように使用する。\n\nトリニティは一度に1つのマインド効果しか与えられない。
actors.hero.talent.mind_form.title=しんけい
actors.hero.talent.mnemonic_prayer.desc=_+1:_プリーストは1チャージで_3ターンの間_味方/敵のバフ/デバフを延長する呪文_「ニモニックの祈り」を唱えることができる。\n\n_+2:_プリーストは_チャージコスト1で_4ターンの間_味方/敵のバフ/デバフを延長する_ニーモニック・プレイヤー,_を唱えることができる。\n\n_+3:_プリーストは_チャージ・コスト1で_5ターンの間_味方/敵にバフ/デバフを延長する呪文_ニーモニック・プレイヤーを唱えることができる。\n\n瞑想の祈りは唱えるのに時間がかからない。Mnemonic Prayerは特定のインスタンスのバフ/デバフを一度だけ延長することができ、アーマーアビリティのバフを延長することはできない。
actors.hero.talent.mnemonic_prayer.title=念仏
actors.hero.talent.monastic_vigor.desc=モンクのエネルギーが100％の場合、その能力はパワーアップする。\n\n_+2:_ モンクの気力が_80%以上の場合、彼女の能力はパワーアップする。\n\n_+3:_ モンクの気力が_60%以上の場合、彼女の能力はパワーアップする。\n\nパワーアップ時\n- Flurryは武器のエンチャントを適用する。\n- Focusは瞬時に発動する。\n- ダッシュの射程が+4される。\n- Dragon Kickは+50%のダメージを与え、隣接する全ての敵にノックバックとスタン効果を与える。\n- MeditateはHPを20%回復し、ダメージ耐性を80%付与する。
actors.hero.talent.monastic_vigor.title=しゅうどうせいかつ
actors.hero.talent.mystical_charge.desc=杖で攻撃すると、0.5ターン分のアーティファクトをチャージできる。\n\n_+2:_杖で殴ることで、バトルメイジに_1ターン_分のアーティファクトをチャージする。\n\n_+3:_杖で殴ることで、バトルメイジに_1.5ターン_分のアーティファクト・チャージを与える。
actors.hero.talent.mystical_charge.title=じゅごん
actors.hero.talent.mystical_meal.desc=食料を食べるとローグは1ターンを要し（補給食は即座に食べられる）、3ターンのアーティファクト・チャージを得る。\n\n_+2:_ 食料を食べるとローグに1ターンかかり（補給食は即座に食べられる）、_5ターンのアーティファクト回復_を与える。\n\nこの才能は "豊穣の角 "をチャージさせるために使用することはできない。
actors.hero.talent.mystical_meal.title=神秘的な食事
actors.hero.talent.natures_aid.desc=狩人は樹皮の鎧を0～2枚得る。この鎧は視界内で植物の効果が発動したとき、_3ターンごとに薄くなる。\n\n_+2:_ 狩人は樹皮の鎧を0～2個得る。この鎧は植物の効果が発動している時、_5ターン毎に薄くなる。
actors.hero.talent.natures_aid.title=自然の助け
actors.hero.talent.natures_bounty.desc=猟師はダンジョンの次の数フロアを探索すると、背の高い草の中に隠された4つの実を見つけることができる。\n\n_+2:_ダンジョンの次の数階を探索すると、狩人は背の高い草の中に隠された_ベリー_6個を見つけることができる。\n\nベリーはすぐに食べられ、少量の満腹感を回復し、使用可能な種が含まれているかもしれない。
actors.hero.talent.natures_bounty.title=自然の恵み
actors.hero.talent.natures_wrath.desc=_+1:_自然の力が発動している間、精霊の弓からの射は8％の確率でランダムな有害植物の効果を誘発する。\n\n_+2:_自然の力が発動している間、精霊の弓からの射は_17%の確率でランダムな有害植物の効果を誘発する。\n\n_+3:_自然の力が発動している間、精霊の弓からの射は_25%の確率でランダムな有害植物の効果を誘発する。\n\n_+4:_自然の力が発動している間、精霊の弓からの射は_33%の確率でランダムな有害植物の効果を誘発する。\n\n発動する植物はブラインド・ウィード、ファイヤー・ブルーム、アイスキャップ、ソレストモス、ストームバイン。
actors.hero.talent.natures_wrath.title=自然の怒り
actors.hero.talent.necromancers_minions.desc=魂がマークされた敵が死亡したとき、ウォーロックは13％の確率でその敵を堕落した亡霊として蘇らせる。\n\n_+2:_ 魂をマークされた敵が死亡したとき、ウォーロックは_27％の確率でその敵を堕落した亡霊として蘇らせる。\n\n_+3:_ 魂をマークされた敵が死亡したとき、ウォーロックは_40％の確率でそれらを堕落した亡霊として蘇らせる。
actors.hero.talent.necromancers_minions.title=黒魔術師の手下
actors.hero.talent.patient_strike.desc=_+1:_近接攻撃を行う前に待機した場合、_1-2のボーナスダメージを与える。\n\n_+2:_ 決闘者が近接攻撃を行う前に待機した場合、_2ボーナス・ダメージ_を与える。
actors.hero.talent.patient_strike.title=患者ストライキ
actors.hero.talent.perfect_copy.desc=シャドウ・クローンはヒーローの最大HPの_10%_を獲得し、_1タイル_先までヒーローと即座に入れ替わることができる。\n\n_+2:_ 影のクローンはヒーローの最大HPの_20%_を獲得し、_2タイル_先までヒーローと即座に入れ替わることができる。\n\n_+3:_ 影のクローンはヒーローの最大HPの_30%_を得、_3タイル_先までヒーローと即座に入れ替わることができる。\n\n_+4:_ 影のクローンはヒーローの最大HPの_40%_を得、_4タイル_先までヒーローと即座に入れ替わることができる。
actors.hero.talent.perfect_copy.title=完全コピー
actors.hero.talent.point_blank.desc=ハントレスが弓や投擲武器を近接攻撃で使う場合、命中率は-50％から-25％になる。\n\n_+2:_狩人が弓や投擲武器を近接攻撃で使用する場合、-50％の代わりに_通常の命中率を持つ。\n\n_+3:_ハントレスが弓や投擲武器を近接攻撃で使用する場合、-50％の代わりに_+25％の命中率を持つ。\n\nなお、投擲武器や精霊の弓を遠距離で使用する場合、命中率は常に＋50％である。
actors.hero.talent.point_blank.title=白地
actors.hero.talent.precise_assault.desc=_+1:_デュエリストが武器能力を使用したとき、5ターン以内の次の近接攻撃に_2倍の命中率を得る。\n\n_+2:_デュエリストが武器能力を使用したとき、5ターン以内の次の近接攻撃に_5倍の命中率を得る。\n\n_+3:_デュエリストが武器能力を使用したとき、5ターン以内の次の近接攻撃に_無限の命中力を得る。
actors.hero.talent.precise_assault.meta_desc=この才能を別のヒーローが得た場合、代わりに近接攻撃の命中率が+1で10％、+2で20％、+3で30％上昇する。
actors.hero.talent.precise_assault.title=強襲
actors.hero.talent.projectile_momentum.desc=_+1:_フリーランニング中、フリーランナーは投擲武器で命中率+50％、ダメージ+15％を得る。\n\n_+2:_フリーランニング中、投げ武器で命中率+100%、ダメージ+30%を得る。\n\nフリーランニング中、投げ武器で_+150%の命中率と+45%のダメージ_を得る。
actors.hero.talent.projectile_momentum.title=発射運動量
actors.hero.talent.projecting_blades.desc=_+1:_スペクトラル・ブレードの命中率は_+25％で、_2枚のタイルを貫通することができる。\n\n_+2:_ スペクトラル・ブレードの命中率は_+50%で、_4マスまで貫通する。\n\n_+3:_ スペクトラル・ブレードの命中率は_+75%で、_6ソリッドタイル_まで貫通できる。\n\n_+4:_ スペクトラル・ブレードの命中率は_+100%で、_8ソリッドタイル_まで貫通できる。
actors.hero.talent.projecting_blades.title=プロジェクション・ブレード
actors.hero.talent.protective_shadows.desc=_+1:_ローグは透明であるターン毎にシールドを1枚獲得し、_最大3枚まで獲得できる。\n\n_+2:_ Rogueは透明である毎ターン_最大5までのシールドを1枚得る。
actors.hero.talent.protective_shadows.title=ぼうえい
actors.hero.talent.provoked_anger.desc=_+1:_ウォリアーに適用されているシールドバフがダメージによって解除された場合、そのウォリアーの次の物理攻撃は_3ボーナスダメージ_を与える。\n\n_+2:_戦士に適用されている遮蔽バフがダメージによって解除されたとき、その戦士の次の物理攻撃は_5のボーナスダメージを与える。
actors.hero.talent.provoked_anger.title=いかり
actors.hero.talent.ratforcements.desc=自分自身にratmogrifyを使い、自分の隣にいる味方の有袋類ネズミ1匹をスポーンする。\n\n_+2:_ 自分にratmogrifyを使用する _隣の味方の有袋類のネズミ2匹をスポーンする。\n\n_+3:_ 自分自身にratmogrifyを使用する _隣の味方の有袋類のネズミを3匹生む。\n\n_+4:_ 自分自身にratmogrifyを使用する _隣の味方の有袋類のネズミを4匹生む。
actors.hero.talent.ratforcements.title=ネズミ狩り
actors.hero.talent.ratlomacy.desc=_+1:_ ネズミ化した敵にratmogrifyを使用すると、その敵を友好的にし、変身を永続させる。\n\n_+2:_ ネズミ化した敵にratmogrifyを使うと友好的になり、変身を永続化し、_2ターン_のアドレナリンを与える。\n\n_+3:_ ネズミ化した敵にratmogrifyを使用すると友好的になり、変身を永続化し、_4ターン_のアドレナリンを与える。\n\n_+4:_ ネズミ化した敵にratmogrifyを使用すると、友好的になり、変身を永続化し、_6ターン_のアドレナリンを与える。
actors.hero.talent.ratlomacy.title=ネズミ算
actors.hero.talent.ratsistance.desc=敵対するネズミ化した敵は_-10%のダメージを与える。\n\n_+2:_ 敵対するネズミ化した敵は_-19%のダメージを与える。\n\n_+3:_ 敵対するネズミ化した敵は_-27%のダメージを与える。\n\n_+4:_ 敵対するネズミ化した敵は_-35%のダメージを与える。
actors.hero.talent.ratsistance.title=ラッツ
actors.hero.talent.reactive_barrier.desc=_+1:_ 魔道士はエレメンタルブラストの効果を受けたキャラクター1体につき_2.5シールドを得る、最大5体まで。\n\n_+2:_ エレメンタル・ブラストの効果を受けたキャラクター1体につき、魔道士は_5シールドを得る。\n\n_+3:_ 魔道士はエレメンタル・ブラストの効果を受けるキャラクター1体につき、_7.5シールドを得る。\n\n_+4:_魔道士はエレメンタル・ブラストの効果を受けるキャラクター1人につき_10シールドを得る。
actors.hero.talent.reactive_barrier.title=反応障壁
actors.hero.talent.recall_inscription.desc=_+1:_クレリックは_10ターン以内に最後に使用したルーンストーンや巻物の効果を繰り返すことができる_碑文を呼び戻す_呪文を唱えることができる。\n\n_+2:_ クレリックは、_300ターン以内に最後に使用したルーンストーンや巻物の効果を繰り返すことができる呪文、_Recall Inscriptionを唱えることができる。\n\nリコール・インスクリプションはアップグレードのスクロールでは使用できない。このスペルのチャージコストは最近使用したアイテムによって異なる：ルーンストーンは2、スクロールは3、エキゾチックスクロールは4。ルーンストーンの場合は2、スクロールの場合は3、エキゾチックスクロールの場合は4。転成のスクロールや、転成やアップグレードを使って作らなければならない錬金術のアイテムで使用する場合も、このチャージコストは2倍になる。
actors.hero.talent.recall_inscription.meta_desc=この才能を別のヒーローが獲得した場合、代わりにスクロールやルーンストーンが+1の場合10%、+2の場合15%払い戻される。アップグレードのスクロールはこの効果から除外される。
actors.hero.talent.recall_inscription.refunded=商品は返金されました！
actors.hero.talent.recall_inscription.title=リコール碑文
actors.hero.talent.rejuvenating_steps.desc=_+1:_狩人が短い草や燃えさしを踏むと、それらは背の高い草に湧き上がり、狩人はそれを即座に刈り取る。これには_10ターンのクールダウンがある。\n\n_+2:_狩人が短い草や燃えさしを踏むと、それらは高い草に湧き上がり、狩人はすぐにそれを刈る。これには_5ターンのクールダウンがある。\n\nこのタレントはパッシブ再生効果が無効になっているか、ヒーローが長い間Expを獲得していない場合に草を生やす。
actors.hero.talent.rejuvenating_steps.title=若返りのステップ
actors.hero.talent.remote_beacon.desc=_+1:_魔道士は_4タイル_以内の任意の場所にビーコンを置くことができる。\n\n_+2:_ 魔道士は_8タイル_以内の任意の位置にビーコンを置くことができる。\n\n_+3:_ 魔道士は_12タイル_以内の任意の位置にビーコンを置くことができる。\n\n_+4:_ 魔道士は_16タイル_以内の任意の場所にビーコンを置くことができる。\n\n魔道士は近づけない場所にビーコンを設置できない。
actors.hero.talent.remote_beacon.title=リモート・ビーコン
actors.hero.talent.rogues_foresight.desc=そのレベルに秘密があることに気づく確率は75%である。\n\n_+2:_ ローグが秘密の部屋のあるレベルにいる場合、_100％の確率でそのレベルに秘密が隠されていることに気づく。
actors.hero.talent.rogues_foresight.title=悪人の先見性
actors.hero.talent.runic_transference.desc=_+1:_戦士の破れた封印は、アップグレードを転送するのと同じ方法で、_通常のグリフ_を転送することができる。\n\n_+2:_ 戦士の破れた印章は、アップグレードを移すのと同じ方法で、_通常・強力・呪いのグリフ_を移すことができる。\n\nその封印は、封印が貼られたときに鎧に施されていたグリフのみを転送できる。
actors.hero.talent.runic_transference.meta_desc=この才能を別のヒーローが得た場合、代わりにアーマーのグリフがアップグレードのスクロールによって除去されにくくなる。グリフはレベル6(4から上昇)から+1、レベル7(4から上昇)から+2でアップグレードすると失われ始める。グリフが確実に失われるレベルは+8で変わらない。
actors.hero.talent.runic_transference.title=ルニック転移
actors.hero.talent.satiated_spells.desc=そのクレリックは次に呪文を唱えたとき、_+1:_ 食べ物を食べると_+3シールドを得る。\n\n_+2:_ 食べ物を食べると、そのクレリックは次に呪文を唱える際に_5遮蔽_を得る。
actors.hero.talent.satiated_spells.meta_desc=この才能を別のヒーローが獲得した場合、代わりにシールドが即座に付与される。
actors.hero.talent.satiated_spells.title=飽食の呪文
actors.hero.talent.scholars_intuition.desc=杖の識別が3倍速くなる。\n\n_+2:_魔道士は杖を_使うときに_識別する。
actors.hero.talent.scholars_intuition.title=学者の勘
actors.hero.talent.searing_light.desc=_+1:_《導きの光》に照らされた敵に対するクレリックの物理攻撃は、_+3ダメージを与える。\n\n_+2:_クレリックの、_Guiding Light_に照らされた敵への物理攻撃は_+5ダメージを与える。
actors.hero.talent.searing_light.meta_desc=この才能を別のヒーローが得た場合、代わりにワンドやアーティファクトを敵に使用した後にボーナスダメージを与える。
actors.hero.talent.searing_light.title=灼熱の光
actors.hero.talent.seer_shot.desc=_+1:_ハントレスが地面に矢を放つと、5ターンの間、周囲3×3の範囲に視界を与える。クールダウンは20ターン。\n\n_+2:_ハントレスが地面に矢を放つと、10ターンの間、周囲3x3の範囲に視覚を与える。クールダウンは20ターン。\n\n_+3:_ハントレスが地面に矢を放つと、15ターンの間、周囲3×3の範囲に視覚を与える。クールダウンは20ターン。
actors.hero.talent.seer_shot.meta_desc=この才能を別のヒーローが得た場合、どの投げ武器でも発動する。
actors.hero.talent.seer_shot.title=シーサーショット
actors.hero.talent.shadow_blade.desc=そのシャドウ・クローンは毎ターン、ヒーローのダメージの_8%_を獲得し、ヒーローの武器に_25%の確率でエンチャントを使用する。\n\nヒーローの武器のエンチャントを使用する確率は50%である。\n\nターンごとにヒーローのダメージの_24%_を獲得し、ヒーローの武器に_75%の確率でエンチャントを使用する。\n\nヒーローの武器にエンチャントを使用する確率は_100%である。
actors.hero.talent.shadow_blade.title=シャドウブレード
actors.hero.talent.shadow_step.desc=_+1:_透明な状態で発煙筒を使用した場合、発煙筒は即座に発生し、チャージ・コストが_16%減少する。\n\n_+2:_ローグが透明状態で煙爆弾を使用した場合、即座に発生し、チャージ・コストが_30%減少するが、敵を盲目にしたり他の才能を誘発させたりもしない。\n\n_+3:_ローグが透明状態で煙爆弾を使用した場合、即座に発生し、チャージ・コストが_41%減少するが、敵の目をくらませたり他の才能を誘発させたりもしない。\n\n_+4:_ローグが透明状態で煙爆弾を使用した場合、即座に発生し、チャージ・コストが_50%減少するが、敵の目をくらませたり他の才能を誘発させたりもしない。
actors.hero.talent.shadow_step.title=シャドーステップ
actors.hero.talent.shared_enchantment.desc=投擲武器は33％の確率でスナイパーの弓のエンチャントを使用する。\n\n_+2:_ 投擲武器は_67%の確率でスナイパーの弓にエンチャントを使用する。\n\n投擲武器は_100%の確率でスナイパーの弓にエンチャントを使用する。\n\n弓のエンチャントは投擲武器が既に持っているエンチャントに加えて発動することがある。
actors.hero.talent.shared_enchantment.title=魅力の共有
actors.hero.talent.shared_upgrades.desc=アップグレードされた投擲武器で攻撃する場合、各レベルで狙撃の効果時間が1ターン増加し、特殊攻撃のダメージが16%増加する。\n\nアップグレードされた投擲武器で攻撃する場合、各レベルで狙撃の印の持続時間が1ターン、特殊攻撃のダメージが16%増加し、最大で_4ターン、+4_時のダメージが+67%になる。\n\nアップグレードされた投擲武器で攻撃する場合、各レベルで狙撃の印の持続時間が1ターン増加し、特殊攻撃のダメージが16%増加する。
actors.hero.talent.shared_upgrades.title=共有アップグレード
actors.hero.talent.shield_battery.desc=_+1:_メイジはワンドでセルフ・ターゲットを行い、1チャージにつき最大HPの_4%の割合でチャージをシールドに変換することができる。\n\n_+2:_魔道士はワンドでセルフターゲットし、1チャージにつき最大HP_6%の割合ですべてのチャージをシールドに変換することができる。
actors.hero.talent.shield_battery.title=シールドバッテリー
actors.hero.talent.shield_of_light.desc=クレリックは即座に唱えられ、1チャージを消費して5ターンの間対象1体に_2-4アーマー_を与える_光の盾_を唱えることができる。\n\n_+2:_ クレリックは即座に唱えられ、1チャージを消費して5ターンの間対象に対して_3-6アーマー_を与える呪文、_光の盾_を唱えることができる。
actors.hero.talent.shield_of_light.meta_desc=このタレントが別のヒーローによって獲得された場合、代わりに対象とした敵から受ける物理ダメージを1減らす。
actors.hero.talent.shield_of_light.title=光の盾
actors.hero.talent.shielding_dew.desc=デュードロップはウォーデンの体力が満タンのとき、最大HPの20%までシールドを張ることができる。\n\n_+2:_ デュードロップはウォーデンの体力が満タンの時、最大HP_40%までシールドを張ることができる。\n\n_+3:_ デュードロップはウォーデンのHPが満タンの時、最大HPの60%までシールドを張ることができる。
actors.hero.talent.shielding_dew.title=遮光露
actors.hero.talent.shock_force.desc=Shockwave は与えるダメージが20%増加し、25%の確率で気絶させる。\n\n衝撃波は与えるダメージが_40%増加し、_50%の確率で気絶させる。\n\n3:_ Shockwaveは与えるダメージが_60%増加し、_75%の確率で気絶させる。\n\n衝撃波は与えるダメージが_80%増加し、_100%の確率で気絶させる。
actors.hero.talent.shock_force.title=衝撃力
actors.hero.talent.shrug_it_off.desc=耐えている間の戦士のダメージ軽減率は50％から60％に増加する。\n\n_+2:_ 耐久中の戦士のダメージ軽減率は、50％から68％に増加する。\n\n_+3:_ 耐久中の戦士のダメージ軽減率は、50％から74％に増加する。\n\n_+4:_ 耐久中の戦士のダメージ軽減率は、50％から80％に増加する。
actors.hero.talent.shrug_it_off.title=いなす
actors.hero.talent.silent_steps.desc=ローグは眠っている敵から3タイル以上離れている間は起こさない。\n\n_+2:_ 《ならず者》は《隣接していない》間は眠っている敵を起こさない。
actors.hero.talent.silent_steps.title=サイレントステップ
actors.hero.talent.soul_eater.desc=_+1:_ソウルマークは与えた物理ダメージ1つにつき_0.33ターンの満腹感を与える。ソウルマークのついた敵は死亡時に_10%の確率でオンイート効果を発動する。\n\n_+2:_ ソウルマークは物理ダメージを与えるごとに_0.67ターンの満腹状態を与える。ソウルマークを付けた敵は死亡時に_20%の確率でオンイート効果を発動する。\n\n_+3:_ ソウルマークは物理ダメージを与えるごとに_1ターンの満腹を与える。ソウルマークを付けた敵は死亡時に_30%の確率でオンイート効果を発動する。
actors.hero.talent.soul_eater.title=ソウルイーター
actors.hero.talent.soul_siphon.desc=他のキャラクターが与えた物理ダメージは、ウォーロックのソウルマークを_13%の効果で誘発する。\n\n_+2:_ 他のキャラクターが与えた物理ダメージは、_27%の効果でウォーロックのソウルマークを誘発させる。\n\n_+3:_ 他のキャラクターが与えた物理ダメージは、_40%の効果でウォーロックのソウルマークを誘発させる。
actors.hero.talent.soul_siphon.title=ソウルサイフォン
actors.hero.talent.speedy_stealth.desc=_+1:_透明になっている間、Freerunnerは1ターンにつき2スタックの運動量を得る。\n\n_+2:_ +1の利点に加え、Freerunnerが透明である間、Freerunningはもはやカウントダウンしない。\n\n_+3:_+1と+2の利点に加え、Freerunnerは透明になっている間、Freerunningをしているかどうかに関わらず2倍の速度で移動する。
actors.hero.talent.speedy_stealth.title=スピード・ステルス
actors.hero.talent.spirit_blades.desc=_+1:_妖刀は30％の確率で霊弓のエンチャントも使用する。\n\n_+2:_妖刀は_60%の確率で精霊の弓にもエンチャントを使用する。\n\n_+3:_妖刀は_90%の確率で精霊の弓にもエンチャントを使用する。\n\n妖刀は_100%の確率で精霊の弓にもエンチャントを使用し、それぞれのエンチャントに_+10%の威力を与える。
actors.hero.talent.spirit_blades.title=霊刃
actors.hero.talent.spirit_form.desc=クレリックは_Spirit Form_を唱えることができる。これはトリニティに、クレリックがこのランで確認した指輪やアーティファクト（聖なる書物を除く）のパワーを与えるもので、チャージは4である。\n\nトリニティが使用されると、クレリックは20ターンの間_+1_で指輪の効果を得るか、_+4._でアーティファクトの効果を発動する。\n\n_+2:_三位一体使用時、クレリックは20ターンの間_+2_で指輪の効果を得るか、_+6._でアーティファクトの効果を誘発する。\n\n_+3:_トリニティが使われたとき、クレリックは20ターンの間_+3_でリングの効果を得るか、_+8._でアーティファクトの効果を誘発する。\n\n_+4:_三位一体使用時、クレリックは20ターンの間_+4_で指輪の効果を得るか、_+10._でアーティファクトの効果を誘発する。\n\nトリニティは一度に1つのスピリットの効果しか与えられない。アーティファクトはトリニティによって誘発されたとき、さまざまな効果とアーマーチャージ・コストを持つ。
actors.hero.talent.spirit_form.title=精神形
actors.hero.talent.stasis.desc=クレリックは2チャージを消費して、パワーアップした味方に_Stasis_をかけることができる。Stasisは味方を一時的にダンジョンから追い出し、Power of Manyを含む全てのバフの残り時間を維持する。効果が終了すると味方は再びあなたの隣に現れる。Stasisは即座に再発動することができ、効果を早期に終了させるためのコストもかからない。Stasisは動かない味方にも効果があるが、ダンジョンのフロア間で移動させることはできない。\n\n_+1:_Stasisは最大で_60ターン持続する。\n\n_+2:_ Stasisは最大で_90ターン持続する。\n\n_+3:_ステイシスは最大で_120ターン続く_\n\n_+4:_ステイシスは最大で_150ターン続く_\n\nクレリックは味方が静止しているときにBeaming Rayを唱えて再召喚したり、Life Linkを唱えてその効果を先取りすることもできる。ただし、味方がスタシスにある間はライフ・リンクの恩恵を受けない。
actors.hero.talent.stasis.title=うっ血
actors.hero.talent.strengthening_meal.desc=食べ物を食べると、次に_2回_敵に物理攻撃を命中させたとき、3ボーナスダメージを与える。\n\n_+2:_ 食べ物を食べることで、次に_3回_敵に物理攻撃を当てたとき、デュエリストに3ボーナスダメージを与える。
actors.hero.talent.strengthening_meal.title=強化食
actors.hero.talent.striking_force.desc=エレメンタルストライクの威力が_30%増加する。\n\n_+2:_ エレメンタルストライクの威力が_60%増加する。\n\n_+3:_ 要素攻撃の威力が_90%増加する。\n\n_+4:_ 要素攻撃の威力が_120%増加する。
actors.hero.talent.striking_force.title=打撃力
actors.hero.talent.striking_wave.desc=衝撃波は30％の確率で、エンチャントやコンボのようなヒット時効果も使用する。\n\nショックウェーブは_60%の確率でエンチャントやコンボなどのオンヒット効果も使用する。\n\nショックウェーブは_90%の確率でエンチャントやコンボなどのヒット時効果も使用する。\n\n衝撃波は_100%の確率でエンチャントやコンボなどのヒット時効果も使用し、エンチャントに_+20%のパワーを与える。
actors.hero.talent.striking_wave.title=寄波
actors.hero.talent.strongman.desc=戦士の体力は8％増加し、切り捨てられる。\n\n戦士の体力は13％増加し、切り捨てられる。\n\n_+3:_ 戦士の体力は_18％_増加し、切り捨てられる。
actors.hero.talent.strongman.title=ストロングマン
actors.hero.talent.sucker_punch.desc=ローグは最初に敵を奇襲した際に_1～2のボーナス・ダメージを与える。\n\n_+2:_ ローグは最初に敵を奇襲した際に_2のボーナス・ダメージを与える。
actors.hero.talent.sucker_punch.title=吸盤パンチ
actors.hero.talent.sunray.desc=クレリックは_4～8ダメージを与え_4ターンの間_対象を見えなくする_Sunray,_を1チャージで唱えることができる。\n\n_+2:_ クレリックは_6-12ダメージを与え_6ターンの間_対象を見えなくする_Sunray,_を唱えることができる。\n\nSunrayは各対象を1度だけ盲目にできるが、対象がすでにSunrayによって盲目になっている場合、代わりに麻痺させる。Sunrayは悪魔やアンデッドの敵には常に最大ダメージを与える。
actors.hero.talent.sunray.meta_desc=この才能を別のヒーローが得た場合、代わりに杖とアーティファクトが4ターンの間、敵を盲目にする。
actors.hero.talent.sunray.title=サンレイ
actors.hero.talent.survivalists_intuition.desc=_+1:_狩人は投げられた武器を3倍速く識別する。\n\n_+2:_ 狩人は投擲武器を識別する。
actors.hero.talent.survivalists_intuition.title=サバイバリストの勘
actors.hero.talent.sustained_retribution.desc=戦士は1ヒットで100％のボーナス・ダメージを与える代わりに、2ヒットで115％のボーナス・ダメージを与える。\n\n_+2:_ 戦士は1ヒットで100%のボーナス・ダメージを与える代わりに、3ヒットで130%のボーナス・ダメージを与える。\n\n1 回の攻撃で100％のボーナス・ダメージを与える代わりに、4 回の攻撃で145％のボーナス・ダメージを与える。\n\n1 回の攻撃で100％のボーナス・ダメージを与える代わりに、5 回の攻撃で160％のボーナス・ダメージを与える。
actors.hero.talent.sustained_retribution.title=ふくしゅう
actors.hero.talent.swift_equip.desc=_+1:_デュエリストは20ターンに1度、装備している武器を即座に切り替えることができる。\n\n_+2:_ 決闘者は20ターンごとに2回、装備している武器を即座に切り替えることができる。\n\nデュエリストがこの才能を持っていてクールダウン中でない場合、装備していない武器を素早く使うことで装備できる。
actors.hero.talent.swift_equip.title=スイフト
actors.hero.talent.swift_spirit.desc=スピリット・ホークの移動速度は2タイルから2.5タイルに増加し、それに対する最初の2回の攻撃をかわすことが保証される。\n\n_+2:_ 霊鷹の移動速度は2から_3タイル_に増加し、それに対して行われる最初の_4回の攻撃をかわすことが保証される。\n\n精霊の鷹の移動速度は2から_3.5タイル_に増加し、それに対して最初に行われる_6回の攻撃をかわすことが保証される。\n\n精霊の鷹の移動速度は2から_4タイル_に増加し、それに対して行われる最初の_8回の攻撃をかわすことが保証される。
actors.hero.talent.swift_spirit.title=獅子奮迅
actors.hero.talent.telefrag.desc=魔道士が他のキャラクターにワープした場合、そのキャラクターに10～15ダメージを与えるが、同時に5ダメージを受ける。\n\n_+2:_ 魔道士が他のキャラクターにワープした場合、それに_20～30のダメージを与えるが、_10のダメージも受ける。\n\n_+3:_ 魔道士が他のキャラクターにワープした場合、それに_30～45のダメージを与えるが、_15のダメージも受ける。\n\n_+4:_ 魔道士が他のキャラクターにワープした場合、それに_40～60のダメージを与えるが、_20のダメージも受ける。\n\nヒーローはこのタレントによって殺されることはなく、自己ダメージは魔法抵抗効果によって軽減される。
actors.hero.talent.telefrag.title=テレフラッグ
actors.hero.talent.thiefs_intuition.desc=ローグは2倍速く指輪を識別し、装備時に指輪の種類を識別する。\n\n_+2:_ ローグは装備した時に指輪を識別し、拾った時に指輪の種類を識別する。
actors.hero.talent.thiefs_intuition.title=泥棒の勘
actors.hero.talent.twin_upgrades.desc=チャンピオンの装備している2つの武器のうち1つのレベルが低く、もう1つの武器より2段階以上低い場合、もう1つの武器のレベルにブーストされる。\n\nチャンピオンの装備している2つの武器のうち、1つの武器のレベルが低く、もう1つの武器より1段階以上低い場合、もう1つの武器のレベルにブーストされる。\n\nチャンピオンの装備している2つの武器のうち1つのレベルが低く、もう1つの武器と同じかそれ以下の場合、もう1つの武器のレベルにブーストされる。
actors.hero.talent.twin_upgrades.title=ツインアップグレード
actors.hero.talent.unencumbered_spirit.desc=モンクは使用しているティア3以下の装備品1つにつき、エネルギーが50％増加する。\n\n_+2:_ モンクは使用している _tier 2 以下の装備品1つにつき、_75%多いエネルギーを得る。Tier3の恩恵は変わらない。\n\n_+3:_ モンクは使用している_tier1以下の装備品1つにつき_100%のエネルギーを得る。Tier2とTier3の恩恵に変化はない。また、布製の鎧とスタッズ付きの手袋を無料で得る。\n\nなお、この才能は武器を持たない状態やRing of Forceを使用した攻撃には効果がない。
actors.hero.talent.unencumbered_spirit.title=磊落
actors.hero.talent.varied_charge.desc=チャンピオンは2つの異なる武器アビリティを使用すると、瞬時に0.17ウェポン・チャージを回復する。\n\n_+2:_ チャンピオンは2つの異なる武器アビリティを使用すると、瞬時に0.33ウェポン・チャージを回復する。\n\n王者は2つの異なる武器アビリティを使用したとき、時間制限なしで即座に_0.5ウェポン・チャージ_を回復する。
actors.hero.talent.varied_charge.title=各種料金
actors.hero.talent.veterans_intuition.desc=戦士は武器を1.75倍速く、鎧を2.5倍速く識別する。\n\n_+2:_ 戦士は武器を_2.5倍速く識別し、防具を_装備する。
actors.hero.talent.veterans_intuition.title=ベテランの勘
actors.hero.talent.wall_of_light.desc=パラディンは光の壁という、敵を押し流す幅3タイルの固い壁をパラディンの前に作り、20ターン持続する呪文を唱えることができる。\n\n_+2:_ パラディンは_光の壁、_幅5タイルの固い壁をパラディンの正面に作り、敵を押し退け、20ターン持続する呪文を唱えることができる。\n\n_+3:_ パラディンは_光の壁、_幅7タイルの固い壁をパラディンの前に作り、敵を押し退け、20ターン持続する呪文を唱えることができる。\n\n壁は縦にも斜めにも置くことができ、一度に存在できるのは1つだけである。
actors.hero.talent.wall_of_light.title=光の壁
actors.hero.talent.wand_preservation.desc=新しい杖を杖に吹き込むと、古い杖は+0で戻される。\n\n_+2:_ メイジが杖に新しいワンドを宿すと、古いワンドは+0で返される、_これは1ヒーローレベルのクールダウンで繰り返すことができる_。
actors.hero.talent.wand_preservation.meta_desc=この才能を別のヒーローが得た場合、代わりに、ワンドを錬金術の壺に入れたときに 得られるアーケインレジンの量が、+1の場合は1増加し、+2の場合は2増加する。
actors.hero.talent.wand_preservation.title=ワンド保存
actors.hero.talent.weapon_recharging.desc=_+1:_ワンドやアーティファクトのリチャージバフの効果下にあるとき、デュエリストは_15ターンごとに武器チャージを1つ得る。\n\n_+2:_ワンドやアーティファクトのリチャージバフの効果を受けているとき、デュエリストは_10ターンごとに武器チャージを1つ得る。
actors.hero.talent.weapon_recharging.meta_desc=この才能を別のヒーローが得た場合、代わりに+1でリチャージ中の近接ダメージが+5%、または+2でリチャージ中の近接ダメージが+7.5%になる。
actors.hero.talent.weapon_recharging.title=武器充電
actors.hero.talent.wide_search.desc=_+1:_ 《ならず者》の捜索半径が5x5の正方形から7x7の円形に増加する。\n\n_+2:_ ローグの探索範囲を5x5の正方形から_7x7の正方形に増加する。
actors.hero.talent.wide_search.meta_desc=この才能を別のヒーローが得た場合、代わりに探索半径が3x3の正方形から5x5の円に+1され、5x5の正方形に+2される。
actors.hero.talent.wide_search.title=ワイド検索
actors.hero.talent.wild_momentum.desc=_+1:_スピリットボウで敵を倒すと、自然の力の持続時間が_1ターン延長される。最大で2ターン延長できる。\n\n_+2:_精霊の弓で敵を倒すと、自然の力の持続時間が_2ターン延長される。最大4ターン延長可能。\n\n_+3:_精霊の弓で敵を倒すと、自然の力の持続時間が_3ターン延長される。最大6ターン延長される。\n\n_+4:_精霊の弓で敵を倒すと、自然の力の持続時間が_4ターン延長される。最大で8ターン延長される。
actors.hero.talent.wild_momentum.title=ワイルド・モメンタム
actors.hero.talent.wild_power.desc=_+1:_野生の魔法を使うとき、杖の威力は_2か3、最大+4される。\n\n_+2:_ 野生の魔法を使用するとき、杖は_3、最大+5_される。\n\n_+3:_ 野生の魔法を使用すると、杖は_3か_4、最大+6_まで強化される。\n\n_+4:_ 野生の魔法を使用すると、杖の効果が_4、最大+7_される。
actors.hero.talent.wild_power.title=ワイルドパワー
actors.mobs.acidic.desc=この巨大なクモの巣のような悪魔のようなクリーチャーは接近戦を避け、遠距離から鋸歯状のトゲを放つことを好む。これは腐食性の滲出液が垂れているように見える。
actors.mobs.acidic.name=酸性蠍座
actors.mobs.albino.desc=これは有袋類の珍しい品種で、真っ白な毛とギザギザの歯を持っている。
actors.mobs.albino.discover_hint=この敵はダンジョンの特定の地域でまれに見かけることがある。
actors.mobs.albino.name=アルビノラット
actors.mobs.armoredbrute.desc=最も上級のニョール・ブルートは、その地位を示すために強力な鎧を身に着けていることが多い。この鎧のおかげで、これらのブルートは物理的なダメージに対してより強くなり、より鍛錬を積んでいるため、傷に屈するまでずっと長く怒り続けることができる。
actors.mobs.armoredbrute.name=装甲獣
actors.mobs.armoredstatue.desc=このダンジョンにある無生物の彫像のひとつに過ぎないと思うだろうが、赤く光る目がそれを物語っている。\n\n鎧を身にまとっているため、コンディションは良さそうだ。
actors.mobs.armoredstatue.desc_arm_wep=像自体は石でできているが、振り回している_%1$s_と_%2$s_は本物に見える。
actors.mobs.armoredstatue.name=鎧像
actors.mobs.bandit.desc=地下牢の奥深くは、昔からあらゆる種類の犯罪者の隠れ家だった。日光から遠く離れた場所で長い時間を過ごすうちに、正気を保てた者は皆無だった。遠い昔、こうした狂気の泥棒や山賊たちは、自分が何者なのか、なぜ盗みを働くのかさえ忘れてしまったのだ。
actors.mobs.bandit.name=狂った山賊
actors.mobs.bat.desc=洞窟に住むこの活発で粘り強い生き物は、見た目よりもずっと危険だ。攻撃を成功させるたびに体力を補充するため、はるかに大きな敵にも打ち勝つことができる。
actors.mobs.bat.name=きゅうけつこうもり
actors.mobs.bee.desc=ゴールデンミツバチは体が小さいにもかかわらず、自分の家を獰猛に守る傾向がある。この蜂はとても気性が荒いので、距離を置いたほうがいい。
actors.mobs.bee.desc_honey=ゴールデンミツバチは小さいにもかかわらず、自分の家を激しく守る傾向がある。この蜂はなだめすかして、あなたについてきたがっているようだ。
actors.mobs.bee.discover_hint=このキャラクターは特定のアイテムで見つけることができる。
actors.mobs.bee.name=ゴールデンビー
actors.mobs.brute$bruterage.desc=このグノールは死にかけだが、君を連れて行こうとしている！\n\nシールドが切れるか、ダメージを受けると瀕死になる。その間はダメージが大幅に増加するので気をつけよう！\n\nシールド残量%d。
actors.mobs.brute$bruterage.name=蛮怒
actors.mobs.brute.def_verb=ちっそく
actors.mobs.brute.desc=ブルートはノールの中でも最も大きく、力強く、頑丈だ。深手を負うと狂暴になり、敵にさらに大きな傷を負わせる。
actors.mobs.brute.enraged=激昂
actors.mobs.brute.name=ノールブルート
actors.mobs.causticslime.desc=このスライムは、下から発せられる闇の魔法に汚染されているようだ。いつもの緑色を失い、苛烈な滲出液が垂れている。
actors.mobs.causticslime.discover_hint=この敵はダンジョンの特定の地域でまれに見かけることがある。
actors.mobs.causticslime.name=苛性スライム
actors.mobs.crab.desc=この巨大なカニは下水道の食物連鎖の頂点にいる。非常に足が速く、厚い甲羅は激しい打撃にも耐える。
actors.mobs.crab.name=下水蟹
actors.mobs.crystalguardian.def_verb=ちっそく
actors.mobs.crystalguardian.desc=この大きなクリスタルのガーディアンは、その明るく光る目がなければ、ほとんど彫像のように見える。固まった水晶でできているため、動きは鈍いがとてもタフだ。\n\nクリスタル・ガーディアンはその大きさゆえ、閉ざされた空間では動きが遅くなる。その大きさゆえ、クリスタル・ガーディアンは閉ざされた空間では動きが遅くなる。倒されて一時的に動けなくなることはあるが、しばらくすればまた立ち上がる。
actors.mobs.crystalguardian.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.crystalguardian.name=クリスタル・ガーディアン
actors.mobs.crystalmimic.ate=ミミックがあなたの%sを食べた！
actors.mobs.crystalmimic.desc=ミミックはどんな姿にもなれる魔法生物である。ダンジョンでは、無防備な冒険者をおびき寄せるため、ほとんどの場合、宝箱の形を選ぶ。\n\nクリスタル・ミミックは通常のミミックよりもやっかいで、戦利品を盗みながら争いを避けることを好む。発見されると小走りで逃げようとし、攻撃時に敵の位置を変える能力を持っている。
actors.mobs.crystalmimic.escaped=クリスタルのミミックが逃げ出した！
actors.mobs.crystalmimic.name=クリスタルミミック
actors.mobs.crystalspire.alert=振動は大きくなり、洞窟全体に鳴り響く！
actors.mobs.crystalspire.desc=この超硬質クリスタルの巨大な尖塔が、この洞窟にいる奇妙なクリスタルの生き物の元凶だろう。通常の武器は効かないので、破壊するにはツルハシが必要だ。\n\nこのような大きな結晶は採掘に時間がかかりそうで、おそらく邪魔されずに採掘することはできないだろう。尖塔自体にも防御手段があるかもしれない。"おそらく尖塔自身の攻撃を手下に対して使うことができる
actors.mobs.crystalspire.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.crystalspire.name=クリスタルの尖塔
actors.mobs.crystalspire.warning=クリスタルを叩くと振動する。これを続けていると、注目されるに違いない...。
actors.mobs.crystalwisp.beam_kill=光線があなたを殺した
actors.mobs.crystalwisp.desc=明るい光を放ちながら浮遊している、小さな怒れるクリスタルの塊。特に強力ではないが、クリスタル・ウィスプは狙いが定まれば、ダメージを与える光線を撃ってくる。\n\nウィスプは小さいので、様々なクリスタルの露頭の中を簡単に移動できるが、クリスタルを撃ち抜くことはできない。
actors.mobs.crystalwisp.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.crystalwisp.name=クリスタル・ウィスプ
actors.mobs.demonspawner.desc=このドワーフの肉のねじれたアマルガムは、この地域で死んだドワーフからリッパーの悪魔を作り出す責任がある。明らかに、悪魔たちは敵に対してあらゆる資源を利用することに何の問題も感じていない。\n\n見た目は恐ろしいが、デーモン・スポーナーには移動手段もなければ、直接身を守る手段もない。しかし、かなりの質量があるため、すぐに殺すことは難しく、脅威にさらされると、より素早くリッパー・デーモンを産み出す。\n\nデーモン・スポーナーは悪魔の力の中心的な源とつながっているようだ。彼らを殺すと、その力が弱まるかもしれない
actors.mobs.demonspawner.name=デーモンスポナー
actors.mobs.demonspawner.on_death=ここの悪魔のエネルギーは、産卵者が死ぬにつれて弱まっていくようだ。
actors.mobs.dm100.desc=DM-100はドワーフの "防衛機械 "の初期モデルで、この監獄の下にある洞窟でドワーフの鉱夫たちを守るために設計された。しかし、電気ショックが弱すぎることが判明したため、上の人間の都市に贈られた。何年も使われることなく、やがて刑務所にたどり着いたが、所長たちは当初、残酷すぎて使えないと判断した。しかし、囚人たちが手に負えなくなるにつれ、必需品となった。
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=稲妻があなたを殺した
actors.mobs.dm200.desc=DM-200はドワーフの第2世代の "防衛機械 "で、洞窟や地下都市でドワーフの鉱夫を守るために設計された。DM-200は前世代よりもはるかに大きく、かさばり、壊滅的な水圧拳で攻撃する。\n\nダンジョンの狭いトンネルや出入り口には入り込めない。ドワーフたちはDM-200の機動力のなさを補うため、遠くの敵や手の届かない敵に向かって有毒な排気ガスを放出できるようにした。
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200は有毒な排気ガスを噴射する！
actors.mobs.dm201.desc=ドワーフはDM-200の機動性の欠如をより強調する実験を短期間行い、完全に静止したDMモデルをいくつか作成した。DM-201はDM-200を改造したもので、移動能力を持たない見張り砲台として機能する。機動力の欠如と引き換えに、DM-201は耐久性と攻撃力が大幅に向上している。\n\nDM-201には排気を行うエンジンがないため、ドワーフは代わりに腐食性ガス手榴弾を装備した！しかし、DM-201はこの手榴弾の扱いに注意し、遠くから攻撃されたときのみ手榴弾を投げ込む。
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201は腐食性手榴弾を投げる！
actors.mobs.dm300.charge_lost=パイロン破壊！ローカルパワーに戻る
actors.mobs.dm300.charging=ダメージを受けたパワーパイロン起動
actors.mobs.dm300.charging_hint=DM-300はパイロン通電中は無敵！
actors.mobs.dm300.def_verb=ちっそく
actors.mobs.dm300.defeated=致命的なダメージシャットダウンを試みる
actors.mobs.dm300.desc=この機械は数世紀前にドワーフが造ったものだ。その後、ドワーフは機械の代わりにゴーレムや精霊、さらには悪魔まで使い始めた。それがやがて彼らの文明を衰退させた。DM-300と同種の機械は主に建設や採掘に使われ、ときには都市の防衛にも投入された。
actors.mobs.dm300.desc_supercharged=DM-300には電気エネルギーが充填されている。この状態のDM-300はダメージを受けず、倍速で移動する！さらに、ドリルが高速回転するようになり、固い岩でもトンネルを掘ることができる。\n\nスーパーチャージ中のDM-300を直接攻撃することは無意味だが、このエネルギーを供給しているものがいるはずで、それを破壊すると弱体化する可能性がある。
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=無許可者が検出された！
actors.mobs.dm300.pylons_destroyed=警告"送電網が不安定です
actors.mobs.dm300.rankings_desc=DM-300に押しつぶされる
actors.mobs.dm300.shield=DM-300は露出したワイヤーから電力を取り出し、自身をシールドする！
actors.mobs.dm300.supercharged=デストロイ破壊しろ破壊しろ
actors.mobs.dwarfking$dkghoul.rankings_desc=ドワーフの王の前に倒れる
actors.mobs.dwarfking$dkgolem.rankings_desc=ドワーフの王の前に倒れる
actors.mobs.dwarfking$dkmonk.rankings_desc=ドワーフの王の前に倒れる
actors.mobs.dwarfking$dkwarlock.rankings_desc=ドワーフの王の前に倒れる
actors.mobs.dwarfking.defeated=あなたは...我々を破滅させた
actors.mobs.dwarfking.desc=何年も前、ドワーフ宮廷で最高の魔法使いの一人が、生と死に関する途方もない力を与える秘密を暴いた。彼はすぐにこの力を行使し、仲間や王を服従させ、堕落させ、ついにはすべてのドワーフ市民を支配した。今や彼は王となり、アンデッドの臣民の軍団を支配している。\n\nドワーフの王は攻撃的な敵であり、アンデッドの手下の大群で敵を取り囲み圧倒しようとする。
actors.mobs.dwarfking.enraged=あなたは私を殺せない %s.私は不死身だ
actors.mobs.dwarfking.lifelink_1=私はあなたの本質を必要としている、奴隷よ！
actors.mobs.dwarfking.lifelink_2=私のために血を流せ、奴隷よ！
actors.mobs.dwarfking.losing=ダメだ！ こんなことはできない。
actors.mobs.dwarfking.name=ドワーフの王
actors.mobs.dwarfking.notice=よくもそんなことを！何を邪魔しているのかわかっていない！
actors.mobs.dwarfking.rankings_desc=ドワーフの王の前に倒れる
actors.mobs.dwarfking.teleport_1=対処しろ、奴隷！
actors.mobs.dwarfking.teleport_2=忙しくさせておけ、奴隷！
actors.mobs.dwarfking.wave_1=もういい！私の奴隷たちよ！
actors.mobs.dwarfking.wave_2=もっと王のために血を流せ
actors.mobs.dwarfking.wave_3=役立たず！今すぐ殺せ
actors.mobs.ebonymimic.desc=ミミックはどんな姿にもなれる魔法生物である。ダンジョンでは、無防備な冒険者をおびき寄せるため、ほとんどの場合、宝箱の形を選ぶ。\n\nエボニー・ミミックは、自分の姿をほとんど見えなくする能力を持つステルス・ミミックである。冒険者が接触しそうなものに潜んでいるが、戦利品も持っている。一度発見されれば通常のミミックよりも手強くはないが、不意打ちの噛みつきは破壊的である。
actors.mobs.ebonymimic.discover_hint=この敵は特定の装身具で見つけることができる。
actors.mobs.ebonymimic.hidden_desc=何かありそうだが、ほとんど透明だ。
actors.mobs.ebonymimic.hidden_name=疑わしい概要
actors.mobs.ebonymimic.name=黒檀ミミック
actors.mobs.ebonymimic.reveal=そこにはミミックがいた！
actors.mobs.elemental$chaoselemental.desc=エレメンタルは、強力なオカルト魔術が適切に制御されない場合にしばしば生み出される、混沌としたクリーチャーである。エレメンタルは最小限の知性しか持たず、通常は特定のタイプの魔法と関連している。\n\nカオス・エレメンタルは特定のエレメントに安定していない稀で危険なエレメンタルである。攻撃時には予測不可能な荒々しい魔法を放つ。
actors.mobs.elemental$chaoselemental.name=カオスエレメンタル
actors.mobs.elemental$fireelemental.desc=エレメンタルは、強力なオカルト魔術が適切に制御されない場合にしばしば生み出される、混沌としたクリーチャーである。エレメンタルは最小限の知性しか持たず、通常は特定のタイプの魔法と関連している。\n\nファイア・エレメンタルは炎の魔法でダメージを与える一般的なタイプのエレメンタルである。彼らは近接攻撃で対象を燃え上がらせ、時には炎のボルトを放つこともある。
actors.mobs.elemental$fireelemental.name=火属性
actors.mobs.elemental$frostelemental.desc=エレメンタルは、強力なオカルト魔術が適切に制御されない場合にしばしば生み出される、混沌としたクリーチャーである。エレメンタルは最小限の知性しか持たず、通常は特定のタイプの魔法と関連している。\n\nフロスト・エレメンタルは一般的なタイプのエレメンタルで、凍らせる魔法で敵を弱体化させる。彼らは近接攻撃と時々射撃攻撃で対象を凍らせる。彼らの魔法は水中ではより効果的である。
actors.mobs.elemental$frostelemental.name=フロストエレメンタル
actors.mobs.elemental$newbornfireelemental.charging=エレメンタルはチャージしている！
actors.mobs.elemental$newbornfireelemental.desc=エレメンタルは、強力なオカルト魔術が適切に制御されない場合にしばしば生み出される、混沌としたクリーチャーである。エレメンタルは最小限の知性しか持たず、通常は特定のタイプの魔法と関連している。\n\nこの火のエレメンタルは召喚されたばかりだが、それでもかなり危険だ！
actors.mobs.elemental$newbornfireelemental.desc_ally=このエレメンタルは呪文によって召喚されたため、炎を少しコントロールできる。範囲攻撃はできないが、近接攻撃した敵を発火させる。
actors.mobs.elemental$newbornfireelemental.desc_boss=このエレメンタルは召喚の性質が混沌としているため、1ターンの間チャージした後でなければ、不正確な爆風で炎を撒き散らすことはできない。
actors.mobs.elemental$newbornfireelemental.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.elemental$newbornfireelemental.name=稚火
actors.mobs.elemental$shockelemental.desc=エレメンタルは、強力なオカルト魔術が適切に制御されない場合にしばしば生み出される、混沌としたクリーチャーである。エレメンタルは最小限の知性しか持たず、通常は特定のタイプの魔法と関連している。\n\nショック・エレメンタルはあまり一般的ではないタイプのエレメンタルで、電気と閃光で敵を混乱させる。近接攻撃では近くの敵に電気を放ち、水中にいる場合は主目標にボーナス・ダメージを与える。また時折、範囲攻撃でターゲットに閃光を集中させ、一時的に目をくらませることもある。
actors.mobs.elemental$shockelemental.name=ショックエレメンタル
actors.mobs.eye.deathgaze_kill=デスゲイズに殺された...。
actors.mobs.eye.desc=この悪魔は「憎悪の球体」とも呼ばれる。敵を見ると見境なく死の眼光を放ち、味方を巻き込んで傷つけることも多い。
actors.mobs.eye.name=邪眼
actors.mobs.fetidrat.desc=このネズミは明らかにおかしい。脂ぎった黒い毛並みと腐りかけた皮膚は、これまで見てきた健康なネズミとはまったく違う。淡い緑色の目は特に威嚇しているように見える。\n\nこのネズミはおぞましい悪臭を漂わせている。\n\nネズミの口からは黒い液体が滴り落ち、床を食い破るが、水に溶けるようだ。
actors.mobs.fetidrat.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.fetidrat.name=どぶねずみ
actors.mobs.fungalcore.desc=この巨大なキノコは、この洞窟のすべての菌類活動の源に違いない。
actors.mobs.fungalcore.name=菌核
actors.mobs.fungalsentry.desc=この特に背の高いキノコは、この洞窟に住むより大きな菌類ネットワークの防御ポイントとして機能している。\n\nこのキノコは動かないが、視界内に入ったものに対して正確な毒の爆風を放つ。この毒の爆発の衝撃はかなり弱いが、すぐに致命的な量の毒を蓄積することができる。 殺すことはできるが、おそらく避けるのが最善だろう。
actors.mobs.fungalsentry.name=きんし
actors.mobs.fungalspinner.desc=このケーブ・スピナーは寄生菌に操られているようだ。菌類はその能力も変化させており、網や毒袋を菌類の増殖に置き換えている。\n\n菌類のスピナーは巣の代わりに植物を吐き、菌類の植物をまき散らし、あなたを根こそぎにする可能性がある。毒を与えることはできないが、キノコに隣接している場合、かなりのダメージ耐性を得る。
actors.mobs.fungalspinner.name=菌類スピナー
actors.mobs.ghoul.desc=ドワーフの社会が徐々に崩壊し始め、現在のドワーフの王が絶対的な権力を握ると、弱い者や彼に抵抗する者は良い扱いを受けなくなった。王が闇の魔法を使いこなすようになるにつれ、彼はこれらのドワーフを自分の意のままに操り、今では彼の軍隊の足軽を構成している。\n\nグールは単独では特に強くないが、常に集団で移動するため、大勢で殺すのはずっと難しい。グールは倒されても、他のグールが近くにいる限り、数ターン後に再び蘇る。
actors.mobs.ghoul.name=ドワーフグール
actors.mobs.gnoll.desc=グノールはハイエナに似たヒューマノイドである。下水道や地下牢に住み、時折地上に出て襲撃を行う。グノールの斥候は彼らの群れの正規のメンバーであり、ブルートほど強くはなく、シャーマンほど知的でもない。
actors.mobs.gnoll.name=ノールスカウト
actors.mobs.gnollexile.desc=この灰色の毛皮をまとったニョールの肩には、流刑者であることを示す大きな印がある。グノールは通常、命令を無視したり法律を破ったりしたために社会から追放される。流刑者は強く抜け目のない者でなければ生き残れないが、この者は持っている槍の使い方を心得ているようだ。
actors.mobs.gnollexile.desc_aggro=何かが結局戦う決心をさせたようだ。槍に気をつけろ
actors.mobs.gnollexile.desc_passive=ニョールの亡霊は攻撃しようと動いていない。 ここにいる他のニョールほど攻撃的ではないようで、おそらくあなたと戦う価値がないと思っているのだろう。このままやり過ごすこともできるが、リュックサックには便利なアイテムが入っているかもしれない...。
actors.mobs.gnollexile.name=グノールエグザイル
actors.mobs.gnollexile.seen_aggro=槍を振り回すニョールが攻撃に移る！
actors.mobs.gnollexile.seen_passive=槍を振り回すニョールは警戒してあなたを見ているが、攻撃しようとはしない。
actors.mobs.gnollgeomancer.alert=ジオマンサーが目覚めた！狂気の笑いを浮かべながら飛び去り、洞窟全体が変化したように見える！
actors.mobs.gnollgeomancer.desc=この堂々たる長身の上級ニョールは、この辺りの様々な土を動かす魔法の源であり、全てのニョールの活動のまとめ役に違いない。この辺りのニョールの土木工と違って、このジオマンサーは魔法の扱いに非常に長けており、石を投げられたり落石を受けたりしてもダメージを受けることはない。しかし、近接戦闘はできない。
actors.mobs.gnollgeomancer.desc_armor=ジオマンサーは岩の鎧に包まれている。ジオマンサーにダメージを与える前に、近づいてツルハシで壊す必要がある。
actors.mobs.gnollgeomancer.desc_armor_sapper=近くのニョール・サッパーがジオマンサーの岩の鎧に力を与える装置を持っている。今すぐにダメージを与えることはできないだろう。
actors.mobs.gnollgeomancer.desc_sleeping=この印象的な背の高いノールのシャーマンは、岩の層に囲まれていて、ほとんど彫像のように見える。よく見ると、先輩ニョールの呼吸に合わせて岩が魔法のように動いている。このように岩に囲まれている間は危害を加えられることはなく、文字通り土の昼寝を楽しんでいるように見える。\n\nおそらくツルハシで岩の層を突き破ることができるだろうが、その際には戦いの準備をしておくこと。 この辺りの大地を動かす様々な魔法の源はこのジオマンサーであり、ノールの全ての活動の主催者に違いない。戦う前にこの辺に散らばっているノールを倒すのはいい考えかもしれない。
actors.mobs.gnollgeomancer.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.gnollgeomancer.name=グノール・ジオマンサー
actors.mobs.gnollgeomancer.rock_kill=飛んできた玉石があなたを殺した...。
actors.mobs.gnollgeomancer.rockfall_kill=落石で死んだのか？
actors.mobs.gnollgeomancer.warning=ジオマンサーがかき混ぜ始める。続行する前に準備ができていることを確認してください！
actors.mobs.gnollguard.def_verb=ちっそく
actors.mobs.gnollguard.desc=槍と盾を持ち、兜は被っていない。これらの警備兵はおそらく訓練中の猛獣で、鉱山を侵入する野生動物から守るために雇われたのだろう。\n\n片手で槍を振り回せるほど強いが、あまりうまくは使えない。遠距離から攻撃するにはかなり広い場所が必要で、近づけばダメージはかなり少なくなる。
actors.mobs.gnollguard.desc_armor="近くのニョール・サッパーが、この警備兵に土の鎧を与え、受けるダメージを大幅に軽減する装置を持っている
actors.mobs.gnollguard.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.gnollguard.name=ノールガード
actors.mobs.gnollguard.spear_warn=ニョールは槍の先端で凶暴な一撃を放つ！
actors.mobs.gnollsapper.desc=青白い毛を持ち、様々な小道具が詰まったかばんを持った、小柄で弱いが知性のあるヌール。暗黒の金の採掘を手伝いに来たようで、近くに護衛がいる。戦闘能力はあるが、その攻撃力は哀れなほど弱く、ノールの斥候よりも強くない。\n\nサッパーは直接戦う代わりに、岩だらけの環境を攻撃してくれる様々な道具を使うことを好む。しかし彼ら自身は土を動かす魔法を知らないので、ガジェットを無謀に使う可能性がかなり高い。"彼らの攻撃やガードを利用する方法はたくさんあるはずだ
actors.mobs.gnollsapper.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.gnollsapper.name=グノール・サッパー
actors.mobs.gnolltrickster.desc=ニョールの基準からしても奇妙な姿をしている。邪悪な笑みを浮かべて前かがみになり、肩から下げたかばんをほとんど抱えている。その目は恐怖と興奮が入り混じった奇妙な表情をしている。\n\nかばんの中には粗悪なダーツがたくさん入っている。
actors.mobs.gnolltrickster.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.gnolltrickster.name=トリックスター
actors.mobs.goldenmimic.desc=ミミックはどんな姿にもなれる魔法生物である。ダンジョンでは、無防備な冒険者をおびき寄せるため、ほとんどの場合、宝箱の形を選ぶ。\n\nゴールデンミミックは、強い冒険者を引き付けようとする、より手強いミミックである。戦利品も良いが、通常のミミックよりもはるかに強い。
actors.mobs.goldenmimic.name=ゴールデンミミック
actors.mobs.golem.def_verb=ちっそく
actors.mobs.golem.desc=ドワーフは機械の知識と、新たに得た精霊を縛る力を組み合わせようとした。ゴーレムの機械の体には、最も従順だと考えられていた地の精霊を魂として宿らせた。それでも、儀式でわずかな間違いを犯すだけで暴走を招くことがあった。
actors.mobs.golem.name=ゴーレム
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=グルグル...グルグル...
actors.mobs.goo.desc=グゥについてはほとんど何もわかっていない。生き物ですらなく、下水の物質が寄り集まり、かすかな自我を持つようになったものかもしれない。
actors.mobs.goo.enraged=激昂
actors.mobs.goo.gluuurp=GLUUURP！
actors.mobs.goo.name=グゥ
actors.mobs.goo.notice=GLURP-GLURP！
actors.mobs.goo.pumpup=グーは自らを奮い立たせている！
actors.mobs.goo.rankings_desc=グーに吸収される
actors.mobs.greatcrab.def_verb=ちっそく
actors.mobs.greatcrab.desc=このカニは他の下水道ガニと比べても巨大だ。青い甲羅はひび割れやフジツボだらけで、かなり年季が入っている。巨大な爪でかろうじてバランスを保ちながら、ゆっくりとのたうち回る。\n\nカニの爪は1本しかないが、その大きさは簡単に補える。カニはその爪を脅威の前に突き出し、甲羅の壁に身を隠す。しかし、見えない攻撃や複数の敵からの攻撃は防ぐことができない。
actors.mobs.greatcrab.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.greatcrab.name=大蟹
actors.mobs.greatcrab.noticed=カニはその巨大な爪でブロックする。
actors.mobs.guard.def_verb=ちっそく
actors.mobs.guard.desc=かつては刑務所の番人であった看守たちも、受刑者たちと変わらなくなって久しい。彼らはゾンビのように歩き回り、無脳でホールを歩き回り、あなたのように場違いなものを探している！\n\n彼らは腰に鎖を下げているが、これは敵を至近距離まで引き寄せるためのものだろう。
actors.mobs.guard.name=牢番
actors.mobs.guard.scorpion=こっちへ来い！
actors.mobs.hermitcrab.def_verb=ちっそく
actors.mobs.hermitcrab.desc=何らかの理由で、この下水道ガニは壊れた樽の上部を頭にかぶることにした！重くなった分、通常のスピードは遅くなったが、防御力はかなり上がった。樽の中で何かが跳ねる音が聞こえるような気がするが...。
actors.mobs.hermitcrab.name=ヤドカリ
actors.mobs.mimic.desc=ミミックはどんな姿にもなれる魔法生物である。ダンジョンでは、無防備な冒険者をおびき寄せるため、ほとんどの場合、宝箱の形を選ぶ。
actors.mobs.mimic.discover_hint=この敵はダンジョンのどこにでもいる。
actors.mobs.mimic.hidden_hint=この胸は何か変な感じがする...。歩いて行って開けようとするのは悪い考えかもしれない。
actors.mobs.mimic.name=ミミック
actors.mobs.mimic.reveal=その胸はミミックだ！
actors.mobs.mob.died=遠くで何かが死ぬ音がする。
actors.mobs.mob.discover_hint=この敵はダンジョンの特定の場所にいる。
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=殺された%s
actors.mobs.monk$focus.desc=このモンクは完璧にターゲットを見定めており、相手の動きを先読みしているようだ。\n\n集中している間、このキャラクターに対して次に行われる物理攻撃は、どのような状況であろうとミスが保証される。この攻撃を受け流すとモンクの集中力が消費され、別の攻撃を受け流すには再び集中力を溜める必要がある。モンクは移動している間、より素早く集中力を蓄積する。
actors.mobs.monk$focus.name=集中
actors.mobs.monk.def_verb=ちっそく
actors.mobs.monk.desc=この僧侶たちは、街の秘密をあらゆるよそ者から守ることに身を捧げた狂信者だ。鎧も武器も使わず、素手の武術だけを頼りに戦う。
actors.mobs.monk.name=ドワーフの僧侶
actors.mobs.monk.parried=乾いた
actors.mobs.necromancer$necroskeleton.desc=このスケルトンは黒魔術師によって召喚された。通常のスケルトンと同じように振る舞い、召喚した黒魔術師が殺されると死ぬ。
actors.mobs.necromancer$necroskeleton.name=黒魔術師の骸骨
actors.mobs.necromancer.desc=見習い闇魔術師たちは、邪悪な技を練習するのに最適な場所として、この刑務所に集まってきた。\n\n黒魔術師はスケルトンを召喚し、彼らのために戦わせる。黒魔術師を殺すと、召喚したスケルトンも死ぬ。
actors.mobs.necromancer.name=妖術師
actors.mobs.npcs.blacksmith.cant_enter_old=そのエリアは今回の走行ではアクセスできない。新しいクエストに挑戦するには、新しいゲームをプレイしてください！
actors.mobs.npcs.blacksmith.def_verb=ちっそく
actors.mobs.npcs.blacksmith.desc=このトロールの鍛冶屋は、トロールが皆そうであるように、背が高くて痩せていて、肌の色も質感も石に似ている。トロールの鍛冶屋は不釣り合いなほど小さな道具をいじっている。
actors.mobs.npcs.blacksmith.enter_no=まだ
actors.mobs.npcs.blacksmith.enter_yes=準備はできている
actors.mobs.npcs.blacksmith.entrance_blocked=下る道は塞がれている。
actors.mobs.npcs.blacksmith.exit_no=まだ
actors.mobs.npcs.blacksmith.exit_warn_crystal=あの巨大なクリスタルもまだあそこにある。壊してくれたら追加料金を払うよ。
actors.mobs.npcs.blacksmith.exit_warn_full=終わったか？金貨はたくさん手に入れたが、道具は置き忘れないように。\n\n"覚えとけ、一度上がってきたら 中に戻らせないぞ
actors.mobs.npcs.blacksmith.exit_warn_fungi=あの巨大なキノコもまだあそこにある。殺してくれたら追加料金を払うよ。
actors.mobs.npcs.blacksmith.exit_warn_gnoll=ノールのジオマンサーもまだあそこにいる。殺してくれたら追加で払うよ。
actors.mobs.npcs.blacksmith.exit_warn_high=終わったか？金貨は十分あるようだが、もう少し欲しい。40枚は手に入るはずだ。\n\n覚えておけ、一度上がったら 戻さないからな
actors.mobs.npcs.blacksmith.exit_warn_low=もう終わったのか？金貨をたくさん持っているようには見えない。40枚は手に入るはずだ\n\n_覚えておけ、一度上がってきたら、 お前を戻さないぞ_
actors.mobs.npcs.blacksmith.exit_warn_med=終わったか？少なくとも金は手に入れただろうが、鉱山にはもっとあるはずだ。40枚は手に入るはずだ」。\n\n_覚えておけ、一度上がってきたら、 お前を戻さないぞ_
actors.mobs.npcs.blacksmith.exit_warn_none=もう終わったのか？金貨をほとんど持っていないじゃないか！40枚は手に入るはずだ。\n\n"覚えとけ、一旦上がったら 中に戻させないぞ
actors.mobs.npcs.blacksmith.exit_yes=私は終わった
actors.mobs.npcs.blacksmith.get_lost=忙しいんだ。失せなさい！
actors.mobs.npcs.blacksmith.intro_quest_cleric=やあ、人間！あなたは重要な人物のようだ。
actors.mobs.npcs.blacksmith.intro_quest_crystal=気をつけろ、この鉱山は君のような小さな人間には危険だ。しばらく放置されていて、結晶の束が成長し始めたんだ。光っているけど、壊れやすいから価値はない。彼らはかなり強いから、採掘する場所には気をつけてね。\n\n巨大なクリスタルもどこかにある。もっと頑丈だから、壊し始めたら戦いになる。壊すとクリスタルの成長が遅くなるから、もし壊せるなら追加料金を払うよ。
actors.mobs.npcs.blacksmith.intro_quest_duelist=やあ、人間！あなたは勇敢に見える。
actors.mobs.npcs.blacksmith.intro_quest_fungi=気をつけて、鉱山は君のような小さな人間には危険なんだ。あそこにはキノコのモンスターがいるんだ。キノコの番兵がいるから、見つかったら死ぬけど、少なくとも立ち上がって追いかけてくることはない。生きていたいなら、視界に入らないように。\n\n最大のマッシュルームを倒せたら、追加報酬を払う。壁に隠された菌糸のノードに繋がっている。本当にダメージを与えるには、そのほとんどを壊さなければならない。
actors.mobs.npcs.blacksmith.intro_quest_gnoll=気をつけろ、お前のような小さな人間には鉱山は危険だ。ニョロニョロどもも金を欲しがっていて、今、この場所を荒らしているんだ。あいつらはバカだから、採掘のせいでいろんな崩落や陥没を引き起こしているんだ。その中を採掘しなければならないから、最近乱れた岩を探してくれ」。\n\nニョールの一人がトラブルの大半を引き起こしているようだ。もし見つけて殺してくれたら、追加料金を払うよ。
actors.mobs.npcs.blacksmith.intro_quest_huntress=やあ、人間！素早そうだな。
actors.mobs.npcs.blacksmith.intro_quest_mage=やあ、人間！君は賢そうだね。
actors.mobs.npcs.blacksmith.intro_quest_rogue=やあ、人間！ずるそうなやつだな。
actors.mobs.npcs.blacksmith.intro_quest_start=役に立ちたいか？ああ、お前にもできることがある。古い鉱山の上に仕事場を建てたんだ。梯子を降りたところにある。ツルハシで金鉱石を採掘してくれ。40ピースで十分だ。下の岩はいい具合に柔らかいから、少し頑張れば壁を突き破って採掘できるだろう。\n\nどうやって払えばいいんだ？貪欲だな...\n\nわかった、わかったよ。この辺の鍛冶屋は俺だけだ。
actors.mobs.npcs.blacksmith.intro_quest_warrior=やあ、人間！君はタフそうだね。
actors.mobs.npcs.blacksmith.lost_pick=冗談だろ？俺のツルハシはどこだ？
actors.mobs.npcs.blacksmith.name=トロール鍛冶
actors.mobs.npcs.blacksmith.quest_start_prompt=準備はいいか？金塊のための空きスペースがあることを確認してください。\n\n"一度だけ降ろしてやる
actors.mobs.npcs.blacksmith.reminder=俺の時間を無駄にしたのか？鉱山の入り口はあそこだ。
actors.mobs.npcs.blacksmith.reminder_crystal=できるだけ多くの金塊を持ってきて、大きなクリスタルも割ってみてくれ。
actors.mobs.npcs.blacksmith.reminder_fungi=できるだけ多くの金を持って来て、巨大なキノコも倒してくれ。
actors.mobs.npcs.blacksmith.reminder_gnoll=できるだけ多くの金を持ってこい。ノールのジオマンサーも殺してみろ
actors.mobs.npcs.ghost.crab_1=こんにちは、%s。かつての私はあなたのように強く自信に満ちていた...でも古代生物に殺された...ここを離れることはできない...復讐を果たすまでは...私の命を奪った "大蟹 "を倒し...\n\n不自然に古い..."巨大な爪と厚い甲羅..."カニの爪に気をつけろ！" "カニを驚かせないと..." "カニにブロックされるぞ！
actors.mobs.npcs.ghost.crab_2=お願い...助けてくれ...甲殻類を倒せ...\n\n_それは常にブロックされます...あなたが来るのを見ると..._
actors.mobs.npcs.ghost.desc=幽霊はほとんど見えない。それは、悲しげな顔をした、かすかな光の形のない点のように見える。
actors.mobs.npcs.ghost.find_me=ありがとう...私を探しに来て...
actors.mobs.npcs.ghost.gnoll_1=こんにちは、%s。かつて私もあなたのようだった-強く、自信に満ちていた...でも狡猾な敵に殺された...ここを離れることはできない...復讐を果たすまでは...私の命を奪ったトリックスターを倒せ。\n\n他のグノールとは違う...隠れて武器を使う_毒と焼夷弾に注意し、遠くから攻撃しないように_
actors.mobs.npcs.ghost.gnoll_2=お願い...助けてくれ...トリックスターを倒して...\n\n"当たるな...近づくな..._
actors.mobs.npcs.ghost.name=悲しい幽霊
actors.mobs.npcs.ghost.rat_1=こんにちは、%s。かつて私もあなたのようだった-強くて自信に満ちていた...でも汚い獣に殺された...ここから出られない...復讐を果たすまでは..."私の命を奪ったネズミを殺せ\n\nこのフロアをうろつき汚物を撒き散らす_悪臭の雲と腐食性の噛みつきに注意、酸は水に溶ける..._
actors.mobs.npcs.ghost.rat_2=お願い...助けてくれ...忌まわしきものを倒して...\n\n_水辺で戦え...悪臭を避けろ..._
actors.mobs.npcs.imp.cya=また会おう、%s！
actors.mobs.npcs.imp.desc=インプは小悪魔である。その強さも魔法の才能も特筆すべきものではないが、非常に賢く社交的である。多くのインプは非魔族の中で暮らすことを好む。
actors.mobs.npcs.imp.golems_1=私の場合、殺すべきはゴーレムだ。ほら、私はここでちょっとした商売を始めようと思っているんだけど、あのバカなゴーレムは商売にならないんだ！彷徨う花崗岩の塊と交渉するのはとても大変なんだ！だから殺してくれ......仮に4匹としよう、そうすれば報酬は君のものだ。
actors.mobs.npcs.imp.golems_2=ゴーレムサファリは順調ですか？トークンをお忘れなく。
actors.mobs.npcs.imp.hey=Psst、%s！
actors.mobs.npcs.imp.intro=あなたは冒険家？冒険家は大好きだ！何か殺さなければならないとき、彼らはいつでも頼りになる。もちろん懸賞金目当てだけどね。）
actors.mobs.npcs.imp.monks_1=私の場合、殺す必要があるのは「怪物」だ。ほら、僕はここでちょっとした商売を始めようと思っているんだけど、あの狂人たちは自分では何も買わないし、他の客を怖がらせてしまう。だから殺してくれ...仮に5匹としよう。
actors.mobs.npcs.imp.monks_2=ああ、まだ生きていたんだね！君のカンフーはもっと強いと思っていたよ。）トークンを取るのを忘れないでね。
actors.mobs.npcs.imp.name=野心家
actors.mobs.npcs.impshopkeeper.buyback=小鬼は元気よくあなたの品物を返す。
actors.mobs.npcs.impshopkeeper.desc=小鬼は内廊下の境に小さな店を構えている。親切な顔を見るのは嬉しいが、彼の値段は確かに親切とは思えない。
actors.mobs.npcs.impshopkeeper.greetings=こんにちは、%sさん！
actors.mobs.npcs.impshopkeeper.greetings_ascent=%sは何をしたんだ？早く買い物して、ここから出なきゃ！
actors.mobs.npcs.impshopkeeper.name=野心家
actors.mobs.npcs.impshopkeeper.thief=私はあなたを信頼できると思った！
actors.mobs.npcs.mirrorimage.desc=この幻影はあなたによく似ているが、色が薄く、わずかに震えている。
actors.mobs.npcs.mirrorimage.discover_hint=このキャラクターは特定の巻物で見つけることができる。
actors.mobs.npcs.mirrorimage.name=鏡像
actors.mobs.npcs.npc.discover_hint=このキャラクターはダンジョンの特定の地域で見つけることができる。
actors.mobs.npcs.prismaticimage.desc=この揺らめく幻影はあなたによく似ており、あなたの現在の武器や防具を振り回しているようにさえ見える。\n\nプリズム・イメージは敵に狙いを定めて集中を引きつけ、強化された防御力とヘルスで君を守ろうとする。鏡像のような攻撃力はないが、耐久力が強化され、アーマーから恩恵を受けることもできる。\n\nHPが0になると、数ターンかけてプリズム・イメージは消滅するが、その間に回復することができる。敵がいない場合、プリズム・イメージは消え去り、マスターの元へ戻る。
actors.mobs.npcs.prismaticimage.discover_hint=このキャラクターは特定の巻物で見つけることができる。
actors.mobs.npcs.prismaticimage.name=プリズム像
actors.mobs.npcs.ratking.confused=な...ここはどこだ？王国が私を必要としている
actors.mobs.npcs.ratking.crown_after=新しいアーマーを楽しんでいますか？引き取り手はいない！
actors.mobs.npcs.ratking.crown_clothes=服を着ろ！王族と話せる状態じゃないだろ！
actors.mobs.npcs.ratking.crown_desc=あら、その王冠は私の？私のよりずっと輝いて見えるので、快くお受けします！\n\n実は、この王冠のご褒美として、あなたに何かを差し上げられると思うのです。君のような英雄にふさわしい、とてつもない力をね！いかがですか？
actors.mobs.npcs.ratking.crown_fine=いいさ！どうせ欲しいわけじゃないし...。
actors.mobs.npcs.ratking.crown_info=まずは詳しく教えてください。
actors.mobs.npcs.ratking.crown_no=むしろ...
actors.mobs.npcs.ratking.crown_thankyou=ありがとう！さあ、王様に自慢してきなさい
actors.mobs.npcs.ratking.crown_yes=もちろんだ！
actors.mobs.npcs.ratking.desc=このネズミは普通の有袋類より少し大きい。頭には小さな王冠をかぶっている。
actors.mobs.npcs.ratking.desc_birthday=このネズミは普通の有袋類より少し大きい。いつもの王冠の代わりに、小さな緑のパーティーハットをかぶっている。ネズミの王様、お誕生日おめでとう！
actors.mobs.npcs.ratking.desc_crown=このネズミは普通の有袋類より少し大きい。頭にはドワーフの王冠をかぶっている。
actors.mobs.npcs.ratking.desc_winter=このネズミは普通の有袋類より少し大きい。いつもの王冠の代わりに小さなお祭りの帽子をかぶっている。ハッピーホリデー！
actors.mobs.npcs.ratking.discover_hint=このキャラクターは、ダンジョンの特定の地域の最後にいる。
actors.mobs.npcs.ratking.name=ネズミの王様
actors.mobs.npcs.ratking.not_sleeping=眠れないんだ！
actors.mobs.npcs.ratking.what_is_it=どうしたんだ？くだらんことに付き合っている暇はない。私の王国は自分では統治できない！
actors.mobs.npcs.sheep.baa!=バア！
actors.mobs.npcs.sheep.baa.=バア。
actors.mobs.npcs.sheep.baa...=バ...
actors.mobs.npcs.sheep.baa?=バ？
actors.mobs.npcs.sheep.def_verb=ちっそく
actors.mobs.npcs.sheep.desc=これは魔法の羊だ。何がそんなに不思議なんだ？殺すことはできない。魔法のように消え去るまでそこに立ち尽くし、その間、無表情で牛の蹄を噛んでいる。
actors.mobs.npcs.sheep.discover_hint=このキャラクターは特定のアイテムや罠で見つけることができる。
actors.mobs.npcs.sheep.name=シープ
actors.mobs.npcs.shopkeeper.buyback=店員はしぶしぶ商品を返す。
actors.mobs.npcs.shopkeeper.desc=このがっしりした男は、ダンジョンというより、どこかの大都市の貿易街に似合いそうだ。なぜ彼がここで商売をしたがるのか、その理由は彼の値段にある。
actors.mobs.npcs.shopkeeper.flee=店主は逃げる！
actors.mobs.npcs.shopkeeper.name=店主
actors.mobs.npcs.shopkeeper.sell=商品を売る
actors.mobs.npcs.shopkeeper.talk=トーク
actors.mobs.npcs.shopkeeper.talk_ascent=そのお守りをどうするつもりか知らないが、私は関わりたくない。何か買って先に進みましょう、私たち二人ともこの場所を離れる必要がある！
actors.mobs.npcs.shopkeeper.talk_caves=お金を使えば長生きできる。\n\nそれと、あのトロールの鍛冶屋に会ったらよろしくな。先週あいつに売ったハンマーの代金の借りがまだあることを思い出させてやれ！
actors.mobs.npcs.shopkeeper.talk_city=私の製品があれば、ここでも安全だ。\n\n...頼むからうろつかないでくれ。地元の人たちに放っておいてもらうのに、ずいぶん時間がかかった！
actors.mobs.npcs.shopkeeper.talk_halls=やあ、デーモンハンターのために特別価格を用意したんだ！\n\n下には気をつけろ！下界の魔物たちは、君がどれだけ勇気があっても気にしない。死んだら戻って来れないし、お金も使えないよ！)\n\n魔物も僕と同じ？そんなことないよ。俺はただの小柄な奴で、たいした戦いもできないし、なんとか心も保っている。下にいる魔物たちはもっと強いもので、みんな奴隷にされてるんだ......まあ......下は気をつけてね。
actors.mobs.npcs.shopkeeper.talk_prison_cleric=こんにちは、殿下、それとも今は聖職者ですか？いずれにせよ、ここは君の居場所ではない。もし君が死んでしまったら、多くの人が取り乱すだろう。でも、小銭は持っているはずだから、それを防ぐために何か買ったらどうだい？
actors.mobs.npcs.shopkeeper.talk_prison_duelist=旅のヒーローでなければね！他の町を救おうとしているのなら、幸運を祈るよ。ここの危険は、チンケな盗賊団よりずっとひどいんだ。他の誰よりもうまくやれると思うよ。ただ、僕の店の前で死なないようにね。
actors.mobs.npcs.shopkeeper.talk_prison_huntress=あなたは本領を発揮できていないようですね。狭いダンジョンの廊下は、大広間や街を囲む森ほど広くはないでしょう？えへへ、私のたわ言は気にしないでください。
actors.mobs.npcs.shopkeeper.talk_prison_intro=冒険を成功させるために必要なものはすべて揃っている！
actors.mobs.npcs.shopkeeper.talk_prison_mage=へへ、街のどこかで君の名前が書かれた指名手配のポスターを見たような気がするんだ。逃亡中かな？ああ、君は無実なんだね？もちろん、もちろん...。でも、念のために何か買った方がいいんじゃない？
actors.mobs.npcs.shopkeeper.talk_prison_rogue=盗賊ギルドから一掃しに来たのか？いや、買い物か？まあ、ここにいる間にモンスターを何匹か殺しておけ。安売りなんて期待するなよ、俺はお前らに高い保護費を払っているんだ。
actors.mobs.npcs.shopkeeper.talk_prison_warrior=面白い印鑑だね。不名誉な英雄か何かか？あんたが何をしようと、私には関係ない。
actors.mobs.npcs.shopkeeper.thief=泥棒、泥棒！
actors.mobs.npcs.shopkeeper.warn=見てください！もう警告はしない。
actors.mobs.npcs.vaultlaser.desc=この見張りは一定間隔でレーザーを発射している。ここはただのテスターエリアなので、レーザーが実際にあなたを傷つけることはありません」。
actors.mobs.npcs.vaultlaser.name=ボールト・レーザー・セントリー
actors.mobs.npcs.vaultsentry.desc=この歩哨はパターンでエリアをスキャンしている。ここはただのテスターエリアなので、セントリーたちはあなたを検知しても何もしません」。
actors.mobs.npcs.vaultsentry.name=ボールト・スキャン・セントリー
actors.mobs.npcs.wandmaker.def_verb=ちっそく
actors.mobs.npcs.wandmaker.desc=この年老いた、しかし矍鑠とした紳士は、少し困惑した表情を浮かべている。彼は魔法の盾で守られている。
actors.mobs.npcs.wandmaker.intro_1=珍しい杖の材料を探しに来たんだけど、道に迷ってしまって、魔法の盾が弱くなってしまった。すぐに出発しなければならないが、来た目的を果たさないまま帰るのは忍びない。
actors.mobs.npcs.wandmaker.intro_2=もしそれが手に入るなら、私の精巧に作られた杖で喜んで支払うよ！2本持ってきたから、好きな方を持っていっていいよ。
actors.mobs.npcs.wandmaker.intro_berry=この刑務所の昔の所長がロットベリーの苗を飼っていて、その種が欲しいんだ。もう野生化しているだろうから、種を譲ってもらうのは難しいかもしれない。その庭はこの辺にあるはずだ。無傷でいたいなら、つる性のレーザーには近づかないこと。火を使うのは魅力的かもしれないが、絶対にやめてほしい。
actors.mobs.npcs.wandmaker.intro_cleric=ああ、こんにちは殿下！こんな憂鬱な場所でお目にかかれるとは！無理を言って申し訳ないのですが、あなたにお願いがあります。
actors.mobs.npcs.wandmaker.intro_duelist=やあ、お嬢さん！こんな憂鬱な場所でヒーローに会えるなんて、なんと嬉しい驚きだろう！もしあなたが老人を助ける気があるのなら、私はあなたに仕事があるかもしれない。
actors.mobs.npcs.wandmaker.intro_dust=屍肉ダストを探してるんだ。呪われた特殊な骨粉で、こういう場所によく現れるんだ。この辺りのどこかにバリケードがあるはずだ。でも気をつけてね、その粉塵が運ぶ呪いはかなり強力だから、できるだけ早く私のところに戻ってきてね。
actors.mobs.npcs.wandmaker.intro_ember=生まれたばかりのファイア・エレメンタルの燃えさしを探しているんだ。エレメンタルは通常、召喚儀式がコントロールされていない時に現れるから、ロウソクと儀式の場所を見つければ、きっと現れると思うよ。しかし、エレメンタルと戦っている間は自分の中に閉じこもらないようにするか、凍らせるアイテムを持っておくといい。
actors.mobs.npcs.wandmaker.intro_huntress=やあ、お嬢さん！友好的な顔は、ここでは嬉しい驚きですね？実は、前にあなたの顔を見たことがあるんです。気にしないで、もし冒険をしに来たのなら、君に仕事をあげよう。
actors.mobs.npcs.wandmaker.intro_mage=ああ、こんにちは%s！あなたとウィザーズ・インスティテュートに関して、何か騒動があったと聞きましたが？ああ、気にするな、どうせ俺はあの粘着質な連中が嫌いなんだ。もしよろしければ、あなたにお仕事があるのですが。
actors.mobs.npcs.wandmaker.intro_rogue=ああ、驚いた！まだ正気を保っているこの場所の盗賊には会ったことがない！もし見知らぬ人を助ける気があるなら、君に仕事をあげよう。
actors.mobs.npcs.wandmaker.intro_warrior=ああ、こんにちは！こんな憂鬱な場所で北の戦士に会えるなんて、なんと嬉しい驚きだろう！ずいぶん遠くから来られたのですね。冒険をお望みなら、私にお任せを。
actors.mobs.npcs.wandmaker.name=老いた杖職人
actors.mobs.npcs.wandmaker.reminder_berry=%sさん、ロットベリーの種はどうですか？植物でいっぱいの部屋を探してください。
actors.mobs.npcs.wandmaker.reminder_dust=%s、死体の粉はどうだ？バリケードを探せ
actors.mobs.npcs.wandmaker.reminder_ember=%s、その燃えかすはどうなった？4本のロウソクと儀式の場所を見つける必要がある。
actors.mobs.phantompiranha.desc=ファントムピラニアは、魔法のような能力を持ち、不気味な半透明の体を持つ珍しい種類のピラニアだ。襲われているときにテレポートし、逃げたり、素早く敵に近づいたりすることができる！\n\n戦うのは厄介だが、その肉は魔法の効果があるとして珍重されている。
actors.mobs.phantompiranha.name=ファントムピラニア
actors.mobs.phantompiranha.teleport_away=幻のピラニアがテレポートしていく...。
actors.mobs.piranha.desc=この肉食魚は、水害地域を守るために特別に飼育されている。噛まれると死に至るので、直接対峙するのは避けた方がいい。
actors.mobs.piranha.discover_hint=この敵はダンジョンのどこにでもいる。
actors.mobs.piranha.name=ジャイアントピラニア
actors.mobs.pylon.desc_active=パワーパイロンは、このエリアの機械に供給される電力を調整するためのものだ。パイロンは現在、電気エネルギーで急上昇しており、これがDM-300を過充電しているのだろう！\n\nこの状態のパイロンは脆弱だが、時計回りのパターンで近くのセルに電気を流す。重い金属でできているため、パイロンは大きなダメージに強い。
actors.mobs.pylon.desc_inactive=送電鉄塔は、この地域の機械の動力源となる電力を調整するためのものだ。\n\nパイロンは現在稼働しておらず、ダメージを受けることはない。
actors.mobs.pylon.name=パワーパイロン
actors.mobs.rat.desc=有袋類のネズミは攻撃的だが、どちらかというと弱い下水道の住人だ。厄介な噛みつき方をするが、生命を脅かすのは数が多いときだけだ。
actors.mobs.rat.name=有袋類ネズミ
actors.mobs.ripperdemon.desc=この恐ろしいクリーチャーは、この地域に多数存在するドワーフの死体が、悪魔的な力によって利用された結果である。リッパーはドワーフに似たやせ細ったグール的なクリーチャーだが、壊れた体と骨でできた長く鋭い爪を持っている。\n\nリッパーの悪魔は特に耐久力があるわけではないが、機敏で危険である。彼らは遠くまで跳躍して素早く標的に到達し、鉤爪で食いちぎることができる。
actors.mobs.ripperdemon.leap=リッパーの悪魔が跳躍の準備をする！
actors.mobs.ripperdemon.name=リッパーデーモン
actors.mobs.rotheart.desc=ロットベリーの果実はとてもユニークだ。ロットベリーの果実は腐敗して栄養を供給する代わりに、成長し、硬くなり、種子を包む。これは果実の中で成長する内臓を保護する役割を果たす。この巨大な球体は、ロットベリーの成木の心臓と呼ばれている。
actors.mobs.rotheart.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.rotheart.name=腐った心
actors.mobs.rotlasher.desc=ロットラッシャーは、成熟したロットベリーの根の構造の一部であり、彼らの主要な防御手段でもある。ラッシャーは目が見えず、地面に突き刺さっているが、近くの脅威を一瞬で察知した後、激しく襲いかかる。近くに敵がいないときは、周囲の草木に溶け込もうとして動かずに立っている。
actors.mobs.rotlasher.discover_hint=この敵は特定のクエストで見つけることができる。
actors.mobs.rotlasher.name=ロットラッシャー
actors.mobs.scorpio.desc=この巨大なクモの巣のような悪魔のようなクリーチャーは接近戦を避け、遠距離から鋸歯状のトゲを放つことを好む。
actors.mobs.scorpio.name=サソリ
actors.mobs.senior.desc=この僧侶たちは、街の秘密をあらゆるよそ者から守ることに身を捧げた狂信者だ。鎧も武器も使わず、素手の武術だけを頼りに戦う。
actors.mobs.senior.name=高僧
actors.mobs.shaman$blueshaman.spell_desc=このシャーマンは青い仮面をつけており、一時的に受けるダメージを増加させる魔法を使う_。
actors.mobs.shaman$purpleshaman.spell_desc=このシャーマンは紫の仮面をつけており、一時的に命中率と回避率を低下させる魔法を使う。
actors.mobs.shaman$redshaman.spell_desc=このシャーマンは赤い仮面をつけており、一時的に攻撃力を弱める魔法を使う_。
actors.mobs.shaman.bolt_kill=魔法の稲妻があなたを殺した...。
actors.mobs.shaman.desc=特に賢いノールはシャーマンの魔術を習得できる。ノールのシャーマンは力の不足を補うために戦闘呪文を好み、部族内での地位に異を唱える者にもためらわず使う。
actors.mobs.shaman.name=ノールシャーマン
actors.mobs.skeleton.def_verb=ちっそく
actors.mobs.skeleton.desc=骸骨は、不運な冒険者やダンジョンの住人の骨が、深部から漏れる邪悪な魔力で動き出したものだ。十分な傷を受けると、骨を周囲に撒き散らして崩れ去る。
actors.mobs.skeleton.explo_kill=あなたは骨の爆発で死んだ...。
actors.mobs.skeleton.name=スケルトン
actors.mobs.slime.def_verb=ちっそく
actors.mobs.slime.desc=スライムは、ゴムのような外皮と液体の核を持つ、奇妙で少し不思議な生き物だ。都市の下水道は彼らに豊富な水と栄養分を供給する。\n\n伸縮性のある外膜を持つため、1回の攻撃でスライムに_6以上のダメージを与えることは難しい。
actors.mobs.slime.name=スライム
actors.mobs.snake.desc=この巨大な蛇は打撃の周囲を素早くすり抜けることができるため、攻撃を当てるのはかなり難しい。しかし、魔法攻撃や奇襲攻撃は不意をつくことができる。\n\n蛇の視界から外れている間に攻撃することで、奇襲をかけることができる。一つの方法は、蛇にドアの隙間から追いかけさせ、蛇がドアの中に入った直後に攻撃することである。
actors.mobs.snake.hint=ヘビに対抗する方法を学ぶために、ヘビの「調べる」ボタンを使ってみよう。
actors.mobs.snake.name=下水蛇
actors.mobs.spectralnecromancer.desc=スケルトンはネクロマンサーの糧であるが、より肉体を持たない他のミニオンに目を向けることを好む者もいる。スペクタル・ネクロマンサーはレイスをミニオンとして選んでいる！\n\n個々のレイスはスケルトンほど強くないが、ネクロマンサーたちはレイスを大量に召喚することを恐れない！
actors.mobs.spectralnecromancer.name=スペクトルネクロマンサー
actors.mobs.spinner.desc=この緑がかった毛むくじゃらの洞窟蜘蛛は、直接戦うことを避ける。吐き出した糸に獲物を絡め取り、毒の牙で噛まれた相手がゆっくり死ぬのを離れた場所から待つ。
actors.mobs.spinner.name=洞窟蜘蛛
actors.mobs.statue.def_verb=ちっそく
actors.mobs.statue.desc=このダンジョンにある無生物の彫像のひとつに過ぎないと思うだろうが、赤く光る目がそれを物語っている。
actors.mobs.statue.desc_weapon=像自体は石でできているが、その像が振り回している_%s_は本物に見える。
actors.mobs.statue.discover_hint=この敵はダンジョンのどこにでもいる。
actors.mobs.statue.name=アニメ像
actors.mobs.succubus.desc=サキュバスは、少しゴシック趣味のある魅惑的な少女の姿をした悪魔だ。魔術で英雄を魅了し、効果が切れるまで何も攻撃できなくしてしまう。
actors.mobs.succubus.name=サキュバス
actors.mobs.swarm.desc=致命的なハエの大群が怒り狂ったようにうなる。魔法以外の攻撃はすべて、より小さいが同様に危険な2つの群れに分裂させる。
actors.mobs.swarm.name=はえのむれ
actors.mobs.tengu$bombability$bombblob.desc=過熱した煙が立ち込めている。気をつけろ、爆発するぞ！
actors.mobs.tengu$bombability$bombitem.cant_pickup=地面に張り付いていて動かせない！
actors.mobs.tengu$bombability$bombitem.desc=天狗はここに奇妙な形の発煙筒を投げ込んだ。まるで爆発までのカウントダウンをするかのように、カチカチと大きな音を立てている！\n\n爆弾は地面に固定されているので、拾うことはできない。
actors.mobs.tengu$bombability$bombitem.name=発煙筒
actors.mobs.tengu$fireability$fireblob.desc=天狗は細かい粉を投げ、それが今にも燃え上がりそうな勢いだ！
actors.mobs.tengu$shockerability$shockerblob.desc=ここには電気エネルギーが溜まっており、このタイルの上に立っているものは次のターンにショックを受ける！
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=電気を出しすぎて、つかめないんだ！
actors.mobs.tengu$shockerability$shockeritem.desc=天狗はここにDM-100の部品で作られたような不思議な機械を投げた。その機械は絶えず周囲に電気を流しているが、予測可能なパターンで進んでいるようだ。\n\n電気がアーク状になっているので、これを拾うことはできない。
actors.mobs.tengu$shockerability$shockeritem.name=ショッカー
actors.mobs.tengu.defeated=ついに自由になった
actors.mobs.tengu.desc=天狗は、同じく天狗と呼ばれる古い暗殺者一族の一員だ。手裏剣と罠を多用することで知られている。
actors.mobs.tengu.interesting=面白くしよう
actors.mobs.tengu.name=天狗
actors.mobs.tengu.notice_gotcha=了解、%s！
actors.mobs.tengu.notice_have=%sを手に入れた！
actors.mobs.tengu.rankings_desc=天狗に暗殺される
actors.mobs.thief.carries=泥棒が持っているのは_%s._ 明らかに盗まれたもの。
actors.mobs.thief.desc=受刑者たちは独房を出て自由に歩き回っているが、この場所が彼らの牢獄であることに変わりはない。時が経つにつれ、この場所は彼らの自由と心を奪っていった。とっくの昔に、この狂った泥棒や盗賊たちは、自分たちが何者で、なぜ盗みを働くのかを忘れてしまった。\n\nこれらの敵は戦うことよりも、盗んで逃げることの方が多い。彼らの視界から目を離さないように注意しよう。さもないと、盗まれたアイテムに二度と出会えなくなるかもしれない。
actors.mobs.thief.escapes=泥棒はあなたの%sを持ち去った！
actors.mobs.thief.name=きちがい泥棒
actors.mobs.thief.stole=泥棒はあなたから%sを盗んだ！
actors.mobs.tormentedspirit.desc=呪われた霊魂とは、呪いに冒された善良な霊魂のことである。呪われている間は亡霊と同じように攻撃し、より強力である！\n\n霊の隣で適切なアイテムを使うことで、呪いを解くことができるかもしれない。呪いが解ければ、霊はきっと感謝するだろう......。
actors.mobs.tormentedspirit.name=怨霊
actors.mobs.tormentedspirit.thank_you=ありがとう
actors.mobs.vaultrat.desc=このネズミは、新しいボールトの敵AIをテストするために、いくつかの行動を変更している：\nその動きは壁越しに「聞こえる」。\nあらかじめ設定されたパトロールに沿って歩き回ります。\n彷徨っている間、進行方向後方の検知範囲が激減します。\n寝ている間は探知範囲も狭くなる\nあなたを発見すると、狩りに移行する前に「調査」を行う。調査中の敵はこちらに向かって移動するが、攻撃はしてこないため、ドアや角に隠れて見失いやすくなる。
actors.mobs.warlock.bolt_kill=シャドーボルトに殺された...。
actors.mobs.warlock.desc=ドワーフの関心が工学から秘術へ移ると、黒魔術師たちが街の権力を握った。最初は元素の魔法を研究していたが、やがて悪魔学と死霊術に手を染めた。
actors.mobs.warlock.name=ドワーフの黒魔術師
actors.mobs.wraith.desc=亡霊とは、墓や墓を荒らされた罪人の復讐心に燃えた霊のことである。幽体であるため、通常の武器で攻撃するのは非常に難しい。
actors.mobs.wraith.discover_hint=この敵はダンジョンのどこにでもいる。
actors.mobs.wraith.name=亡霊
actors.mobs.yogdzewa$larva.desc=Yog-Dzewaの小さなスポーンは単純なミニオンであり、生産は容易である。1体1体は弱いが、召喚が早く、数が多いと圧倒される。
actors.mobs.yogdzewa$larva.name=神の子
actors.mobs.yogdzewa$larva.rankings_desc=ヨグ＝デゼワに食われる
actors.mobs.yogdzewa$yogeye.rankings_desc=ヨグ＝デゼワに食われる
actors.mobs.yogdzewa$yogripper.rankings_desc=ヨグ＝デゼワに食われる
actors.mobs.yogdzewa$yogscorpio.rankings_desc=ヨグ＝デゼワに食われる
actors.mobs.yogdzewa.darkness=闇が近づいてくる...。
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=ヨグ＝デゼヴァは古の神であり、人間の世界にまで手を伸ばし、無限の成長を促すためにそれらを貪り食う巨大な怪物である。ドワーフたちは、闇の魔法を弄んでいるうちにこの宇宙の恐怖の目を引きつけ、それ以来、それを封じ込めようとしてきたに違いない。\n\nヨグ＝デゼヴァは未加工の魔法のカオスの次元に由来し、この世界に真の姿をもたらすことはできない。その代わり、アバターを作り、悪魔の手先を召喚して、この世界でその命令を下している。\n\nこの巨大な眼は、この世界におけるヨグ＝デゼヴァの力の中心である。眼そのものは動かないが、強力な魔力のビームを放ち、さまざまな手下を召喚することができる。
actors.mobs.yogdzewa.desc_spawners=上の階から、悪魔のエネルギーが放射状に目に飛び込んでくるのを感じる。ヨグ＝デッヴァに力を戻しているに違いない。ヨグはこのエネルギーでより強力な手下を召喚する！
actors.mobs.yogdzewa.hope=あなたの。希望だそれは幻想だ幻想だ
actors.mobs.yogdzewa.name=ヨグ＝ドージェワ
actors.mobs.yogdzewa.notice=I.見る。君だ。
actors.mobs.yogdzewa.rankings_desc=ヨグ＝デゼワに食われる
actors.mobs.yogfist$brightfist.desc=この拳は純粋な光エネルギーで形成されている。強力な光線を毎ターン放つことができる！この光線は大ダメージを与えるだけでなく、一時的に目をくらませる。また、この拳はアリーナを一時的にまばゆい光に包んで逃げることもできる！\n\nただし、拳には近接攻撃で使える特殊能力はない。
actors.mobs.yogfist$brightfist.name=烈拳
actors.mobs.yogfist$brightfist.teleport=拳はテレポートし、光を放つ！
actors.mobs.yogfist$burningfist.desc=炎に包まれた巨大な拳。指を握り込むたびにぱちぱちと音が鳴り、床に火の粉が落ちる。
actors.mobs.yogfist$burningfist.name=焼拳
actors.mobs.yogfist$darkfist.desc=この拳は純粋な闇のエネルギーで形成されている。毎ターン強力な暗黒魔法の爆風を放つことができる！この爆風は大ダメージを与えるだけでなく、光源を弱体化させる。また、この拳はアリーナを一時的に暗闇に包んで逃げることができる！\n\nただし、この拳には近接攻撃で使える特殊能力はない。
actors.mobs.yogfist$darkfist.name=暗拳
actors.mobs.yogfist$darkfist.teleport=拳は、あなたの光源を消し去る暗闇の爆風でテレポートする！
actors.mobs.yogfist$rottingfist.desc=腐った肉の巨大な拳。指の隙間から悪臭を放つ粘液が染み出し、足元の石を汚している。
actors.mobs.yogfist$rottingfist.name=腐拳
actors.mobs.yogfist$rustedfist.desc=この拳は生きた金属で形成されている。その巨大な金属の塊は強力な近接攻撃を持ち、遠距離攻撃では標的を麻痺させることができる。その巨大な質量のため、この拳は与えられたダメージを即座に受けるのではなく、時間をかけて受ける。\n\nしかし拳は柔軟性に欠け、狭い通路には入れない。さらに、ゆっくりとダメージを受けるとはいえ、何度も殴られると繰り延べられたダメージは増え続ける。
actors.mobs.yogfist$rustedfist.name=錆拳
actors.mobs.yogfist$soiledfist.desc=この拳は混沌とした土の魔法で形成されている。動くたびに周囲に草木を生やし続ける。また、急速に伸びる蔓や根で標的を巻き込む土の爆風を集中的に放つこともできる！\n\n拳はこの植物の生命からパワーを得ており、近くにある背の高い植物や溝のある植物の量に応じてダメージに抵抗する！
actors.mobs.yogfist$soiledfist.name=汚れた拳
actors.mobs.yogfist.desc=この拳はヨグ＝デゼヴァの力の一面である。拳はヨグ＝デゼヴァの力とリンクしており、目に近づけるとあらゆるダメージから守られる。
actors.mobs.yogfist.invuln_warn=拳は目に近い間は無敵である！
actors.mobs.yogfist.rankings_desc=ヨグ＝デゼワに食われる
