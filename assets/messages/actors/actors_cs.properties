actors.mobs.mob.fleeing=%s prchá
actors.mobs.mob.hunting=%s loví
actors.mobs.mob.passive=%s je pasivní
actors.mobs.mob.sleeping=%s spí
actors.mobs.mob.wandering=%s se toulá
actors.mobs.elemental.desc=Potulní ohniví elementálové vznikají jako vedlejší produkt vyvolávání mocnějších bytostí. Jsou tak nevyzpytatelní, že je nedokáže ovládnout ani ten nejmocnější démonolog.
actors.mobs.elemental.name=ohnivý elementál
actors.mobs.king.desc=Poslední král trpaslíků proslul hlubokými znalostmi života a smrti. Přesvědčil členy svého dvora, aby se zúčastnili rituálu, který jim měl dát věčné mládí. Nakonec ho získal jen on — a k tomu armádu nemrtvých.
actors.mobs.king.name=Král trpaslíků
actors.mobs.npcs.bee.desc=Zlaté včely navzdory své malé velikosti zuřivě brání svého pána. Dlouhého života se ale nedožívají.
actors.mobs.npcs.bee.name=zlatá včela
actors.mobs.shielded.desc=Hromotluci jsou největší, nejsilnější a nejodolnější ze všech gnollů. Když jsou těžce zraněni, propadnou zuřivosti a způsobují nepřátelům ještě větší zranění.
actors.mobs.shielded.name=hromotluk se štítem
actors.mobs.yog.desc=Yog-Dzewa je Starý bůh, mocná entita z říše chaosu. Před stoletím starověcí trpaslíci jen stěží vyhráli válku proti jeho armádě démonů, ale samotného boha nedokázali zabít. Místo toho ho uvěznili v síních pod svým městem v domnění, že je příliš slabý na to, aby se někdy znovu vzchopil.
actors.mobs.yog.name=Jóg-Dzewa
actors.mobs.bandit.carries=%s u sebe nese _%s_. Je zřejmé, že byl ukradený.
actors.buffs.armorevasion.name=Lepší vyhýbání
actors.mobs.king.defeated=Nemůžeš mě zabít, %s... Jsem ... nesmrtelný ...
