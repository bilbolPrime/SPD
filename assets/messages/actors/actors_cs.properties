actors.blobs.blizzard.desc=Víří tu vánice.
actors.blobs.blizzard.name=blizard
actors.blobs.confusiongas.desc=Víří se tu oblak zmatených plynů.
actors.blobs.confusiongas.name=zmatený plyn
actors.blobs.corrosivegas.desc=Víří zde oblak smrtelně žíravého plynu.
actors.blobs.corrosivegas.name=korozivní plyn
actors.blobs.electricity.desc=Zde jasně jiskří elektrické pole.
actors.blobs.electricity.name=elektřina
actors.blobs.electricity.ondeath=Byl jsi šokován k smrti...
actors.blobs.electricity.rankings_desc=Zasažen elektrickým proudem
actors.blobs.fire.desc=Zuří zde požár.
actors.blobs.fire.name=oheň
actors.blobs.foliage.desc=Paprsky světla prorážejí šero podzemní zahrady.
actors.blobs.foliage.name=listy
actors.blobs.freezing.desc=Vzduch je tu nepřirozeně mrazivý.
actors.blobs.freezing.name=mrazivý vzduch
actors.blobs.goowarn.desc=Rojí se tu tečky temné energie!
actors.blobs.goowarn.name=temná energie
actors.blobs.inferno.desc=Zuří tu peklo.
actors.blobs.inferno.name=peklo
actors.blobs.paralyticgas.desc=Víří zde oblak paralytického plynu.
actors.blobs.paralyticgas.name=paralytický plyn
actors.blobs.regrowth.name=opětovný růst
actors.blobs.sacrificialfire.desc=Je zde oltář, na kterém hoří obětní oheň. Každý tvor, který zde bude zabit, bude pohlcen jako oběť duchům jeskyně.\n\nMožná bude udělena odměna, pokud bude provedeno dostatek obětí?
actors.blobs.sacrificialfire.name=obětní oheň
actors.blobs.sacrificialfire.reward=Oheň vzplane a pak se rozptýlí a zanechá po sobě odměnu!
actors.blobs.sacrificialfire.unworthy=Oheň pohltí tvou oběť, ale nemění se.
actors.blobs.sacrificialfire.worthy=Oheň pohltí tvou oběť a zesílí.
actors.blobs.smokescreen.desc=Víří se tu oblak hustého černého kouře.
actors.blobs.smokescreen.name=kouřová clona
actors.blobs.stenchgas.desc=Víří se tu oblak hnusného zápachu.
actors.blobs.stenchgas.name=zápachový plyn
actors.blobs.stormcloud.desc=Víří se zde oblak vířící vodní páry.
actors.blobs.stormcloud.name=bouřkové mraky
actors.blobs.toxicgas.desc=Víří zde nazelenalý oblak toxického plynu.
actors.blobs.toxicgas.name=toxický plyn
actors.blobs.toxicgas.ondeath=Zemřel jsi na toxický plyn...
actors.blobs.toxicgas.rankings_desc=Udušený
actors.blobs.waterofawareness.desc=Z vody této studny vyzařuje síla poznání. Pitím ze studny plně identifikujete všechny předměty, které máte ve svém inventáři, kletby na nich a odhalíte všechny předměty na aktuálním patře.
actors.blobs.waterofawareness.name=voda vědomí
actors.blobs.waterofawareness.procced=Jakmile se napijete, cítíte, jak se vám do mysli vlévají znalosti.
actors.blobs.waterofhealth.desc=Z vody této studny vyzařuje síla zdraví. Pití z ní zahojí vaše rány, ukojí hlad a očistí kletby z veškerých opotřebovaných předmětů.
actors.blobs.waterofhealth.name=voda zdraví
actors.blobs.waterofhealth.procced=Jakmile se napijete, cítíte, jak se vaše rány úplně hojí.
actors.blobs.web.desc=Všechno je zde pokryté silnou pavučinou. Cokoli se pavučiny dotkne nebo je skrz ni hozeno, sice ji sice roztrhne, ale zároveň zůstane na místě.
actors.blobs.web.name=pavučina
actors.buffs.adrenaline.desc=Nával fyzické síly, adrenalin zvýšil rychlost útoku i pohybu. \n\nADrenalin umožňuje svému cíli běžet 2x rychleji a útočit 1,5x rychleji. \n\nZbývající tahy: %s.
actors.buffs.adrenaline.name=adrenalin
actors.buffs.adrenalinesurge.desc=Vlna velké síly, ale bohužel ne trvalá.\n\nZvýšení síly: +%d.\nTahá se, dokud zvýšení síly nezeslábne: %s.
actors.buffs.adrenalinesurge.name=zvýšení síly
actors.buffs.amok.desc=Amok způsobuje u svého cíle stav velkého vzteku a zmatku.\n\nKdyž je tvor kouřen, zaútočí na cokoli, co je v jeho blízkosti, ať už je to přítel nebo nepřítel.\n\nZbývající tahy amoku: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Obklopuje vás tenký štít, který blokuje část poškození z magických útoků. \n\nVaše magické brnění je aktuálně posíleno o: 0-%d.\n\nTahy, dokud tajemné brnění nezeslábne: %s.
actors.buffs.arcanearmor.name=tajemné brnění
actors.buffs.artifactrecharge.desc=Energie vámi proudí a zvyšuje rychlost nabíjení vašich vybavených artefaktů.\n\nKaždý artefakt je ovlivněn trochu jinak, ale všechny se nabijí mnohem rychleji než obvykle.\n\nZbývající tahy: %s.
actors.buffs.artifactrecharge.name=dobíjení artefaktů
actors.buffs.ascensionchallenge.almost=Cítíš, jak Yogův stisk amuletu začíná slábnout, už jsi skoro tam!
actors.buffs.ascensionchallenge.beckon=Amulet začne volat vzdálené nepřátele.
actors.buffs.ascensionchallenge.break=Na chvíli se nadechneš a cítíš, jak se ti začínají hojit rány!
actors.buffs.ascensionchallenge.damage=Amulet začne vyzařovat temnou energii. Hoří!
actors.buffs.ascensionchallenge.desc=Yog-Dzewa si nějakým způsobem udržuje vliv na tento svět prostřednictvím amuletu a snaží se zastavit váš výstup!\n\nYogova síla činí dungeon mnohem nebezpečnějším, zvyšuje počet nepřátel a posiluje je! Tato síla se bude dále zvyšovat, pokud ji nebudete kontrolovat. Lze ji oslabit porážkou nepřátel, kteří byli Yogovou silou posíleni.
actors.buffs.ascensionchallenge.desc_beckon=Amulet momentálně _volá vzdálené nepřátele_ a upozorňuje je na vaši polohu.
actors.buffs.ascensionchallenge.desc_clear=Temná energie vyzařující z amuletu byla prozatím co nejvíce oslabena.
actors.buffs.ascensionchallenge.desc_damage=Energie z amuletu je tak silná, že ti _přímo škodí!_
actors.buffs.ascensionchallenge.desc_haste=Amulet momentálně _urychluje vzdálené nepřátele_ a umožňuje jim k tobě dosáhnout rychleji!
actors.buffs.ascensionchallenge.desc_slow=Amulet tě momentálně _zpomaluje_ a ruší efekty zvyšující rychlost!
actors.buffs.ascensionchallenge.haste=Amulet začíná urychlovat vzdálené nepřátele!
actors.buffs.ascensionchallenge.name=kletba amuletu
actors.buffs.ascensionchallenge.on_kill=Temná energie tě pohlcuje...
actors.buffs.ascensionchallenge.slow=Amulet se ve vašem inventáři začíná jevit jako olověné závaží!
actors.buffs.ascensionchallenge.weaken=Cítíš, jak kletba amuletu trochu slábne.
actors.buffs.ascensionchallenge.weaken_info=Kletbu amuletu lze oslabit porážkou více nepřátel.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Pokud porazíš nepřátele, kletba amuletu oslabí!
actors.buffs.barkskin.desc=Vaše kůže je ztvrdlá, na dotek drsná a pevná jako kůra.\n\nZtvrdlá kůže zvyšuje vaše efektivní brnění, což vám umožňuje lépe se bránit fyzickým útokům.\n\nVaše brnění je aktuálně zvýšeno o: 0-%d.\nTahy, dokud kůra nezeslábne: %s.\n\nPokud získáte kůru z více zdrojů, použije se pouze ta nejsilnější.
actors.buffs.barkskin.name=kůra kůže
actors.buffs.barrier.desc=Odolná bublina síly, která blokuje veškeré poškození.\n\nBariéra bude přijímat poškození pro cokoli, co chrání, dokud zbývá štít. Štít se také bude časem pomalu rozpadat.\n\nZbývající štít: %d.
actors.buffs.barrier.name=bariéra
actors.buffs.berserk.action_name=Šílený
actors.buffs.berserk.angered=rozzlobený
actors.buffs.berserk.angered_desc=Závažnost Berserkerových zranění zesiluje jeho údery. Jak Berserker utrpěl fyzické poškození, jeho vztek se bude zvyšovat a získá bonusové poškození. Poškození blokované brněním se stále počítá do zvyšování vzteku.\n\nVztek časem slábne. Čím nižší je berserkerovo zdraví, tím déle vydrží.\n\nPři vzteku 100%% se Berserker může zbláznit a získat štít na základě úrovně jeho brnění a chybějícího zdraví. Během berserkingu se jeho štít časem zhoršuje a jakmile dojde, bude si muset odpočinout, než si znovu vytvoří vztek.\n\nAktuální vztek: _%1$.0f%%_\n_+%2$.0f%%_ poškození\n\nŠtít berserkingu při aktuálním brnění a HP: _%3$d_
actors.buffs.berserk.berserk=zběsilý
actors.buffs.berserk.berserk_desc=Strach a nejistota vyprchají a zůstane jen hněv. V tomto stavu je Berserker extrémně silný, _způsobuje +50%% poškození a získává bonusové štíty,_ ale také štíty ztrácí každé kolo.\n\nKdyž je veškeré jeho štíty sníženy na 0, berserking skončí.\n\nPo zuření se Berserker bude muset zotavit, než bude moci znovu nabýt vzteku.\n\nZbývající štít: %d
actors.buffs.berserk.exhausted=vyčerpaný
actors.buffs.berserk.no_seal=K zuřivosti potřebuješ svou zlomenou pečeť!
actors.buffs.berserk.rankings_desc=Zběsilý k smrti
actors.buffs.berserk.recovering=zotavuje se
actors.buffs.berserk.recovering_desc=Vnitřní síla má své limity. Berserker si musí odpočinout, než znovu použije svůj vztek.\n\nBěhem zotavení se Berserkerovi z utrpěného poškození nezvyšuje vztek.
actors.buffs.berserk.recovering_desc_levels=Úrovně do obnovení: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Otáčí se, dokud se neobjeví: _%d_
actors.buffs.bleeding.desc=Z té rány protéká znepokojivé množství krve.\n\nKrvácení způsobuje poškození každé kolo. S každým kolem se poškození náhodně snižuje, dokud krvácení nakonec neustane.\n\nAktuální poškození krvácením: %d.
actors.buffs.bleeding.heromsg=Krvácíš!
actors.buffs.bleeding.name=krvácející
actors.buffs.bleeding.ondeath=Vykrvácel jsi...
actors.buffs.bleeding.rankings_desc=Vykrvácel k smrti
actors.buffs.bless.desc=Velký výbuch soustředění, někteří říkají, že je inspirován bohy.\n\nPožehnání zvyšuje přesnost a úhybnost o 25%%, díky čemuž je požehnání v boji mnohem efektivnější.\n\nZbývající tahy požehnání: %s.
actors.buffs.bless.name=blahoslavený
actors.buffs.blindness.desc=Oslepení promění okolní svět v temný opar.\n\nKdyž je postava oslepena, dosah vidění se sníží na jedno políčko, což činí útoky na dálku nepoužitelnými a velmi snadno ztratí přehled o vzdálených nepřátelích. Oslepený hrdina navíc není schopen číst svitky ani knihy.\n\nZbývající oslepení: %s.
actors.buffs.blindness.heromsg=Jsi oslepený/á!
actors.buffs.blindness.name=oslepený
actors.buffs.blobimmunity.desc=Nějaká podivná síla tě obklopuje tenkou ochrannou bariérou a blokuje všechny škodlivé vzdušné efekty.\n\nDokud tato bariéra trvá, jsi imunní vůči všem efektům vázaným na oblast.\n\nZbývající tahy imunity: %s.
actors.buffs.blobimmunity.name=čisticí bariéra
actors.buffs.burning.burnsup=%s hoří!
actors.buffs.burning.desc=Jen málo věcí je znepokojivějších než být pohlcen plameny.\n\nOheň způsobuje poškození každé kolo, dokud není uhašen vodou nebo dokud nevyprchá. Oheň lze uhasit vkročením do vody nebo stříknutím roztříštěného lektvaru.\n\nOheň může navíc zapálit hořlavý terén nebo předměty, s nimiž přijde do styku.\n\nZbývající kola hoření: %s.
actors.buffs.burning.heromsg=Vznítíš se!
actors.buffs.burning.name=hořící
actors.buffs.burning.ondeath=Uhořel jsi k smrti...
actors.buffs.burning.rankings_desc=Spáleno na popel
actors.buffs.championenemy$antimagic.desc=Antimagičtí šampioni dostávají o 50 % menší poškození a jsou zcela imunní vůči magickým účinkům.
actors.buffs.championenemy$antimagic.name=šampion v boji proti magii
actors.buffs.championenemy$blazing.desc=Planoucí šampioni způsobují o 25 % větší poškození zblízka, zapalují nepřátele, na které útočí, jsou imunní vůči ohni a po smrti šíří oheň kolem sebe. Nemohou však šířit oheň do vody.
actors.buffs.championenemy$blazing.name=planoucí šampion
actors.buffs.championenemy$blessed.desc=Požehnaní šampioni mají 4x větší přesnost a úhybnost.
actors.buffs.championenemy$blessed.name=požehnaný šampion
actors.buffs.championenemy$giant.desc=Obří šampioni dostávají o 80 % menší poškození a mají +1 k dosahu útoku, ale nemohou se pohybovat uzavřenými prostory.
actors.buffs.championenemy$giant.name=obří šampion
actors.buffs.championenemy$growing.desc=Rostoucí šampioni získávají neustále rostoucí bonus k přesnosti, úhybnosti, fyzickému poškození a snížení přijímaného poškození. \n\nAktuální zvýšení akcelerace/evace/poškození: %1$d%%\nAktuální snížení poškození: %2$d%%
actors.buffs.championenemy$growing.name=rostoucí šampion
actors.buffs.championenemy$projecting.desc=Vyčnívající šampioni způsobují o 25 % větší poškození zblízka a mají +3 na dosah útoku.
actors.buffs.championenemy$projecting.name=projektující šampion
actors.buffs.championenemy.warn=Cítíte smrtící přítomnost.
actors.buffs.charm.cant_attack=Jste okouzleni tímto nepřítelem a nemůžete na něj zaútočit.
actors.buffs.charm.desc=Kouzlo je manipulativní magie, která může dočasně přimět nepřátele, aby se navzájem zbožňovali.\n\nPostavy ovlivněné kouzlem nemohou přímo útočit na nepřítele, kterým jsou okouzleny. Útok na jiné cíle je však stále možný. Šok bolesti zkrátí trvání kouzla.\n\nZbývající tahy kouzla: %s.
actors.buffs.charm.heromsg=Jste okouzleni!
actors.buffs.charm.name=okouzlený
actors.buffs.chill.desc=Není to úplně zmrzlé, ale stále příliš studené.\n\nZchlazené cíle provádějí všechny akce pomaleji, v závislosti na tom, kolik tahů zbývá v efektu. V nejhorším případě je to ekvivalentní zpomalení.\n\nZbývající tahy chladu: %1$s.\nRychlost je snížena o: %2$s%%
actors.buffs.chill.freezes=%s zamrzá!
actors.buffs.chill.name=chlazené
actors.buffs.combo$combomove.clobber.desc=Odhodí nepřítele o 2 políčka zpět, ale nezpůsobí mu žádné poškození a nemůže ho srazit do jam. Zvyšuje hodnotu komba o 1.
actors.buffs.combo$combomove.clobber.empower_desc=Odhodí nepřítele o _3 políčka zpět, způsobí mu závrať a může ho srazit do jam,_ ale nezpůsobí mu žádné poškození. Zvyšuje hodnotu komba o 1.
actors.buffs.combo$combomove.clobber.name=hadry
actors.buffs.combo$combomove.crush.desc=Způsobuje primárnímu cíli %d%% (kombo*25%%) poškození a všem ostatním nepřátelům v dosahu 7x7 poloviční poškození. Po použití komba se resetuje.
actors.buffs.combo$combomove.crush.empower_desc=_Vyskočí až na políčko(a) %1$d_ a způsobí %2$d%% (kombo*25%%) poškození primárnímu cíli a poloviční poškození všem ostatním nepřátelům v oblasti 7x7. Při použití komba resetuje.
actors.buffs.combo$combomove.crush.name=rozdrtit
actors.buffs.combo$combomove.fury.desc=Za každé kombo, které máte, zasáhne nepřítele jednou. Každý zásah způsobí 60% poškození a může spustit očarování. Po použití se kombo resetuje.
actors.buffs.combo$combomove.fury.empower_desc=_Vyskočí na políčko(a) %d_ a za každé kombo, které máte, zasáhne nepřítele jednou. Každý zásah způsobí poškození 60%% a může spustit očarování. Při použití resetuje kombo.
actors.buffs.combo$combomove.fury.name=zuřivost
actors.buffs.combo$combomove.parry.desc=Po aktivaci zablokuje další útok do 1 kola a okamžitě se na něj odplatí. Pokud není nic parírováno, resetuje kombo.
actors.buffs.combo$combomove.parry.empower_desc=Po aktivaci blokuje _všechny útoky_ do 1 kola a okamžitě se na ně odplatí. Pokud není žádný útok parírován, resetuje kombo.
actors.buffs.combo$combomove.parry.name=odrážet
actors.buffs.combo$combomove.slam.desc=Způsobí bonusové poškození ve výši %d%% (kombo*20%%) vaší blokující síly. Při použití resetuje kombo.
actors.buffs.combo$combomove.slam.empower_desc=_Vyskočí na políčko(a) %1$d_ a způsobí %2$d%% (kombo*20%%) vaší blokující síly poškození jako bonusové poškození. Při použití se kombo resetuje.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo.action_name=kombinovaný útok
actors.buffs.combo.bad_target=Musíte zaměřit nepřítele v dosahu útoku.
actors.buffs.combo.combo=%d trefilo kombinaci!
actors.buffs.combo.desc=Gladiátor nabírá na síle, když zasazuje úspěšné údery. Každý útok zvyšuje počítadlo komb o jedna, ale příliš dlouhá doba mezi zásahy vynuluje počítadlo komb na 0. Dokud má gladiátor kombo, jeho štít z rozbité pečeti nezačne slábnout.\n\nBudování komba odemyká speciální kombinované útoky, které nelze minout! Jiný útok se odemyká při počtu komb 2, 4, 6, 8 a 10. Některé pohyby vynulují kombo a jiné ne, ale každý pohyb lze použít pouze jednou za session komba.\n\nAktuální kombo: %1$d.\n\nTahy, dokud se kombo neztratí: %2$s.
actors.buffs.combo.name=kombo
actors.buffs.combo.prompt=Vyberte cíl k útoku.
actors.buffs.corrosion.desc=Silná kyselina roztavuje maso, kov a kosti alarmující rychlostí.\n\nPoškození korozí se časem zvyšuje, jak se cíl dále taví.\n\nZbývající korozní vlny: %1$s.\nAktuální poškození korozí: %2$d.
actors.buffs.corrosion.heromsg=Rozplýváš se!
actors.buffs.corrosion.name=koroze
actors.buffs.corrosion.ondeath=Rozplýváš se...
actors.buffs.corrosion.rankings_desc=Rozpuštěný
actors.buffs.corruption.desc=Zkaženost proniká do podstaty bytosti a překrucuje ji proti její dřívější povaze.\n\nZkažené bytosti útočí na své spojence a ignorují své bývalé nepřátele. Zkaženost je také škodlivá a pomalu způsobuje, že její cíl podlehne.\n\nZkaženost je trvalá, její účinky končí pouze smrtí.
actors.buffs.corruption.name=zkorumpovaný
actors.buffs.cripple.desc=Jsi si docela jistý, že nohy se takto ohýbat nemají.\n\nCrippled snižuje rychlost pohybu na polovinu, takže pohyb políčka obvykle trvá dvě kola místo jednoho.\n\nZbývající kola mrzáka: %s.
actors.buffs.cripple.heromsg=Jsi zmrzačený/á!
actors.buffs.cripple.name=zmrzačený
actors.buffs.daze.desc=Zvonění v uších a rozmazané vidění ztěžují boj.\n\nPři omámení je přesnost a úhybnost snížena o 50%%, což značně ztěžuje jak přistání, tak i vyhýbání se úderům.\n\nZbývající tahy omámení: %s.
actors.buffs.daze.heromsg=Jsi omámený/á!
actors.buffs.daze.name=omámený
actors.buffs.degrade.desc=Mocná temná magie vysává sílu, kterou svitky vylepšení daly vašemu vybavení!\n\nS vylepšeným vybavením se bude zacházet, jako by bylo na nižší úrovni, než ve skutečnosti je. _Každé vylepšení po +3 se exponenciálně oslabí než to poslední._ Popisy vašich předmětů se změní tak, aby odrážely jejich sníženou úroveň síly.\n\nDegradace neovlivňuje požadavky na sílu, nabíjení hůlek, odolnost vrhacích zbraní ani artefaktů.\n\nZbývající tahy degradace: %s. Použití svitku vylepšení nebo odstranění kletby okamžitě ukončí degradaci.
actors.buffs.degrade.heromsg=Vaše vybavení se zdá slabší!
actors.buffs.degrade.name=degradovaný
actors.buffs.doom.desc=Je těžké pokračovat, když se zdá, že vesmír chce vaši smrt.\n\nOdsouzené postavy obdrží +67% poškození ze všech zdrojů.\n\nOdsouzení je trvalé, jeho účinky končí pouze smrtí.
actors.buffs.doom.name=odsouzen
actors.buffs.dread.desc=Hrůza tak velká, že donutí svůj cíl úplně uprchnout z jeskyně!\n\nTvorové postižení hrůzou utíkají od svého soupeře vysokou rychlostí a jakmile jsou z dohledu, z jeskyně úplně zmizí. Nepřátelé, kteří jsou tímto způsobem poraženi, získají poloviční zkušenosti a neztratí žádné předměty. Šok bolesti zkrátí trvání hrůzy.\n\nZbývající tahy hrůzy: %d.
actors.buffs.dread.name=strach
actors.buffs.drowsy.desc=Magická síla ztěžuje udržení vzhůru, po několika kolech cíl upadne do hlubokého magického spánku.\n\nHrdina dokáže odolat ospalosti tím, že přijme poškození nebo bude mít plné zdraví.\n\nKoly do spánku: %s.
actors.buffs.drowsy.name=ospalý
actors.buffs.earthimbue.desc=Jsi naplněn silou země!\n\nVšechny fyzické útoky posunou zemi pod nepřítelem a na krátkou dobu ho ochromí.\n\nZbývající tahy naplnění zemí: %s.
actors.buffs.earthimbue.name=prodchnutý zemí
actors.buffs.enhancedrings.desc=Zlodějův nedávno použitý artefakt posiluje jeho prsteny a dává jim +1 úroveň. \n\nZbývající tahy: %s.
actors.buffs.enhancedrings.name=vylepšené prsteny
actors.buffs.fireimbue.desc=Jsi naplněn silou ohně!\n\nVšechny fyzické útoky budou mít šanci zapálit nepřátele. Navíc jsi zcela imunní vůči účinkům ohně.\n\nZbývající tahy nabití ohněm: %s.
actors.buffs.fireimbue.name=prodchnutý ohněm
actors.buffs.foresight.desc=Nějak dokážete svou myslí vidět rozložení okolního terénu.\n\nPod vlivem předvídavosti se vám odhalí všechna pole v širokém okruhu, včetně všech tajných pastí nebo dveří.\n\nZbývající tahy předvídavosti: %s.
actors.buffs.foresight.name=předvídavost
actors.buffs.frost.desc=Nezaměňovat se zmrznutím, toto šetrnější zmrazení jednoduše obklopí cíl ledem.\n\nZmrazení funguje podobně jako paralýza, což cíli znemožňuje akci. Na rozdíl od paralýzy je zmrazení okamžitě zrušeno, pokud cíl utrpí poškození, protože led se roztříští.\n\nZbývající tahy zmrazení: %s.
actors.buffs.frost.freezes=%s zamrzá!
actors.buffs.frost.name=zmrazený
actors.buffs.frostimbue.desc=Jsi naplněn ledovou silou!\n\nVšechny fyzické útoky budou na nepřátele postupně sčítat chlad. Navíc jsi vůči chladu zcela imunní.\n\nZbývající tahy mrazu naplní: %s.
actors.buffs.frostimbue.name=prodchnutý mrazem
actors.buffs.fury.desc=Jsi naštvaný, nepřátelé tě nebudou mít rádi, když jsi naštvaný.\n\nA V tobě hoří velká zuřivost, která zvyšuje poškození, které způsobuješ fyzickými útoky, o 50%%.\n\nTato zuřivost bude trvat tak dlouho, dokud budeš mít zranění pod 50%% zdraví.
actors.buffs.fury.heromsg=Zuříš!
actors.buffs.fury.name=zuřivý
actors.buffs.gravitychaostracker.desc_duration=Není jasné, jak dlouho bude účinek trvat, ale nemůže trvat věčně.
actors.buffs.gravitychaostracker.desc_intro=Každých pár tahů budou všechny postavy na aktuálním patře podzemí vrženy náhodným směrem.
actors.buffs.gravitychaostracker.desc_positive=Zdá se ale, že ty a tvoji spojenci jste imunní.
actors.buffs.gravitychaostracker.name=gravitační chaos
actors.buffs.greaterhaste.desc=Neuvěřitelné zvýšení rychlosti, na okamžik se zdá, jako by se všechno ostatní zastavilo.\n\nPod vlivem většího zrychlení pohyb netrvá vůbec dlouho, ale ostatní akce se stále provádějí normální rychlostí. Každý krok pohybu spotřebuje kolo většího zrychlení.\n\nZbývající kola většího zrychlení: %d.
actors.buffs.greaterhaste.name=větší spěch
actors.buffs.haste.desc=Energie proudí vašimi svaly a umožňuje vám běžet neuvěřitelnou rychlostí!\n\nPod vlivem zrychlení poběžíte 3x rychleji, ale všechny ostatní akce budete provádět normální rychlostí.\n\nZbývající tahy zrychlení: %s.
actors.buffs.haste.name=spěch
actors.buffs.healing.desc=Magický lék způsobuje zacelení ran a scelení masa.\n\nZdraví se bude každým tahem postupně regenerovat, dokud léčivý účinek nevyprší. Množství léčiv se může časem snižovat.\n\nDalší léčivo: %d.\n\nZbývající léčivo: %d.
actors.buffs.healing.name=léčení
actors.buffs.herodisguise.desc=Iluzorní magie změnila tvůj fyzický vzhled! Efekt je čistě kosmetický, ale i tak působí velmi zvláštně. \n\nZbývající tahy převleku: %s.
actors.buffs.herodisguise.name=přestrojení
actors.buffs.hex.desc=Temná magie, která narušuje soustředění a cíl je mírně dezorientovaný.\n\nKletba snižuje přesnost a úhybnost o 20%%, čímž cíl v boji snižuje jeho efektivitu.\n\nZbývající tahy klevet: %s.
actors.buffs.hex.heromsg=Byl jsi prokletý!
actors.buffs.hex.name=prokletý
actors.buffs.holdfast.desc=Válečník si drží svou pozici, zvyšuje si brnění o %1$d-%2$d a zpomaluje rychlost rozpadu některých buffů o %3$d%%. Toto bude trvat, dokud se nepohne.
actors.buffs.holdfast.name=drž se pevně
actors.buffs.hunger.cursedhorn=Prokletý roh ti při jídle krade část energie z potravy.
actors.buffs.hunger.desc=S tím, jak trávíte čas v podzemí, se vám pomalu zvyšuje hlad, až nakonec začnete hladovět. Při hladovění budete pomalu ztrácet zdraví, místo abyste si ho regenerovali.\n\nPřídělový systém je důležitý! Pokud máte zdraví nazbyt, hladovění není špatný nápad, pokud to znamená, že později budete mít více jídla. Efektivní přídělový systém může prodloužit životnost jídla!
actors.buffs.hunger.desc_intro_hungry=Cítíte, jak váš žaludek volá po jídle, ale zatím to není příliš naléhavé.
actors.buffs.hunger.desc_intro_starving=Máš takový hlad, že to bolí.
actors.buffs.hunger.hungry=hladový
actors.buffs.hunger.ondeath=Zemřel jsi hlady...
actors.buffs.hunger.onhungry=Máš hlad.
actors.buffs.hunger.onstarving=Umíráš hlady!
actors.buffs.hunger.rankings_desc=Vyhladověl k smrti
actors.buffs.hunger.starving=hladovějící
actors.buffs.invisibility.desc=Jste zcela splynutí s okolním terénem, takže vás není možné vidět.\n\nDokud jste neviditelní, nepřátelé na vás nemohou útočit ani vás sledovat. Fyzické útoky a magické efekty (jako jsou svitky a hůlky) neviditelnost okamžitě zruší.\n\nZbývající tahy neviditelnosti: %s.
actors.buffs.invisibility.name=neviditelný
actors.buffs.invulnerability.desc=Tato postava je obdařena velkou ochrannou silou, která jí poskytuje krátké období nezranitelnosti!\n\nZbývající tahy: %s.
actors.buffs.invulnerability.name=nezranitelný
actors.buffs.levitation.desc=Magická síla vás levituje nad zemí a vyvolává pocit beztíže. \n\nLevitující postavy se pohybují tiše a ignorují všechny pozemní efekty. Pasti se nespustí, voda neuhasí oheň, rostliny nebudou pošlapány, kořeny nebudou minuty a nad jámami se bude vznášet. Buďte opatrní, protože všechny tyto věci se mohou projevit v okamžiku, kdy levitace skončí! \n\nZbývající tahy levitace: %s.
actors.buffs.levitation.name=levitující
actors.buffs.lifelink.desc=Životní síla této postavy je propojena s jinou postavou v okolí. Veškeré utrpěné poškození se mezi nimi sdílí.\n\nKdykoli tato postava utrpí poškození, polovina z něj bude způsobena cíli s odkazem života.\n\nZbývající tahy odkazu života: %s.
actors.buffs.lifelink.name=životní pouto
actors.buffs.lifelink.ondeath=Poškození spojené se životem tě zabilo...
actors.buffs.light.desc=I v nejtemnějším podzemí je stálé světlo po vašem boku vždycky uklidňující. \n\nSvětlo pomáhá udržet tmu na uzdě a umožňuje vám vidět do rozumné vzdálenosti navzdory okolnímu prostředí. \n\nZbývající otáčky osvětlení: %s.
actors.buffs.light.name=osvětlené
actors.buffs.lockedfloor.desc=Aktuální patro je zamčené a nemůžete ho opustit!\n\nDokud je patro zamčené, nezískáte hlad ani poškození z hladovění. Navíc, pokud se nepouštíte do porážky bosse v tomto patře, pasivní regenerační efekty se také zastaví.\n\nNavíc, pokud vás oživí nepožehnaný ankh, zatímco je patro zamčené, resetuje se.\n\nZabijte bosse v tomto patře, abyste prolomili zámek.
actors.buffs.lockedfloor.name=podlaha je zamčená
actors.buffs.lostinventory.desc=Váš inventář se někde v podzemí ztratil! Většinu předmětů nebudete moci sebrat ani použít, dokud ho nezískáte zpět.
actors.buffs.lostinventory.name=ztracené zásoby
actors.buffs.magicalsight.desc=Nějak se ti daří vidět myslí, spíše než očima.\n\nDokud je magický zrak aktivní, budeš schopen vidět skrz veškerý terén v okruhu 12 políček.\n\nZbývající tahy magického zraku: %s.
actors.buffs.magicalsight.name=magický pohled
actors.buffs.magicalsleep.desc=Tato postava upadla do hlubokého magického spánku, ze kterého se přirozeně neprobudí.\n\nMagický spánek je podobný běžnému spánku, až na to, že cíl se probudí pouze poškozením.\n\nPro hrdinu a jeho spojence má magický spánek některé regenerační vlastnosti, které jim umožňují rychle se uzdravit během odpočinku.
actors.buffs.magicalsleep.fallasleep=Upadneš do hlubokého magického spánku.
actors.buffs.magicalsleep.name=magický spánek
actors.buffs.magicalsleep.toohealthy=Jsi až příliš zdravý/á a odoláváš nutkání spát.
actors.buffs.magicalsleep.wakeup=Probudíte se s pocitem svěžesti a zdraví.
actors.buffs.magicimmune.desc=Všechny magické efekty na tebe ztratily vliv, jsi vůči nim zcela imunní.\n\nI když jsi imunní vůči magii, všechny škodlivé a prospěšné magické efekty se na tebe nebudou vztahovat, včetně kleteb, kouzel, hůlek, svitků, prstenů, artefaktů atd. Schopnosti hrdinského brnění jsou dostatečně silné, aby fungovaly bez ohledu na tento efekt.\n\nZbývající tahy magické imunity: %s.
actors.buffs.magicimmune.name=imunní vůči magii
actors.buffs.mindvision.desc=Nějak se vám daří vidět všechny tvory na tomto patře skrze svou mysl. Je to zvláštní pocit.\n\nVšechny postavy na tomto patře jsou pro vás viditelné, pokud máte myšlenkové vidění. Vidění tvora skrze myšlenkové vidění se počítá jako vidění nebo jeho blízkosti pro účely mnoha magických efektů.\n\nZbývající otáčky myšlenkového vidění: %s.
actors.buffs.mindvision.name=vidění mysli
actors.buffs.momentum.action_name=volný běh
actors.buffs.momentum.momentum=budování dynamiky
actors.buffs.momentum.momentum_desc=Jak se Freerunner pohybuje, získává hybnost, kterou může použít k zahájení freerunningu.\n\nKaždý náboj hybnosti poskytuje dvě kola freerunningu a Freerunner si může nashromáždit až 10 nábojů. Hybnost se rychle ztrácí, když se Freerunner přestane pohybovat.\n\nAktuální náboj hybnosti: %d.
actors.buffs.momentum.resting=zotavuje se
actors.buffs.momentum.resting_desc=Jak se Freerunner pohybuje, získává hybnost, kterou může využít k zahájení freerunningu.\n\nFreerunner potřebuje čas na obnovení své výdrže, než znovu nabere hybnost.\n\nZbývající tahy: %d.
actors.buffs.momentum.running=volný běh
actors.buffs.momentum.running_desc=Jak se Freerunner pohybuje, získává hybnost, kterou může využít k zahájení freerunningu.\n\nBěhem freerunningu se Freerunner pohybuje dvojnásobnou rychlostí a získává bonus k úhybným manévrům v závislosti na své úrovni.\n\nZbývající tahy: %d.
actors.buffs.monkenergy$monkability$dash.desc=Okamžitý běh až o 4 políčka dál. Tato schopnost dokáže překonat překážky, ale ne nepřátele ani pevný terén.
actors.buffs.monkenergy$monkability$dash.empower_desc=Okamžitý skok až do vzdálenosti _8 políček_. Tato schopnost dokáže překonat překážky, ale ne nepřátele ani pevný terén.
actors.buffs.monkenergy$monkability$dash.name=pomlčka
actors.buffs.monkenergy$monkability$dash.prompt=Vyberte místo
actors.buffs.monkenergy$monkability$dragonkick.desc=Zničující kop, který způsobí poškození %1$d-%2$d a ignoruje brnění. Kop odhodí cíl a paralyzuje ho na každém políčku, kterým se přesune.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Zničující kop, který způsobí _%1$d-%2$d poškození_ a ignoruje brnění. Kop odhodí _všechny sousední cíle_ a paralyzuje je na každém políčku, kterým se přesunou.
actors.buffs.monkenergy$monkability$dragonkick.name=dračí kop
actors.buffs.monkenergy$monkability$flurry.desc=Dva okamžité údery, které způsobí poškození %1$d-%2$d a ignorují brnění. Tuto schopnost nelze použít opakovaně.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dva okamžité údery, které způsobí poškození %1$d-%2$d, ignorují brnění _a používají kouzlo vaší zbraně._ Tuto schopnost nelze použít opakovaně.
actors.buffs.monkenergy$monkability$flurry.name=záplava úderů
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Mnich se soustředí na své okolí a očekává další útok namířený proti ní. Dokud je soustředěná, má zaručeno, že další útok odrazí.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=soustředěný
actors.buffs.monkenergy$monkability$focus.desc=Mnich se otočí, aby se soustředil, a nechá ji odrazit další útok namířený proti ní.
actors.buffs.monkenergy$monkability$focus.empower_desc=Mnich se _okamžitě soustředí_ a nechá ji odrazit další útok namířený proti ní.
actors.buffs.monkenergy$monkability$focus.name=soustředit
actors.buffs.monkenergy$monkability$meditate.desc=Mnich soustředí energii do svého těla na 5 kol. Tím se zruší většina negativních efektů a získá se jí 8 kol doby nabíjení hůlky a artefaktu.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Mnich soustředí energii do svého těla na 5 kol. Tím se zruší většina negativních efektů a získá se jí 8 kol dobíjení hůlky a artefaktu. _Během meditace také získá 80% odolnost vůči poškození a pomalu se léčí o 20 % chybějících HP._
actors.buffs.monkenergy$monkability$meditate.name=přemýšlet
actors.buffs.monkenergy.action=Schopnosti mnichů
actors.buffs.monkenergy.desc=Když poráží nepřátele, mnich získává energii, kterou může použít na různé schopnosti. Většina nepřátel po porážce udělí 1 energii a mnich energii v průběhu času neztrácí. \n\nAktuální energie: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Mnich nedávno použil jednu schopnost a musí počkat, než použije další. \n\nAktuální doba přebíjení: %d tahy.
actors.buffs.monkenergy.name=energie
actors.buffs.ooze.desc=Tato lepkavá kyselina ulpívá na mase a pomalu ho rozpouští.\n\nSliz bude časem způsobovat konzistentní poškození, ale lze jej okamžitě smýt vodou.\n\nZbývající množství slizu: %s.
actors.buffs.ooze.heromsg=Žíravý sliz ti požírá maso. Smyj to!
actors.buffs.ooze.name=žíravý sliz
actors.buffs.ooze.ondeath=Rozplýváš se...
actors.buffs.ooze.rankings_desc=Rozpuštěný
actors.buffs.paralysis.desc=Často je nejhorší nedělat vůbec nic.\n\nParalýza zcela zastaví všechny akce a donutí cíl čekat, dokud efekt neodezní. Bolest z utrpěného poškození může způsobit, že postavy budou paralýze bránit, a tím je zbaví efektu.\n\nZbývající tahy paralýzy: %s.
actors.buffs.paralysis.heromsg=Jsi paralyzovaný/á!
actors.buffs.paralysis.name=paralyzovaný
actors.buffs.paralysis.out=odolal paralýze
actors.buffs.physicalempower.desc=Vaše údery byly zesíleny, čímž se zvyšuje množství poškození, které můžete způsobit fyzickými útoky na nepřátele. \n\nBonusové poškození: %1$d.\nZbývající zásahy: %2$d.
actors.buffs.physicalempower.name=fyzicky zmocněný
actors.buffs.pincushion.desc=Vrhané zbraně, které jsi proti této postavě použil, jsou k ní aktuálně přilepené a po jejím poražení spadnou na zem. \n\nNásledující položky jsou aktuálně připojeny:
actors.buffs.pincushion.name=jehelníček
actors.buffs.poison.desc=Jed si proniká tělem a pomalu narušuje jeho vnitřní fungování.\n\nJed způsobuje poškození v každém tahu úměrné době, po kterou vyprší jeho účinnost.\n\nZbývající tahy jedu: %s.
actors.buffs.poison.heromsg=Jsi otrávený/á!
actors.buffs.poison.name=otrávený
actors.buffs.poison.ondeath=Zemřel jsi na otravu...
actors.buffs.poison.rankings_desc=Podlehl otravě
actors.buffs.preparation.action_name=připravená stávka
actors.buffs.preparation.assassinated=zavražděn
actors.buffs.preparation.desc=Assassin trpělivě čeká a připravuje se udeřit ze stínů.
actors.buffs.preparation.desc_blink=Dokáže mrknout směrem k nepříteli, než ho zasáhne, s maximální vzdáleností _%d._.
actors.buffs.preparation.desc_dmg=Jeho další útok způsobí bonusové poškození _%1$d%%_ a popraví běžné nepřátele s méně než _%2$d%% zdraví_ nebo bossy s méně než _%3$d%% zdraví_.
actors.buffs.preparation.desc_dmg_likely=Útok také s větší pravděpodobností způsobí větší poškození.
actors.buffs.preparation.desc_invis_next=Tahy pro silnější útok: _%d._
actors.buffs.preparation.desc_invis_time=Tahy strávené neviditelností: _%d._
actors.buffs.preparation.name=příprava
actors.buffs.preparation.no_target=Tam není na co útočit.
actors.buffs.preparation.out_of_reach=Ten cíl je mimo dosah.
actors.buffs.preparation.prompt=Vyberte cíl k útoku!\nMaximální vzdálenost mrknutí: %d
actors.buffs.prismaticguard.desc=Chrání vás hranolový obraz, který je momentálně neaktivní. Když jsou přítomni nepřátelé, hranolový obraz se aktivuje a ochrání vás!\n\nDokud je hranolový obraz neaktivní, postupně se zotavuje z utrpěného poškození.\n\nAktuální HP: %d/%d.
actors.buffs.prismaticguard.desc_many=Tento hranolový obrázek také těží z efektu Síla mnoha. Zbývající tahy: %d.
actors.buffs.prismaticguard.name=hranolový stráž
actors.buffs.recharging.desc=Energie tebou proudí a zvyšuje rychlost nabíjení tvých hůlek a holí.\n\nKaždé kolo s tímto vylepšením se aktuální nabití zvýší o čtvrtinu, a to navíc k běžnému dobíjení.\n\nZbývající kola dobíjení: %s.
actors.buffs.recharging.name=dobíjení
actors.buffs.revealedarea.desc=Oblast podzemí byla hrdinovi dočasně odhalena. Uvidí ji bez ohledu na to, kde se nachází. \n\nZbývající tahy: %s.
actors.buffs.revealedarea.name=odhalená oblast
actors.buffs.revealedchar.desc=Tato postava je hrdinovi odhalena. Bude viditelná bez ohledu na to, kde se nachází. \n\nZbývající tahy: %s.
actors.buffs.revealedchar.name=odhaleno
actors.buffs.roots.desc=Kořeny (magické nebo přírodní) se svírají za chodidla a tlačí je dolů k zemi.\n\nKořeny uzamknou cíl na místě, čímž znemožní pohyb a většinu pohybových schopností. Ostatní akce, včetně teleportačních efektů, nejsou ovlivněny.\n\nZbývající tahy kořenů: %s.
actors.buffs.roots.heromsg=Nemůžeš se hnout!
actors.buffs.roots.name=zakořeněný
actors.buffs.scrollempower.desc=Energie z nedávno přečteného svitku mága posiluje jeho hůlky!\n\nZvýšení úrovně: +%1$d.\nZbývající zaps: %2$d.
actors.buffs.scrollempower.name=zmocnit rolování
actors.buffs.shadows.desc=Splynete se stíny kolem sebe, což vám dodá neviditelnost a zpomalí váš metabolismus.\n\nDokud jste neviditelní, nepřátelé vás nemohou napadnout ani sledovat. Většina fyzických útoků a magických efektů (jako jsou svitky a hůlky) neviditelnost okamžitě zruší. Navíc, když jste ve stínovém spojení, zpomalí se váš hlad.\n\nVe stínovém spojení zůstanete, dokud neopustíte stíny nebo se s vámi nepřítel nedotkne.
actors.buffs.shadows.name=splynutí stínů
actors.buffs.slow.desc=Zpomalovací magie ovlivňuje rychlost cíle, pro něj se všechno pohybuje super rychle.\n\nA Zpomalená postava provádí všechny akce za dvojnásobek času, než by tomu bylo normálně.\n\nZbývající tahy zpomalení: %s.
actors.buffs.slow.name=zpomalil
actors.buffs.snipersmark.action_name_snapshot=momentka
actors.buffs.snipersmark.action_name_sniper=výstřel odstřelovače
actors.buffs.snipersmark.action_name_volley=volej
actors.buffs.snipersmark.desc=Odstřelovačka se zaměřuje na cíl, na který naposledy zaútočila. Svým lukem je schopna provést speciální útok, který se liší v závislosti na tom, jak je luk vylepšen.\n\nNevylepšený luk vystřelí _momentku_, která způsobí snížené poškození, ale jeho výstřel netrvá dlouho.\n\nA Luk vylepšený o rychlost vystřelí _salvu_ tří šípů. Každý šíp způsobí snížené poškození, ale stále může aktivovat očarování. Výstřel této salvy trvá 1 kolo.\n\nA Luk vylepšený o poškození vystřelí _odstřelovací výstřel_. Tento výstřel zaručeně zasáhne cíl, způsobí bonusové poškození v závislosti na vzdálenosti od cíle a jeho výstřel trvá 2 kola.\n\nZbývající tahy: %s.
actors.buffs.snipersmark.name=odstřelovací značka
actors.buffs.soulmark.desc=Čaroděj se napojil na duši tohoto tvora, což mu umožňuje léčit se, když dostává fyzické poškození. \n\nZbývající tahy znamení duše: %s.
actors.buffs.soulmark.name=duše poznamenaná
actors.buffs.stamina.desc=Máte nekonečnou výdrž, která vám umožňuje rychlejší pohyb!\n\nPod vlivem výdrže poběžíte rychlostí +50%%, ale všechny ostatní akce budete provádět normální rychlostí.\n\nZbývající tahy výdrže: %s.
actors.buffs.stamina.name=výdrž
actors.buffs.terror.desc=Teror je manipulativní magie, která nutí svůj cíl k nekontrolovatelné panice.\n\nVyděšené postavy jsou nuceny utíkat před svým soupeřem a snažit se mezi sebe postavit co nejvíce dveří a zdí. Šok z bolesti však zkrátí trvání teroru.\n\nZbývající tahy teroru: %s.
actors.buffs.terror.name=vyděšený
actors.buffs.toxicimbue.desc=Jste naplněni jedovatou energií!\n\nJak se pohybujete, z vás bude neustále unikat toxický plyn, který poškozuje vaše nepřátele. Po dobu trvání efektu a také několik tahů poté jste imunní vůči toxickému plynu a jedu.\n\nZbývající tahy toxického naplnění: %s.
actors.buffs.toxicimbue.name=prodchnutý toxicitou
actors.buffs.vertigo.desc=Chůze po rovné linii může být obtížná, když se celý svět točí.\n\nPod vlivem závratě se postavy, které se pokusí pohnout, vydají náhodným směrem, nikoli směrem, kterým zamýšlely.\n\nZbývající otáčky závratě: %s.
actors.buffs.vertigo.name=závrať
actors.buffs.vulnerable.desc=Magie zranitelnosti zvyšuje veškeré fyzické poškození, které postava utrpí, o 33%%, poté, co je toto poškození sníženo brněním.\n\nZbývající tahy zranitelnosti: %s.
actors.buffs.vulnerable.heromsg=Cítíš se křehký/á!
actors.buffs.vulnerable.name=zranitelný
actors.buffs.wandempower.desc=Vaše hůlky způsobující poškození byly posíleny, čímž se na několik zásahů zvyšuje množství způsobeného poškození. \n\nBonusové poškození: %1$d.\nZbývající zásahy: %2$d.
actors.buffs.wandempower.name=zmocněné hůlky
actors.buffs.weakness.desc=Všechno se najednou zdá mnohem těžší.\n\nOslabení magie snižuje fyzickou sílu postavy, což způsobuje, že způsobuje o 33%% snížené poškození.\n\nZbývající tahy slabosti: %s.
actors.buffs.weakness.heromsg=Cítíte se oslabení!
actors.buffs.weakness.name=oslabený
actors.buffs.wellfed.desc=Cítíte se docela spokojeni a sytí.\n\nKdyž jste dobře najedeni, váš hlad se nezvýší a časem se vám vyléčí další zdraví.\n\nZbývající tahy: %d.
actors.buffs.wellfed.name=dobře živený
actors.char.def_verb=uhnul
actors.char.def_verb_blocked=zablokováno
actors.char.defeat=Porazil jsi %s.
actors.char.immune=imunní
actors.char.invulnerable=nezranitelný
actors.char.kill=%s tě zabil...
actors.hero.abilities.armorability.cost=Cena poplatku: _%d_
actors.hero.abilities.armorability.no_target=Tam není na co cílit!
actors.hero.abilities.armorability.prompt=Vyberte cílovou oblast
actors.hero.abilities.armorability.self_target=Nemůžeš se zaměřit na sebe!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Z těla klerika vyzařuje zářivá energie. V této formě klerik získává 2 body dostřelu (díky svaté energii, která z něj vyzařuje) a 10 bodů štítu, kdykoli utratí nabití svaté knihy. Je také schopen sesílat kouzla, která se odemykají pomocí talentů vznesené formy.\n\nŠtít udělený vznesenou formou a jejími kouzly se normálně nerozpadne, ale okamžitě slábne, jakmile vznesená forma skončí.\n\nAktuální štít: %1$d.\nZbývající tahy: %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=vzestoupená forma
actors.hero.abilities.cleric.ascendedform.desc=Klerik ze sebe vyzařuje svatou energii a po dobu 10 kol nabývá prodloužené zářivé podoby. V této podobě může klerik sesílat nová kouzla, získává 2 body k dosahu útoku, 30 bodů k štítu a všechna další kouzla, která sešle, mu poskytnou 10 bodů štítu za každé použité nabití svaté knihy. \n\n Štít z vynesené podoby a jejích kouzel se normálně nerozpadá, ale okamžitě slábne, jakmile vynesená podoba skončí. Schopnost lze znovu použít k obnovení trvání vynesené podoby.
actors.hero.abilities.cleric.ascendedform.name=vzestoupená forma
actors.hero.abilities.cleric.ascendedform.short_desc=Kněz nabývá _Vyzdvižené podoby_, čímž získává nová kouzla, dosah útoku a štíty.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Kopie jednoho z dobrodružných společníků klerika, vyrobená z pevného světla. I když má tvar jiného hrdiny, nemá žádnou z jeho jedinečných schopností. Tento spojenec přetrvá tak dlouho, dokud je na něj aplikována Síla mnoha.\n\nTohoto spojence lze bezplatně nasměrovat opětovným použitím schopnosti brnění Síla mnoha.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Váš spojenec se chystá zaútočit!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Váš spojenec se přesune na tuto pozici.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Tvůj spojenec se pohne, aby tě následoval.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Tuto postavu najdete se specifickou schopností hrdinského brnění.
actors.hero.abilities.cleric.powerofmany$lightally.name=lehký spojenec
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Tento spojenec byl posílen Mocí mnoha, která mu poskytuje +25%% způsobené poškození a -25%% přijaté poškození. Také bude sdílet svůj dosah vidění s klerikem a může těžit ze síly mnoha kouzel.\n\nMoc mnoha přetrvává, i když se spojenci, jako například hranolové obrazy, schovají, ale její trvání se bude stále odpočítávat.\n\nZbývající tahy: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=síla mnohých
actors.hero.abilities.cleric.powerofmany.ally_exists=Už máš mocného spojence.
actors.hero.abilities.cleric.powerofmany.desc=Klerik využívá _Sílu mnoha_, která buď posílí stávajícího spojence, nebo vytvoří nového posíleného na 100 kol. Zaměřením na prázdné pole vytvoří nového spojence.\n\nKdyž je spojenec posílen Sílou mnoha, způsobuje +25% poškození, užívá -25% poškození a sdílí s klerikem svou vizi. Při použití této schopnosti také získá 25 bodů štítu.\n\nKlerik také získá tři nová kouzla, která lze seslat pouze se posíleným spojencem. Síla mnoha neskončí, dokud je jedno z těchto kouzel aktivní.
actors.hero.abilities.cleric.powerofmany.name=síla mnohých
actors.hero.abilities.cleric.powerofmany.no_vision=Nemůžete cílit na místo, které nevidíte.
actors.hero.abilities.cleric.powerofmany.only_allies=Spojence můžete jen posilovat.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Nasměruj svého světelného spojence
actors.hero.abilities.cleric.powerofmany.prompt_default=Vyberte si spojence nebo místo
actors.hero.abilities.cleric.powerofmany.short_desc=Kněz využívá _Sílu mnoha_, posiluje stávajícího spojence nebo vytváří nového.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Přiřadit k tvaru těla
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Přiřadit k formě mysli
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Přiřadit k duchovní formě
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Vyberte efekt, který chcete vložit do Trinity. Před potvrzením se zobrazí další informace.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Tvar těla: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Tvar mysli: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Duchovní podoba: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Vyberte si, kterou formu Trojice chcete použít. Účinky různých forem mohou být aktivní současně.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity použije efekt vzdálené alchymie tohoto artefaktu za cenu _%2$s náboje._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity aplikuje pasivní regeneraci zdraví tohoto artefaktu na _+%1$d_ po dobu 20 kol za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.cost=Cena nabití této schopnosti se liší, ale nejčastěji je _%d._
actors.hero.abilities.cleric.trinity.desc=Klerik získává _Trojici_ schopností brnění, které lze přiřadit různým efektům předmětů pomocí tří nových kouzel. Každé z těchto kouzel se zaměřuje na emulaci efektů různých druhů vybavení, které Klerik během tohoto běhu identifikoval: tělesná forma (zbraně a brnění), duševní forma (hůlky a vrhací zbraně) a duchovní forma (prsteny a artefakty).\n\nKaždá forma Trojice může být naplněna pouze jedním efektem a Klerik si při použití Trojice vybere, který z nich aktivuje. Trojice nekopíruje efekt něčeho, co již máte vybaveno.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity použije efekt tohoto artefaktu k vyvolání zkaženého spřáteleného přízraku s HP ducha _+%1$d_, za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity aplikuje tento efekt na tahy _%1$d_ za cenu _%2$s náboje._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity aplikuje efekt sesílání řetězce tohoto artefaktu s dosahem _+%1$d_, za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity použije efekt svačiny z tohoto artefaktu za cenu _%2$s náboje._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity aplikuje efekt okrádání nepřátel tímto artefaktem na _+%1$d_, za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.name=Trojice
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity nemůže duplikovat efekt, který už máte vybavený!
actors.hero.abilities.cleric.trinity.no_imbue=Trojice momentálně nemá nastavený žádný efekt pro žádnou ze svých forem, použijte jedno z jejích kouzel!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity aplikuje tento _silný_ efekt na tahy _%1$d_ za cenu _%2$s náboje._
actors.hero.abilities.cleric.trinity.ring_use=Trinity aplikuje efekt tohoto prstenu na _+%1$d_ po dobu 20 kol, za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity použije efekt kořene tohoto artefaktu s náhodným škodlivým semínkem za cenu _%2$s náboje._
actors.hero.abilities.cleric.trinity.short_desc=Kněz získává _Trojici_ schopností, které napodobují vybavení, které viděl, a lze je přiřadit pomocí nových kouzel.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity aplikuje efekt vložení tohoto artefaktu za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity aplikuje efekt věštění tohoto artefaktu na _+%1$d_, za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity hodí tuto zbraň na _+%1$d_ za cenu _%2$s nabití._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity aplikuje efekt zmrazení času tohoto artefaktu s dobou trvání kola _%1$d_ za cenu náboje _%2$s._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity použije efekt náhodného rolování tohoto artefaktu s šancí _%1$d/10_ nabídnout exotickou verzi bez dalších nákladů, za cenu _%2$s poplatku._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity zabije tuto _multi-charge_ hůlku v _+%1$d_ za cenu _%2$s náboje._
actors.hero.abilities.cleric.trinity.wand_use=Trinity tuto hůlku zabije na _+%1$d_ za cenu _%2$s náboje._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Tato postava se účastní souboje. Ona a všichni její spojenci nebo minioni se mohou chovat normálně, zatímco ostatní jsou zmrazeni.\n\nSouboj bude trvat po stanovenou dobu, dokud jeden z účastníků nezemře, nebo dokud se účastníci od sebe nepohnou o více než 5 políček.\n\nZbývající tahy: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=účastník duelu
actors.hero.abilities.duelist.challenge.ally_target=Můžete vyzvat pouze nepřátele.
actors.hero.abilities.duelist.challenge.already_dueling=Můžete být vždy pouze v jednom souboji.
actors.hero.abilities.duelist.challenge.desc=Duelista vyzve blízkého nepřítele k souboji. Tento nepřítel je nucen s ním bojovat, zatímco všichni ostatní nepřátelé jsou dočasně zmrazeni v čase.\n\nCíl musí být dosažitelný a do 5 políček od Duelanta. Souboj trvá, dokud neuplyne 10 tahů, nepřítel nezemře nebo dokud Duelista není od nepřítele vzdálen více než 5 políček.\n\nZmrazení nepřátelé jsou nezranitelní. Spojenci Duelanta nejsou touto schopností zmrazeni, ale pokud je cílem boss, nebudou zmrazeni ani jeho minioni.
actors.hero.abilities.duelist.challenge.distant_target=Ten nepřítel je příliš daleko na to, aby se mu dalo čelit.
actors.hero.abilities.duelist.challenge.name=výzva
actors.hero.abilities.duelist.challenge.prompt=Vyberte si nepřítele, kterého chcete vyzvat
actors.hero.abilities.duelist.challenge.short_desc=Duelant _Vyzve_ blízkého nepřítele k souboji a dočasně zmrazí všechny ostatní nepřátele.
actors.hero.abilities.duelist.challenge.unreachable_target=Musíte být schopni dosáhnout svého cíle.
actors.hero.abilities.duelist.elementalstrike.desc=Duelista zasáhne nepřítele nebo místo a provede běžný útok, který zaručeně zasáhne nepřítele a rozšíří magický efekt, který se šíří až o 4 políčka v kuželu o úhlu 65 stupňů. Tento magický efekt se liší v závislosti na očarování primární zbraně duelisty.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Elementární úder bez očarování uvolní malý výbuch magie, který všem nepřátelům v dosahu způsobí 6-12 bodů poškození.
actors.hero.abilities.duelist.elementalstrike.name=elementární úder
actors.hero.abilities.duelist.elementalstrike.short_desc=Duelistka provede _Elementální úder_, který rozprostře efekt v kuželovité oblasti záběru na základě jejího očarování zbraně.
actors.hero.abilities.duelist.feint.bad_location=Na to místo se nemůžete přestěhovat.
actors.hero.abilities.duelist.feint.desc=Duelant předstírá útok, zatímco běží k sousednímu políčku, a zanechává po sobě chvilkový obraz sebe sama. Nepřátelé, kteří útočili na duelanta, zaútočí místo něj na jeho obraz. \n\nNepřátelé, kteří útočí na obraz, jsou zmatení, což ruší jejich další akci a vystavuje je překvapivému útoku.
actors.hero.abilities.duelist.feint.name=finta
actors.hero.abilities.duelist.feint.prompt=Vyberte si místo, kam se chcete vrhnout
actors.hero.abilities.duelist.feint.short_desc=Duelistka _Fintings_ předstírá útok, zatímco spěchá k sousednímu políčku. Nepřátelé zaútočí na její dozvuk, čímž se vyhnou protiútoku.
actors.hero.abilities.duelist.feint.too_far=Toto místo s vámi nesousedí.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=Lovkyně je krátce posílena, což zvyšuje její rychlost pohybu a útoku lukem. \n\nZbývající tahy: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=síla přírody
actors.hero.abilities.huntress.naturespower.desc=Lovkyně dočasně posílí sebe a svůj luk silou přírody! Toto trvá 8 kol.\n\nBěhem této doby se Lovkyně pohybuje 2x rychleji a útočí svým lukem o 33 % rychleji. Bonusové efekty luku se neaktivují, pokud odstřelovač používá své speciální útoky.
actors.hero.abilities.huntress.naturespower.name=síla přírody
actors.hero.abilities.huntress.naturespower.short_desc=Lovkyně vzývá _Sílu přírody_, která na krátkou dobu zvyšuje rychlost jejího pohybu a kadenci jejího luku.
actors.hero.abilities.huntress.spectralblades.desc=Lovkyně vrhne na nepřítele spektrální čepel, která funguje jako úder na dálku z její zbraně na blízko. Aktivují se všechny běžné účinky zbraně na blízko, včetně kouzel.
actors.hero.abilities.huntress.spectralblades.name=spektrální čepele
actors.hero.abilities.huntress.spectralblades.short_desc=Lovkyně vrhá na cíl _Spektrální čepele_, které mu způsobují poškození v závislosti na aktuálně použité zbrani pro boj zblízka.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Magický jestřáb, přivolaný Lovkyní. Září jasně étericky modře a jeho hlava se neustále otáčí, zatímco prohlíží okolí.\n\nI když to není žádný bojovník, jeho rychlost a zrak ho předurčují k vynikajícímu průzkumu a odvádění pozornosti nepřátel.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Zaručeně zbývající úhybné manévry: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Zbývající tahy: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Tvůj jestřáb se chystá zaútočit!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Váš jestřáb se přesune do této pozice.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Tvůj jestřáb se pohne, aby tě následoval.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Tuto postavu najdete se specifickou schopností hrdinského brnění.
actors.hero.abilities.huntress.spirithawk$hawkally.name=duch jestřába
actors.hero.abilities.huntress.spirithawk.desc=Lovkyně přivolává duchovního jestřába, kterého lze nasměrovat opětovným použitím schopnosti během jeho vyvolání. Jestřáb trvá 100 kol, jeho nasměrování nestojí žádné poplatky. \n\nJestřáb má minimální zdraví a útočnou sílu, ale je rychlý, úhybný a přesný. S Lovkyní neustále sdílí celé své zorné pole. Je imunní vůči všem plošným efektům, jako je oheň a jedovatý plyn. Neútočí, pokud k tomu nedostane výslovný pokyn.
actors.hero.abilities.huntress.spirithawk.name=duch jestřába
actors.hero.abilities.huntress.spirithawk.no_space=Ve vašem okolí není žádné volné místo.
actors.hero.abilities.huntress.spirithawk.short_desc=Lovkyně přivolává _Spirit Hawka_, který jí může pomoci s průzkumem lokací a odvedením pozornosti nepřátel.
actors.hero.abilities.mage.elementalblast.desc=Mág vyšle magický výbuch, který pokryje kruhovou oblast až do vzdálenosti 4 políček a způsobí mu 15–25 bodů poškození. Konkrétní účinek elementárního výbuchu se bude lišit v závislosti na hůlce, kterou mág používá.
actors.hero.abilities.mage.elementalblast.generic_desc=Účinek elementárního výbuchu bude podobný účinku hůlky, když je zasažena nepřítelem nebo spojencem.
actors.hero.abilities.mage.elementalblast.name=elementární výbuch
actors.hero.abilities.mage.elementalblast.no_staff=Tuto schopnost nemůžete použít bez svého personálu.
actors.hero.abilities.mage.elementalblast.short_desc=Mág vyšle ze své hole _Životodárný výbuch_, který pokryje velkou oblast kolem sebe a jeho efekt se liší v závislosti na hůlce v jeho holi.
actors.hero.abilities.mage.warpbeacon.depths=Mezi hloubkami se nemůžeš deformovat!
actors.hero.abilities.mage.warpbeacon.desc=Mág umístí maják, který lze poté libovolně přeměnit. Umístění majáku trvá 1 kolo, ale přeměna na něj je okamžitá. \n\n Mág se standardně nemůže přepínat mezi patry ani použít maják k dosažení nepřístupných míst, jako jsou zamčené místnosti. Mág se může teleportovat do nepřátel, což je odtlačí stranou.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Tam maják umístit nemůžeš!
actors.hero.abilities.mage.warpbeacon.locked_floor=Nemůžete opustit zamčené patro!
actors.hero.abilities.mage.warpbeacon.name=warpový maják
actors.hero.abilities.mage.warpbeacon.short_desc=Mág umístí na své aktuální místo _Deformující maják_, kam se může okamžitě teleportovat zpět.
actors.hero.abilities.mage.warpbeacon.too_far=To místo je moc daleko!
actors.hero.abilities.mage.warpbeacon.window_cancel=zrušit
actors.hero.abilities.mage.warpbeacon.window_clear=jasný maják
actors.hero.abilities.mage.warpbeacon.window_desc=Váš maják je aktuálně umístěn na podlaze %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teleportovat se k majáku
actors.hero.abilities.mage.wildmagic.desc=Mág uvolní sílu svých hůlek a náhodně je vystřelí až 4krát během jednoho tahu. Mágova hůl není do tohoto efektu zahrnuta.\n\nKaždá hůlka má také zvýšenou úroveň o 2, až do +3. Tato schopnost spotřebuje polovinu náboje hůlky na každý zásah a žádnou hůlku nelze vystřelit více než 2krát.
actors.hero.abilities.mage.wildmagic.name=divoká magie
actors.hero.abilities.mage.wildmagic.no_wands=Nemáš žádné hůlky, kterými bys mohl útočit!
actors.hero.abilities.mage.wildmagic.short_desc=Mág uvolní _Divokou magii_ obsaženou ve svých hůlkách a během jednoho tahu je několikrát náhodně vystřelí na vybraný cíl.
actors.hero.abilities.ratmogrify$transmograt.desc=Tento nepřítel se proměnil v krysu. Podle mě velké vylepšení! - Král krys
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrified %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Zabit: nepřítelem zmítaným krysou
actors.hero.abilities.ratmogrify.cant_transform=To se nedá krysografizovat!
actors.hero.abilities.ratmogrify.desc=Hrdina promění nepřítele v krysu na 6 kol! Bossové, spojenci a krysy nemohou být krysomorfizováni.\n\nKrysomorfizovaní nepřátelé si zachovávají své původní statistiky, ale nemají žádné schopnosti.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=Hrdina _Krysaří_ nepřítele! Tím se dočasně promění v krysu bez schopností.
actors.hero.abilities.ratmogrify.too_strong=Ten nepřítel je příliš silný na to, aby se dal krysografizovat!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Tento nepřítel byl označen, což mu způsobilo bonusové poškození 25%%, ale také mu znemožnilo zemřít, dokud označení neskončí.\n\nZbývající tahy: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=označen k smrti
actors.hero.abilities.rogue.deathmark.ally_target=Označit si můžete pouze nepřátele
actors.hero.abilities.rogue.deathmark.desc=Zloděj umístí na vybraného nepřítele značku, která mu způsobí o 25 % větší poškození. Značka se aplikuje okamžitě a trvá 5 kol.\n\nOznačení nepřátelé dostávají bonusové poškození, ale nemohou zemřít, dokud značka nevyprší. Pokud má nepřítel v době, kdy značka skončí, 0 HP, okamžitě zemře.
actors.hero.abilities.rogue.deathmark.name=znamení smrti
actors.hero.abilities.rogue.deathmark.short_desc=Zloděj umístí na vybraného nepřítele _Znamení smrti_. Označení nepřátelé utrpí bonusové poškození, ale nemohou zemřít, dokud znamení neskončí.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Kopie Zloděje, stvořená z temnoty. Stojí nehybně, s prázdnýma očima a malými obláčky tmy stoupajícími z něj jako pára.\n\nKlon není dokonalou kopií Zloděje, ale stále je to slušný bojovník a s vhodnými talenty může těžit z vybavení Zloděje.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Tvůj klon se chystá zaútočit!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Váš klon se přesune na tuto pozici.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Tvůj klon se pohne, aby tě následoval.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Tuto postavu najdete se specifickou schopností hrdinského brnění.
actors.hero.abilities.rogue.shadowclone$shadowally.name=stínový darebák
actors.hero.abilities.rogue.shadowclone.desc=Zloděj vyvolává svou stínovou napodobeninu, kterou lze nasměrovat, aby mu pomohla v boji. Nasměrování stínového klona je zdarma. \n\nKlon má 80 HP, žádné brnění a způsobuje 10-20 poškození. Všechny tyto vlastnosti lze vylepšit pomocí talentů, takže klon může těžit ze zbraní a brnění, které hrdina má.
actors.hero.abilities.rogue.shadowclone.name=stínový klon
actors.hero.abilities.rogue.shadowclone.short_desc=Zloděj přivolá _Stínového klona_, kterého lze nasměrovat na pomoc v boji.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Nepřátelé se nějakým způsobem snadno přesvědčí, že tato dřevěná návnada je ten pravý Zloděj!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Tuto postavu najdete se specifickou schopností hrdinského brnění.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=dřevěná návnada
actors.hero.abilities.rogue.smokebomb.desc=Zloděj hodí dýmovnici a mrkne až do vzdálenosti 6 políček. Dokáže mrknout skrz nebezpečí a nepřátele, ale ne skrz pevný terén, jako jsou zdi. \n\nNepřátelé, kteří sousedí s původní pozicí Zloděje, budou na 5 kol oslepeni.
actors.hero.abilities.rogue.smokebomb.fov=Skočit můžete pouze na prázdné místo ve vašem zorném poli.
actors.hero.abilities.rogue.smokebomb.name=dýmovnice
actors.hero.abilities.rogue.smokebomb.prompt=Vyberte místo, kam chcete přeskočit
actors.hero.abilities.rogue.smokebomb.short_desc=Zloděj mrká a hodí _dýmovnici_. Oslepí nepřátele poblíž své původní lokace.
actors.hero.abilities.warrior.endure$enduretracker.desc=Válečník nyní způsobuje bonusové poškození na základě utrpěného poškození. \n\nBonusové poškození: %1$d\nZbývající zásahy: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=vytrvalost
actors.hero.abilities.warrior.endure.desc=Válečník vydrží 3 kola a utrpí poloviční poškození ze všech zdrojů. Toto snížení se uplatní před účinky odolávající poškození, jako je brnění.\n\nPo vydržení získává válečníkův další zásah do 10 kol bonusové poškození. Toto bonusové poškození se rovná polovině veškerého poškození, které mu bylo způsobeno během vydržení, před účinky snížení poškození!\n\nPokud má válečník nějaké kombo, použití této schopnosti prodlouží jeho zbývající čas o 3 kola.
actors.hero.abilities.warrior.endure.name=vydržet
actors.hero.abilities.warrior.endure.short_desc=Válečník _Vytrvá_, přeskočí několik kol, ale získá vysokou odolnost vůči poškození. Poté způsobí bonusové poškození na základě toho, co vydržel.
actors.hero.abilities.warrior.heroicleap.desc=Válečník skáče k cílovému místu a překonává všechny nepřátele nebo překážky v cestě. Nemůže však přeskakovat zdi ani jiný pevný terén.
actors.hero.abilities.warrior.heroicleap.name=hrdinský skok
actors.hero.abilities.warrior.heroicleap.prompt=Vyberte směr skoku
actors.hero.abilities.warrior.heroicleap.short_desc=Válečník provede _hrdinský skok_ směrem k cílovému místu a přeletí nepřátele a nebezpečí.
actors.hero.abilities.warrior.shockwave.desc=Válečník udeří do země a vytvoří rázovou vlnu, která se šíří až 5 políček v kuželu o úhlu 60 stupňů.\n\nNepřátelé zasažení touto rázovou vlnou jsou na 5 kol zmrzačeni. Také utrpí 5–10 bodů poškození a navíc 1–2 body poškození za každý bod síly, který má Válečník nad 10.
actors.hero.abilities.warrior.shockwave.name=rázová vlna
actors.hero.abilities.warrior.shockwave.short_desc=Válečník vypustí _Rázovou vlnu_ v kuželovitém rozsahu dopadu (AOE) nárazem do země. Nepřátelé zasažení rázovou vlnou jsou poškozeni a zmrzačeni.
actors.hero.hero.key_distracted=Zámek ti úplně nejde otevřít, budeš to muset zkoušet pořád.
actors.hero.hero.leave=Ještě nemůžeš odejít, zbytek podzemí čeká dole!
actors.hero.hero.level_cap=Nemůžeš zesílit, ale tvé zkušenosti ti dodají nával síly!
actors.hero.hero.level_up=Vyšší úroveň!
actors.hero.hero.locked_chest=Tato truhla je zamčená a nemáš k ní odpovídající klíč.
actors.hero.hero.locked_door=Nemáte odpovídající klíč.
actors.hero.hero.name=Vy
actors.hero.hero.new_level=Zvyšování úrovně! +Přesnost, +Úhybnost, +5 HP!
actors.hero.hero.new_talent=+1 bod talentu!
actors.hero.hero.noticed_smth=Všiml sis něčeho.
actors.hero.hero.pain_resist=Bolest vám pomáhá odolat nutkání spát.
actors.hero.hero.revive=Ankh exploduje životodárnou energií!
actors.hero.hero.search=vyhledávání
actors.hero.hero.search_distracted=Je těžké se soustředit, hledání je vyčerpávající.
actors.hero.hero.unspent=Máš nevyužité body talentu!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Nemůžeš nosit: %s.
actors.hero.hero.you_now_have=Zvedl jsi: %s.
actors.hero.heroclass.cleric=duchovní
actors.hero.heroclass.cleric_desc=Klerik začíná s _jedinečnou svatou knihou_, kterou může použít k sesílání různých kouzel.\n\nVětšina talentů klerika se zaměřuje na učení nebo vylepšování kouzel.\n\nKlerik také začíná s _kyjem_, látkovým brněním, měchem na vodu a sametovým váčkem.\n\nKlerik automaticky identifikuje:\n_-_ Svitky identifikace\n_-_ Lektvary čistoty\n_-_ Svitky odstranění kletby
actors.hero.heroclass.cleric_desc_short=Klerik je božský kouzelník, který používá svůj jedinečný _svatý svazek_ k vysílání božské magie. Může se _učit a vylepšovat kouzla_ pomocí talentů.
actors.hero.heroclass.cleric_unlock=Abyste odemkli Klérika, _úplně zbavte kletby jakýkoli kus prokletého vybavení._
actors.hero.heroclass.duelist=duelant
actors.hero.heroclass.duelist_desc=Duelista začíná s _unikátním rapírem_ se speciální schopností, která se časem dobíjí.\n\nKaždá zbraň ve hře má _jinou speciální schopnost_, kterou může Duelista použít.\n\nDuelista také začíná se _dvěma vrhacími hroty_, látkovým brněním, měchem na vodu a sametovým váčkem.\n\nDuelista automaticky identifikuje:\n_-_ Svitky identifikace\n_-_ Lektvary síly\n_-_ Svitky zrcadlového obrazu
actors.hero.heroclass.duelist_desc_short=Duelistka je mistr zbraní, který může použít svou zbraň ke spuštění _speciální schopnosti zbraně._ Tato speciální schopnost je _pro každou zbraň jiná._
actors.hero.heroclass.duelist_unlock=Pro odemčení Duelisty _vybavte se zbraní 2. úrovně nebo vyšší bez postihu za sílu._
actors.hero.heroclass.huntress=lovkyně
actors.hero.heroclass.huntress_desc=Lovkyně začíná s _jedinečným duchovním lukem_, který dokáže vystřelit nekonečný počet vyčarovaných šípů.\n\nLovkyně se dokáže pohybovat vysokou trávou, _aniž by ji pošlapala_.\n\nLovkyně také začíná s _rukavicemi s cvočky_, látkovým brněním, měchem na vodu a sametovým váčkem.\n\nLovkyně se automaticky identifikuje:\n_-_ Svitky identifikace\n_-_ Lektvary mysli a vidění\n_-_ Svitky ukolébavky
actors.hero.heroclass.huntress_desc_short=Lovkyně je mistryní vrhacích zbraní a má _magický luk_ s nekonečným počtem šípů. Také se pohybuje vysokou trávou, _aniž by ji pošlapala._
actors.hero.heroclass.huntress_unlock=Abyste odemkli Lovkyni, _zasáhněte nepřátele vrhacími zbraněmi 10krát v jedné hře._
actors.hero.heroclass.mage=kouzelník
actors.hero.heroclass.mage_desc=Mág začíná s _jedinečnou holí_, která se dobíjí výrazně rychleji než hůlka a má o 1 náboj více. Hůl _lze nabít jakoukoli hůlkou_, kterou mág v podzemí najde.\n\n Mág také začíná s _hůlkou magické střely_ nabitou jeho holí, látkovým brněním, měchem na vodu a sametovým váčkem.\n\n Mág automaticky identifikuje:\n_-_ Svitky identifikace\n_-_ Lektvary tekutého plamene\n_-_ Svitky vylepšení
actors.hero.heroclass.mage_desc_short=Mág je expert na tajemství a nosí _magickou hůl_, která je silnější než hůlka. Hůl lze _naplnit jakoukoli hůlkou_, kterou mág najde.
actors.hero.heroclass.mage_unlock=Chcete-li odemknout Mága, _použijte svitek vylepšení, abyste zesílili předmět._
actors.hero.heroclass.rogue=darebák
actors.hero.heroclass.rogue_desc=Zloděj začíná s _jedinečným Pláštěm stínů_, kterým se může dle libosti stát neviditelným.\n\nZloděj dokáže _odhalit tajemství a pasti_ z větší vzdálenosti.\n\nZloděj také začíná s _dýkou_, _třemi vrhacími noži_, látkovým brněním, měchem na vodu a sametovým váčkem.\n\nZloděj automaticky identifikuje:\n_-_ Svitky identifikace\n_-_ Lektvary neviditelnosti\n_-_ Svitky magického mapování
actors.hero.heroclass.rogue_desc_short=Zloděj se dokáže vyhýbat nepřátelům a útočit z neviditelnosti pomocí svého _pláště stínů_. Také _odhaluje tajemství a pasti_ z větší vzdálenosti.
actors.hero.heroclass.rogue_unlock=Abyste odemkli Zloděje, _provedte 10 překvapivých útoků v jedné hře._
actors.hero.heroclass.warrior=bojovník
actors.hero.heroclass.warrior_desc=Válečník začíná s _jedinečnou rozbitou pečetí_, která mu poskytuje dávku štítu, když má méně než polovinu zdraví. Pečeť lze přesouvat mezi zbrojemi a lze s ní _přenést jedno vylepšení_.\n\nVálečník také začíná s _opotřebovaným krátkým mečem_, _třemi vrhacími kameny_, látkovou zbrojí, měchem na vodu a sametovým váčkem.\n\nVálečník se automaticky identifikuje:\n_-_ Svitky identifikace\n_-_ Lektvary léčení\n_-_ Svitky hněvu
actors.hero.heroclass.warrior_desc_short=Válečník utrpí dodatečné poškození díky štítu, který mu poskytuje jeho _zlomená pečeť_. Pečeť lze přesouvat mezi zbrojemi a _přenáší jedno vylepšení._
actors.hero.heroclass.warrior_unlock=Válečník se odemkne automaticky.
actors.hero.herosubclass.assassin=vrah
actors.hero.herosubclass.assassin_desc=Assassin se připravuje na svůj další útok, když se stane neviditelným. Čím déle se připravuje, tím silnější bude jeho další útok. Příprava trvá až 9 kol. \n\nPo přípravě Assassin způsobí bonusové poškození při svém dalším útoku, může mrknout na svůj cíl a dokonce může okamžitě zabít nepřátele, kteří jsou dostatečně slabí.
actors.hero.herosubclass.assassin_short_desc=_Assassin_ si může připravit smrtící úder, i když je neviditelný. Čím déle čeká, tím silnější útok bude.
actors.hero.herosubclass.battlemage=bojový mág
actors.hero.herosubclass.battlemage_desc=Bojový mág získá bonusový efekt, kdykoli udeří v boji zblízka svou holí, jako by jeho hůl měla další kouzlo. Tyto efekty závisí na hůlce, kterou je jeho hůl naplněna, každá hůl má svůj vlastní efekt. Kromě efektů hůlky získá bojový mág svou hůl také 0,5 nabití, když s ní udeří.
actors.hero.herosubclass.battlemage_short_desc=_Bojovník_ vyvolává bonusové efekty při boji zblízka se svou holí. Tyto efekty závisí na hůlce, kterou je jeho hůl vybavena.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=Berserker získává zuřivost s tím, jak dostává fyzické poškození, včetně poškození blokovaného jeho brněním! Zuřivost postupně slábne, ale pomaleji, pokud má málo HP.\n\nZuřivost může způsobit, že Berserker způsobí až +50% poškození. Při maximálním vzteku se může zbláznit, získat dávku štítu a udržet si zuřivost, dokud mu zbývá štít. Štít se škáluje s úrovní berserkerova brnění a lze jej výrazně posílit, pokud má málo zdraví. Berserker potřebuje po zběsilosti čas na zotavení.
actors.hero.herosubclass.berserker_short_desc=_Berserker_ navyšuje vztek s tím, jak dostává poškození. Vztek zvyšuje jeho poškození a lze jej aktivovat na 100 % pro bonusové štíty.
actors.hero.herosubclass.champion=mistr
actors.hero.herosubclass.champion_desc=Šampionka je mistryní zbraní pro boj zblízka a kromě své primární zbraně si může vybavit i sekundární zbraň. Její běžné útoky používají její primární zbraň, ale může ji okamžitě vyměnit a použít schopnost kterékoli z těchto zbraní. \n\nTaké získá 2 další maximální náboje schopnosti zbraně a +50% rychlost dobíjení schopnosti zbraně.
actors.hero.herosubclass.champion_short_desc=_Šampionka_ může ovládat dvě zbraně a získává více nabití zbraní. Její běžné útoky používají její primární zbraň, ale může si zbraně vyměnit a použít schopnost kterékoli z nich.
actors.hero.herosubclass.freerunner=freerunner
actors.hero.herosubclass.freerunner_desc=Jak se Freerunner pohybuje, zvyšuje jeho hybnost. Po 10 kolech běhu může získat až 10 bodů hybnosti, ale pokud se přestane pohybovat, rychle ji ztratí. Freerunner může využít svou hybnost k zahájení freerunningu, a to 2 kola za každý bod hybnosti. \n\nPři freerunningu se Freerunner pohybuje 2x rychleji a získává bonus k úhybným manévrům úměrný své úrovni. Jakmile freerunning skončí, následuje doba na obnovení hybnosti.
actors.hero.herosubclass.freerunner_short_desc=_Freerunner_ během běhu nabírá na síle, kterou lze využít k zahájení freerunningu. To mu na krátkou dobu poskytuje bonus k rychlosti a úhybným manévrům.
actors.hero.herosubclass.gladiator=gladiátor
actors.hero.herosubclass.gladiator_desc=Gladiátor si vybuduje jeden bod komba pokaždé, když provede úspěšný útok zbraní na blízko nebo vrhací zbraní. Pokud Gladiátor neprovede úspěšný útok do 5 kol (15 kol po zabití), jeho kombo se resetuje.\n\nA Jakmile si vybuduje kombo, může Gladiátor použít řadu schopností, které zaručeně zasáhnou:\n2 Kombo: odhodí nepřítele zpět, zachová kombo\n4 Kombo: způsobí poškození na základě brnění\n6 Kombo: odrazí útok, zachová kombo\n8 Kombo: poškodí cíl a blízké nepřátele\n10 Kombo: zaútočí jednou za každé kombo
actors.hero.herosubclass.gladiator_short_desc=_Gladiátor_ si vytváří kombo, když provede úspěšné útoky. Může utratit kombo k využití unikátních schopností.
actors.hero.herosubclass.monk=mnich
actors.hero.herosubclass.monk_desc=Mnich je mistrem fyzických technik. Když poráží nepřátele, získává energii, kterou lze využít k různým obranným a užitečným schopnostem. Tato energie časem neslábne, ale má limit odvozený od úrovně Mnicha.\n\n1 Energie: rychlé údery pěstmi\n2 Energie: soustředění pro uhýbání dalšímu útoku\n3 Energie: okamžitý úprk v blízkosti\n4 Energie: odkopnutí nepřítele\n5 Energie: meditace pro vyčištění statusů a obnovení nabití hůlky a artefaktu
actors.hero.herosubclass.monk_short_desc=_Mnich_ si během boje hromadí energii. Tuto energii lze využít k různým unikátním schopnostem.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_desc=Paladin získává řadu nových a vylepšených kouzel, která kladou důraz na boj zblízka a synergii se zbraněmi a brněním.\n\nPaladinova kouzla _Svatá zbraň_ a _Svatá ochrana_ poskytují větší bonusy, již nepřepisují stávající kouzla a symboly a lze je rozšířit sesláním dalších kouzel.\n\nPaladin také získává kouzlo _Úder_, které mu umožňuje provést zaručený zásah zblízka s bonusovým poškozením a silou kouzla.
actors.hero.herosubclass.paladin_short_desc=_Paladin_ získává nová kouzla krátkého dosahu a posílené verze svaté zbraně a ochrany.
actors.hero.herosubclass.priest=kněz
actors.hero.herosubclass.priest_desc=Kněz získává řadu nových a vylepšených kouzel, která kladou důraz na boj na dálku a synergii s magickými předměty.\n\nKněz může jednou za 50 kol zdarma seslat _Vodící světlo_, osvětlovat nepřátele přímo zaměřené kterýmkoli z jeho kouzel a může konzumovat debuff osvětlení se spojenci, hůlkami a některými artefakty za bonusové poškození rovnající se jejich úrovni + 5.\n\nKněz také získává kouzlo _Záře_, které rozptyluje temnotu a ovlivňuje všechny viditelné nepřátele, spouští a aplikuje osvětlení a krátce je omráčí za cenu 2 nabití.
actors.hero.herosubclass.priest_short_desc=_Kněz_ získává nová kouzla s dlouhým dosahem a posílenou verzi vodicího světla.
actors.hero.herosubclass.sniper=odstřelovač
actors.hero.herosubclass.sniper_desc=Odstřelovač je mistr boje na dálku, jehož útoky na dálku prorážejí nepřátelské brnění. Když zaútočí na nepřítele vrhací zbraní, umístí na něj odstřelovací značku, která jí umožní následovat speciálním útokem z luku. Tento speciální útok se liší v závislosti na tom, jak je její luk vylepšen.\n\nNevylepšený luk vystřelí snapshot, který způsobí snížené poškození, ale vystřelí okamžitě. Rychlý luk vystřelí salvu tří šípů, které způsobí snížené poškození, stále může aktivovat kouzla a vystřelí za 1 kolo. Poškozující luk vystřelí odstřelovací ránu, která zaručeně zasáhne, způsobí bonusové poškození v závislosti na vzdálenosti a vystřelí za 2 kola.
actors.hero.herosubclass.sniper_short_desc=_Odstřelovačka_ dokáže prorazit brnění svými útoky na dálku. Po zásahu vrhací zbraní může následovat speciální útok z luku.
actors.hero.herosubclass.warden=správce
actors.hero.herosubclass.warden_desc=Strážkyně má silné spojení s přírodou, což jí poskytuje řadu bonusových efektů týkajících se trávy a rostlin. Dokáže vidět skrz vysokou a zvrásněnou trávu, jako by to byl prázdný prostor. \n\nStrážkyně způsobí, že kolem jakéhokoli semínka, které hodí nebo zasadí, vyraší tráva, a získá speciální efekty při pošlapávání rostlin. Tyto speciální efekty nahrazují běžné efekty rostlin, což znamená, že pro ni není škodlivé šlápnout na žádnou rostlinu.
actors.hero.herosubclass.warden_short_desc=_Strážkyně_ vidí skrz vysokou trávu a získává bonusové efekty, když sází semena a pošlapává rostliny.
actors.hero.herosubclass.warlock=čaroděj
actors.hero.herosubclass.warlock_desc=Čaroděj má šanci udělit postavám znamení duše, když na ně použije hůlky. Šance na použití znamení duše a jeho trvání se zvyšují s úrovní hůlky.\n\nKdyž je nepřítel označen duší, Čaroděj se vyléčí o 2 zdraví za každých 5 bodů poškození, které mu způsobí, ale pouze útoky ze zbraní pro boj zblízka nebo vrhacími zbraněmi, nikoli z hůlek!
actors.hero.herosubclass.warlock_short_desc=_Čaroděj_ má šanci označit nepřátele svými hůlkami do duše. Uzdraví se, kdykoli způsobí fyzické poškození označeným nepřátelům.
actors.hero.spells.auraofprotection$aurabuff.desc=Paladin kolem sebe vyzařuje ochrannou energii.\n\nJakýkoli blízký spojenec (včetně samotného Paladina) utrpí snížené poškození a získá efekt Paladinova symbolu brnění se zvýšenou silou.\n\nZbývající tahy: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura ochrany
actors.hero.spells.auraofprotection.desc=Paladin začne po dobu 20 kol vyzařovat ochrannou energii v jiskřivé auře kolem sebe. Každý spojenec do 2 políček od Paladina (včetně jeho samotného) utrpí %1$d%% menší poškození a získá efekt Paladinova glyfu brnění s hodnotou +%2$d%% síly.\n\nK tomuto snížení poškození dojde před dalšími efekty snižujícími poškození (např. brněním). Zvýšení síly glyfu se bude vždy uplatňovat, ale toto kouzlo nemůže způsobit, že se Paladinův glyf použije více než jednou, pokud z něj postava již těží (např. samotný Paladin nebo hranolový obraz).
actors.hero.spells.auraofprotection.name=aura ochrany
actors.hero.spells.auraofprotection.short_desc=Zvyšuje obranu Paladina a blízkých spojenců.
actors.hero.spells.beamingray$beamingrayboost.desc=Tento spojenec byl nedávno teleportován Zářícím paprskem, což mu po teleportaci poskytlo bonusové poškození proti nejbližšímu nepříteli. Síla mnoha také nevyprší, pokud je tento buff aktivní. \n\nZbývající tahy: %s.
actors.hero.spells.beamingray$beamingrayboost.name=paprsek
actors.hero.spells.beamingray.desc=Kněz směruje sílu svého spojence do paprsku světla, který ho přenese na určité místo. Pokud se paprsek srazí s nepřítelem, umístí spojence poblíž a nasměruje ho na nepřítele.\n\nPaprsek má maximální dosah %1$d políček a zvýší bonusové poškození Síly mnoha na +%2$d%% po dobu 10 kol proti nejbližšímu nepříteli do 4 políček. Paprsek může teleportovat i normálně nehybné spojence, ale jeho dosah je v těchto případech poloviční.
actors.hero.spells.beamingray.name=paprsek
actors.hero.spells.beamingray.no_space=Tam se tvůj spojenec nemůže objevit.
actors.hero.spells.beamingray.out_of_range=Toto místo je mimo dosah.
actors.hero.spells.beamingray.short_desc=Teleportuje vašeho spojence a udělí bonusové poškození.
actors.hero.spells.blessspell.desc=Klerik umístí svaté požehnání na sebe nebo na jinou postavu, kterou vidí.\n\nPři seslání na sebe je efekt slabší a poskytuje %1$d tahy požehnání a %2$d bariéru.\n\nPři seslání na jiné postavy je kouzlo silnější a poskytuje %3$d tahy požehnání a %4$d léčení. Přebytečné léčení se přemění na bariéru.
actors.hero.spells.blessspell.name=žehnat
actors.hero.spells.blessspell.short_desc=Žehná a chrání Kněz, žehná a léčí ostatní.
actors.hero.spells.bodyform$bodyformbuff.desc=Trinityina tělesná podoba vám aktuálně dává sílu kouzla nebo glyfu, jako byste ho měli nasazený na své současné zbrani nebo brnění.\n\nUpozorňujeme, že tělesná podoba nemůže poskytnout další kopii efektu, ze kterého již těžíte.\n\nAktuální efekt: %1$s.\n\nZbývající tahy: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=tvar těla
actors.hero.spells.bodyform.desc=Klerik si vybere kouzlo nebo glyf, který v tomto běhu identifikoval, a naplní Trinity jeho efektem.\n\nKdyž je Trinity použita, klerik získává efekt vybraného kouzla nebo glyfu na tahy %d. Toto dočasné kouzlo nebo glyf bude fungovat s jakýmkoli efektem, který by fungovalo s běžným kouzlem nebo glyfem.\n\nToto kouzlo nahrazuje jakýkoli jiný tělesný efekt, kterým je Trinity aktuálně naplněna.
actors.hero.spells.bodyform.name=tvar těla
actors.hero.spells.bodyform.short_desc=Přiřadí Trinity k enchantu nebo glyfu.
actors.hero.spells.cleanse.desc=Kněz zruší všechny škodlivé statusy na sobě a viditelných spojencích. Po skončení kouzla všechny postižené postavy také získají imunitu vůči debuffům (%1$d) a bariéru (%2$d).
actors.hero.spells.cleanse.name=očistit
actors.hero.spells.cleanse.short_desc=Odstraňuje debuffy a poskytuje štít.
actors.hero.spells.clericspell.charge_cost=Cena poplatku: %d
actors.hero.spells.clericspell.invalid_enemy=Na toho nepřítele se nemůžeš zaměřit.
actors.hero.spells.clericspell.invalid_target=Na danou lokalitu se cílit nedá.
actors.hero.spells.clericspell.no_target=Tam žádný cíl není.
actors.hero.spells.clericspell.prompt=Vyberte cíl
actors.hero.spells.divineintervention.desc=Klerik vlévá do sebe a spojenců obrovské množství síly ze svého svazku, čímž posiluje všechny na %1$d štít a rozšiřuje Vzestoupenou formu o %2$d tahy. Neuvěřitelná obranná síla tohoto kouzla je zvažována jeho velmi vysokou cenou nabití. \n\nStejně jako jiná štíty udělené vzestoupenou formou, ani toto štíty normálně neklesají, ale okamžitě vyprší, jakmile vzestoupená forma skončí.
actors.hero.spells.divineintervention.name=božský zásah
actors.hero.spells.divineintervention.short_desc=Masivní posílení štítů pro klerika a spojence.
actors.hero.spells.divinesense$divinesensetracker.desc=Tato postava je dočasně schopna vidět ostatní blízké tvory svou myslí!\n\nZbývající tahy: %s.
actors.hero.spells.divinesense$divinesensetracker.name=božský smysl
actors.hero.spells.divinesense.desc=Kněz soustředí své smysly na okolí a získává mentální vidění s dosahem políček %d po dobu 50 kol. Toto kouzlo sesílá velmi rychle.
actors.hero.spells.divinesense.name=božský smysl
actors.hero.spells.divinesense.short_desc=Získejte dočasné mentální vidění v širokém rozsahu.
actors.hero.spells.flash.desc=Klerik přesměruje svou vznesenou formu na blízké místo a teleportuje se tam. Flash může teleportovat klerika na jakékoli objevené místo, které je v dosahu a je neobsazené. Toto kouzlo stojí více nabití knihy pokaždé, když je použito ve stejné vznesené formě.
actors.hero.spells.flash.name=blikat
actors.hero.spells.flash.prompt=Vyberte místo
actors.hero.spells.flash.short_desc=Teleportujte se na blízké místo.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Kněz bude moci po uplynutí 50 kol opět zdarma seslat Vůdčí světlo. \n\nZbývající kola: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Vedoucí světlo
actors.hero.spells.guidinglight$illuminated.desc=Tato postava září v důsledku zásahu naváděcího světla. I když záře není dostatečně silná, aby osvětlila okolní oblast, magický efekt klerikovi výrazně usnadní zasazování úderů.
actors.hero.spells.guidinglight$illuminated.desc_generic=Ostatní hrdinové mohou stále používat osvětlenou schopnost, aby těžili z talentu Spalující světlo, ale nezískají žádnou přesnost.
actors.hero.spells.guidinglight$illuminated.desc_priest=Kněz může navíc konzumovat osvětlenou sílu záře, úderem hůlky, úderem spojence nebo efekty z některých artefaktů. Použití osvětlené síly tímto způsobem způsobí bonusové magické poškození rovnající se knězově úrovni + 5.
actors.hero.spells.guidinglight$illuminated.name=osvětlené
actors.hero.spells.guidinglight.desc=Kněz vystřelí výboj magické energie, který zasáhne cíl, způsobí mu 2–8 bodů poškození a osvítí ho. Další nezatížený fyzický útok provedený proti osvícenému nepříteli ho zaručeně zasáhne.
actors.hero.spells.guidinglight.desc_priest=_Toto kouzlo je silnější, když ho sesílá kněz._ První seslání kouzla každých 50 kol nestojí žádné poplatky za knihu a osvícení bude spotřebováno zářivostí, hůlkami, jinými postavami a artefakty, které přímo ovlivňují nepřátele. Když je osvícení použito tímto způsobem, způsobí bonusové magické poškození rovnající se úrovni kněze + 5.
actors.hero.spells.guidinglight.name=Vedoucí světlo
actors.hero.spells.guidinglight.short_desc=Způsobuje magické poškození na dálku a zaručuje zásah.
actors.hero.spells.hallowedground$hallowedterrain.desc=Země je zde posvěcena. Posvěcená země zpomaluje nepřátele, léčí spojence a způsobuje šíření trávy.
actors.hero.spells.hallowedground.desc=Kněz soustředí svou božskou magii do blízké země a na 20 kol vytvoří oblast posvátného terénu %1$dx%1$d.\n\nKdyž je sesláno, toto kouzlo vyléčí všechny spojence o 15 HP (zdraví spojenci a kněz dostanou štít), krátce znehybní nepřátele a rozprostře krátkou trávu.\n\nPosvátný terén vyléčí spojence o 1 HP za kolo (zdraví spojenci a kněz dostanou štít), ochromí nepřátele a náhodně způsobí růst vysoké trávy.\n\nPosvátný terén je zničen ohněm a pokud jsou pasivní regenerační efekty vypnuty nebo kněz delší dobu nezískal zkušenosti, vytvoří zbrázděnou trávu.
actors.hero.spells.hallowedground.name=posvátná země
actors.hero.spells.hallowedground.prompt=Vyberte místo
actors.hero.spells.hallowedground.short_desc=Léčí spojence, zpomaluje nepřátele a v plošném zásahu šíří trávu.
actors.hero.spells.holyintuition.cursed=Cítíte v tomto předmětu číhající zlovolnou magii.
actors.hero.spells.holyintuition.desc=Klerik soustředí své smysly na předmět a určí, zda je prokletý, či nikoli, aniž by si ho musel vybavit.
actors.hero.spells.holyintuition.name=svatá intuice
actors.hero.spells.holyintuition.prompt=vybrat položku
actors.hero.spells.holyintuition.short_desc=identifikuje, zda je předmět prokletý či nikoli.
actors.hero.spells.holyintuition.uncursed=Tato položka neobsahuje zlovolnou magii.
actors.hero.spells.holylance$lancecooldown.desc=Kněz nedávno seslal Svaté kopí a musí počkat, než ho znovu sešle. \n\nZbývající tahy: %s.
actors.hero.spells.holylance$lancecooldown.name=Doba obnovení svatého kopí
actors.hero.spells.holylance.desc=Kněz soustředí velké množství energie do ničivého kopí vyrobeného ze světla. Toto kopí způsobuje poškození %1$d-%2$d a vždy způsobuje maximální poškození nemrtvým a démonickým cílům.\n\nToto kouzlo je velmi drahé a má dobu přebíjení 30 kol.
actors.hero.spells.holylance.name=svaté kopí
actors.hero.spells.holylance.short_desc=Způsobuje silné magické poškození na dálku.
actors.hero.spells.holyward$holyarmbuff.desc=Kněz naplnil jejich opotřebovanou zbroj svatou energií, čímž dočasně přepsal všechny existující symboly a způsobil, že zbroj blokuje 1 bod poškození navíc. \n\nZbývající tahy: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Paladin naplnil své opotřebované brnění svatou energií, což způsobilo, že brnění blokuje o 3 body poškození navíc.\n\nSesílání dalších kouzel, zatímco je svaté odměny aktivní, prodlouží jejich trvání o 10 kol za každé vynaložené nabití.\n\nZbývající kola: %s.
actors.hero.spells.holyward$holyarmbuff.name=svatý sbor
actors.hero.spells.holyward.desc=Klerik propouští své opotřebované brnění glyfy svatého světla, čímž zvyšuje blokování poškození brněním o 1. Toto kouzlo se sesílá okamžitě. \n\nTento glyf trvá 50 kol a po dobu trvání přepíše jakýkoli prospěšný glyf, který brnění má. Klerik bude z tohoto efektu těžit, i když nemá žádné brnění.
actors.hero.spells.holyward.desc_paladin=_Toto kouzlo je silnější, když ho sesílá Paladin._ Dodatečné blokování poškození se zvyšuje na 3, kouzlo již nepřepisuje existující symboly a sesílání jiných kouzel, zatímco je svaté odměny aktivní, prodlouží jeho trvání o 10 kol za každé použité nabití.
actors.hero.spells.holyward.glyph_desc=Tento glyf mírně zvyšuje množství poškození, které může brnění blokovat.
actors.hero.spells.holyward.glyph_name=%s světla
actors.hero.spells.holyward.name=svatý sbor
actors.hero.spells.holyward.short_desc=Dočasně přepíše glyfy, aby se zvýšilo blokování brnění.
actors.hero.spells.holyweapon$holywepbuff.desc=Kněz naplnil svou opotřebovanou zbraň svatou energií, čímž dočasně přepsal veškerá existující kouzla a způsobil, že zbraň způsobí při každém útoku o 2 body magického poškození navíc. \n\nZbývající tahy: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Paladin naplnil svou opotřebovanou zbraň svatou energií, což způsobilo, že jeho útoky způsobují 6 bodů magického poškození navíc.\n\nSesílání dalších kouzel, zatímco je svatá zbraň aktivní, prodlouží její trvání o 10 kol za každé vynaložené nabití.\n\nZbývající kola: %s.
actors.hero.spells.holyweapon$holywepbuff.name=svatá zbraň
actors.hero.spells.holyweapon.desc=Kněz očaruje svou nošenou zbraň svatou energií, která způsobí, že zbraň způsobí další 2 body magického poškození pokaždé, když s ní zasáhne nepřítele. Toto kouzlo sesílání netrvá dlouho.\n\nToto kouzlo trvá 50 kol a po dobu trvání přepíše jakékoli prospěšné kouzlo, které zbraň má. Z tohoto efektu mohou těžit i údery neozbrojené.
actors.hero.spells.holyweapon.desc_paladin=_Toto kouzlo je silnější, když ho sesílá Paladin._ Dodatečné magické poškození se zvyšuje na 6, kouzlo již nepřepisuje existující kouzla a sesílání jiných kouzel, když je svatá zbraň aktivní, prodlouží její trvání o 10 kol za každé použité nabití.
actors.hero.spells.holyweapon.ench_desc=Nepřátelé zasažení svatou zbraní utrpí dodatečné magické poškození.
actors.hero.spells.holyweapon.ench_name=svatý %s
actors.hero.spells.holyweapon.name=svatá zbraň
actors.hero.spells.holyweapon.short_desc=Dočasně přepíše kouzla a zvýší tak poškození.
actors.hero.spells.judgement.desc=Klerik udeří pěstí do země a způsobí výbuch světla, který způsobí poškození všem nepřátelům, které vidí. Toto způsobí základní poškození %1$d-%2$d, ale také dalších 33%% za každé kouzlo, které kněz seslal od doby, kdy vstoupil do vynesené formy (nebo od doby, kdy naposledy seslal Soud).\n\nV současné době Soud způsobí poškození %3$d-%4$d.
actors.hero.spells.judgement.name=rozsudek
actors.hero.spells.judgement.short_desc=Způsobí poškození všem viditelným nepřátelům.
actors.hero.spells.layonhands.desc=Paladin přenáší svatou energii skrze své ruce a léčí nebo chrání vše, čeho se dotkne.\n\nPaladin může toto kouzlo seslat na jakoukoli sousední postavu, aby jí poskytl %1$d léčení, nebo na sebe, aby získal %1$d štít. Přebytečné léčení z tohoto kouzla se přemění na štít.\n\nToto kouzlo je sesláno okamžitě a lze jej seslat opakovaně, ale nemůže poskytnout více než tři seslání štítu najednou.
actors.hero.spells.layonhands.name=vložit ruce
actors.hero.spells.layonhands.short_desc=Okamžitě vyléčí sousední postavu nebo Paladina zaštítí.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Klerik nedávno na tohoto spojence seslal Pouto života.\n\nKromě běžných výhod Pouta života tato postava také dostává menší poškození, všechna pozitivní kouzla klerika se aplikují na klerika i tohoto spojence, nikoli pouze na jednoho, a Síla mnoha nevyprší, dokud je tento buff aktivní.\n\nZbývající tahy: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=ochrana životního spojení
actors.hero.spells.lifelinkspell.desc=Klerik posiluje spojení mezi sebou a svým posíleným spojencem. Díky tomuto posílenému spojení se veškeré utrpěné poškození sdílí mezi hrdinu i jeho spojence po dobu %1$d tahy a obranné posílení Síly mnoha se zvýší na -%2$d%% utrpěné poškození. Všimněte si, že poškození se sdílí po zbroji, ale před snížením poškození Síly mnoha.\n\nDokud je tento efekt aktivní, prospěšná kouzla Klerika na úrovni T3 nebo nižší se vztahují na Klerika i jeho spojence, pokud by je aplikovala pouze na jednoho z nich.
actors.hero.spells.lifelinkspell.name=životní pouto
actors.hero.spells.lifelinkspell.short_desc=Sdílí poškození se spojencem a snižuje jeho přijaté poškození.
actors.hero.spells.mindform.desc=Klerik si vybere hůlku nebo vrhací zbraň, kterou v tomto běhu identifikoval, a naplní Trinity jejím efektem.\n\nKdyž je Trinity použita, může Klerik provést jeden útok, jako by používal vybraný předmět v bodě +%d. Tím se spustí všechny efekty, které by použití daného typu předmětu normálně spustilo.\n\nToto kouzlo nahradí jakýkoli jiný efekt mysli, kterým je Trinity aktuálně naplněna.
actors.hero.spells.mindform.name=forma mysli
actors.hero.spells.mindform.short_desc=Přiřadí Trinity hůlce nebo vrhací zbrani.
actors.hero.spells.mnemonicprayer.desc=Kněz pronese modlitbu, která prodlouží trvání všech vylepšení nebo debuffů na konkrétním cíli o %1$d tahy. Toto kouzlo se sešle okamžitě. Pozitivní účinky budou na spojencích (včetně samotného kněze) trvat déle a škodlivé účinky budou na nepřátelích trvat déle. \n\nMnemonická modlitba může prodloužit konkrétní instanci vylepšení nebo debuffu pouze jednou a nemůže prodloužit vylepšení udělená ze schopností brnění.
actors.hero.spells.mnemonicprayer.name=mnemotechnická modlitba
actors.hero.spells.mnemonicprayer.short_desc=Prodlužuje účinek buffů/debuffů na spojence/nepřítele a znovu aplikuje podsvícení.
actors.hero.spells.radiance.desc=Kněz vybuchne ve svatém světle a omráčí všechny viditelné nepřátele na 3 kola. Pokud je nepřítel již osvícen, Záře spustí bonusové poškození osvícením a poté aplikuje debuff osvícení. Záře také způsobí, že kněz bude na 100 kol zářit, pokud je aktuální patro tmavé.
actors.hero.spells.radiance.name=záře
actors.hero.spells.radiance.short_desc=Osvětlí a krátce omráčí viditelné nepřátele.
actors.hero.spells.recallinscription$useditemtracker.desc=Klerik nedávno použil předmět, který funguje s kouzlem vepsaného přivolání. Klerik může seslat kouzlo a zopakovat tak účinek předmětu.\n\nPoužitý předmět: %1$s.\n\nZbývající tahy: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=nedávno použitá runa
actors.hero.spells.recallinscription.desc=Klerik používá svatou magii k přeformulování efektu magické runy nalezené na runovém kameni nebo svitku, který použil v posledních kolech %s. \n\nNápis Vzpomínka nelze použít k replikaci svitků vylepšení. Cena nabití tohoto kouzla se liší v závislosti na tom, který předmět byl naposledy použit: 2 za runový kámen, 3 za svitek, 4 za exotický svitek. Tato cena nabití se také zdvojnásobí při replikaci svitku transmutace nebo alchymistických předmětů, které musí být vyrobeny pomocí transmutace nebo vylepšení.
actors.hero.spells.recallinscription.name=nápis na odvolání
actors.hero.spells.recallinscription.short_desc=Opakuje nedávno použitý runový kámen nebo svitek.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Mezi touto postavou a nepřítelem stojí tenký štít světla. Není dostatečně silný na to, aby útoky přímo blokoval, ale zmírní je. \n\nZbývající tahy: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=štít světla
actors.hero.spells.shieldoflight.desc=Klerik vytvoří mezi sebou a nepřítelem tenkou světelnou bariéru, která na 5 kol zvýší blokovací sílu jeho brnění proti tomuto nepříteli o %1$d-%2$d. \n\nToto kouzlo sesílá rychle, ale nelze jej použít proti více cílům současně.
actors.hero.spells.shieldoflight.name=štít světla
actors.hero.spells.shieldoflight.short_desc=Poskytuje dočasné brnění proti cíli.
actors.hero.spells.smite.desc=Paladin vdechuje útoku zblízka spravedlivou ničivou sílu.\n\nKromě způsobování běžného poškození zblízka Smite provádí i nezatížené útoky, u kterých je zaručen zásah, má sílu očarování +300%% a způsobuje %1$d - %2$d bonusové magické poškození.\n\nSmiteovo bonusové magické poškození se škáluje s úrovní Paladina a vždy způsobí maximální bonusové magické poškození proti nemrtvým nebo démonickým nepřátelům.
actors.hero.spells.smite.name=udeřit
actors.hero.spells.smite.short_desc=Zaručuje zásah s bonusovým poškozením a silou enchantů.
actors.hero.spells.spiritform$spiritformbuff.desc=Duchovní podoba Trinity vám aktuálně uděluje sílu předmětu, jako byste ho měli vybavený.\n\nUpozorňujeme, že duchovní podoba nemůže poskytnout další kopii efektu, ze kterého již těžíte.\n\nAktuální efekt: %1$s.\n\nZbývající tahy: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=duchovní forma
actors.hero.spells.spiritform.desc=Kněz si vybere prsten nebo artefakt, který v tomto kole identifikoval (kromě posvátné knihy), a naplní Trinity jeho efektem.\n\nPokud je vybrán prsten, Trinity udělí efekt tohoto prstenu s bodem +%1$d na 20 tahů.\n\nPokud je vybrán artefakt, Trinity replikuje efekt tohoto artefaktu s bodem +%2$d. Každý artefakt má při použití s Trinity odlišné specifické chování a náklady na nabití brnění.\n\nToto kouzlo nahrazuje jakýkoli jiný duchovní efekt, kterým je Trinity aktuálně naplněna.
actors.hero.spells.spiritform.name=duchovní forma
actors.hero.spells.spiritform.short_desc=Přiřadí Trinity prstenu nebo artefaktu.
actors.hero.spells.stasis$stasisbuff.desc=Klerik má aktuálně spojence uloženého ve stázi. Všechny pozitivní efekty na tohoto spojence jsou zachovány, včetně Moci mnoha, a po skončení efektu se znovu objeví vedle klerika. Efekt lze také předčasně ukončit opětovným sesláním Stáze.\n\nSpojence ve stázi: %1$s.\nZbývající tahy: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Váš nehybný spojenec zůstal pozadu.
actors.hero.spells.stasis$stasisbuff.name=spojenec ve stázi
actors.hero.spells.stasis.desc=Klerik zaměřuje své spojení se spojencem na sebe, což způsobuje, že je spojenec dočasně držen v jakési energetické stázi uvnitř klerika. Spojenec bude zachován po dobu až %d tahů, přičemž všechny jeho pozitivní účinky nebudou dobou ve stázi ovlivněny.\n\nSpojence se objeví vedle klerika, když stáze přirozeně skončí, nebo může klerik okamžitě a zdarma znovu seslat kouzlo, aby efekt předčasně ukončil. Stáze může přesouvat i nehybné spojence, ale nemůže je přesouvat mezi patry.
actors.hero.spells.stasis.name=stáze
actors.hero.spells.stasis.short_desc=Odstraní spojence z podzemí a zachová ho.
actors.hero.spells.sunray.desc=Kněz vystřelí na cíl paprsek oslepujícího světla, který mu způsobí poškození %1$d-%2$d a oslepí ho na %3$d kola. Sluneční paprsek vždy způsobí maximální poškození nemrtvým a démonickým cílům.\n\nPo zasažení tímto kouzlem se zrak nepřítele upraví a zabrání mu v opětovném oslepení. Pokud je však nepřítel zasažen znovu, zatímco je oslepen tímto kouzlem, světlo je ohromující a místo toho ho paralyzuje.
actors.hero.spells.sunray.name=sluneční paprsek
actors.hero.spells.sunray.short_desc=Způsobuje magické poškození na dálku a jednou oslepí cíl.
actors.hero.spells.walloflight$lightwall.desc=Průchod zde blokují třpytivé světelné panely.
actors.hero.spells.walloflight.desc=Paladin si přímo před sebou vytvoří zeď z panelů pevného světla, která je 1 políčko silná, %1$d políčka široká a trvá 20 tahů.\n\nTato zeď se chová stejně jako běžná, až na to, že je skrz ni vidět. Nepřátelé, kteří se při jejím vytvoření zachytí ve zdi, budou na okamžik omráčeni a pokud možno odtlačeni zpět. Všechno, co se ve zdi zasekne, se z ní bude moci dostat.\n\nZeď lze seslat v kterémkoli ze čtyř hlavních nebo čtyř diagonálních směrů. Pokud je zeď již aktivní, lze kouzlo znovu použít zdarma k jejímu okamžitému vyčištění.
actors.hero.spells.walloflight.early_end=Rozptýlíš zeď světla.
actors.hero.spells.walloflight.name=stěna světla
actors.hero.spells.walloflight.short_desc=Vytvoří zeď, která blokuje nepřátele.
actors.hero.talent$aggressivebarriercooldown.desc=Tento talent jsi nedávno použil/a a musíš s jeho opětovným použitím počkat. \n\nZbývající tahy: %s.
actors.hero.talent$aggressivebarriercooldown.name=ochlazovací doba agresivní bariéry
actors.hero.talent$combinedlethalityabilitytracker.executed=popraven
actors.hero.talent$deadlyfollowuptracker.desc=Duelistka nedávno zaútočila na nepřítele vrhací zbraní, její útoky zblízka proti stejnému cíli budou mít zvýšené poškození. \n\nZbývající tahy: %s.
actors.hero.talent$deadlyfollowuptracker.name=smrtící následování
actors.hero.talent$followupstriketracker.desc=Lovkyně nedávno zaútočila na nepřítele vrhací zbraní, její další útok zblízka proti stejnému cíli způsobí zvýšené poškození. \n\nZbývající tahy: %s.
actors.hero.talent$followupstriketracker.name=následná stávka
actors.hero.talent$improvisedprojectilecooldown.desc=Tento talent jsi nedávno použil/a a musíš s jeho opětovným použitím počkat. \n\nZbývající tahy: %s.
actors.hero.talent$improvisedprojectilecooldown.name=doba zpoždění improvizovaných projektilů
actors.hero.talent$lethalhastecooldown.desc=Tento talent jsi nedávno použil/a a musíš s jeho opětovným použitím počkat. \n\nZbývající tahy: %s.
actors.hero.talent$lethalhastecooldown.name=Znovuobnovovací doba smrtící rychlosti
actors.hero.talent$lingeringmagictracker.desc=Mág nedávno použil hůl nebo hůlku, jeho další fyzický útok způsobí bonusové poškození. \n\nZbývající tahy: %s.
actors.hero.talent$lingeringmagictracker.name=přetrvávající magie
actors.hero.talent$liquidagilacctracker.desc=Další běžný útok duelisty na blízko získá bonusovou přesnost. \n\nZbývající tahy: %s.
actors.hero.talent$liquidagilacctracker.name=obratnost kapalin
actors.hero.talent$patientstriketracker.desc=Duelistka právě strávila kolo čekáním, její další útok zblízka způsobí bonusové poškození.
actors.hero.talent$patientstriketracker.name=stávka pacientů
actors.hero.talent$preciseassaulttracker.desc=Další běžný útok duelisty na blízko získá bonusovou přesnost. \n\nZbývající tahy: %s.
actors.hero.talent$preciseassaulttracker.name=přesný útok
actors.hero.talent$provokedangertracker.desc=Válečník nedávno ztratil svůj štít, jeho další fyzický útok způsobí bonusové poškození. \n\nZbývající tahy: %s.
actors.hero.talent$provokedangertracker.name=vyprovokoval hněv
actors.hero.talent$rejuvenatingstepscooldown.desc=Tento talent jsi nedávno použil/a a musíš s jeho opětovným použitím počkat. \n\nZbývající tahy: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=omlazující kroky cooldown
actors.hero.talent$satiatedspellstracker.desc=Další kouzlo, které klerik sešle, mu poskytne malé množství štítu.
actors.hero.talent$satiatedspellstracker.name=Ochranné kouzlo
actors.hero.talent$searinglightcooldown.desc=Tento talent jsi nedávno použil/a a musíš s jeho opětovným použitím počkat. \n\nZbývající tahy: %s.
actors.hero.talent$searinglightcooldown.name=Spalující světlo
actors.hero.talent$seershotcooldown.desc=Tento talent jsi nedávno použil/a a musíš s jeho opětovným použitím počkat. \n\nZbývající tahy: %s.
actors.hero.talent$seershotcooldown.name=Doba zkrácení věštecké střely
actors.hero.talent$swiftequipcooldown.desc=Tento talent jsi nedávno použil/a a musíš s jeho opětovným použitím počkat. \n\nZbývající tahy: %s.
actors.hero.talent$swiftequipcooldown.name=rychlé přebíjení vybavení
actors.hero.talent.adventurers_intuition.desc=_+1:_ Duelistka identifikuje zbraně _2,5x rychleji_ a brnění _1,75x rychleji_.\n\n_+2:_ Duelistka identifikuje zbraně _když si je nasadí_ a brnění _2,5x rychleji_.
actors.hero.talent.adventurers_intuition.title=intuice dobrodruha
actors.hero.talent.aggressive_barrier.desc=_+1:_ Duelistka získá _3 body štítu_, když použije schopnost zbraně a její zdraví je na nebo pod 50 %.\n\n_+2:_ Duelistka získá _5 bodů štítu_, když použije schopnost zbraně a její zdraví je na nebo pod 50 %.
actors.hero.talent.aggressive_barrier.meta_desc=_Pokud tento talent získá jiný hrdina_, místo toho poskytne štít při útoku zblízka s nízkým zdravím s cooldownem 50 kol.
actors.hero.talent.aggressive_barrier.title=agresivní bariéra
actors.hero.talent.ally_warp.desc=_+1:_ Mág si může vybrat spojence, se kterým si okamžitě vymění místo, s dosahem _2 políček_.\n\n_+2:_ Mág si může vybrat spojence, se kterým si okamžitě vymění místo, s dosahem _4 políček_.\n\n_+3:_ Mág si může vybrat spojence, se kterým si okamžitě vymění místo, s dosahem _6 políček_.\n\n Mág si nemůže vyměnit místo s nehybnými spojenci.
actors.hero.talent.ally_warp.title=spojenecká warp
actors.hero.talent.arcane_vision.desc=_+1:_ Když Mág zasáhne nepřítele, získá na něj myšlenkový zrak na _10 tahů_.\n\n_+2:_ Když Mág zasáhne nepřítele, získá na něj myšlenkový zrak na _15 tahů_.
actors.hero.talent.arcane_vision.title=tajemná vize
actors.hero.talent.assassins_reach.desc=_+1:_ Dosah mrknutí Assassina na úroveň přípravy se zvyšuje na _1/3/4/6 políček_, z 1/2/3/4.\n\n_+2:_ Dosah mrknutí Assassina na úroveň přípravy se zvyšuje na _2/4/6/8 políček_, z 1/2/3/4.\n\n_+3:_ Dosah mrknutí Assassina na úroveň přípravy se zvyšuje na _2/5/7/10 políček_, z 1/2/3/4.\n\nToto mrknutí může projít skrz nebezpečí a nepřátele, ale ne skrz pevný terén, jako jsou zdi.
actors.hero.talent.assassins_reach.title=dosah vraha
actors.hero.talent.aura_of_protection.desc=_+1:_ Paladin může seslat _Auru ochrany_, kouzlo, které Paladinovi a všem spojencům do 2 políček udělí _20% odolnost proti poškození_ a efekt Paladinova brnění s _+50% sílou_ po dobu 20 kol, za cenu 2 nabití.\n\n_+2:_ Paladin může seslat _Auru ochrany_, kouzlo, které Paladinovi a všem spojencům do 2 políček udělí _30% odolnost proti poškození_ a efekt Paladinova brnění s _+75% sílou_ po dobu 20 kol, za cenu 2 nabití.\n\n_+3:_ Paladin může seslat _Auru ochrany_, kouzlo, které Paladinovi a všem spojencům do 2 políček udělí _40% odolnost proti poškození_ a efekt Paladinova brnění s _+100% sílou_ na 20 kol, za cenu 2 nabití.
actors.hero.talent.aura_of_protection.title=aura ochrany
actors.hero.talent.backup_barrier.desc=_+1:_ Mág získá _3 body štítu_, kdykoli utratí poslední nabití své hole.\n\n_+2:_ Mág získá _5 bodů štítu_, kdykoli utratí poslední nabití své hole.
actors.hero.talent.backup_barrier.meta_desc=_Pokud tento talent získá jiný hrdina_, spustí se z hůlky nejvyšší úrovně hrdiny.
actors.hero.talent.backup_barrier.title=záložní bariéra
actors.hero.talent.barkskin.desc=_+1:_ Když vstoupí do trávy, Strážkyně získá _0-50% své úrovně_ v brnění z kůry, které s každým kolem slábne.\n\n_+2:_ Když vstoupí do trávy, Strážkyně získá _0-100% své úrovně_ v brnění z kůry, které s každým kolem slábne.\n\n_+3:_ Když vstoupí do trávy, Strážkyně získá _0-150% své úrovně_ v brnění z kůry, které s každým kolem slábne.
actors.hero.talent.barkskin.title=kůra kůže
actors.hero.talent.beaming_ray.desc=Kněz může za cenu 1 nabití seslat _Zářivý paprsek_ ze posíleného spojence. Tento paprsek dokáže procházet zdmi a teleportovat spojence na vybrané místo. Pokud se na tomto místě nachází nepřítel, spojenec se objeví vedle nepřítele a zaměří se na něj. Paprsek může teleportovat i normálně nehybné spojence, ale při tom má poloviční dosah.\n\n_+1:_ Paprsek má maximální dosah _4 políček,_ a zvyšuje bonus Síly mnoha na _+35% poškození_ proti nejbližšímu nepříteli po dobu 10 kol.\n\n_+2:_ Paprsek má maximální dosah _8 políček,_ a zvyšuje bonus Síly mnoha na _+40% poškození_ proti nejbližšímu nepříteli po dobu 10 kol.\n\n_+3:_ Paprsek má maximální dosah _12 políček,_ a zvyšuje bonus Síly mnoha na _+45% poškození_ proti nejbližšímu nepříteli po dobu 10 kol.\n\n_+4:_ Paprsek má maximální dosah _16 políček,_ a zvyšuje Bonus Síly mnoha k _+50% poškození_ proti nejbližšímu nepříteli po dobu 10 kol.
actors.hero.talent.beaming_ray.title=paprsek
actors.hero.talent.blast_radius.desc=_+1:_ Poloměr elementárního výbuchu se zvětšil na _5 dlaždic_, ze 4.\n\n_+2:_ Poloměr elementárního výbuchu se zvětšil na _6 dlaždic_, ze 4.\n\n_+3:_ Poloměr elementárního výbuchu se zvětšil na _7 dlaždic_, ze 4.\n\n_+4:_ Poloměr elementárního výbuchu se zvětšil na _8 dlaždic_, ze 4.
actors.hero.talent.blast_radius.title=poloměr výbuchu
actors.hero.talent.bless.desc=_+1:_ Klerik může seslat _Požehnání_, kouzlo, které udělí _6 kol požehnání a 10 bodů štítu_, když je sesláno na sebe, nebo _10 kol požehnání a 10 bodů léčení_, když je sesláno na jinou postavu, za cenu 1 nabití.\n\n_+2:_ Klerik může seslat _Požehnání_, kouzlo, které udělí _10 kol požehnání a 15 bodů štítu_, když je sesláno na sebe, nebo _15 kol požehnání a 15 bodů léčení_, když je sesláno na jinou postavu, za cenu 1 nabití.\n\nPředbytečné léčení z tohoto kouzla se přemění na štít.
actors.hero.talent.bless.meta_desc=_Pokud tento talent získá jiný hrdina_, zvýší se tím přesnost a úhybnost pro hrdinu a všechny spojence o 3 % při +1 nebo o 5 % při +2.
actors.hero.talent.bless.title=žehnat
actors.hero.talent.body_form.desc=Klerik může seslat _Tvar těla_, který propůjčí Trojici sílu kouzla nebo glyfu, který Klerik v tomto běhu identifikoval, za cenu 2 nabití. \n\n_+1:_ Při použití Trojice získá Klerik vybraný efekt na _20 kol._\n\n_+2:_ Při použití Trojice získá Klerik vybraný efekt na _27 kol._\n\n_+3:_ Při použití Trojice získá Klerik vybraný efekt na _33 kol._\n\n_+4:_ Při použití Trojice získá Klerik vybraný efekt na _40 kol._\n\nTrojici lze propůjčit pouze jeden tělesný efekt najednou. Cena nabití brnění Trinity je vyšší, pokud je vybraný glyf vzácný a silný.
actors.hero.talent.body_form.title=tvar těla
actors.hero.talent.body_replacement.desc=_+1:_ Po mrknutí zanechá Zloděj dřevěnou návnadu s _20 body zdraví a 1–3 body brnění_.\n\n_+2:_ Po mrknutí zanechá Zloděj dřevěnou návnadu s _40 body zdraví a 2–6 body brnění_.\n\n_+3:_ Po mrknutí zanechá Zloděj dřevěnou návnadu s _60 body zdraví a 3–9 body brnění_.\n\n_+4:_ Po mrknutí zanechá Zloděj dřevěnou návnadu s _80 body zdraví a 4–12 body brnění_.\n\nAktivní může být pouze jedna návnada.
actors.hero.talent.body_replacement.title=výměna těla
actors.hero.talent.body_slam.desc=_+1:_ Když Válečník po skoku přistane, všichni sousední nepřátelé utrpí poškození rovnající se _1-4 plus 25%_ jeho síly blokování poškození.\n\n_+2:_ Když Válečník po skoku přistane, všichni sousední nepřátelé utrpí poškození rovnající se _2-8 plus 50%_ jeho síly blokování poškození.\n\n_+3:_ Když Válečník po skoku přistane, všichni sousední nepřátelé utrpí poškození rovnající se _3-12 plus 75%_ jeho síly blokování poškození.\n\n_+4:_ Když Válečník po skoku přistane, všichni sousední nepřátelé utrpí poškození rovnající se _4-16 plus 100%_ jeho síly blokování poškození.
actors.hero.talent.body_slam.title=údery do těla
actors.hero.talent.bounty_hunter.desc=_+1:_ Když Assassin zabije nepřítele připraveným úderem, jeho šance na pád předmětu se zvýší o _2/4/8/16 %_ za každou úroveň přípravy.\n\n_+2:_ Když Assassin zabije nepřítele připraveným úderem, jeho šance na pád předmětu se zvýší o _4/8/16/32 %_ za každou úroveň přípravy.\n\n_+3:_ Když Assassin zabije nepřítele připraveným úderem, jeho šance na pád předmětu se zvýší o _6/12/24/48 %_ za každou úroveň přípravy.
actors.hero.talent.bounty_hunter.title=lovec odměn
actors.hero.talent.cached_rations.desc=_+1:_ Zloděj může najít _2 zásobovací příděly_ umístěné v truhlách, zatímco prozkoumává několik dalších pater podzemí.\n\n_+2:_ Zloděj může najít _3 zásobovací příděly_ umístěné v truhlách, zatímco prozkoumává několik dalších pater podzemí.\n\nZásobovací příděly se rychle snědí, dodávají mírné množství sytosti, léčí 5 bodů zdraví a obnovují 1 nabití pláště stínů.
actors.hero.talent.cached_rations.title=uložené příděly
actors.hero.talent.cleanse.desc=_+1:_ Klerik může seslat _Očištění,_ kouzlo, které _odstraní negativní statusové efekty_ z klerika a všech blízkých spojenců a udělí jim _10 štítu,_ za cenu 2 nabití.\n\n_+2:_ Klerik může seslat _Očištění,_ kouzlo, které _udělí klerikovi a všem blízkým spojencům 3 kola imunity proti negativnímu statusu_ a udělí jim _20 štítu,_ za cenu 2 nabití.\n\n_+3:_ Klerik může seslat _Očištění,_ kouzlo, které _udělí klerikovi a všem blízkým spojencům 5 kol imunity proti negativnímu statusu_ a udělí jim _30 štítu,_ za cenu 2 nabití.
actors.hero.talent.cleanse.meta_desc=_Pokud tento talent získá jiný hrdina_, místo toho po použití hůlky nebo artefaktu vyčistí negativní statusové efekty na hrdinu, a to v 10/20/30 % případů s +1/+2/+3.
actors.hero.talent.cleanse.title=očistit
actors.hero.talent.cleave.desc=_+1:_ Dodatečný čas, který Gladiátor získává na zabití, se zvyšuje z 15 na _30 tahů_.\n\n_+2:_ Dodatečný čas, který Gladiátor získává na zabití, se zvyšuje z 15 na _45 tahů_.\n\n_+3:_ Dodatečný čas, který Gladiátor získává na zabití, se zvyšuje z 15 na _60 tahů_.
actors.hero.talent.cleave.title=rozštípnout
actors.hero.talent.cloned_armor.desc=_+1:_ Stínový klon získá _12 %_ hodnoty hrdinova brnění a má _25% šanci_ použít glyf na hrdinově brnění.\n\n_+2:_ Stínový klon získá _24 %_ hodnoty hrdinova brnění a má _50% šanci_ použít glyf na hrdinově brnění.\n\n_+3:_ Stínový klon získá _36 %_ hodnoty hrdinova brnění a má _75% šanci_ použít glyf na hrdinově brnění.\n\n_+4:_ Stínový klon získá _48 %_ hodnoty hrdinova brnění a má _100% šanci_ použít glyf na hrdinově brnění.
actors.hero.talent.cloned_armor.title=klonované brnění
actors.hero.talent.close_the_gap.desc=_+1:_ Duelistka mrkne _až o dvě políčka_ směrem ke svému cíli, když zahajuje duel.\n\n_+2:_ Duelistka mrkne _až o tři políčka_ směrem ke svému cíli, když zahajuje duel.\n\n_+3:_ Duelistka mrkne _až o čtyři políčka_ směrem ke svému cíli, když zahajuje duel.\n\n_+4:_ Duelistka mrkne _až o pět políček_ směrem ke svému cíli, když zahajuje duel.\n\nToto mrknutí může procházet přes překážky a nepřátele, ale ne přes pevný terén, jako jsou zdi. Mrknutí se bere v úvahu při určování, zda je nepřítel v dosahu, aby byl vyzván.
actors.hero.talent.close_the_gap.title=zmenšit mezeru
actors.hero.talent.combined_energy.desc=_+1:_ Pokud mnich použije schopnost zbraně a schopnost s _4+ energií_ do 5 kol od sebe, získá zpět 1 vynaloženou energii.\n\n_+2:_ Pokud mnich použije schopnost zbraně a schopnost s _3+ energií_ do 5 kol od sebe, získá zpět 1 vynaloženou energii.\n\n_+3:_ Pokud mnich použije schopnost zbraně a schopnost s _2+ energií_ do 5 kol od sebe, získá zpět 1 vynaloženou energii.
actors.hero.talent.combined_energy.title=kombinovaná energie
actors.hero.talent.combined_lethality.desc=_+1:_ Pokud Šampion zaútočí zbraní pro boj zblízka ihned po použití schopnosti jiné zbraně, tento útok popraví každého nepřítele, který není boss a má _pod 13 % HP_.\n\n_+2:_ Pokud Šampion zaútočí zbraní pro boj zblízka ihned po použití schopnosti jiné zbraně, tento útok popraví každého nepřítele, který není boss a má _pod 27 % HP_.\n\n_+3:_ Pokud Šampion zaútočí zbraní pro boj zblízka ihned po použití schopnosti jiné zbraně, tento útok popraví každého nepřítele, který není boss a má _pod 40 % HP_.\n\nTento útok může být běžným útokem zbraní pro boj zblízka nebo součástí schopnosti zbraně.
actors.hero.talent.combined_lethality.title=kombinovaná úmrtnost
actors.hero.talent.conserved_magic.desc=_+1:_ Každý zásah divoké magie nyní používá _0,33 náboje_ místo 0,5 a divoká magie má _25% šanci_, že neutratí kolo.\n\n_+2:_ Každý zásah divoké magie nyní používá _0,225 náboje_ místo 0,5 a divoká magie má _50% šanci_, že neutratí kolo.\n\n_+3:_ Každý zásah divoké magie nyní používá _0,15 náboje_ místo 0,5 a divoká magie má _75% šanci_, že neutratí kolo.\n\n_+4:_ Každý zásah divoké magie nyní používá _0,1 náboje_ místo 0,5 a divoká magie má _100% šanci_, že neutratí kolo.
actors.hero.talent.conserved_magic.title=konzervovaná magie
actors.hero.talent.counter_ability.desc=_+1:_ Pokud duelistka použije schopnost zbraně do 3 kol od útoku na její afterimaging, okamžitě získá zpět _0,38 nábojů_.\n\n_+2:_ Pokud duelistka použije schopnost zbraně do 3 kol od útoku na její afterimaging, okamžitě získá zpět _0,77 nábojů_.\n\n_+3:_ Pokud duelistka použije schopnost zbraně do 3 kol od útoku na její afterimaging, okamžitě získá zpět _1,13 nábojů_.\n\n_+4:_ Pokud duelistka použije schopnost zbraně do 3 kol od útoku na její afterimaging, okamžitě získá zpět _1,5 nábojů_.
actors.hero.talent.counter_ability.title=schopnost protiúčtu
actors.hero.talent.deadly_followup.desc=_+1:_ Když Duelistka zasáhne nepřítele vrhanou zbraní, způsobí mu po dobu 5 kol o _10 % více poškození zblízka_.\n\n_+2:_ Když Duelistka zasáhne nepřítele vrhanou zbraní, způsobí mu po dobu 5 kol o _20 % více poškození zblízka_.\n\n_+3:_ Když Duelistka zasáhne nepřítele vrhanou zbraní, způsobí mu po dobu 5 kol o _30 % více poškození zblízka_.
actors.hero.talent.deadly_followup.title=smrtící následování
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk se automaticky spustí, pokud se Berserker chystá zemřít a jeho vztek je 100 % nebo vyšší, ale v tomto případě má dobu přebíjení _3 úrovně hrdiny_.\n\n_+2:_ Berserk se automaticky spustí, pokud se Berserker chystá zemřít a jeho vztek je 100 % nebo vyšší, ale v tomto případě má dobu přebíjení _2 úrovně hrdiny_.\n\n_+3:_ Berserk se automaticky spustí, pokud se Berserker chystá zemřít a jeho vztek je 100 % nebo vyšší, ale v tomto případě má dobu přebíjení _1 úroveň hrdiny_.\n\nUpozorňujeme, že Berserker zemře, i když má po skončení berserkingu 0 HP.
actors.hero.talent.deathless_fury.title=nesmrtelná zuřivost
actors.hero.talent.deathly_durability.desc=_+1:_ Nepřátelé zabití znamením smrti dávají Zloději štít rovnající se _13 %_ jejich hp v době, kdy byli označeni.\n\n_+2:_ Nepřátelé zabití znamením smrti dávají Zloději štít rovnající se _25 %_ jejich hp v době, kdy byli označeni.\n\n_+3:_ Nepřátelé zabití znamením smrti dávají Zloději štít rovnající se _38 %_ jejich hp v době, kdy byli označeni.\n\n_+4:_ Nepřátelé zabití znamením smrti dávají Zloději štít rovnající se _50 %_ jejich hp v době, kdy byli označeni.
actors.hero.talent.deathly_durability.title=smrtelná odolnost
actors.hero.talent.desperate_power.desc=_+1:_ Mágovy hůlky a hůl získají _+1 úroveň_ při svém posledním útoku, když jim zbývá poslední nabití.\n\n_+2:_ Mágovy hůlky a hůl získají _+2 úrovně_ při svém posledním útoku, když jim zbývá poslední nabití.\n\n_+3:_ Mágovy hůlky a hůl získají _+3 úrovně_ při svém posledním útoku, když jim zbývá poslední nabití.
actors.hero.talent.desperate_power.title=zoufalá síla
actors.hero.talent.directed_power.desc=_+1:_ Přímý útok elementárním úderem získá _+30% sílu očarování_ pro každého nepřítele v dosahu efektu elementárního úderu, včetně cíle útoku.\n\n_+2:_ Přímý útok elementárním úderem získá _+60% sílu očarování_ pro každého nepřítele v dosahu efektu elementárního úderu, včetně cíle útoku.\n\n_+3:_ Přímý útok elementárním úderem získá _+90% sílu očarování_ pro každého nepřítele v dosahu efektu elementárního úderu, včetně cíle útoku.\n\n_+4:_ Přímý útok elementárním úderem získá _+120% sílu očarování_ pro každého nepřítele v dosahu efektu elementárního úderu, včetně cíle útoku.
actors.hero.talent.directed_power.title=směrovaný výkon
actors.hero.talent.divine_intervention.desc=_+1:_ Ve Vzestoupené formě může klerik seslat _Božský zásah_, který posílí klerika a všechny spojence až na _150 stupňů ochrany_ a prodlouží Vzestoupenou formu o _3 kola._\n\n_+2:_ Ve Vzestoupené formě může klerik seslat _Božský zásah_, který posílí klerika a všechny spojence až na _200 stupňů ochrany_ a prodlouží Vzestoupenou formu o _4 kola._\n\n_+3:_ Ve Vzestoupené formě může klerik seslat _Božský zásah_, který posílí klerika a všechny spojence až na _250 stupňů ochrany_ a prodlouží Vzestoupenou formu o _5 kol._\n\n_+4:_ Ve Vzestoupené formě může klerik seslat _Božský zásah_, což posiluje Kněžína a všechny spojence až na _300 štítů_ a prodlužuje Vzestoupenou formu o _6 kol._\n\nBožský zásah stojí ohromujících 5 nabití knihy a lze jej seslat pouze jednou ve stejné vzestoupené formě.
actors.hero.talent.divine_intervention.title=božský zásah
actors.hero.talent.divine_sense.desc=_+1:_ Klerik může seslat _Božský smysl,_ kouzlo, které mu poskytne _8 dlaždic_ Mind Vision na 50 kol a jeho sesílání netrvá dlouho, za cenu 2 nabití.\n\n_+2:_ Klerik může seslat _Božský smysl,_ kouzlo, které mu poskytne _12 dlaždic_ Mind Vision na 50 kol a jeho sesílání netrvá dlouho, za cenu 2 nabití.
actors.hero.talent.divine_sense.meta_desc=_Pokud tento talent získá jiný hrdina_, místo toho mu na krátkou chvíli poskytne zrak mysli po použití hůlky nebo artefaktu s dosahem 3 políček při +1 nebo 5 políček při +2.
actors.hero.talent.divine_sense.title=božský smysl
actors.hero.talent.double_jump.desc=_+1:_ Pokud válečník provede druhý skok během 3 kol, má tento skok o _16 % nižší náklady na nabití.\n\n_+2:_ Pokud válečník provede druhý skok během 3 kol, má tento skok o _30 % nižší náklady na nabití.\n\n_+3:_ Pokud válečník provede druhý skok během 3 kol, má tento skok o _40 % nižší náklady na nabití.\n\n_+4:_ Pokud válečník provede druhý skok během 3 kol, má tento skok o _50 % nižší náklady na nabití.
actors.hero.talent.double_jump.title=dvojitý skok
actors.hero.talent.double_mark.desc=_+1:_ Označení druhého cíle současně s prvním má o _30 % nižší_ cenu nabití.\n\n_+2:_ Označení druhého cíle současně s prvním má o _50 % nižší_ cenu nabití.\n\n_+3:_ Označení druhého cíle současně s prvním má o _65 % nižší_ cenu nabití.\n\n_+4:_ Označení druhého cíle současně s prvním má o _75 % nižší_ cenu nabití.
actors.hero.talent.double_mark.title=dvojitá značka
actors.hero.talent.durable_projectiles.desc=_+1:_ Vrhací zbraně mají _+50% odolnost_, pokud je používá Lovkyně.\n\n_+2:_ Vrhací zbraně mají _+75% odolnost_, pokud je používá Lovkyně.
actors.hero.talent.durable_projectiles.title=odolné projektily
actors.hero.talent.durable_tips.desc=_+1:_ Šípky s hrotem mají _2x odolnost_, když je použije Strážce.\n\n_+2:_ Šípky s hrotem mají _3x odolnost_, když je použije Strážce.\n\n_+3:_ Šípky s hrotem mají _4x odolnost_, když je použije Strážce.
actors.hero.talent.durable_tips.title=odolné špičky
actors.hero.talent.eagle_eye.desc=_+1:_ Dosah vidění duchovního jestřába se zvýší z 6 na _7 dlaždic_.\n\n_+2:_ Dosah vidění duchovního jestřába se zvýší z 6 na _8 dlaždic_.\n\n_+3:_ Dosah vidění duchovního jestřába se zvýší z 6 na _9 dlaždic_ a získává _2 dlaždice_ vidění mysli.\n\n_+4:_ Dosah vidění duchovního jestřába se zvýší z 6 na _10 dlaždic_ a získává _3 dlaždice_ vidění mysli.
actors.hero.talent.eagle_eye.title=ostříží zrak
actors.hero.talent.elemental_power.desc=_+1:_ Síla elementárního výbuchu se zvyšuje o _25%_.\n\n_+2:_ Síla elementárního výbuchu se zvyšuje o _50%_.\n\n_+3:_ Síla elementárního výbuchu se zvyšuje o _75%_.\n\n_+4:_ Síla elementárního výbuchu se zvyšuje o _100%_.
actors.hero.talent.elemental_power.title=elementární síla
actors.hero.talent.elemental_reach.desc=_+1:_ Dosah elementárního úderu se zvýší ze 4 na _5 políček_ a jeho šířka se zvýší z 65 na _75 stupňů_.\n\n_+2:_ Dosah elementárního úderu se zvýší ze 4 na _6 políček_ a jeho šířka se zvýší z 65 na _85 stupňů_.\n\n_+3:_ Dosah elementárního úderu se zvýší ze 4 na _7 políček_ a jeho šířka se zvýší z 65 na _95 stupňů_.\n\n_+4:_ Dosah elementárního úderu se zvýší ze 4 na _8 políček_ a jeho šířka se zvýší z 65 na _105 stupňů_.
actors.hero.talent.elemental_reach.title=elementární dosah
actors.hero.talent.elimination_match.desc=_+1:_ Pokud duelist vyzve znovu do 3 kol od konce duelu, má tato výzva _16% sníženou_ cenu nabití.\n\n_+2:_ Pokud duelist vyzve znovu do 3 kol od konce duelu, má tato výzva _30% sníženou_ cenu nabití.\n\n_+3:_ Pokud duelist vyzve znovu do 3 kol od konce duelu, má tato výzva _40% sníženou_ cenu nabití.\n\n_+4:_ Pokud duelist vyzve znovu do 3 kol od konce duelu, má tato výzva _50% sníženou_ cenu nabití.
actors.hero.talent.elimination_match.title=eliminační zápas
actors.hero.talent.empowered_strike.desc=_+1:_ První úder hole bojového mága zblízka po jejím zasažení způsobí _+16% poškození_ a bonusový efekt hole získá _+50% sílu_.\n\n_+2:_ První úder hole bojového mága zblízka po jejím zasažení způsobí _+33% poškození_ a bonusový efekt hole získá _+100% sílu_.\n\n_+3:_ První úder hole bojového mága zblízka po jejím zasažení způsobí _+50% poškození_ a bonusový efekt hole získá _+150% sílu_.
actors.hero.talent.empowered_strike.title=zmocněná stávka
actors.hero.talent.empowering_meal.desc=_+1:_ Snědením jídla získá Mág _2 bonusové poškození_ při dalších 3 úderech hůlkou.\n\n_+2:_ Snědením jídla získá Mág _3 bonusové poškození_ při dalších 3 úderech hůlkou.
actors.hero.talent.empowering_meal.title=posilující jídlo
actors.hero.talent.endless_rage.desc=_+1:_ Berserker může dosáhnout maxima _116% vzteku_.\n\n_+2:_ Berserker může dosáhnout maxima _133% vzteku_.\n\n_+3:_ Berserker může dosáhnout maxima _150% vzteku_.\n\nKaždý bod vzteku nad 100% zvyšuje štít berserka o 1% a snižuje dobu přebíjení o 1%, ale nezvyšuje bonus k poškození nad +50%.
actors.hero.talent.endless_rage.title=nekonečný vztek
actors.hero.talent.energizing_meal.desc=_+1:_ Jídlo zabere Mágovi 1 tah a dá mu _5 tahů nabíjení hůlky_.\n\n_+2:_ Jídlo zabere Mágovi 1 tah a dá mu _8 tahů nabíjení hůlky_.
actors.hero.talent.energizing_meal.title=energizující jídlo
actors.hero.talent.enhanced_combo.desc=_+1:_ Když je Gladiátorovo kombo 7 nebo vyšší, dosah Clobberova odhození se zvýší na 3, způsobí závrať a může srazit nepřátele do jám.\n\n_+2:_ Kromě výhod +1, když je Gladiátorovo kombo 9 nebo vyšší, funguje Krytí na více útoků.\n\n_+3:_ Kromě výhod +1 a +2 může Gladiátor při použití Úderu, Rozdrcení nebo Zuřivosti vyskočit až na kombo/3 políčka.
actors.hero.talent.enhanced_combo.title=vylepšená kombinace
actors.hero.talent.enhanced_lethality.desc=_+1:_ Assassin může zabíjet nepřátele s méně než _4/13/27/67 % zdraví_ za úroveň přípravy, navýšení z 3/10/20/50 %.\n\n_+2:_ Assassin může zabíjet nepřátele s méně než _5/17/33/83 % zdraví_ za úroveň přípravy, navýšení z 3/10/20/50 %.\n\n_+3:_ Assassin může zabíjet nepřátele s méně než _6/20/40/100 % zdraví_ za úroveň přípravy, navýšení z 3/10/20/50 %.
actors.hero.talent.enhanced_lethality.title=zvýšená úmrtnost
actors.hero.talent.enhanced_rings.desc=_+1:_ Když Zloděj použije artefakt, jeho prsteny získají +1 vylepšení na _3 tahy_.\n\n_+2:_ Když Zloděj použije artefakt, jeho prsteny získají +1 vylepšení na _6 tahy_.\n\n_+3:_ Když Zloděj použije artefakt, jeho prsteny získají +1 vylepšení na _9 tahy_.
actors.hero.talent.enhanced_rings.title=vylepšené prsteny
actors.hero.talent.enlightening_meal.desc=_+1:_ Jídlo zabere klerikovi 1 tah a dá mu _0,67 nabití_ na jeho svatý svazek.\n\n_+2:_ Jídlo zabere klerikovi 1 tah a dá mu _1 nabití_ na jeho svatý svazek.
actors.hero.talent.enlightening_meal.meta_desc=_Pokud tento talent získá jiný hrdina_, místo toho poskytne 2 tahy dobíjení hůlky a artefaktu s +1 nebo 3 tahy s +2. Toto nelze použít k tomu, aby se roh hojnosti sám dobil.
actors.hero.talent.enlightening_meal.title=Poučné jídlo
actors.hero.talent.enraged_catalyst.desc=_+1:_ Kouzla a kletby na Berserkerově zbrani se spouštějí častěji, čím více má vzteku, maximálně o _15 % častěji_ při 100 % vzteku.\n\n_+2:_ Kouzla a kletby na Berserkerově zbrani se spouštějí častěji, čím více má vzteku, maximálně o _30 % častěji_ při 100 % vzteku.\n\n_+3:_ Kouzla a kletby na Berserkerově zbrani se spouštějí častěji, čím více má vzteku, maximálně o _45 % častěji_ při 100 % vzteku.
actors.hero.talent.enraged_catalyst.title=rozzuřený katalyzátor
actors.hero.talent.evasive_armor.desc=_+1:_ Při volném běhu získává Freerunner navíc _+1 únik_ za přebytečný bod síly na svém brnění.\n\n_+2:_ Při volném běhu získává Freerunner další _+2 únik_ za přebytečný bod síly na svém brnění. získává další _+3 úniky_ za přebytečný bod síly na svém brnění.
actors.hero.talent.evasive_armor.title=úhybný pancíř
actors.hero.talent.even_the_odds.desc=_+1:_ Válečník způsobí po skončení trvání dodatečných _5% bonusových poškození_ každému nepříteli do 2 políček.\n\n_+2:_ Válečník způsobí po skončení trvání dodatečných _10% bonusových poškození_ každému nepříteli do 2 políček.\n\n_+3:_ Válečník způsobí po skončení trvání dodatečných _15% bonusových poškození_ každému nepříteli do 2 políček.\n\n_+4:_ Válečník způsobí po skončení trvání dodatečných _20% bonusových poškození_ každému nepříteli do 2 políček.
actors.hero.talent.even_the_odds.title=vyrovnat šance
actors.hero.talent.excess_charge.desc=_+1:_ Když je hůl bojového mága plně nabitá, jeho další zásah mu poskytne _0,67 štítu_ za každou úroveň hole.\n\n_+2:_ Když je hůl bojového mága plně nabitá, jeho další zásah mu poskytne _1,33 štítu_ za každou úroveň hole.\n\n_+3:_ Když je hůl bojového mága plně nabitá, jeho další zásah mu poskytne _2 štítu_ za každou úroveň hole.
actors.hero.talent.excess_charge.title=nadměrný poplatek
actors.hero.talent.expanding_wave.desc=_+1:_ Dosah Shockwave se zvětšil z 5 na _6 dlaždic_ a jeho šířka se zvětšila z 60 na _75 stupňů_.\n\n_+2:_ Dosah Shockwave se zvětšil z 5 na _7 dlaždic_ a jeho šířka se zvětšila z 60 na _90 stupňů_.\n\n_+3:_ Dosah Shockwave se zvětšil z 5 na _8 dlaždic_ a jeho šířka se zvětšila z 60 na _105 stupňů_.\n\n_+4:_ Dosah Shockwave se zvětšil z 5 na _9 dlaždic_ a jeho šířka se zvětšila z 60 na _120 stupňů_.
actors.hero.talent.expanding_wave.title=rozpínající se vlna
actors.hero.talent.expose_weakness.desc=_+1:_ Nepřátelé, kteří útočí na duelistův afterimage, se stanou slabými a zranitelnými na _2 kola_.\n\n_+2:_ Nepřátelé, kteří útočí na duelistův afterimage, se stanou slabými a zranitelnými na _4 kola_.\n\n_+3:_ Nepřátelé, kteří útočí na duelistův afterimage, se stanou slabými a zranitelnými na _6 kol_.\n\n_+4:_ Nepřátelé, kteří útočí na duelistův afterimage, se stanou slabými a zranitelnými na _8 kol_.
actors.hero.talent.expose_weakness.title=odhalit slabost
actors.hero.talent.fan_of_blades.desc=_+1:_ Spektrální čepele mohou zasáhnout až _1 další cíl_ a způsobit 50% poškození. Cíl musí být viditelný a v dosahu _30stupňového_ kužele.\n\n_+2:_ Spektrální čepele mohou zasáhnout až _2 další cíle_ a způsobit 50% poškození. Cíle musí být viditelné a v dosahu _60stupňového_ kužele.\n\n_+3:_ Spektrální čepele mohou zasáhnout až _3 další cíle_ a způsobit 50% poškození. Cíle musí být viditelné a v dosahu _90stupňového_ kužele.\n\n_+4:_ Spektrální čepele mohou zasáhnout až _4 další cíle_ a způsobit 50% poškození. Cíle musí být viditelné a v dosahu _120stupňového_ kužele.
actors.hero.talent.fan_of_blades.title=ventilátor lopatek
actors.hero.talent.farsight.desc=_+1:_ Dohled odstřelovače je _zvýšen o 25 %_.\n\n_+2:_ Dohled odstřelovače je _zvýšen o 50 %_.\n\n_+3:_ Dohled odstřelovače je _zvýšen o 75 %_.
actors.hero.talent.farsight.title=dalekozrakost
actors.hero.talent.fear_the_reaper.desc=_+1:_ Když nepřítel označený smrtí dosáhne 0 hp, stane se _zmrzačeným_.\n\n_+2:_ Když nepřítel označený smrtí dosáhne 0 hp, stane se _obávaným a zmrzačeným_.\n\n_+3:_ Když nepřítel označený smrtí dosáhne 0 hp, stane se _obávaným a zmrzačeným_ a nepřátelé do 3 políček se stanou _obávanými_ a zmrzačenými_.\n\n_+4:_ Když nepřítel označený smrtí dosáhne 0 hp, stane se _obávaným a zmrzačeným_ a nepřátelé do 3 políček se stanou _obávanými a zmrzačenými_.
actors.hero.talent.fear_the_reaper.title=boj se žně
actors.hero.talent.feigned_retreat.desc=_+1:_ Pokud nepřítel zaútočí na duelistův afterimage, získá _2 kola_ spěchu.\n\n_+2:_ Pokud nepřítel zaútočí na duelistův afterimage, získá _4 kola_ spěchu.\n\n_+3:_ Pokud nepřítel zaútočí na duelistův afterimage, získá _6 kola_ spěchu.\n\n_+4:_ Pokud nepřítel zaútočí na duelistův afterimage, získá _8 kola_ spěchu.
actors.hero.talent.feigned_retreat.title=předstíraný ústup
actors.hero.talent.fire_everything.desc=_+1:_ Divoká magie se nyní vystřelí _5krát_ (původně 4) a každá hůlka má _25% šanci_ být použitelná 3krát.\n\n_+2:_ Divoká magie se nyní vystřelí _6krát_ (původně 4) a každá hůlka má _50% šanci_ být použitelná 3krát.\n\n_+3:_ Divoká magie se nyní vystřelí _7krát_ (původně 4) a každá hůlka má _75% šanci_ být použitelná 3krát.\n\n_+4:_ Divoká magie se nyní vystřelí _8krát_ (původně 4) a každá hůlka má _100% šanci_ být použitelná 3krát.
actors.hero.talent.fire_everything.title=všechno vypálit
actors.hero.talent.flash.desc=_+1:_ Ve Vynešené podobě může Klerik seslat _Blesk_ a teleportovat se až o _3 políčka_ daleko.\n\n_+2:_ Ve Vynešené podobě může Klerik seslat _Blesk_ a teleportovat se až o _4 políčka_ daleko.\n\n_+3:_ Ve Vynešené podobě může Klerik seslat _Blesk_ a teleportovat se až o _5 políček_ daleko.\n\n_+4:_ Ve Vynešené podobě může Klerik seslat _Blesk_ a teleportovat se až o _6 políček_ daleko.\n\nBlesk stojí zpočátku 2 nabití knihy a za každé použití ve stejné vynešené podobě další 1 nabití.
actors.hero.talent.flash.title=blikat
actors.hero.talent.focused_meal.desc=_+1:_ Snědením jídla se Duelistka ocitne v 1. kole a získá _0,67 náboje_ na její zbraně.\n\n_+2:_ Snědením jídla se Duelistka ocitne v 1. kole a získá _1 náboj_ na její zbraně.
actors.hero.talent.focused_meal.meta_desc=_Pokud tento talent získá jiný hrdina_, místo toho mu poskytne bonusové poškození k jeho dalšímu zásahu ve výši jeho úrovně/3 při +1 nebo úrovně/2 při +2.
actors.hero.talent.focused_meal.title=soustředěné jídlo
actors.hero.talent.followup_strike.desc=_+1:_ Když Lovkyně zasáhne nepřítele lukem nebo vrhací zbraní, její další útok zblízka způsobí _2 bonusové poškození_.\n\n_+2:_ Když Lovkyně zasáhne nepřítele lukem nebo vrhací zbraní, její další útok zblízka způsobí _3 bonusové poškození_.
actors.hero.talent.followup_strike.title=následná stávka
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Útoky duchovního jestřába oslepují nepřátele na _2 kola_.\n\n_+2:_ Útoky duchovního jestřába oslepují nepřátele na _5 kol_.\n\n_+3:_ Útoky duchovního jestřába oslepují nepřátele na _5 kol_ a mrzačí je na _2 kola_.\n\n_+4:_ Útoky duchovního jestřába oslepují nepřátele na _5 kol_ a mrzačí je na _5 kol_.
actors.hero.talent.go_for_the_eyes.title=jít do očí
actors.hero.talent.growing_power.desc=_+1:_ Zvýšení útoku a rychlosti pohybu z přírodní síly se zvyšuje na _38 % a 125 %_, z 33 % a 100 %.\n\n_+2:_ Zvýšení útoku a rychlosti pohybu z přírodní síly se zvyšuje na _42 % a 150 %_, z 33 % a 100 %.\n\n_+3:_ Zvýšení útoku a rychlosti pohybu z přírodní síly se zvyšuje na _46 % a 175 %_, z 33 % a 100 %.\n\n_+4:_ Zvýšení útoku a rychlosti pohybu z přírodní síly se zvyšuje na _50 % a 200 %_, z 33 % a 100 %.
actors.hero.talent.growing_power.title=rostoucí síla
actors.hero.talent.hallowed_ground.desc=_+1:_ Kněz může seslat _Posvátnou zemi,_ kouzlo, které posvěcuje terén v oblasti _3x3_ po dobu 20 kol, za cenu 2 nabití.\n\n_+2:_ Kněz může seslat _Posvátnou zemi,_ kouzlo, které posvěcuje terén v oblasti _5x5_ po dobu 20 kol, za cenu 2 nabití.\n\n_+3:_ Kněz může seslat _Posvátnou zemi,_ kouzlo, které posvěcuje terén v oblasti _7x7_ po dobu 20 kol, za cenu 2 nabití.\n\nPo seslání Posvátná země vyléčí spojence o 15 HP, krátce znehybní nepřátele a rozprostře krátkou trávu. Poté pomalu léčí spojence, mrzačí nepřátele a způsobuje náhodný růst vysoké trávy. Posvátná země poskytuje knězi štít místo léčení a je zničena ohněm.
actors.hero.talent.hallowed_ground.title=posvátná země
actors.hero.talent.hasty_retreat.desc=_+1:_ Po mrknutí získá Zloděj _1 kolo_ spěchu a neviditelnosti.\n\n_+2:_ Po mrknutí získá Zloděj _2 kola_ spěchu a neviditelnosti.\n\n_+3:_ Po mrknutí získá Zloděj _3 kola_ spěchu a neviditelnosti.\n\n_+4:_ Po mrknutí získá Zloděj _4 kola_ spěchu a neviditelnosti.
actors.hero.talent.hasty_retreat.title=ukvapený ústup
actors.hero.talent.hearty_meal.desc=_+1:_ Jídlo vyléčí Válečníka o _4 HP_, pokud má 33 % zdraví nebo méně. \n\n_+2:_ Jídlo vyléčí Válečníka o _6 HP_, pokud má 33 % zdraví nebo méně.
actors.hero.talent.hearty_meal.title=vydatné jídlo
actors.hero.talent.heightened_senses.desc=_+1:_ Lovkyně získává myšlenkový zrak na postavy do _2 políček od své pozice_.\n\n_+2:_ Lovkyně získává myšlenkový zrak na postavy do _3 políček od své pozice_.
actors.hero.talent.heightened_senses.title=zvýšené smysly
actors.hero.talent.heroic_energy.desc=_+1:_ Hrdinova schopnost brnění má o _12 % snížené_ náklady na nabití.\n\n_+2:_ Hrdinova schopnost brnění má o _23 % snížené_ náklady na nabití.\n\n_+3:_ Hrdinova schopnost brnění má o _32 % snížené_ náklady na nabití.\n\n_+4:_ Hrdinova schopnost brnění má o _40 % snížené_ náklady na nabití.
actors.hero.talent.heroic_energy.rat_title=ratroická energie
actors.hero.talent.heroic_energy.title=hrdinská energie
actors.hero.talent.hold_fast.desc=_+1:_ Když Válečník čeká, získá _1-2 brnění_ a zpomalí rozpad buffů komba a štítu o _50%_, dokud se nepohne.\n\n_+2:_ Když Válečník čeká, získá _2-4 brnění_ a zpomalí rozpad buffů komba a štítu o _75%_, dokud se nepohne.\n\n_+3:_ Když Válečník čeká, získá _3-6 brnění_ a zpomalí rozpad buffů komba a štítu o _100%_, dokud se nepohne.
actors.hero.talent.hold_fast.title=drž se pevně
actors.hero.talent.holy_intuition.desc=_+1:_ Klerik může seslat _Svatou intuici,_ kouzlo, které za cenu _3 nabití odhalí, zda je předmět prokletý._\n\n_+2:_ Klerik může seslat _Svatou intuici,_ kouzlo, které za cenu _2 nabití odhalí, zda je předmět prokletý._
actors.hero.talent.holy_intuition.meta_desc=_Pokud tento talent získá jiný hrdina_, umožní mu zjistit stav kletby na prokletém předmětu těsně před jeho vybavením, a to v 15 % případů s +1 nebo v 25 % případů s +2.
actors.hero.talent.holy_intuition.title=svatá intuice
actors.hero.talent.holy_lance.desc=_+1:_ Kněz může seslat _Svaté kopí,_ ničivé kouzlo, které způsobí _30-55 bodů poškození_ za cenu 4 nabití.\n\n_+2:_ Kněz může seslat _Svaté kopí,_ ničivé kouzlo, které způsobí _45-83 bodů poškození_ za cenu 4 nabití.\n\n_+3:_ Kněz může seslat _Svaté kopí,_ ničivé kouzlo, které způsobí _60-110 bodů poškození_ za cenu 4 nabití.\n\nSvaté kopí vždy způsobí maximální poškození démonickým a nemrtvým nepřátelům. Svaté kopí má 30kolovou dobu přebíjení, než jej lze znovu seslat.
actors.hero.talent.holy_lance.title=svaté kopí
actors.hero.talent.impact_wave.desc=_+1:_ Když válečník po skoku přistane, všichni sousední nepřátelé jsou odhozeni o _2 políčka_ zpět a mají _25% šanci_, že se stanou zranitelnými na 5 kol.\n\n_+2:_ Když válečník po skoku přistane, všichni sousední nepřátelé jsou odhozeni o _3 políčka_ zpět a mají _50% šanci_, že se stanou zranitelnými na 5 kol.\n\n_+3:_ Když válečník po skoku přistane, všichni sousední nepřátelé jsou odhozeni o _4 políčka_ zpět a mají _75% šanci_, že se stanou zranitelnými na 5 kol.\n\n_+4:_ Když válečník po skoku přistane, všichni sousední nepřátelé jsou odhozeni o _5 políček_ zpět a mají _100% šanci_, že se stanou zranitelnými na 5 kol.
actors.hero.talent.impact_wave.title=nárazová vlna
actors.hero.talent.improvised_projectiles.desc=_+1:_ Válečník může oslepit nepřítele na _2 kola_ tím, že po něm hodí jakýkoli předmět, který není vrhací zbraní. Toto má 50kolovou dobu přebíjení.\n\n_+2:_ Válečník může oslepit nepřítele na _3 kola_ tím, že po něm hodí jakýkoli předmět, který není vrhací zbraní. Toto má 50kolovou dobu přebíjení.
actors.hero.talent.improvised_projectiles.title=improvizované projektily
actors.hero.talent.inscribed_power.desc=_+1:_ Když Mág přečte svitek nebo použije kouzelný předmět, jeho _další 2 sestřely hůlky_ získají +2 úrovně.\n\n_+2:_ Když Mág přečte svitek nebo použije kouzelný předmět, jeho _další 3 sestřely hůlky_ získají +2 úrovně.\n\nPočet vylepšených sestřelů hůlky se zdvojnásobí při použití svitku s vylepšeními, transmutacemi nebo alchymistickými předměty, které musí být s použitím těchto svitků vyrobeny.\n\nU alchymistických předmětů s vyšším výstupním množstvím (např. většina kouzel) má tento talent šanci na spuštění na základě toho, kolik daného předmětu je vyrobeno.
actors.hero.talent.inscribed_power.title=vepsaná síla
actors.hero.talent.inscribed_stealth.desc=_+1:_ Zloděj získá _3 kola_ neviditelnosti po přečtení svitku nebo použití kouzelného předmětu.\n\n_+2:_ Zloděj získá _5 kola_ neviditelnosti po přečtení svitku nebo použití kouzelného předmětu.\n\nDoba neviditelnosti se zdvojnásobí při použití svitku vylepšení, svitku transmutace nebo alchymistických předmětů, které musí být vyrobeny pomocí těchto svitků.\n\nU alchymistických předmětů s vyšším výstupním množstvím (např. většina kouzel) má tento talent šanci na spuštění na základě toho, kolik daného předmětu je vyrobeno.
actors.hero.talent.inscribed_stealth.title=vepsané tajemství
actors.hero.talent.invigorating_meal.desc=_+1:_ Snědení jídla zabere Lovkyni 1 tah (bobule jsou snědeny okamžitě) a dá jí _1 tah spěchu_.\n\n_+2:_ Snědení jídla zabere Lovkyni 1 tah (bobule jsou snědeny okamžitě) a dá jí _2 tahy spěchu_.
actors.hero.talent.invigorating_meal.title=osvěžující jídlo
actors.hero.talent.invigorating_victory.desc=_+1:_ Pokud duelistka porazí svůj cíl před koncem duelu, vyléčí se za _5 HP plus 30 % poškození_, které během duelu utrpěla.\n\n_+2:_ Pokud duelistka porazí svůj cíl před koncem duelu, vyléčí se za _10 HP plus 50 % poškození_, které během duelu utrpěla.\n\n_+3:_ Pokud duelistka porazí svůj cíl před koncem duelu, vyléčí se za _15 HP plus 65 % poškození_, které během duelu utrpěla.\n\n_+4:_ Pokud duelistka porazí svůj cíl před koncem duelu, vyléčí se za _20 HP plus 75 % poškození_, které během duelu utrpěla.
actors.hero.talent.invigorating_victory.title=povzbuzující vítězství
actors.hero.talent.iron_stomach.desc=_+1:_ Jídlo zabere Válečníkovi 1 tah a během jídla mu poskytne _75% odolnost vůči poškození_.\n\n_+2:_ Jídlo zabere Válečníkovi 1 tah a během jídla mu poskytne _100% odolnost vůči poškození_.
actors.hero.talent.iron_stomach.title=železný žaludek
actors.hero.talent.iron_will.desc=_+1:_ Štít poskytovaný pečetí válečníka je _zvýšen o 1_.\n\n_+2:_ Štít poskytovaný pečetí válečníka je _zvýšen o 2_.
actors.hero.talent.iron_will.meta_desc=_Pokud tento talent získá jiný hrdina_, pasivně mu poskytne 1 nebo 2 maximální štítovou verzi efektu zlomené pečeti válečníka.
actors.hero.talent.iron_will.title=železná vůle
actors.hero.talent.judgement.desc=_+1:_ Ve Vyzdvihnuté podobě může Klerik seslat _Soud,_ který způsobí _10-20 bodů poškození_ všem viditelným nepřátelům.\n\n_+2:_ Ve Vyzdvihnuté podobě může Klerik seslat _Soud,_ který způsobí _15-30 bodů poškození_ všem viditelným nepřátelům.\n\n_+3:_ Ve Vyzdvihnuté podobě může Klerik seslat _Soud,_ který způsobí _20-40 bodů poškození_ všem viditelným nepřátelům.\n\n_+4:_ Ve Vyzdvihnuté podobě může Klerik seslat _Soud,_ který způsobí _25-50 bodů poškození_ všem viditelným nepřátelům.\n\nSoud stojí 3 nabití knihy. Soud způsobí +33% poškození za každé kouzlo, které kněz seslal od doby, kdy vstoupil do vznesené formy, nebo od posledního seslání Soudu.
actors.hero.talent.judgement.title=rozsudek
actors.hero.talent.lay_on_hands.desc=_+1:_ Paladin může seslat _Vložení rukou,_ kouzlo, které okamžitě vyléčí blízkou postavu o _15 HP,_ nebo jí udělí _15 štít,_ za cenu 1 nabití.\n\n_+2:_ Paladin může seslat _Vložení rukou,_ kouzlo, které okamžitě vyléčí blízkou postavu o _20 HP,_ nebo jí udělí _20 štít,_ za cenu 1 nabití.\n\n_+3:_ Paladin může seslat _Vložení rukou,_ kouzlo, které okamžitě vyléčí blízkou postavu o _25 HP,_ nebo jí udělí _25 štít,_ za cenu 1 nabití.\n\nPředbytečné léčení z tohoto kouzla se přemění na štít. Vložení rukou lze seslat opakovaně, ale nelze použít více než tři seslání štítu najednou.
actors.hero.talent.lay_on_hands.title=vložit ruce
actors.hero.talent.lethal_defense.desc=_+1:_ Když Gladiátor zabije nepřítele kombinovaným útokem, doba cooldownu jeho štítu Zlomená pečeť se _zkrátí o 50 kol_.\n\n_+2:_ Když Gladiátor zabije nepřítele kombinovaným útokem, doba cooldownu jeho štítu Zlomená pečeť se _zkrátí o 100 kol_.\n\n_+3:_ Když Gladiátor zabije nepřítele kombinovaným útokem, doba cooldownu jeho štítu Zlomená pečeť se _zkrátí o 150 kol_.\n\nTímto talentem lze dobu cooldownu štítu zkrátit až na -150 kol, což znamená, že bude po aktivaci okamžitě opět k dispozici.
actors.hero.talent.lethal_defense.title=smrtící obrana
actors.hero.talent.lethal_haste.desc=_+1:_ Když Duelistka zasadí smrtící úder nepříteli se schopností zbraně, získá okamžitý pohyb v hodnotě _3 kol_.\n\n_+2:_ Když Duelistka zasadí smrtící úder nepříteli se schopností zbraně, získá okamžitý pohyb v hodnotě _5 kol_.
actors.hero.talent.lethal_haste.meta_desc=_Pokud tento talent získá jiný hrdina_, spustí se při útoku běžnou zbraní s cooldownem 100 kol.
actors.hero.talent.lethal_haste.title=smrtící spěch
actors.hero.talent.lethal_momentum.desc=_+1:_ Když Válečník zasadí nepříteli smrtící úder fyzickou zbraní, má _67% šanci_ odehrát 0 tahů.\n\n_+2:_ Když Válečník zasadí nepříteli smrtící úder fyzickou zbraní, má _100% šanci_ odehrát 0 tahů.
actors.hero.talent.lethal_momentum.title=smrtící hybnost
actors.hero.talent.life_link.desc=Kněz může seslat _Životní spojení_ mezi sebe a posíleného spojence za cenu 2 nabití. Toto kouzlo způsobí, že se poškození sdílí mezi klerika a jeho spojence a způsobí, že se na oba aplikují prospěšná klerická kouzla 3. úrovně nebo nižší, pokud je kterýkoli z nich ovlivněn. \n\n_+1:_ Životní spojení trvá _10 kol_ a zvyšuje bonus Síly mnoha na _-35% přijatého poškození._\n\n_+2:_ Životní spojení trvá _13 kol_ a zvyšuje bonus Síly mnoha na _-40% přijatého poškození._\n\n_+3:_ Životní spojení trvá _17 kol_ a zvyšuje bonus Síly mnoha na _-45% přijatého poškození._\n\n_+4:_ Životní spojení trvá _20 kol_ a zvyšuje bonus Síly mnoha na _-50% přijatého poškození._
actors.hero.talent.life_link.title=životní pouto
actors.hero.talent.light_cloak.desc=_+1:_ Zloděj může používat svůj plášť stínů, když není vybaven, ale ten se bez vybavení dobíjí _25% rychlostí_.\n\n_+2:_ Zloděj může používat svůj plášť stínů, když není vybaven, ale ten se bez vybavení dobíjí _50% rychlostí_.\n\n_+3:_ Zloděj může používat svůj plášť stínů, když není vybaven, ale ten se bez vybavení dobíjí _75% rychlostí_.
actors.hero.talent.light_cloak.meta_desc=_Pokud tento talent získá jiný hrdina_, zvýší se rychlost nabíjení všech artefaktů o 7/13/20 % při +1/+2/+3.
actors.hero.talent.light_cloak.title=lehký plášť
actors.hero.talent.light_reading.desc=_+1:_ Klerik může používat svůj svatý svazek, když není vybaven, ale dobíjí se _25% rychlostí_, když není vybaven.\n\n_+2:_ Klerik může používat svůj svatý svazek, když není vybaven, ale dobíjí se _50% rychlostí_, když není vybaven.\n\n_+3:_ Klerik může používat svůj svatý svazek, když není vybaven, ale dobíjí se _75% rychlostí_, když není vybaven.
actors.hero.talent.light_reading.meta_desc=_Pokud tento talent získá jiný hrdina_, zvýší se rychlost dobíjení všech hůlek o 7/13/20 % při +1/+2/+3.
actors.hero.talent.light_reading.title=Lehké čtení
actors.hero.talent.lingering_magic.desc=_+1:_ Když Mág zasáhne hůlkou nebo holí, jeho další fyzický útok způsobí _1-2 bonusové poškození_.\n\n_+2:_ Když Mág zasáhne hůlkou nebo holí, jeho další fyzický útok způsobí _2 bonusové poškození_.
actors.hero.talent.lingering_magic.title=přetrvávající magie
actors.hero.talent.liquid_agility.desc=_+1:_ Při pití nebo házení lektvaru, odvaru nebo elixíru má Duelistka během 5 kol _3x úhybnost_ a _3x přesnost_ při svém dalším útoku zblízka.\n\n_+2:_ Při pití nebo házení lektvaru, odvaru nebo elixíru má Duelistka během 5 kol _nekonečnou úhybnost_ a _nekonečnou přesnost_ při svém dalším útoku zblízka.\n\nTento bonus trvá jedno další kolo a útok při použití lektvarů síly, zkušeností nebo alchymistických předmětů, které musí být s použitím těchto lektvarů vyrobeny.\n\nU alchymistických předmětů s vyšším výstupním množstvím (např. vodní odvar) má tento talent šanci se spustit na základě toho, kolik daného předmětu je vyrobeno.
actors.hero.talent.liquid_agility.title=obratnost kapalin
actors.hero.talent.liquid_nature.desc=_+1:_ Když Lovkyně vypije nebo hodí lektvar, odvar nebo elixír, _až 4 políčka trávy_ vyraší v okolní oblasti a sousední nepřátelé jsou na _1 kolo znehybněni_.\n\n_+2:_ Když Lovkyně vypije nebo hodí lektvar, odvar nebo elixír, _až 6 políček trávy_ vyraší v okolní oblasti a sousední nepřátelé jsou na _2 kola znehybněni_.\n\nMnožství trávy a trvání kořenů se zdvojnásobí při použití lektvarů síly, zkušeností nebo alchymistických předmětů, které je nutné s použitím těchto lektvarů vyrobit.\n\nU alchymistických předmětů s vyšším výstupním množstvím (např. vodní odvar) má tento talent šanci na spuštění na základě toho, kolik daného předmětu je vyrobeno.
actors.hero.talent.liquid_nature.title=tekutá povaha
actors.hero.talent.liquid_willpower.desc=_+1:_ Válečník získá _6,5 % svého maximálního HP ve štítu_ při vypití nebo vržení lektvaru, odvaru nebo elixíru.\n\n_+2:_ Válečník získá _10 % svého maximálního HP ve štítu_ při vypití nebo vržení lektvaru, odvaru nebo elixíru.\n\nVýše štítu se zdvojnásobí při použití lektvarů síly, zkušeností nebo alchymistických předmětů, které musí být s použitím těchto lektvarů vyrobeny.\n\nU alchymistických předmětů s vyšším výstupním množstvím (např. vodní odvar) má tento talent šanci na spuštění na základě toho, kolik daného předmětu je vyrobeno.
actors.hero.talent.liquid_willpower.title=tekutá vůle
actors.hero.talent.longrange_warp.desc=_+1:_ Mág se nyní může warpovat mezi patry, za _150% cenu nabití_.\n\n_+2:_ Mág se nyní může warpovat mezi patry, za _117% cenu nabití_.\n\n_+3:_ Mág se nyní může warpovat mezi patry, za _83% cenu nabití_.\n\n_+4:_ Mág se nyní může warpovat mezi patry, za _50% cenu nabití_.\n\n Mág nemůže použít warp na dlouhou vzdálenost k opuštění zamčeného patra.
actors.hero.talent.longrange_warp.title=Dlouhodobý warp
actors.hero.talent.mind_form.desc=Klerik může seslat _Formu mysli_, která propůjčí Trinity sílu hůlky nebo vrhací zbraně, kterou Klerik v tomto běhu použil, za cenu 3 nabití. \n\n_+1:_ Při použití Trinity Klerik použije efekt sestřelení nebo hodu vybraného předmětu, jako by to bylo _+3._\n\n_+2:_ Při použití Trinity Klerik použije efekt sestřelení nebo hodu vybraného předmětu, jako by to bylo _+4._\n\n_+3:_ Při použití Trinity Klerik použije efekt sestřelení nebo hodu vybraného předmětu, jako by to bylo _+5._\n\n_+4:_ Při použití Trinity Klerik použije efekt sestřelení nebo hodu vybraného předmětu, jako by to bylo _+6._\n\nTrinity lze naplnit pouze jedním efektem mysli najednou.
actors.hero.talent.mind_form.title=forma mysli
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Kněz může seslat _Mnemotechnickou modlitbu,_ kouzlo, které prodlouží buffy/debuffy na spojence/nepříteli na _3 kola_ za cenu 1 nabití.\n\n_+2:_ Kněz může seslat _Mnemotechnickou modlitbu,_ kouzlo, které prodlouží buffy/debuffy na spojence/nepříteli na _4 kola_ za cenu 1 nabití.\n\n_+3:_ Kněz může seslat _Mnemotechnickou modlitbu,_ kouzlo, které prodlouží buffy/debuffy na spojence/nepříteli na _5 kol_ za cenu 1 nabití.\n\nMnemotechnická modlitba se sesílá okamžitě. Mnemotechnická modlitba může prodloužit konkrétní instanci buffu/debuffu pouze jednou a nemůže prodloužit buffy ze schopností brnění.
actors.hero.talent.mnemonic_prayer.title=mnemotechnická modlitba
actors.hero.talent.monastic_vigor.desc=_+1:_ Pokud má mnich _100 % energie_, jeho schopnosti jsou posíleny.\n\n_+2:_ Pokud má mnich _80 % nebo více energie_, jeho schopnosti jsou posíleny.\n\n_+3:_ Pokud má mnich _60 % nebo více energie_, jeho schopnosti jsou posíleny.\n\nKdyž je posílen:\n- Flurry aplikuje kouzlo vaší zbraně\n- Soustředění je okamžité\n- Dash získává +4 dosah\n- Dračí kop způsobuje +50 % poškození a aplikuje svůj efekt odhození a omráčení na všechny sousedící nepřátele\n- Meditace pomalu léčí 20 % chybějících HP a poskytuje 80% odolnost vůči poškození.
actors.hero.talent.monastic_vigor.title=klášterní síla
actors.hero.talent.mystical_charge.desc=_+1:_ Úder holí poskytne bojovému mágovi dobití artefaktu v hodnotě _0,5 tahu_.\n\n_+2:_ Úder holí poskytne bojovému mágovi dobití artefaktu v hodnotě _1 tahu_.\n\n_+3:_ Úder holí poskytne bojovému mágovi dobití artefaktu v hodnotě _1,5 tahu_.
actors.hero.talent.mystical_charge.title=mystický náboj
actors.hero.talent.mystical_meal.desc=_+1:_ Snědením jídla se Zloději podaří 1. kolo (zásoby se snědí okamžitě) a získá _3 kola dobíjení artefaktů_.\n\n_+2:_ Snědením jídla se Zloději podaří 1. kolo (zásoby se snědí okamžitě) a získá _5 kol dobíjení artefaktů_.\n\nTento talent nelze použít k tomu, aby se roh hojnosti sám dobil.
actors.hero.talent.mystical_meal.title=mystické jídlo
actors.hero.talent.natures_aid.desc=_+1:_ Lovkyně získá 0-2 brnění z kůry, které slábne každé _3 tahy_, když je v jejím zorném poli aktivován efekt rostliny.\n\n_+2:_ Lovkyně získá 0-2 brnění z kůry, které slábne každých _5 tahy_, když je v jejím zorném poli aktivován efekt rostliny.
actors.hero.talent.natures_aid.title=pomoc přírody
actors.hero.talent.natures_bounty.desc=_+1:_ Lovkyně může při prozkoumávání několika dalších pater podzemí najít _4 bobule_ ukryté ve vysoké trávě.\n\n_+2:_ Lovkyně může při prozkoumávání několika dalších pater podzemí najít _6 bobulí_ ukrytých ve vysoké trávě.\n\nBobule se rychle snědí, zasytí a mohou obsahovat použitelné semínko.
actors.hero.talent.natures_bounty.title=dary přírody
actors.hero.talent.natures_wrath.desc=_+1:_ Dokud je síla přírody aktivní, výstřely z duchovního luku mají _8% šanci_ spustit náhodný škodlivý efekt rostliny.\n\n_+2:_ Dokud je síla přírody aktivní, výstřely z duchovního luku mají _17% šanci_ spustit náhodný škodlivý efekt rostliny.\n\n_+3:_ Dokud je síla přírody aktivní, výstřely z duchovního luku mají _25% šanci_ spustit náhodný škodlivý efekt rostliny.\n\n_+4:_ Dokud je síla přírody aktivní, výstřely z duchovního luku mají _33% šanci_ spustit náhodný škodlivý efekt rostliny.\n\nRostliny, které lze spustit, jsou: slepýš, ohnivý květ, ledovec, smutný mech a bouřková réva.
actors.hero.talent.natures_wrath.title=hněv přírody
actors.hero.talent.necromancers_minions.desc=_+1:_ Když zemře nepřítel označený duší, má Warlock _13% šanci_ ho vyvolat jako zkaženého přízraku.\n\n_+2:_ Když zemře nepřítel označený duší, má Warlock _27% šanci_ ho vyvolat jako zkaženého přízraku.\n\n_+3:_ Když zemře nepřítel označený duší, má Warlock _40% šanci_ ho vyvolat jako zkaženého přízraku.
actors.hero.talent.necromancers_minions.title=nekromantovi přisluhovači
actors.hero.talent.patient_strike.desc=_+1:_ Pokud duelistka počká s provedením útoku zblízka, způsobí _1-2 bonusové poškození_.\n\n_+2:_ Pokud duelistka počká s provedením útoku zblízka, způsobí _2 bonusové poškození_.
actors.hero.talent.patient_strike.title=stávka pacientů
actors.hero.talent.perfect_copy.desc=_+1:_ Stínový klon získá _10 %_ maximálního HP hrdiny a může si okamžitě vyměnit místo s hrdinou až do vzdálenosti _1 políčka_.\n\n_+2:_ Stínový klon získá _20 %_ maximálního HP hrdiny a může si okamžitě vyměnit místo s hrdinou až do vzdálenosti _2 políček_.\n\n_+3:_ Stínový klon získá _30 %_ maximálního HP hrdiny a může si okamžitě vyměnit místo s hrdinou až do vzdálenosti _3 políček_.\n\n_+4:_ Stínový klon získá _40 %_ maximálního HP hrdiny a může si okamžitě vyměnit místo s hrdinou až do vzdálenosti _4 políček_.
actors.hero.talent.perfect_copy.title=dokonalá kopie
actors.hero.talent.point_blank.desc=_+1:_ Když Lovkyně použije svůj luk nebo vrhací zbraň na blízko, má _-25% přesnost,_ místo -50%.\n\n_+2:_ Když Lovkyně použije svůj luk nebo vrhací zbraň na blízko, má _normální přesnost,_ místo -50%.\n\n_+3:_ Když Lovkyně použije svůj luk nebo vrhací zbraň na blízko, má _+25% přesnost,_ místo -50%.\n\nVšimněte si, že vrhací zbraně nebo duchovní luk mají vždy +50% přesnost při použití na dálku.
actors.hero.talent.point_blank.title=bezprostředně
actors.hero.talent.precise_assault.desc=_+1:_ Když Duelist použije schopnost zbraně, získá během 5 kol _2x přesnost_ při svém dalším útoku zblízka.\n\n_+2:_ Když Duelist použije schopnost zbraně, získá během 5 kol _5x přesnost_ při svém dalším útoku zblízka.\n\n_+3:_ Když Duelist použije schopnost zbraně, získá během 5 kol _nekonečnou přesnost_ při svém dalším útoku zblízka.
actors.hero.talent.precise_assault.meta_desc=_Pokud tento talent získá jiný hrdina_, zvýší se přesnost boje zblízka o 10 % při +1, 20 % při +2 nebo 30 % při +3.
actors.hero.talent.precise_assault.title=přesný útok
actors.hero.talent.projectile_momentum.desc=_+1:_ Během volného běhu získává Freerunner _+50% přesnost a +15% poškození_ vrhacími zbraněmi.\n\n_+2:_ Během volného běhu získává Freerunner _+100% přesnost a +30% poškození_ vrhacími zbraněmi.\n\n_+3:_ Během volného běhu získává Freerunner _+150% přesnost a +45% poškození_ vrhacími zbraněmi.
actors.hero.talent.projectile_momentum.title=hybnost projektilu
actors.hero.talent.projecting_blades.desc=_+1:_ Spektrální čepele mají _+25% přesnost_ a mohou proniknout až _2 plnými dlaždicemi_.\n\n_+2:_ Spektrální čepele mají _+50% přesnost_ a mohou proniknout až _4 plnými dlaždicemi_.\n\n_+3:_ Spektrální čepele mají _+75% přesnost_ a mohou proniknout až _6 plnými dlaždicemi_.\n\n_+4:_ Spektrální čepele mají _+100% přesnost_ a mohou proniknout až _8 plnými dlaždicemi_.
actors.hero.talent.projecting_blades.title=vyčnívající čepele
actors.hero.talent.protective_shadows.desc=_+1:_ Zloděj získává jeden štít _každé druhé kolo_, kdy je neviditelný, _maximálně 3_.\n\n_+2:_ Zloděj získává jeden štít _každé kolo_ kdy je neviditelný, _maximálně 5_.
actors.hero.talent.protective_shadows.title=ochranné stíny
actors.hero.talent.provoked_anger.desc=_+1:_ Když je jakýkoli bonus štítu aplikovaný na Válečníka prolomen poškozením, jeho další fyzický útok způsobí _3 bonusové poškození_.\n\n_+2:_ Když je jakýkoli bonus štítu aplikovaný na Válečníka prolomen poškozením, jeho další fyzický útok způsobí _5 bonusového poškození_.
actors.hero.talent.provoked_anger.title=vyprovokoval hněv
actors.hero.talent.ratforcements.desc=_+1:_ Použitím ratmogrify na sobě _plodí 1_ spojeneckou vačnatou krysu vedle sebe.\n\n_+2:_ Použitím ratmogrify na sobě _plodí 2_ spojenecké vačnatce vedle sebe.\n\n_+3:_ Použitím ratmogrify na sobě _plodí 3_ spojenecké vačnatce vedle sebe.\n\n_+4:_ Použitím ratmogrify na sobě _plodí 4_ spojenecké vačnatce vedle sebe.
actors.hero.talent.ratforcements.title=krysích sil
actors.hero.talent.ratlomacy.desc=_+1:_ Použití krysokryptiky na krysokryptikovaném nepříteli ho učiní přátelským a jeho transformace trvalá.\n\n_+2:_ Použití krysokryptiky na krysokryptikovaném nepříteli ho učiní přátelským, jeho transformace trvalá a jeho _2 tahy_ adrenalinu.\n\n_+3:_ Použití krysokryptiky na krysokryptikovaném nepříteli ho učiní přátelským, jeho transformace trvalá a jeho _4 tahy_ adrenalinu.\n\n_+4:_ Použití krysokryptiky na krysokryptikovaném nepříteli ho učiní přátelským, jeho transformace trvalá a jeho _6 tahy_ adrenalinu.
actors.hero.talent.ratlomacy.title=krysalomacie
actors.hero.talent.ratsistance.desc=_+1:_ Nepřátelští nepřátelé potřísnění krysou způsobují _-10% poškození_.\n\n_+2:_ Nepřátelští nepřátelé potřísnění krysou způsobují _-19% poškození_.\n\n_+3:_ Nepřátelští nepřátelé potřísnění krysou způsobují _-27% poškození_.\n\n_+4:_ Nepřátelští nepřátelé potřísnění krysou způsobují _-35% poškození_.
actors.hero.talent.ratsistance.title=odolnost vůči krysám
actors.hero.talent.reactive_barrier.desc=_+1:_ Mág získá _2,5 štítu_ za každou postavu zasaženou elementárním výbuchem, maximálně však 5 postav.\n\n_+2:_ Mág získá _5 štítu_ za každou postavu zasaženou elementárním výbuchem, maximálně však 6 postav.\n\n_+3:_ Mág získá _7,5 štítu_ za každou postavu zasaženou elementárním výbuchem, maximálně však 7 postav.\n\n_+4:_ Mág získá _10 štítu_ za každou postavu zasaženou elementárním výbuchem, maximálně však 8 postav.
actors.hero.talent.reactive_barrier.title=reaktivní bariéra
actors.hero.talent.recall_inscription.desc=_+1:_ Klerik může seslat _Nápis vzpomínky_, kouzlo, které mu umožní zopakovat účinek posledního runového kamene nebo svitku, který použil během _10 kol._\n\n_+2:_ Klerik může seslat _Nápis vzpomínky_, kouzlo, které mu umožní zopakovat účinek posledního runového kamene nebo svitku, který použil během _300 kol._\n\nNápis vzpomínky nelze použít se svitky vylepšení. Cena nabití tohoto kouzla se liší v závislosti na tom, který předmět byl naposledy použit: 2 za runový kámen, 3 za svitek, 4 za exotický svitek. Tato cena nabití se také zdvojnásobí při použití se svitkem transmutace nebo alchymistickými předměty, které musí být vyrobeny pomocí transmutace nebo vylepšení.
actors.hero.talent.recall_inscription.meta_desc=_Pokud tento talent získá jiný hrdina_, vrátí hodnotu jakéhokoli svitku nebo runového kamene v 10 % případů s +1 nebo v 15 % případů s +2. Svitky vylepšení jsou z tohoto efektu vyňaty.
actors.hero.talent.recall_inscription.refunded=Vaše položka byla vrácena!
actors.hero.talent.recall_inscription.title=nápis na odvolání
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Když Lovkyně šlápne na krátkou trávu nebo uhlíky, vyskočí do vysoké trávy, kterou Lovkyně okamžitě ryje. Toto má _10kolovou přebíjecí dobu_.\n\n_+2:_ Když Lovkyně šlápne na krátkou trávu nebo uhlíky, vyskočí do vysoké trávy, kterou Lovkyně okamžitě ryje. Toto má _5kolovou přebíjecí dobu_.\n\nTento talent vytvoří ryjenou trávu, pokud jsou pasivní regenerační efekty vypnuty nebo hrdina dlouho nezískal zkušenosti.
actors.hero.talent.rejuvenating_steps.title=omlazující kroky
actors.hero.talent.remote_beacon.desc=_+1:_ Mág může umístit maják na libovolné místo do _4 políček_.\n\n_+2:_ Mág může umístit maják na libovolné místo do _8 políček_.\n\n_+3:_ Mág může umístit maják na libovolné místo do _12 políček_.\n\n_+4:_ Mág může umístit maják na libovolné místo do _16 políček_.\n\n Mág nemůže umístit majáky na místa, která jsou nepřístupná.
actors.hero.talent.remote_beacon.title=Vzdálený maják
actors.hero.talent.rogues_foresight.desc=_+1:_ Když se Zloděj nachází na úrovni s tajnou místností, má _75% šanci si všimnout_, že úroveň obsahuje tajemství.\n\n_+2:_ Když se Zloděj nachází na úrovni s tajnou místností, má _100% šanci si všimnout_, že úroveň obsahuje tajemství.
actors.hero.talent.rogues_foresight.title=darebákova předvídavost
actors.hero.talent.runic_transference.desc=_+1:_ Zlomená pečeť válečníka může přenášet _běžné glyfy_ stejným způsobem jako přenáší vylepšení.\n\n_+2:_ Zlomená pečeť válečníka může přenášet _běžné, silné a prokleté glyfy_ stejným způsobem jako přenáší vylepšení.\n\nPečeť může přenášet glyfy pouze tehdy, pokud byly aplikovány na brnění při připevnění pečeti.
actors.hero.talent.runic_transference.meta_desc=_Pokud tento talent získá jiný hrdina_, pomůže glyfům na vašem brnění odolat odstranění svitky vylepšení. Glyfy se začnou ztrácet při vylepšení z úrovně 6 (původně 4) na +1 nebo z úrovně 7 (původně 4) na +2. Úroveň, na které je ztráta glyfů zaručena, se nezměnila na +8.
actors.hero.talent.runic_transference.title=runový přenos
actors.hero.talent.satiated_spells.desc=_+1:_ Po jídle klerik získá _3 body štítu_ při příštím seslání kouzla.\n\n_+2:_ Po jídle klerik získá _5 bodů štítu_ při příštím seslání kouzla.
actors.hero.talent.satiated_spells.meta_desc=_Pokud tento talent získá jiný hrdina_, okamžitě mu poskytne štít, který se po 10 kolech začne normálně rozpadat.
actors.hero.talent.satiated_spells.title=Nasycená kouzla
actors.hero.talent.scholars_intuition.desc=_+1:_ Mág identifikuje hůlky _3x rychleji_.\n\n_+2:_ Mág identifikuje hůlky, _když je používá_.
actors.hero.talent.scholars_intuition.title=intuice učence
actors.hero.talent.searing_light.desc=_+1:_ Klerikovo fyzické útoky na nepřátele osvětlené _Vodícím světlem_ způsobují _+3 poškození._\n\n_+2:_ Klerikovo fyzické útoky na nepřátele osvětlené _Vodícím světlem_ způsobují _+5 poškození._
actors.hero.talent.searing_light.meta_desc=_Pokud tento talent získá jiný hrdina_, místo toho udělí bonusové poškození po použití hůlky nebo artefaktu na nepříteli s 20kolovou cooldownem.
actors.hero.talent.searing_light.title=Spalující světlo
actors.hero.talent.seer_shot.desc=_+1:_ Když Lovkyně vystřelí šíp na zem, poskytne jí to vidění v oblasti 3x3 kolem sebe na _5 kol_. Toto má 20kolovou cooldown.\n\n_+2:_ Když Lovkyně vystřelí šíp na zem, poskytne jí to vidění v oblasti 3x3 kolem sebe na _10 kol_. Toto má 20kolovou cooldown.\n\n_+3:_ Když Lovkyně vystřelí šíp na zem, poskytne jí to vidění v oblasti 3x3 kolem sebe na _15 kol_. Toto má 20kolovou cooldown.
actors.hero.talent.seer_shot.meta_desc=_Pokud tento talent získá jiný hrdina_, spustí se z jakékoli vržené zbraně.
actors.hero.talent.seer_shot.title=věštec výstřel
actors.hero.talent.shadow_blade.desc=_+1:_ Stínový klon získává _8 %_ poškození hrdiny za kolo a má _25% šanci_ použít kouzlo na hrdinovu zbraň.\n\n_+2:_ Stínový klon získává _16 %_ poškození hrdiny za kolo a má _50% šanci_ použít kouzlo na hrdinovu zbraň.\n\n_+3:_ Stínový klon získává _24 %_ poškození hrdiny za kolo a má _75% šanci_ použít kouzlo na hrdinovu zbraň.\n\n_+4:_ Stínový klon získává _32 %_ poškození hrdiny za kolo a má _100% šanci_ použít kouzlo na hrdinovu zbraň.
actors.hero.talent.shadow_blade.title=stínová čepel
actors.hero.talent.shadow_step.desc=_+1:_ Pokud zloděj použije dýmovnici, když je neviditelný, aktivuje se okamžitě a má o _16 % nižší_ náklady na nabití, ale také neoslepí nepřátele ani nespouští jiné talenty.\n\n_+2:_ Pokud zloděj použije dýmovnici, když je neviditelný, aktivuje se okamžitě a má o _30 % nižší_ náklady na nabití, ale také neoslepí nepřátele ani nespouští jiné talenty.\n\n_+3:_ Pokud zloděj použije dýmovnici, když je neviditelný, aktivuje se okamžitě a má o _41 % nižší_ náklady na nabití, ale také neoslepí nepřátele ani nespouští jiné talenty.\n\n_+4:_ Pokud zloděj použije dýmovnici, když je neviditelný, aktivuje se okamžitě a má o _50 % nižší_ náklady na nabití, ale také neoslepí nepřátele ani nespouští jiné talenty.
actors.hero.talent.shadow_step.title=stínový krok
actors.hero.talent.shared_enchantment.desc=_+1:_ Vrhací zbraně mají _33% šanci_ použít očarování na luku odstřelovače.\n\n_+2:_ Vrhací zbraně mají _67% šanci_ použít očarování na luku odstřelovače.\n\n_+3:_ Vrhací zbraně mají _100% šanci_ použít očarování na luku odstřelovače.\n\nOčarování luku se může spustit navíc k jakémukoli očarování, které již vrhaná zbraň má.
actors.hero.talent.shared_enchantment.title=sdílené okouzlení
actors.hero.talent.shared_upgrades.desc=_+1:_ Když odstřelovač útočí vylepšenou vrhací zbraní, každá úroveň zvyšuje trvání odstřelovací značky o 1 kolo a poškození jejího speciálního útoku o 16 %, maximálně však o _2 kola a +33 % poškození při +2_.\n\n_+2:_ Když odstřelovač útočí vylepšenou vrhací zbraní, každá úroveň zvyšuje trvání odstřelovací značky o 1 kolo a poškození jejího speciálního útoku o 16 %, maximálně však o _4 kola a +67 % poškození při +4_.\n\n_+3:_ Když odstřelovač útočí vylepšenou vrhací zbraní, každá úroveň zvyšuje trvání odstřelovací značky o 1 kolo a poškození jejího speciálního útoku o 16 %, maximálně však o _6 kola a +100 % poškození při +6_.
actors.hero.talent.shared_upgrades.title=sdílené upgrady
actors.hero.talent.shield_battery.desc=_+1:_ Mág se může zaměřit hůlkou a přeměnit všechny své náboje na štít rychlostí _4% maximálního HP na nabití_.\n\n_+2:_ Mág se může zaměřit hůlkou a přeměnit všechny své náboje na štít rychlostí _6% maximálního HP na nabití_.
actors.hero.talent.shield_battery.title=štítová baterie
actors.hero.talent.shield_of_light.desc=_+1:_ Klerik může seslat _Štít světla_, kouzlo, které je sesíláno okamžitě a poskytuje mu _2-4 brnění_ proti cíli na 5 kol za cenu 1 nabití.\n\n_+2:_ Klerik může seslat _Štít světla_, kouzlo, které je sesíláno okamžitě a poskytuje mu _3-6 brnění_ proti cíli na 5 kol za cenu 1 nabití.
actors.hero.talent.shield_of_light.meta_desc=_Pokud tento talent získá jiný hrdina_, sníží fyzické poškození, které cílový nepřítel utrpěl, o 1, 33 % při +1 nebo 50 % při +2.
actors.hero.talent.shield_of_light.title=štít světla
actors.hero.talent.shielding_dew.desc=_+1:_ Kapky rosy mohou chránit Strážkyni, když je její zdraví plné, až do výše _20 % jejího maximálního HP_.\n\n_+2:_ Kapky rosy mohou chránit Strážkyni, když je její zdraví plné, až do výše _40 % jejího maximálního HP_.\n\n_+3:_ Kapky rosy mohou chránit Strážkyni, když je její zdraví plné, až do výše _60 % jejího maximálního HP_.
actors.hero.talent.shielding_dew.title=ochranná rosa
actors.hero.talent.shock_force.desc=_+1:_ Rázová vlna způsobuje _o _20 % více poškození_ a má _25% šanci_ omráčit místo zmrzačení.\n\n_+2:_ Rázová vlna způsobuje _o _40 % více poškození_ a má _50% šanci_ omráčit místo zmrzačení.\n\n_+3:_ Rázová vlna způsobuje _o _60 % více poškození_ a má _75% šanci_ omráčit místo zmrzačení.\n\n_+4:_ Rázová vlna způsobuje _o _80 % více poškození_ a má _100% šanci_ omráčit místo zmrzačení.
actors.hero.talent.shock_force.title=rázová síla
actors.hero.talent.shrug_it_off.desc=_+1:_ Snížení poškození válečníka během výdrže je _zvýšeno na 60 %_, z 50 %.\n\n_+2:_ Snížení poškození válečníka během výdrže je _zvýšeno na 68 %_, z 50 %.\n\n_+3:_ Snížení poškození válečníka během výdrže je _zvýšeno na 74 %_, z 50 %.\n\n_+4:_ Snížení poškození válečníka během výdrže je _zvýšeno na 80 %_, z 50 %.
actors.hero.talent.shrug_it_off.title=pokrčit to rameny
actors.hero.talent.silent_steps.desc=_+1:_ Zloděj neprobudí spící nepřátele, pokud je od nich _3 nebo více políček_.\n\n_+2:_ Zloděj neprobudí spící nepřátele, pokud _není vedle nich_.
actors.hero.talent.silent_steps.title=tiché kroky
actors.hero.talent.soul_eater.desc=_+1:_ Znamení duše poskytuje _0,33 kola_ sytosti za každé způsobené fyzické poškození. Nepřátelé označení duší mají _10% šanci_ spustit efekty při jídle po smrti.\n\n_+2:_ Znamení duše poskytuje _0,67 kola_ sytosti za každé způsobené fyzické poškození. Nepřátelé označení duší mají _20% šanci_ spustit efekty při jídle po smrti.\n\n_+3:_ Znamení duše poskytuje _1 kolo_ sytosti za každé způsobené fyzické poškození. Nepřátelé označení duší mají _30% šanci_ spustit efekty při jídle po smrti.
actors.hero.talent.soul_eater.title=požírač duší
actors.hero.talent.soul_siphon.desc=_+1:_ Fyzické poškození způsobené jinými postavami spustí Warlockovo znamení duše s _13% účinností_.\n\n_+2:_ Fyzické poškození způsobené jinými postavami spustí Warlockovo znamení duše s _27% účinností_.\n\n_+3:_ Fyzické poškození způsobené jinými postavami spustí Warlockovo znamení duše s _40% účinností_.
actors.hero.talent.soul_siphon.title=sifon duše
actors.hero.talent.speedy_stealth.desc=_+1:_ Freerunner získává 2 stupně hybnosti za kolo, když je neviditelný.\n\n_+2:_ Kromě výhod +1 se freerunner již neodpočítává, když je Freerunner neviditelný.\n\n_+3:_ Kromě výhod +1 a +2 se Freerunner pohybuje 2x rychleji, když je neviditelný, bez ohledu na to, zda freerunner běží či nikoli.
actors.hero.talent.speedy_stealth.title=rychlé nenápadné
actors.hero.talent.spirit_blades.desc=_+1:_ Spektrální čepele mají _30% šanci_ použít kouzlo i na duchovní luk.\n\n_+2:_ Spektrální čepele mají _60% šanci_ použít kouzlo i na duchovní luk.\n\n_+3:_ Spektrální čepele mají _90% šanci_ použít kouzlo i na duchovní luk.\n\n_+4:_ Spektrální čepele mají _100% šanci_ použít kouzlo i na duchovní luk a každému kouzlu dávají _+10% sílu_.
actors.hero.talent.spirit_blades.title=duchovní čepele
actors.hero.talent.spirit_form.desc=Klerik může seslat _Duchovní podobu_, která propůjčí Trojici sílu prstenu nebo artefaktu, který Klerik v tomto běhu identifikoval (kromě svatého svazku), za cenu 4 nabití. \n\n_+1:_ Při použití Trojice získá Klerik efekt prstenu s bodem _+1_ na 20 kol nebo spustí efekt artefaktu s bodem _+4._\n\n_+2:_ Při použití Trojice získá Klerik efekt prstenu s bodem _+2_ na 20 kol nebo spustí efekt artefaktu s bodem _+6._\n\n_+3:_ Při použití Trojice získá Klerik efekt prstenu s bodem _+3_ na 20 kol nebo spustí efekt artefaktu s bodem _+3_ _+8._\n\n_+4:_ Při použití Trojice získá Klerik efekt prstenu s hodnotou _+4_ na 20 kol nebo spustí efekt artefaktu s hodnotou _+10._\n\nTrojici lze naplnit pouze jedním duchovním efektem najednou. Artefakty mají při aktivaci Trojicí různé efekty a náklady na nabití brnění.
actors.hero.talent.spirit_form.title=duchovní forma
actors.hero.talent.stasis.desc=Kněz může seslat _Stázu_ na posíleného spojence za cenu 2 nabití. Stáza dočasně odstraní spojence z podzemí a zachová zbývající čas na všech vylepšeních, včetně Moci mnoha. Spojenec se znovu objeví vedle vás, jakmile efekt skončí. Stázu lze okamžitě a bezplatně znovu seslat, aby se efekt předčasně ukončil. Stáze působí na nehybné spojence, ale nelze je přesouvat mezi patry podzemí.\n\n_+1:_ Stáze trvá maximálně _60 kol._\n\n_+2:_ Stáze trvá maximálně _90 kol._\n\n_+3:_ Stáze trvá maximálně _120 kol._\n\n_+4:_ Stáze trvá maximálně _150 kol._\n\nKlerik může také seslat Paprsek záření, když je spojenec ve stázi, aby ho znovu přivolal, nebo seslat Životní spojení, aby preventivně aplikoval jeho efekt. Spojenci však ve stázi z Životního spojení nemají prospěch.
actors.hero.talent.stasis.title=stáze
actors.hero.talent.strengthening_meal.desc=_+1:_ Snědením jídla získá Duelistka bonusové poškození 3 body při dalších _2 zasaženích_ nepřítele fyzickým útokem.\n\n_+2:_ Snědením jídla získá Duelistka bonusové poškození 3 body při dalších _3 zasaženích_ nepřítele fyzickým útokem.
actors.hero.talent.strengthening_meal.title=posilující jídlo
actors.hero.talent.striking_force.desc=_+1:_ Síla efektu elementárního úderu se zvyšuje o _30%_.\n\n_+2:_ Síla efektu elementárního úderu se zvyšuje o _60%_.\n\n_+3:_ Síla efektu elementárního úderu se zvyšuje o _90%_.\n\n_+4:_ Síla efektu elementárního úderu se zvyšuje o _120%_.
actors.hero.talent.striking_force.title=úderná síla
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave má _30% šanci_ použít také efekty při zásahu, jako jsou očarování a komba.\n\n_+2:_ Shockwave má _60% šanci_ použít také efekty při zásahu, jako jsou očarování a komba.\n\n_+3:_ Shockwave má _90% šanci_ použít také efekty při zásahu, jako jsou očarování a komba.\n\n_+4:_ Shockwave má _100% šanci_ použít také efekty při zásahu, jako jsou očarování a komba, a dává očarováním _+20% sílu_.
actors.hero.talent.striking_wave.title=úderná vlna
actors.hero.talent.strongman.desc=_+1:_ Síla válečníka je _zvýšena o 8 %_, zaokrouhleno dolů.\n\n_+2:_ Síla válečníka je _zvýšena o 13 %_, zaokrouhleno dolů.\n\n_+3:_ Síla válečníka je _zvýšena o 18 %_, zaokrouhleno dolů.
actors.hero.talent.strongman.title=silák
actors.hero.talent.sucker_punch.desc=_+1:_ Zloděj způsobí _1-2 bonusové poškození_ při prvním překvapivém útoku na nepřítele.\n\n_+2:_ Zloděj způsobí _2 bonusové poškození_ při prvním překvapivém útoku na nepřítele.
actors.hero.talent.sucker_punch.title=přísavka
actors.hero.talent.sunray.desc=_+1:_ Klerik může seslat _Sluneční paprsek_, kouzlo, které způsobí _4-8 bodů poškození_ a oslepí cíl na _4 kola,_ za cenu 1 nabití.\n\n_+2:_ Klerik může seslat _Sluneční paprsek_, kouzlo, které způsobí _6-12 bodů poškození_ a oslepí cíl na _6 kola,_ za cenu 1 nabití.\n\nSluneční paprsek může oslepit každý cíl pouze jednou, ale pokud je cíl již oslepen Slunečním paprskem, pak ho místo toho paralyzuje. Sluneční paprsek vždy způsobuje maximální poškození démonickým a nemrtvým nepřátelům.
actors.hero.talent.sunray.meta_desc=_Pokud tento talent získá jiný hrdina_, způsobí, že hůlky a artefakty oslepí nepřátele na 4 kola, 15 % případů s +1 nebo 25 % případů s +2.
actors.hero.talent.sunray.title=sluneční paprsek
actors.hero.talent.survivalists_intuition.desc=_+1:_ Lovkyně identifikuje vrhané zbraně _3x rychleji_.\n\n_+2:_ Lovkyně identifikuje vrhané zbraně, _když s nimi zasáhne_.
actors.hero.talent.survivalists_intuition.title=intuice přeživšího
actors.hero.talent.sustained_retribution.desc=_+1:_ Válečník způsobí _115% bonusové poškození_ rozložené na _2 zásahy_, namísto 100% bonusového poškození v 1 zásahu.\n\n_+2:_ Válečník způsobí _130% bonusové poškození_ rozložené na _3 zásahy_, namísto 100% bonusového poškození v 1 zásahu.\n\n_+3:_ Válečník způsobí _145% bonusové poškození_ rozložené na _4 zásahy_, namísto 100% bonusového poškození v 1 zásahu.\n\n_+4:_ Válečník způsobí _160% bonusové poškození_ rozložené na _5 zásahů_, namísto 100% bonusového poškození v 1 zásahu.
actors.hero.talent.sustained_retribution.title=trvalá odplata
actors.hero.talent.swift_equip.desc=_+1:_ Duelistka může okamžitě vyměnit svou vybavenou zbraň _jednou_ každých 20 kol.\n\n_+2:_ Duelistka může okamžitě vyměnit svou vybavenou zbraň _dvakrát_ každých 20 kol.\n\nPokud má Duelistka tento talent a nemá přebíjecí dobu, rychlé použití nevybavené zbraně jej vybaví.
actors.hero.talent.swift_equip.title=rychlé vybavení
actors.hero.talent.swift_spirit.desc=_+1:_ Rychlost pohybu duchovního jestřába se zvýší z 2 na _2,5 políčka_ a je zaručeno, že se uhne prvním _2 útokům_ proti němu.\n\n_+2:_ Rychlost pohybu duchovního jestřába se zvýší z 2 na _3 políčka_ a je zaručeno, že se uhne prvním _4 útokům_ proti němu.\n\n_+3:_ Rychlost pohybu duchovního jestřába se zvýší z 2 na _3,5 políčka_ a je zaručeno, že se uhne prvním _6 útokům_ proti němu.\n\n_+4:_Rychlost pohybu duchovního jestřába se zvýší z 2 na _4 políčka_ a je zaručeno, že se uhne prvním _8 útokům_ proti němu.
actors.hero.talent.swift_spirit.title=rychlý duch
actors.hero.talent.telefrag.desc=_+1:_ Pokud se Mág promění v jinou postavu, způsobí jí _10-15 poškození_, ale také utrpí _5 poškození_.\n\n_+2:_ Pokud se Mág promění v jinou postavu, způsobí jí _20-30 poškození_, ale také utrpí _10 poškození_.\n\n_+3:_ Pokud se Mág promění v jinou postavu, způsobí jí _30-45 poškození_, ale také utrpí _15 poškození_.\n\n_+4:_ Pokud se Mág promění v jinou postavu, způsobí jí _40-60 poškození_, ale také utrpí _20 poškození_.\n\n Hrdinu nelze tímto talentem zabít, poškození sobě lze snížit efekty odolnosti vůči magii.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Zloděj identifikuje prsteny _2x rychleji_ a identifikuje typ prstenu _když si ho nasadí_.\n\n_+2:_ Zloděj identifikuje prsteny _když si je nasadí_ a identifikuje typ prstenu _když si ho zvedne_.
actors.hero.talent.thiefs_intuition.title=zlodějova intuice
actors.hero.talent.twin_upgrades.desc=_+1:_ Pokud má jedna ze dvou zbraní Šampiona nižší úroveň a je o _2 nebo více úrovní nižší_ než druhá zbraň, bude vylepšena na úroveň druhé zbraně.\n\n_+2:_ Pokud má jedna ze dvou zbraní Šampiona nižší úroveň a je o _1 nebo více úrovní nižší_ než druhá zbraň, bude vylepšena na úroveň druhé zbraně.\n\n_+3:_ Pokud má jedna ze dvou zbraní Šampiona nižší úroveň a je _stejné nebo nižší úrovně_ než druhá zbraň, bude vylepšena na úroveň druhé zbraně.
actors.hero.talent.twin_upgrades.title=dvojitá vylepšení
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Mnich získá _o _50 % více energie_ za každý kus vybavení _3. úrovně nebo nižší_, který používá.\n\n_+2:_ Mnich získá _o _75 % více energie_ za každý kus vybavení _2. úrovně nebo nižší_, který používá. Výhoda 3. úrovně zůstává nezměněna.\n\n_+3:_ Mnich získá _o _100 % více energie_ za každý kus vybavení _1. úrovně nebo nižší_, který používá. Výhody 2. a 3. úrovně zůstávají nezměněny. Také získá zdarma látkové brnění a rukavice s cvočky.\n\nUpozorňujeme, že tento talent neposkytuje žádnou výhodu z toho, že je neozbrojen nebo útočí Prstenem síly.
actors.hero.talent.unencumbered_spirit.title=nespoutaný duch
actors.hero.talent.varied_charge.desc=_+1:_ Šampion okamžitě získá zpět _0,17 náboje zbraně_, když použije dvě různé schopnosti zbraně, bez časového omezení.\n\n_+2:_ Šampion okamžitě získá zpět _0,33 náboje zbraně_, když použije dvě různé schopnosti zbraně, bez časového omezení.\n\n_+3:_ Šampion okamžitě získá zpět _0,5 náboje zbraně_, když použije dvě různé schopnosti zbraně, bez časového omezení.
actors.hero.talent.varied_charge.title=různorodý náboj
actors.hero.talent.veterans_intuition.desc=_+1:_ Válečník identifikuje zbraně _1,75x rychleji_ a brnění _2,5x rychleji_.\n\n_+2:_ Válečník identifikuje zbraně _2,5x rychleji_ a brnění _když si ho nasadí_.
actors.hero.talent.veterans_intuition.title=intuice veterána
actors.hero.talent.wall_of_light.desc=_+1:_ Paladin může seslat _Zeď světla,_ kouzlo, které před Paladinem vytvoří _3 políčka širokou_ pevnou zeď, která odtlačuje nepřátele a trvá 20 kol, za cenu 3 nabití.\n\n_+2:_ Paladin může seslat _Zeď světla,_ kouzlo, které před Paladinem vytvoří _5 políček širokou_ pevnou zeď, která odtlačuje nepřátele a trvá 20 kol, za cenu 3 nabití.\n\n_+3:_ Paladin může seslat _Zeď světla,_ kouzlo, které před Paladinem vytvoří _7 políček širokou_ pevnou zeď, která odtlačuje nepřátele a trvá 20 kol, za cenu 3 nabití.\n\nZeď může být umístěna kardinálně nebo diagonálně, v danou chvíli může existovat pouze jedna zeď.
actors.hero.talent.wall_of_light.title=stěna světla
actors.hero.talent.wand_preservation.desc=_+1:_ Když Mág vloží do své hole novou hůlku, stará hůlka se vrátí s +0, _ale to lze provést pouze jednou._\n\n_+2:_ Když Mág vloží do své hole novou hůlku, stará hůlka se vrátí s +0, _toto lze opakovat s cooldownem o úroveň jednoho hrdiny._
actors.hero.talent.wand_preservation.meta_desc=_Pokud tento talent získá jiný hrdina_, zvýší se množství arkánní pryskyřice získané při vložení hůlky do alchymistického hrnce o 1 při +1 nebo o 2 při +2.
actors.hero.talent.wand_preservation.title=konzervace hůlky
actors.hero.talent.weapon_recharging.desc=_+1:_ Duelista získává jedno nabití zbraně každých _15 kol_, když je pod vlivem buffů pro dobíjení hůlky nebo artefaktu.\n\n_+2:_ Duelista získává jedno nabití zbraně každých _10 kol_, když je pod vlivem buffů pro dobíjení hůlky nebo artefaktu.
actors.hero.talent.weapon_recharging.meta_desc=_Pokud tento talent získá jiný hrdina_, způsobí, že při dobíjení s +1 způsobí +5 % poškození zblízka, nebo +7,5 % poškození zblízka při dobíjení s +2.
actors.hero.talent.weapon_recharging.title=nabíjení zbraně
actors.hero.talent.wide_search.desc=_+1:_ Dosah vyhledávání Zloděje se zvětšil ze čtverce 5x5 na kruh _7x7_.\n\n_+2:_ Dosah vyhledávání Zloděje se zvětšil ze čtverce 5x5 na čtverce _7x7_.
actors.hero.talent.wide_search.meta_desc=_Pokud tento talent získá jiný hrdina_, zvýší se mu rádius hledání z čtverce 3x3 na kruh 5x5 s +1, nebo na čtverec 5x5 s +2.
actors.hero.talent.wide_search.title=široké vyhledávání
actors.hero.talent.wild_momentum.desc=_+1:_ Zabití nepřítele duchovním lukem prodlouží trvání síly přírody o _1 kolo_. Trvání lze prodloužit maximálně o _2 kola_.\n\n_+2:_ Zabití nepřítele duchovním lukem prodlouží trvání síly přírody o _2 kola_. Trvání lze prodloužit maximálně o _4 kola_.\n\n_+3:_ Zabití nepřítele duchovním lukem prodlouží trvání síly přírody o _3 kola_. Trvání lze prodloužit maximálně o _6 kola_.\n\n_+4:_ Zabití nepřítele duchovním lukem prodlouží trvání síly přírody o _4 kola_. Trvání lze prodloužit maximálně o _8 kola_.
actors.hero.talent.wild_momentum.title=divoká hybnost
actors.hero.talent.wild_power.desc=_+1:_ Při použití divoké magie budou hůlky posíleny o _2 nebo 3, až do +4_.\n\n_+2:_ Při použití divoké magie budou hůlky posíleny o _3, až do +5_.\n\n_+3:_ Při použití divoké magie budou hůlky posíleny o _3 nebo 4, až do +6_.\n\n_+4:_ Při použití divoké magie budou hůlky posíleny o _4, až do +7_.
actors.hero.talent.wild_power.title=divoká síla
actors.mobs.acidic.desc=Tito obrovští démoničtí tvorové, podobní pavoukovcům, se vyhýbají boji zblízka a raději střílejí ochromující vroubkované hroty z velké vzdálenosti. Zdá se, že z tohoto kape korozivní sliz.
actors.mobs.acidic.name=kyselý štír
actors.mobs.albino.desc=Jedná se o vzácné plemeno vačnatce krysy s čistě bílou srstí a rozeklanými zuby.
actors.mobs.albino.discover_hint=Tohoto nepřítele můžete jen zřídka najít v určité oblasti dungeonu.
actors.mobs.albino.name=albínská krysa
actors.mobs.armoredbrute.desc=Nejstarší gnollští brutáři často nosí silné brnění, aby ukázali své postavení. Brnění je činí mnohem odolnějšími vůči fyzickému poškození a jejich větší disciplína jim umožňuje zuřit mnohem déle, než podlehnou svým zraněním.
actors.mobs.armoredbrute.name=obrněný bestie
actors.mobs.armoredstatue.desc=Člověk by si myslel, že je to jen další z neživých soch z tohoto jeskyně, ale její rudě zářící oči to prozrazují. \n\nZdá se, že je ve skvělém stavu, díky brnění, které má na sobě, by ho mohlo být velmi těžké zabít.
actors.mobs.armoredstatue.desc_arm_wep=I když je samotná socha vyrobena z kamene, _%1$s_ a _%2$s_, které drží, vypadají jako skutečné.
actors.mobs.armoredstatue.name=obrněná socha
actors.mobs.bandit.desc=Hlubší úrovně podzemí byly vždy úkrytem pro nejrůznější zločince. Ne všichni z nich si dokázali udržet jasnou mysl během delšího pobytu tak daleko od denního světla. Tito šílení zloději a bandité už dávno zapomněli, kdo jsou a proč kradou.
actors.mobs.bandit.name=šílený bandita
actors.mobs.bat.desc=Tito čilí a houževnatí obyvatelé jeskyní jsou mnohem nebezpečnější, než se zdá. S každým úspěšným útokem si doplňují zdraví, což jim umožňuje porazit mnohem větší soupeře.
actors.mobs.bat.name=upíří netopýr
actors.mobs.bee.desc=Navzdory své malé velikosti mají zlaté včely tendenci svůj domov zuřivě chránit. Tato je velmi zuřivá, raději si od ní držte odstup.
actors.mobs.bee.desc_honey=Navzdory své malé velikosti mají zlaté včely tendenci svůj domov zuřivě chránit. Tato byla uklidněna a zdá se, že vás chce následovat.
actors.mobs.bee.discover_hint=Tuto postavu najdete s konkrétním předmětem.
actors.mobs.bee.name=zlatá včela
actors.mobs.brute$bruterage.desc=Tento gnollský brutální tvor umírá, ale chce si tě vzít s sebou!\n\n Brutální tvor zemře, jakmile jeho štít vyprchá, buď časem, nebo pokud je poškozen. Mezitím bude způsobovat enormně zvýšené poškození, takže pozor!\n\nZbývající štít: %d.
actors.mobs.brute$bruterage.name=hrubý vztek
actors.mobs.brute.def_verb=zablokováno
actors.mobs.brute.desc=Hromotluci jsou největší, nejsilnější a nejodolnější ze všech gnollů. Když jsou těžce zraněni, propadnou zuřivosti a způsobují nepřátelům ještě větší zranění.
actors.mobs.brute.enraged=rozzuřený
actors.mobs.brute.name=gnollský hromotluk
actors.mobs.causticslime.desc=Zdá se, že tento sliz byl poskvrněn temnou magií vycházející zespodu. Ztratil svou obvyklou zelenou barvu a kape z něj žíravý sliz.
actors.mobs.causticslime.discover_hint=Tohoto nepřítele můžete jen zřídka najít v určité oblasti dungeonu.
actors.mobs.causticslime.name=žíravý sliz
actors.mobs.crab.desc=Tito obrovští krabi se nacházejí na vrcholu potravního řetězce v kanalizaci. Jsou extrémně rychlí a jejich tlustý krunýř vydrží i těžké údery.
actors.mobs.crab.name=kanalizační krab
actors.mobs.crystalguardian.def_verb=zablokováno
actors.mobs.crystalguardian.desc=Tito velcí krystaloví strážci vypadají téměř jako sochy, nebýt jejich jasně zářících očí. Tvrzený krystal, ze kterého jsou vyrobeni, je činí pomalými, ale velmi odolnými, takže je nejlepší nechat je spát v jejich krystalovém hnízdě co nejdéle._\n\nVzhledem ke své velikosti se krystaloví strážci v uzavřených prostorách pohybují mnohem pomaleji. Jsou také tak odolní, že je nemožné je rovnou zabít. Dají se srazit a dočasně zneškodnit, ale po chvíli se prostě znovu postaví.
actors.mobs.crystalguardian.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.crystalguardian.name=krystalový strážce
actors.mobs.crystalmimic.ate=Napodobitel ti snědl %s!
actors.mobs.crystalmimic.desc=Mimikové jsou magické bytosti, které mohou na sebe vzít jakoukoli podobu. V dungeonech si téměř vždy vyberou tvar truhly s pokladem, aby nalákali nic netušící dobrodruhy. \n\nKrystaloví mimikové jsou lstivější než jejich běžní příbuzní a při krádeži kořisti se raději vyhýbají konfliktům. Jakmile jsou objeveni, pokusí se utéct a při útoku dokáží nepřátele přesunout.
actors.mobs.crystalmimic.escaped=Krystalový napodobitel utekl!
actors.mobs.crystalmimic.name=krystalový napodobovatel
actors.mobs.crystalspire.alert=Vibrace sílí a duní celou jeskyní!
actors.mobs.crystalspire.desc=Tato gigantická věž z ultra tvrdého krystalu je pravděpodobně zdrojem všech podivných krystalických tvorů v této jeskyni. Vaše běžné zbraně jsou proti ní neúčinné, takže pokud ji chcete zničit, budete muset použít krumpáč.\n\n_Než se do ní pustíte, ujistěte se, že jste připraveni._ Těžba tak velkého krystalu bude pravděpodobně chvíli trvat a pravděpodobně to nebudete moci udělat nerušeně. Samotná věž může mít dokonce i nějaké prostředky k obraně. _Možná by se útoky věže daly použít proti jejím přisluhovačům._
actors.mobs.crystalspire.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.crystalspire.name=křišťálová věž
actors.mobs.crystalspire.warning=Krystal vibruje, když do něj udeříte. Pokud to tak budete dělat, jistě na vás upoutá pozornost...
actors.mobs.crystalwisp.beam_kill=Paprsek světla tě zabil...
actors.mobs.crystalwisp.desc=Malý, rozzlobený, plovoucí kus ztvrdlého krystalu, který vydává jasnou záři. I když nejsou nijak zvlášť silné, křišťálové obláčky na vás vystřelí ničivý paprsek světla, pokud mají volný záměr. \n\n Obláčky jsou dostatečně malé na to, aby se snadno pohybovaly různými křišťálovými výběžky, ale nemohou skrz ně vystřelit.
actors.mobs.crystalwisp.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.crystalwisp.name=křišťálový obláček
actors.mobs.demonspawner.desc=Tato zkroucená směs trpasličích těl je zodpovědná za vytváření démonů roztrhávačů z trpaslíků, kteří v této oblasti zemřeli. Démoni zjevně nevidí problém v tom, aby proti svým nepřátelům využili všechny dostupné zdroje.\n\nI když jsou démoni vizuálně děsiví, nemají žádnou možnost se pohybovat ani přímo bránit. Jejich značná hmotnost je však ztěžuje jejich rychlé zabití a roztrhávače budou plodit rychleji, když jsou v ohrožení.\n\n_Démoni se zdají být spojeni s nějakým centrálním zdrojem démonické síly. Jejich zabití ji může oslabit._
actors.mobs.demonspawner.name=ploditel démonů
actors.mobs.demonspawner.on_death=Démonická energie zde jako by slábla s tím, jak třáseň umírá.
actors.mobs.dm100.desc=DM-100 je raný model trpasličího „obranného stroje“, který byl navržen k ochraně trpasličích horníků v jeskyních pod touto věznicí. Jejich elektrické šoky se však ukázaly jako příliš slabé, a proto byly darovány lidskému městu nahoře. Po léta nebyly používány a nakonec se dostaly do vězení, kde je dozorce zpočátku považoval za příliš kruté na to, aby je používal. Jakmile se však vězni stali neukázněnějšími, stali se nezbytností.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Zabil tě blesk...
actors.mobs.dm200.desc=DM-200 je druhá generace trpasličího „obranného stroje“, který byl navržen k ochraně trpasličích horníků v jeskyních a městě pod nimi. Jsou mnohem větší a mohutnější než jejich předchůdci a útočí ničivými hydraulickými pěstmi.\n\nJejich zvětšená velikost je také jejich hlavní slabinou, protože se nemohou vejít do úzkých tunelů a dveří podzemí. Trpaslíci byli schopni kompenzovat nedostatek mobility DM-200 tím, že jim umožnilo vypouštět své toxické výfukové plyny na vzdálené nepřátele nebo na nepřátele, na které se nemohou dostat.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=DM-200 vystřeluje proud toxických výfukových plynů!
actors.mobs.dm201.desc=Trpaslíci krátce experimentovali s větším důrazem na nedostatek mobility DM-200 a vytvořili několik modelů DM, které jsou zcela stacionární. DM-201 je modernizovaná verze DM-200, která funguje jako strážní věž bez možnosti pohybu. Výměnou za nedostatek mobility mají DM-201 výrazně větší odolnost a útočnou sílu. \n\nA Protože DM-201 nemají motor pro odvod výfukových plynů, trpaslíci je místo toho vybavili granáty s korozivním plynem! DM-201 jsou však s těmito granáty opatrní a vrhají je pouze při útoku z dálky.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=DM-201 vrhá korozivní granát!
actors.mobs.dm300.charge_lost=PYLON ZNIČEN! NÁVRAT K MÍSTNÍ NAPÁJENÍ!
actors.mobs.dm300.charging=UTRPĚNÍ POŠKOZENÍ! AKTIVACE ENERGETICKÉHO PYLONU!
actors.mobs.dm300.charging_hint=DM-300 je nezranitelný, dokud je napájen pylonem!
actors.mobs.dm300.def_verb=zablokováno
actors.mobs.dm300.defeated=KRITICKÉ POŠKOZENÍ! POKUS O UZAVŘENÍ-
actors.mobs.dm300.desc=Tento stroj postavili trpaslíci před několika staletími. Později začali stroje nahrazovat golemy, elementály, a dokonce i démony. To nakonec vedlo k úpadku jejich civilizace. DM-300 a podobné stroje sloužily hlavně ke stavbě a těžbě, někdy také k obraně města.
actors.mobs.dm300.desc_supercharged=DM-300 je momentálně nabitý elektrickou energií. V této formě nemůže být DM-300 poškozen a pohybuje se dvojnásobnou rychlostí! Navíc se jeho vrták nyní otáčí dostatečně rychle, aby dokázal _prorazit tunely pevnou horninou_, i když se při tom pohybuje mnohem pomaleji.\n\nPřímý útok na DM-300 je zbytečný, dokud je přeplněný, ale _něco v oblasti mu musí tuto energii dodávat_, což ho může zničit a oslabit.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=ZJIŠTĚN PŘÍSTUP NEOPRÁVNĚNÉ OSOBY!
actors.mobs.dm300.pylons_destroyed=VÝSTRAHA! V ELEKTRICKÉ SÍTI ZJIŠTĚNA NESTABILITA!
actors.mobs.dm300.rankings_desc=Rozdrcen DM-300
actors.mobs.dm300.shield=DM-300 odebírá energii z obnažených vodičů a sám se stíní!
actors.mobs.dm300.supercharged=ZNIČIT! ZNIČIT! ZNIČIT!
actors.mobs.dwarfking$dkghoul.rankings_desc=Padl před králem trpaslíků
actors.mobs.dwarfking$dkgolem.rankings_desc=Padl před králem trpaslíků
actors.mobs.dwarfking$dkmonk.rankings_desc=Padl před králem trpaslíků
actors.mobs.dwarfking$dkwarlock.rankings_desc=Padl před králem trpaslíků
actors.mobs.dwarfking.defeated=Všechny jsi... nás odsoudil k záhubě...
actors.mobs.dwarfking.desc=Před mnoha lety jeden z nejvyšších čarodějů trpasličího dvora odhalil tajemství, která mu dala obrovskou moc nad životem a smrtí. Brzy tuto moc využil k podrobení a zkažení svých vrstevníků, svého krále a nakonec všech trpasličích občanů. Nyní je králem, vládcem nad legií nemrtvých poddaných. \n\nKrál trpaslíků je agresivní nepřítel, který se bude snažit obklíčit a přemoci své nepřátele hordou nemrtvých přisluhovačů.
actors.mobs.dwarfking.enraged=Nemůžeš mě zabít, %s. JSEM. NESMRTELNÝ!
actors.mobs.dwarfking.lifelink_1=Potřebuji tvou esenci, otroku!
actors.mobs.dwarfking.lifelink_2=Krvácej pro mě, otroku!
actors.mobs.dwarfking.losing=Ne! Tohle nemůžeš udělat... nemáš tušení, co leží dole...
actors.mobs.dwarfking.name=Král trpaslíků
actors.mobs.dwarfking.notice=Jak se opovažuješ! Nemáš tušení, do čeho se pleteš!
actors.mobs.dwarfking.rankings_desc=Padl před králem trpaslíků
actors.mobs.dwarfking.teleport_1=Vypořádej se s nimi, otroku!
actors.mobs.dwarfking.teleport_2=Zaměstnej je, otroku!
actors.mobs.dwarfking.wave_1=Dost! Vstaňte, moji otroci!
actors.mobs.dwarfking.wave_2=Víc! Krvácejte pro svého krále!
actors.mobs.dwarfking.wave_3=K ničemu! ZABÍJEJTE JE HNED!
actors.mobs.ebonymimic.desc=Mimikové jsou magická stvoření, která mohou na sebe vzít jakoukoli podobu. V dungeonech si téměř vždy vyberou tvar truhly s pokladem, aby nalákali nic netušící dobrodruhy. \n\nEbenoví mimikové jsou nenápadní mimikové se schopností stát se téměř neviditelnými. Číhají na věcech, se kterými dobrodruzi pravděpodobně interagují, ale také obsahují vlastní kořist. Jakmile jsou objeveni, nejsou o nic odolnější než běžní mimikové, ale jejich překvapivé kousnutí je zničující.
actors.mobs.ebonymimic.discover_hint=Tohoto nepřítele najdete pomocí specifického drobného předmětu.
actors.mobs.ebonymimic.hidden_desc=Zdá se, že tu něco je, ale je to téměř úplně průhledné.
actors.mobs.ebonymimic.hidden_name=podezřelý obrys
actors.mobs.ebonymimic.name=napodobitel ebenu
actors.mobs.ebonymimic.reveal=Byl tam napodobitel!
actors.mobs.elemental$chaoselemental.desc=Elementálové jsou chaotické bytosti, které často vznikají, když mocná okultní magie není správně ovládána. Elementálové mají minimální inteligenci a obvykle jsou spojováni s určitým typem magie. \n\nElementálové chaosu jsou vzácní a nebezpeční elementálové, kteří se nestabilizovali na konkrétní element. Při útoku vypustí divokou a nepředvídatelnou magii.
actors.mobs.elemental$chaoselemental.name=elementární chaos
actors.mobs.elemental$fireelemental.desc=Elementálové jsou chaotičtí tvorové, kteří často vznikají, když není mocná okultní magie správně ovládána. Elementálové mají minimální inteligenci a obvykle jsou spojováni s určitým typem magie. \n\nOhnivé elementály jsou běžným typem elementálů, kteří způsobují poškození ohnivou magií. Zapálí svůj cíl útoky zblízka a občas mohou také vystřelit ohnivé šípy.
actors.mobs.elemental$fireelemental.name=ohnivý elementál
actors.mobs.elemental$frostelemental.desc=Elementálové jsou chaotičtí tvorové, kteří často vznikají, když není mocná okultní magie správně ovládána. Elementálové mají minimální inteligenci a obvykle jsou spojováni s určitým typem magie. \n\nMraziví elementálové jsou běžným typem elementálů, kteří oslabují nepřátele mrazivou magií. Svůj cíl zmrazí útoky zblízka a občasnými útoky na dálku. Jejich magie je mnohem účinnější ve vodě.
actors.mobs.elemental$frostelemental.name=elementární mráz
actors.mobs.elemental$newbornfireelemental.charging=Elementál se nabíjí!
actors.mobs.elemental$newbornfireelemental.desc=Elementálové jsou chaotické bytosti, které často vznikají, když mocná okultní magie není správně ovládána. Elementálové mají minimální inteligenci a obvykle jsou spojováni s určitým typem magie. \n\nTento ohnivý elementál je čerstvě přivolán, ale stále docela nebezpečný!
actors.mobs.elemental$newbornfireelemental.desc_ally=Protože byl tento elementál přivolán kouzlem, má o něco větší kontrolu nad svým plamenem. Není schopen provádět útoky na dálku, ale v boji zblízka zapálí nepřátele, na které útočí.
actors.mobs.elemental$newbornfireelemental.desc_boss=Vzhledem k chaotické povaze svého vyvolání může tento elementál šířit oheň pouze nepřesnými výbuchy poté, co se na kolo nabije.
actors.mobs.elemental$newbornfireelemental.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.elemental$newbornfireelemental.name=novorozený ohnivý elementál
actors.mobs.elemental$shockelemental.desc=Elementálové jsou chaotičtí tvorové, kteří často vznikají, když není mocná okultní magie správně ovládána. Elementálové mají minimální inteligenci a obvykle jsou spojováni s určitým typem magie. \n\nŠokoví elementálové jsou méně častým typem elementálů, kteří narušují své nepřátele elektřinou a záblesky světla. V boji zblízka vyzařují elektrický oblouk do blízkých nepřátel a způsobují bonusové poškození svému primárnímu cíli, pokud se nachází ve vodě. Občas také zaměří na svůj cíl světelný výboj na dálku, který ho dočasně oslepí.
actors.mobs.elemental$shockelemental.name=šokový element
actors.mobs.eye.deathgaze_kill=Smrtící pohled tě zabil...
actors.mobs.eye.desc=Tomuto démonovi se také říká „koule nenávisti“. Jakmile spatří nepřítele, bezhlavě použije svůj smrtící pohled a často přitom zraní i vlastní spojence.
actors.mobs.eye.name=zlé oko
actors.mobs.fetidrat.desc=S touto krysou je evidentně něco v nepořádku. Její mastná černá srst a hnijící kůže se velmi liší od zdravých krys, které jste viděli dříve. Její světle zelené oči ji činí obzvláště hrozivou.\n\nKrysa s sebou nese oblak hrozného zápachu, zblízka je až neuvěřitelně silná.\n\nZ tlamě krysy stéká tmavý sliz, prokousává se podlahou, ale zdá se, že se ve vodě rozpouští.
actors.mobs.fetidrat.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.fetidrat.name=páchnoucí krysa
actors.mobs.fungalcore.desc=Tato gigantická houba musí být zdrojem veškeré houbové aktivity v této jeskyni.
actors.mobs.fungalcore.name=houbové jádro
actors.mobs.fungalsentry.desc=Tato obzvláště vysoká houba slouží jako obranný bod pro větší houbovou síť žijící v této jeskyni. \n\nJe nehybná, ale vystřelí přesné paprsky jedu na cokoli, co se dostane do jejího dohledu. I když je dopad těchto výbuchů poměrně slabý, _dokážou velmi rychle nahromadit smrtící množství jedu._ I když ji lze zabít, je pravděpodobně nejlepší se jí vyhnout.
actors.mobs.fungalsentry.name=houbový strážce
actors.mobs.fungalspinner.desc=Zdá se, že tento jeskynní rotující tvor je ovládán parazitickou houbou. Houba také změnila své schopnosti a nahradila svou pavučinu a jedové vaky houbovými výrůstky.\n\nRotující rotující tvor na vás bude místo pavučin plivat rostliny, čímž rozšíří houbovou vegetaci a potenciálně vás zakoření. I když vás nemůže otrávit, získá značnou odolnost vůči poškození, pokud se nachází v blízkosti nějakých hub.
actors.mobs.fungalspinner.name=houbový spinner
actors.mobs.ghoul.desc=Jak se trpasličí společnost pomalu začala hroutit a současný král trpaslíků se chopil absolutní moci, s těmi, kteří byli slabí nebo se mu bránili, se nezacházelo dobře. Jak se král stával zběhlejším v ovládání temné magie, podrobil si tyto trpaslíky své vůli a nyní tvoří pěšáky jeho armády. \n\nGhúlové nejsou sami o sobě nijak zvlášť silní, ale vždy se pohybují ve skupinách a ve velkém počtu je mnohem těžší je zabít. _Když je ghúl poražen, po několika kolech se znovu zvedne, pokud je poblíž jiný ghúl._
actors.mobs.ghoul.name=trpasličí ghúl
actors.mobs.gnoll.desc=Gnollové jsou humanoidi podobní hyenám. Žijí ve stokách a sklepeních a čas od času se odváží vyrazit na povrch. Gnollští zvědové jsou pravidelnými členy jejich smečky, nejsou tak silní jako bestie a nejsou tak inteligentní jako šamani.
actors.mobs.gnoll.name=gnollský zvěd
actors.mobs.gnollexile.desc=Tento šedosrstý gnoll má na rameni velkou značku, která ho označuje za vyhnance. Gnollové jsou obvykle vyhnáni ze své společnosti za ignorování rozkazů nebo porušování zákonů. Vyhnanci musí být silní a chytří, aby přežili, a tento vypadá, že ví, jak zacházet s kopím, které drží.
actors.mobs.gnollexile.desc_aggro=_Gnollský vyhnan se rozzlobeně rozhlíží._ Zdá se, že ho něco nakonec přimělo k boji. Pozor na to kopí!
actors.mobs.gnollexile.desc_passive=_Gnollský vyhnan se nehýbe k útoku._ Nezdá se být tak agresivní jako ostatní gnollové a pravděpodobně si nemyslí, že s vámi bojovat stojí za to. Můžete ho nechat být, ale má batoh, který by mohl být plný užitečných předmětů...
actors.mobs.gnollexile.name=gnollský exil
actors.mobs.gnollexile.seen_aggro=Gnoll s kopím se chystá zaútočit!
actors.mobs.gnollexile.seen_passive=Gnoll s kopím se na tebe ostražitě podívá, ale nepohne se k útoku.
actors.mobs.gnollgeomancer.alert=Geomant se probouzí! Celá jeskyně se zdá být pohnutá, když odskočí a šíleně se směje!
actors.mobs.gnollgeomancer.desc=Tento impozantně vysoký starší gnoll musí být zdrojem různých zemních kouzel v okolí a organizátorem veškeré gnollské činnosti. Na rozdíl od gnollských sapérů v oblasti je geomancer ve své magii docela zběhlý a nemůže být zraněn hozenými ani padajícími kameny. Nemá však žádný způsob, jak bojovat v boji zblízka.
actors.mobs.gnollgeomancer.desc_armor=Geomant je momentálně zahalen vrstvou kamenného brnění. _Budete se muset dostat blízko a zlomit ho krumpáčem, než geomancera poškodíte._
actors.mobs.gnollgeomancer.desc_armor_sapper=_Nedaleký gnollský sapér drží zařízení, které posiluje geomancerův kamenný pancíř. Teď ho vůbec nebudete moci poškodit!_
actors.mobs.gnollgeomancer.desc_sleeping=Tento impozantně vysoký gnollský šaman je obklopen vrstvou skály a vypadá téměř jako socha. Při bližším pohledu můžete vidět, jak se skála magicky pohybuje v rytmu dechu staršího gnola. V takovémto skále se jí nedá ublížit a vypadá to, že si doslova užívá zdřímnutí v prachu.\n\nVrstvy skály pravděpodobně prorazíte krumpáčem, ale _ujistěte se, že jste připraveni na boj, až to uděláte._ Geomancer musí být zdrojem různých kouzelných pohybů země v okolí a organizátorem veškeré gnollské aktivity. _Porazit gnolly roztroušené kolem před bojem by mohl být dobrý nápad._
actors.mobs.gnollgeomancer.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.gnollgeomancer.name=gnollský geomancer
actors.mobs.gnollgeomancer.rock_kill=Ten létající balvan tě zabil...
actors.mobs.gnollgeomancer.rockfall_kill=Padající kameny tě zabily...
actors.mobs.gnollgeomancer.warning=Geomant se začíná probouzet. Než budete pokračovat, ujistěte se, že jste připraveni!
actors.mobs.gnollguard.def_verb=zablokováno
actors.mobs.gnollguard.desc=Velký a drsně vypadající gnoll s kopím a štítem, ale bez helmy. Tito strážci jsou pravděpodobně vojáci ve výcviku, připoutaní k ochraně dolu před vnikající divokou zvěří. \n\nGnollský strážný je dostatečně silný na to, aby kopí držel v jedné ruce, ale neumí ho moc dobře používat. _K útoku na dálku bude potřebovat poměrně volný prostor a pokud se k němu přiblížíte, způsobí vám výrazně menší poškození._
actors.mobs.gnollguard.desc_armor=_Nedaleký gnollský ženista drží zařízení, které tomuto strážci propůjčuje hliněné brnění, čímž výrazně snižuje jeho poškození._
actors.mobs.gnollguard.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.gnollguard.name=gnollský strážce
actors.mobs.gnollguard.spear_warn=Gnoll zasadil prudký úder špičkou svého kopí!
actors.mobs.gnollsapper.desc=Malý a slabý, ale inteligentní gnoll se světlou srstí a brašnou plnou různých vychytávek. Pravděpodobně jsou zde, aby pomáhali s hledáním a těžbou tmavého zlata a mají poblíž stráž, která je chrání. Jsou schopni bojovat, ale jejich útoky jsou žalostně slabé, ne silnější než útoky gnollského zvěda.\n\nMísto přímého boje sapéři raději používají různé vychytávky, které mají k dispozici, aby za ně skalnaté prostředí útočilo. Sami však neznají magii pohybu země, a proto je docela pravděpodobné, že své vychytávky budou používat bezohledně. _Mělo by existovat mnoho způsobů, jak použít jejich útoky proti nim nebo jejich stráži._
actors.mobs.gnollsapper.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.gnollsapper.name=gnollský ženista
actors.mobs.gnolltrickster.desc=Podivně vypadající tvor, dokonce i na gnollské poměry. Hrbí se dopředu se zlomyslným úšklebkem, téměř kolébá brašnu visící přes rameno. Jeho oči jsou rozšířené podivnou směsicí strachu a vzrušení.\n\nV jeho brašně je velká sbírka špatně vyrobených šipek, všechny vypadají, jako by byly napuštěny různými škodlivými látkami.
actors.mobs.gnolltrickster.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.gnolltrickster.name=gnollský podvodník
actors.mobs.goldenmimic.desc=Mimikové jsou magické bytosti, které mohou na sebe vzít jakoukoli podobu. V dungeonech si téměř vždy vyberou tvar truhly s pokladem, aby nalákali nic netušící dobrodruhy. \n\nZlatí mimikové jsou odolnější mimikové, kteří se snaží přilákat nejsilnější dobrodruhy. Mají lepší kořist, ale jsou také mnohem silnější než běžní mimikové.
actors.mobs.goldenmimic.name=zlatý napodobitel
actors.mobs.golem.def_verb=zablokováno
actors.mobs.golem.desc=Trpaslíci se pokusili spojit své znalosti mechaniky s nově objevenou schopností spoutat elementály. Jako duše mechanických těl golemů používali duchy země, které považovali za nejsnáze ovladatelné. Přesto mohla i sebemenší chyba při rituálu způsobit, že se golem vymkl kontrole.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=klopýtat... klopýtat...
actors.mobs.goo.desc=O Slizu se toho ví jen málo. Možná to ani není živý tvor, ale shluk látek ze stok, který získal zárodky vlastní vůle.
actors.mobs.goo.enraged=rozzuřený
actors.mobs.goo.gluuurp=LEPOUUUP!
actors.mobs.goo.name=Sliz
actors.mobs.goo.notice=BLÁZNIVÁNO!
actors.mobs.goo.pumpup=Goo se nafukuje!
actors.mobs.goo.rankings_desc=Pohlceno slizem
actors.mobs.greatcrab.def_verb=zablokováno
actors.mobs.greatcrab.desc=Tento krab je obrovský, a to i ve srovnání s jinými kanalizačními kraby. Jeho modrý krunýř je pokrytý prasklinami a vilejši, což svědčí o vysokém stáří. Pomalu se pohybuje a sotva udržuje rovnováhu svým mohutným klepetem.\n\nI když má krab pouze jeden klepetek, jeho velikost to snadno kompenzuje. Krab drží klepetek před jakoukoli hrozbou a chrání se za neproniknutelnou zdí krunýře. Krab však nedokáže blokovat útoky, které nevidí, ani útoky více nepřátel najednou.
actors.mobs.greatcrab.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.greatcrab.name=velký krab
actors.mobs.greatcrab.noticed=Krab blokuje svým mohutným klepetem.
actors.mobs.guard.def_verb=zablokováno
actors.mobs.guard.desc=Tito strážci, kdysi strážci vězení, se už dávno neliší od ostatních vězňů. Potulují se jako zombie, bezduchě se potulují chodbami a hledají cokoli, co by nepatřilo k jejich místu, stejně jako vy!\n\nKolem boků nosí řetězy, které pravděpodobně používají k přitahování nepřátel zblízka.
actors.mobs.guard.name=vězeňský dozorce
actors.mobs.guard.scorpion=Pojď sem!
actors.mobs.hermitcrab.def_verb=zablokováno
actors.mobs.hermitcrab.desc=Z nějakého důvodu se tento kanalizační krab rozhodl nosit na hlavě rozbitou horní část sudu! Váha navíc ho zpomalila na normální rychlost, ale také mu poskytla podstatně větší obranu. Člověk sice slyší, jak se uvnitř sudu něco poskakuje...
actors.mobs.hermitcrab.name=krab poustevník
actors.mobs.mimic.desc=Mimici jsou magická stvoření, která mohou na sebe vzít jakoukoli podobu. V dungeonech si téměř vždy vyberou tvar truhly s pokladem, aby nalákali nic netušící dobrodruhy.
actors.mobs.mimic.discover_hint=Tohoto nepřítele najdete kdekoli v podzemí.
actors.mobs.mimic.hidden_hint=Něco na téhle truhle mi přijde divné... Jít k ní a pokusit se ji otevřít by asi nebyl dobrý nápad.
actors.mobs.mimic.name=mimik
actors.mobs.mimic.reveal=Ta hruď je napodobenina!
actors.mobs.mob.died=Slyšíš, jak v dálce něco umírá.
actors.mobs.mob.discover_hint=Tohoto nepřítele najdete v určité oblasti dungeonu.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Zabit: %s
actors.mobs.monk$focus.desc=Tento mnich se dokonale soustředí na svůj cíl a zdá se, že předvídá jeho pohyby dříve, než je provedou.\n\nKdyž je postava soustředěná, její další fyzický útok zaručeně mine cíl, bez ohledu na okolnosti. Odražení tohoto útoku mnichovi spotřebuje soustředění a bude si ho muset znovu vybudovat, aby odrazil další útok. Mniši budují soustředění rychleji, když se pohybují.
actors.mobs.monk$focus.name=soustředěný
actors.mobs.monk.def_verb=zablokováno
actors.mobs.monk.desc=Tito mniši jsou fanatici, kteří zasvětili život ochraně tajemství svého města před všemi cizinci. Nepoužívají zbroj ani zbraně a spoléhají pouze na umění boje beze zbraně.
actors.mobs.monk.name=trpasličí mnich
actors.mobs.monk.parried=odraženo
actors.mobs.necromancer$necroskeleton.desc=Tuto kostru přivolal nekromant. Chová se stejně jako běžná kostra a zemře, jakmile je nekromant, který ji přivolal, zabit.
actors.mobs.necromancer$necroskeleton.name=kostra nekromanta
actors.mobs.necromancer.desc=Tito učni temných mágů se hrnuli do vězení, protože je to ideální místo pro praktikování jejich zlého řemesla. \n\nNekromanti přivolávají a posilují kostlivce, aby za ně bojovali. Zabitím nekromanta zabijete i kostlivce, kterého přivolává.
actors.mobs.necromancer.name=nekromant
actors.mobs.npcs.blacksmith.cant_enter_old=Tato oblast není v tomto režimu přístupná. Zahrajte si novou hru a vyzkoušejte nový úkol!
actors.mobs.npcs.blacksmith.def_verb=zablokováno
actors.mobs.npcs.blacksmith.desc=Tento trollský kovář vypadá jako všichni trollové: je vysoký a štíhlý a jeho kůže připomíná kámen jak barvou, tak texturou. Trollský kovář si hraje s neúměrně malými nástroji.
actors.mobs.npcs.blacksmith.enter_no=Ještě ne
actors.mobs.npcs.blacksmith.enter_yes=Jsem připraven/a
actors.mobs.npcs.blacksmith.entrance_blocked=Cesta dolů je zablokovaná.
actors.mobs.npcs.blacksmith.exit_no=Ještě ne
actors.mobs.npcs.blacksmith.exit_warn_crystal=Ten obří krystal je taky pořád dole. Zaplatím ti navíc, když ho zničíš.
actors.mobs.npcs.blacksmith.exit_warn_full=Hotovo? Máš spoustu zlata, ale ujisti se, že jsi tu nenechal žádné ze svého vybavení. \n\n_Pamatuj si, jakmile vylezeš nahoru, už tě tam zpátky nepustím._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Ta obří houba je taky pořád dole. Zaplatím ti navíc, když ji zabiješ.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ten gnollský geomancer je taky pořád dole. Zaplatím ti připlatek, když ho zabiješ.
actors.mobs.npcs.blacksmith.exit_warn_high=Hotovo? Vypadá to, že máš slušné množství zlata, ale hodilo by se mi trochu víc. Měl bys být schopen získat _40 kusů._\n\n_Pamatuj, jakmile vylezeš nahoru, už tě zpátky nepustím._
actors.mobs.npcs.blacksmith.exit_warn_low=Už jsi skončil? Nevypadá to, že máš moc zlata. Měl bys být schopen získat _40 kousků._\n\n_Pamatuj si, jakmile vylezeš nahoru, už tě tam zpátky nepustím._
actors.mobs.npcs.blacksmith.exit_warn_med=Hotovo? Aspoň máš nějaké zlato, ale v dole je rozhodně víc. Měl bys být schopen získat _40 kusů._\n\n_Pamatuj si, jakmile vylezeš nahoru, už tě tam zpátky nepustím._
actors.mobs.npcs.blacksmith.exit_warn_none=Už jsi skončil? Nemáš skoro žádné zlato! Měl bys být schopen získat _40 kousků._\n\n_Pamatuj si, jakmile vylezeš nahoru, už tě zpátky nepustím._
actors.mobs.npcs.blacksmith.exit_yes=Jsem hotový/á
actors.mobs.npcs.blacksmith.get_lost=Jsem zaneprázdněný. Ztrať se!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hej člověče! Vypadáš jako důležitý člověk.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Ale opatrně, důl je pro malého človíčka, jako jsi ty, nebezpečný. Je už nějakou dobu opuštěný a začala v něm růst spousta krystalů. Jsou lesklé, ale příliš křehké na to, aby za něco stály, a chrání je nějaké magické věci. Jsou docela silné, takže _dávej pozor, kde těžíš_, nebo upoutáš jejich pozornost.\n\nNěkde je taky _obří krystal_. Je mnohem tvrdší, takže se připrav na boj, pokud ho začneš lámat. Vsadím se ale, že jeho rozbití zpomalí růst všech krystalů, takže zaplatím připlatek, pokud to dokážeš.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hej člověče! Vypadáš statečně.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Ale opatrně, důl je pro malého človíčka, jako jsi ty, nebezpečný. Roste tam nějaká houbová příšera. Má houbové stráže, které jsou opravdu smrtící, když tě uvidí, ale alespoň se nemůžou zvednout a pronásledovat tě. _Drž se z dohledu_, pokud chceš zůstat naživu.\n\nZaplatím připlatek, pokud se ti podaří sundat _tu největší houbu_, ale bude to stát pořádné úsilí. Je spojena s hromadou myceliových uzlů, které jsou skryté ve stěnách. Většinu z nich budeš muset rozbít, než ho budeš moct opravdu poškodit.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Ale opatrně, důl je pro malého človíčka, jako jsi ty, nebezpečný. Nějací gnollové chtějí taky zlato a teď to tu ničí. Jsou to hloupí tvorové, takže jejich těžba způsobila nejrůznější zřícení a propadliny. Budeš muset těžit skrz něj, takže _hledej nedávno narušenou skálu._\n\nMyslím, že jeden z gnollů způsobuje většinu problémů, pravděpodobně nějaký _geomantský šaman_ nebo něco takového. Zaplatím připlatek, pokud ho najdeš a zabiješ, ale jsem si jistý, že se bude bránit.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hej člověče! Vypadáš, že jsi rychlý.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hej člověče! Vypadáš, že jsi chytrý.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hej člověče! Vypadáš jako nějaký lstivej.
actors.mobs.npcs.blacksmith.intro_quest_start=Chceš být užitečný, co? Jo, mám pro tebe něco. Postavil jsem tuhle dílnu na starém dole, je to hned pod tím žebříkem. Vezmi si ten krumpáč a vytěž mi trochu _tmavé zlaté rudy. 40 kousků_ by mělo stačit. Kámen pod ním je hezký a měkký, takže _s trochou úsilí se ti podaří těžit skrz zdi._\n\nCo tím myslíš, jak ti zaplatím? Ty chamtivec...\n\nDobře, dobře, můžu ti ukovat. Považuj se za šťastlivce, jsem jediný kovář v okolí.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hej člověče! Vypadáš jako drsňák.
actors.mobs.npcs.blacksmith.lost_pick=Děláš si srandu? Kde je můj krumpáč?!
actors.mobs.npcs.blacksmith.name=trollský kovář
actors.mobs.npcs.blacksmith.quest_start_prompt=Jsi připravený jít dolů? Ujisti se, že máš nějaké volné místo na zlato.\n\n_Zklamu tě jen jednou!_
actors.mobs.npcs.blacksmith.reminder=Už jsi mi ztrácel čas? Vchod do dolu je támhle.
actors.mobs.npcs.blacksmith.reminder_crystal=Přines mi co nejvíc zlata a zkus taky rozbít ten velký krystal.
actors.mobs.npcs.blacksmith.reminder_fungi=Přines mi co nejvíc zlata a zkus zabít i tu obří houbu.
actors.mobs.npcs.blacksmith.reminder_gnoll=Přines mi co nejvíc zlata a zkus taky zabít gnollského geomancera.
actors.mobs.npcs.ghost.crab_1=Ahoj %s... Kdysi jsem byl jako ty - silný a sebevědomý... Ale byl jsem zabit starověkým tvorem... Nemůžu toto místo opustit... Dokud se nepomstím... Zabij _velkého kraba,_ který mi vzal život...\n\nJe nepřirozeně starý... S mohutným jediným klepetem a tlustou skořápkou... _Dej si pozor na jeho klepeta, musíš kraba překvapit, jinak tě s ním zablokuje..._
actors.mobs.npcs.ghost.crab_2=Prosím... Pomozte mi... Zabijte korýše...\n\n_Vždycky vás zablokuje... Když vás uvidí přicházet..._
actors.mobs.npcs.ghost.desc=Duch je sotva viditelný. Vypadá jako beztvará skvrna slabého světla se smutnou tváří.
actors.mobs.npcs.ghost.find_me=Děkuji... pojď si mě najít...
actors.mobs.npcs.ghost.gnoll_1=Ahoj %s... Kdysi jsem byl jako ty - silný a sebevědomý... Ale byl jsem zabit lstivým nepřítelem... Nemůžu opustit toto místo... Dokud se nepomstím... Zabij _gnollského podvodníka,_ který mi vzal život...\n\nNení jako ostatní gnollové... Schovává se a používá vrhací zbraně... _Dej si pozor na jeho jedovaté a zápalné šípy, neútoč z dálky..._
actors.mobs.npcs.ghost.gnoll_2=Prosím... Pomoz mi... Zabij toho podvodníka...\n\n_Nenech se tím zasáhnout... Přibliž se k tomu..._
actors.mobs.npcs.ghost.name=smutný duch
actors.mobs.npcs.ghost.rat_1=Ahoj %s... Kdysi jsem byl jako ty - silný a sebevědomý... Ale byl jsem zabit odpornou bestií... Nemůžu opustit toto místo... Ne, dokud se nepomstím... Zabijte tu _páchnoucí krysu,_ která mi vzala život...\n\nPotuluje se po této podlaze... Všude roznáší špínu... _Dej si pozor na její oblak zápachu a žíravého štípnutí, kyselina se rozpouští ve vodě..._
actors.mobs.npcs.ghost.rat_2=Prosím... Pomozte mi... Zabijte tu ohavnost...\n\n_Bojujte s ní u vody... Vyhněte se zápachu..._
actors.mobs.npcs.imp.cya=Uvidíme se, %s!
actors.mobs.npcs.imp.desc=Skřeti jsou nižší démoni. Nejsou pozoruhodní ani svou silou, ani magickým talentem, ale jsou docela chytří a společenští. Mnoho skřetů dává přednost životu mezi nedémony.
actors.mobs.npcs.imp.golems_1=V mém případě je třeba zabít _golemy_. Víte, chystám se tu začít malý byznys, ale tihle pitomí golemové jsou pro byznys špatní! Je velmi těžké vyjednávat s toulavými kusy žuly, zatraceně! Takže prosím zabijte... řekněme _4 z nich_ a odměna je vaše.
actors.mobs.npcs.imp.golems_2=Jak jde tvoje golemské safari? Jen nezapomeň vzít ty žetony.
actors.mobs.npcs.imp.hey=Pssst, %s!
actors.mobs.npcs.imp.intro=Jsi dobrodruh? Miluju dobrodruhy! Vždycky se na ně můžeš spolehnout, když je potřeba něco zabít, že? Za odměnu samozřejmě ;)
actors.mobs.npcs.imp.monks_1=V mém případě jsou to _mniši_, které je třeba zabít. Víte, založím si tu malý byznys, ale tihle šílenci si sami nic nekoupí a ostatní zákazníky jen odstraší. Takže prosím zabijte... řekněme _pět z nich_ a odměna je vaše.
actors.mobs.npcs.imp.monks_2=Jé, pořád žiješ! Věděl jsem, že tvé kung-fu bude silnější ;) Jen nezapomeň vzít ty žetony.
actors.mobs.npcs.imp.name=ambiciózní skřet
actors.mobs.npcs.impshopkeeper.buyback=Skřet vesele vrátí tvůj předmět.
actors.mobs.npcs.impshopkeeper.desc=Skřet si zřídil malý krámek na hranici vnitřních hal. Je hezké vidět přátelskou tvář, ale jeho ceny rozhodně nevypadají přívětivě.
actors.mobs.npcs.impshopkeeper.greetings=Ahoj, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Co jsi udělal, %s? Rychle nakupuj, musím odsud vypadnout!
actors.mobs.npcs.impshopkeeper.name=ambiciózní skřet
actors.mobs.npcs.impshopkeeper.thief=Myslel jsem, že ti můžu věřit!
actors.mobs.npcs.mirrorimage.desc=Tato iluze se ti velmi podobá, jen je bledší a trochu sebou škube.
actors.mobs.npcs.mirrorimage.discover_hint=Tuto postavu najdete pomocí specifického svitku.
actors.mobs.npcs.mirrorimage.name=zrcadlový obraz
actors.mobs.npcs.npc.discover_hint=Tuto postavu najdete v určité oblasti podzemí.
actors.mobs.npcs.prismaticimage.desc=Tato třpytivá iluze se vám velmi podobá, dokonce se zdá, že ovládá vaši současnou zbraň a brnění.\n\nPrizmatické obrazy se budou snažit vyhledat a odvést pozornost od nepřátel a k vaší ochraně budou využívat svou vylepšenou obranu a zdraví. I když nemají stejnou útočnou sílu jako zrcadlové obrazy, mají vylepšenou odolnost, včetně získávání výhod z vašeho brnění.\n\nKdyž jsou životy prizmatických obrazů sníženy na 0, během několika kol slábnou a během této doby je lze stále léčit. Pokud nejsou přítomni žádní nepřátelé, prizmatické obrazy slábnou a znovu se připojí ke svému pánovi.
actors.mobs.npcs.prismaticimage.discover_hint=Tuto postavu najdete pomocí specifického svitku.
actors.mobs.npcs.prismaticimage.name=hranolový obraz
actors.mobs.npcs.ratking.confused=Co... Kde to jsem? Moje království mě potřebuje!
actors.mobs.npcs.ratking.crown_after=Líbí se ti tvoje nová zbroj? Žádné vrácení peněz!
actors.mobs.npcs.ratking.crown_clothes=Obleč si něco! Nejsi ve stavu, abys mohl mluvit s královskou rodinou!
actors.mobs.npcs.ratking.crown_desc=Óóó, ta koruna je pro mě!? Vypadá mnohem lesklejší než ta moje, takže ji laskavě přijímám! \n\n Myslím, že ti za tuhle korunu můžu něco nabídnout jako odměnu. Obrovská síla hodná hrdiny, jako jsi ty! Chtěl bys to?
actors.mobs.npcs.ratking.crown_fine=Fajn! Stejně jsem to ani nechtěl...
actors.mobs.npcs.ratking.crown_info=Nejdřív mi řekni víc.
actors.mobs.npcs.ratking.crown_no=Raději ne...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, děkuji! A teď jdi a udělej svému králi čest!
actors.mobs.npcs.ratking.crown_yes=Samozřejmě!
actors.mobs.npcs.ratking.desc=Tato krysa je o něco větší než běžná vačnatec. Na hlavě nosí malou korunku.
actors.mobs.npcs.ratking.desc_birthday=Tato krysa je o něco větší než běžná vačnatec. Místo své obvyklé koruny má na sobě malý zelený klobouk. Všechno nejlepší k narozeninám, Krysí králi!
actors.mobs.npcs.ratking.desc_crown=Tato krysa je o něco větší než běžná vačnatec. Na hlavě nosí korunu trpasličího krále.
actors.mobs.npcs.ratking.desc_winter=Tato krysa je o něco větší než běžná vačnatec. Místo své obvyklé koruny má na sobě malý sváteční klobouk. Veselé svátky!
actors.mobs.npcs.ratking.discover_hint=Tuto postavu najdete na konci určité oblasti dungeonu.
actors.mobs.npcs.ratking.name=král krys
actors.mobs.npcs.ratking.not_sleeping=Nespím!
actors.mobs.npcs.ratking.what_is_it=Co se děje? Na tyhle nesmysly nemám čas. Moje království se samo nevládne!
actors.mobs.npcs.sheep.baa!=Bekot!
actors.mobs.npcs.sheep.baa.=Bekot.
actors.mobs.npcs.sheep.baa...=Bekot...
actors.mobs.npcs.sheep.baa?=Bekot?
actors.mobs.npcs.sheep.def_verb=zablokováno
actors.mobs.npcs.sheep.desc=Tohle je kouzelná ovce. Co je na ní tak magického? Nemůžete ji zabít. Bude tam stát, dokud magicky nezmizí, a celou dobu bude s prázdným pohledem přežvykovat.
actors.mobs.npcs.sheep.discover_hint=Tuto postavu najdete pomocí konkrétního předmětu nebo pasti.
actors.mobs.npcs.sheep.name=ovce
actors.mobs.npcs.shopkeeper.buyback=Prodavač vám neochotně vrátí zboží.
actors.mobs.npcs.shopkeeper.desc=Tenhle statný chlap vypadá spíš vhodně do obchodní čtvrti nějakého velkoměsta než do žaláře. Jeho ceny vysvětlují, proč raději obchoduje tady.
actors.mobs.npcs.shopkeeper.flee=Obchodník utíká!
actors.mobs.npcs.shopkeeper.name=prodavač
actors.mobs.npcs.shopkeeper.sell=Prodat položku
actors.mobs.npcs.shopkeeper.talk=Mluvit
actors.mobs.npcs.shopkeeper.talk_ascent=Nevím, co s tím amuletem plánuješ dělat, ale já s tím nechci mít nic společného. Kup si něco a jdi dál, oba musíme odsud pryč!
actors.mobs.npcs.shopkeeper.talk_caves=Utrácejte peníze, žijte déle.\n\nA pozdravte ode mě toho trolícího kováře, jestli ho uvidíte. Připomeňte tomu chlápkovi, že mi pořád dluží peníze za to kladivo, co jsem mu minulý týden prodal!
actors.mobs.npcs.shopkeeper.talk_city=Moje zboží tě tady dole ochrání. \n\n...A prosím tě, nepotuluj se tu. Trvalo věčnost, než mě místní nechali na pokoji, nechci, abys s sebou přitahoval nějaké potíže!
actors.mobs.npcs.shopkeeper.talk_halls=Ahoj, mám speciální ceny pro lovce démonů!\n\nA buď tam dole opatrný! Démonům dole bude jedno, jak jsi odvážný. Nemůžeš se vrátit nahoru a utratit další peníze, když jsi mrtvý! ;)\n\nJsou démoni jako já? Hehe, vůbec ne. Jsem jen malý chlapík, žádný mocný bojovník, a podařilo se mi udržet si mysl neporušenou. Démoni dole jsou mnohem silnější a všichni byli zotročeni... no... jen buď tam dole opatrný.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Tak ahoj, Vaše Výsosti, nebo už je to Vaše Svatost? Hehe, tak či onak, tohle pro vás není místo, spousta lidí by byla dost zoufalá, kdybyste skončil mrtvý. Určitě ale máte nějaké mince, proč si něco nekoupit, abyste tomu zabránili?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=No, pokud to není ten cestovatelský hrdina! Pokud se snažíš zachránit další město, tak hodně štěstí, nebezpečí tady jsou mnohem horší než u drobných banditů. Jsem si jistý, že to zvládneš lépe než kdokoli jiný, jen se snaž nezemřít přímo před mým obchodem.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Zdá se, že jsi mimo svůj živl, slečno. Úzké chodby v podzemí nejsou tak prostorné jako velké síně nebo lesy obklopující město, že ne? Hehe, nevšímej si mého blábolení, proč si něco nekoupit?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Mám vše, co potřebujete pro úspěšné dobrodružství!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, myslím, že jsem někde ve městě viděl plakát s tvým jménem. Jsme na útěku, že? Jsi nevinný, že ne? Jasně, jasně... Neboj se, mám lepší věci na práci, než na tebe hlásit, ale možná by sis pro jistotu měl něco koupit?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Přišel jsi z cechu zlodějů vyčistit oblast? Ne, jen nakupovat? Stejně zabij pár monster, když už jsi tady. A nečekej slevu, platím vám slušné peníze za ochranu a vy mě tady dole sotva ochráníte.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=To máš zajímavou pečeť, obvykle jsou v jednom kuse. Jsi nějaký zdiskreditovaný hrdina nebo co? Ať už jsi udělal cokoli, do mě nic není, tvoje mince jsou pořád dobré.
actors.mobs.npcs.shopkeeper.thief=Zloděj, zloděj!
actors.mobs.npcs.shopkeeper.warn=Dávej pozor! Už tě nebudu varovat.
actors.mobs.npcs.vaultlaser.desc=Tato stráž v pravidelných intervalech střílí lasery. _Jelikož se jedná pouze o testovací oblast, lasery vám ve skutečnosti neublíží._
actors.mobs.npcs.vaultlaser.name=laserová hlídka trezoru
actors.mobs.npcs.vaultsentry.desc=Tato hlídka prohledává oblast ve vzoru. _Jelikož se jedná pouze o testovací oblast, hlídka neudělá nic, pokud vás odhalí._
actors.mobs.npcs.vaultsentry.name=strážce pro skenování trezoru
actors.mobs.npcs.wandmaker.def_verb=zablokováno
actors.mobs.npcs.wandmaker.desc=Tento starý, ale statný pán má trochu zmatený výraz. Je chráněn magickým štítem.
actors.mobs.npcs.wandmaker.intro_1=Přišel jsem sem najít vzácnou přísadu na hůlku, ale ztratil jsem se a můj magický štít slábne. Budu muset brzy odejít, ale nedokážu snést odchod, aniž bych dostal to, pro co jsem přišel.
actors.mobs.npcs.wandmaker.intro_2=Pokud mi to seženeš, rád ti zaplatím jednou z mých precizně vyrobených hůlek! Přinesl jsem si s sebou dvě, takže si můžeš vzít, kterou chceš.
actors.mobs.npcs.wandmaker.intro_berry=Starý dozorce této věznice choval _hnilobu_ a já pátrám po jednom z jejích semen. Rostlina už ale pravděpodobně zdivočela, takže přimět ji, aby dala semínko, by mohlo být ošemetné. Její zahrada by měla být někde tady. Snažte se _vyhýbat se jejím popínavým rostlinám_, pokud chcete zůstat v jednom kuse. Použití ohně by mohlo být lákavé, ale prosím, nedělejte to, zabijete rostlinu a zničíte její semena.
actors.mobs.npcs.wandmaker.intro_cleric=Ahoj, Vaše Výsosti! Jaké příjemné překvapení vás potkat na tak depresivním místě! Nerad se vnucuji, ale možná pro vás mám úkol.
actors.mobs.npcs.wandmaker.intro_duelist=Ahoj slečno! Jaké příjemné překvapení potkat hrdinu na tak depresivním místě! Pokud máte chuť pomoci starému muži, možná pro vás mám úkol.
actors.mobs.npcs.wandmaker.intro_dust=Hledám nějaký _mrtvohlavý prach._ Je to zvláštní druh prokleté kostní moučky, která se obvykle objevuje na takových místech. Někde by tu měla být zabarikádovaná místnost, jsem si jistý, že se tam nějaký prach objeví. Buďte ale opatrní, kletba, kterou ten prach nese, je docela silná, _ozvěte se mi co nejrychleji_ a já to pro vás vyčistím.
actors.mobs.npcs.wandmaker.intro_ember=Hledám nějaké _čerstvé uhlíky_ od novorozeného ohnivého elementálu. Elementálové se obvykle objevují, když není vyvolávací rituál ovládán, takže stačí najít nějaké svíčky a místo pro rituál a jsem si jistý, že se vám podaří nějaký objevit. Budete se ale chtít _vyhnout uzavření se_ v boxu, nebo byste mohli _mít po ruce nějaký mrazivý předmět._ Novorození elementálové jsou docela silní a chaotičtí, ale nesnesou chlad.
actors.mobs.npcs.wandmaker.intro_huntress=Ahoj slečno! Přátelská tvář je tady dole příjemné překvapení, že? Vlastně přísahám, že jsem vaši tvář už viděla, ale nedokážu si vzpomenout přesně... Ale nevadí, pokud jste tady za dobrodružstvím, možná pro vás mám úkol.
actors.mobs.npcs.wandmaker.intro_mage=Ahoj %s! Slyšel jsem, že se kolem tebe a institutu kouzelníků rozpoutalo nějaké pozdvižení? Ale nevadí, stejně jsem tyhle hlupáky nikdy neměl rád. Jestli budeš ochotný, možná pro tebe mám úkol.
actors.mobs.npcs.wandmaker.intro_rogue=Proboha, vylekal jsi mě! Ještě jsem tu nepotkal žádného banditu, který by si zachoval zdravý rozum, takže musíš být z povrchu! Jestli máš chuť pomáhat cizímu člověku, mám pro tebe možná úkol.
actors.mobs.npcs.wandmaker.intro_warrior=Ach, ahoj! Jaké příjemné překvapení potkat válečníka ze severu na tak depresivním místě! Musel jsi sem cestovat docela daleko. Pokud hledáš dobrodružství, možná pro tebe mám úkol.
actors.mobs.npcs.wandmaker.name=starý výrobce hůlek
actors.mobs.npcs.wandmaker.reminder_berry=Máš štěstí se semínkem hniloby, %s? Hledej místnost plnou vegetace.
actors.mobs.npcs.wandmaker.reminder_dust=Máš štěstí s mrtvolným prachem, %s? Hledej nějaké barikády.
actors.mobs.npcs.wandmaker.reminder_ember=Máš štěstí s těmi uhlíky, %s? Budeš muset najít čtyři svíčky a místo rituálu.
actors.mobs.phantompiranha.desc=Fantomové piraně jsou vzácným druhem piraní s magickými schopnostmi a tajemnými průsvitnými těly. Jsou schopny se teleportovat, když jsou napadeny, ať už aby unikly, nebo se rychle přiblížily k nepříteli!\n\nI když je s nimi otravné bojovat, jejich maso je ceněno pro své magické vlastnosti.
actors.mobs.phantompiranha.name=fantomová piraňa
actors.mobs.phantompiranha.teleport_away=Fantomová piraňa se teleportuje pryč...
actors.mobs.piranha.desc=Tyto masožravé ryby jsou chovány speciálně k ochraně zaplavených oblastí. Jejich kousnutí je smrtelné, proto je nejlepší se jim přímému střetu vyhnout.
actors.mobs.piranha.discover_hint=Tohoto nepřítele najdete kdekoli v podzemí.
actors.mobs.piranha.name=obří piraňa
actors.mobs.pylon.desc_active=Energetický stožár, který má pomáhat regulovat elektřinu pohánějící stroje v této oblasti. Stožár je momentálně přeplněn elektrickou energií, tohle musí být to, co přeplňuje DM-300!\n\nV tomto stavu jsou stožáry zranitelné, ale vyvolají oblouky do blízkých článků ve směru hodinových ručiček. Díky své těžké kovové konstrukci jsou stožáry odolné vůči velkému poškození.
actors.mobs.pylon.desc_inactive=Energetický stožár, který má pomáhat regulovat elektřinu pohánějící stroje v této oblasti. \n\nStožár je momentálně neaktivní a imunní vůči poškození.
actors.mobs.pylon.name=stožár elektřiny
actors.mobs.rat.desc=Vačnaté krysy jsou agresivní, ale poměrně slabí obyvatelé stok. Mají ošklivý skus, ale životu nebezpečné jsou pouze ve velkém počtu.
actors.mobs.rat.name=vačnatec krysa
actors.mobs.ripperdemon.desc=Tito hrůzostrašní tvorové jsou výsledkem mnoha trpasličích mrtvol v této oblasti, které využívají démonické síly. Trhači jsou vyhublí, strašidelní tvorové, kteří připomínají trpaslíky, ale se zlomenými těly a dlouhými ostrými drápy z kostí. \n\nDémoni trhači nejsou nijak zvlášť odolní, ale jsou hbití a nebezpeční. Jsou schopni skákat na velké vzdálenosti, aby se rychle dostali k cílům, než je probodnou svými drápy.
actors.mobs.ripperdemon.leap=Démon rozparovače se připravuje ke skoku!
actors.mobs.ripperdemon.name=démon rozparovače
actors.mobs.rotheart.desc=Plody hniloby jsou velmi unikátní. Místo aby hnily a poskytovaly živiny, plody rostou, tvrdnou a obklopují semeno. Poskytují tak ochranu vnitřním orgánům, které rostou uvnitř plodu. Tato obrovská koule se označuje jako srdce dospělé rostliny hniloby.
actors.mobs.rotheart.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.rotheart.name=hniloba srdce
actors.mobs.rotlasher.desc=Hniloba je součástí kořenové struktury dospělé hniloby a také jejím primárním obranným prostředkem. Hniloba je slepá a zapíchnutá do země, ale po chvíli odhalení prudce zaútočí na jakoukoli hrozbu v okolí. Pokud v okolí nejsou žádní nepřátelé, stojí nehybně a snaží se splynout s okolní vegetací.
actors.mobs.rotlasher.discover_hint=Tohoto nepřítele můžete najít během konkrétního úkolu.
actors.mobs.rotlasher.name=hniloba bič
actors.mobs.scorpio.desc=Tito obrovští démoničtí tvorové, podobní pavoukovcům, se vyhýbají boji zblízka a raději střílejí ochromujícími zoubkovanými hroty z velké vzdálenosti.
actors.mobs.scorpio.name=Štír
actors.mobs.senior.desc=Tito mniši jsou fanatici, kteří zasvětili život ochraně tajemství svého města před všemi cizinci. Nepoužívají zbroj ani zbraně a spoléhají pouze na umění boje beze zbraně.
actors.mobs.senior.name=starší mnich
actors.mobs.shaman$blueshaman.spell_desc=Tento šaman má na sobě modrou masku a používá magii, která dočasně _zvyšuje způsobené poškození._
actors.mobs.shaman$purpleshaman.spell_desc=Tento šaman má na sobě fialovou masku a používá magii, která dočasně _snižuje vaši přesnost a úhybnost._
actors.mobs.shaman$redshaman.spell_desc=Tento šaman má na sobě červenou masku a použije magii, která dočasně _oslabí vaši útočnou sílu._
actors.mobs.shaman.bolt_kill=Magický blesk tě zabil...
actors.mobs.shaman.desc=Nejchytřejší gnollové se mohou naučit šamanskou magii. Gnollí šamani si nedostatek síly vynahrazují bojovými kouzly a neváhají je použít proti každému, kdo zpochybní jejich postavení v kmeni.
actors.mobs.shaman.name=gnollský šaman
actors.mobs.skeleton.def_verb=zablokováno
actors.mobs.skeleton.desc=Kostlivci se skládají z kostí nešťastných dobrodruhů a obyvatel kobky, oživených zlou magií z hlubin. Když utrpí dost zranění, rozletí se v explozi kostí.
actors.mobs.skeleton.explo_kill=Zabila tě exploze kostí...
actors.mobs.skeleton.name=kostlivec
actors.mobs.slime.def_verb=zablokováno
actors.mobs.slime.desc=Slizové jsou zvláštní, lehce magičtí tvorové s gumovým vnějším tělem a tekutým jádrem. Městská kanalizace jim poskytuje dostatek vody a živin.\n\nVzhledem k jejich elastické vnější membráně je obtížné způsobit slizům více než _6 bodů poškození_ jedním útokem.
actors.mobs.slime.name=sliz
actors.mobs.snake.desc=Tito nadměrně velcí hadi se dokážou rychle plazit kolem úderů, takže je docela těžké je zasáhnout. Magické útoky nebo překvapivé útoky je však dokážou zaskočit. \n\n Překvapivý útok můžete provést útokem mimo zorné pole hada. Jedním ze způsobů je nechat hada pronásledovat vás dveřmi a pak _útočit hned poté, co se do nich přesune._
actors.mobs.snake.hint=Zkuste použít tlačítko prozkoumat na hadovi, abyste se naučili, jak se s ním vypořádat.
actors.mobs.snake.name=kanalizační had
actors.mobs.spectralnecromancer.desc=I když kostlivci jsou pro nekromanty chlebem a máslem, někteří dávají přednost pohledu na jiné, méně hmotné poskoky. Spektrální nekromanti si jako své oblíbené poskoky zvolili přízraky!\n\nJednotliví přízraky nejsou tak silní jako kostlivci, ale tito nekromanti se jich nebojí přivolat spoustu!
actors.mobs.spectralnecromancer.name=spektrální nekromant
actors.mobs.spinner.desc=Tito nazelenalí chlupatí jeskynní pavouci se vyhýbají přímému boji. Raději čekají opodál, zatímco jejich oběť, chycená v pavučině, pomalu umírá na jedovaté kousnutí.
actors.mobs.spinner.name=jeskynní pavouk
actors.mobs.statue.def_verb=zablokováno
actors.mobs.statue.desc=Člověk by si myslel, že je to jen další z neživých soch z tohoto jeskyně, ale její rudě zářící oči to prozrazují.
actors.mobs.statue.desc_weapon=I když je samotná socha vyrobena z kamene, _%s_, kterou drží, vypadá skutečně.
actors.mobs.statue.discover_hint=Tohoto nepřítele najdete kdekoli v podzemí.
actors.mobs.statue.name=animovaná socha
actors.mobs.succubus.desc=Sukuby jsou démoni v podobě svůdných dívek s poněkud gotickým vzhledem. Sukuba dokáže hrdinu očarovat, takže nemůže na nikoho zaútočit, dokud kouzlo nevyprchá.
actors.mobs.succubus.name=sukuba
actors.mobs.swarm.desc=Smrtící roj much rozzlobeně bzučí. Každý nemagický útok ho rozdělí na dva menší, ale stejně nebezpečné roje.
actors.mobs.swarm.name=roj much
actors.mobs.tengu$bombability$bombblob.desc=Stoupá tu oblak přehřátého kouře. Pozor, exploduje!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Přilepilo se k zemi, nemůžete s tím hnout!
actors.mobs.tengu$bombability$bombitem.desc=Tengu sem hodil podivně vypadající dýmovnici, ze které se valil hustý horký kouř. Vydává hlasité tikající zvuk, jako by odpočítávala čas do exploze!\n\nBomba se zakotvila v zemi, takže ji nemůžete zvednout.
actors.mobs.tengu$bombability$bombitem.name=dýmovnice
actors.mobs.tengu$fireability$fireblob.desc=Tengu hodil jemný prášek, který se zdá být napařený a každou chvíli vzplane!
actors.mobs.tengu$shockerability$shockerblob.desc=Zde se hromadí elektrická energie, cokoli na této dlaždici bude v příštím kole zasaženo elektrickým proudem!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Vydává to příliš mnoho elektřiny, nemůžeš to chytit!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu sem hodil zvláštní stroj, který vypadá, že je vyroben z dílů DM-100. Stroj neustále kolem sebe generuje elektrický oblouk, ale zdá se, že se děje v předvídatelném vzoru. \n\nS tou vší tou elektřinou kolem něj není možné to zachytit.
actors.mobs.tengu$shockerability$shockeritem.name=Ostuda
actors.mobs.tengu.defeated=Konečně volno...
actors.mobs.tengu.desc=Tengu jsou členové starobylého klanu nájemných vrahů stejného jména. Prosluli hojným používáním šurikenů a pastí.
actors.mobs.tengu.interesting=Udělejme to zajímavé...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Mám tě, %s!
actors.mobs.tengu.notice_have=Teď tě mám, %s!
actors.mobs.tengu.rankings_desc=Zavražděn Tenguy
actors.mobs.thief.carries=Zloděj nese _%s._ Je zřejmé, že je ukradený.
actors.mobs.thief.desc=Přestože se tito vězni volně pohybují ve svých celách, toto místo je stále jejich vězením. Postupem času jim toto místo vzalo mysl i svobodu. Tito šílení zloději a bandité už dávno zapomněli, kdo jsou a proč kradou.\n\nTito nepřátelé spíše kradou a utíkají, než aby bojovali. Ujistěte se, že je máte na dohled, jinak už nikdy nemusíte najít ukradenou věc.
actors.mobs.thief.escapes=Zloděj vám projde bez vašeho %s!
actors.mobs.thief.name=šílený zloděj
actors.mobs.thief.stole=Zloděj ti ukradl %s!
actors.mobs.tormentedspirit.desc=Trýznění duchové jsou jinak dobromyslní duchové, kteří byli postiženi kletbou. Dokud jsou prokletí, útočí stejně jako přízrak a jsou také silnější!\n\nJe možné, že kletbu zrušíte použitím správného předmětu vedle ducha. Pokud je kletba zrušena, duch bude jistě vděčný...
actors.mobs.tormentedspirit.name=trýzněný duch
actors.mobs.tormentedspirit.thank_you=Děkuju...
actors.mobs.vaultrat.desc=Tato krysa má několik změn chování, aby otestovala novou AI nepřítele v trezoru: \n_-_ Její pohyb lze „slyšet“ skrz zdi. \n_-_ Bude se toulat po předem nastavené hlídce. \n_-_ Během toulání má výrazně snížený dosah detekce za směrem, kterým se pohybuje. \n_-_ Během spánku je její dosah detekce také snížen. \n_-_ Když vás detekuje, začne „prozkoumávat“ situaci, než přejde k lovu. Prozkoumávající nepřátelé se pohybují směrem k vám, ale neútočí a snáze se ztratí za dveřmi a rohy.
actors.mobs.warlock.bolt_kill=Stínový blesk tě zabil...
actors.mobs.warlock.desc=Když se zájem trpaslíků přesunul od techniky k tajemným uměním, moc ve městě převzali černokněžníci. Začínali s magií živlů, ale brzy přešli k démonologii a nekromancii.
actors.mobs.warlock.name=trpasličí čaroděj
actors.mobs.wraith.desc=Přízrak je mstivý duch hříšníka, jehož hrob nebo náhrobní kamení bylo narušeno. Jelikož je to éterická entita, je velmi těžké ji zasáhnout běžnou zbraní.
actors.mobs.wraith.discover_hint=Tohoto nepřítele najdete kdekoli v podzemí.
actors.mobs.wraith.name=přízrak
actors.mobs.yogdzewa$larva.desc=Tito malí poskoci Yog-Dzewy jsou jednoduchí minioni, které lze snadno vyrobit. I když jsou jednotlivě slabí, jsou rychle přivoláni a ve velkém počtu se mohou stát ohromujícími.
actors.mobs.yogdzewa$larva.name=boží larva
actors.mobs.yogdzewa$larva.rankings_desc=Pohlcen Yog-Dzewou
actors.mobs.yogdzewa$yogeye.rankings_desc=Pohlcen Yog-Dzewou
actors.mobs.yogdzewa$yogripper.rankings_desc=Pohlcen Yog-Dzewou
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Pohlcen Yog-Dzewou
actors.mobs.yogdzewa.darkness=Tma se blíží...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa je Starý bůh; obrovská zrůda, která proniká do světů smrtelníků a pohlcuje je, aby poháněla svůj nekonečný růst. Trpaslíci museli upoutat pozornost této kosmické hrůzy, když si hráli s temnou magií, a od té doby se ji snaží udržet pod kontrolou.\n\nYog-Dzewa pochází z dimenze surového magického chaosu a nemůže do tohoto světa vnést svou pravou podobu. Místo toho si vytvořil avatary a přivolal démonické přisluhovače, aby zde plnili jeho rozkazy.\n\nToto obří oko je ústředním bodem Yog-Dzewovy moci v tomto světě. I když je oko samo o sobě nehybné, je schopné střílet silné paprsky démonické magie a přivolávat různé přisluhovače, kteří mu pomáhají.
actors.mobs.yogdzewa.desc_spawners=Cítíš vlny démonické energie, které vyzařují do očí z horních pater. Něco, co jsi tam nahoře nechal při životě, musí vracet sílu zpět do Yog-Dzewy. _Yog tuto energii použije k přivolání silnějších přisluhovačů!_
actors.mobs.yogdzewa.hope=TVOJE. NADĚJE. JE. ILUZE!
actors.mobs.yogdzewa.name=Jóg-Dzewa
actors.mobs.yogdzewa.notice=VIDÍM. TĚ.
actors.mobs.yogdzewa.rankings_desc=Pohlcen Yog-Dzewou
actors.mobs.yogfist$brightfist.desc=Tato pěst je tvořena čistou světelnou energií. V každém tahu je schopna vystřelovat silné paprsky spalujícího světla! Tyto paprsky vás kromě způsobení těžkého poškození dočasně oslepí. Pěst je také schopna krátce pohltit arénu oslepujícím světlem, abyste mohli uniknout!\n\nPěst však nemá žádné speciální schopnosti, které by mohla použít v boji zblízka.
actors.mobs.yogfist$brightfist.name=jasná pěst
actors.mobs.yogfist$brightfist.teleport=Pěst se teleportuje pryč v záblesku světla, který vás vážně oslepí!
actors.mobs.yogfist$burningfist.desc=Mohutná pěst zahalená ohněm. Prsty jí při sevření praskají a sypou na podlahu žhavé uhlíky.
actors.mobs.yogfist$burningfist.name=hořící pěst
actors.mobs.yogfist$darkfist.desc=Tato pěst je tvořena čistou temnou energií. V každém tahu je schopna vystřelit silné výboje temné magie! Tyto výboje kromě způsobení velkého poškození oslabí váš zdroj světla. Pěst je také schopna krátce pohltit arénu tmou, aby vám umožnila uniknout!\n\nPěst však nemá žádné speciální schopnosti, které by mohla použít v boji zblízka.
actors.mobs.yogfist$darkfist.name=temná pěst
actors.mobs.yogfist$darkfist.teleport=Pěst se teleportuje pryč v záblesku temnoty, který uhasí tvůj zdroj světla!
actors.mobs.yogfist$rottingfist.desc=Obrovská pěst z hnijícího masa. Mezi prsty jí prosakuje odporný sliz a špiní kámen pod ní.
actors.mobs.yogfist$rottingfist.name=hnijící pěst
actors.mobs.yogfist$rustedfist.desc=Tato pěst je vytvořena z živého kovu. Je to tyčící se masa pohyblivého kovu, která má silné útoky zblízka a dokáže ochromit své cíle na dálku. Vzhledem ke své obrovské hmotnosti pěst přijímá veškeré způsobené poškození postupně, nikoli okamžitě. \n\nPěst je však nepružná a nemůže se pohybovat v úzkých průchodech. Navíc, i když může přijímat poškození pomalu, odložené poškození se bude i nadále zvyšovat, pokud je pěst zasažena vícekrát.
actors.mobs.yogfist$rustedfist.name=zrezivělá pěst
actors.mobs.yogfist$soiledfist.desc=Tato pěst je tvořena chaotickou zemní magií. Jak se pohybuje, neustále způsobuje, že kolem ní raší vegetace. Může také vystřelovat koncentrované zemní výbuchy, které polapí její cíl v rychle rostoucích liánách a kořenech!\n\nPěst čerpá sílu z této rostliny a odolá poškození v závislosti na množství vysoké nebo zvrásněné vegetace v její blízkosti!
actors.mobs.yogfist$soiledfist.name=zašpiněná pěst
actors.mobs.yogfist.desc=Tato pěst je aspektem síly Yog-Dzewy. Pěsti jsou spojeny se silou Yog-Dzewy a budou chráněny před veškerým poškozením, když jsou blízko oka.
actors.mobs.yogfist.invuln_warn=Pěst je nezranitelná, když je blízko oka!
actors.mobs.yogfist.rankings_desc=Pohlcen Yog-Dzewou
