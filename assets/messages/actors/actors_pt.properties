actors.blobs.blizzard.desc=Uma nevasca está a formar-se aqui.
actors.blobs.blizzard.name=nevasca
actors.blobs.confusiongas.desc=Uma nuvem de gás causador de confusão está a circular por aqui.
actors.blobs.confusiongas.name=gás de confusão
actors.blobs.corrosivegas.desc=Uma nuvem de gás cáustico mortal está a circular por aqui.
actors.blobs.corrosivegas.name=gás corrosivo
actors.blobs.electricity.desc=Um campo de eletricidade está aqui a faiscar intensamente.
actors.blobs.electricity.name=eletricidade
actors.blobs.electricity.ondeath=Ficou em choque mortal...
actors.blobs.electricity.rankings_desc=Eletrocutado
actors.blobs.fire.desc=Um incêndio está a devastar este local.
actors.blobs.fire.name=fogo
actors.blobs.foliage.desc=Raios de luz atravessam a escuridão do jardim subterrâneo.
actors.blobs.foliage.name=folhagem
actors.blobs.freezing.desc=O ar aqui está anormalmente frio.
actors.blobs.freezing.name=ar congelante
actors.blobs.goowarn.desc=Partículas de energia escura estão a espalhar-se por aqui!
actors.blobs.goowarn.name=energia escura
actors.blobs.inferno.desc=Um incêndio está a devastar este local.
actors.blobs.inferno.name=inferno
actors.blobs.paralyticgas.desc=Uma nuvem de gás paralisante está a circular aqui.
actors.blobs.paralyticgas.name=gás paralisante
actors.blobs.regrowth.name=regeneração
actors.blobs.sacrificialfire.desc=Aqui existe um altar com uma fogueira sacrificial acesa sobre ele. Qualquer criatura morta aqui será consumida como oferenda aos espíritos da masmorra. Talvez seja dada uma recompensa se forem feitos sacrifícios suficientes?
actors.blobs.sacrificialfire.name=fogo sacrificial
actors.blobs.sacrificialfire.reward=O fogo arde e depois dissipa-se, deixando uma recompensa para trás!
actors.blobs.sacrificialfire.unworthy=O fogo consome a sua oferenda, mas não a altera.
actors.blobs.sacrificialfire.worthy=O fogo consome a sua oferenda e intensifica-se.
actors.blobs.smokescreen.desc=Uma densa nuvem de fumo negro está a rodopiar por aqui.
actors.blobs.smokescreen.name=cortina de fumo
actors.blobs.stenchgas.desc=Uma nuvem de odor fétido paira no ar.
actors.blobs.stenchgas.name=gás fétido
actors.blobs.stormcloud.desc=Uma nuvem de vapor de água ondulante está a girar aqui.
actors.blobs.stormcloud.name=nuvens de tempestade
actors.blobs.toxicgas.desc=Uma nuvem esverdeada de gás tóxico está a circular por aqui.
actors.blobs.toxicgas.name=gás tóxico
actors.blobs.toxicgas.ondeath=Morreu por causa do gás tóxico...
actors.blobs.toxicgas.rankings_desc=Sufocado
actors.blobs.waterofawareness.desc=O poder do conhecimento emana da água deste poço. Beber desta água revelará todos os itens equipados, identificará as maldições em todos os itens do teu inventário e revelará todos os itens do piso atual.
actors.blobs.waterofawareness.name=água da consciência
actors.blobs.waterofawareness.procced=Ao dar um gole, sente o conhecimento inundar a sua mente.
actors.blobs.waterofhealth.desc=A força da saúde emana da água deste poço. Beber desta água curará as suas feridas, saciará a sua fome e removerá as maldições de quaisquer objetos desgastados.
actors.blobs.waterofhealth.name=água da saúde
actors.blobs.waterofhealth.procced=Ao dar um gole, sente as suas feridas cicatrizarem completamente.
actors.blobs.web.desc=Uma teia densa cobre tudo aqui. Qualquer coisa que toque ou seja atirada através da teia irá rompê-la, mas também ficará presa no lugar.
actors.blobs.web.name=teia de aranha
actors.buffs.adrenaline.desc=Uma onda de poder físico, a adrenalina aumenta a velocidade de ataque e de movimento. A adrenalina permite que o seu alvo corra com o dobro da velocidade e ataque com 1,5 vezes a velocidade. Turnos restantes:
actors.buffs.adrenaline.name=adrenalina
actors.buffs.adrenalinesurge.desc=Uma onda de grande poder, mas infelizmente não permanente.\n\nAumento de força: +%d.\nTurnos até o aumento enfraquecer: %s.
actors.buffs.adrenalinesurge.name=aumento da força
actors.buffs.amok.desc=Amok causa um estado de grande fúria e confusão no seu alvo.\n\nQuando uma criatura está em amok, atacará tudo o que estiver perto dela, seja amigo ou inimigo.\n\nTurnos de amok restantes: %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Um escudo fino está à sua volta, bloqueando parte do dano dos ataques mágicos. A sua armadura mágica está atualmente reforçada em: 0-%d. Turnos até que a armadura arcana enfraqueça: %s.
actors.buffs.arcanearmor.name=armadura arcana
actors.buffs.artifactrecharge.desc=A energia está a fluir através de si, aumentando a taxa de carregamento dos seus artefactos equipados. Cada artefacto é afetado de uma forma ligeiramente diferente, mas todos eles ganharão carga muito mais rapidamente do que o normal. Turnos restantes:
actors.buffs.artifactrecharge.name=recarga de artefactos
actors.buffs.ascensionchallenge.almost=Sente que o aperto de Yog no amuleto começa a enfraquecer, está quase lá!
actors.buffs.ascensionchallenge.beckon=O amuleto começa a invocar inimigos distantes.
actors.buffs.ascensionchallenge.break=Respira fundo por um instante e sente as suas feridas começarem a cicatrizar!
actors.buffs.ascensionchallenge.damage=O amuleto começa a irradiar energia escura. Ele queima!
actors.buffs.ascensionchallenge.desc=De alguma forma, Yog-Dzewa mantém influência neste mundo através do amuleto e está a tentar impedir a sua ascensão! O poder de Yog está a tornar a masmorra muito mais perigosa, aumentando o número de inimigos e tornando-os mais fortes! Este poder continuará a aumentar se não for controlado e pode ser enfraquecido ao derrotar inimigos que foram fortalecidos pelo poder de Yog.
actors.buffs.ascensionchallenge.desc_beckon=O amuleto está atualmente a _chamar inimigos distantes_, alertando-os para a sua posição.
actors.buffs.ascensionchallenge.desc_clear=A energia escura que emanava do amuleto foi enfraquecida ao máximo possível por enquanto.
actors.buffs.ascensionchallenge.desc_damage=A energia do amuleto tornou-se tão forte que te está a prejudicar diretamente!
actors.buffs.ascensionchallenge.desc_haste=O amuleto está atualmente a _acelerar inimigos distantes_, permitindo que eles cheguem até ti mais rapidamente!
actors.buffs.ascensionchallenge.desc_slow=O amuleto está atualmente a _tornar-te mais lento_ e a anular os efeitos de aumento de velocidade!
actors.buffs.ascensionchallenge.haste=O amuleto começa a atrair inimigos distantes!
actors.buffs.ascensionchallenge.name=maldição do amuleto
actors.buffs.ascensionchallenge.on_kill=A energia escura consome-te...
actors.buffs.ascensionchallenge.slow=O amuleto começa a parecer um peso morto no teu inventário!
actors.buffs.ascensionchallenge.weaken=É possível sentir a maldição do amuleto enfraquecer ligeiramente.
actors.buffs.ascensionchallenge.weaken_info=A maldição do amuleto pode ser enfraquecida ao derrotar mais inimigos.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Ao derrotar os inimigos, a maldição do amuleto enfraquecerá!
actors.buffs.barkskin.desc=A sua pele está endurecida, áspera e sólida como casca de árvore. A pele endurecida aumenta a sua armadura eficaz, permitindo-lhe defender-se melhor contra ataques físicos. A sua armadura está atualmente aumentada em: 0-ZXQPH0. ZXQPH6. Turnos até que a pele de casca enfraqueça: ZXQPH1. ZXQPH7. ZXQPH8. Se receber pele de casca de múltiplas fontes, apenas a mais forte será aplicada.
actors.buffs.barkskin.name=casca
actors.buffs.barrier.desc=Uma bolha de força durável que bloqueia todos os danos. A barreira absorverá dano por tudo o que estiver a proteger enquanto houver escudo restante. O escudo também se deteriorará lentamente com o tempo. Escudo restante: %d.
actors.buffs.barrier.name=barreira
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=irritado
actors.buffs.berserk.angered_desc=A gravidade dos ferimentos do Berserker fortalece os seus golpes. À medida que o Berserker sofre dano físico, a sua fúria aumenta, concedendo-lhe dano bónus. O dano bloqueado pela armadura ainda conta para a acumulação de fúria. A fúria diminui com o tempo. Quanto menor for a saúde do Berserker, mais tempo durará. Com 100 de fúria, o Berserker pode entrar em frenesim, recebendo protecção com base no nível da sua armadura e na sua saúde restante. Enquanto estiver em fúria, o seu escudo dissipa-se com o tempo e, quando acabar, precisará de descansar antes de voltar a acumular fúria. \n\n Fúria atual: _%1$.0f%%_\n_+%2$.0f%%_ dano\n\n Escudo de fúria com armadura e HP atuais: _%3$d_
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.berserk_desc=O medo e a incerteza dissipam-se, restando apenas a raiva. Neste estado, o Berserker é extremamente poderoso, causando +50 de dano e ganhando um escudo bónus, mas também perdendo escudo a cada turno. Quando todo o seu escudo for reduzido a 0, o estado de berserk terminará. Após entrar em fúria, o Berserker precisará de recuperar antes de poder voltar a acumular fúria. Escudo Restante:
actors.buffs.berserk.exhausted=exausto
actors.buffs.berserk.no_seal=Precisa que o seu selo rompido entre em fúria!
actors.buffs.berserk.rankings_desc=Enlouquecido até à morte
actors.buffs.berserk.recovering=recuperando
actors.buffs.berserk.recovering_desc=A força interior tem os seus limites. O Berserker precisa de descansar antes de voltar a usar a sua fúria. Enquanto recupera, o Berserker não acumula fúria ao sofrer dano.
actors.buffs.berserk.recovering_desc_levels=Níveis até à recuperação: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Rotações até ser recuperado: _%d_
actors.buffs.bleeding.desc=Este ferimento está a sangrar uma quantidade preocupante de sangue. O sangramento causa dano a cada turno. A cada turno, o dano diminui numa quantidade aleatória, até que a hemorragia eventualmente pare. Dano atual da hemorragia: %d.
actors.buffs.bleeding.heromsg=Você está a sangrar!
actors.buffs.bleeding.name=sangramento
actors.buffs.bleeding.ondeath=Morreu sangrando...
actors.buffs.bleeding.rankings_desc=Sangrou até à morte
actors.buffs.bless.desc=Uma grande explosão de foco, alguns dizem que é inspirada pelos deuses.\n\nA bênção aumenta a precisão e a evasão em 25%%, tornando o abençoado muito mais eficaz em combate.\n\nTurnos restantes da bênção: %s.
actors.buffs.bless.name=abençoado
actors.buffs.blindness.desc=A cegueira transforma o mundo circundante numa névoa escura. Enquanto estiver cego, o alcance de visão de uma personagem é reduzido a um quadrado, tornando os ataques à distância inúteis e facilitando bastante a perda de vista de inimigos distantes. Além disso, um herói cego é incapaz de ler pergaminhos ou livros. Restantes turnos de cegueira:
actors.buffs.blindness.heromsg=Você está cego!
actors.buffs.blindness.name=cego
actors.buffs.blobimmunity.desc=Alguma força estranha está a envolvê-lo numa fina barreira protetora, bloqueando todos os efeitos nocivos transmitidos pelo ar.\n\nEstá imune a todos os efeitos de área enquanto esta barreira durar.\n\nTurnos de imunidade restantes: %s.
actors.buffs.blobimmunity.name=barreira de purificação
actors.buffs.burning.burnsup=%s pega fogo!
actors.buffs.burning.desc=Poucas coisas são mais angustiantes do que ser consumido pelas chamas. O fogo causará dano a cada turno até ser apagado pela água ou até se extinguir. O fogo pode ser extinto entrando na água ou com o salpico de uma poção estilhaçante. Além disso, o fogo pode incendiar terrenos ou objetos inflamáveis com os quais entre em contacto. Turnos de queima restantes:
actors.buffs.burning.heromsg=Você pega fogo!
actors.buffs.burning.name=queimando
actors.buffs.burning.ondeath=Morreu queimado...
actors.buffs.burning.rankings_desc=Reduzido a cinzas
actors.buffs.championenemy$antimagic.desc=Os campeões antimágicos recebem menos 50% de dano e são completamente imunes a efeitos mágicos.
actors.buffs.championenemy$antimagic.name=campeão antimagia
actors.buffs.championenemy$blazing.desc=Os campeões flamejantes causam mais 25% de dano corpo a corpo, incendeiam os inimigos que atacam, são imunes ao fogo e espalham chamas à sua volta quando morrem. No entanto, não podem espalhar fogo na água.
actors.buffs.championenemy$blazing.name=campeão flamejante
actors.buffs.championenemy$blessed.desc=Os campeões abençoados têm precisão e evasão quadruplicadas.
actors.buffs.championenemy$blessed.name=campeão abençoado
actors.buffs.championenemy$giant.desc=Os campeões gigantes recebem menos 80% de dano e têm +1 de alcance de ataque, mas não se podem mover por espaços fechados.
actors.buffs.championenemy$giant.name=campeão gigante
actors.buffs.championenemy$growing.desc=Os campeões em crescimento recebem um bónus crescente de precisão, evasão, dano físico e redução de dano recebido. Aumento atual de precisão/evasão/dano: %1$d%%\n Redução de dano atual: %2$d%%
actors.buffs.championenemy$growing.name=campeão em crescimento
actors.buffs.championenemy$projecting.desc=Os campeões com projeção causam mais 25% de dano corpo a corpo e têm +3 de alcance de ataque.
actors.buffs.championenemy$projecting.name=campeão de projeção
actors.buffs.championenemy.warn=Sente uma presença mortal.
actors.buffs.charm.cant_attack=Está enfeitiçado por este inimigo e não consegue atacá-lo.
actors.buffs.charm.desc=Um encanto é uma magia manipulativa que pode fazer com que os inimigos se adorem temporariamente. As personagens afetadas pelo encanto não podem atacar diretamente o inimigo que as enfeitiçou. No entanto, é ainda possível atacar outros alvos. O choque da dor diminuirá a duração do encanto. Restantes turnos de encanto:
actors.buffs.charm.heromsg=Está encantado(a)!
actors.buffs.charm.name=Encantado
actors.buffs.chill.desc=Não está completamente congelado, mas ainda está muito frio. Os alvos congelados executam todas as ações mais lentamente, dependendo de quantas rondas restam do efeito. No pior cenário, isto equivale a ter a velocidade reduzida. Turnos de congelação restantes: Velocidade reduzida em:
actors.buffs.chill.freezes=%s congela!
actors.buffs.chill.name=gelado
actors.buffs.combo$combomove.clobber.desc=Empurra um inimigo 2 casas para trás, mas não causa dano e não pode atirá-lo para buracos. Aumenta o combo em 1.
actors.buffs.combo$combomove.clobber.empower_desc=Empurra o inimigo para trás _3 quadrados, causa vertigens e pode atirá-lo para buracos_, mas não causa dano. Aumenta o combo em 1.
actors.buffs.combo$combomove.clobber.name=bater
actors.buffs.combo$combomove.crush.desc=Causa dano de %d%% (combo*25%%) ao alvo principal e metade desse dano a todos os outros inimigos numa área de efeito de 7x7. Reinicia o combo quando é utilizado.
actors.buffs.combo$combomove.crush.empower_desc=Salta para o(s) quadrado(s) %1$d e causa dano de %2$d%% (combo*25%%) ao alvo principal e metade desse dano a todos os outros inimigos numa área de efeito de 7x7. Reinicia o combo quando é utilizado.
actors.buffs.combo$combomove.crush.name=esmagamento
actors.buffs.combo$combomove.fury.desc=Atinge um inimigo uma vez por cada combo que tiver; cada golpe causa 60% de dano e pode activar encantamentos. Reinicia o combo quando é utilizado.
actors.buffs.combo$combomove.fury.empower_desc=Salta para a(s) casa(s) %d e atinge um inimigo uma vez por cada combo que tiveres. Cada golpe causa 60%% de dano e pode ativar encantamentos. Reinicia o combo quando é utilizado.
actors.buffs.combo$combomove.fury.name=fúria
actors.buffs.combo$combomove.parry.desc=Ao ser ativado, bloqueia o próximo ataque até 1 turno e contra-ataca instantaneamente. Reinicia o combo se nenhum ataque for aparado.
actors.buffs.combo$combomove.parry.empower_desc=Bloqueia _todos os ataques_ em 1 turno ao ser ativado e contra-ataca instantaneamente. Reinicia o combo se nenhum ataque for aparado.
actors.buffs.combo$combomove.parry.name=aparar
actors.buffs.combo$combomove.slam.desc=Causa %d%% (combo*20%%) do seu poder de bloqueio de dano como dano bónus. Reinicia o combo quando é utilizado.
actors.buffs.combo$combomove.slam.empower_desc=Salta para a(s) casa(s) %1$d e causa %2$d%% (combo*20%%) do seu poder de bloqueio de dano como dano bónus. Reinicia o combo quando é utilizado.
actors.buffs.combo$combomove.slam.name=golpe
actors.buffs.combo.action_name=ataque combinado
actors.buffs.combo.bad_target=Deve selecionar um inimigo que esteja ao seu alcance de ataque.
actors.buffs.combo.combo=Combo %d!
actors.buffs.combo.desc=O gladiador ganha impulso à medida que acerta golpes. Cada ataque aumenta o contador de combos em um, mas demorar muito tempo entre os golpes reinicia o contador. Enquanto o gladiador estiver em combo, qualquer proteção que possua devido ao selo quebrado não começará a desaparecer. \n\n Acumular combo desbloqueia ataques especiais que não podem falhar! Um ataque diferente é desbloqueado com 2, 4, 6, 8 e 10 pontos de combo. Alguns golpes zeram o combo e outros não, mas cada golpe só pode ser utilizado uma vez por sessão de combo. \n\n Combo de corrente: %1$d. \n\n Turnos até o combo ser perdido: %2$s.
actors.buffs.combo.name=combo
actors.buffs.combo.prompt=Selecione um alvo para atacar.
actors.buffs.corrosion.desc=Um ácido poderoso derrete carne, metal e osso a uma velocidade alarmante. Os danos de corrosão aumentam com o tempo, à medida que o alvo continua a derreter. Número de voltas de corrosão restantes: %1$s. Danos de corrosão atuais: %2$d.
actors.buffs.corrosion.heromsg=Você está a derreter!
actors.buffs.corrosion.name=corrosão
actors.buffs.corrosion.ondeath=Dissolve-se...
actors.buffs.corrosion.rankings_desc=Dissolvido
actors.buffs.corruption.desc=A corrupção infiltra-se na essência de um ser, distorcendo-o contra a sua natureza original. As criaturas corrompidas atacarão os seus aliados e ignorarão os seus antigos inimigos. A corrupção também causa dano e, lentamente, levará o seu alvo à ruína. A corrupção é permanente; os seus efeitos só terminam com a morte.
actors.buffs.corruption.name=corrompido
actors.buffs.cripple.desc=Tem quase a certeza de que as pernas não foram feitas para dobrar desta forma.\n\nAleijado reduz a velocidade de movimento para metade, fazendo com que mover uma peça geralmente demore dois turnos em vez de um.\n\nTurnos restantes de aleijado: %s.
actors.buffs.cripple.heromsg=Está aleijado!
actors.buffs.cripple.name=aleijado
actors.buffs.daze.desc=Zumbidos nos ouvidos e visão turva dificultam o combate. Enquanto estiver atordoado, a precisão e a esquiva são reduzidas em 50%, tornando muito mais difícil acertar e esquivar os golpes. Turnos restantes de atordoamento:
actors.buffs.daze.heromsg=Está atordoado!
actors.buffs.daze.name=atordoado
actors.buffs.degrade.desc=Magia negra poderosa está a drenar a força que os pergaminhos de melhoramento aplicaram ao seu equipamento! Enquanto degradado, o equipamento melhorado será tratado como se fosse de um nível inferior ao real. _Cada melhoramento após +3 torna-se exponencialmente mais fraco que o anterior. _ As descrições dos seus itens irão mudar para refletir o seu nível de poder reduzido. A degradação não afeta os requisitos de força, as cargas de varinha, a durabilidade das armas de arremesso ou os artefactos. Turnos de degradação restantes: Usar um pergaminho de melhoramento ou remover maldição terminará a degradação imediatamente.
actors.buffs.degrade.heromsg=O seu equipamento parece mais fraco!
actors.buffs.degrade.name=degradado
actors.buffs.doom.desc=É difícil continuar quando parece que o universo o quer morto.As personagens condenadas receberão +67% de dano de todas as fontes. A condenação é permanente, os seus efeitos só terminam com a morte.
actors.buffs.doom.name=condenado
actors.buffs.dread.desc=Um terror tão grande que fará com que o teu alvo fuja completamente da masmorra! As criaturas afetadas pelo terror fugirão do seu adversário a alta velocidade e desaparecerão completamente da masmorra assim que estiverem fora de vista. Os inimigos derrotados desta forma concedem metade da experiência e não deixam cair itens. O choque da dor diminuirá a duração do terror. Restantes turnos de terror:
actors.buffs.dread.name=recear
actors.buffs.drowsy.desc=Uma força mágica está a dificultar a vigília; após alguns turnos, o alvo cairá num sono mágico profundo. O herói pode resistir à sonolência sofrendo danos ou estando com a saúde completa. Turnos até adormecer:
actors.buffs.drowsy.name=sonolento
actors.buffs.earthimbue.desc=Estás imbuído com o poder da terra!\n\nTodos os ataques físicos deslocarão a terra sob o inimigo, incapacitando-o por um curto período.\n\nTurnos de imbuir terra restantes: %s.
actors.buffs.earthimbue.name=impregnado de terra
actors.buffs.enhancedrings.desc=O artefacto utilizado recentemente pelo Ladino está a fortalecer os seus anéis, concedendo-lhes +1 nível.\n\nTurnos restantes: %s.
actors.buffs.enhancedrings.name=anéis aprimorados
actors.buffs.fireimbue.desc=Está imbuído com o poder do fogo! Todos os ataques físicos terão uma probabilidade de incendiar os inimigos. Além disso, é completamente imune aos efeitos do fogo. Turnos restantes de imbuimento de fogo:
actors.buffs.fireimbue.name=imbuído de fogo
actors.buffs.foresight.desc=De alguma forma, consegue ver o layout do terreno circundante com a sua mente.\n\nEnquanto estiver sob o efeito da premonição, todos os ladrilhos num amplo raio são revelados a si, incluindo quaisquer armadilhas ou portas secretas.\n\nTurnos de premonição restantes: %s.
actors.buffs.foresight.name=previsão
actors.buffs.frost.desc=Não confundir com congelação total, esta congelação mais benigna simplesmente envolve o alvo em gelo. O congelamento atua de forma semelhante à paralisia, tornando impossível a atuação do alvo. Ao contrário da paralisia, o congelamento é imediatamente cancelado se o alvo sofrer dano, uma vez que o gelo se partirá. Turnos restantes de congelação:
actors.buffs.frost.freezes=%s congela!
actors.buffs.frost.name=congelado
actors.buffs.frostimbue.desc=Está imbuído de poder gélido! Todos os ataques físicos acumularão congelamento nos inimigos de forma constante. Além disso, é completamente imune ao frio. Turnos restantes de imbuimento de gelo:
actors.buffs.frostimbue.name=impregnado de gelo
actors.buffs.fury.desc=Está zangado, e os seus inimigos não gostarão de si quando estiver zangado. Uma grande fúria arde dentro de si, aumentando o dano que causa com ataques físicos em 50. Esta fúria durará enquanto estiver com menos de 50 de saúde.
actors.buffs.fury.heromsg=Fica furioso!
actors.buffs.fury.name=furioso
actors.buffs.gravitychaostracker.desc_duration=Não é claro por quanto tempo o efeito irá durar, mas certamente não será para sempre.
actors.buffs.gravitychaostracker.desc_intro=A cada poucos turnos, todos os personagens no piso atual da masmorra serão atirados numa direção aleatória.
actors.buffs.gravitychaostracker.desc_positive=Tu e os teus aliados parecem ser imunes.
actors.buffs.gravitychaostracker.name=caos gravitacional
actors.buffs.greaterhaste.desc=Um incrível aumento de velocidade; por momentos, parece que tudo à volta está parado. Enquanto estiver sob o efeito de uma maior aceleração, as ações de movimento não demoram qualquer tempo, mas outras ações são ainda realizadas a uma velocidade normal. Cada passo de movimento consome um turno de maior aceleração. Turnos de maior aceleração restantes:
actors.buffs.greaterhaste.name=maior pressa
actors.buffs.haste.desc=A energia percorre os seus músculos, permitindo-lhe correr a velocidades incríveis!\n\nEnquanto estiver sob o efeito de aceleração, correrá com uma velocidade 3x superior, mas realizará todas as outras ações a uma velocidade normal.\n\nTurnos de aceleração restantes: %s.
actors.buffs.haste.name=pressa
actors.buffs.healing.desc=Um remédio mágico está a fazer com que as feridas se fechem e a carne se regenere. A cada turno, a saúde irá regenerar-se constantemente até que o efeito de cura expire. A quantidade de cura pode diminuir com o tempo. Próxima cura: ZXQPH0. Cura restante: ZXQPH1.
actors.buffs.healing.name=terapêutico
actors.buffs.herodisguise.desc=Magia ilusória alterou a sua aparência física! O efeito é puramente cosmético, mas a sensação é muito estranha mesmo assim.\n\nTurnos de disfarce restantes: %s.
actors.buffs.herodisguise.name=disfarçar
actors.buffs.hex.desc=Magia negra que mina a concentração, deixando o alvo ligeiramente desorientado.\n\nO feitiço reduz a precisão e a evasão em 20%%, tornando o alvo menos eficaz em combate.\n\nTurnos de feitiço restantes: %s.
actors.buffs.hex.heromsg=Você foi enfeitiçado(a)!
actors.buffs.hex.name=amaldiçoado
actors.buffs.holdfast.desc=O Guerreiro mantém a sua posição, aumentando a sua armadura em %1$d-%2$d e reduzindo a taxa de decaimento de alguns buffs em %3$d%%. Isto durará até que ele se mova.
actors.buffs.holdfast.name=agarrar-se
actors.buffs.hunger.cursedhorn=O chifre amaldiçoado rouba parte da energia dos alimentos enquanto come.
actors.buffs.hunger.desc=A fome aumenta gradualmente à medida que passas tempo na masmorra, até que eventualmente começas a morrer de fome. Enquanto estiver com fome, perderá lentamente saúde em vez de a regenerar. Racionar é importante! Se tiver saúde de sobra, passar fome não é má ideia se isso significar que haverá mais comida mais tarde. Um racionamento eficaz pode fazer com que a comida dure muito mais tempo!
actors.buffs.hunger.desc_intro_hungry=Consegue sentir o estômago a pedir comida, mas ainda não é nada urgente.
actors.buffs.hunger.desc_intro_starving=Tem tanta fome que chega a doer.
actors.buffs.hunger.hungry=esfomeado
actors.buffs.hunger.ondeath=Morreu de fome...
actors.buffs.hunger.onhungry=Está com fome.
actors.buffs.hunger.onstarving=Está morrendo de fome!
actors.buffs.hunger.rankings_desc=Morreu de fome
actors.buffs.hunger.starving=esfomeado
actors.buffs.invisibility.desc=Camuflagem-se completamente com o terreno circundante, tornando-se impossível de ser visto. Enquanto estiver invisível, os inimigos não podem atacá-lo ou segui-lo. Ataques físicos e efeitos mágicos (como pergaminhos e varinhas) cancelarão imediatamente a invisibilidade. Restantes turnos de invisibilidade:
actors.buffs.invisibility.name=invisível
actors.buffs.invulnerability.desc=Esta personagem está imbuída de grande poder protector, concedendo-lhe um breve período de invulnerabilidade!\n\nTurnos restantes: %s.
actors.buffs.invulnerability.name=invulnerável
actors.buffs.levitation.desc=Uma força mágica está a levita-lo acima do chão, fazendo-o sentir-se sem peso. As personagens levitantes movem-se silenciosamente e ignoram todos os efeitos terrestres. As armadilhas não serão acionadas, a água não apagará o fogo, as plantas não serão pisadas, as raízes não serão atingidas e os buracos serão sobrevoados. Tenha cuidado, pois todas estas coisas podem entrar em vigor no instante em que a levitação terminar! Turnos de levitação restantes: %s.
actors.buffs.levitation.name=levitando
actors.buffs.lifelink.desc=A força vital deste personagem está ligada à de outro personagem próximo. Qualquer dano recebido é partilhado entre eles.\n\nSempre que este personagem sofrer dano, metade dele será infligido ao alvo do vínculo vital.\n\nTurnos restantes do vínculo vital: %s.
actors.buffs.lifelink.name=ligação vital
actors.buffs.lifelink.ondeath=O dano vital que te matou...
actors.buffs.light.desc=Mesmo na Masmorra Mais Negra, uma luz constante ao teu lado é sempre reconfortante. A luz ajuda a manter a escuridão afastada, permitindo ver a uma distância razoável, apesar do ambiente. Número de voltas de iluminação restantes:
actors.buffs.light.name=iluminado
actors.buffs.lockedfloor.desc=O piso atual está bloqueado e não pode sair! Enquanto um piso estiver bloqueado, não sentirá fome nem sofrerá danos por inanição. Além disso, se não te esforçares para derrotar o boss deste piso, os efeitos de regeneração passiva também serão interrompidos. Se for revivido por um ankh não abençoado enquanto o piso estiver bloqueado, será reiniciado. Derrota o boss deste piso para quebrar o bloqueio.
actors.buffs.lockedfloor.name=O chão está trancado
actors.buffs.lostinventory.desc=O teu inventário foi perdido algures na masmorra! Não poderás apanhar ou usar a maioria dos itens até recuperá-lo.
actors.buffs.lostinventory.name=inventário perdido
actors.buffs.magicalsight.desc=De alguma forma, consegue ver com a mente, em vez de com os olhos.\n\nEnquanto a visão mágica estiver ativa, poderá ver através de todo o terreno num raio de 12 quadrados.\n\nTurnos restantes de visão mágica: %s.
actors.buffs.magicalsight.name=visão mágica
actors.buffs.magicalsleep.desc=Este personagem caiu num sono mágico profundo do qual não despertará naturalmente. O sono mágico é semelhante ao sono normal, exceto que apenas o dano fará com que o alvo acorde. Para o herói e os seus aliados, o sono mágico possui algumas propriedades reparadoras, permitindo-lhes curar-se rapidamente enquanto descansam.
actors.buffs.magicalsleep.fallasleep=Cai-se num sono profundo e mágico.
actors.buffs.magicalsleep.name=sono mágico
actors.buffs.magicalsleep.toohealthy=Está muito saudável e resiste à vontade de dormir.
actors.buffs.magicalsleep.wakeup=Acorda sentindo-se revigorado e saudável.
actors.buffs.magicimmune.desc=Todos os efeitos mágicos perderam o efeito sobre si, está completamente imune a eles. Enquanto imune à magia, todos os efeitos mágicos, sejam eles nocivos ou benéficos, não se aplicarão a si, incluindo maldições, encantamentos, varinhas, pergaminhos, anéis, artefactos, etc. As habilidades da armadura heroica são suficientemente fortes para funcionar independentemente deste efeito. Restantes turnos de imunidade à magia: %s.
actors.buffs.magicimmune.name=imune à magia
actors.buffs.mindvision.desc=De alguma forma, consegues ver todas as criaturas neste piso através da tua mente. É uma sensação estranha. Todos os personagens neste piso são visíveis para ti enquanto tiveres visão mental. Ver uma criatura através da visão mental conta como vê-la ou tê-la por perto para efeitos de muitos efeitos mágicos. Restantes turnos de visão mental:
actors.buffs.mindvision.name=visão mental
actors.buffs.momentum.action_name=corrida livre
actors.buffs.momentum.momentum=ganhando impulso
actors.buffs.momentum.momentum_desc=Ao mover-se, o Corredor Livre acumula impulso, que pode usar para iniciar o parkour. Cada carga de impulso concede duas rondas de parkour, e o Corredor Livre pode acumular até 10 cargas. O impulso é rapidamente perdido quando o Corredor Livre deixa de se mover. Carga de impulso atual:
actors.buffs.momentum.resting=recuperando
actors.buffs.momentum.resting_desc=Ao mover-se, o Corredor Livre ganha impulso, que pode usar para começar a correr livremente. O Corredor Livre precisa de tempo para recuperar a sua resistência antes de voltar a ganhar impulso. Turnos restantes:
actors.buffs.momentum.running=parkour
actors.buffs.momentum.running_desc=Ao mover-se, o Corredor Livre ganha impulso, que pode usar para começar a correr livremente. Enquanto corre livremente, o Corredor Livre move-se com o dobro da velocidade e ganha evasão bónus com base no seu nível. Turnos restantes:
actors.buffs.monkenergy$monkability$dash.desc=Um deslocamento instantâneo até 4 quadrados de distância. Esta habilidade permite atravessar obstáculos, mas não inimigos ou terreno sólido.
actors.buffs.monkenergy$monkability$dash.empower_desc=Um impulso instantâneo até 8 quadrados de distância. Esta habilidade permite atravessar obstáculos, mas não inimigos ou terreno sólido.
actors.buffs.monkenergy$monkability$dash.name=travessão
actors.buffs.monkenergy$monkability$dash.prompt=Escolha um local
actors.buffs.monkenergy$monkability$dragonkick.desc=Um pontapé devastador que causa dano de %1$d a %2$d e ignora a armadura. O pontapé atira o alvo para longe e paralisa-o por cada quadrado percorrido.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Um pontapé devastador que causa _%1$d-%2$d de dano_ e ignora a armadura. O pontapé atira _todos os alvos adjacentes_ para longe e paralisa-os por cada quadrado percorrido.
actors.buffs.monkenergy$monkability$dragonkick.name=pontapé do dragão
actors.buffs.monkenergy$monkability$flurry.desc=Dois golpes instantâneos que causam dano de %1$d a %2$d e ignoram a armadura. Esta habilidade não pode ser utilizada repetidamente.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Dois golpes instantâneos que causam dano de %1$d a %2$d, ignoram a armadura e usam o encantamento da tua arma. Esta habilidade não pode ser utilizada repetidamente.
actors.buffs.monkenergy$monkability$flurry.name=chuva de golpes
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=A Monja está concentrada nos seus arredores, antecipando o próximo ataque. Enquanto estiver concentrada, tem a garantia de aparar o próximo ataque recebido.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focado
actors.buffs.monkenergy$monkability$focus.desc=O Monge aproveita a oportunidade para se concentrar, permitindo-lhe defender o próximo ataque que lhe é dirigido.
actors.buffs.monkenergy$monkability$focus.empower_desc=O Monge _concentra-se instantaneamente_, permitindo-lhe disparar o próximo ataque que lhe é dirigido.
actors.buffs.monkenergy$monkability$focus.name=foco
actors.buffs.monkenergy$monkability$meditate.desc=A Monja concentra energia no seu corpo durante 5 turnos. Isto elimina a maioria dos efeitos negativos e concede-lhe 8 turnos de recarga para a sua varinha e artefactos.
actors.buffs.monkenergy$monkability$meditate.empower_desc=A Monja concentra energia no seu corpo durante 5 turnos. Isto remove a maioria dos efeitos negativos e concede-lhe 8 turnos de recarga para a sua varinha e artefactos. Ela também ganha 80% de resistência a danos enquanto medita e cura-se lentamente em 20% dos seus pontos de vida perdidos.
actors.buffs.monkenergy$monkability$meditate.name=meditar
actors.buffs.monkenergy.action=Habilidades do Monge
actors.buffs.monkenergy.desc=Ao derrotar os inimigos, a Monja ganha energia que pode utilizar em várias habilidades. A maioria dos inimigos concede 1 ponto de energia quando são derrotados, e a Monja não perde energia com o tempo. Energia atual: \n\n.
actors.buffs.monkenergy.desc_cooldown=O Monge utilizou uma habilidade recentemente e deve esperar antes de utilizar outra.\n\nTempo de recarga actual: %d turnos.
actors.buffs.monkenergy.name=energia
actors.buffs.ooze.desc=Este ácido pegajoso adere à carne, derretendo-a lentamente.\n\nO lodo causará danos consistentes ao longo do tempo, mas pode ser lavado imediatamente com água.\n\nTurnos de lodo restantes: %s.
actors.buffs.ooze.heromsg=Uma substância cáustica corrói a sua carne. Lave-a!
actors.buffs.ooze.name=lodo cáustico
actors.buffs.ooze.ondeath=Dissolve-se...
actors.buffs.ooze.rankings_desc=Dissolvido
actors.buffs.paralysis.desc=Muitas vezes, o pior a fazer é não fazer nada. A paralisia interrompe completamente todas as ações, obrigando o alvo a esperar até que o efeito passe. A dor de sofrer dano pode fazer com que as personagens resistam à paralisia, libertando-as do efeito. Turnos restantes de paralisia:
actors.buffs.paralysis.heromsg=Está paralisado!
actors.buffs.paralysis.name=paralisado
actors.buffs.paralysis.out=resistiu à paralisia
actors.buffs.physicalempower.desc=Os seus golpes foram potenciados, aumentando a quantidade de dano que pode causar ao atingir inimigos com ataques físicos.\n\nDano bónus: %1$d.\nAcertos restantes: %2$d.
actors.buffs.physicalempower.name=fisicamente capacitado
actors.buffs.pincushion.desc=As armas arremessadas que utilizou contra este personagem estão atualmente presas a ele e cairão no chão após ele ser derrotado. Os seguintes artigos estão atualmente anexados:
actors.buffs.pincushion.name=almofada de alfinetes
actors.buffs.poison.desc=O veneno espalha-se pelo corpo, prejudicando lentamente o seu funcionamento interno. O veneno causa dano a cada turno, proporcional ao tempo restante até expirar. Turnos restantes de veneno:
actors.buffs.poison.heromsg=Está envenenado!
actors.buffs.poison.name=envenenado
actors.buffs.poison.ondeath=Morreu envenenado...
actors.buffs.poison.rankings_desc=Sucumbiu ao envenenamento
actors.buffs.preparation.action_name=greve preparada
actors.buffs.preparation.assassinated=assassinado
actors.buffs.preparation.desc=O Assassino aguarda pacientemente, preparando-se para atacar a partir das sombras.
actors.buffs.preparation.desc_blink=É capaz de se teletransportar em direção a um inimigo antes de o atacar, com uma distância máxima de _%d._
actors.buffs.preparation.desc_dmg=O seu próximo ataque causará _%1$d%% de dano bónus_ e executará inimigos comuns com menos de _%2$d%% de vida_ ou bosses com menos de _%3$d%% de vida_.
actors.buffs.preparation.desc_dmg_likely=O ataque também terá maior probabilidade de causar uma maior quantidade de dano.
actors.buffs.preparation.desc_invis_next=Turnos para ataque mais forte: _%d._
actors.buffs.preparation.desc_invis_time=Turnos passados invisível: _%d._
actors.buffs.preparation.name=preparação
actors.buffs.preparation.no_target=Não há nada para atacar ali.
actors.buffs.preparation.out_of_reach=Essa meta está fora de alcance.
actors.buffs.preparation.prompt=Selecione um alvo para atacar!\nDistância máxima de intermitência: %d
actors.buffs.prismaticguard.desc=Está a ser protegido por uma imagem prismática que está atualmente inativa. Quando os inimigos estiverem presentes, a imagem prismática entrará em ação e protegê-lo-á! Enquanto inativa, a imagem prismática irá recuperar gradualmente de qualquer dano sofrido. HP atual: %d/%d.
actors.buffs.prismaticguard.desc_many=Esta imagem prismática beneficia também do Poder de Muitos. Turnos restantes: %d.
actors.buffs.prismaticguard.name=Guarda prismática
actors.buffs.recharging.desc=A energia está a fluir através de si, melhorando a taxa de recarga das suas varinhas e bastões. A cada turno, este bónus aumentará a carga atual em um quarto, para além da recarga normal. Turnos de recarga restantes:
actors.buffs.recharging.name=recarregando
actors.buffs.revealedarea.desc=Uma área da masmorra foi temporariamente revelada ao herói. Ele poderá vê-la não importa onde esteja. \n\nTurnos restantes: %s.
actors.buffs.revealedarea.name=área revelada
actors.buffs.revealedchar.desc=Esta personagem é revelada ao herói. Ele será visível não importa onde esteja. \n\n Turnos restantes: %s.
actors.buffs.revealedchar.name=revelado
actors.buffs.roots.desc=As raízes (mágicas ou naturais) agarram os pés, forçando-os para baixo, em direção ao chão. \n\n As raízes fixam um alvo no lugar, tornando o movimento e a maioria das habilidades de movimento impossíveis. Outras ações não são afetadas, incluindo efeitos de teletransporte. \n\n Turnos restantes da raiz: %s.
actors.buffs.roots.heromsg=Não se pode mexer!
actors.buffs.roots.name=enraizado
actors.buffs.scrollempower.desc=A energia do pergaminho lido recentemente pelo Mago está a fortalecer as suas varinhas! Aumento de nível: +\n\nZaps restantes: %2$d.
actors.buffs.scrollempower.name=rolagem capacitar
actors.buffs.shadows.desc=Funde-se às sombras ao seu redor, o que lhe concede invisibilidade e abranda o seu metabolismo. Enquanto estiver invisível, os inimigos não poderão atacá-lo ou segui-lo. A maioria dos ataques físicos e efeitos mágicos (como pergaminhos e varinhas) cancelarão imediatamente a invisibilidade. Além disso, enquanto estiver fundido às sombras, a sua fome será reduzida. Permanecerá fundido às sombras até sair delas ou um inimigo entrar em contacto consigo.
actors.buffs.shadows.name=sombra mesclada
actors.buffs.slow.desc=A magia de lentidão afeta a perceção do tempo do alvo, fazendo com que tudo se mova a uma velocidade supersónica. Uma personagem com a magia de slow realiza todas as ações no dobro do tempo que normalmente demoraria. Turnos restantes de lentidão:
actors.buffs.slow.name=desacelerado
actors.buffs.snipersmark.action_name_snapshot=instantâneo
actors.buffs.snipersmark.action_name_sniper=tiro de atirador
actors.buffs.snipersmark.action_name_volley=voleio
actors.buffs.snipersmark.desc=A Atiradora está focada no alvo que atacou mais recentemente. Ela é capaz de realizar um ataque especial com o seu arco, que varia de acordo com o melhoramento do arco. Um arco sem melhorias dispara um _tiro rápido_, que causa dano reduzido, mas não demora a disparar. Um arco melhorado para a velocidade dispara uma _saraivada_ de três flechas. Cada flecha causa dano reduzido, mas ainda pode ativar um encantamento. Esta saraivada demora 1 turno para ser disparada. Um arco melhorado para dano dispara um _tiro de precisão_. Este tiro tem acerto garantido, causa dano bónus com base na distância do alvo e demora 2 turnos a ser disparado. Turnos restantes:
actors.buffs.snipersmark.name=marca de atirador
actors.buffs.soulmark.desc=O bruxo acedeu à alma desta criatura, permitindo-lhe curar-se enquanto sofre dano físico.\n\nTurnos restantes da marca da alma: %s.
actors.buffs.soulmark.name=alma marcada
actors.buffs.stamina.desc=Tens uma resistência infinita, permitindo movimentos mais rápidos!\n\nEnquanto estiveres sob o efeito da resistência, correrás com +50%% de velocidade, mas executarás todas as outras ações à velocidade normal.\n\nTurnos de resistência restantes: %s.
actors.buffs.stamina.name=resistência
actors.buffs.terror.desc=O terror é uma magia manipuladora que força o seu alvo a um pânico incontrolável. Personagens aterrorizadas são forçadas a fugir do seu adversário, tentando colocar o máximo de portas e paredes entre elas possível. O choque da dor, no entanto, diminuirá a duração do terror. Turnos de terror restantes:
actors.buffs.terror.name=aterrorizada
actors.buffs.toxicimbue.desc=Está imbuído de energia venenosa!\n\nAo mover-se, um gás tóxico emanará constantemente de si, causando dano aos seus inimigos. É imune ao gás tóxico e ao veneno durante a duração do efeito, bem como durante alguns turnos depois.\n\nTurnos restantes de imbuimento tóxico: %s.
actors.buffs.toxicimbue.name=impregnado de toxicidade
actors.buffs.vertigo.desc=Andar em linha reta pode ser difícil quando o mundo inteiro está a girar.\n\nSob os efeitos da vertigem, as personagens que tentarem mover-se irão numa direção aleatória, em vez daquela que pretendiam seguir.\n\nTurnos de vertigem restantes: %s.
actors.buffs.vertigo.name=vertigem
actors.buffs.vulnerable.desc=A magia Vulnerabilidade aumenta todo o dano físico que uma personagem recebe em 33%%, após esse dano ter sido reduzido pela armadura.\n\nTurnos restantes de vulnerabilidade: %s.
actors.buffs.vulnerable.heromsg=Sente-se frágil!
actors.buffs.vulnerable.name=vulnerável
actors.buffs.wandempower.desc=As suas varinhas de dano foram melhoradas, aumentando a quantidade de dano que causam durante alguns golpes.\n\nDano bónus: %1$d.\nGatilhos restantes: %2$d.
actors.buffs.wandempower.name=varinhas energizadas
actors.buffs.weakness.desc=De repente, tudo parece muito mais pesado. ZXQPH2 ZXQ ZXQPH3 ZXQ A magia de enfraquecimento reduz a força física de uma personagem, fazendo com que cause 33 ZXQPH0 ZXQ de dano reduzido. ZXQPH4 ZXQ ZXQPH5 ZXQ Turnos de fraqueza restantes: ZXQPH1 ZXQ.
actors.buffs.weakness.heromsg=Sente-se fraco!
actors.buffs.weakness.name=enfraquecido
actors.buffs.wellfed.desc=Sente-se bastante satisfeito e saciado.\n\nEnquanto estiver bem alimentado, a sua fome não aumentará e recuperará uma quantidade adicional de saúde ao longo do tempo.\n\nTurnos restantes: %d.
actors.buffs.wellfed.name=bem alimentado
actors.char.def_verb=esquivou-se
actors.char.def_verb_blocked=bloqueado
actors.char.defeat=Derrotaste %s.
actors.char.immune=imune
actors.char.invulnerable=invulnerável
actors.char.kill=%s matou-te...
actors.hero.abilities.armorability.cost=Custo da cobrança: _%d_
actors.hero.abilities.armorability.no_target=Não há nada a apontar ali!
actors.hero.abilities.armorability.prompt=Escolha um local para segmentar
actors.hero.abilities.armorability.self_target=Não se pode escolher como alvo!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Energia radiante emana do corpo do Clérigo. Enquanto estiver nesta forma, o Clérigo ganha 2 de alcance de ataque (devido à energia sagrada projectada por ele) e 10 de escudo sempre que gasta uma carga de tomo sagrado. Pode também conjurar as magias desbloqueadas pelos talentos da forma ascendida. O escudo concedido pela forma ascendida e pelas suas magias não se dissipará normalmente, mas desaparecerá instantaneamente quando a forma ascendida terminar. Escudo atual: 0. Turnos restantes: 1.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=forma ascendida
actors.hero.abilities.cleric.ascendedform.desc=O Clérigo projeta energia sagrada de si mesmo, assumindo uma forma radiante estendida por 10 turnos. Enquanto estiver nesta forma, o Clérigo pode lançar novas magias, ganha 2 de alcance de ataque, 30 de escudo e quaisquer magias adicionais que lance concederão 10 de escudo por carga de tomo sagrado utilizada. O escudo da forma ascendida e das suas magias não se dissipa normalmente, mas desaparecerá imediatamente assim que a forma ascendida terminar. A habilidade pode ser reutilizada para renovar a duração da forma ascendida.
actors.hero.abilities.cleric.ascendedform.name=forma ascendida
actors.hero.abilities.cleric.ascendedform.short_desc=O Clérigo assume uma _Forma Ascendida_, ganhando novas magias, alcance de ataque e proteção.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Uma cópia de um dos companheiros de aventura do Clérigo, feita de luz sólida. Embora tenha a forma de outro herói, não possui nenhuma das suas habilidades únicas. Este aliado persistirá enquanto o Poder de Muitos lhe estiver aplicado. Este aliado pode ser visado sem custos ao reutilizar a habilidade de armadura Poder de Muitos.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=O seu aliado move-se para atacar!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=O seu aliado move-se para essa posição.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=O seu aliado move-se para segui-lo.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Pode encontrar este personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.cleric.powerofmany$lightally.name=aliado da luz
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Este aliado foi fortalecido pelo Poder de Muitos, concedendo-lhe +25%% de dano causado e -25%% de dano recebido. Partilhará também o seu alcance de visão com o Clérigo e poderá beneficiar de magias de Poder de Muitos. O Poder de Muitos persistirá mesmo quando se esconderem aliados como imagens prismáticas, mas a sua duração continuará a ser contabilizada. Turnos Restantes: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=poder de muitos
actors.hero.abilities.cleric.powerofmany.ally_exists=Já tem um aliado empoderado.
actors.hero.abilities.cleric.powerofmany.desc=O Clérigo canaliza o _Poder de Muitos_, que fortalece um aliado existente ou cria um novo aliado fortalecido durante 100 turnos. Escolher um espaço vazio cria um novo aliado. Enquanto estiver fortalecido pelo Poder de Muitos, qualquer aliado causa +25% de dano, recebe -25% de dano e partilha a sua visão com o Clérigo. Também ganha 25 de escudo quando a habilidade é utilizada. O Clérigo ganha também três novas magias que só podem ser lançadas com um aliado fortalecido. O Poder de Muitos não termina enquanto uma destas magias estiver ativa.
actors.hero.abilities.cleric.powerofmany.name=poder de muitos
actors.hero.abilities.cleric.powerofmany.no_vision=Não pode selecionar um local que não consegue ver.
actors.hero.abilities.cleric.powerofmany.only_allies=Só pode fortalecer aliados.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Direcione o seu aliado de luz
actors.hero.abilities.cleric.powerofmany.prompt_default=Escolha um aliado ou local
actors.hero.abilities.cleric.powerofmany.short_desc=O Clérigo canaliza o _Poder de Muitos_, fortalecendo um aliado existente ou criando um novo.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Atribuir à forma do corpo
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Atribua à forma mental
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Atribuir à forma espiritual
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Selecione um efeito para ser imbuído em Trinity. Informações adicionais serão apresentadas antes da confirmação.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Forma do corpo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Forma Mental: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Forma Espiritual: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Selecione qual a forma da Trindade a utilizar. Os efeitos de diferentes formas podem estar ativos em simultâneo.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity aplicará o efeito de alquimia remota deste artefacto, com o custo de _%2$s de carga. _
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity aplicará o efeito passivo de regeneração de vida deste artefacto em _+%1$d_ durante 20 turnos, com um custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.cost=O custo de ativação desta habilidade varia, mas é normalmente _%d._
actors.hero.abilities.cleric.trinity.desc=O Clérigo adquire uma _Trindade_ de habilidades de armadura, que podem ser atribuídas a vários efeitos de itens utilizando três novas magias. Cada uma destas magias foca-se em emular os efeitos de diferentes tipos de equipamento que o Clérigo identificou durante esta jornada: forma corporal (armas e armaduras), forma mental (varinhas e armas de arremesso) e forma espiritual (anéis e artefactos). Cada forma da Trindade pode ser imbuída com um efeito de cada vez, e o Clérigo escolhe qual ativar ao usar a Trindade. A Trindade não duplicará o efeito de algo que já tenha equipado.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity utilizará o efeito deste artefacto para invocar um espectro aliado corrompido com o HP de um fantasma _+%1$d_, com o custo de _%2$s cargas._
actors.hero.abilities.cleric.trinity.ench_glyph_use=A Trinity aplicará este efeito por _%1$d turnos_ com o custo de _%2$s de carga. _
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity aplicará o efeito de conjuração em cadeia deste artefacto com um alcance de _+%1$d_, com um custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity aplicará o efeito de consumo deste artefacto, com o custo de uma carga de _%2$s_.
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity aplicará o efeito de roubo de inimigos deste artefacto em _+%1$d_, com o custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.name=trindade
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity não pode duplicar um efeito que já tenhas equipado!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity não possui qualquer efeito definido para nenhuma das suas formas de momento, utilize uma das suas magias!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=A Trinity aplicará este efeito _poderoso_ por _%1$d turnos_ ao custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.ring_use=Trinity aplicará o efeito deste anel em _+%1$d_ durante 20 turnos, com o custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=A Trinity aplicará o efeito raiz deste artefacto com uma semente nociva aleatória, com o custo de _%2$s de carga. _
actors.hero.abilities.cleric.trinity.short_desc=O Clérigo adquire uma _Trindade_ de habilidades, que emulam equipamento que ele viu e podem ser atribuídas usando novas magias.
actors.hero.abilities.cleric.trinity.skeletonkey_use=A Trinity aplicará o efeito de inserção deste artefacto, com um custo de _%2$s de carga. _
actors.hero.abilities.cleric.trinity.talismanofforesight_use=A Trinity aplicará o efeito de vidência deste artefacto em _+%1$d_, com o custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.thrown_use=A Trinity lançará esta arma em _+%1$d_ com o custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=A Trinity aplicará o efeito de congelamento temporal deste artefacto com uma duração de turno de _%1$d_, com o custo de _%2$s cargas._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=A Trinity aplicará o efeito de pergaminho aleatório deste artefacto com uma probabilidade de _%1$d/10_ de oferecer a versão exótica sem custos adicionais, com um custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.wand_multi_use=A Trinity vai disparar este bastão de _multicarga_ em _+%1$d_ com o custo de _%2$s de carga._
actors.hero.abilities.cleric.trinity.wand_use=A Trinity lançará esta varinha a _+%1$d_ com o custo de _%2$s de carga. _
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Este personagem está a participar num duelo. Ele, e quaisquer aliados ou lacaios seus, podem agir normalmente enquanto os outros estão congelados. O duelo durará por um período determinado, até que um participante morra ou até que os participantes se afastem mais de 5 casas uns dos outros. Turnos restantes:
actors.hero.abilities.duelist.challenge$duelparticipant.name=participante do duelo
actors.hero.abilities.duelist.challenge.ally_target=Só pode desafiar inimigos.
actors.hero.abilities.duelist.challenge.already_dueling=Só pode participar num duelo por vez.
actors.hero.abilities.duelist.challenge.desc=A Duelista desafia um inimigo próximo para um duelo. Esse inimigo é obrigado a lutar contra ela enquanto todos os outros inimigos são temporariamente congelados no tempo. O alvo deve estar ao alcance e até 5 quadrados da Duelista. O duelo dura até que se passem 10 turnos, o inimigo morra ou a Duelista esteja a mais de 5 quadrados de distância do inimigo. Os inimigos congelados são invulneráveis. Os aliados da Duelista não são congelados por esta habilidade, mas se um boss for o alvo, os seus lacaios também não serão congelados.
actors.hero.abilities.duelist.challenge.distant_target=Esse inimigo está demasiado longe para ser enfrentado.
actors.hero.abilities.duelist.challenge.name=desafio
actors.hero.abilities.duelist.challenge.prompt=Escolha um inimigo para desafiar.
actors.hero.abilities.duelist.challenge.short_desc=O Duelista desafia um inimigo próximo para um duelo, congelando temporariamente todos os outros inimigos.
actors.hero.abilities.duelist.challenge.unreachable_target=Precisa de ser capaz de atingir o seu objetivo.
actors.hero.abilities.duelist.elementalstrike.desc=O Duelista ataca um inimigo ou local, realizando um ataque normal com acerto garantido e espalhando um efeito mágico que se propaga até 4 quadrados num cone de 65 graus. Este efeito mágico varia de acordo com o encantamento da arma principal do Duelista.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Um ataque elemental sem encantamento irá libertar uma pequena explosão de magia, causando 6 a 12 de dano a todos os inimigos dentro do alcance.
actors.hero.abilities.duelist.elementalstrike.name=ataque elemental
actors.hero.abilities.duelist.elementalstrike.short_desc=A Duelista executa um _Golpe Elemental_, espalhando um efeito numa área cónica com base no encantamento da sua arma.
actors.hero.abilities.duelist.feint.bad_location=Não pode se mudar para esse local.
actors.hero.abilities.duelist.feint.desc=A Duelista simula um ataque enquanto se desloca rapidamente para uma casa adjacente, deixando para trás uma imagem residual momentânea de si mesma. Os inimigos que estavam a atacar a Duelista atacarão agora a sua imagem residual. Os inimigos que atacam a imagem residual ficam confusos, o que cancela a sua próxima ação e os deixa vulneráveis a um ataque surpresa.
actors.hero.abilities.duelist.feint.name=finta
actors.hero.abilities.duelist.feint.prompt=Escolha um local para onde ir.
actors.hero.abilities.duelist.feint.short_desc=A Duelista realiza uma finta, simulando um ataque enquanto se desloca rapidamente para um quadrado adjacente. Os inimigos atacarão a sua imagem residual, ficando vulneráveis a um contra-ataque.
actors.hero.abilities.duelist.feint.too_far=Esse local não fica perto de si.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=A Caçadora é brevemente fortalecida, aumentando a sua velocidade de movimento e velocidade de ataque com o seu arco.\n\nTurnos restantes: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=O poder da natureza
actors.hero.abilities.huntress.naturespower.desc=A Caçadora fortalece-se temporariamente, assim como o seu arco, com o poder da natureza! Este dura 8 turnos. Durante este tempo, a Caçadora move-se com o dobro da velocidade e ataca 33% mais rápido com o seu arco. Os efeitos bónus do arco não são ativados se a Atiradora estiver a utilizar os seus ataques especiais.
actors.hero.abilities.huntress.naturespower.name=O poder da natureza
actors.hero.abilities.huntress.naturespower.short_desc=A Caçadora invoca o _Poder da Natureza_, aumentando a sua velocidade de movimento e a cadência de tiro do seu arco por um curto período de tempo.
actors.hero.abilities.huntress.spectralblades.desc=A Caçadora lança uma lâmina espectral contra um inimigo, que atua como um ataque à distância da sua arma de combate corpo a corpo. Todos os efeitos normais de uma arma corpo a corpo serão ativados, incluindo os encantamentos.
actors.hero.abilities.huntress.spectralblades.name=lâminas espectrais
actors.hero.abilities.huntress.spectralblades.short_desc=A Caçadora lança _Lâminas Espectrais_ para um alvo, causando dano dependendo da arma de combate corpo a corpo que estiver a utilizar.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Um falcão mágico, invocado pela Caçadora. Brilha com um azul etéreo intenso, e a sua cabeça move-se constantemente enquanto observa a área. Embora não seja um grande lutador, a sua velocidade e visão tornam-no excelente para reconhecimento e para distrair os inimigos.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Esquivas garantidas restantes: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turnos restantes: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=O seu falcão prepara-se para atacar!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=O seu falcão move-se para essa posição.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=O seu falcão move-se para segui-lo.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Pode encontrar este personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.huntress.spirithawk$hawkally.name=falcão espiritual
actors.hero.abilities.huntress.spirithawk.desc=A Caçadora invoca um falcão espiritual familiar, que pode ser controlado usando novamente a habilidade enquanto é invocado. O falcão dura 100 turnos e controlá-lo não consome qualquer carga. O falcão tem pouca vida e poder de ataque, mas é rápido, evasivo e preciso. Partilha todo o seu campo de visão com a Caçadora o tempo todo. É imune a todos os efeitos de área, como fogo e gás venenoso. Não atacará a menos que seja especificamente comandado.
actors.hero.abilities.huntress.spirithawk.name=falcão espiritual
actors.hero.abilities.huntress.spirithawk.no_space=Não há vagas disponíveis perto de si.
actors.hero.abilities.huntress.spirithawk.short_desc=A Caçadora invoca um familiar _Falcão Espiritual_, que a pode ajudar a explorar locais e a distrair os inimigos.
actors.hero.abilities.mage.elementalblast.desc=O Mago emite uma explosão mágica que cobre uma região circular até 4 quadrados de distância e causa 15 a 25 pontos de dano. O efeito específico da explosão elemental varia de acordo com a varinha imbuída no bastão do Mago.
actors.hero.abilities.mage.elementalblast.generic_desc=O efeito da explosão elemental será semelhante ao efeito da varinha quando lançada contra um inimigo ou aliado.
actors.hero.abilities.mage.elementalblast.name=explosão elemental
actors.hero.abilities.mage.elementalblast.no_staff=Não pode usar esta habilidade sem a sua equipa.
actors.hero.abilities.mage.elementalblast.short_desc=O mago emite uma _Explosão Elemental_ do seu bastão, cobrindo uma grande área à sua volta, com um efeito que varia de acordo com a varinha do seu bastão.
actors.hero.abilities.mage.warpbeacon.depths=Não se pode teletransportar entre profundidades!
actors.hero.abilities.mage.warpbeacon.desc=O Mago coloca um farol, que pode ser usado para se teletransportar à vontade. Colocar o farol demora 1 turno, mas o teletransporte até ele é instantâneo. O Mago não se pode teletransportar entre andares por defeito, nem usar o farol para alcançar locais inacessíveis, como salas trancadas. O Mago pode teletransportar-se para dentro dos inimigos, empurrando-os para o lado.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Não pode colocar um farol ali!
actors.hero.abilities.mage.warpbeacon.locked_floor=Não pode sair de um andar trancado!
actors.hero.abilities.mage.warpbeacon.name=farol de dobra
actors.hero.abilities.mage.warpbeacon.short_desc=O Mago coloca um _Farol de Teletransporte_ na sua localização atual, para o qual pode teletransportar-se instantaneamente de volta.
actors.hero.abilities.mage.warpbeacon.too_far=Esse lugar é muito longe!
actors.hero.abilities.mage.warpbeacon.window_cancel=Cancelar
actors.hero.abilities.mage.warpbeacon.window_clear=farol claro
actors.hero.abilities.mage.warpbeacon.window_desc=O seu farol está atualmente localizado no piso %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teletransportar para o farol
actors.hero.abilities.mage.wildmagic.desc=O Mago liberta o poder das suas varinhas, disparando-as aleatoriamente até 4 vezes num único turno. O bastão do Mago não está incluído neste efeito. Cada varinha tem também o seu nível aumentado em 2, até um máximo de +3. Esta habilidade utiliza metade da carga de uma varinha a cada disparo, e nenhuma varinha pode ser disparada mais de 2 vezes.
actors.hero.abilities.mage.wildmagic.name=magia selvagem
actors.hero.abilities.mage.wildmagic.no_wands=Não tem varinhas para lançar raios!
actors.hero.abilities.mage.wildmagic.short_desc=O Mago liberta a _Magia Selvagem_ contida nas suas varinhas, disparando-as aleatoriamente várias vezes contra um alvo escolhido durante um único turno.
actors.hero.abilities.ratmogrify$transmograt.desc=Este inimigo foi transformado num rato. Uma grande melhoria, na minha opinião! - Rei dos Ratos
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrificado %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Morto por: inimigo ratmogrificado
actors.hero.abilities.ratmogrify.cant_transform=Não pode transformar isso num rato!
actors.hero.abilities.ratmogrify.desc=O herói transforma um inimigo num rato durante 6 turnos! Os chefes, aliados e ratos não podem ser transformados em ratos. Os inimigos transformados em ratos mantêm os seus atributos originais, mas não possuem habilidades.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=O herói transforma um inimigo num rato! Isto transforma-o temporariamente em um rato sem habilidades.
actors.hero.abilities.ratmogrify.too_strong=Este inimigo é demasiado forte para ser transformado em ratmogrificado!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Este inimigo foi marcado, fazendo com que receba 25%% de dano adicional, mas também tornando-o incapaz de morrer até que a marca termine.\n\nTurnos restantes: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marcado para morrer
actors.hero.abilities.rogue.deathmark.ally_target=Só pode marcar inimigos.
actors.hero.abilities.rogue.deathmark.desc=O Ladino marca um inimigo escolhido, fazendo com que este receba 25% de dano extra. A marca é aplicada instantaneamente e dura 5 turnos. Os inimigos marcados recebem dano bónus, mas não podem morrer até que a marca expire. Se um inimigo tiver 0 PV quando a marca terminar, morrerá imediatamente.
actors.hero.abilities.rogue.deathmark.name=marca da morte
actors.hero.abilities.rogue.deathmark.short_desc=O Ladino coloca uma _Marca da Morte_ num inimigo escolhido. Os inimigos marcados sofrem dano adicional, mas não podem morrer até que a marca termine.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Uma cópia do Ladino, feita de trevas obscuras. Permanece imóvel, com os olhos vazios e minúsculos fios de escuridão que dele emanam como vapor. O clone não é uma cópia perfeita do Ladino, mas ainda é um lutador decente e pode beneficiar do equipamento do Ladino com os talentos certos.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=O teu clone move-se para atacar!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=O seu clone move-se para essa posição.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=O teu clone move-se para te seguir.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Pode encontrar este personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ladino das sombras
actors.hero.abilities.rogue.shadowclone.desc=O Ladino invoca um clone sombrio de si próprio, que pode ser controlado para o auxiliar em combate. Controlar o clone sombrio não consome qualquer carga. O clone tem 80 PV, não usa armadura e causa 10 a 20 de dano. Todas estas características podem ser melhoradas com talentos, de forma a que o clone beneficie das armas e armaduras que o herói possui.
actors.hero.abilities.rogue.shadowclone.name=clone das sombras
actors.hero.abilities.rogue.shadowclone.short_desc=O Ladino invoca um _Clone Sombrio_, que pode ser direccionado para o auxiliar em combate.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=De alguma forma, os inimigos são facilmente convencidos de que este isco de madeira é o verdadeiro Rogue!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Pode encontrar este personagem com uma habilidade específica de armadura de herói.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=isco de madeira
actors.hero.abilities.rogue.smokebomb.desc=O Ladino lança uma bomba de fumo e teletransporta-se até 6 quadrados de distância. Pode teletransportar-se através de obstáculos e inimigos, mas não através de terreno sólido como paredes. Os inimigos adjacentes à posição anterior do Ladino ficarão cegos durante 5 turnos.
actors.hero.abilities.rogue.smokebomb.fov=Só pode saltar para um local vazio no seu campo de visão.
actors.hero.abilities.rogue.smokebomb.name=bomba de fumo
actors.hero.abilities.rogue.smokebomb.prompt=Escolha um local para onde pretende ir.
actors.hero.abilities.rogue.smokebomb.short_desc=O Ladino lança uma Bomba de Fumo enquanto desaparece teletransportando-se. Cega os inimigos próximos da sua posição anterior.
actors.hero.abilities.warrior.endure$enduretracker.desc=O Guerreiro causa agora dano bónus com base no dano que sofreu.\n\nDano Bónus: %1$d\nAcertos Restantes: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=resistência
actors.hero.abilities.warrior.endure.desc=O Guerreiro resiste durante 3 turnos, recebendo metade do dano de todas as fontes. Esta redução é aplicada antes de efeitos de resistência a danos, como a armadura. Após resistir, o próximo ataque do guerreiro dentro de 10 turnos recebe dano bónus. Este dano bónus é igual a metade de todo o dano que lhe é infligido enquanto resistia, antes de quaisquer efeitos de redução de dano! Se o Guerreiro tiver algum combo, usar essa habilidade aumenta o tempo restante em 3 turnos.
actors.hero.abilities.warrior.endure.name=suportar
actors.hero.abilities.warrior.endure.short_desc=O Guerreiro _Persiste_, saltando vários turnos, mas ganhando uma elevada resistência ao dano. Ele causa então dano bónus com base no que perseverou.
actors.hero.abilities.warrior.heroicleap.desc=O Guerreiro salta em direção a um local alvo, passando por cima de quaisquer inimigos ou obstáculos que se atravessem no seu caminho. No entanto, não pode saltar sobre muros ou outros terrenos firmes.
actors.hero.abilities.warrior.heroicleap.name=salto heróico
actors.hero.abilities.warrior.heroicleap.prompt=Escolha a direção do salto.
actors.hero.abilities.warrior.heroicleap.short_desc=O Guerreiro executa um Salto Heroico em direção a um local alvo, sobrevoando inimigos e obstáculos.
actors.hero.abilities.warrior.shockwave.desc=O Guerreiro golpeia o chão, produzindo uma onda de choque que se propaga até 5 quadrados num cone de 60 graus. Os inimigos atingidos por esta onda de choque ficam incapacitados durante 5 turnos. Sofrem também 5 a 10 pontos de dano, mais 1 a 2 pontos de dano adicionais por cada ponto de força que o Guerreiro tenha acima de 10.
actors.hero.abilities.warrior.shockwave.name=onda de choque
actors.hero.abilities.warrior.shockwave.short_desc=O Guerreiro liberta uma Onda de Choque numa área de efeito cónico ao golpear o chão. Os inimigos atingidos pela onda de choque sofrem danos e ficam incapacitados.
actors.hero.hero.key_distracted=Não consegue abrir a fechadura, terá de continuar a tentar.
actors.hero.hero.leave=Ainda não podes sair, o resto da masmorra espera por ti lá em baixo!
actors.hero.hero.level_cap=Não pode ficar mais forte, mas as suas experiências dão-lhe uma onda de energia!
actors.hero.hero.level_up=Suba de nível!
actors.hero.hero.locked_chest=Este baú está trancado e não tens a chave correspondente.
actors.hero.hero.locked_door=Não possui uma chave correspondente.
actors.hero.hero.name=tu
actors.hero.hero.new_level=Suba de nível! +Precisão, +Evasão, +5 PV!
actors.hero.hero.new_talent=+1 Ponto de Talento!
actors.hero.hero.noticed_smth=Percebeu algo.
actors.hero.hero.pain_resist=A dor ajuda-o a resistir à vontade de dormir.
actors.hero.hero.revive=A cruz ankh explode com energia vital!
actors.hero.hero.search=pesquisa
actors.hero.hero.search_distracted=É difícil concentrar-se, a pesquisa é exaustiva.
actors.hero.hero.unspent=Tem pontos de talento não utilizados!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Não pode carregar: %s.
actors.hero.hero.you_now_have=Você selecionou: %s.
actors.hero.heroclass.cleric=clérigo
actors.hero.heroclass.cleric_desc=O Clérigo começa com um tomo sagrado único, que pode utilizar para lançar várias magias. A maioria dos talentos do Clérigo concentra-se em aprender ou aperfeiçoar magias. O Clérigo começa também com um cacete, armadura de tecido, um cantil e uma bolsa de veludo. O Clérigo identifica automaticamente: Pergaminhos de Identificação, Poções de Pureza e Pergaminhos de Remover Maldição.
actors.hero.heroclass.cleric_desc_short=O Clérigo é um conjurador divino que usa o seu tomo sagrado único para canalizar magia divina. Pode aprender e aprimorar feitiços através de talentos.
actors.hero.heroclass.cleric_unlock=Para desbloquear o Clérigo, remova completamente a maldição de qualquer peça de equipamento amaldiçoada.
actors.hero.heroclass.duelist=duelista
actors.hero.heroclass.duelist_desc=O Duelista começa com um florete único com uma habilidade especial que se recarrega com o tempo. Cada arma do jogo possui uma habilidade especial diferente que o Duelista pode utilizar. O Duelista também começa com dois espinhos de arremesso, armadura de tecido, um cantil e uma bolsa de veludo. O Duelista identifica automaticamente: Pergaminhos de Identificação, Poções de Força e Pergaminhos de Imagem Espelhada.
actors.hero.heroclass.duelist_desc_short=A Duelista é uma mestre em armas que pode usar a sua arma para ativar uma habilidade especial. Esta habilidade especial é diferente para cada arma.
actors.hero.heroclass.duelist_unlock=Para desbloquear o Duelista, equipa uma arma de nível 2 ou superior sem penalização de força.
actors.hero.heroclass.huntress=caçadora
actors.hero.heroclass.huntress_desc=A Caçadora começa com um arco espiritual único, que pode disparar um número infinito de flechas conjuradas. A Caçadora consegue atravessar erva alta sem a pisotear. Começa também com luvas cravejadas, armadura de tecido, um cantil e uma bolsa de veludo. A Caçadora identifica automaticamente: Pergaminhos de Identificação, Poções de Visão Mental e Pergaminhos de Canção de Ninar.
actors.hero.heroclass.huntress_desc_short=A Caçadora é uma mestre em armas de arremesso e possui um arco mágico com flechas infinitas. Ela também consegue atravessar a erva alta sem a pisar.
actors.hero.heroclass.huntress_unlock=Para desbloquear a Caçadora, atinge os inimigos com armas de arremesso 10 vezes numa partida.
actors.hero.heroclass.mage=mago
actors.hero.heroclass.mage_desc=O Mago começa com um bastão único, que recarrega significativamente mais rápido que uma varinha e possui uma carga extra. O bastão pode ser imbuído com qualquer varinha que o Mago encontre na masmorra. O Mago começa também com uma varinha de mísseis mágicos imbuída no seu bastão, armadura de tecido, um cantil e uma bolsa de veludo. O Mago identifica automaticamente: Pergaminhos de Identificação, Poções de Chama Líquida e Pergaminhos de Melhoria.
actors.hero.heroclass.mage_desc_short=O Mago é um especialista em magia arcana e transporta um bastão mágico mais poderoso que uma varinha. O bastão pode ser imbuído com qualquer varinha que o Mago encontrar.
actors.hero.heroclass.mage_unlock=Para desbloquear o Mago, utilize um pergaminho de aperfeiçoamento para fortalecer um item.
actors.hero.heroclass.rogue=por conta própria
actors.hero.heroclass.rogue_desc=O Ladino começa com uma Capa das Sombras única, que pode usar para se tornar invisível à vontade. O Ladino consegue detetar segredos e armadilhas a uma distância maior. Começa também com um punhal, três facas de arremesso, armadura de tecido, um cantil e uma bolsa de veludo. O Ladino identifica automaticamente: Pergaminhos de Identificação, Poções de Invisibilidade e Pergaminhos de Mapeamento Mágico.
actors.hero.heroclass.rogue_desc_short=O Ladino pode evadir-se dos inimigos e atacar invisível usando o seu manto das sombras. Também deteta segredos e armadilhas a uma distância maior.
actors.hero.heroclass.rogue_unlock=Para desbloquear o Ladino, realiza 10 ataques surpresa numa única partida.
actors.hero.heroclass.warrior=guerreiro
actors.hero.heroclass.warrior_desc=O Guerreiro começa com um _selo único quebrado_ que lhe concede uma explosão de escudo quando a sua saúde está abaixo de metade. O selo pode ser transferido entre armaduras e pode _transferir uma única melhoria_ com ele. O Guerreiro começa também com uma _espada curta gasta_, _três pedras de arremesso_, armadura de tecido, um cantil e uma bolsa de veludo. O Guerreiro identifica automaticamente: Pergaminhos de Identificação, Poções de Cura e Pergaminhos de Fúria.
actors.hero.heroclass.warrior_desc_short=O Guerreiro suporta dano extra com a proteção concedida pelo seu _selo quebrado_. O selo pode ser transferido entre armaduras e _transfere uma única melhoria_.
actors.hero.heroclass.warrior_unlock=O Guerreiro é desbloqueado automaticamente.
actors.hero.herosubclass.assassin=assassino
actors.hero.herosubclass.assassin_desc=O Assassino prepara o seu próximo ataque quando se torna invisível. Quanto mais tempo ele se preparar, mais poderoso será o seu próximo ataque. A preparação pode durar até 9 turnos. Após se preparar, o Assassino causa dano bónus no seu próximo ataque, pode teletransportar-se para o alvo e até eliminar instantaneamente os inimigos que estejam suficientemente fracos.
actors.hero.herosubclass.assassin_short_desc=O _Assassino_ pode preparar um ataque mortal enquanto está invisível. Quanto mais tempo ele esperar, mais poderoso será o ataque.
actors.hero.herosubclass.battlemage=mago de batalha
actors.hero.herosubclass.battlemage_desc=O Mago de Batalha recebe um efeito bónus sempre que ataca em combate corpo a corpo com o seu bastão, como se o bastão possuísse um encantamento adicional. Estes efeitos dependem da varinha que imprimiu o bastão, sendo que cada varinha tem o seu próprio efeito. Além dos efeitos da varinha, o bastão do Mago de Batalha também ganha 0,5 cargas ao ser utilizado num ataque.
actors.hero.herosubclass.battlemage_short_desc=O _Mago de Batalha_ conjura efeitos bónus ao lutar em combate corpo a corpo com o seu bastão. Estes efeitos dependem da varinha que imbui o seu bastão.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=O Berserker acumula fúria ao sofrer dano físico, incluindo dano bloqueado pela sua armadura! A fúria diminui gradualmente com o tempo, mas diminui mais lentamente se ele estiver com pouca vida. A fúria pode fazer com que o Berserker cause até +50% de dano. Com a fúria máxima, pode entrar em frenesim, ganhando uma explosão de escudo e mantendo a fúria enquanto tiver escudo disponível. O escudo aumenta com o nível da armadura do Berserker e pode ser drasticamente aumentado se este estiver com pouca vida. O Berserker precisa de tempo para recuperar depois de entrar em frenesim.
actors.hero.herosubclass.berserker_short_desc=O Berserker acumula fúria ao sofrer dano. A fúria aumenta o seu dano e pode ser ativada a 100% para conceder escudo adicional.
actors.hero.herosubclass.champion=campeão
actors.hero.herosubclass.champion_desc=A Campeã é uma mestre em armas de combate corpo a corpo que pode equipar uma arma secundária para além da principal. Os seus ataques normais usam a sua arma principal, mas ela pode trocar de arma instantaneamente e usar a habilidade de qualquer uma das armas. Ela também ganha 2 cargas adicionais de habilidade de arma e +50% de velocidade de recarga de habilidade de arma.
actors.hero.herosubclass.champion_short_desc=A _Campeã_ pode empunhar duas armas e recebe mais cargas de armas. Os seus ataques normais usam a sua arma principal, mas ela pode trocar de arma e usar a habilidade de qualquer uma delas.
actors.hero.herosubclass.freerunner=corredor livre
actors.hero.herosubclass.freerunner_desc=À medida que o Corredor Livre se move, acumula impulso. Pode ganhar até 10 pontos de impulso após correr durante 10 turnos, mas perde-os rapidamente se parar de se mover. O Corredor Livre pode usar o seu impulso para iniciar o parkour, durante 2 turnos por cada ponto de impulso. Ao praticar parkour, o Corredor Livre move-se com uma velocidade 2x superior e ganha evasão bónus proporcional ao seu nível. Após o fim do parkour, existe um período de espera antes que o impulso possa ser novamente acumulado.
actors.hero.herosubclass.freerunner_short_desc=O _Corredor Livre_ ganha impulso enquanto corre, o que pode ser utilizado para iniciar o parkour. Isto concede-lhe bónus de velocidade e evasão por um curto período.
actors.hero.herosubclass.gladiator=gladiador
actors.hero.herosubclass.gladiator_desc=O Gladiador acumula um ponto de combo a cada ataque bem sucedido com uma arma corpo a corpo ou de arremesso. Se o Gladiador não realizar um ataque bem sucedido em 5 turnos (15 turnos após uma eliminação), o seu combo é reiniciado. À medida que acumula combo, o Gladiador pode utilizar várias habilidades com acerto garantido: Combo 2: empurra o inimigo para trás, preserva o combo; Combo 3: causa dano baseado na armadura; Combo 4: apara, preserva o combo; Combo 5: causa dano ao alvo e aos inimigos próximos; Combo 6: ataca uma vez por cada ponto de combo.
actors.hero.herosubclass.gladiator_short_desc=O Gladiador acumula combos ao realizar ataques bem sucedidos. Pode gastar combos para usar habilidades únicas.
actors.hero.herosubclass.monk=monge
actors.hero.herosubclass.monk_desc=A Monja é uma mestra da técnica física. Ao derrotar os inimigos, ganha energia que pode ser utilizada em diversas habilidades defensivas e utilitárias. Esta energia não se esgota com o tempo, mas tem um limite baseado no nível da Monja. ZXQPH0 ZXQ ZXQPH1 ZXQ1 Energia: ataque rápido com os punhos ZXQPH2 ZXQ2 Energia: concentre-se para se esquivar do próximo ataque ZXQPH3 ZXQ3 Energia: avance instantaneamente para perto ZXQPH4 ZXQ4 Energia: pontapeie um inimigo para longe ZXQPH5 ZXQ5 Energia: medite para remover efeitos negativos e restaurar a carga da varinha e do artefacto
actors.hero.herosubclass.monk_short_desc=O _Monge_ acumula energia enquanto luta. Esta energia pode ser gasta em diversas habilidades únicas.
actors.hero.herosubclass.paladin=paladino
actors.hero.herosubclass.paladin_desc=O Paladino ganha uma variedade de feitiços novos e melhorados que enfatizam o combate corpo a corpo e a sinergia com armas e armaduras. Os feitiços _Arma Sagrada_ e _Proteção Sagrada_ do Paladino concedem bónus mais elevados, já não substituem os encantamentos e glifos existentes e podem ser estendidos ao conjurar outros feitiços. O Paladino ganha também o feitiço _Golpe Divino_, que lhe permite realizar um ataque corpo a corpo garantido com dano e poder de encantamento bónus.
actors.hero.herosubclass.paladin_short_desc=O _Paladino_ ganha novas magias de curto alcance e versões melhoradas de arma sagrada e proteção sagrada.
actors.hero.herosubclass.priest=padre
actors.hero.herosubclass.priest_desc=O Sacerdote ganha uma variedade de feitiços novos e melhorados que enfatizam o combate à distância e a sinergia com itens mágicos. O Sacerdote pode conjurar _Luz Guia_ gratuitamente uma vez a cada 50 turnos, iluminando os inimigos diretamente alvejados por qualquer um dos seus feitiços, e pode consumir o debuff de iluminação com aliados, varinhas e alguns artefactos para causar dano bónus igual ao seu nível + 5. O Sacerdote também ganha o feitiço _Radiância_, que dissipa a escuridão e afeta todos os inimigos visíveis, ativando e aplicando iluminação e atordoando-os brevemente ao custo de 2 cargas.
actors.hero.herosubclass.priest_short_desc=O _Sacerdote_ ganha novas magias de longo alcance e uma versão melhorada da luz guia.
actors.hero.herosubclass.sniper=atirador de elite
actors.hero.herosubclass.sniper_desc=A Atiradora é uma mestra do combate à distância, cujos ataques perfuram a blindagem inimiga. Quando ataca um inimigo com uma arma de arremesso, marca-o com uma marca de atiradora, permitindo-lhe executar um ataque especial com o seu arco. Este ataque especial varia de acordo com o nível de melhoramento do arco. Um arco sem melhorias dispara um tiro rápido que causa dano reduzido, mas é instantâneo. Um arco de velocidade dispara uma saraivada de três flechas que causam dano reduzido, ainda podem ativar encantamentos e demoram 1 turno a disparar. Um arco de dano dispara um tiro de precisão que atinge o alvo com garantia, causa dano bónus com base na distância e demora 2 turnos a disparar.
actors.hero.herosubclass.sniper_short_desc=A _Atiradora_ consegue perfurar armaduras com os seus ataques à distância. Após atacar com uma arma arremessada, pode realizar um ataque especial com o seu arco.
actors.hero.herosubclass.warden=guarda
actors.hero.herosubclass.warden_desc=A Guardiã possui uma forte ligação com a natureza, o que lhe concede uma variedade de efeitos bónus relacionados com a relva e as plantas. Ela consegue ver através da erva alta e sulcada como se fosse o vazio. A Guardiã faz com que a relva brote à volta de qualquer semente que atire ou plante, e ganha efeitos especiais ao pisar plantas. Estes efeitos especiais substituem os efeitos normais das plantas, o que significa que nenhuma planta é prejudicial para ela pisar.
actors.hero.herosubclass.warden_short_desc=A _Guardiã_ consegue ver através da erva alta e ganha efeitos bónus ao plantar sementes e ao pisotear plantas.
actors.hero.herosubclass.warlock=bruxo
actors.hero.herosubclass.warlock_desc=O Bruxo tem uma probabilidade de infligir uma marca de alma às personagens quando usa varinhas nelas. A probabilidade de aplicar uma marca de alma e a sua duração aumentam com o nível da varinha. Quando um inimigo é marcado pela alma, o Bruxo cura 2 pontos de vida por cada 5 pontos de dano que lhe cause, mas apenas com ataques de armas corpo a corpo ou de arremesso, não com varinhas!
actors.hero.herosubclass.warlock_short_desc=O _Bruxo_ tem uma hipótese de marcar a alma dos inimigos com as suas varinhas. Curar-se-á sempre que causar dano físico a inimigos marcados.
actors.hero.spells.auraofprotection$aurabuff.desc=O Paladino está a irradiar energia protetora ao seu redor. Qualquer aliado próximo (incluindo o próprio Paladino) recebe dano reduzido e ganha o efeito do glifo de armadura do Paladino com poder aumentado. Turnos restantes:
actors.hero.spells.auraofprotection$aurabuff.name=aura de proteção
actors.hero.spells.auraofprotection.desc=O Paladino começa a irradiar energia protectora numa aura brilhante à sua volta durante 20 turnos. Qualquer aliado até 2 quadrados do Paladino (incluindo ele próprio) recebe %1$d%% menos dano e ganha o efeito do glifo de armadura do Paladino com +%2$d%% de poder. Esta redução de dano ocorre antes de outros efeitos de redução de dano (por exemplo, armadura). O aumento de poder do glifo será sempre aplicado, mas esta magia não pode fazer com que o glifo do Paladino seja aplicado mais do que uma vez se uma personagem já estiver a beneficiar dele (por exemplo, o próprio Paladino ou uma imagem prismática).
actors.hero.spells.auraofprotection.name=aura de proteção
actors.hero.spells.auraofprotection.short_desc=Aumenta a defesa do Paladino e dos aliados próximos.
actors.hero.spells.beamingray$beamingrayboost.desc=Este aliado foi recentemente teletransportado por Raio Radiante, concedendo-lhe dano bónus contra o inimigo mais próximo após o teletransporte. O Poder de Muitos também não expirará enquanto este efeito estiver ativo. \n\nTurnos Restantes: %s.
actors.hero.spells.beamingray$beamingrayboost.name=raio brilhante
actors.hero.spells.beamingray.desc=O Clérigo canaliza o poder do seu aliado para um raio de luz que o transporta para um local. Se o raio colidir com um inimigo, colocará o aliado próximo e direcioná-lo-á para o inimigo. O raio tem um alcance máximo de %1$d quadrados e aumentará o dano bónus de Poder de Muitos para +%2$d%% durante 10 turnos contra o inimigo mais próximo num raio de 4 quadrados. O raio de luz pode até teletransportar aliados normalmente imóveis, mas o seu alcance é reduzido para metade nestes casos.
actors.hero.spells.beamingray.name=raio brilhante
actors.hero.spells.beamingray.no_space=Não há espaço para o seu aliado aparecer ali.
actors.hero.spells.beamingray.out_of_range=Essa localização está fora do alcance.
actors.hero.spells.beamingray.short_desc=Teletransporta o teu aliado e concede dano bónus.
actors.hero.spells.blessspell.desc=O Clérigo lança uma bênção sagrada sobre si próprio ou sobre outra personagem que possa ver. Quando lançada sobre si próprio, o efeito é mais fraco, concedendo ZXQPH0 ZXQ turnos de bênção e ZXQPH1 ZXQ de barreira. Quando lançada sobre outras personagens, a magia é mais poderosa, concedendo ZXQPH2 ZXQ turnos de bênção e ZXQPH3 ZXQ de cura. O excesso de cura é convertido numa barreira.
actors.hero.spells.blessspell.name=abençoar
actors.hero.spells.blessspell.short_desc=Abençoa e protege o clérigo, abençoa e cura os outros.
actors.hero.spells.bodyform$bodyformbuff.desc=A forma corporal de Trinity está atualmente a conceder-lhe o poder de um encantamento ou glifo, como se o tivesse equipado na sua arma ou armadura atual. Note que a forma corporal não pode fornecer outra cópia de um efeito do qual já esteja a beneficiar. Efeito de corrente: %1$s. Turnos restantes: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=forma do corpo
actors.hero.spells.bodyform.desc=O Clérigo escolhe um encantamento ou glifo que identificou nesta ronda e imbui Trindade com o seu efeito. Quando é utilizada Trindade, o Clérigo ganha o efeito do encantamento ou glifo escolhido por ZXQPH0 turnos. Este encantamento ou glifo temporário funcionará com qualquer efeito que um encantamento ou glifo normal funcionaria. Esta magia substitui qualquer outro efeito corporal com o qual Trindade esteja atualmente imbuída.
actors.hero.spells.bodyform.name=forma do corpo
actors.hero.spells.bodyform.short_desc=Atribui Trinity a um encantamento ou glifo.
actors.hero.spells.cleanse.desc=O Clérigo remove todos os efeitos negativos de estado de si próprio e dos aliados visíveis. Após o término da magia, todas as personagens afetadas ganham também %1$d turnos de imunidade a debuffs e uma barreira de %2$d.
actors.hero.spells.cleanse.name=limpar
actors.hero.spells.cleanse.short_desc=Remove efeitos negativos e concede proteção.
actors.hero.spells.clericspell.charge_cost=Custo da cobrança: %d
actors.hero.spells.clericspell.invalid_enemy=Não pode selecionar esse inimigo como alvo.
actors.hero.spells.clericspell.invalid_target=Não pode selecionar esse local como alvo.
actors.hero.spells.clericspell.no_target=Não há ali nenhum alvo.
actors.hero.spells.clericspell.prompt=Escolha um alvo
actors.hero.spells.divineintervention.desc=O Clérigo canaliza uma quantidade imensa de poder do seu tomo para si e para os seus aliados, concedendo a todos um escudo de %1$d e estendendo a Forma Ascendida por turnos %2$d. O incrível poder defensivo desta magia é compensado pelo seu elevadíssimo custo de carga. Tal como outros escudos concedidos pela Forma Ascendida, este escudo não se dissipa normalmente, mas expira imediatamente no final da Forma Ascendida.
actors.hero.spells.divineintervention.name=intervenção divina
actors.hero.spells.divineintervention.short_desc=Aumenta consideravelmente o escudo do clérigo e dos seus aliados.
actors.hero.spells.divinesense$divinesensetracker.desc=Esta personagem é temporariamente capaz de ver outras criaturas próximas com a mente!\n\nTurnos restantes: %s.
actors.hero.spells.divinesense$divinesensetracker.name=sentido divino
actors.hero.spells.divinesense.desc=O Clérigo concentra os seus sentidos no ambiente que o rodeia, ganhando visão mental com um alcance de %d quadrados durante 50 turnos. Esta magia não demora tempo a ser conjurada.
actors.hero.spells.divinesense.name=sentido divino
actors.hero.spells.divinesense.short_desc=Obtenha visão mental temporária num amplo espectro.
actors.hero.spells.flash.desc=O Clérigo canaliza a sua forma ascendida para um local próximo e teletransporta-se para lá. Flash pode teletransportar o Clérigo para qualquer local descoberto que esteja ao alcance e desocupado. Esta magia custa mais cargas de tomo de cada vez que é utilizada na mesma forma ascendida.
actors.hero.spells.flash.name=clarão
actors.hero.spells.flash.prompt=Escolha um local
actors.hero.spells.flash.short_desc=Teletransporte-se para um local próximo.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=O Sacerdote poderá voltar a conjurar Luz Guia gratuitamente após 50 turnos.\n\nTurnos restantes: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Luz Guia
actors.hero.spells.guidinglight$illuminated.desc=Este personagem está a brilhar por ter sido atingido por uma luz guia. Embora o brilho não seja suficientemente forte para iluminar a área circundante, o efeito mágico tornará muito mais fácil para o Clérigo acertar golpes nele.
actors.hero.spells.guidinglight$illuminated.desc_generic=Outros heróis podem ainda usar a habilidade Iluminado para beneficiarem do talento Luz Incandescente, mas não ganharão precisão.
actors.hero.spells.guidinglight$illuminated.desc_priest=O Sacerdote pode também consumir Iluminado com Radiância, um raio de varinha, um ataque de um aliado ou efeitos de alguns artefactos. Usar Iluminado desta forma causará dano mágico adicional igual ao nível do Sacerdote + 5.
actors.hero.spells.guidinglight$illuminated.name=iluminado
actors.hero.spells.guidinglight.desc=O clérigo dispara um raio de energia mágica que atinge um alvo, causando 2 a 8 pontos de dano e iluminando-o. O próximo ataque físico não sobrecarregado realizado contra um inimigo iluminado tem garantia de acerto.
actors.hero.spells.guidinglight.desc_priest=_Esta magia é mais poderosa quando conjurada pelo Sacerdote. _ A primeira utilização da magia a cada 50 turnos não consome cargas de tomo, e a iluminação será consumida por radiância, varinhas, outras personagens e artefactos que afetem diretamente os inimigos. Quando iluminada é utilizada desta forma, causa um dano mágico bónus igual ao nível do Sacerdote + 5.
actors.hero.spells.guidinglight.name=Luz Guia
actors.hero.spells.guidinglight.short_desc=Causa dano mágico à distância e garante um golpe.
actors.hero.spells.hallowedground$hallowedterrain.desc=Este solo foi consagrado. Os solos consagrados reduzem a velocidade dos inimigos, curam os aliados e fazem com que a erva se espalhe.
actors.hero.spells.hallowedground.desc=O Sacerdote concentra a sua magia divina no solo próximo, criando uma área de terreno sagrado durante 20 turnos. Ao ser conjurada, esta magia cura todos os aliados a 15 PV (aliados saudáveis e o Sacerdote recebem escudo), enraíza brevemente os inimigos e espalha erva baixa. O terreno sagrado cura os aliados em 1 PV por turno (aliados saudáveis e o Sacerdote recebem escudo), incapacita os inimigos e faz crescer erva alta aleatoriamente. O terreno sagrado é destruído pelo fogo e produzirá erva sulcada se os efeitos de regeneração passiva estiverem desativados ou se o Sacerdote não tiver ganho experiência durante algum tempo.
actors.hero.spells.hallowedground.name=terra sagrada
actors.hero.spells.hallowedground.prompt=Escolha um local
actors.hero.spells.hallowedground.short_desc=Cura aliados, reduz a velocidade dos inimigos e espalha erva numa área de efeito.
actors.hero.spells.holyintuition.cursed=Sente uma magia malévola à espreita neste objeto.
actors.hero.spells.holyintuition.desc=O clérigo concentra os seus sentidos num objeto e determina se este está amaldiçoado ou não, sem ter de o equipar.
actors.hero.spells.holyintuition.name=intuição sagrada
actors.hero.spells.holyintuition.prompt=escolha um item
actors.hero.spells.holyintuition.short_desc=Identifica se um item está amaldiçoado ou não.
actors.hero.spells.holyintuition.uncursed=Este item está livre de magia malévola.
actors.hero.spells.holylance$lancecooldown.desc=O Sacerdote lançou recentemente Lança Sagrada e deve esperar antes de a lançar novamente.\n\nTurnos restantes: %s.
actors.hero.spells.holylance$lancecooldown.name=tempo de recarga da lança sagrada
actors.hero.spells.holylance.desc=O Sacerdote concentra uma grande quantidade de energia numa lança de luz devastadora, arremessada. Esta lança causa dano de %1$d a %2$d e causa sempre dano máximo a alvos mortos-vivos e demoníacos. Este feitiço é muito caro e tem um tempo de espera de 30 turnos.
actors.hero.spells.holylance.name=lança sagrada
actors.hero.spells.holylance.short_desc=Causa dano mágico pesado à distância.
actors.hero.spells.holyward$holyarmbuff.desc=O clérigo imbuíu a sua armadura desgastada com energia sagrada, anulando temporariamente qualquer glifo existente e fazendo com que a armadura bloqueie 1 ponto de dano adicional.\n\nTurnos restantes: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=O Paladino imbuíu a sua armadura desgastada com energia sagrada, fazendo com que a armadura bloqueie 3 pontos de dano adicionais. \n\nConjurar outras magias enquanto a protecção sagrada estiver activa prolongará a sua duração em 10 turnos por carga gasta. \n\nTurnos Restantes: %s.
actors.hero.spells.holyward$holyarmbuff.name=ala sagrada
actors.hero.spells.holyward.desc=O Clérigo imbui a sua armadura vestida com glifos de luz sagrada, aumentando o bloqueio de dano da armadura em 1. Esta magia não demora a ser conjurada. Este glifo dura 50 turnos e substituirá qualquer glifo benéfico que a armadura possua durante esse período. O Clérigo beneficiará deste efeito mesmo que não esteja a usar armadura.
actors.hero.spells.holyward.desc_paladin=_Esta magia é mais poderosa quando conjurada pelo Paladino. _ O bloqueio de dano adicional aumenta para 3, a magia não sobrescreve mais glifos existentes e conjurar outras magias enquanto a protecção sagrada estiver activa prolongará a sua duração em 10 turnos por carga utilizada.
actors.hero.spells.holyward.glyph_desc=Este glifo aumenta ligeiramente a quantidade de dano que a armadura pode bloquear.
actors.hero.spells.holyward.glyph_name=%s de luz
actors.hero.spells.holyward.name=ala sagrada
actors.hero.spells.holyward.short_desc=Substitui temporariamente os glifos para aumentar o bloqueio de armadura.
actors.hero.spells.holyweapon$holywepbuff.desc=O clérigo imbuíu a sua arma equipada com energia sagrada, anulando temporariamente qualquer encantamento existente e fazendo com que a arma cause 2 pontos de dano mágico extra em cada ataque.\n\nTurnos restantes: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=O Paladino imbuíu a sua arma equipada com energia sagrada, fazendo com que os seus ataques causem 6 pontos de dano mágico adicional. \n\nConjurar outras magias enquanto a arma sagrada estiver activa irá prolongar a sua duração em 10 turnos por carga gasta. \n\nTurnos Restantes: %s.
actors.hero.spells.holyweapon$holywepbuff.name=arma sagrada
actors.hero.spells.holyweapon.desc=O clérigo encanta a sua arma equipada com energia sagrada, fazendo com que esta cause 2 pontos de dano mágico adicionais sempre que atingir um inimigo com ela. Esta magia não demora tempo a ser conjurada. Este encantamento dura 50 turnos e substituirá qualquer outro encantamento benéfico que a arma possua durante esse período. Os ataques desarmados também beneficiam deste efeito.
actors.hero.spells.holyweapon.desc_paladin=_Esta magia é mais poderosa quando conjurada pelo Paladino. _ O dano mágico adicional aumenta para 6, a magia não sobrescreve mais encantamentos existentes e conjurar outras magias enquanto Arma Sagrada estiver activa prolongará a sua duração em 10 turnos por carga utilizada.
actors.hero.spells.holyweapon.ench_desc=Os inimigos atingidos por uma arma sagrada sofrerão dano mágico adicional.
actors.hero.spells.holyweapon.ench_name=santo %s
actors.hero.spells.holyweapon.name=arma sagrada
actors.hero.spells.holyweapon.short_desc=Substitui temporariamente os encantamentos para aumentar o dano.
actors.hero.spells.judgement.desc=O Clérigo golpeia o chão com o punho, causando uma erupção de luz que inflige dano a todos os inimigos à vista. Isto causa %1$d-%2$d de dano base, além de 33%% de dano adicional por cada magia que o Clérigo conjurou desde que assumiu a forma ascendida (ou desde a última vez que conjurou Julgamento). Atualmente, o Julgamento causa %3$d-%4$d de dano.
actors.hero.spells.judgement.name=julgamento
actors.hero.spells.judgement.short_desc=Causa dano a todos os inimigos visíveis.
actors.hero.spells.layonhands.desc=O Paladino canaliza a energia sagrada através das suas mãos, curando ou protegendo tudo aquilo em que toca. O Paladino pode lançar esta magia em qualquer personagem adjacente para lhe conceder cura, ou em si próprio para obter protecção. O excesso de cura desta magia é convertido em proteção. Esta magia é conjurada instantaneamente e pode ser conjurada repetidamente, mas não pode conceder proteção equivalente a mais de três conjurações de cada vez.
actors.hero.spells.layonhands.name=imposição de mãos
actors.hero.spells.layonhands.short_desc=Cura instantaneamente uma personagem adjacente ou concede um escudo ao Paladino.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=O Clérigo lançou recentemente Vínculo Vital neste aliado. Para além dos benefícios normais de Vínculo Vital, esta personagem também recebe dano reduzido, quaisquer magias positivas de Clérigo são aplicadas tanto ao Clérigo como a este aliado, em vez de apenas a um, e o Poder de Muitos não expirará enquanto este bónus estiver ativo. Turnos restantes:
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=proteção de vínculo vital
actors.hero.spells.lifelinkspell.desc=O Clérigo fortalece o laço entre si e o seu aliado fortalecido. Com este vínculo fortalecido, qualquer dano recebido será partilhado entre o herói e o seu aliado durante %1$d turnos, e o bónus defensivo de Poder de Muitos será aumentado para -%2$d%% de dano recebido. Note que o dano é partilhado após a armadura, mas antes da redução de dano de Poder de Muitos. Enquanto este efeito estiver ativo, feitiços benéficos de Clérigo de nível 3 ou inferior serão aplicados tanto ao Clérigo como ao seu aliado, caso fossem aplicados apenas a um deles.
actors.hero.spells.lifelinkspell.name=ligação vital
actors.hero.spells.lifelinkspell.short_desc=Partilha o dano com um aliado e reduz o dano recebido por ele.
actors.hero.spells.mindform.desc=O Clérigo escolhe uma varinha ou arma de arremesso que tenha identificado nesta ronda e imbui Trindade o seu efeito. Quando é utilizada Trindade, o Clérigo pode fazer um único ataque como se estivesse a utilizar o item escolhido com +ZXQPH0. Isto irá ativar todos os efeitos que o uso deste tipo de item normalmente ativaria. Esta magia substitui qualquer outro efeito mental com o qual Trindade esteja atualmente imbuída.
actors.hero.spells.mindform.name=forma mental
actors.hero.spells.mindform.short_desc=Atribui Trinity a uma varinha ou arma de arremesso.
actors.hero.spells.mnemonicprayer.desc=O Sacerdote profere uma oração que prolonga a duração de todos os buffs ou debuffs num alvo específico durante %1$d turnos. Esta magia não demora tempo a ser conjurada. Os efeitos positivos durarão mais tempo nos aliados (incluindo o próprio Sacerdote), e os efeitos negativos durarão mais tempo nos inimigos. A Oração Mnemónica só pode estender uma instância específica de um buff ou debuff uma única vez e não pode estender buffs concedidos por habilidades de armadura.
actors.hero.spells.mnemonicprayer.name=oração mnemónica
actors.hero.spells.mnemonicprayer.short_desc=Prolonga os efeitos positivos/negativos de um aliado/inimigo e reaplica o efeito iluminado.
actors.hero.spells.radiance.desc=O Sacerdote irrompe em luz sagrada, atordoando todos os inimigos visíveis durante 3 turnos. Se um inimigo já estiver iluminado, a Radiância ativará o dano de iluminação adicional e, em seguida, aplicará o debuff de iluminado. A Radiância também fará com que o Sacerdote brilhe durante 100 turnos se o piso atual estiver escuro.
actors.hero.spells.radiance.name=radiância
actors.hero.spells.radiance.short_desc=Ilumina e atordoa brevemente os inimigos visíveis.
actors.hero.spells.recallinscription$useditemtracker.desc=O Clérigo usou recentemente um item que funciona com a magia de recordação inscrita. O Clérigo pode lançar a magia para repetir o efeito do item.\n\nItem Utilizado: %1$s.\n\nTurnos Restantes: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=runa usada recentemente
actors.hero.spells.recallinscription.desc=O Clérigo usa magia sagrada para voltar a conjurar o efeito de uma runa mágica encontrada numa pedra rúnica ou num pergaminho que usou nos últimos %s turnos. A Inscrição de Recuperação não pode ser utilizada para replicar pergaminhos de aperfeiçoamento. O custo de carga desta magia varia de acordo com o item utilizado recentemente: 2 para uma pedra rúnica, 3 para um pergaminho e 4 para um pergaminho exótico. Este custo de carga também é duplicado ao replicar um pergaminho de transmutação ou itens de alquimia que precisam de ser criados usando transmutação ou melhoramento.
actors.hero.spells.recallinscription.name=inscrição de recordação
actors.hero.spells.recallinscription.short_desc=Repete uma runa ou pergaminho usado recentemente.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Um fino escudo de luz separa esta personagem de um inimigo. Não é suficientemente forte para bloquear os ataques completamente, mas irá enfraquecê-los. \n\nTurnos restantes: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=escudo de luz
actors.hero.spells.shieldoflight.desc=O Clérigo cria uma fina barreira de luz entre si e um inimigo, aumentando o poder de bloqueio da sua armadura contra esse inimigo em %1$d-%2$d durante 5 turnos.\n\nEste feitiço não demora tempo a ser lançado, mas não pode ser utilizado contra múltiplos alvos em simultâneo.
actors.hero.spells.shieldoflight.name=escudo de luz
actors.hero.spells.shieldoflight.short_desc=Concede proteção temporária contra um alvo.
actors.hero.spells.smite.desc=O Paladino infunde um golpe corpo a corpo com um poder destrutivo justo. Além de causar dano corpo a corpo normal, o Golpe Divino garante acerto em ataques sem sobrecarga, tem +300 de poder de encantamento e causa dano mágico bónus de ZXQPH1 a ZXQPH2. O dano mágico bónus de Golpe Divino escala com o nível do Paladino e causará sempre o máximo dano mágico bónus contra inimigos mortos-vivos ou demoníacos.
actors.hero.spells.smite.name=golpe
actors.hero.spells.smite.short_desc=Garante um golpe com dano bónus e poder de encantamento.
actors.hero.spells.spiritform$spiritformbuff.desc=A forma espiritual de Trinity está atualmente a conceder-te o poder de um item, como se o tivesses equipado. Note que a forma espiritual não pode fornecer outra cópia de um efeito do qual já esteja a beneficiar. Efeito de corrente: %1$s. Turnos restantes: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=forma espiritual
actors.hero.spells.spiritform.desc=O Clérigo escolhe um anel ou artefacto que tenha identificado nesta ronda (exceto o tomo sagrado) e imbui Trindade com o seu efeito. Se for escolhido um anel, a Trindade concede o efeito desse anel com um bónus de +%1$d durante 20 turnos. Se for escolhido um artefacto, a Trindade replica o efeito desse artefacto com um bónus de +%2$d. Cada artefacto tem comportamentos específicos e custos de carga de armadura diferentes quando usado com Trindade. Esta magia substitui qualquer outro efeito espiritual de que a Trindade esteja atualmente imbuída.
actors.hero.spells.spiritform.name=forma espiritual
actors.hero.spells.spiritform.short_desc=Atribui o efeito Trindade a um anel ou artefacto.
actors.hero.spells.stasis$stasisbuff.desc=O Clérigo tem atualmente um aliado em estase. Todos os efeitos positivos sobre este aliado são preservados, incluindo o Poder de Muitos, e ele reaparecerá ao lado do Clérigo quando o efeito terminar. O efeito também pode ser terminado antecipadamente conjurando novamente Estase. \n\n Aliado em estase: %1$s.\n Turnos restantes: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=O seu aliado imóvel ficou para trás.
actors.hero.spells.stasis$stasisbuff.name=aliado em estase
actors.hero.spells.stasis.desc=O Clérigo concentra a sua ligação com o aliado em si próprio, fazendo com que o aliado fique temporariamente numa espécie de estase energética dentro do Clérigo. O aliado será preservado até %d turnos, com todos os efeitos positivos sobre ele a permanecerem inalterados durante o tempo em estase. O aliado aparecerá ao lado do Clérigo quando a estase terminar naturalmente, ou poderá voltar a lançar a magia instantaneamente, sem custos, para terminar o efeito antecipadamente. A estase pode até mover aliados imóveis, mas não pode transferi-los entre andares.
actors.hero.spells.stasis.name=estase
actors.hero.spells.stasis.short_desc=Remove um aliado da masmorra e preserva-o.
actors.hero.spells.sunray.desc=O Clérigo dispara um raio de luz ofuscante contra um alvo, causando dano de %1$d a %2$d e cegando-o durante %3$d turnos. O Raio Solar causa sempre o máximo dano a alvos mortos-vivos e demoníacos. Após ser atingido por esta magia, a visão do inimigo irá ajustar-se, impedindo que seja novamente cegado. No entanto, se for atingido novamente enquanto estiver cego por esta magia, a luz será tão intensa que o paralisará.
actors.hero.spells.sunray.name=raio de sol
actors.hero.spells.sunray.short_desc=Causa dano mágico à distância e cega o alvo uma vez.
actors.hero.spells.walloflight$lightwall.desc=Painéis de luz cintilantes bloqueiam a passagem aqui.
actors.hero.spells.walloflight.desc=O Paladino cria uma parede feita de painéis de luz sólida diretamente à sua frente, com 1 bloco de espessura, blocos %1$d de largura e uma duração de 20 turnos. Esta parede funciona como uma parede normal, exceto pelo facto de ser possível ver através dela. Os inimigos presos à parede durante a sua criação serão momentaneamente atordoados e repelidos, se possível. Qualquer criatura presa na parede poderá mover-se para fora dela. A parede pode ser conjurada em qualquer uma das quatro direções cardinais ou nas quatro diagonais. Se uma parede já estiver ativa, a magia pode ser reutilizada gratuitamente para a remover instantaneamente.
actors.hero.spells.walloflight.early_end=Dissipa a barreira de luz.
actors.hero.spells.walloflight.name=parede de luz
actors.hero.spells.walloflight.short_desc=Cria uma parede que bloqueia os inimigos.
actors.hero.talent$aggressivebarriercooldown.desc=Utilizou este talento recentemente e deve esperar antes de o utilizar novamente.\n\nTurnos restantes: %s.
actors.hero.talent$aggressivebarriercooldown.name=tempo de recarga da barreira agressiva
actors.hero.talent$combinedlethalityabilitytracker.executed=executado
actors.hero.talent$deadlyfollowuptracker.desc=A Duelista atacou recentemente um inimigo com uma arma de arremesso; os seus ataques corpo a corpo contra o mesmo alvo terão um dano aumentado. \n\nTurnos restantes: %s.
actors.hero.talent$deadlyfollowuptracker.name=acompanhamento mortal
actors.hero.talent$followupstriketracker.desc=A Caçadora atacou recentemente um inimigo com uma arma de arremesso; o seu próximo ataque corpo a corpo contra o mesmo alvo terá dano aumentado.\n\nTurnos restantes: %s.
actors.hero.talent$followupstriketracker.name=ataque de acompanhamento
actors.hero.talent$improvisedprojectilecooldown.desc=Utilizou este talento recentemente e deve esperar antes de o utilizar novamente.\n\nTurnos restantes: %s.
actors.hero.talent$improvisedprojectilecooldown.name=tempo de recarga de projécteis improvisados
actors.hero.talent$lethalhastecooldown.desc=Utilizou este talento recentemente e deve esperar antes de o utilizar novamente.\n\nTurnos restantes: %s.
actors.hero.talent$lethalhastecooldown.name=tempo de recarga de aceleração letal
actors.hero.talent$lingeringmagictracker.desc=O mago usou recentemente um bastão ou varinha; o seu próximo ataque físico causará dano bónus.\n\nTurnos restantes: %s.
actors.hero.talent$lingeringmagictracker.name=magia persistente
actors.hero.talent$liquidagilacctracker.desc=O próximo ataque corpo a corpo normal do Duelista ganhará precisão bónus.\n\nTurnos restantes: %s.
actors.hero.talent$liquidagilacctracker.name=agilidade líquida
actors.hero.talent$patientstriketracker.desc=A Duelista acabou de passar um turno à espera; o seu próximo ataque corpo a corpo causará dano bónus.
actors.hero.talent$patientstriketracker.name=greve dos doentes
actors.hero.talent$preciseassaulttracker.desc=O próximo ataque corpo a corpo normal do Duelista ganhará precisão bónus.\n\nTurnos restantes: %s.
actors.hero.talent$preciseassaulttracker.name=ataque preciso
actors.hero.talent$provokedangertracker.desc=O Guerreiro perdeu recentemente o seu escudo, o seu próximo ataque físico causará dano bónus.\n\nTurnos restantes: %s.
actors.hero.talent$provokedangertracker.name=provocou raiva
actors.hero.talent$rejuvenatingstepscooldown.desc=Utilizou este talento recentemente e deve esperar antes de o utilizar novamente.\n\nTurnos restantes: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=passos rejuvenescedores relaxamento
actors.hero.talent$satiatedspellstracker.desc=A próxima magia que o clérigo lançar conceder-lhe-á uma pequena quantidade de proteção.
actors.hero.talent$satiatedspellstracker.name=Feitiço de Proteção
actors.hero.talent$searinglightcooldown.desc=Utilizou este talento recentemente e deve esperar antes de o utilizar novamente.\n\nTurnos restantes: %s.
actors.hero.talent$searinglightcooldown.name=Luz escaldante
actors.hero.talent$seershotcooldown.desc=Utilizou este talento recentemente e deve esperar antes de o utilizar novamente.\n\nTurnos restantes: %s.
actors.hero.talent$seershotcooldown.name=tempo de recarga do tiro do vidente
actors.hero.talent$swiftequipcooldown.desc=Utilizou este talento recentemente e deve esperar antes de o utilizar novamente.\n\nTurnos restantes: %s.
actors.hero.talent$swiftequipcooldown.name=tempo de recarga de equipamento rápido
actors.hero.talent.adventurers_intuition.desc=_+1:_ A Duelista identifica armas _2,5 vezes mais rápido_ e armaduras _1,75 vezes mais rápido_.\n\n_+2:_ A Duelista identifica armas _quando as equipa_ e armaduras _2,5 vezes mais rápido_.
actors.hero.talent.adventurers_intuition.title=intuição do aventureiro
actors.hero.talent.aggressive_barrier.desc=_+1:_ A Duelista ganha _3 de escudo_ quando usa uma habilidade de arma e está com 50% de vida ou menos.\n\n_+2:_ A Duelista ganha _5 de escudo_ quando usa uma habilidade de arma e está com 50% de vida ou menos.
actors.hero.talent.aggressive_barrier.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá escudo ao realizar um ataque corpo a corpo com pouca vida, com um tempo de recarga de 50 turnos.
actors.hero.talent.aggressive_barrier.title=barreira agressiva
actors.hero.talent.ally_warp.desc=_+1:_ O Mago pode selecionar um aliado para trocar de lugar instantaneamente com ele, com um alcance de _2 espaços_.\n\n_+2:_ O Mago pode selecionar um aliado para trocar de lugar instantaneamente com ele, com um alcance de _4 espaços_.\n\n_+3:_ O Mago pode selecionar um aliado para trocar de lugar instantaneamente com ele, com um alcance de _6 espaços_.\n\nO Mago não pode trocar de lugar com aliados imóveis.
actors.hero.talent.ally_warp.title=dobra de aliado
actors.hero.talent.arcane_vision.desc=_+1:_ Quando o Mago atinge um inimigo com um raio, ganha visão mental sobre ele durante _10 turnos_.\n\n_+2:_ Quando o Mago atinge um inimigo com um raio, ganha visão mental sobre ele durante _15 turnos_.
actors.hero.talent.arcane_vision.title=visão arcana
actors.hero.talent.assassins_reach.desc=_+1:_ O alcance do teletransporte do Assassino por nível de preparação é aumentado para _1/3/4/6 quadrados_, de 1/2/3/4.\n\n_+2:_ O alcance do teletransporte do Assassino por nível de preparação é aumentado para _2/4/6/8 quadrados_, de 1/2/3/4.\n\n_+3:_ O alcance do teletransporte do Assassino por nível de preparação é aumentado para _2/5/7/10 quadrados_, de 1/2/3/4.\n\nEste teletransporte pode atravessar obstáculos e inimigos, mas não terrenos sólidos como paredes.
actors.hero.talent.assassins_reach.title=alcance do assassino
actors.hero.talent.aura_of_protection.desc=+1: O Paladino pode lançar _Aura de Protecção_, uma magia que concede ao Paladino e a todos os aliados num raio de 2 quadrados _20% de resistência ao dano_ e o efeito do glifo de armadura do Paladino com _+50% de poder_ durante 20 turnos, com o custo de 2 cargas. +2: O Paladino pode lançar _Aura de Protecção_, uma magia que concede ao Paladino e a todos os aliados num raio de 2 quadrados _30% de resistência ao dano_ e o efeito do glifo de armadura do Paladino com _+75% de poder_ durante 20 turnos, com o custo de 2 cargas. +3: O Paladino pode lançar _Aura de Protecção_, uma magia que concede ao Paladino e a todos os aliados num raio de 2 quadrados _40% de resistência ao dano_ e o efeito do glifo de armadura do Paladino com _+100% de poder_ Potência durante 20 turnos, com o custo de 2 cargas.
actors.hero.talent.aura_of_protection.title=aura de proteção
actors.hero.talent.backup_barrier.desc=_+1:_ O Mago ganha _3 de escudo_ sempre que gasta a última carga no seu bastão.\n\n_+2:_ O Mago ganha _5 de escudo_ sempre que gasta a última carga no seu bastão.
actors.hero.talent.backup_barrier.meta_desc=_Se este talento for adquirido por um herói diferente_, será ativado pela varinha de nível mais elevado desse herói.
actors.hero.talent.backup_barrier.title=barreira de segurança
actors.hero.talent.barkskin.desc=_+1:_ Ao pisar a relva, o Guardião ganha _0-50% do seu nível_ em armadura de pele de árvore, que desaparece a cada turno.\n\n_+2:_ Ao pisar a relva, o Guardião ganha _0-100% do seu nível_ em armadura de pele de árvore, que desaparece a cada turno.\n\n_+3:_ Ao pisar erva, o Guardião ganha _0-150% do seu nível_ em armadura de pele de árvore, que desaparece a cada turno.
actors.hero.talent.barkskin.title=casca
actors.hero.talent.beaming_ray.desc=O Clérigo pode lançar _Raio Radiante_ a partir de um aliado fortalecido, com o custo de 1 carga. Este raio atravessa paredes e teletransporta o aliado para um local alvo. Se houver um inimigo nesse local, o aliado aparece ao lado do inimigo e ataca-o. O Raio Radiante pode até teletransportar aliados normalmente imóveis, mas tem metade do alcance ao fazê-lo. \n\n_+1: O Raio Radiante tem um alcance máximo de 4 quadrados e aumenta o bónus de Poder de Muitos para +35% de dano contra o inimigo mais próximo durante 10 turnos. \n\n_+2: O Raio Radiante tem um alcance máximo de 8 quadrados e aumenta o bónus de Poder de Muitos para +40% de dano contra o inimigo mais próximo durante 10 turnos. \n\n_+3: O Raio Radiante tem um alcance máximo de 12 quadrados e aumenta o bónus de Poder de Muitos para +45% de dano contra o inimigo mais próximo durante 10 turnos. \n\n_+4: O Raio Radiante tem um alcance máximo de 16 quadrados. azulejos,_ e aumenta o bónus de Poder de Muitos para _+50% de dano_ contra o inimigo mais próximo durante 10 turnos.
actors.hero.talent.beaming_ray.title=raio brilhante
actors.hero.talent.blast_radius.desc=_+1:_ O raio da explosão elemental é aumentado para _5 quadrados_, de 4.\n\n_+2:_ O raio da explosão elemental é aumentado para _6 quadrados_, de 4.\n\n_+3:_ O raio da explosão elemental é aumentado para _7 quadrados_, de 4.\n\n_+4:_ O raio da explosão elementar é aumentado para _8 quadrados_, de 4.
actors.hero.talent.blast_radius.title=raio da explosão
actors.hero.talent.bless.desc=+1: O Clérigo pode lançar Bênção, um feitiço que concede 6 turnos de bênção e 10 de protecção quando lançado em si próprio ou 10 turnos de bênção e 10 de cura quando lançado noutra personagem, com o custo de 1 carga. +2: O Clérigo pode lançar Bênção, uma magia que concede 10 turnos de bênção e 15 de protecção quando conjurada em si próprio ou 15 turnos de bênção e 15 de cura quando conjurada noutra personagem, com o custo de 1 carga. O excesso de cura desta magia é convertido em proteção.
actors.hero.talent.bless.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a precisão e a evasão do herói e de todos os aliados em 3% no nível +1 ou em 5% no nível +2.
actors.hero.talent.bless.title=abençoar
actors.hero.talent.body_form.desc=O Clérigo pode conjurar _Forma Corporal_, que imbuirá Trinity com o poder de um encantamento ou glifo que o Clérigo tenha identificado nesta ronda, com um custo de 2 cargas. _+1:_ Quando a Trinity é utilizada, o Clérigo ganha o efeito escolhido durante _20 turnos._ _+2:_ Quando a Trinity é utilizada, o Clérigo ganha o efeito escolhido durante _27 turnos._ _+3:_ Quando a Trinity é utilizada, o Clérigo ganha o efeito escolhido durante _33 turnos._ _+4:_ Quando a Trinity é utilizada, o Clérigo ganha o efeito escolhido durante _40 turnos._ _A Trindade só pode ser imbuída com um efeito corporal de cada vez. O custo de carga da armadura Trinity é mais elevado se o glifo escolhido for raro e poderoso.
actors.hero.talent.body_form.title=forma do corpo
actors.hero.talent.body_replacement.desc=_+1:_ Após piscar, o Ladino deixa para trás um isco de madeira com _20 de vida e 1-3 de armadura_. \n\n_+2:_ Após piscar, o Ladino deixa para trás um isco de madeira com _40 de vida e 2-6 de armadura_. \n\n_+3:_ Após piscar, o Ladino deixa para trás um isco de madeira com _60 de vida e 3-9 de armadura_.\n\n_+4:_ Após piscar, o Ladino deixa para trás um isco de madeira com _80 de vida e 4-12 de armadura_.\n\n Apenas um isco pode estar activo de cada vez.
actors.hero.talent.body_replacement.title=substituição de corpo
actors.hero.talent.body_slam.desc=_+1:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes sofrem dano igual a _1-4 mais 25%_ do seu poder de bloqueio de dano.\n\n_+2:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes sofrem dano igual a _2-8 mais 50%_ do seu poder de bloqueio de dano.\n\n_+3:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes sofrem dano igual a _3-12 mais 75%_ do seu poder de bloqueio de dano.\n\n_+4:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes sofrem dano igual a _4-16 mais 100%_ do seu poder de de dano.
actors.hero.talent.body_slam.title=golpe de corpo
actors.hero.talent.bounty_hunter.desc=_+1:_ Quando o Assassino mata um inimigo com um golpe preparado, a sua probabilidade de obter um item aumenta em _2/4/8/16%_, por nível de preparação.\n\n_+2:_ Quando o Assassino mata um inimigo com um golpe preparado, a sua probabilidade de obter um item aumenta em _4/8/16/32%_, por nível de preparação.\n\n_+3:_ Quando o Assassino mata um inimigo com um golpe preparado, a sua probabilidade de obter um item aumenta em _6/12/24/48%_, por nível de preparação.
actors.hero.talent.bounty_hunter.title=caçador de recompensas
actors.hero.talent.cached_rations.desc=+1: O Ladino pode encontrar 2 rações de mantimentos em baús enquanto explora os próximos andares da masmorra. +2: O Ladino pode encontrar 3 rações de mantimentos em baús enquanto explora os próximos andares da masmorra. As rações de abastecimento são consumidas rapidamente, restauram uma quantidade moderada de saciedade, curam 5 PV e restauram 1 carga para a capa das sombras.
actors.hero.talent.cached_rations.title=rações armazenadas
actors.hero.talent.cleanse.desc=+1: O Clérigo pode lançar Purificar, um feitiço que remove efeitos negativos do Clérigo e de quaisquer aliados próximos, e lhes concede 10 de escudo, com um custo de 2 cargas. +2: O Clérigo pode lançar Purificar, um feitiço que concede 3 turnos de imunidade a efeitos negativos ao Clérigo e a quaisquer aliados próximos, e concede-lhes 20 de escudo, com o custo de 2 cargas. +3: O Clérigo pode lançar Purificar, um feitiço que concede 5 turnos de imunidade a efeitos negativos ao Clérigo e a quaisquer aliados próximos, e concede-lhes 30 de escudo, com o custo de 2 cargas.
actors.hero.talent.cleanse.meta_desc=_Se este talento for adquirido por um herói diferente_, removerá os efeitos negativos do herói após o uso de uma varinha ou artefacto, em 10/20/30% das vezes com +1/+2/+3.
actors.hero.talent.cleanse.title=limpar
actors.hero.talent.cleave.desc=_+1:_ O tempo extra que o Gladiador tem para matar um inimigo é aumentado para _30 turnos_, de 15.\n\n_+2:_ O tempo extra que o Gladiador tem para matar um inimigo é aumentado para _45 turnos_, de 15.\n\n_+3:_ O tempo extra que o Gladiador tem para matar um inimigo é aumentado para _60 turnos_, de 15.
actors.hero.talent.cleave.title=clivar
actors.hero.talent.cloned_armor.desc=+1: O clone das sombras ganha 12% do valor da armadura do herói e tem 25% de hipóteses de usar o glifo na armadura do herói. +2: O clone das sombras ganha 24% do valor da armadura do herói e tem 50% de hipóteses de usar o glifo na armadura do herói. +3: O clone das sombras ganha 36% do valor da armadura do herói e tem 75% de hipóteses de usar o glifo na armadura do herói. +4: O clone das sombras ganha 48% do valor da armadura do herói e tem 100% de hipóteses de usar o glifo na armadura do herói.
actors.hero.talent.cloned_armor.title=armadura clonada
actors.hero.talent.close_the_gap.desc=_+1:_ O Duelista teletransporta-se _até dois quadrados_ em direção ao seu alvo quando inicia um duelo. \n\n_+2:_ O Duelista teletransporta-se _até três quadrados_ em direção ao seu alvo quando inicia um duelo. \n\n_+3:_ O Duelista teletransporta-se _até quatro quadrados_ em direção ao seu alvo quando duelo.\n\n_+4:_ O Duelista teletransporta-se _até cinco quadrados_ em direção ao seu alvo quando inicia um duelo.\n\n Este teletransporte pode atravessar obstáculos e inimigos, mas não terreno sólido como paredes. O teletransporte é tido em conta ao determinar se um inimigo está ao alcance para ser desafiado.
actors.hero.talent.close_the_gap.title=fechar a lacuna
actors.hero.talent.combined_energy.desc=_+1:_ Se o Monge utilizar uma habilidade de arma e uma habilidade de _4+ de energia_ num intervalo de 5 turnos, recupera 1 ponto de energia gasto.\n\n_+2:_ Se o Monge utilizar uma habilidade de arma e uma habilidade de _3+ de energia_ num intervalo de 5 turnos, recupera 1 ponto de energia gasto.\n\n_+3:_ Se o Monge utilizar uma habilidade de arma e uma habilidade de _2+ de energia_ num intervalo de 5 turnos, recupera 1 ponto de energia gasto.
actors.hero.talent.combined_energy.title=energia combinada
actors.hero.talent.combined_lethality.desc=+1: Se o Campeão atacar com uma arma corpo a corpo imediatamente após utilizar a habilidade de outra arma, esse ataque executará qualquer inimigo que não seja um boss e que esteja com menos de 13% de HP. +2: Se o Campeão atacar com uma arma corpo a corpo imediatamente após utilizar a habilidade de outra arma, esse ataque executará qualquer inimigo que não seja um boss e que esteja com menos de 27% de HP. +3: Se o Campeão atacar com uma arma corpo a corpo imediatamente após utilizar a habilidade de outra arma, esse ataque executará qualquer inimigo que não seja um boss e que esteja com menos de 40% de HP. Este ataque pode ser um ataque corpo a corpo normal ou parte de uma habilidade de arma.
actors.hero.talent.combined_lethality.title=letalidade combinada
actors.hero.talent.conserved_magic.desc=_+1:_ Cada raio de magia selvagem utiliza agora _0,33 cargas_ em vez de 0,5, e a magia selvagem tem _25% de hipóteses_ de não gastar um turno.\n\n_+2:_ Cada raio de magia selvagem utiliza agora _0,225 cargas_ em vez de 0,5, e a magia selvagem tem _50% de hipóteses_ de não gastar um turno.\n\n_+3:_ Cada raio de magia selvagem usa agora _0,15 cargas_ em vez de 0,5, e a magia selvagem tem _75% de hipóteses_ de não gastar um turno.\n\n_+4:_ Cada raio de magia selvagem utiliza agora _0,1 cargas_ em vez de 0,5, e a magia selvagem tem _100% de hipóteses_ de não gastar um turno.
actors.hero.talent.conserved_magic.title=magia conservada
actors.hero.talent.counter_ability.desc=+1: Se a Duelista utilizar uma habilidade de arma dentro de 3 turnos após o seu efeito residual ser atacado, recuperará instantaneamente 0,38 cargas. +2: Se a Duelista utilizar uma habilidade de arma dentro de 3 turnos após o seu efeito residual ser atacado, recuperará instantaneamente 0,77 cargas. +3: Se a Duelista utilizar uma habilidade de arma dentro de 3 turnos após o seu efeito residual ser atacado, recuperará instantaneamente 1,13 cargas. +4: Se a Duelista utilizar uma habilidade de arma dentro de 3 turnos após o seu efeito residual ser atacado, recuperará instantaneamente 1,5 cargas.
actors.hero.talent.counter_ability.title=habilidade de contra-ataque
actors.hero.talent.deadly_followup.desc=_+1:_ Quando a Duelista atinge um inimigo com uma arma de arremesso, causará mais _10% de dano corpo a corpo_ a este durante 5 turnos.\n\n_+2:_ Quando a Duelista atinge um inimigo com uma arma de arremesso, causará mais _20% de dano corpo a corpo_ a este durante 5 turnos.\n\n_+3:_ Quando a Duelista atinge um inimigo com uma arma de arremesso, causará mais _30% de dano corpo a corpo_ durante 5 turnos.
actors.hero.talent.deadly_followup.title=acompanhamento mortal
actors.hero.talent.deathless_fury.desc=_+1:_ O Berserk é ativado automaticamente se o Berserker estiver prestes a morrer e a fúria estiver a 100% ou mais, mas tem um tempo de recarga de _3 níveis de herói_ quando isso acontece.\n\n_+2:_ O Berserk é ativado automaticamente se o Berserker estiver prestes a morrer e a fúria estiver a 100% ou mais, mas tem um tempo de recarga de _2 níveis de herói_ quando este acontece.\n\n_+3:_ O Berserk é ativado automaticamente se o Berserker estiver prestes a morrer e a fúria estiver a 100% ou mais, mas tem um tempo de recarga de _1 nível de herói_ quando isso acontece.\n\nNote que o Berserker ainda morrerá se tiver 0 PV quando o estado de berserk terminar.
actors.hero.talent.deathless_fury.title=fúria imortal
actors.hero.talent.deathly_durability.desc=_+1:_ Os inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _13%_ dos seus pontos de vida no momento em que estavam marcados.\n\n_+2:_ Os inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _25%_ dos seus pontos de vida no momento em que estavam marcados.\n\n_+3:_ Os inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _38%_ dos seus pontos de vida no momento em que estavam marcados.\n\n_+4:_ Os inimigos mortos pela marca da morte concedem ao Ladino um escudo igual a _50%_ dos seus pontos de vida no momento em que estavam marcados.
actors.hero.talent.deathly_durability.title=durabilidade mortal
actors.hero.talent.desperate_power.desc=_+1:_ As varinhas e o bastão do Mago ganham _+1 nível_ no seu último ataque quando estão com a última carga.\n\n_+2:_ As varinhas e o bastão do Mago ganham _+2 níveis_ no seu último ataque quando estão com a última carga.\n\n_+3:_ As varinhas e o bastão do Mago ganham _+3 níveis_ no seu último ataque quando estiverem com a última carga.
actors.hero.talent.desperate_power.title=poder desesperado
actors.hero.talent.directed_power.desc=+1: O ataque direto do Golpe Elemental ganha +30% de poder de encantamento por cada inimigo ao alcance do efeito do Golpe Elemental, incluindo o alvo do ataque. +2: O ataque direto do Golpe Elemental ganha +60% de poder de encantamento por cada inimigo ao alcance do efeito do Golpe Elemental, incluindo o alvo do ataque. +3: O ataque direto do Golpe Elemental ganha +90% de poder de encantamento por cada inimigo ao alcance do efeito do Golpe Elemental, incluindo o alvo do ataque. +4: O ataque direto do Golpe Elemental ganha +120% de poder de encantamento por cada inimigo no alcance do efeito do Golpe Elemental, incluindo o alvo do ataque.
actors.hero.talent.directed_power.title=potência direcionada
actors.hero.talent.divine_intervention.desc=+1: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar Intervenção Divina, que aumenta a proteção do Clérigo e de todos os aliados até 150 e estende a Forma Ascendida por 3 turnos. +2: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar Intervenção Divina, que aumenta a proteção do Clérigo e de todos os aliados até 200 e estende a Forma Ascendida por 4 turnos. +3: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar Intervenção Divina, que aumenta a proteção do Clérigo e de todos os aliados até 250 e estende a Forma Ascendida por 5 turnos. +4: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar _Intervenção Divina_, que aumenta o escudo do Clérigo e de todos os aliados até 300 e estende a Forma Ascendida por 6 turnos. _Intervenção Divina_ custa 5 cargas de tomo e só pode ser conjurada uma vez na mesma forma ascendida.
actors.hero.talent.divine_intervention.title=intervenção divina
actors.hero.talent.divine_sense.desc=+1: O Clérigo pode lançar _Senso Divino_, um feitiço que lhe concede _8 espaços_ de Visão Mental durante 50 turnos e não demora a lançar, com o custo de 2 cargas. +2: O Clérigo pode lançar _Senso Divino_, um feitiço que lhe concede _12 espaços_ de Visão Mental durante 50 turnos e não demora a lançar, com o custo de 2 cargas.
actors.hero.talent.divine_sense.meta_desc=_Se este talento for adquirido por um herói diferente_, conceder-lhe-á visão mental por um breve momento após utilizar uma varinha ou artefacto com um alcance de 3 quadrados com +1 ou 5 quadrados com +2.
actors.hero.talent.divine_sense.title=sentido divino
actors.hero.talent.double_jump.desc=_+1:_ Se o Guerreiro realizar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _16% reduzido_.\n\n_+2:_ Se o Guerreiro realizar um segundo salto dentro de 3 turnos, esse salto terá um custo de carga _30% reduzido_.\n\n_+3:_ Se o Guerreiro realizar um segundo salto dentro de 3 turnos, este salto terá um custo de carga _40% reduzido_.\n\n_+4:_ Se o Guerreiro realizar um segundo salto no espaço de 3 turnos, este salto terá um custo de carga _50% reduzido_.
actors.hero.talent.double_jump.title=salto duplo
actors.hero.talent.double_mark.desc=_+1:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _30% reduzido_.\n\n_+2:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _50% reduzido_.\n\n_+3:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _65% reduzido_.\n\n_+4:_ Marcar um segundo alvo ao mesmo tempo que o primeiro tem um custo de cobrança _75% reduzido_.
actors.hero.talent.double_mark.title=marca dupla
actors.hero.talent.durable_projectiles.desc=_+1:_ As armas de arremesso têm _+50% de durabilidade_ quando utilizadas pela Caçadora.\n\n_+2:_ As armas de arremesso têm _+75% de durabilidade_ quando utilizadas pela Caçadora.
actors.hero.talent.durable_projectiles.title=projéteis duráveis
actors.hero.talent.durable_tips.desc=+1: Os dardos com ponta têm 2x mais durabilidade quando o Guarda os utiliza. +2: Os dardos com ponta têm 3x mais durabilidade quando o Guarda os utiliza. +3: Os dardos com ponta têm 4x mais durabilidade quando o Guarda os utiliza.
actors.hero.talent.durable_tips.title=pontas duráveis
actors.hero.talent.eagle_eye.desc=+1: O alcance de visão do falcão espiritual é aumentado de 6 para 7 quadrados. +2: O alcance de visão do falcão espiritual é aumentado de 6 para 8 quadrados. +3: O alcance de visão do falcão espiritual é aumentado de 6 para 9 quadrados e ganha 2 quadrados de visão mental. +4: O alcance de visão do falcão espiritual é aumentado de 6 para 10 quadrados e este ganha 3 quadrados de visão mental.
actors.hero.talent.eagle_eye.title=olho de águia
actors.hero.talent.elemental_power.desc=_+1:_ O poder da explosão elemental é aumentado em _25%_.\n\n_+2:_ O poder da explosão elemental é aumentado em _50%_.\n\n_+3:_ O poder da explosão elemental é aumentado em _75%_.\n\n_+4:_ O poder da explosão elementar é aumentado em _100%_.
actors.hero.talent.elemental_power.title=poder elemental
actors.hero.talent.elemental_reach.desc=_+1:_ O alcance do Golpe Elemental é aumentado de 4 para 5 quadrados, e a sua largura é aumentada de 65 para 75 graus.\n\n_+2:_ O alcance do Golpe Elemental é aumentado de 4 para 6 quadrados, e a sua largura é aumentada de 65 para 85 graus.\n\n_+3:_ O alcance do Golpe Elemental é aumentado de 4 para 7 quadrados, e a sua largura é aumentada de 65 para 95 graus.\n\n_+4:_ O alcance do Golpe Elemental é aumentado de 4 para 8 quadrados, e a sua largura é aumentada de 65 para 105 graus.
actors.hero.talent.elemental_reach.title=alcance elemental
actors.hero.talent.elimination_match.desc=_+1:_ Se o Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _16% reduzido_.\n\n_+2:_ Se o Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _30% reduzido_.\n\n_+3:_ Se o Duelista desafiar Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _40% reduzido_.\n\n_+4:_ Se o Duelista desafiar novamente dentro de 3 turnos após o término de um duelo, esse desafio terá um custo de carga _50% reduzido_.
actors.hero.talent.elimination_match.title=partida de eliminação
actors.hero.talent.empowered_strike.desc=_+1:_ O primeiro ataque corpo a corpo do Mago de Batalha com o seu bastão após utilizar o raio causa _+16% de dano_ e o efeito bónus do bastão recebe _+50% de poder_. \n\n_+2:_ O primeiro ataque corpo a corpo do Mago de Batalha com o seu bastão após utilizar o raio causa _+33% de dano_ e o efeito bónus do bastão recebe _+100% de poder_.\n\n_+3:_ O primeiro ataque corpo a corpo do Mago de Batalha com o seu bastão após usar o raio causa _+50% de dano_ e o efeito bónus do bastão recebe _+150% de poder_.
actors.hero.talent.empowered_strike.title=greve fortalecida
actors.hero.talent.empowering_meal.desc=_+1:_ Comer concede ao Mago _2 de dano bónus_ nas próximas 3 vezes que causar dano com uma varinha.\n\n_+2:_ Comer concede ao Mago _3 de dano bónus_ nas próximas 3 vezes que causar dano com uma varinha.
actors.hero.talent.empowering_meal.title=refeição fortalecedora
actors.hero.talent.endless_rage.desc=+1: O Berserker pode atingir um máximo de 116% de fúria. +2: O Berserker pode atingir um máximo de 133% de fúria. +3: O Berserker pode atingir um máximo de 150% de fúria. Cada ponto de fúria acima de 100% aumenta o escudo de berserk em 1% e reduz o tempo de recarga em 1%, mas não aumenta o bónus de dano para além de +50%.
actors.hero.talent.endless_rage.title=fúria sem fim
actors.hero.talent.energizing_meal.desc=_+1:_ Comer consome 1 turno do Mago e concede-lhe _5 turnos de recarga da varinha_.\n\n_+2:_ Comer consome 1 turno do Mago e concede-lhe _8 turnos de recarga da varinha_.
actors.hero.talent.energizing_meal.title=refeição energizante
actors.hero.talent.enhanced_combo.desc=_+1:_ Quando o combo do Gladiador for 7 ou mais, o alcance de repulsão do Golpe Baixo aumenta para 3, causa vertigens e pode atirar os inimigos para os buracos.\n\n_+2:_ Para além dos benefícios de +1, quando o combo do Gladiador for 9 ou mais, o Aparar funciona em múltiplos ataques.\n\n_+3:_ Para além dos benefícios de +1 e +2, o Gladiador pode saltar até ao equivalente a um combo/3 quadrados quando utiliza Golpe Baixo, Esmagamento ou Fúria.
actors.hero.talent.enhanced_combo.title=combinação aprimorada
actors.hero.talent.enhanced_lethality.desc=_+1:_ O Assassino pode assassinar inimigos com menos de _4/13/27/67% de vida_ por nível de preparação, em vez de 3/10/20/50%.\n\n_+2:_ O Assassino pode assassinar inimigos com menos de _5/17/33/83% de vida_ por nível de preparação, em vez de 3/10/20/50%.\n\n_+3:_ O Assassino pode assassinar inimigos com menos de _6/20/40/100% de vida_ por nível de preparação, em vez de 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=letalidade aumentada
actors.hero.talent.enhanced_rings.desc=_+1:_ Quando o Ladino utiliza um artefacto, os seus anéis recebem +1 de melhoria durante _3 turnos_.\n\n_+2:_ Quando o Ladino utiliza um artefacto, os seus anéis recebem +1 de melhoria durante _6 turnos_.\n\n_+3:_ Quando o Ladino utiliza um artefacto, os seus anéis recebem +1 de melhoria durante _9 turnos_.
actors.hero.talent.enhanced_rings.title=anéis aprimorados
actors.hero.talent.enlightening_meal.desc=+1: Comer consome 1 turno do Clérigo e concede-lhe 0,67 cargas no seu tomo sagrado. +2: Comer consome 1 turno do Clérigo e concede-lhe 1 carga no seu tomo sagrado.
actors.hero.talent.enlightening_meal.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá 2 turnos de recarga de varinha e artefacto em +1, ou 3 turnos em +2. Isto não pode ser utilizado para recarregar a própria cornucópia.
actors.hero.talent.enlightening_meal.title=Refeição Iluminadora
actors.hero.talent.enraged_catalyst.desc=+1: Os encantamentos e maldições na arma do Berserker são ativados com mais frequência quanto maior for a sua fúria, até um máximo de 15% mais vezes com 100% de fúria. +2: Os encantamentos e maldições na arma do Berserker são ativados com mais frequência quanto maior for a sua fúria, até um máximo de 30% mais vezes com 100% de fúria. +3: Os encantamentos e maldições na arma do Berserker são ativados com mais frequência quanto maior for a sua fúria, até um máximo de 45% mais vezes com 100% de fúria.
actors.hero.talent.enraged_catalyst.title=catalisador enfurecido
actors.hero.talent.evasive_armor.desc=_+1:_ Durante a corrida livre, o Freerunner ganha _+1 de evasão_ adicional por ponto de excesso de força na sua armadura. _+3 de evasão_ por ponto de excesso de força na sua armadura.
actors.hero.talent.evasive_armor.title=armadura evasiva
actors.hero.talent.even_the_odds.desc=_+1:_ O Guerreiro causa _5% de dano adicional adicional por cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.\n\n_+2:_ O Guerreiro causa _10% de dano adicional adicional por cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.\n\n_+3:_ O Guerreiro causa _15% de dano adicional adicional por cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.\n\n_+4:_ O Guerreiro causa _20% de dano adicional de bónus por cada inimigo dentro de 2 quadrados quando a habilidade de resistência terminar.
actors.hero.talent.even_the_odds.title=igualar as probabilidades
actors.hero.talent.excess_charge.desc=_+1:_ Quando o bastão do Mago de Batalha estiver totalmente carregado, o seu próximo raio conceder-lhe-á _0,67 de escudo_ por nível do bastão.\n\n_+2:_ Quando o bastão do Mago de Batalha estiver totalmente carregado, o seu próximo raio conceder-lhe-á _1,33 de escudo_ por nível do bastão.\n\n_+3:_ Quando o bastão do Mago de Batalha estiver totalmente carregado, o seu próximo raio conceder-lhe-á _2 de escudo_ por nível do bastão.
actors.hero.talent.excess_charge.title=cobrança excessiva
actors.hero.talent.expanding_wave.desc=_+1:_ O alcance da Onda de Choque foi aumentado de 5 para 6 blocos, e a sua largura foi aumentada de 60 para 75 graus.\n\n_+2:_ O alcance da Onda de Choque foi aumentado de 5 para 7 blocos, e a sua largura foi aumentada de 60 para 90 graus.\n\n_+3:_ O alcance da Onda de Choque foi aumentado de 5 para 8 blocos, e a sua largura foi aumentada de 60 para 105 graus.\n\n_+4:_ O alcance da Onda de Choque foi aumentado de 5 para 9 blocos, e a sua largura foi aumentada de 60 para 120 graus.
actors.hero.talent.expanding_wave.title=onda em expansão
actors.hero.talent.expose_weakness.desc=_+1:_ Os inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis durante _2 turnos_.\n\n_+2:_ Os inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis durante _4 turnos_.\n\n_+3:_ Os inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis durante _6 turnos_.\n\n_+4:_ Os inimigos que atacam a imagem residual do Duelista ficam fracos e vulneráveis durante _8 turnos_.
actors.hero.talent.expose_weakness.title=expor fraqueza
actors.hero.talent.fan_of_blades.desc=+1: As lâminas espectrais podem atingir até 1 alvo adicional, causando 50% de dano. O alvo deve estar visível e dentro de um cone de 30 graus. +2: As lâminas espectrais podem atingir até 2 alvos adicionais, causando 50% de dano. Os alvos devem estar visíveis e dentro de um cone de 60 graus. +3: As lâminas espectrais podem atingir até 3 alvos adicionais, causando 50% de dano. Os alvos devem estar visíveis e dentro de um cone de 90 graus. +4: As lâminas espectrais podem atingir até 4 alvos adicionais, causando 50% de dano. Os alvos devem estar visíveis e dentro de um cone de 120 graus.
actors.hero.talent.fan_of_blades.title=leque de lâminas
actors.hero.talent.farsight.desc=_+1:_ O alcance de visão do Atirador é _aumentado em 25%_.\n\n_+2:_ O alcance de visão do Atirador é _aumentado em 50%_.\n\n_+3:_ O alcance de visão do Atirador é _aumentado em 75%_.
actors.hero.talent.farsight.title=visão de longo alcance
actors.hero.talent.fear_the_reaper.desc=_+1:_ Quando um inimigo marcado para morrer chega a 0 PV, fica _aleijado_.\n\n_+2:_ Quando um inimigo marcado para morrer chega a 0 PV, fica _temido e aleijado_.\n\n_+3:_ Quando um inimigo marcado para morrer chega a 0 PV, fica _temido e aleijado_ e os inimigos num raio de 3 quadrados ficam _aleijados_.\n\n_+4:_ Quando um inimigo marcado para morrer chega a 0 PV, fica _temido e aleijado_ e os inimigos num raio de 3 quadrados ficam _temidos e aleijados_.
actors.hero.talent.fear_the_reaper.title=tema a morte
actors.hero.talent.feigned_retreat.desc=+1: Se um inimigo atacar a imagem residual da Duelista, esta ganha 2 turnos de ímpeto. +2: Se um inimigo atacar a imagem residual da Duelista, esta ganha 4 turnos de ímpeto. +3: Se um inimigo atacar a imagem residual da Duelista, esta ganha 6 turnos de ímpeto. +4: Se um inimigo atacar a imagem residual da Duelista, esta ganha 8 turnos de ímpeto.
actors.hero.talent.feigned_retreat.title=recuo fingido
actors.hero.talent.fire_everything.desc=_+1:_ A magia selvagem dispara agora _5 vezes_, em vez de 4, e cada varinha tem _25% de hipóteses_ de ser utilizada 3 vezes.\n\n_+2:_ A magia selvagem dispara agora _6 vezes_, em vez de 4, e cada varinha tem _50% de hipóteses_ de ser utilizada 3 vezes.\n\n_+3:_ A magia selvagem dispara agora _7 vezes_, em vez de 4, e cada varinha tem _75% de hipóteses_ de ser utilizada 3 vezes.\n\n_+4:_ A magia selvagem dispara agora _8 vezes_, em vez de 4, e cada varinha tem _100% de hipóteses_ de ser utilizada 3 vezes.
actors.hero.talent.fire_everything.title=fogo em tudo
actors.hero.talent.flash.desc=_+1:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _3 quadrados_ de distância.\n\n_+2:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _4 quadrados_ de distância.\n\n_+3:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _5 quadrados_ de distância.\n\n_+4:_ Enquanto estiver na Forma Ascendida, o Clérigo pode conjurar _Flash_ para se teletransportar até _6 quadrados_ de distância.\n\nFlash custa 2 cargas de tomo inicialmente e 1 carga adicional por cada utilização na mesma forma ascendida.
actors.hero.talent.flash.title=clarão
actors.hero.talent.focused_meal.desc=+1: Comer consome 1 turno do Duelista e concede-lhe 0,67 cargas nas suas armas. +2: Comer consome 1 turno do Duelista e concede-lhe 1 carga nas suas armas.
actors.hero.talent.focused_meal.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá um dano bónus ao próximo ataque igual ao seu nível/3 no nível +1, ou nível/2 no nível +2.
actors.hero.talent.focused_meal.title=refeição focada
actors.hero.talent.followup_strike.desc=_+1:_ Quando a Caçadora atinge um inimigo com o seu arco ou uma arma de arremesso, o seu próximo ataque corpo a corpo contra esse inimigo causa _2 de dano bónus_.\n\n_+2:_ Quando a Caçadora atinge um inimigo com o seu arco ou uma arma de arremesso, o seu próximo ataque corpo a corpo contra esse inimigo causa _3 de dano bónus_.
actors.hero.talent.followup_strike.title=ataque de acompanhamento
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Os ataques do falcão espiritual cegam os inimigos durante _2 turnos_.\n\n_+2:_ Os ataques do falcão espiritual cegam os inimigos durante _5 turnos_.\n\n_+3:_ Os ataques do falcão espiritual cegam os inimigos durante _5 turnos_ e incapacitam-nos durante _2 turnos_.\n\n_+4:_ Os ataques do falcão espiritual cegam os inimigos durante _5 turnos_ e incapacitam-nos durante _5 turnos_.
actors.hero.talent.go_for_the_eyes.title=mire nos olhos
actors.hero.talent.growing_power.desc=_+1:_ Os bónus de ataque e velocidade de movimento do poder da natureza são aumentados para _38% e 125%_, de 33% e 100%.\n\n_+2:_ Os bónus de ataque e velocidade de movimento do poder da natureza são aumentados para _42% e 150%_, de 33% e 100%.\n\n_+3:_ Os bónus de ataque e velocidade de movimento do poder da natureza são aumentados para _46% e 175%_, de 33% e 100%.\n\n_+4:_ Os bónus de ataque e velocidade de movimento do poder da natureza são aumentados para _50% e 200%_, de 33% e 100%.
actors.hero.talent.growing_power.title=poder crescente
actors.hero.talent.hallowed_ground.desc=+1: O Sacerdote pode lançar _Solo Sagrado_, uma magia que santifica o terreno numa área de _3x3_ durante 20 turnos, com o custo de 2 cargas. +2: O Sacerdote pode lançar _Solo Sagrado_, uma magia que santifica o terreno numa área de _5x5_ durante 20 turnos, com o custo de 2 cargas. +3: O Sacerdote pode lançar _Solo Sagrado_, uma magia que santifica o terreno numa área de _7x7_ durante 20 turnos, com um custo de 2 cargas. Quando conjurada, _Solo Sagrado_ cura os aliados a 15 PV, imobiliza brevemente os inimigos e espalha erva baixa. Depois disso, cura lentamente os aliados, enfraquece os inimigos e faz com que cresça erva alta aleatoriamente. O solo sagrado concede proteção ao Sacerdote em vez de cura e é destruído pelo fogo.
actors.hero.talent.hallowed_ground.title=terra sagrada
actors.hero.talent.hasty_retreat.desc=_+1:_ Após piscar, o Ladino ganha _1 turno_ de ímpeto e invisibilidade.\n\n_+2:_ Após piscar, o Ladino ganha _2 turnos_ de ímpeto e invisibilidade.\n\n_+3:_ Após piscar, o Ladino ganha _3 turnos_ de ímpeto e invisibilidade.\n\n_+4:_ Após piscar, o Ladino ganha _4 turnos_ de ímpeto e invisibilidade.
actors.hero.talent.hasty_retreat.title=retirada precipitada
actors.hero.talent.hearty_meal.desc=_+1:_ Comer comida cura o Guerreiro em _4 PV_ quando estiver com 33% de vida ou menos.\n\n_+2:_ Comer comida cura o Guerreiro em _6 PV_ quando estiver com 33% de vida ou menos.
actors.hero.talent.hearty_meal.title=refeição farta
actors.hero.talent.heightened_senses.desc=_+1:_ A Caçadora ganha visão mental nas personagens a _2 espaços da sua posição_.\n\n_+2:_ A Caçadora ganha visão mental nas personagens a _3 espaços da sua posição_.
actors.hero.talent.heightened_senses.title=sentidos aguçados
actors.hero.talent.heroic_energy.desc=_+1:_ A habilidade de armadura do herói tem um custo de carga _12% reduzido_.\n\n_+2:_ A habilidade de armadura do herói tem um custo de carga _23% reduzido_.\n\n_+3:_ A habilidade de armadura do herói tem um custo de carga _32% reduzido_.\n\n_+4:_ A habilidade de armadura do herói tem um custo de carga _40% reduzido_.
actors.hero.talent.heroic_energy.rat_title=energia ratoica
actors.hero.talent.heroic_energy.title=energia heroica
actors.hero.talent.hold_fast.desc=_+1:_ Quando o Guerreiro espera, ganha _1-2 de armadura_ e reduz a redução dos bónus de combo e escudo em _50%_ até se mover.\n\n_+2:_ Quando o Guerreiro espera, ganha _2-4 de armadura_ e reduz a redução dos bónus de combo e escudo em _75%_ até se mover.\n\n_+3:_ Quando o Guerreiro espera, ganha _3-6 de armadura_ e reduz a redução dos bónus de combo e escudo em _100%_ até se mover.
actors.hero.talent.hold_fast.title=agarrar-se
actors.hero.talent.holy_intuition.desc=+1: O Clérigo pode lançar _Intuição Sagrada_, uma magia que revela se um item está amaldiçoado, com um custo de _3 cargas._ +2: O Clérigo pode lançar _Intuição Sagrada_, uma magia que revela se um item está amaldiçoado, com um custo de _2 cargas._
actors.hero.talent.holy_intuition.meta_desc=_Se este talento for adquirido por um herói diferente_, permitirá ao herói identificar o estado de maldição num item amaldiçoado imediatamente antes de o equipar, 15% das vezes em +1 ou 25% das vezes em +2.
actors.hero.talent.holy_intuition.title=intuição sagrada
actors.hero.talent.holy_lance.desc=+1: O Sacerdote pode lançar Lança Sagrada, uma magia devastadora que causa 30 a 55 de dano com um custo de 4 cargas. +2: O Sacerdote pode lançar Lança Sagrada, uma magia devastadora que causa 45 a 83 de dano com o custo de 4 cargas. +3: O Sacerdote pode lançar Lança Sagrada, uma magia devastadora que causa 60 a 110 de dano com o custo de 4 cargas. Lança Sagrada causa sempre o máximo dano a inimigos demoníacos e mortos-vivos. Lança Sagrada tem um tempo de espera de 30 turnos antes de poder ser conjurada novamente.
actors.hero.talent.holy_lance.title=lança sagrada
actors.hero.talent.impact_wave.desc=_+1:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes são empurrados _2 casas_ para trás e têm _25% de hipóteses_ de ficarem vulneráveis durante 5 turnos.\n\n_+2:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes são empurrados _3 casas_ para trás e têm _50% de hipóteses_ de ficarem vulneráveis durante 5 turnos.\n\n_+3:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes são empurrados _4 casas_ para trás e têm _75% de hipóteses_ de ficarem vulneráveis durante 5 turnos.\n\n_+4:_ Quando o Guerreiro aterra após o salto, todos os inimigos adjacentes são empurrados _5 casas_ para trás e têm _100% de hipóteses_ de ficarem vulneráveis durante 5 turnos.
actors.hero.talent.impact_wave.title=onda de impacto
actors.hero.talent.improvised_projectiles.desc=+1: O Guerreiro pode cegar um inimigo durante 2 turnos atirando-lhe qualquer item que não seja uma arma de arremesso. Esta habilidade tem um tempo de espera de 50 turnos. +2: O Guerreiro pode cegar um inimigo durante 3 turnos atirando-lhe qualquer item que não seja uma arma de arremesso. Esta habilidade tem um tempo de espera de 50 turnos.
actors.hero.talent.improvised_projectiles.title=projéteis improvisados
actors.hero.talent.inscribed_power.desc=_+1:_ Quando o Mago lê um pergaminho ou utiliza um item mágico, os seus _próximos 2 ataques de varinha_ recebem +2 níveis.\n\n_+2:_ Quando o Mago lê um pergaminho ou utiliza um item mágico, os seus _próximos 3 ataques de varinha_ recebem +2 níveis.\n\nO número de ataques de varinha melhorados é duplicado quando se utiliza um pergaminho de melhoria, transmutação ou itens de alquimia que devem ser criados utilizando estes pergaminhos.\n\nPara itens de alquimia com quantidades de produção mais elevadas (por exemplo, a maioria das magias), este talento tem uma probabilidade de ser activado com base no número de itens deste tipo que são produzidos.
actors.hero.talent.inscribed_power.title=poder inscrito
actors.hero.talent.inscribed_stealth.desc=+1: O Ladino ganha 3 turnos de invisibilidade após ler um pergaminho ou usar um item mágico. +2: O Ladino ganha 5 turnos de invisibilidade após ler um pergaminho ou usar um item mágico. A duração da invisibilidade é duplicada ao utilizar um pergaminho de melhoramento, pergaminho de transmutação ou itens de alquimia que precisam de ser criados utilizando estes pergaminhos. Para itens de alquimia com maior quantidade de produção (por exemplo, a maioria dos feitiços), este talento tem uma probabilidade de ser ativado com base na quantidade do item produzido.
actors.hero.talent.inscribed_stealth.title=furtividade inscrita
actors.hero.talent.invigorating_meal.desc=_+1:_ Comer comida demora 1 turno à Caçadora (as frutas são comidas instantaneamente) e concede-lhe _1 turno de aceleração_.\n\n_+2:_ Comer comida demora 1 turno à Caçadora (as frutas são comidas instantaneamente) e concede-lhe _2 turnos de aceleração_.
actors.hero.talent.invigorating_meal.title=refeição revigorante
actors.hero.talent.invigorating_victory.desc=+1: Se a Duelista derrotar o seu alvo antes do final do duelo, recupera 5 PV mais 30% do dano sofrido durante o duelo. +2: Se a Duelista derrotar o seu alvo antes do final do duelo, recupera 10 PV mais 50% do dano sofrido durante o duelo. +3: Se a Duelista derrotar o seu alvo antes do final do duelo, recupera 15 PV mais 65% do dano sofrido durante o duelo. +4: Se a Duelista derrotar o seu alvo antes do final do duelo, recupera 20 PV mais 75% do dano sofrido durante o duelo.
actors.hero.talent.invigorating_victory.title=vitória revigorante
actors.hero.talent.iron_stomach.desc=_+1:_ Comer consome 1 turno do Guerreiro e concede-lhe _75% de resistência ao dano_ enquanto come.\n\n_+2:_ Comer consome 1 turno do Guerreiro e concede-lhe _100% de resistência ao dano_ enquanto come.
actors.hero.talent.iron_stomach.title=estômago de ferro
actors.hero.talent.iron_will.desc=_+1:_ O escudo fornecido pelo selo do Guerreiro é _aumentado em 1_.\n\n_+2:_ O escudo fornecido pelo selo do Guerreiro é _aumentado em 2_.
actors.hero.talent.iron_will.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá passivamente uma versão com 1 ou 2 escudos máximos do efeito de selo quebrado do Guerreiro.
actors.hero.talent.iron_will.title=vontade de ferro
actors.hero.talent.judgement.desc=+1: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar Julgamento, que causa 10 a 20 de dano a todos os inimigos visíveis. +2: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar Julgamento, que causa 15 a 30 de dano a todos os inimigos visíveis. +3: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar Julgamento, que causa 20 a 40 de dano a todos os inimigos visíveis. +4: Enquanto estiver na Forma Ascendida, o Clérigo pode lançar Julgamento, que causa 25 a 50 de dano a todos os inimigos visíveis. Julgamento custa 3 cargas de tomo. O Julgamento causa +33% de dano por cada magia que o Clérigo tenha lançado desde que entrou na forma ascendida ou desde a última conjuração de Julgamento.
actors.hero.talent.judgement.title=julgamento
actors.hero.talent.lay_on_hands.desc=+1: O Paladino pode lançar Imposição de Mãos, uma magia que cura instantaneamente uma personagem próxima em 15 PV ou concede ao Paladino 15 de escudo, com um custo de 1 carga. +2: O Paladino pode lançar Imposição de Mãos, uma magia que cura instantaneamente uma personagem próxima em 20 PV ou concede ao Paladino 20 de escudo, com um custo de 1 carga. +3: O Paladino pode lançar Imposição de Mãos, uma magia que cura instantaneamente uma personagem próxima a 25 PV ou concede ao Paladino 25 de escudo, com um custo de 1 carga. O excesso de cura desta magia é convertido em escudo. A Imposição de Mãos pode ser conjurada repetidamente, mas não pode aplicar o equivalente a mais de três conjurações de proteção em simultâneo.
actors.hero.talent.lay_on_hands.title=imposição de mãos
actors.hero.talent.lethal_defense.desc=_+1:_ Quando o Gladiador elimina um inimigo com um golpe combinado, o tempo de recarga do seu escudo de selo quebrado é reduzido em 50 turnos. \n\n_+2:_ Quando o Gladiador elimina um inimigo com um golpe combinado, o tempo de recarga do seu escudo de selo quebrado é reduzido em 100 turnos. \n\n_+3:_ Quando o Gladiador elimina um inimigo com um golpe combinado, o tempo de recarga do seu escudo de selo quebrado é reduzido em 150 turnos. \n\n O tempo de recarga do escudo pode ser reduzido para até -150 turnos por este talento, o que significa que estará novamente disponível imediatamente após ser ativado.
actors.hero.talent.lethal_defense.title=defesa letal
actors.hero.talent.lethal_haste.desc=_+1:_ Quando a Duelista desfere um golpe fatal num inimigo com uma habilidade de arma, ganha um movimento instantâneo equivalente a _3 turnos_.\n\n_+2:_ Quando a Duelista desfere um golpe fatal num inimigo com uma habilidade de arma, ganha um movimento instantâneo equivalente a _5 turnos_.
actors.hero.talent.lethal_haste.meta_desc=_Se este talento for adquirido por um herói diferente_, será ativado com ataques normais de armas, com um tempo de recarga de 100 turnos.
actors.hero.talent.lethal_haste.title=pressa letal
actors.hero.talent.lethal_momentum.desc=_+1:_ Quando o Guerreiro desfere um golpe fatal num inimigo com uma arma física, tem _67% de hipóteses_ de não gastar turnos.\n\n_+2:_ Quando o Guerreiro desfere um golpe fatal num inimigo com uma arma física, tem _100% de hipóteses_ de não gastar turnos.
actors.hero.talent.lethal_momentum.title=momento letal
actors.hero.talent.life_link.desc=O Clérigo pode conjurar _Vínculo Vital_ entre si e um aliado fortalecido com o custo de 2 cargas. Esta magia faz com que o dano seja partilhado entre o Clérigo e o seu aliado, e faz com que magias benéficas de clérigo de nível 3 ou inferior se apliquem a ambos se um deles estiver a ser afetado. \n\n_+1:_ Vínculo Vital dura 10 turnos e aumenta o bónus de Poder de Muitos para -35% do dano recebido. \n\n_+2:_ Vínculo Vital dura 13 turnos e aumenta o bónus de Poder de Muitos para -40% do dano recebido. \n\n_+3: Vínculo Vital dura 17 turnos e aumenta o bónus de Poder de Muitos para -45% do dano recebido. \n\n_+4: O Vínculo Vital dura 20 turnos e aumenta o bónus de Poder de Muitos para -50% do dano recebido.
actors.hero.talent.life_link.title=ligação vital
actors.hero.talent.light_cloak.desc=_+1:_ O Ladino pode usar a sua capa das sombras quando esta não está equipada, mas recarrega a _25% da velocidade_ quando desequipada.\n\n_+2:_ O Ladino pode usar a sua capa das sombras quando não está equipada, mas recarrega a _50% da velocidade_ quando desequipada.\n\n_+3:_ O Ladino pode usar a sua capa das sombras quando esta não está equipada, mas recarrega a _75% da velocidade_ quando está desequipada.
actors.hero.talent.light_cloak.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a velocidade de carregamento de todos os artefactos em 7/13/20% em +1/+2/+3.
actors.hero.talent.light_cloak.title=manto leve
actors.hero.talent.light_reading.desc=_+1:_ O Clérigo pode usar o seu tomo sagrado quando não está equipado, mas recarrega a _25% da velocidade_ quando desequipado.\n\n_+2:_ O Clérigo pode usar o seu tomo sagrado quando não está equipado, mas recarrega a _50% da velocidade_ quando desequipado.\n\n_+3:_ O Clérigo pode usar o seu tomo sagrado quando não está equipado, mas recarrega a _75% da velocidade_ quando está desequipado.
actors.hero.talent.light_reading.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a velocidade de recarga de todas as varinhas em 7/13/20% nos níveis +1/+2/+3.
actors.hero.talent.light_reading.title=Leitura leve
actors.hero.talent.lingering_magic.desc=_+1:_ Quando o Mago utiliza uma varinha ou um bastão para atacar, o seu próximo ataque físico causa _1-2 de dano bónus_.\n\n_+2:_ Quando o Mago utiliza uma varinha ou um bastão para atacar, o seu próximo ataque físico causa _2 de dano bónus_.
actors.hero.talent.lingering_magic.title=magia persistente
actors.hero.talent.liquid_agility.desc=+1: Ao beber ou lançar uma poção, bebida ou elixir, o Duelista tem evasão triplicada e precisão triplicada no seu próximo ataque corpo a corpo no espaço de 5 turnos. +2: Ao beber ou lançar uma poção, bebida ou elixir, o Duelista tem uma evasão infinita e uma precisão infinita no seu próximo ataque corpo a corpo no espaço de 5 turnos. Este bónus dura um turno e ataque adicionais ao utilizar poções de força, experiência ou itens de alquimia que precisam de ser criados com estas poções. Para itens de alquimia com maior quantidade de produção (por exemplo, bebida aquosa), este talento tem uma probabilidade de ser ativado com base na quantidade desse item produzida.
actors.hero.talent.liquid_agility.title=agilidade líquida
actors.hero.talent.liquid_nature.desc=_+1:_ Quando a Caçadora bebe ou lança uma poção, infusão ou elixir, _até 4 quadrados de erva_ brotam na área circundante e os inimigos adjacentes ficam enraizados durante _1 turno_.\n\n_+2:_ Quando a Caçadora bebe ou lança uma poção, infusão ou elixir, _até 6 quadrados de erva_ brotam na área circundante e os inimigos adjacentes ficam enraizados durante _2 turnos_.\n\nA quantidade de erva e a duração do enraizamento são duplicadas quando se utilizam poções de força, experiência ou itens de alquimia que precisam de ser criados com estas poções.\n\nPara itens de alquimia com maior quantidade de produção (por exemplo, infusão aquática), este talento tem uma probabilidade de ser ativado com base na quantidade deste item produzida.
actors.hero.talent.liquid_nature.title=natureza líquida
actors.hero.talent.liquid_willpower.desc=_+1:_ O Guerreiro ganha _6,5% do seu HP máximo em escudo_ ao beber ou lançar uma poção, infusão ou elixir.\n\n_+2:_ O Guerreiro ganha _10% do seu HP máximo em escudo_ ao beber ou lançar uma poção, infusão ou elixir.\n\nA quantidade de escudo é duplicada ao utilizar poções de força, experiência ou itens de alquimia que precisam de ser criados com estas poções.\n\nPara itens de alquimia com maiores quantidades de produção (por exemplo, infusão aquática), este talento tem uma probabilidade de ser ativado com base no número de itens desse item que são produzidos.
actors.hero.talent.liquid_willpower.title=força de vontade líquida
actors.hero.talent.longrange_warp.desc=_+1:_ O Mago pode agora teletransportar-se entre andares, com um custo de carga de _150%_.\n\n_+2:_ O Mago pode agora teletransportar-se entre andares, com um custo de carga de _117%_.\n\n_+3:_ O Mago pode agora teletransportar-se entre andares, com um custo de carga de _83%_.\n\n_+4:_ O Mago pode agora teletransportar-se entre pisos, com um custo de carga de _50%_.\n\nO Mago não pode utilizar o teletransporte de longo alcance para sair de um piso bloqueado.
actors.hero.talent.longrange_warp.title=Dobra de longo alcance
actors.hero.talent.mind_form.desc=O Clérigo pode conjurar _Forma Mental_, que imbui Trinity com o poder de uma varinha ou arma de arremesso que o Clérigo tenha usado nesta ronda, com um custo de 3 cargas. \n\n_+1:_ Quando é utilizada Trinity, o Clérigo utiliza o efeito de raio ou de lançamento do item escolhido, como se fosse _+3._\n\n_+2:_ Quando é utilizada Trinity, o Clérigo utiliza o efeito de raio ou de lançamento do item escolhido, como se fosse _+4. _\n\n_+3:_ Quando é utilizada Trinity, o Clérigo utiliza o efeito de raio ou de lançamento do item escolhido, como se fosse _+5. _\n\n_+4:_ Quando é utilizada Trinity, o Clérigo utiliza o efeito de raio ou de lançamento do item escolhido, como se fosse _+6. _\n\nTrinity só pode ser imbuída com um efeito mental de cada vez.
actors.hero.talent.mind_form.title=forma mental
actors.hero.talent.mnemonic_prayer.desc=+1: O Sacerdote pode lançar _Oração Mnemónica_, uma magia que estende efeitos positivos/negativos a um aliado/inimigo durante _3 turnos_ com o custo de 1 carga. +2: O Sacerdote pode lançar _Oração Mnemónica_, uma magia que estende efeitos positivos/negativos a um aliado/inimigo durante _4 turnos_ com o custo de 1 carga. +3: O Sacerdote pode lançar _Oração Mnemónica_, uma magia que estende efeitos positivos/negativos a um aliado/inimigo durante _5 turnos_ com o custo de 1 carga. A Oração Mnemónica não demora tempo a ser conjurada. A Oração Mnemónica só pode estender uma instância específica de um efeito positivo/negativo uma vez e não pode estender efeitos positivos de habilidades de armadura.
actors.hero.talent.mnemonic_prayer.title=oração mnemónica
actors.hero.talent.monastic_vigor.desc=_+1:_ Se o Monge tiver _100% de energia_, as suas habilidades são fortalecidas.\n\n_+2:_ Se o Monge tiver _80% ou mais de energia_, as suas habilidades são fortalecidas.\n\n_+3:_ Se o Monge tiver _60% ou mais de energia_, as suas habilidades são fortalecidas.\n\nQuando fortalecidas:\n- Rajada aplica o encantamento da sua arma\n- Foco é instantâneo\n- Investida ganha +4 de alcance\n- Chute do Dragão causa +50% de dano e aplica o seu efeito de repulsão e atordoamento a todos os inimigos adjacentes\n- Meditar cura lentamente 20% dos PV perdidos e concede 80% de resistência ao dano.
actors.hero.talent.monastic_vigor.title=vigor monástico
actors.hero.talent.mystical_charge.desc=_+1:_ Atacar com o seu bastão concede ao Mago de Batalha _0,5 turnos_ de recarga de artefactos. \n\n_+2:_ Atacar com o seu bastão concede ao Mago de Batalha _1 turno_ de recarga de artefactos. \n\n_+3:_ Atacar com o seu bastão concede ao Mago de Batalha _1,5 turnos_ de recarga de artefato.
actors.hero.talent.mystical_charge.title=carga mística
actors.hero.talent.mystical_meal.desc=+1: Comer consome 1 turno do Ladino (as rações de mantimentos são consumidas instantaneamente) e concede-lhe 3 turnos de recarga do artefacto. +2: Comer consome 1 turno do Ladino (as rações de mantimentos são consumidas instantaneamente) e concede-lhe 5 turnos de recarga do artefacto. Este talento não pode ser utilizado para recarregar a Cornualha da Abundância.
actors.hero.talent.mystical_meal.title=refeição mística
actors.hero.talent.natures_aid.desc=_+1:_ A Caçadora ganha 0-2 de armadura de pele de árvore, que desaparece a cada _3 turnos_ quando o efeito de uma planta é activado na sua visão.\n\n_+2:_ A Caçadora ganha 0-2 de armadura de pele de árvore, que desaparece a cada _5 turnos_ quando o efeito de uma planta é activado na sua visão.
actors.hero.talent.natures_aid.title=ajuda da natureza
actors.hero.talent.natures_bounty.desc=+1: A Caçadora pode encontrar 4 pequenos frutos escondidos na erva alta enquanto explora os próximos andares da masmorra. +2: A Caçadora pode encontrar 6 pequenos frutos escondidos na erva alta enquanto explora os próximos andares da masmorra. As pequenas frutas são consumidas rapidamente, restauram uma pequena quantidade de saciedade e podem conter uma semente utilizável.
actors.hero.talent.natures_bounty.title=generosidade da natureza
actors.hero.talent.natures_wrath.desc=_+1:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 8% de hipóteses de ativar um efeito aleatório de planta nociva.\n\n_+2:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 17% de hipóteses de ativar um efeito aleatório de planta nociva.\n\n_+3:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 25% de hipóteses de ativar um efeito aleatório de planta nociva.\n\n_+4:_ Enquanto o poder da natureza estiver ativo, os disparos do arco espiritual têm 33% de hipóteses de ativar um efeito aleatório de planta nociva.\n\nAs plantas que podem ser ativadas são: erva-cega, flor-de-fogo, calota de gelo, musgo-da-tristeza e videira-da-tempestade.
actors.hero.talent.natures_wrath.title=a fúria da natureza
actors.hero.talent.necromancers_minions.desc=_+1:_ Quando um inimigo marcado pela alma morre, o Bruxo tem _13% de hipóteses_ de o ressuscitar como um espectro corrompido.\n\n_+2:_ Quando um inimigo marcado pela alma morre, o Bruxo tem _27% de hipóteses_ de o ressuscitar como um espectro corrompido.\n\n_+3:_ Quando um inimigo marcado pela alma morre, o O Bruxo tem _40% de hipóteses_ de o ressuscitar como um espectro corrompido.
actors.hero.talent.necromancers_minions.title=lacaios do necromante
actors.hero.talent.patient_strike.desc=_+1:_ Se a Duelista esperar antes de realizar um ataque corpo a corpo, causará _1-2 de dano bónus_.\n\n_+2:_ Se a Duelista esperar antes de realizar um ataque corpo a corpo, causará _2 de dano bónus_.
actors.hero.talent.patient_strike.title=greve dos doentes
actors.hero.talent.perfect_copy.desc=+1: O clone das sombras ganha 10% do HP máximo do herói e pode trocar de lugar instantaneamente com ele até 1 quadrado de distância. +2: O clone das sombras ganha 20% do HP máximo do herói e pode trocar de lugar instantaneamente com ele até 2 quadrados de distância. +3: O clone das sombras ganha 30% do HP máximo do herói e pode trocar de lugar instantaneamente com ele até 3 quadrados de distância. +4: O clone das sombras ganha 40% do HP máximo do herói e pode trocar de lugar instantaneamente com ele até 4 quadrados de distância.
actors.hero.talent.perfect_copy.title=cópia perfeita
actors.hero.talent.point_blank.desc=+1: Quando a Caçadora utiliza o seu arco ou uma arma de arremesso em alcance corpo a corpo, tem -25% de precisão, em vez de -50%. +2: Quando a Caçadora utiliza o seu arco ou uma arma de arremesso em alcance corpo a corpo, tem uma precisão normal, em vez de -50%. +3: Quando a Caçadora utiliza o seu arco ou uma arma de arremesso em alcance corpo a corpo, tem +25% de precisão, em vez de -50%. Note que as armas de arremesso ou o arco espiritual têm sempre +50% de precisão quando utilizadas à distância.
actors.hero.talent.point_blank.title=à queima-roupa
actors.hero.talent.precise_assault.desc=+1: Quando a Duelista utiliza uma habilidade de arma, ganha 2x de precisão no seu próximo ataque corpo a corpo no espaço de 5 turnos. +2: Quando a Duelista utiliza uma habilidade de arma, ganha 5x de precisão no seu próximo ataque corpo a corpo no espaço de 5 turnos. +3: Quando a Duelista utiliza uma habilidade de arma, ganha _precisão infinita_ no seu próximo ataque corpo a corpo no espaço de 5 turnos.
actors.hero.talent.precise_assault.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a precisão corpo a corpo em 10% no nível +1, 20% no nível +2 ou 30% no nível +3.
actors.hero.talent.precise_assault.title=ataque preciso
actors.hero.talent.projectile_momentum.desc=_+1:_ Enquanto pratica parkour, o Corredor ganha _+50% de precisão e +15% de dano_ com armas de arremesso.\n\n_+2:_ Enquanto pratica parkour, o Corredor ganha _+100% de precisão e +30% de dano_ com armas de arremesso.\n\n_+3:_ Enquanto pratica parkour, o Corredor ganha _+150% de precisão e +45% de dano_ com armas de arremesso.
actors.hero.talent.projectile_momentum.title=momento do projéctil
actors.hero.talent.projecting_blades.desc=_+1:_ As lâminas espectrais têm _+25% de precisão_ e podem penetrar até _2 blocos sólidos_.\n\n_+2:_ As lâminas espectrais têm _+50% de precisão_ e podem penetrar até _4 blocos sólidos_.\n\n_+3:_ As lâminas espectrais têm _+75% de precisão_ e podem penetrar até _6 blocos sólidos_.\n\n_+4: As lâminas espectrais têm _+100% de precisão_ e podem penetrar até _8 blocos sólidos_.
actors.hero.talent.projecting_blades.title=lâminas salientes
actors.hero.talent.protective_shadows.desc=_+1:_ O Ladino ganha um escudo _a cada dois turnos_ em que estiver invisível, _até um máximo de 3_.\n\n_+2:_ O Ladino ganha um escudo _a cada turno_ em que estiver invisível, _até um máximo de 5_.
actors.hero.talent.protective_shadows.title=sombras protetoras
actors.hero.talent.provoked_anger.desc=_+1:_ Quando qualquer escudo aplicado ao Guerreiro for quebrado por dano, o seu próximo ataque físico causará _3 de dano bónus_.\n\n_+2:_ Quando qualquer escudo aplicado ao Guerreiro for quebrado por dano, o seu próximo ataque físico causará _5 de dano bónus_.
actors.hero.talent.provoked_anger.title=provocou raiva
actors.hero.talent.ratforcements.desc=_+1:_ Usar a habilidade de transformação em rato em si mesmo _invoca 1_ rato marsupial aliado próximo a si.\n\n_+2:_ Usar a habilidade de transformação em rato em si mesmo _invoca 2_ ratos marsupiais aliados próximos a si.\n\n_+3:_ Usar a habilidade de transformação em rato em si mesmo _invoca 3_ ratos marsupiais aliados perto de si.\n\n_+4:_ Usar a habilidade de transformação em rato em si próprio _invoca 4_ ratos marsupiais aliados perto de si.
actors.hero.talent.ratforcements.title=ratforcements
actors.hero.talent.ratlomacy.desc=_+1:_ Usar a habilidade de transformar em rato num inimigo transformado em rato torna-o amigável e torna a transformação permanente.\n\n_+2:_ Usar a habilidade de transformar em rato num inimigo transformado em rato torna-o amigável, torna a transformação permanente e dá-lhe _2 turnos_ de adrenalina.\n\n_+3:_ Usar a habilidade de transformar em rato num inimigo transformado em rato torna-o amigável, torna a transformação permanente e dá-lhe _4 turnos_ de adrenalina.\n\n_+4:_ Usar a capacidade de transformar em rato num inimigo transformado em rato torna-o amigável, torna a transformação permanente e dá-lhe _6 turnos_ de adrenalina.
actors.hero.talent.ratlomacy.title=ratlomacia
actors.hero.talent.ratsistance.desc=_+1:_ Os inimigos hostis transformados em ratos causam _-10% de dano_. \n\n_+2:_ Os inimigos hostis transformados em ratos causam _-19% de dano_. \n\n_+3:_ Os inimigos hostis transformados em ratos causam _-27% de dano_.\n\n_+4:_ Os inimigos hostis transformados em ratos causam _-35% de dano_.
actors.hero.talent.ratsistance.title=ratistão
actors.hero.talent.reactive_barrier.desc=+1: O Mago ganha 2,5 de escudo por cada personagem afectada por explosão elemental, até um máximo de 5 personagens. +2: O Mago ganha 5 de escudo por cada personagem afectada por explosão elemental, até um máximo de 6 personagens. +3: O Mago ganha 7,5 de escudo por cada personagem afectada por explosão elemental, até um máximo de 7 personagens. +4: O Mago ganha 10 de escudo por cada personagem afectada por explosão elemental, até um máximo de 8 personagens.
actors.hero.talent.reactive_barrier.title=barreira reativa
actors.hero.talent.recall_inscription.desc=+1: O Clérigo pode lançar _Recuperar Inscrição_, um feitiço que permite repetir o efeito da última runa ou pergaminho utilizado até 10 turnos. +2: O Clérigo pode lançar _Recuperar Inscrição_, um feitiço que permite repetir o efeito da última runa ou pergaminho utilizado até 300 turnos. _Recuperar Inscrição_ não pode ser utilizada com pergaminhos de aperfeiçoamento. O custo de carga desta magia varia de acordo com o item utilizado recentemente: 2 para uma runa, 3 para um pergaminho e 4 para um pergaminho exótico. Este custo de carga também é duplicado quando utilizado com um pergaminho de transmutação ou itens de alquimia que precisam de ser criados utilizando transmutação ou melhoramento.
actors.hero.talent.recall_inscription.meta_desc=_Se este talento for adquirido por um herói diferente_, reembolsará qualquer pergaminho ou runa em 10% das vezes no nível +1 ou em 15% das vezes no nível +2. Os Pergaminhos de Melhoria estão isentos deste efeito.
actors.hero.talent.recall_inscription.refunded=O seu item foi reembolsado!
actors.hero.talent.recall_inscription.title=inscrição de recordação
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Quando a Caçadora pisa erva curta ou brasas, estas rebentam e transformam-se em erva alta, que a Caçadora sulca imediatamente. Isto tem um tempo de recarga de 10 turnos._+2:_ Quando a Caçadora pisa erva curta ou brasas, estas brotam e transformam-se em erva alta, que a Caçadora sulca imediatamente. Este tem um tempo de recarga de 5 turnos. _ Este talento produzirá erva sulcada se os efeitos de regeneração passiva estiverem desativados ou se o herói não tiver ganho experiência durante um longo período.
actors.hero.talent.rejuvenating_steps.title=passos rejuvenescedores
actors.hero.talent.remote_beacon.desc=_+1:_ O Mago pode colocar um farol em qualquer local dentro de _4 quadrados_.\n\n_+2:_ O Mago pode colocar um farol em qualquer local dentro de _8 quadrados_.\n\n_+3:_ O Mago pode colocar um farol em qualquer local dentro de _12 quadrados_.\n\n_+4:_ O Mago pode colocar um farol em qualquer local dentro de _16 quadrados_.\n\nO Mago não pode colocar faróis em locais inacessíveis.
actors.hero.talent.remote_beacon.title=Sinalizador remoto
actors.hero.talent.rogues_foresight.desc=_+1:_ Quando o Ladino está num nível com uma sala secreta, tem _75% de hipóteses de perceber_ que o nível contém um segredo.\n\n_+2:_ Quando o Ladino está num nível com uma sala secreta, tem _100% de hipóteses de perceber_ que o nível contém um segredo.
actors.hero.talent.rogues_foresight.title=previsão do malandro
actors.hero.talent.runic_transference.desc=_+1:_ O selo quebrado do Guerreiro pode transferir _glifos regulares_ da mesma forma que transfere uma melhoria.\n\n_+2:_ O selo quebrado do Guerreiro pode transferir _glifos regulares, poderosos e amaldiçoados_ da mesma forma que transfere uma melhoria.\n\nO selo só pode transferir glifos se estes já estivessem aplicados à armadura quando o selo foi anexado.
actors.hero.talent.runic_transference.meta_desc=_Se este talento for adquirido por um herói diferente_, ajudará os glifos da sua armadura a resistir à remoção por pergaminhos de melhoramento. Os glifos começarão a ser perdidos ao melhorar a partir do nível 6 (antes era 4) com +1, ou do nível 7 (antes era 4) com +2. O nível a que a perda de glifos é garantida permanece inalterado em +8.
actors.hero.talent.runic_transference.title=transferência rúnica
actors.hero.talent.satiated_spells.desc=+1: Comer faz com que o Clérigo ganhe 3 de escudo da próxima vez que lançar uma magia. +2: Comer faz com que o Clérigo ganhe 5 de escudo da próxima vez que lançar uma magia.
actors.hero.talent.satiated_spells.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá proteção imediatamente, que começará a decair normalmente após 10 turnos.
actors.hero.talent.satiated_spells.title=Feitiços de Saciação
actors.hero.talent.scholars_intuition.desc=_+1:_ O Mago identifica as varinhas _3x mais rápido_.\n\n_+2:_ O Mago identifica as varinhas _quando as utiliza_.
actors.hero.talent.scholars_intuition.title=intuição do académico
actors.hero.talent.searing_light.desc=+1: Os ataques físicos do Clérigo contra inimigos iluminados por Luz Guia causam +3 de dano. +2: Os ataques físicos do Clérigo contra inimigos iluminados por Luz Guia causam +5 de dano.
actors.hero.talent.searing_light.meta_desc=_Se este talento for adquirido por um herói diferente_, concederá o seu dano bónus após a utilização de uma varinha ou artefacto num inimigo, com um tempo de recarga de 20 turnos.
actors.hero.talent.searing_light.title=Luz escaldante
actors.hero.talent.seer_shot.desc=_+1:_ Quando a Caçadora dispara uma flecha para o chão, concede visão numa área de 3x3 à sua volta durante _5 turnos_. Isto tem um tempo de recarga de 20 turnos.\n\n_+2:_ Quando a Caçadora dispara uma flecha para o chão, concede visão numa área de 3x3 à sua volta durante _10 turnos_. Isto tem um tempo de recarga de 20 turnos.\n\n_+3:_ Quando a Caçadora dispara uma flecha para o chão, concede visão numa área de 3x3 à sua volta durante _15 turnos_. Este tem um tempo de recarga de 20 turnos.
actors.hero.talent.seer_shot.meta_desc=_Se este talento for adquirido por um herói diferente_, será ativado por qualquer arma lançada.
actors.hero.talent.seer_shot.title=tiro vidente
actors.hero.talent.shadow_blade.desc=+1: O clone das sombras ganha 8% do dano do herói por turno e tem 25% de hipóteses de usar o encantamento na arma do herói. +2: O clone das sombras ganha 16% do dano do herói por turno e tem 50% de hipóteses de usar o encantamento na arma do herói. +3: O clone das sombras ganha 24% do dano do herói por turno e tem 75% de hipóteses de usar o encantamento na arma do herói. +4: O clone das sombras ganha 32% do dano do herói por turno e tem 100% de hipóteses de usar o encantamento na arma do herói.
actors.hero.talent.shadow_blade.title=lâmina sombria
actors.hero.talent.shadow_step.desc=+1: Se o ladino utilizar a bomba de fumo enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 16%, mas também não cega os inimigos nem activa outros talentos. +2: Se o ladino utilizar a bomba de fumo enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 30%, mas também não cega os inimigos nem activa outros talentos. +3: Se o ladino utilizar a bomba de fumo enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 41%, mas também não cega os inimigos nem activa outros talentos. +4: Se o ladino utilizar a bomba de fumo enquanto invisível, o efeito é instantâneo e tem um custo de carga reduzido em 50%, mas também não cega os inimigos nem activa outros talentos.
actors.hero.talent.shadow_step.title=passo de sombra
actors.hero.talent.shared_enchantment.desc=+1: As armas de arremesso têm 33% de hipóteses de usar o encantamento no arco do Atirador. +2: As armas de arremesso têm 67% de hipóteses de usar o encantamento no arco do Atirador. +3: As armas de arremesso têm 100% de hipóteses de usar o encantamento no arco do Atirador. O encantamento do arco pode ser ativado em conjunto com qualquer encantamento que a arma de arremesso já possua.
actors.hero.talent.shared_enchantment.title=encantamento partilhado
actors.hero.talent.shared_upgrades.desc=+1: Quando a Atiradora ataca com uma arma de arremesso melhorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano do seu ataque especial em 16%, até um máximo de 2 turnos e +33% de dano em +2. +2: Quando a Atiradora ataca com uma arma de arremesso melhorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano do seu ataque especial em 16%, até um máximo de 4 turnos e +67% de dano em +4. +3: Quando a Atiradora ataca com uma arma de arremesso melhorada, cada nível aumenta a duração da marca da atiradora em 1 turno e o dano do seu ataque especial em 16%, até um máximo de 6 turnos e +100% de dano em +6.
actors.hero.talent.shared_upgrades.title=atualizações partilhadas
actors.hero.talent.shield_battery.desc=_+1:_ O Mago pode utilizar uma varinha em si próprio para converter todas as suas cargas em escudo a uma taxa de _4% do HP máximo por carga_.\n\n_+2:_ O Mago pode utilizar uma varinha em si próprio para converter todas as suas cargas em escudo a uma taxa de _6% do HP máximo por carga_.
actors.hero.talent.shield_battery.title=bateria de blindagem
actors.hero.talent.shield_of_light.desc=+1: O Clérigo pode lançar Escudo de Luz, um feitiço instantâneo que concede 2 a 4 de armadura contra um alvo durante 5 turnos com o custo de 1 carga. +2: O Clérigo pode lançar Escudo de Luz, um feitiço instantâneo que concede 3 a 6 de armadura contra um alvo durante 5 turnos com o custo de 1 carga.
actors.hero.talent.shield_of_light.meta_desc=_Se este talento for adquirido por um herói diferente_, reduzirá o dano físico recebido do inimigo alvo em 1, 33% das vezes no nível +1 ou 50% das vezes no nível +2.
actors.hero.talent.shield_of_light.title=escudo de luz
actors.hero.talent.shielding_dew.desc=_+1:_ As gotas de orvalho podem proteger a Guardiã quando a sua saúde estiver completa, até _20% do seu HP máximo_.\n\n_+2:_ As gotas de orvalho podem proteger a Guardiã quando a sua saúde estiver completa, até _40% do seu HP máximo_.\n\n_+3:_ As gotas de orvalho podem proteger a Guardiã quando a sua saúde estiver completa, até _60% do seu HP máximo_.
actors.hero.talent.shielding_dew.title=orvalho protetor
actors.hero.talent.shock_force.desc=_+1:_ Onda de choque causa _20% mais de dano_ e tem _25% de hipóteses_ de atordoar em vez de incapacitar.\n\n_+2:_ Onda de choque causa _40% mais de dano_ e tem _50% de hipóteses_ de atordoar em vez de incapacitar.\n\n_+3:_ Onda de choque causa _60% mais dano_ e tem _75% de hipóteses_ de atordoar em vez de incapacitar.\n\n_+4:_ Onda de choque causa mais _80% de dano_ e tem _100% de hipóteses_ de atordoar em vez de incapacitar.
actors.hero.talent.shock_force.title=força de choque
actors.hero.talent.shrug_it_off.desc=_+1:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 60%_, de 50%.\n\n_+2:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 68%_, de 50%.\n\n_+3:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 74%_, de 50%.\n\n_+4:_ A redução de dano do Guerreiro enquanto resiste é _aumentada para 80%_, de 50%.
actors.hero.talent.shrug_it_off.title=dar de ombros
actors.hero.talent.silent_steps.desc=_+1:_ O Ladino não acordará os inimigos adormecidos enquanto estiver a _3 ou mais quadrados de distância deles_.\n\n_+2:_ O Ladino não acordará os inimigos adormecidos enquanto não estiver adjacente a eles.
actors.hero.talent.silent_steps.title=passos silenciosos
actors.hero.talent.soul_eater.desc=+1: A marca da alma concede 0,33 turnos de saciedade por cada dano físico causado. Os inimigos marcados pela alma têm 10% de hipóteses de ativar efeitos quando são consumidos quando morrem. +2: A marca da alma concede 0,67 turnos de saciedade por cada dano físico causado. Os inimigos marcados pela alma têm 20% de hipóteses de ativar efeitos quando são consumidos quando morrem. +3: A marca da alma concede 1 turno de saciedade por cada dano físico causado. Os inimigos marcados pela alma têm 30% de hipóteses de ativar efeitos quando são consumidos quando morrem.
actors.hero.talent.soul_eater.title=devorador de almas
actors.hero.talent.soul_siphon.desc=_+1:_ Dano físico causado por outras personagens activa a marca da alma do Bruxo com _13% de eficácia_.\n\n_+2:_ Dano físico causado por outras personagens activa a marca da alma do Bruxo com _27% de eficácia_.\n\n_+3:_ Dano físico causado por outras personagens activa a marca da alma do Bruxo com _40% de eficácia_.
actors.hero.talent.soul_siphon.title=sifão de almas
actors.hero.talent.speedy_stealth.desc=_+1:_ O Corredor Livre ganha 2 acumulações de impulso por turno enquanto estiver invisível.\n\n_+2:_ Para além dos benefícios de +1, o Corredor Livre já não conta enquanto estiver invisível.\n\n_+3:_ Para além dos benefícios de +1 e +2, o Corredor Livre move-se com uma velocidade 2x maior enquanto invisível, independentemente de estar a praticar Corredor Livre ou não.
actors.hero.talent.speedy_stealth.title=furtividade rápida
actors.hero.talent.spirit_blades.desc=+1: As Lâminas Espectrais têm 30% de hipóteses de também usar o encantamento no arco espiritual. +2: As Lâminas Espectrais têm 60% de hipóteses de também usar o encantamento no arco espiritual. +3: As Lâminas Espectrais têm 90% de hipóteses de também usar o encantamento no arco espiritual. +4: As Lâminas Espectrais têm 100% de hipóteses de também utilizar o encantamento no arco espiritual e concedem +10% de poder a cada encantamento.
actors.hero.talent.spirit_blades.title=lâminas espirituais
actors.hero.talent.spirit_form.desc=O Clérigo pode conjurar _Forma Espiritual_, que imbuirá Trinity com o poder de um anel ou artefacto que o Clérigo tenha identificado nesta ronda (excepto o tomo sagrado), com um custo de 4 cargas. \n\n_+1:_ Quando Trinity for utilizada, o Clérigo ganhará o efeito de um anel em _+1_ durante 20 turnos, ou activará o efeito de um artefacto em _+4_. \n\n_+2:_ Quando Trinity for utilizada, o Clérigo ganhará o efeito de um anel em _+2_ durante 20 turnos, ou activará o efeito de um artefacto em _+6_. \n\n_+3:_ Quando Trinity for utilizada, o Clérigo ganhará o efeito de um anel em _+3_ durante 20 turnos, ou activará o efeito de um artefacto em _+8. _\n\n_+4:_ Quando Trindade é utilizada, o Clérigo ganha o efeito de um anel em _+4_ durante 20 turnos, ou activa o efeito de um artefacto em _+10. _\n\n. A Trindade só pode ser imbuída com um efeito espiritual de cada vez. Os artefactos têm efeitos e custos de carga de armadura variados quando ativados por Trindade.
actors.hero.talent.spirit_form.title=forma espiritual
actors.hero.talent.stasis.desc=O Clérigo pode conjurar _Estase_ num aliado fortalecido com o custo de 2 cargas. Estase remove temporariamente o aliado da masmorra e preserva o tempo restante de todos os buffs, incluindo o Poder de Muitos. O aliado reaparecerá ao teu lado quando o efeito terminar. A estase pode ser conjurada novamente instantaneamente e sem custos para terminar o efeito antecipadamente. A Estase funciona em aliados imóveis, mas não pode movê-los entre os andares da masmorra. ZXQPH0 ZXQ ZXQPH1 ZXQ_+1: A Estase dura no máximo 60 turnos. ZXQPH2 ZXQ ZXQPH3 ZXQ_+2: A Estase dura no máximo 90 turnos. ZXQPH4 ZXQ ZXQPH5 ZXQ_+3: A Estase dura no máximo 120 turnos. ZXQPH6 ZXQ ZXQPH7 ZXQ_+4: A Estase dura no máximo 150 turnos. ZXQPH8 ZXQ ZXQPH9 ZXQ O Clérigo pode também lançar Raio Radiante quando um aliado está em Estase para o invocar novamente, ou lançar Vínculo Vital para aplicar o seu efeito preventivamente. No entanto, os aliados não beneficiam do Vínculo Vital enquanto estiverem em Estase.
actors.hero.talent.stasis.title=estase
actors.hero.talent.strengthening_meal.desc=_+1:_ Comer concede ao Duelista 3 pontos de dano bónus nas próximas _2 vezes_ que atingir um inimigo com um ataque físico.\n\n_+2:_ Comer concede ao Duelista 3 pontos de dano bónus nas próximas _3 vezes_ que atingir um inimigo com um ataque físico.
actors.hero.talent.strengthening_meal.title=refeição fortalecedora
actors.hero.talent.striking_force.desc=_+1:_ O poder do efeito do golpe elemental é aumentado em _30%_.\n\n_+2:_ O poder do efeito do golpe elemental é aumentado em _60%_.\n\n_+3:_ O poder do efeito do golpe elemental é aumentado em _90%_.\n\n_+4:_ O poder do efeito do golpe elemental é aumentado em _120%_.
actors.hero.talent.striking_force.title=força de ataque
actors.hero.talent.striking_wave.desc=_+1:_ A Onda de Choque tem _30% de hipóteses_ de também utilizar efeitos de acerto, como encantamentos e combos.\n\n_+2:_ A Onda de Choque tem _60% de hipóteses_ de também utilizar efeitos de acerto, como encantamentos e combos.\n\n_+3:_ A Onda de Choque tem _90% de hipóteses_ de também utilizar efeitos de acerto, como encantamentos e combos.\n\n_+4:_ Onda de Choque tem _100% de hipóteses_ de também utilizar efeitos de acerto, como encantamentos e combos, e concede _+20% de poder_ aos encantamentos.
actors.hero.talent.striking_wave.title=onda impressionante
actors.hero.talent.strongman.desc=+1: A força do Guerreiro aumenta 8%, arredondado para baixo. +2: A força do Guerreiro aumenta 13%, arredondado para baixo. +3: A força do Guerreiro aumenta em 18%, arredondado para baixo.
actors.hero.talent.strongman.title=homem forte
actors.hero.talent.sucker_punch.desc=_+1:_ O Ladino causa _1-2 de dano bónus_ na primeira vez que ataca um inimigo de surpresa.\n\n_+2:_ O Ladino causa _2 de dano bónus_ na primeira vez que ataca um inimigo de surpresa.
actors.hero.talent.sucker_punch.title=golaço
actors.hero.talent.sunray.desc=+1: O Clérigo pode lançar Raio Solar, um feitiço que causa 4 a 8 de dano e cega o alvo durante 4 turnos, com um custo de 1 carga. +2: O Clérigo pode lançar Raio Solar, um feitiço que causa 6 a 12 de dano e cega o alvo durante 6 turnos, com um custo de 1 carga. O Raio Solar só pode cegar cada alvo uma vez, mas se o alvo já estiver cego pelo Raio Solar, paralisa-o. O Raio Solar causa sempre o máximo dano a inimigos demoníacos e mortos-vivos.
actors.hero.talent.sunray.meta_desc=_Se este talento for adquirido por um herói diferente_, fará com que varinhas e artefactos ceguem os inimigos durante 4 turnos, 15% das vezes no nível +1 ou 25% das vezes no nível +2.
actors.hero.talent.sunray.title=raio de sol
actors.hero.talent.survivalists_intuition.desc=_+1:_ A Caçadora identifica as armas lançadas 3 vezes mais rápido.\n\n_+2:_ A Caçadora identifica as armas lançadas quando as atinge.
actors.hero.talent.survivalists_intuition.title=intuição de sobrevivencialista
actors.hero.talent.sustained_retribution.desc=+1: O Guerreiro causa 115% de dano bónus distribuído por 2 golpes, em vez de 100% de dano bónus em 1 golpe. +2: O Guerreiro causa 130% de dano bónus distribuído por 3 golpes, em vez de 100% de dano bónus em 1 golpe. +3: O Guerreiro causa 145% de dano bónus distribuído por 4 golpes, em vez de 100% de dano bónus em 1 golpe. +4: O Guerreiro causa 160% de dano bónus distribuído por 5 golpes, em vez de 100% de dano bónus em 1 golpe.
actors.hero.talent.sustained_retribution.title=retribuição sustentada
actors.hero.talent.swift_equip.desc=_+1:_ A Duelista pode trocar a sua arma equipada instantaneamente _uma vez_ a cada 20 turnos.\n\n_+2:_ A Duelista pode trocar a sua arma equipada instantaneamente _duas vezes_ a cada 20 turnos.\n\nSe a Duelista possuir este talento e este não estiver em recarga, utilizar rapidamente uma arma não equipada irá equipá-la.
actors.hero.talent.swift_equip.title=equipar rapidamente
actors.hero.talent.swift_spirit.desc=+1: A velocidade de movimento do falcão espiritual aumenta de 2 para 2,5 quadrados e é garantido que se esquiva dos primeiros 2 ataques recebidos. +2: A velocidade de movimento do falcão espiritual aumenta de 2 para 3 quadrados e é garantido que se esquiva dos primeiros 4 ataques recebidos. +3: A velocidade de movimento do falcão espiritual aumenta de 2 para 3,5 quadrados e é garantido que se esquiva dos primeiros 6 ataques recebidos. +4: A velocidade de movimento do falcão espiritual aumenta de 2 para 4 quadrados e é garantido que se esquiva dos primeiros 8 ataques recebidos.
actors.hero.talent.swift_spirit.title=espírito veloz
actors.hero.talent.telefrag.desc=+1: Se o Mago se teletransportar para outra personagem, causa-lhe 10 a 15 de dano, mas também recebe 5 de dano. +2: Se o Mago se teletransportar para outra personagem, causa-lhe 20 a 30 de dano, mas também recebe 10 de dano. +3: Se o Mago se teletransportar para outra personagem, causa-lhe 30 a 45 de dano, mas também recebe 15 de dano. +4: Se o Mago se teletransportar para outra personagem, causa-lhe 40 a 60 de dano, mas também recebe 20 de dano. O herói não pode ser morto por este talento; o dano recebido pode ser reduzido por efeitos de resistência mágica.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ O Ladino identifica anéis _2x mais rápido_ e identifica o tipo de um anel _quando o equipa_.\n\n_+2:_ O Ladino identifica anéis _quando os equipa_ e identifica o tipo de um anel _quando o apanha_.
actors.hero.talent.thiefs_intuition.title=intuição de ladrão
actors.hero.talent.twin_upgrades.desc=_+1:_ Se uma das duas armas equipadas do Campeão tiver um nível inferior e estiver _2 ou mais níveis abaixo_ da outra arma, será melhorada para o nível da outra arma.\n\n_+2:_ Se uma das duas armas equipadas do Campeão tiver um nível inferior e estiver _1 ou mais níveis abaixo_ da outra arma, será melhorada para o nível da outra arma.\n\n_+3:_ Se uma das duas armas equipadas do Campeão tiver um nível inferior e for _do mesmo nível ou inferior_ à outra arma, será melhorada para o nível da outra arma.
actors.hero.talent.twin_upgrades.title=atualizações gêmeas
actors.hero.talent.unencumbered_spirit.desc=+1: A Monja ganha mais 50% de energia por cada peça de equipamento de nível 3 ou inferior que esteja a utilizar. +2: A Monja ganha mais 75% de energia por cada peça de equipamento de nível 2 ou inferior que esteja a utilizar. O benefício de nível 3 mantém-se inalterado. +3: A Monja ganha mais 100% de energia por cada peça de equipamento de nível 1 ou inferior que esteja a utilizar. Os benefícios dos níveis 2 e 3 mantêm-se inalterados. Ela também recebe uma armadura de tecido e luvas tachonadas gratuitas. Note que este talento não oferece qualquer benefício por estar desarmada ou atacar com um Anel da Força.
actors.hero.talent.unencumbered_spirit.title=espírito livre
actors.hero.talent.varied_charge.desc=_+1:_ A Campeã recupera instantaneamente _0,17 cargas de arma_ ao utilizar duas habilidades de arma diferentes, sem limite de tempo.\n\n_+2:_ A Campeã recupera instantaneamente _0,33 cargas de arma_ ao utilizar duas habilidades de arma diferentes, sem limite de tempo.\n\n_+3:_ A Campeã recupera instantaneamente _0,5 cargas de arma_ quando se utilizam duas habilidades de arma diferentes, sem limite de tempo.
actors.hero.talent.varied_charge.title=carga variável
actors.hero.talent.veterans_intuition.desc=_+1:_ O Guerreiro identifica armas _1,75x mais rápido_ e armaduras _2,5x mais rápido_.\n\n_+2:_ O Guerreiro identifica armas _2,5x mais rápido_ e armaduras _quando as equipa_.
actors.hero.talent.veterans_intuition.title=intuição de veterano
actors.hero.talent.wall_of_light.desc=+1: O Paladino pode lançar _Muralha de Luz_, um feitiço que cria uma parede sólida de _3 quadrados de largura_ à sua frente, que repele os inimigos e dura 20 turnos, com o custo de 3 cargas. +2: O Paladino pode lançar _Muralha de Luz_, um feitiço que cria uma parede sólida de _5 quadrados de largura_ à sua frente, que repele os inimigos e dura 20 turnos, com o custo de 3 cargas. +3: O Paladino pode lançar _Muralha de Luz_, um feitiço que cria uma parede sólida de _7 quadrados de largura_ à sua frente, que repele os inimigos e dura 20 turnos, com o custo de 3 cargas. A parede pode ser posicionada na horizontal ou na diagonal, podendo existir apenas uma parede em cada ponto. tempo.
actors.hero.talent.wall_of_light.title=parede de luz
actors.hero.talent.wand_preservation.desc=+1: Quando o Mago imbui uma nova varinha no seu bastão, a varinha antiga regressa com +0, mas isto só pode ser feito uma vez. +2: Quando o Mago imbui uma nova varinha no seu bastão, a varinha antiga regressa com +0. Isto pode ser repetido com um tempo de espera de um nível de herói.
actors.hero.talent.wand_preservation.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará a quantidade de resina arcana obtida ao colocar uma varinha num caldeirão de alquimia em 1 no nível +1, ou em 2 no nível +2.
actors.hero.talent.wand_preservation.title=preservação de varinhas
actors.hero.talent.weapon_recharging.desc=_+1:_ O Duelista ganha uma carga de arma a cada _15 turnos_ quando sob o efeito de buffs de recarga de varinha ou artefacto.\n\n_+2:_ O Duelista ganha uma carga de arma a cada _10 turnos_ quando sob o efeito de buffs de recarga de varinha ou artefacto.
actors.hero.talent.weapon_recharging.meta_desc=_Se este talento for adquirido por um herói diferente_, causará +5% de dano corpo a corpo enquanto recarrega em +1, ou +7,5% de dano corpo a corpo enquanto recarrega em +2.
actors.hero.talent.weapon_recharging.title=recarga de armas
actors.hero.talent.wide_search.desc=_+1:_ O raio de pesquisa do Ladino é aumentado de um quadrado 5x5 para um círculo 7x7.\n\n_+2:_ O raio de pesquisa do Ladino é aumentado de um quadrado 5x5 para um quadrado 7x7.
actors.hero.talent.wide_search.meta_desc=_Se este talento for adquirido por um herói diferente_, aumentará o seu raio de pesquisa de um quadrado 3x3 para um círculo 5x5 em +1, ou um quadrado 5x5 em +2.
actors.hero.talent.wide_search.title=busca ampla
actors.hero.talent.wild_momentum.desc=+1: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 1 turno. A duração pode ser prolongada num máximo de 2 turnos. +2: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 2 turnos. A duração pode ser prolongada num máximo de 4 turnos. +3: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 3 turnos. A duração pode ser prolongada num máximo de 6 turnos. +4: Matar um inimigo com o arco espiritual prolonga a duração do poder da natureza em 4 turnos. A duração pode ser prolongada num máximo de 8 turnos.
actors.hero.talent.wild_momentum.title=impulso selvagem
actors.hero.talent.wild_power.desc=_+1:_ Quando utilizar magia selvagem, as varinhas serão melhoradas em _2 ou 3, até +4_.\n\n_+2:_ Quando utilizar magia selvagem, as varinhas serão melhoradas em _3, até +5_.\n\n_+3:_ Quando utilizar magia selvagem, as varinhas serão melhoradas em _3 ou 4, até +6_.\n\n_+4:_ Quando utilizar magia selvagem, as varinhas serão melhoradas em _4, até +7_.
actors.hero.talent.wild_power.title=poder selvagem
actors.mobs.acidic.desc=Estas enormes criaturas demoníacas, semelhantes a aracnídeos, evitam o combate corpo a corpo, preferindo disparar espinhos serrilhados incapacitantes a longas distâncias. Esta parece estar a pingar um líquido corrosivo.
actors.mobs.acidic.name=escorpião ácido
actors.mobs.albino.desc=Esta é uma raça rara de rato marsupial, com pelagem totalmente branca e dentes serrados.
actors.mobs.albino.discover_hint=Raramente encontrará este inimigo numa região específica da masmorra.
actors.mobs.albino.name=rato albino
actors.mobs.armoredbrute.desc=Os brutos gnolls mais experientes costumam usar armaduras poderosas para demonstrar o seu estatuto. A armadura torna estes brutos muito mais resistentes a danos físicos, e a sua maior disciplina significa que podem entrar em fúria durante muito mais tempo antes de sucumbirem aos ferimentos.
actors.mobs.armoredbrute.name=bruto blindado
actors.mobs.armoredstatue.desc=Poderia pensar que é apenas mais uma das estátuas inanimadas desta masmorra, mas os seus olhos vermelhos brilhantes denunciam-na. Parece estar em ótimas condições por causa da armadura que veste; pode ser muito difícil de matar.
actors.mobs.armoredstatue.desc_arm_wep=Embora a estátua em si seja feita de pedra, os _%1$s_ e _%2$s_ que empunha parecem reais.
actors.mobs.armoredstatue.name=estátua blindada
actors.mobs.bandit.desc=Os níveis mais profundos da masmorra sempre serviram de esconderijo para todo o tipo de criminosos. Nem todos conseguiam manter a lucidez durante os longos períodos em que permaneciam tão longe da luz do dia. Há muito tempo, estes ladrões e bandidos insanos esqueceram-se de quem eram e porque roubavam.
actors.mobs.bandit.name=bandido louco
actors.mobs.bat.desc=Estes ágeis e tenazes habitantes das cavernas são muito mais perigosos do que aparentam. Recuperam a saúde a cada ataque bem sucedido, o que lhes permite derrotar adversários muito maiores.
actors.mobs.bat.name=morcego vampiro
actors.mobs.bee.desc=Apesar do seu pequeno tamanho, as abelhas douradas tendem a proteger ferozmente o seu ninho. Esta aqui está muito zangada, é melhor manter a distância.
actors.mobs.bee.desc_honey=Apesar do seu pequeno tamanho, as abelhas douradas tendem a proteger ferozmente o seu ninho. Esta já foi apaziguada e parece querer segui-lo.
actors.mobs.bee.discover_hint=Podes encontrar esse personagem com um item específico.
actors.mobs.bee.name=abelha dourada
actors.mobs.brute$bruterage.desc=Este bruto gnoll está a morrer, mas quer levá-lo junto! O bruto morrerá quando o seu escudo se esgotar, seja por tempo ou por dano. Enquanto isso, causará um dano muito maior, por isso tem cuidado! Escudo restante:
actors.mobs.brute$bruterage.name=fúria bruta
actors.mobs.brute.def_verb=bloqueado
actors.mobs.brute.desc=Os brutos são os maiores, mais fortes e mais resistentes de todos os gnolls. Quando ficam gravemente feridos, entram em fúria e causam ainda mais dano aos inimigos.
actors.mobs.brute.enraged=enfurecido
actors.mobs.brute.name=bruto gnoll
actors.mobs.causticslime.desc=Esta gosma parece ter sido contaminada pela magia negra que emana de baixo. Perdeu a sua cor verde habitual e goteja um líquido cáustico.
actors.mobs.causticslime.discover_hint=Raramente encontrará este inimigo numa região específica da masmorra.
actors.mobs.causticslime.name=lodo cáustico
actors.mobs.crab.desc=Estes enormes caranguejos estão no topo da cadeia alimentar nos esgotos. São extremamente rápidos e a sua carapaça grossa pode suportar golpes fortes.
actors.mobs.crab.name=caranguejo de esgoto
actors.mobs.crystalguardian.def_verb=bloqueado
actors.mobs.crystalguardian.desc=Estes grandes guardiões cristalinos quase parecem estátuas, não fossem os seus olhos brilhantes e luminosos. O cristal endurecido de que são feitos torna-os lentos, mas muito resistentes, por isso é melhor deixá-los dormir no seu ninho de cristal durante o maior tempo possível. Devido ao seu tamanho, os guardiões de cristal movem-se muito mais lentamente em espaços fechados. São também tão resistentes que é impossível matá-los de vez. Podem ser derrotados e temporariamente incapacitados, mas voltam a levantar-se passado algum tempo.
actors.mobs.crystalguardian.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.crystalguardian.name=guardião de cristal
actors.mobs.crystalmimic.ate=O imitador comeu o seu %s!
actors.mobs.crystalmimic.desc=Os mimos são criaturas mágicas que podem assumir a forma que desejarem. Nas masmorras, escolhem quase sempre a forma de um baú de tesouro para atrair aventureiros incautos. Os mimos de cristal são mais ardilosos do que os seus primos comuns e preferem evitar conflitos enquanto roubam tesouros. Tentarão fugir a correr assim que forem descobertos e têm a capacidade de reposicionar os inimigos quando atacam.
actors.mobs.crystalmimic.escaped=O imitador de cristais escapou!
actors.mobs.crystalmimic.name=imitação de cristal
actors.mobs.crystalspire.alert=A vibração cresce e ressoa por toda a gruta!
actors.mobs.crystalspire.desc=Esta gigantesca torre de cristal ultra-resistente é provavelmente a fonte de todas as estranhas criaturas cristalinas desta gruta. As suas armas comuns são ineficazes contra ela, pelo que terás de usar a tua picareta se quiseres destruí-la. Certifique-se de que está preparado antes de começar a parti-la. Um cristal tão grande provavelmente levará algum tempo a ser minerado, e provavelmente não conseguirá fazê-lo sem ser incomodado. A própria torre pode até ter algum meio de se defender. Talvez os próprios ataques da torre possam ser utilizados contra os seus lacaios.
actors.mobs.crystalspire.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.crystalspire.name=torre de cristal
actors.mobs.crystalspire.warning=O cristal vibra quando o golpeia. Continuar a fazê-lo certamente chamará a atenção para si...
actors.mobs.crystalwisp.beam_kill=O feixe de luz matou-te...
actors.mobs.crystalwisp.desc=Um pequeno pedaço flutuante e furioso de cristal endurecido que emite um brilho intenso. Embora não sejam particularmente fortes, os filamentos de cristal podem disparar um feixe de luz prejudicial se tiverem uma linha de visão desimpedida. Os filamentos são suficientemente pequenos para se moverem facilmente entre as diversas formações de cristais, mas não conseguem atravessá-las.
actors.mobs.crystalwisp.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.crystalwisp.name=fio de cristal
actors.mobs.demonspawner.desc=Esta amálgama retorcida de carne anã é responsável pela criação de demónios estripadores a partir dos anões que morreram nesta região. Claramente, os demónios não vêem qualquer problema em utilizar todos os recursos disponíveis contra os seus inimigos. Embora visualmente aterradores, os geradores de demónios não têm meios de se mover ou defender diretamente. A sua massa considerável, no entanto, dificulta a sua eliminação rápida, e gerarão demónios estripadores mais rapidamente quando estiverem sob ameaça. Os geradores de demónios parecem estar ligados a alguma fonte central de poder demoníaco. Matá-los pode enfraquecê-la.
actors.mobs.demonspawner.name=gerador de demónios
actors.mobs.demonspawner.on_death=A energia demoníaca aqui parece diminuir à medida que o gerador morre.
actors.mobs.dm100.desc=O DM-100 é um modelo antigo de "máquina de defesa" anã, concebido para proteger os mineiros anões nas grutas por baixo desta prisão. Os seus choques eléctricos, no entanto, revelaram-se muito fracos, e por isso foram doados à cidade humana acima. Permaneceram sem uso durante anos e acabaram por chegar à prisão, onde o carcereiro os considerou inicialmente demasiado cruéis para serem utilizados. Contudo, à medida que os prisioneiros se tornaram mais indisciplinados, tornaram-se uma necessidade.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=O raio matou-te...
actors.mobs.dm200.desc=O DM-200 é a segunda geração de "máquina de defesa" anã, concebida para proteger os mineiros anões nas grutas e na cidade subterrânea. São muito maiores e mais robustos que os seus antecessores, e atacam com punhos hidráulicos devastadores. O seu tamanho avantajado é também a sua principal fraqueza, pois não conseguem passar pelos túneis e entradas estreitas da masmorra. Os anões conseguiram compensar a falta de mobilidade do DM-200 permitindo-lhe libertar os seus gases tóxicos contra inimigos distantes ou fora do seu alcance.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=O DM-200 dispara um jato de gases tóxicos!
actors.mobs.dm201.desc=Os anões experimentaram brevemente enfatizar mais a falta de mobilidade do DM-200 e criaram alguns modelos DM completamente estacionários. O DM-201 é um DM-200 modernizado que funciona como uma torre de sentinela sem capacidade de movimento. Em troca da falta de mobilidade, os DM-201 têm uma durabilidade e um poder de ataque significativamente mais elevados. Como os DM-201 não têm motor para expelir os gases de escape, os anões equiparam-nos com granadas de gás corrosivo! Os DM-201 são cautelosos com estas granadas, no entanto, e só as lançam quando atacados à distância.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=O DM-201 lança uma granada corrosiva!
actors.mobs.dm300.charge_lost=Torre de transmissão destruída! Regressando à energia local!
actors.mobs.dm300.charging=SOFRENDO DANOS! ATIVANDO O TORRE DE ENERGIA!
actors.mobs.dm300.charging_hint=O DM-300 é invulnerável enquanto estiver a ser energizado por um pilar!
actors.mobs.dm300.def_verb=bloqueado
actors.mobs.dm300.defeated=DANO CRÍTICO! TENTANDO DESLIGAR-
actors.mobs.dm300.desc=Esta máquina foi construída pelos anões há vários séculos. Mais tarde, começaram a substituir as máquinas por golens, elementais e até demónios, o que acabou por levar a sua civilização ao declínio. O DM-300 e máquinas semelhantes eram usados na construção e nas minas, e por vezes na defesa das cidades.
actors.mobs.dm300.desc_supercharged=O DM-300 está atualmente totalmente carregado com energia elétrica. Nesta forma, o DM-300 é indestrutível e move-se com o dobro da velocidade! Além disso, a sua broca gira agora suficientemente rápido para perfurar rocha sólida, embora se mova muito mais lentamente ao fazê-lo. Atacar o DM-300 directamente é inútil enquanto estiver sobrecarregado, mas algo na área deve estar a fornecer-lhe essa energia; destruir isso pode enfraquecê-lo.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=PESSOAL NÃO AUTORIZADO DETECTADO!
actors.mobs.dm300.pylons_destroyed=ALERTA! INSTABILIDADE DETECTADA NA REDE ELÉTRICA!
actors.mobs.dm300.rankings_desc=Esmagado pelo DM-300
actors.mobs.dm300.shield=O DM-300 extrai energia dos fios expostos e blinda-se!
actors.mobs.dm300.supercharged=DESTRUIR! DESTRUIR! DESTRUIR!
actors.mobs.dwarfking$dkghoul.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking$dkgolem.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking$dkmonk.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking$dkwarlock.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking.defeated=Você... condenou-nos a todos...
actors.mobs.dwarfking.desc=Há muitos anos, um dos mais poderosos magos da corte anã descobriu segredos que lhe conferiram um imenso poder sobre a vida e a morte. Cedo pôs em prática esse poder, subjugando e corrompendo os seus pares, o seu rei e, por fim, todos os cidadãos anões. Agora é rei, governante de uma legião de súbditos mortos-vivos. O Rei dos Anões é um inimigo agressivo, que tentará cercar e subjugar os seus adversários com a sua horda de lacaios mortos-vivos.
actors.mobs.dwarfking.enraged=Não me podes matar %s. I. AM. IMORTAL!
actors.mobs.dwarfking.lifelink_1=Preciso da tua essência, escravo!
actors.mobs.dwarfking.lifelink_2=Sangre por mim, escravo!
actors.mobs.dwarfking.losing=Não! Não pode fazer isso... não faz ideia do que está lá em baixo...
actors.mobs.dwarfking.name=Rei dos Anões
actors.mobs.dwarfking.notice=Como se atreve! Não faz ideia do que se está a meter!
actors.mobs.dwarfking.rankings_desc=Caiu diante do Rei dos Anões
actors.mobs.dwarfking.teleport_1=Dê-lhes um jeito, escravo!
actors.mobs.dwarfking.teleport_2=Mantenha-os ocupados, escravo!
actors.mobs.dwarfking.wave_1=Basta! Levantem-se, meus escravos!
actors.mobs.dwarfking.wave_2=Mais! Sangre pelo seu rei!
actors.mobs.dwarfking.wave_3=Inúteis! MATEM-NOS JÁ!
actors.mobs.ebonymimic.desc=Os mimos são criaturas mágicas que podem assumir a forma que desejarem. Nas masmorras, escolhem quase sempre a forma de um baú de tesouro para atrair aventureiros incautos. Os mimos de ébano são furtivos e têm a capacidade de se tornarem quase invisíveis. Escondem-se em objetos com os quais os aventureiros provavelmente interagirão, mas também transportam tesouros próprios. Uma vez descobertos, não são mais resistentes do que um mimo comum, mas a sua mordida surpresa é devastadora.
actors.mobs.ebonymimic.discover_hint=Pode encontrar esse inimigo com um objeto específico.
actors.mobs.ebonymimic.hidden_desc=Parece haver algo aqui, mas é quase totalmente transparente.
actors.mobs.ebonymimic.hidden_name=contorno suspeito
actors.mobs.ebonymimic.name=imitador de ébano
actors.mobs.ebonymimic.reveal=Havia ali um imitador!
actors.mobs.elemental$chaoselemental.desc=Os elementais são criaturas caóticas que são geralmente criadas quando a magia oculta poderosa não é controlada adequadamente. Os elementais têm inteligência mínima e estão geralmente associados a um tipo específico de magia. Os Elementais do Caos são raros e perigosos, não se tendo estabilizado num elemento específico. Libertam magia selvagem e imprevisível quando atacam.
actors.mobs.elemental$chaoselemental.name=elementar do caos
actors.mobs.elemental$fireelemental.desc=Os elementais são criaturas caóticas que são geralmente criadas quando a magia oculta poderosa não é controlada adequadamente. Possuem inteligência mínima e estão geralmente associados a um tipo específico de magia. Os elementais de fogo são um tipo comum de elemental que causa dano com magia ígnea. Incendeiam os seus alvos com ataques corpo a corpo e, ocasionalmente, podem disparar raios de fogo.
actors.mobs.elemental$fireelemental.name=elemental de fogo
actors.mobs.elemental$frostelemental.desc=Os elementais são criaturas caóticas que são geralmente criadas quando a magia oculta poderosa não é controlada adequadamente. Possuem inteligência mínima e estão geralmente associados a um tipo específico de magia. Os elementais de gelo são um tipo comum de elemental que enfraquece os inimigos com magia congelante. Congelam os seus alvos com ataques corpo a corpo e, ocasionalmente, à distância. A sua magia é muito mais eficaz na água.
actors.mobs.elemental$frostelemental.name=elemental de gelo
actors.mobs.elemental$newbornfireelemental.charging=O elemental está a carregar energia!
actors.mobs.elemental$newbornfireelemental.desc=Os elementais são criaturas caóticas que são geralmente criadas quando a magia oculta poderosa não é controlada adequadamente. Os elementares têm inteligência mínima e estão geralmente associados a um tipo específico de magia. Este elemental de fogo foi invocado recentemente, mas ainda é bastante perigoso!
actors.mobs.elemental$newbornfireelemental.desc_ally=Como este elemental foi invocado por um feitiço, tem um pouco mais de controlo sobre as suas chamas. É incapaz de realizar ataques à distância, mas incendiará os inimigos que atacar em combate corpo a corpo.
actors.mobs.elemental$newbornfireelemental.desc_boss=Devido à natureza caótica da sua invocação, este elemental só consegue espalhar fogo em rajadas imprecisas após carregar durante um turno.
actors.mobs.elemental$newbornfireelemental.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.elemental$newbornfireelemental.name=elemental de fogo recém-nascido
actors.mobs.elemental$shockelemental.desc=Os elementais são criaturas caóticas que são geralmente criadas quando a magia oculta poderosa não é controlada adequadamente. Os elementais têm inteligência mínima e estão geralmente associados a um tipo específico de magia. Os elementais de choque são um tipo menos comum de elemental que perturba os seus inimigos com eletricidade e flashes de luz. Em combate corpo a corpo, lançam eletricidade em direção aos inimigos próximos e causam dano adicional ao seu alvo principal se este estiver na água. Ocasionalmente, também concentram um raio de luz à distância no seu alvo, cegando-o temporariamente.
actors.mobs.elemental$shockelemental.name=choque elemental
actors.mobs.eye.deathgaze_kill=O olhar mortal matou-te...
actors.mobs.eye.desc=Este demónio também é conhecido como «orbe de ódio». Assim que vê um inimigo, usa o seu olhar mortal sem qualquer cuidado, atingindo muitas vezes os próprios aliados.
actors.mobs.eye.name=olho maligno
actors.mobs.fetidrat.desc=Algo está claramente errado com este rato. A sua pelagem preta e oleosa e a sua pele em decomposição são muito diferentes dos ratos saudáveis que viu anteriormente. Os seus olhos verde-claros tornam-no especialmente ameaçador. O rato exala um odor horrível, insuportavelmente forte a curta distância. Um líquido escuro e viscoso escorre da boca do rato, que corrói o chão, mas parece dissolver-se na água.
actors.mobs.fetidrat.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.fetidrat.name=rato fétido
actors.mobs.fungalcore.desc=Este gigantesco cogumelo deve ser a fonte de toda a atividade fúngica nesta gruta.
actors.mobs.fungalcore.name=núcleo fúngico
actors.mobs.fungalsentry.desc=Este cogumelo particularmente alto serve como ponto de defesa para a extensa rede de fungos que habita esta gruta. É imóvel, mas dispara rajadas precisas de veneno contra tudo o que entre no seu campo de visão. Embora o impacto destas rajadas seja relativamente fraco, podem acumular quantidades letais de veneno muito rapidamente. Embora possa ser morto, é provavelmente melhor evitá-lo.
actors.mobs.fungalsentry.name=sentinela fúngica
actors.mobs.fungalspinner.desc=Esta criatura tecedeira das cavernas parece estar a ser controlada por um fungo parasita. O fungo também alterou as suas capacidades, substituindo a sua teia e bolsas de veneno por crescimento fúngico. A criatura tecedeira fúngica cuspirá vegetação para cima de si em vez de teias, espalhando fungos e potencialmente enraizando-o. Embora não possa envenenar, a criatura tecedeira fúngica ganhará resistência substancial a danos se estiver adjacente a qualquer cogumelo.
actors.mobs.fungalspinner.name=fiador fúngico
actors.mobs.ghoul.desc=À medida que a sociedade anã começou a ruir lentamente e o atual rei dos anões tomou o poder absoluto, aqueles que eram fracos ou que lhe resistiam não eram bem tratados. À medida que o rei se tornava mais hábil no uso da magia negra, subjugou estes anões à sua vontade, e agora eles compõem a infantaria do seu exército. Os ghouls não são particularmente fortes sozinhos, mas viajam sempre em grupo e são muito mais difíceis de matar em grande número. _Quando um ghoul é derrotado, ressuscita após alguns turnos, desde que outro ghoul esteja por perto. _
actors.mobs.ghoul.name=carniçal anão
actors.mobs.gnoll.desc=Os gnolls são humanoides semelhantes a hienas. Habitam esgotos e masmorras, aventurando-se ocasionalmente à superfície para realizar incursões. Os batedores gnolls são membros regulares dos seus bandos; não são tão fortes como os brutamontes nem tão inteligentes como os xamãs.
actors.mobs.gnoll.name=batedor gnoll
actors.mobs.gnollexile.desc=Este gnoll de pelagem cinzenta tem uma grande marca no ombro, indicando que se trata de um exilado. Os gnolls são geralmente exilados da sua sociedade por ignorarem ordens ou infringirem leis. Os exilados precisam de ser fortes e astutos para sobreviver, e este parece saber usar a lança que empunha.
actors.mobs.gnollexile.desc_aggro=O gnoll exilado olha em redor com raiva. Parece que algo o fez decidir lutar, afinal. Cuidado com aquela lança!
actors.mobs.gnollexile.desc_passive=O gnoll exilado não se está a mover para atacar. Não parece tão agressivo como os outros gnolls por aqui, e provavelmente não acha que lutar contigo valha a pena. Podia simplesmente deixá-lo passar, mas tem uma mochila que pode estar cheia de itens úteis...
actors.mobs.gnollexile.name=exílio gnoll
actors.mobs.gnollexile.seen_aggro=O gnoll armado com a lança avança para atacar!
actors.mobs.gnollexile.seen_passive=O gnoll que empunha a lança olha para ti com cautela, mas não se move para atacar.
actors.mobs.gnollgeomancer.alert=O geomante desperta! Toda a caverna parece mover-se enquanto ele salta para longe, rindo loucamente!
actors.mobs.gnollgeomancer.desc=Este gnoll sénior, de estatura impressionante, deve ser a fonte de toda a magia de movimentação de terras por aqui e o organizador de toda a atividade gnoll. Ao contrário dos sapadores gnoll da região, o geomante é bastante hábil com a sua magia e não pode ser ferido por pedras atiradas ou que caiam. Contudo, ele não possui nenhuma habilidade para lutar em combate corpo a corpo.
actors.mobs.gnollgeomancer.desc_armor=O geomante está atualmente envolto numa camada de armadura de pedra. _Vais precisar de te aproximar e parti-la com a tua picareta antes de poderes causar dano ao geomante._
actors.mobs.gnollgeomancer.desc_armor_sapper=Um gnoll sapador próximo está a segurar um dispositivo que está a fortalecer a armadura de pedra do geomante. Não conseguirá danificá-la de forma alguma agora!
actors.mobs.gnollgeomancer.desc_sleeping=Este xamã gnoll, de estatura impressionante, está rodeado por uma camada de rocha e parece quase uma estátua. Observando atentamente, pode ver a rocha mover-se magicamente em sincronia com a respiração do gnoll ancião. Não pode ser ferido enquanto estiver envolto em rocha desta forma e parece estar a desfrutar de uma sesta literal na terra. Provavelmente consegues quebrar as camadas de rocha com a tua picareta, mas prepara-te para uma luta. O geomante deve ser a fonte das várias magias de movimentação de terras por aqui e o organizador de toda a actividade gnoll. Derrotar os gnolls espalhados por aqui antes de o enfrentar pode ser uma boa ideia.
actors.mobs.gnollgeomancer.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.gnollgeomancer.name=geomante gnoll
actors.mobs.gnollgeomancer.rock_kill=A pedra voadora matou-te...
actors.mobs.gnollgeomancer.rockfall_kill=As pedras que caíram mataram-te...
actors.mobs.gnollgeomancer.warning=O geomante começa a mexer-se. Certifique-se de que está preparado antes de continuar!
actors.mobs.gnollguard.def_verb=bloqueado
actors.mobs.gnollguard.desc=Um gnoll grande e de aspeto robusto, empunhando uma lança e um escudo, mas sem capacete. Estes guardas são provavelmente brutamontes em formação, recrutados para ajudar a proteger a mina da vida selvagem invasora. O guarda gnoll é forte o suficiente para empunhar a lança com uma mão, mas não a utiliza muito bem. Ele precisará de um espaço relativamente aberto para atacar à distância e causará consideravelmente menos dano se se aproximar.
actors.mobs.gnollguard.desc_armor=Um sapador gnoll próximo está a segurar um dispositivo que concede a este guarda uma armadura de terra, reduzindo drasticamente o dano que recebe.
actors.mobs.gnollguard.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.gnollguard.name=guarda gnoll
actors.mobs.gnollguard.spear_warn=O gnoll desfere um golpe violento com a ponta da sua lança!
actors.mobs.gnollsapper.desc=Um gnoll pequeno e frágil, mas inteligente, de pelagem pálida e um saco cheio de diversos apetrechos. Provavelmente está ali para auxiliar na prospeção e mineração de ouro negro, e tem um guarda por perto para proteção. É capaz de lutar, mas os seus ataques são lamentavelmente fracos, não mais fortes do que os de um batedor gnoll. Em vez de lutarem diretamente, os sapadores preferem utilizar os vários apetrechos que possuem para fazer com que o ambiente rochoso ataque por eles. Contudo, eles próprios não dominam a magia de movimentação de terra, e por isso é bem provável que usem os seus apetrechos de forma imprudente. _Deve haver muitas maneiras de usar os seus ataques contra eles ou contra o seu guarda. _
actors.mobs.gnollsapper.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.gnollsapper.name=sapador gnoll
actors.mobs.gnolltrickster.desc=Uma criatura de aparência estranha, mesmo para os padrões dos gnolls. Inclina-se para a frente com um sorriso malicioso, quase como se estivesse a embalar o saco pendurado no ombro. Os seus olhos estão arregalados com uma estranha mistura de medo e excitação. Há uma grande coleção de dardos mal feitos no seu saco, todos aparentemente com pontas contendo diversas substâncias nocivas.
actors.mobs.gnolltrickster.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.gnolltrickster.name=trapaceiro gnoll
actors.mobs.goldenmimic.desc=Os mimos são criaturas mágicas que podem assumir a forma que desejarem. Nas masmorras, escolhem quase sempre a forma de um baú de tesouro para atrair aventureiros incautos. Os mimos dourados são mais resistentes e tentam atrair os aventureiros mais fortes. Possuem tesouros melhores, mas também são muito mais fortes do que os mimos comuns.
actors.mobs.goldenmimic.name=imitador dourado
actors.mobs.golem.def_verb=bloqueado
actors.mobs.golem.desc=Os anões tentaram juntar os seus conhecimentos de mecânica ao novo poder de subjugar elementais. Usaram espíritos da terra como «alma» dos corpos mecânicos dos golens, por os julgarem os mais dóceis. Mesmo assim, bastava um pequeno erro no ritual para perderem o controlo.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=Pouco se sabe sobre a Gosma. Talvez nem seja uma criatura, mas apenas um amontoado de substâncias dos esgotos que ganhou um princípio de vontade própria.
actors.mobs.goo.enraged=enfurecido
actors.mobs.goo.gluuurp=GLÚUUURP!
actors.mobs.goo.name=Gosma
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=A gosma está a expandir-se!
actors.mobs.goo.rankings_desc=Absorvido pela gosma
actors.mobs.greatcrab.def_verb=bloqueado
actors.mobs.greatcrab.desc=Este caranguejo é gigantesco, mesmo comparado com outros caranguejos de esgoto. A sua carapaça azul está coberta de fendas e cracas, apresentando grande idade. Move-se lentamente, mal conseguindo manter o equilíbrio com a sua enorme garra. Embora o caranguejo tenha apenas uma pinça, o seu tamanho compensa facilmente. Mantém a garra à frente de qualquer ameaça, protegendo-se atrás de uma carapaça impenetrável. No entanto, o caranguejo não consegue bloquear ataques que não vê chegar, ou ataques de múltiplos inimigos ao mesmo tempo.
actors.mobs.greatcrab.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.greatcrab.name=grande caranguejo
actors.mobs.greatcrab.noticed=O caranguejo bloqueia com a sua enorme garra.
actors.mobs.guard.def_verb=bloqueado
actors.mobs.guard.desc=Outrora guardiões da prisão, estes guardas há muito que se tornaram indistinguíveis dos prisioneiros. Cambaleiam como zombies, vagueando sem cérebro pelos corredores em busca de qualquer coisa fora do lugar, como tu! \n\n Transportam correntes à cintura, possivelmente usadas para atrair os inimigos para perto.
actors.mobs.guard.name=guarda prisional
actors.mobs.guard.scorpion=Venha cá!
actors.mobs.hermitcrab.def_verb=bloqueado
actors.mobs.hermitcrab.desc=Por alguma razão, este caranguejo do esgoto decidiu usar a parte superior partida de um barril na cabeça! O peso extra reduziu a sua velocidade para o normal, mas também lhe conferiu uma defesa consideravelmente maior. Acha que consegue ouvir algo a mexer dentro do barril...
actors.mobs.hermitcrab.name=caranguejo-eremita
actors.mobs.mimic.desc=Os mimos são criaturas mágicas que podem assumir a forma que desejarem. Nas masmorras, escolhem quase sempre a forma de um baú de tesouro para atrair aventureiros incautos. Os mimos têm uma mordida dolorosa, mas geralmente guardam mais tesouros do que um baú comum.
actors.mobs.mimic.discover_hint=Podes encontrar este inimigo em qualquer lugar da masmorra.
actors.mobs.mimic.hidden_hint=Há algo de estranho neste baú... Aproximar-me e tentar abri-lo talvez seja uma má ideia.
actors.mobs.mimic.name=mímico
actors.mobs.mimic.reveal=Este baú é um imitador!
actors.mobs.mob.died=Ouve-se algo morrer à distância.
actors.mobs.mob.discover_hint=Podes encontrar este inimigo numa região específica da masmorra.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Morto por: %s
actors.mobs.monk$focus.desc=Este monge está perfeitamente focado no seu alvo e parece antecipar os seus movimentos antes mesmo de estes acontecerem. Enquanto estiver concentrado, o próximo ataque físico desferido contra esta personagem irá certamente falhar, independentemente das circunstâncias. Aparar este ataque consumirá o foco do monge, que precisará de o recuperar para aparar outro ataque. Os monges acumulam foco mais rapidamente enquanto estão em movimento.
actors.mobs.monk$focus.name=focado
actors.mobs.monk.def_verb=bloqueado
actors.mobs.monk.desc=Estes monges fanáticos dedicaram-se a proteger os segredos da sua cidade de todos os estrangeiros. Não usam armas nem armaduras, confiando apenas na arte do combate de mãos nuas.
actors.mobs.monk.name=monge anão
actors.mobs.monk.parried=aparado
actors.mobs.necromancer$necroskeleton.desc=Este esqueleto foi invocado por um necromante. Comporta-se como um esqueleto comum e morrerá quando o necromante que o invocou for morto.
actors.mobs.necromancer$necroskeleton.name=esqueleto de necromante
actors.mobs.necromancer.desc=Estes aprendizes de magos das trevas acorreram à prisão, pois é o local perfeito para praticar as suas artes maléficas. Os necromantes invocam e fortalecem esqueletos para lutar por eles. Matar o necromante mata também o esqueleto que ele invoca.
actors.mobs.necromancer.name=necromante
actors.mobs.npcs.blacksmith.cant_enter_old=Esta área não está acessível nesta partida. Inicia um novo jogo para tentar a nova missão!
actors.mobs.npcs.blacksmith.def_verb=bloqueado
actors.mobs.npcs.blacksmith.desc=Este ferreiro troll tem a aparência típica de todos os trolls: alto e magro, com uma pele que faz lembrar pedra tanto na cor como na textura. O ferreiro troll está a mexer com ferramentas desproporcionalmente pequenas.
actors.mobs.npcs.blacksmith.enter_no=Ainda não
actors.mobs.npcs.blacksmith.enter_yes=Estou pronto
actors.mobs.npcs.blacksmith.entrance_blocked=A descida está bloqueada.
actors.mobs.npcs.blacksmith.exit_no=Ainda não
actors.mobs.npcs.blacksmith.exit_warn_crystal=Aquele cristal gigante ainda está lá em baixo também. Eu pago a mais se o destruir.
actors.mobs.npcs.blacksmith.exit_warn_full=Terminou? Tem muito ouro, mas certifique-se de que não deixou nenhum dos seus equipamentos para trás. Lembre-se, não o vou deixar voltar depois de subir.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Aquele cogumelo gigante ainda está lá em baixo também. Eu pago a mais se o matar.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Aquele geomante gnoll ainda está lá em baixo também. Eu pago a mais se o matar.
actors.mobs.npcs.blacksmith.exit_warn_high=Você terminou? Parece que conseguiu uma boa quantidade de ouro, mas eu poderia usar um pouco mais. Deve conseguir 40 peças. Lembre-se, não o vou deixar voltar depois de subir.
actors.mobs.npcs.blacksmith.exit_warn_low=Já terminou? Não parece que tenha muito ouro. Deverá conseguir 40 peças. Lembre-se, não o vou deixar voltar depois de subir.
actors.mobs.npcs.blacksmith.exit_warn_med=Você terminou? Pelo menos conseguiste um pouco de ouro, mas de certeza que há mais na mina. Deves conseguir _40 peças_._\n\n_Lembra-te, não te vou deixar voltar depois de subires._
actors.mobs.npcs.blacksmith.exit_warn_none=Já terminou? Quase não tem ouro nenhum! Deverá conseguir 40 peças. Lembre-se, não o vou deixar voltar depois de subir.
actors.mobs.npcs.blacksmith.exit_yes=Terminei
actors.mobs.npcs.blacksmith.get_lost=Estou ocupado. Desaparece daqui!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Ei, humano! Parece ser uma pessoa importante.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Mas cuidado, a mina é perigosa para um humanozinho como tu. Está abandonada há algum tempo, e vários cristais começaram a crescer. São brilhantes, mas demasiado frágeis para valerem alguma coisa, e têm alguma proteção mágica. Eles são bastante fortes, por isso _tem cuidado onde mineram_ ou vão chamar a atenção deles. Há um _cristal gigante_ algures também. Ele é muito mais resistente, por isso prepare-se para uma luta se começar a quebrá-lo. Aposto que quebrá-lo vai diminuir o crescimento de todos os outros cristais, por isso pago um extra se conseguir fazer isso.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Ei, humano! Parece ser uma pessoa corajosa.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Mas cuidado, a mina é perigosa para um humano pequeno como tu. Há uma espécie de monstro fungo a crescer lá em baixo. Tem sentinelas cogumelo que são realmente mortais se te virem, mas pelo menos não conseguem levantar-se e perseguir-te. _Mantenha-se fora de vista_ se quiser sobreviver. Pagarei um extra se conseguires derrotar o _maior cogumelo_, mas vai exigir um esforço considerável. Está ligado a vários nós de micélio escondidos nas paredes. Terá de quebrar a maioria deles antes de conseguir causar dano real.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Mas cuidado, a mina é perigosa para um humanozinho como tu. Uns gnolls também querem o ouro e agora estão a destruir tudo. São uns idiotas, por isso a sua mineração causou todo o tipo de desabamento e desmoronamento. Vai ter de minerar por ali, por isso procure por rochas recentemente perturbadas. Penso que um dos gnolls está a causar a maior parte dos problemas, provavelmente um xamã geomante ou algo do género. Eu pago um extra se conseguires encontrá-lo e matá-lo, mas tenho a certeza que ele vai lutar.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Ei, humano! Parece ser bem rápido.
actors.mobs.npcs.blacksmith.intro_quest_mage=Ei, humano! Parece ser inteligente.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Ei, humano! Parece ser bem esperto.
actors.mobs.npcs.blacksmith.intro_quest_start=Quer ser útil, é? Pois, tenho algo que pode fazer. Construí esta oficina em cima de uma mina antiga, basta descer aquela escada. Pega nesta picareta e mina um pouco de minério de ouro escuro para mim. Quarenta peças devem ser suficientes. A rocha lá em baixo é bastante macia, pelo que conseguirás minerar através das paredes com um pouco de esforço. O que quer dizer com "como vou pagar"? Seu ganancioso... Ok, ok, posso fazer-te um trabalho de ferreiro. Considere-se com sorte, sou o único ferreiro por aqui.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Ei, humano! Parece ser durão.
actors.mobs.npcs.blacksmith.lost_pick=Está a brincar comigo? Onde está a minha picareta?!
actors.mobs.npcs.blacksmith.name=ferreiro troll
actors.mobs.npcs.blacksmith.quest_start_prompt=Pronto para descer? Certifique-se de que tem espaço livre para o ouro. \n\n_Só te vou desiludir uma vez!_
actors.mobs.npcs.blacksmith.reminder=Já terminou de me fazer perder tempo? A entrada da mina é por ali.
actors.mobs.npcs.blacksmith.reminder_crystal=Traga-me o máximo de ouro que conseguir e tente quebrar também o grande cristal.
actors.mobs.npcs.blacksmith.reminder_fungi=Traga-me o máximo de ouro que conseguir e tente matar o cogumelo gigante também.
actors.mobs.npcs.blacksmith.reminder_gnoll=Traga-me o máximo de ouro que puder e tente matar o geomante gnoll também.
actors.mobs.npcs.ghost.crab_1=Olá %s... Um dia fui como tu - forte e confiante... Mas fui morto por uma criatura ancestral... Não posso sair deste lugar... Não até ter a minha vingança... Mata o _grande caranguejo_ que me tirou a vida... \n\n Ele é anormalmente antigo... Com uma única garra enorme e uma carapaça grossa... _Cuidado com a tua garra, deves surpreender o caranguejo ou ele irá usá-la para bloquear..._
actors.mobs.npcs.ghost.crab_2=Por favor... Ajuda-me... Derrota o crustáceo... \n\n_Ele bloqueará sempre... Quando te vir a chegar..._
actors.mobs.npcs.ghost.desc=O fantasma é quase invisível. Parece um ponto disforme de luz fraca com um rosto triste.
actors.mobs.npcs.ghost.find_me=Obrigado... venha ter comigo...
actors.mobs.npcs.ghost.gnoll_1=Olá %s... Um dia fui como tu - forte e confiante... Mas fui morto por um inimigo traiçoeiro... Não posso sair deste lugar... Não até ter a minha vingança... Mata o gnoll trapaceiro que me tirou a vida... \n\n Ele não é como os outros gnolls... Ele esconde-se e usa armas de arremesso... Cuidado com os seus dardos venenosos e incendiários, não ataque à distância...
actors.mobs.npcs.ghost.gnoll_2=Por favor... Ajude-me... Derrote o trapaceiro... \n\n_Não deixe que ele o atinja... Aproxime-se dele..._
actors.mobs.npcs.ghost.name=fantasma triste
actors.mobs.npcs.ghost.rat_1=Olá %s... Um dia fui como tu - forte e confiante... Mas fui morto por uma besta imunda... Não posso sair deste lugar... Não até ter a minha vingança... Mata o rato fétido que me tirou a vida... \n\n Espreita neste andar... Espalhando imundície por todo o lado... Cuidado com a tua nuvem de fedor e dentada corrosiva, o ácido dissolve-se na água...
actors.mobs.npcs.ghost.rat_2=Por favor... Ajudem-me... Derrotem a abominação... \n\n_Luta perto da água... Evita o fedor..._
actors.mobs.npcs.imp.cya=Até já, %s!
actors.mobs.npcs.imp.desc=Os diabinhos são demónios menores. Não se destacam nem pela força nem pelo talento mágico, mas são bastante inteligentes e sociáveis. Muitos diabinhos preferem viver entre não-demónios.
actors.mobs.npcs.imp.golems_1=No meu caso, são os _golems_ que têm de ser mortos. Vejam bem, vou começar aqui um pequeno negócio, mas estes golems estúpidos atrapalham os negócios! É muito difícil negociar com estes malditos pedaços de granito errantes! Por isso, por favor, mate... digamos, _4 deles_ e receberá uma recompensa.
actors.mobs.npcs.imp.golems_2=Como está a correr o seu safari de golems? Só não se esqueça de levar as fichas.
actors.mobs.npcs.imp.hey=Psiu, %s!
actors.mobs.npcs.imp.intro=É um aventureiro? Eu adoro aventureiros! Podemos sempre contar com eles quando precisamos de matar alguém, não é? Por uma recompensa, claro ;)
actors.mobs.npcs.imp.monks_1=No meu caso, são os _monges_ que precisam de ser mortos. Vejam bem, vou começar aqui um pequeno negócio, mas estes lunáticos não compram nada e vão espantar os outros clientes. Por isso, por favor, mate... digamos, _5 deles_ e receberá uma recompensa.
actors.mobs.npcs.imp.monks_2=Ah, ainda está vivo! Eu sabia que o teu kung-fu seria mais forte ;) Só não te esqueças de apanhar as fichas.
actors.mobs.npcs.imp.name=ambicioso imp
actors.mobs.npcs.impshopkeeper.buyback=O duende devolve alegremente o seu objeto.
actors.mobs.npcs.impshopkeeper.desc=O duende montou uma pequena loja à entrada dos corredores interiores. É bom ver um rosto amigo, mas os seus preços certamente não parecem amigáveis.
actors.mobs.npcs.impshopkeeper.greetings=Olá, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=O que fizeste, %s? Comprem rápido, preciso de sair daqui!
actors.mobs.npcs.impshopkeeper.name=ambicioso imp
actors.mobs.npcs.impshopkeeper.thief=Pensei que podia confiar em ti!
actors.mobs.npcs.mirrorimage.desc=Esta ilusão é muito parecida consigo, mas é mais pálida e estremece um pouco.
actors.mobs.npcs.mirrorimage.discover_hint=Podes encontrar este personagem com um pergaminho específico.
actors.mobs.npcs.mirrorimage.name=imagem espelhada
actors.mobs.npcs.npc.discover_hint=Podes encontrar este personagem numa região específica da masmorra.
actors.mobs.npcs.prismaticimage.desc=Esta ilusão cintilante assemelha-se muito a si, chegando a parecer empunhar a sua arma e armadura atuais. As imagens prismáticas tentarão atrair e desviar a atenção dos inimigos, utilizando a sua defesa e saúde melhoradas para o proteger. Embora não possuam o mesmo poder ofensivo que as imagens espelhadas, têm uma durabilidade melhorada, incluindo benefícios da sua armadura. Quando reduzidas a 0 pontos de vida, as imagens prismáticas desaparecerão ao longo de vários turnos, podendo ainda ser curadas durante esse período. Quando não houver inimigos presentes, as imagens prismáticas desaparecerão e regressarão ao seu mestre.
actors.mobs.npcs.prismaticimage.discover_hint=Podes encontrar este personagem com um pergaminho específico.
actors.mobs.npcs.prismaticimage.name=imagem prismática
actors.mobs.npcs.ratking.confused=O quê... Onde estou? O meu reino precisa de mim!
actors.mobs.npcs.ratking.crown_after=Gosta da sua nova armadura? Sem retorno!
actors.mobs.npcs.ratking.crown_clothes=Vista-se! Não está em condições de falar com a realeza!
actors.mobs.npcs.ratking.crown_desc=Oooh, esta coroa é para mim!? Ela parece muito mais brilhante do que a minha, por isso aceito-a de bom grado! Na verdade, penso que lhe posso oferecer algo como recompensa por esta coroa. Um poder tremendo, digno de um herói como tu! Gostaria disso?
actors.mobs.npcs.ratking.crown_fine=Ótimo! Não é como se eu quisesse isso de qualquer forma...
actors.mobs.npcs.ratking.crown_info=Conte-me mais primeiro.
actors.mobs.npcs.ratking.crown_no=Preferia não...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, obrigada! Agora vá e faça o seu rei orgulhar-se!
actors.mobs.npcs.ratking.crown_yes=Claro!
actors.mobs.npcs.ratking.desc=Este rato é um pouco maior do que um rato marsupial comum. Tem uma pequena coroa na cabeça.
actors.mobs.npcs.ratking.desc_birthday=Este rato é um pouco maior do que um rato marsupial comum. Está a usar um pequeno chapéu de festa verde em vez da sua coroa habitual. Feliz aniversário, Rei dos Ratos!
actors.mobs.npcs.ratking.desc_crown=Este rato é um pouco maior do que um rato marsupial comum. Tem uma coroa de rei anão na cabeça.
actors.mobs.npcs.ratking.desc_winter=Este rato é um pouco maior do que um rato marsupial comum. Está a usar um pequeno chapéu festivo em vez da sua coroa habitual. Boas Festas!
actors.mobs.npcs.ratking.discover_hint=Podes encontrar este personagem no final de uma região específica da masmorra.
actors.mobs.npcs.ratking.name=rei dos ratos
actors.mobs.npcs.ratking.not_sleeping=Não estou a conseguir dormir!
actors.mobs.npcs.ratking.what_is_it=O que é? Não tenho tempo para essas parvoíces. O meu reino não se governará sozinho!
actors.mobs.npcs.sheep.baa!=Bééé!
actors.mobs.npcs.sheep.baa.=Bééé.
actors.mobs.npcs.sheep.baa...=Béé...
actors.mobs.npcs.sheep.baa?=Bééé?
actors.mobs.npcs.sheep.def_verb=bloqueado
actors.mobs.npcs.sheep.desc=Esta é uma ovelha mágica. O que tem de mágico? Não pode matá-la. Ficará parada até desaparecer magicamente, ruminando o tempo todo com um olhar vago.
actors.mobs.npcs.sheep.discover_hint=Podes encontrar este personagem com um item ou armadilha específica.
actors.mobs.npcs.sheep.name=ovelha
actors.mobs.npcs.shopkeeper.buyback=O comerciante, a contragosto, devolve o seu produto.
actors.mobs.npcs.shopkeeper.desc=Este sujeito robusto parece mais apropriado para um bairro comercial de uma grande cidade do que para uma masmorra. Os seus preços explicam por que razão prefere fazer negócios aqui.
actors.mobs.npcs.shopkeeper.flee=O lojista foge!
actors.mobs.npcs.shopkeeper.name=lojista
actors.mobs.npcs.shopkeeper.sell=Venda um artigo
actors.mobs.npcs.shopkeeper.talk=Palestra
actors.mobs.npcs.shopkeeper.talk_ascent=Não sei o que pretende fazer com este amuleto, mas não quero ter nada a ver com ele. Compre alguma coisa e vá-se embora, precisamos de sair os dois daqui!
actors.mobs.npcs.shopkeeper.talk_caves=Gaste dinheiro, viva mais tempo. \n\n Ah, e manda um abraço àquele ferreiro troll se o vires. Lembre o otário que ainda me deve dinheiro pelo martelo que lhe vendi na semana passada!
actors.mobs.npcs.shopkeeper.talk_city=Os meus produtos podem mantê-lo seguro aqui em baixo. \n\n... E, por favor, não fique por aqui. Demorou uma eternidade para convencer os locais a deixarem-me em paz, não quero que arranje confusão!
actors.mobs.npcs.shopkeeper.talk_halls=Olá! Tenho preços especiais para caçadores de demónios! ZXQPH0 ZXQ ZXQPH1 ZXQ Ah, e cuidado lá em baixo! Os demónios lá de baixo não se importam com a sua coragem. Não poderá voltar atrás e gastar mais dinheiro se estiver morto! ;) ZXQPH2 ZXQ ZXQPH3 ZXQ Os demónios são como eu? Hehe, nem pensar. Sou apenas um sujeito pequeno, não sou lá um grande lutador, e consegui manter a minha sanidade mental intacta. Os demónios lá em baixo são criaturas muito mais fortes, e todos foram escravizados por... bem... basta ter cuidado lá em baixo.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Olá, Alteza, ou seria Santidade agora? Hehe, de qualquer forma, este não é o lugar para si. Muita gente ficaria devastada se acabasse morto. Mas certamente tem algumas moedas, porque não comprar algo para evitar isso?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Ora, se não é o herói viajante! Se está a tentar salvar outra cidade, boa sorte, os perigos aqui são muito piores do que gangues de bandidos insignificantes. Tenho a certeza de que se sairá melhor do que qualquer um, apenas tente não morrer mesmo à porta da minha loja.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Parece estar fora do seu elemento, menina. Os corredores estreitos das masmorras não são tão espaçosos como os grandes salões ou as florestas que rodeiam a cidade, pois não? Hehe, ah, não ligue ao meu devaneio, porque não compra alguma coisa?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Tenho tudo o que precisa para uma aventura de sucesso!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, acho que já vi um cartaz de procurado com o teu nome algures na cidade. Está foragido, é? Ah, é inocente, não é? Claro, claro... Não se preocupe, tenho coisas melhores para fazer do que escrever sobre si, mas talvez devesse comprar alguma coisa para ter a certeza?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Vieste da guilda dos ladrões para limpar a área? Não, só estava a fazer compras? Bom, mate alguns monstros enquanto aqui estiver. E não esperem desconto, eu pago-vos uma boa pipa de massa de proteção e mal me protegem cá em baixo.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Que selo interessante que tem aí, normalmente vêm inteiros. É um herói em desgraça ou algo do género? Bem, seja o que for que tenha feito, não é da minha conta, as suas moedas ainda são válidas.
actors.mobs.npcs.shopkeeper.thief=Ladrão, ladrão!
actors.mobs.npcs.shopkeeper.warn=Cuidado! Não vou voltar a avisar.
actors.mobs.npcs.vaultlaser.desc=Esta sentinela está a disparar lasers em intervalos regulares. _Como esta é apenas uma área de testes, os lasers não te vão realmente magoar._
actors.mobs.npcs.vaultlaser.name=sentinela laser do cofre
actors.mobs.npcs.vaultsentry.desc=Esta sentinela está a digitalizar a área seguindo um padrão. _Como esta é apenas uma área de teste, a sentinela não fará nada se o detetar. _
actors.mobs.npcs.vaultsentry.name=sentinela de varrimento do cofre
actors.mobs.npcs.wandmaker.def_verb=bloqueado
actors.mobs.npcs.wandmaker.desc=Este senhor idoso, mas vigoroso, exibe uma expressão ligeiramente confusa. Está protegido por um escudo mágico.
actors.mobs.npcs.wandmaker.intro_1=Vim aqui para encontrar um ingrediente raro para uma varinha, mas perdi-me e o meu escudo mágico está a enfraquecer. Preciso de partir em breve, mas não suporto partir sem conseguir o que vim buscar.
actors.mobs.npcs.wandmaker.intro_2=Se me arranjar isto, terei todo o prazer em pagar-lhe com uma das minhas varinhas finamente trabalhadas! Trouxe duas comigo, para que possa escolher a que preferir.
actors.mobs.npcs.wandmaker.intro_berry=O antigo carcereiro desta prisão mantinha uma planta de _podberry_, e eu ando atrás de uma das suas sementes. A planta provavelmente já se espalhou descontroladamente, pelo que conseguir que dê uma semente pode ser complicado. O seu jardim deve estar por aqui. Tente _manter-se longe dos seus espinhos_ se quiser sair ileso. Usar fogo pode ser tentador, mas por favor, não o faça, vai matar a planta e destruir as suas sementes.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, olá, Alteza! Que agradável surpresa encontrá-lo num local tão deprimente! Detesto incomodar, mas talvez tenha uma tarefa para o senhor.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, olá, menina! Que agradável surpresa encontrar um herói num lugar tão deprimente! Se estiver disposta a ajudar um velhinho, talvez tenha uma tarefa para si.
actors.mobs.npcs.wandmaker.intro_dust=Procuro pó de cadáver. É um tipo especial de farinha de ossos amaldiçoada que costuma aparecer em locais como este. Deve haver uma sala barricada por aqui algures, tenho a certeza que encontrará um pouco de pó lá. Mas cuidado, a maldição que o pó carrega é muito forte. Volte o mais rapidamente possível e eu purificá-lo-ei para si.
actors.mobs.npcs.wandmaker.intro_ember=Procuro brasas frescas de um elemental de fogo recém-nascido. Os elementais aparecem normalmente quando um ritual de invocação não é controlado, por isso basta encontrar algumas velas e um local para o ritual e tenho a certeza que conseguirás fazer com que um apareça. No entanto, deve evitar encurralar-se durante a luta, ou pode manter algum item congelante por perto. Os elementares recém-nascidos são bastante poderosos e caóticos, mas não suportam o frio.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, olá, menina! Um rosto amigável é uma agradável surpresa por aqui, não é? Aliás, juro que já vi a tua cara antes, mas não me consigo lembrar de onde... Ah, deixa lá, se estás aqui à procura de aventura, talvez tenha uma tarefa para ti.
actors.mobs.npcs.wandmaker.intro_mage=Ah, olá %s! Ouvi dizer que houve alguma confusão que vos envolveu a si e ao instituto de magos? Ah, deixa lá, nunca gostei mesmo daqueles chatos. Se estiver disposto, talvez tenha uma tarefa para si.
actors.mobs.npcs.wandmaker.intro_rogue=Ui, você assustou-me! Nunca encontrei um bandido deste lugar que ainda estivesse são, por isso deves ser da superfície! Se estiver disposto a ajudar um estranho, talvez tenha uma tarefa para si.
actors.mobs.npcs.wandmaker.intro_warrior=Oh, olá! Que agradável surpresa encontrar um guerreiro do norte num local tão deprimente! Deve ter viajado bastante para chegar aqui. Se estiver em busca de aventura, talvez tenha uma tarefa para si.
actors.mobs.npcs.wandmaker.name=velho fabricante de varinhas
actors.mobs.npcs.wandmaker.reminder_berry=Teve sorte com a semente de Rotberry, %s? Procure uma sala cheia de vegetação.
actors.mobs.npcs.wandmaker.reminder_dust=Alguma sorte com o pó para cadáveres, %s? Procure algumas barricadas.
actors.mobs.npcs.wandmaker.reminder_ember=Teve sorte com aquelas brasas, %s? Vai precisar de encontrar quatro velas e o local do ritual.
actors.mobs.phantompiranha.desc=As piranhas fantasmas são uma espécie rara de piranha com capacidades mágicas e corpos translúcidos e misteriosos. São capazes de se teletransportar quando atacadas, seja para escapar ou para se aproximarem rapidamente do inimigo! Embora sejam irritantes de enfrentar, a sua carne é valorizada pelas suas propriedades mágicas.
actors.mobs.phantompiranha.name=piranha fantasma
actors.mobs.phantompiranha.teleport_away=A piranha fantasma teletransporta-se para longe...
actors.mobs.piranha.desc=Estes peixes carnívoros são criados especificamente para proteger as zonas alagadas. A sua mordida é mortal, por isso é melhor evitar o contacto direto com eles.
actors.mobs.piranha.discover_hint=Podes encontrar este inimigo em qualquer lugar da masmorra.
actors.mobs.piranha.name=piranha gigante
actors.mobs.pylon.desc_active=Um poste de energia, concebido para ajudar a regular a eletricidade que alimenta as máquinas nesta área. O poste está atualmente carregado com energia elétrica; deve ser isso que está a sobrecarregar o DM-300! \n\n Neste estado, os postes são vulneráveis, mas emitem arcos elétricos para as células próximas no sentido dos ponteiros do relógio. Devido à sua construção robusta em metal, os postes são resistentes a grandes danos.
actors.mobs.pylon.desc_inactive=Uma torre de transmissão de energia, destinada a ajudar a regular a eletricidade que alimenta as máquinas nesta área. A torre encontra-se atualmente inativa e imune a danos.
actors.mobs.pylon.name=torre de energia
actors.mobs.rat.desc=Os ratos marsupiais são habitantes agressivos, mas relativamente frágeis, dos esgotos. Têm uma mordida dolorosa, mas só representam risco de vida em grande número.
actors.mobs.rat.name=rato marsupial
actors.mobs.ripperdemon.desc=Estas criaturas horripilantes são o resultado dos inúmeros cadáveres de anões desta região, que foram utilizados pelas forças demoníacas. Os Estripadores são criaturas emaciadas e grotescas que se assemelham a anões, mas com corpos mutilados e longas garras afiadas feitas de osso. Os demónios Estripadores não são particularmente resistentes, mas são ágeis e perigosos. São capazes de saltar grandes distâncias para alcançar rapidamente os seus alvos antes de os rasgar com as suas garras.
actors.mobs.ripperdemon.leap=O demónio estripador prepara-se para atacar!
actors.mobs.ripperdemon.name=demônio estripador
actors.mobs.rotheart.desc=O fruto da Rotberry é muito singular. Em vez de apodrecer e libertar nutrientes, cresce, endurece e envolve a semente. Este proporciona proteção aos órgãos internos que se desenvolvem no interior do fruto. Esta esfera gigante é considerada o coração da planta adulta de Rotberry.
actors.mobs.rotheart.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.rotheart.name=coração podre
actors.mobs.rotlasher.desc=O chicote da podridão faz parte da estrutura radicular de uma planta de podridão madura e é também o seu principal meio de defesa. Os chicotes são cegos e ficam presos no chão, mas atacam violentamente qualquer ameaça próxima após a detetarem por um instante. Quando não há inimigos por perto, estes permanecem imóveis, tentando camuflar-se com a vegetação circundante.
actors.mobs.rotlasher.discover_hint=Pode encontrar este inimigo durante uma missão específica.
actors.mobs.rotlasher.name=chicoteador de podridão
actors.mobs.scorpio.desc=Estas enormes criaturas demoníacas, semelhantes a aracnídeos, evitam o combate corpo a corpo, preferindo disparar espinhos serrilhados incapacitantes a longas distâncias.
actors.mobs.scorpio.name=Escorpião
actors.mobs.senior.desc=Estes monges fanáticos dedicaram-se a proteger os segredos da sua cidade de todos os estrangeiros. Não usam armas nem armaduras, confiando apenas na arte do combate de mãos nuas.
actors.mobs.senior.name=monge ancião
actors.mobs.shaman$blueshaman.spell_desc=Este xamã usa uma máscara azul e utiliza magia que aumenta temporariamente o dano recebido.
actors.mobs.shaman$purpleshaman.spell_desc=Este xamã usa uma máscara roxa e utilizará magia que reduz temporariamente a sua precisão e evasão.
actors.mobs.shaman$redshaman.spell_desc=Este xamã usa uma máscara vermelha e utilizará magia que enfraquece temporariamente o seu poder de ataque.
actors.mobs.shaman.bolt_kill=O raio mágico matou-te...
actors.mobs.shaman.desc=Os gnolls mais inteligentes conseguem aprender magia xamânica. Os xamãs preferem feitiços de combate para compensar a falta de força e não hesitam em usá-los contra quem questiona o seu lugar na tribo.
actors.mobs.shaman.name=xamã gnoll
actors.mobs.skeleton.def_verb=bloqueado
actors.mobs.skeleton.desc=Os esqueletos são feitos dos ossos de aventureiros desafortunados e habitantes da masmorra, animados pela magia maligna que sobe das profundezas. Depois de sofrerem dano suficiente, desfazem-se numa explosão de ossos.
actors.mobs.skeleton.explo_kill=Foi morto pela explosão de ossos...
actors.mobs.skeleton.name=esqueleto
actors.mobs.slime.def_verb=bloqueado
actors.mobs.slime.desc=Os slimes são criaturas estranhas, ligeiramente mágicas, com um corpo exterior emborrachado e um núcleo líquido. Os esgotos da cidade fornecem-lhes um amplo fornecimento de água e nutrientes. Devido à sua membrana externa elástica, é difícil causar mais de 6 pontos de dano a um slime com um único ataque.
actors.mobs.slime.name=gosma
actors.mobs.snake.desc=Estas serpentes gigantescas são capazes de se esquivar rapidamente dos golpes, tornando-as bastante difíceis de atingir. Ataques mágicos ou ataques surpresa, no entanto, podem apanhá-las desprevenidas. Podes realizar um ataque surpresa atacando enquanto estiveres fora do campo de visão da serpente. Uma forma é deixar que uma serpente o persiga por uma porta e depois atacar logo após ela entrar.
actors.mobs.snake.hint=Experimente usar o botão de examinar numa cobra para aprender a combatê-la.
actors.mobs.snake.name=cobra de esgoto
actors.mobs.spectralnecromancer.desc=Embora os esqueletos sejam o ganha-pão de um necromante, alguns preferem explorar outros lacaios menos corpóreos. Os necromantes espectrais escolheram os espectros como os seus lacaios prediletos! Os espectros individuais não são tão fortes como os esqueletos, mas estes necromantes não têm medo de invocar vários deles!
actors.mobs.spectralnecromancer.name=necromante espectral
actors.mobs.spinner.desc=Estas aranhas das cavernas, peludas e esverdeadas, evitam o combate direto. Preferem esperar à distância enquanto a vítima, presa na sua teia, morre lentamente da mordedura venenosa.
actors.mobs.spinner.name=fiandeiro de gruta
actors.mobs.statue.def_verb=bloqueado
actors.mobs.statue.desc=Poderia pensar que é apenas mais uma das estátuas inanimadas desta masmorra, mas os seus olhos vermelhos brilhantes denunciam-na.
actors.mobs.statue.desc_weapon=Embora a estátua em si seja feita de pedra, o _%s_ que empunha parece real.
actors.mobs.statue.discover_hint=Podes encontrar este inimigo em qualquer lugar da masmorra.
actors.mobs.statue.name=estátua animada
actors.mobs.succubus.desc=As súcubos são demónios com a aparência de mulheres sedutoras, de ar um pouco gótico. A sua magia pode encantar um herói, impedindo-o de atacar seja quem for até o encanto passar.
actors.mobs.succubus.name=súcubo
actors.mobs.swarm.desc=O enxame mortal de moscas zumbia furiosamente. Qualquer ataque não mágico dividi-lo-ia em dois enxames mais pequenos, mas igualmente perigosos.
actors.mobs.swarm.name=enxame de moscas
actors.mobs.tengu$bombability$bombblob.desc=Uma nuvem de fumo superaquecida está a formar-se aqui. Cuidado, ela vai explodir!
actors.mobs.tengu$bombability$bombitem.cant_pickup=Está colado ao chão, não consegue movê-lo!
actors.mobs.tengu$bombability$bombitem.desc=Tengu lançou aqui uma bomba de fumo de aparência estranha, que está a expelir um fumo denso e quente. Ela está a fazer um barulho alto de tique-taque, como se estivesse a fazer a contagem decrescente para uma explosão! A bomba fixou-se no chão, pelo que não pode apanhá-la.
actors.mobs.tengu$bombability$bombitem.name=bomba de fumo
actors.mobs.tengu$fireability$fireblob.desc=Tengu lançou um pó fino que parece estar a transformar-se em vapor, prestes a inflamar!
actors.mobs.tengu$shockerability$shockerblob.desc=A energia elétrica está a acumular-se aqui, qualquer coisa que esteja sobre esta peça levará um choque na próxima jogada!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Está a emitir muita eletricidade, não consegue apanhá-lo!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu jogou aqui uma curiosa máquina, que parece ser feita de peças DM-100. A máquina está constantemente a emitir faíscas elétricas à sua volta, mas parece seguir um padrão previsível. Com toda esta eletricidade a emitir faíscas, é impossível apanhá-la.
actors.mobs.tengu$shockerability$shockeritem.name=Chocante
actors.mobs.tengu.defeated=Finalmente livre...
actors.mobs.tengu.desc=Os Tengu pertencem a um antigo clã de assassinos com o mesmo nome. São conhecidos pelo uso frequente de shurikens e armadilhas.
actors.mobs.tengu.interesting=Vamos tornar isto interessante...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Já percebi, %s!
actors.mobs.tengu.notice_have=Agora apanhei-te, %s!
actors.mobs.tengu.rankings_desc=Assassinado pelo Tengu
actors.mobs.thief.carries=O ladrão está a transportar um %s. Obviamente roubado.
actors.mobs.thief.desc=Embora estes prisioneiros circulem livremente fora das suas celas, este local é ainda a sua prisão. Com o tempo, este lugar também lhes roubou a mente e a liberdade. Há muito tempo, estes ladrões e bandidos insanos esqueceram-se de quem são e porque roubam. Estes inimigos têm mais probabilidade de roubar e fugir do que de lutar. Certifique-se de que os mantém à vista, ou poderá nunca mais ver o seu item roubado.
actors.mobs.thief.escapes=O ladrão fugiu com o seu %s!
actors.mobs.thief.name=ladrão louco
actors.mobs.thief.stole=O ladrão roubou-te %s!
actors.mobs.tormentedspirit.desc=Os espíritos atormentados são espíritos de boa índole que foram afligidos por uma maldição. Enquanto estiverem amaldiçoados, atacarão como um espectro e serão ainda mais poderosos! Pode ser possível remover a maldição usando o item certo perto do espírito. Se a maldição for removida, o espírito ficará certamente agradecido...
actors.mobs.tormentedspirit.name=espírito atormentado
actors.mobs.tormentedspirit.thank_you=Obrigado...
actors.mobs.vaultrat.desc=Este rato apresenta algumas alterações de comportamento para testar a nova IA dos inimigos do cofre: \n_-_ O seu movimento pode ser 'ouvido' através das paredes. \n_-_ Irá percorrer uma rota predefinida. \n_-_ Enquanto estiver a vaguear, o seu alcance de deteção é drasticamente reduzido na direção em que se move. \n_-_ Enquanto estiver a dormir, o seu alcance de deteção também é reduzido. \n_-_ Quando o detectar, irá 'investigar' antes de começar a caçar. Os inimigos que investigam movem-se na tua direção, mas não atacam e são mais fáceis de despistar atrás de portas e cantos.
actors.mobs.warlock.bolt_kill=O raio sombrio matou-te...
actors.mobs.warlock.desc=Quando os anões trocaram a engenharia pelas artes arcanas, os feiticeiros tomaram o poder na cidade. Começaram pela magia elemental, mas depressa passaram à demonologia e à necromancia.
actors.mobs.warlock.name=feiticeiro anão
actors.mobs.wraith.desc=Um espectro é o espírito vingativo de um pecador, cujo túmulo ou sepultura foi violado. Por ser uma entidade etérea, é muito difícil atingi-lo com uma arma comum.
actors.mobs.wraith.discover_hint=Podes encontrar este inimigo em qualquer lugar da masmorra.
actors.mobs.wraith.name=espectro
actors.mobs.yogdzewa$larva.desc=Estas minúsculas crias de Yog-Dzewa são lacaios simples e fáceis de produzir. Embora individualmente fracos, são invocados rapidamente e podem tornar-se opressores em grande número.
actors.mobs.yogdzewa$larva.name=larva de deus
actors.mobs.yogdzewa$larva.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogdzewa.darkness=A escuridão aproxima-se...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa é um Deus Antigo; uma grande monstruosidade que invade mundos mortais e os devora para alimentar o seu crescimento infinito. Os anões devem ter atraído a atenção deste horror cósmico enquanto brincavam com magias negras e, desde então, têm tentado mantê-lo contido. Yog-Dzewa tem origem numa dimensão de puro caos mágico e não pode trazer a sua verdadeira forma para este mundo. Em vez disso, criou avatares e invocou lacaios demoníacos para cumprirem as suas ordens aqui. Este olho gigante é o ponto focal do poder de Yog-Dzewa neste mundo. Embora o olho em si seja imóvel, é capaz de disparar poderosos raios de magia demoníaca e invocar uma variedade de lacaios para o auxiliar.
actors.mobs.yogdzewa.desc_spawners=Consegue sentir ondas de energia demoníaca a irradiar dos andares superiores até aos seus olhos. Algo que deixaste vivo lá em cima deve estar a canalizar poder de volta para Yog-Dzewa. _Yog usará esta energia para invocar lacaios mais poderosos!_
actors.mobs.yogdzewa.hope=SUA. ESPERANÇA. É. UMA. ILUSÃO!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=EU VEJO. TU.
actors.mobs.yogdzewa.rankings_desc=Devorado por Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Este punho é formado por pura energia luminosa. É capaz de disparar poderosos raios de luz escaldante a cada turno! Estes raios irão cegá-lo temporariamente, além de causarem danos pesados. O punho também é capaz de envolver brevemente a arena numa luz ofuscante para escapar! O punho não possui habilidades especiais que possam ser utilizadas em combate corpo a corpo.
actors.mobs.yogfist$brightfist.name=punho brilhante
actors.mobs.yogfist$brightfist.teleport=O punho teletransporta-se num clarão de luz que te cega seriamente!
actors.mobs.yogfist$burningfist.desc=Um grande punho envolto em fogo. Seus dedos crepitam ao se fechar, derramando brasas no chão.
actors.mobs.yogfist$burningfist.name=punho em chamas
actors.mobs.yogfist$darkfist.desc=Este punho é formado por pura energia negra. É capaz de disparar poderosas rajadas de magia negra a cada turno! Estas rajadas enfraquecerão a sua fonte de luz, além de causarem danos pesados. O punho também é capaz de envolver brevemente a arena em escuridão para escapar! O punho não possui habilidades especiais que possam ser utilizadas em combate corpo a corpo.
actors.mobs.yogfist$darkfist.name=punho negro
actors.mobs.yogfist$darkfist.teleport=O punho teletransporta-se numa explosão de escuridão que extingue a sua fonte de luz!
actors.mobs.yogfist$rottingfist.desc=Um enorme punho de carne podre. Uma gosma fétida escorre entre seus dedos e mancha a pedra abaixo.
actors.mobs.yogfist$rottingfist.name=punho apodrecido
actors.mobs.yogfist$rustedfist.desc=Este punho é formado por metal vivo. É uma imponente massa de metal em constante transformação, capaz de realizar poderosos ataques corpo a corpo e incapacitar os seus alvos à distância. Devido à sua enorme massa, o punho absorverá qualquer dano sofrido ao longo do tempo, em vez de imediatamente. Contudo, ele é inflexível e não consegue mover-se por passagens estreitas. Além disso, embora possa sofrer danos lentamente, o dano diferido continuará a aumentar se o punho for atingido várias vezes.
actors.mobs.yogfist$rustedfist.name=punho enferrujado
actors.mobs.yogfist$soiledfist.desc=Este punho é formado por magia terrena caótica. Ao mover-se, fará com que a vegetação brote constantemente à sua volta. Também pode disparar rajadas concentradas de terra que aprisionarão o seu alvo em videiras e raízes de crescimento rápido! O punho deriva poder desta vida vegetal e resistirá a danos com base na quantidade de vegetação alta ou sulcada perto dele!
actors.mobs.yogfist$soiledfist.name=punho sujo
actors.mobs.yogfist.desc=Este punho é um aspeto do poder de Yog-Dzewa. Os punhos estão ligados ao poder de Yog-Dzewa e estão protegidos de qualquer dano quando estão perto dos olhos.
actors.mobs.yogfist.invuln_warn=O punho é invulnerável enquanto estiver perto do olho!
actors.mobs.yogfist.rankings_desc=Devorado por Yog-Dzewa
