actors.mobs.elemental.desc=Os elementais de fogo errantes surgem como efeito secundário da invocação de entidades superiores. A sua natureza é demasiado caótica para que até o mais poderoso demonólogo os consiga controlar.
actors.mobs.elemental.name=elemental de fogo
actors.mobs.king.desc=O último rei dos anões conhecia bem os segredos da vida e da morte. Convenceu a sua corte a participar num ritual que lhes daria juventude eterna. No fim, só ele a conseguiu, juntamente com um exército de mortos-vivos.
actors.mobs.king.name=Rei dos Anões
actors.mobs.npcs.bee.desc=Apesar do pequeno tamanho, as abelhas douradas defendem ferozmente o seu mestre. No entanto, não vivem muito tempo.
actors.mobs.npcs.bee.name=abelha dourada
actors.mobs.shielded.desc=Os brutos são os maiores, mais fortes e mais resistentes de todos os gnolls. Quando ficam gravemente feridos, entram em fúria e causam ainda mais dano aos inimigos.
actors.mobs.shielded.name=Bruto blindado
actors.mobs.yog.desc=Yog-Dzewa é um Deus Antigo, uma entidade poderosa dos reinos do caos. Há um século, os antigos anões mal conseguiram vencer a guerra contra o seu exército de demónios, mas foram incapazes de matar o próprio deus. Em vez disso, aprisionaram-no nos salões por baixo da sua cidade, acreditando que estava demasiado fraco para ressurgir.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s está a carregar um _%s_. Obviamente roubado.
actors.buffs.armorevasion.name=Evasão aumentada
actors.mobs.king.defeated=Não me pode matar, %s... sou... imortal...
