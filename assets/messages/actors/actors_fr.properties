actors.hero.talent$swiftequipcooldown.name=temps de recharge de l'équipement rapide
actors.hero.talent.adventurers_intuition.desc=le duelliste identifie les armes _2,5x plus vite_ et les armures _1,75x plus vite_.\n\n_+2:_ La duelliste identifie les armes _quand elle les équipe_ et les armures _2,5x plus vite_.
actors.hero.talent.adventurers_intuition.title=l'intuition de l'aventurier
actors.hero.talent.aggressive_barrier.desc=le duelliste gagne _3 boucliers_ lorsqu'il utilise une capacité d'arme et qu'il est à 50% de santé ou moins.\n\nle duelliste gagne un bouclier de _5 lorsqu'il utilise une capacité d'arme et qu'il est à 50% de santé ou moins.
actors.hero.talent.aggressive_barrier.meta_desc=si ce talent est acquis par un autre héros, il accordera un bouclier lors d'une attaque de mêlée à faible santé, avec un temps de recharge de 50 tours.
actors.hero.talent.aggressive_barrier.title=barrière agressive
actors.hero.talent.ally_warp.desc=le Mage peut sélectionner un allié pour échanger instantanément sa place avec lui, avec une portée de _2 tuiles_.\n\nle Mage peut sélectionner un allié pour échanger instantanément sa place avec lui, à une portée de _4 tuiles_.\n\nle Mage peut sélectionner un allié pour échanger instantanément des places avec lui, à une portée de _6 tuiles_.\n\nLe Mage ne peut pas changer de place avec des alliés immobiles.
actors.hero.talent.ally_warp.title=allié warp
actors.hero.talent.arcane_vision.desc=lorsque le Mage zappe un ennemi, il obtient une vision mentale sur lui pendant _10 tours_.\n\nlorsque le Mage zappe un ennemi, il obtient une vision mentale sur lui pendant _15 tours_.
actors.hero.talent.arcane_vision.title=vision des arcanes
actors.hero.talent.assassins_reach.desc=la portée des clignements de l'Assassin par niveau de préparation passe de 1/2/3/4/6 tuiles à _1/3/4/4.\n\nla portée des clignements de l'Assassin par niveau de préparation est portée à _2/4/6/8 carreaux_, au lieu de 1/2/3/4.\n\n3:_ La portée des clignements de l'Assassin par niveau de préparation est portée à _2/5/7/10 carreaux_, au lieu de 1/2/3/4.\n\nCe clin d'œil peut traverser les dangers et les ennemis, mais pas les terrains solides comme les murs.
actors.hero.talent.assassins_reach.title=la portée de l'assassin
actors.hero.talent.aura_of_protection.desc=le paladin peut lancer _Aura de protection_, un sort qui accorde au paladin et à tous ses alliés dans un rayon de 2 carreaux _20% de résistance aux dégâts_ et l'effet du glyphe d'armure du paladin à _+50% de puissance_ pendant 20 tours, au prix de 2 charges.\n\nle paladin peut lancer _Aura de protection_, un sort qui accorde au paladin et à tous les alliés dans un rayon de 2 carreaux _30% de résistance aux dégâts_ et l'effet du glyphe d'armure du paladin à _+75% de puissance_ pendant 20 tours, au prix de 2 charges.\n\nle paladin peut lancer _Aura de protection_, un sort qui accorde au paladin et à tous ses alliés dans un rayon de 2 carreaux _40% de résistance aux dégâts_ et l'effet du glyphe d'armure du paladin à _+100% de puissance_ pendant 20 tours, au prix de 2 charges.
actors.hero.talent.aura_of_protection.title=aura de protection
actors.hero.talent.backup_barrier.desc=le Mage gagne _3 boucliers_ à chaque fois qu'il dépense la dernière charge de son bâton.\n\nle Mage gagne _5 bouclier_ à chaque fois qu'il dépense la dernière charge de son bâton.
actors.hero.talent.backup_barrier.meta_desc=si ce talent est acquis par un autre héros, il se déclenche à partir de la baguette de plus haut niveau du héros.
actors.hero.talent.backup_barrier.title=barrière de sécurité
actors.hero.talent.barkskin.desc=lorsque la gardienne marche dans l'herbe, elle gagne _0-50% de son niveau_ en armure de peau d'écorce qui s'estompe à chaque tour.\n\nen marchant dans l'herbe, la gardienne gagne _0-100% de son niveau_ en armure de peau de barque qui s'estompe à chaque tour.\n\nen marchant dans l'herbe, la gardienne gagne _0-150% de son niveau_ en armure de peau de barque qui s'estompe à chaque tour.
actors.hero.talent.barkskin.title=peau d'écorce
actors.hero.talent.beaming_ray.desc=L'Ecclésiaste peut lancer _Rayon de téléportation_ à partir d'un allié doté d'un pouvoir, au prix d'une charge. Ce rayon peut traverser les murs et téléporter l'allié à un endroit ciblé. Si un ennemi se trouve à cet endroit, l'allié apparaît à côté de l'ennemi et le prend pour cible. Le rayon de téléportation peut même téléporter des alliés normalement immobiles, mais sa portée est réduite de moitié.\n\nrayon de téléportation a une portée maximale de _4 carreaux_ et augmente le bonus de Puissance de la multitude à _+35% de dégâts_ contre l'ennemi le plus proche pendant 10 tours.\n\nle rayon de téléportation a une portée maximale de _8 carreaux_ et augmente le bonus de Puissance de la multitude à _+40% de dégâts_ contre l'ennemi le plus proche pendant 10 tours.\n\nrayon de téléportation a une portée maximale de _12 carreaux_ et augmente le bonus de Puissance de la multitude à _+45% de dégâts_ contre l'ennemi le plus proche pendant 10 tours.\n\n4:_ Rayon de téléportation a une portée maximale de _16 carreaux_ et augmente le bonus de Puissance de la multitude à _+50% de dégâts_ contre l'ennemi le plus proche pendant 10 tours.
actors.hero.talent.beaming_ray.title=rayon rayonnant
actors.hero.talent.blast_radius.desc=le rayon de l'explosion élémentaire passe de 4 à 5 tuiles.\n\nle rayon de l'explosion élémentaire passe de 4 à 6 tuiles.\n\n_+3:_ Le rayon de l'explosion élémentaire passe de 4 à _7 tuiles_.\n\n_+4:_ Le rayon de l'explosion élémentaire passe de 4 à _8 tuiles_.
actors.hero.talent.blast_radius.title=rayon de l'explosion
actors.hero.talent.bless.desc=le clerc peut lancer _Bless_, un sort qui accorde _6 tours de bénédiction et 10 boucliers_ lorsqu'il est lancé sur lui-même ou _10 tours de bénédiction et 10 soins_ lorsqu'il est lancé sur un autre personnage, au prix d'une charge.\n\nl'Ecclésiaste peut lancer _Bless_, un sort qui accorde _10 tours de bénédiction et 15 boucliers_ lorsqu'il est lancé sur lui-même ou _15 tours de bénédiction et 15 soins_ lorsqu'il est lancé sur un autre personnage, au prix d'une charge.\n\nL'excédent de soins de ce sort est converti en bouclier.
actors.hero.talent.bless.meta_desc=si ce talent est acquis par un autre héros, il augmente la précision et l'évasion du héros et de tous ses alliés de 3 % à +1 ou de 5 % à +2.
actors.hero.talent.bless.title=bénir
actors.hero.talent.body_form.desc=L'Ecclésiaste peut lancer _Body Form_, qui imprègne Trinity du pouvoir d'un enchantement ou d'un glyphe que l'Ecclésiaste a identifié lors de cette manche, au prix de 2 charges.\n\n_+1:_ Lorsque la Trinité est utilisée, l'Ecclésiaste bénéficie de l'effet choisi pendant _20 tours._\n\n_+2:_ Lorsque la Trinité est utilisée, l'Ecclésiaste bénéficie de l'effet choisi pendant _27 tours._\n\n_+3:_ Lorsque la Trinité est utilisée, l'Ecclésiaste bénéficie de l'effet choisi pendant _33 tours._\n\n_+4:_ Lorsque la Trinité est utilisée, l'Ecclésiaste bénéficie de l'effet choisi pendant _40 tours._\n\nTrinity ne peut être imprégné que d'un seul effet corporel à la fois. Le coût de charge de l'armure de Trinité est plus élevé si le glyphe choisi est rare et puissant.
actors.hero.talent.body_form.title=forme du corps
actors.hero.talent.body_replacement.desc=après avoir cligné des yeux, l'escroc laisse derrière lui un leurre en bois qui a _20 points de vie et 1-3 armure_.\n\naprès avoir cligné des yeux, le malfaiteur laisse derrière lui un leurre en bois qui a _40 points de vie et 2-6 armures_.\n\naprès avoir cligné des yeux, le malfaiteur laisse derrière lui un leurre en bois qui a _60 points de vie et 3-9 armures_.\n\naprès avoir cligné des yeux, le malfaiteur laisse derrière lui un leurre en bois qui a _80 points de vie et 4-12 armures_.\n\nUn seul leurre peut être actif à la fois.
actors.hero.talent.body_replacement.title=remplacement du corps
actors.hero.talent.body_slam.desc=lorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents subissent des dégâts égaux à _1-4 plus 25%_ de sa puissance de blocage des dégâts.\n\nlorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents subissent des dégâts égaux à _2-8 plus 50%_ de sa puissance de blocage des dégâts.\n\nlorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents subissent des dégâts égaux à _3-12 plus 75%_ de sa puissance de blocage des dégâts.\n\n4:_ Lorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents subissent des dégâts égaux à _4-16 plus 100%_ de sa puissance de blocage des dégâts.
actors.hero.talent.body_slam.title=body slam (coup de poing)
actors.hero.talent.bounty_hunter.desc=lorsque l'Assassin tue un ennemi avec un coup préparé, ses chances de perte d'objet sont augmentées de _2/4/8/16%_, par niveau de préparation.\n\nlorsque l'Assassin tue un ennemi avec un coup préparé, ses chances de perte d'objet sont augmentées de _4/8/16/32%_, par niveau de préparation.\n\n3:_ Lorsque l'Assassin tue un ennemi avec un coup préparé, ses chances de perte d'objet sont augmentées de _6/12/24/48%_, par niveau de préparation.
actors.hero.talent.bounty_hunter.title=chasseur de primes
actors.hero.talent.cached_rations.desc=le voleur peut trouver _2 rations de ravitaillement_ placées dans des coffres pendant qu'il explore les prochains étages du donjon.\n\n_+2:_ Le voleur peut trouver _3 rations de ravitaillement_ placées dans des coffres pendant qu'il explore les étages suivants du donjon.\n\nLes rations de ravitaillement se mangent rapidement, restaurent un niveau modéré de satiété, soignent 5 pv et restaurent 1 charge à la cape des ombres.
actors.hero.talent.cached_rations.title=rations en cachette
actors.hero.talent.cleanse.desc=le clerc peut lancer _Cleanse_, un sort qui _supprime les effets de statut négatifs_ du clerc et de ses alliés proches, et leur accorde _10 boucliers_, au prix de 2 charges.\n\nle Clerc peut lancer _Cleanse_, un sort qui _attribue 3 tours d'immunité d'état négatif_ au Clerc et à tout allié proche, et leur accorde _20 boucliers_ au prix de 2 charges.\n\nle clerc peut lancer _Cleanse_, un sort qui _attribue 5 tours d'immunité d'état négatif_ au clerc et à tout allié proche, et leur accorde _30 boucliers_ au prix de 2 charges.
actors.hero.talent.cleanse.meta_desc=si ce talent est acquis par un autre héros, il nettoie les effets de statut négatifs sur le héros après l'utilisation d'une baguette ou d'un artefact, 10/20/30% du temps à +1/+2/+3.
actors.hero.talent.cleanse.title=nettoyer
actors.hero.talent.cleave.desc=le temps supplémentaire dont bénéficie le gladiateur lorsqu'il tue est porté à _30 tours_, au lieu de 15.\n\n_+2:_ Le temps supplémentaire dont bénéficie le gladiateur pour tuer est porté à _45 tours_, au lieu de 15.\n\n3:_ Le temps supplémentaire dont dispose le gladiateur pour tuer est porté à _60 tours_, au lieu de 15.
actors.hero.talent.cleave.title=cliver
actors.hero.talent.cloned_armor.desc=le clone d'ombre gagne _12%_ de la valeur d'armure du héros et a _25% de chances_ d'utiliser le glyphe sur l'armure du héros.\n\nle clone d'ombre gagne _24%_ de la valeur d'armure du héros et a _50% de chances_ d'utiliser le glyphe sur l'armure du héros.\n\nle clone d'ombre gagne _36%_ de la valeur d'armure du héros et a _75% de chances_ d'utiliser le glyphe sur l'armure du héros.\n\nle clone d'ombre gagne _48%_ de la valeur d'armure du héros et a _100% de chances_ d'utiliser le glyphe sur l'armure du héros.
actors.hero.talent.cloned_armor.title=armure clonée
actors.hero.talent.close_the_gap.desc=le duelliste clignote _jusqu'à deux tuiles_ vers sa cible lorsqu'il entame un duel.\n\nle duelliste clignote _jusqu'à trois carreaux_ en direction de sa cible lorsqu'il commence un duel.\n\nle duelliste clignote _jusqu'à quatre carreaux_ en direction de sa cible lorsqu'il commence un duel.\n\nle duelliste clignote _jusqu'à cinq carreaux_ vers sa cible lorsqu'il commence un duel.\n\nCe clignotement peut traverser les obstacles et les ennemis, mais pas les terrains solides comme les murs. Le clignotement est pris en compte pour déterminer si un ennemi est à portée pour être défié.
actors.hero.talent.close_the_gap.title=combler le fossé
actors.hero.talent.combined_energy.desc=si le moine utilise une capacité d'arme et une capacité _4+ énergie_ à moins de 5 tours d'intervalle, il regagne 1 énergie dépensée.\n\nsi le moine utilise une capacité d'arme et une capacité d'énergie _3+ à moins de 5 tours d'intervalle, il récupère 1 énergie dépensée.\n\nsi le moine utilise une capacité d'arme et une capacité _2+ énergie_ à moins de 5 tours l'une de l'autre, il récupère 1 énergie dépensée.
actors.hero.talent.combined_energy.title=énergie combinée
actors.hero.talent.combined_lethality.desc=si le champion attaque avec une arme de mêlée immédiatement après avoir utilisé la capacité d'une autre arme, cette attaque exécutera tout ennemi qui n'est pas un boss et qui a _moins de 13 % de PV_.\n\nsi le champion attaque avec une arme de mêlée immédiatement après avoir utilisé la capacité d'une autre arme, cette attaque exécutera tout ennemi qui n'est pas un boss et qui n'a plus que _27% de PV_.\n\nsi le champion attaque avec une arme de mêlée immédiatement après avoir utilisé la capacité d'une autre arme, cette attaque exécutera tout ennemi qui n'est pas un boss et qui n'a plus que _40% de PV_.\n\nCette attaque peut être une attaque d'arme de mêlée normale ou faire partie de la capacité d'une arme.
actors.hero.talent.combined_lethality.title=létalité combinée
actors.hero.talent.conserved_magic.desc=chaque zap de magie sauvage utilise désormais _0,33 charge_ au lieu de 0,5, et la magie sauvage a _25% de chances_ de ne pas passer un tour.\n\nchaque zap de magie sauvage utilise désormais _0,225 charge_ au lieu de 0,5, et la magie sauvage a _50% de chances_ de ne pas passer un tour.\n\nchaque zap de magie sauvage utilise désormais _0,15 charge_ au lieu de 0,5, et la magie sauvage a _75% de chances_ de ne pas passer un tour.\n\nchaque zap de magie sauvage utilise désormais _0,1 charge_ au lieu de 0,5, et la magie sauvage a _100% de chances_ de ne pas passer un tour.
actors.hero.talent.conserved_magic.title=magie conservée
actors.hero.talent.counter_ability.desc=si la duelliste utilise une capacité d'arme dans les 3 tours suivant l'attaque de son image rémanente, elle regagnera instantanément _0,38 charge_.\n\nsi le duelliste utilise une capacité d'arme dans les 3 tours suivant l'attaque de son image rémanente, il regagnera instantanément _0,77 charge_.\n\nsi le duelliste utilise une capacité d'arme dans les 3 tours suivant l'attaque de son image rémanente, il regagnera instantanément _1.13 charge_.\n\nsi le duelliste utilise une capacité d'arme dans les 3 tours suivant l'attaque de son image rémanente, il regagnera instantanément _1,5 charge_.
actors.hero.talent.counter_ability.title=capacité de riposte
actors.hero.talent.deadly_followup.desc=lorsque la duelliste touche un ennemi avec une arme de jet, elle lui inflige _10% de dégâts de mêlée supplémentaires_ pendant 5 tours.\n\nle duelliste est capable de toucher un ennemi avec une arme de jet et de lui infliger _20% de dégâts supplémentaires en mêlée_ pendant 5 tours.\n\n3:_ Lorsque la duelliste touche un ennemi avec une arme de jet, elle lui inflige _30% de dégâts supplémentaires en mêlée pendant 5 tours.
actors.hero.talent.deadly_followup.title=suivi mortel
actors.hero.talent.deathless_fury.desc=le Berserk se déclenche automatiquement si le Berserker est sur le point de mourir et que sa rage est supérieure ou égale à 100%, mais son temps de recharge est de _3 niveaux de héros_ lorsque cela se produit.\n\nberserk se déclenche automatiquement si le Berserker est sur le point de mourir et que sa rage est supérieure ou égale à 100%, mais son temps de recharge est de _2 niveaux de héros_.\n\nberserk se déclenche automatiquement si le Berserker est sur le point de mourir et que sa rage est supérieure ou égale à 100%, mais son temps de recharge est de _1 niveau de héros_.\n\nNotez que le Berserker mourra quand même s'il a 0 HP à la fin de la berserking.
actors.hero.talent.deathless_fury.title=fureur de mort
actors.hero.talent.deathly_durability.desc=les ennemis tués par une marque de mort confèrent au voleur un bouclier égal à _13%_ de leur pv au moment où ils ont été marqués.\n\nles ennemis tués par une marque de mort donnent au Rogue un bouclier égal à _25%_ de leur pv au moment où ils ont été marqués.\n\nles ennemis tués par une marque de mort confèrent au Voleur un bouclier égal à _38%_ de leur pv lorsqu'ils ont été marqués.\n\nles ennemis tués par une marque de mort confèrent au voleur un bouclier égal à _50%_ de leur pv lorsqu'ils ont été marqués.
actors.hero.talent.deathly_durability.title=durabilité mortelle
actors.hero.talent.desperate_power.desc=les baguettes et les bâtons du Mage gagnent _+1 niveau_ lors de leur dernière décharge.\n\n_+2:_ Les baguettes et bâtons du Mage gagnent _+2 niveaux_ sur leur dernière décharge lorsqu'ils n'en ont plus.\n\nles baguettes et les bâtons du Mage gagnent _+3 niveaux_ sur leur dernier zap lorsqu'ils n'ont plus de charge.
actors.hero.talent.desperate_power.title=un pouvoir désespéré
actors.hero.talent.directed_power.desc=l'attaque directe de la frappe élémentaire gagne _+30% de puissance d'enchantement_ pour chaque ennemi à portée de l'effet de la frappe élémentaire, y compris la cible de l'attaque.\n\nl'attaque directe de la frappe élémentaire gagne _+60% de puissance d'enchantement_ pour chaque ennemi à portée de l'effet de la frappe élémentaire, y compris la cible de l'attaque.\n\nl'attaque directe de la frappe élémentaire gagne _+90% de puissance d'enchantement_ pour chaque ennemi à portée de l'effet de la frappe élémentaire, y compris la cible de l'attaque.\n\nl'attaque directe de la frappe élémentaire gagne _+120% de puissance d'enchantement_ pour chaque ennemi à portée de l'effet de la frappe élémentaire, y compris la cible de l'attaque.
actors.hero.talent.directed_power.title=puissance dirigée
actors.hero.talent.divine_intervention.desc=lorsque le clerc est en forme ascendante, il peut lancer _Intervention divine_, ce qui lui confère, ainsi qu'à tous ses alliés, un bonus de _150 boucliers_ et prolonge la forme ascendante de _3 tours_\n\n2:_ Lorsqu'il est en forme d'ascension, le clerc peut lancer _Intervention divine_, qui augmente le bouclier du clerc et de tous ses alliés jusqu'à _200 et prolonge la forme d'ascension de _4 tours_\n\nen forme d'Ascension, le Clerc peut lancer _Intervention divine_, qui augmente le bouclier du Clerc et de tous ses alliés jusqu'à _250 et prolonge la forme d'Ascension de _5 tours_\n\nen forme d'Ascension, le Clerc peut lancer _Intervention divine_, qui augmente le bouclier du Clerc et de tous ses alliés jusqu'à _300 et prolonge la forme d'Ascension de _6 tours_\n\nL'Intervention divine coûte 5 tome et ne peut être lancée qu'une seule fois dans la même forme ascendante.
actors.hero.talent.divine_intervention.title=intervention divine
actors.hero.talent.divine_sense.desc=le clerc peut lancer _Sens divin_, un sort qui lui confère _8 carreaux_ de Vision mentale pendant 50 tours et ne prend pas de temps à lancer, au prix de 2 charges.\n\nle clerc peut lancer _Sens divin_, un sort qui lui accorde _12 carreaux_ de Vision mentale pendant 50 tours et ne prend pas de temps à lancer, au prix de 2 charges.
actors.hero.talent.divine_sense.meta_desc=si ce talent est acquis par un autre héros, il lui accordera la vision mentale pendant un bref instant après avoir utilisé une baguette ou un artefact d'une portée de 3 carreaux à +1 ou de 5 carreaux à +2.
actors.hero.talent.divine_sense.title=sens divin
actors.hero.talent.double_jump.desc=si le guerrier effectue un second saut dans les 3 tours, ce saut a un coût de charge réduit de 16%.\n\nsi le guerrier effectue un second saut dans les 3 tours, ce saut a un coût de charge réduit de 30 %.\n\nsi le guerrier effectue un second saut dans les 3 tours, ce saut a un coût de charge réduit de 40 %.\n\nsi le guerrier effectue un second saut dans les 3 tours, ce saut a un coût de charge réduit de 50 %.
actors.hero.talent.double_jump.title=double saut
actors.hero.talent.double_mark.desc=le marquage d'une deuxième cible en même temps que la première a un coût de charge réduit de 30 %.\n\n2:_ Le marquage d'une deuxième cible en même temps que la première a un coût de charge réduit de 50 %.\n\n3:_ Le marquage d'une deuxième cible en même temps que la première a un coût de charge réduit de 65%.\n\n4:_ Le marquage d'une deuxième cible en même temps que la première a un coût de charge réduit de 75 %.
actors.hero.talent.double_mark.title=double marque
actors.hero.talent.durable_projectiles.desc=les armes de jet ont une durabilité de _+50%_ lorsqu'elles sont utilisées par la chasseresse.\n\n_+2:_ Les armes de jet ont une durabilité de _+75%_ lorsqu'elles sont utilisées par la Chasseuse.
actors.hero.talent.durable_projectiles.title=des projectiles durables
actors.hero.talent.durable_tips.desc=les fléchettes à pointe ont une durabilité _2x_ lorsque le gardien les utilise.\n\n_+2:_ Les fléchettes à pointe ont une durabilité _3x_ lorsque le gardien les utilise.\n\n_+3:_ Les fléchettes à pointe ont une durabilité _4x_ lorsque le gardien les utilise.
actors.hero.talent.durable_tips.title=conseils durables
actors.hero.talent.eagle_eye.desc=la portée de vision du faucon spirituel passe de 6 à _7 tuiles_.\n\nla portée de vision de l'esprit faucon passe de 6 à 8 tuiles.\n\nla portée de vision de l'esprit faucon passe de 6 à 9 carreaux et il bénéficie de 2 carreaux de vision d'esprit.\n\nla portée de vision de l'esprit faucon passe de 6 à 10 carreaux et il bénéficie de 3 carreaux de vision d'esprit.
actors.hero.talent.eagle_eye.title=œil de lynx
actors.hero.talent.elemental_power.desc=la puissance de l'explosion élémentaire est augmentée de _25%_.\n\nla puissance de l'explosion élémentaire est augmentée de _50%_.\n\n_+3:_ La puissance de l'explosion élémentaire est augmentée de _75%_.\n\n_+4:_ La puissance de l'explosion élémentaire est augmentée de _100%_.
actors.hero.talent.elemental_power.title=pouvoir élémentaire
actors.hero.talent.elemental_reach.desc=la portée de la frappe élémentaire passe de 4 à 5 carreaux et sa largeur de 65 à 75 degrés.\n\n2:_ La portée de la frappe élémentaire passe de 4 à 6 carreaux et sa largeur de 65 à 85 degrés.\n\n3:_ La portée de la frappe élémentaire passe de 4 à 7 tuiles et sa largeur passe de 65 à 95 degrés.\n\n4:_ La portée de la frappe élémentaire passe de 4 à 8 carreaux et sa largeur de 65 à 105 degrés.
actors.hero.talent.elemental_reach.title=portée élémentaire
actors.hero.talent.elimination_match.desc=si le duelliste lance un nouveau défi dans les 3 tours suivant la fin d'un duel, le coût de ce défi est réduit de 16%.\n\nsi le duelliste lance un nouveau défi dans les 3 tours suivant la fin d'un duel, le coût de ce défi est réduit de 30 %.\n\nsi le duelliste lance un nouveau défi dans les 3 tours suivant la fin d'un duel, le coût de ce défi est réduit de 40 %.\n\nsi le duelliste lance un nouveau défi dans les 3 tours suivant la fin d'un duel, le coût de ce défi est réduit de 50 %.
actors.hero.talent.elimination_match.title=match par élimination
actors.hero.talent.empowered_strike.desc=le premier coup en mêlée que le mage de guerre porte avec son bâton après l'avoir zappé inflige _+16% de dégâts_ et l'effet bonus du bâton gagne _+50% de puissance_.\n\n2:_ La première attaque en mêlée du mage de guerre avec son bâton après avoir zappé inflige _+33% de dégâts_ et l'effet bonus du bâton gagne _+100% de puissance_.\n\n3:_ La première attaque en mêlée du mage de guerre avec son bâton après l'avoir zappé inflige _+50% de dégâts_ et l'effet bonus du bâton gagne _+150% de puissance_.
actors.hero.talent.empowered_strike.title=grève renforcée
actors.hero.talent.empowering_meal.desc=manger accorde au Mage un bonus de dégâts de _2_ les 3 prochaines fois qu'il inflige des dégâts avec une baguette.\n\n2:_ Manger accorde au Mage un bonus de dégâts de _3_ les 3 prochaines fois qu'il inflige des dégâts avec une baguette.
actors.hero.talent.empowering_meal.title=repas responsabilisant
actors.hero.talent.endless_rage.desc=le Berserker peut atteindre un maximum de _116% de rage_.\n\nle Berserker peut atteindre un maximum de _133% de rage_.\n\n_+3:_ Le Berserker peut atteindre un maximum de _150% de rage_.\n\nChaque point de rage au-dessus de 100% augmente le bouclier berserk de 1% et réduit le temps de recharge de 1%, mais n'augmente pas le bonus de dégâts au-delà de +50%.
actors.hero.talent.endless_rage.title=une rage sans fin
actors.hero.talent.energizing_meal.desc=manger prend au Mage 1 tour et lui accorde _5 tours de recharge de baguette_.\n\n_+2:_ Manger de la nourriture prend au Mage 1 tour et lui accorde _8 tours de recharge de baguette_.
actors.hero.talent.energizing_meal.title=repas énergétique
actors.hero.talent.enhanced_combo.desc=lorsque le combo du gladiateur est égal ou supérieur à 7, la portée du knockback de Clobber passe à 3, il inflige le vertige et peut faire tomber les ennemis dans des fosses.\n\n+2:_ En plus des avantages de +1, lorsque le combo du gladiateur est supérieur ou égal à 9, la parade fonctionne sur les attaques multiples.\n\n+3:_ En plus des avantages de +1 et +2, le Gladiateur peut sauter jusqu'à combo/3 tuiles lorsqu'il utilise Coup de poing, Écrasement ou Fureur.
actors.hero.talent.enhanced_combo.title=combo amélioré
actors.hero.talent.enhanced_lethality.desc=l'Assassin peut assassiner les ennemis laissés à moins de _4/13/27/67% de santé_ par niveau de préparation, contre 3/10/20/50% auparavant.\n\nl'assassin peut assassiner les ennemis laissés à moins de _5/17/33/83% de points de vie_ par niveau de préparation, au lieu de 3/10/20/50%.\n\nl'assassin peut assassiner les ennemis laissés à moins de _6/20/40/100% de points de vie_ par niveau de préparation, au lieu de 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=létalité accrue
actors.hero.talent.enhanced_rings.desc=lorsque le voleur utilise un artefact, ses anneaux bénéficient d'une amélioration de +1 pendant _3 tours_.\n\nlorsque le voleur utilise un artefact, ses anneaux bénéficient d'une amélioration de +1 pendant _6 tours_.\n\nlorsque le voleur utilise un artefact, ses anneaux bénéficient d'une amélioration de +1 pendant _9 tours_.
actors.hero.talent.enhanced_rings.title=bagues renforcées
actors.hero.talent.enlightening_meal.desc=la consommation de nourriture prend 1 tour à l'Ecclésiaste et lui octroie _0,67 charge_ sur son tome sacré.\n\n_+2:_ En mangeant, l'Ecclésiaste effectue 1 tour et bénéficie de _1 charge_ sur son tome sacré.
actors.hero.talent.enlightening_meal.meta_desc=si ce talent est acquis par un autre héros, il accordera à la place 2 tours de recharge de baguette et d'artefact à +1, ou 3 tours à +2. Ce talent ne peut pas être utilisé pour permettre à la corne d'abondance de se recharger elle-même.
actors.hero.talent.enlightening_meal.title=Repas éclairant
actors.hero.talent.enraged_catalyst.desc=les enchantements et les malédictions sur l'arme du Berserker se déclenchent d'autant plus souvent qu'il a de la rage, jusqu'à un maximum de _15% de plus_ à 100% de rage.\n\nles enchantements et les malédictions de l'arme du Berserker se déclenchent d'autant plus souvent qu'il a de la rage, jusqu'à un maximum de _30% de plus_ à 100% de rage.\n\nles enchantements et malédictions de l'arme du Berserker se déclenchent d'autant plus souvent qu'il a de la rage, jusqu'à un maximum de _45% de rage en plus_ à 100% de rage.
actors.hero.talent.enraged_catalyst.title=catalyseur enragé
actors.hero.talent.evasive_armor.desc=en course libre, le coureur libre gagne _+1 évasion_ supplémentaire par point de force excédentaire sur son armure.\n\n_+2:_ Lors d'une course libre, le coureur libre gagne _+2 évasion_ supplémentaire par point de force excédentaire sur son armure.\n\n3:_ En course libre, le coureur libre gagne _+3 évasion_ supplémentaire par point de force excédentaire sur son armure.
actors.hero.talent.evasive_armor.title=armure évasive
actors.hero.talent.even_the_odds.desc=le guerrier inflige un bonus de _5% de dégâts_ supplémentaires à chaque ennemi situé dans un rayon de 2 tuiles à la fin de l'endurcissement.\n\nle guerrier inflige un bonus de _10% de dégâts_ supplémentaires à chaque ennemi situé dans un rayon de 2 tuiles lorsque la résistance prend fin.\n\nle guerrier inflige un bonus supplémentaire de _15% de dégâts_ à chaque ennemi situé dans un rayon de 2 tuiles lorsque le sort s'achève.\n\nle guerrier inflige un bonus de _20% de dégâts_ supplémentaires à chaque ennemi situé dans un rayon de 2 tuiles lorsque le sort s'achève.
actors.hero.talent.even_the_odds.title=égaliser les chances
actors.hero.talent.excess_charge.desc=lorsque le bâton du mage de guerre est complètement chargé, sa prochaine décharge lui confère _0,67 bouclier_ par niveau du bâton.\n\nlorsque le bâton du mage de guerre est complètement chargé, son prochain zap lui confère _1,33 bouclier_ par niveau du bâton.\n\nlorsque le bâton du mage de guerre est complètement chargé, son prochain zap lui confère _2 boucliers_ par niveau du bâton.
actors.hero.talent.excess_charge.title=charge excessive
actors.hero.talent.expanding_wave.desc=la portée d'Onde de choc passe de 5 à 6 tuiles et sa largeur de 60 à 75 degrés.\n\n_+2:_ La portée de l'onde de choc passe de 5 à _7 carreaux_ et sa largeur passe de 60 à _90 degrés_.\n\n3:_ La portée d'Onde de choc passe de 5 à 8 carreaux et sa largeur passe de 60 à 105 degrés.\n\n4:_ La portée d'Onde de choc passe de 5 à 9 carreaux et sa largeur passe de 60 à 120 degrés.
actors.hero.talent.expanding_wave.title=onde en expansion
actors.hero.talent.expose_weakness.desc=les ennemis qui attaquent l'image rémanente du duelliste deviennent faibles et vulnérables pendant _2 tours_.\n\nles ennemis qui attaquent l'image rémanente du duelliste deviennent faibles et vulnérables pendant _4 tours_.\n\nles ennemis qui attaquent l'image secondaire du duelliste deviennent faibles et vulnérables pendant _6 tours_.\n\nles ennemis qui attaquent l'image secondaire du duelliste deviennent faibles et vulnérables pendant _8 tours_.
actors.hero.talent.expose_weakness.title=exposer les faiblesses
actors.hero.talent.fan_of_blades.desc=les lames spectrales peuvent toucher jusqu'à _1 cible supplémentaire_ pour 50% des dégâts. La cible doit être visible et se trouver dans un cône AOE de 30 degrés.\n\nles lames spectrales peuvent toucher jusqu'à _2 cibles supplémentaires_ pour 50% de dégâts. Les cibles doivent être visibles et se trouver dans un cône AOE de _60 degrés.\n\nles lames spectrales peuvent toucher jusqu'à _3 cibles supplémentaires_ pour 50% de dégâts. Les cibles doivent être visibles et se trouver dans un cône AOE de _90 degrés.\n\nles lames spectrales peuvent toucher jusqu'à _4 cibles supplémentaires_ en leur infligeant 50% de dégâts. Les cibles doivent être visibles et se trouver dans un cône AOE de _120 degrés.
actors.hero.talent.fan_of_blades.title=ventilateur de pales
actors.hero.talent.farsight.desc=la portée de vision du tireur d'élite est _augmentée de 25%_.\n\nla portée de vision du tireur d'élite est _augmentée de 50%_.\n\n_+3:_ La portée de vision du tireur d'élite est _augmentée de 75 %_.
actors.hero.talent.farsight.title=clairvoyance
actors.hero.talent.fear_the_reaper.desc=lorsqu'un ennemi marqué par la mort atteint 0 pv, il devient _handicapé_.\n\n2:_ Lorsqu'un ennemi marqué par la mort atteint 0 pv, il devient _effrayé et estropié_.\n\n3:_ Lorsqu'un ennemi marqué par la mort atteint 0 pv, il devient _effrayé et paralysé_ et les ennemis situés dans un rayon de 3 tuiles deviennent _paralysés_.\n\nlorsqu'un ennemi marqué par la mort atteint 0 pv, il devient _effrayé et estropié_ et les ennemis dans un rayon de 3 tuiles deviennent _effrayés et estropiés_.
actors.hero.talent.fear_the_reaper.title=craindre la faucheuse
actors.hero.talent.feigned_retreat.desc=si un ennemi attaque l'image rémanente de la duelliste, elle gagne _2 tours_ de hâte.\n\nsi un ennemi attaque l'image rémanente du duelliste, il gagne _4 tours_ de hâte.\n\nsi un ennemi attaque l'image rémanente du duelliste, il gagne _6 tours_ de hâte.\n\nsi un ennemi attaque l'image rémanente du duelliste, il gagne _8 tours_ de hâte.
actors.hero.talent.feigned_retreat.title=fausse retraite
actors.hero.talent.fire_everything.desc=la magie sauvage tire désormais _5 fois_ au lieu de 4, et chaque baguette a _25% de chances_ d'être utilisable 3 fois.\n\nla magie sauvage tire maintenant _6 fois_ au lieu de 4, et chaque baguette a _50% de chances_ d'être utilisable 3 fois.\n\n_+3:_ La magie sauvage tire désormais _7 fois_ contre 4 auparavant, et chaque baguette a _75% de chances_ d'être utilisable 3 fois.\n\n4:_ La magie sauvage tire désormais _8 fois_ contre 4 auparavant, et chaque baguette a _100% de chances_ d'être utilisable 3 fois.
actors.hero.talent.fire_everything.title=tout brûler
actors.hero.talent.flash.desc=lorsqu'il est en forme ascendante, le clerc peut lancer _Flash_ pour se téléporter jusqu'à _3 tuiles_.\n\n2:_ Lorsqu'il est en forme ascendante, l'Ecclésiaste peut lancer _Flash_ pour se téléporter jusqu'à _4 tuiles_.\n\nen forme ascendante, le clerc peut lancer _Flash_ pour se téléporter jusqu'à _5 tuiles.\n\nen forme ascendante, le clerc peut lancer _Flash_ pour se téléporter jusqu'à _6 tuiles.\n\nFlash coûte 2 charges de tome au départ, et 1 charge supplémentaire pour chaque utilisation dans la même forme ascendante.
actors.hero.talent.flash.title=flash
actors.hero.talent.focused_meal.desc=manger prend au duelliste 1 tour et lui octroie _0,67 charge_ sur ses armes.\n\n_+2:_ Manger prend au duelliste 1 tour et lui accorde _1 charge_ sur ses armes.
actors.hero.talent.focused_meal.meta_desc=si ce talent est acquis par un autre héros, il accorde à la place un bonus de dégâts au prochain coup égal à son niveau/3 à +1, ou à son niveau/2 à +2.
actors.hero.talent.focused_meal.title=repas ciblé
actors.hero.talent.followup_strike.desc=lorsque la chasseresse touche un ennemi avec son arc ou une arme de jet, sa prochaine attaque de mêlée contre cet ennemi inflige _2 dégâts bonus_.\n\nlorsque la chasseresse touche un ennemi avec son arc ou une arme de jet, sa prochaine attaque de mêlée contre cet ennemi inflige _3 points de dégâts supplémentaires_.
actors.hero.talent.followup_strike.title=grève de suivi
actors.hero.talent.go_for_the_eyes.desc=les attaques du faucon spirituel aveuglent les ennemis pendant _2 tours_.\n\n_+2:_ Les attaques de l'esprit faucon aveuglent les ennemis pendant _5 tours_.\n\n_+3:_ Les attaques de l'esprit faucon aveuglent les ennemis pendant _5 tours_ et les paralysent pendant _2 tours_.\n\n4:_Les attaques de l'esprit faucon aveuglent les ennemis pendant _5 tours_ et les paralysent pendant _5 tours_.
actors.hero.talent.go_for_the_eyes.title=les yeux sont à l'honneur
actors.hero.talent.growing_power.desc=les boosts d'attaque et de vitesse de déplacement de la puissance de la nature sont augmentés à _38% et 125%_, au lieu de 33% et 100%.\n\nles boosts d'attaque et de vitesse de déplacement de la puissance de la nature sont augmentés à _42% et 150%_, au lieu de 33% et 100%.\n\n3:_ Les boosts d'attaque et de vitesse de déplacement de la puissance de la nature sont augmentés à _46% et 175%_, au lieu de 33% et 100%.\n\n4:_ Les boosts d'attaque et de vitesse de déplacement de la puissance de la nature sont augmentés à _50% et 200%_, au lieu de 33% et 100%.
actors.hero.talent.growing_power.title=puissance croissante
actors.hero.talent.hallowed_ground.desc=le prêtre peut lancer _Hallowed Ground_, un sort qui sanctifie le terrain dans une zone de _3x3_ pendant 20 tours, au prix de 2 charges.\n\nle prêtre peut lancer _Hallowed Ground_, un sort qui scelle le terrain dans une zone de _5x5_ pendant 20 tours, au prix de 2 charges.\n\nle prêtre peut lancer _Hallowed Ground_, un sort qui scelle le terrain dans une zone de _7x7_ pendant 20 tours, au prix de 2 charges.\n\nLorsqu'il est lancé, Hallowed Ground soigne les alliés de 15 PV, enracine brièvement les ennemis et répand de l'herbe courte. Par la suite, elle soigne lentement les alliés, paralyse les ennemis et fait pousser de l'herbe haute de façon aléatoire. La terre sacrée confère un bouclier au prêtre au lieu de le soigner et est détruite par le feu.
actors.hero.talent.hallowed_ground.title=terre sacrée
actors.hero.talent.hasty_retreat.desc=après avoir cligné des yeux, le voleur gagne _1 tour_ de hâte et d'invisibilité.\n\naprès avoir cligné des yeux, le voleur gagne _2 tours_ de hâte et d'invisibilité.\n\n+3:_ Après avoir cligné des yeux, le voleur gagne _3 tours_ de hâte et d'invisibilité.\n\n4:_ Après avoir cligné des yeux, le voleur gagne _4 tours_ de hâte et d'invisibilité.
actors.hero.talent.hasty_retreat.title=retraite précipitée
actors.hero.talent.hearty_meal.desc=manger de la nourriture soigne le guerrier de _4 HP_ lorsqu'il est à 33% de santé ou moins.\n\n_+2:_ Manger de la nourriture soigne le guerrier pour _6 HP_ lorsqu'il est à 33% de points de vie ou moins.
actors.hero.talent.hearty_meal.title=repas copieux
actors.hero.talent.heightened_senses.desc=la chasseresse bénéficie d'une vision mentale sur les personnages situés dans un rayon de _2 tuiles de sa position_.\n\nla Chasseuse gagne la vision mentale sur les personnages situés dans un rayon de _3 tuiles de sa position_.
actors.hero.talent.heightened_senses.title=des sens accrus
actors.hero.talent.heroic_energy.desc=la capacité d'armure du héros a un coût de charge réduit de 12 %.\n\nla capacité d'armure du héros a un coût de charge réduit de _23%_.\n\n_+3:_ La capacité d'armure du héros a un coût de charge réduit de _32%_.\n\n_+4:_ La capacité d'armure du héros a un coût de charge réduit de _40%.
actors.hero.talent.heroic_energy.rat_title=l'energie ratroique
actors.hero.talent.heroic_energy.title=énergie héroïque
actors.hero.talent.hold_fast.desc=lorsque le guerrier attend, il gagne _1-2 armure_ et ralentit la dégradation des buffs de combo et de bouclier de _50%_ jusqu'à ce qu'il se déplace.\n\n_+2:_ Lorsque le guerrier attend, il gagne _2-4 armures_ et ralentit la dégradation des buffs de combo et de bouclier de _75%_ jusqu'à ce qu'il se déplace.\n\n_+3:_ Lorsque le guerrier attend, il gagne _3-6 armures_ et ralentit la dégradation des buffs de combo et de bouclier de _100%_ jusqu'à ce qu'il se déplace.
actors.hero.talent.hold_fast.title=tenir bon
actors.hero.talent.holy_intuition.desc=le clerc peut lancer _Intuition sacrée_, un sort qui révèle si un objet est maudit au prix de _3 charges_\n\nle clerc peut lancer _Intuition sacrée_, un sort qui révèle si un objet est maudit au prix de _2 charges_
actors.hero.talent.holy_intuition.meta_desc=si ce talent est acquis par un autre héros, il permettra au héros d'identifier l'état de malédiction d'un objet maudit juste avant de l'équiper, 15% du temps à +1 ou 25% du temps à +2.
actors.hero.talent.holy_intuition.title=sainte intuition
actors.hero.talent.holy_lance.desc=le prêtre peut lancer _Lance sacrée_, un sort dévastateur qui inflige _30-55 dégâts_ au prix de 4 charges.\n\nle prêtre peut lancer _Lance sacrée_, un sort dévastateur qui inflige _45-83 points de dégâts_ au prix de 4 charges.\n\nle prêtre peut lancer _Lance sacrée_, un sort dévastateur qui inflige _60-110 points de dégâts_ au prix de 4 charges.\n\nLance sacrée inflige toujours le maximum de dégâts aux ennemis démoniaques et morts-vivants. La Lance sacrée a un temps de recharge de 30 tours avant de pouvoir être lancée à nouveau.
actors.hero.talent.holy_lance.title=lance sacrée
actors.hero.talent.impact_wave.desc=lorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents sont repoussés de _2 tuiles_ et ont _25% de chances_ de devenir vulnérables pendant 5 tours.\n\nlorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents sont repoussés de _3 carreaux_ et ont _50% de chances_ de devenir vulnérables pendant 5 tours.\n\nlorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents sont repoussés de _4 carreaux_ et ont _75% de chances_ de devenir vulnérables pendant 5 tours.\n\nlorsque le guerrier atterrit après avoir sauté, tous les ennemis adjacents sont repoussés de _5 carreaux_ et ont _100% de chances_ de devenir vulnérables pendant 5 tours.
actors.hero.talent.impact_wave.title=onde de choc
actors.hero.talent.improvised_projectiles.desc=le guerrier peut aveugler un ennemi pendant _2 tours_ en lui lançant n'importe quel objet qui n'est pas une arme de jet. Le temps de recharge est de 50 tours.\n\nle guerrier peut aveugler un ennemi pendant _3 tours_ en lui lançant n'importe quel objet qui n'est pas une arme de jet. Cette action a un temps de recharge de 50 tours.
actors.hero.talent.improvised_projectiles.title=projectiles improvisés
actors.hero.talent.inscribed_power.desc=lorsque le Mage lit un parchemin ou utilise un objet de sort, ses _deux prochains coups de baguette_ gagnent +2 niveaux.\n\nlorsque le Mage lit un parchemin ou utilise un objet de sort, ses _3 prochains coups de baguette_ gagnent +2 niveaux.\n\nLe nombre de coups de baguette améliorés est doublé lors de l'utilisation d'un parchemin d'amélioration, de transmutation ou d'objets d'alchimie qui doivent être fabriqués à l'aide de ces parchemins.\n\nPour les objets d'alchimie dont les quantités produites sont plus importantes (par exemple, la plupart des sorts), ce talent a une chance de se déclencher en fonction du nombre d'objets produits.
actors.hero.talent.inscribed_power.title=pouvoir inscrit
actors.hero.talent.inscribed_stealth.desc=le voleur gagne _3 tours_ d'invisibilité après avoir lu un parchemin ou utilisé un objet de sort.\n\nle voleur gagne _5 tours_ d'invisibilité après avoir lu un parchemin ou utilisé un objet de sort.\n\nLa durée d'invisibilité est doublée en cas d'utilisation d'un parchemin d'amélioration, d'un parchemin de transmutation ou d'objets d'alchimie qui doivent être fabriqués à l'aide de ces parchemins.\n\nPour les objets d'alchimie dont les quantités produites sont plus importantes (par exemple la plupart des sorts), ce talent a une chance de se déclencher en fonction du nombre d'objets produits.
actors.hero.talent.inscribed_stealth.title=inscrit furtif
actors.hero.talent.invigorating_meal.desc=la consommation de nourriture prend à la chasseresse 1 tour (les baies sont mangées instantanément) et lui accorde _1 tour de hâte_.\n\n_+2:_ Manger de la nourriture prend à la chasseresse 1 tour (les baies sont mangées instantanément) et lui accorde _2 tours de hâte_.
actors.hero.talent.invigorating_meal.title=repas revigorant
actors.hero.talent.invigorating_victory.desc=si le duelliste bat sa cible avant la fin du duel, il récupère _5 HP plus 30% des dégâts_ qu'il a subis pendant le duel.\n\nsi le duelliste bat sa cible avant la fin du duel, il récupère _10 HP plus 50% des dégâts_ qu'il a subis pendant le duel.\n\nsi le duelliste bat sa cible avant la fin du duel, il récupère _15 HP plus 65% des dégâts_ qu'il a subis pendant le duel.\n\nsi le duelliste bat sa cible avant la fin du duel, il récupère _20 HP plus 75% des dégâts_ qu'il a subis pendant le duel.
actors.hero.talent.invigorating_victory.title=une victoire revigorante
actors.hero.talent.iron_stomach.desc=la consommation de nourriture prend au guerrier 1 tour et lui confère _75% de résistance aux dégâts_ pendant qu'il mange.\n\n_+2:_ Manger de la nourriture prend au guerrier 1 tour et lui accorde _100% de résistance aux dégâts_ pendant qu'il mange.
actors.hero.talent.iron_stomach.title=estomac de fer
actors.hero.talent.iron_will.desc=le bouclier fourni par le sceau du guerrier est _augmenté de 1_.\n\nle bouclier fourni par le sceau du guerrier est _augmenté de 2_.
actors.hero.talent.iron_will.meta_desc=si ce talent est acquis par un autre héros, il accorde passivement une version de 1 ou 2 boucliers max de l'effet de sceau brisé du guerrier.
actors.hero.talent.iron_will.title=volonté de fer
actors.hero.talent.judgement.desc=lorsqu'il est en forme ascendante, le clerc peut lancer _Judgement_, qui inflige _10-20 dégâts_ à tous les ennemis visibles.\n\n2:_ Lorsqu'il est en forme ascendante, l'Ecclésiaste peut lancer _Judgement_, qui inflige _15-30 dégâts_ à tous les ennemis visibles.\n\n3:_ Lorsqu'il est en forme ascendante, l'Ecclésiaste peut lancer _Judgement_, qui inflige _20-40 dégâts_ à tous les ennemis visibles.\n\n4:_ En forme ascendante, l'Ecclésiaste peut lancer _Judgement_, qui inflige _25-50 dégâts_ à tous les ennemis visibles.\n\nLe Jugement coûte 3 charges de tome. Le Jugement inflige +33% de dégâts pour chaque sort que l'Ecclésiaste a lancé depuis son entrée dans la forme ascendante ou depuis le dernier lancement du Jugement.
actors.hero.talent.judgement.title=jugement
actors.hero.talent.lay_on_hands.desc=le paladin peut lancer _Lay on Hands_, un sort qui soigne instantanément un personnage proche pour _15 HP_, ou lui accorde _15 boucliers_, au prix d'une charge.\n\nle paladin peut lancer _Appui sur les mains_, un sort qui soigne instantanément un personnage proche pour _20 HP_ ou lui accorde un bouclier de _20_, au prix d'une charge.\n\nle paladin peut lancer _Lay on Hands_, un sort qui soigne instantanément un personnage proche pour _25 HP_, ou lui accorde _25 shielding_, au prix d'une charge.\n\nL'excédent de soins de ce sort est converti en bouclier. L'imposition des mains peut être lancée à plusieurs reprises, mais ne peut pas appliquer plus de trois lancers de bouclier à la fois.
actors.hero.talent.lay_on_hands.title=imposer les mains
actors.hero.talent.lethal_defense.desc=lorsque le gladiateur tue un ennemi avec un coup combo, le temps de recharge de son bouclier de sceau brisé est _réduit de 50 tours_.\n\nlorsque le gladiateur tue un ennemi avec un coup combo, le temps de recharge de son bouclier de sceau brisé est _réduit de 100 tours_.\n\nlorsque le gladiateur tue un ennemi avec un coup combiné, le temps de recharge de son bouclier de sceau brisé est _réduit de 150 tours_.\n\nLe temps de recharge du bouclier peut être réduit jusqu'à -150 tours grâce à ce talent, ce qui signifie qu'il sera immédiatement disponible une fois activé.
actors.hero.talent.lethal_defense.title=défense létale
actors.hero.talent.lethal_haste.desc=lorsque la duelliste porte un coup fatal à un ennemi avec une capacité d'arme, elle gagne _3 tours_ de mouvement instantané.\n\nlorsque le duelliste porte un coup mortel à un ennemi doté d'une capacité d'arme, il gagne _5 tours_ de mouvement instantané.
actors.hero.talent.lethal_haste.meta_desc=si ce talent est acquis par un autre héros, il se déclenche avec des attaques d'armes normales, avec un temps de recharge de 100 tours.
actors.hero.talent.lethal_haste.title=hâte mortelle
actors.hero.talent.lethal_momentum.desc=lorsque le guerrier porte un coup mortel à un ennemi avec une arme physique, il a 67% de chances de prendre 0 tour.\n\nlorsque le guerrier porte un coup mortel à un ennemi avec une arme physique, il a _100% de chances_ de prendre 0 tour.
actors.hero.talent.lethal_momentum.title=l'élan fatal
actors.hero.talent.life_link.desc=L'Ecclésiaste peut lancer _Life Link_ entre lui et un allié au prix de 2 charges. Ce sort permet de partager les dégâts entre l'Ecclésiaste et son allié, et de faire en sorte que les sorts bénéfiques de niveau 3 ou inférieur s'appliquent aux deux si l'un des deux est affecté.\n\nle lien de vie dure _10 tours_ et augmente le bonus de Puissance de la multitude à _-35% des dégâts subis_\n\n2:_ Le lien de vie dure pendant _13 tours_ et augmente le bonus de puissance de plusieurs à _-40% des dégâts infligés_\n\n3:_ Le lien de vie dure pendant _17 tours_ et augmente le bonus de puissance de la multitude à _-45% des dégâts infligés\n\n4:_ Le lien de vie dure pendant _20 tours_ et augmente le bonus de puissance de la multitude à _-50% des dégâts infligés
actors.hero.talent.life_link.title=lien de vie
actors.hero.talent.light_cloak.desc=le voleur peut utiliser sa cape des ombres lorsqu'elle n'est pas équipée, mais elle se recharge à une vitesse de _25%_ lorsqu'elle n'est pas équipée.\n\nle voleur peut utiliser sa cape d'ombre lorsqu'elle n'est pas équipée, mais elle se recharge à une vitesse de _50%_ lorsqu'elle n'est pas équipée.\n\nle voleur peut utiliser sa cape d'ombre lorsqu'elle n'est pas équipée, mais elle se recharge à une vitesse de _75%_ lorsqu'elle n'est pas équipée.
actors.hero.talent.light_cloak.meta_desc=si ce talent est acquis par un autre héros, il augmente la vitesse de chargement de tous les artefacts de 7/13/20% à +1/+2/+3.
actors.hero.talent.light_cloak.title=cape légère
actors.hero.talent.light_reading.desc=le clerc peut utiliser son tome sacré lorsqu'il n'est pas équipé, mais il se recharge à une vitesse de _25%_ lorsqu'il n'est pas équipé.\n\nle clerc peut utiliser son tome sacré lorsqu'il n'est pas équipé, mais il se recharge à une vitesse de _50%_ lorsqu'il n'est pas équipé.\n\nle clerc peut utiliser son tome sacré lorsqu'il n'est pas équipé, mais il se recharge à une vitesse de _75%_ lorsqu'il n'est pas équipé.
actors.hero.talent.light_reading.meta_desc=si ce talent est acquis par un autre héros, il augmente la vitesse de recharge de toutes les baguettes de 7/13/20% à +1/+2/+3.
actors.hero.talent.light_reading.title=Lecture légère
actors.hero.talent.lingering_magic.desc=lorsque le Mage zappe avec une baguette ou un bâton, sa prochaine attaque physique inflige _1-2 dégâts bonus_.\n\n_+2:_ Lorsque le Mage zappe avec une baguette ou un bâton, sa prochaine attaque physique inflige _2 dégâts en bonus_.
actors.hero.talent.lingering_magic.title=magie persistante
actors.hero.talent.liquid_agility.desc=lorsqu'il boit ou lance une potion, un breuvage ou un élixir, le duelliste a _3x l'évasion_, et a _3x la précision_ sur sa prochaine attaque de mêlée dans les 5 tours.\n\nle duelliste a une évasion _infinie_ et une précision _infinie_ sur sa prochaine attaque de mêlée dans les 5 tours.\n\nCe bonus dure un tour et une attaque supplémentaires lors de l'utilisation de potions de force, d'expérience ou d'objets d'alchimie qui doivent être fabriqués à l'aide de ces potions.\n\nPour les objets d'alchimie dont les quantités produites sont plus importantes (par exemple, l'aqua brew), ce talent a une chance de se déclencher en fonction du nombre d'objets produits.
actors.hero.talent.liquid_agility.title=agilité des liquides
actors.hero.talent.liquid_nature.desc=lorsque la chasseresse boit ou lance une potion, un breuvage ou un élixir, _jusqu'à 4 tuiles d'herbe_ poussent dans la zone environnante et les ennemis adjacents sont enracinés pendant _1 tour_.\n\nlorsque la chasseresse boit ou lance une potion, une infusion ou un élixir, _jusqu'à 6 tuiles d'herbe_ poussent dans la zone environnante et les ennemis adjacents sont enracinés pendant _2 tours_.\n\nLa quantité d'herbe et la durée de la racine sont doublées lorsque vous utilisez des potions de force, d'expérience ou des objets d'alchimie qui doivent être fabriqués avec ces potions.\n\nPour les objets d'alchimie avec des quantités de production plus élevées (par exemple, l'aqua brew), ce talent a une chance de se déclencher en fonction de la quantité de cet objet qui est produite.
actors.hero.talent.liquid_nature.title=nature liquide
actors.hero.talent.liquid_willpower.desc=le guerrier gagne _6,5 % de ses PV max en bouclier_ lorsqu'il boit ou lance une potion, un breuvage ou un élixir.\n\nle guerrier gagne _10% de ses PV max en bouclier_ lorsqu'il boit ou lance une potion, une décoction ou un élixir.\n\nLe montant du bouclier est doublé lors de l'utilisation de potions de force, d'expérience ou d'objets d'alchimie qui doivent être fabriqués à l'aide de ces potions.\n\nPour les objets d'alchimie avec des quantités de production plus élevées (par exemple, l'infusion d'eau), ce talent a une chance de se déclencher en fonction de la quantité de cet objet qui est produite.
actors.hero.talent.liquid_willpower.title=la volonté liquide
actors.hero.talent.longrange_warp.desc=le Mage peut désormais passer d'un étage à l'autre, au prix de _150% de charge_.\n\n_+2:_ Le Mage peut maintenant passer d'un étage à l'autre, pour un coût de _117% de charge_.\n\n_+3:_ Le Mage peut maintenant passer d'un étage à l'autre, au prix de _83% de frais_.\n\n_+4:_ Le Mage peut désormais passer d'un étage à l'autre, pour un coût de _50% de frais_.\n\nLe Mage ne peut pas utiliser la téléportation à longue portée pour quitter un étage verrouillé.
actors.hero.talent.longrange_warp.title=Distorsion à longue portée
actors.hero.talent.mind_form.desc=L'Ecclésiaste peut lancer _Forme d'esprit_, qui imprègne la Trinité de la puissance d'une baguette ou d'une arme de jet que l'Ecclésiaste a utilisée pendant la course, au prix de 3 charges.\n\nlorsque la Trinité est utilisée, l'Ecclésiaste utilise l'effet de zap ou de projection de l'objet choisi, comme s'il s'agissait d'une _+3._\n\nlorsque la Trinité est utilisée, l'Ecclésiaste utilise l'effet de zapping ou de projection de l'objet choisi, comme s'il s'agissait d'un effet _+4._\n\nlorsque la Trinité est utilisée, l'Ecclésiaste utilise l'effet de zap ou de projection de l'objet choisi, comme s'il s'agissait de _+5._\n\nlorsque la Trinité est utilisée, l'Ecclésiaste utilise l'effet de zap ou de projection de l'objet choisi, comme s'il s'agissait de _+6._\n\nLa Trinité ne peut être imprégnée que d'un seul effet mental à la fois.
actors.hero.talent.mind_form.title=forme mentale
actors.hero.talent.mnemonic_prayer.desc=le prêtre peut lancer _Prière mnémonique_, un sort qui prolonge les buffs/débuffs sur un allié/ennemi pendant _3 tours_ pour un coût de 1 charge.\n\nle prêtre peut lancer _Prière mnémonique_, un sort qui étend les buffs/debuffs sur un allié/ennemi pendant _4 tours_ à 1 coût.\n\nle prêtre peut lancer _Prière mnémonique_, un sort qui étend les buffs/debuffs sur un allié/ennemi pendant _5 tours_ à 1 coût.\n\nLa prière mnémonique ne prend pas de temps à lancer. La Prière mnémonique ne peut prolonger qu'une seule fois une instance particulière d'un buff/debuff, et ne peut pas prolonger les buffs des capacités d'armure.
actors.hero.talent.mnemonic_prayer.title=prière mnémotechnique
actors.hero.talent.monastic_vigor.desc=si le moine a _100% d'énergie_, ses capacités sont renforcées.\n\nsi le moine a _80% ou plus d'énergie_, ses capacités sont renforcées.\n\n_+3:_ Si le moine a _60% ou plus d'énergie_, ses capacités sont renforcées.\n\nLorsqu'elles sont dotées de pouvoirs :\n- La rafale applique l'enchantement de votre arme\n- Focus est instantané\n- Dash a une portée de +4\n- Coup de pied du dragon inflige +50% de dégâts et applique son effet de choc et d'étourdissement à tous les ennemis adjacents\n- Méditation soigne lentement 20 % des PV manquants et confère 80 % de résistance aux dégâts.
actors.hero.talent.monastic_vigor.title=vigueur monastique
actors.hero.talent.mystical_charge.desc=le fait de frapper avec son bâton permet au mage de bataille de se recharger en artefacts pendant 0,5 tour.\n\n_+2:_ Frapper avec son bâton accorde au mage de bataille _1 tour_ de recharge d'artefact.\n\n3:_ Frapper avec son bâton accorde au mage de bataille _1,5 tour_ de recharge d'artefact.
actors.hero.talent.mystical_charge.title=charge mystique
actors.hero.talent.mystical_meal.desc=la consommation de nourriture prend au voleur 1 tour (les rations de ravitaillement sont consommées instantanément) et lui accorde _3 tours de recharge d'artefact_.\n\n_+2:_ Manger de la nourriture prend au voleur 1 tour (les rations de ravitaillement sont consommées instantanément) et lui accorde _5 tours de recharge d'artefact_.\n\nCe talent ne peut pas être utilisé pour permettre à la corne d'abondance de se recharger.
actors.hero.talent.mystical_meal.title=repas mystique
actors.hero.talent.natures_aid.desc=la chasseresse gagne 0-2 armure de peau d'écorce, qui s'estompe tous les _3 tours_ lorsque l'effet d'une plante est activé dans sa vision.\n\n_+2:_ La chasseresse gagne 0-2 armure de peau d'écorce, qui s'estompe tous les _5 tours_ lorsque l'effet d'une plante est activé dans sa vision.
actors.hero.talent.natures_aid.title=l'aide de la nature
actors.hero.talent.natures_bounty.desc=la chasseresse peut trouver _4 baies_ cachées dans les hautes herbes lorsqu'elle explore les étages suivants du donjon.\n\nla chasseresse peut trouver _6 baies_ cachées dans les hautes herbes en explorant les étages suivants du donjon.\n\nLes baies se mangent rapidement, redonnent un peu de satiété et peuvent contenir une graine utilisable.
actors.hero.talent.natures_bounty.title=l'abondance de la nature
actors.hero.talent.natures_wrath.desc=lorsque le pouvoir de la nature est actif, les tirs de l'arc spirituel ont _8% de chances_ de déclencher un effet végétal nocif aléatoire.\n\nlorsque le pouvoir de la nature est actif, les tirs de l'arc spirituel ont _17% de chances_ de déclencher un effet végétal nocif aléatoire.\n\nlorsque le pouvoir de la nature est actif, les tirs de l'arc spirituel ont _25% de chances_ de déclencher un effet végétal nocif aléatoire.\n\nlorsque le pouvoir de la nature est actif, les tirs de l'arc spirituel ont _33% de chances_ de déclencher un effet végétal nocif aléatoire.\n\nLes plantes qui peuvent être déclenchées sont : l'herbe aux aveugles, la fleur de feu, la calotte glaciaire, la mousse de chagrin et la vigne-tempête.
actors.hero.talent.natures_wrath.title=la colère de la nature
actors.hero.talent.necromancers_minions.desc=lorsqu'un ennemi marqué par une âme meurt, le sorcier a 13 % de chances de le ressusciter sous la forme d'un spectre corrompu.\n\nle sorcier a _+2:_ Lorsqu'un ennemi marqué par une âme meurt, le sorcier a _27% de chances_ de l'élever en tant que spectre corrompu.\n\nle sorcier a _40% de chances de ressusciter un spectre corrompu à la mort d'un ennemi marqué par une âme.
actors.hero.talent.necromancers_minions.title=les serviteurs du nécromancien
actors.hero.talent.patient_strike.desc=si la duelliste attend avant d'effectuer une attaque de mêlée, elle inflige _1-2 dégâts bonus_.\n\nsi le duelliste attend avant d'effectuer une attaque de mêlée, il inflige _2 dégâts bonus_.
actors.hero.talent.patient_strike.title=grève des patients
actors.hero.talent.perfect_copy.desc=le clone d'ombre gagne _10%_ des PV max du héros et peut instantanément échanger sa place avec le héros jusqu'à _1 tuile_ de distance.\n\n_+2:_ Le clone d'ombre gagne _20%_ des PV max du héros, et peut instantanément changer de place avec le héros jusqu'à _2 tuiles_ de distance.\n\nle clone d'ombre gagne _30%_ des PV max du héros et peut instantanément changer de place avec le héros jusqu'à _3 tuiles_ de distance.\n\nle clone d'ombre gagne _40%_ des PV max du héros et peut instantanément changer de place avec le héros jusqu'à _4 tuiles de distance.
actors.hero.talent.perfect_copy.title=copie parfaite
actors.hero.talent.point_blank.desc=lorsque la chasseresse utilise son arc ou une arme de jet à distance de mêlée, sa précision est de _-25%_ au lieu de -50%.\n\n2:_ Lorsque la chasseresse utilise son arc ou une arme de jet à distance de mêlée, elle a une précision normale au lieu de -50%.\n\n3:_ Lorsque la chasseresse utilise son arc ou une arme de jet à portée de mêlée, elle a une précision de _+25%_ au lieu de -50%.\n\nNotez que les armes de jet ou l'arc spirituel ont toujours une précision de +50% lorsqu'ils sont utilisés à distance.
actors.hero.talent.point_blank.title=à blanc
actors.hero.talent.precise_assault.desc=lorsque le duelliste utilise une capacité d'arme, il gagne _2x la précision_ sur sa prochaine attaque de mêlée dans les 5 tours.\n\nlorsque le duelliste utilise une capacité d'arme, il gagne _5x la précision_ sur sa prochaine attaque de mêlée dans les 5 tours.\n\n3:_ Lorsque le duelliste utilise une capacité d'arme, il gagne une _précision infinie_ sur sa prochaine attaque de mêlée dans les 5 tours.
actors.hero.talent.precise_assault.meta_desc=si ce talent est acquis par un autre héros, il augmentera la précision en mêlée de 10% à +1, 20% à +2, ou 30% à +3.
actors.hero.talent.precise_assault.title=assaut précis
actors.hero.talent.projectile_momentum.desc=en course libre, le coureur libre gagne _+50% de précision et +15% de dégâts_ avec les armes de jet.\n\n2:_ En course libre, le coureur libre gagne _+100% de précision et +30% de dégâts_ avec les armes de jet.\n\n3:_ En course libre, le coureur libre gagne _+150% de précision et +45% de dégâts_ avec les armes de jet.
actors.hero.talent.projectile_momentum.title=la quantité de mouvement du projectile
actors.hero.talent.projecting_blades.desc=les lames spectrales ont une précision de _+25%_ et peuvent pénétrer jusqu'à _2 carreaux solides_.\n\n_+2:_ Les lames spectrales ont une précision de _+50%_, et peuvent pénétrer jusqu'à _4 tuiles solides_.\n\n3:_Les lames spectrales ont une précision de _+75% et peuvent pénétrer jusqu'à _6 tuiles pleines_.\n\n4:_ Les lames spectrales ont une précision de _+100%_ et peuvent pénétrer jusqu'à _8 tuiles pleines_.
actors.hero.talent.projecting_blades.title=lames saillantes
actors.hero.talent.protective_shadows.desc=le voleur gagne un bouclier _tous les deux tours_ où il est invisible, _jusqu'à un maximum de 3_.\n\nle voleur gagne un bouclier _à chaque tour_ où il est invisible, _jusqu'à un maximum de 5_.
actors.hero.talent.protective_shadows.title=ombres protectrices
actors.hero.talent.provoked_anger.desc=lorsqu'un buff de bouclier appliqué au guerrier est brisé par des dégâts, sa prochaine attaque physique inflige _3 dégâts bonus_.\n\nle guerrier ne peut pas utiliser de bouclier, mais sa prochaine attaque physique lui infligera _5 dégâts bonus_.
actors.hero.talent.provoked_anger.title=a provoqué la colère
actors.hero.talent.ratforcements.desc=utiliser ratmogrify sur vous _réveille 1_ rat marsupial allié à côté de vous.\n\n_+2:_ Utiliser ratmogrify sur vous-même _spawns 2_ ally marsupial rats next to you.\n\n3:_ En utilisant ratmogrify sur vous-même, vous faites apparaître 3_ rats marsupiaux alliés à côté de vous.\n\n4:_ En utilisant ratmogrify sur vous-même, vous faites apparaître 4_ rats marsupiaux alliés à côté de vous.
actors.hero.talent.ratforcements.title=les renforts en rats
actors.hero.talent.ratlomacy.desc=l'utilisation de ratmogrify sur un ennemi ratmogrifié le rend amical et rend la transformation permanente.\n\n+2:_ L'utilisation de la ratmogrification sur un ennemi ratmogrifié le rend amical, rend la transformation permanente et lui donne _2 tours_ d'adrénaline.\n\n3:_ L'utilisation de ratmogrify sur un ennemi ratmogrifié le rend amical, rend la transformation permanente et lui donne _4 tours_ d'adrénaline.\n\n4:_ L'utilisation de ratmogrify sur un ennemi ratmogrifié le rend amical, rend la transformation permanente et lui donne _6 tours_ d'adrénaline.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratsistance.desc=les ennemis hostiles ratmogrifiés infligent _-10% de dégâts_.\n\n_+2:_ Les ennemis hostiles ratmogrifiés infligent _-19% de dégâts_.\n\n_+3:_ Les ennemis hostiles ratmogrifiés infligent _-27% de dégâts_.\n\n_+4:_ Les ennemis hostiles ratmogrifiés infligent _-35% de dégâts_.
actors.hero.talent.ratsistance.title=ratsistance
actors.hero.talent.reactive_barrier.desc=le Mage gagne _2,5 boucliers_ pour chaque personnage affecté par le souffle élémentaire, jusqu'à un maximum de 5 personnages.\n\nle Mage gagne _5 bouclier_ pour chaque personnage affecté par le souffle élémentaire, jusqu'à un maximum de 6 personnages.\n\nle Mage gagne _7,5 boucliers_ pour chaque personnage affecté par l'explosion élémentaire, jusqu'à un maximum de 7 personnages.\n\nle Mage gagne _10 boucliers_ pour chaque personnage affecté par le souffle élémentaire, jusqu'à un maximum de 8 personnages.
actors.hero.talent.reactive_barrier.title=barrière réactive
actors.hero.talent.recall_inscription.desc=le Clerc peut lancer _Recall Inscription_, un sort qui lui permet de répéter l'effet de la dernière pierre runique ou du dernier parchemin qu'il a utilisé dans les _10 tours_\n\nle clerc peut lancer _Recall Inscription_, un sort qui lui permet de répéter l'effet de la dernière pierre runique ou du dernier parchemin qu'il a utilisé dans les _300 tours_\n\nRecall Inscription ne peut pas être utilisé avec des parchemins d'amélioration. Le coût de ce sort varie en fonction de l'objet utilisé récemment : 2 pour une pierre runique, 3 pour un parchemin, 4 pour un parchemin exotique. Ce coût est également doublé lorsqu'il est utilisé avec un parchemin de transmutation ou des objets d'alchimie qui doivent être fabriqués à l'aide de la transmutation ou de l'amélioration.
actors.hero.talent.recall_inscription.meta_desc=si ce talent est acquis par un autre héros, il remboursera à la place n'importe quel parchemin ou pierre runique 10% du temps à +1 ou 15% du temps à +2. Les parchemins d'amélioration ne sont pas concernés par cet effet.
actors.hero.talent.recall_inscription.refunded=Votre article a été remboursé !
actors.hero.talent.recall_inscription.title=inscription de rappel
actors.hero.talent.rejuvenating_steps.desc=lorsque la chasseresse marche sur de l'herbe courte ou des braises, celles-ci se transforment en herbe haute que la chasseresse sillonne immédiatement. Le temps de recharge est de _10 tours_.\n\n2:_ Lorsque la chasseresse marche sur de l'herbe courte ou des braises, elles jaillissent en hautes herbes que la chasseresse sillonne immédiatement. Cette technique a un temps de recharge de _5 tours_.\n\nCe talent produira de l'herbe sillonnée si les effets de régénération passive sont désactivés ou si le héros n'a pas gagné d'exp depuis longtemps.
actors.hero.talent.rejuvenating_steps.title=étapes de rajeunissement
actors.hero.talent.remote_beacon.desc=le Mage peut placer une balise à n'importe quel endroit dans un rayon de _4 tuiles_.\n\nle Mage peut placer une balise à n'importe quel endroit dans un rayon de _8 tuiles_.\n\nle Mage peut placer une balise à n'importe quel endroit dans un rayon de _12 tuiles_.\n\nle Mage peut placer une balise à n'importe quel endroit dans un rayon de _16 tuiles_.\n\nLe Mage ne peut pas placer de balises dans des endroits inaccessibles.
actors.hero.talent.remote_beacon.title=Balise à distance
actors.hero.talent.rogues_foresight.desc=lorsque le voleur se trouve dans un niveau avec une salle secrète, il a 75 % de chances de remarquer que le niveau contient un secret.\n\n2:_ Lorsque le voleur se trouve dans un niveau comportant une salle secrète, il a 100 % de chances de remarquer que le niveau contient un secret.
actors.hero.talent.rogues_foresight.title=prévoyance des voyous
actors.hero.talent.runic_transference.desc=le sceau brisé du guerrier peut transférer des _glyphes ordinaires_ de la même manière qu'il transfère une amélioration.\n\nle sceau brisé du guerrier peut transférer des glyphes _réguliers, puissants et maudits_ de la même manière qu'il transfère une amélioration.\n\nLe sceau ne peut transférer des glyphes que s'ils ont été appliqués à l'armure lorsque le sceau était attaché.
actors.hero.talent.runic_transference.meta_desc=si ce talent est acquis par un autre héros, il aidera les glyphes de votre armure à résister aux parchemins d'amélioration. Les glyphes commencent à être perdus lorsque vous passez du niveau 6 (au lieu de 4) à +1, ou du niveau 7 (au lieu de 4) à +2. Le niveau où la perte des glyphes est garantie reste inchangé à +8.
actors.hero.talent.runic_transference.title=transfert runique
actors.hero.talent.satiated_spells.desc=en mangeant, le clerc gagne _3 boucliers_ la prochaine fois qu'il lance un sort.\n\n_+2:_ En mangeant, le clerc gagne _5 shielding_ la prochaine fois qu'il lance un sort.
actors.hero.talent.satiated_spells.meta_desc=si ce talent est acquis par un autre héros, il confère immédiatement un bouclier, qui commence à se dégrader normalement après 10 tours.
actors.hero.talent.satiated_spells.title=Sortilèges de satiété
actors.hero.talent.scholars_intuition.desc=le Mage identifie les baguettes _3x plus vite_.\n\n2:_ Le Mage identifie les baguettes _quand il les utilise_.
actors.hero.talent.scholars_intuition.title=intuition du savant
actors.hero.talent.searing_light.desc=les attaques physiques du Clerc contre les ennemis éclairés par _Guiding Light_ infligent _+3 points de dégâts\n\n_+2:_ Les attaques physiques du Clerc contre les ennemis éclairés par _Guiding Light_ infligent _+5 points de dégâts
actors.hero.talent.searing_light.meta_desc=si ce talent est acquis par un autre héros, il accordera son bonus de dégâts après l'utilisation d'une baguette ou d'un artefact sur un ennemi, avec un temps de recharge de 20 tours.
actors.hero.talent.searing_light.title=Lumière brûlante
actors.hero.talent.seer_shot.desc=lorsque la chasseresse tire une flèche au sol, elle accorde la vision dans une zone de 3x3 autour d'elle pendant _5 tours_. Le temps de recharge est de 20 tours.\n\n2:_ Lorsque la chasseresse tire une flèche au sol, elle accorde la vision dans une zone de 3x3 autour d'elle pendant _10 tours_. Le temps de recharge est de 20 tours.\n\n3:_ Lorsque la chasseresse tire une flèche sur le sol, elle accorde la vision dans une zone de 3x3 autour d'elle pendant _15 tours_. Le temps de recharge est de 20 tours.
actors.hero.talent.seer_shot.meta_desc=si ce talent est acquis par un autre héros, il se déclenche avec n'importe quelle arme lancée.
actors.hero.talent.seer_shot.title=tir du voyant
actors.hero.talent.shadow_blade.desc=le clone d'ombre gagne _8%_ des dégâts du héros par tour, et a _25% de chances_ d'utiliser l'enchantement sur l'arme du héros.\n\nle clone de l'ombre gagne _16%_ des dégâts du héros par tour et a _50% de chances_ d'utiliser l'enchantement sur l'arme du héros.\n\nle clone d'ombre gagne _24%_ des dégâts du héros par tour et a _75% de chances_ d'utiliser l'enchantement sur l'arme du héros.\n\nle clone d'ombre gagne _32%_ des dégâts du héros par tour et a _100% de chances_ d'utiliser l'enchantement sur l'arme du héros.
actors.hero.talent.shadow_blade.title=lame d'ombre
actors.hero.talent.shadow_step.desc=si le voleur utilise la bombe fumigène alors qu'il est invisible, elle se déclenche instantanément et a un coût de charge réduit de 16%, mais elle n'aveugle pas les ennemis et ne déclenche pas d'autres talents.\n\nsi le voleur utilise la bombe fumigène alors qu'il est invisible, elle se déclenche instantanément et a un coût de charge réduit de 30 %, mais elle n'aveugle pas les ennemis et ne déclenche pas d'autres talents.\n\nsi le voleur utilise la bombe fumigène alors qu'il est invisible, elle se déclenche instantanément et a un coût de charge réduit de 41%, mais elle n'aveugle pas les ennemis et ne déclenche pas d'autres talents.\n\nsi le voleur utilise la bombe fumigène alors qu'il est invisible, elle se déclenche instantanément et a un coût de charge réduit de 50 %, mais elle n'aveugle pas les ennemis et ne déclenche pas d'autres talents.
actors.hero.talent.shadow_step.title=pas de l'ombre
actors.hero.talent.shared_enchantment.desc=les armes de jet ont _33% de chances_ d'utiliser l'enchantement de l'arc du tireur d'élite.\n\nles armes de jet ont _67% de chances_ d'utiliser l'enchantement de l'arc du tireur d'élite.\n\nles armes de jet ont _100% de chances_ d'utiliser l'enchantement de l'arc du tireur d'élite.\n\nL'enchantement de l'arc peut se déclencher en plus de l'enchantement que l'arme de jet possède déjà.
actors.hero.talent.shared_enchantment.title=l'enchantement partagé
actors.hero.talent.shared_upgrades.desc=lorsque le tireur d'élite attaque avec une arme de jet améliorée, chaque niveau augmente la durée de la marque du sniper de 1 tour et les dégâts de son attaque spéciale de 16%, jusqu'à un maximum de _2 tours et +33% de dégâts à +2_.\n\nlorsque le tireur d'élite attaque avec une arme de jet améliorée, chaque niveau augmente la durée de la marque du sniper de 1 tour et les dégâts de son attaque spéciale de 16%, jusqu'à un maximum de _4 tours et +67% de dégâts à +4_.\n\nlorsque le tireur d'élite attaque avec une arme de jet améliorée, chaque niveau augmente la durée de la marque du sniper de 1 tour et les dégâts de son attaque spéciale de 16%, jusqu'à un maximum de _6 tours et +100% de dégâts à +6_.
actors.hero.talent.shared_upgrades.title=améliorations partagées
actors.hero.talent.shield_battery.desc=le Mage peut se cibler lui-même avec une baguette pour convertir toutes ses charges en bouclier à un taux de _4% HP max par charge_.\n\n_+2:_ Le Mage peut se cibler lui-même avec une baguette pour convertir toutes ses charges en bouclier à un taux de _6% de PV max par charge_.
actors.hero.talent.shield_battery.title=batterie de protection
actors.hero.talent.shield_of_light.desc=le clerc peut lancer _Bouclier de lumière_, un sort qui se lance instantanément et lui confère _2-4 armures_ contre une cible pendant 5 tours au prix d'une charge.\n\nle clerc peut lancer _Bouclier de lumière_, un sort qui se lance instantanément et lui confère _3-6 armures_ contre une cible pendant 5 tours au prix d'une charge.
actors.hero.talent.shield_of_light.meta_desc=si ce talent est acquis par un autre héros, il réduit les dégâts physiques infligés à l'ennemi ciblé de 1, 33% du temps à +1 ou 50% du temps à +2.
actors.hero.talent.shield_of_light.title=bouclier de lumière
actors.hero.talent.shielding_dew.desc=les gouttes de rosée peuvent protéger la gardienne lorsque ses points de vie sont pleins, jusqu'à _20% de ses PV max_.\n\nles gouttes de rosée peuvent protéger la gardienne lorsque sa santé est pleine, jusqu'à _40% de ses HP max_.\n\nles gouttes de rosée peuvent protéger la gardienne lorsque sa santé est pleine, jusqu'à _60% de ses HP max_.
actors.hero.talent.shielding_dew.title=bouclier de rosée
actors.hero.talent.shock_force.desc=l'onde de choc inflige _20% de dégâts supplémentaires_ et a _25% de chances_ d'étourdir au lieu d'estropier.\n\n_+2:_ L'onde de choc inflige _40% de dégâts supplémentaires_ et a _50% de chances_ d'étourdir au lieu d'estropier.\n\n_+3:_ L'onde de choc inflige _60% de dégâts en plus_ et a _75% de chances_ d'étourdir au lieu d'estropier.\n\n_+4:_ L'onde de choc inflige _80% de dégâts supplémentaires_ et a _100% de chances_ d'étourdir au lieu d'estropier.
actors.hero.talent.shock_force.title=force de choc
actors.hero.talent.shrug_it_off.desc=la réduction des dégâts du guerrier pendant qu'il endure est _augmentée à 60 %_, au lieu de 50 %.\n\n_+2:_ La réduction des dégâts du guerrier pendant qu'il endure est _augmentée à 68%_, au lieu de 50%.\n\n3:_ La réduction des dégâts du guerrier pendant qu'il endure est _augmentée à 74%_, au lieu de 50%.\n\n4:_ La réduction des dégâts du guerrier pendant qu'il endure est _augmentée à 80 %_, au lieu de 50 %.
actors.hero.talent.shrug_it_off.title=l'ignorer
actors.hero.talent.silent_steps.desc=le voleur ne réveillera pas les ennemis endormis s'il se trouve à _3 tuiles ou plus d'eux_.\n\nle voleur ne réveillera pas les ennemis endormis s'il n'est pas adjacent à eux.
actors.hero.talent.silent_steps.title=des pas silencieux
actors.hero.talent.soul_eater.desc=la marque d'âme accorde _0,33 tour_ de satiété pour chaque dégât physique infligé. Les ennemis marqués par l'âme ont _10% de chances_ de déclencher des effets de type "on-eat" lorsqu'ils meurent.\n\n2:_ La marque d'âme accorde _0,67 tour_ de satiété pour chaque dégât physique infligé. Les ennemis marqués par l'âme ont _20% de chances_ de déclencher des effets d'on-eat lorsqu'ils meurent.\n\n3:_ La marque d'âme accorde _1 tour_ de satiété pour chaque dégât physique infligé. Les ennemis marqués par l'âme ont _30% de chances_ de déclencher des effets d'on-eat lorsqu'ils meurent.
actors.hero.talent.soul_eater.title=mangeur d'âme
actors.hero.talent.soul_siphon.desc=les dégâts physiques infligés par d'autres personnages déclenchent la marque d'âme du sorcier avec une efficacité de _13%_.\n\n2:_ Les dégâts physiques infligés par d'autres personnages déclenchent la marque d'âme du sorcier à _27% d'efficacité_.\n\n_+3:_ Les dégâts physiques infligés par d'autres personnages déclenchent la marque d'âme du sorcier à _40% d'efficacité_.
actors.hero.talent.soul_siphon.title=siphon d'âme
actors.hero.talent.speedy_stealth.desc=le coureur libre gagne 2 piles d'élan par tour lorsqu'il est invisible.\n\n+2:_ En plus des bénéfices de +1, la course libre ne compte plus lorsque le coureur libre est invisible.\n\nen plus des avantages de +1 et +2, le coureur libre se déplace à une vitesse de 2x lorsqu'il est invisible, qu'il soit en course libre ou non.
actors.hero.talent.speedy_stealth.title=vitesse furtive
actors.hero.talent.spirit_blades.desc=les lames spectrales ont _30% de chances_ d'utiliser également l'enchantement sur l'arc spirituel.\n\nles lames spectrales ont _60% de chances_ d'utiliser également l'enchantement sur l'arc spirituel.\n\nles lames spectrales ont _90% de chances_ d'utiliser également l'enchantement sur l'arc spirituel.\n\nles lames spectrales ont _100% de chances_ d'utiliser également l'enchantement sur l'arc spirituel et confèrent à chaque enchantement _+10% de puissance_.
actors.hero.talent.spirit_blades.title=lames d'esprit
actors.hero.talent.spirit_form.desc=Le clerc peut lancer _Forme d'esprit_, qui imprègne Trinity du pouvoir d'un anneau ou d'un artefact que le clerc a identifié lors de cette manche (sauf le tome sacré), au prix de 4 charges.\n\nlorsque la Trinité est utilisée, l'Ecclésiaste gagne l'effet d'un anneau à _+1_ pendant 20 tours, ou déclenche l'effet d'un artefact à _+4\n\n2:_ Lors de l'utilisation de la Trinité, l'Ecclésiaste gagne un effet d'anneau à _+2_ pendant 20 tours, ou déclenche l'effet d'un artefact à _+6._\n\n3:_ Lorsque la Trinité est utilisée, le Clerc gagne un effet d'anneau à _+3_ pendant 20 tours, ou déclenche l'effet d'un artefact à _+8._\n\n4:_ Lorsque la Trinité est utilisée, le Clerc gagne un effet d'anneau à _+4_ pendant 20 tours, ou déclenche l'effet d'un artefact à _+10._\n\nLa Trinité ne peut être imprégnée que d'un seul effet spirituel à la fois. Les artefacts ont des effets et des coûts de charge d'armure variés lorsqu'ils sont déclenchés par la Trinité.
actors.hero.talent.spirit_form.title=forme d'esprit
actors.hero.talent.stasis.desc=Le Clerc peut lancer _Stasis_ sur un allié doté d'un pouvoir au prix de 2 charges. La stase retire temporairement l'allié du donjon et préserve le temps restant sur tous les buffs, y compris le pouvoir de la multitude. L'allié réapparaît à vos côtés lorsque l'effet prend fin. La stase peut être relancée instantanément et sans frais pour mettre fin à l'effet plus tôt. La stase fonctionne sur les alliés immobiles, mais ne peut pas les déplacer entre les étages du donjon.\n\nla stase dure au maximum _60 tours_\n\n_+2:_ La stase dure au maximum _90 tours\n\n_+3:_ La stase dure au maximum _120 tours._\n\n_+4:_ La stase dure au maximum _150 tours._\n\nL'Ecclésiaste peut également lancer Rayon de téléportation lorsqu'un allié est en stase pour le rappeler, ou lancer Lien de vie pour appliquer son effet de manière préventive. Les alliés ne bénéficient pas du Lien de vie lorsqu'ils sont en stase.
actors.hero.talent.stasis.title=stase
actors.hero.talent.strengthening_meal.desc=manger de la nourriture accorde au duelliste un bonus de 3 points de dégâts les _2 prochaines fois_ qu'il touche un ennemi avec une attaque physique.\n\n2:_ Manger de la nourriture accorde au duelliste un bonus de 3 points de dégâts les _3 fois_ suivantes qu'il touche un ennemi avec une attaque physique.
actors.hero.talent.strengthening_meal.title=repas de renforcement
actors.hero.talent.striking_force.desc=la puissance de l'effet de la frappe élémentaire est augmentée de _30%_.\n\nla puissance de l'effet de la frappe élémentaire est augmentée de _60%_.\n\n_+3:_ La puissance de l'effet de la frappe élémentaire est augmentée de _90%_.\n\n_+4:_ La puissance de l'effet de la frappe élémentaire est augmentée de _120%_.
actors.hero.talent.striking_force.title=force de frappe
actors.hero.talent.striking_wave.desc=l'onde de choc a _30% de chances_ d'utiliser également des effets sur le coup comme les enchantements et les combos.\n\nl'Onde de choc a _60% de chances_ d'utiliser également les effets de coup comme les enchantements et le combo.\n\nshockwave a _90% de chances_ d'utiliser également des effets de coup comme les enchantements et le combo.\n\n_+4:_ L'Onde de choc a _100% de chances_ d'utiliser également les effets de coup comme les enchantements et le combo, et elle donne aux enchantements _+20% de puissance_.
actors.hero.talent.striking_wave.title=vague déferlante
actors.hero.talent.strongman.desc=la force du guerrier est _augmentée de 8%_, arrondie à l'inférieur.\n\nla force du guerrier est _augmentée de 13%_, arrondie à l'inférieur.\n\nla force du guerrier est _augmentée de 18%_, arrondie à l'inférieur.
actors.hero.talent.strongman.title=homme fort
actors.hero.talent.sucker_punch.desc=le voleur inflige _1-2 dégâts bonus_ la première fois qu'il attaque un ennemi par surprise.\n\n_+2:_ Le Rogue inflige _2 dégâts bonus_ la première fois qu'il attaque un ennemi par surprise.
actors.hero.talent.sucker_punch.title=coup de poing
actors.hero.talent.sunray.desc=le clerc peut lancer _Sunray_, un sort qui inflige _4-8 dégâts_ et aveugle la cible pendant _4 tours_, au prix d'une charge.\n\nl'Ecclésiaste peut lancer _Sunray_, un sort qui inflige _6-12 dommages_ et aveugle la cible pendant _6 tours_, au prix d'une charge.\n\nRayon de soleil ne peut aveugler chaque cible qu'une seule fois, mais si la cible est déjà aveuglée par Rayon de soleil, il la paralyse à la place. Rayon de soleil inflige toujours le maximum de dégâts aux démons et aux morts-vivants.
actors.hero.talent.sunray.meta_desc=si ce talent est acquis par un autre héros, les baguettes et les artefacts aveuglent les ennemis pendant 4 tours, 15% du temps à +1 ou 25% du temps à +2.
actors.hero.talent.sunray.title=rayon de soleil
actors.hero.talent.survivalists_intuition.desc=la chasseresse identifie les armes de jet _3x plus vite_.\n\n2:_ La chasseresse identifie les armes de jet _quand elle frappe avec_.
actors.hero.talent.survivalists_intuition.title=l'intuition du survivaliste
actors.hero.talent.sustained_retribution.desc=le guerrier inflige _115% de dégâts bonus_ répartis sur _2 coups_, au lieu de 100% de dégâts bonus en 1 coup.\n\nle guerrier inflige _130% de bonus de dégâts_ répartis sur _3 coups_, au lieu de 100% de bonus de dégâts en 1 coup.\n\nle guerrier inflige _145% de bonus de dégâts_ répartis sur _4 coups_, au lieu de 100% de bonus de dégâts en 1 coup.\n\nle guerrier inflige _160% de bonus de dégâts_ répartis sur _5 coups_, au lieu de 100% de bonus de dégâts en 1 coup.
actors.hero.talent.sustained_retribution.title=châtiment durable
actors.hero.talent.swift_equip.desc=le duelliste peut changer d'arme instantanément _une fois_ tous les 20 tours.\n\nle duelliste peut changer d'arme instantanément _deux fois_ tous les 20 tours.\n\nSi le duelliste possède ce talent et qu'il n'est pas en rechargement, l'utilisation rapide d'une arme non équipée permet de l'équiper.
actors.hero.talent.swift_equip.title=équipement rapide
actors.hero.talent.swift_spirit.desc=la vitesse de déplacement du faucon spirituel passe de 2 à _2,5 tuiles_, et il est garanti qu'il esquive les _2 premières attaques_ lancées contre lui.\n\nla vitesse de déplacement de l'esprit faucon passe de 2 à 3 carreaux et il est garanti qu'il esquive les premières _4 attaques_ lancées contre lui.\n\nla vitesse de déplacement de l'esprit faucon passe de 2 à _3,5 carreaux_ et il est garanti qu'il esquive les premières _6 attaques_ lancées contre lui.\n\n4:_La vitesse de déplacement de l'esprit faucon passe de 2 à 4 carreaux et il est garanti qu'il esquive les premières _8 attaques_ lancées contre lui.
actors.hero.talent.swift_spirit.title=esprit vif
actors.hero.talent.telefrag.desc=si le Mage se transforme en un autre personnage, il lui inflige _10-15 points de dégâts_, mais subit également _5 points de dégâts_.\n\nsi le Mage se transforme en un autre personnage, il lui inflige _20-30 points de dégâts_, mais subit également _10 points de dégâts_.\n\nsi le Mage se transforme en un autre personnage, il lui inflige _30-45 points de dégâts_, mais subit également _15 points de dégâts_.\n\nsi le Mage se transforme en un autre personnage, il lui inflige _40-60 dégâts_, mais il subit également _20 dégâts_.\n\nLe héros ne peut pas être tué par ce talent, les dégâts qu'il subit peuvent être réduits par des effets de résistance à la magie.
actors.hero.talent.telefrag.title=Téléfrag
actors.hero.talent.thiefs_intuition.desc=le voleur identifie les anneaux _2x plus vite_, et identifie le type d'un anneau _quand il l'équipe_.\n\nle voleur identifie les anneaux _quand il les équipe_, et identifie le type d'un anneau _quand il le ramasse_.
actors.hero.talent.thiefs_intuition.title=intuition du voleur
actors.hero.talent.twin_upgrades.desc=si l'une des deux armes équipées par le champion a un niveau inférieur et se trouve _2 niveaux ou plus en dessous_ de l'autre arme, elle sera augmentée au niveau de l'autre arme.\n\nsi l'une des deux armes équipées du champion a un niveau inférieur et est _1 ou plusieurs niveaux inférieurs_ à l'autre arme, elle sera augmentée au niveau de l'autre arme.\n\nsi l'une des deux armes équipées du champion a un niveau inférieur et est _du même niveau ou inférieur_ à l'autre arme, elle sera augmentée au niveau de l'autre arme.
actors.hero.talent.twin_upgrades.title=améliorations jumelées
actors.hero.talent.unencumbered_spirit.desc=le moine gagne _50% d'énergie supplémentaire_ pour chaque pièce d'équipement de _niveau 3 ou inférieur_ qu'il utilise.\n\nle moine gagne _75% d'énergie supplémentaire_ pour chaque pièce d'équipement _de niveau 2 ou inférieur_ qu'il utilise. Le bénéfice du niveau 3 est inchangé.\n\nle moine gagne _100% d'énergie supplémentaire_ pour chaque pièce d'équipement de _niveau 1 ou inférieur_ qu'il utilise. Les avantages des niveaux 2 et 3 sont inchangés. Il gagne également une armure en tissu et des gants cloutés gratuits.\n\nNotez que ce talent ne confère aucun avantage au fait d'être désarmé ou d'attaquer avec un anneau de force.
actors.hero.talent.unencumbered_spirit.title=esprit libre
actors.hero.talent.varied_charge.desc=la championne regagne instantanément _0,17 charge d'arme_ lorsqu'elle utilise deux capacités d'arme différentes, sans limite de temps.\n\nle champion récupère instantanément _0,33 charge d'arme_ lorsqu'il utilise deux capacités d'arme différentes, sans limite de temps.\n\nle champion récupère instantanément _0,5 charge d'arme_ lorsqu'il utilise deux capacités d'arme différentes, sans limite de temps.
actors.hero.talent.varied_charge.title=charge variable
actors.hero.talent.veterans_intuition.desc=le guerrier identifie les armes _1,75x plus vite_ et les armures _2,5x plus vite_.\n\n_+2:_ Le guerrier identifie les armes _2,5x plus vite_ et les armures _quand il les équipe_.
actors.hero.talent.veterans_intuition.title=intuition du vétéran
actors.hero.talent.wall_of_light.desc=le paladin peut lancer _Mur de lumière_, un sort qui crée un mur solide de _3 tuiles de large_ devant le paladin, qui repousse les ennemis et dure 20 tours, au prix de 3 charges.\n\nle paladin peut lancer _Mur de lumière_, un sort qui crée un mur solide de _5 tuiles de large_ devant le paladin, qui repousse les ennemis et dure 20 tours, au prix de 3 charges.\n\nle paladin peut lancer _Mur de lumière_, un sort qui crée un mur solide de _7 tuiles de large_ devant le paladin, qui repousse les ennemis et dure 20 tours, au prix de 3 charges.\n\nLe mur peut être placé de façon cardinale ou diagonale, mais il ne peut exister qu'un seul mur à la fois.
actors.hero.talent.wall_of_light.title=mur de lumière
actors.hero.talent.wand_preservation.desc=lorsque le Mage imprègne une nouvelle baguette dans son bâton, l'ancienne baguette est renvoyée à +0, _mais cela ne peut être fait qu'une seule fois_\n\n2:_ Lorsque le Mage imprègne une nouvelle baguette dans son bâton, l'ancienne baguette est rendue à +0, _cela peut être répété avec un temps de recharge d'un niveau de héros_
actors.hero.talent.wand_preservation.meta_desc=si ce talent est acquis par un autre héros, il augmentera la quantité de résine arcanique obtenue en plaçant une baguette dans un pot d'alchimie de 1 à +1, ou de 2 à +2.
actors.hero.talent.wand_preservation.title=préservation des baguettes
actors.hero.talent.weapon_recharging.desc=le duelliste gagne une charge d'arme tous les _15 tours_ lorsqu'il est sous l'effet de buffs de recharge de baguette ou d'artefact.\n\nle duelliste gagne une charge d'arme tous les _10 tours_ lorsqu'il est sous l'effet de buffs de recharge de baguette ou d'artefact.
actors.hero.talent.weapon_recharging.meta_desc=si ce talent est acquis par un autre héros, il lui permet d'infliger +5% de dégâts de mêlée lorsqu'il se recharge à +1, ou +7,5% de dégâts de mêlée lorsqu'il se recharge à +2.
actors.hero.talent.weapon_recharging.title=recharge des armes
actors.hero.talent.wide_search.desc=le rayon de recherche du voleur passe d'un carré de 5x5 à un cercle de _7x7_.\n\n_+2:_ Le rayon de recherche du Rogue passe d'un carré de 5x5 à un carré de _7x7_.
actors.hero.talent.wide_search.meta_desc=si ce talent est acquis par un autre héros, il augmentera son rayon de recherche d'un carré de 3x3 à un cercle de 5x5 à +1, ou à un carré de 5x5 à +2.
actors.hero.talent.wide_search.title=recherche étendue
actors.hero.talent.wild_momentum.desc=_+1:_ Tuer un ennemi avec l'arc spirituel prolonge la durée du pouvoir de la nature de _1 tour_. La durée peut être prolongée d'un maximum de _2 tours_.\n\n_+2:_ Tuer un ennemi avec l'arc spirituel prolonge la durée du pouvoir de la nature de _2 tours_. La durée peut être prolongée d'un maximum de _4 tours_.\n\n+3:_ Tuer un ennemi avec l'arc spirituel prolonge la durée du pouvoir de la nature de _3 tours_. La durée peut être prolongée d'un maximum de _6 tours_.\n\n+4:_ Tuer un ennemi avec l'arc spirituel prolonge la durée du pouvoir de la nature de _4 tours_. La durée peut être prolongée d'un maximum de _8 tours_.
actors.hero.talent.wild_momentum.title=un grand élan
actors.hero.talent.wild_power.desc=lorsque vous utilisez la magie sauvage, les baguettes sont augmentées de 2 ou 3, jusqu'à +4.\n\n_+2:_ Lors de l'utilisation de la magie sauvage, les baguettes sont augmentées de _3, jusqu'à +5_.\n\n_+3:_ En utilisant la magie sauvage, les baguettes seront augmentées de _3 ou 4, jusqu'à +6_.\n\n4:_ Lors de l'utilisation de la magie sauvage, les baguettes sont augmentées de 4, jusqu'à +7_.
actors.hero.talent.wild_power.title=puissance sauvage
actors.mobs.acidic.desc=Ces énormes créatures démoniaques ressemblant à des arachnides évitent le combat au corps à corps, préférant lancer des pointes dentelées paralysantes à longue distance. Celle-ci semble dégouliner d'un suintement corrosif.
actors.mobs.acidic.name=scorpion acide
actors.mobs.albino.desc=Il s'agit d'une race rare de rat marsupial, au pelage blanc pur et aux dents déchiquetées.
actors.mobs.albino.discover_hint=Vous trouverez rarement cet ennemi dans une région spécifique du donjon.
actors.mobs.albino.name=rat albinos
actors.mobs.armoredbrute.desc=Les brutes gnoll les plus gradées portent souvent une armure puissante pour montrer leur statut. L'armure rend ces brutes beaucoup plus résistantes aux dégâts physiques, et leur plus grande discipline leur permet de se déchaîner plus longtemps avant de succomber à leurs blessures.
actors.mobs.armoredbrute.name=brute blindée
actors.mobs.armoredstatue.desc=On pourrait croire qu'il s'agit d'une statue inanimée de plus dans ce donjon, mais ses yeux rouges luisants le trahissent.\n\nSon armure semble en parfait état, mais il pourrait être très difficile à tuer.
actors.mobs.armoredstatue.desc_arm_wep=Si la statue elle-même est en pierre, les _%1$s_ et _%2$s_ qu'elle brandit semblent réels.
actors.mobs.armoredstatue.name=statue blindée
actors.mobs.bandit.desc=Les profondeurs du donjon ont toujours servi de refuge à toutes sortes de criminels. Nombre d'entre eux ne parvenaient pas à garder la tête froide durant ces longues périodes passées loin de la lumière du jour. Depuis longtemps, ces voleurs et bandits déments ont oublié qui ils sont et pourquoi ils volent.
actors.mobs.bandit.name=bandit fou
actors.mobs.bat.desc=Ces habitants des grottes, vifs et tenaces, sont bien plus dangereux qu'il n'y paraît. Ils reconstituent leur santé à chaque attaque réussie, ce qui leur permet de vaincre des adversaires beaucoup plus imposants.
actors.mobs.bat.name=chauve-souris vampire
actors.mobs.bee.desc=Malgré leur petite taille, les abeilles dorées ont tendance à protéger farouchement leur maison. Celle-ci est très enragée, mieux vaut garder ses distances.
actors.mobs.bee.desc_honey=Malgré leur petite taille, les abeilles dorées ont tendance à protéger farouchement leur maison. Celle-ci a été apaisée et semble vouloir vous suivre.
actors.mobs.bee.discover_hint=Vous pouvez trouver ce personnage avec un objet spécifique.
actors.mobs.bee.name=abeille d'or
actors.mobs.brute$bruterage.desc=Cette brute gnoll est en train de mourir, mais elle veut vous emmener avec elle !\n\nLa brute mourra lorsque son bouclier s'éteindra, soit à cause du temps, soit parce qu'elle aura été endommagée. En attendant, elle inflige des dégâts considérablement accrus, alors faites attention !\n\nBouclier restant : %d.
actors.mobs.brute$bruterage.name=rage brute
actors.mobs.brute.def_verb=bloqué
actors.mobs.brute.desc=Les brutes sont les plus grands, les plus forts et les plus résistants des gnolls. Gravement blessés, ils entrent dans une rage folle et infligent encore plus de dégâts.
actors.mobs.brute.enraged=furieux
actors.mobs.brute.name=brute gnoll
actors.mobs.causticslime.desc=Cette bave semble avoir été souillée par la magie noire qui émane d'en bas. Elle a perdu sa couleur verte habituelle et dégouline d'un suintement caustique.
actors.mobs.causticslime.discover_hint=Vous trouverez rarement cet ennemi dans une région spécifique du donjon.
actors.mobs.causticslime.name=bave caustique
actors.mobs.crab.desc=Ces énormes crabes sont au sommet de la chaîne alimentaire dans les égouts. Ils sont extrêmement rapides et leur épaisse carapace peut résister à des coups violents.
actors.mobs.crab.name=crabe des égouts
actors.mobs.crystalguardian.def_verb=bloqué
actors.mobs.crystalguardian.desc=Ces grands gardiens cristallins ressemblent presque à des statues si ce n'est pour leurs yeux brillants. Le cristal durci dont ils sont faits les rend paresseux mais très résistants. Il est donc préférable de les laisser dormir dans leur nid de cristal aussi longtemps que possible\n\nEn raison de leur taille, les gardiens de cristal se déplacent beaucoup plus lentement dans les espaces clos. Ils sont également si résistants qu'il est impossible de les tuer. Ils peuvent être battus et temporairement mis hors d'état de nuire, mais ils se relèveront au bout d'un moment.
actors.mobs.crystalguardian.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.crystalguardian.name=gardien de cristal
actors.mobs.crystalmimic.ate=La mimique a mangé ton %s !
actors.mobs.crystalmimic.desc=Les mimiques sont des créatures magiques qui peuvent prendre la forme qu'elles souhaitent. Dans les donjons, ils prennent presque toujours la forme d'un coffre à trésor, afin d'attirer les aventuriers peu méfiants.\n\nLes mimiques de cristal sont plus rusées que leurs cousines ordinaires et préfèrent éviter les conflits lorsqu'elles volent le butin. Ils tentent de s'enfuir en courant lorsqu'ils sont découverts et ont la capacité de repositionner les ennemis lorsqu'ils attaquent.
actors.mobs.crystalmimic.escaped=La mimique de cristal s'est échappée !
actors.mobs.crystalmimic.name=mimique de cristal
actors.mobs.crystalspire.alert=La vibration croît et gronde dans toute la grotte !
actors.mobs.crystalspire.desc=Cette gigantesque flèche de cristal ultra dur est probablement à l'origine de toutes les étranges créatures cristallines de cette grotte. Vos armes habituelles sont inefficaces contre elle, vous devrez donc utiliser votre pioche si vous voulez la détruire.\n\nun cristal aussi gros peut prendre un certain temps à extraire et vous ne pourrez probablement pas le faire sans être dérangé. La flèche elle-même a peut-être des moyens de se défendre. peut-être que les propres attaques de la flèche pourraient être utilisées contre ses serviteurs
actors.mobs.crystalspire.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.crystalspire.name=flèche de cristal
actors.mobs.crystalspire.warning=Le cristal vibre lorsque vous le frappez. Si vous continuez à le faire, vous attirerez l'attention sur vous...
actors.mobs.crystalwisp.beam_kill=Le faisceau de lumière vous a tué...
actors.mobs.crystalwisp.desc=Un petit morceau de cristal durci flottant et en colère qui produit une lueur brillante. Bien qu'elles ne soient pas particulièrement puissantes, les guirlandes de cristal vous enverront un rayon de lumière nuisible si elles ont un tir dégagé.\n\nLes feux follets sont suffisamment petits pour se déplacer facilement à travers les divers affleurements de cristal, mais ils ne peuvent pas tirer à travers eux.
actors.mobs.crystalwisp.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.crystalwisp.name=brin de cristal
actors.mobs.demonspawner.desc=Cet amalgame de chair naine est responsable de la création de démons éventreurs à partir des nains morts dans cette région. Il est clair que les démons ne voient aucun inconvénient à utiliser toutes les ressources possibles contre leurs ennemis.\n\nBien qu'ils soient visuellement terrifiants, les géniteurs démoniaques n'ont aucun moyen de se déplacer ou de se défendre directement. Leur masse considérable les rend cependant difficiles à tuer rapidement, et ils engendreront des démons éventreurs plus rapidement lorsqu'ils seront menacés.\n\nles géniteurs de démons semblent être liés à une source centrale de pouvoir démoniaque. Les tuer peut l'affaiblir
actors.mobs.demonspawner.name=géniteur de démons
actors.mobs.demonspawner.on_death=L'énergie démoniaque semble s'atténuer au fur et à mesure que le géniteur meurt.
actors.mobs.dm100.desc=Le DM-100 est un premier modèle de "machine de défense" naine conçu pour protéger les mineurs nains dans les grottes situées en dessous de cette prison. Ses décharges électriques s'étant avérées trop faibles, elle a été offerte à la ville humaine située au-dessus. Elles sont restées inutilisées pendant des années et ont fini par se retrouver dans la prison, où le directeur les a d'abord jugées trop cruelles pour être utilisées. Cependant, comme les prisonniers devenaient de plus en plus indisciplinés, ils devinrent une nécessité.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=L'éclair t'a tué...
actors.mobs.dm200.desc=La DM-200 est la deuxième génération de "machine de défense" naine, conçue pour protéger les mineurs nains dans les grottes et la ville en contrebas. Ils sont beaucoup plus grands et plus volumineux que leurs prédécesseurs et attaquent avec des poings hydrauliques dévastateurs.\n\nLeur taille accrue est aussi leur principale faiblesse, car ils sont incapables de se faufiler dans les tunnels et les portes étroites du donjon. Les nains ont pu compenser le manque de mobilité des DM-200 en leur permettant d'évacuer leurs gaz d'échappement toxiques sur les ennemis éloignés ou ceux qu'ils ne peuvent pas atteindre.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Le DM-200 projette un jet d'échappement toxique !
actors.mobs.dm201.desc=Les nains ont brièvement tenté d'accentuer le manque de mobilité du DM-200 et ont créé des modèles de DM entièrement stationnaires. Le DM-201 est un DM-200 modifié qui fait office de tourelle sentinelle sans aucune capacité de mouvement. En échange de leur manque de mobilité, les DM-201 ont une durabilité et une puissance d'attaque nettement supérieures.\n\nComme les DM-201 n'ont pas de moteur pour évacuer les gaz d'échappement, les nains les ont équipés de grenades à gaz corrosif ! Les DM-201 sont toutefois prudents avec ces grenades et ne les lancent que lorsqu'ils sont attaqués à distance.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Le DM-201 lance une grenade corrosive !
actors.mobs.dm300.charge_lost=PYLÔNE DÉTRUIT ! RETOUR À L'ÉNERGIE LOCALE !
actors.mobs.dm300.charging=DOMMAGES SUBIS ! ACTIVATION DU PYLÔNE DE PUISSANCE !
actors.mobs.dm300.charging_hint=DM-300 est invulnérable lorsqu'il est énergisé par un pylône !
actors.mobs.dm300.def_verb=bloqué
actors.mobs.dm300.defeated=DOMMAGES CRITIQUES ! TENTATIVE DE SHUTDO-
actors.mobs.dm300.desc=Cette machine a été créée par les nains il y a plusieurs siècles. Ils ont ensuite remplacé leurs machines par des golems, des élémentaires et même des démons, précipitant le déclin de leur civilisation. Les DM-300 et les machines semblables servaient surtout à construire et à creuser les mines, parfois à défendre les cités.
actors.mobs.dm300.desc_supercharged=DM-300 est actuellement chargé d'énergie électrique. Sous cette forme, DM-300 ne peut pas être endommagé et se déplace à une vitesse double ! De plus, sa foreuse tourne maintenant assez vite pour lui permettre de creuser des tunnels dans la roche, bien qu'elle se déplace beaucoup plus lentement.\n\nAttaquer DM-300 directement est inutile tant qu'il est surchargé, mais _quelque chose dans la zone doit lui fournir cette énergie_, le détruire pourrait l'affaiblir.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=PERSONNEL NON AUTORISÉ DÉTECTÉ !
actors.mobs.dm300.pylons_destroyed=ALERTE ! INSTABILITÉ DÉTECTÉE DANS LE RÉSEAU ÉLECTRIQUE !
actors.mobs.dm300.rankings_desc=Ecrasé par le DM-300
actors.mobs.dm300.shield=Le DM-300 tire le courant des fils exposés et se protège lui-même !
actors.mobs.dm300.supercharged=DESTROY ! DESTROY ! DESTROY !
actors.mobs.dwarfking$dkghoul.rankings_desc=Tombé devant le roi des nains
actors.mobs.dwarfking$dkgolem.rankings_desc=Tombé devant le roi des nains
actors.mobs.dwarfking$dkmonk.rankings_desc=Tombé devant le roi des nains
actors.mobs.dwarfking$dkwarlock.rankings_desc=Tombé devant le roi des nains
actors.mobs.dwarfking.defeated=Vous avez... Nous condamner tous...
actors.mobs.dwarfking.desc=Il y a de nombreuses années, l'un des plus grands sorciers de la cour naine a découvert des secrets qui lui conféraient un énorme pouvoir sur la vie et la mort. Il a rapidement mis ce pouvoir à profit, soumettant et corrompant ses pairs, son roi, et finalement chaque citoyen nain. Aujourd'hui, il est roi et règne sur une légion de sujets morts-vivants.\n\nLe Roi des nains est un ennemi agressif, qui tentera d'encercler et de submerger ses ennemis avec sa horde de serviteurs morts-vivants.
actors.mobs.dwarfking.enraged=Tu ne peux pas me tuer %s. JE. SUIS. IMMORTEL !
actors.mobs.dwarfking.lifelink_1=J'ai besoin de ton essence, esclave !
actors.mobs.dwarfking.lifelink_2=Saigne pour moi, esclave !
actors.mobs.dwarfking.losing=Non ! Vous ne pouvez pas faire ça... vous n'avez aucune idée de ce qui se trouve en dessous...
actors.mobs.dwarfking.name=Roi des nains
actors.mobs.dwarfking.notice=Comment osez-vous ! Vous n'avez aucune idée de ce que vous êtes en train d'interférer !
actors.mobs.dwarfking.rankings_desc=Tombé devant le roi des nains
actors.mobs.dwarfking.teleport_1=Occupe-toi d'eux, esclave !
actors.mobs.dwarfking.teleport_2=Occupe-les, esclave !
actors.mobs.dwarfking.wave_1=Assez ! Debout mes esclaves !
actors.mobs.dwarfking.wave_2=En savoir plus ! Saignez pour votre roi !
actors.mobs.dwarfking.wave_3=Inutile ! TUEZ-LE MAINTENANT !
actors.mobs.ebonymimic.desc=Les mimiques sont des créatures magiques qui peuvent prendre la forme qu'elles souhaitent. Dans les donjons, ils prennent presque toujours la forme d'un coffre à trésor, afin d'attirer les aventuriers peu méfiants.\n\nLes mimiques d'ébène sont des mimiques furtives capables de se rendre presque invisibles. Ils se cachent sur les objets avec lesquels les aventuriers sont susceptibles d'interagir, mais ils contiennent également leur propre butin. Une fois découverts, ils ne sont pas plus résistants qu'un mimique ordinaire, mais leur morsure surprise est dévastatrice.
actors.mobs.ebonymimic.discover_hint=Vous pouvez trouver cet ennemi avec un bibelot spécifique.
actors.mobs.ebonymimic.hidden_desc=Il semble y avoir quelque chose ici, mais c'est presque totalement transparent.
actors.mobs.ebonymimic.hidden_name=schéma suspect
actors.mobs.ebonymimic.name=mimique d'ébène
actors.mobs.ebonymimic.reveal=Il y avait un imitateur !
actors.mobs.elemental$chaoselemental.desc=Les élémentaires sont des créatures chaotiques qui sont souvent créées lorsque de puissantes magies occultes ne sont pas correctement contrôlées. Les élémentaires ont une intelligence minimale et sont généralement associés à un type de magie particulier.\n\nLes élémentaires du chaos sont des élémentaires rares et dangereux qui ne se sont pas stabilisés à un élément particulier. Ils déchaînent une magie sauvage et imprévisible lorsqu'ils attaquent.
actors.mobs.elemental$chaoselemental.name=élémentaire du chaos
actors.mobs.elemental$fireelemental.desc=Les élémentaires sont des créatures chaotiques qui sont souvent créées lorsque de puissantes magies occultes ne sont pas correctement contrôlées. Les élémentaires ont une intelligence minimale et sont généralement associés à un type de magie particulier.\n\nLes élémentaires de feu sont un type courant d'élémentaire qui inflige des dégâts avec de la magie ardente. Ils embrasent leur cible avec des attaques de mêlée et peuvent parfois lancer des éclairs de feu.
actors.mobs.elemental$fireelemental.name=élémentaire de feu
actors.mobs.elemental$frostelemental.desc=Les élémentaires sont des créatures chaotiques qui sont souvent créées lorsque de puissantes magies occultes ne sont pas correctement contrôlées. Les élémentaires ont une intelligence minimale et sont généralement associés à un type de magie particulier.\n\nLes élémentaires de givre sont un type courant d'élémentaire qui affaiblit les ennemis grâce à la magie du froid. Ils refroidissent leur cible avec des attaques en mêlée et parfois à distance. Leur magie est beaucoup plus efficace dans l'eau.
actors.mobs.elemental$frostelemental.name=élémentaire de givre
actors.mobs.elemental$newbornfireelemental.charging=L'élémentaire se recharge !
actors.mobs.elemental$newbornfireelemental.desc=Les élémentaires sont des créatures chaotiques qui sont souvent créées lorsque de puissantes magies occultes ne sont pas correctement contrôlées. Les élémentaires ont une intelligence minimale et sont généralement associés à un type de magie particulier.\n\nCet élémentaire de feu vient d'être invoqué, mais il n'en est pas moins dangereux !
actors.mobs.elemental$newbornfireelemental.desc_ally=Comme cet élémentaire a été invoqué par un sort, il a un peu plus de contrôle sur ses flammes. Il est incapable d'effectuer des attaques à distance, mais enflamme les ennemis qu'il attaque en mêlée.
actors.mobs.elemental$newbornfireelemental.desc_boss=En raison de la nature chaotique de son invocation, cet élémentaire ne peut répandre le feu en des explosions imprécises qu'après avoir chargé pendant un tour.
actors.mobs.elemental$newbornfireelemental.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.elemental$newbornfireelemental.name=élémentaire de feu nouveau-né
actors.mobs.elemental$shockelemental.desc=Les élémentaires sont des créatures chaotiques qui sont souvent créées lorsque de puissantes magies occultes ne sont pas correctement contrôlées. Les élémentaires ont une intelligence minimale et sont généralement associés à un type de magie particulier.\n\nLes élémentaires de choc sont un type d'élémentaire moins courant qui perturbe ses ennemis avec de l'électricité et des éclairs de lumière. En mêlée, ils projettent de l'électricité sur les ennemis proches et infligent des dégâts supplémentaires à leur cible principale si elle se trouve dans l'eau. Ils concentrent aussi parfois un éclair de lumière à distance sur leur cible, l'aveuglant temporairement.
actors.mobs.elemental$shockelemental.name=élémentaire de choc
actors.mobs.eye.deathgaze_kill=Le Deathgaze vous a tué...
actors.mobs.eye.desc=Ce démon est aussi appelé « orbe de haine ». Dès qu'il voit un ennemi, il lance son regard mortel sans retenue, quitte à blesser ses propres alliés.
actors.mobs.eye.name=œil maléfique
actors.mobs.fetidrat.desc=Il est clair que quelque chose ne va pas chez ce rat. Sa fourrure noire et grasse et sa peau pourrie sont très différentes des rats en bonne santé que vous avez vus auparavant. Ses yeux vert pâle le rendent particulièrement menaçant.\n\nLe rat transporte avec lui un nuage de puanteur horrible qui, de près, est d'une force écrasante.\n\nUn suintement sombre s'échappe de la gueule du rat, il ronge le sol mais semble se dissoudre dans l'eau.
actors.mobs.fetidrat.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.fetidrat.name=rat fétide
actors.mobs.fungalcore.desc=Ce champignon gigantesque doit être à l'origine de toute l'activité fongique de cette grotte.
actors.mobs.fungalcore.name=noyau fongique
actors.mobs.fungalsentry.desc=Ce champignon particulièrement grand sert de point de défense pour le réseau fongique plus large qui vit dans cette grotte.\n\nIl est immobile, mais tire des rafales de poison précises sur tout ce qui se trouve dans sa ligne de mire. Bien que l'impact de ces explosions soit assez faible, _ils peuvent accumuler des quantités mortelles de poison très rapidement._ Bien qu'il puisse être tué, il est probablement préférable de l'éviter.
actors.mobs.fungalsentry.name=sentinelle fongique
actors.mobs.fungalspinner.desc=Cette tortue des cavernes semble être contrôlée par un champignon parasite. Le champignon a également modifié ses capacités, remplaçant sa toile et ses sacs à venin par une croissance fongique.\n\nLa vrille fongique crachera de la végétation vers vous au lieu de ses toiles, propageant la végétation fongique et risquant de vous enraciner. Bien qu'elle ne puisse pas empoisonner, la vrille fongique gagne une résistance aux dégâts substantielle si elle est adjacente à des champignons.
actors.mobs.fungalspinner.name=filière fongique
actors.mobs.ghoul.desc=Alors que la société naine commençait à s'effondrer et que le roi actuel des nains s'emparait du pouvoir absolu, ceux qui étaient faibles ou qui lui résistaient n'étaient pas bien traités. De plus en plus habile à manier la magie noire, le roi a plié ces nains à sa volonté, et ils constituent aujourd'hui les fantassins de son armée.\n\nLes goules ne sont pas particulièrement fortes par elles-mêmes, mais elles se déplacent toujours en groupe et sont beaucoup plus difficiles à tuer en grand nombre. lorsqu'une goule est vaincue, elle se relève après quelques tours si une autre goule se trouve à proximité
actors.mobs.ghoul.name=goule naine
actors.mobs.gnoll.desc=Les gnolls sont des humanoïdes ressemblant à des hyènes. Ils vivent dans les égouts et les donjons, s'aventurant de temps à autre à la surface. Les éclaireurs gnolls sont des membres réguliers de leur meute. Ils ne sont pas aussi forts que les brutes ni aussi intelligents que les chamans.
actors.mobs.gnoll.name=éclaireur gnoll
actors.mobs.gnollexile.desc=Ce gnoll à la fourrure grise porte une grande marque sur l'épaule, indiquant qu'il est un exilé. Les gnolls sont généralement exilés de leur société pour avoir ignoré les ordres ou enfreint les lois. Les exilés doivent être forts et astucieux pour survivre, et celui-ci semble savoir se servir de la lance qu'il tient.
actors.mobs.gnollexile.desc_aggro=l'exilé gnoll regarde autour de lui avec colère. Il semble que quelque chose l'ait décidé à se battre après tout. Attention à cette lance !
actors.mobs.gnollexile.desc_passive=il ne semble pas aussi agressif que les autres gnolls ici, et ne pense probablement pas que vous battre en vaille la peine. Vous pourriez le laisser passer, mais il a un sac à dos qui pourrait contenir des objets utiles...
actors.mobs.gnollexile.name=exil des gnolls
actors.mobs.gnollexile.seen_aggro=Le gnoll armé d'une lance passe à l'attaque !
actors.mobs.gnollexile.seen_passive=Le gnoll armé d'une lance vous regarde avec méfiance, mais ne bouge pas pour attaquer.
actors.mobs.gnollgeomancer.alert=Le géomancien se réveille ! La grotte entière semble se déplacer tandis qu'il s'éloigne en riant à gorge déployée !
actors.mobs.gnollgeomancer.desc=Ce gnoll âgé, d'une taille impressionnante, doit être à l'origine des diverses magies de terrassement dans les environs et l'organisateur de toute l'activité des gnolls. Contrairement aux gnolls sapeurs de la région, le géomancien maîtrise parfaitement sa magie et ne peut pas être endommagé par des rochers lancés ou tombés. Il n'a cependant aucun moyen de se battre au corps à corps.
actors.mobs.gnollgeomancer.desc_armor=Le géomancien est actuellement entouré d'une couche d'armure de roche. vous devrez vous approcher et la briser avec votre pioche avant de pouvoir endommager le géomancien
actors.mobs.gnollgeomancer.desc_armor_sapper=un sapeur gnoll proche tient un dispositif qui renforce l'armure de pierre du géomancien. Vous ne pourrez pas l'endommager du tout pour l'instant !
actors.mobs.gnollgeomancer.desc_sleeping=Ce chaman gnoll d'une taille impressionnante est entouré d'une couche de roche et ressemble presque à une statue. En regardant de près, on peut voir la roche bouger magiquement au rythme de la respiration du gnoll supérieur. Il ne peut pas être blessé lorsqu'il est entouré d'une telle couche de roche, et il semble profiter d'une véritable sieste dans la poussière.\n\nVous pouvez probablement percer les couches de roche avec votre pioche, mais _assurez-vous d'être prêt à vous battre_ Le géomancien doit être la source des diverses magies de terrassement par ici, et l'organisateur de toute l'activité des gnolls. il serait bon de vaincre les gnolls éparpillés ici avant de le combattre
actors.mobs.gnollgeomancer.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.gnollgeomancer.name=géomancien gnoll
actors.mobs.gnollgeomancer.rock_kill=Le rocher volant vous a tué...
actors.mobs.gnollgeomancer.rockfall_kill=Les chutes de pierres t'ont tué...
actors.mobs.gnollgeomancer.warning=Le géomancien commence à s'agiter. Assurez-vous d'être prêt avant de continuer !
actors.mobs.gnollguard.def_verb=bloqué
actors.mobs.gnollguard.desc=Un gnoll de grande taille et d'apparence robuste, brandissant une lance et un bouclier, mais pas de casque. Ces gardes sont probablement des brutes en formation, chargées de protéger la mine contre l'invasion des animaux sauvages.\n\nLe garde gnoll est assez fort pour manier la lance d'une seule main, mais il ne sait pas très bien s'en servir. il aura besoin d'un espace assez ouvert pour attaquer à distance, et vous infligera beaucoup moins de dégâts si vous vous approchez
actors.mobs.gnollguard.desc_armor=un sapeur gnoll proche tient un dispositif qui confère à ce garde une armure de terre, réduisant fortement les dégâts qu'il subit
actors.mobs.gnollguard.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.gnollguard.name=garde gnoll
actors.mobs.gnollguard.spear_warn=Le gnoll porte un coup vicieux avec la pointe de sa lance !
actors.mobs.gnollsapper.desc=Un gnoll petit et faible mais intelligent, à la fourrure pâle et à la sacoche remplie de gadgets divers. Ils sont probablement ici pour aider à la prospection et à l'extraction de l'or noir, et ont un garde à proximité pour les protéger. Ils sont capables de se battre, mais leurs attaques sont pitoyablement faibles, pas plus fortes que celles d'un gnoll éclaireur.\n\nAu lieu de se battre directement, les sapeurs préfèrent utiliser les divers gadgets dont ils disposent pour faire attaquer l'environnement rocheux à leur place. Cependant, comme ils ne connaissent pas la magie du terrassement, ils risquent d'utiliser leurs gadgets de façon inconsidérée. il devrait y avoir de nombreuses façons d'utiliser leurs attaques contre eux, ou contre leur garde
actors.mobs.gnollsapper.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.gnollsapper.name=sapeur gnoll
actors.mobs.gnolltrickster.desc=Une créature à l'allure étrange, même pour un gnoll. Elle se penche vers l'avant avec un sourire malicieux, serrant presque dans ses bras la sacoche qui pend sur son épaule. Ses yeux sont écarquillés par un étrange mélange de peur et d'excitation.\n\nSa sacoche contient une grande collection de fléchettes de mauvaise facture, qui semblent toutes dotées de diverses substances nocives.
actors.mobs.gnolltrickster.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.gnolltrickster.name=gnoll filou
actors.mobs.goldenmimic.desc=Les mimiques sont des créatures magiques qui peuvent prendre la forme qu'elles souhaitent. Dans les donjons, ils prennent presque toujours la forme d'un coffre à trésor, afin d'attirer les aventuriers peu méfiants.\n\nLes mimiques dorées sont des mimiques plus robustes qui tentent d'attirer les aventuriers les plus forts. Ils ont un meilleur butin, mais sont aussi beaucoup plus forts que les mimiques normales.
actors.mobs.goldenmimic.name=mimique d'or
actors.mobs.golem.def_verb=bloqué
actors.mobs.golem.desc=Les nains ont tenté d'allier leurs connaissances mécaniques à leur nouveau pouvoir de lier les élémentaires. Ils ont donné aux corps mécaniques des golems une « âme » faite d'esprits de la terre, qu'ils croyaient les plus dociles. Mais la moindre erreur dans le rituel pouvait les rendre incontrôlables.
actors.mobs.golem.name=golem
actors.mobs.goo.!!!=! !!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=On sait peu de choses sur Goo. Ce n'est peut-être même pas une créature, mais un amas de substances des égouts qui aurait acquis un semblant de volonté.
actors.mobs.goo.enraged=furieux
actors.mobs.goo.gluuurp=GLUUUURP !
actors.mobs.goo.name=Goo
actors.mobs.goo.notice=GLURP-GLURP !
actors.mobs.goo.pumpup=Goo se gonfle !
actors.mobs.goo.rankings_desc=Absorbé par le Goo
actors.mobs.greatcrab.def_verb=bloqué
actors.mobs.greatcrab.desc=Ce crabe est gigantesque, même par rapport aux autres crabes d'égout. Sa carapace bleue est couverte de fissures et de bernacles, ce qui témoigne de son âge. Il se traîne lentement, gardant à peine l'équilibre avec sa pince massive.\n\nLe crabe n'a qu'une seule pince, mais sa taille compense largement. Le crabe tient sa pince devant toute menace, se protégeant derrière un mur de carapace impénétrable. Cependant, le crabe ne peut pas bloquer les attaques qu'il ne voit pas venir, ni les attaques de plusieurs ennemis à la fois.
actors.mobs.greatcrab.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.greatcrab.name=grand crabe
actors.mobs.greatcrab.noticed=Le crabe bloque avec sa pince massive.
actors.mobs.guard.def_verb=bloqué
actors.mobs.guard.desc=Autrefois gardiens de la prison, ces gardiens ne sont plus depuis longtemps différents des détenus. Ils se déplacent comme des zombies, parcourant les couloirs sans réfléchir, à la recherche de tout ce qui n'est pas à sa place, comme vous !\n\nIls portent des chaînes autour des hanches, probablement utilisées pour tirer les ennemis à bout portant.
actors.mobs.guard.name=gardien de prison
actors.mobs.guard.scorpion=Venez ici !
actors.mobs.hermitcrab.def_verb=bloqué
actors.mobs.hermitcrab.desc=Pour une raison ou une autre, ce crabe d'égout a décidé de porter sur sa tête la partie supérieure cassée d'un tonneau ! Le poids supplémentaire l'a ralenti à une vitesse normale, mais lui a aussi permis d'accroître considérablement sa défense. On croit entendre quelque chose rebondir à l'intérieur du tonneau...
actors.mobs.hermitcrab.name=bernard-l'hermite
actors.mobs.mimic.desc=Les mimiques sont des créatures magiques qui peuvent prendre la forme qu'elles souhaitent. Dans les donjons, elles prennent presque toujours la forme d'un coffre à trésor, afin d'attirer les aventuriers peu méfiants.
actors.mobs.mimic.discover_hint=Vous pouvez trouver cet ennemi n'importe où dans le donjon.
actors.mobs.mimic.hidden_hint=Il y a quelque chose d'anormal dans ce coffre... S'approcher et essayer de l'ouvrir pourrait être une mauvaise idée.
actors.mobs.mimic.name=mimique
actors.mobs.mimic.reveal=Cette poitrine est une imitation !
actors.mobs.mob.died=Vous entendez quelque chose mourir au loin.
actors.mobs.mob.discover_hint=Vous trouverez cet ennemi dans une région spécifique du donjon.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Tué par : %s
actors.mobs.monk$focus.desc=Ce moine est parfaitement au point sur sa cible et semble anticiper ses mouvements avant qu'elle ne les fasse.\n\nLorsqu'il est concentré, la prochaine attaque physique portée contre ce personnage est assurée de rater, quelles que soient les circonstances. Parer cette attaque consommera la concentration du moine, qui devra la reconstituer pour parer une autre attaque. Les moines accumulent leur concentration plus rapidement lorsqu'ils se déplacent.
actors.mobs.monk$focus.name=ciblé
actors.mobs.monk.def_verb=bloqué
actors.mobs.monk.desc=Ces moines fanatiques ont juré de protéger les secrets de leur cité contre les étrangers. Ils ne portent ni armure ni arme et comptent uniquement sur leur maîtrise du combat à mains nues.
actors.mobs.monk.name=moine nain
actors.mobs.monk.parried=parried
actors.mobs.necromancer$necroskeleton.desc=Ce squelette a été invoqué par un nécromancien. Il se comporte comme un squelette normal et meurt lorsque le nécromancien qui l'a invoqué est tué.
actors.mobs.necromancer$necroskeleton.name=squelette du nécromancien
actors.mobs.necromancer.desc=Ces apprentis mages noirs ont afflué dans la prison, car c'est l'endroit idéal pour pratiquer leur art maléfique.\n\nLes nécromanciens invoquent des squelettes et leur donnent les moyens de se battre pour eux. En tuant le nécromancien, vous tuerez également le squelette qu'il a invoqué.
actors.mobs.necromancer.name=nécromancien
actors.mobs.npcs.blacksmith.cant_enter_old=Cette zone n'est pas accessible sur ce parcours. Jouez une nouvelle partie pour essayer la nouvelle quête !
actors.mobs.npcs.blacksmith.def_verb=bloqué
actors.mobs.npcs.blacksmith.desc=Ce forgeron troll ressemble à tous les trolls : il est grand et maigre, et sa peau ressemble à de la pierre, tant par sa couleur que par sa texture. Le forgeron troll bricole des outils disproportionnés.
actors.mobs.npcs.blacksmith.enter_no=Pas encore
actors.mobs.npcs.blacksmith.enter_yes=Je suis prêt
actors.mobs.npcs.blacksmith.entrance_blocked=La descente est bloquée.
actors.mobs.npcs.blacksmith.exit_no=Pas encore
actors.mobs.npcs.blacksmith.exit_warn_crystal=Le cristal géant est toujours là. Je paierai un supplément si vous le détruisez.
actors.mobs.npcs.blacksmith.exit_warn_full=Vous avez terminé ? Vous avez beaucoup d'or, mais assurez-vous de n'avoir oublié aucun de vos équipements.\n\nsouvenez-vous, je ne vous laisserai pas revenir une fois que vous serez remontés
actors.mobs.npcs.blacksmith.exit_warn_fungi=Le champignon géant est toujours là. Je paierai un supplément si vous le tuez.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Ce gnoll géomancien est toujours là-dessous aussi. Je paierai un supplément si vous le tuez.
actors.mobs.npcs.blacksmith.exit_warn_high=Vous avez terminé ? On dirait que vous avez une bonne quantité d'or, mais j'aurais besoin d'un peu plus. Vous devriez être en mesure d'obtenir _40 pièces._\n\n♪ Rappelle-toi, je ne te laisserai pas revenir une fois que tu seras remonté. ♪
actors.mobs.npcs.blacksmith.exit_warn_low=Vous avez déjà fini ? On dirait que vous n'avez pas beaucoup d'or. Vous devriez pouvoir obtenir _40 pièces._\n\n♪ Rappelle-toi, je ne te laisserai pas revenir une fois que tu seras remonté. ♪
actors.mobs.npcs.blacksmith.exit_warn_med=Vous avez terminé ? Vous avez au moins de l'or, mais il y en a certainement plus dans la mine. Vous devriez pouvoir obtenir _40 pièces_\n\n♪ Rappelle-toi, je ne te laisserai pas revenir une fois que tu seras remonté. ♪
actors.mobs.npcs.blacksmith.exit_warn_none=Vous avez déjà fini ? Tu n'as presque plus d'or ! Tu devrais pouvoir obtenir _40 pièces._\n\n♪Remember, I'm not lettin' back in once you come up.♪
actors.mobs.npcs.blacksmith.exit_yes=J'en ai fini
actors.mobs.npcs.blacksmith.get_lost=Je suis occupé. Allez vous faire voir !
actors.mobs.npcs.blacksmith.intro_quest_cleric=Hé, l'homme ! Tu as l'air d'être quelqu'un d'important.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Attention, la mine est dangereuse pour un petit humain comme toi. Elle a été abandonnée pendant un certain temps et des cristaux ont commencé à pousser. Ils sont brillants, mais trop fragiles pour valoir quoi que ce soit, et ils sont protégés par des trucs magiques. Ils sont assez forts, alors _faites attention où vous creusez_ ou vous attirerez leur attention.\n\nIl y a aussi un _cristal géant_ quelque part. Il est beaucoup plus résistant, alors prépare-toi à te battre si tu commences à le briser. Je parie qu'en le brisant, vous ralentirez la croissance des cristaux, alors je paierai un supplément si vous y arrivez.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Hé, l'homme ! Tu as l'air courageux.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Attention, la mine est dangereuse pour un petit humain comme toi. Il y a une sorte de monstre fongique qui s'y est développé. Il y a des champignons sentinelles qui sont vraiment mortels s'ils te voient, mais ils ne peuvent pas se lever et te poursuivre. restez hors de vue si vous voulez rester en vie.\n\nJe paierai un supplément si vous parvenez à abattre le _plus grand mushrom_, mais cela vous demandera un réel effort. Il est connecté à un tas de nœuds de mycélium cachés dans les murs. Vous devrez casser la plupart d'entre eux avant de pouvoir l'endommager.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Attention, la mine est dangereuse pour un petit humain comme toi. Des gnolls veulent aussi l'or et maintenant ils détruisent l'endroit. Comme ils sont stupides, leurs activités minières ont provoqué toutes sortes d'effondrements et d'éboulements. Vous allez devoir creuser à travers, alors _recherchez les roches récemment perturbées_\n\nJe pense que c'est l'un des gnolls qui cause le plus d'ennuis, probablement un chaman géomancien ou quelque chose comme ça. Je paierai un supplément si vous pouvez le trouver et le tuer, mais je suis sûr qu'il se défendra.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Hé, l'homme ! Tu as l'air d'être rapide.
actors.mobs.npcs.blacksmith.intro_quest_mage=Hé, l'homme ! Tu as l'air intelligent.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Hé, l'homme ! Tu as l'air d'un sournois.
actors.mobs.npcs.blacksmith.intro_quest_start=Tu veux être utile, hein ? Oui, j'ai quelque chose à te proposer. J'ai construit cet atelier sur une vieille mine, c'est juste en bas de l'échelle. Prends cette pioche et extrait du minerai d'or sombre. 40 pièces devraient suffire. La roche en bas est belle et douce, alors _tu pourras miner à travers les murs avec un peu d'effort_\n\nComment ça, comment je vais payer ? Espèce d'avare...\n\nOk, ok, je peux faire un peu de forge pour toi. Considère-toi chanceux, je suis le seul forgeron dans le coin.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Hé, l'homme ! Tu as l'air d'un dur à cuire.
actors.mobs.npcs.blacksmith.lost_pick=Vous vous moquez de moi ? Où est ma pioche ?
actors.mobs.npcs.blacksmith.name=forgeron troll
actors.mobs.npcs.blacksmith.quest_start_prompt=Vous êtes prêt à descendre ? Assurez-vous d'avoir de l'espace libre pour l'or.\n\nje ne vous laisserai descendre qu'une seule fois !
actors.mobs.npcs.blacksmith.reminder=Vous avez fini de me faire perdre mon temps ? L'entrée de la mine est là-bas.
actors.mobs.npcs.blacksmith.reminder_crystal=Apportez-moi le plus d'or possible et essayez aussi de briser le grand cristal.
actors.mobs.npcs.blacksmith.reminder_fungi=Apportez-moi le plus d'or possible et essayez de tuer le champignon géant.
actors.mobs.npcs.blacksmith.reminder_gnoll=Apportez-moi le plus d'or possible et essayez de tuer le gnoll géomancien.
actors.mobs.npcs.ghost.crab_1=Bonjour %s... Autrefois, j'étais comme toi, fort et confiant... Mais j'ai été tué par une ancienne créature... Je ne peux pas quitter cet endroit... Pas avant d'avoir pris ma revanche... Tuez le _grand crabe_ qui a pris ma vie...\n\nIl est anormalement vieux... Avec une seule pince massive et une carapace épaisse... attention à sa pince, vous devez surprendre le crabe ou il se bloquera avec elle..
actors.mobs.npcs.ghost.crab_2=Je vous en prie... Aidez-moi... Tuez le crustacé...\n\n_Il bloquera toujours... Quand il vous voit arriver..
actors.mobs.npcs.ghost.desc=Le fantôme est à peine visible. Il ressemble à un point informe de faible lumière avec un visage triste.
actors.mobs.npcs.ghost.find_me=Merci... venez me retrouver...
actors.mobs.npcs.ghost.gnoll_1=Bonjour %s... Il fut un temps où j'étais comme toi, fort et confiant... Mais j'ai été tué par un ennemi sournois... Je ne peux pas quitter cet endroit... Pas avant d'avoir pris ma revanche... Tuez le _gnoll fourbe_ qui m'a volé ma vie...\n\nIl n'est pas comme les autres gnolls... Il se cache et utilise des armes de jet... attention à ses fléchettes empoisonnées et incendiaires, n'attaquez pas à distance..
actors.mobs.npcs.ghost.gnoll_2=Je vous en prie... Aidez-moi... Tuez l'illusionniste...\n\nne le laissez pas vous frapper... Approche-toi d'elle..
actors.mobs.npcs.ghost.name=fantôme triste
actors.mobs.npcs.ghost.rat_1=Bonjour %s... Autrefois, j'étais comme toi, fort et confiant... Mais j'ai été tué par une bête immonde... Je ne peux pas quitter cet endroit... Pas avant d'avoir pris ma revanche... Tuez le _rat fétide_ qui a pris ma vie...\n\nIl rôde sur ce sol... Répandant la saleté partout... attention à son nuage de puanteur et à sa morsure corrosive, l'acide se dissout dans l'eau..
actors.mobs.npcs.ghost.rat_2=Je vous en prie... Aidez-moi... Tuez l'abomination...\n\ncombattez-la près de l'eau... Évitez la puanteur..
actors.mobs.npcs.imp.cya=A bientôt, %s !
actors.mobs.npcs.imp.desc=Les diablotins sont des démons mineurs. Ils ne se distinguent ni par leur force ni par leurs talents magiques, mais ils sont assez intelligents et sociables. De nombreux diablotins préfèrent vivre parmi les non-démons.
actors.mobs.npcs.imp.golems_1=Dans mon cas, ce sont des _golems_ qu'il faut tuer. Vous voyez, je vais lancer une petite affaire ici, mais ces stupides golems sont mauvais pour les affaires ! Il est très difficile de négocier avec des blocs de granit errants, bon sang ! Alors, tuez... disons _4 d'entre eux_ et vous recevrez une récompense.
actors.mobs.npcs.imp.golems_2=Comment se passe votre safari golem ? N'oubliez pas de prendre vos jetons.
actors.mobs.npcs.imp.hey=Psst, %s !
actors.mobs.npcs.imp.intro=Es-tu un aventurier ? J'adore les aventuriers ! On peut toujours compter sur eux si quelque chose doit être tué, n'est-ce pas ? Pour une prime bien sûr ;)
actors.mobs.npcs.imp.monks_1=Dans mon cas, ce sont des _monsks_ qu'il faut tuer. Vous voyez, je vais lancer un petit commerce ici, mais ces fous n'achètent rien eux-mêmes et feront fuir les autres clients. Alors tuez... disons _5 d'entre eux_ et vous recevrez une récompense.
actors.mobs.npcs.imp.monks_2=Oh, tu es encore en vie ! Je savais que ton kung-fu serait plus fort ;) N'oubliez pas d'attraper ces jetons.
actors.mobs.npcs.imp.name=ambitieux imp
actors.mobs.npcs.impshopkeeper.buyback=Le lutin vous renvoie joyeusement votre article.
actors.mobs.npcs.impshopkeeper.desc=Le diablotin a installé une petite boutique à la limite des salles intérieures. Il est agréable de voir un visage amical, mais ses prix ne le sont pas.
actors.mobs.npcs.impshopkeeper.greetings=Bonjour, %s !
actors.mobs.npcs.impshopkeeper.greetings_ascent=Qu'as-tu fait %s ? Magasinez vite, il faut que je sorte d'ici !
actors.mobs.npcs.impshopkeeper.name=ambitieux imp
actors.mobs.npcs.impshopkeeper.thief=Je pensais pouvoir vous faire confiance !
actors.mobs.npcs.mirrorimage.desc=Cette illusion vous ressemble beaucoup, mais elle est plus pâle et tressaille légèrement.
actors.mobs.npcs.mirrorimage.discover_hint=Vous pouvez trouver ce personnage à l'aide d'un parchemin spécifique.
actors.mobs.npcs.mirrorimage.name=image miroir
actors.mobs.npcs.npc.discover_hint=Vous trouverez ce personnage dans une région spécifique du donjon.
actors.mobs.npcs.prismaticimage.desc=Cette illusion chatoyante vous ressemble beaucoup, et semble même porter votre arme et votre armure actuelles.\n\nLes images prismatiques tenteront de chercher et d'attirer l'attention des ennemis, en utilisant leur défense et leur santé améliorées pour vous protéger. Bien qu'elles n'aient pas la même puissance offensive que les images miroirs, elles bénéficient d'une meilleure durabilité, et notamment des avantages de votre armure.\n\nLorsqu'elles sont réduites à 0 pv, les images prismatiques s'estompent en plusieurs tours et peuvent toujours être soignées pendant ce temps. Lorsqu'aucun ennemi n'est présent, les images prismatiques disparaissent et rejoignent leur maître.
actors.mobs.npcs.prismaticimage.discover_hint=Vous pouvez trouver ce personnage à l'aide d'un parchemin spécifique.
actors.mobs.npcs.prismaticimage.name=image prismatique
actors.mobs.npcs.ratking.confused=Qu... Où suis-je ? Mon royaume a besoin de moi !
actors.mobs.npcs.ratking.crown_after=Vous appréciez votre nouvelle armure ? Pas de retour en arrière !
actors.mobs.npcs.ratking.crown_clothes=Habillez-vous ! Vous n'êtes pas en état de parler à la royauté !
actors.mobs.npcs.ratking.crown_desc=Oooh, est-ce que cette couronne est pour moi ? Elle a l'air bien plus brillante que la mienne, alors j'accepte gracieusement !\n\nEn fait, je pense que je peux vous offrir quelque chose en récompense de cette couronne. Un pouvoir extraordinaire, digne d'un héros tel que vous ! Cela vous plairait-il ?
actors.mobs.npcs.ratking.crown_fine=Très bien ! Ce n'est pas comme si je le voulais de toute façon...
actors.mobs.npcs.ratking.crown_info=Dites-moi d'abord un peu plus.
actors.mobs.npcs.ratking.crown_no=Je ne préfère pas...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, merci ! Maintenant, vas-y et rends ton roi fier de toi !
actors.mobs.npcs.ratking.crown_yes=Bien sûr !
actors.mobs.npcs.ratking.desc=Ce rat est un peu plus gros qu'un rat marsupial ordinaire. Il porte une petite couronne sur la tête.
actors.mobs.npcs.ratking.desc_birthday=Ce rat est un peu plus grand qu'un rat marsupial ordinaire. Il porte un petit chapeau de fête vert au lieu de sa couronne habituelle. Joyeux anniversaire Roi des rats !
actors.mobs.npcs.ratking.desc_crown=Ce rat est un peu plus grand qu'un rat marsupial ordinaire. Il porte une couronne de roi nain sur la tête.
actors.mobs.npcs.ratking.desc_winter=Ce rat est un peu plus grand qu'un rat marsupial ordinaire. Il porte un petit chapeau de fête au lieu de sa couronne habituelle. Joyeuses fêtes !
actors.mobs.npcs.ratking.discover_hint=Vous trouverez ce personnage à la fin d'une région spécifique du donjon.
actors.mobs.npcs.ratking.name=roi des rats
actors.mobs.npcs.ratking.not_sleeping=Je ne dors pas !
actors.mobs.npcs.ratking.what_is_it=Qu'est-ce que c'est ? Je n'ai pas de temps à perdre avec ces bêtises. Mon royaume ne se gouverne pas tout seul !
actors.mobs.npcs.sheep.baa!=Baa !
actors.mobs.npcs.sheep.baa.=Bêlement.
actors.mobs.npcs.sheep.baa...=Bêlement...
actors.mobs.npcs.sheep.baa?=Baa ?
actors.mobs.npcs.sheep.def_verb=bloqué
actors.mobs.npcs.sheep.desc=C'est un mouton magique. Qu'est-ce qu'il a de si magique ? Vous ne pouvez pas le tuer. Il restera là jusqu'à ce qu'il disparaisse comme par magie, tout en ruminant avec un regard vide.
actors.mobs.npcs.sheep.discover_hint=Vous pouvez trouver ce personnage à l'aide d'un objet ou d'un piège spécifique.
actors.mobs.npcs.sheep.name=mouton
actors.mobs.npcs.shopkeeper.buyback=Le commerçant vous rend votre article à contrecœur.
actors.mobs.npcs.shopkeeper.desc=Ce solide gaillard semble plus à sa place dans un quartier commerçant d'une grande ville que dans un donjon. Ses prix expliquent pourquoi il préfère faire des affaires ici.
actors.mobs.npcs.shopkeeper.flee=Le commerçant s'enfuit !
actors.mobs.npcs.shopkeeper.name=commerçant
actors.mobs.npcs.shopkeeper.sell=Vendre un objet
actors.mobs.npcs.shopkeeper.talk=Parler
actors.mobs.npcs.shopkeeper.talk_ascent=Je ne sais pas ce que tu comptes faire de cette amulette, mais je n'en veux pas. Achète quelque chose et passe à autre chose, nous devons tous les deux quitter cet endroit !
actors.mobs.npcs.shopkeeper.talk_caves=Dépenser de l'argent, vivre plus longtemps.\n\nOh, et dites bonjour au forgeron troll de ma part si vous le voyez. Rappelez-lui qu'il me doit encore de l'argent pour le marteau que je lui ai vendu la semaine dernière !
actors.mobs.npcs.shopkeeper.talk_city=Mes marchandises peuvent vous protéger ici.\n\n...Et ne traînez pas, s'il vous plaît. Il a fallu une éternité pour que les habitants me laissent tranquille, je ne veux pas que vous attiriez les ennuis !
actors.mobs.npcs.shopkeeper.talk_halls=J'ai des prix spéciaux pour les chasseurs de démons !\n\nOh, et faites attention en bas ! Les démons d'en bas se moquent bien de ton courage. Tu ne peux pas remonter et dépenser plus d'argent si tu es mort ! ;)\n\nLes démons sont-ils comme moi ? Hehe, pas du tout. Je ne suis qu'un petit bonhomme, pas un grand combattant, et j'ai réussi à garder mon esprit intact. Les démons d'en bas sont bien plus forts, et ils ont tous été asservis par... enfin... faites attention en bas.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Eh bien, bonjour Votre Altesse, ou est-ce Votre Sainteté maintenant ? Quoi qu'il en soit, ce n'est pas un endroit pour vous, beaucoup de gens seraient désemparés si vous finissiez par mourir. Vous avez sûrement quelques pièces, pourquoi ne pas acheter quelque chose pour éviter cela ?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Si ce n'est pas le héros voyageur ! Si vous essayez de sauver une autre ville, alors bonne chance, les dangers ici sont bien pires que les petites bandes de bandits. Je suis sûr que vous ferez mieux que n'importe qui d'autre, mais essayez de ne pas mourir juste devant mon magasin.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Vous ne semblez pas être dans votre élément, mademoiselle. Les couloirs étroits des donjons ne sont pas aussi spacieux que les grandes salles ou les forêts qui entourent la ville, n'est-ce pas ? Hehe, oh ne faites pas attention à mes divagations, pourquoi ne pas acheter quelque chose ?
actors.mobs.npcs.shopkeeper.talk_prison_intro=J'ai tout ce qu'il faut pour une aventure réussie !
actors.mobs.npcs.shopkeeper.talk_prison_mage=Héhé, je crois que j'ai vu un avis de recherche avec votre nom quelque part dans la ville. En fuite, n'est-ce pas ? Oh, vous êtes innocent, n'est-ce pas ? Bien sûr, bien sûr... Ne vous inquiétez pas, j'ai mieux à faire que de faire un rapport sur vous, mais peut-être devriez-vous acheter quelque chose pour être sûr ?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Vous venez de la guilde des voleurs pour nettoyer la zone ? Non, je fais juste du shopping ? Eh bien, tuez quelques monstres pendant que vous êtes ici, de toute façon. Ne vous attendez pas à une remise non plus, je vous paie une bonne protection et vous avez du mal à me protéger ici.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=C'est un sceau intéressant que vous avez là, ils sont généralement en un seul morceau. Vous êtes un héros en disgrâce ou quelque chose comme ça ? Ce que vous avez fait ne me regarde pas, vos pièces sont encore bonnes.
actors.mobs.npcs.shopkeeper.thief=Voleur, voleur !
actors.mobs.npcs.shopkeeper.warn=Attention ! Je ne vous préviendrai plus.
actors.mobs.npcs.vaultlaser.desc=Cette sentinelle tire des lasers à intervalles réguliers. comme ce n'est qu'une zone de test, les lasers ne vous blesseront pas
actors.mobs.npcs.vaultlaser.name=sentinelle laser de la chambre forte
actors.mobs.npcs.vaultsentry.desc=Cette sentinelle scrute la zone en suivant un schéma. comme c'est juste une zone de test, la sentinelle ne fera rien si elle vous détecte
actors.mobs.npcs.vaultsentry.name=sentinelle de balayage de la chambre forte
actors.mobs.npcs.wandmaker.def_verb=bloqué
actors.mobs.npcs.wandmaker.desc=Ce vieil homme robuste arbore une expression légèrement confuse. Il est protégé par un bouclier magique.
actors.mobs.npcs.wandmaker.intro_1=Je suis venu ici pour trouver un ingrédient rare pour une baguette, mais je me suis perdu et mon bouclier magique s'affaiblit. Je vais devoir partir bientôt, mais je ne peux pas supporter de partir sans avoir obtenu ce que je suis venu chercher.
actors.mobs.npcs.wandmaker.intro_2=Si vous pouvez obtenir cela pour moi, je serai heureux de vous payer avec l'une de mes baguettes finement travaillées ! J'en ai apporté deux, vous pouvez prendre celle que vous préférez.
actors.mobs.npcs.wandmaker.intro_berry=L'ancien directeur de cette prison gardait un _plant de groseilles_ et j'aimerais obtenir une de ses graines. La plante est probablement devenue sauvage maintenant, alors lui faire donner une graine pourrait être délicat. Son jardin doit se trouver quelque part par ici. Essayez de vous _éloigner de ses lashers_ si vous voulez rester en vie. Il est tentant d'utiliser le feu, mais ne le faites pas, vous tueriez la plante et détruiriez ses graines.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, bonjour Votre Altesse ! Quelle agréable surprise de vous rencontrer dans un endroit aussi déprimant ! Je n'aime pas m'imposer, mais j'ai peut-être une tâche à vous confier.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, bonjour mademoiselle ! Quelle agréable surprise de rencontrer un héros dans un endroit aussi déprimant ! Si vous avez envie d'aider un vieil homme, j'ai peut-être une mission à vous confier.
actors.mobs.npcs.wandmaker.intro_dust=Je cherche de la _poussière de corpse_. C'est une sorte de farine d'os maudite qui apparaît généralement dans des endroits comme celui-ci. Il doit y avoir une pièce barricadée quelque part par ici, je suis sûr qu'on y trouvera de la poussière. Mais faites attention, la malédiction que porte la poussière est très puissante, _revenez me voir aussi vite que possible_ et je la nettoierai pour vous.
actors.mobs.npcs.wandmaker.intro_ember=Je cherche des _bougies fraîches_ d'un élémentaire de feu qui vient de naître. Les élémentaires apparaissent généralement lorsqu'un rituel d'invocation n'est pas contrôlé, alors trouvez quelques bougies et un lieu de rituel et je suis sûr que vous pourrez en faire apparaître un. Vous devrez _éviter de vous enfermer_ en le combattant, ou vous pourriez _garder une sorte d'objet glaçant à portée de main_ Les élémentaires nouveau-nés sont assez puissants et chaotiques, mais ils ne supportent pas le froid.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, bonjour mademoiselle ! Un visage amical est une agréable surprise ici, n'est-ce pas ? En fait, je jurerais avoir déjà vu votre visage, mais je n'arrive pas à mettre le doigt dessus... Si vous êtes ici pour l'aventure, j'ai peut-être une mission à vous confier.
actors.mobs.npcs.wandmaker.intro_mage=Oh, bonjour %s ! J'ai entendu dire qu'il y avait eu du grabuge entre toi et l'institut des sorciers ? Oh, peu importe, je n'ai jamais aimé ces gens-là de toute façon. Si vous le voulez bien, j'ai une mission à vous confier.
actors.mobs.npcs.wandmaker.intro_rogue=Mon Dieu, vous m'avez fait peur ! Je n'ai jamais rencontré de bandit de cet endroit qui soit encore sain d'esprit, alors vous devez venir de la surface ! Si vous êtes prêt à aider un étranger, j'ai peut-être une mission à vous confier.
actors.mobs.npcs.wandmaker.intro_warrior=Oh, bonjour ! Quelle agréable surprise de rencontrer un guerrier du nord dans un endroit aussi déprimant ! Vous avez dû faire un long voyage pour arriver jusqu'ici. Si vous cherchez l'aventure, j'ai peut-être une mission à vous confier.
actors.mobs.npcs.wandmaker.name=vieux fabricant de baguettes
actors.mobs.npcs.wandmaker.reminder_berry=Une chance avec une graine de Rotberry, %s ? Cherchez une pièce remplie de végétation.
actors.mobs.npcs.wandmaker.reminder_dust=Un peu de chance avec la poussière de cadavre, %s ? Cherche des barricades.
actors.mobs.npcs.wandmaker.reminder_ember=Un peu de chance avec ces braises, %s ? Vous devez trouver quatre bougies et le site du rituel.
actors.mobs.phantompiranha.desc=Les piranhas fantômes sont une race rare de piranhas dotés de capacités magiques et d'un corps étrangement translucide. Ils sont capables de se téléporter lorsqu'ils sont attaqués, soit pour s'échapper, soit pour se rapprocher rapidement de leur ennemi !\n\nBien qu'ils soient ennuyeux à combattre, leur viande est appréciée pour ses propriétés magiques.
actors.mobs.phantompiranha.name=piranha fantôme
actors.mobs.phantompiranha.teleport_away=Le piranha fantôme se téléporte au loin...
actors.mobs.piranha.desc=Ces poissons carnivores sont élevés spécifiquement pour protéger les zones inondées. Leur morsure est mortelle, il est donc préférable d'éviter de les affronter directement.
actors.mobs.piranha.discover_hint=Vous pouvez trouver cet ennemi n'importe où dans le donjon.
actors.mobs.piranha.name=piranha géant
actors.mobs.pylon.desc_active=Un pylône d'alimentation, destiné à réguler l'électricité qui alimente les machines de cette zone. Le pylône est actuellement saturé d'énergie électrique, c'est sûrement ce qui suralimente le DM-300 !\n\nDans cet état, les pylônes sont vulnérables, mais l'électricité se propage aux cellules voisines dans le sens des aiguilles d'une montre. Grâce à leur construction en métal lourd, les pylônes sont résistants à de gros dégâts.
actors.mobs.pylon.desc_inactive=Un pylône électrique, destiné à réguler l'électricité qui alimente les machines de cette zone.\n\nLe pylône est actuellement inactif et insensible aux dégâts.
actors.mobs.pylon.name=pylône électrique
actors.mobs.rat.desc=Les rats marsupiaux sont des habitants des égouts agressifs mais plutôt faibles. Leur morsure est désagréable, mais ils ne sont dangereux qu'en grand nombre.
actors.mobs.rat.name=rat marsupial
actors.mobs.ripperdemon.desc=Ces horribles créatures sont le résultat de l'utilisation par des forces démoniaques des nombreux cadavres de nains de la région. Les éventreurs sont des créatures macabres et émaciées qui ressemblent à des nains, mais dont le corps est brisé et qui sont dotés de longues griffes acérées faites d'os.\n\nLes démons éventreurs ne sont pas particulièrement résistants, mais ils sont agiles et dangereux. Ils sont capables de bondir sur de grandes distances pour atteindre rapidement leurs cibles avant de les éventrer de leurs griffes.
actors.mobs.ripperdemon.leap=Le démon éventreur se prépare à bondir !
actors.mobs.ripperdemon.name=démon éventreur
actors.mobs.rotheart.desc=Le fruit de la myrtille est très particulier. Au lieu de pourrir et de fournir des nutriments, le fruit grandit, durcit et englobe la graine. Il protège les organes internes qui poussent à l'intérieur du fruit. Cet orbe géant est appelé le cœur d'un plant de ronce adulte.
actors.mobs.rotheart.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.rotheart.name=cœur pourri
actors.mobs.rotlasher.desc=Le lasso de la pourriture fait partie de la structure racinaire d'un plant de pourpre adulte et constitue également son principal moyen de défense. Les lasers sont aveugles et enfoncés dans le sol, mais ils attaquent violemment toute menace proche après avoir pris le temps de la détecter. Lorsqu'il n'y a pas d'ennemis à proximité, ils restent immobiles, tentant de se fondre dans la végétation environnante.
actors.mobs.rotlasher.discover_hint=Vous pouvez trouver cet ennemi au cours d'une quête spécifique.
actors.mobs.rotlasher.name=l'éplucheuse de pourritures
actors.mobs.scorpio.desc=Ces énormes créatures démoniaques ressemblant à des arachnides évitent le combat au corps à corps, préférant lancer des pointes dentelées paralysantes à longue distance.
actors.mobs.scorpio.name=scorpion
actors.mobs.senior.desc=Ces moines fanatiques ont juré de protéger les secrets de leur cité contre les étrangers. Ils ne portent ni armure ni arme et comptent uniquement sur leur maîtrise du combat à mains nues.
actors.mobs.senior.name=moine supérieur
actors.mobs.shaman$blueshaman.spell_desc=Ce chaman porte un masque bleu et utilise une magie qui _augmente temporairement les dégâts que vous subissez_
actors.mobs.shaman$purpleshaman.spell_desc=Ce chaman porte un masque violet et utilise une magie qui _réduit temporairement votre précision et votre évasion_
actors.mobs.shaman$redshaman.spell_desc=Ce chaman porte un masque rouge et utilise une magie qui _affaiblit temporairement votre puissance d'attaque_
actors.mobs.shaman.bolt_kill=L'éclair magique t'a tué...
actors.mobs.shaman.desc=Les gnolls les plus intelligents peuvent apprendre la magie chamanique. Ils privilégient les sorts de combat pour compenser leur manque de force et s'en servent sans hésiter contre ceux qui contestent leur place dans la tribu.
actors.mobs.shaman.name=chaman gnoll
actors.mobs.skeleton.def_verb=bloqué
actors.mobs.skeleton.desc=Les squelettes sont faits des os d'aventuriers malchanceux et d'habitants du donjon, animés par la magie maléfique qui remonte des profondeurs. Après avoir subi assez de dégâts, ils éclatent en une explosion d'os.
actors.mobs.skeleton.explo_kill=Vous avez été tué par l'explosion d'os...
actors.mobs.skeleton.name=squelette
actors.mobs.slime.def_verb=bloqué
actors.mobs.slime.desc=Les slimes sont des créatures étranges, légèrement magiques, dotées d'un corps extérieur caoutchouteux et d'un noyau liquide. Les égouts de la ville leur fournissent une grande quantité d'eau et de nutriments.\n\nEn raison de l'élasticité de leur membrane extérieure, il est difficile de leur infliger plus de _6 points de dégâts_ par attaque.
actors.mobs.slime.name=bave
actors.mobs.snake.desc=Ces serpents surdimensionnés sont capables de se faufiler rapidement autour des coups, ce qui les rend assez difficiles à toucher. Les attaques magiques ou surprises peuvent toutefois les prendre au dépourvu.\n\nVous pouvez effectuer une attaque surprise en attaquant hors du champ de vision du serpent. L'une des méthodes consiste à laisser le serpent vous poursuivre jusqu'à une porte, puis à _frapper juste après qu'il se soit engagé dans la porte_
actors.mobs.snake.hint=Essayez d'utiliser le bouton d'examen sur un serpent pour apprendre à les contrer.
actors.mobs.snake.name=serpent d'égout
actors.mobs.spectralnecromancer.desc=Si les squelettes sont le pain et le beurre des nécromanciens, certains préfèrent se tourner vers d'autres serviteurs moins corporels. Les nécromanciens spectraux ont choisi les spectres comme leur serviteur de prédilection !\n\nLes wraiths individuels ne sont pas aussi puissants que les squelettes, mais ces nécromanciens n'ont pas peur d'en invoquer plusieurs !
actors.mobs.spectralnecromancer.name=nécromancien spectral
actors.mobs.spinner.desc=Ces araignées des cavernes, velues et verdâtres, évitent le combat direct. Elles préfèrent attendre à distance que leur victime, prise dans leur toile, succombe lentement à leur morsure venimeuse.
actors.mobs.spinner.name=araignée des cavernes
actors.mobs.statue.def_verb=bloqué
actors.mobs.statue.desc=On pourrait croire qu'il s'agit d'une statue inanimée de plus dans ce donjon, mais ses yeux rouges luisants le trahissent.
actors.mobs.statue.desc_weapon=Si la statue elle-même est en pierre, le _%s_ qu'elle brandit semble réel.
actors.mobs.statue.discover_hint=Vous pouvez trouver cet ennemi n'importe où dans le donjon.
actors.mobs.statue.name=statue animée
actors.mobs.succubus.desc=Les succubes sont des démons à l'apparence de femmes séduisantes, au style quelque peu gothique. Leur magie peut charmer un héros, qui devient incapable d'attaquer tant que le charme dure.
actors.mobs.succubus.name=succube
actors.mobs.swarm.desc=L'essaim de mouches mortelles bourdonne de colère. Toute attaque non magique le divise en deux essaims plus petits mais tout aussi dangereux.
actors.mobs.swarm.name=essaim de mouches
actors.mobs.tengu$bombability$bombblob.desc=Un nuage de fumée surchauffée s'élève ici. Attention, il va exploser !
actors.mobs.tengu$bombability$bombitem.cant_pickup=Il est collé au sol, vous ne pouvez pas le déplacer !
actors.mobs.tengu$bombability$bombitem.desc=Tengu a lancé une étrange bombe fumigène qui dégage une épaisse fumée brûlante. Elle fait un bruit de tic-tac, comme si elle comptait jusqu'à l'explosion !\n\nLa bombe s'est ancrée au sol, vous ne pouvez donc pas la ramasser.
actors.mobs.tengu$bombability$bombitem.name=bombe fumigène
actors.mobs.tengu$fireability$fireblob.desc=Tengu a lancé une poudre fine qui semble prendre de la vitesse, elle est sur le point de s'enflammer !
actors.mobs.tengu$shockerability$shockerblob.desc=L'énergie électrique s'accumule ici, tout ce qui se trouve sur cette tuile sera choqué au prochain tour !
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Il émet trop d'électricité, tu ne peux pas l'attraper !
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu a lancé une curieuse machine, qui semble faite de pièces de DM-100. La machine produit constamment des arcs électriques autour d'elle, mais ceux-ci semblent suivre un schéma prévisible.\n\nAvec tous les arcs électriques qui l'entourent, il n'y a aucune chance que vous puissiez la ramasser.
actors.mobs.tengu$shockerability$shockeritem.name=Choc
actors.mobs.tengu.defeated=Enfin libre...
actors.mobs.tengu.desc=Les Tengu appartiennent à un ancien clan d'assassins du même nom. Ils sont connus pour leur usage intensif des shurikens et des pièges.
actors.mobs.tengu.interesting=Rendons les choses intéressantes...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=J'ai compris, %s !
actors.mobs.tengu.notice_have=Je te tiens maintenant, %s !
actors.mobs.tengu.rankings_desc=Assassiné par le Tengu
actors.mobs.thief.carries=Le voleur porte un _%s._ Volé évidemment.
actors.mobs.thief.desc=Bien que ces détenus sortent librement de leur cellule, cet endroit reste leur prison. Au fil du temps, cet endroit leur a volé leur esprit et leur liberté. Depuis longtemps, ces voleurs et bandits fous ont oublié qui ils sont et pourquoi ils volent.\n\nCes ennemis sont plus enclins à voler et à fuir qu'à se battre. Veillez à ne pas les perdre de vue, sinon vous risquez de ne plus jamais revoir l'objet volé.
actors.mobs.thief.escapes=Le voleur s'enfuit avec votre %s !
actors.mobs.thief.name=voleur fou
actors.mobs.thief.stole=Le voleur vous a volé %s !
actors.mobs.tormentedspirit.desc=Les esprits tourmentés sont des esprits bons vivants qui ont été frappés par une malédiction. Tant qu'ils sont maudits, ils attaquent comme les spectres et sont plus puissants !\n\nIl peut être possible de lever la malédiction en utilisant le bon objet à côté de l'esprit. Si la malédiction est levée, l'esprit sera certainement reconnaissant...
actors.mobs.tormentedspirit.name=esprit tourmenté
actors.mobs.tormentedspirit.thank_you=Je vous remercie...
actors.mobs.vaultrat.desc=Le comportement de ce rat a été modifié pour tester la nouvelle IA de l'ennemi de la voûte :\nson mouvement peut être "entendu" à travers les murs\nil se déplace le long d'une patrouille prédéfinie\nlorsqu'il erre, sa portée de détection est fortement réduite derrière la direction dans laquelle il se déplace.\nlorsqu'il dort, sa portée de détection est également réduite\nlorsqu'il vous détecte, il "enquête" avant de passer à la chasse. Les ennemis qui enquêtent se déplacent vers vous mais n'attaquent pas et sont plus faciles à semer derrière les portes et les coins.
actors.mobs.warlock.bolt_kill=L'éclair de l'ombre t'a tué...
actors.mobs.warlock.desc=Lorsque les nains ont délaissé l'ingénierie pour les arts occultes, les sorciers ont pris le pouvoir dans la cité. Ils ont commencé par la magie élémentaire, avant de se tourner vers la démonologie et la nécromancie.
actors.mobs.warlock.name=sorcier nain
actors.mobs.wraith.desc=Un spectre est l'esprit vengeur d'un pécheur dont la tombe a été dérangée. Comme il s'agit d'une entité éthérée, il est très difficile de l'atteindre avec une arme ordinaire.
actors.mobs.wraith.discover_hint=Vous pouvez trouver cet ennemi n'importe où dans le donjon.
actors.mobs.wraith.name=spectre
actors.mobs.yogdzewa$larva.desc=Ces minuscules rejetons de Yog-Dzewa sont des serviteurs simples et faciles à produire. Bien qu'ils soient faibles individuellement, ils sont invoqués rapidement et peuvent devenir écrasants en grand nombre.
actors.mobs.yogdzewa$larva.name=larve de dieu
actors.mobs.yogdzewa$larva.rankings_desc=Dévoré par Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Dévoré par Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Dévoré par Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Dévoré par Yog-Dzewa
actors.mobs.yogdzewa.darkness=Les ténèbres se rapprochent...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa est un Vieux Dieu, une grande monstruosité qui atteint les mondes mortels et les dévore pour alimenter sa croissance sans fin. Les nains ont dû attirer l'attention de cette horreur cosmique alors qu'ils s'adonnaient à la magie noire, et tentent depuis de la contenir.\n\nYog-Dzewa est originaire d'une dimension de chaos magique brut et ne peut apporter sa véritable forme dans ce monde. Au lieu de cela, il a créé des avatars et convoqué des serviteurs démoniaques pour exécuter ses ordres ici.\n\nCet œil géant est le point central du pouvoir de Yog-Dzewa dans ce monde. Bien que l'œil lui-même soit immobile, il est capable de lancer de puissants rayons de magie démoniaque et d'invoquer divers serviteurs pour l'aider.
actors.mobs.yogdzewa.desc_spawners=Vous pouvez sentir des vagues d'énergie démoniaque irradier vers l'œil depuis les étages supérieurs. Quelque chose que tu as laissé en vie là-haut doit renvoyer de l'énergie à Yog-Dzewa. yog utilisera cette énergie pour invoquer des serviteurs plus puissants !
actors.mobs.yogdzewa.hope=VOTRE. ESPOIR. EST. UNE. ILLUSION !
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=I. VOIR. VOUS.
actors.mobs.yogdzewa.rankings_desc=Dévoré par Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Ce poing est formé d'énergie lumineuse pure. Il est capable de tirer de puissants rayons de lumière brûlante à chaque tour ! Ces rayons vous aveuglent temporairement et vous infligent de lourds dégâts. Le poing est également capable d'engloutir brièvement l'arène dans une lumière aveuglante afin de s'échapper !\n\nLe poing n'a pas de capacités spéciales qu'il peut utiliser au corps à corps.
actors.mobs.yogfist$brightfist.name=poing brillant
actors.mobs.yogfist$brightfist.teleport=Le poing se téléporte dans un éclair de lumière qui vous aveugle sérieusement !
actors.mobs.yogfist$burningfist.desc=Un poing immense enveloppé de flammes. Ses doigts crépitent en se refermant et laissent tomber des braises au sol.
actors.mobs.yogfist$burningfist.name=poing brûlant
actors.mobs.yogfist$darkfist.desc=Ce poing est formé d'énergie noire pure. Il est capable de tirer de puissantes décharges de magie noire à chaque tour ! Ces explosions affaiblissent votre source de lumière et infligent de lourds dégâts. Le poing est également capable d'engloutir brièvement l'arène dans les ténèbres afin de s'échapper !\n\nLe poing n'a pas de capacités spéciales qu'il peut utiliser au corps à corps.
actors.mobs.yogfist$darkfist.name=poing noir
actors.mobs.yogfist$darkfist.teleport=Le poing se téléporte dans une explosion de ténèbres qui éteint votre source de lumière !
actors.mobs.yogfist$rottingfist.desc=Un énorme poing de chair pourrie. Une bave infecte suinte entre ses doigts et souille la pierre en dessous.
actors.mobs.yogfist$rottingfist.name=poing pourri
actors.mobs.yogfist$rustedfist.desc=Ce poing est formé de métal vivant. Il s'agit d'une masse imposante de métal en mouvement qui possède de puissantes attaques de mêlée et peut paralyser ses cibles à distance. En raison de son énorme masse, le poing encaisse les dégâts qui lui sont infligés sur la durée, et non immédiatement.\n\nLe poing est cependant inflexible et ne peut pas se faufiler dans des passages étroits. De plus, s'il encaisse les dégâts lentement, les dégâts différés continuent d'augmenter si le poing est frappé plusieurs fois.
actors.mobs.yogfist$rustedfist.name=poing rouillé
actors.mobs.yogfist$soiledfist.desc=Ce poing est formé par la magie chaotique de la terre. Lorsqu'il se déplace, il fait pousser de la végétation autour de lui. Il peut également tirer des éclats de terre concentrés qui emprisonnent la cible dans des lianes et des racines qui poussent rapidement !\n\nLe poing tire sa puissance de cette végétation et résiste aux dégâts en fonction de la quantité de végétation haute ou sillonnée qui l'entoure !
actors.mobs.yogfist$soiledfist.name=poing souillé
actors.mobs.yogfist.desc=Ce poing est un aspect du pouvoir de Yog-Dzewa. Les poings sont liés au pouvoir de Yog-Dzewa et sont protégés de tout dommage lorsqu'ils sont près de l'œil.
actors.mobs.yogfist.invuln_warn=Le poing est invulnérable lorsqu'il est près de l'œil !
actors.mobs.yogfist.rankings_desc=Dévoré par Yog-Dzewa
actors.mobs.elemental.desc=Les élémentaires de feu errants sont des résidus d'invocations d'entités plus puissantes. Leur nature est trop chaotique pour que même le plus grand démonologue puisse les contrôler.
actors.mobs.elemental.name=élémentaire de feu
actors.mobs.king.desc=Le dernier roi des nains connaissait les secrets de la vie et de la mort. Il a convaincu sa cour de participer à un rituel censé leur offrir une jeunesse éternelle. Au bout du compte, il fut le seul à l'obtenir, avec une armée de morts-vivants en prime.
actors.mobs.king.name=Roi des nains
actors.mobs.npcs.bee.desc=Malgré leur petite taille, les abeilles dorées défendent farouchement leur maître. Elles ne vivent toutefois pas longtemps.
actors.mobs.npcs.bee.name=abeille d'or
actors.mobs.shielded.desc=Les brutes sont les plus grands, les plus forts et les plus résistants des gnolls. Gravement blessés, ils entrent dans une rage folle et infligent encore plus de dégâts.
actors.mobs.shielded.name=brute au bouclier
actors.mobs.yog.desc=Yog-Dzewa est un Dieu Ancien, une entité puissante issue des royaumes du chaos. Il y a un siècle, les anciens nains remportèrent de justesse la guerre contre son armée de démons, mais furent incapables de tuer le dieu lui-même. Ils l'emprisonnèrent alors dans les salles souterraines de leur cité, le croyant trop faible pour jamais se relever.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s transporte un _%s_. Volé, évidemment.
actors.buffs.armorevasion.name=Esquive accrue
actors.mobs.king.defeated=Tu ne peux pas me tuer, %s...Je suis... immortel...
