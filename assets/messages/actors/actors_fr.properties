actors.hero.talent$lingeringmagictracker.desc=Le Mage a récemment utilisé un bâton ou une baguette, sa prochaine attaque physique inflige des dégâts bonus.\n\nTours restants : %s.
actors.hero.talent$lingeringmagictracker.name=magie persistante
actors.hero.talent$liquidagilacctracker.desc=La prochaine attaque de mêlée régulière du duelliste bénéficie d'un bonus de précision.\n\nTours restants : %s.
actors.hero.talent$liquidagilacctracker.name=agilité des liquides
actors.hero.talent$patientstriketracker.desc=Le duelliste vient de passer un tour à attendre, sa prochaine attaque de mêlée infligera des dégâts bonus.
actors.hero.talent$patientstriketracker.name=grève des patients
actors.hero.talent$preciseassaulttracker.desc=La prochaine attaque de mêlée régulière du duelliste bénéficie d'un bonus de précision.\n\nTours restants : %s.
actors.hero.talent$preciseassaulttracker.name=assaut précis
actors.hero.talent$provokedangertracker.desc=Le guerrier a récemment perdu son bouclier, sa prochaine attaque physique inflige des dégâts bonus.\n\nTours restants : %s.
actors.hero.talent$provokedangertracker.name=a provoqué la colère
