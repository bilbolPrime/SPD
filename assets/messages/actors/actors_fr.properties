actors.blobs.blizzard.desc=Un blizzard s'abat sur la région.
actors.blobs.blizzard.name=blizzard
actors.blobs.confusiongas.desc=Un nuage de gaz de confusion tourbillonne ici.
actors.blobs.confusiongas.name=confusion gaz
actors.blobs.corrosivegas.desc=Un nuage de gaz caustique mortel tourbillonne ici.
actors.blobs.corrosivegas.name=gaz corrosif
actors.blobs.electricity.desc=Un champ d'électricité brille ici de mille feux.
actors.blobs.electricity.name=électricité
actors.blobs.electricity.ondeath=Vous avez été choqué à mort...
actors.blobs.electricity.rankings_desc=Électrocution
actors.blobs.fire.desc=Un incendie fait rage ici.
actors.blobs.fire.name=incendie
actors.blobs.foliage.desc=Des rayons de lumière percent la pénombre du jardin souterrain.
actors.blobs.foliage.name=feuillage
actors.blobs.freezing.desc=L'air est anormalement glacial ici.
actors.blobs.freezing.name=air glacial
actors.blobs.goowarn.desc=Les taches d'énergie noire pullulent ici !
actors.blobs.goowarn.name=énergie noire
actors.blobs.inferno.desc=Un enfer fait rage ici.
actors.blobs.inferno.name=brasier
actors.blobs.paralyticgas.desc=Un nuage de gaz paralysant tourbillonne ici.
actors.blobs.paralyticgas.name=gaz paralysant
actors.blobs.regrowth.name=repousse
actors.blobs.sacrificialfire.desc=Il y a ici un autel sur lequel brûle un feu sacrificiel. Toute créature tuée ici sera consumée en offrande aux esprits du donjon.\n\nPeut-être qu'une récompense sera accordée si suffisamment de sacrifices sont faits ?
actors.blobs.sacrificialfire.name=feu sacrificiel
actors.blobs.sacrificialfire.reward=Le feu s'embrase puis se dissipe, laissant derrière lui une récompense !
actors.blobs.sacrificialfire.unworthy=Le feu consume votre offrande, mais ne la change pas.
actors.blobs.sacrificialfire.worthy=Le feu consume votre offrande et se renforce.
actors.blobs.smokescreen.desc=Un nuage d'épaisse fumée noire tourbillonne ici.
actors.blobs.smokescreen.name=écran de fumée
actors.blobs.stenchgas.desc=Un nuage de puanteur fétide se répand ici.
actors.blobs.stenchgas.name=gaz nauséabond
actors.blobs.stormcloud.desc=Un nuage de vapeur d'eau tourbillonne ici.
actors.blobs.stormcloud.name=nuages d'orage
actors.blobs.toxicgas.desc=Un nuage verdâtre de gaz toxique tourbillonne ici.
actors.blobs.toxicgas.name=gaz toxique
actors.blobs.toxicgas.ondeath=Vous êtes mort à cause du gaz toxique...
actors.blobs.toxicgas.rankings_desc=Asphyxié
actors.blobs.waterofawareness.desc=Le pouvoir de la connaissance rayonne de l'eau de ce puits. En buvant de l'eau du puits, vous identifierez tous les objets équipés, vous identifierez les malédictions sur tous les objets de votre inventaire et vous découvrirez tous les objets se trouvant à l'étage actuel.
actors.blobs.waterofawareness.name=l'eau de la conscience
actors.blobs.waterofawareness.procced=En buvant une gorgée, vous sentez la connaissance se répandre dans votre esprit.
actors.blobs.waterofhealth.desc=Le pouvoir de la santé rayonne de l'eau de ce puits. Boire de l'eau de ce puits guérira vos blessures, satisfera votre faim et nettoiera les malédictions sur les objets usés.
actors.blobs.waterofhealth.name=l'eau de santé
actors.blobs.waterofhealth.procced=En buvant une gorgée, vous sentez vos blessures se cicatriser complètement.
actors.blobs.web.desc=Une toile épaisse recouvre tout ici. Tout ce qui touche ou est projeté à travers la toile la brisera, mais sera également bloqué sur place.
actors.blobs.web.name=toile d'araignée
actors.buffs.adrenaline.desc=L'adrénaline est une poussée de puissance physique qui augmente la vitesse d'attaque et de déplacement.\n\nL'adrénaline permet à la cible de courir deux fois plus vite et d'attaquer 1,5 fois plus vite.\n\nTours restants : %s.
actors.buffs.adrenaline.name=adrénaline
actors.buffs.adrenalinesurge.desc=Un élan d'une grande puissance, mais malheureusement non permanent.\n\nAugmentation de la force : +%d.\nNombre de tours jusqu'à ce que l'augmentation s'affaiblisse : %s.
actors.buffs.adrenalinesurge.name=renforcement de la force
actors.buffs.amok.desc=Amok provoque un état de grande rage et de confusion chez sa cible.\n\nLorsqu'une créature est en état d'amok, elle attaque tout ce qui se trouve à proximité d'elle, qu'il s'agisse d'un ami ou d'un ennemi.\n\nTours d'amok restants : %s.
actors.buffs.amok.name=amok
actors.buffs.arcanearmor.desc=Un mince bouclier vous entoure, bloquant une partie des dégâts des attaques magiques.\n\nVotre armure magique est actuellement renforcée par : 0-%d.\n\nTours jusqu'à ce que l'armure arcanique s'affaiblisse : %s.
actors.buffs.arcanearmor.name=armure d'arcane
actors.buffs.artifactrecharge.desc=L'énergie qui vous traverse augmente la vitesse de chargement des artefacts que vous avez équipés.\n\nChaque artefact est affecté différemment, mais ils se chargeront tous beaucoup plus rapidement que la normale.\n\nTours restants : %s.
actors.buffs.artifactrecharge.name=recharge d'artefacts
actors.buffs.ascensionchallenge.almost=Vous sentez que l'emprise de Yog sur l'amulette commence à s'affaiblir, vous y êtes presque !
actors.buffs.ascensionchallenge.beckon=L'amulette commence à appeler des ennemis lointains.
actors.buffs.ascensionchallenge.break=Vous prenez un moment pour reprendre votre souffle et vous sentez que vos blessures commencent à se refermer !
actors.buffs.ascensionchallenge.damage=L'amulette commence à émettre de l'énergie noire. Elle brûle !
actors.buffs.ascensionchallenge.desc=D'une manière ou d'une autre, Yog-Dzewa maintient son influence sur ce monde par l'intermédiaire de l'amulette et essaie d'empêcher ton ascension !\n\nLe pouvoir de Yog rend le donjon beaucoup plus dangereux, augmentant le nombre d'ennemis et les rendant plus forts ! Ce pouvoir continuera à se développer s'il n'est pas contrôlé, mais il peut être affaibli en battant les ennemis qui ont été renforcés par le pouvoir de Yog.
actors.buffs.ascensionchallenge.desc_beckon=L'amulette est en train d'appeler des ennemis lointains pour les alerter de votre position.
actors.buffs.ascensionchallenge.desc_clear=L'énergie noire qui émane de l'amulette a été affaiblie autant que possible pour l'instant.
actors.buffs.ascensionchallenge.desc_damage=L'énergie de l'amulette est devenue si forte qu'elle vous _nuis directement !_
actors.buffs.ascensionchallenge.desc_haste=L'amulette est actuellement en train de _hésiter les ennemis lointains_, ce qui leur permet de vous atteindre plus rapidement !
actors.buffs.ascensionchallenge.desc_slow=L'amulette vous _ralentit_ et annule les effets d'augmentation de la vitesse !
actors.buffs.ascensionchallenge.haste=L'amulette commence à hâter les ennemis lointains !
actors.buffs.ascensionchallenge.name=malédiction de l'amulette
actors.buffs.ascensionchallenge.on_kill=L'énergie noire vous consume...
actors.buffs.ascensionchallenge.slow=L'amulette commence à ressembler à un poids de plomb dans votre inventaire !
actors.buffs.ascensionchallenge.weaken=Vous sentez que la malédiction de l'amulette s'affaiblit légèrement.
actors.buffs.ascensionchallenge.weaken_info=La malédiction de l'amulette peut être affaiblie en battant plus d'ennemis.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Si vous battez des ennemis, la malédiction de l'amulette s'affaiblira !
actors.buffs.barkskin.desc=Votre peau est durcie, elle est rugueuse et solide comme de l'écorce.\n\nLa peau durcie augmente l'efficacité de votre armure, ce qui vous permet de mieux vous défendre contre les attaques physiques.\n\nVotre armure est actuellement augmentée de : 0-%d.\nTours jusqu'à ce que la peau de barque s'affaiblisse : %s.\n\nSi vous recevez de la peau d'écorce de plusieurs sources, seule la plus forte s'appliquera.
actors.buffs.barkskin.name=peau d'écorce
actors.buffs.barrier.desc=Une bulle de force durable qui bloque tous les dégâts.\n\nLa barrière subit les dégâts de ce qu'elle protège tant qu'il reste du bouclier. Le bouclier se dégrade lentement avec le temps.\n\nBouclier restant : %d.
actors.buffs.barrier.name=barrière
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=en colère
actors.buffs.berserk.angered_desc=La gravité des blessures du Berserker renforce ses coups. Au fur et à mesure que le berserker subit des dégâts physiques, sa rage augmente, ce qui lui confère un bonus de dégâts. Les dégâts bloqués par une armure comptent toujours dans le calcul de la rage.\n\nLa rage s'estompe avec le temps. Plus la santé du berserker est faible, plus la rage durera longtemps.\n\nÀ 100%% de rage, le berserker peut devenir berserk, ce qui lui confère un bouclier basé sur le niveau de son armure et sa santé manquante. Pendant qu'il est berserker, son bouclier se dégrade avec le temps et, une fois qu'il est épuisé, il doit se reposer avant d'accumuler à nouveau de la rage.\n\nRage actuelle : _%1$.0f%%_\n+%2$.0f%%_ de dégâts\n\nBouclier berserk à l'armure et aux PV actuels : _%3$d_
actors.buffs.berserk.berserk=berserking
actors.buffs.berserk.berserk_desc=La peur et l'incertitude disparaissent pour ne laisser place qu'à la colère. Dans cet état, le Berserker est extrêmement puissant, _il inflige +50%% de dégâts et gagne un bonus de bouclier_, mais il perd aussi du bouclier à chaque tour.\n\nLorsque son bouclier est réduit à 0, le berserker prend fin.\n\nAprès la rage, le berserker doit récupérer avant de pouvoir à nouveau faire monter la rage.\n\nBouclier restant : %d
actors.buffs.berserk.exhausted=épuisé
actors.buffs.berserk.no_seal=Vous avez besoin de votre sceau brisé pour berserk !
actors.buffs.berserk.rankings_desc=Berserked to Death
actors.buffs.berserk.recovering=récupération
actors.buffs.berserk.recovering_desc=La force intérieure a ses limites. Le Berserker doit se reposer avant d'utiliser à nouveau sa rage.\n\nPendant qu'il récupère, le Berserker n'accumule pas de rage en subissant des dégâts.
actors.buffs.berserk.recovering_desc_levels=Niveaux jusqu'à récupération : _%.2f_
actors.buffs.berserk.recovering_desc_turns=Tourne jusqu'à récupération : _%d_
actors.buffs.bleeding.desc=Cette blessure laisse échapper une quantité inquiétante de sang.\n\nLes saignements causent des dégâts à chaque tour. Chaque tour, les dégâts diminuent d'une quantité aléatoire, jusqu'à ce que l'hémorragie s'arrête.\n\nDégâts actuels de l'hémorragie : %d.
actors.buffs.bleeding.heromsg=Vous saignez !
actors.buffs.bleeding.name=hémorragie
actors.buffs.bleeding.ondeath=Vous avez saigné à mort...
actors.buffs.bleeding.rankings_desc=Saignée à mort
actors.buffs.bless.desc=Un grand coup de projecteur, dont certains disent qu'il est inspiré par les dieux.\n\nLa bénédiction augmente la précision et l'évasion de 25%%, ce qui rend le bienheureux beaucoup plus efficace au combat.\n\nNombre de tours de bénédiction restants : %s.
actors.buffs.bless.name=béni
actors.buffs.blindness.desc=L'aveuglement transforme le monde environnant en une brume sombre.\n\nLorsque le personnage est aveuglé, sa portée visuelle est réduite à un carreau, ce qui rend les attaques à distance inutiles et permet de perdre facilement la trace d'ennemis éloignés. De plus, un héros aveuglé est incapable de lire des parchemins ou des livres.\n\nTours de cécité restants : %s.
actors.buffs.blindness.heromsg=Vous êtes aveuglé !
actors.buffs.blindness.name=aveuglé
actors.buffs.blobimmunity.desc=Une force étrange vous enferme dans une fine barrière protectrice, bloquant tous les effets nocifs de l'air.\n\nVous êtes immunisé contre tous les effets liés à la zone tant que cette barrière dure.\n\nTours d'immunité restants : %s.
actors.buffs.blobimmunity.name=barrière de purification
actors.buffs.burning.burnsup=%s brûle !
actors.buffs.burning.desc=Peu de choses sont plus pénibles que d'être englouti par les flammes.\n\nLe feu inflige des dégâts à chaque tour jusqu'à ce qu'il soit éteint par de l'eau ou qu'il expire. Le feu peut être éteint en marchant dans l'eau ou par l'éclaboussure d'une potion qui se brise.\n\nDe plus, le feu peut enflammer les terrains ou les objets inflammables avec lesquels il entre en contact.\n\nNombre de tours de combustion restants : %s.
actors.buffs.burning.heromsg=Vous prenez feu !
actors.buffs.burning.name=brûlant
actors.buffs.burning.ondeath=Vous avez brûlé à mort...
actors.buffs.burning.rankings_desc=Brûlé jusqu'aux cendres
actors.buffs.championenemy$antimagic.desc=Les champions antimagiques subissent 50 % de dégâts en moins et sont totalement immunisés contre les effets magiques.
actors.buffs.championenemy$antimagic.name=champion antimagique
actors.buffs.championenemy$blazing.desc=Les champions flamboyants infligent 25 % de dégâts de mêlée supplémentaires, enflamment les ennemis qu'ils attaquent, sont immunisés contre le feu et répandent le feu autour d'eux lorsqu'ils meurent. Ils ne peuvent cependant pas répandre le feu sur l'eau.
actors.buffs.championenemy$blazing.name=champion flamboyant
actors.buffs.championenemy$blessed.desc=Les champions bénis ont une précision et une évasion de 4x.
actors.buffs.championenemy$blessed.name=champion béni
actors.buffs.championenemy$giant.desc=Les champions géants subissent 80 % de dégâts en moins et ont une portée d'attaque de +1, mais ne peuvent pas se déplacer dans les espaces clos.
actors.buffs.championenemy$giant.name=champion géant
actors.buffs.championenemy$growing.desc=Les champions en pleine croissance bénéficient d'un bonus croissant à la précision, à l'évasion et aux dégâts physiques, ainsi que d'une réduction des dégâts subis.\n\nAugmentation actuelle de la précision, de l'évasion et des dégâts physiques : %1$d%%\nRéduction actuelle des dégâts : %2$d%%
actors.buffs.championenemy$growing.name=un champion en pleine croissance
actors.buffs.championenemy$projecting.desc=Les champions projetés infligent 25 % de dégâts de mêlée supplémentaires et ont une portée d'attaque de +3.
actors.buffs.championenemy$projecting.name=projeter un champion
actors.buffs.championenemy.warn=Vous sentez une présence mortelle.
actors.buffs.charm.cant_attack=Vous êtes charmé par cet ennemi et ne pouvez pas l'attaquer.
actors.buffs.charm.desc=Un charme est une magie manipulatrice qui permet à des ennemis de s'adorer temporairement.\n\nLes personnages affectés par un charme ne peuvent pas attaquer directement l'ennemi qui les a charmés. Il leur est cependant possible d'attaquer d'autres cibles. Le choc de la douleur atténue la durée du charme.\n\nNombre de tours de charme restants : %s.
actors.buffs.charm.heromsg=Vous êtes sous le charme !
actors.buffs.charm.name=charmé
actors.buffs.chill.desc=Pas tout à fait gelé, mais encore beaucoup trop froid.\n\nLes cibles frigorifiées effectuent toutes leurs actions plus lentement, en fonction du nombre de tours restants dans l'effet. Dans le pire des cas, cela équivaut à être ralenti.\n\nTours de froid restants : %1$s.\nLa vitesse est réduite de : %2$s%%
actors.buffs.chill.freezes=%s se bloque !
actors.buffs.chill.name=réfrigéré
actors.buffs.combo$combomove.clobber.desc=Fait reculer un ennemi de 2 tuiles, mais n'inflige aucun dégât et ne peut pas le faire tomber dans les fosses. Augmente le combo de 1.
actors.buffs.combo$combomove.clobber.empower_desc=Fait reculer l'ennemi de _3 tuiles, lui donne le vertige et peut le faire tomber dans des fosses, mais ne lui inflige aucun dégât. Augmente le combo de 1.
actors.buffs.combo$combomove.clobber.name=gibier
actors.buffs.combo$combomove.crush.desc=Inflige %d%% (combo*25%%) à la cible principale, et la moitié de ces dégâts à tous les autres ennemis dans une AOE de 7x7. Réinitialise le combo lorsqu'il est utilisé.
actors.buffs.combo$combomove.crush.empower_desc=saute jusqu'à %1$d tuile(s)_ et inflige %2$d%% (combo*25%%) de dégâts à la cible principale, et la moitié de ces dégâts à tous les autres ennemis dans une AOE de 7x7. Réinitialise le combo lorsqu'il est utilisé.
actors.buffs.combo$combomove.crush.name=béguin
actors.buffs.combo$combomove.fury.desc=Frappe un ennemi une fois pour chaque combo que vous avez, chaque coup inflige 60% de dégâts et peut déclencher des enchantements. Réinitialise le combo lorsqu'il est utilisé.
actors.buffs.combo$combomove.fury.empower_desc=saute jusqu'à %d tuile(s)_ et frappe un ennemi une fois pour chaque combo que vous avez, chaque coup inflige 60%% de dégâts et peut déclencher des enchantements. Réinitialise le combo lorsqu'il est utilisé.
actors.buffs.combo$combomove.fury.name=fureur
actors.buffs.combo$combomove.parry.desc=Bloque la prochaine attaque dans un délai d'un tour lorsqu'elle est activée, et riposte instantanément. Réinitialise le combo si rien n'est paré.
actors.buffs.combo$combomove.parry.empower_desc=Bloque _toutes les attaques_ dans un délai de 1 tour lorsqu'il est activé, et riposte instantanément. Réinitialise le combo si rien n'est paré.
actors.buffs.combo$combomove.parry.name=parer
actors.buffs.combo$combomove.slam.desc=Inflige %d%% (combo*20%%) de votre puissance de blocage sous forme de dégâts bonus. Réinitialise le combo lorsqu'il est utilisé.
actors.buffs.combo$combomove.slam.empower_desc=saute jusqu'à %1$d tuile(s)_ et inflige %2$d%% (combo*20%%) de votre puissance de blocage des dégâts en tant que dégâts bonus. Réinitialise le combo lorsqu'il est utilisé.
actors.buffs.combo$combomove.slam.name=slam
actors.buffs.combo.action_name=attaque combinée
actors.buffs.combo.bad_target=Vous devez cibler un ennemi à portée d'attaque.
actors.buffs.combo.combo=%d combo réussi !
actors.buffs.combo.desc=Le gladiateur prend de l'élan au fur et à mesure qu'il réussit ses coups. Chaque attaque augmente le compteur de combo d'une unité, mais si l'intervalle entre les coups est trop long, le compteur de combo revient à 0. Tant que le gladiateur a un combo, le bouclier qu'il possède grâce à son sceau brisé ne commence pas à s'affaiblir.\n\nL'accumulation de combo débloque des attaques combo spéciales qui ne peuvent pas rater ! Une attaque différente est débloquée à 2, 4, 6, 8 et 10 combos. Certains mouvements réinitialisent le combo et d'autres non, mais chaque mouvement ne peut être utilisé qu'une seule fois par session de combo.\n\nCombinaison actuelle : %1$d.\n\nNombre de tours jusqu'à ce que le combo soit perdu : %2$s.
actors.buffs.combo.name=combo
actors.buffs.combo.prompt=Sélectionnez une cible à attaquer.
actors.buffs.corrosion.desc=Un acide puissant fait fondre la chair, le métal et les os à une vitesse alarmante.\n\nLes dégâts de corrosion augmentent avec le temps, tandis que la cible continue de fondre.\n\nTours de corrosion restants : %1$s.\nDégâts de corrosion actuels : %2$d.
actors.buffs.corrosion.heromsg=Vous êtes en train de fondre !
actors.buffs.corrosion.name=corrosion
actors.buffs.corrosion.ondeath=Vous disparaissez...
actors.buffs.corrosion.rankings_desc=Dissous
actors.buffs.corruption.desc=La corruption s'infiltre dans l'essence d'un être, le détournant de sa nature première.\n\nLes créatures corrompues attaquent leurs alliés et ignorent leurs anciens ennemis. La corruption est également préjudiciable et fait lentement succomber sa cible.\n\nLa corruption est permanente, ses effets ne s'arrêtent qu'à la mort.
actors.buffs.corruption.name=corrompu
actors.buffs.cripple.desc=Vous êtes presque sûr que les jambes ne sont pas faites pour se plier de cette façon.\n\nL'estropié réduit de moitié la vitesse de déplacement, ce qui fait que se déplacer d'une tuile prend généralement deux tours au lieu d'un.\n\nTours de paralysie restants : %s.
actors.buffs.cripple.heromsg=Vous êtes paralysé !
actors.buffs.cripple.name=infirme
actors.buffs.daze.desc=Les bourdonnements d'oreille et les troubles de la vision rendent la lutte difficile.\n\nLorsqu'il est hébété, sa précision et sa capacité d'évitement sont réduites de 50%%, ce qui rend la réception et l'évitement des coups beaucoup plus difficiles.\n\nNombre de tours d'étourdissement restants : %s.
actors.buffs.daze.heromsg=Vous êtes étourdi !
actors.buffs.daze.name=hébété
actors.buffs.degrade.desc=Une puissante magie noire sape la force que les parchemins d'amélioration ont appliquée à votre équipement !\n\nPendant qu'il est dégradé, l'équipement amélioré est traité comme s'il était d'un niveau inférieur à ce qu'il est en réalité. chaque amélioration après +3 devient exponentiellement plus faible que la précédente. Les descriptions de vos objets seront modifiées pour refléter leur niveau de puissance réduit.\n\nLa dégradation n'affecte pas les exigences de force, les charges de baguette, la durabilité des armes de jet ou les artefacts.\n\nTours de dégradation restants : %s. L'utilisation d'un parchemin d'amélioration ou de levée de malédiction met immédiatement fin à la dégradation.
actors.buffs.degrade.heromsg=Votre équipement semble plus faible !
actors.buffs.degrade.name=dégradé
actors.buffs.doom.desc=Il est difficile de continuer quand on a l'impression que l'univers veut notre mort.\n\nLes personnages condamnés reçoivent +67% de dégâts de toutes sources.\n\nLa condamnation est permanente, ses effets ne s'arrêtent qu'avec la mort.
actors.buffs.doom.name=condamné
actors.buffs.dread.desc=Une terreur si grande qu'elle poussera sa cible à fuir le donjon !\n\nLes créatures affectées par la terreur fuient leur adversaire à grande vitesse et disparaissent du donjon une fois qu'elles sont hors de vue. Les ennemis vaincus de cette façon gagnent la moitié de l'expérience et ne laissent pas d'objets. Le choc de la douleur réduit la durée de l'effroi.\n\nNombre de tours d'effroi restants : %d.
actors.buffs.dread.name=redoute
actors.buffs.drowsy.desc=Une force magique rend difficile le fait de rester éveillé. Après quelques tours, la cible tombera dans un profond sommeil magique.\n\nLe héros peut résister à la somnolence en subissant des dégâts ou en étant à pleine santé.\n\nNombre de tours jusqu'à l'endormissement : %s.
actors.buffs.drowsy.name=somnolent
actors.buffs.earthimbue.desc=Vous êtes imprégné du pouvoir de la terre !\n\nToutes les attaques physiques déplacent la terre sous l'ennemi, le paralysant pour une courte durée.\n\nLes tours d'imprégnation de la terre restent : %s.
actors.buffs.earthimbue.name=imprégné de terre
actors.buffs.enhancedrings.desc=L'artefact récemment utilisé par le Rogue donne du pouvoir à ses anneaux, leur accordant +1 niveau.\n\nTours restants : %s.
actors.buffs.enhancedrings.name=bagues renforcées
actors.buffs.fireimbue.desc=Vous êtes imprégné du pouvoir du feu !\n\nToutes les attaques physiques ont une chance d'enflammer les ennemis. De plus, vous êtes totalement immunisé contre les effets du feu.\n\nTours d'imprégnation du feu restants : %s.
actors.buffs.fireimbue.name=imprégné de feu
actors.buffs.foresight.desc=Vous êtes en quelque sorte capable de voir la configuration du terrain environnant avec votre esprit.\n\nLorsque vous êtes sous l'effet de la prévoyance, toutes les tuiles dans un large rayon vous sont révélées, y compris les pièges et les portes secrètes.\n\nTours de clairvoyance restants : %s.
actors.buffs.foresight.name=prévoyance
actors.buffs.frost.desc=À ne pas confondre avec la congélation solide, cette congélation plus bénigne enferme simplement la cible dans de la glace.\n\nLe gel agit de la même manière que la paralysie, rendant impossible toute action de la part de la cible. Contrairement à la paralysie, le gel est immédiatement annulé si la cible subit des dégâts, car la glace se brise.\n\nNombre de tours de gel restants : %s.
actors.buffs.frost.freezes=%s se bloque !
actors.buffs.frost.name=gelé
actors.buffs.frostimbue.desc=Vous êtes imprégné d'un pouvoir glacial !\n\nToutes les attaques physiques accumulent régulièrement le froid sur les ennemis. De plus, vous êtes complètement immunisé contre le froid.\n\nTours d'imprégnation de givre restants : %s.
actors.buffs.frostimbue.name=imprégné de givre
actors.buffs.fury.desc=Vous êtes en colère, les ennemis ne vous aiment pas quand vous êtes en colère.\n\nUne grande rage brûle en vous, augmentant de 50%% les dégâts que vous infligez avec les attaques physiques.\n\nCette rage durera tant que vous serez blessé à moins de 50%% de santé.
actors.buffs.fury.heromsg=Vous devenez furieux !
actors.buffs.fury.name=furieux
actors.buffs.gravitychaostracker.desc_duration=On ne sait pas exactement combien de temps l'effet durera, mais il ne peut pas durer éternellement.
actors.buffs.gravitychaostracker.desc_intro=Tous les quelques tours, tous les personnages se trouvant à l'étage du donjon sont projetés dans une direction aléatoire.
actors.buffs.gravitychaostracker.desc_positive=Vous et vos alliés semblez être immunisés.
actors.buffs.gravitychaostracker.name=chaos gravitationnel
actors.buffs.greaterhaste.desc=Une incroyable accélération de la vitesse, qui donne l'impression que tout le reste est à l'arrêt.\n\nSous l'effet de la hâte, les actions de déplacement ne prennent pas de temps, mais les autres actions sont effectuées à la vitesse normale. Chaque pas de mouvement consomme un tour de hâte.\n\nTours de hâte restants : %d.
actors.buffs.greaterhaste.name=une plus grande rapidité
actors.buffs.haste.desc=L'énergie circule dans les muscles, ce qui permet de courir à des vitesses incroyables !\n\nLorsque vous êtes sous l'effet de la hâte, vous courez à une vitesse trois fois supérieure, mais vous effectuez toutes vos autres actions à une vitesse normale.\n\nTours de hâte restants : %s.
actors.buffs.haste.name=hâte
actors.buffs.healing.desc=Un remède magique permet aux blessures de se refermer et à la chair de se ressouder.\n\nÀ chaque tour, la santé se régénère régulièrement jusqu'à ce que l'effet de guérison prenne fin. La quantité de soins peut s'estomper avec le temps.\n\nProchaine guérison : %d.\n\nSoins restants : %d.
actors.buffs.healing.name=guérison
actors.buffs.herodisguise.desc=La magie illusoire a modifié votre apparence physique ! L'effet est purement cosmétique, mais il est tout de même très étrange.\n\nTours de déguisement restants : %s.
actors.buffs.herodisguise.name=déguiser
actors.buffs.hex.desc=Magie obscure qui réduit la concentration et rend la cible légèrement désorientée.\n\nL'Hexing réduit la précision et l'évasion de 20%%, rendant la cible moins efficace au combat.\n\nTours d'hexagone restants : %s.
actors.buffs.hex.heromsg=Vous avez été maudit !
actors.buffs.hex.name=hexagonal
actors.buffs.holdfast.desc=Le guerrier maintient sa position, augmentant son armure de %1$d-%2$d et ralentissant le taux de dégradation de certains buffs de %3$d%%. Cela durera jusqu'à ce qu'il se déplace.
actors.buffs.holdfast.name=tenir bon
actors.buffs.hunger.cursedhorn=La corne maudite vole une partie de l'énergie de la nourriture lorsque vous mangez.
actors.buffs.hunger.desc=La faim augmente lentement au fur et à mesure que vous passez du temps dans le donjon, et vous finirez par mourir de faim. Lorsque vous êtes affamé, vous perdez lentement de la santé au lieu de la régénérer.\n\nLe rationnement est important ! Si vous avez de la santé à revendre, mourir de faim n'est pas une mauvaise idée si cela signifie qu'il y aura plus de nourriture plus tard. Un rationnement efficace permet de prolonger la durée de vie de la nourriture !
actors.buffs.hunger.desc_intro_hungry=Vous sentez votre estomac réclamer de la nourriture, mais ce n'est pas encore trop urgent.
actors.buffs.hunger.desc_intro_starving=Tu as tellement faim que tu as mal.
actors.buffs.hunger.hungry=affamés
actors.buffs.hunger.ondeath=Vous êtes mort de faim...
actors.buffs.hunger.onhungry=Vous avez faim.
actors.buffs.hunger.onstarving=Vous êtes affamés !
actors.buffs.hunger.rankings_desc=Mort de faim
actors.buffs.hunger.starving=affamé
actors.buffs.invisibility.desc=Vous vous fondez complètement dans le terrain environnant, ce qui vous rend impossible à voir.\n\nTant que vous êtes invisible, vos ennemis ne peuvent ni vous attaquer ni vous suivre. Les attaques physiques et les effets magiques (tels que les parchemins et les baguettes) annulent immédiatement l'invisibilité.\n\nTours d'invisibilité restants : %s.
actors.buffs.invisibility.name=invisible
actors.buffs.invulnerability.desc=Ce personnage est doté d'un grand pouvoir protecteur qui lui confère une brève période d'invulnérabilité !\n\nTours restants : %s.
actors.buffs.invulnerability.name=invulnérable
actors.buffs.levitation.desc=Une force magique vous fait léviter au-dessus du sol, vous donnant l'impression d'être en apesanteur.\n\nLes personnages en lévitation se déplacent en silence et ignorent tous les effets liés au sol. Les pièges ne se déclenchent pas, l'eau n'éteint pas le feu, les plantes ne sont pas piétinées, les racines manquent et les fosses sont survolées. Attention, tous ces effets peuvent se déclencher à la seconde où la lévitation prend fin !\n\nTours de lévitation restants : %s.
actors.buffs.levitation.name=en lévitation
actors.buffs.lifelink.desc=La force vitale de ce personnage est liée à celle d'un autre personnage situé à proximité. Les dégâts subis sont partagés entre eux.\n\nLorsque ce personnage subit des dégâts, la moitié de ceux-ci sont infligés à la cible du lien de vie.\n\nTours de lien de vie restants : %s.
actors.buffs.lifelink.name=lien de vie
actors.buffs.lifelink.ondeath=Les dommages liés à la vie vous ont tué...
actors.buffs.light.desc=Même dans le donjon le plus sombre, une lumière constante à vos côtés est toujours réconfortante.\n\nLa lumière aide à tenir l'obscurité à distance, vous permettant de voir à une distance raisonnable malgré l'environnement.\n\nTours d'éclairage restants : %s.
actors.buffs.light.name=éclairé
actors.buffs.lockedfloor.desc=L'étage actuel est verrouillé et vous ne pouvez pas le quitter !\n\nTant qu'un étage est verrouillé, vous n'aurez pas faim et vous ne subirez pas de dégâts si vous êtes affamé. De plus, si vous n'essayez pas de vaincre le boss de cet étage, les effets de régénération passive s'arrêteront également.\n\nDe plus, si vous êtes ranimé par un ankh non béni alors que l'étage est verrouillé, il sera réinitialisé.\n\nTuez le boss de cet étage pour briser le verrou.
actors.buffs.lockedfloor.name=l'étage est verrouillé
actors.buffs.lostinventory.desc=Votre inventaire a été perdu quelque part dans le donjon ! Vous ne pourrez pas ramasser ou utiliser la plupart des objets tant que vous ne l'aurez pas récupéré.
actors.buffs.lostinventory.name=inventaire perdu
actors.buffs.magicalsight.desc=D'une certaine manière, vous êtes capable de voir avec votre esprit plutôt qu'avec vos yeux.\n\nTant que la vision magique est active, vous pouvez voir à travers tous les terrains dans un rayon de 12 tuiles.\n\nTours de vision magique restants : %s.
actors.buffs.magicalsight.name=vision magique
actors.buffs.magicalsleep.desc=Ce personnage est tombé dans un profond sommeil magique dont il ne se réveillera pas naturellement.\n\nLe sommeil magique est similaire au sommeil normal, sauf que seuls les dégâts peuvent réveiller la cible.\n\nPour le héros et ses alliés, le sommeil magique a des propriétés réparatrices, leur permettant de guérir rapidement pendant qu'ils se reposent.
actors.buffs.magicalsleep.fallasleep=Vous tombez dans un profond sommeil magique.
actors.buffs.magicalsleep.name=sommeil magique
actors.buffs.magicalsleep.toohealthy=Vous êtes en trop bonne santé et résistez à l'envie de dormir.
actors.buffs.magicalsleep.wakeup=Vous vous réveillez avec une sensation de fraîcheur et de santé.
actors.buffs.magicimmune.desc=Tous les effets magiques ont perdu leur emprise sur vous, vous y êtes totalement insensible.\n\nLorsque vous êtes immunisé contre la magie, tous les effets magiques utiles ou nuisibles ne s'appliquent pas à vous, y compris les malédictions, les enchantements, les baguettes, les parchemins, les anneaux, les artefacts, etc. Les capacités des armures héroïques sont suffisamment puissantes pour fonctionner sans tenir compte de cet effet.\n\nTours d'immunité magique restants : %s.
actors.buffs.magicimmune.name=immunisé contre la magie
actors.buffs.mindvision.desc=D'une manière ou d'une autre, vous êtes capable de voir toutes les créatures de cet étage à travers votre esprit. C'est une sensation étrange.\n\nTous les personnages de cet étage sont visibles pour vous tant que vous avez la vision mentale. Le fait de voir une créature par le biais de la vision mentale compte comme le fait de la voir ou d'être à proximité pour les besoins de nombreux effets magiques.\n\nTours de vision mentale restants : %s.
actors.buffs.mindvision.name=vision de l'esprit
actors.buffs.momentum.action_name=course libre
actors.buffs.momentum.momentum=créer un élan
actors.buffs.momentum.momentum_desc=Au fur et à mesure qu'il se déplace, le coureur libre prend de l'élan, qu'il peut dépenser pour entrer en course libre.\n\nChaque charge d'élan accorde deux tours de course libre, et le coureur libre peut accumuler jusqu'à 10 charges. L'élan est rapidement perdu lorsque le coureur libre s'arrête de bouger.\n\nCharge d'élan actuelle : %d.
actors.buffs.momentum.resting=récupération
actors.buffs.momentum.resting_desc=Au fur et à mesure qu'il se déplace, le coureur libre prend de l'élan, qu'il peut dépenser pour entrer en course libre.\n\nLe coureur libre a besoin de temps pour retrouver son endurance avant de reprendre son élan.\n\nTours restants : %d.
actors.buffs.momentum.running=course libre
actors.buffs.momentum.running_desc=Au fur et à mesure qu'il se déplace, le coureur libre prend de l'élan, qu'il peut dépenser pour entrer en course libre.\n\nEn course libre, le coureur libre se déplace deux fois plus vite et bénéficie d'un bonus d'évasion en fonction de son niveau.\n\nTours restants : %d.
actors.buffs.monkenergy$monkability$dash.desc=Une course instantanée jusqu'à 4 tuiles de distance. Cette capacité permet de franchir les obstacles, mais pas les ennemis ni les terrains solides.
actors.buffs.monkenergy$monkability$dash.empower_desc=Une course instantanée jusqu'à _8 tuiles_ de distance. Cette capacité peut franchir les obstacles, mais pas les ennemis ni les terrains solides.
actors.buffs.monkenergy$monkability$dash.name=tiret
actors.buffs.monkenergy$monkability$dash.prompt=Choisir un lieu
actors.buffs.monkenergy$monkability$dragonkick.desc=Un coup de pied dévastateur qui inflige %1$d-%2$d et ignore les armures. Le coup de pied projette la cible au loin et la paralyse pour chaque carreau parcouru.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Un coup de pied dévastateur qui inflige _%1$d-%2$d_ et ignore les armures. Le coup de pied projette _toutes les cibles adjacentes_ au loin et les paralyse pour chaque carreau parcouru.
actors.buffs.monkenergy$monkability$dragonkick.name=coup de pied du dragon
actors.buffs.monkenergy$monkability$flurry.desc=Deux coups instantanés qui infligent %1$d-%2$d et ignorent l'armure. Cette capacité ne peut pas être utilisée de façon répétée.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Deux coups instantanés qui infligent des dégâts de %1$d-%2$d, ignorent l'armure et utilisent l'enchantement de votre arme.
actors.buffs.monkenergy$monkability$flurry.name=rafale de coups
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=Le moine se concentre sur son environnement, anticipant la prochaine attaque qui lui sera portée. Tant qu'il est concentré, il est assuré de parer la prochaine attaque.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=ciblé
actors.buffs.monkenergy$monkability$focus.desc=Le moine prend un tour pour se concentrer, ce qui lui permet de parer la prochaine attaque portée contre elle.
actors.buffs.monkenergy$monkability$focus.empower_desc=Le moine se concentre instantanément, ce qui lui permet de parer la prochaine attaque portée contre lui.
actors.buffs.monkenergy$monkability$focus.name=se focaliser
actors.buffs.monkenergy$monkability$meditate.desc=Le moine concentre l'énergie dans son corps pendant 5 tours. Cela efface la plupart des effets négatifs et lui permet de recharger sa baguette et son artefact pendant 8 tours.
actors.buffs.monkenergy$monkability$meditate.empower_desc=Le moine concentre l'énergie dans son corps pendant 5 tours. Cela efface la plupart des effets négatifs et lui permet de recharger sa baguette et son artefact pendant 8 tours. elle gagne également 80 % de résistance aux dégâts lorsqu'elle médite, et se soigne lentement à hauteur de 20 % de ses PV manquants
actors.buffs.monkenergy$monkability$meditate.name=méditer
actors.buffs.monkenergy.action=Capacités du moine
actors.buffs.monkenergy.desc=En battant ses ennemis, le moine gagne de l'énergie qu'il peut utiliser pour diverses capacités. La plupart des ennemis accordent 1 énergie lorsqu'ils sont vaincus, et le moine ne perd pas d'énergie avec le temps.\n\nÉnergie actuelle : %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Le moine a récemment utilisé une capacité et doit attendre avant d'en utiliser une autre.\n\nTemps de recharge actuel : %d tours.
actors.buffs.monkenergy.name=l'énergie
actors.buffs.ooze.desc=Cet acide collant s'accroche à la chair et la fait fondre lentement.\n\nLe suintement inflige des dégâts réguliers au fil du temps, mais il peut être immédiatement éliminé par l'eau.\n\nNombre de tours de suintement restants : %s.
actors.buffs.ooze.heromsg=Le suintement caustique mange votre chair. Lavez-le !
actors.buffs.ooze.name=suintement caustique
actors.buffs.ooze.ondeath=Vous disparaissez...
actors.buffs.ooze.rankings_desc=Dissous
actors.buffs.paralysis.desc=Souvent, la pire chose à faire est de ne rien faire du tout.\n\nLa paralysie interrompt complètement toutes les actions, obligeant la cible à attendre que l'effet se dissipe. La douleur causée par les dégâts peut amener les personnages à résister à la paralysie, ce qui leur permet d'échapper à l'effet.\n\nTours de paralysie restants : %s.
actors.buffs.paralysis.heromsg=Vous êtes paralysé !
actors.buffs.paralysis.name=paralysé
actors.buffs.paralysis.out=résistance à la paralysie
actors.buffs.physicalempower.desc=Vos coups ont été renforcés, ce qui augmente la quantité de dégâts que vous pouvez infliger à vos ennemis avec des attaques physiques.\n\nDégâts supplémentaires : %1$d.\nPoints de vie restants : %2$d.
actors.buffs.physicalempower.name=physiquement autonomes
actors.buffs.pincushion.desc=Les armes de jet que vous avez utilisées contre ce personnage sont actuellement collées à lui et tomberont au sol une fois qu'il aura été vaincu.\n\nLes objets suivants sont actuellement attachés :
actors.buffs.pincushion.name=pelote à épingles
actors.buffs.poison.desc=Le poison se fraye un chemin dans le corps, altérant lentement son fonctionnement interne.\n\nLe poison inflige des dégâts à chaque tour, proportionnellement au temps qui s'écoule avant qu'il n'expire.\n\nTours de poison restants : %s.
actors.buffs.poison.heromsg=Vous êtes empoisonné !
actors.buffs.poison.name=empoisonné
actors.buffs.poison.ondeath=Vous êtes mort empoisonné...
actors.buffs.poison.rankings_desc=Succombé au poison
actors.buffs.preparation.action_name=grève préparée
actors.buffs.preparation.assassinated=assassiné
actors.buffs.preparation.desc=L'assassin attend patiemment, se préparant à frapper depuis l'ombre.
actors.buffs.preparation.desc_blink=Il est capable de cligner des yeux en direction d'un ennemi avant de le frapper, avec une distance maximale de _%d._
actors.buffs.preparation.desc_dmg=Sa prochaine attaque infligera _%1$d%% dégâts bonus_, et exécutera les ennemis normaux dont l'état de santé est inférieur à _%2$d%%_, ou les boss dont l'état de santé est inférieur à _%3$d%%_.
actors.buffs.preparation.desc_dmg_likely=L'attaque aura également plus de chances d'infliger des dégâts plus importants.
actors.buffs.preparation.desc_invis_next=Tourne pour une attaque plus forte : _%d._
actors.buffs.preparation.desc_invis_time=Les tournures dépensées sont invisibles : _%d._
actors.buffs.preparation.name=préparation
actors.buffs.preparation.no_target=Il n'y a rien à attaquer.
actors.buffs.preparation.out_of_reach=Cet objectif est hors de portée.
actors.buffs.preparation.prompt=Sélectionnez une cible à attaquer !\nDistance maximale de clignotement : %d
actors.buffs.prismaticguard.desc=Vous êtes gardé par une image prismatique qui est actuellement inactive. En cas de présence d'ennemis, l'image prismatique entrera en action et vous protégera !\n\nLorsqu'elle est inactive, l'image prismatique se remet progressivement des dégâts qu'elle a subis.\n\nHP actuels : %d/%d.
actors.buffs.prismaticguard.desc_many=Cette image prismatique bénéficie également du pouvoir de la multitude. Tours restants : %d.
actors.buffs.prismaticguard.name=garde prismatique
actors.buffs.recharging.desc=L'énergie qui vous traverse améliore la vitesse de chargement de vos baguettes et de vos bâtons.\n\nÀ chaque tour, ce buff augmente la charge actuelle d'un quart, en plus de la recharge normale.\n\nNombre de tours de recharge restants : %s.
actors.buffs.recharging.name=recharge
actors.buffs.revealedarea.desc=Une zone du donjon a été temporairement révélée au héros, il la verra où qu'il soit.\n\nTours restants : %s.
actors.buffs.revealedarea.name=zone révélée
actors.buffs.revealedchar.desc=Ce personnage est révélé au héros, il sera visible quel que soit l'endroit où il se trouve.\n\nTours restants : %s.
actors.buffs.revealedchar.name=révélé
actors.buffs.roots.desc=Les racines (magiques ou naturelles) s'agrippent aux pieds, les forçant à s'enfoncer dans le sol.\n\nLes racines bloquent la cible sur place, rendant le mouvement et la plupart des capacités de mouvement impossibles. Les autres actions ne sont pas affectées, y compris les effets de téléportation.\n\nNombre de tours de racine restants : %s.
actors.buffs.roots.heromsg=Vous ne pouvez pas bouger !
actors.buffs.roots.name=enraciné
actors.buffs.scrollempower.desc=L'énergie du parchemin récemment lu par le Mage alimente ses baguettes !\n\nAugmentation de niveau : +%1$d.\nZaps restants : %2$d.
actors.buffs.scrollempower.name=le défilement donne du pouvoir
actors.buffs.shadows.desc=Vous vous fondez dans les ombres qui vous entourent, ce qui vous rend invisible et ralentit votre métabolisme.\n\nTant que vous êtes invisible, vos ennemis ne peuvent ni vous attaquer ni vous suivre. La plupart des attaques physiques et des effets magiques (comme les parchemins et les baguettes) annulent immédiatement l'invisibilité. De plus, lorsque vous êtes mêlé à l'ombre, votre taux de faim est ralenti.\n\nVous resterez invisible jusqu'à ce que vous quittiez les ombres ou qu'un ennemi entre en contact avec vous.
actors.buffs.shadows.name=ombre mélangée
actors.buffs.slow.desc=La magie de ralentissement affecte la vitesse du temps de la cible, pour qui tout va très vite.\n\nUn personnage ralenti effectue toutes ses actions en deux fois plus de temps qu'il n'en faudrait normalement.\n\nTours de ralentissement restants : %s.
actors.buffs.slow.name=ralentie
actors.buffs.snipersmark.action_name_snapshot=instantané
actors.buffs.snipersmark.action_name_sniper=tir de sniper
actors.buffs.snipersmark.action_name_volley=volée
actors.buffs.snipersmark.desc=Le tireur d'élite se concentre sur la cible qu'il a attaquée le plus récemment. Elle peut effectuer une attaque spéciale avec son arc, qui varie en fonction de la façon dont l'arc est amélioré.\n\nUn arc non augmenté tirera un "coup de feu", qui inflige des dégâts réduits mais ne prend pas de temps à tirer.\n\nUn arc augmenté pour la vitesse tirera une _volée_ de trois flèches. Chaque flèche inflige des dégâts réduits, mais peut toujours activer un enchantement. Cette volée prend 1 tour pour être tirée.\n\nCe tir est garanti, inflige des dégâts bonus en fonction de la distance de la cible, et prend 2 tours pour être effectué.\n\nTours restants : %s.
actors.buffs.snipersmark.name=marque de sniper
actors.buffs.soulmark.desc=Le sorcier a puisé dans l'âme de cette créature, ce qui lui permet de la soigner lorsqu'elle subit des dégâts physiques.\n\nTours de marque d'âme restants : %s.
actors.buffs.soulmark.name=âme marquée
actors.buffs.stamina.desc=Vous disposez d'une endurance inépuisable, ce qui vous permet de vous déplacer plus rapidement !\n\nLorsque vous êtes sous l'effet de l'endurance, vous courez à une vitesse de +50%%, mais vous effectuez toutes les autres actions à une vitesse normale.\n\nTours d'endurance restants : %s.
actors.buffs.stamina.name=endurance
actors.buffs.terror.desc=La terreur est une magie manipulatrice qui plonge sa cible dans une panique incontrôlable.\n\nLes personnages terrifiés sont obligés de fuir leur adversaire, en essayant de mettre autant de portes et de murs que possible entre eux. Le choc de la douleur atténue cependant la durée de la terreur.\n\nTours de terreur restants : %s.
actors.buffs.terror.name=terrifié
actors.buffs.toxicimbue.desc=Vous êtes imprégné d'énergie toxique !\n\nLorsque vous vous déplacez, du gaz toxique s'échappe constamment de vous et endommage vos ennemis. Vous êtes immunisé contre les gaz toxiques et le poison pendant la durée de l'effet, ainsi que pendant quelques tours par la suite.\n\nTour d'imprégnation toxique restant : %s.
actors.buffs.toxicimbue.name=imprégné de toxicité
actors.buffs.vertigo.desc=Marcher en ligne droite peut être difficile lorsque le monde entier tourne.\n\nSous l'effet du vertige, les personnages qui tentent de se déplacer prennent une direction aléatoire, au lieu de celle qu'ils voulaient prendre.\n\nTours de vertige restants : %s.
actors.buffs.vertigo.name=vertige
actors.buffs.vulnerable.desc=La magie de vulnérabilité augmente de 33%% tous les dégâts physiques subis par un personnage, après que ces dégâts aient été réduits par l'armure.\n\nTours de vulnérabilité restants : %s.
actors.buffs.vulnerable.heromsg=Vous vous sentez fragile !
actors.buffs.vulnerable.name=vulnérable
actors.buffs.wandempower.desc=Vos baguettes infligeant des dégâts ont été renforcées, augmentant la quantité de dégâts qu'elles infligent pendant quelques coups.\n\nDégâts supplémentaires : %1$d.\nPoints de vie restants : %2$d.
actors.buffs.wandempower.name=baguettes renforcées
actors.buffs.weakness.desc=Tout semble soudain beaucoup plus lourd.\n\nLa magie d'affaiblissement réduit la force physique d'un personnage, ce qui lui permet d'infliger 33%% de dégâts en moins.\n\nTours de faiblesse restants : %s.
actors.buffs.weakness.heromsg=Vous vous sentez affaibli !
actors.buffs.weakness.name=affaibli
actors.buffs.wellfed.desc=Vous vous sentez satisfait et rassasié.\n\nSi vous êtes bien nourri, votre faim n'augmentera pas et vous récupérerez une quantité supplémentaire de santé au fil du temps.\n\nTours restants : %d.
actors.buffs.wellfed.name=bien nourri
actors.char.def_verb=esquivé
actors.char.def_verb_blocked=bloqué
actors.char.def_verb_evaded=esquivé
