actors.mobs.mob.sleeping=%s dort
actors.mobs.mob.wandering=%s erre
actors.hero.abilities.armorability.cost=Coût de la charge : _%d_
actors.hero.abilities.armorability.no_target=Il n'y a rien à cibler ici !
actors.hero.abilities.armorability.prompt=Choisir un lieu à cibler
actors.hero.abilities.armorability.self_target=Vous ne pouvez pas vous cibler vous-même !
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Une énergie rayonnante émane du corps de l'Ecclésiaste. Sous cette forme, l'Ecclésiaste gagne 2 points d'attaque (grâce à l'énergie sacrée qui émane de lui) et 10 points de protection chaque fois qu'il dépense une charge de tome sacré. Il est également capable de lancer les sorts débloqués par les talents de la forme ascendante.\n\nLe bouclier conféré par la forme ascendante et ses sorts ne se dégrade pas normalement, mais s'efface instantanément lorsque la forme ascendante prend fin.\n\nBouclier actuel : %1$d.\nNombre de tours restants : %2$d.
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=forme ascendante
actors.hero.abilities.cleric.ascendedform.desc=L'Ecclésiaste projette de l'énergie sacrée à partir de lui-même, prenant une forme rayonnante étendue pendant 10 tours. Sous cette forme, l'Ecclésiaste peut lancer de nouveaux sorts, gagne 2 points de portée d'attaque, 30 points de protection, et tous les sorts supplémentaires qu'il lance lui confèrent 10 points de protection par charge de tome sacré utilisée.\n\nLe bouclier de la forme ascendante et de ses sorts ne se dégrade pas normalement, mais s'estompe immédiatement à la fin de la forme ascendante. La capacité peut être réutilisée pour rafraîchir la durée de la forme ascensionnée.
actors.hero.abilities.cleric.ascendedform.name=forme ascendante
actors.hero.abilities.cleric.ascendedform.short_desc=Le Clerc prend une _Forme Ascensionnée_, gagnant de nouveaux sorts, une portée d'attaque et un bouclier.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Une copie de l'un des compagnons d'aventure de l'Ecclésiaste, faite de lumière solide. Bien qu'il ait la forme d'un autre héros, il ne possède aucune de ses capacités uniques. Cet allié persistera tant que le Pouvoir de la multitude lui sera appliqué.\n\nCet allié peut être dirigé sans frais en réutilisant la capacité d'armure Puissance de la multitude.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Votre allié passe à l'attaque !
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Votre allié se déplace sur cette position.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Votre allié se déplace pour vous suivre.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Vous pouvez trouver ce personnage avec une capacité d'armure de héros spécifique.
actors.hero.abilities.cleric.powerofmany$lightally.name=allié léger
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Cet allié est doté de la puissance de la multitude, qui lui confère +25%% aux dégâts infligés et -25%% aux dégâts subis. Il partage également sa portée de vision avec l'Ecclésiaste et peut bénéficier de la puissance de nombreux sorts.\n\nLa puissance de plusieurs persiste lorsque des alliés tels que les images prismatiques se cachent, mais sa durée est réduite.\n\nTours restants : %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=le pouvoir de la multitude
actors.hero.abilities.cleric.powerofmany.ally_exists=Vous avez déjà un allié qui a du pouvoir.
actors.hero.abilities.cleric.powerofmany.desc=L'Ecclésiaste canalise le _Pouvoir de la multitude_, qui donne du pouvoir à un allié existant ou en crée un nouveau pendant 100 tours. Cibler un espace vide crée un nouvel allié.\n\nLorsqu'il est doté du pouvoir de la multitude, tout allié inflige +25% de dégâts, subit -25% de dégâts et partage sa vision avec l'Ecclésiaste. Ils gagnent également 25 points de protection lorsque la capacité est utilisée.\n\nL'Ecclésiaste gagne également trois nouveaux sorts qui ne peuvent être lancés qu'avec un allié doté de cette capacité. Le pouvoir de la multitude ne s'arrêtera pas tant que l'un de ces sorts est actif.
actors.hero.abilities.cleric.powerofmany.name=le pouvoir de la multitude
actors.hero.abilities.cleric.powerofmany.no_vision=Vous ne pouvez pas cibler un endroit que vous ne pouvez pas voir.
actors.hero.abilities.cleric.powerofmany.only_allies=Vous ne pouvez donner du pouvoir qu'à vos alliés.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Dirigez votre lumière vers un allié
actors.hero.abilities.cleric.powerofmany.prompt_default=Choisir un allié ou un lieu
actors.hero.abilities.cleric.powerofmany.short_desc=L'Ecclésiaste canalise le _Pouvoir de la multitude_, renforçant un allié existant ou en créant un nouveau.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Affecter à la forme du corps
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Affecter à la forme mentale
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Affecter à la forme d'esprit
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Sélectionnez un effet à imprégner dans Trinity. Des informations supplémentaires seront affichées avant la confirmation.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=forme du corps : %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=forme de l'esprit : %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=forme de l'esprit : %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Sélectionnez la forme de Trinité à utiliser. Les effets de différentes formes peuvent être actifs simultanément.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity applique l'effet d'alchimie à distance de cet artefact, au coût de _%2$s charge._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity applique l'effet passif de régénération de la santé de cet artefact à _+%1$d_ pendant 20 tours, au prix de _%2$s charge._
actors.hero.abilities.cleric.trinity.cost=Le coût de cette capacité varie, mais il est le plus souvent de _%d._
actors.hero.abilities.cleric.trinity.desc=L'Ecclésiaste gagne une _Trinité_ de capacités d'armure, qui peuvent être assignées à divers effets d'objets en utilisant trois nouveaux sorts. Chacun de ces sorts vise à reproduire les effets des différents types d'équipement que l'Ecclésiaste a identifiés au cours de son parcours : forme corporelle (armes et armures), forme mentale (baguettes et armes de jet), et forme spirituelle (anneaux et artefacts).\n\nChaque forme de Trinité peut être imprégnée d'un effet à la fois, et l'Ecclésiaste choisit celui qu'il veut activer lorsqu'il utilise la Trinité. La Trinité ne reproduit pas l'effet d'un objet déjà équipé.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity utilisera l'effet de cet artefact pour invoquer un spectre ami corrompu avec les HP d'un fantôme _+%1$d_, au prix d'une charge _%2$s
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity applique cet effet pendant _%1$d tours_ au prix de _%2$s charges._
actors.hero.abilities.cleric.trinity.etherealchains_use=La Trinité applique l'effet d'enchaînement de cet artefact avec une portée de _+%1$d_, au prix d'une charge de _%2$s
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity applique l'effet de grignotage de cet artefact, au prix de _%2$s charge._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=La Trinité applique l'effet de vol d'ennemis de cet artefact à _+%1$d_, au prix de _%2$s de charge
actors.hero.abilities.cleric.trinity.name=trinité
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity ne peut pas dupliquer un effet que vous avez déjà équipé !
actors.hero.abilities.cleric.trinity.no_imbue=Trinity n'a aucun effet défini pour l'une de ses formes actuelles, utilisez l'un de ses sorts !
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity applique cet effet _puissant_ pendant _%1$d tours_ au prix de _%2$s charges_
actors.hero.abilities.cleric.trinity.ring_use=Trinity applique l'effet de cet anneau à _+%1$d_ pendant 20 tours, au prix d'une charge de _%2$s
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity applique l'effet racine de cet artefact avec une graine nuisible aléatoire, au prix de _%2$s charge._
actors.hero.abilities.cleric.trinity.short_desc=Le clerc gagne une _Trinité_ de capacités, qui émulent les équipements qu'il a vus et qui peuvent être attribuées en utilisant de nouveaux sorts.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity appliquera l'effet d'insertion de cet artefact, au prix d'une charge de _%2$s
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity applique l'effet scry de cet artefact à _+%1$d_, au prix d'une charge de _%2$s
actors.hero.abilities.cleric.trinity.thrown_use=Trinity lancera cette arme à _+%1$d_ au coût de _%2$s charge._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity applique l'effet de gel temporel de cet artefact avec une durée de _%1$d_ tour, au coût de _%2$s charge._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity appliquera l'effet de défilement aléatoire de cet artefact avec une chance _%1$d/10_ d'offrir la version exotique sans coût supplémentaire, au prix d'une charge _%2$s_
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity va zapper cette baguette _multicharge_ à _+%1$d_ au coût de _%2$s charge._
actors.hero.abilities.cleric.trinity.wand_use=Trinity va zapper cette baguette à _+%1$d_ au coût de _%2$s charge._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Ce personnage participe à un duel. Lui et ses alliés ou serviteurs peuvent agir normalement tandis que les autres sont gelés.\n\nLe duel durera un certain temps, jusqu'à la mort d'un des participants ou jusqu'à ce que les participants s'éloignent de plus de 5 tuiles l'un de l'autre.\n\nTours restants : %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=participant au duel
actors.hero.abilities.duelist.challenge.ally_target=Vous ne pouvez défier que des ennemis.
actors.hero.abilities.duelist.challenge.already_dueling=Vous ne pouvez participer qu'à un seul duel à la fois.
actors.hero.abilities.duelist.challenge.desc=La duelliste provoque en duel un ennemi qui se trouve à proximité. Cet ennemi est contraint de la combattre tandis que tous les autres ennemis sont temporairement figés dans le temps.\n\nLa cible doit être atteignable et se trouver à moins de 5 tuiles de la duelliste. Le duel dure jusqu'à ce que 10 tours s'écoulent, que l'ennemi meure ou que la duelliste se trouve à plus de 5 tuiles de l'ennemi.\n\nLes ennemis gelés sont invulnérables. Les alliés du duelliste ne sont pas gelés par cette capacité, mais si un boss est ciblé, ses serviteurs ne seront pas gelés non plus.
actors.hero.abilities.duelist.challenge.distant_target=Cet ennemi est trop éloigné pour être défié.
actors.hero.abilities.duelist.challenge.name=défi
actors.hero.abilities.duelist.challenge.prompt=Choisissez un ennemi à défier
actors.hero.abilities.duelist.challenge.short_desc=Le duelliste _défie_ un ennemi proche en duel, gelant temporairement tous les autres ennemis.
actors.hero.abilities.duelist.challenge.unreachable_target=Vous devez être en mesure d'atteindre votre objectif.
actors.hero.abilities.duelist.elementalstrike.desc=Le duelliste frappe un ennemi ou un lieu, en effectuant une attaque régulière qui est garantie de toucher et de répandre un effet magique qui se déplace jusqu'à 4 tuiles dans un cône de 65 degrés. Cet effet magique varie en fonction de l'enchantement de l'arme principale du duelliste.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Une frappe élémentaire sans enchantement libère une petite rafale de magie, infligeant 6 à 12 points de dégâts à tous les ennemis à portée.
actors.hero.abilities.duelist.elementalstrike.name=frappe élémentaire
actors.hero.abilities.duelist.elementalstrike.short_desc=Le duelliste effectue une _frappe élémentaire_, propageant un effet dans une AOE conique basée sur l'enchantement de son arme.
actors.hero.abilities.duelist.feint.bad_location=Vous ne pouvez pas vous rendre à cet endroit.
actors.hero.abilities.duelist.feint.desc=Le Duelliste simule une attaque en s'élançant vers une tuile adjacente, laissant derrière lui une image momentanée de lui-même. Les ennemis qui attaquaient la duelliste attaqueront son image à la place.\n\nLes ennemis qui attaquent l'image deviennent confus, ce qui annule leur prochaine action et les expose à une attaque surprise.
actors.hero.abilities.duelist.feint.name=feinte
actors.hero.abilities.duelist.feint.prompt=Choisir un lieu pour le dash
actors.hero.abilities.duelist.feint.short_desc=Le Duelliste _Fait des feintes_, simulant une attaque tout en s'élançant vers une tuile adjacente. Les ennemis attaqueront son image rémanente, ce qui les exposera à une contre-attaque.
actors.hero.abilities.duelist.feint.too_far=Cet emplacement n'est pas adjacent au vôtre.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=La Chasseuse est brièvement dotée de pouvoirs qui augmentent sa vitesse de déplacement et sa vitesse d'attaque avec son arc.\n\nTours restants : %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=le pouvoir de la nature
actors.hero.abilities.huntress.naturespower.desc=La chasseresse se dote temporairement, ainsi que son arc, de la puissance de la nature ! Cela dure 8 tours.\n\nPendant cette période, la Chasseuse se déplace deux fois plus vite et attaque 33 % plus vite avec son arc. Les effets bonus de l'arc ne se déclenchent pas si la tireuse d'élite utilise ses attaques spéciales.
actors.hero.abilities.huntress.naturespower.name=le pouvoir de la nature
actors.hero.abilities.huntress.naturespower.short_desc=La chasseresse fait appel au _Pouvoir de la nature_, ce qui augmente sa vitesse de déplacement et la cadence de tir de son arc pendant une courte période.
actors.hero.abilities.huntress.spectralblades.desc=La Chasseuse lance une lame spectrale sur un ennemi, qui agit comme un coup à distance de son arme de mêlée. Tous les effets normaux d'une arme de mêlée sont activés, y compris les enchantements.
actors.hero.abilities.huntress.spectralblades.name=lames spectrales
actors.hero.abilities.huntress.spectralblades.short_desc=La chasseresse lance des _Lames spectrales_ sur une cible, infligeant des dégâts qui dépendent de l'arme de mêlée dont elle est équipée.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Un faucon magique, invoqué par la Chasseuse. Il brille d'un bleu éthéré et sa tête se déplace constamment pour surveiller la zone.\n\nBien qu'il ne soit pas un grand combattant, sa vitesse et sa vision en font un excellent éclaireur et un moyen de distraire les ennemis.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Les esquives garanties restantes : %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Tours restants : %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Votre faucon passe à l'attaque !
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Votre faucon se déplace vers cette position.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Votre faucon se déplace pour vous suivre.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Vous pouvez trouver ce personnage avec une capacité d'armure de héros spécifique.
actors.hero.abilities.huntress.spirithawk$hawkally.name=faucon spirituel
actors.hero.abilities.huntress.spirithawk.desc=La chasseresse invoque un familier esprit faucon, qui peut être dirigé en utilisant à nouveau la capacité pendant qu'il est invoqué. Le faucon dure 100 tours, le diriger ne coûte pas de charge.\n\nL'épervier a une santé et une puissance d'attaque minimes, mais il est rapide, évasif et précis. Il partage l'intégralité de son champ de vision avec la chasseresse à tout moment. Il est immunisé contre tous les effets de zone, tels que le feu et le gaz toxique. Il n'attaque pas à moins qu'on ne lui en donne l'ordre.
actors.hero.abilities.huntress.spirithawk.name=faucon spirituel
actors.hero.abilities.huntress.spirithawk.no_space=Il n'y a pas d'espace libre près de chez vous.
actors.hero.abilities.huntress.spirithawk.short_desc=La chasseresse invoque un familier _Faucon spirituel_, qui peut l'aider à repérer les lieux et à distraire les ennemis.
actors.hero.abilities.mage.elementalblast.desc=Le Mage émet un souffle de magie qui couvre une zone circulaire jusqu'à 4 tuiles de distance et inflige de 15 à 25 points de dégâts. L'effet spécifique du souffle élémentaire varie en fonction de la baguette imprégnée dans le bâton du Mage.
actors.hero.abilities.mage.elementalblast.generic_desc=L'effet de l'explosion élémentaire est similaire à celui de la baguette lorsqu'elle est dirigée vers un ennemi ou un allié.
actors.hero.abilities.mage.elementalblast.name=souffle élémentaire
actors.hero.abilities.mage.elementalblast.no_staff=Vous ne pouvez pas utiliser cette capacité sans votre personnel.
actors.hero.abilities.mage.elementalblast.short_desc=Le Mage émet un _Souffle élémentaire_ depuis son bâton, couvrant une large zone autour de lui dans un effet qui varie en fonction de la baguette dans son bâton.
actors.hero.abilities.mage.warpbeacon.depths=On ne peut pas passer d'une profondeur à l'autre !
actors.hero.abilities.mage.warpbeacon.desc=Le Mage place une balise, vers laquelle il peut ensuite se téléporter à volonté. Le placement de la balise prend 1 tour, mais le déplacement vers la balise est instantané.\n\nPar défaut, le Mage ne peut pas se téléporter d'un étage à l'autre, ni utiliser la balise pour atteindre des endroits inaccessibles tels que des pièces fermées à clé. Le Mage peut se téléporter sur les ennemis, ce qui les repousse.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Il n'est pas possible d'y placer une balise !
actors.hero.abilities.mage.warpbeacon.locked_floor=Vous ne pouvez pas quitter un étage fermé à clé !
actors.hero.abilities.mage.warpbeacon.name=balise de distorsion
actors.hero.abilities.mage.warpbeacon.short_desc=Le Mage place une _balise d'effarouchement_ à l'endroit où il se trouve, vers laquelle il peut se téléporter instantanément.
actors.hero.abilities.mage.warpbeacon.too_far=Cet endroit est trop éloigné !
actors.hero.abilities.mage.warpbeacon.window_cancel=annuler
actors.hero.abilities.mage.warpbeacon.window_clear=effacer la balise
actors.hero.abilities.mage.warpbeacon.window_desc=Votre balise est actuellement placée à l'étage %d.
actors.hero.abilities.mage.warpbeacon.window_tele=se téléporter à la balise
actors.hero.abilities.mage.wildmagic.desc=Le Mage libère la puissance de ses baguettes, les tirant au hasard jusqu'à 4 fois en un seul tour. Le bâton du Mage n'est pas inclus dans cet effet.\n\nChaque baguette voit son niveau augmenter de 2, jusqu'à +3. Cette capacité utilise la moitié de la charge de la baguette pour chaque coup, et aucune baguette ne peut être tirée plus de 2 fois.
actors.hero.abilities.mage.wildmagic.name=magie sauvage
actors.hero.abilities.mage.wildmagic.no_wands=Vous n'avez pas de baguettes pour zapper !
actors.hero.abilities.mage.wildmagic.short_desc=Le Mage libère la _Magie sauvage_ contenue dans ses baguettes, les tirant au hasard plusieurs fois sur une cible choisie au cours d'un seul tour.
actors.hero.abilities.ratmogrify$transmograt.desc=Cet ennemi a été transformé en rat. Une grande amélioration, si vous voulez mon avis ! - Roi des rats
actors.hero.abilities.ratmogrify$transmograt.name=ratmogrifié %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Tué par : ennemi ratmogrifié
actors.hero.abilities.ratmogrify.cant_transform=Vous ne pouvez pas le ratmogrifier !
actors.hero.abilities.ratmogrify.desc=Le héros transforme un ennemi en rat pendant 6 tours ! Les boss, les alliés et les rats ne peuvent pas être ratmogrifiés.\n\nLes ennemis ratmogrifiés conservent leurs statistiques d'origine, mais ne disposent d'aucune capacité.
actors.hero.abilities.ratmogrify.name=ratmogrifier
actors.hero.abilities.ratmogrify.short_desc=Le héros _Ratmogrifie_ un ennemi ! Cela le transforme temporairement en un rat sans aucune capacité.
actors.hero.abilities.ratmogrify.too_strong=Cet ennemi est trop fort pour être ratmogrifié !
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Cet ennemi a été marqué, ce qui lui inflige 25%% de dégâts bonus, mais le rend également incapable de mourir jusqu'à ce que la marque prenne fin.\n\nTours restants : %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=marqué pour la mort
actors.hero.abilities.rogue.deathmark.ally_target=Vous ne pouvez marquer que les ennemis
actors.hero.abilities.rogue.deathmark.desc=Le Rogue place une marque sur un ennemi choisi, lui infligeant 25 % de dégâts supplémentaires. La marque est appliquée instantanément et dure 5 tours.\n\nLes ennemis marqués subissent des dégâts supplémentaires mais ne peuvent pas mourir avant que la marque n'expire. Si un ennemi a 0 HP lorsque la marque prend fin, il mourra immédiatement.
actors.hero.abilities.rogue.deathmark.name=marque de la mort
actors.hero.abilities.rogue.deathmark.short_desc=Le Rogue place une _marque de mort_ sur un ennemi choisi. Les ennemis marqués subissent des dégâts bonus, mais ne peuvent pas mourir tant que la marque n'a pas pris fin.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Une copie du Voyou, faite de ténèbres obscures. Il reste immobile, les yeux vides et de minuscules mèches de ténèbres s'élèvent de lui comme de la vapeur d'eau.\n\nLe clone n'est pas une copie parfaite de l'Écorcheur, mais il est tout de même un combattant décent et peut bénéficier de l'équipement de l'Écorcheur avec les bons talents.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Votre clone passe à l'attaque !
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Votre clone se déplace vers cette position.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Votre clone se déplace pour vous suivre.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Vous pouvez trouver ce personnage avec une capacité d'armure de héros spécifique.
actors.hero.abilities.rogue.shadowclone$shadowally.name=voyou de l'ombre
actors.hero.abilities.rogue.shadowclone.desc=Le malfaiteur invoque un clone d'ombre de lui-même, qu'il peut diriger pour l'aider au combat. Diriger le clone d'ombre ne coûte rien.\n\nLe clone dispose de 80 HP, n'a pas d'armure et inflige de 10 à 20 points de dégâts. Toutes ces caractéristiques peuvent être améliorées par des talents, de sorte que le clone bénéficie des armes et de l'armure du héros.
actors.hero.abilities.rogue.shadowclone.name=clone d'ombre
actors.hero.abilities.rogue.shadowclone.short_desc=Le voleur invoque un _clone d'ombre_, qui peut être dirigé pour l'aider au combat.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=Les ennemis sont facilement convaincus que ce leurre en bois est le vrai Rogue !
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Vous pouvez trouver ce personnage avec une capacité d'armure de héros spécifique.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=leurre en bois
actors.hero.abilities.rogue.smokebomb.desc=Le voyou lance une bombe fumigène et clignote jusqu'à une distance de 6 tuiles. Il peut clignoter à travers les dangers et les ennemis, mais pas à travers les terrains solides comme les murs.\n\nLes ennemis adjacents à l'ancienne position du voleur sont aveuglés pendant 5 tours.
actors.hero.abilities.rogue.smokebomb.fov=Vous ne pouvez sauter qu'à un endroit vide dans votre champ de vision.
actors.hero.abilities.rogue.smokebomb.name=bombe fumigène
actors.hero.abilities.rogue.smokebomb.prompt=Choisir un lieu pour sauter
actors.hero.abilities.rogue.smokebomb.short_desc=Le voyou lance une _bombe fumigène_ tout en clignant des yeux. Il aveugle les ennemis près de son ancien emplacement.
actors.hero.abilities.warrior.endure$enduretracker.desc=Le guerrier inflige désormais des dégâts bonus en fonction des dégâts qu'il a subis.\n\nDégâts bonus : %1$d\nPoints de vie à gauche : %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=l'endurance
actors.hero.abilities.warrior.endure.desc=Le guerrier endure pendant 3 tours la moitié des dégâts qu'il subit, quelle que soit leur origine. Cette réduction s'applique avant les effets de résistance aux dégâts comme l'armure.\n\nAprès avoir enduré, le prochain coup du guerrier dans un délai de 10 tours bénéficie d'un bonus de dégâts. Ce bonus de dégâts est égal à la moitié de tous les dégâts qui lui ont été infligés pendant qu'il endurait, avant tout effet de réduction des dégâts !\n\nSi le guerrier dispose d'un combo, l'utilisation de cette capacité augmente sa durée restante de 3 tours.
actors.hero.abilities.warrior.endure.name=endurer
actors.hero.abilities.warrior.endure.short_desc=Le guerrier _Endure_, sautant plusieurs tours mais gagnant une forte résistance aux dégâts. Il inflige ensuite des dégâts bonus en fonction de ce qu'il a enduré.
actors.hero.abilities.warrior.heroicleap.desc=Le guerrier bondit vers un endroit ciblé, en passant par-dessus les ennemis ou les dangers qui se trouvent sur son chemin. Il ne peut cependant pas sauter par-dessus les murs ou tout autre terrain solide.
actors.hero.abilities.warrior.heroicleap.name=saut héroïque
actors.hero.abilities.warrior.heroicleap.prompt=Choisir la direction du saut
actors.hero.abilities.warrior.heroicleap.short_desc=Le guerrier effectue un _saut héroïque_ vers un endroit ciblé, en naviguant au-dessus des ennemis et des dangers.
actors.hero.abilities.warrior.shockwave.desc=Le guerrier frappe le sol, produisant une onde de choc qui se propage jusqu'à 5 carreaux dans un cône de 60 degrés.\n\nLes ennemis pris dans cette onde de choc sont paralysés pendant 5 tours. Ils subissent également 5 à 10 points de dégâts, auxquels s'ajoutent 1 à 2 points de dégâts supplémentaires pour chaque point de force du guerrier au-delà de 10.
actors.hero.abilities.warrior.shockwave.name=onde de choc
actors.hero.abilities.warrior.shockwave.short_desc=Le guerrier libère une _onde de choc_ dans une zone d'effet conique en frappant le sol. Les ennemis pris dans l'onde de choc subissent des dégâts et sont paralysés.
actors.hero.hero.key_distracted=Vous n'arrivez pas à ouvrir la serrure, il faut continuer à essayer.
actors.hero.hero.leave=Tu ne peux pas partir tout de suite, le reste du donjon t'attend en bas !
actors.hero.hero.level_cap=Vous ne pouvez pas devenir plus fort, mais vos expériences vous donnent un regain de puissance !
actors.hero.hero.level_up=Relevez le niveau !
actors.hero.hero.locked_chest=Ce coffre est verrouillé et vous n'avez pas la clé correspondante.
actors.hero.hero.locked_door=Vous n'avez pas de clé correspondante.
actors.hero.hero.name=vous
actors.hero.hero.new_level=Augmentez votre niveau ! +Accuracy, +Evasion, +5 HP !
actors.hero.hero.new_talent=+1 point de talent !
actors.hero.hero.noticed_smth=Vous avez remarqué quelque chose.
actors.hero.hero.pain_resist=La douleur vous aide à résister à l'envie de dormir.
actors.hero.hero.revive=L'ankh explose d'énergie vitale !
actors.hero.hero.search=recherche
actors.hero.hero.search_distracted=Il est difficile de se concentrer, la recherche est épuisante.
actors.hero.hero.unspent=Vous avez des points de talent non dépensés !
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=vous ne pouvez pas porter : %s.
actors.hero.hero.you_now_have=vous avez ramassé : %s.
actors.hero.heroclass.cleric=ecclésiastique
actors.hero.heroclass.cleric_desc=Le clerc commence avec un _tome sacré unique_, qu'il peut utiliser pour lancer divers sorts.\n\nLa plupart des talents du clerc sont axés sur l'apprentissage ou l'amélioration des sorts.\n\nL'Ecclésiaste commence également avec _un gourdin_, une armure en tissu, une gourde et une pochette en velours.\n\nLe clerc identifie automatiquement :\nles parchemins d'identification\npotions de pureté\nparchemins de levée de malédiction
actors.hero.heroclass.cleric_desc_short=Le clerc est un lanceur de sorts divins qui utilise son _tome sacré_ unique pour canaliser la magie divine. Il peut _apprendre et améliorer ses sorts_ grâce à ses talents.
actors.hero.heroclass.cleric_unlock=Pour déverrouiller le Clerc _dépolluer complètement la malédiction sur n'importe quelle pièce d'équipement maudite._
actors.hero.heroclass.duelist=duelliste
actors.hero.heroclass.duelist_desc=Le duelliste commence avec une _rapière unique_ dotée d'une capacité spéciale qui se recharge avec le temps.\n\nChaque arme du jeu possède une _capacité spéciale différente_ que le duelliste peut utiliser.\n\nLe duelliste commence également avec _deux pointes de jet_, une armure en tissu, une gourde et une pochette en velours.\n\nLe duelliste identifie automatiquement :\n_-_ les parchemins d'identification\npotions de force\nparchemins d'image miroir
actors.hero.heroclass.duelist_desc_short=Le duelliste est un maître d'armes qui peut utiliser son arme pour déclencher une _capacité spéciale de l'arme_ Cette capacité spéciale est _différente pour chaque arme_
actors.hero.heroclass.duelist_unlock=Pour débloquer le Duelliste _équipez une arme de niveau 2 ou supérieur sans pénalité de force_
actors.hero.heroclass.huntress=chasseresse
actors.hero.heroclass.huntress_desc=La chasseresse commence avec un _arc spirituel unique_, qui peut tirer un nombre infini de flèches conjurées.\n\nLa chasseresse peut se déplacer dans les hautes herbes _sans les piétiner_.\n\nLa chasseresse commence également avec des _gants cloutés_, une armure en tissu, une gourde et une pochette en velours.\n\nLa chasseresse identifie automatiquement :\n_-_ les parchemins d'identification\npotions de vision de l'esprit\nparchemins de berceuse
actors.hero.heroclass.huntress_desc_short=La chasseresse maîtrise les armes de jet et possède un _arc magique_ aux flèches infinies. Elle se déplace également dans les hautes herbes _sans les piétiner_
actors.hero.heroclass.huntress_unlock=Pour débloquer la Chasseuse, il faut _faire tomber les ennemis avec des armes de jet 10 fois au cours d'une partie_
actors.hero.heroclass.mage=mage
actors.hero.heroclass.mage_desc=Le Mage commence avec un _bâton unique_, qui se recharge beaucoup plus vite qu'une baguette et a 1 charge de plus. Le bâton _peut être imprégné de n'importe quelle baguette_ que le Mage trouve dans le donjon.\n\nLe Mage commence également avec une _baguette de missile magique_ imprégnée dans son bâton, une armure en tissu, une gourde et une pochette en velours.\n\nLe Mage identifie automatiquement :\n_-_ les parchemins d'identification\npotions de flamme liquide\nparchemins d'amélioration
actors.hero.heroclass.mage_desc_short=Le Mage est un expert en arcanes et porte un _bâton magique_ plus puissant qu'une baguette. Le bâton peut être _imprégné de n'importe quelle baguette_ trouvée par le Mage.
actors.hero.heroclass.mage_unlock=Pour débloquer le Mage _utilisez un parchemin d'amélioration pour renforcer un objet
actors.hero.heroclass.rogue=voyou
actors.hero.heroclass.rogue_desc=Le Rogue commence avec une _cape d'ombre_ unique, qu'il peut utiliser pour devenir invisible à volonté.\n\nIl peut _détecter les secrets et les pièges_ à une plus grande distance.\n\nIl commence également avec _une dague_, _trois couteaux de lancer_, une armure en tissu, une gourde et une pochette en velours.\n\nLe voleur identifie automatiquement :\nles parchemins d'identification\npotions d'invisibilité\nparchemins de cartographie magique
actors.hero.heroclass.rogue_desc_short=Il peut échapper à ses ennemis et frapper dans l'invisibilité grâce à son _cloak des ombres_ et _détecter les secrets et les pièges_ à une plus grande distance.
actors.hero.heroclass.rogue_unlock=Pour débloquer le Rogue _réaliser 10 attaques surprises dans une partie_
actors.hero.heroclass.warrior=guerrier
actors.hero.heroclass.warrior_desc=Le guerrier commence avec un _sceau brisé unique_ qui lui confère une rafale de bouclier lorsqu'il est en dessous de la moitié de sa santé. Le sceau peut être déplacé d'une armure à l'autre et peut _transférer une seule amélioration_ avec lui.\n\nLe guerrier commence également avec une _épée courte usée_, _trois pierres de jet_, une armure en tissu, une gourde et une pochette en velours.\n\nLe guerrier identifie automatiquement :\n_-_ les parchemins d'identification\npotions de guérison\nparchemins de rage
actors.hero.heroclass.warrior_desc_short=Le guerrier endure des dégâts supplémentaires grâce au bouclier que lui confère son _sceau brisé_. Le sceau peut être déplacé d'une armure à l'autre et _transfère une seule amélioration_
actors.hero.heroclass.warrior_unlock=Le guerrier est automatiquement déverrouillé.
actors.hero.herosubclass.assassin=assassin
actors.hero.herosubclass.assassin_desc=L'Assassin prépare son prochain coup lorsqu'il devient invisible. Plus il se prépare longtemps, plus sa prochaine attaque sera puissante. La préparation peut durer jusqu'à 9 tours.\n\nAprès s'être préparé, l'Assassin inflige des dégâts bonus à sa prochaine attaque, peut se rapprocher de sa cible en clignant des yeux et peut même tuer instantanément les ennemis suffisamment faibles.
actors.hero.herosubclass.assassin_short_desc=L'_Assassin_ peut préparer une attaque mortelle alors qu'il est invisible. Plus il attend, plus l'attaque sera puissante.
actors.hero.herosubclass.battlemage=mage de guerre
actors.hero.herosubclass.battlemage_desc=Le mage de guerre bénéficie d'un effet bonus lorsqu'il frappe en mêlée avec son bâton, comme si son bâton était doté d'un enchantement supplémentaire. Ces effets dépendent de la baguette dont son bâton est imprégné, chaque baguette ayant son propre effet. En plus des effets de la baguette, le bâton du mage de guerre gagne également 0,5 charge lorsqu'il frappe avec.
actors.hero.herosubclass.battlemage_short_desc=Le _mage de guerre_ obtient des effets bonus lorsqu'il se bat en mêlée avec son bâton. Ces effets dépendent de la baguette dont son bâton est imprégné.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=Le Berserker gagne en rage lorsqu'il subit des dégâts physiques, y compris ceux qui sont bloqués par son armure ! La rage s'estompe régulièrement avec le temps, mais plus lentement si ses PV sont faibles.\n\nLa rage peut permettre au Berserker d'infliger jusqu'à +50% de dégâts. Au maximum de sa rage, il peut devenir berserk, gagner une rafale de bouclier et conserver sa rage tant qu'il lui reste du bouclier. Le bouclier s'adapte au niveau de l'armure du Berserker et peut être considérablement augmenté si sa santé est faible. Le Berserker a besoin de temps pour récupérer après être devenu fou furieux.
actors.hero.herosubclass.berserker_short_desc=Le _Berserker_ accumule de la rage au fur et à mesure qu'il subit des dégâts. La rage augmente ses dégâts et peut être activée à 100 % pour bénéficier d'un bonus de bouclier.
actors.hero.herosubclass.champion=champion
actors.hero.herosubclass.champion_desc=Le champion est un maître des armes de mêlée qui peut équiper une arme secondaire en plus de son arme principale. Ses attaques habituelles utilisent son arme principale, mais il peut changer instantanément d'arme principale et utiliser les capacités de l'une ou l'autre.\n\nElle gagne également 2 charges de capacité d'arme supplémentaires et +50% de vitesse de recharge de la capacité d'arme.
actors.hero.herosubclass.champion_short_desc=Le _Champion_ peut manier deux armes et bénéficie de plus de charges d'armes. Ses attaques normales utilisent son arme principale, mais il peut changer d'arme et utiliser la capacité de l'une ou l'autre.
actors.hero.herosubclass.freerunner=coureur libre
actors.hero.herosubclass.freerunner_desc=Lorsque le coureur libre se déplace, il accumule des piles d'élan. Il peut gagner jusqu'à 10 points d'élan après avoir couru pendant 10 tours, mais il les perd rapidement s'il s'arrête de bouger. Le coureur libre peut utiliser son élan pour commencer une course libre, pour 2 tours par point d'élan.\n\nLors d'une course libre, le coureur libre se déplace à une vitesse multipliée par deux et bénéficie d'un bonus d'évasion proportionnel à son niveau. Une fois la course libre terminée, il y a un temps de recharge avant que l'élan ne puisse être reconstitué.
actors.hero.herosubclass.freerunner_short_desc=Le _coureur libre_ prend de l'élan en courant, ce qui peut être utilisé pour commencer une course libre. Cela lui confère un bonus de vitesse et d'évasion pendant une courte période.
actors.hero.herosubclass.gladiator=gladiateur
actors.hero.herosubclass.gladiator_desc=Le gladiateur construit un point de combo à chaque fois qu'il réussit une attaque avec une arme de mêlée ou de jet. Si le gladiateur ne réussit pas une attaque dans les 5 tours (15 tours après une mise à mort), son combo est réinitialisé.\n\nAu fur et à mesure qu'il construit son combo, le gladiateur peut utiliser une variété de capacités dont la réussite est garantie :\ncombo 2 : fait reculer l'ennemi, préserve le combo\n4 Combo : inflige des dégâts en fonction de l'armure\n6 Combo : parade, préserve le combo\n8 Combo : inflige des dégâts à la cible et aux ennemis proches\n10 Combo : attaque une fois pour chaque combo
actors.hero.herosubclass.gladiator_short_desc=Le _Gladiateur_ accumule du combo lorsqu'il réussit ses attaques. Il peut dépenser le combo pour utiliser des capacités uniques.
actors.hero.herosubclass.monk=moine
actors.hero.herosubclass.monk_desc=Le moine est un maître de la technique physique. En battant ses ennemis, il gagne de l'énergie qu'il peut utiliser pour diverses capacités défensives et utilitaires. Cette énergie ne s'estompe pas avec le temps, mais elle est plafonnée en fonction du niveau du moine.\n\n1 énergie : frappe rapide avec les poings\n2 Énergie : se concentrer pour esquiver la prochaine attaque\n3 Énergie : s'élancer instantanément à proximité\n4 Énergie : repousser un ennemi d'un coup de pied\n5 Énergie : méditer pour effacer les statuts et restaurer la charge de la baguette et de l'artefact
actors.hero.herosubclass.monk_short_desc=Le _Moine_ accumule de l'énergie en combattant. Cette énergie peut être dépensée pour une variété de capacités uniques.
actors.hero.herosubclass.paladin=paladin
actors.hero.herosubclass.paladin_desc=Le paladin bénéficie d'une variété de nouveaux sorts et de sorts améliorés qui mettent l'accent sur le combat de mêlée et la synergie avec les armes et les armures.\n\nLes sorts _Aarme sacrée_ et _Garde sacrée_ du paladin accordent des bonus plus importants, n'annulent plus les enchantements et les glyphes existants et peuvent être étendus en lançant d'autres sorts.\n\nLe paladin gagne également le sort _Smite_, qui lui permet d'effectuer un coup de mêlée garanti avec un bonus de dégâts et de puissance d'enchantement.
actors.hero.herosubclass.paladin_short_desc=Le _Paladin_ gagne de nouveaux sorts à courte portée et des versions renforcées de l'arme sacrée et de la protection.
actors.hero.herosubclass.priest=prêtre
actors.hero.herosubclass.priest_desc=Le prêtre bénéficie d'une variété de nouveaux sorts et de sorts améliorés qui mettent l'accent sur le combat à distance et la synergie avec les objets magiques.\n\nLe prêtre peut lancer gratuitement _Guiding Light_ une fois tous les 50 tours, illuminer les ennemis directement ciblés par l'un de ses sorts et consommer l'affaiblissement d'illumination avec les alliés, les baguettes et certains artefacts pour un bonus de dégâts égal à leur niveau + 5.\n\nLe prêtre gagne également le sort _Radiance_, qui dissipe les ténèbres et affecte tous les ennemis visibles, déclenchant et appliquant illumination et les étourdissant brièvement au prix de 2 charges.
actors.hero.herosubclass.priest_short_desc=Le _Prêtre_ bénéficie de nouveaux sorts à longue portée et d'une version renforcée de la lumière directrice.
actors.hero.herosubclass.sniper=tireur d'élite
actors.hero.herosubclass.sniper_desc=Le tireur d'élite est un maître du combat à distance, dont les attaques à distance transpercent les armures ennemies. Lorsqu'elle attaque un ennemi avec une arme de jet, elle lui appose une marque de sniper, ce qui lui permet d'enchaîner avec une attaque spéciale de son arc. Cette attaque spéciale varie en fonction de l'amélioration de son arc.\n\nUn arc non augmenté tire un instantané qui inflige des dégâts réduits mais qui se déclenche instantanément. Un arc rapide tire une volée de trois flèches qui infligent des dégâts réduits, peuvent encore activer des enchantements et mettent un tour à tirer. Un arc à dégâts tirera une flèche de sniper dont le toucher est garanti, qui inflige des dégâts bonus en fonction de la distance et dont le tir prend 2 tours.
actors.hero.herosubclass.sniper_short_desc=Le _tireur d'élite_ peut percer les armures avec ses attaques à distance. Après avoir frappé avec une arme de jet, elle peut enchaîner avec une attaque spéciale de son arc.
actors.hero.herosubclass.warden=gardien
actors.hero.herosubclass.warden_desc=La gardienne a un lien étroit avec la nature, ce qui lui confère divers effets bonus liés à l'herbe et aux plantes. Elle est capable de voir à travers l'herbe haute et sillonnée comme s'il s'agissait d'un espace vide.\n\nLa gardienne fait germer de l'herbe autour de toute graine qu'elle lance ou plante, et obtient des effets spéciaux lorsqu'elle piétine des plantes. Ces effets spéciaux remplacent les effets normaux des plantes, ce qui signifie qu'aucune plante n'est dangereuse pour elle.
actors.hero.herosubclass.warden_short_desc=La _garde_ peut voir à travers les hautes herbes et bénéficie d'effets bonus lorsqu'elle plante des graines et piétine des plantes.
actors.hero.herosubclass.warlock=sorcier
actors.hero.herosubclass.warlock_desc=Le sorcier a une chance d'infliger une marque d'âme aux personnages lorsqu'il utilise sa baguette sur eux. Les chances d'appliquer une marque d'âme et sa durée augmentent avec le niveau de la baguette.\n\nLorsqu'un ennemi est marqué, le sorcier soigne 2 pv par tranche de 5 points de dégâts qu'il lui inflige, mais uniquement avec des attaques de mêlée ou des armes de jet, pas avec des baguettes !
actors.hero.herosubclass.warlock_short_desc=Le _Sorcier_ a une chance de marquer l'âme de ses ennemis avec ses baguettes. Il se soigne à chaque fois qu'il inflige des dégâts physiques aux ennemis marqués.
actors.hero.spells.auraofprotection$aurabuff.desc=Le paladin rayonne une énergie protectrice autour de lui.\n\nTout allié proche (y compris le paladin lui-même) subit des dégâts réduits et bénéficie de l'effet du glyphe d'armure du paladin avec une puissance accrue.\n\nTours restants : %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura de protection
actors.hero.spells.auraofprotection.desc=Le paladin commence à rayonner de l'énergie protectrice dans une aura étincelante autour de lui pendant 20 tours. Tout allié situé à moins de 2 carreaux du paladin (y compris lui-même) subit %1$d%% de dégâts en moins et bénéficie de l'effet du glyphe d'armure du paladin à +%2$d%% de puissance.\n\nCette réduction des dégâts s'applique avant les autres effets de réduction des dégâts (par exemple, l'armure). L'augmentation de la puissance du glyphe s'applique toujours, mais ce sort ne peut pas faire en sorte que le glyphe du paladin s'applique plus d'une fois si un personnage en bénéficie déjà (par exemple, le paladin lui-même ou une image prismatique).
actors.hero.spells.auraofprotection.name=aura de protection
actors.hero.spells.auraofprotection.short_desc=Augmente la défense du paladin et des alliés proches.
actors.hero.spells.beamingray$beamingrayboost.desc=Cet allié a récemment été téléporté par Rayon de téléportation, ce qui lui confère un bonus de dégâts contre l'ennemi le plus proche après la téléportation. Le pouvoir de la multitude n'expire pas non plus lorsque ce buff est actif.\n\nTours restants : %s.
actors.hero.spells.beamingray$beamingrayboost.name=rayon rayonnant
actors.hero.spells.beamingray.desc=L'Ecclésiaste canalise le pouvoir de son allié en un rayon de lumière qui le projette vers un endroit donné. Si le rayon entre en collision avec un ennemi, il placera l'allié à proximité et le dirigera vers l'ennemi.\n\nLe rayon a une portée maximale de %1$d tuiles, et augmente le bonus de dégâts de Puissance de la multitude à +%2$d%% pendant 10 tours contre l'ennemi le plus proche dans un rayon de 4 tuiles. Le rayon de téléportation peut même téléporter des alliés normalement immobiles, mais sa portée est réduite de moitié dans ce cas.
actors.hero.spells.beamingray.name=rayon rayonnant
actors.hero.spells.beamingray.no_space=Il n'y a pas de place pour que votre allié y apparaisse.
actors.hero.spells.beamingray.out_of_range=Cet endroit est hors de portée.
actors.hero.spells.beamingray.short_desc=Téléporte votre allié et lui inflige des dégâts bonus.
actors.hero.spells.blessspell.desc=Le Clerc place une bénédiction sacrée sur lui-même ou sur un autre personnage qu'il peut voir.\n\nLorsqu'il est lancé sur lui-même, l'effet est plus faible, accordant %1$d tours de bénédiction et %2$d barrière.\n\nLorsqu'il est lancé sur d'autres personnages, le sort est plus puissant, accordant %3$d tours de bénédiction et %4$d soins. L'excédent de soins est converti en barrière.
actors.hero.spells.blessspell.name=bénir
actors.hero.spells.blessspell.short_desc=Bénit et protège le clerc, bénit et soigne les autres.
actors.hero.spells.bodyform$bodyformbuff.desc=La forme du corps de Trinity vous accorde actuellement le pouvoir d'un enchantement ou d'un glyphe, comme si vous l'aviez équipé sur votre arme ou armure actuelle.\n\nNotez que la forme du corps ne peut pas fournir une autre copie d'un effet dont vous bénéficiez déjà.\n\nEffet actuel : %1$s.\n\nTours restants : %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=forme du corps
actors.hero.spells.bodyform.desc=Le clerc choisit un enchantement ou un glyphe qu'il a identifié lors de cette manche et en imprègne la Trinité.\n\nLorsque Trinity est utilisé, l'Ecclésiaste bénéficie de l'effet de l'enchantement ou du glyphe choisi pendant %d tours. Cet enchantement ou glyphe temporaire fonctionnera avec n'importe quel effet qu'un enchantement ou glyphe normal.\n\nCe sort remplace tout autre effet corporel dont Trinité est actuellement imprégnée.
actors.hero.spells.bodyform.name=forme du corps
actors.hero.spells.bodyform.short_desc=Attribue la Trinité à un enchantement ou à un glyphe.
actors.hero.spells.cleanse.desc=L'Ecclésiaste élimine tous les effets d'état nuisibles sur lui-même et ses alliés visibles. A la fin du sort, tous les personnages affectés gagnent également %1$d tours d'immunité aux débuffs, et %2$d barrière.
actors.hero.spells.cleanse.name=nettoyer
actors.hero.spells.cleanse.short_desc=Supprime les affaiblissements et confère un bouclier.
actors.hero.spells.clericspell.charge_cost=Coût de la charge : %d
actors.hero.spells.clericspell.invalid_enemy=Vous ne pouvez pas cibler cet ennemi.
actors.hero.spells.clericspell.invalid_target=Vous ne pouvez pas cibler cet endroit.
actors.hero.spells.clericspell.no_target=Il n'y a pas d'objectif à atteindre.
actors.hero.spells.clericspell.prompt=Choisir une cible
actors.hero.spells.divineintervention.desc=Le Clerc déverse une énorme quantité de puissance de son tome en lui-même et dans ses alliés, augmentant le bouclier de chacun à %1$d et prolongeant la Forme ascendante de %2$d tours. L'incroyable puissance défensive de ce sort est mise en balance avec son coût de charge très élevé.\n\nTout comme les autres protections accordées par la forme ascendante, cette protection ne se dégrade pas normalement, mais expire immédiatement à la fin de la forme ascendante.
actors.hero.spells.divineintervention.name=intervention divine
actors.hero.spells.divineintervention.short_desc=Augmentation massive du bouclier de l'Ecclésiaste et de ses alliés.
actors.hero.spells.divinesense$divinesensetracker.desc=Ce personnage est temporairement capable de voir les autres créatures proches avec son esprit !\n\nTours restants : %s.
actors.hero.spells.divinesense$divinesensetracker.name=sens divin
actors.hero.spells.divinesense.desc=Le clerc concentre ses sens sur son environnement, obtenant une vision mentale d'une portée de %d tuiles pendant 50 tours. Ce sort ne prend pas de temps à lancer.
actors.hero.spells.divinesense.name=sens divin
actors.hero.spells.divinesense.short_desc=Obtenir une vision temporaire de l'esprit dans une large gamme.
actors.hero.spells.flash.desc=L'Ecclésiaste canalise sa forme ascendante vers un endroit proche et s'y téléporte. Flash peut téléporter l'Ecclésiaste à n'importe quel endroit découvert qui est à portée et inoccupé. Ce sort coûte plus de charges de tome à chaque fois qu'il est utilisé dans la même forme ascendante.
actors.hero.spells.flash.name=flash
actors.hero.spells.flash.prompt=Choisir un lieu
actors.hero.spells.flash.short_desc=Se téléporter à proximité.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Le prêtre pourra à nouveau lancer Lumière de guide gratuitement après 50 tours.\n\nTours restants : %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=La lumière qui guide
actors.hero.spells.guidinglight$illuminated.desc=Ce personnage brille parce qu'il a été frappé par une lumière directrice. Bien que la lueur ne soit pas assez forte pour éclairer la zone environnante, l'effet magique rendra les coups plus faciles à porter pour l'Ecclésiaste.
actors.hero.spells.guidinglight$illuminated.desc_generic=Les autres héros peuvent toujours utiliser illuminé pour bénéficier du talent de lumière brûlante, mais ils ne gagneront pas en précision.
actors.hero.spells.guidinglight$illuminated.desc_priest=Le prêtre peut en outre consommer illuminé avec de la radiance, un coup de baguette, un coup d'un allié ou les effets de certains artefacts. L'utilisation de l'illumination de cette manière inflige un bonus de dégâts magiques égal au niveau du prêtre + 5.
actors.hero.spells.guidinglight$illuminated.name=éclairé
actors.hero.spells.guidinglight.desc=L'Ecclésiaste tire un éclair d'énergie magique qui frappe une cible, lui infligeant 2 à 8 points de dégâts et l'illuminant. La prochaine attaque physique non encombrée portée contre un ennemi illuminé est assurée de le toucher.
actors.hero.spells.guidinglight.desc_priest=le premier lancement de ce sort tous les 50 tours ne coûte pas de charge de tome, et l'illumination sera consommée par l'éclat, les baguettes, les autres personnages et les artefacts qui affectent directement les ennemis. Lorsque illumination est utilisé de cette façon, il inflige un bonus de dégâts magiques égal au niveau du prêtre + 5.
actors.hero.spells.guidinglight.name=La lumière qui guide
actors.hero.spells.guidinglight.short_desc=Inflige des dégâts magiques à distance et garantit une touche.
actors.hero.spells.hallowedground$hallowedterrain.desc=Le sol a été sanctifié ici. Le sol sanctifié ralentit les ennemis, soigne les alliés et fait pousser de l'herbe.
actors.hero.spells.hallowedground.desc=Le prêtre concentre sa magie divine sur le sol à proximité, créant une zone %1$dx%1$d de terre sanctifiée pendant 20 tours.\n\nLorsqu'il est lancé, ce sort soigne tous les alliés de 15 PV (les alliés en bonne santé et le prêtre bénéficient d'un bouclier), enracine brièvement les ennemis et répand de l'herbe courte.\n\nLe terrain sanctifié soigne les alliés de 1 PV par tour (les alliés en bonne santé et le prêtre bénéficient d'un bouclier), paralyse les ennemis et fait pousser de l'herbe haute de façon aléatoire.\n\nLe terrain sanctifié est détruit par le feu et produit de l'herbe sillonnée si les effets de régénération passive sont désactivés ou si le prêtre n'a pas gagné d'expérience depuis un certain temps.
actors.hero.spells.hallowedground.name=terre sacrée
actors.hero.spells.hallowedground.prompt=Choisir un lieu
actors.hero.spells.hallowedground.short_desc=Soigne les alliés, ralentit les ennemis et répand de l'herbe dans une zone d'effet.
actors.hero.spells.holyintuition.cursed=Vous sentez qu'une magie malveillante se cache dans cet objet.
actors.hero.spells.holyintuition.desc=Le Clerc concentre ses sens sur un objet et détermine s'il est maudit ou non sans avoir à l'équiper.
actors.hero.spells.holyintuition.name=sainte intuition
actors.hero.spells.holyintuition.prompt=choisir un article
actors.hero.spells.holyintuition.short_desc=permet de déterminer si un objet est maudit ou non.
actors.hero.spells.holyintuition.uncursed=Cet objet est exempt de magie malveillante.
actors.hero.spells.holylance$lancecooldown.desc=Le prêtre a récemment lancé Holy Lance et doit attendre avant de le relancer.\n\nTours restants : %s.
actors.hero.spells.holylance$lancecooldown.name=temps de recharge de la lance sacrée
actors.hero.spells.holylance.desc=Le prêtre concentre une grande quantité d'énergie dans une lance de lumière dévastatrice. Cette lance inflige des dégâts de %1$d-%2$d et inflige toujours des dégâts maximums aux morts-vivants et aux démons.\n\nCe sort est très coûteux et a un temps de recharge de 30 tours.
actors.hero.spells.holylance.name=lance sacrée
actors.hero.spells.holylance.short_desc=Inflige de lourds dégâts magiques à distance.
actors.hero.spells.holyward$holyarmbuff.desc=Le clerc a imprégné son armure d'énergie sacrée, remplaçant temporairement tout glyphe existant et permettant à l'armure de bloquer 1 point de dégâts supplémentaire.\n\nTours restants : %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Le paladin a imprégné son armure d'énergie sacrée, ce qui lui permet de bloquer 3 points de dégâts supplémentaires.\n\nLancer d'autres sorts pendant que la garde sacrée est active prolonge sa durée de 10 tours par charge dépensée.\n\nTours restants : %s.
actors.hero.spells.holyward$holyarmbuff.name=sainte pupille
actors.hero.spells.holyward.desc=Le clerc imprègne son armure de glyphes de lumière sacrée, augmentant le blocage des dégâts de l'armure de 1. Ce sort ne prend pas de temps à lancer.\n\nCe glyphe dure 50 tours et remplace tous les glyphes bénéfiques de l'armure pour la durée de l'effet. Le clerc bénéficiera de cet effet même s'il n'a pas d'armure.
actors.hero.spells.holyward.desc_paladin=ce sort est plus puissant lorsqu'il est lancé par le paladin : le blocage des dégâts supplémentaires est porté à 3, le sort n'annule plus les glyphes existants et le fait de lancer d'autres sorts pendant que Holy Ward est actif prolonge sa durée de 10 tours par charge utilisée.
actors.hero.spells.holyward.glyph_desc=Ce glyphe augmente légèrement la quantité de dégâts que l'armure peut bloquer.
actors.hero.spells.holyward.glyph_name=%s de lumière
actors.hero.spells.holyward.name=sainte pupille
actors.hero.spells.holyward.short_desc=Remplace temporairement les glyphes pour augmenter le blocage de l'armure.
actors.hero.spells.holyweapon$holywepbuff.desc=Le clerc a imprégné son arme portée d'énergie sacrée, annulant temporairement tout enchantement existant et permettant à l'arme d'infliger 2 points de dégâts magiques supplémentaires à chaque attaque.\n\nTours restants : %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Le paladin a imprégné son arme portée d'énergie sacrée, ce qui fait que ses attaques infligent 6 points de dégâts magiques supplémentaires.\n\nLancer d'autres sorts pendant que l'arme sacrée est active prolonge sa durée de 10 tours par charge dépensée.\n\nTours restants : %s.
actors.hero.spells.holyweapon$holywepbuff.name=arme sacrée
actors.hero.spells.holyweapon.desc=Le clerc enchante son arme portée avec de l'énergie sacrée, ce qui fait que l'arme inflige 2 points de dégâts magiques supplémentaires chaque fois qu'elle frappe un ennemi. Ce sort ne prend pas de temps à lancer.\n\nCet enchantement dure 50 tours et remplace tout enchantement bénéfique de l'arme pour la durée de l'enchantement. Les coups à mains nues peuvent également bénéficier de cet effet.
actors.hero.spells.holyweapon.desc_paladin=les dégâts magiques supplémentaires sont portés à 6, le sort ne se substitue plus aux enchantements existants et le fait de lancer d'autres sorts pendant que l'arme sacrée est active prolonge sa durée de 10 tours par charge utilisée.
actors.hero.spells.holyweapon.ench_desc=Les ennemis frappés par une arme sacrée subissent des dégâts magiques supplémentaires.
actors.hero.spells.holyweapon.ench_name=saint %s
actors.hero.spells.holyweapon.name=arme sacrée
actors.hero.spells.holyweapon.short_desc=Annule temporairement les enchantements pour augmenter les dégâts.
actors.hero.spells.judgement.desc=L'Ecclésiaste frappe le sol de son poing, provoquant une éruption de lumière qui inflige des dégâts à tous les ennemis qu'il peut voir. Il inflige %1$d-%2$d de dégâts de base, mais aussi 33%% de dégâts supplémentaires pour chaque sort lancé par l'Ecclésiaste depuis son ascension (ou depuis qu'il a lancé Jugement).\n\nActuellement, le Jugement inflige %3$d-%4$d.
actors.hero.spells.judgement.name=jugement
actors.hero.spells.judgement.short_desc=Endommage tous les ennemis visibles.
actors.hero.spells.layonhands.desc=Le paladin canalise l'énergie sacrée à travers ses mains, guérissant ou protégeant tout ce qu'il touche.\n\nLe paladin peut lancer ce sort sur un personnage adjacent pour le soigner %1$d, ou sur lui-même pour obtenir un bouclier %1$d. L'excédent de guérison de ce sort est converti en bouclier.\n\nCe sort est lancé instantanément et peut être lancé à plusieurs reprises, mais il ne peut pas accorder plus de trois jets de bouclier à la fois.
actors.hero.spells.layonhands.name=imposer les mains
actors.hero.spells.layonhands.short_desc=Soigne instantanément un personnage adjacent ou protège le paladin.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=L'Ecclésiaste a récemment lancé Life Link sur cet allié.\n\nEn plus des avantages habituels du Lien de Vie, ce personnage subit des dégâts réduits, les sorts positifs du Clerc s'appliquent à la fois au Clerc et à cet allié au lieu d'un seul, et le Pouvoir de la multitude n'expire pas tant que ce buff est actif.\n\nTours restants : %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=protection du lien vital
actors.hero.spells.lifelinkspell.desc=L'Ecclésiaste renforce le lien qui l'unit à son allié. Grâce à ce lien, tous les dégâts subis seront partagés entre le héros et son allié pendant %1$d tours, et le boost défensif de Puissance de la multitude sera augmenté à -%2$d%% dégâts subis. Notez que les dégâts sont partagés après l'armure, mais avant la réduction des dégâts de Puissance de plusieurs.\n\nTant que cet effet est actif, les sorts bénéfiques du Clerc de T3 ou moins s'appliqueront à la fois au Clerc et à son allié s'ils ne s'appliquaient qu'à l'un d'entre eux.
actors.hero.spells.lifelinkspell.name=lien de vie
actors.hero.spells.lifelinkspell.short_desc=Partage les dégâts avec un allié et réduit les dégâts qu'il subit.
actors.hero.spells.mindform.desc=L'Ecclésiaste choisit une baguette ou une arme de jet qu'il a identifiée lors de cette course et imprègne la Trinité de son effet.\n\nLorsque la Trinité est utilisée, l'Ecclésiaste peut effectuer une attaque unique comme s'il utilisait l'objet choisi à +%d. Cela déclenchera tous les effets que l'utilisation de ce type d'objet déclencherait normalement.\n\nCe sort remplace tout autre effet mental dont la Trinité est actuellement imprégnée.
actors.hero.spells.mindform.name=forme mentale
actors.hero.spells.mindform.short_desc=Attribue la Trinité à une baguette ou à une arme de jet.
actors.hero.spells.mnemonicprayer.desc=Le prêtre prononce une prière qui prolonge de %1$d tours la durée de tous les buffs ou debuffs sur une cible spécifique. Ce sort ne prend pas de temps à lancer. Les effets positifs dureront plus longtemps sur les alliés (y compris le prêtre lui-même), et les effets négatifs dureront plus longtemps sur les ennemis.\n\nPrière mnémonique ne peut prolonger qu'une seule fois un buff ou un debuff spécifique, et ne peut pas prolonger les buffs accordés par les capacités d'armure.
actors.hero.spells.mnemonicprayer.name=prière mnémotechnique
actors.hero.spells.mnemonicprayer.short_desc=Prolonge les buffs/debuffs sur un allié/ennemi, et les réapplique illuminés.
actors.hero.spells.radiance.desc=Le prêtre éclate en lumière sacrée, étourdissant tous les ennemis visibles pendant 3 tours. Si un ennemi est déjà illuminé, Radiance déclenche le bonus de dégâts d'Illumination, puis applique l'affaiblissement Illumination. L'éclat fait également briller le prêtre pendant 100 tours si l'étage est sombre.
actors.hero.spells.radiance.name=rayonnement
actors.hero.spells.radiance.short_desc=Illumine et étourdit brièvement les ennemis visibles.
actors.hero.spells.recallinscription$useditemtracker.desc=Le clerc a récemment utilisé un objet qui fonctionne avec le sort de rappel inscrit. Le Clerc peut lancer le sort pour répéter l'effet de l'objet.\n\nObjet utilisé : %1$s.\n\nTours restants : %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=rune récemment utilisée
actors.hero.spells.recallinscription.desc=Le clerc utilise la magie sacrée pour relancer l'effet d'une rune magique trouvée sur une pierre runique ou un parchemin qu'il a utilisé au cours des derniers %s tours.\n\nRecall Inscription ne peut pas être utilisé pour reproduire des parchemins d'amélioration. Le coût de ce sort varie en fonction de l'objet utilisé récemment : 2 pour une pierre runique, 3 pour un parchemin, 4 pour un parchemin exotique. Ce coût est également doublé lors de la reproduction d'un parchemin de transmutation ou d'objets d'alchimie qui doivent être fabriqués à l'aide de la transmutation ou de l'amélioration.
actors.hero.spells.recallinscription.name=inscription de rappel
actors.hero.spells.recallinscription.short_desc=Répète une pierre runique ou un parchemin récemment utilisé.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Un mince bouclier de lumière se dresse entre ce personnage et un ennemi. Il n'est pas assez puissant pour bloquer les attaques, mais il les atténue.\n\nTours restants : %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=bouclier de lumière
actors.hero.spells.shieldoflight.desc=Le Clerc crée une fine barrière de lumière entre lui et un ennemi, augmentant la puissance de blocage de son armure contre cet ennemi de %1$d-%2$d pendant 5 tours.\n\nCe sort ne prend pas de temps à lancer, mais ne peut pas être utilisé contre plusieurs cibles simultanément.
actors.hero.spells.shieldoflight.name=bouclier de lumière
actors.hero.spells.shieldoflight.short_desc=Accorde une armure temporaire contre une cible.
actors.hero.spells.smite.desc=Le paladin insuffle à un coup de mêlée une juste puissance destructrice.\n\nEn plus d'infliger des dégâts de mêlée normaux, Smite garantit la réussite des attaques non encombrées, a une puissance d'enchantement de +300%% et inflige un bonus de dégâts magiques de %1$d - %2$d.\n\nLe bonus de dégâts magiques de Smite augmente avec le niveau du paladin, et il inflige toujours le maximum de dégâts magiques contre les morts-vivants ou les démons.
actors.hero.spells.smite.name=frapper
actors.hero.spells.smite.short_desc=Garantit un succès avec un bonus de dégâts et de puissance d'enchantement.
actors.hero.spells.spiritform$spiritformbuff.desc=La forme spirituelle de Trinity vous confère actuellement le pouvoir d'un objet, comme si vous l'aviez équipé.\n\nNotez que la forme spirituelle ne peut pas fournir une autre copie d'un effet dont vous bénéficiez déjà.\n\nEffet actuel : %1$s.\n\nTours restants : %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=forme d'esprit
actors.hero.spells.spiritform.desc=Le clerc choisit un anneau ou un artefact qu'il a identifié lors de cette manche (à l'exception du tome sacré) et en imprègne la Trinité.\n\nSi un anneau est choisi, la Trinité accorde l'effet de cet anneau à +%1$d pendant 20 tours.\n\nSi un artefact est choisi, Trinity reproduit l'effet de cet artefact à +%2$d. Chaque artefact a des comportements spécifiques et des coûts de charge d'armure différents lorsqu'il est utilisé avec Trinity.\n\nCe sort remplace tout autre effet d'esprit dont Trinity est actuellement imprégnée.
actors.hero.spells.spiritform.name=forme d'esprit
actors.hero.spells.spiritform.short_desc=Attribue la Trinité à un anneau ou à un artefact.
actors.hero.spells.stasis$stasisbuff.desc=L'Ecclésiaste a actuellement un allié en stase. Tous les effets positifs de cet allié sont préservés, y compris le pouvoir de la multitude, et il réapparaîtra à côté de l'Ecclésiaste à la fin de l'effet. L'effet peut également être interrompu plus tôt en relançant la Stase.\n\nAllié en stase : %1$s.\nTours restants : %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Votre allié immobile est laissé sur place.
actors.hero.spells.stasis$stasisbuff.name=allié en stase
actors.hero.spells.stasis.desc=L'Ecclésiaste concentre son lien avec son allié vers lui-même, ce qui a pour effet de maintenir temporairement l'allié dans une sorte de stase énergétique à l'intérieur de l'Ecclésiaste. L'allié sera préservé jusqu'à %d tours, tous les effets positifs sur lui n'étant pas affectés par le temps passé en stase.\n\nL'allié apparaîtra à côté de l'Ecclésiaste lorsque la stase prendra fin naturellement, ou bien l'Ecclésiaste peut instantanément relancer le sort sans frais pour mettre fin à l'effet plus tôt que prévu. La stase peut même déplacer les alliés immobiles, mais ne peut pas les transférer d'un étage à l'autre.
actors.hero.spells.stasis.name=stase
actors.hero.spells.stasis.short_desc=Retire l'allié du donjon et le préserve.
actors.hero.spells.sunray.desc=Le Clerc tire un rayon de lumière aveuglante sur une cible, lui infligeant %1$d-%2$d dégâts et l'aveuglant pendant %3$d tours. Le rayon de soleil inflige toujours le maximum de dégâts aux morts-vivants et aux démons.\n\nAprès avoir été frappé par ce sort, la vision de l'ennemi s'ajuste, l'empêchant d'être à nouveau aveuglé par ce sort. Cependant, s'il est à nouveau frappé alors qu'il est aveuglé par ce sort, la lumière est écrasante et le paralyse à la place.
actors.hero.spells.sunray.name=rayon de soleil
actors.hero.spells.sunray.short_desc=Inflige des dégâts magiques à distance et aveugle la cible une fois.
actors.hero.spells.walloflight$lightwall.desc=Des panneaux de lumière scintillante bloquent le passage ici.
actors.hero.spells.walloflight.desc=Le paladin crée un mur fait de panneaux de lumière solide directement devant lui, d'une épaisseur de 1 tuile, d'une largeur de %1$d tuiles et d'une durée de 20 tours.\n\nCe mur agit comme un mur normal, sauf qu'on peut voir à travers. Les ennemis qui sont pris dans le mur lorsqu'il est créé sont momentanément étourdis et repoussés si possible. Tout ce qui est coincé dans le mur peut en sortir.\n\nLe mur peut être lancé dans n'importe laquelle des quatre directions cardinales ou diagonales. Si un mur est déjà actif, le sort peut être réutilisé gratuitement pour le faire disparaître instantanément.
actors.hero.spells.walloflight.early_end=Vous dissipez le mur de lumière.
actors.hero.spells.walloflight.name=mur de lumière
actors.hero.spells.walloflight.short_desc=Crée un mur qui bloque les ennemis.
actors.hero.talent$aggressivebarriercooldown.desc=Vous avez récemment utilisé ce talent et devez attendre avant de l'utiliser à nouveau.\n\nTours restants : %s.
actors.hero.talent$aggressivebarriercooldown.name=temps de recharge de la barrière agressive
actors.hero.talent$combinedlethalityabilitytracker.executed=exécuté
actors.hero.talent$deadlyfollowuptracker.desc=Le duelliste a récemment attaqué un ennemi avec une arme de jet, ses attaques de mêlée contre la même cible auront des dégâts accrus.\n\nTours restants : %s.
actors.hero.talent$deadlyfollowuptracker.name=suivi mortel
actors.hero.talent$followupstriketracker.desc=La chasseresse a récemment attaqué un ennemi avec une arme de jet, sa prochaine attaque de mêlée contre la même cible verra ses dégâts augmentés.\n\nTours restants : %s.
actors.hero.talent$followupstriketracker.name=grève de suivi
