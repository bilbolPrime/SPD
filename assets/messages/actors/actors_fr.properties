actors.char.mob_missed=%1$s a %2$s l'attaque de %3$s
actors.char.out_of_paralysis=La douleur a tiré %s de sa paralysie
actors.char.you_hit=Vous avez frappé %s
actors.char.you_missed=%1$s a %2$s votre attaque
