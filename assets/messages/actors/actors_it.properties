actors.hero.talent$swiftequipcooldown.name=rapido tempo di ricarica dell'equipaggiamento
actors.hero.talent.adventurers_intuition.desc=_+1:_ La Duellante identifica le armi _2,5 volte più velocemente_ e le armature _1,75 volte più velocemente_.\n\n_+2:_ La Duellante identifica le armi _quando le equipaggia_ e le armature _2,5 volte più velocemente_.
actors.hero.talent.adventurers_intuition.title=intuizione dell'avventuriero
actors.hero.talent.aggressive_barrier.desc=_+1:_ La Duellante ottiene _3 scudi_ quando usa un'abilità dell'arma e ha il 50% o meno di salute.\n\n_+2:_ La Duellante ottiene _5 scudi_ quando usa un'abilità dell'arma e ha il 50% o meno di salute.
actors.hero.talent.aggressive_barrier.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, conferirà invece uno scudo quando si effettua un attacco in mischia con poca salute, con un tempo di ricarica di 50 turni.
actors.hero.talent.aggressive_barrier.title=terrorismo aggressivo
actors.hero.talent.ally_warp.desc=_+1:_ Il Mago può selezionare un alleato per scambiarsi istantaneamente di posto con lui, con un raggio di _2 caselle_.\n\n_+2:_ Il Mago può selezionare un alleato per scambiarsi istantaneamente di posto con lui, con un raggio di _4 caselle_.\n\n_+3:_ Il Mago può selezionare un alleato per scambiarsi istantaneamente di posto con lui, con un raggio di _6 caselle_.\n\nIl Mago non può scambiarsi di posto con alleati immobili.
actors.hero.talent.ally_warp.title=distorsione alleata
actors.hero.talent.arcane_vision.desc=_+1:_ Quando il Mago colpisce un nemico con un incantesimo, ottiene la visione mentale su di lui per _10 turni_.\n\n_+2:_ Quando il Mago colpisce un nemico con un incantesimo, ottiene la visione mentale su di lui per _15 turni_.
actors.hero.talent.arcane_vision.title=visione arcana
actors.hero.talent.assassins_reach.desc=_+1:_ Il raggio di teletrasporto dell'Assassino per livello di preparazione è aumentato a _1/3/4/6 caselle_, da 1/2/3/4.\n\n_+2:_ Il raggio di teletrasporto dell'Assassino per livello di preparazione è aumentato a _2/4/6/8 caselle_, da 1/2/3/4.\n\n_+3:_ Il raggio di teletrasporto dell'Assassino per livello di preparazione è aumentato a _2/5/7/10 caselle_, da 1/2/3/4.\n\nQuesto teletrasporto può attraversare pericoli e nemici, ma non terreni solidi come i muri.
actors.hero.talent.assassins_reach.title=portata dell'assassino
actors.hero.talent.aura_of_protection.desc=_+1:_ Il Paladino può lanciare _Aura di Protezione_, un incantesimo che conferisce al Paladino e a tutti gli alleati entro 2 caselle _20% di resistenza ai danni_ e l'effetto del glifo dell'armatura del Paladino a _+50% di potenza_ per 20 turni, al costo di 2 cariche.\n\n_+2:_ Il Paladino può lanciare _Aura di Protezione_, un incantesimo che conferisce al Paladino e a tutti gli alleati entro 2 caselle _30% di resistenza ai danni_ e l'effetto del glifo dell'armatura del Paladino a _+75% di potenza_ per 20 turni, al costo di 2 cariche.\n\n_+3:_ Il Paladino può lanciare _Aura di Protezione_, un incantesimo che conferisce al Paladino e a tutti gli alleati entro 2 caselle _40% di resistenza ai danni_ e l'effetto del glifo dell'armatura del Paladino a +100% di potenza per 20 turni, al costo di 2 cariche.
actors.hero.talent.aura_of_protection.title=aura di protezione
actors.hero.talent.backup_barrier.desc=_+1:_ Il Mago ottiene _3 di scudo_ ogni volta che spende l'ultima carica nel suo bastone.\n\n_+2:_ Il Mago ottiene _5 di scudo_ ogni volta che spende l'ultima carica nel suo bastone.
actors.hero.talent.backup_barrier.meta_desc=Se questo talento viene acquisito da un eroe diverso, si attiverà invece tramite la bacchetta di livello più alto di quell'eroe.
actors.hero.talent.backup_barrier.title=barriera di backup
actors.hero.talent.barkskin.desc=_+1:_ Quando cammina nell'erba, il Guardiano ottiene un'armatura di pelle di corteccia pari allo 0-50% del suo livello, che svanisce a ogni turno.\n\n_+2:_ Quando cammina nell'erba, il Guardiano ottiene un'armatura di pelle di corteccia pari allo 0-100% del suo livello, che svanisce a ogni turno.\n\n_+3:_ Quando cammina nell'erba, il Guardiano ottiene un'armatura di pelle di corteccia pari allo 0-150% del suo livello, che svanisce a ogni turno.
actors.hero.talent.barkskin.title=pelle di corteccia
actors.hero.talent.beaming_ray.desc=Il Chierico può lanciare _Raggio Luminoso_ da un alleato potenziato al costo di 1 carica. Questo raggio può attraversare i muri e teletrasporta l'alleato in una posizione bersaglio. Se in quella posizione si trova un nemico, l'alleato appare accanto al nemico e lo prenderà di mira. Raggio Raggio può persino teletrasportare alleati normalmente immobili, ma ha metà della portata quando lo fa.\n\n_+1:_ Raggio Raggio ha una portata massima di _4 caselle_ e aumenta il bonus di Potere di Molti a _+35% di danni_ contro il nemico più vicino per 10 turni.\n\n_+2:_ Raggio Raggio ha una portata massima di _8 caselle_ e aumenta il bonus di Potere di Molti a _+40% di danni_ contro il nemico più vicino per 10 turni.\n\n_+3:_ Raggio Raggio ha una portata massima di _12 caselle_ e aumenta il bonus di Potere di Molti a _+45% di danni_ contro il nemico più vicino per 10 turni.\n\n_+4:_ Raggio Raggio ha una portata massima di _16 tessere,_ e aumenta il bonus di Potere di Molti a _+50% di danni_ contro il nemico più vicino per 10 turni.
actors.hero.talent.beaming_ray.title=raggio luminoso
actors.hero.talent.blast_radius.desc=_+1:_ Il raggio dell'esplosione elementale è aumentato a _5 caselle_, da 4.\n\n_+2:_ Il raggio dell'esplosione elementale è aumentato a _6 caselle_, da 4.\n\n_+3:_ Il raggio dell'esplosione elementale è aumentato a _7 caselle_, da 4.\n\n_+4:_ Il raggio dell'esplosione elementale è aumentato a _8 caselle_, da 4.
actors.hero.talent.blast_radius.title=raggio d'esplosione
actors.hero.talent.bless.desc=_+1:_ Il Chierico può lanciare _Benedizione_, un incantesimo che garantisce _6 turni di benedizione e 10 di scudo_ se lanciato su se stesso o _10 turni di benedizione e 10 di guarigione_ se lanciato su un altro personaggio, al costo di 1 carica.\n\n_+2:_ Il Chierico può lanciare _Benedizione_, un incantesimo che garantisce _10 turni di benedizione e 15 di scudo_ se lanciato su se stesso o _15 turni di benedizione e 15 di guarigione_ se lanciato su un altro personaggio, al costo di 1 carica.\n\nLa guarigione in eccesso da questo incantesimo viene convertita in scudo.
actors.hero.talent.bless.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, aumenterà invece la precisione e l'elusione dell'eroe e di tutti gli alleati del 3% a +1 o del 5% a +2.
actors.hero.talent.bless.title=benedire
actors.hero.talent.body_form.desc=Il Chierico può lanciare _Forma Corporea_, che infonde in Trinity il potere di un incantesimo o glifo che il Chierico ha identificato in questa partita, al costo di 2 cariche.\n\n_+1:_ Quando Trinity viene utilizzata, il Chierico ottiene l'effetto scelto per _20 turni._\n\n_+2:_ Quando Trinity viene utilizzata, il Chierico ottiene l'effetto scelto per _27 turni._\n\n_+3:_ Quando Trinity viene utilizzata, il Chierico ottiene l'effetto scelto per _33 turni._\n\n_+4:_ Quando Trinity viene utilizzata, il Chierico ottiene l'effetto scelto per _40 turni._\n\n Trinity può essere infusa con un solo effetto corpo alla volta. Il costo di carica dell'armatura di Trinity è maggiore se il glifo scelto è raro e potente.
actors.hero.talent.body_form.title=forma del corpo
actors.hero.talent.body_replacement.desc=_+1:_ Dopo aver sbattuto le palpebre, il Ladro lascia dietro di sé un'esca di legno che ha _20 punti salute e 1-3 armatura_.\n\n_+2:_ Dopo aver sbattuto le palpebre, il Ladro lascia dietro di sé un'esca di legno che ha _40 punti salute e 2-6 armatura_.\n\n_+3:_ Dopo aver sbattuto le palpebre, il Ladro lascia dietro di sé un'esca di legno che ha _60 punti salute e 3-9 armatura_.\n\n_+4:_ Dopo aver sbattuto le palpebre, il Ladro lascia dietro di sé un'esca di legno che ha _80 punti salute e 4-12 armatura_.\n\nSolo un'esca può essere attiva alla volta.
actors.hero.talent.body_replacement.title=sostituzione della carrozzeria
actors.hero.talent.body_slam.desc=_+1:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti subiscono danni pari a _1-4 più il 25%_ della sua capacità di bloccare i danni.\n\n_+2:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti subiscono danni pari a _2-8 più il 50%_ della sua capacità di bloccare i danni.\n\n_+3:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti subiscono danni pari a _3-12 più il 75%_ della sua capacità di bloccare i danni.\n\n_+4:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti subiscono danni pari a _4-16 più il 100%_ della sua capacità di bloccare i danni.
actors.hero.talent.body_slam.title=schianto a terra
actors.hero.talent.bounty_hunter.desc=_+1:_ Quando l'Assassino uccide un nemico con un colpo preparato, la sua probabilità di ottenere un oggetto aumenta del _2/4/8/16%_, per livello di preparazione.\n\n_+2:_ Quando l'Assassino uccide un nemico con un colpo preparato, la sua probabilità di ottenere un oggetto aumenta del _4/8/16/32%_, per livello di preparazione.\n\n_+3:_ Quando l'Assassino uccide un nemico con un colpo preparato, la sua probabilità di ottenere un oggetto aumenta del _6/12/24/48%_, per livello di preparazione.
actors.hero.talent.bounty_hunter.title=cacciatore di taglie
actors.hero.talent.cached_rations.desc=_+1:_ Il Ladro può trovare _2 razioni di rifornimento_ posizionate nei forzieri mentre esplora i prossimi piani del dungeon.\n\n_+2:_ Il Ladro può trovare _3 razioni di rifornimento_ posizionate nei forzieri mentre esplora i prossimi piani del dungeon.\n\nLe razioni di rifornimento vengono consumate rapidamente, ripristinano una quantità moderata di sazietà, curano 5 punti ferita e ripristinano 1 carica al mantello delle ombre.
actors.hero.talent.cached_rations.title=razioni immagazzinate
actors.hero.talent.cleanse.desc=_+1:_ Il Chierico può lanciare _Purificazione_, un incantesimo che _rimuove gli effetti di stato negativi_ dal Chierico e da tutti gli alleati vicini e conferisce loro _10 di scudo_, al costo di 2 cariche.\n\n_+2:_ Il Chierico può lanciare _Purificazione_, un incantesimo che _conferisce 3 turni di immunità agli stati negativi_ al Chierico e a tutti gli alleati vicini e conferisce loro _20 di scudo_, al costo di 2 cariche.\n\n_+3:_ Il Chierico può lanciare _Purificazione_, un incantesimo che _conferisce 5 turni di immunità agli stati negativi_ al Chierico e a tutti gli alleati vicini e conferisce loro _30 di scudo_, al costo di 2 cariche.
actors.hero.talent.cleanse.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, invece, rimuoverà gli effetti di stato negativi sull'eroe dopo aver usato una bacchetta o un artefatto, nel 10/20/30% dei casi con un bonus di +1/+2/+3.
actors.hero.talent.cleanse.title=purificare
actors.hero.talent.cleave.desc=_+1:_ Il tempo extra che il Gladiatore ottiene per un'uccisione è aumentato a _30 turni_, da 15.\n\n_+2:_ Il tempo extra che il Gladiatore ottiene per un'uccisione è aumentato a _45 turni_, da 15.\n\n_+3:_ Il tempo extra che il Gladiatore ottiene per un'uccisione è aumentato a _60 turni_, da 15.
actors.hero.talent.cleave.title=spaccare
actors.hero.talent.cloned_armor.desc=_+1:_ Il clone d'ombra ottiene il 12% del valore dell'armatura dell'eroe e ha una probabilità del 25% di usare il glifo sull'armatura dell'eroe.\n\n_+2:_ Il clone d'ombra ottiene il 24% del valore dell'armatura dell'eroe e ha una probabilità del 50% di usare il glifo sull'armatura dell'eroe.\n\n_+3:_ Il clone d'ombra ottiene il 36% del valore dell'armatura dell'eroe e ha una probabilità del 75% di usare il glifo sull'armatura dell'eroe.\n\n_+4:_ Il clone d'ombra ottiene il 48% del valore dell'armatura dell'eroe e ha una probabilità del 100% di usare il glifo sull'armatura dell'eroe.
actors.hero.talent.cloned_armor.title=armatura clonata
actors.hero.talent.close_the_gap.desc=_+1:_ La Duellante si teletrasporta fino a due caselle verso il suo bersaglio all'inizio di un duello.\n\n_+2:_ La Duellante si teletrasporta fino a tre caselle verso il suo bersaglio all'inizio di un duello.\n\n_+3:_ La Duellante si teletrasporta fino a quattro caselle verso il suo bersaglio all'inizio di un duello.\n\n_+4:_ La Duellante si teletrasporta fino a cinque caselle verso il suo bersaglio all'inizio di un duello.\n\nQuesto teletrasporto può attraversare pericoli e nemici, ma non terreni solidi come i muri. Il teletrasporto viene preso in considerazione quando si determina se un nemico è a portata per essere sfidato.
actors.hero.talent.close_the_gap.title=colmare il divario
actors.hero.talent.combined_energy.desc=_+1:_ Se il Monaco usa un'abilità dell'arma e un'abilità di _4+ energia_ entro 5 turni l'una dall'altra, recupera 1 energia spesa.\n\n_+2:_ Se il Monaco usa un'abilità dell'arma e un'abilità di _3+ energia_ entro 5 turni l'una dall'altra, recupera 1 energia spesa.\n\n_+3:_ Se il Monaco usa un'abilità dell'arma e un'abilità di _2+ energia_ entro 5 turni l'una dall'altra, recupera 1 energia spesa.
actors.hero.talent.combined_energy.title=energia combinata
actors.hero.talent.combined_lethality.desc=_+1:_ Se il Campione attacca con un'arma da mischia subito dopo aver usato l'abilità di un'arma diversa, quell'attacco eliminerà qualsiasi nemico non boss rimasto con _meno del 13% di HP_.\n\n_+2:_ Se il Campione attacca con un'arma da mischia subito dopo aver usato l'abilità di un'arma diversa, quell'attacco eliminerà qualsiasi nemico non boss rimasto con _meno del 27% di HP_.\n\n_+3:_ Se il Campione attacca con un'arma da mischia subito dopo aver usato l'abilità di un'arma diversa, quell'attacco eliminerà qualsiasi nemico non boss rimasto con _meno del 40% di HP_.\n\nQuesto attacco può essere un normale attacco con un'arma da mischia o parte di un'abilità dell'arma.
actors.hero.talent.combined_lethality.title=letalità combinata
actors.hero.talent.conserved_magic.desc=_+1:_ Ogni scarica di magia selvaggia ora usa _0,33 cariche_ invece di 0,5 e la magia selvaggia ha una probabilità del _25%_ di non spendere un turno.\n\n_+2:_ Ogni scarica di magia selvaggia ora usa _0,225 cariche_ invece di 0,5 e la magia selvaggia ha una probabilità del _50%_ di non spendere un turno.\n\n_+3:_ Ogni scarica di magia selvaggia ora usa _0,15 cariche_ invece di 0,5 e la magia selvaggia ha una probabilità del _75%_ di non spendere un turno.\n\n_+4:_ Ogni scarica di magia selvaggia ora usa _0,1 cariche_ invece di 0,5 e la magia selvaggia ha una probabilità del _100%_ di non spendere un turno.
actors.hero.talent.conserved_magic.title=magia conservata
actors.hero.talent.counter_ability.desc=_+1:_ Se il Duellante usa un'abilità dell'arma entro 3 turni dall'attacco alla sua immagine residua, recupererà istantaneamente _0,38 cariche_.\n\n_+2:_ Se il Duellante usa un'abilità dell'arma entro 3 turni dall'attacco alla sua immagine residua, recupererà istantaneamente _0,77 cariche_.\n\n_+3:_ Se il Duellante usa un'abilità dell'arma entro 3 turni dall'attacco alla sua immagine residua, recupererà istantaneamente _1,13 cariche_.\n\n_+4:_ Se il Duellante usa un'abilità dell'arma entro 3 turni dall'attacco alla sua immagine residua, recupererà istantaneamente _1,5 cariche_.
actors.hero.talent.counter_ability.title=capacità di contrasto
actors.hero.talent.deadly_followup.desc=_+1:_ Quando il Duellante colpisce un nemico con un'arma da lancio, gli infliggerà il 10% di danni da mischia in più per 5 turni.\n\n_+2:_ Quando il Duellante colpisce un nemico con un'arma da lancio, gli infliggerà il 20% di danni da mischia in più per 5 turni.\n\n_+3:_ Quando il Duellante colpisce un nemico con un'arma da lancio, gli infliggerà il 30% di danni da mischia in più per 5 turni.
actors.hero.talent.deadly_followup.title=seguito mortale
actors.hero.talent.deathless_fury.desc=_+1:_ Berserk si attiva automaticamente se il Berserker sta per morire e la rabbia è pari o superiore al 100%, ma ha un tempo di ricarica di _3 livelli eroe_ quando ciò accade.\n\n_+2:_ Berserk si attiva automaticamente se il Berserker sta per morire e la rabbia è pari o superiore al 100%, ma ha un tempo di ricarica di _2 livelli eroe_ quando ciò accade.\n\n_+3:_ Berserk si attiva automaticamente se il Berserker sta per morire e la rabbia è pari o superiore al 100%, ma ha un tempo di ricarica di _1 livello eroe_ quando ciò accade.\n\nNota che il Berserker morirà comunque se ha 0 HP quando il berserking termina.
actors.hero.talent.deathless_fury.title=furia immortale
actors.hero.talent.deathly_durability.desc=_+1:_ I nemici uccisi dal marchio della morte conferiscono al Ladro uno scudo pari al 13% dei loro punti vita quando sono stati marchiati.\n\n_+2:_ I nemici uccisi dal marchio della morte conferiscono al Ladro uno scudo pari al 25% dei loro punti vita quando sono stati marchiati.\n\n_+3:_ I nemici uccisi dal marchio della morte conferiscono al Ladro uno scudo pari al 38% dei loro punti vita quando sono stati marchiati.\n\n_+4:_ I nemici uccisi dal marchio della morte conferiscono al Ladro uno scudo pari al 50% dei loro punti vita quando sono stati marchiati.
actors.hero.talent.deathly_durability.title=resistenza mortale
actors.hero.talent.desperate_power.desc=_+1:_ Le bacchette e il bastone del mago ottengono _+1 livello_ con il loro ultimo attacco quando sono quasi alla fine della loro carica.\n\n_+2:_ Le bacchette e il bastone del mago ottengono _+2 livelli_ con il loro ultimo attacco quando sono quasi alla fine della loro carica.\n\n_+3:_ Le bacchette e il bastone del mago ottengono _+3 livelli_ con il loro ultimo attacco quando sono quasi alla fine della loro carica.
actors.hero.talent.desperate_power.title=potere disperato
actors.hero.talent.directed_power.desc=_+1:_ L'attacco diretto di colpo elementale ottiene _+30% di potenza di incantamento_ per ogni nemico nel raggio d'azione dell'effetto di colpo elementale, incluso il bersaglio dell'attacco.\n\n_+2:_ L'attacco diretto di colpo elementale ottiene _+60% di potenza di incantamento_ per ogni nemico nel raggio d'azione dell'effetto di colpo elementale, incluso il bersaglio dell'attacco.\n\n_+3:_ L'attacco diretto di colpo elementale ottiene _+90% di potenza di incantamento_ per ogni nemico nel raggio d'azione dell'effetto di colpo elementale, incluso il bersaglio dell'attacco.\n\n_+4:_ L'attacco diretto di colpo elementale ottiene _+120% di potenza di incantamento_ per ogni nemico nel raggio d'azione dell'effetto di colpo elementale, incluso il bersaglio dell'attacco.
actors.hero.talent.directed_power.title=potenza diretta
actors.hero.talent.divine_intervention.desc=_+1:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Intervento Divino_, che potenzia il Chierico e tutti gli alleati fino a _150 di scudo_ ed estende la Forma Ascesa di _3 turni._\n\n_+2:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Intervento Divino_, che potenzia il Chierico e tutti gli alleati fino a _200 di scudo_ ed estende la Forma Ascesa di _4 turni._\n\n_+3:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Intervento Divino_, che potenzia il Chierico e tutti gli alleati fino a _250 di scudo_ ed estende la Forma Ascesa di _5 turni._\n\n_+4:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Intervento Divino_, che potenzia il Chierico e tutti gli alleati fino a _300 di scudo_ ed estende la Forma Ascesa di _6 turni._\n\nIntervento Divino costa ben 5 cariche del tomo e può essere lanciato solo una volta nella stessa forma ascesa.
actors.hero.talent.divine_intervention.title=intervento divino
actors.hero.talent.divine_sense.desc=_+1:_ Il Chierico può lanciare _Senso Divino_, un incantesimo che gli conferisce _8 tessere_ di Visione Mentale per 50 turni e non richiede tempo per essere lanciato, al costo di 2 cariche.\n\n_+2:_ Il Chierico può lanciare _Senso Divino_, un incantesimo che gli conferisce _12 tessere_ di Visione Mentale per 50 turni e non richiede tempo per essere lanciato, al costo di 2 cariche.
actors.hero.talent.divine_sense.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, gli conferirà invece la visione mentale per un breve istante dopo aver usato una bacchetta o un artefatto con un raggio di 3 caselle a +1 o 5 caselle a +2.
actors.hero.talent.divine_sense.title=senso divino
actors.hero.talent.double_jump.desc=_+1:_ Se il Guerriero esegue un secondo salto entro 3 turni, quel salto ha un costo di carica ridotto del 16%.\n\n_+2:_ Se il Guerriero esegue un secondo salto entro 3 turni, quel salto ha un costo di carica ridotto del 30%.\n\n_+3:_ Se il Guerriero esegue un secondo salto entro 3 turni, quel salto ha un costo di carica ridotto del 40%.\n\n_+4:_ Se il Guerriero esegue un secondo salto entro 3 turni, quel salto ha un costo di carica ridotto del 50%.
actors.hero.talent.double_jump.title=doppio salto
actors.hero.talent.double_mark.desc=_+1:_ Contrassegnare un secondo bersaglio contemporaneamente al primo ha un costo di carica ridotto del 30%.\n\n_+2:_ Contrassegnare un secondo bersaglio contemporaneamente al primo ha un costo di carica ridotto del 50%.\n\n_+3:_ Contrassegnare un secondo bersaglio contemporaneamente al primo ha un costo di carica ridotto del 65%.\n\n_+4:_ Contrassegnare un secondo bersaglio contemporaneamente al primo ha un costo di carica ridotto del 75%.
actors.hero.talent.double_mark.title=doppio segno
actors.hero.talent.durable_projectiles.desc=_+1:_ Le armi da lancio hanno _+50% di durabilità_ quando usate dalla Cacciatrice.\n\n_+2:_ Le armi da lancio hanno _+75% di durabilità_ quando usate dalla Cacciatrice.
actors.hero.talent.durable_projectiles.title=proiettili resistenti
actors.hero.talent.durable_tips.desc=_+1:_ I dardi con la punta hanno una durata doppia quando il Guardiano li usa.\n\n_+2:_ I dardi con la punta hanno una durata tripla quando il Guardiano li usa.\n\n_+3:_ I dardi con la punta hanno una durata quadrupla quando il Guardiano li usa.
actors.hero.talent.durable_tips.title=punte resistenti
