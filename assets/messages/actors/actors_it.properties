actors.mobs.elemental.desc=Gli elementali del fuoco erranti sono un effetto collaterale dell'evocazione di entità superiori. La loro natura è troppo caotica perché anche il più potente demonologo possa controllarli.
actors.mobs.elemental.name=elementale del fuoco
actors.mobs.king.desc=L'ultimo re dei nani conosceva a fondo i segreti della vita e della morte. Convinse i membri della sua corte a partecipare a un rituale che avrebbe dovuto donare loro l'eterna giovinezza. Alla fine la ottenne solo lui, insieme a un esercito di non morti.
actors.mobs.king.name=Re dei Nani
actors.mobs.npcs.bee.desc=Nonostante le piccole dimensioni, le api dorate difendono ferocemente il loro padrone. Non vivono a lungo, però.
actors.mobs.npcs.bee.name=ape dorata
actors.mobs.shielded.desc=I bruti sono gli gnoll più grandi, forti e resistenti. Quando vengono feriti gravemente, vanno su tutte le furie e infliggono ancora più danni ai nemici.
actors.mobs.shielded.name=Bruto corazzato
actors.mobs.yog.desc=Yog-Dzewa è un Antico Dio, una potente entità proveniente dai reami del caos. Un secolo fa, gli antichi nani vinsero a fatica la guerra contro il suo esercito di demoni, ma non riuscirono a uccidere il dio stesso. Lo imprigionarono quindi nelle sale sotterranee della loro città, credendolo troppo debole per risorgere mai più.
actors.mobs.yog.name=Yog-Dzewa
actors.mobs.bandit.carries=%s sta trasportando un _%s_. Ovviamente rubato.
actors.buffs.armorevasion.name=Evasione aumentata
actors.mobs.king.defeated=Non puoi uccidermi, %s... Io sono... immortale...
