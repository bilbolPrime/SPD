actors.blobs.blizzard.desc=Qui si sta scatenando una bufera di neve.
actors.blobs.blizzard.name=bufera di neve
actors.blobs.confusiongas.desc=Qui si sta formando una nube di gas che crea confusione.
actors.blobs.confusiongas.name=gas di confusione
actors.blobs.corrosivegas.desc=Qui si sta formando una nube di gas caustico letale.
actors.blobs.corrosivegas.name=gas corrosivo
actors.blobs.electricity.desc=Qui si sta formando un campo elettrico che scintilla intensamente.
actors.blobs.electricity.name=elettricità
actors.blobs.electricity.ondeath=Sei rimasto scioccato a morte...
actors.blobs.electricity.rankings_desc=Elettrocuto
actors.blobs.fire.desc=Qui sta divampando un incendio.
actors.blobs.fire.name=fuoco
actors.blobs.foliage.desc=Raggi di luce squarciano l'oscurità del giardino sotterraneo.
actors.blobs.foliage.name=fogliame
actors.blobs.freezing.desc=Qui l'aria è insolitamente gelida.
actors.blobs.freezing.name=aria gelida
actors.blobs.goowarn.desc=Qui brulicano particelle di energia oscura!
actors.blobs.goowarn.name=energia oscura
actors.blobs.inferno.desc=Qui infuria un inferno.
actors.blobs.inferno.name=inferno
actors.blobs.paralyticgas.desc=Qui si sta formando una nube di gas paralizzante.
actors.blobs.paralyticgas.name=gas paralizzante
actors.blobs.regrowth.name=ricrescita
actors.blobs.sacrificialfire.desc=Qui si trova un altare con un fuoco sacrificale che arde sopra. Qualsiasi creatura uccisa qui verrà consumata come offerta agli spiriti del dungeon. Forse verrà data una ricompensa se verranno fatti abbastanza sacrifici?
actors.blobs.sacrificialfire.name=fuoco sacrificale
actors.blobs.sacrificialfire.reward=Il fuoco divampa e poi si dissipa, lasciando dietro di sé una ricompensa!
actors.blobs.sacrificialfire.unworthy=Il fuoco consuma la tua offerta, ma non la trasforma.
actors.blobs.sacrificialfire.worthy=Il fuoco consuma la tua offerta e si fa più intenso.
actors.blobs.smokescreen.desc=Qui si alza una densa nuvola di fumo nero.
actors.blobs.smokescreen.name=cortina fumogena
actors.blobs.stenchgas.desc=Qui aleggia una nube di fetido odore.
actors.blobs.stenchgas.name=gas fetido
actors.blobs.stormcloud.desc=Qui si sta formando un vortice di nuvola di vapore acqueo.
actors.blobs.stormcloud.name=nuvole temporalesche
actors.blobs.toxicgas.desc=Qui si sta alzando una nube verdastra di gas tossico.
actors.blobs.toxicgas.name=gas tossico
actors.blobs.toxicgas.ondeath=Sei morto a causa del gas tossico...
actors.blobs.toxicgas.rankings_desc=Soffocato
actors.blobs.waterofawareness.desc=Il potere della conoscenza si irradia dall'acqua di questo pozzo. Bevendo da questo pozzo potrai identificare completamente tutti gli oggetti equipaggiati, individuare le maledizioni su tutti gli oggetti nel tuo inventario e rivelare tutti gli oggetti presenti sul piano attuale.
actors.blobs.waterofawareness.name=acqua delle consapevolezza
actors.blobs.waterofawareness.procced=Mentre sorseggi, senti la conoscenza affluire nella tua mente.
actors.blobs.waterofhealth.desc=Da quest'acqua emana un'aura di salute. Bere da questa sorgente guarirà le tue ferite, placherà la fame e allontanerà le maledizioni dagli oggetti usurati.
actors.blobs.waterofhealth.name=acqua della salute
actors.blobs.waterofhealth.procced=Mentre ne bevi un sorso, senti le tue ferite guarire completamente.
actors.blobs.web.desc=Una fitta ragnatela ricopre ogni cosa qui. Qualsiasi cosa tocchi o venga lanciata attraverso la ragnatela la spezzerà, ma rimarrà anche intrappolata al suo interno.
actors.blobs.web.name=ragnatela
actors.buffs.adrenaline.desc=Un'ondata di potenza fisica, l'adrenalina ha potenziato sia l'attacco che la velocità di movimento.\n\nL'adrenalina permette al bersaglio di correre a velocità doppia e di attaccare a velocità 1,5 volte superiore.\n\nTurni rimanenti: %s.
actors.buffs.adrenaline.name=adrenalina
actors.buffs.adrenalinesurge.desc=Un'ondata di grande potenza, ma purtroppo non permanente.\n\nAumento di forza: +%d.\nGira finché l'aumento di forza non si indebolisce: %s.
actors.buffs.adrenalinesurge.name=aumento di forza
actors.buffs.amok.desc=Amok provoca uno stato di grande rabbia e confusione nel suo bersaglio.\n\nQuando una creatura è in preda all'amok, attaccherà qualsiasi cosa le sia vicina, che sia amica o nemica.\n\nTurni di amok rimanenti: %s.
actors.buffs.amok.name=mok
actors.buffs.arcanearmor.desc=Un sottile scudo ti circonda, bloccando parte del danno degli attacchi magici. La tua armatura magica è attualmente potenziata da: 0-%d. Si attiva finché l'armatura arcana non si indebolisce: %s.
actors.buffs.arcanearmor.name=armatura arcana
actors.buffs.artifactrecharge.desc=L'energia scorre in te, aumentando la velocità di ricarica dei tuoi artefatti equipaggiati. Ogni artefatto è influenzato in modo leggermente diverso, ma tutti si caricheranno molto più velocemente del normale. Turni rimanenti: %s.
actors.buffs.artifactrecharge.name=ricarica dell'artefatto
actors.buffs.ascensionchallenge.almost=Senti la presa di Yog sull'amuleto iniziare ad indebolirsi, ci sei quasi!
actors.buffs.ascensionchallenge.beckon=L'amuleto inizia a richiamare i nemici lontani.
actors.buffs.ascensionchallenge.break=Ti prendi un attimo per riprendere fiato e senti le tue ferite iniziare a rimarginarsi!
actors.buffs.ascensionchallenge.damage=L'amuleto inizia a irradiare energia oscura. Brucia!
actors.buffs.ascensionchallenge.desc=In qualche modo Yog-Dzewa mantiene la sua influenza su questo mondo attraverso l'amuleto e sta cercando di fermare la tua ascesa! Il potere di Yog sta rendendo il dungeon molto più pericoloso, aumentando il numero di nemici e rendendoli più forti! Questo potere continuerà ad aumentare se non viene controllato, può essere indebolito sconfiggendo i nemici che sono stati potenziati dal potere di Yog.
actors.buffs.ascensionchallenge.desc_beckon=L'amuleto sta attualmente richiamando i nemici lontani, avvertendoli della tua posizione.
actors.buffs.ascensionchallenge.desc_clear=L'energia oscura che emana dall'amuleto è stata indebolita il più possibile, almeno per ora.
actors.buffs.ascensionchallenge.desc_damage=L'energia dell'amuleto è diventata così forte che ti sta danneggiando direttamente!
actors.buffs.ascensionchallenge.desc_haste=L'amuleto sta attualmente _accelerando i nemici lontani_, permettendo loro di raggiungerti più velocemente!
actors.buffs.ascensionchallenge.desc_slow=L'amuleto al momento ti sta rallentando e annullando gli effetti di aumento della velocità!
actors.buffs.ascensionchallenge.haste=L'amuleto inizia ad attirare i nemici lontani!
actors.buffs.ascensionchallenge.name=la maledizione dell'amuleto
actors.buffs.ascensionchallenge.on_kill=L'energia oscura ti consuma...
actors.buffs.ascensionchallenge.slow=L'amuleto inizia a sembrare un peso morto nel tuo inventario!
actors.buffs.ascensionchallenge.weaken=Puoi percepire che la maledizione dell'amuleto si sta leggermente indebolindo.
actors.buffs.ascensionchallenge.weaken_info=La maledizione dell'amuleto può essere attenuata sconfiggendo più nemici.
actors.buffs.ascensionchallenge.weaken_info_no_kills=Se sconfiggi i nemici, la maledizione dell'amuleto si indebolirà!
actors.buffs.barkskin.desc=La tua pelle è indurita, è ruvida e solida come la corteccia. La pelle indurita aumenta la tua armatura effettiva, permettendoti di difenderti meglio dagli attacchi fisici. La tua armatura è attualmente aumentata di: 0-%d. Turni necessari affinché la pelle di corteccia si indebolisca: %s. Se ricevi pelle di corteccia da più fonti, verrà applicata solo quella più forte.
actors.buffs.barkskin.name=pelle di corteccia
actors.buffs.barrier.desc=Una resistente bolla di forza che blocca ogni danno. La barriera subirà danni per qualsiasi cosa stia proteggendo finché rimarrà uno scudo attivo. Lo scudo si deteriorerà anche lentamente nel tempo. Scudo rimanente: %d.
actors.buffs.barrier.name=barriera
actors.buffs.berserk.action_name=Berserk
actors.buffs.berserk.angered=arrabbiato
actors.buffs.berserk.angered_desc=La gravità delle ferite del Berserker rafforza i suoi colpi. Man mano che il Berserker subisce danni fisici, la sua furia aumenta, garantendogli danni bonus. I danni bloccati dall'armatura contribuiscono comunque ad aumentare la furia. La furia si affievolisce nel tempo. Minore è la salute del Berserker, più a lungo durerà. A 100 di furia, il Berserker può andare in berserk, ottenendo uno scudo in base al livello della sua armatura e alla sua salute mancante. Mentre è in preda alla furia, il suo scudo si deteriora nel tempo e una volta esaurito dovrà riposare prima di poter accumulare nuovamente rabbia.\n\nRabbia attuale: _%1$.0f%%_\n_+%2$.0f%%_ danni\n\nScudo in preda alla furia con armatura e HP attuali: _%3$d_
actors.buffs.berserk.berserk=furia berserker
actors.buffs.berserk.berserk_desc=La paura e l'incertezza svaniscono, lasciando solo la rabbia. In questo stato il Berserker è estremamente potente, infliggendo +50%% danni e ottenendo scudi bonus, ma perdendo anche scudi a ogni turno.\n\nQuando tutti i suoi scudi saranno ridotti a 0, la furia finirà.\n\nDopo la furia, il Berserker avrà bisogno di recuperare prima di poter accumulare di nuovo rabbia.\n\nScudo rimanente: %d
actors.buffs.berserk.exhausted=esausto
actors.buffs.berserk.no_seal=Hai bisogno del tuo sigillo rotto per andare in berserk!
actors.buffs.berserk.rankings_desc=Morto in preda alla furia
actors.buffs.berserk.recovering=in fase di recupero
actors.buffs.berserk.recovering_desc=La forza interiore ha i suoi limiti. Il Berserker deve riposare prima di usare di nuovo la sua furia. Mentre si riprende, il Berserker non accumula furia subendo danni.
actors.buffs.berserk.recovering_desc_levels=Livelli fino al recupero: _%.2f_
actors.buffs.berserk.recovering_desc_turns=Gira fino al recupero: _%d_
actors.buffs.bleeding.desc=Quella ferita sta perdendo una quantità preoccupante di sangue.\n\nIl sanguinamento causa danni a ogni turno. Ad ogni turno il danno diminuisce di una quantità casuale, finché il sanguinamento non si ferma.\n\nDanno da sanguinamento attuale: %d.
actors.buffs.bleeding.heromsg=Stai sanguinando!
actors.buffs.bleeding.name=sanguinamento
actors.buffs.bleeding.ondeath=Sei morto dissanguato...
actors.buffs.bleeding.rankings_desc=Morto dissanguato
actors.buffs.bless.desc=Una grande esplosione di concentrazione, alcuni dicono che sia ispirata dagli dei. La benedizione aumenta la precisione e l'evasione del 25%, rendendo il benedetto molto più efficace in combattimento. Turni di benedizione rimanenti: 1ZXQ.
actors.buffs.bless.name=benedetto
actors.buffs.blindness.desc=L'accecamento trasforma il mondo circostante in una foschia oscura. Quando è accecato, il raggio visivo di un personaggio si riduce a una casella, rendendo inutili gli attacchi a distanza e rendendo molto facile perdere di vista i nemici lontani. Inoltre, un eroe accecato non è in grado di leggere pergamene o libri. Turni di cecità rimanenti: %s.
actors.buffs.blindness.heromsg=Sei cieco!
actors.buffs.blindness.name=accecato
actors.buffs.blobimmunity.desc=Una strana forza ti sta avvolgendo in una sottile barriera protettiva, bloccando tutti gli effetti nocivi presenti nell'aria.\n\nSei immune a tutti gli effetti ad area finché dura questa barriera.\n\nTurni di immunità rimanenti: %s.
actors.buffs.blobimmunity.name=barriera di purificazione
actors.buffs.burning.burnsup=%s brucia!
actors.buffs.burning.desc=Poche cose sono più angoscianti dell'essere avvolti dalle fiamme. Il fuoco infliggerà danni a ogni turno finché non verrà spento dall'acqua o non si estinguerà. Il fuoco può essere spento entrando in acqua o con lo schizzo di una pozione frantumante. Inoltre, il fuoco potrebbe incendiare terreni o oggetti infiammabili con cui entra in contatto. Turni di fuoco rimanenti: 0.
actors.buffs.burning.heromsg=Prendi fuoco!
actors.buffs.burning.name=bruciando
actors.buffs.burning.ondeath=Sei morto bruciato...
actors.buffs.burning.rankings_desc=Ridotto in cenere
actors.buffs.championenemy$antimagic.desc=I campioni antimagia subiscono il 50% di danni in meno e sono completamente immuni agli effetti magici.
actors.buffs.championenemy$antimagic.name=Campione antimagia
actors.buffs.championenemy$blazing.desc=I campioni fiammeggianti infliggono il 25% di danni in più negli attacchi in mischia, incendiano i nemici che attaccano, sono immuni al fuoco e diffondono fiamme intorno a sé quando muoiono. Non possono però propagare il fuoco sull'acqua.
actors.buffs.championenemy$blazing.name=campione fiammeggiante
actors.buffs.championenemy$blessed.desc=I campioni benedetti hanno precisione e schivata quadruplicate.
actors.buffs.championenemy$blessed.name=campione benedetto
actors.buffs.championenemy$giant.desc=I campioni giganti subiscono l'80% di danni in meno e hanno +1 di raggio d'attacco, ma non possono attraversare spazi chiusi.
actors.buffs.championenemy$giant.name=campione gigante
actors.buffs.championenemy$growing.desc=I campioni in crescita ottengono un bonus in costante aumento a precisione, elusione, danni fisici e una riduzione dei danni subiti.\n\nBonus attuale di precisione/elusione/danni: %1$d%%\nRiduzione attuale dei danni: %2$d%%
actors.buffs.championenemy$growing.name=campione in crescita
actors.buffs.championenemy$projecting.desc=I campioni che proiettano infliggono il 25% di danni in mischia in più e hanno +3 di raggio d'attacco.
actors.buffs.championenemy$projecting.name=campione proiettato
actors.buffs.championenemy.warn=Avverti una presenza letale.
actors.buffs.charm.cant_attack=Sei ammaliato da quel nemico e non puoi attaccarlo.
actors.buffs.charm.desc=Un incantesimo è una magia manipolativa che può far sì che i nemici si adorino temporaneamente. I personaggi influenzati dall'incantesimo non possono attaccare direttamente il nemico da cui sono stati influenzati. Attaccare altri bersagli è comunque possibile. Lo shock del dolore ridurrà la durata dell'incantesimo. Turni rimanenti dell'incantesimo: 0.
actors.buffs.charm.heromsg=Sei incantato!
actors.buffs.charm.name=Ammaliato
actors.buffs.chill.desc=Non del tutto congelato, ma ancora troppo freddo.\n\nI bersagli raffreddati eseguono tutte le azioni più lentamente, a seconda di quanti turni rimangono nell'effetto. Nel peggiore dei casi, questo equivale a essere rallentati.\n\nTurni di raffreddamento rimanenti: %1$s.\nLa velocità è ridotta di: %2$s%%
actors.buffs.chill.freezes=%s si blocca!
actors.buffs.chill.name=refrigerato
actors.buffs.combo$combomove.clobber.desc=Respinge un nemico di 2 caselle, ma non infligge danni e non può farlo cadere nelle fosse. Incrementa la combo di 1.
actors.buffs.combo$combomove.clobber.empower_desc=Respinge un nemico di 3 caselle, gli provoca vertigini e può farlo cadere nei burroni, ma non infligge danni. Incrementa la combo di 1.
actors.buffs.combo$combomove.clobber.name=colpire
actors.buffs.combo$combomove.crush.desc=Infligge %d%% (combo*25%%) danni al bersaglio principale e metà di tali danni a tutti gli altri nemici in un'area 7x7. Reimposta la combo quando viene utilizzata.
actors.buffs.combo$combomove.crush.empower_desc=_Salta fino a %1$d caselle_ e infligge %2$d%% (combo*25%%) danni al bersaglio principale e metà di quei danni a tutti gli altri nemici in un'area 7x7. Reimposta la combo quando viene utilizzata.
actors.buffs.combo$combomove.crush.name=schiacciare
actors.buffs.combo$combomove.fury.desc=Colpisce un nemico una volta per ogni combo attiva, ogni colpo infligge il 60% di danni e può attivare incantesimi. Reimposta la combo quando viene utilizzata.
actors.buffs.combo$combomove.fury.empower_desc=_Salta fino alla/e casella/e %d_ e colpisce un nemico una volta per ogni combo che hai, ogni colpo infligge 60%% danni e può attivare incantesimi. Reimposta la combo quando viene utilizzata.
actors.buffs.combo$combomove.fury.name=furia
actors.buffs.combo$combomove.parry.desc=Blocca l'attacco successivo entro 1 turno quando attivato e contrattacca immediatamente. Reimposta la combo se non viene parato nulla.
actors.buffs.combo$combomove.parry.empower_desc=Blocca tutti gli attacchi entro 1 turno quando attivato e contrattacca immediatamente. Reimposta la combo se non viene parato nulla.
actors.buffs.combo$combomove.parry.name=parare
actors.buffs.combo$combomove.slam.desc=Infligge %d%% (combo*20%%) della tua capacità di bloccare i danni come danno bonus. Reimposta la combo quando viene utilizzato.
actors.buffs.combo$combomove.slam.empower_desc=_Salta fino alla/e casella/e %1$d_ e infligge %2$d%% (combo*20%%) del tuo potere di blocco danni come danno bonus. Reimposta la combo quando viene utilizzato.
actors.buffs.combo$combomove.slam.name=sbattere
actors.buffs.combo.action_name=attacco combinato
actors.buffs.combo.bad_target=Devi prendere di mira un nemico che si trovi nel raggio d'attacco.
actors.buffs.combo.combo=%d ha colpito la combo!
actors.buffs.combo.desc=Il gladiatore accumula slancio man mano che mette a segno colpi efficaci. Ogni attacco aumenta il contatore combo di uno, ma impiegare troppo tempo tra un colpo e l'altro azzera il contatore combo. Finché il gladiatore ha una combo attiva, lo scudo che ha ottenuto dal suo sigillo rotto non inizia a svanire. Accumulare combo sblocca attacchi combo speciali che non possono fallire! Un attacco diverso viene sbloccato al conteggio di 2, 4, 6, 8 e 10 combo. Alcune mosse azzerano la combo e altre no, ma ogni mossa può essere usata solo una volta per sessione di combo. Combo attuale: %1$d.\n\nTurni fino alla perdita della combo: %2$s.
actors.buffs.combo.name=combinazione
actors.buffs.combo.prompt=Seleziona un bersaglio da attaccare.
actors.buffs.corrosion.desc=Un acido potente scioglie carne, metallo e ossa a una velocità allarmante. Il danno da corrosione aumenta nel tempo, man mano che il bersaglio continua a sciogliersi. Giri di corrosione rimanenti: %1$s. Danno da corrosione attuale: %2$d.
actors.buffs.corrosion.heromsg=Ti stai sciogliendo!
actors.buffs.corrosion.name=corrosione
actors.buffs.corrosion.ondeath=Ti sciogli...
actors.buffs.corrosion.rankings_desc=Disciolto
actors.buffs.corruption.desc=La corruzione si insinua nell'essenza di un essere, distorcendolo contro la sua natura originaria. Le creature corrotte attaccheranno i loro alleati e ignoreranno i loro ex nemici. La corruzione è anche dannosa e porterà lentamente il suo bersaglio a soccombere. La corruzione è permanente, i suoi effetti terminano solo con la morte.
actors.buffs.corruption.name=corrotto
actors.buffs.cripple.desc=Sei abbastanza sicuro che le gambe non siano fatte per piegarsi in quel modo.\n\nLa metà della velocità di movimento è storpiata, quindi spostare una tessera richiede solitamente due turni invece di uno.\n\nTurni rimanenti di storpiatura: %s.
actors.buffs.cripple.heromsg=Sei invalido!
actors.buffs.cripple.name=storpio
actors.buffs.daze.desc=Il ronzio alle orecchie e la vista offuscata rendono difficile combattere. Mentre sei stordito, la precisione e l'evasione sono ridotte del 50%, rendendo molto più difficile sia colpire che schivare i colpi. Turni di stordimento rimanenti: 1.
actors.buffs.daze.heromsg=Sei stordito!
actors.buffs.daze.name=stordito
actors.buffs.degrade.desc=Una potente magia oscura sta prosciugando la forza che le pergamene di potenziamento hanno applicato al tuo equipaggiamento!\n\nMentre è degradato, l'equipaggiamento potenziato verrà trattato come se fosse di un livello inferiore a quello effettivo. _Ogni potenziamento dopo +3 diventa esponenzialmente più debole del precedente._ Le descrizioni dei tuoi oggetti cambieranno per riflettere il loro livello di potenza ridotto.\n\nIl degradamento non influisce sui requisiti di forza, sulle cariche della bacchetta, sulla durabilità delle armi da lancio o sugli artefatti.\n\nTurni di degradazione rimanenti: %s. L'utilizzo di una pergamena di potenziamento o di rimozione della maledizione terminerà immediatamente il degradamento.
actors.buffs.degrade.heromsg=La tua attrezzatura sembra più debole!
actors.buffs.degrade.name=degradato
actors.buffs.doom.desc=È difficile andare avanti quando sembra che l'universo ti voglia morto. I personaggi condannati riceveranno il 67% di danni in più da tutte le fonti. La condanna è permanente, i suoi effetti terminano solo con la morte.
actors.buffs.doom.name=condannato
actors.buffs.dread.desc=Un terrore così grande da far fuggire completamente il bersaglio dal dungeon!\n\nLe creature colpite dal terrore fuggiranno dal loro avversario ad alta velocità e scompariranno completamente dal dungeon una volta fuori dalla vista. I nemici sconfitti in questo modo conferiscono metà dell'esperienza e non rilasciano oggetti. Lo shock del dolore diminuirà la durata del terrore.\n\nTurni di terrore rimanenti: %d.
actors.buffs.dread.name=paura
actors.buffs.drowsy.desc=Una forza magica rende difficile rimanere svegli, dopo alcuni turni, il bersaglio cadrà in un profondo sonno magico.\n\nL'eroe può resistere alla sonnolenza subendo danni o essendo in piena salute.\n\nTurni fino al sonno: %s.
actors.buffs.drowsy.name=sonnolento
actors.buffs.earthimbue.desc=Sei infuso del potere della terra!\n\nTutti gli attacchi fisici sposteranno la terra sotto il nemico, paralizzandolo per un breve periodo.\n\nTurni di infusione di terra rimanenti: %s.
actors.buffs.earthimbue.name=intriso di terra
actors.buffs.enhancedrings.desc=L'artefatto usato di recente dal Ladro sta potenziando i suoi anelli, conferendo loro +1 livello.\n\nTurni rimanenti: %s.
actors.buffs.enhancedrings.name=anelli potenziati
actors.buffs.fireimbue.desc=Sei infuso del potere del fuoco!\n\nTutti gli attacchi fisici avranno una probabilità di incendiare i nemici. Inoltre, sei completamente immune agli effetti del fuoco.\n\nTurni di infusione di fuoco rimanenti: %s.
actors.buffs.fireimbue.name=intriso di fuoco
actors.buffs.foresight.desc=In qualche modo sei in grado di vedere la disposizione del terreno circostante con la tua mente.\n\nMentre sei sotto l'effetto della preveggenza, tutte le caselle in un ampio raggio ti vengono rivelate, comprese eventuali trappole o porte segrete.\n\nTurni di preveggenza rimanenti: %s.
actors.buffs.foresight.name=lungimiranza
actors.buffs.frost.desc=Da non confondere con il congelamento completo, questo congelamento più benigno avvolge semplicemente il bersaglio nel ghiaccio. Il congelamento agisce in modo simile alla paralisi, rendendo impossibile per il bersaglio agire. A differenza della paralisi, il congelamento viene immediatamente annullato se il bersaglio subisce danni, poiché il ghiaccio si frantuma. Turni di congelamento rimanenti: %s.
actors.buffs.frost.freezes=%s si blocca!
actors.buffs.frost.name=congelato
actors.buffs.frostimbue.desc=Sei pervaso da un potere glaciale!\n\nTutti gli attacchi fisici accumuleranno costantemente gelo sui nemici. Inoltre, sei completamente immune al freddo.\n\nTurni rimanenti di infusione di gelo: %s.
actors.buffs.frostimbue.name=intriso di gelo
actors.buffs.fury.desc=Sei arrabbiato, ai nemici non piacerai quando sei arrabbiato.\n\nUna grande rabbia arde dentro di te, aumentando il danno che infliggi con gli attacchi fisici di 50%%.\n\nQuesta rabbia durerà finché sarai ferito al di sotto di 50%% punti salute.
actors.buffs.fury.heromsg=Ti infuri!
actors.buffs.fury.name=furioso
actors.buffs.gravitychaostracker.desc_duration=Non è chiaro quanto durerà l'effetto, ma non può durare per sempre.
actors.buffs.gravitychaostracker.desc_intro=Ogni pochi turni, tutti i personaggi presenti sul piano corrente del dungeon verranno lanciati in una direzione casuale.
actors.buffs.gravitychaostracker.desc_positive=Tu e i tuoi alleati sembrate immuni, però.
actors.buffs.gravitychaostracker.name=caos gravitazionale
actors.buffs.greaterhaste.desc=Un'incredibile spinta di velocità, per un attimo sembra che tutto il resto si fermi.\n\nMentre si è sotto l'effetto di maggiore rapidità, le azioni di movimento non richiedono tempo, ma le altre azioni vengono comunque eseguite a velocità normale. Ogni passo di movimento consuma un turno di maggiore rapidità.\n\nTurni di maggiore rapidità rimanenti: %d.
actors.buffs.greaterhaste.name=maggiore fretta
actors.buffs.haste.desc=L'energia scorre attraverso i tuoi muscoli, permettendoti di correre a velocità incredibili!\n\nMentre sei sotto l'effetto della fretta correrai a velocità tripla, ma eseguirai tutte le altre azioni a velocità normale.\n\nTurni di fretta rimanenti: %s.
actors.buffs.haste.name=fretta
actors.buffs.healing.desc=Un rimedio magico sta facendo chiudere le ferite e ricucire la carne. Ad ogni turno la salute si rigenererà costantemente fino alla scadenza dell'effetto curativo. La quantità di guarigione potrebbe diminuire nel tempo. Prossima guarigione: %d.\n\nGuarigione rimanente: %d.
actors.buffs.healing.name=guarigione
actors.buffs.herodisguise.desc=La magia illusoria ha alterato il tuo aspetto fisico! L'effetto è puramente cosmetico, ma la sensazione è comunque molto strana.\n\nTurni di travestimento rimanenti: %s.
actors.buffs.herodisguise.name=travestimento
actors.buffs.hex.desc=Magia oscura che prosciuga la concentrazione, rendendo il bersaglio leggermente disorientato.\n\nL'incantesimo riduce la precisione e l'evasione di 20%%, rendendo il bersaglio meno efficace in combattimento.\n\nTurni di incantesimo rimanenti: %s.
actors.buffs.hex.heromsg=Sei stato vittima di una maledizione!
actors.buffs.hex.name=maledetto
actors.buffs.holdfast.desc=Il guerriero mantiene la sua posizione, aumentando la sua armatura di %1$d-%2$d e rallentando il tasso di decadimento di alcuni potenziamenti di %3$d%%. Questo effetto durerà finché non si muoverà.
actors.buffs.holdfast.name=tenetevi forte
actors.buffs.hunger.cursedhorn=Il corno maledetto ruba parte dell'energia del cibo mentre mangi.
actors.buffs.hunger.desc=La fame aumenta lentamente con il passare del tempo nel dungeon, fino a quando non inizierai a morire di fame. Mentre muori di fame, perderai lentamente salute invece di rigenerarla. Il razionamento è importante! Se hai salute da parte, morire di fame non è una cattiva idea se significa che ci sarà più cibo in seguito. Un razionamento efficace può far durare il cibo molto più a lungo!
actors.buffs.hunger.desc_intro_hungry=Senti lo stomaco che reclama cibo, ma non è ancora troppo urgente.
actors.buffs.hunger.desc_intro_starving=Hai una fame così forte che ti fa male.
actors.buffs.hunger.hungry=affamato
actors.buffs.hunger.ondeath=Sei morto di fame...
actors.buffs.hunger.onhungry=Hai fame.
actors.buffs.hunger.onstarving=Hai una fame da lupi!
actors.buffs.hunger.rankings_desc=Morto di fame
actors.buffs.hunger.starving=affamato
actors.buffs.invisibility.desc=Sei completamente mimetizzato con il terreno circostante, rendendoti impossibile da vedere. Mentre sei invisibile, i nemici non possono attaccarti o seguirti. Gli attacchi fisici e gli effetti magici (come pergamene e bacchette) annulleranno immediatamente l'invisibilità. Turni di invisibilità rimanenti: 0.
actors.buffs.invisibility.name=invisibile
actors.buffs.invulnerability.desc=Questo personaggio è pervaso da un grande potere protettivo, che gli garantisce un breve periodo di invulnerabilità!\n\nTurni rimanenti: %s.
actors.buffs.invulnerability.name=invulnerabile
actors.buffs.levitation.desc=Una forza magica ti sta sollevando da terra, facendoti sentire senza peso. I personaggi in levitazione si muovono silenziosamente e ignorano tutti gli effetti a terra. Le trappole non si attiveranno, l'acqua non spegnerà il fuoco, le piante non verranno calpestate, le radici non colpiranno e le fosse verranno sorvolate. Fai attenzione, perché tutte queste cose possono entrare in gioco nel momento stesso in cui la levitazione termina! Turni di levitazione rimanenti: %s.
actors.buffs.levitation.name=levitazione
actors.buffs.lifelink.desc=La forza vitale di questo personaggio è collegata a quella di un altro personaggio nelle vicinanze. Qualsiasi danno subito viene condiviso tra loro.\n\nOgni volta che questo personaggio subisce danni, metà di essi verrà inflitta al bersaglio del collegamento vitale.\n\nTurni rimanenti del collegamento vitale: %s.
actors.buffs.lifelink.name=legame vitale
actors.buffs.lifelink.ondeath=Il danno legato alla vita ti ha ucciso...
actors.buffs.light.desc=Anche nel dungeon più oscuro, una luce costante al tuo fianco è sempre confortante. La luce aiuta a tenere a bada l'oscurità, permettendoti di vedere a una distanza ragionevole nonostante l'ambiente. Turni di illuminazione rimanenti: %s.
actors.buffs.light.name=illuminato
actors.buffs.lockedfloor.desc=Il piano attuale è bloccato e non puoi uscirne!\n\nMentre un piano è bloccato, non avrai fame né subirai danni da fame. Inoltre, se non ti impegni per sconfiggere il boss di questo piano, anche gli effetti di rigenerazione passiva si interromperanno.\n\nInoltre, se vieni rianimato da un ankh non benedetto mentre il piano è bloccato, questo si resetterà.\n\nUccidi il boss di questo piano per sbloccarlo.
actors.buffs.lockedfloor.name=Il pavimento è chiuso a chiave
actors.buffs.lostinventory.desc=Il tuo inventario è andato perduto da qualche parte nel dungeon! Non potrai raccogliere o utilizzare la maggior parte degli oggetti finché non lo recupererai.
actors.buffs.lostinventory.name=inventario perso
actors.buffs.magicalsight.desc=In qualche modo riesci a vedere con la mente, piuttosto che con gli occhi.\n\nMentre la vista magica è attiva, sarai in grado di vedere attraverso tutto il terreno in un raggio di 12 caselle.\n\nTurni di vista magica rimanenti: %s.
actors.buffs.magicalsight.name=vista magica
actors.buffs.magicalsleep.desc=Questo personaggio è caduto in un profondo sonno magico dal quale non si sveglierà naturalmente. Il sonno magico è simile al sonno normale, tranne per il fatto che solo i danni faranno svegliare il bersaglio. Per l'eroe e i suoi alleati, il sonno magico ha alcune proprietà rigenerative, che consentono loro di guarire rapidamente mentre riposano.
actors.buffs.magicalsleep.fallasleep=Cadi in un sonno profondo e magico.
actors.buffs.magicalsleep.name=sonno tranquillo
actors.buffs.magicalsleep.toohealthy=Sei troppo in salute e resisti alla tentazione di dormire.
actors.buffs.magicalsleep.wakeup=Ti svegli sentendoti riposato e in salute.
actors.buffs.magicimmune.desc=Tutti gli effetti magici hanno perso la loro presa su di te, sei completamente immune ad essi.\n\nMentre sei immune alla magia, tutti gli effetti magici, sia dannosi che benefici, non si applicheranno a te, inclusi maledizioni, incantesimi, bacchette, pergamene, anelli, artefatti, ecc. Le abilità dell'armatura eroica sono abbastanza potenti da funzionare indipendentemente da questo effetto.\n\nTurni di immunità alla magia rimanenti: %s.
actors.buffs.magicimmune.name=Immune alla magia
actors.buffs.mindvision.desc=In qualche modo riesci a vedere tutte le creature su questo piano attraverso la tua mente. È una sensazione strana. Tutti i personaggi su questo piano sono visibili a te finché hai la visione mentale. Vedere una creatura attraverso la visione mentale conta come se fosse vista o vicina ai fini di molti effetti magici. Turni di visione mentale rimanenti: %s.
actors.buffs.mindvision.name=visione mentale
actors.buffs.momentum.action_name=freerun
actors.buffs.momentum.momentum=acquisire slancio
actors.buffs.momentum.momentum_desc=Mentre si muove, il Freerunner accumula slancio, che può spendere per iniziare il freerunning. Ogni carica di slancio garantisce due turni di freerunning e il Freerunner può accumularne fino a 10. Lo slancio si perde rapidamente quando il Freerunner si ferma. Carica di slancio attuale: %d.
actors.buffs.momentum.resting=in fase di recupero
actors.buffs.momentum.resting_desc=Mentre si muove, il Freerunner accumula slancio, che può spendere per iniziare il freerunning. Il Freerunner ha bisogno di tempo per recuperare la sua resistenza prima di accumulare nuovamente slancio. Turni rimanenti: 0.
actors.buffs.momentum.running=freerunning
actors.buffs.momentum.running_desc=Mentre si muove, il Freerunner accumula slancio, che può spendere per iniziare il freerunning.\n\nDurante il freerunning, il Freerunner si muove a velocità doppia e ottiene un bonus di evasione in base al suo livello.\n\nTurni rimanenti: %d.
actors.buffs.monkenergy$monkability$dash.desc=Uno scatto istantaneo fino a 4 caselle di distanza. Questa abilità può superare gli ostacoli, ma non attraversare i nemici o il terreno solido.
actors.buffs.monkenergy$monkability$dash.empower_desc=Uno scatto istantaneo fino a 8 caselle di distanza. Questa abilità può superare gli ostacoli, ma non attraversare i nemici o il terreno solido.
actors.buffs.monkenergy$monkability$dash.name=trattino
actors.buffs.monkenergy$monkability$dash.prompt=Scegli una località
actors.buffs.monkenergy$monkability$dragonkick.desc=Un calcio devastante che infligge %1$d-%2$d danni e ignora l'armatura. Il calcio respinge il bersaglio e lo paralizza per ogni casella percorsa.
actors.buffs.monkenergy$monkability$dragonkick.empower_desc=Un calcio devastante che infligge _%1$d-%2$d danni_ e ignora l'armatura. Il calcio respinge _tutti i bersagli adiacenti_ e li paralizza per ogni casella percorsa.
actors.buffs.monkenergy$monkability$dragonkick.name=calcio del drago
actors.buffs.monkenergy$monkability$flurry.desc=Due colpi istantanei che infliggono %1$d-%2$d danni e ignorano l'armatura. Questa abilità non può essere utilizzata ripetutamente.
actors.buffs.monkenergy$monkability$flurry.empower_desc=Due colpi istantanei che infliggono %1$d-%2$d danni, ignorano l'armatura e utilizzano l'incantamento della tua arma. Questa abilità non può essere utilizzata ripetutamente.
actors.buffs.monkenergy$monkability$flurry.name=raffica di colpi
actors.buffs.monkenergy$monkability$focus$focusbuff.desc=La monaca è concentrata sull'ambiente circostante, anticipando il prossimo attacco che le verrà sferrato. Mantenendo questa concentrazione, è sicura di parare il prossimo attacco in arrivo.
actors.buffs.monkenergy$monkability$focus$focusbuff.name=focalizzato
actors.buffs.monkenergy$monkability$focus.desc=La monaca si concentra, permettendole di parare il successivo attacco diretto contro di lei.
actors.buffs.monkenergy$monkability$focus.empower_desc=La monaca si concentra istantaneamente, riuscendo così a parare il successivo attacco sferrato contro di lei.
actors.buffs.monkenergy$monkability$focus.name=messa a fuoco
actors.buffs.monkenergy$monkability$meditate.desc=La monaca concentra l'energia nel suo corpo per 5 turni. Questo elimina la maggior parte degli effetti negativi e le garantisce 8 turni di ricarica della bacchetta e dell'artefatto.
actors.buffs.monkenergy$monkability$meditate.empower_desc=La monaca concentra l'energia nel suo corpo per 5 turni. Questo elimina la maggior parte degli effetti negativi e le garantisce 8 turni di ricarica della bacchetta e dell'artefatto. Inoltre, ottiene una resistenza ai danni dell'80% durante la meditazione e recupera lentamente il 20% dei suoi punti ferita mancanti.
actors.buffs.monkenergy$monkability$meditate.name=meditare
actors.buffs.monkenergy.action=Abilità del Monaco
actors.buffs.monkenergy.desc=Sconfiggendo i nemici, la Monaca ottiene energia che può utilizzare per una varietà di abilità. La maggior parte dei nemici conferisce 1 punto energia quando viene sconfitta e la Monaca non perde energia nel tempo. Energia attuale: %1$d/%2$d.
actors.buffs.monkenergy.desc_cooldown=Il Monaco ha usato di recente un'abilità e deve aspettare prima di usarne un'altra.\n\nTempo di ricarica attuale: %d turni.
actors.buffs.monkenergy.name=energia
actors.buffs.ooze.desc=Questo acido appiccicoso si attacca alla carne, sciogliendola lentamente.\n\nIl trasudante causerà danni costanti nel tempo, ma può essere lavato via immediatamente con acqua.\n\nNumero di trasudanti rimanenti: %s.
actors.buffs.ooze.heromsg=Una sostanza caustica ti corrode la carne. Lavala via!
actors.buffs.ooze.name=melma caustica
actors.buffs.ooze.ondeath=Ti sciogli...
actors.buffs.ooze.rankings_desc=Disciolto
actors.buffs.paralysis.desc=Spesso la cosa peggiore da fare è non fare nulla. La paralisi blocca completamente tutte le azioni, costringendo il bersaglio ad aspettare che l'effetto svanisca. Il dolore derivante dal subire danni può indurre i personaggi a resistere alla paralisi, liberandoli dall'effetto. Turni di paralisi rimanenti: %s.
actors.buffs.paralysis.heromsg=Sei paralizzato!
actors.buffs.paralysis.name=paralizzato
actors.buffs.paralysis.out=ha resistito alla paralisi
actors.buffs.physicalempower.desc=I tuoi colpi sono stati potenziati, aumentando la quantità di danni che puoi infliggere quando colpisci i nemici con attacchi fisici.\n\nDanno bonus: %1$d.\nColpi rimanenti: %2$d.
actors.buffs.physicalempower.name=fisicamente dotato
actors.buffs.pincushion.desc=Le armi da lancio che hai usato contro questo personaggio sono attualmente attaccate a lui e cadranno a terra dopo che sarà sconfitto.\n\nI seguenti oggetti sono attualmente attaccati:
actors.buffs.pincushion.name=puntaspilli
actors.buffs.poison.desc=Il veleno si diffonde nel corpo, compromettendone lentamente le funzioni interne. Il veleno infligge danni a ogni turno proporzionali al tempo rimanente prima della sua scadenza. Turni rimanenti del veleno:
actors.buffs.poison.heromsg=Sei avvelenato!
actors.buffs.poison.name=avvelenato
actors.buffs.poison.ondeath=Sei morto avvelenato...
actors.buffs.poison.rankings_desc=Soccombette all'avvelenamento
actors.buffs.preparation.action_name=attacco preparato
actors.buffs.preparation.assassinated=assassinato
actors.buffs.preparation.desc=L'assassino attende pazientemente, preparandosi a colpire dalle ombre.
actors.buffs.preparation.desc_blink=È in grado di teletrasportarsi verso un nemico prima di colpirlo, con una distanza massima di _%d._
actors.buffs.preparation.desc_dmg=Il suo prossimo attacco infliggerà _%1$d%% danni bonus_ e eliminerà i nemici normali con meno di _%2$d%% punti salute_ o i boss con meno di _%3$d%% punti salute_.
actors.buffs.preparation.desc_dmg_likely=L'attacco avrà anche maggiori probabilità di infliggere danni più ingenti.
actors.buffs.preparation.desc_invis_next=Turni per un attacco più potente: _%d._
actors.buffs.preparation.desc_invis_time=Turni trascorsi in modalità invisibile: _%d._
actors.buffs.preparation.name=preparazione
actors.buffs.preparation.no_target=Non c'è niente da attaccare lì.
actors.buffs.preparation.out_of_reach=Quell'obiettivo è irraggiungibile.
actors.buffs.preparation.prompt=Seleziona un bersaglio da attaccare!\nDistanza massima di lampeggio: %d
actors.buffs.prismaticguard.desc=Sei protetto da un'immagine prismatica attualmente inattiva. Quando sono presenti nemici, l'immagine prismatica entrerà in azione e ti proteggerà!\n\nMentre è inattiva, l'immagine prismatica si riprenderà gradualmente da qualsiasi danno subito.\n\nPunti vita attuali: %d/%d.
actors.buffs.prismaticguard.desc_many=Anche questa immagine prismatica beneficia della Potenza di Molti. Giri rimanenti: %d.
actors.buffs.prismaticguard.name=Guardia prismatica
actors.buffs.recharging.desc=L'energia scorre in te, migliorando la velocità di ricarica delle tue bacchette e dei tuoi bastoni.\n\nOgni turno questo potenziamento aumenterà la carica attuale di un quarto, oltre alla ricarica normale.\n\nTurni di ricarica rimanenti: %s.
actors.buffs.recharging.name=ricarica
actors.buffs.revealedarea.desc=Un'area del dungeon è stata temporaneamente rivelata all'eroe. La vedrà ovunque si trovi.\n\nTurni rimanenti: %s.
actors.buffs.revealedarea.name=area rivelata
actors.buffs.revealedchar.desc=Questo personaggio viene rivelato all'eroe, sarà visibile ovunque si trovi.\n\nTurni rimanenti: %s.
actors.buffs.revealedchar.name=rivelato
actors.buffs.roots.desc=Le radici (magiche o naturali) afferrano i piedi, costringendoli a toccare terra.\n\nLe radici bloccano un bersaglio sul posto, rendendo impossibile il movimento e la maggior parte delle abilità di movimento. Altre azioni non sono influenzate, inclusi gli effetti di teletrasporto.\n\nTurni rimanenti di radice: %s.
actors.buffs.roots.heromsg=Non puoi muoverti!
actors.buffs.roots.name=radicato
actors.buffs.scrollempower.desc=L'energia della pergamena appena letta dal Mago sta potenziando le sue bacchette!\n\nAumento di livello: +%1$d.\nZap rimanenti: %2$d.
actors.buffs.scrollempower.name=scroll potenziare
actors.buffs.shadows.desc=Ti mimetizzi con le ombre che ti circondano, ottenendo l'invisibilità e rallentando il tuo metabolismo. Mentre sei invisibile, i nemici non possono attaccarti o seguirti. La maggior parte degli attacchi fisici e degli effetti magici (come pergamene e bacchette) annullano immediatamente l'invisibilità. Inoltre, mentre sei mimetizzato con le ombre, il tuo tasso di fame è rallentato. Rimarrai mimetizzato con le ombre finché non uscirai dalle ombre o un nemico non entrerà in contatto con te.
actors.buffs.shadows.name=fusione d'ombra
actors.buffs.slow.desc=La magia di rallentamento influenza la velocità del tempo del bersaglio, per lui tutto si muove super velocemente.\n\nUn personaggio rallentato esegue tutte le azioni nel doppio del tempo che impiegherebbe normalmente.\n\nTurni di rallentamento rimanenti: %s.
actors.buffs.slow.name=rallentato
actors.buffs.snipersmark.action_name_snapshot=istantanea
actors.buffs.snipersmark.action_name_sniper=colpo da cecchino
actors.buffs.snipersmark.action_name_volley=volée
actors.buffs.snipersmark.desc=Il cecchino è concentrato sul bersaglio che ha attaccato più di recente. È in grado di eseguire un attacco speciale con il suo arco che varierà in base a come l'arco è potenziato.\n\nUn arco non potenziato sparerà un _colpo rapido_, che infligge danni ridotti ma non richiede tempo per essere sparato.\n\nUn arco potenziato per la velocità sparerà una _raffica_ di tre frecce. Ogni freccia infliggerà danni ridotti, ma può comunque attivare l'incantesimo. Questa raffica richiede 1 turno per essere sparata.\n\nUn arco potenziato per il danno sparerà un _colpo da cecchino_. Questo colpo è garantito per colpire, infligge danni bonus in base alla distanza dal bersaglio e richiede 2 turni per essere sparato.\n\nTurni rimanenti: %s.
actors.buffs.snipersmark.name=il segno del cecchino
actors.buffs.soulmark.desc=Lo stregone ha attinto all'anima di questa creatura, permettendogli di guarire quando subisce danni fisici.\n\nTurni rimanenti del marchio dell'anima: %s.
actors.buffs.soulmark.name=anima segnata
actors.buffs.stamina.desc=Hai una resistenza infinita, che ti permette di muoverti più velocemente! Mentre sei sotto l'effetto della resistenza, correrai a +50%% velocità, ma eseguirai tutte le altre azioni a velocità normale. Turni di resistenza rimanenti: %s.
actors.buffs.stamina.name=resistenza
actors.buffs.terror.desc=Il terrore è una magia manipolativa che costringe il suo bersaglio a un panico incontrollabile. I personaggi terrorizzati sono costretti a fuggire dal loro avversario, cercando di frapporre tra loro quante più porte e muri possibili. Lo shock del dolore, tuttavia, ridurrà la durata del terrore. Turni di terrore rimanenti: 0.
actors.buffs.terror.name=terrorizzato
actors.buffs.toxicimbue.desc=Sei pervaso da energia velenosa! Mentre ti muovi, un gas tossico si sprigionerà costantemente da te, danneggiando i tuoi nemici. Sei immune al gas tossico e al veleno per tutta la durata dell'effetto, così come per alcuni turni successivi. Turni rimanenti di infusione tossica: %s.
actors.buffs.toxicimbue.name=intriso di tossicità
actors.buffs.vertigo.desc=Camminare in linea retta può essere difficile quando il mondo intero gira.\n\nSotto gli effetti della vertigine, i personaggi che tentano di muoversi andranno in una direzione casuale, invece di quella in cui intendevano andare.\n\nTurni di vertigine rimanenti: %s.
actors.buffs.vertigo.name=vertigine
actors.buffs.vulnerable.desc=La magia Vulnerabilità aumenta tutti i danni fisici subiti da un personaggio di 33%%, dopo che tali danni sono stati ridotti dall'armatura.\n\nTurni di vulnerabilità rimanenti: %s.
actors.buffs.vulnerable.heromsg=Ti senti fragile!
actors.buffs.vulnerable.name=vulnerabile
actors.buffs.wandempower.desc=Le tue bacchette che infliggono danni sono state potenziate, aumentando la quantità di danni che infliggono per alcuni colpi.\n\nDanno bonus: %1$d.\nColpi rimanenti: %2$d.
actors.buffs.wandempower.name=bacchette potenziate
actors.buffs.weakness.desc=Tutto sembra improvvisamente molto più pesante.\n\nLa magia di indebolimento riduce la forza fisica di un personaggio, causandogli di infliggere 33%% danni ridotti.\n\nTurni di debolezza rimanenti: %s.
actors.buffs.weakness.heromsg=Ti senti debole!
actors.buffs.weakness.name=indebolito
actors.buffs.wellfed.desc=Ti senti abbastanza soddisfatto e sazio.\n\nFinché sei ben nutrito, la tua fame non aumenterà e recupererai una quantità aggiuntiva di salute nel tempo.\n\nTurni rimanenti: %d.
actors.buffs.wellfed.name=ben nutrito
actors.char.def_verb=schivato
actors.char.def_verb_blocked=bloccato
actors.char.defeat=Hai sconfitto %s.
actors.char.immune=immune
actors.char.invulnerable=invulnerabile
actors.char.kill=%s ti ha ucciso...
actors.hero.abilities.armorability.cost=Costo di addebito: _%d_
actors.hero.abilities.armorability.no_target=Non c'è niente da colpire lì!
actors.hero.abilities.armorability.prompt=Scegli una località da prendere di mira
actors.hero.abilities.armorability.self_target=Non puoi prendere di mira te stesso!
actors.hero.abilities.cleric.ascendedform$ascendbuff.desc=Un'energia radiosa emana dal corpo del Chierico. Mentre si trova in questa forma, il Chierico ottiene 2 di raggio d'attacco (grazie all'energia sacra che emana) e 10 di scudo ogni volta che spende una carica di tomo sacro. È inoltre in grado di lanciare gli incantesimi sbloccati tramite i talenti della forma ascendente. Lo scudo conferito dalla forma ascendente e dai suoi incantesimi non si deteriorerà normalmente, ma svanirà istantaneamente al termine della forma ascendente. Scudo attuale: Turni rimanenti: Turni rimanenti:
actors.hero.abilities.cleric.ascendedform$ascendbuff.name=forma ascendente
actors.hero.abilities.cleric.ascendedform.desc=Il Chierico proietta energia sacra da sé stesso, assumendo una forma radiosa estesa per 10 turni. Mentre si trova in questa forma, il Chierico può lanciare nuovi incantesimi, ottiene 2 di raggio d'attacco, 30 di scudo e ogni incantesimo aggiuntivo che lancia conferirà 10 di scudo per ogni carica del tomo sacro utilizzata. Lo scudo della forma ascendente e dei suoi incantesimi non decade normalmente, ma svanirà immediatamente al termine della forma ascendente. L'abilità può essere riutilizzata per rinnovare la durata della forma ascendente.
actors.hero.abilities.cleric.ascendedform.name=forma ascendente
actors.hero.abilities.cleric.ascendedform.short_desc=Il Chierico assume una _Forma Ascesa_, ottenendo nuovi incantesimi, raggio d'attacco e scudi.
actors.hero.abilities.cleric.powerofmany$lightally.desc=Una copia di uno dei compagni d'avventura del Chierico, fatta di luce solida. Pur avendo la forma di un altro eroe, non possiede nessuna delle sue abilità uniche. Questo alleato persisterà finché verrà applicato a lui il Potere di Molti. Questo alleato può essere diretto senza costi riutilizzando l'abilità dell'armatura Potere di Molti.
actors.hero.abilities.cleric.powerofmany$lightally.direct_attack=Il tuo alleato si muove per attaccare!
actors.hero.abilities.cleric.powerofmany$lightally.direct_defend=Il tuo alleato si sposta in quella posizione.
actors.hero.abilities.cleric.powerofmany$lightally.direct_follow=Il tuo alleato si muove per seguirti.
actors.hero.abilities.cleric.powerofmany$lightally.discover_hint=Puoi trovare questo personaggio con una specifica abilità di armatura da eroe.
actors.hero.abilities.cleric.powerofmany$lightally.name=alleato leggero
actors.hero.abilities.cleric.powerofmany$powerbuff.desc=Questo alleato è stato potenziato da Potere di Molti, che gli conferisce +25%% danni inflitti e -25%% danni subiti. Condividerà anche il suo raggio visivo con il Chierico e potrà beneficiare degli incantesimi di potere di molti.\n\nPotere di Molti persisterà quando gli alleati come le immagini prismatiche si nascondono, ma la sua durata continuerà a diminuire.\n\nTurni rimanenti: %s.
actors.hero.abilities.cleric.powerofmany$powerbuff.name=il potere dei molti
actors.hero.abilities.cleric.powerofmany.ally_exists=Hai già un alleato potente.
actors.hero.abilities.cleric.powerofmany.desc=Il Chierico incanala il _Potere di Molti_, che potenzia un alleato esistente o ne crea uno nuovo potenziato per 100 turni. Bersagliando uno spazio vuoto si crea un nuovo alleato. Mentre è potenziato dal Potere di Molti, qualsiasi alleato infligge il 25% di danni in più, subisce il 25% di danni in meno e condivide la sua visione con il Chierico. Ottiene anche 25 di scudo quando usa l'abilità. Il Chierico ottiene anche tre nuovi incantesimi che possono essere lanciati solo con un alleato potenziato. Il Potere di Molti non termina finché uno di questi incantesimi è attivo.
actors.hero.abilities.cleric.powerofmany.name=il potere dei molti
actors.hero.abilities.cleric.powerofmany.no_vision=Non puoi prendere di mira una posizione che non puoi vedere.
actors.hero.abilities.cleric.powerofmany.only_allies=Puoi potenziare solo gli alleati.
actors.hero.abilities.cleric.powerofmany.prompt_ally=Dirigi il tuo alleato luminoso
actors.hero.abilities.cleric.powerofmany.prompt_default=Scegli un alleato o una località
actors.hero.abilities.cleric.powerofmany.short_desc=Il Chierico incanala il _Potere dei Molti_, potenziando un alleato esistente o creandone uno nuovo.
actors.hero.abilities.cleric.trinity$wnditemconfirm.body=Assegna alla forma del corpo
actors.hero.abilities.cleric.trinity$wnditemconfirm.mind=Assegnare alla forma mentale
actors.hero.abilities.cleric.trinity$wnditemconfirm.spirit=Assegnare alla forma spirituale
actors.hero.abilities.cleric.trinity$wnditemtypeselect.text=Seleziona un effetto da infondere in Trinity. Ulteriori informazioni verranno visualizzate prima della conferma.
actors.hero.abilities.cleric.trinity$wndusetrinity.body=_Formato del corpo: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.mind=_Forma Mentale: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.spirit=_Forma spirituale: %s._
actors.hero.abilities.cleric.trinity$wndusetrinity.text=Seleziona quale forma di Trinità utilizzare. Gli effetti delle diverse forme possono essere attivi simultaneamente.
actors.hero.abilities.cleric.trinity.alchemiststoolkit_use=Trinity applicherà l'effetto di alchimia remota di questo artefatto, al costo di una carica di _%2$s._
actors.hero.abilities.cleric.trinity.chaliceofblood_use=Trinity applicherà l'effetto passivo di rigenerazione salute di questo artefatto a _+%1$d_ per 20 turni, al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.cost=Il costo di carica di questa abilità varia, ma il più delle volte è _%d._
actors.hero.abilities.cleric.trinity.desc=Il Chierico ottiene una _Trinità_ di abilità dell'armatura, che può essere assegnata a vari effetti degli oggetti utilizzando tre nuovi incantesimi. Ognuno di questi incantesimi si concentra sull'emulazione degli effetti di diversi tipi di equipaggiamento che il Chierico ha identificato durante questa partita: forma corporea (armi e armature), forma mentale (bacchette e armi da lancio) e forma spirituale (anelli e artefatti). Ogni forma della Trinità può essere infusa con un effetto alla volta e il Chierico sceglie quale attivare quando usa la Trinità. La Trinità non duplicherà l'effetto di qualcosa che hai già equipaggiato.
actors.hero.abilities.cleric.trinity.driedrose_use=Trinity utilizzerà l'effetto di questo artefatto per evocare uno spettro amico corrotto con i Punti Ferita di un fantasma _+%1$d_, al costo di _%2$s cariche._
actors.hero.abilities.cleric.trinity.ench_glyph_use=Trinity applicherà questo effetto per _%1$d turni_ al costo di _%2$s carica._
actors.hero.abilities.cleric.trinity.etherealchains_use=Trinity applicherà l'effetto di lancio a catena di questo artefatto con portata a _+%1$d_, al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.hornofplenty_use=Trinity applicherà l'effetto di spuntino di questo artefatto, al costo di una carica di _%2$s._
actors.hero.abilities.cleric.trinity.masterthievesarmband_use=Trinity applicherà l'effetto di furto del nemico di questo artefatto a _+%1$d_, al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.name=Trinità
actors.hero.abilities.cleric.trinity.no_duplicate=Trinity non può duplicare un effetto che hai già equipaggiato!
actors.hero.abilities.cleric.trinity.no_imbue=Trinity al momento non ha alcun effetto attivo per nessuna delle sue forme, usa uno dei suoi incantesimi!
actors.hero.abilities.cleric.trinity.rare_ench_glyph_use=Trinity applicherà questo _potente_ effetto per _%1$d turni_ al costo di _%2$s carica._
actors.hero.abilities.cleric.trinity.ring_use=Trinity applicherà l'effetto di questo anello a _+%1$d_ per 20 turni, al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.sandalsofnature_use=Trinity applicherà l'effetto radice di questo artefatto con un seme dannoso casuale, al costo di una carica di _%2$s._
actors.hero.abilities.cleric.trinity.short_desc=Il Chierico acquisisce una _Trinità_ di abilità, che emulano l'equipaggiamento che ha visto e possono essere assegnate utilizzando nuovi incantesimi.
actors.hero.abilities.cleric.trinity.skeletonkey_use=Trinity applicherà l'effetto di inserimento di questo artefatto, al costo di una carica di _%2$s._
actors.hero.abilities.cleric.trinity.talismanofforesight_use=Trinity applicherà l'effetto di scry di questo artefatto a _+%1$d_, al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.thrown_use=Trinity lancerà quest'arma contro _+%1$d_ al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.timekeepershourglass_use=Trinity applicherà l'effetto di congelamento temporale di questo artefatto con una durata di _%1$d_ turno, al costo di _%2$s carica._
actors.hero.abilities.cleric.trinity.unstablespellbook_use=Trinity applicherà l'effetto di pergamena casuale di questo artefatto con una probabilità di _%1$d/10_ di offrire la versione esotica senza costi aggiuntivi, al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.wand_multi_use=Trinity scaricherà questa bacchetta _multi-carica_ a _+%1$d_ al costo di _%2$s di carica._
actors.hero.abilities.cleric.trinity.wand_use=Trinity colpirà questa bacchetta a _+%1$d_ al costo di _%2$s di carica._
actors.hero.abilities.duelist.challenge$duelparticipant.desc=Questo personaggio sta partecipando a un duello. Lui, e tutti i suoi alleati o servitori, possono agire normalmente mentre gli altri sono congelati.\n\nIl duello durerà per un determinato periodo di tempo, finché uno dei partecipanti non muore o finché i partecipanti non si allontanano di più di 5 caselle l'uno dall'altro.\n\nTurni rimanenti: %d.
actors.hero.abilities.duelist.challenge$duelparticipant.name=doppio partecipante
actors.hero.abilities.duelist.challenge.ally_target=Puoi sfidare solo i nemici.
actors.hero.abilities.duelist.challenge.already_dueling=Puoi partecipare a un solo duello alla volta.
actors.hero.abilities.duelist.challenge.desc=La Duellante sfida un nemico vicino a duello. Quel nemico è costretto a combattere contro di lei mentre tutti gli altri nemici sono temporaneamente congelati nel tempo. Il bersaglio deve essere raggiungibile e entro 5 caselle dalla Duellante. Il duello dura finché non passano 10 turni, il nemico muore o la Duellante si trova a più di 5 caselle di distanza dal nemico. I nemici congelati sono invulnerabili. Gli alleati della Duellante non vengono congelati da questa abilità, ma se viene preso di mira un boss, anche i suoi servitori non verranno congelati.
actors.hero.abilities.duelist.challenge.distant_target=Quel nemico è troppo lontano per poterlo affrontare.
actors.hero.abilities.duelist.challenge.name=sfida
actors.hero.abilities.duelist.challenge.prompt=Scegli un nemico da sfidare
actors.hero.abilities.duelist.challenge.short_desc=Il Duellante sfida a duello un nemico vicino, congelando temporaneamente tutti gli altri nemici.
actors.hero.abilities.duelist.challenge.unreachable_target=Devi essere in grado di raggiungere il tuo obiettivo.
actors.hero.abilities.duelist.elementalstrike.desc=Il Duellante colpisce un nemico o una posizione, eseguendo un attacco normale che ha la certezza di colpire e diffondendo un effetto magico che si propaga fino a 4 caselle in un cono di 65 gradi. Questo effetto magico varia in base all'incantesimo presente sull'arma principale del Duellante.
actors.hero.abilities.duelist.elementalstrike.generic_desc=Un attacco elementale senza incantesimi rilascerà una piccola esplosione di magia, infliggendo 6-12 danni a tutti i nemici nel raggio d'azione.
actors.hero.abilities.duelist.elementalstrike.name=colpo elementale
actors.hero.abilities.duelist.elementalstrike.short_desc=La Duellante esegue un _Colpo Elementale_, diffondendo un effetto in un'area conica basata sull'incantesimo della sua arma.
actors.hero.abilities.duelist.feint.bad_location=Non puoi trasferirti in quel luogo.
actors.hero.abilities.duelist.feint.desc=Il Duellante simula un attacco mentre scatta verso una casella adiacente, lasciando dietro di sé un'immagine residua momentanea. I nemici che stavano attaccando il Duellante attaccheranno invece la sua immagine residua. I nemici che attaccano l'immagine residua vengono confusi, il che annulla la loro prossima azione e li lascia esposti a un attacco a sorpresa.
actors.hero.abilities.duelist.feint.name=finta
actors.hero.abilities.duelist.feint.prompt=Scegli un luogo in cui correre
actors.hero.abilities.duelist.feint.short_desc=La Duellante esegue una Finta, simulando un attacco mentre scatta verso una casella adiacente. I nemici attaccheranno la sua immagine residua, lasciandoli scoperti a un contrattacco.
actors.hero.abilities.duelist.feint.too_far=Quel luogo non è adiacente a te.
actors.hero.abilities.huntress.naturespower$naturespowertracker.desc=La cacciatrice è brevemente potenziata, aumentando la sua velocità di movimento e la velocità di attacco con il suo arco.\n\nTurni rimanenti: %s.
actors.hero.abilities.huntress.naturespower$naturespowertracker.name=il potere della natura
actors.hero.abilities.huntress.naturespower.desc=La Cacciatrice potenzia temporaneamente se stessa e il suo arco con il potere della natura! Questo dura per 8 turni. Durante questo periodo, la Cacciatrice si muove a velocità doppia e attacca il 33% più velocemente con il suo arco. Gli effetti bonus dell'arco non si attivano se il Cecchino sta usando i suoi attacchi speciali.
actors.hero.abilities.huntress.naturespower.name=il potere della natura
actors.hero.abilities.huntress.naturespower.short_desc=La cacciatrice invoca il potere della natura, aumentando per un breve periodo la sua velocità di movimento e la cadenza di tiro del suo arco.
actors.hero.abilities.huntress.spectralblades.desc=La Cacciatrice lancia una lama spettrale contro un nemico, che agisce come un attacco a distanza della sua arma da mischia. Tutti gli effetti normali di un'arma da mischia si attiveranno, inclusi gli incantesimi.
actors.hero.abilities.huntress.spectralblades.name=lame spettrali
actors.hero.abilities.huntress.spectralblades.short_desc=La Cacciatrice lancia Lame Spettrali contro un bersaglio, infliggendo danni a seconda dell'arma da mischia attualmente equipaggiata.
actors.hero.abilities.huntress.spirithawk$hawkally.desc=Un falco magico, evocato dalla Cacciatrice. Emette una luce blu eterea e brillante, la sua testa si muove costantemente mentre scruta l'area. Sebbene non sia un gran combattente, la sua velocità e la sua vista lo rendono eccellente per esplorare e distrarre i nemici.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_dodges=Schivate garantite rimanenti: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.desc_remaining=Turni rimanenti: %d.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_attack=Il tuo falco si muove per attaccare!
actors.hero.abilities.huntress.spirithawk$hawkally.direct_defend=Il tuo falco si sposta in quella posizione.
actors.hero.abilities.huntress.spirithawk$hawkally.direct_follow=Il tuo falco si muove per seguirti.
actors.hero.abilities.huntress.spirithawk$hawkally.discover_hint=Puoi trovare questo personaggio con una specifica abilità di armatura da eroe.
actors.hero.abilities.huntress.spirithawk$hawkally.name=falco spirito
actors.hero.abilities.huntress.spirithawk.desc=La Cacciatrice evoca un famiglio falco spirituale, che può essere diretto usando nuovamente l'abilità mentre è evocato. Il falco dura 100 turni, dirigerlo non costa alcuna carica. Il falco ha salute e potenza d'attacco minime, ma è veloce, elusivo e preciso. Condivide sempre il suo intero campo visivo con la Cacciatrice. È immune a tutti gli effetti ad area, come fuoco e gas velenoso. Non attaccherà a meno che non venga specificamente indirizzato.
actors.hero.abilities.huntress.spirithawk.name=falco spirito
actors.hero.abilities.huntress.spirithawk.no_space=Non ci sono posti liberi nelle vicinanze.
actors.hero.abilities.huntress.spirithawk.short_desc=La Cacciatrice evoca un famiglio, un Falco Spirituale, che può aiutarla a esplorare i luoghi e a distrarre i nemici.
actors.hero.abilities.mage.elementalblast.desc=Il Mago emette un'esplosione magica che copre un'area circolare fino a 4 caselle di distanza e infligge da 15 a 25 danni. L'effetto specifico dell'esplosione elementale varia a seconda della bacchetta incastonata nel bastone del Mago.
actors.hero.abilities.mage.elementalblast.generic_desc=L'effetto dell'esplosione elementale sarà simile all'effetto della bacchetta quando viene scagliata contro un nemico o un alleato.
actors.hero.abilities.mage.elementalblast.name=esplosione elementale
actors.hero.abilities.mage.elementalblast.no_staff=Non puoi usare questa abilità senza il tuo staff.
actors.hero.abilities.mage.elementalblast.short_desc=Il mago emette un'Esplosione Elementale dal suo bastone, che copre una vasta area intorno a sé con un effetto che varia a seconda della bacchetta che impugna.
actors.hero.abilities.mage.warpbeacon.depths=Non puoi teletrasportarti tra le profondità!
actors.hero.abilities.mage.warpbeacon.desc=Il Mago posiziona un faro, verso il quale è possibile teletrasportarsi a piacimento. Posizionare il faro richiede 1 turno, ma il teletrasporto è istantaneo. Il Mago non può teletrasportarsi tra i piani di default, né utilizzare il faro per raggiungere luoghi inaccessibili come stanze chiuse a chiave. Il Mago può teletrasportarsi contro i nemici, spingendoli di lato.
actors.hero.abilities.mage.warpbeacon.invalid_beacon=Non puoi posizionare un faro lì!
actors.hero.abilities.mage.warpbeacon.locked_floor=Non puoi lasciare un piano chiuso a chiave!
actors.hero.abilities.mage.warpbeacon.name=faro di curvatura
actors.hero.abilities.mage.warpbeacon.short_desc=Il mago posiziona un _Faro di teletrasporto_ nella sua posizione attuale, dove può teletrasportarsi istantaneamente.
actors.hero.abilities.mage.warpbeacon.too_far=Quel posto è troppo lontano!
actors.hero.abilities.mage.warpbeacon.window_cancel=cancellare
actors.hero.abilities.mage.warpbeacon.window_clear=faro chiaro
actors.hero.abilities.mage.warpbeacon.window_desc=Il tuo beacon è attualmente posizionato al piano %d.
actors.hero.abilities.mage.warpbeacon.window_tele=teletrasporto al faro
actors.hero.abilities.mage.wildmagic.desc=Il Mago scatena il potere delle sue bacchette, sparandole casualmente fino a 4 volte in un singolo turno. Il bastone del Mago non è incluso in questo effetto. Ogni bacchetta ha anche il suo livello aumentato di 2, fino a un massimo di +3. Questa abilità consuma mezza carica di bacchetta per ogni scarica e nessuna bacchetta può essere sparata più di 2 volte.
actors.hero.abilities.mage.wildmagic.name=magia selvaggia
actors.hero.abilities.mage.wildmagic.no_wands=Non hai bacchette magiche per lanciare incantesimi!
actors.hero.abilities.mage.wildmagic.short_desc=Il Mago scatena la _Magia Selvaggia_ contenuta nelle sue bacchette, scagliandole casualmente più volte contro un bersaglio prescelto in un singolo turno.
actors.hero.abilities.ratmogrify$transmograt.desc=Questo nemico è stato trasformato in un topo. Un bel miglioramento, se me lo chiedi! - Re dei Topi
actors.hero.abilities.ratmogrify$transmograt.name=ratto %s
actors.hero.abilities.ratmogrify$transmograt.rankings_desc=Ucciso da: nemico trasformato in ratto
actors.hero.abilities.ratmogrify.cant_transform=Non puoi trasformarlo in ratto!
actors.hero.abilities.ratmogrify.desc=L'eroe trasforma un nemico in un topo per 6 turni! Boss, alleati e topi non possono essere trasformati in topi. I nemici trasformati in topi mantengono le loro statistiche originali, ma non hanno abilità.
actors.hero.abilities.ratmogrify.name=ratmogrify
actors.hero.abilities.ratmogrify.short_desc=L'eroe trasforma _Ratmogrifica_ un nemico! Questo lo trasforma temporaneamente in un topo senza abilità.
actors.hero.abilities.ratmogrify.too_strong=Quel nemico è troppo forte per essere trasformato in ratto!
actors.hero.abilities.rogue.deathmark$deathmarktracker.desc=Questo nemico è stato marchiato, subendo 25%% danni bonus, ma diventando anche incapace di morire fino alla fine del marchio.\n\nTurni rimanenti: %s.
actors.hero.abilities.rogue.deathmark$deathmarktracker.name=condannato a morte
actors.hero.abilities.rogue.deathmark.ally_target=Puoi contrassegnare solo i nemici
actors.hero.abilities.rogue.deathmark.desc=Il Ladro imprime un marchio su un nemico prescelto, infliggendogli il 25% di danni extra. Il marchio viene applicato istantaneamente e dura 5 turni. I nemici marchiati subiscono danni bonus ma non possono morire finché il marchio non scade. Se un nemico ha 0 HP quando il marchio termina, morirà immediatamente.
actors.hero.abilities.rogue.deathmark.name=marchio della morte
actors.hero.abilities.rogue.deathmark.short_desc=Il Ladro imprime un Marchio della Morte su un nemico prescelto. I nemici marchiati subiscono danni bonus, ma non possono morire finché il marchio non scompare.
actors.hero.abilities.rogue.shadowclone$shadowally.desc=Una copia del Ladro, creata dall'oscurità più profonda. Rimane immobile, con gli occhi vuoti e minuscoli rivoli di oscurità che si alzano da esso come vapore. Il clone non è una copia perfetta del Ladro, ma è comunque un combattente decente e può beneficiare dell'equipaggiamento del Ladro con i talenti giusti.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_attack=Il tuo clone si muove per attaccare!
actors.hero.abilities.rogue.shadowclone$shadowally.direct_defend=Il tuo clone si sposta in quella posizione.
actors.hero.abilities.rogue.shadowclone$shadowally.direct_follow=Il tuo clone si muove per seguirti.
actors.hero.abilities.rogue.shadowclone$shadowally.discover_hint=Puoi trovare questo personaggio con una specifica abilità di armatura da eroe.
actors.hero.abilities.rogue.shadowclone$shadowally.name=ladro ombra
actors.hero.abilities.rogue.shadowclone.desc=Il Ladro evoca un clone d'ombra di se stesso, che può essere diretto per aiutarlo in combattimento. Dirigere il clone d'ombra non costa alcuna carica. Il clone ha 80 HP, nessuna armatura e infligge 10-20 danni. Tutte queste caratteristiche possono essere migliorate con i talenti, in modo che il clone benefici delle armi e delle armature dell'eroe.
actors.hero.abilities.rogue.shadowclone.name=clone ombra
actors.hero.abilities.rogue.shadowclone.short_desc=Il Ladro evoca un _Clone d'Ombra_, che può essere indirizzato per aiutarlo in combattimento.
actors.hero.abilities.rogue.smokebomb$ninjalog.desc=In qualche modo, i nemici si convincono facilmente che questo manichino di legno sia il vero Ladro!
actors.hero.abilities.rogue.smokebomb$ninjalog.discover_hint=Puoi trovare questo personaggio con una specifica abilità di armatura da eroe.
actors.hero.abilities.rogue.smokebomb$ninjalog.name=esca di legno
actors.hero.abilities.rogue.smokebomb.desc=Il Ladro lancia una bomba fumogena e si teletrasporta fino a 6 caselle di distanza. Può teletrasportarsi attraverso pericoli e nemici, ma non attraverso terreni solidi come i muri. I nemici adiacenti alla vecchia posizione del Ladro saranno accecati per 5 turni.
actors.hero.abilities.rogue.smokebomb.fov=Puoi saltare solo in un punto vuoto all'interno del tuo campo visivo.
actors.hero.abilities.rogue.smokebomb.name=bomba fumogena
actors.hero.abilities.rogue.smokebomb.prompt=Scegli una posizione in cui saltare
actors.hero.abilities.rogue.smokebomb.short_desc=Il Ladro lancia una Bomba Fumogena mentre si teletrasporta via. Acceca i nemici vicino alla sua vecchia posizione.
actors.hero.abilities.warrior.endure$enduretracker.desc=Il guerriero ora infligge danni bonus in base ai danni subiti.\n\nDanni bonus: %1$d\nColpi rimanenti: %2$d
actors.hero.abilities.warrior.endure$enduretracker.name=resistenza
actors.hero.abilities.warrior.endure.desc=Il guerriero resiste per 3 turni, subendo metà dei danni da tutte le fonti. Questa riduzione viene applicata prima degli effetti di resistenza ai danni come l'armatura. Dopo aver resistito, il prossimo colpo del guerriero entro 10 turni ottiene danni bonus. Questo danno bonus è pari alla metà di tutti i danni inflitti durante la resistenza, prima di qualsiasi effetto di riduzione dei danni! Se il guerriero ha una combo, l'utilizzo di questa abilità aumenta il tempo rimanente di 3 turni.
actors.hero.abilities.warrior.endure.name=sopportare
actors.hero.abilities.warrior.endure.short_desc=Il guerriero resiste, saltando diversi turni ma ottenendo un'elevata resistenza ai danni. In seguito infligge danni bonus in base a ciò che ha sopportato.
actors.hero.abilities.warrior.heroicleap.desc=Il guerriero si lancia verso una posizione bersaglio, superando nemici e ostacoli lungo il percorso. Non può però saltare oltre muri o altri terreni solidi.
actors.hero.abilities.warrior.heroicleap.name=salto eroico
actors.hero.abilities.warrior.heroicleap.prompt=Scegli la direzione del salto
actors.hero.abilities.warrior.heroicleap.short_desc=Il guerriero esegue un _salto eroico_ verso una posizione bersaglio, librandosi al di sopra di nemici e pericoli.
actors.hero.abilities.warrior.shockwave.desc=Il Guerriero sbatte il piede a terra, generando un'onda d'urto che si propaga fino a 5 caselle in un cono di 60 gradi. I nemici colpiti da quest'onda d'urto vengono menomati per 5 turni. Subiscono inoltre 5-10 danni, più 1-2 danni aggiuntivi per ogni punto di forza del Guerriero superiore a 10.
actors.hero.abilities.warrior.shockwave.name=onda d'urto
actors.hero.abilities.warrior.shockwave.short_desc=Il Guerriero rilascia un'onda d'urto ad area conica sbattendo il piede a terra. I nemici colpiti dall'onda d'urto subiscono danni e vengono immobilizzati.
actors.hero.hero.key_distracted=Non riesci ad aprire completamente la serratura, dovrai continuare a provare.
actors.hero.hero.leave=Non puoi ancora andartene, il resto del dungeon ti aspetta più in basso!
actors.hero.hero.level_cap=Non puoi diventare più forte, ma le tue esperienze ti danno una carica di energia!
actors.hero.hero.level_up=Passa al livello successivo!
actors.hero.hero.locked_chest=Questo forziere è chiuso a chiave e tu non hai la chiave corrispondente.
actors.hero.hero.locked_door=Non disponi di una chiave corrispondente.
actors.hero.hero.name=Voi
actors.hero.hero.new_level=Sali di livello! +Precisione, +Elusione, +5 HP!
actors.hero.hero.new_talent=+1 Punto Talento!
actors.hero.hero.noticed_smth=Hai notato qualcosa.
actors.hero.hero.pain_resist=Il dolore ti aiuta a resistere alla voglia di dormire.
actors.hero.hero.revive=L'ankh esplode di energia vitale!
actors.hero.hero.search=ricerca
actors.hero.hero.search_distracted=È difficile concentrarsi, la ricerca è estenuante.
actors.hero.hero.unspent=Hai punti talento non spesi!
actors.hero.hero.wait=...
actors.hero.hero.you_cant_have=Non puoi trasportare: %s.
actors.hero.hero.you_now_have=Hai selezionato: %s.
actors.hero.heroclass.cleric=chierico
actors.hero.heroclass.cleric_desc=Il Chierico inizia con un _tomo sacro unico_, che può usare per lanciare vari incantesimi.\n\nLa maggior parte dei talenti del Chierico sono incentrati sull'apprendimento o sul potenziamento degli incantesimi.\n\nIl Chierico inizia anche con _una mazza_, un'armatura di stoffa, un otre e una borsa di velluto.\n\nIl Chierico identifica automaticamente:\n_-_ Pergamene di Identificazione\n_-_ Pozioni di Purezza\n_-_ Pergamene di Rimozione della Maledizione
actors.hero.heroclass.cleric_desc_short=Il Chierico è un incantatore divino che usa il suo tomo sacro unico per incanalare la magia divina. Può apprendere e potenziare gli incantesimi tramite i talenti.
actors.hero.heroclass.cleric_unlock=Per sbloccare il Chierico, _purifica completamente la maledizione su qualsiasi pezzo di equipaggiamento maledetto._
actors.hero.heroclass.duelist=duellante
actors.hero.heroclass.duelist_desc=Il Duellante inizia con uno stocco unico con un'abilità speciale che si ricarica nel tempo. Ogni arma nel gioco ha un'abilità speciale diversa che il Duellante può usare. Il Duellante inizia anche con due punte da lancio, un'armatura di stoffa, un otre e una borsa di velluto. Il Duellante identifica automaticamente: Pergamene di Identificazione Pozioni di Forza Pergamene di Immagine Speculare
actors.hero.heroclass.duelist_desc_short=La Duellante è una maestra d'armi che può usare la sua arma per attivare un'abilità speciale. Questa abilità speciale è diversa per ogni arma.
actors.hero.heroclass.duelist_unlock=Per sbloccare il Duellante, equipaggia un'arma di livello 2 o superiore senza penalità di forza.
actors.hero.heroclass.huntress=cacciatrice
actors.hero.heroclass.huntress_desc=La Cacciatrice inizia con un _arco spirituale unico_, che può scagliare un numero infinito di frecce evocate.\n\nLa Cacciatrice può attraversare l'erba alta _senza calpestarla_.\n\nLa Cacciatrice inizia anche con _guanti borchiati_, armatura di stoffa, un otre e una borsa di velluto.\n\nLa Cacciatrice identifica automaticamente:\n_-_ Pergamene di Identificazione\n_-_ Pozioni di Visione Mentale\n_-_ Pergamene di Ninna Nanna
actors.hero.heroclass.huntress_desc_short=La Cacciatrice è una maestra delle armi da lancio e possiede un arco magico con frecce infinite. Inoltre, riesce a muoversi nell'erba alta senza calpestarla.
actors.hero.heroclass.huntress_unlock=Per sbloccare la Cacciatrice, colpisci i nemici 10 volte con armi da lancio in una singola partita.
actors.hero.heroclass.mage=mago
actors.hero.heroclass.mage_desc=Il Mago inizia con un bastone unico, che si ricarica molto più velocemente di una bacchetta e ha 1 carica in più. Il bastone può essere infuso con qualsiasi bacchetta che il Mago trova nel dungeon. Il Mago inizia anche con una bacchetta di dardo magico infusa nel suo bastone, un'armatura di stoffa, un otre e una borsa di velluto. Il Mago identifica automaticamente: pergamene di identificazione, pozioni di fiamma liquida, pergamene di potenziamento.
actors.hero.heroclass.mage_desc_short=Il Mago è un esperto di arti arcane e porta con sé un bastone magico più potente di una bacchetta. Il bastone può essere infuso con qualsiasi bacchetta che il Mago trovi.
actors.hero.heroclass.mage_unlock=Per sbloccare il Mago, usa una pergamena di potenziamento per rendere un oggetto più forte.
actors.hero.heroclass.rogue=briccone
actors.hero.heroclass.rogue_desc=Il Ladro inizia con un _Mantello delle Ombre unico_, che può usare per diventare invisibile a piacimento.\n\nIl Ladro può _individuare segreti e trappole_ da una distanza maggiore.\n\nIl Ladro inizia anche con _un pugnale_, _tre coltelli da lancio_, un'armatura di stoffa, un otre e una borsa di velluto.\n\nIl Ladro identifica automaticamente:\n_-_ Pergamene di Identificazione\n_-_ Pozioni di Invisibilità\n_-_ Pergamene di Mappatura Magica
actors.hero.heroclass.rogue_desc_short=Il Ladro può eludere i nemici e colpire dall'invisibilità usando il suo _mantello d'ombra_. Inoltre, _individua segreti e trappole_ da una distanza maggiore.
actors.hero.heroclass.rogue_unlock=Per sbloccare il Ladro, esegui 10 attacchi a sorpresa in una partita.
actors.hero.heroclass.warrior=guerriero
actors.hero.heroclass.warrior_desc=Il Guerriero inizia con un _sigillo rotto unico_ che gli garantisce un'esplosione di scudo quando è sotto la metà della salute. Il sigillo può essere spostato tra le armature e può _trasferire un singolo potenziamento_ con esso.\n\nIl Guerriero inizia anche con una _spada corta usurata_, _tre pietre da lancio_, un'armatura di stoffa, un otre d'acqua e una borsa di velluto.\n\nIl Guerriero identifica automaticamente:\n_-_ Pergamene di Identificazione\n_-_ Pozioni di Guarigione\n_-_ Pergamene di Furia
actors.hero.heroclass.warrior_desc_short=Il guerriero subisce danni extra grazie allo scudo conferito dal suo _sigillo rotto_. Il sigillo può essere spostato tra le armature e _trasferisce un singolo potenziamento_.
actors.hero.heroclass.warrior_unlock=Il Guerriero viene sbloccato automaticamente.
actors.hero.herosubclass.assassin=assassino
actors.hero.herosubclass.assassin_desc=L'Assassino prepara il suo prossimo attacco quando diventa invisibile. Più a lungo si prepara, più potente sarà il suo prossimo attacco. La preparazione può durare fino a 9 turni. Dopo la preparazione, l'Assassino infligge danni bonus con il suo prossimo attacco, può teletrasportarsi sul bersaglio e può persino uccidere istantaneamente i nemici sufficientemente deboli.
actors.hero.herosubclass.assassin_short_desc=L'Assassino può preparare un attacco letale mentre è invisibile. Più a lungo aspetta, più potente sarà l'attacco.
actors.hero.herosubclass.battlemage=mago guerriero
actors.hero.herosubclass.battlemage_desc=Il Mago Guerriero ottiene un effetto bonus ogni volta che colpisce in mischia con il suo bastone, come se quest'ultimo avesse un incantesimo aggiuntivo. Questi effetti dipendono dalla bacchetta con cui è infuso il bastone; ogni bacchetta ha il suo effetto specifico. Oltre agli effetti della bacchetta, il bastone del Mago Guerriero ottiene anche 0,5 cariche ogni volta che colpisce con esso.
actors.hero.herosubclass.battlemage_short_desc=Il _Mago da battaglia_ evoca effetti bonus quando combatte in mischia con il suo bastone. Questi effetti dipendono dalla bacchetta con cui è infuso il suo bastone.
actors.hero.herosubclass.berserker=berserker
actors.hero.herosubclass.berserker_desc=Il Berserker accumula furia quando subisce danni fisici, inclusi quelli bloccati dalla sua armatura! La furia si affievolisce gradualmente nel tempo, ma più lentamente se ha pochi HP. La furia può far sì che il Berserker infligga fino al 50% di danni in più. Al massimo della furia può andare in berserk, ottenendo un'esplosione di scudo e mantenendo la furia finché ha scudi a disposizione. Lo scudo aumenta con il livello dell'armatura del Berserker e può essere notevolmente potenziato se ha pochi HP. Il Berserker ha bisogno di tempo per riprendersi dopo essere andato in berserk.
actors.hero.herosubclass.berserker_short_desc=Il _Berserker_ accumula rabbia man mano che subisce danni. La rabbia aumenta il suo danno e può essere attivata al 100% per ottenere uno scudo bonus.
actors.hero.herosubclass.champion=campione
actors.hero.herosubclass.champion_desc=La Campionessa è una maestra delle armi da mischia che può equipaggiare un'arma secondaria oltre a quella primaria. I suoi attacchi normali usano l'arma primaria, ma può scambiarla istantaneamente e usare l'abilità di una delle due armi. Inoltre, ottiene 2 cariche massime aggiuntive per l'abilità dell'arma e una velocità di ricarica dell'abilità dell'arma aumentata del 50%.
actors.hero.herosubclass.champion_short_desc=La _Campionessa_ può impugnare due armi e ottiene più cariche per le armi. I suoi attacchi normali utilizzano la sua arma principale, ma può scambiare le armi e usare l'abilità di entrambe.
actors.hero.herosubclass.freerunner=corridore libero
actors.hero.herosubclass.freerunner_desc=Mentre il Freerunner si muove, accumula slancio. Può guadagnare fino a 10 slancio dopo aver corso per 10 turni, ma lo perde rapidamente se si ferma. Il freerunner può usare il suo slancio per iniziare il freerunning, per 2 turni per ogni punto di slancio. Quando è in freerunning, il Freerunner si muove a velocità doppia e ottiene un bonus di evasione proporzionale al suo livello. Una volta terminato il freerunning, c'è un tempo di ricarica prima che lo slancio possa essere accumulato di nuovo.
actors.hero.herosubclass.freerunner_short_desc=Il _Freerunner_ accumula slancio mentre corre, che può essere utilizzato per iniziare il freerunning. Questo gli garantisce velocità e schivata bonus per un breve periodo.
actors.hero.herosubclass.gladiator=gladiatore
actors.hero.herosubclass.gladiator_desc=Il Gladiatore accumula un punto combo ogni volta che effettua un attacco riuscito con un'arma da mischia o da lancio. Se il Gladiatore non effettua un attacco riuscito entro 5 turni (15 turni dopo un'uccisione), la sua combo viene azzerata.\n\nMentre accumula combo, il Gladiatore può utilizzare una varietà di abilità che hanno la garanzia di colpire:\n2 Combo: respinge il nemico, preserva la combo\n4 Combo: infligge danni in base all'armatura\n6 Combo: para, preserva la combo\n8 Combo: danneggia il bersaglio e i nemici vicini\n10 Combo: attacca una volta per ogni combo
actors.hero.herosubclass.gladiator_short_desc=Il _Gladiatore_ accumula combo quando effettua attacchi a segno. Può spendere la combo per utilizzare abilità uniche.
actors.hero.herosubclass.monk=monaco
actors.hero.herosubclass.monk_desc=La Monaca è una maestra della tecnica fisica. Sconfiggendo i nemici, accumula energia che può essere utilizzata per una varietà di abilità difensive e di supporto. Questa energia non si esaurisce nel tempo, ma ha un limite massimo basato sul livello della Monaca.\n\n1 Energia: colpisci rapidamente con i pugni\n2 Energia: concentrati per schivare il prossimo attacco\n3 Energia: scatta istantaneamente nelle vicinanze\n4 Energia: calcia via un nemico\n5 Energia: medita per rimuovere gli stati alterati e ripristinare la carica della bacchetta e dell'artefatto
actors.hero.herosubclass.monk_short_desc=Il Monaco accumula energia durante il combattimento. Questa energia può essere spesa per utilizzare una varietà di abilità uniche.
actors.hero.herosubclass.paladin=paladino
actors.hero.herosubclass.paladin_desc=Il Paladino ottiene una varietà di incantesimi nuovi e potenziati che enfatizzano il combattimento corpo a corpo e la sinergia con armi e armature. Gli incantesimi _Arma Sacra_ e _Protezione Sacra_ del Paladino conferiscono bonus maggiori, non sovrascrivono più incantesimi e glifi esistenti e possono essere estesi lanciando altri incantesimi. Il Paladino ottiene anche l'incantesimo _Colpo Divino_, che gli permette di eseguire un colpo in mischia garantito con danni bonus e potere di incantamento.
actors.hero.herosubclass.paladin_short_desc=Il _Paladino_ ottiene nuovi incantesimi a corto raggio e versioni potenziate di arma sacra e scudo.
actors.hero.herosubclass.priest=sacerdote
actors.hero.herosubclass.priest_desc=Il Sacerdote ottiene una varietà di incantesimi nuovi e potenziati che enfatizzano il combattimento a distanza e la sinergia con gli oggetti magici. Il Sacerdote può lanciare _Luce Guida_ gratuitamente una volta ogni 50 turni, illumina i nemici direttamente bersagliati da uno qualsiasi dei suoi incantesimi e può consumare il debuff di illuminazione con alleati, bacchette e alcuni artefatti per danni bonus pari al loro livello + 5. Il Sacerdote ottiene anche l'incantesimo _Splendore_, che dissipa l'oscurità e colpisce tutti i nemici visibili, attivando e applicando illuminazione e stordendoli brevemente al costo di 2 cariche.
actors.hero.herosubclass.priest_short_desc=Il _Sacerdote_ ottiene nuovi incantesimi a lungo raggio e una versione potenziata di luce guida.
actors.hero.herosubclass.sniper=cecchino
actors.hero.herosubclass.sniper_desc=La Cecchina è una maestra del combattimento a distanza, i cui attacchi a distanza trafiggono l'armatura nemica. Quando attacca un nemico con un'arma da lancio, gli imprime un marchio da cecchino, che le permette di sferrare un attacco speciale con il suo arco. Questo attacco speciale varia in base al potenziamento dell'arco. Un arco non potenziato sparerà un colpo rapido che infligge danni ridotti ma è istantaneo. Un arco veloce sparerà una raffica di tre frecce che infliggono danni ridotti, possono comunque attivare incantesimi e richiedono 1 turno per essere sparate. Un arco potenziato per il danno sparerà un colpo da cecchino che è garantito per colpire, infligge danni bonus in base alla distanza e richiede 2 turni per essere sparato.
actors.hero.herosubclass.sniper_short_desc=La _Cecchino_ può perforare le armature con i suoi attacchi a distanza. Dopo aver colpito con un'arma da lancio, può proseguire con un attacco speciale con il suo arco.
actors.hero.herosubclass.warden=guardiano
actors.hero.herosubclass.warden_desc=La Guardiana ha una forte connessione con la natura che le conferisce una varietà di effetti bonus relativi all'erba e alle piante. È in grado di vedere attraverso l'erba alta e solcata come se fosse spazio vuoto. La Guardiana fa germogliare l'erba intorno a qualsiasi seme che lancia o pianta e ottiene effetti speciali quando calpesta le piante. Questi effetti speciali sostituiscono i normali effetti delle piante, il che significa che nessuna pianta è dannosa per lei se la calpesta.
actors.hero.herosubclass.warden_short_desc=La _Guardiana_ può vedere attraverso l'erba alta e ottiene effetti bonus quando pianta semi e calpesta le piante.
actors.hero.herosubclass.warlock=stregone
actors.hero.herosubclass.warlock_desc=Lo Stregone ha una probabilità di infliggere un marchio dell'anima ai personaggi quando usa le bacchette su di loro. La probabilità di applicare un marchio dell'anima e la sua durata aumentano con il livello della bacchetta. Quando un nemico è marchiato dall'anima, lo Stregone cura 2 punti ferita per ogni 5 danni che gli infligge, ma solo con attacchi da mischia o con armi da lancio, non con le bacchette!
actors.hero.herosubclass.warlock_short_desc=Lo stregone ha la possibilità di marchiare l'anima dei nemici con le sue bacchette. Si curerà ogni volta che infligge danni fisici ai nemici marchiati.
actors.hero.spells.auraofprotection$aurabuff.desc=Il Paladino sta irradiando energia protettiva intorno a sé.\n\nQualsiasi alleato nelle vicinanze (incluso il Paladino stesso) subisce danni ridotti e ottiene l'effetto del glifo dell'armatura del Paladino con potenza aumentata.\n\nTurni rimanenti: %s.
actors.hero.spells.auraofprotection$aurabuff.name=aura di protezione
actors.hero.spells.auraofprotection.desc=Il Paladino inizia a irradiare energia protettiva in un'aura scintillante intorno a sé per 20 turni. Qualsiasi alleato entro 2 caselle dal Paladino (incluso lui stesso) subisce %1$d%% danni in meno e ottiene l'effetto del glifo dell'armatura del Paladino con +%2$d%% potenza.\n\nQuesta riduzione del danno si applica prima di altri effetti di riduzione del danno (ad esempio l'armatura). Il potenziamento della potenza del glifo si applicherà sempre, ma questo incantesimo non può far sì che il glifo del Paladino si applichi più di una volta se un personaggio ne sta già beneficiando (ad esempio il Paladino stesso o un'immagine prismatica).
actors.hero.spells.auraofprotection.name=aura di protezione
actors.hero.spells.auraofprotection.short_desc=Aumenta la difesa del Paladino e degli alleati vicini.
actors.hero.spells.beamingray$beamingrayboost.desc=Questo alleato è stato recentemente teletrasportato da Raggio Radioso, conferendogli danni bonus contro il nemico più vicino dopo il teletrasporto. Anche Potere di Molti non scade quando questo potenziamento è attivo.\n\nTurni rimanenti: %s.
actors.hero.spells.beamingray$beamingrayboost.name=raggio luminoso
actors.hero.spells.beamingray.desc=Il Chierico incanala il potere del suo alleato in un raggio di luce che lo teletrasporta in una posizione. Se il raggio si scontra con un nemico, posizionerà l'alleato nelle vicinanze e lo dirigerà verso il nemico. Il raggio ha una portata massima di tessere e aumenterà il danno bonus di Potere di Molti a + per 10 turni contro il nemico più vicino entro 4 tessere. Il raggio può anche teletrasportare alleati normalmente immobili, ma in questi casi la sua portata è dimezzata.
actors.hero.spells.beamingray.name=raggio luminoso
actors.hero.spells.beamingray.no_space=Non c'è spazio perché il tuo alleato compaia lì.
actors.hero.spells.beamingray.out_of_range=Quella posizione è fuori dalla portata.
actors.hero.spells.beamingray.short_desc=Teletrasporta il tuo alleato e gli conferisce danni bonus.
actors.hero.spells.blessspell.desc=Il Chierico lancia una benedizione sacra su se stesso o su un altro personaggio che può vedere. Quando lanciato su se stesso, l'effetto è più debole, garantendo %1$d turni di benedizione e %2$d barriera. Quando lanciato su altri personaggi, l'incantesimo è più potente, garantendo %3$d turni di benedizione e %4$d guarigione. La guarigione in eccesso viene convertita in barriera.
actors.hero.spells.blessspell.name=benedire
actors.hero.spells.blessspell.short_desc=Il chierico benedice e protegge, benedice e guarisce gli altri.
actors.hero.spells.bodyform$bodyformbuff.desc=La forma corporea di Trinity ti sta attualmente conferendo il potere di un incantesimo o glifo, come se lo avessi equipaggiato sulla tua arma o armatura attuale.\n\nNota che la forma corporea non può fornire un'altra copia di un effetto di cui stai già beneficiando.\n\nEffetto attuale: %1$s.\n\nTurni rimanenti: %2$s.
actors.hero.spells.bodyform$bodyformbuff.name=forma del corpo
actors.hero.spells.bodyform.desc=Il Chierico sceglie un incantesimo o un glifo che ha identificato in questa partita e infonde Trinity con il suo effetto. Quando Trinity viene usata, il Chierico ottiene l'effetto dell'incantesimo o del glifo scelto per %d turni. Questo incantesimo o glifo temporaneo funzionerà con qualsiasi effetto che funzionerebbe con un normale incantesimo o glifo. Questa magia sostituisce qualsiasi altro effetto sul corpo con cui Trinity è attualmente infusa.
actors.hero.spells.bodyform.name=forma del corpo
actors.hero.spells.bodyform.short_desc=Assegna Trinity a un incantesimo o a un glifo.
actors.hero.spells.cleanse.desc=Il Chierico rimuove tutti gli effetti di stato negativi su se stesso e sugli alleati visibili. Al termine dell'incantesimo, tutti i personaggi interessati ottengono anche %1$d turni di immunità ai debuff e %2$d di barriera.
actors.hero.spells.cleanse.name=purificare
actors.hero.spells.cleanse.short_desc=Rimuove gli effetti negativi e conferisce uno scudo.
actors.hero.spells.clericspell.charge_cost=Costo di ricarica: %d
actors.hero.spells.clericspell.invalid_enemy=Non puoi prendere di mira quel nemico.
actors.hero.spells.clericspell.invalid_target=Non è possibile selezionare quella posizione come destinazione.
actors.hero.spells.clericspell.no_target=Lì non c'è nessun bersaglio.
actors.hero.spells.clericspell.prompt=Scegli un obiettivo
actors.hero.spells.divineintervention.desc=Il Chierico riversa un'enorme quantità di potere dal suo tomo su se stesso e sugli alleati, potenziando tutti a %1$d di scudo ed estendendo la Forma Ascesa di %2$d turni. L'incredibile potere difensivo di questo incantesimo è bilanciato dal suo altissimo costo di carica.\n\nProprio come gli altri scudi conferiti dalla forma ascesa, questo scudo non decade normalmente, ma scadrà immediatamente al termine della forma ascesa.
actors.hero.spells.divineintervention.name=intervento divino
actors.hero.spells.divineintervention.short_desc=Potenziamento massiccio dello scudo per il Chierico e gli alleati.
actors.hero.spells.divinesense$divinesensetracker.desc=Questo personaggio è temporaneamente in grado di vedere altre creature vicine con la mente!\n\nTurni rimanenti: %s.
actors.hero.spells.divinesense$divinesensetracker.name=senso divino
actors.hero.spells.divinesense.desc=Il Chierico concentra i suoi sensi sull'ambiente circostante, ottenendo la visione mentale con un raggio di %d caselle per 50 turni. Questo incantesimo non richiede tempo di lancio.
actors.hero.spells.divinesense.name=senso divino
actors.hero.spells.divinesense.short_desc=Acquisire una visione mentale temporanea in un ampio raggio.
actors.hero.spells.flash.desc=Il Chierico incanala la sua forma ascesa in un luogo vicino e vi si teletrasporta. Lampo può teletrasportare il Chierico in qualsiasi luogo scoperto che si trovi nel raggio d'azione e non occupato. Questo incantesimo costa più cariche del tomo ogni volta che viene utilizzato nella stessa forma ascesa.
actors.hero.spells.flash.name=flash
actors.hero.spells.flash.prompt=Scegli una località
actors.hero.spells.flash.short_desc=Teletrasportati in un luogo vicino.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.desc=Il Sacerdote potrà lanciare di nuovo Luce Guida gratuitamente dopo 50 turni.\n\nTurni rimanenti: %s.
actors.hero.spells.guidinglight$guidinglightpriestcooldown.name=Luce guida
actors.hero.spells.guidinglight$illuminated.desc=Questo personaggio emana una luce intensa a causa dell'impatto con una luce guida. Sebbene il bagliore non sia abbastanza forte da illuminare l'area circostante, l'effetto magico renderà molto più facile per il Chierico colpirlo.
actors.hero.spells.guidinglight$illuminated.desc_generic=Altri eroi possono comunque usare Illuminato per beneficiare del talento Luce Ardente, ma non otterranno alcun aumento di precisione.
actors.hero.spells.guidinglight$illuminated.desc_priest=Il Sacerdote può inoltre consumare l'effetto "illuminato" con la radiosità, un colpo di bacchetta, un attacco di un alleato o gli effetti di alcuni artefatti. Usare "illuminato" in questo modo infliggerà danni magici bonus pari al livello del Sacerdote + 5.
actors.hero.spells.guidinglight$illuminated.name=illuminato
actors.hero.spells.guidinglight.desc=Il Chierico scaglia un dardo di energia magica che colpisce un bersaglio, infliggendo da 2 a 8 danni e illuminandolo. Il successivo attacco fisico non appesantito effettuato contro un nemico illuminato lo colpirà sicuramente.
actors.hero.spells.guidinglight.desc_priest=_Questo incantesimo è più potente se lanciato dal Sacerdote._ Il primo lancio dell'incantesimo ogni 50 turni non costa cariche di tomo e l'illuminazione verrà consumata da splendore, bacchette, altri personaggi e artefatti che influenzano direttamente i nemici. Quando illuminato viene utilizzato in questo modo, infligge danni magici bonus pari al livello del Sacerdote + 5.
actors.hero.spells.guidinglight.name=Luce guida
actors.hero.spells.guidinglight.short_desc=Infligge danni magici a distanza e garantisce un colpo a segno.
actors.hero.spells.hallowedground$hallowedterrain.desc=Questo luogo è stato consacrato. Il terreno consacrato rallenta i nemici, cura gli alleati e fa crescere l'erba.
actors.hero.spells.hallowedground.desc=Il Sacerdote concentra la sua magia divina nel terreno vicino, creando un'area di terreno consacrato di %1$dx%1$d per 20 turni.\n\nQuando viene lanciato, questo incantesimo cura tutti gli alleati di 15 HP (gli alleati sani e il Sacerdote ottengono uno scudo), radica brevemente i nemici e diffonde erba bassa.\n\nIl terreno consacrato cura gli alleati di 1 HP per turno (gli alleati sani e il Sacerdote ottengono uno scudo), paralizza i nemici e fa crescere casualmente erba alta.\n\nIl terreno consacrato viene distrutto dal fuoco e produrrà erba solcata se gli effetti di rigenerazione passiva sono disabilitati o il Sacerdote non ha guadagnato esperienza per un po'.
actors.hero.spells.hallowedground.name=terra consacrata
actors.hero.spells.hallowedground.prompt=Scegli una località
actors.hero.spells.hallowedground.short_desc=Cura gli alleati, rallenta i nemici e diffonde l'erba in un'area d'effetto.
actors.hero.spells.holyintuition.cursed=Avverti una magia malevola che si cela all'interno di questo oggetto.
actors.hero.spells.holyintuition.desc=Il Chierico concentra i suoi sensi su un oggetto e determina se è maledetto o meno senza doverlo equipaggiare.
actors.hero.spells.holyintuition.name=santa intuizione
actors.hero.spells.holyintuition.prompt=scegli un elemento
actors.hero.spells.holyintuition.short_desc=identifica se un oggetto è maledetto o meno.
actors.hero.spells.holyintuition.uncursed=Questo oggetto è esente da magia malevola.
actors.hero.spells.holylance$lancecooldown.desc=Il sacerdote ha lanciato di recente Lancia Sacra e deve attendere prima di poterla lanciare di nuovo.\n\nTurni rimanenti: %s.
actors.hero.spells.holylance$lancecooldown.name=tempo di ricarica della lancia sacra
actors.hero.spells.holylance.desc=Il Sacerdote concentra una grande quantità di energia in una devastante lancia di luce. Questa lancia infligge %1$d-%2$d danni e infligge sempre il massimo danno ai bersagli non morti e demoniaci.\n\nQuesto incantesimo è molto costoso e ha un tempo di ricarica di 30 turni.
actors.hero.spells.holylance.name=lancia sacra
actors.hero.spells.holylance.short_desc=Infligge ingenti danni magici a distanza.
actors.hero.spells.holyward$holyarmbuff.desc=Il Chierico ha infuso la sua armatura logora con energia sacra, sovrascrivendo temporaneamente qualsiasi glifo esistente e facendo sì che l'armatura blocchi 1 punto di danno extra.\n\nTurni rimanenti: %s.
actors.hero.spells.holyward$holyarmbuff.desc_paladin=Il Paladino ha infuso la sua armatura usurata con energia sacra, facendo sì che l'armatura blocchi 3 punti di danno extra.\n\nLanciare altri incantesimi mentre la protezione sacra è attiva estenderà la sua durata di 10 turni per carica spesa.\n\nTurni rimanenti: %s.
actors.hero.spells.holyward$holyarmbuff.name=reparto sacro
actors.hero.spells.holyward.desc=Il Chierico infonde la sua armatura usurata con glifi di luce sacra, aumentando di 1 il blocco dei danni dell'armatura. Questo incantesimo non richiede tempo di lancio. Questo glifo dura 50 turni e sovrascriverà qualsiasi glifo benefico presente sull'armatura per tutta la sua durata. Il Chierico beneficerà di questo effetto anche se non indossa alcuna armatura.
actors.hero.spells.holyward.desc_paladin=_Questo incantesimo è più potente se lanciato dal Paladino._ Il blocco del danno aggiuntivo è aumentato a 3, l'incantesimo non sovrascrive più i glifi esistenti e lanciare altri incantesimi mentre Scudo Sacro è attivo ne estenderà la durata di 10 turni per carica utilizzata.
actors.hero.spells.holyward.glyph_desc=Questo glifo aumenta leggermente la quantità di danni che un'armatura può bloccare.
actors.hero.spells.holyward.glyph_name=%s di luce
actors.hero.spells.holyward.name=reparto sacro
actors.hero.spells.holyward.short_desc=Sovrascrive temporaneamente i glifi per potenziare la parata dell'armatura.
actors.hero.spells.holyweapon$holywepbuff.desc=Il Chierico ha infuso la sua arma usurata con energia sacra, annullando temporaneamente qualsiasi incantesimo esistente e facendo sì che l'arma infligga 2 danni magici extra ad ogni attacco.\n\nTurni rimanenti: %s.
actors.hero.spells.holyweapon$holywepbuff.desc_paladin=Il Paladino ha infuso la sua arma indossata con energia sacra, facendo sì che i suoi attacchi infliggano 6 danni magici extra.\n\nLanciare altri incantesimi mentre Arma Sacra è attiva estenderà la sua durata di 10 turni per carica spesa.\n\nTurni rimanenti: %s.
actors.hero.spells.holyweapon$holywepbuff.name=arma sacra
actors.hero.spells.holyweapon.desc=Il Chierico incanta la sua arma indossata con energia sacra, facendo sì che l'arma infligga 2 danni magici aggiuntivi ogni volta che colpisce un nemico con essa. Questo incantesimo non richiede tempo di lancio. Questo incantesimo dura 50 turni e sovrascriverà qualsiasi incantesimo benefico presente sull'arma per tutta la sua durata. Anche gli attacchi senz'armi possono beneficiare di questo effetto.
actors.hero.spells.holyweapon.desc_paladin=_Questo incantesimo è più potente se lanciato dal Paladino._ Il danno magico aggiuntivo è aumentato a 6, l'incantesimo non sovrascrive più gli incantesimi esistenti e lanciare altri incantesimi mentre Arma Sacra è attiva ne estenderà la durata di 10 turni per carica utilizzata.
actors.hero.spells.holyweapon.ench_desc=I nemici colpiti da un'arma sacra subiranno danni magici aggiuntivi.
actors.hero.spells.holyweapon.ench_name=santo %s
actors.hero.spells.holyweapon.name=arma sacra
actors.hero.spells.holyweapon.short_desc=Annulla temporaneamente gli incantesimi per aumentare il danno.
actors.hero.spells.judgement.desc=Il Chierico sbatte il pugno a terra, provocando un'eruzione di luce che infligge danni a tutti i nemici che può vedere. Questo infligge %1$d-%2$d danni di base, ma infligge anche 33%% danni aggiuntivi per ogni incantesimo che il Chierico ha lanciato da quando è entrato in forma ascesa (o da quando ha lanciato Giudizio l'ultima volta).\n\nAttualmente Giudizio infliggerà %3$d-%4$d danni.
actors.hero.spells.judgement.name=sentenza
actors.hero.spells.judgement.short_desc=Danneggia tutti i nemici visibili.
actors.hero.spells.layonhands.desc=Il Paladino incanala l'energia sacra attraverso le sue mani, curando o proteggendo qualsiasi cosa tocchi. Il Paladino può lanciare questo incantesimo su qualsiasi personaggio adiacente per dargli cura, oppure su se stesso per ottenere protezione. La cura in eccesso di questo incantesimo viene convertita in protezione. Questo incantesimo viene lanciato istantaneamente e può essere lanciato ripetutamente, ma non può fornire protezione per più di tre lanci alla volta.
actors.hero.spells.layonhands.name=imposizione delle mani
actors.hero.spells.layonhands.short_desc=Cura istantaneamente un personaggio adiacente o protegge il Paladino con uno scudo.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.desc=Il Chierico ha recentemente lanciato Legame Vitale su questo alleato.\n\nOltre ai normali benefici di Legame Vitale, questo personaggio subisce anche danni ridotti, tutti gli incantesimi positivi del Chierico vengono applicati sia al Chierico che a questo alleato invece che a uno solo, e Potere di Molti non scade finché questo potenziamento è attivo.\n\nTurni rimanenti: %s.
actors.hero.spells.lifelinkspell$lifelinkspellbuff.name=protezione del legame vitale
actors.hero.spells.lifelinkspell.desc=Il Chierico rafforza il legame tra sé stesso e il suo alleato potenziato. Con questo legame potenziato, qualsiasi danno subito verrà condiviso tra l'eroe e il suo alleato per %1$d turni, e il bonus difensivo di Potere di Molti verrà aumentato a -%2$d%% danni subiti. Nota che il danno viene condiviso dopo l'armatura, ma prima della riduzione del danno di Potere di Molti.\n\nMentre questo effetto è attivo, gli incantesimi benefici del Chierico di T3 o inferiore si applicheranno sia al Chierico che al suo alleato se si sarebbero applicati solo a uno di loro.
actors.hero.spells.lifelinkspell.name=legame vitale
actors.hero.spells.lifelinkspell.short_desc=Condivide il danno con un alleato e riduce il danno da lui subito.
actors.hero.spells.mindform.desc=Il Chierico sceglie una bacchetta o un'arma da lancio che ha identificato in questa sessione e infonde Trinity con il suo effetto. Quando Trinity viene utilizzata, il Chierico può effettuare un singolo attacco come se stesse usando l'oggetto scelto a +%d. Questo attiverà tutti gli effetti che l'uso di quel tipo di oggetto attiverebbe normalmente. Questo incantesimo sostituisce qualsiasi altro effetto mentale con cui Trinity è attualmente infusa.
actors.hero.spells.mindform.name=forma mentale
actors.hero.spells.mindform.short_desc=Assegna l'abilità Trinità a una bacchetta o a un'arma da lancio.
actors.hero.spells.mnemonicprayer.desc=Il Sacerdote pronuncia una preghiera che estende la durata di tutti i buff o debuff su un bersaglio specifico di %1$d turni. Questo incantesimo non richiede tempo di lancio. Gli effetti positivi dureranno più a lungo sugli alleati (incluso il Sacerdote stesso), e gli effetti negativi dureranno più a lungo sui nemici. La Preghiera Mnemonica può estendere una singola istanza di un buff o debuff una sola volta e non può estendere i buff conferiti dalle abilità dell'armatura.
actors.hero.spells.mnemonicprayer.name=preghiera mnemonica
actors.hero.spells.mnemonicprayer.short_desc=Estende i buff/debuff su un alleato/nemico e riapplica quelli illuminati.
actors.hero.spells.radiance.desc=Il Sacerdote emana una luce sacra, stordendo tutti i nemici visibili per 3 turni. Se un nemico è già illuminato, Radiance attiverà il bonus di danno di Illuminate e applicherà il debuff Illuminato. Radiance farà anche brillare il Sacerdote per 100 turni se il piano attuale è buio.
actors.hero.spells.radiance.name=splendore
actors.hero.spells.radiance.short_desc=Illumina e stordisce brevemente i nemici visibili.
actors.hero.spells.recallinscription$useditemtracker.desc=Il Chierico ha recentemente utilizzato un oggetto che funziona con l'incantesimo di richiamo inciso. Il Chierico può lanciare l'incantesimo per ripetere l'effetto dell'oggetto.\n\nOggetto utilizzato: %1$s.\n\nTurni rimanenti: %2$s.
actors.hero.spells.recallinscription$useditemtracker.name=runa usata di recente
actors.hero.spells.recallinscription.desc=Il Chierico usa la magia sacra per riattivare l'effetto di una runa magica trovata su una pietra runica o una pergamena usata negli ultimi %s turni.\n\nRichiamo Iscrizione non può essere usato per replicare pergamene di potenziamento. Il costo di carica di questo incantesimo varia in base all'oggetto usato di recente: 2 per una pietra runica, 3 per una pergamena, 4 per una pergamena esotica. Questo costo di carica è inoltre raddoppiato quando si replica una pergamena di trasmutazione o oggetti alchemici che devono essere creati usando trasmutazione o potenziamento.
actors.hero.spells.recallinscription.name=richiamo iscrizione
actors.hero.spells.recallinscription.short_desc=Ripete una runa o una pergamena utilizzata di recente.
actors.hero.spells.shieldoflight$shieldoflighttracker.desc=Un sottile scudo di luce si frappone tra questo personaggio e un nemico. Non è abbastanza forte da bloccare completamente gli attacchi, ma li attenuerà.\n\nTurni rimanenti: %s
actors.hero.spells.shieldoflight$shieldoflighttracker.name=scudo di luce
actors.hero.spells.shieldoflight.desc=Il Chierico crea una sottile barriera di luce tra sé e un nemico, aumentando la potenza di blocco della sua armatura contro quel nemico di %1$d-%2$d per 5 turni.\n\nQuesto incantesimo non richiede tempo per essere lanciato, ma non può essere usato contro più bersagli contemporaneamente.
actors.hero.spells.shieldoflight.name=scudo di luce
actors.hero.spells.shieldoflight.short_desc=Conferisce una protezione temporanea contro un bersaglio.
actors.hero.spells.smite.desc=Il Paladino infonde un colpo in mischia con un giusto potere distruttivo.\n\nOltre a infliggere danni da mischia normali, Smite garantisce il colpo a segno con gli attacchi non appesantiti, ha +300%% potere di incantamento e infligge %1$d - %2$d danni magici bonus.\n\nI danni magici bonus di Smite scalano con il livello del Paladino e infliggeranno sempre il massimo danno magico bonus contro nemici non morti o demoniaci.
actors.hero.spells.smite.name=colpire
actors.hero.spells.smite.short_desc=Garantisce un colpo a segno con danni bonus e potere di incantesimo.
actors.hero.spells.spiritform$spiritformbuff.desc=La forma spirituale di Trinity ti sta attualmente conferendo il potere di un oggetto, come se lo avessi equipaggiato.\n\nNota che la forma spirituale non può fornire un'altra copia di un effetto di cui stai già beneficiando.\n\nEffetto attuale: %1$s.\n\nTurni rimanenti: %2$s.
actors.hero.spells.spiritform$spiritformbuff.name=forma spirituale
actors.hero.spells.spiritform.desc=Il Chierico sceglie un anello o un artefatto che ha identificato in questa partita (tranne il tomo sacro) e infonde Trinity con il suo effetto. Se viene scelto un anello, Trinity concede l'effetto di quell'anello a + per 20 turni. Se viene scelto un artefatto, Trinity replica l'effetto di quell'artefatto a +. Ogni artefatto ha comportamenti specifici e costi di carica dell'armatura diversi quando usato con Trinity. Questo incantesimo sostituisce qualsiasi altro effetto spirituale con cui Trinity è attualmente infusa.
actors.hero.spells.spiritform.name=forma spirituale
actors.hero.spells.spiritform.short_desc=Assegna la Trinità a un anello o a un artefatto.
actors.hero.spells.stasis$stasisbuff.desc=Il Chierico ha attualmente un alleato in stasi. Tutti gli effetti positivi su questo alleato vengono conservati, incluso Potere di Molti, e riappariranno accanto al Chierico al termine dell'effetto. L'effetto può anche essere interrotto anticipatamente lanciando nuovamente Stasi.\n\nAlleato in stasi: %1$s.\nTurni rimanenti: %2$s.
actors.hero.spells.stasis$stasisbuff.left_behind=Il tuo alleato immobile viene lasciato indietro.
actors.hero.spells.stasis$stasisbuff.name=alleato in stasi
actors.hero.spells.stasis.desc=Il Chierico concentra la sua connessione con l'alleato verso di sé, facendo sì che l'alleato venga temporaneamente trattenuto in una sorta di stasi energetica all'interno del Chierico. L'alleato verrà preservato per un massimo di %d turni, e tutti gli effetti positivi su di lui non saranno influenzati dal tempo trascorso in stasi.\n\nL'alleato apparirà accanto al Chierico quando la stasi termina naturalmente oppure può lanciare nuovamente l'incantesimo senza costi per terminare l'effetto in anticipo. La stasi può anche spostare gli alleati immobili, ma non può trasferirli tra i piani.
actors.hero.spells.stasis.name=stasi
actors.hero.spells.stasis.short_desc=Rimuove l'alleato dal dungeon e lo preserva.
actors.hero.spells.sunray.desc=Il Chierico scaglia un raggio di luce accecante contro un bersaglio, infliggendo %1$d-%2$d danni e accecandolo per %3$d turni. Raggio Solare infligge sempre il massimo danno ai bersagli non morti e demoniaci.\n\nDopo essere stato colpito da questo incantesimo, la vista di un nemico si adatterà, impedendogli di essere accecato di nuovo. Tuttavia, se viene colpito di nuovo mentre è accecato da questo incantesimo, la luce è travolgente e lo paralizza.
actors.hero.spells.sunray.name=raggio di sole
actors.hero.spells.sunray.short_desc=Infligge danni magici a distanza e acceca un bersaglio una sola volta.
actors.hero.spells.walloflight$lightwall.desc=Pannelli di luce scintillante bloccano il passaggio.
actors.hero.spells.walloflight.desc=Il Paladino crea un muro fatto di pannelli di luce solida direttamente di fronte a sé, spesso 1 casella, largo %1$d caselle e che dura per 20 turni.\n\nQuesto muro funziona esattamente come un muro normale, tranne per il fatto che è trasparente. I nemici che rimangono intrappolati nel muro quando viene creato saranno momentaneamente storditi e respinti, se possibile. Qualsiasi cosa bloccata nel muro sarà in grado di uscirne.\n\nIl muro può essere lanciato in una qualsiasi delle quattro direzioni cardinali o delle quattro diagonali. Se un muro è già attivo, l'incantesimo può essere riutilizzato gratuitamente per rimuoverlo istantaneamente.
actors.hero.spells.walloflight.early_end=Dissipi il muro di luce.
actors.hero.spells.walloflight.name=parete di luce
actors.hero.spells.walloflight.short_desc=Crea un muro che blocca i nemici.
actors.hero.talent$aggressivebarriercooldown.desc=Hai usato di recente questo talento e devi aspettare prima di poterlo usare di nuovo.\n\nTurni rimanenti: %s.
actors.hero.talent$aggressivebarriercooldown.name=raffreddamento aggressivo della barriera
actors.hero.talent$combinedlethalityabilitytracker.executed=eseguito
actors.hero.talent$deadlyfollowuptracker.desc=La Duellante ha recentemente attaccato un nemico con un'arma da lancio, i suoi attacchi in mischia contro lo stesso bersaglio avranno danni aumentati.\n\nTurni rimanenti: %s.
actors.hero.talent$deadlyfollowuptracker.name=seguito mortale
actors.hero.talent$followupstriketracker.desc=La cacciatrice ha recentemente attaccato un nemico con un'arma da lancio, il suo prossimo attacco in mischia contro lo stesso bersaglio avrà danni aumentati.\n\nTurni rimanenti: %s.
actors.hero.talent$followupstriketracker.name=colpo successivo
actors.hero.talent$improvisedprojectilecooldown.desc=Hai usato di recente questo talento e devi aspettare prima di poterlo usare di nuovo.\n\nTurni rimanenti: %s.
actors.hero.talent$improvisedprojectilecooldown.name=tempo di raffreddamento dei proiettili improvvisati
actors.hero.talent$lethalhastecooldown.desc=Hai usato di recente questo talento e devi aspettare prima di poterlo usare di nuovo.\n\nTurni rimanenti: %s.
actors.hero.talent$lethalhastecooldown.name=tempo di ricarica di Letale Haste
actors.hero.talent$lingeringmagictracker.desc=Il mago ha usato di recente un bastone o una bacchetta, il suo prossimo attacco fisico infliggerà danni bonus.\n\nTurni rimanenti: %s.
actors.hero.talent$lingeringmagictracker.name=magia persistente
actors.hero.talent$liquidagilacctracker.desc=Il prossimo attacco in mischia normale del Duellante otterrà precisione bonus.\n\nTurni rimanenti: %s.
actors.hero.talent$liquidagilacctracker.name=agilità liquida
actors.hero.talent$patientstriketracker.desc=La Duellante ha appena trascorso un turno in attesa, il suo prossimo attacco in mischia infliggerà danni bonus.
actors.hero.talent$patientstriketracker.name=sciopero dei medici
actors.hero.talent$preciseassaulttracker.desc=Il prossimo attacco in mischia normale del Duellante otterrà precisione bonus.\n\nTurni rimanenti: %s.
actors.hero.talent$preciseassaulttracker.name=assalto preciso
actors.hero.talent$provokedangertracker.desc=Il guerriero ha perso di recente il suo scudo, il suo prossimo attacco fisico infliggerà danni bonus.\n\nTurni rimanenti: %s.
actors.hero.talent$provokedangertracker.name=rabbia provocata
actors.hero.talent$rejuvenatingstepscooldown.desc=Hai usato di recente questo talento e devi aspettare prima di poterlo usare di nuovo.\n\nTurni rimanenti: %s.
actors.hero.talent$rejuvenatingstepscooldown.name=passi rigeneranti raffreddamento
actors.hero.talent$satiatedspellstracker.desc=Il prossimo incantesimo lanciato dal Chierico conferirà loro una piccola quantità di protezione.
actors.hero.talent$satiatedspellstracker.name=Incantesimo di protezione
actors.hero.talent$searinglightcooldown.desc=Hai usato di recente questo talento e devi aspettare prima di poterlo usare di nuovo.\n\nTurni rimanenti: %s.
actors.hero.talent$searinglightcooldown.name=Luce bruciante
actors.hero.talent$seershotcooldown.desc=Hai usato di recente questo talento e devi aspettare prima di poterlo usare di nuovo.\n\nTurni rimanenti: %s.
actors.hero.talent$seershotcooldown.name=tempo di ricarica del colpo veggente
