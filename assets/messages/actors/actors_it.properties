actors.hero.talent.eagle_eye.title=occhio d'aquila
actors.hero.talent.elemental_power.desc=_+1:_ La potenza dell'esplosione elementale è aumentata del _25%_.\n\n_+2:_ La potenza dell'esplosione elementale è aumentata del _50%_.\n\n_+3:_ La potenza dell'esplosione elementale è aumentata del _75%_.\n\n_+4:_ La potenza dell'esplosione elementale è aumentata del _100%_.
actors.hero.talent.elemental_power.title=potere elementale
actors.hero.talent.elemental_reach.desc=_+1:_ Il raggio d'azione dell'attacco elementale è aumentato a _5 caselle_ da 4 e la sua larghezza è aumentata a _75 gradi_ da 65.\n\n_+2:_ Il raggio d'azione dell'attacco elementale è aumentato a _6 caselle_ da 4 e la sua larghezza è aumentata a _85 gradi_ da 65.\n\n_+3:_ Il raggio d'azione dell'attacco elementale è aumentato a _7 caselle_ da 4 e la sua larghezza è aumentata a _95 gradi_ da 65.\n\n_+4:_ Il raggio d'azione dell'attacco elementale è aumentato a _8 caselle_ da 4 e la sua larghezza è aumentata a _105 gradi_ da 65.
actors.hero.talent.elemental_reach.title=portata elementare
actors.hero.talent.elimination_match.desc=_+1:_ Se il Duellante sfida di nuovo entro 3 turni dalla fine di un duello, quella sfida ha un costo di carica ridotto del 16%.\n\n_+2:_ Se il Duellante sfida di nuovo entro 3 turni dalla fine di un duello, quella sfida ha un costo di carica ridotto del 30%.\n\n_+3:_ Se il Duellante sfida di nuovo entro 3 turni dalla fine di un duello, quella sfida ha un costo di carica ridotto del 40%.\n\n_+4:_ Se il Duellante sfida di nuovo entro 3 turni dalla fine di un duello, quella sfida ha un costo di carica ridotto del 50%.
actors.hero.talent.elimination_match.title=partita a eliminazione diretta
actors.hero.talent.empowered_strike.desc=_+1:_ Il primo colpo in mischia del Mago da Battaglia con il suo bastone dopo aver fulminato con esso infligge _+16% di danni_ e l'effetto bonus del bastone ottiene _+50% di potenza_.\n\n_+2:_ Il primo colpo in mischia del Mago da Battaglia con il suo bastone dopo aver fulminato con esso infligge _+33% di danni_ e l'effetto bonus del bastone ottiene _+100% di potenza_.\n\n_+3:_ Il primo colpo in mischia del Mago da Battaglia con il suo bastone dopo aver fulminato con esso infligge _+50% di danni_ e l'effetto bonus del bastone ottiene _+150% di potenza_.
actors.hero.talent.empowered_strike.title=sciopero potenziato
actors.hero.talent.empowering_meal.desc=_+1:_ Mangiare cibo conferisce al Mago _2 danni bonus_ nelle prossime 3 volte in cui infligge danni con una bacchetta.\n\n_+2:_ Mangiare cibo conferisce al Mago _3 danni bonus_ nelle prossime 3 volte in cui infligge danni con una bacchetta.
actors.hero.talent.empowering_meal.title=pasto energizzante
actors.hero.talent.endless_rage.desc=_+1:_ Il Berserker può raggiungere un massimo di _116% di furia_.\n\n_+2:_ Il Berserker può raggiungere un massimo di _133% di furia_.\n\n_+3:_ Il Berserker può raggiungere un massimo di _150% di furia_.\n\nOgni punto di furia oltre il 100% aumenta lo scudo del berserker dell'1% e riduce il tempo di ricarica dell'1%, ma non aumenta il bonus al danno oltre il +50%.
actors.hero.talent.endless_rage.title=rabbia infinita
actors.hero.talent.energizing_meal.desc=_+1:_ Mangiare cibo richiede al Mago 1 turno e gli garantisce _5 turni di ricarica della bacchetta_.\n\n_+2:_ Mangiare cibo richiede al Mago 1 turno e gli garantisce _8 turni di ricarica della bacchetta_.
actors.hero.talent.energizing_meal.title=pasto energizzante
actors.hero.talent.enhanced_combo.desc=_+1:_ Quando la combo del Gladiatore è pari o superiore a 7, il raggio di respinta di Clobber aumenta a 3, infligge vertigini e può scaraventare i nemici nelle fosse.\n\n_+2:_ Oltre ai vantaggi di +1, quando la combo del Gladiatore è pari o superiore a 9, Parry funziona su più attacchi.\n\n_+3:_ Oltre ai vantaggi di +1 e +2, il Gladiatore può saltare fino a combo/3 caselle quando usa Slam, Crush o Fury.
actors.hero.talent.enhanced_combo.title=combinazione migliorata
actors.hero.talent.enhanced_lethality.desc=_+1:_ L'Assassino può assassinare i nemici lasciati con meno del _4/13/27/67% di salute_ per livello di preparazione, rispetto al 3/10/20/50%.\n\n_+2:_ L'Assassino può assassinare i nemici lasciati con meno del _5/17/33/83% di salute_ per livello di preparazione, rispetto al 3/10/20/50%.\n\n_+3:_ L'Assassino può assassinare i nemici lasciati con meno del _6/20/40/100% di salute_ per livello di preparazione, rispetto al 3/10/20/50%.
actors.hero.talent.enhanced_lethality.title=letalità aumentata
actors.hero.talent.enhanced_rings.desc=_+1:_ Quando il Ladro usa un artefatto, i suoi anelli ottengono un potenziamento di +1 per _3 turni_.\n\n_+2:_ Quando il Ladro usa un artefatto, i suoi anelli ottengono un potenziamento di +1 per _6 turni_.\n\n_+3:_ Quando il Ladro usa un artefatto, i suoi anelli ottengono un potenziamento di +1 per _9 turni_.
actors.hero.talent.enhanced_rings.title=anelli potenziati
actors.hero.talent.enlightening_meal.desc=_+1:_ Mangiare cibo richiede al Chierico 1 turno e gli conferisce _0,67 cariche_ sul suo tomo sacro.\n\n_+2:_ Mangiare cibo richiede al Chierico 1 turno e gli conferisce _1 carica_ sul suo tomo sacro.
actors.hero.talent.enlightening_meal.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, garantirà invece 2 turni di ricarica di bacchette e artefatti a +1, oppure 3 turni a +2. Non può essere utilizzato per permettere al corno dell'abbondanza di ricaricarsi da solo.
actors.hero.talent.enlightening_meal.title=Pasto illuminante
actors.hero.talent.enraged_catalyst.desc=_+1:_ Gli incantesimi e le maledizioni sull'arma del Berserker si attivano più spesso quanto più rabbia ha, fino a un massimo del _15% più spesso_ al 100% di rabbia.\n\n_+2:_ Gli incantesimi e le maledizioni sull'arma del Berserker si attivano più spesso quanto più rabbia ha, fino a un massimo del _30% più spesso_ al 100% di rabbia.\n\n_+3:_ Gli incantesimi e le maledizioni sull'arma del Berserker si attivano più spesso quanto più rabbia ha, fino a un massimo del _45% più spesso_ al 100% di rabbia.
actors.hero.talent.enraged_catalyst.title=catalizzatore infuriato
actors.hero.talent.evasive_armor.desc=_+1:_ Durante la corsa libera, il Freerunner guadagna un ulteriore _+1 evasione_ per ogni punto di forza in eccesso sulla sua armatura.\n\n_+2:_ Durante la corsa libera, il Freerunner ottiene un ulteriore _+2 evasione_ per ogni punto di forza in eccesso sulla sua armatura.\n\n_+3:_ Durante la corsa libera, il Freerunner guadagna un ulteriore _+3 evasione_ per punto di forza in eccesso sulla sua armatura.
actors.hero.talent.evasive_armor.title=armatura evasiva
actors.hero.talent.even_the_odds.desc=_+1:_ Il guerriero infligge un bonus aggiuntivo del 5% di danni per ogni nemico entro 2 caselle quando la resistenza termina.\n\n_+2:_ Il guerriero infligge un bonus aggiuntivo del 10% di danni per ogni nemico entro 2 caselle quando la resistenza termina.\n\n_+3:_ Il guerriero infligge un bonus aggiuntivo del 15% di danni per ogni nemico entro 2 caselle quando la resistenza termina.\n\n_+4:_ Il guerriero infligge un bonus aggiuntivo del 20% di danni per ogni nemico entro 2 caselle quando la resistenza termina.
actors.hero.talent.even_the_odds.title=equilibrare le probabilità
actors.hero.talent.excess_charge.desc=_+1:_ Quando il bastone del Mago da Battaglia è completamente carico, il suo prossimo attacco gli conferirà _0,67 di scudo_ per livello del bastone.\n\n_+2:_ Quando il bastone del Mago da Battaglia è completamente carico, il suo prossimo attacco gli conferirà _1,33 di scudo_ per livello del bastone.\n\n_+3:_ Quando il bastone del Mago da Battaglia è completamente carico, il suo prossimo attacco gli conferirà _2 di scudo_ per livello del bastone.
actors.hero.talent.excess_charge.title=sovrapprezzo
actors.hero.talent.expanding_wave.desc=_+1:_ Il raggio d'azione dell'onda d'urto è aumentato a _6 caselle_ da 5 e la sua larghezza è aumentata a _75 gradi_ da 60.\n\n_+2:_ Il raggio d'azione dell'onda d'urto è aumentato a _7 caselle_ da 5 e la sua larghezza è aumentata a _90 gradi_ da 60.\n\n_+3:_ Il raggio d'azione dell'onda d'urto è aumentato a _8 caselle_ da 5 e la sua larghezza è aumentata a _105 gradi_ da 60.\n\n_+4:_ Il raggio d'azione dell'onda d'urto è aumentato a _9 caselle_ da 5 e la sua larghezza è aumentata a _120 gradi_ da 60.
actors.hero.talent.expanding_wave.title=onda in espansione
actors.hero.talent.expose_weakness.desc=_+1:_ I nemici che attaccano l'immagine residua del Duellante diventano deboli e vulnerabili per _2 turni_.\n\n_+2:_ I nemici che attaccano l'immagine residua del Duellante diventano deboli e vulnerabili per _4 turni_.\n\n_+3:_ I nemici che attaccano l'immagine residua del Duellante diventano deboli e vulnerabili per _6 turni_.\n\n_+4:_ I nemici che attaccano l'immagine residua del Duellante diventano deboli e vulnerabili per _8 turni_.
actors.hero.talent.expose_weakness.title=mettere in luce la debolezza
actors.hero.talent.fan_of_blades.desc=_+1:_ Le lame spettrali possono colpire fino a _1 bersaglio aggiuntivo_ per il 50% di danni. Il bersaglio deve essere visibile e all'interno di un'area d'effetto a cono di _30 gradi_.\n\n_+2:_ Le lame spettrali possono colpire fino a _2 bersagli aggiuntivi_ per il 50% di danni. I bersagli devono essere visibili e all'interno di un'area d'effetto a cono di _60 gradi_.\n\n_+3:_ Le lame spettrali possono colpire fino a _3 bersagli aggiuntivi_ per il 50% di danni. I bersagli devono essere visibili e all'interno di un'area d'effetto a cono di _90 gradi_.\n\n_+4:_ Le lame spettrali possono colpire fino a _4 bersagli aggiuntivi_ per il 50% di danni. I bersagli devono essere visibili e all'interno di un'area d'effetto a cono di _120 gradi_.
actors.hero.talent.fan_of_blades.title=ventaglio di lame
actors.hero.talent.farsight.desc=_+1:_ Il raggio visivo del cecchino è _aumentato del 25%_.\n\n_+2:_ Il raggio visivo del cecchino è _aumentato del 50%_.\n\n_+3:_ Il raggio visivo del cecchino è _aumentato del 75%_.
actors.hero.talent.farsight.title=lungsight
actors.hero.talent.fear_the_reaper.desc=_+1:_ Quando un nemico segnato dalla morte raggiunge 0 punti vita, diventa _invalido_.\n\n_+2:_ Quando un nemico segnato dalla morte raggiunge 0 punti vita, diventa _temuto e invalido_.\n\n_+3:_ Quando un nemico segnato dalla morte raggiunge 0 punti vita, diventa _temuto e invalido_ e i nemici entro 3 caselle diventano _invalidi_.\n\n_+4:_ Quando un nemico segnato dalla morte raggiunge 0 punti vita, diventa _temuto e invalido_ e i nemici entro 3 caselle diventano _temuti e invalidi_.
actors.hero.talent.fear_the_reaper.title=temere la morte
actors.hero.talent.feigned_retreat.desc=_+1:_ Se un nemico attacca l'immagine residua del Duellante, ottiene _2 turni_ di rapidità.\n\n_+2:_ Se un nemico attacca l'immagine residua del Duellante, ottiene _4 turni_ di rapidità.\n\n_+3:_ Se un nemico attacca l'immagine residua del Duellante, ottiene _6 turni_ di rapidità.\n\n_+4:_ Se un nemico attacca l'immagine residua del Duellante, ottiene _8 turni_ di rapidità.
actors.hero.talent.feigned_retreat.title=finta ritirata
actors.hero.talent.fire_everything.desc=_+1:_ La magia selvaggia ora si attiva _5 volte_ rispetto a 4, e ogni bacchetta ha una probabilità del _25%_ di essere utilizzabile 3 volte.\n\n_+2:_ La magia selvaggia ora si attiva _6 volte_ rispetto a 4, e ogni bacchetta ha una probabilità del _50%_ di essere utilizzabile 3 volte.\n\n_+3:_ La magia selvaggia ora si attiva _7 volte_ rispetto a 4, e ogni bacchetta ha una probabilità del _75%_ di essere utilizzabile 3 volte.\n\n_+4:_ La magia selvaggia ora si attiva _8 volte_ rispetto a 4, e ogni bacchetta ha una probabilità del _100%_ di essere utilizzabile 3 volte.
actors.hero.talent.fire_everything.title=brucia tutto
actors.hero.talent.flash.desc=_+1:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Flash_ per teletrasportarsi fino a _3 caselle_ di distanza.\n\n_+2:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Flash_ per teletrasportarsi fino a _4 caselle_ di distanza.\n\n_+3:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Flash_ per teletrasportarsi fino a _5 caselle_ di distanza.\n\n_+4:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Flash_ per teletrasportarsi fino a _6 caselle_ di distanza.\n\nFlash costa inizialmente 2 cariche del tomo e 1 carica in più per ogni utilizzo nella stessa forma ascendente.
actors.hero.talent.flash.title=flash
actors.hero.talent.focused_meal.desc=_+1:_ Mangiare cibo fa perdere al Duellante 1 turno e gli conferisce _0,67 cariche_ sulle sue armi.\n\n_+2:_ Mangiare cibo fa perdere al Duellante 1 turno e gli conferisce _1 carica_ sulle sue armi.
actors.hero.talent.focused_meal.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, conferirà invece un bonus al danno del suo prossimo colpo pari al suo livello/3 con +1, oppure al suo livello/2 con +2.
actors.hero.talent.focused_meal.title=pasto concentrato
actors.hero.talent.followup_strike.desc=_+1:_ Quando la Cacciatrice colpisce un nemico con il suo arco o un'arma da lancio, il suo prossimo attacco in mischia contro quel nemico infligge _2 danni bonus_.\n\n_+2:_ Quando la Cacciatrice colpisce un nemico con il suo arco o un'arma da lancio, il suo prossimo attacco in mischia contro quel nemico infligge _3 danni bonus_.
actors.hero.talent.followup_strike.title=colpo successivo
actors.hero.talent.go_for_the_eyes.desc=_+1:_ Gli attacchi del falco spirituale accecano i nemici per _2 turni_.\n\n_+2:_ Gli attacchi del falco spirituale accecano i nemici per _5 turni_.\n\n_+3:_ Gli attacchi del falco spirituale accecano i nemici per _5 turni_ e li paralizzano per _2 turni_.\n\n_+4:_ Gli attacchi del falco spirituale accecano i nemici per _5 turni_ e li paralizzano per _5 turni_.
actors.hero.talent.go_for_the_eyes.title=puntare agli occhi
actors.hero.talent.growing_power.desc=_+1:_ I bonus di attacco e velocità di movimento del potere della natura sono aumentati al 38% e al 125%, dal 33% e dal 100%.\n\n_+2:_ I bonus di attacco e velocità di movimento del potere della natura sono aumentati al 42% e al 150%, dal 33% e dal 100%.\n\n_+3:_ I bonus di attacco e velocità di movimento del potere della natura sono aumentati al 46% e al 175%, dal 33% e dal 100%.\n\n_+4:_ I bonus di attacco e velocità di movimento del potere della natura sono aumentati al 50% e al 200%, dal 33% e dal 100%.
actors.hero.talent.growing_power.title=potere crescente
actors.hero.talent.hallowed_ground.desc=_+1:_ Il Sacerdote può lanciare _Terreno Consacrato_, un incantesimo che consacra il terreno in un'area _3x3_ per 20 turni, al costo di 2 cariche.\n\n_+2:_ Il Sacerdote può lanciare _Terreno Consacrato_, un incantesimo che consacra il terreno in un'area _5x5_ per 20 turni, al costo di 2 cariche.\n\n_+3:_ Il Sacerdote può lanciare _Terreno Consacrato_, un incantesimo che consacra il terreno in un'area _7x7_ per 20 turni, al costo di 2 cariche.\n\nQuando viene lanciato, Terreno Consacrato cura gli alleati di 15 HP, radica brevemente i nemici e diffonde erba bassa. In seguito, cura lentamente gli alleati, paralizza i nemici e fa crescere erba alta in modo casuale. Il terreno consacrato conferisce protezione al sacerdote anziché guarigione e viene distrutto dal fuoco.
actors.hero.talent.hallowed_ground.title=terra consacrata
actors.hero.talent.hasty_retreat.desc=_+1:_ Dopo aver sbattuto le palpebre, il Ladro ottiene _1 turno_ di velocità e invisibilità.\n\n_+2:_ Dopo aver sbattuto le palpebre, il Ladro ottiene _2 turni_ di velocità e invisibilità.\n\n_+3:_ Dopo aver sbattuto le palpebre, il Ladro ottiene _3 turni_ di velocità e invisibilità.\n\n_+4:_ Dopo aver sbattuto le palpebre, il Ladro ottiene _4 turni_ di velocità e invisibilità.
actors.hero.talent.hasty_retreat.title=ritirata frettolosa
actors.hero.talent.hearty_meal.desc=_+1:_ Mangiare cibo cura il Guerriero di _4 HP_ quando ha una salute pari o inferiore al 33%.\n\n_+2:_ Mangiare cibo cura il Guerriero di _6 HP_ quando ha una salute pari o inferiore al 33%.
actors.hero.talent.hearty_meal.title=pasto abbondante
actors.hero.talent.heightened_senses.desc=_+1:_ La Cacciatrice ottiene la visione mentale sui personaggi entro _2 caselle dalla sua posizione_.\n\n_+2:_ La Cacciatrice ottiene la visione mentale sui personaggi entro _3 caselle dalla sua posizione_.
actors.hero.talent.heightened_senses.title=sensi acuiti
actors.hero.talent.heroic_energy.desc=_+1:_ L'abilità armatura dell'eroe ha un costo di carica ridotto del 12%.\n\n_+2:_ L'abilità armatura dell'eroe ha un costo di carica ridotto del 23%.\n\n_+3:_ L'abilità armatura dell'eroe ha un costo di carica ridotto del 32%.\n\n_+4:_ L'abilità armatura dell'eroe ha un costo di carica ridotto del 40%.
actors.hero.talent.heroic_energy.rat_title=energia ratroica
actors.hero.talent.heroic_energy.title=energia eroica
actors.hero.talent.hold_fast.desc=_+1:_ Quando il Guerriero aspetta, ottiene _1-2 armatura_ e rallenta il decadimento dei buff combo e scudo del _50%_ finché non si muove.\n\n_+2:_ Quando il Guerriero aspetta, ottiene _2-4 armatura_ e rallenta il decadimento dei buff combo e scudo del _75%_ finché non si muove.\n\n_+3:_ Quando il Guerriero aspetta, ottiene _3-6 armatura_ e rallenta il decadimento dei buff combo e scudo del _100%_ finché non si muove.
actors.hero.talent.hold_fast.title=tenetevi forte
actors.hero.talent.holy_intuition.desc=_+1:_ Il Chierico può lanciare _Sacra Intuizione_, un incantesimo che rivela se un oggetto è maledetto al costo di _3 cariche._\n\n_+2:_ Il Chierico può lanciare _Sacra Intuizione_, un incantesimo che rivela se un oggetto è maledetto al costo di _2 cariche._
actors.hero.talent.holy_intuition.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, permetterà invece all'eroe di identificare lo stato di maledizione su un oggetto maledetto appena prima di equipaggiarlo, il 15% delle volte con +1 o il 25% delle volte con +2.
actors.hero.talent.holy_intuition.title=santa intuizione
actors.hero.talent.holy_lance.desc=_+1:_ Il Sacerdote può lanciare _Lancia Sacra_, un incantesimo devastante che infligge _30-55 danni_ al costo di 4 cariche.\n\n_+2:_ Il Sacerdote può lanciare _Lancia Sacra_, un incantesimo devastante che infligge _45-83 danni_ al costo di 4 cariche.\n\n_+3:_ Il Sacerdote può lanciare _Lancia Sacra_, un incantesimo devastante che infligge _60-110 danni_ al costo di 4 cariche.\n\nLancia Sacra infligge sempre il massimo danno ai nemici demoniaci e non morti. La Lancia Sacra ha un tempo di ricarica di 30 turni prima di poter essere lanciata di nuovo.
actors.hero.talent.holy_lance.title=lancia sacra
actors.hero.talent.impact_wave.desc=_+1:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti vengono respinti di _2 caselle_ indietro e hanno una probabilità del _25%_ di diventare vulnerabili per 5 turni.\n\n_+2:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti vengono respinti di _3 caselle_ indietro e hanno una probabilità del _50%_ di diventare vulnerabili per 5 turni.\n\n_+3:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti vengono respinti di _4 caselle_ indietro e hanno una probabilità del _75%_ di diventare vulnerabili per 5 turni.\n\n_+4:_ Quando il Guerriero atterra dopo un salto, tutti i nemici adiacenti vengono respinti di _5 caselle_ indietro e hanno una probabilità del _100%_ di diventare vulnerabili per 5 turni.
actors.hero.talent.impact_wave.title=onda d'impatto
actors.hero.talent.improvised_projectiles.desc=_+1:_ Il guerriero può accecare un nemico per _2 turni_ lanciandogli contro qualsiasi oggetto che non sia un'arma da lancio. Questo ha un tempo di ricarica di 50 turni.\n\n_+2:_ Il guerriero può accecare un nemico per _3 turni_ lanciandogli contro qualsiasi oggetto che non sia un'arma da lancio. Questo ha un tempo di ricarica di 50 turni.
actors.hero.talent.improvised_projectiles.title=proiettili improvvisati
actors.hero.talent.inscribed_power.desc=_+1:_ Quando il Mago legge una pergamena o usa un oggetto magico, i suoi _prossimi 2 scariche di bacchetta_ ottengono +2 livelli.\n\n_+2:_ Quando il Mago legge una pergamena o usa un oggetto magico, i suoi _prossimi 3 scariche di bacchetta_ ottengono +2 livelli.\n\nIl numero di scariche di bacchetta potenziate è raddoppiato quando si utilizza una pergamena di potenziamento, trasmutazione o oggetti alchemici che devono essere creati usando quelle pergamene.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio la maggior parte degli incantesimi), questo talento ha una probabilità di attivarsi in base a quanti di quegli oggetti vengono prodotti.
actors.hero.talent.inscribed_power.title=potere iscritto
actors.hero.talent.inscribed_stealth.desc=_+1:_ Il Ladro ottiene _3 turni_ di invisibilità dopo aver letto una pergamena o aver usato un oggetto magico.\n\n_+2:_ Il Ladro ottiene _5 turni_ di invisibilità dopo aver letto una pergamena o aver usato un oggetto magico.\n\nLa durata dell'invisibilità è raddoppiata quando si utilizza una pergamena di potenziamento, una pergamena di trasmutazione o oggetti alchemici che devono essere creati usando tali pergamene.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio la maggior parte degli incantesimi), questo talento ha una probabilità di attivarsi in base a quanti di quegli oggetti vengono prodotti.
actors.hero.talent.inscribed_stealth.title=furtività incisa
actors.hero.talent.invigorating_meal.desc=_+1:_ Mangiare cibo richiede alla Cacciatrice 1 turno (le bacche vengono mangiate all'istante) e le garantisce _1 turno di fretta_.\n\n_+2:_ Mangiare cibo richiede alla Cacciatrice 1 turno (le bacche vengono mangiate all'istante) e le garantisce _2 turni di fretta_.
actors.hero.talent.invigorating_meal.title=pasto tonificante
actors.hero.talent.invigorating_victory.desc=_+1:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, recupera _5 HP più il 30% dei danni subiti_ durante il duello.\n\n_+2:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, recupera _10 HP più il 50% dei danni subiti_ durante il duello.\n\n_+3:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, recupera _15 HP più il 65% dei danni subiti_ durante il duello.\n\n_+4:_ Se la Duellante sconfigge il suo bersaglio prima della fine del duello, recupera _20 HP più il 75% dei danni subiti_ durante il duello.
actors.hero.talent.invigorating_victory.title=vittoria rinvigorente
actors.hero.talent.iron_stomach.desc=_+1:_ Mangiare cibo richiede al Guerriero 1 turno e gli conferisce _75% di resistenza ai danni_ mentre mangia.\n\n_+2:_ Mangiare cibo richiede al Guerriero 1 turno e gli conferisce _100% di resistenza ai danni_ mentre mangia.
actors.hero.talent.iron_stomach.title=stomaco di ferro
actors.hero.talent.iron_will.desc=_+1:_ Lo scudo fornito dal sigillo del Guerriero è _aumentato di 1_.\n\n_+2:_ Lo scudo fornito dal sigillo del Guerriero è _aumentato di 2_.
actors.hero.talent.iron_will.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, conferirà passivamente una versione con 1 o 2 scudi massimi dell'effetto del sigillo spezzato del Guerriero.
actors.hero.talent.iron_will.title=volontà di ferro
actors.hero.talent.judgement.desc=_+1:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Giudizio_, che infligge _10-20 danni_ a tutti i nemici visibili.\n\n_+2:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Giudizio_, che infligge _15-30 danni_ a tutti i nemici visibili.\n\n_+3:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Giudizio_, che infligge _20-40 danni_ a tutti i nemici visibili.\n\n_+4:_ Mentre è in Forma Ascesa, il Chierico può lanciare _Giudizio_, che infligge _25-50 danni_ a tutti i nemici visibili.\n\nIl Giudizio costa 3 cariche del tomo. Giudizio infligge il 33% di danni in più per ogni incantesimo lanciato dal Chierico da quando è entrato in forma ascesa o dall'ultimo lancio di Giudizio.
actors.hero.talent.judgement.title=sentenza
actors.hero.talent.lay_on_hands.desc=_+1:_ Il Paladino può lanciare _Imposizione delle Mani_, un incantesimo che cura istantaneamente un personaggio vicino per _15 PV_ o conferisce al Paladino _15 di scudo_, al costo di 1 carica.\n\n_+2:_ Il Paladino può lanciare _Imposizione delle Mani_, un incantesimo che cura istantaneamente un personaggio vicino per _20 PV_ o conferisce al Paladino _20 di scudo_, al costo di 1 carica.\n\n_+3:_ Il Paladino può lanciare _Imposizione delle Mani_, un incantesimo che cura istantaneamente un personaggio vicino per _25 PV_ o conferisce al Paladino _25 di scudo_, al costo di 1 carica.\n\nLa guarigione in eccesso da questo incantesimo viene convertita in scudo. L'incantesimo Imposizione delle Mani può essere lanciato ripetutamente, ma non può applicare contemporaneamente uno scudo equivalente a più di tre lanci.
actors.hero.talent.lay_on_hands.title=imposizione delle mani
actors.hero.talent.lethal_defense.desc=_+1:_ Quando il Gladiatore uccide un nemico con una mossa combo, il tempo di ricarica del suo scudo sigillo rotto è _ridotto di 50 turni_.\n\n_+2:_ Quando il Gladiatore uccide un nemico con una mossa combo, il tempo di ricarica del suo scudo sigillo rotto è _ridotto di 100 turni_.\n\n_+3:_ Quando il Gladiatore uccide un nemico con una mossa combo, il tempo di ricarica del suo scudo sigillo rotto è _ridotto di 150 turni_.\n\nIl tempo di ricarica dello scudo può essere ridotto fino a -150 turni da questo talento, il che significa che sarà immediatamente di nuovo disponibile una volta attivato.
actors.hero.talent.lethal_defense.title=difesa letale
actors.hero.talent.lethal_haste.desc=_+1:_ Quando il Duellante infligge un colpo mortale a un nemico con un'abilità dell'arma, ottiene _3 turni_ di movimento istantaneo.\n\n_+2:_ Quando il Duellante infligge un colpo mortale a un nemico con un'abilità dell'arma, ottiene _5 turni_ di movimento istantaneo.
actors.hero.talent.lethal_haste.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, si attiverà invece con gli attacchi normali delle armi, con un tempo di ricarica di 100 turni.
actors.hero.talent.lethal_haste.title=fretta letale
actors.hero.talent.lethal_momentum.desc=_+1:_ Quando il Guerriero infligge un colpo mortale a un nemico con un'arma fisica, ha una probabilità del 67% di impiegare 0 turni.\n\n_+2:_ Quando il Guerriero infligge un colpo mortale a un nemico con un'arma fisica, ha una probabilità del 100% di impiegare 0 turni.
actors.hero.talent.lethal_momentum.title=slancio letale
actors.hero.talent.life_link.desc=Il Chierico può lanciare _Legame Vitale_ tra sé stesso e un alleato potenziato al costo di 2 cariche. Questo incantesimo fa sì che il danno venga condiviso tra il Chierico e il suo alleato, e fa sì che gli incantesimi benefici del chierico di livello 3 o inferiore si applichino a entrambi se uno dei due è affetto.\n\n_+1:_ Il Legame Vitale dura _10 turni_ e aumenta il bonus di Potere di Molti a _-35% di danni subiti._\n\n_+2:_ Il Legame Vitale dura _13 turni_ e aumenta il bonus di Potere di Molti a _-40% di danni subiti._\n\n_+3:_ Il Legame Vitale dura _17 turni_ e aumenta il bonus di Potere di Molti a _-45% di danni subiti._\n\n_+4:_ Il Legame Vitale dura _20 turni_ e aumenta il bonus di Potere di Molti a _-50% di danni subiti._
actors.hero.talent.life_link.title=legame vitale
actors.hero.talent.light_cloak.desc=_+1:_ Il Ladro può usare il suo mantello delle ombre quando non è equipaggiato, ma si ricarica al 25% della velocità quando non è equipaggiato.\n\n_+2:_ Il Ladro può usare il suo mantello delle ombre quando non è equipaggiato, ma si ricarica al 50% della velocità quando non è equipaggiato.\n\n_+3:_ Il Ladro può usare il suo mantello delle ombre quando non è equipaggiato, ma si ricarica al 75% della velocità quando non è equipaggiato.
actors.hero.talent.light_cloak.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, aumenterà invece la velocità di ricarica di tutti gli artefatti del 7/13/20% a +1/+2/+3.
actors.hero.talent.light_cloak.title=mantello leggero
actors.hero.talent.light_reading.desc=_+1:_ Il Chierico può usare il suo tomo sacro quando non è equipaggiato, ma si ricarica al 25% della velocità quando non è equipaggiato.\n\n_+2:_ Il Chierico può usare il suo tomo sacro quando non è equipaggiato, ma si ricarica al 50% della velocità quando non è equipaggiato.\n\n_+3:_ Il Chierico può usare il suo tomo sacro quando non è equipaggiato, ma si ricarica al 75% della velocità quando non è equipaggiato.
actors.hero.talent.light_reading.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, aumenterà invece la velocità di ricarica di tutte le bacchette del 7/13/20% a +1/+2/+3.
actors.hero.talent.light_reading.title=Lettura leggera
actors.hero.talent.lingering_magic.desc=_+1:_ Quando il Mago lancia un incantesimo con una bacchetta o un bastone, il suo prossimo attacco fisico infligge _1-2 danni bonus_.\n\n_+2:_ Quando il Mago lancia un incantesimo con una bacchetta o un bastone, il suo prossimo attacco fisico infligge _2 danni bonus_.
actors.hero.talent.lingering_magic.title=magia persistente
actors.hero.talent.liquid_agility.desc=_+1:_ Quando beve o lancia una pozione, una bevanda o un elisir, il Duellante ha _3x evasione_ e ha _3x precisione_ sul suo prossimo attacco in mischia entro 5 turni.\n\n_+2:_ Quando beve o lancia una pozione, una bevanda o un elisir, il Duellante ha _evasione infinita_ e ha _precisione infinita_ sul suo prossimo attacco in mischia entro 5 turni.\n\nQuesto bonus dura per un turno e un attacco aggiuntivi quando si usano pozioni di forza, esperienza o oggetti alchemici che devono essere creati usando quelle pozioni.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio, la bevanda acquatica), questo talento ha una probabilità di attivarsi in base a quanti di quegli oggetti vengono prodotti.
actors.hero.talent.liquid_agility.title=agilità liquida
actors.hero.talent.liquid_nature.desc=_+1:_ Quando la Cacciatrice beve o lancia una pozione, una bevanda o un elisir, _fino a 4 tessere d'erba_ spuntano nell'area circostante e i nemici adiacenti vengono immobilizzati per _1 turno_.\n\n_+2:_ Quando la Cacciatrice beve o lancia una pozione, una bevanda o un elisir, _fino a 6 tessere d'erba_ spuntano nell'area circostante e i nemici adiacenti vengono immobilizzati per _2 turni_.\n\nLa quantità di erba e la durata dell'immobilizzazione sono raddoppiate quando si usano pozioni di forza, esperienza o oggetti alchemici che devono essere creati usando quelle pozioni.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio, la bevanda acquatica), questo talento ha una probabilità di attivarsi in base a quanti di quegli oggetti vengono prodotti.
actors.hero.talent.liquid_nature.title=natura liquida
actors.hero.talent.liquid_willpower.desc=_+1:_ Il guerriero ottiene _6,5% dei suoi HP massimi in scudo_ quando beve o lancia una pozione, una birra o un elisir.\n\n_+2:_ Il guerriero ottiene _10% dei suoi HP massimi in scudo_ quando beve o lancia una pozione, una birra o un elisir.\n\nLa quantità di scudo è raddoppiata quando si usano pozioni di forza, esperienza o oggetti alchemici che devono essere creati usando quelle pozioni.\n\nPer gli oggetti alchemici con quantità di output più elevate (ad esempio, birra d'acqua), questo talento ha una probabilità di attivarsi in base a quanti di quegli oggetti vengono prodotti.
actors.hero.talent.liquid_willpower.title=forza di volontà liquida
actors.hero.talent.longrange_warp.desc=_+1:_ Il Mago ora può teletrasportarsi tra i piani, con un costo di carica del 150%.\n\n_+2:_ Il Mago ora può teletrasportarsi tra i piani, con un costo di carica dell'117%.\n\n_+3:_ Il Mago ora può teletrasportarsi tra i piani, con un costo di carica dell'83%.\n\n_+4:_ Il Mago ora può teletrasportarsi tra i piani, con un costo di carica del 50%.\n\nIl Mago non può usare il teletrasporto a lungo raggio per uscire da un piano bloccato.
actors.hero.talent.longrange_warp.title=Distorsione a lungo raggio
actors.hero.talent.mind_form.desc=Il Chierico può lanciare _Forma Mentale_, che infonde Trinity con il potere di una bacchetta o di un'arma da lancio che il Chierico ha usato in questa corsa, al costo di 3 cariche.\n\n_+1:_ Quando Trinity viene usata, il Chierico usa l'effetto di scarica o lancio dell'oggetto scelto, come se fosse _+3._\n\n_+2:_ Quando Trinity viene usata, il Chierico usa l'effetto di scarica o lancio dell'oggetto scelto, come se fosse _+4._\n\n_+3:_ Quando Trinity viene usata, il Chierico usa l'effetto di scarica o lancio dell'oggetto scelto, come se fosse _+5._\n\n_+4:_ Quando Trinity viene usata, il Chierico usa l'effetto di scarica o lancio dell'oggetto scelto, come se fosse _+6._\n\nTrinity può essere imbevuta di un solo effetto mentale alla volta.
actors.hero.talent.mind_form.title=forma mentale
actors.hero.talent.mnemonic_prayer.desc=_+1:_ Il Sacerdote può lanciare _Preghiera Mnemonica_, un incantesimo che estende i buff/debuff su un alleato/nemico per _3 turni_ al costo di 1 carica.\n\n_+2:_ Il Sacerdote può lanciare _Preghiera Mnemonica_, un incantesimo che estende i buff/debuff su un alleato/nemico per _4 turni_ al costo di 1 carica.\n\n_+3:_ Il Sacerdote può lanciare _Preghiera Mnemonica_, un incantesimo che estende i buff/debuff su un alleato/nemico per _5 turni_ al costo di 1 carica.\n\nPreghiera Mnemonica non richiede tempo per essere lanciata. Preghiera Mnemonica può estendere una particolare istanza di un buff/debuff solo una volta e non può estendere i buff delle abilità dell'armatura.
actors.hero.talent.mnemonic_prayer.title=preghiera mnemonica
actors.hero.talent.monastic_vigor.desc=_+1:_ Se il Monaco ha il 100% di energia, le sue abilità sono potenziate.\n\n_+2:_ Se il Monaco ha l'80% o più di energia, le sue abilità sono potenziate.\n\n_+3:_ Se il Monaco ha il 60% o più di energia, le sue abilità sono potenziate.\n\nQuando potenziate:\n- Raffica applica l'incantesimo della tua arma\n- Concentrazione è istantanea\n- Scatto ottiene +4 di portata\n- Calcio del Drago infligge il 50% di danni in più e applica il suo effetto di respinta e stordimento a tutti i nemici adiacenti\n- Meditazione cura lentamente il 20% dei PV mancanti e garantisce l'80% di resistenza ai danni.
actors.hero.talent.monastic_vigor.title=vigore monastico
actors.hero.talent.mystical_charge.desc=_+1:_ Colpire con il suo bastone garantisce al Mago da Battaglia una ricarica dell'artefatto pari a _0,5 turni_.\n\n_+2:_ Colpire con il suo bastone garantisce al Mago da Battaglia una ricarica dell'artefatto pari a _1 turno_.\n\n_+3:_ Colpire con il suo bastone garantisce al Mago da Battaglia una ricarica dell'artefatto pari a _1,5 turni_.
actors.hero.talent.mystical_charge.title=carica mistica
actors.hero.talent.mystical_meal.desc=_+1:_ Mangiare cibo richiede al Ladro 1 turno (le razioni di rifornimento vengono consumate istantaneamente) e gli garantisce _3 turni di ricarica dell'artefatto_.\n\n_+2:_ Mangiare cibo richiede al Ladro 1 turno (le razioni di rifornimento vengono consumate istantaneamente) e gli garantisce _5 turni di ricarica dell'artefatto_.\n\nQuesto talento non può essere utilizzato per permettere al corno dell'abbondanza di ricaricarsi da solo.
actors.hero.talent.mystical_meal.title=pasto mistico
actors.hero.talent.natures_aid.desc=_+1:_ La Cacciatrice ottiene 0-2 armatura di pelle di corteccia, che svanisce ogni _3 turni_ quando l'effetto di una pianta viene attivato nel suo campo visivo.\n\n_+2:_ La Cacciatrice ottiene 0-2 armatura di pelle di corteccia, che svanisce ogni _5 turni_ quando l'effetto di una pianta viene attivato nel suo campo visivo.
actors.hero.talent.natures_aid.title=aiuto della natura
actors.hero.talent.natures_bounty.desc=_+1:_ La cacciatrice può trovare _4 bacche_ nascoste nell'erba alta mentre esplora i prossimi piani del dungeon.\n\n_+2:_ La cacciatrice può trovare _6 bacche_ nascoste nell'erba alta mentre esplora i prossimi piani del dungeon.\n\nLe bacche si mangiano velocemente, ripristinano una piccola quantità di sazietà e potrebbero contenere un seme utilizzabile.
actors.hero.talent.natures_bounty.title=la generosità della natura
actors.hero.talent.natures_wrath.desc=_+1:_ Mentre il potere della natura è attivo, i colpi dell'arco spirituale hanno una probabilità dell'8% di innescare un effetto dannoso casuale sulle piante.\n\n_+2:_ Mentre il potere della natura è attivo, i colpi dell'arco spirituale hanno una probabilità del 17% di innescare un effetto dannoso casuale sulle piante.\n\n_+3:_ Mentre il potere della natura è attivo, i colpi dell'arco spirituale hanno una probabilità del 25% di innescare un effetto dannoso casuale sulle piante.\n\n_+4:_ Mentre il potere della natura è attivo, i colpi dell'arco spirituale hanno una probabilità del 33% di innescare un effetto dannoso casuale sulle piante.\n\nLe piante che possono essere innescate sono: erba cieca, fiore di fuoco, calotta glaciale, muschio triste e vite della tempesta.
actors.hero.talent.natures_wrath.title=l'ira della natura
actors.hero.talent.necromancers_minions.desc=_+1:_ Quando un nemico con l'anima marchiata muore, lo Stregone ha una probabilità del 13% di resuscitarlo come spettro corrotto.\n\n_+2:_ Quando un nemico con l'anima marchiata muore, lo Stregone ha una probabilità del 27% di resuscitarlo come spettro corrotto.\n\n_+3:_ Quando un nemico con l'anima marchiata muore, lo Stregone ha una probabilità del 40% di resuscitarlo come spettro corrotto.
actors.hero.talent.necromancers_minions.title=servitori del negromante
actors.hero.talent.patient_strike.desc=_+1:_ Se il Duellante aspetta prima di eseguire un attacco in mischia, infliggerà _1-2 danni bonus_.\n\n_+2:_ Se il Duellante aspetta prima di eseguire un attacco in mischia, infliggerà _2 danni bonus_.
actors.hero.talent.patient_strike.title=sciopero dei medici
actors.hero.talent.perfect_copy.desc=_+1:_ Il clone d'ombra ottiene il 10% dei PV massimi dell'eroe e può scambiarsi istantaneamente di posto con l'eroe fino a 1 casella di distanza.\n\n_+2:_ Il clone d'ombra ottiene il 20% dei PV massimi dell'eroe e può scambiarsi istantaneamente di posto con l'eroe fino a 2 caselle di distanza.\n\n_+3:_ Il clone d'ombra ottiene il 30% dei PV massimi dell'eroe e può scambiarsi istantaneamente di posto con l'eroe fino a 3 caselle di distanza.\n\n_+4:_ Il clone d'ombra ottiene il 40% dei PV massimi dell'eroe e può scambiarsi istantaneamente di posto con l'eroe fino a 4 caselle di distanza.
actors.hero.talent.perfect_copy.title=copia perfetta
actors.hero.talent.point_blank.desc=_+1:_ Quando la Cacciatrice usa il suo arco o un'arma da lancio a distanza ravvicinata, ha una precisione del _-25%,_ invece del -50%.\n\n_+2:_ Quando la Cacciatrice usa il suo arco o un'arma da lancio a distanza ravvicinata, ha una precisione normale,_ invece del -50%.\n\n_+3:_ Quando la Cacciatrice usa il suo arco o un'arma da lancio a distanza ravvicinata, ha una precisione del _+25%,_ invece del -50%.\n\nNota che le armi da lancio o l'arco spirituale hanno sempre una precisione del +50% quando usati a distanza.
actors.hero.talent.point_blank.title=a bruciapelo
actors.hero.talent.precise_assault.desc=_+1:_ Quando il Duellante usa un'abilità dell'arma, ottiene _2x precisione_ sul suo prossimo attacco in mischia entro 5 turni.\n\n_+2:_ Quando il Duellante usa un'abilità dell'arma, ottiene _5x precisione_ sul suo prossimo attacco in mischia entro 5 turni.\n\n_+3:_ Quando il Duellante usa un'abilità dell'arma, ottiene _precisione infinita_ sul suo prossimo attacco in mischia entro 5 turni.
actors.hero.talent.precise_assault.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, aumenterà invece la precisione in mischia del 10% a +1, del 20% a +2 o del 30% a +3.
actors.hero.talent.precise_assault.title=assalto preciso
actors.hero.talent.projectile_momentum.desc=_+1:_ Mentre è in freerunning, il Freerunner ottiene _+50% di precisione e +15% di danni_ con le armi da lancio.\n\n_+2:_ Mentre è in freerunning, il Freerunner ottiene _+100% di precisione e +30% di danni_ con le armi da lancio.\n\n_+3:_ Mentre è in freerunning, il Freerunner ottiene _+150% di precisione e +45% di danni_ con le armi da lancio.
actors.hero.talent.projectile_momentum.title=quantità di moto del proiettile
actors.hero.talent.projecting_blades.desc=_+1:_ Le lame spettrali hanno una precisione del +25% e possono penetrare fino a 2 piastrelle solide.\n\n_+2:_ Le lame spettrali hanno una precisione del +50% e possono penetrare fino a 4 piastrelle solide.\n\n_+3:_ Le lame spettrali hanno una precisione del +75% e possono penetrare fino a 6 piastrelle solide.\n\n_+4:_ Le lame spettrali hanno una precisione del +100% e possono penetrare fino a 8 piastrelle solide.
actors.hero.talent.projecting_blades.title=lame sporgenti
actors.hero.talent.protective_shadows.desc=_+1:_ Il Ladro ottiene uno scudo _ogni due turni_ in cui è invisibile, _fino a un massimo di 3_.\n\n_+2:_ Il Ladro ottiene uno scudo _ogni turno_ in cui è invisibile, _fino a un massimo di 5_.
actors.hero.talent.protective_shadows.title=ombre protettive
actors.hero.talent.provoked_anger.desc=_+1:_ Quando un qualsiasi buff di scudo applicato al Guerriero viene interrotto dal danno, il suo prossimo attacco fisico infliggerà _3 danni bonus_.\n\n_+2:_ Quando un qualsiasi buff di scudo applicato al Guerriero viene interrotto dal danno, il suo prossimo attacco fisico infliggerà _5 danni bonus_.
actors.hero.talent.provoked_anger.title=rabbia provocata
actors.hero.talent.ratforcements.desc=_+1:_ Usando ratmogrify su te stesso _genera 1_ ratto marsupiale alleato accanto a te.\n\n_+2:_ Usando ratmogrify su te stesso _genera 2_ ratti marsupiali alleati accanto a te.\n\n_+3:_ Usando ratmogrify su te stesso _genera 3_ ratti marsupiali alleati accanto a te.\n\n_+4:_ Usando ratmogrify su te stesso _genera 4_ ratti marsupiali alleati accanto a te.
actors.hero.talent.ratforcements.title=forze dell'ordine
actors.hero.talent.ratlomacy.desc=_+1:_ Usare ratmogrify su un nemico ratmogrificato lo rende amichevole e rende la trasformazione permanente.\n\n_+2:_ Usare ratmogrify su un nemico ratmogrificato lo rende amichevole, rende la trasformazione permanente e gli dà _2 turni_ di adrenalina.\n\n_+3:_ Usare ratmogrify su un nemico ratmogrificato lo rende amichevole, rende la trasformazione permanente e gli dà _4 turni_ di adrenalina.\n\n_+4:_ Usare ratmogrify su un nemico ratmogrificato lo rende amichevole, rende la trasformazione permanente e gli dà _6 turni_ di adrenalina.
actors.hero.talent.ratlomacy.title=ratlomacy
actors.hero.talent.ratsistance.desc=_+1:_ I nemici ratto-trasformati ostili infliggono _-10% di danni_.\n\n_+2:_ I nemici ratto-trasformati ostili infliggono _-19% di danni_.\n\n_+3:_ I nemici ratto-trasformati ostili infliggono _-27% di danni_.\n\n_+4:_ I nemici ratto-trasformati ostili infliggono _-35% di danni_.
actors.hero.talent.ratsistance.title=resistenza ai ratti
actors.hero.talent.reactive_barrier.desc=_+1:_ Il Mago ottiene _2,5 di scudo_ per ogni personaggio colpito da esplosione elementale, fino a un massimo di 5 personaggi.\n\n_+2:_ Il Mago ottiene _5 di scudo_ per ogni personaggio colpito da esplosione elementale, fino a un massimo di 6 personaggi.\n\n_+3:_ Il Mago ottiene _7,5 di scudo_ per ogni personaggio colpito da esplosione elementale, fino a un massimo di 7 personaggi.\n\n_+4:_ Il Mago ottiene _10 di scudo_ per ogni personaggio colpito da esplosione elementale, fino a un massimo di 8 personaggi.
actors.hero.talent.reactive_barrier.title=barriera reattiva
actors.hero.talent.recall_inscription.desc=_+1:_ Il Chierico può lanciare _Richiamo Iscrizione_, un incantesimo che gli permette di ripetere l'effetto dell'ultima runa o pergamena utilizzata entro _10 turni._\n\n_+2:_ Il Chierico può lanciare _Richiamo Iscrizione_, un incantesimo che gli permette di ripetere l'effetto dell'ultima runa o pergamena utilizzata entro _300 turni._\n\nRichiamo Iscrizione non può essere utilizzato con pergamene di potenziamento. Il costo di carica di questo incantesimo varia in base all'oggetto utilizzato di recente: 2 per una runa, 3 per una pergamena, 4 per una pergamena esotica. Questo costo di carica è inoltre raddoppiato quando utilizzato con una pergamena di trasmutazione o con oggetti alchemici che devono essere creati utilizzando trasmutazione o potenziamento.
actors.hero.talent.recall_inscription.meta_desc=Se questo talento viene acquisito da un eroe diverso, rimborserà invece qualsiasi pergamena o runa nel 10% dei casi a +1 o nel 15% dei casi a +2. Le pergamene di potenziamento sono esenti da questo effetto.
actors.hero.talent.recall_inscription.refunded=Il tuo articolo è stato rimborsato!
actors.hero.talent.recall_inscription.title=richiamo iscrizione
actors.hero.talent.rejuvenating_steps.desc=_+1:_ Quando la Cacciatrice calpesta erba bassa o braci, queste si trasformano in erba alta che la Cacciatrice solca immediatamente. Questo ha un _tempo di ricarica di 10 turni_.\n\n_+2:_ Quando la Cacciatrice calpesta erba bassa o braci, queste si trasformano in erba alta che la Cacciatrice solca immediatamente. Questo ha un _tempo di ricarica di 5 turni_.\n\nQuesto talento produrrà erba solcata se gli effetti di rigenerazione passiva sono disabilitati o l'eroe non ha guadagnato esperienza per molto tempo.
actors.hero.talent.rejuvenating_steps.title=passi ringiovanenti
actors.hero.talent.remote_beacon.desc=_+1:_ Il Mago può posizionare un faro in qualsiasi posizione entro _4 caselle_.\n\n_+2:_ Il Mago può posizionare un faro in qualsiasi posizione entro _8 caselle_.\n\n_+3:_ Il Mago può posizionare un faro in qualsiasi posizione entro _12 caselle_.\n\n_+4:_ Il Mago può posizionare un faro in qualsiasi posizione entro _16 caselle_.\n\nIl Mago non può posizionare fari in posizioni inaccessibili.
actors.hero.talent.remote_beacon.title=Faro remoto
actors.hero.talent.rogues_foresight.desc=_+1:_ Quando il Ladro si trova in un livello con una stanza segreta, ha il 75% di probabilità di notare che il livello contiene un segreto.\n\n_+2:_ Quando il Ladro si trova in un livello con una stanza segreta, ha il 100% di probabilità di notare che il livello contiene un segreto.
actors.hero.talent.rogues_foresight.title=la preveggenza del furfante
actors.hero.talent.runic_transference.desc=_+1:_ Il sigillo rotto del Guerriero può trasferire glifi normali nello stesso modo in cui trasferisce un potenziamento.\n\n_+2:_ Il sigillo rotto del Guerriero può trasferire glifi normali, potenti e maledetti nello stesso modo in cui trasferisce un potenziamento.\n\nIl sigillo può trasferire glifi solo se sono stati applicati all'armatura quando il sigillo è stato attaccato.
actors.hero.talent.runic_transference.meta_desc=Se questo talento viene acquisito da un eroe diverso, aiuterà invece i glifi sulla tua armatura a resistere alla rimozione da parte delle pergamene di potenziamento. I glifi inizieranno a perdersi quando si effettua il potenziamento dal livello 6 (invece del 4) a +1, o dal livello 7 (invece del 4) a +2. Il livello in cui la perdita dei glifi è garantita rimane invariato a +8.
actors.hero.talent.runic_transference.title=trasferimento runico
actors.hero.talent.satiated_spells.desc=_+1:_ Mangiare cibo fa sì che il Chierico ottenga _3 scudi_ la prossima volta che lancia un incantesimo.\n\n_+2:_ Mangiare cibo fa sì che il Chierico ottenga _5 scudi_ la prossima volta che lancia un incantesimo.
actors.hero.talent.satiated_spells.meta_desc=Se questo talento viene acquisito da un eroe diverso, conferirà invece immediatamente uno scudo, che inizierà a decadere normalmente dopo 10 turni.
actors.hero.talent.satiated_spells.title=Incantesimi di sazietà
actors.hero.talent.scholars_intuition.desc=_+1:_ Il mago identifica le bacchette _3 volte più velocemente_.\n\n_+2:_ Il mago identifica le bacchette _quando le usa_.
actors.hero.talent.scholars_intuition.title=intuizione dello studioso
actors.hero.talent.searing_light.desc=_+1:_ Gli attacchi fisici del Chierico sui nemici illuminati da _Luce Guida_ infliggono _+3 danni._\n\n_+2:_ Gli attacchi fisici del Chierico sui nemici illuminati da _Luce Guida_ infliggono _+5 danni._
actors.hero.talent.searing_light.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, conferirà invece il suo bonus di danno dopo che una bacchetta o un artefatto vengono utilizzati su un nemico, con un tempo di ricarica di 20 turni.
actors.hero.talent.searing_light.title=Luce bruciante
actors.hero.talent.seer_shot.desc=_+1:_ Quando la Cacciatrice scaglia una freccia a terra, ottiene visione in un'area 3x3 intorno a sé per _5 turni_. Questo ha un tempo di ricarica di 20 turni.\n\n_+2:_ Quando la Cacciatrice scaglia una freccia a terra, ottiene visione in un'area 3x3 intorno a sé per _10 turni_. Questo ha un tempo di ricarica di 20 turni.\n\n_+3:_ Quando la Cacciatrice scaglia una freccia a terra, ottiene visione in un'area 3x3 intorno a sé per _15 turni_. Questo ha un tempo di ricarica di 20 turni.
actors.hero.talent.seer_shot.meta_desc=Se questo talento viene acquisito da un eroe diverso, si attiverà con qualsiasi arma da lancio.
actors.hero.talent.seer_shot.title=colpo veggente
actors.hero.talent.shadow_blade.desc=_+1:_ Il clone d'ombra ottiene l'8% del danno dell'eroe per turno e ha una probabilità del 25% di usare l'incantesimo sull'arma dell'eroe.\n\n_+2:_ Il clone d'ombra ottiene il 16% del danno dell'eroe per turno e ha una probabilità del 50% di usare l'incantesimo sull'arma dell'eroe.\n\n_+3:_ Il clone d'ombra ottiene il 24% del danno dell'eroe per turno e ha una probabilità del 75% di usare l'incantesimo sull'arma dell'eroe.\n\n_+4:_ Il clone d'ombra ottiene il 32% del danno dell'eroe per turno e ha una probabilità del 100% di usare l'incantesimo sull'arma dell'eroe.
actors.hero.talent.shadow_blade.title=lama d'ombra
actors.hero.talent.shadow_step.desc=_+1:_ Se il ladro usa bomba fumogena mentre è invisibile, l'effetto è istantaneo e ha un costo di carica ridotto del 16%, ma non acceca i nemici né attiva altri talenti.\n\n_+2:_ Se il ladro usa bomba fumogena mentre è invisibile, l'effetto è istantaneo e ha un costo di carica ridotto del 30%, ma non acceca i nemici né attiva altri talenti.\n\n_+3:_ Se il ladro usa bomba fumogena mentre è invisibile, l'effetto è istantaneo e ha un costo di carica ridotto del 41%, ma non acceca i nemici né attiva altri talenti.\n\n_+4:_ Se il ladro usa bomba fumogena mentre è invisibile, l'effetto è istantaneo e ha un costo di carica ridotto del 50%, ma non acceca i nemici né attiva altri talenti.
actors.hero.talent.shadow_step.title=passo ombra
actors.hero.talent.shared_enchantment.desc=_+1:_ Le armi da lancio hanno una probabilità del 33% di utilizzare l'incantesimo sull'arco del cecchino.\n\n_+2:_ Le armi da lancio hanno una probabilità del 67% di utilizzare l'incantesimo sull'arco del cecchino.\n\n_+3:_ Le armi da lancio hanno una probabilità del 100% di utilizzare l'incantesimo sull'arco del cecchino.\n\nL'incantesimo dell'arco può attivarsi in aggiunta a qualsiasi incantesimo che l'arma da lancio abbia già.
actors.hero.talent.shared_enchantment.title=incantesimo condiviso
actors.hero.talent.shared_upgrades.desc=_+1:_ Quando il Cecchino attacca con un'arma da lancio potenziata, ogni livello aumenta la durata del marchio del cecchino di 1 turno e il danno del suo attacco speciale del 16%, fino a un massimo di _2 turni e +33% di danno a +2_.\n\n_+2:_ Quando il Cecchino attacca con un'arma da lancio potenziata, ogni livello aumenta la durata del marchio del cecchino di 1 turno e il danno del suo attacco speciale del 16%, fino a un massimo di _4 turni e +67% di danno a +4_.\n\n_+3:_ Quando il Cecchino attacca con un'arma da lancio potenziata, ogni livello aumenta la durata del marchio del cecchino di 1 turno e il danno del suo attacco speciale del 16%, fino a un massimo di _6 turni e +100% di danno a +6_.
actors.hero.talent.shared_upgrades.title=aggiornamenti condivisi
actors.hero.talent.shield_battery.desc=_+1:_ Il Mago può auto-indirizzarsi con una bacchetta per convertire tutte le sue cariche in scudi a un tasso del _4% dei PV massimi per carica_.\n\n_+2:_ Il Mago può auto-indirizzarsi con una bacchetta per convertire tutte le sue cariche in scudi a un tasso del _6% dei PV massimi per carica_.
actors.hero.talent.shield_battery.title=batteria di protezione
actors.hero.talent.shield_of_light.desc=_+1:_ Il Chierico può lanciare _Scudo di Luce_, un incantesimo che viene lanciato istantaneamente e gli conferisce _2-4 armatura_ contro un bersaglio per 5 turni al costo di 1 carica.\n\n_+2:_ Il Chierico può lanciare _Scudo di Luce_, un incantesimo che viene lanciato istantaneamente e gli conferisce _3-6 armatura_ contro un bersaglio per 5 turni al costo di 1 carica.
actors.hero.talent.shield_of_light.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, ridurrà invece il danno fisico subito dal nemico bersaglio di 1, il 33% delle volte con +1 o il 50% delle volte con +2.
actors.hero.talent.shield_of_light.title=scudo di luce
actors.hero.talent.shielding_dew.desc=_+1:_ Le gocce di rugiada possono proteggere il Guardiano quando la sua salute è al massimo, fino al _20% dei suoi HP massimi_.\n\n_+2:_ Le gocce di rugiada possono proteggere il Guardiano quando la sua salute è al massimo, fino al _40% dei suoi HP massimi_.\n\n_+3:_ Le gocce di rugiada possono proteggere il Guardiano quando la sua salute è al massimo, fino al _60% dei suoi HP massimi_.
actors.hero.talent.shielding_dew.title=rugiada protettiva
actors.hero.talent.shock_force.desc=_+1:_ L'onda d'urto infligge il 20% di danni in più e ha una probabilità del 25% di stordire invece di paralizzare.\n\n_+2:_ L'onda d'urto infligge il 40% di danni in più e ha una probabilità del 50% di stordire invece di paralizzare.\n\n_+3:_ L'onda d'urto infligge il 60% di danni in più e ha una probabilità del 75% di stordire invece di paralizzare.\n\n_+4:_ L'onda d'urto infligge l'80% di danni in più e ha una probabilità del 100% di stordire invece di paralizzare.
actors.hero.talent.shock_force.title=forza d'urto
actors.hero.talent.shrug_it_off.desc=_+1:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata al 60%_, dal 50%.\n\n_+2:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata al 68%_, dal 50%.\n\n_+3:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata al 74%_, dal 50%.\n\n_+4:_ La riduzione del danno del Guerriero durante la resistenza è _aumentata all'80%_, dal 50%.
actors.hero.talent.shrug_it_off.title=scrollare le spalle
actors.hero.talent.silent_steps.desc=_+1:_ Il Ladro non sveglierà i nemici addormentati finché si trova a _3 o più caselle di distanza da loro_.\n\n_+2:_ Il Ladro non sveglierà i nemici addormentati finché non si trova adiacente a loro.
actors.hero.talent.silent_steps.title=passi silenziosi
actors.hero.talent.soul_eater.desc=_+1:_ Il marchio dell'anima garantisce _0,33 turni_ di sazietà per ogni danno fisico inflitto. I nemici con il marchio dell'anima hanno una probabilità del _10%_ di attivare effetti al consumo quando muoiono.\n\n_+2:_ Il marchio dell'anima garantisce _0,67 turni_ di sazietà per ogni danno fisico inflitto. I nemici con il marchio dell'anima hanno una probabilità del _20%_ di attivare effetti al consumo quando muoiono.\n\n_+3:_ Il marchio dell'anima garantisce _1 turno_ di sazietà per ogni danno fisico inflitto. I nemici con il marchio dell'anima hanno una probabilità del _30%_ di attivare effetti al consumo quando muoiono.
actors.hero.talent.soul_eater.title=mangiatore di anime
actors.hero.talent.soul_siphon.desc=_+1:_ Il danno fisico inflitto da altri personaggi attiva il marchio dell'anima dello Stregone con un'efficacia del 13%.\n\n_+2:_ Il danno fisico inflitto da altri personaggi attiva il marchio dell'anima dello Stregone con un'efficacia del 27%.\n\n_+3:_ Il danno fisico inflitto da altri personaggi attiva il marchio dell'anima dello Stregone con un'efficacia del 40%.
actors.hero.talent.soul_siphon.title=sifone dell'anima
actors.hero.talent.speedy_stealth.desc=_+1:_ Il Freerunner ottiene 2 accumuli di slancio per turno mentre è invisibile.\n\n_+2:_ Oltre ai benefici di +1, il freerunning non inizia più a scorrere mentre il Freerunner è invisibile.\n\n_+3:_ Oltre ai benefici di +1 e +2, il Freerunner si muove a velocità doppia mentre è invisibile, indipendentemente dal fatto che stia praticando il freerunning o meno.
actors.hero.talent.speedy_stealth.title=furtività veloce
actors.hero.talent.spirit_blades.desc=_+1:_ Lame Spettrali hanno una probabilità del 30% di utilizzare anche l'incantesimo sull'arco spirituale.\n\n_+2:_ Lame Spettrali hanno una probabilità del 60% di utilizzare anche l'incantesimo sull'arco spirituale.\n\n_+3:_ Lame Spettrali hanno una probabilità del 90% di utilizzare anche l'incantesimo sull'arco spirituale.\n\n_+4:_ Lame Spettrali hanno una probabilità del 100% di utilizzare anche l'incantesimo sull'arco spirituale e conferiscono a ogni incantesimo un bonus del 10% di potenza.
actors.hero.talent.spirit_blades.title=lame spirituali
actors.hero.talent.spirit_form.desc=Il Chierico può lanciare _Forma Spirituale_, che infonde Trinity con il potere di un anello o artefatto che il Chierico ha identificato in questa partita (eccetto il tomo sacro), al costo di 4 cariche.\n\n_+1:_ Quando Trinity viene utilizzata, il Chierico otterrà l'effetto di un anello a _+1_ per 20 turni, oppure attiverà l'effetto di un artefatto a _+4._\n\n_+2:_ Quando Trinity viene utilizzata, il Chierico otterrà l'effetto di un anello a _+2_ per 20 turni, oppure attiverà l'effetto di un artefatto a _+6._\n\n_+3:_ Quando Trinity viene utilizzata, il Chierico otterrà l'effetto di un anello a _+3_ per 20 turni, oppure attiverà l'effetto di un artefatto a _+8._\n\n_+4:_ Quando viene usata Trinità, il Chierico otterrà l'effetto di un anello a _+4_ per 20 turni, oppure attiverà l'effetto di un artefatto a _+10._\n\nTrinità può essere imbevuta di un solo effetto spirituale alla volta. Gli artefatti hanno effetti e costi di carica dell'armatura variabili quando attivati da Trinità.
actors.hero.talent.spirit_form.title=forma spirituale
actors.hero.talent.stasis.desc=Il Chierico può lanciare _Stasi_ su un alleato potenziato al costo di 2 cariche. Stasi rimuove temporaneamente l'alleato dal dungeon e preserva il tempo rimanente di tutti i potenziamenti, incluso Potere di Molti. L'alleato riapparirà accanto a te al termine dell'effetto. Stasi può essere lanciata nuovamente istantaneamente e senza costi per terminare l'effetto in anticipo. Stasi funziona sugli alleati immobili, ma non può spostarli tra i piani del dungeon.\n\n_+1:_ Stasi dura per un massimo di 60 turni._\n\n_+2:_ Stasi dura per un massimo di 90 turni._\n\n_+3:_ Stasi dura per un massimo di 120 turni._\n\n_+4:_ Stasi dura per un massimo di 150 turni._\n\nIl Chierico può anche lanciare Raggio Radioso quando un alleato è in stasi per richiamarlo, oppure lanciare Legame Vitale per applicarne preventivamente l'effetto. Gli alleati non beneficiano di Legame Vitale mentre sono in stasi.
actors.hero.talent.stasis.title=stasi
actors.hero.talent.strengthening_meal.desc=_+1:_ Mangiare cibo conferisce al Duellante 3 danni bonus le prossime _2 volte_ in cui colpisce un nemico con un attacco fisico.\n\n_+2:_ Mangiare cibo conferisce al Duellante 3 danni bonus le prossime _3 volte_ in cui colpisce un nemico con un attacco fisico.
actors.hero.talent.strengthening_meal.title=rafforzare il pasto
actors.hero.talent.striking_force.desc=_+1:_ La potenza dell'effetto dell'attacco elementale è aumentata del _30%_.\n\n_+2:_ La potenza dell'effetto dell'attacco elementale è aumentata del _60%_.\n\n_+3:_ La potenza dell'effetto dell'attacco elementale è aumentata del _90%_.\n\n_+4:_ La potenza dell'effetto dell'attacco elementale è aumentata del _120%_.
actors.hero.talent.striking_force.title=forza d'impatto
actors.hero.talent.striking_wave.desc=_+1:_ Shockwave ha una probabilità del 30% di utilizzare anche effetti all'impatto come incantesimi e combo.\n\n_+2:_ Shockwave ha una probabilità del 60% di utilizzare anche effetti all'impatto come incantesimi e combo.\n\n_+3:_ Shockwave ha una probabilità del 90% di utilizzare anche effetti all'impatto come incantesimi e combo.\n\n_+4:_ Shockwave ha una probabilità del 100% di utilizzare anche effetti all'impatto come incantesimi e combo e conferisce agli incantesimi un bonus del 20% di potenza.
actors.hero.talent.striking_wave.title=onda sorprendente
actors.hero.talent.strongman.desc=_+1:_ La forza del guerriero è _aumentata dell'8%_, arrotondato per difetto.\n\n_+2:_ La forza del guerriero è _aumentata del 13%_, arrotondato per difetto.\n\n_+3:_ La forza del guerriero è _aumentata del 18%_, arrotondato per difetto.
actors.hero.talent.strongman.title=uomo forzuto
actors.hero.talent.sucker_punch.desc=_+1:_ Il Ladro infligge _1-2 danni bonus_ la prima volta che attacca a sorpresa un nemico.\n\n_+2:_ Il Ladro infligge _2 danni bonus_ la prima volta che attacca a sorpresa un nemico.
actors.hero.talent.sucker_punch.title=Sucker Punch
actors.hero.talent.sunray.desc=_+1:_ Il Chierico può lanciare _Raggio Solare_, un incantesimo che infligge _4-8 danni_ e acceca il bersaglio per _4 turni_, al costo di 1 carica.\n\n_+2:_ Il Chierico può lanciare _Raggio Solare_, un incantesimo che infligge _6-12 danni_ e acceca il bersaglio per _6 turni_, al costo di 1 carica.\n\nRaggio Solare può accecare ogni bersaglio una sola volta, ma se il bersaglio è già accecato da Raggio Solare, lo paralizza invece. Raggio Solare infligge sempre il massimo danno ai nemici demoniaci e non morti.
actors.hero.talent.sunray.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, farà sì che bacchette e artefatti accechino i nemici per 4 turni, il 15% delle volte con +1 o il 25% delle volte con +2.
actors.hero.talent.sunray.title=raggio di sole
actors.hero.talent.survivalists_intuition.desc=_+1:_ La Cacciatrice identifica le armi da lancio _3 volte più velocemente_.\n\n_+2:_ La Cacciatrice identifica le armi da lancio _quando colpisce con esse_.
actors.hero.talent.survivalists_intuition.title=intuizione del survivalista
actors.hero.talent.sustained_retribution.desc=_+1:_ Il guerriero infligge il 115% di danni bonus distribuiti su 2 colpi, invece del 100% di danni bonus in 1 colpo.\n\n_+2:_ Il guerriero infligge il 130% di danni bonus distribuiti su 3 colpi, invece del 100% di danni bonus in 1 colpo.\n\n_+3:_ Il guerriero infligge il 145% di danni bonus distribuiti su 4 colpi, invece del 100% di danni bonus in 1 colpo.\n\n_+4:_ Il guerriero infligge il 160% di danni bonus distribuiti su 5 colpi, invece del 100% di danni bonus in 1 colpo.
actors.hero.talent.sustained_retribution.title=punizione prolungata
actors.hero.talent.swift_equip.desc=_+1:_ La Duellante può cambiare istantaneamente la sua arma equipaggiata _una volta_ ogni 20 turni.\n\n_+2:_ La Duellante può cambiare istantaneamente la sua arma equipaggiata _due volte_ ogni 20 turni.\n\nSe la Duellante ha questo talento e non è in cooldown, l'uso rapido di un'arma non equipaggiata la equipaggerà.
actors.hero.talent.swift_equip.title=attrezzatura rapida
actors.hero.talent.swift_spirit.desc=_+1:_ La velocità di movimento del falco spirituale è aumentata a _2,5 caselle_ da 2, ed è garantito che schivi i primi _2 attacchi_ sferrati contro di esso.\n\n_+2:_ La velocità di movimento del falco spirituale è aumentata a _3 caselle_ da 2, ed è garantito che schivi i primi _4 attacchi_ sferrati contro di esso.\n\n_+3:_ La velocità di movimento del falco spirituale è aumentata a _3,5 caselle_ da 2, ed è garantito che schivi i primi _6 attacchi_ sferrati contro di esso.\n\n_+4:_ La velocità di movimento del falco spirituale è aumentata a _4 caselle_ da 2, ed è garantito che schivi i primi _8 attacchi_ sferrati contro di esso.
actors.hero.talent.swift_spirit.title=spirito di salmone
actors.hero.talent.telefrag.desc=_+1:_ Se il Mago si teletrasporta in un altro personaggio, gli infligge _10-15 danni_, ma subisce anche _5 danni_.\n\n_+2:_ Se il Mago si teletrasporta in un altro personaggio, gli infligge _20-30 danni_, ma subisce anche _10 danni_.\n\n_+3:_ Se il Mago si teletrasporta in un altro personaggio, gli infligge _30-45 danni_, ma subisce anche _15 danni_.\n\n_+4:_ Se il Mago si teletrasporta in un altro personaggio, gli infligge _40-60 danni_, ma subisce anche _20 danni_.\n\nL'eroe non può essere ucciso da questo talento, il danno autoinflitto può essere ridotto dagli effetti di resistenza magica.
actors.hero.talent.telefrag.title=Telefrag
actors.hero.talent.thiefs_intuition.desc=_+1:_ Il Ladro identifica gli anelli _2 volte più velocemente_ e identifica il tipo di un anello _quando lo equipaggia_.\n\n_+2:_ Il Ladro identifica gli anelli _quando li equipaggia_ e identifica il tipo di un anello _quando lo raccoglie_.
actors.hero.talent.thiefs_intuition.title=intuizione del ladro
actors.hero.talent.twin_upgrades.desc=_+1:_ Se una delle due armi equipaggiate del Campione ha un livello inferiore ed è _2 o più livelli inferiore_ rispetto all'altra arma, verrà potenziata al livello dell'altra arma.\n\n_+2:_ Se una delle due armi equipaggiate del Campione ha un livello inferiore ed è _1 o più livelli inferiore_ rispetto all'altra arma, verrà potenziata al livello dell'altra arma.\n\n_+3:_ Se una delle due armi equipaggiate del Campione ha un livello inferiore ed è _dello stesso livello o inferiore_ rispetto all'altra arma, verrà potenziata al livello dell'altra arma.
actors.hero.talent.twin_upgrades.title=doppi aggiornamenti
actors.hero.talent.unencumbered_spirit.desc=_+1:_ Il Monaco ottiene il 50% di energia in più per ogni pezzo di equipaggiamento di livello 3 o inferiore che sta usando.\n\n_+2:_ Il Monaco ottiene il 75% di energia in più per ogni pezzo di equipaggiamento di livello 2 o inferiore che sta usando. Il beneficio di livello 3 rimane invariato.\n\n_+3:_ Il Monaco ottiene il 100% di energia in più per ogni pezzo di equipaggiamento di livello 1 o inferiore che sta usando. I benefici di livello 2 e 3 rimangono invariati. Ottiene anche un'armatura di stoffa gratuita e guanti borchiati.\n\nNota che questo talento non dà alcun beneficio dall'essere disarmato o dall'attaccare con un Anello della Forza.
actors.hero.talent.unencumbered_spirit.title=spirito libero da vincoli
actors.hero.talent.varied_charge.desc=_+1:_ La Campionessa recupera istantaneamente _0,17 cariche arma_ quando usa due diverse abilità arma, senza limiti di tempo.\n\n_+2:_ La Campionessa recupera istantaneamente _0,33 cariche arma_ quando usa due diverse abilità arma, senza limiti di tempo.\n\n_+3:_ La Campionessa recupera istantaneamente _0,5 cariche arma_ quando usa due diverse abilità arma, senza limiti di tempo.
actors.hero.talent.varied_charge.title=costo variabile
actors.hero.talent.veterans_intuition.desc=_+1:_ Il guerriero identifica le armi _1,75 volte più velocemente_ e le armature _2,5 volte più velocemente_.\n\n_+2:_ Il guerriero identifica le armi _2,5 volte più velocemente_ e le armature _quando le equipaggia_.
actors.hero.talent.veterans_intuition.title=intuizione del veterano
actors.hero.talent.wall_of_light.desc=_+1:_ Il Paladino può lanciare _Muro di Luce_, un incantesimo che crea un muro solido largo _3 caselle_ di fronte al Paladino che respinge i nemici e dura per 20 turni, al costo di 3 cariche.\n\n_+2:_ Il Paladino può lanciare _Muro di Luce_, un incantesimo che crea un muro solido largo _5 caselle_ di fronte al Paladino che respinge i nemici e dura per 20 turni, al costo di 3 cariche.\n\n_+3:_ Il Paladino può lanciare _Muro di Luce_, un incantesimo che crea un muro solido largo _7 caselle_ di fronte al Paladino che respinge i nemici e dura per 20 turni, al costo di 3 cariche.\n\nIl muro può essere posizionato cardinalmente o diagonalmente, può esistere un solo muro alla volta.
actors.hero.talent.wall_of_light.title=parete di luce
actors.hero.talent.wand_preservation.desc=_+1:_ Quando il Mago infonde una nuova bacchetta nel suo bastone, la vecchia bacchetta viene restituita a +0, _ma questo può essere fatto solo una volta._\n\n_+2:_ Quando il Mago infonde una nuova bacchetta nel suo bastone, la vecchia bacchetta viene restituita a +0, _questo può essere ripetuto con un tempo di ricarica di un livello eroe._
actors.hero.talent.wand_preservation.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, aumenterà invece la quantità di resina arcana ottenuta quando si mette una bacchetta in un calderone alchemico di 1 a +1, o di 2 a +2.
actors.hero.talent.wand_preservation.title=conservazione della bacchetta
actors.hero.talent.weapon_recharging.desc=_+1:_ Il Duellante ottiene una carica dell'arma ogni _15 turni_ quando è sotto l'effetto di buff di ricarica della bacchetta o dell'artefatto.\n\n_+2:_ Il Duellante ottiene una carica dell'arma ogni _10 turni_ quando è sotto l'effetto di buff di ricarica della bacchetta o dell'artefatto.
actors.hero.talent.weapon_recharging.meta_desc=Se questo talento viene acquisito da un eroe diverso, gli farà infliggere invece il 5% di danni da mischia in più durante la ricarica a +1, oppure il 7,5% di danni da mischia in più durante la ricarica a +2.
actors.hero.talent.weapon_recharging.title=ricarica dell'arma
actors.hero.talent.wide_search.desc=_+1:_ Il raggio di ricerca del Ladro è aumentato da un quadrato 5x5 a un cerchio 7x7.\n\n_+2:_ Il raggio di ricerca del Ladro è aumentato da un quadrato 5x5 a un quadrato 7x7.
actors.hero.talent.wide_search.meta_desc=_Se questo talento viene acquisito da un eroe diverso_, aumenterà invece il suo raggio di ricerca da un quadrato 3x3 a un cerchio 5x5 con +1, oppure a un quadrato 5x5 con +2.
actors.hero.talent.wide_search.title=ricerca ampia
actors.hero.talent.wild_momentum.desc=_+1:_ Uccidere un nemico con l'arco spirituale prolunga la durata del potere della natura di _1 turno_. La durata può essere estesa fino a un massimo di _2 turni_.\n\n_+2:_ Uccidere un nemico con l'arco spirituale prolunga la durata del potere della natura di _2 turni_. La durata può essere estesa fino a un massimo di _4 turni_.\n\n_+3:_ Uccidere un nemico con l'arco spirituale prolunga la durata del potere della natura di _3 turni_. La durata può essere estesa fino a un massimo di _6 turni_.\n\n_+4:_ Uccidere un nemico con l'arco spirituale prolunga la durata del potere della natura di _4 turni_. La durata può essere estesa fino a un massimo di _8 turni_.
actors.hero.talent.wild_momentum.title=impeto selvaggio
actors.hero.talent.wild_power.desc=_+1:_ Quando si usa la magia selvaggia, le bacchette saranno potenziate di _2 o 3, fino a un massimo di +4_.\n\n_+2:_ Quando si usa la magia selvaggia, le bacchette saranno potenziate di _3, fino a un massimo di +5_.\n\n_+3:_ Quando si usa la magia selvaggia, le bacchette saranno potenziate di _3 o 4, fino a un massimo di +6_.\n\n_+4:_ Quando si usa la magia selvaggia, le bacchette saranno potenziate di _4, fino a un massimo di +7_.
actors.hero.talent.wild_power.title=potere selvaggio
actors.mobs.acidic.desc=Queste enormi creature demoniache simili ad aracnidi evitano il combattimento ravvicinato, preferendo scagliare aculei seghettati e paralizzanti da lunghe distanze. Questa in particolare sembra grondare una melma corrosiva.
actors.mobs.acidic.name=scorpione acido
actors.mobs.albino.desc=Si tratta di una rara razza di ratto marsupiale, con pelliccia di un bianco candido e denti seghettati.
actors.mobs.albino.discover_hint=È raro trovare questo nemico in una specifica area del dungeon.
actors.mobs.albino.name=ratto albino
actors.mobs.armoredbrute.desc=I bruti gnoll più anziani indossano spesso armature possenti per ostentare il loro status. L'armatura li rende molto più resistenti ai danni fisici, e la loro maggiore disciplina permette loro di infuriarsi molto più a lungo prima di soccombere alle ferite.
actors.mobs.armoredbrute.name=bruto corazzato
actors.mobs.armoredstatue.desc=Potresti pensare che sia solo un'altra delle statue inanimate di questo dungeon, ma i suoi occhi rossi luminosi lo tradiscono. Sembra essere in ottime condizioni grazie all'armatura che indossa, potrebbe essere molto difficile da uccidere.
actors.mobs.armoredstatue.desc_arm_wep=Sebbene la statua stessa sia fatta di pietra, le _%1$s_ e _%2$s_ che impugna sembrano reali.
actors.mobs.armoredstatue.name=statua corazzata
actors.mobs.bandit.desc=I livelli più profondi del sotterraneo sono sempre stati un rifugio per ogni sorta di criminale. Non tutti riescono a mantenere la lucidità mentale durante i lunghi periodi trascorsi così lontani dalla luce del sole. Da tempo, questi folli ladri e banditi hanno dimenticato chi sono e perché rubano.
actors.mobs.bandit.name=bandito pazzo
actors.mobs.bat.desc=Questi abitanti delle caverne, agili e tenaci, sono molto più pericolosi di quanto sembrino. Recuperano la salute a ogni attacco andato a segno, il che permette loro di sconfiggere avversari ben più grandi.
actors.mobs.bat.name=pipistrello vampiro
actors.mobs.bee.desc=Nonostante le loro piccole dimensioni, le api dorate tendono a proteggere ferocemente il loro nido. Questa in particolare è molto aggressiva, meglio tenersi a distanza.
actors.mobs.bee.desc_honey=Nonostante le loro piccole dimensioni, le api dorate tendono a proteggere ferocemente il loro nido. Questa in particolare si è calmata e sembra voler seguirti.
actors.mobs.bee.discover_hint=È possibile trovare questo personaggio con un oggetto specifico.
actors.mobs.bee.name=ape dorata
actors.mobs.brute$bruterage.desc=Questo bruto gnoll sta morendo, ma vuole portarti con sé!\n\nIl bruto morirà quando il suo scudo si esaurirà, sia per via del tempo che se viene danneggiato. Nel frattempo, infliggerà danni notevolmente aumentati, quindi fai attenzione!\n\nScudo rimanente: %d.
actors.mobs.brute$bruterage.name=furia bruta
actors.mobs.brute.def_verb=bloccato
actors.mobs.brute.desc=I bruti sono gli gnoll più grandi, forti e resistenti. Quando vengono feriti gravemente, vanno su tutte le furie e infliggono ancora più danni ai nemici.
actors.mobs.brute.enraged=infuriato
actors.mobs.brute.name=bruto gnoll
actors.mobs.causticslime.desc=Questa melma sembra essere stata contaminata dalla magia oscura che emana dal basso. Ha perso il suo solito colore verde e trasuda una melma caustica.
actors.mobs.causticslime.discover_hint=È raro trovare questo nemico in una specifica area del dungeon.
actors.mobs.causticslime.name=melma caustica
actors.mobs.crab.desc=Questi enormi granchi si trovano al vertice della catena alimentare nelle fogne. Sono estremamente veloci e il loro spesso carapace può resistere a colpi violenti.
actors.mobs.crab.name=granchio delle fogne
actors.mobs.crystalguardian.def_verb=bloccato
actors.mobs.crystalguardian.desc=Questi grandi guardiani cristallini sembrano quasi statue, se non fosse per i loro occhi luminosi. Il cristallo indurito di cui sono fatti li rende lenti ma molto resistenti, quindi è meglio lasciarli dormire nel loro nido di cristallo il più a lungo possibile. A causa delle loro dimensioni, i guardiani di cristallo si muoveranno molto più lentamente negli spazi chiusi. Sono anche così resistenti che è impossibile ucciderli sul colpo. Possono essere abbattuti e temporaneamente disattivati, ma si rialzeranno dopo un po'.
actors.mobs.crystalguardian.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.crystalguardian.name=guardiano di cristallo
actors.mobs.crystalmimic.ate=Il mimetico ha mangiato il tuo %s!
actors.mobs.crystalmimic.desc=I mimic sono creature magiche in grado di assumere qualsiasi forma desiderino. Nei dungeon scelgono quasi sempre la forma di uno scrigno del tesoro per attirare avventurieri ignari. I mimic di cristallo sono più astuti dei loro cugini normali e preferiscono evitare il conflitto mentre rubano il bottino. Una volta scoperti, tenteranno di scappare e hanno la capacità di riposizionare i nemici quando attaccano.
actors.mobs.crystalmimic.escaped=Il mimetico di cristallo è scappato!
actors.mobs.crystalmimic.name=imitazione di cristallo
actors.mobs.crystalspire.alert=La vibrazione aumenta e si propaga in tutta la grotta!
actors.mobs.crystalspire.desc=Questa gigantesca guglia di cristallo ultra duro è probabilmente la fonte di tutte le strane creature cristalline in questa grotta. Le tue armi normali sono inefficaci contro di essa, quindi dovrai usare il piccone se vuoi distruggerla. Assicurati di essere preparato prima di iniziare a romperla. Un cristallo così grande richiederà probabilmente molto tempo per essere estratto e probabilmente non sarai in grado di farlo indisturbato. La guglia stessa potrebbe anche avere dei mezzi per difendersi. Forse i suoi attacchi potrebbero essere usati contro i suoi servitori.
actors.mobs.crystalspire.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.crystalspire.name=guglia di cristallo
actors.mobs.crystalspire.warning=Il cristallo vibra quando lo colpisci. Continuare così attirerà sicuramente l'attenzione su di te...
actors.mobs.crystalwisp.beam_kill=Il raggio di luce ti ha ucciso...
actors.mobs.crystalwisp.desc=Un piccolo e minaccioso frammento fluttuante di cristallo indurito che produce una luce intensa. Sebbene non siano particolarmente potenti, i filamenti di cristallo ti spareranno contro un raggio di luce dannoso se hanno una visuale libera. I filamenti sono abbastanza piccoli da muoversi facilmente attraverso i vari affioramenti di cristallo, ma non sono in grado di sparare attraverso di essi.
actors.mobs.crystalwisp.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.crystalwisp.name=filo di cristallo
actors.mobs.demonspawner.desc=Questo contorto amalgama di carne nanica è responsabile della creazione di demoni squartatori dai nani morti in questa regione. Chiaramente i demoni non vedono alcun problema nell'utilizzare ogni risorsa a loro disposizione contro i loro nemici.\n\nSebbene visivamente terrificanti, i generatori di demoni non hanno modo di muoversi o difendersi direttamente. La loro considerevole massa li rende tuttavia difficili da uccidere rapidamente, e genereranno demoni squartatori più velocemente quando sono sotto minaccia.\n\n_I generatori di demoni sembrano essere collegati a una fonte centrale di potere demoniaco. Ucciderli potrebbe indebolirla._
actors.mobs.demonspawner.name=generatore di demoni
actors.mobs.demonspawner.on_death=L'energia demoniaca qui sembra diminuire man mano che chi la genera muore.
actors.mobs.dm100.desc=Il DM-100 è un modello primitivo di "macchina di difesa" nanica, progettato per proteggere i minatori nani nelle caverne sottostanti questa prigione. Le sue scosse elettriche si rivelarono però troppo deboli, e quindi le macchine furono donate alla città umana in superficie. Rimasero inutilizzate per anni e alla fine giunsero alla prigione, dove il direttore inizialmente le ritenne troppo crudeli da usare. Tuttavia, con l'aumentare dell'indisciplina dei prigionieri, divennero indispensabili.
actors.mobs.dm100.name=DM-100
actors.mobs.dm100.zap_kill=Il fulmine ti ha ucciso...
actors.mobs.dm200.desc=Il DM-200 è la seconda generazione di "macchine da difesa" naniche, progettata per proteggere i minatori nani nelle caverne e nella città sotterranea. Sono molto più grandi e ingombranti dei loro predecessori e attaccano con devastanti pugni idraulici. Le loro dimensioni maggiori rappresentano anche il loro principale punto debole, poiché non riescono a passare attraverso gli stretti tunnel e le porte del dungeon. I nani sono riusciti a compensare la scarsa mobilità del DM-200 permettendogli di emettere fumi di scarico tossici contro i nemici distanti o irraggiungibili.
actors.mobs.dm200.name=DM-200
actors.mobs.dm200.vent=Il DM-200 emette un getto di gas di scarico tossici!
actors.mobs.dm201.desc=I nani sperimentarono brevemente con una maggiore enfasi sulla scarsa mobilità del DM-200 e crearono alcuni modelli di DM completamente stazionari. Il DM-201 è un DM-200 modificato che funge da torretta di guardia senza capacità di movimento. In cambio della mancanza di mobilità, i DM-201 hanno una resistenza e una potenza d'attacco significativamente maggiori. Poiché i DM-201 non hanno un motore da cui sfogare i gas di scarico, i nani li hanno equipaggiati con granate a gas corrosivo! I DM-201 sono tuttavia cauti nell'uso di queste granate e le lanciano solo quando attaccati da lontano.
actors.mobs.dm201.name=DM-201
actors.mobs.dm201.vent=Il DM-201 lancia una granata corrosiva!
actors.mobs.dm300.charge_lost=PILONE DISTRUTTO! RITORNO ALL'ALIMENTAZIONE LOCALE!
actors.mobs.dm300.charging=DANNI IN CORSO! ATTIVAZIONE DEL PILONE DI ALIMENTAZIONE!
actors.mobs.dm300.charging_hint=Il DM-300 è invulnerabile finché viene alimentato da un pilone!
actors.mobs.dm300.def_verb=bloccato
actors.mobs.dm300.defeated=DANNI CRITICI! TENTATIVO DI SHUTDO-
actors.mobs.dm300.desc=Questa macchina fu costruita dai nani diversi secoli fa. In seguito i nani iniziarono a sostituire le macchine con golem, elementali e persino demoni, causando infine il declino della loro civiltà. Il DM-300 e le macchine simili venivano impiegati nell'edilizia e nelle miniere, e talvolta nella difesa delle città.
actors.mobs.dm300.desc_supercharged=DM-300 è attualmente carico al massimo di energia elettrica. In questa forma DM-300 è indistruttibile e si muove a velocità doppia! Inoltre, la sua trivella ora ruota abbastanza velocemente da permettergli di scavare nella roccia solida, anche se in questo caso si muove molto più lentamente. Attaccare direttamente DM-300 mentre è super carico è inutile, ma qualcosa nell'area deve fornirgli questa energia; distruggerla potrebbe indebolirlo.
actors.mobs.dm300.name=DM-300
actors.mobs.dm300.notice=RILEVATO PERSONALE NON AUTORIZZATO!
actors.mobs.dm300.pylons_destroyed=ALLERTA! INSTABILITÀ RILEVATA NELLA RETE ELETTRICA!
actors.mobs.dm300.rankings_desc=Schiacciato dal DM-300
actors.mobs.dm300.shield=Il DM-300 preleva energia dai fili scoperti e si scherma da solo!
actors.mobs.dm300.supercharged=DISTRUGGI! DISTRUGGI! DISTRUGGI!
actors.mobs.dwarfking$dkghoul.rankings_desc=Cadde davanti al Re dei Nani
actors.mobs.dwarfking$dkgolem.rankings_desc=Cadde davanti al Re dei Nani
actors.mobs.dwarfking$dkmonk.rankings_desc=Cadde davanti al Re dei Nani
actors.mobs.dwarfking$dkwarlock.rankings_desc=Cadde davanti al Re dei Nani
actors.mobs.dwarfking.defeated=Tu... ci hai condannati tutti...
actors.mobs.dwarfking.desc=Molti anni fa, uno dei più potenti maghi della corte nanica scoprì segreti che gli conferirono un potere immenso sulla vita e sulla morte. Ben presto usò questo potere, soggiogando e corrompendo i suoi pari, il suo re e, infine, ogni cittadino nano. Ora è re, sovrano di una legione di sudditi non morti. Il Re dei Nani è un nemico aggressivo, che tenterà di circondare e sopraffare i suoi avversari con la sua orda di servitori non morti.
actors.mobs.dwarfking.enraged=Non puoi uccidermi %s. IO. SONO. IMMORTALE!
actors.mobs.dwarfking.lifelink_1=Ho bisogno della tua essenza, schiavo!
actors.mobs.dwarfking.lifelink_2=Sanguina per me, schiavo!
actors.mobs.dwarfking.losing=No! Non puoi farlo... non hai idea di cosa si nasconda sotto...
actors.mobs.dwarfking.name=Re dei Nani
actors.mobs.dwarfking.notice=Come osi! Non hai idea di cosa stai combinando!
actors.mobs.dwarfking.rankings_desc=Cadde davanti al Re dei Nani
actors.mobs.dwarfking.teleport_1=Occupatene, schiavo!
actors.mobs.dwarfking.teleport_2=Tienili occupati, schiavo!
actors.mobs.dwarfking.wave_1=Basta! Alzatevi, miei schiavi!
actors.mobs.dwarfking.wave_2=Ancora! Sanguina per il tuo re!
actors.mobs.dwarfking.wave_3=Inutili! Uccideteli subito!
actors.mobs.ebonymimic.desc=I mimic sono creature magiche in grado di assumere qualsiasi forma desiderino. Nei dungeon scelgono quasi sempre la forma di uno scrigno del tesoro per attirare avventurieri ignari. I mimic d'ebano sono mimic furtivi con la capacità di rendersi quasi invisibili. Si nascondono dietro oggetti con cui gli avventurieri potrebbero interagire, ma contengono anche un bottino proprio. Una volta scoperti, non sono più resistenti di un mimic normale, ma il loro morso a sorpresa è devastante.
actors.mobs.ebonymimic.discover_hint=È possibile individuare questo nemico con un particolare gingillo.
actors.mobs.ebonymimic.hidden_desc=Sembra esserci qualcosa qui, ma è quasi del tutto trasparente.
actors.mobs.ebonymimic.hidden_name=contorno sospetto
actors.mobs.ebonymimic.name=imitazione ebano
actors.mobs.ebonymimic.reveal=Lì c'era un imitatore!
actors.mobs.elemental$chaoselemental.desc=Gli elementali sono creature caotiche che spesso si creano quando una potente magia occulta non viene controllata adeguatamente. Gli elementali hanno un'intelligenza minima e sono solitamente associati a un particolare tipo di magia. Gli elementali del caos sono elementali rari e pericolosi che non si sono stabilizzati su un elemento specifico. Quando attaccano, scatenano una magia selvaggia e imprevedibile.
actors.mobs.elemental$chaoselemental.name=elementale del caos
actors.mobs.elemental$fireelemental.desc=Gli elementali sono creature caotiche che spesso si creano quando una potente magia occulta non viene controllata adeguatamente. Gli elementali hanno un'intelligenza minima e sono solitamente associati a un particolare tipo di magia. Gli elementali del fuoco sono un tipo comune di elementale che infligge danni con la magia del fuoco. Appiccano fiamme al bersaglio con attacchi in mischia e occasionalmente possono anche lanciare dardi di fuoco.
actors.mobs.elemental$fireelemental.name=elementale del fuoco
actors.mobs.elemental$frostelemental.desc=Gli elementali sono creature caotiche che spesso si creano quando una potente magia occulta non viene controllata adeguatamente. Gli elementali hanno un'intelligenza minima e sono solitamente associati a un particolare tipo di magia. Gli elementali del gelo sono un tipo comune di elementale che indebolisce i nemici con la magia del gelo. Congeleranno il loro bersaglio con attacchi in mischia e occasionalmente a distanza. La loro magia è molto più efficace in acqua.
actors.mobs.elemental$frostelemental.name=elemento del gelo
actors.mobs.elemental$newbornfireelemental.charging=L'elementale si sta caricando!
actors.mobs.elemental$newbornfireelemental.desc=Gli elementali sono creature caotiche che spesso vengono create quando una potente magia occulta non viene controllata adeguatamente. Gli elementali hanno un'intelligenza minima e sono solitamente associati a un particolare tipo di magia. Questo elementale del fuoco è stato appena evocato, ma è ancora piuttosto pericoloso!
actors.mobs.elemental$newbornfireelemental.desc_ally=Poiché questo elementale è stato evocato tramite un incantesimo, ha un maggiore controllo sulla sua fiamma. Non è in grado di effettuare attacchi a distanza, ma incendierà i nemici che attacca in mischia.
actors.mobs.elemental$newbornfireelemental.desc_boss=A causa della natura caotica della sua evocazione, questo elementale può diffondere fuoco solo in raffiche imprecise dopo aver caricato per un turno.
actors.mobs.elemental$newbornfireelemental.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.elemental$newbornfireelemental.name=elementale del fuoco neonato
actors.mobs.elemental$shockelemental.desc=Gli elementali sono creature caotiche che spesso si creano quando una potente magia occulta non viene controllata correttamente. Gli elementali hanno un'intelligenza minima e sono solitamente associati a un particolare tipo di magia. Gli elementali shock sono un tipo meno comune di elementale che disturba i suoi nemici con elettricità e lampi di luce. In mischia, scaricheranno elettricità verso i nemici vicini e infliggeranno danni bonus al loro bersaglio principale se si trova in acqua. Occasionalmente, concentreranno anche un raggio di luce a distanza sul loro bersaglio, accecandolo temporaneamente.
actors.mobs.elemental$shockelemental.name=elemento di shock
actors.mobs.eye.deathgaze_kill=Lo sguardo della morte ti ha ucciso...
actors.mobs.eye.desc=Questo demone è noto anche come «globo d'odio». Appena vede un nemico, scatena il suo sguardo mortale senza riguardo per nessuno, ferendo spesso anche i propri alleati.
actors.mobs.eye.name=occhio malvagio
actors.mobs.fetidrat.desc=C'è chiaramente qualcosa che non va in questo ratto. La sua pelliccia nera e untuosa e la pelle in putrefazione sono molto diverse da quelle dei ratti sani che hai visto in precedenza. I suoi occhi verde pallido lo fanno sembrare particolarmente minaccioso. Il ratto emana una nuvola di odore orribile, che è incredibilmente forte da vicino. Dalla bocca del ratto cola una sostanza scura e viscida che corrode il pavimento ma sembra dissolversi nell'acqua.
actors.mobs.fetidrat.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.fetidrat.name=ratto fetido
actors.mobs.fungalcore.desc=Questo fungo gigantesco deve essere la fonte di tutta l'attività fungina presente in questa grotta.
actors.mobs.fungalcore.name=nucleo fungino
actors.mobs.fungalsentry.desc=Questo fungo particolarmente alto funge da punto di difesa per la più ampia rete fungina che vive in questa grotta. È immobile, ma spara precisi getti di veleno contro qualsiasi cosa entri nel suo campo visivo. Sebbene l'impatto di questi getti sia piuttosto debole, possono accumulare quantità letali di veleno molto rapidamente. Anche se può essere ucciso, è probabilmente meglio evitarlo.
actors.mobs.fungalsentry.name=sentinella fungina
actors.mobs.fungalspinner.desc=Questo ragno delle caverne sembra essere controllato da un fungo parassita. Il fungo ha anche modificato le sue abilità, sostituendo le sue ragnatele e le sacche velenifere con una crescita fungina. Il ragno fungino sputerà vegetazione contro di te invece di ragnatele, diffondendo vegetazione fungina e potenzialmente immobilizzandoti. Sebbene non possa avvelenarti, il ragno fungino acquisirà una notevole resistenza ai danni se si trova vicino a dei funghi.
actors.mobs.fungalspinner.name=filatrice fungina
actors.mobs.ghoul.desc=Mentre la società nanica iniziava lentamente a collassare e l'attuale re dei nani prendeva il potere assoluto, coloro che erano deboli o che gli resistevano non venivano trattati bene. Man mano che il re diventava più abile nell'uso della magia oscura, piegò questi nani al suo volere, e ora costituiscono i fanti del suo esercito. I ghoul non sono particolarmente forti da soli, ma viaggiano sempre in gruppo e sono molto più difficili da uccidere in gran numero. Quando un ghoul viene sconfitto, risorgerà dopo alcuni turni purché un altro ghoul sia nelle vicinanze.
actors.mobs.ghoul.name=ghoul nano
actors.mobs.gnoll.desc=Gli gnoll sono umanoidi simili alle iene. Abitavano nelle fogne e nei sotterranei, avventurandosi di tanto in tanto in superficie per compiere incursioni. Gli esploratori gnoll sono membri regolari del loro branco, non sono forti come i bruti né intelligenti come gli sciamani.
actors.mobs.gnoll.name=esploratore gnoll
actors.mobs.gnollexile.desc=Questo gnoll dalla pelliccia grigia ha un grande segno sulla spalla, che indica che è un esiliato. Gli gnoll vengono solitamente esiliati dalla loro società per aver ignorato gli ordini o infranto le leggi. Gli esiliati devono essere forti e astuti per sopravvivere, e questo sembra saper usare bene la lancia che impugna.
actors.mobs.gnollexile.desc_aggro=_L'esule gnoll si guarda intorno con rabbia._ Sembra che qualcosa lo abbia spinto a combattere, dopotutto. Attenzione a quella lancia!
actors.mobs.gnollexile.desc_passive=_L'esule gnoll non si muove per attaccare._ Non sembra aggressivo come gli altri gnoll qui presenti e probabilmente non pensa che valga la pena combattere contro di te. Potresti semplicemente lasciarlo passare, ma ha uno zaino che potrebbe essere pieno di oggetti utili...
actors.mobs.gnollexile.name=esilio degli gnoll
actors.mobs.gnollexile.seen_aggro=Lo gnoll armato di lancia si muove all'attacco!
actors.mobs.gnollexile.seen_passive=Lo gnoll armato di lancia ti guarda con diffidenza, ma non si muove per attaccare.
actors.mobs.gnollgeomancer.alert=Il geomante si risveglia! L'intera caverna sembra tremare mentre balza via ridendo follemente!
actors.mobs.gnollgeomancer.desc=Questo gnoll anziano, di statura imponente, dev'essere la fonte delle varie magie di movimento terra che si trovano qui intorno, nonché l'organizzatore di tutte le attività degli gnoll. A differenza dei sabotatori gnoll della zona, il geomante è piuttosto abile con la sua magia e non può essere danneggiato da rocce lanciate o cadute. Non è però in grado di combattere in mischia.
actors.mobs.gnollgeomancer.desc_armor=Il geomante è attualmente protetto da uno strato di armatura rocciosa. Dovrai avvicinarti e romperlo con il tuo piccone prima di poterlo danneggiare.
actors.mobs.gnollgeomancer.desc_armor_sapper=_Un geniere gnoll nelle vicinanze sta impugnando un dispositivo che potenzia l'armatura di roccia del geomante. Al momento non potrai danneggiarla in alcun modo!_
actors.mobs.gnollgeomancer.desc_sleeping=Questo sciamano gnoll, incredibilmente alto, è circondato da uno strato di roccia e sembra quasi una statua. Guardando attentamente, si può notare come la roccia si muova magicamente a ritmo con il respiro dello gnoll anziano. Non può essere ferito finché è racchiuso nella roccia in questo modo e sembra che si stia godendo un vero e proprio sonnellino nella terra. Probabilmente puoi rompere gli strati di roccia con il tuo piccone, ma assicurati di essere pronto a combattere quando lo farai. Il geomante deve essere la fonte delle varie magie di movimento della terra presenti in questa zona e l'organizzatore di tutte le attività degli gnoll. Sconfiggere gli gnoll sparsi qui intorno prima di affrontarlo potrebbe essere una buona idea.
actors.mobs.gnollgeomancer.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.gnollgeomancer.name=gnoll geomante
actors.mobs.gnollgeomancer.rock_kill=Il masso volante ti ha ucciso...
actors.mobs.gnollgeomancer.rockfall_kill=Le rocce che cadevano ti hanno ucciso...
actors.mobs.gnollgeomancer.warning=Il geomante comincia a muoversi. Assicurati di essere pronto prima di continuare!
actors.mobs.gnollguard.def_verb=bloccato
actors.mobs.gnollguard.desc=Un gnoll grande e dall'aspetto robusto che brandisce una lancia e uno scudo, ma senza elmo. Queste guardie sono probabilmente bruti in addestramento, reclutati per aiutare a proteggere la miniera dalla fauna selvatica invasiva. La guardia gnoll è abbastanza forte da brandire la lancia in una mano, ma non sa usarla molto bene. Avrà bisogno di uno spazio abbastanza aperto per attaccare a distanza e ti infliggerà molti meno danni se ti avvicini.
actors.mobs.gnollguard.desc_armor=_Un gnoll guastatore nelle vicinanze sta impugnando un dispositivo che conferisce a questa guardia un'armatura di terra, riducendo notevolmente i danni subiti._
actors.mobs.gnollguard.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.gnollguard.name=guardia gnoll
actors.mobs.gnollguard.spear_warn=Lo gnoll sferra un colpo micidiale con la punta della sua lancia!
actors.mobs.gnollsapper.desc=Un piccolo e debole ma intelligente gnoll con pelliccia chiara e una borsa piena di vari gadget. Probabilmente sono qui per aiutare nella prospezione e nell'estrazione di oro scuro, e hanno una guardia nelle vicinanze per protezione. Sono capaci di combattere, ma i loro attacchi sono pietosamente deboli, non più forti di quelli di un esploratore gnoll. Invece di combattere direttamente, i genieri preferiscono usare i vari gadget a loro disposizione per far sì che l'ambiente roccioso attacchi per loro. Non conoscono però la magia di movimento della terra, quindi è molto probabile che usino i loro gadget in modo sconsiderato. _Ci dovrebbero essere molti modi per usare i loro attacchi contro di loro o contro la loro guardia._
actors.mobs.gnollsapper.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.gnollsapper.name=gnoll zappatore
actors.mobs.gnolltrickster.desc=Una creatura dall'aspetto strano, persino per gli standard degli gnoll. È curva in avanti con un sorriso malvagio, quasi cullando la borsa appesa alla spalla. I suoi occhi sono spalancati da uno strano misto di paura ed eccitazione. Nella sua borsa c'è una grande collezione di dardi malfatti, tutti con la punta imbevuta di varie sostanze nocive.
actors.mobs.gnolltrickster.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.gnolltrickster.name=gnoll imbroglione
actors.mobs.goldenmimic.desc=I mimic sono creature magiche che possono assumere qualsiasi forma desiderino. Nei dungeon scelgono quasi sempre la forma di uno scrigno del tesoro, per attirare avventurieri ignari. I mimic dorati sono mimic più resistenti che cercano di attirare gli avventurieri più forti. Hanno un bottino migliore, ma sono anche molto più forti dei mimic normali.
actors.mobs.goldenmimic.name=mimo dorato
actors.mobs.golem.def_verb=bloccato
actors.mobs.golem.desc=I nani cercarono di unire le loro conoscenze meccaniche al nuovo potere di vincolare gli elementali. Usarono spiriti della terra come «anima» per i corpi meccanici dei golem, convinti che fossero i più docili. Eppure bastava il minimo errore nel rituale per farli sfuggire al controllo.
actors.mobs.golem.name=Golem
actors.mobs.goo.!!!=!!!
actors.mobs.goo.defeated=glurp... glurp...
actors.mobs.goo.desc=Si sa poco della Melma. Forse non è neppure una creatura, ma un ammasso di sostanze delle fogne che ha sviluppato un accenno di volontà propria.
actors.mobs.goo.enraged=infuriato
actors.mobs.goo.gluuurp=GLUUUURP!
actors.mobs.goo.name=Melma
actors.mobs.goo.notice=GLURP-GLURP!
actors.mobs.goo.pumpup=Goo si sta gonfiando!
actors.mobs.goo.rankings_desc=Assorbito dalla sostanza gelatinosa
actors.mobs.greatcrab.def_verb=bloccato
actors.mobs.greatcrab.desc=Questo granchio è gigantesco, persino rispetto ad altri granchi di fogna. Il suo carapace blu è ricoperto di crepe e cirripedi, segno di una grande età. Si muove goffamente e lentamente, a malapena riuscendo a mantenere l'equilibrio con la sua enorme chela. Sebbene il granchio abbia una sola chela, le sue dimensioni compensano facilmente. Il granchio tiene la chela davanti a qualsiasi minaccia, proteggendosi dietro un'impenetrabile parete di carapace. Tuttavia, il granchio non può bloccare gli attacchi che non vede arrivare, o gli attacchi di più nemici contemporaneamente.
actors.mobs.greatcrab.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.greatcrab.name=granchio grande
actors.mobs.greatcrab.noticed=Il granchio blocca con la sua enorme chela.
actors.mobs.guard.def_verb=bloccato
actors.mobs.guard.desc=Un tempo custodi della prigione, queste guardie sono ormai diventate come i detenuti. Si trascinano come zombie, vagando senza cervello per i corridoi alla ricerca di qualsiasi cosa fuori posto, come te! Portano catene intorno ai fianchi, probabilmente usate per attirare i nemici a distanza ravvicinata.
actors.mobs.guard.name=guardia carceraria
actors.mobs.guard.scorpion=Vieni qui!
actors.mobs.hermitcrab.def_verb=bloccato
actors.mobs.hermitcrab.desc=Per un motivo o per l'altro, questo granchio di fogna ha deciso di indossare sulla testa la parte superiore rotta di una botte! Il peso extra lo ha rallentato fino a riportarlo alla velocità normale, ma gli ha anche garantito una difesa considerevolmente maggiore. Ti sembra di sentire qualcosa che rimbalza all'interno della botte, però...
actors.mobs.hermitcrab.name=paguro
actors.mobs.mimic.desc=I mimic sono creature magiche in grado di assumere qualsiasi forma desiderino. Nei dungeon scelgono quasi sempre la forma di uno scrigno del tesoro per attirare avventurieri ignari. I mimic hanno un morso doloroso, ma spesso contengono più tesori di uno scrigno normale.
actors.mobs.mimic.discover_hint=Puoi trovare questo nemico ovunque nel dungeon.
actors.mobs.mimic.hidden_hint=C'è qualcosa di strano in questo forziere... Avvicinarsi e provare ad aprirlo potrebbe non essere una buona idea.
actors.mobs.mimic.name=mimic
actors.mobs.mimic.reveal=Quel forziere è un mimetico!
actors.mobs.mob.died=Si sente qualcosa morire in lontananza.
actors.mobs.mob.discover_hint=È possibile trovare questo nemico in una specifica area del dungeon.
actors.mobs.mob.rage=#$%^
actors.mobs.mob.rankings_desc=Ucciso da: %s
actors.mobs.monk$focus.desc=Questo monaco è perfettamente concentrato sul suo bersaglio e sembra anticiparne le mosse prima ancora che vengano eseguite. Mentre è concentrato, il prossimo attacco fisico sferrato contro questo personaggio è destinato a mancare, indipendentemente dalle circostanze. Parare questo attacco consumerà la concentrazione del monaco, che dovrà poi accumularla nuovamente per parare un altro attacco. I monaci accumulano concentrazione più velocemente mentre sono in movimento.
actors.mobs.monk$focus.name=focalizzato
actors.mobs.monk.def_verb=bloccato
actors.mobs.monk.desc=Questi monaci fanatici si sono votati a proteggere i segreti della loro città da ogni straniero. Non usano armi né armature e si affidano soltanto all'arte del combattimento a mani nude.
actors.mobs.monk.name=monaco nano
actors.mobs.monk.parried=parato
actors.mobs.necromancer$necroskeleton.desc=Questo scheletro è stato evocato da un negromante. Si comporta come un normale scheletro e morirà quando il negromante che lo ha evocato verrà ucciso.
actors.mobs.necromancer$necroskeleton.name=scheletro del negromante
actors.mobs.necromancer.desc=Questi apprendisti maghi oscuri si sono riversati nella prigione, poiché è il luogo perfetto per praticare la loro arte malvagia. I negromanti evocheranno e potenzieranno gli scheletri per combattere al loro fianco. Uccidere il negromante ucciderà anche lo scheletro che evoca.
actors.mobs.necromancer.name=negromante
actors.mobs.npcs.blacksmith.cant_enter_old=Quell'area non è accessibile in questa partita. Inizia una nuova partita per provare la nuova missione!
actors.mobs.npcs.blacksmith.def_verb=bloccato
actors.mobs.npcs.blacksmith.desc=Questo fabbro troll ha l'aspetto di tutti i troll: è alto e magro, e la sua pelle ricorda la pietra sia per colore che per consistenza. Il fabbro troll sta armeggiando con attrezzi sproporzionatamente piccoli.
actors.mobs.npcs.blacksmith.enter_no=Non ancora
actors.mobs.npcs.blacksmith.enter_yes=Sono pronto
actors.mobs.npcs.blacksmith.entrance_blocked=La via per scendere è bloccata.
actors.mobs.npcs.blacksmith.exit_no=Non ancora
actors.mobs.npcs.blacksmith.exit_warn_crystal=Anche quel cristallo gigante è ancora laggiù. Ti pago di più se lo distruggi.
actors.mobs.npcs.blacksmith.exit_warn_full=Hai finito? Hai un sacco d'oro, ma assicurati di non aver lasciato indietro la tua attrezzatura.\n\n_Ricorda, non ti lascerò rientrare una volta che sarai tornato su._
actors.mobs.npcs.blacksmith.exit_warn_fungi=Quel fungo gigante è ancora laggiù. Ti pago di più se lo uccidi.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Anche quel geomante gnoll è ancora laggiù. Ti pago di più se lo uccidi.
actors.mobs.npcs.blacksmith.exit_warn_high=Hai finito? Sembra che tu abbia una buona quantità d'oro, ma me ne servirebbe un po' di più. Dovresti riuscire a ottenere 40 pezzi. Ricorda, una volta che sarai tornato su, non ti lascerò rientrare.
actors.mobs.npcs.blacksmith.exit_warn_low=Hai già finito? Non sembra che tu abbia molto oro. Dovresti riuscire a ottenere _40 pezzi._\n\n_Ricorda, non ti lascerò rientrare una volta che sarai tornato su._
actors.mobs.npcs.blacksmith.exit_warn_med=Hai finito? Hai almeno un po' d'oro, ma ce n'è sicuramente altro nella miniera. Dovresti riuscire a prenderne 40 pezzi. Ricorda, una volta che sarai uscito, non ti lascerò rientrare.
actors.mobs.npcs.blacksmith.exit_warn_none=Hai già finito? Non hai quasi più oro! Dovresti riuscire a ottenere 40 pezzi. Ricorda, non ti lascerò rientrare una volta che sarai arrivato in alto.
actors.mobs.npcs.blacksmith.exit_yes=Ho finito
actors.mobs.npcs.blacksmith.get_lost=Sono occupato. Sparisci!
actors.mobs.npcs.blacksmith.intro_quest_cleric=Ehi, umano! Hai l'aria di essere una persona importante.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Attento però, la miniera è pericolosa per un piccolo umano come te. È abbandonata da un po' e un mucchio di cristalli hanno iniziato a crescere. Sono lucenti, ma troppo fragili per valere qualcosa, e sono protetti da qualcosa di magico. Sono piuttosto forti, quindi fai attenzione a dove scavi o attirerai la loro attenzione. C'è anche un cristallo gigante da qualche parte. È molto più resistente, quindi preparati a combattere se inizi a romperlo. Scommetto che distruggerlo rallenterà la crescita di tutti i cristalli, quindi ti pagherò di più se ci riesci.
actors.mobs.npcs.blacksmith.intro_quest_duelist=Ehi, umano! Sembri una persona coraggiosa.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Attento però, la miniera è pericolosa per un piccolo umano come te. C'è una specie di mostro fungino che è cresciuto laggiù. Ha delle sentinelle fungine che sono davvero letali se ti vedono, ma almeno non possono alzarsi e inseguirti. _Rimani nascosto_ se vuoi restare vivo.\n\nI Ti pagherò di più se riesci a sconfiggere il _fungo più grande_, ma ci vorrà un vero sforzo. È collegato a un mucchio di nodi di micelio nascosti nelle pareti. Dovrai romperne la maggior parte prima di poterlo danneggiare seriamente.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Attento però, la miniera è pericolosa per un piccolo umano come te. Anche alcuni gnoll vogliono l'oro e ora stanno distruggendo tutto. Sono degli stupidi, quindi le loro attività minerarie hanno causato crolli e smottamenti di ogni tipo. Dovrai scavare attraverso di essi, quindi cerca rocce smosse di recente. Penso che uno degli gnoll stia causando la maggior parte dei problemi, probabilmente uno sciamano geomante o qualcosa del genere. Ti pagherò di più se riesci a trovarlo e ucciderlo, ma sono sicuro che si difenderà.
actors.mobs.npcs.blacksmith.intro_quest_huntress=Ehi, umano! Sembri uno svelto.
actors.mobs.npcs.blacksmith.intro_quest_mage=Ehi, umano! Sembri una persona intelligente.
actors.mobs.npcs.blacksmith.intro_quest_rogue=Ehi, umano! Hai l'aria di uno furbo.
actors.mobs.npcs.blacksmith.intro_quest_start=Vuoi essere utile, eh? Sì, ho qualcosa che potresti fare. Ho costruito quest'officina sopra una vecchia miniera, è proprio in fondo a quella scala. Prendi questo piccone e scavami un po' di minerale d'oro scuro. 40 pezzi dovrebbero bastare. La roccia laggiù è bella morbida, quindi _potrai scavare attraverso le pareti con un po' di sforzo._\n\nCosa intendi, come dovrei pagare? Sei avido...\n\nOk, ok, posso fare un po' di forgiatura per te. Considerati fortunato, sono l'unico fabbro in zona.
actors.mobs.npcs.blacksmith.intro_quest_warrior=Ehi, umano! Hai l'aria di uno tosto.
actors.mobs.npcs.blacksmith.lost_pick=Ma stai scherzando? Dov'è il mio piccone?!
actors.mobs.npcs.blacksmith.name=fabbro troll
actors.mobs.npcs.blacksmith.quest_start_prompt=Sei pronto a scendere? Assicurati di avere un po' di spazio libero per l'oro.\n\n_Ti lascio scendere laggiù solo una volta!_
actors.mobs.npcs.blacksmith.reminder=Hai finito di farmi perdere tempo? L'ingresso della miniera è laggiù.
actors.mobs.npcs.blacksmith.reminder_crystal=Portami quanto più oro possibile e prova anche a rompere il grande cristallo.
actors.mobs.npcs.blacksmith.reminder_fungi=Portami più oro possibile e cerca anche di uccidere il fungo gigante.
actors.mobs.npcs.blacksmith.reminder_gnoll=Portami più oro possibile e cerca anche di uccidere il geomante gnoll.
actors.mobs.npcs.ghost.crab_1=Ciao %s... Una volta ero come te, forte e sicuro di me... Ma sono stato ucciso da un'antica creatura... Non posso lasciare questo posto... Non finché non avrò ottenuto la mia vendetta... Uccidi il _grande granchio_ che mi ha tolto la vita... \n\n È innaturalmente vecchio... Con un'enorme chela singola e un guscio spesso... _Attenzione alla sua chela, devi sorprendere il granchio o ti bloccherà con essa..._
actors.mobs.npcs.ghost.crab_2=Per favore... Aiutami... Uccidi il crostaceo...\n\n_Si bloccherà sempre... Quando ti vede arrivare..._
actors.mobs.npcs.ghost.desc=Il fantasma è appena visibile. Sembra una macchia informe di luce fioca con un volto triste.
actors.mobs.npcs.ghost.find_me=Grazie... vieni a trovarmi...
actors.mobs.npcs.ghost.gnoll_1=Ciao %s... Una volta ero come te, forte e sicuro di me... Ma sono stato ucciso da un nemico subdolo... Non posso lasciare questo posto... Non finché non avrò ottenuto la mia vendetta... Uccidi il _gnoll imbroglione_ che mi ha tolto la vita... \n\n Non è come gli altri gnoll... Si nasconde e usa armi da lancio... _Attenzione ai suoi dardi velenosi e incendiari, non attaccare da lontano..._
actors.mobs.npcs.ghost.gnoll_2=Per favore... Aiutami... Uccidi l'ingannatore... \n\n_Non lasciarti colpire... Avvicinati..._
actors.mobs.npcs.ghost.name=fantasma triste
actors.mobs.npcs.ghost.rat_1=Ciao %s... Una volta ero come te, forte e fiducioso... Ma sono stato ucciso da una bestia immonda... Non posso lasciare questo posto... Non finché non avrò ottenuto la mia vendetta... Uccidere il _topo fetido_ che mi ha tolto la vita... \n\n Si aggira per questo pavimento... Spargendo sporcizia ovunque... _Attenti alla sua nube di fetore e al suo morso corrosivo, l'acido si scioglie in acqua..._
actors.mobs.npcs.ghost.rat_2=Per favore... Aiutami... Uccidi l'abominazione...\n\n_Combattila vicino all'acqua... Evita la puzza..._
actors.mobs.npcs.imp.cya=Ci vediamo, %s!
actors.mobs.npcs.imp.desc=Gli imp sono demoni minori. Non si distinguono né per la forza né per il talento magico, ma sono piuttosto intelligenti e socievoli. Molti imp preferiscono vivere tra i non demoni.
actors.mobs.npcs.imp.golems_1=Nel mio caso si tratta di _golem_ che devono essere uccisi. Vedete, sto per avviare una piccola attività, ma quegli stupidi golem sono un disastro per gli affari! È molto difficile negoziare con quei blocchi di granito erranti, dannazione! Quindi, per favore, uccidetene... diciamo _4_ e riceverete una ricompensa.
actors.mobs.npcs.imp.golems_2=Come procede il tuo safari dei golem? Non dimenticare di raccogliere i gettoni!
actors.mobs.npcs.imp.hey=Psst, %s!
actors.mobs.npcs.imp.intro=Sei un avventuriero? Adoro gli avventurieri! Ci si può sempre fidare di loro se c'è qualcosa da eliminare, vero? Ovviamente per una ricompensa ;)
actors.mobs.npcs.imp.monks_1=Nel mio caso si tratta di _monaci_ che devono essere uccisi. Vedete, sto per avviare una piccola attività qui, ma quei pazzi non comprano niente e allontaneranno gli altri clienti. Quindi, per favore, uccidetene... diciamo _5_ e riceverete una ricompensa.
actors.mobs.npcs.imp.monks_2=Oh, sei ancora vivo! Sapevo che il tuo kung-fu sarebbe stato più forte ;) Non dimenticare di prendere quei gettoni.
actors.mobs.npcs.imp.name=ambizioso folletto
actors.mobs.npcs.impshopkeeper.buyback=Il folletto ti restituisce allegramente l'oggetto.
actors.mobs.npcs.impshopkeeper.desc=Il folletto ha allestito una piccola bottega al confine dei corridoi interni. È piacevole vedere un volto amico, ma i suoi prezzi non sembrano affatto amichevoli.
actors.mobs.npcs.impshopkeeper.greetings=Ciao, %s!
actors.mobs.npcs.impshopkeeper.greetings_ascent=Cosa hai fatto %s? Fai in fretta, devo andarmene da qui!
actors.mobs.npcs.impshopkeeper.name=ambizioso folletto
actors.mobs.npcs.impshopkeeper.thief=Pensavo di potermi fidare di te!
actors.mobs.npcs.mirrorimage.desc=Questa illusione ti somiglia molto, ma è più pallida e ha qualche piccolo tremito.
actors.mobs.npcs.mirrorimage.discover_hint=Puoi trovare questo personaggio con una pergamena specifica.
actors.mobs.npcs.mirrorimage.name=immagine speculare
actors.mobs.npcs.npc.discover_hint=Puoi trovare questo personaggio in una specifica area del dungeon.
actors.mobs.npcs.prismaticimage.desc=Questa scintillante illusione ti somiglia molto, sembrando persino impugnare la tua arma e armatura attuali. Le immagini prismatiche cercheranno di individuare e attirare l'attenzione dei nemici, usando la loro difesa e salute potenziate per proteggerti. Sebbene non abbiano la stessa potenza offensiva delle immagini speculari, hanno una maggiore resistenza, incluso il ricevere benefici dalla tua armatura. Quando i punti vita si riducono a 0, le immagini prismatiche svaniranno nel corso di diversi turni e potranno comunque essere curate durante questo periodo. Quando non sono presenti nemici, le immagini prismatiche svaniranno e si ricongiungeranno al loro padrone.
actors.mobs.npcs.prismaticimage.discover_hint=Puoi trovare questo personaggio con una pergamena specifica.
actors.mobs.npcs.prismaticimage.name=immagine prismatica
actors.mobs.npcs.ratking.confused=Cosa... Dove sono? Il mio regno ha bisogno di me!
actors.mobs.npcs.ratking.crown_after=Ti piace la tua nuova armatura? Non si torna indietro!
actors.mobs.npcs.ratking.crown_clothes=Mettiti dei vestiti! Non sei in condizioni di parlare con un membro della famiglia reale!
actors.mobs.npcs.ratking.crown_desc=Ohhh, quella corona è per me!? Sembra molto più splendente della mia, quindi l'accetto volentieri! In effetti, credo di poterti offrire qualcosa come ricompensa per questa corona. Un potere straordinario, degno di un eroe come te! Ti piacerebbe?
actors.mobs.npcs.ratking.crown_fine=Va bene! Tanto non lo volevo comunque...
actors.mobs.npcs.ratking.crown_info=Dimmi di più prima.
actors.mobs.npcs.ratking.crown_no=Preferirei di no...
actors.mobs.npcs.ratking.crown_thankyou=Hehehe, grazie! Ora vai e rendi orgoglioso il tuo re!
actors.mobs.npcs.ratking.crown_yes=Ovviamente!
actors.mobs.npcs.ratking.desc=Questo ratto è un po' più grande di un normale ratto marsupiale. Ha una piccola corona sulla testa.
actors.mobs.npcs.ratking.desc_birthday=Questo topo è un po' più grande di un normale ratto marsupiale. Indossa un minuscolo cappellino da festa verde al posto della sua solita corona. Buon compleanno, Re dei Topi!
actors.mobs.npcs.ratking.desc_crown=Questo ratto è un po' più grande di un normale ratto marsupiale. Sulla testa porta una corona da re nano.
actors.mobs.npcs.ratking.desc_winter=Questo ratto è un po' più grande di un normale ratto marsupiale. Indossa un piccolo cappellino festivo al posto della sua solita corona. Buone feste!
actors.mobs.npcs.ratking.discover_hint=Puoi trovare questo personaggio alla fine di una specifica area del dungeon.
actors.mobs.npcs.ratking.name=re dei topi
actors.mobs.npcs.ratking.not_sleeping=Non riesco a dormire!
actors.mobs.npcs.ratking.what_is_it=Che cos'è? Non ho tempo per queste sciocchezze. Il mio regno non si governerà da solo!
actors.mobs.npcs.sheep.baa!=Baa!
actors.mobs.npcs.sheep.baa.=Baa.
actors.mobs.npcs.sheep.baa...=Baa...
actors.mobs.npcs.sheep.baa?=Baa?
actors.mobs.npcs.sheep.def_verb=bloccato
actors.mobs.npcs.sheep.desc=Questa è una pecora magica. Cosa c'è di magico? Non puoi ucciderla. Rimarrà lì immobile finché non svanirà magicamente, ruminando con uno sguardo perso nel vuoto.
actors.mobs.npcs.sheep.discover_hint=È possibile trovare questo personaggio con un oggetto o una trappola specifici.
actors.mobs.npcs.sheep.name=pecora
actors.mobs.npcs.shopkeeper.buyback=Il negoziante, a malincuore, ti restituisce l'articolo.
actors.mobs.npcs.shopkeeper.desc=Questo tipo corpulento sembra più adatto a un quartiere commerciale di una grande città che a una prigione. I suoi prezzi spiegano perché preferisce fare affari qui.
actors.mobs.npcs.shopkeeper.flee=Il negoziante scappa!
actors.mobs.npcs.shopkeeper.name=negoziante
actors.mobs.npcs.shopkeeper.sell=Vendi un articolo
actors.mobs.npcs.shopkeeper.talk=Parlare
actors.mobs.npcs.shopkeeper.talk_ascent=Non so cosa tu abbia intenzione di fare con quell'amuleto, ma io non ne voglio sapere niente. Comprati qualcosa e vattene, dobbiamo entrambi andarcene da questo posto!
actors.mobs.npcs.shopkeeper.talk_caves=Spendi soldi, vivi più a lungo.\n\nOh, e saluta da parte mia quel fabbro troll se lo vedi. Ricorda a quel buono a nulla che mi deve ancora dei soldi per quel martello che gli ho venduto la settimana scorsa!
actors.mobs.npcs.shopkeeper.talk_city=La mia merce può tenerti al sicuro qui sotto.\n\n...E per favore, non indugiare. Ci è voluto un'eternità per convincere la gente del posto a lasciarmi in pace, non voglio che tu attiri guai!
actors.mobs.npcs.shopkeeper.talk_halls=Ehi, ho dei prezzi speciali per i cacciatori di demoni!\n\nOh, e fate attenzione laggiù! Ai demoni sotto non importerà quanto siate coraggiosi. Non potete tornare su e spendere altri soldi se siete morti! ;)\n\nI demoni sono come me? Hehe, per niente. Sono solo un piccolo tipo, non un gran combattente, e sono riuscito a mantenere la mia mente intatta. I demoni sotto sono cose molto più forti, e sono stati tutti resi schiavi da... beh... fate solo attenzione laggiù.
actors.mobs.npcs.shopkeeper.talk_prison_cleric=Ehi, salve Vostra Altezza, o forse è Vostra Santità adesso? Hehe, in ogni caso questo non è un posto per te, molte persone sarebbero piuttosto sconvolte se finissi morto. Sicuramente avrai delle monete, però, perché non compri qualcosa per evitare che accada?
actors.mobs.npcs.shopkeeper.talk_prison_duelist=Guarda chi si vede, l'eroe viaggiatore! Se stai cercando di salvare un'altra città, buona fortuna, i pericoli qui sono ben peggiori delle semplici bande di briganti. Sono sicuro che te la caverai meglio di chiunque altro, cerca solo di non morire proprio davanti al mio negozio.
actors.mobs.npcs.shopkeeper.talk_prison_huntress=Sembra che tu sia fuori dal tuo elemento, signorina. Gli stretti corridoi delle segrete non sono spaziosi come le grandi sale o le foreste che circondano la città, vero? Hehe, oh non badare alle mie divagazioni, perché non compri qualcosa?
actors.mobs.npcs.shopkeeper.talk_prison_intro=Ho tutto ciò che ti serve per un'avventura di successo!
actors.mobs.npcs.shopkeeper.talk_prison_mage=Hehe, credo di aver visto un manifesto con il tuo nome da qualche parte in città. Sei in fuga, eh? Oh, sei innocente, vero? Certo, certo... Non preoccuparti, ho cose migliori da fare che denunciarti, ma forse dovresti comprare qualcosa per esserne sicuro?
actors.mobs.npcs.shopkeeper.talk_prison_rogue=Sei venuto dalla gilda dei ladri per ripulire la zona? No, solo per fare shopping? Beh, già che ci sei, uccidi anche qualche mostro. Non aspettarti sconti, ti pago un bel po' di soldi per la protezione e a malapena riesci a tenermi al sicuro qui sotto.
actors.mobs.npcs.shopkeeper.talk_prison_warrior=Che sigillo interessante che hai, di solito sono integri. Sei un eroe caduto in disgrazia o qualcosa del genere? Beh, qualunque cosa tu abbia fatto non sono affari miei, le tue monete sono ancora valide.
actors.mobs.npcs.shopkeeper.thief=Ladro, ladro!
actors.mobs.npcs.shopkeeper.warn=Fai attenzione! Non ti avvertirò più.
actors.mobs.npcs.vaultlaser.desc=Questa torretta spara raggi laser a intervalli regolari. _Trattandosi di un'area di prova, i laser non vi danneggeranno realmente._
actors.mobs.npcs.vaultlaser.name=sentinella laser per caveau
actors.mobs.npcs.vaultsentry.desc=Questa sentinella sta scansionando l'area secondo uno schema predefinito. _Trattandosi di un'area di prova, la sentinella non farà nulla se vi rileva._
actors.mobs.npcs.vaultsentry.name=sentinella addetta alla scansione della cassaforte
actors.mobs.npcs.wandmaker.def_verb=bloccato
actors.mobs.npcs.wandmaker.desc=Questo signore anziano ma in buona salute ha un'espressione leggermente confusa. È protetto da uno scudo magico.
actors.mobs.npcs.wandmaker.intro_1=I Sono venuto qui per trovare un ingrediente raro per una bacchetta, ma mi sono perso e il mio scudo magico si sta indebolendo. Dovrò andarmene presto, ma non posso sopportare di andarmene senza aver ottenuto ciò per cui sono venuto.
actors.mobs.npcs.wandmaker.intro_2=Se riesci a procurarmelo, sarò felice di pagarti con una delle mie bacchette finemente lavorate! Ne ho portate due con me, quindi puoi prendere quella che preferisci.
actors.mobs.npcs.wandmaker.intro_berry=Il vecchio direttore di questa prigione teneva una pianta di _bacche marce_ e io sono alla ricerca di uno dei suoi semi. Probabilmente la pianta è ormai cresciuta in modo incontrollato, quindi ottenere un seme potrebbe essere difficile. Il suo giardino dovrebbe essere da queste parti. Cercate di _stare lontani dai suoi tralci_ se volete rimanere illesi. Usare il fuoco potrebbe essere allettante, ma per favore non fatelo, uccidereste la pianta e distruggereste i suoi semi.
actors.mobs.npcs.wandmaker.intro_cleric=Oh, salve Vostra Altezza! Che piacevole sorpresa incontrarLa in un luogo così deprimente! Mi dispiace disturbarLa, ma potrei avere un incarico per Lei.
actors.mobs.npcs.wandmaker.intro_duelist=Oh, salve signorina! Che piacevole sorpresa incontrare un eroe in un posto così deprimente! Se le va di dare una mano a un vecchio, potrei avere un compito per lei.
actors.mobs.npcs.wandmaker.intro_dust=Sto cercando della _polvere di cadavere_. È un tipo speciale di farina d'ossa maledetta che di solito si trova in posti come questo. Dovrebbe esserci una stanza barricata da qualche parte qui intorno, sono sicuro che ne troverai un po'. Fai attenzione però, la maledizione che porta con sé è piuttosto potente, _contattami al più presto_ e la purificherò per te.
actors.mobs.npcs.wandmaker.intro_ember=Sto cercando delle braci fresche da un elementale del fuoco appena nato. Gli elementali di solito compaiono quando un rituale di evocazione non è controllato, quindi basta trovare delle candele e un luogo adatto per un rituale e sono sicuro che ne troverai uno. Dovrai però evitare di chiuderti in una gabbia mentre lo combatti, oppure potresti tenere a portata di mano un oggetto congelante. Gli elementali appena nati sono piuttosto potenti e caotici, ma non sopportano il freddo.
actors.mobs.npcs.wandmaker.intro_huntress=Oh, salve signorina! Un volto amico è una piacevole sorpresa quaggiù, non è vero? In effetti, giurerei di aver già visto il suo viso, ma non riesco a ricordare dove... Oh, non importa, se è qui in cerca di avventura, potrei avere un compito per lei.
actors.mobs.npcs.wandmaker.intro_mage=Oh, ciao %s! Ho sentito che c'è stato un po' di trambusto tra te e l'Istituto dei Maghi? Oh, lascia perdere, non mi sono mai piaciuti quei tipi noiosi. Se sei disponibile, potrei avere un compito per te.
actors.mobs.npcs.wandmaker.intro_rogue=Oh cielo, mi hai spaventato! Non ho mai incontrato un bandito di queste parti che abbia conservato la sua sanità mentale, quindi devi venire dalla superficie! Se te la senti di aiutare uno straniero, potrei avere un compito per te.
actors.mobs.npcs.wandmaker.intro_warrior=Oh, salve! Che piacevole sorpresa incontrare un guerriero del nord in un luogo così deprimente! Devi aver viaggiato parecchio per arrivare fin qui. Se sei in cerca di avventura, potrei avere un incarico per te.
actors.mobs.npcs.wandmaker.name=vecchio fabbricante di bacchette
actors.mobs.npcs.wandmaker.reminder_berry=Hai avuto fortuna con il seme di Rotberry, %s? Cerca una stanza piena di vegetazione.
actors.mobs.npcs.wandmaker.reminder_dust=Hai avuto fortuna con la polvere di cadavere, %s? Cerca delle barricate.
actors.mobs.npcs.wandmaker.reminder_ember=Hai avuto fortuna con quelle braci, %s? Dovrai trovare quattro candele e il luogo del rituale.
actors.mobs.phantompiranha.desc=I piranha fantasma sono una rara specie di piranha con abilità magiche e inquietanti corpi traslucidi. Sono capaci di teletrasportarsi quando vengono attaccati, sia per fuggire che per avvicinarsi rapidamente al nemico! Sebbene siano fastidiosi da combattere, la loro carne è molto apprezzata per le sue proprietà magiche.
actors.mobs.phantompiranha.name=piranha fantasma
actors.mobs.phantompiranha.teleport_away=Il piranha fantasma si teletrasporta via...
actors.mobs.piranha.desc=Questi pesci carnivori vengono allevati appositamente per proteggere le zone allagate. Il loro morso è mortale, quindi è meglio evitare di affrontarli direttamente.
actors.mobs.piranha.discover_hint=Puoi trovare questo nemico ovunque nel dungeon.
actors.mobs.piranha.name=piranha gigante
actors.mobs.pylon.desc_active=Un pilone elettrico, destinato a regolare l'elettricità che alimenta i macchinari in quest'area. Il pilone è attualmente carico di energia elettrica, questo deve essere ciò che sta sovraccaricando DM-300!\n\nIn questo stato i piloni sono vulnerabili, ma genereranno scariche elettriche verso le celle vicine in senso orario. Grazie alla loro robusta costruzione in metallo, i piloni sono resistenti a danni ingenti.
actors.mobs.pylon.desc_inactive=Un traliccio elettrico, destinato a regolare l'elettricità che alimenta i macchinari in quest'area.\n\nIl traliccio è attualmente inattivo e immune ai danni.
actors.mobs.pylon.name=pilone elettrico
actors.mobs.rat.desc=I ratti marsupiali sono abitanti aggressivi ma piuttosto deboli delle fogne. Hanno un morso doloroso, ma diventano pericolosi solo se presenti in gran numero.
actors.mobs.rat.name=ratto marsupiale
actors.mobs.ripperdemon.desc=Queste orribili creature sono il risultato dei numerosi cadaveri di nani presenti in questa regione, utilizzati da forze demoniache. I Ripper sono creature emaciate e spettrali che assomigliano ai nani, ma con corpi spezzati e lunghi artigli affilati fatti di ossa. I demoni Ripper non sono particolarmente resistenti, ma sono agili e pericolosi. Sono in grado di compiere grandi salti per raggiungere rapidamente i bersagli prima di trafiggerli con i loro artigli.
actors.mobs.ripperdemon.leap=Il demone squartatore si prepara a balzare!
actors.mobs.ripperdemon.name=demone squartatore
actors.mobs.rotheart.desc=Il frutto del rovo d'India è davvero unico. Invece di marcire e fornire nutrienti, il frutto cresce, si indurisce e racchiude il seme. Questo seme protegge gli organi interni che si sviluppano al suo interno. Questa grande sfera viene definita il cuore della pianta adulta di rovo d'India.
actors.mobs.rotheart.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.rotheart.name=cuore marcio
actors.mobs.rotlasher.desc=Il laccio del marciume fa parte della struttura radicale della pianta di rovo matura e rappresenta anche il suo principale mezzo di difesa. I lacci sono ciechi e conficcati nel terreno, ma attaccano violentemente qualsiasi minaccia nelle vicinanze dopo averla individuata. In assenza di nemici, rimangono immobili, cercando di mimetizzarsi con la vegetazione circostante.
actors.mobs.rotlasher.discover_hint=Puoi incontrare questo nemico durante una missione specifica.
actors.mobs.rotlasher.name=ladro di marciume
actors.mobs.scorpio.desc=Queste enormi creature demoniache simili ad aracnidi evitano il combattimento ravvicinato, preferendo scagliare micidiali aculei seghettati da lunghe distanze.
actors.mobs.scorpio.name=scorpione
actors.mobs.senior.desc=Questi monaci fanatici si sono votati a proteggere i segreti della loro città da ogni straniero. Non usano armi né armature e si affidano soltanto all'arte del combattimento a mani nude.
actors.mobs.senior.name=monaco anziano
actors.mobs.shaman$blueshaman.spell_desc=Questo sciamano indossa una maschera blu e userà una magia che aumenta temporaneamente i danni che subisci.
actors.mobs.shaman$purpleshaman.spell_desc=Questo sciamano indossa una maschera viola e userà una magia che riduce temporaneamente la tua precisione e la tua capacità di schivare.
actors.mobs.shaman$redshaman.spell_desc=Questo sciamano indossa una maschera rossa e userà una magia che indebolisce temporaneamente la tua potenza d'attacco.
actors.mobs.shaman.bolt_kill=Il dardo magico ti ha ucciso...
actors.mobs.shaman.desc=Gli gnoll più intelligenti possono imparare la magia sciamanica. Gli sciamani prediligono gli incantesimi da battaglia per compensare la scarsa forza fisica e non esitano a usarli contro chi contesta il loro rango nella tribù.
actors.mobs.shaman.name=sciamano gnoll
actors.mobs.skeleton.def_verb=bloccato
actors.mobs.skeleton.desc=Gli scheletri sono fatti delle ossa di sfortunati avventurieri e abitanti del dungeon, animate dalla magia maligna che sale dalle profondità. Dopo aver subito abbastanza danni, si disintegrano in un'esplosione d'ossa.
actors.mobs.skeleton.explo_kill=Sei stato ucciso dall'esplosione di ossa...
actors.mobs.skeleton.name=scheletro
actors.mobs.slime.def_verb=bloccato
actors.mobs.slime.desc=Gli slime sono creature strane, leggermente magiche, con un corpo esterno gommoso e un nucleo liquido. Le fogne della città forniscono loro un'ampia scorta di acqua e sostanze nutritive. Grazie alla loro membrana esterna elastica, è difficile infliggere più di 6 danni agli slime con un singolo attacco.
actors.mobs.slime.name=melma
actors.mobs.snake.desc=Questi serpenti di dimensioni enormi sono capaci di schivare rapidamente i colpi, rendendoli piuttosto difficili da colpire. Tuttavia, attacchi magici o attacchi a sorpresa possono coglierli di sorpresa. Puoi eseguire un attacco a sorpresa attaccando mentre sei fuori dal campo visivo del serpente. Un modo è lasciare che il serpente ti insegua attraverso una porta e poi _colpire subito dopo che è entrato nella porta._
actors.mobs.snake.hint=Prova a usare il pulsante "esamina" su un serpente per imparare a contrastarlo.
actors.mobs.snake.name=Serpente per fogne
actors.mobs.spectralnecromancer.desc=Sebbene gli scheletri siano il pane quotidiano di un negromante, alcuni preferiscono esplorare altri servitori meno corporei. I negromanti spettrali hanno scelto gli spettri come loro servitori preferiti! Gli spettri individuali non sono forti come gli scheletri, ma questi negromanti non hanno paura di evocarne un gran numero!
actors.mobs.spectralnecromancer.name=negromante spettrale
actors.mobs.spinner.desc=Questi ragni delle caverne, pelosi e verdastri, evitano lo scontro diretto. Preferiscono aspettare a distanza mentre la vittima, intrappolata nella loro tela, muore lentamente per il morso velenoso.
actors.mobs.spinner.name=filatore delle caverne
actors.mobs.statue.def_verb=bloccato
actors.mobs.statue.desc=Si potrebbe pensare che sia solo un'altra statua inanimata di questo sotterraneo, ma i suoi occhi rossi e luminosi la smascherano.
actors.mobs.statue.desc_weapon=Sebbene la statua sia fatta di pietra, la _%s_ che impugna sembra reale.
actors.mobs.statue.discover_hint=Puoi trovare questo nemico ovunque nel dungeon.
actors.mobs.statue.name=statua animata
actors.mobs.succubus.desc=Le succubi sono demoni dall'aspetto di donne seducenti, con un tocco gotico. La loro magia può ammaliare un eroe, impedendogli di attaccare chiunque finché l'effetto non svanisce.
actors.mobs.succubus.name=succube
actors.mobs.swarm.desc=Lo sciame letale di mosche ronza furiosamente. Ogni attacco non magico lo dividerà in due sciami più piccoli ma ugualmente pericolosi.
actors.mobs.swarm.name=sciame di mosche
actors.mobs.tengu$bombability$bombblob.desc=Qui si sta alzando una nuvola di fumo surriscaldato. Attenzione, sta per esplodere!
actors.mobs.tengu$bombability$bombitem.cant_pickup=È bloccato al suolo, non riesci a spostarlo!
actors.mobs.tengu$bombability$bombitem.desc=Tengu ha lanciato qui una strana bomba fumogena, che emana un denso fumo caldo. Fa un forte ticchettio, come se stesse contando alla rovescia per un'esplosione! La bomba si è ancorata al terreno, quindi non puoi raccoglierla.
actors.mobs.tengu$bombability$bombitem.name=bomba fumogena
actors.mobs.tengu$fireability$fireblob.desc=Tengu ha lanciato una polvere finissima che sembra stia prendendo fuoco e si sta trasformando in vapore!
actors.mobs.tengu$shockerability$shockerblob.desc=Qui si sta accumulando energia elettrica; chiunque si trovi su questa piastrella riceverà una scossa al prossimo turno!
actors.mobs.tengu$shockerability$shockeritem.cant_pickup=Emette troppa elettricità, non puoi afferrarlo!
actors.mobs.tengu$shockerability$shockeritem.desc=Tengu ha lanciato qui una strana macchina, che sembra essere fatta di pezzi del DM-100. La macchina genera costantemente scariche elettriche intorno a sé, ma sembrano seguire uno schema prevedibile. Con tutte queste scariche elettriche intorno, non c'è modo di raccoglierla.
actors.mobs.tengu$shockerability$shockeritem.name=Shocker
actors.mobs.tengu.defeated=Finalmente libero...
actors.mobs.tengu.desc=I Tengu appartengono a un antico clan di assassini che porta lo stesso nome. Sono noti per l'uso frequente di shuriken e trappole.
actors.mobs.tengu.interesting=Rendiamo la cosa interessante...
actors.mobs.tengu.name=Tengu
actors.mobs.tengu.notice_gotcha=Ti ho beccato, %s!
actors.mobs.tengu.notice_have=Ora ti ho in pugno, %s!
actors.mobs.tengu.rankings_desc=Assassinato dal Tengu
actors.mobs.thief.carries=Il ladro porta con sé un _%s._ Ovviamente rubato.
actors.mobs.thief.desc=Sebbene questi detenuti vaghino liberi dalle loro celle, questo luogo rimane pur sempre la loro prigione. Col tempo, questo posto ha preso anche le loro menti, oltre alla loro libertà. Molto tempo fa, questi ladri e banditi folli hanno dimenticato chi sono e perché rubano. Questi nemici sono più propensi a rubare e scappare che a combattere. Assicurati di tenerli d'occhio, altrimenti potresti non rivedere mai più il tuo oggetto rubato.
actors.mobs.thief.escapes=Il ladro si è portato via il tuo %s!
actors.mobs.thief.name=ladro pazzo
actors.mobs.thief.stole=Il ladro ti ha rubato %s!
actors.mobs.tormentedspirit.desc=Gli spiriti tormentati sono spiriti altrimenti di buon carattere che sono stati afflitti da una maledizione. Finché sono maledetti, attaccheranno proprio come uno spettro, e saranno anche più potenti!\n\nPotrebbe essere possibile purificare la maledizione usando l'oggetto giusto mentre si è vicino allo spirito. Se la maledizione viene rimossa, lo spirito sarà sicuramente grato...
actors.mobs.tormentedspirit.name=spirito tormentato
actors.mobs.tormentedspirit.thank_you=Grazie...
actors.mobs.vaultrat.desc=Questo ratto ha alcuni cambiamenti comportamentali per testare la nuova IA dei nemici del vault:\n_-_ Il suo movimento può essere 'udito' attraverso i muri\n_-_ Vagherà lungo un percorso preimpostato\n_-_ Mentre vaga, ha un raggio di rilevamento notevolmente ridotto dietro la direzione in cui si muove.\n_-_ Anche mentre dorme il suo raggio di rilevamento è ridotto\n_-_ Quando ti rileva, 'indagherà' prima di passare alla caccia. I nemici che indagano si muovono verso di te ma non attaccano e sono più facili da perdere dietro porte e angoli.
actors.mobs.warlock.bolt_kill=Il dardo d'ombra ti ha ucciso...
actors.mobs.warlock.desc=Quando i nani abbandonarono l'ingegneria per le arti arcane, gli stregoni salirono al potere in città. Cominciarono con la magia elementale, ma presto passarono alla demonologia e alla necromanzia.
actors.mobs.warlock.name=stregone nano
actors.mobs.wraith.desc=Uno spettro è lo spirito vendicativo di un peccatore, la cui tomba è stata profanata. Essendo un'entità eterea, è molto difficile colpirlo con un'arma normale.
actors.mobs.wraith.discover_hint=Puoi trovare questo nemico ovunque nel dungeon.
actors.mobs.wraith.name=spettro
actors.mobs.yogdzewa$larva.desc=Questi minuscoli figli di Yog-Dzewa sono semplici servitori facili da produrre. Sebbene individualmente deboli, vengono evocati rapidamente e possono diventare soverchianti in gran numero.
actors.mobs.yogdzewa$larva.name=larva di dio
actors.mobs.yogdzewa$larva.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa$yogeye.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa$yogripper.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa$yogscorpio.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogdzewa.darkness=L'oscurità si fa sempre più incalzante...
actors.mobs.yogdzewa.defeated=...
actors.mobs.yogdzewa.desc=Yog-Dzewa è un Antico Dio; una grande mostruosità che si estende nei mondi mortali e li divora per alimentare la sua crescita infinita. I nani devono aver attirato l'attenzione di questo orrore cosmico mentre giocavano con le magie oscure, e da allora hanno cercato di tenerlo a bada. Yog-Dzewa ha origine da una dimensione di puro caos magico e non può portare la sua vera forma in questo mondo. Ha invece creato degli avatar e evocato servitori demoniaci per eseguire i suoi ordini qui. Questo occhio gigante è il punto focale del potere di Yog-Dzewa in questo mondo. Sebbene l'occhio stesso sia immobile, è in grado di sparare potenti raggi di magia demoniaca e di evocare una varietà di servitori per aiutarlo.
actors.mobs.yogdzewa.desc_spawners=Puoi percepire ondate di energia demoniaca irradiarsi verso l'occhio dai piani superiori. Qualcosa che hai lasciato in vita lassù deve star convogliando energia verso Yog-Dzewa. _Yog userà questa energia per evocare servitori più potenti!_
actors.mobs.yogdzewa.hope=LA TUA. SPERANZA. È. UN'ILLUSIONE!
actors.mobs.yogdzewa.name=Yog-Dzewa
actors.mobs.yogdzewa.notice=TI. VEDO.
actors.mobs.yogdzewa.rankings_desc=Divorato da Yog-Dzewa
actors.mobs.yogfist$brightfist.desc=Questo pugno è formato da pura energia luminosa. È in grado di sparare potenti raggi di luce accecante a ogni turno! Questi raggi ti accecheranno temporaneamente oltre a infliggere gravi danni. Il pugno è anche in grado di avvolgere brevemente l'arena in una luce accecante per fuggire!\n\nIl pugno non ha abilità speciali che può usare a distanza ravvicinata.
actors.mobs.yogfist$brightfist.name=pugno luminoso
actors.mobs.yogfist$brightfist.teleport=Il pugno si teletrasporta via in un lampo di luce che ti acceca sul serio!
actors.mobs.yogfist$burningfist.desc=Un enorme pugno avvolto dal fuoco. Le dita crepitano mentre si chiudono, lasciando cadere braci sul pavimento.
actors.mobs.yogfist$burningfist.name=pugno infuocato
actors.mobs.yogfist$darkfist.desc=Questo pugno è formato da pura energia oscura. È in grado di sparare potenti raffiche di magia oscura a ogni turno! Queste raffiche indeboliranno la tua fonte di luce oltre a infliggere gravi danni. Il pugno è anche in grado di avvolgere brevemente l'arena nell'oscurità per fuggire!\n\nIl pugno non ha abilità speciali che può usare a distanza ravvicinata.
actors.mobs.yogfist$darkfist.name=pugno oscuro
actors.mobs.yogfist$darkfist.teleport=Il pugno si teletrasporta via in un'esplosione di oscurità che spegne la tua fonte di luce!
actors.mobs.yogfist$rottingfist.desc=Un enorme pugno di carne putrefatta. Una melma fetida cola tra le sue dita e macchia la pietra sottostante.
actors.mobs.yogfist$rottingfist.name=pugno marcio
actors.mobs.yogfist$rustedfist.desc=Questo pugno è formato da metallo vivente. È un'imponente massa di metallo mutevole che possiede potenti attacchi corpo a corpo e può paralizzare i suoi bersagli a distanza. A causa della sua enorme massa, il pugno subirà qualsiasi danno nel tempo, invece che immediatamente. Il pugno è tuttavia inflessibile e non può muoversi in passaggi stretti. Inoltre, sebbene possa subire danni lentamente, il danno differito continuerà ad aumentare se il pugno viene colpito più volte.
actors.mobs.yogfist$rustedfist.name=pugno arrugginito
actors.mobs.yogfist$soiledfist.desc=Questo pugno è formato da una caotica magia terrosa. Muovendosi, farà germogliare costantemente vegetazione intorno a sé. Può anche sparare raffiche di terra concentrate che intrappoleranno il suo bersaglio in viticci e radici in rapida crescita! Il pugno trae potere da questa vita vegetale e resisterà ai danni in base alla quantità di vegetazione alta o solcata nelle vicinanze!
actors.mobs.yogfist$soiledfist.name=pugno sporco
actors.mobs.yogfist.desc=Questo pugno è un aspetto del potere di Yog-Dzewa. I pugni sono legati al potere di Yog-Dzewa e saranno protetti da ogni danno quando si trovano vicino all'occhio.
actors.mobs.yogfist.invuln_warn=Il pugno è invulnerabile finché è vicino all'occhio!
actors.mobs.yogfist.rankings_desc=Divorato da Yog-Dzewa
