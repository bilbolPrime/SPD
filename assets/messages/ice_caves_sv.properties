items.scrolls.scrolloffrostlevel.name=Frostrulle
items.scrolls.scrolloffrostlevel.desc=Kyla sipprar ur pergamentet.\n\nDu kan också riva sönder den var som helst för att frysa alla fiender på våningen tills de tar skada. Bossar och varelser som är immuna mot frost påverkas inte. Det orsakar ingen skada.
items.scrolls.scrolloffrostlevel.ac_tear=Riv sönder
items.scrolls.scrolloffrostlevel.tear_confirm=Om du river sönder rullen släpps dess magi fri och fryser alla fiender på våningen tills de tar skada. Bossar och varelser som är immuna mot frost påverkas inte. Det orsakar ingen skada.\n\nRiva sönder rullen?
items.scrolls.scrolloffrostlevel.wrong_place=Rullen fungerar inte här.
items.scrolls.scrolloffrostlevel.spent=Passagen har redan öppnats. Rullen förblir tyst.
items.keys.key.ice_depth=Den här nyckeln hör till våning %d i Isgrottorna.
scenes.interlevelscene$mode.frost=På väg in i Isgrottorna...
levels.icecaveslevel.water_name=Iskallt vatten
levels.icecaveslevel.water_desc=En tunn isskorpa brister under fötterna.
levels.icecaveslevel.wall_desc=Hackmärken försvinner under tjocka isådror. Gruvarbetarna övergav gångarna när kylan spred sig genom berget.
levels.cavesbosslevel.collapsed_name=Rasad grotta
levels.cavesbosslevel.collapsed_desc=En rasad grotta. Det går inte att ta sig igenom stenmassorna.
actors.buffs.frostbite.name=Köldskada
actors.buffs.frostbite.desc=Kylan sänker din rörelsehastighet med 20%.
actors.mobs.rimebat.name=Rimfrostfladdermus
actors.mobs.rimebat.desc=Dessa bleka fladdermöss häckar under isen. Deras kalla bett saktar tillfälligt ner rörelser och ger dem tid att cirkla runt för ett nytt angrepp.\n\nImmun mot frysning och köldmagi.
actors.mobs.iceclaw.name=Isklo
actors.mobs.iceclaw.desc=En asätare med ett skal av tät is. Inför en strid förstärker den sitt pansar en kort stund. Eld smälter det extra skyddet.\n\nImmun mot frysning och köldmagi.
actors.mobs.frostback.name=Frostryggsgnoll
actors.mobs.frostback.desc=Den här gnollen har överlevt kylan genom att råna oförsiktiga besökare. Kliv åt sidan när den höjer vapnet: det tunga slaget träffar där du nyss stod.\n\nImmun mot frysning och köldmagi.
actors.mobs.shardling.name=Issplitterling
actors.mobs.shardling.desc=Ett rastlöst knippe iskristaller. Den siktar innan den skjuter splitter i en rak linje. Väggar stoppar salvan.\n\nImmun mot frysning och köldmagi.
actors.mobs.hollowminer.name=Ihålig gruvarbetare
actors.mobs.hollowminer.desc=Den här gruvarbetaren kom aldrig ut ur de frusna gångarna. Lyktan brinner ännu, trots att ägaren är död sedan länge. Om den får höja lyktan kallar den närliggande varelser till strid. En träff avbryter signalen.\n\nImmun mot frysning och köldmagi.
actors.mobs.rimehorn.name=Rimhorn
actors.mobs.rimehorn.desc=Ett tungt djur med rimfrost i pälsen. Det krafsar i marken innan det rusar rakt fram. Flytta dig ur vägen medan det förbereder sig.\n\nImmun mot frysning och köldmagi.
actors.mobs.oldrime.name=Gammelrim
actors.mobs.oldrime.desc=Gruvarbetarna fann Gammelrim under berget, begravd i is äldre än deras tunnlar. Deras hackor väckte honom. Nu vaktar han de frusna gångarna och passagen bortom dem. När han försvagas bryts pansaret sönder och lemmarna frigörs. Se upp för tunga slag, is som bryter genom golvet och hans iskalla andedräkt.\n\nImmun mot frysning och köldmagi.
actors.mobs.oldrime.warning=Gammelrim tar sats för ett slag!
windows.wndjournal.ice_depth=Is %d
levels.icebosslevel.exit_name=Grottpassage
levels.icebosslevel.exit_desc=En smal passage slingrar sig längre in i berget.
levels.icebosslevel.blocked_name=Frusen passage
levels.icebosslevel.blocked_desc=En isvägg blockerar passagen bakom Gammelrim.
items.weapon.ice.wrong_hero=Det här vapnet är inte avsett för dig.
items.weapon.ice.already_enchanted=Det här vapnet är redan förtrollat.
items.weapon.ice.glaciercleaver.name=Glaciärhuggare
items.weapon.ice.glaciercleaver.desc=En bred klinga huggen ur Gammelrims is. En träff täcker målet med frost i fyra turer. Nästa träff med en Glaciärhuggare krossar frosten och gör %d extra skada. Bara en Krigare kan använda den.
actors.buffs.frostcoating.name=Frosttäckt
actors.buffs.frostcoating.desc=Ett tunt lager frost täcker varelsen. En träff med en Glaciärhuggare krossar det.
items.weapon.ice.hoarfroststaff.name=Rimfroststav
items.weapon.ice.hoarfroststaff.desc=Kyla samlas mellan stavens spetsar. Dess projektiler gör %d-%d skada före färdighetsbonusar och saktar ner rörelser och attacker i två turer. Den har från början tre laddningar och laddas om som en trollstav. Bara en Magiker kan använda den.
items.weapon.ice.rimepick.name=Rimhacka
items.weapon.ice.rimepick.desc=Den här smala ishackan hittar gliporna i pansaret. Den kringgår en fjärdedel av målets pansar, eller hälften om målet överraskas. Bara en Tjuv kan använda den.
items.weapon.ice.frostbow.name=Frostbåge
items.weapon.ice.frostbow.desc=Pilar från bågen splittras till vass is vid träff. De gör %d%% mer skada på målet och en fjärdedel av träffens skada på intilliggande fiender. Splittren fryser inte sina offer. Bara en Jägarinna kan använda den.
items.weapon.ice.gravefrostscythe.name=Gravfrostlie
items.weapon.ice.gravefrostscythe.desc=Frost täcker liens benklädda skaft. När den är utrustad gör dina frammanade skelett och spöken %d extra köldskada per träff. Bara en Nekromantiker kan använda den.
items.weapon.ice.frostbiterifle.name=Köldskadegevär
items.weapon.ice.frostbiterifle.desc=Gevärets kammare är klädd med is som aldrig smälter. Varje träff orsakar köldskada i två turer och saktar ner rörelsen med 20%. Fler träffar förnyar effekten. Bara en Legosoldat kan använda det.
library.ice_weapon_drop=Ett vapen släpps för varje hjälte, anpassat till hjältens klass.

actors.mobs.npcs.prospector.name=Strandsatt malmletare
actors.mobs.npcs.prospector.desc=En malmletare i en lappad rock söker skydd vid trappan. Hans lampa håller på att slockna.
actors.mobs.npcs.prospector.torches=Min lampa räcker inte länge till. Jag lämnade en förrådskista på den här våningen när jag flydde. Kan du hämta _tre facklor_ ur den?
actors.mobs.npcs.prospector.iceclaws=Isklorna har jagat bort mig från min gruvgång. Döda _tre isklor på den här våningen_ så att jag kan börja arbeta igen.
actors.mobs.npcs.prospector.accept=Jag hjälper dig.
actors.mobs.npcs.prospector.later=Inte nu.
actors.mobs.npcs.prospector.need_torches=Jag behöver _tre facklor_. Förrådskistan står kvar någonstans på den här våningen.
actors.mobs.npcs.prospector.claws_left=Isklor kvar att döda: _%d_.
actors.mobs.npcs.prospector.reward=Bra gjort. Vad vill du ha?
actors.mobs.npcs.prospector.rations=Två matransoner
actors.mobs.npcs.prospector.thanks=En sak mindre att oroa sig för. Tack.
library.quest.prospector_torches.name=En slocknande lampa
library.quest.prospector_torches.desc=Ge den strandsatta malmletaren tre facklor. En förrådskista på hans våning innehåller tillräckligt många.
library.quest.prospector_iceclaws.name=Isklor i gruvgången
library.quest.prospector_iceclaws.desc=Döda tre isklor på malmletarens våning och återvänd till honom.
library.quest.prospector.reward=Välj en uppgraderingsrulle eller två matransoner.
items.scrolls.scrolloffrostlevel.read_confirm=Medan du läser känner du att du är på väg att teleporteras.
