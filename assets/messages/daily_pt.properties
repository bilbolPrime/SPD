daily.brief_0=Os reforços do Rei dos Ratos estão chegando. Derrote-o antes que alcancem a corte. Um carcereiro preso pode ajudar, e o depósito vigiado tem suprimentos.
daily.brief_1=A revolta encobre a fuga de Tengu. Derrote os dois capitães para abrir o esconderijo dele e vença Tengu antes que o tempo acabe. Liberte prisioneiros para lutar ao seu lado ou procure suprimentos no arsenal trancado. O esconderijo se fechará quando você entrar.
daily.brief_2=Três mineiros estão presos, e o último elevador está prestes a partir. Abra os abrigos, leve os três de volta com vida e suba com eles. DM-300 ronda os túneis: lute ou encontre outro caminho. Procure suprimentos e atalhos trancados.
daily.brief_3=Um Garra de gelo, um Gnoll dorso-gélido e um Corno da geada rondam as cavernas. Cace os três e alcance a saída antes da tempestade. A ordem é sua escolha. Há suprimentos nos corredores laterais, mas procurá-los leva tempo.
daily.brief_4=Três altares estão trazendo demônios para os salões. Sele-os antes do fim do ritual. Cada altar selado corta uma fonte de reforços. Escolha a rota e vasculhe as salas laterais se precisar de suprimentos.
daily.brief_5=Defenda o posto até a ajuda chegar. O capitão precisa sobreviver a cinco ondas. Os defensores guardam o centro enquanto você luta, procura suprimentos ou abre celas para recrutar ajuda. As últimas ondas podem atacar por vários lados.
daily.brief_6=O ouro da cidade está no tesouro do rei. Pegue a chave do capitão, abra a câmara e fuja pelo portão do outro lado antes que ele feche. Abrir o tesouro dispara o alarme. Prepare atalhos e reúna suprimentos, ou arrisque um roubo mais rápido.
daily.rules=Cada data tem seu próprio herói, equipamento e masmorra. Gaste seus pontos de habilidade antes de partir. O tempo é contado em turnos. Sair do evento encerra a tentativa. Os resultados são separados e não liberam medalhas nem descobertas no acervo.
