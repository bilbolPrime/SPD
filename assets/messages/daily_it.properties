daily.timeout_2=L'ultimo ascensore è partito. Non sei riuscito a salvare tutti in tempo.\n\nPuoi riprovare dalle Sfide giornaliere.
daily.timeout_3=La bufera ha sepolto l'uscita. La caccia è finita.\n\nPuoi riprovare dalle Sfide giornaliere.
daily.timeout_4=Il rituale è compiuto. I demoni hanno invaso le sale.\n\nPuoi riprovare dalle Sfide giornaliere.
daily.timeout_6=Le porte della città si sono chiuse. Le guardie ti hanno tagliato la fuga.\n\nPuoi riprovare dalle Sfide giornaliere.
