daily.brief_0=I rinforzi del Re dei ratti stanno arrivando. Sconfiggilo prima che raggiungano la corte. Un carceriere prigioniero può aiutarti, e nel magazzino sorvegliato ci sono provviste.
daily.brief_1=La rivolta copre la fuga di Tengu. Sconfiggi i due capitani per aprire il suo rifugio, poi batti Tengu prima che scada il tempo. Libera i prigionieri per avere alleati o cerca provviste nell'armeria chiusa. Il rifugio si richiuderà alle tue spalle.
daily.brief_2=Tre minatori sono intrappolati e l'ultimo ascensore sta per partire. Apri i rifugi, riporta tutti e tre vivi all'ascensore e risali con loro. DM-300 pattuglia le gallerie: puoi combatterlo o aggirarlo. Provviste e scorciatoie chiuse possono aiutarti.
daily.brief_3=Un Artiglio di ghiaccio, uno Gnoll dorsogelo e un Cornobrina vagano nelle grotte. Abbattili tutti e raggiungi l'uscita prima della bufera. Scegli tu l'ordine della caccia. Nei passaggi laterali ci sono provviste, ma cercarle richiede tempo.
daily.brief_4=Tre altari richiamano demoni nelle sale. Sigillali prima che il rituale si compia. Ogni altare chiuso ferma una fonte di rinforzi. Scegli il percorso e cerca provviste nelle stanze laterali se ne hai bisogno.
daily.brief_5=Difendi l'avamposto fino all'arrivo dei soccorsi. Il capitano deve sopravvivere a cinque ondate. I difensori terranno il centro mentre combatti, cerchi provviste o apri le celle per reclutare aiuti. Le ultime ondate possono arrivare da più lati.
daily.brief_6=L'oro della città è nel tesoro del re. Prendi la chiave del capitano, entra nella camera e fuggi dalla porta opposta prima che si chiuda. Aprire il tesoro fa scattare l'allarme. Cerca prima provviste e scorciatoie, oppure tenta un furto più rapido.
daily.rules=Ogni data ha il suo eroe, equipaggiamento e dungeon. Spendi i punti abilità prima di partire. Il tempo si misura in turni. Uscire dall'evento termina il tentativo. I risultati sono separati e non sbloccano distintivi né voci dell'enciclopedia.
