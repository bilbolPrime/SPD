levels.sign.burn=Ahogy megpróbálod elolvasni a táblát, zöldes lángokba borul.
levels.sign.tip_01=Ne becsüld túl az erődet, használj olyan fegyvereket és páncélokat, amiket el tudsz viselni.
levels.sign.tip_05=Óvakodj a Goo-tól!
levels.sign.tip_06=Pixel-Mart - minden, amire szükséged van a sikeres kalandhoz!
levels.sign.tip_07=Azonosítsd a varázsitalaidat és tekercseidet a lehető leghamarabb. Ne halogasd addig a pillanatig, amikor tényleg szükséged lesz rájuk.
levels.sign.tip_08=Az éhség nem fáj, de az éhezés igen.
levels.sign.tip_10=Ne engedd ki a Tengut!
levels.sign.tip_11=Pixel-Mart. Költs pénzt. Élj tovább.
levels.sign.tip_12=Amikor egyszerre több szörnyeteg támad meg, próbálj meg egy ajtó mögé menekülni.
levels.sign.tip_14=Nincs értelme egyszerre egynél több Ankh-ot birtokolni, mert feltámadáskor elveszíted őket.
levels.sign.tip_15=VESZÉLY! A nehézgépek sérülést, végtagvesztést vagy halált okozhatnak!
levels.sign.tip_16=Pixel-Mart. Biztonságosabb élet a kazamatában.
levels.sign.tip_17=Amikor fejlesztesz egy elvarázsolt fegyvert, van esély a varázslat elpusztítására.
levels.sign.tip_18=A fegyverek és páncélok gyorsabban kopnak el, mint a pálcák és a gyűrűk, de több módja is van a javításuknak.
levels.sign.tip_19=A Törölés Tekercsét csak úgy lehet megszerezni, ha ajándékba kapjuk a kazamata szellemeitől.
levels.sign.tip_20=Őfelsége jelenlétében tilos fegyvert viselni!
