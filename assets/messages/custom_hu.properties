custom.difficulty.easy=Könnyen
custom.difficulty.easy.desc=- Kezdj 2 extra adaggal.\n- Kezdj 2 gyógyító bájitallal.\n- Kezdj 200 arannyal.\n- Kezdj 2 lélekkristállyal.\n- Bónusz rejtett ajtók és csapdák felfedezéséhez.\n- A mobok gyengék, 25%-kal kevesebb sebzést okoznak, 10%-kal több sebzést szenvednek el és 15%-kal kevesebb HP-juk van.\n- A bajnokok megjelenési aránya 10%-ra állítva.\n- A bajnokok esési aránya 30%-ra állítva.
custom.difficulty.hard=Kemény
custom.difficulty.hard.desc=- A gyógyító ital a maximális életerő 75%-át gyógyítja.\n - A mobok erősek, 10%-kal több sebzést okoznak, 10%-kal kevesebb sebzést szenvednek el és 20%-kal több életerőjük van.\n - A bajnokok megjelenési aránya 30%-ra állítva.\n - A bajnokok esési aránya 50%-ra állítva.
custom.difficulty.hell.desc=- A gyógyító ital a maximális életerő 50%-át gyógyítja.\n - A mobok halhatatlanok, 35%-kal több sebzést okoznak, 30%-kal kevesebb sebzést szenvednek el és 45%-kal több életerőjük van.\n - A hősök megjelenési aránya 50%-ra állítva.\n - A hős 4-gyel kevesebb maximális életerővel kezd.\n - A hős 1-gyel kevesebb maximális életerőt kap szintlépéskor.\n - A hősök esési aránya 70%-ra állítva.
custom.difficulty.just_kill_me=Csak ölj meg
custom.difficulty.just_kill_me.desc=- Két tapasztalati itallal kezdődik.\n- A gyógyító ital 10%-kal több életerőt gyógyít.\n- A mobok istenségek, 60%-kal több sebzést okoznak, 40%-kal kevesebb sebzést szenvednek el és 75%-kal több életerőjük van.\n- A hős megjelenési aránya 100%-ra van állítva.\n- A hős 8-cal kevesebb maximális életerővel kezd.\n- A hős 3-mal kevesebb maximális életerőt kap szintlépéskor.\n- A hősök esési aránya 100%-ra van állítva.
custom.difficulty.nightmare.desc=- A gyógyító ital a maximális életerő 25%-át gyógyítja.\n - A mobok isteniek, 45%-kal több sebzést okoznak, 30%-kal kevesebb sebzést szenvednek el és 60%-kal több életerőjük van.\n - A bajnokok megjelenési aránya 70%-ra állítva.\n - A hős 8-cal kevesebb maximális életerővel kezd.\n - A hős 3-mal kevesebb maximális életerőt kap szintlépéskor.\n - A bajnokok esési aránya 90%-ra állítva.
custom.difficulty.normal.desc=- A mobok alapértelmezés szerint vannak.\n - A bajnokok megjelenési aránya 20%-ra állítva.\n - A bajnokok elesési aránya 40%-ra állítva.
custom.difficulty.super_easy=Szuper könnyű
custom.difficulty.super_easy.desc=- Kezdj 5 extra adaggal.\n- Kezdj 5 gyógyító bájitallal.\n- Kezdj 500 arannyal.\n- Kezdj 3 lélekkristállyal.\n- A mobok szánalmasak, 50%-kal kevesebb sebzést okoznak, 50%-kal több sebzést szenvednek el és 50%-kal kevesebb HP-juk van.\n- A bajnokok megjelenési aránya 10%-ra állítva.\n- A bajnokok esési aránya 10%-ra állítva.
levels.sign.dead_end=Mit csinálsz itt?!
levels.sign.tip_02=Nem minden ajtó látható első látásra a kazamatában. Ha elakadtál, keress rejtett ajtókat.
levels.sign.tip_03=Ne feledd, hogy az erőd növelése nem az egyetlen módja a jobb felszereléshez való hozzáférésnek. Másképp is járhatsz, csökkentve az erőkövetelményt a Fejlesztési Tekercsek segítségével.
levels.sign.tip_04=Az aranyadat a kazamata mélyebb szintjein található boltokban költheted el. Az első a 6. szinten található.
levels.sign.tip_09=A meglepetésszerű támadásnak nagyobb esélye van a találatra. Például lesből támadhatod az ellenséget egy zárt ajtó mögött, amikor tudod, hogy közeledik.
levels.sign.tip_13=Ha égsz, lebegés közben nem tudod eloltani a vízben lévő tüzet.
levels.sign.tip_21=Pixel-Mart. Különleges árak démonvadászoknak!
