levels.rebornsiderooms.leave=Liegen lassen
actors.mobs.npcs.echoreflection.name=dein Spiegelbild
actors.mobs.npcs.echoreflection.desc=Ein blasses Abbild von dir wartet regungslos. Es kämpft nur, wenn du es herausforderst. Ein Sieg bringt einen Fertigkeitspunkt. Verlässt du den Raum, endet das Duell und dein Spiegelbild erholt sich vollständig.
actors.mobs.npcs.echoreflection.challenge=Dein Spiegelbild herausfordern? Ein Sieg bringt einen Fertigkeitspunkt. Du kannst fliehen, aber wenn du den Raum verlässt, erholt sich das Spiegelbild.
actors.mobs.npcs.echoreflection.accept=Herausfordern
actors.mobs.npcs.echoreflection.withdrawn=Dein Spiegelbild kommt wieder zur Ruhe.
actors.mobs.npcs.echoreflection.victory=Das Spiegelbild löst sich auf und hinterlässt eine Fertigkeitsrolle.
actors.mobs.npcs.barbecueking.name=Rattenkönig
actors.mobs.npcs.barbecueking.desc=Auch ein König muss essen. In dieser ruhigen Ecke grillt er sein Abendessen.
actors.mobs.npcs.barbecueking.greeting=Königliche Angelegenheiten. Sehr wichtig. Sehr lecker.
actors.mobs.npcs.barbecueking.stolen=HEY! Das war meins!
actors.mobs.npcs.barbecueking.after=Hoffentlich bleibt dir das im Hals stecken.
actors.mobs.npcs.forgottenoffering.name=vergessene Opfergabe
actors.mobs.npcs.forgottenoffering.desc=Unter dem Kristall liegen eine Essensration und ein Heiltrank. Wähle eines; das andere zerfällt zu Staub.
actors.mobs.npcs.watchremains.name=gefallener Wachmann
actors.mobs.npcs.watchremains.desc=Neben einer durchbrochenen Mauer liegen die Knochen eines Wachmanns. Unter seinem Helm steckt ein Zettel.
actors.mobs.npcs.watchremains.note=Die Tür die ganze Nacht gehalten. Sie kamen durch die Wand.
