levels.sign.burn=當你試著看清標誌上的字時，它突然燃起綠色的火焰。
levels.sign.tip_01=不要高估自己的力量，使用你能駕馭的武器和盔甲。
levels.sign.tip_05=小心黏液！
levels.sign.tip_06=Pixel-Mart－幫助您成功冒險所需的一切！
levels.sign.tip_07=盡快清點你的藥劑和捲軸。不要等到真正需要它們的時候才去做。
levels.sign.tip_08=飢餓本身並不痛苦，但挨餓卻很痛苦。
levels.sign.tip_10=別放天狗出來！
levels.sign.tip_11=像素超市。花錢，活得更久。
levels.sign.tip_12=當同時受到多個怪物攻擊時，試著躲到門後。
levels.sign.tip_14=同時擁有多個安卡是沒有意義的，因為復活後你會失去它們。
levels.sign.tip_15=危險！重型機械可能造成人身傷害、肢體殘缺甚至死亡！
levels.sign.tip_16=像素超市。地牢裡更安全的生活。
levels.sign.tip_17=升級附魔武器時，有一定幾率會破壞附魔效果。
levels.sign.tip_18=武器和盔甲比魔杖和戒指損耗得更快，但修復它們的方法也更多。
levels.sign.tip_19=獲得「殲滅捲軸」的唯一方法是從地牢精靈那裡獲得禮物。
levels.sign.tip_20=在陛下面前，禁止攜帶任何武器！
