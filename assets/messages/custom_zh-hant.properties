items.bags.keyring.info=這是一個銅鑰匙圈，可以讓你把所有鑰匙與其他物品分開存放。
custom.difficulty.easy=簡單的
custom.difficulty.easy.desc=- 初始額外獲得2份口糧。 - 初始獲得2瓶治療藥水。 - 初始獲得200金幣。 - 初始獲得2個靈魂水晶。 - 發現隱藏門和陷阱的獎勵。 - 怪物變弱，傷害降低25%，受到的傷害增加10%，生命值降低15%。 - 精英怪生成率設定為10%。 - 精英怪掉落率設定為30%。
custom.difficulty.hard=難的
custom.difficulty.hard.desc=- 治療藥水恢復75%最大生命值。 - 怪物更強，造成額外10%傷害，受到的傷害減少10%，生命值增加20%。 - 精英怪生成率設定為30%。 - 精英怪掉落率設定為50%。
custom.difficulty.hell.desc=- 治療藥水恢復50%最大生命值。 - 怪物變成無敵狀態，造成額外35%傷害，受到的傷害降低30%，生命值增加45%。 - 精英怪生成率設為50%。 - 英雄初始最大生命值減少4點。 - 英雄升級時最大生命值增加1點。 - 精英怪掉落率設為70%。
custom.difficulty.just_kill_me=殺了我吧
custom.difficulty.just_kill_me.desc=- 初始擁有兩瓶經驗藥水。 - 治療藥水恢復10%最大生命值。 - 怪物變成神祇，造成額外60%傷害，承受額外40%傷害，生命值提升75%。 - 精英怪生成率設為100%。 - 英雄初始最大生命值降低8點。 - 英雄升級時最大生命值增加減少3點。 - 精英怪掉落率設為100%。
custom.difficulty.nightmare.desc=- 治療藥水恢復25%最大生命值。 - 怪物如同神明一般，造成額外45%傷害，承受額外30%傷害，生命值增加60%。 - 精英怪生成率設為70%。 - 英雄初始最大生命值減少8點。 - 英雄升級時最大生命值增加減少3點。 - 精英怪掉落率設為90%。
custom.difficulty.normal.desc=- 怪物為標準模式。 \n- 精英怪生成率設定為 20%。 \n- 精英怪掉落率設定為 40%。
custom.difficulty.super_easy=超簡單
custom.difficulty.super_easy.desc=- 初始額外獲得 5 份口糧。 - 初始獲得 5 瓶治療藥水。 - 初始獲得 500 金幣。 - 初始獲得 3 個靈魂水晶。 - 怪物變得弱小，傷害降低 50%，承受傷害增加 50%，生命值降低 50%。 - 精英怪生成率設定為 10%。 - 精英怪掉落率設定為 10%。
levels.sign.dead_end=你在這裡做什麼？ ！
levels.sign.tip_02=地牢裡的門並非全部都一目了然。如果你被困住了，就去尋找隱藏的門吧。
levels.sign.tip_03=記住，提升力量並不是獲得更好裝備的唯一方法。你也可以反其道而行之，使用升級捲軸降低裝備的力量需求。
levels.sign.tip_04=你可以在地牢更深層的商店使用金幣。第一家商店位於第六層。
levels.sign.tip_09=突襲的成功率更高。例如，當你預知敵人正在靠近時，你可以躲在緊閉的門後伏擊他。
levels.sign.tip_13=如果你身上著火了，即使漂浮在水面上，你也無法撲滅火焰。
levels.sign.tip_21=像素商城。惡魔獵人專屬特價！
actors.blobs.waterofawareness.drink_message=你啜飲一口，感覺知識如泉湧般湧入腦海。現在你對身上裝備的物品瞭如指掌，也能感知到關卡中的所有物品，並知曉其中的所有秘密。
actors.hero.herosubclass.assassin_legacy_desc=發動突襲時，刺客會對目標造成額外傷害。
