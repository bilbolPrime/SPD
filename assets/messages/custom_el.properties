levels.sign.burn=Καθώς προσπαθείς να διαβάσεις την πινακίδα, αυτή εκρήγνυται σε πρασινωπές φλόγες.
levels.sign.tip_01=Μην υπερεκτιμάς τη δύναμή σου, χρησιμοποίησε όπλα και πανοπλίες που μπορείς να χειριστείς.
levels.sign.tip_05=Προσοχή στο Γκού!
levels.sign.tip_06=Pixel-Mart - όλα όσα χρειάζεστε για μια επιτυχημένη περιπέτεια!
levels.sign.tip_07=Προσδιορίστε τα φίλτρα και τους πάπυρους σας το συντομότερο δυνατό. Μην το αναβάλλετε για τη στιγμή που θα τα χρειαστείτε πραγματικά.
levels.sign.tip_08=Το να πεινάς δεν βλάπτει, αλλά η πείνα βλάπτει.
levels.sign.tip_10=Μην αφήσετε το Tengu να βγει!
levels.sign.tip_11=Pixel-Mart. Ξοδέψτε χρήματα. Ζήστε περισσότερο.
levels.sign.tip_12=Όταν δέχεστε επίθεση από πολλά τέρατα ταυτόχρονα, προσπαθήστε να υποχωρήσετε πίσω από μια πόρτα.
levels.sign.tip_14=Δεν έχει νόημα να κατέχεις περισσότερα από ένα Ankh ταυτόχρονα, γιατί θα τα χάσεις όταν τα αναστήσεις.
levels.sign.tip_15=ΚΙΝΔΥΝΟΣ! Τα βαριά μηχανήματα μπορούν να προκαλέσουν τραυματισμό, απώλεια άκρων ή θάνατο!
levels.sign.tip_16=Pixel-Mart. Μια ασφαλέστερη ζωή σε μπουντρούμι.
levels.sign.tip_17=Όταν αναβαθμίζετε ένα μαγεμένο όπλο, υπάρχει πιθανότητα να καταστρέψετε αυτό το μαγικό όπλο.
levels.sign.tip_18=Τα όπλα και οι πανοπλίες φθείρονται πιο γρήγορα από τα ραβδιά και τα δαχτυλίδια, αλλά υπάρχουν περισσότεροι τρόποι για να τα επισκευάσετε.
levels.sign.tip_19=Ο μόνος τρόπος για να αποκτήσετε έναν Πάπυρο του Wipe Out είναι να τον λάβετε ως δώρο από τα πνεύματα των μπουντρουμιών.
levels.sign.tip_20=Δεν επιτρέπονται όπλα παρουσία της Αυτού Μεγαλειότητας!
