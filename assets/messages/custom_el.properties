items.bags.keyring.name=μπρελόκ
items.bags.keyring.info=Αυτό είναι ένα χάλκινο μπρελόκ για κλειδιά, που σας επιτρέπει να φυλάσσετε όλα τα κλειδιά σας ξεχωριστά από τα υπόλοιπα προσωπικά σας αντικείμενα.
custom.difficulty.easy=Εύκολος
custom.difficulty.easy.desc=- Ξεκινήστε με 2 επιπλέον μερίδες.\n- Ξεκινήστε με 2 φίλτρα θεραπείας.\n- Ξεκινήστε με 200 Χρυσό.\n- Ξεκινήστε με 2 κρυστάλλους ψυχής.\n- Μπόνους στην ανακάλυψη κρυφών θυρών και παγίδων.\n- Οι όχλοι είναι αδύναμοι, κάνουν 25% λιγότερη ζημιά, δέχονται 10% περισσότερη ζημιά και έχουν 15% λιγότερη Ζωή.\n- Το ποσοστό εμφάνισης πρωταθλητών έχει οριστεί σε 10%.\n- Το ποσοστό πτώσης πρωταθλητών έχει οριστεί σε 30%.
custom.difficulty.hard=Σκληρά
custom.difficulty.hard.desc=- Το φίλτρο θεραπείας θεραπεύει 75% μέγιστης hp.\n- Οι όχλοι είναι δυνατοί, προκαλούν 10% επιπλέον ζημιά, δέχονται 10% λιγότερη ζημιά και έχουν 20% περισσότερη HP.\n- Το ποσοστό εμφάνισης πρωταθλητών έχει οριστεί σε 30%.\n- Το ποσοστό πτώσης πρωταθλητών έχει οριστεί σε 50%.
custom.difficulty.hell.desc=- Το φίλτρο θεραπείας θεραπεύει 50% μέγιστης hp.\n- Οι όχλοι είναι αθάνατοι, κάνουν 35% περισσότερη ζημιά, δέχονται 30% λιγότερη ζημιά και έχουν 45% περισσότερη HP.\n- Ο ρυθμός εμφάνισης πρωταθλητών έχει οριστεί σε 50%.\n- Ο ήρωας ξεκινά με 4 λιγότερες μέγιστες HP.\n- Ο ήρωας κερδίζει 1 λιγότερη μέγιστη HP κατά την ανύψωση επιπέδου.\n- Ο ρυθμός πτώσης πρωταθλητών έχει οριστεί σε 70%.
custom.difficulty.just_kill_me=Απλά Σκότωσέ με
custom.difficulty.just_kill_me.desc=- Ξεκινά με δύο φίλτρα εμπειρίας.\n- Το φίλτρο θεραπείας θεραπεύει 10% μέγιστης hp.\n- Τα mobs είναι Θεότητες, κάνουν 60% περισσότερη ζημιά, δέχονται 40% λιγότερη ζημιά και έχουν 75% περισσότερη HP.\n- Το ποσοστό εμφάνισης πρωταθλητή έχει οριστεί σε 100%.\n- Ο ήρωας ξεκινά με 8 λιγότερη μέγιστη HP.\n- Ο ήρωας κερδίζει 3 λιγότερη μέγιστη HP κατά την ανύψωση επιπέδου.\n- Το ποσοστό πτώσης πρωταθλητή έχει οριστεί σε 100%.
custom.difficulty.nightmare.desc=- Το φίλτρο θεραπείας θεραπεύει 25% μέγιστης hp.\n- Οι όχλοι είναι θεϊκοί, κάνουν 45% περισσότερη ζημιά, δέχονται 30% λιγότερη ζημιά και έχουν 60% περισσότερη HP.\n- Ο ρυθμός εμφάνισης πρωταθλητών έχει οριστεί στο 70%.\n- Ο ήρωας ξεκινά με 8 λιγότερη μέγιστη HP.\n- Ο ήρωας κερδίζει 3 λιγότερη μέγιστη HP κατά την ανύψωση επιπέδου.\n- Ο ρυθμός πτώσης πρωταθλητών έχει οριστεί στο 90%.
custom.difficulty.normal.desc=- Οι όχλοι είναι στάνταρ. \n- Το ποσοστό εμφάνισης πρωταθλητών έχει οριστεί σε 20%. \n- Το ποσοστό πτώσης πρωταθλητών έχει οριστεί σε 40%.
custom.difficulty.super_easy=Πολύ εύκολο
custom.difficulty.super_easy.desc=- Ξεκινήστε με 5 επιπλέον μερίδες.\n- Ξεκινήστε με 5 φίλτρα θεραπείας.\n- Ξεκινήστε με 500 Χρυσό.\n- Ξεκινήστε με 3 κρυστάλλους ψυχής.\n- Οι όχλοι είναι αξιολύπητοι, κάνουν 50% λιγότερη ζημιά, δέχονται 50% περισσότερη ζημιά και έχουν 50% λιγότερη Ζωή.\n- Το ποσοστό εμφάνισης πρωταθλητών έχει οριστεί σε 10%.\n- Το ποσοστό πτώσης πρωταθλητών έχει οριστεί σε 10%.
levels.sign.dead_end=Τι κάνεις εδώ;!
levels.sign.tip_02=Δεν είναι όλες οι πόρτες στο μπουντρούμι ορατές με την πρώτη ματιά. Αν έχετε κολλήσει, αναζητήστε κρυφές πόρτες.
levels.sign.tip_03=Να θυμάστε ότι η αύξηση της δύναμής σας δεν είναι ο μόνος τρόπος για να αποκτήσετε πρόσβαση σε καλύτερο εξοπλισμό. Μπορείτε να κάνετε και την αντίθετη επιλογή, μειώνοντας τις απαιτήσεις ισχύος του με τους Πάπυρους Αναβάθμισης.
levels.sign.tip_04=Μπορείτε να ξοδέψετε τον χρυσό σας σε καταστήματα στα βαθύτερα επίπεδα του μπουντρουμιού. Το πρώτο βρίσκεται στο 6ο επίπεδο.
levels.sign.tip_09=Η αιφνιδιαστική επίθεση έχει μεγαλύτερες πιθανότητες να χτυπήσει. Για παράδειγμα, μπορείτε να ενεδρεύσετε τον εχθρό σας πίσω από μια κλειστή πόρτα όταν ξέρετε ότι πλησιάζει.
levels.sign.tip_13=Αν καίγεσαι, δεν μπορείς να σβήσεις τη φωτιά στο νερό ενώ αιωρείσαι.
levels.sign.tip_21=Pixel-Mart. Ειδικές τιμές για κυνηγούς δαιμόνων!
actors.blobs.waterofawareness.drink_message=Καθώς πίνεις μια γουλιά, νιώθεις τη γνώση να ξεχύνεται στο μυαλό σου. Τώρα ξέρεις τα πάντα για τα αντικείμενα που έχεις εξοπλίσει. Επίσης, νιώθεις όλα τα αντικείμενα στο επίπεδο και γνωρίζεις όλα τα μυστικά του.
