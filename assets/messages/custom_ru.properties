custom.difficulty.easy=Легкий
custom.difficulty.easy.desc=- Начните с 2 дополнительных пайков. \n - Начните с 2 зелий лечения. \n - Начните с 200 золота. \n - Начните с 2 кристаллов души. \n - Бонус к обнаружению скрытых дверей и ловушек. \n - Монстры слабые, наносят на 25% меньше урона, получают на 10% больше урона и имеют на 15% меньше здоровья. \n - Частота появления чемпионов установлена на 10%. \n - Частота выпадения чемпионов установлена на 30%.
custom.difficulty.hard=Жесткий
custom.difficulty.hard.desc=- Зелье исцеления восстанавливает 75% от максимального запаса здоровья. - Монстры становятся сильнее, наносят на 10% больше урона, получают на 10% меньше урона и имеют на 20% больше здоровья. - Частота появления чемпионов установлена на 30%. - Частота выпадения чемпионов установлена на 50%.
custom.difficulty.hell.desc=- Зелье исцеления восстанавливает 50% от максимального запаса здоровья. \n - Монстры бессмертны, наносят на 35% больше урона, получают на 30% меньше урона и имеют на 45% больше здоровья. \n - Частота появления чемпионов установлена на 50%. \n - Герой начинает с 4 меньшим максимальным запасом здоровья. \n - Герой получает на 1 меньше максимального запаса здоровья при повышении уровня. \n - Частота выпадения чемпионов установлена на 70%.
custom.difficulty.just_kill_me=Просто убей меня
custom.difficulty.just_kill_me.desc=- Начинает с двумя зельями опыта. \n - Зелье исцеления восстанавливает 10% от максимального здоровья. \n - Мобы становятся божествами, наносят на 60% больше урона, получают на 40% меньше урона и имеют на 75% больше здоровья. \n - Вероятность появления чемпионов установлена на 100%. \n - Герой начинает с 8 меньшим максимальным здоровьем. \n - Герой получает на 3 меньше максимального здоровья при повышении уровня. \n - Вероятность выпадения чемпионов установлена на 100%.
custom.difficulty.nightmare.desc=- Зелье исцеления восстанавливает 25% от максимального запаса здоровья. - Монстры становятся божественными, наносят на 45% больше урона, получают на 30% меньше урона и имеют на 60% больше здоровья. - Частота появления чемпионов установлена на 70%. - Герой начинает с 8 меньшим максимальным запасом здоровья. - Герой получает на 3 меньше максимального запаса здоровья при повышении уровня. - Частота выпадения чемпионов установлена на 90%.
custom.difficulty.normal.desc=- Монстры стандартные. \n - Частота появления чемпионов установлена на 20%. \n - Частота выпадения чемпионов установлена на 40%.
custom.difficulty.super_easy=Очень просто
custom.difficulty.super_easy.desc=- Начните с 5 дополнительных пайков. \n - Начните с 5 зелий лечения. \n - Начните с 500 золота. \n - Начните с 3 кристаллов души. \n - Мобы жалкие, наносят на 50% меньше урона, получают на 50% больше урона и имеют на 50% меньше здоровья. \n - Частота появления чемпионов установлена на 10%. \n - Частота выпадения чемпионов установлена на 10%.
levels.sign.dead_end=Что ты здесь делаешь?!
levels.sign.tip_02=Не все двери в подземелье видны с первого взгляда. Если вы застряли, поищите потайные двери.
levels.sign.tip_03=Помните, что повышение силы — не единственный способ получить доступ к лучшему снаряжению. Вы можете пойти и в обратную сторону, снизив требования к силе с помощью Свиток Улучшения.
levels.sign.tip_04=Вы можете потратить золото в магазинах на более глубоких уровнях подземелья. Первый из них находится на 6-м уровне.
levels.sign.tip_09=Внезапная атака имеет больше шансов на попадание. Например, вы можете устроить засаду на врага за закрытой дверью, зная, что он приближается.
levels.sign.tip_13=Если вы горите, вы не сможете потушить огонь в воде, находясь в состоянии левитации.
levels.sign.tip_21=Pixel-Mart. Специальные цены для охотников на демонов!
actors.blobs.waterofawareness.drink_message=Сделав глоток, вы чувствуете, как знания наполняют ваш разум. Теперь вы знаете всё о своих экипированных предметах. Кроме того, вы чувствуете все предметы на уровне и знаете все их секреты.
