levels.sign.burn=Когда вы пытаетесь прочитать надпись, она вспыхивает зеленоватым пламенем.
levels.sign.tip_01=Не переоценивайте свои силы, используйте оружие и доспехи, с которыми вы сможете справиться.
levels.sign.tip_05=Осторожно, слизь!
levels.sign.tip_06=Pixel-Mart — всё, что нужно для успешных приключений!
levels.sign.tip_07=Как можно скорее определите свои зелья и свитки. Не откладывайте это на потом, когда они действительно понадобятся.
levels.sign.tip_08=Чувство голода само по себе не причиняет боли, а вот голодание – причиняет боль.
levels.sign.tip_10=Не выпускайте Тэнгу!
levels.sign.tip_11=Pixel-Mart. Тратьте деньги. Живите дольше.
levels.sign.tip_12=Если на вас одновременно напали несколько монстров, постарайтесь отступить за дверь.
levels.sign.tip_14=Нет смысла иметь более одного анкха одновременно, потому что вы потеряете их при воскрешении.
levels.sign.tip_15=ОПАСНО! Тяжелая техника может стать причиной травм, ампутации конечностей или смерти!
levels.sign.tip_16=Pixel-Mart. Более безопасная жизнь в подземелье.
levels.sign.tip_17=При улучшении зачарованного оружия существует вероятность разрушить это зачарование.
levels.sign.tip_18=Оружие и доспехи изнашиваются быстрее, чем волшебные палочки и кольца, но способов их ремонта больше.
levels.sign.tip_19=Единственный способ получить Свиток Уничтожения — это получить его в дар от духов подземелья.
levels.sign.tip_20=В присутствии Его Величества запрещено носить оружие!
