levels.rebornsiderooms.leave=Leave it
actors.mobs.npcs.echoreflection.name=your reflection
actors.mobs.npcs.echoreflection.desc=A pale copy of you waits in the water's reflection. It will fight only if challenged. Defeat it to earn a skill point. Leaving the chamber ends the duel and restores the reflection.
actors.mobs.npcs.echoreflection.challenge=Challenge your reflection? Victory earns one skill point. You can retreat, but the reflection will recover if you leave the room.
actors.mobs.npcs.echoreflection.accept=Challenge
actors.mobs.npcs.echoreflection.withdrawn=Your reflection fades back into stillness.
actors.mobs.npcs.echoreflection.victory=The reflection dissolves, leaving a scroll of skill.
actors.mobs.npcs.barbecueking.name=rat king
actors.mobs.npcs.barbecueking.desc=Even a king has to eat. He's found a quiet corner to grill his dinner.
actors.mobs.npcs.barbecueking.greeting=Royal business. Very important. Very tasty.
actors.mobs.npcs.barbecueking.stolen=HEY! That was mine!
actors.mobs.npcs.barbecueking.after=Hope you choke on it.
actors.mobs.npcs.forgottenoffering.name=forgotten offering
actors.mobs.npcs.forgottenoffering.desc=A ration of food and a healing potion wait beneath the crystal. Choose one; the other will turn to dust.
actors.mobs.npcs.watchremains.name=fallen watchman
actors.mobs.npcs.watchremains.desc=A guard's bones lie beside a broken wall. A scrap of paper is tucked under the helmet.
actors.mobs.npcs.watchremains.note=Held the door all night. They came through the wall.
