actors.mobs.rebornboss.opening=Ungeschützt!
actors.mobs.rebornboss.interrupted=%s verliert die Konzentration!
actors.mobs.reborngoo.desc=Über Goo ist wenig bekannt. Vielleicht ist es nicht einmal ein Lebewesen, sondern nur eine Ansammlung von Stoffen aus der Kanalisation, die einen Hauch von eigenem Willen entwickelt hat.
actors.mobs.reborngoo.warning=Goo schwillt an. Geh aus dem Weg!
actors.mobs.reborndm300.desc=Diese Maschine wurde vor mehreren Jahrhunderten von den Zwergen gebaut. Später ersetzten sie ihre Maschinen durch Golems, Elementare und sogar Dämonen. Das führte schließlich zum Niedergang ihrer Zivilisation. Der DM-300 und ähnliche Maschinen wurden meist beim Bauen und im Bergbau eingesetzt, gelegentlich auch zur Verteidigung der Städte.
actors.mobs.reborndm300.repair=DM-300 repariert sich!
actors.mobs.reborndm300.warning=Der Motor heult. Verlasse die markierten Stellen!
actors.mobs.rebornking.desc=Der letzte Zwergenkönig kannte die Geheimnisse von Leben und Tod. Er überredete seinen Hofstaat zu einem Ritual, das ihnen ewige Jugend schenken sollte. Am Ende bekam nur er sie, zusammen mit einer Armee von Untoten.
actors.mobs.rebornking.warning=Der König hebt die Hand!
actors.mobs.rebornking.herald_fell=Haltet die Stellung, ihr Feiglinge!
actors.mobs.rebornking$retainer.name_0=Königswache
actors.mobs.rebornking$retainer.desc_0=Ein toter Zwerg in ramponierter Rüstung. Er bewacht noch immer seinen König.
actors.mobs.rebornking$retainer.name_1=Hofzauberer
actors.mobs.rebornking$retainer.desc_1=Ein Hofmagier, von den Toten zurückgeholt. In seinen Händen sammelt sich dunkle Magie.
actors.mobs.rebornking$retainer.name_2=Königlicher Herold
actors.mobs.rebornking$retainer.desc_2=Selbst mit gebrochenem Kiefer bellt dieser Herold noch die Befehle des Königs. Die Toten gehorchen.
actors.mobs.rebornking$retainer.name_3=Untoter Bogenschütze
actors.mobs.rebornking$retainer.desc_3=Dieser Zwerg wurde mit seinem Bogen begraben. Er hat nicht vergessen, wie man damit umgeht.
actors.mobs.rebornyog.desc=Yog-Dzewa ist ein Alter Gott, ein mächtiges Wesen aus den Reichen des Chaos. Vor einem Jahrhundert errangen die alten Zwerge nur knapp den Sieg über sein Dämonenheer, konnten den Gott selbst aber nicht töten. Stattdessen sperrten sie ihn in die Hallen unter ihrer Stadt, da sie ihn für zu schwach hielten, um jemals wieder aufzuerstehen.
actors.mobs.rebornyog.warning=Die Luft reißt auf. Verlasse die flackernden Zeichen!
actors.mobs.rebornyog.inherit_rot=Fleisch vergeht. Ich bleibe.
actors.mobs.rebornyog.inherit_fire=Die Flamme gehört nun mir.
actors.mobs.rebornyog$rotting.desc=Eine riesige Faust aus verwesendem Fleisch. Zwischen ihren Fingern sickert übler Schleim hervor und befleckt den Stein darunter.
actors.mobs.rebornyog$rotting.warning=Die faulende Faust holt aus!
actors.mobs.rebornyog$burninghand.desc=Eine gewaltige Faust, von Feuer umhüllt. Ihre Finger knistern beim Schließen und lassen Glut auf den Boden rieseln.
actors.mobs.rebornyog$burninghand.warning=Glut sammelt sich vor der brennenden Faust!
actors.mobs.reborntengu.shadow_broken=Mein Schatten…!
