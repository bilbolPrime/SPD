skills4.subclass.gladiator=Serangan jarak dekat yang berhasil menghasilkan kombo, menambahkan kerusakan pada serangan selanjutnya.\n\n_+3 akurasi jarak dekat_\n_10% serangan jarak dekat lebih cepat_
skills4.subclass.berserker=Di bawah 40% kesehatan, amarah meningkatkan kerusakan sebesar 50%.\n\n_10% lebih banyak kerusakan jarak dekat_\n_10% lebih sedikit kerusakan yang diterima_
skills4.subclass.battlemage=Pukulan tongkat yang mengenai musuh memulihkan satu muatan dan menambahkan jumlah muatan saat ini ke kerusakan.\n\n_Percikan memiliki peluang 50% untuk membutakan sasaran selama 3 giliran._
skills4.subclass.warlock=Membunuh musuh memulihkan kesehatan dan mengurangi rasa lapar.\n\n_Percikan memberikan 5 kerusakan tambahan._\n_Bisa memanggil satu makhluk tambahan._
skills4.subclass.freerunner=Saat tidak terbebani dan tidak kelaparan, bergerak 60% lebih cepat dan dapatkan penghindaran ganda saat bergerak.
skills4.subclass.assassin=Serangan mendadak memberikan kerusakan tambahan.\n\n_+1 kemampuan mengendap_
skills4.subclass.warden=Menginjak rumput tinggi memberikan Kulit Kayu. Tanaman dapat menjatuhkan biji dan embun tambahan.
skills4.subclass.sniper=Serangan jarak jauh mengabaikan zirah dan menandai sasaran untuk mempercepat serangan berikutnya.\n\n_20% lebih banyak kerusakan jarak jauh_
skills4.subclass.spirit_binder=Serangan jarak dekat tongkat memulihkan muatan dan menambahkan muatan tongkat saat ini ke kerusakan.\n\n_Kerangka yang dibangkitkan bertahan dua kali lebih lama._
skills4.subclass.lich=Membunuh musuh memulihkan kesehatan dan mengurangi rasa lapar.\n\n_Kerangka dan pemanah kerangka yang dibangkitkan memiliki kekuatan dua kali lipat._\n_Bisa memanggil satu makhluk tambahan._
skills4.subclass.marshal=Serangan jarak dekat yang berhasil menghasilkan kombo.\n\n_+5 amunisi senjata_\n_+1 akurasi senjata_
skills4.subclass.executioner=Di bawah 40% kesehatan, amarah meningkatkan kerusakan sebesar 50% dan mempercepat tembakan sebesar 50%.\n\n_Isi ulang 25% lebih cepat_
