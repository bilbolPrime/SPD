skills4.bombvoyage.intro=Ubah anak panah menjadi bom. Ledakan tersebut juga dapat melukai Anda dan sekutu Anda.
skills4.follow_through.intro=Pembunuhan memperkuat serangan jarak jauh berikutnya selama empat giliran.

skills4.curse.intro=Melemahkan serangan musuh selama sepuluh giliran.
skills4.necro_spirit.intro=Meningkatkan mana maksimum Anda.
skills4.raise_skeleton.intro=Menghidupkan kerangka dari mayat di tanah.
skills4.summon_ghost.intro=Memanggil hantu untuk bertarung di sisimu.
skills4.soul_bind.intro=Meningkatkan kerusakan yang ditimbulkan makhluk panggilanmu.
skills4.necro_meditation.intro=Pulihkan mana ekstra seiring berjalannya waktu.
skills4.necro_drain_life.intro=Menguras kesehatan musuh dan memulihkan setengah kerusakan yang ditimbulkan.
skills4.master_of_death.intro=Menghidupkanmu kembali dengan kesehatan dan mana penuh. Kekuatan ini harus pulih sebelum bisa menyelamatkanmu lagi.
skills4.spirit_army.intro=Kamu dapat mempertahankan satu makhluk panggilan tambahan.
skills4.mend_bones.intro=Menyembuhkan makhluk panggilanmu yang terlihat.
skills4.guardian_bond.intro=Mengurangi kerusakan yang diterima makhluk panggilanmu.
skills4.corpse_explosion.intro=Meledakkan mayat. Ledakan itu mengenai semua orang di sebelahnya, termasuk Anda dan sekutu Anda.
skills4.raise_skeleton_archer.intro=Menghidupkan pemanah kerangka dari mayat di tanah.
skills4.last_rites.intro=Setiap makhluk panggilan mendapat satu kesempatan selamat dari pukulan mematikan dengan seperempat kesehatan.
skills4.soul_shelter.intro=Mengurangi kerusakan dari pukulan jarak dekat berikutnya yang kamu terima. Perlindungan bertahan hingga empat giliran.
