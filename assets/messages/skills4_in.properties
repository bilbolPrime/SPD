skills4.smash.intro=Menyerang musuh di dekatnya dengan kekuatan kasar.
skills4.endurance.intro=Meningkatkan kesehatan maksimal Anda.
skills4.firm_hand.intro=Meningkatkan akurasimu dalam pertarungan jarak dekat.
skills4.regeneration.intro=Pulihkan kesehatan ekstra seiring berjalannya waktu. Kelaparan menghentikan pemulihan ini.
skills4.toughness.intro=Mengurangi kerusakan yang masuk, kecuali kelaparan.
skills4.knockback.intro=Menyerang musuh dan mendorongnya mundur satu petak. Bos tidak bisa didorong.
skills4.second_wind.intro=Segera memulihkan kesehatan.
skills4.sure_footing.intro=Memperpendek durasi terjerat akar dan pincang.
skills4.mastery.intro=Tingkatkan level efektif dan kecepatan serangan senjatamu.
skills4.parry.intro=Mengurangi kerusakan dari pukulan jarak dekat berikutnya yang kamu terima. Perlindungan bertahan hingga empat giliran.
skills4.smite.intro=Menghantam musuh sambil mengabaikan separuh pertahanannya. Memakai dua giliran.
skills4.riposte.intro=Memperkuat serangan jarak dekat berikutnya setelah pemblokiran. Berlangsung empat giliran.
skills4.footwork.intro=Memberimu lebih banyak waktu di antara serangan jarak dekat untuk mempertahankan kombo.
skills4.duelist.intro=Meningkatkan penghindaran saat tepat satu musuh berdiri di samping Anda.
skills4.disarming_strike.intro=Menyerang musuh dan melemahkannya selama tiga giliran.
skills4.find_the_gap.intro=Serangan jarak dekat ketiga yang mengenai musuh berturut-turut, dan setiap serangan berikutnya, menembus sebagian zirah sasaran.
skills4.aggression.intro=Kerusakan jarak dekat Anda meningkat saat Anda kehilangan kesehatan.
skills4.charge.intro=Menerjang dan menyerang musuh hingga empat petak jauhnya. Jalur harus bebas dari penghalang.
skills4.rampage.intro=Menyerang setiap musuh yang berdekatan.
skills4.bloodlust.intro=Mempercepat serangan jarak dekat selama tiga giliran setelah pembunuhan.
skills4.war_cry.intro=Melemahkan musuh yang terlihat dalam dua petak.
skills4.rend.intro=Serbuan dan Mengamuk membuat musuh yang selamat berdarah.
skills4.relentless.intro=Membunuh musuh memperpendek sisa waktu pemulihan Serbuan dan Teriakan Perang.
skills4.cornered.intro=Mengurangi kerusakan jarak dekat yang diterima saat dua musuh atau lebih mengelilingi Anda.

skills4.spark.intro=Menembakkan percikan api ke arah musuh yang terlihat.
skills4.spirituality.intro=Meningkatkan mana maksimum Anda.
skills4.sorcerer.intro=Tongkatmu menghasilkan lebih banyak kerusakan.
skills4.summon_rat.intro=Memanggil tikus untuk bertarung di sisimu.
skills4.meditation.intro=Pulihkan mana ekstra seiring berjalannya waktu.
skills4.spirit_armor.intro=Menyerap kerusakan dengan mana. Setiap satu kerusakan yang diserap memakai satu mana.
skills4.wizard.intro=Tongkatmu terisi ulang lebih cepat.
skills4.channeling.intro=Mempersingkat cooldown skill aktif, menjadi minimal satu giliran.
skills4.charged_staff.intro=Serangan jarak dekat tongkat sihir memulihkan mana.
skills4.arcane_ward.intro=Mengurangi kerusakan dari pukulan jarak dekat berikutnya yang kamu terima. Perlindungan bertahan hingga empat giliran.
skills4.arcane_strike.intro=Memberikan serangan magis yang mengabaikan separuh armor target.
skills4.conductive.intro=Muatan sihir yang tersimpan memperkuat serangan jarak dekat tongkat. Setiap serangan yang mengenai sasaran memakai satu muatan, bukan mengisi ulang tongkat.
skills4.discharge.intro=Melepaskan ledakan sihir yang melukai semua musuh di sebelahmu.
skills4.spellweave.intro=Meningkatkan kerusakan tongkat selama tiga giliran setelah mendaratkan serangan jarak dekat.
skills4.drain_life.intro=Melukai musuh dan memulihkan kesehatanmu sebesar setengah kesehatan yang hilang darinya.
skills4.rabid_minions.intro=Makhluk yang Anda panggil menimbulkan lebih banyak kerusakan.
skills4.summon_skeleton.intro=Memanggil kerangka untuk bertarung di sisimu.
skills4.soul_hunger.intro=Memulihkan mana saat kamu membunuh musuh.
skills4.enrage.intro=Selama kemampuan ini aktif, makhluk panggilanmu menimbulkan dan menerima lebih banyak kerusakan.
skills4.slow.intro=Memperlambat gerakan dan serangan musuh.
skills4.summoner.intro=Kamu dapat mempertahankan satu makhluk panggilan tambahan.
skills4.dark_pact.intro=Mengorbankan lima kesehatan untuk memulihkan mana. Membutuhkan setidaknya enam kesehatan.

skills4.double_strike.intro=Pukul dua kali berturut-turut dengan cepat.
skills4.stealth.intro=Membuatmu lebih sulit dideteksi musuh.
skills4.evasion.intro=Meningkatkan peluang Anda untuk menghindari serangan.
skills4.smoke_bomb.intro=Menghilang dalam kepulan asap. Efeknya berakhir saat kamu menyerang.
skills4.bandit.intro=Mendapat lebih banyak emas dari setiap tumpukan yang diambil.
skills4.venom.intro=Selama kemampuan ini aktif, pukulan jarak dekatmu dapat meracuni sasaran.
skills4.locksmith.intro=Anda mempunyai kesempatan untuk melucuti jebakan ketika Anda menginjaknya.
skills4.light_step.intro=Memperpendek durasi terjerat akar dan pincang.
skills4.dash.intro=Bergerak hingga dua petak melalui jalur tanpa penghalang.
skills4.haste.intro=Meningkatkan kecepatan gerakanmu selama lima giliran.
skills4.shadow_clone.intro=Ciptakan satu klon kuat atau tiga klon lemah untuk bertarung demi Anda.
skills4.escape.intro=Membebaskanmu dari jeratan akar dan pincang, lalu meningkatkan penghindaran selama empat giliran.
skills4.trailblazer.intro=Meningkatkan kecepatan gerakanmu.
skills4.skirmish.intro=Bergerak memperkuat serangan jarak dekatmu berikutnya.
skills4.keep_distance.intro=Meningkatkan penghindaran terhadap musuh yang jaraknya lebih dari satu petak.
skills4.ambush.intro=Meningkatkan kerusakan jarak dekat saat tidak terlihat.
skills4.scorpion.intro=Racunmu menghasilkan lebih banyak kerusakan.
skills4.silent_death.intro=Serangan jarak dekat dapat langsung membunuh musuh yang tertidur. Bos kebal.
skills4.expose.intro=Serangan jarak dekatmu mengabaikan beberapa armor.
skills4.execution.intro=Meningkatkan kerusakan terhadap musuh dengan kesehatan di bawah seperempat.
skills4.deadly_throw.intro=Meningkatkan kerusakan senjata jarak jauh.

skills4.accuracy.intro=Serangan jarak jauhmu lebih akurat.
skills4.awareness.intro=Kamu mempunyai kesempatan untuk menghindari serangan jarak jauh yang masuk.
skills4.double_shot.intro=Menembakkan dua anak panah berurutan. Menghabiskan dua anak panah biasa.
skills4.hunting.intro=Menemukan daging mentah saat Anda menjelajah.
skills4.fletching.intro=Membuat panah biasa saat Anda menjelajah.
skills4.ko_arrow.intro=Panahmu berikutnya memperlambat targetnya dan mungkin membuatnya tertidur.
skills4.woodcraft.intro=Membuatmu lebih sulit dideteksi musuh.
skills4.quickdraw.intro=Mempercepat serangan jarak jauhmu.
skills4.barkskin.intro=Meningkatkan armormu.
skills4.nature_mend.intro=Segera memulihkan kesehatan.
skills4.entangle.intro=Mengikat musuh yang terlihat dengan akar agar tidak bisa bergerak.
skills4.herbalist.intro=Mengurangi kerusakan racun.
skills4.dew_keeper.intro=Meningkatkan penyembuhan yang diterima dari embun.
skills4.knee_shot.intro=Anak panahmu dapat melumpuhkan sasarannya.
skills4.thicket.intro=Mengurangi kerusakan dari pukulan jarak dekat berikutnya yang kamu terima. Perlindungan bertahan hingga empat giliran.
skills4.aimed_shot.intro=Meningkatkan kerusakan serangan panah berikutnya.
skills4.long_sight.intro=Meningkatkan kerusakan jarak jauh terhadap musuh yang berjarak setidaknya empat petak.
skills4.piercing_shot.intro=Anak panah berikutnya mengabaikan sebagian zirah sasaran.
