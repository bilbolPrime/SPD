custom.generated.entry_a_soothing_melody_will_put_all_creatures_in_your_b85e1025e0=Melodi yang menenangkan akan membuat semua makhluk dalam pandangan Anda tertidur lelap, memberi Anda kesempatan untuk melarikan diri atau melakukan serangan mendadak terhadap mereka.
