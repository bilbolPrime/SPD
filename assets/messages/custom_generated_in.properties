custom.generated.entry_permanently_reveals_all_of_the_secrets_of_a_sing_37263236ea=Mengungkap semua rahasia dari satu barang secara permanen.
custom.generated.entry_read_this_scroll_to_unleash_the_wrath_of_the_dun_db502abf39=Bacalah gulungan ini untuk melepaskan murka roh-roh penjara bawah tanah, membunuh semua yang ada di level saat ini. Yah, hampir semuanya. Beberapa makhluk yang lebih kuat mungkin tidak terpengaruh.
custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=Mantra yang tertulis di gulungan ini akan menciptakan kembaran ilusi dari pembaca, yang akan mengejar musuh-musuhnya.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Mantra yang tertera pada gulungan ini akan seketika menghilangkan dari senjata, baju besi, cincin, dan barang-barang yang dibawa pembaca segala sihir jahat yang mungkin mencegah pemakainya untuk melepaskannya.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Kekuatan magis mentah yang terikat dalam perkamen ini, ketika dilepaskan, akan mengisi ulang semua tongkat sihir pembaca hingga kekuatan penuh.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Gulungan itu menyimpan rahasia ritual terlarang. Sebagai imbalan atas kesejahteraan pembaca, gulungan itu melukai semua orang di sekitarnya dan menyembuhkannya sepenuhnya.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Gulungan itu tampak lebih dingin daripada sekitarnya. Seolah-olah itu adalah portal menuju dimensi yang lebih dingin.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Mantra pada gulungan ini langsung memindahkan pembaca ke lokasi acak di tingkat penjara bawah tanah. Mantra ini dapat digunakan untuk melarikan diri dari situasi berbahaya, tetapi pembaca yang kurang beruntung mungkin akan mendapati dirinya berada di tempat yang bahkan lebih berbahaya.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Gulungan ini berisi energi penghancur, yang dapat disalurkan secara psionik untuk menimbulkan kerusakan besar pada semua makhluk dalam bidang pandang. Kilatan cahaya yang menyertainya akan membutakan sementara semua orang di area efek, termasuk pembaca gulungan tersebut.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Gulungan ini mampu memberikan mantra acak pada senjata atau baju zirah, sehingga memberinya kekuatan khusus.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Gulungan ini akan meningkatkan satu item, memperbaiki kualitasnya. Tongkat sihir akan meningkat kekuatannya dan jumlah muatannya; senjata akan menimbulkan lebih banyak kerusakan atau lebih sering mengenai sasaran; baju zirah akan menangkis lebih banyak pukulan; efek cincin pada pemakainya akan meningkat. Senjata dan baju zirah juga akan membutuhkan lebih sedikit kekuatan untuk digunakan, dan kutukan apa pun pada item tersebut akan dihilangkan.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Saat dibaca keras-keras, gulungan ini akan mengeluarkan raungan menantang yang akan membangunkan semua monster dan memberi tahu mereka lokasi pembaca.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Saat dibaca, kata-kata inspiratif akan membuat Anda siap bertempur.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=Saat dibaca, kata-kata bijak akan meningkatkan kemampuan Anda.

