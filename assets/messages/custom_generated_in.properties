custom.generated.entry_a_flash_of_red_light_will_overwhelm_all_creature_eb24a236a9=Kilatan cahaya merah akan membuat semua makhluk dalam pandangan Anda diliputi rasa takut, dan mereka akan berbalik dan melarikan diri. Menyerang musuh yang melarikan diri akan menghilangkan efek tersebut.
