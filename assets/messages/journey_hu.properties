journey.title=Hadjárat
journey.intro=Yog megszerezte az Amulettet, seregei pedig már elérik a felszínt.\n\nVezess hat hőst a megszállt területeken át. Minden bevetéshez válassz útvonalat és hőst. Aki elesik, ebben a hadjáratban már nem tér vissza.
