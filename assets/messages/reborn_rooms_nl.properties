levels.rebornsiderooms.leave=Laten liggen
actors.mobs.npcs.echoreflection.name=je spiegelbeeld
actors.mobs.npcs.echoreflection.desc=Een bleke kopie van jou wacht roerloos. Hij vecht alleen als je hem uitdaagt. Versla hem voor één vaardigheidspunt. Als je de kamer verlaat, eindigt het duel en herstelt je spiegelbeeld volledig.
actors.mobs.npcs.echoreflection.challenge=Je spiegelbeeld uitdagen? Een overwinning levert één vaardigheidspunt op. Je kunt vluchten, maar je spiegelbeeld herstelt als je de kamer verlaat.
actors.mobs.npcs.echoreflection.accept=Uitdagen
actors.mobs.npcs.echoreflection.withdrawn=Je spiegelbeeld wordt weer stil.
actors.mobs.npcs.echoreflection.victory=Het spiegelbeeld verdwijnt en laat een vaardigheidsrol achter.
actors.mobs.npcs.barbecueking.name=rattenkoning
actors.mobs.npcs.barbecueking.desc=Ook een koning moet eten. Hij heeft een rustig hoekje gevonden om zijn avondeten te grillen.
actors.mobs.npcs.barbecueking.greeting=Koninklijke zaken. Heel belangrijk. Heel lekker.
actors.mobs.npcs.barbecueking.stolen=HÉ! Dat was van mij!
actors.mobs.npcs.barbecueking.after=Ik hoop dat je erin stikt.
actors.mobs.npcs.forgottenoffering.name=vergeten offer
actors.mobs.npcs.forgottenoffering.desc=Onder het kristal liggen een voedselrantsoen en een genezingsdrank. Kies er één; de andere vergaat tot stof.
actors.mobs.npcs.watchremains.name=gevallen wachter
actors.mobs.npcs.watchremains.desc=Naast een kapotte muur liggen de botten van een wachter. Onder zijn helm zit een briefje.
actors.mobs.npcs.watchremains.note=De hele nacht de deur verdedigd. Ze kwamen door de muur.
