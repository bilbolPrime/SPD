skills4.subclass.battlemage=A pálca közelharci találatai visszaadnak egy töltetet, és a meglévő töltetek számát hozzáadják a sebzéshez.\n\n_A Szikra 50% eséllyel megvakítja a célpontot 3 körre._
skills4.subclass.warlock=Az ellenségek megölése életerőt ad vissza és csillapítja az éhséget.\n\n_A Szikra 5-tel többet sebez._\n_Egy további lényt idézhetsz meg._
skills4.subclass.freerunner=Túl nehéz felszerelés nélkül, amíg nem éhezel, 60%-kal gyorsabban mozogsz. Mozgás közben megduplázódik a kitérésed.
skills4.subclass.assassin=A meglepetéstámadások többet sebeznek.\n\n_+1 lopakodás_
skills4.subclass.warden=A magas fű letaposása Kéregbőrt ad. A növények több magot és harmatot adhatnak.
skills4.subclass.sniper=A távolsági támadások figyelmen kívül hagyják a páncélt, és megjelölik a célpontot egy gyorsabb következő támadáshoz.\n\n_20%-kal több távolsági sebzés_
skills4.subclass.spirit_binder=A pálca közelharci találatai visszaadnak egy töltetet, és a meglévő töltetek számát hozzáadják a sebzéshez.\n\n_A feltámasztott csontvázak kétszer annyi ideig maradnak meg._
skills4.subclass.lich=Az ellenségek megölése életerőt ad vissza és csillapítja az éhséget.\n\n_A feltámasztott csontvázak és csontvázíjászok életereje és sebzése 25%-kal nő._\n_Egy további lényt idézhetsz meg._
