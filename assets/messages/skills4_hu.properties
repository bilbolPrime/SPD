skills4.smash.intro=Nyers erővel eltalálja a szomszédos ellenséget.
skills4.endurance.intro=Növeli maximális egészségi állapotát.
skills4.firm_hand.intro=Javítja a pontosságot közelharcban.
skills4.regeneration.intro=Idővel további életerőt állít vissza. Éhezés közben ez a gyógyulás szünetel.
skills4.toughness.intro=Csökkenti a bejövő károkat, kivéve az éhezést.
skills4.knockback.intro=Lecsap egy ellenségre, és egy lapkával hátrébb löki. A főnököket nem lehet lökni.
skills4.second_wind.intro=Azonnal helyreállítja az egészséget.
skills4.sure_footing.intro=Csökkenti a gyökerezés és a sántítás időtartamát.
skills4.mastery.intro=Nehezebb közelharci fegyvereket forgathatsz, és gyorsabban támadhatsz.
skills4.parry.intro=Csökkenti a következő elszenvedett közelharci találat sebzését. A védelem legfeljebb négy körig tart.
skills4.smite.intro=Erős csapást mér az ellenfélre, figyelmen kívül hagyva a páncélja felét. Két kört vesz igénybe.
skills4.riposte.intro=Megerősíti a következő közelharci találatot a blokkolás után. Négy fordulatot bír ki.
skills4.footwork.intro=Több időt biztosít a közelharci találatok között a kombináció fenntartásához.
skills4.duelist.intro=Növeli az elkerülést, miközben pontosan egy ellenség áll melletted.
skills4.disarming_strike.intro=Leüt egy ellenséget, és három körre meggyengíti.
skills4.find_the_gap.intro=A harmadik egymást követő közelharci találatod és minden további találat figyelmen kívül hagyja a célpont páncéljának egy részét.
skills4.aggression.intro=A közelharci sebzésed nő, ha egészséget veszítesz.
skills4.charge.intro=Egy legfeljebb négy mezőre lévő ellenfélre rohan és megüti. Az út nem lehet elzárva.
skills4.rampage.intro=Lecsap minden szomszédos ellenségre.
skills4.bloodlust.intro=Egy ölés után három körrel felgyorsítja a közelharci támadásokat.
skills4.war_cry.intro=Két lapkán belül gyengíti a látható ellenségeket.
skills4.rend.intro=A Roham és a Tombolás vérzést okoz a túlélő ellenfeleknek.
skills4.relentless.intro=Egy ellenfél megölése csökkenti a Roham és a Csatakiáltás hátralévő töltési idejét.
skills4.cornered.intro=Csökkenti a közelharci sebzést, ha két vagy több ellenség vesz körül.

skills4.spark.intro=Szikrát gyújt egy látható ellenségre.
skills4.spirituality.intro=Növeli a maximális manát.
skills4.sorcerer.intro=A pálcáid több sebzést okoznak.
skills4.summon_rat.intro=Hívj egy patkányt, hogy harcoljon érted.
skills4.meditation.intro=Idővel többlet mana visszaszerzése.
skills4.spirit_armor.intro=Elnyeli a sebzést egy mana felhasználásával elnyelt pontonként.
skills4.wizard.intro=A pálcái gyorsabban töltődnek fel.
skills4.channeling.intro=Csökkenti az aktív képességek újratöltési idejét, de legalább egy kört várni kell két használat között.
skills4.charged_staff.intro=A pálca közelharci találatai helyreállítják a manát.
skills4.arcane_ward.intro=Csökkenti a következő elszenvedett közelharci találat sebzését. A védelem legfeljebb négy körig tart.
skills4.arcane_strike.intro=Mágikus ütést ad, amely figyelmen kívül hagyja a célpont páncéljának felét.
skills4.conductive.intro=A pálca tárolt töltései növelik a közelharci sebzését. Minden sikeres találat elhasznál egy töltést ahelyett, hogy újratöltené a pálcát.
skills4.discharge.intro=Varázslattal megsebzi az összes szomszédos ellenséget.
skills4.spellweave.intro=Növeli a pálcasebzést három fordulatra közelharci találat leszállása után.
skills4.drain_life.intro=Károsítja az ellenséget, és az elvesztett egészség feléért meggyógyít.
skills4.rabid_minions.intro=A megidézett lényeid több sebzést okoznak.
skills4.summon_skeleton.intro=Hívj egy csontvázat, hogy harcoljon érted.
skills4.soul_hunger.intro=Visszaállítja a manát, ha megölsz egy ellenséget.
skills4.enrage.intro=Bekapcsolva a megidézett lények több sebzést okoznak, de többet is szenvednek el.
skills4.slow.intro=Lelassítja egy ellenség mozgását és támadásait.
skills4.summoner.intro=Megtarthat még egy megidézett lényt.
skills4.dark_pact.intro=Öt életet feláldozni a mana helyreállításáért. Legalább hat életerő szükséges.

skills4.double_strike.intro=Üss kétszer egymás után.
skills4.stealth.intro=Megnehezíti, hogy az ellenség észrevegye.
skills4.evasion.intro=Javítja a támadások elkerülésének esélyét.
skills4.smoke_bomb.intro=Eltűnni egy füstfelhőben. A támadás megszakítja a hatást.
skills4.bandit.intro=Keressen extra aranyat minden egyes összegyűjtött kupacban.
skills4.venom.intro=Bekapcsolva a közelharci találataid megmérgezhetik a célpontot.
skills4.locksmith.intro=Lehetősége van hatástalanítani egy csapdát, amikor rálép.
skills4.light_step.intro=Csökkenti a gyökerezés és a sántítás időtartamát.
skills4.dash.intro=Legfeljebb két lapkát mozgat egy szabad útvonalon.
skills4.haste.intro=Öt fordulattal növeli a mozgási sebességet.
skills4.shadow_clone.intro=Egy erős vagy három gyengébb klónt hoz létre, amelyek érted harcolnak.
skills4.escape.intro=Megszünteti a gyökerek fogságát és a sántítást, majd négy körre növeli a kitérést.
skills4.trailblazer.intro=Növeli a mozgási sebességet.
skills4.skirmish.intro=A mozgás megerősíti a következő közelharci találatot.
skills4.keep_distance.intro=Növeli az elkerülést egy lapkánál távolabb lévő ellenségek ellen.
skills4.ambush.intro=Növeli a közelharci sebzést, miközben láthatatlan.
skills4.scorpion.intro=A méreged több sebzést okoz.
skills4.silent_death.intro=A közelharci támadások egyenesen megölhetik az alvó ellenségeket. A főnökök immunisak.
skills4.expose.intro=A közelharci találataid figyelmen kívül hagyják a páncél egy részét.
skills4.execution.intro=Egynegyed életerő alá növeli az ellenség elleni sebzést.
skills4.deadly_throw.intro=Növeli a távolsági fegyverek sebzését.

skills4.accuracy.intro=A távolsági támadásaid pontosabbak.
skills4.awareness.intro=Esélyed van kikerülni egy bejövő távolsági támadást.
skills4.double_shot.intro=Két nyilat lő ki egymás után. Két közönséges nyilat használ el.
skills4.hunting.intro=Nyers húst talál, miközben felfedezi.
skills4.fletching.intro=Közönséges nyilakat készít felfedezés közben.
skills4.ko_arrow.intro=A következő nyíl lelassítja a célpontját, és elaltathatja.
skills4.woodcraft.intro=Megnehezíti, hogy az ellenség észrevegye.
skills4.quickdraw.intro=Felgyorsítja a távolsági támadásokat.
skills4.barkskin.intro=Növeli a páncélját.
skills4.nature_mend.intro=Azonnal helyreállítja az egészséget.
skills4.entangle.intro=A látható ellenséget a helyére gyökerezi.
skills4.herbalist.intro=Csökkenti a mérgezés okozta károkat.
skills4.dew_keeper.intro=Növeli a harmatból származó gyógyulást.
skills4.knee_shot.intro=Nyilaid megsántíthatják a célpontot.
skills4.thicket.intro=Csökkenti a következő elszenvedett közelharci találat sebzését. A védelem legfeljebb négy körig tart.
skills4.aimed_shot.intro=Növeli a következő nyíltalálat sebzését.
skills4.long_sight.intro=Növeli a távolsági sebzést az ellenség ellen, legalább négy lapkával távolabb.
skills4.piercing_shot.intro=A következő nyilad figyelmen kívül hagyja a célpont páncéljának egy részét.
skills4.iron_tip.intro=A vashegyek átengedik a nyilakat az ellenségeken, és eltalálják a mögöttük állókat. A falak és a szövetségesek megállítják a nyilat.
skills4.mark_prey.intro=Hat körig megjelöl egy ellenséget, növelve ezzel a sebzésedet.
skills4.bombvoyage.intro=Változtass egy nyilat bombává. A robbanás neked és szövetségeseidnek is árthat.
skills4.follow_through.intro=Egy kill megerősíti a következő távolsági találatodat négy körig.

skills4.curse.intro=Gyengítse az ellenség támadásait tíz körig.
skills4.necro_spirit.intro=Növeli a maximális manát.
skills4.raise_skeleton.intro=Csontvázat támaszt fel egy földön fekvő holttestből.
skills4.summon_ghost.intro=Hívj egy szellemet, hogy harcoljon érted.
skills4.soul_bind.intro=Növeli a megidézett lények sebzését.
skills4.necro_meditation.intro=Idővel többlet mana visszaszerzése.
skills4.necro_drain_life.intro=Merítse le az ellenség egészségét, és térítse vissza az okozott sebzés felét.
skills4.master_of_death.intro=Teljes életerővel és manával támaszt fel. A képességnek újra kell töltődnie, mielőtt ismét megmenthet.
skills4.spirit_army.intro=Egyszerre még egy megidézett lényt tarthatsz fenn.
skills4.mend_bones.intro=Gyógyítja a látótávolságon belüli megidézett lényeidet.
skills4.guardian_bond.intro=Csökkenti a megidézett lények által elszenvedett sebzést.
