journey.title=여정
journey.intro=요그는 아뮬렛을 손에 넣었고, 그의 군대는 이미 지상으로 올라오고 있다.\n\n여섯 영웅을 이끌고 점령당한 땅을 지나가자. 출정할 때마다 경로와 영웅을 고를 수 있다. 쓰러진 영웅은 이번 여정에 다시 합류할 수 없다.
