items.bags.keyring.name=钥匙圈
items.bags.keyring.info=这是一个铜质钥匙圈，可以让你把所有钥匙与其他物品分开存放。
custom.difficulty.easy=简单的
custom.difficulty.easy.desc=- 初始额外获得2份口粮。- 初始获得2瓶治疗药水。- 初始获得200金币。- 初始获得2个灵魂水晶。- 发现隐藏门和陷阱的奖励。- 怪物变弱，伤害降低25%，受到的伤害增加10%，生命值降低15%。- 精英怪生成率设置为10%。- 精英怪掉落率设置为30%。
custom.difficulty.hard=难的
custom.difficulty.hard.desc=- 治疗药水恢复75%最大生命值。- 怪物更强，造成额外10%伤害，受到的伤害减少10%，生命值增加20%。- 精英怪生成率设置为30%。- 精英怪掉落率设置为50%。
custom.difficulty.hell.desc=- 治疗药水恢复50%最大生命值。- 怪物变为无敌状态，造成额外35%伤害，受到的伤害降低30%，生命值增加45%。- 精英怪生成率设为50%。- 英雄初始最大生命值减少4点。- 英雄升级时最大生命值增加1点。- 精英怪掉落率设为70%。
custom.difficulty.just_kill_me=杀了我吧
custom.difficulty.just_kill_me.desc=- 初始拥有两瓶经验药水。- 治疗药水恢复10%最大生命值。- 怪物变为神祇，造成额外60%伤害，承受额外40%伤害，生命值提升75%。- 精英怪生成率设为100%。- 英雄初始最大生命值降低8点。- 英雄升级时最大生命值增加减少3点。- 精英怪掉落率设为100%。
custom.difficulty.nightmare.desc=- 治疗药水恢复25%最大生命值。- 怪物如同神明一般，造成额外45%伤害，承受额外30%伤害，生命值增加60%。- 精英怪生成率设为70%。- 英雄初始最大生命值减少8点。- 英雄升级时最大生命值增加减少3点。- 精英怪掉落率设为90%。
custom.difficulty.normal.desc=- 怪物为标准模式。\n- 精英怪生成率设置为 20%。\n- 精英怪掉落率设置为 40%。
custom.difficulty.super_easy=超级简单
custom.difficulty.super_easy.desc=- 初始额外获得 5 份口粮。- 初始获得 5 瓶治疗药水。- 初始获得 500 金币。- 初始获得 3 个灵魂水晶。- 怪物变得弱小，伤害降低 50%，承受伤害增加 50%，生命值降低 50%。- 精英怪生成率设置为 10%。- 精英怪掉落率设置为 10%。
levels.sign.dead_end=你在这里做什么？！
levels.sign.tip_02=地牢里的门并非全部都一目了然。如果你被困住了，就去寻找隐藏的门吧。
levels.sign.tip_03=记住，提升力量并不是获得更好装备的唯一途径。你也可以反其道而行之，使用升级卷轴降低装备的力量需求。
levels.sign.tip_04=你可以在地牢更深层的商店里使用金币。第一家商店位于第六层。
levels.sign.tip_09=突袭的成功率更高。例如，当你预知敌人正在靠近时，你可以躲在紧闭的门后伏击他。
levels.sign.tip_13=如果你身上着火了，即使漂浮在水面上，你也无法扑灭火焰。
levels.sign.tip_21=像素商城。恶魔猎人专享特价！
actors.blobs.waterofawareness.drink_message=你啜饮一口，感觉知识如泉涌般涌入脑海。现在你对身上装备的物品了如指掌，也能感知到关卡中的所有物品，并知晓其中的所有秘密。
