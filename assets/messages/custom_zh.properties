levels.sign.burn=当你试图看清标志上的字时，它突然燃起绿色的火焰。
levels.sign.tip_01=不要高估自己的力量，使用你能驾驭的武器和盔甲。
levels.sign.tip_05=小心粘液！
levels.sign.tip_06=Pixel-Mart——助您成功冒险所需的一切！
levels.sign.tip_07=尽快清点你的药剂和卷轴。不要等到真正需要它们的时候才去做。
levels.sign.tip_08=饥饿本身并不痛苦，但挨饿却很痛苦。
levels.sign.tip_10=别放天狗出来！
levels.sign.tip_11=像素超市。花钱，活得更久。
levels.sign.tip_12=当同时受到多个怪物攻击时，试着躲到门后。
levels.sign.tip_14=同时拥有多个安卡是没有意义的，因为复活后你会失去它们。
levels.sign.tip_15=危险！重型机械可能造成人身伤害、肢体残缺甚至死亡！
levels.sign.tip_16=像素超市。地牢里更安全的生活。
levels.sign.tip_17=升级附魔武器时，有一定几率会破坏附魔效果。
levels.sign.tip_18=武器和盔甲比魔杖和戒指损耗得更快，但修复它们的方法也更多。
levels.sign.tip_19=获得“歼灭卷轴”的唯一方法是从地牢精灵那里获得礼物。
levels.sign.tip_20=在陛下面前，禁止携带任何武器！
