items.bags.keyring.info=Dit is een koperen sleutelring waarmee je al je sleutels apart van de rest van je spullen kunt bewaren.
custom.difficulty.easy=Eenvoudig
custom.difficulty.easy.desc=- Begin met 2 extra rantsoenen.\n- Begin met 2 genezingsdrankjes.\n- Begin met 200 goud.\n- Begin met 2 zielkristallen.\n- Bonus voor het ontdekken van verborgen deuren en vallen.\n- Vijanden zijn zwakker, doen 25% minder schade, incasseren 10% meer schade en hebben 15% minder HP.\n- Kans op het verschijnen van kampioenen ingesteld op 10%.\n- Kans op het laten vallen van kampioenen ingesteld op 30%.
custom.difficulty.hard=Moeilijk
custom.difficulty.hard.desc=- Genezingsdrankje geneest 75% van de maximale HP.\n- Vijanden zijn sterker, doen 10% meer schade, incasseren 10% minder schade en hebben 20% meer HP.\n- Verschijningskans kampioen ingesteld op 30%.\n- Dropkans kampioen ingesteld op 50%.
custom.difficulty.hell.desc=- Genezingsdrankje geneest 50% van de maximale HP.\n- Vijanden zijn onsterfelijk, doen 35% meer schade, incasseren 30% minder schade en hebben 45% meer HP.\n- De spawnkans van kampioenen is ingesteld op 50%.\n- Held begint met 4 minder maximale HP.\n- Held krijgt 1 minder maximale HP bij het levelen.\n- De dropkans van kampioenen is ingesteld op 70%.
custom.difficulty.just_kill_me=Maak me gewoon dood.
custom.difficulty.just_kill_me.desc=- Begint met twee ervaringsdrankjes.\n- Genezingsdrankje geneest 10% van de maximale HP.\n- Vijanden zijn goden, doen 60% meer schade, incasseren 40% minder schade en hebben 75% meer HP.\n- Kans op het verschijnen van kampioenen ingesteld op 100%.\n- Held begint met 8 minder maximale HP.\n- Held krijgt 3 minder maximale HP bij het levelen.\n- Kans op het verkrijgen van kampioenen ingesteld op 100%.
custom.difficulty.nightmare.desc=- Genezingsdrankje geneest 25% van de maximale HP.\n- Vijanden zijn goddelijk, doen 45% meer schade, incasseren 30% minder schade en hebben 60% meer HP.\n- De spawnkans van kampioenen is ingesteld op 70%.\n- De held begint met 8 minder maximale HP.\n- De held krijgt 3 minder maximale HP bij het levelen.\n- De dropkans van kampioenen is ingesteld op 90%.
custom.difficulty.normal.desc=- Mobs zijn standaard.\n- Spawnkans kampioen ingesteld op 20%.\n- Dropkans kampioen ingesteld op 40%.
custom.difficulty.super_easy=Supergemakkelijk
custom.difficulty.super_easy.desc=- Begin met 5 extra rantsoenen.\n- Begin met 5 genezingsdrankjes.\n- Begin met 500 goud.\n- Begin met 3 zielkristallen.\n- Vijanden zijn zielig, doen 50% minder schade, incasseren 50% meer schade en hebben 50% minder HP.\n- Kans op het verschijnen van kampioenen ingesteld op 10%.\n- Kans op het laten vallen van kampioenen ingesteld op 10%.
levels.sign.dead_end=Wat doe je hier?!
levels.sign.tip_02=Niet alle deuren in de kerker zijn direct zichtbaar. Als je vastzit, zoek dan naar verborgen deuren.
levels.sign.tip_03=Onthoud dat het verhogen van je kracht niet de enige manier is om toegang te krijgen tot betere uitrusting. Je kunt ook de omgekeerde weg bewandelen en de krachtvereiste verlagen met upgrade-rollen.
levels.sign.tip_04=Je kunt je goud uitgeven in winkels op de diepere verdiepingen van de kerker. De eerste winkel bevindt zich op de zesde verdieping.
levels.sign.tip_09=Een verrassingsaanval heeft een grotere kans van slagen. Je kunt bijvoorbeeld je vijand achter een gesloten deur in een hinderlaag lokken, wetende dat hij eraan komt.
levels.sign.tip_13=Als je brandt, kun je het vuur in het water niet blussen terwijl je zweeft.
levels.sign.tip_21=Pixel-Mart. Speciale prijzen voor demonenjagers!
actors.blobs.waterofawareness.drink_message=Terwijl je een slokje neemt, voel je de kennis je geest binnenstromen. Nu weet je alles over je uitrusting. Je voelt ook alle voorwerpen op het level en kent al hun geheimen.
