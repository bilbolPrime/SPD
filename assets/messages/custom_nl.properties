levels.sign.burn=Terwijl je het bord probeert te lezen, barst het uit in groenachtige vlammen.
levels.sign.tip_01=Onderschat je eigen kracht niet; gebruik wapens en bepantsering die je aankunt.
levels.sign.tip_05=Pas op voor slijm!
levels.sign.tip_06=Pixel-Mart - alles wat je nodig hebt voor een succesvol avontuur!
levels.sign.tip_07=Identificeer je drankjes en spreuken zo snel mogelijk. Stel het niet uit tot het moment dat je ze echt nodig hebt.
levels.sign.tip_08=Honger hebben doet geen pijn, maar verhongeren wel.
levels.sign.tip_10=Laat de Tengu niet ontsnappen!
levels.sign.tip_11=Pixel-Mart. Geef geld uit. Leef langer.
levels.sign.tip_12=Als je door meerdere monsters tegelijk wordt aangevallen, probeer dan achter een deur te schuilen.
levels.sign.tip_14=Het heeft geen zin om meer dan één Ankh tegelijk te bezitten, want je verliest ze allemaal bij je wederopstanding.
levels.sign.tip_15=GEVAAR! Zware machines kunnen letsel, amputaties of de dood tot gevolg hebben!
levels.sign.tip_16=Pixel-Mart. Een veiliger leven in de kerker.
levels.sign.tip_17=Wanneer je een betoverd wapen upgradet, bestaat de kans dat die betovering verloren gaat.
levels.sign.tip_18=Wapens en pantsers slijten sneller dan toverstokken en ringen, maar er zijn meer manieren om ze te repareren.
levels.sign.tip_19=De enige manier om een Vernietigingsrol te bemachtigen, is door deze als geschenk te ontvangen van de kerkergeesten.
levels.sign.tip_20=Wapens zijn niet toegestaan in de aanwezigheid van Zijne Majesteit!
