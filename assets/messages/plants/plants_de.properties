plants.blandfruitbush$seed.name=Samen der faden Frucht
plants.blandfruitbush.desc=Die birnenförmigen Früchte des Geschmackslosen Fruchtstrauchs, entfernt verwandt mit der Rotbeere, schmecken wie angetrockneter Staub. Sie sind zwar unappetitlich und geschmacklos, aber nicht giftig. Vielleicht könnte man sie kochen.
plants.blandfruitbush.discover_hint=Diese Pflanze kann man zufällig im Dungeon finden.
plants.blandfruitbush.name=fade Früchte
plants.blindweed$seed.name=Samen der Blindenpflanze
plants.blindweed.desc=Bei Berührung vergeht das Blindkraut in einem hellen Lichtblitz. Der Blitz ist so stark, dass er für einige Sekunden desorientiert.
plants.blindweed.name=Blindkraut
plants.blindweed.warden_desc=Der Wächter wird die Energie des Blindkrauts in einen vorübergehenden Schleier der Unsichtbarkeit kanalisieren, anstatt desorientiert zu werden.
plants.earthroot$armor.desc=Eine Art natürlicher, unbeweglicher Panzer aus Rinde und Schnur. Dieser Kräuterpanzer blockiert jeglichen physischen Schaden, bis er schließlich seine Haltbarkeit verliert und zerbricht. Da der Panzer unbeweglich ist, zerbricht er bei jeder Bewegung und geht verloren. Verbleibende Panzerung: 1
plants.earthroot$armor.name=Kräuterrüstung
plants.earthroot$seed.name=Samen der Erdwurzel
plants.earthroot.desc=Wenn ein Lebewesen eine Erdwurzel berührt, bilden deren Wurzeln eine Art unbeweglichen natürlichen Schutz um es herum.
plants.earthroot.name=Erdwurzel
plants.earthroot.warden_desc=Die Wurzeln einer Erdwurzelpflanze bewegen sich mit der Wächterin und bilden so ihre mobile Rindenhautrüstung.
plants.fadeleaf$seed.name=Samen von Faledaf
plants.fadeleaf.desc=Durch Berühren eines Fadeleafs wird jede Kreatur an einen zufälligen Ort auf der aktuellen Ebene teleportiert.
plants.fadeleaf.name=verblasstes Blatt
plants.fadeleaf.warden_desc=Der Teleportationseffekt von Fadeleaf ist bei der Wächterin stärker ausgeprägt und teleportiert sie zurück ans Ende der vorherigen Dungeon-Ebene.
plants.firebloom$seed.name=Samen der Feuerblüte
plants.firebloom.desc=Wenn etwas eine Feuerblüte berührt, geht sie in Flammen auf.
plants.firebloom.name=Feuerblüte
plants.firebloom.warden_desc=Wenn sie eine Feuerblüte zertritt, wird die Wächterin kurzzeitig von Flammen erfüllt, anstatt Schaden zu nehmen.
plants.icecap$seed.name=Samen der Eiskappe
plants.icecap.desc=Bei Berührung gibt eine Eiskappe eine Wolke aus gefrorenem Pollen ab. Dieser Gefriereffekt ist in feuchter Umgebung deutlich stärker.
plants.icecap.name=Eiskappe
plants.icecap.warden_desc=Wenn sie eine Eiskappe zertritt, wird die Wächterin kurzzeitig von Frost erfüllt, anstatt Schaden zu nehmen.
plants.mageroyal$seed.name=Samen von mageroyal
plants.mageroyal.desc=Die stacheligen Blüten des Mageroyal enthalten eine Substanz, die für ihre stark neutralisierende Wirkung bekannt ist. Alles, was mit dieser Pflanze in Berührung kommt, wird von vielen negativen Einflüssen gereinigt.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Sie fühlen sich erfrischt.
plants.mageroyal.warden_desc=Zusätzlich zum neutralisierenden Effekt wird der Wächter beim Betreten von mageroyal vorübergehend immun gegen alle flächengebundenen Effekte.
plants.plant$seed$placeholder.name=Samen
plants.plant$seed.ac_plant=ANLAGE
plants.plant$seed.info=Wirf diesen Samen an die Stelle, wo du eine Pflanze anbauen möchtest.\n\n%s
plants.plant$seed.seed_of=Seed von %s
plants.plant.discover_hint=Diese Pflanze kann man zufällig im Dungeon finden oder aus dem dazugehörigen Samen ziehen.
plants.plant.warden_desc=Diese Pflanze hat bei Verwendung durch den Wächter keine besondere Wirkung.
plants.rotberry$seed.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
plants.rotberry$seed.name=Samen der Rotbeere
plants.rotberry.desc=Die Beeren eines jungen Rotbeerstrauchs schmecken süßlich-süß nach Tod. Innerhalb weniger Jahre entwickelt sich aus diesem Rotbeerstrauch ein weiteres Fäulnisherz. Beim Zertreten stößt ein junger Rotbeerstrauch eine kleine Wolke giftigen Gases aus.
plants.rotberry.discover_hint=Diese Pflanze kann man im Rahmen einer bestimmten Quest aus dem zugehörigen Samen ziehen.
plants.rotberry.name=Rotberry
plants.rotberry.warden_desc=Normalerweise produziert ein Rotbeerenstrauch beim Zertreten nur wenig Gas, aber _die Wächterin_ ist in der Lage, daraus Energie zu gewinnen, um ihre Kraft vorübergehend zu steigern!
plants.sorrowmoss$seed.name=Samen des Trauermooses
plants.sorrowmoss.desc=Das Trauermoos ist eine Blume (kein Moos) mit rasiermesserscharfen Blütenblättern, die mit einem tödlichen Gift überzogen sind.
plants.sorrowmoss.name=Trauermoos
plants.sorrowmoss.warden_desc=Wenn sie ein Trauermoos zertritt, wird die Wächterin kurzzeitig mit Giftstoff erfüllt, anstatt Schaden zu erleiden.
plants.starflower$seed.name=Samen der Sternblume
plants.starflower.desc=Die seltene Sternblume soll jedem, der sie berührt, heilige Kräfte verleihen.
plants.starflower.name=Sternblume
plants.starflower.warden_desc=Zusätzlich zum Segen erhält die Wächterin eine beträchtliche Menge an Zauberstab-Aufladung, wenn sie eine Sternenblume zertritt.
plants.stormvine$seed.name=Samen der Sturmwinde
plants.stormvine.desc=Die Schwerkraft beeinflusst die Sturmranke auf seltsame Weise, sodass ihre zarten blauen Ranken in der Luft zu schweben scheinen. Alles, was sich in der Ranke verfängt, wird davon beeinflusst und verliert die Orientierung.
plants.stormvine.name=Sturmwinde
plants.stormvine.warden_desc=Die Wächterin ist in der Lage, die Gravitationswirkung der Sturmranken zu kontrollieren und schwebt kurzzeitig, wenn sie eine zertritt.
plants.sungrass$health.desc=Sonnengras besitzt ausgezeichnete Heilkräfte, wirkt aber deutlich langsamer als ein Heiltrank. Wenn man sich von der Pflanze entfernt, wird der Heileffekt unterbrochen. Verbleibende Heilung: 0.
plants.sungrass$health.name=Kräuterheilkunde
plants.sungrass$seed.name=Samen des Sonnengrases
plants.sungrass.desc=Sonnengras ist bekannt für die langsamen, aber effektiven Heilkräfte seines Saftes.
plants.sungrass.name=Sonnengras
plants.sungrass.warden_desc=Die Wächterin kann auch dann Heilung von zertretenem Sonnengras erhalten, wenn sie sich davon entfernt.
plants.swiftthistle$seed.name=Samen der Schnelldistel
plants.swiftthistle$timebubble.desc=Eine kurze Phase beschleunigter Zeit, die es ermöglicht, Aktionen sofort auszuführen. Angriffe oder der Einsatz von Magie brechen diesen Effekt jedoch. \n\n Verbleibende Züge: %s.
plants.swiftthistle$timebubble.name=Zeitblase
plants.swiftthistle.desc=Wird die Schnelldistel zertreten, beschleunigt sie kurzzeitig den Zeitfluss um sich herum, wodurch der Zertretende mehrere Aktionen sofort ausführen kann.
plants.swiftthistle.name=Schwalbendistel
plants.swiftthistle.warden_desc=Zusätzlich zu den sofortigen Aktionen erhält der Wächter beim Zertreten von Schnelldistel auch einen kurzen Temposchub.
