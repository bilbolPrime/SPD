plants.blandfruitbush$seed.name=graines de fruits à baies
plants.blandfruitbush.desc=Cousin éloigné de la ronce, le fruit en forme de poire de l'arbuste à fruits noirs a un goût de poussière. Le fruit est grossier et peu substantiel, mais il n'est pas toxique. On peut peut-être le cuisiner.
plants.blandfruitbush.discover_hint=Vous trouverez cette plante au hasard dans le donjon.
plants.blandfruitbush.name=pamplemousse
plants.blindweed$seed.name=graine de liseron
plants.blindweed.desc=Lorsqu'elle est touchée, une herbe aveugle périt dans un flash lumineux. L'éclair est suffisamment puissant pour désorienter la personne pendant plusieurs secondes.
plants.blindweed.name=l'herbe à poux
plants.blindweed.warden_desc=le gardien canalisera l'énergie d'une herbe aveugle en un linceul temporaire d'invisibilité, au lieu d'être désorienté.
plants.earthroot$armor.desc=Une sorte d'armure naturelle et immobile faite d'écorce et de ficelle.\n\nCette armure en herbes bloque les dégâts de %d de tout coup physique, jusqu'à ce qu'elle finisse par s'épuiser et s'effondrer.\n\nComme l'armure est immobile, tout mouvement la fait se briser et se perdre.\n\nArmure restante : %d.
plants.earthroot$armor.name=armure à base de plantes
plants.earthroot$seed.name=semence de racine de terre
plants.earthroot.desc=Lorsqu'une créature touche une racine de terre, les racines créent une sorte d'armure naturelle immobile autour d'elle.
plants.earthroot.name=racine de terre
plants.earthroot.warden_desc=Les racines d'une plante de terre se déplacent avec _la gardienne_, lui fournissant une armure mobile en peau de barque.
plants.fadeleaf$seed.name=semences de feuilles mortes
plants.fadeleaf.desc=Le fait de toucher une feuille de fadeur téléporte n'importe quelle créature à un endroit aléatoire du niveau actuel.
plants.fadeleaf.name=feuille caduque
plants.fadeleaf.warden_desc=L'effet de téléportation de Fadeleaf est plus puissant pour _the Warden_, la téléportant à la fin du niveau précédent du donjon.
plants.firebloom$seed.name=graines de fleurs de feu
plants.firebloom.desc=Lorsque quelque chose touche une fleur de feu, elle s'enflamme.
plants.firebloom.name=fleur de feu
plants.firebloom.warden_desc=Lorsqu'elle piétine une fleur de feu, _la gardienne_ est brièvement imprégnée de flammes au lieu d'être blessée.
plants.icecap$seed.name=graine de calotte glaciaire
plants.icecap.desc=Lorsqu'on la touche, une calotte glaciaire laisse échapper une bouffée de pollen glacé. L'effet de congélation est beaucoup plus fort si l'environnement est humide.
plants.icecap.name=calotte glaciaire
plants.icecap.warden_desc=Lorsqu'elle piétine une calotte glaciaire, _la gardienne_ est brièvement imprégnée de givre au lieu d'être blessée.
plants.mageroyal$seed.name=semence de mageroyal
plants.mageroyal.desc=Les fleurs piquantes du mageroyal contiennent une substance chimique connue pour ses propriétés de puissant agent neutralisant. Tout ce qui marche dans cette plante sera nettoyé de nombreux effets négatifs.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Vous vous sentez rafraîchi.
plants.mageroyal.warden_desc=En plus de l'effet de neutralisation, _le gardien_ devient temporairement immunisé contre tous les effets liés à la zone lorsqu'il marche sur le mageroyal.
plants.plant$seed$placeholder.name=semences
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Lancez cette graine à l'endroit où vous voulez faire pousser une plante.\n\n%s
plants.plant$seed.seed_of=graine de %s
plants.plant.discover_hint=Vous pouvez trouver cette plante au hasard dans le donjon, ou la faire pousser à partir de la graine qui lui est associée.
plants.plant.warden_desc=Cette plante n'a pas d'effet spécial lorsqu'elle est utilisée par le gardien.
plants.rotberry$seed.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
plants.rotberry$seed.name=graines de ronce
plants.rotberry.desc=Les baies d'un jeune arbrisseau ont un goût de mort douce et sucrée. Au bout de quelques années, cet arbuste se transformera en un autre cœur pourri. Lorsqu'il est piétiné, le jeune arbuste produit une petite bouffée de gaz toxique.
plants.rotberry.discover_hint=Vous pouvez faire pousser cette plante à partir de la graine qui lui est associée lors d'une quête spécifique.
plants.rotberry.name=myrtille
plants.rotberry.warden_desc=Normalement, un buisson de ronces ne produit qu'un peu de gaz lorsqu'il est piétiné, mais _la gardienne_ est capable d'en tirer de l'énergie pour augmenter temporairement sa force !
plants.sorrowmoss$seed.name=graine de mousse de chagrin
plants.sorrowmoss.desc=Le chagrin d'amour est une fleur (et non une mousse) aux pétales tranchants comme des lames de rasoir, enduits d'un venin mortel.
plants.sorrowmoss.name=mousse de chagrin
plants.sorrowmoss.warden_desc=Lorsqu'elle piétine une mousse de chagrin, _la gardienne_ est brièvement imprégnée de toxine au lieu d'être blessée.
plants.starflower$seed.name=graine d'étoile de mer
plants.starflower.desc=Plante rare, la fleur d'étoile est réputée conférer un pouvoir sacré à celui qui la touche.
plants.starflower.name=fleur d'étoile
plants.starflower.warden_desc=En plus d'être bénie, _la gardienne_ gagne une quantité significative de recharge de baguette lorsqu'elle piétine une fleur d'étoile.
plants.stormvine$seed.name=graine de vigne-tempête
plants.stormvine.desc=La gravité affecte étrangement la plante de la vigne-tempête, permettant à ses vrilles bleues vaporeuses de "s'accrocher" à l'air. Tout ce qui est pris dans la vigne est affecté par ce phénomène et devient désorienté.
plants.stormvine.name=vigne d'orage
plants.stormvine.warden_desc=la gardienne est capable de contrôler l'effet gravitationnel des plantes orageuses et lévite brièvement lorsqu'elle en piétine une.
plants.sungrass$health.desc=L'herbe de soleil possède d'excellentes propriétés curatives, bien qu'elle soit beaucoup plus lente qu'une potion de guérison.\n\nSi vous vous éloignez de la plante, l'effet de guérison sera interrompu.\n\nGuérison restante : %d.
plants.sungrass$health.name=la guérison par les plantes
plants.sungrass$seed.name=semences de pâturin
plants.sungrass.desc=Le Sungrass est réputé pour les propriétés curatives lentes mais efficaces de sa sève.
plants.sungrass.name=herbe de soleil
plants.sungrass.warden_desc=la gardienne peut recevoir des soins de l'herbe solaire piétinée même si elle s'en éloigne.
plants.swiftthistle$seed.name=semences de martinets
plants.swiftthistle$timebubble.desc=Une petite bulle de temps accéléré, permettant d'effectuer des actions instantanément. L'attaque ou l'utilisation de la magie interrompt cet effet.\n\nTours restants : %s.
plants.swiftthistle$timebubble.name=bulle de temps
plants.swiftthistle.desc=Lorsqu'il est piétiné, le chardon rapide accélère brièvement le cours du temps autour de lui, ce qui permet au piétineur d'effectuer plusieurs actions instantanément.
plants.swiftthistle.name=chardon vert
plants.swiftthistle.warden_desc=En plus d'obtenir des actions instantanées, _le gardien_ bénéficie également d'une brève augmentation de la hâte lorsqu'il piétine des chardons.
