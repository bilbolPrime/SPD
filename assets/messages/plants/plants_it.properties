plants.blandfruitbush$seed.name=seme di frutto insipido
plants.blandfruitbush.desc=Lontano parente del rovo marcio, il frutto a forma di pera dell'arbusto del frutto insipido ha il sapore di polvere rappresa. Il frutto è disgustoso e inconsistente, ma non è velenoso. Forse si potrebbe cucinare.
plants.blandfruitbush.discover_hint=Puoi trovare questa pianta in modo casuale nel dungeon.
plants.blandfruitbush.name=frutto insipido
plants.blindweed$seed.name=seme di erba cieca
plants.blindweed.desc=Al solo tocco, una pianta di Acantonia muore in un lampo di luce intensa. Il lampo è abbastanza forte da disorientare per diversi secondi.
plants.blindweed.name=erba cieca
plants.blindweed.warden_desc=_Il Guardiano_ incanalerà l'energia di una pianta infestante in un velo temporaneo di invisibilità, invece di esserne disorientato.
plants.earthroot$armor.desc=Una sorta di armatura naturale e immobile fatta di corteccia e spago.\n\nQuesta armatura a base di erbe bloccherà %d danni da qualsiasi colpo fisico, finché alla fine non si esaurirà e crollerà.\n\nPoiché l'armatura è immobile, muovendola si romperà e andrà persa.\n\nArmatura rimanente: %d.
plants.earthroot$armor.name=armatura di erbe
plants.earthroot$seed.name=seme di radice
plants.earthroot.desc=Quando una creatura tocca una radice terrestre, le sue radici creano attorno ad essa una sorta di armatura naturale immobile.
plants.earthroot.name=radice terrestre
plants.earthroot.warden_desc=Le radici di una pianta terricola si muoveranno con la Guardiana, fornendole un'armatura mobile di corteccia.
plants.fadeleaf$seed.name=seme di faggio
plants.fadeleaf.desc=Toccando una foglia sbiadita, qualsiasi creatura verrà teletrasportata in un punto casuale del livello corrente.
plants.fadeleaf.name=foglia appassita
plants.fadeleaf.warden_desc=L'effetto di teletrasporto di Fadeleaf è più potente per _la Guardiana_, teletrasportandola alla fine del livello precedente del dungeon.
plants.firebloom$seed.name=seme di fiore di fuoco
plants.firebloom.desc=Quando qualcosa tocca un fiore di fuoco, prende fuoco.
plants.firebloom.name=fiore di fuoco
plants.firebloom.warden_desc=Quando calpesta un fiore di fuoco, la Guardiana verrà brevemente avvolta dalle fiamme invece di subire danni.
plants.icecap$seed.name=seme della calotta glaciale
plants.icecap.desc=Al solo contatto, una calotta glaciale rilascia una nuvola di polline ghiacciato. L'effetto congelante è molto più intenso se l'ambiente è umido.
plants.icecap.name=calotta glaciale
plants.icecap.warden_desc=Quando calpesta una calotta glaciale, la Guardiana verrà brevemente avvolta dal gelo invece di subire danni.
plants.mageroyal$seed.name=seme del mago reale
plants.mageroyal.desc=I fiori spinosi della Mageroyal contengono una sostanza chimica nota per le sue potenti proprietà neutralizzanti. Chiunque entri in contatto con questa pianta verrà purificato da molti effetti negativi.
plants.mageroyal.name=mago reale
plants.mageroyal.refreshed=Ti senti rigenerato.
plants.mageroyal.warden_desc=Oltre all'effetto neutralizzante, _il Guardiano_ diventerà temporaneamente immune a tutti gli effetti ad area quando calpesta un mago reale.
plants.plant$seed$placeholder.name=seme
plants.plant$seed.ac_plant=PIANTA
plants.plant$seed.info=Getta questo seme nel luogo in cui vuoi far crescere una pianta.\n\n%s
plants.plant$seed.seed_of=seme di %s
plants.plant.discover_hint=È possibile trovare questa pianta casualmente nel dungeon, oppure coltivarla a partire dal suo seme.
plants.plant.warden_desc=Questa pianta non ha alcun effetto speciale se usata dal Guardiano.
plants.rotberry$seed.discover_hint=Puoi trovare questo oggetto durante una missione specifica.
plants.rotberry$seed.name=seme di marcescenza
plants.rotberry.desc=Le bacche di un giovane cespuglio di rovo marcio hanno un sapore dolciastro, di morte. Nel giro di qualche anno, questo cespuglio di rovo marcio si trasformerà in un altro cuore marcio. Se calpestato, un giovane rovo marcio produrrà una piccola nuvola di gas tossico.
plants.rotberry.discover_hint=È possibile coltivare questa pianta a partire dal suo seme durante una specifica missione.
plants.rotberry.name=roti
plants.rotberry.warden_desc=Normalmente un cespuglio di rovi produce solo una piccola quantità di gas quando viene calpestato, ma _la Guardiana_ è in grado di sfruttare la sua energia per aumentare temporaneamente la sua forza!
plants.sorrowmoss$seed.name=seme di muschio triste
plants.sorrowmoss.desc=Il muschio triste è un fiore (non un muschio) con petali affilati come rasoi, ricoperti da un veleno mortale.
plants.sorrowmoss.name=muschio triste
plants.sorrowmoss.warden_desc=Quando calpesta un muschio triste, _la Guardiana_ verrà brevemente intossicata invece di subire danni.
plants.starflower$seed.name=seme di stella
plants.starflower.desc=La stella di Natale è una pianta rara, a cui si attribuisce il potere sacro di conferire a chiunque la tocchi.
plants.starflower.name=fiore stella
plants.starflower.warden_desc=Oltre a essere benedetta, la Guardiana otterrà una notevole quantità di ricarica della bacchetta quando calpesta un fiore stellare.
plants.stormvine$seed.name=seme di vite delle tempeste
plants.stormvine.desc=La gravità influenza in modo strano la pianta rampicante, permettendo ai suoi sottili viticci blu di "sospendersi" nell'aria. Qualsiasi cosa rimanga impigliata nel rampicante ne risente e si disorienta.
plants.stormvine.name=vite della tempesta
plants.stormvine.warden_desc=La Guardiana è in grado di controllare l'effetto gravitazionale delle liane della tempesta e levita brevemente quando ne calpesta una.
plants.sungrass$health.desc=L'erba solare possiede eccellenti proprietà curative, sebbene sia molto più lenta di una pozione curativa. Allontanarsi dalla pianta interromperà l'effetto curativo. Guarigione rimanente: %d.
plants.sungrass$health.name=fitoterapia
plants.sungrass$seed.name=seme di erba solare
plants.sungrass.desc=La pianta di Sungrass è rinomata per le proprietà curative, lente ma efficaci, della sua linfa.
plants.sungrass.name=erba medica
plants.sungrass.warden_desc=La Guardiana può ricevere cure dall'erba solare calpestata anche se si allontana da essa.
plants.swiftthistle$seed.name=seme di cardo
plants.swiftthistle$timebubble.desc=Una piccola bolla di tempo accelerato, che permette di eseguire azioni istantaneamente. Attaccare o usare la magia interromperà questo effetto.\n\nTurni rimanenti: %s.
plants.swiftthistle$timebubble.name=bolla temporale
plants.swiftthistle.desc=Quando viene calpestato, il cardo selvatico accelera brevemente lo scorrere del tempo intorno a sé, permettendo a chi lo calpesta di compiere diverse azioni all'istante.
plants.swiftthistle.name=cardo
plants.swiftthistle.warden_desc=Oltre a ottenere azioni istantanee, il Guardiano otterrà anche un breve aumento di velocità quando calpesta il cardo.
