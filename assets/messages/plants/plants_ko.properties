plants.blandfruitbush$seed.name=블랜드프루트 씨앗
plants.blandfruitbush.desc=썩은딸기의 먼 친척인 블랜드프루트 관목의 배 모양 열매는 굳은 먼지 같은 맛이 난다. 이 열매는 징그럽고 싱겁지만 독성은 없다. 어쩌면 요리해서 먹을 수도 있을 것이다.
plants.blandfruitbush.discover_hint=이 식물은 던전에서 무작위로 발견할 수 있습니다.
plants.blandfruitbush.name=밍밍한 과일
plants.blindweed$seed.name=눈풀 씨앗
plants.blindweed.desc=장님풀은 만지면 밝은 섬광과 함께 죽어 버립니다. 그 섬광은 몇 초 동안 방향 감각을 잃게 할 정도로 강렬합니다.
plants.blindweed.name=눈풀
plants.blindweed.warden_desc=_워든_은 방향 감각을 잃는 대신, 눈먼 잡초의 에너지를 일시적인 투명 장막으로 전환할 것입니다.
plants.earthroot$armor.desc=나무껍질과 끈으로 만든 일종의 천연 고정 갑옷입니다. 이 약초 갑옷은 내구도가 다해 부서질 때까지 모든 물리적 공격을 막아줍니다. 갑옷은 고정되어 있으므로 움직이면 부서져 사라집니다. 남은 갑옷: 1개
plants.earthroot$armor.name=허브 갑옷
plants.earthroot$seed.name=땅뿌리의 씨앗
plants.earthroot.desc=생물이 땅뿌리에 닿으면, 그 뿌리는 생물 주위에 움직일 수 없는 천연 갑옷과 같은 것을 만들어냅니다.
plants.earthroot.name=지구뿌리
plants.earthroot.warden_desc=흙뿌리 식물의 뿌리는 수호자와 함께 움직이며, 그녀에게 이동 가능한 나무껍질 갑옷을 제공합니다.
plants.fadeleaf$seed.name=페이드리프 씨앗
plants.fadeleaf.desc=페이드리프를 만지면 모든 생명체가 현재 레벨의 임의의 장소로 순간 이동합니다.
plants.fadeleaf.name=페이드리프
plants.fadeleaf.warden_desc=페이드리프의 순간 이동 효과는 워든에게 더욱 강력하여, 그녀를 이전 던전 레벨의 끝으로 순간 이동시킵니다.
plants.firebloom$seed.name=불꽃꽃의 씨앗
plants.firebloom.desc=불꽃꽃에 무언가가 닿으면, 그것은 순식간에 불길에 휩싸입니다.
plants.firebloom.name=불꽃꽃
plants.firebloom.warden_desc=그녀가 불꽃꽃을 밟으면, 수호자는 다치는 대신 잠시 불꽃에 휩싸이게 됩니다.
plants.icecap$seed.name=빙모의 씨앗
plants.icecap.desc=빙하를 만지면 얼어붙은 꽃가루가 뿜어져 나옵니다. 주변이 습할수록 얼어붙는 효과는 훨씬 강해집니다.
plants.icecap.name=만년설
plants.icecap.warden_desc=그녀가 빙모를 밟으면, 감시자는 다치는 대신 잠시 동안 서리에 휩싸이게 됩니다.
plants.mageroyal$seed.name=마게로얄의 씨앗
plants.mageroyal.desc=마게로얄의 가시 돋친 꽃에는 강력한 중화 작용을 하는 화학 물질이 함유되어 있습니다. 이 식물을 밟는 것은 무엇이든 여러 가지 부정적인 영향에서 정화될 것입니다.
plants.mageroyal.name=마게로얄
plants.mageroyal.refreshed=상쾌한 기분이 듭니다.
plants.mageroyal.warden_desc=중화 효과 외에도, 워든은 마게로얄을 밟으면 모든 지역 한정 효과에 일시적으로 면역이 됩니다.
plants.plant$seed$placeholder.name=씨앗
plants.plant$seed.ac_plant=식물
plants.plant$seed.info=이 씨앗을 식물을 키우고 싶은 곳에 던지세요.\n\n%s
plants.plant$seed.seed_of=%s의 시드
plants.plant.discover_hint=이 식물은 던전에서 무작위로 발견할 수도 있고, 해당 씨앗을 이용해 재배할 수도 있습니다.
plants.plant.warden_desc=이 식물은 교도관이 사용해도 특별한 효과가 없습니다.
plants.rotberry$seed.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
plants.rotberry$seed.name=로트베리 씨앗
plants.rotberry.desc=어린 썩은딸기 관목의 열매는 달콤한 죽음의 맛이 납니다. 몇 년에 걸쳐 이 썩은딸기 관목은 또 다른 썩은 심장으로 자라납니다. 어린 썩은딸기를 밟으면 독성 가스가 조금씩 나옵니다.
plants.rotberry.discover_hint=특정 퀘스트를 진행하는 동안 해당 식물과 관련된 씨앗에서 이 식물을 키울 수 있습니다.
plants.rotberry.name=로트베리
plants.rotberry.warden_desc=일반적으로 썩은딸기 덤불은 밟혔을 때 약간의 가스만 발생시키지만, _워든_은 그 가스에서 에너지를 얻어 일시적으로 힘을 증폭시킬 수 있습니다!
plants.sorrowmoss$seed.name=슬픔이끼의 씨앗
plants.sorrowmoss.desc=슬픔이끼는 이끼가 아니라 꽃으로, 면도날처럼 날카로운 꽃잎에 치명적인 독이 덮여 있습니다.
plants.sorrowmoss.name=슬픔이끼
plants.sorrowmoss.warden_desc=그녀가 슬픔이끼를 밟으면, 간수는 해를 입는 대신 잠시 독소에 오염될 뿐이다.
plants.starflower$seed.name=별꽃 씨앗
plants.starflower.desc=희귀한 식물인 별꽃은 만지는 사람에게 신성한 힘을 부여한다고 전해진다.
plants.starflower.name=별꽃
plants.starflower.warden_desc=워든은 축복을 받는 것 외에도 별꽃을 밟으면 지팡이 충전량이 상당량 증가합니다.
plants.stormvine$seed.name=폭풍덩굴의 씨앗
plants.stormvine.desc=중력은 폭풍덩굴 식물에 기묘한 영향을 미쳐, 가느다란 푸른 덩굴손이 공중에 '매달려' 있게 만듭니다. 덩굴에 걸린 것은 무엇이든 이 현상의 영향을 받아 방향 감각을 잃게 됩니다.
plants.stormvine.name=스톰바인
plants.stormvine.warden_desc=워든은 스톰바인의 중력 효과를 조절할 수 있으며, 스톰바인을 밟으면 잠시 공중에 떠오릅니다.
plants.sungrass$health.desc=선그래스는 뛰어난 치유력을 지니고 있지만, 회복 물약보다 효과가 훨씬 느립니다. 식물에서 벗어나면 치유 효과가 사라집니다. 남은 치유량:
plants.sungrass$health.name=약초 요법
plants.sungrass$seed.name=썬그래스 씨앗
plants.sungrass.desc=썬그래스는 수액이 느리지만 효과적인 치유 효능을 지닌 것으로 유명합니다.
plants.sungrass.name=선그래스
plants.sungrass.warden_desc=워든은 밟힌 햇살풀에서 멀리 떨어져 있어도 치유 효과를 받을 수 있습니다.
plants.swiftthistle$seed.name=엉겅퀴 씨앗
plants.swiftthistle$timebubble.desc=시간이 가속되는 작은 거품이 생겨 행동을 즉시 수행할 수 있습니다. 단, 공격하거나 마법을 사용하면 이 효과가 사라집니다. 남은 턴: \n\n ...
plants.swiftthistle$timebubble.name=시간 거품
plants.swiftthistle.desc=엉겅퀴를 밟으면 주변의 시간이 잠시 빨라져 밟은 사람이 여러 가지 행동을 순식간에 수행할 수 있게 됩니다.
plants.swiftthistle.name=재빠른엉겅퀴
plants.swiftthistle.warden_desc=즉시 행동할 수 있는 능력을 얻는 것 외에도, 워든은 재빠른 엉겅퀴를 밟을 때 잠시 동안 가속 효과를 얻습니다.
