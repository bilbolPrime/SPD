plants.blandfruitbush$seed.name=semeno nevýrazného ovoce
plants.blandfruitbush.desc=Vzdálený příbuzný hniloby, hruškovitý plod nevýrazného keře, chutná jako slepený prach. Plody jsou nechutné a nehmotné, ale nejsou jedovaté. Možná by se daly uvařit.
plants.blandfruitbush.discover_hint=Tuto rostlinu můžete náhodně najít v podzemí.
plants.blandfruitbush.name=nevýrazné ovoce
plants.blindweed$seed.name=semeno slepice
plants.blindweed.desc=Po dotyku slepice zahyne v jasném záblesku světla. Záblesk je dostatečně silný, aby na několik sekund dezorientoval.
plants.blindweed.name=slepice
plants.blindweed.warden_desc=_Strážce_ nasměruje energii slepce do dočasného rubáše neviditelnosti, místo aby byl dezorientován.
plants.earthroot$armor.desc=Druh přírodního, nepohyblivého brnění vyrobeného z kůry a provázku.\n\nToto bylinné brnění blokuje %d poškození z jakéhokoli fyzického zásahu, dokud mu nakonec nedojde odolnost a nezhroutí se.\n\nPokud je brnění nepohyblivé, pohyb způsobí jeho rozpad a ztrátu.\n\nZbývající brnění: %d.
plants.earthroot$armor.name=bylinné brnění
plants.earthroot$seed.name=semeno zemního kořene
plants.earthroot.desc=Když se nějaký tvor dotkne zemského kořene, jeho kořeny kolem něj vytvoří jakýsi nehybný přirozený pancíř.
plants.earthroot.name=zemní kořen
plants.earthroot.warden_desc=Kořeny rostliny zemního kořene se budou pohybovat se _Strážkyní_ a poskytnou jí mobilní brnění z kůry.
plants.fadeleaf$seed.name=semeno bledého listu
plants.fadeleaf.desc=Dotyk bledého listu teleportuje libovolného tvora na náhodné místo na aktuální úrovni.
plants.fadeleaf.name=bledý list
plants.fadeleaf.warden_desc=Teleportační efekt Fadeleaf je pro _Strážkyni_ silnější a teleportuje ji zpět na konec předchozí úrovně dungeonu.
plants.firebloom$seed.name=semeno ohnivého květu
plants.firebloom.desc=Když se něco dotkne ohnivého květu, vzplane.
plants.firebloom.name=ohnivý květ
plants.firebloom.warden_desc=Když ušlape ohnivý květ, _Strážkyně_ bude na chvíli naplněna plamenem, místo aby jí bylo zraněno.
plants.icecap$seed.name=semeno ledové čepičky
plants.icecap.desc=Při dotyku ledová čepička vypustí obláček mrznoucího pylu. Ledový účinek je mnohem silnější, pokud je prostředí vlhké.
plants.icecap.name=ledová čepička
plants.icecap.warden_desc=Když pošlape ledovou čepičku, _Strážkyně_ bude na chvíli naplněna mrazem, místo aby jí bylo zraněno.
plants.mageroyal$seed.name=semeno mageroyalu
plants.mageroyal.desc=Pichlavé květy mageroyalu obsahují chemickou látku, která je známá svými vlastnostmi jako silný neutralizační činidlo. Všechno, co vstoupí na tuto rostlinu, bude očištěno od mnoha negativních účinků.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Cítíte se osvěžení.
plants.mageroyal.warden_desc=Kromě neutralizačního efektu se _Strážce_ při šlápnutí na mageroyala dočasně stane imunním vůči všem efektům vázaným na oblast.
plants.plant$seed$placeholder.name=semínko
plants.plant$seed.ac_plant=ROSTLINA
plants.plant$seed.info=Hoďte toto semínko na místo, kde chcete pěstovat rostlinu. \n\n%s
plants.plant$seed.seed_of=semeno %s
plants.plant.discover_hint=Tuto rostlinu můžete najít náhodně v podzemí nebo ji vypěstovat z jejího přidruženého semínka.
plants.plant.warden_desc=Tato rostlina nemá žádný zvláštní účinek, když ji používá Strážce.
plants.rotberry$seed.discover_hint=Tuto položku najdete během konkrétního úkolu.
plants.rotberry$seed.name=semeno hniloby
plants.rotberry.desc=Bobule mladého keře hniloby chutnají jako sladká, sladká smrt. Během několika let se z tohoto keře hniloby rozroste další hniloba. Když se mladá hniloba ušlape, vydá malý obláček toxického plynu.
plants.rotberry.discover_hint=Tuto rostlinu můžete vypěstovat z jejího přidruženého semínka během konkrétního úkolu.
plants.rotberry.name=hniloba
plants.rotberry.warden_desc=Hniloba obvykle při sešlapávání produkuje jen trochu plynu, ale _Strážkyně_ dokáže z ní získat energii k dočasnému zvýšení své síly!
plants.sorrowmoss$seed.name=semeno smutného mechu
plants.sorrowmoss.desc=Bolestný mech je květina (ne mech) s ostrými okvětními lístky, potaženými smrtícím jedem.
plants.sorrowmoss.name=smutný mech
plants.sorrowmoss.warden_desc=Když pošlape mech smutku, _Strážkyně_ bude na chvíli naplněna toxinem, místo aby jí bylo zraněno.
plants.starflower$seed.name=semeno hvězdnice
plants.starflower.desc=Vzácná rostlina, hvězdnice, údajně uděluje svatou moc každému, kdo se jí dotkne.
plants.starflower.name=hvězdnice
plants.starflower.warden_desc=Kromě požehnání získá _Strážkyně_ značné množství energie na dobití hůlky, když ušlape hvězdnici.
plants.stormvine$seed.name=semeno bouřlivé révy
plants.stormvine.desc=Gravitace ovlivňuje rostlinu bouřkové révy podivně a umožňuje jejím šedivým modrým úponkům „viset“ ve vzduchu. Všechno, co se zachytí na révě, je tímto ovlivněno a stává se dezorientovaným.
plants.stormvine.name=bouřková réva
plants.stormvine.warden_desc=_Strážkyně_ dokáže ovládat gravitační účinek bouřkové révy a krátce levituje, když na jednu ušlape.
plants.sungrass$health.desc=Sluneční tráva má vynikající léčivé vlastnosti, i když je mnohem pomalejší než léčivý lektvar.\n\nPohybem z rostliny se léčivý účinek přeruší.\n\nZbývající léčba: %d.
plants.sungrass$health.name=bylinné léčení
plants.sungrass$seed.name=semínko slunečnice
plants.sungrass.desc=Slunečnicová tráva je známá pro své pomalé, ale účinné léčivé vlastnosti.
plants.sungrass.name=slunečnice
plants.sungrass.warden_desc=_Strážkyně_ se může uzdravit ze sešlapané sluneční trávy, i když se od ní vzdálí.
plants.swiftthistle$seed.name=semeno pcháčce
plants.swiftthistle$timebubble.desc=Malá bublina zrychleného času, která umožňuje okamžité provádění akcí. Útok nebo použití magie však tento efekt přeruší. \n\nZbývající tahy: %s.
plants.swiftthistle$timebubble.name=časová bublina
plants.swiftthistle.desc=Když je šlapán, rychlý bodlák krátce zrychlí tok času kolem sebe, což mu umožní okamžitě provést několik akcí.
plants.swiftthistle.name=bodlák
plants.swiftthistle.warden_desc=Kromě okamžitých akcí získá _Strážce_ také krátké zvýšení rychlosti, když pošlape rychlý bodlák.
