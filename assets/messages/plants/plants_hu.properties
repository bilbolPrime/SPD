plants.blandfruitbush$seed.name=ízetlen gyümölcs magja
plants.blandfruitbush.desc=A rothadó szeder távoli unokatestvére, a kókuszdiófélék körte alakú termése íze olyan, mint a rászáradt por. A gyümölcs undorító és törékeny, de nem mérgező. Talán meg lehetne főzni.
plants.blandfruitbush.discover_hint=Ezt a növényt véletlenszerűen találhatod meg a kazamatában.
plants.blandfruitbush.name=ízetlen gyümölcs
plants.blindweed$seed.name=vakfű magja
plants.blindweed.desc=Érintésre a füvet egy erős fényvillanás kíséretében elpusztul. A villanás elég erős ahhoz, hogy néhány másodpercre eltévesztse az embert.
plants.blindweed.name=vakfű
plants.blindweed.warden_desc=_Az Őrző_ a vakfű energiáját egy ideiglenes láthatatlansági fátyolba tereli, ahelyett, hogy dezorientálná.
plants.earthroot$armor.desc=Egyfajta természetes, mozdulatlan páncél, fakéregből és zsinegből.\n\nEz a gyógynövényes páncél blokkolja a %d bármilyen fizikai ütésből származó sebzést, amíg végül el nem veszíti a tartósságát és össze nem omlik.\n\nMivel a páncél mozdulatlan, a mozgás szétesését és elvesztését okozza.\n\nMegmaradt páncél: %d.
plants.earthroot$armor.name=gyógynövényes páncél
plants.earthroot$seed.name=földgyökér magja
plants.earthroot.desc=Amikor egy élőlény megérint egy földgyökeret, a gyökerei egyfajta mozdulatlan természetes páncélt hoznak létre körülötte.
plants.earthroot.name=földgyökér
plants.earthroot.warden_desc=Egy földgyökér növény gyökerei együtt mozognak _az Őrzővel_, biztosítva számára a mozgó kéregbőr páncélt.
plants.fadeleaf$seed.name=fadeleaf mag
plants.fadeleaf.desc=Egy fadeleaf megérintése bármelyik lényt egy véletlenszerű helyre teleportálja az aktuális szinten.
plants.fadeleaf.name=fakult levél
plants.fadeleaf.warden_desc=A fadeleaf teleportációs hatása erősebb _az Őrző_ számára, visszateleportálva őt az előző kazamata szint végére.
plants.firebloom$seed.name=tűzvirág magja
plants.firebloom.desc=Amikor valami hozzáér egy tűzvirághoz, lángra lobban.
plants.firebloom.name=tűzvirágzás
plants.firebloom.warden_desc=Amikor eltapos egy tűzvirágot, _az Őrző_ rövid időre lángba borul ahelyett, hogy megsérülne.
plants.icecap$seed.name=jégsapka magja
plants.icecap.desc=Érintésre a jégsapka fagyos pollenfelhőt ereszt ki. A fagyás hatása sokkal erősebb, ha a környezet nedves.
plants.icecap.name=jégsapka
plants.icecap.warden_desc=Amikor eltapos egy jégsapkát, _az Őrző_ rövid időre dérrel lesz átitatva ahelyett, hogy megsérülne.
plants.mageroyal$seed.name=mageroyal magja
plants.mageroyal.desc=A mageroyal szúrós virágai egy olyan vegyi anyagot tartalmaznak, amely erős semlegesítő hatásáról ismert. Bármi, ami belép ebbe a növénybe, megtisztul számos negatív hatástól.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Felfrissültnek érzed magad.
plants.mageroyal.warden_desc=A semlegesítő hatás mellett _az Őrző_ ideiglenesen immunissá válik minden területhez kötött hatással szemben, amikor mageroyalra lép.
plants.plant$seed$placeholder.name=mag
plants.plant$seed.ac_plant=NÖVÉNY
plants.plant$seed.info=Dobd el ezt a magot oda, ahol növényt szeretnél nevelni.\n\n%s
plants.plant$seed.seed_of=%s magja
plants.plant.discover_hint=Ezt a növényt véletlenszerűen megtalálhatod a kazamatában, vagy a hozzá tartozó magból is termesztheted.
plants.plant.warden_desc=Ennek a növénynek nincs különleges hatása, amikor az őr használja.
plants.rotberry$seed.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
plants.rotberry$seed.name=rotberry mag
plants.rotberry.desc=Egy fiatal rothadóbogyó bogyói édes, édes halál ízűek. Néhány év alatt ez a rothadóbogyó egy újabb rothadómaggá nő. Ha letapossák, a fiatal rothadóbogyó egy kis mérgező gázfelhőt termel.
plants.rotberry.discover_hint=Ezt a növényt a hozzá tartozó magból termesztheted egy adott küldetés során.
plants.rotberry.name=rothadóbogyó
plants.rotberry.warden_desc=Egy rothadó bogyós bokor általában csak kevés gázt termel, ha letapossák, de _az Őrző_ képes energiát nyerni belőle, hogy ideiglenesen növelje az erejét!
plants.sorrowmoss$seed.name=bánatmoha magja
plants.sorrowmoss.desc=A bánatmoha egy virág (nem moha), borotvaéles szirmokkal, amelyeket halálos méreg borít.
plants.sorrowmoss.name=bánatmoha
plants.sorrowmoss.warden_desc=Amikor eltapos egy bánati mohát, _az Őrző_ rövid időre méreggel lesz átitatva ahelyett, hogy megsérülne.
plants.starflower$seed.name=csillagvirág magja
plants.starflower.desc=A ritka növény, a csillagvirág állítólag szent erőt ad annak, aki megérinti.
plants.starflower.name=csillagvirág
plants.starflower.warden_desc=Az áldás mellett _az Őrző_ jelentős mennyiségű pálcátöltetet kap, amikor eltapos egy csillagvirágot.
plants.stormvine$seed.name=viharnövény magja
plants.stormvine.desc=A gravitáció furcsán hat a viharkárpa növényre, lehetővé téve, hogy vékony kék indái a levegőben „lógjanak”. Bármi, ami a növénybe akad, megtörténik ettől, és dezorientálttá válik.
plants.stormvine.name=viharvíz
plants.stormvine.warden_desc=_Az Őrző_ képes irányítani a viharvirág gravitációs hatását, és rövid időre lebegni, amikor eltapos egyet.
plants.sungrass$health.desc=A napfű kiváló gyógyító tulajdonságokkal rendelkezik, bár sokkal lassabb, mint egy gyógyító bájital.\n\nA növény eltávolítása megtöri a gyógyító hatást.\n\nHátralévő gyógyulás: %d.
plants.sungrass$health.name=gyógynövényes gyógyítás
plants.sungrass$seed.name=napraforgó mag
plants.sungrass.desc=A napfű nedvének lassú, de hatékony gyógyító tulajdonságairól ismert.
plants.sungrass.name=napfű
plants.sungrass.warden_desc=_Az Őrző_ gyógyulást kaphat a letaposott napfűtől, még akkor is, ha elmozdul tőle.
plants.swiftthistle$seed.name=seprűbogácsa magja
plants.swiftthistle$timebubble.desc=Egy kis, gyorsított időbuborék, amely lehetővé teszi a cselekvések azonnali végrehajtását. Támadás vagy mágia használata azonban megtöri ezt a hatást. \n\nHátralévő körök: %s.
plants.swiftthistle$timebubble.name=időbuborék
plants.swiftthistle.desc=Amikor letapossák, a gyorsbogár rövid időre felgyorsítja maga körül az idő folyását, lehetővé téve a taposó számára, hogy azonnal több műveletet is végrehajtson.
plants.swiftthistle.name=sebesbogáncs
plants.swiftthistle.warden_desc=Az azonnali akciók mellett _az Őrző_ rövid sietségnövekedést is kap, amikor eltapos egy gyorsbogáncsot.
