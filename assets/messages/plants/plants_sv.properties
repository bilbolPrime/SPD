plants.blandfruitbush$seed.name=frö av blandfrukt
plants.blandfruitbush.desc=Den päronformade frukten från blandfruktbusken, som är en avlägsen kusin till rotfrukten, smakar som kakat damm. Frukten är äcklig och obetydlig men inte giftig. Kanske skulle den kunna kokas.
plants.blandfruitbush.discover_hint=Du kan hitta den här växten slumpmässigt i fängelsehålan.
plants.blandfruitbush.name=blandfrukt
plants.blindweed$seed.name=frö av blindört
plants.blindweed.desc=Vid beröring dör en blindört i en stark ljusblixt. Blixten är tillräckligt stark för att desorientera i flera sekunder.
plants.blindweed.name=blindört
plants.blindweed.warden_desc=_Vakten_ kommer att kanalisera en blindörts energi till ett tillfälligt hölje av osynlighet, istället för att bli desorienterad.
plants.earthroot$armor.desc=En sorts naturlig, orörlig rustning gjord av bark och snöre.\n\nDenna örtrustning blockerar %d skador från fysiska träffar, tills den så småningom tar slut på hållbarhet och kollapsar.\n\nOm rustningen är orörlig kommer rörelse att få den att brytas isär och gå förlorad.\n\nÅterstående rustning: %d.
plants.earthroot$armor.name=örtrustning
plants.earthroot$seed.name=frö av jordrot
plants.earthroot.desc=När en varelse vidrör en jordrot skapar dess rötter ett slags orörligt naturligt rustning runt den.
plants.earthroot.name=jordrot
plants.earthroot.warden_desc=Rötterna på en jordrotsväxt rör sig med _Vakten_ och ger henne rörlig barkhudsrustning.
plants.fadeleaf$seed.name=frö av fadeleaf
plants.fadeleaf.desc=Att röra vid ett fadeleaf teleporterar vilken varelse som helst till en slumpmässig plats på den aktuella nivån.
plants.fadeleaf.name=fadeleaf
plants.fadeleaf.warden_desc=Teleporteringseffekten av Fadeleaf är mer potent för _Väktaren_, som teleporterar henne tillbaka till slutet av den föregående fängelsehålannivån.
plants.firebloom$seed.name=frö av eldblomning
plants.firebloom.desc=När något vidrör en eldsvåda, bryter det ut i lågor.
plants.firebloom.name=eldblomning
plants.firebloom.warden_desc=När hon trampar ner en eldsvamp kommer _Väktaren_ kortvarigt att genomsyras av lågor istället för att skadas.
plants.icecap$seed.name=frö av istäcke
plants.icecap.desc=Vid beröring släpper en istäcke ut en puff av frysande pollen. Fryseffekten är mycket starkare om miljön är våt.
plants.icecap.name=istäcke
plants.icecap.warden_desc=När hon trampar ner en istäcke kommer _Vakten_ kortvarigt att genomsyras av frost istället för att skadas.
plants.mageroyal$seed.name=frö av mageroyal
plants.mageroyal.desc=Mageroyalens taggiga blommor innehåller en kemikalie som är känd för sina egenskaper som ett starkt neutraliserande ämne. Allt som kliver på denna växt kommer att renas från många negativa effekter.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Du känner dig uppfriskad.
plants.mageroyal.warden_desc=Förutom den neutraliserande effekten blir _Vakten_ tillfälligt immun mot alla områdesbundna effekter när han/hon trampar på mageroyal.
plants.plant$seed$placeholder.name=utsäde
plants.plant$seed.ac_plant=PLANTERA
plants.plant$seed.info=Kasta detta frö till den plats där du vill odla en planta. \n\n%s
plants.plant$seed.seed_of=frö av %s
plants.plant.discover_hint=Du kan hitta den här växten slumpmässigt i fängelsehålan, eller odla den från dess tillhörande frö.
plants.plant.warden_desc=Denna växt har ingen speciell effekt när den används av fångvaktaren.
plants.rotberry$seed.discover_hint=Du kan hitta det här föremålet under ett specifikt uppdrag.
plants.rotberry$seed.name=frö av rotbär
plants.rotberry.desc=Bären på en ung rotfruktbuske smakar som söt, söt död. Under några år kommer denna rotfruktbuske att växa till ytterligare ett rotfruktshjärta. När den trampas på producerar en ung rotfrukt en liten puff av giftig gas.
plants.rotberry.discover_hint=Du kan odla den här växten från dess tillhörande frö under ett specifikt uppdrag.
plants.rotberry.name=rotbär
plants.rotberry.warden_desc=Normalt producerar en rotbärsbuske bara lite gas när den trampas på, men _Vakten_ kan utnyttja energi från den för att tillfälligt öka sin styrka!
plants.sorrowmoss$seed.name=frö av sorgmossa
plants.sorrowmoss.desc=En sorgmossa är en blomma (inte en mossa) med knivskarpa kronblad, täckta med ett dödligt gift.
plants.sorrowmoss.name=sorgmossa
plants.sorrowmoss.warden_desc=När hon trampar ner en sorgmossa kommer _Väktaren_ kortvarigt att genomsyras av gift istället för att skadas.
plants.starflower$seed.name=frö av stjärnblomma
plants.starflower.desc=Stjärnblomman, en sällsynt växt, sägs ge helig kraft till den som rör vid den.
plants.starflower.name=stjärnblomma
plants.starflower.warden_desc=Förutom att bli välsignad får _Vakten_ en betydande mängd trollstavsåterladdning när hon trampar ner en stjärnblomma.
plants.stormvine$seed.name=frö av stormvin
plants.stormvine.desc=Tyngdkraften påverkar stormrankan på ett märkligt sätt, vilket gör att dess blå rankor "hänger" i luften. Allt som fastnar i rankan påverkas av detta och blir desorienterat.
plants.stormvine.name=stormvin
plants.stormvine.warden_desc=_Vakten_ kan kontrollera stormvinens gravitationseffekt och kommer kortvarigt att sväva när hon trampar på en.
plants.sungrass$health.desc=Solgräs har utmärkta läkande egenskaper, även om det är mycket långsammare än en läkande dryck. \n\nAtt flytta bort växten kommer att bryta den läkande effekten. \n\nÅterstående läkning: %d.
plants.sungrass$health.name=örtläkning
plants.sungrass$seed.name=frö av solgräs
plants.sungrass.desc=Solgräs är känt för sina långsamma men effektiva läkande egenskaper.
plants.sungrass.name=solgräs
plants.sungrass.warden_desc=_Vakten_ kan få läkning från nedtrampat solgräs även om hon flyttar sig bort från det.
plants.swiftthistle$seed.name=frö av swiftthistle
plants.swiftthistle$timebubble.desc=En liten bubbla av accelererad tid, vilket gör att handlingar kan utföras direkt. Att attackera eller använda magi kommer dock att bryta denna effekt. \n\n Återstående tur: %s.
plants.swiftthistle$timebubble.name=tidsbubbla
plants.swiftthistle.desc=När den trampas på kommer snabbthistel kortvarigt att accelerera tidsflödet runt den, vilket gör att tramparen kan utföra flera handlingar direkt.
plants.swiftthistle.name=snabbtistel
plants.swiftthistle.warden_desc=Förutom att få omedelbara handlingar får _Vakten_ också en kort hasteboost när han trampar på snabbtistel.
