plants.blandfruitbush$seed.name=semo de blanda frukto
plants.blandfruitbush.desc=Malproksima kuzo de la putrobero, la pirforma produkto de la banalaj fruktoj gustas kiel krustiĝinta polvo. La frukto estas kruda kaj nemateria, sed ne venena. Eble ĝi povus esti kuirita.
plants.blandfruitbush.discover_hint=Vi povas trovi ĉi tiun planton hazarde en la kelkarcero.
plants.blandfruitbush.name=banala frukto
plants.blindweed$seed.name=semo de blindherbo
plants.blindweed.desc=Tuŝite, okulherbo pereas en hela ekbrilo de lumo. La ekbrilo estas sufiĉe forta por konfuzi dum pluraj sekundoj.
plants.blindweed.name=blindherbo
plants.blindweed.warden_desc=_La Gardanto_ kanaligos la energion de blindherbo en provizoran morttukon de nevidebleco, anstataŭ esti konfuzita.
plants.earthroot$armor.desc=Speco de natura, senmova kiraso farita el ŝelo kaj ŝnuro.\n\nĈi tiu herba kiraso blokos %d damaĝon de iu ajn fizika bato, ĝis ĝi fine elĉerpos sian daŭripovon kaj kolapsos.\n\nĈar la kiraso estas senmova, moviĝo kaŭzos ĝian disrompiĝon kaj perdiĝon.\n\nRestanta kiraso: %d.
plants.earthroot$armor.name=herba kiraso
plants.earthroot$seed.name=semo de terradiko
plants.earthroot.desc=Kiam estaĵo tuŝas terradikon, ĝiaj radikoj kreas specon de senmova natura kiraso ĉirkaŭ ĝi.
plants.earthroot.name=terradiko
plants.earthroot.warden_desc=La radikoj de terradika planto moviĝos kun _la Gardanto_, provizante al ŝi moveblan ŝelhaŭtan kirason.
plants.fadeleaf$seed.name=semo de fadefolio
plants.fadeleaf.desc=Tuŝi fadfolion teletransportos ajnan estaĵon al hazarda loko sur la nuna nivelo.
plants.fadeleaf.name=fadfolio
plants.fadeleaf.warden_desc=La teleporta efiko de fadfolio estas pli potenca por _la Gardisto_, teletransportante ŝin reen al la fino de la antaŭa kelkarcernivelo.
plants.firebloom$seed.name=semo de fajrofloro
plants.firebloom.desc=Kiam io tuŝas fajrofloron, ĝi eksplodas en flamojn.
plants.firebloom.name=fajroflorado
plants.firebloom.warden_desc=Kiam ŝi subtretas fajrofloron, _la Gardanto_ estos nelonge trapenetrita per flamo anstataŭ esti vundita.
plants.icecap$seed.name=semo de glacikovraĵo
plants.icecap.desc=Tuŝite, la glacikovraĵo ellasas bloveton da frostiĝanta poleno. La frostiĝa efiko estas multe pli forta se la medio estas malseka.
plants.icecap.name=glacikovraĵo
plants.icecap.warden_desc=Kiam ŝi subtretas glaĉeron, _la Gardanto_ estos nelonge trapenetrita per frosto anstataŭ esti vundita.
plants.mageroyal$seed.name=semo de mageryal
plants.mageroyal.desc=La pikaj floroj de la magerjalo enhavas kemiaĵon konatan pro siaj ecoj kiel forta neŭtraliga agento. Ĉio, kio eniras ĉi tiun planton, estos purigita de multaj negativaj efikoj.
plants.mageroyal.name=mageryal
plants.mageroyal.refreshed=Vi sentas vin refreŝigita.
plants.mageroyal.warden_desc=Aldone al la neŭtraliga efiko, _la Gardisto_ provizore fariĝos imuna kontraŭ ĉiuj areoligitaj efikoj paŝante sur mageroyal.
plants.plant$seed$placeholder.name=semo
plants.plant$seed.ac_plant=PLANTADO
plants.plant$seed.info=Ĵetu ĉi tiun semon al la loko, kie vi volas kreskigi planton. \n\n%s
plants.plant$seed.seed_of=semo de %s
plants.plant.discover_hint=Vi povas trovi ĉi tiun planton hazarde en la kelkarcero, aŭ kreskigi ĝin el ĝia rilata semo.
plants.plant.warden_desc=Ĉi tiu planto havas neniun specialan efikon kiam uzata de la Gardisto.
plants.rotberry$seed.discover_hint=Vi povas trovi ĉi tiun objekton dum specifa serĉo.
plants.rotberry$seed.name=semo de putrobero
plants.rotberry.desc=La beroj de juna putroberarbedo gustas kiel dolĉa, dolĉa morto. Post kelkaj jaroj, ĉi tiu putroberarbedo kreskos en alian putrokoron. Kiam piedpremita, juna putrobero produktos malgrandan bloveton de toksa gaso.
plants.rotberry.discover_hint=Vi povas kreskigi ĉi tiun planton el ĝia asociita semo dum specifa serĉo.
plants.rotberry.name=putrobero
plants.rotberry.warden_desc=Normale putrobera arbusto produktas nur iom da gaso kiam ĝi estas piedpremita, sed _la Gardisto_ kapablas utiligi energion de ĝi por provizore plifortigi sian forton!
plants.sorrowmoss$seed.name=semo de malĝojmusko
plants.sorrowmoss.desc=Malĝojmusko estas floro (ne musko) kun akregaj petaloj, kovritaj per mortiga veneno.
plants.sorrowmoss.name=malĝojmusko
plants.sorrowmoss.warden_desc=Kiam ŝi piedpremas malĝojmuskon, _la Gardanto_ estos nelonge trapenetrita per toksino anstataŭ esti damaĝita.
plants.starflower$seed.name=semo de stelfloro
plants.starflower.desc=Malofta planto, stelfloro laŭdire donas sanktan potencon al kiu ajn tuŝas ĝin.
plants.starflower.name=stelfloro
plants.starflower.warden_desc=Aldone al beno, _la Gardisto_ gajnos signifan kvanton da reŝargado de sia sorĉbastono kiam ŝi subtretos stelfloron.
plants.stormvine$seed.name=semo de ŝtormrebo
plants.stormvine.desc=Gravito strange influas la ŝtormvibran planton, permesante al ĝiaj ŝvelaj bluaj ĉiroj "pendi" en la aero. Ĉio kaptita en la vito estas influita de tio, kaj iĝas konfuzita.
plants.stormvine.name=ŝtormrebo
plants.stormvine.warden_desc=_La Gardano_ kapablas kontroli la gravitan efikon de ŝtormrebo, kaj nelonge ŝvebos kiam ŝi subtretas unu.
plants.sungrass$health.desc=Sunherbo posedas bonegajn resanigajn ecojn, kvankam ĝi estas multe pli malrapida ol resaniga pocio. \n\nMoviĝo de la planto rompos la resanigan efikon. \n\nResano restanta: %d.
plants.sungrass$health.name=herba resanigo
plants.sungrass$seed.name=semo de sunherbo
plants.sungrass.desc=Sunherbo estas fama pro la malrapidaj sed efikaj resanigaj ecoj de sia suko.
plants.sungrass.name=sunherbo
plants.sungrass.warden_desc=_La Gardanto_ povas ricevi resaniĝon de piedpremita sunherbo eĉ se ŝi moviĝas for de ĝi.
plants.swiftthistle$seed.name=semo de apusa kardo
plants.swiftthistle$timebubble.desc=Malgranda veziko de akcelita tempo, permesante tuj plenumi agojn. Tamen, ataki aŭ uzi magion rompos ĉi tiun efikon.\n\nRestantaj turnoj: %s.
plants.swiftthistle$timebubble.name=tempoveziko
plants.swiftthistle.desc=Kiam piedpremita, apuskardo nelonge akcelos la fluon de tempo ĉirkaŭ ĝi, permesante al la piedpremanto tuj plenumi plurajn agojn.
plants.swiftthistle.name=rapida kardo
plants.swiftthistle.warden_desc=Aldone al akiro de tujaj agoj, _la Gardanto_ ankaŭ ricevos mallongan rapidpliigon dum subpremado de rapidkardo.
