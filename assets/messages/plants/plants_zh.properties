plants.blandfruitbush$seed.name=淡果的种子
plants.blandfruitbush.desc=这种与腐烂浆果有远亲关系的植物，结出的梨形果实味道像结块的灰尘。果实口感糟糕且缺乏实质，但无毒。或许可以煮熟食用。
plants.blandfruitbush.discover_hint=这种植物有几率在地牢中随机出现。
plants.blandfruitbush.name=淡果
plants.blindweed$seed.name=盲草的种子
plants.blindweed.desc=盲草一旦被触碰，便会在一道强光中消逝。这道闪光强度足以使人眩晕数秒。
plants.blindweed.name=盲草
plants.blindweed.warden_desc=守卫者会将盲草的能量转化为暂时的隐形状态，而不是迷失方向。
plants.earthroot$armor.desc=一种由树皮和麻绳制成的天然固定盔甲。这种草药盔甲可以抵挡任何物理攻击造成的伤害，直到耐久度耗尽并最终崩解。由于盔甲无法移动，移动会导致它破碎并丢失。剩余盔甲数量：
plants.earthroot$armor.name=草本护甲
plants.earthroot$seed.name=地根种子
plants.earthroot.desc=当生物接触到土根时，土根会在生物周围形成一种不可移动的天然盔甲。
plants.earthroot.name=地根
plants.earthroot.warden_desc=土根植物的根系会随着守望者移动，为她提供可移动的树皮护甲。
plants.fadeleaf$seed.name=淡叶种子
plants.fadeleaf.desc=触碰到褪色叶会将任何生物传送到当前关卡的随机位置。
plants.fadeleaf.name=褪色叶
plants.fadeleaf.warden_desc=淡叶的传送效果对守望者来说更加强大，可以将她传送回上一层地牢的尽头。
plants.firebloom$seed.name=火花种子
plants.firebloom.desc=当物体触碰到火焰花时，就会燃起火焰。
plants.firebloom.name=火花
plants.firebloom.warden_desc=当她踩到火花时，守卫者会短暂地被火焰包裹，而不是受到伤害。
plants.icecap$seed.name=冰盖种子
plants.icecap.desc=冰盖被触碰时会释放出一团冻结的花粉。如果环境潮湿，这种冻结效果会更强。
plants.icecap.name=冰盖
plants.icecap.warden_desc=当她践踏冰盖时，守卫者会短暂地被冰霜包裹，而不是受到伤害。
plants.mageroyal$seed.name=马格罗伊尔的种子
plants.mageroyal.desc=马格罗亚尔带刺的花朵中含有一种化学物质，这种物质以其强大的中和作用而闻名。任何接触到这种植物的东西都会被清除许多负面影响。
plants.mageroyal.name=马格罗伊尔
plants.mageroyal.refreshed=你感觉神清气爽。
plants.mageroyal.warden_desc=除了中和效果外，当守卫者踩到魔法宝地时，他将暂时免疫所有区域性效果。
plants.plant$seed$placeholder.name=种子
plants.plant$seed.ac_plant=植物
plants.plant$seed.info=把这颗种子撒在你想种植物的地方。
plants.plant$seed.seed_of=%s 的种子
plants.plant.discover_hint=你可以在地牢中随机找到这种植物，或者用它的种子种植它。
plants.plant.warden_desc=这种植物对典狱长来说并没有什么特殊效果。
plants.rotberry$seed.discover_hint=你可以在特定任务中找到这件物品。
plants.rotberry$seed.name=腐烂浆果的种子
plants.rotberry.desc=幼小的腐莓灌木的果实尝起来就像甜蜜的死亡。几年后，这棵腐莓灌木会长成另一棵腐烂的树。幼小的腐莓被踩踏时，会释放出一小团有毒气体。
plants.rotberry.discover_hint=在特定任务中，你可以用对应的种子种植这种植物。
plants.rotberry.name=烂莓
plants.rotberry.warden_desc=通常情况下，腐烂浆果灌木被踩踏时只会产生少量气体，但_守卫者_能够从中汲取能量，暂时增强自己的力量！
plants.sorrowmoss$seed.name=哀苔的种子
plants.sorrowmoss.desc=哀苔是一种花（不是苔藓），它的花瓣像剃刀一样锋利，并涂有致命的毒液。
plants.sorrowmoss.name=悲伤苔藓
plants.sorrowmoss.warden_desc=当她踩到悲伤苔藓时，守卫者会短暂地被毒素浸染，而不是受到伤害。
plants.starflower$seed.name=星花种子
plants.starflower.desc=星花是一种罕见的植物，据说触摸它的人会获得神圣的力量。
plants.starflower.name=星花
plants.starflower.warden_desc=除了获得祝福之外，当守望者踩踏星花时，她还会获得大量的魔杖充能。
plants.stormvine$seed.name=暴风藤种子
plants.stormvine.desc=重力对风暴藤蔓植物的影响十分奇特，它那飘逸的蓝色卷须能够“悬挂”在空中。任何被藤蔓缠住的东西都会受到影响，变得迷失方向。
plants.stormvine.name=暴藤
plants.stormvine.warden_desc=守卫者能够控制风暴藤蔓的引力效应，当她踩到风暴藤蔓时，会短暂地悬浮起来。
plants.sungrass$health.desc=太阳草具有极佳的治疗效果，但其治疗速度远不及治疗药水。离开植物会中断治疗效果。剩余治疗量：
plants.sungrass$health.name=草药疗法
plants.sungrass$seed.name=太阳草种子
plants.sungrass.desc=太阳草因其汁液具有缓慢但有效的愈合功效而闻名。
plants.sungrass.name=太阳草
plants.sungrass.warden_desc=即使守卫者远离被践踏的太阳草，她仍然可以从中获得治疗。
plants.swiftthistle$seed.name=蓟籽
plants.swiftthistle$timebubble.desc=一个加速时间的小气泡，允许动作瞬间执行。但是攻击或使用魔法会打破这种效果。剩余回合数：\n\n。
plants.swiftthistle$timebubble.name=时间气泡
plants.swiftthistle.desc=当被践踏时，迅捷蓟会短暂地加速周围的时间流逝，使践踏者能够立即执行几个动作。
plants.swiftthistle.name=迅捷蓟
plants.swiftthistle.warden_desc=除了获得即时行动外，当践踏迅捷蓟时，守卫者还会获得短暂的加速效果。
