plants.blandfruitbush$seed.name=насіння м'якого плоду
plants.blandfruitbush.desc=Далекий родич гнильниці, грушоподібний плід куща прісної ягоди, на смак нагадує запеклу пил. Плід огидний і нещільний, але не отруйний. Можливо, його можна приготувати.
plants.blandfruitbush.discover_hint=Ви можете випадково знайти цю рослину в підземеллі.
plants.blandfruitbush.name=м'який фрукт
plants.blindweed$seed.name=насіння лаванди
plants.blindweed.desc=Якщо до неї доторкнутися, сліпа гине від яскравого спалаху світла. Спалах достатньо сильний, щоб дезорієнтувати людину на кілька секунд.
plants.blindweed.name=колючка
plants.blindweed.warden_desc=_Страж_ спрямує енергію сліпої трави в тимчасову пелену невидимості, замість того, щоб дезорієнтуватися.
plants.earthroot$armor.desc=Різновид природного, нерухомого обладунку, виготовленого з кори та шпагату.\n\nЦей трав'яний обладунок блокуватиме %d пошкодження від будь-якого фізичного удару, доки він врешті-решт не втратить міцність і не зруйнується.\n\nЯкщо обладунок нерухомий, його рух призведе до його розпаду та втрати.\n\nЗалишок обладунків: %d.
plants.earthroot$armor.name=трав'яний обладунок
plants.earthroot$seed.name=насіння земляного кореня
plants.earthroot.desc=Коли істота торкається земляного кореня, її коріння створює навколо нього своєрідний нерухомий природний панцир.
plants.earthroot.name=земляний корінь
plants.earthroot.warden_desc=Коріння рослини з земним коренем рухатиметься разом із _Вартовою_, забезпечуючи їй мобільний панцир з кори.
plants.fadeleaf$seed.name=насіння блідолистого
plants.fadeleaf.desc=Дотик до зів'ялого листа телепортує будь-яку істоту у випадкове місце на поточному рівні.
plants.fadeleaf.name=зів'яле листя
plants.fadeleaf.warden_desc=Ефект телепортації зблідлого листя потужніший для _Вартової_, телепортуючи її назад до кінця попереднього рівня підземелля.
plants.firebloom$seed.name=насіння вогняного цвіту
plants.firebloom.desc=Коли щось торкається вогняної квітки, вона спалахує полум'ям.
plants.firebloom.name=вогняне цвітіння
plants.firebloom.warden_desc=Коли вона топче вогняну квітку, _Страхова_ ненадовго охоплюється полум'ям, замість того, щоб отримати шкоду.
plants.icecap$seed.name=насіння льодовикової шапки
plants.icecap.desc=При дотику до крижаної шапки вона випускає клуби крижаного пилку. Крижаний ефект набагато сильніший, якщо середовище вологе.
plants.icecap.name=льодовиковий покрив
plants.icecap.warden_desc=Коли вона топче крижану шапку, _Страхова_ ненадовго переповнюється морозом замість того, щоб зазнати шкоди.
plants.mageroyal$seed.name=насіння магероялу
plants.mageroyal.desc=Колючі квіти магероялу містять хімічну речовину, відому своїми властивостями як сильний нейтралізуючий агент. Все, що ступить на цю рослину, очиститься від багатьох негативних наслідків.
plants.mageroyal.name=магероял
plants.mageroyal.refreshed=Ви відчуваєте себе освіженими.
plants.mageroyal.warden_desc=Окрім нейтралізуючого ефекту, _Страж_ тимчасово стане несприйнятливим до всіх ефектів, пов'язаних з областю, якщо наступити на магерояла.
plants.plant$seed$placeholder.name=насіння
plants.plant$seed.ac_plant=РОСЛИНА
plants.plant$seed.info=Киньте це насіння туди, де ви хочете виростити рослину. \n\n%s
plants.plant$seed.seed_of=насіння %s
plants.plant.discover_hint=Ви можете знайти цю рослину випадковим чином у підземеллі або виростити її з пов'язаного з нею насіння.
plants.plant.warden_desc=Ця рослина не має особливого ефекту, коли її використовує Вартовий.
plants.rotberry$seed.discover_hint=Ви можете знайти цей предмет під час виконання певного квесту.
plants.rotberry$seed.name=насіння гнильниці
plants.rotberry.desc=Ягоди молодого куща гнильниці мають смак солодкої, солодкої смерті. За кілька років цей кущ гнильниці переросте в ще одне гнильне серце. Якщо його затоптати, молода гнильниця виділятиме невелику хмару токсичного газу.
plants.rotberry.discover_hint=Ви можете виростити цю рослину з пов'язаного з нею насіння під час виконання певного квесту.
plants.rotberry.name=гниль
plants.rotberry.warden_desc=Зазвичай кущ гнилі виділяє лише трохи газу, коли його топчуть, але _Стражерка_ здатна використовувати його енергію, щоб тимчасово підвищити свою силу!
plants.sorrowmoss$seed.name=насіння скорботного моху
plants.sorrowmoss.desc=Сумний мох — це квітка (не мох) з гострими, як бритва, пелюстками, вкритими смертельною отрутою.
plants.sorrowmoss.name=сумний мох
plants.sorrowmoss.warden_desc=Коли вона топче скорботний мох, _Страхова_ ненадовго наповнюється токсином замість того, щоб зазнати шкоди.
plants.starflower$seed.name=насіння зіркоцвіту
plants.starflower.desc=Кажуть, що рідкісна рослина, зіркоцвіт, дарує святу силу тому, хто до неї доторкнеться.
plants.starflower.name=зіркоцвіт
plants.starflower.warden_desc=Окрім благословення, _Страхова_ отримає значну кількість перезарядки чарівної палички, коли затопче зіркоцвіт.
plants.stormvine$seed.name=насіння штормової лози
plants.stormvine.desc=Гравітація дивним чином впливає на рослину штормової лози, дозволяючи її шепотливим блакитним вусикам «висіти» в повітрі. Все, що зачепиться за ліану, піддається цьому впливу та втрачає орієнтацію.
plants.stormvine.name=штормова лоза
plants.stormvine.warden_desc=_Страхователька_ здатна контролювати гравітаційний ефект штормової лози та ненадовго левітує, коли топче одну з них.
plants.sungrass$health.desc=Сонячна трава має чудові цілющі властивості, хоча вона діє набагато повільніше, ніж зілля лікування.\n\nВідхід від рослини порушить цілющий ефект.\n\nЗалишок лікування: %d.
plants.sungrass$health.name=лікування травами
plants.sungrass$seed.name=насіння сонячної трави
plants.sungrass.desc=Сонячна трава відома своїми повільними, але ефективними цілющими властивостями соку.
plants.sungrass.name=сонячна трава
plants.sungrass.warden_desc=_Стражниця_ може отримати зцілення від витоптаної сонячної трави, навіть якщо вона відійде від неї.
plants.swiftthistle$seed.name=насіння осоту
plants.swiftthistle$timebubble.desc=Невелика бульбашка прискореного часу, що дозволяє виконувати дії миттєво. Однак атака або використання магії зруйнують цей ефект. \n\nХодів залишилося: %s.
plants.swiftthistle$timebubble.name=бульбашка часу
plants.swiftthistle.desc=Коли його затопчуть, швидкоголовець ненадовго прискорить плин часу навколо нього, дозволяючи топтачеві миттєво виконати кілька дій.
plants.swiftthistle.name=осот
plants.swiftthistle.warden_desc=Окрім миттєвих дій, _Страж_ також отримає короткочасне посилення швидкості, якщо затопче швидкого будяка.
