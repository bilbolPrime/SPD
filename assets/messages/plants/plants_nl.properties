plants.blandfruitbush$seed.name=zaad van de flauwe vrucht
plants.blandfruitbush.desc=De peervormige vrucht van de blandfruitstruik, een verre verwant van de rotbes, smaakt naar aangekoekt stof. De vrucht is vies en weinig substantieel, maar niet giftig. Misschien kan hij wel gekookt worden.
plants.blandfruitbush.discover_hint=Je kunt deze plant willekeurig in de kerker vinden.
plants.blandfruitbush.name=flauw fruit
plants.blindweed$seed.name=zaad van blindkruid
plants.blindweed.desc=Bij aanraking sterft een blindkruid in een felle lichtflits. De flits is zo sterk dat het enkele seconden lang desoriënteert.
plants.blindweed.name=blindkruid
plants.blindweed.warden_desc=De Bewaker zal de energie van een blindkruid kanaliseren in een tijdelijke sluier van onzichtbaarheid, in plaats van gedesoriënteerd te raken.
plants.earthroot$armor.desc=Een soort natuurlijk, onbeweeglijk pantser gemaakt van boomschors en touw. Dit kruidenpantser blokkeert schade van elke fysieke aanval, totdat de duurzaamheid opraakt en het pantser instort. Omdat het pantser onbeweeglijk is, zal het bij beweging uit elkaar vallen en verloren gaan. Resterend pantser: 1.
plants.earthroot$armor.name=kruidenpantser
plants.earthroot$seed.name=zaad van aardwortel
plants.earthroot.desc=Wanneer een dier een aardwortel aanraakt, vormen de wortels een soort onbeweeglijk, natuurlijk pantser eromheen.
plants.earthroot.name=aardewortel
plants.earthroot.warden_desc=De wortels van een aardwortelplant bewegen mee met de Bewaker, waardoor ze een beweegbaar pantser van boomschors krijgt.
plants.fadeleaf$seed.name=zaad van de verwelkingsblad
plants.fadeleaf.desc=Als je een fadeleaf aanraakt, teleporteert elk wezen naar een willekeurige plek op het huidige level.
plants.fadeleaf.name=verwelkingsblad
plants.fadeleaf.warden_desc=Het teleportatie-effect van fadeleaf is krachtiger voor _de Warden_, waardoor ze teruggeteleporteerd wordt naar het einde van het vorige kerkerlevel.
plants.firebloom$seed.name=zaad van vuurbloem
plants.firebloom.desc=Als iets een vuurbloem aanraakt, vat deze vlam.
plants.firebloom.name=vuurbloem
plants.firebloom.warden_desc=Wanneer ze een vuurbloem vertrapt, zal de Bewaker kortstondig doordrenkt raken met vlammen in plaats van gewond te raken.
plants.icecap$seed.name=zaad van ijskap
plants.icecap.desc=Bij aanraking stoot een ijskap een wolkje ijskoud stuifmeel uit. Het bevriezende effect is veel sterker als de omgeving vochtig is.
plants.icecap.name=ijskap
plants.icecap.warden_desc=Als ze over een ijskap trapt, zal de Bewaker even met ijs bedekt raken in plaats van gewond te raken.
plants.mageroyal$seed.name=zaad van koningskaars
plants.mageroyal.desc=De stekelige bloemen van de koningskaars bevatten een chemische stof die bekendstaat om zijn sterke neutraliserende werking. Alles wat in aanraking komt met deze plant, wordt van veel negatieve invloeden ontdaan.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Je voelt je verfrist.
plants.mageroyal.warden_desc=Naast het neutraliserende effect wordt de Warden tijdelijk immuun voor alle gebiedsgebonden effecten wanneer hij op mageroyal stapt.
plants.plant$seed$placeholder.name=zaad
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Gooi dit zaadje op de plek waar je een plant wilt laten groeien.\n\n%s
plants.plant$seed.seed_of=zaad van %s
plants.plant.discover_hint=Je kunt deze plant willekeurig in de kerker vinden, of hem kweken uit het bijbehorende zaadje.
plants.plant.warden_desc=Deze plant heeft geen speciaal effect wanneer hij door de bewaker wordt gebruikt.
plants.rotberry$seed.discover_hint=Je kunt dit voorwerp vinden tijdens een specifieke missie.
plants.rotberry$seed.name=zaad van rotbes
plants.rotberry.desc=De bessen van een jonge rotbesstruik smaken naar zoete, zoete dood. Na een paar jaar zal deze rotbesstruik uitgroeien tot een nieuwe rotbes. Wanneer een jonge rotbesstruik wordt vertrapt, komt er een klein wolkje giftig gas vrij.
plants.rotberry.discover_hint=Je kunt deze plant tijdens een specifieke missie uit het bijbehorende zaad kweken.
plants.rotberry.name=rotbes
plants.rotberry.warden_desc=Normaal gesproken produceert een rotbesstruik slechts een beetje gas wanneer erop getrapt wordt, maar _de Bewaker_ is in staat om de energie ervan te benutten om haar kracht tijdelijk te vergroten!
plants.sorrowmoss$seed.name=zaad van treurmos
plants.sorrowmoss.desc=Een treurmos is een bloem (geen mos) met vlijmscherpe bloemblaadjes, bedekt met een dodelijk gif.
plants.sorrowmoss.name=treurmos
plants.sorrowmoss.warden_desc=Wanneer ze op een treurmos trapt, zal de Bewaker kortstondig doordrenkt raken met gif in plaats van gewond te raken.
plants.starflower$seed.name=zaad van de sterbloem
plants.starflower.desc=De sterbloem is een zeldzame plant waarvan wordt gezegd dat ze heilige krachten verleent aan degene die haar aanraakt.
plants.starflower.name=sterbloem
plants.starflower.warden_desc=Naast de zegening ontvangt de Warden ook een aanzienlijke hoeveelheid extra energie voor haar toverstaf wanneer ze een sterrenbloem vertrapt.
plants.stormvine$seed.name=zaad van stormwijnstok
plants.stormvine.desc=De zwaartekracht heeft een vreemd effect op de stormrankplant, waardoor de ijle blauwe ranken in de lucht lijken te 'hangen'. Alles wat in de rank verstrikt raakt, wordt hierdoor beïnvloed en raakt gedesoriënteerd.
plants.stormvine.name=stormvine
plants.stormvine.warden_desc=_De Bewaker_ is in staat de zwaartekracht van stormranken te beheersen en zal kortstondig zweven wanneer ze er een vertrapt.
plants.sungrass$health.desc=Zonnegras heeft uitstekende genezende eigenschappen, hoewel het veel langzamer werkt dan een genezingsdrankje.\n\nHet verlaten van de plant verbreekt het genezende effect.\n\nResterende genezing: %d.
plants.sungrass$health.name=kruidengeneeskunde
plants.sungrass$seed.name=zaad van zonnegras
plants.sungrass.desc=Zonnegras staat bekend om de langzame maar effectieve genezende eigenschappen van het sap.
plants.sungrass.name=zonnegras
plants.sungrass.warden_desc=De Warden kan genezing ontvangen van vertrapt zonnegras, zelfs als ze er vandaan loopt.
plants.swiftthistle$seed.name=zaad van de snelle distel
plants.swiftthistle$timebubble.desc=Een kleine bubbel van versnelde tijd, waardoor acties direct kunnen worden uitgevoerd. Aanvallen of magie gebruiken verbreekt dit effect echter.\n\nAantal resterende beurten: %s.
plants.swiftthistle$timebubble.name=tijdbubbel
plants.swiftthistle.desc=Wanneer de snelle distel vertrapt wordt, versnelt dit kortstondig de tijd eromheen, waardoor degene die de plant vertrapt meerdere handelingen in een oogwenk kan uitvoeren.
plants.swiftthistle.name=sneldistel
plants.swiftthistle.warden_desc=Naast het verkrijgen van directe acties, krijgt de Warden ook een korte snelheidsboost wanneer hij snelle distels vertrapt.
