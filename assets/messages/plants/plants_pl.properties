plants.blandfruitbush$seed.name=nasiona mdłego owocu
plants.blandfruitbush.desc=Daleki kuzyn gnilowca, gruszkowaty owoc krzewu mdłego smakują jak zbrylony pył. Owoce są obrzydliwe i nietrwałe, ale nie są trujące. Być może dałoby się je ugotować.
plants.blandfruitbush.discover_hint=Roślinę tę możesz znaleźć losowo w lochach.
plants.blandfruitbush.name=mdły owoc
plants.blindweed$seed.name=nasiona ślepoty
plants.blindweed.desc=Dotknięty, ślepota ginie w jasnym błysku światła. Błysk jest na tyle silny, że dezorientuje na kilka sekund.
plants.blindweed.name=ślepota
plants.blindweed.warden_desc=_Strażnik_ przekieruje energię ślepoty w tymczasową zasłonę niewidzialności, zamiast ją dezorientować.
plants.earthroot$armor.desc=Rodzaj naturalnej, nieruchomej zbroi wykonanej z kory i sznurka.\n\nTa ziołowa zbroja blokuje obrażenia %d od wszelkich trafień fizycznych, dopóki nie straci wytrzymałości i się nie zawali.\n\nPonieważ zbroja jest nieruchoma, poruszenie się spowoduje jej rozpad i utratę.\n\nPozostała zbroja: %d.
plants.earthroot$armor.name=zbroja ziołowa
plants.earthroot$seed.name=nasiona korzenia ziemi
plants.earthroot.desc=Kiedy istota dotknie korzenia ziemi, jego korzenie tworzą wokół niego rodzaj nieruchomej, naturalnej zbroi.
plants.earthroot.name=korzeń ziemi
plants.earthroot.warden_desc=Korzenie rośliny ziemnej będą poruszać się razem ze Strażniczką, zapewniając jej ruchomą zbroję z kory.
plants.fadeleaf$seed.name=nasiona więdnącego liścia
plants.fadeleaf.desc=Dotknięcie liścia zanikającego teleportuje dowolną istotę w losowe miejsce na bieżącym poziomie.
plants.fadeleaf.name=zanikający liść
plants.fadeleaf.warden_desc=Efekt teleportacji liścia zanikającego jest skuteczniejszy dla _Strażniczki_, teleportując ją z powrotem na koniec poprzedniego poziomu lochu.
plants.firebloom$seed.name=nasiona ognistego kwiatu
plants.firebloom.desc=Gdy coś dotknie kwiatu ognia, ten wybucha płomieniami.
plants.firebloom.name=ognisty kwiat
plants.firebloom.warden_desc=Kiedy stratuje ognisty kwiat, _Strażnik_ zamiast odnieść obrażenia, na krótko zostanie przepełniony płomieniami.
plants.icecap$seed.name=nasiono czapy lodowej
plants.icecap.desc=W kontakcie z powierzchnią lodu, pokrywa lodowa uwalnia obłok zamarzającego pyłku. Efekt zamarzania jest znacznie silniejszy w wilgotnym środowisku.
plants.icecap.name=czapa lodowa
plants.icecap.warden_desc=Kiedy stratuje pokrywę lodową, Strażniczka zamiast odnieść obrażenia, na krótko zostanie pokryta szronem.
plants.mageroyal$seed.name=nasiona mageroyal
plants.mageroyal.desc=Kolczaste kwiaty mageryalu zawierają substancję chemiczną znaną ze swoich silnych właściwości neutralizujących. Wszystko, co wejdzie w kontakt z tą rośliną, zostanie oczyszczone z wielu negatywnych skutków.
plants.mageroyal.name=magowo-królewski
plants.mageroyal.refreshed=Czujesz się odświeżony.
plants.mageroyal.warden_desc=Oprócz efektu neutralizującego _Strażnik_ stanie się tymczasowo odporny na wszystkie efekty obszarowe, gdy nadepnie na mageroyala.
plants.plant$seed$placeholder.name=nasienie
plants.plant$seed.ac_plant=ZAKŁAD
plants.plant$seed.info=Rzuć to nasiono w miejsce, w którym chcesz wyhodować roślinę.\n\n%s
plants.plant$seed.seed_of=nasiona %s
plants.plant.discover_hint=Możesz znaleźć tę roślinę losowo w lochach lub wyhodować ją z towarzyszącego jej nasiona.
plants.plant.warden_desc=Roślina ta nie ma żadnego specjalnego efektu, gdy używa jej Strażnik.
plants.rotberry$seed.discover_hint=Ten przedmiot możesz znaleźć podczas konkretnego zadania.
plants.rotberry$seed.name=nasiona gnilca
plants.rotberry.desc=Owoce młodego krzewu gnilca smakują jak słodka śmierć. Po kilku latach ten krzew gnilca wyrośnie na kolejny rdzeń zgnilizny. Po deptaniu, młody gnilcowiec wydziela mały obłoczek toksycznego gazu.
plants.rotberry.discover_hint=Możesz wyhodować tę roślinę z odpowiedniego nasiona podczas konkretnego zadania.
plants.rotberry.name=gnilec
plants.rotberry.warden_desc=Zwykle krzak gnijącej jagody wydziela tylko niewielką ilość gazu po stratowaniu, ale Strażniczka potrafi wykorzystać jego energię, aby tymczasowo zwiększyć swoją siłę!
plants.sorrowmoss$seed.name=nasiona mchu smutku
plants.sorrowmoss.desc=Mech żałosny to kwiat (nie mech) o ostrych jak brzytwa płatkach, pokrytych śmiercionośnym jadem.
plants.sorrowmoss.name=mech smutku
plants.sorrowmoss.warden_desc=Kiedy stratuje mech smutku, Strażnik zamiast odnieść obrażenia, zostanie na krótko przesiąknięty toksyną.
plants.starflower$seed.name=nasiona gwiaździstego kwiatu
plants.starflower.desc=Kwiat gwiazdy to rzadka roślina, która według legendy obdarza świętą mocą każdego, kto jej dotknie.
plants.starflower.name=gwiaździsta
plants.starflower.warden_desc=Oprócz otrzymania błogosławieństwa, Strażniczka zyska znaczną ilość punktów regeneracji różdżki, gdy podepcze kwiat gwiazdy.
plants.stormvine$seed.name=nasiona burzliwego pnącza
plants.stormvine.desc=Grawitacja dziwnie oddziałuje na burzową roślinę, pozwalając jej delikatnym, niebieskim wąsom „zawisać” w powietrzu. Wszystko, co utknie w pnączu, zostaje przez to dotknięte i traci orientację.
plants.stormvine.name=burzowica
plants.stormvine.warden_desc=_Strażniczka_ potrafi kontrolować efekt grawitacyjny burzowej winorośli i na krótko unosi się w powietrzu, gdy ją stratuje.
plants.sungrass$health.desc=Trawa słoneczna ma doskonałe właściwości lecznicze, choć działa znacznie wolniej niż mikstura lecznicza.\n\nOdsunięcie się od rośliny przerwie efekt leczniczy.\n\nPozostało Ci leczenia: %d.
plants.sungrass$health.name=ziołolecznictwo
plants.sungrass$seed.name=nasiona trawy słonecznej
plants.sungrass.desc=Trawa słoneczna jest znana ze swoich powolnych, ale skutecznych właściwości leczniczych.
plants.sungrass.name=trawa słoneczna
plants.sungrass.warden_desc=_Strażniczka_ może otrzymać leczenie z podeptanej trawy słonecznej, nawet jeśli się od niej oddali.
plants.swiftthistle$seed.name=nasiona ostropestu plamistego
plants.swiftthistle$timebubble.desc=Mała bańka przyspieszonego czasu, pozwalająca na natychmiastowe wykonywanie akcji. Jednak atak lub użycie magii przerwie ten efekt.\n\nPozostałe tury: %s.
plants.swiftthistle$timebubble.name=bańka czasu
plants.swiftthistle.desc=Po stratowaniu, ostrożeń na krótko przyspiesza upływ czasu, pozwalając depczącemu na wykonanie kilku czynności natychmiast.
plants.swiftthistle.name=ostrożeń
plants.swiftthistle.warden_desc=Oprócz natychmiastowych akcji, _Strażnik_ otrzyma także krótkotrwały wzrost pośpiechu, gdy rozdepcze ostrożeń.
