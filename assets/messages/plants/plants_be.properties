plants.blandfruitbush$seed.name=насенне мяккага фрукта
plants.blandfruitbush.desc=Далёкі сваяк гнільніцы, грушападобны прадукт мяккага куста, на смак нагадвае засохлы пыл. Плод агідны і неістотны, але не атрутны. Магчыма, яго можна прыгатаваць.
plants.blandfruitbush.discover_hint=Вы можаце знайсці гэтую расліну выпадковым чынам у падзямеллі.
plants.blandfruitbush.name=мяккі фрукт
plants.blindweed$seed.name=насенне сляпой пырніцы
plants.blindweed.desc=Калі да яе дакрануцца, сляпая трава гіне ў яркім успышцы святла. Успышка настолькі моцная, што дэзарыентуе на некалькі секунд.
plants.blindweed.name=пастух
plants.blindweed.warden_desc=_Страж_ накіруе энергію сляпой травы ў часовую плашч-нябачнасць, замест таго, каб дэзарыентаваць яе.
plants.earthroot$armor.desc=Выгляд натуральнага нерухомага даспеха з кары і шпагату.\n\nГэты травяны даспех будзе блакаваць %d пашкоджанні ад любога фізічнага ўдару, пакуль не вычарпаецца і не разваліцца.\n\nКалі даспех нерухомы, яго рух прывядзе да яго разбурэння і страты.\n\nЗасталося даспехаў: %d.
plants.earthroot$armor.name=травяныя даспехі
plants.earthroot$seed.name=насенне землянога кораня
plants.earthroot.desc=Калі істота дакранаецца да землянога кораня, яго карані ствараюць вакол яго своеасаблівую нерухомую натуральную браню.
plants.earthroot.name=земляны корань
plants.earthroot.warden_desc=Карані расліны з землянымі коранямі будуць рухацца разам з _Страхоўніцай_, забяспечваючы ёй рухомую браню з кары.
plants.fadeleaf$seed.name=насенне бляклага ліста
plants.fadeleaf.desc=Дотык да збляклага ліста тэлепартуе любую істоту ў выпадковае месца на бягучым узроўні.
plants.fadeleaf.name=зівялы ліст
plants.fadeleaf.warden_desc=Эфект тэлепартацыі з дапамогай «Зівялага ліста» больш магутны для _Стражкі_, тэлепартуючы яе назад у канец папярэдняга ўзроўню падзямелля.
plants.firebloom$seed.name=насенне агністага квету
plants.firebloom.desc=Калі што-небудзь дакранаецца да вогненнай кветкі, яно ўспыхвае полымем.
plants.firebloom.name=агністае красаванне
plants.firebloom.warden_desc=Калі яна топча агністую кветку, _Стража_ на кароткі час ахопліваецца полымем замест таго, каб атрымаць шкоду.
plants.icecap$seed.name=насенне ледзяной шапкі
plants.icecap.desc=Пры дакрананні да ледзяной шапкі яна выкідвае клубы замярзаючага пылка. Эфект замярзання значна мацнейшы, калі навакольнае асяроддзе вільготнае.
plants.icecap.name=ледзяны покрывак
plants.icecap.warden_desc=Калі яна топча ледзяную шапку, _Страхова_ на кароткі час ахінае марозам замест таго, каб атрымаць шкоду.
plants.mageroyal$seed.name=насенне магерояла
plants.mageroyal.desc=Калючыя кветкі магерояла ўтрымліваюць хімічнае рэчыва, вядомае сваімі ўласцівасцямі моцнага нейтралізуючага агента. Усё, што наткнецца на гэтую расліну, ачысціцца ад многіх негатыўных наступстваў.
plants.mageroyal.name=магероял
plants.mageroyal.refreshed=Вы адчуваеце сябе бадзёрымі.
plants.mageroyal.warden_desc=Акрамя нейтралізуючага эфекту, пры наступанні на магерояла _Страж_ часова стане неўспрымальным да ўсіх эфектаў, абмежаваных вобласцю.
plants.plant$seed$placeholder.name=насенне
plants.plant$seed.ac_plant=РАСЛІНА
plants.plant$seed.info=Кіньце гэтае насенне туды, дзе вы хочаце вырасціць расліну. \n\n%s
plants.plant$seed.seed_of=насенне %s
plants.plant.discover_hint=Вы можаце знайсці гэтую расліну выпадковым чынам у падзямеллі або вырасціць яе з адпаведнага насення.
plants.plant.warden_desc=Гэтая расліна не мае асаблівага эфекту, калі ёю карыстаецца Вартаўнік.
plants.rotberry$seed.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
plants.rotberry$seed.name=насенне гнільніцы
plants.rotberry.desc=Ягады маладога куста гнільніцы маюць смак салодкай-салодкай смерці. Праз некалькі гадоў гэты куст гнільніцы ператворыцца ў яшчэ адзін куст гнільніцы. Калі маладую гніль растаптаць, яна будзе вылучаць невялікія клубы таксічнага газу.
plants.rotberry.discover_hint=Вы можаце вырасціць гэтую расліну з адпаведнага насення падчас выканання пэўнага квэста.
plants.rotberry.name=гніль
plants.rotberry.warden_desc=Звычайна куст гнілі вылучае толькі трохі газу, калі яго растаптаць, але _Стража_ здольная выкарыстоўваць яго энергію, каб часова павялічыць сваю сілу!
plants.sorrowmoss$seed.name=насенне сумнага моху
plants.sorrowmoss.desc=Сумны мох — гэта кветка (не мох) з вострымі як брытва пялёсткамі, пакрытымі смяротнай атрутай.
plants.sorrowmoss.name=сумны мох
plants.sorrowmoss.warden_desc=Калі яна топча журботны мох, _Страхова_ на кароткі час прасякнецца таксінам замест таго, каб атрымаць шкоду.
plants.starflower$seed.name=насенне зорчатай кветкі
plants.starflower.desc=Кажуць, што рэдкая расліна, зорчатка, дае святую сілу таму, хто да яе дакранецца.
plants.starflower.name=зорчатая кветка
plants.starflower.warden_desc=Акрамя благаслаўлення, _Стража_ атрымае значную колькасць зарадкі палачкі, калі затопча зорчатую кветку.
plants.stormvine$seed.name=насенне буравой лазы
plants.stormvine.desc=Гравітацыя дзіўна ўплывае на расліну штормовая ліяна, дазваляючы яе шэптавым блакітным вусікам «вісець» у паветры. Усё, што зачапілася за ліяну, падвяргаецца гэтаму ўздзеянню і губляе арыентацыю.
plants.stormvine.name=штормовая вінаградная лаза
plants.stormvine.warden_desc=_Стражачка_ здольная кантраляваць гравітацыйны эфект штормавай ліяны і ненадоўга левітаваць, калі топча адну з іх.
plants.sungrass$health.desc=Сонечная трава валодае выдатнымі гаючымі ўласцівасцямі, хоць яна дзейнічае значна павольней, чым зелле гаення.\n\nКалі зрушыцца з расліны, гаючы эфект будзе спынены.\n\nЗасталося гаення: %d.
plants.sungrass$health.name=лячэнне травамі
plants.sungrass$seed.name=насенне сонечнай травы
plants.sungrass.desc=Санграс вядомы сваімі павольнымі, але эфектыўнымі гаючымі ўласцівасцямі.
plants.sungrass.name=сонечная трава
plants.sungrass.warden_desc=_Стражачка_ можа атрымаць лячэнне ад растаптанай сонечнай травы, нават калі яна адыдзе ад яе.
plants.swiftthistle$seed.name=насенне хуткацвета
plants.swiftthistle$timebubble.desc=Невялікая бурбалка паскоранага часу, якая дазваляе імгненна выконваць дзеянні. Аднак атака або выкарыстанне магіі перапыняць гэты эфект. \n\nХадоў засталося: %s.
plants.swiftthistle$timebubble.name=бурбалка часу
plants.swiftthistle.desc=Калі яго растаптаць, хуткакрылы на імгненне паскарае плынь часу вакол яго, дазваляючы растаптчыку імгненна выканаць некалькі дзеянняў.
plants.swiftthistle.name=хуткакрыл
plants.swiftthistle.warden_desc=Акрамя імгненных дзеянняў, _Страж_ таксама атрымае кароткачасовае паскарэнне пры таптанні хуткага чартапалоху.
