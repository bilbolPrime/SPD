plants.blandfruitbush$seed.name=семена мягкого плода
plants.blandfruitbush.desc=Дальний родственник гнилостной ягоды, плоды кустарника «Бладфрут» имеют грушевидную форму и на вкус напоминают засохшую пыль. Плоды отвратительны и не имеют выраженной текстуры, но не ядовиты. Возможно, их можно приготовить.
plants.blandfruitbush.discover_hint=Это растение можно найти случайным образом в подземелье.
plants.blandfruitbush.name=пресный фрукт
plants.blindweed$seed.name=семя слепой травы
plants.blindweed.desc=При прикосновении слепая трава погибает в яркой вспышке света. Вспышка достаточно сильна, чтобы вызвать дезориентацию на несколько секунд.
plants.blindweed.name=слепая трава
plants.blindweed.warden_desc=Вместо того чтобы дезориентироваться, Страж направит энергию слепого сорняка во временную пелену невидимости.
plants.earthroot$armor.desc=Вид натуральной, неподвижной брони, сделанной из коры и бечёвки. Эта травяная броня будет блокировать урон от любых физических ударов, пока не исчерпает свою прочность и не разрушится. Поскольку броня неподвижна, движение приведёт к её разрушению и потере. Остаток брони: %d.
plants.earthroot$armor.name=травяная броня
plants.earthroot$seed.name=семя земляного корня
plants.earthroot.desc=Когда существо касается земляного корня, его корни создают вокруг него своего рода неподвижную естественную броню.
plants.earthroot.name=земляной корень
plants.earthroot.warden_desc=Корни растения, произрастающего в земле, будут двигаться вместе с Хранительницей, обеспечивая ей подвижную броню из коры.
plants.fadeleaf$seed.name=семя бледнолистника
plants.fadeleaf.desc=Прикосновение к листу фейдлифа телепортирует любое существо в случайное место на текущем уровне.
plants.fadeleaf.name=бледный лист
plants.fadeleaf.warden_desc=Эффект телепортации, вызываемый заклинанием «Затуманенный лист», оказывается более мощным для _Хранительницы_, телепортируя её обратно в конец предыдущего уровня подземелья.
plants.firebloom$seed.name=семя огненного цветка
plants.firebloom.desc=Когда что-либо касается огненного цветка, он вспыхивает пламенем.
plants.firebloom.name=огненный цветок
plants.firebloom.warden_desc=Если она растоптает огненный цветок, то вместо того, чтобы получить вред, Страж ненадолго озарится пламенем.
plants.icecap$seed.name=семя ледяной шапки
plants.icecap.desc=При прикосновении ледяная шапка выпускает облако замерзающей пыльцы. Эффект замерзания значительно сильнее, если окружающая среда влажная.
plants.icecap.name=ледяная шапка
plants.icecap.warden_desc=Когда она топчет ледяную шапку, Стражница ненадолго покроется инеем, а не пострадает.
plants.mageroyal$seed.name=семя магорияла
plants.mageroyal.desc=Колючие цветки магерояля содержат химическое вещество, известное своими свойствами сильного нейтрализующего агента. Все, что наступит на это растение, будет очищено от многих негативных воздействий.
plants.mageroyal.name=магероял
plants.mageroyal.refreshed=Вы чувствуете себя отдохнувшим.
plants.mageroyal.warden_desc=В дополнение к нейтрализующему эффекту, _Страж_ временно станет невосприимчив ко всем эффектам, действующим на область, при наступлении на магероял.
plants.plant$seed$placeholder.name=семя
plants.plant$seed.ac_plant=РАСТЕНИЕ
plants.plant$seed.info=Бросьте это семя туда, где вы хотите вырастить растение.\n\n%s
plants.plant$seed.seed_of=семя %s
plants.plant.discover_hint=Это растение можно найти случайным образом в подземелье или вырастить из соответствующих семян.
plants.plant.warden_desc=При использовании Надзирателем это растение не оказывает никакого особого эффекта.
plants.rotberry$seed.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
plants.rotberry$seed.name=семя гнилой ягоды
plants.rotberry.desc=Ягоды молодого куста гнилой ягоды имеют привкус сладкой, сладкой смерти. Через несколько лет этот куст гнилой ягоды превратится в еще одно гнилое деревце. При наступлении на молодую гнилую ягоду вырывается небольшое облако токсичного газа.
plants.rotberry.discover_hint=Это растение можно вырастить из соответствующих семян во время выполнения определённого задания.
plants.rotberry.name=гнилую ягоду
plants.rotberry.warden_desc=Обычно куст гнилой ягоды при топтании выделяет лишь небольшое количество газа, но _Хранительница_ способна использовать его энергию для временного увеличения своей силы!
plants.sorrowmoss$seed.name=семя скорби мха
plants.sorrowmoss.desc=Скорбящий мох — это цветок (а не мох) с острыми как бритва лепестками, покрытыми смертельным ядом.
plants.sorrowmoss.name=печальный мох
plants.sorrowmoss.warden_desc=Когда она топчет мох скорби, Стражница ненадолго наполняется ядом, а не получает вреда.
plants.starflower$seed.name=семя звездчатки
plants.starflower.desc=Считается, что это редкое растение, звездчатый цветок, дарует священную силу тому, кто к нему прикоснется.
plants.starflower.name=звездчатый цветок
plants.starflower.warden_desc=Помимо благословения, Стражница получит значительное количество энергии для перезарядки своей волшебной палочки, если растопчет звездный цветок.
plants.stormvine$seed.name=семя грозовой лозы
plants.stormvine.desc=Гравитация странным образом воздействует на растение «штормовая лиана», заставляя его тонкие голубые усики «висеть» в воздухе. Все, что попадает в ловушку лианы, подвергается её воздействию и дезориентируется.
plants.stormvine.name=штормвайн
plants.stormvine.warden_desc=Стражница способна контролировать гравитационное воздействие штормовой лозы и ненадолго поднимается в воздух, когда топчет одну из них.
plants.sungrass$health.desc=Солнечная трава обладает превосходными целебными свойствами, хотя и действует гораздо медленнее, чем зелье исцеления. Если убрать растение с его поверхности, целебный эффект прекратится.
plants.sungrass$health.name=лечение травами
plants.sungrass$seed.name=семена солнечной травы
plants.sungrass.desc=Солнечная трава известна своими медленными, но эффективными целебными свойствами, которые проявляются в ее соке.
plants.sungrass.name=солнечная трава
plants.sungrass.warden_desc=Стражница может получить исцеление от вытоптанной солнечной травы, даже если она отойдет от нее.
plants.swiftthistle$seed.name=семена чертополоха
plants.swiftthistle$timebubble.desc=Небольшой пузырь ускоренного времени, позволяющий мгновенно выполнять действия. Однако атака или использование магии нарушат этот эффект. \n\nОсталось ходов: %s.
plants.swiftthistle$timebubble.name=временной пузырь
plants.swiftthistle.desc=При попирании стрелиция на короткое время ускоряет течение времени вокруг себя, позволяя тому, кто её топчет, мгновенно выполнить ряд действий.
plants.swiftthistle.name=чертополох скороцветный
plants.swiftthistle.warden_desc=Помимо получения мгновенных действий, Страж также получит кратковременное ускорение при попирании чертополоха.
