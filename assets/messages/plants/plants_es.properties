plants.blandfruitbush$seed.name=semilla de fruta insípida
plants.blandfruitbush.desc=Pariente lejano de la baya podrida, el fruto en forma de pera del arbusto de fruta insípida sabe a polvo seco. La fruta es desagradable e insustancial, pero no es venenosa. Quizás se podría cocinar.
plants.blandfruitbush.discover_hint=Puedes encontrar esta planta de forma aleatoria en la mazmorra.
plants.blandfruitbush.name=fruta insípida
plants.blindweed$seed.name=semilla de hierba ciega
plants.blindweed.desc=Al tocarla, una planta de esta especie muere en un destello de luz brillante. El destello es lo suficientemente fuerte como para desorientar durante varios segundos.
plants.blindweed.name=hierba ciega
plants.blindweed.warden_desc=_El Guardián_ canalizará la energía de una planta ciega en un manto temporal de invisibilidad, en lugar de desorientarse.
plants.earthroot$armor.desc=Una especie de armadura natural e inmóvil hecha de corteza y cuerda.\n\nEsta armadura herbal bloqueará el daño de cualquier golpe físico, hasta que finalmente se agote su durabilidad y colapse.\n\nComo la armadura es inmóvil, moverse hará que se rompa y se pierda.\n\nArmadura restante: %d.
plants.earthroot$armor.name=armadura de hierbas
plants.earthroot$seed.name=semilla de raíz de tierra
plants.earthroot.desc=Cuando una criatura toca una raíz terrestre, sus raíces crean una especie de armadura natural inmóvil a su alrededor.
plants.earthroot.name=raíz de tierra
plants.earthroot.warden_desc=Las raíces de una planta de raíz terrestre se moverán con _la Guardiana_, proporcionándole una armadura móvil de piel de corteza.
plants.fadeleaf$seed.name=semilla de hoja marchita
plants.fadeleaf.desc=Al tocar una hoja marchita, cualquier criatura será teletransportada a un lugar aleatorio del nivel actual.
plants.fadeleaf.name=hoja marchita
plants.fadeleaf.warden_desc=El efecto de teletransportación de la hoja marchita es más potente para _la Guardiana_, teletransportándola de vuelta al final del nivel anterior de la mazmorra.
plants.firebloom$seed.name=semilla de flor de fuego
plants.firebloom.desc=Cuando algo toca una flor de fuego, estalla en llamas.
plants.firebloom.name=flor de fuego
plants.firebloom.warden_desc=Cuando pisotea una flor de fuego, _la Guardiana_ se imbuirá brevemente de llamas en lugar de sufrir daño alguno.
plants.icecap$seed.name=semilla de casquete polar
plants.icecap.desc=Al tocar un casquete polar, este libera una nube de polen congelado. El efecto de congelación es mucho más intenso si el ambiente está húmedo.
plants.icecap.name=casquete polar
plants.icecap.warden_desc=Cuando pisotea un casquete polar, _la Guardiana_ se imbuirá brevemente de escarcha en lugar de sufrir daño alguno.
plants.mageroyal$seed.name=semilla de mageroyal
plants.mageroyal.desc=Las flores espinosas del mageroyal contienen una sustancia química conocida por sus potentes propiedades neutralizantes. Todo lo que entre en contacto con esta planta se purificará de muchos efectos negativos.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Te sientes renovado.
plants.mageroyal.warden_desc=Además del efecto neutralizador, _el Guardián_ se volverá temporalmente inmune a todos los efectos de área cuando pise mageroyal.
plants.plant$seed$placeholder.name=semilla
plants.plant$seed.ac_plant=PLANTA
plants.plant$seed.info=Lanza esta semilla al lugar donde quieras cultivar una planta.\n\n%s
plants.plant$seed.seed_of=semilla de %s
plants.plant.discover_hint=Puedes encontrar esta planta al azar en la mazmorra, o cultivarla a partir de su semilla correspondiente.
plants.plant.warden_desc=Esta planta no tiene ningún efecto especial cuando la usa el Guardián.
plants.rotberry$seed.discover_hint=Puedes encontrar este objeto durante una misión específica.
plants.rotberry$seed.name=semilla de baya podrida
plants.rotberry.desc=Las bayas de un arbusto joven de podredumbre tienen un sabor dulce y mortal. En pocos años, este arbusto se convertirá en un corazón de podredumbre. Al ser pisoteada, una baya joven de podredumbre desprenderá una pequeña bocanada de gas tóxico.
plants.rotberry.discover_hint=Puedes cultivar esta planta a partir de su semilla correspondiente durante una misión específica.
plants.rotberry.name=baya podrida
plants.rotberry.warden_desc=Normalmente, un arbusto de bayas podridas solo produce un poco de gas al ser pisoteado, ¡pero _la Guardiana_ es capaz de aprovechar la energía que emana de él para aumentar temporalmente su fuerza!
plants.sorrowmoss$seed.name=semilla de musgo de la tristeza
plants.sorrowmoss.desc=El musgo de la tristeza es una flor (no un musgo) con pétalos afilados como navajas, recubiertos de un veneno mortal.
plants.sorrowmoss.name=musgo de la tristeza
plants.sorrowmoss.warden_desc=Cuando pisotea un musgo de la tristeza, _la Guardiana_ se imbuirá brevemente de toxina en lugar de sufrir daño alguno.
plants.starflower$seed.name=semilla de flor estrella
plants.starflower.desc=Se dice que la flor estrella, una planta rara, otorga poderes sagrados a quien la toca.
plants.starflower.name=estrella
plants.starflower.warden_desc=Además de recibir una bendición, _la Guardiana_ obtendrá una cantidad significativa de recarga de varita cuando pisotee una flor estelar.
plants.stormvine$seed.name=semilla de la enredadera de la tormenta
plants.stormvine.desc=La gravedad afecta de forma extraña a la planta trepadora, permitiendo que sus delicados zarcillos azules parezcan flotar en el aire. Todo lo que queda atrapado en la enredadera se ve afectado y se desorienta.
plants.stormvine.name=vid de tormenta
plants.stormvine.warden_desc=_La Guardiana_ es capaz de controlar el efecto gravitatorio de la enredadera de tormenta, y levitará brevemente cuando pise una.
plants.sungrass$health.desc=La hierba solar posee excelentes propiedades curativas, aunque es mucho más lenta que una poción curativa.\n\nAlejarse de la planta romperá el efecto curativo.\n\nCuración restante: %d.
plants.sungrass$health.name=curación con hierbas
plants.sungrass$seed.name=semilla de hierba solar
plants.sungrass.desc=La hierba del sol es famosa por las propiedades curativas, lentas pero efectivas, de su savia.
plants.sungrass.name=hierba del sol
plants.sungrass.warden_desc=_La Guardiana_ puede recibir curación al ser pisoteada por la hierba solar, incluso si se aleja de ella.
plants.swiftthistle$seed.name=semilla de cardo rápido
plants.swiftthistle$timebubble.desc=Una pequeña burbuja de tiempo acelerado, que permite realizar acciones instantáneamente. Sin embargo, atacar o usar magia romperá este efecto.\n\nTurnos restantes: %s.
plants.swiftthistle$timebubble.name=burbuja de tiempo
plants.swiftthistle.desc=Al ser pisoteada, la planta conocida como cardo veloz acelera brevemente el flujo del tiempo a su alrededor, permitiendo a quien la pisotea realizar varias acciones al instante.
plants.swiftthistle.name=cardo rápido
plants.swiftthistle.warden_desc=Además de obtener acciones instantáneas, _el Guardián_ también recibirá un breve aumento de prisa al pisotear el cardo veloz.
