plants.blandfruitbush$seed.name=ブラッドフルーツの実
plants.blandfruitbush.desc=ロットベリーの遠いいとこで、洋ナシのような形をしたブラン・フルーツ・ブッシュの果実は、こびりついた埃のような味がする。果実はグロくて実がないが、毒はない。もしかしたら調理できるかもしれない。
plants.blandfruitbush.discover_hint=この植物はダンジョン内でランダムに見つけることができる。
plants.blandfruitbush.name=ブルーベリー
plants.blindweed$seed.name=ひえ
plants.blindweed.desc=ブラインドウィードに触れると、鮮やかな閃光を放って消滅する。閃光は数秒間意識を失うほど強い。
plants.blindweed.name=ブラインドウィード
plants.blindweed.warden_desc=ウォーデン》はブラインド・ウィードのエネルギーを一時的な透明な覆いへと変換する。
plants.earthroot$armor.desc=樹皮と麻ひもで作られた、自然の不動の鎧のようなもの。\n\nこの薬草の鎧はどんな物理的な打撃からも%dのダメージを防ぐが、やがて耐久力が尽きて崩れてしまう。\n\nこの鎧は動かないため、動くとバラバラになって失われる。\n\nアーマーの残り%d。
plants.earthroot$armor.name=ハーバルアーマー
plants.earthroot$seed.name=大地の根
plants.earthroot.desc=クリーチャーがアースルーツに触れると、その根はその周囲に一種の動かない自然の鎧を作り出す。
plants.earthroot.name=アースルート
plants.earthroot.warden_desc=大地の根は_the Warden_とともに移動し、彼女の移動可能なバークスキン・アーマーを提供する。
plants.fadeleaf$seed.name=フェードリーフ
plants.fadeleaf.desc=フェードリーフに触れると、クリーチャーは現在のレベル上のランダムな場所にテレポートする。
plants.fadeleaf.name=フェードリーフ
plants.fadeleaf.warden_desc=フェードリーフのテレポート効果は_the Warden_にとってより強力で、彼女を前のダンジョンレベルの終わりまでテレポートさせる。
plants.firebloom$seed.name=ファイアーブルームの種
plants.firebloom.desc=ファイヤーブロームに何かが触れると、炎が燃え上がる。
plants.firebloom.name=ファイアーブロッサム
plants.firebloom.warden_desc=彼女が火の花を踏みつけると、_warden_は傷つく代わりに短時間炎に包まれる。
plants.icecap$seed.name=氷柱の種
plants.icecap.desc=氷帽に触れると、凍った花粉が吹き出す。濡れた環境であれば、凍結効果はより強くなる。
plants.icecap.name=アイスキャップ
plants.icecap.warden_desc=彼女が氷床を踏みつけると、_warden_は傷つく代わりに短時間霜に包まれる。
plants.mageroyal$seed.name=マゼロイヤルの種
plants.mageroyal.desc=マゼロイヤルのトゲトゲした花には、強力な中和剤として知られる化学物質が含まれている。この植物に足を踏み入れると、さまざまな悪影響が浄化される。
plants.mageroyal.name=マジェロイヤル
plants.mageroyal.refreshed=気分は爽快だ。
plants.mageroyal.warden_desc=中和効果に加え、_the Warden_はマゼロイヤルを踏んだとき、一時的にすべての領域に縛られる効果を受けなくなる。
plants.plant$seed$placeholder.name=シード
plants.plant$seed.ac_plant=工場
plants.plant$seed.info=この種を植物を育てたい場所に投げる。\n\n%s
plants.plant$seed.seed_of=%sの種
plants.plant.discover_hint=この植物はダンジョン内でランダムに見つけるか、関連する種から育てることができる。
plants.plant.warden_desc=この植物はウォーデンが使用しても特別な効果はない。
plants.rotberry$seed.discover_hint=このアイテムは特定のクエストで見つけることができる。
plants.rotberry$seed.name=ロットベリーの実
plants.rotberry.desc=若いロットベリーの果実は、甘い甘い死の味がする。数年後、このロットベリーの低木はまた別の腐った心臓に成長する。踏みつけられると、若いロットベリーは小さな有毒ガスを発生する。
plants.rotberry.discover_hint=この植物は、特定のクエスト中に関連する種から育てることができる。
plants.rotberry.name=ロットベリー
plants.rotberry.warden_desc=通常、ロットベリーの茂みは踏みつけられるとわずかなガスが発生するだけだが、_the Warden_はそこからエネルギーを得て、一時的に力を高めることができる！
plants.sorrowmoss$seed.name=ミズゴケの種
plants.sorrowmoss.desc=ミズゴケはカミソリのような鋭い花びらを持つ花（コケではない）で、猛毒でコーティングされている。
plants.sorrowmoss.name=悲嘆の苔
plants.sorrowmoss.warden_desc=彼女がソレストモスを踏みつけると、_warden_は傷つけられる代わりに短時間毒素に侵される。
plants.starflower$seed.name=ほしばな
plants.starflower.desc=珍しい植物であるスターフラワーは、触れた者に聖なる力を与えると言われている。
plants.starflower.name=スターフラワー
plants.starflower.warden_desc=祝福されるだけでなく、_the Warden_はスターフラワーを踏みつぶすと、かなりの量の杖のリチャージを得る。
plants.stormvine$seed.name=嵐の種
plants.stormvine.desc=重力はストームバインという植物に奇妙な影響を与え、そのうねるような青い蔓が空中に「ぶら下がる」ようになる。蔓に巻き込まれたものはこの影響を受け、混乱する。
plants.stormvine.name=ストームバイン
plants.stormvine.warden_desc=ウォーデンはストームバインの重力効果をコントロールすることができ、ストームバインを踏みつけると一時的に浮遊する。
plants.sungrass$health.desc=サングラスには優れた治癒作用があるが、治癒のポーションよりははるかに遅い。\n\n植物から離れると、ヒーリング効果が途切れてしまう。\n\nヒーリング残量%d。
plants.sungrass$health.name=ハーバル・ヒーリング
plants.sungrass$seed.name=日芝
plants.sungrass.desc=サングラスは、樹液のゆっくりした、しかし効果的な治癒作用で有名である。
plants.sungrass.name=サングラス
plants.sungrass.warden_desc=ウォーデン_は踏みつけられたサングラスから離れたとしても回復を受けることができる。
plants.swiftthistle$seed.name=ツバメアザミ
plants.swiftthistle$timebubble.desc=時間を加速させる小さな泡が発生し、瞬時に行動が可能になる。ただし、攻撃や魔法を使うとこの効果は切れる。\n\n残りターン%s.
plants.swiftthistle$timebubble.name=タイムバブル
plants.swiftthistle.desc=スイフトアザミは踏みつけられると周囲の時間の流れを短時間加速させ、踏みつけ者はいくつかの行動を瞬時に実行できるようになる。
plants.swiftthistle.name=ハルノノゲシ
plants.swiftthistle.warden_desc=即座の行動に加えて、_the Warden_はスイフトアザミを踏みつける際に短時間のヘイスト・ブーストを得る。
