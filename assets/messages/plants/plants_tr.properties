plants.blandfruitbush$seed.name=tatsız meyvenin tohumu
plants.blandfruitbush.desc=Çürük meyvesinin uzak bir akrabası olan, armut biçimli meyvesi, toz gibi bir tada sahiptir. Meyve iğrenç ve tatsızdır ancak zehirli değildir. Belki pişirilebilir.
plants.blandfruitbush.discover_hint=Bu bitkiyi zindanda rastgele bulabilirsiniz.
plants.blandfruitbush.name=tatsız meyve
plants.blindweed$seed.name=kör ot tohumu
plants.blindweed.desc=Dokunulduğunda kör ot, parlak bir ışık parlamasıyla yok olur. Bu parlama, birkaç saniye boyunca insanı sersemletecek kadar güçlüdür.
plants.blindweed.name=kör ot
plants.blindweed.warden_desc=_Muhafız_, yönünü kaybetmek yerine, kör otun enerjisini geçici bir görünmezlik örtüsüne dönüştürecektir.
plants.earthroot$armor.desc=Kabuk ve ipten yapılmış, doğal, hareket etmeyen bir zırh türü. Bu bitkisel zırh, dayanıklılığı tükenene ve parçalanana kadar her türlü fiziksel darbeden %d hasarını engelleyecektir. Zırh hareket etmediği için, hareket ettirmek parçalanmasına ve kaybolmasına neden olacaktır. Kalan zırh: %d.
plants.earthroot$armor.name=bitkisel zırh
plants.earthroot$seed.name=toprak kökü tohumu
plants.earthroot.desc=Bir canlı toprak köküne dokunduğunda, kökleri etrafında bir tür hareketsiz doğal zırh oluşturur.
plants.earthroot.name=toprak kökü
plants.earthroot.warden_desc=Toprak köklü bir bitkinin kökleri Muhafız ile birlikte hareket ederek ona hareketli ağaç kabuğu zırhı sağlayacaktır.
plants.fadeleaf$seed.name=solgun yapraklı bitkinin tohumu
plants.fadeleaf.desc=Bir fadeleaf'e dokunmak, herhangi bir yaratığı mevcut seviyedeki rastgele bir yere ışınlar.
plants.fadeleaf.name=solgun yaprak
plants.fadeleaf.warden_desc=Fadeleaf'in ışınlanma etkisi, Muhafız için daha güçlüdür ve onu önceki zindan seviyesinin sonuna geri ışınlar.
plants.firebloom$seed.name=ateş çiçeğinin tohumu
plants.firebloom.desc=Bir şey ateş çiçeğine dokunduğunda alev alır.
plants.firebloom.name=ateş çiçeği
plants.firebloom.warden_desc=Muhafız bir ateş çiçeğini ezdiğinde, zarar görmek yerine kısa süreliğine alevle kaplanacaktır.
plants.icecap$seed.name=buzulun tohumu
plants.icecap.desc=Buz örtüsüne dokunulduğunda, donmuş polen bulutu püskürtür. Ortam nemli olduğunda dondurma etkisi çok daha güçlü olur.
plants.icecap.name=buzul örtüsü
plants.icecap.warden_desc=Bir buzulun üzerinden geçtiğinde, Muhafız zarar görmek yerine kısa süreliğine buzla kaplanacaktır.
plants.mageroyal$seed.name=mageroyal tohumu
plants.mageroyal.desc=Mageroyal bitkisinin dikenli çiçekleri, güçlü bir nötrleştirici madde olarak bilinen bir kimyasal içerir. Bu bitkiye basan her şey birçok olumsuz etkiden arınır.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Kendinizi yenilenmiş hissediyorsunuz.
plants.mageroyal.warden_desc=Etkisizleştirme özelliğine ek olarak, Muhafız mageroyal üzerine bastığında geçici olarak tüm alanla sınırlı etkilere karşı bağışıklık kazanacaktır.
plants.plant$seed$placeholder.name=tohum
plants.plant$seed.ac_plant=BİTKİ
plants.plant$seed.info=Bu tohumu bitki yetiştirmek istediğiniz yere atın.\n\n%s
plants.plant$seed.seed_of=%s tohumu
plants.plant.discover_hint=Bu bitkiyi zindanda rastgele bulabilir veya ona ait tohumdan yetiştirebilirsiniz.
plants.plant.warden_desc=Bu bitkinin gardiyan tarafından kullanıldığında özel bir etkisi yoktur.
plants.rotberry$seed.discover_hint=Bu eşyayı belirli bir görev sırasında bulabilirsiniz.
plants.rotberry$seed.name=çürük meyve tohumu
plants.rotberry.desc=Genç bir çürük meyve çalısının meyveleri, tatlı mı tatlı bir ölüm gibi tadıyor. Birkaç yıl içinde bu çürük meyve çalısı başka bir çürük kalbe dönüşecek. Ezildiğinde, genç bir çürük meyve küçük bir zehirli gaz bulutu yayar.
plants.rotberry.discover_hint=Bu bitkiyi, belirli bir görev sırasında ona ait tohumdan yetiştirebilirsiniz.
plants.rotberry.name=çürük meyve
plants.rotberry.warden_desc=Normalde bir yaban mersini çalısı ezildiğinde sadece az miktarda gaz üretir, ancak Muhafız bu gazdan enerji alarak gücünü geçici olarak artırabiliyor!
plants.sorrowmoss$seed.name=keder yosunu tohumu
plants.sorrowmoss.desc=Acı yosunu, jilet gibi keskin yaprakları olan ve ölümcül bir zehirle kaplı bir çiçektir (yosun değil).
plants.sorrowmoss.name=üzüntü yosunu
plants.sorrowmoss.warden_desc=Muhafız bir keder yosununu çiğnediğinde, zarar görmek yerine kısa süreliğine zehirle dolacak.
plants.starflower$seed.name=yıldız çiçeği tohumu
plants.starflower.desc=Nadir bir bitki olan yıldızçiçeğinin, ona dokunan herkese kutsal güç bahşettiği söylenir.
plants.starflower.name=yıldız çiçeği
plants.starflower.warden_desc=Kutsanmanın yanı sıra, Muhafız bir yıldız çiçeğini ezdiğinde önemli miktarda asa şarjı da kazanacaktır.
plants.stormvine$seed.name=fırtına asmasının tohumu
plants.stormvine.desc=Yerçekimi, fırtına sarmaşığı bitkisini garip bir şekilde etkileyerek, ince mavi dallarının havada 'asılı kalmasına' neden olur. Sarmaşığa takılan her şey bundan etkilenir ve yönünü şaşırır.
plants.stormvine.name=fırtına asması
plants.stormvine.warden_desc=Muhafız, fırtına sarmaşığının yerçekimi etkisini kontrol edebiliyor ve birini ezdiğinde kısa süreliğine havaya yükseliyor.
plants.sungrass$health.desc=Ayçiçeği mükemmel iyileştirici özelliklere sahiptir, ancak iyileştirici bir iksire göre çok daha yavaştır. Bitkiden uzaklaşmak iyileştirici etkiyi bozar. Kalan iyileştirici etki:
plants.sungrass$health.name=bitkisel şifa
plants.sungrass$seed.name=ayçiçek tohumu
plants.sungrass.desc=Ayçiçeği, özsuyunun yavaş ama etkili iyileştirici özellikleriyle ünlüdür.
plants.sungrass.name=ayçiçek
plants.sungrass.warden_desc=Muhafız, ezilmiş güneş otundan uzaklaşsa bile şifa alabilir.
plants.swiftthistle$seed.name=hızlı dikenli bitki tohumu
plants.swiftthistle$timebubble.desc=Hızlandırılmış zamanın küçük bir balonu, eylemlerin anında gerçekleştirilmesine olanak tanır. Ancak saldırmak veya sihir kullanmak bu etkiyi bozar.\n\nKalan tur sayısı: %s.
plants.swiftthistle$timebubble.name=zaman balonu
plants.swiftthistle.desc=Çavdar dikeni ezildiğinde, etrafındaki zaman akışını kısa süreliğine hızlandırır ve ezenin birkaç eylemi anında gerçekleştirmesine olanak tanır.
plants.swiftthistle.name=hızlı dikenli
plants.swiftthistle.warden_desc=Anlık eylemler kazanmanın yanı sıra, Muhafız, hızlı dikenli çalılıkları ezdiğinde kısa süreli bir hız artışı da elde edecek.
