plants.blandfruitbush$seed.name=hạt của quả nhạt nhẽo
plants.blandfruitbush.desc=Là họ hàng xa của cây dâu tây dại, quả hình quả lê của cây dâu tây dại có vị như bụi đóng cục. Quả này trông gớm ghiếc và không chắc thịt nhưng không độc. Có lẽ có thể chế biến thành món ăn.
plants.blandfruitbush.discover_hint=Bạn có thể tìm thấy loại cây này một cách ngẫu nhiên trong hầm ngục.
plants.blandfruitbush.name=trái cây nhạt nhẽo
plants.blindweed$seed.name=hạt cây mù
plants.blindweed.desc=Khi bị chạm vào, cây mù tạt sẽ chết trong một luồng sáng chói lóa. Ánh sáng đó đủ mạnh để làm mất phương hướng trong vài giây.
plants.blindweed.name=cây mù
plants.blindweed.warden_desc=_Người cai ngục_ sẽ chuyển hóa năng lượng của cây cỏ dại thành một lớp màn tàng hình tạm thời, thay vì bị mất phương hướng.
plants.earthroot$armor.desc=Một loại giáp tự nhiên, bất động được làm từ vỏ cây và dây thừng.\n\nGiáp thảo dược này sẽ chặn %d sát thương từ bất kỳ đòn tấn công vật lý nào, cho đến khi nó hết độ bền và sụp đổ.\n\nVì giáp bất động, việc di chuyển sẽ khiến nó bị vỡ và mất đi.\n\nLượng giáp còn lại: %d.
plants.earthroot$armor.name=áo giáp thảo dược
plants.earthroot$seed.name=hạt giống rễ cây
plants.earthroot.desc=Khi một sinh vật chạm vào rễ cây, rễ cây sẽ tạo ra một lớp giáp tự nhiên bất động bao quanh nó.
plants.earthroot.name=rễ cây
plants.earthroot.warden_desc=Rễ của một loại cây thân đất sẽ di chuyển cùng với _Người Giám Hộ_, tạo nên lớp giáp da cây di động cho cô ấy.
plants.fadeleaf$seed.name=hạt của cây fadeleaf
plants.fadeleaf.desc=Chạm vào một chiếc lá biến mất sẽ dịch chuyển bất kỳ sinh vật nào đến một vị trí ngẫu nhiên trên màn chơi hiện tại.
plants.fadeleaf.name=lá rụng
plants.fadeleaf.warden_desc=Hiệu ứng dịch chuyển tức thời của Fadeleaf mạnh hơn đối với _Người Giám Hộ_, dịch chuyển cô ấy trở lại cuối cấp độ hầm ngục trước đó.
plants.firebloom$seed.name=hạt giống hoa lửa
plants.firebloom.desc=Khi vật gì đó chạm vào hoa lửa, nó sẽ bốc cháy.
plants.firebloom.name=hoa lửa
plants.firebloom.warden_desc=Khi giẫm lên một bông hoa lửa, _Người Giám Hộ_ sẽ tạm thời được bao phủ bởi ngọn lửa thay vì bị tổn thương.
plants.icecap$seed.name=mầm mống của chỏm băng
plants.icecap.desc=Khi bị chạm vào, một tảng băng sẽ phun ra một luồng phấn hoa đóng băng. Hiệu ứng đóng băng sẽ mạnh hơn nhiều nếu môi trường ẩm ướt.
plants.icecap.name=chỏm băng
plants.icecap.warden_desc=Khi giẫm lên một tảng băng, _Người Giám Hộ_ sẽ bị bao phủ bởi băng giá trong chốc lát thay vì bị thương.
plants.mageroyal$seed.name=hạt giống mageroyal
plants.mageroyal.desc=Những bông hoa gai của cây mageroyal chứa một chất hóa học được biết đến với đặc tính trung hòa mạnh. Bất cứ thứ gì giẫm lên cây này sẽ được thanh tẩy khỏi nhiều tác động tiêu cực.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Bạn cảm thấy sảng khoái.
plants.mageroyal.warden_desc=Ngoài tác dụng vô hiệu hóa, _Người cai ngục_ sẽ tạm thời miễn nhiễm với tất cả các hiệu ứng giới hạn khu vực khi bước lên mageroyal.
plants.plant$seed$placeholder.name=hạt giống
plants.plant$seed.ac_plant=THỰC VẬT
plants.plant$seed.info=Hãy gieo hạt giống này vào nơi bạn muốn trồng cây.\n\n%s
plants.plant$seed.seed_of=hạt giống của %s
plants.plant.discover_hint=Bạn có thể tìm thấy loại cây này một cách ngẫu nhiên trong hầm ngục, hoặc trồng nó từ hạt giống đi kèm.
plants.plant.warden_desc=Loại cây này không có tác dụng đặc biệt nào khi được Quản ngục sử dụng.
plants.rotberry$seed.discover_hint=Bạn có thể tìm thấy vật phẩm này trong một nhiệm vụ cụ thể.
plants.rotberry$seed.name=hạt dâu tây
plants.rotberry.desc=Quả của cây dâu tây dại non có vị ngọt như tử thần. Sau vài năm, cây dâu tây dại này sẽ phát triển thành một "trái tim thối rữa" khác. Khi bị giẫm đạp, cây dâu tây dại non sẽ tạo ra một luồng khí độc nhỏ.
plants.rotberry.discover_hint=Bạn có thể trồng loại cây này từ hạt giống của nó trong một nhiệm vụ cụ thể.
plants.rotberry.name=quả mâm xôi
plants.rotberry.warden_desc=Thông thường, bụi cây dâu rừng chỉ tạo ra một ít khí khi bị giẫm đạp, nhưng _Người Giám Hộ_ có thể khai thác năng lượng từ nó để tạm thời tăng cường sức mạnh!
plants.sorrowmoss$seed.name=hạt giống của rêu buồn
plants.sorrowmoss.desc=Cây hoa sầu (snorkels) là một loài hoa (không phải rêu) có cánh hoa sắc nhọn như dao cạo, được bao phủ bởi một chất độc chết người.
plants.sorrowmoss.name=rêu buồn
plants.sorrowmoss.warden_desc=Khi giẫm lên cây rêu sầu muộn, _Người cai ngục_ sẽ bị nhiễm độc trong chốc lát thay vì bị thương.
plants.starflower$seed.name=hạt giống hoa sao
plants.starflower.desc=Hoa sao là một loài thực vật quý hiếm, được cho là ban tặng sức mạnh thần thánh cho bất cứ ai chạm vào nó.
plants.starflower.name=hoa sao
plants.starflower.warden_desc=Ngoài việc được ban phước, _Người Giám Hộ_ sẽ nhận được một lượng năng lượng sạc lại đũa phép đáng kể khi cô ấy giẫm lên một bông hoa sao.
plants.stormvine$seed.name=hạt giống cây dây leo bão
plants.stormvine.desc=Trọng lực tác động lên cây dây leo bão tố một cách kỳ lạ, khiến những xúc tu màu xanh mỏng manh của nó "lơ lửng" trong không khí. Bất cứ thứ gì bị mắc kẹt trong dây leo đều bị ảnh hưởng và trở nên mất phương hướng.
plants.stormvine.name=dây leo bão
plants.stormvine.warden_desc=_Người cai ngục_ có khả năng điều khiển lực hấp dẫn của cây dây leo bão và sẽ lơ lửng trong chốc lát khi giẫm lên một cây.
plants.sungrass$health.desc=Cỏ hướng dương có đặc tính chữa lành tuyệt vời, mặc dù tác dụng chậm hơn nhiều so với thuốc chữa lành. Việc rời khỏi cây sẽ làm mất tác dụng chữa lành.
plants.sungrass$health.name=chữa bệnh bằng thảo dược
plants.sungrass$seed.name=hạt cỏ hướng dương
plants.sungrass.desc=Cỏ hướng dương nổi tiếng với nhựa cây có đặc tính chữa lành chậm nhưng hiệu quả.
plants.sungrass.name=cỏ mặt trời
plants.sungrass.warden_desc=_Người cai ngục_ có thể nhận được sự hồi phục từ cỏ hướng dương bị giẫm nát ngay cả khi cô ấy di chuyển ra xa khỏi nó.
plants.swiftthistle$seed.name=hạt cây bồ công anh
plants.swiftthistle$timebubble.desc=Một bong bóng thời gian nhỏ được tăng tốc, cho phép thực hiện các hành động ngay lập tức. Tuy nhiên, tấn công hoặc sử dụng phép thuật sẽ phá vỡ hiệu ứng này.\n\nSố lượt còn lại: %s.
plants.swiftthistle$timebubble.name=bong bóng thời gian
plants.swiftthistle.desc=Khi bị giẫm lên, cây kế gai sẽ tạm thời tăng tốc dòng chảy thời gian xung quanh nó, cho phép người giẫm lên thực hiện một số hành động ngay lập tức.
plants.swiftthistle.name=cây kế gai
plants.swiftthistle.warden_desc=Ngoài việc nhận được các hành động tức thời, _Người Giám Hộ_ cũng sẽ nhận được một chút tăng tốc khi giẫm lên cây kế gai.
