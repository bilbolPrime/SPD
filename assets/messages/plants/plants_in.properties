plants.blandfruitbush$seed.name=biji buah hambar
plants.blandfruitbush.desc=Sepupu jauh dari rotberry, buah semak blandfruit yang berbentuk pir ini rasanya seperti debu yang mengeras. Buahnya menjijikkan dan tidak berisi, tetapi tidak beracun. Mungkin bisa dimasak.
plants.blandfruitbush.discover_hint=Anda dapat menemukan tanaman ini secara acak di dalam ruang bawah tanah.
plants.blandfruitbush.name=buah hambar
plants.blindweed$seed.name=biji gulma buta
plants.blindweed.desc=Saat disentuh, tanaman blindweed akan mati dalam kilatan cahaya terang. Kilatan cahaya tersebut cukup kuat untuk membuat seseorang kehilangan orientasi selama beberapa detik.
plants.blindweed.name=gulma buta
plants.blindweed.warden_desc=Sang Penjaga akan menyalurkan energi tanaman buta ke dalam selubung tembus pandang sementara, alih-alih mengalami disorientasi.
plants.earthroot$armor.desc=Sejenis baju besi alami dan tidak bergerak yang terbuat dari kulit kayu dan tali.\n\nBaju besi herbal ini akan memblokir %d kerusakan dari serangan fisik apa pun, sampai akhirnya kehabisan daya tahan dan runtuh.\n\nKarena baju besi ini tidak bergerak, bergerak akan menyebabkannya hancur dan hilang.\n\nSisa baju besi: %d.
plants.earthroot$armor.name=baju besi herbal
plants.earthroot$seed.name=biji akar tanah
plants.earthroot.desc=Ketika suatu makhluk menyentuh akar tanah, akarnya akan menciptakan semacam perisai alami yang tidak bergerak di sekelilingnya.
plants.earthroot.name=akar bumi
plants.earthroot.warden_desc=Akar tanaman earthroot akan bergerak bersama _sang Penjaga_, memberinya baju zirah kulit kayu yang dapat dipindahkan.
plants.fadeleaf$seed.name=biji daun pudar
plants.fadeleaf.desc=Menyentuh daun fadeleaf akan memindahkan makhluk apa pun ke tempat acak di level saat ini.
plants.fadeleaf.name=daun pudar
plants.fadeleaf.warden_desc=Efek teleportasi dari fadeleaf lebih ampuh bagi _sang Penjaga_, yang memindahkannya kembali ke akhir level penjara bawah tanah sebelumnya.
plants.firebloom$seed.name=benih bunga api
plants.firebloom.desc=Ketika sesuatu menyentuh bunga api, benda itu akan langsung terbakar.
plants.firebloom.name=bunga api
plants.firebloom.warden_desc=Saat dia menginjak bunga api, _Sang Penjaga_ akan dirasuki api untuk sementara waktu alih-alih terluka.
plants.icecap$seed.name=benih tudung es
plants.icecap.desc=Saat disentuh, lapisan es akan mengeluarkan semburan serbuk sari yang membeku. Efek pembekuan akan jauh lebih kuat jika lingkungan sekitarnya lembap.
plants.icecap.name=es
plants.icecap.warden_desc=Saat dia menginjak lapisan es, _sang Penjaga_ akan diselimuti embun beku untuk sementara waktu, alih-alih terluka.
plants.mageroyal$seed.name=benih mageroyal
plants.mageroyal.desc=Bunga berduri dari tanaman mageroyal mengandung zat kimia yang dikenal memiliki sifat sebagai agen penetralisir yang kuat. Apa pun yang menginjak tanaman ini akan dibersihkan dari banyak efek negatif.
plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=Anda merasa segar.
plants.mageroyal.warden_desc=Selain efek penetralan, _Sang Penjaga_ akan menjadi kebal sementara terhadap semua efek yang terbatas pada area tertentu saat menginjak mageroyal.
plants.plant$seed$placeholder.name=benih
plants.plant$seed.ac_plant=TANAMAN
plants.plant$seed.info=Taburkan benih ini ke tempat yang ingin Anda tanam tanaman.\n\n%s
plants.plant$seed.seed_of=Kode awal %s
plants.plant.discover_hint=Anda dapat menemukan tanaman ini secara acak di dalam ruang bawah tanah, atau menumbuhkannya dari biji yang terkait dengannya.
plants.plant.warden_desc=Tanaman ini tidak memiliki efek khusus saat digunakan oleh Sipir.
plants.rotberry$seed.discover_hint=Anda dapat menemukan item ini selama misi tertentu.
plants.rotberry$seed.name=biji rotberry
plants.rotberry.desc=Buah beri dari semak rotberry muda rasanya seperti kematian yang manis, manis. Dalam beberapa tahun, semak rotberry ini akan tumbuh menjadi jantung busuk yang lain. Saat diinjak, rotberry muda akan menghasilkan kepulan kecil gas beracun.
plants.rotberry.discover_hint=Anda dapat menumbuhkan tanaman ini dari bijinya selama misi tertentu.
plants.rotberry.name=rotberry
plants.rotberry.warden_desc=Biasanya semak rotberry hanya menghasilkan sedikit gas saat diinjak, tetapi _Sipir_ mampu memanfaatkan energi darinya untuk meningkatkan kekuatannya sementara waktu!
plants.sorrowmoss$seed.name=biji lumut duka
plants.sorrowmoss.desc=Sorrowmoss adalah bunga (bukan lumut) dengan kelopak yang sangat tajam, dilapisi racun mematikan.
plants.sorrowmoss.name=lumut duka
plants.sorrowmoss.warden_desc=Ketika dia menginjak lumut kesedihan, _sang Penjaga_ akan terkena racun untuk sementara waktu, bukannya terluka.
plants.starflower$seed.name=biji bunga bintang
plants.starflower.desc=Bunga bintang, tanaman langka, konon memberikan kekuatan suci kepada siapa pun yang menyentuhnya.
plants.starflower.name=bunga bintang
plants.starflower.warden_desc=Selain mendapatkan berkah, _Sang Penjaga_ akan memperoleh pengisian ulang tongkat sihir dalam jumlah signifikan ketika dia menginjak bunga bintang.
plants.stormvine$seed.name=biji tanaman merambat badai
plants.stormvine.desc=Gravitasi memengaruhi tanaman stormvine dengan cara yang aneh, memungkinkan sulur-sulur birunya yang tipis untuk 'menggantung' di udara. Apa pun yang terperangkap dalam sulur tersebut akan terpengaruh dan menjadi kehilangan orientasi.
plants.stormvine.name=tanaman merambat badai
plants.stormvine.warden_desc=_Sang Penjaga_ mampu mengendalikan efek gravitasi dari tanaman badai, dan akan melayang sesaat ketika dia menginjak salah satunya.
plants.sungrass$health.desc=Sungrass memiliki khasiat penyembuhan yang sangat baik, meskipun jauh lebih lambat daripada ramuan penyembuhan. Berpindah dari tanaman akan menghentikan efek penyembuhan. Sisa penyembuhan: %d.
plants.sungrass$health.name=pengobatan herbal
plants.sungrass$seed.name=biji rumput matahari
plants.sungrass.desc=Sungrass terkenal karena getahnya memiliki khasiat penyembuhan yang lambat namun efektif.
plants.sungrass.name=rumput matahari
plants.sungrass.warden_desc=Sang Penjaga dapat menerima penyembuhan dari rumput matahari yang terinjak meskipun dia menjauhinya.
plants.swiftthistle$seed.name=biji swiftthistle
plants.swiftthistle$timebubble.desc=Gelembung kecil waktu yang dipercepat, memungkinkan tindakan dilakukan secara instan. Namun, menyerang atau menggunakan sihir akan membatalkan efek ini.\n\nGiliran tersisa: %s.
plants.swiftthistle$timebubble.name=gelembung waktu
plants.swiftthistle.desc=Saat diinjak, swiftthistle akan mempercepat aliran waktu di sekitarnya untuk sementara waktu, memungkinkan penginjak untuk melakukan beberapa tindakan secara instan.
plants.swiftthistle.name=duri cepat
plants.swiftthistle.warden_desc=Selain mendapatkan aksi instan, _Penjaga_ juga akan mendapatkan peningkatan kecepatan singkat saat menginjak swiftthistle.
