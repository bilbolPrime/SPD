items.scrolls.scrolloffrostlevel.name=Свиток инея
items.scrolls.scrolloffrostlevel.desc=От этого пергамента веет холодом.\n\nСвиток также можно разорвать в любом месте, чтобы заморозить всех врагов на этаже до получения ими урона. На боссов и существ с иммунитетом к заморозке это не действует. Это не наносит урона.
items.scrolls.scrolloffrostlevel.ac_tear=Разорвать
items.scrolls.scrolloffrostlevel.tear_confirm=Если разорвать этот свиток, его магия заморозит всех врагов на этаже до получения ими урона. На боссов и существ с иммунитетом к заморозке это не действует. Это не наносит урона.\n\nРазорвать свиток?
items.scrolls.scrolloffrostlevel.wrong_place=Здесь свиток не действует.
items.scrolls.scrolloffrostlevel.spent=Проход уже открыт. Свиток молчит.
items.keys.key.ice_depth=Этот ключ от этажа %d Ледяных пещер.
scenes.interlevelscene$mode.frost=Вход в Ледяные пещеры...
levels.icecaveslevel.water_name=Ледяная вода
levels.icecaveslevel.water_desc=Тонкая корка льда ломается под ногами.
levels.icecaveslevel.wall_desc=Следы кирок скрыты под толстыми ледяными жилами. Шахтёры покинули эти выработки, когда холод проник в породу.
levels.cavesbosslevel.collapsed_name=Обвалившаяся пещера
levels.cavesbosslevel.collapsed_desc=Обвалившаяся пещера. Сквозь завал не пройти.
actors.buffs.frostbite.name=Обморожение
actors.buffs.frostbite.desc=Холод замедляет ваше передвижение на 20%.
actors.mobs.rimebat.name=Инеевая летучая мышь
actors.mobs.rimebat.desc=Эти бледные летучие мыши гнездятся подо льдом. Их холодный укус ненадолго замедляет передвижение, давая им время зайти на новую атаку.\n\nЗаморозка и магия холода не действуют.
actors.mobs.iceclaw.name=Ледокоготь
actors.mobs.iceclaw.desc=Падальщик с панцирем из плотного льда. Перед боем он ненадолго утолщает свою броню. Огонь плавит эту дополнительную защиту.\n\nЗаморозка и магия холода не действуют.
actors.mobs.frostback.name=Гнолл-ледоспин
actors.mobs.frostback.desc=Этот гнолл пережил холода, грабя неосторожных путников. Когда он поднимает оружие, отойдите: тяжёлый удар придётся по месту, где вы стояли.\n\nЗаморозка и магия холода не действуют.
actors.mobs.shardling.name=Осколочник
actors.mobs.shardling.desc=Беспокойный сгусток ледяных кристаллов. Он целится, затем выпускает осколки по прямой. Стены останавливают залп.\n\nЗаморозка и магия холода не действуют.
actors.mobs.hollowminer.name=Пустой шахтёр
actors.mobs.hollowminer.desc=Этот шахтёр так и не выбрался из замёрзших выработок. Его фонарь ещё горит, хотя хозяин давно мёртв. Если дать ему поднять фонарь, он созовёт ближайших существ на бой. Попадание прерывает сигнал.\n\nЗаморозка и магия холода не действуют.
actors.mobs.rimehorn.name=Инеерог
actors.mobs.rimehorn.desc=Тяжёлый зверь с инеем в шерсти. Он роет землю копытом, прежде чем броситься по прямой. Уйдите с его пути, пока он готовится.\n\nЗаморозка и магия холода не действуют.
actors.mobs.oldrime.name=Старый Иней
actors.mobs.oldrime.desc=Шахтёры нашли Старого Инея под горой, во льду, который был старше их тоннелей. Стук кирок разбудил его. Теперь он охраняет замёрзшие выработки и проход за ними. По мере ослабления его броня откалывается, освобождая конечности. Берегитесь тяжёлых ударов, льда, пробивающего пол, и ледяного дыхания.\n\nЗаморозка и магия холода не действуют.
actors.mobs.oldrime.warning=Старый Иней замахивается для удара!
windows.wndjournal.ice_depth=Лёд %d
levels.icebosslevel.exit_name=Пещерный проход
levels.icebosslevel.exit_desc=Узкий проход уходит вглубь горы.
levels.icebosslevel.blocked_name=Замёрзший проход
levels.icebosslevel.blocked_desc=Ледяная стена преграждает проход за Старым Инеем.
items.weapon.ice.wrong_hero=Это оружие не для вас.
items.weapon.ice.already_enchanted=Это оружие уже зачаровано.
items.weapon.ice.glaciercleaver.name=Ледниковый тесак
items.weapon.ice.glaciercleaver.desc=Широкое лезвие, вырубленное из льда Старого Инея. Попадание покрывает цель инеем на четыре хода. Следующий удар Ледниковым тесаком раскалывает его, нанося %d дополнительного урона. Только Воин может им владеть.
actors.buffs.frostcoating.name=Покрыт инеем
actors.buffs.frostcoating.desc=Тонкий слой инея покрывает это существо. Удар Ледникового тесака расколет его.
items.weapon.ice.hoarfroststaff.name=Посох изморози
items.weapon.ice.hoarfroststaff.desc=Между зубцами посоха собирается холод. Его снаряды наносят %d-%d урона до бонусов навыков и замедляют передвижение и атаки на два хода. Изначально вмещает три заряда и перезаряжается как жезл. Только Маг может им владеть.
items.weapon.ice.rimepick.name=Инеевая кирка
items.weapon.ice.rimepick.desc=Эта узкая ледяная кирка находит щели в броне. Она обходит четверть брони цели, а если цель застигнута врасплох — половину. Только Разбойник может ею владеть.
items.weapon.ice.frostbow.name=Морозный лук
items.weapon.ice.frostbow.desc=Стрелы этого лука разлетаются острыми льдинками при попадании. Они наносят цели на %d%% больше урона, а соседним врагам — четверть урона этого попадания. Осколки не замораживают жертв. Только Охотница может им владеть.
items.weapon.ice.gravefrostscythe.name=Коса могильного инея
items.weapon.ice.gravefrostscythe.desc=Иней покрывает обмотанную костями рукоять косы. Пока она экипирована, ваши призванные скелеты и призраки наносят %d дополнительного урона холодом за удар. Только Некромант может ею владеть.
items.weapon.ice.frostbiterifle.name=Винтовка обморожения
items.weapon.ice.frostbiterifle.desc=Камора этой винтовки покрыта нетающим льдом. Каждый выстрел, попавший в цель, вызывает обморожение на два хода, замедляя передвижение на 20%. Новые попадания обновляют эффект. Только Наёмник может ею владеть.
library.ice_weapon_drop=Для каждого героя выпадает одно оружие, соответствующее его классу.

actors.mobs.npcs.prospector.name=Застрявший старатель
actors.mobs.npcs.prospector.desc=Старатель в залатанном пальто укрылся у лестницы. Его лампа едва горит.
actors.mobs.npcs.prospector.torches=Моя лампа скоро погаснет. Когда убегал, оставил сундук с припасами на этом этаже. Принесёшь из него _три факела_?
actors.mobs.npcs.prospector.iceclaws=Ледокогти выгнали меня из штольни. Убей _трёх ледокогтей на этом этаже_, чтобы я мог вернуться к работе.
actors.mobs.npcs.prospector.accept=Я помогу.
actors.mobs.npcs.prospector.later=Не сейчас.
actors.mobs.npcs.prospector.need_torches=Мне нужны _три факела_. Сундук всё ещё где-то на этом этаже.
actors.mobs.npcs.prospector.claws_left=Осталось убить ледокогтей: _%d_.
actors.mobs.npcs.prospector.reward=Хорошая работа. Что выберешь?
actors.mobs.npcs.prospector.rations=Два рациона питания
actors.mobs.npcs.prospector.thanks=Одной заботой меньше. Спасибо.
library.quest.prospector_torches.name=Гаснущая лампа
library.quest.prospector_torches.desc=Принесите застрявшему старателю три факела. В сундуке на его этаже их достаточно.
library.quest.prospector_iceclaws.name=Ледокогти в штольне
library.quest.prospector_iceclaws.desc=Убейте трёх ледокогтей на этаже старателя и вернитесь к нему.
library.quest.prospector.reward=Выберите свиток улучшения или два рациона питания.
items.scrolls.scrolloffrostlevel.read_confirm=Во время чтения вы чувствуете, что вот-вот телепортируетесь.
