items.bags.keyring.name=porte-clés
items.bags.keyring.info=Il s'agit d'un porte-clés en cuivre qui vous permet de ranger toutes vos clés séparément du reste de vos affaires.
levels.sign.dead_end=Que faites-vous ici?!
levels.sign.tip_02=Toutes les portes du donjon ne sont pas visibles au premier coup d'œil. Si vous êtes bloqué, cherchez les portes cachées.
levels.sign.tip_03=N'oubliez pas qu'augmenter votre force n'est pas le seul moyen d'accéder à un meilleur équipement. Vous pouvez aussi réduire la force requise grâce aux Parchemins d'amélioration.
levels.sign.tip_04=Vous pouvez dépenser votre or dans les boutiques situées aux niveaux les plus profonds du donjon. La première se trouve au niveau 6.
levels.sign.tip_09=Une attaque surprise a plus de chances de réussir. Par exemple, vous pouvez tendre une embuscade à votre ennemi derrière une porte fermée lorsque vous savez qu'il approche.
levels.sign.tip_13=Si vous êtes en feu, vous ne pouvez pas éteindre le feu dans l'eau tout en lévitant.
levels.sign.tip_21=Pixel-Mart. Prix spéciaux pour les chasseurs de démons !
actors.hero.herosubclass.gladiator_legacy_desc=Une attaque réussie avec une arme de mêlée permet au _Gladiateur_ de commencer un combo. Chaque coup réussi à la suite inflige davantage de dégâts.
actors.hero.herosubclass.berserker_legacy_desc=Lorsqu'il est gravement blessé, le _Berserker_ entre dans une rage qui augmente considérablement ses dégâts.
actors.hero.herosubclass.warlock_legacy_desc=Après avoir tué un ennemi, le _Sorcier_ dévore son âme. Cela soigne ses blessures et apaise sa faim.
actors.hero.herosubclass.battlemage_legacy_desc=Lorsqu'il combat avec une baguette en main, le _Mage de guerre_ inflige des dégâts supplémentaires selon le nombre de charges restantes. Chaque coup réussi rend une charge à la baguette.
actors.hero.herosubclass.assassin_legacy_desc=Lorsqu'il effectue une attaque surprise, l'_Assassin_ inflige des dégâts supplémentaires à sa cible.
actors.hero.herosubclass.freerunner_legacy_desc=Le _Coureur libre_ peut se déplacer presque deux fois plus vite que la plupart des monstres. Il est aussi bien plus difficile à toucher lorsqu'il court, à condition de ne pas être encombré ni affamé.
actors.hero.herosubclass.sniper_legacy_desc=Le _Tireur d'élite_ repère les points faibles de l'armure ennemie et l'ignore lorsqu'il utilise une arme de jet.
actors.hero.herosubclass.warden_legacy_desc=Son lien avec la nature permet au _Gardien_ de récolter des gouttes de rosée et des graines sur les plantes. Piétiner les hautes herbes lui accorde aussi une protection temporaire.
actors.hero.herosubclass.marshal_legacy_desc=Une attaque réussie avec une arme de mêlée permet au _Marshal_ de commencer un combo. Chaque coup réussi à la suite inflige davantage de dégâts.
actors.hero.herosubclass.executioner_legacy_desc=Lorsqu'il est gravement blessé, le _Bourreau_ entre dans une rage qui augmente considérablement ses dégâts.
actors.blobs.waterofawareness.drink_message=À chaque gorgée, vous sentez le savoir vous envahir. Vous connaissez désormais tout de votre équipement. Vous percevez également tous les objets présents dans le niveau et en connaissez tous les secrets.
