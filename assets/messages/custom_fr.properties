levels.sign.burn=Alors que vous tentez de lire le panneau, il s'embrase de flammes verdâtres.
levels.sign.tip_01=Ne surestimez pas votre force, utilisez des armes et une armure que vous pouvez manier.
levels.sign.tip_05=Attention à la substance gluante !
levels.sign.tip_06=Pixel-Mart - tout ce dont vous avez besoin pour une aventure réussie !
levels.sign.tip_07=Identifiez vos potions et parchemins dès que possible. N'attendez pas le moment où vous en aurez réellement besoin.
levels.sign.tip_08=Avoir faim ne fait pas mal, mais mourir de faim, si.
levels.sign.tip_10=Ne laissez pas sortir le Tengu !
levels.sign.tip_11=Pixel-Mart. Dépensez de l'argent. Vivez plus longtemps.
levels.sign.tip_12=Lorsque vous êtes attaqué par plusieurs monstres simultanément, essayez de vous réfugier derrière une porte.
levels.sign.tip_14=Il est inutile de posséder plus d'une Ankh à la fois, car vous les perdrez lors de votre résurrection.
levels.sign.tip_15=DANGER ! Les machines lourdes peuvent causer des blessures, des amputations ou la mort !
levels.sign.tip_16=Pixel-Mart. Une vie plus sûre dans le donjon.
levels.sign.tip_17=Lorsque vous améliorez une arme enchantée, il existe une chance de détruire cet enchantement.
levels.sign.tip_18=Les armes et les armures se détériorent plus vite que les baguettes et les anneaux, mais il existe plus de moyens de les réparer.
levels.sign.tip_19=Le seul moyen d'obtenir un Parchemin d'Anéantissement est de le recevoir en cadeau des esprits du donjon.
levels.sign.tip_20=Aucune arme n'est autorisée en présence de Sa Majesté !
