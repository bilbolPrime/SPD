custom.difficulty.super_easy=Super facile
custom.difficulty.super_easy.desc=- Commencez avec 5 rations supplémentaires.\n- Commencez avec 5 potions de soin.\n- Commencez avec 500 pièces d'or.\n- Commencez avec 3 cristaux d'âme.\n- Les monstres sont faibles, infligent 50 % de dégâts en moins, subissent 50 % de dégâts en plus et ont 50 % de points de vie en moins.\n- Taux d'apparition des champions fixé à 10 %.\n- Taux d'obtention des champions fixé à 10 %.
custom.difficulty.easy=Facile
custom.difficulty.easy.desc=- Commencez avec 2 rations supplémentaires.\n- Commencez avec 2 potions de soin.\n- Commencez avec 200 pièces d'or.\n- Commencez avec 2 cristaux d'âme.\n- Bonus pour la découverte de portes et pièges cachés.\n- Les monstres sont faibles, infligent 25 % de dégâts en moins, subissent 10 % de dégâts en plus et ont 15 % de points de vie en moins.\n- Taux d'apparition des champions fixé à 10 %.\n- Taux d'obtention des champions fixé à 30 %.
custom.difficulty.hell=Enfer
custom.difficulty.hell.desc=- La potion de soin soigne 50 % des PV max.\n- Les monstres sont immortels, infligent 35 % de dégâts supplémentaires, subissent 30 % de dégâts en moins et ont 45 % de PV supplémentaires.\n- Le taux d'apparition des champions est fixé à 50 %.\n- Le héros commence avec 4 PV max en moins.\n- Le héros gagne 1 PV max en moins à chaque niveau.\n- Le taux d'obtention des champions est fixé à 70 %.
custom.difficulty.nightmare=Cauchemar
custom.difficulty.nightmare.desc=- La potion de soin soigne 25 % des PV max.\n- Les monstres sont surpuissants : ils infligent 45 % de dégâts supplémentaires, subissent 30 % de dégâts en moins et ont 60 % de PV supplémentaires.\n- Le taux d'apparition des champions est fixé à 70 %.\n- Le héros commence avec 8 PV max en moins.\n- Le héros gagne 3 PV max en moins à chaque niveau.\n- Le taux d'obtention des champions est fixé à 90 %.
custom.difficulty.normal=Normale
custom.difficulty.normal.desc=- Les monstres sont standards.\n- Taux d'apparition des champions fixé à 20 %.\n- Taux de butin des champions fixé à 40 %.
custom.difficulty.hard=Dur
custom.difficulty.hard.desc=- La potion de soin soigne 75 % des PV max.\n- Les monstres sont forts, infligent 10 % de dégâts supplémentaires, subissent 10 % de dégâts en moins et ont 20 % de PV en plus.\n- Taux d'apparition des champions fixé à 30 %.\n- Taux d'obtention des champions fixé à 50 %.
custom.difficulty.just_kill_me=Tuez-moi
custom.difficulty.just_kill_me.desc=- Débute avec deux potions d'expérience.\n- La potion de soin soigne 10 % des PV max.\n- Les monstres sont des divinités, infligent 60 % de dégâts supplémentaires, subissent 40 % de dégâts en moins et ont 75 % de PV supplémentaires.\n- Taux d'apparition des champions fixé à 100 %.\n- Le héros commence avec 8 PV max en moins.\n- Le héros gagne 3 PV max en moins à chaque niveau.\n- Taux d'obtention des champions fixé à 100 %.
