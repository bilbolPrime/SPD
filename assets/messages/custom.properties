items.bags.keyring.info=This is a copper key ring, that lets you keep all your keys separately from the rest of your belongings.
levels.sign.dead_end=What are you doing here?!
levels.sign.tip_01=Don't overestimate your strength, use weapons and armor you can handle.
levels.sign.tip_02=Not all doors in the dungeon are visible at first sight. If you are stuck, search for hidden doors.
levels.sign.tip_03=Remember, that raising your strength is not the only way to access better equipment. You can go the other way, lowering its strength requirement with Scrolls of Upgrade.
levels.sign.tip_04=You can spend your gold in shops on deeper levels of the dungeon. The first one is on the 6th level.
levels.sign.tip_05=Beware of Goo!
levels.sign.tip_06=Pixel-Mart - all you need for successful adventure!
levels.sign.tip_07=Identify your potions and scrolls as soon as possible. Don't put it off to the moment when you actually need them.
levels.sign.tip_08=Being hungry doesn't hurt, but starving does hurt.
levels.sign.tip_09=Surprise attack has a better chance to hit. For example, you can ambush your enemy behind a closed door when you know it is approaching.
levels.sign.tip_10=Don't let The Tengu out!
levels.sign.tip_11=Pixel-Mart. Spend money. Live longer.
levels.sign.tip_12=When you're attacked by several monsters at the same time, try to retreat behind a door.
levels.sign.tip_13=If you are burning, you can't put out the fire in the water while levitating.
levels.sign.tip_14=There is no sense in possessing more than one Ankh at the same time, because you will lose them upon resurrecting.
levels.sign.tip_15=DANGER! Heavy machinery can cause injury, loss of limbs or death!
levels.sign.tip_16=Pixel-Mart. A safer life in dungeon.
levels.sign.tip_17=When you upgrade an enchanted weapon, there is a chance to destroy that enchantment.
levels.sign.tip_18=Weapons and armors deteriorate faster than wands and rings, but there are more ways to fix them.
levels.sign.tip_19=The only way to obtain a Scroll of Wipe Out is to receive it as a gift from the dungeon spirits.
levels.sign.tip_20=No weapons allowed in the presence of His Majesty!
levels.sign.tip_21=Pixel-Mart. Special prices for demon hunters!
levels.sign.burn=As you try to read the sign it bursts into greenish flames.
