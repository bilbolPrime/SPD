levels.sign.burn=När du försöker läsa skylten brister den ut i grönaktiga lågor.
levels.sign.tip_01=Överskatta inte din styrka, använd vapen och rustningar du kan hantera.
levels.sign.tip_05=Se upp för Goo!
levels.sign.tip_06=Pixel-Mart - allt du behöver för ett lyckat äventyr!
levels.sign.tip_07=Identifiera dina trolldrycker och skriftrullar så snart som möjligt. Skjut det inte upp till det ögonblick då du faktiskt behöver dem.
levels.sign.tip_08=Att vara hungrig skadar inte, men att svälta gör ont.
levels.sign.tip_10=Släpp inte ut Tengu!
levels.sign.tip_11=Pixel-Mart. Spendera pengar. Lev längre.
levels.sign.tip_12=När du blir attackerad av flera monster samtidigt, försök att dra dig tillbaka bakom en dörr.
levels.sign.tip_14=Det är ingen mening med att äga mer än en Ankh samtidigt, eftersom du kommer att förlora dem vid återuppståndelsen.
levels.sign.tip_15=FARA! Tunga maskiner kan orsaka skador, förlust av lemmar eller dödsfall!
levels.sign.tip_16=Pixel-Mart. Ett säkrare liv i fängelsehålan.
levels.sign.tip_17=När du uppgraderar ett förtrollat vapen finns det en chans att förstöra den förtrollningen.
levels.sign.tip_18=Vapen och rustningar försämras snabbare än trollstavar och ringar, men det finns fler sätt att fixa dem.
levels.sign.tip_19=Det enda sättet att få en Scroll of Wipe Out är att ta emot den som en gåva från fängelsehålans andar.
levels.sign.tip_20=Inga vapen tillåtna i Hans Majestäts närvaro!
