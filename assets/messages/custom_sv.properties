custom.difficulty.easy=Lätt
custom.difficulty.easy.desc=- Börja med 2 extra ransoner.\n- Börja med 2 helande drycker.\n- Börja med 200 guld.\n- Börja med 2 själskristaller.\n- Bonus för att upptäcka dolda dörrar och fällor.\n- Mobs är svaga, gör 25 % mindre skada, tar 10 % mer skada och har 15 % mindre HP.\n- Mästares spawnfrekvens inställd på 10 %.\n- Mästares droppfrekvens inställd på 30 %.
custom.difficulty.hard=Hård
custom.difficulty.hard.desc=- Läkande dryck läker 75 % max HP.\n- Mobs är starka, gör 10 % extra skada, tar 10 % mindre skada och har 20 % mer HP.\n- Spawnfrekvens för mästare inställd på 30 %.\n- Fallfrekvens för mästare inställd på 50 %.
custom.difficulty.hell.desc=- Läkande dryck läker 50 % max HP. \n - Mobs är odödliga, gör 35 % mer skada, tar 30 % mindre skada och har 45 % mer HP. \n - Mästarnas spawnfrekvens inställd på 50 %. \n - Hjälten börjar med 4 mindre max HP. \n - Hjälten får 1 mindre max HP vid leveling. \n - Mästarnas fallfrekvens inställd på 70 %.
custom.difficulty.just_kill_me=Döda mig bara
custom.difficulty.just_kill_me.desc=- Börjar med två erfarenhetsdryck. ZXQPH0 ZXQ - Läkande dryck läker 10 % max HP. ZXQPH1 ZXQ - Mobs är gudar, gör 60 % mer skada, tar 40 % mindre skada och har 75 % mer HP. ZXQPH2 ZXQ - Mästares spawnfrekvens inställd på 100 %. ZXQPH3 ZXQ - Hjälten börjar med 8 mindre max HP. ZXQPH4 ZXQ - Hjälten får 3 mindre max HP vid leveling. ZXQPH5 ZXQ - Mästares fallfrekvens inställd på 100 %.
custom.difficulty.nightmare.desc=- Läkande dryck läker 25 % max HP. \n - Mobs är gudalika, gör 45 % mer skada, tar 30 % mindre skada och har 60 % mer HP. \n - Mästarnas spawnfrekvens inställd på 70 %. \n - Hjälten börjar med 8 mindre max HP. \n - Hjälten får 3 mindre max HP vid leveling. \n - Mästarnas fallfrekvens inställd på 90 %.
custom.difficulty.normal.desc=- Mobs är standard. \n- Spawnfrekvens för mästare inställd på 20%. \n- Droppfrekvens för mästare inställd på 40%.
custom.difficulty.super_easy=Superenkelt
custom.difficulty.super_easy.desc=- Börja med 5 extra ransoner.\n- Börja med 5 helande drycker.\n- Börja med 500 guld.\n- Börja med 3 själskristaller.\n- Mobs är patetiska, gör 50 % mindre skada, tar 50 % mer skada och har 50 % mindre HP.\n- Mästares spawnfrekvens inställd på 10 %.\n- Mästares droppfrekvens inställd på 10 %.
levels.sign.dead_end=Vad gör du här?!
levels.sign.tip_02=Inte alla dörrar i fängelsehålan är synliga vid första anblicken. Om du har fastnat, leta efter gömda dörrar.
levels.sign.tip_03=Kom ihåg att öka din styrka inte är det enda sättet att få tillgång till bättre utrustning. Du kan gå åt andra hållet och sänka dess styrkekrav med Uppgraderingsrullar.
levels.sign.tip_04=Du kan spendera ditt guld i butiker på djupare nivåer i fängelsehålan. Den första är på den sjätte nivån.
levels.sign.tip_09=Överraskningsattacker har en större chans att träffa. Du kan till exempel lägga en fiende bakom en stängd dörr i bakhåll när du vet att den närmar sig.
levels.sign.tip_13=Om du brinner kan du inte släcka elden i vattnet medan du svävar.
levels.sign.tip_21=Pixel-Mart. Specialpriser för demonjägare!
actors.blobs.waterofawareness.drink_message=När du tar en klunk känner du hur kunskapen strömmar in i ditt sinne. Nu vet du allt om dina utrustade föremål. Du känner också av alla föremål på nivån och känner till alla dess hemligheter.
