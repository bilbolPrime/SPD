daily.brief_0=Fare Kral'ın takviye birlikleri yolda. Saraya varmadan onu yen. Esir alınan bir gardiyan savaşta sana yardım edebilir. Korunan depoda da erzak var.
daily.brief_1=İsyan, Tengu'nun kaçışını örtüyor. Sığınağını açmak için kaçışın iki liderini de yen, sonra süre dolmadan Tengu'yu alt et. Mahkûmları serbest bırakarak gardiyanlara karşı savaştırabilir veya kilitli cephanelikte erzak arayabilirsin. Sığınağa girince kapı arkandan kapanır.
daily.brief_2=Üç madenci yer altında mahsur kaldı. Son asansör yakında kalkacak. Sığınaklarını aç, üçünü de sağ salim asansöre götür ve dışarı çık. DM-300 tünellerde dolaşıyor. Onunla savaşabilir veya etrafından dolanabilirsin. Erzak ve kilitli kestirmeler herkesi kurtarmana yardımcı olabilir.
daily.brief_3=Bir Buzpençe, bir Kırağı sırtlı gnoll ve bir Kırağıboynuz mağaralarda dolaşıyor. Üçünü de avla, sonra fırtına yolu kapatmadan uzaktaki çıkışa ulaş. Av sırasını sen seçersin. Yan geçitlerde erzak var, ama aramak zaman alır.
daily.brief_4=Üç ayin alanı salonlara iblis çağırıyor. Ayin bitmeden hepsine ulaş ve mühürle. Her mühür bir takviye kaynağını keser. Yolunu seç, erzağa ihtiyacın olursa yan odaları ara.
daily.brief_5=Yardım gelene kadar karakolu savun. Komutan beş saldırı dalgasından sağ çıkmalı. Sen savaşırken, erzak ararken veya yardım için hücreleri açarken savunmacılar merkezi koruyacak. Girişleri izle: sonraki dalgalar birden fazla yönden gelebilir.
daily.brief_6=Şehrin altınları kralın hazinesinde. Komutanı bul, anahtarını al, hazineyi aç ve kapanmadan önce uzaktaki kapıdan kaç. Hazineyi açmak alarmı çaldırır. Önce depoları arayıp kestirmeleri açabilir veya daha az erzakla hızlı bir soygunu göze alabilirsin.
daily.rules=Her tarihin kahramanı, ekipmanı ve zindanı bellidir. Yola çıkmadan beceri puanlarını harca. Süre turlarla ölçülür. Etkinlikten ayrılmak denemeyi bitirir. Günlük etkinliklerin sonuçları ayrıdır; rozet veya bilgi kitabı kaydı açmazlar.
