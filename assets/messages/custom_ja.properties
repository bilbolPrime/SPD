levels.sign.burn=看板を読もうとした途端、緑色の炎が噴き出した。
levels.sign.tip_01=自分の力を過信せず、自分が扱える武器と防具を使用せよ。
levels.sign.tip_05=粘液に注意！
levels.sign.tip_06=Pixel-Mart - 冒険を成功させるために必要なものがすべて揃っています！
levels.sign.tip_07=ポーションや巻物はできるだけ早く確認しておきましょう。実際に必要になる直前まで後回しにしてはいけません。
levels.sign.tip_08=空腹であること自体は痛くないが、飢餓状態は痛む。
levels.sign.tip_10=天狗を解き放つな！
levels.sign.tip_11=ピクセルマート。お金を使えば、長生きできる。
levels.sign.tip_12=複数のモンスターに同時に襲われた場合は、ドアの後ろに退避するようにしてください。
levels.sign.tip_14=同時に複数のアンクを所有しても意味がない。なぜなら、復活した際にそれらはすべて失われるからだ。
levels.sign.tip_15=危険！重機は怪我、四肢切断、または死亡事故を引き起こす可能性があります！
levels.sign.tip_16=ピクセルマート。ダンジョンでのより安全な生活。
levels.sign.tip_17=魔法のかかった武器をアップグレードすると、その魔法が破壊される可能性があります。
levels.sign.tip_18=武器や防具は杖や指輪よりも早く劣化するが、修理する方法はより多く存在する。
levels.sign.tip_19=「殲滅の巻物」を入手できる唯一の方法は、ダンジョンの精霊から贈り物として受け取ることである。
levels.sign.tip_20=陛下の御前では武器の持ち込みは一切禁止です！
