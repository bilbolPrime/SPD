custom.difficulty.super_easy=超簡単
custom.difficulty.super_easy.desc=- 食料を5個追加で開始します。\\n- 回復ポーションを5個追加で開始します。\\n- ゴールドを500個追加で開始します。\\n- ソウルクリスタルを3個追加で開始します。\\n- モブは弱体化しており、与えるダメージが50%減少し、受けるダメージが50%増加し、HPが50%減少します。\\n- チャンピオンの出現率が10%に設定されています。\\n- チャンピオンのドロップ率が10%に設定されています。
custom.difficulty.easy=簡単
custom.difficulty.easy.desc=- 食料を2つ追加で開始します。\\n- 回復ポーションを2つ追加で開始します。\\n- ゴールドを200個追加で開始します。\\n- ソウルクリスタルを2つ追加で開始します。\\n- 隠し扉や罠を発見するとボーナスが得られます。\\n- モブは弱体化し、与えるダメージが25%減少し、受けるダメージが10%増加し、HPが15%減少します。\\n- チャンピオンの出現率が10%に設定されています。\\n- チャンピオンのドロップ率が30%に設定されています。
custom.difficulty.normal.desc=- モブは標準です。\\n- チャンピオンの出現率は20%に設定されています。\\n- チャンピオンのドロップ率は40%に設定されています。
custom.difficulty.hard=難しい
custom.difficulty.hard.desc=- 回復ポーションは最大HPの75%を回復します。\\n- モブは強くなり、与えるダメージが10%増加し、受けるダメージが10%減少し、HPが20%増加します。\\n- チャンピオンの出現率が30%に設定されています。\\n- チャンピオンのドロップ率が50%に設定されています。
custom.difficulty.hell.desc=- 回復ポーションは最大HPの50%を回復します。\\n- モブは不死身で、与えるダメージが35%増加し、受けるダメージが30%減少し、HPが45%増加します。\\n- チャンピオンの出現率が50%に設定されています。\\n- ヒーローは最大HPが4少ない状態で開始します。\\n- ヒーローはレベルアップ時に最大HPが1減少します。\\n- チャンピオンのドロップ率が70%に設定されています。
custom.difficulty.nightmare.desc=- 回復ポーションは最大HPの25%を回復します。\\n- モブは神のような存在で、与えるダメージが45%増加し、受けるダメージが30%減少し、HPが60%増加します。\\n- チャンピオンの出現率が70%に設定されています。\\n- ヒーローは最大HPが8少ない状態でスタートします。\\n- ヒーローはレベルアップ時に最大HPが3減少します。\\n- チャンピオンのドロップ率が90%に設定されています。
custom.difficulty.just_kill_me=もう殺してくれ
custom.difficulty.just_kill_me.desc=- 経験値ポーションを2個所持した状態で開始します。\\n- 回復ポーションは最大HPの10%を回復します。\\n- モブは神であり、与えるダメージが60%増加し、受けるダメージが40%減少し、HPが75%増加します。\\n- チャンピオンの出現率が100%に設定されています。\\n- ヒーローは最大HPが8少ない状態で開始します。\\n- ヒーローはレベルアップ時に最大HPが3減少します。\\n- チャンピオンのドロップ率が100%に設定されています。
levels.sign.dead_end=ここで何をしているの？！
levels.sign.tip_02=ダンジョン内のすべての扉が一目でわかるわけではありません。行き詰まったら、隠された扉を探しましょう。
levels.sign.tip_03=覚えておいてください。筋力を上げるだけがより良い装備を手に入れる方法ではありません。強化の巻物を使って、装備に必要な筋力の要件を下げるという方法もあります。
levels.sign.tip_04=ダンジョンの奥深くにあるショップでゴールドを使うことができます。最初のショップは6階にあります。
levels.sign.tip_09=奇襲攻撃は命中率が高い。例えば、敵が近づいてくるのが分かっている場合、閉まったドアの後ろから待ち伏せ攻撃を仕掛けることができる。
levels.sign.tip_13=体が燃えている状態では、浮遊しながら水中の火を消すことはできません。
levels.sign.tip_21=ピクセルマート。悪魔ハンターのための特別価格！
actors.blobs.waterofawareness.drink_message=一口飲むと、知識が頭の中に流れ込んでくるのを感じる。これで、装備しているアイテムについて全てがわかる。さらに、レベル上の全てのアイテムを感知し、その秘密も全て把握できる。
