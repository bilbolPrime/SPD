daily.timeout_3=A vihar elzárta a kijáratot. A vadászat véget ért.\n\nA Napi kihívásoknál újra próbálkozhatsz.
daily.timeout_4=A szertartás befejeződött. A démonok ellepték a csarnokokat.\n\nA Napi kihívásoknál újra próbálkozhatsz.
daily.timeout_6=A város kapui bezárultak. Az őrök elvágták a menekülés útját.\n\nA Napi kihívásoknál újra próbálkozhatsz.
