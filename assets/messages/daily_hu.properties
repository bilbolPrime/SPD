daily.brief_0=A Patkánykirály erősítése már úton van. Győzd le, mielőtt megérkeznek az udvarába. Egy foglyul ejtett börtönőr segíthet a harcban, az őrzött raktárban pedig készleteket találsz.
daily.brief_1=A lázadás Tengu szökését fedezi. Győzd le a szökés két vezetőjét, hogy bejuss Tengu búvóhelyére, majd végezz vele, mielőtt lejár az idő. Szabadíts ki foglyokat, akik az őrök ellen fordulnak, vagy keress készleteket a zárt fegyvertárban. A búvóhely bejárata bezárul mögötted.
daily.brief_2=Három bányász rekedt a mélyben, és az utolsó felvonó hamarosan indul. Nyisd ki a menedékeiket, kísérd vissza mindhármukat élve, majd hagyd el a bányát a felvonóval. DM-300 járja az alagutakat. Megküzdhetsz vele, vagy kereshetsz másik utat. A készletek és a zárt átjárók segíthetnek a mentésben.
daily.brief_3=Egy jégkarom, egy dérhátú gnoll és egy dérszarv kóborol a barlangokban. Vadászd le mindhármat, majd érj el a túlsó kijárathoz a vihar előtt. Te döntöd el a vadászat sorrendjét. A mellékjáratokban készletek vannak, de a keresésük időbe telik.
daily.brief_4=Három rituális hely démonokat hív a csarnokokba. Juss el mindegyikhez, és pecsételd le őket, mielőtt befejeződik a szertartás. Minden pecsét egy utánpótlási útvonalat zár el. Válassz útvonalat, és kutasd át az oldalkamrákat, ha készletekre van szükséged.
daily.brief_5=Tartsd az őrhelyet az erősítés megérkezéséig. A kapitánynak túl kell élnie öt támadóhullámot. A védők tartják a központot, amíg te harcolsz, készleteket keresel, vagy újabb segítőket szabadítasz ki. Figyeld a bejáratokat: a későbbi hullámok több irányból is támadhatnak.
daily.brief_6=A város aranya a király kincstárában van. Keresd meg a kapitányt, vedd el a kulcsát, nyisd ki a kincstárat, majd menekülj a túlsó kapun át, mielőtt bezárul. A kincstár kinyitása riadót fúj. Előbb átkutathatod a raktárakat és megnyithatod a rövidítéseket, vagy kevesebb készlettel vághatsz bele egy gyorsabb rablásba.
daily.rules=Minden naphoz saját hős, felszerelés és kazamata tartozik. Indulás előtt oszd el a képességpontokat. Az időt körökben mérjük. Az esemény elhagyása lezárja a próbát. A napi eseményeknek külön eredményeik vannak, és nem oldanak fel jelvényeket vagy bejegyzéseket a tudástárban.
