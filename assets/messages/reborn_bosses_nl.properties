actors.mobs.rebornboss.opening=Onbeschermd!
actors.mobs.rebornboss.interrupted=%s verliest de concentratie!
actors.mobs.reborngoo.desc=Er is weinig bekend over Goo. Misschien is het niet eens een wezen, maar een mengsel van stoffen uit de riolen dat een begin van een eigen wil heeft gekregen.
actors.mobs.reborngoo.warning=Goo zwelt op. Ga uit de weg!
actors.mobs.reborndm300.desc=Deze machine is eeuwen geleden door de dwergen gebouwd. Later vervingen ze hun machines door golems, elementalen en zelfs demonen. Dat leidde uiteindelijk tot de ondergang van hun beschaving. De DM-300 en soortgelijke machines werden gebruikt in de bouw en mijnbouw, en soms voor de verdediging van steden.
actors.mobs.reborndm300.repair=DM-300 repareert zichzelf!
actors.mobs.reborndm300.warning=De motor giert. Verlaat de gemarkeerde plekken!
actors.mobs.rebornking.desc=De laatste dwergenkoning kende de geheimen van leven en dood. Hij haalde zijn hovelingen over om mee te doen aan een ritueel dat hun eeuwige jeugd moest schenken. Uiteindelijk kreeg alleen hij die, met een leger ondoden erbij.
actors.mobs.rebornking.warning=De Koning heft zijn hand!
actors.mobs.rebornking.herald_fell=Houd stand, lafaards!
actors.mobs.rebornking$retainer.name_0=Koninklijke wachter
actors.mobs.rebornking$retainer.desc_0=Een dode dwerg in een gehavend harnas. Hij bewaakt zijn koning nog steeds.
actors.mobs.rebornking$retainer.name_1=Hofmagiër
actors.mobs.rebornking$retainer.desc_1=Een hofmagiër die uit de dood is teruggehaald. Duistere magie verzamelt zich in zijn handen.
actors.mobs.rebornking$retainer.name_2=Koninklijke heraut
actors.mobs.rebornking$retainer.desc_2=Zelfs met een gebroken kaak blaft deze heraut nog de bevelen van de Koning. De doden gehoorzamen.
actors.mobs.rebornking$retainer.name_3=Ondode boogschutter
actors.mobs.rebornking$retainer.desc_3=Deze dwerg is met zijn boog begraven. Hij is niet vergeten hoe hij ermee moet schieten.
actors.mobs.rebornyog.desc=Yog-Dzewa is een Oude God, een machtige entiteit uit de rijken van de chaos. Een eeuw geleden wonnen de oude dwergen ternauwernood de oorlog tegen zijn leger van demonen, maar ze waren niet in staat de god zelf te doden. In plaats daarvan sloten ze hem op in de hallen onder hun stad, in de overtuiging dat hij te zwak was om ooit nog op te staan.
actors.mobs.rebornyog.warning=De lucht scheurt open. Verlaat de flikkerende tekens!
actors.mobs.rebornyog.inherit_rot=Vlees vergaat. Ik blijf.
actors.mobs.rebornyog.inherit_fire=De vlam is nu van mij.
actors.mobs.rebornyog$rotting.desc=Een enorme vuist van rottend vlees. Stinkend slijm sijpelt tussen de vingers door en bevlekt de steen eronder.
actors.mobs.rebornyog$rotting.warning=De rottende vuist haalt uit!
actors.mobs.rebornyog$burninghand.desc=Een reusachtige vuist, gehuld in vuur. De vingers knetteren als ze zich sluiten en strooien gloeiende kooltjes op de vloer.
actors.mobs.rebornyog$burninghand.warning=Sintels verzamelen zich voor de brandende vuist!
actors.mobs.reborntengu.shadow_broken=Mijn schaduw…!
