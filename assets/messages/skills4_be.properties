skills4.smash.intro=Б'е суседняга ворага грубай сілай.
skills4.endurance.intro=Павялічвае ваша максімальнае здароўе.
skills4.firm_hand.intro=Паляпшае вашу дакладнасць у блізкім бою.
skills4.regeneration.intro=Паступова аднаўляе дадатковае здароўе. Не дзейнічае падчас галадання.
skills4.toughness.intro=Памяншае ўваходны ўрон, акрамя галадання.
skills4.knockback.intro=Б'е ворага і адштурхоўвае на адну клетку. Не дзейнічае на босаў.
skills4.second_wind.intro=Адразу аднаўляе частку здароўя.
skills4.sure_footing.intro=Скарачае працягласць укаранення і калецтва.
skills4.mastery.intro=Дазваляе карыстацца цяжэйшай зброяй бліжняга бою і атакаваць хутчэй.
skills4.parry.intro=Змяншае шкоду ад наступнага атрыманага ўдару ў блізкім бою. Абарона дзейнічае да чатырох хадоў.
skills4.smite.intro=Наносіць цяжкі ўдар, ігнаруючы палову брані мэты. Займае два хады.
skills4.riposte.intro=Узмацняе ваш наступны ўдар блізкага бою пасля блакавання. Доўжыцца чатыры хады.
skills4.footwork.intro=Дае вам больш часу паміж ударамі блізкага бою для захавання комба.
skills4.duelist.intro=Павялічвае ўхіленне, пакуль роўна адзін вораг стаіць побач з вамі.
skills4.disarming_strike.intro=Наносіць удары ворагу і аслабляе яго на тры хады.
skills4.find_the_gap.intro=Трэці запар удар у блізкім баі і кожны наступны прабіваюць частку брані цэлі.
skills4.aggression.intro=Ваша шкода ў блізкім бою расце па меры страты здароўя.
skills4.charge.intro=Кідаецца да ворага на адлегласці да чатырох клетак і б'е яго. Шлях мусіць быць вольным.
skills4.rampage.intro=Наносіць удары кожнаму суседняму ворагу.
skills4.bloodlust.intro=Паскарае атакі блізкага бою на тры хады пасля забойства.
skills4.war_cry.intro=Аслабляе бачных ворагаў у межах двух клетак.
skills4.rend.intro=Націск і Буйства выклікаюць крывацёк у ворагаў, якія выжылі.
skills4.relentless.intro=Забойства ворага скарачае час да паўторнага выкарыстання Націску і Баявога клічу.
skills4.cornered.intro=Памяншае атрыманую шкоду ў блізкім бою, калі побач два ці больш ворагаў.

skills4.spark.intro=Выпускае іскру ў бачнага ворага.
skills4.spirituality.intro=Павялічвае ваш максімум маны.
skills4.sorcerer.intro=Вашы жазлы наносяць больш шкоды.
skills4.summon_rat.intro=Пакліч пацука змагацца за цябе.
skills4.meditation.intro=Паступова аднаўляе дадатковую ману.
skills4.spirit_armor.intro=Паглынае шкоду, расходуючы адну адзінку маны за кожную адзінку паглынутай шкоды.
skills4.wizard.intro=Вашы жазлы зараджаюцца хутчэй.
skills4.channeling.intro=Скарачае час аднаўлення актыўных навыкаў мінімум да аднаго ходу.
skills4.charged_staff.intro=Удары жазлом у блізкім бою аднаўляюць ману.
skills4.arcane_ward.intro=Змяншае шкоду ад наступнага атрыманага ўдару ў блізкім бою. Абарона дзейнічае да чатырох хадоў.
skills4.arcane_strike.intro=Наносіць магічны ўдар, які ігнаруе палову брані мэты.
skills4.conductive.intro=Удары жазлом у блізкім бою наносяць дадатковую шкоду за кошт зарадаў. Кожнае пападанне траціць адзін зарад замест падзарадкі жазла.
skills4.discharge.intro=Наносіць шкоду ўсім суседнім ворагам выбухам магіі.
skills4.spellweave.intro=Павялічвае шкоду ад жазлоў на тры хады пасля пападання ў блізкім бою.
skills4.drain_life.intro=Наносіць шкоду ворагу і аздараўляе вас на палову страчанага здароўя.
skills4.rabid_minions.intro=Выкліканыя вамі істоты наносяць большы ўрон.
skills4.summon_skeleton.intro=Выклічце шкілета, каб змагацца за вас.
skills4.soul_hunger.intro=Аднаўляе ману, калі вы забіваеце ворага.
skills4.enrage.intro=Пакуль навык актыўны, выкліканыя істоты наносяць і атрымліваюць больш шкоды.
skills4.slow.intro=Запавольвае рух і атакі ворага.
skills4.summoner.intro=Вы можаце пакінуць яшчэ адну выкліканую істоту.
skills4.dark_pact.intro=Траціць пяць адзінак здароўя, каб аднавіць ману. Патрабуе прынамсі шэсць адзінак здароўя.

skills4.double_strike.intro=Ударце два разы запар.
skills4.stealth.intro=Ворагам цяжэй вас заўважыць.
skills4.evasion.intro=Паляпшае вашы шанцы ўхіляцца ад нападаў.
skills4.smoke_bomb.intro=Знікнуць у воблаку дыму. Атака парушае эфект.
skills4.bandit.intro=Знайдзіце лішняе золата ў кожнай сабранай вамі кучы.
skills4.venom.intro=Пакуль навык актыўны, удары ў блізкім бою могуць атруціць мэту.
skills4.locksmith.intro=У вас ёсць шанец раззброіць пастку, калі вы на яе наступіце.
skills4.light_step.intro=Скарачае працягласць укаранення і калецтва.
skills4.dash.intro=Перасоўвае да двух клетак уздоўж чыстага шляху.
skills4.haste.intro=Павялічвае вашу хуткасць руху на пяць хадоў.
skills4.shadow_clone.intro=Стварыце аднаго моцнага клона або трох больш слабых клонаў, каб змагацца за вас.
skills4.escape.intro=Вызваляе ад каранёў і калецтва ды павялічвае ўхіленне на чатыры хады.
skills4.trailblazer.intro=Павялічвае вашу хуткасць перамяшчэння.
skills4.skirmish.intro=Перасоўванне ўзмацняе ваш наступны ўдар блізкага бою.
skills4.keep_distance.intro=Павялічвае ўхіленне ад ворагаў, аддаленых больш чым на адну плітку.
skills4.ambush.intro=Павялічвае шкоду ў блізкім бою, пакуль вы нябачныя.
skills4.scorpion.intro=Ваш яд наносіць большую шкоду.
skills4.silent_death.intro=Атакі блізкага бою могуць наўпрост забіць спячых ворагаў. Босы неўспрымальныя.
skills4.expose.intro=Вашы ўдары ў блізкім бою ігнаруюць некаторыя даспехі.
skills4.execution.intro=Павялічвае ўрон ворагам менш за чвэрць здароўя.
