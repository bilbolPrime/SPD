levels.rebornsiderooms.leave=Zostaw
actors.mobs.npcs.echoreflection.name=twoje odbicie
actors.mobs.npcs.echoreflection.desc=Blada kopia ciebie czeka nieruchomo. Walczy tylko po przyjęciu wyzwania. Pokonaj ją, by zdobyć punkt umiejętności. Wyjście z komnaty kończy pojedynek i przywraca odbiciu całe zdrowie.
actors.mobs.npcs.echoreflection.challenge=Wyzwać swoje odbicie? Zwycięstwo daje punkt umiejętności. Możesz się wycofać, ale po opuszczeniu komnaty odbicie odzyska zdrowie.
actors.mobs.npcs.echoreflection.accept=Wyzwij
actors.mobs.npcs.echoreflection.withdrawn=Twoje odbicie znów zamiera w bezruchu.
actors.mobs.npcs.echoreflection.victory=Odbicie znika, pozostawiając zwój umiejętności.
actors.mobs.npcs.barbecueking.name=król szczurów
actors.mobs.npcs.barbecueking.desc=Nawet król musi jeść. Znalazł cichy kąt, żeby upiec kolację.
actors.mobs.npcs.barbecueking.greeting=Królewskie sprawy. Bardzo ważne. Bardzo smaczne.
actors.mobs.npcs.barbecueking.stolen=EJ! To było moje!
actors.mobs.npcs.barbecueking.after=Oby ci stanęło w gardle.
actors.mobs.npcs.forgottenoffering.name=zapomniany dar
actors.mobs.npcs.forgottenoffering.desc=Pod kryształem leżą racja żywnościowa i mikstura leczenia. Wybierz jedno; drugie obróci się w pył.
actors.mobs.npcs.watchremains.name=poległy strażnik
actors.mobs.npcs.watchremains.desc=Przy rozbitej ścianie leżą kości strażnika. Spod hełmu wystaje skrawek papieru.
actors.mobs.npcs.watchremains.note=Trzymałem drzwi przez całą noc. Przyszli przez ścianę.
