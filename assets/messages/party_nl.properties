actors.skills.raiseskeletonskill.desc=Roept een skelet op om aan je zijde te vechten.
network.partysession.background=De verbinding met de groep is verbroken omdat je het spel hebt verlaten.
items.corpse.name=lijk
items.corpse.desc=Een vers lijk dat voor necromantie kan worden gebruikt.
items.armorkit.desc=Met dit gereedschap verander je een harnas in een episch harnas. Het behoudt zijn eigenschappen en krijgt een vaardigheid voor jouw klasse. Vakmanschap is niet nodig.
items.bomb.desc=Een kleine bom met zwart buskruit. De lont ontbrandt wanneer je de bom gooit.
items.quest.driedrose.desc=De roos is al lang verdroogd, maar heeft al haar blaadjes behouden.
items.quest.phantomfish.desc=Dit kleine, doorschijnende visje is buiten het water amper te zien. In het water is het vrijwel onzichtbaar.
items.tomeofmastery.desc=Dit dunne boek met versleten leren kaft lijkt veel kennis te bevatten. Het lezen kost wat tijd.
items.weightstone.desc=Hiermee kun je een slagwapen uitbalanceren voor meer snelheid of nauwkeurigheid.
items.wands.wandofamok.desc=Het paarse licht maakt het doelwit razend, waardoor het willekeurige wezens in de buurt aanvalt.
items.wands.wandofavalanche.desc=Als de ontlading een muur of ander vast obstakel raakt, ontstaat een steenlawine die wezens in de omgeving verwondt en verdooft.
items.wands.wandofflock.desc=Roept magische schapen op die tijdelijk de doorgang blokkeren.
items.wands.wandofpoison.desc=Vergiftigt het doelwit en veroorzaakt regelmatig schade. Verbeteringen verlengen de vergiftiging.
items.wands.wandofreach.desc=Pakt voorwerpen op afstand en wisselt je plaats met een vijand. De krachtgolf activeert vallen, vertrapt gras en opent of sluit deuren onderweg.
items.wands.wandofslowness.desc=Halveert tijdelijk de bewegings- en aanvalssnelheid van het doelwit.
items.wands.wandofteleportation.desc=Teleporteert een wezen naar een willekeurige plek op deze verdieping.
items.weapon.melee.dualswords.desc=Twee scherpe klingen om harder mee toe te slaan.
items.weapon.missiles.cupidarrow.desc=Deze pijl zou van Cupido zijn geweest. Kies je doelwit zorgvuldig.
items.weapon.missiles.curaredart.desc=Deze pijltjes doen weinig schade, maar kunnen het doelwit verlammen en weerloos maken.
items.weapon.missiles.incendiarydart.desc=De punt blijft in het doelwit steken terwijl het mengsel aan de pijl vlam vat.
items.weapon.missiles.soulcrystal.desc=Een kristal dat zielen kan vangen. Gooi het naar een zwakke of verzwakte vijand om diens geest te vangen.
items.weapon.missiles.tamahawk.desc=Deze werpbijl is niet erg zwaar, maar vergt kracht om goed te gebruiken.
network.partytext.weapon_fast=Dit wapen is snel.
network.partytext.weapon_slow=Dit wapen is traag.
network.partytext.weapon_accurate=Dit wapen is nauwkeurig.
network.partytext.weapon_inaccurate=Dit wapen is onnauwkeurig.
network.partytext.weapon_fast_and_accurate=Dit wapen is snel en nauwkeurig.
network.partytext.weapon_fast_but_inaccurate=Dit wapen is snel, maar onnauwkeurig.
network.partytext.weapon_slow_but_accurate=Dit wapen is traag, maar nauwkeurig.
network.partytext.weapon_slow_and_inaccurate=Dit wapen is traag en onnauwkeurig.
network.partytext.necroblade_bolt=Vanaf niveau 5 kan de volledig opgeladen kling _Duistere schicht_ gebruiken. Die kan de essentie van een doelwit vernietigen en het tot dienaar maken.
network.partytext.necroblade_intro=Deze kling van duistere magie verslindt de zielen van haar slachtoffers en wordt sterker.
network.partytext.necroblade_energy=Opgeslagen zielen: _%s/100_
network.partytext.necroblade_damage=De zielen voegen _0–%d schade_ toe.
network.partytext.necroblade_hungry=De kling kan een volle lading zielen verbruiken om sterker te worden.
network.partytext.necroblade_full=De kling kan zichzelf niet verder verbeteren door zielen te verbruiken.
