journey.checkpoint_objective=Νίκησε τους φρουρούς και πάρε το _κλειδί του αξιωματικού_. Ανοίγει την έξοδο στον τελευταίο όροφο.
journey.rescue_objective=Νίκησε τους φρουρούς και _ελευθέρωσε τον αιχμάλωτο_ στον τελευταίο όροφο. Κάθε διάσωση μειώνει τις τιμές στον καταυλισμό κατά _5%_, έως _25%_.
journey.outpost_objective=Νίκησε τους φρουρούς του φυλακίου για να _στερήσεις τις ενισχύσεις από τον επόμενο αρχηγό_.
journey.officer_name=Αξιωματικός
