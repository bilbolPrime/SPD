journey.dm300_mechanic=Οι πλάκες επισκευής επισκευάζουν το DM-300 μόνο μία φορά. Πάτησέ τες πρώτα για να τις σπάσεις.
journey.king_mechanic=Οι κοντινοί φρουροί δέχονται τη μισή ζημιά που προορίζεται για τον βασιλιά. Απομάκρυνέ τους από κοντά του.
journey.yog_mechanic=Οι επιθέσεις ρήγματος του Γιογκ χτυπούν δύο φορές. Περίμενε το δεύτερο χτύπημα πριν περάσεις.
journey.repair_pad=Πλάκα επισκευής
journey.repair_pad_desc=Αυτή η πλάκα μπορεί να επισκευάσει το DM-300 μία φορά. Πάτησέ την για να τη σπάσεις.
journey.remains=Εδώ βρίσκονται ακόμη τα υπάρχοντα ενός νεκρού ήρωα.
journey.recover=Ανάκτηση αντικειμένων
journey.recovery_objective=Μάζεψε τα αντικείμενα και γύρισε στην είσοδο του πρώτου ορόφου.
journey.saves=Διάλεξε ταξίδι
