journey.goo_mechanic=Όταν στέκεσαι στο νερό, η Γλίτσα χτυπά με έναν δυνατό παφλασμό. Προκάλεσε αυτή την επίθεση για να στεγνώσουν οι γύρω λιμνούλες που τη θεραπεύουν.
