journey.shop_hint=Τα εμπορεύματα αλλάζουν μετά από κάθε περιοχή που καθαρίζεις. Κράτησε ένα αντικείμενο για να παραμείνει διαθέσιμο.
journey.shop_empty=Όλα τα είδη έχουν εξαντληθεί.
journey.sell_empty=Δεν υπάρχει τίποτα προς πώληση σε αυτό το σακίδιο.
