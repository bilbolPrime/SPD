journey.title=Το ταξίδι
journey.intro=Ο Γιογκ πήρε το Φυλαχτό και οι δυνάμεις του φτάνουν ήδη στην επιφάνεια.\n\nΟδήγησε έξι ήρωες μέσα από τα κατεχόμενα εδάφη. Διάλεξε διαδρομή και ήρωα για κάθε αποστολή. Όσοι πέσουν δεν επιστρέφουν σε αυτό το ταξίδι.
journey.badge_hint=Ολοκλήρωσε τουλάχιστον ένα ταξίδι για να ξεκλειδώσεις το σήμα _%s_.
journey.new=Νέο ταξίδι
journey.deploy=Αναχώρηση
journey.camp=Καταυλισμός
journey.chest=Σεντούκι καταυλισμού
journey.chest_hint=Πάτησε ένα κομμάτι εξοπλισμού για να το φορέσεις ή να το βγάλεις. Μπορείς επίσης να μεταφέρεις αντικείμενα ανάμεσα στο σακίδιο και το σεντούκι του καταυλισμού.
journey.store=Αποθήκευση
journey.take=Πάρε
journey.choose=Διάλεξε διαδρομή και μετά ετοίμασε έναν ήρωα στον καταυλισμό.
journey.objective=Φτάσε στην έξοδο του τελευταίου ορόφου για να εξασφαλίσεις αυτή τη διαδρομή και να επιστρέψεις στον καταυλισμό. Προετοίμασε τον ήρωα και τις προμήθειές του πριν φύγεις.
journey.blocked=Ολοκλήρωσε μια συνδεδεμένη περιοχή για να ανοίξεις αυτή τη διαδρομή.
journey.cleared=Αυτή η περιοχή έχει ολοκληρωθεί.
journey.fallen=Αυτός ο ήρωας έπεσε και δεν μπορεί να επιστρέψει στην εκστρατεία.
journey.lost=Και οι έξι ήρωες έπεσαν. Το ταξίδι τελείωσε.
journey.reached=Ο Γιογκ έπεσε. Η εισβολή τελείωσε.
