journey.guards_blocked=Νίκησε τους υπόλοιπους φρουρούς πριν φύγεις.
journey.entrance_hint=Η αποστολή τελειώνει στην έξοδο του τελευταίου ορόφου.
journey.floor_exit_hint=Αυτές οι σκάλες οδηγούν στον επόμενο όροφο της περιοχής.
journey.floor_entrance_hint=Αυτές οι σκάλες οδηγούν πίσω στον προηγούμενο όροφο.
