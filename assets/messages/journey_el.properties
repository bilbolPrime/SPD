journey.supply_objective=Νίκησε τους φρουρούς σε κάθε όροφο και μετά εξασφάλισε τα εφόδια. Το κατάστημα του καταυλισμού θα χωρά _τέσσερα επιπλέον αντικείμενα_.
journey.guards_left=Φρουροί που απομένουν: _%d_.
