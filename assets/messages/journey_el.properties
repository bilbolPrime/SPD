journey.cache_blocked=Πάρε τα εφόδια πριν φύγεις.
journey.rescue_blocked=Ελευθέρωσε τον αιχμάλωτο πριν φύγεις.
journey.cache_secured=Τα εφόδια είναι έτοιμα για τον καταυλισμό.
journey.captive_freed=Ο αιχμάλωτος κατευθύνεται στον καταυλισμό.
