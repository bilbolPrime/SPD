actors.skills.raiseskeletonskill.desc=Erhebt nur dann ein Skelett, wenn sich auf dem Zielfeld eine Leiche befindet.
actors.skills.raiseskeletonskill.lich=Lich: doppelte Beschwörungskraft und ein zusätzliches Skelett.
actors.skills.raiseskeletonskill.spiritbinder=Geisterbinder: verdoppelte Lebensdauer erhobener Skelette.
network.partysession.background=Die Verbindung zur Gruppe wurde getrennt, weil du das Spiel verlassen hast.
items.corpse.name=Leiche
items.corpse.desc=Eine frische Leiche, die sich für Nekromantie verwenden lässt.
items.armorkit.desc=Mit diesen Werkzeugen lässt sich jede Rüstung in eine epische Rüstung verwandeln. Sie behält ihre Eigenschaften und erhält eine Fähigkeit passend zu deiner Klasse. Handwerkliche Kenntnisse sind nicht nötig.
items.bomb.desc=Eine kleine Bombe voller Schwarzpulver. Sie explodiert dort, wo sie landet.
items.quest.driedrose.desc=Die Rose ist längst vertrocknet, hat aber alle Blütenblätter behalten.\n\nBring den Gegenstand zum Geist zurück.
items.quest.phantomfish.desc=Dieser kleine, durchscheinende Fisch ist in der Luft kaum zu erkennen. Im Wasser wird er nahezu unsichtbar.\n\nBring den Gegenstand zum Geist zurück.
items.tomeofmastery.desc=Dieses abgegriffene Lederbuch ist dünn, scheint aber viel Wissen zu bergen. Es zu lesen braucht etwas Zeit.\n\nLässt dich eine Unterklasse wählen.
items.weightstone.desc=Mit diesem Stein lässt sich eine Nahkampfwaffe auf höhere Geschwindigkeit oder Genauigkeit ausbalancieren.
items.wands.wandofamok.desc=Das violette Licht versetzt das Ziel in Raserei. Es greift wahllos Kreaturen in seiner Nähe an.
items.wands.wandofavalanche.desc=Trifft die Entladung eine Wand oder ein anderes festes Hindernis, löst sie einen Steinschlag aus, der Kreaturen im Umkreis verletzt und betäubt.
items.wands.wandofflock.desc=Beschwört eine Herde magischer Schafe, die vorübergehend den Weg versperrt.
items.wands.wandofpoison.desc=Vergiftet das Ziel und verursacht regelmäßig Schaden. Aufwertungen verlängern die Giftdauer.
items.wands.wandofreach.desc=Greift Gegenstände aus der Ferne und tauscht Plätze mit Feinden. Die Kraftwelle löst Fallen aus, zertritt Gras und öffnet oder schließt Türen auf ihrem Weg.
items.wands.wandofslowness.desc=Halbiert vorübergehend die Bewegungs- und Angriffsgeschwindigkeit des Ziels.
items.wands.wandofteleportation.desc=Teleportiert eine Kreatur an einen zufälligen Ort auf dieser Ebene.
items.weapon.melee.dualswords.desc=Zwei scharfe Klingen für kräftige Hiebe.
items.weapon.missiles.cupidarrow.desc=Dieser Pfeil soll Amor gehören. Wähle dein Ziel mit Bedacht.
items.weapon.missiles.curaredart.desc=Diese kleinen Wurfpfeile richten wenig Schaden an, können ihr Ziel aber lähmen und wehrlos machen.
items.weapon.missiles.incendiarydart.desc=Die Spitze bleibt im Ziel stecken, während der daran befestigte Brandsatz aufflammt.
items.weapon.missiles.soulcrystal.desc=Ein Kristall, der Seelen einfangen kann. Wirf ihn auf einen schwachen oder geschwächten Feind, um dessen Geist zu fangen.
items.weapon.missiles.tamahawk.desc=Diese Wurfaxt ist nicht besonders schwer, erfordert aber Kraft, um sie wirksam einzusetzen.
network.partytext.weapon_fast=Diese Waffe ist schnell.
network.partytext.weapon_slow=Diese Waffe ist langsam.
network.partytext.weapon_accurate=Diese Waffe ist genau.
network.partytext.weapon_inaccurate=Diese Waffe ist ungenau.
network.partytext.weapon_fast_and_accurate=Diese Waffe ist schnell und genau.
network.partytext.weapon_fast_but_inaccurate=Diese Waffe ist schnell, aber ungenau.
network.partytext.weapon_slow_but_accurate=Diese Waffe ist langsam, aber genau.
network.partytext.weapon_slow_and_inaccurate=Diese Waffe ist langsam und ungenau.
network.partytext.necroblade_bolt=Ab Stufe 5 kann die voll aufgeladene Klinge _Dunkles Geschoss_ wirken. Es kann die Essenz eines Ziels zerstören und es versklaven.
network.partytext.necroblade_intro=Diese Klinge aus dunkler Magie verschlingt die Seelen ihrer Opfer und wird dadurch stärker.
network.partytext.necroblade_energy=Gespeicherte Seelen: _%s/100_
network.partytext.necroblade_damage=Gespeicherte Seelen gewähren _0–%d zusätzlichen Schaden_.
network.partytext.necroblade_hungry=Die Klinge kann eine volle Ladung Seelen verbrauchen, um stärker zu werden.
network.partytext.necroblade_full=Die Klinge kann sich nicht mehr durch den Verbrauch von Seelen verbessern.
