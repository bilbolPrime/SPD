items.scrolls.scrolloffrostlevel.name=Kırağı Parşömeni
items.scrolls.scrolloffrostlevel.desc=Bu parşömenden soğuk sızıyor.\n\nParşömeni istediğin yerde yırtarak kattaki tüm düşmanları hasar alana kadar dondurabilirsin. Bölüm sonu canavarları ve donmaya bağışık yaratıklar etkilenmez. Hasar vermez.
items.scrolls.scrolloffrostlevel.ac_tear=Yırt
items.scrolls.scrolloffrostlevel.tear_confirm=Bu parşömeni yırtmak içindeki büyüyü açığa çıkararak kattaki tüm düşmanları hasar alana kadar donduracak. Bölüm sonu canavarları ve donmaya bağışık yaratıklar etkilenmez. Hasar vermez.\n\nParşömen yırtılsın mı?
items.scrolls.scrolloffrostlevel.wrong_place=Parşömen burada işe yaramıyor.
items.scrolls.scrolloffrostlevel.spent=Geçit zaten açılmış. Parşömen tepki vermiyor.
items.keys.key.ice_depth=Bu anahtar Buz Mağaralarının %d. katına ait.
scenes.interlevelscene$mode.frost=Buz Mağaralarına giriliyor...
levels.icecaveslevel.water_name=Buz gibi su
levels.icecaveslevel.water_desc=İnce buz tabakası ayak altında kırılıyor.
levels.icecaveslevel.wall_desc=Kazma izleri kalın buz damarlarının altında kayboluyor. Soğuk kayaya yayıldığında madenciler bu galerileri terk etmiş.
levels.cavesbosslevel.collapsed_name=Çökmüş mağara
levels.cavesbosslevel.collapsed_desc=Çökmüş bir mağara. Düşen kayaların arasından geçmek mümkün değil.
actors.buffs.frostbite.name=Soğuk ısırığı
actors.buffs.frostbite.desc=Soğuk, hareket hızını %20 azaltıyor.
actors.mobs.rimebat.name=Kırağı yarasası
actors.mobs.rimebat.desc=Bu solgun yarasalar buzun altında yuva yapar. Soğuk ısırıkları hareketi kısa süreliğine yavaşlatır ve yeniden saldırmak için dönmelerine zaman kazandırır.\n\nDonmaya ve buz büyüsüne bağışıktır.
actors.mobs.iceclaw.name=Buzpençe
actors.mobs.iceclaw.desc=Sıkı buzdan kabuğu olan bir leşçil. Dövüşten önce hazırlanıp zırhını kısa süreliğine kalınlaştırır. Ateş bu ek korumayı eritir.\n\nDonmaya ve buz büyüsüne bağışıktır.
actors.mobs.frostback.name=Kırağı sırtlı gnoll
actors.mobs.frostback.desc=Bu gnoll, buraya girenleri soyarak soğuğa dayanmış. Silahını kaldırdığında kenara çekil: ağır darbe az önce durduğun yere inecek.\n\nDonmaya ve buz büyüsüne bağışıktır.
actors.mobs.shardling.name=Buz kırığı
actors.mobs.shardling.desc=Yerinde duramayan bir buz kristali yumağı. Nişan alıp düz bir çizgi boyunca parçalar fırlatır. Duvarlar yaylım ateşini durdurur.\n\nDonmaya ve buz büyüsüne bağışıktır.
actors.mobs.hollowminer.name=İçi boş madenci
actors.mobs.hollowminer.desc=Bu madenci donmuş galerilerden hiç çıkamamış. Sahibi çoktan ölmüş olsa da feneri hâlâ yanıyor. Feneri kaldırmasına izin verirsen yakındaki yaratıkları dövüşe çağırır. Bir isabet sinyali keser.\n\nDonmaya ve buz büyüsüne bağışıktır.
actors.mobs.rimehorn.name=Kırağıboynuz
actors.mobs.rimehorn.desc=Kürkünde kırağı birikmiş ağır bir hayvan. Düz bir çizgide hücum etmeden önce yeri eşeler. Hazırlanırken yolundan çekil.\n\nDonmaya ve buz büyüsüne bağışıktır.
actors.mobs.oldrime.name=Kadim Kırağı
actors.mobs.oldrime.desc=Madenciler Kadim Kırağı'yı dağın altında, tünellerinden daha eski buzlara gömülü buldu. Kazmaları onu uyandırdı. Şimdi donmuş galerileri ve ötesindeki geçidi koruyor. Zayıfladıkça zırhı parçalanıp uzuvlarını serbest bırakıyor. Ağır savuruşlara, zemini yaran buza ve dondurucu nefesine dikkat et.\n\nDonmaya ve buz büyüsüne bağışıktır.
actors.mobs.oldrime.warning=Kadim Kırağı vurmak için geriliyor!
windows.wndjournal.ice_depth=Buz %d
levels.icebosslevel.exit_name=Mağara geçidi
levels.icebosslevel.exit_desc=Dar bir geçit dağın derinliklerine uzanıyor.
levels.icebosslevel.blocked_name=Donmuş geçit
levels.icebosslevel.blocked_desc=Bir buz duvarı Kadim Kırağı'nın arkasındaki geçidi kapatıyor.
items.weapon.ice.wrong_hero=Bu silah sana göre değil.
items.weapon.ice.already_enchanted=Bu silah zaten büyülü.
items.weapon.ice.glaciercleaver.name=Buzul Satırı
items.weapon.ice.glaciercleaver.desc=Kadim Kırağı'nın buzundan yontulmuş geniş bir bıçak. İsabet, hedefi dört tur boyunca kırağıyla kaplar. Sonraki Buzul Satırı darbesi kırağıyı parçalayıp %d ek hasar verir. Yalnızca Savaşçı kullanabilir.
actors.buffs.frostcoating.name=Kırağı kaplı
actors.buffs.frostcoating.desc=Bu yaratığa ince bir kırağı tabakası yapışmış. Buzul Satırı darbesi onu parçalayacak.
items.weapon.ice.hoarfroststaff.name=Beyaz Kırağı Asası
items.weapon.ice.hoarfroststaff.desc=Asanın uçları arasında soğuk toplanır. Atışları yetenek bonuslarından önce %d-%d hasar verir ve iki tur boyunca hareketi ve saldırıları yavaşlatır. Başlangıçta üç yük tutar ve değnek gibi yeniden dolar. Yalnızca Büyücü kullanabilir.
items.weapon.ice.rimepick.name=Kırağı Kazması
items.weapon.ice.rimepick.desc=Bu dar buz kazması zırhtaki boşlukları bulur. Hedefin zırhının dörtte birini, hazırlıksız yakalanmışsa yarısını yok sayar. Yalnızca Haydut kullanabilir.
items.weapon.ice.frostbow.name=Kırağı Yayı
items.weapon.ice.frostbow.desc=Bu yaydan çıkan oklar çarpınca keskin buz parçalarına ayrılır. Hedefe %%%d daha fazla hasar, bitişik düşmanlara ise o isabetin hasarının dörtte birini verir. Parçalar kurbanlarını dondurmaz. Yalnızca Avcı kullanabilir.
items.weapon.ice.gravefrostscythe.name=Mezar Kırağısı Tırpanı
items.weapon.ice.gravefrostscythe.desc=Tırpanın kemiklerle sarılı sapına kırağı yapışmış. Kuşanıldığında, çağırdığın iskeletler ve hayaletler her isabette %d ek soğuk hasarı verir. Yalnızca Nekromansır kullanabilir.
items.weapon.ice.frostbiterifle.name=Soğuk Isırığı Tüfeği
items.weapon.ice.frostbiterifle.desc=Tüfeğin fişek yatağı hiç erimeyen buzla kaplı. Her isabet iki turluk soğuk ısırığına yol açıp hareketi %20 yavaşlatır. Yeni isabetler etkiyi yeniler. Yalnızca Paralı Asker kullanabilir.
library.ice_weapon_drop=Her kahraman için sınıfına uygun bir silah düşer.

actors.mobs.npcs.prospector.name=Mahsur madenci
actors.mobs.npcs.prospector.desc=Yamalı paltolu bir madenci merdivenlerin yanına sığınmış. Lambası sönmek üzere.
actors.mobs.npcs.prospector.torches=Lambam fazla dayanmaz. Kaçarken bu katta bir erzak sandığı bıraktım. İçinden _üç meşale_ getirir misin?
actors.mobs.npcs.prospector.iceclaws=Buzpençeler beni galerimden kovdu. İşime dönebilmem için _bu katta üç buzpençe_ öldür.
actors.mobs.npcs.prospector.accept=Yardım ederim.
actors.mobs.npcs.prospector.later=Şimdi değil.
actors.mobs.npcs.prospector.need_torches=_Üç meşale_ lazım. Sandık hâlâ bu katta bir yerde.
actors.mobs.npcs.prospector.claws_left=Öldürülecek buzpençe: _%d_.
actors.mobs.npcs.prospector.reward=İyi iş. Hangisini istersin?
actors.mobs.npcs.prospector.rations=İki kumanya
actors.mobs.npcs.prospector.thanks=Bir dertten kurtuldum. Sağ ol.
library.quest.prospector_torches.name=Sönen lamba
library.quest.prospector_torches.desc=Mahsur madenciye üç meşale getir. Bulunduğu kattaki sandıkta yeterince var.
library.quest.prospector_iceclaws.name=Galerideki buzpençeler
library.quest.prospector_iceclaws.desc=Madencinin katında üç buzpençe öldür, sonra ona geri dön.
library.quest.prospector.reward=Bir yükseltme parşömeni veya iki kumanya seç.
items.scrolls.scrolloffrostlevel.read_confirm=Okurken ışınlanmak üzere olduğunu hissediyorsun.
