daily.brief_0=鼠王的援军正在赶来。在他们抵达宫廷前击败鼠王。被俘的狱卒可以助你战斗，守卫把守的仓库里也有补给。
daily.brief_1=暴动掩护着天狗逃跑。击败两名越狱头目，打开他的藏身处，再赶在时间耗尽前击败天狗。释放囚犯可以让他们对抗守卫，也可以搜查上锁的军械库寻找补给。进入藏身处后，大门会在身后关闭。
daily.brief_2=三名矿工被困在地下，最后一趟升降梯即将离开。打开他们的避难所，将三人全部活着带回升降梯，再乘梯离开。DM-300正在矿道中游荡。你可以与它战斗，也可以绕路。补给和上锁的近路或许能帮你救出所有人。
daily.brief_3=冰爪、霜背豺狼人和霜角兽在洞窟中游荡。猎杀三者，再赶在风暴封路前到达远端出口。狩猎顺序由你决定。岔道里有补给，但搜寻会花费时间。
daily.brief_4=三处仪式地点正向大厅召唤恶魔。在仪式完成前抵达并封印每一处。每封印一处，就能切断一股援军。自行选择路线，需要补给时可以搜查侧室。
daily.brief_5=守住哨所，等待援军到来。队长必须在五波进攻中活下来。你可以参战、搜寻附近的补给，或打开牢房解救帮手，其他守军会留守中央。注意各个入口，后续进攻可能来自多个方向。
daily.brief_6=城里的黄金藏在国王的宝库中。找到队长，夺取钥匙，打开宝库，再赶在远端城门关闭前逃出去。开启宝库会触发警报。可以先搜查仓库、打开近路，也可以带着较少的补给速战速决。
daily.rules=每个日期都有自己的英雄、装备和地牢。出发前先分配技能点。时间按回合计算，离开活动即结束本次尝试。每日活动单独记录成绩，不解锁徽章或图鉴内容。
