items.scrolls.scrolloffrostlevel.name=霜の巻物
items.scrolls.scrolloffrostlevel.desc=この羊皮紙から冷気がしみ出している。\n\nまた、どこでも破ることができ、フロアにいるすべての敵を凍らせる。ダメージを受けると氷は解ける。ボスや凍結に耐性を持つ生物には効かない。ダメージは与えない。
items.scrolls.scrolloffrostlevel.ac_tear=破る
items.scrolls.scrolloffrostlevel.tear_confirm=この巻物を破ると中の魔力が解き放たれ、フロアにいるすべての敵が凍りつく。ダメージを受けると氷は解ける。ボスや凍結に耐性を持つ生物には効かない。ダメージは与えない。\n\n巻物を破りますか？
items.scrolls.scrolloffrostlevel.wrong_place=巻物はここでは使えない。
items.scrolls.scrolloffrostlevel.spent=道はすでに開かれている。巻物は反応しない。
items.keys.key.ice_depth=この鍵は氷の洞窟の%d階で使える。
scenes.interlevelscene$mode.frost=氷の洞窟へ移動中…
levels.icecaveslevel.water_name=氷水
levels.icecaveslevel.water_desc=足元で薄い氷が割れる。
levels.icecaveslevel.wall_desc=つるはしの跡は厚い氷の筋に覆われている。岩に冷気が広がると、鉱夫たちはこの坑道を放棄した。
levels.cavesbosslevel.collapsed_name=崩落した洞窟
levels.cavesbosslevel.collapsed_desc=崩落した洞窟。落ちた岩を通り抜けることはできない。
actors.buffs.frostbite.name=凍傷
actors.buffs.frostbite.desc=冷気によって移動速度が20%低下している。
actors.mobs.rimebat.name=霜コウモリ
actors.mobs.rimebat.desc=氷の下に巣を作る青白いコウモリ。冷たい噛みつきで移動を一時的に遅くし、その隙に回り込んで再び襲いかかる。\n\n凍結と氷の魔法は効かない。
actors.mobs.iceclaw.name=氷爪
actors.mobs.iceclaw.desc=硬い氷の殻をまとった腐肉食の獣。戦う前に身構え、短時間だけ装甲を厚くする。炎はその追加の防護を溶かす。\n\n凍結と氷の魔法は効かない。
actors.mobs.frostback.name=霜背のノール
actors.mobs.frostback.desc=ここに入った者から奪うことで寒さをしのいできたノール。武器を振り上げたら横へ避けよう。重い一撃は、あなたが立っていた場所に落ちる。\n\n凍結と氷の魔法は効かない。
actors.mobs.shardling.name=氷晶の精
actors.mobs.shardling.desc=絶えず動く氷晶の塊。狙いを定めてから、一直線に破片を撃ち出す。壁で射撃を遮れる。\n\n凍結と氷の魔法は効かない。
actors.mobs.hollowminer.name=虚ろな鉱夫
actors.mobs.hollowminer.desc=凍った坑道から逃げ出せなかった鉱夫。持ち主はとうに死んでいるのに、ランタンにはまだ火がともっている。ランタンを掲げると付近の生物を戦いに呼び寄せる。攻撃を当てれば合図を中断できる。\n\n凍結と氷の魔法は効かない。
actors.mobs.rimehorn.name=霜角獣
actors.mobs.rimehorn.desc=毛皮に霜がこびりついた重い獣。地面をかいてから一直線に突進する。準備している間に進路から離れよう。\n\n凍結と氷の魔法は効かない。
actors.mobs.oldrime.name=古き霜
actors.mobs.oldrime.desc=鉱夫たちは山の地下で、坑道よりも古い氷に埋もれた古き霜を見つけた。つるはしがそれを目覚めさせた。今は凍った坑道とその奥の道を守っている。弱るにつれて装甲が剥がれ、手足が自由になる。重い打撃、床を突き破る氷、凍てつく息に注意。\n\n凍結と氷の魔法は効かない。
actors.mobs.oldrime.warning=古き霜が大きく振りかぶった！
windows.wndjournal.ice_depth=氷 %d
levels.icebosslevel.exit_name=洞窟の通路
levels.icebosslevel.exit_desc=狭い通路が山の奥へと続いている。
levels.icebosslevel.blocked_name=凍った通路
levels.icebosslevel.blocked_desc=古き霜の背後の通路を氷の壁が塞いでいる。
items.weapon.ice.wrong_hero=この武器はあなたには扱えない。
items.weapon.ice.already_enchanted=この武器はすでにエンチャントされている。
items.weapon.ice.glaciercleaver.name=氷河の大鉈
items.weapon.ice.glaciercleaver.desc=古き霜の氷から切り出した幅広の刃。命中すると標的を4ターンの間霜で覆う。次の氷河の大鉈の一撃が霜を砕き、%dの追加ダメージを与える。戦士だけが扱える。
actors.buffs.frostcoating.name=霜の被膜
actors.buffs.frostcoating.desc=この生物は薄い霜に覆われている。氷河の大鉈の一撃で砕ける。
items.weapon.ice.hoarfroststaff.name=白霜の杖
items.weapon.ice.hoarfroststaff.desc=先端の枝の間に冷気が集まっている。魔弾はスキル補正前で%d-%dのダメージを与え、2ターンの間移動と攻撃を遅くする。初期チャージは3回分で、ワンドと同じように再充填される。魔術師だけが扱える。
items.weapon.ice.rimepick.name=霜のピッケル
items.weapon.ice.rimepick.desc=装甲の隙間を突く細身のピッケル。標的の装甲の4分の1を無視し、不意を突いた場合は半分を無視する。盗賊だけが扱える。
items.weapon.ice.frostbow.name=霜の弓
items.weapon.ice.frostbow.desc=この弓から放たれた矢は、命中すると鋭い氷となって飛び散る。標的へのダメージが%d%%増え、隣接する敵にはその一撃の4分の1のダメージを与える。破片に凍結効果はない。女猟師だけが扱える。
items.weapon.ice.gravefrostscythe.name=墓霜の大鎌
items.weapon.ice.gravefrostscythe.desc=骨で巻かれた柄に霜が付着している。装備中は、あなたが召喚した骸骨と幽霊が一撃ごとに%dの追加冷気ダメージを与える。死霊術師だけが扱える。
items.weapon.ice.frostbiterifle.name=凍傷のライフル
items.weapon.ice.frostbiterifle.desc=薬室は決して溶けない氷で覆われている。射撃が命中すると2ターンの間凍傷を与え、移動速度を20%低下させる。さらに命中すると効果時間が更新される。傭兵だけが扱える。
library.ice_weapon_drop=各英雄の職業に合った武器を1つずつ落とす。

actors.mobs.npcs.prospector.name=足止めされた採掘師
actors.mobs.npcs.prospector.desc=継ぎはぎのコートを着た採掘師が、階段のそばで身を休めている。ランプの火は消えかけている。
actors.mobs.npcs.prospector.torches=ランプがもう長くもたないんだ。逃げる時、この階に物資の入った宝箱を置いてきた。中から_松明を3本_持ってきてくれないか？
actors.mobs.npcs.prospector.iceclaws=氷爪どもに坑道を追い出されたんだ。仕事に戻れるよう、_この階の氷爪を3体_倒してくれないか。
actors.mobs.npcs.prospector.accept=手伝おう。
actors.mobs.npcs.prospector.later=今はやめておく。
actors.mobs.npcs.prospector.need_torches=必要なのは_松明3本_だ。宝箱はまだこの階のどこかにある。
actors.mobs.npcs.prospector.claws_left=倒す氷爪はあと_%d_体だ。
actors.mobs.npcs.prospector.reward=助かったよ。どちらがいい？
actors.mobs.npcs.prospector.rations=食料2つ
actors.mobs.npcs.prospector.thanks=これで心配事が一つ減った。ありがとう。
library.quest.prospector_torches.name=消えかけのランプ
library.quest.prospector_torches.desc=足止めされた採掘師に松明を3本届ける。同じ階の宝箱に必要な数が入っている。
library.quest.prospector_iceclaws.name=坑道の氷爪
library.quest.prospector_iceclaws.desc=採掘師のいる階で氷爪を3体倒し、彼のもとへ戻る。
library.quest.prospector.reward=強化の巻物1つか食料2つを選べます。
items.scrolls.scrolloffrostlevel.read_confirm=読み進めると、今にもテレポートしそうな感覚がする。
