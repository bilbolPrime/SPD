levels.rebornsiderooms.leave=Låt vara
actors.mobs.npcs.echoreflection.name=din spegelbild
actors.mobs.npcs.echoreflection.desc=En blek kopia av dig väntar orörlig. Den slåss bara om du utmanar den. Besegra den för en färdighetspoäng. Lämnar du rummet avslutas duellen och spegelbilden återfår all hälsa.
actors.mobs.npcs.echoreflection.challenge=Utmana din spegelbild? En seger ger en färdighetspoäng. Du kan fly, men spegelbilden återhämtar sig om du lämnar rummet.
actors.mobs.npcs.echoreflection.accept=Utmana
actors.mobs.npcs.echoreflection.withdrawn=Din spegelbild blir stilla igen.
actors.mobs.npcs.echoreflection.victory=Spegelbilden löses upp och lämnar efter sig en färdighetsrulle.
actors.mobs.npcs.barbecueking.name=råttkungen
actors.mobs.npcs.barbecueking.desc=Även en kung måste äta. Han har hittat en lugn vrå där han grillar sin middag.
actors.mobs.npcs.barbecueking.greeting=Kungliga angelägenheter. Mycket viktiga. Mycket goda.
actors.mobs.npcs.barbecueking.stolen=HÖRRU! Den var min!
actors.mobs.npcs.barbecueking.after=Hoppas du sätter den i halsen.
actors.mobs.npcs.forgottenoffering.name=bortglömd offergåva
actors.mobs.npcs.forgottenoffering.desc=En matranson och en läkande dryck ligger under kristallen. Välj en; den andra blir till stoft.
actors.mobs.npcs.watchremains.name=fallen vakt
actors.mobs.npcs.watchremains.desc=En vakts ben ligger vid en sönderslagen vägg. Under hjälmen finns en papperslapp.
actors.mobs.npcs.watchremains.note=Höll dörren hela natten. De kom genom väggen.
