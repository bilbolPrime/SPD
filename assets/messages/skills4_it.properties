skills4.smash.intro=Colpisce un nemico adiacente con forza bruta.
skills4.endurance.intro=Aumenta la tua salute massima.
skills4.firm_hand.intro=Migliora la tua precisione nel combattimento corpo a corpo.
skills4.regeneration.intro=Recupera salute extra nel tempo. La fame ferma questa ripresa.
skills4.toughness.intro=Riduce i danni in arrivo, tranne la fame.
skills4.knockback.intro=Colpisce un nemico e lo spinge indietro di una casella. I boss non possono essere spinti.
skills4.second_wind.intro=Ripristina immediatamente un po' di salute.
skills4.sure_footing.intro=Riduce la durata dell'immobilizzazione e della menomazione.
skills4.mastery.intro=Permette di usare armi da mischia più pesanti e attaccare più velocemente.
skills4.parry.intro=Riduce il successivo colpo corpo a corpo che subisci. La guardia dura fino a quattro turni.
skills4.smite.intro=Sferra un colpo pesante che ignora metà dell'armatura del bersaglio. Richiede due turni.
skills4.riposte.intro=Dopo una parata, il tuo prossimo colpo corpo a corpo è più forte. Dura quattro turni.
skills4.footwork.intro=Ti dà più tempo tra i colpi corpo a corpo per mantenere una combo.
skills4.duelist.intro=Aumenta l'evasione quando hai un solo nemico accanto.
skills4.disarming_strike.intro=Colpisce un nemico e lo indebolisce per tre turni.
skills4.find_the_gap.intro=Il terzo colpo corpo a corpo consecutivo e i successivi ignorano parte dell'armatura del bersaglio.
skills4.aggression.intro=Il tuo danno corpo a corpo aumenta man mano che perdi salute.
skills4.charge.intro=Scatta verso un nemico entro quattro caselle e lo colpisce. Il percorso deve essere libero.
skills4.rampage.intro=Colpisce ogni nemico adiacente.
skills4.bloodlust.intro=Accelera gli attacchi corpo a corpo per tre turni dopo un'uccisione.
skills4.war_cry.intro=Indebolisce i nemici visibili entro due caselle.
skills4.rend.intro=Carica e Furia fanno sanguinare i nemici che sopravvivono.
skills4.relentless.intro=Uccidere un nemico riduce il tempo di recupero restante di Carica e Grido di guerra.
skills4.cornered.intro=Riduce i danni corpo a corpo subiti mentre due o più nemici ti circondano.

skills4.spark.intro=Spara una scintilla contro un nemico visibile.
skills4.spirituality.intro=Aumenta il tuo mana massimo.
skills4.sorcerer.intro=Le tue bacchette infliggono più danni.
skills4.summon_rat.intro=Chiama un topo perché combatta per te.
skills4.meditation.intro=Recupera mana extra nel tempo.
skills4.spirit_armor.intro=Assorbe i danni utilizzando un mana per punto assorbito.
skills4.wizard.intro=Le tue bacchette si ricaricano più velocemente.
skills4.channeling.intro=Riduce i tempi di recupero delle abilità attive, ad un minimo di un turno.
skills4.charged_staff.intro=I colpi corpo a corpo con la bacchetta recuperano mana.
skills4.arcane_ward.intro=Riduce il prossimo colpo corpo a corpo che subisci. La protezione dura fino a quattro turni.
skills4.arcane_strike.intro=Sferra un colpo magico che ignora metà dell'armatura del bersaglio.
skills4.conductive.intro=I colpi corpo a corpo con la bacchetta attingono alle cariche immagazzinate per danni extra. Ogni colpo andato a segno consuma una carica invece di ricaricare la bacchetta.
skills4.discharge.intro=Danneggia tutti i nemici adiacenti con un'esplosione di magia.
skills4.spellweave.intro=Aumenta il danno della bacchetta per tre turni dopo aver messo a segno un colpo corpo a corpo.
skills4.drain_life.intro=Danneggia un nemico e ti cura per metà della salute che perde.
skills4.rabid_minions.intro=Le tue creature evocate infliggono più danni.
skills4.summon_skeleton.intro=Chiama uno scheletro affinché combatta per te.
skills4.soul_hunger.intro=Ripristina il mana quando uccidi un nemico.
skills4.enrage.intro=Quando questa abilità è attiva, le tue creature evocate infliggono e subiscono più danni.
skills4.slow.intro=Rallenta i movimenti e gli attacchi di un nemico.
skills4.summoner.intro=Puoi tenere un'altra creatura evocata.
skills4.dark_pact.intro=Sacrifica cinque punti salute per ripristinare il mana. Richiede almeno sei punti salute.

skills4.double_strike.intro=Colpisce due volte in rapida successione.
skills4.stealth.intro=Ti rende più difficile da notare per i nemici.
skills4.evasion.intro=Aumenta le tue possibilità di schivare gli attacchi.
skills4.smoke_bomb.intro=Ti fa svanire in una nuvola di fumo. Attaccare interrompe l'effetto.
skills4.bandit.intro=Trova oro extra in ogni pila che raccogli.
skills4.venom.intro=Quando questa abilità è attiva, i colpi in mischia possono avvelenare il bersaglio.
skills4.locksmith.intro=Hai la possibilità di disinnescare una trappola quando ci passi sopra.
skills4.light_step.intro=Riduce la durata dell'immobilizzazione e della menomazione.
skills4.dash.intro=Ti sposta fino a due caselle lungo un percorso libero.
skills4.haste.intro=Aumenta la velocità di movimento per cinque turni.
skills4.shadow_clone.intro=Crea un clone forte o tre cloni più deboli che combattano per te.
skills4.escape.intro=Rimuove immobilizzazione e menomazione, poi aumenta la schivata per quattro turni.
skills4.trailblazer.intro=Aumenta la velocità di movimento.
skills4.skirmish.intro=Il movimento rafforza il tuo prossimo colpo corpo a corpo.
skills4.keep_distance.intro=Aumenta la schivata contro nemici a più di una casella di distanza.
skills4.ambush.intro=Aumenta il danno corpo a corpo mentre sei invisibile.
skills4.scorpion.intro=Il tuo veleno infligge più danni.
skills4.silent_death.intro=Gli attacchi in mischia possono uccidere direttamente i nemici addormentati. I boss sono immuni.
skills4.expose.intro=I tuoi colpi in mischia ignorano parte dell'armatura.
skills4.execution.intro=Aumenta il danno contro i nemici con meno di un quarto di salute.
skills4.deadly_throw.intro=Aumenta il danno delle armi a distanza.

skills4.accuracy.intro=I tuoi attacchi a distanza sono più precisi.
skills4.awareness.intro=Hai la possibilità di schivare un attacco a distanza in arrivo.
skills4.double_shot.intro=Scocca due frecce in rapida successione. Consuma due frecce ordinarie.
skills4.hunting.intro=Trova carne cruda mentre esplori.
skills4.fletching.intro=Crea frecce ordinarie mentre esplori.
skills4.ko_arrow.intro=La tua prossima freccia rallenta il suo bersaglio e potrebbe addormentarlo.
skills4.woodcraft.intro=Ti rende più difficile da notare per i nemici.
skills4.quickdraw.intro=Accelera i tuoi attacchi a distanza.
skills4.barkskin.intro=Aumenta la tua armatura.
skills4.nature_mend.intro=Ripristina immediatamente un po' di salute.
skills4.entangle.intro=Immobilizza un nemico visibile sul posto.
skills4.herbalist.intro=Riduce i danni da veleno.
skills4.dew_keeper.intro=Aumenta la guarigione ricevuta dalla rugiada.
skills4.knee_shot.intro=Le tue frecce possono menomare il bersaglio.
skills4.thicket.intro=Riduce il successivo colpo corpo a corpo che subisci. La guardia dura fino a quattro turni.
skills4.aimed_shot.intro=Aumenta il danno del prossimo colpo di freccia.
skills4.long_sight.intro=Aumenta il danno a distanza contro nemici lontani almeno quattro caselle.
skills4.piercing_shot.intro=La prossima freccia ignora parte dell'armatura del bersaglio.
skills4.iron_tip.intro=Le frecce attraversano i nemici e possono colpire chi si trova dietro. Muri e alleati le fermano.
skills4.mark_prey.intro=Marchia un nemico per sei turni, aumentando il danno contro di esso.
skills4.bombvoyage.intro=Trasforma una freccia in una bomba. L'esplosione può anche ferire te e i tuoi alleati.
skills4.follow_through.intro=Un'uccisione rafforza il tuo prossimo colpo a distanza per quattro turni.

skills4.curse.intro=Indebolisce gli attacchi di un nemico per dieci turni.
skills4.necro_spirit.intro=Aumenta il tuo mana massimo.
skills4.raise_skeleton.intro=Rianima uno scheletro da un cadavere a terra.
skills4.summon_ghost.intro=Chiama un fantasma affinché combatta per te.
skills4.soul_bind.intro=Aumenta il danno delle tue evocazioni.
skills4.necro_meditation.intro=Recupera mana extra nel tempo.
skills4.necro_drain_life.intro=Prosciuga la salute di un nemico e recupera la metà del danno inflitto.
skills4.master_of_death.intro=Ti riporta in vita con tutta la salute e il mana. Questo potere deve ricaricarsi prima di poterti salvare di nuovo.
skills4.spirit_army.intro=Permette di mantenere un'ulteriore evocazione.
skills4.mend_bones.intro=Cura le tue creature evocate visibili.
skills4.guardian_bond.intro=Riduce i danni subiti dalle tue creature evocate.
skills4.corpse_explosion.intro=Fai esplodere un cadavere. L'esplosione colpisce chiunque si trovi nelle vicinanze, compresi te e i tuoi alleati.
skills4.raise_skeleton_archer.intro=Rianima uno scheletro arciere da un cadavere a terra.
skills4.last_rites.intro=Fornisce a ciascuna evocazione una possibilità di sopravvivere a un colpo fatale con un quarto di salute.
skills4.soul_shelter.intro=Riduce il prossimo colpo corpo a corpo che subisci. La protezione dura fino a quattro turni.
skills4.cold_touch.intro=Colpisce un nemico e lo rallenta per tre turni.
skills4.necro_slow.intro=Rallenta i movimenti e gli attacchi di un nemico.
skills4.bone_spear.intro=Scaglia un dardo di magia tombale contro un nemico.
skills4.death_fed.intro=Ripristina il mana quando uccidi un nemico.
skills4.cruel_study.intro=Aumenta il danno inflitto dalle bacchette.
skills4.withering_wave.intro=Danneggia i nemici adiacenti con il freddo e li rallenta per tre turni.

skills4.steady_aim.intro=I tuoi spari sono più precisi.
skills4.packrat.intro=Aumenta la capienza del caricatore dell'arma da fuoco.
skills4.fast_reload.intro=Accelera la ricarica dell'arma da fuoco.
skills4.quick_draw.intro=Accelera gli attacchi con le armi da fuoco.
skills4.veteran_company.intro=I mercenari assoldati sotto il tuo comando infliggono più danni.
skills4.field_medicine.intro=Ripristina immediatamente un po' di salute.
skills4.powder.intro=Aumenta il danno dell'arma da fuoco.
skills4.steady_nerves.intro=Riduce la durata dell'immobilizzazione e della menomazione.
skills4.volley.intro=Spara un colpo più forte.
skills4.rally.intro=Cura te e i tuoi alleati entro due caselle.
skills4.guard_order.intro=I mercenari assoldati sotto il tuo comando subiscono meno danni.
skills4.suppress.intro=Il tuo prossimo colpo con l'arma da fuoco indebolisce il suo bersaglio.
skills4.counter_fire.intro=Subire danni corpo a corpo rafforza il tuo prossimo colpo con l'arma da fuoco per quattro turni.
skills4.i_am_the_law.intro=Aumenta temporaneamente la tua salute massima e attuale per venti turni.
skills4.headshot.intro=Il prossimo colpo con l'arma da fuoco è più preciso e infligge più danni.
skills4.intimidate.intro=Spaventa un nemico visibile. I boss sono immuni.
skills4.wanted.intro=Guadagna oro per ogni nemico ostile che uccidi.
skills4.no_witnesses.intro=Il tuo prossimo colpo di pistola infligge più danni e manda in fuga i nemici sopravvissuti.
skills4.armor_piercer.intro=I tuoi colpi a distanza ignorano parte dell'armatura.
skills4.execute.intro=I colpi di pistola finiscono i nemici gravemente feriti. I boss sono immuni.
skills4.final_notice.intro=Il prossimo colpo a segno con l'arma da fuoco ignora una parte maggiore dell'armatura.

