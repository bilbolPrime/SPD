skills4.subclass.gladiator=I colpi corpo a corpo messi a segno creano una combo, aggiungendo danni ai colpi successivi.\n\n_+3 precisione corpo a corpo_\n_Attacchi corpo a corpo più veloci del 10%_
skills4.subclass.berserker=Al di sotto del 40% di salute, Furia aumenta i danni del 50%.\n\n_10% in più di danni corpo a corpo_\n_10% in meno di danni in arrivo_
skills4.subclass.battlemage=I colpi in mischia con la bacchetta ripristinano una carica e aggiungono il numero di cariche al danno.\n\n_Scintilla ha il 50% di probabilità di accecare il bersaglio per 3 turni._
skills4.subclass.warlock=Uccidere i nemici ripristina la salute e placa la fame.\n\n_Scintilla infligge 5 danni in più._\n_Una creatura evocata in più._
skills4.subclass.freerunner=Senza equipaggiamento troppo pesante e finché non stai morendo di fame, ti muovi il 60% più velocemente. La tua evasione raddoppia durante il movimento.
skills4.subclass.assassin=Gli attacchi a sorpresa infliggono danni extra.\n\n_+1 furtività_
skills4.subclass.warden=Calpestare l'erba alta conferisce Pelle di corteccia. Le piante possono lasciare semi e rugiada aggiuntivi.
skills4.subclass.sniper=Gli attacchi a distanza ignorano l'armatura e marchiano il bersaglio per accelerare l'attacco successivo.\n\n_20% di danni a distanza in più_
skills4.subclass.spirit_binder=I colpi in mischia con la bacchetta ripristinano una carica e aggiungono il numero di cariche al danno.\n\n_Gli scheletri rianimati durano il doppio._
skills4.subclass.lich=Uccidere i nemici ripristina la salute e placa la fame.\n\n_Gli scheletri e gli arcieri scheletrici rianimati ottengono il 25% di salute e danni in più._\n_Una creatura evocata in più._
skills4.subclass.marshal=I colpi corpo a corpo messi a segno creano una combo.\n\n_+5 munizioni per la pistola_\n_+1 precisione della pistola_
skills4.subclass.executioner=Al di sotto del 40% di salute, Furia aumenta i danni del 50% e gli spari sono più veloci del 50%.\n\n_Ricarica più veloce del 25%_
