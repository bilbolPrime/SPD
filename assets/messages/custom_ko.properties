levels.sign.burn=당신이 간판을 읽으려고 하는 순간, 간판은 초록빛 불꽃으로 타오릅니다.
levels.sign.tip_01=자신의 힘을 과대평가하지 말고, 다룰 수 있는 무기와 갑옷을 사용하세요.
levels.sign.tip_05=끈적끈적한 액체를 조심하세요!
levels.sign.tip_06=Pixel-Mart - 성공적인 모험에 필요한 모든 것!
levels.sign.tip_07=물약과 두루마리를 최대한 빨리 감정하세요. 실제로 필요할 때까지 미루지 마세요.
levels.sign.tip_08=배고픔은 고통스럽지 않지만, 굶주림은 고통스럽다.
levels.sign.tip_10=텐구를 내보내지 마!
levels.sign.tip_11=픽셀마트. 돈을 쓰세요. 더 오래 사세요.
levels.sign.tip_12=여러 몬스터에게 동시에 공격받을 때는 문 뒤로 후퇴하세요.
levels.sign.tip_14=동시에 앙크를 두 개 이상 소유하는 것은 의미가 없습니다. 부활할 때 모두 잃게 되기 때문입니다.
levels.sign.tip_15=위험! 중장비는 부상, 사지 절단 또는 사망을 초래할 수 있습니다!
levels.sign.tip_16=픽셀마트. 던전 속 더 안전한 삶.
levels.sign.tip_17=마법이 부여된 무기를 업그레이드할 때, 마법이 파괴될 확률이 있습니다.
levels.sign.tip_18=무기와 갑옷은 지팡이와 반지보다 더 빨리 마모되지만, 수리할 수 있는 방법은 더 많습니다.
levels.sign.tip_19=전멸의 두루마리를 얻는 유일한 방법은 던전 정령으로부터 선물로 받는 것입니다.
levels.sign.tip_20=폐하 앞에서는 무기를 소지할 수 없습니다!
