items.bags.keyring.info=이것은 구리로 만든 열쇠고리로, 열쇠를 다른 소지품과 분리하여 보관할 수 있게 해줍니다.
custom.difficulty.easy=쉬운
custom.difficulty.easy.desc=- 추가 식량 2개로 시작합니다. - 회복 물약 2개로 시작합니다. - 금화 200개로 시작합니다. - 영혼 수정 2개로 시작합니다. - 숨겨진 문과 함정을 발견할 때 보너스를 받습니다. - 몬스터가 약해져서 공격력이 25% 감소하고, 받는 피해는 10% 증가하며, 체력이 15% 감소합니다. - 챔피언 출현 확률이 10%로 설정됩니다. - 챔피언 드롭률이 30%로 설정됩니다.
custom.difficulty.hard=딱딱한
custom.difficulty.hard.desc=- 회복 물약은 최대 체력의 75%를 회복합니다. - 몬스터가 강해지며, 공격력이 10% 증가하고, 받는 피해는 10% 감소하며, 체력은 20% 증가합니다. - 챔피언 출현 확률이 30%로 설정되었습니다. - 챔피언 드롭률이 50%로 설정되었습니다.
custom.difficulty.hell.desc=- 회복 물약은 최대 체력의 50%를 회복합니다. - 몬스터는 불멸이며, 공격력은 35% 증가하고, 받는 피해는 30% 감소하며, 체력은 45% 증가합니다. - 챔피언 생성 확률이 50%로 설정되었습니다. - 영웅의 최대 체력이 4 감소한 상태로 시작합니다. - 영웅의 최대 체력이 레벨업 시 1 감소합니다. - 챔피언 드롭률이 70%로 설정되었습니다.
custom.difficulty.just_kill_me=날 죽여줘
custom.difficulty.just_kill_me.desc=- 경험치 물약 2개를 가지고 시작합니다. \n - 회복 물약은 최대 체력의 10%를 회복합니다. \n - 몬스터는 신급으로, 공격력 60% 증가, 받는 피해 40% 감소, 체력 75% 증가 효과를 가집니다. \n - 챔피언 생성 확률이 100%로 설정됩니다. \n - 영웅의 최대 체력이 8 감소한 상태로 시작합니다. \n - 영웅의 레벨업 시 최대 체력 증가량이 3 감소합니다. \n - 챔피언 드롭률이 100%로 설정됩니다.
custom.difficulty.nightmare.desc=- 회복 물약은 최대 체력의 25%를 회복합니다. - 몬스터는 신과 같은 능력을 가지며, 공격력은 45% 증가하고, 받는 피해는 30% 감소하며, 체력은 60% 증가합니다. - 챔피언 생성 확률이 70%로 설정되었습니다. - 영웅의 최대 체력이 8 감소한 상태로 시작합니다. - 영웅의 최대 체력이 레벨업 시 3 감소합니다. - 챔피언 드롭률이 90%로 설정되었습니다.
custom.difficulty.normal.desc=- 몬스터는 표준입니다. \n - 챔피언 생성률은 20%로 설정되었습니다. \n - 챔피언 드롭률은 40%로 설정되었습니다.
custom.difficulty.super_easy=아주 쉬워요
custom.difficulty.super_easy.desc=- 추가 식량 5개로 시작합니다. - 회복 물약 5개로 시작합니다. - 금화 500개로 시작합니다. - 영혼 수정 3개로 시작합니다. - 몬스터들이 약해집니다. 공격력은 50% 감소하고, 받는 피해는 50% 증가하며, 체력도 50% 감소합니다. - 챔피언 출현 확률이 10%로 설정됩니다. - 챔피언 드롭률이 10%로 설정됩니다.
levels.sign.dead_end=여기서 뭐 하는 거야?!
levels.sign.tip_02=던전 안의 모든 문이 처음부터 보이는 것은 아닙니다. 막혔다면 숨겨진 문을 찾아보세요.
levels.sign.tip_03=힘 스탯을 올리는 것만이 더 좋은 장비를 얻는 유일한 방법은 아니라는 점을 기억하세요. 업그레이드 스크롤을 사용하면 장비의 힘 요구치를 낮출 수도 있습니다.
levels.sign.tip_04=던전 깊숙한 곳에 있는 상점에서 골드를 사용할 수 있습니다. 첫 번째 상점은 6층에 있습니다.
levels.sign.tip_09=기습 공격은 성공 확률이 더 높습니다. 예를 들어, 적이 다가오는 것을 알고 있다면 닫힌 문 뒤에서 매복 공격을 할 수 있습니다.
levels.sign.tip_13=몸에 불이 붙은 상태에서 공중에 떠 있으면 물속에서 불을 끌 수 없습니다.
levels.sign.tip_21=픽셀마트. 악마 사냥꾼을 위한 특별 가격!
actors.blobs.waterofawareness.drink_message=한 모금 마시면 지식이 머릿속으로 쏟아져 들어오는 것을 느낄 수 있습니다. 이제 장착한 아이템에 대한 모든 것을 알게 되었고, 레벨에 있는 모든 아이템의 위치와 비밀까지 파악할 수 있게 되었습니다.
