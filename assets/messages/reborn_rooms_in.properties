levels.rebornsiderooms.leave=Biarkan
actors.mobs.npcs.echoreflection.name=bayanganmu
actors.mobs.npcs.echoreflection.desc=Salinan pucat dirimu menunggu tanpa bergerak. Ia hanya bertarung jika ditantang. Kalahkan untuk mendapat satu poin keterampilan. Keluar dari ruangan mengakhiri duel dan memulihkan seluruh kesehatannya.
actors.mobs.npcs.echoreflection.challenge=Tantang bayanganmu? Kemenangan memberi satu poin keterampilan. Kamu boleh mundur, tetapi bayanganmu akan pulih jika kamu keluar dari ruangan.
actors.mobs.npcs.echoreflection.accept=Tantang
actors.mobs.npcs.echoreflection.withdrawn=Bayanganmu kembali diam.
actors.mobs.npcs.echoreflection.victory=Bayanganmu lenyap, meninggalkan gulungan keterampilan.
actors.mobs.npcs.barbecueking.name=raja tikus
actors.mobs.npcs.barbecueking.desc=Raja juga perlu makan. Ia menemukan sudut tenang untuk memanggang makan malamnya.
actors.mobs.npcs.barbecueking.greeting=Urusan kerajaan. Sangat penting. Sangat lezat.
actors.mobs.npcs.barbecueking.stolen=HEI! Itu punyaku!
actors.mobs.npcs.barbecueking.after=Semoga tersedak.
actors.mobs.npcs.forgottenoffering.name=persembahan terlupakan
actors.mobs.npcs.forgottenoffering.desc=Seporsi makanan dan ramuan penyembuh menunggu di bawah kristal. Pilih satu; yang lain akan menjadi debu.
actors.mobs.npcs.watchremains.name=penjaga gugur
actors.mobs.npcs.watchremains.desc=Tulang seorang penjaga tergeletak di dekat dinding jebol. Ada secarik kertas di bawah helmnya.
actors.mobs.npcs.watchremains.note=Menahan pintu semalaman. Mereka masuk lewat dinding.
