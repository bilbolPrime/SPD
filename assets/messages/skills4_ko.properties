skills4.smash.intro=인접한 적에게 강력한 일격을 가합니다.
skills4.endurance.intro=최대 체력이 증가합니다.
skills4.firm_hand.intro=근접 공격의 명중률이 증가합니다.
skills4.regeneration.intro=기본 회복에 더해 일정한 턴마다 체력을 회복합니다. 굶주린 상태에서는 회복되지 않습니다.
skills4.toughness.intro=굶주림으로 인한 피해를 제외한 모든 피해를 줄입니다.
skills4.knockback.intro=적을 공격하고 한 타일 뒤로 밀어냅니다. 보스는 밀 수 없습니다.
skills4.second_wind.intro=즉시 체력을 회복합니다.
skills4.sure_footing.intro=속박과 불구의 지속 시간이 줄어듭니다.
skills4.mastery.intro=더 무거운 근접 무기를 다룰 수 있고 공격 속도가 증가합니다.
skills4.parry.intro=다음에 받는 근접 피해를 줄입니다. 보호 효과는 최대 4턴 동안 유지됩니다.
skills4.smite.intro=대상의 방어력 절반을 무시하는 강력한 일격을 가합니다. 2턴을 소모합니다.
skills4.riposte.intro=공격을 막아내면 다음 근접 공격이 강해집니다. 효과는 4턴 동안 유지됩니다.
skills4.footwork.intro=다음 공격까지 시간이 더 지나도 연속 공격을 이어갈 수 있습니다.
skills4.duelist.intro=바로 옆에 적이 하나만 있으면 회피가 증가합니다.
skills4.disarming_strike.intro=적을 공격하고 3턴 동안 약화시킵니다.
skills4.find_the_gap.intro=근접 공격을 연속으로 명중시키면 세 번째 공격부터 대상의 방어력을 일부 무시합니다.
skills4.aggression.intro=체력을 잃으면 근접 피해가 증가합니다.
skills4.charge.intro=4칸 이내의 적에게 돌진해 공격합니다. 경로에 장애물이 없어야 합니다.
skills4.rampage.intro=인접한 모든 적을 공격합니다.
skills4.bloodlust.intro=처치 후 3턴 동안 근접 공격 속도가 빨라집니다.
skills4.war_cry.intro=두 타일 내에 보이는 적들을 약화시킵니다.
skills4.rend.intro=돌진과 난동을 맞고 살아남은 적에게 출혈을 일으킵니다.
skills4.relentless.intro=적을 처치하면 돌진과 전쟁의 함성의 남은 재사용 대기시간이 줄어듭니다.
skills4.cornered.intro=바로 옆에 적이 둘 이상 있으면 받는 근접 피해가 줄어듭니다.

skills4.spark.intro=눈에 보이는 적에게 불꽃을 발사합니다.
skills4.spirituality.intro=최대 마나가 증가합니다.
skills4.sorcerer.intro=지팡이가 더 많은 피해를 입힙니다.
skills4.summon_rat.intro=함께 싸울 쥐를 소환합니다.
skills4.meditation.intro=시간이 지남에 따라 추가 마나를 회복합니다.
skills4.spirit_armor.intro=마나로 피해를 흡수합니다. 피해 1을 흡수할 때마다 마나 1을 소모합니다.
skills4.wizard.intro=지팡이가 더 빨리 재충전됩니다.
skills4.channeling.intro=사용하는 스킬의 재사용 대기시간이 줄어듭니다. 1턴 미만으로는 줄어들지 않습니다.
skills4.charged_staff.intro=지팡이 근접 공격으로 마나를 회복합니다.
skills4.arcane_ward.intro=다음에 받는 근접 피해를 줄입니다. 보호 효과는 최대 4턴 동안 유지됩니다.
skills4.arcane_strike.intro=대상의 방어력 절반을 무시하는 마법 타격을 가합니다.
skills4.conductive.intro=지팡이의 남은 충전량에 따라 근접 피해가 늘어납니다. 공격이 명중할 때마다 지팡이를 충전하는 대신 충전량을 1 소모합니다.
skills4.discharge.intro=폭발적인 마법으로 인접한 모든 적에게 피해를 줍니다.
skills4.spellweave.intro=근접 공격을 가한 후 3턴 동안 지팡이 피해가 증가합니다.
skills4.drain_life.intro=적에게 피해를 주고, 적이 잃은 체력의 절반만큼 자신의 체력을 회복합니다.
skills4.rabid_minions.intro=소환된 생물이 더 많은 피해를 입힙니다.
skills4.summon_skeleton.intro=함께 싸울 해골을 소환합니다.
skills4.soul_hunger.intro=적을 죽이면 마나가 회복됩니다.
skills4.enrage.intro=활성화된 동안 소환수는 더 많은 피해를 주지만 더 많은 피해를 입습니다.
skills4.slow.intro=적의 이동과 공격을 느리게 합니다.
skills4.summoner.intro=동시에 유지할 수 있는 소환수가 한 마리 늘어납니다.
skills4.dark_pact.intro=마나를 회복하기 위해 체력 5를 희생합니다. 체력이 6 이상 필요합니다.

skills4.double_strike.intro=빠르게 연속해서 두 번 공격합니다.
skills4.stealth.intro=적들이 알아채기 어렵게 만듭니다.
skills4.evasion.intro=공격을 회피할 확률이 향상됩니다.
skills4.smoke_bomb.intro=연기 구름 속으로 사라집니다. 공격하면 효과가 깨집니다.
skills4.bandit.intro=골드를 주울 때 더 많은 양을 얻습니다.
skills4.venom.intro=활성화된 동안 근접 공격으로 대상을 중독시킬 수 있습니다.
skills4.locksmith.intro=함정을 밟으면 함정을 해제할 기회가 있습니다.
skills4.light_step.intro=속박과 불구의 지속 시간이 줄어듭니다.
skills4.dash.intro=장애물이 없는 경로를 따라 최대 2칸 이동합니다.
skills4.haste.intro=5턴 동안 이동 속도가 증가합니다.
skills4.shadow_clone.intro=함께 싸울 강한 분신 하나나 약한 분신 셋을 만듭니다.
skills4.escape.intro=속박과 불구를 해제하고 4턴 동안 회피를 높입니다.
skills4.trailblazer.intro=이동 속도가 증가합니다.
skills4.skirmish.intro=움직이면 다음 근접 공격이 강화됩니다.
