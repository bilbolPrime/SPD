skills4.subclass.assassin=기습 공격의 피해가 증가합니다.\n\n_은신 +1_
skills4.subclass.warden=키가 큰 풀을 짓밟으면 나무껍질이 부여됩니다. 식물은 여분의 씨앗과 이슬을 생산할 수 있습니다.
skills4.subclass.sniper=원거리 공격이 방어력을 무시하고 대상에게 표식을 남겨 다음 공격을 빠르게 합니다.\n\n_원거리 피해 20% 증가_
skills4.subclass.spirit_binder=지팡이의 근접 공격이 명중하면 충전량이 1 회복되고, 현재 충전량만큼 피해가 추가됩니다.\n\n_되살린 해골의 지속 시간이 두 배가 됩니다._
skills4.subclass.lich=적을 처치하면 체력을 회복하고 허기를 달랩니다.\n\n_되살린 해골과 해골 궁수의 체력과 피해량이 25% 증가합니다._\n_동시에 유지할 수 있는 소환수가 1마리 늘어납니다._
skills4.subclass.marshal=근접 공격에 성공하면 콤보가 형성됩니다.\n\n_+5 총기 탄약_\n_+1 총 정확도_
skills4.subclass.executioner=체력이 40% 미만이면 분노로 피해가 50% 증가하고 총격 속도가 50% 빨라집니다.\n\n_재장전 속도 25% 증가_
skills4.spark.warlock=요술 장이: 피해량 +5.
skills4.spark.battlemage=전투 마법사: 50% 확률로 대상을 3턴 동안 실명시킵니다.
skills4.summon.warlock=흑마법사: 소환수 한 마리를 더 유지할 수 있습니다.
skills4.summon.lich=리치: 소환수를 한 마리 더 유지할 수 있습니다. 되살린 해골과 해골 궁수의 체력과 피해량이 25% 증가합니다.
skills4.raise.spirit_binder=영혼 결속자: 되살린 해골의 지속시간이 두 배가 됩니다.
