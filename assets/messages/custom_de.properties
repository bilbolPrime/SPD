items.bags.keyring.info=Dies ist ein Schlüsselanhänger aus Kupfer, mit dem Sie Ihre Schlüssel getrennt von Ihren übrigen Gegenständen aufbewahren können.
custom.difficulty.easy=Einfach
custom.difficulty.easy.desc=- Startet mit 2 zusätzlichen Rationen. - Startet mit 2 Heiltränken. - Startet mit 200 Gold. - Startet mit 2 Seelenkristallen. - Bonus beim Entdecken versteckter Türen und Fallen. - Gegner sind geschwächt, verursachen 25 % weniger Schaden, erleiden 10 % mehr Schaden und haben 15 % weniger Lebenspunkte. - Die Spawnrate von Champions wurde auf 10 % gesetzt. - Die Drop-Rate von Champions wurde auf 30 % gesetzt.
custom.difficulty.hard=Hart
custom.difficulty.hard.desc=- Heiltrank heilt 75 % der maximalen HP. - Gegner sind stark, verursachen 10 % mehr Schaden, erleiden 10 % weniger Schaden und haben 20 % mehr HP. - Die Spawnrate von Champions wurde auf 30 % gesetzt. - Die Drop-Rate von Champions wurde auf 50 % gesetzt.
custom.difficulty.hell.desc=- Heiltrank heilt 50 % der maximalen HP. - Monster sind unsterblich, verursachen 35 % mehr Schaden, erleiden 30 % weniger Schaden und haben 45 % mehr HP. - Die Spawnrate von Champions wurde auf 50 % gesetzt. - Der Held startet mit 4 weniger maximalen HP. - Der Held erhält beim Stufenaufstieg 1 weniger maximale HP. - Die Drop-Rate von Champions wurde auf 70 % gesetzt.
custom.difficulty.just_kill_me=Tötet mich einfach
custom.difficulty.just_kill_me.desc=- Beginnt mit zwei Erfahrungstränken. - Heiltrank heilt 10 % der maximalen HP. - Gegner sind Gottheiten, verursachen 60 % mehr Schaden, erleiden 40 % weniger Schaden und haben 75 % mehr HP. - Champion-Spawnrate auf 100 % gesetzt. - Held beginnt mit 8 weniger maximalen HP. - Held erhält beim Stufenaufstieg 3 weniger maximale HP. - Champion-Drop-Rate auf 100 % gesetzt.
custom.difficulty.nightmare.desc=- Heiltrank heilt 25 % der maximalen HP. - Monster sind gottgleich, verursachen 45 % mehr Schaden, erleiden 30 % weniger Schaden und haben 60 % mehr HP. - Die Spawnrate von Champions wurde auf 70 % gesetzt. - Der Held startet mit 8 weniger maximalen HP. - Der Held erhält beim Stufenaufstieg 3 weniger maximale HP. - Die Drop-Rate von Champions wurde auf 90 % gesetzt.
custom.difficulty.normal.desc=- Mobs sind Standard.\n- Champion-Spawnrate auf 20% eingestellt.\n- Champion-Droprate auf 40% eingestellt.
custom.difficulty.super_easy=Super einfach
custom.difficulty.super_easy.desc=- Starte mit 5 zusätzlichen Rationen.\n - Starte mit 5 Heiltränken.\n - Starte mit 500 Gold.\n - Starte mit 3 Seelenkristallen.\n - Monster sind schwach, verursachen 50 % weniger Schaden, erleiden 50 % mehr Schaden und haben 50 % weniger Lebenspunkte.\n - Die Spawnrate von Champions wurde auf 10 % gesetzt.\n - Die Drop-Rate von Champions wurde auf 10 % gesetzt.
levels.sign.dead_end=Was machst du hier?!
levels.sign.tip_02=Nicht alle Türen im Verlies sind auf den ersten Blick sichtbar. Falls ihr nicht weiterkommt, sucht nach versteckten Türen.
levels.sign.tip_03=Bedenke, dass du bessere Ausrüstung nicht nur durch Stärkeerhöhung erhalten kannst. Du kannst auch den umgekehrten Weg gehen und die Stärkeanforderungen mithilfe von Aufwertungsrollen senken.
levels.sign.tip_04=Du kannst dein Gold in Läden in den tieferen Ebenen des Dungeons ausgeben. Der erste befindet sich auf Ebene 6.
levels.sign.tip_09=Ein Überraschungsangriff hat eine höhere Trefferchance. Beispielsweise können Sie Ihren Feind hinter einer geschlossenen Tür überfallen, wenn Sie wissen, dass er sich nähert.
levels.sign.tip_13=Wenn man brennt, kann man das Feuer nicht im Wasser löschen, während man schwebt.
levels.sign.tip_21=Pixel-Mart. Sonderpreise für Dämonenjäger!
actors.blobs.waterofawareness.drink_message=Während du einen Schluck nimmst, spürst du, wie das Wissen in deinen Geist strömt. Nun weißt du alles über deine ausgerüsteten Gegenstände. Außerdem nimmst du alle Gegenstände im Level wahr und kennst all seine Geheimnisse.
