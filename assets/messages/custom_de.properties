levels.sign.burn=Als Sie versuchen, das Schild zu lesen, geht es in grünlichen Flammen auf.
levels.sign.tip_01=Überschätze deine Stärke nicht, benutze Waffen und Rüstungen, mit denen du umgehen kannst.
levels.sign.tip_05=Vorsicht vor Schleim!
levels.sign.tip_06=Pixel-Mart – alles, was du für ein erfolgreiches Abenteuer brauchst!
levels.sign.tip_07=Identifiziere deine Tränke und Schriftrollen so früh wie möglich. Warte nicht bis zu dem Moment, in dem du sie tatsächlich brauchst.
levels.sign.tip_08=Hunger zu haben tut nicht weh, aber zu verhungern tut weh.
levels.sign.tip_10=Lass den Tengu nicht frei!
levels.sign.tip_11=Pixel-Mart. Geld ausgeben. Länger leben.
levels.sign.tip_12=Wenn du von mehreren Monstern gleichzeitig angegriffen wirst, versuche, dich hinter eine Tür zurückzuziehen.
levels.sign.tip_14=Es macht keinen Sinn, mehr als ein Ankh gleichzeitig zu besitzen, da man sie bei der Wiederbelebung verliert.
levels.sign.tip_15=GEFAHR! Schwere Maschinen können Verletzungen, den Verlust von Gliedmaßen oder den Tod verursachen!
levels.sign.tip_16=Pixel-Mart. Ein sichereres Leben im Dungeon.
levels.sign.tip_17=Beim Aufwerten einer verzauberten Waffe besteht die Chance, dass diese Verzauberung zerstört wird.
levels.sign.tip_18=Waffen und Rüstungen verschleißen schneller als Zauberstäbe und Ringe, aber es gibt mehr Möglichkeiten, sie zu reparieren.
levels.sign.tip_19=Die einzige Möglichkeit, eine Schriftrolle der Vernichtung zu erhalten, besteht darin, sie als Geschenk von den Dungeon-Geistern zu bekommen.
levels.sign.tip_20=In Gegenwart Seiner Majestät sind keine Waffen erlaubt!
