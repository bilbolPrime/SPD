skills4.smash.intro=以蛮力打击相邻敌人。
skills4.endurance.intro=增加最大生命值。
skills4.firm_hand.intro=提高近战命中率。
skills4.regeneration.intro=随时间额外恢复生命。饥饿时停止恢复。
skills4.toughness.intro=减少受到的伤害，饥饿伤害除外。
skills4.knockback.intro=打击敌人并将其击退一格。无法击退首领。
skills4.second_wind.intro=立即恢复部分生命。
skills4.sure_footing.intro=缩短缠绕和残废的持续时间。
skills4.mastery.intro=让你能使用更重的近战武器，并提高攻击速度。
skills4.parry.intro=减轻下一次受到的近战伤害。防备最多持续四回合。
skills4.smite.intro=发动沉重一击，无视目标一半护甲。消耗两回合。
skills4.riposte.intro=格挡后强化下一次近战攻击。效果持续四回合。
skills4.footwork.intro=延长近战连击允许的攻击间隔。
skills4.duelist.intro=仅有一名敌人相邻时，提高闪避。
skills4.disarming_strike.intro=打击敌人并使其虚弱三回合。
skills4.find_the_gap.intro=连续命中时，从第三次近战攻击起，每次攻击都会无视目标的部分护甲。
skills4.aggression.intro=生命越低，近战伤害越高。
skills4.charge.intro=冲向最多四格外的敌人并打击它。路径必须畅通。
skills4.rampage.intro=攻击所有相邻敌人。
skills4.bloodlust.intro=击杀敌人后，近战攻击加速三回合。
skills4.war_cry.intro=使两格内可见的敌人虚弱。
skills4.rend.intro=冲锋和横扫会使幸存敌人流血。
skills4.relentless.intro=击杀敌人缩短冲锋和战吼的剩余冷却时间。
skills4.cornered.intro=被两名或更多敌人包围时，减轻受到的近战伤害。

skills4.spark.intro=向可见的敌人发射火花。
skills4.spirituality.intro=增加最大法力值。
