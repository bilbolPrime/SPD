daily.brief_0=Helpotrupoj de la Rata Reĝo proksimiĝas. Venku lin antaŭ ol ili atingos lian kortegon. Kaptita gardisto povas helpi vin batali, kaj la gardata magazeno enhavas provizaĵojn.
daily.brief_1=La ribelo kaŝas la fuĝon de Tengu. Venku ambaŭ fuĝestrojn por malfermi lian kaŝejon, poste venku Tengu antaŭ ol la tempo finiĝos. Liberigu kaptitojn por ke ili batalu kontraŭ la gardistoj, aŭ traserĉu la ŝlositan armilejon. La kaŝejo fermiĝos post via eniro.
daily.brief_2=Tri ministoj estas kaptitaj subtere, kaj la lasta lifto baldaŭ foriros. Malfermu iliajn ŝirmejojn, konduku ĉiujn tri vivantaj al la lifto, poste veturu eksteren. DM-300 vagas tra la tuneloj. Vi povas batali kontraŭ ĝi aŭ trovi alian vojon. Provizaĵoj kaj ŝlositaj mallongvojoj povas helpi vin savi ĉiujn.
daily.brief_3=Glaciungego, prujndorsa gnolo kaj prujnkorno vagas tra la kavernoj. Mortigu ĉiujn tri, poste atingu la foran elirejon antaŭ la ŝtormo. Vi elektas la ĉasordon. Estas provizaĵoj en flankaj pasejoj, sed serĉi ilin kostas tempon.
daily.brief_4=Tri ritejoj alvokas demonojn en la halojn. Atingu kaj sigelu ĉiun antaŭ ol la rito finiĝos. Ĉiu sigelo haltigas unu fonton de novaj malamikoj. Elektu vian vojon kaj serĉu en flankaj ĉambroj se vi bezonas provizaĵojn.
daily.brief_5=Defendu la antaŭpostenon ĝis venos helpo. La kapitano devas travivi kvin atakondojn. Viaj defendantoj tenos la centron dum vi batalas, serĉas provizaĵojn aŭ malfermas ĉelojn por ricevi helpon. Observu la alirvojojn: postaj ondoj povas veni de pluraj flankoj.
daily.brief_6=La reĝa trezorejo enhavas la oron de la urbo. Trovu la kapitanon, prenu lian ŝlosilon, malfermu la trezorejon kaj eskapu tra la fora pordego antaŭ ĝia fermo. Malfermi la trezorejon ekigos alarmon. Vi povas unue traserĉi magazenojn kaj malfermi mallongvojojn, aŭ riski pli rapidan rabon kun malpli da provizaĵoj.
daily.rules=Ĉiu dato havas propran heroon, ekipaĵon kaj karceron. Uzu viajn lertopoentojn antaŭ ol ekiri. Tempo estas mezurata per vicoj. Forlasi eventon finas la provon. Ĉiutagaj eventoj havas apartajn rezultojn kaj ne malŝlosas insignojn aŭ enciklopediajn enskribojn.
