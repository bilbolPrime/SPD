levels.rebornsiderooms.leave=Lascia stare
actors.mobs.npcs.echoreflection.name=il tuo riflesso
actors.mobs.npcs.echoreflection.desc=Una tua pallida copia attende immobile. Combatterà solo se la sfidi. Sconfiggerla concede un punto abilità. Uscire dalla stanza conclude il duello e ripristina la salute del riflesso.
actors.mobs.npcs.echoreflection.challenge=Sfidare il tuo riflesso? La vittoria concede un punto abilità. Puoi ritirarti, ma il riflesso si riprenderà se esci dalla stanza.
actors.mobs.npcs.echoreflection.accept=Sfida
actors.mobs.npcs.echoreflection.withdrawn=Il tuo riflesso torna immobile.
actors.mobs.npcs.echoreflection.victory=Il riflesso svanisce, lasciando una pergamena dell'abilità.
actors.mobs.npcs.barbecueking.name=re dei ratti
actors.mobs.npcs.barbecueking.desc=Anche un re deve mangiare. Ha trovato un angolo tranquillo dove arrostire la cena.
actors.mobs.npcs.barbecueking.greeting=Affari reali. Molto importanti. Molto gustosi.
actors.mobs.npcs.barbecueking.stolen=EHI! Quella era mia!
actors.mobs.npcs.barbecueking.after=Spero che ti vada di traverso.
actors.mobs.npcs.forgottenoffering.name=offerta dimenticata
actors.mobs.npcs.forgottenoffering.desc=Sotto il cristallo ci sono una razione di cibo e una pozione curativa. Scegline una; l'altra diventerà polvere.
actors.mobs.npcs.watchremains.name=guardia caduta
actors.mobs.npcs.watchremains.desc=Le ossa di una guardia giacciono accanto a un muro sfondato. Sotto l'elmo c'è un pezzo di carta.
actors.mobs.npcs.watchremains.note=Ho difeso la porta tutta la notte. Sono passati dal muro.
