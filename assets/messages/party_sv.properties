actors.skills.raiseskeletonskill.desc=Kallar fram ett skelett som slåss vid din sida.
network.partysession.background=Anslutningen till gruppen bröts när du lämnade spelet.
items.corpse.name=lik
items.corpse.desc=Ett färskt lik som kan användas till nekromanti.
items.armorkit.desc=Verktygen kan förvandla en rustning till en episk rustning. Den behåller sina egenskaper och får en förmåga för din klass. Inga hantverkskunskaper krävs.
items.bomb.desc=En liten svartkrutsbomb. Stubinen tänds när du kastar den.
items.quest.driedrose.desc=Rosen har varit torr länge, men har behållit alla kronblad.
items.quest.phantomfish.desc=Den lilla genomskinliga fisken syns knappt i luften. I vatten blir den nästan osynlig.
items.tomeofmastery.desc=Den tunna boken med slitet läderband verkar innehålla mycket kunskap. Läsningen tar en stund.
items.weightstone.desc=Med stenen kan du balansera ett närstridsvapen för högre hastighet eller träffsäkerhet.
items.wands.wandofamok.desc=Det lila ljuset gör målet ursinnigt, så att det angriper närliggande varelser utan åtskillnad.
items.wands.wandofavalanche.desc=Om urladdningen träffar en vägg eller ett annat fast hinder utlöser den ett stenras som skadar och bedövar varelser i området.
items.wands.wandofflock.desc=Frammanar en flock magiska får som tillfälligt blockerar vägen.
items.wands.wandofpoison.desc=Förgiftar målet och ger skada med jämna mellanrum. Uppgraderingar förlänger giftets verkan.
items.wands.wandofreach.desc=Hämtar föremål på avstånd och byter plats med fiender. Kraftvågen utlöser fällor, trampar ner gräs och öppnar eller stänger dörrar längs vägen.
items.wands.wandofslowness.desc=Halverar målets rörelse- och attackhastighet en stund.
items.wands.wandofteleportation.desc=Teleporterar en varelse till en slumpmässig plats på våningen.
items.weapon.melee.dualswords.desc=Två vassa klingor för hårdare slag.
items.weapon.missiles.cupidarrow.desc=En pil som sägs ha tillhört Amor. Välj ditt mål noga.
items.weapon.missiles.curaredart.desc=Pilarna gör liten skada, men kan förlama målet och lämna det försvarslöst.
items.weapon.missiles.incendiarydart.desc=Spetsen fastnar i målet medan blandningen på pilen fattar eld.
items.weapon.missiles.soulcrystal.desc=En kristall som kan fånga själar. Kasta den mot en svag eller försvagad fiende för att fånga dess ande.
items.weapon.missiles.tamahawk.desc=Kastyxan är inte särskilt tung, men kräver styrka för att användas väl.
network.partytext.weapon_fast=Det här vapnet är snabbt.
network.partytext.weapon_slow=Det här vapnet är långsamt.
network.partytext.weapon_accurate=Det här vapnet är träffsäkert.
network.partytext.weapon_inaccurate=Det här vapnet har låg träffsäkerhet.
network.partytext.weapon_fast_and_accurate=Det här vapnet är snabbt och träffsäkert.
network.partytext.weapon_fast_but_inaccurate=Det här vapnet är snabbt, men har låg träffsäkerhet.
network.partytext.weapon_slow_but_accurate=Det här vapnet är långsamt, men träffsäkert.
network.partytext.weapon_slow_and_inaccurate=Det här vapnet är långsamt och har låg träffsäkerhet.
network.partytext.necroblade_bolt=Från nivå 5 kan den fulladdade klingan använda _Mörk blixt_, som kan förstöra ett måls väsen och göra det till en tjänare.
network.partytext.necroblade_intro=Klingan är smidd med mörk magi. Den slukar sina offers själar och blir starkare.
network.partytext.necroblade_energy=Lagrade själar: _%s/100_
network.partytext.necroblade_damage=Själarna ger _0–%d extra skada_.
network.partytext.necroblade_hungry=Klingan kan förbruka en full laddning själar för att bli starkare.
network.partytext.necroblade_full=Klingan kan inte längre uppgradera sig genom att förbruka själar.
