custom.generated.entry_a_soothing_melody_will_put_all_creatures_in_your_b85e1025e0=Eine sanfte Melodie versetzt alle Kreaturen in Ihrem Sichtfeld in einen tiefen Schlaf und gibt Ihnen die Möglichkeit zu fliehen oder sie mit einem Überraschungsangriff zu überfallen.
custom.generated.entry_inspiring_words_that_boost_moral_and_remove_fati_114cb7f9b0=Inspirierende Worte, die die Moral stärken und Müdigkeit vertreiben!
custom.generated.entry_opens_a_magical_portal_that_takes_you_back_to_th_7ade511c99=Öffnet ein magisches Portal, das dich zurück zum Eingang dieser Dungeon-Ebene bringt.
custom.generated.entry_permanently_reveals_all_of_the_secrets_of_a_sing_37263236ea=Enthüllt dauerhaft alle Geheimnisse eines einzelnen Gegenstands.
custom.generated.entry_read_this_scroll_to_unleash_the_wrath_of_the_dun_db502abf39=Lies diese Schriftrolle, um den Zorn der Dungeon-Geister zu entfesseln und alles auf der aktuellen Ebene zu vernichten. Nun ja, fast alles. Einige der mächtigeren Kreaturen könnten verschont bleiben.
custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=Der Zauberspruch auf dieser Schriftrolle erzeugt illusionäre Zwillinge des Lesers, die seine Feinde verfolgen werden.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Der Zauberspruch auf dieser Schriftrolle entfernt augenblicklich alle bösen Verzauberungen von der Waffe, der Rüstung, den Ringen und den mitgeführten Gegenständen des Lesers, die den Träger daran hindern könnten, sie abzulegen.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Die in diesem Pergament gebundene rohe magische Kraft wird, wenn sie freigesetzt wird, alle Zauberstäbe des Lesers wieder vollständig aufladen.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Die Schriftrolle birgt das Geheimnis eines verbotenen Rituals. Im Austausch für das Wohlbefinden des Lesers fügt die Schriftrolle allen in der Nähe Schaden zu und heilt ihn vollständig.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Die Schriftrolle wirkt kälter als ihre Umgebung. Als wäre sie ein Portal zu einer kälteren Dimension.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Der Zauber auf diesem Pergament versetzt den Leser augenblicklich an einen zufälligen Ort im Verlies. Er kann genutzt werden, um einer gefährlichen Situation zu entkommen, doch der unglückliche Leser könnte sich dadurch in einer noch gefährlicheren Lage wiederfinden.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Diese Schriftrolle enthält zerstörerische Energie, die psionisch kanalisiert werden kann, um allen Kreaturen im Sichtfeld massiven Schaden zuzufügen. Ein begleitender Lichtblitz blendet vorübergehend alle im Wirkungsbereich, einschließlich des Lesers der Schriftrolle.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Diese Schriftrolle kann eine Waffe oder Rüstung mit einer zufälligen Verzauberung versehen und ihr so eine besondere Kraft verleihen.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Diese Schriftrolle wertet einen einzelnen Gegenstand auf und verbessert seine Qualität. Ein Zauberstab wird stärker und hat mehr Ladungen; eine Waffe verursacht mehr Schaden oder trifft ihr Ziel häufiger; eine Rüstung wehrt mehr Schläge ab; die Wirkung eines Rings auf seinen Träger verstärkt sich. Waffen und Rüstungen benötigen außerdem weniger Kraftaufwand, und etwaige Flüche auf dem Gegenstand werden aufgehoben.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Wenn diese Schriftrolle laut vorgelesen wird, ertönt ein ohrenbetäubendes Gebrüll, das alle Monster erweckt und sie auf den Standort des Vorlesers aufmerksam macht.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Wenn du diese inspirierenden Worte liest, wirst du bereit für den Kampf sein.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=Wenn du diese weisen Worte liest, wirst du deine Fähigkeiten verbessern.

