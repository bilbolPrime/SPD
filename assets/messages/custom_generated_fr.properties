custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Le parchemin semble plus froid que l'environnement. Comme un portail vers une dimension plus froide.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Le sortilège inscrit sur ce parchemin transporte instantanément le lecteur à un endroit aléatoire du donjon. Il peut servir à échapper à une situation périlleuse, mais le lecteur malchanceux risque de se retrouver dans un lieu encore plus dangereux.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Ce parchemin renferme une énergie destructrice, canalisable par la pensée pour infliger des dégâts considérables à toutes les créatures dans son champ de vision. Un éclair de lumière aveuglera temporairement tous ceux qui se trouvent dans la zone d'effet, y compris le lecteur du parchemin.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Ce parchemin permet d'imprégner une arme ou une armure d'un enchantement aléatoire, lui conférant un pouvoir spécial.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Ce parchemin améliorera un objet, augmentant ainsi sa qualité. Une baguette magique gagnera en puissance et en nombre de charges ; une arme infligera plus de dégâts ou atteindra sa cible plus fréquemment ; une armure déviera davantage de coups ; l’effet d’une bague sur son porteur s’intensifiera. Les armes et armures nécessiteront également moins d’effort pour être utilisées, et toute malédiction les affectant sera levée.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Lu à haute voix, ce parchemin libérera un rugissement menaçant qui réveillera tous les monstres et les alertera de la présence du lecteur.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=À la lecture, les paroles d'inspiration vous prépareront au combat.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=La lecture des paroles de sagesse permettra d'accroître vos compétences.

