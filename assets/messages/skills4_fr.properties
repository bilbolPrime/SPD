skills4.subclass.gladiator=Les coups de mêlée réussis créent un combo, ajoutant des dégâts aux coups ultérieurs.\n\n_+3 de précision en mêlée_\n_Attaques de mêlée 10 % plus rapides_
skills4.subclass.berserker=Sous 40% de vie, la fureur augmente les dégâts de 50%.\n\n_10% de dégâts de mêlée en plus_\n_10% de dégâts subis en moins_
skills4.subclass.battlemage=Les coups de baguette au corps à corps rendent une charge et ajoutent le nombre de charges aux dégâts.\n\n_Étincelle a 50% de chances d'aveugler la cible pendant 3 tours._
skills4.subclass.warlock=Tuer un ennemi rend de la vie et apaise la faim.\n\n_Étincelle inflige 5 dégâts de plus._\n_Une créature invoquée supplémentaire._
skills4.subclass.freerunner=Sans équipement trop lourd et sans souffrir de famine, vous vous déplacez 60% plus vite. Votre esquive double pendant le déplacement.
skills4.subclass.assassin=Les attaques surprises infligent des dégâts supplémentaires.\n\n_+1 furtivité_
skills4.subclass.warden=Piétiner les herbes hautes confère Peau d'écorce. Les plantes peuvent donner des graines et de la rosée supplémentaires.
skills4.subclass.sniper=Les attaques à distance ignorent l'armure et marquent la cible pour accélérer l'attaque suivante.\n\n_20% de dégâts à distance en plus_
skills4.subclass.spirit_binder=Les coups de baguette en mêlée restaurent une charge et ajoutent les charges actuelles de la baguette aux dégâts.\n\n_Les squelettes ressuscités durent deux fois plus longtemps._
skills4.subclass.lich=Tuer un ennemi rend de la vie et apaise la faim.\n\n_Les squelettes et archers squelettes ressuscités ont 25% de vie en plus et infligent 25% de dégâts en plus._\n_Une créature invoquée supplémentaire._
