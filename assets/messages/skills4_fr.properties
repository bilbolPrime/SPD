skills4.smash.intro=Frappe un ennemi adjacent avec force brute.
skills4.endurance.intro=Augmente votre santé maximale.
skills4.firm_hand.intro=Améliore votre précision en combat au corps à corps.
skills4.regeneration.intro=Régénère des points de vie supplémentaires au fil du temps. Ne fonctionne pas en cas de famine.
skills4.toughness.intro=Réduit les dégâts reçus, sauf la famine.
skills4.knockback.intro=Frappe un ennemi et le repousse d'une case. Les boss ne peuvent pas être repoussés.
skills4.second_wind.intro=Restaure immédiatement un peu de santé.
skills4.sure_footing.intro=Réduit la durée de l'enracinement et de l'estropiement.
skills4.mastery.intro=Permet de manier des armes de mêlée plus lourdes et d'attaquer plus vite.
skills4.parry.intro=Réduit le prochain coup de mêlée que vous subirez. La garde dure jusqu'à quatre tours.
skills4.smite.intro=Délivre un coup violent qui ignore la moitié de l'armure de la cible. Prend deux tours.
skills4.riposte.intro=Renforce votre prochain coup de mêlée après le blocage. Dure quatre tours.
skills4.footwork.intro=Vous donne plus de temps entre les coups de mêlée pour maintenir un combo.
skills4.duelist.intro=Augmente l'esquive quand un seul ennemi se trouve à côté de vous.
skills4.disarming_strike.intro=Frappe un ennemi et l'affaiblit pendant trois tours.
skills4.find_the_gap.intro=Votre troisième coup en mêlée consécutif et les suivants ignorent une partie de l'armure de la cible.
skills4.aggression.intro=Vos dégâts en mêlée augmentent à mesure que vous perdez de la santé.
skills4.charge.intro=Fonce sur un ennemi situé à quatre cases ou moins et le frappe. Le chemin doit être dégagé.
skills4.rampage.intro=Frappe tous les ennemis adjacents.
skills4.bloodlust.intro=Tuer un ennemi accélère vos attaques au corps à corps pendant trois tours.
skills4.war_cry.intro=Affaiblit les ennemis visibles dans un rayon de deux cases.
skills4.rend.intro=Charge et Saccage font saigner les ennemis qui survivent.
skills4.relentless.intro=Tuer un ennemi réduit le temps de recharge restant de Charge et de Cri de guerre.
skills4.cornered.intro=Réduit les dégâts de mêlée subis lorsque deux ennemis ou plus vous entourent.

skills4.spark.intro=Tire une étincelle sur un ennemi visible.
skills4.spirituality.intro=Augmente votre mana maximum.
skills4.sorcerer.intro=Vos baguettes infligent plus de dégâts.
skills4.summon_rat.intro=Invoque un rat qui combat à vos côtés.
skills4.meditation.intro=Régénère du mana supplémentaire au fil du temps.
skills4.spirit_armor.intro=Absorbe les dégâts à raison d'un mana par point absorbé.
skills4.wizard.intro=Vos baguettes se rechargent plus rapidement.
skills4.channeling.intro=Réduit les temps de recharge des compétences actives, à un minimum d'un tour.
skills4.charged_staff.intro=Les coups de baguette au corps à corps récupèrent du mana.
skills4.arcane_ward.intro=Réduit le prochain coup de mêlée que vous subirez. La protection dure jusqu'à quatre tours.
skills4.arcane_strike.intro=Délivre un coup magique qui ignore la moitié de l'armure de la cible.
skills4.conductive.intro=Les charges de votre baguette renforcent ses coups au corps à corps. Chaque coup qui touche dépense une charge au lieu de recharger la baguette.
skills4.discharge.intro=Endommage tous les ennemis adjacents avec une explosion de magie.
skills4.spellweave.intro=Augmente les dégâts de la baguette pendant trois tours après avoir réussi un coup au corps à corps.
skills4.drain_life.intro=Endommage un ennemi et vous soigne pour la moitié de la santé qu'il perd.
skills4.rabid_minions.intro=Vos créatures invoquées infligent plus de dégâts.
skills4.summon_skeleton.intro=Invoque un squelette qui combat à vos côtés.
skills4.soul_hunger.intro=Restaure le mana lorsque vous tuez un ennemi.
skills4.enrage.intro=Tant que cette compétence est active, vos invocations infligent et subissent davantage de dégâts.
skills4.slow.intro=Ralentit les déplacements et les attaques d'un ennemi.
skills4.summoner.intro=Vous pouvez conserver une créature invoquée supplémentaire.
skills4.dark_pact.intro=Sacrifie cinq points de vie pour restaurer du mana. Nécessite au moins six points de vie.

skills4.double_strike.intro=Frappe deux fois de suite.
skills4.stealth.intro=Vous rend plus difficile à remarquer pour les ennemis.
skills4.evasion.intro=Améliore vos chances d'esquiver les attaques.
skills4.smoke_bomb.intro=Vous fait disparaître dans un nuage de fumée. Attaquer met fin à l'effet.
skills4.bandit.intro=Chaque tas d'or ramassé rapporte davantage.
skills4.venom.intro=Tant que cette compétence est active, vos coups au corps à corps peuvent empoisonner leur cible.
skills4.locksmith.intro=Vous avez une chance de désamorcer un piège lorsque vous marchez dessus.
skills4.light_step.intro=Réduit la durée de l'enracinement et de l'estropiement.
skills4.dash.intro=Déplace jusqu'à deux cases le long d'un chemin dégagé.
skills4.haste.intro=Augmente votre vitesse de déplacement pendant cinq tours.
skills4.shadow_clone.intro=Créez un clone fort ou trois clones plus faibles pour combattre pour vous.
skills4.escape.intro=Dissipe l'enracinement et l'estropiement, puis augmente l'esquive pendant quatre tours.
skills4.trailblazer.intro=Augmente votre vitesse de déplacement.
skills4.skirmish.intro=Se déplacer renforce votre prochain coup de mêlée.
skills4.keep_distance.intro=Augmente l'esquive contre les ennemis situés à plus d'une case.
skills4.ambush.intro=Augmente les dégâts de mêlée en étant invisible.
skills4.scorpion.intro=Votre venin inflige plus de dégâts.
skills4.silent_death.intro=Les attaques au corps à corps peuvent tuer instantanément un ennemi endormi. Les boss sont immunisés.
skills4.expose.intro=Vos coups au corps à corps ignorent une partie de l'armure.
skills4.execution.intro=Augmente les dégâts contre les ennemis ayant moins d'un quart de leur santé.
skills4.deadly_throw.intro=Augmente les dégâts des armes à distance.

skills4.accuracy.intro=Vos attaques à distance sont plus précises.
skills4.awareness.intro=Vous avez une chance d’esquiver une attaque à distance entrante.
skills4.double_shot.intro=Suivez votre flèche d'un deuxième tir. Utilise deux flèches ordinaires.
skills4.hunting.intro=Trouve de la viande crue au fur et à mesure de votre exploration.
skills4.fletching.intro=Crée des flèches ordinaires pendant que vous explorez.
skills4.ko_arrow.intro=Votre prochaine flèche ralentit sa cible et peut l'endormir.
skills4.woodcraft.intro=Vous rend plus difficile à remarquer pour les ennemis.
skills4.quickdraw.intro=Accélère vos attaques à distance.
skills4.barkskin.intro=Augmente votre armure.
skills4.nature_mend.intro=Restaure immédiatement un peu de santé.
skills4.entangle.intro=Immobilise un ennemi visible sur place.
skills4.herbalist.intro=Réduit les dégâts du poison.
skills4.dew_keeper.intro=Augmente les soins reçus par la rosée.
skills4.knee_shot.intro=Vos flèches peuvent estropier leur cible.
skills4.thicket.intro=Réduit le prochain coup de mêlée que vous subirez. La garde dure jusqu'à quatre tours.
skills4.aimed_shot.intro=Augmente les dégâts de votre prochaine flèche qui touche sa cible.
skills4.long_sight.intro=Augmente les dégâts à distance contre les ennemis situés à au moins quatre cases.
skills4.piercing_shot.intro=Votre prochaine flèche ignore une partie de l'armure de la cible.
skills4.iron_tip.intro=Les pointes en fer permettent aux flèches de traverser les ennemis et de frapper ceux qui se trouvent derrière elles. Les murs et les alliés arrêtent la flèche.
skills4.mark_prey.intro=Marque un ennemi pendant six tours, augmentant ainsi vos dégâts contre lui.
skills4.bombvoyage.intro=Transformez une flèche en bombe. L'explosion peut également vous blesser, vous et vos alliés.
skills4.follow_through.intro=Tuer un ennemi renforce votre prochaine attaque à distance pendant quatre tours.

skills4.curse.intro=Affaiblit les attaques d'un ennemi pendant dix tours.
skills4.necro_spirit.intro=Augmente votre mana maximum.
skills4.raise_skeleton.intro=Relève un squelette à partir d'un cadavre au sol.
skills4.summon_ghost.intro=Invoque un fantôme qui combat à vos côtés.
skills4.soul_bind.intro=Augmente les dégâts de vos invocations.
skills4.necro_meditation.intro=Régénère du mana supplémentaire au fil du temps.
skills4.necro_drain_life.intro=Draine la santé d'un ennemi et récupère la moitié des dégâts infligés.
skills4.master_of_death.intro=Vous ramène à la vie avec toute votre santé et votre mana. Ce pouvoir doit se recharger avant de pouvoir vous sauver à nouveau.
skills4.spirit_army.intro=Permet de maintenir une invocation supplémentaire.
skills4.mend_bones.intro=Soigne vos créatures invoquées visibles.
skills4.guardian_bond.intro=Réduit les dégâts subis par vos créatures invoquées.
skills4.corpse_explosion.intro=Fait exploser un cadavre. L'explosion frappe tous ceux qui l'entourent, y compris vous et vos alliés.
skills4.raise_skeleton_archer.intro=Relève un archer squelette à partir d'un cadavre au sol.
skills4.last_rites.intro=Donne à chaque invocation une chance de survivre à un coup fatal avec un quart de sa santé.
skills4.soul_shelter.intro=Réduit le prochain coup de mêlée que vous subirez. La protection dure jusqu'à quatre tours.
skills4.cold_touch.intro=Frappe un ennemi et le ralentit pendant trois tours.
skills4.necro_slow.intro=Ralentit les déplacements et les attaques d'un ennemi.
skills4.bone_spear.intro=Lance un trait de magie funèbre sur un ennemi.
skills4.death_fed.intro=Restaure le mana lorsque vous tuez un ennemi.
skills4.cruel_study.intro=Augmente les dégâts infligés par les baguettes.
skills4.withering_wave.intro=Endommage les ennemis adjacents avec du froid et les ralentit pendant trois tours.

skills4.steady_aim.intro=Votre tir est plus précis.
skills4.packrat.intro=Emportez plus de munitions dans votre arme.
skills4.fast_reload.intro=Accélère le rechargement des armes à feu.
skills4.quick_draw.intro=Tirez plus rapidement avec votre arme.
skills4.veteran_company.intro=Les mercenaires engagés sous vos ordres infligent davantage de dégâts.
skills4.field_medicine.intro=Restaure immédiatement un peu de santé.
skills4.powder.intro=Augmente les dégâts des armes à feu.
skills4.steady_nerves.intro=Réduit la durée de l'enracinement et de l'estropiement.
skills4.volley.intro=Tire un coup plus puissant.
skills4.rally.intro=Vous soigne, vous et vos alliés, dans un rayon de deux cases.
skills4.guard_order.intro=Les mercenaires engagés sous votre commandement subissent moins de dégâts.
skills4.suppress.intro=Votre prochain coup d'arme à feu affaiblit sa cible.
skills4.counter_fire.intro=Subir des dégâts en mêlée renforce votre prochain coup d'arme à feu pendant quatre tours.
skills4.i_am_the_law.intro=Augmente votre santé maximale et actuelle pendant vingt tours.
skills4.headshot.intro=Votre prochain coup de feu inflige plus de dégâts et gagne en précision.
skills4.intimidate.intro=Effraye un ennemi visible. Les boss sont immunisés.
skills4.wanted.intro=Gagnez de l'or pour chaque ennemi hostile que vous tuez.
skills4.no_witnesses.intro=Votre prochain coup de feu inflige plus de dégâts et fait fuir les ennemis survivants.
skills4.armor_piercer.intro=Vos attaques à distance ignorent une partie de l'armure.
skills4.execute.intro=Les coups de feu achèvent les ennemis grièvement blessés. Les boss sont immunisés.
skills4.final_notice.intro=Votre prochain tir qui touche ignore davantage d'armure.

