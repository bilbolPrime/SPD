items.scrolls.scrolloffrostlevel.name=Zwój szronu
items.scrolls.scrolloffrostlevel.desc=Z tego pergaminu przenika chłód.\n\nMożesz też podrzeć zwój w dowolnym miejscu, aby zamrozić wszystkich wrogów na piętrze do chwili otrzymania obrażeń. Nie działa na bossów ani istoty odporne na zamrożenie. Nie zadaje obrażeń.
items.scrolls.scrolloffrostlevel.ac_tear=Podrzyj
items.scrolls.scrolloffrostlevel.tear_confirm=Podarcie tego zwoju uwolni jego magię i zamrozi wszystkich wrogów na piętrze do chwili otrzymania obrażeń. Nie działa na bossów ani istoty odporne na zamrożenie. Nie zadaje obrażeń.\n\nPodrzeć zwój?
items.scrolls.scrolloffrostlevel.wrong_place=Zwój tutaj nie działa.
items.scrolls.scrolloffrostlevel.spent=Przejście zostało już otwarte. Zwój milczy.
items.keys.key.ice_depth=Ten klucz należy do piętra %d Lodowych Jaskiń.
scenes.interlevelscene$mode.frost=Wejście do Lodowych Jaskiń...
levels.icecaveslevel.water_name=Lodowata woda
levels.icecaveslevel.water_desc=Cienka skorupa lodu pęka pod stopami.
levels.icecaveslevel.wall_desc=Ślady kilofów znikają pod grubymi żyłami lodu. Górnicy opuścili te wyrobiska, gdy chłód przeniknął skałę.
levels.cavesbosslevel.collapsed_name=Zawalona jaskinia
levels.cavesbosslevel.collapsed_desc=Zawalona jaskinia. Przez rumowisko nie da się przejść.
actors.buffs.frostbite.name=Odmrożenie
actors.buffs.frostbite.desc=Chłód spowalnia twój ruch o 20%.
actors.mobs.rimebat.name=Szronowy nietoperz
actors.mobs.rimebat.desc=Te blade nietoperze gnieżdżą się pod lodem. Ich zimne ugryzienie na krótko spowalnia ruch, dając im czas na kolejny nalot.\n\nOdporny na zamrożenie i magię lodu.
actors.mobs.iceclaw.name=Lodowy pazur
actors.mobs.iceclaw.desc=Padlinożerca o skorupie z twardego lodu. Przed walką na krótko wzmacnia pancerz. Ogień topi tę dodatkową ochronę.\n\nOdporny na zamrożenie i magię lodu.
actors.mobs.frostback.name=Gnoll szronogrzbiety
actors.mobs.frostback.desc=Ten gnoll przetrwał chłód, grabiąc nieostrożnych wędrowców. Gdy podnosi broń, odsuń się: ciężki cios spadnie tam, gdzie wcześniej stałeś.\n\nOdporny na zamrożenie i magię lodu.
actors.mobs.shardling.name=Odłamkowiec
actors.mobs.shardling.desc=Niespokojne skupisko lodowych kryształów. Celuje, a potem wystrzeliwuje odłamki w linii prostej. Ściany zatrzymują salwę.\n\nOdporny na zamrożenie i magię lodu.
actors.mobs.hollowminer.name=Pusty górnik
actors.mobs.hollowminer.desc=Ten górnik nigdy nie uciekł z zamarzniętych wyrobisk. Jego latarnia wciąż płonie, choć właściciel dawno umarł. Jeśli zdoła ją podnieść, wezwie pobliskie stworzenia do walki. Trafienie przerywa sygnał.\n\nOdporny na zamrożenie i magię lodu.
actors.mobs.rimehorn.name=Szronoróg
actors.mobs.rimehorn.desc=Ciężka bestia z futrem pokrytym szronem. Grzebie w ziemi, zanim zaszarżuje w linii prostej. Zejdź jej z drogi, gdy się przygotowuje.\n\nOdporny na zamrożenie i magię lodu.
actors.mobs.oldrime.name=Stary Szron
actors.mobs.oldrime.desc=Górnicy znaleźli Starego Szrona pod górą, pogrzebanego w lodzie starszym od ich tuneli. Obudziły go kilofy. Teraz strzeże zamarzniętych wyrobisk i przejścia za nimi. Gdy słabnie, jego pancerz odpada, uwalniając kończyny. Uważaj na ciężkie zamachy, lód przebijający podłogę i mroźny oddech.\n\nOdporny na zamrożenie i magię lodu.
actors.mobs.oldrime.warning=Stary Szron bierze zamach!
windows.wndjournal.ice_depth=Lód %d
levels.icebosslevel.exit_name=Przejście w jaskini
levels.icebosslevel.exit_desc=Wąskie przejście prowadzi w głąb góry.
levels.icebosslevel.blocked_name=Zamarznięte przejście
levels.icebosslevel.blocked_desc=Lodowa ściana blokuje przejście za Starym Szronem.
items.weapon.ice.wrong_hero=Ta broń nie jest dla ciebie.
items.weapon.ice.already_enchanted=Ta broń jest już zaklęta.
items.weapon.ice.glaciercleaver.name=Lodowcowy tasak
items.weapon.ice.glaciercleaver.desc=Szerokie ostrze wykute z lodu Starego Szrona. Trafienie pokrywa cel szronem na cztery tury. Kolejny cios Lodowcowym tasakiem rozbija go, zadając %d dodatkowych obrażeń. Tylko Wojownik może nim władać.
actors.buffs.frostcoating.name=Pokryty szronem
actors.buffs.frostcoating.desc=Cienka warstwa szronu pokrywa to stworzenie. Cios Lodowcowego tasaka ją rozbije.
items.weapon.ice.hoarfroststaff.name=Kostur szadzi
items.weapon.ice.hoarfroststaff.desc=Między zębami kostura zbiera się chłód. Jego pociski zadają %d-%d obrażeń przed premiami umiejętności i spowalniają ruch oraz ataki na dwie tury. Początkowo mieści trzy ładunki i odnawia je jak różdżka. Tylko Mag może nim władać.
items.weapon.ice.rimepick.name=Szronowy kilof
items.weapon.ice.rimepick.desc=Ten wąski lodowy kilof trafia w szczeliny pancerza. Pomija jedną czwartą pancerza celu, a jeśli cel jest zaskoczony — połowę. Tylko Łotrzyk może nim władać.
items.weapon.ice.frostbow.name=Mroźny łuk
items.weapon.ice.frostbow.desc=Strzały z tego łuku przy trafieniu rozpadają się na ostry lód. Zadają celowi o %d%% więcej obrażeń, a sąsiednim wrogom jedną czwartą obrażeń tego trafienia. Odłamki nie zamrażają ofiar. Tylko Łowczyni może nim władać.
items.weapon.ice.gravefrostscythe.name=Kosa grobowego szronu
items.weapon.ice.gravefrostscythe.desc=Szron pokrywa rękojeść kosy oplecioną kośćmi. Gdy jest wyposażona, twoje przywołane szkielety i duchy zadają %d dodatkowych obrażeń od zimna na trafienie. Tylko Nekromanta może nią władać.
items.weapon.ice.frostbiterifle.name=Karabin odmrożenia
items.weapon.ice.frostbiterifle.desc=Komora karabinu jest wyłożona lodem, który nigdy nie topnieje. Każdy celny strzał wywołuje odmrożenie na dwie tury, spowalniając ruch o 20%. Kolejne trafienia odnawiają efekt. Tylko Najemnik może nim władać.
library.ice_weapon_drop=Dla każdego bohatera wypada jedna broń dopasowana do jego klasy.

actors.mobs.npcs.prospector.name=Uwięziony poszukiwacz
actors.mobs.npcs.prospector.desc=Poszukiwacz w połatanym płaszczu schronił się przy schodach. Jego lampa ledwo się pali.
actors.mobs.npcs.prospector.torches=Moja lampa długo już nie pociągnie. Uciekając, zostawiłem skrzynię z zapasami na tym piętrze. Przyniesiesz mi z niej _trzy pochodnie_?
actors.mobs.npcs.prospector.iceclaws=Lodowe pazury wygnały mnie ze sztolni. Zabij _trzy lodowe pazury na tym piętrze_, żebym mógł wrócić do pracy.
actors.mobs.npcs.prospector.accept=Pomogę ci.
actors.mobs.npcs.prospector.later=Nie teraz.
actors.mobs.npcs.prospector.need_torches=Potrzebuję _trzech pochodni_. Skrzynia wciąż jest gdzieś na tym piętrze.
actors.mobs.npcs.prospector.claws_left=Pozostałe lodowe pazury: _%d_.
actors.mobs.npcs.prospector.reward=Dobra robota. Co wybierasz?
actors.mobs.npcs.prospector.rations=Dwie racje żywnościowe
actors.mobs.npcs.prospector.thanks=Jeden kłopot z głowy. Dziękuję.
library.quest.prospector_torches.name=Gasnąca lampa
library.quest.prospector_torches.desc=Przynieś uwięzionemu poszukiwaczowi trzy pochodnie. Skrzynia na jego piętrze zawiera ich dość.
library.quest.prospector_iceclaws.name=Pazury w sztolni
library.quest.prospector_iceclaws.desc=Zabij trzy lodowe pazury na piętrze poszukiwacza i wróć do niego.
library.quest.prospector.reward=Wybierz zwój ulepszenia albo dwie racje żywnościowe.
items.scrolls.scrolloffrostlevel.read_confirm=Podczas czytania czujesz, że zaraz się teleportujesz.
