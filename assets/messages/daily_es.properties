daily.brief_0=Los refuerzos del Rey Rata están en camino. Derrótalo antes de que lleguen a su corte. Un guardián cautivo puede ayudarte, y el almacén vigilado contiene provisiones.
daily.brief_1=El motín encubre la huida de Tengu. Derrota a los dos capitanes para abrir su guarida y vence a Tengu antes de que se agote el tiempo. Libera presos para que luchen contra los guardias o busca provisiones en la armería cerrada. La guarida se sellará cuando entres.
daily.brief_2=Tres mineros están atrapados y el último ascensor está a punto de partir. Abre sus refugios, llévalos a todos de vuelta con vida y sal con ellos. DM-300 recorre los túneles; puedes combatirlo o rodearlo. Busca provisiones y atajos cerrados.
daily.brief_3=Una Garra de hielo, un Gnoll lomoescarcha y un Cuerno de escarcha recorren las cuevas. Caza a los tres y llega a la salida antes de la tormenta. Tú eliges el orden. Hay provisiones en los pasadizos laterales, pero buscarlas lleva tiempo.
daily.brief_4=Tres altares están invocando demonios. Séllalos antes de que termine el ritual. Cada altar sellado corta una fuente de refuerzos. Elige tu ruta y busca provisiones en las cámaras laterales si las necesitas.
daily.brief_5=Defiende el puesto hasta que llegue ayuda. El capitán debe sobrevivir a cinco oleadas. Tus defensores guardan el centro mientras combates, buscas provisiones o abres celdas para conseguir aliados. Las últimas oleadas pueden atacar desde varios lados.
daily.brief_6=El oro de la ciudad está en el tesoro del rey. Consigue la llave del capitán, entra en la cámara y huye por la puerta del otro extremo antes de que cierre. Abrir el tesoro activa la alarma. Prepara atajos y reúne provisiones, o intenta un robo más rápido.
daily.rules=Cada fecha tiene su propio héroe, equipo y mazmorra. Gasta tus puntos de habilidad antes de salir. El tiempo se mide en turnos. Salir del evento termina el intento. Los resultados son independientes y no se desbloquean insignias ni entradas del Saber.
