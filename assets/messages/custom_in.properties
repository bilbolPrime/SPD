levels.sign.burn=Saat Anda mencoba membaca papan tanda itu, papan tersebut tiba-tiba dilalap api kehijauan.
levels.sign.tip_01=Jangan terlalu percaya diri dengan kekuatanmu, gunakan senjata dan baju zirah yang mampu kamu tangani.
levels.sign.tip_05=Waspadalah terhadap Goo!
levels.sign.tip_06=Pixel-Mart - semua yang Anda butuhkan untuk petualangan yang sukses!
levels.sign.tip_07=Identifikasi ramuan dan gulungan Anda sesegera mungkin. Jangan menundanya hingga saat Anda benar-benar membutuhkannya.
levels.sign.tip_08=Rasa lapar tidak sakit, tetapi kelaparan itu sakit.
levels.sign.tip_10=Jangan biarkan Tengu keluar!
levels.sign.tip_11=Pixel-Mart. Belanjakan uang. Hidup lebih lama.
levels.sign.tip_12=Saat diserang oleh beberapa monster sekaligus, cobalah untuk berlindung di balik pintu.
levels.sign.tip_14=Tidak ada gunanya memiliki lebih dari satu Ankh pada saat yang bersamaan, karena Anda akan kehilangan semuanya saat bangkit dari kematian.
levels.sign.tip_15=BAHAYA! Mesin berat dapat menyebabkan cedera, kehilangan anggota tubuh, atau kematian!
levels.sign.tip_16=Pixel-Mart. Kehidupan yang lebih aman di dalam penjara bawah tanah.
levels.sign.tip_17=Saat Anda meningkatkan senjata yang telah diimbuhi sihir, ada kemungkinan sihir tersebut hancur.
levels.sign.tip_18=Senjata dan baju besi lebih cepat rusak daripada tongkat sihir dan cincin, tetapi ada lebih banyak cara untuk memperbaikinya.
levels.sign.tip_19=Satu-satunya cara untuk mendapatkan Scroll of Wipe Out adalah dengan menerimanya sebagai hadiah dari roh-roh penjara bawah tanah.
levels.sign.tip_20=Tidak diperbolehkan membawa senjata di hadapan Yang Mulia Raja!
