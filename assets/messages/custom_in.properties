items.bags.keyring.info=Ini adalah gantungan kunci tembaga, yang memungkinkan Anda menyimpan semua kunci Anda secara terpisah dari barang-barang Anda yang lain.
custom.difficulty.easy=Mudah
custom.difficulty.easy.desc=- Mulai dengan 2 ransum tambahan.\n- Mulai dengan 2 ramuan penyembuhan.\n- Mulai dengan 200 Emas.\n- Mulai dengan 2 kristal jiwa.\n- Bonus untuk menemukan pintu dan jebakan tersembunyi.\n- Monster lemah, memberikan kerusakan 25% lebih sedikit, menerima kerusakan 10% lebih banyak, dan memiliki HP 15% lebih sedikit.\n- Tingkat kemunculan Champion diatur menjadi 10%.\n- Tingkat jatuhnya Champion diatur menjadi 30%.
custom.difficulty.hard=Keras
custom.difficulty.hard.desc=- Ramuan penyembuhan memulihkan 75% HP maksimal.\n- Monster menjadi kuat, memberikan 10% kerusakan ekstra, menerima 10% lebih sedikit kerusakan, dan memiliki 20% lebih banyak HP.\n- Tingkat kemunculan Champion diatur menjadi 30%.\n- Tingkat jatuhnya Champion diatur menjadi 50%.
custom.difficulty.hell.desc=- Ramuan penyembuhan memulihkan 50% HP maksimal.\n- Monster menjadi abadi, memberikan 35% lebih banyak kerusakan, menerima 30% lebih sedikit kerusakan, dan memiliki 45% lebih banyak HP.\n- Tingkat kemunculan Champion ditetapkan menjadi 50%.\n- Hero memulai dengan 4 HP maksimal lebih sedikit.\n- Hero mendapatkan 1 HP maksimal lebih sedikit saat naik level.\n- Tingkat jatuhnya Champion ditetapkan menjadi 70%.
custom.difficulty.just_kill_me=Bunuh saja aku
custom.difficulty.just_kill_me.desc=- Dimulai dengan dua ramuan pengalaman.\n- Ramuan penyembuhan memulihkan 10% HP maksimal.\n- Monster adalah Dewa, memberikan 60% lebih banyak kerusakan, menerima 40% lebih sedikit kerusakan, dan memiliki 75% lebih banyak HP.\n- Tingkat kemunculan Champion diatur ke 100%.\n- Hero memulai dengan 8 HP maksimal lebih sedikit.\n- Hero mendapatkan 3 HP maksimal lebih sedikit saat naik level.\n- Tingkat jatuhnya Champion diatur ke 100%.
custom.difficulty.nightmare.desc=- Ramuan penyembuhan memulihkan 25% HP maksimal.\n- Monster menjadi seperti dewa, memberikan 45% lebih banyak kerusakan, menerima 30% lebih sedikit kerusakan, dan memiliki 60% lebih banyak HP.\n- Tingkat kemunculan Champion ditetapkan menjadi 70%.\n- Hero memulai dengan 8 HP maksimal lebih sedikit.\n- Hero mendapatkan 3 HP maksimal lebih sedikit saat naik level.\n- Tingkat jatuhnya Champion ditetapkan menjadi 90%.
custom.difficulty.normal.desc=- Monster standar.\n- Tingkat kemunculan Champion diatur ke 20%.\n- Tingkat jatuhnya Champion diatur ke 40%.
custom.difficulty.super_easy=Sangat Mudah
custom.difficulty.super_easy.desc=- Mulai dengan 5 ransum tambahan.\n- Mulai dengan 5 ramuan penyembuhan.\n- Mulai dengan 500 Emas.\n- Mulai dengan 3 kristal jiwa.\n- Monster-monsternya menyedihkan, memberikan kerusakan 50% lebih sedikit, menerima kerusakan 50% lebih banyak, dan memiliki HP 50% lebih sedikit.\n- Tingkat kemunculan Champion diatur menjadi 10%.\n- Tingkat jatuhnya Champion diatur menjadi 10%.
levels.sign.dead_end=Apa yang kamu lakukan di sini?!
levels.sign.tip_02=Tidak semua pintu di ruang bawah tanah terlihat pada pandangan pertama. Jika Anda kesulitan, carilah pintu tersembunyi.
levels.sign.tip_03=Ingat, meningkatkan kekuatan bukanlah satu-satunya cara untuk mendapatkan peralatan yang lebih baik. Anda juga bisa menggunakan cara lain, yaitu menurunkan persyaratan kekuatan dengan menggunakan Gulungan Peningkatan.
levels.sign.tip_04=Anda dapat membelanjakan emas Anda di toko-toko yang terletak di tingkat yang lebih dalam di dalam penjara bawah tanah. Toko pertama berada di tingkat ke-6.
levels.sign.tip_09=Serangan mendadak memiliki peluang lebih besar untuk mengenai sasaran. Misalnya, Anda dapat menyergap musuh di balik pintu yang tertutup ketika Anda tahu dia sedang mendekat.
levels.sign.tip_13=Jika Anda terbakar, Anda tidak bisa memadamkan api di dalam air saat melayang.
levels.sign.tip_21=Pixel-Mart. Harga spesial untuk pemburu iblis!
actors.blobs.waterofawareness.drink_message=Saat Anda menyesapnya, Anda merasakan pengetahuan mengalir ke dalam pikiran Anda. Sekarang Anda mengetahui segala sesuatu tentang item yang Anda kenakan. Anda juga dapat merasakan semua item di level tersebut dan mengetahui semua rahasianya.
