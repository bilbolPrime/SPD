daily.brief_0=Viện binh của Vua Chuột đang tới. Hạ hắn trước khi chúng đến triều đình. Một cai ngục bị bắt có thể giúp bạn chiến đấu, còn kho được canh giữ có vật tư.
daily.brief_1=Cuộc nổi loạn đang che chở cho Tengu trốn thoát. Hạ cả hai thủ lĩnh vượt ngục để mở nơi ẩn náu, rồi đánh bại Tengu trước khi hết giờ. Thả tù nhân để họ chống lính canh, hoặc tìm vật tư trong kho vũ khí bị khóa. Cửa nơi ẩn náu sẽ đóng sau khi bạn vào.
daily.brief_2=Ba thợ mỏ bị kẹt dưới lòng đất, và chuyến thang máy cuối sắp rời đi. Mở chỗ trú của họ, đưa cả ba còn sống về thang máy, rồi lên mặt đất. DM-300 đang lang thang trong hầm. Bạn có thể đánh nó hoặc tìm đường vòng. Vật tư và những lối tắt bị khóa có thể giúp bạn cứu mọi người.
daily.brief_3=Một Vuốt băng, một Gnoll lưng giá và một Sừng giá đang lang thang trong hang. Săn hạ cả ba rồi đến lối ra phía xa trước khi bão chặn đường. Bạn chọn thứ tự đi săn. Các nhánh hang có vật tư, nhưng tìm kiếm sẽ tốn thời gian.
daily.brief_4=Ba điểm nghi lễ đang triệu hồi quỷ vào đại sảnh. Đến từng điểm và phong ấn chúng trước khi nghi lễ hoàn tất. Mỗi phong ấn sẽ chặn một nguồn viện binh. Chọn đường đi và lục soát các phòng bên nếu cần vật tư.
daily.brief_5=Giữ tiền đồn đến khi cứu viện tới. Đội trưởng phải sống sót qua năm đợt tấn công. Quân phòng thủ sẽ giữ trung tâm khi bạn chiến đấu, tìm vật tư hoặc mở phòng giam để thêm người trợ giúp. Hãy theo dõi các lối vào: những đợt sau có thể đánh từ nhiều phía.
daily.brief_6=Vàng của thành phố nằm trong kho báu hoàng gia. Tìm đội trưởng, lấy chìa khóa, mở kho rồi thoát qua cổng phía xa trước khi cổng đóng. Mở kho sẽ báo động. Bạn có thể tìm vật tư và mở lối tắt trước, hoặc mạo hiểm cướp nhanh với ít đồ dự trữ hơn.
daily.rules=Mỗi ngày có anh hùng, trang bị và hầm ngục riêng. Phân bổ điểm kỹ năng trước khi lên đường. Thời gian tính theo lượt. Rời sự kiện sẽ kết thúc lần thử. Sự kiện hằng ngày có kết quả riêng, không mở huy hiệu hay mục trong thư viện.
daily.time_left=Còn _%d_ lượt
daily.timeout_0=Viện binh đã đến triều đình. Bạn phải rút lui.\n\nBạn có thể thử lại trong Thử thách hằng ngày.
daily.timeout_1=Hết giờ. Tengu đã thoát giữa cuộc nổi loạn.\n\nBạn có thể thử lại trong Thử thách hằng ngày.
daily.timeout_2=Chuyến thang máy cuối đã rời đi. Bạn không kịp đưa mọi người ra ngoài.\n\nBạn có thể thử lại trong Thử thách hằng ngày.
daily.timeout_3=Bão đã vùi lấp lối ra. Cuộc săn kết thúc.\n\nBạn có thể thử lại trong Thử thách hằng ngày.
daily.timeout_4=Nghi lễ hoàn tất. Quỷ đã tràn ngập đại sảnh.\n\nBạn có thể thử lại trong Thử thách hằng ngày.
daily.timeout_6=Cổng thành đã đóng. Lính canh chặn đường thoát của bạn.\n\nBạn có thể thử lại trong Thử thách hằng ngày.
