levels.rebornsiderooms.leave=Deixar
actors.mobs.npcs.echoreflection.name=seu reflexo
actors.mobs.npcs.echoreflection.desc=Uma cópia pálida de você espera imóvel. Ela só lutará se for desafiada. Vencê-la concede um ponto de habilidade. Sair da sala encerra o duelo e restaura a vida do reflexo.
actors.mobs.npcs.echoreflection.challenge=Desafiar seu reflexo? A vitória concede um ponto de habilidade. Você pode recuar, mas o reflexo se recuperará se você sair da sala.
actors.mobs.npcs.echoreflection.accept=Desafiar
actors.mobs.npcs.echoreflection.withdrawn=Seu reflexo volta a ficar imóvel.
actors.mobs.npcs.echoreflection.victory=O reflexo se desfaz, deixando um pergaminho de habilidade.
actors.mobs.npcs.barbecueking.name=rei rato
actors.mobs.npcs.barbecueking.desc=Até um rei precisa comer. Ele encontrou um canto tranquilo para assar o jantar.
actors.mobs.npcs.barbecueking.greeting=Assuntos reais. Muito importantes. Muito saborosos.
actors.mobs.npcs.barbecueking.stolen=EI! Isso era meu!
actors.mobs.npcs.barbecueking.after=Tomara que você engasgue.
actors.mobs.npcs.forgottenoffering.name=oferenda esquecida
actors.mobs.npcs.forgottenoffering.desc=Uma ração de comida e uma poção de cura esperam sob o cristal. Escolha uma; a outra virará pó.
actors.mobs.npcs.watchremains.name=guarda caído
actors.mobs.npcs.watchremains.desc=Os ossos de um guarda estão junto a uma parede quebrada. Há um pedaço de papel sob o capacete.
actors.mobs.npcs.watchremains.note=Segurei a porta a noite toda. Eles vieram pela parede.
