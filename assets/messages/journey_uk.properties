journey.title=Похід
journey.intro=Йог заволодів Амулетом, і його війська вже виходять на поверхню.\n\nПроведіть шістьох героїв через захоплені землі. Перед кожною вилазкою вибирайте шлях і героя. Полеглі не повернуться до кінця походу.
