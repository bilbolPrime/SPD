actors.skills.raiseskeletonskill.desc=召唤一具骷髅在你身边作战。
network.partysession.background=你已离开游戏，队伍连接已断开。
items.corpse.name=尸体
items.corpse.desc=一具新鲜的尸体，可以用于死灵术。
items.armorkit.desc=这套工具能把任何护甲改造成英雄护甲。原有属性不变，并获得适合你职业的特殊能力。无需掌握工匠技艺。
items.bomb.desc=一颗装满黑火药的小炸弹。投出时引线便会点燃。
items.quest.driedrose.desc=玫瑰早已干枯，花瓣却一片也没掉。
items.quest.phantomfish.desc=这条半透明的小鱼在空气中就很难看清，到了水里几乎完全隐形。
items.tomeofmastery.desc=这本皮面磨损的薄书似乎藏着不少知识。读完它需要一点时间。
items.weightstone.desc=可以调整近战武器的重心，提升攻击速度或精准度。
items.wands.wandofamok.desc=紫光使目标陷入狂乱，不分敌我地攻击周围生物。
items.wands.wandofavalanche.desc=击中墙壁或其他坚固障碍物时，会引发落石，伤害并击晕范围内的生物。
items.wands.wandofflock.desc=召唤一群魔法绵羊，暂时堵住通路。
items.wands.wandofpoison.desc=使目标中毒，持续受到伤害。升级魔杖可以延长中毒时间。
items.wands.wandofreach.desc=能隔空拾取物品，并与敌人交换位置。冲击波会触发沿途陷阱、压倒高草，并打开关着的门、关上开着的门。
items.wands.wandofslowness.desc=暂时将目标的移动和攻击速度减半。
items.wands.wandofteleportation.desc=将一个生物传送到当前楼层的随机位置。
items.weapon.melee.dualswords.desc=两把锋利的剑，带来更有力的斩击。
items.weapon.missiles.cupidarrow.desc=据说这支箭曾属于爱神。可要想好再选目标。
items.weapon.missiles.curaredart.desc=这些小飞镖伤害不高，但能麻痹目标，使其无法反抗。
items.weapon.missiles.incendiarydart.desc=镖尖扎进目标时，绑在镖身上的药剂便会燃烧起来。
items.weapon.missiles.soulcrystal.desc=能捕获灵魂的水晶。向弱小或虚弱的敌人投出，便可囚禁它的灵魂。
items.weapon.missiles.tamahawk.desc=这把投掷斧不算沉重，但仍需要足够的力量才能用好。
network.partytext.weapon_fast=这件武器攻击较快。
network.partytext.weapon_slow=这件武器攻击较慢。
network.partytext.weapon_accurate=这件武器精准度较高。
network.partytext.weapon_inaccurate=这件武器精准度较低。
network.partytext.weapon_fast_and_accurate=这件武器攻击较快，精准度也较高。
network.partytext.weapon_fast_but_inaccurate=这件武器攻击较快，但精准度较低。
network.partytext.weapon_slow_but_accurate=这件武器攻击较慢，但精准度较高。
network.partytext.weapon_slow_and_inaccurate=这件武器攻击较慢，精准度也较低。
network.partytext.necroblade_bolt=达到5级且能量蓄满时，可使用_暗影弹_，有机会粉碎目标的本质并将其变为仆从。
network.partytext.necroblade_intro=用黑暗魔法锻造的利刃，会吞噬被它杀死的生物的灵魂，逐渐变强。
network.partytext.necroblade_energy=储存的灵魂：_%s/100_
network.partytext.necroblade_damage=灵魂提供_0～%d额外伤害_。
network.partytext.necroblade_hungry=蓄满灵魂后，可以消耗它们来强化刀刃。
network.partytext.necroblade_full=刀刃已无法再通过消耗灵魂来强化。
