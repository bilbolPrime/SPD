levels.rebornsiderooms.leave=그냥 둔다
actors.mobs.npcs.echoreflection.name=당신의 환영
actors.mobs.npcs.echoreflection.desc=창백한 당신의 분신이 가만히 기다리고 있습니다. 도전을 받아야만 싸웁니다. 쓰러뜨리면 기술 점수 1점을 얻습니다. 방을 나가면 결투가 끝나고 환영의 체력이 모두 회복됩니다.
actors.mobs.npcs.echoreflection.challenge=당신의 환영에게 도전하시겠습니까? 승리하면 기술 점수 1점을 얻습니다. 물러날 수 있지만, 방을 나가면 환영의 체력이 회복됩니다.
actors.mobs.npcs.echoreflection.accept=도전한다
actors.mobs.npcs.echoreflection.withdrawn=당신의 환영이 다시 고요해집니다.
actors.mobs.npcs.echoreflection.victory=환영이 사라지고 기술의 주문서가 남았습니다.
actors.mobs.npcs.barbecueking.name=쥐 대왕
actors.mobs.npcs.barbecueking.desc=왕도 먹고는 살아야지요. 조용한 구석을 찾아 저녁거리를 굽고 있습니다.
actors.mobs.npcs.barbecueking.greeting=왕실 업무일세. 아주 중요하고, 아주 맛있지.
actors.mobs.npcs.barbecueking.stolen=야! 그건 내 거야!
actors.mobs.npcs.barbecueking.after=목에나 걸려라.
actors.mobs.npcs.forgottenoffering.name=잊힌 공물
actors.mobs.npcs.forgottenoffering.desc=수정 아래에 식량과 치유 물약이 놓여 있습니다. 하나를 고르면 다른 하나는 먼지가 됩니다.
actors.mobs.npcs.watchremains.name=쓰러진 경비병
actors.mobs.npcs.watchremains.desc=무너진 벽 옆에 경비병의 유골이 놓여 있습니다. 투구 아래에 종잇조각이 끼워져 있습니다.
actors.mobs.npcs.watchremains.note=밤새 문을 지켰다. 놈들은 벽으로 들어왔다.
