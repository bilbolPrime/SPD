items.scrolls.scrolloffrostlevel.name=Pergaminho de Geada
items.scrolls.scrolloffrostlevel.desc=O frio emana deste pergaminho.\n\nVocê também pode rasgá-lo em qualquer lugar para congelar todos os inimigos do andar até que sofram dano. Chefes e criaturas imunes ao congelamento não são afetados. Isso não causa dano.
items.scrolls.scrolloffrostlevel.ac_tear=Rasgar
items.scrolls.scrolloffrostlevel.tear_confirm=Rasgar este pergaminho liberará sua magia, congelando todos os inimigos do andar até que sofram dano. Chefes e criaturas imunes ao congelamento não são afetados. Isso não causa dano.\n\nRasgar o pergaminho?
items.scrolls.scrolloffrostlevel.wrong_place=O pergaminho não funciona aqui.
items.scrolls.scrolloffrostlevel.spent=A passagem já foi aberta. O pergaminho não reage.
items.keys.key.ice_depth=Esta chave pertence ao piso %d das Cavernas de Gelo.
scenes.interlevelscene$mode.frost=A entrar nas Cavernas de Gelo...
levels.icecaveslevel.water_name=Água gelada
levels.icecaveslevel.water_desc=Uma fina camada de gelo parte-se sob os pés.
levels.icecaveslevel.wall_desc=As marcas das picaretas desaparecem sob grossos veios de gelo. Os mineiros abandonaram estas galerias quando o frio se espalhou pela rocha.
levels.cavesbosslevel.collapsed_name=Caverna desmoronada
levels.cavesbosslevel.collapsed_desc=Uma caverna desmoronada. Não há passagem entre as rochas caídas.
actors.buffs.frostbite.name=Geladura
actors.buffs.frostbite.desc=O frio reduz a tua velocidade de movimento em 20%.
actors.mobs.rimebat.name=Morcego da geada
actors.mobs.rimebat.desc=Estes morcegos pálidos abrigam-se sob o gelo. A sua mordida gelada abranda brevemente os movimentos, dando-lhes tempo para voltar ao ataque.\n\nImune ao congelamento e à magia de gelo.
actors.mobs.iceclaw.name=Garra de gelo
actors.mobs.iceclaw.desc=Um necrófago com uma carapaça de gelo compacto. Antes de lutar, reforça a sua armadura por um breve período. O fogo derrete essa proteção adicional.\n\nImune ao congelamento e à magia de gelo.
actors.mobs.frostback.name=Gnoll dorso-gélido
actors.mobs.frostback.desc=Este gnoll sobrevive ao frio roubando quem se aventura aqui. Quando erguer a arma, afasta-te: o golpe pesado cairá onde estavas.\n\nImune ao congelamento e à magia de gelo.
actors.mobs.shardling.name=Estilhaço vivo
actors.mobs.shardling.desc=Um aglomerado inquieto de cristais de gelo. Aponta antes de lançar estilhaços em linha reta. As paredes travam a rajada.\n\nImune ao congelamento e à magia de gelo.
actors.mobs.hollowminer.name=Mineiro oco
actors.mobs.hollowminer.desc=Este mineiro nunca escapou das galerias geladas. A sua lanterna ainda arde, embora ele tenha morrido há muito. Se conseguir erguê-la, chama as criaturas próximas para a luta. Um golpe interrompe o sinal.\n\nImune ao congelamento e à magia de gelo.
actors.mobs.rimehorn.name=Corno da geada
actors.mobs.rimehorn.desc=Uma fera pesada com geada acumulada no pelo. Raspa o chão antes de investir em linha reta. Sai do seu caminho enquanto se prepara.\n\nImune ao congelamento e à magia de gelo.
actors.mobs.oldrime.name=Velho Gelo
actors.mobs.oldrime.desc=Os mineiros encontraram o Velho Gelo sob a montanha, enterrado em gelo mais antigo do que os túneis. As picaretas acordaram-no. Agora guarda as galerias geladas e a passagem além delas. A armadura parte-se à medida que enfraquece, libertando os membros. Cuidado com os golpes pesados, o gelo que rompe o chão e o seu bafo gelado.\n\nImune ao congelamento e à magia de gelo.
actors.mobs.oldrime.warning=O Velho Gelo prepara-se para golpear!
windows.wndjournal.ice_depth=Gelo %d
levels.icebosslevel.exit_name=Passagem da caverna
levels.icebosslevel.exit_desc=Uma passagem estreita avança para o interior da montanha.
levels.icebosslevel.blocked_name=Passagem congelada
levels.icebosslevel.blocked_desc=Uma parede de gelo bloqueia a passagem atrás do Velho Gelo.
items.weapon.ice.wrong_hero=Esta arma não é para ti.
items.weapon.ice.already_enchanted=Esta arma já está encantada.
items.weapon.ice.glaciercleaver.name=Cutelo do glaciar
items.weapon.ice.glaciercleaver.desc=Uma lâmina larga talhada no gelo do Velho Gelo. Um golpe cobre o alvo de geada durante quatro turnos. O golpe seguinte com um Cutelo do glaciar quebra-a e causa %d de dano adicional. Só um Guerreiro o pode usar.
actors.buffs.frostcoating.name=Coberto de geada
actors.buffs.frostcoating.desc=Uma fina camada de geada cobre esta criatura. Um golpe de Cutelo do glaciar irá quebrá-la.
items.weapon.ice.hoarfroststaff.name=Cajado da geada branca
items.weapon.ice.hoarfroststaff.desc=O frio acumula-se entre as pontas deste cajado. Os seus projéteis causam %d-%d de dano antes dos bónus de habilidades e abrandam os movimentos e ataques durante dois turnos. Começa com três cargas e recarrega como uma varinha. Só um Mago o pode usar.
items.weapon.ice.rimepick.name=Pico de geada
items.weapon.ice.rimepick.desc=Este pico de gelo estreito encontra as falhas na armadura. Ignora um quarto da armadura do alvo, ou metade se o apanhar desprevenido. Só um Ladino o pode usar.
items.weapon.ice.frostbow.name=Arco da geada
items.weapon.ice.frostbow.desc=As flechas deste arco explodem em gelo afiado ao atingir o alvo. Causam mais %d%% de dano ao alvo e um quarto do dano do golpe aos inimigos adjacentes. Os estilhaços não congelam as vítimas. Só uma Caçadora o pode usar.
items.weapon.ice.gravefrostscythe.name=Foice da geada sepulcral
items.weapon.ice.gravefrostscythe.desc=A geada cobre o cabo revestido de ossos desta foice. Enquanto está equipada, os teus esqueletos e fantasmas invocados causam %d de dano de frio adicional por golpe. Só um Necromante a pode usar.
items.weapon.ice.frostbiterifle.name=Espingarda da geladura
items.weapon.ice.frostbiterifle.desc=A câmara desta espingarda está revestida de gelo que nunca derrete. Cada tiro certeiro causa geladura durante dois turnos, abrandando os movimentos em 20%. Os tiros seguintes renovam o efeito. Só um Mercenário a pode usar.
library.ice_weapon_drop=Cai uma arma por cada herói, de acordo com a sua classe.

actors.mobs.npcs.prospector.name=Prospector encurralado
actors.mobs.npcs.prospector.desc=Um prospector com um casaco remendado se abriga perto da escada. Sua lamparina está quase apagando.
actors.mobs.npcs.prospector.torches=Minha lamparina não vai durar muito. Deixei um baú de provisões neste andar quando fugi. Pode me trazer _três tochas_ de lá?
actors.mobs.npcs.prospector.iceclaws=As garras de gelo me expulsaram da galeria. Mate _três garras de gelo neste andar_ para eu poder voltar ao trabalho.
actors.mobs.npcs.prospector.accept=Vou ajudar.
actors.mobs.npcs.prospector.later=Agora não.
actors.mobs.npcs.prospector.need_torches=Preciso de _três tochas_. O baú ainda está em algum lugar deste andar.
actors.mobs.npcs.prospector.claws_left=Garras de gelo restantes: _%d_.
actors.mobs.npcs.prospector.reward=Bom trabalho. O que prefere?
actors.mobs.npcs.prospector.rations=Duas rações de alimentos
actors.mobs.npcs.prospector.thanks=Uma preocupação a menos. Obrigado.
library.quest.prospector_torches.name=Uma lamparina se apagando
library.quest.prospector_torches.desc=Leve três tochas ao prospector encurralado. Um baú no andar dele tem tochas suficientes.
library.quest.prospector_iceclaws.name=Garras na galeria
library.quest.prospector_iceclaws.desc=Mate três garras de gelo no andar do prospector e volte para falar com ele.
library.quest.prospector.reward=Escolha um pergaminho de melhoria ou duas rações de alimentos.
items.scrolls.scrolloffrostlevel.read_confirm=Enquanto lê, você sente que está prestes a ser teleportado.
