actors.mobs.rebornboss.opening=Odkrytý!
actors.mobs.rebornboss.interrupted=%s ztrácí soustředění!
actors.mobs.reborngoo.desc=O Slizu se toho ví jen málo. Možná to ani není živý tvor, ale shluk látek ze stok, který získal zárodky vlastní vůle.
actors.mobs.reborngoo.warning=Goo se nafukuje. Uhni mu z cesty!
actors.mobs.reborndm300.desc=Tento stroj postavili trpaslíci před několika staletími. Později začali stroje nahrazovat golemy, elementály, a dokonce i démony. To nakonec vedlo k úpadku jejich civilizace. DM-300 a podobné stroje sloužily hlavně ke stavbě a těžbě, někdy také k obraně města.
actors.mobs.reborndm300.repair=DM-300 se opravuje!
actors.mobs.reborndm300.warning=Motor kvílí. Opusť označená místa!
actors.mobs.rebornking.desc=Poslední král trpaslíků proslul hlubokými znalostmi života a smrti. Přesvědčil členy svého dvora, aby se zúčastnili rituálu, který jim měl dát věčné mládí. Nakonec ho získal jen on — a k tomu armádu nemrtvých.
actors.mobs.rebornking.warning=Král zvedá ruku!
actors.mobs.rebornking.herald_fell=Držte pozice, zbabělci!
actors.mobs.rebornking$retainer.name_0=Královská stráž
actors.mobs.rebornking$retainer.desc_0=Mrtvý trpaslík v otlučené zbroji stále hlídá svého krále.
actors.mobs.rebornking$retainer.name_1=Dvorní kouzelník
actors.mobs.rebornking$retainer.desc_1=Dvorní mág povolaný ze záhrobí. V rukou se mu sbírá temná magie.
actors.mobs.rebornking$retainer.name_2=Královský herold
actors.mobs.rebornking$retainer.desc_2=I se zlomenou čelistí tento herold vyštěkává královy rozkazy. Mrtví poslouchají.
actors.mobs.rebornking$retainer.name_3=Nemrtvý lučištník
actors.mobs.rebornking$retainer.desc_3=Tohoto trpaslíka pohřbili s lukem. Nezapomněl, jak se s ním zachází.
actors.mobs.rebornyog.desc=Yog-Dzewa je Starý bůh, mocná entita z říše chaosu. Před stoletím starověcí trpaslíci jen stěží vyhráli válku proti jeho armádě démonů, ale samotného boha nedokázali zabít. Místo toho ho uvěznili v síních pod svým městem v domnění, že je příliš slabý na to, aby se někdy znovu vzchopil.
actors.mobs.rebornyog.warning=Vzduch se trhá. Opusť blikající značky!
actors.mobs.rebornyog.inherit_rot=Maso chřadne. Já zůstávám.
actors.mobs.rebornyog.inherit_fire=Plamen teď patří mně.
actors.mobs.rebornyog$rotting.desc=Obrovská pěst z hnijícího masa. Mezi prsty jí prosakuje odporný sliz a špiní kámen pod ní.
actors.mobs.rebornyog$rotting.warning=Hnijící pěst se napřahuje!
actors.mobs.rebornyog$burninghand.desc=Mohutná pěst zahalená ohněm. Prsty jí při sevření praskají a sypou na podlahu žhavé uhlíky.
actors.mobs.rebornyog$burninghand.warning=Před hořící pěstí se sbírají uhlíky!
actors.mobs.reborntengu.shadow_broken=Můj stín…!
