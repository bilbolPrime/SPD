custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=Заклинання на цьому сувої створить ілюзорних двійників читача, які переслідуватимуть його ворогів.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Заклинання на цьому сувої миттєво зніме зі зброї, обладунків, перснів та предметів, що носяться читачем, будь-які злі чари, які можуть перешкодити власнику зняти їх.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Сира магічна сила, замкнена в цьому пергаменті, після вивільнення повністю зарядить усі чарівні палички читача.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Сувій зберігає таємницю забороненого ритуалу. В обмін на благополуччя читача сувій завдає шкоди всім, хто знаходиться поруч, і повністю зцілює його.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Сувій здається холоднішим за навколишнє середовище. Ніби це портал до холоднішого виміру.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Заклинання на цьому пергаменті миттєво переносить читача у випадкове місце на рівні підземелля. Його можна використати, щоб уникнути небезпечної ситуації, але невдалий читач може опинитися в ще небезпечнішому місці.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Цей сувій містить руйнівну енергію, яку можна піонічно спрямувати, щоб завдати величезної шкоди всім істотам у полі зору. Супутній спалах світла тимчасово засліпить усіх у зоні дії, включаючи читача сувою.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Цей сувій здатний наповнити зброю або броню випадковим зачаруванням, надаючи їм особливу силу.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Цей сувій покращить окремий предмет, покращивши його якість. Чарівна паличка збільшиться в потужності та кількості зарядів; зброя завдаватиме більше шкоди або частіше знаходитиме свою ціль; обладунки відбиватимуть додаткові удари; вплив кільця на його власника посилиться. Зброя та обладунки також вимагатимуть менше сили для використання, а будь-які прокляття з предмета будуть зняті.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=При читанні вголос цей сувій видаватиме запеклий рев, який розбудить усіх монстрів і попередить їх про місцезнаходження читача.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Прочитані слова натхнення підготують вас до бою.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=Коли ви читаєте мудрі слова, вони покращать вашу майстерність.

