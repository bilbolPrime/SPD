items.scrolls.scrolloffrostlevel.name=Parchemin de givre
items.scrolls.scrolloffrostlevel.desc=Le froid émane de ce parchemin.\n\nVous pouvez aussi le déchirer n'importe où pour geler tous les ennemis de l'étage jusqu'à ce qu'ils subissent des dégâts. Les boss et les créatures immunisées contre le gel ne sont pas affectés. Cela ne cause aucun dégât.
items.scrolls.scrolloffrostlevel.ac_tear=Déchirer
items.scrolls.scrolloffrostlevel.tear_confirm=Déchirer ce parchemin libérera sa magie et gèlera tous les ennemis de l'étage jusqu'à ce qu'ils subissent des dégâts. Les boss et les créatures immunisées contre le gel ne sont pas affectés. Cela ne cause aucun dégât.\n\nDéchirer le parchemin ?
items.scrolls.scrolloffrostlevel.wrong_place=Le parchemin ne fonctionne pas ici.
items.scrolls.scrolloffrostlevel.spent=Le passage a déjà été ouvert. Le parchemin reste muet.
items.keys.key.ice_depth=Cette clé appartient à l'étage %d des Grottes de glace.
scenes.interlevelscene$mode.frost=Entrée dans les Grottes de glace...
levels.icecaveslevel.water_name=Eau glacée
levels.icecaveslevel.water_desc=Une fine couche de glace craque sous les pas.
levels.icecaveslevel.wall_desc=Les traces de pioche disparaissent sous d'épaisses veines de glace. Les mineurs ont abandonné ces galeries quand le froid a gagné la roche.
levels.cavesbosslevel.collapsed_name=Grotte effondrée
levels.cavesbosslevel.collapsed_desc=Une grotte effondrée. Impossible de traverser les éboulis.
actors.buffs.frostbite.name=Engelures
actors.buffs.frostbite.desc=Le froid ralentit vos déplacements de 20%.
actors.mobs.rimebat.name=Chauve-souris givrée
actors.mobs.rimebat.desc=Ces chauves-souris pâles nichent sous la glace. Leur morsure glaciale ralentit brièvement les déplacements, leur laissant le temps de revenir à l'attaque.\n\nLe gel et la magie du froid sont sans effet.
actors.mobs.iceclaw.name=Griffe-de-glace
actors.mobs.iceclaw.desc=Un charognard couvert d'une carapace de glace compacte. Avant le combat, il renforce brièvement son armure. Le feu fait fondre cette protection supplémentaire.\n\nLe gel et la magie du froid sont sans effet.
actors.mobs.frostback.name=Gnoll dos-de-givre
actors.mobs.frostback.desc=Ce gnoll survit au froid en dépouillant les imprudents qui s'aventurent ici. Quand il lève son arme, écartez-vous : son coup puissant frappera votre ancienne position.\n\nLe gel et la magie du froid sont sans effet.
actors.mobs.shardling.name=Éclat vivant
actors.mobs.shardling.desc=Un amas agité de cristaux de glace. Il vise avant de tirer des éclats en ligne droite. Les murs arrêtent la volée.\n\nLe gel et la magie du froid sont sans effet.
actors.mobs.hollowminer.name=Mineur creux
actors.mobs.hollowminer.desc=Ce mineur n'a jamais quitté les galeries gelées. Sa lanterne brûle encore, bien qu'il soit mort depuis longtemps. S'il parvient à la lever, il appelle les créatures proches au combat. Un coup interrompt le signal.\n\nLe gel et la magie du froid sont sans effet.
actors.mobs.rimehorn.name=Corne-de-givre
actors.mobs.rimehorn.desc=Une bête massive au pelage chargé de givre. Elle gratte le sol avant de charger en ligne droite. Écartez-vous pendant qu'elle se prépare.\n\nLe gel et la magie du froid sont sans effet.
actors.mobs.oldrime.name=Vieux Givre
actors.mobs.oldrime.desc=Les mineurs ont trouvé le Vieux Givre sous la montagne, enfoui dans une glace plus ancienne que leurs tunnels. Leurs pioches l'ont réveillé. Il garde désormais les galeries gelées et le passage au-delà. Son armure se brise à mesure qu'il faiblit, libérant ses membres. Méfiez-vous de ses coups puissants, de la glace qui perce le sol et de son souffle gelé.\n\nLe gel et la magie du froid sont sans effet.
actors.mobs.oldrime.warning=Le Vieux Givre se prépare à frapper !
windows.wndjournal.ice_depth=Glace %d
levels.icebosslevel.exit_name=Passage souterrain
levels.icebosslevel.exit_desc=Un passage étroit s'enfonce dans la montagne.
levels.icebosslevel.blocked_name=Passage gelé
levels.icebosslevel.blocked_desc=Un mur de glace bloque le passage derrière le Vieux Givre.
items.weapon.ice.wrong_hero=Cette arme n'est pas faite pour vous.
items.weapon.ice.already_enchanted=Cette arme est déjà enchantée.
items.weapon.ice.glaciercleaver.name=Couperet du glacier
items.weapon.ice.glaciercleaver.desc=Une large lame taillée dans la glace du Vieux Givre. Un coup couvre la cible de givre pendant quatre tours. Le coup suivant d'un Couperet du glacier le brise et inflige %d dégâts supplémentaires. Seul un Guerrier peut le manier.
actors.buffs.frostcoating.name=Couvert de givre
actors.buffs.frostcoating.desc=Une fine couche de givre recouvre cette créature. Un coup de Couperet du glacier la brisera.
items.weapon.ice.hoarfroststaff.name=Bâton de gelée blanche
items.weapon.ice.hoarfroststaff.desc=Le froid s'accumule entre les pointes de ce bâton. Ses projectiles infligent %d-%d dégâts avant les bonus de compétences et ralentissent les déplacements et les attaques pendant deux tours. Il contient trois charges au départ et se recharge comme une baguette. Seul un Mage peut le manier.
items.weapon.ice.rimepick.name=Pic de givre
items.weapon.ice.rimepick.desc=Ce pic à glace étroit se glisse dans les failles de l'armure. Il ignore un quart de l'armure de la cible, ou la moitié si elle est prise au dépourvu. Seul un Voyou peut le manier.
items.weapon.ice.frostbow.name=Arc de givre
items.weapon.ice.frostbow.desc=Les flèches tirées par cet arc éclatent en glace tranchante à l'impact. Elles infligent %d%% de dégâts supplémentaires à la cible et un quart des dégâts du coup aux ennemis adjacents. Les éclats ne gèlent pas leurs victimes. Seule une Chasseresse peut le manier.
items.weapon.ice.gravefrostscythe.name=Faux du givre funèbre
items.weapon.ice.gravefrostscythe.desc=Le givre recouvre le manche cerclé d'os de cette faux. Quand elle est équipée, vos squelettes et fantômes invoqués infligent %d dégâts de froid supplémentaires par coup. Seul un Nécromancien peut la manier.
items.weapon.ice.frostbiterifle.name=Fusil des engelures
items.weapon.ice.frostbiterifle.desc=La chambre de ce fusil est tapissée d'une glace qui ne fond jamais. Chaque tir réussi inflige des engelures pendant deux tours, ralentissant les déplacements de 20%. Les tirs suivants renouvellent l'effet. Seul un Mercenaire peut le manier.
library.ice_weapon_drop=Une arme tombe pour chaque héros, selon sa classe.

actors.mobs.npcs.prospector.name=Prospecteur bloqué
actors.mobs.npcs.prospector.desc=Un prospecteur au manteau rapiécé s'abrite près de l'escalier. Sa lampe est presque éteinte.
actors.mobs.npcs.prospector.torches=Ma lampe ne tiendra plus longtemps. J'ai laissé un coffre de provisions à cet étage en fuyant. Tu pourrais m'en rapporter _trois torches_ ?
actors.mobs.npcs.prospector.iceclaws=Les griffes-de-glace m'ont chassé de ma galerie. Tue _trois griffes-de-glace à cet étage_ pour que je puisse reprendre le travail.
actors.mobs.npcs.prospector.accept=Je vais t'aider.
actors.mobs.npcs.prospector.later=Pas maintenant.
actors.mobs.npcs.prospector.need_torches=Il me faut _trois torches_. Le coffre est toujours quelque part à cet étage.
actors.mobs.npcs.prospector.claws_left=Griffes-de-glace à tuer : _%d_.
actors.mobs.npcs.prospector.reward=Beau travail. Que préfères-tu ?
actors.mobs.npcs.prospector.rations=Deux rations alimentaires
actors.mobs.npcs.prospector.thanks=Un souci de moins. Merci.
library.quest.prospector_torches.name=Une lampe qui s'éteint
library.quest.prospector_torches.desc=Apportez trois torches au prospecteur bloqué. Un coffre à son étage en contient assez.
library.quest.prospector_iceclaws.name=Des griffes-de-glace dans la galerie
library.quest.prospector_iceclaws.desc=Tuez trois griffes-de-glace à l'étage du prospecteur, puis retournez le voir.
library.quest.prospector.reward=Choisissez un parchemin d'amélioration ou deux rations alimentaires.
items.scrolls.scrolloffrostlevel.read_confirm=En lisant, vous sentez que vous êtes sur le point d'être téléporté.
