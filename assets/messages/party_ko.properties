actors.skills.raiseskeletonskill.desc=해골을 소환해 당신 곁에서 싸우게 합니다.
network.partysession.background=게임을 벗어나 파티 연결이 끊어졌습니다.
items.corpse.name=시체
items.corpse.desc=아직 부패하지 않은 시체입니다. 강령술에 쓸 수 있습니다.
items.armorkit.desc=어떤 갑옷이든 영웅의 갑옷으로 바꿀 수 있는 도구입니다. 원래 성능을 유지하면서 직업에 맞는 능력이 생깁니다. 제작 기술은 필요하지 않습니다.
items.bomb.desc=흑색 화약이 든 작은 폭탄입니다. 던지면 도화선에 불이 붙습니다.
items.quest.driedrose.desc=오래전에 말랐지만 꽃잎은 모두 남아 있는 장미입니다.
items.quest.phantomfish.desc=공중에서도 잘 보이지 않는 반투명한 작은 물고기입니다. 물속에서는 거의 보이지 않습니다.
items.tomeofmastery.desc=낡은 가죽 표지의 얇은 책입니다. 많은 지식이 담긴 듯하며, 읽는 데 시간이 조금 걸립니다.
items.weightstone.desc=근접 무기의 무게중심을 조정해 공격 속도나 정확도를 높입니다.
items.wands.wandofamok.desc=보랏빛이 대상을 광란에 빠뜨려 주변 생물을 가리지 않고 공격하게 합니다.
items.wands.wandofavalanche.desc=벽이나 단단한 장애물에 맞으면 낙석을 일으켜 범위 안의 생물에게 피해를 주고 기절시킵니다.
items.wands.wandofflock.desc=마법의 양 떼를 불러 잠시 길을 막습니다.
items.wands.wandofpoison.desc=대상을 중독시켜 지속적으로 피해를 줍니다. 강화할수록 독이 오래갑니다.
items.wands.wandofreach.desc=멀리 있는 물건을 가져오거나 적과 자리를 바꿉니다. 힘의 파동은 경로의 함정을 작동시키고, 풀을 밟고, 문을 여닫습니다.
items.wands.wandofslowness.desc=대상의 이동과 공격 속도를 잠시 절반으로 낮춥니다.
items.wands.wandofteleportation.desc=생물을 현재 층의 무작위 장소로 옮깁니다.
items.weapon.melee.dualswords.desc=날카로운 두 칼날로 더 강하게 베어 냅니다.
items.weapon.missiles.cupidarrow.desc=사랑의 신이 쓰던 화살이라고 합니다. 누구를 겨누는지 조심하세요.
items.weapon.missiles.curaredart.desc=피해는 작지만 대상을 마비시켜 무방비로 만들 수 있는 다트입니다.
items.weapon.missiles.incendiarydart.desc=촉이 대상에 박히면 다트에 묶인 약제가 타오릅니다.
items.weapon.missiles.soulcrystal.desc=영혼을 붙잡을 수 있는 수정입니다. 약하거나 약해진 적에게 던지면 그 영혼을 가둡니다.
items.weapon.missiles.tamahawk.desc=그리 무겁지는 않지만 제대로 던지려면 힘이 필요한 투척 도끼입니다.
network.partytext.weapon_fast=이 무기는 공격이 빠릅니다.
network.partytext.weapon_slow=이 무기는 공격이 느립니다.
network.partytext.weapon_accurate=이 무기는 정확도가 높습니다.
network.partytext.weapon_inaccurate=이 무기는 정확도가 낮습니다.
network.partytext.weapon_fast_and_accurate=이 무기는 공격이 빠르고 정확도가 높습니다.
network.partytext.weapon_fast_but_inaccurate=이 무기는 공격이 빠르지만 정확도가 낮습니다.
network.partytext.weapon_slow_but_accurate=이 무기는 공격이 느리지만 정확도가 높습니다.
network.partytext.weapon_slow_and_inaccurate=이 무기는 공격이 느리고 정확도가 낮습니다.
network.partytext.necroblade_bolt=5레벨부터 기운을 가득 채우면 _어둠의 탄환_을 쓸 수 있습니다. 대상의 본질을 파괴해 하수인으로 만들 수 있습니다.
network.partytext.necroblade_intro=어둠의 마법으로 벼린 칼날입니다. 쓰러뜨린 적의 영혼을 삼킬수록 강해집니다.
network.partytext.necroblade_energy=저장된 영혼: _%s/100_
network.partytext.necroblade_damage=저장된 영혼으로 피해가 _0~%d 증가_합니다.
network.partytext.necroblade_hungry=영혼을 가득 채워 소모하면 칼날을 강화할 수 있습니다.
network.partytext.necroblade_full=이제 영혼을 소모해 칼날을 강화할 수는 없습니다.
