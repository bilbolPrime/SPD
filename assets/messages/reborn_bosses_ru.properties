actors.mobs.rebornboss.opening=Уязвим!
actors.mobs.rebornboss.interrupted=%s теряет концентрацию!
actors.mobs.reborngoo.desc=О Жиже мало что известно. Возможно, это даже не существо, а скопление канализационных отходов, обретшее зачатки собственной воли.
actors.mobs.reborngoo.warning=Гу раздувается. Уйдите с его пути!
actors.mobs.reborndm300.desc=Эту машину дварфы создали несколько столетий назад. Позже они стали заменять машины големами, элементалями и даже демонами. В конце концов это привело их цивилизацию к упадку. DM-300 и подобные машины обычно использовались на стройках и в шахтах, а иногда и для обороны города.
actors.mobs.reborndm300.repair=DM-300 ремонтирует себя!
actors.mobs.reborndm300.warning=Двигатель визжит. Уйдите с отмеченных клеток!
actors.mobs.rebornking.desc=Последний король дварфов славился глубокими познаниями в тайнах жизни и смерти. Он уговорил придворных принять участие в ритуале, который должен был даровать им вечную молодость. В итоге её получил лишь сам король — а в придачу целую армию нежити.
actors.mobs.rebornking.warning=Король поднимает руку!
actors.mobs.rebornking.herald_fell=Держать строй, трусы!
actors.mobs.rebornking$retainer.name_0=Королевский страж
actors.mobs.rebornking$retainer.desc_0=Мёртвый дворф в помятых доспехах. Он всё ещё охраняет своего короля.
actors.mobs.rebornking$retainer.name_1=Придворный маг
actors.mobs.rebornking$retainer.desc_1=Придворный маг, поднятый из мёртвых. В его руках сгущается тёмная магия.
actors.mobs.rebornking$retainer.name_2=Королевский глашатай
actors.mobs.rebornking$retainer.desc_2=Даже со сломанной челюстью этот глашатай выкрикивает приказы Короля. Мёртвые повинуются.
actors.mobs.rebornking$retainer.name_3=Мёртвый лучник
actors.mobs.rebornking$retainer.desc_3=Этого дворфа похоронили вместе с луком. Он не забыл, как им пользоваться.
actors.mobs.rebornyog.desc=Йог-Дзева — Древний Бог, могущественное существо из царств хаоса. Столетие назад древние гномы с трудом одержали победу в войне против его армии демонов, но не смогли убить самого бога. Вместо этого они заточили его в залах под своим городом, полагая, что он слишком слаб, чтобы когда-либо снова восстать.
actors.mobs.rebornyog.warning=Воздух рвётся. Уйдите с мерцающих меток!
actors.mobs.rebornyog.inherit_rot=Плоть увядает. Я остаюсь.
actors.mobs.rebornyog.inherit_fire=Теперь пламя моё.
actors.mobs.rebornyog$rotting.desc=Огромный кулак из гнилой плоти. Между пальцами сочится зловонная слизь, пачкая камень под ним.
actors.mobs.rebornyog$rotting.warning=Гниющий кулак замахивается!
actors.mobs.rebornyog$burninghand.desc=Огромный кулак, объятый огнём. Пальцы с треском сжимаются, роняя на пол тлеющие угли.
actors.mobs.rebornyog$burninghand.warning=Перед пылающим кулаком собираются угли!
actors.mobs.reborntengu.shadow_broken=Моя тень…!
