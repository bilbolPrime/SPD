challenges.champion_enemies=Ellenséges bajnokok
challenges.champion_enemies_desc=Nem te vagy az egyetlen, aki szintet léphet!\n\nA normál ellenfeleknek 1/8 esélyük van a megjelenésre egy speciális hős erősítéssel az 1. szinten, ami a 21. szinten 1/6-ra nő.\n\n- A hősök felébrednek, ha alva jelennek meg\n- A hős tudja, mikor jelenik meg egy hős.\n- A hősökből nem lehet szövetségeseket csinálni.\n\nHatféle hős ellenség létezik:\n_Lángoló (narancssárga):_ +25% közelharci sebzés, találatkor belobban, halálkor lángot terjeszt, nem tudja meggyújtani a vízcsempéket.\n_Kivetülő (lila):_ +25% közelharci sebzés, +3 közelharci hatótávolság.\n_Antimágia (zöld):_ -50% elszenvedett sebzés, immunis a varázslatra. hatások\n_Óriás (kék):_ -80% elszenvedett sebzés, +1 közelharci hatótávolság, nem lehet alagutakba lépni\n_Áldott (sárga):_ 4x pontosság és kitérés\n_Növekvő (piros):_ +20% pontosság, kitérés, sebzés és effektív HP. 4 körönként 1%-kal nő.
challenges.darkness=A sötétségbe
challenges.darkness_desc=Végül is ez egy kazamata!\n\n - A szokásos látótávolság drámaian csökkent\n - Minden emeleten megjelenik egy zseblámpa\n - A többi fényforrás 1/5-e akkora hatékonyságú.
challenges.no_armor=A hit a páncélom
challenges.no_armor_desc=Szükséged lesz önbizalomra, mivel a páncélod nem sokat fog segíteni!\n\n - Az összes páncél alapblokkoló ereje csökkent, kivéve a szövetpáncélt\n - Az összes páncél fejlesztésekor mostantól nagyon kevés blokkolást eredményez\n - Az Earthen Guardian védekező ereje is jelentősen csökken
challenges.no_food=Diétán
challenges.no_food_desc=Már így is kevés az étel, de az adagokra is figyelni kell! \n\n - Az étel és a bőségszaru harmadannyian csillapítja az éhséget. \n - A jóllakottság egyéb forrásai változatlanok.
challenges.no_healing=Farmakofóbia
challenges.no_healing_desc=A gyógyító főzetek tényleg hasznosak, sajnos allergiás vagy!\n\n- A gyógyító főzetek, a gyógyító főzeteket tartalmazó receptek és a napraforgó megmérgezik a hőst a gyógyítás helyett.\n- Az instabil főzetek nem tudják véletlenszerűen megmérgezni vagy meggyógyítani a hőst.\n- Ezek a tárgyak továbbra is normálisan működnek más karaktereknél.
challenges.no_herbalism=Kopár föld
challenges.no_herbalism_desc=Úgy tűnik, nincs már tiszta víz ebben az átkozott kazamatában...\n\n- A harmatcseppek eltűnnek\n- A növények eltűnnek\n- A magok még megjelennek, de nem gyökereznek meg
challenges.no_scrolls=Tiltott rúnák
challenges.no_scrolls_desc=Bizonyos rúnákat nehezebb megtalálni. Sajnos mindig az a leghasznosabb. \n\n - A kazamata fejlesztési tekercseinek fele eltávolításra kerül.
challenges.stronger_bosses=Rosszabb főnökök
