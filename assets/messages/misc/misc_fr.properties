library.items.soulcrystal.desc=Un cristal contenant un esprit capturé. Lancez-le pour invoquer cet esprit à votre service.
library.items.dreamweed.name=graine d'herbe des songes
library.items.dreamweed.desc=Au contact, l'herbe des songes libère un nuage scintillant qui désoriente les créatures.
library.items.bag.desc=Un sac à dos pour vos affaires.
library.items.armor.huntressarmor.desc=Cette cape permet à la chasseresse de lancer une lame spectrale sur chaque ennemi visible. Les dégâts dépendent de son arme de mêlée équipée.
library.items.armor.magearmor.desc=Cette robe permet au mage d'enflammer et d'immobiliser tous les ennemis visibles avec un sort de terre en fusion.
library.items.armor.roguearmor.desc=Cette tenue permet au voleur d'aveugler les ennemis qui le voient et de bondir à l'écart grâce à une bombe fumigène.
library.items.armor.warriorarmor.desc=Cette armure permet au guerrier de bondir vers un endroit choisi et d'étourdir les ennemis adjacents à l'atterrissage.
library.items.flamebow.desc=Un arc enchanté dont les flèches peuvent enflammer les cibles.
library.items.frostbow.desc=Un arc enchanté dont les flèches peuvent geler les cibles.
library.items.necroblade.desc=Forgée par la magie noire, cette lame dévore les âmes de ses victimes et gagne en puissance.\n\nAu niveau 5, la lame entièrement chargée peut lancer _Trait sombre_, qui peut détruire l'essence d'une cible et l'asservir.
library.items.soulblade.desc=Cette lame tire sa force de l'âme de son porteur.\n\n_Niveau 3 : rend 20 PV pour 20 mana_\n\n_Niveau 5 : dissipe les malédictions pour 50 mana_\n\n_Niveau 7 : dépense toute la mana pour frapper les ennemis ; 50 mana minimum_
library.items.wands.wandofdisintegration.desc=Un rayon destructeur traverse les créatures. Plus il en touche, plus chacune subit de dégâts.
library.items.wands.wandoflightning.desc=Des arcs électriques frappent plusieurs créatures proches les unes des autres.
library.items.wands.wandofmagicmissile.desc=Projette de l'énergie magique pure qui inflige des dégâts modérés à une créature.
library.items.wands.wandofregrowth.desc=Fait pousser de l'herbe sur sa trajectoire et une végétation dense à l'impact.
library.class_armor_stats=La protection et la force requise dépendent de l'armure d'origine.
library.bow_stats=Multiplie les dégâts des flèches par _%.2f_. Les dégâts de base dépendent de la flèche.
library.strength=Nécessite _%d de force_.
library.weapon_stats=Inflige _%1$d-%2$d dégâts_ et nécessite _%3$d de force_.
library.ring_level=Niveau de l'anneau : _%+d_.
library.ring_accuracy=Précision multipliée par _%1$.2f_. Modifie la compétence d'attaque, pas directement la probabilité de toucher.
library.ring_evasion=Esquive multipliée par _%1$.2f_. Modifie la compétence de défense, pas directement la probabilité d'esquiver.
library.ring_haste=Durée des actions multipliée par _%1$.2f_. Une valeur plus basse accélère les actions.
library.ring_shadows=Discrétion : _%+d_.
library.ring_mending=Sans compétence de régénération, rend _1 PV tous les %1$.2f tours_ si vous êtes blessé et ne mourez pas de faim.
library.ring_satiety=Ajoute _%d de faim_ à chaque étape de faim, au lieu de 10. La fréquence dépend aussi de la classe et des effets temporaires.
library.ring_power=Puissance des baguettes : _%+d_. Chaque baguette utilise ce bonus à sa façon.
library.ring_detection=Rayon de recherche : _%d cases_. Un niveau négatif réduit aussi les chances de trouver les secrets.
library.ring_elements=Chance de résister aux éléments : _%1$.1f%%_. La durée des effets négatifs concernés est multipliée par _%2$.2f_.
library.ring_herbalism=Piétiner l'herbe a _%1$.1f%%_ de chances de donner une graine et _%2$.1f%%_ de donner de la rosée, si l'étage et les défis le permettent.
library.ring_haggler=Divise par deux les prix d'achat d'au moins 2 pièces d'or, en arrondissant à l'inférieur.
library.ring_thorns=Renvoie une quantité aléatoire allant de zéro aux dégâts de l'attaque reçue, avant la protection de l'armure.
library.gun_modifiers=L'équilibrage de vitesse et les enchantements n'affectent pas les tirs.
library.items.weapon.melee.battleaxe.desc=L'énorme tête en acier de cette hache de guerre confère un poids considérable à chaque coup.
library.items.weapon.melee.dagger.desc=Une simple dague en fer avec un manche en bois usé.
library.items.weapon.melee.glaive.desc=Arme massive composée d'une lame d'épée au bout d'une perche.
library.items.weapon.melee.longsword.desc=La longue lame en acier tranchant comme un rasoir de cette épée brille d'un éclat rassurant, bien que sa taille la rende assez lourde.
library.items.weapon.melee.mace.desc=La grande tête en fer de cette arme inflige des dégâts considérables.
library.items.weapon.melee.shortsword.desc=Une épée assez courte, à peine plus longue qu'une dague.
library.items.weapon.melee.sword.desc=Une épée bien équilibrée. Pas trop grande, mais nettement plus longue qu'une épée courte.
library.items.weapon.melee.warhammer.desc=Peu de créatures peuvent résister au coup écrasant de cette imposante masse de plomb et d'acier, mais il faut une grande force pour l'utiliser efficacement.
library.items.weapon.missiles.javelin.desc=Ces javelots sont équilibrés pour voler la pointe en avant.
