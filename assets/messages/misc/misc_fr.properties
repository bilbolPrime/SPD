challenges.champion_enemies=Champions hostiles
challenges.champion_enemies_desc=Tu n'es pas le seul à pouvoir progresser !\n\nLes ennemis ordinaires ont 1/8 de chances d'apparaître avec un buff de champion spécial à l'étage 1, et 1/6 à l'étage 21.\n\n- Les champions se réveillent s'ils sont endormis\n- Le héros sait quand un champion apparaît\n- Les champions ne peuvent pas être transformés en alliés\n\nIl existe six types de champions ennemis :\nflamboyant (orange) : +25% de dégâts en mêlée, s'enflamme en touchant, répand des flammes en mourant, ne peut pas enflammer les tuiles d'eau\nprojection (violet) : +25% de dégâts au corps à corps, +3 portée au corps à corps\nantimagie (vert):_ -50% de dégâts subis, immunisé contre les effets magiques\ngéant (bleu):_ -80% de dégâts, +1 portée en mêlée, ne peut pas se déplacer dans les tunnels\nbéni (jaune):_ 4x précision et évasion\ncroissance (rouge):_ +20% de précision, d'évasion, de dégâts et de PV effectifs. Augmente de 1% tous les 4 tours.
challenges.darkness=Dans l'obscurité
challenges.darkness_desc=C'est un donjon après tout !\n\n- La distance visible régulière est considérablement réduite\n- Une torche apparaît à chaque étage\n- Les autres sources de lumière sont 1/5 aussi efficaces
challenges.no_armor=La foi est mon armure
challenges.no_armor_desc=Vous devrez avoir confiance en vous, car votre armure ne servira pas à grand-chose !\n\n- Réduction du pouvoir de blocage de base pour toutes les armures, à l'exception du tissu\n- Toutes les armures gagnent désormais très peu de blocage lorsqu'elles sont améliorées\n- La puissance défensive du Gardien de terre est également réduite de manière significative
challenges.no_food=Sur l'alimentation
challenges.no_food_desc=La nourriture est déjà rare, mais il faut aussi faire attention aux portions !\n\n- La nourriture et la corne d'abondance sont trois fois moins efficaces pour satisfaire la faim\n- Les autres sources de satiété ne sont pas affectées
challenges.no_healing=Pharmacophobie
challenges.no_healing_desc=Les potions de guérison sont très utiles, mais tu es malheureusement allergique !\n\n- Les potions de soins, les objets qui utilisent des potions de soins dans leur recette et les fruits du soleil empoisonneront le héros au lieu de le soigner\n- Les brassins instables ne peuvent pas empoisonner ou soigner le héros de façon aléatoire\n- Ces objets fonctionnent toujours normalement pour les autres personnages.
challenges.no_herbalism=Terre stérile
challenges.no_herbalism_desc=Il semble qu'il n'y ait plus d'eau propre dans ce maudit donjon...\n\n- Les gouttes de rosée sont supprimées\n- Les plantes ont disparu\n- Les graines apparaissent encore, mais ne prennent pas racine
challenges.no_scrolls=Runes interdites
challenges.no_scrolls_desc=Une certaine rune est plus difficile à trouver. Malheureusement, c'est toujours la plus utile.\n\n- La moitié des parchemins d'amélioration du donjon ont été supprimés
challenges.stronger_bosses=Des patrons plus méchants
challenges.stronger_bosses_desc=Les boss sont beaucoup plus coriaces avec ce défi !\n\nles boss sont plus forts que les autres, mais ils sont plus forts que les autres\nla guérison dans l'eau s'accélère, jusqu'à 3/tour\nles pompes s'activent en 1 tour au lieu de 2\n_Tengu:_ +25% de santé\nphase 1 : les pièges sont beaucoup plus mortels\n_-_ Phase 2 : les capacités sont plus fréquentes\n_DM-300:_ +33% de santé\n_-_ Les pylônes sont plus résistants et 3 s'activent\nles capacités sont plus puissantes et plus fréquentes\n_-_ DM-300 est plus rapide lorsqu'il est surchargé\nles fils exposés sont deux fois plus fréquents\nroi nain : +50% de santé\nles serviteurs sont plus forts dans toutes les phases\nphase 1 : capacités et invocations plus rapides\nphase 2 : 2 serviteurs de plus par round\nphase 3 : 2 fois plus de santé, invocations plus rapides\nle Yog-Dzewa:________________\ndeux poings sont invoqués à la fois !\n_-_ +60% de dégâts laser\nles serviteurs sont plus forts
challenges.swarm_intelligence=L'intelligence en essaim
challenges.swarm_intelligence_desc=Attention, les monstres du donjon sont de plus en plus intelligents !\n\n- Lorsqu'un ennemi vous remarque, les ennemis voisins sont attirés vers cet endroit
