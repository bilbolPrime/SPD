challenges.champion_enemies=Fientliga mästare
challenges.champion_enemies_desc=Du är inte den enda som kan gå upp i nivå!\n\nVanliga fiender har 1/8 chans att spawna med en speciell mästarbuff på våning 1, och skalas upp till 1/6 på våning 21.\n\n- Mästare vaknar om de spawnar sovande\n- Hjälten vet när en mästare spawnar\n- Mästare kan inte förvandlas till allierade\n\nDet finns sex typer av mästarfiender:\n_Blazing (orange):_ +25 % närstridsskada, antänds vid träff, sprider lågor vid död, kan inte antända vattenplattor\n_Projecting (lila):_ +25 % närstridsskada, +3 närstridsavstånd\n_Antimagic (grön):_ -50 % skada tagen, immun mot magi effekter\n_Jätte (blå):_ -80 % skada tagen, +1 närstridsavstånd, kan inte röra sig in i tunnlar\n_Välsignad (gul):_ 4x noggrannhet och undvikande attack\n_Växande (röd):_ +20 % noggrannhet, undvikande attack, skada och effektiv HP. Ökar med 1 % var fjärde tur.
challenges.darkness=In i mörkret
challenges.darkness_desc=Det är trots allt en fängelsehåla! \n\n- Vanligt synligt avstånd minskat dramatiskt \n- En fackla visas på varje våning \n- Andra ljuskällor är 1/5 så effektiva
challenges.no_armor=Tron är min rustning
challenges.no_armor_desc=Du behöver tro på dig själv, eftersom din rustning inte kommer att göra mycket!\n\n- Basblockeringskraften minskas för all rustning utom tyg\n- All rustning får nu väldigt lite blockering vid uppgradering\n- Jordväktarens defensiva kraft minskas också avsevärt
challenges.no_food=På diet
challenges.no_food_desc=Mat är redan en bristvara, men du måste också se upp med dina portioner! \n\n- Mat och överflödshornet är en tredjedel så effektiva på att stilla hunger \n- Andra mättnadskällor påverkas inte.
challenges.no_healing=Farmakofobi
challenges.no_healing_desc=Läkande trolldrycker är verkligen praktiska, tyvärr är du allergisk!\n\n- Läkande trolldrycker, föremål som använder läkande trolldrycker i sitt recept och solros kommer att förgifta hjälten istället för att läka dem\n- Instabila brygder kan inte slumpmässigt förgifta eller läka hjälten\n- Dessa föremål fungerar fortfarande normalt för andra karaktärer.
challenges.no_herbalism=Karg mark
challenges.no_herbalism_desc=Det verkar inte finnas något rent vatten kvar i denna förbannade fängelsehåla...\n\n- Daggdroppar tas bort\n- Växter tas bort\n- Fröna dyker fortfarande upp, men slår inte rot.
challenges.no_scrolls=Förbjudna runor
challenges.no_scrolls_desc=En viss runa är svårare att hitta. Tyvärr är det alltid den mest användbara. \n\n - Hälften av fängelsehålans uppgraderingsrullar tas bort.
challenges.stronger_bosses=Ännu värre chefer
challenges.stronger_bosses_desc=Bossar är mycket tuffare med den här utmaningen!\n\n_Goo:_ +20% hälsa\n_-_ Läkning i vatten ökar, till 3/tur\n_-_ Pumpas upp på 1 tur istället för 2\n_Tengu:_ +25% hälsa\n_-_ Fas 1: fällor är mycket dödligare\n_-_ Fas 2: förmågor är mer frekventa\n_DM-300:_ +33% hälsa\n_-_ Pyloner är tuffare och 3 aktiveras\n_-_ Förmågor är kraftfullare och mer frekventa\n_-_ DM-300 är snabbare när den är superladdad\n_-_ Exponerade kablar är dubbelt så common\n_Dvärgkungen:_ +50% hälsa\n_-_ Minioner är starkare i alla faser\n_-_ Fas 1: snabbare förmågor och kallelser\n_-_ Fas 2: 2 fler minioner per runda\n_-_ Fas 3: 2x hälsa, snabbare kallelser\n_Yog-Dzewa:_\n_-_ Två nävar kallas åt gången!\n_-_ +60% laserskada\n_-_ Starkare minioner
challenges.swarm_intelligence=Svärmintelligens
challenges.swarm_intelligence_desc=Se upp, fängelsehålemonstren blir smartare! \n\n – När en fiende lägger märke till dig dras fiender i närheten till den platsen.
