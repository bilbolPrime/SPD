challenges.champion_enemies=Juara yang bermusuhan
challenges.champion_enemies_desc=Bukan hanya kamu yang bisa naik level!\n\nMusuh biasa memiliki peluang 1/8 untuk muncul dengan buff champion spesial di lantai 1, meningkat menjadi 1/6 di lantai 21.\n\n- Champion bangun jika mereka muncul dalam keadaan tidur\n- Sang pahlawan tahu kapan seorang champion muncul\n- Champion tidak dapat diubah menjadi sekutu\n\nAda enam jenis musuh champion:\n_Blazing (oranye):_ +25% damage jarak dekat, menyala saat terkena serangan, menyebarkan api saat mati, tidak dapat menyalakan ubin air\n_Projecting (ungu):_ +25% damage jarak dekat, +3 jangkauan jarak dekat\n_Antimagic (hijau):_ -50% damage yang diterima, kebal terhadap sihir efek\n_Giant (biru):_ -80% kerusakan yang diterima, +1 jangkauan jarak dekat, tidak dapat bergerak ke dalam terowongan\n_Blessed (kuning):_ 4x akurasi dan penghindaran\n_Growing (merah):_ +20% akurasi, penghindaran, kerusakan, dan HP efektif. Meningkat sebesar 1% setiap 4 putaran.
challenges.darkness=Menuju kegelapan
challenges.darkness_desc=Ini kan penjara bawah tanah!\n\n- Jarak pandang normal berkurang drastis\n- Obor muncul di setiap lantai\n- Sumber cahaya lain hanya 1/5 efektif
challenges.no_armor=Iman adalah perisaiku
challenges.no_armor_desc=Kamu perlu percaya pada diri sendiri, karena baju zirahmu tidak akan banyak membantu!\n\n- Kekuatan blokir dasar dikurangi untuk semua baju zirah kecuali kain\n- Semua baju zirah sekarang mendapatkan sedikit sekali kemampuan blokir saat ditingkatkan\n- Kekuatan pertahanan penjaga bumi juga berkurang secara signifikan
challenges.no_food=Sedang diet
challenges.no_food_desc=Makanan sudah langka, tetapi Anda juga harus memperhatikan porsi makan Anda!\n\n- Makanan dan tanduk kelimpahan hanya sepertiga efektif dalam memuaskan rasa lapar\n- Sumber rasa kenyang lainnya tidak terpengaruh
challenges.no_healing=Farmakofobia
challenges.no_healing_desc=Ramuan penyembuhan memang sangat berguna, sayangnya kamu alergi!\n\n- Ramuan penyembuhan, item yang menggunakan ramuan penyembuhan dalam resepnya, dan buah matahari akan meracuni sang pahlawan alih-alih menyembuhkannya\n- Ramuan tidak stabil tidak dapat secara acak meracuni atau menyembuhkan sang pahlawan\n- Item-item ini masih berfungsi normal untuk karakter lain.
challenges.no_herbalism=Tanah tandus
challenges.no_herbalism_desc=Sepertinya tidak ada air bersih yang tersisa di penjara bawah tanah terkutuk ini...\n\n- Tetesan embun dihilangkan\n- Tanaman dihilangkan\n- Benih masih muncul, tetapi tidak akan berakar
challenges.no_scrolls=Rune terlarang
challenges.no_scrolls_desc=Rune tertentu lebih sulit ditemukan. Sayangnya, rune itu selalu yang paling berguna.\n\n- Setengah dari gulungan peningkatan ruang bawah tanah telah dihapus
challenges.stronger_bosses=Bos yang lebih jahat
challenges.stronger_bosses_desc=Bos jauh lebih tangguh dengan tantangan ini!\n\n_Goo:_ +20% kesehatan\n_-_ Penyembuhan di air meningkat, menjadi 3/giliran\n_-_ Mengisi daya dalam 1 giliran alih-alih 2\n_Tengu:_ +25% kesehatan\n_-_ Fase 1: jebakan jauh lebih mematikan\n_-_ Fase 2: kemampuan lebih sering\n_DM-300:_ +33% kesehatan\n_-_ Pylon lebih kuat dan 3 aktif\n_-_ Kemampuan lebih kuat dan lebih sering\n_-_ DM-300 lebih cepat saat diisi daya super\n_-_ Kabel yang terbuka dua kali lebih common\n_Raja Kurcaci:_ +50% kesehatan\n_-_ Minion lebih kuat di semua fase\n_-_ Fase 1: kemampuan dan pemanggilan lebih cepat\n_-_ Fase 2: 2 minion lebih banyak per putaran\n_-_ Fase 3: 2x kesehatan, pemanggilan lebih cepat\n_Yog-Dzewa:_\n_-_ Dua kepalan tangan dipanggil sekaligus!\n_-_ +60% kerusakan laser\n_-_ Minion lebih kuat
challenges.swarm_intelligence=Kecerdasan kawanan
challenges.swarm_intelligence_desc=Hati-hati, monster-monster di ruang bawah tanah semakin pintar!\n\n- Saat musuh memperhatikanmu, musuh-musuh di dekatnya akan tertarik ke lokasi tersebut.
