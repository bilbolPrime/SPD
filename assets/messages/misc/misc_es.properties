library.items.wands.wandofmagicmissile.desc=Lanza energía mágica pura que causa daño moderado a una criatura.
library.items.wands.wandofregrowth.desc=Hace crecer hierba en su trayectoria y vegetación en el impacto.
library.class_armor_stats=La protección y la fuerza necesaria dependen de la armadura original.
