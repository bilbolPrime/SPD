library.items.necroblade.desc=Forjada con magia oscura, esta hoja devora las almas de sus víctimas y se vuelve más poderosa.\n\nA nivel 5, la hoja completamente cargada puede lanzar _Proyectil oscuro_, que puede destruir la esencia de un objetivo y convertirlo en un sirviente.
library.items.soulblade.desc=Esta espada obtiene su poder del alma de su portador.\n\n_Nivel 3: recupera 20 de salud por 20 de maná_\n\n_Nivel 5: elimina maldiciones por 50 de maná_\n\n_Nivel 7: gasta todo el maná para dañar a los enemigos; mínimo 50 de maná_
library.items.wands.wandofdisintegration.desc=Un rayo destructivo atraviesa criaturas. Cuantas más alcanza, más daño recibe cada una.
