challenges.champion_enemies=campeones hostiles
challenges.champion_enemies_desc=¡No eres el único que puede subir de nivel!\n\nLos enemigos normales tienen una probabilidad de 1/8 de aparecer con una mejora especial de campeón en el piso 1, que aumenta a 1/6 en el piso 21.\n\n- Los campeones se despiertan si aparecen dormidos\n- El héroe sabe cuándo aparece un campeón\n- Los campeones no se pueden convertir en aliados\n\nHay seis tipos de enemigos campeones:\n_Llameante (naranja):_ +25% de daño cuerpo a cuerpo, se incendia al golpear, propaga llamas al morir, no puede incendiar casillas de agua\n_Proyector (púrpura):_ +25% de daño cuerpo a cuerpo, +3 de alcance cuerpo a cuerpo\n_Antimagia (verde):_ -50% de daño recibido, inmune a efectos mágicos\n_Gigante (azul): -80% de daño recibido, +1 de alcance cuerpo a cuerpo, no puede moverse dentro de túneles\n_Bendecido (amarillo): 4x de precisión y evasión\n_Crecimiento (rojo): +20% de precisión, evasión, daño y HP efectivo. Aumenta un 1% cada 4 turnos.
challenges.darkness=Hacia la oscuridad
challenges.darkness_desc=¡Al fin y al cabo es una mazmorra!\n\n- La distancia de visibilidad normal se reduce drásticamente\n- Aparece una antorcha en cada piso\n- Otras fuentes de luz son 1/5 de efectivas
challenges.no_armor=La fe es mi armadura
challenges.no_armor_desc=Necesitarás tener fe en ti mismo, ¡ya que tu armadura no hará mucho!\n\n- El poder de bloqueo base se reduce para todas las armaduras excepto las de tela\n- Todas las armaduras ahora obtienen muy poco bloqueo al mejorarse\n- El poder defensivo del guardián de la tierra también se reduce significativamente
challenges.no_food=A dieta
challenges.no_food_desc=La comida ya escasea, ¡pero también tienes que controlar las porciones!\n\n- La comida y el cuerno de la abundancia son un tercio tan efectivos para satisfacer el hambre\n- Otras fuentes de saciedad no se ven afectadas
challenges.no_healing=Farmacofobia
challenges.no_healing_desc=Las pociones curativas son muy útiles, ¡desafortunadamente eres alérgico!\n\n- Las pociones curativas, los objetos que usan pociones curativas en su receta y la fruta solar envenenarán al héroe en lugar de curarlo\n- Las pociones inestables no pueden envenenar ni curar al héroe aleatoriamente\n- Estos objetos siguen funcionando normalmente para otros personajes.
challenges.no_herbalism=Tierra estéril
challenges.no_herbalism_desc=Parece que ya no queda agua limpia en esta mazmorra maldita...\n\n- Se eliminan las gotas de rocío\n- Se eliminan las plantas\n- Todavía aparecen semillas, pero no echan raíces
challenges.no_scrolls=Runas prohibidas
challenges.no_scrolls_desc=Una runa en particular es más difícil de encontrar. Desafortunadamente, siempre es la más útil.\n\n- Se eliminan la mitad de los pergaminos de mejora de la mazmorra.
challenges.stronger_bosses=jefes más malos
challenges.stronger_bosses_desc=¡Los jefes son mucho más duros con este desafío!\n\n_Goo:_ +20% de salud\n_-_ La curación en el agua aumenta, a 3/turno\n_-_ Se carga en 1 turno en lugar de 2\n_Tengu:_ +25% de salud\n_-_ Fase 1: las trampas son mucho más letales\n_-_ Fase 2: las habilidades son más frecuentes\n_DM-300:_ +33% de salud\n_-_ Los pilones son más duros y 3 se activan\n_-_ Las habilidades son más poderosas y frecuentes\n_-_ DM-300 es más rápido cuando está supercargado\n_-_ Los cables expuestos son el doble de común\n_Rey Enano:_ +50% de salud\n_-_ Los esbirros son más fuertes en todas las fases\n_-_ Fase 1: habilidades y invocaciones más rápidas\n_-_ Fase 2: 2 esbirros más por ronda\n_-_ Fase 3: 2x de salud, invocaciones más rápidas\n_Yog-Dzewa:_\n_-_ ¡Se invocan dos puños a la vez!\n_-_ +60% de daño láser\n_-_ Esbirros más fuertes
challenges.swarm_intelligence=Inteligencia de enjambre
challenges.swarm_intelligence_desc=¡Cuidado, los monstruos de la mazmorra se están volviendo más inteligentes!\n\n- Cuando un enemigo te detecta, los enemigos cercanos se sienten atraídos hacia esa ubicación.
