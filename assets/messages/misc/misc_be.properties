library.items.soulcrystal.name=напоўнены крышталь душы
library.items.soulcrystal.desc=Крышталь з палонным духам. Кіньце яго, каб паклікаць духа сабе на службу.
library.items.dreamweed.name=насенне соннай травы
library.items.dreamweed.desc=Ад дотыку сонная трава выпускае мігатлівае воблака газу, які выклікае збянтэжанасць.
library.items.bag.desc=Заплечнік для вашых рэчаў.
library.items.armor.huntressarmor.desc=Плашч дазваляе паляўнічай кінуць прывідны клінок у кожнага бачнага ворага. Шкода залежыць ад экіпіраванай зброі блізкага бою.
library.items.armor.magearmor.desc=Мантыя дазваляе магу падпаліць і абезрухоміць усіх бачных ворагаў чарамі расплаўленай зямлі.
library.items.armor.roguearmor.desc=Гэты ўбор дазваляе разбойніку асляпіць ворагаў, якія яго бачаць, дымавой бомбай і адскочыць убок.
library.items.armor.warriorarmor.desc=Браня дазваляе воіну скочыць у выбранае месца і аглушыць суседніх ворагаў пры прызямленні.
library.items.flamebow.desc=Зачараваны лук, стрэлы якога могуць падпаліць цэль.
library.items.frostbow.desc=Зачараваны лук, стрэлы якога могуць замарозіць цэль.
library.items.necroblade.desc=Створаны цёмнай магіяй клінок паглынае душы ахвяр і становіцца мацнейшым.\n\nЗ узроўню 5 цалкам зараджаны клінок можа выпусціць _Цёмны снарад_, здольны знішчыць сутнасць цэлі і ператварыць яе ў слугу.
library.items.soulblade.desc=Гэты клінок чэрпае сілу з душы ўладальніка.\n\n_Узровень 3: аднавіць 20 здароўя за 20 маны_\n\n_Узровень 5: зняць праклёны за 50 маны_\n\n_Узровень 7: выдаткаваць усю ману, каб паразіць ворагаў; трэба прынамсі 50 маны_
library.items.wands.wandofdisintegration.desc=Разбуральны прамень пранізвае істот. Чым больш цэляў ён закране, тым больш шкоды атрымае кожная.
library.items.wands.wandoflightning.desc=Электрычныя разрады паражаюць некалькіх істот, якія стаяць побач.
library.items.wands.wandofmagicmissile.desc=Выпускае чыстую магічную энергію, якая наносіць умераную шкоду адной істоце.
library.items.wands.wandofregrowth.desc=Вырошчвае траву ўздоўж праменя і густыя расліны ў месцы трапляння.
library.class_armor_stats=Абарона і патрэбная сіла залежаць ад зыходнай брані.
library.bow_stats=Памнажае шкоду стрэл на _%.2f_. Базавая шкода залежыць ад стралы.
library.strength=Патрэбна _%d сілы_.
library.weapon_stats=Наносіць _%1$d-%2$d шкоды_ і патрабуе _%3$d сілы_.
library.ring_level=Узровень пярсцёнка: _%+d_.
library.ring_accuracy=Множнік трапнасці: _%1$.2f_. Змяняе навык атакі, а не непасрэдна шанец трапляння.
library.ring_evasion=Множнік ухілення: _%1$.2f_. Змяняе навык абароны, а не непасрэдна шанец ухілення.
library.ring_haste=Множнік працягласці дзеянняў: _%1$.2f_. Меншае значэнне паскарае дзеянні.
library.ring_shadows=Утойлівасць: _%+d_.
library.ring_mending=Без навыкаў рэгенерацыі аднаўляе _1 здароўя кожныя %1$.2f хады_, пакуль вы параненыя і не галадаеце.
library.ring_satiety=Дадае _%d голаду_ за крок голаду замест 10. Частата гэтых крокаў таксама залежыць ад класа і часовых эфектаў.
library.ring_power=Сіла жазлоў: _%+d_. Кожнае жазло выкарыстоўвае бонус па-свойму.
library.ring_detection=Радыус пошуку: _%d клетак_. Адмоўныя ўзроўні таксама зніжаюць шанец знайсці сакрэты.
library.ring_elements=Шанец супраціву стыхіям: _%1$.1f%%_. Працягласць адпаведных шкодных эфектаў памнажаецца на _%2$.2f_.
library.ring_herbalism=Вытоптаная трава дае насенне з шанцам _%1$.1f%%_ і расу з шанцам _%2$.1f%%_, калі паверх і выпрабаванні гэта дазваляюць.
library.ring_haggler=Удвая зніжае цэны пакупкі ад 2 залатых, з акругленнем уніз.
library.ring_thorns=Вяртае выпадковую шкоду ад нуля да шкоды ўваходнай атакі, да яе паглынання бранёй.
library.gun_modifiers=Балансаванне на хуткасць і зачараванні не ўплываюць на стрэлы з агнястрэльнай зброі.
library.items.weapon.melee.battleaxe.desc=Велізарная сталёвая галоўка гэтай баявой сякеры надае значную вагу кожнаму шырокаму ўдару.
library.items.weapon.melee.dagger.desc=Просты жалезны кінжал з паношанай драўлянай ручкай.
library.items.weapon.melee.glaive.desc=Масіўная дрэўкавая зброя, якая складаецца з ляза мяча на канцы дрэўка.
