library.quest.ghost_rose.name=Згубленая ружа
library.quest.ghost_rose.desc=Знайдзіце засохлую ружу, скрадзеную ў сумнага прывіда, і вярніце яе яму.
library.quest.ghost_rat.name=Смярдзючы пацук
library.quest.ghost_rat.desc=Забіце смярдзючага пацука, які загубіў сумнага прывіда, і прынясіце яму яго чэрап.
library.quest.ghost_curse.name=Праклён прывіда
library.quest.ghost_curse.desc=Вызваліце сумнага прывіда, перамогшы праклён, які яго трымае.
library.quest.wandmaker_berry.name=Насенне гнілі
library.quest.wandmaker_berry.desc=Знайдзіце гніль ў турме і прынясіце яе насенне майстру жазлоў.
library.quest.wandmaker_dust.name=Трупны пыл
library.quest.wandmaker_dust.desc=Абшукайце кучы костак у турме і прынясіце трупны пыл майстру жазлоў.
library.quest.wandmaker_fish.name=Прывідная рыба
library.quest.wandmaker_fish.desc=Пашукайце прывідную рыбу ў вадзе турмы і прынясіце яе майстру жазлоў.
library.quest.blacksmith_gold.name=Цёмнае золата
library.quest.blacksmith_gold.desc=Здабудзьце 15 кавалкаў цёмнага золата і вярніце іх кавалю разам з кіркай.
library.quest.blacksmith_blood.name=Кроў кажана
library.quest.blacksmith_blood.desc=Забіце кажана кіркай каваля, а потым вярніце яму акрываўлены інструмент.
library.quest.imp_golems.name=Паляванне на големаў
library.quest.imp_golems.desc=Збярыце 6 жэтонаў гномаў з големаў і прынясіце іх чарцяняці.
library.quest.imp_monks.name=Паляванне на манахаў
library.quest.imp_monks.desc=Збярыце 8 жэтонаў гномаў з манахаў і прынясіце іх чарцяняці.
library.quest.ghost.reward=Зброя або даспех на выбар.
library.quest.wandmaker.reward=Адна з дзвюх палепшаных жазлоў на выбар.
library.quest.blacksmith.reward=Адна перакоўка: аб'яднайце два прадметы аднаго тыпу, каб палепшыць лепшы з іх.
library.quest.imp.reward=Палепшаны, але пракляты пярсцёнак. Чарцяня таксама адкрые краму перад Заламі дэманаў.
