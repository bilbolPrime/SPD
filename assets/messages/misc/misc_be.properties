rebornchallenges.blood_magic=Магія крыві
rebornchallenges.blood_magic_desc=Актыўныя ўменні таксама расходуюць здароўе ў памеры кошту маны. Нельга выкарыстаць уменне, калі гэты кошт цябе заб’е.
rebornchallenges.oathbound=Звязаны клятвай
rebornchallenges.oathbound_desc=Рыштунак нельга зняць, пакуль бос рэгіёна не пераможаны. Пустое месца можна запоўніць адзін раз. Паляпшаць і зачароўваць рыштунак па-ранейшаму можна.
rebornchallenges.bound=Гэты рыштунак нельга зняць, пакуль бос рэгіёна не пераможаны.
