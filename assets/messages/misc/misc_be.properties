challenges.champion_enemies=Варожыя чэмпіёны
challenges.champion_enemies_desc=Ты не адзіны, хто можа павышаць узровень!\n\nЗвычайныя ворагі маюць шанец з'явіцца з 1/8 шанцу са спецыяльным бафам чэмпіёна на 1 паверсе, які павялічваецца да 1/6 на 21 паверсе.\n\n - Чэмпіёны прачынаюцца, калі з'яўляюцца ў сне.\n - Герой ведае, калі з'яўляецца чэмпіён.\n - Чэмпіёнаў нельга ператварыць у саюзнікаў.\n\nЁсць шэсць тыпаў ворагаў-чэмпіёнаў:\n_Палымяны (аранжавы):_ +25% да шкоды ў блізкім бою, запальваецца пры ўдары, распаўсюджвае полымя пры смерці, не можа падпаліць водныя пліткі.\n_Выкідваючы (фіялетавы):_ +25% да шкоды ў блізкім бою, +3 да далёкасці блізкага бою.\n_Антымагічны (зялёны):_ -50% да атрыманай шкоды, неўспрымальны да магіі. эфекты\n_Волат (сіні):_ -80% атрыманай шкоды, +1 да далёкасці блізкага бою, не можа перамяшчацца ў тунэлі\n_Дабраславёны (жоўты):_ 4x дакладнасць і ўхіленне\n_Рост (чырвоны):_ +20% дакладнасці, ухілення, шкоды і эфектыўнага здароўя. Павялічваецца на 1% кожныя 4 хады.
challenges.darkness=У цемру
challenges.darkness_desc=Гэта ж падзямелле!\n\n - Звычайная бачная адлегласць значна зніжана.\n - На кожным паверсе з'яўляецца паходня.\n - Іншыя крыніцы святла ў 5 разоў эфектыўныя.
challenges.no_armor=Вера — мая браня
challenges.no_armor_desc=Вам спатрэбіцца вера ў сябе, бо вашы даспехі мала што зробяць! \n\n - Базавая блакіруючая здольнасць зніжана для ўсіх даспехаў, акрамя тканевых. \n - Уся браня цяпер атрымлівае вельмі мала блакіруючай здольнасці пры паляпшэнні. \n - Абарончая здольнасць землянога апекуна таксама значна зніжана.
challenges.no_food=На дыеце
challenges.no_food_desc=Ежы і так мала, але трэба сачыць і за порцыямі!\n\n - Ежа і рог багацця на траціну гэтак жа эфектыўныя ў задавальненні голаду.\n - Іншыя крыніцы сытасці не закранаюцца.
challenges.no_healing=Фармакафобія
challenges.no_healing_desc=Зеллі лячэння сапраўды карысныя, на жаль, у цябе алергія! \n\n — Зеллі лячэння, прадметы, якія выкарыстоўваюць зеллі лячэння ў сваім рэцэпце, і сонечныя фрукты будуць атручаць героя замест таго, каб лячыць яго. \n — Нестабільныя напоі не могуць выпадковым чынам атруціць або вылечыць героя. \n — Гэтыя прадметы ўсё яшчэ працуюць нармальна для іншых персанажаў.
challenges.no_herbalism=Бясплодная зямля
challenges.no_herbalism_desc=Здаецца, у гэтым праклятым падзямеллі не засталося чыстай вады...\n\n - Кроплі расы выдалены\n - Расліны выдалены\n - Насенне ўсё яшчэ з'яўляецца, але не пускае карані
challenges.no_scrolls=Забароненыя руны
challenges.no_scrolls_desc=Пэўную руну знайсці цяжэй. На жаль, яна заўсёды самая карысная.\n\n — Палова скруткаў паляпшэння падзямелля выдалена.
challenges.stronger_bosses=Больш кепскія босы
challenges.stronger_bosses_desc=Босы значна мацнейшыя ў гэтым выпрабаванні!\n\n_Goo:_ +20% здароўя\n_-_ Лячэнне ў вадзе павялічваецца да 3/ход\n_-_ Павялічваецца за 1 ход замест 2\n_Tengu:_ +25% здароўя\n_-_ Фаза 1: пасткі значна смяротнейшыя\n_-_ Фаза 2: здольнасці часцей\n_DM-300:_ +33% здароўя\n_-_ Пілоны мацнейшыя, і 3 актывуюцца\n_-_ Здольнасці мацнейшыя і часцейшыя\n_-_ DM-300 хутчэйшы пры суперзарадцы\n_-_ Аголеныя правады ўдвая больш common\n_Кароль гномаў:_ +50% здароўя\n_-_ Міньёны мацнейшыя ва ўсіх фазах\n_-_ Фаза 1: хутчэйшыя здольнасці і выклік\n_-_ Фаза 2: на 2 міньёны больш за раўнд\n_-_ Фаза 3: у 2 разы больш здароўя, хутчэйшы выклік\n_Ёг-Дзева:_\n_-_ Адначасова выклікаюцца два кулакі!\n_-_ +60% лазернай шкоды\n_-_ Мацнейшыя міньёны
challenges.swarm_intelligence=Роевы інтэлект
challenges.swarm_intelligence_desc=Сцеражыцеся, монстры падзямелля становяцца разумнейшымі!\n\n - Калі вораг заўважае вас, бліжэйшыя ворагі прыцягваюцца да гэтага месца.
