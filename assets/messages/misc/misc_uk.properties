challenges.champion_enemies_desc=Ти не єдиний, хто може підвищити рівень!\n\nЗвичайні вороги мають шанс 1/8 з'явитися зі спеціальним бафом чемпіона на 1 поверсі, який збільшується до 1/6 на 21 поверсі.\n\n - Чемпіони прокидаються, якщо вони з'являються сплячими.\n - Герой знає, коли з'являється чемпіон.\n - Чемпіонів не можна перетворити на союзників.\n\nІснує шість типів ворогів-чемпіонів:\n_Палаючий (помаранчевий):_ +25% шкоди в ближньому бою, запалюється при ударі, поширює полум'я після смерті, не може запалити водні плитки.\n_Проекційний (фіолетовий):_ +25% шкоди в ближньому бою, +3 дальність ближнього бою.\n_Антимагічний (зелений):_ -50% отриманої шкоди, імунітет до магії. ефекти\n_Велетень (синій):_ -80% отриманої шкоди, +1 до дальності ближнього бою, не може переміщатися в тунелі\n_Благословенний (жовтий):_ 4x точність та ухилення\n_Зростаючий (червоний):_ +20% до точності, ухилення, шкоди та ефективного здоров'я. Збільшується на 1% кожні 4 ходи.
challenges.darkness=У темряву
challenges.darkness_desc=Це ж підземелля!\n\n – Звичайна видима відстань значно зменшена.\n – На кожному поверсі з'являється смолоскип.\n – Інші джерела світла мають вдвічі меншу ефективність.
challenges.no_armor=Віра — моя броня
challenges.no_armor_desc=Тобі знадобиться віра в себе, оскільки твоя броня мало що зробить! \n\n - Базова сила блокування зменшена для всієї броні, крім тканинної. \n - Уся броня тепер отримує дуже мало блокування після покращення. \n - Захисна сила земляного охоронця також значно зменшена.
challenges.no_food=На дієті
challenges.no_food_desc=Їжі й так мало, але й за порціями треба стежити!\n\n – Їжа та ріг достатку втричі менш ефективні для втамування голоду.\n – Інші джерела ситості не зазнають змін.
challenges.no_healing=Фармакофобія
challenges.no_healing_desc=Цілющі зілля справді корисні, на жаль, у тебе алергія! \n\n – Зілля зцілення, предмети, що використовують зілля зцілення в рецепті, та сонячні фрукти отруять героя замість того, щоб лікувати його. \n – Нестабільні зілля не можуть випадковим чином отруїти або зцілити героя. \n – Ці предмети все ще працюють нормально для інших персонажів.
challenges.no_herbalism=Безплідна земля
challenges.no_herbalism_desc=Здається, у цьому проклятому підземеллі не залишилося чистої води...\n\n – Краплі роси видалені\n – Рослини видалені\n – Насіння все ще з'являється, але не вкорінюється
challenges.no_scrolls=Заборонені руни
challenges.no_scrolls_desc=Певну руну важче знайти. На жаль, вона завжди найкорисніша. \n\n – Половину сувоїв покращення підземелля видалено.
challenges.stronger_bosses=Ще гірші боси
challenges.stronger_bosses_desc=Боси набагато сильніші в цьому випробуванні!\n\n_Goo:_ +20% здоров'я\n_-_ Зцілення у воді посилюється до 3/хід\n_-_ Підвищує ефективність за 1 хід замість 2\n_Tengu:_ +25% здоров'я\n_-_ Фаза 1: пастки набагато смертоносніші\n_-_ Фаза 2: здібності частіші\n_DM-300:_ +33% здоров'я\n_-_ Пілони міцніші, і 3 активуються\n_-_ Здібності потужніші та частіші\n_-_ DM-300 швидший при наддуві\n_-_ Оголені дроти вдвічі сильніші common\n_Король гномів:_ +50% здоров'я\n_-_ Міньйони сильніші у всіх фазах\n_-_ Фаза 1: швидші здібності та виклики\n_-_ Фаза 2: на 2 міньйона більше за раунд\n_-_ Фаза 3: 2x здоров'я, швидший виклик\n_Йог-Дзева:_\n_-_ Викликаються два кулаки одночасно!\n_-_ +60% лазерної шкоди\n_-_ Сильніші міньйони
challenges.swarm_intelligence=Ройовий інтелект
challenges.swarm_intelligence_desc=Обережно, монстри підземелля стають розумнішими!\n\n - Коли ворог помічає вас, вороги поблизу притягуються до цього місця.
