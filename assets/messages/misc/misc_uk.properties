library.quest.ghost_rose.name=Загублена троянда
library.quest.ghost_rose.desc=Знайдіть засохлу троянду, вкрадену в сумного привида, і поверніть її йому.
library.quest.ghost_rat.name=Смердючий щур
library.quest.ghost_rat.desc=Убийте смердючого щура, що вбив сумного привида, і принесіть йому його череп.
library.quest.ghost_curse.name=Прокляття привида
library.quest.ghost_curse.desc=Звільніть сумного привида, здолавши прокляття, яке його тримає.
library.quest.wandmaker_berry.name=Насінина гнилі
library.quest.wandmaker_berry.desc=Знайдіть гниль у в'язниці та принесіть її насінину майстрові жезлів.
library.quest.wandmaker_dust.name=Трупний пил
library.quest.wandmaker_dust.desc=Обшукайте купи кісток у в'язниці та принесіть трупний пил майстрові жезлів.
library.quest.wandmaker_fish.name=Фантомна риба
library.quest.wandmaker_fish.desc=Пошукайте фантомну рибу у воді в'язниці та принесіть її майстрові жезлів.
library.quest.blacksmith_gold.name=Темне золото
library.quest.blacksmith_gold.desc=Добудьте 15 шматків темного золота й поверніть їх ковалеві разом із кайлом.
library.quest.blacksmith_blood.name=Кров кажана
library.quest.blacksmith_blood.desc=Убийте кажана кайлом коваля, а тоді поверніть закривавлений інструмент.
library.quest.imp_golems.name=Полювання на големів
library.quest.imp_golems.desc=Зберіть 6 жетонів гномів з големів і принесіть їх бісеняті.
library.quest.imp_monks.name=Полювання на ченців
library.quest.imp_monks.desc=Зберіть 8 жетонів гномів з ченців і принесіть їх бісеняті.
library.quest.ghost.reward=Зброя або обладунок на вибір.
library.quest.wandmaker.reward=Один із двох поліпшених жезлів на вибір.
library.quest.blacksmith.reward=Одне перековування: об'єднайте два предмети одного типу, щоб поліпшити кращий із них.
library.quest.imp.reward=Поліпшений, але проклятий перстень. Бісеня також відкриє крамницю перед Залами демонів.
