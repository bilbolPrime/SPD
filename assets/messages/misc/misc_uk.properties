library.items.soulcrystal.name=наповнений кристал душі
library.items.soulcrystal.desc=Кристал із полоненим духом. Киньте його, щоб прикликати духа собі на службу.
library.items.dreamweed.name=насіння сонної трави
library.items.dreamweed.desc=Від дотику сонна трава випускає мерехтливу хмару газу, що викликає спантеличення.
library.items.bag.desc=Рюкзак для ваших речей.
library.items.armor.huntressarmor.desc=Плащ дозволяє мисливиці кинути примарний клинок у кожного видимого ворога. Шкода залежить від спорядженої зброї ближнього бою.
library.items.armor.magearmor.desc=Мантія дозволяє магу підпалити та знерухомити всіх видимих ворогів закляттям розплавленої землі.
library.items.armor.roguearmor.desc=Цей одяг дозволяє розбійнику засліпити ворогів, які його бачать, димовою бомбою та відстрибнути вбік.
library.items.armor.warriorarmor.desc=Броня дозволяє воїну стрибнути у вибране місце й приголомшити сусідніх ворогів під час приземлення.
library.items.flamebow.desc=Зачарований лук, стріли якого можуть підпалити ціль.
library.items.frostbow.desc=Зачарований лук, стріли якого можуть заморозити ціль.
library.items.necroblade.desc=Створений темною магією клинок поглинає душі жертв і стає сильнішим.\n\nЗ рівня 5 повністю заряджений клинок може випустити _Темний снаряд_, здатний знищити сутність цілі та перетворити її на слугу.
library.items.soulblade.desc=Цей клинок черпає силу з душі власника.\n\n_Рівень 3: відновити 20 здоров'я за 20 мани_\n\n_Рівень 5: зняти прокляття за 50 мани_\n\n_Рівень 7: витратити всю ману, щоб уразити ворогів; потрібно щонайменше 50 мани_
library.items.wands.wandofdisintegration.desc=Руйнівний промінь пронизує істот. Що більше цілей він зачепить, то більше шкоди отримає кожна.
library.items.wands.wandoflightning.desc=Електричні розряди вражають кількох істот, що стоять поруч.
library.items.wands.wandofmagicmissile.desc=Випускає чисту магічну енергію, що завдає помірної шкоди одній істоті.
library.items.wands.wandofregrowth.desc=Вирощує траву вздовж променя й густу рослинність у місці влучання. Маги та некроманти можуть створити випадкову насінину за 40 мани Благословенням природи.
library.class_armor_stats=Захист і потрібна сила залежать від початкової броні.
library.bow_stats=Множить шкоду стріл на _%.2f_. Базова шкода залежить від стріли.
library.strength=Потрібно _%d сили_.
library.weapon_stats=Завдає _%1$d-%2$d шкоди_ й потребує _%3$d сили_.
library.ring_level=Рівень персня: _%+d_.
library.ring_accuracy=Множник точності: _%1$.2f_. Змінює навичку атаки, а не безпосередньо шанс влучання.
library.ring_evasion=Множник ухилення: _%1$.2f_. Змінює навичку захисту, а не безпосередньо шанс ухилення.
library.ring_haste=Множник тривалості дій: _%1$.2f_. Менше значення пришвидшує дії.
library.ring_shadows=Скритність: _%+d_.
library.ring_mending=Без навичок регенерації відновлює _1 здоров'я кожні %1$.2f ходи_, поки ви поранені й не голодуєте.
library.ring_satiety=Додає _%d голоду_ за крок голоду замість 10. Частота цих кроків також залежить від класу й тимчасових ефектів.
library.ring_power=Сила жезлів: _%+d_. Кожен жезл використовує бонус по-своєму.
library.ring_detection=Радіус пошуку: _%d клітинок_. Від'ємні рівні також знижують шанс знайти секрети.
library.ring_elements=Шанс опору стихіям: _%1$.1f%%_. Тривалість відповідних шкідливих ефектів множиться на _%2$.2f_.
library.ring_herbalism=Витоптана трава дає насінину з шансом _%1$.1f%%_ і росу з шансом _%2$.1f%%_, якщо поверх і випробування це дозволяють.
library.ring_haggler=Удвічі знижує ціни купівлі від 2 золотих, з округленням донизу.
library.ring_thorns=Повертає випадкову шкоду від нуля до шкоди вхідної атаки, до її поглинання бронею.
library.gun_modifiers=Балансування на швидкість і зачарування не впливають на постріли.
library.items.weapon.melee.battleaxe.desc=Величезна сталева головка цієї бойової сокири надає значної ваги кожному широкому удару.
library.items.weapon.melee.dagger.desc=Простий залізний кинджал із зношеною дерев'яною ручкою.
library.items.weapon.melee.glaive.desc=Масивна древкова зброя, що складається з леза меча на кінці древка.
library.items.weapon.melee.longsword.desc=Довге, гостре, як бритва, сталеве лезо цього меча заспокійливо блищить, хоча його розмір робить його досить важким.
library.items.weapon.melee.mace.desc=Велика залізна головка цієї зброї завдає значної шкоди.
library.items.weapon.melee.shortsword.desc=Досить короткий меч, лише на кілька дюймів довший за кинджал.
library.items.weapon.melee.sword.desc=Добре збалансований меч. Не надто великий, але все ж помітно довший за короткий меч.
library.items.weapon.melee.warhammer.desc=Мало які істоти можуть витримати нищівний удар цієї величної маси свинцю та сталі, але для ефективного використання потрібна величезна сила.
library.items.weapon.missiles.javelin.desc=Ці метальні списи збалансовані так, щоб летіти вістрям уперед.
