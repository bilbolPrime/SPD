ui.itemdropcards.stairs_up=Веде на поверх вище.
ui.itemdropcards.stairs_down=Веде на поверх нижче.
ui.itemdropcards.alchemy=Киньте 3 насінини в казан, щоб зварити зілля.
ui.itemdropcards.storage=Залиште тут припаси на потім.
ui.itemdropcards.barricade=Спаліть її, щоб звільнити шлях.
ui.itemdropcards.sign=Прочитайте напис на табличці.
ui.itemdropcards.trap=Якщо ступити сюди, спрацює пастка.
