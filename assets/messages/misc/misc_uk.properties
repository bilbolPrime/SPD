badges$badge.know_it_all.desc=Відкрийте всі знання, зокрема рецепти, завдання, ефекти спорядження та здобич кожної істоти

rebornchallenges.blood_magic=Магія крові
rebornchallenges.blood_magic_desc=Активні вміння також витрачають здоров’я в розмірі витрат мани. Не можна використати вміння, якщо ця ціна тебе вб’є.
rebornchallenges.oathbound=Зв’язаний клятвою
rebornchallenges.oathbound_desc=Спорядження не можна зняти, доки боса регіону не переможено. Кожну порожню комірку можна заповнити один раз. Поліпшувати й зачаровувати спорядження можна й надалі.
rebornchallenges.bound=Це спорядження не можна зняти, доки боса регіону не переможено.
