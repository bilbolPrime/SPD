library.quest.wandmaker.reward=Один из двух улучшенных жезлов на выбор.
library.quest.blacksmith.reward=Одна перековка: объедините два предмета одного типа, чтобы улучшить лучший из них.
library.quest.imp.reward=Улучшенное, но проклятое кольцо. Бес также откроет магазин перед Залами демонов.
