challenges.champion_enemies=Враждебные чемпионы
challenges.champion_enemies_desc=Вы не единственный, кто может повышать уровень! \n\nОбычные враги имеют шанс 1/8 появиться со специальным баффом чемпиона на 1-м этаже, увеличиваясь до 1/6 на 21-м этаже.\n\n- Чемпионы просыпаются, если появляются спящими.\n- Герой знает, когда появляется чемпион.\n- Чемпионов нельзя превратить в союзников.\n\nСуществует шесть типов врагов-чемпионов:\n_Пылающий (оранжевый):_ +25% урона в ближнем бою, поджигает при попадании, распространяет пламя при смерти, не может поджечь водные клетки.\n_Проецирующий (фиолетовый):_ +25% урона в ближнем бою, +3 к дальности ближнего боя.\n_Антимагический (зеленый): -50% получаемого урона, иммунитет к магическим эффектам. (синий): -80% получаемого урона, +1 к дальности ближнего боя, не может перемещаться в туннели. (желтый): 4-кратное увеличение точности и уклонения. (красный): +20% к точности, уклонению, урону и эффективному HP. Увеличивается на 1% каждые 4 хода.
challenges.darkness=В темноту
challenges.darkness_desc=Это же подземелье! \n\n - Обычное расстояние видимости значительно уменьшено. \n - На каждом этаже появляется факел. \n - Другие источники света в 5 раз менее эффективны.
challenges.no_armor=Вера — моя броня.
challenges.no_armor_desc=Вам понадобится вера в себя, так как ваша броня мало что сможет сделать! \n\n - Базовая блокирующая способность снижена для всей брони, кроме тканевой. \n - Вся броня теперь получает очень мало блокирующей способности при улучшении. \n - Защитная способность Земляного Стража также значительно снижена.
challenges.no_food=На диете
challenges.no_food_desc=Еды и так мало, но нужно ещё и следить за размером порций! Еда и рог изобилия втрое менее эффективны для утоления голода. Другие источники насыщения остаются неизменными.
challenges.no_healing=Фармакофобия
challenges.no_healing_desc=Лечебные зелья, конечно, очень полезны, но, к сожалению, у вас аллергия! \n\n- Лечебные зелья, предметы, в рецепте которых используются лечебные зелья, и солнечные фрукты отравят героя вместо того, чтобы вылечить его. \n- Нестабильные зелья не могут случайным образом отравить или вылечить героя. \n- Эти предметы по-прежнему работают нормально для других персонажей.
challenges.no_herbalism=Бесплодная земля
challenges.no_herbalism_desc=Похоже, в этом проклятом подземелье не осталось чистой воды...\n\n- Капли росы удалены\n- Растения удалены\n- Семена все еще появляются, но не пускают корней
challenges.no_scrolls=Запретные руны
challenges.no_scrolls_desc=Одну руну найти сложнее. К сожалению, она всегда оказывается самой полезной. \n\n - Половина свитков улучшения подземелья удалена.
challenges.stronger_bosses=Худшие боссы
challenges.stronger_bosses_desc=Боссы стали намного сложнее в этом испытании! \n\n_Goo:_ +20% здоровья\n_-_ Лечение в воде увеличивается до 3 раз за ход\n_-_ Накачивает за 1 ход вместо 2\n_Tengu:_ +25% здоровья\n_-_ Фаза 1: ловушки стали намного опаснее\n_-_ Фаза 2: способности стали чаще\n_DM-300:_ +33% здоровья\n_-_ Опоры стали прочнее и активируются 3 раза\n_-_ Способности стали мощнее и чаще\n_-_ DM-300 быстрее в режиме суперзаряда\n_-_ Открытые провода В два раза чаще встречается \n_Король гномов:_ +50% здоровья \n_-_ Миньоны сильнее на всех фазах \n_-_ Фаза 1: более быстрые способности и призывы \n_-_ Фаза 2: на 2 миньона больше за раунд \n_-_ Фаза 3: в 2 раза больше здоровья, более быстрые призывы \n_Йог-Дзева:_\n_-_ Одновременно призываются два кулака! \n_-_ +60% урона от лазера \n_-_ Более сильные миньоны
challenges.swarm_intelligence=Роевой интеллект
challenges.swarm_intelligence_desc=Осторожно, монстры в подземелье становятся умнее! \n\n - Когда враг замечает вас, находящиеся поблизости враги притягиваются к этому месту.
