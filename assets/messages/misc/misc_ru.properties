library.quest.wandmaker_berry.name=Семя гнилой ягоды
library.quest.wandmaker_berry.desc=Найдите гнилую ягоду в тюрьме и принесите её семя мастеру жезлов.
library.quest.wandmaker_dust.name=Трупная пыль
library.quest.wandmaker_dust.desc=Обыщите груды костей в тюрьме и принесите трупную пыль мастеру жезлов.
library.quest.wandmaker_fish.name=Призрачная рыба
library.quest.wandmaker_fish.desc=Поищите призрачную рыбу в воде тюрьмы и принесите её мастеру жезлов.
library.quest.blacksmith_gold.name=Тёмное золото
library.quest.blacksmith_gold.desc=Добудьте 15 кусков тёмного золота и верните их кузнецу вместе с киркой.
library.quest.blacksmith_blood.name=Кровь летучей мыши
library.quest.blacksmith_blood.desc=Убейте летучую мышь киркой кузнеца, затем верните ему окровавленный инструмент.
library.quest.imp_golems.name=Охота на големов
