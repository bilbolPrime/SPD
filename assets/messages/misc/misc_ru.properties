library.items.soulcrystal.name=наполненный кристалл души
library.items.soulcrystal.desc=Кристалл с пленённым духом. Бросьте его, чтобы призвать духа себе на службу.
library.items.dreamweed.name=семя сонной травы
library.items.dreamweed.desc=При касании сонная трава выпускает мерцающее облако газа, вызывающего замешательство.
library.items.bag.desc=Рюкзак для ваших вещей.
library.items.armor.huntressarmor.desc=Плащ позволяет охотнице метнуть призрачный клинок в каждого видимого врага. Урон зависит от надетого оружия ближнего боя.
library.items.armor.magearmor.desc=Мантия позволяет магу поджечь и обездвижить всех видимых врагов заклинанием расплавленной земли.
library.items.armor.roguearmor.desc=Одеяние позволяет разбойнику ослепить видящих его врагов дымовой бомбой и отпрыгнуть в сторону.
library.items.armor.warriorarmor.desc=Броня позволяет воину прыгнуть в выбранное место и оглушить соседних врагов при приземлении.
library.items.flamebow.desc=Зачарованный лук, стрелы которого могут поджечь цель.
library.items.frostbow.desc=Зачарованный лук, стрелы которого могут заморозить цель.
library.items.necroblade.desc=Клинок, созданный тёмной магией. Поглощает души своих жертв и становится сильнее.\n\nС уровня 5 полностью заряженный клинок может выпустить _Тёмный снаряд_, способный разрушить сущность цели и превратить её в слугу.
library.items.soulblade.desc=Этот клинок черпает силу из души владельца.\n\n_Уровень 3: восстановить 20 здоровья за 20 маны_\n\n_Уровень 5: снять проклятия за 50 маны_\n\n_Уровень 7: потратить всю ману, чтобы поразить врагов; нужно не менее 50 маны_
library.items.wands.wandofdisintegration.desc=Разрушительный луч пронизывает существ. Чем больше целей он заденет, тем больше урона получит каждая.
library.items.wands.wandoflightning.desc=Электрические разряды поражают нескольких существ, стоящих рядом.
library.items.wands.wandofmagicmissile.desc=Выпускает чистую магическую энергию, наносящую умеренный урон одному существу.
library.items.wands.wandofregrowth.desc=Выращивает траву вдоль луча и густую растительность в месте попадания.
library.class_armor_stats=Защита и требуемая сила зависят от исходной брони.
library.bow_stats=Умножает урон стрел на _%.2f_. Базовый урон зависит от стрелы.
library.strength=Требуется _%d силы_.
library.weapon_stats=Наносит _%1$d-%2$d урона_ и требует _%3$d силы_.
library.ring_level=Уровень кольца: _%+d_.
library.ring_accuracy=Множитель точности: _%1$.2f_. Меняет навык атаки, а не шанс попадания напрямую.
library.ring_evasion=Множитель уклонения: _%1$.2f_. Меняет навык защиты, а не шанс уклонения напрямую.
library.ring_haste=Множитель времени действий: _%1$.2f_. Меньшее значение ускоряет действия.
library.ring_shadows=Скрытность: _%+d_.
library.ring_mending=Без навыков регенерации восстанавливает _1 здоровье каждые %1$.2f хода_, пока вы ранены и не голодаете.
library.ring_satiety=Прибавляет _%d голода_ за шаг голода вместо 10. Частота этих шагов также зависит от класса и временных эффектов.
library.ring_power=Сила жезлов: _%+d_. Каждый жезл использует бонус по-своему.
library.ring_detection=Радиус поиска: _%d клеток_. Отрицательные уровни также снижают шанс обнаружить секреты.
library.ring_elements=Шанс сопротивления стихиям: _%1$.1f%%_. Длительность затрагиваемых вредных эффектов умножается на _%2$.2f_.
library.ring_herbalism=Вытоптанная трава даёт семя с шансом _%1$.1f%%_ и росу с шансом _%2$.1f%%_, если этаж и испытания это позволяют.
library.ring_haggler=Вдвое снижает цены покупки от 2 золотых, с округлением вниз.
library.ring_thorns=Возвращает случайный урон от нуля до урона входящей атаки, до его поглощения бронёй.
library.gun_modifiers=Балансировка на скорость и зачарования не влияют на выстрелы.
library.items.weapon.melee.battleaxe.desc=Огромная стальная головка этого боевого топора придает значительный вес каждому широкому удару.
library.items.weapon.melee.dagger.desc=Простой железный кинжал с изношенной деревянной рукоятью.
library.items.weapon.melee.glaive.desc=Массивное древковое оружие, представляющее собой клинок меча на конце шеста.
library.items.weapon.melee.longsword.desc=Длинное, острое как бритва стальное лезвие этого меча внушает доверие своим блеском, хотя из-за своих размеров он довольно тяжелый.
library.items.weapon.melee.mace.desc=Большой железный наконечник этого оружия наносит существенный урон.
library.items.weapon.melee.shortsword.desc=Довольно короткий меч, всего на несколько дюймов длиннее кинжала.
library.items.weapon.melee.sword.desc=Меч с хорошим балансом. Не слишком большой, но всё же заметно длиннее короткого меча.
library.items.weapon.melee.warhammer.desc=Немногие существа способны выдержать сокрушительный удар этой огромной массы свинца и стали, но для эффективного применения требуется огромная сила.
library.items.weapon.missiles.javelin.desc=Эти метательные копья сбалансированы так, чтобы лететь остриём вперёд.
