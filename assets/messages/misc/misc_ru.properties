rebornchallenges.blood_magic=Магия крови
rebornchallenges.blood_magic_desc=Активные умения также расходуют здоровье в размере затрат маны. Нельзя использовать умение, если эта цена тебя убьёт.
rebornchallenges.oathbound=Связан клятвой
rebornchallenges.oathbound_desc=Снаряжение нельзя снять, пока босс региона не побеждён. Каждую пустую ячейку можно заполнить один раз. Улучшать и зачаровывать снаряжение по-прежнему можно.
rebornchallenges.bound=Это снаряжение нельзя снять, пока босс региона не побеждён.
