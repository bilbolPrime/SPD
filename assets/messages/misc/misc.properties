library.unknown_quest=You haven't received this quest yet.
library.quest.ghost_rose.name=The lost rose
library.quest.ghost_rose.desc=Find the dried rose stolen from the sad ghost and return it to him.
library.quest.ghost_rat.name=The fetid rat
library.quest.ghost_rat.desc=Bring the sad ghost the skull of the fetid rat that killed him.
library.quest.ghost_curse.name=The ghost's curse
library.quest.ghost_curse.desc=Free the sad ghost by defeating the curse that binds him.
library.quest.wandmaker_berry.name=A rotberry seed
library.quest.wandmaker_berry.desc=Find the rotberry plant in the prison and bring its seed to the wandmaker.
library.quest.wandmaker_dust.name=Corpse dust
library.quest.wandmaker_dust.desc=Search the prison's bone piles for corpse dust and bring it to the wandmaker.
library.quest.wandmaker_fish.name=The phantom fish
library.quest.wandmaker_fish.desc=Search the prison's water for a phantom fish and bring it to the wandmaker.
library.quest.blacksmith_gold.name=Dark gold
library.quest.blacksmith_gold.desc=Mine 15 pieces of dark gold and return them with the pickaxe to the blacksmith.
library.quest.blacksmith_blood.name=Bat blood
library.quest.blacksmith_blood.desc=Kill a bat with the blacksmith's pickaxe, then return the bloodstained tool.
library.quest.imp_golems.name=Golem hunting
library.quest.imp_golems.desc=Collect 6 dwarf tokens from golems and bring them to the imp.
library.quest.imp_monks.name=Monk hunting
library.quest.imp_monks.desc=Collect 8 dwarf tokens from monks and bring them to the imp.
library.quest.ghost.reward=Choose a weapon or a suit of armor.
library.quest.wandmaker.reward=Choose one of two upgraded wands.
library.quest.blacksmith.reward=One reforging: combine two matching items to upgrade the better one.
library.quest.imp.reward=An upgraded, cursed ring. The imp also opens a shop before the Demon Halls.
