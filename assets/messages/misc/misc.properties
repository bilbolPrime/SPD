rebornchallenges.title=Challenges
rebornchallenges.none=None
rebornchallenges.done=Done
rebornchallenges.last_stand=Last Stand
rebornchallenges.last_stand_desc=Below 25% health, non-boss enemies deal 50% more damage. Enraged champions use a skill on every eligible attack.
rebornchallenges.blood_magic=Blood Magic
rebornchallenges.blood_magic_desc=Active skills also cost health equal to their mana cost. You cannot use a skill if this cost would kill you.
rebornchallenges.oathbound=Oathbound
rebornchallenges.oathbound_desc=Equipment stays bound to its slot until the region's boss is defeated. Empty slots can be filled once. You can still upgrade and enchant your gear.
rebornchallenges.unchained=Unchained
rebornchallenges.unchained_desc=Bosses and rival heroes can use their later-stage attacks from the start. Their warnings still give you time to respond.
rebornchallenges.death_throes=Death Throes
rebornchallenges.death_throes_desc=Slain enemies leave armed bombs. After three dungeon turns, they explode with normal bomb damage and range. The blasts do not paralyse you or destroy loot.
rebornchallenges.survival=Survival of the Fittest
rebornchallenges.survival_desc=Ordinary enemies can become champions: 25% in Sewers, 50% in Prison, 75% in Caves and 100% beyond. They gain double health and champion skills, but keep their normal rewards. Bosses are excluded.
rebornchallenges.outnumbered=Outnumbered
rebornchallenges.outnumbered_desc=Regular floors hold twice as many enemies. The additional enemies carry no extra experience or loot.
rebornchallenges.double_trouble=Double Trouble
rebornchallenges.double_trouble_desc=Goo, Tengu, DM-300 and the Dwarf King each fight alongside a rival hero. Defeat both to claim the usual boss rewards and open the exit.
rebornchallenges.point_blank=Point Blank
rebornchallenges.point_blank_desc=Your attacks and offensive skills can only target adjacent cells. Healing, buffs and movement abilities keep their normal range.
rebornchallenges.plain_steel=Plain Steel
rebornchallenges.plain_steel_desc=Weapons and armor have no prefixes, enchantments or glyphs. Their base stats and upgrades remain. Rings, wands and skills still work.
rebornchallenges.bound=This equipment is bound until the region's boss is defeated.
rebornchallenges.too_far=You must get closer.
rebornchallenges.bomb_death=Killed by a death bomb on depth %d
