library.items.soulcrystal.name=filled soul crystal
library.items.soulcrystal.desc=A soul crystal holding a captured spirit. Throw it to summon the spirit into your service.
library.items.necroblade.desc=A blade forged from dark magic. NecroBlades consume the souls of those who perish by them. The more they consume, the stronger they become.\n\nAfter level 7, the Necro Blade unlocks _Dark_ _Bolt_. A projectile of negative energy that can completely shatter a target's essence and replace it with a slave.
library.items.soulblade.desc=A blade that can only be held by the purest of champions. The soul blade is powered by the very soul essence of its wielder.\n\n_Level 3: Recover 20 health for 20 mana_\n\n_Level 5: Dispel any curses for 50 mana_\n\n_Level 7: Channels all spiritual energy into the blade damage all hostiles; at least 50 mana_
library.items.flamebow.desc=A magically imbued bow that has a chance to set targets on fire.
library.items.frostbow.desc=A magically imbued bow that has a chance to freeze targets.
library.items.frostbow.name=ice bow
library.rival_desc=An adventurer who wants all the glory. Rivals can take the place of a boss. Their strength depends on the depth, and they use more skills as their health drops.
library.creatures.enslavedsouls.desc=A spirit bound by dark magic.
library.creatures.ratscout.desc=A poorly fed rodent. It's smaller than a usual rat but still quite loud...
library.items.dreamweed.name=seed of Dreamweed
library.items.dreamweed.desc=Upon touching a Dreamweed it secretes a glittering cloud of confusing gas.
library.creatures.cursepersonification.desc=This creature resembles the sad ghost, but it swirls with darkness. Its face bears an expression of despair.
library.creatures.shadowclone.desc=Shadow clones share your strength and cannot be attacked. \nThey will however disappear after dealing some punishment.
library.creatures.skeletonarcher.desc=Summoned skeleton archers will protect their master mage.
library.creatures.fireelemental.desc=Summoned fire elementals will protect their master mage.
