library.statue_stats=Health, armor, and evasion scale with depth. Damage and accuracy also depend on its weapon.
library.ratbrute_stats=Gains 1 health for every 5 arena levels.
library.swarm_stats=Splitting divides its remaining health between the two swarms.
library.yog_stats=Attacks through spells and summoned creatures. Armor drops to 0 while recovering.
library.rival_stats=Stats increase on deeper boss floors.
library.unknown_item=This item has not been identified yet.
library.unknown_modifier=This effect has not been discovered yet.
library.unknown_creature=This creature has not been discovered yet.
library.unknown_rival_depth=This rival has not been encountered at this depth.
library.summon_stats=Stats depend on the summoning skill and the creature's level.
library.mercenary_stats=Stats depend on the mercenary's level and equipment.
library.mirror_stats=Copies the summoner's accuracy and a damage roll when created.
library.reflection_stats=The duel's stats depend on the hero who challenges it.
library.retainer_stats=Deals 4 extra damage while rallied. Armor drops to 0 while recovering.
library.noncombatant_stats=Does not fight.
library.hero_projectiles=Projectiles per shot: %d. Damage is per projectile. Speed balance and enchantments do not affect fired shots.
library.gun_modifiers=Speed balance and enchantments do not affect fired shots.
library.items.armor.huntressarmor.desc=A huntress in such cloak can create a fan of spectral blades. Each of these blades will target a single enemy in the huntress's field of view, inflicting damage depending on her currently equipped melee weapon.
library.items.armor.magearmor.desc=Wearing this gorgeous robe, a mage can cast a spell of molten earth: all the enemies in his field of view will be set on fire and unable to move at the same time.
library.items.armor.roguearmor.desc=Wearing this dark garb, a rogue can perform a trick, that is called "smoke bomb" (though no real explosives are used): he blinds enemies who could see him and jumps aside.
library.items.armor.warriorarmor.desc=While this armor looks heavy, it allows a warrior to perform heroic leap towards a targeted location, slamming down to stun all neighbouring enemies.
library.items.wands.wandofdisintegration.desc=This wand emits a beam of destructive energy, which pierces all creatures in its way. The more targets it hits, the more damage it inflicts to each of them.
library.items.wands.wandoflightning.desc=This wand conjures forth deadly arcs of electricity, which deal damage to several creatures standing close to each other.
library.items.wands.wandofmagicmissile.desc=This wand launches missiles of pure magical energy, dealing moderate damage to a target creature.
library.items.weapon.melee.battleaxe.desc=The enormous steel head of this battle axe puts considerable heft behind each stroke.
library.items.weapon.melee.dagger.desc=A simple iron dagger with a well worn wooden handle.
library.items.weapon.melee.glaive.desc=A polearm consisting of a sword blade on the end of a pole.
library.items.weapon.melee.longsword.desc=This towering blade inflicts heavy damage by investing its heft into every cut.
library.items.weapon.melee.mace.desc=The iron head of this weapon inflicts substantial damage.
library.items.weapon.melee.shortsword.desc=It is indeed quite short, just a few inches longer, than a dagger.
library.items.weapon.melee.sword.desc=The razor-sharp length of steel blade shines reassuringly.
library.items.weapon.melee.warhammer.desc=Few creatures can withstand the crushing blow of this towering mass of lead and steel, but only the strongest of adventurers can use it effectively.
library.items.weapon.missiles.javelin.desc=This length of metal is weighted to keep the spike at its tip foremost as it sails through the air.
library.actors.mobs.bat.desc=These brisk and tenacious inhabitants of cave domes may defeat much larger opponents by replenishing their health with each successful attack.
library.actors.mobs.fetidrat.desc=This marsupial rat is much larger than a regular one. It is surrounded by a foul cloud.
library.actors.mobs.piranha.desc=These carnivorous fish are not natural inhabitants of underground pools. They were bred specifically to protect flooded treasure vaults.
library.actors.mobs.npcs.blacksmith.desc=This troll blacksmith looks like all trolls look: he is tall and lean, and his skin resembles stone in both color and texture. The troll blacksmith is tinkering with unproportionally small tools.
library.actors.mobs.npcs.impshopkeeper.desc=Imps are lesser demons. They are notable for neither their strength nor their magic talent. But they are quite smart and sociable, and many of imps prefer to live and do business among non-demons.
library.items.wands.wandofregrowth.desc=This wand grows grass along its path and lush vegetation where it lands. Mages and necromancers can spend 40 mana on Nature's Blessing to create a random seed.
library.creatures.ratarcher.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.\n\nThis one seems capable of attacking from distance...
library.creatures.ratbrute.desc=Marsupial rats are aggressive but rather weak denizens of the sewers. They have a nasty bite, but are only life threatening in large numbers.\n\nThis one seems larger than the average rat... tougher as well.
library.wand_charges=Charges: _%d_.
library.enchantment_fire=Blazing
library.enchantment_fire_desc=Can deal extra fire damage and set the target on fire.
library.enchantment_poison=Venomous
library.enchantment_poison_desc=Can poison the target. Upgrades increase the chance and poison duration.
library.enchantment_death=Grim
library.enchantment_death_desc=Can deal damage equal to the target's remaining health.
library.enchantment_paralysis=Stunning
library.enchantment_paralysis_desc=Can briefly paralyze the target. Upgrades increase the chance and possible duration.
library.enchantment_leech=Vampiric
library.enchantment_leech_desc=Can heal the wielder for part of the damage dealt, up to their missing health.
library.enchantment_slow=Chilling
library.enchantment_slow_desc=Can slow the target. Upgrades increase the chance and possible duration.
library.enchantment_shock=Shocking
library.enchantment_shock_desc=Can deal extra lightning damage that spreads to nearby creatures. Grounded creatures in water take double lightning damage.
library.enchantment_instability=Unstable
library.enchantment_instability_desc=Uses a random weapon enchantment on each hit.
library.enchantment_horror=Eldritch
library.enchantment_horror_desc=Can make enemies flee in terror.
library.enchantment_luck=Lucky
library.enchantment_luck_desc=Rerolls damage and deals extra damage if a better result is found. Upgrades add more chances to improve the roll.
library.enchantment_tempering=Tempered
library.enchantment_tempering_desc=Restores one point of weapon durability on each hit, up to its maximum.
library.glyph_bounce=Bounce
library.glyph_bounce_desc=Can push an adjacent attacker one tile away if the tile is clear.
library.glyph_affection=Affection
library.glyph_affection_desc=Can charm both the wearer and an adjacent attacker, preventing them from attacking each other for a time.
library.glyph_anti_entropy=Anti-entropy
library.glyph_anti_entropy_desc=Can freeze an adjacent attacker while setting the wearer on fire.
library.glyph_multiplicity=Multiplicity
library.glyph_multiplicity_desc=Can create a mirror image beside the wearer, at the cost of some health.
library.glyph_potential=Potential
library.glyph_potential_desc=Can strike both the wearer and an adjacent attacker with lightning.
library.glyph_metabolism=Metabolism
library.glyph_metabolism_desc=Can restore health when the wearer is hit, using some hunger. It cannot heal a starving wearer.
library.glyph_stench=Stench
library.glyph_stench_desc=Can release toxic gas around the wearer when struck by an adjacent attacker.
library.glyph_viscosity=Viscosity
library.glyph_viscosity_desc=Can delay incoming damage, dealing it one point at a time over later turns.
library.glyph_displacement=Displacement
library.glyph_displacement_desc=Tries to teleport the wearer to a clear visible tile when hit. It does not work on boss floors.
library.glyph_entanglement=Entanglement
library.glyph_entanglement_desc=Can root the wearer and grant temporary earthen armor when hit.
library.glyph_auto_repair=Auto-repair
library.glyph_auto_repair_desc=Spends gold equal to the armor's tier to restore one durability when hit, if enough gold is available.
library.ring_accuracy=Accuracy multiplier: _%1$.2fx_. This changes attack skill, not a fixed chance to hit.
library.ring_evasion=Evasion multiplier: _%1$.2fx_. This changes defense skill, not a fixed chance to dodge.
library.ring_haste=Action time multiplier: _%1$.2fx_. A lower number means faster actions.
library.ring_shadows=Stealth: _%+d_.
library.ring_mending=Without regeneration skills, restores _1 HP every %1$.2f turns_ while injured and not starving.
library.ring_satiety=Adds _%d hunger_ per hunger tick instead of the usual 10. Hunger ticks also depend on class and temporary effects.
library.ring_power=Wand power: _%+d_. Each wand uses this bonus differently.
library.ring_detection=Search radius with this ring: _%d tiles_. Negative levels also reduce the chance to detect secrets.
library.ring_elements=Elemental resistance chance: _%1$.1f%%_. Supported negative effect durations are multiplied by _%2$.2f_.
library.ring_herbalism=Trampling grass has a _%1$.1f%%_ chance to produce a seed and a _%2$.1f%%_ chance to produce dew, where the floor and challenges allow it.
library.ring_haggler=Halves buying prices of 2 gold or more, rounding down.
library.ring_thorns=Reflects a random amount from zero up to the incoming attack's damage, before armor absorption.
library.wand_zap_damage=Zap damage: _%1$d-%2$d_.
library.wand_zap_base=Before hero skills, rings, and target resistances.
library.wand_zap_fire=Direct damage, before hero skills and rings. Burning deals additional damage over time.
library.wand_zap_lightning=First target on dry ground, before hero skills and rings. Grounded creatures in water take double damage; chained hits can differ.
library.wand_zap_disintegration=When the beam hits one creature, before hero skills and rings. Hitting more creatures increases its damage.
library.wand_zap_avalanche=At the center of the impact, before hero skills and rings. Damage falls with distance from the center.
