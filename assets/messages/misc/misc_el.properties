rebornchallenges.blood_magic=Μαγεία αίματος
rebornchallenges.blood_magic_desc=Οι ενεργές δεξιότητες κοστίζουν και τόση υγεία όση μάνα. Δεν μπορείς να χρησιμοποιήσεις μια δεξιότητα αν αυτό το κόστος θα σε σκότωνε.
rebornchallenges.oathbound=Δεσμευμένος με όρκο
rebornchallenges.oathbound_desc=Ο εξοπλισμός δεν αφαιρείται μέχρι να νικηθεί το αφεντικό της περιοχής. Κάθε κενή θέση μπορεί να γεμίσει μία φορά. Μπορείς ακόμη να αναβαθμίζεις και να μαγεύεις τον εξοπλισμό σου.
rebornchallenges.bound=Αυτός ο εξοπλισμός δεν αφαιρείται μέχρι να νικηθεί το αφεντικό της περιοχής.
