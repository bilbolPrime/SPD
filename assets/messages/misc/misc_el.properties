library.quest.ghost_rat.desc=Σκότωσε τον δύσοσμο αρουραίο που σκότωσε το θλιμμένο φάντασμα και φέρε πίσω το κρανίο του.
library.quest.ghost_curse.name=Η κατάρα του φαντάσματος
library.quest.ghost_curse.desc=Ελευθέρωσε το θλιμμένο φάντασμα νικώντας την κατάρα που το κρατά εδώ.
library.quest.wandmaker_berry.name=Ένας σπόρος ρότμπερι
library.quest.wandmaker_berry.desc=Βρες το ρότμπερι στη φυλακή και πήγαινε τον σπόρο του στον ραβδοποιό.
library.quest.wandmaker_dust.name=Σκόνη πτώματος
library.quest.wandmaker_dust.desc=Ψάξε στους σωρούς οστών της φυλακής για σκόνη πτώματος και πήγαινέ τη στον ραβδοποιό.
library.quest.wandmaker_fish.name=Το ψάρι φάντασμα
library.quest.wandmaker_fish.desc=Ψάξε για ένα ψάρι φάντασμα στα νερά της φυλακής και πήγαινέ το στον ραβδοποιό.
library.quest.blacksmith_gold.name=Σκοτεινός χρυσός
library.quest.blacksmith_gold.desc=Εξόρυξε 15 κομμάτια σκοτεινού χρυσού και επέστρεψέ τα στον σιδερά μαζί με την αξίνα.
library.quest.blacksmith_blood.name=Αίμα νυχτερίδας
library.quest.blacksmith_blood.desc=Σκότωσε μια νυχτερίδα με την αξίνα του σιδερά και επέστρεψέ του το ματωμένο εργαλείο.
library.quest.imp_golems.name=Κυνήγι γκόλεμ
library.quest.imp_golems.desc=Μάζεψε 6 μάρκες νάνων από γκόλεμ και πήγαινέ τες στο δαιμονάκι.
library.quest.imp_monks.name=Κυνήγι μοναχών
library.quest.imp_monks.desc=Μάζεψε 8 μάρκες νάνων από μοναχούς και πήγαινέ τες στο δαιμονάκι.
library.quest.ghost.reward=Διάλεξε ένα όπλο ή μια πανοπλία.
library.quest.wandmaker.reward=Διάλεξε ένα από τα δύο αναβαθμισμένα ραβδιά.
library.quest.blacksmith.reward=Μία επανασφυρηλάτηση: συνδύασε δύο αντικείμενα ίδιου τύπου για να αναβαθμίσεις το καλύτερο.
library.quest.imp.reward=Ένα αναβαθμισμένο αλλά καταραμένο δαχτυλίδι. Το δαιμονάκι ανοίγει επίσης μαγαζί πριν από τις Αίθουσες των Δαιμόνων.
