library.items.soulcrystal.name=γεμάτος κρύσταλλος ψυχής
library.items.soulcrystal.desc=Ένας κρύσταλλος με παγιδευμένο πνεύμα. Ρίξ' τον για να καλέσεις το πνεύμα στην υπηρεσία σου.
library.items.dreamweed.name=σπόρος ονειρόχορτου
library.items.dreamweed.desc=Όταν το αγγίξεις, το ονειρόχορτο απελευθερώνει ένα λαμπερό νέφος αερίου που προκαλεί σύγχυση.
library.items.bag.desc=Ένας σάκος για τα πράγματά σου.
library.items.armor.huntressarmor.desc=Ο μανδύας επιτρέπει στην κυνηγό να στείλει μια φασματική λεπίδα σε κάθε ορατό εχθρό. Η ζημιά εξαρτάται από το εξοπλισμένο όπλο κοντινής μάχης της.
library.items.armor.magearmor.desc=Η ρόμπα επιτρέπει στον μάγο να κάψει και να ακινητοποιήσει όλους τους ορατούς εχθρούς με ένα ξόρκι λιωμένης γης.
library.items.armor.roguearmor.desc=Η στολή επιτρέπει στον κλέφτη να τυφλώσει όσους εχθρούς τον βλέπουν με μια καπνοβόμβα και να πηδήξει στο πλάι.
library.items.armor.warriorarmor.desc=Η πανοπλία επιτρέπει στον πολεμιστή να πηδήξει στο επιλεγμένο σημείο και να ζαλίσει τους διπλανούς εχθρούς κατά την προσγείωση.
library.items.flamebow.desc=Ένα μαγεμένο τόξο του οποίου τα βέλη μπορούν να βάλουν φωτιά στους στόχους.
library.items.frostbow.desc=Ένα μαγεμένο τόξο του οποίου τα βέλη μπορούν να παγώσουν τους στόχους.
library.items.necroblade.desc=Σφυρηλατημένη με σκοτεινή μαγεία, η λεπίδα καταβροχθίζει τις ψυχές των θυμάτων της και δυναμώνει.\n\nΑπό το επίπεδο 5, η πλήρως φορτισμένη λεπίδα μπορεί να ρίξει _Σκοτεινό βλήμα_, που μπορεί να καταστρέψει την ουσία ενός στόχου και να τον κάνει υπηρέτη.
library.items.soulblade.desc=Η λεπίδα αντλεί δύναμη από την ψυχή του κατόχου της.\n\n_Επίπεδο 3: αναπληρώνει 20 ζωή με 20 μάνα_\n\n_Επίπεδο 5: αφαιρεί κατάρες με 50 μάνα_\n\n_Επίπεδο 7: ξοδεύει όλη τη μάνα για να χτυπήσει τους εχθρούς· τουλάχιστον 50 μάνα_
library.items.wands.wandofdisintegration.desc=Μια καταστροφική ακτίνα διαπερνά πλάσματα. Όσο περισσότερα χτυπά, τόσο περισσότερη ζημιά δέχεται το καθένα.
library.items.wands.wandoflightning.desc=Ηλεκτρικά τόξα χτυπούν πολλά πλάσματα που βρίσκονται κοντά μεταξύ τους.
library.items.wands.wandofmagicmissile.desc=Εκτοξεύει καθαρή μαγική ενέργεια που προκαλεί μέτρια ζημιά σε ένα πλάσμα.
library.items.wands.wandofregrowth.desc=Φυτρώνει χόρτο στη διαδρομή του και πυκνή βλάστηση στο σημείο πρόσκρουσης.
library.class_armor_stats=Η προστασία και η απαιτούμενη δύναμη εξαρτώνται από την αρχική πανοπλία.
library.bow_stats=Πολλαπλασιάζει τη ζημιά των βελών επί _%.2f_. Η βασική ζημιά εξαρτάται από το βέλος.
library.strength=Απαιτεί _%d δύναμη_.
library.weapon_stats=Προκαλεί _%1$d-%2$d ζημιά_ και απαιτεί _%3$d δύναμη_.
library.ring_level=Επίπεδο δαχτυλιδιού: _%+d_.
library.ring_accuracy=Πολλαπλασιαστής ακρίβειας: _%1$.2f_. Αλλάζει την ικανότητα επίθεσης, όχι απευθείας την πιθανότητα επιτυχίας.
library.ring_evasion=Πολλαπλασιαστής αποφυγής: _%1$.2f_. Αλλάζει την ικανότητα άμυνας, όχι απευθείας την πιθανότητα αποφυγής.
library.ring_haste=Διάρκεια ενεργειών επί _%1$.2f_. Μικρότερη τιμή σημαίνει ταχύτερες ενέργειες.
library.ring_shadows=Αθόρυβη κίνηση: _%+d_.
library.ring_mending=Χωρίς ικανότητες αναγέννησης, αναπληρώνει _1 ζωή κάθε %1$.2f γύρους_ όταν είσαι τραυματισμένος και δεν λιμοκτονείς.
library.ring_satiety=Προσθέτει _%d πείνα_ σε κάθε αύξηση πείνας αντί για 10. Η συχνότητα εξαρτάται επίσης από την κλάση και τις προσωρινές επιδράσεις.
library.ring_power=Ισχύς ραβδιών: _%+d_. Κάθε ραβδί χρησιμοποιεί το μπόνους διαφορετικά.
library.ring_detection=Ακτίνα αναζήτησης: _%d πλακίδια_. Τα αρνητικά επίπεδα μειώνουν και την πιθανότητα εντοπισμού μυστικών.
library.ring_elements=Πιθανότητα αντίστασης στα στοιχεία: _%1$.1f%%_. Η διάρκεια των σχετικών αρνητικών επιδράσεων πολλαπλασιάζεται επί _%2$.2f_.
