challenges.champion_enemies=Εχθρικοί πρωταθλητές
challenges.champion_enemies_desc=Δεν είσαι ο μόνος που μπορεί να ανέβει επίπεδο!\n\nΟι κανονικοί εχθροί έχουν 1/8 πιθανότητα να εμφανιστούν με μια ειδική ενίσχυση πρωταθλητή στον όροφο 1, η οποία κλιμακώνεται στο 1/6 στον όροφο 21.\n\n- Οι πρωταθλητές ξυπνούν αν εμφανιστούν κοιμισμένοι\n- Ο ήρωας ξέρει πότε εμφανίζεται ένας πρωταθλητής\n- Οι πρωταθλητές δεν μπορούν να μετατραπούν σε συμμάχους\n\nΥπάρχουν έξι τύποι πρωταθλητών εχθρών:\n_Φλεγόμενος (πορτοκαλί):_ +25% ζημιά από σώμα με σώμα, ανάβει με χτύπημα, εξαπλώνει φλόγες σε θάνατο, δεν μπορεί να ανάψει πλακίδια νερού\n_Προεξέχων (μωβ):_ +25% ζημιά από σώμα με σώμα, +3 εμβέλεια από σώμα με σώμα\n_Αντιμαγεία (πράσινο):_ -50% ζημιά που δέχεστε, άτρωτος σε μαγικά αποτελέσματα\n_Giant (μπλε):_ -80% ζημιά που δέχεστε, +1 εμβέλεια μάχης σώμα με σώμα, δεν μπορεί να κινηθεί σε σήραγγες\n_Blessed (κίτρινο):_ 4x ακρίβεια και αποφυγή\n_Growing (κόκκινο):_ +20% ακρίβεια, αποφυγή, ζημιά και αποτελεσματική Ζωή. Αυξάνεται κατά 1% κάθε 4 γύρους.
challenges.darkness=Μέσα στο σκοτάδι
challenges.darkness_desc=Είναι άλλωστε ένα μπουντρούμι! \n\n- Η κανονική ορατή απόσταση μειώνεται δραματικά \n- Ένας φακός εμφανίζεται σε κάθε όροφο \n- Άλλες πηγές φωτός είναι κατά το 1/5 αποτελεσματικές
challenges.no_armor=Η πίστη είναι η πανοπλία μου
challenges.no_armor_desc=Θα χρειαστείς πίστη στον εαυτό σου, καθώς η πανοπλία σου δεν θα κάνει πολλά!\n\n- Η βασική ισχύς αποκλεισμού μειώνεται για όλες τις πανοπλίες εκτός από τις υφασμάτινες.\n- Όλες οι πανοπλίες αποκτούν πλέον πολύ λίγο αποκλεισμό όταν αναβαθμίζονται.\n- Η αμυντική ισχύς του Χωμάτινου Φύλακα μειώνεται επίσης σημαντικά.
challenges.no_food=Σε δίαιτα
challenges.no_food_desc=Το φαγητό είναι ήδη σπάνιο, αλλά πρέπει να προσέχετε και τις μερίδες σας!\n\n- Το φαγητό και η αφθονία είναι κατά το ένα τρίτο λιγότερο αποτελεσματικά στην ικανοποίηση της πείνας\n- Άλλες πηγές κορεσμού δεν επηρεάζονται
challenges.no_healing=Φαρμακοφοβία
challenges.no_healing_desc=Τα θεραπευτικά φίλτρα είναι σίγουρα χρήσιμα, δυστυχώς είσαι αλλεργικός! \n\n- Τα θεραπευτικά φίλτρα, τα αντικείμενα που χρησιμοποιούν θεραπευτικά φίλτρα στη συνταγή τους και τα ηλιέλαιο θα δηλητηριάσουν τον ήρωα αντί να τον θεραπεύσουν. \n- Τα ασταθή παρασκευάσματα δεν μπορούν να δηλητηριάσουν ή να θεραπεύσουν τυχαία τον ήρωα. \n- Αυτά τα αντικείμενα εξακολουθούν να λειτουργούν κανονικά για άλλους χαρακτήρες.
challenges.no_herbalism=Άγονη γη
challenges.no_herbalism_desc=Δεν φαίνεται να έχει μείνει καθόλου καθαρό νερό σε αυτό το καταραμένο μπουντρούμι...\n\n- Οι σταγόνες δροσιάς αφαιρούνται\n- Τα φυτά αφαιρούνται\n- Οι σπόροι εξακολουθούν να εμφανίζονται, αλλά δεν ριζώνουν.
challenges.no_scrolls=Απαγορευμένοι ρούνοι
challenges.no_scrolls_desc=Ένας συγκεκριμένος ρούνος είναι πιο δύσκολο να βρεθεί. Δυστυχώς, είναι πάντα ο πιο χρήσιμος.\n\n- Οι μισοί πάπυροι αναβάθμισης του μπουντρουμιού αφαιρούνται.
challenges.stronger_bosses=Αφεντικά Badder
challenges.stronger_bosses_desc=Οι αρχηγοί είναι πολύ πιο σκληροί με αυτήν την πρόκληση!\n\n_Goo:_ +20% υγεία\n_-_ Η θεραπεία στο νερό αυξάνεται, σε 3/στροφή\n_-_ Ενισχύεται σε 1 γύρο αντί για 2\n_Tengu:_ +25% υγεία\n_-_ Φάση 1: οι παγίδες είναι πολύ πιο θανατηφόρες\n_-_ Φάση 2: οι ικανότητες είναι πιο συχνές\n_DM-300:_ +33% υγεία\n_-_ Οι πυλώνες είναι πιο σκληροί και ενεργοποιούνται 3\n_-_ Οι ικανότητες είναι πιο ισχυρές και συχνές\n_-_ Το DM-300 είναι πιο γρήγορο όταν είναι υπερφορτισμένο\n_-_ Τα εκτεθειμένα καλώδια είναι διπλάσια κοινό\n_Νάνος Βασιλιάς:_ +50% υγεία\n_-_ Οι υπηρέτες είναι πιο δυνατοί σε όλες τις φάσεις\n_-_ Φάση 1: πιο γρήγορες ικανότητες και επικλήσεις\n_-_ Φάση 2: 2 ακόμη υπηρέτες ανά γύρο\n_-_ Φάση 3: 2x υγεία, πιο γρήγορες επικλήσεις\n_Yog-Dzewa:_\n_-_ Δύο γροθιές καλούνται κάθε φορά!\n_-_ +60% ζημιά λέιζερ\n_-_ Δυνατότεροι υπηρέτες
challenges.swarm_intelligence=Νοημοσύνη σμήνους
challenges.swarm_intelligence_desc=Προσοχή, τα τέρατα των μπουντρουμιών γίνονται πιο έξυπνα!\n\n- Όταν ένας εχθρός σε προσέξει, οι κοντινοί εχθροί έλκονται προς αυτήν την τοποθεσία.
