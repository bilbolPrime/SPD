library.items.dreamweed.desc=Ao ser tocada, a erva dos sonhos liberta uma nuvem brilhante de gás que causa confusão.
library.items.bag.desc=Uma mochila para os seus pertences.
library.items.armor.huntressarmor.desc=A capa permite à caçadora lançar uma lâmina espectral a cada inimigo visível. O dano depende da arma corpo a corpo equipada.
library.items.armor.magearmor.desc=A veste permite ao mago queimar e imobilizar todos os inimigos visíveis com um feitiço de terra fundida.
library.items.armor.roguearmor.desc=Este traje permite ao ladino cegar os inimigos que o veem e saltar para o lado com uma bomba de fumo.
library.items.armor.warriorarmor.desc=A armadura permite ao guerreiro saltar para o local escolhido e atordoar os inimigos adjacentes ao aterrar.
library.items.flamebow.desc=Um arco encantado cujas flechas podem incendiar os alvos.
library.items.frostbow.desc=Um arco encantado cujas flechas podem congelar os alvos.
library.items.necroblade.desc=Forjada com magia negra, esta lâmina devora as almas das vítimas e fica mais forte.\n\nNo nível 5, a lâmina totalmente carregada pode lançar _Projétil sombrio_, capaz de destruir a essência de um alvo e transformá-lo em servo.
library.items.soulblade.desc=Esta lâmina tira o seu poder da alma de quem a empunha.\n\n_Nível 3: recupera 20 de saúde por 20 de mana_\n\n_Nível 5: remove maldições por 50 de mana_\n\n_Nível 7: gasta toda a mana para ferir os inimigos; mínimo de 50 de mana_
library.items.wands.wandofdisintegration.desc=Um raio destrutivo atravessa criaturas. Quanto mais atingir, maior o dano causado a cada uma.
library.items.wands.wandoflightning.desc=Arcos elétricos atingem várias criaturas próximas umas das outras.
library.items.wands.wandofmagicmissile.desc=Lança energia mágica pura que causa dano moderado a uma criatura.
library.items.wands.wandofregrowth.desc=Faz crescer erva no trajeto e vegetação densa no impacto.
library.class_armor_stats=A proteção e a força exigida dependem da armadura original.
library.bow_stats=Multiplica o dano das flechas por _%.2f_. O dano base depende da flecha.
library.strength=Exige _%d de força_.
library.weapon_stats=Causa _%1$d-%2$d de dano_ e exige _%3$d de força_.
library.ring_level=Nível do anel: _%+d_.
library.ring_accuracy=Precisão multiplicada por _%1$.2f_. Altera a habilidade de ataque, não diretamente a probabilidade de acertar.
library.ring_evasion=Evasão multiplicada por _%1$.2f_. Altera a habilidade de defesa, não diretamente a probabilidade de esquivar.
library.ring_haste=Duração das ações multiplicada por _%1$.2f_. Um valor menor permite agir mais depressa.
library.ring_shadows=Furtividade: _%+d_.
library.ring_mending=Sem habilidades de regeneração, recupera _1 de saúde a cada %1$.2f turnos_ enquanto estiver ferido e sem passar fome.
library.ring_satiety=Acrescenta _%d de fome_ por aumento de fome em vez de 10. A frequência também depende da classe e dos efeitos temporários.
library.ring_power=Poder das varinhas: _%+d_. Cada varinha usa este bónus de forma diferente.
library.ring_detection=Raio de busca: _%d casas_. Níveis negativos também reduzem a probabilidade de encontrar segredos.
library.ring_elements=Probabilidade de resistir aos elementos: _%1$.1f%%_. A duração dos efeitos negativos abrangidos é multiplicada por _%2$.2f_.
library.ring_herbalism=Pisar erva tem _%1$.1f%%_ de probabilidade de dar uma semente e _%2$.1f%%_ de dar orvalho, se o andar e os desafios permitirem.
library.ring_haggler=Reduz para metade preços de compra de pelo menos 2 de ouro, arredondando para baixo.
library.ring_thorns=Devolve uma quantidade aleatória entre zero e o dano do ataque recebido, antes da proteção da armadura.
library.gun_modifiers=O equilíbrio de velocidade e os encantamentos não afetam os disparos.
library.items.weapon.melee.battleaxe.desc=A enorme cabeça de aço deste machado de batalha confere um peso considerável a cada golpe largo.
library.items.weapon.melee.dagger.desc=Um punhal de ferro simples com um cabo de madeira gasto.
library.items.weapon.melee.glaive.desc=Uma arma de haste maciça, composta por uma lâmina de espada na extremidade de um cabo.
library.items.weapon.melee.longsword.desc=A longa lâmina de aço afiada desta espada brilha de forma reconfortante, embora o seu tamanho a torne bastante pesada.
library.items.weapon.melee.mace.desc=A grande cabeça de ferro desta arma causa danos consideráveis.
library.items.weapon.melee.shortsword.desc=Uma espada bastante curta, apenas alguns centímetros mais comprida que um punhal.
library.items.weapon.melee.sword.desc=Uma espada bem equilibrada. Não muito grande, mas ainda assim notavelmente mais longa do que uma espada curta.
library.items.weapon.melee.warhammer.desc=Poucas criaturas conseguem resistir ao impacto esmagador desta imponente massa de chumbo e aço, mas é preciso muita força para a utilizar eficazmente.
library.items.weapon.missiles.javelin.desc=Estes dardos são equilibrados para voarem com a ponta para a frente.
