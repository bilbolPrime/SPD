challenges.champion_enemies=Campeões hostis
challenges.champion_enemies_desc=Não é o único que pode subir de nível! ZXQPH0 ZXQ ZXQPH1 ZXQ Os inimigos comuns têm 1/8 de hipóteses de surgir com um bónus especial de campeão no piso 1, aumentando para 1/6 no piso 21. ZXQPH2 ZXQ ZXQPH3 ZXQ - Os campeões acordam se surgirem a dormir ZXQPH4 ZXQ - O herói sabe quando um campeão surge ZXQPH5 ZXQ - Os campeões não podem ser transformados em aliados ZXQPH6 ZXQ ZXQPH7 ZXQ Existem seis tipos de inimigos campeões: ZXQPH8 ZXQ - Flamejante (laranja): +25% de dano corpo a corpo, pega fogo ao atingir, espalha chamas ao morrer, não pode incendiar blocos de água ZXQPH9 ZXQ - Projetando (roxo): +25% de dano corpo a corpo, +3 de alcance corpo a corpo ZXQPH10 ZXQ - Antimágico (verde): -50% Dano recebido, imune a efeitos mágicos\n_Gigante (azul):_ -80% de dano recebido, +1 de alcance corpo a corpo, não se pode mover para túneis\n_Abençoado (amarelo):_ 4x precisão e evasão\n_Crescente (vermelho):_ +20% de precisão, evasão, dano e HP eficaz. Aumenta 1% a cada 4 turnos.
challenges.darkness=Na escuridão
challenges.darkness_desc=Afinal, é uma masmorra! ZXQPH0 ZXQ ZXQPH1 ZXQ - A distância de visibilidade normal é drasticamente reduzida ZXQPH2 ZXQ - Uma tocha aparece em cada piso ZXQPH3 ZXQ - Outras fontes de luz são 1/5 tão eficazes
challenges.no_armor=A fé é a minha armadura.
challenges.no_armor_desc=Terá de ter fé em si mesmo, pois a sua armadura não será muito útil! \n\n - O poder de bloqueio base foi reduzido para todas as armaduras, exceto as de tecido. \n - Todas as armaduras ganham agora muito pouco bloqueio ao serem melhoradas. \n - O poder defensivo do guardião da terra também foi significativamente reduzido.
challenges.no_food=Em dieta
challenges.no_food_desc=A comida já é escassa, mas também é preciso controlar as porções! A comida e a cornucópia são um terço tão eficazes para saciar a fome. Outras fontes de saciedade não são afetadas.
challenges.no_healing=Farmacofobia
challenges.no_healing_desc=As poções de cura são muito úteis, mas infelizmente és alérgico! As poções de cura, os itens que utilizam poções de cura na sua receita e os frutos solares envenenarão o herói em vez de o curar. As poções instáveis não podem envenenar ou curar o herói aleatoriamente. Estes itens ainda funcionam normalmente para outras personagens.
challenges.no_herbalism=Terra árida
challenges.no_herbalism_desc=Parece já não haver água limpa nesta masmorra amaldiçoada... \n\n - As gotas de orvalho foram removidas \n - As plantas foram removidas \n - As sementes ainda aparecem, mas não criam raízes
challenges.no_scrolls=Runas proibidas
challenges.no_scrolls_desc=Certa runa é mais difícil de encontrar. Infelizmente, é sempre a mais útil. Metade dos pergaminhos de melhoramento da masmorra foram removidos.
challenges.stronger_bosses=Chefes piores
challenges.stronger_bosses_desc=Os bosses tornam-se muito mais difíceis com este desafio! ZXQPH0 ZXQ ZXQPH1 ZXQ_Goo:_ +20% de vida ZXQPH2 ZXQ_-_ A cura na água aumenta para 3 por turno ZXQPH3 ZXQ_-_ A cura aumenta em 1 turno em vez de 2 ZXQPH4 ZXQ_Tengu:_ +25% de vida ZXQPH5 ZXQ_-_ Fase 1: as armadilhas são muito mais mortíferas ZXQPH6 ZXQ_-_ Fase 2: as habilidades são mais frequentes ZXQPH7 ZXQ_DM-300:_ +33% de vida ZXQPH8 ZXQ_-_ Os pilares são mais resistentes e activam 3 vezes ZXQPH9 ZXQ_-_ As habilidades são mais poderosas e frequentes ZXQPH10 ZXQ_-_ O DM-300 é mais rápido quando sobrecarregado ZXQPH11 ZXQ_-_ Os fios expostos são duas vezes mais \n_Rei Anão: +50% de vida \n_-_ Lacaios mais fortes em todas as fases \n_-_ Fase 1: habilidades e invocações mais rápidas \n_-_ Fase 2: 2 lacaios adicionais por ronda \n_-_ Fase 3: 2x vida, invocações mais rápidas \n_Yog-Dzewa: \n_-_ Dois punhos são invocados ao mesmo tempo! \n_-_ +60% de dano laser \n_-_ Lacaios mais fortes
challenges.swarm_intelligence=Inteligência de enxame
challenges.swarm_intelligence_desc=Cuidado, os monstros da masmorra estão a ficar mais espertos! \n\n - Quando um inimigo te avista, os inimigos próximos são atraídos para esse local.
