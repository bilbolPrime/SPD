challenges.champion_enemies=Campeões hostis
challenges.champion_enemies_desc=Não é o único que pode ficar mais forte!\n\nOs inimigos comuns têm 1/8 de probabilidade de surgir como campeões no piso 1, aumentando até 1/6 no piso 21.\n\n- Os campeões acordam se surgirem a dormir\n- O herói sabe quando surge um campeão\n- Os campeões não podem tornar-se aliados\n\nExistem seis tipos de campeões:\n_Flamejante (laranja):_ +25% de dano corpo a corpo; incendeia ao atingir e espalha fogo ao morrer; não incendeia água\n_Projetante (roxo):_ +25% de dano corpo a corpo e +3 de alcance\n_Antimágico (verde):_ recebe 50% menos dano e é imune a efeitos mágicos\n_Gigante (azul):_ recebe 80% menos dano, tem +1 de alcance e não entra em túneis\n_Abençoado (amarelo):_ 4x precisão e evasão\n_Crescente (vermelho):_ +20% de precisão, evasão, dano e vida efetiva; aumenta 1% a cada 4 turnos
challenges.darkness=Na escuridão
challenges.darkness_desc=Afinal, é uma masmorra!\n\n- O alcance de visão normal é muito reduzido\n- Aparece uma tocha em cada piso\n- Outras fontes de luz têm apenas 1/5 da eficácia
challenges.no_armor=A fé é a minha armadura.
challenges.no_armor_desc=Terá de ter fé em si mesmo, pois a sua armadura não será muito útil! \n\n - O poder de bloqueio base foi reduzido para todas as armaduras, exceto as de tecido. \n - Todas as armaduras ganham agora muito pouco bloqueio ao serem melhoradas. \n - O poder defensivo do guardião da terra também foi significativamente reduzido.
challenges.no_food=Em dieta
challenges.no_food_desc=A comida já é escassa, mas também é preciso controlar as porções! A comida e a cornucópia são um terço tão eficazes para saciar a fome. Outras fontes de saciedade não são afetadas.
challenges.no_healing=Farmacofobia
challenges.no_healing_desc=As poções de cura são muito úteis, mas infelizmente és alérgico! As poções de cura, os itens que utilizam poções de cura na sua receita e os frutos solares envenenarão o herói em vez de o curar. As poções instáveis não podem envenenar ou curar o herói aleatoriamente. Estes itens ainda funcionam normalmente para outras personagens.
challenges.no_herbalism=Terra árida
challenges.no_herbalism_desc=Parece já não haver água limpa nesta masmorra amaldiçoada... \n\n - As gotas de orvalho foram removidas \n - As plantas foram removidas \n - As sementes ainda aparecem, mas não criam raízes
challenges.no_scrolls=Runas proibidas
challenges.no_scrolls_desc=Certa runa é mais difícil de encontrar. Infelizmente, é sempre a mais útil. Metade dos pergaminhos de melhoramento da masmorra foram removidos.
challenges.stronger_bosses=Chefes piores
challenges.stronger_bosses_desc=Os bosses ficam muito mais fortes neste desafio!\n\n_Goo:_ +20% de vida\n_-_ A cura na água aumenta até 3 por turno\n_-_ Prepara o ataque forte em 1 turno em vez de 2\n_Tengu:_ +25% de vida\n_-_ Fase 1: armadilhas muito mais mortíferas\n_-_ Fase 2: habilidades mais frequentes\n_DM-300:_ +33% de vida\n_-_ Pilares mais resistentes; 3 são ativados\n_-_ Habilidades mais fortes e frequentes\n_-_ Mais rápido quando sobrecarregado\n_-_ O dobro de fios expostos\n_Rei Anão:_ +50% de vida\n_-_ Lacaios mais fortes em todas as fases\n_-_ Fase 1: habilidades e invocações mais rápidas\n_-_ Fase 2: mais 2 lacaios por ronda\n_-_ Fase 3: o dobro da vida e invocações mais rápidas\n_Yog-Dzewa:_\n_-_ Invoca dois punhos de cada vez\n_-_ +60% de dano dos raios\n_-_ Lacaios mais fortes
challenges.swarm_intelligence=Inteligência de enxame
challenges.swarm_intelligence_desc=Cuidado, os monstros da masmorra estão a ficar mais espertos! \n\n - Quando um inimigo te avista, os inimigos próximos são atraídos para esse local.
