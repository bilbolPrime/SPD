library.items.soulcrystal.desc=Un cristallo con uno spirito imprigionato. Lancialo per evocare lo spirito al tuo servizio.
library.items.dreamweed.name=seme di erba dei sogni
library.items.dreamweed.desc=Al contatto, l'erba dei sogni libera una nube scintillante di gas che causa confusione.
library.items.bag.desc=Uno zaino per i tuoi oggetti.
library.items.armor.huntressarmor.desc=Il mantello permette alla cacciatrice di lanciare una lama spettrale contro ogni nemico visibile. I danni dipendono dall'arma da mischia equipaggiata.
library.items.armor.magearmor.desc=La veste permette al mago di bruciare e immobilizzare tutti i nemici visibili con un incantesimo di terra fusa.
library.items.armor.roguearmor.desc=Quest'abito permette al ladro di accecare i nemici che lo vedono e balzare di lato con una bomba fumogena.
library.items.armor.warriorarmor.desc=L'armatura permette al guerriero di saltare nel punto scelto, stordendo i nemici adiacenti all'atterraggio.
library.items.flamebow.desc=Un arco incantato le cui frecce possono incendiare il bersaglio.
library.items.frostbow.desc=Un arco incantato le cui frecce possono congelare il bersaglio.
library.items.necroblade.desc=Forgiata con magia oscura, questa lama divora le anime delle vittime e diventa più forte.\n\nDal livello 5, la lama completamente carica può lanciare _Dardo oscuro_, che può distruggere l'essenza di un bersaglio e asservirlo.
library.items.soulblade.desc=Questa lama trae forza dall'anima di chi la impugna.\n\n_Livello 3: recupera 20 salute per 20 mana_\n\n_Livello 5: rimuove le maledizioni per 50 mana_\n\n_Livello 7: consuma tutto il mana per colpire i nemici; almeno 50 mana_
library.items.wands.wandofdisintegration.desc=Un raggio distruttivo attraversa le creature. Più ne colpisce, più danni infligge a ciascuna.
library.items.wands.wandoflightning.desc=Archi elettrici colpiscono più creature vicine tra loro.
library.items.wands.wandofmagicmissile.desc=Lancia energia magica pura che infligge danni moderati a una creatura.
library.items.wands.wandofregrowth.desc=Fa crescere erba lungo il percorso e vegetazione fitta all'impatto.
library.class_armor_stats=La protezione e la forza richiesta dipendono dall'armatura originale.
library.bow_stats=Moltiplica i danni delle frecce per _%.2f_. I danni di base dipendono dalla freccia.
library.strength=Richiede _%d forza_.
library.weapon_stats=Infligge _%1$d-%2$d danni_ e richiede _%3$d forza_.
library.ring_level=Livello dell'anello: _%+d_.
library.ring_accuracy=Precisione moltiplicata per _%1$.2f_. Modifica l'abilità d'attacco, non direttamente la probabilità di colpire.
library.ring_evasion=Elusione moltiplicata per _%1$.2f_. Modifica l'abilità di difesa, non direttamente la probabilità di schivare.
library.ring_haste=Durata delle azioni moltiplicata per _%1$.2f_. Un valore più basso permette di agire più in fretta.
library.ring_shadows=Furtività: _%+d_.
library.ring_mending=Senza abilità di rigenerazione, recupera _1 salute ogni %1$.2f turni_ se sei ferito e non stai morendo di fame.
library.ring_satiety=Aggiunge _%d fame_ per incremento della fame invece di 10. La frequenza dipende anche dalla classe e dagli effetti temporanei.
library.ring_power=Potenza delle bacchette: _%+d_. Ogni bacchetta usa il bonus in modo diverso.
library.ring_detection=Raggio di ricerca: _%d caselle_. I livelli negativi riducono anche la probabilità di trovare segreti.
library.ring_elements=Probabilità di resistere agli elementi: _%1$.1f%%_. La durata degli effetti negativi interessati è moltiplicata per _%2$.2f_.
library.ring_herbalism=Calpestare l'erba ha il _%1$.1f%%_ di probabilità di dare un seme e il _%2$.1f%%_ di dare rugiada, se il piano e le sfide lo consentono.
library.ring_haggler=Dimezza i prezzi d'acquisto di almeno 2 oro, arrotondando per difetto.
library.ring_thorns=Riflette una quantità casuale tra zero e i danni dell'attacco ricevuto, prima della protezione dell'armatura.
library.gun_modifiers=Il bilanciamento della velocità e gli incantamenti non modificano i colpi sparati.
library.items.weapon.melee.battleaxe.desc=L'enorme testa in acciaio di quest'ascia da battaglia conferisce una notevole forza a ogni ampio colpo.
library.items.weapon.melee.dagger.desc=Un semplice pugnale di ferro con un manico di legno consumato.
library.items.weapon.melee.glaive.desc=Una massiccia arma inastata composta da una lama di spada all'estremità di un'asta.
library.items.weapon.melee.longsword.desc=La lunga lama d'acciaio affilata come un rasoio di questa spada brilla in modo rassicurante, sebbene le sue dimensioni la rendano piuttosto pesante.
library.items.weapon.melee.mace.desc=La grande testa di ferro di quest'arma infligge danni considerevoli.
library.items.weapon.melee.shortsword.desc=Una spada piuttosto corta, solo pochi centimetri più lunga di un pugnale.
library.items.weapon.melee.sword.desc=Una spada ben bilanciata. Non troppo grande, ma comunque notevolmente più lunga di una spada corta.
library.items.weapon.melee.warhammer.desc=Poche creature possono resistere al colpo devastante di questa imponente massa di piombo e acciaio, ma ci vuole una grande forza per usarla efficacemente.
library.items.weapon.missiles.javelin.desc=Questi giavellotti sono bilanciati per volare con la punta in avanti.
