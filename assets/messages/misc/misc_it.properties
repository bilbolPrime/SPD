challenges.champion_enemies=Campioni ostili
challenges.champion_enemies_desc=Non sei l'unico che può salire di livello!\n\nI nemici normali hanno una probabilità di 1/8 di apparire con uno speciale buff da campione al piano 1, che sale a 1/6 al piano 21.\n\n- I campioni si svegliano se appaiono addormentati\n- L'eroe sa quando appare un campione\n- I campioni non possono essere trasformati in alleati\n\nCi sono sei tipi di nemici campioni:\n_Accecante (arancione):_ +25% danni da mischia, si incendia al colpo, diffonde fiamme alla morte, non può incendiare le tessere d'acqua\n_Proiettante (viola):_ +25% danni da mischia, +3 raggio di mischia\n_Antimagia (verde):_ -50% di danni subiti, immune agli effetti magici\n_Gigante (blu):_ -80% di danni subiti, +1 raggio di mischia, non può entrare nei tunnel\n_Benedetto (giallo):_ 4x precisione ed elusione\n_Crescente (rosso):_ +20% precisione, elusione, danni e HP effettivi. Aumenta dell'1% ogni 4 turni.
challenges.darkness=Nell'oscurità
challenges.darkness_desc=Dopotutto è un dungeon!\n\n- La normale distanza di visibilità è drasticamente ridotta\n- Una torcia appare su ogni piano\n- Le altre fonti di luce sono efficaci 1/5
challenges.no_armor=La fede è la mia armatura
challenges.no_armor_desc=Avrai bisogno di fiducia in te stesso, perché la tua armatura non servirà a molto!\n\n- Il potere di blocco di base è stato ridotto per tutte le armature tranne quelle in stoffa\n- Tutte le armature ora ottengono un blocco molto ridotto quando vengono potenziate\n- Anche il potere difensivo del guardiano terrestre è stato significativamente ridotto
challenges.no_food=A dieta
challenges.no_food_desc=Il cibo è già scarso, ma devi anche stare attento alle porzioni!\n\n- Il cibo e il corno dell'abbondanza sono efficaci per un terzo nel soddisfare la fame\n- Altre fonti di sazietà non sono influenzate
challenges.no_healing=Farmacofobia
challenges.no_healing_desc=Le pozioni curative sono davvero utili, sfortunatamente sei allergico!\n\n- Le pozioni curative, gli oggetti che usano pozioni curative nella loro ricetta e il frutto del sole avveleneranno l'eroe invece di curarlo\n- Le pozioni instabili non possono avvelenare o curare casualmente l'eroe\n- Questi oggetti funzionano ancora normalmente per gli altri personaggi.
challenges.no_herbalism=Terra sterile
challenges.no_herbalism_desc=Sembra che non ci sia più acqua pulita in questo maledetto dungeon...\n\n- Le gocce di rugiada vengono rimosse\n- Le piante vengono rimosse\n- I semi appaiono ancora, ma non attecchiranno
challenges.no_scrolls=rune proibite
challenges.no_scrolls_desc=Una certa runa è più difficile da trovare. Sfortunatamente, è sempre la più utile.\n\n- Metà delle pergamene di potenziamento del dungeon sono state rimosse
challenges.stronger_bosses=Capi peggiori
challenges.stronger_bosses_desc=I boss sono molto più difficili con questa sfida!\n\n_Goo:_ +20% salute\n_-_ La guarigione in acqua aumenta, fino a 3/turno\n_-_ Si carica in 1 turno invece di 2\n_Tengu:_ +25% salute\n_-_ Fase 1: le trappole sono molto più letali\n_-_ Fase 2: le abilità sono più frequenti\n_DM-300:_ +33% salute\n_-_ I piloni sono più resistenti e se ne attivano 3\n_-_ Le abilità sono più potenti e frequenti\n_-_ DM-300 è più veloce quando è super carica\n_-_ I fili esposti sono due volte più common\n_Re dei Nani:_ +50% salute\n_-_ I servitori sono più forti in tutte le fasi\n_-_ Fase 1: abilità e evocazioni più veloci\n_-_ Fase 2: 2 servitori in più per round\n_-_ Fase 3: 2x salute, evocazioni più veloci\n_Yog-Dzewa:_\n_-_ Vengono evocati due pugni alla volta!\n_-_ +60% danni laser\n_-_ Servitori più forti
challenges.swarm_intelligence=Intelligenza di sciame
challenges.swarm_intelligence_desc=Attenzione, i mostri del dungeon stanno diventando più intelligenti!\n\n- Quando un nemico ti nota, i nemici vicini vengono attratti in quella posizione
