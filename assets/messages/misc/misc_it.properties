pets.desc_1=Un piccolo compagno di viaggio. I compagni non combattono e non bloccano mai il passaggio.
pets.desc_2=Una pallina di gelatina tranquilla, senza il caratteraccio di Melma. Sconfiggi Melma per ottenere questo compagno.
pets.desc_3=Questo piccolo ninja ti segue senza fare rumore. Sconfiggi Tengu per ottenere questo compagno.
