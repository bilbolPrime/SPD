library.items.soulcrystal.name=充盈的灵魂水晶
library.items.soulcrystal.desc=封存着一个灵魂的水晶。投出后便能召唤这个灵魂为你效力。
library.items.dreamweed.name=梦草种子
library.items.dreamweed.desc=梦草受到触碰时会喷出闪烁的气体，使生物陷入混乱。
library.items.bag.desc=装随身物品的背包。
library.items.armor.huntressarmor.desc=披上这件斗篷后，女猎手能向视野内的每个敌人发射一把幽灵之刃。伤害取决于装备的近战武器。
library.items.armor.magearmor.desc=穿上这件长袍后，法师能用熔地术点燃并定住视野内的所有敌人。
library.items.armor.roguearmor.desc=穿上这件衣服后，盗贼能用烟雾弹致盲看得见自己的敌人，并跳到一旁。
library.items.armor.warriorarmor.desc=穿上这件护甲后，战士能跃向指定地点，落地时击晕相邻的敌人。
library.items.flamebow.desc=一把附魔弓，射出的箭有机会点燃目标。
library.items.frostbow.desc=一把附魔弓，射出的箭有机会冻结目标。
library.items.necroblade.desc=用黑暗魔法锻造的利刃，会吞噬被它杀死的生物的灵魂，逐渐变强。\n\n达到5级且能量蓄满时，可使用_暗影弹_，有机会粉碎目标的本质并将其变为仆从。
library.items.soulblade.desc=这把剑从持有者的灵魂中汲取力量。\n\n_3级：消耗20点法力，恢复20点生命_\n\n_5级：消耗50点法力，解除诅咒_\n\n_7级：消耗全部法力攻击敌人，至少需要50点法力_
library.items.wands.wandofdisintegration.desc=破坏性的光束能穿透生物。命中的目标越多，每个目标受到的伤害就越高。
library.items.wands.wandoflightning.desc=电弧在相距较近的生物之间跳跃，击中多个目标。
library.items.wands.wandofmagicmissile.desc=发射纯粹的魔法能量，对一个生物造成适中的伤害。
library.items.wands.wandofregrowth.desc=沿途长出青草，落点长出茂密植物。法师和死灵法师可用自然祝福消耗40点法力，创造一粒随机种子。
library.class_armor_stats=防御力和力量需求取决于改造前的护甲。
