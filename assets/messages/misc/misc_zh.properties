challenges.champion_enemies=敌对冠军
challenges.champion_enemies_desc=你不是唯一可以升级的人！普通敌人有 1/8 的几率在第一层生成时带有特殊冠军增益效果，到第二十一层时几率提升至 1/6。冠军如果生成时处于睡眠状态，则会醒来。英雄会知道何时生成了冠军。冠军无法转化为盟友。冠军敌人有六种类型：炽焰（橙色）：+25% 近战伤害，击中时点燃，死亡时散播火焰，无法点燃水格。投射（紫色）：+25% 近战伤害，+3 近战范围。反魔法（绿色）： -50%受到的伤害，免疫魔法效果\n_巨人（蓝色）：-80%受到的伤害，+1近战范围，无法进入隧道\n_祝福（黄色）：4倍命中率和闪避率\n_成长（红色）：+20%命中率、闪避率、伤害和有效生命值。每4回合增加1%。
challenges.darkness=陷入黑暗
challenges.darkness_desc=毕竟这是个地牢！\n\n- 常规可视距离大幅缩短\n- 每层都会出现一个火炬\n- 其他光源的效率降低至原来的五分之一
challenges.no_armor=信仰是我的盔甲
challenges.no_armor_desc=你需要对自己有信心，因为你的盔甲作用不大！\n\n- 除布甲外，所有盔甲的基础格挡能力降低\n- 所有盔甲升级后获得的格挡能力提升都非常小\n- 大地守护者的防御能力也大幅降低
challenges.no_food=节食
challenges.no_food_desc=食物本来就稀缺，但你还得注意份量！食物和丰饶之角饱腹的效果只有原来的三分之一。其他饱腹来源不受影响。
challenges.no_healing=药物恐惧症
challenges.no_healing_desc=治疗药水确实很方便，可惜你对它们过敏！\n\n- 治疗药水、配方中使用治疗药水的物品以及太阳果会使英雄中毒而不是治疗他们。\n- 不稳定的药剂不会随机使英雄中毒或治疗。\n- 这些物品对其他角色仍然有效。
challenges.no_herbalism=不毛之地
challenges.no_herbalism_desc=这该死的地牢里似乎已经没有干净的水了……\n\n- 露珠已被移除\n- 植物已被移除\n- 种子仍然出现，但不会发芽
challenges.no_scrolls=禁忌符文
challenges.no_scrolls_desc=某个符文更难找到。不幸的是，它总是最有用的。地牢中一半的升级卷轴被移除。
challenges.stronger_bosses=更糟糕的老板
challenges.stronger_bosses_desc=这次挑战中，Boss 战难度大幅提升！\n\n_Goo：生命值 +20%\n_-_水中治疗量提升至每回合 3 次\n_-_充气时间缩短至 1 回合而非 2 回合\n_Tengu：生命值 +25%\n_-_第一阶段：陷阱威力大幅提升\n_-_第二阶段：技能触发频率更高\n_DM-300：生命值 +33%\n_-_能量塔更坚固，且可激活 3 个\n_-_技能威力更强，触发频率更高\n_-_DM-300 充能后速度更快\n_-_裸露的电线出现频率翻倍\n_矮人王：生命值+50%\n_-_所有阶段小兵更强\n_-_第一阶段：技能和召唤速度更快\n_-_第二阶段：每回合多召唤2个小兵\n_-_第三阶段：生命值翻倍，召唤速度更快\n_尤格-泽瓦：\n_-_一次召唤两个拳头！\n_-_激光伤害+60%\n_-_更强的小兵
challenges.swarm_intelligence=群体智能
