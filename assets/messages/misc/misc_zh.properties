library.ring_mending=不计再生技能，受伤且未饥饿时，每_%1$.2f回合恢复1点生命_。
library.ring_satiety=每次饥饿增长增加_%d点_，而非通常的10点。增长频率还受职业和临时效果影响。
library.ring_power=魔杖威力：_%+d_。每种魔杖利用这项加成的方式不同。
library.ring_detection=搜索半径：_%d格_。负等级还会降低发现秘密的概率。
library.ring_elements=元素抵抗概率：_%1$.1f%%_。适用的负面效果持续时间乘以_%2$.2f_。
library.ring_herbalism=踩草有_%1$.1f%%_概率掉落种子，_%2$.1f%%_概率掉落露水，但仍受楼层和挑战规则限制。
library.ring_haggler=将不低于2金币的买价减半，小数向下取整。
library.ring_thorns=随机反弹伤害，范围从0到本次攻击被护甲减免前的伤害值。
library.gun_modifiers=速度平衡调整和附魔不影响枪弹。
library.items.weapon.melee.battleaxe.desc=这把战斧巨大的钢制斧头，每次挥砍都威力十足。
library.items.weapon.melee.dagger.desc=一把简单的铁匕首，配有磨损的木柄。
library.items.weapon.melee.glaive.desc=一种巨大的长柄武器，由一根杆子末端装上剑刃组成。
library.items.weapon.melee.longsword.desc=这把剑锋利的长钢刃闪闪发光，令人安心，不过它的尺寸也让它相当重。
library.items.weapon.melee.mace.desc=这种武器硕大的铁质头部能造成巨大的伤害。
library.items.weapon.melee.shortsword.desc=这是一把很短的剑，只比匕首长几英寸。
library.items.weapon.melee.sword.desc=这是一把平衡性很好的剑。尺寸适中，但比短剑明显长。
library.items.weapon.melee.warhammer.desc=这柄铅钢铸成的巨锤能砸出沉重的一击，但只有力气足够大的人才能驾驭。
