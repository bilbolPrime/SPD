library.items.soulcrystal.desc=Kryształ z uwięzionym duchem. Rzuć nim, by przywołać ducha do służby.
library.items.dreamweed.name=nasiono sennego ziela
library.items.dreamweed.desc=Dotknięte senne ziele wypuszcza mieniącą się chmurę gazu, która wywołuje dezorientację.
library.items.bag.desc=Plecak na twoje rzeczy.
library.items.armor.huntressarmor.desc=Płaszcz pozwala łowczyni posłać widmowe ostrze w każdego widocznego wroga. Obrażenia zależą od założonej broni do walki wręcz.
library.items.armor.magearmor.desc=Szata pozwala magowi podpalić i unieruchomić wszystkich widocznych wrogów zaklęciem stopionej ziemi.
library.items.armor.roguearmor.desc=Strój pozwala łotrzykowi oślepić widzących go wrogów bombą dymną i odskoczyć na bok.
library.items.armor.warriorarmor.desc=Zbroja pozwala wojownikowi skoczyć w wybrane miejsce i ogłuszyć sąsiednich wrogów przy lądowaniu.
library.items.flamebow.desc=Zaczarowany łuk, którego strzały mogą podpalić cel.
library.items.frostbow.desc=Zaczarowany łuk, którego strzały mogą zamrozić cel.
library.items.necroblade.desc=Ostrze wykute mroczną magią pożera dusze ofiar i rośnie w siłę.\n\nOd poziomu 5 w pełni naładowane ostrze może wystrzelić _Mroczny pocisk_, który może zniszczyć istotę celu i zmienić go w sługę.
library.items.soulblade.desc=To ostrze czerpie siłę z duszy właściciela.\n\n_Poziom 3: odzyskaj 20 zdrowia za 20 many_\n\n_Poziom 5: usuń klątwy za 50 many_\n\n_Poziom 7: zużyj całą manę, by zranić wrogów; co najmniej 50 many_
library.items.wands.wandofdisintegration.desc=Niszczycielski promień przenika stworzenia. Im więcej ich trafi, tym większe obrażenia otrzyma każde z nich.
library.items.wands.wandoflightning.desc=Łuki elektryczne rażą kilka stworzeń stojących blisko siebie.
library.items.wands.wandofmagicmissile.desc=Wystrzeliwuje czystą magiczną energię, zadając umiarkowane obrażenia jednemu stworzeniu.
library.items.wands.wandofregrowth.desc=Tworzy trawę na swojej drodze i gęstą roślinność w miejscu trafienia.
library.class_armor_stats=Ochrona i wymagana siła zależą od pierwotnej zbroi.
library.bow_stats=Mnoży obrażenia strzał przez _%.2f_. Podstawowe obrażenia zależą od strzały.
