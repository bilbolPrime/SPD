library.ring_level=Poziom pierścienia: _%+d_.
library.ring_accuracy=Mnożnik celności: _%1$.2f_. Zmienia umiejętność ataku, a nie bezpośrednio szansę trafienia.
library.ring_evasion=Mnożnik uniku: _%1$.2f_. Zmienia umiejętność obrony, a nie bezpośrednio szansę uniku.
library.ring_haste=Mnożnik czasu działań: _%1$.2f_. Niższa wartość przyspiesza działania.
library.ring_shadows=Skradanie: _%+d_.
library.ring_mending=Bez umiejętności regeneracji przywraca _1 zdrowia co %1$.2f tury_, gdy jesteś ranny i nie głodujesz.
library.ring_satiety=Dodaje _%d głodu_ przy każdym wzroście głodu zamiast 10. Częstotliwość zależy też od klasy i efektów tymczasowych.
library.ring_power=Moc różdżek: _%+d_. Każda różdżka korzysta z tej premii inaczej.
library.ring_detection=Promień przeszukiwania: _%d pól_. Ujemne poziomy zmniejszają także szansę odkrycia sekretów.
library.ring_elements=Szansa odporności na żywioły: _%1$.1f%%_. Czas działania objętych nią negatywnych efektów jest mnożony przez _%2$.2f_.
library.ring_herbalism=Deptanie trawy daje _%1$.1f%%_ szansy na nasiono i _%2$.1f%%_ na rosę, jeśli piętro i wyzwania na to pozwalają.
library.ring_haggler=Obniża o połowę ceny zakupu wynoszące co najmniej 2 złota, zaokrąglając w dół.
library.ring_thorns=Odbija losową ilość obrażeń od zera do obrażeń otrzymanego ataku, przed redukcją przez pancerz.
library.gun_modifiers=Wyważenie zwiększające szybkość i zaklęcia nie wpływają na wystrzały.
library.items.weapon.melee.battleaxe.desc=Ogromna stalowa głowica tego topora bojowego zapewnia znaczną siłę każdemu szerokiemu uderzeniu.
library.items.weapon.melee.dagger.desc=Prosty żelazny sztylet ze zużytą drewnianą rękojeścią.
library.items.weapon.melee.glaive.desc=Ogromna broń drzewcowa składająca się z ostrza miecza umieszczonego na końcu drzewca.
library.items.weapon.melee.longsword.desc=Długie, ostre jak brzytwa stalowe ostrze tego miecza lśni uspokajająco, choć jego rozmiar sprawia, że jest dość ciężki.
