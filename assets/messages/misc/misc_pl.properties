challenges.champion_enemies=Wrodzy mistrzowie
challenges.champion_enemies_desc=Nie jesteś jedynym, który może awansować!\n\nZwykli wrogowie mają 1/8 szansy na pojawienie się ze specjalnym wzmocnieniem bohatera na 1. piętrze, zwiększając się do 1/6 na 21. piętrze.\n\n- Bohaterowie budzą się, jeśli pojawiają się w stanie snu\n- Bohater wie, kiedy pojawia się bohater\n- Bohaterowie nie mogą zostać zamienieni w sojuszników\n\nIstnieje sześć typów wrogich bohaterów:\n_Płonący (pomarańczowy):_ +25% obrażeń w walce wręcz, zapala się przy trafieniu, rozprzestrzenia płomienie po śmierci, nie może podpalić płytek wody\n_Projekcyjny (fioletowy):_ +25% obrażeń w walce wręcz, +3 obrażenia w walce wręcz Zasięg\n_Antimagic (zielony): _ -50% otrzymywanych obrażeń, odporność na efekty magiczne.\n_Giant (niebieski): _ -80% otrzymywanych obrażeń, +1 zasięg walki wręcz, nie można wchodzić do tuneli.\n_Blessed (żółty): _ 4x celność i unik.\n_Growing (czerwony): _ +20% celności, uników, obrażeń i efektywnych punktów zdrowia. Zwiększa się o 1% co 4 tury.
challenges.darkness=W ciemność
challenges.darkness_desc=Przecież to lochy!\n\n- Normalna widoczna odległość została znacznie zmniejszona\n- Na każdym piętrze pojawia się pochodnia\n- Inne źródła światła są o 1/5 mniej skuteczne
challenges.no_armor=Wiara jest moją zbroją
challenges.no_armor_desc=Będziesz potrzebować wiary w siebie, ponieważ twoja zbroja niewiele zdziała!\n\n - Zmniejszono podstawową siłę blokowania dla wszystkich zbroi oprócz materiałowej\n - Wszystkie zbroje po ulepszeniu blokują teraz bardzo mało\n - Obronna siła strażnika Ziemi została również znacznie zmniejszona
challenges.no_food=Na diecie
challenges.no_food_desc=Żywności jest już mało, ale musisz też uważać na porcje!\n\n- Żywność i róg obfitości są w jednej trzeciej tak skuteczne w zaspokajaniu głodu\n- Inne źródła sytości pozostają nienaruszone
challenges.no_healing=Farmakofobia
challenges.no_healing_desc=Mikstury lecznicze są bardzo przydatne, niestety masz na nie alergię!\n\n- Mikstury lecznicze, przedmioty, których receptura zawiera mikstury lecznicze oraz słonecznikowy owoc zatrują bohatera zamiast go leczyć.\n- Niestabilne wywary nie mogą losowo zatruć ani wyleczyć bohatera.\n- Te przedmioty nadal działają normalnie na inne postacie.
challenges.no_herbalism=Jałowa ziemia
challenges.no_herbalism_desc=Wygląda na to, że w tym przeklętym lochu nie ma już czystej wody...\n\n- Krople rosy zostały usunięte\n- Rośliny zostały usunięte\n- Nasiona nadal się pojawiają, ale nie zapuszczają korzeni
challenges.no_scrolls=Zakazane runy
challenges.no_scrolls_desc=Pewną runę trudniej znaleźć. Niestety, zawsze jest najprzydatniejsza. \n\n – Połowa zwojów ulepszeń lochu zostaje usunięta.
challenges.stronger_bosses=Gorsi szefowie
challenges.stronger_bosses_desc=Bossowie są o wiele trudniejsi dzięki temu wyzwaniu!\n\n_Goo:_ +20% zdrowia\n_-_ Leczenie w wodzie przyspiesza, do 3 na turę\n_-_ Pompuje w 1 turę zamiast w 2\n_Tengu:_ +25% zdrowia\n_-_ Faza 1: pułapki są o wiele bardziej śmiercionośne\n_-_ Faza 2: umiejętności są częstsze\n_DM-300:_ +33% zdrowia\n_-_ Pylony są wytrzymalsze, a 3 aktywacje\n_-_ Umiejętności są potężniejsze i częstsze\n_-_ DM-300 jest szybszy po doładowaniu\n_-_ Odsłonięte przewody występują dwukrotnie częściej\n_Dwarf King:_ +50% zdrowia\n_-_ Sługi są silniejsze we wszystkich fazach\n_-_ Faza 1: szybsze umiejętności i przywoływania\n_-_ Faza 2: 2 dodatkowe sługi na rundę\n_-_ Faza 3: 2x więcej zdrowia, szybsze przywoływania\n_Yog-Dzewa:_\n_-_ Przywoływane są dwie pięści jednocześnie!\n_-_ +60% obrażeń od lasera\n_-_ Silniejsze sługi
