library.items.weapon.melee.shortsword.desc=Dość krótki miecz, tylko o kilka cali dłuższy od sztyletu.
library.items.weapon.melee.sword.desc=Dobrze wyważony miecz. Niezbyt duży, ale wciąż zauważalnie dłuższy niż miecz krótki.
library.items.weapon.melee.warhammer.desc=Niewiele stworzeń jest w stanie wytrzymać miażdżące uderzenie tej ogromnej masy ołowiu i stali, ale aby skutecznie jej użyć, potrzebna jest wielka siła.
