challenges.champion_enemies=Malamikaj ĉampionoj
challenges.champion_enemies_desc=Vi ne estas la sola, kiu povas plialtigi la nivelon!\n\nOrdinaraj malamikoj havas 1/8 ŝancon aperi kun speciala ĉampiona plifortigo sur la unua etaĝo, skalante ĝis 1/6 sur la 21a etaĝo.\n\n- Ĉampionoj vekiĝas se ili aperas dormante\n- La heroo scias kiam ĉampiono aperas\n- Ĉampionoj ne povas esti transformitaj en aliancanojn\n\nEstas ses tipoj de ĉampionaj malamikoj:\n_Flama (oranĝa):_ +25% proksimbatala damaĝo, ekbrulas ĉe trafo, disvastigas flamojn ĉe morto, ne povas ekbruligi akvokahelojn\n_Projekcia (viola):_ +25% proksimbatala damaĝo, +3 proksimbatala atingo\n_Kontraŭmagia (verda):_ -50% ricevita damaĝo, imuna al magiaj atakoj efikoj\n_Giganto (blua):_ -80% ricevita damaĝo, +1 proksimbatala atingo, ne povas moviĝi en tunelojn\n_Benata (flava):_ 4-obla precizeco kaj evito\n_Kreskanta (ruĝa):_ +20% precizeco, evito, damaĝo kaj efika vivpoentoj. Pliiĝas je 1% ĉiujn 4 vicojn.
challenges.darkness=En mallumon
challenges.darkness_desc=Ĝi estas ja kelkarcero!\n\n- Normala videbla distanco draste reduktita\n- Torĉo aperas sur ĉiu etaĝo\n- Aliaj lumfontoj estas 1/5 tiel efikaj
challenges.no_armor=Kredo estas mia kiraso
challenges.no_armor_desc=Vi bezonos fidon al vi mem, ĉar via kiraso ne multe helpos!\n\n- Baza blokpovo reduktita por ĉiuj kirasoj krom ŝtofaj\n- Ĉiuj kirasoj nun akiras tre malmulte da blokado kiam ĝisdatigitaj\n- La defenda povo de tera gardanto ankaŭ estas signife reduktita.
challenges.no_food=Dieto
challenges.no_food_desc=Manĝaĵoj jam malabundas, sed vi ankaŭ devas atenti viajn porciojn! \n\n - Manĝaĵoj kaj la korno de abundo estas trione tiel efikaj por kontentigi malsaton. \n - Aliaj fontoj de sateco ne estas tuŝitaj.
challenges.no_healing=Farmakofobio
challenges.no_healing_desc=Resanigaj pocioj certe estas utilaj, bedaŭrinde vi estas alergia! \n\n- Resanigaj pocioj, objektoj kiuj uzas resanigajn pociojn en sia recepto, kaj sunfrukto venenos la heroon anstataŭ resanigi ilin. \n- Malstabilaj trinkaĵoj ne povas hazarde veneni aŭ resanigi la heroon. \n- Ĉi tiuj objektoj ankoraŭ funkcias normale por aliaj roluloj.
challenges.no_herbalism=Dezerta tero
challenges.no_herbalism_desc=Ŝajnas, ke ne restas pura akvo en ĉi tiu malbenita kelkarcero...\n\n- Rosgutoj estas forigitaj\n- Plantoj estas forigitaj\n- Semoj ankoraŭ aperas, sed ne enradikiĝas
challenges.no_scrolls=Malpermesitaj runoj
challenges.no_scrolls_desc=Certa runo estas pli malfacile trovebla. Bedaŭrinde, ĝi ĉiam estas la plej utila. \n\n - Duono de la plibonigaj volvlibroj de la kelkarcero estas forigitaj.
challenges.stronger_bosses=Pli malbonaj estroj
challenges.stronger_bosses_desc=Estroj estas multe pli fortaj kun ĉi tiu defio!\n\n_Goo:_ +20% sano\n_-_ Resaniĝo en akvo pliiĝas, ĝis 3/vico\n_-_ Pumpiĝas en 1 vico anstataŭ 2\n_Tengu:_ +25% sano\n_-_ Fazo 1: kaptiloj estas multe pli mortigaj\n_-_ Fazo 2: kapabloj estas pli oftaj\n_DM-300:_ +33% sano\n_-_ Pilonoj estas pli fortaj kaj 3 aktiviĝas\n_-_ Kapabloj estas pli potencaj kaj oftaj\n_-_ DM-300 estas pli rapida kiam superŝargita\n_-_ Malkovritaj dratoj estas duoble pli komuna\n_Nana Reĝo:_ +50% sano\n_-_ Helpantoj estas pli fortaj en ĉiuj fazoj\n_-_ Fazo 1: pli rapidaj kapabloj kaj alvokoj\n_-_ Fazo 2: 2 pliaj helpantoj po rondo\n_-_ Fazo 3: 2x sano, pli rapida alvoko\n_Yog-Dzewa:_\n_-_ Du pugnoj estas alvokataj samtempe!\n_-_ +60% lasera damaĝo\n_-_ Pli fortaj helpantoj
challenges.swarm_intelligence=Svarminteligenteco
challenges.swarm_intelligence_desc=Atentu, la kelkarceraj monstroj fariĝas pli inteligentaj! \n\n- Kiam malamiko rimarkas vin, proksimaj malamikoj estas altiritaj al tiu loko.
