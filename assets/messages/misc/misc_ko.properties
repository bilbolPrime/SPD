badges$badge.unlock_mage.title=마법사 잠금 해제!
badges$badge.unlock_rogue.desc=한 게임에서 기습 공격 10회를 성공하면 로그를 잠금 해제할 수 있습니다.
badges$badge.unlock_rogue.title=로그 잠금 해제!
