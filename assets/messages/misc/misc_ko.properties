pets.desc_1=여행길을 함께하는 작은 친구. 반려동물은 싸움에 끼어들지 않으며 누구의 길도 막지 않는다.
pets.desc_2=구와는 달리 성질이 온순한 작은 덩어리. 구를 쓰러뜨리면 데리고 다닐 수 있다.
pets.desc_3=소리 없이 따라오는 작은 닌자. 텐구를 쓰러뜨리면 데리고 다닐 수 있다.
pets.desc_4=어디로도 서두를 필요가 없는 작은 기계. DM-300을 쓰러뜨리면 데리고 다닐 수 있다.
pets.desc_5=발자취를 따라오는 작은 겨울 조각. 고대 서리를 쓰러뜨리면 데리고 다닐 수 있다.
pets.desc_6=여행을 함께하는 외눈. 요그를 쓰러뜨리면 데리고 다닐 수 있다.
