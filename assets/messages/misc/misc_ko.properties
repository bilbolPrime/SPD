library.items.soulcrystal.name=영혼이 담긴 수정
library.items.soulcrystal.desc=붙잡은 영혼이 담긴 수정입니다. 던지면 영혼이 나와 당신을 위해 싸웁니다.
library.items.dreamweed.name=꿈풀 씨앗
library.items.dreamweed.desc=꿈풀에 닿으면 반짝이는 가스가 뿜어져 나와 혼란을 일으킵니다.
library.items.bag.desc=소지품을 담는 배낭입니다.
library.items.armor.huntressarmor.desc=이 망토를 입은 사냥꾼은 시야 안의 적마다 유령 칼날을 날립니다. 피해는 장착한 근접 무기에 따라 달라집니다.
library.items.armor.magearmor.desc=이 로브를 입은 마법사는 땅을 녹이는 주문으로 시야 안의 모든 적을 불태우고 움직이지 못하게 합니다.
library.items.armor.roguearmor.desc=이 옷을 입은 도적은 연막탄으로 자신을 보는 적들의 눈을 멀게 하고 옆으로 뛰어 피합니다.
library.items.armor.warriorarmor.desc=이 갑옷을 입은 전사는 지정한 곳으로 도약해 착지하며 인접한 적을 기절시킵니다.
library.items.flamebow.desc=화살로 적에게 불을 붙일 수 있는 마법의 활입니다.
library.items.frostbow.desc=화살로 적을 얼릴 수 있는 마법의 활입니다.
library.items.necroblade.desc=어둠의 마법으로 벼린 칼날입니다. 쓰러뜨린 적의 영혼을 삼킬수록 강해집니다.\n\n5레벨부터 기운을 가득 채우면 _어둠의 탄환_을 쓸 수 있습니다. 대상의 본질을 파괴해 하수인으로 만들 수 있습니다.
library.items.soulblade.desc=사용자의 영혼에서 힘을 끌어내는 칼날입니다.\n\n_3레벨: 마나 20으로 체력 20 회복_\n\n_5레벨: 마나 50으로 저주 해제_\n\n_7레벨: 모든 마나를 써서 적들을 공격. 마나 50 이상 필요_
library.items.wands.wandofdisintegration.desc=파괴의 광선이 생물을 관통합니다. 더 많은 대상을 맞힐수록 각각에게 주는 피해가 커집니다.
library.items.wands.wandoflightning.desc=전격이 가까이 모여 있는 여러 생물을 타고 흐릅니다.
library.items.wands.wandofmagicmissile.desc=순수한 마력을 쏘아 생물 하나에게 적당한 피해를 줍니다.
library.items.wands.wandofregrowth.desc=경로에 풀을, 도착한 곳에 무성한 수풀을 만듭니다. 마법사와 강령술사는 자연의 축복에 마나 40을 써서 무작위 씨앗을 만들 수 있습니다.
library.class_armor_stats=방어력과 힘 요구량은 재료로 쓴 갑옷에 따라 달라집니다.
library.bow_stats=화살 피해를 _%.2f배_로 만듭니다. 기본 피해는 화살에 따라 달라집니다.
library.strength=_힘 %d_이 필요합니다.
library.weapon_stats=_%1$d-%2$d 피해_를 주며 _힘 %3$d_이 필요합니다.
library.ring_level=반지 레벨: _%+d_.
library.ring_accuracy=정확도 배율: _%1$.2f_. 공격 기술 수치를 바꾸며, 명중 확률에 직접 곱하는 값은 아닙니다.
library.ring_evasion=회피 배율: _%1$.2f_. 방어 기술 수치를 바꾸며, 회피 확률에 직접 곱하는 값은 아닙니다.
library.ring_haste=행동 시간 배율: _%1$.2f_. 값이 작을수록 빠르게 행동합니다.
library.ring_shadows=은신: _%+d_.
library.ring_mending=재생 기술을 제외하면, 다쳤고 굶주리지 않을 때 _%1$.2f턴마다 체력 1_을 회복합니다.
library.ring_satiety=허기가 늘 때마다 평소의 10 대신 _%d_가 증가합니다. 증가 주기는 직업과 일시적인 효과에도 영향을 받습니다.
library.ring_power=마법 막대 위력: _%+d_. 막대마다 이 보너스를 다르게 활용합니다.
library.ring_detection=탐색 반경: _%d칸_. 레벨이 음수면 비밀을 발견할 확률도 낮아집니다.
library.ring_elements=원소 저항 확률: _%1$.1f%%_. 해당하는 해로운 효과의 지속 시간은 _%2$.2f배_가 됩니다.
library.ring_herbalism=풀을 밟으면 _%1$.1f%%_ 확률로 씨앗, _%2$.1f%%_ 확률로 이슬이 나옵니다. 층과 도전 조건에 따라 제한됩니다.
library.ring_haggler=2골드 이상의 구매 가격을 절반으로 낮춥니다. 소수점은 버립니다.
library.ring_thorns=받은 공격 피해의 0부터 최대치 사이에서 무작위로 피해를 돌려줍니다. 갑옷으로 줄이기 전의 피해를 기준으로 합니다.
library.gun_modifiers=속도 조정과 마법 부여는 총격에 영향을 주지 않습니다.
library.items.weapon.melee.battleaxe.desc=이 전투 도끼의 거대한 강철 날은 넓게 휘두르는 한 번의 공격에 상당한 무게감을 실어줍니다.
