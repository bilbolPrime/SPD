badges$badge.victory_all_classes.title=다재다능한 사람
badges$badge.victory_random.desc=영웅, 특성 업그레이드, 하위 직업, 방어구 능력치가 무작위로 결정되는 옌도르의 부적을 획득하세요.
badges$badge.victory_random.title=무작위 승리!
