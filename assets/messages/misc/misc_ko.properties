support.aura_rat_king_hint=쉿... BilbolDev가 내 금을 노리고 있어. 어림없지! _SkillfulPixelDungeon_을 입력하면 이번 모험에서 모든 오라를 쓸 수 있어. 왕도 돈 쓸 데가 많거든.
