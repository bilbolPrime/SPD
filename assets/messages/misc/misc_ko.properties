library.unknown_recipe=아직 이 조합법으로 물약을 만들지 않았습니다.
library.recipe_desc=재료: _3 × %1$s_\n\n결과: _%2$s_\n\n이 조합법으로 물약을 만들면 해당 물약이 식별됩니다.
