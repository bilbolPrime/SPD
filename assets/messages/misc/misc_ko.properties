challenges.champion_enemies=적대적인 챔피언
challenges.champion_enemies_desc=레벨업할 수 있는 건 당신뿐만이 아닙니다! 일반 적은 1층에서 1/8 확률로 특수 챔피언 버프를 받고 등장하며, 21층에서는 1/6까지 확률이 증가합니다. - 챔피언은 잠든 상태로 등장하면 깨어납니다. - 영웅은 챔피언이 등장하는 시점을 알 수 있습니다. - 챔피언은 아군으로 만들 수 없습니다. 챔피언 적은 여섯 종류가 있습니다. 불타는(주황색): 근접 공격력 25% 증가, 공격 시 발화, 사망 시 화염 확산, 물 타일에는 발화 불가 받는 피해 50% 감소, 마법 효과 면역 \n_거인(파란색): 받는 피해 80% 감소, 근접 공격 범위 +1, 터널로 이동 불가 \n_축복받은 자(노란색): 명중률 및 회피율 4배 \n_성장하는 자(빨간색): 명중률, 회피율, 공격력, 유효 체력 20% 증가. 4턴마다 1%씩 증가.
challenges.darkness=어둠 속으로
challenges.darkness_desc=여긴 어쨌든 던전이잖아! \n\n- 일반적인 시야 거리가 크게 줄어듭니다. \n- 각 층마다 횃불이 나타납니다. \n- 다른 광원의 효율이 1/5로 줄어듭니다.
challenges.no_armor=믿음은 나의 갑옷이다
challenges.no_armor_desc=갑옷이 별 도움이 안 될 테니 자신감이 필요할 겁니다! \n\n - 천 갑옷을 제외한 모든 갑옷의 기본 방어력이 감소했습니다. \n - 모든 갑옷은 업그레이드 시 방어력이 매우 낮아졌습니다. \n - 대지의 수호자의 방어력도 크게 감소했습니다.
challenges.no_food=다이어트 중
challenges.no_food_desc=식량이 이미 부족한데, 섭취량까지 신경 써야 해요! 음식과 풍요의 뿔은 허기를 달래는 효과가 3분의 1밖에 되지 않아요. 다른 포만감 유발 방법은 영향을 받지 않아요.
challenges.no_healing=약물공포증
challenges.no_healing_desc=회복 물약은 정말 유용하지만, 안타깝게도 당신은 알레르기가 있네요! 회복 물약, 회복 물약을 제조법에 사용하는 아이템, 그리고 해바라기 열매는 영웅을 치료하는 대신 중독시킵니다. 불안정한 물약은 영웅을 무작위로 중독시키거나 치료하지 않습니다. 이러한 아이템은 다른 캐릭터에게는 정상적으로 작동합니다.
challenges.no_herbalism=황토
challenges.no_herbalism_desc=이 저주받은 던전에는 깨끗한 물이 하나도 남지 않은 것 같습니다...\n\n- 이슬방울이 제거되었습니다.\n- 식물이 제거되었습니다.\n- 씨앗은 여전히 나타나지만 뿌리를 내리지 않습니다.
challenges.no_scrolls=금지된 룬 문자
challenges.no_scrolls_desc=특정 룬은 찾기가 더 어렵습니다. 안타깝게도, 그 룬은 항상 가장 유용한 룬입니다. \n\n - 던전 업그레이드 스크롤의 절반이 제거되었습니다.
challenges.stronger_bosses=더 나쁜 상사들
challenges.stronger_bosses_desc=이번 도전에서는 보스들이 훨씬 더 강해졌습니다! \n\n_Goo:_ 체력 20% 증가 \n_-_ 물 속에서의 회복량이 턴당 3으로 증가 \n_-_ 회복 속도가 2턴에서 1턴으로 증가 \n_Tengu:_ 체력 25% 증가 \n_-_ 1단계: 함정이 훨씬 더 치명적임 \n_-_ 2단계: 능력 사용 빈도 증가 \n_DM-300:_ 체력 33% 증가 \n_-_ 파일론이 더 단단해지고 3개 활성화 \n_-_ 능력 사용 빈도 및 위력 증가 \n_-_ DM-300의 초강력 충전 시 속도 증가 \n_-_ 노출된 전선이 두 배로 늘어남 일반 \n_드워프 왕: 체력 50% 증가 \n_-_ 모든 단계에서 하수인 강화 \n_-_ 1단계: 능력 및 소환 속도 증가 \n_-_ 2단계: 라운드당 하수인 2마리 추가 \n_-_ 3단계: 체력 2배, 소환 속도 증가 \n_요그-제와: 주먹 두 개를 동시에 소환! \n_-_ 레이저 피해 60% 증가 \n_-_ 하수인 강화
challenges.swarm_intelligence=군집 지능
challenges.swarm_intelligence_desc=조심해, 던전 몬스터들이 점점 똑똑해지고 있어!\n\n- 적이 당신을 발견하면, 주변의 적들이 그 위치로 모여듭니다.
