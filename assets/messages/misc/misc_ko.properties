rebornchallenges.blood_magic=혈마법
rebornchallenges.blood_magic_desc=사용형 스킬은 마나 소모량만큼 체력도 소모합니다. 이 소모로 사망하게 된다면 스킬을 사용할 수 없습니다.
rebornchallenges.oathbound=맹세의 속박
rebornchallenges.oathbound_desc=해당 지역의 보스를 쓰러뜨릴 때까지 장비를 벗을 수 없습니다. 빈 장비 칸에는 한 번만 장착할 수 있습니다. 장비 강화와 마법 부여는 계속 가능합니다.
rebornchallenges.bound=해당 지역의 보스를 쓰러뜨릴 때까지 이 장비를 벗을 수 없습니다.
