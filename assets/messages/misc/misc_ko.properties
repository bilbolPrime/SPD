library.quest.ghost_curse.desc=슬픈 유령을 붙잡고 있는 저주를 물리쳐 유령을 풀어주세요.
library.quest.wandmaker_berry.name=로트베리 씨앗
library.quest.wandmaker_berry.desc=감옥에서 로트베리를 찾아 그 씨앗을 지팡이 장인에게 가져다주세요.
library.quest.wandmaker_dust.name=시체 먼지
library.quest.wandmaker_dust.desc=감옥의 뼈 더미에서 시체 먼지를 찾아 지팡이 장인에게 가져다주세요.
library.quest.wandmaker_fish.name=팬텀 피쉬
library.quest.wandmaker_fish.desc=감옥의 물속에서 팬텀 피쉬를 찾아 지팡이 장인에게 가져다주세요.
library.quest.blacksmith_gold.name=어두운 금 광석
library.quest.blacksmith_gold.desc=어두운 금 광석 15개를 캐서 곡괭이와 함께 대장장이에게 돌려주세요.
library.quest.blacksmith_blood.name=박쥐의 피
library.quest.blacksmith_blood.desc=대장장이의 곡괭이로 박쥐를 죽인 뒤 피 묻은 곡괭이를 돌려주세요.
library.quest.imp_golems.name=골렘 사냥
library.quest.imp_golems.desc=골렘에게서 드워프 토큰 6개를 모아 임프에게 가져다주세요.
library.quest.imp_monks.name=수도승 사냥
library.quest.imp_monks.desc=수도승에게서 드워프 토큰 8개를 모아 임프에게 가져다주세요.
library.quest.ghost.reward=무기와 갑옷 중 하나를 고를 수 있습니다.
library.quest.wandmaker.reward=강화된 지팡이 두 개 중 하나를 고를 수 있습니다.
library.quest.blacksmith.reward=재련 1회: 같은 종류의 아이템 두 개를 합쳐 더 좋은 쪽을 강화합니다.
library.quest.imp.reward=강화되어 있지만 저주받은 반지를 받습니다. 임프는 악마의 전당 앞에 상점도 엽니다.
