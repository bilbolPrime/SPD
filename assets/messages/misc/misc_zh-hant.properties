challenges.champion_enemies=敵對冠軍
challenges.champion_enemies_desc=不只你能變強！\n\n普通敵人在第1層有1/8的機率成為冠軍，到第21層時提高至1/6。\n\n- 冠軍出現時若正在睡覺，就會醒來\n- 英雄能察覺冠軍的出現\n- 冠軍無法成為盟友\n\n冠軍共有六種：\n_熾焰（橘色）：_近戰傷害+25%，命中時點燃敵人，死亡時散播火焰，無法點燃水面\n_投射（紫色）：_近戰傷害+25%，近戰範圍+3\n_反魔法（綠色）：_受到的傷害減少50%，免疫魔法效果\n_巨人（藍色）：_受到的傷害減少80%，近戰範圍+1，無法進入隧道\n_祝福（黃色）：_命中率和閃避率變為4倍\n_成長（紅色）：_命中率、閃避率、傷害和有效生命值+20%，每4回合再增加1%
challenges.darkness=陷入黑暗
challenges.darkness_desc=畢竟這是地牢！ \n\n- 常規可視距離大幅縮短\n- 每層都會出現一個火炬\n- 其他光源的效率降低至原來的五分之一
challenges.no_armor=信仰是我的盔甲
challenges.no_armor_desc=你需要對自己有信心，因為你的盔甲作用不大！ \n\n- 除布甲外，所有盔甲的基礎格擋能力降低\n- 所有盔甲升級後獲得的格擋能力提升都非常小\n- 大地守護者的防禦能力也大幅降低
challenges.no_food=節食
challenges.no_food_desc=食物本來就稀缺，但你得注意份量！食物和豐饒之角飽足的效果只有原來的三分之一。其他飽足來源不受影響。
challenges.no_healing=藥物恐懼症
challenges.no_healing_desc=治療藥水確實很方便，可惜你對它們過敏！ \n\n- 治療藥水、配方中使用治療藥水的物品以及太陽果會使英雄中毒而不是治療他們。 \n- 不穩定的藥劑不會隨機使英雄中毒或治療。 \n- 這些物品對其他角色仍然有效。
challenges.no_herbalism=不毛之地
challenges.no_herbalism_desc=這該死的地牢裡似乎已經沒有乾淨的水了…\n\n- 露珠已被移除\n- 植物已被移除\n- 種子仍然出現，但不會發芽
challenges.no_scrolls=禁忌符文
challenges.no_scrolls_desc=某個符文更難找到。不幸的是，它總是最有用的。地牢中一半的升級捲軸被移除。
challenges.stronger_bosses=更糟的老闆
challenges.stronger_bosses_desc=這次挑戰中，Boss 戰難度大幅提升！ \n\n_Goo：生命值 +20%\n_-_水中治療量提升至每回合 3 次\n_-_充氣時間縮短至 1 回合而非 2 回合\n_Tengu：生命值+25%\n_-_第一階段：陷阱威力大幅提升\n_-_第二階段：技能觸發頻率更高\n_DM-300：生命值 +33%\n_-_能量塔更堅固，且可啟動 3個\n_-_技能威力更強，觸發頻率更高\n_-_DM-300充能後速度更快\n_-_裸露的電線出現頻率翻倍\n_矮人王：生命值+50%\n_-_所有階段小兵更強\n_-_第一階段：技能和召喚速度更快\n_-_第二階段：每回合多召喚2個小兵\n_-_第三階段：生命值翻倍，召喚速度更快\n_尤格-澤瓦：\n_-_一次召喚兩個拳頭！ \n_-_雷射傷害+60%\n_-_更強的小兵
challenges.swarm_intelligence=群體智能
challenges.swarm_intelligence_desc=小心，地牢怪物越來越聰明了！當敵人發現你時，附近的敵人會被吸引到那個位置。
