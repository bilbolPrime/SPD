library.quest.ghost_rose.name=遺失的玫瑰
library.quest.ghost_rose.desc=找到悲傷幽靈被偷走的乾枯玫瑰，把它還給他。
library.quest.ghost_rat.name=惡臭老鼠
library.quest.ghost_rat.desc=殺死害死悲傷幽靈的惡臭老鼠，把牠的頭骨帶回來。
library.quest.ghost_curse.name=幽靈的詛咒
library.quest.ghost_curse.desc=擊敗束縛悲傷幽靈的詛咒，讓他得到解脫。
library.quest.wandmaker_berry.name=一顆爛莓種子
library.quest.wandmaker_berry.desc=在監獄中找到爛莓，把種子交給魔杖匠。
library.quest.wandmaker_dust.name=屍粉
library.quest.wandmaker_dust.desc=在監獄的骨堆中尋找屍粉，把它交給魔杖匠。
library.quest.wandmaker_fish.name=幻影魚
library.quest.wandmaker_fish.desc=在監獄的水中尋找幻影魚，把牠交給魔杖匠。
library.quest.blacksmith_gold.name=黑金礦石
library.quest.blacksmith_gold.desc=開採15塊黑金礦石，連同鎬子一起交還給鐵匠。
library.quest.blacksmith_blood.name=蝙蝠之血
library.quest.blacksmith_blood.desc=用鐵匠的鎬子殺死一隻蝙蝠，然後把染血的鎬子還給他。
library.quest.imp_golems.name=獵殺魔像
library.quest.imp_golems.desc=從魔像身上收集6枚矮人代幣，交給小鬼。
library.quest.imp_monks.name=獵殺武僧
library.quest.imp_monks.desc=從武僧身上收集8枚矮人代幣，交給小鬼。
library.quest.ghost.reward=可以選擇一件武器或護甲。
library.quest.wandmaker.reward=可以從兩根升級過的法杖中選擇一根。
library.quest.blacksmith.reward=一次重鑄：將兩件同類物品合為一件，升級較好的那件。
library.quest.imp.reward=一枚升級過但受到詛咒的戒指。小鬼還會在惡魔大廳前開一家商店。
