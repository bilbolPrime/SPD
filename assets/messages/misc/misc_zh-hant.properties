library.items.soulcrystal.name=充盈的靈魂水晶
library.items.soulcrystal.desc=封存著一個靈魂的水晶。投出後便能召喚這個靈魂為你效力。
library.items.dreamweed.name=夢草種子
library.items.dreamweed.desc=夢草受到觸碰時會噴出閃爍的氣體，使生物陷入混亂。
library.items.bag.desc=裝隨身物品的背包。
library.items.armor.huntressarmor.desc=披上這件斗篷後，女獵手能向視野內的每個敵人發射一把幽靈之刃。傷害取決於裝備的近戰武器。
library.items.armor.magearmor.desc=穿上這件長袍後，法師能用熔地術點燃並定住視野內的所有敵人。
library.items.armor.roguearmor.desc=穿上這件衣服後，盜賊能用煙霧彈致盲看得見自己的敵人，並跳到一旁。
library.items.armor.warriorarmor.desc=穿上這件護甲後，戰士能躍向指定地點，落地時擊暈相鄰的敵人。
library.items.flamebow.desc=一把附魔弓，射出的箭有機會點燃目標。
library.items.frostbow.desc=一把附魔弓，射出的箭有機會凍結目標。
library.items.necroblade.desc=用黑暗魔法鍛造的利刃，會吞噬被它殺死的生物的靈魂，逐漸變強。\n\n達到5級且能量蓄滿時，可使用_暗影彈_，有機會粉碎目標的本質並將其變為僕從。
library.items.soulblade.desc=這把劍從持有者的靈魂中汲取力量。\n\n_3級：消耗20點魔力，恢復20點生命_\n\n_5級：消耗50點魔力，解除詛咒_\n\n_7級：消耗全部魔力攻擊敵人，至少需要50點魔力_
library.items.wands.wandofdisintegration.desc=破壞性的光束能穿透生物。命中的目標越多，每個目標受到的傷害就越高。
library.items.wands.wandoflightning.desc=電弧在相距較近的生物之間跳躍，擊中多個目標。
library.items.wands.wandofmagicmissile.desc=發射純粹的魔法能量，對一個生物造成適中的傷害。
library.items.wands.wandofregrowth.desc=沿途長出青草，落點長出茂密植物。
