rebornchallenges.blood_magic_desc=主動技能還會消耗與魔力消耗相同的生命值。如果這會導致死亡，就無法使用該技能。
rebornchallenges.oathbound=誓約束縛
rebornchallenges.oathbound_desc=擊敗當前區域的首領前，無法卸下裝備。每個空裝備欄只能裝上一次裝備。你仍然可以升級和附魔裝備。
