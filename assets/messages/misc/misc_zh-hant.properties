library.ring_detection=搜尋半徑：_%d格_。負等級還會降低發現秘密的機率。
library.ring_elements=元素抵抗機率：_%1$.1f%%_。適用的負面效果持續時間乘以_%2$.2f_。
library.ring_herbalism=踩草有_%1$.1f%%_機率掉落種子，_%2$.1f%%_機率掉落露水，但仍受樓層和挑戰規則限制。
library.ring_haggler=將不低於2金幣的買價減半，小數無條件捨去。
library.ring_thorns=隨機反彈傷害，範圍從0到這次攻擊被護甲減免前的傷害值。
library.gun_modifiers=速度平衡調整和附魔不影響槍彈。
library.items.weapon.melee.battleaxe.desc=這把戰斧巨大的鋼製斧頭，每次揮砍都威力十足。
library.items.weapon.melee.dagger.desc=一把簡單的鐵匕首，附有磨損的木柄。
library.items.weapon.melee.glaive.desc=一種巨大的長柄武器，由一根桿子末端裝有一個劍刃組成。
library.items.weapon.melee.longsword.desc=這把劍鋒利的長鋼刃閃閃發光，令人安心，不過它的尺寸也讓它相當重。
library.items.weapon.melee.mace.desc=這種武器碩大的鐵質頭部能造成巨大的傷害。
library.items.weapon.melee.shortsword.desc=這是一把很短的劍，只比匕首長幾吋。
library.items.weapon.melee.sword.desc=這是一把平衡性很好的劍。尺寸適中，但比短劍明顯長。
library.items.weapon.melee.warhammer.desc=這柄鉛鋼鑄成的巨鎚能砸出沉重的一擊，但只有力氣夠大的人才能駕馭。
library.items.weapon.missiles.javelin.desc=這些標槍經過配重，投出後會保持槍尖朝前。
