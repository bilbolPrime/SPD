challenges.champion_enemies=敵対するチャンピオン
challenges.champion_enemies_desc=レベルアップできるのはあなただけではない！\n\n通常の敵は、フロア1では1/8の確率で特別なチャンピオンバフを持ってスポーンし、フロア21では1/6にスケールアップする。\n\n- 眠っているチャンピオンは目覚める\n- ヒーローはチャンピオンのスポーンを知っている\n- チャンピオンを味方にすることはできない\n\nチャンピオンの敵は6種類いる：\nブレイジング(オレンジ):_ 近接ダメージ+25%、ヒット時に発火、死亡時に炎を撒き散らす、水タイルには発火できない。\n投影(紫):_ 近接ダメージ+25%、近接範囲+3\n反魔法 (緑):_ 被ダメージ-50%、魔法効果に対する免疫\n巨人 (青):_ 被ダメージ-80%、近接攻撃範囲+1、トンネルに移動できない。\n祝福（黄）:_ 4倍の命中率と回避率\n成長（赤）:_ 命中、回避、ダメージ、有効HPが+20%。4ターン毎に1%増加。
challenges.darkness=闇の中へ
challenges.darkness_desc=やはりダンジョンだ！\n\n- 通常の視認距離が劇的に短縮\n- 各階に松明が出現\n- 他の光源の効果は1/5
challenges.no_armor=信仰は私の鎧
challenges.no_armor_desc=アーマーはあまり役に立たないから、自分自身への信頼が必要だ！\n\n- 布製を除くすべてのアーマーの基本ブロッキング・パワーが減少した。\n- すべてのアーマーはアップグレードしてもブロッキングをほとんど得られないようになった。\n- 土のガーディアンの防御力も大幅に低下している。
challenges.no_food=ダイエットについて
challenges.no_food_desc=食料はすでに不足しているが、分量にも気をつけなければならない！\n\n- 食べ物やたくさんの角は、空腹を満たすのに3分の1の効果しかない。\n- 他の満腹中枢は影響を受けない。
challenges.no_healing=薬物恐怖症
challenges.no_healing_desc=ヒーリングポーションは確かに便利だが、残念ながら君はアレルギーなんだ！\n\n- 癒しのポーション、癒しのポーションをレシピに使用したアイテム、サンフルーツはヒーローを癒す代わりに毒にする。\n- 不安定な醸造酒は、ランダムに毒や回復を与えることはできません。\n- これらのアイテムは他のキャラクターには通常通り使えます。
challenges.no_herbalism=不毛の地
challenges.no_herbalism_desc=この呪われた地下牢には、もうきれいな水は残っていないようだ...。\n\n- 露は取り除かれた\n- 植物は取り除かれた\n- 種はまだ残っているが、根付かない。
challenges.no_scrolls=禁断のルーン
challenges.no_scrolls_desc=あるルーンは見つけるのが難しい。残念ながら、それは常に最も有用なものだ。\n\n- ダンジョンのアップグレードスクロールの半分が削除された。
challenges.stronger_bosses=より悪いボス
challenges.stronger_bosses_desc=このチャレンジでは、ボスはかなり手強い！\n\n_グー：+20%のヘルス\n水中での回復量が上昇し、3/ターンになる\n2ターンの代わりに1ターンでパンプアップする\n_天狗：+25%の体力\nフェーズ1: トラップがより致命的になる\nフェーズ2：アビリティの使用頻度が上がる\n_DM-300:_+33%のヘルス\nパイロンはよりタフになり、3回起動するようになった\nアビリティはより強力に、より頻繁に発動するようになる\nDM-300はスーパーチャージすると速くなる\n_露出したワイヤーは2倍多い\n_ドワーフ・キング：+50%のヘルス\nミニオンは全フェーズで強くなる\nフェーズ1: アビリティと召喚が速くなる\nフェーズ2: ミニオンが1ラウンドにつき2体増える\nフェーズ3: 2倍のヘルス、より速い召喚\n{cH00ffff}ヨグ＝ドゼワ\n_一度に2つの拳を召喚する！\nレーザーダメージ+60\nより強いミニオン
challenges.swarm_intelligence=群知能
challenges.swarm_intelligence_desc=気をつけろ、ダンジョンのモンスターは賢くなっている！\n\n- 敵があなたに気づくと、近くの敵がその場所に引き寄せられます。
