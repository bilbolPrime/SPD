library.items.soulcrystal.name=魂入りの水晶
library.items.soulcrystal.desc=捕らえた魂を宿す水晶。投げると魂を呼び出し、味方として戦わせられる。
library.items.dreamweed.name=夢草の種
library.items.dreamweed.desc=夢草に触れると、混乱を引き起こすきらめくガスが噴き出す。
