library.items.armor.huntressarmor.desc=このマントを着た女猟師は、視界内の敵それぞれに幻の刃を放てる。威力は装備中の近接武器に依存する。
library.items.armor.magearmor.desc=このローブを着た魔術師は、大地を溶かす魔法で視界内の敵すべてを燃やし、足止めできる。
library.items.armor.roguearmor.desc=この装束を着た盗賊は、煙幕で自分を見ている敵の目をくらませ、脇へ飛び退ける。
library.items.armor.warriorarmor.desc=この鎧を着た戦士は、指定した場所へ跳躍し、着地時に隣接する敵を気絶させられる。
library.items.flamebow.desc=放った矢で敵を燃やすことがある、魔法の弓。
library.items.frostbow.desc=放った矢で敵を凍らせることがある、魔法の弓。
library.items.necroblade.desc=闇の魔法で鍛えられた剣。倒した相手の魂を食らうほど強くなる。\n\nレベル5から、力を満たした剣で_闇の魔弾_を放てる。対象の本質を砕き、しもべに変えることがある。
library.items.soulblade.desc=持ち主の魂から力を引き出す剣。\n\n_レベル3：マナ20でHPを20回復_\n\n_レベル5：マナ50で呪いを解除_\n\n_レベル7：全マナを使って敵を攻撃。マナ50以上が必要_
library.items.wands.wandofdisintegration.desc=破壊の光線が生き物を貫く。多くの対象を貫くほど、それぞれに与えるダメージが増える。
library.items.wands.wandoflightning.desc=電撃が近くにいる複数の生き物に飛び移る。
library.items.wands.wandofmagicmissile.desc=純粋な魔力を放ち、一体の生き物に中程度のダメージを与える。
library.items.wands.wandofregrowth.desc=軌道上に草を、着弾地点に茂みを生やす。
library.class_armor_stats=防御力と必要筋力は、素材にした鎧に依存する。
library.bow_stats=矢のダメージを_%.2f倍_にする。元の威力は矢によって異なる。
