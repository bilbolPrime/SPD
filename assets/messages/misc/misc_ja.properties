library.weapon_stats=ダメージ：_%1$d～%2$d_。必要筋力：_%3$d_。
library.ring_level=指輪のレベル：_%+d_。
library.ring_accuracy=命中精度：_%1$.2f倍_。攻撃技能を変化させる値で、命中率に直接掛かるわけではない。
library.ring_evasion=回避精度：_%1$.2f倍_。防御技能を変化させる値で、回避率に直接掛かるわけではない。
library.ring_haste=行動時間：_%1$.2f倍_。小さいほど素早く行動できる。
library.ring_shadows=隠密：_%+d_。
library.ring_mending=再生スキルを除き、負傷中かつ飢餓状態でなければ_%1$.2fターンごとにHPを1回復_する。
library.ring_satiety=空腹度の増加量を通常の10から_%d_に変える。増加の頻度は職業や一時的な効果にも左右される。
library.ring_power=杖の威力補正：_%+d_。効果の現れ方は杖によって異なる。
library.ring_detection=探索範囲：半径_%dマス_。レベルが負の場合、秘密を見つける確率も下がる。
library.ring_elements=属性への抵抗確率：_%1$.1f%%_。対象となる悪い効果の持続時間は_%2$.2f倍_になる。
library.ring_herbalism=草を踏むと_%1$.1f%%_で種、_%2$.1f%%_で露が出る。階やチャレンジによる制限を受ける。
library.ring_haggler=2ゴールド以上の買値を半額にする。端数は切り捨てる。
library.ring_thorns=受けた攻撃のダメージを、0から元の威力までの範囲でランダムに反射する。鎧で軽減する前の値を使う。
library.gun_modifiers=速度の重心調整とエンチャントは銃撃に影響しない。
library.items.weapon.melee.battleaxe.desc=この斧の巨大な鋼鉄の頭部は、一撃一撃にかなりの重みがある。
library.items.weapon.melee.dagger.desc=使い古された木の柄がついたシンプルな鉄の短剣。
