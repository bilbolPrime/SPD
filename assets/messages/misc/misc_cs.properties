challenges.champion_enemies=Nepřátelští šampioni
challenges.champion_enemies_desc=Nejsi jediný, kdo se může vylepšit!\n\nBěžní nepřátelé mají 1/8 šance se objevit se speciálním vylepšením šampiona na 1. patře, která se na 21. patře zvyšuje až na 1/6.\n\n - Šampioni se probudí, pokud se objeví ve spánku.\n - Hrdina ví, kdy se objeví šampion.\n - Šampioni se nemohou stát spojenci.\n\nExistuje šest typů nepřátelských šampionů:\n_Plamenící (oranžový):_ +25% poškození zblízka, při zásahu se zapálí, při smrti šíří plameny, nemůže zapálit vodní dlaždice.\n_Vystřelující (fialová):_ +25% poškození zblízka, +3 dostřel zblízka.\n_Antimagický (zelený):_ -50% obdržené poškození, imunní vůči magii. efekty\n_Obří (modrý):_ -80% k přijímanému poškození, +1 k dosahu boje zblízka, nemůže se pohybovat do tunelů\n_Požehnaný (žlutý):_ 4x přesnost a úhybnost\n_Rostoucí (červený):_ +20% k přesnosti, úhybnosti, poškození a efektivnímu zdraví. Zvyšuje se o 1% každé 4 tahy.
challenges.darkness=Do tmy
challenges.darkness_desc=Vždyť je to dungeon!\n\n - Běžná viditelnost se dramaticky snížila\n - Na každém patře se objeví pochodeň\n - Ostatní zdroje světla jsou z pětiny stejně účinné
challenges.no_armor=Víra je moje zbroj
challenges.no_armor_desc=Budete potřebovat víru v sebe sama, protože vaše zbroj toho moc nezmůže! \n\n - Základní blokovací síla veškeré zbroje kromě látkové snížena. \n - Veškerá zbroj nyní po vylepšení získává jen velmi malou blokovací sílu. \n - Obranná síla zemského strážce je také výrazně snížena.
challenges.no_food=Na dietě
challenges.no_food_desc=Jídla je už tak málo, ale musíte si hlídat i porce!\n\n - Jídlo a roh hojnosti jsou o třetinu méně účinné při ukojení hladu.\n - Jiné zdroje sytosti nejsou ovlivněny.
challenges.no_healing=Farmakofobie
challenges.no_healing_desc=Léčivé lektvary se určitě hodí, bohužel jsi na ně alergický/á! \n\n - Léčivé lektvary, předměty, které ve svém receptu používají léčivé lektvary, a slunečnice hrdinu otráví, místo aby ho léčily. \n - Nestabilní lektvary nemohou hrdinu náhodně otrávit ani vyléčit. \n - Tyto předměty stále fungují normálně pro ostatní postavy.
challenges.no_herbalism=Neplodná země
challenges.no_herbalism_desc=Zdá se, že v tomhle prokletém žaláři už není žádná čistá voda...\n\n - Kapky rosy jsou odstraněny\n - Rostliny jsou odstraněny\n - Semínka se stále objevují, ale nezakoření
challenges.no_scrolls=Zakázané runy
challenges.no_scrolls_desc=Určitá runa se hledá hůře. Bohužel je vždy ta nejužitečnější. \n\n - Polovina svitků pro vylepšení dungeonu je odstraněna.
challenges.stronger_bosses=Zlí šéfové
challenges.stronger_bosses_desc=Bossové jsou s touto výzvou mnohem silnější!\n\n_Goo:_ +20% zdraví\n_-_ Léčení ve vodě se zrychluje na 3/kolo\n_-_ Nabuzuje se v 1 kole místo 2\n_Tengu:_ +25% zdraví\n_-_ Fáze 1: pasti jsou mnohem smrtelnější\n_-_ Fáze 2: schopnosti jsou častější\n_DM-300:_ +33% zdraví\n_-_ Pylony jsou silnější a 3 se aktivují\n_-_ Schopnosti jsou silnější a častější\n_-_ DM-300 je rychlejší při supernabíjení\n_-_ Odkryté dráty jsou dvakrát tolik běžné\n_Trpasličí král:_ +50% zdraví\n_-_ Minioni jsou silnější ve všech fázích\n_-_ Fáze 1: rychlejší schopnosti a přivolání\n_-_ Fáze 2: O 2 miniony více na kolo\n_-_ Fáze 3: 2x zdraví, rychlejší přivolání\n_Yog-Dzewa:_\n_-_ Přivolány jsou dvě pěsti najednou!\n_-_ +60% poškození laserem\n_-_ Silnější minioni
challenges.swarm_intelligence=Rojová inteligence
challenges.swarm_intelligence_desc=Pozor, příšery z dungeonu jsou čím dál chytřejší!\n\n - Když si vás nepřítel všimne, okolní nepřátelé jsou přitahováni k tomuto místu.
