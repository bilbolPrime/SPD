challenges.champion_enemies=Vijandige kampioenen
challenges.champion_enemies_desc=Je bent niet de enige die kan levelen!\n\nReguliere vijanden hebben een kans van 1/8 om te spawnen met een speciale kampioenbuff op verdieping 1, oplopend tot 1/6 op verdieping 21.\n\n- Kampioenen worden wakker als ze slapend spawnen\n- De held weet wanneer een kampioen spawnt\n- Kampioenen kunnen niet in bondgenoten worden veranderd\n\nEr zijn zes soorten vijandelijke kampioenen:\n_Blazing (oranje):_ +25% mêlee-schade, ontbrandt bij een treffer, verspreidt vlammen bij de dood, kan geen watertegels ontsteken\n_Projecting (paars):_ +25% mêlee-schade, +3 mêlee-bereik\n_Antimagic (groen):_ -50% schade Immuun voor magische effecten\n_Giant (blauw):_ -80% schade opgelopen, +1 mêlee-bereik, kan niet in tunnels bewegen\n_Blessed (geel):_ 4x nauwkeurigheid en ontwijking\n_Growing (rood):_ +20% nauwkeurigheid, ontwijking, schade en effectieve HP. Verhoogt met 1% elke 4 beurten.
challenges.darkness=In de duisternis
challenges.darkness_desc=Het is tenslotte een kerker!\n\n- Normale zichtafstand drastisch verminderd\n- Op elke verdieping verschijnt een fakkel\n- Andere lichtbronnen zijn 1/5 zo effectief
challenges.no_armor=Geloof is mijn pantser.
challenges.no_armor_desc=Je zult vertrouwen in jezelf moeten hebben, want je pantser zal niet veel helpen!\n\n- Basisblokkeerkracht verminderd voor alle pantsers behalve stoffen pantsers\n- Alle pantsers krijgen nu zeer weinig extra blokkeerkracht na een upgrade\n- De verdedigingskracht van de Aardbewaker is ook aanzienlijk verminderd
challenges.no_food=Op dieet
challenges.no_food_desc=Er is al weinig voedsel, maar je moet ook nog op je porties letten!\n\n- Voedsel en de hoorn des overvloeds stillen de honger slechts voor een derde.\n- Andere bronnen van verzadiging blijven onaangetast.
challenges.no_healing=Farmacofobie
challenges.no_healing_desc=Genezende drankjes zijn zeker handig, maar helaas ben je er allergisch voor!\n\n- Genezende drankjes, items die genezende drankjes in hun recept gebruiken en zonnevruchten zullen de held vergiftigen in plaats van hem te genezen.\n- Onstabiele brouwsels kunnen de held niet willekeurig vergiftigen of genezen.\n- Deze items werken nog steeds normaal voor andere personages.
challenges.no_herbalism=Onvruchtbaar land
challenges.no_herbalism_desc=Er lijkt geen schoon water meer over te zijn in deze vervloekte kerker...\n\n- Dauwdruppels worden verwijderd\n- Planten worden verwijderd\n- Zaden verschijnen nog wel, maar zullen geen wortel schieten
challenges.no_scrolls=Verboden runen
challenges.no_scrolls_desc=Een bepaalde rune is moeilijker te vinden. Helaas is het altijd de meest bruikbare.\n\n- De helft van de upgrade-rollen in de kerker is verwijderd
challenges.stronger_bosses=Slechtere bazen
challenges.stronger_bosses_desc=Bazen zijn veel lastiger met deze uitdaging!\n\n_Goo:_ +20% gezondheid\n_-_ Genezing in water neemt toe, tot 3/beurt\n_-_ Pompt op in 1 beurt in plaats van 2\n_Tengu:_ +25% gezondheid\n_-_ Fase 1: vallen zijn veel dodelijker\n_-_ Fase 2: vaardigheden komen vaker voor\n_DM-300:_ +33% gezondheid\n_-_ Pylonen zijn sterker en activeren 3 keer\n_-_ Vaardigheden zijn krachtiger en komen vaker voor\n_-_ DM-300 is sneller wanneer hij supercharged is\n_-_ Blootliggende draden zijn twee keer zo common\n_Dwergkoning:_ +50% gezondheid\n_-_ Minions zijn sterker in alle fasen\n_-_ Fase 1: snellere vaardigheden en oproepen\n_-_ Fase 2: 2 extra minions per ronde\n_-_ Fase 3: 2x gezondheid, snellere oproepen\n_Yog-Dzewa:_\n_-_ Twee vuisten worden tegelijk opgeroepen!\n_-_ +60% laserschade\n_-_ Sterkere minions
challenges.swarm_intelligence=Zwermintelligentie
challenges.swarm_intelligence_desc=Pas op, de monsters in de kerker worden steeds slimmer!\n\n- Wanneer een vijand je opmerkt, worden vijanden in de buurt naar die locatie getrokken.
