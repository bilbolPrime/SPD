challenges.champion_enemies=Những nhà vô địch thù địch
challenges.champion_enemies_desc=Bạn không phải là người duy nhất có thể lên cấp!\n\nKẻ thù thông thường có 1/8 cơ hội xuất hiện với hiệu ứng tăng sức mạnh đặc biệt của tướng ở tầng 1, tăng lên 1/6 ở tầng 21.\n\n- Tướng sẽ tỉnh dậy nếu chúng xuất hiện trong trạng thái ngủ.\n- Anh hùng biết khi nào một tướng xuất hiện.\n- Tướng không thể biến thành đồng minh.\n\nCó sáu loại tướng địch:\n_Bùng cháy (màu cam):_ +25% sát thương cận chiến, bốc cháy khi trúng đòn, lan lửa khi chết, không thể đốt cháy ô nước.\n_Phóng chiếu (màu tím):_ +25% sát thương cận chiến, +3 tầm đánh cận chiến.\n_Chống phép (màu xanh lá cây):_ -50% sát thương nhận vào, miễn nhiễm với phép thuật. effects\n_Giant (xanh dương):_ -80% sát thương nhận vào, +1 tầm đánh cận chiến, không thể di chuyển vào đường hầm\n_Blessed (vàng):_ Độ chính xác và né tránh gấp 4 lần\n_Growing (đỏ):_ +20% độ chính xác, né tránh, sát thương và HP hiệu quả. Tăng 1% sau mỗi 4 lượt.
challenges.darkness=Vào bóng tối
challenges.darkness_desc=Dù sao thì đây cũng là một ngục tối!\n\n- Khoảng cách nhìn thấy thông thường bị giảm đáng kể\n- Một ngọn đuốc xuất hiện trên mỗi tầng\n- Các nguồn sáng khác chỉ hiệu quả bằng 1/5
challenges.no_armor=Đức tin là áo giáp của tôi
challenges.no_armor_desc=Bạn cần có niềm tin vào bản thân, vì bộ giáp của bạn sẽ không giúp được nhiều!\n\n- Sức mạnh phòng thủ cơ bản giảm đối với tất cả các loại giáp trừ giáp vải\n- Tất cả các loại giáp giờ đây chỉ tăng rất ít khả năng phòng thủ khi được nâng cấp\n- Sức mạnh phòng thủ của người bảo vệ Trái Đất cũng giảm đáng kể
challenges.no_food=Đang ăn kiêng
challenges.no_food_desc=Lương thực vốn đã khan hiếm, nhưng bạn còn phải chú ý đến khẩu phần ăn của mình nữa!\n\n- Lương thực và chiếc sừng sung túc chỉ có hiệu quả bằng một phần ba trong việc làm thỏa mãn cơn đói\n- Các nguồn gây no khác không bị ảnh hưởng
challenges.no_healing=Chứng sợ dược phẩm
challenges.no_healing_desc=Thuốc hồi phục quả thật rất tiện dụng, nhưng tiếc là bạn lại bị dị ứng!\n\n- Thuốc hồi phục, vật phẩm sử dụng thuốc hồi phục trong công thức, và quả hướng dương sẽ gây độc cho anh hùng thay vì chữa lành vết thương.\n- Các loại thuốc không ổn định không thể ngẫu nhiên gây độc hoặc chữa lành vết thương cho anh hùng.\n- Những vật phẩm này vẫn hoạt động bình thường đối với các nhân vật khác.
challenges.no_herbalism=Vùng đất cằn cỗi
challenges.no_herbalism_desc=Dường như chẳng còn chút nước sạch nào trong hầm ngục đáng nguyền rủa này nữa...\n\n- Giọt sương đã biến mất\n- Cây cối đã biến mất\n- Hạt giống vẫn xuất hiện nhưng không nảy mầm
challenges.no_scrolls=Những ký tự ma thuật bị cấm
challenges.no_scrolls_desc=Một loại rune nhất định rất khó tìm. Thật không may, đó lại luôn là loại hữu ích nhất.\n\n- Một nửa số cuộn nâng cấp của hầm ngục đã bị loại bỏ
challenges.stronger_bosses=Sếp tồi
challenges.stronger_bosses_desc=Các trùm sẽ khó nhằn hơn nhiều với thử thách này!\n\n_Goo:_ +20% máu\n_-_ Hồi máu trong nước tăng lên, lên 3/lượt\n_-_ Bơm trong 1 lượt thay vì 2\n_Tengu:_ +25% máu\n_-_ Giai đoạn 1: bẫy nguy hiểm hơn nhiều\n_-_ Giai đoạn 2: kỹ năng xuất hiện thường xuyên hơn\n_DM-300:_ +33% máu\n_-_ Cột điện cứng hơn và 3 cột được kích hoạt\n_-_ Kỹ năng mạnh hơn và xuất hiện thường xuyên hơn\n_-_ DM-300 nhanh hơn khi siêu nạp\n_-_ Dây điện hở nguy hiểm gấp đôi common\n_Vua Lùn:_ +50% máu\n_-_ Lính mạnh hơn ở mọi giai đoạn\n_-_ Giai đoạn 1: kỹ năng và triệu hồi nhanh hơn\n_-_ Giai đoạn 2: thêm 2 lính mỗi vòng\n_-_ Giai đoạn 3: gấp đôi máu, triệu hồi nhanh hơn\n_Yog-Dzewa:_\n_-_ Triệu hồi hai nắm đấm cùng lúc!\n_-_ +60% sát thương laser\n_-_ Lính mạnh hơn
challenges.swarm_intelligence=Trí tuệ bầy đàn
challenges.swarm_intelligence_desc=Cẩn thận, quái vật trong hầm ngục ngày càng thông minh hơn!\n\n- Khi kẻ thù phát hiện ra bạn, những kẻ thù gần đó sẽ bị thu hút đến vị trí đó.
