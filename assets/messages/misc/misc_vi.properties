library.items.soulcrystal.name=tinh thể linh hồn đã đầy
library.items.soulcrystal.desc=Tinh thể chứa một linh hồn bị bắt giữ. Ném nó để triệu hồi linh hồn phục vụ bạn.
library.items.dreamweed.name=hạt cỏ mộng
library.items.dreamweed.desc=Khi bị chạm vào, cỏ mộng phả ra đám khí lấp lánh gây lú lẫn.
library.items.bag.desc=Ba lô đựng đồ của bạn.
library.items.armor.huntressarmor.desc=Áo choàng cho phép nữ thợ săn phóng một lưỡi kiếm linh hồn vào mỗi kẻ địch nhìn thấy. Sát thương phụ thuộc vào vũ khí cận chiến đang trang bị.
library.items.armor.magearmor.desc=Áo choàng cho phép pháp sư thiêu đốt và giữ chân mọi kẻ địch nhìn thấy bằng phép đất nóng chảy.
library.items.armor.roguearmor.desc=Bộ đồ cho phép đạo tặc dùng bom khói làm mù những kẻ địch đang nhìn thấy mình rồi nhảy sang bên.
library.items.armor.warriorarmor.desc=Áo giáp cho phép chiến binh nhảy đến vị trí đã chọn, làm choáng kẻ địch liền kề khi tiếp đất.
library.items.flamebow.desc=Cây cung ma thuật có mũi tên có thể thiêu đốt mục tiêu.
library.items.frostbow.desc=Cây cung ma thuật có mũi tên có thể đóng băng mục tiêu.
library.items.necroblade.desc=Lưỡi kiếm rèn bằng hắc thuật nuốt linh hồn nạn nhân để mạnh lên.\n\nTừ cấp 5, khi nạp đầy năng lượng, kiếm có thể bắn _Đạn bóng tối_, phá hủy bản thể của mục tiêu và biến nó thành tay sai.
library.items.soulblade.desc=Lưỡi kiếm lấy sức mạnh từ linh hồn người cầm.\n\n_Cấp 3: hồi 20 máu với 20 mana_\n\n_Cấp 5: hóa giải lời nguyền với 50 mana_\n\n_Cấp 7: dùng hết mana để gây sát thương lên kẻ địch; cần ít nhất 50 mana_
library.items.wands.wandofdisintegration.desc=Tia hủy diệt xuyên qua sinh vật. Càng trúng nhiều mục tiêu, mỗi mục tiêu càng chịu nhiều sát thương.
library.items.wands.wandoflightning.desc=Các luồng điện đánh trúng nhiều sinh vật đứng gần nhau.
library.items.wands.wandofmagicmissile.desc=Phóng năng lượng phép thuật thuần túy, gây sát thương vừa phải lên một sinh vật.
library.items.wands.wandofregrowth.desc=Làm cỏ mọc dọc đường đi và cây cối mọc dày tại điểm va chạm. Pháp sư và pháp sư gọi hồn có thể dùng Phước lành thiên nhiên, tốn 40 mana để tạo một hạt giống ngẫu nhiên.
library.class_armor_stats=Khả năng bảo vệ và yêu cầu sức mạnh phụ thuộc vào áo giáp ban đầu.
library.bow_stats=Nhân sát thương mũi tên với _%.2f_. Sát thương gốc phụ thuộc vào mũi tên.
library.strength=Cần _%d sức mạnh_.
library.weapon_stats=Gây _%1$d-%2$d sát thương_ và cần _%3$d sức mạnh_.
library.ring_level=Cấp nhẫn: _%+d_.
library.ring_accuracy=Hệ số chính xác: _%1$.2f_. Thay đổi kỹ năng tấn công, không trực tiếp thay đổi tỷ lệ đánh trúng.
library.ring_evasion=Hệ số né tránh: _%1$.2f_. Thay đổi kỹ năng phòng thủ, không trực tiếp thay đổi tỷ lệ né.
library.ring_haste=Hệ số thời gian hành động: _%1$.2f_. Giá trị thấp hơn giúp hành động nhanh hơn.
library.ring_shadows=Ẩn nấp: _%+d_.
library.ring_mending=Khi chưa tính kỹ năng hồi phục, hồi _1 máu mỗi %1$.2f lượt_ nếu bị thương và không đói lả.
library.ring_satiety=Tăng _%d độ đói_ mỗi nhịp đói thay vì 10. Tần suất còn phụ thuộc vào lớp nhân vật và hiệu ứng tạm thời.
