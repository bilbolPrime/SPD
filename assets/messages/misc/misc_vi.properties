library.quest.wandmaker_berry.name=Một hạt quả mâm xôi
library.quest.wandmaker_berry.desc=Tìm cây quả mâm xôi trong nhà tù và mang hạt của nó cho người chế tạo đũa phép.
library.quest.wandmaker_dust.name=Bụi xác chết
library.quest.wandmaker_dust.desc=Lục các đống xương trong nhà tù để tìm bụi xác chết và mang cho người chế tạo đũa phép.
library.quest.wandmaker_fish.name=Con cá ma
library.quest.wandmaker_fish.desc=Tìm cá ma trong nước ở nhà tù và mang cho người chế tạo đũa phép.
library.quest.blacksmith_gold.name=Vàng đen
library.quest.blacksmith_gold.desc=Đào 15 mảnh vàng đen rồi mang chúng cùng chiếc cuốc về cho thợ rèn.
library.quest.blacksmith_blood.name=Máu dơi
library.quest.blacksmith_blood.desc=Giết một con dơi bằng cuốc của thợ rèn rồi trả lại chiếc cuốc dính máu.
library.quest.imp_golems.name=Săn golem
library.quest.imp_golems.desc=Thu thập 6 thẻ người lùn từ golem và mang cho tiểu quỷ.
library.quest.imp_monks.name=Săn tu sĩ
library.quest.imp_monks.desc=Thu thập 8 thẻ người lùn từ tu sĩ và mang cho tiểu quỷ.
library.quest.ghost.reward=Chọn một vũ khí hoặc một bộ giáp.
library.quest.wandmaker.reward=Chọn một trong hai cây đũa phép đã nâng cấp.
library.quest.blacksmith.reward=Một lần rèn lại: ghép hai món đồ cùng loại để nâng cấp món tốt hơn.
library.quest.imp.reward=Một chiếc nhẫn đã nâng cấp nhưng bị nguyền. Tiểu quỷ cũng mở cửa hàng trước Sảnh Quỷ.
