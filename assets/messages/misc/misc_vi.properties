rebornchallenges.blood_magic=Huyết thuật
rebornchallenges.blood_magic_desc=Kỹ năng chủ động còn tốn lượng máu bằng lượng mana tiêu hao. Bạn không thể dùng kỹ năng nếu lượng máu mất đi sẽ khiến bạn chết.
rebornchallenges.oathbound=Ràng buộc lời thề
rebornchallenges.oathbound_desc=Không thể tháo trang bị cho đến khi đánh bại trùm của vùng. Mỗi ô trống chỉ được lắp trang bị một lần. Bạn vẫn có thể nâng cấp và phù phép trang bị.
