library.ring_haggler=Halbiert Kaufpreise ab 2 Gold, abgerundet.
library.ring_thorns=Wirft zufällig zwischen null und dem Schaden des eingehenden Angriffs zurück, noch vor dem Rüstungsschutz.
library.gun_modifiers=Geschwindigkeitsbalance und Verzauberungen beeinflussen abgefeuerte Schüsse nicht.
library.items.weapon.melee.battleaxe.desc=Der gewaltige Stahlkopf dieser Streitaxt verleiht jedem weiten Hieb beträchtliches Gewicht.
library.items.weapon.melee.dagger.desc=Ein einfacher Eisendolch mit abgenutztem Holzgriff.
library.items.weapon.melee.glaive.desc=Eine massive Stangenwaffe, bestehend aus einer Schwertklinge am Ende einer Stange.
library.items.weapon.melee.longsword.desc=Die lange, rasiermesserscharfe Stahlklinge dieses Schwertes glänzt beruhigend, allerdings ist es aufgrund seiner Größe recht schwer.
