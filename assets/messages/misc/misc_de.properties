library.ring_shadows=Heimlichkeit: _%+d_.
library.ring_mending=Ohne Regenerationsfähigkeiten: _1 Gesundheit alle %1$.2f Runden_, solange du verletzt bist und nicht verhungerst.
library.ring_satiety=Erhöht den Hunger pro Hungertakt um _%d_ statt 10. Wie oft er steigt, hängt auch von Klasse und vorübergehenden Effekten ab.
library.ring_power=Zauberstabstärke: _%+d_. Jeder Stab nutzt diesen Bonus anders.
library.ring_detection=Suchradius: _%d Felder_. Negative Stufen senken auch die Chance, Geheimnisse zu entdecken.
library.ring_elements=Chance auf Elementarwiderstand: _%1$.1f%%_. Die Dauer betroffener negativer Effekte wird mit _%2$.2f_ multipliziert.
