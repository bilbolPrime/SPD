library.items.weapon.melee.shortsword.desc=Ein recht kurzes Schwert, nur wenige Zentimeter länger als ein Dolch.
library.items.weapon.melee.sword.desc=Ein schön ausbalanciertes Schwert. Nicht zu groß, aber dennoch deutlich länger als ein Kurzschwert.
library.items.weapon.melee.warhammer.desc=Nur wenige Lebewesen können dem vernichtenden Schlag dieser gewaltigen Masse aus Blei und Stahl widerstehen, doch es bedarf großer Kraft, sie effektiv einzusetzen.
library.items.weapon.missiles.javelin.desc=Diese Wurfspeere sind so ausbalanciert, dass sie mit der Spitze voran fliegen.
