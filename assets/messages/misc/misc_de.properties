library.items.soulcrystal.name=gefüllter Seelenkristall
library.items.soulcrystal.desc=Ein Kristall mit einem gefangenen Geist. Wirf ihn, um den Geist als Verbündeten zu beschwören.
library.items.dreamweed.name=Traumkrautsamen
library.items.dreamweed.desc=Bei Berührung gibt Traumkraut eine glitzernde Gaswolke ab, die Verwirrung verursacht.
library.items.bag.desc=Ein Rucksack für deine Habseligkeiten.
library.items.armor.huntressarmor.desc=Mit diesem Mantel wirft die Jägerin eine Geisterklinge auf jeden sichtbaren Feind. Der Schaden hängt von ihrer angelegten Nahkampfwaffe ab.
library.items.armor.magearmor.desc=Mit dieser Robe kann der Magier alle sichtbaren Feinde durch geschmolzene Erde verbrennen und festhalten.
library.items.armor.roguearmor.desc=Dieses Gewand ermöglicht dem Schurken, sichtbare Feinde mit einer Rauchbombe zu blenden und zur Seite zu springen.
library.items.armor.warriorarmor.desc=Diese Rüstung lässt den Krieger zum gewählten Ort springen. Bei der Landung betäubt er angrenzende Feinde.
library.items.flamebow.desc=Ein verzauberter Bogen, dessen Pfeile Ziele in Brand setzen können.
library.items.frostbow.desc=Ein verzauberter Bogen, dessen Pfeile Ziele einfrieren können.
library.items.necroblade.desc=Diese Klinge aus dunkler Magie verschlingt die Seelen ihrer Opfer und wird dadurch stärker.\n\nAb Stufe 5 kann die voll aufgeladene Klinge _Dunkles Geschoss_ wirken. Es kann die Essenz eines Ziels zerstören und es versklaven.
library.items.soulblade.desc=Diese Klinge schöpft ihre Kraft aus der Seele ihres Trägers.\n\n_Stufe 3: 20 Gesundheit für 20 Mana heilen_\n\n_Stufe 5: Flüche für 50 Mana aufheben_\n\n_Stufe 7: Alles Mana einsetzen, um Feinde zu treffen; mindestens 50 Mana_
library.items.wands.wandofdisintegration.desc=Ein zerstörerischer Strahl durchdringt Kreaturen. Je mehr er trifft, desto mehr Schaden erleidet jede davon.
library.items.wands.wandoflightning.desc=Tödliche Blitze springen zwischen nahe beieinander stehenden Kreaturen über.
library.items.wands.wandofmagicmissile.desc=Verschießt reine magische Energie, die einer Kreatur mäßigen Schaden zufügt.
library.items.wands.wandofregrowth.desc=Lässt entlang seiner Bahn Gras und am Ziel dichte Pflanzen wachsen.
library.class_armor_stats=Schutz und benötigte Stärke hängen von der ursprünglichen Rüstung ab.
library.bow_stats=Multipliziert Pfeilschaden mit _%.2f_. Der Grundschaden hängt vom Pfeil ab.
