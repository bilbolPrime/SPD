pets.desc_2=Ein friedlicher Schleimklumpen, ganz anders als Goo. Besiege Goo, um diesen Begleiter freizuschalten.
pets.desc_3=Dieser kleine Ninja folgt dir lautlos. Besiege Tengu, um diesen Begleiter freizuschalten.
pets.desc_4=Eine winzige Maschine, die es nicht eilig hat. Besiege DM-300, um diesen Begleiter freizuschalten.
pets.desc_5=Ein Stückchen Winter auf deinen Spuren. Besiege Altfrost, um diesen Begleiter freizuschalten.
pets.desc_6=Ein Auge auf deinen Reisen. Besiege Yog, um diesen Begleiter freizuschalten.
