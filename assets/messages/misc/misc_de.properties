challenges.champion_enemies=Feindliche Champions
challenges.champion_enemies_desc=Nicht nur du kannst aufsteigen! Normale Gegner haben auf Ebene 1 eine Chance von 1/8, mit einem speziellen Champion-Buff zu erscheinen, die auf Ebene 21 auf 1/6 steigt. Champions wachen auf, wenn sie schlafend erscheinen. Der Held weiß, wann ein Champion erscheint. Champions können nicht in Verbündete verwandelt werden. Es gibt sechs Arten von Champion-Gegnern: Flammend (orange): +25 % Nahkampfschaden, entzündet sich bei Treffer, verbreitet Flammen beim Tod, kann keine Wasserfelder entzünden. Projektiv (lila): +25 % Nahkampfschaden, +3 Nahkampfreichweite. Antimagisch (grün): -50 % erlittener Schaden, immun gegen Magieeffekte. Riese (blau): -80 % erlittener Schaden, +1 Nahkampfreichweite, kann sich nicht in Tunnel bewegen. Gesegnet (gelb): 4-fache Genauigkeit und Ausweichchance. Wachsend (rot): +20 % Genauigkeit, Ausweichchance, Schaden und effektive LP. Erhöht sich alle 4 Runden um 1 %.
challenges.darkness=In die Dunkelheit
challenges.darkness_desc=Es ist schließlich ein Verlies! – Normale Sichtweite drastisch reduziert – Auf jeder Ebene erscheint eine Fackel – Andere Lichtquellen sind nur noch 1/5 so effektiv
challenges.no_armor=Glaube ist meine Rüstung
challenges.no_armor_desc=Du musst an dich selbst glauben, denn deine Rüstung wird nicht viel nützen! ZXQPH0 ZXQ ZXQPH1 ZXQ – Die Grundblockkraft aller Rüstungen außer Stoffrüstungen wurde reduziert. ZXQPH2 ZXQ – Alle Rüstungen erhalten beim Aufwerten nur noch sehr wenig Blockkraft. ZXQPH3 ZXQ – Die Verteidigungskraft des Erdwächters wurde ebenfalls deutlich reduziert.
challenges.no_food=Auf Diät
challenges.no_food_desc=Nahrungsmittel sind bereits knapp, aber Sie müssen auch auf Ihre Portionsgrößen achten! – Essen und das Füllhorn stillen den Hunger nur zu einem Drittel so effektiv. – Andere Sättigungsquellen sind davon nicht betroffen.
challenges.no_healing=Pharmakophobie
challenges.no_healing_desc=Heiltränke sind wirklich praktisch, aber leider bist du allergisch! \n\n – Heiltränke, Gegenstände, die Heiltränke in ihrer Rezeptur verwenden, und Sonnenfrüchte vergiften den Helden, anstatt ihn zu heilen. \n – Instabile Gebräue können den Helden nicht zufällig vergiften oder heilen. \n – Diese Gegenstände funktionieren für andere Charaktere weiterhin normal.
challenges.no_herbalism=Ödland
challenges.no_herbalism_desc=In diesem verfluchten Verlies scheint es kein sauberes Wasser mehr zu geben...\n\n – Tautropfen verschwinden – Pflanzen verschwinden – Samen erscheinen zwar noch, keimen aber nicht.
challenges.no_scrolls=Verbotene Runen
challenges.no_scrolls_desc=Eine bestimmte Rune ist schwerer zu finden. Leider ist sie immer die nützlichste. – Die Hälfte der Dungeon-Aufwertungsrollen wurde entfernt.
challenges.stronger_bosses=Bösere Bosse
challenges.stronger_bosses_desc=Bosse sind in dieser Herausforderung deutlich stärker! \n\n_Goo: +20 % Gesundheit \n_-_ Heilung im Wasser erhöht sich auf 3/Runde \n_-_ Pumpt sich in 1 Runde statt 2 auf \n_Tengu: +25 % Gesundheit \n_-_ Phase 1: Fallen sind viel tödlicher \n_-_ Phase 2: Fähigkeiten werden häufiger eingesetzt \n_DM-300: +33 % Gesundheit \n_-_ Pylone sind widerstandsfähiger und 3 werden aktiviert \n_-_ Fähigkeiten sind stärker und häufiger \n_-_ DM-300 ist schneller, wenn er aufgeladen ist \n_-_ Freiliegende Drähte sind doppelt so gefährlich \n_Zwergenkönig: +50 % Gesundheit \n_-_ Diener sind in allen Phasen stärker \n_-_ Phase 1: Schnellere Fähigkeiten und Beschwörungen \n_-_ Phase 2: 2 zusätzliche Diener pro Runde \n_-_ Phase 3: Doppelte Gesundheit, schnellere Beschwörungen \n_Yog-Dzewa: \n_-_ Es werden zwei Fäuste gleichzeitig beschworen! \n_-_ +60 % Laserschaden \n_-_ Stärkere Diener
challenges.swarm_intelligence=Schwarmintelligenz
challenges.swarm_intelligence_desc=Vorsicht, die Dungeon-Monster werden immer schlauer! \n\n – Sobald dich ein Gegner bemerkt, werden Feinde in der Nähe zu diesem Ort angelockt.
