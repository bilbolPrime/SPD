challenges.champion_enemies=Düşman şampiyonlar
challenges.champion_enemies_desc=Seviye atlayabilen tek kişi sen değilsin! \n\nNormal düşmanların 1. katta özel bir şampiyon güçlendirmesiyle ortaya çıkma şansı 1/8'dir ve bu oran 21. katta 1/6'ya yükselir. \n\n- Şampiyonlar uykuda ortaya çıkarlarsa uyanırlar. \n- Kahraman bir şampiyonun ortaya çıktığını bilir. \n- Şampiyonlar müttefike dönüştürülemez. \n\nAltı tür şampiyon düşman vardır: \n_Alevli (turuncu):_ +%25 yakın dövüş hasarı, vurulduğunda tutuşur, öldüğünde alev yayar, su karolarını tutuşturamaz. \n_Yansıtmalı (mor):_ +%25 yakın dövüş hasarı, +3 yakın dövüş menzili. \n_Büyü Karşıtı (yeşil):_ Alınan hasar %50 azalır, büyülü etkilere karşı bağışıklık \n_Dev (mavi):_ Alınan hasar %80 azalır, yakın dövüş menzili +1 artar, tünellere giremez \n_Kutsanmış (sarı):_ 4 kat isabet ve kaçınma \n_Büyüyen (kırmızı):_ +%20 isabet, kaçınma, hasar ve etkili HP. Her 4 turda %1 artar.
challenges.darkness=Karanlığa doğru
challenges.darkness_desc=Sonuçta burası bir zindan! \n\n- Normal görüş mesafesi önemli ölçüde azaldı \n- Her katta bir meşale belirdi \n- Diğer ışık kaynaklarının etkinliği 1/5 oranında azaldı
challenges.no_armor=İnanç benim zırhımdır.
challenges.no_armor_desc=Kendinize güvenmeniz gerekecek, çünkü zırhınız pek işe yaramayacak! \n\n- Kumaş zırhlar hariç tüm zırhların temel engelleme gücü azaltıldı \n- Tüm zırhlar artık yükseltildiğinde çok az engelleme kazanıyor \n- Toprak koruyucunun savunma gücü de önemli ölçüde azaltıldı
challenges.no_food=Diyette
challenges.no_food_desc=Yiyecekler zaten kıt, ama porsiyonlarınıza da dikkat etmelisiniz!\n\n- Yiyecek ve bolluk boynuzu, açlığı gidermede üçte bir oranında daha az etkilidir.\n- Diğer tokluk kaynakları etkilenmez.
challenges.no_healing=İlaç korkusu
challenges.no_healing_desc=İyileştirici iksirler gerçekten işe yarıyor, ne yazık ki alerjiniz var! \n\n- İyileştirici iksirler, tarifinde iyileştirici iksir kullanan eşyalar ve ayçiçek meyvesi kahramanı iyileştirmek yerine zehirleyecektir. \n- Kararsız karışımlar kahramanı rastgele zehirleyemez veya iyileştiremez. \n- Bu eşyalar diğer karakterler için normal şekilde çalışmaya devam eder.
challenges.no_herbalism=Çorak arazi
challenges.no_herbalism_desc=Bu lanetli zindanda temiz su kalmamış gibi görünüyor...\n\n- Çiğ damlaları kaldırıldı\n- Bitkiler kaldırıldı\n- Tohumlar hala görünüyor, ancak kök salmıyor
challenges.no_scrolls=Yasaklanmış rünler
challenges.no_scrolls_desc=Belli bir rünü bulmak daha zor. Ne yazık ki, her zaman en kullanışlı olanı o oluyor.\n\n- Zindanın yükseltme parşömenlerinin yarısı kaldırıldı.
challenges.stronger_bosses=Daha kötü patronlar
challenges.stronger_bosses_desc=Bu mücadelede patronlar çok daha zorlu! \n\n_Goo:_ +%20 sağlık \n_-_ Suda iyileşme hızı tur başına 3'e çıkıyor \n_-_ 2 tur yerine 1 turda canlanıyor \n_Tengu:_ +%25 sağlık \n_-_ Aşama 1: Tuzaklar çok daha ölümcül \n_-_ Aşama 2: Yetenekler daha sık \n_DM-300:_ +%33 sağlık \n_-_ Pilonlar daha dayanıklı ve 3'ü aktif \n_-_ Yetenekler daha güçlü ve daha sık \n_-_ DM-300 süper şarj olduğunda daha hızlı \n_-_ Açıkta kalan teller iki kat daha fazla common\n_Cüce Kral:_ +%50 can\n_-_ Minyonlar tüm aşamalarda daha güçlü\n_-_ Aşama 1: Daha hızlı yetenekler ve çağrılar\n_-_ Aşama 2: Tur başına 2 minyon daha fazla\n_-_ Aşama 3: 2 kat can, daha hızlı çağrılar\n_Yog-Dzewa:_\n_-_ Aynı anda iki yumruk çağrılır!\n_-_ +%60 lazer hasarı\n_-_ Daha güçlü minyonlar
