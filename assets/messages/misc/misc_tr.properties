library.items.necroblade.desc=Kara büyüyle dövülen bu kılıç, kurbanlarının ruhlarını yutarak güçlenir.\n\n5. seviyeden itibaren tamamen dolu kılıç _Karanlık Atış_ yapabilir. Bu atış hedefin özünü yok edip onu hizmetkâra dönüştürebilir.
