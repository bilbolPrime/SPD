journey.title=Viaggio
journey.intro=Yog si è impadronito dell'Amuleto e le sue forze stanno già raggiungendo la superficie.\n\nGuida sei eroi attraverso le terre occupate. Scegli un percorso e un eroe per ogni spedizione. Chi cade non tornerà per il resto del viaggio.
