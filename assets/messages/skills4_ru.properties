skills4.smash.intro=Ударяет соседнего врага грубой силой.
skills4.endurance.intro=Увеличивает ваше максимальное здоровье.
skills4.firm_hand.intro=Повышает вашу точность в ближнем бою.
skills4.regeneration.intro=Постепенно восстанавливает дополнительное здоровье. Не действует при голодании.
skills4.toughness.intro=Уменьшает входящий урон, кроме голодания.
skills4.knockback.intro=Ударяет врага и отталкивает его на одну клетку назад. Боссов нельзя толкать.
skills4.second_wind.intro=Мгновенно восстанавливает немного здоровья.
skills4.sure_footing.intro=Сокращает длительность опутывания и увечья.
skills4.mastery.intro=Позволяет пользоваться более тяжёлым оружием ближнего боя и атаковать быстрее.
skills4.parry.intro=Уменьшает следующий получаемый вами удар в ближнем бою. Защита длится до четырех ходов.
skills4.smite.intro=Наносит тяжёлый удар, игнорирующий половину брони цели. Занимает два хода.
skills4.riposte.intro=Усиливает ваш следующий удар в ближнем бою после блока. Длится четыре хода.
skills4.footwork.intro=Дает вам больше времени между ударами ближнего боя для поддержания комбо.
skills4.duelist.intro=Увеличивает уклонение, пока рядом с вами стоит ровно один враг.
skills4.disarming_strike.intro=Ударяет врага и ослабляет его на три хода.
skills4.find_the_gap.intro=Третий подряд удар в ближнем бою и каждый следующий пробивают часть брони цели.
skills4.aggression.intro=Ваш урон в ближнем бою увеличивается по мере потери здоровья.
skills4.charge.intro=Бросается на врага на расстоянии до четырех клеток и поражает его. Требуется свободный путь.
skills4.rampage.intro=Поражает каждого соседнего врага.
skills4.bloodlust.intro=Ускоряет атаки ближнего боя на три хода после убийства.
skills4.war_cry.intro=Ослабляет видимых врагов в пределах двух клеток.
skills4.rend.intro=Натиск и Буйство вызывают кровотечение у выживших врагов.
skills4.relentless.intro=Убийство врага сокращает оставшееся время восстановления Натиска и Боевого клича.
skills4.cornered.intro=Уменьшает получаемый урон в ближнем бою, когда вас окружают два или более врагов.

skills4.spark.intro=Выпускает искру в видимого врага.
skills4.spirituality.intro=Увеличивает максимальную ману.
skills4.sorcerer.intro=Ваши палочки наносят больше урона.
skills4.summon_rat.intro=Призывает крысу, которая сражается за вас.
skills4.meditation.intro=Постепенно восстанавливает дополнительную ману.
skills4.spirit_armor.intro=Поглощает урон, расходуя единицу маны за каждую единицу поглощённого урона.
skills4.wizard.intro=Ваши палочки заряжаются быстрее.
skills4.channeling.intro=Сокращает время восстановления активных навыков минимум до одного хода.
skills4.charged_staff.intro=Удары жезлом в ближнем бою восстанавливают ману.
skills4.arcane_ward.intro=Уменьшает следующий получаемый вами удар в ближнем бою. Оберег действует до четырех ходов.
skills4.arcane_strike.intro=Наносит магический удар, игнорирующий половину брони цели.
skills4.conductive.intro=Накопленные заряды усиливают удары жезлом в ближнем бою. Каждое попадание расходует один заряд вместо перезарядки жезла.
skills4.discharge.intro=Наносит урон всем соседним врагам взрывом магии.
skills4.spellweave.intro=Увеличивает урон жезла на три хода после нанесения удара в ближнем бою.
skills4.drain_life.intro=Наносит урон врагу и исцеляет вас на половину потерянного здоровья.
skills4.rabid_minions.intro=Ваши призванные существа наносят больше урона.
skills4.summon_skeleton.intro=Призывает скелета, который сражается за вас.
skills4.soul_hunger.intro=Восстанавливает ману, когда вы убиваете врага.
skills4.enrage.intro=Пока навык включён, призванные существа наносят и получают больше урона.
skills4.slow.intro=Замедляет передвижение и атаки врага.
skills4.summoner.intro=Вы можете оставить себе еще одно призванное существо.
skills4.dark_pact.intro=Расходует пять единиц здоровья для восстановления маны. Требует хотя бы шесть единиц здоровья.

skills4.double_strike.intro=Наносит два удара подряд.
skills4.stealth.intro=Врагам сложнее вас заметить.
skills4.evasion.intro=Повышает ваш шанс уклониться от атак.
skills4.smoke_bomb.intro=Скрывает вас в облаке дыма. Атака снимает невидимость.
skills4.bandit.intro=Каждая подобранная кучка золота приносит больше монет.
skills4.venom.intro=Пока навык включён, удары в ближнем бою могут отравить цель.
skills4.locksmith.intro=У вас есть шанс обезвредить ловушку, когда вы наступите на нее.
skills4.light_step.intro=Сокращает длительность опутывания и увечья.
skills4.dash.intro=Перемещает вас на расстояние до двух клеток по свободному пути.
skills4.haste.intro=Увеличивает вашу скорость передвижения на пять ходов.
skills4.shadow_clone.intro=Создайте одного сильного клона или трех более слабых клонов, которые будут сражаться за вас.
skills4.escape.intro=Снимает опутывание и увечье, затем повышает уклонение на четыре хода.
skills4.trailblazer.intro=Увеличивает вашу скорость передвижения.
skills4.skirmish.intro=Движение усиливает ваш следующий удар в ближнем бою.
skills4.keep_distance.intro=Увеличивает уклонение от врагов, находящихся на расстоянии более одной клетки.
skills4.ambush.intro=Увеличивает урон в ближнем бою, пока вы невидимы.
skills4.scorpion.intro=Ваш яд наносит больше урона.
skills4.silent_death.intro=Атаки ближнего боя могут сразу убить спящих врагов. Боссы имеют иммунитет.
skills4.expose.intro=Ваши удары в ближнем бою игнорируют некоторую броню.
skills4.execution.intro=Увеличивает урон врагам, у которых осталось менее четверти здоровья.
skills4.deadly_throw.intro=Увеличивает урон от оружия дальнего боя.

skills4.accuracy.intro=Ваши дальние атаки более точны.
skills4.awareness.intro=У вас есть шанс увернуться от дальней атаки.
skills4.double_shot.intro=Выпускает две стрелы подряд. Расходует две обычные стрелы.
skills4.hunting.intro=Во время исследования находит сырое мясо.
skills4.fletching.intro=Делает обычные стрелы во время исследования.
skills4.ko_arrow.intro=Ваша следующая стрела замедляет цель и может усыпить ее.
skills4.woodcraft.intro=Врагам сложнее вас заметить.
skills4.quickdraw.intro=Ускоряет ваши дальние атаки.
skills4.barkskin.intro=Увеличивает вашу броню.
skills4.nature_mend.intro=Мгновенно восстанавливает немного здоровья.
skills4.entangle.intro=Приковывает видимого врага к месту.
skills4.herbalist.intro=Уменьшает урон от яда.
skills4.dew_keeper.intro=Увеличивает исцеление, получаемое от росы.
skills4.knee_shot.intro=Ваши стрелы могут покалечить цель.
skills4.thicket.intro=Уменьшает следующий получаемый вами удар в ближнем бою. Защита длится до четырех ходов.
skills4.aimed_shot.intro=Увеличивает урон от следующего попадания стрелы.
skills4.long_sight.intro=Увеличивает урон в дальнем бою против врагов на расстоянии как минимум четырех клеток.
skills4.piercing_shot.intro=Следующая стрела игнорирует часть брони цели.
skills4.iron_tip.intro=Железные наконечники позволяют стрелам проходить сквозь врагов и поражать тех, кто стоит за ними. Стены и союзники останавливают стрелу.
skills4.mark_prey.intro=Отмечает врага на шесть ходов, увеличивая ваш урон по нему.
skills4.bombvoyage.intro=Превратите стрелу в бомбу. Взрыв также может навредить вам и вашим союзникам.
skills4.follow_through.intro=Убийство усиливает ваш следующий удар дальнего боя на четыре хода.

skills4.curse.intro=Ослабляет атаки врага на десять ходов.
skills4.necro_spirit.intro=Увеличивает максимальную ману.
skills4.raise_skeleton.intro=Поднимает скелета из лежащего на земле трупа.
skills4.summon_ghost.intro=Призывает призрака, который сражается за вас.
skills4.soul_bind.intro=Увеличивает урон призванных существ.
skills4.necro_meditation.intro=Постепенно восстанавливает дополнительную ману.
skills4.necro_drain_life.intro=Высасывает здоровье врага и лечит вас на половину нанесённого урона.
skills4.master_of_death.intro=Возрождает с полным здоровьем и маной. Перед следующим возрождением сила должна восстановиться.
skills4.spirit_army.intro=Позволяет поддерживать ещё одно призванное существо.
skills4.mend_bones.intro=Лечит призванных существ в поле зрения.
skills4.guardian_bond.intro=Снижает урон, получаемый призванными существами.
skills4.corpse_explosion.intro=Взрывает труп. Взрыв поражает всех рядом с ним, включая вас и союзников.
skills4.raise_skeleton_archer.intro=Поднимает скелета-лучника из лежащего на земле трупа.
skills4.last_rites.intro=Дает каждому призванному один шанс пережить смертельный удар с четвертью здоровья.
skills4.soul_shelter.intro=Уменьшает следующий получаемый вами удар в ближнем бою. Оберег действует до четырех ходов.
skills4.cold_touch.intro=Ударяет врага и замедляет его на три хода.
skills4.necro_slow.intro=Замедляет передвижение и атаки врага.
skills4.bone_spear.intro=Выпускает во врага стрелу могильной магии.
skills4.death_fed.intro=Восстанавливает ману, когда вы убиваете врага.
skills4.cruel_study.intro=Увеличивает урон, наносимый жезлами.
skills4.withering_wave.intro=Наносит урон соседним врагам холодом и замедляет их на три хода.

skills4.steady_aim.intro=Ваша стрельба будет более точной.
skills4.packrat.intro=Увеличивает вместимость магазина огнестрельного оружия.
skills4.fast_reload.intro=Ускоряет перезарядку оружия.
skills4.quick_draw.intro=Ускоряет стрельбу.
skills4.veteran_company.intro=Наемники под вашим командованием наносят больший урон.
skills4.field_medicine.intro=Мгновенно восстанавливает немного здоровья.
skills4.powder.intro=Увеличивает урон от огнестрельного оружия.
skills4.steady_nerves.intro=Сокращает длительность опутывания и увечья.
skills4.volley.intro=Производит усиленный выстрел.
skills4.rally.intro=Исцеляет вас и ваших союзников в пределах двух клеток.
skills4.guard_order.intro=Наемники под вашим командованием получают меньше урона.
skills4.suppress.intro=Ваш следующий удар из огнестрельного оружия ослабит цель.
skills4.counter_fire.intro=Получение урона в ближнем бою усиливает ваш следующий удар огнестрельным оружием на четыре хода.
skills4.i_am_the_law.intro=Повышает максимальное и текущее здоровье на двадцать ходов.
skills4.headshot.intro=Ваш следующий выстрел нанесет больше урона и увеличит точность.
skills4.intimidate.intro=Пугает видимого врага. Боссы имеют иммунитет.
skills4.wanted.intro=Даёт золото за каждого убитого врага.
skills4.no_witnesses.intro=Ваш следующий выстрел нанесет больше урона и заставит выживших врагов бежать.
skills4.armor_piercer.intro=Ваши дальние удары игнорируют некоторую броню.
skills4.execute.intro=Выстрелы добивают тяжелораненых врагов. Боссы имеют иммунитет.
skills4.final_notice.intro=Ваш следующий выстрел из огнестрельного оружия игнорирует дополнительную броню.

