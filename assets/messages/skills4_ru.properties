skills4.subclass.gladiator=Успешные удары в ближнем бою образуют комбо, добавляя урон к последующим ударам.\n\n_+3 к точности в ближнем бою_\n_Атаки в ближнем бою на 10 % быстрее_
skills4.subclass.berserker=При здоровье ниже 40% ярость повышает урон на 50%.\n\n_На 10% больше урона в ближнем бою_\n_На 10% меньше получаемого урона_
skills4.subclass.battlemage=Удары жезлом в ближнем бою восстанавливают один заряд и добавляют число текущих зарядов к урону.\n\n_Искра с вероятностью 50% ослепляет цель на 3 хода._
skills4.subclass.warlock=Убийство врагов восстанавливает здоровье и утоляет голод.\n\n_Искра наносит 5 дополнительных повреждений._\n_Одно дополнительное призванное существо._
skills4.subclass.freerunner=Пока вы не обременены и не голодаете, вы двигаетесь на 60% быстрее и получаете двойное уклонение во время движения.
skills4.subclass.assassin=Внезапные атаки наносят дополнительный урон.\n\n_+1 скрытность_
skills4.subclass.warden=Вытаптывание высокой травы даёт Дубовую кожу. Растения могут оставить дополнительные семена и росу.
skills4.subclass.sniper=Дальние атаки игнорируют броню и отмечают цель, ускоряя следующую атаку.\n\n_На 20% больше урона в дальнем бою_
skills4.subclass.spirit_binder=Удары жезлом в ближнем бою восстанавливают один заряд и добавляют число текущих зарядов к урону.\n\n_Поднятые скелеты существуют вдвое дольше._
skills4.subclass.lich=Убийство врагов восстанавливает здоровье и утоляет голод.\n\n_Поднятые скелеты и скелеты-лучники получают на 25% больше здоровья и наносят на 25% больше урона._\n_Одно дополнительное призванное существо._
skills4.subclass.marshal=Успешные удары в ближнем бою образуют комбо.\n\n_+5 боеприпасов_\n_+1 точность оружия_
skills4.subclass.executioner=При здоровье ниже 40% ярость повышает урон на 50% и ускоряет стрельбу на 50%.\n\n_Перезарядка на 25% быстрее_
