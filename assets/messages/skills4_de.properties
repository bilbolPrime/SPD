skills4.smash.intro=Trifft einen benachbarten Feind mit roher Gewalt.
skills4.endurance.intro=Erhöht deine maximale Gesundheit.
skills4.firm_hand.intro=Verbessert deine Genauigkeit im Nahkampf.
skills4.regeneration.intro=Stellt mit der Zeit zusätzliche Gesundheit wieder her. Bei Hunger setzt diese Erholung aus.
skills4.toughness.intro=Reduziert eingehenden Schaden, außer Hunger.
skills4.knockback.intro=Trifft einen Gegner und stößt ihn ein Feld zurück. Bosse lassen sich nicht zurückstoßen.
skills4.second_wind.intro=Stellt sofort etwas Gesundheit wieder her.
skills4.sure_footing.intro=Verkürzt die Dauer von Verwurzelung und Verkrüppelung.
skills4.mastery.intro=Du kannst schwerere Nahkampfwaffen führen und schneller angreifen.
skills4.parry.intro=Verringert den Schaden des nächsten Nahkampftreffers, den du erleidest. Der Schutz hält bis zu vier Runden.
skills4.smite.intro=Führt einen schweren Schlag aus, der die Hälfte der Rüstung des Ziels ignoriert. Dauert zwei Runden.
skills4.riposte.intro=Verstärkt deinen nächsten Nahkampftreffer nach dem Blocken. Hält vier Runden an.
skills4.footwork.intro=Erlaubt längere Pausen zwischen Nahkampftreffern, ohne die Kombo zu verlieren.
skills4.duelist.intro=Erhöht das Ausweichen, solange genau ein Gegner neben dir steht.
skills4.disarming_strike.intro=Trifft einen Feind und schwächt ihn für drei Runden.
skills4.find_the_gap.intro=Dein dritter Nahkampftreffer in Folge und jeder weitere durchdringen einen Teil der Rüstung des Ziels.
skills4.aggression.intro=Dein Nahkampfschaden steigt, je mehr Gesundheit du verlierst.
skills4.charge.intro=Stürmt auf einen Gegner in bis zu vier Feldern Entfernung zu und schlägt ihn. Der Weg muss frei sein.
skills4.rampage.intro=Trifft jeden benachbarten Feind.
skills4.bloodlust.intro=Nach einem besiegten Gegner sind deine Nahkampfangriffe drei Runden lang schneller.
skills4.war_cry.intro=Schwächt sichtbare Gegner in einem Umkreis von zwei Feldern.
skills4.rend.intro=Ansturm und Amoklauf lassen überlebende Feinde bluten.
skills4.relentless.intro=Besiegte Feinde verkürzen die verbleibenden Abklingzeiten von Ansturm und Kriegsschrei.
skills4.cornered.intro=Reduziert den erlittenen Nahkampfschaden, während dich zwei oder mehr Feinde umgeben.

skills4.spark.intro=Feuert einen Funken auf einen sichtbaren Feind ab.
skills4.spirituality.intro=Erhöht dein maximales Mana.
skills4.sorcerer.intro=Deine Zauberstäbe verursachen mehr Schaden.
skills4.summon_rat.intro=Beschwört eine Ratte, die für dich kämpft.
skills4.meditation.intro=Stellt mit der Zeit zusätzliches Mana wieder her.
skills4.spirit_armor.intro=Absorbiert Schaden mit einem Mana pro absorbiertem Punkt.
skills4.wizard.intro=Deine Zauberstäbe laden sich schneller auf.
skills4.channeling.intro=Verkürzt die Abklingzeit aktiver Fertigkeiten auf mindestens eine Runde.
skills4.charged_staff.intro=Zauberstab-Nahkampftreffer stellen Mana wieder her.
skills4.arcane_ward.intro=Verringert den Schaden des nächsten Nahkampftreffers, den du erleidest. Der Schutz hält bis zu vier Runden.
skills4.arcane_strike.intro=Führt einen magischen Schlag aus, der die Hälfte der Rüstung des Ziels ignoriert.
skills4.conductive.intro=Gespeicherte Ladungen verstärken deine Nahkampftreffer mit dem Zauberstab. Jeder Treffer verbraucht eine Ladung, statt den Stab aufzuladen.
skills4.discharge.intro=Fügt allen benachbarten Feinden mit einem magischen Ausbruch Schaden zu.
skills4.spellweave.intro=Erhöht den Zauberstabschaden drei Runden lang, nachdem ein Nahkampftreffer gelandet ist.
skills4.drain_life.intro=Fügt einem Feind Schaden zu und heilt dich um die Hälfte der verlorenen Gesundheit.
skills4.rabid_minions.intro=Deine beschworenen Kreaturen verursachen mehr Schaden.
skills4.summon_skeleton.intro=Beschwört ein Skelett, das für dich kämpft.
skills4.soul_hunger.intro=Stellt Mana wieder her, wenn du einen Feind tötest.
skills4.enrage.intro=Solange diese Fähigkeit aktiv ist, verursachen deine beschworenen Kreaturen mehr Schaden, erleiden aber auch mehr.
skills4.slow.intro=Verlangsamt Bewegung und Angriffe eines Gegners.
skills4.summoner.intro=Du kannst eine weitere beschworene Kreatur behalten.
skills4.dark_pact.intro=Opfert fünf Gesundheit, um Mana wiederherzustellen. Du brauchst mindestens sechs Gesundheit.

skills4.double_strike.intro=Schlägt zweimal kurz hintereinander zu.
skills4.stealth.intro=Gegner bemerken dich schwerer.
skills4.evasion.intro=Verbessert deine Chance, Angriffen auszuweichen.
skills4.smoke_bomb.intro=Verschwinde in einer Rauchwolke. Ein Angriff unterbricht den Effekt.
skills4.bandit.intro=Jeder aufgehobene Goldhaufen bringt mehr Gold ein.
skills4.venom.intro=Solange diese Fähigkeit aktiv ist, können deine Nahkampftreffer das Ziel vergiften.
skills4.locksmith.intro=Beim Betreten einer Falle besteht eine Chance, sie zu entschärfen.
skills4.light_step.intro=Verkürzt die Dauer von Verwurzelung und Verkrüppelung.
skills4.dash.intro=Bewegt dich bis zu zwei Felder weit. Der Weg muss frei sein.
skills4.haste.intro=Erhöht deine Bewegungsgeschwindigkeit für fünf Runden.
skills4.shadow_clone.intro=Erstelle einen starken Klon oder drei schwächere Klone, die für dich kämpfen.
skills4.escape.intro=Befreit dich von Verwurzelung und Verkrüppelung und erhöht dein Ausweichen für vier Runden.
skills4.trailblazer.intro=Erhöht deine Bewegungsgeschwindigkeit.
skills4.skirmish.intro=Eine Bewegung verstärkt deinen nächsten Nahkampftreffer.
skills4.keep_distance.intro=Erhöht das Ausweichen gegen Feinde, die mehr als ein Feld entfernt sind.
skills4.ambush.intro=Erhöht deinen Nahkampfschaden, solange du unsichtbar bist.
skills4.scorpion.intro=Dein Gift verursacht mehr Schaden.
skills4.silent_death.intro=Nahkampfangriffe können schlafende Feinde sofort töten. Bosse sind immun.
skills4.expose.intro=Deine Nahkampftreffer ignorieren einen Teil der Rüstung.
skills4.execution.intro=Erhöht den Schaden gegen Feinde mit weniger als einem Viertel Leben.
skills4.deadly_throw.intro=Erhöht den Fernkampfwaffenschaden.

skills4.accuracy.intro=Deine Fernangriffe treffen genauer.
skills4.awareness.intro=Gewährt eine Chance, einem Fernangriff auszuweichen.
skills4.double_shot.intro=Feuert zwei Pfeile kurz hintereinander ab. Verbraucht zwei gewöhnliche Pfeile.
skills4.hunting.intro=Findet beim Erkunden rohes Fleisch.
skills4.fletching.intro=Erstellt beim Erkunden gewöhnliche Pfeile.
skills4.ko_arrow.intro=Dein nächster Pfeil verlangsamt sein Ziel und kann es einschläfern.
skills4.woodcraft.intro=Gegner bemerken dich schwerer.
skills4.quickdraw.intro=Beschleunigt deine Fernkampfangriffe.
skills4.barkskin.intro=Erhöht deine Rüstung.
skills4.nature_mend.intro=Stellt sofort etwas Gesundheit wieder her.
skills4.entangle.intro=Fesselt einen sichtbaren Feind an Ort und Stelle.
skills4.herbalist.intro=Reduziert Giftschaden.
skills4.dew_keeper.intro=Erhöht die durch Tau erhaltene Heilung.
skills4.knee_shot.intro=Deine Pfeile können ihr Ziel verkrüppeln.
skills4.thicket.intro=Verringert den Schaden des nächsten Nahkampftreffers, den du erleidest. Der Schutz hält bis zu vier Runden.
skills4.aimed_shot.intro=Erhöht den Schaden deines nächsten Pfeiltreffers.
skills4.long_sight.intro=Erhöht den Fernkampfschaden gegen Feinde, die mindestens vier Felder entfernt sind.
skills4.piercing_shot.intro=Dein nächster Pfeil ignoriert einen Teil der Rüstung des Ziels.
skills4.iron_tip.intro=Eisenspitzen lassen Pfeile durch Feinde dringen und diejenigen treffen, die hinter ihnen stehen. Mauern und Verbündete stoppen den Pfeil.
skills4.mark_prey.intro=Markiert einen Feind sechs Runden lang und erhöht so deinen Schaden gegen ihn.
skills4.bombvoyage.intro=Verwandelt einen Pfeil in eine Bombe. Die Explosion kann auch dich und deine Verbündeten treffen.
skills4.follow_through.intro=Ein besiegter Gegner verstärkt deinen nächsten Fernkampftreffer für vier Runden.

skills4.curse.intro=Schwächt die Angriffe eines Gegners für zehn Runden.
skills4.necro_spirit.intro=Erhöht dein maximales Mana.
skills4.raise_skeleton.intro=Erweckt ein Skelett aus einer Leiche am Boden.
skills4.summon_ghost.intro=Beschwört einen Geist, der für dich kämpft.
skills4.soul_bind.intro=Erhöht den Schaden deiner beschworenen Kreaturen.
skills4.necro_meditation.intro=Stellt mit der Zeit zusätzliches Mana wieder her.
skills4.necro_drain_life.intro=Entzieht einem Gegner Gesundheit und heilt dich um die Hälfte des verursachten Schadens.
skills4.master_of_death.intro=Belebt dich mit voller Gesundheit und vollem Mana wieder. Vor der nächsten Wiederbelebung muss sich die Kraft erholen.
skills4.spirit_army.intro=Erlaubt eine weitere beschworene Kreatur gleichzeitig.
skills4.mend_bones.intro=Heilt deine sichtbaren beschworenen Kreaturen.
skills4.guardian_bond.intro=Verringert den Schaden, den deine beschworenen Kreaturen erleiden.
skills4.corpse_explosion.intro=Lässt eine Leiche explodieren. Die Explosion trifft alle neben ihr, auch dich und deine Verbündeten.
skills4.raise_skeleton_archer.intro=Erweckt einen Skelettbogenschützen aus einer Leiche am Boden.
skills4.last_rites.intro=Gibt jeder Beschwörung eine Chance, einen tödlichen Schlag mit einem Viertel der Gesundheit zu überleben.
skills4.soul_shelter.intro=Verringert den Schaden des nächsten Nahkampftreffers, den du erleidest. Der Schutz hält bis zu vier Runden.
skills4.cold_touch.intro=Trifft einen Feind und verlangsamt ihn drei Runden lang.
skills4.necro_slow.intro=Verlangsamt Bewegung und Angriffe eines Gegners.
skills4.bone_spear.intro=Schleudert ein Geschoss aus Grabmagie auf einen Feind.
skills4.death_fed.intro=Stellt Mana wieder her, wenn du einen Feind tötest.
skills4.cruel_study.intro=Erhöht den durch Zauberstäbe verursachten Schaden.
skills4.withering_wave.intro=Fügt benachbarten Gegnern durch Kälte Schaden zu und verlangsamt sie drei Runden lang.

skills4.steady_aim.intro=Deine Schüsse treffen genauer.
skills4.packrat.intro=Erhöht die Munitionskapazität deiner Schusswaffe.
skills4.fast_reload.intro=Beschleunigt das Nachladen von Schusswaffen.
skills4.quick_draw.intro=Beschleunigt das Abfeuern deiner Schusswaffe.
skills4.veteran_company.intro=Angeheuerte Söldner unter deinem Kommando verursachen mehr Schaden.
skills4.field_medicine.intro=Stellt sofort etwas Gesundheit wieder her.
skills4.powder.intro=Erhöht den Schaden durch Schusswaffen.
skills4.steady_nerves.intro=Verkürzt die Dauer von Verwurzelung und Verkrüppelung.
skills4.volley.intro=Feuert einen stärkeren Schuss ab.
skills4.rally.intro=Heilt dich und deine Verbündeten innerhalb von zwei Feldern.
skills4.guard_order.intro=Angeheuerte Söldner unter deinem Kommando erleiden weniger Schaden.
skills4.suppress.intro=Dein nächster Schusswaffentreffer schwächt das Ziel.
skills4.counter_fire.intro=Das Erleiden von Nahkampfschaden stärkt deinen nächsten Schusswaffentreffer für vier Runden.
skills4.i_am_the_law.intro=Erhöht deine maximale und aktuelle Gesundheit für zwanzig Runden.
skills4.headshot.intro=Dein nächster Schuss verursacht mehr Schaden und trifft genauer.
