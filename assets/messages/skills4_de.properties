skills4.subclass.gladiator=Nahkampftreffer bilden eine Kombo, die den Schaden weiterer Treffer erhöht.\n\n_+3 Nahkampfgenauigkeit_\n_10% schnellere Nahkampfangriffe_
skills4.subclass.berserker=Unter 40% Gesundheit erhöht Wut deinen Schaden um 50%.\n\n_10% mehr Nahkampfschaden_\n_10% weniger erlittener Schaden_
skills4.subclass.battlemage=Nahkampftreffer mit dem Zauberstab stellen eine Ladung wieder her und addieren die Zahl der Ladungen zum Schaden.\n\n_Funke blendet das Ziel mit 50% Wahrscheinlichkeit für 3 Runden._
skills4.subclass.warlock=Das Töten von Feinden stellt die Gesundheit wieder her und stillt den Hunger.\n\n_Funke verursacht 5 zusätzlichen Schaden._\n_Eine zusätzliche beschworene Kreatur._
skills4.subclass.freerunner=Ohne zu schwere Ausrüstung und solange du nicht verhungerst, bewegst du dich 60% schneller. Beim Bewegen verdoppelt sich dein Ausweichen.
skills4.subclass.assassin=Überraschungsangriffe verursachen zusätzlichen Schaden.\n\n_+1 Heimlichkeit_
skills4.subclass.warden=Das Zertreten von hohem Gras verleiht Rindenhaut. Pflanzen können zusätzliche Samen und Tau abwerfen.
skills4.subclass.sniper=Fernkampfangriffe ignorieren Rüstung und markieren das Ziel für einen schnelleren Folgeangriff.\n\n_20% mehr Fernkampfschaden_
skills4.subclass.spirit_binder=Nahkampftreffer mit dem Zauberstab stellen eine Ladung wieder her und addieren die Zahl der Ladungen zum Schaden.\n\n_Wiedererweckte Skelette bleiben doppelt so lange bestehen._
skills4.subclass.lich=Das Töten von Gegnern stellt Gesundheit wieder her und stillt den Hunger.\n\n_Wiedererweckte Skelette und Skelettbogenschützen haben 25% mehr Gesundheit und verursachen 25% mehr Schaden._\n_Eine zusätzliche beschworene Kreatur._
skills4.subclass.marshal=Nahkampftreffer bilden eine Kombo.\n\n_+5 Schuss pro Magazin_\n_+1 Schussgenauigkeit_
skills4.subclass.executioner=Unter 40% Gesundheit erhöht Wut deinen Schaden um 50% und beschleunigt Schüsse um 50%.\n\n_25% schnelleres Nachladen_
