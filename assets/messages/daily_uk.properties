daily.hunt_won=Ви пройшли через перевал!\n\nПолювання та втеча тривали %d ходів.
daily.quarry_desc_0=Одна з трьох цілей полювання. Коли він стає в захисну стійку, крижаний панцир твердне. Вогонь ламає цей захист.
daily.quarry_desc_1=Одна з трьох цілей полювання. Замахується перед нищівним ударом. Відійдіть із позначених клітин.
daily.quarry_desc_2=Одна з трьох цілей полювання. Мчить по прямій, а потім трохи відпочиває. Зійдіть зі шляху до ривка.
daily.foe_desc_11=Кажан, що ховається в крижаних печерах. Після його укусу довго тримається холод.
