daily.brief_0=До Щурячого короля йде підкріплення. Здолайте його, перш ніж воно дістанеться двору. Полонений наглядач допоможе в бою, а в охоронюваному складі є припаси.
daily.brief_1=Бунт прикриває втечу Тенґу. Здолайте обох ватажків втечі, щоб відкрити його сховок, а потім і самого Тенґу, доки не вийшов час. Звільніть в'язнів, щоб вони билися з вартою, або обшукайте замкнену зброярню. Вхід до сховку зачиниться за вами.
daily.brief_2=Троє шахтарів застрягли під землею, а останній підйомник невдовзі рушить. Відкрийте їхні укриття, доведіть усіх трьох живими до підйомника й вибирайтеся. Тунелями блукає DM-300. З ним можна битися або обійти його. Припаси й замкнені короткі шляхи допоможуть урятувати всіх.
daily.brief_3=Печерами блукають крижаний кіготь, гнолл-кригоспин та інеєріг. Убийте всіх трьох і дістаньтеся далекого виходу, доки буря не перекрила шлях. Порядок полювання обираєте ви. У бічних проходах є припаси, але на пошуки потрібен час.
daily.brief_4=Три місця ритуалу прикликають демонів до чертогів. Дістаньтеся кожного й запечатайте його до завершення ритуалу. Кожна печатка перекриває одне джерело підкріплень. Обирайте маршрут і шукайте припаси в бічних залах, якщо знадобиться.
daily.brief_5=Утримайте форпост до прибуття допомоги. Капітан має пережити п'ять хвиль нападників. Захисники триматимуть центр, поки ви б'єтеся, шукаєте припаси або відкриваєте камери з підмогою. Стежте за підступами: пізніші хвилі можуть атакувати з кількох боків.
daily.brief_6=У королівській скарбниці лежить золото міста. Знайдіть капітана, заберіть його ключ, відкрийте скарбницю й тікайте крізь далеку браму, доки вона не зачинилася. Відкриття скарбниці здійме тривогу. Можна спершу обшукати склади й відкрити короткі шляхи або ризикнути та піти на пограбування з меншим запасом.
daily.rules=Кожен день має своїх героя, спорядження й підземелля. Перед виходом розподіліть очки навичок. Час рахується в ходах. Вихід із події завершує спробу. Щоденні події мають окремі результати й не відкривають відзнак або записів в енциклопедії.
daily.time_left=Залишилося ходів: _%d_
daily.timeout_0=Підкріплення дісталося двору. Доведеться відступити.\n\nМожна спробувати знову в Щоденних випробуваннях.
daily.timeout_1=Час вийшов. Тенґу втік під час бунту.\n\nМожна спробувати знову в Щоденних випробуваннях.
daily.timeout_2=Останній підйомник пішов. Урятувати всіх вчасно не вдалося.\n\nМожна спробувати знову в Щоденних випробуваннях.
daily.timeout_3=Буря завалила вихід. Полювання скінчилося.\n\nМожна спробувати знову в Щоденних випробуваннях.
daily.timeout_4=Ритуал завершено. Демони заполонили чертоги.\n\nМожна спробувати знову в Щоденних випробуваннях.
daily.timeout_6=Брами міста зачинилися. Варта відрізала шлях до втечі.\n\nМожна спробувати знову в Щоденних випробуваннях.
