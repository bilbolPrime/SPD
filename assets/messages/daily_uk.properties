daily.defender_2=Лучник форпосту
daily.defender_desc_0=Капітан тримає центр форпосту. Він має дожити до прибуття допомоги.
daily.defender_desc_1=Вартовий б'ється біля свого поста й повертається до нього між атаками.
daily.defender_desc_2=Лучник захищає форпост, тримаючись поблизу свого поста.
daily.defender_captive_desc=Потрапив у полон після падіння фортеці. Відкрийте камеру, і він допоможе боронити форпост.
