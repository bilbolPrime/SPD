skills4.subclass.gladiator=Acertos corpo a corpo bem-sucedidos criam um combo, adicionando dano aos acertos posteriores.\n\n_+3 precisão corpo a corpo_\n_ataques corpo a corpo 10% mais rápidos_
skills4.subclass.berserker=Abaixo de 40% da saúde, a Fúria aumenta o dano em 50%.\n\n_10% mais dano corpo a corpo_\n_10% menos dano recebido_
skills4.subclass.battlemage=Golpes corpo a corpo com a varinha recuperam uma carga e somam o número de cargas ao dano.\n\n_Faísca tem 50% de chance de cegar o alvo por 3 turnos._
skills4.subclass.warlock=Matar inimigos restaura a saúde e sacia a fome.\n\n_Faísca causa 5 de dano extra._\n_Uma criatura invocada extra._
skills4.subclass.freerunner=Sem equipamento pesado demais e enquanto não estiver morrendo de fome, você se move 60% mais rápido. Sua evasão dobra durante o movimento.
skills4.subclass.assassin=Ataques surpresa causam dano extra.\n\n_+1 furtividade_
skills4.subclass.warden=Pisar na grama alta concede Pele de casca. Plantas podem deixar sementes e orvalho extras.
skills4.subclass.sniper=Ataques à distância ignoram a armadura e marcam o alvo para acelerar o próximo ataque.\n\n_20% mais dano à distância_
skills4.subclass.spirit_binder=Golpes corpo a corpo com a varinha recuperam uma carga e somam o número de cargas ao dano.\n\n_Esqueletos reanimados duram o dobro do tempo._
skills4.subclass.lich=Matar inimigos recupera saúde e sacia a fome.\n\n_Esqueletos e arqueiros esqueletos reanimados têm o dobro da força._\n_Uma criatura invocada extra._
skills4.subclass.marshal=Acertos corpo a corpo bem-sucedidos criam um combo.\n\n_+5 munições de arma_\n_+1 precisão de arma_
skills4.subclass.executioner=Com menos de 40% de vida, a Fúria aumenta o dano em 50% e os tiros são 50% mais rápidos.\n\n_Recarga 25% mais rápida_
