skills4.smash.intro=Atinge um inimigo adjacente com força bruta.
skills4.endurance.intro=Aumenta sua saúde máxima.
skills4.firm_hand.intro=Melhora sua precisão em combate corpo a corpo.
skills4.regeneration.intro=Recupera vida extra ao longo do tempo. Para de funcionar quando você está morrendo de fome.
skills4.toughness.intro=Reduz o dano recebido, exceto fome.
skills4.knockback.intro=Atinge um inimigo e o empurra uma casa para trás. Não afeta chefes.
skills4.second_wind.intro=Restaura um pouco de saúde imediatamente.
skills4.sure_footing.intro=Reduz a duração do enraizamento e da lentidão causada por ferimentos.
skills4.mastery.intro=Melhora o nível efetivo e a velocidade de ataque da sua arma.
skills4.parry.intro=Reduz o próximo golpe corpo a corpo que você receber. A guarda dura até quatro turnos.
skills4.smite.intro=Desfere um golpe forte que ignora metade da armadura do alvo. Consome dois turnos.
skills4.riposte.intro=Fortalece seu próximo ataque corpo a corpo após o bloqueio. Dura quatro turnos.
skills4.footwork.intro=Dá a você mais tempo entre ataques corpo a corpo para manter um combo.
skills4.duelist.intro=Aumenta a evasão enquanto exatamente um inimigo estiver próximo a você.
skills4.disarming_strike.intro=Atinge um inimigo e o enfraquece por três turnos.
skills4.find_the_gap.intro=O terceiro golpe corpo a corpo consecutivo e os seguintes ignoram parte da armadura do alvo.
skills4.aggression.intro=Seu dano corpo a corpo aumenta conforme você perde saúde.
skills4.charge.intro=Avança contra um inimigo a até quatro casas de distância e o ataca. O caminho precisa estar livre.
skills4.rampage.intro=Ataca todos os inimigos adjacentes.
skills4.bloodlust.intro=Matar um inimigo acelera os ataques corpo a corpo por três turnos.
skills4.war_cry.intro=Enfraquece os inimigos visíveis num raio de duas casas.
skills4.rend.intro=Investida e Frenesi fazem os inimigos sobreviventes sangrarem.
skills4.relentless.intro=Matar um inimigo reduz o tempo de recarga restante de Investida e Grito de guerra.
skills4.cornered.intro=Reduz o dano corpo a corpo recebido enquanto dois ou mais inimigos o cercam.

skills4.spark.intro=Dispara uma faísca em um inimigo visível.
skills4.spirituality.intro=Aumenta sua mana máxima.
skills4.sorcerer.intro=Suas varinhas causam mais dano.
skills4.summon_rat.intro=Chame um rato para lutar por você.
skills4.meditation.intro=Recupera mana extra ao longo do tempo.
skills4.spirit_armor.intro=Absorve o dano usando um mana por ponto absorvido.
