skills4.arcane_strike.intro=Desfere um golpe mágico que ignora metade da armadura do alvo.
skills4.conductive.intro=Acertos corpo a corpo com varinha consomem cargas armazenadas para causar dano extra. Cada golpe acertado gasta uma carga em vez de recarregar a varinha.
skills4.discharge.intro=Causa dano a todos os inimigos adjacentes com uma explosão de magia.
skills4.spellweave.intro=Aumenta o dano da varinha por três turnos após acertar um golpe corpo a corpo.
skills4.drain_life.intro=Causa dano a um inimigo e cura metade da saúde que ele perde.
skills4.rabid_minions.intro=Suas criaturas invocadas causam mais dano.
skills4.summon_skeleton.intro=Chame um esqueleto para lutar por você.
skills4.soul_hunger.intro=Restaura mana quando você mata um inimigo.
skills4.enrage.intro=Enquanto estiver ativa, suas invocações causam mais dano, mas também sofrem mais dano.
skills4.slow.intro=Retarda os movimentos e os ataques de um inimigo.
skills4.summoner.intro=Você pode manter mais uma criatura convocada.
skills4.dark_pact.intro=Sacrifica cinco pontos de vida para restaurar mana. Requer pelo menos seis pontos de vida.

