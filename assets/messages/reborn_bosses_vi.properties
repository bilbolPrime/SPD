actors.mobs.rebornboss.opening=Sơ hở!
actors.mobs.rebornboss.interrupted=%s mất tập trung!
actors.mobs.reborngoo.desc=Người ta biết rất ít về Goo. Có lẽ nó thậm chí không phải sinh vật, mà chỉ là một khối chất thải từ cống rãnh bắt đầu có ý chí riêng.
actors.mobs.reborngoo.warning=Goo đang phồng lên. Tránh khỏi phía trước nó!
actors.mobs.reborndm300.desc=Cỗ máy này được người lùn chế tạo từ nhiều thế kỷ trước. Về sau, họ dần thay máy móc bằng golem, tinh linh và cả ác quỷ. Điều đó cuối cùng đã đẩy nền văn minh của họ đến chỗ suy tàn. DM-300 và các máy tương tự thường được dùng để xây dựng, khai mỏ, đôi khi cả bảo vệ thành phố.
actors.mobs.reborndm300.repair=DM-300 đang tự sửa chữa!
actors.mobs.reborndm300.warning=Động cơ rít lên. Rời khỏi những ô được đánh dấu!
actors.mobs.rebornking.desc=Vị vua cuối cùng của người lùn nổi tiếng nhờ hiểu biết sâu sắc về sự sống và cái chết. Ông thuyết phục các cận thần tham gia nghi lễ hứa hẹn ban cho họ tuổi trẻ vĩnh hằng. Cuối cùng, chỉ mình ông đạt được điều đó — cùng một đạo quân xác sống.
actors.mobs.rebornking.warning=Vua giơ tay lên!
actors.mobs.rebornking.herald_fell=Giữ vị trí, lũ hèn!
actors.mobs.rebornking$retainer.name_0=Lính gác hoàng gia
actors.mobs.rebornking$retainer.desc_0=Một người lùn đã chết, khoác bộ giáp móp méo. Hắn vẫn canh giữ nhà vua.
actors.mobs.rebornking$retainer.name_1=Pháp sư triều đình
actors.mobs.rebornking$retainer.desc_1=Một pháp sư cung đình được gọi về từ cõi chết. Ma thuật hắc ám tụ lại trong tay hắn.
actors.mobs.rebornking$retainer.name_2=Sứ giả hoàng gia
actors.mobs.rebornking$retainer.desc_2=Dù hàm đã gãy, tên truyền lệnh này vẫn gào lên mệnh lệnh của Vua. Lũ xác sống răm rắp nghe theo.
actors.mobs.rebornking$retainer.name_3=Cung thủ xác sống
actors.mobs.rebornking$retainer.desc_3=Người lùn này được chôn cùng cây cung. Hắn vẫn chưa quên cách dùng nó.
actors.mobs.rebornyog.desc=Yog-Dzewa là một Thần Cổ Đại, một thực thể hùng mạnh đến từ cõi hỗn loạn. Một thế kỷ trước, tộc người lùn cổ đại đã suýt thua trong cuộc chiến chống lại đội quân quỷ của nó, nhưng không thể tiêu diệt được chính vị thần này. Thay vào đó, họ đã giam cầm nó trong những sảnh đường bên dưới thành phố của mình, tin rằng nó quá yếu để có thể trỗi dậy một lần nữa.
actors.mobs.rebornyog.warning=Không khí nứt toạc. Rời khỏi những dấu nhấp nháy!
actors.mobs.rebornyog.inherit_rot=Xác thịt héo tàn. Ta vẫn còn.
actors.mobs.rebornyog.inherit_fire=Ngọn lửa giờ là của ta.
actors.mobs.rebornyog$rotting.desc=Một nắm đấm khổng lồ bằng thịt thối. Dịch nhầy hôi hám rỉ qua các kẽ ngón tay, làm bẩn nền đá bên dưới.
actors.mobs.rebornyog$rotting.warning=Nắm đấm mục rữa đang lấy đà!
actors.mobs.rebornyog$burninghand.desc=Một nắm đấm lớn bọc trong lửa. Những ngón tay khép lại nghe lách tách, rải tàn than xuống sàn.
actors.mobs.rebornyog$burninghand.warning=Than hồng tụ lại trước nắm đấm bốc cháy!
actors.mobs.reborntengu.shadow_broken=Bóng của ta…!
