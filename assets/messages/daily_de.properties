daily.timeout_0=Die Verstärkung hat den Hof erreicht. Du musst dich zurückziehen.\n\nDu kannst es unter Tägliche Herausforderungen erneut versuchen.
daily.timeout_1=Die Zeit ist um. Tengu ist während des Aufstands entkommen.\n\nDu kannst es unter Tägliche Herausforderungen erneut versuchen.
daily.timeout_2=Der letzte Aufzug ist abgefahren. Du hast nicht alle rechtzeitig hinausgebracht.\n\nDu kannst es unter Tägliche Herausforderungen erneut versuchen.
daily.timeout_3=Der Sturm hat den Ausgang verschüttet. Die Jagd ist vorbei.\n\nDu kannst es unter Tägliche Herausforderungen erneut versuchen.
daily.timeout_4=Das Ritual ist vollendet. Die Hallen sind überrannt.\n\nDu kannst es unter Tägliche Herausforderungen erneut versuchen.
daily.timeout_6=Die Stadttore sind geschlossen. Die Wachen haben dir den Fluchtweg abgeschnitten.\n\nDu kannst es unter Tägliche Herausforderungen erneut versuchen.
