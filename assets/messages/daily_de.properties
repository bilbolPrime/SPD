daily.brief_0=Verstärkung für den Rattenkönig ist unterwegs. Besiege ihn, bevor sie seinen Hof erreicht. Ein gefangener Wärter kann dir helfen. Im bewachten Lager findest du Vorräte.
daily.brief_1=Der Aufstand deckt Tengus Flucht. Besiege beide Fluchthauptleute, um sein Versteck zu öffnen, und dann Tengu, bevor die Zeit abläuft. Befreie Gefangene als Verbündete oder suche Vorräte in der verschlossenen Waffenkammer. Das Versteck schließt sich hinter dir.
daily.brief_2=Drei Bergleute sitzen fest, und der letzte Aufzug fährt bald ab. Öffne ihre Unterstände, bringe alle drei lebend zurück und fahre mit ihnen hinaus. DM-300 durchstreift die Stollen. Bekämpfe oder umgehe ihn. Vorräte und verschlossene Abkürzungen können helfen.
daily.brief_3=Eine Eisklaue, ein Frostrücken-Gnoll und ein Reifhorn streifen durch die Höhlen. Erlege alle drei und erreiche den Ausgang, bevor der Sturm den Weg versperrt. Die Reihenfolge bestimmst du. In Seitengängen liegen Vorräte, doch die Suche kostet Zeit.
daily.brief_4=Drei Ritualstätten rufen Dämonen herbei. Versiegle sie vor dem Ende des Rituals. Jedes Siegel stoppt eine Quelle des Nachschubs. Wähle deinen Weg und durchsuche die Seitenkammern, wenn du Vorräte brauchst.
daily.brief_5=Halte den Außenposten, bis Hilfe eintrifft. Der Hauptmann muss fünf Angriffswellen überleben. Die Verteidiger halten die Mitte. Du kannst kämpfen, Vorräte suchen oder Zellen öffnen, um Hilfe zu bekommen. Spätere Wellen greifen von mehreren Seiten an.
daily.brief_6=Das Gold der Stadt liegt in der königlichen Schatzkammer. Nimm dem Hauptmann den Schlüssel ab, öffne die Kammer und fliehe durch das andere Stadttor, bevor es schließt. Das Öffnen löst Alarm aus. Suche zuerst Vorräte und öffne Abkürzungen oder wage einen schnelleren Raubzug.
daily.rules=Jedes Datum hat einen eigenen Helden, Ausrüstung und Dungeon. Verteile deine Fähigkeitspunkte vor dem Aufbruch. Die Zeit zählt in Runden. Beim Verlassen endet der Versuch. Tagesereignisse haben eigene Ergebnisse und schalten weder Abzeichen noch Wissen frei.
