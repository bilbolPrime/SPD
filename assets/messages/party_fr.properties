actors.skills.raiseskeletonskill.desc=Relève un squelette seulement si la case ciblée contient un cadavre.
actors.skills.raiseskeletonskill.lich=Liche : puissance d'invocation doublée et possibilité de relever un squelette supplémentaire.
actors.skills.raiseskeletonskill.spiritbinder=Lieur d'esprits : durée de vie des squelettes relevés doublée.
network.partysession.background=La connexion au groupe a été interrompue car vous avez quitté le jeu.
items.corpse.name=cadavre
items.corpse.desc=Un cadavre frais, utilisable en nécromancie.
items.armorkit.desc=Ces outils permettent de transformer une armure en armure épique. Elle conserve ses propriétés et reçoit une capacité propre à votre classe. Aucun savoir-faire particulier n'est nécessaire.
items.bomb.desc=Une petite bombe remplie de poudre noire. Elle explose là où elle atterrit.
items.quest.driedrose.desc=Cette rose est sèche depuis longtemps, mais elle a gardé tous ses pétales.\n\nRapportez cet objet au fantôme.
items.quest.phantomfish.desc=Ce petit poisson translucide est difficile à voir dans l'air. Dans l'eau, il devient presque invisible.\n\nRapportez cet objet au fantôme.
items.tomeofmastery.desc=Ce livre relié de cuir usé semble avoir beaucoup à vous apprendre malgré sa minceur. Sa lecture demande un peu de temps.\n\nPermet de choisir une sous-classe.
items.weightstone.desc=Cette pierre permet d'équilibrer une arme de mêlée pour améliorer sa vitesse ou sa précision.
items.wands.wandofamok.desc=La lumière violette de cette baguette rend la cible folle furieuse. Elle attaque alors les créatures alentour sans distinction.
items.wands.wandofavalanche.desc=Si son projectile frappe un mur ou un autre obstacle solide, cette baguette provoque un éboulement qui blesse et étourdit les créatures dans la zone.
items.wands.wandofflock.desc=Invoque un troupeau de moutons magiques qui forme un obstacle temporaire infranchissable.
items.wands.wandofpoison.desc=Empoisonne la cible, qui subit des dégâts réguliers. Améliorer la baguette prolonge le poison.
items.wands.wandofreach.desc=Permet de saisir des objets à distance et d'échanger sa place avec un ennemi. Son onde déclenche les pièges, écrase l'herbe et inverse l'état des portes sur son passage.
items.wands.wandofslowness.desc=Réduit de moitié la vitesse de déplacement et d'attaque de la cible pendant un moment.
items.wands.wandofteleportation.desc=Téléporte une créature à un endroit aléatoire de l'étage.
items.weapon.melee.dualswords.desc=Deux lames acérées pour frapper plus fort.
items.weapon.missiles.cupidarrow.desc=Une flèche qui aurait appartenu à Cupidon. Choisissez bien votre cible.
items.weapon.missiles.curaredart.desc=Ces fléchettes infligent peu de dégâts, mais peuvent paralyser la cible et la laisser sans défense.
items.weapon.missiles.incendiarydart.desc=La pointe s'accroche à la cible tandis que le produit fixé à la fléchette s'embrase.
items.weapon.missiles.soulcrystal.desc=Un cristal capable de capturer une âme. Lancez-le sur un ennemi faible ou affaibli pour emprisonner son esprit.
items.weapon.missiles.tamahawk.desc=Cette hache de lancer reste légère, mais il faut de la force pour bien s'en servir.
network.partytext.weapon_fast=Cette arme est rapide.
network.partytext.weapon_slow=Cette arme est lente.
network.partytext.weapon_accurate=Cette arme est précise.
network.partytext.weapon_inaccurate=Cette arme manque de précision.
network.partytext.weapon_fast_and_accurate=Cette arme est rapide et précise.
network.partytext.weapon_fast_but_inaccurate=Cette arme est rapide, mais peu précise.
network.partytext.weapon_slow_but_accurate=Cette arme est lente, mais précise.
network.partytext.weapon_slow_and_inaccurate=Cette arme est lente et peu précise.
network.partytext.necroblade_bolt=Au niveau 5, la lame entièrement chargée peut lancer _Trait sombre_, qui peut détruire l'essence d'une cible et l'asservir.
network.partytext.necroblade_intro=Forgée par la magie noire, cette lame dévore les âmes de ses victimes et gagne en puissance.
network.partytext.necroblade_energy=Âmes stockées : _%s/100_
network.partytext.necroblade_damage=Les âmes ajoutent _0–%d dégâts_.
network.partytext.necroblade_hungry=La lame peut consommer une charge complète d'âmes pour devenir plus puissante.
network.partytext.necroblade_full=La lame ne peut plus s'améliorer en consommant des âmes.
