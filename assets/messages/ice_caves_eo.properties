items.scrolls.scrolloffrostlevel.name=Volvaĵo de prujno
items.scrolls.scrolloffrostlevel.desc=Malvarmo eliras el ĉi tiu pergameno.\n\nVi ankaŭ povas disŝiri ĝin ie ajn por frostigi ĉiujn malamikojn sur la etaĝo ĝis ili ricevos damaĝon. Estroj kaj estaĵoj imunaj kontraŭ frosto ne estas trafataj. Tio ne kaŭzas damaĝon.
items.scrolls.scrolloffrostlevel.ac_tear=Disŝiri
items.scrolls.scrolloffrostlevel.tear_confirm=Disŝiri ĉi tiun volvlibron liberigos ĝian magion, frostigante ĉiujn malamikojn sur la etaĝo ĝis ili ricevos damaĝon. Estroj kaj estaĵoj imunaj kontraŭ frosto ne estas trafataj. Tio ne kaŭzas damaĝon.\n\nĈu disŝiri la volvlibron?
items.scrolls.scrolloffrostlevel.wrong_place=La volvaĵo ne funkcias ĉi tie.
items.scrolls.scrolloffrostlevel.spent=La pasejo jam estas malfermita. La volvaĵo silentas.
items.keys.key.ice_depth=Ĉi tiu ŝlosilo apartenas al etaĝo %d de la Glaciaj Kavernoj.
scenes.interlevelscene$mode.frost=Enirado en la Glaciajn Kavernojn...
levels.icecaveslevel.water_name=Glacia akvo
levels.icecaveslevel.water_desc=Maldika glacikrusto rompiĝas sub la piedoj.
levels.icecaveslevel.wall_desc=Spuroj de pioĉoj malaperas sub dikaj glaciaj vejnoj. La ministoj forlasis ĉi tiujn galeriojn kiam la malvarmo penetris la rokon.
levels.cavesbosslevel.collapsed_name=Disfalinta kaverno
levels.cavesbosslevel.collapsed_desc=Disfalinta kaverno. Ne eblas trairi la falintajn rokojn.
actors.buffs.frostbite.name=Frostodifekto
actors.buffs.frostbite.desc=La malvarmo malrapidigas vian moviĝon je 20%.
actors.mobs.rimebat.name=Prujna vesperto
actors.mobs.rimebat.desc=Ĉi tiuj palaj vespertoj nestas sub la glacio. Ilia malvarma mordo mallonge malrapidigas moviĝon, donante al ili tempon por reveni kaj ataki denove.\n\nImuna kontraŭ frostigo kaj malvarma magio.
actors.mobs.iceclaw.name=Glaciungego
actors.mobs.iceclaw.desc=Kadavromanĝanto kun ŝelo el densa glacio. Antaŭ batalo ĝi mallonge plidikigas sian kirason. Fajro fandas tiun aldonan protekton.\n\nImuna kontraŭ frostigo kaj malvarma magio.
actors.mobs.frostback.name=Prujndorsa gnolo
actors.mobs.frostback.desc=Ĉi tiu gnolo travivis la malvarmon rabante malprudentajn vizitantojn. Kiam ĝi levas sian armilon, flankeniru: la peza bato trafos vian antaŭan lokon.\n\nImuna kontraŭ frostigo kaj malvarma magio.
actors.mobs.shardling.name=Glaciero
actors.mobs.shardling.desc=Senripoza amaso da glacikristaloj. Ĝi celas antaŭ ol pafi splitojn laŭ rekta linio. Muroj haltigas la salvon.\n\nImuna kontraŭ frostigo kaj malvarma magio.
actors.mobs.hollowminer.name=Malplena ministo
actors.mobs.hollowminer.desc=Ĉi tiu ministo neniam eskapis el la frostaj galerioj. Lia lanterno ankoraŭ brulas, kvankam li mortis antaŭ longe. Se li sukcesas levi ĝin, li alvokas proksimajn estaĵojn al batalo. Trafo interrompas la signalon.\n\nImuna kontraŭ frostigo kaj malvarma magio.
actors.mobs.rimehorn.name=Prujnkorno
actors.mobs.rimehorn.desc=Peza besto kun prujno en sia felo. Ĝi skrapas la teron antaŭ ol kuregi rekte antaŭen. Foriru de ĝia vojo dum ĝi sin preparas.\n\nImuna kontraŭ frostigo kaj malvarma magio.
actors.mobs.oldrime.name=Malnova Prujno
actors.mobs.oldrime.desc=La ministoj trovis Malnovan Prujnon sub la monto, enterigitan en glacio pli malnova ol iliaj tuneloj. Iliaj pioĉoj vekis ĝin. Nun ĝi gardas la frostajn galeriojn kaj la pasejon preter ili. Dum ĝi malfortiĝas, ĝia kiraso rompiĝas, liberigante la membrojn. Atentu pri pezaj batoj, glacio trarompanta la plankon kaj ĝia frosta spiro.\n\nImuna kontraŭ frostigo kaj malvarma magio.
actors.mobs.oldrime.warning=Malnova Prujno sin preparas por bati!
windows.wndjournal.ice_depth=Glacio %d
levels.icebosslevel.exit_name=Kaverna pasejo
levels.icebosslevel.exit_desc=Mallarĝa pasejo serpentumas pli profunden en la monton.
levels.icebosslevel.blocked_name=Frosta pasejo
levels.icebosslevel.blocked_desc=Glacia muro baras la pasejon malantaŭ Malnova Prujno.
items.weapon.ice.wrong_hero=Ĉi tiu armilo ne estas por vi.
items.weapon.ice.already_enchanted=Ĉi tiu armilo jam estas sorĉita.
items.weapon.ice.glaciercleaver.name=Glaĉera hakilo
items.weapon.ice.glaciercleaver.desc=Larĝa klingo ĉizita el la glacio de Malnova Prujno. Trafo kovras la celon per prujno dum kvar vicoj. La sekva bato per Glaĉera hakilo frakasas ĝin kaj kaŭzas %d aldonan damaĝon. Nur Militisto povas uzi ĝin.
actors.buffs.frostcoating.name=Prujnkovrita
actors.buffs.frostcoating.desc=Maldika tavolo de prujno kovras ĉi tiun estaĵon. Bato per Glaĉera hakilo frakasos ĝin.
items.weapon.ice.hoarfroststaff.name=Bastono de blanka prujno
items.weapon.ice.hoarfroststaff.desc=Malvarmo kolektiĝas inter la pintoj de ĉi tiu bastono. Ĝiaj pafoj kaŭzas %d-%d damaĝon antaŭ lertobonoj kaj malrapidigas moviĝon kaj atakojn dum du vicoj. Komence ĝi havas tri ŝargojn kaj reŝargiĝas kiel vergo. Nur Magiisto povas uzi ĝin.
items.weapon.ice.rimepick.name=Prujna pioĉo
items.weapon.ice.rimepick.desc=Ĉi tiu mallarĝa glacipioĉo trovas breĉojn en kiraso. Ĝi ignoras kvaronon de la kiraso de la celo, aŭ duonon se la celo estas surprizita. Nur Fripono povas uzi ĝin.
items.weapon.ice.frostbow.name=Frosta pafarko
items.weapon.ice.frostbow.desc=Sagoj el ĉi tiu pafarko diseriĝas en akran glacion je trafo. Ili kaŭzas %d%% pli da damaĝo al la celo kaj kvaronon de la trafa damaĝo al apudaj malamikoj. La splitoj ne frostigas siajn viktimojn. Nur Ĉasistino povas uzi ĝin.
items.weapon.ice.gravefrostscythe.name=Falĉilo de tomba prujno
items.weapon.ice.gravefrostscythe.desc=Prujno kovras la ostovolvitan tenilon de ĉi tiu falĉilo. Dum ĝi estas ekipita, viaj alvokitaj skeletoj kaj fantomoj kaŭzas %d aldonan malvarman damaĝon je ĉiu trafo. Nur Nekromanciisto povas uzi ĝin.
items.weapon.ice.frostbiterifle.name=Frostodifekta fusilo
items.weapon.ice.frostbiterifle.desc=La kartoĉujo de ĉi tiu fusilo estas tegita per glacio, kiu neniam degelas. Ĉiu trafa pafo kaŭzas frostodifekton dum du vicoj, malrapidigante moviĝon je 20%. Pluaj trafoj renovigas la efikon. Nur Soldulo povas uzi ĝin.
library.ice_weapon_drop=Por ĉiu heroo falas unu armilo taŭga por ties klaso.

actors.mobs.npcs.prospector.name=Blokita prospektoro
actors.mobs.npcs.prospector.desc=Prospektoro en flikita mantelo ŝirmiĝas apud la ŝtuparo. Lia lampo preskaŭ estingiĝis.
actors.mobs.npcs.prospector.torches=Mia lampo ne daŭros longe. Fuĝante mi lasis provizkeston sur ĉi tiu etaĝo. Ĉu vi alportus al mi _tri torĉojn_ el ĝi?
actors.mobs.npcs.prospector.iceclaws=La glaciungegoj forpelis min el mia minejo. Mortigu _tri glaciungegojn sur ĉi tiu etaĝo_, por ke mi povu relabori.
actors.mobs.npcs.prospector.accept=Mi helpos.
actors.mobs.npcs.prospector.later=Ne nun.
actors.mobs.npcs.prospector.need_torches=Mi bezonas _tri torĉojn_. La provizkesto ankoraŭ estas ie sur ĉi tiu etaĝo.
actors.mobs.npcs.prospector.claws_left=Mortigotaj glaciungegoj: _%d_.
actors.mobs.npcs.prospector.reward=Bona laboro. Kion vi preferas?
actors.mobs.npcs.prospector.rations=Du porcioj de manĝaĵo
actors.mobs.npcs.prospector.thanks=Unu zorgo malpli. Dankon.
library.quest.prospector_torches.name=Estingiĝanta lampo
library.quest.prospector_torches.desc=Alportu tri torĉojn al la blokita prospektoro. Provizkesto sur lia etaĝo enhavas sufiĉe da ili.
library.quest.prospector_iceclaws.name=Glaciungegoj en la minejo
library.quest.prospector_iceclaws.desc=Mortigu tri glaciungegojn sur la etaĝo de la prospektoro, poste revenu al li.
library.quest.prospector.reward=Elektu skribrulaĵon de plibonigo aŭ du porciojn de manĝaĵo.
items.scrolls.scrolloffrostlevel.read_confirm=Dum vi legas, vi sentas, ke vi tuj estos teleportita.
