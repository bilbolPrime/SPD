skills4.spirit_army.intro=同時に維持できる召喚獣が1体増える。
skills4.mend_bones.intro=視界内の召喚獣の体力を回復する。
skills4.guardian_bond.intro=召喚した仲間の受けるダメージを軽減する。
skills4.corpse_explosion.intro=死体を爆発させ、隣接する全員にダメージを与える。自分や味方も巻き込まれる。
skills4.raise_skeleton_archer.intro=地面の死体からスケルトンアーチャーを蘇らせる。
skills4.last_rites.intro=各召喚獣は一度だけ、致命傷を受けても4分の1の体力で生き残る可能性を得る。
skills4.soul_shelter.intro=次に受ける近接攻撃のダメージを軽減する。守りは最大4ターン続く。
