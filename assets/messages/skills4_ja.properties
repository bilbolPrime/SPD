skills4.smash.intro=隣接する敵を力任せに攻撃する。
skills4.endurance.intro=最大体力が増える。
skills4.firm_hand.intro=近接攻撃の命中精度が上がる。
skills4.regeneration.intro=通常の回復に加え、一定時間ごとに体力が回復する。飢餓状態では回復しない。
skills4.toughness.intro=飢餓以外で受けるダメージを軽減する。
skills4.knockback.intro=敵を攻撃し、1マス押し戻す。ボスは押し戻せない。
skills4.second_wind.intro=体力を即座に回復する。
skills4.sure_footing.intro=束縛と不具の持続時間を短くする。
skills4.mastery.intro=武器の有効レベルと攻撃速度が上がる。
skills4.parry.intro=次に受ける近接攻撃のダメージを軽減する。守りは最大4ターン続く。
skills4.smite.intro=敵の装甲を半分無視して強打する。2ターンかかる。
skills4.riposte.intro=攻撃を防ぐと、次の近接攻撃が強化される。効果は4ターン続く。
skills4.footwork.intro=コンボをつなげるための猶予が長くなる。
skills4.duelist.intro=隣接する敵が1体だけのとき、回避力が上がる。
skills4.disarming_strike.intro=敵を打ち、3ターンの間弱体化させる。
skills4.find_the_gap.intro=近接攻撃を連続で当てると、3発目以降は敵の防御力を一部無視する。
skills4.aggression.intro=体力が減るほど近接攻撃が強くなる。
skills4.charge.intro=4マス以内の敵に突進して攻撃する。途中に障害物があると使えない。
skills4.rampage.intro=隣接するすべての敵を攻撃する。
skills4.bloodlust.intro=敵を倒すと、3ターンの間近接攻撃が速くなる。
skills4.war_cry.intro=2マス以内に見える敵を弱体化させる。
skills4.rend.intro=突進と猛攻を受けて生き残った敵を出血させる。
skills4.relentless.intro=敵を倒すと、突進と雄叫びの残りクールダウンが短くなる。
skills4.cornered.intro=2体以上の敵に囲まれている間、受ける近接ダメージを軽減する。

skills4.spark.intro=視界内の敵に魔法の火花を放つ。
skills4.spirituality.intro=最大マナが増える。
skills4.sorcerer.intro=杖で与えるダメージが増える。
skills4.summon_rat.intro=一緒に戦うネズミを召喚する。
skills4.meditation.intro=通常の回復に加え、一定ターンごとにマナが回復する。
skills4.spirit_armor.intro=マナでダメージを吸収する。吸収するダメージ1につき、マナを1消費する。
skills4.wizard.intro=杖の充填が速くなる。
skills4.channeling.intro=スキルの再使用までの待ち時間が短くなる。最短でも1ターン必要。
skills4.charged_staff.intro=杖の近接攻撃はマナを回復する。
skills4.arcane_ward.intro=次に受ける近接攻撃のダメージを軽減する。守りは最大4ターン続く。
skills4.arcane_strike.intro=ターゲットの装甲の半分を無視する魔法の一撃を与える。
skills4.conductive.intro=杖に残った充填数に応じて近接攻撃の威力が上がる。命中するたび、杖を充填する代わりに1回分の充填を消費する。
skills4.discharge.intro=魔力を放出し、隣接するすべての敵にダメージを与える。
skills4.spellweave.intro=近接攻撃が命中すると、3ターンの間杖のダメージが増える。
skills4.drain_life.intro=敵の体力を奪い、奪った量の半分だけ回復する。
skills4.rabid_minions.intro=召喚した仲間の与えるダメージが増える。
skills4.summon_skeleton.intro=一緒に戦うスケルトンを召喚する。
skills4.soul_hunger.intro=敵を倒すとマナが回復する。
skills4.enrage.intro=有効にすると、召喚した仲間の与えるダメージと受けるダメージが増える。
skills4.slow.intro=敵の移動と攻撃を遅くする。
skills4.summoner.intro=同時に維持できる召喚獣が1体増える。
skills4.dark_pact.intro=体力を5消費してマナを回復する。体力が6以上必要。

skills4.double_strike.intro=素早く2回連続で攻撃する。
skills4.stealth.intro=敵に気づかれにくくなる。
skills4.evasion.intro=回避力が上がる。
skills4.smoke_bomb.intro=煙の雲の中に消える。攻撃すると効果が切れる。
skills4.bandit.intro=拾った金の山から、より多くのゴールドを得られる。
skills4.venom.intro=有効にすると、近接攻撃が命中した敵を一定確率で毒状態にする。
skills4.locksmith.intro=踏んだ罠を一定確率で解除する。
skills4.light_step.intro=束縛と不具の持続時間を短くする。
skills4.dash.intro=障害物のない場所を最大2マス移動する。
skills4.haste.intro=5ターンの間、移動が速くなる。
skills4.shadow_clone.intro=味方となる分身を作る。強い分身1体か、弱い分身3体を選べる。
skills4.escape.intro=束縛と不具を解除し、4ターンの間回避力を上げる。
skills4.trailblazer.intro=移動が速くなる。
skills4.skirmish.intro=移動後の近接攻撃が強くなる。
skills4.keep_distance.intro=隣接していない敵の攻撃に対する回避力が上がる。
skills4.ambush.intro=姿を隠している間、近接攻撃が強くなる。
skills4.scorpion.intro=与える毒ダメージが増える。
skills4.silent_death.intro=近接攻撃で眠っている敵を即死させることがある。ボスには効かない。
skills4.expose.intro=近接攻撃が敵の装甲を一部無視する。
skills4.execution.intro=体力が4分の1以下の敵に与えるダメージが増える。
skills4.deadly_throw.intro=遠距離武器で与えるダメージが増える。

skills4.accuracy.intro=遠距離攻撃の命中精度が上がる。
skills4.awareness.intro=遠距離攻撃を一定確率でかわす。
skills4.double_shot.intro=続けて2本の矢を放つ。通常の矢を2本消費する。
skills4.hunting.intro=探索中に生肉を見つける。
skills4.fletching.intro=探索中に通常の矢を作る。
skills4.ko_arrow.intro=次の矢はターゲットの動きを遅くし、ターゲットを眠らせる可能性があります。
skills4.woodcraft.intro=敵に気づかれにくくなる。
skills4.quickdraw.intro=遠距離攻撃が速くなる。
skills4.barkskin.intro=防御力が上がる。
skills4.nature_mend.intro=体力を即座に回復する。
skills4.entangle.intro=視界内の敵を根で縛り、その場から動けなくする。
skills4.herbalist.intro=受ける毒ダメージを軽減する。
skills4.dew_keeper.intro=露で回復する体力が増える。
skills4.knee_shot.intro=矢が命中した敵を一定確率で不具状態にする。
skills4.thicket.intro=次に受ける近接攻撃のダメージを軽減する。守りは最大4ターン続く。
skills4.aimed_shot.intro=次に命中する矢のダメージが増える。
skills4.long_sight.intro=4マス以上離れた敵に与える遠距離ダメージが増える。
skills4.piercing_shot.intro=次の矢は敵の防御力を一部無視する。
skills4.iron_tip.intro=矢が敵を貫通し、後ろの敵にも命中することがある。壁や味方に当たると止まる。
skills4.mark_prey.intro=敵に6ターン続く印を付け、その敵に与えるダメージを増やす。
skills4.bombvoyage.intro=矢を爆弾に変える。爆発には自分や味方も巻き込まれる。
skills4.follow_through.intro=敵を倒すと、次の遠距離攻撃が強化される。効果は4ターン続く。

skills4.curse.intro=10ターンの間、敵の攻撃を弱める。
skills4.necro_spirit.intro=最大マナが増える。
skills4.raise_skeleton.intro=地面の死体からスケルトンを蘇らせる。
skills4.summon_ghost.intro=一緒に戦う幽霊を召喚する。
skills4.soul_bind.intro=召喚した仲間の与えるダメージが増える。
skills4.necro_meditation.intro=通常の回復に加え、一定ターンごとにマナが回復する。
skills4.necro_drain_life.intro=敵の体力を奪い、奪った量の半分だけ回復する。
