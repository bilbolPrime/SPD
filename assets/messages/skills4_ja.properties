skills4.subclass.gladiator=近接攻撃が命中するとコンボがつながり、続く攻撃のダメージが増える。\n\n_近接攻撃の命中精度+3_\n_近接攻撃速度+10%_
skills4.subclass.berserker=体力が40%を下回ると、激怒によってダメージが50%増える。\n\n_近接ダメージ+10%_\n_受けるダメージ-10%_
skills4.subclass.battlemage=杖の近接攻撃が命中すると充填が1回分回復し、現在の充填数がダメージに加わる。\n\n_スパークは50%の確率で対象を3ターン盲目にする。_
skills4.subclass.warlock=敵を倒すと体力と満腹度が回復する。\n\n_スパークのダメージが5増える。_\n_同時に召喚できる数が1体増える。_
skills4.subclass.freerunner=装備が重すぎず、飢餓状態でなければ移動速度が60%上がる。移動中は回避力が2倍になる。
skills4.subclass.assassin=奇襲攻撃のダメージが増える。\n\n_隠密+1_
skills4.subclass.warden=背の高い草を踏むと樹皮の肌を得る。植物から追加の種や露が手に入ることがある。
skills4.subclass.sniper=遠距離攻撃が防御を無視し、対象に印を付けて次の攻撃を速める。\n\n_遠距離ダメージ+20%_
skills4.subclass.spirit_binder=杖の近接攻撃が命中すると充填が1回分回復し、現在の充填数がダメージに加わる。\n\n_蘇らせた骸骨の持続時間が2倍になる。_
skills4.subclass.lich=敵を倒すと体力と満腹度が回復する。\n\n_蘇らせたスケルトンとスケルトンアーチャーの強さが2倍になる。_\n_同時に召喚できる数が1体増える。_
skills4.subclass.marshal=近接攻撃が命中するとコンボがつながる。\n\n_装弾数+5_\n_銃の命中精度+1_
skills4.subclass.executioner=体力が40%を下回ると、激怒によってダメージが50%増え、銃の発射速度も50%上がる。\n\n_リロード速度+25%_
