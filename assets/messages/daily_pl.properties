daily.brief_0=Posiłki Króla Szczurów są już w drodze. Pokonaj go, zanim dotrą na dwór. Uwięziony strażnik może pomóc ci w walce, a w pilnowanym magazynie znajdziesz zapasy.
daily.brief_1=Bunt ma osłonić ucieczkę Tengu. Pokonaj obu przywódców ucieczki, by otworzyć jego kryjówkę, a potem samego Tengu, zanim upłynie czas. Uwolnij więźniów, by walczyli ze strażnikami, lub przeszukaj zamkniętą zbrojownię. Wejście do kryjówki zamknie się za tobą.
daily.brief_2=Trzech górników zostało pod ziemią, a ostatnia winda niedługo rusza. Otwórz ich schronienia, doprowadź wszystkich żywych do windy i wyjedź z kopalni. DM-300 przemierza tunele. Możesz z nim walczyć lub go ominąć. Zapasy i zamknięte skróty mogą ułatwić ratunek.
daily.brief_3=Lodowy pazur, gnoll szronogrzbiety i szronoróg krążą po jaskiniach. Zabij wszystkie trzy stworzenia i dotrzyj do odległego wyjścia, zanim nadejdzie burza. Kolejność łowów zależy od ciebie. W bocznych korytarzach są zapasy, ale szukanie kosztuje czas.
daily.brief_4=Trzy miejsca rytuału sprowadzają demony do sal. Dotarcie do każdego z nich i zapieczętowanie go przerwie napływ wrogów z tego miejsca. Zamknij wszystkie, zanim rytuał się zakończy. Wybierz drogę i zajrzyj do bocznych komnat, jeśli potrzebujesz zapasów.
daily.brief_5=Broń posterunku do nadejścia pomocy. Kapitan musi przeżyć pięć fal napastników. Obrońcy utrzymają środek, gdy ty walczysz, szukasz zapasów lub otwierasz cele z posiłkami. Obserwuj wejścia: późniejsze fale mogą uderzyć z kilku stron.
daily.brief_6=Złoto miasta spoczywa w królewskim skarbcu. Znajdź kapitana, zabierz mu klucz, otwórz skarbiec i ucieknij przez odległą bramę, zanim się zamknie. Otwarcie skarbca wywoła alarm. Możesz najpierw przeszukać magazyny i otworzyć skróty albo zaryzykować szybką kradzież z mniejszym zapasem.
daily.rules=Każdy dzień ma własnego bohatera, ekwipunek i loch. Przed wyruszeniem wydaj punkty umiejętności. Czas liczy się w turach. Opuszczenie wydarzenia kończy próbę. Codzienne wydarzenia mają osobne wyniki i nie odblokowują odznak ani wpisów w kompendium.
