daily.timeout_0=Posiłki dotarły na dwór. Musisz się wycofać.\n\nMożesz spróbować ponownie w Codziennych wyzwaniach.
daily.timeout_1=Czas minął. Tengu uciekł podczas buntu.\n\nMożesz spróbować ponownie w Codziennych wyzwaniach.
daily.timeout_2=Ostatnia winda odjechała. Nie udało się wydostać wszystkich na czas.\n\nMożesz spróbować ponownie w Codziennych wyzwaniach.
daily.timeout_3=Burza zasypała wyjście. Łowy dobiegły końca.\n\nMożesz spróbować ponownie w Codziennych wyzwaniach.
daily.timeout_4=Rytuał dobiegł końca. Demony opanowały sale.\n\nMożesz spróbować ponownie w Codziennych wyzwaniach.
daily.timeout_6=Bramy miasta się zamknęły. Strażnicy odcięli ci drogę ucieczki.\n\nMożesz spróbować ponownie w Codziennych wyzwaniach.
