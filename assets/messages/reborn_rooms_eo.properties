levels.rebornsiderooms.leave=Lasi ĝin
actors.mobs.npcs.echoreflection.name=via spegulbildo
actors.mobs.npcs.echoreflection.desc=Pala kopio de vi atendas senmove. Ĝi batalos nur post via defio. Venku ĝin por ricevi unu lertopoenton. Forlaso de la ĉambro finas la duelon kaj plene resanigas la spegulbildon.
actors.mobs.npcs.echoreflection.challenge=Ĉu defii vian spegulbildon? Venko donas unu lertopoenton. Vi povas retiriĝi, sed la spegulbildo resaniĝos se vi forlasos la ĉambron.
actors.mobs.npcs.echoreflection.accept=Defii
actors.mobs.npcs.echoreflection.withdrawn=Via spegulbildo denove senmoviĝas.
actors.mobs.npcs.echoreflection.victory=La spegulbildo dissolviĝas, lasante skribrulaĵon de lerto.
actors.mobs.npcs.barbecueking.name=rata reĝo
actors.mobs.npcs.barbecueking.desc=Eĉ reĝo devas manĝi. Li trovis trankvilan angulon por rosti sian vespermanĝon.
actors.mobs.npcs.barbecueking.greeting=Reĝaj aferoj. Tre gravaj. Tre bongustaj.
actors.mobs.npcs.barbecueking.stolen=HEJ! Tio estis mia!
actors.mobs.npcs.barbecueking.after=Mi esperas, ke ĝi restos en via gorĝo.
actors.mobs.npcs.forgottenoffering.name=forgesita oferaĵo
actors.mobs.npcs.forgottenoffering.desc=Manĝoporcio kaj saniga eliksiro kuŝas sub la kristalo. Elektu unu; la alia fariĝos polvo.
actors.mobs.npcs.watchremains.name=falinta gardisto
actors.mobs.npcs.watchremains.desc=Ostoj de gardisto kuŝas apud rompita muro. Paperpeco troviĝas sub lia kasko.
actors.mobs.npcs.watchremains.note=Mi defendis la pordon la tutan nokton. Ili venis tra la muro.
