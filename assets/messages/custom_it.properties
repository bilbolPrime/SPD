levels.sign.burn=Nel momento in cui provi a leggere il cartello, questo si incendia di fiamme verdastre.
levels.sign.tip_01=Non sopravvalutare la tua forza, usa armi e armature che sei in grado di maneggiare.
levels.sign.tip_05=Attenzione alla melma!
levels.sign.tip_06=Pixel-Mart: tutto ciò che ti serve per un'avventura di successo!
levels.sign.tip_07=Identifica le tue pozioni e pergamene il prima possibile. Non rimandare fino al momento in cui ne avrai effettivamente bisogno.
levels.sign.tip_08=Avere fame non fa male, ma morire di fame sì.
levels.sign.tip_10=Non lasciate uscire il Tengu!
levels.sign.tip_11=Pixel-Mart. Spendi soldi. Vivi più a lungo.
levels.sign.tip_12=Quando vieni attaccato da più mostri contemporaneamente, cerca di ripararti dietro una porta.
levels.sign.tip_14=Non ha senso possedere più di un Ankh contemporaneamente, perché li perderete al momento della resurrezione.
levels.sign.tip_15=PERICOLO! I macchinari pesanti possono causare lesioni, perdita di arti o morte!
levels.sign.tip_16=Pixel-Mart. Una vita più sicura nel dungeon.
levels.sign.tip_17=Quando si potenzia un'arma incantata, esiste una possibilità di distruggere l'incantesimo.
levels.sign.tip_18=Armi e armature si deteriorano più rapidamente di bacchette e anelli, ma esistono più modi per ripararle.
levels.sign.tip_19=L'unico modo per ottenere una Pergamena di Annientamento è riceverla in dono dagli spiriti del dungeon.
levels.sign.tip_20=Vietato portare armi in presenza di Sua Maestà!
