custom.difficulty.easy=Facile
custom.difficulty.easy.desc=- Inizia con 2 razioni extra.\n- Inizia con 2 pozioni curative.\n- Inizia con 200 monete d'oro.\n- Inizia con 2 cristalli dell'anima.\n- Bonus per scoprire porte e trappole nascoste.\n- I mob sono deboli, infliggono il 25% di danni in meno, subiscono il 10% di danni in più e hanno il 15% di HP in meno.\n- Tasso di generazione dei campioni impostato al 10%.\n- Tasso di rilascio dei campioni impostato al 30%.
custom.difficulty.hard=Difficile
custom.difficulty.hard.desc=- Pozione curativa cura il 75% dei punti vita massimi.\n- I mob sono forti, infliggono il 10% di danni extra, subiscono il 10% di danni in meno e hanno il 20% di punti vita in più.\n- Tasso di generazione del campione impostato al 30%.\n- Tasso di rilascio del campione impostato al 50%.
custom.difficulty.hell.desc=- Pozione curativa cura il 50% dei punti vita massimi.\n- I mob sono immortali, infliggono il 35% di danni in più, subiscono il 30% di danni in meno e hanno il 45% di punti vita in più.\n- Tasso di generazione del campione impostato al 50%.\n- L'eroe inizia con 4 punti vita massimi in meno.\n- L'eroe ottiene 1 punto vita massimo in meno salendo di livello.\n- Tasso di rilascio del campione impostato al 70%.
custom.difficulty.just_kill_me=Uccidimi e basta
custom.difficulty.just_kill_me.desc=- Inizia con due pozioni di esperienza.\n- La pozione di guarigione cura il 10% dei punti vita massimi.\n- I mob sono divinità, infliggono il 60% di danni in più, subiscono il 40% di danni in meno e hanno il 75% di punti vita in più.\n- Tasso di generazione dei campioni impostato al 100%.\n- L'eroe inizia con 8 punti vita massimi in meno.\n- L'eroe ottiene 3 punti vita massimi in meno salendo di livello.\n- Tasso di rilascio dei campioni impostato al 100%.
custom.difficulty.nightmare.desc=- Pozione curativa cura il 25% dei punti vita massimi.\n- I mob sono divini, infliggono il 45% di danni in più, subiscono il 30% di danni in meno e hanno il 60% di punti vita in più.\n- Tasso di generazione del campione impostato al 70%.\n- L'eroe inizia con 8 punti vita massimi in meno.\n- L'eroe guadagna 3 punti vita massimi in meno salendo di livello.\n- Tasso di rilascio del campione impostato al 90%.
custom.difficulty.normal.desc=- I mob sono standard.\n- Tasso di generazione dei campioni impostato al 20%.\n- Tasso di rilascio dei campioni impostato al 40%.
custom.difficulty.super_easy=Facilissimo
custom.difficulty.super_easy.desc=- Inizia con 5 razioni extra.\n- Inizia con 5 pozioni curative.\n- Inizia con 500 Oro.\n- Inizia con 3 cristalli dell'anima.\n- I mob sono patetici, infliggono il 50% di danni in meno, subiscono il 50% di danni in più e hanno il 50% di HP in meno.\n- Tasso di generazione dei campioni impostato al 10%.\n- Tasso di rilascio dei campioni impostato al 10%.
levels.sign.dead_end=Che ci fai qui?!
levels.sign.tip_02=Non tutte le porte del dungeon sono visibili a prima vista. Se rimani bloccato, cerca le porte nascoste.
levels.sign.tip_03=Ricorda che aumentare la tua forza non è l'unico modo per accedere a equipaggiamento migliore. Puoi anche fare il contrario, abbassando il requisito di forza con le Pergamene di Potenziamento.
levels.sign.tip_04=Potrai spendere il tuo oro nei negozi situati nei livelli più profondi del dungeon. Il primo si trova al sesto livello.
levels.sign.tip_09=Un attacco a sorpresa ha maggiori probabilità di successo. Ad esempio, puoi tendere un'imboscata al tuo nemico dietro una porta chiusa quando sai che si sta avvicinando.
levels.sign.tip_13=Se stai bruciando, non puoi spegnere il fuoco nell'acqua mentre leviti.
levels.sign.tip_21=Pixel-Mart. Prezzi speciali per i cacciatori di demoni!
actors.blobs.waterofawareness.drink_message=Mentre sorseggi la pozione, senti la conoscenza fluire nella tua mente. Ora conosci tutto sugli oggetti che hai equipaggiato. Inoltre, percepisci tutti gli oggetti presenti nel livello e ne conosci tutti i segreti.
