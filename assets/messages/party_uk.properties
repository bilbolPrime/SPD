actors.skills.raiseskeletonskill.desc=Викликає скелета, що битиметься на вашому боці.
network.partysession.background=З’єднання із загоном розірвано, оскільки ви залишили гру.
items.corpse.name=труп
items.corpse.desc=Свіжий труп, придатний для некромантії.
items.armorkit.desc=Ці інструменти перетворюють будь-яку броню на епічну. Вона зберігає властивості й отримує здібність вашого класу. Ремісничі навички не потрібні.
items.bomb.desc=Невелика бомба з чорним порохом. Ґніт займається під час кидка.
items.quest.driedrose.desc=Троянда давно висохла, але зберегла всі пелюстки.
items.quest.phantomfish.desc=Цю маленьку напівпрозору рибку ледве видно в повітрі. У воді вона майже непомітна.
items.tomeofmastery.desc=Ця тонка книга в потертій шкіряній палітурці ніби містить чимало знань. Читання потребує часу.
items.weightstone.desc=Дозволяє збалансувати зброю ближнього бою для кращої швидкості або точності.
items.wands.wandofamok.desc=Фіолетове світло доводить ціль до шалу. Вона нападає на найближчих істот без розбору.
items.wands.wandofavalanche.desc=Влучивши у стіну чи іншу тверду перешкоду, розряд спричиняє каменепад, що ранить і приголомшує істот у зоні удару.
items.wands.wandofflock.desc=Прикликає отару чарівних овець, які тимчасово перекривають шлях.
items.wands.wandofpoison.desc=Отруює ціль і завдає періодичної шкоди. Поліпшення подовжують дію отрути.
items.wands.wandofreach.desc=Підбирає речі здалеку й міняє вас місцями з ворогом. Хвиля запускає пастки, приминає траву та відчиняє або зачиняє двері на шляху.
items.wands.wandofslowness.desc=Тимчасово вдвічі знижує швидкість руху й атак цілі.
items.wands.wandofteleportation.desc=Переносить істоту у випадкове місце на поточному поверсі.
items.weapon.melee.dualswords.desc=Два гострі клинки для потужних ударів.
items.weapon.missiles.cupidarrow.desc=Кажуть, ця стріла належала Купідону. Обирайте ціль обережно.
items.weapon.missiles.curaredart.desc=Ці дротики завдають мало шкоди, але можуть паралізувати ціль і залишити її беззахисною.
items.weapon.missiles.incendiarydart.desc=Вістря застрягає в цілі, а прикріплена до дротика суміш спалахує.
items.weapon.missiles.soulcrystal.desc=Кристал, здатний ловити душі. Киньте його у слабкого чи ослабленого ворога, щоб упіймати його дух.
items.weapon.missiles.tamahawk.desc=Ця метальна сокира не дуже важка, але для влучного кидка потрібна сила.
network.partytext.weapon_fast=Це швидка зброя.
network.partytext.weapon_slow=Це повільна зброя.
network.partytext.weapon_accurate=Це точна зброя.
network.partytext.weapon_inaccurate=Це неточна зброя.
network.partytext.weapon_fast_and_accurate=Це швидка й точна зброя.
network.partytext.weapon_fast_but_inaccurate=Це швидка, але неточна зброя.
network.partytext.weapon_slow_but_accurate=Це повільна, але точна зброя.
network.partytext.weapon_slow_and_inaccurate=Це повільна й неточна зброя.
network.partytext.necroblade_bolt=З рівня 5 повністю заряджений клинок може випустити _Темний снаряд_, здатний знищити сутність цілі та перетворити її на слугу.
network.partytext.necroblade_intro=Створений темною магією клинок поглинає душі жертв і стає сильнішим.
network.partytext.necroblade_energy=Накопичені душі: _%s/100_
network.partytext.necroblade_damage=Душі додають _0–%d шкоди_.
network.partytext.necroblade_hungry=Клинок може поглинути повний запас душ, щоб стати сильнішим.
network.partytext.necroblade_full=Клинок більше не може покращувати себе, поглинаючи душі.
