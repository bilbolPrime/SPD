actors.mobs.rebornboss.opening=Scoperto!
actors.mobs.rebornboss.interrupted=%s perde la concentrazione!
actors.mobs.reborngoo.desc=Si sa poco della Melma. Forse non è neppure una creatura, ma un ammasso di sostanze delle fogne che ha sviluppato un accenno di volontà propria.
actors.mobs.reborngoo.warning=Goo si gonfia. Togliti dalla traiettoria!
actors.mobs.reborndm300.desc=Questa macchina fu costruita dai nani diversi secoli fa. In seguito i nani iniziarono a sostituire le macchine con golem, elementali e persino demoni, causando infine il declino della loro civiltà. Il DM-300 e le macchine simili venivano impiegati nell'edilizia e nelle miniere, e talvolta nella difesa delle città.
actors.mobs.reborndm300.repair=DM-300 si ripara!
actors.mobs.reborndm300.warning=Il motore stride. Allontanati dai segni a terra!
actors.mobs.rebornking.desc=L'ultimo re dei nani conosceva a fondo i segreti della vita e della morte. Convinse i membri della sua corte a partecipare a un rituale che avrebbe dovuto donare loro l'eterna giovinezza. Alla fine la ottenne solo lui, insieme a un esercito di non morti.
actors.mobs.rebornking.warning=Il Re alza la mano!
actors.mobs.rebornking.herald_fell=Tenete la posizione, codardi!
actors.mobs.rebornking$retainer.name_0=Guardia reale
actors.mobs.rebornking$retainer.desc_0=Un nano morto in un'armatura ammaccata. Fa ancora la guardia al suo re.
actors.mobs.rebornking$retainer.name_1=Mago di corte
actors.mobs.rebornking$retainer.desc_1=Un mago di corte risvegliato dalla morte. La magia oscura si raccoglie nelle sue mani.
actors.mobs.rebornking$retainer.name_2=Araldo reale
actors.mobs.rebornking$retainer.desc_2=Anche con la mascella rotta, questo araldo continua a sbraitare gli ordini del Re. I morti obbediscono.
actors.mobs.rebornking$retainer.name_3=Arciere non morto
actors.mobs.rebornking$retainer.desc_3=Questo nano è stato sepolto con il suo arco. Non ha dimenticato come usarlo.
actors.mobs.rebornyog.desc=Yog-Dzewa è un Antico Dio, una potente entità proveniente dai reami del caos. Un secolo fa, gli antichi nani vinsero a fatica la guerra contro il suo esercito di demoni, ma non riuscirono a uccidere il dio stesso. Lo imprigionarono quindi nelle sale sotterranee della loro città, credendolo troppo debole per risorgere mai più.
actors.mobs.rebornyog.warning=L'aria si squarcia. Esci dai segni tremolanti!
actors.mobs.rebornyog.inherit_rot=La carne appassisce. Io rimango.
actors.mobs.rebornyog.inherit_fire=Ora la fiamma è mia.
actors.mobs.rebornyog$rotting.desc=Un enorme pugno di carne putrefatta. Una melma fetida cola tra le sue dita e macchia la pietra sottostante.
actors.mobs.rebornyog$rotting.warning=Il pugno putrido prende lo slancio!
actors.mobs.rebornyog$burninghand.desc=Un enorme pugno avvolto dal fuoco. Le dita crepitano mentre si chiudono, lasciando cadere braci sul pavimento.
actors.mobs.rebornyog$burninghand.warning=Le braci si raccolgono davanti al pugno ardente!
actors.mobs.reborntengu.shadow_broken=La mia ombra…!
