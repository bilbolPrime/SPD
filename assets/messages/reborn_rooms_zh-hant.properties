levels.rebornsiderooms.leave=離開
actors.mobs.npcs.echoreflection.name=你的倒影
actors.mobs.npcs.echoreflection.desc=一個蒼白的你靜靜等候著。只有接受挑戰，它才會戰鬥。擊敗它可獲得一點技能點。離開房間就會結束決鬥，倒影也會恢復全部生命。
actors.mobs.npcs.echoreflection.challenge=挑戰你的倒影？獲勝可獲得一點技能點。你可以撤退，但離開房間後，倒影會恢復生命。
actors.mobs.npcs.echoreflection.accept=挑戰
actors.mobs.npcs.echoreflection.withdrawn=你的倒影重新歸於平靜。
actors.mobs.npcs.echoreflection.victory=倒影消散了，留下一張技能卷軸。
actors.mobs.npcs.barbecueking.name=鼠王
actors.mobs.npcs.barbecueking.desc=國王也得吃飯。牠找了個安靜的角落，正烤著自己的晚餐。
actors.mobs.npcs.barbecueking.greeting=王室要務。非常重要。非常美味。
actors.mobs.npcs.barbecueking.stolen=喂！那是我的！
actors.mobs.npcs.barbecueking.after=小心噎著你。
actors.mobs.npcs.forgottenoffering.name=被遺忘的供品
actors.mobs.npcs.forgottenoffering.desc=水晶下放著一份口糧和一瓶治療藥劑。選一樣，另一樣就會化為塵土。
actors.mobs.npcs.watchremains.name=陣亡的守衛
actors.mobs.npcs.watchremains.desc=破牆邊躺著一具守衛的骸骨，頭盔下壓著一張紙條。
actors.mobs.npcs.watchremains.note=守了一整夜的門。牠們卻從牆裡進來了。
