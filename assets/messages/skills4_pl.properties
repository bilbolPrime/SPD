skills4.subclass.gladiator=Udane trafienia w walce wręcz tworzą kombinację, zwiększając obrażenia do późniejszych trafień.\n\n_+3 celność w walce wręcz_\n_10% szybsze ataki w zwarciu_
skills4.subclass.berserker=Poniżej 40% zdrowia Furia zwiększa obrażenia o 50%.\n\n_10% więcej obrażeń w walce wręcz_\n_10% mniej otrzymywanych obrażeń_
skills4.subclass.battlemage=Trafienia różdżką w zwarciu przywracają jeden ładunek i dodają liczbę ładunków do obrażeń.\n\n_Iskra ma 50% szans na oślepienie celu na 3 tury._
skills4.subclass.warlock=Zabijanie wrogów przywraca zdrowie i zaspokaja głód.\n\n_Iskra zadaje 5 dodatkowych obrażeń._\n_Jedno dodatkowe przywołane stworzenie._
skills4.subclass.freerunner=Bez zbyt ciężkiego wyposażenia i dopóki nie głodujesz, poruszasz się o 60% szybciej. Podczas ruchu twój unik się podwaja.
skills4.subclass.assassin=Ataki z zaskoczenia zadają dodatkowe obrażenia.\n\n_+1 skradanie_
skills4.subclass.warden=Deptanie wysokiej trawy daje Korową skórę. Rośliny mogą pozostawiać dodatkowe nasiona i rosę.
skills4.subclass.sniper=Ataki dystansowe ignorują zbroję i zaznaczają cel, co pozwala na szybsze wykonanie ataku.\n\n_20% większe obrażenia dystansowe_
skills4.subclass.spirit_binder=Trafienia różdżką w zwarciu przywracają jeden ładunek i dodają liczbę ładunków do obrażeń.\n\n_Ożywione szkielety istnieją dwa razy dłużej._
skills4.subclass.lich=Zabijanie wrogów przywraca zdrowie i zaspokaja głód.\n\n_Ożywione szkielety i szkielety łucznicy są dwa razy silniejsi._\n_Jedno dodatkowe przywołane stworzenie._
skills4.subclass.marshal=Udane trafienia w walce wręcz tworzą kombinację.\n\n_+5 amunicji do broni_\n_+1 celność broni_
skills4.subclass.executioner=Poniżej 40% zdrowia Furia zwiększa obrażenia o 50%, a strzały są o 50% szybsze.\n\n_25% szybsze przeładowanie_
