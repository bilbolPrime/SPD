skills4.smash.intro=Uderza sąsiadującego wroga z brutalną siłą.
skills4.endurance.intro=Zwiększa maksymalne zdrowie.
skills4.firm_hand.intro=Poprawia twoją celność w walce wręcz.
skills4.regeneration.intro=Z czasem przywraca dodatkowe zdrowie. Nie działa podczas głodowania.
skills4.toughness.intro=Zmniejsza otrzymywane obrażenia, z wyjątkiem głodu.
skills4.knockback.intro=Uderza wroga i odpycha go o jedno pole. Bossów nie można popychać.
skills4.second_wind.intro=Natychmiast przywraca część zdrowia.
skills4.sure_footing.intro=Skraca czas unieruchomienia korzeniami i okaleczenia.
skills4.mastery.intro=Popraw efektywny poziom swojej broni i prędkość ataku.
skills4.parry.intro=Zmniejsza obrażenia od następnego otrzymanego ciosu wręcz. Ochrona trwa do czterech tur.
skills4.smite.intro=Zadaje mocny cios, który ignoruje połowę pancerza celu. Zajmuje dwie tury.
skills4.riposte.intro=Wzmacnia twoje następne uderzenie wręcz po bloku. Trwa cztery tury.
skills4.footwork.intro=Daje ci więcej czasu pomiędzy trafieniami w walce wręcz, aby utrzymać kombinację.
skills4.duelist.intro=Zwiększa uniki, gdy obok ciebie stoi dokładnie jeden wróg.
skills4.disarming_strike.intro=Uderza wroga i osłabia go na trzy tury.
skills4.find_the_gap.intro=Trzecie trafienie wręcz z rzędu i każde następne ignoruje część pancerza celu.
skills4.aggression.intro=Twoje obrażenia w walce wręcz rosną wraz z utratą zdrowia.
skills4.charge.intro=Doskakuje do wroga oddalonego o najwyżej cztery pola i uderza go. Droga musi być wolna.
skills4.rampage.intro=Uderza każdego sąsiadującego wroga.
skills4.bloodlust.intro=Przyspiesza ataki wręcz na trzy tury po zabiciu.
skills4.war_cry.intro=Osłabia widocznych wrogów w promieniu dwóch pól.
skills4.rend.intro=Szarża i Szał wywołują krwawienie u przeciwników, którzy przeżyli.
skills4.relentless.intro=Zabicie przeciwnika skraca pozostały czas odnowienia Szarży i Okrzyku wojennego.
skills4.cornered.intro=Zmniejsza obrażenia otrzymywane w walce wręcz, gdy otacza cię dwóch lub więcej wrogów.

skills4.spark.intro=Wystrzeliwuje iskrę w widocznego wroga.
skills4.spirituality.intro=Zwiększa maksymalną manę.
skills4.sorcerer.intro=Twoje różdżki zadają większe obrażenia.
skills4.summon_rat.intro=Wezwij szczura, żeby walczył za ciebie.
skills4.meditation.intro=Z czasem odzyskaj dodatkową manę.
skills4.spirit_armor.intro=Absorbuje obrażenia, zużywając jedną manę na każdy pochłonięty punkt.
skills4.wizard.intro=Twoje różdżki ładują się szybciej.
skills4.channeling.intro=Skraca czas odnowienia aktywnych umiejętności do co najmniej jednej tury.
skills4.charged_staff.intro=Trafienia wręcz różdżką przywracają manę.
skills4.arcane_ward.intro=Zmniejsza obrażenia od następnego otrzymanego ciosu wręcz. Ochrona trwa do czterech tur.
skills4.arcane_strike.intro=Zadaje magiczny cios, który ignoruje połowę pancerza celu.
skills4.conductive.intro=Zgromadzone ładunki wzmacniają ciosy różdżką w walce wręcz. Każdy celny cios zużywa jeden ładunek zamiast ładować różdżkę.
skills4.discharge.intro=Zadaje obrażenia wszystkim sąsiadującym wrogom wybuchem magii.
skills4.spellweave.intro=Zwiększa obrażenia różdżki na trzy tury po zadaniu ciosu wręcz.
skills4.drain_life.intro=Zadaje wrogowi obrażenia i leczy cię o połowę utraconego zdrowia.
skills4.rabid_minions.intro=Przywołane przez Ciebie stworzenia zadają więcej obrażeń.
skills4.summon_skeleton.intro=Wezwij szkielet, aby walczył o ciebie.
skills4.soul_hunger.intro=Przywraca manę po zabiciu wroga.
skills4.enrage.intro=Gdy umiejętność jest włączona, przywołane stworzenia zadają i otrzymują więcej obrażeń.
skills4.slow.intro=Spowalnia ruch i ataki wroga.
skills4.summoner.intro=Możesz zatrzymać jeszcze jedno przywołane stworzenie.
skills4.dark_pact.intro=Poświęca pięć punktów zdrowia, aby przywrócić manę. Wymaga co najmniej sześciu punktów zdrowia.

skills4.double_strike.intro=Uderz dwukrotnie w krótkim odstępie czasu.
skills4.stealth.intro=Wrogom trudniej cię zauważyć.
skills4.evasion.intro=Zwiększa szansę na uniknięcie ataków.
skills4.smoke_bomb.intro=Zniknij w chmurze dymu. Atak przerywa efekt.
skills4.bandit.intro=Znajdź dodatkowe złoto w każdym zebranym stosie.
skills4.venom.intro=Gdy umiejętność jest włączona, twoje trafienia wręcz mogą zatruć cel.
skills4.locksmith.intro=Masz szansę rozbroić pułapkę, kiedy na nią nadepniesz.
skills4.light_step.intro=Skraca czas unieruchomienia korzeniami i okaleczenia.
skills4.dash.intro=Przesuwa się o maksymalnie dwa pola po wolnej ścieżce.
skills4.haste.intro=Zwiększa prędkość ruchu na pięć tur.
skills4.shadow_clone.intro=Stwórz jednego silnego klona lub trzy słabsze klony, które będą walczyć o ciebie.
skills4.escape.intro=Usuwa unieruchomienie i okaleczenie, a następnie zwiększa uniki na cztery tury.
skills4.trailblazer.intro=Zwiększa prędkość ruchu.
skills4.skirmish.intro=Poruszanie się wzmacnia kolejne trafienia w walce wręcz.
skills4.keep_distance.intro=Zwiększa uniki w przypadku wrogów oddalonych o więcej niż jedno pole.
skills4.ambush.intro=Zwiększa obrażenia w walce wręcz, gdy jest niewidzialny.
skills4.scorpion.intro=Twój jad zadaje większe obrażenia.
skills4.silent_death.intro=Ciosy wręcz mogą natychmiast zabić śpiącego wroga. Nie działa na bossów.
skills4.expose.intro=Twoje trafienia w walce wręcz ignorują część zbroi.
skills4.execution.intro=Zwiększa obrażenia zadawane wrogom poniżej jednej czwartej zdrowia.
skills4.deadly_throw.intro=Zwiększa obrażenia broni dystansowej.

skills4.accuracy.intro=Twoje ataki dystansowe są dokładniejsze.
skills4.awareness.intro=Masz szansę uniknąć nadchodzącego ataku dystansowego.
skills4.double_shot.intro=Wypuszcza dwie strzały jedna po drugiej. Zużywa dwie zwykłe strzały.
skills4.hunting.intro=Podczas eksploracji znajduje surowe mięso.
skills4.fletching.intro=Podczas eksploracji tworzy zwykłe strzały.
skills4.ko_arrow.intro=Twoja następna strzała spowalnia cel i może go uśpić.
skills4.woodcraft.intro=Sprawia, że ​​wrogowie trudniej cię zauważyć.
skills4.quickdraw.intro=Przyspiesza ataki dystansowe.
skills4.barkskin.intro=Zwiększa twój pancerz.
skills4.nature_mend.intro=Natychmiast przywraca część zdrowia.
skills4.entangle.intro=Unieruchamia widocznego wroga w miejscu.
skills4.herbalist.intro=Zmniejsza obrażenia od trucizny.
skills4.dew_keeper.intro=Zwiększa leczenie otrzymywane z rosy.
skills4.knee_shot.intro=Twoje strzały mogą okaleczyć cel.
skills4.thicket.intro=Zmniejsza obrażenia od następnego otrzymanego ciosu wręcz. Ochrona trwa do czterech tur.
skills4.aimed_shot.intro=Zwiększa obrażenia następnej trafionej strzały.
skills4.long_sight.intro=Zwiększa obrażenia dystansowe zadawane wrogom oddalonym o co najmniej cztery pola.
skills4.piercing_shot.intro=Następna strzała ignoruje część pancerza celu.
skills4.iron_tip.intro=Żelazne końcówki pozwalają strzałom przechodzić przez wrogów i uderzać w tych, którzy znajdują się za nimi. Mury i sojusznicy zatrzymują strzałę.
skills4.mark_prey.intro=Oznacza wroga na sześć tur, zwiększając zadawane mu obrażenia.
skills4.bombvoyage.intro=Zamień strzałę w bombę. Eksplozja może również zranić Ciebie i Twoich sojuszników.
skills4.follow_through.intro=Zabójstwo wzmacnia twoje następne trafienie dystansowe na cztery tury.

skills4.curse.intro=Osłabiaj ataki wroga na dziesięć tur.
skills4.necro_spirit.intro=Zwiększa maksymalną manę.
skills4.raise_skeleton.intro=Wskrzesza szkielet ze zwłok na ziemi.
skills4.summon_ghost.intro=Wezwij ducha, aby walczył dla ciebie.
skills4.soul_bind.intro=Zwiększa obrażenia zadawane przez przywołane stworzenia.
skills4.necro_meditation.intro=Z czasem odzyskaj dodatkową manę.
skills4.necro_drain_life.intro=Wysysaj zdrowie wroga i odzyskuj połowę zadanych obrażeń.
skills4.master_of_death.intro=Przywraca cię do życia z pełnym zdrowiem i maną. Moc musi się odnowić, zanim ponownie cię uratuje.
skills4.spirit_army.intro=Pozwala utrzymywać jeszcze jedno przywołane stworzenie.
skills4.mend_bones.intro=Leczy przywołane stworzenia w zasięgu wzroku.
skills4.guardian_bond.intro=Zmniejsza obrażenia otrzymywane przez przywołane stworzenia.
skills4.corpse_explosion.intro=Zdetonuj zwłoki. Wybuch uderza wszystkich znajdujących się obok niego, łącznie z tobą i twoimi sojusznikami.
skills4.raise_skeleton_archer.intro=Wskrzesza szkieletowego łucznika ze zwłok na ziemi.
skills4.last_rites.intro=Daje każdemu przywołanemu jedną szansę na przeżycie śmiertelnego ciosu przy jednej czwartej zdrowia.
skills4.soul_shelter.intro=Zmniejsza obrażenia od następnego otrzymanego ciosu wręcz. Ochrona trwa do czterech tur.
skills4.cold_touch.intro=Uderza wroga i spowalnia go na trzy tury.
skills4.necro_slow.intro=Spowalnia ruch i ataki wroga.
skills4.bone_spear.intro=Wystrzeliwuje w przeciwnika pocisk grobowej magii.
skills4.death_fed.intro=Przywraca manę po zabiciu wroga.
skills4.cruel_study.intro=Zwiększa obrażenia zadawane przez różdżki.
skills4.withering_wave.intro=Zadaje sąsiadującym wrogom obrażenia od zimna i spowalnia ich na trzy tury.

skills4.steady_aim.intro=Twój strzał jest dokładniejszy.
skills4.packrat.intro=Zwiększa pojemność magazynka broni palnej.
skills4.fast_reload.intro=Przyspiesza przeładowanie broni palnej.
skills4.quick_draw.intro=Strzelaj szybciej.
skills4.veteran_company.intro=Wynajęci najemnicy pod twoim dowództwem zadają większe obrażenia.
skills4.field_medicine.intro=Natychmiast przywraca część zdrowia.
skills4.powder.intro=Zwiększa obrażenia broni palnej.
