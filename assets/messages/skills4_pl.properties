skills4.volley.intro=Oddaj silniejszy strzał.
skills4.rally.intro=Leczy ciebie i twoich sojuszników w promieniu dwóch pól.
skills4.guard_order.intro=Wynajęci najemnicy pod twoim dowództwem otrzymują mniejsze obrażenia.
skills4.suppress.intro=Twoje następne trafienie bronią palną osłabia cel.
skills4.counter_fire.intro=Otrzymanie obrażeń w walce wręcz wzmacnia twoje następne trafienie bronią palną na cztery tury.
skills4.i_am_the_law.intro=Tymczasowo zwiększaj swoje maksymalne i obecne zdrowie na dwadzieścia tur.
skills4.headshot.intro=Twój następny strzał zadaje większe obrażenia i zyskuje na celności.
