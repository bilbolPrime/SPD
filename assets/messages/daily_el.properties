daily.outpost_gate_desc=Εισβολείς μπορούν να μπουν από εδώ στο φρούριο. Πρόσεχε για κίνηση πριν από το επόμενο κύμα.
daily.outpost_cell=Κελί φυλακής
daily.outpost_cell_desc=Ένας υπερασπιστής είναι κλειδωμένος μέσα. Άνοιξε το κελί και θα ενωθεί με τη φρουρά.
