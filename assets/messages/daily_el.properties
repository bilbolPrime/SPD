daily.defender_desc_0=Ο λοχαγός κρατά το κέντρο του φυλακίου. Πρέπει να ζήσει μέχρι να έρθει βοήθεια.
daily.defender_desc_1=Ο φρουρός μάχεται κοντά στη θέση του και επιστρέφει εκεί ανάμεσα στις επιθέσεις.
daily.defender_desc_2=Ο τοξότης υπερασπίζεται το φυλάκιο μένοντας κοντά στη θέση του.
daily.defender_captive_desc=Φυλακίστηκε όταν έπεσε το φρούριο. Άνοιξε το κελί και θα βοηθήσει στην άμυνα.
daily.raider_0=Επιδρομέας
