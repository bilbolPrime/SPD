daily.hunt_exit_desc=Η έξοδος από τις σπηλιές. Τελείωσε το κυνήγι και φύγε πριν κλείσει το πέρασμα από τη θύελλα.
daily.hunt_entrance=Χιονισμένη είσοδος
daily.hunt_entrance_desc=Το χιόνι έθαψε τον δρόμο της επιστροφής. Τελείωσε το κυνήγι και βρες τη μακρινή έξοδο.
daily.hunt_left_one=Απομένει ένα πλάσμα. Τελείωσε το κυνήγι πριν φύγεις.
