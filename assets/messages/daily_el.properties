daily.mine_wait_one=Πρέπει να φτάσει ακόμη ένας μεταλλωρύχος στον ανελκυστήρα.
daily.mine_safe=Ένας μεταλλωρύχος φτάνει στον ανελκυστήρα.
daily.miner_lost=Ένας μεταλλωρύχος πέθανε. Δεν κατάφερες να τους σώσεις όλους.\n\nΜπορείς να δοκιμάσεις ξανά στις Καθημερινές προκλήσεις.
