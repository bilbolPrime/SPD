daily.mine_cell=Καταφύγιο μεταλλωρύχου
daily.mine_cell_desc=Ένας μεταλλωρύχος οχύρωσε την πόρτα για να γλιτώσει από τα πλάσματα. Άνοιξέ την και οδήγησέ τον στον ανελκυστήρα.
daily.mine_free_prompt=Να ανοίξει το καταφύγιο; Ο μεταλλωρύχος θα σε ακολουθήσει στον ανελκυστήρα. Κράτησέ τον μακριά από κινδύνους.
daily.mine_free=Άνοιγμα καταφυγίου
