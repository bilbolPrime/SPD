daily.brief_0=Οι ενισχύσεις του Βασιλιά των Αρουραίων έρχονται. Νίκησέ τον πριν φτάσουν στην αυλή του. Ένας αιχμάλωτος δεσμοφύλακας μπορεί να σε βοηθήσει στη μάχη, ενώ η φρουρούμενη αποθήκη έχει προμήθειες.
daily.brief_1=Η εξέγερση καλύπτει την απόδραση του Τένγκου. Νίκησε και τους δύο αρχηγούς της απόδρασης για να ανοίξεις το κρησφύγετό του, έπειτα νίκησε τον ίδιο πριν λήξει ο χρόνος. Ελευθέρωσε κρατούμενους για να πολεμήσουν τους φρουρούς ή ψάξε το κλειδωμένο οπλοστάσιο. Η είσοδος στο κρησφύγετο θα κλείσει πίσω σου.
daily.brief_2=Τρεις μεταλλωρύχοι έχουν παγιδευτεί και ο τελευταίος ανελκυστήρας φεύγει σύντομα. Άνοιξε τα καταφύγιά τους, οδήγησε και τους τρεις ζωντανούς πίσω και φύγε με τον ανελκυστήρα. Το DM-300 περιφέρεται στις στοές. Πολέμησέ το ή βρες άλλο δρόμο. Οι προμήθειες και τα κλειδωμένα περάσματα μπορούν να βοηθήσουν στη διάσωση.
daily.brief_3=Ένα παγονύχι, ένα γκνολ παγόραχο κι ένα παγοκέρατο περιφέρονται στις σπηλιές. Σκότωσέ τα και φτάσε στη μακρινή έξοδο πριν κλείσει ο δρόμος από τη θύελλα. Εσύ διαλέγεις τη σειρά. Υπάρχουν προμήθειες στα πλαϊνά περάσματα, αλλά η αναζήτηση κοστίζει χρόνο.
daily.brief_4=Τρεις τόποι τελετής καλούν δαίμονες στις αίθουσες. Φτάσε σε καθέναν και σφράγισέ τον πριν ολοκληρωθεί η τελετή. Κάθε σφραγίδα σταματά μία πηγή ενισχύσεων. Διάλεξε διαδρομή και ψάξε τους πλαϊνούς θαλάμους αν χρειάζεσαι προμήθειες.
daily.brief_5=Κράτησε το φυλάκιο μέχρι να έρθει βοήθεια. Ο λοχαγός πρέπει να επιζήσει από πέντε κύματα επιθέσεων. Οι υπερασπιστές θα κρατούν το κέντρο όσο πολεμάς, ψάχνεις προμήθειες ή ανοίγεις κελιά για βοήθεια. Πρόσεχε τις προσβάσεις: τα επόμενα κύματα μπορούν να έρθουν από πολλές πλευρές.
daily.brief_6=Το χρυσάφι της πόλης βρίσκεται στο βασιλικό θησαυροφυλάκιο. Βρες τον λοχαγό, πάρε το κλειδί του, άνοιξε το θησαυροφυλάκιο και φύγε από τη μακρινή πύλη πριν κλείσει. Το άνοιγμα σημαίνει συναγερμό. Μπορείς πρώτα να ψάξεις τις αποθήκες και να ανοίξεις συντομεύσεις ή να ρισκάρεις μια γρήγορη ληστεία με λιγότερα εφόδια.
daily.rules=Κάθε ημερομηνία έχει τον δικό της ήρωα, εξοπλισμό και μπουντρούμι. Ξόδεψε τους πόντους δεξιοτήτων πριν ξεκινήσεις. Ο χρόνος μετριέται σε γύρους. Αν φύγεις από το συμβάν, η προσπάθεια τελειώνει. Τα καθημερινά συμβάντα έχουν ξεχωριστά αποτελέσματα και δεν ξεκλειδώνουν εμβλήματα ή εγγραφές στην εγκυκλοπαίδεια.
daily.time_left=Απομένουν _%d_ γύροι
daily.timeout_0=Οι ενισχύσεις έφτασαν στην αυλή. Πρέπει να υποχωρήσεις.\n\nΜπορείς να δοκιμάσεις ξανά στις Καθημερινές προκλήσεις.
daily.timeout_1=Ο χρόνος τελείωσε. Ο Τένγκου ξέφυγε μέσα στην εξέγερση.\n\nΜπορείς να δοκιμάσεις ξανά στις Καθημερινές προκλήσεις.
daily.timeout_2=Ο τελευταίος ανελκυστήρας έφυγε. Δεν πρόλαβες να βγάλεις τους πάντες.\n\nΜπορείς να δοκιμάσεις ξανά στις Καθημερινές προκλήσεις.
daily.timeout_3=Η θύελλα έθαψε την έξοδο. Το κυνήγι τελείωσε.\n\nΜπορείς να δοκιμάσεις ξανά στις Καθημερινές προκλήσεις.
daily.timeout_4=Η τελετή ολοκληρώθηκε. Οι δαίμονες κατέκλυσαν τις αίθουσες.\n\nΜπορείς να δοκιμάσεις ξανά στις Καθημερινές προκλήσεις.
daily.timeout_6=Οι πύλες της πόλης έκλεισαν. Οι φρουροί έκοψαν τον δρόμο της φυγής.\n\nΜπορείς να δοκιμάσεις ξανά στις Καθημερινές προκλήσεις.
