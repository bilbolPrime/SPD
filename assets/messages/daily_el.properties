daily.ally_2=Μεταλλωρύχος
daily.ally_captive_desc_2=Ο μεταλλωρύχος κρύφτηκε όταν οι στοές έγιναν επικίνδυνες. Άνοιξε την πόρτα και οδήγησέ τον στον ανελκυστήρα.
daily.ally_free_desc_2=Ο μεταλλωρύχος σε ακολουθεί στον ανελκυστήρα. Δεν μπορεί να πολεμήσει, γι' αυτό κράτησέ τον μακριά από τα πλάσματα.
daily.ally_freed_2=Ο μεταλλωρύχος σε ακολουθεί.
daily.foe_8=Νυχτερίδα ορυχείου
daily.foe_9=Θηριώδες γκνολ
daily.foe_10=Αράχνη σπηλαίων
daily.foe_desc_8=Νυχτερίδα που φωλιάζει στο ορυχείο. Κινείται γρήγορα και τρέφεται με το αίμα που ρουφά.
