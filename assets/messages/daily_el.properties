daily.raider_2=Βετεράνος επιδρομέας
daily.raider_3=Σαμάνος επιδρομέων
daily.raider_desc_0=Προχωρά προς το φυλάκιο. Ελαφρά θωρακισμένος, αλλά επικίνδυνος σε ομάδα.
daily.raider_desc_1=Σκελετός που μάχεται στο πλευρό των επιδρομέων.
