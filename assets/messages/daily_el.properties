daily.seal_site_desc_0=Σουκούμπες βγαίνουν από αυτόν τον τόπο. Στάσου στον βωμό και σφράγισέ τον για να τις σταματήσεις.
daily.seal_site_desc_1=Σκορπιοί βγαίνουν από αυτόν τον τόπο. Στάσου στον βωμό και σφράγισέ τον για να τους σταματήσεις.
daily.seal_site_desc_2=Κακά μάτια βγαίνουν από αυτόν τον τόπο. Στάσου στον βωμό και σφράγισέ τον για να τα σταματήσεις.
daily.seal_close_prompt=Να σφραγιστεί ο βωμός; Χρειάζονται δύο γύροι. Οι δαίμονες που βρίσκονται ήδη στις αίθουσες θα παραμείνουν.
