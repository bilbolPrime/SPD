daily.hunt_depart=Έξοδος από τις σπηλιές
daily.hunt_won=Πέρασες το ορεινό πέρασμα!\n\nΤο κυνήγι και η διαφυγή κράτησαν %d γύρους.
daily.quarry_desc_0=Ένα από τα τρία θηράματα. Το παγωμένο κέλυφός του σκληραίνει όταν αμύνεται. Η φωτιά σπάει την άμυνά του.
daily.quarry_desc_1=Ένα από τα τρία θηράματα. Παίρνει φόρα πριν από ένα συντριπτικό χτύπημα. Φύγε από το σημαδεμένο έδαφος.
daily.quarry_desc_2=Ένα από τα τρία θηράματα. Ορμά σε ευθεία και μετά χρειάζεται λίγο χρόνο για να συνέλθει. Βγες από την πορεία του πριν ορμήσει.
daily.foe_desc_11=Νυχτερίδα που κρύβεται στις παγωμένες σπηλιές. Το δάγκωμά της αφήνει επίμονο κρύο.
daily.miners_safe=Ασφαλείς μεταλλωρύχοι: _%d/%d_
