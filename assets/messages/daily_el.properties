daily.seal_closed_desc=Η τελετή σε αυτόν τον βωμό διακόπηκε. Δεν μπορούν να περάσουν άλλοι δαίμονες από εδώ.
daily.seal_entrance=Κλειστό πέρασμα
daily.seal_entrance_desc=Η τελετή έκοψε τον δρόμο της επιστροφής. Σφράγισε και τους τρεις βωμούς για να τη διακόψεις.
daily.demon_desc_0=Το άγγιγμά της μπορεί να σε γοητεύσει για λίγο, εμποδίζοντάς σε να της επιτεθείς.
daily.demon_desc_1=Ρίχνει αγκάθια από μακριά. Τα χτυπήματά του μπορούν να σε επιβραδύνουν.
daily.demon_desc_2=Ετοιμάζει ένα φονικό βλέμμα κατά μήκος του σημαδεμένου εδάφους. Βγες από την πορεία του πριν χτυπήσει.
