actors.skills.raiseskeletonskill.desc=Alza un esqueleto solo si la casilla objetivo contiene un cadáver.
actors.skills.raiseskeletonskill.lich=Liche: duplica la potencia de invocación y permite alzar un esqueleto adicional.
actors.skills.raiseskeletonskill.spiritbinder=Vinculador de espíritus: duplica la duración de los esqueletos alzados.
network.partysession.background=Te desconectaste del grupo al salir del juego.
items.corpse.name=cadáver
items.corpse.desc=Un cadáver reciente que puede usarse para nigromancia.
items.armorkit.desc=Estas herramientas convierten cualquier armadura en una armadura épica. Conserva sus propiedades y obtiene una habilidad propia de tu clase. No requiere conocimientos de artesanía.
items.bomb.desc=Una pequeña bomba de pólvora negra. La mecha se enciende al lanzarla.
items.quest.driedrose.desc=La rosa lleva mucho tiempo seca, pero conserva todos sus pétalos.
items.quest.phantomfish.desc=Este pequeño pez translúcido apenas se ve fuera del agua. Dentro resulta casi invisible.
items.tomeofmastery.desc=Este libro de cuero gastado es delgado, pero parece guardar mucho conocimiento. Leerlo lleva algo de tiempo.
items.weightstone.desc=Permite equilibrar un arma cuerpo a cuerpo para mejorar su velocidad o precisión.
items.wands.wandofamok.desc=Su luz violeta enloquece al objetivo, que ataca sin distinguir a las criaturas cercanas.
items.wands.wandofavalanche.desc=Al golpear una pared u otro obstáculo sólido, provoca un desprendimiento que daña y aturde a las criaturas de la zona.
items.wands.wandofflock.desc=Invoca un rebaño de ovejas mágicas que bloquea el paso temporalmente.
items.wands.wandofpoison.desc=Envenena al objetivo y causa daño periódico. Las mejoras prolongan el veneno.
items.wands.wandofreach.desc=Recoge objetos a distancia e intercambia tu posición con enemigos. La onda activa trampas, aplasta hierba y abre o cierra las puertas a su paso.
items.wands.wandofslowness.desc=Reduce a la mitad la velocidad de movimiento y ataque del objetivo durante un tiempo.
items.wands.wandofteleportation.desc=Teletransporta a una criatura a un lugar aleatorio de la planta.
items.weapon.melee.dualswords.desc=Dos hojas afiladas para golpear con más fuerza.
items.weapon.missiles.cupidarrow.desc=Dicen que esta flecha perteneció a Cupido. Elige bien a quién apuntas.
items.weapon.missiles.curaredart.desc=Estos dardos causan poco daño, pero pueden paralizar al objetivo y dejarlo indefenso.
items.weapon.missiles.incendiarydart.desc=La punta se clava en el objetivo mientras la mezcla adherida al dardo prende en llamas.
items.weapon.missiles.soulcrystal.desc=Un cristal capaz de atrapar almas. Lánzalo contra un enemigo débil o debilitado para capturar su espíritu.
items.weapon.missiles.tamahawk.desc=Esta hacha arrojadiza no pesa mucho, pero exige fuerza para usarla bien.
network.partytext.weapon_fast=Es un arma rápida.
network.partytext.weapon_slow=Es un arma lenta.
network.partytext.weapon_accurate=Es un arma precisa.
network.partytext.weapon_inaccurate=Es un arma poco precisa.
network.partytext.weapon_fast_and_accurate=Es un arma rápida y precisa.
network.partytext.weapon_fast_but_inaccurate=Es un arma rápida, pero poco precisa.
network.partytext.weapon_slow_but_accurate=Es un arma lenta, pero precisa.
network.partytext.weapon_slow_and_inaccurate=Es un arma lenta y poco precisa.
network.partytext.necroblade_bolt=A nivel 5, la hoja completamente cargada puede lanzar _Proyectil oscuro_, que puede destruir la esencia de un objetivo y convertirlo en un sirviente.
network.partytext.necroblade_intro=Forjada con magia oscura, esta hoja devora las almas de sus víctimas y se vuelve más poderosa.
network.partytext.necroblade_energy=Almas almacenadas: _%s/100_
network.partytext.necroblade_damage=Las almas añaden _0–%d de daño_.
network.partytext.necroblade_hungry=La hoja puede consumir una carga completa de almas para volverse más fuerte.
network.partytext.necroblade_full=La hoja ya no puede mejorarse consumiendo almas.
