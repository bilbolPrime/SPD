items.scrolls.scrolloffrostlevel.name=Svitek jinovatky
items.scrolls.scrolloffrostlevel.desc=Z pergamenu sálá chlad.\n\nSvitek lze také kdekoli roztrhnout a zmrazit všechny nepřátele na patře. Rozmrznou, až utrpí zranění. Na bosse a tvory imunní vůči mrazu to nepůsobí. Nezpůsobuje to žádné zranění.
items.scrolls.scrolloffrostlevel.ac_tear=Roztrhnout
items.scrolls.scrolloffrostlevel.tear_confirm=Roztržením svitku uvolníš jeho magii. Všichni nepřátelé na patře zmrznou. Rozmrznou, až utrpí zranění. Na bosse a tvory imunní vůči mrazu to nepůsobí. Nezpůsobuje to žádné zranění.\n\nRoztrhnout svitek?
items.scrolls.scrolloffrostlevel.wrong_place=Svitek zde nefunguje.
items.scrolls.scrolloffrostlevel.spent=Průchod už byl otevřen. Svitek mlčí.
items.keys.key.ice_depth=Tento klíč patří k podlaží %d Ledových jeskyní.
scenes.interlevelscene$mode.frost=Vstup do Ledových jeskyní...
levels.icecaveslevel.water_name=Ledová voda
levels.icecaveslevel.water_desc=Tenká krusta ledu praská pod nohama.
levels.icecaveslevel.wall_desc=Stopy krumpáčů mizí pod silnými žílami ledu. Horníci opustili tyto štoly, když chlad pronikl do skály.
levels.cavesbosslevel.collapsed_name=Zavalená jeskyně
levels.cavesbosslevel.collapsed_desc=Zavalená jeskyně. Přes spadané kamení se nedá projít.
actors.buffs.frostbite.name=Omrzliny
actors.buffs.frostbite.desc=Chlad zpomaluje tvůj pohyb o 20%.
actors.mobs.rimebat.name=Jinovatkový netopýr
actors.mobs.rimebat.desc=Tito bledí netopýři hnízdí pod ledem. Jejich studené kousnutí krátce zpomalí pohyb a poskytne jim čas na další nálet.\n\nImunní vůči zmrazení a ledové magii.
actors.mobs.iceclaw.name=Ledový dráp
actors.mobs.iceclaw.desc=Mrchožrout s krunýřem z pevného ledu. Před bojem nakrátko zesílí svou zbroj. Oheň tuto dodatečnou ochranu roztaví.\n\nImunní vůči zmrazení a ledové magii.
actors.mobs.frostback.name=Gnoll mrazohřbet
actors.mobs.frostback.desc=Tento gnoll přežil chlad okrádáním neopatrných návštěvníků. Když zvedne zbraň, uhni: těžký úder dopadne tam, kde jsi stál.\n\nImunní vůči zmrazení a ledové magii.
actors.mobs.shardling.name=Střípkovec
actors.mobs.shardling.desc=Neklidný shluk ledových krystalů. Zamíří a pak vystřelí úlomky v přímé linii. Stěny salvu zastaví.\n\nImunní vůči zmrazení a ledové magii.
actors.mobs.hollowminer.name=Prázdný horník
actors.mobs.hollowminer.desc=Tento horník ze zmrzlých štol nikdy neunikl. Jeho lucerna stále hoří, přestože je dávno mrtvý. Pokud ji stihne zvednout, přivolá okolní tvory do boje. Zásah přeruší signál.\n\nImunní vůči zmrazení a ledové magii.
actors.mobs.rimehorn.name=Jíniroh
actors.mobs.rimehorn.desc=Těžké zvíře s jinovatkou v srsti. Před přímým výpadem hrabe do země. Ustup z jeho cesty, dokud se připravuje.\n\nImunní vůči zmrazení a ledové magii.
actors.mobs.oldrime.name=Staré Jíní
actors.mobs.oldrime.desc=Horníci našli Staré Jíní pod horou, pohřbené v ledu starším než jejich tunely. Jejich krumpáče je probudily. Nyní střeží zmrzlé štoly a průchod za nimi. Jak slábne, jeho zbroj se láme a uvolňuje končetiny. Pozor na těžké údery, led prorážející podlahu a mrazivý dech.\n\nImunní vůči zmrazení a ledové magii.
actors.mobs.oldrime.warning=Staré Jíní se napřahuje k úderu!
windows.wndjournal.ice_depth=Led %d
levels.icebosslevel.exit_name=Jeskynní průchod
levels.icebosslevel.exit_desc=Úzká chodba vede hlouběji do hory.
levels.icebosslevel.blocked_name=Zamrzlý průchod
levels.icebosslevel.blocked_desc=Ledová stěna blokuje průchod za Starým Jíním.
items.weapon.ice.wrong_hero=Tato zbraň není pro tebe.
items.weapon.ice.already_enchanted=Tato zbraň už je očarovaná.
items.weapon.ice.glaciercleaver.name=Ledovcový sekáč
items.weapon.ice.glaciercleaver.desc=Široká čepel vytesaná z ledu Starého Jíní. Zásah pokryje cíl jinovatkou na čtyři tahy. Další úder Ledovcovým sekáčem ji roztříští a způsobí %d dodatečného poškození. Používat jej může pouze Válečník.
actors.buffs.frostcoating.name=Pokrytý jinovatkou
actors.buffs.frostcoating.desc=Tohoto tvora pokrývá tenká vrstva jinovatky. Úder Ledovcového sekáče ji roztříští.
items.weapon.ice.hoarfroststaff.name=Hůl námrazy
items.weapon.ice.hoarfroststaff.desc=Mezi hroty hole se hromadí chlad. Její střely způsobují %d-%d poškození před bonusy dovedností a na dva tahy zpomalují pohyb i útoky. Zpočátku má tři náboje a dobíjí se jako hůlka. Používat ji může pouze Mág.
items.weapon.ice.rimepick.name=Jinovatkový krumpáč
items.weapon.ice.rimepick.desc=Tento úzký ledový krumpáč nachází mezery ve zbroji. Obchází čtvrtinu zbroje cíle, nebo polovinu, pokud je cíl překvapen. Používat jej může pouze Zloděj.
items.weapon.ice.frostbow.name=Mrazivý luk
items.weapon.ice.frostbow.desc=Šípy z tohoto luku se při zásahu roztříští na ostrý led. Cíli způsobí o %d%% více poškození a sousedním nepřátelům čtvrtinu poškození tohoto zásahu. Úlomky oběti nezmrazují. Používat jej může pouze Lovkyně.
items.weapon.ice.gravefrostscythe.name=Kosa hrobového mrazu
items.weapon.ice.gravefrostscythe.desc=Jinovatka pokrývá rukojeť kosy obloženou kostmi. Když je vybavena, tvoji vyvolaní kostlivci a duchové způsobují při každém zásahu %d dodatečného poškození chladem. Používat ji může pouze Nekromant.
items.weapon.ice.frostbiterifle.name=Puška omrzlin
items.weapon.ice.frostbiterifle.desc=Komora pušky je vyložena ledem, který nikdy netaje. Každý zásah způsobí omrzliny na dva tahy a zpomalí pohyb o 20%. Další zásahy obnoví účinek. Používat ji může pouze Žoldák.
library.ice_weapon_drop=Pro každého hrdinu vypadne jedna zbraň odpovídající jeho třídě.

actors.mobs.npcs.prospector.name=Uvízlý prospektor
actors.mobs.npcs.prospector.desc=Prospektor v záplatovaném kabátě se ukrývá u schodů. Jeho lampa už skoro dohořela.
actors.mobs.npcs.prospector.torches=Moje lampa už dlouho nevydrží. Při útěku jsem tu nechal truhlu se zásobami. Přineseš mi z ní _tři pochodně_?
actors.mobs.npcs.prospector.iceclaws=Ledové drápy mě vyhnaly ze štoly. Zabij _tři ledové drápy v tomto patře_, abych se mohl vrátit k práci.
actors.mobs.npcs.prospector.accept=Pomůžu ti.
actors.mobs.npcs.prospector.later=Teď ne.
actors.mobs.npcs.prospector.need_torches=Potřebuji _tři pochodně_. Truhla je pořád někde v tomto patře.
actors.mobs.npcs.prospector.claws_left=Zbývá zabít ledových drápů: _%d_.
actors.mobs.npcs.prospector.reward=Dobrá práce. Co si vybereš?
actors.mobs.npcs.prospector.rations=Dva příděly jídla
actors.mobs.npcs.prospector.thanks=O jednu starost méně. Děkuju.
library.quest.prospector_torches.name=Dohořívající lampa
library.quest.prospector_torches.desc=Přines uvízlému prospektorovi tři pochodně. V truhle v jeho patře jich je dost.
library.quest.prospector_iceclaws.name=Drápy ve štole
library.quest.prospector_iceclaws.desc=Zabij tři ledové drápy v prospektorově patře a vrať se k němu.
library.quest.prospector.reward=Vyber si svitek vylepšení nebo dva příděly jídla.
items.scrolls.scrolloffrostlevel.read_confirm=Při čtení cítíš, že tě svitek každou chvíli teleportuje.
