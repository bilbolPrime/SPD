items.scrolls.scrolloffrostlevel.name=Scroll of Frost
items.scrolls.scrolloffrostlevel.desc=Cold seeps through this parchment.\n\nYou can also tear it anywhere to freeze all enemies on the floor until they take damage. Bosses and creatures immune to frost are unaffected. It deals no damage.
items.scrolls.scrolloffrostlevel.ac_tear=Tear
items.scrolls.scrolloffrostlevel.tear_confirm=Tearing this scroll will release its magic, freezing all enemies on the floor until they take damage. Bosses and creatures immune to frost are unaffected. It deals no damage.\n\nTear the scroll?
items.scrolls.scrolloffrostlevel.wrong_place=The scroll doesn't work here.
items.scrolls.scrolloffrostlevel.spent=The passage has already been opened. The scroll is silent.
items.keys.key.ice_depth=This key belongs to depth %d of the Ice Caves.
scenes.interlevelscene$mode.frost=Entering the Ice Caves...
levels.icecaveslevel.water_name=Icy water
levels.icecaveslevel.water_desc=A thin crust of ice breaks underfoot.
levels.icecaveslevel.wall_desc=Pick marks disappear beneath thick veins of ice. The miners abandoned these workings as the cold spread through the rock.
levels.cavesbosslevel.collapsed_name=Collapsed cave
levels.cavesbosslevel.collapsed_desc=A collapsed cave. There is no way through the fallen rock.
actors.buffs.frostbite.name=Frostbitten
actors.buffs.frostbite.desc=The cold slows your movement by 20%.
actors.mobs.rimebat.name=Rime bat
actors.mobs.rimebat.desc=These pale bats roost beneath the ice. Their cold bite briefly slows movement, giving them time to circle for another attack.\n\nImmune to freezing and cold magic.
actors.mobs.iceclaw.name=Iceclaw
actors.mobs.iceclaw.desc=A scavenger with a shell of packed ice. It braces before a fight, thickening its armour for a short time. Fire melts that extra protection.\n\nImmune to freezing and cold magic.
actors.mobs.frostback.name=Frostback gnoll
actors.mobs.frostback.desc=This gnoll has survived the cold by stealing from anyone foolish enough to enter. When it raises its weapon, step aside: the heavy blow will land where you were standing.\n\nImmune to freezing and cold magic.
actors.mobs.shardling.name=Shardling
actors.mobs.shardling.desc=A restless knot of ice crystals. It lines up a shot before firing shards down a straight path. Walls stop the volley.\n\nImmune to freezing and cold magic.
actors.mobs.hollowminer.name=Hollow miner
actors.mobs.hollowminer.desc=This miner never escaped the frozen workings. Its lantern still burns, though its owner is long dead. If allowed to raise the lantern, it calls nearby creatures to the fight. A hit interrupts the signal.\n\nImmune to freezing and cold magic.
actors.mobs.rimehorn.name=Rimehorn
actors.mobs.rimehorn.desc=A heavy beast with frost packed into its fur. It paws at the ground before charging in a straight line. Move out of its path while it prepares.\n\nImmune to freezing and cold magic.
actors.mobs.oldrime.name=Old Rime
actors.mobs.oldrime.desc=The miners found Old Rime beneath the mountain, buried in ice older than their tunnels. Their picks woke it. Now it guards the frozen workings and the passage beyond. Its armour breaks away as it weakens, freeing its limbs. Watch for heavy swings, ice breaking through the floor, and its freezing breath.\n\nImmune to freezing and cold magic.
actors.mobs.oldrime.warning=Old Rime draws back to strike!
windows.wndjournal.ice_depth=Ice %d
levels.icebosslevel.exit_name=Cave passage
levels.icebosslevel.exit_desc=A narrow passage winds deeper into the mountain.
levels.icebosslevel.blocked_name=Frozen passage
levels.icebosslevel.blocked_desc=A wall of ice blocks the passage behind Old Rime.
items.weapon.ice.wrong_hero=This weapon is not meant for you.
items.weapon.ice.already_enchanted=This weapon is already enchanted.
items.weapon.ice.glaciercleaver.name=Glacier Cleaver
items.weapon.ice.glaciercleaver.desc=A broad blade cut from Old Rime's ice. A hit coats the target in frost for four turns. The next hit with a Glacier Cleaver shatters it for %d extra damage. Only a Warrior can wield it.
actors.buffs.frostcoating.name=Frost-coated
actors.buffs.frostcoating.desc=A thin layer of frost clings to this creature. A hit from a Glacier Cleaver will shatter it.
items.weapon.ice.hoarfroststaff.name=Hoarfrost Staff
items.weapon.ice.hoarfroststaff.desc=Cold gathers between the prongs of this staff. Its bolts deal %d-%d damage before skill bonuses and slow movement and attacks for two turns. It holds three charges at first and recharges like a wand. Only a Mage can wield it.
items.weapon.ice.rimepick.name=Rime Pick
items.weapon.ice.rimepick.desc=This narrow ice pick finds the gaps in armour. It bypasses a quarter of the target's armour, or half when the target is caught unaware. Only a Rogue can wield it.
items.weapon.ice.frostbow.name=Frost Bow
items.weapon.ice.frostbow.desc=Arrows fired from this bow burst into sharp ice on impact. They deal %d%% more damage to the target and a quarter of that hit's damage to adjacent enemies. The shards do not freeze their victims. Only a Huntress can wield it.
items.weapon.ice.gravefrostscythe.name=Gravefrost Scythe
items.weapon.ice.gravefrostscythe.desc=Frost clings to the bone-bound handle of this scythe. While it is equipped, your raised skeletons and ghosts deal %d extra cold damage per hit. Only a Necromancer can wield it.
items.weapon.ice.frostbiterifle.name=Frostbite Rifle
items.weapon.ice.frostbiterifle.desc=The chamber of this rifle is lined with ice that never melts. Each successful shot inflicts frostbite for two turns, slowing movement by 20%. Further hits refresh the effect. Only a Mercenary can wield it.
library.ice_weapon_drop=One weapon drops for each hero, matching their class.

actors.mobs.npcs.prospector.name=Stranded prospector
actors.mobs.npcs.prospector.desc=A prospector in a patched coat, sheltering by the stairs. His lamp is nearly out.
actors.mobs.npcs.prospector.torches=My lamp won't last much longer. I left a supply chest on this floor when I ran. Bring me _three torches_ from it, would you?
actors.mobs.npcs.prospector.iceclaws=The iceclaws have driven me out of my workings. Kill _three iceclaws on this floor_ so I can get back to work.
actors.mobs.npcs.prospector.accept=I'll help.
actors.mobs.npcs.prospector.later=Not now.
actors.mobs.npcs.prospector.need_torches=I need _three torches_. The supply chest is still somewhere on this floor.
actors.mobs.npcs.prospector.claws_left=Iceclaws left to kill: _%d_.
actors.mobs.npcs.prospector.reward=Good work. Which would you rather have?
actors.mobs.npcs.prospector.rations=Two Rations
actors.mobs.npcs.prospector.thanks=That's one less thing to worry about. Thank you.
library.quest.prospector_torches.name=A dying lamp
library.quest.prospector_torches.desc=Bring three torches to the stranded prospector. A supply chest on his floor holds enough.
library.quest.prospector_iceclaws.name=Iceclaws in the workings
library.quest.prospector_iceclaws.desc=Kill three iceclaws on the prospector's floor, then return to him.
library.quest.prospector.reward=Choose a Scroll of Upgrade or two rations.
items.scrolls.scrolloffrostlevel.read_confirm=As you read, you feel yourself about to be teleported.
