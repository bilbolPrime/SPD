items.scrolls.scrolloffrostlevel.name=Cuộn giấy sương giá
items.scrolls.scrolloffrostlevel.desc=Hơi lạnh tỏa ra từ tấm da này.\n\nBạn cũng có thể xé cuộn giấy ở bất cứ đâu để đóng băng toàn bộ kẻ địch trên tầng cho đến khi chúng chịu sát thương. Trùm và các sinh vật miễn nhiễm với đóng băng không bị ảnh hưởng. Không gây sát thương.
items.scrolls.scrolloffrostlevel.ac_tear=Xé
items.scrolls.scrolloffrostlevel.tear_confirm=Xé cuộn giấy này sẽ giải phóng phép thuật bên trong, đóng băng toàn bộ kẻ địch trên tầng cho đến khi chúng chịu sát thương. Trùm và các sinh vật miễn nhiễm với đóng băng không bị ảnh hưởng. Không gây sát thương.\n\nXé cuộn giấy?
items.scrolls.scrolloffrostlevel.wrong_place=Cuộn giấy không có tác dụng ở đây.
items.scrolls.scrolloffrostlevel.spent=Lối đi đã được mở. Cuộn giấy không phản ứng.
items.keys.key.ice_depth=Chìa khóa này thuộc tầng %d của Hang Băng.
scenes.interlevelscene$mode.frost=Đang vào Hang Băng...
levels.icecaveslevel.water_name=Nước băng giá
levels.icecaveslevel.water_desc=Lớp băng mỏng vỡ dưới chân.
levels.icecaveslevel.wall_desc=Dấu cuốc bị che lấp dưới những mạch băng dày. Thợ mỏ đã bỏ nơi này khi hơi lạnh lan vào đá.
levels.cavesbosslevel.collapsed_name=Hang sập
levels.cavesbosslevel.collapsed_desc=Một hang động đã sập. Đá đổ chặn kín lối đi.
actors.buffs.frostbite.name=Bỏng lạnh
actors.buffs.frostbite.desc=Cái lạnh làm tốc độ di chuyển của bạn giảm 20%.
actors.mobs.rimebat.name=Dơi sương giá
actors.mobs.rimebat.desc=Những con dơi nhợt nhạt này trú dưới băng. Vết cắn lạnh buốt làm chậm di chuyển trong chốc lát, cho chúng thời gian vòng lại tấn công.\n\nMiễn nhiễm với đóng băng và phép thuật băng giá.
actors.mobs.iceclaw.name=Vuốt băng
actors.mobs.iceclaw.desc=Một loài ăn xác có vỏ băng cứng. Nó gồng mình trước trận đánh, tăng giáp trong thời gian ngắn. Lửa làm tan lớp bảo vệ thêm này.\n\nMiễn nhiễm với đóng băng và phép thuật băng giá.
actors.mobs.frostback.name=Gnoll lưng giá
actors.mobs.frostback.desc=Con gnoll này sống sót qua giá lạnh bằng cách cướp những kẻ liều lĩnh đi vào đây. Hãy tránh sang bên khi nó giơ vũ khí: đòn nặng sẽ giáng xuống chỗ bạn vừa đứng.\n\nMiễn nhiễm với đóng băng và phép thuật băng giá.
actors.mobs.shardling.name=Tinh thể sống
actors.mobs.shardling.desc=Một khối tinh thể băng luôn cựa quậy. Nó ngắm trước khi bắn mảnh băng theo đường thẳng. Tường chặn được loạt bắn.\n\nMiễn nhiễm với đóng băng và phép thuật băng giá.
actors.mobs.hollowminer.name=Thợ mỏ rỗng
actors.mobs.hollowminer.desc=Người thợ mỏ này chưa bao giờ thoát khỏi đường hầm đóng băng. Đèn vẫn cháy dù chủ nhân đã chết từ lâu. Nếu để nó giơ đèn lên, nó sẽ gọi các sinh vật gần đó đến đánh. Một đòn trúng sẽ ngắt tín hiệu.\n\nMiễn nhiễm với đóng băng và phép thuật băng giá.
actors.mobs.rimehorn.name=Sừng giá
actors.mobs.rimehorn.desc=Một con thú nặng nề với sương giá bám đầy lông. Nó cào đất trước khi lao thẳng tới. Hãy rời khỏi đường lao khi nó đang chuẩn bị.\n\nMiễn nhiễm với đóng băng và phép thuật băng giá.
actors.mobs.oldrime.name=Lão Sương
actors.mobs.oldrime.desc=Thợ mỏ tìm thấy Lão Sương dưới núi, bị vùi trong lớp băng còn cổ hơn các đường hầm. Tiếng cuốc đã đánh thức nó. Giờ nó canh giữ khu mỏ đóng băng và lối đi phía sau. Khi yếu đi, giáp của nó vỡ ra, giải phóng tay chân. Coi chừng những cú vung mạnh, băng xuyên lên từ sàn và hơi thở lạnh cóng.\n\nMiễn nhiễm với đóng băng và phép thuật băng giá.
actors.mobs.oldrime.warning=Lão Sương lấy đà ra đòn!
windows.wndjournal.ice_depth=Băng %d
levels.icebosslevel.exit_name=Lối đi trong hang
levels.icebosslevel.exit_desc=Một lối đi hẹp dẫn sâu vào lòng núi.
levels.icebosslevel.blocked_name=Lối đi đóng băng
levels.icebosslevel.blocked_desc=Một bức tường băng chặn lối đi sau Lão Sương.
items.weapon.ice.wrong_hero=Vũ khí này không dành cho bạn.
items.weapon.ice.already_enchanted=Vũ khí này đã được phù phép.
items.weapon.ice.glaciercleaver.name=Đao băng hà
items.weapon.ice.glaciercleaver.desc=Lưỡi đao rộng được đẽo từ băng của Lão Sương. Đòn trúng phủ sương giá lên mục tiêu trong bốn lượt. Đòn tiếp theo từ Đao băng hà phá vỡ lớp sương, gây thêm %d sát thương. Chỉ Chiến Binh có thể dùng.
actors.buffs.frostcoating.name=Phủ sương giá
actors.buffs.frostcoating.desc=Một lớp sương mỏng bám trên sinh vật này. Đòn đánh từ Đao băng hà sẽ phá vỡ nó.
items.weapon.ice.hoarfroststaff.name=Trượng sương trắng
items.weapon.ice.hoarfroststaff.desc=Hơi lạnh tụ giữa các nhánh đầu trượng. Tia phép gây %d-%d sát thương trước phần cộng từ kỹ năng, đồng thời làm chậm di chuyển và tấn công trong hai lượt. Ban đầu có ba lần tích năng lượng và hồi lại như đũa phép. Chỉ Pháp Sư có thể dùng.
items.weapon.ice.rimepick.name=Cuốc sương giá
items.weapon.ice.rimepick.desc=Chiếc cuốc băng hẹp này tìm được khe hở trong giáp. Nó bỏ qua một phần tư giáp của mục tiêu, hoặc một nửa nếu mục tiêu bị bất ngờ. Chỉ Đạo Tặc có thể dùng.
items.weapon.ice.frostbow.name=Cung sương giá
items.weapon.ice.frostbow.desc=Tên bắn từ cung này vỡ thành băng sắc khi trúng đích. Chúng gây thêm %d%% sát thương cho mục tiêu và một phần tư sát thương của đòn đó cho kẻ địch bên cạnh. Mảnh băng không đóng băng nạn nhân. Chỉ Nữ Thợ Săn có thể dùng.
items.weapon.ice.gravefrostscythe.name=Lưỡi hái băng mộ
items.weapon.ice.gravefrostscythe.desc=Sương bám trên cán lưỡi hái quấn xương. Khi trang bị, những bộ xương và hồn ma bạn triệu hồi gây thêm %d sát thương lạnh mỗi đòn trúng. Chỉ Pháp Sư Chiêu Hồn có thể dùng.
items.weapon.ice.frostbiterifle.name=Súng trường bỏng lạnh
items.weapon.ice.frostbiterifle.desc=Buồng đạn được lót bằng băng không bao giờ tan. Mỗi phát trúng gây bỏng lạnh trong hai lượt, giảm tốc độ di chuyển 20%. Những phát tiếp theo làm mới hiệu ứng. Chỉ Lính Đánh Thuê có thể dùng.
library.ice_weapon_drop=Mỗi anh hùng nhận một vũ khí rơi ra phù hợp với lớp nhân vật của mình.

actors.mobs.npcs.prospector.name=Người thợ mỏ mắc kẹt
actors.mobs.npcs.prospector.desc=Một thợ mỏ mặc áo vá đang trú cạnh cầu thang. Đèn của ông sắp tắt.
actors.mobs.npcs.prospector.torches=Đèn của tôi không còn cháy được lâu. Lúc bỏ chạy, tôi để lại rương tiếp tế ở tầng này. Mang giúp tôi _ba cây đuốc_ trong đó nhé?
actors.mobs.npcs.prospector.iceclaws=Lũ vuốt băng đuổi tôi khỏi đường hầm. Hãy giết _ba con vuốt băng ở tầng này_ để tôi có thể trở lại làm việc.
actors.mobs.npcs.prospector.accept=Tôi sẽ giúp.
actors.mobs.npcs.prospector.later=Để sau.
actors.mobs.npcs.prospector.need_torches=Tôi cần _ba cây đuốc_. Rương vẫn ở đâu đó trên tầng này.
actors.mobs.npcs.prospector.claws_left=Số vuốt băng còn phải giết: _%d_.
actors.mobs.npcs.prospector.reward=Làm tốt lắm. Bạn muốn chọn gì?
actors.mobs.npcs.prospector.rations=Hai khẩu phần ăn
actors.mobs.npcs.prospector.thanks=Bớt được một nỗi lo. Cảm ơn bạn.
library.quest.prospector_torches.name=Ngọn đèn sắp tắt
library.quest.prospector_torches.desc=Mang ba cây đuốc cho người thợ mỏ mắc kẹt. Rương tiếp tế ở tầng của ông có đủ đuốc.
library.quest.prospector_iceclaws.name=Vuốt băng trong hầm mỏ
library.quest.prospector_iceclaws.desc=Giết ba con vuốt băng ở tầng của người thợ mỏ, rồi quay lại gặp ông.
library.quest.prospector.reward=Chọn một cuộn giấy nâng cấp hoặc hai khẩu phần ăn.
items.scrolls.scrolloffrostlevel.read_confirm=Khi đọc, bạn cảm thấy mình sắp bị dịch chuyển.
