actors.mobs.rebornboss.opening=Senŝirma!
actors.mobs.rebornboss.interrupted=%s perdas koncentriĝon!
actors.mobs.reborngoo.desc=Oni scias malmulton pri la Ŝlimo. Eble ĝi eĉ ne estas viva estaĵo, sed miksaĵo de kloakaj substancoj, kiu akiris la rudimentojn de propra volo.
actors.mobs.reborngoo.warning=Goo ŝvelas. For de ĝia vojo!
actors.mobs.reborndm300.desc=Ĉi tiun maŝinon konstruis la gnomoj antaŭ kelkaj jarcentoj. Poste ili komencis anstataŭigi maŝinojn per golemoj, elementuloj kaj eĉ demonoj. Tio fine kaŭzis la malprosperon de ilia civilizo. DM-300 kaj similaj maŝinoj kutime servis por konstruado kaj minado, foje ankaŭ por defendi la urbon.
actors.mobs.reborndm300.repair=DM-300 riparas sin!
actors.mobs.reborndm300.warning=La motoro kriegas. Forlasu la markitajn lokojn!
actors.mobs.rebornking.desc=La lasta reĝo de la gnomoj estis fama pro sia profunda kompreno de vivo kaj morto. Li konvinkis siajn korteganojn partopreni riton, kiu devis doni al ili eternan junecon. Fine nur li ricevis ĝin — kaj armeon de malmortuloj krome.
actors.mobs.rebornking.warning=La Reĝo levas sian manon!
actors.mobs.rebornking.herald_fell=Tenu la poziciojn, malkuraĝuloj!
actors.mobs.rebornking$retainer.name_0=Reĝa gardisto
actors.mobs.rebornking$retainer.desc_0=Morta gnomo en difektita kiraso ankoraŭ gardas sian reĝon.
actors.mobs.rebornking$retainer.name_1=Kortega sorĉisto
actors.mobs.rebornking$retainer.desc_1=Kortega magiisto revivigita el la mortintoj. Malluma magio kolektiĝas en liaj manoj.
actors.mobs.rebornking$retainer.name_2=Reĝa heroldo
actors.mobs.rebornking$retainer.desc_2=Eĉ kun rompita makzelo, ĉi tiu heroldo krias la ordonojn de la Reĝo. La mortintoj obeas.
actors.mobs.rebornking$retainer.name_3=Malmorta arkpafisto
actors.mobs.rebornking$retainer.desc_3=Ĉi tiu gnomo estis enterigita kun sia pafarko. Li ne forgesis kiel uzi ĝin.
actors.mobs.rebornyog.desc=Yog-Dzewa estas Malnova Dio, potenca ento el la regnoj de kaoso. Antaŭ jarcento, la antikvaj dŭarfoj apenaŭ venkis en la milito kontraŭ ĝia armeo de demonoj, sed ne kapablis mortigi la dion mem. Anstataŭe, ili malliberigis ĝin en la haloj sub sia urbo, kredante, ke ĝi estas tro malforta por iam ajn releviĝi.
actors.mobs.rebornyog.warning=La aero disŝiriĝas. Forlasu la flagrantajn markojn!
actors.mobs.rebornyog.inherit_rot=Karno velkas. Mi restas.
actors.mobs.rebornyog.inherit_fire=La flamo nun estas mia.
actors.mobs.rebornyog$rotting.desc=Grandega pugno el putranta karno. Malbonodora ŝlimo elfluas inter ĝiaj fingroj kaj makulas la ŝtonon sub ĝi.
actors.mobs.rebornyog$rotting.warning=La putra pugno pretigas frapon!
actors.mobs.rebornyog$burninghand.desc=Grandega pugno ĉirkaŭita de fajro. Ĝiaj fingroj kraketas dum ili fermiĝas, disĵetante braĝojn sur la plankon.
actors.mobs.rebornyog$burninghand.warning=Ardaĵoj amasiĝas antaŭ la brulanta pugno!
actors.mobs.reborntengu.shadow_broken=Mia ombro…!
