actors.mobs.rebornboss.opening=Уразлівы!
actors.mobs.rebornboss.interrupted=%s губляе засяроджанасць!
actors.mobs.reborngoo.desc=Пра Слізь вядома няшмат. Магчыма, гэта нават не істота, а навала рэчываў са сцёкаў, у якой з'явіліся зародкі ўласнай волі.
actors.mobs.reborngoo.warning=Гу раздзімаецца. Сыдзіце з яго шляху!
actors.mobs.reborndm300.desc=Гэтую машыну дворфы стварылі некалькі стагоддзяў таму. Пазней яны пачалі замяняць машыны големамі, элементалямі і нават дэманамі. Урэшце гэта прывяло іх цывілізацыю да заняпаду. DM-300 і падобныя машыны звычайна працавалі на будоўлях і ў шахтах, а часам і абаранялі горад.
actors.mobs.reborndm300.repair=DM-300 рамантуе сябе!
actors.mobs.reborndm300.warning=Рухавік вішчыць. Сыдзіце з пазначаных клетак!
actors.mobs.rebornking.desc=Апошні кароль дворфаў славіўся глыбокімі ведамі пра жыццё і смерць. Ён пераканаў прыдворных узяць удзел у рытуале, які мусіў даць ім вечную маладосць. У выніку яе атрымаў толькі сам кароль — а ў дадатак яшчэ і войска нежыці.
actors.mobs.rebornking.warning=Кароль падымае руку!
actors.mobs.rebornking.herald_fell=Трымайце строй, баязліўцы!
actors.mobs.rebornking$retainer.name_0=Каралеўскі вартавы
actors.mobs.rebornking$retainer.desc_0=Мёртвы дварф у пабітых даспехах. Ён усё яшчэ ахоўвае свайго караля.
actors.mobs.rebornking$retainer.name_1=Прыдворны чараўнік
actors.mobs.rebornking$retainer.desc_1=Прыдворны маг, узняты з мёртвых. У яго руках збіраецца цёмная магія.
actors.mobs.rebornking$retainer.name_2=Каралеўскі герольд
actors.mobs.rebornking$retainer.desc_2=Нават са зламанай сківіцай гэты вяшчальнік выкрыквае загады караля. Мёртвыя слухаюцца.
actors.mobs.rebornking$retainer.name_3=Мёртвы лучнік
actors.mobs.rebornking$retainer.desc_3=Гэтага дварфа пахавалі разам з лукам. Ён не забыўся, як ім карыстацца.
actors.mobs.rebornyog.desc=Ёг-Дзева — Старажытны Бог, магутная сутнасць з царства хаосу. Стагоддзе таму старажытныя гномы ледзьве выйгралі вайну супраць яго войска дэманаў, але не змаглі забіць самога бога. Замест гэтага яны зняволілі яго ў залах пад сваім горадам, лічачы, што ён занадта слабы, каб калі-небудзь зноў паўстаць.
actors.mobs.rebornyog.warning=Паветра рвецца. Сыдзіце з мігатлівых пазнак!
actors.mobs.rebornyog.inherit_rot=Плоць вяне. Я застаюся.
actors.mobs.rebornyog.inherit_fire=Цяпер полымя маё.
actors.mobs.rebornyog$rotting.desc=Велізарны кулак з гнілой плоці. Смярдзючая слізь сочыцца паміж пальцамі й пакідае плямы на камені.
actors.mobs.rebornyog$rotting.warning=Гнілы кулак замахваецца!
actors.mobs.rebornyog$burninghand.desc=Вялізны кулак, ахоплены агнём. Пальцы з трэскам сціскаюцца, рассыпаючы жар па падлозе.
actors.mobs.rebornyog$burninghand.warning=Перад палаючым кулаком збіраецца вуголле!
actors.mobs.reborntengu.shadow_broken=Мой цень…!
