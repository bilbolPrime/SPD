levels.sign.burn=Khi bạn cố gắng đọc tấm biển, nó bỗng bốc cháy thành ngọn lửa màu xanh lục.
levels.sign.tip_01=Đừng đánh giá quá cao sức mạnh của mình, hãy sử dụng vũ khí và áo giáp mà bạn có thể điều khiển được.
levels.sign.tip_05=Cẩn thận với chất nhầy!
levels.sign.tip_06=Pixel-Mart - tất cả những gì bạn cần cho một cuộc phiêu lưu thành công!
levels.sign.tip_07=Hãy xác định các loại thuốc và cuộn phép của bạn càng sớm càng tốt. Đừng trì hoãn đến lúc thực sự cần đến chúng.
levels.sign.tip_08=Đói thì không đau, nhưng chết đói thì đau.
levels.sign.tip_10=Đừng để Tengu thoát ra ngoài!
levels.sign.tip_11=Pixel-Mart. Tiêu tiền. Sống lâu hơn.
levels.sign.tip_12=Khi bị nhiều quái vật tấn công cùng lúc, hãy cố gắng lùi về phía sau cánh cửa.
levels.sign.tip_14=Không có lý do gì để sở hữu nhiều hơn một biểu tượng Ankh cùng lúc, vì bạn sẽ mất chúng khi hồi sinh.
levels.sign.tip_15=NGUY HIỂM! Máy móc hạng nặng có thể gây thương tích, mất tay chân hoặc tử vong!
levels.sign.tip_16=Pixel-Mart. Một cuộc sống an toàn hơn trong ngục tối.
levels.sign.tip_17=Khi nâng cấp vũ khí được phù phép, có khả năng phép thuật đó sẽ bị phá hủy.
levels.sign.tip_18=Vũ khí và áo giáp xuống cấp nhanh hơn gậy phép và nhẫn, nhưng lại có nhiều cách để sửa chữa chúng hơn.
levels.sign.tip_19=Cách duy nhất để có được Cuộn Giấy Xóa Sổ là nhận nó như một món quà từ các linh hồn hầm ngục.
levels.sign.tip_20=Tuyệt đối không được mang vũ khí vào trước mặt Đức Vua!
versionnewsinfo.community_links_line=- Nhấn vào nút Discord (kiểu như vậy) ở trên cùng để xem các tựa game khác và tham gia Discord/Twitter để thảo luận ý tưởng (:
