items.bags.keyring.info=Đây là một móc chìa khóa bằng đồng, giúp bạn giữ tất cả các chìa khóa riêng biệt với những vật dụng khác.
custom.difficulty.easy=Dễ
custom.difficulty.easy.desc=- Bắt đầu với 2 khẩu phần ăn bổ sung.\n- Bắt đầu với 2 bình thuốc hồi phục.\n- Bắt đầu với 200 Vàng.\n- Bắt đầu với 2 tinh thể linh hồn.\n- Thưởng khi phát hiện cửa và bẫy ẩn.\n- Quái vật yếu hơn, gây ít hơn 25% sát thương, chịu nhiều hơn 10% sát thương và có ít hơn 15% HP.\n- Tỷ lệ xuất hiện tướng được đặt thành 10%.\n- Tỷ lệ rơi đồ của tướng được đặt thành 30%.
custom.difficulty.hard=Cứng
custom.difficulty.hard.desc=- Bình thuốc hồi phục giúp hồi 75% máu tối đa.\n- Quái vật mạnh hơn, gây thêm 10% sát thương, chịu ít hơn 10% sát thương và có thêm 20% máu.\n- Tỷ lệ xuất hiện tướng được đặt ở mức 30%.\n- Tỷ lệ rơi đồ tướng được đặt ở mức 50%.
custom.difficulty.hell.desc=- Bình thuốc hồi phục giúp hồi 50% máu tối đa.\n- Quái vật bất tử, gây thêm 35% sát thương, chịu ít hơn 30% sát thương và có thêm 45% máu.\n- Tỷ lệ xuất hiện tướng được đặt ở mức 50%.\n- Anh hùng bắt đầu với ít hơn 4 máu tối đa.\n- Anh hùng mất ít hơn 1 máu tối đa khi lên cấp.\n- Tỷ lệ rơi tướng được đặt ở mức 70%.
custom.difficulty.just_kill_me=Hãy giết tôi đi
custom.difficulty.just_kill_me.desc=- Bắt đầu với hai bình kinh nghiệm.\n- Bình hồi máu hồi 10% máu tối đa.\n- Quái vật là Thần, gây thêm 60% sát thương, chịu ít hơn 40% sát thương và có thêm 75% máu.\n- Tỷ lệ xuất hiện tướng được đặt thành 100%.\n- Anh hùng bắt đầu với ít hơn 8 máu tối đa.\n- Anh hùng mất ít hơn 3 máu tối đa khi lên cấp.\n- Tỷ lệ rơi tướng được đặt thành 100%.
custom.difficulty.nightmare.desc=- Bình thuốc hồi phục giúp hồi 25% máu tối đa.\n- Quái vật trở nên mạnh mẽ hơn, gây thêm 45% sát thương, chịu ít hơn 30% sát thương và có thêm 60% máu.\n- Tỷ lệ xuất hiện tướng được đặt ở mức 70%.\n- Anh hùng bắt đầu với ít hơn 8 máu tối đa.\n- Anh hùng mất ít hơn 3 máu tối đa khi lên cấp.\n- Tỷ lệ rơi tướng được đặt ở mức 90%.
custom.difficulty.normal.desc=- Quái vật ở chế độ tiêu chuẩn.\n- Tỷ lệ xuất hiện tướng được đặt ở mức 20%.\n- Tỷ lệ rơi đồ của tướng được đặt ở mức 40%.
custom.difficulty.super_easy=Cực kỳ dễ
custom.difficulty.super_easy.desc=- Bắt đầu với 5 khẩu phần ăn bổ sung.\n- Bắt đầu với 5 bình thuốc hồi phục.\n- Bắt đầu với 500 Vàng.\n- Bắt đầu với 3 tinh thể linh hồn.\n- Quái vật trở nên yếu hơn, gây ít hơn 50% sát thương, chịu nhiều hơn 50% sát thương và có ít hơn 50% HP.\n- Tỷ lệ xuất hiện tướng được đặt ở mức 10%.\n- Tỷ lệ rơi đồ của tướng được đặt ở mức 10%.
levels.sign.dead_end=Bạn đang làm gì ở đây vậy?!
levels.sign.tip_02=Không phải tất cả các cánh cửa trong hầm ngục đều có thể nhìn thấy ngay từ cái nhìn đầu tiên. Nếu bạn bị mắc kẹt, hãy tìm kiếm những cánh cửa ẩn.
levels.sign.tip_03=Hãy nhớ rằng, tăng sức mạnh không phải là cách duy nhất để có được trang bị tốt hơn. Bạn có thể làm theo cách khác, giảm yêu cầu sức mạnh bằng cách sử dụng Cuộn giấy Nâng cấp.
levels.sign.tip_04=Bạn có thể dùng vàng của mình để mua sắm tại các cửa hàng ở những tầng sâu hơn của hầm ngục. Cửa hàng đầu tiên nằm ở tầng 6.
levels.sign.tip_09=Tấn công bất ngờ có tỷ lệ trúng đích cao hơn. Ví dụ, bạn có thể phục kích kẻ thù phía sau cánh cửa đóng kín khi biết nó đang đến gần.
levels.sign.tip_13=Nếu bạn đang bị cháy, bạn không thể dập tắt lửa trong nước khi đang lơ lửng.
levels.sign.tip_21=Pixel-Mart. Giá đặc biệt dành cho thợ săn quỷ!
actors.blobs.waterofawareness.drink_message=Khi bạn nhấp một ngụm, bạn cảm nhận được kiến thức tràn ngập tâm trí. Giờ đây bạn biết mọi thứ về các vật phẩm mình đang trang bị. Bạn cũng cảm nhận được tất cả các vật phẩm trên màn chơi và biết hết mọi bí mật của nó.
