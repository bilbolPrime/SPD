actors.mobs.rebornboss.opening=Savunmasız!
actors.mobs.rebornboss.interrupted=%s odağını kaybetti!
actors.mobs.reborngoo.desc=Balçık hakkında pek bir şey bilinmiyor. Belki de bir yaratık bile değil, kanalizasyondaki maddelerin bir araya gelip kendi iradesini kazanmaya başlamış hâli.
actors.mobs.reborngoo.warning=Goo şişiyor. Önünden çekil!
actors.mobs.reborndm300.desc=Bu makineyi cüceler yüzyıllar önce yaptı. Daha sonra makinelerin yerine golemler, elementaller, hatta iblisler kullanmaya başladılar. Sonunda bu, uygarlıklarının çöküşüne yol açtı. DM-300 ve benzeri makineler genellikle inşaat ve madencilikte, bazen de şehir savunmasında kullanılırdı.
actors.mobs.reborndm300.repair=DM-300 kendini onarıyor!
actors.mobs.reborndm300.warning=Motor çığlık atıyor. İşaretli yerlerden uzaklaş!
actors.mobs.rebornking.desc=Cücelerin son kralı, yaşam ve ölüm hakkındaki derin bilgisiyle tanınırdı. Sarayındakileri, onlara sonsuz gençlik verecek bir ayine katılmaya ikna etti. Sonunda bunu yalnızca kendisi elde etti; yanında da bir ölümsüz ordusu kazandı.
actors.mobs.rebornking.warning=Kral elini kaldırıyor!
actors.mobs.rebornking.herald_fell=Yerinizi koruyun, korkaklar!
actors.mobs.rebornking$retainer.name_0=Kraliyet muhafızı
actors.mobs.rebornking$retainer.desc_0=Yıpranmış zırhıyla ölü bir cüce. Hâlâ kralını koruyor.
actors.mobs.rebornking$retainer.name_1=Saray büyücüsü
actors.mobs.rebornking$retainer.desc_1=Ölümden döndürülen bir saray büyücüsü. Ellerinde kara büyü birikiyor.
actors.mobs.rebornking$retainer.name_2=Kraliyet habercisi
actors.mobs.rebornking$retainer.desc_2=Çenesi kırık olsa da bu haberci hâlâ Kral'ın emirlerini haykırıyor. Ölüler itaat ediyor.
actors.mobs.rebornking$retainer.name_3=Ölümsüz okçu
actors.mobs.rebornking$retainer.desc_3=Bu cüce yayıyla birlikte gömülmüş. Onu nasıl kullanacağını unutmamış.
actors.mobs.rebornyog.desc=Yog-Dzewa, kaos diyarlarından gelen güçlü bir varlık olan Kadim Tanrı'dır. Bir asır önce, kadim cüceler iblis ordusuna karşı savaşı zar zor kazanmış, ancak tanrının kendisini öldürmeyi başaramamışlardı. Bunun yerine, bir daha asla yükselemeyecek kadar zayıf olduğuna inanarak onu şehirlerinin altındaki salonlara hapsetmişlerdi.
actors.mobs.rebornyog.warning=Hava yarılıyor. Titreşen işaretlerden uzaklaş!
actors.mobs.rebornyog.inherit_rot=Et çürür. Ben kalırım.
actors.mobs.rebornyog.inherit_fire=Alev artık benim.
actors.mobs.rebornyog$rotting.desc=Çürümüş etten kocaman bir yumruk. Parmaklarının arasından pis kokulu bir balçık sızıyor, altındaki taşları lekeliyor.
actors.mobs.rebornyog$rotting.warning=Çürüyen yumruk geriliyor!
actors.mobs.rebornyog$burninghand.desc=Alevlerle kaplı dev bir yumruk. Parmakları kapanırken çıtırdıyor ve yere korlar dökülüyor.
actors.mobs.rebornyog$burninghand.warning=Yanan yumruğun önünde korlar toplanıyor!
actors.mobs.reborntengu.shadow_broken=Gölgem…!
