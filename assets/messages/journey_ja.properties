journey.title=旅路
journey.intro=ヨグは魔除けを手に入れ、その軍勢はすでに地上へと迫っている。\n\n6人の英雄を率いて、占領された地を進もう。出発するたびに道と英雄を選ぶ。命を落とした英雄は、この旅には戻れない。
journey.badge_hint=旅路を一度クリアすると、バッジ「_%s_」を獲得できます。
journey.new=新しい旅
