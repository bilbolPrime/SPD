actors.skills.raiseskeletonskill.desc=Выклікае шкілета, каб ён змагаўся побач з вамі.
network.partysession.background=Злучэнне з атрадам разарвана, бо вы пакінулі гульню.
items.corpse.name=труп
items.corpse.desc=Свежы труп, прыдатны для некрамантыі.
items.armorkit.desc=Гэтыя інструменты ператвараюць любую браню ў эпічную. Яна захоўвае ўласцівасці і атрымлівае здольнасць вашага класа. Рамесныя навыкі не патрэбныя.
items.bomb.desc=Невялікая бомба з чорным порахам. Кнот загараецца пры кідку.
items.quest.driedrose.desc=Ружа даўно высахла, але захавала ўсе пялёсткі.
items.quest.phantomfish.desc=Гэтую маленькую напаўпразрыстую рыбку ледзь відаць у паветры. У вадзе яна амаль нябачная.
items.tomeofmastery.desc=Гэтая тонкая кніга ў пацёртай скураной вокладцы нібыта захоўвае шмат ведаў. На чытанне патрэбны час.
items.weightstone.desc=Дазваляе збалансаваць зброю блізкага бою для большай хуткасці або дакладнасці.
items.wands.wandofamok.desc=Фіялетавае святло даводзіць цэль да шаленства. Яна нападае на бліжэйшых істот без разбору.
items.wands.wandofavalanche.desc=Трапіўшы ў сцяну ці іншую цвёрдую перашкоду, разрад выклікае каменяпад, які раніць і аглушае істот у вобласці ўдару.
items.wands.wandofflock.desc=Прызывае статак чароўных авечак, якія часова перакрываюць шлях.
items.wands.wandofpoison.desc=Атручвае цэль і наносіць перыядычную шкоду. Паляпшэнні падаўжаюць дзеянне атруты.
items.wands.wandofreach.desc=Падбірае рэчы здалёк і мяняе вас месцамі з ворагам. Хваля запускае пасткі, прымінае траву і адчыняе або зачыняе дзверы на шляху.
items.wands.wandofslowness.desc=Часова ўдвая зніжае хуткасць руху і атак цэлі.
items.wands.wandofteleportation.desc=Пераносіць істоту ў выпадковае месца на бягучым паверсе.
items.weapon.melee.dualswords.desc=Два вострыя клінкі для моцных удараў.
items.weapon.missiles.cupidarrow.desc=Кажуць, гэтая страла належала Купідону. Асцярожна выбірайце цэль.
items.weapon.missiles.curaredart.desc=Гэтыя дроцікі наносяць мала шкоды, але могуць паралізаваць цэль і пакінуць яе безабароннай.
items.weapon.missiles.incendiarydart.desc=Наканечнік захрасае ў цэлі, а замацаваная на дроціку сумесь успыхвае.
items.weapon.missiles.soulcrystal.desc=Крышталь, здольны лавіць душы. Кіньце яго ў слабога або аслабленага ворага, каб паланіць яго дух.
items.weapon.missiles.tamahawk.desc=Гэтая кідальная сякера не вельмі цяжкая, але для ўмелага кідка патрэбна сіла.
network.partytext.weapon_fast=Гэта хуткая зброя.
network.partytext.weapon_slow=Гэта павольная зброя.
network.partytext.weapon_accurate=Гэта дакладная зброя.
network.partytext.weapon_inaccurate=Гэта недакладная зброя.
network.partytext.weapon_fast_and_accurate=Гэта хуткая і дакладная зброя.
network.partytext.weapon_fast_but_inaccurate=Гэта хуткая, але недакладная зброя.
network.partytext.weapon_slow_but_accurate=Гэта павольная, але дакладная зброя.
network.partytext.weapon_slow_and_inaccurate=Гэта павольная і недакладная зброя.
network.partytext.necroblade_bolt=З узроўню 5 цалкам зараджаны клінок можа выпусціць _Цёмны снарад_, здольны знішчыць сутнасць цэлі і ператварыць яе ў слугу.
network.partytext.necroblade_intro=Створаны цёмнай магіяй клінок паглынае душы ахвяр і становіцца мацнейшым.
network.partytext.necroblade_energy=Назапашаныя душы: _%s/100_
network.partytext.necroblade_damage=Назапашаныя душы дадаюць _0–%d шкоды_.
network.partytext.necroblade_hungry=Клінок можа паглынуць поўны запас душ, каб стаць мацнейшым.
network.partytext.necroblade_full=Клінок больш не можа паляпшаць сябе, паглынаючы душы.
