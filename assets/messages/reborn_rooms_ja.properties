levels.rebornsiderooms.leave=立ち去る
actors.mobs.npcs.echoreflection.name=自分の幻影
actors.mobs.npcs.echoreflection.desc=青白い自分の姿が、動かずに待っている。挑戦を受けたときだけ戦う。倒すとスキルポイントを1獲得できる。部屋を出ると決闘が終わり、幻影の体力は全回復する。
actors.mobs.npcs.echoreflection.challenge=自分の幻影に挑戦する？勝利するとスキルポイントを1獲得できる。退却はできるが、部屋を出ると幻影の体力は回復する。
actors.mobs.npcs.echoreflection.accept=挑戦する
actors.mobs.npcs.echoreflection.withdrawn=幻影は再び静止した。
actors.mobs.npcs.echoreflection.victory=幻影が消え、スキルの巻物が残った。
actors.mobs.npcs.barbecueking.name=ネズミの王
actors.mobs.npcs.barbecueking.desc=王様だって腹は減る。静かな片隅を見つけて、夕食を焼いている。
actors.mobs.npcs.barbecueking.greeting=王室の用事だ。とても大事で、とてもうまい。
actors.mobs.npcs.barbecueking.stolen=おい！それはワシのだ！
actors.mobs.npcs.barbecueking.after=喉に詰まらせるがいい。
actors.mobs.npcs.forgottenoffering.name=忘れられた供物
actors.mobs.npcs.forgottenoffering.desc=水晶の下に食料と治癒のポーションが置かれている。どちらかを選ぶと、もう一方は塵になる。
actors.mobs.npcs.watchremains.name=倒れた衛兵
actors.mobs.npcs.watchremains.desc=壊れた壁のそばに衛兵の骨が横たわっている。兜の下に紙切れが挟まっている。
actors.mobs.npcs.watchremains.note=一晩中、扉を守った。奴らは壁から来た。
