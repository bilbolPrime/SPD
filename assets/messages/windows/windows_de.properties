windows.wndblacksmith$wndreforge.message=Okay, ich kann zwei identifizierte Gegenstände desselben Typs neu schmieden. Der schwächere wird zerstört, um den stärkeren aufzuwerten. Sind sie gleich stark, behalte ich den linken.
windows.wndblacksmith$wndreforge.prompt=Einen Gegenstand umschmieden
windows.wndblacksmith$wndreforge.reforge=Schmiede sie neu
windows.wndblacksmith$wndsmith.prompt=Okay, hier ist, was ich herstellen kann. Die Schmiede ist schon angeheizt, also wähle schnell aus.
windows.wndblacksmith.cashout=Auszahlung (alle Gunstpunkte): Ich kann dir einfach etwas normales Gold geben, das ich noch rumliegen habe. 1 Gold für jeden Gunstpunkt.
windows.wndblacksmith.cashout_no=Egal.
windows.wndblacksmith.cashout_verify=Okay, das war also %d Gold. Danach mache ich aber keine Arbeit mehr für dich!
windows.wndblacksmith.cashout_yes=Gib mir das Gold.
windows.wndblacksmith.harden=_Härten (%d Gunst):_ Ich kann eine Waffe oder Rüstung härten, damit es einfacher ist, eine Verzauberung oder Glyphe aufrechtzuerhalten.
windows.wndblacksmith.pickaxe=Spitzhacke (%d favor): Ich kann dir die Spitzhacke zurückgeben, wenn du willst. Ich habe noch viele mehr.
windows.wndblacksmith.pickaxe_free=Na ja, das hast du ganz gut gemacht, ich schenke es dir.
windows.wndblacksmith.pickaxe_no=Egal.
windows.wndblacksmith.pickaxe_verify=Bist du sicher, dass du das alte Ding haben willst? Das Gestein hier ist nicht weich wie in der Mine, also kannst du damit nicht mehr graben.
windows.wndblacksmith.pickaxe_yes=Ja, ich möchte es haben.
windows.wndblacksmith.prompt=Okay, abgemacht ist abgemacht. Folgendes kann ich für dich tun. Ich bearbeite nur identifizierte und nicht verfluchte Gegenstände.\n\n_Aktuelle Gunst: %d_
windows.wndblacksmith.reforge=_Umschmieden (%d Gunst):_ Ich kann zwei Gegenstände desselben Typs in einen Gegenstand höherer Qualität umschmieden.
windows.wndblacksmith.smith=_Smith (%d favor):_ Ich kann versuchen, dir eine Waffe oder Rüstung von Grund auf neu zu schmieden. Sie wird von höherer Stufe und wahrscheinlich verbessert sein, und du kannst mitbestimmen, was du bekommst.
windows.wndblacksmith.smith_no=Egal.
windows.wndblacksmith.smith_verify=Okay, ich heize die Schmiede vor, und dann kannst du dir aussuchen, was du möchtest.
windows.wndblacksmith.smith_yes=Okay, heizen Sie die Schmiede vor.
windows.wndblacksmith.upgrade=_Upgrade (%d favor):_ Wenn du einen Gegenstand unter +2 hast, kann ich ihn für dich upgraden.
