windows.wndblacksmith$wndreforge.reforge=Przekuj je
windows.wndblacksmith$wndsmith.prompt=Dobra, oto, co mogę zrobić. Kuźnia już jest rozpalona, więc wybierajcie szybko.
windows.wndblacksmith.cashout=_Wypłata (wszystkie punkty przysług):_ Mogę po prostu dać ci trochę złota, które mam gdzieś u siebie. 1 za każdy punkt przysług.
windows.wndblacksmith.cashout_no=Nieważne.
windows.wndblacksmith.cashout_verify=No dobra, to jest złoto %d. Ale nie będę już dla ciebie więcej pracował!
windows.wndblacksmith.cashout_yes=Daj mi złoto.
windows.wndblacksmith.harden=_Harden (przysługa %d):_ Potrafię utwardzić broń lub zbroję, dzięki czemu łatwiej jest zachować zaklęcie lub glif.
windows.wndblacksmith.pickaxe=_Kilok (przysługa %d):_ Chyba mogę ci oddać kilof, jeśli chcesz. Mam ich o wiele więcej.
windows.wndblacksmith.pickaxe_free=No cóż, wykonałeś kawał dobrej roboty, dam ci ją za darmo.
windows.wndblacksmith.pickaxe_no=Nieważne.
windows.wndblacksmith.pickaxe_verify=Jesteś pewien, że chcesz tę starą rzecz? Skała w okolicy nie jest miękka jak w kopalni, więc nie będziesz mógł nią dalej kopać.
windows.wndblacksmith.pickaxe_yes=Tak, chcę.
windows.wndblacksmith.prompt=Dobra, umowa to umowa. Oto, co mogę dla ciebie zrobić. Pracuję tylko z przedmiotami zidentyfikowanymi i niezaklętymi.\n\n_Aktualna przysługa: %d_
windows.wndblacksmith.reforge=_Przekuwanie (przysługa %d):_ Potrafię przekuć dwa przedmioty tego samego typu w jeden o wyższej jakości.
windows.wndblacksmith.smith=_Kowal (przysługa %d):_ Mogę spróbować wykuć dla ciebie broń lub zbroję od podstaw. Będzie ona wyższej klasy i prawdopodobnie ulepszona, a ty będziesz mieć wybór, co chcesz dostać.
windows.wndblacksmith.smith_no=Nieważne.
windows.wndblacksmith.smith_verify=Dobrze, rozgrzeję kuźnię, a potem możesz wybrać, co chcesz.
windows.wndblacksmith.smith_yes=Okej, rozgrzejmy kuźnię.
windows.wndblacksmith.upgrade=_Ulepszenie (przysługa %d):_ Jeśli masz przedmiot o wartości poniżej +2, mogę go dla ciebie ulepszyć.
