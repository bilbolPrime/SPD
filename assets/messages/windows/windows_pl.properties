windows.wndblacksmith$wndreforge.message=Dobrze, mogę przekuć dwa zidentyfikowane przedmioty tego samego typu. Słabszy zostanie zniszczony, a mocniejszy ulepszony. Jeśli są tego samego poziomu, zostawię ten po lewej.
