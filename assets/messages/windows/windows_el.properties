windows.wndranking$statstab.copy_seed_desc=Θα θέλατε να χρησιμοποιήσετε το dungeon seed από αυτήν την κατάταξη ως custom seed για ένα νέο παιχνίδι; _Σημειώστε ότι τα παιχνίδια με custom seed δεν μπορούν να κερδίσουν badges ή να συνεισφέρουν σε παιχνίδια που παίχτηκαν και εμφανίζονται στο κάτω μέρος της σελίδας κατάταξης._\n\nΕάν αυτή η κατάταξη αφορά μια παλιά εκτέλεση, σημειώστε επίσης ότι διαφορετικές εκδόσεις του Pixel Dungeon ενδέχεται να δημιουργήσουν διαφορετικά dungeons ακόμα κι αν το seed είναι το ίδιο.
