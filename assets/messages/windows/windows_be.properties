windows.wndsadghost.give_item=Калі ласка, вазьміце адзін з гэтых прадметаў, яны мне зараз бескарысныя... Можа, яны дапамогуць вам у вашым падарожжы...\n\nАкрамя таго... У гэтым падзямеллі згублены прадмет, які мне вельмі дарагі... Калі вы калі-небудзь... знойдзеце маю... ружу......
