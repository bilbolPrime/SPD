windows.wndranking$statstab.copy_seed_desc=Ці жадаеце вы выкарыстоўваць пачатковае значэнне падзямелля з гэтага рэйтынгу ў якасці ўласнага пачатковага значэння для новай гульні? _Звярніце ўвагу, што гульні з уласным пачатковым значэннем не могуць зарабляць значкі або ўносіць свой уклад у згуляныя гульні, і адлюстроўваюцца ўнізе старонкі рэйтынгу._\n\nКалі гэты рэйтынг адносіцца да старой гульні, таксама звярніце ўвагу, што розныя версіі Pixel Dungeon могуць ствараць розныя падзямелля, нават калі пачатковае значэнне аднолькавае.
