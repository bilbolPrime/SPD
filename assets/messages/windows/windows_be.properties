windows.wndresurrect.message=Калі ты гінеш, ты адчуваеш, як твой анкх вядзе твой дух назад у гэты свет. Гэта дае табе яшчэ адзін шанец перамагчы падзямелле!\n\nТы можаш узяць з сабой два прадметы, але астатнія застануцца там, дзе ты загінуў. Якія прадметы ты абярэш?
