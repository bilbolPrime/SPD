windows.wndblacksmith.cashout_yes=Dammi l'oro.
windows.wndblacksmith.harden=_Indurimento (favore %d):_ Posso indurire un'arma o un'armatura, in modo che sia più facile mantenere un incantesimo o un glifo.
windows.wndblacksmith.pickaxe=_Piccone (favore di %d):_ Credo di poterti restituire il piccone, se vuoi. Ne ho molti altri.
windows.wndblacksmith.pickaxe_free=Eh, hai fatto un ottimo lavoro, te lo regalo.
windows.wndblacksmith.pickaxe_no=Non importa.
windows.wndblacksmith.pickaxe_verify=Sei sicuro di volere questa vecchia cosa? La roccia qui intorno non è tenera come nella miniera, quindi non potrai scavare altro con essa.
windows.wndblacksmith.pickaxe_yes=Sì, lo voglio.
windows.wndblacksmith.prompt=Okay, un patto è un patto. Ecco cosa posso fare per te. Lavoro solo con oggetti identificati e non maledetti.\n\n_Favore attuale: %d_
windows.wndblacksmith.reforge=_Riforgiatura (favore %d):_ Posso riforgiare due oggetti dello stesso tipo in uno di qualità superiore.
windows.wndblacksmith.smith=_Smith (favore di %d):_ Posso provare a forgiare un'arma o un'armatura per te da zero. Sarà di livello superiore e probabilmente migliorata, e avrai la possibilità di scegliere cosa ottenere.
windows.wndblacksmith.smith_no=Non importa.
windows.wndblacksmith.smith_verify=Va bene, riscaldo la forgia e poi potrai scegliere quello che vuoi.
windows.wndblacksmith.smith_yes=Va bene, riscalda la forgia.
windows.wndblacksmith.upgrade=_Aggiornamento (favore di %d):_ Se hai un oggetto con un livello inferiore a +2, posso potenziarlo per te.
