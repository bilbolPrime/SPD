windows.wndblacksmith$wndsmith.prompt=Va bene, ecco cosa posso fare. Ho già acceso la forgia, quindi scegliete in fretta.
windows.wndblacksmith.cashout=_Incassare (tutto favore):_ Posso semplicemente darti dell'oro normale che ho in giro. 1 per ogni punto favore.
windows.wndblacksmith.cashout_no=Non importa.
