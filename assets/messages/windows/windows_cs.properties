windows.wndblacksmith.prompt=Dobře, dohoda je dohoda. Tady je to, co pro vás můžu udělat. Pracuji pouze s identifikovanými a neprokletými předměty.\n\n_Aktuální oblíbenost: %d_
windows.wndblacksmith.reforge=_Překovat (%d laskavost):_ Mohu překovat dva předměty stejného typu na jeden vyšší kvality.
windows.wndblacksmith.smith=_Smith (%d laskavost):_ Můžu ti zkusit ukut zbraň nebo brnění od základu. Bude to vyšší úroveň a pravděpodobně to bude vylepšené a budeš mít na výběr, co dostaneš.
