windows.wndblacksmith$wndreforge.message=Dobře, můžu znovu ukovat dva identifikované předměty stejného typu. Slabší bude zničen, aby se ten silnější vylepšil. Pokud jsou na stejné úrovni, nechám si ten vlevo.
