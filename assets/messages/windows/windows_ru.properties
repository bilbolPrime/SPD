windows.wndwandmaker.berry=О, я вижу, у вас есть ягода! Надеюсь, гнилостное растение вас не слишком беспокоило. Как и обещала, вы можете выбрать одну из моих высококачественных волшебных палочек.
windows.wndwandmaker.dust=О, я вижу, у вас есть пыль! Не беспокойтесь о призраках, я с ними справлюсь. Как и обещал, вы можете выбрать одну из моих высококачественных волшебных палочек.
