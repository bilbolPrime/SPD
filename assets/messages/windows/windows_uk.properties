windows.wndwandmaker.berry=О, бачу, у тебе є ягода! Сподіваюся, гнильниця тебе не надто турбує. Як я обіцяв, ти можеш вибрати одну з моїх високоякісних паличок.
windows.wndwandmaker.dust=О, бачу, у тебе є пил! Не хвилюйся за привидів, я з ними впораюся. Як я обіцяв, ти можеш обрати одну з моїх високоякісних паличок.
