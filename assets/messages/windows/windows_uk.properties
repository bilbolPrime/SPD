windows.wndblacksmith.pickaxe_no=Неважливо.
windows.wndblacksmith.pickaxe_verify=Ти впевнений, що хочеш цю стару штуку? Камінь тут не такий м'який, як у шахті, тому ти більше не зможеш нею копати.
windows.wndblacksmith.pickaxe_yes=Так, я цього хочу.
windows.wndblacksmith.prompt=Гаразд, угода є угода. Ось що я можу для вас зробити. Я працюю лише з ідентифікованими та непроклятими предметами.\n\n_Поточний фаворит: %d_
