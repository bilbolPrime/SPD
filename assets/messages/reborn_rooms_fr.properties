levels.rebornsiderooms.leave=Laisser
actors.mobs.npcs.echoreflection.name=votre reflet
actors.mobs.npcs.echoreflection.desc=Une pâle copie de vous attend, immobile. Elle ne combattra que si vous la défiez. La vaincre rapporte un point de compétence. Sortir de la salle met fin au duel et rend toute sa santé au reflet.
actors.mobs.npcs.echoreflection.challenge=Défier votre reflet ? La victoire rapporte un point de compétence. Vous pouvez battre en retraite, mais le reflet récupérera si vous quittez la salle.
actors.mobs.npcs.echoreflection.accept=Défier
actors.mobs.npcs.echoreflection.withdrawn=Votre reflet redevient immobile.
actors.mobs.npcs.echoreflection.victory=Le reflet se dissipe, laissant un parchemin de compétence.
actors.mobs.npcs.barbecueking.name=roi des rats
actors.mobs.npcs.barbecueking.desc=Même un roi doit manger. Il a trouvé un coin tranquille pour faire griller son dîner.
actors.mobs.npcs.barbecueking.greeting=Affaires royales. Très importantes. Très savoureuses.
actors.mobs.npcs.barbecueking.stolen=HÉ ! C'était à moi !
actors.mobs.npcs.barbecueking.after=J'espère que ça restera en travers.
actors.mobs.npcs.forgottenoffering.name=offrande oubliée
actors.mobs.npcs.forgottenoffering.desc=Une ration et une potion de soin reposent sous le cristal. Choisissez-en une ; l'autre tombera en poussière.
actors.mobs.npcs.watchremains.name=garde tombé
actors.mobs.npcs.watchremains.desc=Les os d'un garde reposent près d'un mur éventré. Un bout de papier dépasse de son casque.
actors.mobs.npcs.watchremains.note=J'ai tenu la porte toute la nuit. Ils sont passés par le mur.
