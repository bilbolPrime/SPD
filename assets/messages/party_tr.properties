actors.skills.raiseskeletonskill.desc=Yanınızda savaşacak bir iskelet çağırır.
network.partysession.background=Oyundan ayrıldığın için grup bağlantısı kesildi.
items.corpse.name=ceset
items.corpse.desc=Nekromansi için kullanılabilecek taze bir ceset.
items.armorkit.desc=Bu aletler herhangi bir zırhı destansı zırha dönüştürür. Zırh özelliklerini korur ve sınıfına özgü bir yetenek kazanır. Zanaat bilgisi gerekmez.
items.bomb.desc=Kara barutla doldurulmuş küçük bir bomba. Fitili fırlatıldığında yanar.
items.quest.driedrose.desc=Gül çoktan kurumuş, ama bütün taç yapraklarını korumuş.
items.quest.phantomfish.desc=Bu küçük, yarı saydam balık havada zor seçilir. Suda neredeyse görünmez olur.
items.tomeofmastery.desc=Yıpranmış deri ciltli bu ince kitap, pek çok bilgi saklıyor gibi. Okumak biraz zaman alır.
items.weightstone.desc=Yakın dövüş silahını daha hızlı veya isabetli olacak şekilde dengelemeye yarar.
items.wands.wandofamok.desc=Mor ışık hedefi çılgına çevirir. Hedef, yakınındaki yaratıklara ayrım yapmadan saldırır.
items.wands.wandofavalanche.desc=Duvara veya başka bir katı engele çarptığında taş yağmasına yol açar; bölgedeki yaratıkları yaralar ve sersemletir.
items.wands.wandofflock.desc=Yolu geçici olarak kapatan büyülü koyunlar çağırır.
items.wands.wandofpoison.desc=Hedefi zehirleyerek aralıklarla hasar verir. Yükseltmeler zehrin süresini uzatır.
items.wands.wandofreach.desc=Uzaktaki eşyaları alır ve düşmanlarla yer değiştirir. Güç dalgası yolundaki tuzakları tetikler, otları ezer ve kapıları açıp kapatır.
items.wands.wandofslowness.desc=Hedefin hareket ve saldırı hızını bir süreliğine yarıya indirir.
items.wands.wandofteleportation.desc=Bir yaratığı bulunduğun katta rastgele bir yere ışınlar.
items.weapon.melee.dualswords.desc=Daha güçlü darbeler için iki keskin kılıç.
items.weapon.missiles.cupidarrow.desc=Aşk tanrısına ait olduğu söylenen bir ok. Kime nişan aldığına dikkat et.
items.weapon.missiles.curaredart.desc=Bu küçük oklar az hasar verir, ama hedefi felç ederek savunmasız bırakabilir.
items.weapon.missiles.incendiarydart.desc=Ucu hedefe saplanırken oka bağlı karışım alev alır.
items.weapon.missiles.soulcrystal.desc=Ruh yakalayabilen bir kristal. Ruhunu hapsetmek için zayıf veya zayıflatılmış bir düşmana fırlat.
items.weapon.missiles.tamahawk.desc=Bu fırlatma baltası fazla ağır değildir, ama iyi kullanmak için güç ister.
network.partytext.weapon_fast=Bu silah hızlıdır.
network.partytext.weapon_slow=Bu silah yavaştır.
network.partytext.weapon_accurate=Bu silah isabetlidir.
network.partytext.weapon_inaccurate=Bu silahın isabeti düşüktür.
network.partytext.weapon_fast_and_accurate=Bu silah hızlı ve isabetlidir.
network.partytext.weapon_fast_but_inaccurate=Bu silah hızlıdır, ama isabeti düşüktür.
network.partytext.weapon_slow_but_accurate=Bu silah yavaştır, ama isabetlidir.
network.partytext.weapon_slow_and_inaccurate=Bu silah yavaştır ve isabeti düşüktür.
network.partytext.necroblade_bolt=5. seviyeden itibaren tamamen dolu kılıç _Karanlık Atış_ yapabilir. Bu atış hedefin özünü yok edip onu hizmetkâra dönüştürebilir.
network.partytext.necroblade_intro=Kara büyüyle dövülen bu kılıç, kurbanlarının ruhlarını yutarak güçlenir.
network.partytext.necroblade_energy=Biriken ruhlar: _%s/100_
network.partytext.necroblade_damage=Ruhlar _0–%d hasar_ ekler.
network.partytext.necroblade_hungry=Kılıç, dolu ruh haznesini tüketerek güçlenebilir.
network.partytext.necroblade_full=Kılıç artık ruh tüketerek kendini yükseltemez.
