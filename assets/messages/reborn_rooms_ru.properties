levels.rebornsiderooms.leave=Оставить
actors.mobs.npcs.echoreflection.name=ваше отражение
actors.mobs.npcs.echoreflection.desc=Ваша бледная копия ждёт неподвижно. Она сразится лишь после вызова. Победа принесёт одно очко навыков. Если покинуть комнату, дуэль закончится, а отражение полностью восстановит здоровье.
actors.mobs.npcs.echoreflection.challenge=Бросить вызов отражению? Победа принесёт одно очко навыков. Можно отступить, но если покинуть комнату, отражение восстановит здоровье.
actors.mobs.npcs.echoreflection.accept=Бросить вызов
actors.mobs.npcs.echoreflection.withdrawn=Ваше отражение снова замирает.
actors.mobs.npcs.echoreflection.victory=Отражение растворяется, оставляя свиток навыков.
actors.mobs.npcs.barbecueking.name=крысиный король
actors.mobs.npcs.barbecueking.desc=Даже королю нужно есть. Он нашёл тихий уголок, чтобы поджарить себе ужин.
actors.mobs.npcs.barbecueking.greeting=Королевские дела. Очень важные. Очень вкусные.
actors.mobs.npcs.barbecueking.stolen=ЭЙ! Это было моё!
actors.mobs.npcs.barbecueking.after=Чтоб ты подавился.
actors.mobs.npcs.forgottenoffering.name=забытое подношение
actors.mobs.npcs.forgottenoffering.desc=Под кристаллом лежат порция еды и зелье исцеления. Выберите одно — другое рассыплется в прах.
actors.mobs.npcs.watchremains.name=павший страж
actors.mobs.npcs.watchremains.desc=У проломленной стены лежат кости стражника. Из-под шлема торчит клочок бумаги.
actors.mobs.npcs.watchremains.note=Держал дверь всю ночь. Они пришли через стену.
