items.scrolls.scrolloffrostlevel.name=Сувій інею
items.scrolls.scrolloffrostlevel.desc=Від цього пергаменту віє холодом.\n\nСувій також можна розірвати будь-де, щоб заморозити усіх ворогів на поверсі до отримання ними шкоди. На босів та істот з імунітетом до заморожування це не діє. Це не завдає шкоди.
items.scrolls.scrolloffrostlevel.ac_tear=Розірвати
items.scrolls.scrolloffrostlevel.tear_confirm=Якщо розірвати цей сувій, його магія заморозить усіх ворогів на поверсі до отримання ними шкоди. На босів та істот з імунітетом до заморожування це не діє. Це не завдає шкоди.\n\nРозірвати сувій?
items.scrolls.scrolloffrostlevel.wrong_place=Тут сувій не діє.
items.scrolls.scrolloffrostlevel.spent=Прохід уже відкрито. Сувій мовчить.
items.keys.key.ice_depth=Цей ключ належить до поверху %d Крижаних печер.
scenes.interlevelscene$mode.frost=Вхід до Крижаних печер...
levels.icecaveslevel.water_name=Крижана вода
levels.icecaveslevel.water_desc=Тонка кірка льоду ламається під ногами.
levels.icecaveslevel.wall_desc=Сліди кайл ховаються під товстими крижаними жилами. Шахтарі покинули ці виробки, коли холод проник у породу.
levels.cavesbosslevel.collapsed_name=Обвалена печера
levels.cavesbosslevel.collapsed_desc=Обвалена печера. Крізь завал не пройти.
actors.buffs.frostbite.name=Обмороження
actors.buffs.frostbite.desc=Холод уповільнює ваше пересування на 20%.
actors.mobs.rimebat.name=Інеєвий кажан
actors.mobs.rimebat.desc=Ці бліді кажани гніздяться під льодом. Їхній холодний укус ненадовго сповільнює рух, даючи їм час зайти на нову атаку.\n\nМає імунітет до заморожування та магії холоду.
actors.mobs.iceclaw.name=Крижаний кіготь
actors.mobs.iceclaw.desc=Падальник із панциром зі щільної криги. Перед боєм він ненадовго потовщує броню. Вогонь розтоплює цей додатковий захист.\n\nМає імунітет до заморожування та магії холоду.
actors.mobs.frostback.name=Гнолл-кригоспин
actors.mobs.frostback.desc=Цей гнолл пережив холод, грабуючи необережних мандрівників. Коли він піднімає зброю, відійдіть: важкий удар припаде на місце, де ви стояли.\n\nМає імунітет до заморожування та магії холоду.
actors.mobs.shardling.name=Уламочник
actors.mobs.shardling.desc=Неспокійний клубок крижаних кристалів. Він прицілюється, а потім випускає уламки по прямій. Стіни зупиняють залп.\n\nМає імунітет до заморожування та магії холоду.
actors.mobs.hollowminer.name=Порожній шахтар
actors.mobs.hollowminer.desc=Цей шахтар так і не вибрався із замерзлих виробок. Його ліхтар досі горить, хоча власник давно мертвий. Якщо дати йому підняти ліхтар, він скличе ближніх істот до бою. Влучання перериває сигнал.\n\nМає імунітет до заморожування та магії холоду.
actors.mobs.rimehorn.name=Інеєріг
actors.mobs.rimehorn.desc=Важкий звір з інеєм у шерсті. Він риє землю перед тим, як кинутися по прямій. Зійдіть із його шляху, поки він готується.\n\nМає імунітет до заморожування та магії холоду.
actors.mobs.oldrime.name=Старий Іній
actors.mobs.oldrime.desc=Шахтарі знайшли Старого Інею під горою, у кризі, старішій за їхні тунелі. Удари кайл розбудили його. Тепер він охороняє замерзлі виробки та прохід за ними. Слабнучи, він втрачає частини броні, що звільняє кінцівки. Стережіться важких ударів, криги, що пробиває підлогу, та крижаного подиху.\n\nМає імунітет до заморожування та магії холоду.
actors.mobs.oldrime.warning=Старий Іній замахується для удару!
windows.wndjournal.ice_depth=Крига %d
levels.icebosslevel.exit_name=Печерний прохід
levels.icebosslevel.exit_desc=Вузький прохід веде вглиб гори.
levels.icebosslevel.blocked_name=Замерзлий прохід
levels.icebosslevel.blocked_desc=Крижана стіна перегороджує прохід за Старим Інеєм.
items.weapon.ice.wrong_hero=Ця зброя не для вас.
items.weapon.ice.already_enchanted=Ця зброя вже зачарована.
items.weapon.ice.glaciercleaver.name=Льодовиковий тесак
items.weapon.ice.glaciercleaver.desc=Широке лезо, витесане з криги Старого Інею. Влучання вкриває ціль інеєм на чотири ходи. Наступний удар Льодовиковим тесаком розколює його, завдаючи %d додаткової шкоди. Лише Воїн може ним користуватися.
actors.buffs.frostcoating.name=Вкрито інеєм
actors.buffs.frostcoating.desc=Тонкий шар інею вкриває цю істоту. Удар Льодовикового тесака розколе його.
items.weapon.ice.hoarfroststaff.name=Посох паморозі
items.weapon.ice.hoarfroststaff.desc=Між зубцями посоха збирається холод. Його снаряди завдають %d-%d шкоди до бонусів навичок та сповільнюють рух і атаки на два ходи. Спочатку вміщує три заряди й заряджається як жезл. Лише Маг може ним користуватися.
items.weapon.ice.rimepick.name=Інеєве кайло
items.weapon.ice.rimepick.desc=Це вузьке крижане кайло знаходить щілини в броні. Воно оминає чверть броні цілі, а якщо ціль захоплена зненацька — половину. Лише Розбійник може ним користуватися.
items.weapon.ice.frostbow.name=Морозний лук
items.weapon.ice.frostbow.desc=Стріли цього лука розлітаються гострими крижинками при влучанні. Вони завдають цілі на %d%% більше шкоди, а сусіднім ворогам — чверть шкоди цього влучання. Уламки не заморожують жертв. Лише Мисливиця може ним користуватися.
items.weapon.ice.gravefrostscythe.name=Коса могильного інею
items.weapon.ice.gravefrostscythe.desc=Іній вкриває обмотане кістками руків'я коси. Поки вона споряджена, ваші прикликані скелети та привиди завдають %d додаткової шкоди холодом за удар. Лише Некромант може нею користуватися.
items.weapon.ice.frostbiterifle.name=Гвинтівка обмороження
items.weapon.ice.frostbiterifle.desc=Патронник цієї гвинтівки вкритий кригою, що ніколи не тане. Кожне влучання спричиняє обмороження на два ходи, сповільнюючи рух на 20%. Нові влучання поновлюють ефект. Лише Найманець може нею користуватися.
library.ice_weapon_drop=Для кожного героя випадає одна зброя відповідно до його класу.

actors.mobs.npcs.prospector.name=Застряглий старатель
actors.mobs.npcs.prospector.desc=Старатель у залатаному пальті сховався біля сходів. Його лампа ледь горить.
actors.mobs.npcs.prospector.torches=Моя лампа скоро згасне. Коли тікав, залишив скриню з припасами на цьому поверсі. Принесеш із неї _три смолоскипи_?
actors.mobs.npcs.prospector.iceclaws=Крижані кігті вигнали мене зі штольні. Убий _трьох крижаних кігтів на цьому поверсі_, щоб я міг повернутися до роботи.
actors.mobs.npcs.prospector.accept=Я допоможу.
actors.mobs.npcs.prospector.later=Не зараз.
actors.mobs.npcs.prospector.need_torches=Мені потрібні _три смолоскипи_. Скриня досі десь на цьому поверсі.
actors.mobs.npcs.prospector.claws_left=Залишилося вбити крижаних кігтів: _%d_.
actors.mobs.npcs.prospector.reward=Гарна робота. Що обереш?
actors.mobs.npcs.prospector.rations=Два раціони їжі
actors.mobs.npcs.prospector.thanks=Однією турботою менше. Дякую.
library.quest.prospector_torches.name=Лампа, що згасає
library.quest.prospector_torches.desc=Принесіть застряглому старателю три смолоскипи. У скрині на його поверсі їх достатньо.
library.quest.prospector_iceclaws.name=Кігті у штольні
library.quest.prospector_iceclaws.desc=Убийте трьох крижаних кігтів на поверсі старателя та поверніться до нього.
library.quest.prospector.reward=Виберіть сувій поліпшення або два раціони їжі.
items.scrolls.scrolloffrostlevel.read_confirm=Під час читання ви відчуваєте, що ось-ось телепортуєтеся.
