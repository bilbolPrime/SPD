actors.skills.raiseskeletonskill.desc=Megidéz egy csontvázat, hogy melletted harcoljon.
network.partysession.background=Megszakadt a kapcsolat a csapattal, mert kiléptél a játékból.
items.corpse.name=holttest
items.corpse.desc=Friss holttest, amely nekromanciára használható.
items.armorkit.desc=Ezekkel az eszközökkel bármely páncél epikus páncéllá alakítható. Megőrzi tulajdonságait, és a kasztodhoz illő képességet kap. Nem kell hozzá mesterségbeli tudás.
items.bomb.desc=Kis bomba fekete lőporral. A kanóc eldobáskor meggyullad.
items.quest.driedrose.desc=A rózsa régen kiszáradt, mégis minden szirma megmaradt.
items.quest.phantomfish.desc=Ez az apró, áttetsző hal a levegőben is alig látható. Vízben szinte teljesen eltűnik.
items.tomeofmastery.desc=Ez a kopott bőrkötéses könyv vékony, de sok tudást rejthet. Elolvasása némi időt igényel.
items.weightstone.desc=Ezzel a kővel egy közelharci fegyver sebességét vagy pontosságát javíthatod a súlyozás módosításával.
items.wands.wandofamok.desc=A lila fény őrjöngésbe kergeti a célpontot, amely válogatás nélkül támad a közeli lényekre.
items.wands.wandofavalanche.desc=Falnak vagy más szilárd akadálynak ütközve kőomlást idéz elő, amely megsebzi és elkábítja a környék lényeit.
items.wands.wandofflock.desc=Varázsbirkák nyáját idézi meg, amely átmenetileg elzárja az utat.
items.wands.wandofpoison.desc=Megmérgezi a célpontot, rendszeresen sebezve azt. A fejlesztések meghosszabbítják a mérgezést.
items.wands.wandofreach.desc=Távolról felvesz tárgyakat, és helyet cserél veled egy ellenség. Az erőhullám csapdákat indít, letapossa a füvet, és kinyitja vagy bezárja az útjába eső ajtókat.
items.wands.wandofslowness.desc=Egy időre megfelezi a célpont mozgási és támadási sebességét.
items.wands.wandofteleportation.desc=Az adott szint véletlen pontjára teleportál egy lényt.
items.weapon.melee.dualswords.desc=Két éles penge az erősebb csapásokhoz.
items.weapon.missiles.cupidarrow.desc=Állítólag Ámor nyila volt. Jól válaszd meg, kire célzol.
items.weapon.missiles.curaredart.desc=Ezek a dobónyilak keveset sebeznek, de megbéníthatják és védtelenné tehetik a célpontot.
items.weapon.missiles.incendiarydart.desc=A hegy a célpontba fúródik, miközben a nyílra kötött keverék lángra kap.
items.weapon.missiles.soulcrystal.desc=Lelkek befogására képes kristály. Dobd egy gyenge vagy legyengült ellenfélre, hogy foglyul ejtsd a szellemét.
items.weapon.missiles.tamahawk.desc=Ez a hajítóbárd nem különösebben nehéz, de az eredményes használatához erő kell.
network.partytext.weapon_fast=Ez a fegyver gyors.
network.partytext.weapon_slow=Ez a fegyver lassú.
network.partytext.weapon_accurate=Ez a fegyver pontos.
network.partytext.weapon_inaccurate=Ez a fegyver pontatlan.
network.partytext.weapon_fast_and_accurate=Ez a fegyver gyors és pontos.
network.partytext.weapon_fast_but_inaccurate=Ez a fegyver gyors, de pontatlan.
network.partytext.weapon_slow_but_accurate=Ez a fegyver lassú, de pontos.
network.partytext.weapon_slow_and_inaccurate=Ez a fegyver lassú és pontatlan.
network.partytext.necroblade_bolt=Az 5. szinttől a teljesen feltöltött penge _Sötét lövedéket_ lőhet ki, amely elpusztíthatja a célpont lényegét és szolgává teheti.
network.partytext.necroblade_intro=Sötét mágiával kovácsolt penge, amely elnyeli áldozatai lelkét, és egyre erősebb lesz.
network.partytext.necroblade_energy=Tárolt lelkek: _%s/100_
network.partytext.necroblade_damage=A lelkek _0–%d sebzést_ adnak.
network.partytext.necroblade_hungry=A penge egy teljes adag lélek elfogyasztásával erősebbé válhat.
network.partytext.necroblade_full=A penge már nem fejlesztheti magát lelkek elfogyasztásával.
