skills4.smash.intro=Träffar en intilliggande fiende med rå kraft.
skills4.endurance.intro=Ökar din maximala hälsa.
skills4.firm_hand.intro=Förbättrar din noggrannhet i närstrid.
skills4.regeneration.intro=Återställer extra hälsa med tiden. Upphör vid svält.
skills4.toughness.intro=Minskar inkommande skador, förutom svält.
skills4.knockback.intro=Slår en fiende och trycker tillbaka den en ruta. Bossar kan inte knuffas.
skills4.second_wind.intro=Återställer en del hälsa omedelbart.
skills4.sure_footing.intro=Förkortar tiden du är rotad eller försvagad av benskador.
skills4.mastery.intro=Förbättrar vapnets effektiva nivå och attackhastighet.
skills4.parry.intro=Minskar skadan från nästa närstridsslag du tar emot. Skyddet varar högst fyra turer.
skills4.smite.intro=Utdelar ett hårt slag som ignorerar halva målets rustning. Tar två turer.
skills4.riposte.intro=Stärker din nästa närstrid efter blockering. Håller fyra turer.
skills4.footwork.intro=Ger dig mer tid mellan närstridsträffarna för att bibehålla en kombination.
skills4.duelist.intro=Ökar undanflykt medan exakt en fiende står bredvid dig.
skills4.disarming_strike.intro=Slår en fiende och försvagar den i tre turer.
skills4.find_the_gap.intro=Din tredje närstridsträff i följd och varje träff därefter ignorerar en del av målets rustning.
skills4.aggression.intro=Din närstridsskada ökar när du tappar hälsan.
skills4.charge.intro=Rusar fram och slår en fiende högst fyra rutor bort. Vägen måste vara fri.
skills4.rampage.intro=Slår alla intilliggande fiender.
skills4.bloodlust.intro=När du dödar en fiende blir dina närstridsattacker snabbare i tre turer.
skills4.war_cry.intro=Försvagar synliga fiender inom två rutor.
skills4.rend.intro=Anstormning och Bärsärkagång får överlevande fiender att blöda.
skills4.relentless.intro=En dödad fiende förkortar den återstående väntetiden för Anstormning och Stridsrop.
skills4.cornered.intro=Minskar närstridsskador som tas medan två eller flera fiender omger dig.

skills4.spark.intro=Avfyrar en gnista mot en synlig fiende.
skills4.spirituality.intro=Ökar din maximala mana.
skills4.sorcerer.intro=Dina trollstavar orsakar mer skada.
skills4.summon_rat.intro=Framkallar en råtta som slåss för dig.
skills4.meditation.intro=Återställ extra mana med tiden.
skills4.spirit_armor.intro=Absorberar skada med en mana per absorberad poäng.
skills4.wizard.intro=Dina trollstavar laddas snabbare.
skills4.channeling.intro=Förkortar väntetiden för aktiva färdigheter, men aldrig till mindre än en tur.
skills4.charged_staff.intro=Närstridsträffar med staven återställer mana.
skills4.arcane_ward.intro=Minskar skadan från nästa närstridsslag du tar emot. Skyddet varar högst fyra turer.
skills4.arcane_strike.intro=Ger ett magiskt slag som ignorerar halva målets rustning.
skills4.conductive.intro=Stavens lagrade laddningar förstärker dess närstridsslag. Varje träff förbrukar en laddning i stället för att ladda staven.
skills4.discharge.intro=Skadar alla intilliggande fiender med en skur av magi.
skills4.spellweave.intro=Ökar stavskadan i tre turer efter att ha landat en närstrid.
skills4.drain_life.intro=Skadar en fiende och helar dig för hälften av den hälsa den förlorar.
skills4.rabid_minions.intro=Dina tillkallade varelser ger mer skada.
skills4.summon_skeleton.intro=Framkallar ett skelett som slåss för dig.
skills4.soul_hunger.intro=Återställer mana när du dödar en fiende.
skills4.enrage.intro=När färdigheten är aktiv ger dina framkallade varelser mer skada, men tar också mer skada.
skills4.slow.intro=Saktar ner en fiendes rörelse och attacker.
skills4.summoner.intro=Du kan ha ytterligare en framkallad varelse samtidigt.
skills4.dark_pact.intro=Offrar fem hälsa för att återställa mana. Kräver minst sex hälsa.

skills4.double_strike.intro=Slå två gånger i snabb följd.
skills4.stealth.intro=Gör dig svårare för fiender att lägga märke till.
skills4.evasion.intro=Förbättrar din chans att undvika attacker.
skills4.smoke_bomb.intro=Försvinna i ett rökmoln. Att attackera bryter effekten.
skills4.bandit.intro=Hitta extra guld i varje hög du samlar på dig.
skills4.venom.intro=När färdigheten är aktiv kan dina närstridsträffar förgifta målet.
skills4.locksmith.intro=Du har en chans att avväpna en fälla när du kliver på den.
skills4.light_step.intro=Förkortar tiden du är rotad eller försvagad av benskador.
skills4.dash.intro=Flyttar upp till två rutor längs en tydlig bana.
skills4.haste.intro=Ökar din rörelsehastighet i fem turer.
skills4.shadow_clone.intro=Skapa en stark klon eller tre svagare kloner för att slåss för dig.
skills4.escape.intro=Befriar dig från rötter och benskador och ökar din förmåga att undvika anfall i fyra turer.
skills4.trailblazer.intro=Ökar din rörelsehastighet.
skills4.skirmish.intro=Att röra sig stärker din nästa närstridsträff.
skills4.keep_distance.intro=Ökar undanflykt mot fiender mer än en ruta bort.
skills4.ambush.intro=Ökar din närstridsskada när du är osynlig.
skills4.scorpion.intro=Ditt gift ger mer skada.
skills4.silent_death.intro=Närstridsattacker kan döda sovande fiender direkt. Fungerar inte på bossar.
skills4.expose.intro=Dina närstridsträffar ignorerar en del av rustningen.
skills4.execution.intro=Ökar skadan mot fiender under en fjärdedel hälsa.
skills4.deadly_throw.intro=Ökar skadan du gör med avståndsvapen.

skills4.accuracy.intro=Dina avståndsattacker är mer exakta.
skills4.awareness.intro=Du har en chans att undvika en inkommande avståndsattack.
skills4.double_shot.intro=Följ din pil med ett andra skott. Använder två vanliga pilar.
skills4.hunting.intro=Hittar rått kött när du utforskar.
skills4.fletching.intro=Gör vanliga pilar när du utforskar.
skills4.ko_arrow.intro=Din nästa pil saktar ner målet och kan få det att somna.
skills4.woodcraft.intro=Gör dig svårare för fiender att lägga märke till.
skills4.quickdraw.intro=Påskyndar dina avståndsattacker.
skills4.barkskin.intro=Ökar din rustning.
skills4.nature_mend.intro=Återställer en del hälsa omedelbart.
skills4.entangle.intro=Rotar en synlig fiende på plats.
skills4.herbalist.intro=Minskar giftskador.
skills4.dew_keeper.intro=Ökar läkningen från dagg.
skills4.knee_shot.intro=Dina pilar kan skada målets ben och försvåra rörelse.
skills4.thicket.intro=Minskar skadan från nästa närstridsslag du tar emot. Skyddet varar högst fyra turer.
skills4.aimed_shot.intro=Ökar skadan på din nästa pilträff.
skills4.long_sight.intro=Ökar avståndsskadan mot fiender med minst fyra rutor bort.
skills4.piercing_shot.intro=Din nästa pil ignorerar en del av målets rustning.
