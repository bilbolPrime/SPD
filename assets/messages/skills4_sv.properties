skills4.subclass.warden=Att trampa ner högt gräs ger Barkhud. Växter kan lämna extra frön och dagg.
skills4.subclass.sniper=Avståndsattacker ignorerar rustning och märker målet för en snabbare följdattack.\n\n_20% mer avståndsskada_
skills4.subclass.spirit_binder=Närstridsträffar med staven återställer en laddning och lägger till antalet laddningar till skadan.\n\n_Uppväckta skelett varar dubbelt så länge._
skills4.subclass.lich=Att döda fiender återställer hälsa och stillar hungern.\n\n_Uppväckta skelett och skelettbågskyttar är dubbelt så starka._\n_En extra frammanad varelse._
