items.scrolls.scrolloffrostlevel.name=寒霜卷轴
items.scrolls.scrolloffrostlevel.desc=寒气从这张羊皮纸中渗出。\n\n你也可以在任何地方撕碎它，将本层的所有敌人冻结。受到伤害时，冻结便会解除。头目和免疫冻结的生物不受影响。不会造成伤害。
items.scrolls.scrolloffrostlevel.ac_tear=撕碎
items.scrolls.scrolloffrostlevel.tear_confirm=撕碎这张卷轴会释放其中的魔力，将本层的所有敌人冻结。受到伤害时，冻结便会解除。头目和免疫冻结的生物不受影响。不会造成伤害。\n\n要撕碎卷轴吗？
items.scrolls.scrolloffrostlevel.wrong_place=卷轴在这里不起作用。
items.scrolls.scrolloffrostlevel.spent=通道已经开启。卷轴毫无反应。
items.keys.key.ice_depth=这把钥匙属于冰窟第%d层。
scenes.interlevelscene$mode.frost=正在进入冰窟……
levels.icecaveslevel.water_name=冰水
levels.icecaveslevel.water_desc=薄冰在脚下碎裂。
levels.icecaveslevel.wall_desc=厚厚的冰脉掩盖了镐痕。寒冷渗入岩石后，矿工们便放弃了这些坑道。
levels.cavesbosslevel.collapsed_name=坍塌的洞穴
levels.cavesbosslevel.collapsed_desc=一处坍塌的洞穴。落石堵死了去路。
actors.buffs.frostbite.name=冻伤
actors.buffs.frostbite.desc=寒冷使你的移动速度降低20%。
actors.mobs.rimebat.name=霜蝠
actors.mobs.rimebat.desc=这些苍白的蝙蝠栖息在冰层下。冰冷的撕咬会短暂减慢移动速度，让它们有时间盘旋，再次发动攻击。\n\n免疫冻结和寒冰魔法。
actors.mobs.iceclaw.name=冰爪
actors.mobs.iceclaw.desc=披着厚实冰壳的食腐动物。它会在战斗前蓄力，短暂增强护甲。火焰能融化这层额外的保护。\n\n免疫冻结和寒冰魔法。
actors.mobs.frostback.name=霜背豺狼人
actors.mobs.frostback.desc=这只豺狼人靠抢劫闯入者熬过严寒。它举起武器时要及时躲开：重击会落在你原先站立的位置。\n\n免疫冻结和寒冰魔法。
actors.mobs.shardling.name=冰晶灵
actors.mobs.shardling.desc=一团躁动的冰晶。它会先瞄准，再沿直线发射碎片。墙壁能挡住这轮齐射。\n\n免疫冻结和寒冰魔法。
actors.mobs.hollowminer.name=空壳矿工
actors.mobs.hollowminer.desc=这个矿工没能逃出冰封的坑道。它早已死去，提灯却仍在燃烧。若让它举起灯笼，它就会召来附近的生物参战。击中它能打断信号。\n\n免疫冻结和寒冰魔法。
actors.mobs.rimehorn.name=霜角兽
actors.mobs.rimehorn.desc=皮毛里结满霜的沉重野兽。它会先刨地，再沿直线冲锋。趁它准备时离开冲锋路线。\n\n免疫冻结和寒冰魔法。
actors.mobs.oldrime.name=古霜
actors.mobs.oldrime.desc=矿工们在山底发现了古霜，它埋在比矿道还古老的冰层中。镐声将它唤醒。如今它守着冰封的矿坑和后方的通道。随着它逐渐虚弱，冰甲会破裂，四肢也随之挣脱束缚。当心它的重击、破地而出的冰刺和冰冷的吐息。\n\n免疫冻结和寒冰魔法。
actors.mobs.oldrime.warning=古霜蓄势准备重击！
windows.wndjournal.ice_depth=冰窟 %d
levels.icebosslevel.exit_name=洞穴通道
levels.icebosslevel.exit_desc=一条狭窄的通道蜿蜒通向山体深处。
levels.icebosslevel.blocked_name=冰封通道
levels.icebosslevel.blocked_desc=一面冰墙挡住了古霜身后的通道。
items.weapon.ice.wrong_hero=这件武器不适合你。
items.weapon.ice.already_enchanted=这件武器已经附魔。
items.weapon.ice.glaciercleaver.name=冰川斩刀
items.weapon.ice.glaciercleaver.desc=从古霜的冰块中凿出的宽刃。命中后使目标覆盖寒霜，持续四回合。下一次冰川斩刀的攻击会震碎寒霜，造成%d点额外伤害。仅战士能使用。
actors.buffs.frostcoating.name=覆霜
actors.buffs.frostcoating.desc=这只生物身上附着一层薄霜。冰川斩刀的攻击会将它震碎。
items.weapon.ice.hoarfroststaff.name=白霜法杖
items.weapon.ice.hoarfroststaff.desc=寒气汇聚在法杖的尖叉之间。其魔弹在技能加成前造成%d-%d点伤害，并降低移动和攻击速度，持续两回合。初始拥有三次充能，充能方式与魔杖相同。仅法师能使用。
items.weapon.ice.rimepick.name=霜镐
items.weapon.ice.rimepick.desc=这把细长的冰镐能找到护甲间的缝隙。它会无视目标四分之一的护甲，若目标毫无防备，则无视一半。仅盗贼能使用。
items.weapon.ice.frostbow.name=寒霜弓
items.weapon.ice.frostbow.desc=这把弓射出的箭矢会在命中时爆裂成锋利的碎冰。对目标造成的伤害提高%d%%，并对相邻敌人造成该次伤害的四分之一。碎片不会冻结受害者。仅女猎手能使用。
items.weapon.ice.gravefrostscythe.name=墓霜镰刀
items.weapon.ice.gravefrostscythe.desc=寒霜附着在缠着白骨的镰柄上。装备此武器时，你召唤的骷髅和幽灵每次命中额外造成%d点寒冷伤害。仅死灵法师能使用。
items.weapon.ice.frostbiterifle.name=冻伤步枪
items.weapon.ice.frostbiterifle.desc=枪膛内覆着永不融化的冰。每次射击命中会造成两回合的冻伤，使移动速度降低20%。再次命中会刷新持续时间。仅佣兵能使用。
library.ice_weapon_drop=每位英雄都会获得一件符合其职业的掉落武器。

actors.mobs.npcs.prospector.name=受困的矿工
actors.mobs.npcs.prospector.desc=一名穿着打补丁外套的矿工躲在楼梯旁。他的灯快灭了。
actors.mobs.npcs.prospector.torches=这盏灯撑不了多久了。我逃跑时把补给箱落在这一层了。能帮我从里面取来_三支火把_吗？
actors.mobs.npcs.prospector.iceclaws=冰爪把我赶出了矿道。帮我杀掉_这一层的三只冰爪_，我就能回去干活了。
actors.mobs.npcs.prospector.accept=我来帮你。
actors.mobs.npcs.prospector.later=现在不行。
actors.mobs.npcs.prospector.need_torches=我需要_三支火把_。补给箱还在这一层的某个地方。
actors.mobs.npcs.prospector.claws_left=还需要杀掉的冰爪：_%d_只。
actors.mobs.npcs.prospector.reward=干得好。你想要哪一个？
actors.mobs.npcs.prospector.rations=两份食物配给
actors.mobs.npcs.prospector.thanks=总算少了一桩心事。谢谢你。
library.quest.prospector_torches.name=将熄的灯
library.quest.prospector_torches.desc=给受困的矿工带去三支火把。他所在楼层的补给箱里有足够的火把。
library.quest.prospector_iceclaws.name=矿道里的冰爪
library.quest.prospector_iceclaws.desc=杀掉矿工所在楼层的三只冰爪，然后回去找他。
library.quest.prospector.reward=选择一张升级卷轴或两份食物配给。
items.scrolls.scrolloffrostlevel.read_confirm=阅读时，你感觉自己即将被传送。
