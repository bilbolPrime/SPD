items.scrolls.scrolloffrostlevel.name=Скрутак інею
items.scrolls.scrolloffrostlevel.desc=Ад пергаменту вее холадам.\n\nСкрутак таксама можна разарваць у любым месцы, каб замарозіць усіх ворагаў на паверсе да атрымання імі шкоды. На босаў і істот з імунітэтам да замарожвання гэта не дзейнічае. Гэта не наносіць шкоды.
items.scrolls.scrolloffrostlevel.ac_tear=Разарваць
items.scrolls.scrolloffrostlevel.tear_confirm=Калі разарваць гэты скрутак, яго магія замарозіць усіх ворагаў на паверсе да атрымання імі шкоды. На босаў і істот з імунітэтам да замарожвання гэта не дзейнічае. Гэта не наносіць шкоды.\n\nРазарваць скрутак?
items.scrolls.scrolloffrostlevel.wrong_place=Тут скрутак не дзейнічае.
items.scrolls.scrolloffrostlevel.spent=Праход ужо адкрыты. Скрутак маўчыць.
items.keys.key.ice_depth=Гэты ключ належыць да паверха %d Ледзяных пячор.
scenes.interlevelscene$mode.frost=Уваход у Ледзяныя пячоры...
levels.icecaveslevel.water_name=Ледзяная вада
levels.icecaveslevel.water_desc=Тонкая скарынка лёду ламаецца пад нагамі.
levels.icecaveslevel.wall_desc=Сляды кірак хаваюцца пад тоўстымі ледзянымі жыламі. Шахцёры пакінулі гэтыя выпрацоўкі, калі холад пранік у пароду.
levels.cavesbosslevel.collapsed_name=Абваленая пячора
levels.cavesbosslevel.collapsed_desc=Абваленая пячора. Праз завал не прайсці.
actors.buffs.frostbite.name=Абмаражэнне
actors.buffs.frostbite.desc=Холад запавольвае ваш рух на 20%.
actors.mobs.rimebat.name=Інеевы кажан
actors.mobs.rimebat.desc=Гэтыя бледныя кажаны гняздуюцца пад лёдам. Іх халодны ўкус ненадоўга запавольвае рух, даючы ім час зайсці на новую атаку.\n\nМае імунітэт да замарожвання і магіі холаду.
actors.mobs.iceclaw.name=Ледзяны кіпцюр
actors.mobs.iceclaw.desc=Падальшчык з панцырам са шчыльнага лёду. Перад боем ён ненадоўга патаўшчае браню. Агонь растоплівае гэтую дадатковую абарону.\n\nМае імунітэт да замарожвання і магіі холаду.
actors.mobs.frostback.name=Гнол-ледзяная спіна
actors.mobs.frostback.desc=Гэты гнол перажыў холад, рабуючы неасцярожных падарожнікаў. Калі ён падымае зброю, адыдзіце: цяжкі ўдар трапіць у месца, дзе вы стаялі.\n\nМае імунітэт да замарожвання і магіі холаду.
actors.mobs.shardling.name=Аскепачнік
actors.mobs.shardling.desc=Неспакойны клубок ледзяных крышталяў. Ён цэліцца, а потым выпускае аскепкі па прамой. Сцены спыняюць залп.\n\nМае імунітэт да замарожвання і магіі холаду.
actors.mobs.hollowminer.name=Пусты шахцёр
actors.mobs.hollowminer.desc=Гэты шахцёр так і не выбраўся з замерзлых выпрацовак. Яго ліхтар яшчэ гарыць, хоць гаспадар даўно мёртвы. Калі даць яму падняць ліхтар, ён скліча блізкіх істот на бой. Трапны ўдар перарывае сігнал.\n\nМае імунітэт да замарожвання і магіі холаду.
actors.mobs.rimehorn.name=Інеерог
actors.mobs.rimehorn.desc=Цяжкі звер з інеем у поўсці. Ён грабецца ў зямлі, перш чым кінуцца па прамой. Сыдзіце з яго шляху, пакуль ён рыхтуецца.\n\nМае імунітэт да замарожвання і магіі холаду.
actors.mobs.oldrime.name=Стары Іней
actors.mobs.oldrime.desc=Шахцёры знайшлі Старога Інею пад гарой, у лёдзе, старэйшым за іх тунэлі. Удары кірак разбудзілі яго. Цяпер ён ахоўвае замерзлыя выпрацоўкі і праход за імі. Калі ён слабее, браня адколваецца, вызваляючы канечнасці. Сцеражыцеся цяжкіх удараў, лёду, што прабівае падлогу, і ледзянога дыхання.\n\nМае імунітэт да замарожвання і магіі холаду.
actors.mobs.oldrime.warning=Стары Іней замахваецца для ўдару!
windows.wndjournal.ice_depth=Лёд %d
levels.icebosslevel.exit_name=Пячорны праход
levels.icebosslevel.exit_desc=Вузкі праход вядзе глыбей у гару.
levels.icebosslevel.blocked_name=Замерзлы праход
levels.icebosslevel.blocked_desc=Ледзяная сцяна перагароджвае праход за Старым Інеем.
items.weapon.ice.wrong_hero=Гэтая зброя не для вас.
items.weapon.ice.already_enchanted=Гэтая зброя ўжо зачараваная.
items.weapon.ice.glaciercleaver.name=Ледавіковы цясак
items.weapon.ice.glaciercleaver.desc=Шырокае лязо, высечанае з лёду Старога Інею. Трапленне пакрывае цэль інеем на чатыры хады. Наступны ўдар Ледавіковым цесаком расколвае яго, наносячы %d дадатковай шкоды. Толькі Воін можа ім карыстацца.
actors.buffs.frostcoating.name=Пакрыты інеем
actors.buffs.frostcoating.desc=Тонкі слой інею пакрывае гэтую істоту. Удар Ледавіковага цесака расколе яго.
items.weapon.ice.hoarfroststaff.name=Посах шэрані
items.weapon.ice.hoarfroststaff.desc=Паміж зубцамі посаха збіраецца холад. Яго снарады наносяць %d-%d шкоды да бонусаў навыкаў і запавольваюць рух і атакі на два хады. Спачатку змяшчае тры зарады і зараджаецца як жазло. Толькі Маг можа ім карыстацца.
items.weapon.ice.rimepick.name=Інеевая кірка
items.weapon.ice.rimepick.desc=Гэтая вузкая ледзяная кірка знаходзіць шчыліны ў брані. Яна абмінае чвэрць брані цэлі, а калі цэль заспета знянацку — палову. Толькі Разбойнік можа ёю карыстацца.
items.weapon.ice.frostbow.name=Марозны лук
items.weapon.ice.frostbow.desc=Стрэлы гэтага лука разлятаюцца вострымі ільдзінкамі пры трапленні. Яны наносяць цэлі на %d%% больш шкоды, а суседнім ворагам — чвэрць шкоды гэтага траплення. Аскепкі не замарожваюць ахвяр. Толькі Паляўнічая можа ім карыстацца.
items.weapon.ice.gravefrostscythe.name=Каса магільнага інею
items.weapon.ice.gravefrostscythe.desc=Іней пакрывае абмотаную касцямі ручку касы. Пакуль яна экіпіраваная, вашы выкліканыя шкілеты і прывіды наносяць %d дадатковай шкоды холадам за ўдар. Толькі Некрамант можа ёю карыстацца.
items.weapon.ice.frostbiterifle.name=Вінтоўка абмаражэння
items.weapon.ice.frostbiterifle.desc=Патроннік гэтай вінтоўкі пакрыты лёдам, які ніколі не растае. Кожнае трапленне выклікае абмаражэнне на два хады, запавольваючы рух на 20%. Новыя трапленні абнаўляюць эфект. Толькі Найміт можа ёю карыстацца.
library.ice_weapon_drop=Для кожнага героя выпадае адна зброя адпаведна яго класу.

actors.mobs.npcs.prospector.name=Затрыманы старацель
actors.mobs.npcs.prospector.desc=Старацель у залатаным паліто схаваўся ля лесвіцы. Яго лямпа ледзь гарыць.
actors.mobs.npcs.prospector.torches=Мая лямпа хутка згасне. Калі ўцякаў, пакінуў куфар з прыпасамі на гэтым паверсе. Прынясеш з яго _тры паходні_?
actors.mobs.npcs.prospector.iceclaws=Ледзяныя кіпцюры выгналі мяне са штольні. Забі _трох ледзяных кіпцюроў на гэтым паверсе_, каб я мог вярнуцца да працы.
actors.mobs.npcs.prospector.accept=Я дапамагу.
actors.mobs.npcs.prospector.later=Не зараз.
actors.mobs.npcs.prospector.need_torches=Мне патрэбныя _тры паходні_. Куфар усё яшчэ недзе на гэтым паверсе.
actors.mobs.npcs.prospector.claws_left=Засталося забіць ледзяных кіпцюроў: _%d_.
actors.mobs.npcs.prospector.reward=Добрая праца. Што выбераш?
actors.mobs.npcs.prospector.rations=Два рацыёны харчавання
actors.mobs.npcs.prospector.thanks=Адным клопатам менш. Дзякуй.
library.quest.prospector_torches.name=Лямпа згасае
library.quest.prospector_torches.desc=Прынясіце затрыманаму старацелю тры паходні. У куфры на яго паверсе іх дастаткова.
library.quest.prospector_iceclaws.name=Кіпцюры ў штольні
library.quest.prospector_iceclaws.desc=Забіце трох ледзяных кіпцюроў на паверсе старацеля і вярніцеся да яго.
library.quest.prospector.reward=Выберыце скрутак паляпшэння або два рацыёны харчавання.
items.scrolls.scrolloffrostlevel.read_confirm=Падчас чытання ты адчуваеш, што вось-вось тэлепартуешся.
