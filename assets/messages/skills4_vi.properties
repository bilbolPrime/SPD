skills4.smash.intro=Giáng một đòn mạnh vào kẻ địch bên cạnh.
skills4.endurance.intro=Tăng máu tối đa.
skills4.firm_hand.intro=Tăng độ chính xác khi cận chiến.
skills4.regeneration.intro=Hồi thêm máu theo thời gian. Ngừng hồi khi đói kiệt sức.
skills4.toughness.intro=Giảm sát thương nhận vào, trừ sát thương do đói.
skills4.knockback.intro=Đánh và đẩy kẻ địch lùi một ô. Không đẩy được trùm.
skills4.second_wind.intro=Hồi ngay một phần máu.
skills4.sure_footing.intro=Rút ngắn thời gian bị trói rễ và què quặt.
skills4.mastery.intro=Giúp bạn dùng vũ khí cận chiến nặng hơn và tấn công nhanh hơn.
skills4.parry.intro=Giảm sát thương từ đòn cận chiến kế tiếp nhận vào. Thế thủ kéo dài tối đa bốn lượt.
skills4.smite.intro=Đánh một đòn mạnh bỏ qua nửa giáp của mục tiêu. Tốn hai lượt.
skills4.riposte.intro=Sau khi đỡ đòn, tăng sát thương cho đòn cận chiến kế tiếp. Kéo dài bốn lượt.
skills4.footwork.intro=Cho phép giữ chuỗi liên kích lâu hơn giữa các đòn cận chiến.
skills4.duelist.intro=Tăng né tránh khi chỉ có đúng một kẻ địch đứng cạnh.
skills4.disarming_strike.intro=Đánh kẻ địch và làm nó suy yếu trong ba lượt.
skills4.find_the_gap.intro=Từ đòn cận chiến trúng thứ ba liên tiếp, các đòn đánh bỏ qua một phần giáp của mục tiêu.
skills4.aggression.intro=Máu càng thấp, sát thương cận chiến càng cao.
skills4.charge.intro=Lao tới đánh kẻ địch cách tối đa bốn ô. Cần đường đi thông thoáng.
skills4.rampage.intro=Đánh tất cả kẻ địch đứng cạnh.
skills4.bloodlust.intro=Tăng tốc độ cận chiến trong ba lượt sau khi giết kẻ địch.
skills4.war_cry.intro=Làm suy yếu các kẻ địch nhìn thấy trong phạm vi hai ô.
skills4.rend.intro=Xung phong và Càn quét khiến kẻ địch còn sống bị chảy máu.
skills4.relentless.intro=Giết kẻ địch rút ngắn hồi chiêu còn lại của Xung phong và Tiếng thét xung trận.
skills4.cornered.intro=Giảm sát thương cận chiến nhận vào khi có ít nhất hai kẻ địch vây quanh.

skills4.spark.intro=Bắn tia lửa vào một kẻ địch nhìn thấy.
skills4.spirituality.intro=Tăng năng lượng tối đa.
skills4.sorcerer.intro=Đũa phép gây thêm sát thương.
skills4.summon_rat.intro=Gọi một con chuột chiến đấu cho bạn.
skills4.meditation.intro=Hồi thêm năng lượng theo thời gian.
skills4.spirit_armor.intro=Hấp thụ sát thương, tốn một năng lượng cho mỗi điểm hấp thụ.
skills4.wizard.intro=Đũa phép nạp lại nhanh hơn.
skills4.channeling.intro=Rút ngắn hồi chiêu kỹ năng chủ động, tối thiểu còn một lượt.
skills4.charged_staff.intro=Đánh trúng bằng đũa phép trong cận chiến sẽ hồi năng lượng.
skills4.arcane_ward.intro=Giảm sát thương từ đòn cận chiến kế tiếp nhận vào. Lá chắn kéo dài tối đa bốn lượt.
skills4.arcane_strike.intro=Đánh một đòn phép thuật bỏ qua nửa giáp của mục tiêu.
skills4.conductive.intro=Đòn cận chiến bằng đũa phép mạnh hơn theo số lượt phép đang tích trữ. Mỗi đòn trúng tiêu hao một lượt phép thay vì nạp lại.
skills4.discharge.intro=Phóng năng lượng phép thuật gây sát thương lên mọi kẻ địch đứng cạnh.
skills4.spellweave.intro=Sau khi đánh trúng cận chiến, tăng sát thương đũa phép trong ba lượt.
skills4.drain_life.intro=Gây sát thương lên kẻ địch và hồi cho bạn nửa lượng máu nó mất.
skills4.rabid_minions.intro=Sinh vật triệu hồi gây thêm sát thương.
skills4.summon_skeleton.intro=Gọi một bộ xương chiến đấu cho bạn.
skills4.soul_hunger.intro=Hồi năng lượng khi giết kẻ địch.
skills4.enrage.intro=Khi bật, sinh vật triệu hồi gây nhiều sát thương hơn nhưng cũng nhận nhiều hơn.
skills4.slow.intro=Làm chậm di chuyển và tấn công của kẻ địch.
skills4.summoner.intro=Cho phép duy trì thêm một sinh vật triệu hồi.
skills4.dark_pact.intro=Đổi năm máu lấy năng lượng. Cần còn ít nhất sáu máu.

skills4.double_strike.intro=Đánh nhanh hai đòn liên tiếp.
skills4.stealth.intro=Kẻ địch khó nhận ra bạn hơn.
skills4.evasion.intro=Tăng khả năng né đòn.
skills4.smoke_bomb.intro=Ẩn mình trong làn khói. Tấn công sẽ làm mất hiệu ứng.
skills4.bandit.intro=Nhặt được thêm vàng từ mỗi đống.
skills4.venom.intro=Khi bật, đòn cận chiến có thể gây độc cho mục tiêu.
skills4.locksmith.intro=Có cơ hội vô hiệu hóa bẫy khi bước lên.
skills4.light_step.intro=Rút ngắn thời gian bị trói rễ và què quặt.
skills4.dash.intro=Lướt tối đa hai ô theo đường thông thoáng.
skills4.haste.intro=Tăng tốc độ di chuyển trong năm lượt.
skills4.shadow_clone.intro=Tạo một phân thân mạnh hoặc ba phân thân yếu hơn để chiến đấu cho bạn.
skills4.escape.intro=Thoát rễ trói và tàn phế, sau đó tăng né tránh trong bốn lượt.
skills4.trailblazer.intro=Tăng tốc độ di chuyển.
skills4.skirmish.intro=Di chuyển giúp đòn cận chiến kế tiếp mạnh hơn.
skills4.keep_distance.intro=Tăng né tránh trước kẻ địch cách hơn một ô.
skills4.ambush.intro=Tăng sát thương cận chiến khi tàng hình.
skills4.scorpion.intro=Nọc độc gây thêm sát thương.
skills4.silent_death.intro=Đòn cận chiến có thể giết ngay kẻ địch đang ngủ. Không tác dụng lên trùm.
skills4.expose.intro=Đòn cận chiến bỏ qua một phần giáp.
skills4.execution.intro=Tăng sát thương lên kẻ địch còn dưới một phần tư máu.
skills4.deadly_throw.intro=Tăng sát thương vũ khí tầm xa.

skills4.accuracy.intro=Tăng độ chính xác của đòn tầm xa.
skills4.awareness.intro=Có cơ hội né đòn tầm xa sắp trúng.
skills4.double_shot.intro=Bắn tiếp mũi tên thứ hai. Dùng hai mũi tên thường.
skills4.hunting.intro=Tìm thịt sống trong lúc khám phá.
skills4.fletching.intro=Làm tên thường trong lúc khám phá.
skills4.ko_arrow.intro=Mũi tên kế tiếp làm chậm mục tiêu và có thể khiến nó ngủ.
skills4.woodcraft.intro=Kẻ địch khó nhận ra bạn hơn.
skills4.quickdraw.intro=Tăng tốc độ tấn công tầm xa.
skills4.barkskin.intro=Tăng giáp.
skills4.nature_mend.intro=Hồi ngay một phần máu.
skills4.entangle.intro=Dùng rễ trói một kẻ địch nhìn thấy tại chỗ.
skills4.herbalist.intro=Giảm sát thương do độc.
skills4.dew_keeper.intro=Tăng máu hồi được từ sương.
skills4.knee_shot.intro=Mũi tên có thể làm mục tiêu tàn phế.
skills4.thicket.intro=Giảm sát thương từ đòn cận chiến kế tiếp nhận vào. Thế thủ kéo dài tối đa bốn lượt.
skills4.aimed_shot.intro=Tăng sát thương cho mũi tên trúng đích kế tiếp.
skills4.long_sight.intro=Tăng sát thương tầm xa lên kẻ địch cách ít nhất bốn ô.
skills4.piercing_shot.intro=Mũi tên tiếp theo bỏ qua một phần giáp của mục tiêu.
skills4.iron_tip.intro=Đầu tên sắt giúp tên xuyên qua kẻ địch và đánh kẻ đứng sau. Tường và đồng minh chặn mũi tên.
skills4.mark_prey.intro=Đánh dấu kẻ địch trong sáu lượt, tăng sát thương bạn gây lên nó.
skills4.bombvoyage.intro=Biến mũi tên thành bom. Vụ nổ cũng có thể làm bạn và đồng minh bị thương.
skills4.follow_through.intro=Sau khi giết kẻ địch, đòn tầm xa kế tiếp mạnh hơn trong bốn lượt.

skills4.curse.intro=Làm suy yếu đòn tấn công của kẻ địch trong mười lượt.
skills4.necro_spirit.intro=Tăng năng lượng tối đa.
skills4.raise_skeleton.intro=Gọi dậy một bộ xương từ xác nằm trên đất.
skills4.summon_ghost.intro=Gọi một hồn ma chiến đấu cho bạn.
skills4.soul_bind.intro=Tăng sát thương của sinh vật triệu hồi.
skills4.necro_meditation.intro=Hồi thêm năng lượng theo thời gian.
skills4.necro_drain_life.intro=Hút máu kẻ địch và hồi nửa sát thương gây ra.
skills4.master_of_death.intro=Hồi sinh với đầy máu và năng lượng. Sức mạnh này cần hồi lại trước khi cứu bạn lần nữa.
skills4.spirit_army.intro=Cho phép duy trì thêm một sinh vật triệu hồi.
skills4.mend_bones.intro=Hồi máu cho sinh vật triệu hồi trong tầm nhìn.
skills4.guardian_bond.intro=Giảm sát thương sinh vật triệu hồi nhận vào.
skills4.corpse_explosion.intro=Cho nổ một xác chết. Vụ nổ đánh trúng mọi người đứng cạnh, kể cả bạn và đồng minh.
skills4.raise_skeleton_archer.intro=Gọi dậy một cung thủ xương từ xác nằm trên đất.
skills4.last_rites.intro=Mỗi sinh vật triệu hồi có một cơ hội sống sót qua đòn chí tử với một phần tư máu.
skills4.soul_shelter.intro=Giảm sát thương từ đòn cận chiến kế tiếp nhận vào. Lá chắn kéo dài tối đa bốn lượt.
skills4.cold_touch.intro=Đánh kẻ địch và làm chậm nó trong ba lượt.
skills4.necro_slow.intro=Làm chậm di chuyển và tấn công của kẻ địch.
skills4.bone_spear.intro=Bắn một tia tử khí vào kẻ địch.
skills4.death_fed.intro=Hồi năng lượng khi giết kẻ địch.
skills4.cruel_study.intro=Tăng sát thương đũa phép.
skills4.withering_wave.intro=Gây sát thương lạnh lên các kẻ địch đứng cạnh và làm chậm chúng trong ba lượt.

skills4.steady_aim.intro=Tăng độ chính xác khi bắn súng.
skills4.packrat.intro=Súng chứa được nhiều đạn hơn.
skills4.fast_reload.intro=Nạp đạn súng nhanh hơn.
skills4.quick_draw.intro=Bắn súng nhanh hơn.
skills4.veteran_company.intro=Lính đánh thuê dưới quyền bạn gây thêm sát thương.
skills4.field_medicine.intro=Hồi ngay một phần máu.
skills4.powder.intro=Tăng sát thương súng.
skills4.steady_nerves.intro=Rút ngắn thời gian bị trói rễ và què quặt.
skills4.volley.intro=Bắn một phát mạnh hơn.
skills4.rally.intro=Hồi máu cho bạn và đồng minh trong phạm vi hai ô.
skills4.guard_order.intro=Lính đánh thuê dưới quyền bạn nhận ít sát thương hơn.
skills4.suppress.intro=Phát súng trúng đích kế tiếp làm suy yếu mục tiêu.
skills4.counter_fire.intro=Sau khi chịu sát thương cận chiến, phát súng trúng đích kế tiếp mạnh hơn trong bốn lượt.
skills4.i_am_the_law.intro=Tạm tăng máu tối đa và máu hiện tại trong hai mươi lượt.
skills4.headshot.intro=Phát súng kế tiếp mạnh hơn và chính xác hơn.
skills4.intimidate.intro=Gây sợ hãi cho một kẻ địch nhìn thấy. Không tác dụng lên trùm.
skills4.wanted.intro=Nhận vàng mỗi khi giết một kẻ địch.
skills4.no_witnesses.intro=Phát súng kế tiếp mạnh hơn và khiến kẻ địch còn sống bỏ chạy.
skills4.armor_piercer.intro=Đòn tầm xa bỏ qua một phần giáp.
skills4.execute.intro=Phát súng kết liễu kẻ địch bị thương nặng. Không tác dụng lên trùm.
skills4.final_notice.intro=Phát súng trúng đích kế tiếp bỏ qua thêm giáp.

