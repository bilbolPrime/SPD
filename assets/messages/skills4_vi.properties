skills4.subclass.gladiator=Đánh trúng cận chiến nối chuỗi liên kích, tăng sát thương các đòn sau.\n\n_+3 chính xác cận chiến_\n_Đánh cận chiến nhanh hơn 10%_
skills4.subclass.berserker=Khi còn dưới 40% máu, cuồng nộ tăng sát thương thêm 50%.\n\n_Thêm 10% sát thương cận chiến_\n_Nhận ít hơn 10% sát thương_
skills4.subclass.battlemage=Đòn cận chiến bằng đũa phép nạp lại một lượt phép và cộng số lượt phép hiện tại vào sát thương.\n\n_Tia lửa có 50% cơ hội làm mục tiêu mù trong 3 lượt._
skills4.subclass.warlock=Giết kẻ địch hồi máu và giảm đói.\n\n_Tia lửa gây thêm 5 sát thương._\n_Triệu hồi thêm một sinh vật._
skills4.subclass.freerunner=Khi không quá tải và không đói kiệt sức, di chuyển nhanh hơn 60% và né tránh gấp đôi lúc di chuyển.
skills4.subclass.assassin=Tấn công bất ngờ gây thêm sát thương.\n\n_+1 ẩn mình_
skills4.subclass.warden=Giẫm cỏ cao nhận Da vỏ cây. Cây có thể cho thêm hạt và sương.
skills4.subclass.sniper=Đòn tầm xa bỏ qua giáp và đánh dấu mục tiêu để ra đòn kế tiếp nhanh hơn.\n\n_Thêm 20% sát thương tầm xa_
skills4.subclass.spirit_binder=Đòn cận chiến bằng đũa phép nạp lại một lượt phép và cộng số lượt phép hiện tại vào sát thương.\n\n_Bộ xương gọi dậy tồn tại lâu gấp đôi._
skills4.subclass.lich=Giết kẻ địch hồi máu và giảm đói.\n\n_Bộ xương và cung thủ xương được gọi dậy có thêm 25% máu và sát thương._\n_Triệu hồi thêm một sinh vật._
skills4.subclass.marshal=Đánh trúng cận chiến nối chuỗi liên kích.\n\n_+5 đạn súng_\n_+1 chính xác súng_
skills4.subclass.executioner=Khi còn dưới 40% máu, cuồng nộ tăng sát thương thêm 50% và bắn súng nhanh hơn 50%.\n\n_Nạp đạn nhanh hơn 25%_
