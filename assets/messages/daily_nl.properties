daily.timeout_2=De laatste lift is vertrokken. Je kreeg niet iedereen op tijd weg.\n\nProbeer het opnieuw bij Dagelijkse uitdagingen.
daily.timeout_3=De storm heeft de uitgang bedolven. De jacht is voorbij.\n\nProbeer het opnieuw bij Dagelijkse uitdagingen.
daily.timeout_4=Het ritueel is voltooid. De demonen hebben de hallen overspoeld.\n\nProbeer het opnieuw bij Dagelijkse uitdagingen.
daily.timeout_6=De stadspoorten zijn gesloten. De wachters hebben je vluchtweg afgesneden.\n\nProbeer het opnieuw bij Dagelijkse uitdagingen.
