daily.brief_0=De versterkingen van de Rattenkoning zijn onderweg. Versla hem voordat ze zijn hof bereiken. Een gevangen bewaker kan je helpen. In de bewaakte voorraadkamer liggen voorraden.
daily.brief_1=Het oproer dekt Tengu's ontsnapping. Versla beide vluchtkapiteins om zijn schuilplaats te openen en versla daarna Tengu voordat de tijd om is. Bevrijd gevangenen als bondgenoten of doorzoek de afgesloten wapenkamer. De schuilplaats sluit achter je.
daily.brief_2=Drie mijnwerkers zitten vast en de laatste lift vertrekt bijna. Open hun schuilplaatsen, breng ze alle drie levend terug en neem de lift. DM-300 zwerft door de tunnels. Vecht of zoek een weg eromheen. Voorraden en afgesloten doorsteken kunnen helpen.
daily.brief_3=Een IJsklauw, een Rijpruggnoll en een Rijphoorn zwerven door de grotten. Dood alle drie en bereik de uitgang voordat de storm losbarst. Je kiest zelf de volgorde. In zijgangen liggen voorraden, maar zoeken kost tijd.
daily.brief_4=Drie rituele altaren roepen demonen op. Verzegel ze voordat het ritueel voltooid is. Elk gesloten altaar stopt een bron van versterkingen. Kies je route en zoek zo nodig voorraden in de zijkamers.
daily.brief_5=Houd de buitenpost tot hulp arriveert. De kapitein moet vijf aanvalsgolven overleven. Je verdedigers bewaken het midden terwijl jij vecht, voorraden zoekt of cellen opent voor extra hulp. Latere golven kunnen van meerdere kanten komen.
daily.brief_6=Het goud van de stad ligt in de koninklijke schatkamer. Pak de sleutel van de kapitein, open de kamer en vlucht door de andere stadspoort voordat die sluit. Het openen zet het alarm aan. Verzamel eerst voorraden en open doorsteken, of waag een snellere roof.
daily.rules=Elke datum heeft een eigen held, uitrusting en kerker. Verdeel je vaardigheidspunten voor vertrek. Tijd telt in beurten. Het verlaten van een evenement beëindigt de poging. Resultaten staan apart; je verdient hier geen insignes of ontdekkingen voor de kennisbank.
