actors.mobs.rebornboss.opening=¡Expuesto!
actors.mobs.rebornboss.interrupted=¡%s pierde la concentración!
actors.mobs.reborngoo.desc=Se sabe poco de la Masa viscosa. Quizá ni siquiera sea una criatura, sino una mezcla de sustancias de las alcantarillas que ha desarrollado un atisbo de voluntad propia.
actors.mobs.reborngoo.warning=¡Goo se hincha! ¡Apártate!
actors.mobs.reborndm300.desc=Los enanos construyeron esta máquina hace varios siglos. Más tarde empezaron a sustituir sus máquinas por gólems, elementales e incluso demonios, lo que acabó llevando a su civilización a la decadencia. El DM-300 y otras máquinas similares se usaban para construir y excavar minas, y a veces para defender las ciudades.
actors.mobs.reborndm300.repair=¡DM-300 se repara!
actors.mobs.reborndm300.warning=¡El motor chirría! ¡Sal de las marcas del suelo!
actors.mobs.rebornking.desc=El último rey de los enanos conocía bien los secretos de la vida y la muerte. Convenció a su corte de participar en un ritual que debía darles juventud eterna. Al final solo él la consiguió, junto con un ejército de muertos vivientes.
actors.mobs.rebornking.warning=¡El Rey levanta la mano!
actors.mobs.rebornking.herald_fell=¡Mantened la posición, cobardes!
actors.mobs.rebornking$retainer.name_0=Guardia real
actors.mobs.rebornking$retainer.desc_0=Un enano muerto con una armadura maltrecha. Aún sigue protegiendo a su rey.
actors.mobs.rebornking$retainer.name_1=Hechicero de la corte
actors.mobs.rebornking$retainer.desc_1=Un mago de la corte devuelto a la vida. La magia oscura se concentra en sus manos.
actors.mobs.rebornking$retainer.name_2=Heraldo real
actors.mobs.rebornking$retainer.desc_2=Ni la mandíbula rota impide que este heraldo grite las órdenes del Rey. Los muertos obedecen.
actors.mobs.rebornking$retainer.name_3=Arquero no muerto
actors.mobs.rebornking$retainer.desc_3=A este enano lo enterraron con su arco. No ha olvidado cómo usarlo.
actors.mobs.rebornyog.desc=Yog-Dzewa es un Dios Antiguo, una poderosa entidad proveniente de los reinos del caos. Hace un siglo, los antiguos enanos apenas lograron vencer a su ejército de demonios, pero fueron incapaces de matar al dios. En su lugar, lo aprisionaron en las salas bajo su ciudad, creyendo que era demasiado débil para resucitar.
actors.mobs.rebornyog.warning=¡El aire se desgarra! ¡Sal de las marcas parpadeantes!
actors.mobs.rebornyog.inherit_rot=La carne se marchita. Yo permanezco.
actors.mobs.rebornyog.inherit_fire=Ahora la llama es mía.
actors.mobs.rebornyog$rotting.desc=Un enorme puño de carne podrida. Una baba pestilente se filtra entre sus dedos y mancha la piedra bajo él.
actors.mobs.rebornyog$rotting.warning=¡El puño putrefacto toma impulso!
actors.mobs.rebornyog$burninghand.desc=Un gran puño envuelto en llamas. Sus dedos crepitan al cerrarse y dejan caer brasas al suelo.
actors.mobs.rebornyog$burninghand.warning=¡Se juntan brasas ante el puño ardiente!
actors.mobs.reborntengu.shadow_broken=¡Mi sombra…!
