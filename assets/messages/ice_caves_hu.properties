items.scrolls.scrolloffrostlevel.name=Dértekercs
items.scrolls.scrolloffrostlevel.desc=Hideg árad a pergamenből.\n\nBárhol szét is tépheted, hogy megfagyaszd a szint összes ellenségét. Ha sebzést kapnak, a fagy megtörik. A főellenségekre és a fagyra immunis lényekre nem hat. Ez nem okoz sebzést.
items.scrolls.scrolloffrostlevel.ac_tear=Széttépés
items.scrolls.scrolloffrostlevel.tear_confirm=A tekercs széttépése felszabadítja a benne rejlő mágiát, és megfagyasztja a szint összes ellenségét. Ha sebzést kapnak, a fagy megtörik. A főellenségekre és a fagyra immunis lényekre nem hat. Ez nem okoz sebzést.\n\nSzéttéped a tekercset?
items.scrolls.scrolloffrostlevel.wrong_place=A tekercs itt nem működik.
items.scrolls.scrolloffrostlevel.spent=Az átjáró már megnyílt. A tekercs néma marad.
items.keys.key.ice_depth=Ez a kulcs a Jégbarlangok %d. szintjéhez tartozik.
scenes.interlevelscene$mode.frost=Belépés a Jégbarlangokba...
levels.icecaveslevel.water_name=Jeges víz
levels.icecaveslevel.water_desc=Vékony jégkéreg törik a lábad alatt.
levels.icecaveslevel.wall_desc=A csákánynyomokat vastag jégerek fedik. A bányászok elhagyták a tárnákat, amikor a hideg behatolt a sziklába.
levels.cavesbosslevel.collapsed_name=Beomlott barlang
levels.cavesbosslevel.collapsed_desc=Beomlott barlang. A lezuhant sziklákon nem lehet átjutni.
actors.buffs.frostbite.name=Fagyás
actors.buffs.frostbite.desc=A hideg 20%-kal lassítja a mozgásodat.
actors.mobs.rimebat.name=Dérdenevér
actors.mobs.rimebat.desc=Ezek a sápadt denevérek a jég alatt fészkelnek. Hideg harapásuk rövid időre lassítja a mozgást, így van idejük újabb támadásra fordulni.\n\nImmunis a fagyasztásra és a jégmágiára.
actors.mobs.iceclaw.name=Jégkarom
actors.mobs.iceclaw.desc=Tömör jégpáncélú dögevő. Harc előtt rövid időre megvastagítja a páncélját. A tűz leolvasztja ezt a további védelmet.\n\nImmunis a fagyasztásra és a jégmágiára.
actors.mobs.frostback.name=Dérhátú gnoll
actors.mobs.frostback.desc=Ez a gnoll az ide tévedők kifosztásával vészelte át a hideget. Amikor felemeli fegyverét, lépj félre: a súlyos csapás oda érkezik, ahol álltál.\n\nImmunis a fagyasztásra és a jégmágiára.
actors.mobs.shardling.name=Jégszilánklény
actors.mobs.shardling.desc=Jégkristályok nyugtalan csomója. Céloz, majd egyenes vonalban szilánkokat lő ki. A falak megállítják a sortüzet.\n\nImmunis a fagyasztásra és a jégmágiára.
actors.mobs.hollowminer.name=Üres bányász
actors.mobs.hollowminer.desc=Ez a bányász sosem jutott ki a fagyott tárnákból. Lámpása még ég, bár gazdája rég halott. Ha sikerül felemelnie, harcba hívja a közeli lényeket. Egy találat megszakítja a jelzést.\n\nImmunis a fagyasztásra és a jégmágiára.
actors.mobs.rimehorn.name=Dérszarv
actors.mobs.rimehorn.desc=Súlyos vadállat, bundájában vastag dérrel. Kaparja a földet, mielőtt egyenesen előreront. Térj ki az útjából, amíg készülődik.\n\nImmunis a fagyasztásra és a jégmágiára.
actors.mobs.oldrime.name=Vén Dér
actors.mobs.oldrime.desc=A bányászok a hegy alatt találták meg Vén Deret, a járataiknál is ősibb jégbe temetve. Csákányaik felébresztették. Most a fagyott tárnákat és a mögöttük nyíló utat őrzi. Ahogy gyengül, páncélja letöredezik, és végtagjai szabaddá válnak. Vigyázz a súlyos csapásokkal, a padlót áttörő jéggel és fagyos leheletével.\n\nImmunis a fagyasztásra és a jégmágiára.
actors.mobs.oldrime.warning=Vén Dér ütésre lendül!
windows.wndjournal.ice_depth=Jég %d
levels.icebosslevel.exit_name=Barlangi átjáró
levels.icebosslevel.exit_desc=Keskeny járat vezet mélyebbre a hegybe.
levels.icebosslevel.blocked_name=Fagyott átjáró
levels.icebosslevel.blocked_desc=Jégfal zárja el az átjárót Vén Dér mögött.
items.weapon.ice.wrong_hero=Ez a fegyver nem neked való.
items.weapon.ice.already_enchanted=Ez a fegyver már bűvölt.
items.weapon.ice.glaciercleaver.name=Gleccserbárd
items.weapon.ice.glaciercleaver.desc=Vén Dér jegéből faragott széles penge. A találat négy körre dérrel vonja be a célpontot. A következő Gleccserbárd-találat összetöri a deret, és %d további sebzést okoz. Csak Harcos használhatja.
actors.buffs.frostcoating.name=Dérrel borítva
actors.buffs.frostcoating.desc=Vékony dérréteg tapad ehhez a lényhez. Egy Gleccserbárd csapása összetöri.
items.weapon.ice.hoarfroststaff.name=Zúzmarabot
items.weapon.ice.hoarfroststaff.desc=Hideg gyűlik a bot ágai között. Lövedékei képességbónuszok nélkül %d-%d sebzést okoznak, és két körre lassítják a mozgást és a támadásokat. Kezdetben három töltete van, és varázspálcaként töltődik újra. Csak Mágus használhatja.
items.weapon.ice.rimepick.name=Dércsákány
items.weapon.ice.rimepick.desc=Ez a keskeny jégcsákány megtalálja a páncél réseit. Figyelmen kívül hagyja a célpont páncéljának negyedét, meglepett célpont esetén a felét. Csak Zsivány használhatja.
items.weapon.ice.frostbow.name=Fagyíj
items.weapon.ice.frostbow.desc=Az ebből az íjból kilőtt nyilak találatkor éles jéggé robbannak. A célpontnak %d%%-kal több sebzést, a szomszédos ellenfeleknek pedig az adott találat sebzésének negyedét okozzák. A szilánkok nem fagyasztják meg áldozataikat. Csak Vadásznő használhatja.
items.weapon.ice.gravefrostscythe.name=Sírderes kasza
items.weapon.ice.gravefrostscythe.desc=Dér tapad a kasza csontokkal körbevett nyelére. Amíg viseled, az általad idézett csontvázak és szellemek találatonként %d további hidegsebzést okoznak. Csak Nekromanta használhatja.
items.weapon.ice.frostbiterifle.name=Fagyáspuska
items.weapon.ice.frostbiterifle.desc=A puska töltényűrét soha el nem olvadó jég béleli. Minden sikeres lövés két körre fagyást okoz, 20%-kal lassítva a mozgást. Az újabb találatok megújítják a hatást. Csak Zsoldos használhatja.
library.ice_weapon_drop=Minden hősnek egy, a kasztjához illő fegyver esik.

actors.mobs.npcs.prospector.name=Bennrekedt bányász
actors.mobs.npcs.prospector.desc=Egy foltozott kabátú bányász húzódik meg a lépcső mellett. Lámpája alig pislákol.
actors.mobs.npcs.prospector.torches=A lámpám már nem bírja sokáig. Menekülés közben itt hagytam egy ládát az ellátmánnyal. Hoznál belőle _három fáklyát_?
actors.mobs.npcs.prospector.iceclaws=A jégkarmok elűztek a tárnámból. Ölj meg _három jégkarmot ezen a szinten_, hogy visszatérhessek dolgozni.
actors.mobs.npcs.prospector.accept=Segítek.
actors.mobs.npcs.prospector.later=Most nem.
actors.mobs.npcs.prospector.need_torches=_Három fáklyára_ van szükségem. A láda még itt van valahol ezen a szinten.
actors.mobs.npcs.prospector.claws_left=Még ennyi jégkarmot kell megölni: _%d_.
actors.mobs.npcs.prospector.reward=Szép munka. Melyiket kéred?
actors.mobs.npcs.prospector.rations=Két élelmiszeradag
actors.mobs.npcs.prospector.thanks=Eggyel kevesebb gond. Köszönöm.
library.quest.prospector_torches.name=Kialvó lámpa
library.quest.prospector_torches.desc=Vigyél három fáklyát a bennrekedt bányásznak. A szintjén lévő ládában van elég.
library.quest.prospector_iceclaws.name=Jégkarmok a tárnában
library.quest.prospector_iceclaws.desc=Ölj meg három jégkarmot a bányász szintjén, majd térj vissza hozzá.
library.quest.prospector.reward=Válassz: a fejlesztés tekercse vagy két élelmiszeradag.
items.scrolls.scrolloffrostlevel.read_confirm=Olvasás közben érzed, hogy mindjárt elteleportálsz.
