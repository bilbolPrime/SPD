actors.mobs.rebornboss.opening=À découvert !
actors.mobs.rebornboss.interrupted=%s perd sa concentration !
actors.mobs.reborngoo.desc=On sait peu de choses sur Goo. Ce n'est peut-être même pas une créature, mais un amas de substances des égouts qui aurait acquis un semblant de volonté.
actors.mobs.reborngoo.warning=Goo gonfle. Écartez-vous !
actors.mobs.reborndm300.desc=Cette machine a été créée par les nains il y a plusieurs siècles. Ils ont ensuite remplacé leurs machines par des golems, des élémentaires et même des démons, précipitant le déclin de leur civilisation. Les DM-300 et les machines semblables servaient surtout à construire et à creuser les mines, parfois à défendre les cités.
actors.mobs.reborndm300.repair=DM-300 se répare !
actors.mobs.reborndm300.warning=Le moteur hurle. Quittez les marques au sol !
actors.mobs.rebornking.desc=Le dernier roi des nains connaissait les secrets de la vie et de la mort. Il a convaincu sa cour de participer à un rituel censé leur offrir une jeunesse éternelle. Au bout du compte, il fut le seul à l'obtenir, avec une armée de morts-vivants en prime.
actors.mobs.rebornking.warning=Le Roi lève la main !
actors.mobs.rebornking.herald_fell=Tenez vos positions, lâches !
actors.mobs.rebornking$retainer.name_0=Garde royal
actors.mobs.rebornking$retainer.desc_0=Un nain mort dans une armure cabossée. Il monte toujours la garde auprès de son roi.
actors.mobs.rebornking$retainer.name_1=Mage de la cour
actors.mobs.rebornking$retainer.desc_1=Un mage de la cour tiré de sa tombe. De la magie noire se concentre dans ses mains.
actors.mobs.rebornking$retainer.name_2=Héraut royal
actors.mobs.rebornking$retainer.desc_2=Même avec la mâchoire brisée, ce héraut aboie encore les ordres du Roi. Les morts obéissent.
actors.mobs.rebornking$retainer.name_3=Archer mort-vivant
actors.mobs.rebornking$retainer.desc_3=Ce nain a été enterré avec son arc. Il n'a pas oublié comment s'en servir.
actors.mobs.rebornyog.desc=Yog-Dzewa est un Dieu Ancien, une entité puissante issue des royaumes du chaos. Il y a un siècle, les anciens nains remportèrent de justesse la guerre contre son armée de démons, mais furent incapables de tuer le dieu lui-même. Ils l'emprisonnèrent alors dans les salles souterraines de leur cité, le croyant trop faible pour jamais se relever.
actors.mobs.rebornyog.warning=L'air se déchire. Quittez les marques vacillantes !
actors.mobs.rebornyog.inherit_rot=La chair flétrit. Je demeure.
actors.mobs.rebornyog.inherit_fire=La flamme m'appartient.
actors.mobs.rebornyog$rotting.desc=Un énorme poing de chair pourrie. Une bave infecte suinte entre ses doigts et souille la pierre en dessous.
actors.mobs.rebornyog$rotting.warning=Le poing putride prend son élan !
actors.mobs.rebornyog$burninghand.desc=Un poing immense enveloppé de flammes. Ses doigts crépitent en se refermant et laissent tomber des braises au sol.
actors.mobs.rebornyog$burninghand.warning=Des braises s'amassent devant le poing ardent !
actors.mobs.reborntengu.shadow_broken=Mon ombre… !
