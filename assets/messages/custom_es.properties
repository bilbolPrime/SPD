custom.difficulty.easy=Fácil
custom.difficulty.easy.desc=- Comienza con 2 raciones extra.\n- Comienza con 2 pociones de curación.\n- Comienza con 200 de oro.\n- Comienza con 2 cristales de alma.\n- Bonificación por descubrir puertas y trampas ocultas.\n- Los monstruos son débiles, hacen un 25% menos de daño, reciben un 10% más de daño y tienen un 15% menos de HP.\n- Tasa de aparición de campeones establecida en 10%.\n- Tasa de caída de campeones establecida en 30%.
custom.difficulty.hard=Duro
custom.difficulty.hard.desc=- La poción de curación cura el 75% de los puntos de vida máximos.\n- Los monstruos son fuertes, hacen un 10% de daño adicional, reciben un 10% menos de daño y tienen un 20% más de puntos de vida.\n- La tasa de aparición de campeones se establece en un 30%.\n- La tasa de caída de campeones se establece en un 50%.
custom.difficulty.hell.desc=- La poción de curación cura el 50% de los puntos de vida máximos.\n- Los monstruos son inmortales, hacen un 35% más de daño, reciben un 30% menos de daño y tienen un 45% más de puntos de vida.\n- La tasa de aparición de campeones se establece en un 50%.\n- El héroe comienza con 4 puntos menos de puntos de vida máximos.\n- El héroe gana 1 punto menos de puntos de vida máximos al subir de nivel.\n- La tasa de aparición de campeones se establece en un 70%.
custom.difficulty.just_kill_me=Mátame
custom.difficulty.just_kill_me.desc=- Comienza con dos pociones de experiencia.\n- La poción de curación cura el 10% de los puntos de vida máximos.\n- Los monstruos son deidades, hacen un 60% más de daño, reciben un 40% menos de daño y tienen un 75% más de puntos de vida.\n- La tasa de aparición de campeones se establece en el 100%.\n- El héroe comienza con 8 puntos menos de puntos de vida máximos.\n- El héroe gana 3 puntos menos de puntos de vida máximos al subir de nivel.\n- La tasa de caída de campeones se establece en el 100%.
custom.difficulty.nightmare.desc=- La poción de curación cura el 25% de los puntos de vida máximos.\n- Los monstruos son divinos, hacen un 45% más de daño, reciben un 30% menos de daño y tienen un 60% más de puntos de vida.\n- La tasa de aparición de campeones se establece en un 70%.\n- El héroe comienza con 8 puntos menos de puntos de vida máximos.\n- El héroe gana 3 puntos menos de puntos de vida máximos al subir de nivel.\n- La tasa de caída de campeones se establece en un 90%.
custom.difficulty.normal.desc=- Los monstruos son estándar.\n- Tasa de aparición de campeones establecida en 20%.\n- Tasa de obtención de campeones establecida en 40%.
custom.difficulty.super_easy=Súper fácil
custom.difficulty.super_easy.desc=- Comienza con 5 raciones extra.\n- Comienza con 5 pociones de curación.\n- Comienza con 500 de oro.\n- Comienza con 3 cristales de alma.\n- Los monstruos son patéticos, hacen un 50% menos de daño, reciben un 50% más de daño y tienen un 50% menos de HP.\n- Tasa de aparición de campeones establecida en 10%.\n- Tasa de caída de campeones establecida en 10%.
levels.sign.dead_end=¡¿Qué estás haciendo aquí?!
levels.sign.tip_02=No todas las puertas de la mazmorra son visibles a simple vista. Si te quedas atascado, busca las puertas ocultas.
levels.sign.tip_03=Recuerda que aumentar tu fuerza no es la única forma de acceder a mejor equipo. También puedes optar por la otra opción: reducir el requisito de fuerza con Pergaminos de Mejora.
levels.sign.tip_04=Puedes gastar tu oro en las tiendas de los niveles más profundos de la mazmorra. La primera está en el nivel 6.
levels.sign.tip_09=Un ataque sorpresa tiene más probabilidades de éxito. Por ejemplo, puedes tenderle una emboscada a tu enemigo detrás de una puerta cerrada cuando sabes que se acerca.
levels.sign.tip_13=Si estás ardiendo, no puedes apagar el fuego en el agua mientras levitas.
levels.sign.tip_21=Pixel-Mart. ¡Precios especiales para cazadores de demonios!
actors.blobs.waterofawareness.drink_message=Al tomar un sorbo, sientes cómo el conocimiento fluye hacia tu mente. Ahora lo sabes todo sobre los objetos que llevas equipados. Además, percibes todos los objetos del nivel y conoces todos sus secretos.
