levels.sign.burn=Al intentar leer el letrero, este estalla en llamas verdosas.
levels.sign.tip_01=No sobreestimes tu fuerza, usa armas y armaduras que puedas manejar.
levels.sign.tip_05=¡Cuidado con la sustancia pegajosa!
levels.sign.tip_06=Pixel-Mart: ¡todo lo que necesitas para una aventura exitosa!
levels.sign.tip_07=Identifica tus pociones y pergaminos cuanto antes. No lo dejes para el momento en que realmente los necesites.
levels.sign.tip_08=Tener hambre no duele, pero morirse de hambre sí duele.
levels.sign.tip_10=¡No dejes escapar al Tengu!
levels.sign.tip_11=Pixel-Mart. Gasta dinero. Vive más tiempo.
levels.sign.tip_12=Cuando te ataquen varios monstruos al mismo tiempo, intenta refugiarte detrás de una puerta.
levels.sign.tip_14=No tiene sentido poseer más de un Ankh al mismo tiempo, porque los perderás al resucitar.
levels.sign.tip_15=¡PELIGRO! ¡La maquinaria pesada puede causar lesiones, amputaciones o la muerte!
levels.sign.tip_16=Pixel-Mart. Una vida más segura en la mazmorra.
levels.sign.tip_17=Al mejorar un arma encantada, existe la posibilidad de destruir dicho encantamiento.
levels.sign.tip_18=Las armas y las armaduras se deterioran más rápido que las varitas y los anillos, pero hay más maneras de repararlas.
levels.sign.tip_19=La única forma de obtener un Pergamino de Aniquilación es recibirlo como regalo de los espíritus de la mazmorra.
levels.sign.tip_20=¡No se permiten armas en presencia de Su Majestad!
