levels.rebornsiderooms.leave=Otthagyom
actors.mobs.npcs.echoreflection.name=a tükörképed
actors.mobs.npcs.echoreflection.desc=Halvány másod mozdulatlanul vár. Csak akkor harcol, ha kihívod. Legyőzése egy képességpontot ér. Ha elhagyod a szobát, véget ér a párbaj, és a tükörkép teljesen felgyógyul.
actors.mobs.npcs.echoreflection.challenge=Kihívod a tükörképedet? A győzelem egy képességpontot ér. Visszavonulhatsz, de a tükörkép felgyógyul, ha elhagyod a szobát.
actors.mobs.npcs.echoreflection.accept=Kihívás
actors.mobs.npcs.echoreflection.withdrawn=A tükörképed újra mozdulatlanná válik.
actors.mobs.npcs.echoreflection.victory=A tükörkép szertefoszlik, és egy képességtekercset hagy maga után.
actors.mobs.npcs.barbecueking.name=patkánykirály
actors.mobs.npcs.barbecueking.desc=Még egy királynak is ennie kell. Talált egy nyugodt sarkot, ahol megsütheti a vacsoráját.
actors.mobs.npcs.barbecueking.greeting=Királyi ügyek. Nagyon fontosak. Nagyon finomak.
actors.mobs.npcs.barbecueking.stolen=HÉ! Az az enyém volt!
actors.mobs.npcs.barbecueking.after=Remélem, a torkodon akad.
actors.mobs.npcs.forgottenoffering.name=elfeledett adomány
actors.mobs.npcs.forgottenoffering.desc=A kristály alatt egy adag étel és egy gyógyital vár. Válassz egyet; a másik porrá omlik.
actors.mobs.npcs.watchremains.name=elesett őr
actors.mobs.npcs.watchremains.desc=Egy őr csontjai hevernek az áttört fal mellett. A sisakja alól papírfecni lóg ki.
actors.mobs.npcs.watchremains.note=Egész éjjel tartottam az ajtót. A falon jöttek át.
