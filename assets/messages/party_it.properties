actors.skills.raiseskeletonskill.desc=Evoca uno scheletro che combatta al tuo fianco.
network.partysession.background=La connessione al gruppo è stata interrotta perché hai lasciato il gioco.
items.corpse.name=cadavere
items.corpse.desc=Un cadavere fresco, utilizzabile per la negromanzia.
items.armorkit.desc=Questi attrezzi trasformano qualsiasi armatura in un'armatura epica. Mantiene le sue proprietà e ottiene un'abilità della tua classe. Non occorre essere un artigiano.
items.bomb.desc=Una piccola bomba di polvere nera. La miccia si accende quando la lanci.
items.quest.driedrose.desc=La rosa è secca da tempo, ma ha conservato tutti i petali.
items.quest.phantomfish.desc=Questo pesciolino traslucido si vede appena fuori dall'acqua. Nell'acqua è quasi invisibile.
items.tomeofmastery.desc=Questo libro dalla copertina consunta è sottile, ma sembra custodire molto sapere. Leggerlo richiede un po' di tempo.
items.weightstone.desc=Permette di bilanciare un'arma da mischia per migliorarne la velocità o la precisione.
items.wands.wandofamok.desc=La luce viola fa impazzire il bersaglio, che attacca le creature vicine senza distinguerle.
items.wands.wandofavalanche.desc=Colpendo una parete o un altro ostacolo solido, provoca una frana che ferisce e stordisce le creature nella zona.
items.wands.wandofflock.desc=Evoca un gregge di pecore magiche che blocca temporaneamente il passaggio.
items.wands.wandofpoison.desc=Avvelena il bersaglio, causando danni periodici. I potenziamenti prolungano il veleno.
items.wands.wandofreach.desc=Raccoglie oggetti a distanza e scambia il tuo posto con un nemico. L'onda attiva trappole, calpesta l'erba e apre o chiude le porte lungo il percorso.
items.wands.wandofslowness.desc=Dimezza per un po' la velocità di movimento e attacco del bersaglio.
items.wands.wandofteleportation.desc=Teletrasporta una creatura in un punto casuale del piano.
items.weapon.melee.dualswords.desc=Due lame affilate per colpire più forte.
items.weapon.missiles.cupidarrow.desc=Si dice che questa freccia appartenesse a Cupido. Scegli con cura il bersaglio.
items.weapon.missiles.curaredart.desc=Questi dardi fanno pochi danni, ma possono paralizzare il bersaglio e lasciarlo indifeso.
items.weapon.missiles.incendiarydart.desc=La punta si conficca nel bersaglio mentre la miscela legata al dardo prende fuoco.
items.weapon.missiles.soulcrystal.desc=Un cristallo capace di catturare anime. Lancialo contro un nemico debole o indebolito per imprigionarne lo spirito.
items.weapon.missiles.tamahawk.desc=Quest'ascia da lancio non è molto pesante, ma serve forza per usarla bene.
network.partytext.weapon_fast=Quest'arma è veloce.
network.partytext.weapon_slow=Quest'arma è lenta.
network.partytext.weapon_accurate=Quest'arma è precisa.
network.partytext.weapon_inaccurate=Quest'arma è poco precisa.
network.partytext.weapon_fast_and_accurate=Quest'arma è veloce e precisa.
network.partytext.weapon_fast_but_inaccurate=Quest'arma è veloce, ma poco precisa.
network.partytext.weapon_slow_but_accurate=Quest'arma è lenta, ma precisa.
network.partytext.weapon_slow_and_inaccurate=Quest'arma è lenta e poco precisa.
network.partytext.necroblade_bolt=Dal livello 5, la lama completamente carica può lanciare _Dardo oscuro_, che può distruggere l'essenza di un bersaglio e asservirlo.
network.partytext.necroblade_intro=Forgiata con magia oscura, questa lama divora le anime delle vittime e diventa più forte.
network.partytext.necroblade_energy=Anime accumulate: _%s/100_
network.partytext.necroblade_damage=Le anime aggiungono _0–%d danni_.
network.partytext.necroblade_hungry=La lama può consumare una carica completa di anime per diventare più forte.
network.partytext.necroblade_full=La lama non può più migliorarsi consumando anime.
