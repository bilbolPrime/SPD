skills4.smash.intro=Trafas apudan malamikon per krudforto.
skills4.endurance.intro=Pliigas vian maksimuman sanon.
skills4.firm_hand.intro=Plibonigas vian precizecon en manbatala batalo.
skills4.regeneration.intro=Reakiru kroman sanon kun la tempo. Malsato ĉesigas ĉi tiun resaniĝon.
skills4.toughness.intro=Reduktas envenantan damaĝon, krom malsato.
skills4.knockback.intro=Batas malamikon kaj repuŝas ĝin unu kahelon. Estroj ne povas esti puŝitaj.
skills4.second_wind.intro=Tuj restarigas iom da sano.
skills4.sure_footing.intro=Mallongigas la daŭron de enradikiĝo kaj kripligo.
skills4.mastery.intro=Plibonigu la efikan nivelon kaj atakrapidecon de via armilo.
skills4.parry.intro=Malpliigas la damaĝon de la sekva proksima bato, kiun vi ricevos. La protekto daŭras ĝis kvar movoj.
skills4.smite.intro=Liveras fortan baton kiu ignoras duonon de la kiraso de la celo. Prenas du turnojn.
skills4.riposte.intro=Plifortigas vian venontan manbatalan baton post blokado. Daŭras kvar turnojn.
skills4.footwork.intro=Donas al vi pli da tempo inter manbatalaj trafoj por konservi kombon.
skills4.duelist.intro=Pliigas evitadon dum ĝuste unu malamiko staras apud vi.
skills4.disarming_strike.intro=Batas malamikon kaj malfortigas ĝin por tri turnoj.
skills4.find_the_gap.intro=Via tria sinsekva proksimbatala trafo kaj ĉiu posta trapenetras parton de la kiraso de la celo.
skills4.aggression.intro=Via manbatala damaĝo pliiĝas dum vi perdas sanon.
skills4.charge.intro=Alkuras kaj batas malamikon ĝis kvar kampojn for. La vojo devas esti libera.
