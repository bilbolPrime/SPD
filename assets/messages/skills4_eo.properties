skills4.bloodlust.intro=Akcelas manbatalatakojn por tri turnoj post mortigo.
skills4.war_cry.intro=Malfortigas videblajn malamikojn ene de du kaheloj.
skills4.rend.intro=Atakimpeto kaj Furiozado igas postvivantajn malamikojn sangi.
skills4.relentless.intro=Mortigita malamiko mallongigas la restantan reŝargtempon de Atakimpeto kaj Militkrio.
skills4.cornered.intro=Reduktas manbatalajn damaĝojn prenitajn dum du aŭ pli da malamikoj ĉirkaŭas vin.

