skills4.subclass.gladiator=Sukcesaj manbatalo-trafoj konstruas kombon, aldonante damaĝon al postaj trafoj.\n\n_+3 manbatalo-precizeco_\n_10% pli rapidaj manbatalo-atakoj_
skills4.subclass.berserker=Sub 40% sano, furiozo pliigas la damaĝon je 50%.\n\n_10% pli da proksimbatala damaĝo_\n_10% malpli da ricevata damaĝo_
skills4.subclass.battlemage=Trafoj per vergo en proksima batalo redonas unu ŝargon kaj aldonas la nombron de ŝargoj al la damaĝo.\n\n_Fajrero havas 50% ŝancon blindigi la celon dum 3 movoj._
skills4.subclass.warlock=Mortigi malamikojn redonas sanon kaj mildigas malsaton.\n\n_Fajrero kaŭzas 5 pliajn poentojn da damaĝo._\n_Unu plia alvokita estaĵo._
skills4.subclass.freerunner=Sen tro peza ekipaĵo kaj dum vi ne malsatmortas, vi moviĝas 60% pli rapide. Dum moviĝo via evitkapablo duobliĝas.
skills4.subclass.assassin=Surprizatakoj kaŭzas plian damaĝon.\n\n_+1 kaŝemo_
skills4.subclass.warden=Treti altan herbon donas Ŝelhaŭton. Plantoj povas doni pliajn semojn kaj roson.
skills4.subclass.sniper=Atakoj de malproksime ignoras kirason kaj markas la celon por pli rapida sekva atako.\n\n_20% pli da damaĝo de malproksime_
skills4.subclass.spirit_binder=Trafoj per vergo en proksima batalo redonas unu ŝargon kaj aldonas la nombron de ŝargoj al la damaĝo.\n\n_Revivigitaj skeletoj restas duoble pli longe._
skills4.subclass.lich=Mortigi malamikojn redonas sanon kaj mildigas malsaton.\n\n_Revivigitaj skeletoj kaj skeletaj arkpafistoj estas duoble pli fortaj._\n_Unu plia alvokita estaĵo._
skills4.subclass.marshal=Sukcesaj manbatalaj trafoj konstruas kombon.\n\n_+5 pafilmunicio_\n_+1 pafilprecizeco_
skills4.subclass.executioner=Sub 40% sano, furiozo pliigas la damaĝon je 50% kaj rapidigas pafadon je 50%.\n\n_25% pli rapida reŝargado_
