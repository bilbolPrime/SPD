actors.skills.raiseskeletonskill.desc=Triệu hồi một bộ xương chiến đấu bên cạnh bạn.
network.partysession.background=Kết nối nhóm đã bị ngắt vì bạn đã rời trò chơi.
items.corpse.name=thi thể
items.corpse.desc=Một thi thể còn mới, có thể dùng cho thuật gọi hồn.
items.armorkit.desc=Bộ dụng cụ này biến bất kỳ áo giáp nào thành giáp sử thi. Giáp giữ nguyên thuộc tính và có thêm kỹ năng theo lớp nhân vật. Không cần biết nghề thủ công.
items.bomb.desc=Một quả bom nhỏ chứa thuốc súng đen. Ngòi tự cháy khi bạn ném bom.
items.quest.driedrose.desc=Bông hồng đã khô từ lâu nhưng vẫn giữ đủ cánh hoa.
items.quest.phantomfish.desc=Con cá nhỏ trong mờ này rất khó thấy khi ở ngoài không khí. Dưới nước, nó gần như vô hình.
items.tomeofmastery.desc=Cuốn sách mỏng bọc da sờn này dường như chứa nhiều tri thức. Đọc nó sẽ mất chút thời gian.
items.weightstone.desc=Dùng để chỉnh độ cân bằng của vũ khí cận chiến, tăng tốc độ hoặc độ chính xác.
items.wands.wandofamok.desc=Ánh sáng tím khiến mục tiêu điên cuồng, tấn công các sinh vật xung quanh không phân biệt bạn thù.
items.wands.wandofavalanche.desc=Khi trúng tường hoặc vật cản rắn, luồng phép gây đá lở, làm bị thương và choáng các sinh vật trong vùng.
items.wands.wandofflock.desc=Triệu hồi đàn cừu ma thuật tạm thời chắn kín đường đi.
items.wands.wandofpoison.desc=Đầu độc mục tiêu, gây sát thương theo thời gian. Nâng cấp giúp độc kéo dài hơn.
items.wands.wandofreach.desc=Nhặt đồ từ xa và đổi chỗ với kẻ địch. Sóng lực kích hoạt bẫy, giẫm bẹp cỏ và mở hoặc đóng cửa trên đường đi.
items.wands.wandofslowness.desc=Tạm thời giảm một nửa tốc độ di chuyển và tấn công của mục tiêu.
items.wands.wandofteleportation.desc=Dịch chuyển một sinh vật đến vị trí ngẫu nhiên trên tầng này.
items.weapon.melee.dualswords.desc=Hai lưỡi kiếm sắc để ra đòn mạnh hơn.
items.weapon.missiles.cupidarrow.desc=Nghe nói mũi tên này từng thuộc về thần tình yêu. Hãy chọn mục tiêu cẩn thận.
items.weapon.missiles.curaredart.desc=Những phi tiêu này gây ít sát thương nhưng có thể làm mục tiêu tê liệt, không còn khả năng chống đỡ.
items.weapon.missiles.incendiarydart.desc=Đầu nhọn cắm vào mục tiêu trong lúc hỗn hợp buộc trên phi tiêu bốc cháy.
items.weapon.missiles.soulcrystal.desc=Tinh thể có thể bắt giữ linh hồn. Ném vào kẻ địch yếu hoặc đã suy yếu để bắt linh hồn của nó.
items.weapon.missiles.tamahawk.desc=Chiếc rìu ném này không quá nặng, nhưng cần sức mạnh để sử dụng hiệu quả.
network.partytext.weapon_fast=Vũ khí này đánh nhanh.
network.partytext.weapon_slow=Vũ khí này đánh chậm.
network.partytext.weapon_accurate=Vũ khí này chính xác.
network.partytext.weapon_inaccurate=Vũ khí này kém chính xác.
network.partytext.weapon_fast_and_accurate=Vũ khí này đánh nhanh và chính xác.
network.partytext.weapon_fast_but_inaccurate=Vũ khí này đánh nhanh nhưng kém chính xác.
network.partytext.weapon_slow_but_accurate=Vũ khí này đánh chậm nhưng chính xác.
network.partytext.weapon_slow_and_inaccurate=Vũ khí này đánh chậm và kém chính xác.
network.partytext.necroblade_bolt=Từ cấp 5, khi nạp đầy năng lượng, kiếm có thể bắn _Đạn bóng tối_, phá hủy bản thể của mục tiêu và biến nó thành tay sai.
network.partytext.necroblade_intro=Lưỡi kiếm rèn bằng hắc thuật nuốt linh hồn nạn nhân để mạnh lên.
network.partytext.necroblade_energy=Linh hồn tích trữ: _%s/100_
network.partytext.necroblade_damage=Linh hồn tăng thêm _0–%d sát thương_.
network.partytext.necroblade_hungry=Khi tích đầy linh hồn, kiếm có thể tiêu thụ chúng để tự nâng cấp.
network.partytext.necroblade_full=Kiếm không thể tự nâng cấp bằng linh hồn nữa.
