actors.skills.raiseskeletonskill.desc=Alvokas skeleton por batali apud vi.
network.partysession.background=La konekto al la grupo finiĝis, ĉar vi forlasis la ludon.
items.corpse.name=kadavro
items.corpse.desc=Freŝa kadavro uzebla por nekromancio.
items.armorkit.desc=Ĉi tiuj iloj transformas ajnan kirason en eposan kirason. Ĝi konservas siajn ecojn kaj ricevas kapablon laŭ via klaso. Metia lerteco ne necesas.
items.bomb.desc=Malgranda bombo plena de nigra pulvo. Ĝi eksplodas tie, kien ĝi falas.
items.quest.driedrose.desc=La rozo delonge sekiĝis, sed konservis ĉiujn petalojn.\n\nRedonu ĝin al la fantomo.
items.quest.phantomfish.desc=Tiu ĉi malgranda travidebla fiŝo apenaŭ videblas en aero. En akvo ĝi estas preskaŭ nevidebla.\n\nRedonu ĝin al la fantomo.
items.tomeofmastery.desc=Ĉi tiu maldika libro kun eluzita leda kovrilo ŝajnas enhavi multan scion. Legado postulas iom da tempo.\n\nPermesas elekti subklason.
items.weightstone.desc=Per la ŝtono vi povas ekvilibrigi proksimbatalan armilon por plibonigi rapidecon aŭ precizecon.
items.wands.wandofamok.desc=La purpura lumo frenezigas la celon, kiu atakas proksimajn estaĵojn sendistinge.
items.wands.wandofavalanche.desc=Trafinte muron aŭ alian solidan baron, la pafo kaŭzas ŝtonfalon, kiu vundas kaj senmovigas estaĵojn en la areo.
items.wands.wandofflock.desc=Alvokas gregon de magiaj ŝafoj, kiuj provizore baras la vojon.
items.wands.wandofpoison.desc=Venenigas la celon kaj kaŭzas periodan damaĝon. Plibonigoj plilongigas la venenadon.
items.wands.wandofreach.desc=Prenas objektojn de malproksime kaj interŝanĝas lokojn kun malamikoj. La ondo ekigas kaptilojn, tretas herbon kaj malfermas aŭ fermas pordojn survoje.
items.wands.wandofslowness.desc=Provizore duonigas la movan kaj atakan rapidecon de la celo.
items.wands.wandofteleportation.desc=Teletransportas estaĵon al hazarda loko sur la etaĝo.
items.weapon.melee.dualswords.desc=Du akraj klingoj por pli fortaj batoj.
items.weapon.missiles.cupidarrow.desc=Sago laŭdire aparteninta al Kupido. Zorge elektu vian celon.
items.weapon.missiles.curaredart.desc=Ĉi tiuj sagetoj faras malmulte da damaĝo, sed povas paralizi la celon kaj lasi ĝin sendefenda.
items.weapon.missiles.incendiarydart.desc=La pinto fiksiĝas en la celo dum la miksaĵo sur la sageto ekbrulas.
items.weapon.missiles.soulcrystal.desc=Kristalo kapabla kapti animojn. Ĵetu ĝin kontraŭ malforta aŭ malfortigita malamiko por kapti ties spiriton.
items.weapon.missiles.tamahawk.desc=Ĉi tiu ĵethakilo ne tre pezas, sed bezonas forton por efika uzo.
network.partytext.weapon_fast=Ĉi tiu armilo estas rapida.
network.partytext.weapon_slow=Ĉi tiu armilo estas malrapida.
network.partytext.weapon_accurate=Ĉi tiu armilo estas preciza.
network.partytext.weapon_inaccurate=Ĉi tiu armilo estas malpreciza.
network.partytext.weapon_fast_and_accurate=Ĉi tiu armilo estas rapida kaj preciza.
network.partytext.weapon_fast_but_inaccurate=Ĉi tiu armilo estas rapida, sed malpreciza.
network.partytext.weapon_slow_but_accurate=Ĉi tiu armilo estas malrapida, sed preciza.
network.partytext.weapon_slow_and_inaccurate=Ĉi tiu armilo estas malrapida kaj malpreciza.
network.partytext.necroblade_bolt=Je nivelo 5, plene ŝargita klingo povas lanĉi _Malhelan pafon_, kiu povas detrui la esencon de celo kaj igi ĝin servanto.
network.partytext.necroblade_intro=Forĝita per nigra magio, ĉi tiu klingo englutas la animojn de siaj viktimoj kaj plifortiĝas.
network.partytext.necroblade_energy=Konservitaj animoj: _%s/100_
network.partytext.necroblade_damage=La animoj aldonas _0–%d damaĝon_.
network.partytext.necroblade_hungry=La klingo povas konsumi plenan ŝargon da animoj por plifortiĝi.
network.partytext.necroblade_full=La klingo ne plu povas pliboniĝi per konsumado de animoj.
