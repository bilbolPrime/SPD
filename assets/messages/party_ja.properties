actors.skills.raiseskeletonskill.desc=スケルトンを召喚し、あなたの側で戦わせる。
network.partysession.background=ゲームを離れたため、パーティーとの接続が切断されました。
items.corpse.name=死体
items.corpse.desc=まだ新しい死体。死霊術に使える。
items.armorkit.desc=どの鎧でも英雄の鎧に作り替えられる道具一式。元の性能を保ったまま、職業に応じた能力が加わる。職人の技術は必要ない。
items.bomb.desc=黒色火薬を詰めた小さな爆弾。着弾した場所で爆発する。
items.quest.driedrose.desc=とうに枯れた薔薇だが、花びらはすべて残っている。\n\n幽霊に返そう。
items.quest.phantomfish.desc=空中でも見つけにくい、半透明の小魚。水の中ではほとんど見えなくなる。\n\n幽霊に返そう。
items.tomeofmastery.desc=革表紙が擦り切れた薄い本。多くの知識が詰まっていそうだが、読むには少し時間がかかる。\n\nサブクラスを選べる。
items.weightstone.desc=近接武器の重心を調整し、攻撃速度か命中精度を高められる。
items.wands.wandofamok.desc=紫の光が対象を狂乱させる。対象は周囲の生き物を無差別に攻撃する。
items.wands.wandofavalanche.desc=壁などの硬い障害物に当たると落石を起こし、範囲内の生き物を傷つけて気絶させる。
items.wands.wandofflock.desc=魔法の羊の群れを呼び出し、しばらくの間通路を塞ぐ。
items.wands.wandofpoison.desc=対象を毒に侵し、継続的にダメージを与える。杖を強化すると毒が長く続く。
items.wands.wandofreach.desc=離れた物を引き寄せ、敵と位置を入れ替えられる。力の波は通り道の罠を作動させ、草を踏み倒し、扉の開閉を逆にする。
items.wands.wandofslowness.desc=対象の移動と攻撃の速度を、しばらく半分にする。
items.wands.wandofteleportation.desc=生き物を同じ階のどこかへ転移させる。
items.weapon.melee.dualswords.desc=二本の鋭い刃で力強く斬りつける。
items.weapon.missiles.cupidarrow.desc=恋の神が使っていたという矢。誰に向けるかはよく考えよう。
items.weapon.missiles.curaredart.desc=威力は低いが、対象を麻痺させて無防備にできる小さなダーツ。
items.weapon.missiles.incendiarydart.desc=先端が対象に刺さると、巻きつけられた薬剤が燃え上がる。
items.weapon.missiles.soulcrystal.desc=魂を捕らえられる水晶。弱い敵や弱らせた敵に投げつけると、その魂を閉じ込められる。
items.weapon.missiles.tamahawk.desc=さほど重くない投げ斧だが、扱いには相応の力が要る。
network.partytext.weapon_fast=この武器は攻撃が速い。
network.partytext.weapon_slow=この武器は攻撃が遅い。
network.partytext.weapon_accurate=この武器は命中精度が高い。
network.partytext.weapon_inaccurate=この武器は命中精度が低い。
network.partytext.weapon_fast_and_accurate=この武器は攻撃が速く、命中精度も高い。
network.partytext.weapon_fast_but_inaccurate=この武器は攻撃が速いが、命中精度が低い。
network.partytext.weapon_slow_but_accurate=この武器は攻撃が遅いが、命中精度が高い。
network.partytext.weapon_slow_and_inaccurate=この武器は攻撃が遅く、命中精度も低い。
network.partytext.necroblade_bolt=レベル5から、力を満たした剣で_闇の魔弾_を放てる。対象の本質を砕き、しもべに変えることがある。
network.partytext.necroblade_intro=闇の魔法で鍛えられた剣。倒した相手の魂を食らうほど強くなる。
network.partytext.necroblade_energy=蓄えた魂：_%s/100_
network.partytext.necroblade_damage=蓄えた魂でダメージが_0～%d増加_する。
network.partytext.necroblade_hungry=満タンの魂を消費すると、剣を強化できる。
network.partytext.necroblade_full=魂を消費して剣を強化することはもうできない。
