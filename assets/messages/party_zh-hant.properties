actors.skills.raiseskeletonskill.desc=召喚一具骷髏在你身邊作戰。
network.partysession.background=你已離開遊戲，隊伍連線已中斷。
items.corpse.name=屍體
items.corpse.desc=一具新鮮的屍體，可以用於死靈術。
items.armorkit.desc=這套工具能把任何護甲改造成英雄護甲。原有屬性不變，並獲得適合你職業的特殊能力。無須掌握工匠技藝。
items.bomb.desc=一顆裝滿黑火藥的小炸彈。投出時引線便會點燃。
items.quest.driedrose.desc=玫瑰早已乾枯，花瓣卻一片也沒掉。
items.quest.phantomfish.desc=這條半透明的小魚在空氣中就很難看清，到了水裡幾乎完全隱形。
items.tomeofmastery.desc=這本皮面磨損的薄書似乎藏著不少知識。讀完它需要一點時間。
items.weightstone.desc=可以調整近戰武器的重心，提升攻擊速度或精準度。
items.wands.wandofamok.desc=紫光使目標陷入狂亂，不分敵我地攻擊周圍生物。
items.wands.wandofavalanche.desc=擊中牆壁或其他堅固障礙物時，會引發落石，傷害並擊暈範圍內的生物。
items.wands.wandofflock.desc=召喚一群魔法綿羊，暫時堵住通路。
items.wands.wandofpoison.desc=使目標中毒，持續受到傷害。升級魔杖可以延長中毒時間。
items.wands.wandofreach.desc=能隔空拾取物品，並與敵人交換位置。衝擊波會觸發沿途陷阱、壓倒高草，並打開關著的門、關上開著的門。
items.wands.wandofslowness.desc=暫時將目標的移動和攻擊速度減半。
items.wands.wandofteleportation.desc=將一個生物傳送到目前樓層的隨機位置。
items.weapon.melee.dualswords.desc=兩把鋒利的劍，帶來更有力的斬擊。
items.weapon.missiles.cupidarrow.desc=據說這支箭曾屬於愛神。可要想好再選目標。
items.weapon.missiles.curaredart.desc=這些小飛鏢傷害不高，但能麻痺目標，使其無法反抗。
items.weapon.missiles.incendiarydart.desc=鏢尖扎進目標時，綁在鏢身上的藥劑便會燃燒起來。
items.weapon.missiles.soulcrystal.desc=能捕獲靈魂的水晶。向弱小或虛弱的敵人投出，便可囚禁它的靈魂。
items.weapon.missiles.tamahawk.desc=這把投擲斧不算沉重，但仍需要足夠的力量才能用好。
network.partytext.weapon_fast=這件武器攻擊較快。
network.partytext.weapon_slow=這件武器攻擊較慢。
network.partytext.weapon_accurate=這件武器精準度較高。
network.partytext.weapon_inaccurate=這件武器精準度較低。
network.partytext.weapon_fast_and_accurate=這件武器攻擊較快，精準度也較高。
network.partytext.weapon_fast_but_inaccurate=這件武器攻擊較快，但精準度較低。
network.partytext.weapon_slow_but_accurate=這件武器攻擊較慢，但精準度較高。
network.partytext.weapon_slow_and_inaccurate=這件武器攻擊較慢，精準度也較低。
network.partytext.necroblade_bolt=達到5級且能量蓄滿時，可使用_暗影彈_，有機會粉碎目標的本質並將其變為僕從。
network.partytext.necroblade_intro=用黑暗魔法鍛造的利刃，會吞噬被它殺死的生物的靈魂，逐漸變強。
network.partytext.necroblade_energy=儲存的靈魂：_%s/100_
network.partytext.necroblade_damage=靈魂提供_0～%d額外傷害_。
network.partytext.necroblade_hungry=蓄滿靈魂後，可以消耗它們來強化刀刃。
network.partytext.necroblade_full=刀刃已無法再透過消耗靈魂來強化。
