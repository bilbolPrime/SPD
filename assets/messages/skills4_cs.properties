skills4.subclass.gladiator=Úspěšné zásahy na blízko vytvářejí kombo a přidávají poškození k pozdějším zásahům.\n\n_+3 přesnost na blízko_\n_10 % rychlejší útoky na blízko_
skills4.subclass.berserker=Pod 40% zdraví zvyšuje zuřivost poškození o 50%.\n\n_O 10% vyšší poškození zblízka_\n_O 10% nižší utrpěné poškození_
skills4.subclass.battlemage=Zásahy hůlkou nablízko obnoví jeden náboj a přidají počet jejích nábojů k poškození.\n\n_Jiskra má 50% šanci oslepit cíl na 3 tahy._
skills4.subclass.warlock=Zabíjení nepřátel obnovuje zdraví a uspokojuje hlad.\n\n_Jiskra způsobí 5 poškození navíc._\n_Jedna vyvolaná bytost navíc._
skills4.subclass.freerunner=Bez příliš těžké výbavy a dokud nehladovíš se pohybuješ o 60% rychleji. Při pohybu se tvé uhýbání zdvojnásobí.
skills4.subclass.assassin=Překvapivé útoky způsobují vyšší poškození.\n\n_+1 nenápadnost_
skills4.subclass.warden=Pošlapání vysoké trávy udělí Kůru. Rostliny mohou vydat další semena a rosu.
skills4.subclass.sniper=Útoky na dálku ignorují zbroj a označí cíl pro rychlejší následující útok.\n\n_O 20% vyšší poškození na dálku_
skills4.subclass.spirit_binder=Zásahy hůlkou zblízka obnoví jeden náboj a přidají počet nábojů k poškození.\n\n_Oživení kostlivci vydrží dvakrát déle._
skills4.subclass.lich=Zabití nepřítele obnoví zdraví a utiší hlad.\n\n_Oživení kostlivci a kostliví lučištníci mají o 25% více zdraví a způsobují o 25% více poškození._\n_Jedna vyvolaná bytost navíc._
skills4.subclass.marshal=Zásahy zblízka vytvářejí kombo.\n\n_+5 nábojů v zásobníku_\n_+1 přesnost palných zbraní_
skills4.subclass.executioner=Pod 40% zdraví zvyšuje zuřivost poškození o 50% a zrychluje střelbu o 50%.\n\n_O 25% rychlejší přebíjení_
