skills4.smash.intro=Zasáhne sousedního nepřítele hrubou silou.
skills4.endurance.intro=Zvyšuje vaše maximální zdraví.
skills4.firm_hand.intro=Zlepší vaši přesnost v boji na blízko.
skills4.regeneration.intro=Postupně obnovuje další zdraví. Při hladovění neúčinkuje.
skills4.toughness.intro=Snižuje příchozí poškození, kromě hladovění.
skills4.knockback.intro=Udeří nepřítele a odstrčí ho o jedno pole. Bossy nelze odstrčit.
skills4.second_wind.intro=Okamžitě obnoví určité zdraví.
skills4.sure_footing.intro=Zkracuje trvání zakořenění a zmrzačení.
skills4.mastery.intro=Umožňuje používat těžší zbraně pro boj zblízka a útočit rychleji.
skills4.parry.intro=Snižuje poškození z příštího zásahu zblízka, který utrpíš. Ochrana trvá nejvýše čtyři tahy.
skills4.smite.intro=Zasadí těžký úder, který ignoruje polovinu zbroje cíle. Zabere dva tahy.
skills4.riposte.intro=Po zablokování posílí váš další zásah zblízka. Vydrží čtyři tahy.
skills4.footwork.intro=Poskytuje vám více času mezi zásahy na blízko k udržení kombinace.
skills4.duelist.intro=Zvyšuje únik, zatímco právě jeden nepřítel stojí vedle vás.
skills4.disarming_strike.intro=Zaútočí na nepřítele a oslabí ho na tři kola.
skills4.find_the_gap.intro=Třetí zásah zblízka v řadě a každý další pronikne částí zbroje cíle.
skills4.aggression.intro=Vaše poškození při boji na blízko se zvyšuje, když ztrácíte zdraví.
skills4.charge.intro=Vyrazí k nepříteli vzdálenému nejvýše čtyři políčka a udeří ho. Cesta musí být volná.
skills4.rampage.intro=Zaútočí na každého sousedního nepřítele.
skills4.bloodlust.intro=Zrychluje útoky zblízka na tři kola po zabití.
skills4.war_cry.intro=Oslabí viditelné nepřátele v rámci dvou dlaždic.
skills4.rend.intro=Výpad a Řádění způsobují přeživším nepřátelům krvácení.
skills4.relentless.intro=Zabití nepřítele zkrátí zbývající dobu obnovy Výpadu a Válečného pokřiku.
skills4.cornered.intro=Snižuje poškození při boji zblízka, když vás obklopí dva nebo více nepřátel.

skills4.spark.intro=Vystřelí jiskru na viditelného nepřítele.
skills4.spirituality.intro=Zvyšuje vaši maximální manu.
skills4.sorcerer.intro=Vaše hůlky způsobí větší poškození.
skills4.summon_rat.intro=Vyvolá krysu, která za tebe bojuje.
skills4.meditation.intro=Obnovte přebytečnou manu v průběhu času.
skills4.spirit_armor.intro=Absorbuje poškození pomocí jedné many za každý absorbovaný bod.
skills4.wizard.intro=Vaše hůlky se rychleji dobíjejí.
skills4.channeling.intro=Zkracuje čekání mezi použitím aktivních dovedností, nejméně však na jedno kolo.
skills4.charged_staff.intro=Hůlkové zásahy na blízko obnoví manu.
skills4.arcane_ward.intro=Snižuje poškození z příštího zásahu zblízka, který utrpíš. Ochrana trvá nejvýše čtyři tahy.
skills4.arcane_strike.intro=Zasadí magickou ránu, která ignoruje polovinu brnění cíle.
skills4.conductive.intro=Uložené náboje zesilují údery hůlkou zblízka. Každý úspěšný zásah spotřebuje jeden náboj místo dobíjení hůlky.
skills4.discharge.intro=Poškodí všechny sousední nepřátele výbuchem magie.
skills4.spellweave.intro=Zvyšuje poškození hůlkou na tři otočky po přistání při zásahu zblízka.
skills4.drain_life.intro=Poškodí nepřítele a vyléčí vás o polovinu zdraví, o které přijde.
skills4.rabid_minions.intro=Vaše vyvolané bytosti způsobí větší poškození.
skills4.summon_skeleton.intro=Vyvolá kostlivce, který za tebe bojuje.
skills4.soul_hunger.intro=Obnovuje manu, když zabijete nepřítele.
skills4.enrage.intro=Dokud je schopnost zapnutá, vyvolaní tvorové způsobují i utrpí větší poškození.
skills4.slow.intro=Zpomalí pohyb a útoky nepřítele.
skills4.summoner.intro=Můžete si ponechat ještě jednu vyvolanou bytost.
skills4.dark_pact.intro=Obětuje pět zdraví, aby obnovil manu. Vyžaduje alespoň šest zdraví.

skills4.double_strike.intro=Úder dvakrát rychle za sebou.
skills4.stealth.intro=Pro nepřátele je těžší si vás všimnout.
skills4.evasion.intro=Zlepšuje vaši šanci vyhnout se útokům.
skills4.smoke_bomb.intro=Zmizet v oblaku kouře. Útok přeruší účinek.
skills4.bandit.intro=Najděte extra zlato v každé hromádce, kterou nasbíráte.
skills4.venom.intro=Dokud je schopnost zapnutá, zásahy zblízka mohou otrávit cíl.
skills4.locksmith.intro=Máte šanci odzbrojit past, když na ni šlápnete.
skills4.light_step.intro=Zkracuje trvání zakořenění a zmrzačení.
skills4.dash.intro=Přesune až o dvě dlaždice po volné cestě.
skills4.haste.intro=Zvyšuje rychlost vašeho pohybu o pět tahů.
skills4.shadow_clone.intro=Vytvořte jeden silný klon nebo tři slabší klony, které za vás budou bojovat.
skills4.escape.intro=Zbaví tě zakořenění a zmrzačení a na čtyři tahy zvýší úhyb.
skills4.trailblazer.intro=Zvyšuje rychlost vašeho pohybu.
skills4.skirmish.intro=Pohyb posílí váš další útok na blízko.
skills4.keep_distance.intro=Zvyšuje únik proti nepřátelům na více než jeden dílek.
skills4.ambush.intro=Zvyšuje poškození při boji zblízka, zatímco je neviditelný.
skills4.scorpion.intro=Váš jed způsobí větší poškození.
skills4.silent_death.intro=Útoky na blízko mohou spící nepřátele přímo zabít. Šéfové jsou imunní.
skills4.expose.intro=Tvoje zásahy zblízka ignorují část zbroje.
skills4.execution.intro=Zvyšuje poškození proti nepřátelům pod jednu čtvrtinu zdraví.
skills4.deadly_throw.intro=Zvyšuje poškození zbraně na dálku.

skills4.accuracy.intro=Vaše útoky na dálku jsou přesnější.
skills4.awareness.intro=Máte šanci vyhnout se příchozímu útoku na dálku.
skills4.double_shot.intro=Vystřelí dva šípy za sebou. Spotřebuje dva obyčejné šípy.
skills4.hunting.intro=Při průzkumu najde syrové maso.
skills4.fletching.intro=Při průzkumu vyrábí obyčejné šípy.
skills4.ko_arrow.intro=Váš další šíp zpomalí svůj cíl a může ho uspat.
skills4.woodcraft.intro=Pro nepřátele je těžší si vás všimnout.
skills4.quickdraw.intro=Zrychlí vaše útoky na dálku.
skills4.barkskin.intro=Zvyšuje vaše brnění.
skills4.nature_mend.intro=Okamžitě obnoví určité zdraví.
skills4.entangle.intro=Zakoření viditelného nepřítele na místě.
skills4.herbalist.intro=Snižuje poškození jedem.
skills4.dew_keeper.intro=Zvyšuje hojení přijaté z rosy.
skills4.knee_shot.intro=Vaše šípy mohou ochromit jejich cíl.
skills4.thicket.intro=Snižuje poškození z příštího zásahu zblízka, který utrpíš. Ochrana trvá nejvýše čtyři tahy.
skills4.aimed_shot.intro=Zvyšuje poškození vašeho dalšího zásahu šípem.
skills4.long_sight.intro=Zvyšuje poškození na dálku proti nepřátelům vzdáleným alespoň čtyři dílky.
skills4.piercing_shot.intro=Tvůj příští šíp ignoruje část zbroje cíle.
skills4.iron_tip.intro=Železné hroty umožňují šípům projít nepřáteli a zasáhnout ty za nimi. Zdi a spojenci zastaví šíp.
skills4.mark_prey.intro=Označí nepřítele na šest tahů a zvýší vaše poškození proti němu.
skills4.bombvoyage.intro=Proměňte šíp v bombu. Výbuch může také zranit vás a vaše spojence.
skills4.follow_through.intro=Zabití posílí váš další zásah na dálku na čtyři tahy.

skills4.curse.intro=Oslabete útoky nepřítele na deset kol.
skills4.necro_spirit.intro=Zvyšuje vaši maximální manu.
skills4.raise_skeleton.intro=Oživí kostlivce z mrtvoly na zemi.
skills4.summon_ghost.intro=Zavolejte ducha, aby za vás bojoval.
skills4.soul_bind.intro=Zvyšuje poškození vyvolaných tvorů.
skills4.necro_meditation.intro=Obnovte přebytečnou manu v průběhu času.
skills4.necro_drain_life.intro=Vyčerpejte zdraví nepřítele a obnovte polovinu způsobeného poškození.
skills4.master_of_death.intro=Oživí tě s plným zdravím a manou. Před dalším oživením se musí schopnost obnovit.
skills4.spirit_army.intro=Dovoluje udržovat ještě jednoho vyvolaného tvora.
skills4.mend_bones.intro=Léčí vyvolané tvory v dohledu.
skills4.guardian_bond.intro=Snižuje poškození, které vyvolaní tvorové utrpí.
skills4.corpse_explosion.intro=Odpálit mrtvolu. Výbuch zasáhne všechny vedle, včetně vás a vašich spojenců.
skills4.raise_skeleton_archer.intro=Oživí kostlivého lučištníka z mrtvoly na zemi.
skills4.last_rites.intro=Každý vyvolaný tvor dostane jednu šanci přežít smrtelný zásah se čtvrtinou zdraví.
skills4.soul_shelter.intro=Snižuje poškození z příštího zásahu zblízka, který utrpíš. Ochrana trvá nejvýše čtyři tahy.
skills4.cold_touch.intro=Zaútočí na nepřítele a zpomalí ho na tři tahy.
skills4.necro_slow.intro=Zpomalí pohyb a útoky nepřítele.
skills4.bone_spear.intro=Vystřelí na nepřítele střelu záhrobní magie.
skills4.death_fed.intro=Obnovuje manu, když zabijete nepřítele.
skills4.cruel_study.intro=Zvyšuje poškození způsobené hůlkami.
skills4.withering_wave.intro=Poškodí sousední nepřátele chladem a zpomalí je na tři kola.

skills4.steady_aim.intro=Vaše střelba je přesnější.
skills4.packrat.intro=Zvyšuje kapacitu zásobníku střelné zbraně.
skills4.fast_reload.intro=Urychluje přebíjení střelné zbraně.
skills4.quick_draw.intro=Střílejte rychleji.
skills4.veteran_company.intro=Najatí žoldáci pod vaším velením způsobují větší poškození.
skills4.field_medicine.intro=Okamžitě obnoví určité zdraví.
skills4.powder.intro=Zvyšuje poškození střelné zbraně.
skills4.steady_nerves.intro=Zkracuje trvání zakořenění a zmrzačení.
skills4.volley.intro=Vystřelte silnější střelu.
skills4.rally.intro=Uzdraví vás a vaše spojence během dvou dlaždic.
skills4.guard_order.intro=Najatí žoldáci pod vaším velením utrpí menší poškození.
skills4.suppress.intro=Váš další zásah střelnou zbraní oslabí jeho cíl.
skills4.counter_fire.intro=Poškození z blízka posílí váš další zásah střelnou zbraní na čtyři kola.
skills4.i_am_the_law.intro=Dočasně zvyšte své maximální a aktuální zdraví na dvacet kol.
skills4.headshot.intro=Váš další výstřel způsobí větší poškození a získá přesnost.
skills4.intimidate.intro=Vyděsí viditelného nepřítele. Šéfové jsou imunní.
skills4.wanted.intro=Za každého zabitého nepřítele získáš zlato.
skills4.no_witnesses.intro=Váš další výstřel způsobí větší poškození a pošle přeživší nepřátele na útěk.
skills4.armor_piercer.intro=Vaše zásahy na dálku ignorují některé brnění.
skills4.execute.intro=Výstřely dorazí těžce zraněné nepřátele. Na bosse neúčinkuje.
skills4.final_notice.intro=Váš další zásah střelnou zbraní ignoruje další brnění.

