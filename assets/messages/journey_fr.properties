journey.title=Expédition
journey.intro=Yog s'est emparé de l'Amulette et ses forces gagnent déjà la surface.\n\nMenez six héros à travers les terres occupées. Choisissez un itinéraire et un héros pour chaque sortie. Ceux qui tombent ne reviendront pas.
