actors.skills.raiseskeletonskill.desc=Invoca um esqueleto para lutar ao seu lado.
network.partysession.background=A ligação ao grupo foi interrompida porque saíste do jogo.
items.corpse.name=cadáver
items.corpse.desc=Um cadáver recente que pode ser usado em necromancia.
items.armorkit.desc=Estas ferramentas transformam qualquer armadura numa armadura épica. Ela mantém as propriedades e ganha uma habilidade da sua classe. Não é preciso saber trabalhar couro ou metal.
items.bomb.desc=Uma pequena bomba de pólvora negra. O rastilho acende-se ao lançá-la.
items.quest.driedrose.desc=A rosa secou há muito tempo, mas manteve todas as pétalas.
items.quest.phantomfish.desc=Este pequeno peixe translúcido mal se vê fora de água. Dentro dela, fica quase invisível.
items.tomeofmastery.desc=Este livro de couro gasto é fino, mas parece guardar muito conhecimento. A leitura demora algum tempo.
items.weightstone.desc=Permite equilibrar uma arma corpo a corpo para melhorar a velocidade ou a precisão.
items.wands.wandofamok.desc=A luz violeta enlouquece o alvo, que ataca criaturas próximas sem distinguir aliados de inimigos.
items.wands.wandofavalanche.desc=Ao atingir uma parede ou outro obstáculo sólido, provoca uma derrocada que fere e atordoa as criaturas na área.
items.wands.wandofflock.desc=Invoca um rebanho de ovelhas mágicas que bloqueia a passagem por algum tempo.
items.wands.wandofpoison.desc=Envenena o alvo, causando dano periódico. Melhorar a varinha prolonga o veneno.
items.wands.wandofreach.desc=Recolhe objetos à distância e troca de lugar com inimigos. A onda ativa armadilhas, esmaga erva e abre ou fecha portas pelo caminho.
items.wands.wandofslowness.desc=Reduz para metade a velocidade de movimento e ataque do alvo durante algum tempo.
items.wands.wandofteleportation.desc=Teletransporta uma criatura para um lugar aleatório do andar.
items.weapon.melee.dualswords.desc=Duas lâminas afiadas para golpes mais fortes.
items.weapon.missiles.cupidarrow.desc=Dizem que esta flecha pertenceu a Cupido. Escolha bem o alvo.
items.weapon.missiles.curaredart.desc=Estes dardos causam pouco dano, mas podem paralisar o alvo e deixá-lo indefeso.
items.weapon.missiles.incendiarydart.desc=A ponta prende-se no alvo enquanto a mistura presa ao dardo se incendeia.
items.weapon.missiles.soulcrystal.desc=Um cristal capaz de prender almas. Lance-o a um inimigo fraco ou enfraquecido para capturar o seu espírito.
items.weapon.missiles.tamahawk.desc=Este machado de arremesso não pesa muito, mas exige força para ser usado bem.
network.partytext.weapon_fast=Esta arma é rápida.
network.partytext.weapon_slow=Esta arma é lenta.
network.partytext.weapon_accurate=Esta arma é precisa.
network.partytext.weapon_inaccurate=Esta arma é pouco precisa.
network.partytext.weapon_fast_and_accurate=Esta arma é rápida e precisa.
network.partytext.weapon_fast_but_inaccurate=Esta arma é rápida, mas pouco precisa.
network.partytext.weapon_slow_but_accurate=Esta arma é lenta, mas precisa.
network.partytext.weapon_slow_and_inaccurate=Esta arma é lenta e pouco precisa.
network.partytext.necroblade_bolt=No nível 5, a lâmina totalmente carregada pode lançar _Projétil sombrio_, capaz de destruir a essência de um alvo e transformá-lo em servo.
network.partytext.necroblade_intro=Forjada com magia negra, esta lâmina devora as almas das vítimas e fica mais forte.
network.partytext.necroblade_energy=Almas guardadas: _%s/100_
network.partytext.necroblade_damage=As almas acrescentam _0–%d de dano_.
network.partytext.necroblade_hungry=A lâmina pode consumir uma carga completa de almas para ficar mais forte.
network.partytext.necroblade_full=A lâmina já não se pode melhorar consumindo almas.
