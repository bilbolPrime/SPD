actors.mobs.rebornboss.opening=Blottad!
actors.mobs.rebornboss.interrupted=%s tappar koncentrationen!
actors.mobs.reborngoo.desc=Man vet inte mycket om Goo. Kanske är det inte ens en varelse, utan en ansamling av ämnen från kloakerna som har fått ett slags egen vilja.
actors.mobs.reborngoo.warning=Goo sväller. Ur vägen!
actors.mobs.reborndm300.desc=Den här maskinen byggdes av dvärgarna för flera hundra år sedan. Senare började de ersätta maskiner med golemar, elementarväsen och till och med demoner. Till slut ledde det till deras civilisations förfall. DM-300 och liknande maskiner användes främst till byggarbete och gruvdrift, men ibland även till att försvara staden.
actors.mobs.reborndm300.repair=DM-300 reparerar sig!
actors.mobs.reborndm300.warning=Motorn tjuter. Lämna de markerade rutorna!
actors.mobs.rebornking.desc=Dvärgarnas siste kung var känd för sin djupa kunskap om liv och död. Han övertalade sitt hov att delta i en ritual som skulle ge dem evig ungdom. Till slut var han den ende som fick den – och en armé av odöda på köpet.
actors.mobs.rebornking.warning=Kungen höjer handen!
actors.mobs.rebornking.herald_fell=Håll ställningarna, ynkryggar!
actors.mobs.rebornking$retainer.name_0=Kunglig vakt
actors.mobs.rebornking$retainer.desc_0=En död dvärg i bucklig rustning. Han vaktar fortfarande sin kung.
actors.mobs.rebornking$retainer.name_1=Hovmagiker
actors.mobs.rebornking$retainer.desc_1=En hovmagiker som väckts från de döda. Mörk magi samlas i hans händer.
actors.mobs.rebornking$retainer.name_2=Kunglig härold
actors.mobs.rebornking$retainer.desc_2=Trots sin brutna käke skäller härolden fortfarande ut Kungens order. De döda lyder.
actors.mobs.rebornking$retainer.name_3=Odöd bågskytt
actors.mobs.rebornking$retainer.desc_3=Den här dvärgen begravdes med sin båge. Han har inte glömt hur man använder den.
actors.mobs.rebornyog.desc=Yog-Dzewa är en gammal gud, en mäktig varelse från kaosets rike. För ett sekel sedan vann de forntida dvärgarna nätt och jämnt kriget mot deras demoner, men de kunde inte döda själva guden. Istället fängslade de den i hallarna nedanför sin stad, i tron att den var för svag för att någonsin resa sig igen.
actors.mobs.rebornyog.warning=Luften rämnar. Lämna de flimrande märkena!
actors.mobs.rebornyog.inherit_rot=Köttet vissnar. Jag består.
actors.mobs.rebornyog.inherit_fire=Lågan är min nu.
actors.mobs.rebornyog$rotting.desc=En väldig näve av ruttnande kött. Illaluktande slem sipprar mellan fingrarna och fläckar stenen under den.
actors.mobs.rebornyog$rotting.warning=Den ruttnande näven tar sats!
actors.mobs.rebornyog$burninghand.desc=En stor näve omsluten av eld. Fingrarna knastrar när de knyts och strör glöd över golvet.
actors.mobs.rebornyog$burninghand.warning=Glöd samlas framför den brinnande näven!
actors.mobs.reborntengu.shadow_broken=Min skugga…!
