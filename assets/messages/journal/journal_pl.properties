journal.document.adventurers_guide.alchemy.body=Jeśli jakiś przedmiot jednorazowego użytku okaże się nieprzydatny, możesz go użyć jako składnika alchemicznego lub przekształcić w uniwersalną energię alchemiczną. Eliksiry energetyczne i zwoje również je identyfikują! \n\nDrobiazgi to unikalny rodzaj wyposażenia, który powstaje i jest ulepszany za pomocą alchemii. Powstają z magicznego katalizatora w postaci drobiazgu i odrobiny energii alchemicznej. \n\n (Pierwszy garnek alchemiczny znajduje się na 3. lub 4. piętrze lochu. Obok tych garnków znajdują się również strony z alchemicznej księgi receptur).
journal.document.adventurers_guide.alchemy.title=Alchemia i drobiazgi
journal.document.adventurers_guide.dieing.body=Wędrówki po lochach są niebezpieczne i większość poszukiwaczy przygód prędzej czy później ginie. \n\n Szczęście pomaga, ale najlepsi poszukiwacze przygód wykorzystują każdą małą sztuczkę, aby zwiększyć swoje szanse. \n\n (Nie przejmuj się, jeśli często giniesz – ta gra jest trudna! Skup się na nauce gry i stałym doskonaleniu umiejętności, a nie na natychmiastowym wygrywaniu.)
journal.document.adventurers_guide.dieing.title=Radzenie sobie z porażką
journal.document.adventurers_guide.examining.body=Ważne jest, aby badać wrogów i otoczenie, zamiast rzucać się na oślep! Wyrób sobie nawyk badania wszystkiego, co nowe.\n\n (Możesz badać, używając przycisku lupy, a następnie wybierając, co chcesz zbadać. Możesz również badać wzmocnienia lub osłabienia, wybierając ich ikony).
journal.document.adventurers_guide.examining.title=Badanie
journal.document.adventurers_guide.food.body=Skuteczne racjonowanie to jeden z najlepszych sposobów na zwiększenie szans na przeżycie. Nie zawsze musisz jeść natychmiast, gdy poczujesz głód!\n\nKiedy nie głodujesz, twoje zdrowie powoli się regeneruje, więc jeśli jesz, mając pełne zdrowie, ta regeneracja pójdzie na marne!\n\nJeśli będziesz jeść w miarę swojego zdrowia, twoje jedzenie wystarczy ci na znacznie dłużej.
journal.document.adventurers_guide.food.title=Radzenie sobie z głodem
journal.document.adventurers_guide.identifying.body=Kolory mikstur i symbole na zwojach różnią się w każdym lochu. Niezidentyfikowany ekwipunek można ulepszyć lub zaczarować, jeśli masz szczęście, albo może być przeklęty! \n\n Zwoje identyfikacji, ulepszenia lub usunięcia klątwy są bardzo przydatne, jeśli chcesz zmniejszyć ryzyko użycia niezidentyfikowanego ekwipunku. \n\n (Listę wszystkich zidentyfikowanych przedmiotów znajdziesz w zakładce katalogu w dzienniku).
journal.document.adventurers_guide.identifying.title=Identyfikacja przedmiotów
journal.document.adventurers_guide.intro.body=Witaj, Poszukiwaczu Przygód, czytasz Księgę Mistrzostwa Lochów! Ten przewodnik najlepiej wykorzystać jako źródło informacji, a magicznie podpowie Ci, kiedy najlepiej przeczytać każdą stronę. \n\n (Gdy przycisk dziennika zacznie migać, wybierz go, aby przeczytać to, co ma Ci do powiedzenia przewodnik! Brakuje jednak kilku stron, może znajdziesz je w lochach?)
journal.document.adventurers_guide.intro.title=Wstęp
journal.document.adventurers_guide.levelling.body=Awansowanie zwiększa statystyki i zapewnia punkty talentów, co może mieć duże znaczenie w walce. Najlepiej mieć co najmniej jeden poziom na każdym piętrze lochu.\n\nMoże kusić pośpiech i unikanie eksploracji lub walki, ale w ten sposób pozbawisz się zapasów i doświadczenia.\n\n (Informacje o bohaterze, w tym o doświadczeniu, można zobaczyć w panelu statusu w rogu interfejsu gry. Wybierz portret bohatera, aby uzyskać jeszcze więcej informacji).
journal.document.adventurers_guide.levelling.title=Zdobywanie doświadczenia
journal.document.adventurers_guide.looting.body=Pomieszczenia za zamkniętymi drzwiami lub z przeszkodami zazwyczaj oferują lepszy łup. Gdy przeszkoda blokuje ci drogę, zazwyczaj możesz znaleźć przedmiot, który ci pomoże, na tym samym piętrze.\n\nW każdym pięciopiętrowym regionie lochów zawsze znajdziesz 2 mikstury siły i 3 zwoje ulepszeń, więc są one świetnym wskaźnikiem twoich postępów w eksploracji.\n\n (Listę punktów orientacyjnych i nieużywanych kluczy znajdziesz w zakładce notatek w oknie dziennika).
journal.document.adventurers_guide.looting.title=Skuteczne grabieże
journal.document.adventurers_guide.magic.body=Magiczne ataki przebijają zbroję i trudno ich uniknąć. Oznacza to, że obrażenia zadawane różdżkami są bardzo skuteczne, ale jednocześnie sprawiają, że magiczni przeciwnicy są bardzo niebezpieczni! \n\nMagiczne ataki zawsze mają jednak swoją wadę. Różdżki mają ograniczoną liczbę ładunków, a magiczni przeciwnicy zazwyczaj nie będą mogli używać magii z bliskiej odległości. \n\nW starciu z przeciwnikami posługującymi się magią ważne jest, aby nauczyć się, jak uniemożliwić im użycie jej przeciwko tobie.
journal.document.adventurers_guide.magic.title=Magiczne ataki
journal.document.adventurers_guide.positioning.body=Strategia jest równie ważna jak ekwipunek. Złych sytuacji, takich jak okrążenie, zazwyczaj można uniknąć dzięki dobremu pozycjonowaniu.\n\nNa przykład, większość lochów ma wąskie korytarze, które zmuszają wrogów do walki pojedynczo. Te korytarze często zawierają również przejścia do ataków z zaskoczenia!\n\nIstnieje wiele drobnych sposobów na wykorzystanie elementów otoczenia, takich jak trawa, woda, doły czy pułapki, na swoją korzyść.
journal.document.adventurers_guide.positioning.title=Pozycjonowanie
journal.document.adventurers_guide.searching.body=Lochy są pełne sekretnych drzwi i pułapek, które na pierwszy rzut oka wydają się niewidoczne. Możesz poświęcić trochę czasu i dokładnie przeszukać, jeśli podejrzewasz, że w pobliżu ukryte są drzwi lub pułapka.\n\n (Możesz przeszukać wszystkie pola wokół siebie, dwukrotnie klikając przycisk lupy. Być może w pobliżu miejsca, w którym znalazłeś tę stronę, znajdują się jakieś ukryte drzwi!)
journal.document.adventurers_guide.searching.title=Badawczy
journal.document.adventurers_guide.strength.body=Nie ma czasu na trening z bronią i zbroją, które znajdziesz w lochach, więc będziesz potrzebować brutalnej siły, aby skutecznie ich używać.\n\nMikstury siły i zwoje ulepszeń to najlepszy sposób na spełnienie wymagań siły dla sprzętu wyższej klasy.\n\nWażne jest, aby z czasem zacząć używać przedmiotów wyższej klasy, ale nie ignoruj sprzętu, którego możesz używać już teraz.
journal.document.adventurers_guide.strength.title=Wytrzymałość
journal.document.adventurers_guide.surprise_attacks.body=Ataki z zaskoczenia z pewnością trafią, co czyni je szczególnie przydatnymi w walce z nieuchwytnymi wrogami, takimi jak węże i widma.\n\nMożesz zaskakiwać wrogów zaraz po tym, jak wejdą w drzwi podczas pościgu lub gdy stracą cię z oczu.
journal.document.adventurers_guide.surprise_attacks.title=Ataki z zaskoczenia
journal.document.adventurers_guide.title=tom mistrzostwa lochów
journal.document.adventurers_guide.upgrades.body=Im głębiej zagłębiasz się w lochy, tym ważniejsze jest używanie magicznie ulepszonego ekwipunku wysokiego poziomu, ale będziesz też potrzebować siły, aby używać go prawidłowo.\n\nRóżdże, pierścienie i artefakty nie wymagają siły, ale mają ograniczone zastosowanie lub nie pomagają tak bezpośrednio w walce.\n\nDokonywanie dobrych wyborów przy wyborze ulepszeń jest bardzo ważne, aby przetrwać wczesną część lochu i zapewnić sobie sukces w dalszej jego części.
journal.document.adventurers_guide.upgrades.title=Ulepszenia
journal.document.alchemy_guide.bombs.body=Standardową bombę prochową można zmieszać ze specjalnym składnikiem w celu stworzenia ulepszonej bomby.
journal.document.alchemy_guide.bombs.title=Ulepszone bomby
journal.document.alchemy_guide.brews_elixirs.body=Wywary i eliksiry to zaawansowane mikstury o różnorodnych efektach, zwykle stosowane jednorazowo.
journal.document.alchemy_guide.brews_elixirs.title=napary i eliksiry
journal.document.alchemy_guide.energy_food.body=Wiele przepisów wymaga kryształowej energii alchemicznej, która powstaje poprzez dekonstrukcję przedmiotów użytkowych w alchemicznym tyglu. Eliksiry energetyczne lub zwoje również je identyfikują.\n\nNiektóre przepisy wymagające energii są magiczne, ale te przypominają tradycyjne gotowanie.
journal.document.alchemy_guide.energy_food.title=Energia i żywność
journal.document.alchemy_guide.exotic_potions.body=Mikstury można mieszać z energią, aby tworzyć egzotyczne mikstury. Mają one silniejsze działanie, ale często są przydatne na inne sposoby.
journal.document.alchemy_guide.exotic_potions.title=egzotyczne mikstury
journal.document.alchemy_guide.exotic_scrolls.body=Zwoje egzotyczne można stworzyć, mając trochę energii i zwój. Są nieco silniejsze i droższe niż mikstury egzotyczne.
journal.document.alchemy_guide.exotic_scrolls.title=egzotyczne zwoje
journal.document.alchemy_guide.potions.body=Witamy w Praktycznych Zastosowaniach Alchemii! Ta książka to zbiór przepisów na wytwarzanie przedmiotów w tyglu alchemicznym.\n\nZaczniemy od najsłynniejszego przepisu: Mikstury!\n\nUżyj trzech nasion, aby uwarzyć losową miksturę! Każde nasiono ma swój odpowiednik w eliksirach. Użyj kilku takich samych nasion, aby zwiększyć szansę, że mikstura będzie zgodna z użytymi nasionami.
journal.document.alchemy_guide.potions.title=Wprowadzenie i mikstury
journal.document.alchemy_guide.spells.body=Zaklęcia zamknięte są w kryształach i wywołują różnorodne efekty, zazwyczaj o wielorakim zastosowaniu.
journal.document.alchemy_guide.spells.title=zaklęcia
journal.document.alchemy_guide.stones.body=Wsypanie zwoju do tygla alchemicznego spowoduje, że jego magia przeniknie dwa kamienie w tyglu. W ten sposób powstaną kamienie runiczne i będzie można zidentyfikować zwój!
journal.document.alchemy_guide.stones.title=Tworzenie kamieni runicznych
journal.document.alchemy_guide.title=Przewodnik po alchemii
journal.document.alchemy_guide.weapons.body=Niektóre lżejsze lub bardziej magiczne bronie można wykorzystać w alchemii!\n\nKażdy zestaw broni miotanej produkuje wystarczającą ilość płynnego metalu, aby w pełni naprawić inny zestaw tego samego poziomu i rangi. Należy pamiętać, że alchemia zestawu zniszczy cały zestaw, nawet jeśli nie jest on w całości obecny!\n\nJedna różdżka produkuje wystarczającą ilość żywicy tajemnej, aby ulepszyć dwie różdżki tego samego poziomu, ale nie więcej niż +3.
journal.document.alchemy_guide.weapons.title=Ulepszanie broni
journal.document.caves_explorer.alive.body=23. lata, 308\n\nJedna z krasnoludzkich maszyn jakimś sposobem ożyła! Przechodziliśmy obok, gdy zaatakowała i niemal zmiażdżyła dwóch członków naszej grupy swoimi ogromnymi, metalowymi pięściami. Na szczęście miałem przy sobie różdżkę dezintegracji. Kilka celnych strzałów i bestia została zredukowana do złomu.\n\nNiepokoi mnie to, że nie zrobiliśmy absolutnie nic, aby sprowokować maszynę. Krasnoludy nie mogły zaprojektować maszyn tak agresywnych, jakby próbowały nas zaatakować z zasadzki!\n\nPrzynajmniej raz mogłem trochę pomóc moim towarzyszom.\n- Archibald
journal.document.caves_explorer.alive.title=To żyje!
journal.document.caves_explorer.city.body=21. lata, 308\n\nJesteśmy już po trzech tygodniach i po spędzeniu większości ostatnich dziesięciu dni na coraz głębszym badaniu terenu, w końcu dotarliśmy na dno kopalni. Znaleźliśmy różne metalowe urządzenia i wielką bramę blokującą wejście do starej metropolii krasnoludów.\n\nKowal ostrzegł nas przed niektórymi z tych maszyn. Najwyraźniej służyły do obrony obszaru i mają tendencję do aktywacji, gdy zostaną poruszone. Nie mamy nic do roboty w mieście, a metal miałby minimalną wartość złomu, więc uznaliśmy, że najlepiej będzie posłuchać jego ostrzeżenia i wrócić.\n\nMuszę przyznać, że byłem ciekaw, ale badanie tam na dole z pewnością nie było warte ryzyka.\n- Archibald
journal.document.caves_explorer.city.title=Wejście do miasta
journal.document.caves_explorer.discover_hint=Możesz znaleźć ten tekst w konkretnym regionie, ale dopiero po znalezieniu wszystkich wcześniejszych tekstów w tym zestawie.
journal.document.caves_explorer.expedition.body=1. lata, 308\n\nDziś rozpoczyna się nasza czterotygodniowa wyprawa do opuszczonych krasnoludzkich kopalni! Sam król zlecił mi zbadanie regionu. Moimi głównymi celami są znalezienie wszelkich niewykorzystanych zasobów naturalnych i zbadanie jaskiń pod kątem potencjalnego projektu budowy więzienia.\n\nChociaż potrafię się bronić, na prośbę króla przyjąłem eskortę straży miejskiej. To banda prostaków, ale dopóki mnie nie spowalniają, ich obecność jest do zniesienia.\n\nMamy oczyścić kanały i dotrzeć do kopalni do wieczora.\n – Archibald Drummond. Arcymag, Instytut Magii Południa.
journal.document.caves_explorer.expedition.title=Rozpoczęcie wyprawy!
journal.document.caves_explorer.gold.body=4. Lata, 308\n\nNasze pierwsze dni były naprawdę owocne! Po założeniu obozu, wyruszyliśmy na eksplorację górnych obszarów opuszczonej kopalni. Chociaż krasnoludy pozostawiły po sobie mnóstwo bezużytecznego gratu, wiele ścian jaskiń jest również pełnych złota!\n\nUNiestety, nie jesteśmy tu pierwsi. Jaskinie roją się od agresywnej zwierzyny, a stada gnolli najwyraźniej również interesują się złotem. Przyznaję, że byłem niesprawiedliwy wobec mojej eskorty strażników – okazali się o wiele lepszymi odkrywcami i ochroniarzami, niż się spodziewałem.\n\nMimo tego sukcesu, wciąż mamy wiele kopalni do zbadania.\n- Archibald
journal.document.caves_explorer.gold.title=Tyle złota!
journal.document.caves_explorer.report.body=28. lata, 308\n\nDzisiaj kończymy pakowanie naszych rzeczy i przygotowujemy się do wyjazdu. W samą porę, kilku członków naszej grupy zaczęło mieć koszmary senne po incydencie z agresywną maszyną. To prawdopodobnie tylko zmęczenie, ale ich koszmary są niepokojąco podobne.\n\nPodsumowując, górne obszary kopalni są dość bezpieczne. Gdyby udało się znaleźć zastosowanie dla ciemnego złota, jego wydobycie mogłoby być całkiem lukratywne. Duże otwarte przestrzenie również doskonale nadawałyby się do realizacji planów budowlanych miasta. Dolne kopalnie są jednak bardziej niebezpieczne i należy ich unikać.\n\nZapiszę to wszystko w moim raporcie końcowym w ciągu najbliższych kilku dni.\n - Archibald
journal.document.caves_explorer.report.title=Raport końcowy
journal.document.caves_explorer.title=Dziennik odkrywcy
journal.document.caves_explorer.troll.body=11. lata, 308\n\nPo rozpoczęciu eksploracji środkowej części kopalni natknęliśmy się na przyjazną twarz! Cóż... stosunkowo przyjazną. Troll jaskiniowy założył tam małą kuźnię. Jest opryskliwy i mało rozmowny, ale naprawił nasz sprzęt w zamian za trochę złota.\n\nNiestety, troll kowal poinformował nas również, że całe to piękne złoto nie jest tak dobre, jak się wydaje. Nazywa je „ciemnym złotem” i najwyraźniej szybko ulega degradacji pod wpływem światła słonecznego. To z pewnością wyjaśnia, dlaczego nigdy nie było tu konfliktów o zasoby.\n\nChyba musimy zajrzeć trochę głębiej, żeby sprawdzić, czy jest tam coś cenniejszego.\n- Archibald
journal.document.caves_explorer.troll.title=Spotkałem trolla
journal.document.city_warlock.discover_hint=Możesz znaleźć ten tekst w konkretnym regionie, ale dopiero po znalezieniu wszystkich wcześniejszych tekstów w tym zestawie.
journal.document.city_warlock.failure.body=Wygląda na to, że ja też jestem głupcem. Zakładałem, że Nowy Król potrzebuje, by dwór dobrowolnie mu się podporządkował, ale teraz widzę, że ma moc kontrolowania nawet tych, którzy mu się sprzeciwiają.\n\nI ślepo sprowadziłem wszystkich najsilniejszych oponentów prosto pod swoje drzwi, aby osobiście uczynić z nich swoich niewolników. Teraz fale jego nekrotycznej energii zalewają miasto, natychmiast zamieniając większość w jego błagalników.\n\nNieliczni, którzy wciąż mają wolną wolę, uciekają. Postanowiłem zostać, obserwować jak najlepiej potrafię i szukać okazji. Dzięki magicznej mocy, którą posiadam, powinienem móc pozostać w ukryciu i bezpieczny przez jakiś czas.
journal.document.city_warlock.failure.title=Awaria
journal.document.city_warlock.more_powerful.body=Śledzenie czasu stało się trudne, ale minął już tydzień od mojego ostatniego wpisu. Nasza cywilizacja całkowicie się załamała. Bramy są zamknięte, wszelkie funkcje naszego społeczeństwa ustały, a puste krasnoludzkie skorupy wędrują po korytarzach.\n\nPrzez to wszystko, jakoś, Nowy Król staje się jeszcze potężniejszy. Z każdym dniem siła jego woli staje się silniejsza, ale też się zmienia. Nie potrafię tego opisać, ale czuję się, jakby w ogóle nie był już krasnoludem.\n\nZaczynam akceptować fakt, że najlepsze, co mogę zrobić, to udokumentować te wydarzenia. Zostanę tu tak długo, jak będę mógł, a potem się wycofam, gdy moja wola zacznie słabnąć.
journal.document.city_warlock.more_powerful.title=Mocniejszy
journal.document.city_warlock.new_power.body=Co tu się dzieje? Moc emanująca od Nowego Króla rzeczywiście różni się od tej na początku, ale jest też coś jeszcze. Ta nowa moc zdaje się promieniować z najgłębszych korytarzy naszego miasta.\n\nJeszcze bardziej zastanawiające jest to, że aktywność w górnej części metropolii również zmalała. Nie wiem, co dzieje się tam na dole, ale przyciąga to niemal całą uwagę Nowego Króla.\n\nPowrót do głębokich korytarzy będzie niebezpieczny, ale muszę odkryć, co powoduje tę zmianę. Może jednak Nowy Król ma jakąś słabość?
journal.document.city_warlock.new_power.title=Nowa moc
journal.document.city_warlock.old_king.body=Jest 5. dzień 2. miesiąca 33. roku ery magii. Jeśli czyta to ktoś z Overworldu, to jest zima 264 roku. Nazywam się Thymor Zahir i, o ile wiem, jestem ostatnim żyjącym członkiem krasnoludzkiego dworu.\n\nNasz król nie żyje, a jego miejsce zajął jeden z moich byłych towarzyszy, który oszalał z powodu władzy. Reszta dworu poddała mu się, niczym szaleńcy, i w rezultacie utraciła wolną wolę. Tylko ja to przewidziałem i uciekłem, zanim rytuał mógł się zakończyć.\n\nWewnętrzny krąg upadł, ale władza Nowego Króla nie dotarła jeszcze do wszystkich. Muszę jak najszybciej stawić opór. Nie pozwolę, by nasza wspaniała cywilizacja padła ofiarą tego megalomana!
journal.document.city_warlock.old_king.title=Król nie żyje
journal.document.city_warlock.resistance.body=Wieść rozeszła się błyskawicznie. Minęło zaledwie kilka dni, a ja już zgromadziłem małą armię lojalistów Starego Króla. Niewielu z nich zna się na magii, ale prawie cały zakon mnichów-wojowników jest wśród nas. Powinniśmy być więcej niż godnym przeciwnikiem dla jednego szalonego krasnoluda i jego dworu niewolników. \n\nTymczasem Nowy Król ukrył się w wewnętrznych komnatach naszego miasta. Bez wątpienia wyczerpał większość swojej mocy i ma nadzieję odzyskać siły, zanim napotka większy opór. \n\nZaatakujemy za kilka godzin. Jeśli dopisze nam szczęście, uda nam się powołać tymczasową radę i przywrócić stabilność naszemu cudownemu miastu do końca nocy.
journal.document.city_warlock.resistance.title=Opór
journal.document.city_warlock.seen_it.body=Widziałem, co leży poniżej, ale nie potrafię tego opisać. Moje ręce trzęsą się niekontrolowanie, gdy próbuję przelać myśli na papier.\n\nDlaczego to się dzieje? Czy Nowy Król to zrobił? To nie ma sensu. Może jego bezmyślne użycie władzy przyciągnęło go? Miałem nadzieję uratować naszą cywilizację, ale teraz widzę, że cały świat jest zagrożony.\n\nJakoś król jest mniejszym złem. Nie mam innego wyboru, dla większego dobra poddam się. Proszę, prowadź mnie, mój królu, użyj mnie jako narzędzia do trzymania Yog-Dzewy na dystans!
journal.document.city_warlock.seen_it.title=Widziałem to
journal.document.city_warlock.title=Dziennik Czarownika
journal.document.halls_king.amulet.body=UDAŁO MI SIĘ! \n\n Nie wiedziałem, co dokładnie znajdę, ale to, co odkryłem, przerosło moje najśmielsze oczekiwania. Tyle mocy, czekającej na mnie, gotowej do odebrania, i cała jest moja! \n\n Dzięki temu żaden głupiec na dworze nie odważy się mi sprzeciwić. Jestem po prostu podekscytowany myślą o wszystkich sposobach, w jakie mógłbym ich upokorzyć. Cholera, czemu miałbym na tym poprzestać, mam dość mocy, żeby zniszczyć ich wszystkich, co do jednego, jeśli zechcę! To może być przesada, ale nie mogę zwlekać z decyzją zbyt długo, bo nabiorą podejrzeń. \n\n Chyba nazwę tę wielką moc Amuletem Yendor! \n- R.
journal.document.halls_king.amulet.title=Amulet
journal.document.halls_king.attrition.body=Mam plan, jak sobie z tym poradzić. Jego moc jest nieskończona, ale jego zdolność do wkraczania na ten świat już nie. Polega na sługach i awatarach, które wykonują jego rozkazy, próbując zgromadzić wystarczającą moc, by zdobyć amulet.\n\nChociaż nie posiadam amuletu fizycznie, nadal mam pełną kontrolę nad jego mocą. Mając do dyspozycji całe krasnoludzkie miasto, mam też przewagę liczebną. Mogę po prostu wysyłać żołnierzy, aby uniemożliwić mu zdobycie amuletu i konsekwentnie wygrywać tę wojnę na wyniszczenie!\n\nI, RODNEY, KRÓL KRASNOLUDÓW, PRZEŻYJE CIĘ DŁUŻEJ, YOG-DZEWA!
journal.document.halls_king.attrition.title=Ścieranie
journal.document.halls_king.discover_hint=Możesz znaleźć ten tekst w konkretnym regionie, ale dopiero po znalezieniu wszystkich wcześniejszych tekstów w tym zestawie.
journal.document.halls_king.new_king.body=JESTEM KRÓLEM, AHAHAHAHAAA!\n\nPo prostu mi na to pozwolili! Bez większego namawiania zgodzili się, żebym „podzielił się” z nimi tą mocą w wielkim rytuale. W jednej chwili przemienili się z chóru szyderczych głosów w mój nowy dwór milczących poddanych!\n\nJak można było się spodziewać, Thymor uciekł jak tchórz na pierwszy znak kłopotów. Już czuję siłę oporu, którą buduje. Chyba pozwolę mu kontynuować, żeby mógł dostarczyć wszystkich swoich spiskowców prosto pod moje drzwi!\n\nWyraźnie królestwo też mnie nie szanuje, chyba to też naprawię.\n – Król Krasnoludów
journal.document.halls_king.new_king.title=Nowy król
journal.document.halls_king.rejection.body=IMBECILE!\n\nPrzez ostatnie 33 lata nasze królestwo rozkwitło dzięki nowej magicznej technologii. Nauczyliśmy się przywoływać duchy żywiołów i naginać je do naszej woli, ale z jakiegoś powodu dalsze eksperymenty są teraz „zbyt niebezpieczne”.\n\nWiem, co się naprawdę dzieje. Odrzucenie moich teorii nie ma nic wspólnego z ich wartością, a wszystko z osobą, która je sugeruje. Pewnie wszyscy śmieją się ze mnie za plecami.\n\nNo i koniec! Nie obchodzi mnie, co mówią, sam będę eksplorował najdalsze zakątki naszego wszechświata i zachowam wszystko, co odkryję, dla siebie!\n- R.
journal.document.halls_king.rejection.title=Odrzucenie
journal.document.halls_king.ritual.body=Thymor publicznie skonfrontował mnie dziś rano i nalegał, abym wyjaśnił mu moje nowe źródło mocy. Zignorowałem go najlepiej, jak potrafiłem, ale znów czuję na sobie osądzające spojrzenie reszty dworu. \n\nMiałem nadzieję spędzić trochę więcej czasu, ciesząc się ciszą przed burzą, ale to nie ma znaczenia. Zdecydowałem, co chcę zrobić. Oświadczę, że zdobyłem moc dzięki nowemu rytuałowi i zaoferuję, że przeprowadzę go na innych czarnoksiężnikach i Królu. Po zakończeniu rytuału zostanę królem! \n\nThymor oczywiście zaprotestuje, ale przy takiej mocy, jaką oferuje, wątpię, żeby go posłuchali! \n\nWSZYSCY BĘDĄ MI SIĘ KŁANIAĆ! \n – Przyszły Król Krasnoludów
journal.document.halls_king.ritual.title=Rytuał
journal.document.halls_king.thing.body=Jest problem. Thymor został pokonany bez wysiłku, ale wygląda na to, że moje poszukiwania w planach zewnętrznych nie pozostały niezauważone.\n\nJakaś... 'rzecz'... została przyciągnięta do mojego świata i zaczyna się przedzierać przez dolne korytarze. Co jeszcze bardziej komplikuje sprawę, to właśnie tam schowałem amulet! Co za złośliwa istota, dlaczego próbuje pozbawić mnie mojej mocy, skoro jest jeszcze tyle do zdobycia?\n\nPomimo mojej mocy, nie sądzę, żebym mógł po prostu rzucić się na nią i z nią walczyć. Jej prawdziwa moc jest niepojęta, ale musi być jakiś sposób, żeby ją ograniczyć. BĘDĘ BRONIŁ MOJEJ NAGRODY!
journal.document.halls_king.thing.title=Rzecz
journal.document.halls_king.title=Dziennik ???
journal.document.intros.caves.body=Te słabo zaludnione jaskinie ciągną się pod opuszczonym więzieniem. Bogate w minerały, niegdyś były centrum tętniącego życiem handlu i przemysłu krasnoludzkiej społeczności, ale zostały opuszczone, gdy krasnoludy popadły w obsesję na punkcie czarnej magii.\n\nJaskinie są obecnie zamieszkiwane głównie przez podziemne zwierzęta, gnole i porzucone maszyny; prawdopodobnie skażone tą samą mocą, która wpłynęła na regiony powyżej.
journal.document.intros.caves.title=Jaskinie
journal.document.intros.city.body=Metropolia Krasnoludów była niegdyś najwspanialszym ze wszystkich krasnoludzkich miast-państw. W czasach swojej świetności krasnoludy zbudowały cudowne maszyny z metalu i magii, które pozwoliły ich miastu szybko się rozwijać.\n\nPewnego dnia bramy miasta zostały zaryglowane i krasnoludy ucichły. Nieliczni, którym udało się uciec z miasta po jego zamknięciu, opowiadali historie o szalonym czarnoksiężniku, który ukradł tron, i o straszliwej magii, którą nauczył się okiełznać.
journal.document.intros.city.title=Metropolia Krasnoludów
journal.document.intros.discover_hint=Ten tekst możesz zobaczyć przy pierwszym wejściu do danego regionu.
journal.document.intros.dungeon.body=Wielu bohaterów zapuściło się do lochów przed tobą z miasta na górze, ale o większości z nich słuch zaginął.\n\nMówi się, że w głębinach czai się starożytne zło, strzegące wszechmocnego Amuletu Yendor. Nawet teraz mroczna energia emanuje z głębin, przedostając się do miasta.\n\nCzy podbijesz lochy i zdobędziesz amulet? Czas rozpocząć własną przygodę!
journal.document.intros.dungeon.title=Loch
journal.document.intros.halls.body=Te głębokie korytarze Metropolii Krasnoludzkiej zostały wypaczone przez mroczną magię. W przeszłości regiony te gościły dwór elitarnych czarnoksiężników Króla Krasnoludów, ale teraz zdaje się, że przejęło je coś jeszcze bardziej złowrogiego... \n\nWszelkiego rodzaju przerażające demoniczne stworzenia zamieszkują te korytarze, prowadzone przez jakąś straszliwą mroczną moc. Jeśli Król Krasnoludów nie był źródłem szerzącej się korupcji, to cokolwiek znajduje się tutaj, musi nim być. \n\nStąpajcie ostrożnie, niewielu poszukiwaczy przygód kiedykolwiek zstąpiło tak daleko...
journal.document.intros.halls.discover_hint=Możesz znaleźć ten tekst w konkretnym regionie, ale dopiero po znalezieniu wszystkich wcześniejszych tekstów w tym zestawie.
journal.document.intros.halls.title=Sale Demonów
journal.document.intros.prison.body=Wiele lat temu wybudowano tu więzienie dla niebezpiecznych przestępców. Ściśle kontrolowane i bezpieczne, sprowadzano tu skazańców z całego kraju, aby odbywali karę.\n\nJednak wkrótce z dołu zaczęła się wydobywać mroczna mgła, paraliżując umysły strażników i więźniów.\n\nW odpowiedzi na narastający chaos miasto zamknęło całe więzienie. Nikt nie wie, co stało się z tymi, którzy zostali pozostawieni na śmierć w tych murach...
journal.document.intros.prison.title=Więzienie
journal.document.intros.sewers.body=Górne piętra lochów stanowią w rzeczywistości miejski system kanalizacyjny. \n\nMroczna energia przedostała się z dołu, a zazwyczaj niegroźne stworzenia z kanałów stały się coraz bardziej agresywne. Miasto musiało wysłać tu patrole strażnicze, aby zapewnić bezpieczeństwo tym na górze. \n\nTo miejsce jest niebezpieczne, ale przynajmniej działająca tu zła magia jest słaba.
journal.document.intros.sewers.title=Kanalizacja
journal.document.intros.title=Wprowadzenia do regionów
journal.document.prison_warden.discover_hint=Możesz znaleźć ten tekst w konkretnym regionie, ale dopiero po znalezieniu wszystkich wcześniejszych tekstów w tym zestawie.
journal.document.prison_warden.journal.body=1. wiosny, 362\n\nTo pierwszy wpis w dzienniku pracy naczelniczki więzienia Kiany Smith. W związku z tym wszystkim, co ostatnio się działo, postanowiłam założyć dziennik, aby uporządkować swoje myśli.\n\nZarządzanie więzieniem położonym pół mili pod ziemią nigdy nie było łatwe, ale ostatnio wydaje się, że dochodzi do zorganizowanego zamieszania. Więźniowie zachowują się bez powodu i odmawiają wyjaśnienia.\n\nNiektórzy strażnicy zaczynają mówić, że to miejsce jest nawiedzone. Nie mogę pozwolić, aby moi ludzie rozsiewali plotki, ale nie mogę ich winić za to, że czują się nieswojo.\n- Smith
journal.document.prison_warden.journal.title=Prowadzenie dziennika
journal.document.prison_warden.letter.body=Thomas, \n\nByłeś wspaniałym przyjacielem, więc robię ci przysługę. \n\nKiedy dziś wieczorem zaczniesz swoją zmianę, zamknij i wzmocnij celę Tengu, wrzuć klucz do jakiejś wnęki i wyjdź. Nieważne, że inni więźniowie zostaną bez opieki, wkrótce nikt nie będzie mógł opuścić tego miejsca. Ten dziwak musi jednak pozostać bezpieczny, bo jeśli ucieknie, nie wiadomo, co zrobi. \n\nNie mów nikomu o tym i nie zawracaj sobie głowy szukaniem mnie. Kapitan musi zatonąć ze swoim statkiem. \n- Kiana
journal.document.prison_warden.letter.title=List do Tomasza
journal.document.prison_warden.mines.body=54. zimy, 363\n\nGrupa inżynierów z miasta przybyła dziś, mówiąc, że przybyli, aby zamknąć stare wejście do kopalni poniżej. Przypuszczam, że miasto nie chce już zawracać sobie głowy konserwacją przejścia. Nie zostałem o tym poinformowany wcześniej, jak zwykle.\n\nIch główny inżynier naopowiadał mi też bzdur o krasnoludzkiej magii wyciekającej z kopalni. Nie wierzę w ani jedno słowo.\n\nSytuacja jest pod znacznie lepszą kontrolą dzięki nowym pracownikom, ale przyczyna problemu nadal nie została rozwiązana. Coś zdecydowanie wpływa na więźniów i zburzenie kilku ścian tego nie zmieni.\n- Smith
journal.document.prison_warden.mines.title=Zamykanie min
journal.document.prison_warden.no_support.body=11 Wiosny, 364\n\nCo do cholery miasto sobie myśli? Po usilnych prośbach o pomoc nie usłyszałem nic, nawet pustych przeprosin, jak zwykle, gdy moje prośby są odrzucane.\n\nTymczasem stan więźniów pogarsza się, a niektórzy strażnicy zaczęli nawet sprawiać kłopoty. Czy planują po prostu pozwolić, żeby to się pogarszało, aż dojdzie do zamieszek?!\n\nThomas pozostał niezawodny jak zawsze. Jego pomoc organizacyjna była nieoceniona, a jego pomysł, aby aktywować te stare jednostki DM-100, był godny ubolewania, ale konieczny. Jestem pewien, że uda mi się opanować tę sytuację, potrzebuję tylko cholernego wsparcia!\n-Smith
journal.document.prison_warden.no_support.title=Brak wsparcia
journal.document.prison_warden.recruits.body=80. dzień wiosny, 362\n\nZgodnie z obietnicą, dziś przybyło sporo nowych rekrutów. Wygląda na to, że wszystko jest jak zwykle: kilku obiecujących i mnóstwo szeregowych, którym zależy tylko na wynagrodzeniu. Mimo to, posiadanie tylu nowych sił powinno bardzo pomóc w radzeniu sobie z naszymi niedawnymi, niesfornymi więźniami.\n\nW takiej pracy ważne jest, aby wiedzieć, komu można zaufać. Jeden z nowych pracowników, Thomas, wydaje się szczególnie obiecujący. Potrzebuję teraz wszelkiej możliwej pomocy, więc jeśli dobrze sobie poradzi, postaram się szybko go awansować.\n- Smith
journal.document.prison_warden.recruits.title=Nowi rekruci
journal.document.prison_warden.rotberry.body=23. Jesieni, 363\n\nOtrzymałem dziś od Felixa piękny prezent. To jakiś jaskrawoczerwony krzew o nazwie „Rotberry”.\n\nWspominałem mu już wcześniej, jak ponure jest to miejsce, wygląda na to, że mnie słuchał. Według niego ta roślina tak naprawdę nie lubi światła i wody, więc muszę po prostu przycinać liście mniej więcej raz na miesiąc. Przycinanie musi być jednak ważne, wspominał o tym kilkanaście razy w liście.\n\nOczywiście Felix nigdy nie robi niczego za darmo. Mówi, że nasiona, które produkuje ta roślina, świetnie nadają się do robienia różdżek, więc naturalnie jestem mu winien kilka za każdym razem, gdy roślina wytworzy jakieś nasiona.\n- Smith
journal.document.prison_warden.rotberry.title=Roślina rotberry
journal.document.prison_warden.title=Dziennik strażnika
journal.document.sewers_guard.crabs.body=11. zimy, 376\nDrodzy Mamo i Tato,\n\nA jakby szczury nie były wystarczająco straszne, głębiej w dole są gigantyczne kraby! Jeden z nich przebiegł obok mnie i mocno dotknął Lee, zanim go zabiliśmy. Thomas mówi, że to nie moja wina, ale wiem, że po prostu stara się być dla mnie miły.\n\nNa szczęście, wychodząc, natknęliśmy się na poszukiwacza przygód, który miał trochę maści z trawy słonecznej. Lee mógłby nie przeżyć bez niej.\n\nWidziałem poszukiwacza przygód wpatrującego się w różę, zanim odszedł, powiedział, że to prezent. Po co ryzykowaliby życie tutaj na dole, skoro ktoś tak bardzo się o nich troszczy?\n\nWłaśnie to robię, prawda? Czuję, że to mnie przerasta.
journal.document.sewers_guard.crabs.title=Olbrzymie kraby!
journal.document.sewers_guard.dangerous.body=88. Jesieni, 375\nDrodzy Mamo i Tato,\n\nRozumiem teraz, dlaczego płaca jest tak dobra, w kanałach roi się od potworów! „Szkodniki” i „banici” to gigantyczne, krwiożercze szczury i stada wściekłych gnoli.\n\nNa szczęście reszta mojej drużyny naprawdę wie, co robi. Nasz kapitan, Thomas, jest w tym ekspertem. Staram się szybko uczyć, żeby nie być dla was zbyt dużym obciążeniem.\n\nTa robota jest o wiele bardziej niebezpieczna, niż myślałem. Cieszę się, że nie mogę teraz tego wysłać, nie chcę, żebyście się martwili.\n\nBędę bezpieczny,\n- Sonya
journal.document.sewers_guard.dangerous.title=Niebezpieczna pozycja...
journal.document.sewers_guard.discover_hint=Możesz znaleźć ten tekst w konkretnym regionie, ale dopiero po znalezieniu wszystkich wcześniejszych tekstów w tym zestawie.
journal.document.sewers_guard.guild.body=23 zimy, 376\nDrodzy Mamo i Tato,\n\nTym razem nie było nowych potworów, zamiast tego natknęliśmy się na małą grupkę z gildii złodziei podczas patrolu.\n\nWszystko, co słyszałem o tej gildii, jest złe, ale reszta mojej drużyny wydawała się być z nimi prawie zaprzyjaźniona. Thomas wymienił się informacjami i zapasami z jednym z nich, zanim rozeszliśmy się w swoje strony.\n\nNie rozumiem, czy nie mieliśmy pozbyć się bandytów? Thomas nawet powiedział, żeby nie wspominać o tym nikomu z dowódców. Ich informacje i zapasy były jednak bardzo przydatne i nie daliśmy rady walczyć dalej.\n\nChyba wszyscy jesteśmy w tym razem.
journal.document.sewers_guard.guild.title=Gildia złodziei
journal.document.sewers_guard.lost.body=40. dnia zimy, 376\n\nThomas i ja jesteśmy zgubieni. Oderwaliśmy się od reszty drużyny podczas walki z gnollami. Żaden z nas nie został ranny, ale dolne kanały przypominają labirynt.\n\nThomas mówi, że zna drogę wyjścia, ale zaczyna się ona przy wejściu do starego więzienia na dnie kanałów. Naprawdę nie lubię schodzić głębiej, ale nie mamy żadnych racji żywnościowych, a zejście jest o wiele szybsze niż błądzenie w poszukiwaniu trasy patrolu.\n\nBędzie dobrze. Thomas wie, co robi.
journal.document.sewers_guard.lost.title=Jesteśmy zgubieni
journal.document.sewers_guard.new_position.body=85. Jesieni, 375\nDrodzy Mamo i Tato,\n\nMówiłem Wam, że ciężka praca w straży miejskiej się opłaci. Właśnie dostałem awans!\n\nZostałem zaproszony do zespołu specjalistów pracujących w kanałach. Podobno jest tam problem ze szkodnikami i bandytami, a naszym zadaniem jest ich usunięcie. To brudna robota, ale zimą w kanałach jest ciepło, a praca jest trzy razy droższa niż na zwykłej straży!\n\nTo wszystko jest jednak trochę tajne, więc nie mogę wysłać tego listu. Dziwnie się czuję, nie pisząc do Was, więc i tak będę do Was pisać. Może pewnego dnia będę mógł ci je pokazać.\n\nNajlepiej,\n- Sonya
journal.document.sewers_guard.new_position.title=Moje nowe stanowisko!
journal.document.sewers_guard.not_worth.body=Thomas i ja natknęliśmy się na jakiegoś ogromnego potwora z mazi przy wejściu do więzienia. Zanim zdążyliśmy zareagować, rzucił na nas magię. Thomas przyjął większość. Zniknął.\n\nŻadne pieniądze nie są tego warte. Wyjdę drogą, o której mówił mi Thomas. Potem wezmę to, co zarobiłem jako strażnik, i wykorzystam to, żeby wyprowadzić siebie i rodziców z tego przeklętego miasta. Część mnie chce mieć nadzieję, że Król ma na to wszystko jakiś plan, ale wątpię.\n\nZostawiam te listy jako ostrzeżenie dla innych. To coś więcej niż tylko gigantyczne szczury i kraby, coś tu jest bardzo nie tak.
journal.document.sewers_guard.not_worth.title=To nie jest tego warte
journal.document.sewers_guard.title=Listy strażnika
