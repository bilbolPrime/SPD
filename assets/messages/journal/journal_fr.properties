journal.document.adventurers_guide.alchemy.body=Si vous ne trouvez pas un objet consommable utile, vous pouvez l'utiliser comme ingrédient d'alchimie ou le transformer en énergie alchimique polyvalente. Les potions et les parchemins énergisants les identifient également !\n\nLes bibelots sont un type d'équipement unique qui est créé et amélioré grâce à l'alchimie. Ils sont fabriqués à l'aide d'un catalyseur magique et d'un peu d'énergie alchimique.\n\n(Le premier pot d'alchimie se trouve au 3e ou 4e étage du donjon. Il y a des pages de livre de recettes d'alchimie près de ces pots)
journal.document.adventurers_guide.alchemy.title=Alchimie et bibelots
journal.document.adventurers_guide.dieing.body=L'aventure est dangereuse et la plupart des aventuriers finissent par mourir.\n\nLa chance aide, mais les meilleurs aventuriers utilisent tous les petits trucs pour augmenter leurs chances.\n\n(Ne vous énervez pas si vous mourez souvent, ce jeu est difficile ! Concentrez-vous sur l'apprentissage du jeu et l'amélioration constante, et non sur la victoire immédiate)
journal.document.adventurers_guide.dieing.title=Gérer la défaite
journal.document.adventurers_guide.examining.body=Il est important d'étudier ses ennemis et son environnement au lieu de se précipiter à l'aveuglette ! Prenez l'habitude d'examiner tout ce qui est nouveau.\n\n(Vous pouvez examiner en utilisant le bouton de loupe et en sélectionnant ce que vous voulez examiner. Vous pouvez également examiner les buffs et debuffs en sélectionnant leurs icônes)
journal.document.adventurers_guide.examining.title=Examiner
journal.document.adventurers_guide.food.body=Un rationnement efficace est l'un des meilleurs moyens d'améliorer vos chances de survie. Il n'est pas toujours nécessaire de manger dès que l'on a faim !\n\nLorsque vous n'êtes pas affamé, vous régénérez lentement de la santé, donc si vous mangez à pleine santé, cette régénération sera gaspillée !\n\nSi vous planifiez vos repas en fonction de votre état de santé, votre nourriture durera beaucoup plus longtemps.
journal.document.adventurers_guide.food.title=Faire face à la faim
journal.document.adventurers_guide.identifying.body=Les couleurs des potions et les symboles des parchemins sont différents dans chaque donjon. Les équipements non identifiés peuvent être améliorés ou enchantés si vous avez de la chance, mais ils peuvent aussi être maudits !\n\nLes parchemins d'identification, d'amélioration ou de suppression de malédiction sont très utiles si tu veux réduire le risque d'utiliser un équipement non identifié.\n\n(Vous trouverez la liste de tous les objets que vous avez identifiés dans l'onglet catalogue de votre journal)
journal.document.adventurers_guide.identifying.title=Identification des articles
journal.document.adventurers_guide.intro.body=Bonjour aventurier, vous êtes en train de lire le Tome de la Maîtrise du Donjon ! Ce guide doit être utilisé comme une référence, et vous indiquera magiquement quand il est préférable de lire chaque page.\n\n(Lorsque le bouton du journal clignote, sélectionnez-le pour lire ce que le guide a à vous dire ! Il manque cependant quelques pages, peut-être pourrez-vous les trouver dans le donjon)
journal.document.adventurers_guide.intro.title=Introduction
journal.document.adventurers_guide.levelling.body=Le fait de monter en niveau augmente vos statistiques et vous donne des points de talent, ce qui peut faire une grande différence en combat. Il est préférable d'avoir au moins un niveau pour chaque étage du donjon.\n\nIl peut être tentant de se précipiter et d'éviter l'exploration ou le combat, mais cela vous privera de provisions et d'expérience.\n\n(Vous pouvez consulter les informations sur votre héros, y compris l'expérience, dans le panneau d'état situé dans le coin de l'interface de jeu. Sélectionnez le portrait de votre héros pour obtenir encore plus d'informations)
journal.document.adventurers_guide.levelling.title=Acquérir de l'expérience
journal.document.adventurers_guide.looting.body=Les pièces qui se trouvent derrière des portes verrouillées ou qui contiennent des obstacles ont généralement un meilleur butin. Lorsqu'un obstacle bloque votre chemin, vous pouvez généralement trouver un objet utile au même étage.\n\nVous trouverez toujours 2 potions de force et 3 parchemins d'amélioration dans chaque région de donjon de cinq étages, ce qui constitue un excellent indicateur de votre niveau d'exploration.\n\n(Vous pouvez consulter la liste des repères et des clés inutilisées dans l'onglet Notes de la fenêtre du journal)
journal.document.adventurers_guide.looting.title=Pillage efficace
journal.document.adventurers_guide.magic.body=Les attaques magiques transpercent les armures et sont difficiles à esquiver. Cela signifie que les dégâts infligés par les baguettes sont très fiables, mais aussi que les ennemis magiques sont très dangereux !\n\nLes attaques magiques ont cependant toujours un inconvénient. Les baguettes ont des charges limitées et les ennemis magiques ne peuvent généralement pas utiliser leur magie à courte portée.\n\nLorsque vous affrontez des ennemis qui utilisent la magie, il est important d'apprendre à les empêcher de l'utiliser contre vous.
journal.document.adventurers_guide.magic.title=Attaques magiques
journal.document.adventurers_guide.positioning.body=La stratégie est tout aussi importante que l'équipement. Les mauvaises situations, comme l'encerclement, peuvent généralement être évitées grâce à un bon positionnement.\n\nPar exemple, la plupart des donjons ont des couloirs étroits qui obligent les ennemis à vous combattre un par un. Ces couloirs comportent souvent des portes qui permettent des attaques surprises !\n\nIl existe également de nombreuses petites façons d'utiliser les caractéristiques de l'environnement, comme l'herbe, l'eau, les fosses ou les pièges, à votre avantage.
journal.document.adventurers_guide.positioning.title=Positionnement
journal.document.adventurers_guide.searching.body=Les donjons sont pleins de portes secrètes et de pièges qui semblent invisibles à première vue. Vous pouvez passer du temps à chercher soigneusement si vous pensez qu'une porte ou un piège est caché à proximité.\n\n(Vous pouvez chercher dans toutes les tuiles autour de vous en utilisant deux fois le bouton de la loupe. Il y a peut-être des portes cachées près de l'endroit où vous avez trouvé cette page)
journal.document.adventurers_guide.searching.title=Recherche
journal.document.adventurers_guide.strength.body=Vous n'avez pas le temps de vous entraîner avec les armes et les armures que vous trouvez dans le donjon, vous devrez donc faire preuve de force brute pour les utiliser efficacement.\n\nLes potions de force et les parchemins d'amélioration sont les moyens les plus efficaces de répondre aux exigences de force des équipements de niveau supérieur.\n\nIl est important de commencer à utiliser des objets de haut niveau, mais ne négligez pas les équipements que vous pouvez utiliser dès maintenant.
journal.document.adventurers_guide.strength.title=La force
journal.document.adventurers_guide.surprise_attacks.body=Les attaques surprises sont assurées de toucher, ce qui les rend particulièrement utiles contre les ennemis évasifs tels que les serpents et les wraiths.\n\nVous pouvez surprendre les ennemis juste après qu'ils aient franchi une porte en vous poursuivant, ou lorsqu'ils vous ont perdu de vue.
journal.document.adventurers_guide.surprise_attacks.title=Attaques surprises
journal.document.adventurers_guide.title=tome de la maîtrise des donjons
journal.document.adventurers_guide.upgrades.body=Plus vous vous enfoncez dans un donjon, plus il est important que vous utilisiez un équipement de haut niveau amélioré par magie, mais vous aurez également besoin de force pour l'utiliser correctement.\n\nLes baguettes, les anneaux et les artefacts n'ont pas besoin de force, mais leur utilisation est limitée ou ils ne sont pas aussi utiles en combat.\n\nIl est très important de bien choisir ce que vous améliorez pour survivre au début du donjon et pour vous préparer à réussir plus tard dans le donjon.
journal.document.adventurers_guide.upgrades.title=Améliorations
journal.document.alchemy_guide.bombs.body=Une bombe à poudre noire standard peut être mélangée à un élément spécifique pour créer une bombe améliorée.
journal.document.alchemy_guide.bombs.title=Bombes améliorées
journal.document.alchemy_guide.brews_elixirs.body=Les infusions et les élixirs sont des potions avancées aux effets variés, généralement à usage unique.
journal.document.alchemy_guide.brews_elixirs.title=brassins et élixirs
journal.document.alchemy_guide.energy_food.body=De nombreuses recettes nécessitent de l'énergie alchimique cristalline, qui est produite par la déconstruction d'objets consommables dans un pot d'alchimie. La dynamisation de potions ou de parchemins permet également de les identifier.\n\nCertaines recettes nécessitant de l'énergie sont magiques, mais elles ressemblent à de la cuisine traditionnelle.
journal.document.alchemy_guide.energy_food.title=Énergie et alimentation
journal.document.alchemy_guide.exotic_potions.body=Les potions peuvent être mélangées avec de l'énergie pour créer des potions exotiques. Elles ont des effets plus puissants, mais sont souvent utiles de différentes manières.
journal.document.alchemy_guide.exotic_potions.title=potions exotiques
journal.document.alchemy_guide.exotic_scrolls.body=Les parchemins exotiques peuvent être fabriqués avec un peu d'énergie et un parchemin. Ils sont un peu plus forts et plus chers que les potions exotiques.
journal.document.alchemy_guide.exotic_scrolls.title=parchemins exotiques
journal.document.alchemy_guide.potions.body=Bienvenue dans les Applications pratiques de l'alchimie ! Ce livre est une référence de recettes pour fabriquer des objets à l'aide d'un pot d'alchimie.\n\nNous commencerons par la recette la plus emblématique : Les potions !\n\nUtilisez trois graines pour préparer une potion au hasard ! Chaque graine a son équivalent en potion. Utilisez plusieurs graines de la même espèce pour augmenter les chances que la potion soit liée aux graines que vous avez utilisées.
journal.document.alchemy_guide.potions.title=Intro et Potions
journal.document.alchemy_guide.spells.body=Les sorts sont contenus dans les cristaux et produisent une variété d'effets, généralement à usages multiples.
journal.document.alchemy_guide.spells.title=sortilèges
journal.document.alchemy_guide.stones.body=Mélanger un parchemin dans un pot d'alchimie permet d'imprégner de sa magie deux roches qui se trouvent dans le pot. Cela permet de créer des pierres runiques et d'identifier le parchemin !
journal.document.alchemy_guide.stones.title=Création de jalons
journal.document.alchemy_guide.title=Guide de l'alchimie
journal.document.alchemy_guide.weapons.body=Certaines armes plus légères ou plus magiques peuvent être utilisées en alchimie !\n\nChaque ensemble d'armes jetées produit suffisamment de métal liquide pour réparer entièrement un autre ensemble du même niveau et de la même catégorie. Notez que l'alchimie d'un set détruira le set entier, même s'il n'est pas entièrement présent !\n\nUne baguette produit assez de résine arcanique pour améliorer deux baguettes de même niveau, mais pas plus haut que +3.
journal.document.alchemy_guide.weapons.title=Amélioration des armes
journal.document.caves_explorer.alive.body=23e de l'été, 308\n\nL'une des machines naines s'est animée d'une manière ou d'une autre ! Nous passions juste à côté lorsqu'elle a chargé et a failli écraser deux membres de notre groupe avec ses énormes poings métalliques. Heureusement, j'avais sur moi ma baguette de désintégration. Quelques coups bien ciblés et la bête a été réduite à l'état de ferraille.\n\nCe qui me gêne, c'est que nous n'avons absolument rien fait pour provoquer la machine. Les nains n'ont pas pu concevoir des machines aussi agressives, c'est comme si elle essayait de nous tendre une embuscade !\n\nAu moins, pour une fois, j'ai pu aider mes compagnons.\n- Archibald
journal.document.caves_explorer.alive.title=Il est vivant !
journal.document.caves_explorer.city.body=21 de l'été, 308\n\nNous en sommes maintenant à la troisième semaine, et après avoir passé une bonne partie des dix derniers jours à creuser toujours plus profond, nous avons enfin atteint le fond des mines. Nous avons trouvé divers engins métalliques et une grande porte qui bloque l'accès à l'ancienne métropole naine.\n\nLe forgeron nous a mis en garde contre certaines de ces machines. Elles étaient apparemment destinées à la défense d'une zone et ont tendance à s'activer lorsqu'on les dérange. Nous n'avons rien à faire dans cette ville et le métal n'aurait qu'une valeur minime à la ferraille.\n\nJe dois admettre que j'étais curieux, mais enquêter là-dessous ne valait certainement pas la peine de prendre des risques.\n- Archibald
journal.document.caves_explorer.city.title=L'entrée de la ville
journal.document.caves_explorer.discover_hint=Vous pouvez trouver ce texte dans une région spécifique, mais seulement après avoir trouvé tous les textes précédents de cette série.
journal.document.caves_explorer.expedition.body=1er de l'été, 308\n\nC'est aujourd'hui que commence notre expédition de quatre semaines dans les mines naines abandonnées ! J'ai été chargé par le roi lui-même d'explorer la région. Mes principaux objectifs sont de trouver des ressources naturelles inexploitées et d'étudier les grottes en vue d'un éventuel projet de construction de prison.\n\nBien que je sois capable de me défendre seul, j'ai accepté une escorte de la garde de la ville sur l'insistance du roi. C'est une bande de nigauds, mais tant qu'ils ne me ralentissent pas, leur présence est tolérable.\n\nNous devrions avoir nettoyé les égouts et atteint les mines dans la soirée.\n- Archibald Drummond. Archimage, Institut des sorciers du Sud.
journal.document.caves_explorer.expedition.title=Début de l'expédition !
journal.document.caves_explorer.gold.body=4 de l'été, 308\n\nNos premiers jours ont été très fructueux ! Après avoir établi un camp de base, nous avons commencé à explorer les zones supérieures de la mine abandonnée. Si les nains y ont laissé de nombreux objets inutiles, les parois des grottes regorgent d'or !\n\nMalheureusement, nous ne sommes pas les premiers. Les grottes sont envahies par une faune agressive, et il semble que des meutes de gnolls s'intéressent également à l'or. Je reconnais que j'ai été injuste envers mon escorte de gardes, ils ont été des explorateurs et des gardes du corps bien plus compétents que je ne l'imaginais.\n\nMême avec ce succès, il nous reste encore une bonne partie des mines à explorer.\n- Archibald
journal.document.caves_explorer.gold.title=Tant d'or !
journal.document.caves_explorer.report.body=28 de l'été, 308\n\nAujourd'hui, nous finissons de ranger nos affaires et nous nous préparons à partir. Juste à temps, car plusieurs membres de notre groupe ont commencé à faire de terribles cauchemars suite à l'incident avec la machine agressive. Il s'agit probablement de fatigue, mais leurs cauchemars se ressemblent tous de façon inquiétante.\n\nEn résumé, les zones supérieures de la mine sont assez sûres. Si l'on trouve une utilisation pour l'or noir, son exploitation pourrait être très lucrative. Les grands espaces ouverts conviendraient également très bien aux plans de construction de la ville. Les mines inférieures sont cependant plus dangereuses et doivent être évitées.\n\nJ'écrirai tout cela dans mon rapport final dans les prochains jours.\n- Archibald
journal.document.caves_explorer.report.title=Rapport final
journal.document.caves_explorer.title=Journal de bord de l'explorateur
journal.document.caves_explorer.troll.body=11e de l'été, 308\n\nAprès avoir commencé notre exploration dans la partie centrale des mines, nous avons rencontré un visage amical ! Enfin... relativement amical. Un troll des cavernes y a installé une petite forge. Il est bourru et peu bavard, mais il a réparé notre équipement en échange d'un peu d'or.\n\nMalheureusement, le forgeron troll nous a également informés que tout ce bel or n'est pas aussi bon qu'il en a l'air. Il l'appelle "or sombre" et il semble qu'il se dégrade rapidement à la lumière du soleil. Cela expliquerait certainement pourquoi il n'y a jamais eu de conflits pour les ressources ici.\n\nJe suppose que nous devons creuser un peu plus pour voir s'il y a quelque chose de plus précieux.\n- Archibald
journal.document.caves_explorer.troll.title=Rencontre avec un troll
journal.document.city_warlock.discover_hint=Vous pouvez trouver ce texte dans une région spécifique, mais seulement après avoir trouvé tous les textes précédents de cette série.
journal.document.city_warlock.failure.body=Il semble que je sois moi aussi un imbécile. Je pensais que le nouveau roi avait besoin que la cour se soumette à lui de plein gré, mais je vois maintenant qu'il a le pouvoir de contrôler même ceux qui lui résistent.\n\nJ'ai aveuglément amené tous les opposants les plus forts jusqu'à sa porte pour qu'il puisse les transformer personnellement en esclaves. Aujourd'hui, des vagues d'énergie nécrotique déferlent sur la ville, transformant instantanément la plupart d'entre eux en suppliants.\n\nLes quelques personnes qui ont encore leur libre arbitre s'enfuient. J'ai choisi de rester en arrière pour observer du mieux que je peux et chercher une ouverture. Avec la puissance magique dont je dispose, je devrais pouvoir rester caché et en sécurité pendant un certain temps.
journal.document.city_warlock.failure.title=Échec
journal.document.city_warlock.more_powerful.body=Il est devenu difficile de garder la notion du temps, mais il s'est écoulé environ une semaine depuis mon dernier article. Notre civilisation s'est véritablement effondrée. Les portes sont fermées, toutes les fonctions de notre société ont cessé, et des nains vides errent dans les couloirs.\n\nMalgré tout, le nouveau roi devient de plus en plus puissant. Chaque jour, la force de sa volonté devient plus forte, mais elle change aussi. Je ne saurais le décrire, mais j'ai l'impression qu'il n'est plus du tout un nain.\n\nJe commence à accepter que le mieux que je puisse espérer faire est de documenter ces événements. Je resterai ici aussi longtemps que je le pourrai, puis je me retirerai lorsque ma volonté commencera à faiblir.
journal.document.city_warlock.more_powerful.title=Plus puissant
journal.document.city_warlock.new_power.body=Que se passe-t-il ici ? Le pouvoir qui émane du nouveau roi est effectivement différent de ce qu'il était au début, mais il y a aussi quelque chose d'autre. Ce nouveau pouvoir semble rayonner depuis les salles les plus intimes de notre ville.\n\nCe qui est encore plus surprenant, c'est que l'activité dans la métropole supérieure a également diminué. Je ne sais pas ce qui se passe là-bas, mais cela attire presque toute l'attention du nouveau roi.\n\nRetourner dans les salles profondes sera dangereux, mais je dois découvrir la cause de ce changement. Peut-être que le nouveau roi a une faiblesse après tout ?
journal.document.city_warlock.new_power.title=Un nouveau pouvoir
journal.document.city_warlock.old_king.body=Nous sommes le 5e jour du 2e mois de la 33e année de l'âge de la magie. Si un surmonde lit ces lignes, c'est qu'il se trouve à l'hiver 264. Je m'appelle Thymor Zahir et, à ma connaissance, je suis le dernier membre survivant de la cour naine.\n\nNotre roi est mort, remplacé par l'un de mes anciens collègues qui est devenu fou de pouvoir. Le reste de la cour s'est soumis à lui, comme des imbéciles, et a perdu son libre arbitre dans le processus. Je suis le seul à l'avoir vu venir et à m'être enfui avant que son rituel ne s'achève.\n\nLe cercle intérieur est tombé, mais le pouvoir du nouveau roi n'a pas encore atteint tout le monde. Je dois organiser la résistance au plus vite. Je refuse de laisser notre glorieuse civilisation tomber aux mains de ce mégalomane !
journal.document.city_warlock.old_king.title=Le roi est mort
journal.document.city_warlock.resistance.body=La nouvelle semble s'être répandue rapidement. Cela ne fait que quelques jours et j'ai déjà rassemblé une petite armée de fidèles au vieux roi. Peu d'entre eux sont doués pour la magie, mais la quasi-totalité de l'ordre des moines guerriers se trouve parmi nous. Nous devrions faire plus que le poids face à un nain fou et à sa cour d'esclaves.\n\nPendant ce temps, le nouveau roi s'est caché dans les chambres intérieures de notre cité. Il a sans doute épuisé la majeure partie de son pouvoir et espère se rétablir avant de rencontrer plus de résistance.\n\nNous lancerons notre attaque dans quelques heures. Avec un peu de chance, nous pourrons former un conseil provisoire et rétablir la stabilité de notre merveilleuse cité d'ici la fin de la nuit.
journal.document.city_warlock.resistance.title=Une résistance
journal.document.city_warlock.seen_it.body=J'ai vu ce qui se trouve en dessous, mais je ne peux pas le décrire. Mes mains tremblent de façon incontrôlée lorsque j'essaie de mettre mes pensées par écrit.\n\nPourquoi cela se produit-il ? Le nouveau roi a-t-il fait cela ? Cela n'a aucun sens. Peut-être que son usage inconsidéré du pouvoir l'a attiré ? J'espérais sauver notre civilisation, mais je vois maintenant que le monde entier est en jeu.\n\nD'une certaine manière, le roi est un moindre mal. Je n'ai pas d'autre choix, pour le bien de tous, je vais me rendre. S'il vous plaît, guidez-moi, mon roi, utilisez-moi comme un instrument pour tenir Yog-Dzewa en échec !
journal.document.city_warlock.seen_it.title=Je l'ai vu
journal.document.city_warlock.title=Journal du sorcier
journal.document.halls_king.amulet.body=JE L'AI FAIT !\n\nJe ne savais pas ce que j'allais trouver exactement, mais ce que j'ai découvert là-bas a dépassé mes spéculations les plus folles. Il y a tant de pouvoir, juste là, prêt à être pris, et il est tout à moi !\n\nAvec ça, aucun des imbéciles de la cour n'osera s'opposer à moi. J'ai le vertige en pensant à toutes les façons dont je pourrais les humilier. Et pourquoi s'arrêter là, j'ai assez de pouvoir pour les détruire tous si je veux ! C'est peut-être excessif, mais je ne dois pas prendre trop de temps pour décider, sinon ils vont se méfier.\n\nJe crois que je vais appeler ce grand pouvoir l'Amulette de Yendor !\n- R.
journal.document.halls_king.amulet.title=L'amulette
journal.document.halls_king.attrition.body=J'ai un plan pour faire face à cette chose. Son pouvoir est infini, mais sa capacité à envahir ce monde ne l'est pas. Elle s'appuie sur des serviteurs et des avatars pour exécuter ses ordres pendant qu'elle essaie d'acquérir suffisamment de pouvoir pour s'emparer de l'amulette.\n\nBien que je ne possède pas l'amulette physiquement, j'ai toujours le contrôle total de son pouvoir. Avec toute la cité naine à ma disposition, j'ai aussi l'avantage du nombre. Je peux simplement continuer à envoyer des soldats pour l'empêcher de s'emparer de l'amulette et gagner cette guerre à l'usure !\n\nMOI, RODNEY, ROI DES NAINS, JE TE SURVIVRAI YOG-DZEWA !
journal.document.halls_king.attrition.title=Attrition
journal.document.halls_king.discover_hint=Vous pouvez trouver ce texte dans une région spécifique, mais seulement après avoir trouvé tous les textes précédents de cette série.
journal.document.halls_king.new_king.body=JE SUIS ROI, AHAHAHAAA !\n\nIls m'ont laissé faire ! Sans grande conviction, ils ont accepté que je "partage" ce pouvoir avec eux dans le cadre d'un grand rituel. En un instant, ils sont passés d'un chœur de voix moqueuses à ma nouvelle cour de sujets silencieux !\n\nComme on pouvait s'y attendre, Thymor s'est enfui comme un lâche au premier signe de difficulté. Je sens déjà la force de résistance qu'il est en train de mettre en place. Je pense que je vais lui permettre de continuer, afin qu'il puisse livrer tous ses conspirateurs à ma porte !\n\nIl est clair que le royaume ne me respecte pas non plus, je suppose que je vais régler ce problème également.\n- Roi des nains
journal.document.halls_king.new_king.title=Un nouveau roi
journal.document.halls_king.rejection.body=IMBECILES !\n\nAu cours des 33 dernières années, notre royaume a prospéré grâce à notre nouvelle technologie magique. Nous avons appris à invoquer les esprits élémentaires et à les plier à notre volonté, mais d'une manière ou d'une autre, la poursuite des expériences est désormais "trop dangereuse".\n\nJe sais ce qui se passe réellement. Le rejet de mes théories n'a rien à voir avec leur mérite et tout à voir avec la personne qui les suggère. Ils se moquent probablement tous de moi dans mon dos.\n\nEh bien, c'est fini ! Je me moque de ce qu'ils disent, j'explorerai seul les confins de notre univers et je garderai pour moi tout ce que je découvrirai !\n- R.
journal.document.halls_king.rejection.title=Rejet
journal.document.halls_king.ritual.body=Thymor m'a confronté publiquement plus tôt dans la journée et a insisté pour que j'explique ma nouvelle source de pouvoir. Je l'ai écarté du mieux que j'ai pu, mais je sens à nouveau le regard critique du reste de la cour sur moi.\n\nJ'avais espéré passer un peu plus de temps à profiter du calme avant la tempête, mais cela n'a pas vraiment d'importance. J'ai décidé de ce que je voulais faire. Je prétendrai que j'ai acquis mon pouvoir grâce à un nouveau rituel et je proposerai aux autres sorciers et au roi de l'accomplir. Une fois le rituel terminé, je serai roi !\n\nThymor protestera, bien sûr, mais avec une telle offre de pouvoir, je doute qu'ils l'écoutent !\n\nTOUS S'INCLINERONT DEVANT MOI !\n- Futur roi des nains
journal.document.halls_king.ritual.title=Le rituel
journal.document.halls_king.thing.body=Il y a un problème. Thymor a été expédié sans effort, mais il semble que mes recherches dans les plans extérieurs ne soient pas passées inaperçues.\n\nUne... 'chose'... a été attirée par mon monde et commence à se frayer un chemin au fond des salles inférieures. Pour compliquer les choses, c'est là que j'ai rangé l'amulette ! Quelle créature malveillante, pourquoi doit-elle essayer de me priver de mon pouvoir alors qu'il y en a encore beaucoup à prendre ?\n\nMalgré mon pouvoir, je ne pense pas que je puisse me contenter d'entrer et de me battre contre elle. Sa puissance est insondable, mais il doit y avoir un moyen de la limiter. JE DÉFENDRAI MON PRIX !
journal.document.halls_king.thing.title=La Chose
journal.document.halls_king.title=journal de bord
journal.document.intros.caves.body=Ces grottes peu peuplées s'étendent sous la prison abandonnée. Riches en minerais, elles étaient autrefois un centre de commerce et d'industrie pour la société naine, mais elles ont été abandonnées lorsque les nains sont devenus obsédés par la magie noire.\n\nLes grottes sont désormais habitées par la faune souterraine, des gnolls et des machines abandonnées, probablement corrompus par la même puissance que celle qui a affecté les régions supérieures.
journal.document.intros.caves.title=Grottes
journal.document.intros.city.body=La métropole naine était autrefois la plus grande des cités-états naines. À son apogée, les nains construisirent de merveilleuses machines de métal et de magie qui permirent à leur cité de s'étendre rapidement.\n\nPuis, un jour, les portes de la ville furent fermées et personne n'entendit plus parler des nains. Les rares personnes qui s'échappèrent de la ville au moment de sa fermeture racontèrent l'histoire d'un sorcier fou qui avait volé le trône, et de la terrible magie qu'il avait appris à maîtriser.
journal.document.intros.city.title=Métropole naine
journal.document.intros.discover_hint=Vous trouverez ce texte en entrant pour la première fois dans une région spécifique.
journal.document.intros.dungeon.body=De nombreux héros se sont aventurés dans le donjon avant vous depuis la ville d'en haut, mais la plupart d'entre eux n'ont plus jamais donné signe de vie.\n\nOn dit qu'un mal ancien se cache dans les profondeurs, gardant la toute-puissante Amulette de Yendor. Aujourd'hui encore, une énergie sombre rayonne des profondeurs, se frayant un chemin jusqu'à la ville.\n\nSaurez-vous conquérir le donjon et vous emparer de l'amulette ? Il est temps de commencer votre propre aventure !
journal.document.intros.dungeon.title=Donjon
journal.document.intros.halls.body=Ces profondes salles de la métropole naine ont été tordues par la magie noire. Autrefois, ces régions accueillaient la cour des sorciers d'élite du roi des nains, mais aujourd'hui, elles semblent avoir été envahies par quelque chose d'encore plus sinistre...\n\nToutes sortes d'horribles créatures démoniaques peuplent ces salles, sous la houlette d'une terrible puissance obscure. Si le roi des nains n'est pas à l'origine de la corruption qui se répand, ce qui se trouve ici doit l'être.\n\nSoyez prudent, très peu d'aventuriers sont descendus aussi loin...
journal.document.intros.halls.discover_hint=Vous pouvez trouver ce texte dans une région spécifique, mais seulement après avoir trouvé tous les textes précédents de cette série.
journal.document.intros.halls.title=Salles des démons
journal.document.intros.prison.body=Il y a de nombreuses années, une prison a été construite ici pour accueillir les criminels dangereux. Réglementée de manière stricte et sécurisée, des condamnés de tout le pays étaient amenés ici pour purger leur peine.\n\nMais bientôt, de sombres miasmes commencèrent à s'infiltrer par le bas, troublant l'esprit des gardiens et des prisonniers.\n\nFace au chaos qui s'installait, la ville a fermé l'ensemble de la prison. Personne ne sait ce qu'il est advenu de ceux qui ont été laissés pour morts entre ces murs...
journal.document.intros.prison.title=Prison
journal.document.intros.sewers.body=Les étages supérieurs du donjon constituent en fait le réseau d'égouts de la ville.\n\nAu fur et à mesure que l'énergie noire remonte des profondeurs, les créatures d'égout, habituellement inoffensives, sont devenues de plus en plus féroces. La ville a dû envoyer des patrouilles de gardes pour tenter de maintenir la sécurité des habitants des étages supérieurs.\n\nCet endroit est dangereux, mais au moins la magie maléfique qui y règne est faible.
journal.document.intros.sewers.title=Les égouts
journal.document.intros.title=Présentation des régions
journal.document.prison_warden.discover_hint=Vous pouvez trouver ce texte dans une région spécifique, mais seulement après avoir trouvé tous les textes précédents de cette série.
journal.document.prison_warden.journal.body=1er printemps, 362\n\nVoici la première entrée du journal de travail de la directrice de prison Kiana Smith. Avec tout ce qui s'est passé ces derniers temps, j'ai décidé de commencer un journal pour mettre de l'ordre dans mes pensées.\n\nGérer une prison à 500 mètres sous terre n'a jamais été facile, mais ces derniers temps, il semble qu'une sorte de perturbation organisée se produise. Les détenus agissent sans raison et refusent d'expliquer pourquoi.\n\nCertains gardiens commencent à dire que l'endroit est hanté. Je ne peux pas laisser mon personnel répandre des rumeurs, mais je ne peux pas vraiment leur reprocher d'être mal à l'aise.\n- Smith
journal.document.prison_warden.journal.title=Tenir un journal
journal.document.prison_warden.letter.body=Thomas,\n\nTu as été un grand ami, alors je te fais une faveur.\n\nQuand tu prendras ton service ce soir, verrouille et renforce la cellule de Tengu, jette la clé dans une alcôve et sors. Peu importe que les autres prisonniers soient sans surveillance, bientôt plus personne ne pourra quitter cet endroit. Ce monstre doit rester en sécurité, car s'il s'échappe, on ne sait pas ce qu'il fera.\n\nN'en parlez à personne et ne me cherchez pas. Un capitaine doit sombrer avec son navire.\n- Kiana
journal.document.prison_warden.letter.title=Lettre à Thomas
journal.document.prison_warden.mines.body=54e jour de l'hiver, 363\n\nUn groupe d'ingénieurs de la ville est venu aujourd'hui, disant qu'ils sont ici pour sceller l'ancienne entrée des mines en contrebas. Je suppose que la ville ne veut plus s'embêter à entretenir le passage. Je n'ai pas été informé au préalable, comme d'habitude.\n\nLeur ingénieur en chef m'a aussi raconté des bêtises sur la magie naine qui s'infiltrerait dans les mines. Je n'en crois pas un mot.\n\nLa situation est beaucoup mieux maîtrisée avec notre nouveau personnel, mais le fond du problème n'a toujours pas été abordé. Quelque chose affecte les détenus ici, et ce n'est pas en abattant quelques murs qu'on y changera quelque chose.\n- Smith
journal.document.prison_warden.mines.title=Sceller les mines
journal.document.prison_warden.no_support.body=11e jour du printemps, 364\n\nMais à quoi pense donc la ville ? Après avoir demandé de l'aide de toute urgence, je n'ai rien entendu, pas même des excuses vides de sens comme ils en envoient habituellement lorsque mes demandes sont rejetées.\n\nPendant ce temps, la situation des détenus continue de s'aggraver, et certains gardiens ont même commencé à causer des problèmes. Ont-ils l'intention de laisser la situation empirer jusqu'à ce que nous ayons affaire à une émeute ?\n\nThomas est toujours aussi fiable. Son aide en matière d'organisation a été inestimable, et son idée d'activer ces vieilles unités DM-100 était regrettable mais nécessaire. Je suis sûr de pouvoir reprendre la situation en main, j'ai juste besoin d'un sacré soutien !\n-Smith
journal.document.prison_warden.no_support.title=Pas de soutien
journal.document.prison_warden.recruits.body=80e anniversaire du printemps, 362\n\nComme promis, un groupe de nouvelles recrues est arrivé aujourd'hui. Comme d'habitude, il y a quelques recrues prometteuses et beaucoup d'hommes de main qui ne veulent que leur salaire. Néanmoins, l'arrivée de tous ces nouveaux muscles devrait nous aider à gérer nos récents détenus indisciplinés.\n\nDans un travail comme celui-ci, il est important de savoir à qui l'on peut faire confiance. Un nouvel employé, Thomas, semble particulièrement prometteur. J'ai besoin de toute l'aide possible en ce moment, alors s'il se débrouille bien, je ferai en sorte qu'il soit promu rapidement.\n- Smith
journal.document.prison_warden.recruits.title=Nouvelles recrues
journal.document.prison_warden.rotberry.body=23e anniversaire de l'automne, 363\n\nJ'ai reçu un beau cadeau de Felix aujourd'hui. Il s'agit d'une sorte d'arbuste rouge vif appelé 'Rotberry'.\n\nJe lui ai déjà dit à quel point cet endroit était morne, et il semble qu'il m'ait écouté. D'après lui, cette plante n'aime ni la lumière ni l'eau, et je dois donc tailler les feuilles une fois par mois environ. La taille doit être importante, il l'a mentionnée une douzaine de fois dans sa lettre.\n\nBien sûr, Felix ne fait jamais rien gratuitement. Il dit que les graines produites par cette plante sont excellentes pour fabriquer des baguettes, alors je lui en dois quelques unes chaque fois que la plante en produit.\n- Smith
journal.document.prison_warden.rotberry.title=Raisin de cuve
journal.document.prison_warden.title=Journal du gardien
journal.document.sewers_guard.crabs.body=11e de l'hiver, 376\nChers papa et maman,\n\nComme si les rats ne suffisaient pas, plus bas, il y a des crabes géants ! L'un d'eux m'a foncé dessus et a bien amoché Lee avant que nous ne le tuions. Thomas dit que ce n'est pas ma faute, mais je sais qu'il essaie juste d'être gentil avec moi.\n\nHeureusement, en sortant, nous sommes tombés sur un aventurier qui avait de la pommade d'herbe de soleil en réserve. Lee n'aurait peut-être pas survécu sans ce produit.\n\nJ'ai vu l'aventurier fixer une rose avant qu'ils ne partent, ils ont dit que c'était un cadeau. Pourquoi risqueraient-ils leur vie ici si quelqu'un tient tant à eux ?\n\nC'est exactement ce que je fais, n'est-ce pas ? J'ai l'impression d'être dépassé par les événements.
journal.document.sewers_guard.crabs.title=Crabes géants !
journal.document.sewers_guard.dangerous.body=88e anniversaire de l'automne, 375\nChers papa et maman,\n\nJe comprends pourquoi la paie est si bonne maintenant, les égouts sont infestés de monstres ! La " vermine " et les " hors-la-loi " sont des rats géants assoiffés de sang et des meutes de gnolls enragés.\n\nHeureusement, le reste de mon équipe sait vraiment ce qu'il fait. Notre capitaine, Thomas, est un expert en la matière. J'essaie d'apprendre rapidement pour ne pas être un fardeau.\n\nCe travail est beaucoup plus dangereux que je ne le pensais. Je suis content de ne pas pouvoir les envoyer maintenant, je ne veux pas que tu t'inquiètes.\n\nJe veillerai à votre sécurité,\n- Sonya
journal.document.sewers_guard.dangerous.title=Une position dangereuse...
journal.document.sewers_guard.discover_hint=Vous pouvez trouver ce texte dans une région spécifique, mais seulement après avoir trouvé tous les textes précédents de cette série.
journal.document.sewers_guard.guild.body=23e anniversaire de l'hiver, 376\nChers papa et maman,\n\nPas de nouveaux monstres cette fois-ci, nous sommes tombés sur un petit groupe de la guilde des voleurs lors d'une patrouille.\n\nTout ce que j'ai entendu sur la guilde est mauvais, mais le reste de mon équipe semblait presque amical avec eux. Thomas a échangé des informations et des provisions avec l'un d'entre eux avant de partir chacun de son côté.\n\nJe ne comprends pas, n'étions-nous pas censés nous débarrasser des hors-la-loi ? Thomas a même dit de ne pas en parler au commandement. Leurs informations et leurs provisions étaient pourtant très utiles, et nous ne pouvions pas supporter davantage de combats.\n\nJe suppose que nous sommes tous dans le même bateau ici.
journal.document.sewers_guard.guild.title=La guilde des voleurs
journal.document.sewers_guard.lost.body=40e de l'hiver, 376\n\nThomas et moi sommes perdus. Nous nous sommes éloignés du reste de l'équipe en combattant des gnolls. Nous ne sommes pas blessés, mais les égouts inférieurs sont un véritable labyrinthe.\n\nThomas dit qu'il connaît une sortie, mais elle commence à l'entrée de l'ancienne prison, au fond des égouts. Je n'aime vraiment pas aller plus loin, mais nous n'avons pas de rations et descendre est bien plus rapide que d'errer à la recherche de notre chemin de patrouille.\n\nTout ira bien. Thomas sait ce qu'il fait.
journal.document.sewers_guard.lost.title=Nous sommes perdus
journal.document.sewers_guard.new_position.body=85e anniversaire de l'automne, 375\nChers papa et maman,\n\nJe vous avais dit que le travail acharné à la garde municipale porterait ses fruits. Je viens d'être promu !\n\nJ'ai été invité à rejoindre une équipe spécialisée qui travaille dans les égouts. Apparemment, il y a des problèmes avec la vermine et les hors-la-loi, et c'est notre travail de les éliminer. C'est un travail salissant, mais les égouts sont chauds en hiver et ça rapporte trois fois plus qu'un poste de garde normal !\n\nMais c'est un peu secret, alors je ne peux pas t'envoyer cette lettre. Cela me fait bizarre de ne pas t'écrire, alors je vais continuer à le faire. Peut-être que je pourrai te les montrer un jour.\n\nJe t'embrasse bien fort,\n- Sonya
journal.document.sewers_guard.new_position.title=Mon nouveau poste !
journal.document.sewers_guard.not_worth.body=Thomas et moi sommes tombés sur une sorte d'énorme monstre de suie à l'entrée de la prison. Avant que nous ayons pu réagir, il nous a bombardés de magie. Thomas en a pris la plus grande partie. Il n'est plus là.\n\nAucune somme d'argent ne vaut ça. Je vais partir par le chemin dont Thomas m'a parlé. Ensuite, je prendrai ce que j'ai gagné en tant que garde et je l'utiliserai pour nous éloigner, mes parents et moi, de cette ville maudite. Une partie de moi veut espérer que le roi a un plan pour tout cela, mais j'en doute.\n\nJe laisse ces lettres derrière moi pour avertir les autres. Il n'y a pas que des rats et des crabes géants, il y a quelque chose qui ne tourne pas rond ici.
journal.document.sewers_guard.not_worth.title=Cela n'en vaut pas la peine
journal.document.sewers_guard.title=Lettres du garde
