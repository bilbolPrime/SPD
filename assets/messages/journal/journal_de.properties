journal.document.adventurers_guide.alchemy.body=Wenn du einen Verbrauchsgegenstand nicht nützlich findest, kannst du ihn als Alchemiezutat verwenden oder in universelle Alchemieenergie umwandeln. Auch Energietränke und Schriftrollen kennzeichnen sie! Schmuckstücke sind eine einzigartige Ausrüstungsart, die mithilfe von Alchemie hergestellt und verbessert wird. Sie werden mit einem magischen Schmuckstückkatalysator und etwas Alchemieenergie gefertigt. (Der erste Alchemietopf befindet sich im 3. oder 4. Stock des Dungeons. In der Nähe dieser Töpfe befinden sich auch Seiten aus Alchemie-Rezeptbüchern.)
journal.document.adventurers_guide.alchemy.title=Alchemie & Schmuckstücke
journal.document.adventurers_guide.dieing.body=Dungeon-Abenteuer sind gefährlich und die meisten finden irgendwann ihr Ende. Glück hilft, aber die besten Abenteurer nutzen jeden noch so kleinen Trick, um ihre Chancen zu verbessern. (Sei nicht enttäuscht, wenn du oft stirbst, dieses Spiel ist schwer! Konzentriere dich darauf, das Spiel zu lernen und dich stetig zu verbessern, nicht darauf, sofort zu gewinnen.)
journal.document.adventurers_guide.dieing.title=Umgang mit Niederlagen
journal.document.adventurers_guide.examining.body=Es ist wichtig, deine Gegner und deine Umgebung zu studieren, anstatt blindlings loszustürmen! Gewöhne dir an, alles Neue zu untersuchen. (Du kannst die Lupe benutzen, um etwas genauer zu untersuchen und dann auszuwählen, was du untersuchen möchtest. Du kannst auch Buffs oder Debuffs untersuchen, indem du ihre Symbole auswählst.)
journal.document.adventurers_guide.examining.title=Untersuchung
journal.document.adventurers_guide.food.body=Effektives Rationieren ist eine der besten Möglichkeiten, die Überlebenschancen zu erhöhen. Man muss nicht immer sofort essen, wenn man Hunger hat! Solange man nicht hungert, regeneriert sich die Gesundheit langsam. Isst man also bei voller Gesundheit, ist diese Regeneration verschwendet! Wenn man seine Mahlzeiten dem Gesundheitszustand anpasst, reicht das Essen viel länger.
journal.document.adventurers_guide.food.title=Umgang mit Hunger
journal.document.adventurers_guide.identifying.body=Die Farben der Tränke und Symbole auf den Schriftrollen unterscheiden sich in jedem Dungeon. Unbekannte Ausrüstung lässt sich mit etwas Glück verbessern oder verzaubern, sie kann aber auch verflucht sein! Schriftrollen zum Identifizieren, Verbessern oder Entfernen von Flüchen sind sehr nützlich, um das Risiko beim Benutzen unbekannter Ausrüstung zu minimieren. (Eine Liste aller identifizierten Gegenstände findest du im Katalog-Tab deines Tagebuchs.)
journal.document.adventurers_guide.identifying.title=Gegenstände identifizieren
journal.document.adventurers_guide.intro.body=Seid gegrüßt, Abenteurer! Ihr lest den Folianten der Dungeon-Meisterschaft! Dieser Leitfaden dient am besten als Nachschlagewerk und zeigt euch auf magische Weise an, wann ihr welche Seite am besten lesen solltet. (Wenn die Tagebuch-Schaltfläche blinkt, wählt sie aus, um zu lesen, was der Leitfaden euch mitteilt! Einige Seiten fehlen allerdings; vielleicht findet ihr sie im Dungeon?)
journal.document.adventurers_guide.intro.title=Einführung
journal.document.adventurers_guide.levelling.body=Durch Stufenaufstiege verbessern sich deine Werte und du erhältst Talentpunkte, was im Kampf einen großen Unterschied machen kann. Es empfiehlt sich, mindestens eine Stufe pro Ebene des Dungeons zu haben. Es mag verlockend sein, sich zu beeilen und Erkundung oder Kämpfe zu vermeiden, aber dadurch verlierst du Vorräte und Erfahrung. (Informationen zu deinem Helden, einschließlich seiner Erfahrungspunkte, findest du im Statusbereich in der Ecke der Spieloberfläche. Wähle dein Heldenporträt aus, um noch mehr Informationen zu erhalten.)
journal.document.adventurers_guide.levelling.title=Erfahrungen sammeln
journal.document.adventurers_guide.looting.body=Räume hinter verschlossenen Türen oder mit Hindernissen enthalten in der Regel wertvollere Beute. Wenn ein Hindernis deinen Weg versperrt, findest du meist auf derselben Ebene einen hilfreichen Gegenstand. In jedem fünfstöckigen Dungeon findest du immer 2 Stärketränke und 3 Schriftrollen der Verbesserung. Sie sind daher ein guter Indikator dafür, wie gut du die Umgebung erkundest. (Eine Liste der Orientierungspunkte und ungenutzten Schlüssel findest du im Notizen-Tab des Tagebuchfensters.)
journal.document.adventurers_guide.looting.title=Effektives Plündern
journal.document.adventurers_guide.magic.body=Magische Angriffe durchdringen Rüstungen und sind schwer auszuweichen. Das bedeutet, dass Zauberstäbe zwar sehr zuverlässig Schaden verursachen, magische Gegner aber auch sehr gefährlich machen! Magische Angriffe haben jedoch immer einen Nachteil. Zauberstäbe haben eine begrenzte Anzahl an Ladungen, und magische Gegner können ihre Magie normalerweise nicht im Nahkampf einsetzen. Wenn man Gegnern gegenübersteht, die Magie einsetzen, ist es wichtig zu lernen, wie man sich davor schützt.
journal.document.adventurers_guide.magic.title=Magische Angriffe
journal.document.adventurers_guide.positioning.body=Strategie ist genauso wichtig wie Ausrüstung. Ungünstige Situationen wie das Einkesseln lassen sich meist durch gute Positionierung vermeiden. Beispielsweise haben die meisten Dungeons enge Gänge, die Gegner zwingen, einzeln gegen dich zu kämpfen. Diese Gänge bieten oft auch Möglichkeiten für Überraschungsangriffe! Es gibt viele kleine Wege, Umgebungselemente wie Gras, Wasser, Gruben oder Fallen zu deinem Vorteil zu nutzen.
journal.document.adventurers_guide.positioning.title=Positionierung
journal.document.adventurers_guide.searching.body=Dungeons sind voller geheimer Türen und Fallen, die auf den ersten Blick unsichtbar erscheinen. Wenn du vermutest, dass sich in der Nähe eine Tür oder Falle verbirgt, kannst du dir Zeit nehmen und sorgfältig suchen. (Du kannst alle Felder in deiner Umgebung untersuchen, indem du zweimal auf die Lupe klickst. Vielleicht befinden sich in der Nähe des Ortes, an dem du diese Seite gefunden hast, versteckte Türen!)
journal.document.adventurers_guide.searching.title=Suche
journal.document.adventurers_guide.strength.body=Da keine Zeit zum Üben mit den im Dungeon gefundenen Waffen und Rüstungen bleibt, ist rohe Gewalt nötig, um sie effektiv einzusetzen. Stärketränke und Aufwertungsrollen sind der effektivste Weg, die Stärkeanforderungen höherwertiger Ausrüstung zu erfüllen. Es ist wichtig, irgendwann hochstufige Gegenstände zu verwenden, aber vernachlässige nicht die Ausrüstung, die du jetzt schon benutzen kannst.
journal.document.adventurers_guide.strength.title=Stärke
journal.document.adventurers_guide.surprise_attacks.body=Überraschungsangriffe treffen garantiert und sind daher besonders nützlich gegen ausweichende Gegner wie Schlangen und Geister. Du kannst Gegner überraschen, sobald sie dich verfolgen und durch eine Tür gehen, oder wenn sie dich aus den Augen verlieren.
journal.document.adventurers_guide.surprise_attacks.title=Überraschungsangriffe
journal.document.adventurers_guide.title=Wälzer der Dungeons
journal.document.adventurers_guide.upgrades.body=Je tiefer du in einen Dungeon vordringst, desto wichtiger ist magisch verbesserte Ausrüstung der höchsten Stufe. Du benötigst aber auch die nötige Stärke, um sie richtig einzusetzen. Zauberstäbe, Ringe und Artefakte benötigen keine Stärke, sind aber nur begrenzt einsetzbar oder helfen im Kampf nicht so direkt. Die richtige Wahl deiner Ausrüstungsgegenstände ist entscheidend für dein Überleben zu Beginn des Dungeons und für deinen späteren Erfolg.
journal.document.adventurers_guide.upgrades.title=Upgrades
journal.document.alchemy_guide.bombs.body=Eine herkömmliche Schwarzpulverbombe kann mit einem bestimmten Stoff vermischt werden, um eine verstärkte Bombe herzustellen.
journal.document.alchemy_guide.bombs.title=Verbesserte Bomben
journal.document.alchemy_guide.brews_elixirs.body=Tränke und Elixiere sind fortgeschrittene Zaubertränke mit vielfältigen Wirkungen, die in der Regel nur einmal verwendet werden können.
journal.document.alchemy_guide.brews_elixirs.title=Gebräue und Elixiere
journal.document.alchemy_guide.energy_food.body=Viele Rezepte benötigen kristalline Alchemieenergie, die durch das Zerlegen von Verbrauchsmaterialien in einem Alchemiekessel gewonnen wird. Auch das Energetisieren von Tränken oder Schriftrollen kennzeichnet sie. Einige Rezepte, die Energie benötigen, sind magisch, ähneln aber der traditionellen Küche.
journal.document.alchemy_guide.energy_food.title=Energie und Nahrung
journal.document.alchemy_guide.exotic_potions.body=Tränke lassen sich mit Energie kombinieren, um exotische Tränke herzustellen. Diese haben stärkere Wirkungen, sind aber oft auf andere Weise nützlich.
journal.document.alchemy_guide.exotic_potions.title=exotische Tränke
journal.document.alchemy_guide.exotic_scrolls.body=Exotische Schriftrollen lassen sich mit etwas Energie und einer Schriftrolle herstellen. Sie sind etwas stärker und teurer als exotische Tränke.
journal.document.alchemy_guide.exotic_scrolls.title=exotische Schriftrollen
journal.document.alchemy_guide.potions.body=Willkommen zu „Praktische Anwendungen der Alchemie“! Dieses Buch ist ein Nachschlagewerk mit Rezepten zum Herstellen von Gegenständen am Alchemiekessel. Wir beginnen mit dem bekanntesten Rezept: Tränke! Verwende drei Samen, um einen zufälligen Trank zu brauen! Jeder Samen hat einen entsprechenden Trank. Verwende mehrere gleiche Samen, um die Wahrscheinlichkeit zu erhöhen, dass der Trank zu den verwendeten Samen passt.
journal.document.alchemy_guide.potions.title=Einführung und Tränke
journal.document.alchemy_guide.spells.body=Zaubersprüche sind in Kristallen enthalten und bieten eine Vielzahl von Effekten, die in der Regel mehrfach verwendet werden können.
journal.document.alchemy_guide.spells.title=Zaubersprüche
journal.document.alchemy_guide.stones.body=Wenn man eine Schriftrolle in einen Alchemiekessel gibt, überträgt sich ihre Magie auf zwei Steine im Kessel. Dadurch entstehen Runensteine, die die Schriftrolle identifizieren!
journal.document.alchemy_guide.stones.title=Runensteine herstellen
journal.document.alchemy_guide.title=Alchemie-Leitfaden
journal.document.alchemy_guide.weapons.body=Einige der leichteren oder magischeren Waffen können in der Alchemie verwendet werden! Jedes Wurfwaffenset erzeugt genug flüssiges Metall, um ein anderes Set derselben Stufe und Klasse vollständig zu reparieren. Beachte, dass die Alchemie eines Sets das gesamte Set zerstört, selbst wenn nicht alle Teile vorhanden sind! Ein Zauberstab erzeugt genug arkanes Harz, um zwei Zauberstäbe derselben Stufe aufzuwerten, jedoch nicht höher als +3.
journal.document.alchemy_guide.weapons.title=Waffenverbesserung
journal.document.caves_explorer.alive.body=23. Sommer 308\n\nEine der Zwergenmaschinen erwachte auf unerklärliche Weise zum Leben! Wir gingen gerade vorbei, als sie angriff und beinahe zwei von uns mit ihren riesigen Metallfäusten zerquetschte. Zum Glück hatte ich meinen Zersetzungszauberstab dabei. Ein paar gezielte Stöße, und das Ungetüm war nur noch Schrott.\n\nWas mich beunruhigt, ist, dass wir absolut nichts getan haben, um die Maschine zu provozieren. Die Zwerge können die Maschinen unmöglich so aggressiv konstruiert haben, es ist, als ob sie uns in einen Hinterhalt locken wollte!\n\nWenigstens konnte ich meinen Gefährten ausnahmsweise einmal helfen.\n- Archibald
journal.document.caves_explorer.alive.title=Es lebt!
journal.document.caves_explorer.city.body=21. Sommer 308\n\nWir sind nun bei der Drei-Wochen-Marke angelangt, und nachdem wir die letzten zehn Tage damit verbracht haben, immer tiefer vorzudringen, haben wir endlich den Grund der Minen erreicht. Wir fanden verschiedene Metallvorrichtungen und ein großes Tor, das den Zugang zur alten Zwergenmetropole versperrt.\n\nDer Schmied warnte uns vor einigen dieser Maschinen. Sie dienten offenbar der Gebietsverteidigung und neigen dazu, sich bei Berührung zu aktivieren. Wir haben in der Stadt nichts zu suchen, und das Metall hätte nur minimalen Schrottwert, daher hielten wir es für das Beste, seiner Warnung zu folgen und umzukehren.\n\nIch muss zugeben, ich war neugierig, aber dort unten Nachforschungen anzustellen, war das Risiko sicherlich nicht wert.\n- Archibald
journal.document.caves_explorer.city.title=Der Stadteingang
journal.document.caves_explorer.discover_hint=Diesen Text finden Sie in einem bestimmten Bereich, jedoch erst, nachdem Sie alle vorherigen Texte dieser Reihe gefunden haben.
journal.document.caves_explorer.expedition.body=1. Sommer 308\n\nHeute beginnt unsere vierwöchige Expedition in die verlassenen Zwergenminen! Ich wurde vom König persönlich beauftragt, die Region zu erkunden. Meine Hauptziele sind, unerschlossene Bodenschätze zu finden und die Höhlen für ein mögliches Gefängnisbauprojekt zu untersuchen.\n\nObwohl ich mich selbst verteidigen kann, habe ich auf Drängen des Königs eine Eskorte der Stadtwache akzeptiert. Sie sind zwar ein Haufen Dummköpfe, aber solange sie mich nicht aufhalten, ist ihre Anwesenheit erträglich.\n\nWir sollen die Abwasserkanäle freigeräumt haben und die Minen bis zum Abend erreichen.\n- Archibald Drummond. Erzmagier, Südliches Zauberinstitut.
journal.document.caves_explorer.expedition.title=Expeditionsstart!
journal.document.caves_explorer.gold.body=4. Sommer 308\n\nUnsere ersten Tage waren in der Tat sehr ertragreich! Nachdem wir ein Basislager errichtet hatten, machten wir uns auf, einige der oberen Bereiche der verlassenen Mine zu erkunden. Zwar gibt es jede Menge nutzlosen Kram, den die Zwerge zurückgelassen haben, aber viele Höhlenwände sind auch voller Gold!\n\nLeider sind wir nicht die Ersten hier. Die Höhlen sind voller aggressiver Wildtiere, und es scheint, dass auch Rudel von Gnollen Interesse am Gold haben. Ich gebe zu, dass ich meiner Wache gegenüber unfair war; sie waren viel fähigere Erkunder und Leibwächter, als ich erwartet hatte.\n\nTrotz dieses Erfolgs haben wir noch einen Großteil der Minen zu erkunden.\n- Archibald
journal.document.caves_explorer.gold.title=So viel Gold!
journal.document.caves_explorer.report.body=28. Sommer 308\n\nHeute packen wir unsere Sachen fertig und bereiten uns auf die Abreise vor. Gerade noch rechtzeitig, denn einige aus unserer Gruppe haben nach dem Vorfall mit der aggressiven Maschine schreckliche Albträume. Wahrscheinlich ist es nur Erschöpfung, aber ihre Albträume ähneln sich alle beunruhigend.\n\nZusammenfassend lässt sich sagen, dass die oberen Bereiche der Mine recht sicher sind. Wenn man eine Verwendung für das dunkle Gold finden könnte, wäre der Abbau möglicherweise sehr lukrativ. Die großen, offenen Flächen würden sich auch sehr gut für die Baupläne der Stadt eignen. Die unteren Minen sind jedoch gefährlicher und sollten gemieden werden.\n\nIch werde das alles in den nächsten Tagen in meinen Abschlussbericht schreiben.\n- Archibald
journal.document.caves_explorer.report.title=Abschlussbericht
journal.document.caves_explorer.title=Logbuch des Entdeckers
journal.document.caves_explorer.troll.body=11. Sommer, 308\n\nNachdem wir unsere Erkundung des mittleren Minenabschnitts begonnen hatten, trafen wir auf ein freundliches Gesicht! Nun ja … relativ freundlich. Ein Höhlentroll hatte dort eine kleine Schmiede eingerichtet. Er war mürrisch und nicht sehr gesprächig, reparierte aber unsere Ausrüstung im Tausch gegen etwas Gold.\n\nLeider teilte uns der Trollschmied auch mit, dass all dieses schöne Gold nicht ganz so gut sei, wie es scheine. Er nannte es „dunkles Gold“, und es zersetze sich anscheinend schnell im Sonnenlicht. Das würde sicherlich erklären, warum es hier nie Konflikte um die Ressourcen gab.\n\nIch nehme an, wir müssen etwas tiefer graben, um zu sehen, ob es etwas Wertvolleres gibt.\n- Archibald
journal.document.caves_explorer.troll.title=Ich bin einem Troll begegnet
journal.document.city_warlock.discover_hint=Diesen Text finden Sie in einem bestimmten Bereich, jedoch erst, nachdem Sie alle vorherigen Texte dieser Reihe gefunden haben.
journal.document.city_warlock.failure.body=Offenbar bin auch ich ein Narr. Ich nahm an, der neue König brauche den freiwilligen Gehorsam des Hofes, doch nun sehe ich, dass er selbst jene kontrollieren kann, die ihm Widerstand leisten. Blindlings brachte ich die stärkste Opposition vor seine Tür, um sie persönlich zu versklaven. Nun durchfluten Wellen seiner nekrotischen Energie die Stadt und verwandeln die meisten augenblicklich in seine Bittsteller. Die wenigen, die noch freien Willen besitzen, fliehen. Ich habe beschlossen, zurückzubleiben, um so gut wie möglich zu beobachten und nach einer Gelegenheit Ausschau zu halten. Mit meiner magischen Kraft sollte ich mich eine Zeitlang verstecken und in Sicherheit bleiben können.
journal.document.city_warlock.failure.title=Versagen
journal.document.city_warlock.more_powerful.body=Es fällt mir schwer, die Zeit im Blick zu behalten, aber seit meinem letzten Eintrag ist etwa eine Woche vergangen. Unsere Zivilisation ist endgültig zusammengebrochen. Die Tore sind geschlossen, alle Funktionen unserer Gesellschaft sind zum Erliegen gekommen, und leere Zwergenhüllen irren durch die Hallen. Trotz allem wird der Neue König irgendwie immer mächtiger. Sein Wille wird von Tag zu Tag stärker, aber er verändert sich auch. Ich kann es nicht beschreiben, aber es fühlt sich an, als wäre er gar kein Zwerg mehr. Ich beginne zu akzeptieren, dass ich wohl nichts Besseres tun kann, als diese Ereignisse zu dokumentieren. Ich werde so lange wie möglich hierbleiben und mich zurückziehen, sobald mein Wille schwächer wird.
journal.document.city_warlock.more_powerful.title=Leistungsstärker
journal.document.city_warlock.new_power.body=Was geschieht hier? Die Macht, die vom Neuen König ausgeht, ist tatsächlich anders als anfangs, aber da ist noch etwas anderes. Diese neue Macht scheint aus den innersten Hallen unserer Stadt zu strahlen. Noch rätselhafter ist, dass auch die Aktivität in der oberen Metropole nachgelassen hat. Ich weiß nicht, was dort unten vor sich geht, aber es zieht fast die gesamte Aufmerksamkeit des Neuen Königs auf sich. Die Rückkehr in die tiefen Hallen wird gefährlich sein, aber ich muss herausfinden, was diese Veränderung verursacht. Hat der Neue König vielleicht doch eine Schwäche?
journal.document.city_warlock.new_power.title=Eine neue Macht
journal.document.city_warlock.old_king.body=Es ist der fünfte Tag des zweiten Monats im 33. Jahr des Zeitalters der Magie. Falls dies ein Bewohner der Oberwelt liest, befindet er sich irgendwann im Winter 264. Mein Name ist Thymor Zahir, und meines Wissens bin ich das letzte überlebende Mitglied des Zwergenhofs. Unser König ist tot, ersetzt durch einen meiner ehemaligen Kollegen, der dem Machtwahn verfallen ist. Der Rest des Hofes unterwarf sich ihm, wie die Narren, die sie sind, und verlor dabei seinen freien Willen. Ich allein sah dies kommen und floh, bevor sein Ritual vollendet werden konnte. Der innere Zirkel ist gefallen, doch die Macht des neuen Königs hat noch nicht alle erreicht. Ich muss so schnell wie möglich Widerstand leisten. Ich weigere mich, unsere glorreiche Zivilisation diesem Größenwahnsinnigen zum Opfer fallen zu lassen!
journal.document.city_warlock.old_king.title=Der König ist tot
journal.document.city_warlock.resistance.body=Die Nachricht hat sich schnell verbreitet. Erst wenige Tage sind vergangen, und ich habe bereits eine kleine Armee von Anhängern des Alten Königs um mich geschart. Nur wenige beherrschen die Magie, doch fast der gesamte Orden der Kriegermönche ist unter uns. Wir sollten einem wahnsinnigen Zwerg und seinem Sklavenhof mehr als gewachsen sein. Derweil hat sich der Neue König in den inneren Gemächern unserer Stadt versteckt. Zweifellos hat er den Großteil seiner Macht verbraucht und hofft, sich zu erholen, bevor er auf weiteren Widerstand stößt. Wir werden unseren Angriff in wenigen Stunden starten. Mit etwas Glück gelingt es uns, einen provisorischen Rat zu bilden und unsere wundervolle Stadt bis zum Ende der Nacht wieder zu stabilisieren.
journal.document.city_warlock.resistance.title=Ein Widerstand
journal.document.city_warlock.seen_it.body=Ich habe gesehen, was unten liegt, aber ich kann es nicht beschreiben. Meine Hände zittern unkontrolliert, während ich versuche, meine Gedanken niederzuschreiben. Warum geschieht das? Hat der Neue König das getan? Es ergibt keinen Sinn. Vielleicht hat sein maßloser Machtmissbrauch es heraufbeschworen? Ich hatte gehofft, unsere Zivilisation zu retten, aber jetzt sehe ich, dass die ganze Welt in Gefahr ist. Irgendwie ist der König das kleinere Übel. Ich habe keine andere Wahl, für das Gemeinwohl werde ich mich ergeben. Bitte leite mich, mein König, benutze mich als Werkzeug, um Yog-Dzewa in Schach zu halten!
journal.document.city_warlock.seen_it.title=Ich habe es gesehen.
journal.document.city_warlock.title=Tagebuch des Hexenmeisters
journal.document.halls_king.amulet.body=ICH HABE ES GESCHAFFT! ZXQPH0 ZXQ ZXQPH1 ZXQ Ich wusste nicht genau, was ich finden würde, aber was ich da draußen entdeckte, übertraf meine kühnsten Spekulationen. So viel Macht, einfach da, bereit, genommen zu werden, und sie gehört ganz mir! ZXQPH2 ZXQ ZXQPH3 ZXQ Damit wird keiner der Narren am Hof es wagen, sich mir zu widersetzen. Ich bin ganz aufgeregt bei dem Gedanken an all die verschiedenen Möglichkeiten, wie ich sie demütigen könnte. Verdammt, warum sollte ich da aufhören? Ich habe genug Macht, um jeden einzelnen von ihnen zu vernichten, wenn ich wollte! Das mag übertrieben sein, aber ich darf mir nicht zu viel Zeit lassen, sonst werden sie misstrauisch. ZXQPH4 ZXQ ZXQPH5 ZXQ Ich glaube, ich werde diese große Macht das Amulett von Yendor nennen! ZXQPH6 ZXQ - R.
journal.document.halls_king.amulet.title=Das Amulett
journal.document.halls_king.attrition.body=Ich habe einen Plan, um mit diesem Ding fertigzuwerden. Seine Macht ist unendlich, doch seine Fähigkeit, in diese Welt einzudringen, ist es nicht. Es verlässt sich auf Diener und Avatare, die seine Befehle ausführen, während es versucht, genug Macht zu sammeln, um das Amulett an sich zu reißen. Obwohl ich das Amulett nicht physisch besitze, habe ich dennoch die volle Kontrolle über seine Macht. Mit der gesamten Zwergenstadt unter meiner Kontrolle bin ich zudem zahlenmäßig überlegen. Ich kann einfach immer wieder Soldaten entsenden, um es daran zu hindern, das Amulett zu ergreifen, und diesen Krieg durch Abnutzung stetig gewinnen! ICH, RODNEY, KÖNIG DER ZWERGE, WERDE DICH ÜBERLEBEN, YOG-DZEWA!
journal.document.halls_king.attrition.title=Attrition
journal.document.halls_king.discover_hint=Diesen Text finden Sie in einem bestimmten Bereich, jedoch erst, nachdem Sie alle vorherigen Texte dieser Reihe gefunden haben.
journal.document.halls_king.new_king.body=ICH BIN KÖNIG, AHAHAHAHAAA!\n\nSie haben es einfach zugelassen! Ohne viel Überredungskunst willigten sie ein, dass ich diese Macht in einem großen Ritual mit ihnen teile. Im Nu verwandelten sie sich von einem Chor höhnischer Stimmen in meinen neuen Hofstaat stiller Untertanen!\n\nWie erwartet, floh Thymor beim ersten Anzeichen von Schwierigkeiten feige. Ich spüre bereits den Widerstand, den er aufbaut. Ich denke, ich lasse ihn gewähren, damit er all seine Verschwörer direkt vor meine Tür liefern kann!\n\nOffensichtlich respektiert mich das Königreich auch nicht, das werde ich wohl auch noch ändern.\n- König der Zwerge
journal.document.halls_king.new_king.title=Ein neuer König
journal.document.halls_king.rejection.body=Idioten! ZXQPH0 ZXQ ZXQPH1 ZXQ In den letzten 33 Jahren ist unser Königreich dank unserer neuen magischen Technologie erblüht. Wir haben gelernt, Elementargeister zu beschwören und sie unserem Willen zu unterwerfen, aber irgendwie sind weitere Experimente jetzt „zu gefährlich“. ZXQPH2 ZXQ ZXQPH3 ZXQ Ich weiß, was wirklich vor sich geht. Die Ablehnung meiner Theorien hat nichts mit ihrem Wert zu tun, sondern alles mit der Person, die sie vorschlägt. Wahrscheinlich lachen sie mich alle hinter meinem Rücken aus. ZXQPH4 ZXQ ZXQPH5 ZXQ Nun, Schluss damit! Mir ist egal, was sie sagen, ich werde die entferntesten Winkel unseres Universums allein erforschen und alles, was ich entdecke, für mich behalten! ZXQPH6 ZXQ - R.
journal.document.halls_king.rejection.title=Ablehnung
journal.document.halls_king.ritual.body=Thymor konfrontierte mich heute Morgen öffentlich und verlangte eine Erklärung meiner neuen Machtquelle. Ich wies ihn so gut ich konnte ab, doch ich spüre erneut die urteilenden Blicke des restlichen Hofes auf mir. Ich hatte gehofft, die Ruhe vor dem Sturm noch etwas länger genießen zu können, aber es spielt keine Rolle mehr. Ich habe mich entschieden. Ich werde behaupten, meine Macht durch ein neues Ritual erlangt zu haben, und es den anderen Hexenmeistern und dem König anbieten. Sobald das Ritual vollendet ist, werde ich König sein! Thymor wird natürlich protestieren, aber angesichts dieser Macht, die er mir anbietet, bezweifle ich, dass sie ihm zuhören werden! Alle werden sich vor mir verbeugen! – Zukünftiger König der Zwerge
journal.document.halls_king.ritual.title=Das Ritual
journal.document.halls_king.thing.body=Es gibt ein Problem. Thymor wurde mühelos besiegt, doch meine Suche in den äußeren Ebenen ist offenbar nicht unbemerkt geblieben. Irgendein... Ding... wurde von meiner Welt angezogen und zwängt sich durch die unteren Hallen. Zu allem Übel ist das genau der Ort, an dem ich das Amulett versteckt habe! Was für ein boshaftes Wesen! Warum will es mir meine Macht rauben, wo es doch noch so viel zu holen gibt? Trotz meiner Macht kann ich es wohl nicht einfach angreifen. Seine wahre Kraft ist unergründlich, aber es muss einen Weg geben, sie einzuschränken. Ich werde meine Beute verteidigen!
journal.document.halls_king.thing.title=Das Ding
journal.document.halls_king.title=???s Tagebuch
journal.document.intros.caves.body=Diese spärlich besiedelten Höhlen erstrecken sich unter dem verlassenen Gefängnis. Einst reich an Mineralien, waren sie ein Zentrum florierenden Handels und Gewerbes für die Zwergengesellschaft der Unterwelt, doch sie wurden aufgegeben, als die Zwerge der dunklen Magie verfielen. Die Höhlen werden heute hauptsächlich von unterirdischen Tieren, Gnollen und verlassenen Maschinen bewohnt; vermutlich von derselben Macht korrumpiert, die auch die Regionen darüber beeinflusst hat.
journal.document.intros.caves.title=Höhlen
journal.document.intros.city.body=Die Zwergenmetropole war einst die größte aller Zwergenstadtstaaten. In ihrer Blütezeit errichteten die Zwerge wundersame Maschinen aus Metall und Magie, die ihrer Stadt ein rasantes Wachstum ermöglichten. Doch dann, eines Tages, wurden die Stadttore verschlossen, und niemand hörte mehr von den Zwergen. Die wenigen, die der Stadt bei ihrer Schließung entkamen, erzählten Geschichten von einem wahnsinnigen Zauberer, der den Thron an sich gerissen hatte, und von der schrecklichen Magie, die er zu beherrschen gelernt hatte.
journal.document.intros.city.title=Zwergenmetropole
journal.document.intros.discover_hint=Diesen Text finden Sie, wenn Sie zum ersten Mal eine bestimmte Region betreten.
journal.document.intros.dungeon.body=Viele Helden haben sich vor dir aus der Stadt über dir in den Kerker gewagt, von den meisten hat man nie wieder etwas gehört. Man sagt, ein uraltes Übel lauert in den Tiefen und bewacht das allmächtige Amulett von Yendor. Noch immer strahlt dunkle Energie aus der Tiefe und dringt bis in die Stadt hinauf. Wirst du den Kerker bezwingen und das Amulett an dich nehmen? Es ist Zeit für dein eigenes Abenteuer!
journal.document.intros.dungeon.title=Verlies
journal.document.intros.halls.body=Diese tiefen Hallen der Zwergenmetropole sind von dunkler Magie verdorben. Einst beherbergten diese Regionen den Hof des Zwergenkönigs, bestehend aus Elite-Hexenmeistern, doch nun scheinen sie von etwas noch Unheilvollerem beherrscht zu sein … Allerlei schreckliche dämonische Kreaturen treiben sich in diesen Hallen herum, angeführt von einer furchtbaren dunklen Macht. Wenn der Zwergenkönig nicht die Quelle der sich ausbreitenden Verderbnis war, muss es das sein, was auch immer sich hier unten befindet. Geht vorsichtig, nur wenige Abenteurer sind je so tief hinabgestiegen …
journal.document.intros.halls.discover_hint=Diesen Text finden Sie in einem bestimmten Bereich, jedoch erst, nachdem Sie alle vorherigen Texte dieser Reihe gefunden haben.
journal.document.intros.halls.title=Dämonenhallen
journal.document.intros.prison.body=Vor vielen Jahren wurde hier ein Gefängnis für gefährliche Verbrecher errichtet. Streng bewacht und gesichert, wurden Verurteilte aus dem ganzen Land hierher gebracht, um ihre Strafe abzusitzen. Doch bald kroch ein finsterer Dunst aus der Tiefe und verdrehte den Verstand von Wärtern und Gefangenen gleichermaßen. Angesichts des wachsenden Chaos riegelte die Stadt das gesamte Gefängnis ab. Niemand weiß, was aus denen wurde, die man innerhalb dieser Mauern dem Tode überließ…
journal.document.intros.prison.title=Gefängnis
journal.document.intros.sewers.body=Die oberen Stockwerke des Verlieses bilden in Wirklichkeit die Kanalisation der Stadt. Dunkle Energie ist von unten nach oben gekrochen, und die normalerweise harmlosen Kanalisationskreaturen sind immer wilder geworden. Die Stadt musste Wachen hierher schicken, um die Sicherheit derer oben zu gewährleisten. Dieser Ort ist gefährlich, aber zumindest ist die böse Magie, die hier wirkt, schwach.
journal.document.intros.sewers.title=Kanalisation
journal.document.intros.title=Regionsvorstellungen
journal.document.prison_warden.discover_hint=Diesen Text finden Sie in einem bestimmten Bereich, jedoch erst, nachdem Sie alle vorherigen Texte dieser Reihe gefunden haben.
journal.document.prison_warden.journal.body=1. Frühling, 362\n\nDies ist der erste Eintrag im Arbeitsjournal der Gefängnisdirektorin Kiana Smith. Angesichts all dessen, was in letzter Zeit passiert ist, habe ich beschlossen, ein Tagebuch zu beginnen, um meine Gedanken zu ordnen.\n\nDie Leitung eines Gefängnisses, das eine halbe Meile unter der Erde liegt, war nie einfach, aber in letzter Zeit scheint es, als ob eine Art organisierter Aufruhr stattfindet. Die Insassen verhalten sich ohne Grund auffällig und weigern sich dann, den Grund dafür zu erklären.\n\nEinige der Wärter behaupten, der Ort sei verflucht. Ich kann nicht zulassen, dass meine eigenen Leute Gerüchte verbreiten, aber ich kann ihnen ihre Unruhe nicht verdenken.\n- Smith
journal.document.prison_warden.journal.title=Tagebuch führen
journal.document.prison_warden.letter.body=Thomas, du warst mir ein großartiger Freund, deshalb tue ich dir einen Gefallen. Wenn du heute Nacht deine Schicht antrittst, verschließe und verstärke Tengus Zelle, wirf den Schlüssel in eine Nische und verschwinde. Es ist egal, ob die anderen Gefangenen unbeaufsichtigt sind, bald wird niemand mehr diesen Ort verlassen können. Dieser Freak muss jedoch gesichert bleiben, wenn er entkommt, ist nicht abzusehen, was er anstellen wird. Erzähle niemandem davon und such nicht nach mir. Eine Kapitänin muss mit ihrem Schiff untergehen. - Kiana
journal.document.prison_warden.letter.title=Brief an Thomas
journal.document.prison_warden.mines.body=54. Winter, 363\n\nEine Gruppe Ingenieure der Stadt kam heute und sagte, sie seien hier, um den alten Eingang zu den darunter liegenden Minen zu versiegeln. Ich nehme an, die Stadt will sich nicht mehr um die Instandhaltung des Ganges kümmern. Ich wurde wie üblich nicht vorher informiert.\n\nIhr leitender Ingenieur erzählte mir auch irgendwelchen Unsinn über Zwergenmagie, die aus den Minen eindringt. Ich glaube kein Wort davon.\n\nDie Lage ist mit unseren neuen Mitarbeitern viel besser unter Kontrolle, aber die Ursache des Problems ist immer noch nicht behoben. Irgendetwas beeinflusst die Gefangenen hier definitiv, und ein paar Mauern einzureißen, wird daran nichts ändern.\n- Smith
journal.document.prison_warden.mines.title=Versiegelung der Minen
journal.document.prison_warden.no_support.body=11. Frühlingstag, 364\n\nWas zum Teufel denkt sich die Stadt dabei? Nachdem ich dringend um Hilfe gebeten habe, habe ich nichts gehört, nicht einmal eine leere Entschuldigung, wie sie sonst immer kommen, wenn meine Anfragen abgelehnt werden.\n\nUnterdessen wird die Lage der Insassen immer schlimmer, und einige der Wärter fangen sogar an, Ärger zu machen. Wollen die das einfach so weiterlaufen lassen, bis wir es mit einem Aufstand zu tun haben?!\n\nZuverlässig ist wenigstens wie immer geblieben. Seine organisatorische Hilfe war unschätzbar wertvoll, und seine Idee, diese alten DM-100-Einheiten zu aktivieren, war zwar bedauerlich, aber notwendig. Ich bin zuversichtlich, dass ich die Situation wieder in den Griff bekomme, ich brauche nur verdammt nochmal Unterstützung!\n-Smith
journal.document.prison_warden.no_support.title=Keine Unterstützung
journal.document.prison_warden.recruits.body=80. Frühling, 362\n\nWie versprochen, ist heute eine ganze Reihe neuer Rekruten eingetroffen. Scheint wie immer zu sein, ein paar vielversprechende und viele einfache Arbeiter, die nur auf den Lohn aus sind. Trotzdem sollte uns die neue Muskelkraft im Umgang mit unseren jüngsten unruhigen Häftlingen sehr helfen.\n\nBei einem Job wie diesem ist es wichtig zu wissen, wem man vertrauen kann. Ein Neuzugang, Thomas, scheint besonders vielversprechend. Ich brauche jede Hilfe, die ich kriegen kann. Wenn er sich also gut schlägt, werde ich dafür sorgen, dass er schnell befördert wird.\n- Smith
journal.document.prison_warden.recruits.title=Neue Rekruten
journal.document.prison_warden.rotberry.body=23. Herbst, 363\n\nHeute habe ich ein schönes Geschenk von Felix bekommen. Es ist eine Art leuchtend roter Strauch namens „Rotberry“.\n\nIch habe ihm schon öfter erzählt, wie trostlos es hier ist, und anscheinend hat er zugehört. Laut ihm mag diese Pflanze weder Licht noch Wasser, deshalb muss ich die Blätter nur etwa einmal im Monat zurückschneiden. Das Zurückschneiden muss aber wichtig sein, er hat es in seinem Brief dutzende Male erwähnt.\n\nNatürlich macht Felix nie etwas umsonst. Er sagt, die Samen, die diese Pflanze produziert, seien hervorragend für die Herstellung von Zauberstäben geeignet, also schulde ich ihm natürlich jedes Mal ein paar, wenn die Pflanze welche produziert.\n- Smith
journal.document.prison_warden.rotberry.title=Rotbeerenpflanze
journal.document.prison_warden.title=Tagebuch des Gefängnisdirektors
journal.document.sewers_guard.crabs.body=11. Winter 376\nLiebe Mama und lieber Papa,\n\nAls ob die Ratten nicht schon schlimm genug wären, gibt es da unten auch noch riesige Krabben! Eine von ihnen stürmte direkt an mir vorbei und hat Lee ziemlich übel zugerichtet, bevor wir sie getötet haben. Thomas sagt, es sei nicht meine Schuld, aber ich weiß, er will nur nett zu mir sein.\n\nZum Glück trafen wir auf dem Rückweg einen Abenteurer, der noch etwas Sonnengras-Salbe dabei hatte. Ohne das Zeug hätte Lee es vielleicht nicht geschafft.\n\nIch sah den Abenteurer, wie er eine Rose anstarrte, bevor er ging. Er sagte, es sei ein Geschenk. Warum sollte er hier unten sein Leben riskieren, wenn sich jemand so sehr um ihn sorgt?\n\nGenau das tue ich doch auch, oder? Ich habe das Gefühl, dass ich überfordert bin.
journal.document.sewers_guard.crabs.title=Riesenkrabben!
journal.document.sewers_guard.dangerous.body=88. Herbst 375\nLiebe Mama und lieber Papa,\n\nIch verstehe jetzt, warum die Bezahlung so gut ist, die Kanalisation ist voller Monster! Die „Ungeziefer“ und „Gesetzlosen“ sind riesige, blutrünstige Ratten und Rudel wütender Gnolle.\n\nZum Glück weiß der Rest meines Teams wirklich, was er tut. Unser Teamkapitän Thomas ist ein Experte auf diesem Gebiet. Ich versuche, schnell zu lernen, damit ich nicht zu sehr zur Last falle.\n\nDieser Job ist viel gefährlicher, als ich dachte. Ich bin froh, dass ich diese jetzt nicht schicken kann, ich möchte nicht, dass ihr euch Sorgen macht.\n\nIch werde auf mich aufpassen,\n- Sonja
journal.document.sewers_guard.dangerous.title=Eine gefährliche Lage...
journal.document.sewers_guard.discover_hint=Diesen Text finden Sie in einem bestimmten Bereich, jedoch erst, nachdem Sie alle vorherigen Texte dieser Reihe gefunden haben.
journal.document.sewers_guard.guild.body=23. Winter 376\nLiebe Mama und Papa,\n\nDiesmal keine neuen Monster, stattdessen sind wir auf Patrouille auf eine kleine Gruppe der Diebesgilde gestoßen.\n\nAlles, was ich über die Gilde gehört habe, ist schlecht, aber der Rest meines Teams schien fast freundlich mit ihnen zu sein. Thomas tauschte Informationen und Vorräte mit einem von ihnen aus, bevor wir getrennte Wege gingen.\n\nIch verstehe das nicht, sollten wir nicht Gesetzlose beseitigen? Thomas hat sogar gesagt, dass wir das niemandem in der Führungsebene erzählen sollen. Ihre Informationen und Vorräte waren jedoch sehr nützlich, und wir konnten nicht noch mehr Kämpfe verkraften.\n\nIch nehme an, wir sitzen hier unten alle im selben Boot.
journal.document.sewers_guard.guild.title=Die Diebesgilde
journal.document.sewers_guard.lost.body=40. Winter, 376\n\nThomas und ich haben uns verirrt. Wir wurden im Kampf gegen ein paar Gnolle vom Rest des Teams getrennt. Uns beiden ist nichts passiert, aber die untere Kanalisation ist wie ein Labyrinth.\n\nThomas meint, er kenne einen Ausgang, aber der beginnt am alten Gefängniseingang ganz unten in der Kanalisation. Ich gehe wirklich nicht gern tiefer, aber wir haben keine Rationen mehr, und der Abstieg ist viel schneller, als hier herumzuirren und nach unserer Patrouillenroute zu suchen.\n\nEs wird schon gut gehen. Thomas weiß, was er tut.
journal.document.sewers_guard.lost.title=Wir sind verloren
journal.document.sewers_guard.new_position.body=85. Herbst 375\nLiebe Mama und lieber Papa,\n\nIch habe euch doch gesagt, dass sich die harte Arbeit bei der Stadtwache lohnen würde. Ich wurde befördert!\n\nIch wurde eingeladen, einem Spezialteam beizutreten, das in der Kanalisation arbeitet. Anscheinend gibt es dort unten Probleme mit Ungeziefer und Gesetzlosen, und es ist unsere Aufgabe, sie zu beseitigen. Es ist eine schmutzige Arbeit, aber die Kanalisation ist im Winter warm, und man verdient dreimal so viel wie im normalen Wachdienst!\n\nEs ist alles etwas geheimnisvoll, deshalb kann ich diesen Brief eigentlich nicht abschicken. Es fühlt sich komisch an, euch nicht zu schreiben, deshalb werde ich euch trotzdem weiter schreiben. Vielleicht kann ich sie dir eines Tages zeigen. Beste Grüße, Sonja
journal.document.sewers_guard.new_position.title=Meine neue Position!
journal.document.sewers_guard.not_worth.body=Thomas und ich stießen am Gefängniseingang auf eine Art riesiges Schleimmonster. Bevor wir reagieren konnten, schleuderte es uns einen Zauber entgegen. Thomas hat den größten Teil abbekommen. Er ist tot. Kein Geld der Welt ist das wert. Ich werde den Weg nehmen, den Thomas mir beschrieben hat. Dann werde ich mein als Wächter verdientes Geld nutzen, um meine Eltern und mich aus dieser verfluchten Stadt zu bringen. Ein Teil von mir hofft, dass der König einen Plan für all das hat, aber ich bezweifle es. Ich hinterlasse diese Briefe als Warnung für andere. Es sind mehr als nur riesige Ratten und Krabben, hier unten stimmt etwas ganz und gar nicht.
journal.document.sewers_guard.not_worth.title=Es lohnt sich nicht
journal.document.sewers_guard.title=Briefe des Wärters
