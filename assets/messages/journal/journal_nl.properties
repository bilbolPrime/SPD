journal.document.adventurers_guide.alchemy.body=Als je een verbruiksartikel niet nuttig vindt, kun je het gebruiken als alchemie-ingrediënt of omzetten in universele alchemistische energie. Energiegevende drankjes en perkamenten worden ook als zodanig herkend! \n\nSieraden zijn een uniek soort uitrusting die met behulp van alchemie worden gemaakt en verbeterd. Ze worden gemaakt met een magische sieradenkatalysator en een beetje alchemistische energie. \n\n (De eerste alchemiepot bevindt zich op de 3e of 4e verdieping van de kerker. Er liggen ook pagina's met alchemie-receptenboeken in de buurt van deze potten.)
journal.document.adventurers_guide.alchemy.title=Alchemie en snuisterijen
journal.document.adventurers_guide.dieing.body=Dungeoneering is gevaarlijk en de meeste avonturiers vinden uiteindelijk hun einde. Geluk helpt, maar de beste avonturiers gebruiken elk klein trucje om hun kansen te vergroten. (Wees niet teleurgesteld als je vaak doodgaat, dit spel is moeilijk! Concentreer je op het leren van het spel en het gestaag verbeteren, niet op meteen winnen.)
journal.document.adventurers_guide.dieing.title=Omgaan met een nederlaag
journal.document.adventurers_guide.examining.body=Het is belangrijk om je vijanden en omgeving te bestuderen in plaats van er blindelings op af te stormen! Maak er een gewoonte van om alles wat nieuw is te onderzoeken. (Je kunt onderzoeken door op het vergrootglas te klikken en vervolgens te selecteren wat je wilt onderzoeken. Je kunt ook buffs of debuffs onderzoeken door op hun pictogrammen te klikken.)
journal.document.adventurers_guide.examining.title=Onderzoeken
journal.document.adventurers_guide.food.body=Effectief rantsoeneren is een van de beste manieren om je overlevingskansen te vergroten; je hoeft niet altijd te eten zodra je honger hebt! Als je geen honger hebt, herstelt je gezondheid zich langzaam. Dus als je eet terwijl je nog volledig gezond bent, gaat die regeneratie verloren! Als je je eetmomenten aanpast aan je gezondheid, gaat je voedsel veel langer mee.
journal.document.adventurers_guide.food.title=Omgaan met honger
journal.document.adventurers_guide.identifying.body=De kleuren van drankjes en symbolen op perkamenten verschillen per kerker. Onbekende uitrusting kan, met een beetje geluk, worden geüpgraded of betoverd, maar kan ook vervloekt zijn! Perkamenten om uitrusting te identificeren, te upgraden of de vloek te verwijderen zijn erg handig als je het risico van het gebruik van onbekende uitrusting wilt verkleinen. (Je vindt een lijst van alle geïdentificeerde items in het tabblad Catalogus van je dagboek.)
journal.document.adventurers_guide.identifying.title=Identificatie van items
journal.document.adventurers_guide.intro.body=Gegroet avonturier, je leest het Boek der Kerkermeesterschap! Deze gids is het meest geschikt als naslagwerk en zal je op magische wijze laten weten wanneer je elke pagina het beste kunt lezen. (Wanneer de dagboekknop knippert, selecteer deze dan om te lezen wat de gids je te vertellen heeft! Sommige pagina's ontbreken echter, misschien kun je ze in de kerker vinden?)
journal.document.adventurers_guide.intro.title=Invoering
journal.document.adventurers_guide.levelling.body=Door levels omhoog te gaan, verbeter je je statistieken en verdien je talentpunten, wat een groot verschil kan maken in gevechten. Het is het beste om minstens één level per verdieping van de kerker te hebben. Het kan verleidelijk zijn om je te haasten en de verkenning of gevechten over te slaan, maar daardoor mis je voorraden en ervaringspunten. (Je kunt informatie over je held, inclusief ervaringspunten, zien in het statusvenster in de hoek van de spelinterface. Selecteer je heldenportret voor nog meer informatie.)
journal.document.adventurers_guide.levelling.title=Ervaring opdoen
journal.document.adventurers_guide.looting.body=Kamers achter gesloten deuren of met obstakels bevatten meestal betere buit. Als een obstakel je pad blokkeert, kun je meestal op dezelfde verdieping een voorwerp vinden dat je kan helpen. Je vindt altijd 2 krachtdrankjes en 3 upgrade-rollen in elk kerkergebied van vijf verdiepingen, dus die zijn een goede indicator van hoe goed je aan het verkennen bent. (Je kunt een lijst met oriëntatiepunten en ongebruikte sleutels bekijken in het notitietabblad van het dagboekvenster.)
journal.document.adventurers_guide.looting.title=Effectief plunderen
journal.document.adventurers_guide.magic.body=Magische aanvallen doorboren bepantsering en zijn moeilijk te ontwijken. Dit betekent dat de schade van toverstaven zeer betrouwbaar is, maar maakt magische vijanden ook erg gevaarlijk! Magische aanvallen hebben echter altijd een nadeel. Toverstaven hebben een beperkt aantal ladingen en magische vijanden kunnen hun magie meestal niet van dichtbij gebruiken. Wanneer je vijanden tegenkomt die magie gebruiken, is het belangrijk om te leren hoe je kunt voorkomen dat ze het tegen je gebruiken.
journal.document.adventurers_guide.magic.title=Magische aanvallen
journal.document.adventurers_guide.positioning.body=Strategie is net zo belangrijk als uitrusting. Vervelende situaties, zoals omsingeld raken, kunnen meestal worden vermeden met een goede positionering. De meeste kerkers hebben bijvoorbeeld smalle gangen waardoor vijanden gedwongen worden om je één voor één aan te vallen. Deze gangen hebben vaak ook deuropeningen voor verrassingsaanvallen! Er zijn ook talloze kleine manieren om omgevingselementen zoals gras, water, kuilen of vallen in je voordeel te gebruiken.
journal.document.adventurers_guide.positioning.title=Positionering
journal.document.adventurers_guide.searching.body=Dungeons zitten vol geheime deuren en vallen die op het eerste gezicht onzichtbaar lijken. Je kunt de tijd nemen om zorgvuldig te zoeken als je vermoedt dat er een deur of val in de buurt verborgen is. (Je kunt alle tegels om je heen doorzoeken door twee keer op de vergrootglasknop te klikken. Misschien zijn er wel verborgen deuren in de buurt van waar je deze pagina hebt gevonden!)
journal.document.adventurers_guide.searching.title=Zoeken
journal.document.adventurers_guide.strength.body=Er is geen tijd om te trainen met de wapens en bepantsering die je in de kerker vindt, dus je hebt brute kracht nodig om ze effectief te gebruiken. Krachtdrankjes en upgrade-rollen zijn de meest effectieve manier om te voldoen aan de krachtvereisten van uitrusting van een hogere categorie. Het is belangrijk om uiteindelijk items van een hogere categorie te gaan gebruiken, maar negeer de uitrusting die je nu al kunt gebruiken niet.
journal.document.adventurers_guide.strength.title=Kracht
journal.document.adventurers_guide.surprise_attacks.body=Verrassingsaanvallen raken gegarandeerd doel, waardoor ze bijzonder nuttig zijn tegen ontwijkende vijanden zoals slangen en geesten. Je kunt vijanden verrassen direct nadat ze een deuropening binnenkomen terwijl ze je achtervolgen, of wanneer ze je uit het oog verliezen.
journal.document.adventurers_guide.surprise_attacks.title=Verrassingsaanvallen
journal.document.adventurers_guide.title=boek van kerkermeesterschap
journal.document.adventurers_guide.upgrades.body=Hoe dieper je een kerker ingaat, hoe belangrijker het is dat je magisch verbeterde uitrusting van hoge kwaliteit gebruikt, maar je hebt ook de kracht nodig om ze goed te gebruiken. Toverstaven, ringen en artefacten vereisen geen kracht, maar hebben beperkte gebruiksmogelijkheden of helpen niet direct in de strijd. Het maken van goede keuzes over wat je upgradet is erg belangrijk om te overleven in het begin van de kerker en om jezelf voor te bereiden op succes later in de kerker.
journal.document.adventurers_guide.upgrades.title=Upgrades
journal.document.alchemy_guide.bombs.body=Een standaard buskruitbom kan met een specifiek voorwerp worden gemengd om een verbeterde bom te creëren.
journal.document.alchemy_guide.bombs.title=Verbeterde bommen
journal.document.alchemy_guide.brews_elixirs.body=Brouwsels en elixirs zijn geavanceerde drankjes met diverse effecten, meestal voor eenmalig gebruik.
journal.document.alchemy_guide.brews_elixirs.title=brouwsels en elixirs
journal.document.alchemy_guide.energy_food.body=Veel recepten vereisen kristalalchemistische energie, die wordt opgewekt door verbruiksartikelen te ontleden in een alchemieketel. Energiegevende drankjes of perkamenten zijn hier ook aan te herkennen. Sommige recepten die energie vereisen zijn magisch, maar deze lijken op traditioneel koken.
journal.document.alchemy_guide.energy_food.title=Energie en Voeding
journal.document.alchemy_guide.exotic_potions.body=Drankjes kunnen met energie worden gemengd om exotische drankjes te maken. Deze hebben krachtigere effecten, maar zijn vaak op andere manieren nuttig.
journal.document.alchemy_guide.exotic_potions.title=exotische drankjes
journal.document.alchemy_guide.exotic_scrolls.body=Exotische spreukenrollen kunnen worden gemaakt met wat energie en een spreukenrol. Ze zijn iets sterker en duurder dan exotische drankjes.
journal.document.alchemy_guide.exotic_scrolls.title=exotische rollen
journal.document.alchemy_guide.potions.body=Welkom bij Praktische Toepassingen van Alchemie! Dit boek is een naslagwerk met recepten om voorwerpen te maken met een alchemieketel. We beginnen met het meest iconische recept: Drankjes! Gebruik drie zaden om een willekeurig drankje te brouwen! Elk zaadje heeft een bijbehorend drankje. Gebruik meerdere zaden van hetzelfde type om de kans te vergroten dat het drankje overeenkomt met de zaden die je hebt gebruikt.
journal.document.alchemy_guide.potions.title=Introductie en toverdranken
journal.document.alchemy_guide.spells.body=Spreuken zijn opgeslagen in kristallen en bieden diverse effecten, meestal met meerdere toepassingen.
journal.document.alchemy_guide.spells.title=spreuken
journal.document.alchemy_guide.stones.body=Door een perkamentrol in een alchemieketel te mengen, wordt de magie ervan overgedragen op twee stenen in de ketel. Hierdoor ontstaan runenstenen die de rol identificeren!
journal.document.alchemy_guide.stones.title=Runenstenen maken
journal.document.alchemy_guide.title=Alchemiegids
journal.document.alchemy_guide.weapons.body=Sommige van de lichtere of meer magische wapens kunnen in de alchemie worden gebruikt!\n\nElke set werpwapens produceert genoeg vloeibaar metaal om een andere set van hetzelfde niveau en dezelfde categorie volledig te repareren. Let op: het alchemiseren van een set vernietigt de hele set, zelfs als deze niet compleet is!\n\nEén toverstaf produceert genoeg arcane hars om twee toverstaven van hetzelfde niveau te upgraden, maar niet hoger dan +3.
journal.document.alchemy_guide.weapons.title=Wapens verbeteren
journal.document.caves_explorer.alive.body=23e zomer, 308\n\nEen van de dwergenmachines kwam op de een of andere manier tot leven! We liepen er gewoon langs toen hij aanviel en bijna twee van onze groep verpletterde met zijn enorme metalen vuisten. Gelukkig had ik mijn toverstaf van desintegratie bij me. Een paar goed gerichte stralen daarvan en het beest was tot schroot gereduceerd.\n\nWat me dwarszit, is dat we absoluut niets hebben gedaan om de machine te provoceren. De dwergen kunnen de machines onmogelijk zo agressief hebben ontworpen, het is alsof hij ons in een hinderlaag probeerde te lokken!\n\nTenminste kon ik mijn metgezellen voor één keer helpen.\n- Archibald
journal.document.caves_explorer.alive.title=Het leeft!
journal.document.caves_explorer.city.body=21e zomer, 308\n\nWe zijn nu drie weken onderweg en na de afgelopen tien dagen steeds dieper de mijnen in kaart te hebben gebracht, hebben we eindelijk de bodem bereikt. We vonden verschillende metalen constructies en een grote poort die de toegang tot de oude dwergenmetropool blokkeert.\n\nDe smid waarschuwde ons voor een deel van deze machines. Ze waren blijkbaar bedoeld voor gebiedsverdediging en hebben de neiging om te activeren wanneer ze worden verstoord. We hebben niets te zoeken in de stad en het metaal zou minimale schrootwaarde hebben, dus we dachten dat het het beste was om zijn waarschuwing ter harte te nemen en terug te keren.\n\nIk moet toegeven dat ik nieuwsgierig was, maar daar beneden onderzoek doen was het risico zeker niet waard.\n- Archibald
journal.document.caves_explorer.city.title=De stadsingang
journal.document.caves_explorer.discover_hint=Je kunt deze tekst in een specifieke regio vinden, maar alleen nadat je alle voorgaande teksten in deze reeks hebt gevonden.
journal.document.caves_explorer.expedition.body=1e zomer, 308\n\nVandaag begint onze vier weken durende expeditie naar de verlaten dwergenmijnen! Ik heb van de koning zelf de opdracht gekregen om de regio te verkennen. Mijn voornaamste doelen zijn het vinden van onontgonnen natuurlijke hulpbronnen en het in kaart brengen van de grotten voor een mogelijk gevangenisbouwproject.\n\nHoewel ik mezelf kan verdedigen, heb ik op aandringen van de koning een escorte van de stadswacht geaccepteerd. Het zijn een stelletje simpele zielen, maar zolang ze me niet vertragen, is hun aanwezigheid te verdragen.\n\nWe moeten de riolen vrijmaken en de mijnen tegen de avond bereiken.\n- Archibald Drummond. Aartsmagiër, Zuidelijk Tovenaarsinstituut.
journal.document.caves_explorer.expedition.title=Expeditie gestart!
journal.document.caves_explorer.gold.body=4e zomer, 308\n\nOnze eerste dagen waren zeer vruchtbaar! Na het opzetten van een basiskamp zijn we op pad gegaan om de bovenste gedeelten van de verlaten mijn te verkennen. Hoewel er veel nutteloze rommel is achtergelaten door de dwergen, wemelt het op veel van de grotwanden van het goud!\n\nHelaas zijn we niet de eersten hier. De grotten wemelen van agressieve dieren en het lijkt erop dat groepen gnolls ook interesse hebben in het goud. Ik geef toe dat ik oneerlijk ben geweest tegenover mijn lijfwachten; ze zijn veel bekwamere verkenners en lijfwachten gebleken dan ik had verwacht.\n\nZelfs met dit succes moeten we nog een groot deel van de mijn verkennen.\n- Archibald
journal.document.caves_explorer.gold.title=Zoveel goud!
journal.document.caves_explorer.report.body=28e zomer, 308\n\nVandaag maken we onze spullen ingepakt en bereiden we ons voor op vertrek. Net op tijd, want een aantal leden van onze groep heeft na het incident met de agressieve machine vreselijke nachtmerries. Het is waarschijnlijk gewoon vermoeidheid, maar hun nachtmerries lijken allemaal zorgwekkend veel op elkaar.\n\nSamenvattend zijn de bovenste gedeelten van de mijn vrij veilig. Als er een toepassing voor donker goud gevonden kan worden, kan de winning ervan behoorlijk lucratief zijn. De grote open ruimtes zouden ook zeer geschikt zijn voor de bouwplannen van de stad. De lagere mijnen zijn echter gevaarlijker en moeten worden vermeden.\n\nIk zal dit alles de komende dagen in mijn eindrapport verwerken.\n- Archibald
journal.document.caves_explorer.report.title=Eindverslag
journal.document.caves_explorer.title=Logboek van de ontdekkingsreiziger
journal.document.caves_explorer.troll.body=11e zomer, 308\n\nNadat we begonnen waren met onze verkenning van het middengedeelte van de mijnen, kwamen we een vriendelijk gezicht tegen! Nou ja... relatief vriendelijk. Een grottrol heeft daar een kleine smederij opgezet. Hij is nors en niet erg spraakzaam, maar repareerde wel onze uitrusting in ruil voor wat goud.\n\nHelaas heeft de trollensmid ons ook verteld dat al dit mooie goud niet zo waardevol is als het lijkt. Hij noemt het 'donker goud' en het schijnt snel te degraderen in zonlicht. Dat zou zeker verklaren waarom er hier nooit conflicten zijn geweest over de grondstoffen.\n\nIk denk dat we wat dieper moeten graven om te zien of er iets waardevollers te vinden is.\n- Archibald
journal.document.caves_explorer.troll.title=Ik heb een trol ontmoet.
journal.document.city_warlock.discover_hint=Je kunt deze tekst in een specifieke regio vinden, maar alleen nadat je alle voorgaande teksten in deze reeks hebt gevonden.
journal.document.city_warlock.failure.body=Het lijkt erop dat ik ook een dwaas ben. Ik nam aan dat de Nieuwe Koning de hofhouding vrijwillig aan hem wilde onderwerpen, maar nu zie ik dat hij zelfs degenen die zich tegen hem verzetten kan beheersen. Ik heb blindelings alle sterkste tegenstanders naar zijn deur gelokt, zodat hij ze persoonlijk tot zijn slaven kon maken. Nu spoelen golven van zijn necrotische energie door de stad en veranderen de meesten onmiddellijk in zijn smekelingen. De weinigen die nog een vrije wil hebben, slaan op de vlucht. Ik heb ervoor gekozen om achter te blijven om zo goed mogelijk te observeren en naar een opening te zoeken. Met de magische kracht die ik bezit, zou ik me een tijdje verborgen en veilig moeten kunnen houden.
journal.document.city_warlock.failure.title=Mislukking
journal.document.city_warlock.more_powerful.body=Het bijhouden van de tijd is lastig geworden, maar het is alweer ongeveer een week geleden sinds mijn laatste bericht. Onze beschaving is werkelijk ingestort. De poorten zijn gesloten, alle functies van onze samenleving zijn gestopt en lege dwergenlichamen dwalen door de gangen. Te midden van dit alles wordt de Nieuwe Koning op de een of andere manier steeds machtiger. Elke dag wordt de kracht van zijn wil sterker, maar die kracht verandert ook. Ik kan het niet beschrijven, maar het voelt alsof hij helemaal geen dwerg meer is. Ik begin te accepteren dat het beste wat ik waarschijnlijk kan doen, is deze gebeurtenissen documenteren. Ik blijf hier zo lang als ik kan en trek me terug zodra mijn wil begint te verzwakken.
journal.document.city_warlock.more_powerful.title=Krachtiger
journal.document.city_warlock.new_power.body=Wat gebeurt hier? De kracht die van de Nieuwe Koning uitgaat is inderdaad anders dan eerst, maar er is nog iets anders. Deze nieuwe kracht lijkt uit de diepste hallen van onze stad te stralen. Nog raadselachtiger is dat de activiteit in de bovenste metropool ook is afgenomen. Ik weet niet wat daar beneden gebeurt, maar het trekt bijna alle aandacht van de Nieuwe Koning. Terugkeren naar de diepe hallen zal gevaarlijk zijn, maar ik moet ontdekken wat deze verandering veroorzaakt. Misschien heeft de Nieuwe Koning toch een zwak punt?
journal.document.city_warlock.new_power.title=Een nieuwe kracht
journal.document.city_warlock.old_king.body=Het is de 5e dag van de 2e maand van het 33e jaar van het tijdperk van de magie. Als een inwoner van de bovenwereld dit leest, is het ergens in de winter van 264. Mijn naam is Thymor Zahir, en voor zover ik weet ben ik het laatst overgebleven lid van het dwergenhof. Onze koning is dood, vervangen door een van mijn voormalige collega's die machtsgek is geworden. De rest van het hof heeft zich aan hem onderworpen, als de dwazen die ze zijn, en daarbij hun vrije wil verloren. Ik alleen zag dit aankomen en vluchtte voordat zijn ritueel voltooid kon worden. De binnenste kring is gevallen, maar de macht van de nieuwe koning heeft nog niet iedereen bereikt. Ik moet zo snel mogelijk verzet organiseren. Ik weiger toe te staan dat onze glorieuze beschaving ten prooi valt aan deze megalomaan!
journal.document.city_warlock.old_king.title=De koning is dood
journal.document.city_warlock.resistance.body=Het nieuws lijkt zich snel te hebben verspreid. Het is pas een paar dagen geleden en ik heb al een klein leger van loyalisten voor de Oude Koning verzameld. Weinigen zijn bedreven in magie, maar bijna de hele orde van krijgsmonniken is onder ons. We zouden meer dan een match moeten zijn voor een waanzinnige dwerg en zijn hofhouding van slaven. Ondertussen heeft de Nieuwe Koning zich verscholen in de binnenkamers van onze stad. Ongetwijfeld heeft hij het grootste deel van zijn macht verbruikt en hoopt hij te herstellen voordat hij op meer weerstand stuit. We zullen over een paar uur onze aanval inzetten. Met een beetje geluk kunnen we een interim-raad vormen en onze wonderbaarlijke stad voor het einde van de nacht weer stabiel maken.
journal.document.city_warlock.resistance.title=Een verzet
journal.document.city_warlock.seen_it.body=Ik heb gezien wat eronder ligt, maar ik kan het niet beschrijven. Mijn handen trillen oncontroleerbaar terwijl ik mijn gedachten probeer op te schrijven.\n\nWaarom gebeurt dit? Heeft de Nieuwe Koning dit gedaan? Het slaat nergens op. Misschien heeft zijn roekeloze machtsmisbruik het aangetrokken? Ik had gehoopt onze beschaving te redden, maar nu zie ik dat de hele wereld op het spel staat.\n\nOp de een of andere manier is de koning het minste kwaad. Ik heb geen andere keuze, voor het grotere goed zal ik me overgeven. Leid me alstublieft, mijn koning, gebruik me als instrument om Yog-Dzewa in bedwang te houden!
journal.document.city_warlock.seen_it.title=Ik heb het gezien.
journal.document.city_warlock.title=Dagboek van de Tovenaar
journal.document.halls_king.amulet.body=IK HEB HET GEDAAN!\n\nIk wist niet precies wat ik zou vinden, maar wat ik daar ontdekte overtrof al mijn verwachtingen. Zoveel macht, gewoon klaar om gepakt te worden, en het is allemaal van mij!\n\nHiermee durft geen enkele dwaas aan het hof zich tegen mij te verzetten. Ik word helemaal blij als ik denk aan alle verschillende manieren waarop ik ze kan vernederen. Sterker nog, waarom zou ik daar stoppen? Ik heb genoeg macht om ze allemaal te vernietigen als ik dat wil! Dat is misschien wat overdreven, maar ik moet niet te lang nadenken, anders worden ze achterdochtig.\n\nIk denk dat ik deze grote macht het Amulet van Yendor ga noemen!\n- R.
journal.document.halls_king.amulet.title=Het amulet
journal.document.halls_king.attrition.body=Ik heb een plan om met dat ding af te rekenen. Zijn kracht is oneindig, maar zijn vermogen om deze wereld te veroveren niet. Het vertrouwt op handlangers en avatars om zijn bevelen uit te voeren, terwijl het probeert genoeg macht te vergaren om het amulet te bemachtigen. Hoewel ik het amulet fysiek niet bezit, heb ik nog steeds volledige controle over zijn kracht. Met de hele dwergenstad tot mijn beschikking heb ik ook een numeriek voordeel. Ik kan simpelweg soldaten blijven sturen om te voorkomen dat het het amulet in handen krijgt en zo deze oorlog gestaag winnen door uitputting! Ik, Rodney, Koning der Dwergen, zal jou overleven, Yog-Dzewa!
journal.document.halls_king.attrition.title=Slijtage
journal.document.halls_king.discover_hint=Je kunt deze tekst in een specifieke regio vinden, maar alleen nadat je alle voorgaande teksten in deze reeks hebt gevonden.
journal.document.halls_king.new_king.body=IK BEN KONING, AHAHAHAHAAA!\n\nZe lieten me het gewoon doen! Zonder veel overredingskracht stemden ze ermee in om me deze macht met hen te laten 'delen' in een groots ritueel. In een oogwenk veranderden ze van een koor van spottende stemmen in mijn nieuwe hof van zwijgende onderdanen!\n\nVoorspelbaar genoeg vluchtte Thymor als een lafaard bij het eerste teken van problemen. Ik voel de weerstand die hij aan het opbouwen is al. Ik denk dat ik hem zijn gang laat gaan, zodat hij al zijn samenzweerders rechtstreeks naar mijn deur kan brengen!\n\nHet is duidelijk dat het koninkrijk me ook niet respecteert, ik denk dat ik daar ook wel een oplossing voor zal vinden.\n- Koning van de Dwergen
journal.document.halls_king.new_king.title=Een nieuwe koning
journal.document.halls_king.rejection.body=IDIOOT!\n\nDe afgelopen 33 jaar is ons koninkrijk tot bloei gekomen dankzij onze nieuwe magische technologie. We hebben geleerd hoe we elementaire geesten kunnen oproepen en naar onze wil kunnen buigen, maar om de een of andere reden is verder experimenteren nu 'te gevaarlijk'.\n\nIk weet wat er echt aan de hand is. De afwijzing van mijn theorieën heeft niets te maken met hun waarde, maar alles met de persoon die ze oppert. Ze lachen me waarschijnlijk allemaal achter mijn rug uit.\n\nNou, genoeg is genoeg! Het kan me niet schelen wat ze zeggen, ik zal de verste uithoeken van ons universum in mijn eentje verkennen en alles wat ik ontdek voor mezelf houden!\n- R.
journal.document.halls_king.rejection.title=Afwijzing
journal.document.halls_king.ritual.body=Thymor confronteerde me eerder vandaag in het openbaar en stond erop dat ik mijn nieuwe machtsbron uitlegde. Ik wimpelde hem zo goed mogelijk af, maar ik voel de oordelende blikken van de rest van het hof weer op me gericht. Ik had gehoopt nog even te kunnen genieten van de stilte voor de storm, maar het maakt eigenlijk niet uit. Ik heb besloten wat ik wil doen. Ik zal beweren dat ik mijn macht heb verkregen door een nieuw ritueel en zal aanbieden om het uit te voeren op de andere tovenaars en de koning. Zodra het ritueel voorbij is, ben ik koning! Thymor zal natuurlijk protesteren, maar met zoveel macht in het vooruitzicht betwijfel ik of ze naar hem zullen luisteren! Allen zullen voor mij buigen! - Toekomstige koning van de dwergen
journal.document.halls_king.ritual.title=Het Ritueel
journal.document.halls_king.thing.body=Er is een probleem. Thymor werd zonder moeite verslagen, maar het lijkt erop dat mijn gesnuffel in de buitenste dimensies niet onopgemerkt is gebleven. Een of ander... 'ding'... is naar mijn wereld getrokken en begint zich een weg te banen aan de onderkant van de lagere hallen. Om het nog ingewikkelder te maken, is dat precies de plek waar ik het amulet heb opgeborgen! Wat een wraakzuchtig wezen, waarom moet het proberen me mijn macht te ontnemen terwijl er nog genoeg te halen valt? Ondanks mijn macht denk ik niet dat ik er zomaar op af kan stormen en het kan bevechten. Zijn ware kracht is ondoorgrondelijk, maar er moet een manier zijn om die te beperken. IK ZAL MIJN PRIJS VERDEDIGEN!
journal.document.halls_king.thing.title=Het Ding
journal.document.halls_king.title=Het dagboek van ???
journal.document.intros.caves.body=Deze dunbevolkte grotten strekken zich uit onder de verlaten gevangenis. Rijk aan mineralen, waren ze ooit een centrum van bruisende handel en industrie voor de dwergengemeenschap beneden, maar ze werden verlaten toen de dwergen geobsedeerd raakten door zwarte magie. De grotten worden nu voornamelijk bewoond door ondergrondse dieren, gnolls en afgedankte machines; waarschijnlijk aangetast door dezelfde kracht die de gebieden erboven heeft beïnvloed.
journal.document.intros.caves.title=Grotten
journal.document.intros.city.body=De Dwergenmetropool was ooit de grootste van alle dwergensteden. In haar bloeiperiode bouwden de dwergen wonderbaarlijke machines van metaal en magie waarmee hun stad zich razendsnel kon uitbreiden. Toen, op een dag, werden de stadspoorten vergrendeld en werd er niets meer van de dwergen vernomen. De weinigen die de stad ontvluchtten toen deze sloot, vertelden verhalen over een waanzinnige tovenaar die de troon had gestolen en de verschrikkelijke magie die hij had leren beheersen.
journal.document.intros.city.title=Dwergenmetropool
journal.document.intros.discover_hint=Deze tekst verschijnt wanneer u voor het eerst een specifieke regio bezoekt.
journal.document.intros.dungeon.body=Vele helden hebben zich vóór jou vanuit de stad boven de kerker in gewaagd, maar van de meesten is nooit meer iets vernomen. Er wordt gezegd dat een oeroud kwaad in de diepte schuilt en het machtige Amulet van Yendor bewaakt. Zelfs nu straalt er donkere energie vanuit de diepte omhoog de stad in. \n\nZul jij de kerker overwinnen en het amulet bemachtigen? Het is tijd om je eigen avontuur te beginnen!
journal.document.intros.dungeon.title=Kerker
journal.document.intros.halls.body=Deze diepe hallen van de Dwergenmetropool zijn verdraaid door duistere magie. In het verleden waren deze gebieden de thuisbasis van het hof van de elite-tovenaars van de Dwergenkoning, maar nu lijken ze overgenomen te zijn door iets nog sinisterders... Allerlei afschuwelijke demonische wezens bewonen deze hallen, geleid door een verschrikkelijke duistere macht. Als de Dwergenkoning niet de bron was van de zich verspreidende corruptie, dan moet wat zich hier beneden bevindt dat wel zijn. Wees voorzichtig, slechts weinig avonturiers zijn ooit zo ver afgedaald...
journal.document.intros.halls.discover_hint=Je kunt deze tekst in een specifieke regio vinden, maar alleen nadat je alle voorgaande teksten in deze reeks hebt gevonden.
journal.document.intros.halls.title=Demonenhallen
journal.document.intros.prison.body=Vele jaren geleden werd hier een gevangenis gebouwd voor gevaarlijke criminelen. De gevangenis was streng gereguleerd en beveiligd, en veroordeelden uit het hele land werden hierheen gebracht om hun straf uit te zitten. Maar al snel begon er een duistere nevel van onderaf op te klimmen, die de geest van zowel bewakers als gevangenen verdraaide. Als reactie op de toenemende chaos sloot de stad de hele gevangenis af. Niemand weet wat er is gebeurd met degenen die voor dood werden achtergelaten binnen deze muren...
journal.document.intros.prison.title=Gevangenis
journal.document.intros.sewers.body=De bovenste verdiepingen van de kerker vormen in feite het rioolstelsel van de stad. Naarmate donkere energie van onderaf omhoog is gekropen, zijn de normaal gesproken onschuldige rioolwezens steeds woester geworden. De stad heeft bewakingspatrouilles naar beneden moeten sturen om de veiligheid van degenen boven te waarborgen. Deze plek is gevaarlijk, maar de kwade magie die hier werkzaam is, is tenminste zwak.
journal.document.intros.sewers.title=Riolering
journal.document.intros.title=Introducties van de regio's
journal.document.prison_warden.discover_hint=Je kunt deze tekst in een specifieke regio vinden, maar alleen nadat je alle voorgaande teksten in deze reeks hebt gevonden.
journal.document.prison_warden.journal.body=1e van de lente, 362\n\nDit is de eerste aantekening in het werkdagboek van gevangenisdirectrice Kiana Smith. Met alles wat er de laatste tijd gaande is, heb ik besloten een dagboek bij te houden om mijn gedachten te ordenen.\n\nHet beheren van een gevangenis een halve mijl onder de grond zou nooit makkelijk zijn, maar de laatste tijd lijkt er een soort georganiseerde verstoring plaats te vinden. Gedetineerden gedragen zich zonder reden mis en weigeren vervolgens uit te leggen waarom.\n\nSommige bewakers beginnen te zeggen dat het er spookt. Ik kan niet toestaan dat mijn eigen mensen geruchten verspreiden, maar ik kan ze het niet kwalijk nemen dat ze zich ongemakkelijk voelen.\n- Smith
journal.document.prison_warden.journal.title=Een dagboek bijhouden
journal.document.prison_warden.letter.body=Thomas, je bent een geweldige vriend geweest, dus ik doe je een gunst. Als je vanavond aan je dienst begint, sluit en versterk dan Tengu's cel, gooi de sleutel in een nis en ga ervandoor. Het maakt niet uit of de andere gevangenen onbeheerd zijn, binnenkort kan niemand deze plek verlaten. Die rare snuiter moet echter wel beveiligd blijven, als hij ontsnapt, weet je niet wat hij zal doen. Vertel dit aan niemand en zoek me niet. Een kapitein moet met haar schip ten onder gaan. - Kiana
journal.document.prison_warden.letter.title=Brief aan Thomas
journal.document.prison_warden.mines.body=54e van de winter, 363\n\nEen groep ingenieurs uit de stad kwam vandaag langs en zei dat ze de oude ingang naar de mijnen beneden kwamen afsluiten. Ik neem aan dat de stad geen zin meer heeft om de doorgang te onderhouden. Zoals gewoonlijk was ik niet van tevoren op de hoogte gesteld.\n\nHun hoofdingenieur vertelde me ook wat onzin over dwergenmagie die vanuit de mijnen naar binnen zou sijpelen. Ik geloof er geen woord van.\n\nDe situatie is veel beter onder controle met ons nieuwe personeel, maar de kern van het probleem is nog steeds niet aangepakt. Er is zeker iets dat de gevangenen hier beïnvloedt, en het slopen van een paar muren gaat daar niets aan veranderen.\n- Smith
journal.document.prison_warden.mines.title=Het afsluiten van de mijnen
journal.document.prison_warden.no_support.body=11e lente, 364\n\nWat denkt de stad in hemelsnaam? Nadat ik dringend om hulp heb gevraagd, heb ik niets meer gehoord, zelfs geen loze verontschuldiging zoals ze normaal sturen als mijn verzoeken worden afgewezen.\n\nOndertussen wordt het steeds erger met de gevangenen, en sommige bewakers beginnen zelfs problemen te veroorzaken. Zijn ze van plan dit gewoon te laten escaleren tot we met een oproer te maken krijgen!?\n\nThomas is in ieder geval betrouwbaar gebleven. Zijn organisatorische hulp is van onschatbare waarde geweest, en zijn idee om die oude DM-100-eenheden te activeren was betreurenswaardig maar noodzakelijk. Ik heb er vertrouwen in dat ik deze situatie weer onder controle kan krijgen, ik heb alleen wat verdomde steun nodig!\n-Smith
journal.document.prison_warden.no_support.title=Geen ondersteuning
journal.document.prison_warden.recruits.body=80e van de lente, 362\n\nZoals beloofd, zijn er vandaag een heleboel nieuwe rekruten aangekomen. Het lijkt wel zoals altijd: een paar veelbelovende en een hoop knechten die alleen maar op het loon uit zijn. Maar al die nieuwe spierkracht zal ons zeker helpen met onze recentelijk onhandelbare gevangenen.\n\nIn een baan als deze is het belangrijk om te weten wie je kunt vertrouwen. Eén nieuwe aanwinst, Thomas, lijkt bijzonder veelbelovend. Ik kan alle hulp gebruiken die ik nu kan krijgen, dus als hij het goed doet, zal ik ervoor zorgen dat hij snel promotie krijgt.\n- Smith
journal.document.prison_warden.recruits.title=Nieuwe rekruten
journal.document.prison_warden.rotberry.body=23e van de herfst, 363\n\nVandaag een prachtig cadeau van Felix gekregen. Het is een soort felrode struik die 'Rotberry' heet.\n\nIk heb hem al eerder verteld hoe somber deze plek is, het lijkt erop dat hij geluisterd heeft. Volgens hem houdt deze plant niet van licht en water, dus ik hoef de bladeren maar eens per maand of zo terug te snoeien. Snoeien moet wel belangrijk zijn, want hij heeft het wel twaalf keer in zijn brief genoemd.\n\nNatuurlijk doet Felix nooit iets gratis. Hij zegt dat de zaden die deze plant produceert geweldig zijn om toverstokken van te maken, dus ik ben hem er natuurlijk een paar verschuldigd elke keer dat de plant er wat produceert.\n- Smith
journal.document.prison_warden.rotberry.title=Rotbesplant
journal.document.prison_warden.title=Dagboek van de gevangenisdirecteur
journal.document.sewers_guard.crabs.body=11e van de winter, 376\nLieve mama en papa,\n\nAlsof de ratten nog niet erg genoeg waren, zitten er dieper in de grot ook nog gigantische krabben! Eentje stormde vlak langs me heen en verwondde Lee behoorlijk voordat we hem doodden. Thomas zegt dat het niet mijn schuld is, maar ik weet dat hij gewoon aardig tegen me probeert te zijn.\n\nGelukkig kwamen we op weg naar buiten een avonturier tegen die wat zonnegraszalf over had. Lee had het zonder dat spul misschien niet gered.\n\nIk zag de avonturier naar een roos staren voordat ze vertrokken, ze zeiden dat het een cadeau was. Waarom zouden ze hier beneden hun leven riskeren als iemand zoveel om ze geeft?\n\nDat is precies wat ik aan het doen ben, hè? Ik heb het gevoel dat ik de situatie niet meer onder controle heb.
journal.document.sewers_guard.crabs.title=Reuzenkrabben!
journal.document.sewers_guard.dangerous.body=88e Herfst, 375\nLieve mama en papa,\n\nIk snap nu waarom het loon zo goed is, de riolen wemelen van de monsters! Het 'ongedierte' en de 'bandieten' zijn gigantische bloeddorstige ratten en groepen boze gnolls.\n\nGelukkig weet de rest van mijn team echt wat ze doen. Onze teamcaptain, Thomas, is er een expert in. Ik probeer het snel te leren, zodat ik niet te veel een last ben.\n\nDeze baan is veel gevaarlijker dan ik dacht. Ik ben blij dat ik deze nu niet kan versturen, ik wil niet dat jullie je zorgen maken.\n\nIk zal voorzichtig zijn,\n- Sonya
journal.document.sewers_guard.dangerous.title=Een gevaarlijke situatie...
journal.document.sewers_guard.discover_hint=Je kunt deze tekst in een specifieke regio vinden, maar alleen nadat je alle voorgaande teksten in deze reeks hebt gevonden.
journal.document.sewers_guard.guild.body=23e van de winter, 376\nLieve mama en papa,\n\nGeen nieuwe monsters deze keer, in plaats daarvan kwamen we tijdens een patrouille een kleine groep van het dievengilde tegen.\n\nAlles wat ik over het gilde heb gehoord is slecht, maar de rest van mijn team leek bijna bevriend met hen. Thomas wisselde informatie en voorraden uit met een van hen voordat we onze eigen weg gingen.\n\nIk snap het niet, was het niet de bedoeling dat we bandieten zouden uitschakelen? Thomas zei zelfs dat ik dit aan niemand in de commandostructuur mocht vertellen. Hun informatie en voorraden waren echter erg nuttig, en we konden niet nog meer gevechten aan.\n\nIk denk dat we hier beneden allemaal in hetzelfde schuitje zitten.
journal.document.sewers_guard.guild.title=Het Dievengilde
journal.document.sewers_guard.lost.body=40e van de winter, 376\n\nThomas en ik zijn verdwaald. We zijn van de rest van het team afgedwaald tijdens een gevecht met een paar gnolls. Geen van ons is gewond, maar de lagere riolen zijn net een doolhof.\n\nThomas zegt dat hij een uitweg kent, maar die begint bij de oude gevangenisingang onderin de riolen. Ik ga liever niet dieper, maar we hebben geen rantsoenen en naar beneden gaan is veel sneller dan ronddwalen op zoek naar onze patrouilleroute.\n\nHet komt wel goed. Thomas weet wat hij doet.
journal.document.sewers_guard.lost.title=We zijn verdwaald.
journal.document.sewers_guard.new_position.body=85e Herfst, 375\nLieve mama en papa,\n\nIk zei toch dat al dat harde werk bij de stadswacht zijn vruchten zou afwerpen. Ik ben net gepromoveerd!\n\nIk ben uitgenodigd om me aan te sluiten bij een specialistisch team dat in de riolen werkt. Blijkbaar zijn er problemen met ongedierte en bandieten daaronder, en het is onze taak om ze te verjagen. Het is vies werk, maar de riolen zijn warm in de winter en het betaalt drie keer zoveel als gewone wachtdienst!\n\nHet is allemaal een beetje geheimzinnig, dus ik kan deze brief eigenlijk niet versturen. Het voelt raar om jullie niet te schrijven, dus ik blijf ze toch schrijven. Misschien kan ik ze jullie ooit laten zien.\n\nGroeten,\n- Sonya
journal.document.sewers_guard.new_position.title=Mijn nieuwe functie!
journal.document.sewers_guard.not_worth.body=Thomas en ik kwamen bij de ingang van de gevangenis een soort gigantisch slijmmonster tegen. Voordat we konden reageren, bestookte het ons met magie. Thomas incasseerde het meeste. Hij is dood. Geen enkel bedrag is dit waard. Ik ga vertrekken via de route die Thomas me heeft verteld. Dan neem ik wat ik als bewaker heb verdiend en gebruik dat om mijn ouders en mij weg te halen uit deze vervloekte stad. Een deel van mij hoopt dat de koning een plan heeft voor dit alles, maar ik betwijfel het. Ik laat deze brieven achter als waarschuwing voor anderen. Het is meer dan alleen gigantische ratten en krabben, er is hier iets heel erg mis.
journal.document.sewers_guard.not_worth.title=Het is het niet waard.
journal.document.sewers_guard.title=Brieven van de bewaker
