journal.document.adventurers_guide.alchemy.body=Se vi ne trovas konsumeblan objekton utila, vi povas uzi ĝin kiel alĥemian ingrediencon aŭ transformi ĝin en universalan alkemian energion. Energigaj pocioj kaj volvlibroj ankaŭ identigas ilin!\n\nTrinketoj estas unika speco de ekipaĵo, kiu estas kreita kaj ĝisdatigita per alĥemio. Ili estas faritaj per magia trinketa katalizilo kaj iom da alkemia energio.\n\n(La unua alĥemia poto estas sur la 3a aŭ 4a etaĝo de la kelkarcero. Estas ankaŭ paĝoj de alĥemiaj receptoj proksime de ĉi tiuj potoj.)
journal.document.adventurers_guide.alchemy.title=Alĥemio kaj Ornamaĵoj
journal.document.adventurers_guide.dieing.body=Kelkarceresplorado estas danĝera kaj plej multaj aventuristoj fine renkontas sian finon.\n\nBonŝanco helpas, sed la plej bonaj aventuristoj uzas ĉiun malgrandan ruzaĵon por plibonigi siajn ŝancojn.\n\n(Ne maltrankviliĝu se vi mortas multe, ĉi tiu ludo estas malfacila! Fokusu pri lernado de la ludo kaj konstante plibonigado, ne pri tuja venko.)
journal.document.adventurers_guide.dieing.title=Traktado de Malvenko
journal.document.adventurers_guide.examining.body=Gravas studi viajn malamikojn kaj ĉirkaŭaĵon anstataŭ rapidi blinde! Alkutimiĝu ekzameni ĉion novan.\n\n(Vi povas ekzameni per la lupeo-butono kaj poste elektante tion, kion vi volas ekzameni. Vi ankaŭ povas ekzameni plibonigojn aŭ malplifortigojn elektante iliajn ikonojn.)
journal.document.adventurers_guide.examining.title=Ekzamenante
journal.document.adventurers_guide.food.body=Efika ŝparporciigo estas unu el la plej bonaj manieroj plibonigi viajn ŝancojn de postvivado, vi ne ĉiam bezonas manĝi ĝuste kiam vi malsatas! \n\nKiam vi ne malsatas, vi malrapide regeneriĝos sanon, do se vi manĝas kun plena sano, tiu regenerado estos malŝparita! \n\nSe vi paŝas kiam vi manĝas laŭ via sano, via manĝaĵo daŭros multe pli longe.
journal.document.adventurers_guide.food.title=Traktado de Malsato
journal.document.adventurers_guide.identifying.body=La koloroj de pocioj kaj simboloj sur volvlibroj estas malsamaj en ĉiu kelkarcero. Neidentigita ekipaĵo povas esti plibonigita aŭ sorĉita se vi bonŝancas, aŭ ĝi povus esti malbenita! \n\nRvolvlibroj por identigi, plibonigi aŭ forigi malbenon estas tre utilaj se vi volas redukti la riskon uzi neidentigitan ekipaĵon. \n\n(Vi povas trovi liston de ĉiuj objektoj, kiujn vi identigis, en la kataloga langeto de via taglibro)
journal.document.adventurers_guide.identifying.title=Identigante Erojn
journal.document.adventurers_guide.intro.body=Saluton Aventuristo, vi legas la Volumon de Majstreco de Kelkarcero! Ĉi tiu gvidlibro estas plej bone uzata kiel referenco, kaj magie sciigos vin kiam estas plej bone legi ĉiun paĝon.\n\n(Kiam la butono de la ĵurnalo ekbrilas, elektu ĝin por legi kion la gvidlibro diras al vi! Kelkaj paĝoj tamen mankas, eble vi povas trovi ilin en la kelkarcero?)
journal.document.adventurers_guide.intro.title=Enkonduko
journal.document.adventurers_guide.levelling.body=Nivelaltiĝo plibonigas viajn statistikojn kaj premias talentpoentojn, kio povas fari grandan diferencon en batalo. Estas plej bone havi almenaŭ unu nivelon por ĉiu etaĝo de la kelkarcero.\n\nPovas esti tente rapidi kaj eviti esploradon aŭ batalon, sed fari tion senigos vin je provizoj kaj sperto.\n\n(Vi povas vidi informojn pri via heroo, inkluzive de sperto, en la statusa panelo ĉe la angulo de la ludinterfaco. Elektu vian herooportreton por akiri eĉ pli da informoj.)
journal.document.adventurers_guide.levelling.title=Gajnante Sperton
journal.document.adventurers_guide.looting.body=Ĉambroj malantaŭ ŝlositaj pordoj aŭ kiuj enhavas obstaklojn kutime havas pli bonan rabaĵon. Kiam obstaklo blokas vian vojon, vi kutime povas trovi objekton por helpi sur la sama etaĝo.\n\nVi ĉiam povos trovi 2 pociojn de forto kaj 3 volvlibrojn de plibonigo en ĉiu kvin-etaĝa kelkarcera regiono, do ili estas bonega indikilo de kiom bone vi esploras.\n\n(Vi povas vidi liston de orientiloj kaj neuzataj ŝlosiloj en la noto-langeto de la ĵurnala fenestro.)
journal.document.adventurers_guide.looting.title=Efika Rabado
journal.document.adventurers_guide.magic.body=Magiaj atakoj tranĉas rekte tra kiraso kaj estas malfacile eviti. Tio signifas, ke damaĝo de sorĉbastonoj estas tre fidinda, sed ankaŭ igas magiajn malamikojn tre danĝeraj!\n\n Magiaj atakoj ĉiam havas malavantaĝon tamen. Sorĉbastonoj havas limigitajn ŝargojn kaj magiaj malamikoj kutime ne povos uzi sian magion proksime.\n\n Kiam oni alfrontas malamikojn, kiuj uzas magion, gravas lerni kiel malhelpi ilin uzi ĝin kontraŭ vi.
journal.document.adventurers_guide.magic.title=Magiaj Atakoj
journal.document.adventurers_guide.positioning.body=Strategio estas same grava kiel ekipaĵo. Malbonaj situacioj kiel ĉirkaŭiĝo kutime eviteblas per bona poziciigado.\n\nEkzemple, plej multaj kelkarceroj havas maldikajn koridorojn, kiuj devigas malamikojn batali kontraŭ vi unu post la alia. Ĉi tiuj koridoroj ofte ankaŭ havas pordojn por surprizaj atakoj!\n\nEstas multaj malgrandaj manieroj uzi mediajn elementojn kiel herbon, akvon, fosaĵojn aŭ kaptilojn avantaĝe.
journal.document.adventurers_guide.positioning.title=Poziciigado
journal.document.adventurers_guide.searching.body=Kelkarceroj estas plenaj de sekretaj pordoj kaj kaptiloj, kiuj ŝajnas nevideblaj je unua ekrigardo. Vi povas pasigi iom da tempo kaj zorge serĉi se vi suspektas, ke pordo aŭ kaptilo estas kaŝita proksime. \n\n(Vi povas serĉi ĉiujn kahelojn ĉirkaŭ vi uzante la lupeon dufoje. Eble estas kelkaj kaŝitaj pordoj proksime al kie vi trovis ĉi tiun paĝon!)
journal.document.adventurers_guide.searching.title=Serĉante
journal.document.adventurers_guide.strength.body=Ne estas tempo por trejni per armiloj kaj kirasoj, kiujn vi trovas en la kelkarcero, do vi bezonos krudan forton por uzi ilin efike. \n\nPocioj de forto kaj volvlibroj de plibonigo estas la plej efika maniero plenumi la fortpostulojn de pli altnivela ekipaĵo. \n\nGravas poste komenci uzi altnivelajn objektojn, sed ne ignoru ekipaĵon, kiun vi povas uzi nun.
journal.document.adventurers_guide.strength.title=Forto
journal.document.adventurers_guide.surprise_attacks.body=Surprizatakoj certe trafos, igante ilin aparte utilaj kontraŭ evitemaj malamikoj kiel serpentoj kaj fantomoj. \n\nVi povas surprizi malamikojn tuj post kiam ili eniras pordon dum ili ĉasas vin, aŭ kiam ili alie perdas vin el vido.
journal.document.adventurers_guide.surprise_attacks.title=Surprizaj Atakoj
journal.document.adventurers_guide.title=volumo de kelkarcera majstrado
journal.document.adventurers_guide.upgrades.body=Ju pli profunden vi eniras en kelkarceron, des pli grave estas, ke vi uzu magie ĝisdatigitan altnivelan ekipaĵon, sed vi ankaŭ bezonos la forton por uzi ilin ĝuste. \n\nSorĉoj, ringoj kaj artefaktoj ne bezonas forton, sed havas limigitajn uzojn aŭ ne helpas tiel rekte en batalo. \n\nFari bonajn elektojn pri tio, kion vi ĝisdatigas, estas tre grave por postvivi frue en la kelkarcero, kaj por prepari vin por sukceso poste en la kelkarcero.
journal.document.adventurers_guide.upgrades.title=Ĝisdatigoj
journal.document.alchemy_guide.bombs.body=Norma nigrapulva bombo povas esti miksita kun specifa objekto por krei plibonigitan bombon.
journal.document.alchemy_guide.bombs.title=Plibonigitaj Bomboj
journal.document.alchemy_guide.brews_elixirs.body=Infusaĵoj kaj eliksiroj estas progresintaj pocioj kun diversaj efikoj, kutime kun ununura uzo.
journal.document.alchemy_guide.brews_elixirs.title=trinkaĵoj kaj eliksiroj
journal.document.alchemy_guide.energy_food.body=Multaj receptoj postulas kristalan alkemian energion, kiu estas farita per malkonstruado de konsumeblaj objektoj en alĥemia poto. Energiigaj pocioj aŭ volvlibroj ankaŭ identigas ilin. \n\nKelkaj receptoj kiuj postulas energion estas magiaj, sed ĉi tiuj similas tradician kuiradon.
journal.document.alchemy_guide.energy_food.title=Energio kaj Manĝaĵo
journal.document.alchemy_guide.exotic_potions.body=Pocioj povas esti miksitaj kun energio por krei ekzotikajn pociojn. Ili havas pli potencajn efikojn, sed ofte utilas laŭ diversaj manieroj.
journal.document.alchemy_guide.exotic_potions.title=ekzotikaj pocioj
journal.document.alchemy_guide.exotic_scrolls.body=Ekzotikajn volvlibrojn oni povas fari per iom da energio kaj volvlibro. Ili estas iom pli fortaj kaj pli multekostaj ol ekzotikaj pocioj.
journal.document.alchemy_guide.exotic_scrolls.title=ekzotikaj volvlibroj
journal.document.alchemy_guide.potions.body=Bonvenon al Praktikaj Aplikoj de Alĥemio! Ĉi tiu libro estas referenco de receptoj por krei objektojn ĉe alĥemia poto. \n\nNi komencos per la plej ikoneca recepto: Pocioj! \n\nUzu tri semojn por fari hazardan pocion! Ĉiu semo havas pocian ekvivalenton, uzu plurajn de la sama semo por pliigi la ŝancon, ke la pocio rilatas al la semoj, kiujn vi uzis.
journal.document.alchemy_guide.potions.title=Enkonduko kaj Pocioj
journal.document.alchemy_guide.spells.body=Sorĉoj estas enhavitaj en kristaloj kaj provizas diversajn efikojn, kutime kun pluraj uzoj.
journal.document.alchemy_guide.spells.title=sorĉoj
journal.document.alchemy_guide.stones.body=Miksi volvlibron en alĥemian poton enigos sian magion en du ŝtonojn ene de la poto. Tio kreas runŝtonojn kaj identigas la volvlibron!
journal.document.alchemy_guide.stones.title=Kreante Runŝtonojn
journal.document.alchemy_guide.title=Alĥemia Gvidilo
journal.document.alchemy_guide.weapons.body=Kelkaj el la pli malpezaj aŭ pli magiaj armiloj uzeblas en alĥemio!\n\nĈiu ĵetarmilaro produktas sufiĉe da likva metalo por plene ripari alian aron de la sama nivelo kaj tavolo. Notu, ke alĥemiigo de aro detruos la tutan aron, eĉ se ĝi ne ĉeestas tute!\n\nUnu sorĉbastono produktos sufiĉe da arkana rezino por plibonigi du sorĉbastonojn de la sama nivelo, sed ne pli ol +3.
journal.document.alchemy_guide.weapons.title=Plibonigante Armiloj
journal.document.caves_explorer.alive.body=23-a de Somero, 308\n\nUnu el la nanaj maŝinoj iel ekviviĝis! Ni nur preterpasis kiam ĝi atakis kaj preskaŭ dispremis du el nia grupo per siaj grandegaj metalaj pugnoj. Feliĉe, mi portis mian sorĉbastonon de disfalo kun mi. Kelkaj bone celitaj eksplodoj de tio kaj la besta aĵo estis reduktita al rubmetalo.\n\nKio ĝenas min estas, ke ni faris absolute nenion por provoki la maŝinon. La nanoj tute ne povus esti desegnintaj la maŝinojn por esti tiel agresemaj, estas kvazaŭ ĝi provus embuski nin!\n\nAlmenaŭ mi povis oferti iom da helpo al miaj kunuloj por unufoje.\n- Archibald
journal.document.caves_explorer.alive.title=Ĝi Vivas!
journal.document.caves_explorer.city.body=21a de Somero, 308\n\nNi nun estas ĉe la trisemajna marko, kaj post pasigado de granda parto de la lastaj dek tagoj mapante ĉiam pli profunden, ni fine atingis la fundon de la minejoj. Ni trovis diversajn metalajn aparatojn kaj grandan pordegon, kiu blokas eniron al la malnova nana metropolo.\n\nLa forĝisto avertis nin pri iuj el ĉi tiuj maŝinoj. Ĝi ŝajne estis destinita por areodefendo kaj emas aktiviĝi kiam ĝenata. Ni ne havas aferojn en la urbo, kaj la metalo havus minimuman rubvaloron, do ni pensis, ke estas plej bone atenti lian averton kaj reiri.\n\nMi devas konfesi, ke mi scivolis, sed esplori tie sube certe ne valoris la riskon.\n- Archibald
journal.document.caves_explorer.city.title=La Urba Enirejo
journal.document.caves_explorer.discover_hint=Vi povas trovi ĉi tiun tekston en specifa regiono, sed nur post trovo de ĉiuj antaŭaj tekstoj en ĉi tiu aro.
journal.document.caves_explorer.expedition.body=1-a de Somero, 308\n\nHodiaŭ komenciĝas nia kvar-semajna ekspedicio en la forlasitajn nanajn minejojn! Mi estis komisiita de la reĝo mem por esplori la regionon. Miaj ĉefaj celoj estas trovi iujn ajn neuzitajn naturajn rimedojn kaj mezuri la kavernojn por ebla prizonkonstrua projekto.\n\nDum mi kapablas defendi min, mi akceptis akompanon de la urba gvardio laŭ la insisto de la reĝo. Ili estas aro da naivuloj, sed kondiĉe ke ili ne malrapidigas min, ilia ĉeesto estas tolerebla.\n\nOni atendas, ke ni malplenigos la kloakojn kaj atingos la minejojn antaŭ la vespero.\n- Archibald Drummond. Arkimagisto, suda sorĉista instituto.
journal.document.caves_explorer.expedition.title=Ekspedicio Komenco!
journal.document.caves_explorer.gold.body=4a de Somero, 308\n\nNiaj unuaj tagoj estis vere tre fruktodonaj! Post establado de bazkampadejo, ni ekiris esplori kelkajn el la supraj areoj de la forlasita minejo. Kvankam estas multe da senutila rubo lasita de la dŭarfoj, multaj el la kavernaj muroj ankaŭ abundas je oro!\n\nBedaŭrinde, ni ne estas la unuaj ĉi tie. La kavernoj abundas je agresema faŭno, kaj ŝajnas ke grupoj de gnoluloj ankaŭ interesiĝas pri la oro. Mi konfesas, ke mi estis maljusta al mia gardista akompano, ili estis multe pli kapablaj esploristoj kaj korpogardistoj ol mi atendis.\n\nEĉ kun ĉi tiu sukceso, ni ankoraŭ havas multon el la minejoj por esplori.\n- Archibald
journal.document.caves_explorer.gold.title=Tiom da Oro!
journal.document.caves_explorer.report.body=28-a de Somero, 308\n\nHodiaŭ ni finos paki niajn havaĵojn kaj preparos nin por foriri. Ĝustatempe ankaŭ, pluraj el nia grupo komencis havi terurajn koŝmarojn post la okazaĵo kun la agresema maŝino. Verŝajne temas nur pri laceco, sed iliaj koŝmaroj estas ĉiuj maltrankvilige similaj.\n\nResume, la supraj areoj de la minejo estas sufiĉe sekuraj. Se oni povus trovi uzon por malhela oro, tiam ĝia minado povus esti sufiĉe profita. La grandaj malfermaj areoj ankaŭ tre bone funkcius por la konstruplanoj de la urbo. La pli malaltaj minejoj tamen estas pli danĝeraj, kaj oni devus eviti ilin.\n\nMi skribos ĉion ĉi en mian finan raporton dum la sekvaj tagoj.\n- Archibald
journal.document.caves_explorer.report.title=Fina Raporto
journal.document.caves_explorer.title=Esplorista Taglibro
journal.document.caves_explorer.troll.body=11-a de Somero, 308\n\nPost komenco de nia esplorado en la mezon de la minejoj, ni renkontis amikan vizaĝon! Nu... relative amikan. Kaverna trolo starigis tie malgrandan forĝejon. Li estas malafabla kaj ne tre parolema, sed riparis nian ekipaĵon kontraŭ iom da oro.\n\nBedaŭrinde, la trolforĝisto ankaŭ informis nin, ke ĉi tiu tuta bela oro ne estas tiel bona kiel ĝi ŝajnas. Li nomas ĝin "malhela oro" kaj ŝajne ĝi rapide putriĝas en sunlumo. Tio certe klarigus, kial neniam estis konfliktoj pri la resursoj ĉi tie.\n\nMi supozas, ke ni bezonas esplori iom pli profunde por vidi, ĉu ekzistas io pli valora.\n- Archibald
journal.document.caves_explorer.troll.title=Renkontis Trolon
journal.document.city_warlock.discover_hint=Vi povas trovi ĉi tiun tekston en specifa regiono, sed nur post trovo de ĉiuj antaŭaj tekstoj en ĉi tiu aro.
journal.document.city_warlock.failure.body=Ŝajnas, ke mi ankaŭ estas malsaĝulo. Mi supozis, ke la Nova Reĝo bezonis, ke la kortego submetiĝu al li volonte, sed nun mi vidas, ke li havas la potencon kontroli eĉ tiujn, kiuj rezistas lin. \n\nMi blinde alportis ĉiujn plej fortajn opoziciojn rekte al lia sojlo, por ke li povu persone transformi ilin en siajn sklavojn. Nun ondoj de lia nekroza energio trairas la urbon, tuj transformante la plej multajn en liajn petantojn. \n\nLa malmultaj, kiuj ankoraŭ havas liberan volon, fuĝas. Mi elektis resti malantaŭe por observi kiel eble plej bone kaj serĉi malfermaĵon. Kun la magia povo, kiun mi havas, mi devus povi resti kaŝita kaj sekura dum iom da tempo.
journal.document.city_warlock.failure.title=Fiasko
journal.document.city_warlock.more_powerful.body=Konservi la tempon fariĝis malfacile, sed pasis ĉirkaŭ semajno ekde mia lasta eniro. Nia civilizo vere kolapsis. La pordegoj estas fermitaj, ĉiuj funkcioj de nia socio ĉesis, kaj malplenaj nanaj glumoj vagas tra la haloj.\n\nDum ĉio ĉi, iel, la Nova Reĝo fariĝas eĉ pli potenca. Ĉiutage la forto de lia volo fariĝas pli forta, sed ĝi ankaŭ ŝanĝiĝas. Mi ne povas priskribi ĝin, sed ŝajnas kvazaŭ li tute ne plu estas nano.\n\nMi komencas akcepti, ke la plej bona afero, kiun mi verŝajne povas esperi fari, estas dokumenti ĉi tiujn eventojn. Mi restos ĉi tie tiel longe kiel eble, kaj poste retiriĝos kiam mia volo komencos malfortiĝi.
journal.document.city_warlock.more_powerful.title=Pli Potenca
journal.document.city_warlock.new_power.body=Kio okazas ĉi tie? La potenco eliranta de la Nova Reĝo efektive estas malsama ol komence, sed estas ankaŭ io alia. Ĉi tiu nova potenco ŝajnas radii el la plej internaj haloj de nia urbo.\n\nEĉ pli enigma estas, ke la aktiveco en la supra metropolo ankaŭ malpliiĝis. Mi ne scias, kio okazas tie sube, sed ĝi altiras preskaŭ la tutan atenton de la Nova Reĝo.\n\nReveni al la profundaj haloj estos danĝere, sed mi devas malkovri, kio kaŭzas ĉi tiun ŝanĝon. Eble la Nova Reĝo ja havas malfortecon?
journal.document.city_warlock.new_power.title=Nova Potenco
journal.document.city_warlock.old_king.body=Estas la 5a tago de la 2a monato de la 33a jaro de la epoko de magio. Se supermondano legas ĉi tion, ĝi estas iam en Vintro 264. Mia nomo estas Thymor Zahir, kaj laŭ mia scio mi estas la lasta pluvivanto de la nana kortego.\n\nNia Reĝo estas mortinta, anstataŭigita de unu el miaj iamaj kolegoj, kiu freneziĝis pro potenco. La resto de la kortego submetiĝis al li, kiel la malsaĝuloj, kiuj ili estas, kaj perdis sian liberan volon en la procezo. Mi sole vidis ĉi tion veni kaj fuĝis antaŭ ol lia rito povus esti kompletigita.\n\nLa interna rondo falis, sed la potenco de la Nova Reĝo ankoraŭ ne atingis ĉiujn. Mi devas rezisti kiel eble plej rapide. Mi rifuzas lasi nian gloran civilizon fali al ĉi tiu megalomaniulo!
journal.document.city_warlock.old_king.title=La Reĝo estas Mortinta
journal.document.city_warlock.resistance.body=Ŝajnas, ke la famo disvastiĝis rapide. Pasis nur kelkaj tagoj kaj mi jam amasigis malgrandan armeon da lojaluloj al la Maljuna Reĝo. Malmultaj estas lertaj pri magio, sed preskaŭ la tuta ordeno de militistaj monaĥoj estas inter ni. Ni devus esti pli ol sufiĉaj por kontraŭstari unu freneziĝintan nanon kaj lian kortegon de sklavoj.\n\nDume la Nova Reĝo kaŝis sin en la internaj ĉambroj de nia urbo. Sendube li elspezis la plejparton de sia potenco kaj esperas resaniĝi antaŭ ol li renkontos pli da rezisto.\n\nNi lanĉos nian atakon post kelkaj horoj. Kun bonŝanco ni povos formi provizoran konsilion kaj redoni stabilecon al nia mirinda urbo antaŭ la fino de la nokto.
journal.document.city_warlock.resistance.title=Rezisto
journal.document.city_warlock.seen_it.body=Mi vidis, kio kuŝas sube, sed mi ne povas priskribi ĝin. Miaj manoj tremas nekontroleble dum mi provas skribi miajn pensojn.\n\nKial ĉi tio okazas? Ĉu la Nova Reĝo faris ĉi tion? Ĝi ne havas sencon. Eble lia senrespondeca uzado de potenco allogis ĝin? Mi esperis savi nian civilizon, sed nun mi vidas, ke la tuta mondo estas en danĝero.\n\nIel, la reĝo estas la malpli granda malbono. Mi havas neniun alian elekton, por la pli granda bono mi cedos min. Bonvolu gvidi min, mia reĝo, uzu min kiel instrumenton por teni Yog-Dzewa-n for!
journal.document.city_warlock.seen_it.title=Mi Vidis Ĝin
journal.document.city_warlock.title=La ĵurnalo de sorĉisto
journal.document.halls_king.amulet.body=MI FARIS ĜIN!\n\nMi ne sciis, kion mi eble trovos precize, sed kion mi malkovris tie ekstere estis preter miaj plej sovaĝaj supozoj. Tiom da potenco, nur sidanta tie preta por esti prenita, kaj ĝi estas tute mia!\n\nKun ĉi tio neniu el la malsaĝuloj en la kortumo kuraĝos kontraŭstari min. Mi nur kapturnas min pensante pri ĉiuj diversaj manieroj, kiel mi povus humiligi ilin. Infero, kial halti tie, mi havas sufiĉe da potenco por detrui ĉiun lastan el ili, se mi volas! Tio eble estas troa, sed mi ne devas tro longe decidi, alie ili suspektiĝos.\n\nMi pensas, ke mi nomos ĉi tiun grandan potencon la Amuleto de Yendor!\n- R.
journal.document.halls_king.amulet.title=La Amuleto
journal.document.halls_king.attrition.body=Mi havas planon por trakti la aĵon. Ĝia potenco estas senfina, sed ĝia kapablo entrudiĝi en ĉi tiun mondon ne estas. Ĝi dependas de helpantoj kaj avataroj por plenumi siajn dezirojn dum ĝi provas konstrui sufiĉe da potenco por preni la amuleton.\n\nKvankam mi fizike ne posedas la amuleton, mi tamen havas plenan kontrolon super ĝia potenco. Kun la tuta nana urbo je mia dispono, mi ankaŭ havas nombre avantaĝon. Mi povas simple daŭre sendi soldatojn por malhelpi ĝin kapti la amuleton kaj konstante venki en ĉi tiu milito per elĉerpiĝo!\n\nMI, RODNEY, REĜO DE NANOJ, POVOS POSTVIVI VIN YOG-DZEWA!
journal.document.halls_king.attrition.title=Eluziĝo
journal.document.halls_king.discover_hint=Vi povas trovi ĉi tiun tekston en specifa regiono, sed nur post trovo de ĉiuj antaŭaj tekstoj en ĉi tiu aro.
journal.document.halls_king.new_king.body=MI ESTAS REĜO, HAHAHAHAHAAA!\n\nIli simple lasis min fari ĝin! Apenaŭ konvinkite, ili konsentis lasi min "kunhavigi" ĉi tiun potencon kun ili en granda rito. Momente ili transformiĝis de ĥoro de mokaj voĉoj al mia nova kortego de silentaj regatoj!\n\nAntaŭvideble, Thymor forkuris kiel malkuraĝulo ĉe la unua signo de problemo. Mi jam povas senti la rezistan forton, kiun li ankaŭ konstruas. Mi pensas, ke mi permesos al li daŭrigi, por ke li povu liveri ĉiujn siajn konspirantojn rekte al mia pordo!\n\nKlare la regno ankaŭ ne respektas min, mi supozas, ke mi ankaŭ riparos tion.\n- Reĝo de la Dŭarfoj
journal.document.halls_king.new_king.title=Nova Reĝo
journal.document.halls_king.rejection.body=IMBECILULOJ!\n\nDum la lastaj 33 jaroj nia regno prosperis per nia nova magia teknologio. Ni lernis kiel alvoki elementajn spiritojn kaj fleksi ilin al nia volo, sed iel nun plia eksperimentado estas "tro danĝera".\n\nMi scias, kio vere okazas. La malakcepto de miaj teorioj havas nenion komunan kun ilia merito kaj ĉion komunan kun la persono, kiu sugestas ilin. Ili verŝajne ĉiuj ridas pri mi malantaŭ mia dorso.\n\nNu, ne plu! Mi ne zorgas pri tio, kion ili diras, mi esploros la plej malproksimajn partojn de nia universo sola, kaj gardos ĉion, kion mi malkovros, por mi mem!\n- R.
journal.document.halls_king.rejection.title=Malakcepto
journal.document.halls_king.ritual.body=Thymor publike alfrontis min pli frue hodiaŭ kaj insistis, ke mi klarigu mian novan fonton de potenco. Mi forsendis lin kiel eble plej bone, sed mi denove sentas la juĝantajn okulojn de la resto de la kortego sur mi.\n\nMi esperis pasigi iom pli da tempo ĝuante la trankvilon antaŭ la ŝtormo, sed ĝi ne vere gravas. Mi decidis, kion mi volas fari. Mi asertos, ke mi akiris mian potencon per nova rito, kaj proponos plenumi ĝin sur la aliaj sorĉistoj kaj la Reĝo. Post kiam la rito finiĝos, mi estos reĝo!\n\nThymor protestos, kompreneble, sed kun tiom da potenco ofertita, mi dubas, ke ili aŭskultos lin!\n\nĈIUJ KLINIĜOS ANTAŬ MI!\n- Estonta Reĝo de la Dŭarfoj
journal.document.halls_king.ritual.title=La Rito
journal.document.halls_king.thing.body=Estas problemo. Thymor estis sendita sen peno, sed ŝajnas, ke mia serĉado en la eksteraj ebenoj ne restis nerimarkita.\n\nIu... 'aĵo'... estis altirita al mia mondo kaj komencas trudi sin tra la fundo de la pli malaltaj haloj. Por plu kompliki la aferojn, tio estas la preciza loko, kie mi konservis la amuleton! Tia malica estaĵo, kial ĝi devas provi nei al mi mian potencon, kiam estas multe tie ekstere ankoraŭ por preni?\n\nMalgraŭ mia potenco tamen, mi ne pensas, ke mi povas simple ataki kaj batali kontraŭ ĝi. Ĝia vera potenco estas nekomprenebla, sed devas esti iu maniero limigi ĝin. MI DEFENDOS MIAN PREMION!
journal.document.halls_king.thing.title=La Aĵo
journal.document.halls_king.title=La ĵurnalo de ???
journal.document.intros.caves.body=Ĉi tiuj maldense loĝataj kavernoj etendiĝas sub la forlasita malliberejo. Riĉaj je mineraloj, ili iam estis centro de vigla komerco kaj industrio por la nana socio sube, sed ili estis forlasitaj kiam la nanoj obsediĝis pri malhela magio. \n\nLa kavernoj nun estas plejparte loĝataj de subtera faŭno, gnoluloj kaj forlasita maŝinaro; verŝajne koruptitaj de la sama potenco, kiu influis la regionojn supre.
journal.document.intros.caves.title=Kavernoj
journal.document.intros.city.body=La Nana Metropolo iam estis la plej granda el ĉiuj nanaj urboŝtatoj. En sia glortempo la gnomoj konstruis mirindajn maŝinojn el metalo kaj magio, kiuj permesis al ilia urbo rapide kreski. \n\nTiam, unu tagon, la urbaj pordegoj estis baritaj kaj neniu denove aŭdis de la gnomoj. La malmultaj, kiuj eskapis el la urbo dum ĝi fermiĝis, rakontis historiojn pri freneza sorĉisto, kiu ŝtelis la tronon, kaj la teruran magion, kiun li lernis kontroli.
journal.document.intros.city.title=Nana Metropolo
journal.document.intros.discover_hint=Vi povas trovi ĉi tiun tekston kiam vi unuafoje eniras specifan regionon.
journal.document.intros.dungeon.body=Multaj herooj jam eniris la kelkarceron antaŭ vi el la urbo supre, pri la plej multaj oni neniam plu aŭdis.\n\nOni diras, ke antikva malbono kaŝiĝas en la profundoj, gardante la ĉiopovan Amuleton de Yendor. Eĉ nun malhela energio radias de sube, suprenirante en la urbon.\n\nĈu vi konkeros la kelkarceron kaj postulos la amuleton? Estas tempo komenci vian propran aventuron!
journal.document.intros.dungeon.title=Kelkarcero
journal.document.intros.halls.body=Ĉi tiuj profundaj haloj de la Nana Metropolo estis torditaj de malhela magio. En la pasinteco, ĉi tiuj regionoj gastigis la kortegon de la Nana Reĝo, konsistanta el elitaj sorĉistoj, sed nun ŝajnas, ke ili estas transprenitaj de io eĉ pli malbonaŭgura... \n\n Ĉiuspecaj teruraj demonaj estaĵoj loĝas en ĉi tiuj haloj, gvidataj de iu terura malhela potenco. Se la Reĝo de la Nanoj ne estis la fonto de la disvastiĝanta korupto, kio ajn estas ĉi tie devas esti. \n\n Legu singarde, tre malmultaj aventuristoj iam ajn malsupreniris tiel malproksimen...
journal.document.intros.halls.discover_hint=Vi povas trovi ĉi tiun tekston en specifa regiono, sed nur post trovo de ĉiuj antaŭaj tekstoj en ĉi tiu aro.
journal.document.intros.halls.title=Demonaj Haloj
journal.document.intros.prison.body=Antaŭ multaj jaroj malliberejo estis konstruita ĉi tie por loĝigi danĝerajn krimulojn. Strikte reguligita kaj sekura, kondamnitoj el la tuta lando estis alportitaj ĉi tien por servi tempon.\n\nSed baldaŭ malhela miasmo komencis ŝteliri de sube, tordante la mensojn de gardisto kaj malliberulo egale.\n\nReage al la kreskanta kaoso, la urbo sigelis la tutan malliberejon. Neniu scias kio fariĝis el tiuj, kiujn oni lasis por morti ene de ĉi tiuj muroj...
journal.document.intros.prison.title=Malliberejo
journal.document.intros.sewers.body=La supraj etaĝoj de la kelkarcero fakte konsistigas la kloakaron de la urbo. \n\nDum malhela energio rampis supren de sube, la kutime sendanĝeraj kloakaj estaĵoj fariĝis pli kaj pli sovaĝaj. La urbo devis sendi gardpatrolojn ĉi tien por provi konservi sekurecon por tiuj supre. \n\nĈi tiu loko estas danĝera, sed almenaŭ la malbona magio aganta ĉi tie estas malforta.
journal.document.intros.sewers.title=Kloakoj
journal.document.intros.title=Regionaj Enkondukoj
journal.document.prison_warden.discover_hint=Vi povas trovi ĉi tiun tekston en specifa regiono, sed nur post trovo de ĉiuj antaŭaj tekstoj en ĉi tiu aro.
journal.document.prison_warden.journal.body=1a de Printempo, 362\n\nJen la unua eniro en la labortaglibro de prizona gardistino Kiana Smith. Kun ĉio, kio okazis lastatempe, mi decidis komenci taglibron por ordigi miajn pensojn.\n\nAdministri malliberejon duonmejlon subtere neniam estus facila, sed lastatempe ŝajnas, ke ia organizita interrompo okazas. Malliberuloj agis senkaŭze kaj poste rifuzas klarigi kial.\n\nKelkaj gardistoj komencas diri, ke la loko estas hantita. Mi ne povas lasi miajn proprajn homojn disvastigi onidirojn, sed mi ne povas precize kulpigi ilin pro tio, ke ili estas maltrankvilaj.\n- Smith
journal.document.prison_warden.journal.title=Tenado de Taglibro
journal.document.prison_warden.letter.body=Tomaso, \n\nVi estis bonega amiko, do mi faras al vi favoron.\n\nKiam vi komencos vian deĵoron ĉi-vespere, ŝlosu kaj plifortigu la ĉelon de Tengu, ĵetu la ŝlosilon en iun niĉon, kaj eliru. Ne gravas ĉu la aliaj malliberuloj estas senatendaj, baldaŭ neniu povos forlasi ĉi tiun lokon. Tiu strangulo devas resti sekura tamen, se li eskapos, oni ne scias kion li faros.\n\nDiru al neniu pri tio, kaj ne ĝenu vin serĉi min. Kapitano devas perdiĝi kun sia ŝipo.\n- Kiana
journal.document.prison_warden.letter.title=Letero al Tomaso
journal.document.prison_warden.mines.body=54-a de Vintro, 363\n\nGrupo de inĝenieroj el la urbo venis hodiaŭ, dirante, ke ili estas ĉi tie por sigeli la malnovan enirejon al la minejoj sube. Mi supozas, ke la urbo ne plu volas zorgi pri la bontenado de la pasejo. Mi ne estis informita anticipe, kiel kutime.\n\nIlia ĉefa inĝeniero ankaŭ rakontis al mi iujn sensencaĵojn pri nana magio likanta el la minejoj. Mi ne kredas eĉ unu vorton el ĝi.\n\nLa situacio estas sub multe pli bona kontrolo kun nia nova stabo, sed la radiko de la problemo ankoraŭ ne estas traktita. Io certe influas la malliberulojn ĉi tie, kaj malkonstrui kelkajn murojn ne ŝanĝos tion.\n- Smith
journal.document.prison_warden.mines.title=Sigelante la Minejojn
journal.document.prison_warden.no_support.body=11-a de Printempo, 364\n\nKion diable pensas la urbo? Post urĝa petado de helpo, mi aŭdis nenion, eĉ ne malplenan pardonpeton, kiajn ili kutime sendas kiam miaj petoj estas rifuzitaj.\n\nDume la malliberuloj daŭre plimalboniĝas, kaj kelkaj gardistoj eĉ komencis kaŭzi problemojn. Ĉu ili planas simple lasi ĉi tion daŭre plimalboniĝi ĝis ni traktos tumulton!?\n\nTomaso restis fidinda kiel ĉiam, almenaŭ. Lia organiza helpo estis valorega, kaj lia ideo aktivigi tiujn malnovajn DM-100-unuojn estis bedaŭrinda sed necesa. Mi estas certa, ke mi povas reveni al ĉi tiu situacio, mi nur bezonas iom da diabla subteno!\n-Smith
journal.document.prison_warden.no_support.title=Neniu Subteno
journal.document.prison_warden.recruits.body=80-a de Printempo, 362\n\nKiel promesite, hodiaŭ alvenis amaso da novaj rekrutoj. Ŝajnas kiel kutime, kelkaj promesplenaj kaj multaj stululoj, kiuj nur volas la salajron. Tamen, havi ĉi tiun novan forton devus multe helpi kun niaj lastatempaj neregeblaj malliberuloj.\n\nEn tia laboro gravas scii, kiun oni povas fidi. Unu nova dungito, Tomaso, ŝajnas aparte promesplena. Mi bezonas ĉian helpon, kiun mi povas ricevi nun, do se li bone fartas, mi rapide serĉos lian promocion.\n- Smith
journal.document.prison_warden.recruits.title=Novaj Rekrutoj
journal.document.prison_warden.rotberry.body=23-a de Aŭtuno, 363\n\nRicevis belan donacon de Felikso hodiaŭ. Ĝi estas ia brile ruĝa arbedo nomata 'Putrobero'.\n\nMi jam menciis kiom malgaja ĉi tiu loko estas por li antaŭe, ŝajnas ke li aŭskultis. Laŭ li ĉi tiu planto fakte malŝatas lumon kaj akvon, do mi nur devas tondi la foliojn unufoje monate aŭ tiel. Tondado devas esti grava tamen, li menciis ĝin dekdu fojojn en sia letero.\n\nKompreneble, Felikso neniam faras ion senpage. Li diras, ke la semoj, kiujn ĉi tiu afero produktas, estas bonegaj por fari sorĉbastonojn, do kompreneble mi ŝuldas al li kelkajn ĉiufoje kiam la planto produktas iujn.\n- Smith
journal.document.prison_warden.rotberry.title=Rotbero-Planto
journal.document.prison_warden.title=La ĵurnalo de la gardisto
journal.document.sewers_guard.crabs.body=11-a de Vintro, 376\nKaraj Panjo kaj Paĉjo,\n\nKvazaŭ la ratoj ne estus sufiĉe malbonaj, pli profunde estas gigantaj kraboj! Unu el ili impetis tuj preter mi kaj vundis Lee sufiĉe grave antaŭ ol ni mortigis ĝin. Tomaso diras, ke ne estas mia kulpo, sed mi scias, ke li nur provas esti afabla al mi.\n\nFeliĉe, survoje ni renkontis aventuriston, kiu havis iom da rezerva sunherba ŝmiraĵo. Lee eble ne travivus sen tiu afero.\n\nMi vidis la aventuriston rigardi rozon antaŭ ol ili foriris, ili diris, ke ĝi estas donaco. Kial ili riskus sian vivon ĉi tie se iu zorgas pri ili tiom multe?\n\nĜuste tion mi faras, ĉu ne? Mi sentas min kvazaŭ mi tro multe vundus min.
journal.document.sewers_guard.crabs.title=Gigantaj Kraboj!
journal.document.sewers_guard.dangerous.body=88-a de Aŭtuno, 375\nKara Panjo kaj Paĉjo,\n\nMi komprenas kial la salajro estas tiel bona nun, la kloakoj estas infestitaj de monstroj! La "fibestoj" kaj "eksterleĝuloj" estas gigantaj sangavidaj ratoj kaj aroj da koleraj gnoluloj.\n\nFeliĉe la resto de mia teamo vere scias, kion ili faras. Nia teamkapitano, Tomaso, estas spertulo pri tio. Mi provas lerni rapide por ne esti tro ŝarĝo.\n\nĈi tiu laboro estas multe pli danĝera ol mi pensis. Mi ĝojas, ke mi ne povas sendi ĉi tiujn nun, mi ne volas, ke vi maltrankviliĝu.\n\nMi restos sekura,\n- Sonya
journal.document.sewers_guard.dangerous.title=Danĝera Pozicio...
journal.document.sewers_guard.discover_hint=Vi povas trovi ĉi tiun tekston en specifa regiono, sed nur post trovo de ĉiuj antaŭaj tekstoj en ĉi tiu aro.
journal.document.sewers_guard.guild.body=23-a de Vintro, 376\nKara Panjo kaj Paĉjo,\n\nNeniuj novaj monstroj ĉi-foje, anstataŭe ni renkontis malgrandan grupon el la ŝtelista gildo dum patrolado.\n\nĈio, kion mi aŭdis pri la gildo, estas malbona, sed la resto de mia teamo ŝajnis preskaŭ amika kun ili. Tomaso interŝanĝis informojn kaj provizojn kun unu el ili antaŭ ol ni iris niajn apartajn vojojn.\n\nMi ne komprenas, ĉu ni ne supozeble senigu nin de eksterleĝuloj? Tomaso eĉ diris ne mencii tion al iu ajn komandanto. Iliaj informoj kaj provizoj tamen estis tre utilaj, kaj ni ne povis elteni eĉ pli da batalado.\n\nMi supozas, ke ni ĉiuj estas en ĉi tio kune ĉi tie.
journal.document.sewers_guard.guild.title=La gildo de la ŝtelistoj
journal.document.sewers_guard.lost.body=40-a de Vintro, 376\n\nTomaso kaj mi estas perditaj. Ni estis forpelitaj de la resto de la teamo dum ni batalis kontraŭ kelkaj gnoluloj. Nek unu el ni estas vundita, sed la pli malaltaj kloakoj estas kiel labirinto.\n\nTomaso diras, ke li konas eliron, sed ĝi komenciĝas ĉe la malnova prizona enirejo ĉe la fundo de la kloakoj. Mi vere ne ŝatas iri pli profunden, sed ni ne havas porciojn kaj iri malsupren estas multe pli rapide ol vagadi ĉirkaŭe serĉante nian patrolvojon.\n\nĈio estos bone. Tomaso scias, kion li faras.
journal.document.sewers_guard.lost.title=Ni estas Perditaj
journal.document.sewers_guard.new_position.body=85-a de Aŭtuno, 375\nKara Panjo kaj Paĉjo,\n\nMi diris al vi, ke la tuta malfacila laboro ĉe la urba gvardio rekompencos. Mi ĵus estis promociita!\n\nMi estis invitita aliĝi al specialista teamo, kiu laboras en la kloakoj. Ŝajne estas problemoj kun fibestoj kaj eksterleĝuloj tie, kaj estas nia tasko forigi ilin. Ĝi estas malorda laboro, sed la kloakoj estas varmaj vintre kaj ĝi pagas trioble pli ol regula gvardio!\n\nTamen ĉio estas iom sekreta, do mi ne povas sendi ĉi tiun leteron. Ŝajnas strange ne skribi al vi, do mi daŭre skribos ilin ĉiuokaze. Eble mi povos montri ilin al vi iam.\n\nPlej bonajn,\n- Sonya
journal.document.sewers_guard.new_position.title=Mia Nova Posteno!
journal.document.sewers_guard.not_worth.body=Tomaso kaj mi renkontis ian grandegan ŝlimomonstron ĉe la prizonenirejo. Antaŭ ol ni povis reagi, ĝi eksplodigis nin per magio. Tomaso prenis la plejparton de ĝi. Li foriris. \n\nNeniu monsumo valoras ĉi tion. Mi foriros laŭ la vojo, pri kiu Tomaso rakontis al mi. Poste mi prenos tion, kion mi gajnis kiel gardisto, kaj uzos ĝin por translokigi miajn gepatrojn kaj min for de ĉi tiu malbenita urbo. Parto de mi volas esperi, ke la Reĝo havas planon por ĉio ĉi, sed mi dubas ĝin. \n\nMi lasas ĉi tiujn leterojn kiel averton al aliaj. Ĝi estas pli ol nur gigantaj ratoj kaj kraboj, io estas tre malĝusta ĉi tie.
journal.document.sewers_guard.not_worth.title=Ĝi Ne Valoras Ĝin
journal.document.sewers_guard.title=Leteroj de la gardisto
