journal.document.adventurers_guide.alchemy.body=Om du inte tycker att ett förbrukningsföremål är användbart kan du använda det som en alkemiingrediens eller förvandla det till allsidig alkemisk energi. Energigivande trolldrycker och skriftrullar identifierar dem också!\n\nPrydnadssaker är en unik typ av utrustning som skapas och uppgraderas med hjälp av alkemi. De är gjorda med en magisk prydnadskatalysator och lite alkemisk energi.\n\n(Den första alkemikrukan finns på 3:e eller 4:e våningen i fängelsehålan. Det finns också sidor från alkemi-receptböcker nära dessa krukor.)
journal.document.adventurers_guide.alchemy.title=Alkemi och prydnadssaker
journal.document.adventurers_guide.dieing.body=Dungeon-eering är farligt och de flesta äventyrare möter så småningom sin undergång.\n\nTur hjälper, men de bästa äventyrarna använder varje litet knep för att förbättra sina chanser.\n\n(Bli inte upprörd om du dör mycket, det här spelet är svårt! Fokusera på att lära dig spelet och stadigt förbättra dig, inte på att vinna direkt.)
journal.document.adventurers_guide.dieing.title=Hantering av nederlag
journal.document.adventurers_guide.examining.body=Det är viktigt att studera dina fiender och din omgivning istället för att rusa in i blindo! Ta för vana att undersöka allt nytt. \n\n (Du kan undersöka genom att använda förstoringsglaset och sedan välja vad du vill undersöka. Du kan också undersöka buffs eller debuffs genom att välja deras ikoner.)
journal.document.adventurers_guide.examining.title=Granskning
journal.document.adventurers_guide.food.body=Att ransonera effektivt är ett av de bästa sätten att förbättra dina chanser att överleva. Du behöver inte alltid äta rätt när du blir hungrig! \n\n När du inte svälter kommer du långsamt att regenerera hälsan, så om du äter med full hälsa kommer den regenereringen att vara bortkastad! \n\n Om du minskar din ätartakt baserat på din hälsa kommer din mat att räcka mycket längre.
journal.document.adventurers_guide.food.title=Att hantera hunger
journal.document.adventurers_guide.identifying.body=Färgerna på trolldrycker och symboler på rullar är olika i varje grottor. Oidentifierad utrustning kan uppgraderas eller förtrollas om du har tur, eller så kan den vara förbannad!\n\nRullar för att identifiera, uppgradera eller ta bort förbannelser är mycket användbara om du vill minska risken för att använda oidentifierad utrustning.\n\n(Du hittar en lista över alla föremål du har identifierat i katalogfliken i din dagbok)
journal.document.adventurers_guide.identifying.title=Identifiera föremål
journal.document.adventurers_guide.intro.body=Hälsningar Äventyrare, du läser nu Dungeon Mastery Tome! Den här guideboken används bäst som referens och kommer magiskt att låta dig veta när det är bäst att läsa varje sida. \n\n(När journalknappen blinkar, välj den för att läsa vad guideboken har att berätta! Vissa sidor saknas dock, kanske du kan hitta dem i dungeonen?)
journal.document.adventurers_guide.intro.title=Introduktion
journal.document.adventurers_guide.levelling.body=Att gå upp i nivå ökar din statistik och ger talangpoäng, vilket kan göra stor skillnad i strid. Det är bäst att ha minst en nivå för varje våning i fängelsehålan.\n\nDet kan vara frestande att rusa och undvika utforskning eller strid, men att göra det kommer att beröva dig förnödenheter och erfarenhet.\n\n(Du kan se information om din hjälte, inklusive erfarenhet, i statusfönstret i hörnet av spelgränssnittet. Välj ditt hjälteporträtt för att få ännu mer information.)
journal.document.adventurers_guide.levelling.title=Att få erfarenhet
journal.document.adventurers_guide.looting.body=Rum som ligger bakom låsta dörrar eller som innehåller hinder har oftast bättre byte. När ett hinder blockerar din väg kan du oftast hitta ett föremål som kan hjälpa dig på samma våning.\n\nDu kommer alltid att kunna hitta 2 styrkedrycker och 3 uppgraderingsrullar i varje femvånings fängelsehålsregion, så de är en bra indikator på hur väl du utforskar.\n\n(Du kan se en lista över landmärken och oanvända nycklar i anteckningsfliken i journalfönstret.)
journal.document.adventurers_guide.looting.title=Effektiv plundring
journal.document.adventurers_guide.magic.body=Magiska attacker skär rakt igenom rustningar och är svåra att undvika. Det betyder att skador från trollstavar är mycket tillförlitliga, men gör också magiska fiender mycket farliga!\n\nMagiska attacker har dock alltid en nackdel. Trollstavar har begränsade laddningar och magiska fiender kommer vanligtvis inte att kunna använda sin magi på nära håll.\n\nNär man möter fiender som använder magi är det viktigt att lära sig hur man hindrar dem från att använda den mot dig.
journal.document.adventurers_guide.magic.title=Magiska attacker
journal.document.adventurers_guide.positioning.body=Strategi är lika viktigt som utrustning. Dåliga situationer som att bli omringad kan vanligtvis undvikas med bra positionering.\n\nTill exempel har de flesta fängelsehålor tunna korridorer som tvingar fiender att slåss mot dig en i taget. Dessa korridorer har ofta också dörröppningar för överraskningsattacker!\n\nDet finns många små sätt att använda miljöfunktioner som gräs, vatten, gropar eller fällor till din fördel också.
journal.document.adventurers_guide.positioning.title=Positionering
journal.document.adventurers_guide.searching.body=Fängelsehålor är fulla av hemliga dörrar och fällor som verkar osynliga vid första anblicken. Du kan spendera lite tid och noggrant söka om du misstänker att en dörr eller fälla är gömd i närheten. \n\n (Du kan söka i alla rutor runt omkring dig genom att använda förstoringsglaset två gånger. Kanske finns det några gömda dörrar nära där du hittade den här sidan!)
journal.document.adventurers_guide.searching.title=Sökande
journal.document.adventurers_guide.strength.body=Det finns inte tid att träna med vapen och rustningar som du hittar i fängelsehålan, så du behöver råstyrka för att använda dem effektivt.\n\nStyrkedrycker och uppgraderingsrullar är det mest effektiva sättet att uppfylla styrkekraven för utrustning på högre nivå.\n\nDet är viktigt att så småningom börja använda föremål på högre nivå, men ignorera inte utrustning du kan använda just nu.
journal.document.adventurers_guide.strength.title=Styrka
journal.document.adventurers_guide.surprise_attacks.body=Överraskningsattacker garanteras att träffa, vilket gör dem särskilt användbara mot undvikande fiender som ormar och vålnader. \n\nDu kan överraska fiender direkt efter att de gått in i en dörröppning medan de jagar dig, eller när de på annat sätt tappar dig ur sikte.
journal.document.adventurers_guide.surprise_attacks.title=Överraskningsattacker
journal.document.adventurers_guide.title=en sträng av dungeon-mästerskap
journal.document.adventurers_guide.upgrades.body=Ju djupare du går in i en fängelsehåla, desto viktigare är det att du använder magiskt uppgraderad utrustning av hög nivå, men du behöver också styrkan för att använda dem ordentligt.\n\nTrollstavar, ringar och artefakter behöver inte styrka, men har begränsad användning eller hjälper inte lika direkt i strid.\n\nAtt göra bra val om vad du uppgraderar är mycket viktigt för att överleva tidigt i fängelsehålan och för att förbereda dig för framgång senare i fängelsehålan.
journal.document.adventurers_guide.upgrades.title=Uppgraderingar
journal.document.alchemy_guide.bombs.body=En vanlig svartkrutsbomb kan blandas med ett specifikt föremål för att skapa en förbättrad bomb.
journal.document.alchemy_guide.bombs.title=Förbättrade bomber
journal.document.alchemy_guide.brews_elixirs.body=Brygder och elixir är avancerade trolldrycker med en mängd olika effekter, vanligtvis med en engångsanvändning.
journal.document.alchemy_guide.brews_elixirs.title=brygder och elixir
journal.document.alchemy_guide.energy_food.body=Många recept kräver kristallalkemisk energi, som skapas genom att dekonstruera förbrukningsartiklar i en alkemikruka. Energigivande trolldrycker eller skriftrullar identifierar dem också. \n\nVissa recept som kräver energi är magiska, men dessa liknar traditionell matlagning.
journal.document.alchemy_guide.energy_food.title=Energi och mat
journal.document.alchemy_guide.exotic_potions.body=Trolldrycker kan blandas med energi för att skapa exotiska trolldrycker. De har kraftfullare effekter, men är ofta användbara på olika sätt.
journal.document.alchemy_guide.exotic_potions.title=exotiska trolldrycker
journal.document.alchemy_guide.exotic_scrolls.body=Exotiska skriftrullar kan tillverkas med lite energi och en skriftrulle. De är lite starkare och dyrare än exotiska trolldrycker.
journal.document.alchemy_guide.exotic_scrolls.title=exotiska rullar
journal.document.alchemy_guide.potions.body=Välkommen till Praktiska tillämpningar av alkemi! Den här boken är en referens med recept för att tillverka föremål i en alkemikruka. \n\nVi börjar med det mest ikoniska receptet: Trolldrycker! \n\nAnvänd tre frön för att brygga en slumpmässig trolldryck! Varje frö har en motsvarighet till en trolldryck, använd flera av samma frö för att öka chansen att trolldrycken relaterar till de fröna du använde.
journal.document.alchemy_guide.potions.title=Introduktion och trolldrycker
journal.document.alchemy_guide.spells.body=Trollformler finns i kristaller och ger en mängd olika effekter, vanligtvis med flera användningsområden.
journal.document.alchemy_guide.spells.title=trollformler
journal.document.alchemy_guide.stones.body=Att blanda en skriftrulle i en alkemikruka kommer att ingjuta dess magi i två stenar inuti krukan. Detta skapar runstenar och identifierar skriftrullen!
journal.document.alchemy_guide.stones.title=Skapa runstenar
journal.document.alchemy_guide.title=Alkemiguide
journal.document.alchemy_guide.weapons.body=Några av de lättare eller mer magiska vapnen kan användas i alkemi!\n\nVarje kastad vapenuppsättning producerar tillräckligt med flytande metall för att helt reparera en annan uppsättning på samma nivå och nivå. Observera att alkemisering av en uppsättning kommer att förstöra hela uppsättningen, även om inte allt finns närvarande!\n\nEn trollstav producerar tillräckligt med arkan harts för att uppgradera två trollstavar på samma nivå, men inte högre än +3.
journal.document.alchemy_guide.weapons.title=Förbättra vapen
journal.document.caves_explorer.alive.body=23:e sommaren 308\n\nEn av dvärgmaskinerna vaknade till liv på något sätt! Vi gick bara förbi när den anföll och nästan krossade två av vår grupp med sina enorma metallnävar. Som tur var bar jag min sönderfallstav med mig. Några välriktade skott från den och den odjurslika saken reducerades till skrotmetall.\n\nDet som oroar mig är att vi inte gjorde någonting alls för att provocera maskinen. Dvärgarna kan omöjligt ha designat maskinerna för att vara så aggressiva, det är som om den försökte lägga ett bakhåll mot oss!\n\nÅtminstone kunde jag erbjuda lite hjälp till mina följeslagare för en gångs skull.\n- Archibald
journal.document.caves_explorer.alive.title=Det lever!
journal.document.caves_explorer.city.body=21:a sommaren, 308\n\nVi är nu vid treveckorsstrecket, och efter att ha tillbringat större delen av de senaste tio dagarna med att kartlägga allt djupare, har vi äntligen nått botten av gruvorna. Vi hittade diverse metallanordningar och en stor port som blockerar inträdet till den gamla dvärgmetropolen.\n\nSmeden varnade oss för en del av detta maskineri. Det var tydligen avsett för områdesförsvar och har en tendens att aktiveras när det störs. Vi har inget att göra i staden, och metallen skulle ha minimalt skrotvärde, så vi tyckte det var bäst att lyssna på hans varning och bege oss ut igen.\n\nJag måste erkänna att jag var nyfiken, men att undersöka där nere var verkligen inte värt risken.\n- Archibald
journal.document.caves_explorer.city.title=Stadsentrén
journal.document.caves_explorer.discover_hint=Du kan hitta den här texten i en specifik region, men bara efter att du har hittat alla tidigare texter i den här uppsättningen.
journal.document.caves_explorer.expedition.body=1 sommar, 308\n\nIdag börjar vår fyra veckor långa expedition till de övergivna dvärggruvorna! Jag har fått i uppdrag av kungen själv att utforska regionen. Mina huvudmål är att hitta outnyttjade naturresurser och att undersöka grottorna för ett potentiellt fängelsebyggprojekt.\n\nMedan jag är kapabel att försvara mig har jag accepterat en eskort från stadsvakten på kungens insisterande. De är ett gäng enkla personer, men så länge de inte saktar ner mig är deras närvaro tolererbar.\n\nVi förväntas rensa avloppen och nå gruvorna på kvällen.\n- Archibald Drummond. Ärkemagiker, sydstatsinstitutet för trollkarl.
journal.document.caves_explorer.expedition.title=Expeditionsstart!
journal.document.caves_explorer.gold.body=4:e sommaren, 308\n\nVåra första dagar har verkligen varit mycket givande! Efter att ha etablerat ett basläger gav vi oss ut att utforska några av de övre delarna av den övergivna gruvan. Även om det finns gott om värdelös skräp som dvärgarna lämnat kvar, vimlar även många av grottväggarna av guld!\n\nTyvärr är vi inte de första här. Grottorna är fulla av aggressivt djurliv, och det verkar som att flockar av gnollar också är intresserade av guldet. Jag erkänner att jag var orättvis mot min vakteskort, de har varit mycket mer skickliga upptäcktsresande och livvakter än jag förväntade mig.\n\nÄven med denna framgång har vi fortfarande mycket av gruvorna kvar att utforska.\n- Archibald
journal.document.caves_explorer.gold.title=Så mycket guld!
journal.document.caves_explorer.report.body=28:e sommaren 308\n\nIdag ska vi packa ihop våra tillhörigheter och förbereda oss för avfärd. Precis i tid har flera i vår grupp börjat få hemska mardrömmar efter händelsen med den aggressiva maskinen. Det är förmodligen bara trötthet, men deras mardrömmar är alla oroande lika.\n\nSammanfattningsvis är de övre delarna av gruvan ganska säkra. Om det skulle kunna hittas en användning för mörkt guld kan det vara ganska lukrativt att bryta det. De stora öppna ytorna skulle också fungera mycket bra för stadens byggplaner. De lägre gruvorna är dock farligare och bör undvikas.\n\nJag kommer att skriva allt detta i min slutrapport under de närmaste dagarna.\n- Archibald
journal.document.caves_explorer.report.title=Slutrapport
journal.document.caves_explorer.title=Utforskarens logg
journal.document.caves_explorer.troll.body=11:e sommaren 308\n\nEfter att ha börjat vår utforskning av gruvornas mittsektion stötte vi på ett vänligt ansikte! Tja... relativt vänligt. Ett grotttroll har slagit upp en liten smedja där. Han är butter och inte särskilt pratsam, men reparerade vår utrustning i utbyte mot lite guld.\n\nTyvärr har trollsmeden också informerat oss om att allt detta vackra guld inte är riktigt så bra som det verkar. Han kallar det "mörkt guld" och det bryts tydligen ner snabbt i solljus. Det skulle säkerligen förklara varför det aldrig fanns några konflikter om resurserna här.\n\nJag antar att vi behöver gräva lite djupare för att se om det finns något mer värdefullt.\n- Archibald
journal.document.caves_explorer.troll.title=Träffade ett troll
journal.document.city_warlock.discover_hint=Du kan hitta den här texten i en specifik region, men bara efter att du har hittat alla tidigare texter i den här uppsättningen.
journal.document.city_warlock.failure.body=Det verkar som att jag också är en dåre. Jag antog att den nye kungen behövde att hovet villigt underkastade sig honom, men nu ser jag att han har makten att kontrollera även de som motsätter sig honom. \n\n Jag förde blint all den starkaste oppositionen rakt till sin tröskel så att han personligen kunde förvandla dem till sina slavar. Nu sköljer vågor av hans nekrotiska energi genom staden och förvandlar omedelbart de flesta till hans supplikanter. \n\n De få som fortfarande har fri vilja flyr. Jag har valt att stanna kvar för att observera så gott jag kan och leta efter en öppning. Med den magiska kraft jag har borde jag kunna hålla mig gömd och säker ett tag.
journal.document.city_warlock.failure.title=Fel
journal.document.city_warlock.more_powerful.body=Att hålla koll på tiden har blivit svårt, men det har gått ungefär en vecka sedan mitt senaste inlägg. Vår civilisation har verkligen kollapsat. Portarna är stängda, alla funktioner i vårt samhälle har upphört, och tomma dvärgskal strövar omkring i salarna.\n\nGenom allt detta blir den Nye Kungen på något sätt ännu mäktigare. Varje dag blir hans viljestyrka starkare, men den förändras också. Jag kan inte beskriva det, men det känns som om han inte längre är en dvärg alls.\n\nJag börjar acceptera att det bästa jag förmodligen kan hoppas på att göra är att dokumentera dessa händelser. Jag kommer att stanna här så länge jag kan, och sedan dra mig tillbaka när min vilja börjar försvagas.
journal.document.city_warlock.more_powerful.title=Kraftfullare
journal.document.city_warlock.new_power.body=Vad händer här? Kraften som utgår från den Nye Kungen är visserligen annorlunda än från början, men det finns något annat också. Denna nya kraft verkar stråla ut från vår stads innersta salar.\n\nÄnnu mer förbryllande är att aktiviteten i den övre metropolen också har minskat. Jag vet inte vad som händer där nere, men det drar till sig nästan all den Nye Kungens uppmärksamhet.\n\nAtt återvända till de djupa salarna kommer att vara farligt, men jag måste upptäcka vad som orsakar denna förändring. Kanske har den Nye Kungen en svaghet trots allt?
journal.document.city_warlock.new_power.title=En ny kraft
journal.document.city_warlock.old_king.body=Det är den femte dagen i den andra månaden av det 33:e året av magins tidsålder. Om en övervärldsbeboare läser detta, är det någon gång under vintern 264. Mitt namn är Thymor Zahir, och så vitt jag vet är jag den sista överlevande medlemmen av dvärgarnas hov. \n\nVår kung är död, ersatt av en av mina tidigare kollegor som har blivit maktgalen. Resten av hovet underkastade sig honom, som de dårar de är, och förlorade sin fria vilja i processen. Jag var den enda som såg detta komma och flydde innan hans ritual kunde slutföras. \n\nDen inre kretsen har fallit, men den Nye Kungens makt har ännu inte nått alla. Jag måste göra motstånd så snabbt som möjligt. Jag vägrar att låta vår ärorika civilisation falla för denna megaloman!
journal.document.city_warlock.old_king.title=Kungen är död
journal.document.city_warlock.resistance.body=Ryktet verkar ha spridit sig snabbt. Det har bara gått några dagar och jag har redan samlat ihop en liten armé av lojalister till den Gamle Kungen. Få är skickliga i magi, men nästan hela orden av krigarmunkar finns bland oss. Vi borde vara mer än en match mot en galen dvärg och hans hov av slavpar. \n\n Under tiden har den Nye Kungen gömt sig i vår stads inre kammare. Han har utan tvekan förbrukat det mesta av sin makt och hoppas kunna återhämta sig innan han möter mer motstånd. \n\n Vi kommer att inleda vår attack om ett par timmar. Med lite tur kommer vi att kunna bilda ett interimsråd och återställa vår underbara stad till stabilitet i slutet av natten.
journal.document.city_warlock.resistance.title=Ett motstånd
journal.document.city_warlock.seen_it.body=Jag har sett vad som ligger nedanför, men jag kan inte beskriva det. Mina händer skakar okontrollerat när jag försöker skriva ner mina tankar.\n\nVarför händer detta? Gjorde den nye kungen detta? Det är meningslöst. Kanske hans meningslösa maktanvändning lockade det? Jag hade hoppats kunna rädda vår civilisation, men nu ser jag att hela världen står på spel.\n\nPå något sätt är kungen det minst onda. Jag har inget annat val, för det större goda kommer jag att ge mig själv. Snälla, vägled mig, min kung, använd mig som ett instrument för att hålla Yog-Dzewa borta!
journal.document.city_warlock.seen_it.title=Jag har sett det
journal.document.city_warlock.title=Trollkarlens dagbok
journal.document.halls_king.amulet.body=JAG HAR GJORT DET!\n\nJag visste inte exakt vad jag skulle kunna hitta, men det jag upptäckte där ute var bortom mina vildaste spekulationer. Så mycket makt, som bara ligger där, redo att tas, och den är helt min!\n\nMed detta kommer ingen av dårarna i hovet att våga motsätta sig mig. Jag blir bara yr av att tänka på alla olika sätt jag kan förödmjuka dem. Herregud, varför stanna där, jag har tillräckligt med makt för att förgöra varenda en av dem om jag vill! Det kanske är överdrivet, men jag får inte dröja för länge med att bestämma mig, annars blir de misstänksamma.\n\nJag tror att jag kallar denna stora makt Yendors amulett!\n- R.
journal.document.halls_king.amulet.title=Amuletten
journal.document.halls_king.attrition.body=Jag har en plan för att hantera saken. Dess kraft är oändlig, men dess förmåga att inkräkta på den här världen är det inte. Den förlitar sig på undersåtar och avatarer för att göra den kan medan den försöker bygga upp tillräckligt med kraft för att ta amuletten.\n\nÄven om jag inte äger amuletten fysiskt har jag fortfarande full kontroll över dess kraft. Med hela dvärgstaden till mitt förfogande har jag också en numerär fördel. Jag kan helt enkelt fortsätta skicka soldater för att förhindra att den beslagtar amuletten och stadigt vinna detta krig genom utmattning!\n\nI, RODNEY, DVÄRGARNAS KUNG, KOMMER ATT ÖVERLEVA DIG YOG-DZEWA!
journal.document.halls_king.attrition.title=Nötning
journal.document.halls_king.discover_hint=Du kan hitta den här texten i en specifik region, men bara efter att du har hittat alla tidigare texter i den här uppsättningen.
journal.document.halls_king.new_king.body=JAG ÄR KUNG, AHAHAHAHAAA!\n\nDe lät mig bara göra det! Knappt med någon övertygelse gick de med på att låta mig "dela" denna makt med dem i en stor ritual. På ett ögonblick förvandlades de från en kör av hånfulla röster till mitt nya hov av tysta undersåtar!\n\nFörutsägbart flydde Thymor som en fegis vid första tecken på problem. Jag kan redan känna motståndskraften han bygger upp också. Jag tror att jag ska låta honom fortsätta, så att han kan leverera alla sina konspiratörer direkt till min dörr!\n\nDet är uppenbart att kungariket inte respekterar mig heller, jag antar att jag ska fixa det också.\n - Dvärgarnas kung
journal.document.halls_king.new_king.title=En ny kung
journal.document.halls_king.rejection.body=IMBECILE!\n\nUnder de senaste 33 åren har vårt kungarike blomstrat med vår nya magiska teknologi. Vi har lärt oss att kalla fram elementära andar och böja dem efter vår vilja, men på något sätt är ytterligare experiment nu "för farliga".\n\nJag vet vad som verkligen händer. Förkastandet av mina teorier har ingenting att göra med deras förtjänster och allt att göra med personen som föreslår dem. De skrattar förmodligen alla åt mig bakom min rygg.\n\nNå, sluta med det! Jag bryr mig inte om vad de säger, jag kommer att utforska de yttersta delarna av vårt universum ensam och behålla allt jag upptäcker för mig själv!\n- R.
journal.document.halls_king.rejection.title=Avslag
journal.document.halls_king.ritual.body=Thymor konfronterade mig offentligt tidigare idag och insisterade på att jag skulle förklara min nya maktkälla. Jag avfärdade honom så gott jag kunde, men jag kan känna resten av hovets dömande blick på mig återigen.\n\nJag hade hoppats kunna spendera lite mer tid med att njuta av lugnet före stormen, men det spelar egentligen ingen roll. Jag har bestämt mig för vad jag vill göra. Jag kommer att påstå att jag fick min makt genom en ny ritual och kommer att erbjuda mig att utföra den på de andra trollkarlarna och kungen. När ritualen är över kommer jag att vara kung!\n\nThymor kommer naturligtvis att protestera, men med så mycket makt som erbjuds tvivlar jag på att de kommer att lyssna på honom!\n\nALLA KOMMER ATT BÖJA SIG FÖR MIG!\n - Dvärgarnas framtida kung
journal.document.halls_king.ritual.title=Ritualen
journal.document.halls_king.thing.body=Det finns ett problem. Thymor avfärdades utan ansträngning, men det verkar som att mitt letande i de yttre planen inte gick obemärkt förbi.\n\nNågon... 'sak'... har attraherats av min värld och börjar tvinga sig igenom längst ner i de nedre hallarna. För att komplicera saker och ting ytterligare är det exakt där jag förvarade amuletten! En sådan hämndlysten varelse, varför måste den försöka neka mig min kraft när det fortfarande finns mycket där ute att ta?\n\nTrots min kraft tror jag dock inte att jag bara kan storma in och bekämpa den. Dess sanna kraft är ofattbar, men det måste finnas något sätt att begränsa den. JAG KOMMER ATT FÖRSVARA MITT PRIS!
journal.document.halls_king.thing.title=Saken
journal.document.halls_king.title=???s journal
journal.document.intros.caves.body=Dessa glest befolkade grottor sträcker sig ner under det övergivna fängelset. Rika på mineraler var de en gång ett centrum för livlig handel och industri för dvärgsamhället nedanför, men de övergavs när dvärgarna blev besatta av mörk magi. \n\n Grottorna är nu mestadels bebodda av underjordiskt djurliv, gnollar och övergivna maskiner; troligen korrumperade av samma kraft som har påverkat regionerna ovanför.
journal.document.intros.caves.title=Grottor
journal.document.intros.city.body=Dvärgmetropolen var en gång den största av alla dvärgstadsstater. Under dess glansdagar byggde dvärgarna underbara maskiner av metall och magi som gjorde att deras stad kunde expandera snabbt. \n\nSedan, en dag, stängdes stadsportarna och ingen hörde av dvärgarna igen. De få som flydde från staden när den stängdes berättade historier om en galen trollkarl som stal tronen och den fruktansvärda magi han hade lärt sig att utnyttja.
journal.document.intros.city.title=Dvärgmetropolen
journal.document.intros.discover_hint=Du hittar den här texten när du går in i en specifik region för första gången.
journal.document.intros.dungeon.body=Många hjältar har vågat sig in i fängelsehålan före dig från staden ovan, de flesta har aldrig hörts från igen.\n\nDet sägs att ett uråldrigt ondska lurar i djupet och vaktar den allsmäktiga amuletten Yendor. Även nu strålar mörk energi nerifrån och tar sig upp i staden.\n\nKommer du att erövra fängelsehålan och göra anspråk på amuletten? Det är dags att starta ditt eget äventyr!
journal.document.intros.dungeon.title=Dungeon
journal.document.intros.halls.body=Dessa djupa hallar i Dvärgmetropolen har förvrängts av mörk magi. Tidigare var dessa regioner värdar för Dvärgkungens hov av elitmagiker, men nu verkar de ha tagits över av något ännu mer ondskefullt... \n\nAlla möjliga fruktansvärda demoniska varelser bebor dessa hallar, ledda av någon fruktansvärd mörk makt. Om Dvärgarnas kung inte var källan till den spridande korruptionen, måste vad som än finns här nere vara det. \n\nVar försiktig, väldigt få äventyrare har någonsin kommit så här långt...
journal.document.intros.halls.discover_hint=Du kan hitta den här texten i en specifik region, men bara efter att du har hittat alla tidigare texter i den här uppsättningen.
journal.document.intros.halls.title=Demonhallar
journal.document.intros.prison.body=För många år sedan byggdes ett fängelse här för att hysa farliga brottslingar. Fängelset var hårt reglerat och säkert, och fångar från hela landet fördes hit för att avtjäna straff. \n\nMen snart började mörkt miasma krypa nerifrån och förvränga både vaktens och fångarnas sinnen. \n\nSom svar på det växande kaoset spärrade staden av hela fängelset. Ingen vet vad som hände med dem som lämnades att dö inom dessa murar...
journal.document.intros.prison.title=Fängelse
journal.document.intros.sewers.body=De övre våningarna i fängelsehålan utgör faktiskt stadens avloppssystem.\n\nDen mörka energin har smugit sig upp underifrån, de vanligtvis ofarliga avloppsvarelserna har blivit mer och mer vildsinta. Staden har varit tvungen att skicka vaktpatruller hit för att försöka upprätthålla säkerheten för de som är ovanför.\n\nDen här platsen är farlig, men åtminstone är den onda magin som är i praktiken här svag.
journal.document.intros.sewers.title=Avlopp
journal.document.intros.title=Regionintroduktioner
journal.document.prison_warden.discover_hint=Du kan hitta den här texten i en specifik region, men bara efter att du har hittat alla tidigare texter i den här uppsättningen.
journal.document.prison_warden.journal.body=1 vår, 362\n\nDetta är det första inlägget i fängelsevakt Kiana Smiths arbetsdagbok. Med allt som har hänt på sistone har jag bestämt mig för att starta en dagbok för att hålla ordning på mina tankar.\n\nAtt leda ett fängelse en halv mil under jord skulle aldrig bli lätt, men på sistone verkar det som om någon form av organiserad störning pågår. Fångar har agerat illa utan anledning och sedan vägrat att förklara varför.\n\nNågra av vakterna börjar säga att platsen är hemsökt. Jag kan inte låta mitt eget folk sprida rykten, men jag kan inte direkt klandra dem för att de är oroliga.\n- Smith
journal.document.prison_warden.journal.title=Journalföring
journal.document.prison_warden.letter.body=Thomas, \n\nDu har varit en fantastisk vän, så jag gör dig en tjänst. \n\nNär du börjar ditt skift ikväll, lås och förstärk Tengus cell, kasta nyckeln i någon alkov och gå ut. Det spelar ingen roll om de andra fångarna är utan uppsikt, snart kommer ingen att kunna lämna den här platsen. Den där konstiga personen måste dock hållas säker, om han flyr finns det ingen som vet vad han kommer att göra. \n\nBerätta inte för någon om detta, och bry dig inte om att leta efter mig. En kapten måste gå under med sitt skepp. \n - Kiana
journal.document.prison_warden.letter.title=Brev till Thomas
journal.document.prison_warden.mines.body=54:e vintern, 363\n\nA En grupp ingenjörer från staden kom idag och sa att de är här för att stänga av den gamla ingången till gruvorna nedanför. Jag antar att staden inte vill bry sig om att underhålla passagen längre. Jag blev inte informerad i förväg, som vanligt.\n\nDeras chefsingenjör berättade också en del strunt om dvärgmagi som läckte in från gruvorna. Jag tror inte ett ord av det.\n\nSituationen är under mycket bättre kontroll med vår nya personal, men roten till problemet har fortfarande inte åtgärdats. Något påverkar definitivt fångarna här, och att riva några murar kommer inte att ändra på det.\n- Smith
journal.document.prison_warden.mines.title=Försegling av gruvorna
journal.document.prison_warden.no_support.body=11:e våren, 364\n\nVad i helvete tänker staden på? Efter att ha brådskande begärt hjälp har jag inte hört någonting, inte ens en tom ursäkt som de brukar skicka när mina förfrågningar avslås.\n\nSamtidigt fortsätter fångarna att bli sämre, och några av vakterna har till och med börjat orsaka problem. Planerar de att bara låta detta fortsätta att bli värre tills vi har att göra med ett upplopp!?\n\nThomas har åtminstone förblivit lika pålitlig som alltid. Hans organisatoriska hjälp har varit ovärderlig, och hans idé att aktivera de gamla DM-100-enheterna var beklaglig men nödvändig. Jag är övertygad om att jag kan komma tillbaka till toppen av den här situationen, jag behöver bara lite förbannat stöd!\n-Smith
journal.document.prison_warden.no_support.title=Inget stöd
journal.document.prison_warden.recruits.body=80:e våren, 362\n\nS utlovat, ett gäng nya rekryter anlände idag. Det verkar vara det vanliga, några lovande och massor av grymtare som bara vill ha lönen. Ändå borde all denna nya muskelmassa hjälpa mycket med våra senaste ostyriga interner.\n\nI ett jobb som detta är det viktigt att veta vem man kan lita på. En nyanställd, Thomas, verkar särskilt lovande. Jag behöver all hjälp jag kan få just nu, så om han gör bra ifrån sig ska jag se till att få honom befordrad snabbt.\n- Smith
journal.document.prison_warden.recruits.title=Nya rekryter
journal.document.prison_warden.rotberry.body=23:e hösten, 363\n\nFick en fin present från Felix idag. Det är någon sorts ljusröd buske som kallas 'Rotberry'.\n\nJag har nämnt hur trist den här platsen är för honom förut, det verkar som att han lyssnade. Enligt honom ogillar den här växten faktiskt ljus och vatten, så jag behöver bara trimma bladen ungefär en gång i månaden. Att trimma den måste dock vara viktigt, han nämnde det ett dussin gånger i sitt brev.\n\nNaturligtvis gör Felix aldrig något gratis. Han säger att fröna som den här saken producerar är utmärkta för att göra trollstavar, så naturligtvis är jag skyldig honom några varje gång växten producerar några.\n- Smith
journal.document.prison_warden.rotberry.title=Rotbärsväxt
journal.document.prison_warden.title=Vaktens journal
journal.document.sewers_guard.crabs.body=11 vinter, 376\nKära mamma och pappa,\n\nOm inte råttorna vore illa nog, så finns det jättekrabbor djupare där nere! En av dem stormade rakt förbi mig och fick tag i Lee ganska illa innan vi dödade den. Thomas säger att det inte är mitt fel, men jag vet att han bara försöker vara snäll mot mig.\n\nSom tur var, på väg ut stötte vi på en äventyrare som hade lite extra solgrässalva. Lee kanske inte hade klarat sig utan det där.\n\nJag såg äventyraren stirra på en ros innan de gick, de sa att det var en gåva. Varför skulle de riskera sina liv här nere om någon bryr sig så mycket om dem?\n\nDet är precis vad jag gör, eller hur? Jag känner att jag är inne över huvudet.
journal.document.sewers_guard.crabs.title=Jättekrabbor!
journal.document.sewers_guard.dangerous.body=88:e hösten, 375\nKära mamma och pappa,\n\nJag förstår varför lönen är så bra nu, kloakerna är infekterade med monster! "Ohyran" och "laglösen" är gigantiska blodtörstiga råttor och flockar av arga gnollar.\n\nSom tur är vet resten av mitt team verkligen vad de gör. Vår lagkapten, Thomas, är expert på det här. Jag försöker lära mig snabbt så att jag inte är en för stor börda.\n\nDet här jobbet är mycket farligare än jag trodde. Jag är glad att jag inte kan skicka dessa nu, jag vill inte att du ska oroa dig.\n\nJag ska hålla mig säker,\n- Sonya
journal.document.sewers_guard.dangerous.title=En farlig position...
journal.document.sewers_guard.discover_hint=Du kan hitta den här texten i en specifik region, men bara efter att du har hittat alla tidigare texter i den här uppsättningen.
journal.document.sewers_guard.guild.body=23 vinter, 376\nKära mamma och pappa,\n\nInga nya monster den här gången, istället stötte vi på en liten grupp från tjuvarnas gille medan vi var ute och patrullerade.\n\nAllt jag har hört om gillet är dåligt, men resten av mitt team verkade nästan vän med dem. Thomas utbytte information och förnödenheter med en av dem innan vi gick skilda vägar.\n\nJag förstår inte, skulle vi inte bli av med laglösa? Thomas sa till och med att inte nämna detta för någon i befäl. Deras information och förnödenheter var dock mycket användbara, och vi stod inte ut med ännu mer strider.\n\nJag antar att vi alla sitter i samma grupp här nere.
journal.document.sewers_guard.guild.title=Tjuvarnas gille
journal.document.sewers_guard.lost.body=40:e vintern, 376\n\nThomas och jag är vilse. Vi drevs bort från resten av teamet medan vi kämpade mot några gnollar. Ingen av oss är skadad, men de nedre avloppen är som en labyrint.\n\nThomas säger att han känner till en väg ut, men den börjar vid den gamla fängelseingången längst ner i avloppet. Jag gillar verkligen inte att gå djupare, men vi har inga ransoner och att gå ner går mycket snabbare än att vandra runt och leta efter vår patrullväg.\n\nDet kommer att ordna sig. Thomas vet vad han gör.
journal.document.sewers_guard.lost.title=Vi är vilse
journal.document.sewers_guard.new_position.body=85:e hösten, 375\nKära mamma och pappa,\n\nJag sa ju att allt det hårda arbetet på stadsvakten skulle löna sig. Jag blev precis befordrad!\n\nJag har blivit inbjuden att gå med i ett specialistteam som arbetar i avloppet. Tydligen finns det problem med skadedjur och banditer där nere, och det är vårt jobb att rensa ut dem. Det är ett stökigt arbete, men avloppet är varmt på vintern och det betalar tre gånger så mycket som vanlig vakttjänst!\n\nDet är lite hemligt alltihop, så jag kan faktiskt inte skicka det här brevet. Det känns konstigt att inte skriva till er, så jag fortsätter att skriva till dem ändå. Kanske kan jag visa dem för er en dag.\n\nBäst,\n- Sonya
journal.document.sewers_guard.new_position.title=Min nya position!
journal.document.sewers_guard.not_worth.body=Thomas och jag stötte på något slags massivt otmonster vid fängelseingången. Innan vi hann reagera bombarderade det oss med magi. Thomas tog det mesta. Han är borta.\n\nIngen summa pengar är värd detta. Jag ska gå därifrån längs den väg Thomas berättade om. Sedan tar jag det jag har tjänat som vakt och använder det för att flytta mig och mina föräldrar bort från den här förbannade staden. En del av mig vill hoppas att kungen har en plan för allt detta, men jag tvivlar på det.\n\nJag lämnar dessa brev som en varning till andra. Det är mer än bara jätteråttor och krabbor, något är väldigt fel här nere.
journal.document.sewers_guard.not_worth.title=Det är inte värt det
journal.document.sewers_guard.title=Vaktens brev
