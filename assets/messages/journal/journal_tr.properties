journal.document.adventurers_guide.alchemy.body=Eğer bir tüketilebilir eşyayı kullanışlı bulmazsanız, onu simya malzemesi olarak kullanabilir veya çok amaçlı simya enerjisine dönüştürebilirsiniz. Enerji veren iksirler ve parşömenler de onları tanımlar! \n\nTığ işleri, simya kullanılarak yaratılan ve yükseltilen benzersiz bir ekipman türüdür. Büyülü bir tılsım katalizörü ve biraz simya enerjisi ile yapılırlar.\n\n(İlk simya kabı zindanın 3. veya 4. katındadır. Bu kapların yakınında simya tarif kitabı sayfaları da bulunmaktadır.)
journal.document.adventurers_guide.alchemy.title=Simya ve Süs Eşyaları
journal.document.adventurers_guide.dieing.body=Zindan keşfi tehlikelidir ve çoğu maceracı sonunda ölür. Şans yardımcı olur, ancak en iyi maceracılar şanslarını artırmak için her küçük hileyi kullanırlar. (Çok fazla ölüyorsanız üzülmeyin, bu oyun zor! Hemen kazanmaya değil, oyunu öğrenmeye ve sürekli gelişmeye odaklanın.)
journal.document.adventurers_guide.dieing.title=Yenilgiyle Başa Çıkmak
journal.document.adventurers_guide.examining.body=Düşmanlarınızı ve çevrenizi körü körüne dalmak yerine incelemek önemlidir! Her yeni şeyi inceleme alışkanlığı edinin. (Büyüteç düğmesini kullanarak ve ardından incelemek istediğiniz şeyi seçerek inceleyebilirsiniz. Ayrıca simgelerini seçerek güçlendirmeleri veya zayıflatmaları da inceleyebilirsiniz.)
journal.document.adventurers_guide.examining.title=İncelemek
journal.document.adventurers_guide.food.body=Yiyecekleri etkili bir şekilde rasyonlamak, hayatta kalma şansınızı artırmanın en iyi yollarından biridir; her zaman acıktığınız anda yemek yemek zorunda değilsiniz! Açlıktan ölmek üzere olmadığınızda sağlığınız yavaş yavaş yenilenir, bu nedenle tam sağlıkta yemek yerseniz bu yenilenme boşa gider! Sağlığınıza göre yemek yeme zamanınızı ayarlarsanız, yiyecekleriniz çok daha uzun süre dayanır.
journal.document.adventurers_guide.food.title=Açlıkla Başa Çıkmak
journal.document.adventurers_guide.identifying.body=İksirlerin ve parşömenlerdeki sembollerin renkleri her zindanda farklıdır. Tanımlanmamış ekipmanlar şanslıysanız yükseltilebilir veya büyülenebilir, aksi takdirde lanetlenmiş olabilir! Tanımlama, yükseltme veya laneti kaldırma parşömenleri, tanımlanmamış ekipman kullanma riskini azaltmak istiyorsanız çok faydalıdır. (Tanımladığınız tüm öğelerin listesini günlüğünüzün katalog sekmesinde bulabilirsiniz.)
journal.document.adventurers_guide.identifying.title=Öğeleri Tanımlama
journal.document.adventurers_guide.intro.body=Selamlar Maceracı, Zindan Ustalığı Kitabı'nı okuyorsunuz! Bu kılavuz en iyi şekilde referans olarak kullanılır ve hangi sayfayı ne zaman okumanız gerektiğini size sihirli bir şekilde bildirecektir. (Günlük düğmesi yanıp söndüğünde, kılavuzun size ne söylediğini okumak için onu seçin! Bazı sayfalar eksik, belki onları zindanda bulabilirsiniz?)
journal.document.adventurers_guide.intro.title=giriiş
journal.document.adventurers_guide.levelling.body=Seviye atlamak istatistiklerinizi artırır ve savaşta büyük fark yaratabilecek yetenek puanları kazandırır. Zindanın her katı için en az bir seviyeniz olması en iyisidir. Keşif veya savaştan kaçınarak acele etmek cazip gelebilir, ancak bunu yapmak sizi malzeme ve deneyimden mahrum bırakacaktır. (Oyun arayüzünün köşesindeki durum panelinde kahramanınız hakkında deneyim de dahil olmak üzere bilgi görebilirsiniz. Daha fazla bilgi almak için kahramanınızın portresini seçin.)
journal.document.adventurers_guide.levelling.title=Deneyim Kazanmak
journal.document.adventurers_guide.looting.body=Kilitli kapıların ardındaki veya engeller içeren odalarda genellikle daha iyi ganimet bulunur. Yolunuzu bir engel kestiğinde, genellikle aynı katta size yardımcı olacak bir eşya bulabilirsiniz. Her beş katlı zindan bölgesinde her zaman 2 güç iksiri ve 3 yükseltme parşömeni bulabilirsiniz, bu nedenle bunlar ne kadar iyi keşif yaptığınızın harika bir göstergesidir. (Günlük penceresinin notlar sekmesinde önemli yerlerin ve kullanılmamış anahtarların listesini görebilirsiniz.)
journal.document.adventurers_guide.looting.title=Etkin Yağmalama
journal.document.adventurers_guide.magic.body=Büyülü saldırılar zırhı kolayca delip geçer ve kaçınması zordur. Bu, asaların verdiği hasarın çok güvenilir olduğu anlamına gelir, ancak aynı zamanda büyülü düşmanları da çok tehlikeli hale getirir! Büyülü saldırıların her zaman bir dezavantajı vardır. Asaların sınırlı kullanım hakkı vardır ve büyülü düşmanlar genellikle yakın mesafede büyülerini kullanamazlar. Büyü kullanan düşmanlarla karşılaştığınızda, onların size büyü yapmasını nasıl engelleyeceğinizi öğrenmek önemlidir.
journal.document.adventurers_guide.magic.title=Büyülü Saldırılar
journal.document.adventurers_guide.positioning.body=Strateji, ekipman kadar önemlidir. Çevrelenmek gibi kötü durumlar genellikle iyi konumlanma ile önlenebilir. Örneğin, çoğu zindanda düşmanların sizinle teker teker savaşmasını gerektiren dar koridorlar bulunur. Bu koridorlarda genellikle sürpriz saldırılar için kapılar da vardır! Çimen, su, çukurlar veya tuzaklar gibi çevre özelliklerini kendi avantajınıza kullanmanın birçok küçük yolu da vardır.
journal.document.adventurers_guide.positioning.title=Konumlandırma
journal.document.adventurers_guide.searching.body=Zindanlar, ilk bakışta görünmez olan gizli kapılar ve tuzaklarla doludur. Yakınlarda gizli bir kapı veya tuzak olduğundan şüpheleniyorsanız, biraz zaman ayırıp dikkatlice arama yapabilirsiniz. (Büyüteç düğmesini iki kez kullanarak etrafınızdaki tüm kareleri arayabilirsiniz. Belki de bu sayfayı bulduğunuz yere yakın bazı gizli kapılar vardır!)
journal.document.adventurers_guide.searching.title=Arama
journal.document.adventurers_guide.strength.body=Zindanda bulduğunuz silah ve zırhlarla antrenman yapmaya zamanınız yok, bu yüzden onları etkili bir şekilde kullanmak için kaba kuvvete ihtiyacınız olacak. Güç iksirleri ve yükseltme parşömenleri, daha yüksek seviye ekipmanların güç gereksinimlerini karşılamanın en etkili yoludur. Sonunda yüksek seviye eşyaları kullanmaya başlamak önemlidir, ancak şu anda kullanabileceğiniz ekipmanları da göz ardı etmeyin.
journal.document.adventurers_guide.strength.title=Kuvvet
journal.document.adventurers_guide.surprise_attacks.body=Sürpriz saldırılar kesinlikle isabet eder, bu da onları özellikle yılanlar ve hayaletler gibi kaçamak davranan düşmanlara karşı kullanışlı hale getirir. Düşmanları, sizi kovalarken bir kapıdan içeri girdikten hemen sonra veya sizi gözden kaybettikleri anda şaşırtabilirsiniz.
journal.document.adventurers_guide.surprise_attacks.title=Sürpriz Saldırılar
journal.document.adventurers_guide.title=zindan ustalığı kitabı
journal.document.adventurers_guide.upgrades.body=Zindana ne kadar derine inerseniz, sihirle yükseltilmiş yüksek seviye ekipman kullanmanız o kadar önemli hale gelir, ancak bunları doğru şekilde kullanmak için de güce ihtiyacınız olacaktır. Asa, yüzük ve eserler güç gerektirmez, ancak sınırlı kullanımları vardır veya savaşta doğrudan yardımcı olmazlar. Zindanın başlarında hayatta kalmak ve daha sonra başarıya ulaşmak için neyi yükselteceğiniz konusunda doğru seçimler yapmak çok önemlidir.
journal.document.adventurers_guide.upgrades.title=Yükseltmeler
journal.document.alchemy_guide.bombs.body=Standart bir kara barut bombası, belirli bir maddeyle karıştırılarak daha güçlü bir bomba haline getirilebilir.
journal.document.alchemy_guide.bombs.title=Geliştirilmiş Bombalar
journal.document.alchemy_guide.brews_elixirs.body=İksirler ve özel karışımlar, genellikle tek kullanımlık ve çeşitli etkilere sahip gelişmiş iksirlerdir.
journal.document.alchemy_guide.brews_elixirs.title=içecekler ve iksirler
journal.document.alchemy_guide.energy_food.body=Birçok tarif, tüketilebilir maddelerin bir simya kazanında parçalanmasıyla elde edilen kristal simya enerjisi gerektirir. İksirleri veya parşömenleri enerjilendirmek de onları tanımlar. Bazı enerji gerektiren tarifler büyülüdür, ancak bunlar geleneksel yemek pişirmeye benzer.
journal.document.alchemy_guide.energy_food.title=Enerji ve Gıda
journal.document.alchemy_guide.exotic_potions.body=İksirler, egzotik iksirler oluşturmak için enerjiyle karıştırılabilir. Daha güçlü etkilere sahiptirler, ancak genellikle farklı şekillerde kullanılırlar.
journal.document.alchemy_guide.exotic_potions.title=egzotik iksirler
journal.document.alchemy_guide.exotic_scrolls.body=Egzotik parşömenler, biraz enerji ve bir parşömen kullanılarak yapılabilir. Egzotik iksirlerden biraz daha güçlü ve daha pahalıdırlar.
journal.document.alchemy_guide.exotic_scrolls.title=egzotik parşömenler
journal.document.alchemy_guide.potions.body=Simya Uygulamalarına Hoş Geldiniz! Bu kitap, simya kazanında eşya üretmek için tarifler içeren bir referans kitaptır. En ikonik tarifle başlayalım: İksirler! Üç tohum kullanarak rastgele bir iksir hazırlayın! Her tohumun bir iksir karşılığı vardır; iksirin kullandığınız tohumlarla ilgili olma olasılığını artırmak için aynı tohumdan birden fazla kullanın.
journal.document.alchemy_guide.potions.title=Giriş ve İksirler
journal.document.alchemy_guide.spells.body=Büyüler kristallerin içinde bulunur ve genellikle birden fazla kullanım alanı olan çeşitli etkiler sağlar.
journal.document.alchemy_guide.spells.title=büyüler
journal.document.alchemy_guide.stones.body=Bir parşömeni simya kazanına atmak, büyüsünü kazandaki iki taşa aktarır. Bu, runik taşlar oluşturur ve parşömeni tanımlar!
journal.document.alchemy_guide.stones.title=Runetaşları Oluşturma
journal.document.alchemy_guide.title=Simya Rehberi
journal.document.alchemy_guide.weapons.body=Daha hafif veya daha büyülü silahlardan bazıları simyada kullanılabilir! Her fırlatma silahı seti, aynı seviye ve kademedeki başka bir seti tamamen onarmak için yeterli sıvı metal üretir. Bir seti simya yoluyla dönüştürmenin, tüm set mevcut olmasa bile, tüm seti yok edeceğini unutmayın! Bir asa, aynı seviyedeki iki asayı yükseltmek için yeterli büyülü reçine üretir, ancak +3'ten daha yüksek bir seviyeye çıkaramaz.
journal.document.alchemy_guide.weapons.title=Silahları Geliştirme
journal.document.caves_explorer.alive.body=23 Yaz, 308\n\nCüce makinelerinden biri bir şekilde canlandı! Sadece yanından geçiyorduk ki, makine saldırdı ve devasa metal yumruklarıyla grubumuzdan iki kişiyi neredeyse ezdi. Neyse ki, yanımda yok etme asam vardı. Birkaç isabetli atışla canavar hurda metaline dönüştü.\n\nBeni rahatsız eden şey, makineyi kışkırtmak için kesinlikle hiçbir şey yapmamış olmamız. Cüceler makineleri bu kadar saldırgan olacak şekilde tasarlamış olamazlar, sanki bize pusu kurmaya çalışıyormuş gibi!\n\nEn azından bir kez olsun arkadaşlarıma yardım edebildim.\n- Archibald
journal.document.caves_explorer.alive.title=O yaşıyor!
journal.document.caves_explorer.city.body=21 Yaz, 308\n\nÜçüncü haftadayız ve son on günün büyük bir bölümünü daha da derinlere inerek geçirdikten sonra nihayet madenlerin dibine ulaştık. Çeşitli metal düzenekler ve eski cüce metropolüne girişi engelleyen büyük bir kapı bulduk.\n\nDemirci bizi bu makinelerin bazıları konusunda uyardı. Görünüşe göre bölge savunması için tasarlanmış ve rahatsız edildiğinde aktif hale gelme eğiliminde. Şehirde işimiz yok ve metalin hurda değeri de çok düşük olacağından, uyarısını dikkate alıp geri dönmenin en iyisi olduğunu düşündük.\n\nİtiraf etmeliyim ki meraklıydım, ama orada araştırma yapmak kesinlikle riske değmezdi.\n- Archibald
journal.document.caves_explorer.city.title=Şehir Girişi
journal.document.caves_explorer.discover_hint=Bu metni belirli bir bölgede bulabilirsiniz, ancak önce bu kümedeki tüm önceki metinleri bulmanız gerekir.
journal.document.caves_explorer.expedition.body=1 Yaz, 308\n\nBugün, terk edilmiş cüce madenlerine dört haftalık keşif gezimiz başlıyor! Kralın kendisi tarafından bölgeyi keşfetmekle görevlendirildim. Başlıca hedeflerim, henüz kullanılmamış doğal kaynakları bulmak ve potansiyel bir hapishane inşaat projesi için mağaraları incelemektir.\n\nKendimi savunabilecek durumda olsam da, kralın ısrarı üzerine şehir muhafızlarından bir refakatçi kabul ettim. Bir sürü aptallar, ama beni yavaşlatmadıkları sürece varlıkları katlanılabilir.\n\nAkşam vaktine kadar kanalizasyonları temizleyip madenlere ulaşmamız bekleniyor.\n- Archibald Drummond. Başbüyücü, Güney Büyücülük Enstitüsü.
journal.document.caves_explorer.expedition.title=Sefer Başlıyor!
journal.document.caves_explorer.gold.body=4 Yaz, 308\n\nİlk birkaç günümüz gerçekten çok verimli geçti! Bir ana kamp kurduktan sonra, terk edilmiş madenin üst kısımlarını keşfetmeye koyulduk. Cüceler tarafından bırakılan bir sürü işe yaramaz eşya olsa da, mağara duvarlarının çoğu da altınla dolu!\n\nNe yazık ki, buraya ilk gelenler biz değiliz. Mağaralar saldırgan vahşi yaşamla dolu ve görünüşe göre gnoll sürüleri de altına ilgi duyuyor. Muhafızlarıma karşı haksızlık ettiğimi itiraf ediyorum, beklediğimden çok daha yetenekli kaşifler ve korumalar oldular.\n\nBu başarıya rağmen, keşfedilecek daha çok mademiz var.\n- Archibald
journal.document.caves_explorer.gold.title=Çok fazla altın!
journal.document.caves_explorer.report.body=28 Yaz, 308\n\nBugün eşyalarımızı toplamayı bitirip ayrılmaya hazırlanacağız. Tam zamanında da oldu, grubumuzdan birkaç kişi agresif makineyle yaşanan olaydan sonra korkunç kabuslar görmeye başladı. Muhtemelen sadece yorgunluktan kaynaklanıyor, ama kabusları endişe verici derecede benzer.\n\nÖzetle, madenin üst kısımları oldukça güvenli. Koyu altın için bir kullanım alanı bulunabilirse, madenciliği oldukça karlı olabilir. Geniş açık alanlar şehrin inşaat planları için de çok uygun olacaktır. Ancak alt madenler daha tehlikelidir ve kaçınılmalıdır.\n\nTüm bunları önümüzdeki birkaç gün içinde nihai raporuma yazacağım.\n- Archibald
journal.document.caves_explorer.report.title=Nihai Rapor
journal.document.caves_explorer.title=Kaşif Günlüğü
journal.document.caves_explorer.troll.body=11 Yaz, 308\n\nMadenlerin orta bölümüne doğru keşif gezimize başladıktan sonra, dostça bir yüzle karşılaştık! Yani... nispeten dostça. Bir mağara trolü orada küçük bir demirci atölyesi kurmuş. Kaba ve pek konuşkan değil, ama biraz altın karşılığında ekipmanımızı tamir etti.\n\nNe yazık ki, trol demirci bize bu güzel altının göründüğü kadar iyi olmadığını da söyledi. Ona 'koyu altın' diyor ve görünüşe göre güneş ışığında hızla bozuluyor. Bu kesinlikle buradaki kaynaklar üzerinde neden hiç çatışma olmadığını açıklıyor.\n\nSanırım daha değerli bir şey olup olmadığını görmek için biraz daha derine inmemiz gerekiyor.\n- Archibald
journal.document.caves_explorer.troll.title=Bir trol ile karşılaştım.
journal.document.city_warlock.discover_hint=Bu metni belirli bir bölgede bulabilirsiniz, ancak önce bu kümedeki tüm önceki metinleri bulmanız gerekir.
journal.document.city_warlock.failure.body=Görünüşe göre ben de bir aptalım. Yeni Kral'ın sarayın ona gönüllü olarak boyun eğmesi gerektiğini sanıyordum, ama şimdi görüyorum ki, ona direnenleri bile kontrol edebilecek güce sahip. Tüm en güçlü muhalifleri körü körüne kapısına getirdim ki onları bizzat kölesi haline getirebilsin. Şimdi onun nekrotik enerjisinin dalgaları şehri kasıp kavuruyor ve anında çoğunu yalvaranlarına dönüştürüyor. Hâlâ özgür iradesi olan az sayıda kişi kaçıyor. Ben de elimden geldiğince gözlem yapmak ve bir fırsat aramak için geride kalmayı seçtim. Sahip olduğum sihirli güçle bir süre saklı ve güvende kalabilmeliyim.
journal.document.city_warlock.failure.title=Arıza
journal.document.city_warlock.more_powerful.body=Zamanı takip etmek zorlaştı, ama son yazımın üzerinden yaklaşık bir hafta geçti. Uygarlığımız gerçekten çöktü. Kapılar kapalı, toplumumuzun tüm işlevleri durdu ve boş cüce bedenleri koridorlarda dolaşıyor. Bütün bunların ortasında, bir şekilde Yeni Kral daha da güçleniyor. Her geçen gün iradesinin gücü artıyor, ama aynı zamanda değişiyor da. Bunu tarif edemem, ama artık hiç cüce değilmiş gibi geliyor. Sanırım yapabileceğim en iyi şey bu olayları belgelemek. Elimden geldiğince burada kalacağım ve iradem zayıflamaya başlayınca geri çekileceğim.
journal.document.city_warlock.more_powerful.title=Daha Güçlü
journal.document.city_warlock.new_power.body=Burada neler oluyor? Yeni Kral'dan yayılan güç gerçekten de ilk baştakinden farklı, ama bir de başka bir şey var. Bu yeni güç, şehrimizin en iç koridorlarından yayılıyor gibi görünüyor. Daha da şaşırtıcı olanı ise, üst metropoldeki faaliyetlerin de azalmış olması. Orada neler olduğunu bilmiyorum, ama Yeni Kral'ın neredeyse tüm dikkatini çekiyor. Derin koridorlara geri dönmek tehlikeli olacak, ama bu değişime neyin sebep olduğunu keşfetmeliyim. Belki de Yeni Kral'ın bir zayıf noktası vardır?
journal.document.city_warlock.new_power.title=Yeni Bir Güç
journal.document.city_warlock.old_king.body=Büyü Çağı'nın 33. yılının 2. ayının 5. günündeyiz. Eğer bunu okuyan bir üst dünya sakini varsa, 264 yılının Kış mevsimindeyiz demektir. Adım Thymor Zahir ve bildiğim kadarıyla cüce sarayının hayatta kalan son üyesiyim. Kralımız öldü, yerine eski meslektaşlarımdan biri geçti ve o da güç delisi oldu. Sarayın geri kalanı, aptal oldukları gibi, ona boyun eğdi ve bu süreçte özgür iradelerini kaybetti. Bunu önceden gören ve ritüeli tamamlanmadan önce kaçan tek kişi bendim. İç çember düştü, ancak Yeni Kral'ın gücü henüz herkese ulaşmadı. Mümkün olan en kısa sürede direnişe geçmeliyim. Şanlı medeniyetimizin bu megalomanın eline düşmesine izin vermeyeceğim!
journal.document.city_warlock.old_king.title=Kral Öldü
journal.document.city_warlock.resistance.body=Haberler hızla yayılmış gibi görünüyor. Sadece birkaç gün geçti ve ben şimdiden Eski Kral'a sadık küçük bir ordu topladım. Az sayıda kişi sihir konusunda yetenekli, ancak savaşçı keşişlerin neredeyse tamamı aramızda. Bir deli cüce ve kölelerinden oluşan maiyeti için fazlasıyla yeterli olmalıyız. Bu arada Yeni Kral şehrimizin iç odalarına saklandı. Şüphesiz gücünün çoğunu tüketti ve daha fazla direnişle karşılaşmadan önce toparlanmayı umuyor. Birkaç saat içinde saldırımızı başlatacağız. Şansımız yaver giderse, geçici bir konsey kurup muhteşem şehrimizi gece sonuna kadar istikrara kavuşturabileceğiz.
journal.document.city_warlock.resistance.title=Bir Direniş
journal.document.city_warlock.seen_it.body=Aşağıda ne olduğunu gördüm ama tarif edemiyorum. Düşüncelerimi yazıya dökmeye çalışırken ellerim kontrolsüzce titriyor. Neden bu oluyor? Yeni Kral mı yaptı bunu? Hiçbir anlamı yok. Belki de gücünü pervasızca kullanması bunu kendine çekti? Uygarlığımızı kurtarmayı ummuştum ama şimdi tüm dünyanın tehlikede olduğunu görüyorum. Bir şekilde, kral daha az kötü olanı. Başka seçeneğim yok, daha büyük iyilik için kendimi teslim edeceğim. Lütfen bana yol gösterin kralım, beni Yog-Dzewa'yı uzak tutmak için bir araç olarak kullanın!
journal.document.city_warlock.seen_it.title=Onu gördüm
journal.document.city_warlock.title=Büyücünün Günlüğü
journal.document.halls_king.amulet.body=BAŞARDIM!\n\nTam olarak ne bulacağımı bilmiyordum, ama orada keşfettiğim şey en çılgın tahminlerimin bile ötesindeydi. O kadar çok güç, orada hazır bekliyor ve hepsi benim!\n\nBununla birlikte saraydaki aptalların hiçbiri bana karşı çıkmaya cesaret edemeyecek. Onları nasıl aşağılayabileceğim konusunda çok heyecanlıyım. Hatta neden orada durayım ki, istersem hepsini yok edecek kadar gücüm var! Bu aşırı olabilir, ama karar vermekte çok uzun süre beklememeliyim yoksa şüphelenirler.\n\nSanırım bu büyük güce Yendor Tılsımı diyeceğim!\n- R.
journal.document.halls_king.amulet.title=Tılsım
journal.document.halls_king.attrition.body=Bu şeyle başa çıkmak için bir planım var. Gücü sonsuz, ancak bu dünyaya tecavüz etme yeteneği sınırlı. Tılsımı ele geçirmek için yeterli gücü toplamaya çalışırken, emirlerini yerine getirmek için hizmetkarlarına ve avatarlarına güveniyor. Tılsıma fiziksel olarak sahip olmasam da, gücü üzerinde tam kontrolüm var. Tüm cüce şehri emrimde olduğu için sayısal bir avantajım da var. Tılsımı ele geçirmesini engellemek için sürekli asker gönderebilir ve yıpratma yoluyla bu savaşı kazanabilirim! Ben, cücelerin kralı Rodney, senden daha uzun süre dayanacağım Yog-Dzewa!
journal.document.halls_king.attrition.title=Tükenme
journal.document.halls_king.discover_hint=Bu metni belirli bir bölgede bulabilirsiniz, ancak önce bu kümedeki tüm önceki metinleri bulmanız gerekir.
journal.document.halls_king.new_king.body=BEN KRALIM, AHAHAHAHAAA!\n\nBunu yapmama izin verdiler! Neredeyse hiç ikna etmeden, bu gücü onlarla büyük bir ritüelde 'paylaşmama' izin verdiler. Bir anda alaycı seslerden oluşan bir korodan, sessiz tebaamın yeni sarayına dönüştüler!\n\nTahmin edileceği gibi, Thymor ilk sorun belirtisinde korkak gibi kaçtı. Zaten kurduğu direniş gücünü de hissedebiliyorum. Sanırım devam etmesine izin vereceğim, böylece tüm komplocularını kapıma getirebilsin!\n\nAçıkça krallık da bana saygı duymuyor, sanırım bunu da düzelteceğim.\n- Cücelerin Kralı
journal.document.halls_king.new_king.title=Yeni Bir Kral
journal.document.halls_king.rejection.body=APTALLAR!\n\nSon 33 yıldır krallığımız yeni sihirli teknolojimizle gelişti. Element ruhlarını çağırmayı ve onları irademize boyun eğdirmeyi öğrendik, ancak nedense şimdi daha fazla deney yapmak 'çok tehlikeli'.\n\nGerçekte neler olup bittiğini biliyorum. Teorilerimin reddedilmesinin, değerleriyle hiçbir ilgisi yok, tamamen onları öne süren kişiyle ilgisi var. Muhtemelen hepsi arkamdan bana gülüyorlar.\n\nArtık yeter! Ne derlerse desinler, evrenimizin en uzak köşelerini tek başıma keşfedeceğim ve keşfettiğim her şeyi kendime saklayacağım!\n- R.
journal.document.halls_king.rejection.title=Reddedilme
journal.document.halls_king.ritual.body=Thymor bugün erken saatlerde beni alenen azarladı ve yeni güç kaynağımı açıklamam konusunda ısrar etti. Onu elimden geldiğince savuşturdum, ama sarayın geri kalanının yargılayıcı bakışlarını bir kez daha üzerimde hissedebiliyorum. Fırtınadan önceki sakinliğin tadını biraz daha çıkarmayı ummuştum, ama bunun pek bir önemi yok. Ne yapmak istediğime karar verdim. Gücümü yeni bir ritüel aracılığıyla kazandığımı iddia edeceğim ve bunu diğer büyücüler ve Kral üzerinde gerçekleştirmeyi teklif edeceğim. Ritüel bittiğinde, kral olacağım! Thymor elbette itiraz edecek, ama bu kadar güç teklif edildiğinde onu dinleyeceklerinden şüpheliyim! HERKES ÖNÜMDE EĞİLECEK! - Cücelerin Gelecek Kralı
journal.document.halls_king.ritual.title=Ritüel
journal.document.halls_king.thing.body=Bir sorun var. Thymor zahmetsizce ortadan kaldırıldı, ancak dış düzlemlerdeki arayışlarımın fark edilmediği görünmüyor. Bir... 'şey'... dünyama çekildi ve alt salonların dibinden kendini zorla içeri sokmaya başladı. İşleri daha da karmaşık hale getiren şey ise, tam olarak muskayı sakladığım yer olması! Ne kadar kinci bir yaratık, dışarıda hala alınacak çok şey varken neden gücümü benden almaya çalışıyor? Gücüm olsa da, öylece dalıp onunla savaşabileceğimi sanmıyorum. Gerçek gücü akıl almaz, ama onu sınırlamanın bir yolu olmalı. ÖDÜLÜMÜ SAVUNACAĞIM!
journal.document.halls_king.thing.title=Şey
journal.document.halls_king.title=???'nin Günlüğü
journal.document.intros.caves.body=Bu seyrek nüfuslu mağaralar, terk edilmiş hapishanenin altına doğru uzanıyor. Mineral bakımından zengin olan bu mağaralar, bir zamanlar aşağıdaki cüce toplumu için hareketli bir ticaret ve sanayi merkeziydi, ancak cüceler karanlık büyüye takıntılı hale gelince terk edildiler. Mağaralar artık çoğunlukla yeraltı vahşi yaşamı, gnollar ve terk edilmiş makinelerle dolu; muhtemelen yukarıdaki bölgeleri etkileyen aynı güç tarafından bozulmuş durumdalar.
journal.document.intros.caves.title=Mağaralar
journal.document.intros.city.body=Cüce Metropolü bir zamanlar tüm cüce şehir devletlerinin en büyüğüydü. En parlak döneminde cüceler, şehirlerinin hızla genişlemesini sağlayan harika metal ve sihir makineleri inşa ettiler. Sonra bir gün, şehrin kapıları kilitlendi ve cücelerden bir daha haber alınamadı. Şehir kapanırken kaçmayı başaran az sayıda kişi, tahtı çalan çılgın bir büyücünün ve onun kullanmayı öğrendiği korkunç büyünün hikayelerini anlattı.
journal.document.intros.city.title=Cüce Metropolü
journal.document.intros.discover_hint=Bu metni, belirli bir bölgeye ilk kez girdiğinizde görebilirsiniz.
journal.document.intros.dungeon.body=Sizden önce yukarıdaki şehirden birçok kahraman zindana girdi, çoğu bir daha haber alınamadı. \n\nDerinliklerde kadim bir kötülüğün gizlendiği ve kudretli Yendor Tılsımı'nı koruduğu söyleniyor. Hatta şimdi bile aşağıdan karanlık enerji yayılıyor ve şehre doğru yükseliyor. \n\n ...
journal.document.intros.dungeon.title=Zindan
journal.document.intros.halls.body=Cüce Metropolünün bu derin salonları karanlık büyü tarafından çarpıtılmıştır. Geçmişte bu bölgeler Cüce Kralının seçkin büyücülerinden oluşan sarayına ev sahipliği yaparken, şimdi daha da uğursuz bir şey tarafından ele geçirilmiş gibi görünüyorlar... Bu salonlarda her türlü korkunç şeytani yaratık yaşıyor ve korkunç bir karanlık güç tarafından yönetiliyorlar. Eğer Cüce Kralı yayılan yozlaşmanın kaynağı değilse, buradaki her neyse o olmalı. Dikkatli olun, çok az maceracı bu kadar derine inmiştir...
journal.document.intros.halls.discover_hint=Bu metni belirli bir bölgede bulabilirsiniz, ancak önce bu kümedeki tüm önceki metinleri bulmanız gerekir.
journal.document.intros.halls.title=Şeytan Salonları
journal.document.intros.prison.body=Yıllar önce, tehlikeli suçluları barındırmak için buraya bir hapishane inşa edildi. Sıkı bir şekilde denetlenen ve güvenli olan bu hapishaneye, ülkenin dört bir yanından mahkumlar getirilerek cezalarını çekiyorlardı. Ancak kısa süre sonra aşağıdan karanlık bir sis sızmaya başladı ve hem gardiyanların hem de mahkumların zihinlerini çarpıttı. Artan kaosa karşılık olarak, şehir tüm hapishaneyi mühürledi. Bu duvarların içinde ölüme terk edilenlerin başına ne geldiği bilinmiyor...
journal.document.intros.prison.title=Hapishane
journal.document.intros.sewers.body=Zindanın üst katları aslında şehrin kanalizasyon sistemini oluşturuyor. Karanlık enerji aşağıdan yukarıya doğru sızdıkça, genellikle zararsız olan kanalizasyon yaratıkları giderek daha vahşi hale geldi. Şehir, yukarıdakilerin güvenliğini sağlamak için buraya nöbetçi devriyeleri göndermek zorunda kaldı. Burası tehlikeli, ama en azından burada işleyen kötü büyü zayıf.
journal.document.intros.sewers.title=Kanalizasyonlar
journal.document.intros.title=Bölge Tanıtımları
journal.document.prison_warden.discover_hint=Bu metni belirli bir bölgede bulabilirsiniz, ancak önce bu kümedeki tüm önceki metinleri bulmanız gerekir.
journal.document.prison_warden.journal.body=1 İlkbahar, 362\n\nBu, hapishane müdürü Kiana Smith'in iş günlüğündeki ilk giriştir. Son zamanlarda olan her şeyden sonra, düşüncelerimi düzenli tutmak için bir günlük tutmaya karar verdim.\n\nYeraltında yarım mil derinlikte bir hapishaneyi yönetmek asla kolay olmayacaktı, ancak son zamanlarda bir tür organize karışıklık yaşanıyor gibi görünüyor. Mahkumlar sebepsiz yere taşkınlık yapıyor ve sonra nedenini açıklamayı reddediyorlar.\n\nBazı gardiyanlar buranın perili olduğunu söylemeye başladı. Kendi adamlarımın dedikodu yaymasına izin veremem, ama huzursuz olmalarını da tam olarak suçlayamam.\n- Smith
journal.document.prison_warden.journal.title=Günlük Tutmak
journal.document.prison_warden.letter.body=Thomas, \n\nSen harika bir arkadaş oldun, bu yüzden sana bir iyilik yapıyorum.\n\nBu gece vardiyana başladığında, Tengu'nun hücresini kilitle ve güçlendir, anahtarı bir nişe at ve çık. Diğer mahkumlar gözetimsiz olsa da önemli değil, çok yakında kimse buradan çıkamayacak. Ama o ucube güvende kalmalı, kaçarsa ne yapacağını kimse bilemez.\n\nBunu kimseye söyleme ve beni aramaya zahmet etme. Bir kaptan gemisiyle birlikte batmalıdır.\n- Kiana
journal.document.prison_warden.letter.title=Thomas'a Mektup
journal.document.prison_warden.mines.body=54. Kış, 363\n\nŞehirden bir grup mühendis bugün geldi ve aşağıdaki madenlere giden eski girişi kapatmak için burada olduklarını söylediler. Sanırım şehir artık geçidin bakımını yapmakla uğraşmak istemiyor. Her zamanki gibi önceden bilgilendirilmedim.\n\nBaş mühendisleri ayrıca bana madenlerden sızan cüce büyüsü hakkında saçma sapan şeyler anlattı. Bunların hiçbirine inanmıyorum.\n\nYeni personelimizle durum çok daha iyi kontrol altında, ancak sorunun kökeni hala ele alınmadı. Buradaki mahkumları kesinlikle etkileyen bir şey var ve birkaç duvarı yıkmak bunu değiştirmeyecek.\n- Smith
journal.document.prison_warden.mines.title=Mayınların Kapatılması
journal.document.prison_warden.no_support.body=11. Bahar, 364\n\nŞehir ne düşünüyor acaba? Acil yardım talebinde bulunduktan sonra hiçbir şey duymadım, taleplerim reddedildiğinde genellikle gönderdikleri gibi boş bir özür bile yok.\n\nBu arada mahkumların durumu daha da kötüleşiyor ve bazı gardiyanlar bile sorun çıkarmaya başladı. Bu durumun daha da kötüleşmesine ve bir isyanla karşı karşıya kalmamıza izin mi verecekler acaba!?\n\nThomas en azından her zamanki gibi güvenilir kaldı. Organizasyonel yardımı paha biçilmezdi ve o eski DM-100 ünitelerini aktif hale getirme fikri üzücü ama gerekliydi. Bu durumun üstesinden gelebileceğime eminim, sadece biraz desteğe ihtiyacım var!\n-Smith
journal.document.prison_warden.no_support.title=Destek Yok
journal.document.prison_warden.recruits.body=80. Bahar, 362\n\nSöz verdiğim gibi, bugün bir sürü yeni eleman geldi. Her zamanki gibi, birkaç umut vadeden ve sadece maaşını isteyen bir sürü sıradan kişi var. Yine de, bu kadar yeni gücün olması, son zamanlardaki asi mahkumlarımızla başa çıkmamıza çok yardımcı olacaktır.\n\nBöyle bir işte kime güvenebileceğinizi bilmek önemlidir. Yeni işe alınanlardan Thomas özellikle umut vadeden biri gibi görünüyor. Şu anda alabileceğim tüm yardıma ihtiyacım var, bu yüzden iyi iş çıkarırsa onu hızla terfi ettirmeyi düşüneceğim.\n- Smith
journal.document.prison_warden.recruits.title=Yeni Üyeler
journal.document.prison_warden.rotberry.body=23 Sonbahar, 363\n\nBugün Felix'ten çok güzel bir hediye aldım. 'Çürük meyvesi' denilen parlak kırmızı bir çalı.\n\nBu yerin ne kadar kasvetli olduğunu ona daha önce de söylemiştim, dinlemiş gibi görünüyor. Ona göre bu bitki aslında ışığı ve suyu sevmiyor, bu yüzden yapraklarını ayda bir veya iki kez budamam gerekiyor. Budama önemli olmalı, mektubunda bunu on iki kez belirtmiş.\n\nTabii ki Felix hiçbir şeyi bedava yapmaz. Bu şeyin ürettiği tohumların asa yapımında harika olduğunu söylüyor, bu yüzden doğal olarak bitki her tohum ürettiğinde ona birkaç tane borçluyum.\n- Smith
journal.document.prison_warden.rotberry.title=Çürük Meyve Bitkisi
journal.document.prison_warden.title=Gardiyanın Günlüğü
journal.document.sewers_guard.crabs.body=11. Kış, 376\nSevgili Anne ve Baba,\n\nSıçanlar yeterince kötü değilmiş gibi, daha derinlerde dev yengeçler var! Bir tanesi tam yanımdan geçti ve Lee'yi oldukça kötü yaraladı, biz de onu öldürdük. Thomas bunun benim suçum olmadığını söylüyor, ama biliyorum ki sadece bana iyilik yapmaya çalışıyor.\n\nNeyse ki, çıkış yolunda biraz güneş otu merhemi olan bir maceracıya rastladık. Lee o merhem olmadan hayatta kalamayabilirdi.\n\nGitmeden önce maceracının bir güle baktığını gördüm, hediye olduğunu söyledi. Eğer birileri onları bu kadar önemsiyorsa neden burada hayatlarını riske atsınlar ki?\n\nTam olarak ben de bunu yapıyorum, değil mi? Bu işin üstesinden gelemeyeceğimi hissediyorum.
journal.document.sewers_guard.crabs.title=Dev Yengeçler!
journal.document.sewers_guard.dangerous.body=88. Sonbahar, 375\nSevgili Anne ve Baba,\n\nŞimdi maaşın neden bu kadar iyi olduğunu anlıyorum, kanalizasyonlar canavarlarla dolu! 'Haşereler' ve 'kanun kaçakları' devasa kana susamış fareler ve öfkeli gnoll sürüleri.\n\nNeyse ki ekibimin geri kalanı gerçekten ne yaptığını biliyor. Takım kaptanımız Thomas bu konuda uzman. Çok fazla yük olmamak için hızlıca öğrenmeye çalışıyorum.\n\nBu iş düşündüğümden çok daha tehlikeli. Şimdi bunları gönderemediğime sevindim, endişelenmenizi istemiyorum.\n\nKendime dikkat edeceğim,\n- Sonya
journal.document.sewers_guard.dangerous.title=Tehlikeli Bir Durum...
journal.document.sewers_guard.discover_hint=Bu metni belirli bir bölgede bulabilirsiniz, ancak önce bu kümedeki tüm önceki metinleri bulmanız gerekir.
journal.document.sewers_guard.guild.body=23 Kış, 376\nSevgili Anne ve Baba,\n\nBu sefer yeni canavarlar yoktu, bunun yerine devriye gezerken hırsızlar loncasından küçük bir grupla karşılaştık.\n\nLonca hakkında duyduğum her şey kötüydü, ama ekibimin geri kalanı onlarla neredeyse arkadaş gibiydi. Thomas, yollarımız ayrılmadan önce onlardan biriyle bilgi ve malzeme alışverişinde bulundu.\n\nAnlamıyorum, kanun kaçaklarından kurtulmamız gerekmiyor muydu? Thomas, bunu komutanlara söylemememizi bile söyledi. Ancak onların bilgileri ve malzemeleri çok faydalıydı ve daha fazla kavgaya katlanamazdık.\n\nSanırım burada hepimiz aynı gemideyiz.
journal.document.sewers_guard.guild.title=Hırsızlar Loncası
journal.document.sewers_guard.lost.body=Kışın 40. günü, 376\n\nThomas ve ben kaybolduk. Bazı gnoll'larla savaşırken ekibin geri kalanından uzaklaştık. İkimiz de yaralanmadık, ancak alt kanalizasyonlar bir labirent gibi.\n\nThomas bir çıkış yolu bildiğini söylüyor, ancak bu yol kanalizasyonların dibindeki eski hapishane girişinden başlıyor. Daha derine inmeyi gerçekten sevmiyorum, ama erzakımız yok ve aşağı inmek, devriye rotamızı aramak için etrafta dolaşmaktan çok daha hızlı.\n\nHer şey yoluna girecek. Thomas ne yaptığını biliyor.
journal.document.sewers_guard.lost.title=Kaybolduk
journal.document.sewers_guard.new_position.body=85. Sonbahar, 375\nSevgili Anne ve Baba,\n\nŞehir muhafızlığındaki tüm sıkı çalışmanın karşılığını vereceğini söylemiştim. Az önce terfi aldım!\n\nKanalizasyonlarda çalışan uzman bir ekibe katılmaya davet edildim. Görünüşe göre orada haşere ve kanun kaçaklarıyla ilgili sorunlar var ve bunları temizlemek bizim işimiz. Kirli bir iş, ama kanalizasyonlar kışın sıcak ve normal muhafız görevinden üç kat daha fazla para kazandırıyor!\n\nAncak her şey biraz gizli, bu yüzden bu mektubu gönderemiyorum. Size yazmamak garip geliyor, bu yüzden yine de yazmaya devam edeceğim. Belki bir gün size gösterebilirim.\n\nSevgilerimle,\n- Sonya
journal.document.sewers_guard.new_position.title=Yeni Görevim!
journal.document.sewers_guard.not_worth.body=Thomas ve ben hapishane girişinde devasa bir balçık canavarıyla karşılaştık. Tepki veremeden bize sihirle saldırdı. Thomas bunun çoğunu aldı. O gitti. Hiçbir para buna değmez. Thomas'ın bana söylediği yoldan gideceğim. Sonra gardiyan olarak kazandığım parayı kullanarak ailemi ve kendimi bu lanetli şehirden uzaklaştıracağım. Bir yanım Kral'ın tüm bunlar için bir planı olduğunu umuyor ama şüpheliyim. Bu mektupları diğerlerini uyarmak için bırakıyorum. Burada sadece dev fareler ve yengeçler yok, burada çok yanlış bir şeyler oluyor.
journal.document.sewers_guard.not_worth.title=Buna değmez
journal.document.sewers_guard.title=Muhafızın Mektupları
