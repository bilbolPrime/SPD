journal.document.adventurers_guide.alchemy.body=Jika Anda tidak menemukan barang habis pakai yang berguna, Anda dapat menggunakannya sebagai bahan alkimia atau mengubahnya menjadi energi alkimia serbaguna. Ramuan dan gulungan penambah energi juga mengidentifikasinya!\n\nPerhiasan adalah jenis peralatan unik yang dibuat dan ditingkatkan menggunakan alkimia. Perhiasan dibuat dengan katalis perhiasan magis dan sedikit energi alkimia.\n\n(Panci alkimia pertama berada di lantai 3 atau 4 ruang bawah tanah. Ada halaman buku resep alkimia di dekat panci-panci ini juga.)
journal.document.adventurers_guide.alchemy.title=Alkimia & Perhiasan
journal.document.adventurers_guide.dieing.body=Menjelajahi ruang bawah tanah itu berbahaya dan sebagian besar petualang pada akhirnya menemui ajalnya. Keberuntungan memang membantu, tetapi petualang terbaik menggunakan setiap trik kecil untuk meningkatkan peluang mereka. (Jangan sedih jika Anda sering mati, permainan ini sulit! Fokuslah pada mempelajari permainan dan terus meningkatkan kemampuan, bukan pada kemenangan seketika.)
journal.document.adventurers_guide.dieing.title=Menangani Kekalahan
journal.document.adventurers_guide.examining.body=Penting untuk mempelajari musuh dan lingkungan sekitar Anda daripada menyerbu secara membabi buta! Biasakan untuk memeriksa setiap hal baru. (Anda dapat memeriksa dengan menggunakan tombol kaca pembesar lalu memilih apa yang ingin Anda periksa. Anda juga dapat memeriksa buff atau debuff dengan memilih ikonnya.)
journal.document.adventurers_guide.examining.title=Memeriksa
journal.document.adventurers_guide.food.body=Mengatur porsi makanan secara efektif adalah salah satu cara terbaik untuk meningkatkan peluang bertahan hidup, Anda tidak selalu perlu makan saat lapar! Saat Anda tidak kelaparan, kesehatan Anda akan pulih perlahan, jadi jika Anda makan saat kesehatan Anda penuh, pemulihan itu akan sia-sia! Jika Anda mengatur waktu makan berdasarkan kesehatan Anda, makanan Anda akan bertahan lebih lama.
journal.document.adventurers_guide.food.title=Mengatasi Kelaparan
journal.document.adventurers_guide.identifying.body=Warna ramuan dan simbol pada gulungan berbeda di setiap ruang bawah tanah. Peralatan yang belum teridentifikasi dapat ditingkatkan atau disihir jika Anda beruntung, atau mungkin terkutuk! Gulungan untuk mengidentifikasi, meningkatkan, atau menghilangkan kutukan sangat berguna jika Anda ingin mengurangi risiko menggunakan peralatan yang belum teridentifikasi. (Anda dapat menemukan daftar semua item yang telah Anda identifikasi di tab katalog jurnal Anda)
journal.document.adventurers_guide.identifying.title=Mengidentifikasi Barang
journal.document.adventurers_guide.intro.body=Salam Petualang, Anda sedang membaca Kitab Penguasaan Ruang Bawah Tanah! Buku panduan ini paling baik digunakan sebagai referensi, dan secara ajaib akan memberi tahu Anda kapan waktu terbaik untuk membaca setiap halaman.\n\n (Saat tombol jurnal berkedip, pilih untuk membaca apa yang ada di buku panduan ini! Beberapa halaman hilang, mungkin Anda dapat menemukannya di ruang bawah tanah?)
journal.document.adventurers_guide.intro.title=Perkenalan
journal.document.adventurers_guide.levelling.body=Menaikkan level akan meningkatkan statistik dan memberikan poin bakat, yang dapat membuat perbedaan besar dalam pertempuran. Sebaiknya Anda memiliki setidaknya satu level untuk setiap lantai ruang bawah tanah. Mungkin Anda tergoda untuk terburu-buru dan menghindari eksplorasi atau pertempuran, tetapi melakukan hal itu akan mengurangi persediaan dan pengalaman Anda. (Anda dapat melihat informasi tentang pahlawan Anda, termasuk pengalaman, di panel status di sudut antarmuka game. Pilih potret pahlawan Anda untuk mendapatkan informasi lebih lanjut.)
journal.document.adventurers_guide.levelling.title=Memperoleh Pengalaman
journal.document.adventurers_guide.looting.body=Ruangan yang terkunci atau berisi rintangan biasanya memiliki jarahan yang lebih baik. Ketika rintangan menghalangi jalan Anda, Anda biasanya dapat menemukan item yang membantu di lantai yang sama. Anda akan selalu dapat menemukan 2 ramuan kekuatan dan 3 gulungan peningkatan di setiap wilayah penjara bawah tanah lima lantai, jadi itu merupakan indikator yang bagus tentang seberapa baik Anda menjelajah. (Anda dapat melihat daftar landmark dan kunci yang tidak digunakan di tab catatan jendela jurnal.)
journal.document.adventurers_guide.looting.title=Penjarahan yang Efektif
journal.document.adventurers_guide.magic.body=Serangan sihir dapat menembus baju besi dan sulit dihindari. Ini berarti kerusakan dari tongkat sihir sangat andal, tetapi juga membuat musuh sihir sangat berbahaya! Namun, serangan sihir selalu memiliki kelemahan. Tongkat sihir memiliki jumlah penggunaan terbatas dan musuh sihir biasanya tidak akan dapat menggunakan sihir mereka dalam jarak dekat. Saat menghadapi musuh yang menggunakan sihir, penting untuk mempelajari cara mencegah mereka menggunakannya terhadap Anda.
journal.document.adventurers_guide.magic.title=Serangan Sihir
journal.document.adventurers_guide.positioning.body=Strategi sama pentingnya dengan peralatan. Situasi buruk seperti dikepung biasanya dapat dihindari dengan posisi yang baik. Misalnya, sebagian besar ruang bawah tanah memiliki koridor sempit yang memaksa musuh untuk melawan Anda satu per satu. Koridor ini seringkali juga memiliki pintu untuk serangan mendadak! Ada banyak cara kecil untuk menggunakan fitur lingkungan seperti rumput, air, lubang, atau jebakan untuk keuntungan Anda.
journal.document.adventurers_guide.positioning.title=Penempatan
journal.document.adventurers_guide.searching.body=Ruang bawah tanah penuh dengan pintu rahasia dan jebakan yang tampak tak terlihat pada pandangan pertama. Anda dapat meluangkan waktu dan mencari dengan cermat jika Anda mencurigai ada pintu atau jebakan tersembunyi di dekatnya. (Anda dapat mencari di semua ubin di sekitar Anda dengan menggunakan tombol kaca pembesar dua kali. Mungkin ada beberapa pintu tersembunyi di dekat tempat Anda menemukan halaman ini!)
journal.document.adventurers_guide.searching.title=Mencari
journal.document.adventurers_guide.strength.body=Tidak ada waktu untuk berlatih dengan senjata dan baju besi yang Anda temukan di ruang bawah tanah, jadi Anda membutuhkan kekuatan fisik untuk menggunakannya secara efektif. Ramuan kekuatan dan gulungan peningkatan adalah cara paling efektif untuk memenuhi persyaratan kekuatan perlengkapan tingkat tinggi. Penting untuk akhirnya mulai menggunakan item tingkat tinggi, tetapi jangan abaikan peralatan yang dapat Anda gunakan sekarang.
journal.document.adventurers_guide.strength.title=Kekuatan
journal.document.adventurers_guide.surprise_attacks.body=Serangan mendadak dijamin mengenai sasaran, sehingga sangat berguna melawan musuh yang sulit ditangkap seperti ular dan hantu. Anda dapat mengejutkan musuh tepat setelah mereka memasuki ambang pintu saat mengejar Anda, atau ketika mereka kehilangan jejak Anda.
journal.document.adventurers_guide.surprise_attacks.title=Serangan Mendadak
journal.document.adventurers_guide.title=buku penguasaan ruang bawah tanah
journal.document.adventurers_guide.upgrades.body=Semakin dalam Anda memasuki ruang bawah tanah, semakin penting untuk menggunakan perlengkapan tingkat tinggi yang ditingkatkan secara magis, tetapi Anda juga membutuhkan kekuatan untuk menggunakannya dengan benar. Tongkat sihir, cincin, dan artefak tidak membutuhkan kekuatan, tetapi memiliki penggunaan terbatas atau tidak membantu secara langsung dalam pertempuran. Membuat pilihan yang tepat tentang apa yang Anda tingkatkan sangat penting untuk bertahan hidup di awal ruang bawah tanah, dan untuk mempersiapkan diri Anda agar sukses di kemudian hari di ruang bawah tanah.
journal.document.adventurers_guide.upgrades.title=Peningkatan
journal.document.alchemy_guide.bombs.body=Bom bubuk hitam standar dapat dicampur dengan barang tertentu untuk menciptakan bom yang lebih ampuh.
journal.document.alchemy_guide.bombs.title=Bom yang Ditingkatkan
journal.document.alchemy_guide.brews_elixirs.body=Ramuan dan eliksir adalah ramuan tingkat lanjut dengan berbagai efek, biasanya hanya untuk sekali pakai.
journal.document.alchemy_guide.brews_elixirs.title=minuman dan ramuan
journal.document.alchemy_guide.energy_food.body=Banyak resep membutuhkan energi alkimia kristal, yang dibuat dengan menguraikan barang-barang habis pakai di dalam panci alkimia. Ramuan atau gulungan pemberi energi juga mengidentifikasinya. Beberapa resep yang membutuhkan energi bersifat magis, tetapi resep-resep ini menyerupai masakan tradisional.
journal.document.alchemy_guide.energy_food.title=Energi dan Makanan
journal.document.alchemy_guide.exotic_potions.body=Ramuan dapat dicampur dengan energi untuk menciptakan ramuan eksotis. Ramuan ini memiliki efek yang lebih kuat, tetapi seringkali berguna dengan cara yang berbeda.
journal.document.alchemy_guide.exotic_potions.title=ramuan eksotis
journal.document.alchemy_guide.exotic_scrolls.body=Gulungan eksotis dapat dibuat dengan sejumlah energi dan sebuah gulungan. Gulungan ini sedikit lebih kuat dan lebih mahal daripada ramuan eksotis.
journal.document.alchemy_guide.exotic_scrolls.title=gulungan eksotis
journal.document.alchemy_guide.potions.body=Selamat datang di Aplikasi Praktis Alkimia! Buku ini adalah referensi resep untuk membuat barang di dalam panci alkimia.\n\nKita akan mulai dengan resep yang paling ikonik: Ramuan!\n\nGunakan tiga biji untuk membuat ramuan acak! Setiap biji memiliki ramuan yang sesuai, gunakan beberapa biji yang sama untuk meningkatkan peluang ramuan tersebut sesuai dengan biji yang Anda gunakan.
journal.document.alchemy_guide.potions.title=Pendahuluan dan Ramuan
journal.document.alchemy_guide.spells.body=Mantra terkandung dalam kristal dan memberikan berbagai efek, biasanya dengan banyak kegunaan.
journal.document.alchemy_guide.spells.title=mantra
journal.document.alchemy_guide.stones.body=Mencampurkan gulungan ke dalam panci alkimia akan menanamkan sihirnya ke dalam dua batu di dalam panci tersebut. Ini akan menciptakan batu rune dan mengidentifikasi gulungan tersebut!
journal.document.alchemy_guide.stones.title=Membuat Batu Rune
journal.document.alchemy_guide.title=Panduan Alkimia
journal.document.alchemy_guide.weapons.body=Beberapa senjata yang lebih ringan atau lebih magis dapat digunakan dalam alkimia! Setiap set senjata lempar menghasilkan cukup logam cair untuk memperbaiki sepenuhnya set lain dengan level dan tingkatan yang sama. Perhatikan bahwa mealkimia satu set akan menghancurkan seluruh set, bahkan jika tidak semuanya ada! Satu tongkat sihir akan menghasilkan cukup resin gaib untuk meningkatkan dua tongkat sihir dengan level yang sama, tetapi tidak lebih tinggi dari +3.
journal.document.alchemy_guide.weapons.title=Meningkatkan Senjata
journal.document.caves_explorer.alive.body=23 Musim Panas, 308\n\nSalah satu mesin kurcaci entah bagaimana hidup! Kami hanya lewat ketika mesin itu menyerang dan hampir menghancurkan dua anggota kelompok kami dengan tinju logamnya yang besar. Untungnya, saya membawa tongkat penghancur saya. Beberapa tembakan tepat sasaran dari tongkat itu dan makhluk buas itu hancur menjadi besi tua.\n\nYang membuat saya khawatir adalah kami sama sekali tidak melakukan apa pun untuk memprovokasi mesin itu. Para kurcaci tidak mungkin merancang mesin-mesin itu agar begitu agresif, seolah-olah mesin itu mencoba menyergap kami!\n\nSetidaknya saya bisa menawarkan bantuan kepada teman-teman saya untuk sekali ini.\n- Archibald
journal.document.caves_explorer.alive.title=Ini Hidup!
journal.document.caves_explorer.city.body=21 Musim Panas, 308\n\nKita sekarang sudah memasuki minggu ketiga, dan setelah menghabiskan sebagian besar dari sepuluh hari terakhir untuk menjelajahi lebih dalam, akhirnya kita sampai di dasar tambang. Kami menemukan berbagai alat logam dan sebuah gerbang besar yang menghalangi masuk ke kota tua kurcaci.\n\nPandai besi memperingatkan kami tentang beberapa mesin ini. Rupanya mesin ini dimaksudkan untuk pertahanan wilayah dan cenderung aktif ketika diganggu. Kami tidak punya urusan di kota itu, dan logamnya hanya memiliki nilai besi tua yang minimal, jadi kami pikir lebih baik untuk mengindahkan peringatannya dan kembali keluar.\n\nHarus kuakui aku penasaran, tetapi menyelidiki di sana jelas tidak sepadan dengan risikonya.\n- Archibald
journal.document.caves_explorer.city.title=Pintu Masuk Kota
journal.document.caves_explorer.discover_hint=Anda dapat menemukan teks ini di wilayah tertentu, tetapi hanya setelah menemukan semua teks sebelumnya dalam kumpulan ini.
journal.document.caves_explorer.expedition.body=1 Musim Panas, 308\n\nHari ini dimulailah ekspedisi empat minggu kita ke tambang kurcaci yang terbengkalai! Saya telah ditugaskan oleh raja sendiri untuk menjelajahi wilayah ini. Tujuan utama saya adalah untuk menemukan sumber daya alam yang belum dimanfaatkan dan untuk mensurvei gua-gua untuk proyek pembangunan penjara potensial.\n\nMeskipun saya mampu membela diri, saya telah menerima pengawal dari penjaga kota atas desakan raja. Mereka sekelompok orang bodoh, tetapi selama mereka tidak memperlambat saya, kehadiran mereka dapat ditoleransi.\n\nKita diharapkan untuk membersihkan saluran pembuangan dan mencapai tambang pada malam hari.\n- Archibald Drummond. Archmage, institut sihir selatan.
journal.document.caves_explorer.expedition.title=Ekspedisi Dimulai!
journal.document.caves_explorer.gold.body=4 Musim Panas, 308\n\nBeberapa hari pertama kami sungguh sangat bermanfaat! Setelah mendirikan perkemahan, kami mulai menjelajahi beberapa area atas tambang yang ditinggalkan. Meskipun ada banyak barang rongsokan yang tidak berguna yang ditinggalkan oleh para kurcaci, banyak dinding gua juga dipenuhi emas!\n\nSayangnya, kami bukan yang pertama di sini. Gua-gua itu penuh dengan satwa liar yang agresif, dan tampaknya kawanan gnoll juga tertarik pada emas tersebut. Saya akui bahwa saya tidak adil terhadap pengawal saya, mereka jauh lebih cakap sebagai penjelajah dan pengawal daripada yang saya duga.\n\nMeskipun sukses, masih banyak tambang yang belum kami jelajahi.\n- Archibald
journal.document.caves_explorer.gold.title=Emasnya sangat banyak!
journal.document.caves_explorer.report.body=28 Musim Panas, 308\n\nHari ini kita akan menyelesaikan pengepakan barang-barang kita dan bersiap untuk pergi. Tepat pada waktunya juga, beberapa anggota kelompok kita mulai mengalami mimpi buruk yang mengerikan setelah insiden dengan mesin agresif itu. Mungkin hanya kelelahan, tetapi mimpi buruk mereka semua sangat mirip.\n\nSingkatnya, area atas tambang cukup aman. Jika emas hitam dapat dimanfaatkan, maka penambangannya mungkin akan sangat menguntungkan. Ruang terbuka yang luas juga akan sangat cocok untuk rencana pembangunan kota. Namun, tambang bagian bawah lebih berbahaya dan harus dihindari.\n\nSaya akan menulis semua ini ke dalam laporan akhir saya dalam beberapa hari ke depan.\n- Archibald
journal.document.caves_explorer.report.title=Laporan akhir
journal.document.caves_explorer.title=Catatan Penjelajah
journal.document.caves_explorer.troll.body=11 Musim Panas, 308\n\nSetelah memulai penjelajahan kami ke bagian tengah tambang, kami bertemu dengan wajah yang ramah! Yah... relatif ramah. Seorang troll gua telah mendirikan bengkel pandai besi kecil di sana. Dia kasar dan tidak banyak bicara, tetapi memperbaiki peralatan kami dengan imbalan sejumlah emas.\n\nSayangnya, pandai besi troll itu juga memberi tahu kami bahwa semua emas yang indah ini tidak sebagus kelihatannya. Dia menyebutnya 'emas gelap' dan tampaknya cepat rusak di bawah sinar matahari. Itu tentu akan menjelaskan mengapa tidak pernah ada konflik atas sumber daya di sini.\n\nKurasa kita perlu menggali lebih dalam untuk melihat apakah ada sesuatu yang lebih berharga.\n- Archibald
journal.document.caves_explorer.troll.title=Bertemu dengan Troll
journal.document.city_warlock.discover_hint=Anda dapat menemukan teks ini di wilayah tertentu, tetapi hanya setelah menemukan semua teks sebelumnya dalam kumpulan ini.
journal.document.city_warlock.failure.body=Sepertinya aku juga bodoh. Aku mengira Raja Baru membutuhkan istana untuk tunduk padanya dengan sukarela, tetapi sekarang aku melihat bahwa dia memiliki kekuatan untuk mengendalikan bahkan mereka yang menentangnya. Aku secara membabi buta membawa semua oposisi terkuat tepat ke depan pintunya agar dia dapat secara pribadi mengubah mereka menjadi budaknya. Sekarang gelombang energi nekrotiknya menyapu kota, seketika mengubah sebagian besar menjadi pemohonnya. Beberapa orang yang masih memiliki kehendak bebas melarikan diri. Aku memilih untuk tinggal di belakang untuk mengamati sebaik mungkin dan mencari celah. Dengan kekuatan sihir yang kumiliki, aku seharusnya bisa tetap bersembunyi dan aman untuk beberapa waktu.
journal.document.city_warlock.failure.title=Kegagalan
journal.document.city_warlock.more_powerful.body=Mencatat waktu menjadi sulit, tetapi sudah sekitar seminggu sejak entri terakhir saya. Peradaban kita benar-benar telah runtuh. Gerbang tertutup, semua fungsi masyarakat kita telah berhenti, dan mayat-mayat kurcaci yang kosong berkeliaran di lorong-lorong. Di tengah semua ini, entah bagaimana, Raja Baru menjadi semakin kuat. Setiap hari kekuatan tekadnya semakin kuat, tetapi juga berubah. Saya tidak dapat menggambarkannya, tetapi rasanya seolah-olah dia bukan lagi seorang kurcaci sama sekali. Saya mulai menerima bahwa yang terbaik yang mungkin dapat saya lakukan adalah mendokumentasikan peristiwa-peristiwa ini. Saya akan tinggal di sini selama saya mampu, dan kemudian mundur setelah tekad saya mulai melemah.
journal.document.city_warlock.more_powerful.title=Lebih Bertenaga
journal.document.city_warlock.new_power.body=Apa yang terjadi di sini? Kekuatan yang terpancar dari Raja Baru memang berbeda dari sebelumnya, tetapi ada sesuatu yang lain juga. Kekuatan baru ini tampaknya memancar dari aula terdalam kota kita. Yang lebih membingungkan adalah aktivitas di metropolis bagian atas juga menurun. Aku tidak tahu apa yang terjadi di bawah sana, tetapi itu menarik hampir seluruh perhatian Raja Baru. Kembali ke aula terdalam akan berbahaya, tetapi aku harus menemukan apa yang menyebabkan perubahan ini. Mungkin Raja Baru memang memiliki kelemahan?
journal.document.city_warlock.new_power.title=Kekuatan Baru
journal.document.city_warlock.old_king.body=Ini adalah hari ke-5 bulan ke-2 tahun ke-33 zaman sihir. Jika seorang penduduk dunia atas membaca ini, ini adalah sekitar Musim Dingin 264. Namaku Thymor Zahir, dan sepengetahuanku, aku adalah anggota terakhir yang masih hidup dari istana kurcaci. Raja kita telah meninggal, digantikan oleh salah satu mantan kolegaku yang telah gila kekuasaan. Anggota istana lainnya tunduk kepadanya, seperti orang bodoh, dan kehilangan kehendak bebas mereka dalam prosesnya. Hanya aku yang melihat ini akan terjadi dan melarikan diri sebelum ritualnya selesai. Lingkaran dalam telah jatuh, tetapi kekuatan Raja Baru belum mencapai semua orang. Aku harus melakukan perlawanan secepat mungkin. Aku menolak membiarkan peradaban kita yang mulia jatuh ke tangan megalomaniak ini!
journal.document.city_warlock.old_king.title=Sang Raja Telah Meninggal
journal.document.city_warlock.resistance.body=Kabar tampaknya telah menyebar dengan cepat. Baru beberapa hari berlalu dan aku telah mengumpulkan pasukan kecil loyalis Raja Tua. Hanya sedikit yang mahir dalam sihir, tetapi hampir seluruh ordo biarawan prajurit ada di antara kita. Kita seharusnya lebih dari cukup untuk menghadapi seorang kurcaci gila dan para budaknya. Sementara itu, Raja Baru telah bersembunyi di ruang dalam kota kita. Tidak diragukan lagi dia telah menghabiskan sebagian besar kekuatannya dan berharap untuk pulih sebelum menghadapi perlawanan lebih lanjut. Kita akan melancarkan serangan kita dalam beberapa jam lagi. Dengan sedikit keberuntungan, kita akan dapat membentuk dewan sementara dan mengembalikan kota kita yang menakjubkan ini ke keadaan stabil pada akhir malam.
journal.document.city_warlock.resistance.title=Perlawanan
journal.document.city_warlock.seen_it.body=Aku telah melihat apa yang ada di bawah sana, tetapi aku tidak dapat menggambarkannya. Tanganku gemetar tak terkendali saat aku mencoba menuangkan pikiranku ke dalam tulisan. Mengapa ini terjadi? Apakah Raja Baru yang melakukan ini? Ini tidak masuk akal. Mungkin penggunaan kekuasaannya yang sembrono telah menariknya? Aku berharap dapat menyelamatkan peradaban kita, tetapi sekarang aku melihat bahwa seluruh dunia berada dalam bahaya. Entah bagaimana, raja adalah kejahatan yang lebih kecil. Aku tidak punya pilihan lain, demi kebaikan yang lebih besar aku akan menyerahkan diriku. Tolong bimbing aku, rajaku, gunakan aku sebagai alat untuk menahan Yog-Dzewa!
journal.document.city_warlock.seen_it.title=Aku sudah melihatnya
journal.document.city_warlock.title=Jurnal Penyihir
journal.document.halls_king.amulet.body=AKU BERHASIL!\n\nAku tidak tahu persis apa yang akan kutemukan, tetapi apa yang kutemukan di luar sana melampaui spekulasi terliarku. Begitu banyak kekuatan, hanya duduk di sana siap untuk diambil, dan semuanya milikku!\n\nDengan ini, tak satu pun dari orang-orang bodoh di pengadilan akan berani menentangku. Aku hanya merasa senang memikirkan semua cara berbeda yang bisa kugunakan untuk mempermalukan mereka. Sial, kenapa berhenti di situ, aku punya cukup kekuatan untuk menghancurkan setiap orang dari mereka jika aku mau! Itu mungkin berlebihan, tetapi aku tidak boleh terlalu lama memutuskan atau mereka akan curiga.\n\nKurasa aku akan menyebut kekuatan besar ini sebagai Jimat Yendor!\n- R.
journal.document.halls_king.amulet.title=Jimat
journal.document.halls_king.attrition.body=Aku punya rencana untuk menghadapi makhluk itu. Kekuatannya tak terbatas, tetapi kemampuannya untuk menguasai dunia ini terbatas. Ia mengandalkan antek-antek dan avatar untuk menjalankan perintahnya sementara ia mencoba membangun kekuatan yang cukup untuk merebut jimat itu. Meskipun aku tidak memiliki jimat itu secara fisik, aku masih memiliki kendali penuh atas kekuatannya. Dengan seluruh kota kurcaci berada di bawah kendaliku, aku juga memiliki keunggulan jumlah. Aku bisa terus mengirim tentara untuk mencegahnya merebut jimat itu dan secara bertahap memenangkan perang ini melalui perang gesekan! Aku, Rodney, Raja Kurcaci, akan bertahan lebih lama darimu, Yog-Dzewa!
journal.document.halls_king.attrition.title=Erosi
journal.document.halls_king.discover_hint=Anda dapat menemukan teks ini di wilayah tertentu, tetapi hanya setelah menemukan semua teks sebelumnya dalam kumpulan ini.
journal.document.halls_king.new_king.body=AKU RAJA, AHAHAHAHAAA!\n\nMereka membiarkanku melakukannya! Tanpa perlu banyak bujukan, mereka setuju untuk membiarkanku 'berbagi' kekuatan ini dengan mereka dalam sebuah ritual besar. Dalam sekejap mereka berubah dari paduan suara yang mengejek menjadi istana baruku yang terdiri dari para pengikut yang diam!\n\nSeperti yang bisa diduga, Thymor melarikan diri seperti pengecut pada tanda pertama masalah. Aku sudah bisa merasakan kekuatan perlawanan yang sedang ia bangun juga. Kurasa aku akan membiarkan dia melanjutkan, sehingga dia bisa mengirimkan semua konspiratornya langsung ke pintuku!\n\nJelas kerajaan juga tidak menghormatiku, kurasa aku akan memperbaikinya juga.\n- Raja Kurcaci
journal.document.halls_king.new_king.title=Raja Baru
journal.document.halls_king.rejection.body=DASAR BODOH!\n\nSelama 33 tahun terakhir, kerajaan kita telah berkembang pesat dengan teknologi sihir baru kita. Kita telah belajar bagaimana memanggil roh elemen dan membengkokkannya sesuai keinginan kita, tetapi entah bagaimana sekarang eksperimen lebih lanjut dianggap 'terlalu berbahaya'.\n\nAku tahu apa yang sebenarnya terjadi. Penolakan terhadap teori-teoriku tidak ada hubungannya dengan kebenarannya dan semuanya berkaitan dengan orang yang mengemukakannya. Mereka mungkin semua menertawakanku di belakangku.\n\nBaiklah, tidak lagi! Aku tidak peduli apa yang mereka katakan, aku akan menjelajahi ujung terjauh alam semesta kita sendirian, dan menyimpan semua yang kutemukan untuk diriku sendiri!\n- R.
journal.document.halls_king.rejection.title=Penolakan
journal.document.halls_king.ritual.body=Thymor secara terbuka menantangku tadi pagi dan bersikeras agar aku menjelaskan sumber kekuatan baruku. Aku berusaha menepisnya sebisa mungkin, tetapi aku bisa merasakan tatapan menghakimi dari anggota istana lainnya kembali tertuju padaku. Aku berharap bisa menikmati ketenangan sebelum badai datang, tetapi itu tidak masalah. Aku sudah memutuskan apa yang ingin kulakukan. Aku akan mengaku mendapatkan kekuatanku melalui ritual baru, dan akan menawarkan untuk melakukannya pada para penyihir lain dan Raja. Setelah ritual selesai, aku akan menjadi raja! Thymor tentu akan protes, tetapi dengan kekuatan sebesar ini yang ditawarkan, aku ragu mereka akan mendengarkannya! Semua akan tunduk di hadapanku! - Calon Raja Kurcaci
journal.document.halls_king.ritual.title=Ritual
journal.document.halls_king.thing.body=Ada masalah. Thymor dikalahkan tanpa kesulitan, tetapi tampaknya pencarianku di alam luar tidak luput dari perhatian. \n\nSesuatu... 'makhluk'... telah tertarik ke duniaku dan mulai memaksa masuk melalui bagian bawah aula bawah. Untuk memperumit keadaan, itu adalah lokasi tepat di mana aku menyimpan jimat itu! Makhluk yang begitu jahat, mengapa ia harus mencoba menolak kekuatanku padahal masih banyak yang bisa kuambil di luar sana? \n\nMeskipun aku memiliki kekuatan, aku rasa aku tidak bisa begitu saja menyerbu dan melawannya. Kekuatan sebenarnya tak terukur, tetapi pasti ada cara untuk membatasinya. AKU AKAN MEMBELA HADIAHKU!
journal.document.halls_king.thing.title=Hal itu
journal.document.halls_king.title=Jurnal ???
journal.document.intros.caves.body=Gua-gua yang jarang dihuni ini membentang di bawah penjara yang terbengkalai. Kaya akan mineral, gua-gua ini dulunya merupakan pusat perdagangan dan industri yang ramai bagi masyarakat kurcaci di bawahnya, tetapi ditinggalkan karena para kurcaci terobsesi dengan sihir gelap. Gua-gua tersebut sekarang sebagian besar dihuni oleh satwa liar bawah tanah, gnoll, dan mesin-mesin usang; kemungkinan besar telah dirusak oleh kekuatan yang sama yang telah memengaruhi wilayah di atasnya.
journal.document.intros.caves.title=Gua
journal.document.intros.city.body=Kota Metropolis Kurcaci dulunya adalah kota-negara kurcaci terbesar di antara semua kota-negara kurcaci. Pada masa kejayaannya, para kurcaci membangun mesin-mesin menakjubkan dari logam dan sihir yang memungkinkan kota mereka berkembang pesat. Kemudian, suatu hari, gerbang kota ditutup dan tidak ada yang mendengar kabar dari para kurcaci lagi. Beberapa orang yang berhasil melarikan diri dari kota saat ditutup menceritakan kisah tentang seorang penyihir gila yang mencuri takhta, dan sihir mengerikan yang telah dipelajarinya.
journal.document.intros.city.title=Metropolis Kurcaci
journal.document.intros.discover_hint=Anda dapat menemukan teks ini saat memasuki wilayah tertentu untuk pertama kalinya.
journal.document.intros.dungeon.body=Banyak pahlawan telah menjelajahi ruang bawah tanah sebelummu dari kota di atas, sebagian besar tidak pernah terdengar kabarnya lagi.\n\nKonon, kejahatan kuno bersembunyi di kedalaman, menjaga Jimat Yendor yang maha kuasa. Bahkan sekarang energi gelap memancar dari bawah, merambat naik ke kota.\n\nAkankah kau menaklukkan ruang bawah tanah dan merebut jimat itu? Saatnya memulai petualanganmu sendiri!
journal.document.intros.dungeon.title=Penjara bawah tanah
journal.document.intros.halls.body=Lorong-lorong dalam Metropolis Kurcaci ini telah dirusak oleh sihir gelap. Di masa lalu, wilayah ini menjadi tempat kediaman para penyihir elit istana Raja Kurcaci, tetapi sekarang tampaknya telah dikuasai oleh sesuatu yang lebih jahat... Berbagai macam makhluk iblis yang mengerikan menghuni lorong-lorong ini, dipimpin oleh kekuatan gelap yang mengerikan. Jika Raja Kurcaci bukanlah sumber dari korupsi yang menyebar, apa pun yang ada di bawah sini pastilah penyebabnya. Berhati-hatilah, sangat sedikit petualang yang pernah turun sejauh ini...
journal.document.intros.halls.discover_hint=Anda dapat menemukan teks ini di wilayah tertentu, tetapi hanya setelah menemukan semua teks sebelumnya dalam kumpulan ini.
journal.document.intros.halls.title=Aula Iblis
journal.document.intros.prison.body=Bertahun-tahun yang lalu, sebuah penjara dibangun di sini untuk menampung penjahat berbahaya. Dengan pengaturan yang ketat dan keamanan yang tinggi, narapidana dari seluruh negeri dibawa ke sini untuk menjalani hukuman. Namun tak lama kemudian, kabut gelap mulai merayap dari bawah, mengacaukan pikiran para penjaga dan tahanan. Sebagai respons terhadap kekacauan yang semakin meningkat, kota menutup seluruh penjara. Tidak ada yang tahu apa yang terjadi pada mereka yang dibiarkan mati di dalam tembok-tembok ini...
journal.document.intros.prison.title=Penjara
journal.document.intros.sewers.body=Lantai atas penjara bawah tanah sebenarnya merupakan sistem saluran pembuangan kota.\n\nSeiring energi gelap merambat dari bawah, makhluk-makhluk selokan yang biasanya tidak berbahaya menjadi semakin ganas. Kota terpaksa mengirimkan patroli penjaga ke sini untuk mencoba menjaga keamanan bagi mereka yang berada di atas.\n\nTempat ini berbahaya, tetapi setidaknya sihir jahat yang bekerja di sini lemah.
journal.document.intros.sewers.title=Saluran pembuangan
journal.document.intros.title=Pengenalan Wilayah
journal.document.prison_warden.discover_hint=Anda dapat menemukan teks ini di wilayah tertentu, tetapi hanya setelah menemukan semua teks sebelumnya dalam kumpulan ini.
journal.document.prison_warden.journal.body=1 Musim Semi, 362\n\nIni adalah entri pertama dalam jurnal kerja sipir penjara Kiana Smith. Dengan semua yang terjadi akhir-akhir ini, saya memutuskan untuk memulai jurnal agar pikiran saya tetap teratur.\n\nMengelola penjara setengah mil di bawah tanah tidak akan pernah mudah, tetapi akhir-akhir ini tampaknya ada semacam gangguan terorganisir yang terjadi. Para narapidana bertindak di luar kendali tanpa alasan dan kemudian menolak untuk menjelaskan alasannya.\n\nBeberapa penjaga mulai mengatakan tempat ini berhantu. Saya tidak bisa membiarkan orang-orang saya sendiri menyebarkan rumor, tetapi saya tidak bisa menyalahkan mereka karena merasa tidak nyaman.\n- Smith
journal.document.prison_warden.journal.title=Menulis Jurnal
journal.document.prison_warden.letter.body=Thomas,\n\nKau sudah menjadi teman yang hebat, jadi aku akan membantumu.\n\nSaat kau mulai bertugas malam ini, kunci dan perkuat sel Tengu, lemparkan kuncinya ke ceruk, dan keluarlah. Tidak masalah jika tahanan lain tidak dijaga, sebentar lagi tidak akan ada yang bisa meninggalkan tempat ini. Tapi si aneh itu harus tetap diamankan, jika dia melarikan diri, tidak ada yang tahu apa yang akan dia lakukan.\n\nJangan beri tahu siapa pun tentang ini, dan jangan repot-repot mencariku. Seorang kapten harus tenggelam bersama kapalnya.\n- Kiana
journal.document.prison_warden.letter.title=Surat untuk Thomas
journal.document.prison_warden.mines.body=54 Musim Dingin, 363\n\nSekelompok insinyur dari kota datang hari ini, mengatakan bahwa mereka di sini untuk menutup pintu masuk lama ke tambang di bawah. Kurasa kota tidak mau repot lagi memelihara jalan itu. Aku tidak diberitahu sebelumnya, seperti biasa.\n\nKepala insinyur mereka juga mengatakan omong kosong tentang sihir kurcaci yang bocor dari tambang. Aku tidak percaya sepatah kata pun.\n\nSituasinya jauh lebih terkendali dengan staf baru kami, tetapi akar masalahnya masih belum teratasi. Sesuatu pasti memengaruhi para tahanan di sini, dan merobohkan beberapa dinding tidak akan mengubahnya.\n- Smith
journal.document.prison_warden.mines.title=Menutup Tambang
journal.document.prison_warden.no_support.body=11 Musim Semi, 364\n\nApa yang dipikirkan kota ini? Setelah meminta bantuan dengan mendesak, saya tidak mendapat tanggapan apa pun, bahkan permintaan maaf kosong seperti yang biasanya mereka kirimkan ketika permintaan saya ditolak.\n\nSementara itu, kondisi para narapidana terus memburuk, dan beberapa penjaga bahkan mulai membuat masalah. Apakah mereka berencana membiarkan ini terus memburuk sampai kita menghadapi kerusuhan!?\n\nSetidaknya Thomas tetap dapat diandalkan seperti biasanya. Bantuan organisasinya sangat berharga, dan idenya untuk mengaktifkan unit DM-100 lama itu memang disayangkan tetapi perlu. Saya yakin saya dapat mengatasi situasi ini, saya hanya butuh dukungan!\n-Smith
journal.document.prison_warden.no_support.title=Tidak Ada Dukungan
journal.document.prison_warden.recruits.body=80 Musim Semi, 362\n\nSeperti yang dijanjikan, sejumlah rekrutan baru tiba hari ini. Sepertinya seperti biasa, beberapa yang menjanjikan dan banyak yang hanya menginginkan bayaran. Namun, memiliki semua tenaga baru ini seharusnya sangat membantu menangani narapidana kita yang baru-baru ini sulit diatur.\n\nDalam pekerjaan seperti ini, penting untuk mengetahui siapa yang dapat Anda percayai. Salah satu rekrutan baru, Thomas, tampaknya sangat menjanjikan. Saya membutuhkan semua bantuan yang bisa saya dapatkan saat ini, jadi jika dia bekerja dengan baik, saya akan mempertimbangkan untuk mempromosikannya dengan cepat.\n- Smith
journal.document.prison_warden.recruits.title=Rekrutan Baru
journal.document.prison_warden.rotberry.body=23 Musim Gugur, 363\n\nMenerima hadiah yang indah dari Felix hari ini. Itu semacam semak merah terang yang disebut 'Rotberry'.\n\nAku sudah menyebutkan betapa suramnya tempat ini kepadanya sebelumnya, sepertinya dia mendengarkan. Menurutnya, tanaman ini sebenarnya tidak menyukai cahaya dan air, jadi aku hanya perlu memangkas daunnya sebulan sekali. Memangkasnya pasti penting, dia menyebutkannya belasan kali dalam suratnya.\n\nTentu saja, Felix tidak pernah melakukan apa pun secara cuma-cuma. Dia mengatakan bahwa biji yang dihasilkan tanaman ini bagus untuk membuat tongkat sihir, jadi tentu saja aku berhutang beberapa biji setiap kali tanaman itu menghasilkan biji.\n- Smith
journal.document.prison_warden.rotberry.title=Tanaman Rotberry
journal.document.prison_warden.title=Jurnal Sipir
journal.document.sewers_guard.crabs.body=11 Musim Dingin, 376\nKepada Ibu dan Ayah,\n\nSeolah-olah tikus-tikus itu belum cukup buruk, di bawah sana ada kepiting raksasa! Salah satunya menerobos melewati saya dan melukai Lee cukup parah sebelum kami membunuhnya. Thomas bilang itu bukan salahku, tapi aku tahu dia hanya mencoba bersikap baik padaku.\n\nUntungnya, dalam perjalanan keluar kami bertemu dengan seorang petualang yang memiliki beberapa salep rumput matahari cadangan. Lee mungkin tidak akan selamat tanpa barang itu.\n\nAku melihat petualang itu menatap mawar sebelum mereka pergi, mereka bilang itu hadiah. Mengapa mereka mempertaruhkan nyawa mereka di sini jika seseorang sangat peduli pada mereka?\n\nItulah yang sedang kulakukan, bukan? Aku merasa seperti berada di luar kemampuanku.
journal.document.sewers_guard.crabs.title=Kepiting Raksasa!
journal.document.sewers_guard.dangerous.body=88 Musim Gugur, 375\nKepada Ibu dan Ayah,\n\nSekarang aku mengerti mengapa gajinya sangat bagus, selokan dipenuhi monster! 'Hama' dan 'penjahat' itu adalah tikus raksasa haus darah dan kawanan gnoll yang marah.\n\nUntungnya anggota timku yang lain benar-benar tahu apa yang mereka lakukan. Kapten tim kami, Thomas, adalah ahli dalam hal ini. Aku mencoba belajar dengan cepat agar aku tidak terlalu menjadi beban.\n\nPekerjaan ini jauh lebih berbahaya daripada yang kukira. Aku senang aku tidak bisa mengirimkan ini sekarang, aku tidak ingin kalian khawatir.\n\nAku akan tetap aman,\n- Sonya
journal.document.sewers_guard.dangerous.title=Posisi yang Berbahaya...
journal.document.sewers_guard.discover_hint=Anda dapat menemukan teks ini di wilayah tertentu, tetapi hanya setelah menemukan semua teks sebelumnya dalam kumpulan ini.
journal.document.sewers_guard.guild.body=23 Musim Dingin, 376\nKepada Ibu dan Ayah,\n\nTidak ada monster baru kali ini, malah kami bertemu dengan sekelompok kecil dari perkumpulan pencuri saat berpatroli.\n\nSemua yang kudengar tentang perkumpulan itu buruk, tetapi anggota timku yang lain tampaknya hampir bersahabat dengan mereka. Thomas bertukar informasi dan persediaan dengan salah satu dari mereka sebelum kami berpisah.\n\nAku tidak mengerti, bukankah kita seharusnya menyingkirkan para penjahat? Thomas bahkan mengatakan untuk tidak menyebutkan ini kepada siapa pun yang berwenang. Namun, informasi dan persediaan mereka sangat berguna, dan kami tidak sanggup menghadapi pertempuran yang lebih banyak lagi.\n\nKurasa kita semua berada dalam situasi yang sama di sini.
journal.document.sewers_guard.guild.title=Persekutuan Pencuri
journal.document.sewers_guard.lost.body=Tanggal 40 Musim Dingin, 376\n\nThomas dan aku tersesat. Kami terpisah dari tim saat melawan beberapa gnoll. Kami berdua tidak terluka, tetapi saluran pembuangan bawah seperti labirin.\n\nThomas bilang dia tahu jalan keluar, tapi dimulai dari pintu masuk penjara lama di dasar saluran pembuangan. Aku benar-benar tidak suka masuk lebih dalam, tetapi kami tidak punya ransum dan turun jauh lebih cepat daripada berkeliaran mencari rute patroli kami.\n\nTidak apa-apa. Thomas tahu apa yang dia lakukan.
journal.document.sewers_guard.lost.title=Kita Tersesat
journal.document.sewers_guard.new_position.body=85 Musim Gugur, 375\nKepada Ibu dan Ayah,\n\nAku sudah bilang kalian semua kerja keras di pos penjagaan kota akan membuahkan hasil. Aku baru saja dipromosikan!\n\nAku diundang untuk bergabung dengan tim spesialis yang bekerja di saluran pembuangan. Rupanya ada masalah dengan hama dan penjahat di sana, dan tugas kita adalah membersihkannya. Pekerjaannya kotor, tetapi saluran pembuangan hangat di musim dingin dan gajinya tiga kali lipat dari tugas penjagaan biasa!\n\nSemuanya agak rahasia, jadi aku tidak bisa mengirim surat ini. Rasanya aneh tidak menulis surat kepada kalian, jadi aku akan tetap menulisnya. Mungkin suatu hari nanti aku bisa menunjukkannya kepada kalian.\n\nSalam,\n- Sonya
journal.document.sewers_guard.new_position.title=Posisi Baru Saya!
journal.document.sewers_guard.not_worth.body=Aku dan Thomas bertemu dengan semacam monster lendir raksasa di pintu masuk penjara. Sebelum kami sempat bereaksi, monster itu menghantam kami dengan sihir. Thomas menerima sebagian besar serangannya. Dia sudah tiada. Tidak ada uang yang sebanding dengan ini. Aku akan pergi melalui rute yang Thomas ceritakan padaku. Kemudian aku akan menggunakan penghasilanku sebagai penjaga untuk memindahkan orang tuaku dan aku dari kota terkutuk ini. Sebagian diriku berharap Raja punya rencana untuk semua ini, tapi aku ragu. Aku meninggalkan surat-surat ini sebagai peringatan bagi orang lain. Ini lebih dari sekadar tikus dan kepiting raksasa, ada sesuatu yang sangat salah di sini.
journal.document.sewers_guard.not_worth.title=Itu tidak sepadan.
journal.document.sewers_guard.title=Surat-surat Penjaga
