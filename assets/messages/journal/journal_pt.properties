journal.document.adventurers_guide.alchemy.body=Se não achar um item consumível útil, pode utilizá-lo como ingrediente alquímico ou transformá-lo em energia alquímica universal. Poções e pergaminhos energizantes também os identificam! \n\n Os amuletos são um tipo único de equipamento criado e melhorado através da alquimia. São feitos com um catalisador mágico para amuletos e um pouco de energia alquímica. \n\n (O primeiro caldeirão de alquimia está no 3º ou 4º andar da masmorra. Há páginas de livros de receitas de alquimia perto destes caldeirões também.)
journal.document.adventurers_guide.alchemy.title=Alquimia e Bugigangas
journal.document.adventurers_guide.dieing.body=Explorar masmorras é perigoso e a maioria dos aventureiros acaba por encontrar o seu fim. A sorte ajuda, mas os melhores aventureiros usam todos os truques possíveis para aumentar as suas hipóteses. (Não se frustre se estiver a morrer muito, este jogo é difícil! Concentre-se em aprender o jogo e melhorar constantemente, não em ganhar imediatamente.)
journal.document.adventurers_guide.dieing.title=Lidar com a derrota
journal.document.adventurers_guide.examining.body=É importante estudar os seus inimigos e o ambiente circundante em vez de atacar às cegas! Habitue-se a examinar tudo o que é novo. (Pode examinar utilizando o botão da lupa e selecionando o que pretende examinar. Também pode examinar melhorias ou penalizações selecionando os seus ícones.)
journal.document.adventurers_guide.examining.title=Examinando
journal.document.adventurers_guide.food.body=Racionar a comida de forma eficaz é uma das melhores formas de aumentar as suas hipóteses de sobrevivência. Não precisa de comer sempre que sentir fome! Quando não estiver a morrer de fome, a sua saúde regenerar-se-á lentamente; portanto, se comer quando tiver a saúde completa, esta regeneração será desperdiçada! Se controlar o ritmo das suas refeições com base na sua saúde, a sua alimentação durará muito mais tempo.
journal.document.adventurers_guide.food.title=Lidar com a fome
journal.document.adventurers_guide.identifying.body=As cores das poções e os símbolos nos pergaminhos são diferentes em cada masmorra. Os equipamentos não identificados podem ser melhorados ou encantados se tiver sorte, ou podem estar amaldiçoados! Os pergaminhos de identificação, melhoramento ou remoção de maldição são muito úteis se quiser reduzir o risco de utilizar equipamento não identificado. (Pode encontrar uma lista de todos os itens que identificou no separador Catálogo do seu diário)
journal.document.adventurers_guide.identifying.title=Identificação de artigos
journal.document.adventurers_guide.intro.body=Saudações, aventureiro! Está a ler o Tomo da Maestria em Masmorras! Este guia é melhor utilizado como referência e indicar-lhe-á magicamente o melhor momento para ler cada página. (Quando o botão do diário piscar, selecione-o para ler o conteúdo do guia! Faltam algumas páginas, mas talvez as encontre na masmorra.)
journal.document.adventurers_guide.intro.title=Introdução
journal.document.adventurers_guide.levelling.body=Subir de nível aumenta os seus atributos e concede pontos de talento, o que pode fazer uma grande diferença em combate. É melhor ter pelo menos um nível para cada piso da masmorra. Pode ser tentador apressar-se e evitar a exploração ou o combate, mas fazê-lo irá privá-lo de mantimentos e experiência. (Pode ver informações sobre o seu herói, incluindo a experiência, no painel de estado no canto da interface do jogo. Selecione o retrato do seu herói para obter ainda mais informações.)
journal.document.adventurers_guide.levelling.title=Adquirindo experiência
journal.document.adventurers_guide.looting.body=Salas atrás de portas trancadas ou que contenham obstáculos têm, geralmente, itens melhores. Quando um obstáculo bloqueia o teu caminho, podes normalmente encontrar um item útil no mesmo piso. Poderá sempre encontrar 2 poções de força e 3 pergaminhos de aperfeiçoamento em cada região de masmorra de cinco andares, pelo que são um grande indicador de quão bem está a explorar. (Pode ver uma lista de pontos de referência e chaves não utilizadas no separador de notas da janela do diário.)
journal.document.adventurers_guide.looting.title=Saque Eficaz
journal.document.adventurers_guide.magic.body=Os ataques mágicos atravessam armaduras e são difíceis de evitar. Isto significa que o dano das varinhas é muito fiável, mas também torna os inimigos mágicos muito perigosos! No entanto, os ataques mágicos têm sempre uma desvantagem. As varinhas têm cargas limitadas e os inimigos mágicos geralmente não conseguem usar a sua magia a curta distância. Ao enfrentar inimigos que usam magia, é importante aprender como impedi-los de a usar contra si.
journal.document.adventurers_guide.magic.title=Ataques Mágicos
journal.document.adventurers_guide.positioning.body=A estratégia é tão importante como o equipamento. Situações más, como estar cercado, podem geralmente ser evitadas com um bom posicionamento. Por exemplo, a maioria das masmorras tem corredores estreitos que obrigam os inimigos a lutar um de cada vez. Estes corredores geralmente também têm portas para ataques surpresa! Existem muitas formas de utilizar elementos do ambiente, como a relva, a água, os buracos ou as armadilhas, a seu favor.
journal.document.adventurers_guide.positioning.title=Posicionamento
journal.document.adventurers_guide.searching.body=As masmorras estão repletas de portas secretas e armadilhas que parecem invisíveis à primeira vista. Pode dedicar algum tempo e procurar cuidadosamente se suspeitar que alguma porta ou armadilha está escondida nas proximidades. (Pode examinar todos os quadrados à sua volta usando o botão da lupa duas vezes. Talvez haja algumas portas escondidas perto do local onde encontrou esta página!)
journal.document.adventurers_guide.searching.title=Pesquisando
journal.document.adventurers_guide.strength.body=Não há tempo para treinar com as armas e armaduras encontradas na masmorra, pelo que precisará de força bruta para as utilizar eficazmente. As poções de força e os pergaminhos de aperfeiçoamento são a forma mais eficaz de satisfazer os requisitos de força de equipamento de nível superior. É importante eventualmente começar a usar itens de nível superior, mas não ignore o equipamento que pode usar agora.
journal.document.adventurers_guide.strength.title=Força
journal.document.adventurers_guide.surprise_attacks.body=Os ataques surpresa têm acerto garantido, tornando-os especialmente úteis contra inimigos evasivos como cobras e espectros. Podes surpreender os inimigos logo após eles entrarem numa porta enquanto te perseguem, ou quando te perdem de vista.
journal.document.adventurers_guide.surprise_attacks.title=Ataques surpresa
journal.document.adventurers_guide.title=tomo de domínio de masmorras
journal.document.adventurers_guide.upgrades.body=Quanto mais fundo for numa masmorra, mais importante será utilizar equipamento de alto nível melhorado magicamente, mas também precisará de força para os utilizar corretamente. As varinhas, anéis e artefactos não precisam de força, mas têm utilizações limitadas ou não ajudam tão diretamente em combate. Fazer boas escolhas sobre o que melhorar é muito importante para sobreviver no início da masmorra e para se preparar para o sucesso mais tarde.
journal.document.adventurers_guide.upgrades.title=Atualizações
journal.document.alchemy_guide.bombs.body=Uma bomba de pólvora negra padrão pode ser misturada com um item específico para criar uma bomba melhorada.
journal.document.alchemy_guide.bombs.title=Bombas aprimoradas
journal.document.alchemy_guide.brews_elixirs.body=As poções e os elixires são poções avançadas com uma variedade de efeitos, geralmente de utilização única.
journal.document.alchemy_guide.brews_elixirs.title=bebidas e elixires
journal.document.alchemy_guide.energy_food.body=Muitas receitas requerem energia alquímica cristalina, que é produzida pela desconstrução de itens consumíveis num caldeirão de alquimia. Poções ou pergaminhos energizantes também as identificam. Algumas receitas que requerem energia são mágicas, mas estas assemelham-se à cozinha tradicional.
journal.document.alchemy_guide.energy_food.title=Energia e Alimentação
journal.document.alchemy_guide.exotic_potions.body=As poções podem ser misturadas com energia para criar poções exóticas. Têm efeitos mais poderosos, mas são geralmente úteis de diferentes formas.
journal.document.alchemy_guide.exotic_potions.title=poções exóticas
journal.document.alchemy_guide.exotic_scrolls.body=Os pergaminhos exóticos podem ser criados com um pouco de energia e um pergaminho. São um pouco mais fortes e mais caras do que as poções exóticas.
journal.document.alchemy_guide.exotic_scrolls.title=pergaminhos exóticos
journal.document.alchemy_guide.potions.body=Bem-vindo(a) às Aplicações Práticas da Alquimia! Este livro é um guia de receitas para criar itens num caldeirão de alquimia. Começaremos pela receita mais icónica: Poções! Usa três sementes para preparar uma poção aleatória! Cada semente tem uma poção correspondente; utilize várias sementes iguais para aumentar a probabilidade de a poção estar relacionada com as sementes que utilizou.
journal.document.alchemy_guide.potions.title=Introdução e Poções
journal.document.alchemy_guide.spells.body=Os feitiços estão contidos em cristais e proporcionam uma variedade de efeitos, geralmente com múltiplas utilizações.
journal.document.alchemy_guide.spells.title=feitiços
journal.document.alchemy_guide.stones.body=Misturar um pergaminho num caldeirão de alquimia irá imbuir a sua magia em duas pedras dentro do caldeirão. Isto cria runas e identifica o pergaminho!
journal.document.alchemy_guide.stones.title=Criando Runas
journal.document.alchemy_guide.title=Guia de Alquimia
journal.document.alchemy_guide.weapons.body=Algumas das armas mais leves ou mágicas podem ser utilizadas em alquimia! Cada conjunto de armas de arremesso produz metal líquido suficiente para reparar completamente outro conjunto do mesmo nível e categoria. Note que alquimizar um conjunto irá destruí-lo por completo, mesmo que não esteja totalmente presente! Uma varinha produzirá resina arcana suficiente para melhorar duas varinhas do mesmo nível, mas não acima de +3.
journal.document.alchemy_guide.weapons.title=Aprimorando Armas
journal.document.caves_explorer.alive.body=23 de Verão, 308\n\nUma das máquinas anãs ganhou vida de alguma forma! Estávamos apenas a passar quando ela avançou e quase esmagou dois do nosso grupo com os seus enormes punhos de metal. Felizmente, eu estava a transportar a minha varinha de desintegração. Alguns disparos bem direccionados e a besta ficou reduzida a sucata.\n\nO que me preocupa é que não fizemos absolutamente nada para provocar a máquina. Os anões não podiam ter desenhado as máquinas para serem tão agressivas, é como se ela estivesse a tentar emboscar-nos!\n\nPelo menos consegui ajudar os meus companheiros desta vez.\n- Archibald
journal.document.caves_explorer.alive.title=Está vivo!
journal.document.caves_explorer.city.body=21 de Verão, 308\n\nJá vamos na terceira semana e, depois de termos passado grande parte dos últimos dez dias a explorar cada vez mais fundo, chegámos finalmente ao fundo das minas. Encontrámos várias engenhocas de metal e um grande portão que bloqueia a entrada para a antiga metrópole anã.\n\nO ferreiro alertou-nos para algumas destas máquinas. Aparentemente, foram feitas para defesa de área e têm tendência a ativar quando perturbadas. Não temos nada a fazer na cidade e o metal teria pouco valor como sucata, por isso achámos melhor acatar o aviso e voltar.\n\nDevo admitir que estava curioso, mas investigar lá em baixo certamente não valia o risco.\n- Archibald
journal.document.caves_explorer.city.title=A entrada da cidade
journal.document.caves_explorer.discover_hint=Pode encontrar este texto numa região específica, mas apenas depois de encontrar todos os textos anteriores neste conjunto.
journal.document.caves_explorer.expedition.body=1 de Verão, 308\n\nHoje começa a nossa expedição de quatro semanas às minas anãs abandonadas! Fui incumbido pelo próprio rei de explorar a região. Os meus principais objetivos são encontrar quaisquer recursos naturais inexplorados e inspecionar as grutas para um possível projeto de construção de prisões.\n\nEmbora seja capaz de me defender, aceitei uma escolta da guarda da cidade por insistência do rei. São um bando de simplórios, mas desde que não me atrasem, a sua presença é tolerável.\n\nEsperamos limpar os esgotos e chegar às minas até ao anoitecer.\n- Archibald Drummond. Arquimago, Instituto de Magia do Sul.
journal.document.caves_explorer.expedition.title=Início da Expedição!
journal.document.caves_explorer.gold.body=4 de Verão, 308\n\nOs nossos primeiros dias foram realmente muito frutíferos! Depois de estabelecer um acampamento base, partimos para explorar algumas das áreas superiores da mina abandonada. Embora haja muita tralha inútil deixada pelos anões, muitas das paredes da gruta também estão repletas de ouro!\n\nInfelizmente, não somos os primeiros aqui. As grutas estão infestadas de animais selvagens agressivos e parece que os bandos de gnolls também estão interessados no ouro. Admito que fui injusto com a minha escolta de guardas; têm-se mostrado exploradores e guarda-costas muito mais capazes do que eu esperava.\n\nMesmo com este sucesso, ainda temos muito da mina para explorar.\n- Archibald
journal.document.caves_explorer.gold.title=Tanto ouro!
journal.document.caves_explorer.report.body=28 de Verão, 308\n\nHoje terminaremos de empacotar os nossos pertences e preparar-nos-emos para partir. E mesmo a tempo, pois vários membros do nosso grupo começaram a ter pesadelos terríveis após o incidente com a máquina agressiva. Provavelmente é apenas cansaço, mas os pesadelos são todos preocupantemente semelhantes.\n\nEm resumo, as áreas superiores da mina são bastante seguras. Se se pudesse encontrar uma utilidade para o ouro negro, a sua mineração poderia ser bastante lucrativa. Os grandes espaços abertos seriam também muito úteis para os planos de construção da cidade. As minas inferiores, no entanto, são mais perigosas e devem ser evitadas.\n\nEscreverei tudo isto no meu relatório final nos próximos dias.\n- Archibald
journal.document.caves_explorer.report.title=Relatório Final
journal.document.caves_explorer.title=Diário do Explorador
journal.document.caves_explorer.troll.body=11 de Verão, 308\n\nDepois de iniciarmos a nossa exploração na secção central das minas, encontrámos um rosto amigável! Bem... relativamente simpático. Um troll das cavernas montou ali uma pequena ferraria. É resmungão e pouco falador, mas reparou o nosso equipamento em troca de um pouco de ouro.\n\nInfelizmente, o ferreiro troll também nos informou que todo este ouro bonito não é tão bom como parece. Chama-lhe "ouro escuro" e, aparentemente, degrada-se rapidamente sob a luz do sol. Isso certamente explicaria porque nunca houve conflitos pelos recursos aqui.\n\nSuponho que precisamos de escavar um pouco mais fundo para ver se há algo mais valioso.\n- Archibald
journal.document.caves_explorer.troll.title=Encontrei um Troll
journal.document.city_warlock.discover_hint=Pode encontrar este texto numa região específica, mas apenas depois de encontrar todos os textos anteriores neste conjunto.
journal.document.city_warlock.failure.body=Parece que também fui tolo. Presumi que o Novo Rei precisava que a corte se lhe submetesse de bom grado, mas agora vejo que ele tem o poder de controlar até mesmo aqueles que lhe resistem. Trouxe cegamente toda a oposição mais forte até à sua porta para que pudesse transformá-los pessoalmente nos seus escravos. Agora, ondas da sua energia necromântica estão a varrer a cidade, transformando instantaneamente a maioria nos seus suplicantes. Os poucos que ainda têm livre arbítrio estão a fugir. Decidi ficar para trás para observar o melhor que pude e procurar uma brecha. Com o poder mágico que possuo, devo conseguir manter-me escondido e seguro durante algum tempo.
journal.document.city_warlock.failure.title=Falha
journal.document.city_warlock.more_powerful.body=Tem sido difícil controlar o tempo, mas já passou uma semana desde a minha última nota. A nossa civilização realmente entrou em colapso. Os portões estão fechados, todas as funções da nossa sociedade cessaram e carcaças vazias de anões vagueiam pelos corredores. No meio de tudo isto, de alguma forma, o Novo Rei está a tornar-se ainda mais poderoso. A cada dia, a força da sua vontade aumenta, mas também está a mudar. Não consigo descrever, mas parece que já não é um anão. Começo a aceitar que o melhor que posso fazer é documentar estes acontecimentos. Ficarei aqui o máximo de tempo que puder e depois retirar-me-ei quando a minha vontade começar a enfraquecer.
journal.document.city_warlock.more_powerful.title=Mais poderoso
journal.document.city_warlock.new_power.body=O que está a acontecer aqui? O poder que emana do Novo Rei é de facto diferente do que era antes, mas há algo mais. Este novo poder parece irradiar dos corredores mais interiores da nossa cidade. Ainda mais intrigante é que a atividade na metrópole superior também diminuiu. Não sei o que se passa lá em baixo, mas está a atrair quase toda a atenção do Novo Rei. Regressar aos corredores profundos será perigoso, mas preciso de descobrir o que está a causar esta mudança. Talvez o Novo Rei tenha uma fraqueza, afinal?
journal.document.city_warlock.new_power.title=Um Novo Poder
journal.document.city_warlock.old_king.body=É o quinto dia do segundo mês do trigésimo terceiro ano da era da magia. Se um habitante do mundo superior estiver a ler isto, é algures no Inverno de 264. O meu nome é Thymor Zahir e, tanto quanto sei, sou o último membro sobrevivente da corte anã. O nosso rei está morto, substituído por um dos meus antigos colegas que enlouqueceu com o poder. O resto do tribunal submeteu-se a ele, como tolos que são, e perdeu o seu livre-arbítrio no processo. Só eu o previ e fugi antes que o seu ritual pudesse ser concluído. O círculo interno caiu, mas o poder do Novo Rei ainda não chegou a todos. Devo organizar uma resistência o mais rapidamente possível. Recuso-me a deixar a nossa gloriosa civilização sucumbir a este megalómano!
journal.document.city_warlock.old_king.title=O Rei está morto
journal.document.city_warlock.resistance.body=A notícia parece ter-se espalhado rapidamente. Passaram apenas alguns dias e já reuni um pequeno exército de lealistas ao Velho Rei. Poucos são hábeis com a magia, mas quase toda a ordem de monges guerreiros está entre nós. Devemos ser mais do que um adversário à altura de um anão insano e da sua corte de escravos. Entretanto, o Novo Rei escondeu-se nos aposentos internos da nossa cidade. Sem dúvida, já gastou a maior parte do seu poder e espera recuperar antes de encontrar mais resistência. Lançaremos o nosso ataque dentro de algumas horas. Com sorte, conseguiremos formar um conselho provisório e restaurar a estabilidade da nossa maravilhosa cidade até ao final da noite.
journal.document.city_warlock.resistance.title=Uma resistência
journal.document.city_warlock.seen_it.body=Vi o que jaz abaixo, mas não consigo descrever. As minhas mãos tremem incontrolavelmente enquanto tento colocar os meus pensamentos no papel. Por que razão isso está a acontecer? Foi o Novo Rei que o fez? Não faz sentido. Talvez o seu uso desenfreado do poder o tenha atraído? Eu esperava salvar a nossa civilização, mas agora vejo que o mundo inteiro está em risco. De alguma forma, o rei é o menor dos males. Não tenho outra hipótese, pelo bem maior, entregar-me-ei. Por favor, guia-me, meu rei, usa-me como um instrumento para manter Yog-Dzewa sob controlo!
journal.document.city_warlock.seen_it.title=Eu já vi isso
journal.document.city_warlock.title=Diário do Bruxo
journal.document.halls_king.amulet.body=CONSEGUI! ZXQPH0 ZXQ ZXQPH1 ZXQ Não sabia exatamente o que iria encontrar, mas o que descobri lá fora superou as minhas expectativas mais ousadas. Tanto poder, ali, pronto a ser tomado, e é todo meu! ZXQPH2 ZXQ ZXQPH3 ZXQ Com isto, nenhum dos tolos da corte ousará opor-se a mim. Estou eufórico só de pensar em todas as diferentes formas como poderia humilhá-los. Ora, porquê parar por aí? Tenho poder suficiente para destruir cada um deles, se assim o entender! Isto pode ser excessivo, mas não devo demorar muito tempo a decidir ou eles ficarão desconfiados. ZXQPH4 ZXQ ZXQPH5 ZXQ Acho que vou chamar a este grande poder Amuleto de Yendor! ZXQPH6 ZXQ - R.
journal.document.halls_king.amulet.title=O Amuleto
journal.document.halls_king.attrition.body=Tenho um plano para lidar com esta coisa. O seu poder é infinito, mas a sua capacidade de invadir este mundo não o é. Ela depende de lacaios e avatares para fazerem a sua vontade enquanto tenta acumular poder suficiente para tomar o amuleto. Embora não possua o amuleto fisicamente, ainda tenho total controlo sobre o seu poder. Com toda a cidade anã à minha disposição, também tenho vantagem numérica. Posso simplesmente continuar a enviar soldados para a impedir de tomar o amuleto e vencer esta guerra gradualmente por desgaste! Eu, Rodney, Rei dos Anões, sobreviver-te-ei, Yog-Dzewa!
journal.document.halls_king.attrition.title=Atrito
journal.document.halls_king.discover_hint=Pode encontrar este texto numa região específica, mas apenas depois de encontrar todos os textos anteriores neste conjunto.
journal.document.halls_king.new_king.body=EU SOU O REI, AHAHAHAHAAA!\n\nEles simplesmente deixaram-me fazer isto! Sem quase qualquer convencimento, concordaram em deixar-me 'partilhar' esse poder com eles num grande ritual. Num instante, transformaram-se de um coro de vozes trocistas na minha nova corte de súbditos silenciosos!\n\nComo era de esperar, Thymor fugiu como um cobarde ao primeiro sinal de problema. Já consigo sentir a força de resistência que ele está a formar. Acho que vou permitir que ele continue, para que possa entregar todos os seus conspiradores diretamente à minha porta!\n\nClaramente, o reino também não me respeita. Suponho que também vou resolver isso.\n- Rei dos Anões
journal.document.halls_king.new_king.title=Um Novo Rei
journal.document.halls_king.rejection.body=IMBECIS!\n\nNos últimos 33 anos, o nosso reino tem prosperado com a nossa nova tecnologia mágica. Aprendemos a invocar espíritos elementais e a dobrá-los à nossa vontade, mas, de alguma forma, agora as novas experiências são 'demasiado perigosas'.\n\nEu sei o que realmente está a acontecer. A rejeição das minhas teorias não tem a ver com o mérito das mesmas mas sim com a pessoa que as sugere. Provavelmente estão todos a rir-se de mim nas minhas costas.\n\nBem, já chega! Não me importo com o que dizem, explorarei os confins do nosso universo sozinho e guardarei tudo o que descobrir para mim!\n- R.
journal.document.halls_king.rejection.title=Rejeição
journal.document.halls_king.ritual.body=Thymor confrontou-me publicamente hoje mais cedo e insistiu para que eu explicasse a minha nova fonte de poder. Ignorei-o o melhor que pude, mas sinto os olhares julgadores do resto do tribunal sobre mim mais uma vez. Esperava passar um pouco mais de tempo a desfrutar da calmaria antes da tempestade, mas já não importa. Decidi o que quero fazer. Alegarei que obtive o meu poder através de um novo ritual e oferecer-me-ei para o realizar nos outros feiticeiros e no Rei. Assim que o ritual terminar, serei rei! Thymor protestará, claro, mas com tanto poder em jogo, duvido que o ouçam! TODOS SE CURVARÃO PERANTE MIM! - Futuro Rei dos Anões
journal.document.halls_king.ritual.title=O Ritual
journal.document.halls_king.thing.body=Há um problema. Thymor foi derrotado sem esforço, mas parece que a minha busca nos planos exteriores não passou despercebida. Alguma... 'coisa'... foi atraída para o meu mundo e começa a forçar a sua passagem pelo fundo dos corredores inferiores. Para complicar ainda mais as coisas, este é o local exato onde guardei o amuleto! Uma criatura tão rancorosa, porque tenta negar-me o meu poder quando ainda há muito lá fora para ser tomado? Apesar do meu poder, acho que não posso simplesmente atacar e lutar contra ele. O seu verdadeiro poder é insondável, mas deve haver alguma forma de o limitar. DEFENDEREI O MEU PRÉMIO!
journal.document.halls_king.thing.title=A Coisa
journal.document.halls_king.title=Diário de ???
journal.document.intros.caves.body=Estas grutas pouco povoadas estendem-se sob a prisão abandonada. Ricas em minerais, já foram um centro de comércio e indústria movimentados para a sociedade anã que se encontra por baixo, mas foram abandonadas quando os anões se tornaram obcecados pela magia negra. As grutas são agora habitadas principalmente por vida selvagem subterrânea, gnolls e máquinas abandonadas; provavelmente corrompidas pelo mesmo poder que afetou as regiões acima.
journal.document.intros.caves.title=Cavernas
journal.document.intros.city.body=A Metrópole Anã foi em tempos a maior de todas as cidades-estado anãs. No seu auge, os anões construíram maravilhosas máquinas de metal e magia que permitiram que a sua cidade se expandisse rapidamente. Então, um dia, os portões da cidade foram trancados e mais ninguém ouviu falar dos anões. Os poucos que escaparam da cidade quando esta se fechou contaram histórias de um feiticeiro louco que roubou o trono e da terrível magia que aprendeu a controlar.
journal.document.intros.city.title=Metrópole Anã
journal.document.intros.discover_hint=Pode encontrar este texto ao aceder a uma região específica pela primeira vez.
journal.document.intros.dungeon.body=Muitos heróis da cidade acima já se aventuraram na masmorra antes de ti, e a maioria nunca mais foi vista. Diz-se que um mal ancestral espreita nas profundezas, guardando o todo-poderoso Amuleto de Yendor. Mesmo agora, uma energia sombria irradia de baixo, abrindo caminho até à cidade. Conquistará a masmorra e reivindicará o amuleto? Está na hora de começar a sua própria aventura!
journal.document.intros.dungeon.title=Masmorra
journal.document.intros.halls.body=Estes salões profundos da Metrópole Anã foram corrompidos pela magia negra. No passado, estas regiões albergavam a corte de feiticeiros de elite do Rei Anão, mas agora parecem ter sido tomadas por algo ainda mais sinistro... Todo o tipo de criaturas demoníacas horripilantes habitam estes salões, lideradas por algum poder obscuro terrível. Se o Rei dos Anões não foi a fonte da corrupção que se espalha, o que quer que esteja cá em baixo deve ser. Cuidado, poucos aventureiros já desceram tão fundo...
journal.document.intros.halls.discover_hint=Pode encontrar este texto numa região específica, mas apenas depois de encontrar todos os textos anteriores neste conjunto.
journal.document.intros.halls.title=Salões Demoníacos
journal.document.intros.prison.body=Há muitos anos, foi aqui construída uma prisão para abrigar criminosos perigosos. Rigorosamente controlada e segura, condenados de toda a região eram trazidos para aqui para cumprir pena. Mas depressa uma névoa escura começou a espalhar-se por baixo, corrompendo as mentes dos guardas e dos prisioneiros. Em resposta ao caos crescente, a cidade isolou toda a prisão. Ninguém sabe o que aconteceu àqueles que foram deixados para morrer dentro destas paredes...
journal.document.intros.prison.title=Prisão
journal.document.intros.sewers.body=Os pisos superiores da masmorra constituem, na realidade, o sistema de esgotos da cidade. À medida que a energia sombria se insinuou das profundezas, as criaturas do esgoto, geralmente inofensivas, tornaram-se cada vez mais ferozes. A cidade teve de enviar patrulhas de guarda para aqui, a fim de tentar manter a segurança dos que vivem por cima. Este local é perigoso, mas pelo menos a magia maléfica que aqui actua é fraca.
journal.document.intros.sewers.title=Esgotos
journal.document.intros.title=Apresentação das regiões
journal.document.prison_warden.discover_hint=Pode encontrar este texto numa região específica, mas apenas depois de encontrar todos os textos anteriores neste conjunto.
journal.document.prison_warden.journal.body=Primeiro dia da primavera de 362\n\nEsta é a primeira entrada no diário de trabalho da diretora da prisão, Kiana Smith. Com tudo o que tem acontecido ultimamente, decidi começar um diário para organizar os meus pensamentos.\n\nGerir uma prisão a meio quilómetro de profundidade nunca seria fácil, mas ultimamente parece que está a acontecer algum tipo de perturbação organizada. Os detidos têm-se portado mal sem motivo aparente e recusam-se a explicar porquê.\n\nAlguns dos guardas começam a dizer que o local está assombrado. Não posso deixar que os meus próprios funcionários espalhem boatos, mas não posso culpá-los por estarem inquietos.\n- Smith
journal.document.prison_warden.journal.title=Manter um diário
journal.document.prison_warden.letter.body=Thomas, tem sido um grande amigo, por isso estou a fazer-lhe um favor. Quando começar o seu turno esta noite, tranque e reforce a cela de Tengu, atire a chave para algum nicho e saia. Não importa se os outros prisioneiros estão sem vigilância, em breve ninguém poderá sair deste local. Aquele maluco precisa de ficar preso, se escapar, não se consegue saber o que fará. Não conte a ninguém sobre isto e não se preocupe em procurar-me. Uma capitã deve afundar-se com o seu navio. - Kiana
journal.document.prison_warden.letter.title=Carta a Tomás
journal.document.prison_warden.mines.body=54º dia do Inverno, 363\n\nUm grupo de engenheiros da cidade chegou hoje, dizendo que estão aqui para selar a antiga entrada das minas subterrâneas. Suponho que a cidade já não se quer preocupar com a manutenção da passagem. Não fui informado com antecedência, como de costume.\n\nO engenheiro-chefe deles também me contou um monte de disparates sobre magia anã que vaza das minas. Não acredito numa única palavra.\n\nA situação está muito mais controlada com a nossa nova equipa, mas a raiz do problema ainda não está resolvida. Algo está definitivamente a afetar os detidos aqui, e derrubar algumas paredes não vai mudar isso.\n- Smith
journal.document.prison_warden.mines.title=Selando as minas
journal.document.prison_warden.no_support.body=11 de Primavera, 364\n\nO que raio está a cidade a pensar? Depois de solicitar ajuda urgentemente, não ouvi nada, nem mesmo um pedido de desculpas vazio como costumam enviar quando os meus pedidos são negados.\n\nEntretanto, os detidos continuam a piorar e alguns dos guardas até começaram a causar problemas. Será que pretendem deixar isto piorar até termos uma rebelião?!\n\nPelo menos o Thomas continua a ser de confiança como sempre. A sua ajuda organizacional tem sido inestimável, e a sua ideia de ativar aquelas antigas unidades DM-100 foi lamentável, mas necessária. Estou confiante de que posso retomar o controlo desta situação, só preciso de um pouco de apoio!\n-Smith
journal.document.prison_warden.no_support.title=Sem suporte
journal.document.prison_warden.recruits.body=80º dia da Primavera, 362\n\nComo prometido, um monte de novos recrutas chegou hoje. Parece o habitual, alguns promissores e muitos peões que só querem o salário. Ainda assim, ter toda esta nova força bruta deve ajudar bastante com os nossos recentes reclusos indisciplinados.\n\nNum trabalho como este, é importante saber em quem se pode confiar. Um novo contratado, Thomas, parece especialmente promissor. Preciso de toda a ajuda possível agora, por isso, se ele se sair bem, vou ver se consigo promovê-lo rapidamente.\n- Smith
journal.document.prison_warden.recruits.title=Novos recrutas
journal.document.prison_warden.rotberry.body=23 de Outono, 363\n\nRecebi hoje um lindo presente do Felix. É um arbusto vermelho brilhante chamado 'Rotberry'.\n\nJá lhe mencionei como este lugar é deprimente, parece que ele estava a ouvi-lo. Segundo ele, esta planta não gosta de luz nem de água, por isso só preciso de podar as folhas uma vez por mês, mais ou menos. Podá-la deve ser importante, ele mencionou isso uma dúzia de vezes na sua carta.\n\nClaro, Felix nunca faz nada de graça. Ele diz que as sementes que esta planta produz são ótimas para fazer varinhas, por isso, naturalmente, devo-lhe algumas de cada vez que a planta produz.\n- Smith
journal.document.prison_warden.rotberry.title=Planta de rotberry
journal.document.prison_warden.title=Diário do Guarda
journal.document.sewers_guard.crabs.body=11 de Inverno, 376\nQueridos Mamã e Papá,\n\nComo se os ratos já não fossem suficientemente maus, lá em baixo há caranguejos gigantes! Um deles passou por mim a correr e atingiu o Lee em cheio antes de o conseguirmos matar. O Thomas diz que não é culpa minha, mas eu sei que ele só está a tentar ser simpático comigo.\n\nFelizmente, à saída, encontramos um aventureiro que tinha um pouco de pomada de erva-sol. O Lee talvez não tivesse sobrevivido sem aquilo.\n\nVi o aventureiro a olhar para uma rosa antes de partir; disse que era um presente. Porque é que ele arriscaria a vida cá em baixo se alguém se preocupa tanto com ele?\n\nÉ exatamente isso que estou a fazer, não é? Sinto que me estou a meter em algo com que não consigo lidar.
journal.document.sewers_guard.crabs.title=Caranguejos gigantes!
journal.document.sewers_guard.dangerous.body=88º dia do Outono, 375\nQueridos Mamã e Papá,\n\nAgora percebo porque é que o pagamento é tão bom, os esgotos estão infestados de monstros! Os 'vermes' e os 'foras-da-lei' são ratos gigantes sedentos de sangue e bandos de gnolls furiosos.\n\nFelizmente, o resto da minha equipa sabe o que está a fazer. O nosso capitão, Thomas, é um especialista nisso. Estou a tentar aprender rápido para não ser um peso para vocês.\n\nEste trabalho é muito mais perigoso do que eu imaginava. Ainda bem que não posso enviar isto agora, não quero que se preocupem.\n\nVou cuidar de mim,\n- Sonya
journal.document.sewers_guard.dangerous.title=Uma posição perigosa...
journal.document.sewers_guard.discover_hint=Pode encontrar este texto numa região específica, mas apenas depois de encontrar todos os textos anteriores neste conjunto.
journal.document.sewers_guard.guild.body=23 de Inverno, 376\nQueridos Mamã e Papá,\n\nDesta vez não encontrámos novos monstros. Em vez disso, deparámo-nos com um pequeno grupo da guilda dos ladrões durante uma patrulha.\n\nTudo o que ouvi sobre a guilda é mau, mas o resto da minha equipa pareceu quase amigável com eles. O Thomas trocou informações e mantimentos com um deles antes de seguirmos caminhos separados.\n\nNão percebo, não era suposto estarmos a livrar-nos de foras-da-lei? Thomas disse mesmo para não mencionar isso a ninguém no comando. As informações e os mantimentos deles foram muito úteis, e não aguentaríamos mais lutas.\n\nAcho que estamos todos juntos nesta aqui em baixo.
journal.document.sewers_guard.guild.title=A Guilda dos Ladrões
journal.document.sewers_guard.lost.body=40º dia do Inverno, 376\n\nThomas e eu estamos perdidos. Separamo-nos do resto da equipa enquanto lutávamos contra alguns gnolls. Nenhum de nós está ferido, mas os esgotos inferiores são como um labirinto.\n\nThomas diz que conhece uma rota de saída, mas começa na antiga entrada da prisão, no fundo dos esgotos. Não gosto muito de ir mais fundo, mas não temos rações e descer é muito mais rápido do que andar por aí à procura da nossa rota de patrulha.\n\nVai correr tudo bem. O Tomás sabe o que está a fazer.
journal.document.sewers_guard.lost.title=Estamos perdidos
journal.document.sewers_guard.new_position.body=85º dia do Outono, 375\nQueridos Mamã e Papá,\n\nEu disse-vos que todo o trabalho árduo na guarda da cidade valeria a pena. Acabei de ser promovido!\n\nFui convidado para integrar uma equipa especializada que trabalha nos esgotos. Aparentemente, há problemas com pragas e foras-da-lei lá em baixo, e é o nosso trabalho eliminá-los. É um trabalho sujo, mas os esgotos são quentes no Inverno e pagamos três vezes mais do que o serviço de guarda normal!\n\nÉ tudo meio secreto, por isso não posso enviar esta carta. É estranho não vos escrever, por isso vou continuar a escrever mesmo assim. Talvez eu possa mostrá-los um dia.\n\nMelhor,\n- Sonya
journal.document.sewers_guard.new_position.title=O meu novo cargo!
journal.document.sewers_guard.not_worth.body=O Thomas e eu deparamo-nos com uma espécie de monstro gosmento gigantesco à entrada da prisão. Antes que pudéssemos reagir, ele atingiu-nos com magia. Thomas absorveu a maior parte do dano. Ele foi-se. Nenhum dinheiro do mundo vale isso. Vou sair pela rota que o Thomas me indicou. Depois, usarei o que ganhei como guarda para tirar os meus pais e a mim desta cidade maldita. Uma parte de mim quer acreditar que o Rei tenha um plano para tudo isto, mas duvido. Estou a deixar estas cartas como um aviso para os outros. É mais do que apenas ratos e caranguejos gigantes, algo está muito errado aqui em baixo.
journal.document.sewers_guard.not_worth.title=Não vale a pena.
journal.document.sewers_guard.title=Cartas da Guarda
