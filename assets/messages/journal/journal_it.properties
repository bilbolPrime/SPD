journal.document.adventurers_guide.alchemy.body=Se non trovi utile un oggetto consumabile, puoi usarlo come ingrediente alchemico o trasformarlo in energia alchemica universale. Anche le pozioni e le pergamene energizzanti li identificano!\n\nI gingilli sono un tipo unico di equipaggiamento che viene creato e potenziato usando l'alchimia. Sono realizzati con un catalizzatore magico per gingilli e un po' di energia alchemica.\n\n(Il primo calderone alchemico si trova al 3° o 4° piano del dungeon. Ci sono anche pagine di libri di ricette alchemiche vicino a questi calderoni.)
journal.document.adventurers_guide.alchemy.title=Alchimia e gingilli
journal.document.adventurers_guide.dieing.body=Esplorare i dungeon è pericoloso e la maggior parte degli avventurieri alla fine trova la morte. La fortuna aiuta, ma i migliori avventurieri usano ogni piccolo trucco per migliorare le proprie possibilità. (Non scoraggiarti se muori spesso, questo gioco è difficile! Concentrati sull'imparare il gioco e sul migliorare costantemente, non sulla vittoria immediata.)
journal.document.adventurers_guide.dieing.title=Gestire la sconfitta
journal.document.adventurers_guide.examining.body=È importante studiare i nemici e l'ambiente circostante invece di lanciarsi alla cieca! Prendi l'abitudine di esaminare tutto ciò che è nuovo. (Puoi esaminare usando il pulsante della lente d'ingrandimento e selezionando ciò che desideri esaminare. Puoi anche esaminare i buff o i debuff selezionando le relative icone.)
journal.document.adventurers_guide.examining.title=Esaminando
journal.document.adventurers_guide.food.body=Razionare il cibo in modo efficace è uno dei modi migliori per aumentare le probabilità di sopravvivenza: non è sempre necessario mangiare quando si ha fame! Quando non si ha fame, la salute si rigenera lentamente, quindi se si mangia a piena salute, quella rigenerazione andrà sprecata! Se si distribuiscono i pasti in base alla propria salute, il cibo durerà molto più a lungo.
journal.document.adventurers_guide.food.title=Affrontare la fame
journal.document.adventurers_guide.identifying.body=I colori delle pozioni e dei simboli sulle pergamene sono diversi in ogni dungeon. L'equipaggiamento non identificato può essere potenziato o incantato se sei fortunato, oppure potrebbe essere maledetto! Le pergamene per identificare, potenziare o rimuovere la maledizione sono molto utili se vuoi ridurre il rischio di usare equipaggiamento non identificato. (Puoi trovare un elenco di tutti gli oggetti che hai identificato nella scheda del catalogo del tuo diario)
journal.document.adventurers_guide.identifying.title=Identificazione degli oggetti
journal.document.adventurers_guide.intro.body=Saluti, avventuriero, stai leggendo il Tomo della Maestria del Dungeon! Questa guida è pensata per essere usata come riferimento e ti indicherà magicamente quando è il momento migliore per leggere ogni pagina. (Quando il pulsante del diario lampeggia, selezionalo per leggere ciò che la guida ha da dirti! Mancano alcune pagine, forse puoi trovarle nel dungeon?)
journal.document.adventurers_guide.intro.title=Introduzione
journal.document.adventurers_guide.levelling.body=Salire di livello aumenta le tue statistiche e ti conferisce punti talento, che possono fare una grande differenza in combattimento. È meglio avere almeno un livello per ogni piano del dungeon.\n\nPuò essere allettante affrettarsi ed evitare l'esplorazione o il combattimento, ma così facendo ti priverai di rifornimenti ed esperienza.\n\n(Puoi vedere informazioni sul tuo eroe, inclusi i punti esperienza, nel pannello di stato nell'angolo dell'interfaccia di gioco. Seleziona il ritratto del tuo eroe per ottenere ancora più informazioni.)
journal.document.adventurers_guide.levelling.title=Acquisire esperienza
journal.document.adventurers_guide.looting.body=Le stanze dietro porte chiuse a chiave o che contengono ostacoli di solito hanno un bottino migliore. Quando un ostacolo blocca il tuo percorso, di solito puoi trovare un oggetto utile sullo stesso piano. In ogni regione del dungeon di cinque piani troverai sempre 2 pozioni di forza e 3 pergamene di potenziamento, quindi sono un ottimo indicatore di quanto bene stai esplorando. (Puoi vedere un elenco di punti di riferimento e chiavi non utilizzate nella scheda note della finestra del diario.)
journal.document.adventurers_guide.looting.title=Saccheggio efficace
journal.document.adventurers_guide.magic.body=Gli attacchi magici trapassano le armature e sono difficili da schivare. Ciò significa che il danno inflitto dalle bacchette è molto affidabile, ma rende anche i nemici magici molto pericolosi! Gli attacchi magici hanno sempre uno svantaggio. Le bacchette hanno cariche limitate e i nemici magici di solito non saranno in grado di usare la loro magia a distanza ravvicinata. Quando si affrontano nemici che usano la magia, è importante imparare come impedire loro di usarla contro di te.
journal.document.adventurers_guide.magic.title=Attacchi magici
journal.document.adventurers_guide.positioning.body=La strategia è importante quanto l'equipaggiamento. Situazioni negative come essere accerchiati possono solitamente essere evitate con un buon posizionamento. Ad esempio, la maggior parte dei dungeon ha stretti corridoi che costringono i nemici a combatterti uno alla volta. Questi corridoi spesso hanno anche delle porte per attacchi a sorpresa! Ci sono anche molti piccoli accorgimenti per sfruttare a proprio vantaggio elementi ambientali come erba, acqua, fosse o trappole.
journal.document.adventurers_guide.positioning.title=Posizionamento
journal.document.adventurers_guide.searching.body=I dungeon sono pieni di porte segrete e trappole che a prima vista sembrano invisibili. Puoi dedicare un po' di tempo a cercare con attenzione se sospetti che una porta o una trappola siano nascoste nelle vicinanze. (Puoi esaminare tutte le caselle intorno a te premendo due volte il pulsante della lente d'ingrandimento. Forse ci sono delle porte nascoste vicino al punto in cui hai trovato questa pagina!)
journal.document.adventurers_guide.searching.title=Ricerca
journal.document.adventurers_guide.strength.body=Non c'è tempo per allenarsi con le armi e le armature che trovi nel dungeon, quindi avrai bisogno di forza bruta per usarle efficacemente. Le pozioni di forza e le pergamene di potenziamento sono il modo più efficace per soddisfare i requisiti di forza dell'equipaggiamento di livello superiore. È importante iniziare a usare oggetti di alto livello, ma non ignorare l'equipaggiamento che puoi usare subito.
journal.document.adventurers_guide.strength.title=Forza
journal.document.adventurers_guide.surprise_attacks.body=Gli attacchi a sorpresa hanno la garanzia di colpire, il che li rende particolarmente utili contro nemici elusivi come serpenti e spettri. Puoi sorprendere i nemici subito dopo che entrano in una porta mentre ti inseguono, o quando altrimenti ti perdono di vista.
journal.document.adventurers_guide.surprise_attacks.title=Attacchi a sorpresa
journal.document.adventurers_guide.title=tomo della maestria nei dungeon
journal.document.adventurers_guide.upgrades.body=Più ti addentri in un dungeon, più è importante usare equipaggiamento di alto livello potenziato magicamente, ma avrai anche bisogno della forza per usarlo correttamente. Bacchette, anelli e artefatti non richiedono forza, ma hanno usi limitati o non aiutano direttamente in combattimento. Fare buone scelte su cosa potenziare è molto importante per sopravvivere nelle prime fasi del dungeon e per prepararti al successo nelle fasi successive.
journal.document.adventurers_guide.upgrades.title=Aggiornamenti
journal.document.alchemy_guide.bombs.body=Una bomba standard a polvere nera può essere miscelata con un ingrediente specifico per creare una bomba potenziata.
journal.document.alchemy_guide.bombs.title=Bombe potenziate
journal.document.alchemy_guide.brews_elixirs.body=Le pozioni e gli elisir sono pozioni avanzate con una varietà di effetti, solitamente monouso.
journal.document.alchemy_guide.brews_elixirs.title=bevande ed elisir
journal.document.alchemy_guide.energy_food.body=Molte ricette richiedono energia alchemica cristallina, che si ottiene scomponendo oggetti consumabili in un calderone alchemico. Anche le pozioni o le pergamene energizzanti le identificano. Alcune ricette che richiedono energia sono magiche, ma queste assomigliano alla cucina tradizionale.
journal.document.alchemy_guide.energy_food.title=Energia e cibo
journal.document.alchemy_guide.exotic_potions.body=Le pozioni possono essere mescolate con l'energia per creare pozioni esotiche. Queste hanno effetti più potenti, ma spesso risultano utili in modi diversi.
journal.document.alchemy_guide.exotic_potions.title=pozioni esotiche
journal.document.alchemy_guide.exotic_scrolls.body=Le pergamene esotiche possono essere create con un po' di energia e una pergamena. Sono un po' più potenti e più costose delle pozioni esotiche.
journal.document.alchemy_guide.exotic_scrolls.title=pergamene esotiche
journal.document.alchemy_guide.potions.body=Benvenuti ad Applicazioni pratiche dell'alchimia! Questo libro è un manuale di ricette per creare oggetti con un calderone alchemico. Iniziamo con la ricetta più iconica: le pozioni! Usa tre semi per preparare una pozione casuale! Ogni seme ha una pozione corrispondente; usa più semi uguali per aumentare la probabilità che la pozione sia correlata ai semi che hai usato.
journal.document.alchemy_guide.potions.title=Introduzione e Pozioni
journal.document.alchemy_guide.spells.body=Gli incantesimi sono contenuti nei cristalli e forniscono una varietà di effetti, solitamente con molteplici utilizzi.
journal.document.alchemy_guide.spells.title=incantesimi
journal.document.alchemy_guide.stones.body=Mescolando una pergamena in un calderone alchemico, la sua magia si infonderà in due pietre all'interno del calderone. Questo creerà delle rune e permetterà di identificare la pergamena!
journal.document.alchemy_guide.stones.title=Creazione di pietre runiche
journal.document.alchemy_guide.title=Guida all'alchimia
journal.document.alchemy_guide.weapons.body=Alcune delle armi più leggere o più magiche possono essere usate nell'alchimia! Ogni set di armi da lancio produce abbastanza metallo liquido per riparare completamente un altro set dello stesso livello e grado. Nota che alchimizzare un set distruggerà l'intero set, anche se non è presente per intero! Una bacchetta produrrà abbastanza resina arcana per potenziare due bacchette dello stesso livello, ma non oltre +3.
journal.document.alchemy_guide.weapons.title=Potenziamento delle armi
journal.document.caves_explorer.alive.body=23 Estate 308\n\nUna delle macchine naniche ha preso vita in qualche modo! Stavamo semplicemente passando di lì quando ha caricato e ha quasi schiacciato due del nostro gruppo con i suoi enormi pugni di metallo. Per fortuna, avevo con me la mia bacchetta di disintegrazione. Un paio di colpi ben mirati e la bestia è stata ridotta a rottami.\n\nCiò che mi preoccupa è che non abbiamo fatto assolutamente nulla per provocare la macchina. I nani non possono aver progettato le macchine in modo che fossero così aggressive, è come se stesse cercando di tenderci un'imboscata!\n\nAlmeno sono stato in grado di offrire un po' di aiuto ai miei compagni per una volta.\n- Archibald
journal.document.caves_explorer.alive.title=È vivo!
journal.document.caves_explorer.city.body=21 Estate 308\n\nSiamo ormai a tre settimane di distanza e, dopo aver trascorso gran parte degli ultimi dieci giorni a mappare sempre più in profondità, abbiamo finalmente raggiunto il fondo delle miniere. Abbiamo trovato vari marchingegni metallici e un grande cancello che blocca l'accesso all'antica metropoli nanica.\n\nIl fabbro ci ha avvertito di alcuni di questi macchinari. A quanto pare erano destinati alla difesa della zona e tendono ad attivarsi se disturbati. Non abbiamo alcun interesse in città e il metallo avrebbe un valore di rottame minimo, quindi abbiamo pensato che fosse meglio dare ascolto al suo avvertimento e tornare indietro.\n\nDevo ammettere che ero curioso, ma indagare laggiù non valeva certo il rischio.\n- Archibald
journal.document.caves_explorer.city.title=L'ingresso della città
journal.document.caves_explorer.discover_hint=Puoi trovare questo testo in una regione specifica, ma solo dopo aver trovato tutti i testi precedenti di questo insieme.
journal.document.caves_explorer.expedition.body=1° estate 308\n\nOggi inizia la nostra spedizione di quattro settimane nelle miniere naniche abbandonate! Sono stato incaricato dal re in persona di esplorare la regione. I miei obiettivi principali sono trovare eventuali risorse naturali non sfruttate e ispezionare le grotte per un potenziale progetto di costruzione di una prigione.\n\nSebbene sia in grado di difendermi, ho accettato una scorta dalla guardia cittadina su insistenza del re. Sono un branco di sempliciotti, ma finché non mi rallentano la loro presenza è tollerabile.\n\nDovremmo ripulire le fogne e raggiungere le miniere entro sera.\n- Archibald Drummond. Arcimago, Istituto di Magia del Sud.
journal.document.caves_explorer.expedition.title=Partenza della spedizione!
journal.document.caves_explorer.gold.body=4 Estate 308\n\nI nostri primi giorni sono stati davvero molto fruttuosi! Dopo aver allestito un campo base, ci siamo messi ad esplorare alcune delle zone superiori della miniera abbandonata. Sebbene ci sia un sacco di roba inutile lasciata dai nani, molte delle pareti delle caverne sono anche piene d'oro!\n\nSfortunatamente, non siamo i primi qui. Le caverne sono piene di animali selvatici aggressivi e sembra che anche branchi di gnoll siano interessati all'oro. Ammetto di essere stato ingiusto con la mia scorta di guardie, si sono dimostrati esploratori e guardie del corpo molto più capaci di quanto mi aspettassi.\n\nNonostante questo successo, abbiamo ancora gran parte delle miniere da esplorare.\n- Archibald
journal.document.caves_explorer.gold.title=Quanto oro!
journal.document.caves_explorer.report.body=28 d'estate, 308\n\nOggi finiremo di impacchettare le nostre cose e ci prepareremo a partire. Giusto in tempo, perché diversi membri del nostro gruppo hanno iniziato ad avere terribili incubi in seguito all'incidente con la macchina aggressiva. Probabilmente è solo stanchezza, ma i loro incubi sono tutti preoccupantemente simili.\n\nIn sintesi, le aree superiori della miniera sono abbastanza sicure. Se si potesse trovare un utilizzo per l'oro scuro, l'estrazione potrebbe essere molto redditizia. Gli ampi spazi aperti sarebbero perfetti anche per i progetti di costruzione della città. Le miniere inferiori sono invece più pericolose e dovrebbero essere evitate.\n\nScriverò tutto questo nella mia relazione finale nei prossimi giorni.\n- Archibald
journal.document.caves_explorer.report.title=Relazione finale
journal.document.caves_explorer.title=Diario dell'esploratore
journal.document.caves_explorer.troll.body=11 Estate 308\n\nDopo aver iniziato la nostra esplorazione nella parte centrale delle miniere, ci siamo imbattuti in una faccia amichevole! Beh... relativamente amichevole. Un troll delle caverne ha allestito una piccola fucina lì. È burbero e non molto loquace, ma ha riparato la nostra attrezzatura in cambio di un po' d'oro.\n\nSfortunatamente, il fabbro troll ci ha anche informato che tutto questo splendido oro non è poi così buono come sembra. Lo chiama "oro scuro" e a quanto pare si degrada rapidamente alla luce del sole. Questo spiegherebbe certamente perché non ci sono mai stati conflitti per le risorse qui.\n\nSuppongo che dobbiamo scavare un po' più a fondo per vedere se c'è qualcosa di più prezioso.\n- Archibald
journal.document.caves_explorer.troll.title=Ho incontrato un troll
journal.document.city_warlock.discover_hint=Puoi trovare questo testo in una regione specifica, ma solo dopo aver trovato tutti i testi precedenti di questo insieme.
journal.document.city_warlock.failure.body=Sembra che anch'io sia uno sciocco. Presumevo che il Nuovo Re avesse bisogno che la corte si sottomettesse a lui volontariamente, ma ora vedo che ha il potere di controllare persino coloro che gli resistono. Ho condotto ciecamente tutti i più forti oppositori proprio alla sua porta, in modo che potesse trasformarli personalmente in suoi schiavi. Ora ondate della sua energia necrotica stanno travolgendo la città, trasformando all'istante la maggior parte di loro in suoi supplicanti. I pochi che hanno ancora il libero arbitrio stanno fuggendo. Ho scelto di rimanere indietro per osservare al meglio e cercare un'apertura. Con il potere magico che possiedo dovrei essere in grado di rimanere nascosto e al sicuro per un po'.
journal.document.city_warlock.failure.title=Fallimento
journal.document.city_warlock.more_powerful.body=Tenere il conto del tempo è diventato difficile, ma è passata circa una settimana dal mio ultimo appunto. La nostra civiltà è veramente collassata. I cancelli sono chiusi, tutte le funzioni della nostra società sono cessate e gusci vuoti di nani vagano per i corridoi.\n\nIn tutto questo, in qualche modo, il Nuovo Re sta diventando ancora più potente. Ogni giorno la forza della sua volontà si rafforza, ma sta anche cambiando. Non riesco a descriverlo, ma ho la sensazione che non sia più un nano.\n\nSto iniziando ad accettare che la cosa migliore che posso fare è probabilmente documentare questi eventi. Rimarrò qui finché potrò, e poi mi ritirerò quando la mia volontà inizierà a indebolirsi.
journal.document.city_warlock.more_powerful.title=Più potente
journal.document.city_warlock.new_power.body=Che cosa sta succedendo qui? Il potere emanato dal Nuovo Re è davvero diverso da quello iniziale, ma c'è anche qualcos'altro. Questo nuovo potere sembra irradiarsi dalle sale più interne della nostra città. Ancora più sconcertante è che anche l'attività nella metropoli alta sia diminuita. Non so cosa stia succedendo laggiù, ma sta attirando quasi tutta l'attenzione del Nuovo Re. Tornare nelle sale più profonde sarà pericoloso, ma devo scoprire cosa sta causando questo cambiamento. Forse il Nuovo Re ha un punto debole, dopotutto?
journal.document.city_warlock.new_power.title=Un nuovo potere
journal.document.city_warlock.old_king.body=È il quinto giorno del secondo mese del trentatreesimo anno dell'era della magia. Se un abitante del mondo di superficie sta leggendo queste righe, siamo nell'inverno del 264. Mi chiamo Thymor Zahir e, per quanto ne so, sono l'ultimo membro sopravvissuto della corte nanica. Il nostro Re è morto, sostituito da uno dei miei ex colleghi impazzito per il potere. Il resto della corte si è sottomesso a lui, come gli stolti che sono, e ha perso il libero arbitrio. Solo io l'ho previsto e sono fuggito prima che il suo rituale potesse essere completato. Il circolo interno è caduto, ma il potere del Nuovo Re non ha ancora raggiunto tutti. Devo organizzare una resistenza il più rapidamente possibile. Mi rifiuto di lasciare che la nostra gloriosa civiltà cada nelle mani di questo megalomane!
journal.document.city_warlock.old_king.title=Il re è morto
journal.document.city_warlock.resistance.body=Sembra che la notizia si sia diffusa rapidamente. Sono passati solo pochi giorni e ho già radunato un piccolo esercito di lealisti al Vecchio Re. Pochi sono esperti di magia, ma quasi l'intero ordine dei monaci guerrieri è tra noi. Dovremmo essere più che all'altezza di un nano impazzito e della sua corte di schiavi. Nel frattempo, il Nuovo Re si è nascosto nelle stanze interne della nostra città. Senza dubbio ha esaurito gran parte del suo potere e spera di riprendersi prima di incontrare ulteriore resistenza. Lanceremo il nostro attacco tra un paio d'ore. Con un po' di fortuna riusciremo a formare un consiglio provvisorio e a riportare la nostra meravigliosa città alla stabilità entro la fine della notte.
journal.document.city_warlock.resistance.title=Una resistenza
journal.document.city_warlock.seen_it.body=Ho visto cosa si cela sotto, ma non riesco a descriverlo. Le mie mani tremano incontrollabilmente mentre cerco di mettere per iscritto i miei pensieri. Perché sta succedendo questo? È stato il Nuovo Re a farlo? Non ha senso. Forse il suo uso sconsiderato del potere lo ha attirato? Speravo di salvare la nostra civiltà, ma ora vedo che il mondo intero è in pericolo. In qualche modo, il re è il male minore. Non ho altra scelta, per il bene superiore mi arrenderò. Ti prego, guidami, mio re, usami come strumento per tenere a bada Yog-Dzewa!
journal.document.city_warlock.seen_it.title=L'ho visto
journal.document.city_warlock.title=Diario dello stregone
journal.document.halls_king.amulet.body=CE L'HO FATTA!\n\nNon sapevo esattamente cosa avrei trovato, ma quello che ho scoperto là fuori è andato oltre ogni mia più sfrenata immaginazione. Così tanto potere, lì pronto per essere preso, ed è tutto mio!\n\nCon questo nessuno degli sciocchi a corte oserà opporsi a me. Sono euforico al pensiero di tutti i diversi modi in cui potrei umiliarli. Diavolo, perché fermarmi qui, ho abbastanza potere per distruggerli tutti, se voglio! Potrebbe essere eccessivo, ma non devo impiegarci troppo a decidere o inizieranno a sospettare.\n\nPenso che chiamerò questo grande potere l'Amuleto di Yendor!\n- R.
journal.document.halls_king.amulet.title=L'amuleto
journal.document.halls_king.attrition.body=Ho un piano per affrontare questa cosa. Il suo potere è infinito, ma la sua capacità di invadere questo mondo non lo è. Si affida a servitori e avatar per eseguire i suoi ordini mentre cerca di accumulare abbastanza potere per impossessarsi dell'amuleto. Anche se non possiedo fisicamente l'amuleto, ho comunque il pieno controllo del suo potere. Con l'intera città nanica a mia disposizione, ho anche un vantaggio numerico. Posso semplicemente continuare a inviare soldati per impedirle di impadronirsi dell'amuleto e vincere costantemente questa guerra per logoramento! Io, Rodney, Re dei Nani, ti sopravviverò, Yog-Dzewa!
journal.document.halls_king.attrition.title=Attrito
journal.document.halls_king.discover_hint=Puoi trovare questo testo in una regione specifica, ma solo dopo aver trovato tutti i testi precedenti di questo insieme.
journal.document.halls_king.new_king.body=IO SONO IL RE, AHAHAHAHAAA!\n\nMe l'hanno proprio lasciato fare! Senza quasi nessuna persuasione hanno accettato di lasciarmi 'condividere' questo potere con loro in un grande rituale. In un istante si sono trasformati da un coro di voci beffarde nella mia nuova corte di sudditi silenziosi!\n\nCome prevedibile, Thymor è fuggito come un codardo al primo segno di pericolo. Riesco già a sentire anche la forza di resistenza che sta costruendo. Penso che gli permetterò di continuare, così potrà consegnare tutti i suoi cospiratori direttamente alla mia porta!\n\nChiaramente neanche il regno mi rispetta, suppongo che sistemerò anche questo.\n- Re dei Nani
journal.document.halls_king.new_king.title=Un nuovo re
journal.document.halls_king.rejection.body=IMBECILES!\n\nNegli ultimi 33 anni il nostro regno è fiorito grazie alla nostra nuova tecnologia magica. Abbiamo imparato a evocare spiriti elementali e a piegarli al nostro volere, ma ora, in qualche modo, ulteriori esperimenti sono "troppo pericolosi".\n\nSo cosa sta succedendo veramente. Il rifiuto delle mie teorie non ha nulla a che fare con il loro valore e tutto a che fare con la persona che le propone. Probabilmente stanno tutti ridendo di me alle mie spalle.\n\nBene, basta! Non mi importa cosa dicono, esplorerò da solo i confini più remoti del nostro universo e terrò per me tutto ciò che scoprirò!\n- R.
journal.document.halls_king.rejection.title=Rifiuto
journal.document.halls_king.ritual.body=Thymor mi ha affrontato pubblicamente oggi e ha insistito perché spiegassi la mia nuova fonte di potere. L'ho liquidato come meglio potevo, ma sento di nuovo gli occhi giudicanti del resto della corte puntati su di me. Speravo di godermi un po' di più la calma prima della tempesta, ma non importa. Ho deciso cosa voglio fare. Affermerò di aver ottenuto il mio potere attraverso un nuovo rituale e mi offrirò di eseguirlo sugli altri stregoni e sul Re. Una volta terminato il rituale, sarò re! Thymor protesterà, ovviamente, ma con tutto questo potere in gioco dubito che lo ascolteranno! TUTTI SI INCHINERANNO DAVANTI A ME! Futuro Re dei Nani
journal.document.halls_king.ritual.title=Il rituale
journal.document.halls_king.thing.body=C'è un problema. Thymor è stato eliminato senza sforzo, ma sembra che le mie ricerche nei piani esterni non siano passate inosservate.\n\nQualche... 'cosa'... è stata attratta dal mio mondo e sta iniziando a farsi strada dal fondo delle sale inferiori. A complicare ulteriormente le cose, quello è esattamente il luogo in cui ho nascosto l'amuleto! Una creatura così maligna, perché deve cercare di negarmi il mio potere quando ce n'è ancora tanto da prendere?\n\nNonostante il mio potere, però, non credo di poter semplicemente lanciarmi all'attacco e combatterla. Il suo vero potere è incommensurabile, ma deve esserci un modo per limitarlo. DIFENDERÒ IL MIO PREMIO!
journal.document.halls_king.thing.title=La Cosa
journal.document.halls_king.title=Diario di ???
journal.document.intros.caves.body=Queste grotte scarsamente popolate si estendono sotto la prigione abbandonata. Ricche di minerali, un tempo erano un centro di fiorenti commerci e industrie per la società nanica sottostante, ma furono abbandonate quando i nani divennero ossessionati dalla magia oscura. Le grotte sono ora abitate principalmente da fauna sotterranea, gnoll e macchinari abbandonati; probabilmente corrotti dallo stesso potere che ha colpito le regioni sovrastanti.
journal.document.intros.caves.title=Grotte
journal.document.intros.city.body=La Metropoli Nanica era un tempo la più grande di tutte le città-stato naniche. Nel suo periodo di massimo splendore, i nani costruirono meravigliose macchine di metallo e magia che permisero alla loro città di espandersi rapidamente. Poi, un giorno, le porte della città furono sbarrate e nessuno ebbe più notizie dei nani. I pochi che riuscirono a fuggire dalla città mentre si chiudeva raccontarono storie di uno stregone pazzo che aveva rubato il trono e della terribile magia che aveva imparato a padroneggiare.
journal.document.intros.city.title=Metropoli nanica
journal.document.intros.discover_hint=Questo testo compare quando si accede a una regione specifica per la prima volta.
journal.document.intros.dungeon.body=Molti eroi si sono avventurati nel dungeon prima di te, provenienti dalla città di sopra, e della maggior parte non si è più saputo nulla. Si dice che un antico male si annidi nelle profondità, a guardia del potentissimo Amuleto di Yendor. Anche ora un'energia oscura si irradia dal basso, risalendo verso la città. Riuscirai a conquistare il dungeon e a impossessarti dell'amuleto? È tempo di iniziare la tua avventura!
journal.document.intros.dungeon.title=Segreta
journal.document.intros.halls.body=Queste profonde sale della Metropoli Nanica sono state corrotte dalla magia oscura. In passato queste regioni ospitavano la corte del Re dei Nani, composta da stregoni d'élite, ma ora sembrano essere state invase da qualcosa di ancora più sinistro...\n\nOgni sorta di orribili creature demoniache abita queste sale, guidate da un terribile potere oscuro. Se il Re dei Nani non è la fonte della corruzione dilagante, qualunque cosa si trovi quaggiù deve esserlo.\n\nProcedete con cautela, pochissimi avventurieri sono mai scesi così in profondità...
journal.document.intros.halls.discover_hint=Puoi trovare questo testo in una regione specifica, ma solo dopo aver trovato tutti i testi precedenti di questo insieme.
journal.document.intros.halls.title=Sale dei Demoni
journal.document.intros.prison.body=Molti anni fa, qui fu costruita una prigione per ospitare criminali pericolosi. Rigorosamente regolamentata e sicura, accoglieva detenuti provenienti da tutto il paese, che venivano portati qui per scontare la pena. Ma ben presto una oscura nebbia iniziò a insinuarsi dal sottosuolo, corrompendo le menti di guardie e prigionieri. In risposta al crescente caos, la città sigillò l'intera prigione. Nessuno sa che fine abbiano fatto coloro che furono lasciati per morti tra queste mura...
journal.document.intros.prison.title=Prigione
journal.document.intros.sewers.body=I piani superiori del sotterraneo costituiscono in realtà il sistema fognario della città.\n\nCon l'energia oscura che si è insinuata dal basso, le creature delle fogne, solitamente innocue, sono diventate sempre più feroci. La città ha dovuto inviare pattuglie di guardia qui sotto per cercare di mantenere la sicurezza di coloro che si trovano sopra.\n\nQuesto posto è pericoloso, ma almeno la magia malvagia che opera qui è debole.
journal.document.intros.sewers.title=Fognature
journal.document.intros.title=Introduzione alle regioni
journal.document.prison_warden.discover_hint=Puoi trovare questo testo in una regione specifica, ma solo dopo aver trovato tutti i testi precedenti di questo insieme.
journal.document.prison_warden.journal.body=1° Primavera 362\n\nQuesta è la prima annotazione nel diario di lavoro della direttrice del carcere Kiana Smith. Con tutto quello che è successo ultimamente, ho deciso di iniziare un diario per tenere in ordine i miei pensieri.\n\nGestire un carcere a mezzo miglio sottoterra non sarebbe mai stato facile, ma ultimamente sembra che ci sia una sorta di sovversione organizzata in corso. I detenuti si comportano male senza motivo e poi si rifiutano di spiegarne il perché.\n\nAlcune guardie iniziano a dire che il posto è infestato. Non posso permettere che i miei uomini diffondano voci, ma non posso certo biasimarli per essere a disagio.\n- Smith
journal.document.prison_warden.journal.title=Tenere un diario
journal.document.prison_warden.letter.body=Thomas,\n\nSei stato un grande amico, quindi ti sto facendo un favore.\n\nQuando inizi il tuo turno stasera, chiudi a chiave e rinforza la cella di Tengu, butta la chiave in qualche nicchia e vattene. Non importa se gli altri prigionieri sono incustoditi, molto presto nessuno potrà lasciare questo posto. Quel mostro però deve rimanere sotto controllo, se scappa non si sa cosa farà.\n\nNon dirlo a nessuno e non preoccuparti di cercarmi. Un capitano deve affondare con la sua nave.\n- Kiana
journal.document.prison_warden.letter.title=Lettera a Thomas
journal.document.prison_warden.mines.body=54° inverno, 363\n\nUn gruppo di ingegneri della città è venuto oggi, dicendo che sono qui per sigillare il vecchio ingresso delle miniere sottostanti. Suppongo che la città non voglia più preoccuparsi della manutenzione del passaggio. Non sono stato informato in anticipo, come al solito.\n\nIl loro ingegnere capo mi ha anche raccontato delle sciocchezze sulla magia nanica che filtra dalle miniere. Non ci credo nemmeno per un secondo.\n\nLa situazione è sotto controllo con il nostro nuovo personale, ma la radice del problema non è ancora stata affrontata. Qualcosa sta sicuramente influenzando i detenuti qui, e abbattere qualche muro non cambierà le cose.\n- Smith
journal.document.prison_warden.mines.title=Sigillare le miniere
journal.document.prison_warden.no_support.body=11 Primavera 364\n\nCosa diavolo sta pensando la città? Dopo aver richiesto urgentemente aiuto non ho ricevuto alcuna risposta, nemmeno delle scuse vuote come quelle che di solito mandano quando le mie richieste vengono respinte.\n\nNel frattempo le condizioni dei detenuti continuano a peggiorare e alcune guardie hanno persino iniziato a creare problemi. Hanno intenzione di lasciare che la situazione peggiori fino a quando non ci troveremo di fronte a una rivolta!?\n\nThomas è rimasto affidabile come sempre, almeno. Il suo aiuto organizzativo è stato prezioso e la sua idea di attivare quelle vecchie unità DM-100 è stata deplorevole ma necessaria. Sono fiducioso di poter riprendere il controllo della situazione, ho solo bisogno di un po' di supporto!\n-Smith
journal.document.prison_warden.no_support.title=Nessun supporto
journal.document.prison_warden.recruits.body=80° di primavera, 362\n\nCome promesso, oggi è arrivato un gruppo di nuove reclute. Sembra il solito, alcune promettenti e un sacco di fanti che vogliono solo la paga. Comunque, avere tutta questa nuova forza dovrebbe essere di grande aiuto con i nostri detenuti indisciplinati degli ultimi tempi.\n\nIn un lavoro come questo è importante sapere di chi ci si può fidare. Una nuova recluta, Thomas, sembra particolarmente promettente. Ho bisogno di tutto l'aiuto possibile in questo momento, quindi se si comporta bene vedrò di farlo promuovere rapidamente.\n- Smith
journal.document.prison_warden.recruits.title=Nuove reclute
journal.document.prison_warden.rotberry.body=23 Autunno, 363\n\nOggi ho ricevuto un bel regalo da Felix. È una specie di arbusto rosso brillante chiamato 'Rotberry'.\n\nGli avevo già detto quanto fosse tetro questo posto, a quanto pare mi ha ascoltato. Secondo lui, questa pianta non ama la luce e l'acqua, quindi devo solo potare le foglie una volta al mese circa. Potare le foglie dev'essere importante, però, l'ha menzionato una dozzina di volte nella sua lettera.\n\nNaturalmente, Felix non fa mai niente gratis. Dice che i semi che produce questa pianta sono ottimi per fare le bacchette magiche, quindi naturalmente gliene devo qualcuno ogni volta che la pianta ne produce.\n- Smith
journal.document.prison_warden.rotberry.title=Pianta di marcio
journal.document.prison_warden.title=Diario del direttore
journal.document.sewers_guard.crabs.body=11° inverno, 376\nCari mamma e papà,\n\nCome se i topi non fossero già abbastanza, più in basso ci sono dei granchi giganti! Uno di loro mi è passato proprio accanto e ha ferito gravemente Lee prima che lo uccidessimo. Thomas dice che non è colpa mia, ma so che sta solo cercando di essere gentile con me.\n\nPer fortuna, mentre uscivamo abbiamo incontrato un avventuriero che aveva un po' di unguento di erba solare. Lee forse non ce l'avrebbe fatta senza quella roba.\n\nHo visto l'avventuriero fissare una rosa prima che se ne andasse, ha detto che era un regalo. Perché rischierebbe la vita quaggiù se qualcuno si prende così tanto cura di lui?\n\nÈ esattamente quello che sto facendo, no? Mi sento come se fossi completamente impreparato.
journal.document.sewers_guard.crabs.title=Granchi giganti!
journal.document.sewers_guard.dangerous.body=88 Autunno, 375\nCari mamma e papà,\n\nOra capisco perché la paga è così buona, le fogne sono infestate dai mostri! I "parassiti" e i "fuorilegge" sono ratti giganti assetati di sangue e branchi di gnoll arrabbiati.\n\nPer fortuna il resto della mia squadra sa davvero cosa sta facendo. Il nostro capitano, Thomas, è un esperto in questo. Sto cercando di imparare in fretta in modo da non essere un peso.\n\nQuesto lavoro è molto più pericoloso di quanto pensassi. Sono contenta di non poterli inviare ora, non voglio che vi preoccupiate.\n\nStarò attenta,\n- Sonya
journal.document.sewers_guard.dangerous.title=Una posizione pericolosa...
journal.document.sewers_guard.discover_hint=Puoi trovare questo testo in una regione specifica, ma solo dopo aver trovato tutti i testi precedenti di questo insieme.
journal.document.sewers_guard.guild.body=23 d'inverno, 376\nCari mamma e papà,\n\nNiente nuovi mostri questa volta, invece ci siamo imbattuti in un piccolo gruppo della gilda dei ladri mentre eravamo di pattuglia.\n\nTutto quello che ho sentito sulla gilda è negativo, ma il resto della mia squadra sembrava quasi amichevole con loro. Thomas ha scambiato informazioni e provviste con uno di loro prima che ci separassimo.\n\nNon capisco, non dovevamo sbarazzarci dei fuorilegge? Thomas ha persino detto di non menzionarlo a nessuno al comando. Le loro informazioni e provviste sono state comunque molto utili, e non potevamo sopportare altri combattimenti.\n\nSuppongo che siamo tutti sulla stessa barca quaggiù.
journal.document.sewers_guard.guild.title=La Gilda dei Ladri
journal.document.sewers_guard.lost.body=40° giorno d'inverno, 376\n\nIo e Thomas ci siamo persi. Ci siamo allontanati dal resto della squadra mentre combattevamo contro degli gnoll. Nessuno di noi è ferito, ma le fogne inferiori sono un vero labirinto.\n\nThomas dice di conoscere una via d'uscita, ma parte dal vecchio ingresso della prigione in fondo alle fogne. Non mi piace molto andare più in profondità, ma non abbiamo razioni e scendere è molto più veloce che vagare in cerca del nostro percorso di pattugliamento.\n\nAndrà tutto bene. Thomas sa quello che fa.
journal.document.sewers_guard.lost.title=Ci siamo persi
journal.document.sewers_guard.new_position.body=85 Autunno, 375\nCari mamma e papà,\n\nVe l'avevo detto che tutto il duro lavoro alla guardia cittadina avrebbe dato i suoi frutti. Sono appena stato promosso!\n\nSono stato invitato a unirmi a una squadra specializzata che lavora nelle fogne. A quanto pare laggiù ci sono problemi con parassiti e fuorilegge, ed è nostro compito eliminarli. È un lavoro sporco, ma le fogne sono calde d'inverno e si guadagna tre volte di più rispetto al normale servizio di guardia!\n\nÈ tutto un po' segreto, quindi non posso spedire questa lettera. Mi sembra strano non scrivervi, quindi continuerò a scrivervele comunque. Forse un giorno potrò mostrarteli.\n\nCordiali saluti,\n- Sonya
journal.document.sewers_guard.new_position.title=Il mio nuovo incarico!
journal.document.sewers_guard.not_worth.body=Io e Thomas ci siamo imbattuti in una specie di mostro melmoso gigante all'ingresso della prigione. Prima che potessimo reagire, ci ha colpiti con la magia. Thomas ne ha assorbito la maggior parte. Se n'è andato.\n\nNessuna somma di denaro vale questo. Me ne andrò per la strada che mi ha indicato Thomas. Poi prenderò quello che ho guadagnato come guardia e lo userò per portare via me e i miei genitori da questa città maledetta. Una parte di me vorrebbe sperare che il Re abbia un piano per tutto questo, ma ne dubito.\n\nLascio queste lettere come avvertimento per gli altri. Non si tratta solo di ratti e granchi giganti, c'è qualcosa di molto sbagliato qui sotto.
journal.document.sewers_guard.not_worth.title=Non ne vale la pena
journal.document.sewers_guard.title=Lettere della guardia
