journal.document.adventurers_guide.alchemy.body=Ha egy fogyóeszközt nem találsz hasznosnak, felhasználhatod alkímiai összetevőként, vagy univerzális alkímiai energiává alakíthatod. Az energizáló főzetek és tekercsek is azonosítják őket!\n\nA csecsebecsék egyedi felszerelések, amelyeket alkímia segítségével készítenek és fejlesztenek. Egy mágikus csecsebecse-katalizátorral és egy kis alkímiai energiával készülnek.\n\n(Az első alkímiai edény a kazamata 3. vagy 4. emeletén található. Az edények közelében alkímiai receptkönyv oldalak is találhatók.)
journal.document.adventurers_guide.alchemy.title=Alkímia és csecsebecsék
journal.document.adventurers_guide.dieing.body=A barlangtúrázás veszélyes, és a legtöbb kalandor végül meghal.\n\nA szerencse segít, de a legjobb kalandorok minden apró trükköt bevetnek, hogy javítsák esélyeiket.\n\n(Ne csüggedj, ha sokat haldokolsz, ez a játék nehéz! A játék megtanulására és a folyamatos fejlődésre koncentrálj, ne az azonnali győzelemre.)
journal.document.adventurers_guide.dieing.title=A vereség kezelése
journal.document.adventurers_guide.examining.body=Fontos, hogy tanulmányozd az ellenségeidet és a környezetedet, ahelyett, hogy vakon rohannál! Szokj rá, hogy minden új dolgot megvizsgálsz.\n\n(A nagyító gombbal megvizsgálhatsz, majd kiválaszthatod, hogy mit szeretnél megvizsgálni. A buffokat vagy debuffokat az ikonjaik kiválasztásával is megvizsgálhatod.)
journal.document.adventurers_guide.examining.title=Vizsgálat
journal.document.adventurers_guide.food.body=A hatékony jegyrendszer az egyik legjobb módja a túlélési esélyek javításának, nem mindig kell rendesen enni, amikor megéhezel!\n\nAmikor nem éhezel, lassan regenerálod az életerődet, tehát ha teljes egészséggel eszel, ez a regeneráció kárba vész!\n\nHa az egészségi állapotodhoz igazítod az étkezési tempódat, az ételed sokkal tovább kitart.
journal.document.adventurers_guide.food.title=Az éhség kezelése
journal.document.adventurers_guide.identifying.body=A tekercseken található főzetek és szimbólumok színei minden kazamatában eltérőek. Az azonosítatlan felszerelések fejleszthetők vagy elvarázsolhatók, ha szerencséd van, vagy akár el is átkozhatók! ZXQPH0 ZXQ ZXQPH1 ZXQ Az azonosítás, fejlesztés vagy átok eltávolítása tekercsek nagyon hasznosak, ha csökkenteni szeretnéd az azonosítatlan felszerelések használatának kockázatát. ZXQPH2 ZXQ ZXQPH3 ZXQ (Az összes azonosított tárgy listáját a naplód katalógus fülén találod.)
journal.document.adventurers_guide.identifying.title=Elemek azonosítása
journal.document.adventurers_guide.intro.body=Üdvözlet kalandor, a Dungeon Mastery kötetét olvasod! Ez az útmutató leginkább referenciaként használható, és varázslatosan tudatja veled, hogy mikor a legjobb elolvasni az egyes oldalakat. \n\n (Amikor a napló gombja villog, válaszd ki, hogy elolvasd, mit mond az útmutató! Néhány oldal azonban hiányzik, talán megtalálod őket a kazamatában?)
journal.document.adventurers_guide.intro.title=Bevezetés
journal.document.adventurers_guide.levelling.body=A szintlépés növeli a statisztikáidat és tehetségpontokat ad, ami nagy különbséget jelenthet a harcban. A legjobb, ha a kazamata minden szintjén van legalább egy szint.\n\nCsábító lehet rohanni és elkerülni a felfedezést vagy a harcot, de ha így teszel, megfosztasz a készletektől és a tapasztalattól.\n\n(A hősöddel kapcsolatos információkat, beleértve a tapasztalatokat is, a játékfelület sarkában található állapotpanelen láthatod. Válaszd ki a hősöd portréját, hogy még több információt kapj.)
journal.document.adventurers_guide.levelling.title=Tapasztalatszerzés
journal.document.adventurers_guide.looting.body=A zárt ajtók mögött lévő vagy akadályokat tartalmazó szobákban általában jobb zsákmány található. Amikor egy akadály elállja az utad, általában találsz egy tárgyat a segítségedre ugyanazon az emeleten.\n\nMinden ötemeletes kazamata régióban mindig találsz 2 erőitalt és 3 fejlesztőtekercset, így ezek nagyszerűen jelzik, mennyire haladsz a felfedezéssel.\n\n(A nevezetességek és a fel nem használt kulcsok listáját a naplóablak jegyzetek fülén láthatod.)
journal.document.adventurers_guide.looting.title=Hatékony fosztogatás
journal.document.adventurers_guide.magic.body=A mágikus támadások átvágják a páncélt, és nehéz kitérni előlük. Ez azt jelenti, hogy a pálcák által okozott sebzés nagyon megbízható, de a mágikus ellenfeleket is nagyon veszélyessé teszi!\n\nA mágikus támadásoknak azonban mindig van hátrányuk. A pálcák töltete korlátozott, és a mágikus ellenfelek általában nem tudják használni a mágiájukat közelről.\n\nAmikor olyan ellenfelekkel nézel szembe, akik mágiát használnak, fontos megtanulni, hogyan akadályozhatod meg, hogy ellened használják.
journal.document.adventurers_guide.magic.title=Mágikus támadások
journal.document.adventurers_guide.positioning.body=A stratégia ugyanolyan fontos, mint a felszerelés. A rossz helyzetek, mint például a bekerítés, általában elkerülhetők jó helyezkedéssel.\n\nPéldául a legtöbb kazamatának keskeny folyosói vannak, amelyek arra kényszerítik az ellenségeket, hogy egyesével harcoljanak ellened. Ezeken a folyosókon gyakran vannak ajtók a meglepetésszerű támadásokhoz is!\n\nSok apró módja van annak, hogy a környezeti elemeket, például a füvet, a vizet, a gödröket vagy a csapdákat a saját előnyödre fordítsd.
journal.document.adventurers_guide.positioning.title=Pozicionálás
journal.document.adventurers_guide.searching.body=A kazamaták tele vannak titkos ajtókkal és csapdákkal, amelyek első pillantásra láthatatlannak tűnnek. Szánj rá egy kis időt, és alaposan keresgélj, ha gyanítod, hogy egy ajtó vagy csapda van a közelben. \n\n (A nagyító gomb kétszeri megnyomásával átkutathatod az összes körülötted lévő mezőt. Talán vannak rejtett ajtók a közelben, ahol ezt az oldalt találtad!)
journal.document.adventurers_guide.searching.title=Keresés
journal.document.adventurers_guide.strength.body=Nincs idő a kazamatában talált fegyverekkel és páncélokkal edzeni, ezért nyers erőre lesz szükséged a hatékony használatukhoz.\n\nAz erőfőzők és a fejlesztőtekercsek a leghatékonyabb módja annak, hogy megfelelj a magasabb szintű felszerelések erőkövetelményeinek.\n\nFontos, hogy végül elkezdj használni a magas szintű tárgyakat, de ne hagyd figyelmen kívül azokat a felszereléseket, amelyeket most is használhatsz.
journal.document.adventurers_guide.strength.title=Erő
journal.document.adventurers_guide.surprise_attacks.body=A meglepetésszerű támadások garantáltan találóak, így különösen hasznosak a kitérő képességű ellenségek, például a kígyók és a lidércek ellen.\n\nMeglepheted az ellenségeidet közvetlenül azután, hogy belépnek egy ajtón, miközben üldöznek, vagy ha más módon elveszítenek szem elől.
journal.document.adventurers_guide.surprise_attacks.title=Meglepetéstámadások
journal.document.adventurers_guide.title=a kazamatamesterség kötete
journal.document.adventurers_guide.upgrades.body=Minél mélyebbre merülsz egy kazamatába, annál fontosabb, hogy mágikusan fejlesztett, magas szintű felszerelést használj, de szükséged lesz az erőre is a megfelelő használatukhoz.\n\nA pálcák, gyűrűk és ereklyék nem igényelnek erőt, de korlátozott a felhasználási módjuk, vagy nem segítenek olyan közvetlenül a harcban.\n\nA jó döntések meghozatala a fejlesztendő tárgyakkal kapcsolatban nagyon fontos a kazamata korai szakaszában való túléléshez, valamint a későbbi sikerekhez.
journal.document.adventurers_guide.upgrades.title=Frissítések
journal.document.alchemy_guide.bombs.body=Egy hagyományos fekete lőporos bomba összekeverhető egy adott tárggyal, hogy egy továbbfejlesztett bombát hozzon létre.
journal.document.alchemy_guide.bombs.title=Továbbfejlesztett bombák
journal.document.alchemy_guide.brews_elixirs.body=A főzetek és elixírek fejlett főzetek, változatos hatásokkal, általában egyszeri felhasználásra.
journal.document.alchemy_guide.brews_elixirs.title=főzetek és elixírek
journal.document.alchemy_guide.energy_food.body=Sok recept kristályos alkímiai energiát igényel, amelyet fogyóeszközök alkímiai edényben történő szétszerelésével állítanak elő. Az energizáló főzetek vagy tekercsek is azonosítják őket. \n\n Néhány energiát igénylő recept mágikus, de ezek a hagyományos főzésre hasonlítanak.
journal.document.alchemy_guide.energy_food.title=Energia és élelmiszer
journal.document.alchemy_guide.exotic_potions.body=A főzeteket energiával keverve egzotikus italokat lehet készíteni. Ezeknek erősebb a hatásuk, de gyakran másképp hasznosak.
journal.document.alchemy_guide.exotic_potions.title=egzotikus főzetek
journal.document.alchemy_guide.exotic_scrolls.body=Egzotikus tekercseket lehet készíteni némi energiával és egy tekercssel. Egy kicsit erősebbek és drágábbak, mint az egzotikus főzetek.
journal.document.alchemy_guide.exotic_scrolls.title=egzotikus tekercsek
journal.document.alchemy_guide.potions.body=Üdvözlünk az Alkímia Gyakorlati Alkalmazásaiban! Ez a könyv recepteket tartalmaz arra vonatkozóan, hogyan készíthetünk tárgyakat egy alkímiai edényben.\n\nKezdjük a legikonikusabb recepttel: Bájitalok!\n\nHasználj három magot egy véletlenszerű bájital elkészítéséhez! Minden magnak van egy bájital megfelelője, használj ugyanabból a magból több magot, hogy növeld az esélyét annak, hogy a bájital a használt magokhoz kapcsolódik.
journal.document.alchemy_guide.potions.title=Bevezetés és bájitalok
journal.document.alchemy_guide.spells.body=A varázslatok kristályokban találhatók, és változatos hatásokat biztosítanak, általában többféle felhasználási móddal.
journal.document.alchemy_guide.spells.title=varázslatok
journal.document.alchemy_guide.stones.body=Ha egy tekercset egy alkímiai edénybe keversz, a varázslat két sziklába ivódik az edényben. Ez rúnaköveket hoz létre és azonosítja a tekercset!
journal.document.alchemy_guide.stones.title=Rúnakövek készítése
journal.document.alchemy_guide.title=Alkímia útmutató
journal.document.alchemy_guide.weapons.body=Néhány könnyebb vagy mágikusabb fegyver használható alkímiában!\n\nMinden dobott fegyverkészlet elegendő folyékony fémet termel egy másik, azonos szintű és osztályú készlet teljes javításához. Fontos megjegyezni, hogy egy készlet alkimizálása az egész készletet elpusztítja, még akkor is, ha nincs meg az összes!\n\nEgy pálca elegendő arkán gyantát termel két azonos szintű pálca fejlesztéséhez, de legfeljebb +3-mal.
journal.document.alchemy_guide.weapons.title=Fegyverek fejlesztése
journal.document.caves_explorer.alive.body=Nyár 23., 308\n\nAz egyik törpe gép valahogy életre kelt! Épp arra jártunk, amikor rátámadt, és hatalmas fémökleivel majdnem összezúzta a csoportunk két tagját. Szerencsére nálam volt a szétesést okozó pálcám. Néhány jól irányzott lövés, és a szörnyű dolog fémhulladékká változott.\n\nEngem az zavar, hogy semmit sem tettünk, hogy provokáljuk a gépet. A törpök lehetetlen, hogy ilyen agresszívre tervezték a gépeket, mintha lesből próbáltak volna ránk támadni!\n\nLegalább egyszer tudtam némi segítséget nyújtani a társaimnak.\n- Archibald
journal.document.caves_explorer.alive.title=Él!
journal.document.caves_explorer.city.body=Nyár 21., 308\n\nMost a három hétnél tartunk, és miután az elmúlt tíz nap nagy részét egyre mélyebbre térképezéssel töltöttük, végre elértük a bányák alját. Különféle fémszerkezeteket és egy hatalmas kaput találtunk, amely elzárja a bejáratot a régi törpe metropoliszba.\n\nA kovács figyelmeztetett minket ezekre a szerkezetekre. Nyilvánvalóan területvédelemre szánták, és hajlamosak aktiválódni, ha megzavarják őket. Nincs dolgunk a városban, és a fémnek minimális hulladékértéke lenne, ezért úgy gondoltuk, a legjobb, ha megfogadjuk a figyelmeztetését, és visszamegyünk.\n\nBe kell vallanom, kíváncsi voltam, de az odalent való kutatás biztosan nem érte meg a kockázatot.\n- Archibald
journal.document.caves_explorer.city.title=A város bejárata
journal.document.caves_explorer.discover_hint=Ezt a szöveget egy adott régióban találhatja meg, de csak miután megtalálta az összes korábbi szöveget ebben a készletben.
journal.document.caves_explorer.expedition.body=Nyár 1., 308\n\nMa kezdődik négyhetes expedíciónk az elhagyatott törpe bányákba! Maga a király bízott meg a régió felfedezésével. Fő céljaim a kiaknázatlan természeti erőforrások felkutatása és a barlangok felmérése egy lehetséges börtönépítési projekthez.\n\nBár képes vagyok megvédeni magam, a király ragaszkodására elfogadtam a városi őrség kíséretét. Egy csapat ostoba ember, de amíg nem lassítanak le, a jelenlétük elviselhető.\n\nVárhatóan estére kitisztítjuk a csatornákat és elérjük a bányákat.\n - Archibald Drummond. Főmágus, déli varázslóintézet.
journal.document.caves_explorer.expedition.title=Expedíció kezdete!
journal.document.caves_explorer.gold.body=Nyár 4., 308\n\nAz első néhány napunk valóban nagyon gyümölcsöző volt! Miután felállítottunk egy alaptábort, elindultunk az elhagyott bánya felső részeinek felfedezésére. Bár rengeteg a törpök által hátrahagyott haszontalan kacat, a barlangfalak közül sok is hemzseg az aranytól!\n\nUsajnos nem mi vagyunk az elsők itt. A barlangok hemzsegnek az agresszív vadvilágtól, és úgy tűnik, a gnoll falkák is érdeklődnek az arany iránt. Bevallom, hogy igazságtalan voltam az őrkíséretemmel, sokkal képzettebb felfedezők és testőrök voltak, mint amire számítottam.\n\nEnnek a sikernek ellenére még sok bánya van hátra felfedezésre.\n- Archibald
journal.document.caves_explorer.gold.title=Annyi Arany!
journal.document.caves_explorer.report.body=Nyár 28., 308\n\nMa befejezzük a holmink összepakolását és felkészülünk az indulásra. Épp időben, csoportunk több tagjának is szörnyű rémálmai kezdődtek az agresszív géppel történt incidens után. Valószínűleg csak fáradtság, de a rémálmaik mind aggasztóan hasonlóak.\n\nÖsszefoglalva, a bánya felső területei meglehetősen biztonságosak. Ha találnának felhasználási módot a sötét aranyra, akkor a bányászata meglehetősen jövedelmező lehet. A nagy, nyílt terek a város építési terveihez is nagyon jól működnének. Az alsó bányák azonban veszélyesebbek, ezért kerülni kell őket.\n\nMindezt beírom a zárójelentésembe a következő napokban.\n- Archibald
journal.document.caves_explorer.report.title=Zárójelentés
journal.document.caves_explorer.title=Felfedező naplója
journal.document.caves_explorer.troll.body=Nyár 11., 308\n\nMiután megkezdtük a felfedezésünket a bányák középső részén, egy barátságos arcba botlottunk! Nos... viszonylag barátságosba. Egy barlangi troll egy kis kovácsműhelyt rendezett be ott. Mogorva és nem túl beszédes, de megjavította a felszerelésünket némi aranyért cserébe.\n\nUsajnos a troll kovács azt is közölte velünk, hogy ez a sok szép arany nem egészen olyan jó, mint amilyennek látszik. „Sötét aranynak” nevezi, és állítólag gyorsan lebomlik a napfényben. Ez minden bizonnyal megmagyarázná, miért nem voltak soha konfliktusok az itteni erőforrások miatt.\n\nAzt hiszem, mélyebbre kell ásnunk, hogy lássuk, van-e ennél értékesebb dolog.\n- Archibald
journal.document.caves_explorer.troll.title=Találkoztam egy trollral
journal.document.city_warlock.discover_hint=Ezt a szöveget egy adott régióban találhatja meg, de csak miután megtalálta az összes korábbi szöveget ebben a készletben.
journal.document.city_warlock.failure.body=Úgy tűnik, én is bolond vagyok. Azt feltételeztem, hogy az Új Királynak szüksége van arra, hogy az udvar önként hódoljon meg neki, de most látom, hogy hatalmában áll még azokat is irányítani, akik ellenállnak neki.\n\nVakon a küszöbére hoztam a legerősebb ellenfeleket, hogy személyesen rabszolgákká változtathassa őket. Most nekrotikus energiájának hullámai söpörnek végig a városon, és azonnal a legtöbbjüket a könyörgőivé változtatják.\n\nAzok a kevesek, akiknek még van szabad akaratuk, menekülnek. Úgy döntöttem, hogy maradok, hogy a lehető legjobban megfigyeljem, és keressek egy lehetőséget. A varázserőmmel egy ideig rejtve és biztonságban maradhatok.
journal.document.city_warlock.failure.title=Hiba
journal.document.city_warlock.more_powerful.body=Nehézkesen tudom követni az időt, de már körülbelül egy hét telt el az utolsó bejegyzésem óta. Civilizációnk valóban összeomlott. A kapuk bezárultak, társadalmunk minden funkciója megszűnt, és üres törpe páncélok járják a termeket.\n\nMindezek során valahogy az Új Király még hatalmasabbá válik. Minden nappal erősebb az akarata, de változik is. Nem tudom leírni, de olyan érzés, mintha már egyáltalán nem lenne törpe.\n\nKezdem elfogadni, hogy a legjobb, amit talán tehetek, az az, hogy dokumentálom ezeket az eseményeket. Amíg csak tudok, itt maradok, aztán visszavonulok, amint az akaratom gyengülni kezd.
journal.document.city_warlock.more_powerful.title=Erősebb
journal.document.city_warlock.new_power.body=Mi történik itt? Az Új Királyból áradó erő valóban más, mint kezdetben, de van még valami más is. Ez az új erő mintha városunk legbelsőbb csarnokaiból sugározna.\n\nMég rejtélyesebb, hogy a felső metropoliszban is csökkent a tevékenység. Nem tudom, mi történik odalent, de az Új Király szinte teljes figyelmét magára vonja.\n\nVeszélyes lesz visszatérni a mély csarnokokba, de ki kell derítenem, mi okozza ezt a változást. Talán az Új Királynak mégiscsak van gyengesége?
journal.document.city_warlock.new_power.title=Egy új hatalom
journal.document.city_warlock.old_king.body=A mágia korának 33. évének 2. hónapjának 5. napja van. Ha egy túlvilági olvassa ezt, akkor valamikor a 264-es telet járjuk. A nevem Thymor Zahir, és legjobb tudomásom szerint én vagyok a törpe udvar utolsó túlélője.\n\nKirályunk meghalt, helyére az egyik korábbi kollégám került, aki megőrült a hatalomtól. Az udvar többi tagja behódolt neki, mint amilyen bolondok ők, és eközben elvesztették a szabad akaratukat. Csak én láttam ezt előre, és elmenekültem, mielőtt a rituáléja befejeződhetett volna.\n\nA belső kör összeomlott, de az Új Király hatalma még nem ért el mindenkit. A lehető leggyorsabban ellenállást kell tanúsítanom. Nem vagyok hajlandó hagyni, hogy dicsőséges civilizációnk ennek a megalománnak a kezébe kerüljön!
journal.document.city_warlock.old_king.title=A király halott
journal.document.city_warlock.resistance.body=Úgy tűnik, gyorsan terjed a hír. Csak néhány nap telt el, és máris összegyűjtöttem egy kis sereget az Öreg Király hűséges tagjaiból. Kevesen jártasak a mágiában, de a harcos szerzetesek szinte teljes rendje közöttünk van. Több mint fel kellene vennünk a versenyt egyetlen őrült törpével és rabszolgáinak udvarával.\n\nEközben az Új Király elrejtőzött városunk belső termeiben. Kétségtelen, hogy erejének nagy részét már felélte, és reméli, hogy felépül, mielőtt további ellenállásba ütközik.\n\nNéhány óra múlva megindítjuk a támadásunkat. Szerencsével ideiglenes tanácsot tudunk alakítani, és az éjszaka végére helyre tudjuk állítani csodálatos városunk stabilitását.
journal.document.city_warlock.resistance.title=Egy ellenállás
journal.document.city_warlock.seen_it.body=Láttam, mi fekszik odalent, de nem tudom leírni. A kezem kontrollálhatatlanul remeg, miközben próbálom leírni a gondolataimat.\n\nMiért történik ez? Az Új Király tette ezt? Ennek nincs értelme. Talán a hatalom öncélú használata vonzotta? Reméltem, hogy megmenthetem a civilizációnkat, de most látom, hogy az egész világ forog kockán.\n\nValahogy a király a kisebbik rossz. Nincs más választásom, a nagyobb jó érdekében megadom magam. Kérlek, vezess engem, királyom, használj eszközként, hogy Yog-Dzewát sakkban tartsa!
journal.document.city_warlock.seen_it.title=Láttam már
journal.document.city_warlock.title=Boszorkánymester naplója
journal.document.halls_king.amulet.body=MEGCSINÁLTAM!\n\nNem tudtam pontosan, mit találok, de amit felfedeztem, az felülmúlta a legvadabb feltételezéseimet is. Annyi hatalom, csak úgy ott hever, készen arra, hogy elvegyem, és mindez az enyém!\n\nEzzel a bíróságon lévő bolondok közül senki sem mer szembeszállni velem. Csak szédülök, amikor arra gondolok, hogy milyen sokféleképpen megalázhatnám őket. A francba, miért állnék meg itt, elég erőm van ahhoz, hogy elpusztítsam mindegyiküket, ha akarom! Ez talán túlzás, de nem szabad túl sokáig döntenem, különben gyanakodni fognak.\n\nAzt hiszem, ezt a nagy erőt Yendor Amulettjének fogom nevezni!\n- R.
journal.document.halls_king.amulet.title=Az amulett
journal.document.halls_king.attrition.body=Van egy tervem, hogy hogyan bánjak el ezzel a dologgal. Az ereje végtelen, de a képessége, hogy betolakodjon ebbe a világba, nem. Kényszerítőkre és avatárokra támaszkodik, hogy teljesítsék a parancsait, miközben megpróbál elég erőt gyűjteni az amulett ellopásához.\n\nBár fizikailag nem birtoklom az amulettet, továbbra is teljes mértékben uralom az erejét. Mivel az egész törp város a rendelkezésemre áll, számbeli előnyöm is van. Egyszerűen küldhetek katonákat, hogy megakadályozzák az amulett ellopását, és fokozatosan megnyerhetem ezt a háborút a felőrlődés révén!\n\nI, RODNEY, A TÖRPÖK KIRÁLYA, TÚLÉL TART, YOG-DZEWA!
journal.document.halls_king.attrition.title=Lemorzsolódás
journal.document.halls_king.discover_hint=Ezt a szöveget egy adott régióban találhatja meg, de csak miután megtalálta az összes korábbi szöveget ebben a készletben.
journal.document.halls_king.new_king.body=ÉN VAGYOK A KIRÁLY, AHAHAHAHAAA!\n\nEgyszerűen hagyták, hogy megtegyem! Alig győzködtek, hogy egy nagyszerű rituálé során „megoszthassam” velük ezt a hatalmat. Egy pillanat alatt átalakultak gúnyolódó hangok kórusából az új, néma alattvalóim udvarává!\n\nKiszámítható módon Thymor gyávaként menekült el a baj első jelére. Már érzem az ellenállási erőt, amit ő is épít. Azt hiszem, hagyom, hogy folytassa, hogy az összes összeesküvőjét egyenesen az ajtómhoz szállíthassa!\n\nEgyértelmű, hogy a királyság sem tisztel engem, azt hiszem, ezt is helyrehozom.\n - A törpök királya
journal.document.halls_king.new_king.title=Egy új király
journal.document.halls_king.rejection.body=HÜLYESÉGEK!\n\nAz elmúlt 33 évben királyságunk virágzott az új mágikus technológiánknak köszönhetően. Megtanultuk, hogyan idézzünk meg elementális szellemeket és hogyan hajlítsuk őket az akaratunkhoz, de valahogy most a további kísérletezés „túl veszélyes”.\n\nTudom, mi folyik valójában. Elméleteim elutasításának semmi köze az érdemükhöz, mindennek köze van ahhoz a személyhez, aki felveti őket. Valószínűleg mindannyian rajtam nevetnek a hátam mögött.\n\nNos, elég legyen! Nem érdekel, mit mondanak, egyedül fogom felfedezni univerzumunk legtávolabbi részeit, és mindent, amit felfedezek, megtartok magamnak!\n- R.
journal.document.halls_king.rejection.title=Elutasítás
journal.document.halls_king.ritual.body=Thymor ma korábban nyilvánosan szembeszállt velem, és ragaszkodott hozzá, hogy elmagyarázzam az új erőforrásomat. Amennyire tudtam, elhessegettem a dolgot, de ismét érzem magamon az udvar többi tagjának ítélkező tekintetét.\n\nReméltem, hogy még egy kicsit élvezhetem a vihar előtti csendet, de igazából nem számít. Eldöntöttem, mit akarok tenni. Azt fogom állítani, hogy egy új rituálé révén szereztem az erőmet, és felajánlom, hogy végrehajtom a többi varázslón és a királlyal. Amint véget ér a rituálé, én leszek a király!\n\nThymor természetesen tiltakozni fog, de ekkora erővel kétlem, hogy hallgatnának rá!\n\nMINDENKI MEGHAJL ELŐTTEM!\n - A törpök leendő királya
journal.document.halls_king.ritual.title=A rituálé
journal.document.halls_king.thing.body=Van egy kis probléma. Thymort könnyedén elintézték, de úgy tűnik, a külső síkokon való kutakodásom nem maradt észrevétlen.\n\nValami... „dolog”... vonzódott a világomhoz, és kezd áttörni az alsó csarnokok alján. Tovább bonyolítja a helyzetet, hogy pontosan ott tároltam az amulettet! Micsoda gyűlölködő teremtmény, miért kell megpróbálnia megfosztania az erőmet tőlem, amikor még rengeteg van odakint, amit el lehet vinni?\n\nAz erőm ellenére sem hiszem, hogy csak úgy beronthatok és megküzdhetek vele. Az igazi ereje felfoghatatlan, de kell lennie valamilyen módnak a korlátozására. MEGVÉDEM A JUTALMAMAT!
journal.document.halls_king.thing.title=A dolog
journal.document.halls_king.title=??? naplója
journal.document.intros.caves.body=Ezek a ritkán lakott barlangok az elhagyatott börtön alatt húzódnak. Ásványi anyagokban gazdagok, egykor a törp társadalom nyüzsgő kereskedelmi és ipari központjai voltak, de elhagyatottá váltak, mivel a törpök a sötét mágia megszállottjai lettek. \n\n A barlangokat ma már többnyire földalatti vadvilág, gnollok és elhagyatott gépek lakják; valószínűleg ugyanaz az erő rombolta meg őket, amely a fenti régiókat is érintette.
journal.document.intros.caves.title=Barlangok
journal.document.intros.city.body=A törp metropolisz egykor a legnagyobb törpe városállam volt. Fénykorukban a törpök csodálatos fém- és mágiagépeket építettek, amelyek lehetővé tették városuk gyors terjeszkedését.\n\nAztán egy napon a városkapukat bezárták, és senki sem hallott többé a törpök felől. A kevesek, akik elmenekültek a városból, amikor az bezárult, történeteket meséltek egy őrült varázslóról, aki ellopta a trónt, és a szörnyű mágiáról, amit megtanult kihasználni.
journal.document.intros.city.title=Törp Metropolisz
journal.document.intros.discover_hint=Ezt a szöveget akkor találod, amikor először lépsz be egy adott régióba.
journal.document.intros.dungeon.body=Sok hős merészkedett már előtted a kazamatába a fenti városból, de a legtöbbjükről soha többé nem hallottunk.\n\nÁllítólag egy ősi gonosz rejtőzik a mélyben, és Yendor mindenható amulettjét őrzi. Még most is sötét energia sugárzik alulról, és utat tör magának a városba.\n\nMeghódítod a kazamatát és megszerezed az amulettet? Itt az ideje, hogy elkezdd a saját kalandodat!
journal.document.intros.dungeon.title=Kazamata
journal.document.intros.halls.body=A törp metropolisz e mély csarnokait sötét mágia torzította el. A múltban ezek a régiók a törp király elit varázslókból álló udvarának adtak otthont, de most úgy tűnik, valami még baljósabb vette át az irányítást...\n\nMindenféle szörnyű démoni lény lakja ezeket a csarnokokat, akiket valamilyen szörnyű sötét hatalom vezet. Ha a törpök királya nem a terjedő romlás forrása, akkor annak kell lennie, ami itt lent van.\n\nÓvatosan járj, nagyon kevés kalandor jutott le idáig...
journal.document.intros.halls.discover_hint=Ezt a szöveget egy adott régióban találhatja meg, de csak miután megtalálta az összes korábbi szöveget ebben a készletben.
journal.document.intros.halls.title=Démoncsarnokok
journal.document.intros.prison.body=Sok évvel ezelőtt egy börtönt építettek itt veszélyes bűnözők elhelyezésére. Szigorúan ellenőrzött és biztonságos helyen, az ország minden tájáról ide hozták a fegyenceket, hogy letöltsék büntetésüket.\n\nDe hamarosan sötét miazma kezdett bekúszni alulról, eltorzítva az őr és a fogoly elméjét egyaránt.\n\nA növekvő káoszra válaszul a város lezárta az egész börtönt. Senki sem tudja, mi lett azokkal, akiket ezeken a falakon belül hagytak halni...
journal.document.intros.prison.title=Börtön
journal.document.intros.sewers.body=A kazamata felső emeletei alkotják valójában a város csatornarendszerét.\n\nAhogy a sötét energia felkúszott alulról, a rendszerint ártalmatlan csatornalények egyre vadabbakká váltak. A városnak őrjáratokat kellett ide küldenie, hogy megpróbálja fenntartani a fent lévők biztonságát.\n\nEz a hely veszélyes, de legalább a gonosz mágia gyenge itt.
journal.document.intros.sewers.title=Csatornázás
journal.document.intros.title=Régióbemutatók
journal.document.prison_warden.discover_hint=Ezt a szöveget egy adott régióban találhatja meg, de csak miután megtalálta az összes korábbi szöveget ebben a készletben.
journal.document.prison_warden.journal.body=Tavasz elseje, 362\n\nEz az első bejegyzés Kiana Smith börtönőr munkanaplójában. A legutóbbi események után úgy döntöttem, naplót vezetek, hogy rendszerezzem a gondolataimat.\n\nEgy fél mérfölddel a föld alatt lévő börtön irányítása sosem lesz könnyű, de mostanában úgy tűnik, mintha valamiféle szervezett zavargás történne. A rabok ok nélkül viselkednek, majd nem hajlandók elmagyarázni, miért.\n\nNéhány őr kezdi azt mondani, hogy a hely kísértetjárta. Nem hagyhatom, hogy a saját embereim pletykákat terjesszenek, de nem igazán hibáztathatom őket a nyugtalanságukért.\n- Smith
journal.document.prison_warden.journal.title=Napló vezetése
journal.document.prison_warden.letter.body=Thomas,\n\nNagyszerű barát voltál, szóval szívességet teszek neked.\n\nAmikor ma este elkezded a műszakodat, zárd be és erősítsd meg Tengu celláját, dobd a kulcsot egy mélyedésbe, és tűnj el. Nem számít, ha a többi rab felügyelet nélkül marad, hamarosan senki sem tudja majd elhagyni ezt a helyet. Annak a szörnyetegnek azonban biztonságban kell maradnia, ha megszökik, nem lehet tudni, mit fog tenni.\n\nSenkinek se mondd el ezt, és ne is keress engem. Egy kapitánynak el kell süllyednie a hajójával.\n- Kiana
journal.document.prison_warden.letter.title=Levél Tamásnak
journal.document.prison_warden.mines.body=Tél 54., 363\n\nMa érkezett egy csoport mérnök a városból, azzal a hírrel, hogy lezárják az alatta lévő bányák régi bejáratát. Gondolom, a város már nem akar bajlódni az átjáró karbantartásával. Engem nem tájékoztattak előre, mint általában.\n\nA főmérnökük ostobaságokat is mondott nekem a bányákból beszivárgó törpe mágiáról. Egy szót sem hiszek el belőle.\n\nA helyzet sokkal jobban kézben van az új személyzettel, de a probléma gyökerét még mindig nem sikerült megoldani. Valami határozottan hatással van az itt élőkre, és néhány fal lebontása nem fogja ezt megváltoztatni.\n- Smith
journal.document.prison_warden.mines.title=A bányák lezárása
journal.document.prison_warden.no_support.body=Tavasz 11., 364\n\nMi a fenét gondolhat a város? Miután sürgősen segítséget kértem, semmit sem hallottam, még csak üres bocsánatkérést sem, mint amit általában küldenek, amikor elutasítják a kéréseimet.\n\nEközben a fogvatartottak helyzete egyre rosszabb, és néhány őr is elkezdett bajt okozni. Azt tervezik, hogy hagyják, hogy ez csak rosszabbodjon, amíg zavargás nem lesz!?\n\nThomas legalábbis a régihez hasonlóan megbízható maradt. A szervezési segítsége felbecsülhetetlen értékű volt, és az ötlete, hogy aktiválja azokat a régi DM-100-as egységeket, sajnálatos volt, de szükséges. Biztos vagyok benne, hogy újra uralni tudom ezt a helyzetet, csak egy kis átkozott támogatásra van szükségem!\n-Smith
journal.document.prison_warden.no_support.title=Nincs támogatás
journal.document.prison_warden.recruits.body=80. tavasz, 362\n\nAhogy ígértem, ma egy csomó újonc érkezett. A szokásos módon, néhány ígéretes és sok gyenge, akik csak a fizetést akarják. Mégis, ez az új izomtömeg sokat segíthet a nemrégiben rendbontó rabjainkkal.\n\nEgy ilyen munkában fontos tudni, hogy kiben bízhatunk. Egy új alkalmazott, Thomas, különösen ígéretesnek tűnik. Minden segítségre szükségem van, amit most azonnal kaphatok, szóval ha jól teljesít, akkor gyorsan megpróbálom előléptetni.\n- Smith
journal.document.prison_warden.recruits.title=Újoncok
journal.document.prison_warden.rotberry.body=Ősz 23., 363\n\nMa egy kedves ajándékot kaptam Felixtől. Valami élénkpiros cserje, amit 'Rotberry'-nek hívnak.\n\nMár említettem neki, milyen sivár ez a hely, úgy tűnik, hallgatott rám. Szerinte ez a növény valójában nem szereti a fényt és a vizet, ezért csak havonta egyszer kell visszavágnom a leveleit. A metszésnek viszont fontosnak kell lennie, legalább egy tucatszor említette a levelében.\n\nTermészetesen Felix soha semmit nem csinál ingyen. Azt mondja, hogy a magok, amiket ez a növény terem, nagyszerűek pálcák készítéséhez, szóval természetesen tartozom neki néhánykal minden alkalommal, amikor a növény terem.\n- Smith
journal.document.prison_warden.rotberry.title=Rotberry növény
journal.document.prison_warden.title=Warden naplója
journal.document.sewers_guard.crabs.body=Tél 11., 376\nKedves Anya és Apa!\n\nMintha a patkányok nem lennének elég rosszak, mélyebben óriási rákok vannak! Az egyikük elrohant mellettem, és elég csúnyán megsebesítette Lee-t, mielőtt megöltük volna. Thomas azt mondja, nem az én hibám, de tudom, hogy csak próbál kedves lenni hozzám.\n\nSzerencsére kifelé menet belefutottunk egy kalandorba, akinél volt egy kis napraforgóolajkenőcs. Lee talán nem élte volna túl anélkül a cucc nélkül.\n\nLáttam, hogy a kalandor egy rózsát bámul, mielőtt elmentek, azt mondták, hogy ajándék. Miért kockáztatnák az életüket itt lent, ha valaki ennyire törődik velük?\n\nPontosan ezt csinálom én is, nem igaz? Úgy érzem, túl messze vagyok a valóságtól.
journal.document.sewers_guard.crabs.title=Óriásrákok!
journal.document.sewers_guard.dangerous.body=88. ősz, 375\nKedves Anya és Apa!\n\nMegértem, miért olyan jók most a fizetések, a csatornákat ellepték a szörnyek! A „férgek” és a „törvényen kívüliek” óriási, vérszomjas patkányok és dühös gnollok falkái.\n\nSzerencsére a csapatom többi tagja tényleg tudja, mit csinál. A csapatkapitányunk, Thomas, szakértő ebben. Igyekszem gyorsan tanulni, hogy ne legyek túl nagy teher.\n\nEz a munka sokkal veszélyesebb, mint gondoltam. Örülök, hogy most nem küldhetem el ezeket, nem akarom, hogy aggódj.\n\nVigyázok magamra,\n- Sonya
journal.document.sewers_guard.dangerous.title=Veszélyes helyzet...
journal.document.sewers_guard.discover_hint=Ezt a szöveget egy adott régióban találhatja meg, de csak miután megtalálta az összes korábbi szöveget ebben a készletben.
journal.document.sewers_guard.guild.body=Tél 23., 376\nKedves Anya és Apa!\n\nEzúttal nem érkeztünk új szörnyekkel, ehelyett járőrözés közben belefutottunk egy kis csoportba a tolvajok céhéből.\n\nMinden, amit a céhről hallottam, rossz, de a csapatom többi tagja szinte baráti viszonyban volt velük. Thomas információkat és felszereléseket cserélt az egyikükkel, mielőtt külön utakra indultunk.\n\nNem értem, nem a törvényen kívüliektől kellett volna megszabadulnunk? Thomas még azt is mondta, hogy ezt ne említsük senkinek a parancsnokok között. Az információik és a felszereléseik nagyon hasznosak voltak, és nem bírtuk volna elviselni a még több harcot.\n\nAzt hiszem, mindannyian együtt vagyunk ebben itt lent.
journal.document.sewers_guard.guild.title=A Tolvajok Céhe
journal.document.sewers_guard.lost.body=Tél 40., 376\n\nThomas és én eltévedtünk. Elűztek minket a csapat többi tagjától, miközben néhány gnoll-lal harcoltunk. Egyikünk sem sérült meg, de az alsó csatornák olyanok, mint egy labirintus.\n\nThomas azt mondja, ismer egy kivezető utat, de az a csatornák alján lévő régi börtönbejáratnál kezdődik. Nem igazán szeretek mélyebbre menni, de nincs ellátmányunk, és a lefelé vezető út sokkal gyorsabb, mint a járőrözési útvonalunkat keresve bolyongani.\n\nMinden rendben lesz. Thomas tudja, mit csinál.
journal.document.sewers_guard.lost.title=Elveszettek vagyunk
journal.document.sewers_guard.new_position.body=85. ősz, 375\nKedves Anya és Apa!\n\nMegmondtam nektek, hogy a városi őrségnél végzett kemény munka megtérül. Most léptettek elő!\n\nMeghívtak egy csatornázással foglalkozó szakértői csapatba. Úgy tűnik, problémák vannak a kártevőkkel és a törvényen kívüliekkel, és a mi dolgunk, hogy kitakarítsuk őket. Piszkos munka, de a csatornák télen melegek, és háromszor annyit keresnek, mint a rendes őrség!\n\nDe mindez egy kicsit titkos, szóval nem tudom elküldeni ezt a levelet. Furcsa érzés, hogy nem írok nektek, úgyhogy mindenképpen folytatom az írást. Talán egy nap megmutathatom nektek.\n\nLegjobb,\n- Sonya
journal.document.sewers_guard.new_position.title=Az új pozícióm!
journal.document.sewers_guard.not_worth.body=Thomasszal valami hatalmas iszapszörnybe botlottunk a börtön bejáratánál. Mielőtt reagálhattunk volna, varázslattal bombázott minket. Thomas elvitte a nagy részét. Eltűnt.\n\nSemmi pénz nem éri meg ezt. Azon az útvonalon megyek el, amelyről Thomas mesélt. Aztán fogom, amit őrként kerestem, és azzal költöztetem el a szüleimet és magamat ebből az átkozott városból. Egy részem remélni szeretné, hogy a királynak van terve erre az egészre, de kétlem.\n\nEzeket a leveleket figyelmeztetésül hagyom másoknak. Több van itt, mint óriási patkányok és rákok, valami nagyon nincs rendben itt lent.
