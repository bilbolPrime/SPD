journal.document.adventurers_guide.alchemy.body=Если расходуемый предмет вам не пригоден, вы можете использовать его в качестве ингредиента для алхимии или превратить в универсальную алхимическую энергию. Зелья и свитки, повышающие энергию, также позволяют их идентифицировать! (Амулеты — это уникальный вид снаряжения, который создается и улучшается с помощью алхимии. Они изготавливаются с помощью магического катализатора для амулетов и небольшого количества алхимической энергии.) (Первый алхимический горшок находится на 3-м или 4-м этаже подземелья. Рядом с этими горшками также находятся страницы книги алхимических рецептов.)
journal.document.adventurers_guide.alchemy.title=Алхимия и безделушки
journal.document.adventurers_guide.dieing.body=Исследование подземелий опасно, и большинство искателей приключений в конечном итоге погибают. Удача помогает, но лучшие искатели приключений используют любую мелочь, чтобы повысить свои шансы. (Не расстраивайтесь, если вы часто умираете, эта игра сложная! Сосредоточьтесь на изучении игры и постоянном совершенствовании, а не на мгновенной победе.)
journal.document.adventurers_guide.dieing.title=Преодоление поражения
journal.document.adventurers_guide.examining.body=Важно изучать врагов и окружение, а не бросаться в бой вслепую! Приучитесь изучать всё новое. (Вы можете изучать, используя кнопку с изображением лупы и выбрав нужный объект. Вы также можете изучать положительные или отрицательные эффекты, выбрав их значки.)
journal.document.adventurers_guide.examining.title=Изучение
journal.document.adventurers_guide.food.body=Эффективное распределение продуктов — один из лучших способов повысить шансы на выживание. Необязательно есть сразу же, как только почувствуешь голод! Когда вы не голодаете, ваше здоровье будет медленно восстанавливаться, поэтому, если вы будете есть, будучи полностью здоровым, это восстановление будет потрачено впустую! Если вы будете распределять время приема пищи в зависимости от вашего здоровья, еды вам хватит гораздо дольше.
journal.document.adventurers_guide.food.title=Борьба с голодом
journal.document.adventurers_guide.identifying.body=Цвета зелий и символов на свитках различаются в каждом подземелье. Неопознанное снаряжение можно улучшить или зачаровать, если повезет, а может быть, оно проклято! Свитки идентификации, улучшения или снятия проклятия очень полезны, если вы хотите снизить риск использования неопознанного снаряжения. (Список всех идентифицированных вами предметов можно найти на вкладке каталога в вашем журнале)
journal.document.adventurers_guide.identifying.title=Идентификационные элементы
journal.document.adventurers_guide.intro.body=Приветствую, искатель приключений! Вы читаете «Том мастерства подземелий»! Это руководство лучше всего использовать в качестве справочника, и оно волшебным образом подскажет вам, когда лучше всего читать каждую страницу. (Когда замигает кнопка журнала, выберите её, чтобы прочитать то, что написано в руководстве! Некоторые страницы отсутствуют, возможно, вы сможете найти их в подземелье?)
journal.document.adventurers_guide.intro.title=Введение
journal.document.adventurers_guide.levelling.body=Повышение уровня увеличивает ваши характеристики и дает очки талантов, что может существенно повлиять на исход боя. Лучше всего иметь хотя бы один уровень на каждом этаже подземелья. (Может возникнуть соблазн поторопиться и избегать исследования или боя, но это лишит вас припасов и опыта.) (Вы можете увидеть информацию о своем герое, включая опыт, на панели состояния в углу игрового интерфейса. Выберите портрет своего героя, чтобы получить еще больше информации.)
journal.document.adventurers_guide.levelling.title=Получение опыта
journal.document.adventurers_guide.looting.body=В комнатах за запертыми дверями или с препятствиями обычно можно найти более ценную добычу. Если препятствие блокирует ваш путь, вы, как правило, можете найти полезный предмет на том же этаже. (В каждом пятиэтажном подземелье вы всегда сможете найти 2 зелья силы и 3 свитка улучшения, что является отличным показателем того, насколько хорошо вы исследуете локации.) (Список ориентиров и неиспользованных ключей можно увидеть на вкладке «Заметки» в окне журнала.)
journal.document.adventurers_guide.looting.title=Эффективное мародерство
journal.document.adventurers_guide.magic.body=Магические атаки прорезают броню насквозь и от них трудно увернуться. Это означает, что урон от волшебных палочек очень надежен, но также делает магических врагов очень опасными! Однако у магических атак всегда есть недостаток. У волшебных палочек ограниченное количество зарядов, и магические враги обычно не могут использовать свою магию на близком расстоянии. При столкновении с врагами, использующими магию, важно научиться предотвращать их использование против вас.
journal.document.adventurers_guide.magic.title=Магические атаки
journal.document.adventurers_guide.positioning.body=Стратегия так же важна, как и снаряжение. Неприятных ситуаций, таких как окружение, обычно можно избежать, правильно расположившись. Например, в большинстве подземелий есть узкие коридоры, которые заставляют врагов сражаться с вами по одному. В этих коридорах часто есть дверные проемы для внезапных атак! Существует множество способов использовать особенности окружающей среды, такие как трава, вода, ямы или ловушки, в своих интересах.
journal.document.adventurers_guide.positioning.title=Позиционирование
journal.document.adventurers_guide.searching.body=Подземелья полны потайных дверей и ловушек, которые на первый взгляд кажутся невидимыми. Вы можете потратить некоторое время и тщательно обыскать подземелье, если подозреваете, что где-то поблизости спрятана дверь или ловушка. (Вы можете обыскать все клетки вокруг себя, дважды нажав кнопку с увеличительным стеклом. Возможно, рядом с местом, где вы нашли эту страницу, есть скрытые двери!)
journal.document.adventurers_guide.searching.title=Идет поиск
journal.document.adventurers_guide.strength.body=Времени на тренировки с оружием и доспехами, найденными в подземелье, нет, поэтому для их эффективного использования вам потребуется грубая сила. Зелья силы и свитки улучшения — наиболее эффективный способ соответствовать требованиям к силе для снаряжения более высокого уровня. Важно в конечном итоге начать использовать предметы высокого уровня, но не стоит игнорировать снаряжение, которое вы можете использовать прямо сейчас.
journal.document.adventurers_guide.strength.title=Сила
journal.document.adventurers_guide.surprise_attacks.body=Внезапные атаки гарантированно попадают в цель, что делает их особенно полезными против уклоняющихся врагов, таких как змеи и призраки. Вы можете застать врагов врасплох сразу после того, как они войдут в дверной проем, преследуя вас, или когда они потеряют вас из виду.
journal.document.adventurers_guide.surprise_attacks.title=Внезапные нападения
journal.document.adventurers_guide.title=том мастерства подземелий
journal.document.adventurers_guide.upgrades.body=Чем глубже вы проникаете в подземелье, тем важнее использовать магически улучшенное снаряжение высокого уровня, но вам также потребуется сила, чтобы правильно его использовать. Жезлы, кольца и артефакты не требуют силы, но имеют ограниченное применение или не так непосредственно помогают в бою. Правильный выбор улучшений очень важен для выживания на ранних этапах подземелья и для обеспечения успеха на более поздних этапах.
journal.document.adventurers_guide.upgrades.title=Обновления
journal.document.alchemy_guide.bombs.body=Стандартную бомбу с чёрным порохом можно смешать с определённым предметом, чтобы создать бомбу повышенной мощности.
journal.document.alchemy_guide.bombs.title=Усовершенствованные бомбы
journal.document.alchemy_guide.brews_elixirs.body=Настойки и эликсиры — это сложные зелья с разнообразными эффектами, обычно рассчитанные на однократное применение.
journal.document.alchemy_guide.brews_elixirs.title=пиво и эликсиры
journal.document.alchemy_guide.energy_food.body=Для многих рецептов требуется кристаллическая алхимическая энергия, которая получается путем разборки расходуемых предметов в алхимическом котле. Энергетические зелья или свитки также позволяют их идентифицировать. Некоторые рецепты, требующие энергии, являются магическими, но эти напоминают традиционную кулинарию.
journal.document.alchemy_guide.energy_food.title=Энергетика и продовольствие
journal.document.alchemy_guide.exotic_potions.body=Зелья можно смешивать с энергией для создания экзотических зелий. Они обладают более мощным действием, но часто полезны в других целях.
journal.document.alchemy_guide.exotic_potions.title=экзотические зелья
journal.document.alchemy_guide.exotic_scrolls.body=Экзотические свитки можно изготовить, используя некоторое количество энергии и свиток. Они немного сильнее и дороже, чем экзотические зелья.
journal.document.alchemy_guide.exotic_scrolls.title=экзотические свитки
journal.document.alchemy_guide.potions.body=Добро пожаловать в «Практическое применение алхимии»! Эта книга — справочник рецептов для создания предметов в алхимическом котле. Начнём с самого известного рецепта: зелья! Используйте три семени, чтобы сварить случайное зелье! Каждое семя имеет аналог для зелья, используйте несколько одинаковых семеней, чтобы увеличить вероятность того, что зелье будет связано с использованными вами семенами.
journal.document.alchemy_guide.potions.title=Введение и зелья
journal.document.alchemy_guide.spells.body=Заклинания заключены в кристаллах и обладают разнообразными эффектами, обычно с возможностью многократного применения.
journal.document.alchemy_guide.spells.title=заклинания
journal.document.alchemy_guide.stones.body=Если положить свиток в алхимический сосуд, его магия проникнет в два камня внутри сосуда. Это создаст рунические камни и позволит идентифицировать свиток!
journal.document.alchemy_guide.stones.title=Создание рунических камней
journal.document.alchemy_guide.title=Руководство по алхимии
journal.document.alchemy_guide.weapons.body=Некоторые из более лёгких или магических видов оружия можно использовать в алхимии! Каждый набор метательного оружия производит достаточно жидкого металла, чтобы полностью починить другой набор того же уровня и ранга. Обратите внимание, что алхимическая обработка набора уничтожит его целиком, даже если он не весь! Одна палочка произведёт достаточно магической смолы, чтобы улучшить две палочки того же уровня, но не выше +3.
journal.document.alchemy_guide.weapons.title=Усовершенствование оружия
journal.document.caves_explorer.alive.body=23-го лета, 308\n\nОдна из гномьих машин каким-то образом ожила! Мы просто проходили мимо, когда она бросилась в атаку и чуть не раздавила двоих из нашей группы своими огромными металлическими кулаками. К счастью, у меня с собой была палочка распада. Несколько метких выстрелов, и эта чудовищная штука превратилась в груду металлолома.\n\nМеня беспокоит то, что мы абсолютно ничего не сделали, чтобы спровоцировать машину. Гномы никак не могли спроектировать машины настолько агрессивными, как будто она пыталась устроить нам засаду!\n\nПо крайней мере, я смог хоть раз помочь своим товарищам.\n- Арчибальд
journal.document.caves_explorer.alive.title=Оно живо!
journal.document.caves_explorer.city.body=21-е лето, 308\n\n Прошло уже три недели, и после того, как мы провели большую часть последних десяти дней, углубляясь все дальше в шахты, мы наконец достигли дна. Мы обнаружили различные металлические приспособления и огромные ворота, которые преграждают вход в старый гномий мегаполис.\n\n Кузнец предупредил нас о некоторых из этих механизмов. По-видимому, они предназначались для защиты территории и имеют тенденцию активироваться при беспокойстве. Нам не место в городе, а металл будет иметь минимальную ценность в качестве лома, поэтому мы решили прислушаться к его предупреждению и вернуться обратно.\n\n Должен признать, мне было любопытно, но расследование там, внизу, определенно не стоило риска.\n - Арчибальд
journal.document.caves_explorer.city.title=Вход в город
journal.document.caves_explorer.discover_hint=Этот текст можно найти в определённом регионе, но только после того, как будут найдены все предыдущие тексты из этого набора.
journal.document.caves_explorer.expedition.body=1-го числа лета 308\n\nСегодня начинается наша четырехнедельная экспедиция в заброшенные гномьи шахты! Король лично поручил мне исследовать этот регион. Мои главные цели — найти любые неиспользованные природные ресурсы и обследовать пещеры на предмет возможного строительства тюрьмы.\n\nХотя я способен защитить себя, по настоянию короля я принял сопровождение городской стражи. Они — кучка простаков, но пока они меня не замедляют, их присутствие терпимо.\n\nМы должны очистить канализацию и добраться до шахт к вечеру.\n — Арчибальд Драммонд. Архимаг, Южный институт волшебников.
journal.document.caves_explorer.expedition.title=Начало экспедиции!
journal.document.caves_explorer.gold.body=4-е лето, 308\n\nНаши первые несколько дней были действительно очень плодотворными! Разбив базовый лагерь, мы отправились исследовать верхние участки заброшенной шахты. Хотя гномы оставили много бесполезного хлама, многие стены пещер также кишат золотом!\n\nК сожалению, мы здесь не первые. Пещеры кишат агрессивной дикой природой, и, похоже, стаи гноллов тоже заинтересованы в золоте. Признаю, я был несправедлив к своему сопровождению, они оказались гораздо более способными исследователями и телохранителями, чем я ожидал.\n\nДаже с этим успехом нам еще предстоит исследовать большую часть шахт.\n- Арчибальд
journal.document.caves_explorer.gold.title=Столько золота!
journal.document.caves_explorer.report.body=28-го числа лета, 308\n\nСегодня мы закончим собирать вещи и подготовимся к отъезду. Как раз вовремя, несколько человек из нашей группы начали видеть ужасные кошмары после инцидента с агрессивной машиной. Вероятно, это просто усталость, но их кошмары тревожно похожи.\n\nВкратце, верхние участки шахты довольно безопасны. Если найти применение темному золоту, то его добыча может оказаться весьма прибыльной. Большие открытые пространства также отлично подойдут для планов строительства города. Однако нижние шахты более опасны, и их следует избегать.\n\nЯ все это запишу в свой итоговый отчет в течение следующих нескольких дней.\n- Арчибальд
journal.document.caves_explorer.report.title=Итоговый отчет
journal.document.caves_explorer.title=Журнал исследователя
journal.document.caves_explorer.troll.body=11-го числа лета, 308\n\nНачав наше исследование средней части шахт, мы наткнулись на дружелюбное лицо! Ну... относительно дружелюбное. Пещерный тролль обустроил там небольшую кузницу. Он груб и не очень разговорчив, но починил наше снаряжение в обмен на немного золота.\n\nК сожалению, тролль-кузнец также сообщил нам, что все это прекрасное золото не так уж и ценно, как кажется. Он называет его «темным золотом», и оно, по-видимому, быстро разлагается на солнце. Это, безусловно, объясняет, почему здесь никогда не было конфликтов из-за ресурсов.\n\nПолагаю, нам нужно копнуть немного глубже, чтобы посмотреть, нет ли чего-нибудь более ценного.\n- Арчибальд
journal.document.caves_explorer.troll.title=Встретил тролля
journal.document.city_warlock.discover_hint=Этот текст можно найти в определённом регионе, но только после того, как будут найдены все предыдущие тексты из этого набора.
journal.document.city_warlock.failure.body=Похоже, я тоже дурак. Я предполагал, что Новому Королю нужно, чтобы двор подчинялся ему добровольно, но теперь я вижу, что он обладает властью контролировать даже тех, кто ему сопротивляется. Я вслепую привел всех самых сильных противников прямо к его порогу, чтобы он лично превратил их в своих рабов. Теперь волны его некротической энергии прокатываются по городу, мгновенно превращая большинство в своих просителей. Те немногие, кто еще сохранил свободу воли, бегут. Я решил остаться, чтобы как можно лучше наблюдать и искать возможность для атаки. С моей магической силой я смогу оставаться в укрытии и безопасности некоторое время.
journal.document.city_warlock.failure.title=Отказ
journal.document.city_warlock.more_powerful.body=Следить за временем стало сложно, но с момента моей последней записи прошла примерно неделя. Наша цивилизация действительно рухнула. Ворота закрыты, все функции нашего общества прекратились, и по коридорам бродят пустые гномьи оболочки. Несмотря на всё это, Новый Король каким-то образом становится ещё могущественнее. С каждым днём сила его воли усиливается, но она также меняется. Я не могу это описать, но кажется, будто он больше не гном. Я начинаю понимать, что лучшее, на что я могу надеяться, — это задокументировать эти события. Я останусь здесь столько, сколько смогу, а затем удалюсь, когда моя воля начнёт ослабевать.
journal.document.city_warlock.more_powerful.title=Более мощный
journal.document.city_warlock.new_power.body=Что здесь происходит? Сила, исходящая от Нового Короля, действительно отличается от первоначальной, но есть и кое-что ещё. Эта новая сила, кажется, излучается из самых сокровенных залов нашего города. Ещё более загадочно то, что активность в верхней части мегаполиса также снизилась. Я не знаю, что там происходит, но это привлекает почти всё внимание Нового Короля. Возвращение в глубины залов будет опасным, но я должен выяснить, что вызывает эти изменения. Возможно, у Нового Короля всё-таки есть слабость?
journal.document.city_warlock.new_power.title=Новая сила
journal.document.city_warlock.old_king.body=Сегодня пятый день второго месяца 33-го года эпохи магии. Если это читает кто-то из надземного мира, то сейчас зима 264 года. Меня зовут Тимор Захир, и, насколько мне известно, я последний выживший член двора гномов. Наш король мертв, его место занял один из моих бывших коллег, сошедший с ума от власти. Остальные члены двора подчинились ему, как глупцы, и потеряли при этом свободу воли. Только я предвидел это и бежал до завершения его ритуала. Внутренний круг пал, но власть Нового Короля еще не достигла всех. Я должен как можно быстрее оказать сопротивление. Я отказываюсь позволить нашей славной цивилизации пасть под натиском этого мегаломана!
journal.document.city_warlock.old_king.title=Король мертв
journal.document.city_warlock.resistance.body=Весть, похоже, распространилась быстро. Прошло всего несколько дней, а я уже собрал небольшую армию верных сторонников Старого Короля. Немногие владеют магией, но почти весь орден монахов-воинов среди нас. Мы должны справиться с одним безумным гномом и его двором рабов. Тем временем Новый Король спрятался во внутренних покоях нашего города. Несомненно, он израсходовал большую часть своей силы и надеется восстановиться, прежде чем встретит больше сопротивления. Мы начнем атаку через пару часов. Если повезет, мы сможем сформировать временный совет и вернуть нашему чудесному городу стабильность к концу ночи.
journal.document.city_warlock.resistance.title=Сопротивление
journal.document.city_warlock.seen_it.body=Я видел то, что лежит внизу, но не могу это описать. Мои руки неконтролируемо дрожат, когда я пытаюсь изложить свои мысли на бумаге. Почему это происходит? Это сделал Новый Король? Это не имеет смысла. Возможно, его безрассудное использование власти привлекло это? Я надеялся спасти нашу цивилизацию, но теперь вижу, что на кону стоит весь мир. Каким-то образом король оказывается меньшим злом. У меня нет другого выбора, ради высшего блага я сдамся. Пожалуйста, направь меня, мой король, используй меня как орудие, чтобы сдержать Йог-Дзеву!
journal.document.city_warlock.seen_it.title=Я это видел
journal.document.city_warlock.title=Дневник чернокнижника
journal.document.halls_king.amulet.body=Я СДЕЛАЛ ЭТО!\n\nЯ не знал точно, что найду, но то, что я обнаружил там, превзошло все мои самые смелые предположения. Столько силы, просто лежит там, готовая быть захваченной, и вся она моя!\n\nБлагодаря этому ни один из дураков при дворе не посмеет мне противостоять. Я просто в восторге от мысли о том, как я мог бы их унизить. Черт возьми, зачем останавливаться на этом, у меня достаточно силы, чтобы уничтожить каждого из них, если захочу! Это может быть чрезмерно, но я не должен слишком долго принимать решение, иначе они заподозрят неладное.\n\nДумаю, я назову эту великую силу Амулетом Йендора!\n- R.
journal.document.halls_king.amulet.title=Амулет
journal.document.halls_king.attrition.body=У меня есть план, как с этим справиться. Его сила безгранична, но его способность посягать на этот мир — нет. Он полагается на своих приспешников и аватаров, которые будут выполнять его приказы, пока он пытается накопить достаточно силы, чтобы завладеть амулетом. Хотя физически я не владею амулетом, я всё ещё полностью контролирую его силу. Имея в своём распоряжении весь город гномов, я также обладаю численным преимуществом. Я могу просто продолжать посылать солдат, чтобы помешать ему захватить амулет, и постепенно выигрывать эту войну на истощение! Я, Родни, король гномов, переживу тебя, Йог-Дзева!
journal.document.halls_king.attrition.title=Потертость
journal.document.halls_king.discover_hint=Этот текст можно найти в определённом регионе, но только после того, как будут найдены все предыдущие тексты из этого набора.
journal.document.halls_king.new_king.body=Я КОРОЛЬ, АХАХАХААА!\n\nОни просто позволили мне это сделать! Почти без всяких уговоров они согласились позволить мне «поделиться» с ними этой властью в великом ритуале. В одно мгновение они превратились из хора насмешливых голосов в мой новый двор молчаливых подданных!\n\nКак и ожидалось, Тимор сбежал, как трус, при первом же признаке беды. Я уже чувствую, как он наращивает силы сопротивления. Думаю, я позволю ему продолжать, чтобы он мог доставить всех своих заговорщиков прямо ко мне!\n\nОчевидно, королевство тоже меня не уважает, полагаю, я это тоже исправлю.\n - Король гномов
journal.document.halls_king.new_king.title=Новый Король
journal.document.halls_king.rejection.body=ИДИОТЫ!\n\nЗа последние 33 года наше королевство процветало благодаря новым магическим технологиям. Мы научились призывать элементальных духов и подчинять их своей воле, но почему-то теперь дальнейшие эксперименты «слишком опасны».\n\nЯ знаю, что происходит на самом деле. Отвержение моих теорий не имеет ничего общего с их достоинством, а связано исключительно с тем, кто их выдвигает. Вероятно, все они смеются надо мной за моей спиной.\n\nНу, хватит! Мне плевать, что они говорят, я буду исследовать самые дальние уголки нашей вселенной в одиночку и оставлю все, что открою, себе!\n- R.
journal.document.halls_king.rejection.title=Отказ
journal.document.halls_king.ritual.body=Сегодня утром Тимор публично выступил против меня и настоял на объяснении моего нового источника силы. Я отмахнулся от него, как мог, но снова чувствую на себе осуждающие взгляды остального двора. Я надеялся немного больше насладиться затишьем перед бурей, но это не имеет значения. Я решил, что хочу сделать. Я заявлю, что получил свою силу посредством нового ритуала, и предложу провести его над другими колдунами и королем. Как только ритуал закончится, я стану королем! Тимор, конечно, будет протестовать, но с такой силой, которую он предлагает, сомневаюсь, что они его послушают! ВСЕ ПОКЛОНЯТСЯ МНЕ! — Будущий король гномов
journal.document.halls_king.ritual.title=Ритуал
journal.document.halls_king.thing.body=Проблема. Тимор был повержен без труда, но, похоже, мои поиски во внешних мирах не остались незамеченными. Какое-то… «существо»… привлекло мой мир, и оно начинает пробираться вниз, в нижние залы. Чтобы еще больше осложнить ситуацию, именно там я хранил амулет! Какое злобное создание, почему оно пытается лишить меня моей силы, когда вокруг еще много чего можно забрать? Несмотря на мою силу, я не думаю, что смогу просто броситься в бой. Его истинная мощь непостижима, но должен быть какой-то способ её ограничить. Я БУДУ ЗАЩИЩАТЬ СВОЙ ПРИЗ!
journal.document.halls_king.thing.title=Вещь
journal.document.halls_king.title=Дневник ???
journal.document.intros.caves.body=Эти малонаселенные пещеры простираются под заброшенной тюрьмой. Богатые минералами, они когда-то были центром процветающей торговли и промышленности для гномьего общества, проживавшего внизу, но были заброшены, когда гномы увлеклись темной магией. Сейчас пещеры в основном населены подземными животными, гноллами и заброшенной техникой; вероятно, они подверглись воздействию той же силы, которая повлияла на регионы наверху.
journal.document.intros.caves.title=Пещеры
journal.document.intros.city.body=Гномья метрополия когда-то была величайшим из всех гномьих городов-государств. В период своего расцвета гномы строили чудесные машины из металла и магии, которые позволяли их городу быстро расширяться. Затем, однажды, городские ворота были заперты, и о гномах больше никто ничего не слышал. Немногие, кому удалось сбежать из города, когда он закрылся, рассказывали истории о безумном колдуне, который украл трон, и об ужасной магии, которую он научился использовать.
journal.document.intros.city.title=Гномья метрополия
journal.document.intros.discover_hint=Этот текст можно найти при первом посещении определенного региона.
journal.document.intros.dungeon.body=Многие герои до вас спускались в подземелье из города наверху, но о большинстве из них больше ничего не было слышно. Говорят, что в глубинах таится древнее зло, охраняющее всемогущий Амулет Йендора. Даже сейчас темная энергия излучается снизу, поднимаясь в город. Сможете ли вы покорить подземелье и заполучить амулет? Пришло время начать собственное приключение!
journal.document.intros.dungeon.title=Подземелье
journal.document.intros.halls.body=Эти глубокие залы гномьего мегаполиса искажены темной магией. В прошлом эти регионы были пристанищем для элитных колдунов гномьего короля, но теперь, похоже, они захвачены чем-то еще более зловещим… В этих залах обитают всевозможные ужасающие демонические существа, которыми управляет некая ужасная темная сила. Если Король гномов не был источником распространяющейся скверны, то то, что находится здесь, должно быть, им является. Будьте осторожны, очень немногие искатели приключений когда-либо спускались так далеко…
journal.document.intros.halls.discover_hint=Этот текст можно найти в определённом регионе, но только после того, как будут найдены все предыдущие тексты из этого набора.
journal.document.intros.halls.title=Залы Демонов
journal.document.intros.prison.body=Много лет назад здесь была построена тюрьма для содержания опасных преступников. Строго охраняемая и защищенная, она принимала заключенных со всей страны, которые прибывали сюда, чтобы отбывать наказание. Но вскоре из-под стен начала подниматься мрачная атмосфера, искажая сознание как охранников, так и заключенных. В ответ на нарастающий хаос город закрыл всю тюрьму. Никто не знает, что стало с теми, кто был оставлен умирать в этих стенах...
journal.document.intros.prison.title=Тюрьма
journal.document.intros.sewers.body=Верхние этажи подземелья фактически представляют собой городскую канализационную систему. По мере того, как темная энергия проникает снизу, обычно безобидные канализационные существа становятся все более свирепыми. Городу приходится посылать сюда патрули охраны, чтобы попытаться обеспечить безопасность тех, кто находится наверху. Это место опасно, но, по крайней мере, злая магия, действующая здесь, слаба.
journal.document.intros.sewers.title=Канализация
journal.document.intros.title=Введение в регионы
journal.document.prison_warden.discover_hint=Этот текст можно найти в определённом регионе, но только после того, как будут найдены все предыдущие тексты из этого набора.
journal.document.prison_warden.journal.body=1-го числа весны, 362\n\n Это первая запись в рабочем дневнике начальника тюрьмы Кианы Смит. В связи со всем, что происходит в последнее время, я решила завести дневник, чтобы упорядочить свои мысли.\n\nУправлять тюрьмой, расположенной в полумиле под землей, никогда не было легко, но в последнее время кажется, что происходит какое-то организованное нарушение порядка. Заключенные ведут себя неподобающе без причины, а затем отказываются объяснять, почему.\n\nНекоторые охранники начинают говорить, что это место населено призраками. Я не могу позволить своим людям распространять слухи, но я не могу винить их за беспокойство.\n- Смит
journal.document.prison_warden.journal.title=Ведение дневника
journal.document.prison_warden.letter.body=Томас, \n\n Ты был отличным другом, поэтому я делаю тебе одолжение. \n\n Когда начнёшь свою смену сегодня вечером, запри и укрепи камеру Тэнгу, брось ключ в какую-нибудь нишу и уходи. Неважно, если другие заключённые останутся без присмотра, очень скоро никто не сможет покинуть это место. Но этот урод должен оставаться в безопасности, если он сбежит, кто знает, что он сделает. \n\n Никому об этом не говори и не утруждайся меня искать. Капитан должен погибнуть вместе со своим кораблём. \n- Киана
journal.document.prison_warden.letter.title=Письмо Томасу
journal.document.prison_warden.mines.body=54-е Зимнее, 363\n\n Сегодня приехала группа инженеров из города, заявив, что они здесь, чтобы запечатать старый вход в шахты внизу. Полагаю, город больше не хочет заниматься обслуживанием прохода. Меня, как обычно, не предупредили заранее.\n\n Их главный инженер также рассказал мне какую-то чушь о гномьей магии, проникающей из шахт. Я ни единому слову не верю.\n\nСитуация находится под гораздо лучшим контролем благодаря нашему новому персоналу, но корень проблемы до сих пор не решен. Что-то определенно влияет на обитателей этого места, и снос нескольких стен этого не изменит.\n- Смит
journal.document.prison_warden.mines.title=Запечатывание шахт
journal.document.prison_warden.no_support.body=11-го числа весны, 364\n\nЧто, черт возьми, думает город? После срочной просьбы о помощи я ничего не услышал, даже пустых извинений, как обычно, когда мои просьбы отклоняют.\n\nТем временем ситуация с заключенными продолжает ухудшаться, а некоторые охранники даже начали создавать проблемы. Они что, планируют позволить этому ухудшаться, пока мы не столкнемся с бунтом?!\n\nТомас, по крайней мере, остался надежным, как всегда. Его организаторская помощь была неоценима, а его идея активировать старые установки DM-100 была прискорбной, но необходимой. Я уверен, что смогу взять ситуацию под контроль, мне просто нужна чертова поддержка!\n-Смит
journal.document.prison_warden.no_support.title=Нет поддержки
journal.document.prison_warden.recruits.body=80-е число весны, 362\n\n Как и обещали, сегодня прибыла группа новобранцев. Кажется, всё как обычно: несколько многообещающих и много рядовых, которые просто хотят получать зарплату. Тем не менее, наличие всей этой новой силы должно очень помочь с нашими недавно вышедшими из-под контроля непослушными заключенными.\n\n На такой работе важно знать, кому можно доверять. Один из новых сотрудников, Томас, кажется особенно многообещающим. Мне нужна вся возможная помощь прямо сейчас, поэтому, если он хорошо себя проявит, я постараюсь быстро повысить его в должности.\n- Смит
journal.document.prison_warden.recruits.title=Новые новобранцы
journal.document.prison_warden.rotberry.body=23-е число осени, 363\n\nСегодня получил прекрасный подарок от Феликса. Это какой-то ярко-красный кустарник, называемый «гнилой ягодой».\n\nЯ уже говорил ему, как здесь уныло, похоже, он меня слушал. По его словам, это растение на самом деле не любит света и воды, поэтому мне нужно обрезать листья примерно раз в месяц. Хотя обрезка, должно быть, важна, он упоминал об этом дюжину раз в своем письме.\n\nКонечно, Феликс никогда ничего не делает бесплатно. Он говорит, что семена, которые производит это растение, отлично подходят для изготовления волшебных палочек, поэтому, естественно, я должен ему несколько штук каждый раз, когда растение дает урожай.\n- Смит
journal.document.prison_warden.rotberry.title=Растение гнилой ягоды
journal.document.prison_warden.title=Дневник начальника тюрьмы
journal.document.sewers_guard.crabs.body=11-е Зимнее, 376\nДорогие мама и папа,\n\nКак будто крыс было недостаточно, а в глубине водятся гигантские крабы! Один из них промчался мимо меня и сильно поранил Ли, прежде чем мы его убили. Томас говорит, что это не моя вина, но я знаю, что он просто пытается быть добрым ко мне.\n\nК счастью, на обратном пути мы встретили искателя приключений, у которого была лишняя мазь из солнечной травы. Ли, возможно, не выжил бы без неё.\n\nЯ видел, как искатель приключений смотрел на розу перед тем, как уйти, он сказал, что это подарок. Зачем им рисковать жизнью здесь, если кто-то так о них заботится?\n\nЯ именно этим и занимаюсь, не так ли? Мне кажется, я не справляюсь.
journal.document.sewers_guard.crabs.title=Гигантские крабы!
journal.document.sewers_guard.dangerous.body=88-е число осени, 375\nДорогие мама и папа,\n\nТеперь я понимаю, почему такая хорошая зарплата, канализация кишит монстрами! «Вредители» и «преступники» — это гигантские кровожадные крысы и стаи злых гноллов.\n\nК счастью, остальная часть моей команды действительно знает свое дело. Наш капитан, Томас, — эксперт в этом. Я стараюсь быстро учиться, чтобы не быть слишком обузой.\n\nЭта работа намного опаснее, чем я думала. Я рада, что теперь не могу отправлять эти письма, не хочу, чтобы вы волновались.\n\nЯ буду осторожна,\n- Соня
journal.document.sewers_guard.dangerous.title=Опасное положение...
journal.document.sewers_guard.discover_hint=Этот текст можно найти в определённом регионе, но только после того, как будут найдены все предыдущие тексты из этого набора.
journal.document.sewers_guard.guild.body=23-е Зимнее, 376\nДорогие мама и папа,\n\nНа этот раз новых монстров не было, вместо этого во время патрулирования мы столкнулись с небольшой группой из гильдии воров.\n\nВсе, что я слышал о гильдии, плохо, но остальная часть моей команды, казалось, была почти дружелюбна к ним. Томас обменялся информацией и припасами с одним из них, прежде чем мы разошлись.\n\nЯ не понимаю, разве мы не должны были избавиться от разбойников? Томас даже сказал никому из командиров об этом не говорить. Однако их информация и припасы были очень полезны, и мы не могли выдержать еще больше боев.\n\nПолагаю, мы все здесь в одной лодке.
journal.document.sewers_guard.guild.title=Гильдия воров
journal.document.sewers_guard.lost.body=40-е Зимы, 376\n\nТомас и я заблудились. Нас оттеснили от остальной команды во время боя с гноллами. Никто из нас не пострадал, но нижняя канализация похожа на лабиринт.\n\nТомас говорит, что знает выход, но он начинается у старого тюремного входа внизу канализации. Я очень не люблю спускаться глубже, но у нас нет пайков, и спускаться вниз гораздо быстрее, чем бродить в поисках маршрута патрулирования.\n\nВсе будет хорошо. Томас знает, что делает.
journal.document.sewers_guard.lost.title=Мы заблудились
journal.document.sewers_guard.new_position.body=85-е число осени, 375\nДорогие мама и папа,\n\nЯ же говорила вам, что вся тяжелая работа в городской страже окупится. Меня только что повысили!\n\nМеня пригласили в специализированную команду, работающую в канализации. По-видимому, там проблемы с вредителями и преступниками, и наша задача — их искоренить. Это грязная работа, но в канализации зимой тепло, и платят в три раза больше, чем за обычную службу в страже!\n\nВсе это немного секретно, поэтому я не могу отправить это письмо. Странно не писать вам, поэтому я все равно буду продолжать писать. Может быть, когда-нибудь я смогу показать вам их.\n\nС наилучшими пожеланиями,\n- Соня
journal.document.sewers_guard.new_position.title=Моя новая должность!
journal.document.sewers_guard.not_worth.body=У входа в тюрьму мы с Томасом столкнулись с каким-то огромным слизнеподобным монстром. Прежде чем мы успели среагировать, он обрушил на нас магический удар. Томас принял на себя большую часть. Он погиб. Никакие деньги не стоят этого. Я уйду тем путем, о котором мне сказал Томас. Затем я возьму то, что заработал как охранник, и использую это, чтобы увезти себя и своих родителей из этого проклятого города. Часть меня надеется, что у Короля есть план на этот счет, но я сомневаюсь. Я оставляю эти письма как предупреждение другим. Это не просто гигантские крысы и крабы, здесь что-то очень не так.
journal.document.sewers_guard.not_worth.title=Оно того не стоит
journal.document.sewers_guard.title=Письма охранника
