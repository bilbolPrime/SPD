journal.document.adventurers_guide.alchemy.body=Pokud vám spotřební předmět nepřipadá užitečný, můžete ho použít jako alchymistickou přísadu nebo ho proměnit v univerzální alchymistickou energii. Poznáte je také pomocí energetických lektvarů a svitků!\n\nDrobné předměty jsou unikátní druh vybavení, které se vytváří a vylepšuje pomocí alchymie. Jsou vyrobeny z magického katalyzátoru pro drobné předměty a trochy alchymistické energie.\n\n(První alchymistický hrnec se nachází ve 3. nebo 4. patře podzemí. V blízkosti těchto hrnců se nacházejí také stránky s alchymistickými recepty.)
journal.document.adventurers_guide.alchemy.title=Alchymie a drobnosti
journal.document.adventurers_guide.dieing.body=Dungeoneering je nebezpečný a většina dobrodruhů nakonec potká svůj zánik.\n\nŠtěstí pomáhá, ale ti nejlepší dobrodruzi využívají každý malý trik, aby si zvýšili šance.\n\n(Nezlobte se, pokud hodně umíráte, tato hra je těžká! Soustřeďte se na učení se hry a její neustálé zlepšování, ne na okamžité vítězství.)
journal.document.adventurers_guide.dieing.title=Zvládání porážky
journal.document.adventurers_guide.examining.body=Je důležité studovat své nepřátele a okolí, místo abyste se do toho vrhali poslepu! Zvykněte si zkoumat všechno nové.\n\n (Můžete zkoumat pomocí tlačítka s lupou a poté vybrat, co chcete zkoumat. Můžete také zkoumat vylepšení nebo zhoršení výběrem jejich ikon.)
journal.document.adventurers_guide.examining.title=Zkoumání
journal.document.adventurers_guide.food.body=Efektivní přídělový systém je jedním z nejlepších způsobů, jak zvýšit své šance na přežití. Nemusíte vždycky jíst správně, když máte hlad!\n\nKdyž nehladovíte, budete si pomalu regenerovat zdraví, takže pokud budete jíst s plným zdravím, tato regenerace bude promarněna!\n\nPokud budete jíst s pomalým tempem podle svého zdraví, jídlo vám vydrží mnohem déle.
journal.document.adventurers_guide.food.title=Zvládání hladu
journal.document.adventurers_guide.identifying.body=Barvy lektvarů a symbolů na svitcích se v každém dungeonu liší. Neidentifikované vybavení lze s štěstím vylepšit nebo očarovat, nebo může být prokleté!\n\nSvitky pro identifikaci, vylepšení nebo odstranění prokletí jsou velmi užitečné, pokud chcete snížit riziko použití neidentifikovaného vybavení.\n\n(Seznam všech identifikovaných předmětů najdete v katalogu ve svém deníku)
journal.document.adventurers_guide.identifying.title=Identifikace položek
journal.document.adventurers_guide.intro.body=Zdravím dobrodruhu, čteš knihu Tome of Dungeon Mastery! Tuto příručku nejlépe použiješ jako referenci a magicky ti dá vědět, kdy je nejlepší si každou stránku přečíst.\n\n (Když tlačítko deníku bliká, vyberte ho a přečtěte si, co ti průvodce říká! Některé stránky ale chybí, možná je najdeš v jeskyni?)
journal.document.adventurers_guide.intro.title=Zavedení
journal.document.adventurers_guide.levelling.body=Zvyšování úrovně zvyšuje vaše statistiky a uděluje talentové body, což může mít velký vliv v boji. Nejlepší je mít alespoň jednu úroveň pro každé patro dungeonu.\n\nMůže být lákavé spěchat a vyhýbat se průzkumu nebo boji, ale tím se připravíte o zásoby a zkušenosti.\n\n(Informace o svém hrdinovi, včetně zkušeností, najdete na stavovém panelu v rohu herního rozhraní. Vyberte portrét svého hrdiny a získejte ještě více informací.)
journal.document.adventurers_guide.levelling.title=Získávání zkušeností
journal.document.adventurers_guide.looting.body=Místnosti, které jsou za zamčenými dveřmi nebo obsahují překážky, obvykle obsahují lepší kořist. Když vám v cestě stojí překážka, obvykle na stejném patře najdete předmět, který vám pomůže.\n\nV každé pětipatrové oblasti dungeonu vždy najdete 2 lektvary síly a 3 svitky vylepšení, takže jsou skvělým ukazatelem toho, jak dobře se vám daří prozkoumávat.\n\n(Seznam orientačních bodů a nepoužitých klíčů najdete v záložce poznámek v okně deníku.)
journal.document.adventurers_guide.looting.title=Efektivní rabování
journal.document.adventurers_guide.magic.body=Magické útoky prořezávají brnění a je těžké se jim vyhnout. To znamená, že poškození hůlkami je velmi spolehlivé, ale zároveň činí magické nepřátele velmi nebezpečnými!\n\nMagické útoky však vždy mají nevýhodu. Hůlky mají omezené náboje a magičtí nepřátelé obvykle nebudou schopni použít svou magii zblízka.\n\nKdyž čelíte nepřátelům, kteří používají magii, je důležité naučit se, jak jim zabránit v jejím použití na vás.
journal.document.adventurers_guide.magic.title=Magické útoky
journal.document.adventurers_guide.positioning.body=Strategie je stejně důležitá jako vybavení. Špatným situacím, jako je obklíčení, se obvykle lze vyhnout dobrým umístěním.\n\nNapříklad většina dungeonů má úzké chodby, které nutí nepřátele bojovat s vámi jeden po druhém. Tyto chodby často obsahují i dveře pro překvapivé útoky!\n\nExistuje také mnoho drobných způsobů, jak využít prvky prostředí, jako je tráva, voda, jámy nebo pasti, ve svůj prospěch.
journal.document.adventurers_guide.positioning.title=Polohování
journal.document.adventurers_guide.searching.body=Jeskyně jsou plné tajných dveří a pastí, které se na první pohled zdají neviditelné. Pokud máte podezření, že se poblíž skrývají dveře nebo past, můžete strávit nějaký čas a pečlivě je prohledat. \n\n (Všechny dlaždice kolem sebe můžete prohledat dvojitým stisknutím tlačítka lupy. Možná se poblíž místa, kde jste tuto stránku našli, nacházejí nějaké skryté dveře!)
journal.document.adventurers_guide.searching.title=Hledání
journal.document.adventurers_guide.strength.body=Není čas trénovat se zbraněmi a brněním, které najdete v podzemí, takže k jejich efektivnímu použití budete potřebovat hrubou sílu.\n\nLektvary síly a svitky vylepšení jsou nejúčinnějším způsobem, jak splnit požadavky na sílu u vybavení vyšší úrovně.\n\nJe důležité časem začít používat předměty vyšší úrovně, ale neignorujte vybavení, které můžete použít hned teď.
journal.document.adventurers_guide.strength.title=Pevnost
journal.document.adventurers_guide.surprise_attacks.body=Překvapivé útoky zaručeně zasáhnou, takže jsou obzvláště užitečné proti úhybným nepřátelům, jako jsou hadi a přízraky. \n\nNepřátele můžete překvapit hned poté, co vstoupí do dveří, zatímco vás pronásledují, nebo když vás jinak ztratí z dohledu.
journal.document.adventurers_guide.surprise_attacks.title=Překvapivé útoky
journal.document.adventurers_guide.title=svazek o zvládnutí dungeonů
journal.document.adventurers_guide.upgrades.body=Čím hlouběji se ponoříte do dungeonu, tím důležitější je používat magicky vylepšenou výbavu vyšší úrovně, ale budete také potřebovat sílu, abyste ji mohli správně používat.\n\nHůlky, prsteny a artefakty sílu nepotřebují, ale mají omezené využití nebo v boji tak přímo nepomáhají.\n\nDobře se rozhodnout, co vylepšíte, je velmi důležité pro přežití na začátku dungeonu a pro to, abyste se v něm později uspěli.
journal.document.adventurers_guide.upgrades.title=Vylepšení
journal.document.alchemy_guide.bombs.body=Standardní bombu s černým prachem lze smíchat se specifickým předmětem a vytvořit tak vylepšenou bombu.
journal.document.alchemy_guide.bombs.title=Vylepšené bomby
journal.document.alchemy_guide.brews_elixirs.body=Lektvary a elixíry jsou pokročilé lektvary s řadou účinků, obvykle na jedno použití.
journal.document.alchemy_guide.brews_elixirs.title=nápoje a elixíry
journal.document.alchemy_guide.energy_food.body=Mnoho receptů vyžaduje krystalickou alchymistickou energii, která se vyrábí dekonstrukcí spotřebních předmětů v alchymistickém hrnci. Energizující lektvary nebo svitky je také identifikují. \n\nNěkteré recepty, které vyžadují energii, jsou magické, ale tyto se podobají tradičnímu vaření.
journal.document.alchemy_guide.energy_food.title=Energie a potraviny
journal.document.alchemy_guide.exotic_potions.body=Lektvary lze smíchat s energií a vytvořit tak exotické lektvary. Mají silnější účinky, ale často jsou užitečné různými způsoby.
journal.document.alchemy_guide.exotic_potions.title=exotické lektvary
journal.document.alchemy_guide.exotic_scrolls.body=Exotické svitky se dají vyrobit s trochou energie a svitku. Jsou o něco silnější a dražší než exotické lektvary.
journal.document.alchemy_guide.exotic_scrolls.title=exotické svitky
journal.document.alchemy_guide.potions.body=Vítejte v knize Praktické aplikace alchymie! Tato kniha je referenčním seznamem receptů na výrobu předmětů v alchymistickém kotli.\n\nZačneme s nejikoničtějším receptem: Lektvary!\n\nPoužijte tři semínka k uvaření náhodného lektvaru! Každé semínko má svůj protějšek, použijte více stejných semínek, abyste zvýšili šanci, že lektvar souvisí se semínky, která jste použili.
journal.document.alchemy_guide.potions.title=Úvod a lektvary
journal.document.alchemy_guide.spells.body=Kouzla jsou obsažena v krystalech a poskytují řadu účinků, obvykle s vícenásobným využitím.
journal.document.alchemy_guide.spells.title=kouzla
journal.document.alchemy_guide.stones.body=Vmícháním svitku do alchymistické nádoby se jeho magie promění ve dva kameny uvnitř nádoby. Tím se vytvoří runové kameny a identifikuje svitek!
journal.document.alchemy_guide.stones.title=Vytváření runových kamenů
journal.document.alchemy_guide.title=Průvodce alchymií
journal.document.alchemy_guide.weapons.body=Některé z lehčích nebo magičtějších zbraní lze použít v alchymii!\n\nKaždá sada vržených zbraní vyprodukuje dostatek tekutého kovu k úplné opravě jiné sady stejné úrovně a třídy. Upozorňujeme, že alchymizace sady zničí celou sadu, i když není celá přítomna!\n\nJedna hůlka vyprodukuje dostatek tajemné pryskyřice k vylepšení dvou hůlek stejné úrovně, ale ne více než +3.
journal.document.alchemy_guide.weapons.title=Vylepšování zbraní
journal.document.caves_explorer.alive.body=23. léta 308\n\nJeden z trpasličích strojů se nějakým způsobem probral k životu! Jen jsme procházeli kolem, když se vrhl na nás a svými obrovskými kovovými pěstmi málem rozdrtil dva z naší skupiny. Naštěstí jsem s sebou nesl hůlku rozkladu. Pár dobře mířených výstřelů a ta bestie byla proměněna na šrot.\n\nCo mě trápí, je, že jsme neudělali absolutně nic, abychom stroj vyprovokovali. Trpaslíci nemohli stroje navrhnout tak agresivní, je to, jako by se nás snažili přepadnout!\n\nAlespoň jsem pro jednou mohl svým společníkům nabídnout nějakou pomoc.\n- Archibald
journal.document.caves_explorer.alive.title=Je to živé!
journal.document.caves_explorer.city.body=21. léta, 308\n\nJsme nyní na hranici tří týdnů a poté, co jsme strávili většinu posledních deseti dnů mapováním stále hlouběji, jsme konečně dosáhli dna dolů. Našli jsme různé kovové vynálezy a velkou bránu, která blokuje vstup do staré trpasličí metropole.\n\nKovář nás varoval před některými z těchto strojů. Zřejmě byly určeny k obraně oblasti a mají tendenci se aktivovat, když jsou narušeny. Ve městě nemáme co dělat a kov by měl minimální hodnotu jako šrot, takže jsme si mysleli, že bude nejlepší dbát jeho varování a vydat se zpět.\n\nMusím přiznat, že jsem byl zvědavý, ale vyšetřování tam dole rozhodně nestálo za to riziko.\n- Archibald
journal.document.caves_explorer.city.title=Vchod do města
journal.document.caves_explorer.discover_hint=Tento text můžete najít v určité oblasti, ale až po nalezení všech předchozích textů v této sadě.
journal.document.caves_explorer.expedition.body=1. léta, 308\n\nDnes začíná naše čtyřtýdenní expedice do opuštěných trpasličích dolů! Sám král mě pověřil prozkoumáním oblasti. Mým hlavním cílem je najít jakékoli nevyužité přírodní zdroje a prozkoumat jeskyně pro potenciální projekt výstavby vězení.\n\nI když se dokážu bránit, na královo naléhání jsem přijal doprovod městské stráže. Je to banda hlupáků, ale dokud mě nezpomalí, jejich přítomnost je snesitelná.\n\nOčekává se, že do večera vyčistíme kanalizaci a dorazíme k dolům.\n- Archibald Drummond. Arcimág, jižní kouzelnický institut.
journal.document.caves_explorer.expedition.title=Začátek expedice!
journal.document.caves_explorer.gold.body=4. léta, 308\n\nNaše první dny byly opravdu velmi plodné! Po založení základního tábora jsme se vydali prozkoumat některé horní části opuštěného dolu. I když po sobě trpaslíci zanechali spoustu zbytečného nepořádku, mnoho stěn jeskyně se také hemží zlatem!\n\nBohužel tu nejsme první. Jeskyně jsou plné agresivní divoké zvěře a zdá se, že o zlato mají zájem i smečky gnollů. Přiznávám, že jsem byl ke svému strážnému doprovodu nespravedlivý, byli to mnohem schopnější průzkumníci a bodyguardi, než jsem čekal.\n\nI přes tento úspěch nám stále zbývá mnoho dolů k prozkoumání.\n- Archibald
journal.document.caves_explorer.gold.title=Tolik zlata!
journal.document.caves_explorer.report.body=28. léta, 308\n\nDnes dobalíme věci a připravíme se na odjezd. Právě včas se také několika členům naší skupiny začaly po incidentu s agresivním strojem zdát hrozné noční můry. Pravděpodobně je to jen únava, ale jejich noční můry jsou si všechny znepokojivě podobné.\n\nStručně řečeno, horní části dolu jsou docela bezpečné. Pokud by se našlo využití pro tmavé zlato, pak by jeho těžba mohla být docela lukrativní. Velké otevřené prostory by se velmi dobře hodily i pro stavební plány města. Spodní doly jsou však nebezpečnější a je třeba se jim vyhnout.\n\nTohle všechno zapíšu do své závěrečné zprávy v příštích několika dnech.\n- Archibald
journal.document.caves_explorer.report.title=Závěrečná zpráva
journal.document.caves_explorer.title=Průzkumníkův deník
journal.document.caves_explorer.troll.body=11. léta, 308\n\nPoté, co jsme začali s průzkumem střední části dolů, jsme narazili na přátelskou tvář! No... relativně přátelskou. Jeskynní troll si tam zřídil malou kovárnu. Je drsný a ne moc upovídaný, ale opravil nám vybavení výměnou za nějaké zlato.\n\nBohužel nás trollí kovář také informoval, že všechno to krásné zlato není tak dobré, jak se zdá. Říká mu „temné zlato“ a zřejmě se na slunci rychle rozkládá. To by jistě vysvětlovalo, proč zde nikdy nedošlo ke konfliktům o zdroje.\n\nAsi se musíme ponořit trochu hlouběji, abychom zjistili, jestli se tam nenachází něco cennějšího.\n- Archibald
journal.document.caves_explorer.troll.title=Potkal jsem trolla
journal.document.city_warlock.discover_hint=Tento text můžete najít v určité oblasti, ale až po nalezení všech předchozích textů v této sadě.
journal.document.city_warlock.failure.body=Zdá se, že jsem taky hlupák. Předpokládal jsem, že Nový král potřebuje, aby se mu dvůr dobrovolně podřídil, ale teď vidím, že má moc ovládat i ty, kdo se mu brání.\n\nI Slepě jsem si přivedl všechny nejsilnější oponenty přímo k dveřím, aby je mohl osobně proměnit ve své otroky. Nyní se městem valí vlny jeho nekrotické energie a většinu z nich okamžitě mění v jeho prosebníky.\n\nTěch pár, kteří ještě mají svobodnou vůli, prchá. Rozhodl jsem se zůstat vzadu, abych co nejlépe pozoroval a hledal nějakou příležitost. S magickou silou, kterou mám, bych měl být schopen nějakou dobu zůstat skrytý a v bezpečí.
journal.document.city_warlock.failure.title=Selhání
journal.document.city_warlock.more_powerful.body=Sledování času se stalo obtížným, ale od mého posledního vstupu uplynul asi týden. Naše civilizace se skutečně zhroutila. Brány jsou zavřené, všechny funkce naší společnosti ustaly a po chodbách se potulují prázdné trpasličí slupky.\n\nBěhem toho všeho se Nový král nějakým způsobem stává ještě mocnějším. Každý den síla jeho vůle sílí, ale také se mění. Nedokážu to popsat, ale mám pocit, jako by už vůbec nebyl trpaslíkem.\n\nZačínám se smiřovat s tím, že to nejlepší, v co mohu doufat, je zdokumentovat tyto události. Zůstanu tu tak dlouho, jak jen to půjde, a pak se stáhnu, jakmile moje vůle začne slábnout.
journal.document.city_warlock.more_powerful.title=Výkonnější
journal.document.city_warlock.new_power.body=Co se tu děje? Moc vycházející z Nového krále je sice jiná než zpočátku, ale je tu i něco jiného. Zdá se, že tato nová moc vyzařuje z nejvnitřnějších síní našeho města.\n\nJeště záhadnější je, že aktivita v horní metropoli se také snížila. Nevím, co se děje tam dole, ale přitahuje to téměř veškerou pozornost Nového krále.\n\nNávrat do hlubokých síní bude nebezpečný, ale musím zjistit, co tuto změnu způsobuje. Možná má Nový král nakonec nějakou slabinu?
journal.document.city_warlock.new_power.title=Nová moc
journal.document.city_warlock.old_king.body=Je 5. den 2. měsíce 33. roku věku magie. Pokud toto čte obyvatel Nadsvětí, je to někdy v zimě roku 264. Jmenuji se Thymor Zahir a pokud vím, jsem posledním žijícím členem trpasličího dvora.\n\nNáš král je mrtvý, nahrazen jedním z mých bývalých kolegů, který se zbláznil mocí. Zbytek dvora se mu podřídil jako blázni, jací jsou, a přitom ztratil svobodnou vůli. Jen já jsem to předvídal a uprchl jsem dříve, než mohl být jeho rituál dokončen.\n\nVnitřní kruh padl, ale moc Nového krále se ještě nedostala ke všem. Musím se co nejrychleji postavit na odpor. Odmítám nechat naši slavnou civilizaci padnout do rukou tohoto megalomana!
journal.document.city_warlock.old_king.title=Král je mrtvý
journal.document.city_warlock.resistance.body=Zdá se, že se zpráva rychle rozšířila. Uběhlo jen pár dní a už jsem shromáždil malou armádu věrných Starému králi. Jen málo z nich ovládá magii, ale téměř celý řád válečných mnichů je mezi námi. Měli bychom být víc než jen soupeři pro jednoho šíleného trpaslíka a jeho dvůr otroků.\n\nMezitím se Nový král ukryl ve vnitřních komnatách našeho města. Není pochyb o tom, že vynaložil většinu své moci a doufá, že se vzpamatuje, než narazí na další odpor.\n\nÚtok zahájíme za pár hodin. S trochou štěstí budeme schopni do konce noci vytvořit prozatímní radu a vrátit naše úžasné město do stability.
journal.document.city_warlock.resistance.title=Odpor
journal.document.city_warlock.seen_it.body=Viděl jsem, co leží dole, ale nedokážu to popsat. Ruce se mi nekontrolovatelně třesou, když se snažím zapsat své myšlenky.\n\nProč se to děje? Udělal to Nový král? Nedává to smysl. Možná to přitáhlo jeho bezohledné užívání moci? Doufal jsem, že zachráním naši civilizaci, ale teď vidím, že v sázce je celý svět.\n\nKrál je nějakým způsobem menší zlo. Nemám jinou možnost, pro vyšší dobro se vzdám. Prosím, veď mě, můj králi, použijte mě jako nástroj k udržení Yog-Dzewy na uzdě!
journal.document.city_warlock.seen_it.title=Viděl jsem to
journal.document.city_warlock.title=Čarodějův deník
journal.document.halls_king.amulet.body=ZVLÁDNUL JSEM TO!\n\nNevěděl jsem, co přesně najdu, ale to, co jsem tam venku objevil, přesahovalo mé nejdivočejší spekulace. Tolik moci, jen tak ležící připravená k uchvácení, a celá je moje!\n\nS tímhle se mi žádný blázen u dvora neodváží postavit. Jen se mi zatočí hlava, když pomyslím na všechny ty různé způsoby, jak je mohu ponížit. Sakra, proč se tím zastavovat, vždyť mám dost moci na to, abych je všechny zničil, kdybych chtěl! To by mohlo být přehnané, ale nesmím s rozhodováním dlouho trvat, jinak by mě to začalo podezřívat.\n\nMyslím, že tuhle velkou moc pojmenuji Amulet Yendoru!\n- R.
journal.document.halls_king.amulet.title=Amulet
journal.document.halls_king.attrition.body=Mám plán, jak se s tou věcí vypořádat. Její síla je nekonečná, ale její schopnost proniknout do tohoto světa nikoli. Spoléhá na své poskoky a avatary, aby plnili její rozkazy, zatímco se snaží nashromáždit dostatek moci, aby si amulet vzala.\n\nI když amulet fyzicky nevlastním, stále mám nad jeho mocí plnou kontrolu. S celým trpasličím městem k dispozici mám také početní převahu. Můžu jednoduše posílat vojáky, abych jí zabránil v uchvácení amuletu, a postupně vyhrávat tuto válku vyčerpáním!\n\nI, RODNEY, KRÁL TRPASLÍKŮ, TĚ PŘEŽIJE, YOG-DZEWA!
journal.document.halls_king.attrition.title=Otěr
journal.document.halls_king.discover_hint=Tento text můžete najít v určité oblasti, ale až po nalezení všech předchozích textů v této sadě.
journal.document.halls_king.new_king.body=JSEM KRÁL, AHAHAHAHAAA!\n\nProstě mě to nechali udělat! Téměř bez přesvědčování souhlasili, že se s nimi o tuto moc „podělím“ ve velkém rituálu. V okamžiku se proměnili ze sboru posměšných hlasů v můj nový dvůr tichých poddaných!\n\nJak se dalo očekávat, Thymor při prvním náznaku potíží uprchl jako zbabělec. Už cítím, jak silně si buduje odpor. Myslím, že mu dovolím pokračovat, aby mi mohl všechny své spiklence doručit přímo k dveřím!\n\nJe zřejmé, že ani království mě nerespektuje, asi to taky napravím.\n - Král trpaslíků
journal.document.halls_king.new_king.title=Nový král
journal.document.halls_king.rejection.body=IMBECILI!\n\nZa posledních 33 let naše království vzkvétalo díky naší nové magické technologii. Naučili jsme se, jak přivolávat elementární duchy a podřizovat je naší vůli, ale další experimentování je teď nějak „příliš nebezpečné“.\n\nVím, co se doopravdy děje. Odmítnutí mých teorií nemá nic společného s jejich opodstatněností a má vše společného s osobou, která je navrhuje. Pravděpodobně se mi všichni za mými zády smějí.\n\nTak už ne! Je mi jedno, co říkají, budu prozkoumávat nejvzdálenější kouty našeho vesmíru sám a všechno, co objevím, si nechám pro sebe!\n- R.
journal.document.halls_king.rejection.title=Odmítnutí
journal.document.halls_king.ritual.body=Thymor se se mnou dnes veřejně konfrontoval a trval na tom, abych mu vysvětlil svůj nový zdroj moci. Odmítl jsem ho, jak nejlépe jsem uměl, ale znovu na sobě cítím soudící pohledy zbytku dvora.\n\nDoufal jsem, že strávím ještě trochu času užíváním si klidu před bouří, ale na tom vlastně nezáleží. Rozhodl jsem se, co chci dělat. Budu tvrdit, že jsem svou moc získal novým rituálem, a nabídnu se, že ho provedu na ostatních čarodějích a králi. Jakmile rituál skončí, stanu se králem!\n\nThymor bude samozřejmě protestovat, ale s tolika nabízenými prostředky pochybuji, že ho poslechnou!\n\nVŠICHNI SE PŘED MNOU POKLONÍ!\n - Budoucí král trpaslíků
journal.document.halls_king.ritual.title=Rituál
journal.document.halls_king.thing.body=Je tu problém. Thymor byl bez námahy zlikvidován, ale zdá se, že mé pátrání ve vnějších rovinách nezůstalo bez povšimnutí.\n\nNějaká... „věc“... byla přitahována k mému světu a začíná se prodírat na dně spodních síní. Aby to bylo ještě komplikovanější, je to přesně tam, kde jsem uložil amulet! Takový zlomyslný tvor, proč se musí snažit odepřít mi mou moc, když je venku ještě spousta věcí, které si musím vzít?\n\nNavzdory své moci si ale nemyslím, že se do ní můžu jen tak vtrhnout a bojovat s ní. Její skutečná síla je nepochopitelná, ale musí existovat nějaký způsob, jak ji omezit. BUDU SVOU KOŘI BRÁNIT!
journal.document.halls_king.thing.title=Věc
journal.document.halls_king.title=Deník uživatele ???
journal.document.intros.caves.body=Tyto řídce osídlené jeskyně se táhnou pod opuštěným vězením. Bohaté na minerály, kdysi byly centrem rušného obchodu a průmyslu pro trpasličí společnost dole, ale byly opuštěny, protože trpaslíci se stali posedlými temnou magií. \n\n Jeskyně jsou nyní převážně obývány podzemní divokou zvěří, gnolly a opuštěnými stroji; pravděpodobně zkaženými stejnou silou, která ovlivnila oblasti nahoře.
journal.document.intros.caves.title=Jeskyně
journal.document.intros.city.body=Trpasličí metropole byla kdysi největším ze všech trpasličích městských států. V dobách svého rozkvětu trpaslíci stavěli úžasné stroje z kovu a magie, které umožňovaly jejich městu rychlý rozmach. \n\nPak jednoho dne byly městské brány zavřeny na závoru a nikdo už o trpaslících neslyšel. Těch pár, kteří unikli z města, když se zavíralo, vyprávělo příběhy o šíleném čarodějovi, který ukradl trůn, a o strašlivé magii, kterou se naučil ovládat.
journal.document.intros.city.title=Trpasličí metropole
journal.document.intros.discover_hint=Tento text najdete při prvním vstupu do určité oblasti.
journal.document.intros.dungeon.body=Mnoho hrdinů se před vámi odvážilo do podzemí z města nahoře, o většině z nich už nikdo nikdy neslyšel.\n\nŘíká se, že v hlubinách číhá starodávné zlo, které střeží všemohoucí Amulet Yendoru. I nyní zdola vyzařuje temná energie a prodírá se do města.\n\nDobijete podzemí a získáte amulet? Je čas začít s vlastním dobrodružstvím!
journal.document.intros.dungeon.title=Žalář
journal.document.intros.halls.body=Tyto hluboké síně Trpasličí metropole byly zkrouceny temnou magií. V minulosti tyto oblasti hostily dvůr elitních čarodějů Trpasličího krále, ale nyní se zdá, že je ovládlo něco ještě zlověstnějšího...\n\nV těchto síních se nacházejí nejrůznější hrůzostrašné démonické bytosti vedené nějakou strašlivou temnou silou. Pokud Král trpaslíků nebyl zdrojem šířící se zkaženosti, ať už je tady dole cokoli, musí jím být.\n\nNastupujte opatrně, jen velmi málo dobrodruhů sestoupilo tak hluboko...
journal.document.intros.halls.discover_hint=Tento text můžete najít v určité oblasti, ale až po nalezení všech předchozích textů v této sadě.
journal.document.intros.halls.title=Démonické síně
journal.document.intros.prison.body=Před mnoha lety zde byla postavena věznice pro nebezpečné zločince. Přísně regulovaná a zabezpečená věznice, odsouzení z celé země, sem byli přiváděni, aby si odpykávali trest.\n\nAle brzy se zespodu začala vkrádat temná tříšť, která zmítala mysli dozorců i vězňů.\n\nV reakci na rostoucí chaos město celou věznici uzavřelo. Nikdo neví, co se stalo s těmi, kteří byli ponecháni mrtvým v těchto zdech...
journal.document.intros.prison.title=Vězení
journal.document.intros.sewers.body=Horní patra podzemí ve skutečnosti tvoří městský kanalizační systém. \n\nA Temná energie se vplížila zespodu a obvykle neškodní kanalizační tvorové se stali čím dál zuřivějšími. Město sem muselo poslat strážní hlídky, aby se pokusilo zajistit bezpečnost pro ty nahoře. \n\nToto místo je nebezpečné, ale alespoň zde působí slabá zlá magie.
journal.document.intros.sewers.title=Kanalizace
journal.document.intros.title=Představení regionů
journal.document.prison_warden.discover_hint=Tento text můžete najít v určité oblasti, ale až po nalezení všech předchozích textů v této sadě.
journal.document.prison_warden.journal.body=1. jara, 362\n\nToto je první zápis v pracovním deníku vězeňské dozorkyně Kiany Smithové. Vzhledem k tomu, co se v poslední době děje, jsem se rozhodla založit si deník, abych si udržela pořádek v myšlenkách.\n\nŘídit věznici půl míle pod zemí nikdy nebylo snadné, ale v poslední době se zdá, že dochází k nějakému organizovanému narušení pořádku. Vězni se chovají bezdůvodně a pak odmítají vysvětlit proč.\n\nNěkteří dozorci začínají říkat, že v místě straší. Nemůžu dovolit svým vlastním lidem šířit fámy, ale nemůžu je zrovna vinit z toho, že jsou neklidní.\n- Smithová
journal.document.prison_warden.journal.title=Vedení deníku
journal.document.prison_warden.letter.body=Thomasi, \n\nByl jsi skvělý přítel, takže ti prokazuji laskavost.\n\nAž dnes večer začneš směnu, zamkni a zpevni Tenguovu celu, hoď klíč do nějakého výklenku a vypadni. Nezáleží na tom, jestli ostatní vězni zůstanou bez dozoru, brzy nikdo nebude moci odsud odejít. Ten podivín ale musí zůstat v bezpečí, pokud uteče, nikdo neví, co udělá.\n\nNikomu o tom neříkej a neobtěžuj se mě hledat. Kapitánka se musí potopit i se svou lodí.\n- Kiana
journal.document.prison_warden.letter.title=Dopis Tomášovi
journal.document.prison_warden.mines.body=54. zimy, 363\n\nA Dnes přijela skupina inženýrů z města a řekla, že jsou tady, aby uzavřeli starý vchod do dolů dole. Předpokládám, že město se už nechce obtěžovat s údržbou chodby. Jako obvykle jsem nebyl předem informován.\n\nJejich hlavní inženýr mi také řekl nějaké nesmysly o trpasličí magii, která uniká z dolů. Nevěřím ani slovu.\n\nSituace je s naším novým personálem pod mnohem lepší kontrolou, ale kořen problému stále nebyl vyřešen. Něco tady rozhodně ovlivňuje vězně a zbourání pár zdí to nezmění.\n- Smith
journal.document.prison_warden.mines.title=Utěsnění dolů
journal.document.prison_warden.no_support.body=11. jara, 364\n\nCo si sakra město myslí? Po naléhavé žádosti o pomoc jsem neslyšel nic, ani prázdnou omluvu, jakou obvykle posílají, když jsou mé žádosti zamítnuty.\n\nMezitím se stav vězňů stále zhoršuje a někteří dozorci dokonce začali dělat problémy. Plánují snad nechat tohle jen tak zhoršovat, dokud se nedostaneme k nepokojům!?\n\nThomas zůstal spolehlivý jako vždy. Jeho organizační pomoc byla neocenitelná a jeho nápad aktivovat ty staré jednotky DM-100 byl politováníhodný, ale nezbytný. Jsem si jistý, že se z téhle situace dostanu zase zvládnout, jen potřebuji nějakou zatracenou podporu!\n-Smith
journal.document.prison_warden.no_support.title=Žádná podpora
journal.document.prison_warden.recruits.body=80. jaro, 362\n\nA Jak jsem slíbil, dnes dorazila spousta nových rekrutů. Zdá se to jako obvykle, pár slibných a spousta chrochtáků, kteří chtějí jen výplatu. Přesto by všichni tito noví zaměstnanci měli hodně pomoci s našimi nedávnými neukázněnými vězni.\n\nV takové práci je důležité vědět, komu můžete věřit. Jeden nový zaměstnanec, Thomas, se zdá být obzvláště slibný. Potřebuji teď veškerou pomoc, kterou můžu dostat, takže pokud se mu bude dařit, postarám se o jeho rychlé povýšení.\n- Smith
journal.document.prison_warden.recruits.title=Noví rekruti
journal.document.prison_warden.rotberry.body=23. podzimu, 363\n\nDnes jsem od Felixe dostal krásný dárek. Je to nějaký druh zářivě červeného keře zvaného 'Rotberry'.\n\nUž jsem se mu zmiňoval o tom, jak ponuré je tohle místo, zdá se, že poslouchal. Podle něj tato rostlina ve skutečnosti nesnáší světlo a vodu, takže jí musím listy zastřihávat jen jednou za měsíc. Zastřihování ale musí být důležité, zmínil se o tom ve svém dopise asi tucetkrát.\n\nFelix samozřejmě nikdy nic nedělá zadarmo. Říká, že semínka, která tahle věc produkuje, jsou skvělá na výrobu hůlek, takže mu jich přirozeně dlužím pár pokaždé, když rostlina nějaká vyprodukuje.\n- Smith
journal.document.prison_warden.rotberry.title=Hniloba
journal.document.prison_warden.title=Deník dozorce
journal.document.sewers_guard.crabs.body=11. zimy, 376\nMilá mami a tati,\n\nKdyby těch krys nebylo dost, hlouběji dole jsou obří krabi! Jeden z nich se kolem mě vrhl a Leeho pěkně poranil, než jsme ho zabili. Thomas říká, že to není moje chyba, ale vím, že se ke mně jen snaží být milý.\n\nNaštěstí jsme cestou ven narazili na dobrodruha, který měl nějakou rezervní mast na slunečnicovou trávu. Lee by to bez ní asi nezvládl.\n\nViděl jsem dobrodruha, jak se před odchodem dívá na růži, a říkali, že je to dar. Proč by tady dole riskovali život, když na nich někomu tolik záleží?\n\nPřesně to dělám, že? Mám pocit, že jsem se do toho zapletl až za hlavu.
journal.document.sewers_guard.crabs.title=Obří krabi!
journal.document.sewers_guard.dangerous.body=88. podzimu, 375\nMilá mami a tati,\n\nChápu, proč je teď tak dobrý plat, kanalizace je zamořená monstry! „Havěť“ a „psanci“ jsou obří krvežíznivé krysy a smečky rozzuřených gnollů.\n\nNaštěstí zbytek mého týmu opravdu ví, co dělá. Náš kapitán týmu, Thomas, je v tom expert. Snažím se učit rychle, abych nebyl příliš velkou přítěží.\n\nTahle práce je mnohem nebezpečnější, než jsem si myslel. Jsem rád, že ti to teď nemůžu poslat, nechci, abys měl/a starosti.\n\nBudu se chránit,\n- Sonya
journal.document.sewers_guard.dangerous.title=Nebezpečná pozice...
journal.document.sewers_guard.discover_hint=Tento text můžete najít v určité oblasti, ale až po nalezení všech předchozích textů v této sadě.
journal.document.sewers_guard.guild.body=23. zimy, 376\nMilá mami a tati,\n\nTentokrát žádné nové příšery, místo toho jsme při hlídce narazili na malou skupinku z cechu zlodějů.\n\nVšechno, co jsem o cechu slyšel, je špatné, ale zbytek mého týmu se s nimi zdál být téměř přátelský. Thomas si s jedním z nich vyměnil informace a zásoby, než jsme se rozešli.\n\nNerozumím, neměli jsme se zbavovat psanců? Thomas dokonce řekl, abychom se o tom nezmiňovali s nikomu z velení. Jejich informace a zásoby byly ale velmi užitečné a nezvládli bychom ještě větší boj.\n\nPředpokládám, že jsme v tomhle dole všichni společně.
journal.document.sewers_guard.guild.title=Cech zlodějů
journal.document.sewers_guard.lost.body=40. zimy, 376\n\nThomas a já jsme se ztratili. Při boji s gnoly jsme se od zbytku týmu odtrhli. Ani jeden z nás není zraněný, ale spodní kanály jsou jako bludiště.\n\nThomas říká, že zná cestu ven, ale začíná u starého vchodu do vězení na dně kanálů. Moc se mi nelíbí jít hlouběji, ale nemáme žádné zásoby a jít dolů je mnohem rychlejší než bloudit a hledat trasu pro naši hlídku.\n\nBude to v pořádku. Thomas ví, co dělá.
journal.document.sewers_guard.lost.title=Jsme ztraceni
journal.document.sewers_guard.new_position.body=85. podzimu, 375\nMilá mami a tati,\n\nŘíkal jsem vám, že se veškerá tvrdá práce u městské stráže vyplatí. Právě jsem byl povýšen!\n\nByl jsem pozván, abych se připojil ke specializovanému týmu, který pracuje v kanalizaci. Zřejmě tam dole jsou problémy s havětí a psanci a naším úkolem je je vyklízet. Je to špinavá práce, ale v zimě je v kanalizaci teplo a platí se tam třikrát tolik než při běžné strážní službě!\n\nJe to ale všechno trochu tajné, takže tenhle dopis vlastně nemůžu poslat. Je divné vám nepsat, takže je stejně budu psát dál. Možná vám je jednou ukážu.\n\nS pozdravem,\n- Soňa
journal.document.sewers_guard.new_position.title=Moje nová pozice!
journal.document.sewers_guard.not_worth.body=S Thomasem jsme u vchodu do vězení narazili na nějakou obrovskou slizovou příšeru. Než jsme stihli zareagovat, zasáhla nás magií. Thomas si většinu vzal. Je pryč.\n\nŽádné peníze za to nestojí. Odejdu cestou, o které mi říkal Thomas. Pak si vezmu to, co jsem si vydělal jako strážný, a použiji to k tomu, abych sebe a rodiče přesunul z tohoto prokletého města. Část mě chce doufat, že král na tohle všechno má plán, ale pochybuji o tom.\n\nNechávám tu tyto dopisy jako varování pro ostatní. Jsou to víc než jen obří krysy a krabi, něco je tady dole hodně špatně.
