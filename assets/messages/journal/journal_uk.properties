journal.document.adventurers_guide.alchemy.body=Якщо ви вважаєте витратний предмет некорисним, ви можете використовувати його як алхімічний інгредієнт або перетворити на універсальну алхімічну енергію. Енергетизуючі зілля та сувої також їх ідентифікують!\n\nБрилечки – це унікальний вид спорядження, яке створюється та покращується за допомогою алхімії. Вони виготовляються з магічного каталізатора-брилечки та невеликої кількості алхімічної енергії.\n\n (Перший алхімічний горщик знаходиться на 3-му або 4-му поверсі підземелля. Біля цих горщиків також є сторінки книги рецептів алхімії.)
journal.document.adventurers_guide.alchemy.title=Алхімія та дрібнички
journal.document.adventurers_guide.dieing.body=Підземелля небезпечне, і більшість шукачів пригод зрештою загинуть.\n\nУдача допомагає, але найкращі шукачі пригод використовують кожну маленьку хитрість, щоб збільшити свої шанси.\n\n (Не засмучуйтесь, якщо ви часто вмираєте, ця гра складна! Зосередьтеся на вивченні гри та постійному вдосконаленні, а не на одразу виграші.)
journal.document.adventurers_guide.dieing.title=Як впоратися з поразкою
journal.document.adventurers_guide.examining.body=Важливо вивчати своїх ворогів та оточення, а не поспішати наосліп! Візьміть за звичку досліджувати все нове.\n\n (Ви можете досліджувати, використовуючи кнопку лупи, а потім вибираючи те, що хочете досліджувати. Ви також можете досліджувати посилення або ослаблення, вибираючи їхні значки.)
journal.document.adventurers_guide.examining.title=Вивчення
journal.document.adventurers_guide.food.body=Ефективне нормування — один із найкращих способів покращити свої шанси на виживання, вам не завжди потрібно правильно харчуватися, коли ви голодні!\n\nКоли ви не голодуєте, ваше здоров'я повільно відновлюватиметься, тому, якщо ви їсте з повним здоров'ям, ця регенерація буде витрачена даремно!\n\nЯкщо ви їсте поступово, виходячи зі свого здоров'я, вашої їжі вистачить набагато довше.
journal.document.adventurers_guide.food.title=Боротьба з голодом
journal.document.adventurers_guide.identifying.body=Кольори зілля та символів на сувоях відрізняються в кожному підземеллі. Неідентифіковане спорядження можна покращити або зачарувати, якщо вам пощастить, або ж воно може бути прокляте!\n\nСувої ідентифікації, покращення або зняття прокляття дуже корисні, якщо ви хочете зменшити ризик використання неідентифікованого спорядження.\n\n (Ви можете знайти список усіх предметів, які ви ідентифікували, у вкладці каталогу вашого журналу)
journal.document.adventurers_guide.identifying.title=Ідентифікація предметів
journal.document.adventurers_guide.intro.body=Вітаю, Шукачу пригод, ти читаєш «Том майстерності підземелля»! Цей посібник найкраще використовувати як довідник, і він чарівним чином підкаже тобі, коли найкраще читати кожну сторінку. \n\n (Коли кнопка журналу блимає, виберіть її, щоб прочитати, що розповідає тобі посібник! Однак деяких сторінок бракує, можливо, ти зможеш знайти їх у підземеллі?)
journal.document.adventurers_guide.intro.title=Вступ
journal.document.adventurers_guide.levelling.body=Підвищення рівня покращує ваші характеристики та приносить очки талантів, що може суттєво вплинути на бою. Найкраще мати принаймні один рівень для кожного поверху підземелля.\n\nМоже виникнути спокуса поспішати та уникати дослідження чи бою, але це позбавить вас припасів та досвіду.\n\n(Ви можете побачити інформацію про свого героя, включаючи досвід, на панелі стану в кутку ігрового інтерфейсу. Виберіть портрет свого героя, щоб отримати ще більше інформації.)
journal.document.adventurers_guide.levelling.title=Набуття досвіду
journal.document.adventurers_guide.looting.body=Кімнати, що знаходяться за замкненими дверима або містять перешкоди, зазвичай мають кращу здобич. Коли перешкода блокує ваш шлях, ви зазвичай можете знайти предмет, який допоможе вам, на тому ж поверсі.\n\nВи завжди зможете знайти 2 зілля сили та 3 сувої покращення в кожному п'ятиповерховому регіоні підземелля, тому вони є чудовим показником того, наскільки добре ви досліджуєте.\n\n (Ви можете побачити список орієнтирів та невикористаних ключів на вкладці нотаток вікна журналу.)
journal.document.adventurers_guide.looting.title=Ефективне мародерство
journal.document.adventurers_guide.magic.body=Магічні атаки прорізають броню і від них важко ухилитися. Це означає, що пошкодження від паличок дуже надійне, але також робить магічних ворогів дуже небезпечними!\n\nОднак магічні атаки завжди мають недолік. Палички мають обмежений заряд, і магічні вороги зазвичай не зможуть використовувати свою магію на близькій відстані.\n\nЗіткнувшись з ворогами, які використовують магію, важливо навчитися не дати їм використати її проти вас.
journal.document.adventurers_guide.magic.title=Магічні атаки
journal.document.adventurers_guide.positioning.body=Стратегія так само важлива, як і спорядження. Негативних ситуацій, таких як оточення, зазвичай можна уникнути завдяки гарному позиціонуванню.\n\nНаприклад, більшість підземель мають вузькі коридори, які змушують ворогів битися з вами по одному. Ці коридори також часто мають дверні отвори для несподіваних атак!\n\nІснує також багато дрібних способів використовувати такі елементи оточення, як трава, вода, ями чи пастки, на свою користь.
journal.document.adventurers_guide.positioning.title=Позиціонування
journal.document.adventurers_guide.searching.body=Підземелля повні таємних дверей і пасток, які на перший погляд здаються непомітними. Ви можете витратити деякий час і ретельно пошукати, якщо підозрюєте, що поруч заховані двері або пастка.\n\n(Ви можете обшукати всі плитки навколо вас, двічі натиснувши кнопку лупи. Можливо, поблизу того місця, де ви знайшли цю сторінку, є якісь приховані двері!)
journal.document.adventurers_guide.searching.title=Пошук
journal.document.adventurers_guide.strength.body=Немає часу тренуватися зі зброєю та бронею, які ви знайдете в підземеллі, тому вам знадобиться груба сила, щоб ефективно їх використовувати.\n\nЗілля сили та сувої покращення – найефективніший спосіб задовольнити вимоги до сили спорядження вищого рівня.\n\nВажливо зрештою почати використовувати предмети високого рівня, але не ігноруйте спорядження, яке ви можете використовувати прямо зараз.
journal.document.adventurers_guide.strength.title=Сила
journal.document.adventurers_guide.surprise_attacks.body=Несподівані атаки гарантовано вражають, що робить їх особливо корисними проти ухильних ворогів, таких як змії та привиди.\n\nВи можете здивувати ворогів одразу після того, як вони увійдуть у дверний проріз, переслідуючи вас, або коли вони іншим чином втратять вас з поля зору.
journal.document.adventurers_guide.surprise_attacks.title=Несподівані атаки
journal.document.adventurers_guide.title=том про майстерність підземель
journal.document.adventurers_guide.upgrades.body=Чим глибше ви заглиблюєтеся в підземелля, тим важливіше використовувати магічно покращене спорядження високого рівня, але вам також знадобиться сила, щоб правильно його використовувати.\n\nЖезли, кільця та артефакти не потребують сили, але мають обмежене використання або не так безпосередньо допомагають у бою.\n\nПравильний вибір щодо покращень дуже важливий для виживання на початку підземелля та для забезпечення успіху в подальшому.
journal.document.adventurers_guide.upgrades.title=Оновлення
journal.document.alchemy_guide.bombs.body=Стандартну бомбу з чорним порохом можна змішати з певним предметом для створення покращеної бомби.
journal.document.alchemy_guide.bombs.title=Покращені бомби
journal.document.alchemy_guide.brews_elixirs.body=Зілля та еліксири – це складні зілля з різноманітними ефектами, зазвичай одноразового використання.
journal.document.alchemy_guide.brews_elixirs.title=напої та еліксири
journal.document.alchemy_guide.energy_food.body=Багато рецептів вимагають кристалічної алхімічної енергії, яка виготовляється шляхом деконструювання витратних предметів в алхімічному горщику. Енергетизація зілля або сувоїв також дозволяє їх ідентифікувати.\n\nДеякі рецепти, що вимагають енергії, є магічними, але ці нагадують традиційну кулінарію.
journal.document.alchemy_guide.energy_food.title=Енергетика та продовольство
journal.document.alchemy_guide.exotic_potions.body=Зілля можна змішувати з енергією для створення екзотичних зілля. Вони мають потужніші ефекти, але часто корисні по-різному.
journal.document.alchemy_guide.exotic_potions.title=екзотичні зілля
journal.document.alchemy_guide.exotic_scrolls.body=Екзотичні сувої можна зробити за допомогою певної енергії та сувою. Вони трохи сильніші та дорожчі за екзотичні зілля.
journal.document.alchemy_guide.exotic_scrolls.title=екзотичні сувої
journal.document.alchemy_guide.potions.body=Ласкаво просимо до «Практичного застосування алхімії»! Ця книга є довідником рецептів для створення предметів в алхімічному горщику.\n\nПочнемо з найвідомішого рецепту: Зілля!\n\nВикористовуйте три насінини, щоб зварити випадкове зілля! Кожна насінина має свій аналог, використовуйте кілька однакових насінин, щоб збільшити ймовірність того, що зілля пов'язане з насінням, яке ви використали.
journal.document.alchemy_guide.potions.title=Вступ та зілля
journal.document.alchemy_guide.spells.body=Заклинання містяться в кристалах і забезпечують різноманітні ефекти, зазвичай з кількома способами використання.
journal.document.alchemy_guide.spells.title=заклинання
journal.document.alchemy_guide.stones.body=Якщо помістити сувій в алхімічний горщик, його магія передається двом каменям у горщику. Це створює рунічні камені та ідентифікує сувій!
journal.document.alchemy_guide.stones.title=Створення рунічних каменів
journal.document.alchemy_guide.title=Посібник з алхімії
journal.document.alchemy_guide.weapons.body=Деяку легшу або більш магічну зброю можна використовувати в алхімії!\n\nКожен комплект кидкової зброї виробляє достатньо рідкого металу, щоб повністю відремонтувати інший комплект того ж рівня та рангу. Зверніть увагу, що алхімізація комплекту знищить весь комплект, навіть якщо він не весь присутній!\n\nОдна чарівна паличка вироблятиме достатньо арканної смоли, щоб покращити дві палички одного рівня, але не вище +3.
journal.document.alchemy_guide.weapons.title=Покращення зброї
journal.document.caves_explorer.alive.body=23-тє літа, 308\n\nОдна з гномських машин якимось чином ожила! Ми просто проходили повз, коли вона кинулася в атаку і мало не розчавила двох членів нашої групи своїми величезними металевими кулаками. На щастя, я ніс із собою свою паличку розпаду. Кілька влучних пострілів, і ця жахлива істота перетворилася на металобрухт.\n\nМене турбує те, що ми абсолютно нічого не зробили, щоб спровокувати машину. Гноми ніяк не могли спроектувати машини такими агресивними, ніби вони намагалися влаштувати нам засідку!\n\nПринаймні, цього разу я зміг запропонувати якусь допомогу своїм супутникам.\n - Арчібальд
journal.document.caves_explorer.alive.title=Воно Живе!
journal.document.caves_explorer.city.body=21 літа, 308\n\nМи вже на тритижневій позначці, і після того, як ми витратили більшу частину останніх десяти днів, досліджуючи все глибше, ми нарешті дісталися дна шахт. Ми знайшли різні металеві пристрої та великі ворота, які блокують вхід до старого гномського мегаполісу.\n\nКоваль попередив нас про деякі з цих механізмів. Вони, очевидно, призначалися для оборони території та мають тенденцію активуватися, коли їх турбують. Нам немає справ у місті, а метал матиме мінімальну цінність як брухт, тому ми вирішили, що краще прислухатися до його попередження та повернутися.\n\nМушу визнати, що мені було цікаво, але розслідування там точно не варте ризику.\n - Арчібальд
journal.document.caves_explorer.city.title=Вхід до міста
journal.document.caves_explorer.discover_hint=Ви можете знайти цей текст у певному регіоні, але лише після того, як знайдете всі попередні тексти в цьому наборі.
journal.document.caves_explorer.expedition.body=1-ше літа, 308\n\nСьогодні починається наша чотиритижнева експедиція в покинуті гномські шахти! Сам король доручив мені дослідити регіон. Мої головні цілі — знайти будь-які невикористані природні ресурси та обстежити печери для потенційного проекту будівництва в'язниці.\n\nХоча я здатний захистити себе, я прийняв ескорт від міської варти за наполяганням короля. Вони купа простаків, але поки вони мене не сповільнюють, їхня присутність терпима.\n\nОчікується, що ми очистимо каналізацію та дістанемося шахт до вечора.\n — Арчібальд Драммонд. Архімаг, південний інститут чарівників.
journal.document.caves_explorer.expedition.title=Початок експедиції!
journal.document.caves_explorer.gold.body=4-те Літа, 308\n\nНаші перші кілька днів були справді дуже плідними! Після встановлення базового табору ми вирушили досліджувати деякі верхні ділянки покинутої шахти. Хоча гноми залишили після себе багато непотрібного безладу, багато стін печери також кишать золотом!\n\nНа жаль, ми тут не перші. Печери кишать агресивною дикою природою, і, схоже, зграї гнолів також зацікавлені в золоті. Зізнаюся, я був несправедливий до свого охоронця-ескорту, вони виявилися набагато здібнішими дослідниками та охоронцями, ніж я очікував.\n\nНавіть з цим успіхом нам ще належить дослідити багато шахт.\n - Арчібальд
journal.document.caves_explorer.gold.title=Стільки золота!
journal.document.caves_explorer.report.body=28-го літа, 308\n\nСьогодні ми закінчимо пакувати наші речі та готуватимемося до від'їзду. Якраз вчасно, деяким членам нашої групи почали снитися жахливі кошмари після інциденту з агресивною машиною. Ймовірно, це просто втома, але їхні кошмари всі тривожно схожі.\n\nПідсумовуючи, верхні ділянки шахти досить безпечні. Якщо можна знайти застосування для темного золота, то його видобуток може бути досить прибутковим. Великі відкриті простори також чудово підійдуть для будівельних планів міста. Однак нижні шахти є більш небезпечними, і їх слід уникати.\n\nЯ впишу все це у свій остаточний звіт протягом наступних кількох днів.\n - Арчібальд
journal.document.caves_explorer.report.title=Заключний звіт
journal.document.caves_explorer.title=Журнал дослідника
journal.document.caves_explorer.troll.body=11-те Літа, 308\n\nПочавши наше дослідження середньої частини шахт, ми натрапили на дружелюбне обличчя! Ну... відносно дружелюбне. Печерний троль облаштував там невелику кузню. Він грубуватий і не дуже балакучий, але полагодив наше спорядження в обмін на трохи золота.\n\nНа жаль, коваль-троль також повідомив нам, що все це чудове золото не таке вже й хороше, як здається. Він називає його «темним золотом», і воно, очевидно, швидко руйнується на сонячному світлі. Це, безумовно, пояснює, чому тут ніколи не було конфліктів через ресурси.\n\nГадаю, нам потрібно копнути трохи глибше, щоб побачити, чи є щось цінніше.\n- Арчібальд
journal.document.caves_explorer.troll.title=Зустрів троля
journal.document.city_warlock.discover_hint=Ви можете знайти цей текст у певному регіоні, але лише після того, як знайдете всі попередні тексти в цьому наборі.
journal.document.city_warlock.failure.body=Здається, я теж дурень. Я вважав, що Новому Королю потрібно, щоб двір добровільно йому підкорився, але тепер я бачу, що він має силу контролювати навіть тих, хто йому чинить опір.\n\nЯ сліпо привів усіх найсильніших опозиційних осіб прямо до свого порогу, щоб особисто перетворити їх на своїх рабів. Тепер хвилі його некротичної енергії прокочуються містом, миттєво перетворюючи більшість на його благачів.\n\nТі небагато, хто ще має вільну волю, тікають. Я вирішив залишитися, щоб якнайкраще спостерігати та шукати прохід. З тією магічною силою, яку я маю, я зможу деякий час залишатися прихованим і безпечним.
journal.document.city_warlock.failure.title=Невдача
journal.document.city_warlock.more_powerful.body=Слідкувати за часом стало важко, але минув приблизно тиждень з мого останнього запису. Наша цивілізація справді завалилася. Брама зачинена, всі функції нашого суспільства припинилися, а порожні гном'ячі лушпиння блукають коридорами.\n\nПротягом усього цього Новий Король якимось чином стає ще могутнішим. З кожним днем сила його волі міцнішає, але вона також змінюється. Я не можу це описати, але відчуття таке, ніби він взагалі перестав бути гномом.\n\nЯ починаю усвідомлювати, що найкраще, на що я, мабуть, можу сподіватися, це задокументувати ці події. Я залишуся тут якомога довше, а потім відступлю, як тільки моя воля почне слабшати.
journal.document.city_warlock.more_powerful.title=Потужніший
journal.document.city_warlock.new_power.body=Що тут відбувається? Сила, що виходить від Нового Короля, справді відрізняється від тієї, що була спочатку, але є й щось інше. Ця нова сила ніби випромінюється з найглибших залів нашого міста.\n\nЩе більш дивно те, що активність у верхній частині мегаполісу також зменшилася. Я не знаю, що відбувається там, унизу, але це привертає майже всю увагу Нового Короля.\n\nПовернення до глибоких залів буде небезпечним, але я маю з'ясувати, що спричиняє цю зміну. Можливо, у Нового Короля все ж таки є слабкість?
journal.document.city_warlock.new_power.title=Нова сила
journal.document.city_warlock.old_king.body=Це 5-й день 2-го місяця 33-го року ери магії. Якщо це читає мешканець надсвіту, то це десь Зима 264 року. Мене звати Тимор Захір, і наскільки мені відомо, я останній член двору гномів, що вижив.\n\nНаш Король мертвий, його замінив один з моїх колишніх колег, який збожеволів від влади. Решта двору підкорилася йому, як дурні, і в процесі втратила свою вільну волю. Я один передбачив це і втік, перш ніж його ритуал встиг завершитися.\n\nВнутрішнє коло впало, але влада Нового Короля ще не досягла всіх. Я повинен якомога швидше чинити опір. Я відмовляюся дозволити нашій славній цивілізації впасти перед цим мегаломаном!
journal.document.city_warlock.old_king.title=Король мертвий
journal.document.city_warlock.resistance.body=Здається, звістка швидко поширилася. Минуло лише кілька днів, а я вже зібрав невелику армію вірних Старому Королю. Мало хто володіє магією, але майже весь орден ченців-воїнів серед нас. Ми маємо бути більш ніж рівними одному божевільному гномові та його двору рабів.\n\nТим часом Новий Король сховався у внутрішніх покоях нашого міста. Безсумнівно, він витратив більшу частину своєї сили і сподівається оговтатися, перш ніж зіткнеться з новим опором.\n\nМи розпочнемо атаку ще за кілька годин. Сподіваємося, що ми зможемо сформувати тимчасову раду та повернути стабільність нашому дивовижному місту до кінця ночі.
journal.document.city_warlock.resistance.title=Опір
journal.document.city_warlock.seen_it.body=Я бачив те, що лежить внизу, але не можу цього описати. Мої руки неконтрольовано тремтять, коли я намагаюся викласти свої думки на папері.\n\nЧому це відбувається? Чи Новий Король це зробив? Це не має сенсу. Можливо, його безпідставне використання влади привабило це? Я сподівався врятувати нашу цивілізацію, але тепер я бачу, що на кону весь світ.\n\nЯкимось чином король — це менше зло. У мене немає іншого вибору, заради більшого блага я здамся. Будь ласка, керуй мною, мій королю, використовуй мене як інструмент, щоб стримувати Йог-Дзеву!
journal.document.city_warlock.seen_it.title=Я це бачив
journal.document.city_warlock.title=Щоденник Чаклуна
journal.document.halls_king.amulet.body=Я ЗРОБИВ ЦЕ!\n\nЯ не знав, що саме можу знайти, але те, що я там виявив, перевершило всі мої найсміливіші припущення. Стільки сили, яка просто лежить там, готова бути захопленою, і вона вся моя!\n\nЗ цим жоден з дурнів при дворі не наважиться мені заперечити. Я просто захоплююся думками про всілякі способи, якими я можу їх принизити. Чорт забирай, навіщо зупинятися на цьому, у мене достатньо сили, щоб знищити кожного з них, якщо захочу! Це може бути надмірно, але я не повинен надто довго вирішувати, інакше вони запідозрять щось підозрюваним.\n\nЯ думаю, я назву цю велику силу Амулетом Єндора!\n- R.
journal.document.halls_king.amulet.title=Амулет
journal.document.halls_king.attrition.body=У мене є план, як впоратися з цією істотою. Її сила безмежна, але її здатність вторгатися в цей світ — ні. Вона покладається на своїх міньйонів та аватарів, поки намагається накопичити достатньо сили, щоб забрати амулет.\n\nХоча я фізично не володію амулетом, я все ще маю повний контроль над його силою. Маючи все місто гномів у своєму розпорядженні, я також маю чисельну перевагу. Я можу просто продовжувати надсилати солдатів, щоб не дати їй захопити амулет, і поступово вигравати цю війну на виснаження!\n\nI, РОДНІ, КОРОЛЬ ГНОМІВ, ПЕРЕЖИВЕ ТЕБЕ, ЙОГ-ДЗЕВА!
journal.document.halls_king.attrition.title=Виснаження
journal.document.halls_king.discover_hint=Ви можете знайти цей текст у певному регіоні, але лише після того, як знайдете всі попередні тексти в цьому наборі.
journal.document.halls_king.new_king.body=Я КОРОЛЬ, АХАХАХАХААА!\n\nВони просто дозволили мені це зробити! Майже без жодних переконань вони погодилися дозволити мені «поділитися» цією силою з ними у великому ритуалі. За мить вони перетворилися з хору глузливих голосів на мій новий двір мовчазних підданих!\n\nЯк і очікувалося, Таймор утік, як боягуз, за перших ознак неприємностей. Я вже відчуваю силу опору, яку він нарощує. Думаю, я дозволю йому продовжувати, щоб він міг доставити всіх своїх змовників прямо до моїх дверей!\n\nОчевидно, що королівство теж мене не поважає, мабуть, я це теж виправлю.\n - Король гномів
journal.document.halls_king.new_king.title=Новий король
journal.document.halls_king.rejection.body=НЕДУРНИКИ!\n\nЗа останні 33 роки наше королівство процвітало завдяки нашим новим магічним технологіям. Ми навчилися викликати духів стихій та підкоряти їх своїй волі, але чомусь тепер подальші експерименти «занадто небезпечні».\n\nЯ знаю, що насправді відбувається. Відмова від моїх теорій не має нічого спільного з їхньою достовірністю та повністю пов'язана з людиною, яка їх пропонує. Вони, мабуть, усі сміються з мене за моєю спиною.\n\nНу, годі вже! Мені байдуже, що вони кажуть, я досліджуватиму найвіддаленіші куточки нашого всесвіту сам і залишу все, що відкрию, для себе!\n- R.
journal.document.halls_king.rejection.title=Відмова
journal.document.halls_king.ritual.body=Сьогодні Тимор публічно виступив проти мене та наполіг, щоб я пояснив своє нове джерело сили. Я відмахнувся від нього як міг, але знову відчуваю на собі осудливий погляд решти двору.\n\nЯ сподівався провести трохи більше часу, насолоджуючись затишшям перед бурею, але це насправді не має значення. Я вирішив, що хочу зробити. Я стверджуватиму, що отримав свою силу за допомогою нового ритуалу, і запропоную виконати його на інших чаклунах та Королі. Як тільки ритуал закінчиться, я стану королем!\n\nТимор, звичайно, заперечуватиме, але з такою кількістю запропонованої сили, сумніваюся, що вони його послухають!\n\nВСІ ВКЛАНЯТЬСЯ ПЕРЕДІ МНОЮ!\n - Майбутній Король Гномів
journal.document.halls_king.ritual.title=Ритуал
journal.document.halls_king.thing.body=Є проблема. Таймора було розправлено без зусиль, але, схоже, моє пошукання у зовнішніх планах не залишилося непоміченим.\n\nЩось... «річ»... привабилося до мого світу і починає пробиватися внизу нижніх залів. Щоб ще більше ускладнити ситуацію, це саме те місце, де я зберігав амулет! Така злобна істота, чому вона повинна намагатися позбавити мене сили, коли ще є багато чого, що можна взяти?\n\nНезважаючи на мою силу, я не думаю, що можу просто кинутися туди та боротися з нею. Її справжня сила незбагненна, але має бути якийсь спосіб її обмежити. Я ЗАХИСТЮ СВІЙ ПРИЗ!
journal.document.halls_king.thing.title=Річ
journal.document.halls_king.title=Щоденник ???
journal.document.intros.caves.body=Ці малонаселені печери простягаються під покинутою в'язницею. Багаті на корисні копалини, вони колись були центром жвавої торгівлі та промисловості для гномського суспільства внизу, але їх покинули, оскільки гноми стали одержимими темною магією.\n\nЗараз печери здебільшого населені підземною дикою природою, гнолами та покинутими механізмами; ймовірно, зіпсованими тією ж силою, яка вплинула на регіони вище.
journal.document.intros.caves.title=Печери
journal.document.intros.city.body=Гномська метрополія колись була найбільшим з усіх гномських міст-держав. У період свого розквіту гноми будували дивовижні машини з металу та магії, які дозволяли їхньому місту швидко розширюватися.\n\nОдного разу міські ворота були зачинені на заслінку, і ніхто більше не чув про гномів. Ті небагато, хто втік з міста, коли воно закривалося, розповідали історії про божевільного чаклуна, який викрав трон, і про жахливу магію, яку він навчився використовувати.
journal.document.intros.city.title=Гномська метрополія
journal.document.intros.discover_hint=Ви можете знайти цей текст, коли вперше в’їжджаєте до певного регіону.
journal.document.intros.dungeon.body=Багато героїв до вас наважувалися спуститися в підземелля з міста нагорі, про більшість із них більше ніколи не чули.\n\nКажуть, що в глибинах ховається давнє зло, яке охороняє всемогутній Амулет Єндора. Навіть зараз темна енергія випромінюється знизу, прокладаючи собі шлях у місто.\n\nЧи підкорите ви підземелля та отримаєте амулет? Час розпочати власну пригоду!
journal.document.intros.dungeon.title=Підземелля
journal.document.intros.halls.body=Ці глибокі зали Гномської Метрополіси спотворені темною магією. У минулому ці регіони приймали двір елітних чаклунів Короля Гномів, але тепер, здається, їх захопило щось ще зловісніше... \n\nУ цих залах населяють усілякі жахливі демонічні істоти, керовані якоюсь жахливою темною силою. Якщо Король Гномів не був джерелом поширення псування, то що б тут не було, воно там мало бути. \n\nСтупайте обережно, дуже мало шукачів пригод коли-небудь спускалися так низько...
journal.document.intros.halls.discover_hint=Ви можете знайти цей текст у певному регіоні, але лише після того, як знайдете всі попередні тексти в цьому наборі.
journal.document.intros.halls.title=Чертоги Демонів
journal.document.intros.prison.body=Багато років тому тут було збудовано в'язницю для небезпечних злочинців. Сюди привозили засуджених з усієї країни, які відбували покарання під суворим контролем та охороною.\n\nАле незабаром знизу почали повзати темні міазми, спотворюючи розуми як охоронців, так і в'язнів.\n\nУ відповідь на зростаючий хаос місто закрило всю в'язницю. Ніхто не знає, що сталося з тими, кого залишили помирати в цих стінах...
journal.document.intros.prison.title=В'язниця
journal.document.intros.sewers.body=Верхні поверхи підземелля фактично утворюють каналізаційну систему міста.\n\nТемна енергія підкралася знизу, і зазвичай нешкідливі каналізаційні істоти стали дедалі лютішими. Місту довелося відправити сюди охоронні патрулі, щоб спробувати забезпечити безпеку для тих, хто знаходиться нагорі.\n\nЦе місце небезпечне, але принаймні зла магія, яка тут діє, слабка.
journal.document.intros.sewers.title=Каналізація
journal.document.intros.title=Представлення регіонів
journal.document.prison_warden.discover_hint=Ви можете знайти цей текст у певному регіоні, але лише після того, як знайдете всі попередні тексти в цьому наборі.
journal.document.prison_warden.journal.body=1-ше весни, 362\n\nЦе перший запис у робочому журналі начальниці в'язниці Кіани Сміт. З огляду на все, що відбувається останнім часом, я вирішила почати вести щоденник, щоб упорядковувати свої думки.\n\nКерувати в'язницею за півмилі під землею ніколи не було легко, але останнім часом здається, що відбувається якийсь організований безлад. Ув'язнені поводяться без причини, а потім відмовляються пояснювати чому.\n\nДеякі охоронці починають говорити, що в цьому місці живуть привиди. Я не можу дозволити своїм людям поширювати чутки, але я не можу звинувачувати їх у тому, що вони неспокійні.\n- Сміт
journal.document.prison_warden.journal.title=Ведення щоденника
journal.document.prison_warden.letter.body=Томасе, \n\nТи був чудовим другом, тому я роблю тобі послугу.\n\nКоли ти почнеш свою зміну сьогодні ввечері, замкни та зміцни камеру Тенгу, кинь ключ у якусь нішу та вибирайся. Неважливо, чи інші в'язні без нагляду, дуже скоро ніхто не зможе вийти звідси. Але цей виродок має залишатися в безпеці, якщо він втече, невідомо, що він зробить.\n\nНікому про це не кажи, і не турбуйся мене шукати. Капітан має затонути разом зі своїм кораблем.\n- Кіана
journal.document.prison_warden.letter.title=Лист до Томаса
journal.document.prison_warden.mines.body=54-та Зима, 363\n\nA Сьогодні приїхала група інженерів з міста, які сказали, що вони тут, щоб закрити старий вхід до шахт внизу. Гадаю, місто більше не хоче турбуватися про обслуговування проходу. Мене, як завжди, не повідомили заздалегідь.\n\nЇхній головний інженер також розповів мені якусь нісенітницю про гномську магію, що просочується з шахт. Я не вірю жодному слову.\n\nСитуація набагато краще контролюється нашими новими співробітниками, але корінь проблеми досі не вирішено. Щось точно впливає на тутешніх ув'язнених, і знесення кількох стін цього не змінить.\n- Сміт
journal.document.prison_warden.mines.title=Герметизація шахт
journal.document.prison_warden.no_support.body=11-те весни, 364\n\nЩо, чорт забирай, думає місто? Після термінового прохання про допомогу я нічого не почув, навіть порожніх вибачень, як вони зазвичай надсилають, коли мої прохання відхиляють.\n\nТим часом стан ув'язнених продовжує погіршуватися, а деякі охоронці навіть почали створювати проблеми. Невже вони планують просто дозволити цьому погіршуватися, поки ми не зіткнемося з бунтом!?\n\nТомас, як і завжди, залишився надійним. Його організаційна допомога була неоціненною, а його ідея активувати ті старі одиниці DM-100 була прикрою, але необхідною. Я впевнений, що зможу впоратися з цією ситуацією, мені просто потрібна якась клята підтримка!\n-Сміт
journal.document.prison_warden.no_support.title=Без підтримки
journal.document.prison_warden.recruits.body=80-та весна, 362\n\nЯк обіцяли, сьогодні прибула купа новачків. Здається, як завжди, кілька перспективних і багато бідолах, які просто хочуть заробітної плати. Тим не менш, наявність усіх цих нових м'язів має дуже допомогти з нашими нещодавніми неслухняними ув'язненими.\n\nУ такій роботі важливо знати, кому можна довіряти. Один новачок, Томас, здається особливо перспективним. Мені потрібна вся можлива допомога прямо зараз, тому, якщо він добре впорається, я подбаю про його швидке підвищення.\n- Сміт
journal.document.prison_warden.recruits.title=Нові рекрути
journal.document.prison_warden.rotberry.body=23 осені, 363\n\nСьогодні отримав чудовий подарунок від Фелікса. Це якийсь яскраво-червоний чагарник під назвою «Гниль».\n\nЯ вже згадував йому раніше, яке похмуре це місце, здається, він слухав. За його словами, ця рослина насправді не любить світло та воду, тому мені просто доводиться обрізати листя приблизно раз на місяць. Хоча обрізка, мабуть, важлива, він згадував про це десяток разів у своєму листі.\n\nЗвичайно, Фелікс ніколи нічого не робить безкоштовно. Він каже, що насіння, яке ця рослина дає, чудово підходить для виготовлення чарівних паличок, тому, природно, я винен йому кілька щоразу, коли рослина дає кілька.\n- Сміт
journal.document.prison_warden.rotberry.title=Рослина гнильниці
journal.document.prison_warden.title=Щоденник наглядача
journal.document.sewers_guard.crabs.body=11-те Зими, 376\nДорогі мамо й тату,\n\nЯкби ж пацюків було недостатньо, ще глибше внизу водяться гігантські краби! Один з них промчав повз мене і сильно поранив Лі, перш ніж ми його вбили. Томас каже, що це не моя вина, але я знаю, що він просто намагається бути до мене добрим.\n\nНа щастя, по дорозі ми натрапили на шукача пригод, у якого була запасна мазь з сонцезахисної трави. Лі міг би не вижити без неї.\n\nЯ бачив, як шукач пригод дивився на троянду, перш ніж вони пішли, вони сказали, що це подарунок. Навіщо їм ризикувати своїм життям тут, унизу, якщо хтось так піклується про них?\n\nСаме це я і роблю, чи не так? У мене таке відчуття, що я заглибився в це.
journal.document.sewers_guard.crabs.title=Гігантські краби!
journal.document.sewers_guard.dangerous.body=88-ма осінь, 375\nДорогі мамо й тату,\n\nЯ розумію, чому зараз така гарна оплата, каналізація кишить монстрами! «Шкодники» та «злочинці» — це велетенські кровожерливі щури та зграї розлючених гнолів.\n\nНа щастя, решта моєї команди справді знає, що робить. Капітан нашої команди, Томас, — експерт у цьому. Я намагаюся швидко вчитися, щоб не бути надто великим тягарем.\n\nЦя робота набагато небезпечніша, ніж я думав. Я радий, що не можу зараз це надіслати, не хочу, щоб ви хвилювалися.\n\nЯ буду обережним,\n — Соня
journal.document.sewers_guard.dangerous.title=Небезпечна позиція...
journal.document.sewers_guard.discover_hint=Ви можете знайти цей текст у певному регіоні, але лише після того, як знайдете всі попередні тексти в цьому наборі.
journal.document.sewers_guard.guild.body=23-тє Зими, 376\nЛюбі мамо й тату,\n\nЦього разу нових монстрів немає, натомість ми натрапили на невелику групу з гільдії злодіїв під час патрулювання.\n\nВсе, що я чув про гільдію, погано, але решта моєї команди здавалася майже дружньою з ними. Томас обмінявся інформацією та припасами з одним із них, перш ніж ми розійшлися.\n\nЯ не розумію, хіба ми не мали позбуватися злочинців? Томас навіть сказав не згадувати про це нікому з командирів. Однак їхня інформація та припаси були дуже корисними, і ми не могли витримати ще більшої боротьби.\n\nГадаю, ми всі тут разом у цьому.
journal.document.sewers_guard.guild.title=Гільдія злодіїв
journal.document.sewers_guard.lost.body=40-те число Зими, 376\n\nМи з Томасом заблукали. Нас відштовхнуло від решти команди під час битви з кількома гнолами. Жоден з нас не постраждав, але нижня каналізація схожа на лабіринт.\n\nТомас каже, що знає вихід, але він починається біля старого входу до в'язниці на дні каналізації. Мені дуже не подобається занурюватися глибше, але у нас немає провізії, і спускатися набагато швидше, ніж блукати навколо в пошуках маршруту нашого патруля.\n\nВсе буде добре. Томас знає, що робить.
journal.document.sewers_guard.lost.title=Ми заблукали
journal.document.sewers_guard.new_position.body=85-та осінь, 375\nДорогі мамо й тату,\n\nЯ ж казав вам, що вся важка праця міської варти окупиться. Мене щойно підвищили!\n\nМене запросили приєднатися до спеціалізованої команди, яка працює в каналізації. Мабуть, там є проблеми з шкідниками та злочинцями, і наша робота — їх вичищати. Це брудна робота, але взимку в каналізації тепло, і там платять втричі більше, ніж на звичайній варті!\n\nВсе це трохи секретно, тому я насправді не можу надіслати цього листа. Дивно не писати вам, тому я все одно продовжуватиму їх писати. Можливо, колись я зможу їх вам показати.\n\nНайкраще,\n — Соня
journal.document.sewers_guard.new_position.title=Моя Нова Посада!
journal.document.sewers_guard.not_worth.body=Ми з Томасом натрапили на якогось величезного монстра зі слизу біля входу в в'язницю. Перш ніж ми встигли зреагувати, він обрушився на нас з магією. Томас забрав більшу частину. Його немає.\n\nЖодні гроші цього не варті. Я збираюся піти тим маршрутом, про який мені розповідав Томас. Потім я візьму те, що заробив охоронцем, і використаю це, щоб перевезти мене та батьків подалі від цього проклятого міста. Частина мене хоче сподіватися, що у короля є план на все це, але я сумніваюся.\n\nЯ залишаю ці листи як попередження іншим. Це більше, ніж просто гігантські щури та краби, тут щось дуже не так.
