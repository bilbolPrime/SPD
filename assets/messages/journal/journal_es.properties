journal.document.adventurers_guide.alchemy.body=Si no encuentras útil un objeto consumible, puedes usarlo como ingrediente de alquimia o convertirlo en energía alquímica multiusos. ¡Las pociones y pergaminos energizantes también los identifican! Los abalorios son un tipo único de equipo que se crea y mejora mediante alquimia. Se fabrican con un catalizador mágico de abalorios y un poco de energía alquímica. (La primera olla de alquimia está en el tercer o cuarto piso de la mazmorra. Cerca de estas ollas también hay páginas de libros de recetas de alquimia).
journal.document.adventurers_guide.alchemy.title=Alquimia y baratijas
journal.document.adventurers_guide.dieing.body=Explorar mazmorras es peligroso y la mayoría de los aventureros acaban encontrando su fin. La suerte ayuda, pero los mejores aventureros usan todos los trucos posibles para aumentar sus probabilidades. (No te preocupes si mueres mucho, ¡este juego es difícil! Concéntrate en aprender a jugar y mejorar poco a poco, no en ganar de inmediato).
journal.document.adventurers_guide.dieing.title=Cómo afrontar la derrota
journal.document.adventurers_guide.examining.body=Es importante estudiar a tus enemigos y el entorno en lugar de lanzarte a ciegas. Acostúmbrate a examinar todo lo nuevo. (Puedes examinar usando el botón de la lupa y seleccionando lo que deseas examinar. También puedes examinar mejoras o desventajas seleccionando sus iconos).
journal.document.adventurers_guide.examining.title=Examinando
journal.document.adventurers_guide.food.body=Racionar eficazmente es una de las mejores maneras de mejorar tus probabilidades de supervivencia, ¡no siempre necesitas comer justo cuando tienes hambre!\n\nCuando no te estás muriendo de hambre regenerarás lentamente la salud, ¡así que si comes con la salud al máximo esa regeneración se desperdiciará!\n\nSi dosificas tus comidas en función de tu salud, tu comida durará mucho más.
journal.document.adventurers_guide.food.title=Cómo afrontar el hambre
journal.document.adventurers_guide.identifying.body=Los colores de las pociones y los símbolos de los pergaminos varían en cada mazmorra. Si tienes suerte, puedes mejorar o encantar el equipo no identificado, ¡o podría estar maldito! Los pergaminos de identificación, mejora o eliminación de maldiciones son muy útiles para reducir el riesgo de usar equipo no identificado. (Puedes encontrar una lista de todos los objetos que has identificado en la pestaña del catálogo de tu diario).
journal.document.adventurers_guide.identifying.title=Identificación de objetos
journal.document.adventurers_guide.intro.body=¡Saludos, aventurero! Estás leyendo el Tomo del Maestro de Mazmorras. Esta guía es ideal como referencia y te indicará mágicamente cuándo es el mejor momento para leer cada página. (Cuando el botón del diario parpadee, selecciónalo para leer la guía. Faltan algunas páginas; quizás puedas encontrarlas en la mazmorra).
journal.document.adventurers_guide.intro.title=Introducción
journal.document.adventurers_guide.levelling.body=Subir de nivel mejora tus estadísticas y te otorga puntos de talento, lo que puede marcar una gran diferencia en el combate. Lo ideal es tener al menos un nivel por cada piso de la mazmorra. Puede resultar tentador apresurarse y evitar la exploración o el combate, pero hacerlo te privará de suministros y experiencia. (Puedes ver información sobre tu héroe, incluyendo la experiencia, en el panel de estado en la esquina de la interfaz del juego. Selecciona el retrato de tu héroe para obtener aún más información).
journal.document.adventurers_guide.levelling.title=Adquirir experiencia
journal.document.adventurers_guide.looting.body=Las habitaciones que están detrás de puertas cerradas o que contienen obstáculos suelen tener mejor botín. Cuando un obstáculo bloquea tu camino, normalmente puedes encontrar un objeto que te ayude en el mismo piso. Siempre podrás encontrar 2 pociones de fuerza y 3 pergaminos de mejora en cada región de mazmorra de cinco pisos, por lo que son un buen indicador de lo bien que estás explorando. (Puedes ver una lista de puntos de referencia y llaves sin usar en la pestaña de notas de la ventana del diario).
journal.document.adventurers_guide.looting.title=Saqueo efectivo
journal.document.adventurers_guide.magic.body=Los ataques mágicos atraviesan la armadura y son difíciles de esquivar. Esto significa que el daño de las varitas es muy confiable, ¡pero también hace que los enemigos mágicos sean muy peligrosos!\n\nSin embargo, los ataques mágicos siempre tienen una desventaja. Las varitas tienen cargas limitadas y los enemigos mágicos generalmente no podrán usar su magia a corta distancia.\n\nCuando te enfrentas a enemigos que usan magia, es importante aprender cómo evitar que la usen contra ti.
journal.document.adventurers_guide.magic.title=Ataques mágicos
journal.document.adventurers_guide.positioning.body=La estrategia es tan importante como el equipo. Las malas situaciones como ser rodeado generalmente se pueden evitar con un buen posicionamiento. Por ejemplo, la mayoría de las mazmorras tienen pasillos estrechos que obligan a los enemigos a luchar contra ti uno por uno. ¡Estos pasillos a menudo también tienen puertas para ataques sorpresa! También hay muchas pequeñas maneras de usar elementos del entorno como hierba, agua, pozos o trampas a tu favor.
journal.document.adventurers_guide.positioning.title=Posicionamiento
journal.document.adventurers_guide.searching.body=Las mazmorras están llenas de puertas secretas y trampas que parecen invisibles a primera vista. Puedes tomarte tu tiempo y buscar con cuidado si sospechas que hay una puerta o trampa oculta cerca. (Puedes buscar en todas las casillas a tu alrededor usando el botón de la lupa dos veces. ¡Quizás haya algunas puertas ocultas cerca de donde encontraste esta página!)
journal.document.adventurers_guide.searching.title=Búsqueda
journal.document.adventurers_guide.strength.body=No hay tiempo para entrenar con las armas y armaduras que encuentres en la mazmorra, así que necesitarás fuerza bruta para usarlas eficazmente. Las pociones de fuerza y los pergaminos de mejora son la forma más eficaz de cumplir con los requisitos de fuerza del equipo de nivel superior. Es importante empezar a usar objetos de nivel superior con el tiempo, pero no ignores el equipo que puedes usar ahora mismo.
journal.document.adventurers_guide.strength.title=Fortaleza
journal.document.adventurers_guide.surprise_attacks.body=Los ataques sorpresa tienen la garantía de acertar, lo que los hace especialmente útiles contra enemigos evasivos como serpientes y espectros.\n\nPuedes sorprender a los enemigos justo después de que entren por una puerta mientras te persiguen, o cuando te pierdan de vista.
journal.document.adventurers_guide.surprise_attacks.title=Ataques sorpresa
journal.document.adventurers_guide.title=tomo de maestría de mazmorras
journal.document.adventurers_guide.upgrades.body=Cuanto más te adentras en una mazmorra, más importante es que uses equipo de alto nivel mejorado mágicamente, pero también necesitarás la fuerza para usarlo correctamente. Las varitas, los anillos y los artefactos no necesitan fuerza, pero tienen usos limitados o no ayudan tan directamente en combate. Tomar buenas decisiones sobre qué mejorar es muy importante para sobrevivir al principio de la mazmorra y para prepararte para el éxito más adelante en la mazmorra.
journal.document.adventurers_guide.upgrades.title=Actualizaciones
journal.document.alchemy_guide.bombs.body=Una bomba de pólvora negra estándar puede mezclarse con un ingrediente específico para crear una bomba mejorada.
journal.document.alchemy_guide.bombs.title=Bombas mejoradas
journal.document.alchemy_guide.brews_elixirs.body=Las pociones y los elixires son brebajes avanzados con una variedad de efectos, generalmente de un solo uso.
journal.document.alchemy_guide.brews_elixirs.title=Cervezas y elixires
journal.document.alchemy_guide.energy_food.body=Muchas recetas requieren energía alquímica de cristal, que se obtiene deconstruyendo objetos consumibles en un caldero de alquimia. Las pociones o pergaminos energizantes también las identifican. Algunas recetas que requieren energía son mágicas, pero estas se asemejan a la cocina tradicional.
journal.document.alchemy_guide.energy_food.title=Energía y alimentos
journal.document.alchemy_guide.exotic_potions.body=Las pociones se pueden mezclar con energía para crear pociones exóticas. Tienen efectos más potentes, pero a menudo resultan útiles de maneras diferentes.
journal.document.alchemy_guide.exotic_potions.title=pociones exóticas
journal.document.alchemy_guide.exotic_scrolls.body=Los pergaminos exóticos se pueden crear con algo de energía y un pergamino. Son un poco más potentes y caros que las pociones exóticas.
journal.document.alchemy_guide.exotic_scrolls.title=pergaminos exóticos
journal.document.alchemy_guide.potions.body=¡Bienvenidos a Aplicaciones Prácticas de la Alquimia! Este libro es una referencia de recetas para crear objetos en un caldero de alquimia.\n\nComenzaremos con la receta más emblemática: ¡Pociones!\n\nU¡Usa tres semillas para preparar una poción aleatoria! Cada semilla tiene una poción correspondiente, usa varias semillas iguales para aumentar la probabilidad de que la poción se relacione con las semillas que usaste.
journal.document.alchemy_guide.potions.title=Introducción y pociones
journal.document.alchemy_guide.spells.body=Los hechizos están contenidos en cristales y proporcionan una variedad de efectos, generalmente con múltiples usos.
journal.document.alchemy_guide.spells.title=hechizos
journal.document.alchemy_guide.stones.body=Al mezclar un pergamino en un caldero de alquimia, su magia se infundirá en dos piedras dentro del caldero. ¡Esto crea piedras rúnicas e identifica el pergamino!
journal.document.alchemy_guide.stones.title=Creación de runas
journal.document.alchemy_guide.title=Guía de alquimia
journal.document.alchemy_guide.weapons.body=Algunas de las armas más ligeras o más mágicas se pueden usar en alquimia!\n\nCada conjunto de armas arrojadizas produce suficiente metal líquido para reparar completamente otro conjunto del mismo nivel y categoría. ¡Tenga en cuenta que alquimizar un conjunto destruirá todo el conjunto, incluso si no está todo presente!\n\nUna varita producirá suficiente resina arcana para mejorar dos varitas del mismo nivel, pero no más allá de +3.
journal.document.alchemy_guide.weapons.title=Mejora de armas
journal.document.caves_explorer.alive.body=23 de verano de 308\n\n¡Una de las máquinas enanas cobró vida de alguna manera! Simplemente pasábamos por allí cuando cargó y casi aplastó a dos de nuestro grupo con sus enormes puños de metal. Por suerte, llevaba conmigo mi varita de desintegración. Unos cuantos disparos bien dirigidos y la bestia quedó reducida a chatarra.\n\nLo que me preocupa es que no hicimos absolutamente nada para provocar a la máquina. ¡Los enanos no podrían haber diseñado las máquinas para ser tan agresivas, es como si estuviera intentando emboscarnos!\n\nAl menos pude ofrecer algo de ayuda a mis compañeros por una vez.\n- Archibald
journal.document.caves_explorer.alive.title=¡Está vivo!
journal.document.caves_explorer.city.body=21 de verano de 308\n\nYa llevamos tres semanas y, tras pasar gran parte de los últimos diez días explorando cada vez más profundo, por fin hemos llegado al fondo de las minas. Encontramos varios artilugios metálicos y una gran puerta que bloquea la entrada a la antigua metrópolis enana.\n\nEl herrero nos advirtió sobre parte de esta maquinaria. Aparentemente, estaba destinada a la defensa de la zona y tiende a activarse al ser molestada. No tenemos nada que hacer en la ciudad, y el metal tendría un valor mínimo como chatarra, así que pensamos que lo mejor era hacerle caso y marcharnos.\n\nDebo admitir que tenía curiosidad, pero investigar allí abajo no merecía la pena el riesgo.\n- Archibald
journal.document.caves_explorer.city.title=La entrada a la ciudad
journal.document.caves_explorer.discover_hint=Puedes encontrar este texto en una región específica, pero solo después de haber encontrado todos los textos anteriores de este conjunto.
journal.document.caves_explorer.expedition.body=1 de verano de 308\n\n¡Hoy comienza nuestra expedición de cuatro semanas a las minas enanas abandonadas! El propio rey me ha encargado explorar la región. Mis principales objetivos son encontrar recursos naturales sin explotar y examinar las cuevas para un posible proyecto de construcción de una prisión.\n\nAunque soy capaz de defenderme, he aceptado una escolta de la guardia de la ciudad por insistencia del rey. Son un montón de simplones, pero mientras no me retrasen, su presencia es tolerable.\n\nSe espera que despejemos las alcantarillas y lleguemos a las minas antes del anochecer.\n- Archibald Drummond. Archimago, Instituto de Magia del Sur.
journal.document.caves_explorer.expedition.title=¡Comienza la expedición!
journal.document.caves_explorer.gold.body=4 de verano de 308\n\n¡Nuestros primeros días han sido muy fructíferos! Tras establecer un campamento base, nos dispusimos a explorar algunas de las zonas superiores de la mina abandonada. Si bien hay un montón de trastos inútiles dejados por los enanos, ¡muchas de las paredes de la cueva también están repletas de oro!\n\nUPor desgracia, no somos los primeros aquí. Las cuevas están plagadas de fauna salvaje agresiva, y parece que manadas de gnolls también tienen interés en el oro. Admito que fui injusto con mi escolta de guardias; han sido exploradores y guardaespaldas mucho más capaces de lo que esperaba.\n\nA pesar de este éxito, todavía nos queda mucho de la mina por explorar.\n- Archibald
journal.document.caves_explorer.gold.title=¡Tanto oro!
journal.document.caves_explorer.report.body=28 de verano, 308\n\nHoy terminaremos de empacar nuestras pertenencias y nos prepararemos para partir. Justo a tiempo, varios miembros de nuestro grupo han comenzado a tener pesadillas terribles tras el incidente con la máquina agresiva. Probablemente sea solo fatiga, pero sus pesadillas son inquietantemente similares.\n\nEn resumen, las zonas superiores de la mina son bastante seguras. Si se pudiera encontrar una utilidad para el oro oscuro, su extracción podría ser muy lucrativa. Los amplios espacios abiertos también serían muy útiles para los planes de construcción de la ciudad. Sin embargo, las minas inferiores son más peligrosas y deben evitarse.\n\nEscribiré todo esto en mi informe final durante los próximos días.\n- Archibald
journal.document.caves_explorer.report.title=Informe final
journal.document.caves_explorer.title=Diario del explorador
journal.document.caves_explorer.troll.body=11 de verano de 308\n\nDespués de comenzar nuestra exploración en la sección central de las minas, ¡nos encontramos con una cara amigable! Bueno... relativamente amigable. Un trol de las cavernas ha instalado una pequeña herrería allí. Es gruñón y poco hablador, pero reparó nuestro equipo a cambio de algo de oro.\n\nUdesafortunadamente, el herrero trol también nos ha informado que todo este hermoso oro no es tan bueno como parece. Lo llama "oro oscuro" y aparentemente se degrada rápidamente con la luz del sol. Eso ciertamente explicaría por qué nunca hubo conflictos por los recursos aquí.\n\nSupongo que necesitamos excavar un poco más profundo para ver si hay algo más valioso.\n- Archibald
journal.document.caves_explorer.troll.title=Me encontré con un troll
journal.document.city_warlock.discover_hint=Puedes encontrar este texto en una región específica, pero solo después de haber encontrado todos los textos anteriores de este conjunto.
journal.document.city_warlock.failure.body=Parece que yo también soy un tonto. Supuse que el Nuevo Rey necesitaba que la corte se sometiera a él voluntariamente, pero ahora veo que tiene el poder de controlar incluso a aquellos que se resisten a él.\n\nCiegomente traje a toda la oposición más fuerte directamente a su puerta para poder convertirlos personalmente en sus esclavos. Ahora oleadas de su energía necrótica están inundando la ciudad, convirtiendo instantáneamente a la mayoría en sus suplicantes.\n\nLos pocos que aún tienen libre albedrío están huyendo. He elegido quedarme atrás para observar lo mejor que pueda y buscar una oportunidad. Con el poder mágico que tengo debería poder permanecer oculto y a salvo por algún tiempo.
journal.document.city_warlock.failure.title=Falla
journal.document.city_warlock.more_powerful.body=Llevar la cuenta del tiempo se ha vuelto difícil, pero ha pasado aproximadamente una semana desde mi última entrada. Nuestra civilización realmente se ha derrumbado. Las puertas están cerradas, todas las funciones de nuestra sociedad han cesado y cáscaras vacías de enanos vagan por los pasillos.\n\nA lo largo de todo esto, de alguna manera, el Nuevo Rey se está volviendo aún más poderoso. Cada día la fuerza de su voluntad se hace más fuerte, pero también está cambiando. No puedo describirlo, pero siento como si ya no fuera un enano en absoluto.\n\nEmpiezo a aceptar que lo mejor que probablemente puedo esperar hacer es documentar estos eventos. Me quedaré aquí todo el tiempo que pueda, y luego me retiraré cuando mi voluntad comience a debilitarse.
journal.document.city_warlock.more_powerful.title=Más potente
journal.document.city_warlock.new_power.body=¿Qué está pasando aquí? El poder que emana del Nuevo Rey es, en efecto, diferente al del principio, pero hay algo más. Este nuevo poder parece irradiar desde los pasillos más recónditos de nuestra ciudad. Aún más desconcertante es que la actividad en la metrópolis superior también ha disminuido. No sé qué está ocurriendo allí abajo, pero está atrayendo casi toda la atención del Nuevo Rey. Regresar a los pasillos profundos será peligroso, pero debo descubrir qué está causando este cambio. ¿Quizás el Nuevo Rey tenga una debilidad después de todo?
journal.document.city_warlock.new_power.title=Un nuevo poder
journal.document.city_warlock.old_king.body=Es el quinto día del segundo mes del trigésimo tercer año de la era de la magia. Si un habitante del mundo exterior está leyendo esto, es en algún momento del invierno de 264. Mi nombre es Thymor Zahir, y hasta donde sé soy el último miembro superviviente de la corte enana.\n\nNuestro rey ha muerto, reemplazado por uno de mis antiguos colegas que se ha vuelto loco de poder. El resto de la corte se sometió a él, como los necios que son, y perdió su libre albedrío en el proceso. Solo yo vi venir esto y huí antes de que su ritual pudiera completarse.\n\nEl círculo interno ha caído, pero el poder del Nuevo Rey aún no ha llegado a todos. Debo organizar una resistencia lo más rápido posible. ¡Me niego a dejar que nuestra gloriosa civilización caiga ante este megalómano!
journal.document.city_warlock.old_king.title=El rey ha muerto
journal.document.city_warlock.resistance.body=Parece que la noticia se ha extendido rápidamente. Han pasado solo unos días y ya he reunido un pequeño ejército de leales al Viejo Rey. Pocos son hábiles con la magia, pero casi toda la orden de monjes guerreros está entre nosotros. Deberíamos ser más que suficientes para derrotar a un enano enloquecido y su corte de esclavos.\n\nMientras tanto, el Nuevo Rey se ha escondido en las cámaras interiores de nuestra ciudad. Sin duda, ha gastado la mayor parte de su poder y espera recuperarse antes de encontrar más resistencia.\n\nLanzaremos nuestro ataque en un par de horas más. Con suerte, podremos formar un consejo provisional y devolver la estabilidad a nuestra maravillosa ciudad al final de la noche.
journal.document.city_warlock.resistance.title=Una resistencia
journal.document.city_warlock.seen_it.body=He visto lo que yace debajo, pero no puedo describirlo. Mis manos tiemblan incontrolablemente mientras intento plasmar mis pensamientos por escrito. ¿Por qué está sucediendo esto? ¿Lo hizo el Nuevo Rey? No tiene sentido. ¿Quizás su uso desenfrenado del poder lo atrajo? Tenía la esperanza de salvar nuestra civilización, pero ahora veo que el mundo entero está en juego. De alguna manera, el rey es el mal menor. No tengo otra opción, por el bien mayor me rendiré. ¡Por favor, guíame, mi rey, úsame como instrumento para mantener a raya a Yog-Dzewa!
journal.document.city_warlock.seen_it.title=Lo he visto
journal.document.city_warlock.title=Diario del brujo
journal.document.halls_king.amulet.body=¡LO HE LOGRADO!\n\nNo sabía exactamente qué iba a encontrar, pero lo que descubrí allí fuera superó mis especulaciones más descabelladas. ¡Tanto poder, ahí sentado, listo para ser tomado, y es todo mío!\n\nCon esto, ninguno de los tontos de la corte se atreverá a oponerse a mí. Estoy eufórico pensando en todas las diferentes maneras en que podría humillarlos. Diablos, ¿por qué parar ahí? ¡Tengo suficiente poder para destruirlos a todos si quiero! Eso podría ser excesivo, pero no debo tardar mucho en decidir o sospecharán.\n\n¡Creo que llamaré a este gran poder el Amuleto de Yendor!\n- R.
journal.document.halls_king.amulet.title=El amuleto
journal.document.halls_king.attrition.body=Tengo un plan para lidiar con la cosa. Su poder es infinito, pero su capacidad para invadir este mundo no lo es. Depende de secuaces y avatares para que hagan su voluntad mientras intenta acumular suficiente poder para tomar el amuleto.\n\nAunque no poseo el amuleto físicamente, todavía tengo control total sobre su poder. Con toda la ciudad enana a mi disposición, también tengo una ventaja numérica. ¡Simplemente puedo seguir enviando soldados para evitar que se apodere del amuleto y ganar esta guerra gradualmente por desgaste!\n\n¡YO, RODNEY, REY DE LOS ENANOS, TE SOBREVIVIRÉ, YOG-DZEWA!
journal.document.halls_king.attrition.title=Desgaste
journal.document.halls_king.discover_hint=Puedes encontrar este texto en una región específica, pero solo después de haber encontrado todos los textos anteriores de este conjunto.
journal.document.halls_king.new_king.body=¡SOY EL REY, AHAHAHAHAAA! ¡Simplemente me dejaron hacerlo! Casi sin convencerlos, aceptaron que 'compartiera' este poder con ellos en un gran ritual. ¡En un instante, se transformaron de un coro de voces burlonas en mi nueva corte de súbditos silenciosos! Como era de esperar, Thymor huyó como un cobarde a la primera señal de problemas. Ya puedo sentir la fuerza de resistencia que está formando. Creo que le permitiré continuar, ¡para que pueda traer a todos sus conspiradores directamente a mi puerta! Claramente, el reino tampoco me respeta, supongo que también arreglaré eso. - Rey de los Enanos
journal.document.halls_king.new_king.title=Un nuevo rey
journal.document.halls_king.rejection.body=¡IMBÉCILES!\n\nDurante los últimos 33 años, nuestro reino ha florecido con nuestra nueva tecnología mágica. Hemos aprendido a invocar espíritus elementales y doblegarlos a nuestra voluntad, pero de alguna manera ahora la experimentación adicional es "demasiado peligrosa".\n\nSé lo que realmente está pasando. El rechazo de mis teorías no tiene nada que ver con su mérito y todo que ver con la persona que las sugiere. Probablemente todos se estén riendo de mí a mis espaldas.\n\n¡Pues ya no más! No me importa lo que digan, exploraré los confines más lejanos de nuestro universo solo, ¡y me quedaré con todo lo que descubra para mí!\n- R.
journal.document.halls_king.rejection.title=Rechazo
journal.document.halls_king.ritual.body=Thymor me confrontó públicamente hoy temprano e insistió en que explicara mi nueva fuente de poder. Lo desestimé lo mejor que pude, pero puedo sentir las miradas juzgadoras del resto de la corte sobre mí una vez más.\n\nEsperaba pasar un poco más de tiempo disfrutando de la calma antes de la tormenta, pero realmente no importa. He decidido lo que quiero hacer. Afirmaré que obtuve mi poder a través de un nuevo ritual y me ofreceré a realizarlo en los otros brujos y en el Rey. ¡Una vez que el ritual termine, seré rey!\n\nThymor protestará, por supuesto, ¡pero con tanto poder en juego, dudo que le hagan caso!\n\n¡TODOS SE INCLINARÁN ANTE MÍ!\n- Futuro Rey de los Enanos
journal.document.halls_king.ritual.title=El ritual
journal.document.halls_king.thing.body=Hay un problema. Thymor fue derrotado sin esfuerzo, pero parece que mi búsqueda en los planos exteriores no pasó desapercibida.\n\nAlguna... 'cosa'... ha sido atraída a mi mundo y está empezando a abrirse paso por el fondo de los pasillos inferiores. Para complicar aún más las cosas, ¡ese es el lugar exacto donde guardé el amuleto! ¡Qué criatura tan rencorosa! ¿Por qué tiene que intentar negarme mi poder cuando hay mucho más allá afuera que tomar?\n\nA pesar de mi poder, no creo que pueda simplemente cargar y luchar contra él. Su verdadero poder es insondable, pero debe haber alguna manera de limitarlo. ¡DEFENDERÉ MI PREMIO!
journal.document.halls_king.thing.title=La cosa
journal.document.halls_king.title=Diario de ???
journal.document.intros.caves.body=Estas cuevas escasamente pobladas se extienden bajo la prisión abandonada. Ricas en minerales, alguna vez fueron un centro de bullicioso comercio e industria para la sociedad enana de abajo, pero fueron abandonadas cuando los enanos se obsesionaron con la magia oscura. Las cuevas ahora están habitadas principalmente por fauna subterránea, gnolls y maquinaria abandonada; probablemente corrompidas por el mismo poder que ha afectado a las regiones de arriba.
journal.document.intros.caves.title=cuevas
journal.document.intros.city.body=La Metrópolis Enana fue en su día la más grande de todas las ciudades-estado enanas. En su apogeo, los enanos construyeron maravillosas máquinas de metal y magia que permitieron que su ciudad se expandiera rápidamente.\n\nEntonces, un día, las puertas de la ciudad se cerraron y nadie volvió a saber de los enanos. Los pocos que escaparon de la ciudad cuando se cerró contaron historias de un hechicero loco que robó el trono y la terrible magia que había aprendido a dominar.
journal.document.intros.city.title=Metrópolis Enana
journal.document.intros.discover_hint=Este texto aparece al entrar por primera vez en una región específica.
journal.document.intros.dungeon.body=Muchos héroes se han aventurado en la mazmorra antes que tú desde la ciudad de arriba, de la mayoría nunca más se supo de ellos.\n\nSe dice que un antiguo mal acecha en las profundidades, custodiando el todopoderoso Amuleto de Yendor. Incluso ahora, una energía oscura irradia desde abajo, abriéndose camino hacia la ciudad.\n\n¿Conquistarás la mazmorra y reclamarás el amuleto? ¡Es hora de comenzar tu propia aventura!
journal.document.intros.dungeon.title=Mazmorra
journal.document.intros.halls.body=Estos profundos pasillos de la Metrópolis Enana han sido corrompidos por la magia oscura. En el pasado, estas regiones albergaban la corte de hechiceros de élite del Rey Enano, pero ahora parecen haber sido tomadas por algo aún más siniestro...\n\nTodo tipo de horribles criaturas demoníacas habitan estos pasillos, lideradas por un terrible poder oscuro. Si el Rey de los Enanos no fue la fuente de la corrupción que se extiende, lo que sea que haya aquí abajo debe serlo.\n\nCamina con cuidado, muy pocos aventureros han descendido jamás tan lejos...
journal.document.intros.halls.discover_hint=Puedes encontrar este texto en una región específica, pero solo después de haber encontrado todos los textos anteriores de este conjunto.
journal.document.intros.halls.title=Salones de demonios
journal.document.intros.prison.body=Hace muchos años se construyó aquí una prisión para albergar a criminales peligrosos. Estrictamente regulada y segura, los convictos de todo el país eran traídos aquí para cumplir sus condenas. Pero pronto un oscuro miasma comenzó a extenderse desde abajo, perturbando las mentes tanto de los guardias como de los prisioneros. En respuesta al creciente caos, la ciudad selló toda la prisión. Nadie sabe qué fue de aquellos que fueron abandonados a su suerte dentro de estos muros...
journal.document.intros.prison.title=Prisión
journal.document.intros.sewers.body=Los pisos superiores de la mazmorra constituyen en realidad el sistema de alcantarillado de la ciudad.\n\nA medida que la energía oscura se ha ido infiltrando desde abajo, las criaturas de alcantarillado, normalmente inofensivas, se han vuelto cada vez más feroces. La ciudad ha tenido que enviar patrullas de guardias hasta aquí para intentar mantener la seguridad de los que están arriba.\n\nEste lugar es peligroso, pero al menos la magia maligna que actúa aquí es débil.
journal.document.intros.sewers.title=alcantarillas
journal.document.intros.title=Presentación de las regiones
journal.document.prison_warden.discover_hint=Puedes encontrar este texto en una región específica, pero solo después de haber encontrado todos los textos anteriores de este conjunto.
journal.document.prison_warden.journal.body=1 de primavera de 362\n\nEsta es la primera entrada en el diario de trabajo de la alcaidesa Kiana Smith. Con todo lo que ha estado pasando últimamente, he decidido empezar un diario para ordenar mis pensamientos.\n\nAdministrar una prisión a ochocientos metros bajo tierra nunca iba a ser fácil, pero últimamente parece que está ocurriendo algún tipo de disturbio organizado. Los reclusos se han estado comportando mal sin motivo y luego se niegan a explicar por qué.\n\nAlgunos guardias están empezando a decir que el lugar está embrujado. No puedo permitir que mi gente difunda rumores, pero no puedo culparlos por estar inquietos.\n- Smith
journal.document.prison_warden.journal.title=Cómo llevar un diario
journal.document.prison_warden.letter.body=Thomas,\n\nHas sido un gran amigo, así que te haré un favor.\n\nCuando empieces tu turno esta noche, cierra y refuerza la celda de Tengu, tira la llave en algún hueco y sal. No importa si los demás prisioneros están desatendidos, muy pronto nadie podrá salir de este lugar. Ese bicho raro tiene que permanecer bajo llave, si escapa no se sabe lo que hará.\n\nNo le cuentes esto a nadie y no te molestes en buscarme. Una capitana debe hundirse con su barco.\n- Kiana
journal.document.prison_warden.letter.title=Carta a Thomas
journal.document.prison_warden.mines.body=54 de invierno, 363\n\nUn grupo de ingenieros de la ciudad vino hoy, diciendo que están aquí para sellar la antigua entrada a las minas de abajo. Supongo que la ciudad ya no quiere molestarse en mantener el pasaje. No me informaron con anticipación, como de costumbre.\n\nSu ingeniero jefe también me contó una tontería sobre magia enana que se filtra desde las minas. No me creo ni una palabra.\n\nLa situación está mucho mejor controlada con nuestro nuevo personal, pero la raíz del problema aún no se ha abordado. Definitivamente algo está afectando a los reclusos aquí, y derribar algunas paredes no va a cambiar eso.\n- Smith
journal.document.prison_warden.mines.title=Sellando las minas
journal.document.prison_warden.no_support.body=11 de primavera de 364\n\n¿En qué demonios está pensando la ciudad? Después de solicitar ayuda urgentemente, no he recibido respuesta, ni siquiera una disculpa vacía como las que suelen enviar cuando se deniegan mis solicitudes.\n\nMientras tanto, la situación de los reclusos sigue empeorando, e incluso algunos guardias han empezado a causar problemas. ¿Acaso planean dejar que esto siga empeorando hasta que tengamos que lidiar con un motín?\n\nAl menos Thomas se ha mantenido tan confiable como siempre. Su ayuda organizativa ha sido invaluable, y su idea de activar esas viejas unidades DM-100 fue lamentable pero necesaria. Confío en que puedo volver a controlar esta situación, ¡solo necesito un poco de apoyo!\n-Smith
journal.document.prison_warden.no_support.title=Sin soporte
journal.document.prison_warden.recruits.body=80 de primavera, 362\n\nComo prometí, hoy llegaron varios reclutas nuevos. Parece lo de siempre: algunos prometedores y muchos peones que solo quieren el sueldo. Aun así, tener toda esta fuerza nueva debería ayudar mucho con nuestros reclusos rebeldes recientes.\n\nEn un trabajo como este es importante saber en quién puedes confiar. Un nuevo empleado, Thomas, parece especialmente prometedor. Necesito toda la ayuda que pueda conseguir ahora mismo, así que si lo hace bien, veré si puedo ascenderlo rápidamente.\n- Smith
journal.document.prison_warden.recruits.title=Nuevos reclutas
journal.document.prison_warden.rotberry.body=23 de otoño, 363\n\nHoy recibí un bonito regalo de Félix. Es una especie de arbusto rojo brillante llamado 'Rotberry'.\n\nYa le había comentado lo deprimente que es este lugar, parece que me escuchó. Según él, a esta planta no le gusta la luz ni el agua, así que solo tengo que podar las hojas una vez al mes más o menos. Podarla debe ser importante, lo mencionó una docena de veces en su carta.\n\nPor supuesto, Félix nunca hace nada gratis. Dice que las semillas que produce esta planta son estupendas para hacer varitas, así que, naturalmente, le debo unas cuantas cada vez que la planta produce algunas.\n- Smith
journal.document.prison_warden.rotberry.title=Planta de Rotberry
journal.document.prison_warden.title=Diario del alcaide
journal.document.sewers_guard.crabs.body=11 de invierno de 376\nQueridos mamá y papá,\n\nComo si las ratas no fueran lo suficientemente malas, ¡más abajo hay cangrejos gigantes! Uno de ellos pasó corriendo junto a mí y golpeó a Lee bastante mal antes de que lo matáramos. Thomas dice que no es mi culpa, pero sé que solo está tratando de ser amable conmigo.\n\nAfortunadamente, al salir nos encontramos con un aventurero que tenía un poco de ungüento de hierba solar de sobra. Lee podría no haberlo logrado sin eso.\n\nVi al aventurero mirando una rosa antes de que se fueran, dijeron que era un regalo. ¿Por qué arriesgarían su vida aquí abajo si alguien se preocupa tanto por ellos?\n\nEso es exactamente lo que estoy haciendo, ¿no? Siento que me he metido en un lío.
journal.document.sewers_guard.crabs.title=¡Cangrejos gigantes!
journal.document.sewers_guard.dangerous.body=88 de otoño de 375\nQueridos mamá y papá,\n\nAhora entiendo por qué el sueldo es tan bueno: ¡las alcantarillas están infestadas de monstruos! Las "alimañas" y los "forajidos" son ratas gigantes sedientas de sangre y manadas de gnolls furiosos.\n\nAfortunadamente, el resto de mi equipo sabe muy bien lo que hace. Nuestro capitán, Thomas, es un experto en esto. Estoy intentando aprender rápido para no ser una carga.\n\nEste trabajo es mucho más peligroso de lo que pensaba. Me alegro de no poder enviar esto ahora, no quiero que se preocupen.\n\nMe mantendré a salvo,\n- Sonya
journal.document.sewers_guard.dangerous.title=Una posición peligrosa...
journal.document.sewers_guard.discover_hint=Puedes encontrar este texto en una región específica, pero solo después de haber encontrado todos los textos anteriores de este conjunto.
journal.document.sewers_guard.guild.body=23 de invierno, 376\nQueridos mamá y papá,\n\nEsta vez no hay nuevos monstruos, en cambio nos topamos con un pequeño grupo del gremio de ladrones mientras patrullábamos.\n\nTodo lo que he oído sobre el gremio es malo, pero el resto de mi equipo parecía casi amigable con ellos. Thomas intercambió información y suministros con uno de ellos antes de que nos separáramos.\n\nNo entiendo, ¿no se suponía que debíamos deshacernos de los forajidos? Thomas incluso dijo que no le mencionáramos esto a nadie al mando. Sin embargo, su información y suministros fueron muy útiles, y no podíamos soportar más lucha.\n\nSupongo que todos estamos juntos en esto aquí abajo.
journal.document.sewers_guard.guild.title=El gremio de ladrones
journal.document.sewers_guard.lost.body=40 de invierno, 376\n\nThomas y yo estamos perdidos. Nos alejamos del resto del equipo mientras luchábamos contra unos gnolls. Ninguno de nosotros está herido, pero las alcantarillas inferiores son como un laberinto.\n\nThomas dice que conoce una ruta de salida, pero comienza en la antigua entrada de la prisión en el fondo de las alcantarillas. Realmente no me gusta ir más profundo, pero no tenemos raciones y bajar es mucho más rápido que vagar por ahí buscando nuestra ruta de patrulla.\n\nTodo estará bien. Thomas sabe lo que está haciendo.
journal.document.sewers_guard.lost.title=Estamos perdidos
journal.document.sewers_guard.new_position.body=85 de otoño, 375\nQueridos mamá y papá,\n\nLes dije que todo el trabajo duro en la guardia de la ciudad valdría la pena. ¡Acabo de ser ascendido!\n\nMe han invitado a unirme a un equipo especializado que trabaja en las alcantarillas. Aparentemente hay problemas con alimañas y forajidos allí abajo, y es nuestro trabajo limpiarlos. Es un trabajo sucio, pero las alcantarillas son cálidas en invierno y ¡paga tres veces más que el servicio de guardia regular!\n\nAunque todo es un poco secreto, así que en realidad no puedo enviar esta carta. Se siente raro no escribirles, así que voy a seguir escribiéndoles de todos modos. Quizás pueda mostrártelas algún día.\n\nBest,\n- Sonya
journal.document.sewers_guard.new_position.title=¡Mi nuevo puesto!
journal.document.sewers_guard.not_worth.body=Thomas y yo nos topamos con una especie de monstruo de limo gigante en la entrada de la prisión. Antes de que pudiéramos reaccionar, nos atacó con magia. Thomas recibió la mayor parte. Se ha ido.\n\nNinguna cantidad de dinero vale esto. Voy a irme por la ruta que Thomas me dijo. Luego tomaré lo que he ganado como guardia y lo usaré para sacar a mis padres y a mí de esta ciudad maldita. Una parte de mí quiere esperar que el Rey tenga un plan para todo esto, pero lo dudo.\n\nDejo estas cartas como advertencia para otros. Es más que solo ratas y cangrejos gigantes, algo anda muy mal aquí abajo.
journal.document.sewers_guard.not_worth.title=No vale la pena
journal.document.sewers_guard.title=Cartas del guardia
