journal.document.adventurers_guide.alchemy.body=如果你觉得消耗品没用，可以把它当作炼金材料，或者转化成万能炼金能量。给药水和卷轴充能也能识别它们！饰品是一种独特的装备，需要用炼金术制作和升级。它们需要魔法饰品催化剂和少量炼金能量才能制作。（第一个炼金壶位于地牢的3层或4层。这些炼金壶附近也有炼金配方书页。）
journal.document.adventurers_guide.alchemy.title=炼金术与饰品
journal.document.adventurers_guide.dieing.body=地下城探险危机四伏，大多数冒险者最终都会丧命。运气固然重要，但最优秀的冒险者会运用各种技巧来提高胜算。（如果你经常死亡也不要灰心，这款游戏难度很高！专注于学习游戏机制并稳步提升，而不是急于求成。）
journal.document.adventurers_guide.dieing.title=应对失败
journal.document.adventurers_guide.examining.body=与其盲目冲锋，不如先观察敌人和周围环境！养成仔细检查所有新事物的习惯。（你可以使用放大镜按钮进行检查，然后选择要检查的内容。你也可以通过选择图标来查看增益或减益效果。）
journal.document.adventurers_guide.examining.title=检查
journal.document.adventurers_guide.food.body=有效配给是提高生存几率的最佳方法之一，你不一定非得饿着肚子就吃！当你不饿的时候，你的生命值会缓慢恢复，所以如果你在满血状态下进食，恢复的生命值就会被浪费掉！如果你根据自己的生命值来控制进食节奏，你的食物就能保存更长时间。
journal.document.adventurers_guide.food.title=应对饥饿
journal.document.adventurers_guide.identifying.body=每个地下城中药水和卷轴上的符号颜色都不同。未鉴定的装备如果运气好，可以升级或附魔，但也可能被诅咒！鉴定、升级或移除诅咒的卷轴对于降低使用未鉴定装备的风险非常有用。（你可以在日志的目录标签页中找到所有已鉴定物品的列表）
journal.document.adventurers_guide.identifying.title=识别物品
journal.document.adventurers_guide.intro.body=冒险者，你好！你正在阅读《地下城精通之书》！这本指南最适合作为参考，它会神奇地告诉你何时阅读每一页最为合适。（当日志按钮闪烁时，点击它即可阅读指南的内容！不过有些页面缺失，或许你可以在地下城里找到它们？）
journal.document.adventurers_guide.intro.title=介绍
journal.document.adventurers_guide.levelling.body=升级可以提升你的属性并奖励天赋点数，这在战斗中至关重要。最好确保你的角色在地下城的每一层都至少升一级。虽然快速通关、避免探索或战斗可能很诱人，但这样做会让你错过补给和经验。你可以在游戏界面角落的状态栏查看英雄信息，包括经验值。点击英雄头像可以查看更多信息。
journal.document.adventurers_guide.levelling.title=积累经验
journal.document.adventurers_guide.looting.body=通常情况下，锁着的房间或有障碍物的房间会有更好的战利品。当障碍物挡住去路时，你通常可以在同一层找到一件可以帮助你的物品。每个五层地牢区域你总能找到2瓶力量药水和3张升级卷轴，因此它们是衡量你探索水平的绝佳指标。（你可以在日志窗口的备注标签页中查看地标和未使用的钥匙列表。）
journal.document.adventurers_guide.looting.title=有效掠夺
journal.document.adventurers_guide.magic.body=魔法攻击能轻易穿透盔甲，而且难以躲避。这意味着魔杖的伤害非常可靠，但也使得魔法敌人非常危险！然而，魔法攻击总有其弊端。魔杖的使用次数有限，而且魔法敌人通常无法近距离施放魔法。面对会使用魔法的敌人时，学会如何阻止他们对你使用魔法至关重要。
journal.document.adventurers_guide.magic.title=魔法攻击
journal.document.adventurers_guide.positioning.body=策略与装备同等重要。良好的站位通常可以避免被包围等不利局面。例如，大多数地牢都有狭窄的走廊，迫使敌人逐个与你交战。这些走廊通常也设有入口，方便发动突袭！此外，还有许多巧妙的方法可以利用环境特征，例如草地、水体、陷阱或坑洞。
journal.document.adventurers_guide.positioning.title=定位
journal.document.adventurers_guide.searching.body=地牢里到处都是乍一看难以察觉的秘密之门和陷阱。如果你怀疑附近藏有门或陷阱，可以花些时间仔细搜索。（你可以按两次放大镜按钮来搜索周围的所有方格。也许在你找到这个页面的地方附近就藏着一些隐藏的门！）
journal.document.adventurers_guide.searching.title=搜索
journal.document.adventurers_guide.strength.body=没有时间去练习使用在地牢里找到的武器和盔甲，所以你需要强大的力量才能有效地使用它们。力量药水和升级卷轴是满足高级装备力量需求的最有效方法。最终使用高级装备固然重要，但也不要忽视你现在就能使用的装备。
journal.document.adventurers_guide.strength.title=力量
journal.document.adventurers_guide.surprise_attacks.body=突袭必定命中，因此对付蛇和幽灵等难以躲避的敌人尤其有效。你可以在敌人追击你时，在他们进入门口后，或者在他们失去你的视线时，立即发动突袭。
journal.document.adventurers_guide.surprise_attacks.title=突袭
journal.document.adventurers_guide.title=地下城精通之书
journal.document.adventurers_guide.upgrades.body=越深入地下城，使用魔法升级的高级装备就越重要，但你也需要足够的实力才能正确使用它们。魔杖、戒指和神器不需要实力加成，但它们的用途有限，或者在战斗中提供的帮助不如装备直接。在地下城初期，合理选择升级哪些装备对于生存至关重要，也为后期取得成功奠定了基础。
journal.document.adventurers_guide.upgrades.title=升级
journal.document.alchemy_guide.bombs.body=将普通的黑火药炸弹与特定物质混合，即可制成威力更强的炸弹。
journal.document.alchemy_guide.bombs.title=增强型炸弹
journal.document.alchemy_guide.brews_elixirs.body=药剂和灵药是具有多种效果的高级药水，通常只能使用一次。
journal.document.alchemy_guide.brews_elixirs.title=酿造的酒和药剂
journal.document.alchemy_guide.energy_food.body=许多配方需要水晶炼金能量，这种能量可以通过在炼金锅中分解消耗品来获得。给药水或卷轴充能也能识别这些配方。有些需要能量的配方是魔法配方，但这些配方类似于传统烹饪。
journal.document.alchemy_guide.energy_food.title=能源与食物
journal.document.alchemy_guide.exotic_potions.body=药剂可以与能量混合，制成奇异的药剂。它们效果更强劲，但用途往往有所不同。
journal.document.alchemy_guide.exotic_potions.title=异域药剂
journal.document.alchemy_guide.exotic_scrolls.body=异域卷轴需要消耗一些能量和一张卷轴才能制作。它们比异域药剂效果更强，价格也更贵。
journal.document.alchemy_guide.exotic_scrolls.title=异域风情卷轴
journal.document.alchemy_guide.potions.body=欢迎来到《炼金术的实用应用》！本书是一本炼金术配方参考书，教你如何在炼金锅中制作物品。我们将从最具代表性的配方开始：药水！使用三颗种子即可随机炼制一瓶药水！每颗种子都对应一种药水，使用多颗相同的种子可以提高炼制出与种子相关的药水的概率。
journal.document.alchemy_guide.potions.title=简介和魔药
journal.document.alchemy_guide.spells.body=魔法被封存在水晶中，可以提供多种效果，通常可以多次使用。
journal.document.alchemy_guide.spells.title=咒语
journal.document.alchemy_guide.stones.body=将卷轴放入炼金锅中，卷轴的魔法就会注入锅内的两块石头中。这样就能生成符文石，并识别出卷轴的种类！
journal.document.alchemy_guide.stones.title=制作符文石
journal.document.alchemy_guide.title=炼金术指南
journal.document.alchemy_guide.weapons.body=一些较轻或更具魔法的武器可以用于炼金术！每套投掷武器都能产生足够的液态金属，完全修复另一套同等级同阶的武器。注意，炼金术会摧毁整套武器，即使其中一部分并不完整！一根魔杖能产生足够的奥术树脂，升级两根同等级的魔杖，但最高只能升级到+3。
journal.document.alchemy_guide.weapons.title=强化武器
journal.document.caves_explorer.alive.body=夏至23日，308年。其中一台矮人机器不知怎么的活了过来！我们只是路过，它就冲了过来，用它巨大的金属拳头差点把我们队伍里的两个人捏碎。幸好我随身带着我的分解魔杖。几发精准的分解光束就把这怪物化成了废铁。让我困惑的是，我们根本没有招惹这台机器。矮人不可能把机器设计得如此好斗，它简直就像是在伏击我们！至少我这次还能帮上同伴的忙。——阿奇博尔德
journal.document.caves_explorer.alive.title=它活了！
journal.document.caves_explorer.city.body=夏至21日，308年。现在已经过去三周了，在过去十天里，我们一直在不断深入探索，终于到达了矿井底部。我们发现了各种金属装置和一道巨大的大门，它阻挡了通往古老矮人都市的入口。铁匠警告过我们一些机械装置。它们显然是用于区域防御的，而且一旦受到干扰就会启动。我们在城里没有其他目的，而且这些金属的废料价值微乎其微，所以我们觉得最好听从他的警告，返回城外。我必须承认我很好奇，但下去探险绝对不值得冒险。——阿奇博尔德
journal.document.caves_explorer.city.title=城市入口
journal.document.caves_explorer.discover_hint=你可以在特定区域找到这段文字，但前提是必须先找到该集合中的所有先前文字。
journal.document.caves_explorer.expedition.body=公元308年夏至日，今天我们为期四周的废弃矮人矿井探险正式开始！我受国王亲自委派，前来探索这片区域。我的主要目标是寻找尚未开发的自然资源，并勘测洞穴，以寻找潜在的监狱建设项目。虽然我有能力自卫，但遵照国王的意愿，我接受了城卫队的护送。他们是一群笨蛋，但只要他们不拖慢我的速度，他们的存在就还可以忍受。我们预计在傍晚前清理完下水道并抵达矿井。——阿奇博尔德·德拉蒙德，南方巫师学院大法师。
journal.document.caves_explorer.expedition.title=探险开始！
journal.document.caves_explorer.gold.body=夏至四日，308年。我们这几天收获颇丰！建立好营地后，我们便开始探索废弃矿井的上层区域。虽然矮人留下了不少无用的杂物，但许多洞壁上也堆满了黄金！可惜的是，我们并非第一批来到这里的人。洞穴里到处都是凶猛的野生动物，而且似乎成群的豺狼人也对黄金很感兴趣。我承认我对我的护卫有些苛刻，他们比我预想的要能干得多，既是优秀的探险家，又是出色的保镖。即便如此，我们仍然有很多矿井需要探索。——阿奇博尔德
journal.document.caves_explorer.gold.title=好多黄金！
journal.document.caves_explorer.report.body=308年夏28日，今天我们将收拾好行李，准备离开。恰逢其时，我们小组里有好几个人自从上次遭遇那台凶猛机器后就开始做噩梦。这或许只是疲劳所致，但他们的噩梦却惊人地相似。总而言之，矿井上部区域相当安全。如果能找到黑金的用途，开采它可能会非常有利可图。开阔的矿区也非常适合城市的建设规划。然而，下部矿井则更加危险，应该避免前往。接下来几天，我会把这些都写进我的最终报告中。——阿奇博尔德
journal.document.caves_explorer.report.title=最终报告
journal.document.caves_explorer.title=探险家日志
journal.document.caves_explorer.troll.body=夏至11日，308年。在我们开始探索矿井中部之后，我们遇到了一张友好的面孔！嗯……算是友好吧。一个洞穴巨魔在那里建了个小铁匠铺。他脾气暴躁，不太爱说话，但还是帮我们修好了装备，换取了一些金子。可惜的是，这位巨魔铁匠也告诉我们，这些漂亮的金子并不像看起来那么好。他称之为“黑金”，而且显然会在阳光下迅速褪色。这倒也解释了为什么这里从来没有因为资源而发生冲突。我想我们需要再深入挖掘一下，看看有没有更值钱的东西。——阿奇博尔德
journal.document.caves_explorer.troll.title=遇到一个巨魔
journal.document.city_warlock.discover_hint=你可以在特定区域找到这段文字，但前提是必须先找到该集合中的所有先前文字。
journal.document.city_warlock.failure.body=看来我也是个傻瓜。我原以为新王需要朝廷心甘情愿地臣服于他，但现在看来，他甚至有能力控制那些反抗他的人。我盲目地把所有最强大的反对者都带到了他的面前，让他亲自把他们变成奴隶。现在，他那股死灵能量的浪潮席卷全城，瞬间将大多数人变成了他的信徒。少数仍保有自由意志的人正在逃离。我选择留下来，尽我所能地观察，寻找机会。凭借我拥有的魔法力量，我应该可以安全地躲藏一段时间。
journal.document.city_warlock.failure.title=失败
journal.document.city_warlock.more_powerful.body=时间流逝变得难以把握，但距离我上次记录已经过去大约一周了。我们的文明彻底崩溃了。城门紧闭，社会运转停止，空荡荡的矮人躯壳在走廊里游荡。然而，新王的力量却与日俱增。他的意志力与日俱增，但同时也在发生变化。我无法描述，但感觉他似乎已经不再是矮人了。我开始接受，我所能做的或许只有记录这些事件。我会尽可能地留在这里，直到我的意志开始衰弱，然后撤退。
journal.document.city_warlock.more_powerful.title=更强大
journal.document.city_warlock.new_power.body=这里究竟发生了什么？新王散发出的力量确实与之前不同，但似乎还有其他因素。这股新的力量似乎源自我们城市最深处的殿堂。更令人费解的是，上层都市的活动也减少了。我不知道下面发生了什么，但它几乎吸引了新王所有的注意力。重返深层殿堂固然危险，但我必须查明造成这种变化的原因。或许新王终究也有弱点？
journal.document.city_warlock.new_power.title=新的力量
journal.document.city_warlock.old_king.body=今天是魔法时代33年2月5日。如果一位地上世界居民读到这段文字，那么现在应该是264年冬季。我的名字是泰莫·扎希尔，据我所知，我是矮人宫廷中最后一位幸存者。我们的国王驾崩了，取而代之的是我的一位昔日同僚，他已被权力冲昏了头脑。宫廷中的其他人如同傻瓜一般臣服于他，并在过程中失去了自由意志。只有我预见到了这一切，并在他的仪式完成之前逃走了。核心圈子已经覆灭，但新国王的力量尚未完全渗透到所有人。我必须尽快组织起抵抗。我绝不允许我们光荣的文明落入这个狂妄自大的家伙之手！
journal.document.city_warlock.old_king.title=国王驾崩
journal.document.city_warlock.resistance.body=消息似乎传播得很快。仅仅几天时间，我就已经集结了一支效忠老国王的小部队。他们当中精通魔法的人不多，但几乎整个武僧团都已加入我们。我们应该足以对付一个疯狂的矮人和他那群奴隶。与此同时，新国王藏身于我们城市的内殿之中。毫无疑问，他已经耗尽了大部分力量，希望在遇到更多抵抗之前恢复元气。我们将在几个小时后发起进攻。如果运气好的话，我们能够在今晚结束前组建一个临时议会，并使我们这座奇妙的城市恢复稳定。
journal.document.city_warlock.resistance.title=抵抗
journal.document.city_warlock.seen_it.body=我已目睹下方的一切，却无法言表。我双手颤抖不已，努力将思绪诉诸笔端。这究竟是何缘故？是新王所为吗？这毫无道理。或许是他肆意滥用权力招致了这一切？我曾希望拯救我们的文明，如今却发现整个世界都岌岌可危。不知为何，国王似乎是两害相权取其轻。我别无选择，为了大局，我愿献出生命。请指引我，我的王，请将我化作工具，阻止尤格-泽瓦的入侵！
journal.document.city_warlock.seen_it.title=我看过了
journal.document.city_warlock.title=术士日志
journal.document.halls_king.amulet.body=我成功了！我不知道会发现什么，但我在那里发现的东西远远超出了我的想象。如此强大的力量，就摆在那里等着我去获取，而且这一切都属于我！有了它，朝廷里的那些蠢货就不敢再跟我作对了。想到各种羞辱他们的方法，我就兴奋不已。见鬼，何必止步于此，如果我愿意，我有足够的力量把他们全部毁灭！这或许有点过头了，但我不能犹豫太久，否则他们会起疑心的。我想我应该把这股强大的力量称为延多护符！
journal.document.halls_king.amulet.title=护身符
journal.document.halls_king.attrition.body=我自有应对之策。它的力量无穷无尽，但它侵占这个世界的能力却并非如此。它依靠爪牙和化身为其效力，同时积蓄力量，企图夺取护身符。虽然我并未实际拥有护身符，但我依然完全掌控着它的力量。整个矮人城都任我调遣，我在人数上也占据优势。我只需不断派遣士兵阻止它夺取护身符，便能通过消耗战逐步赢得这场战争！我，罗德尼，矮人之王，必将战胜你，尤格-泽瓦！
journal.document.halls_king.attrition.title=损耗
journal.document.halls_king.discover_hint=你可以在特定区域找到这段文字，但前提是必须先找到该集合中的所有先前文字。
journal.document.halls_king.new_king.body=我是国王，哈哈哈哈哈哈！他们竟然让我这么做了！几乎没费什么力气，他们就同意让我通过一场盛大的仪式与他们“分享”这份力量。瞬间，他们就从一群嘲笑者变成了我沉默的臣民！不出所料，泰莫一遇到麻烦就像个懦夫一样逃跑了。我已经能感觉到他正在组建的反抗力量。我想我会让他继续下去，这样他就能把所有同谋都送到我家门口！显然，王国也不尊重我，我想我也会解决这个问题。矮人王
journal.document.halls_king.new_king.title=新王
journal.document.halls_king.rejection.body=蠢货！过去33年里，我们的王国凭借新的魔法科技蓬勃发展。我们学会了如何召唤元素精灵并驾驭它们，但不知为何，现在进一步的实验却“太危险”了。我知道真相。我的理论被否定与理论本身无关，而完全是因为提出这些理论的人。他们可能都在背后嘲笑我。够了！我不在乎他们说什么，我要独自探索宇宙的尽头，并将我的发现全部据为己有！——R.
journal.document.halls_king.rejection.title=拒绝
journal.document.halls_king.ritual.body=今天早些时候，泰莫尔当众质问我，非要我解释我新获得的力量来源。我尽力敷衍了他，但我能感觉到宫廷里其他人的目光再次投向了我。我原本希望暴风雨前的宁静能让我多享受一会儿，但现在看来已经无关紧要了。我已经决定了要做什么。我会声称我的力量来自一种新的仪式，并提出要为其他术士和国王施展这个仪式。仪式结束后，我将成为国王！泰莫尔当然会抗议，但面对如此强大的力量，我怀疑他们不会听他的！所有人都将臣服于我！——未来的矮人之王
journal.document.halls_king.ritual.title=仪式
journal.document.halls_king.thing.body=出问题了。提莫尔被轻而易举地解决了，但我在外层位面的搜寻似乎并没有逃过它的眼睛。某种……“东西”……被吸引到我的世界，正从下层大厅的底部强行闯入。更糟糕的是，那里正是我存放护身符的地方！真是个恶毒的家伙，明明还有很多力量等着我去夺取，它为什么非要剥夺我的力量呢？尽管我拥有强大的力量，但我不能贸然冲上去和它战斗。它真正的力量深不可测，但我一定有办法限制它。我一定要捍卫我的宝物！
journal.document.halls_king.thing.title=怪形
journal.document.halls_king.title=???的日记
journal.document.intros.caves.body=这些人口稀少的洞穴延伸至废弃监狱下方。它们矿产资源丰富，曾是下方矮人社会繁荣的贸易和工业中心，但随着矮人沉迷于黑暗魔法，这些洞穴最终被废弃。如今，洞穴里大多栖息着地下野生动物、豺狼人和废弃的机械；很可能受到了与影响地上区域的同一股力量的侵蚀。
journal.document.intros.caves.title=洞穴
journal.document.intros.city.body=矮人大都会曾是所有矮人城邦中最伟大的。在其鼎盛时期，矮人们建造了精妙绝伦的金属与魔法机器，使他们的城市得以迅速扩张。然而，有一天，城门突然关闭，矮人们从此销声匿迹。少数在城门关闭时逃出的人讲述了一个疯狂术士篡夺王位的故事，以及他所掌握的可怕魔法。
journal.document.intros.city.title=矮人大都会
journal.document.intros.discover_hint=首次进入特定区域时，您可以看到这段文字。
journal.document.intros.dungeon.body=在你之前，许多英雄都曾从地上城市冒险进入过地下城，但大多数人从此杳无音信。据说，一股古老的邪恶力量潜伏在地下城深处，守护着威力无比的延多护符。即使现在，黑暗能量依然从地下城深处涌出，向上蔓延至城市之中。你是否能够征服地下城，夺取护符？是时候开启你的冒险之旅了！
journal.document.intros.dungeon.title=地牢
journal.document.intros.halls.body=矮人都城深处的这些大厅已被黑暗魔法扭曲。过去，这里曾是矮人王麾下精英术士的宫廷所在地，但如今，它们似乎已被某种更加邪恶的力量所占据……各种恐怖的恶魔生物栖息于此，受制于某种可怕的黑暗力量。如果矮人王并非这股蔓延的腐化之源，那么，这地下的某种东西必定是罪魁祸首。务必小心行事，鲜有冒险者曾深入此地……
journal.document.intros.halls.discover_hint=你可以在特定区域找到这段文字，但前提是必须先找到该集合中的所有先前文字。
journal.document.intros.halls.title=恶魔大厅
journal.document.intros.prison.body=多年前，这里建起了一座监狱，用来关押危险的罪犯。监狱管理严密，戒备森严，来自全国各地的罪犯都被押送到这里服刑。但不久之后，一股黑暗的瘴气从监狱下方蔓延开来，扭曲着狱警和囚犯的心智。为了应对日益严重的混乱，城里封锁了整座监狱。没有人知道那些被遗弃在这座高墙之内的人最终的下落……
journal.document.intros.prison.title=监狱
journal.document.intros.sewers.body=地牢的上层实际上是城市的下水道系统。随着黑暗能量从下方涌上来，原本无害的下水道生物变得越来越凶猛。城市不得不派遣守卫巡逻队到这里，以维护上方居民的安全。这里很危险，但至少这里邪恶的魔法力量较弱。
journal.document.intros.sewers.title=下水道
journal.document.intros.title=区域介绍
journal.document.prison_warden.discover_hint=你可以在特定区域找到这段文字，但前提是必须先找到该集合中的所有先前文字。
journal.document.prison_warden.journal.body=公元362年春季1日，这是监狱长基亚娜·史密斯工作日志的第一篇。最近发生了很多事，所以我决定开始写日记，整理一下我的思绪。管理一座位于地下半英里的监狱从来都不是一件容易的事，但最近似乎发生了一些有组织的骚乱。囚犯们无缘无故地闹事，而且拒绝解释原因。一些狱警开始说这里闹鬼。我不能让我的手下散布谣言，但我也不能完全责怪他们的不安。——史密斯
journal.document.prison_warden.journal.title=写日记
journal.document.prison_warden.letter.body=托马斯，你一直是个好朋友，所以我帮你个忙。今晚你值班的时候，把天狗的牢房锁好加固，把钥匙扔进某个壁龛里，然后出去。其他囚犯是否无人看管都无所谓，很快这里就没人能离开了。不过那个怪胎必须被关好，要是他跑了，谁也说不准他会干出什么事来。别把这件事告诉任何人，也别来找我。船长必须与船同沉。——琪亚娜
journal.document.prison_warden.letter.title=致托马斯的信
journal.document.prison_warden.mines.body=363年冬至54日，今天城里来了一群工程师，说是来封堵通往下方矿井的旧入口。我猜城里是不想再维护这条通道了。像往常一样，我事先毫不知情。他们的首席工程师还跟我胡扯了些什么矮人魔法从矿井里泄露出来之类的鬼话。我一个字都不信。新来的工作人员让情况好多了，但问题的根源依然没有解决。肯定有什么事影响到了这里的囚犯，拆掉几堵墙是解决不了问题的。——史密斯
journal.document.prison_warden.mines.title=封堵地雷
journal.document.prison_warden.no_support.body=364年春季11日，\n\n，这城市到底在想什么？我紧急请求援助后，杳无音信，连个像往常被拒绝后那样空洞的道歉都没有。\n\n，与此同时，囚犯的情况持续恶化，甚至有些狱警也开始惹是生非。他们难道打算就这么放任事态发展，直到爆发暴乱吗？！\n\n，至少托马斯一如既往地可靠。他的组织工作至关重要，他提出的启用那些老旧的DM-100装置的想法虽然令人遗憾，但却是必要的。我相信我能重新掌控局面，我只是需要一些该死的支持！\n——史密斯
journal.document.prison_warden.no_support.title=不支持
journal.document.prison_warden.recruits.body=362\n\n春季80日，正如承诺的那样，今天来了一批新兵。看起来和往常一样，有几个有前途的，还有很多只想拿工资的喽啰。不过，有了这些新兵，应该能对我们最近那些不守规矩的囚犯大有帮助。\n\n在这样的工作中，知道谁值得信任至关重要。新来的托马斯看起来特别有前途。我现在需要尽可能多的帮助，所以如果他表现出色，我会尽快提拔他。\n——史密斯
journal.document.prison_warden.recruits.title=新兵
journal.document.prison_warden.rotberry.body=363年秋季23日，今天收到菲利克斯送的一份很棒的礼物。那是一种鲜红色的灌木，叫做“腐莓”。我之前跟他说过这个地方有多么阴森，看来他听到了。他说这种植物其实不喜欢光照和水，所以我只需要每月修剪一次叶子就行了。不过修剪肯定很重要，他在信里提了十几次。当然，菲利克斯从来不会白白帮忙。他说这种植物结的种子很适合做魔杖，所以每次它结出种子的时候，我自然要给他一些。——史密斯
journal.document.prison_warden.rotberry.title=腐烂浆果
journal.document.prison_warden.title=典狱长日志
journal.document.sewers_guard.crabs.body=376年冬至11日，亲爱的爸爸妈妈：老鼠已经够烦人了，更深处居然还有巨蟹！其中一只从我身边冲过去，把李咬得够呛，幸好我们把它干掉了。托马斯说这不是我的错，但我知道他只是想安慰我。谢天谢地，我们出去的时候遇到了一位冒险者，他有一些多余的太阳草药膏。没有那东西，李可能就活不下去了。我看到那位冒险者离开前盯着一朵玫瑰看，他们说那是别人送的。如果有人这么关心他们，他们为什么还要冒着生命危险来到这里呢？这不正是我现在做的吗？我觉得自己力不从心。
journal.document.sewers_guard.crabs.title=巨型螃蟹！
journal.document.sewers_guard.dangerous.body=375年秋季第88天，亲爱的爸爸妈妈：我现在终于明白为什么工资这么高了，下水道里到处都是怪物！那些“害虫”和“不法之徒”都是嗜血的巨型老鼠和成群的愤怒豺狼人。幸好我的队友们都很专业。我们的队长托马斯是这方面的专家。我正在努力学习，以免成为大家的负担。这份工作比我想象的危险得多。我很高兴现在不能把这些寄出去，不想让你们担心。我会注意安全的。——索尼娅
journal.document.sewers_guard.dangerous.title=危险的处境……
journal.document.sewers_guard.discover_hint=你可以在特定区域找到这段文字，但前提是必须先找到该集合中的所有先前文字。
journal.document.sewers_guard.guild.body=376年冬至23日，亲爱的爸爸妈妈：这次没有遇到新的怪物，我们巡逻时却碰上了盗贼公会的一小队人。我听说这个公会的一切都很糟糕，但我的队友们似乎和他们很友好。托马斯和其中一个盗贼交换了情报和补给，然后我们就分道扬镳了。我不明白，我们不是应该去消灭这些不法之徒吗？托马斯甚至叮嘱过不要把这件事告诉任何指挥官。不过，他们的情报和补给非常有用，我们实在不想再打仗了。看来我们只能一起面对这一切了。
journal.document.sewers_guard.guild.title=盗贼公会
journal.document.sewers_guard.lost.body=376年冬至40日，我和托马斯迷路了。我们和豺狼人战斗时与队伍其他成员走散了。我们俩都没受伤，但下水道就像个迷宫。托马斯说他知道一条出路，但要从下水道底部的旧监狱入口开始。我真不想再往下走了，但我们没有口粮，而且下去比到处找巡逻路线快得多。没事的，托马斯知道该怎么做。
journal.document.sewers_guard.lost.title=我们迷路了
journal.document.sewers_guard.new_position.body=375年秋季第85天，亲爱的爸爸妈妈：我早就告诉过你们，在城卫队辛苦工作会有回报的。我升职啦！我被邀请加入一个专门清理下水道的专家小组。据说那里鼠患成灾，还有不法之徒出没，我们的任务就是把它们清除掉。工作很脏，但是下水道冬天很暖和，而且工资是普通卫兵的三倍！不过，这件事有点保密，所以我不能真的把这封信寄出去。不给你们写信感觉很奇怪，所以我还是会继续给你们写信的。也许有一天我可以把它们给你看。\n\n祝好，\n- Sonya
journal.document.sewers_guard.new_position.title=我的新职位！
journal.document.sewers_guard.not_worth.body=我和托马斯在监狱入口遇到了一种巨大的黏液怪物。还没等我们反应过来，它就用魔法攻击了我们。托马斯承受了大部分伤害。他已经死了。再多的钱也弥补不了这一切。我要走托马斯告诉我的那条路离开。然后我会用我当守卫挣的钱带着我的父母离开这座被诅咒的城市。我的一部分希望国王对这一切有所安排，但我对此表示怀疑。我留下这些信是为了警告其他人。这里不仅仅只有巨鼠和螃蟹，肯定有什么非常不妙的事情发生。
journal.document.sewers_guard.not_worth.title=不值得
journal.document.sewers_guard.title=守卫的信件
