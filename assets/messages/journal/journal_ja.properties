journal.document.adventurers_guide.alchemy.body=消費アイテムが役に立たなければ、錬金術の材料として使ったり、万能の錬金術エネルギーに変えることができる。また、ポーションや巻物をエネルギー化することもできる！\n\nトリンケットは、錬金術を使って作成し、アップグレードするユニークな装備品です。魔法の装身具触媒と、少量の錬金術エネルギーで作られる。\n\n(最初の錬金術の壺はダンジョンの3階か4階にあります。これらのポットの近くにも錬金術のレシピ本のページがある)
journal.document.adventurers_guide.alchemy.title=錬金術と装身具
journal.document.adventurers_guide.dieing.body=ダンジョニアリングは危険であり、ほとんどの冒険者は最終的に命を落とす。\n\n運も味方してくれるが、一流の冒険者はあらゆる小細工を駆使してチャンスを広げる。\n\n(このゲームは難しい！すぐに勝つことよりも、ゲームを学び、着実に上達することに集中しよう)。
journal.document.adventurers_guide.dieing.title=敗戦処理
journal.document.adventurers_guide.examining.body=やみくもに突進するのではなく、敵や周囲の状況をよく調べることが重要だ！新しいものは何でも調べる癖をつけよう。\n\n(虫眼鏡ボタンを使い、調べたいものを選択することで調べることができる。また、バフやデバフのアイコンを選択することでも調べることができる)
journal.document.adventurers_guide.examining.title=検査
journal.document.adventurers_guide.food.body=効果的な配給は、生き残る確率を高める最善の方法のひとつである！\n\n腹が減っていないときはゆっくりと体力が回復していくので、体力が満タンのときに食べてしまうと、その回復分が無駄になってしまう！\n\n体力に応じて食べるタイミングを決めれば、食事が長持ちする。
journal.document.adventurers_guide.food.title=飢餓への対応
journal.document.adventurers_guide.identifying.body=ポーションの色や巻物のシンボルはダンジョンごとに異なる。正体不明の装備品は、運が良ければアップグレードやエンチャントが可能だが、呪われている場合もある！\n\n未確認の装備品を使うリスクを減らしたいなら、識別、アップグレード、呪い解除のスクロールはとても役に立つ。\n\n(あなたが識別したすべてのアイテムのリストは、日誌の目録タブで見ることができる。）
journal.document.adventurers_guide.identifying.title=アイテムの識別
journal.document.adventurers_guide.intro.body=冒険者の諸君、諸君が読んでいるのは『ダンジョン・マスタリーの書』である！このガイドブックは参考書として使用するのが最適で、各ページを読むのに最適なタイミングを魔法で知らせてくれる。\n\n(ジャーナルボタンが点滅したら、それを選択するとガイドブックが教えてくれることを読むことができます！ダンジョンに行けば見つかるかも？)
journal.document.adventurers_guide.intro.title=はじめに
journal.document.adventurers_guide.levelling.body=レベルを上げるとステータスが上がり、タレントポイントが付与される。ダンジョンの各フロアで最低1レベルは上げておくといいだろう。\n\n焦って探索や戦闘を避けたくなることもあるだろうが、そうすると物資や経験値を奪われてしまう。\n\n(経験値を含むヒーローの情報はゲームインターフェイスの隅にあるステータスペインで見ることができます。ヒーローのポートレートを選択すると、さらに詳しい情報が表示される)
journal.document.adventurers_guide.levelling.title=経験を積む
journal.document.adventurers_guide.looting.body=鍵のかかったドアの向こう側や障害物のある部屋は、たいてい良い戦利品がある。障害物に行く手を阻まれても、同じフロアに行けばたいてい役立つアイテムがある。\n\n各5フロアのダンジョンでは、力のポーション2個とアップグレードの巻物3個が必ず手に入るので、探索の腕前の指標になる。\n\n(ランドマークと未使用の鍵のリストはジャーナルウィンドウのノートタブで見ることができる)
journal.document.adventurers_guide.looting.title=効果的な略奪
journal.document.adventurers_guide.magic.body=魔法の攻撃は鎧を切り裂き、かわすのが難しい。つまり、杖からのダメージは非常に確実だが、魔法の敵は非常に危険なのだ！\n\nしかし、魔法攻撃には常に欠点がある。杖のチャージには限りがあり、魔法の敵は通常、至近距離で魔法を使うことができない。\n\n魔法を使う敵を相手にするときは、魔法を使われないようにする方法を学ぶことが重要だ。
journal.document.adventurers_guide.magic.title=魔法攻撃
journal.document.adventurers_guide.positioning.body=戦略は装備と同じくらい重要だ。囲まれるような不利な状況は、ポジショニングが良ければ避けられることが多い。\n\n例えば、ほとんどのダンジョンには細い通路があり、敵は一人ずつ戦ってくる。このような通路には、奇襲用の出入り口があることも多い！\n\n草、水、落とし穴、トラップなど、環境の特徴を利用するちょっとした方法もたくさんある。
journal.document.adventurers_guide.positioning.title=ポジショニング
journal.document.adventurers_guide.searching.body=ダンジョンには、一見すると見えない秘密の扉や罠がたくさんある。近くに扉や罠が隠されていると思われる場合は、時間をかけて注意深く探してみるといいだろう。\n\n(虫眼鏡ボタンを2回使うと、周りのタイルをすべて探すことができます。もしかしたら、このページを見つけた近くに隠し扉があるかもしれませんよ！)
journal.document.adventurers_guide.searching.title=検索
journal.document.adventurers_guide.strength.body=ダンジョンで見つけた武器や防具をトレーニングする時間はないので、それらを効果的に使うには腕力が必要だ。\n\n高Tierの装備に要求される強さを満たすには、強さのポーションやアップグレードのスクロールが最も効果的だ。\n\n最終的には高Tierのアイテムを使い始めることが重要だが、今すぐ使える装備を無視してはいけない。
journal.document.adventurers_guide.strength.title=強さ
journal.document.adventurers_guide.surprise_attacks.body=奇襲攻撃は確実に命中するので、ヘビやレイスのような回避能力の高い敵には特に有効だ。\n\n敵があなたを追いかけている間に入り口に入った直後や、そうでなければ敵があなたを見失ったときに奇襲をかけることができる。
journal.document.adventurers_guide.surprise_attacks.title=奇襲攻撃
journal.document.adventurers_guide.title=ダンジョン・マスタリー
journal.document.adventurers_guide.upgrades.body=ダンジョンの奥に進めば進むほど、魔法でアップグレードされた高階層のギアを使うことが重要になるが、それらを適切に使うための体力も必要になる。\n\nワンド、リング、アーティファクトは力を必要としないが、使い道が限られていたり、戦闘に直接役立たない。\n\nダンジョン序盤で生き残るためにも、ダンジョン後半で成功するためにも、アップグレードするものを適切に選択することはとても重要だ。
journal.document.adventurers_guide.upgrades.title=アップグレード
journal.document.alchemy_guide.bombs.body=通常の黒色火薬爆弾に特定のアイテムを混ぜて、強化爆弾を作ることができる。
journal.document.alchemy_guide.bombs.title=強化爆弾
journal.document.alchemy_guide.brews_elixirs.body=ブリューとエリクサーは様々な効果を持つ上級ポーションで、通常1回しか使えない。
journal.document.alchemy_guide.brews_elixirs.title=醸造酒と万能薬
journal.document.alchemy_guide.energy_food.body=多くのレシピは、錬金術のポットで消費可能なアイテムを分解して作る、クリスタルの錬金術エネルギーを必要とする。また、ポーションやスクロールにエネルギーを与えることでも確認できる。\n\nエネルギーを必要とするレシピの中には魔法的なものもあるが、それらは伝統的な料理に似ている。
journal.document.alchemy_guide.energy_food.title=エネルギーと食糧
journal.document.alchemy_guide.exotic_potions.body=ポーションはエネルギーと混ぜてエキゾチックなポーションを作ることができる。これらのポーションはより強力な効果を持つが、多くの場合異なる方法で役に立つ。
journal.document.alchemy_guide.exotic_potions.title=エキゾチックポーション
journal.document.alchemy_guide.exotic_scrolls.body=エキゾチック・スクロールは、エネルギーとスクロールがあれば作ることができる。エキゾチックポーションよりも少し強く、高価だ。
journal.document.alchemy_guide.exotic_scrolls.title=エキゾチックスクロール
journal.document.alchemy_guide.potions.body=錬金術の実践的応用へようこそ！本書は、錬金術でアイテムを作るためのレシピ集です。\n\nまずは最も代表的なレシピから：ポーションです！\n\n3つの種を使ってランダムなポーションを作る！同じ種を複数使うと、使用した種に関連したポーションができる確率が高くなります。
journal.document.alchemy_guide.potions.title=イントロとポーション
journal.document.alchemy_guide.spells.body=呪文はクリスタルの中に含まれており、さまざまな効果をもたらす。
journal.document.alchemy_guide.spells.title=呪文
journal.document.alchemy_guide.stones.body=巻物を錬金術の壺に入れると、壺の中の2つの石に巻物の魔力が宿ります。これによりルーンストーンが作られ、巻物が識別されます！
journal.document.alchemy_guide.stones.title=ルーンストーンの作成
journal.document.alchemy_guide.title=錬金術ガイド
journal.document.alchemy_guide.weapons.body=軽い武器や魔法のような武器の中には、錬金術に使えるものもある！\n\n投げられた武器一式はそれぞれ、同じレベルとティアの別の一式を完全に修理するのに十分な液体金属を作り出す。錬金術を行うと、たとえそのセットが全て揃っていなくても、そのセット全体が破壊されることに注意しよう！\n\n杖1本からは、同じレベルの杖2本をアップグレードするのに十分な量のアーケイン樹脂が生成される。
journal.document.alchemy_guide.weapons.title=武器の強化
journal.document.caves_explorer.alive.body=夏の23日、308\n\nドワーフの機械のひとつがどうにか動き出した！私たちが通り過ぎようとしたとき、そいつは突進してきて、私たちのグループの2人をその巨大な金属の拳で押しつぶしそうになった。幸運なことに、私は崩壊の杖を持っていた。その杖から狙いすました一撃を数発放つと、獣のようなそいつは鉄くずと化した。\n\n困ったことに、私たちはあの機械を刺激するようなことは何もしていない。ドワーフがこれほど攻撃的に機械を設計するはずもなく、まるで我々を待ち伏せしようとしているかのようだった！\n\n少なくとも、今回だけは仲間を助けることができた。\n- アーチボルド
journal.document.caves_explorer.alive.title=それは生きている！
journal.document.caves_explorer.city.body=夏の21日、308\n\n我々は今、3週間という節目を迎えている。この10日間の大半を海図をより深く掘り進むことに費やしてきたが、ついに鉱山の底に到達した。様々な金属の仕掛けと、古いドワーフの大都市への進入を阻む大きな門を発見した。\n\n鍛冶屋はこの機械について警告してくれた。どうやら地域の防衛のためのものらしく、邪魔になると作動する性質があるという。私たちはこの街に用事はないし、金属はスクラップにしてもほとんど価値がない。\n\n好奇心があったのは認めざるを得ないが、あそこを調査することはリスクに見合わなかったのは確かだ。\n- アーチボルド
journal.document.caves_explorer.city.title=シティ・エントランス
journal.document.caves_explorer.discover_hint=このテキストは特定の地域で見つけることができるが、このセット内の先行するテキストをすべて見つけてからでなければならない。
journal.document.caves_explorer.expedition.body=308年夏1日\n\n今日から4週間、ドワーフの廃坑探検が始まる！私は国王からこの地域の探検を命じられた。私の主な目的は、未開発の天然資源を見つけることと、刑務所建設の可能性を探るために洞窟を調査することだ。\n\n自分の身は自分で守れるが、国王の強い要請により、都市警備隊の護衛を引き受けた。彼らは単純バカの集まりだが、私の足手まといにならない限り、彼らの存在は許容範囲だ。\n\n夕方までには下水道を抜け、鉱山に到着する予定だ。\n- アーチボルト・ドラモンド南の魔法学院の大魔導士。
journal.document.caves_explorer.expedition.title=遠征スタート！
journal.document.caves_explorer.gold.body=夏の4日, 308\n\n最初の数日間は実り多いものだった！ベースキャンプを設営した後、廃坑の上層部の探索に出発した。ドワーフが残した無駄なものがたくさんある一方で、洞窟の壁の多くには金があふれている！\n\n残念なことに、ここにいるのは私たちだけではない。洞窟には攻撃的な野生動物がたくさんいて、ニョロニョロの群れも金塊を狙っているようだ。私が思っていた以上に、彼らは有能な探検家であり、ボディーガードだった。\n\nこの成功をもってしても、まだ探検すべき鉱山はたくさん残っている。\n- アーチボルド
journal.document.caves_explorer.gold.title=ソー・マッチ・ゴールド
journal.document.caves_explorer.report.body=夏の28日、308\n\n今日、私たちは荷物の整理を終え、出発の準備をする。ちょうどその頃、私たちのグループの何人かが、攻撃的なマシンの事件の後、ひどい悪夢にうなされ始めていた。おそらく疲労のせいだろうが、彼らの悪夢はどれも心配になるほど似ている。\n\nまとめると、鉱山の上部エリアはかなり安全だ。ダークゴールドの用途が見つかれば、採掘はかなり儲かるかもしれない。広い空き地は都市の建設計画にも大いに役立つだろう。しかし、下の方の鉱山は危険なので避けるべきである。\n\nこれらのことは、数日中に最終報告書にまとめるつもりだ。\n- アーチボルド
journal.document.caves_explorer.report.title=最終報告
journal.document.caves_explorer.title=エクスプローラー日誌
journal.document.caves_explorer.troll.body=夏の11日、308\n\n鉱山の中腹を探検しはじめると、友好的な顔に出くわした！まあ...比較的友好的だ。洞窟トロールがそこに小さな鍛冶屋を構えていた。彼は無愛想で無口だが、金と引き換えに私たちの装備を修理してくれた。\n\n残念なことに、このトロールの鍛冶屋は、この素敵な金貨は見かけほど良いものではないと教えてくれた。彼はこれを「ダーク・ゴールド」と呼び、日光に当たると急速に劣化するらしい。それなら、ここの資源をめぐって争いが起きないのも納得がいく。\n\nもっと価値のあるものがあるかどうか、もう少し掘り下げてみる必要がありそうだ。\n- アーチボルド
journal.document.caves_explorer.troll.title=トロールとの出会い
journal.document.city_warlock.discover_hint=このテキストは特定の地域で見つけることができるが、このセット内の先行するテキストをすべて見つけてからでなければならない。
journal.document.city_warlock.failure.body=どうやら私も愚か者のようだ。私は、新王は宮廷が進んで服従する必要があると思い込んでいたが、今になって、新王には抵抗する者をも支配する力があることがわかった。\n\n私は盲目的に、強い反対勢力をすべて彼の門前に連れてきて、彼自身が彼らを奴隷にできるようにした。今、彼の壊死エネルギーの波が街中を駆け巡り、ほとんどの者を即座に彼の隷属者に変えている。\n\nまだ自由意志を持っている少数の者は逃げ惑う。私はできるだけ残って観察し、隙をうかがうことにした。私の魔力があれば、しばらくは隠れて安全に過ごせるだろう。
journal.document.city_warlock.failure.title=失敗
journal.document.city_warlock.more_powerful.body=時間を把握するのは難しくなったが、前回のエントリーから約1週間が経った。我々の文明は本当に崩壊した。門は閉ざされ、社会のあらゆる機能は停止し、空っぽのドワーフの抜け殻がホールを歩き回っている。\n\nそんな中、どういうわけか新王はさらに強大になっている。日々、彼の意志の力は強くなっているが、同時に変化もしている。言葉では言い表せないが、彼はもはやドワーフではないような気がする。\n\n私にできることは、このような出来事を記録することくらいだろうと思い始めている。私はできる限りここに留まり、意志が弱まり始めたら撤退するつもりだ。
journal.document.city_warlock.more_powerful.title=より強力に
journal.document.city_warlock.new_power.body=ここで何が起こっているのか？新王から発せられるパワーは確かに当初とは異なっているが、それ以外にも何かがある。この新しいパワーは、私たちの街の最奥のホールから放射されているようだ。\n\nさらに不可解なのは、大都市上部の活動も減少していることだ。下界で何が起きているのかはわからないが、ニュー・キングのほとんどすべての関心を集めている。\n\n深いホールに戻るのは危険だが、この変化の原因を突き止めなければならない。新王にはやはり弱点があるのだろうか？
journal.document.city_warlock.new_power.title=新しい力
journal.document.city_warlock.old_king.body=魔法時代33年2月5日。オーバーワールドの者がこれを読んでいるとすれば、それは264年冬のことである。私の名はティモール・ザヒール。私の知る限り、私はドワーフ宮廷の最後の生き残りだ。\n\n我々の王は死に、権力に狂った私の元同僚が後を継いだ。他の宮廷人は愚か者のように彼に服従し、その過程で自由意志を失った。私だけがこの事態を察知し、彼の儀式が完了する前に逃げ出した。\n\n側近たちは倒れたが、新王の力はまだ全員に届いていない。私はできるだけ早く抵抗しなければならない。この誇大妄想狂に我々の輝かしい文明を堕落させるわけにはいかない！
journal.document.city_warlock.old_king.title=キング・イズ・デッド
journal.document.city_warlock.resistance.body=噂はすぐに広まったようだ。まだ数日しか経っていないが、私はすでに老王に忠誠を誓う小さな軍勢を集めている。魔法に長けた者は少ないが戦士の僧侶はほとんど揃っている一人の気違いドワーフと奴隷の宮廷には かなわないだろう\n\n一方 新王は都の奥の院に隠れている力を使い果たしたのは間違いなく、抵抗が激しくなる前に回復したいのだろう。\n\n我々はあと数時間で攻撃を開始する。運がよければ、暫定評議会を発足させ、夜が明けるまでにこの不思議な都市を安定した状態に戻すことができるだろう。
journal.document.city_warlock.resistance.title=抵抗勢力
journal.document.city_warlock.seen_it.body=私は眼下にあるものを見たが、それを表現することはできない。自分の考えを文章にしようとすると、手が震える。\n\nなぜこんなことが起きているのか？新王がこんなことをしたのか？意味がわからない。おそらく、彼の乱暴な権力の行使がそれを引き寄せたのだろうか？私は我々の文明を救いたいと願っていたが、今や全世界が危機に瀕している。\n\nどういうわけか、王はより小さな悪なのだ。他に選択肢はありません。大義のために、私は自らを明け渡します。どうか私をお導きください......王よ......私をヨグ＝デゼバを抑える道具としてお使いください
journal.document.city_warlock.seen_it.title=私は見た
journal.document.city_warlock.title=ウォーロックの日記
journal.document.halls_king.amulet.body=私はやり遂げた！\n\n何が見つかるかわからなかったが、そこで発見したものは、私の想像を超えるものだった。これほどのパワーが、ただそこに座っていて、奪う準備ができていて、そしてそれはすべて私のものなのだ！\n\nこれさえあれば、宮廷のバカどもは誰も私に逆らえないだろう。彼らにどんな屈辱を与えるか、いろいろな方法を考えていると、めまいがしてくる。私が望めば、彼ら一人残らず破滅させるだけの力がある！それはやりすぎかもしれないが、決めるのに時間がかかりすぎてはいけない。\n\nこの偉大な力を "イェンドールのアミュレット "と呼ぶことにしよう！\n- R.
journal.document.halls_king.amulet.title=アミュレット
journal.document.halls_king.attrition.body=あれに対処する計画がある。その力は無限だが、この世界を侵食する力は無限ではない。手下やアバターに頼りつつ、アミュレットを奪えるだけの力をつけようとしている。\n\n私はアミュレットを物理的に所有していないが、それでもその力を完全にコントロールしている。ドワーフの街全体を自由に使える私は、数の上でも有利だ。ドワーフがアミュレットを奪うのを阻止するために兵士を送り続けるだけで、この戦争に消耗戦で着実に勝利することができる！\n\n私、ドワーフの王ロドニーは、ヨグ＝デゼワに打ち勝つだろう！
journal.document.halls_king.attrition.title=減耗
journal.document.halls_king.discover_hint=このテキストは特定の地域で見つけることができるが、このセット内の先行するテキストをすべて見つけてからでなければならない。
journal.document.halls_king.new_king.body=私は王だ、アハハハハ！\n\n彼らは私にそうさせた！ほとんど説得することもなく、彼らは偉大な儀式の中で私がこの力を彼らと「共有」することに同意した。一瞬にして、彼らは嘲笑の声の合唱から、無言の臣民からなる私の新しい宮廷へと変貌した！\n\n予想通り、ティモールはトラブルの最初の兆候で臆病者のように逃げ出した。私はすでに、彼が抵抗力を高めているのを感じている。このまま彼を続行させ、陰謀を企てた者たち全員を私のドアまで送り届けることにしよう！\n\n王国が私を尊敬していないのは明らかだ。\n- ドワーフの王
journal.document.halls_king.new_king.title=新しい王
journal.document.halls_king.rejection.body=インベシレス\n\nこの33年間、我々の王国は新しい魔法技術で繁栄してきた。私たちは元素の精霊を召喚し、意のままに操る方法を学んだが、どういうわけか今、さらなる実験は「危険すぎる」とされている。\n\n私は本当のことを知っている。私の理論が否定されるのは、その理論が優れているかどうかではなく、それを提案した人間に問題があるのだ。彼らは皆、陰で私を笑っているのだろう。\n\nまあ、もういい！彼らが何と言おうと、私は一人で宇宙の最果てを探検し、発見したことはすべて自分のものにする！\n- R.
journal.document.halls_king.rejection.title=却下
journal.document.halls_king.ritual.body=ティモールは今日未明、私に公然と立ち向かい、私の新しい力の源について説明するよう要求した。私はできる限り彼を退けたが、他の法廷の目が再び私に注がれているのを感じる。\n\n嵐の前の静けさをもう少し楽しみたかったが、そんなことはどうでもいい。私は自分のやりたいことを決めた。私は新しい儀式によって力を得たと主張し、他の魔術師と王にその儀式を行うよう申し出るつもりだ。儀式が終われば、私は王になる！\n\nティモールはもちろん抗議するだろうが、これだけの力が提供されている以上、彼らが彼の言うことを聞くとは思えない！\n\n全ての者は私の前にひれ伏すだろう\n- 未来のドワーフの王
journal.document.halls_king.ritual.title=儀式
journal.document.halls_king.thing.body=問題がある。ティモールは何の苦労もなく派遣されたが、私がアウタープレーンで物色していたことは気付かれなかったようだ。\n\n何か...『何か』が...私の世界に引き寄せられ、下のホールの底で自分自身を押し通し始めている。事態をさらに複雑にしているのは、私がアミュレットを保管した正確な場所だ！こんな腹黒い生き物が、なぜ私の力を否定しようとするのだろう。\n\n私の力にもかかわらず、ただ突撃して戦うことはできないだろう。その真の力は計り知れないが、それを制限する方法はあるはずだ。私は私の獲物を守る
journal.document.halls_king.thing.title=ザ・シング
journal.document.halls_king.title=日記
journal.document.intros.caves.body=廃墟となった牢獄の地下には、人もまばらな洞窟が広がっている。鉱物が豊富で、かつてはドワーフ社会の賑やかな貿易と産業の中心地だったが、ドワーフが暗黒魔法に取り憑かれたため放棄された。\n\n洞窟には現在、地底の野生動物やノール、廃機械などが生息している。
journal.document.intros.caves.title=洞窟
journal.document.intros.city.body=ドワーフのメトロポリスはかつてドワーフの都市国家の中で最も偉大な都市だった。最盛期には、ドワーフは金属と魔法で不思議な機械を作り、都市を急速に拡大させた。\n\nそしてある日、都市の門が封鎖され、ドワーフたちの消息は途絶えた。閉ざされた都市を脱出した数少ない人々は、王位を奪った狂気の魔術師と、彼が習得した恐ろしい魔法の話をした。
journal.document.intros.city.title=ドワーフのメトロポリス
journal.document.intros.discover_hint=このテキストは、初めて特定の地域に入るときに見つけることができる。
journal.document.intros.dungeon.body=このダンジョンには、上の街から多くの英雄たちが先に入っていったが、そのほとんどが消息不明になっている。\n\n深淵には古代の邪悪が潜み、全能のアミュレット "イェンドール "を守っていると言われている。今もなお、暗黒のエネルギーが地下から放射され、街へと上ってきている。\n\nダンジョンを攻略し、アミュレットを手に入れることができるか？さあ、冒険の始まりだ！
journal.document.intros.dungeon.title=ダンジョン
journal.document.intros.halls.body=ドワーフ・メトロポリスの奥深いホールは、闇の魔法によってねじ曲げられた。かつてこの地域は、ドワーフ王のエリート・ウォーロックの宮廷を受け入れていたが、現在はさらに邪悪なものに乗っ取られているようだ...。\n\n恐ろしい闇の力に導かれ、恐ろしい悪魔のような生き物が棲んでいるのだ。ドワーフの王が堕落の元凶でないなら、この下にいるものは何であれ、そうであるに違いない。\n\nここまで降りてきた冒険者はほとんどいない。
journal.document.intros.halls.discover_hint=このテキストは特定の地域で見つけることができるが、このセット内の先行するテキストをすべて見つけてからでなければならない。
journal.document.intros.halls.title=デーモン・ホール
journal.document.intros.prison.body=何年も前、危険な犯罪者を収容するための刑務所がここに建てられた。厳重に管理され、安全が確保され、服役するために各地から囚人が集められた。\n\nしかし、やがて地下から暗い瘴気が忍び寄り、看守と囚人の心をねじ曲げ始めた。\n\nこの混乱に対処するため、市は刑務所全体を封鎖した。塀の中に置き去りにされた人々がどうなったかは誰も知らない......。
journal.document.intros.prison.title=刑務所
journal.document.intros.sewers.body=ダンジョンの上層階は、実は街の下水道システムを構成している。\n\n闇のエネルギーが下から這い上がってくるにつれ、普段は無害な下水道生物もますます凶暴になってきた。市は上層部の安全を確保するため、ここに警備パトロールを送らなければならなくなった。\n\nこの場所は危険だが、少なくともここで働いている邪悪な魔法は弱い。
journal.document.intros.sewers.title=下水道
journal.document.intros.title=地域紹介
journal.document.prison_warden.discover_hint=このテキストは特定の地域で見つけることができるが、このセット内の先行するテキストをすべて見つけてからでなければならない。
journal.document.prison_warden.journal.body=春一番、362\n\nこれはキアナ・スミス刑務所長の業務日誌の最初のエントリーである。最近いろいろなことがあったので、自分の考えを整理するために日記を始めることにした。\n\n地下半マイルの刑務所を管理するのは決して簡単なことではないが、最近はある種の組織的混乱が起きているようだ。受刑者は理由もなく暴れ、その理由を説明しようとしない。\n\n何人かの看守は、この場所には幽霊が出ると言い始めている。自分の部下に噂を流させるわけにはいかないが、彼らが不安になるのも無理はない。\n- スミス
journal.document.prison_warden.journal.title=日記をつける
journal.document.prison_warden.letter.body=トーマス\n\n君は素晴らしい友人だ。\n\n今夜のシフトが始まったら、天狗の独房に鍵をかけて補強し、鍵をどこかの床の間に放り込んで、出て行ってくれ。他の囚人が無人になろうが関係ない。すぐに誰もここから出られなくなる。でも、あの変人は安全な場所にいなければならない。もし逃げ出したら、何をしでかすかわからない。\n\nこのことは誰にも言うな、わざわざ私を探す必要もない。船長は船と共に沈まなければならない。\n- キアナ
journal.document.prison_warden.letter.title=トーマスへの手紙
journal.document.prison_warden.mines.body=冬の54日、363\n\n今日、市から技術者たちがやってきた。下の鉱山への古い入り口を封鎖するために来たと言う。市としては、これ以上通路を整備するのは面倒だということなのだろう。私は例によって事前に知らされていなかった。\n\n彼らの技師長も、鉱山からドワーフの魔法が漏れてくるというくだらないことを言っていた。私はその言葉を信じていない。\n\n新しいスタッフによって状況はだいぶ改善されたが、問題の根本的な解決には至っていない。何かがここの収容者に影響を及ぼしているのは間違いないし、壁を何枚か壊したところで、それが変わるわけではない。\n- スミス
journal.document.prison_warden.mines.title=鉱山の封鎖
journal.document.prison_warden.no_support.body=春の11日、364\n\n市はいったい何を考えているのだろう。緊急に救援を要請したのに、何も連絡がない。いつも要請が却下されたときに送られてくるような、空虚な謝罪の言葉すらない。\n\n一方、受刑者たちは悪化の一途をたどり、看守のなかにはトラブルを起こす者まで出てきた。このまま暴動が起きるまで事態を悪化させるつもりなのだろうか？\n\nトーマスは、少なくとも相変わらず信頼できる。彼の組織的な助けは非常に貴重だし、古いDM-100ユニットを起動させるという彼のアイデアは、残念だが必要なことだった。この状況を打開する自信はある！\n-スミス
journal.document.prison_warden.no_support.title=サポートなし
journal.document.prison_warden.recruits.body=春の80日、362\n\n約束通り、今日も大勢の新兵がやってきた。いつものことだが、有望なのは数人で、給料が欲しいだけのグランツが多いようだ。それでも、この新兵がいれば、最近手に負えなくなった収容者たちのために大いに役立つはずだ。\n\nこういう仕事では、誰を信頼できるかが重要だ。特にトーマスという新入社員は有望だ。私は今、得られるすべての助けを必要としているので、もし彼がうまくやれば、すぐに昇進させるつもりだ。\n- スミス
journal.document.prison_warden.recruits.title=新入社員
journal.document.prison_warden.rotberry.body=秋の23日、363\n\n今日、フェリックスから素敵なプレゼントを受け取った。ロットベリー」と呼ばれる真っ赤な低木だ。\n\n以前、ここがいかに殺風景か彼に話したことがあるのだが、どうやら聞いてくれていたようだ。彼によると、この植物は光と水を嫌うらしい。彼は手紙の中で何度もそのことに触れていた。\n\nもちろん、フェリックスはタダでは何もしない。彼が言うには、この植物が実らせる種は杖を作るのに最適だそうだ。\n- スミス
journal.document.prison_warden.rotberry.title=ロットベリープラント
journal.document.prison_warden.title=所長日誌
journal.document.sewers_guard.crabs.body=冬の11日 376\nパパとママへ\n\nネズミがまだ十分悪くないかのように、もっと奥には巨大なカニがいる！そのうちの1匹が私の目の前を突進してきて、私たちが殺す前にリーがひどい目に遭いました。トーマスは私のせいではないと言っていますが、彼は私に親切にしようとしているだけだと分かっています。\n\nありがたいことに、外に出る途中で冒険者に出会って、予備のサングラスの軟膏を持っていた。あれがなかったら、リーは助からなかったかもしれない。\n\n冒険者が出発する前に、バラの花を見つめているのを見た。そんなに心配してくれる人がいるのに、どうしてこんなところで命を危険にさらすんだろう？\n\nそれこそ僕がやっていることじゃないか。どうしようもない気がする。
journal.document.sewers_guard.crabs.title=巨大なカニ！
journal.document.sewers_guard.dangerous.body=375年 秋の88日\nパパとママへ\n\n下水道にはモンスターがはびこっている！害虫」や「無法者」は血に飢えた巨大なネズミや怒れるニョロニョロの群れだ。\n\nありがたいことに、私のチームの他のメンバーは、自分たちが何をしているのか本当によくわかっている。チームキャプテンのトーマスはこの道のエキスパートだ。私は負担にならないよう、早く学ぼうとしている。\n\nこの仕事は思っていたよりずっと危険だ。今はこれを送れなくてよかったよ、心配させたくないからね。\n\n私は安全を守ります、\n- ソーニャ
journal.document.sewers_guard.dangerous.title=危険なポジション
journal.document.sewers_guard.discover_hint=このテキストは特定の地域で見つけることができるが、このセット内の先行するテキストをすべて見つけてからでなければならない。
journal.document.sewers_guard.guild.body=冬の23日 376\nパパとママへ\n\n今回は新しいモンスターは出なかった。代わりに、パトロール中に盗賊ギルドの小集団に出くわした。\n\n盗賊ギルドについては悪い噂ばかり聞いていたんだけど、他のチームは彼らとほとんど友好的に見えたんだ。トーマスは彼らのひとりと情報や物資を交換し、別行動をとった。\n\nよくわからないんだけど、私たちは無法者を排除するはずじゃなかったのか？トーマスはこのことを指揮官の誰にも言うなとまで言っていた。でも、彼らの情報と物資はとても役に立ったし、これ以上の戦闘は耐えられなかった。\n\nここはみんな一緒なんだ。
journal.document.sewers_guard.guild.title=盗賊ギルド
journal.document.sewers_guard.lost.body=冬の40日, 376\n\nトーマスと私は道に迷った。ニョロニョロと戦っているうちに、他のチームから離れてしまったのだ。二人とも怪我はなかったが、下の下水道は迷路のようだ。\n\nトーマスは脱出ルートを知っているというが、それは下水道の底にある古い刑務所の入り口から始まっている。でも、食料もないし、巡回ルートを探して歩き回るより、下へ下ったほうがずっと早い。\n\n大丈夫だ。トマは自分が何をしているかわかっている。
journal.document.sewers_guard.lost.title=私たちは迷っている
journal.document.sewers_guard.new_position.body=375年 秋の85日\nパパとママへ\n\n市警での苦労は報われるって言ったでしょ。昇進したんだ！\n\n下水道で働く専門チームに招かれたんだ。どうやら下水道では害虫や無法者の問題があるらしく、それを一掃するのが僕らの仕事なんだ。面倒な仕事だけど、下水道は冬でも暖かいし、給料も通常の警備員の3倍もらえるんだ！\n\nでもちょっと秘密めいた仕事だから、実はこの手紙は送れないんだ。君に手紙を書かないのは変な感じがするから、とにかく書き続けるつもりだ。いつか君に見せることができるかもしれない。\n\n最高、\n- ソーニャ
journal.document.sewers_guard.new_position.title=私の新しいポジション
journal.document.sewers_guard.not_worth.body=トーマスと私は、刑務所の入り口で巨大なウーズモンスターに遭遇した。私たちが反応する前に、その怪物は私たちに魔法を浴びせた。トーマスはそのほとんどを受けた。彼は死んだ。\n\nいくら金を積まれても、こんなことにはならない。私はトーマスが教えてくれたルートを通って去るつもりだ。そして、警備員として稼いだお金で、両親と私をこの呪われた街から遠ざけようと思う。国王に何か計画があることを期待したい気持ちもあるが、どうだろう。\n\nこの手紙は、他の人たちへの警告として残しておくつもりだ。巨大なネズミやカニ以上に、この街は何かが狂っている。
journal.document.sewers_guard.not_worth.title=その価値はない
journal.document.sewers_guard.title=衛兵の手紙
