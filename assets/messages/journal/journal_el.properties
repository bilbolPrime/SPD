journal.document.adventurers_guide.alchemy.body=Αν δεν βρείτε κάποιο αναλώσιμο αντικείμενο χρήσιμο, μπορείτε να το χρησιμοποιήσετε ως συστατικό αλχημείας ή να το μετατρέψετε σε αλχημική ενέργεια γενικής χρήσης. Τα ενεργοποιητικά φίλτρα και οι πάπυροι τα προσδιορίζουν επίσης!\n\nΤα μπιχλιμπίδια είναι ένα μοναδικό είδος εξοπλισμού που δημιουργείται και αναβαθμίζεται χρησιμοποιώντας αλχημεία. Είναι κατασκευασμένα με έναν μαγικό καταλύτη μπιχλιμπιδιών και λίγη αλχημική ενέργεια.\n\n(Το πρώτο δοχείο αλχημείας βρίσκεται στον 3ο ή 4ο όροφο του μπουντρουμιού. Υπάρχουν επίσης σελίδες βιβλίων συνταγών αλχημείας κοντά σε αυτά τα δοχεία.)
journal.document.adventurers_guide.alchemy.title=Αλχημεία & Μπιχλιμπίδια
journal.document.adventurers_guide.dieing.body=Το dungeoneering είναι επικίνδυνο και οι περισσότεροι τυχοδιώκτες τελικά καταλήγουν στο τέλος τους.\n\nΗ τύχη βοηθάει, αλλά οι καλύτεροι τυχοδιώκτες χρησιμοποιούν κάθε μικρό κόλπο για να βελτιώσουν τις πιθανότητές τους.\n\n(Μην στεναχωριέστε αν πεθαίνετε πολύ, αυτό το παιχνίδι είναι δύσκολο! Εστιάστε στο να μάθετε το παιχνίδι και να βελτιώνεστε σταθερά, όχι στο να κερδίζετε αμέσως.)
journal.document.adventurers_guide.dieing.title=Χειρισμός της ήττας
journal.document.adventurers_guide.examining.body=Είναι σημαντικό να μελετάτε τους εχθρούς και το περιβάλλον σας αντί να βιάζεστε να εισβάλλετε στα τυφλά! Αποκτήστε τη συνήθεια να εξετάζετε οτιδήποτε καινούργιο.\n\n (Μπορείτε να εξετάσετε χρησιμοποιώντας το κουμπί με τον μεγεθυντικό φακό και στη συνέχεια επιλέγοντας τι θέλετε να εξετάσετε. Μπορείτε επίσης να εξετάσετε ενισχύσεις ή αποδυναμώσεις επιλέγοντας τα εικονίδιά τους.)
journal.document.adventurers_guide.examining.title=Εξετάζοντας
journal.document.adventurers_guide.food.body=Η αποτελεσματική δελτίωση είναι ένας από τους καλύτερους τρόπους για να βελτιώσετε τις πιθανότητες επιβίωσής σας. Δεν χρειάζεται πάντα να τρώτε σωστά όταν πεινάτε! \n\nΌταν δεν πεινάτε, θα ανακτήσετε αργά την υγεία σας, οπότε αν τρώτε με πλήρη υγεία, αυτή η αναγέννηση θα πάει χαμένη! \n\nΑν τρώτε με βάση την υγεία σας, το φαγητό σας θα διαρκέσει πολύ περισσότερο.
journal.document.adventurers_guide.food.title=Αντιμετώπιση της πείνας
journal.document.adventurers_guide.identifying.body=Τα χρώματα των φίλτρων και των συμβόλων στους πάπυρους διαφέρουν σε κάθε μπουντρούμι. Ο άγνωστος εξοπλισμός μπορεί να αναβαθμιστεί ή να μαγευτεί αν είστε τυχεροί, ή μπορεί να είναι καταραμένος!\n\nΟι πάπυροι αναγνώρισης, αναβάθμισης ή αφαίρεσης κατάρας είναι πολύ χρήσιμοι αν θέλετε να μειώσετε τον κίνδυνο χρήσης άγνωστου εξοπλισμού.\n\n(Μπορείτε να βρείτε μια λίστα με όλα τα αντικείμενα που έχετε αναγνωρίσει στην καρτέλα καταλόγου του ημερολογίου σας)
journal.document.adventurers_guide.identifying.title=Αναγνώριση στοιχείων
journal.document.adventurers_guide.intro.body=Γεια σου Adventurer, διαβάζεις τον Τόμο της Εξειδίκευσης στο Μπουντρούμι! Αυτός ο οδηγός είναι καλύτερο να χρησιμοποιηθεί ως αναφορά και θα σε ενημερώσει μαγικά πότε είναι καλύτερο να διαβάσεις κάθε σελίδα. \n\n (Όταν αναβοσβήνει το κουμπί του ημερολογίου, επίλεξέ το για να διαβάσεις ό,τι έχει να σου πει ο οδηγός! Λείπουν όμως κάποιες σελίδες, ίσως τις βρεις στο μπουντρούμι;)
journal.document.adventurers_guide.intro.title=Εισαγωγή
journal.document.adventurers_guide.levelling.body=Η αύξηση του επιπέδου ενισχύει τα στατιστικά σας και σας απονέμει πόντους ταλέντου, κάτι που μπορεί να κάνει μεγάλη διαφορά στη μάχη. Είναι καλύτερο να έχετε τουλάχιστον ένα επίπεδο για κάθε όροφο του μπουντρουμιού.\n\nΜπορεί να είναι δελεαστικό να βιαστείτε και να αποφύγετε την εξερεύνηση ή τη μάχη, αλλά κάτι τέτοιο θα σας στερήσει προμήθειες και εμπειρία.\n\n(Μπορείτε να δείτε πληροφορίες για τον ήρωά σας, συμπεριλαμβανομένης της εμπειρίας, στο παράθυρο κατάστασης στη γωνία της διεπαφής του παιχνιδιού. Επιλέξτε το πορτρέτο του ήρωά σας για να λάβετε ακόμη περισσότερες πληροφορίες.)
journal.document.adventurers_guide.levelling.title=Αποκτώντας Εμπειρία
journal.document.adventurers_guide.looting.body=Τα δωμάτια που βρίσκονται πίσω από κλειδωμένες πόρτες ή που περιέχουν εμπόδια συνήθως έχουν καλύτερα λάφυρα. Όταν ένα εμπόδιο μπλοκάρει το μονοπάτι σας, συνήθως μπορείτε να βρείτε ένα αντικείμενο για να βοηθήσετε στον ίδιο όροφο.\n\nΘα μπορείτε πάντα να βρείτε 2 φίλτρα δύναμης και 3 πάπυρους αναβάθμισης σε κάθε περιοχή μπουντρουμιού πέντε ορόφων, επομένως αποτελούν μια εξαιρετική ένδειξη για το πόσο καλά εξερευνάτε.\n\n(Μπορείτε να δείτε μια λίστα με ορόσημα και αχρησιμοποίητα κλειδιά στην καρτέλα σημειώσεων του παραθύρου του ημερολογίου.)
journal.document.adventurers_guide.looting.title=Αποτελεσματική λεηλασία
journal.document.adventurers_guide.magic.body=Οι μαγικές επιθέσεις διαπερνούν την πανοπλία και είναι δύσκολο να αποφευχθούν. Αυτό σημαίνει ότι η ζημιά από τα ραβδιά είναι πολύ αξιόπιστη, αλλά κάνει επίσης τους μαγικούς εχθρούς πολύ επικίνδυνους!\n\nΟι μαγικές επιθέσεις έχουν πάντα ένα μειονέκτημα. Τα ραβδιά έχουν περιορισμένες φορτίσεις και οι μαγικοί εχθροί συνήθως δεν θα μπορούν να χρησιμοποιήσουν τη μαγεία τους σε κοντινή απόσταση.\n\nΌταν αντιμετωπίζετε εχθρούς που χρησιμοποιούν μαγεία, είναι σημαντικό να μάθετε πώς να τους εμποδίσετε να τη χρησιμοποιήσουν εναντίον σας.
journal.document.adventurers_guide.magic.title=Μαγικές Επιθέσεις
journal.document.adventurers_guide.positioning.body=Η στρατηγική είναι εξίσου σημαντική με τον εξοπλισμό. Κακές καταστάσεις, όπως το να σε περικυκλώσουν, μπορούν συνήθως να αποφευχθούν με καλή τοποθέτηση.\n\nΓια παράδειγμα, τα περισσότερα μπουντρούμια έχουν λεπτούς διαδρόμους που αναγκάζουν τους εχθρούς να σας πολεμούν έναν κάθε φορά. Αυτοί οι διάδρομοι συχνά έχουν και πόρτες για αιφνιδιαστικές επιθέσεις!\n\nΥπάρχουν πολλοί μικροί τρόποι για να χρησιμοποιήσετε χαρακτηριστικά περιβάλλοντος όπως γρασίδι, νερό, λάκκους ή παγίδες προς όφελός σας.
journal.document.adventurers_guide.positioning.title=Τοποθέτηση
journal.document.adventurers_guide.searching.body=Τα μπουντρούμια είναι γεμάτα με μυστικές πόρτες και παγίδες που φαίνονται αόρατες με την πρώτη ματιά. Μπορείτε να αφιερώσετε λίγο χρόνο και να ψάξετε προσεκτικά αν υποψιάζεστε ότι κάποια πόρτα ή παγίδα είναι κρυμμένη κοντά σας.\n\n (Μπορείτε να ψάξετε σε όλα τα πλακίδια γύρω σας χρησιμοποιώντας το κουμπί του μεγεθυντικού φακού δύο φορές. Ίσως υπάρχουν κάποιες κρυφές πόρτες κοντά στο σημείο που βρήκατε αυτήν τη σελίδα!)
journal.document.adventurers_guide.searching.title=Ερευνητικός
journal.document.adventurers_guide.strength.body=Δεν υπάρχει χρόνος για εκπαίδευση με όπλα και πανοπλίες που βρίσκεις στο μπουντρούμι, επομένως θα χρειαστείς ωμή δύναμη για να τα χρησιμοποιήσεις αποτελεσματικά.\n\nΤα φίλτρα δύναμης και οι πάπυροι αναβάθμισης είναι ο πιο αποτελεσματικός τρόπος για να καλύψεις τις απαιτήσεις δύναμης του εξοπλισμού υψηλότερου επιπέδου.\n\nΕίναι σημαντικό να αρχίσεις τελικά να χρησιμοποιείς αντικείμενα υψηλού επιπέδου, αλλά μην αγνοείς τον εξοπλισμό που μπορείς να χρησιμοποιήσεις αυτή τη στιγμή.
journal.document.adventurers_guide.strength.title=Δύναμη
journal.document.adventurers_guide.surprise_attacks.body=Οι αιφνιδιαστικές επιθέσεις είναι εγγυημένες, γεγονός που τις καθιστά ιδιαίτερα χρήσιμες ενάντια σε εχθρούς που προσπαθούν να αποφύγουν την εμφάνιση, όπως φίδια και φαντάσματα.\n\nΜπορείτε να αιφνιδιάσετε τους εχθρούς αμέσως μόλις μπουν σε μια πόρτα ενώ σας κυνηγούν ή όταν σας χάσουν από τα μάτια τους.
journal.document.adventurers_guide.surprise_attacks.title=Αιφνιδιαστικές Επιθέσεις
journal.document.adventurers_guide.title=τόμος της κυριαρχίας στα μπουντρούμια
journal.document.adventurers_guide.upgrades.body=Όσο πιο βαθιά μπαίνεις σε ένα μπουντρούμι, τόσο πιο σημαντικό είναι να χρησιμοποιείς μαγικά αναβαθμισμένο εξοπλισμό υψηλού επιπέδου, αλλά θα χρειαστείς επίσης τη δύναμη για να τον χρησιμοποιήσεις σωστά.\n\nΤα ραβδιά, τα δαχτυλίδια και τα αντικείμενα δεν χρειάζονται δύναμη, αλλά έχουν περιορισμένες χρήσεις ή δεν βοηθούν τόσο άμεσα στη μάχη.\n\nΤο να κάνεις σωστές επιλογές σχετικά με το τι αναβαθμίζεις είναι πολύ σημαντικό για να επιβιώσεις νωρίς στο μπουντρούμι και για να προετοιμάσεις τον εαυτό σου για επιτυχία αργότερα στο μπουντρούμι.
journal.document.adventurers_guide.upgrades.title=Αναβαθμίσεις
journal.document.alchemy_guide.bombs.body=Μια τυπική βόμβα μαύρης πυρίτιδας μπορεί να αναμειχθεί με ένα συγκεκριμένο αντικείμενο για να δημιουργηθεί μια ενισχυμένη βόμβα.
journal.document.alchemy_guide.bombs.title=Βελτιωμένες βόμβες
journal.document.alchemy_guide.brews_elixirs.body=Τα ροφήματα και τα ελιξίρια είναι προηγμένα φίλτρα με ποικίλα αποτελέσματα, συνήθως με μία μόνο χρήση.
journal.document.alchemy_guide.brews_elixirs.title=παρασκευάσματα και ελιξίρια
journal.document.alchemy_guide.energy_food.body=Πολλές συνταγές απαιτούν κρυσταλλική αλχημική ενέργεια, η οποία παράγεται με την αποδόμηση αναλώσιμων αντικειμένων σε ένα αλχημικό δοχείο. Τα ενεργοποιητικά φίλτρα ή οι πάπυροι τα προσδιορίζουν επίσης. \n\n Ορισμένες συνταγές που απαιτούν ενέργεια είναι μαγικές, αλλά αυτές μοιάζουν με την παραδοσιακή μαγειρική.
journal.document.alchemy_guide.energy_food.title=Ενέργεια και Τρόφιμα
journal.document.alchemy_guide.exotic_potions.body=Τα φίλτρα μπορούν να αναμειχθούν με ενέργεια για να δημιουργήσουν εξωτικά φίλτρα. Έχουν πιο ισχυρά αποτελέσματα, αλλά συχνά είναι χρήσιμα με διαφορετικούς τρόπους.
journal.document.alchemy_guide.exotic_potions.title=εξωτικά φίλτρα
journal.document.alchemy_guide.exotic_scrolls.body=Οι εξωτικοί πάπυροι μπορούν να φτιαχτούν με λίγη ενέργεια και έναν πάπυρο. Είναι λίγο πιο δυνατοί και πιο ακριβοί από τα εξωτικά φίλτρα.
journal.document.alchemy_guide.exotic_scrolls.title=εξωτικοί πάπυροι
journal.document.alchemy_guide.potions.body=Καλώς ορίσατε στις Πρακτικές Εφαρμογές της Αλχημείας! Αυτό το βιβλίο είναι μια αναφορά σε συνταγές για την κατασκευή αντικειμένων σε ένα αλχημειακό δοχείο.\n\nΘα ξεκινήσουμε με την πιο εμβληματική συνταγή: Φίλτρα!\n\nΧρησιμοποιήστε τρεις σπόρους για να φτιάξετε ένα τυχαίο φίλτρο! Κάθε σπόρος έχει ένα αντίστοιχο φίλτρο, χρησιμοποιήστε πολλαπλάσια του ίδιου σπόρου για να αυξήσετε την πιθανότητα το φίλτρο να σχετίζεται με τους σπόρους που χρησιμοποιήσατε.
journal.document.alchemy_guide.potions.title=Εισαγωγή και Φίλτρα
journal.document.alchemy_guide.spells.body=Τα ξόρκια περιέχονται σε κρυστάλλους και παρέχουν μια ποικιλία εφέ, συνήθως με πολλαπλές χρήσεις.
journal.document.alchemy_guide.spells.title=ξόρκια
journal.document.alchemy_guide.stones.body=Αν αναμείξετε έναν πάπυρο σε ένα δοχείο αλχημείας, η μαγεία του θα μετατραπεί σε δύο βράχους μέσα στο δοχείο. Αυτό δημιουργεί ρουνικούς λίθους και αναγνωρίζει τον πάπυρο!
journal.document.alchemy_guide.stones.title=Δημιουργία Ρουνικών Λίθων
journal.document.alchemy_guide.title=Οδηγός Αλχημείας
journal.document.alchemy_guide.weapons.body=Μερικά από τα ελαφρύτερα ή πιο μαγικά όπλα μπορούν να χρησιμοποιηθούν στην αλχημεία!\n\nΚάθε σετ όπλων που ρίχνεται παράγει αρκετό υγρό μέταλλο για να επισκευάσει πλήρως ένα άλλο σετ του ίδιου επιπέδου και βαθμίδας. Σημειώστε ότι η αλχημιστική δράση ενός σετ θα καταστρέψει ολόκληρο το σετ, ακόμα κι αν δεν είναι όλο παρόν!\n\nΈνα ραβδί θα παράγει αρκετή ρητίνη απόκρυφων όπλων για να αναβαθμίσει δύο ραβδιά του ίδιου επιπέδου, αλλά όχι υψηλότερο από +3.
journal.document.alchemy_guide.weapons.title=Βελτιωτικά όπλα
journal.document.caves_explorer.alive.body=23η Καλοκαιριού, 308\n\nΜία από τις μηχανές των νάνων ζωντάνεψε με κάποιο τρόπο! Περνούσαμε απλώς από εκεί όταν όρμησε και παραλίγο να συντρίψει δύο από την ομάδα μας με τις τεράστιες μεταλλικές γροθιές της. Ευτυχώς, κουβαλούσα μαζί μου το ραβδί της αποσύνθεσης. Μερικές εύστοχες εκρήξεις από αυτό και το θηριώδες πράγμα μετατράπηκε σε παλιοσίδερα.\n\nΑυτό που με ενοχλεί είναι ότι δεν κάναμε απολύτως τίποτα για να προκαλέσουμε τη μηχανή. Οι νάνοι δεν θα μπορούσαν να έχουν σχεδιάσει τις μηχανές να είναι τόσο επιθετικές, είναι σαν να προσπαθούσε να μας στήσει ενέδρα!\n\nΤουλάχιστον μπόρεσα να προσφέρω κάποια βοήθεια στους συντρόφους μου για μια φορά.\n- Άρτσιμπαλντ
journal.document.caves_explorer.alive.title=Είναι ζωντανό!
journal.document.caves_explorer.city.body=21η Καλοκαιριού, 308\n\nΒρισκόμαστε τώρα στο σημάδι των τριών εβδομάδων, και αφού περάσαμε μεγάλο μέρος των τελευταίων δέκα ημερών χαρτογραφώντας όλο και πιο βαθιά, φτάσαμε επιτέλους στον πάτο των ορυχείων. Βρήκαμε διάφορα μεταλλικά κατασκευάσματα και μια μεγάλη πύλη που εμποδίζει την είσοδο στην παλιά μητρόπολη των νάνων.\n\nΟ σιδηρουργός μας προειδοποίησε για κάποια από αυτά τα μηχανήματα. Προφανώς προορίζονταν για την άμυνα της περιοχής και έχουν την τάση να ενεργοποιούνται όταν ενοχλούνται. Δεν έχουμε καμία δουλειά στην πόλη, και το μέταλλο θα είχε ελάχιστη αξία για παλιοσίδερα, οπότε σκεφτήκαμε ότι ήταν καλύτερο να ακούσουμε την προειδοποίησή του και να επιστρέψουμε.\n\nΠρέπει να παραδεχτώ ότι ήμουν περίεργος, αλλά η έρευνα εκεί κάτω σίγουρα δεν άξιζε το ρίσκο.\n- Άρτσιμπαλντ
journal.document.caves_explorer.city.title=Η Είσοδος της Πόλης
journal.document.caves_explorer.discover_hint=Μπορείτε να βρείτε αυτό το κείμενο σε μια συγκεκριμένη περιοχή, αλλά μόνο αφού βρείτε όλα τα προηγούμενα κείμενα σε αυτό το σύνολο.
journal.document.caves_explorer.expedition.body=1η Καλοκαιριού, 308\n\nΣήμερα ξεκινά η τετράμηνη αποστολή μας στα εγκαταλελειμμένα ορυχεία των νάνων! Μου έχει ανατεθεί από τον ίδιο τον βασιλιά να εξερευνήσω την περιοχή. Οι κύριοι στόχοι μου είναι να βρω τυχόν ανεκμετάλλευτους φυσικούς πόρους και να ερευνήσω τις σπηλιές για ένα πιθανό έργο κατασκευής φυλακής.\n\nΕνώ είμαι σε θέση να υπερασπιστώ τον εαυτό μου, δέχτηκα συνοδεία από την φρουρά της πόλης κατόπιν επιμονής του βασιλιά. Είναι μια ομάδα αφελών, αλλά αρκεί να μην με καθυστερούν η παρουσία τους είναι ανεκτή.\n\nΑναμένεται να καθαρίσουμε τους υπονόμους και να φτάσουμε στα ορυχεία μέχρι το βράδυ.\n- Άρτσιμπαλντ Ντράμοντ. Αρχιμάγος, ινστιτούτο μάγων του νότιου κόσμου.
journal.document.caves_explorer.expedition.title=Έναρξη αποστολής!
journal.document.caves_explorer.gold.body=4η Καλοκαιριού, 308\n\nΟι πρώτες μας μέρες ήταν πράγματι πολύ καρποφόρες! Αφού στήσαμε μια κατασκήνωση βάσης, ξεκινήσαμε να εξερευνήσουμε μερικές από τις ανώτερες περιοχές του εγκαταλελειμμένου ορυχείου. Ενώ υπάρχει άφθονη άχρηστη ακαταστασία που έχουν αφήσει οι νάνοι, πολλά από τα τοιχώματα των σπηλαίων είναι επίσης γεμάτα χρυσό!\n\nΔυστυχώς, δεν είμαστε οι πρώτοι που φτάσαμε εδώ. Τα σπήλαια είναι γεμάτα με επιθετική άγρια ζωή, και φαίνεται ότι αγέλες gnolls ενδιαφέρονται επίσης για τον χρυσό. Ομολογώ ότι ήμουν άδικος με τη συνοδεία φρουράς μου, ήταν πολύ πιο ικανοί εξερευνητές και σωματοφύλακες από ό,τι περίμενα.\n\nΑκόμα και με αυτή την επιτυχία, έχουμε ακόμα πολλά από τα ορυχεία να εξερευνήσουμε.\n- Άρτσιμπαλντ
journal.document.caves_explorer.gold.title=Τόσο πολύ χρυσό!
journal.document.caves_explorer.report.body=28η Καλοκαιριού, 308\n\nΣήμερα θα ολοκληρώσουμε το πακετάρισμα των πραγμάτων μας και θα ετοιμαστούμε να φύγουμε. Ακριβώς στην ώρα μας, αρκετοί από την ομάδα μας άρχισαν να βλέπουν τρομερούς εφιάλτες μετά το περιστατικό με το επιθετικό μηχάνημα. Πιθανώς είναι απλώς κόπωση, αλλά οι εφιάλτες τους είναι όλοι ανησυχητικά παρόμοιοι.\n\nΣυνοψίζοντας, οι ανώτερες περιοχές του ορυχείου είναι αρκετά ασφαλείς. Αν μπορούσε να βρεθεί μια χρήση για τον σκούρο χρυσό, τότε η εξόρυξη μπορεί να είναι αρκετά επικερδής. Οι μεγάλοι ανοιχτοί χώροι θα λειτουργούσαν πολύ καλά και για τα κατασκευαστικά σχέδια της πόλης. Τα κατώτερα ορυχεία είναι πιο επικίνδυνα, ωστόσο, και πρέπει να αποφεύγονται.\n\nΘα τα γράψω όλα αυτά στην τελική μου έκθεση τις επόμενες ημέρες.\n- Άρτσιμπαλντ
journal.document.caves_explorer.report.title=Τελική Έκθεση
journal.document.caves_explorer.title=Αρχείο καταγραφής εξερευνητή
journal.document.caves_explorer.troll.body=11η Καλοκαιριού, 308\n\nΑφού ξεκινήσαμε την εξερεύνησή μας στο κέντρο των ορυχείων, συναντήσαμε ένα φιλικό πρόσωπο! Λοιπόν... σχετικά φιλικό. Ένα τρολ των σπηλαίων έχει στήσει ένα μικρό σιδηρουργείο εκεί. Είναι τραχύς και όχι πολύ ομιλητικός, αλλά επισκεύασε τον εξοπλισμό μας με αντάλλαγμα λίγο χρυσό.\n\nΔυστυχώς, ο σιδηρουργός τρολ μας ενημέρωσε επίσης ότι όλος αυτός ο υπέροχος χρυσός δεν είναι τόσο καλός όσο φαίνεται. Τον αποκαλεί «σκοτεινό χρυσό» και προφανώς αποικοδομείται γρήγορα στο ηλιακό φως. Αυτό σίγουρα θα εξηγούσε γιατί δεν υπήρξαν ποτέ συγκρούσεις για τους πόρους εδώ.\n\nΥποθέτω ότι πρέπει να εμβαθύνουμε λίγο περισσότερο για να δούμε αν υπάρχει κάτι πιο πολύτιμο.\n- Άρτσιμπαλντ
journal.document.caves_explorer.troll.title=Συνάντησα ένα Τρολ
journal.document.city_warlock.discover_hint=Μπορείτε να βρείτε αυτό το κείμενο σε μια συγκεκριμένη περιοχή, αλλά μόνο αφού βρείτε όλα τα προηγούμενα κείμενα σε αυτό το σύνολο.
journal.document.city_warlock.failure.body=Φαίνεται ότι είμαι κι εγώ ανόητος. Υπέθεσα ότι ο Νέος Βασιλιάς χρειαζόταν την αυλή για να του υποταχθεί οικειοθελώς, αλλά τώρα βλέπω ότι έχει τη δύναμη να ελέγχει ακόμη και όσους του αντιστέκονται.\n\n Έφερα τυφλά όλους τους ισχυρότερους αντιπάλους κατευθείαν στην πόρτα του, ώστε να μπορέσει να τους μετατρέψει προσωπικά σε σκλάβους του. Τώρα κύματα της νεκρωτικής του ενέργειας σαρώνουν την πόλη, μετατρέποντας αμέσως τους περισσότερους σε ικέτες του.\n\nΟι λίγοι που έχουν ακόμα ελεύθερη βούληση φεύγουν. Έχω επιλέξει να μείνω πίσω για να παρατηρώ όσο καλύτερα μπορώ και να ψάχνω για ένα άνοιγμα. Με τη μαγική δύναμη που έχω θα πρέπει να μπορώ να μείνω κρυμμένος και ασφαλής για κάποιο χρονικό διάστημα.
journal.document.city_warlock.failure.title=Αποτυχία
journal.document.city_warlock.more_powerful.body=Η παρακολούθηση του χρόνου έχει γίνει δύσκολη, αλλά έχει περάσει περίπου μια εβδομάδα από την τελευταία μου είσοδο. Ο πολιτισμός μας έχει πραγματικά καταρρεύσει. Οι πύλες είναι κλειστές, όλες οι λειτουργίες της κοινωνίας μας έχουν σταματήσει και άδεια κελύφη νάνων περιφέρονται στους διαδρόμους.\n\nΣε όλα αυτά, με κάποιο τρόπο, ο Νέος Βασιλιάς γίνεται ακόμα πιο ισχυρός. Κάθε μέρα η δύναμη της θέλησής του γίνεται ισχυρότερη, αλλά αλλάζει επίσης. Δεν μπορώ να το περιγράψω, αλλά νιώθω σαν να μην είναι πλέον καθόλου νάνος.\n\nΑρχίζω να αποδέχομαι ότι το καλύτερο που μπορώ πιθανώς να ελπίζω να κάνω είναι να καταγράψω αυτά τα γεγονότα. Θα μείνω εδώ για όσο περισσότερο μπορώ και μετά θα υποχωρήσω μόλις η θέλησή μου αρχίσει να εξασθενεί.
journal.document.city_warlock.more_powerful.title=Πιο ισχυρό
journal.document.city_warlock.new_power.body=Τι συμβαίνει εδώ; Η δύναμη που πηγάζει από τον Νέο Βασιλιά είναι πράγματι διαφορετική από ό,τι στην αρχή, αλλά υπάρχει και κάτι άλλο. Αυτή η νέα δύναμη φαίνεται να ακτινοβολεί από τις εσωτερικές αίθουσες της πόλης μας.\n\nΑκόμα πιο περίεργο είναι ότι η δραστηριότητα στην άνω μητρόπολη έχει μειωθεί επίσης. Δεν ξέρω τι συμβαίνει εκεί κάτω, αλλά προσελκύει σχεδόν όλη την προσοχή του Νέου Βασιλιά.\n\nΗ επιστροφή στις βαθιές αίθουσες θα είναι επικίνδυνη, αλλά πρέπει να ανακαλύψω τι προκαλεί αυτή την αλλαγή. Ίσως ο Νέος Βασιλιάς να έχει τελικά κάποια αδυναμία;
journal.document.city_warlock.new_power.title=Μια Νέα Δύναμη
journal.document.city_warlock.old_king.body=Είναι η 5η ημέρα του 2ου μήνα του 33ου έτους της εποχής της μαγείας. Αν κάποιος υπερκόσμιος διαβάζει αυτό, είναι κάποια στιγμή τον Χειμώνα του 264. Το όνομά μου είναι Θίμορ Ζαχίρ, και από όσο γνωρίζω είμαι το τελευταίο επιζών μέλος της αυλής των νάνων.\n\nΟ Βασιλιάς μας είναι νεκρός, αντικαταστάθηκε από έναν από τους πρώην συναδέλφους μου που έχει τρελαθεί από την εξουσία. Η υπόλοιπη αυλή του υποτάχθηκε, σαν ανόητοι που είναι, και έχασε την ελεύθερη βούλησή της στη διαδικασία. Εγώ μόνος μου το είδα αυτό να έρχεται και έφυγα πριν ολοκληρωθεί η τελετουργία του.\n\nΟ εσωτερικός κύκλος έχει πέσει, αλλά η δύναμη του Νέου Βασιλιά δεν έχει φτάσει ακόμη σε όλους. Πρέπει να προβάλω αντίσταση το συντομότερο δυνατό. Αρνούμαι να αφήσω τον ένδοξο πολιτισμό μας να πέσει στα χέρια αυτού του μεγαλομανούς!
journal.document.city_warlock.old_king.title=Ο Βασιλιάς είναι Νεκρός
journal.document.city_warlock.resistance.body=Η είδηση φαίνεται να έχει διαδοθεί γρήγορα. Έχουν περάσει μόνο λίγες μέρες και έχω ήδη συγκεντρώσει έναν μικρό στρατό πιστών στον Γέρο Βασιλιά. Λίγοι είναι επιδέξιοι στη μαγεία, αλλά σχεδόν ολόκληρο το τάγμα των πολεμιστών μοναχών είναι ανάμεσά μας. Θα πρέπει να είμαστε κάτι παραπάνω από ικανοί να αντιμετωπίσουμε έναν τρελό νάνο και την αυλή των σκλάβων του. \n\nΕν τω μεταξύ, ο Νέος Βασιλιάς έχει κρυφτεί στα εσωτερικά δωμάτια της πόλης μας. Χωρίς αμφιβολία, έχει ξοδέψει το μεγαλύτερο μέρος της δύναμής του και ελπίζει να ανακάμψει πριν συναντήσει μεγαλύτερη αντίσταση. \n\nΘα εξαπολύσουμε την επίθεσή μας σε μερικές ώρες. Με λίγη τύχη θα μπορέσουμε να σχηματίσουμε ένα προσωρινό συμβούλιο και να επαναφέρουμε τη θαυμαστή πόλη μας σε σταθερότητα μέχρι το τέλος της νύχτας.
journal.document.city_warlock.resistance.title=Μια Αντίσταση
journal.document.city_warlock.seen_it.body=Έχω δει τι βρίσκεται από κάτω, αλλά δεν μπορώ να το περιγράψω. Τα χέρια μου τρέμουν ανεξέλεγκτα καθώς προσπαθώ να γράψω τις σκέψεις μου. \n\nΓιατί συμβαίνει αυτό; Το έκανε ο Νέος Βασιλιάς; Δεν έχει νόημα. Ίσως η αθέμιτη χρήση εξουσίας του το προσέλκυσε; Ήλπιζα να σώσω τον πολιτισμό μας, αλλά τώρα βλέπω ότι διακυβεύεται ολόκληρος ο κόσμος. \n\nΚάπως, ο βασιλιάς είναι το μικρότερο κακό. Δεν έχω άλλη επιλογή, για το γενικότερο καλό θα παραδοθώ. Σε παρακαλώ, οδήγησέ με, βασιλιά μου, χρησιμοποίησέ με ως όργανο για να κρατάς μακριά τον Γιογκ-Ντζέβα!
journal.document.city_warlock.seen_it.title=Το έχω δει
journal.document.city_warlock.title=Το Ημερολόγιο του Μάγου
journal.document.halls_king.amulet.body=ΤΟ ΚΑΤΑΦΕΡΑ!\n\nΔεν ήξερα τι ακριβώς θα έβρισκα, αλλά αυτό που ανακάλυψα εκεί έξω ξεπερνούσε κάθε τρελή εικασία μου. Τόση δύναμη, απλώς κάθονται εκεί έτοιμες να καταληφθούν, και είναι όλα δικά μου!\n\nΜε αυτό κανένας από τους ανόητους στην αυλή δεν θα τολμήσει να μου αντιταχθεί. Απλώς σκέφτομαι ζαλισμένος όλους τους διαφορετικούς τρόπους με τους οποίους θα μπορούσα να τους ταπεινώσω. Διάολε, γιατί να σταματήσω εκεί, έχω αρκετή δύναμη να καταστρέψω και τον τελευταίο από αυτούς, αν θέλω! Αυτό μπορεί να είναι υπερβολικό, αλλά δεν πρέπει να αργήσω να αποφασίσω, αλλιώς θα αρχίσουν να με καχυποψιάζονται.\n\nΝομίζω ότι θα ονομάσω αυτή τη μεγάλη δύναμη το Φυλαχτό του Γιέντορ!\n- R.
journal.document.halls_king.amulet.title=Το Φυλαχτό
journal.document.halls_king.attrition.body=Έχω ένα σχέδιο για να αντιμετωπίσω αυτό το πράγμα. Η δύναμή του είναι άπειρη, αλλά η ικανότητά του να εισβάλλει σε αυτόν τον κόσμο όχι. Βασίζεται σε υπηρέτες και avatars για να κάνουν τις εντολές του, ενώ προσπαθεί να συγκεντρώσει αρκετή δύναμη για να πάρει το φυλαχτό.\n\nΕνώ δεν κατέχω το φυλαχτό σωματικά, εξακολουθώ να έχω τον πλήρη έλεγχο της δύναμής του. Με ολόκληρη την πόλη των νάνων στη διάθεσή μου, έχω επίσης ένα αριθμητικό πλεονέκτημα. Μπορώ απλώς να συνεχίσω να στέλνω στρατιώτες για να το εμποδίσω να καταλάβει το φυλαχτό και να κερδίζω σταθερά αυτόν τον πόλεμο μέσω της φθοράς!\n\nI, Ο ΡΟΝΤΝΕΪ, Ο ΒΑΣΙΛΙΑΣ ΤΩΝ ΝΑΝΩΝ, ΘΑ ΣΕ ΞΕΧΩΡΙΣΕΙ ΓΙΟΓΚ-ΝΤΖΕΒΑ!
journal.document.halls_king.attrition.title=Τριβή
journal.document.halls_king.discover_hint=Μπορείτε να βρείτε αυτό το κείμενο σε μια συγκεκριμένη περιοχή, αλλά μόνο αφού βρείτε όλα τα προηγούμενα κείμενα σε αυτό το σύνολο.
journal.document.halls_king.new_king.body=ΕΙΜΑΙ ΒΑΣΙΛΙΑΣ, ΑΧΑΧΑΧΑΧΑΑΑΑ!\n\nΑπλώς με άφησαν να το κάνω! Χωρίς σχεδόν καμία πειστικότητα, συμφώνησαν να με αφήσουν να «μοιραστώ» αυτή τη δύναμη μαζί τους σε μια μεγάλη τελετουργία. Σε μια στιγμή μεταμορφώθηκαν από μια χορωδία από κοροϊδευτικές φωνές στη νέα μου αυλή από σιωπηλούς υπηκόους!\n\nΠροβλέψιμα, ο Θίμορ έφυγε τρέχοντας σαν δειλός με το πρώτο σημάδι προβλήματος. Μπορώ ήδη να νιώσω τη δύναμη αντίστασης που χτίζει κι εγώ. Νομίζω ότι θα του επιτρέψω να συνεχίσει, ώστε να μπορέσει να παραδώσει όλους τους συνωμότες του κατευθείαν στην πόρτα μου!\n\nΠροφανώς ούτε το βασίλειο με σέβεται, υποθέτω ότι θα το διορθώσω κι αυτό.\n- Βασιλιάς των Νάνων
journal.document.halls_king.new_king.title=Ένας Νέος Βασιλιάς
journal.document.halls_king.rejection.body=ΗΛΙΘΙΟΙ!\n\nΤα τελευταία 33 χρόνια, το βασίλειό μας έχει ακμάσει με τη νέα μας μαγική τεχνολογία. Έχουμε μάθει πώς να καλούμε στοιχειώδη πνεύματα και να τα υποτάσσουμε στη θέλησή μας, αλλά τώρα οι περαιτέρω πειραματισμοί είναι «πολύ επικίνδυνοι».\n\nΞέρω τι πραγματικά συμβαίνει. Η απόρριψη των θεωριών μου δεν έχει καμία σχέση με την αξία τους και έχει να κάνει με το άτομο που τις προτείνει. Πιθανότατα όλοι γελούν μαζί μου πίσω από την πλάτη μου.\n\nΛοιπόν, όχι πια! Δεν με νοιάζει τι λένε, θα εξερευνήσω τα πιο μακρινά σημεία του σύμπαντός μας μόνος μου και θα κρατήσω όλα όσα ανακαλύπτω για τον εαυτό μου!\n- R.
journal.document.halls_king.rejection.title=Απόρριψη
journal.document.halls_king.ritual.body=Ο Θίμορ με αντιμετώπισε δημόσια νωρίτερα σήμερα και επέμεινε να εξηγήσω τη νέα μου πηγή δύναμης. Τον απέρριψα όσο καλύτερα μπορούσα, αλλά νιώθω τα επικριτικά μάτια της υπόλοιπης αυλής πάνω μου για άλλη μια φορά. \n\n Ήλπιζα να περάσω λίγο περισσότερο χρόνο απολαμβάνοντας την ηρεμία πριν από την καταιγίδα, αλλά δεν έχει και τόση σημασία. Έχω αποφασίσει τι θέλω να κάνω. Θα ισχυριστώ ότι απέκτησα τη δύναμή μου μέσω μιας νέας τελετουργίας και θα προσφερθώ να την εκτελέσω στους άλλους μάγους και στον Βασιλιά. Μόλις τελειώσει η τελετουργία, θα είμαι βασιλιάς! \n\nΟ Θίμορ θα διαμαρτυρηθεί, φυσικά, αλλά με τόση δύναμη που μου προσφέρεται αμφιβάλλω αν θα τον ακούσουν! \n\n ΟΛΟΙ ΘΑ ΥΠΟΚΛΙΣΟΥΝ ΜΠΡΟΣΤΑ ΜΟΥ! \n- Μελλοντικός Βασιλιάς των Νάνων
journal.document.halls_king.ritual.title=Το Τελετουργικό
journal.document.halls_king.thing.body=Υπάρχει ένα πρόβλημα. Ο Θίμορ εξοντώθηκε χωρίς προσπάθεια, αλλά φαίνεται ότι η έρευνά μου στα εξωτερικά επίπεδα δεν πέρασε απαρατήρητη. \n\nΚάποιο... «πράγμα»... έχει ελκυστεί από τον κόσμο μου και αρχίζει να αναγκάζεται να περάσει από το κάτω μέρος των κάτω αιθουσών. Για να περιπλέξει ακόμα περισσότερο τα πράγματα, αυτή είναι η ακριβής τοποθεσία όπου αποθήκευσα το φυλαχτό! Ένα τόσο κακόβουλο πλάσμα, γιατί πρέπει να προσπαθεί να μου αρνηθεί τη δύναμή μου όταν υπάρχουν ακόμα πολλά εκεί έξω να κατακτήσω; \n\nΠαρά τη δύναμή μου όμως, δεν νομίζω ότι μπορώ απλώς να ορμήσω και να το πολεμήσω. Η πραγματική του δύναμη είναι ακατανόητη, αλλά πρέπει να υπάρχει κάποιος τρόπος να την περιορίσω. ΘΑ ΥΠΕΡΑΣΠΙΣΩ ΤΟ ΒΡΑΒΕΙΟ ΜΟΥ!
journal.document.halls_king.thing.title=Το Πράγμα
journal.document.halls_king.title=Ημερολόγιο του ???
journal.document.intros.caves.body=Αυτές οι αραιοκατοικημένες σπηλιές εκτείνονται κάτω από την εγκαταλελειμμένη φυλακή. Πλούσιες σε ορυκτά, κάποτε ήταν κέντρο ακμάζοντος εμπορίου και βιομηχανίας για την κοινωνία των νάνων από κάτω, αλλά εγκαταλείφθηκαν καθώς οι νάνοι απέκτησαν εμμονή με τη σκοτεινή μαγεία. \n\nΟι σπηλιές τώρα κατοικούνται κυρίως από υπόγεια άγρια ζωή, gnolls και εγκαταλελειμμένα μηχανήματα. Πιθανότατα έχουν καταστραφεί από την ίδια δύναμη που έχει επηρεάσει τις περιοχές από πάνω.
journal.document.intros.caves.title=Σπήλαια
journal.document.intros.city.body=Η Μητρόπολη των Νάνων ήταν κάποτε η σπουδαιότερη από όλες τις πόλεις-κράτη των νάνων. Στην ακμή της, οι νάνοι κατασκεύασαν θαυματουργές μηχανές από μέταλλο και μαγεία που επέτρεψαν στην πόλη τους να επεκταθεί ραγδαία. \n\nΈπειτα, μια μέρα, οι πύλες της πόλης κλείστηκαν και κανείς δεν άκουσε ξανά νέα των νάνων. Οι λίγοι που δραπέτευσαν από την πόλη καθώς έκλεινε, διηγήθηκαν ιστορίες για έναν τρελό μάγο που έκλεψε τον θρόνο και την τρομερή μαγεία που είχε μάθει να αξιοποιεί.
journal.document.intros.city.title=Μητρόπολη Νάνων
journal.document.intros.discover_hint=Μπορείτε να βρείτε αυτό το κείμενο όταν εισάγετε μια συγκεκριμένη περιοχή για πρώτη φορά.
journal.document.intros.dungeon.body=Πολλοί ήρωες έχουν εισέλθει στο μπουντρούμι πριν από εσάς από την πόλη από ψηλά, για τους περισσότερους δεν έχει ξανακούσει κανείς νέα του. \n\nΛέγεται ότι ένα αρχαίο κακό παραμονεύει στα βάθη, φυλάσσοντας το παντοδύναμο φυλαχτό του Γιέντορ. Ακόμα και τώρα η σκοτεινή ενέργεια ακτινοβολεί από κάτω, ανεβαίνοντας στην πόλη. \n\nΘα κατακτήσετε το μπουντρούμι και θα διεκδικήσετε το φυλαχτό; Ήρθε η ώρα να ξεκινήσετε τη δική σας περιπέτεια!
journal.document.intros.dungeon.title=Μπούρδα
journal.document.intros.halls.body=Αυτές οι βαθιές αίθουσες της Μητρόπολης των Νάνων έχουν παραμορφωθεί από τη σκοτεινή μαγεία. Στο παρελθόν, αυτές οι περιοχές φιλοξένησαν την αυλή των επίλεκτων μάγων του Βασιλιά των Νάνων, αλλά τώρα φαίνεται να έχουν καταληφθεί από κάτι ακόμα πιο δυσοίωνο... \n\n Κάθε είδους φρικτά δαιμονικά πλάσματα κατοικούν σε αυτές τις αίθουσες, καθοδηγούμενα από κάποια τρομερή σκοτεινή δύναμη. Αν ο Βασιλιάς των Νάνων δεν ήταν η πηγή της εξαπλούμενης διαφθοράς, τότε ό,τι υπάρχει εδώ κάτω πρέπει να είναι. \n\nΠροχωρήστε προσεκτικά, πολύ λίγοι τυχοδιώκτες έχουν κατέβει ποτέ τόσο μακριά...
journal.document.intros.halls.discover_hint=Μπορείτε να βρείτε αυτό το κείμενο σε μια συγκεκριμένη περιοχή, αλλά μόνο αφού βρείτε όλα τα προηγούμενα κείμενα σε αυτό το σύνολο.
journal.document.intros.halls.title=Αίθουσες Δαιμόνων
journal.document.intros.prison.body=Πριν από πολλά χρόνια χτίστηκε εδώ μια φυλακή για να στεγάσει επικίνδυνους εγκληματίες. Αυστηρά οργανωμένη και ασφαλής, κατάδικοι από όλη τη χώρα μεταφέρονταν εδώ για να εκτίσουν την ποινή τους.\n\nΑλλά σύντομα ένα σκοτεινό μίασμα άρχισε να σέρνεται από κάτω, διαστρεβλώνοντας τα μυαλά τόσο του φρουρού όσο και των κρατουμένων.\n\nΑντιδρώντας στο αυξανόμενο χάος, η πόλη σφράγισε ολόκληρη τη φυλακή. Κανείς δεν ξέρει τι απέγιναν όσοι έμειναν νεκροί μέσα σε αυτά τα τείχη...
journal.document.intros.prison.title=Φυλακή
journal.document.intros.sewers.body=Οι επάνω όροφοι του μπουντρουμιού αποτελούν στην πραγματικότητα το αποχετευτικό σύστημα της πόλης. \n\nA Η σκοτεινή ενέργεια έχει ανέβει από κάτω, τα συνήθως ακίνδυνα πλάσματα των υπονόμων έχουν γίνει όλο και πιο άγρια. Η πόλη αναγκάστηκε να στείλει περιπολίες φρουράς εδώ κάτω για να προσπαθήσει να διατηρήσει την ασφάλεια για όσους βρίσκονται από πάνω. \n\nΑυτό το μέρος είναι επικίνδυνο, αλλά τουλάχιστον η κακή μαγεία που λειτουργεί εδώ είναι αδύναμη.
journal.document.intros.sewers.title=Αποχετεύσεις
journal.document.intros.title=Παρουσιάσεις Περιοχής
journal.document.prison_warden.discover_hint=Μπορείτε να βρείτε αυτό το κείμενο σε μια συγκεκριμένη περιοχή, αλλά μόνο αφού βρείτε όλα τα προηγούμενα κείμενα σε αυτό το σύνολο.
journal.document.prison_warden.journal.body=1η Άνοιξης, 362\n\nΑυτή είναι η πρώτη καταχώρηση στο ημερολόγιο εργασίας της δεσμοφύλακα Κιάνα Σμιθ. Με όλα όσα συμβαίνουν τελευταία, αποφάσισα να ξεκινήσω ένα ημερολόγιο για να κρατάω τις σκέψεις μου σε τάξη.\n\nΗ διαχείριση μιας φυλακής μισό μίλι υπόγεια δεν θα ήταν ποτέ εύκολη, αλλά τελευταία φαίνεται ότι συμβαίνει κάποιο είδος οργανωμένης αναστάτωσης. Οι κρατούμενοι συμπεριφέρονται άσχημα χωρίς λόγο και μετά αρνούνται να εξηγήσουν το γιατί.\n\nΜερικοί από τους φρουρούς αρχίζουν να λένε ότι το μέρος είναι στοιχειωμένο. Δεν μπορώ να αφήσω τους δικούς μου ανθρώπους να διαδίδουν φήμες, αλλά δεν μπορώ ακριβώς να τους κατηγορήσω που είναι άβολα.\n- Σμιθ
journal.document.prison_warden.journal.title=Κρατώντας ένα ημερολόγιο
journal.document.prison_warden.letter.body=Τόμας, \n\n Ήσουν πολύ καλός φίλος, οπότε σου κάνω μια χάρη. \n\n Όταν ξεκινήσεις τη βάρδιά σου απόψε, κλείδωσε και ενίσχυσε το κελί του Τένγκου, πέτα το κλειδί σε κάποια εσοχή και φύγε. Δεν έχει σημασία αν οι άλλοι κρατούμενοι είναι αφύλακτοι, σύντομα κανείς δεν θα μπορεί να φύγει από αυτό το μέρος. Αυτός ο φρικιό πρέπει να μείνει ασφαλισμένος, αν δραπετεύσει δεν ξέρεις τι θα κάνει. \n\n Μην πεις σε κανέναν γι' αυτό, και μην μπεις στον κόπο να με ψάξεις. Ένας καπετάνιος πρέπει να βυθιστεί με το πλοίο της. \n- Κιάνα
journal.document.prison_warden.letter.title=Επιστολή προς τον Θωμά
journal.document.prison_warden.mines.body=54η Χειμώνα, 363\n\nA Μια ομάδα μηχανικών από την πόλη ήρθε σήμερα, λέγοντας ότι είναι εδώ για να σφραγίσουν την παλιά είσοδο των ορυχείων από κάτω. Υποθέτω ότι η πόλη δεν θέλει να ασχοληθεί άλλο με τη συντήρηση του περάσματος. Δεν είχα ενημερωθεί εκ των προτέρων, όπως συνήθως.\n\nΟ επικεφαλής μηχανικός τους μου είπε επίσης κάποιες ανοησίες για τη μαγεία των νάνων που διαρρέει από τα ορυχεία. Δεν πιστεύω λέξη από αυτά.\n\nΗ κατάσταση ελέγχεται πολύ καλύτερα με το νέο μας προσωπικό, αλλά η ρίζα του προβλήματος δεν έχει ακόμη αντιμετωπιστεί. Κάτι σίγουρα επηρεάζει τους κρατούμενους εδώ, και το να γκρεμίσουμε μερικούς τοίχους δεν πρόκειται να το αλλάξει αυτό.\n- Smith
journal.document.prison_warden.mines.title=Σφράγιση των Ορυχείων
journal.document.prison_warden.no_support.body=11η Άνοιξης, 364\n\nΤι στο καλό σκέφτεται η πόλη; Αφού ζήτησα επειγόντως βοήθεια, δεν άκουσα τίποτα, ούτε καν μια κενή συγγνώμη όπως συνήθως στέλνουν όταν τα αιτήματά μου απορρίπτονται.\n\nΕν τω μεταξύ, οι κρατούμενοι συνεχίζουν να χειροτερεύουν, και μερικοί από τους φρουρούς έχουν αρχίσει ακόμη και να προκαλούν προβλήματα. Σκοπεύουν να αφήσουν αυτό να χειροτερέψει μέχρι να αντιμετωπίσουμε μια ταραχή!;\n\nΟ Thomas παρέμεινε αξιόπιστος όπως πάντα τουλάχιστον. Η οργανωτική του βοήθεια ήταν ανεκτίμητη, και η ιδέα του να ενεργοποιήσει αυτές τις παλιές μονάδες DM-100 ήταν θλιβερή αλλά απαραίτητη. Είμαι βέβαιος ότι μπορώ να ξεπεράσω ξανά αυτή την κατάσταση, χρειάζομαι μόνο λίγη καταραμένη υποστήριξη!\n-Smith
journal.document.prison_warden.no_support.title=Δεν υπάρχει υποστήριξη
journal.document.prison_warden.recruits.body=80ή Άνοιξη, 362\n\n Όπως είχε υποσχεθεί, σήμερα έφτασαν αρκετοί νέοι υπάλληλοι. Φαίνεται σαν το συνηθισμένο, μερικοί πολλά υποσχόμενοι και πολλοί γκρινιάρηδες που θέλουν απλώς την αμοιβή. Παρόλα αυτά, το να έχεις όλη αυτή τη νέα δύναμη θα πρέπει να βοηθήσει πολύ με τους πρόσφατους άτακτους συγκρατούμενούς μας.\n\nΣε μια δουλειά σαν κι αυτή είναι σημαντικό να ξέρεις ποιον μπορείς να εμπιστευτείς. Ένας νέος υπάλληλος, ο Thomas, φαίνεται ιδιαίτερα πολλά υποσχόμενος. Χρειάζομαι όλη τη βοήθεια που μπορώ να λάβω αυτή τη στιγμή, οπότε αν τα πάει καλά θα κοιτάξω να τον προάγω γρήγορα.\n- Smith
journal.document.prison_warden.recruits.title=Νεοσύλλεκτοι
journal.document.prison_warden.rotberry.body=23 Φθινοπώρου, 363\n\nΈλαβα ένα υπέροχο δώρο από τον Φέλιξ σήμερα. Είναι ένα είδος φωτεινού κόκκινου θάμνου που ονομάζεται «Rotberry».\n\nΈχω αναφέρει πόσο μουντό είναι αυτό το μέρος για αυτόν στο παρελθόν, φαίνεται ότι με άκουγε. Σύμφωνα με αυτόν, αυτό το φυτό στην πραγματικότητα αντιπαθεί το φως και το νερό, οπότε πρέπει να κλαδεύω τα φύλλα μία φορά το μήνα περίπου. Το κλάδεμά του πρέπει να είναι σημαντικό, το ανέφερε δώδεκα φορές στην επιστολή του.\n\nΦυσικά, ο Φέλιξ δεν κάνει ποτέ τίποτα δωρεάν. Λέει ότι οι σπόροι που παράγει αυτό το πράγμα είναι εξαιρετικοί για να φτιάξεις ραβδιά, οπότε φυσικά του χρωστάω μερικούς κάθε φορά που το φυτό παράγει μερικούς.\n- Smith
journal.document.prison_warden.rotberry.title=Φυτό Rotberry
journal.document.prison_warden.title=Ημερολόγιο του Φύλακα
journal.document.sewers_guard.crabs.body=11η Χειμώνα, 376\nΑγαπητοί μαμά και μπαμπά,\n\nΑ. Σαν να μην ήταν αρκετά κακοί οι αρουραίοι, πιο βαθιά υπάρχουν γιγάντια καβούρια! Ένας από αυτούς όρμησε ακριβώς δίπλα μου και χτύπησε τον Λι αρκετά άσχημα πριν τον σκοτώσουμε. Ο Τόμας λέει ότι δεν φταίω εγώ, αλλά ξέρω ότι απλώς προσπαθεί να είναι καλός μαζί μου.\n\nΕυτυχώς, φεύγοντας συναντήσαμε έναν τυχοδιώκτη που είχε λίγο επιπλέον βάλσαμο για ηλιαχτίδα. Ο Λι μπορεί να μην τα είχε καταφέρει χωρίς αυτό.\n\nΕίδα τον τυχοδιώκτη να κοιτάζει ένα τριαντάφυλλο πριν φύγει, είπε ότι ήταν δώρο. Γιατί να ρισκάρουν τη ζωή τους εδώ κάτω αν κάποιος νοιάζεται τόσο πολύ για αυτούς;\n\nΑυτό ακριβώς κάνω, έτσι δεν είναι; Νιώθω ότι έχω ξεπεράσει τα όρια μου.
journal.document.sewers_guard.crabs.title=Γιγαντιαία καβούρια!
journal.document.sewers_guard.dangerous.body=88η Φθινοπώρου, 375\nΑγαπητοί μαμά και μπαμπά,\n\nΚαταλαβαίνω γιατί ο μισθός είναι τόσο καλός τώρα, οι υπόνομοι είναι γεμάτοι τέρατα! Τα «παράσιτα» και οι «παράνομοι» είναι γιγάντιοι αιμοδιψείς αρουραίοι και αγέλες θυμωμένων gnolls.\n\nΕυτυχώς, η υπόλοιπη ομάδα μου ξέρει πραγματικά τι κάνει. Ο αρχηγός της ομάδας μας, ο Thomas, είναι ειδικός σε αυτό. Προσπαθώ να μάθω γρήγορα ώστε να μην είμαι πολύ βάρος.\n\nΑυτή η δουλειά είναι πολύ πιο επικίνδυνη από ό,τι νόμιζα. Χαίρομαι που δεν μπορώ να τα στείλω τώρα, δεν θέλω να ανησυχείς.\n\nΘα φυλάξω,\n- Sonya
journal.document.sewers_guard.dangerous.title=Μια επικίνδυνη θέση...
journal.document.sewers_guard.discover_hint=Μπορείτε να βρείτε αυτό το κείμενο σε μια συγκεκριμένη περιοχή, αλλά μόνο αφού βρείτε όλα τα προηγούμενα κείμενα σε αυτό το σύνολο.
journal.document.sewers_guard.guild.body=23η Χειμώνα, 376\nΑγαπητοί μαμά και μπαμπά,\n\nΔεν υπάρχουν νέα τέρατα αυτή τη φορά, αντίθετα συναντήσαμε μια μικρή ομάδα από τη συντεχνία των κλεφτών ενώ κάναμε περιπολία.\n\nΌλα όσα έχω ακούσει για τη συντεχνία είναι άσχημα, αλλά η υπόλοιπη ομάδα μου φάνηκε σχεδόν φιλική μαζί τους. Ο Τόμας αντάλλαξε πληροφορίες και προμήθειες με έναν από αυτούς πριν χωρίσουμε οι δρόμοι μας.\n\nΔεν καταλαβαίνω, δεν υποτίθεται ότι έπρεπε να ξεφορτωθούμε τους παράνομους; Ο Τόμας είπε ακόμη και να μην το αναφέρουν αυτό σε κανέναν από τους διοικητές. Οι πληροφορίες και οι προμήθειές τους ήταν πολύ χρήσιμες όμως, και δεν μπορούσαμε να αντέξουμε ακόμη περισσότερες μάχες.\n\nΥποθέτω ότι είμαστε όλοι μαζί σε αυτό εδώ κάτω.
journal.document.sewers_guard.guild.title=Η Συντεχνία των Κλεφτών
journal.document.sewers_guard.lost.body=40ή Χειμώνα, 376\n\nΟ Τόμας και εγώ είμαστε χαμένοι. Μας έδιωξαν από την υπόλοιπη ομάδα ενώ πολεμούσαμε με κάτι gnolls. Κανένας μας δεν είναι τραυματισμένος, αλλά οι κάτω υπόνομοι είναι σαν λαβύρινθος.\n\nΟ Τόμας λέει ότι ξέρει μια διαδρομή εξόδου, αλλά ξεκινά από την παλιά είσοδο της φυλακής στο κάτω μέρος των υπονόμων. Δεν μου αρέσει να πηγαίνω πιο βαθιά, αλλά δεν έχουμε μερίδες τροφής και η κατάβαση είναι πολύ πιο γρήγορη από το να περιπλανιόμαστε ψάχνοντας για τη διαδρομή περιπολίας μας.\n\nΘα είναι εντάξει. Ο Τόμας ξέρει τι κάνει.
journal.document.sewers_guard.lost.title=Είμαστε χαμένοι
journal.document.sewers_guard.new_position.body=85η Φθινοπώρου, 375\nΑγαπητοί μαμά και μπαμπά,\n\nΣας είπα ότι όλη η σκληρή δουλειά στην φρουρά της πόλης θα απέδιδε καρπούς. Μόλις πήρα προαγωγή!\n\nΜε κάλεσαν να ενταχθώ σε μια εξειδικευμένη ομάδα που εργάζεται στους υπονόμους. Προφανώς υπάρχουν προβλήματα με παράσιτα και παράνομους εκεί κάτω, και είναι δουλειά μας να τους καθαρίζουμε. Είναι βρώμικη δουλειά, αλλά οι υπονόμοι είναι ζεστοί τον χειμώνα και πληρώνουν τρεις φορές περισσότερο από την κανονική υπηρεσία φρουράς!\n\nΕίναι όμως λίγο μυστικοπαθές, οπότε δεν μπορώ να στείλω αυτό το γράμμα. Μου φαίνεται περίεργο που δεν σας γράφω, οπότε θα συνεχίσω να σας τα γράφω ούτως ή άλλως. Ίσως μπορέσω να σας τα δείξω μια μέρα.\n\nΚαλύτερα,\n- Σόνια
journal.document.sewers_guard.new_position.title=Η Νέα μου Θέση!
journal.document.sewers_guard.not_worth.body=Ο Τόμας κι εγώ συναντήσαμε ένα τεράστιο τέρας από λάσπη στην είσοδο της φυλακής. Πριν προλάβουμε να αντιδράσουμε, μας εξαπέλυσε μαγεία. Ο Τόμας το πήρε το μεγαλύτερο μέρος του. Έχει φύγει. \n\n Κανένα χρηματικό ποσό δεν αξίζει αυτό. Θα φύγω από τη διαδρομή που μου είπε ο Τόμας. Μετά θα πάρω ό,τι έχω κερδίσει ως φρουρός και θα τα χρησιμοποιήσω για να μετακινήσω εμένα και τους γονείς μου μακριά από αυτή την καταραμένη πόλη. Ένα μέρος του εαυτού μου θέλει να ελπίζει ότι ο Βασιλιάς έχει κάποιο σχέδιο για όλα αυτά, αλλά το αμφιβάλλω. \n\n Αφήνω αυτά τα γράμματα πίσω ως προειδοποίηση προς τους άλλους. Είναι κάτι περισσότερο από γιγάντιοι αρουραίοι και καβούρια, κάτι πάει πολύ στραβά εδώ κάτω.
journal.document.sewers_guard.not_worth.title=Δεν αξίζει τον κόπο
