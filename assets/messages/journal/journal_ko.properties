journal.document.adventurers_guide.alchemy.body=소모품이 쓸모없다고 생각되면 연금술 재료로 사용하거나 다용도 연금술 에너지로 바꿀 수 있습니다. 활력 물약과 두루마리에도 이러한 아이템이 표시됩니다! 장신구는 연금술을 사용하여 제작하고 강화할 수 있는 특별한 장비입니다. 마법 장신구 촉매와 약간의 연금술 에너지로 만들어집니다. (첫 번째 연금술 솥은 던전 3층 또는 4층에 있습니다. 이 솥 근처에는 연금술 레시피 책 페이지도 있습니다.)
journal.document.adventurers_guide.alchemy.title=연금술과 장신구
journal.document.adventurers_guide.dieing.body=던전 탐험은 위험하며 대부분의 모험가들은 결국 죽음을 맞이합니다. 운도 중요하지만, 최고의 모험가들은 성공 확률을 높이기 위해 온갖 비법을 동원합니다. (자주 죽더라도 낙심하지 마세요. 이 게임은 원래 어렵습니다! 당장 이기려고 애쓰기보다는 게임을 배우고 꾸준히 실력을 향상시키는 데 집중하세요.)
journal.document.adventurers_guide.dieing.title=패배를 다루는 법
journal.document.adventurers_guide.examining.body=섣불리 돌진하기보다는 적과 주변 환경을 꼼꼼히 살피는 것이 중요합니다! 새로운 것은 무엇이든 살펴보는 습관을 들이세요. (돋보기 버튼을 눌러 자세히 살펴볼 대상을 선택할 수 있습니다. 버프나 디버프는 해당 아이콘을 선택하여 확인할 수도 있습니다.)
journal.document.adventurers_guide.examining.title=검토 중
journal.document.adventurers_guide.food.body=식량을 효율적으로 배급하는 것은 생존 확률을 높이는 가장 좋은 방법 중 하나입니다. 배가 고플 때마다 바로 먹을 필요는 없어요! 배가 고프지 않을 때는 체력이 천천히 회복되므로, 체력이 가득 찬 상태에서 음식을 먹으면 그 회복력이 낭비됩니다! 체력 상태에 맞춰 식사 시간을 조절하면 식량을 훨씬 오래 사용할 수 있습니다.
journal.document.adventurers_guide.food.title=굶주림 문제 해결
journal.document.adventurers_guide.identifying.body=던전마다 물약 색깔과 두루마리에 있는 기호가 다릅니다. 미확인 장비는 운이 좋으면 강화하거나 마법을 부여할 수 있지만, 저주받았을 수도 있습니다! 감정, 강화, 저주 해제 두루마리는 미확인 장비 사용의 위험을 줄이는 데 매우 유용합니다. (감정한 모든 아이템 목록은 일지 카탈로그 탭에서 확인할 수 있습니다.)
journal.document.adventurers_guide.identifying.title=항목 식별
journal.document.adventurers_guide.intro.body=모험가 여러분, 안녕하세요! 지금 여러분은 던전 마스터리 가이드북을 읽고 계십니다! 이 가이드북은 참고 자료로 활용하시는 것이 가장 좋으며, 각 페이지를 읽기에 가장 적절한 시기를 마법처럼 알려드립니다. (저널 버튼이 깜빡이면 선택하여 가이드북의 내용을 읽어보세요! 몇몇 페이지는 빠져 있지만, 던전에서 찾을 수 있을지도 모릅니다.)
journal.document.adventurers_guide.intro.title=소개
journal.document.adventurers_guide.levelling.body=레벨업을 하면 능력치가 향상되고 특성 포인트를 획득할 수 있는데, 이는 전투에서 큰 차이를 만들어낼 수 있습니다. 던전의 각 층마다 최소 한 레벨씩은 올려두는 것이 좋습니다. 탐험이나 전투를 건너뛰고 서둘러 진행하고 싶은 유혹이 들겠지만, 그렇게 하면 보급품과 경험치를 놓치게 됩니다. (게임 화면 모서리에 있는 상태창에서 경험치를 포함한 영웅 정보를 확인할 수 있습니다. 영웅 초상화를 선택하면 더 자세한 정보를 볼 수 있습니다.)
journal.document.adventurers_guide.levelling.title=경험 쌓기
journal.document.adventurers_guide.looting.body=잠긴 문 뒤에 있거나 장애물이 있는 방에는 보통 더 좋은 전리품이 있습니다. 장애물이 길을 막고 있다면, 같은 층에서 도움이 될 만한 아이템을 찾을 수 있습니다. (각 5층 던전 지역에서는 항상 힘의 물약 2개와 업그레이드 두루마리 3개를 찾을 수 있으므로, 이는 탐험을 얼마나 잘하고 있는지 보여주는 좋은 지표입니다.) (저널 창의 메모 탭에서 랜드마크와 사용하지 않은 열쇠 목록을 확인할 수 있습니다.)
journal.document.adventurers_guide.looting.title=효과적인 약탈
journal.document.adventurers_guide.magic.body=마법 공격은 갑옷을 뚫고 들어가며 피하기 어렵습니다. 따라서 마법 지팡이 공격은 매우 효과적이지만, 마법을 사용하는 적들은 매우 위험합니다! 하지만 마법 공격에는 항상 단점이 있습니다. 마법 지팡이는 사용 횟수가 제한되어 있고, 마법을 사용하는 적들은 보통 근거리에서 마법을 사용할 수 없습니다. 마법을 사용하는 적을 상대할 때는 그들이 나에게 마법을 사용하지 못하도록 막는 방법을 배우는 것이 중요합니다.
journal.document.adventurers_guide.magic.title=마법 공격
journal.document.adventurers_guide.positioning.body=전략은 장비만큼이나 중요합니다. 포위당하는 것과 같은 불리한 상황은 좋은 위치 선정으로 대부분 피할 수 있습니다. 예를 들어, 대부분의 던전은 좁은 복도로 이루어져 있어 적들이 한 번에 한 명씩만 공격해 옵니다. 이러한 복도에는 기습 공격을 위한 출입구도 종종 있습니다! 또한 풀, 물, 구덩이, 함정과 같은 주변 환경을 유리하게 활용할 수 있는 다양한 방법들이 있습니다.
journal.document.adventurers_guide.positioning.title=위치
journal.document.adventurers_guide.searching.body=던전에는 처음에는 보이지 않는 비밀 문과 함정이 가득합니다. 근처에 문이나 함정이 숨겨져 있을 것 같으면 시간을 들여 꼼꼼히 찾아보세요. (돋보기 버튼을 두 번 사용하면 주변의 모든 타일을 살펴볼 수 있습니다. 어쩌면 이 페이지를 찾은 곳 근처에 숨겨진 문이 있을지도 몰라요!)
journal.document.adventurers_guide.searching.title=수색
journal.document.adventurers_guide.strength.body=던전에서 얻은 무기와 갑옷을 연습할 시간은 없으니, 효과적으로 사용하려면 엄청난 힘이 필요합니다. 힘의 물약과 강화 주문서는 상위 등급 장비의 요구 조건을 충족하는 가장 효과적인 방법입니다. 궁극적으로는 상위 등급 아이템을 사용하는 것이 중요하지만, 지금 당장 사용할 수 있는 장비도 소홀히 하지 마세요.
journal.document.adventurers_guide.strength.title=힘
journal.document.adventurers_guide.surprise_attacks.body=기습 공격은 명중률이 매우 높아 뱀이나 유령처럼 회피 능력이 뛰어난 적에게 특히 효과적입니다. 적이 추격하다가 문으로 들어서는 순간이나 시야에서 사라졌을 때 기습 공격을 가할 수 있습니다.
journal.document.adventurers_guide.surprise_attacks.title=기습 공격
journal.document.adventurers_guide.title=던전 마스터리의 서
journal.document.adventurers_guide.upgrades.body=던전 깊숙이 들어갈수록 마법으로 강화된 고급 장비를 사용하는 것이 더욱 중요해지지만, 그 장비를 제대로 활용하려면 힘 능력치도 필요합니다. 지팡이, 반지, 유물은 힘 능력치가 필요하지 않지만 사용 횟수가 제한적이거나 전투에 직접적인 도움을 주지는 않습니다. 던전 초반 생존과 후반 진행을 위해서는 어떤 장비를 강화할지 현명하게 선택하는 것이 매우 중요합니다.
journal.document.adventurers_guide.upgrades.title=업그레이드
journal.document.alchemy_guide.bombs.body=일반적인 흑색 화약 폭탄은 특정 재료와 혼합하여 강화 폭탄을 만들 수 있습니다.
journal.document.alchemy_guide.bombs.title=강화 폭탄
journal.document.alchemy_guide.brews_elixirs.body=물약과 비약은 다양한 효과를 지닌 고급 포션으로, 대개 한 번만 사용할 수 있습니다.
journal.document.alchemy_guide.brews_elixirs.title=술과 영약
journal.document.alchemy_guide.energy_food.body=많은 레시피에는 연금술 솥에서 소모품을 분해하여 만드는 수정 연금술 에너지가 필요합니다. 에너지 물약이나 두루마리에도 이러한 에너지가 포함되어 있습니다. 에너지를 필요로 하는 레시피 중 일부는 마법적인 것이지만, 이러한 레시피들은 전통적인 요리와 유사합니다.
journal.document.alchemy_guide.energy_food.title=에너지와 식품
journal.document.alchemy_guide.exotic_potions.body=물약은 에너지와 혼합하여 이색적인 물약을 만들 수 있습니다. 이러한 물약은 더욱 강력한 효과를 지니지만, 종종 다른 방식으로 유용하게 사용됩니다.
journal.document.alchemy_guide.exotic_potions.title=이국적인 물약
journal.document.alchemy_guide.exotic_scrolls.body=이국적인 주문서는 약간의 에너지와 주문서를 사용하여 만들 수 있습니다. 이국적인 물약보다 약간 더 강력하고 가격도 더 비쌉니다.
journal.document.alchemy_guide.exotic_scrolls.title=이국적인 두루마리
journal.document.alchemy_guide.potions.body=연금술의 실용화에 오신 것을 환영합니다! 이 책은 연금술 솥에서 아이템을 제작하는 레시피를 모아놓은 참고서입니다. 가장 대표적인 레시피인 물약부터 시작해 볼까요? 씨앗 세 개를 사용하여 무작위 물약을 만들어 보세요! 각 씨앗에는 해당하는 물약이 있으며, 같은 씨앗을 여러 개 사용하면 해당 씨앗과 관련된 물약이 만들어질 확률이 높아집니다.
journal.document.alchemy_guide.potions.title=소개 및 마법약
journal.document.alchemy_guide.spells.body=마법은 수정에 담겨 있으며, 다양한 효과를 제공하고 보통 여러 번 사용할 수 있습니다.
journal.document.alchemy_guide.spells.title=주문
journal.document.alchemy_guide.stones.body=연금술 솥에 두루마리를 넣으면 솥 안의 두 개의 돌에 마법이 스며듭니다. 이렇게 해서 룬석이 만들어지고 두루마리의 정체가 드러납니다!
journal.document.alchemy_guide.stones.title=룬스톤 만들기
journal.document.alchemy_guide.title=연금술 가이드
journal.document.alchemy_guide.weapons.body=가볍거나 마법적인 무기 중 일부는 연금술에 사용할 수 있습니다! 투척 무기 세트 하나당 동일한 레벨과 등급의 다른 세트를 완전히 수리할 수 있을 만큼의 액체 금속이 생성됩니다. 세트를 연금술로 수리하면 모든 구성품이 없더라도 세트 전체가 파괴된다는 점에 유의하세요! 지팡이 하나당 동일한 레벨의 지팡이 두 개를 +3까지 강화할 수 있을 만큼의 마법 수지가 생성됩니다.
journal.document.alchemy_guide.weapons.title=무기 강화
journal.document.caves_explorer.alive.body=308년 여름 23일, 드워프 기계 중 하나가 어찌 된 일인지 살아 움직이기 시작했어! 우리가 그냥 지나가던 참이었는데, 갑자기 돌진해서 거대한 금속 주먹으로 우리 일행 두 명을 거의 깔아뭉갤 뻔했지. 다행히 내가 분해의 지팡이를 가지고 있어서 몇 번 정확하게 쏴서 그 짐승 같은 기계를 고철 덩어리로 만들어 버렸어. 걱정되는 건 우리가 그 기계를 자극할 만한 행동을 전혀 하지 않았다는 거야. 드워프들이 이렇게 공격적으로 기계를 설계했을 리가 없어. 마치 우리를 매복 공격하려는 것 같았어! 그래도 이번에는 동료들을 도울 수 있어서 다행이야. - 아치볼드
journal.document.caves_explorer.alive.title=살아있어!
journal.document.caves_explorer.city.body=308년 여름 21일, 3주 차에 접어들었습니다. 지난 열흘 동안 점점 더 깊은 곳으로 탐사를 진행한 끝에 마침내 광산 바닥에 도착했습니다. 그곳에서 여러 가지 금속 장치와 옛 드워프 도시로 들어가는 입구를 막고 있는 거대한 문을 발견했습니다. 대장장이는 이 기계 장치에 대해 경고했습니다. 지역 방어용으로 만들어진 것으로 보이며, 건드리면 작동하는 경향이 있다고 했습니다. 우리는 도시에 들어갈 이유도 없고, 금속은 고철값도 거의 되지 않을 테니 그의 경고를 따르고 다시 나가는 것이 최선이라고 생각했습니다. 솔직히 호기심은 생겼지만, 그곳을 조사하는 것은 위험을 감수할 가치가 없다고 판단했습니다. - 아치볼드
journal.document.caves_explorer.city.title=도시 입구
journal.document.caves_explorer.discover_hint=이 텍스트는 특정 지역에서 찾을 수 있지만, 이 세트에 있는 이전 텍스트들을 모두 찾은 후에만 가능합니다.
journal.document.caves_explorer.expedition.body=서기 308년 여름 1일, 오늘부터 4주간 드워프의 버려진 광산으로 탐험을 떠납니다! 저는 국왕 폐하의 명을 받아 이 지역을 탐사하게 되었습니다. 제 주요 목표는 미개발 천연자원을 찾아내고, 동굴을 조사하여 감옥 건설 프로젝트에 적합한 부지를 찾는 것입니다. 저는 스스로를 방어할 능력이 있지만, 국왕 폐하의 요청으로 도시 경비대의 호위를 받기로 했습니다. 그들은 좀 멍청하지만, 제 진행을 방해하지 않는 한 그들의 존재는 견딜 만합니다. 저녁까지 하수도를 정리하고 광산에 도착해야 합니다. - 아치볼드 드러먼드. 대마법사, 남부 마법사 대학.
journal.document.caves_explorer.expedition.title=탐험 시작!
journal.document.caves_explorer.gold.body=서기 308년 여름 4일, 12월 4일. 처음 며칠은 정말 보람찼습니다! 베이스캠프를 설치한 후, 버려진 광산의 위쪽 지역들을 탐험하러 나섰습니다. 드워프들이 남긴 쓸모없는 잡동사니도 많지만, 동굴 벽에는 금이 가득했습니다! 하지만 불행히도 우리가 처음 온 건 아니었습니다. 동굴에는 공격적인 야생 동물들이 우글거리고, 놀 무리들도 금에 관심을 보이는 것 같습니다. 호위병들에게 너무 가혹하게 대한 것 같기도 합니다. 예상보다 훨씬 유능한 탐험가이자 경호원이었습니다. 이렇게 큰 성과를 거두었지만, 아직 탐험해야 할 광산이 많이 남아 있습니다. - 아치볼드
journal.document.caves_explorer.gold.title=금이 정말 많네요!
journal.document.caves_explorer.report.body=308년 여름 28일, 오늘은 짐을 마저 싸고 떠날 준비를 할 겁니다. 마침 우리 일행 중 몇몇이 그 난폭한 기계 사건 이후로 끔찍한 악몽에 시달리기 시작했는데, 마침 좋은 타이밍이네요. 아마 피로 때문일 수도 있겠지만, 악몽 내용이 모두 비슷해서 걱정스럽습니다. 요약하자면, 광산 위쪽 지역은 상당히 안전합니다. 만약 검은 금을 활용할 수 있는 방법을 찾을 수 있다면 채굴은 꽤 수익성이 좋을 겁니다. 넓은 공터는 도시 건설 계획에도 아주 적합할 것입니다. 하지만 아래쪽 광산은 더 위험하니 피해야 합니다. 이 모든 내용을 며칠 안에 최종 보고서에 적겠습니다. - 아치볼드
journal.document.caves_explorer.report.title=최종 보고서
journal.document.caves_explorer.title=탐험가의 일지
journal.document.caves_explorer.troll.body=308년 여름 11일, 우리는 광산 중간 부분을 탐험하기 시작했는데, 반가운 얼굴을 만났습니다! 음... 비교적 반가운 얼굴이죠. 동굴 트롤 한 마리가 그곳에 작은 대장간을 차려놓았더군요. 그는 퉁명스럽고 말도 별로 없었지만, 약간의 금을 받고 우리 장비를 수리해 주었습니다. 하지만 안타깝게도, 그 트롤 대장장이는 이 아름다운 금이 생각만큼 귀하지 않다는 사실도 알려주었습니다. 그는 그것을 '어두운 금'이라고 부르는데, 햇빛에 노출되면 빠르게 변질된다고 합니다. 이곳의 자원을 두고 갈등이 없었던 이유가 바로 그것 때문일지도 모르겠네요. 좀 더 깊이 파고 들어가 봐야 더 가치 있는 것이 있는지 알아볼 수 있을 것 같습니다. - 아치볼드
journal.document.caves_explorer.troll.title=트롤을 만났어요
journal.document.city_warlock.discover_hint=이 텍스트는 특정 지역에서 찾을 수 있지만, 이 세트에 있는 이전 텍스트들을 모두 찾은 후에만 가능합니다.
journal.document.city_warlock.failure.body=저도 바보였던 것 같습니다. 새 왕은 신하들이 자발적으로 복종하기를 바랐지만, 이제 보니 그는 저항하는 자들까지도 통제할 수 있는 힘을 가지고 있더군요. 제가 맹목적으로 가장 강력한 반대 세력들을 그의 문앞으로 불러들여 그가 직접 그들을 노예로 만들도록 내버려 두었습니다. 이제 그의 사악한 기운이 도시를 휩쓸고 지나가며 대부분의 사람들을 순식간에 그의 추종자로 만들고 있습니다. 아직 자유 의지를 가진 소수의 사람들은 도망치고 있습니다. 저는 남아서 최대한 상황을 관찰하고 기회를 엿보기로 했습니다. 제가 가진 마법의 힘으로 당분간 숨어 안전하게 지낼 수 있을 겁니다.
journal.document.city_warlock.failure.title=실패
journal.document.city_warlock.more_powerful.body=시간 가는 줄도 모르겠지만, 마지막 일기를 쓴 지 벌써 일주일은 된 것 같습니다. 우리 문명은 완전히 붕괴했습니다. 성문은 닫혔고, 사회 기능은 모두 정지했으며, 텅 빈 드워프의 껍데기만이 복도를 배회하고 있습니다. 이 모든 와중에도, 어쩐 일인지 새 왕은 점점 더 강력해지고 있습니다. 그의 의지는 날마다 더욱 강해지고 있지만, 동시에 변하고 있기도 합니다. 뭐라고 설명해야 할지 모르겠지만, 마치 그가 더 이상 드워프가 아닌 것 같은 느낌입니다. 이제 제가 할 수 있는 최선은 이 모든 사건들을 기록하는 것뿐이라는 사실을 받아들이기 시작했습니다. 저는 할 수 있는 한 오랫동안 이곳에 머물다가, 의지가 약해지기 시작하면 물러날 것입니다.
journal.document.city_warlock.more_powerful.title=더욱 강력함
journal.document.city_warlock.new_power.body=여기서 무슨 일이 벌어지고 있는 거지? 새 왕에게서 뿜어져 나오는 힘은 처음과는 확실히 다르지만, 뭔가 이상한 점이 있다. 이 새로운 힘은 우리 도시의 가장 깊숙한 곳에서부터 뿜어져 나오는 것 같다. 더욱 당혹스러운 것은 상층부의 활동도 줄어들었다는 점이다. 그곳에서 무슨 일이 벌어지고 있는지는 모르겠지만, 새 왕의 관심은 거의 모두 그곳에 쏠려 있다. 깊은 곳으로 돌아가는 것은 위험하지만, 이 변화의 원인을 반드시 알아내야 한다. 어쩌면 새 왕에게도 약점이 있는 것일지도 모른다.
journal.document.city_warlock.new_power.title=새로운 힘
journal.document.city_warlock.old_king.body=마법 시대 33년 2월 5일입니다. 만약 지상인이 이 글을 읽고 있다면, 때는 264년 겨울 어느 때일 것입니다. 제 이름은 티모르 자히르입니다. 제가 알기로는 드워프 궁정에서 살아남은 마지막 생존자입니다. 우리 왕은 죽고, 권력에 미쳐버린 옛 동료가 그 자리를 차지했습니다. 나머지 궁정 사람들은 어리석게도 그에게 굴복했고, 그 과정에서 자유 의지를 잃었습니다. 저만이 이 사태를 예견하고 그의 의식이 완료되기 전에 도망쳤습니다. 핵심 측근들은 몰락했지만, 새 왕의 권력은 아직 모두에게 미치지 못했습니다. 저는 최대한 빨리 저항을 시작해야 합니다. 우리의 영광스러운 문명이 이 광신도에게 무너지는 것을 용납할 수 없습니다!
journal.document.city_warlock.old_king.title=왕이 죽었다
journal.document.city_warlock.resistance.body=소문이 빠르게 퍼진 것 같군. 겨우 며칠밖에 안 됐는데 벌써 옛 왕에게 충성하는 소규모 군대를 모았어. 마법에 능숙한 자는 거의 없지만, 전사 수도승들은 거의 전부 우리 편이야. 미치광이 드워프 한 명과 그의 노예 무리들을 상대하기엔 충분할 거야. 한편 새 왕은 우리 도시의 내실에 숨어 있어. 틀림없이 대부분의 힘을 소진했을 테고, 더 큰 저항에 부딪히기 전에 회복하려 하고 있겠지. 두어 시간 후에 공격을 시작할 거야. 운이 좋으면 임시 의회를 구성해서 오늘 밤 안에 우리 아름다운 도시를 안정시킬 수 있을 거야.
journal.document.city_warlock.resistance.title=저항
journal.document.city_warlock.seen_it.body=나는 아래에 무엇이 있는지 보았지만, 그것을 묘사할 수는 없다. 생각을 글로 옮기려 애쓰는 동안 내 손은 주체할 수 없이 떨린다. 왜 이런 일이 벌어지는 걸까? 새 왕이 이런 짓을 한 건가? 도무지 이해가 되지 않는다. 아마도 그의 무분별한 권력 남용이 이런 일을 불러들인 것일까? 나는 우리 문명을 구하고 싶었지만, 이제는 온 세상이 위험에 처해 있다는 것을 알게 되었다. 어찌 된 일인지, 왕은 차악이다. 더 큰 선을 위해 나 자신을 내맡길 수밖에 없다. 부디 저를 인도해 주소서, 왕이시여. 저를 도구로 삼아 요그-제와를 막아내 주소서!
journal.document.city_warlock.seen_it.title=난 그걸 봤어
journal.document.city_warlock.title=마법사의 일지
journal.document.halls_king.amulet.body=해냈어!\n\n정확히 뭘 발견하게 될지는 몰랐지만, 상상조차 못 했던 걸 발견했지. 엄청난 힘이 그냥 거기에 놓여 있었고, 그걸 전부 내 거야!\n\n이걸로 궁정의 그 어떤 바보도 감히 내게 대적하지 못할 거야. 그들을 어떻게 망신줄지 생각만 해도 흥분돼. 아니, 거기서 멈출 필요도 없지. 마음만 먹으면 그들 모두를 없애버릴 힘도 있어! 좀 과한 것 같긴 하지만, 너무 오래 고민하면 그들이 의심할 거야.\n\n이 엄청난 힘을 옌도르의 부적이라고 불러야겠어!\n- R.
journal.document.halls_king.amulet.title=부적
journal.document.halls_king.attrition.body=나는 저 괴물을 처리할 계획이 있다. 그것의 힘은 무한하지만, 이 세계를 침범하는 것은 무한하지 않다. 그것은 부적을 차지할 만큼의 힘을 축적하는 동안 하수인과 아바타들을 이용해 자신의 명령을 수행하고 있다. 비록 내가 직접 부적을 소유하고 있지는 않지만, 그 힘은 여전히 완벽하게 제어할 수 있다. 드워프 도시 전체를 내 마음대로 사용할 수 있기 때문에 수적으로도 우세하다. 계속해서 병사들을 보내 부적을 빼앗지 못하게 막고, 소모전을 통해 이 전쟁에서 승리할 수 있다! 드워프의 왕, 나 로드니는 요그-제와, 너보다 오래 살아남을 것이다!
journal.document.halls_king.attrition.title=마찰
journal.document.halls_king.discover_hint=이 텍스트는 특정 지역에서 찾을 수 있지만, 이 세트에 있는 이전 텍스트들을 모두 찾은 후에만 가능합니다.
journal.document.halls_king.new_king.body=내가 왕이다, 아하하하하! \n\n그들은 그냥 내버려 뒀어! 거의 설득도 없이 그들은 나와 함께 이 힘을 '나누는' 의식에 동의했지. 순식간에 그들은 조롱하던 합창단에서 침묵하는 신하들로 가득 찬 나의 새로운 궁정으로 변모했어! \n\n예상대로 티모르는 겁쟁이처럼 문제가 생기자마자 도망쳤지. 벌써부터 그가 저항 세력을 구축하고 있는 게 느껴져. 그가 계속하도록 내버려 둬야겠어. 그러면 그의 모든 음모자들을 내 문 앞까지 데려올 테니까! \n\n분명히 왕국도 나를 존중하지 않는군. 이것도 고쳐줘야겠어. \n- 드워프의 왕
journal.document.halls_king.new_king.title=새로운 왕
journal.document.halls_king.rejection.body=멍청이들! 지난 33년 동안 우리 왕국은 새로운 마법 기술 덕분에 번영해 왔습니다. 우리는 정령을 소환하고 마음대로 조종하는 법을 배웠지만, 어째서인지 이제 더 이상의 실험은 '너무 위험하다'고 합니다. 저는 진짜 무슨 일이 벌어지고 있는지 알고 있습니다. 제 이론이 거부된 것은 이론의 타당성과는 아무 상관이 없고, 오로지 그 이론을 제안한 사람 때문입니다. 그들은 아마 모두 제 뒤에서 저를 비웃고 있을 겁니다. 하지만 이제 더 이상은 안 돼! 그들이 뭐라고 하든 상관없어. 나는 혼자서 우주의 가장 먼 곳까지 탐험하고, 내가 발견한 모든 것을 독차지할 거야! - R.
journal.document.halls_king.rejection.title=배제
journal.document.halls_king.ritual.body=오늘 아침 티모르가 공개적으로 저에게 다가와 새로운 힘의 원천을 설명하라고 강요했습니다. 저는 최대한 그를 무시했지만, 다시 한번 궁정의 다른 이들의 날카로운 시선이 느껴집니다. 폭풍 전의 고요를 조금 더 즐기고 싶었지만, 이제 상관없습니다. 저는 제가 무엇을 할지 결정했습니다. 저는 새로운 의식을 통해 힘을 얻었다고 주장하고, 다른 마법사들과 왕에게 그 의식을 행하겠다고 제안할 것입니다. 의식이 끝나면 저는 왕이 될 것입니다! 물론 티모르가 반대하겠지만, 이 정도의 힘이 걸려 있는데 그들이 그의 말을 들을 리는 없겠죠! 모두 제 앞에 무릎을 꿇을 것입니다! - 드워프의 미래 왕
journal.document.halls_king.ritual.title=의식
journal.document.halls_king.thing.body=문제가 생겼어. 티모르는 손쉽게 처치했지만, 내가 외계 차원에서 무언가를 약탈한 게 발각된 것 같아. 어떤... '존재'가 내 세계로 끌려와 하층 복도 바닥에서 억지로 침입하려 하고 있어. 설상가상으로, 그곳은 내가 부적을 숨겨둔 바로 그곳이야! 정말 심술궂은 녀석이군. 세상에는 아직 빼앗을 게 많은데 왜 굳이 내 힘을 빼앗으려 드는 거지? 내 힘이 아무리 강해도 그냥 돌격해서 싸울 수는 없을 것 같아. 그 녀석의 진정한 힘은 헤아릴 수 없지만, 어떻게든 제한할 방법이 있을 거야. 내 보물을 지켜내겠다!
journal.document.halls_king.thing.title=더 씽
journal.document.halls_king.title=???의 일기
journal.document.intros.caves.body=인구 밀도가 낮은 이 동굴들은 버려진 감옥 아래로 뻗어 있습니다. 광물이 풍부한 이곳은 한때 아래 드워프 사회의 활발한 무역과 산업의 중심지였지만, 드워프들이 어둠의 마법에 사로잡히면서 버려졌습니다. 현재 동굴에는 주로 지하 야생 동물, 놀, 그리고 버려진 기계들이 서식하고 있으며, 아마도 지상 지역을 오염시킨 것과 같은 힘에 의해 타락했을 것입니다.
journal.document.intros.caves.title=동굴
journal.document.intros.city.body=드워프 대도시는 한때 모든 드워프 도시 국가 중 가장 위대한 도시였습니다. 전성기 시절, 드워프들은 금속과 마법으로 놀라운 기계들을 만들어 도시를 급속도로 확장했습니다. 그러던 어느 날, 도시의 성문은 닫히고 드워프들의 소식은 다시는 들리지 않았습니다. 도시가 폐쇄될 때 탈출한 소수의 드워프들은 왕좌를 찬탈한 미치광이 마법사와 그가 다룰 수 있게 된 무시무시한 마법에 대한 이야기를 전했습니다.
journal.document.intros.city.title=드워프 대도시
journal.document.intros.discover_hint=이 문구는 특정 지역에 처음 진입할 때 확인할 수 있습니다.
journal.document.intros.dungeon.body=수많은 영웅들이 당신보다 먼저 지상의 도시에서 이 던전으로 모험을 떠났지만, 대부분은 소식이 끊겼습니다. 전해지는 바에 따르면, 고대의 악이 던전 깊은 곳에 숨어 전능한 옌도르의 부적을 지키고 있다고 합니다. 지금도 어둠의 기운이 아래에서 뿜어져 나와 도시로 올라오고 있습니다. 당신은 이 던전을 정복하고 부적을 손에 넣을 수 있을까요? 이제 당신만의 모험을 시작할 시간입니다!
journal.document.intros.dungeon.title=지하 감옥
journal.document.intros.halls.body=드워프 대도시의 이 깊은 홀들은 어둠의 마법으로 뒤덮여 있습니다. 과거 이곳은 드워프 왕의 정예 마법사들이 모이던 곳이었지만, 이제는 더욱 사악한 무언가에 점령당한 듯합니다... 온갖 끔찍한 악마들이 이 홀들을 배회하며 무시무시한 어둠의 세력에 의해 조종되고 있습니다. 드워프 왕이 이 타락의 근원이 아니라면, 분명 이곳에 있는 무언가가 그 원인일 것입니다. 조심하십시오. 이곳까지 내려온 모험가는 극소수에 불과합니다...
journal.document.intros.halls.discover_hint=이 텍스트는 특정 지역에서 찾을 수 있지만, 이 세트에 있는 이전 텍스트들을 모두 찾은 후에만 가능합니다.
journal.document.intros.halls.title=악마의 전당
journal.document.intros.prison.body=수년 전, 이곳에는 위험한 범죄자들을 수용하기 위한 감옥이 세워졌습니다. 엄격한 규제와 보안 속에서 전국 각지에서 죄수들이 이곳으로 끌려와 형기를 보냈습니다. 하지만 곧 어둠의 기운이 아래에서 스며들기 시작했고, 간수와 죄수 모두의 정신을 뒤틀어 놓았습니다. 점점 심해지는 혼란에 대응하여 도시는 감옥 전체를 봉쇄했습니다. 이 벽 안에 버려져 죽은 자들의 최후는 아무도 알지 못합니다…
journal.document.intros.prison.title=감옥
journal.document.intros.sewers.body=지하 감옥의 위층은 사실 도시의 하수도 시스템입니다. 어둠의 에너지가 아래에서 스며들어 오면서 평소에는 무해했던 하수도 생물들이 점점 더 흉포해졌습니다. 도시는 위층 사람들의 안전을 유지하기 위해 경비대를 이곳으로 보내 순찰을 돌게 했습니다. 이곳은 위험하지만, 적어도 이곳에서 작용하는 사악한 마법은 약합니다.
journal.document.intros.sewers.title=하수도
journal.document.intros.title=지역 소개
journal.document.prison_warden.discover_hint=이 텍스트는 특정 지역에서 찾을 수 있지만, 이 세트에 있는 이전 텍스트들을 모두 찾은 후에만 가능합니다.
journal.document.prison_warden.journal.body=362년 봄 1일, 교도소장 키아나 스미스의 업무일지 첫 번째 기록입니다. 최근 여러 가지 일들이 겹치면서 생각을 정리하기 위해 일기를 쓰기 시작했습니다. 지하 800미터 아래에 있는 교도소를 관리하는 일은 결코 쉬운 일이 아니었지만, 최근 들어 조직적인 소동이 벌어지고 있는 것 같습니다. 수감자들이 아무 이유 없이 난동을 부리고는 그 이유를 설명하려 하지 않습니다. 일부 교도관들은 이곳이 귀신이 나온다고 말하기 시작했습니다. 내 부하들이 소문을 퍼뜨리도록 내버려 둘 수는 없지만, 그들이 불안해하는 것도 무리는 아닙니다. - 스미스
journal.document.prison_warden.journal.title=일기 쓰기
journal.document.prison_warden.letter.body=토마스, 넌 정말 좋은 친구였어. 그래서 내가 호의를 베푸는 거야. 오늘 밤 교대 근무 시작할 때, 텐구의 감방 문을 잠그고 보강해. 열쇠는 구석에 던져 놓고 나가. 다른 죄수들이 감시를 받지 않더라도 상관없어. 곧 아무도 이곳을 떠날 수 없게 될 거야. 그 괴물은 반드시 붙잡아 둬야 해. 탈출하면 무슨 짓을 할지 몰라. 이 일은 아무에게도 말하지 마. 그리고 날 찾으려고 애쓰지 마. 선장은 배와 함께 가라앉아야 해. - 키아나
journal.document.prison_warden.letter.title=토마스에게 보내는 편지
journal.document.prison_warden.mines.body=363년 겨울 54일, 오늘 도시에서 온 기술자들이 지하 광산으로 통하는 옛 입구를 봉쇄하러 왔다고 하더군요. 아마 도시에서는 더 이상 그 통로를 유지 보수할 생각이 없는 모양입니다. 늘 그렇듯 사전 통보도 없었죠. 그들의 수석 기술자는 광산에서 드워프 마법이 새어 들어온다는 헛소리도 늘어놓았습니다. 한 마디도 믿지 않아요. 새 직원들 덕분에 상황은 훨씬 나아졌지만, 근본적인 문제는 아직 해결되지 않았습니다. 분명히 이곳 수감자들에게 영향을 미치는 무언가가 있고, 벽 몇 개를 허문다고 해서 해결될 문제는 아닙니다. - 스미스
journal.document.prison_warden.mines.title=지뢰 봉쇄
journal.document.prison_warden.no_support.body=봄 11일, 364\n\n도대체 이 도시는 무슨 생각을 하는 거야? 긴급히 도움을 요청했는데 아무런 소식도 없어. 내 요청이 거절될 때마다 보내는 공허한 사과 한마디조차 없었어.\n\n그동안 수감자들의 상태는 점점 악화되고 있고, 교도관들까지 문제를 일으키기 시작했어. 폭동이 일어날 때까지 이대로 내버려 둘 생각이야?!\n\n토마스는 여전히 믿음직스럽군. 그의 조직적인 도움은 정말 귀중했고, 구형 DM-100 장치를 재가동하자는 그의 아이디어는 유감스럽지만 필요한 조치였어. 난 이 상황을 다시 통제할 수 있을 거라고 확신해. 다만, 제발 좀 도와줘!\n-스미스
journal.document.prison_warden.no_support.title=지원 안 함
journal.document.prison_warden.recruits.body=80번째 봄, 362\n\n 약속대로 오늘 신병들이 잔뜩 도착했습니다. 늘 그렇듯, 유망한 몇몇과 그저 월급만 받으려는 잡병들이 대부분인 것 같습니다. 그래도 이렇게 새 인력이 충원되니 최근 말썽꾸러기 재소자들을 다루는 데 큰 도움이 될 겁니다.\n\n 이런 일에서는 누구를 믿을 수 있는지 아는 게 중요합니다. 새로 온 토마스라는 녀석은 특히 유망해 보입니다. 지금 당장 도움이 절실히 필요하니, 토마스가 잘하면 빨리 승진시켜주도록 하겠습니다.\n- 스미스
journal.document.prison_warden.recruits.title=신입 사원
journal.document.prison_warden.rotberry.body=가을 23일, 363년 1월 23일. 오늘 펠릭스에게서 멋진 선물을 받았어요. '로트베리'라는 이름의 밝은 빨간색 관목이에요. 전에 여기가 얼마나 음침한지 얘기했었는데, 들었나 봐요. 펠릭스 말로는 이 식물이 빛과 물을 싫어해서 한 달에 한 번 정도 잎을 다듬어줘야 한다고 하네요. 다듬는 게 중요한가 봐요. 편지에 열두 번도 넘게 강조했거든요. 물론 펠릭스는 절대 공짜로 뭔가를 해주지 않아요. 이 식물에서 나는 씨앗이 지팡이 만들기에 좋다고 하니, 씨앗이 열릴 때마다 몇 개씩 펠릭스에게 줘야겠어요. - 스미스
journal.document.prison_warden.rotberry.title=로트베리 식물
journal.document.prison_warden.title=교도소장의 일지
journal.document.sewers_guard.crabs.body=겨울 11일, 376년 \n사랑하는 엄마 아빠께, \n\n쥐들도 모자라 더 깊은 곳에는 거대한 게들이 있어요! 그중 한 마리가 제 옆을 쏜살같이 지나가다가 리를 꽤 심하게 다치게 했어요. 우리가 그 게를 죽이기 전까지 말이죠. 토마스는 제 잘못이 아니라고 하지만, 전 그가 저를 위로하려고 하는 거라는 걸 알아요. \n\n다행히 나가는 길에 모험가를 만났는데, 그분이 여분의 해바라기 연고를 가지고 계셨어요. 그게 없었으면 리는 살아남지 못했을 거예요. \n\n떠나기 전에 그 모험가가 장미를 바라보고 있는 걸 봤어요. 선물이라고 하더군요. 누군가 그 사람을 그렇게 아낀다면 왜 목숨을 걸고 여기까지 내려온 걸까요? \n\n제가 바로 그런 행동을 하고 있는 거잖아요, 그렇죠? 내가 감당하기 힘든 상황에 놓인 것 같아.
journal.document.sewers_guard.crabs.title=거대한 게!
journal.document.sewers_guard.dangerous.body=가을 88일, 375년 엄마 아빠께, 이제 왜 월급이 이렇게 좋은지 알겠어요. 하수도가 괴물들로 가득 차 있거든요! '해충'과 '무법자'들은 피에 굶주린 거대한 쥐들과 화난 놀 무리들이에요. 다행히 우리 팀원들은 모두 일을 잘해요. 팀장인 토마스는 이 분야의 전문가예요. 저도 빨리 배워서 팀에 짐이 되지 않도록 노력하고 있어요. 이 일은 생각보다 훨씬 위험해요. 지금은 이걸 보낼 수 없어서 다행이에요. 걱정하실까 봐 걱정돼요. 조심할게요. - 소냐
journal.document.sewers_guard.dangerous.title=위험한 위치...
journal.document.sewers_guard.discover_hint=이 텍스트는 특정 지역에서 찾을 수 있지만, 이 세트에 있는 이전 텍스트들을 모두 찾은 후에만 가능합니다.
journal.document.sewers_guard.guild.body=376년 겨울 23일, 엄마 아빠께, 이번에는 새로운 괴물은 없었고, 순찰 중에 도적 길드원들을 만났어요. 길드에 대한 이야기는 안 좋게 들었지만, 우리 팀원들은 꽤 친하게 지내는 것 같았어요. 토마스는 헤어지기 전에 그들 중 한 명과 정보와 물자를 교환했고요. 이해가 안 돼요. 우리는 무법자들을 소탕해야 하는 거 아니었나요? 토마스는 지휘관에게 이 사실을 절대 말하지 말라고까지 했는데. 그래도 그들이 준 정보와 물자는 정말 유용했고, 더 이상 싸움을 감당할 수는 없었어요. 아마 우리 모두 여기서 함께 살아남아야 할 것 같아요.
journal.document.sewers_guard.guild.title=도둑 길드
journal.document.sewers_guard.lost.body=겨울 40일, 376년 1월 40일. 토마스와 나는 길을 잃었어. 놀들과 싸우다가 나머지 팀원들과 떨어졌거든. 다친 곳은 없지만, 아래쪽 하수도는 미로 같아. 토마스가 나가는 길을 안다고 하는데, 하수도 맨 아래쪽에 있는 옛 감옥 입구에서 시작한다고 해. 더 깊이 내려가는 건 정말 싫지만, 식량도 없고, 순찰 경로를 찾아 헤매는 것보다는 내려가는 게 훨씬 빠를 거야. 괜찮을 거야. 토마스는 방법을 알고 있어.
journal.document.sewers_guard.lost.title=우리는 길을 잃었어요
journal.document.sewers_guard.new_position.body=375년 가을 85일, 엄마 아빠께, 제가 도시 경비대에서 열심히 일한 보람이 있을 거라고 말씀드렸잖아요. 저 승진했어요! 하수도에서 일하는 특수팀에 합류하라는 초대를 받았어요. 하수도에 해충과 범죄자들이 많다고 하는데, 우리가 그 문제를 해결하는 게 임무래요. 좀 지저분한 일이긴 하지만, 겨울에는 하수도가 따뜻하고 일반 경비 근무보다 세 배나 더 많이 벌 수 있어요! 하지만 좀 비밀스러운 일이라 이 편지를 보낼 수는 없어요. 그래도 엄마 아빠께 편지를 안 쓰는 게 이상하게 느껴져서 계속 편지를 쓸 거예요. 언젠가 보여드릴 수 있을지도 몰라요. \n\nBest,\n- 소냐
journal.document.sewers_guard.new_position.title=제 새로운 직책입니다!
journal.document.sewers_guard.not_worth.body=토마스와 나는 감옥 입구에서 거대한 점액질 괴물과 마주쳤어. 우리가 반응하기도 전에 괴물이 마법 공격을 퍼부었지. 토마스가 대부분을 막아냈지만, 그는 죽었어. 돈으로는 이 고통을 감당할 수 없어. 토마스가 알려준 길로 떠날 거야. 그리고 경비병으로 번 돈으로 부모님과 함께 이 저주받은 도시를 떠날 거야. 왕께서 이 모든 일에 대한 계획을 가지고 계시길 바라는 마음도 있지만, 그럴 것 같진 않아. 이 편지들을 다른 사람들에게 경고로 남기는 거야. 여기는 거대한 쥐나 게만 있는 곳이 아니야. 뭔가 아주 잘못됐어.
journal.document.sewers_guard.not_worth.title=그럴 가치가 없어
