journal.document.adventurers_guide.alchemy.body=Nếu bạn thấy một vật phẩm tiêu hao không hữu ích, bạn có thể sử dụng nó như một nguyên liệu giả kim thuật hoặc biến nó thành năng lượng giả kim thuật đa năng. Thuốc và cuộn giấy tăng cường năng lượng cũng xác định chúng!\n\n Vật phẩm ma thuật là một loại trang bị độc đáo được tạo ra và nâng cấp bằng giả kim thuật. Chúng được tạo ra bằng một chất xúc tác vật phẩm ma thuật và một chút năng lượng giả kim thuật.\n\n (Chiếc nồi giả kim thuật đầu tiên nằm ở tầng 3 hoặc 4 của hầm ngục. Cũng có các trang sách công thức giả kim thuật gần những chiếc nồi này.)
journal.document.adventurers_guide.alchemy.title=Thuật giả kim và đồ trang sức
journal.document.adventurers_guide.dieing.body=Thám hiểm hầm ngục rất nguy hiểm và hầu hết các nhà thám hiểm cuối cùng đều bỏ mạng. May mắn có giúp ích, nhưng những nhà thám hiểm giỏi nhất sử dụng mọi mánh khóe nhỏ để tăng cơ hội chiến thắng. (Đừng buồn nếu bạn chết nhiều, trò chơi này khó! Hãy tập trung vào việc học cách chơi và dần dần cải thiện kỹ năng, chứ không phải là chiến thắng ngay lập tức.)
journal.document.adventurers_guide.dieing.title=Xử lý thất bại
journal.document.adventurers_guide.examining.body=Điều quan trọng là phải nghiên cứu kẻ thù và môi trường xung quanh thay vì xông vào một cách mù quáng! Hãy tập thói quen kiểm tra mọi thứ mới. (Bạn có thể kiểm tra bằng cách sử dụng nút kính lúp và sau đó chọn những gì bạn muốn kiểm tra. Bạn cũng có thể kiểm tra các hiệu ứng tăng hoặc giảm sức mạnh bằng cách chọn biểu tượng của chúng.)
journal.document.adventurers_guide.examining.title=Kiểm tra
journal.document.adventurers_guide.food.body=Phân bổ thức ăn hiệu quả là một trong những cách tốt nhất để tăng cơ hội sống sót, bạn không nhất thiết phải ăn ngay khi đói! Khi không bị đói, sức khỏe của bạn sẽ từ từ hồi phục, vì vậy nếu bạn ăn khi đang ở trạng thái sung sức thì quá trình hồi phục đó sẽ bị lãng phí! Nếu bạn điều chỉnh lượng thức ăn dựa trên tình trạng sức khỏe, thức ăn của bạn sẽ dùng được lâu hơn.
journal.document.adventurers_guide.food.title=Đối phó với nạn đói
journal.document.adventurers_guide.identifying.body=Màu sắc của các loại thuốc và biểu tượng trên cuộn giấy sẽ khác nhau trong mỗi hầm ngục. Trang bị chưa được xác định có thể được nâng cấp hoặc phù phép nếu bạn may mắn, hoặc có thể bị nguyền rủa! Các cuộn giấy xác định, nâng cấp hoặc hóa giải lời nguyền rất hữu ích nếu bạn muốn giảm rủi ro khi sử dụng trang bị chưa được xác định. (Bạn có thể tìm thấy danh sách tất cả các vật phẩm bạn đã xác định trong tab danh mục của nhật ký)
journal.document.adventurers_guide.identifying.title=Xác định các vật phẩm
journal.document.adventurers_guide.intro.body=Chào mừng Nhà thám hiểm, bạn đang đọc Cuốn Sách Hướng Dẫn Chinh Phục Hầm Ngục! Cuốn sách hướng dẫn này tốt nhất nên được dùng làm tài liệu tham khảo, và sẽ tự động cho bạn biết khi nào là thời điểm tốt nhất để đọc từng trang. (Khi nút nhật ký nhấp nháy, hãy chọn nó để đọc những gì cuốn sách hướng dẫn muốn nói với bạn! Tuy nhiên, một số trang bị thiếu, có lẽ bạn có thể tìm thấy chúng trong hầm ngục?)
journal.document.adventurers_guide.intro.title=Giới thiệu
journal.document.adventurers_guide.levelling.body=Lên cấp sẽ tăng chỉ số và điểm kỹ năng, điều này có thể tạo ra sự khác biệt lớn trong chiến đấu. Tốt nhất là nên lên ít nhất một cấp cho mỗi tầng của hầm ngục.\n\nCó thể bạn sẽ muốn vội vàng và tránh khám phá hoặc chiến đấu, nhưng làm như vậy sẽ khiến bạn mất đi vật phẩm và kinh nghiệm.\n\n(Bạn có thể xem thông tin về anh hùng của mình, bao gồm cả kinh nghiệm, trên bảng trạng thái ở góc giao diện trò chơi. Chọn ảnh đại diện anh hùng của bạn để xem thêm thông tin.)
journal.document.adventurers_guide.levelling.title=Tích lũy kinh nghiệm
journal.document.adventurers_guide.looting.body=Những căn phòng bị khóa cửa hoặc chứa chướng ngại vật thường có vật phẩm giá trị hơn. Khi gặp chướng ngại vật, bạn thường có thể tìm thấy vật phẩm hỗ trợ ở cùng tầng. Bạn luôn có thể tìm thấy 2 bình thuốc tăng sức mạnh và 3 cuộn giấy nâng cấp trong mỗi khu vực hầm ngục năm tầng, vì vậy chúng là một chỉ báo tuyệt vời cho thấy bạn khám phá tốt đến mức nào. (Bạn có thể xem danh sách các địa điểm nổi bật và chìa khóa chưa sử dụng trong tab ghi chú của cửa sổ nhật ký.)
journal.document.adventurers_guide.looting.title=Cướp bóc hiệu quả
journal.document.adventurers_guide.magic.body=Các đòn tấn công ma thuật xuyên thấu giáp trụ và rất khó né tránh. Điều này có nghĩa là sát thương từ đũa phép rất đáng tin cậy, nhưng cũng khiến kẻ thù sử dụng ma thuật trở nên rất nguy hiểm!\n\nTuy nhiên, các đòn tấn công ma thuật luôn có một nhược điểm. Đũa phép có số lần sử dụng giới hạn và kẻ thù sử dụng ma thuật thường không thể sử dụng phép thuật của chúng ở cự ly gần.\n\nKhi đối mặt với kẻ thù sử dụng ma thuật, điều quan trọng là phải học cách ngăn chặn chúng sử dụng ma thuật lên bạn.
journal.document.adventurers_guide.magic.title=Các đòn tấn công ma thuật
journal.document.adventurers_guide.positioning.body=Chiến lược cũng quan trọng không kém gì trang bị. Những tình huống bất lợi như bị bao vây thường có thể tránh được bằng cách bố trí vị trí tốt. Ví dụ, hầu hết các hầm ngục đều có những hành lang hẹp buộc kẻ thù phải chiến đấu với bạn từng con một. Những hành lang này cũng thường có cửa ra vào để tấn công bất ngờ! Ngoài ra, còn có rất nhiều cách nhỏ để tận dụng các đặc điểm môi trường như cỏ, nước, hố hoặc bẫy để tạo lợi thế cho mình.
journal.document.adventurers_guide.positioning.title=Định vị
journal.document.adventurers_guide.searching.body=Hầm ngục chứa đầy những cánh cửa bí mật và cạm bẫy thoạt nhìn có vẻ vô hình. Bạn có thể dành chút thời gian và tìm kiếm cẩn thận nếu nghi ngờ có cửa hoặc cạm bẫy nào đó ẩn giấu gần đó. (Bạn có thể tìm kiếm tất cả các ô xung quanh bằng cách nhấn nút kính lúp hai lần. Có thể có một số cánh cửa bí mật gần nơi bạn tìm thấy trang này!)
journal.document.adventurers_guide.searching.title=Đang tìm kiếm
journal.document.adventurers_guide.strength.body=Không có thời gian để luyện tập với vũ khí và giáp bạn tìm thấy trong hầm ngục, vì vậy bạn cần sức mạnh thể chất để sử dụng chúng hiệu quả. Thuốc tăng sức mạnh và cuộn giấy nâng cấp là cách hiệu quả nhất để đáp ứng yêu cầu sức mạnh của trang bị cấp cao hơn. Điều quan trọng là cuối cùng bạn nên bắt đầu sử dụng các vật phẩm cấp cao, nhưng đừng bỏ qua những trang bị bạn có thể sử dụng ngay bây giờ.
journal.document.adventurers_guide.strength.title=Sức mạnh
journal.document.adventurers_guide.surprise_attacks.body=Các đòn tấn công bất ngờ đảm bảo trúng đích, đặc biệt hữu ích khi đối phó với những kẻ thù khó nắm bắt như rắn và ma. Bạn có thể tấn công bất ngờ kẻ thù ngay sau khi chúng bước vào cửa khi đang đuổi theo bạn, hoặc khi chúng mất dấu bạn.
journal.document.adventurers_guide.surprise_attacks.title=Các cuộc tấn công bất ngờ
journal.document.adventurers_guide.title=cuốn sách về nghệ thuật chinh phục ngục tối
journal.document.adventurers_guide.upgrades.body=Càng tiến sâu vào hầm ngục, việc sử dụng trang bị cấp cao được nâng cấp bằng phép thuật càng quan trọng, nhưng bạn cũng cần đủ sức mạnh để sử dụng chúng hiệu quả. Gậy phép, nhẫn và thánh vật không cần sức mạnh, nhưng có công dụng hạn chế hoặc không hỗ trợ trực tiếp trong chiến đấu. Việc lựa chọn đúng đắn những gì cần nâng cấp rất quan trọng để sống sót trong giai đoạn đầu của hầm ngục và tạo tiền đề cho thành công sau này.
journal.document.adventurers_guide.upgrades.title=Nâng cấp
journal.document.alchemy_guide.bombs.body=Bom thuốc súng đen tiêu chuẩn có thể được trộn với một vật liệu đặc biệt để tạo ra bom cải tiến.
journal.document.alchemy_guide.bombs.title=Bom cải tiến
journal.document.alchemy_guide.brews_elixirs.body=Các loại thuốc pha chế và thần dược là những loại thuốc cao cấp có nhiều tác dụng khác nhau, thường chỉ dùng được một lần.
journal.document.alchemy_guide.brews_elixirs.title=các loại đồ uống và thuốc bổ
journal.document.alchemy_guide.energy_food.body=Nhiều công thức nấu ăn yêu cầu năng lượng luyện kim tinh thể, được tạo ra bằng cách phân giải các vật phẩm tiêu hao trong nồi luyện kim. Việc nạp năng lượng cho thuốc hoặc cuộn giấy phép thuật cũng giúp nhận biết chúng. Một số công thức yêu cầu năng lượng mang tính ma thuật, nhưng những công thức này lại giống với cách nấu ăn truyền thống.
journal.document.alchemy_guide.energy_food.title=Năng lượng và Thực phẩm
journal.document.alchemy_guide.exotic_potions.body=Có thể pha trộn các loại thuốc với năng lượng để tạo ra những loại thuốc kỳ lạ. Chúng có tác dụng mạnh hơn, nhưng thường hữu ích theo những cách khác nhau.
journal.document.alchemy_guide.exotic_potions.title=thuốc thần kỳ
journal.document.alchemy_guide.exotic_scrolls.body=Bạn có thể chế tạo các cuộn phép thuật đặc biệt bằng một lượng năng lượng nhất định và một cuộn phép. Chúng mạnh hơn và đắt hơn một chút so với các loại thuốc đặc biệt.
journal.document.alchemy_guide.exotic_scrolls.title=cuộn giấy kỳ lạ
journal.document.alchemy_guide.potions.body=Chào mừng đến với Ứng dụng Thực tiễn của Thuật Giả Kim! Cuốn sách này là tài liệu tham khảo về các công thức chế tạo vật phẩm tại nồi giả kim. Chúng ta sẽ bắt đầu với công thức nổi tiếng nhất: Thuốc! Sử dụng ba hạt giống để pha chế một loại thuốc ngẫu nhiên! Mỗi hạt giống đều có một loại thuốc tương ứng, hãy sử dụng nhiều hạt giống giống nhau để tăng khả năng loại thuốc đó có liên quan đến các hạt giống bạn đã sử dụng.
journal.document.alchemy_guide.potions.title=Giới thiệu và các loại thuốc
journal.document.alchemy_guide.spells.body=Các loại bùa chú được chứa trong tinh thể và mang lại nhiều hiệu ứng khác nhau, thường có thể sử dụng nhiều lần.
journal.document.alchemy_guide.spells.title=phép thuật
journal.document.alchemy_guide.stones.body=Khi trộn một cuộn giấy phép thuật vào một chiếc bình luyện kim, ma thuật của nó sẽ được truyền vào hai viên đá bên trong bình. Điều này tạo ra các phiến đá khắc chữ rune và xác định được cuộn giấy đó!
journal.document.alchemy_guide.stones.title=Tạo bia đá rune
journal.document.alchemy_guide.title=Hướng dẫn giả kim thuật
journal.document.alchemy_guide.weapons.body=Một số vũ khí nhẹ hơn hoặc có tính ma thuật cao hơn có thể được sử dụng trong thuật giả kim! Mỗi bộ vũ khí ném sẽ tạo ra đủ kim loại lỏng để sửa chữa hoàn toàn một bộ khác cùng cấp độ và bậc. Lưu ý rằng việc sử dụng thuật giả kim cho một bộ vũ khí sẽ phá hủy toàn bộ bộ đó, ngay cả khi không phải tất cả các bộ phận đều còn nguyên vẹn! Một cây đũa phép sẽ tạo ra đủ nhựa ma thuật để nâng cấp hai cây đũa phép cùng cấp độ, nhưng không cao hơn +3.
journal.document.alchemy_guide.weapons.title=Nâng cấp vũ khí
journal.document.caves_explorer.alive.body=Ngày 23 tháng 4 năm 308\n\nMột trong những cỗ máy của người lùn bỗng nhiên sống dậy! Chúng tôi chỉ đang đi ngang qua thì nó lao tới và suýt nữa đè bẹp hai người trong nhóm bằng nắm đấm kim loại khổng lồ của nó. May mắn thay, tôi mang theo cây đũa phép phân rã của mình. Chỉ cần vài phát bắn chính xác, con quái vật đó đã bị biến thành đống sắt vụn.\n\nĐiều khiến tôi băn khoăn là chúng tôi hoàn toàn không làm gì để khiêu khích cỗ máy. Người lùn không thể nào thiết kế những cỗ máy hung hăng đến vậy, cứ như thể nó đang cố phục kích chúng tôi vậy!\n\nÍt nhất thì lần này tôi cũng có thể giúp đỡ các đồng đội của mình.\n- Archibald
journal.document.caves_explorer.alive.title=Nó còn sống!
journal.document.caves_explorer.city.body=Ngày 21 tháng 4 năm 308\n\nChúng tôi đã trải qua ba tuần, và sau khi dành phần lớn mười ngày qua để lập bản đồ ngày càng sâu hơn, cuối cùng chúng tôi cũng đã đến đáy hầm mỏ. Chúng tôi tìm thấy nhiều thiết bị kim loại và một cánh cổng lớn chắn lối vào thành phố cổ của người lùn.\n\nNgười thợ rèn đã cảnh báo chúng tôi về một số máy móc này. Rõ ràng chúng được dùng để phòng thủ khu vực và có xu hướng kích hoạt khi bị quấy rầy. Chúng tôi không có việc gì ở trong thành phố, và kim loại sẽ có giá trị phế liệu rất thấp, vì vậy chúng tôi nghĩ tốt nhất là nên nghe lời cảnh báo của ông ta và quay trở lại.\n\nTôi phải thừa nhận là tôi rất tò mò, nhưng việc điều tra xuống đó chắc chắn không đáng để mạo hiểm.\n- Archibald
journal.document.caves_explorer.city.title=Cổng vào thành phố
journal.document.caves_explorer.discover_hint=Bạn có thể tìm thấy văn bản này trong một khu vực cụ thể, nhưng chỉ sau khi đã tìm thấy tất cả các văn bản trước đó trong bộ này.
journal.document.caves_explorer.expedition.body=Ngày 1 tháng 4 năm 308\n\nHôm nay bắt đầu cuộc thám hiểm kéo dài bốn tuần của chúng ta vào các mỏ lùn bị bỏ hoang! Ta được chính nhà vua giao nhiệm vụ khám phá khu vực này. Mục tiêu chính của ta là tìm kiếm bất kỳ nguồn tài nguyên thiên nhiên nào chưa được khai thác và khảo sát các hang động để phục vụ cho một dự án xây dựng nhà tù tiềm năng.\n\nMặc dù ta có khả năng tự vệ, nhưng theo yêu cầu của nhà vua, ta đã chấp nhận sự hộ tống của đội cận vệ thành phố. Bọn họ là một lũ ngốc, nhưng miễn là họ không làm chậm bước ta thì sự hiện diện của họ vẫn có thể chấp nhận được.\n\nChúng ta dự kiến sẽ dọn sạch cống rãnh và đến được các mỏ vào buổi tối.\n- Archibald Drummond. Đại pháp sư, Học viện pháp thuật phía Nam.
journal.document.caves_explorer.expedition.title=Cuộc thám hiểm bắt đầu!
journal.document.caves_explorer.gold.body=Ngày 4 tháng 4 năm 308\n\nNhững ngày đầu tiên của chúng ta thực sự rất hiệu quả! Sau khi thiết lập trại căn cứ, chúng tôi bắt đầu khám phá một số khu vực phía trên của mỏ bỏ hoang. Mặc dù có rất nhiều đồ đạc vô dụng do người lùn để lại, nhưng nhiều bức tường hang động cũng chứa đầy vàng!\n\nThật không may, chúng tôi không phải là những người đầu tiên đến đây. Các hang động đầy rẫy động vật hoang dã hung dữ, và dường như các bầy gnoll cũng quan tâm đến vàng. Tôi thừa nhận rằng tôi đã không công bằng với đội hộ tống của mình, họ đã là những nhà thám hiểm và vệ sĩ giỏi hơn nhiều so với tôi mong đợi.\n\nNgay cả với thành công này, chúng tôi vẫn còn rất nhiều mỏ cần phải khám phá.\n- Archibald
journal.document.caves_explorer.gold.title=Nhiều vàng quá!
journal.document.caves_explorer.report.body=Ngày 28 tháng 4 năm 308\n\nHôm nay chúng ta sẽ hoàn tất việc đóng gói đồ đạc và chuẩn bị rời đi. Cũng vừa kịp lúc, một vài người trong nhóm chúng ta bắt đầu gặp những cơn ác mộng kinh hoàng sau sự cố với cỗ máy hung hãn. Có lẽ chỉ là do mệt mỏi, nhưng những cơn ác mộng của họ đều giống nhau một cách đáng lo ngại.\n\nTóm lại, các khu vực phía trên của mỏ khá an toàn. Nếu tìm được công dụng cho vàng đen thì việc khai thác nó có thể rất sinh lợi. Những không gian rộng lớn cũng rất phù hợp với kế hoạch xây dựng thành phố. Tuy nhiên, các mỏ phía dưới nguy hiểm hơn và nên tránh.\n\nTôi sẽ viết tất cả những điều này vào báo cáo cuối cùng của mình trong vài ngày tới.\n- Archibald
journal.document.caves_explorer.report.title=Báo cáo cuối cùng
journal.document.caves_explorer.title=Nhật ký thám hiểm
journal.document.caves_explorer.troll.body=Ngày 11 tháng 4 năm 308\n\nSau khi bắt đầu khám phá khu vực giữa hầm mỏ, chúng tôi đã gặp một gương mặt quen thuộc! À... tương đối thân thiện. Một con quỷ hang động đã dựng một xưởng rèn nhỏ ở đó. Hắn ta cộc cằn và ít nói, nhưng đã sửa chữa thiết bị của chúng tôi để đổi lấy một ít vàng.\n\nKhông may thay, người thợ rèn quỷ cũng cho chúng tôi biết rằng tất cả số vàng tuyệt vời này không thực sự tốt như vẻ ngoài của nó. Hắn gọi nó là 'vàng đen' và dường như nó nhanh chóng bị phân hủy dưới ánh sáng mặt trời. Điều đó chắc chắn giải thích tại sao chưa bao giờ có bất kỳ xung đột nào về tài nguyên ở đây.\n\nTôi cho rằng chúng ta cần đào sâu hơn một chút để xem liệu có thứ gì quý giá hơn không.\n- Archibald
journal.document.caves_explorer.troll.title=Gặp một con quỷ lùn
journal.document.city_warlock.discover_hint=Bạn có thể tìm thấy văn bản này trong một khu vực cụ thể, nhưng chỉ sau khi đã tìm thấy tất cả các văn bản trước đó trong bộ này.
journal.document.city_warlock.failure.body=Có vẻ như ta cũng là một kẻ ngốc. Ta cứ tưởng rằng Tân Vương cần triều đình phục tùng hắn một cách tự nguyện, nhưng giờ ta thấy hắn có quyền lực điều khiển cả những kẻ chống đối hắn. Ta đã mù quáng đưa tất cả những kẻ chống đối mạnh nhất đến tận cửa nhà hắn để hắn có thể đích thân biến họ thành nô lệ của mình. Giờ đây, những làn sóng năng lượng hắc ám của hắn đang tràn ngập thành phố, ngay lập tức biến hầu hết mọi người thành những kẻ cầu xin hắn. Những người còn giữ được ý chí tự do đang bỏ chạy. Ta đã chọn ở lại để quan sát kỹ nhất có thể và tìm kiếm cơ hội. Với sức mạnh ma thuật mình có, ta sẽ có thể ẩn náu và an toàn trong một thời gian.
journal.document.city_warlock.failure.title=Sự thất bại
journal.document.city_warlock.more_powerful.body=Việc theo dõi thời gian đã trở nên khó khăn, nhưng đã khoảng một tuần kể từ lần ghi chép cuối cùng của tôi. Nền văn minh của chúng ta thực sự đã sụp đổ. Cổng thành đã đóng, mọi chức năng của xã hội đều ngừng hoạt động, và những cái xác người lùn trống rỗng lang thang khắp các hành lang.\n\nTrong suốt thời gian này, bằng cách nào đó, Tân Vương lại càng trở nên mạnh mẽ hơn. Mỗi ngày sức mạnh ý chí của ông ta càng lớn mạnh, nhưng nó cũng đang thay đổi. Tôi không thể diễn tả được, nhưng cảm giác như thể ông ta không còn là người lùn nữa.\n\nTôi bắt đầu chấp nhận rằng điều tốt nhất tôi có thể làm có lẽ là ghi lại những sự kiện này. Tôi sẽ ở lại đây càng lâu càng tốt, và sau đó sẽ rút lui khi ý chí của tôi bắt đầu suy yếu.
journal.document.city_warlock.more_powerful.title=Mạnh mẽ hơn
journal.document.city_warlock.new_power.body=Chuyện gì đang xảy ra ở đây vậy? Sức mạnh tỏa ra từ Tân Vương quả thực khác so với lúc đầu, nhưng còn có điều gì đó khác nữa. Sức mạnh mới này dường như phát ra từ những điện thờ sâu thẳm nhất của thành phố chúng ta. Điều khó hiểu hơn nữa là hoạt động ở khu vực thượng đô cũng giảm sút. Ta không biết chuyện gì đang xảy ra ở dưới đó, nhưng nó đang thu hút gần như toàn bộ sự chú ý của Tân Vương. Quay trở lại những điện thờ sâu thẳm sẽ rất nguy hiểm, nhưng ta phải tìm ra nguyên nhân của sự thay đổi này. Có lẽ Tân Vương cũng có điểm yếu nào đó chăng?
journal.document.city_warlock.new_power.title=Một sức mạnh mới
journal.document.city_warlock.old_king.body=Hôm nay là ngày 5 tháng 2 năm thứ 33 của kỷ nguyên ma thuật. Nếu một người đến từ thế giới bên ngoài đang đọc điều này, thì đó là vào mùa đông năm 264. Tên tôi là Thymor Zahir, và theo như tôi biết, tôi là thành viên cuối cùng còn sống sót của triều đình người lùn.\n\nNhà vua của chúng ta đã băng hà, bị thay thế bởi một trong những đồng nghiệp cũ của tôi, kẻ đã phát điên vì quyền lực. Những người còn lại trong triều đình đã khuất phục hắn, như những kẻ ngu ngốc, và đánh mất ý chí tự do của mình trong quá trình đó. Chỉ mình tôi nhìn thấy điều này sắp xảy ra và đã bỏ trốn trước khi nghi lễ của hắn hoàn thành.\n\nVòng tròn thân cận đã sụp đổ, nhưng quyền lực của Tân Vương vẫn chưa đến được với tất cả mọi người. Tôi phải nhanh chóng tập hợp lực lượng kháng chiến. Tôi từ chối để nền văn minh huy hoàng của chúng ta sụp đổ dưới tay tên cuồng quyền này!
journal.document.city_warlock.old_king.title=Nhà vua đã băng hà
journal.document.city_warlock.resistance.body=Tin tức dường như đã lan truyền nhanh chóng. Chỉ mới vài ngày trôi qua và tôi đã tập hợp được một đội quân nhỏ gồm những người trung thành với Vua Cũ. Ít người giỏi phép thuật, nhưng hầu như toàn bộ giáo đoàn tu sĩ chiến binh đều ở trong số chúng ta. Chúng ta hẳn là thừa sức đối phó với một tên lùn điên rồ và đám nô lệ của hắn.\n\nTrong khi đó, Tân Vương đã ẩn náu trong các phòng kín của thành phố chúng ta. Chắc chắn hắn đã tiêu hao phần lớn sức mạnh và đang hy vọng hồi phục trước khi gặp phải sự kháng cự nào nữa.\n\nChúng ta sẽ phát động cuộc tấn công trong vài giờ nữa. Nếu may mắn, chúng ta sẽ có thể thành lập một hội đồng lâm thời và khôi phục lại sự ổn định cho thành phố kỳ diệu của chúng ta vào cuối đêm nay.
journal.document.city_warlock.resistance.title=Một cuộc kháng chiến
journal.document.city_warlock.seen_it.body=Tôi đã nhìn thấy những gì nằm bên dưới, nhưng tôi không thể mô tả được. Tay tôi run rẩy không kiểm soát khi cố gắng viết ra những suy nghĩ của mình. Tại sao điều này lại xảy ra? Có phải Tân Vương đã làm điều này? Thật vô lý. Có lẽ sự lạm dụng quyền lực bừa bãi của ông ta đã thu hút nó? Tôi đã hy vọng cứu vãn nền văn minh của chúng ta, nhưng giờ tôi thấy rằng cả thế giới đang gặp nguy hiểm. Bằng cách nào đó, nhà vua lại là kẻ ác ít hơn. Tôi không còn lựa chọn nào khác, vì lợi ích lớn hơn, tôi sẽ đầu hàng. Xin hãy dẫn dắt tôi, thưa đức vua, hãy sử dụng tôi như một công cụ để ngăn chặn Yog-Dzewa!
journal.document.city_warlock.seen_it.title=Tôi đã thấy rồi.
journal.document.city_warlock.title=Nhật ký của pháp sư
journal.document.halls_king.amulet.body=TA ĐÃ LÀM ĐƯỢC RỒI!\n\nTa không biết chính xác mình sẽ tìm thấy gì, nhưng những gì ta khám phá ra ngoài kia vượt xa cả những tưởng tượng điên rồ nhất của ta. Quá nhiều sức mạnh, chỉ cần ở đó sẵn sàng để được chiếm lấy, và tất cả là của ta!\n\nVới điều này, không một tên ngốc nào trong triều đình dám chống lại ta. Ta chỉ đang lâng lâng nghĩ về tất cả những cách khác nhau mà ta có thể làm nhục chúng. Chết tiệt, tại sao lại dừng ở đó, ta có đủ sức mạnh để tiêu diệt từng tên một nếu ta muốn! Điều đó có thể hơi quá đáng, nhưng ta không được mất quá nhiều thời gian để quyết định nếu không chúng sẽ nghi ngờ.\n\nTa nghĩ ta sẽ gọi sức mạnh vĩ đại này là Bùa Hộ Mệnh Yendor!\n- R.
journal.document.halls_king.amulet.title=Bùa hộ mệnh
journal.document.halls_king.attrition.body=Ta có kế hoạch đối phó với thứ đó. Sức mạnh của nó là vô hạn, nhưng khả năng xâm chiếm thế giới này thì không. Nó đang dựa vào tay sai và hiện thân để thực hiện mệnh lệnh của mình trong khi cố gắng tích lũy đủ sức mạnh để chiếm lấy chiếc bùa hộ mệnh. Mặc dù ta không sở hữu chiếc bùa hộ mệnh về mặt vật lý, nhưng ta vẫn hoàn toàn kiểm soát được sức mạnh của nó. Với toàn bộ thành phố người lùn nằm trong tay, ta cũng có lợi thế về quân số. Ta chỉ cần liên tục gửi binh lính để ngăn chặn nó chiếm lấy chiếc bùa hộ mệnh và dần dần giành chiến thắng trong cuộc chiến này bằng cách làm suy yếu đối phương! Ta, Rodney, Vua của người lùn, sẽ sống lâu hơn ngươi, Yog-Dzewa!
journal.document.halls_king.attrition.title=Sự hao mòn
journal.document.halls_king.discover_hint=Bạn có thể tìm thấy văn bản này trong một khu vực cụ thể, nhưng chỉ sau khi đã tìm thấy tất cả các văn bản trước đó trong bộ này.
journal.document.halls_king.new_king.body=TA LÀ VUA, AHAHAHAHAAA!\n\nHọ cứ để ta làm thế! Chẳng cần thuyết phục gì nhiều, họ đã đồng ý để ta 'chia sẻ' quyền lực này với họ trong một nghi lễ trọng đại. Trong nháy mắt, họ đã biến từ một đám người chế nhạo thành triều đình mới của ta với những thần dân im lặng!\n\nĐúng như dự đoán, Thymor đã bỏ chạy như một kẻ hèn nhát ngay khi gặp rắc rối. Ta cũng đã cảm nhận được lực lượng kháng chiến mà hắn đang xây dựng. Ta nghĩ ta sẽ cho phép hắn tiếp tục, để hắn có thể giao nộp tất cả những kẻ âm mưu cho ta!\n\nRõ ràng vương quốc cũng không tôn trọng ta, ta cho rằng ta cũng sẽ phải giải quyết chuyện đó.\n- Vua của người lùn
journal.document.halls_king.new_king.title=Một vị vua mới
journal.document.halls_king.rejection.body=ĐỒ NGU XUẨN!\n\nTrong 33 năm qua, vương quốc của chúng ta đã phát triển mạnh mẽ nhờ công nghệ ma thuật mới. Chúng ta đã học được cách triệu hồi các linh hồn nguyên tố và điều khiển chúng theo ý muốn, nhưng giờ đây, việc thử nghiệm thêm lại bị coi là 'quá nguy hiểm'.\n\nTôi biết chuyện gì đang thực sự xảy ra. Việc bác bỏ các lý thuyết của tôi không liên quan gì đến giá trị của chúng mà hoàn toàn liên quan đến người đề xuất chúng. Có lẽ tất cả bọn họ đang cười nhạo tôi sau lưng.\n\nThôi, không còn nữa! Tôi không quan tâm họ nói gì, tôi sẽ một mình khám phá những vùng xa xôi nhất của vũ trụ và giữ tất cả những gì tôi khám phá được cho riêng mình!\n- R.
journal.document.halls_king.rejection.title=Từ chối
journal.document.halls_king.ritual.body=Sáng nay, Thymor đã công khai đối chất với tôi và khăng khăng đòi tôi giải thích nguồn sức mạnh mới của mình. Tôi đã cố gắng gạt bỏ lời hắn ta một cách khéo léo nhất có thể, nhưng tôi lại cảm thấy ánh mắt phán xét của những người còn lại trong triều đình đang đổ dồn về mình. Tôi đã hy vọng có thể dành thêm chút thời gian để tận hưởng sự yên bình trước cơn bão, nhưng điều đó không thực sự quan trọng. Tôi đã quyết định điều mình muốn làm. Tôi sẽ tuyên bố mình có được sức mạnh thông qua một nghi lễ mới, và sẽ đề nghị thực hiện nó lên các pháp sư khác và nhà vua. Sau khi nghi lễ kết thúc, tôi sẽ trở thành vua! Tất nhiên, Thymor sẽ phản đối, nhưng với quyền lực lớn như vậy, tôi nghi ngờ họ sẽ nghe lời hắn ta! Tất cả sẽ cúi đầu trước ta! - Vua tương lai của người lùn
journal.document.halls_king.ritual.title=Nghi lễ
journal.document.halls_king.thing.body=Có vấn đề rồi. Thymor đã bị tiêu diệt dễ dàng, nhưng có vẻ như những nỗ lực tìm kiếm của ta ở các cõi bên ngoài không hề bị bỏ qua. Một... 'thứ' nào đó... đã bị thu hút đến thế giới của ta và đang bắt đầu tự mình xâm nhập vào từ dưới đáy các sảnh thấp hơn. Tệ hơn nữa, đó lại chính là nơi ta cất giữ chiếc bùa hộ mệnh! Một sinh vật đầy thù hận như vậy, tại sao nó lại cố gắng tước đoạt sức mạnh của ta khi ngoài kia vẫn còn rất nhiều thứ để ta chiếm lấy? Mặc dù ta có sức mạnh, nhưng ta không nghĩ mình có thể xông vào và chiến đấu với nó. Sức mạnh thực sự của nó là không thể lường trước được, nhưng chắc chắn phải có cách nào đó để hạn chế nó. TA SẼ BẢO VỆ CHIẾN LỢI PHẨM CỦA MÌNH!
journal.document.halls_king.thing.title=Thứ đó
journal.document.halls_king.title=Nhật ký của ???
journal.document.intros.caves.body=Những hang động thưa dân này trải dài xuống dưới nhà tù bỏ hoang. Giàu khoáng sản, chúng từng là trung tâm thương mại và công nghiệp sầm uất của xã hội người lùn bên dưới, nhưng đã bị bỏ hoang khi người lùn bị ám ảnh bởi ma thuật hắc ám. Hiện nay, các hang động chủ yếu là nơi sinh sống của động vật hoang dã dưới lòng đất, gnoll và máy móc bỏ hoang; có lẽ đã bị tha hóa bởi cùng một sức mạnh đã ảnh hưởng đến các vùng phía trên.
journal.document.intros.caves.title=Hang động
journal.document.intros.city.body=Thành phố của người lùn từng là thành bang vĩ đại nhất trong tất cả các thành bang của người lùn. Vào thời kỳ hoàng kim, người lùn đã xây dựng những cỗ máy kỳ diệu bằng kim loại và ma thuật, cho phép thành phố của họ mở rộng nhanh chóng. Rồi một ngày, cổng thành bị đóng lại và không ai còn nghe tin tức gì về người lùn nữa. Một vài người trốn thoát khỏi thành phố khi nó đóng cửa đã kể lại những câu chuyện về một phù thủy điên rồ đã cướp ngôi vua, và thứ ma thuật khủng khiếp mà hắn đã học được cách sử dụng.
journal.document.intros.city.title=Thành phố của người lùn
journal.document.intros.discover_hint=Bạn có thể thấy đoạn văn này khi lần đầu tiên truy cập vào một khu vực cụ thể.
journal.document.intros.dungeon.body=Nhiều anh hùng đã mạo hiểm tiến vào hầm ngục trước bạn từ thành phố phía trên, hầu hết đều không còn được nghe tin tức gì nữa. Người ta nói rằng một thế lực tà ác cổ xưa đang ẩn náu trong lòng đất, canh giữ chiếc bùa hộ mệnh Yendor quyền năng. Ngay cả bây giờ, năng lượng hắc ám vẫn đang tỏa ra từ bên dưới, len lỏi lên thành phố. Liệu bạn có chinh phục được hầm ngục và giành lấy chiếc bùa hộ mệnh? Đã đến lúc bắt đầu cuộc phiêu lưu của riêng bạn!
journal.document.intros.dungeon.title=Ngục tối
journal.document.intros.halls.body=Những hành lang sâu thẳm của Thành phố Người Lùn đã bị biến chất bởi ma thuật hắc ám. Trong quá khứ, những vùng đất này là nơi cư ngụ của triều đình các pháp sư tinh nhuệ của Vua Người Lùn, nhưng giờ đây chúng dường như đã bị chiếm đoạt bởi một thứ gì đó còn nham hiểm hơn...\n\nMọi loại sinh vật ma quỷ kinh hoàng đều trú ngụ trong những hành lang này, được dẫn dắt bởi một thế lực hắc ám khủng khiếp. Nếu Vua Người Lùn không phải là nguồn gốc của sự tha hóa đang lan rộng, thì bất cứ thứ gì ở dưới đây chắc chắn phải là thủ phạm.\n\nHãy đọc kỹ, rất ít nhà thám hiểm từng xuống đến tận đây...
journal.document.intros.halls.discover_hint=Bạn có thể tìm thấy văn bản này trong một khu vực cụ thể, nhưng chỉ sau khi đã tìm thấy tất cả các văn bản trước đó trong bộ này.
journal.document.intros.halls.title=Sảnh Quỷ
journal.document.intros.prison.body=Nhiều năm trước, một nhà tù được xây dựng ở đây để giam giữ những tên tội phạm nguy hiểm. Được quản lý chặt chẽ và an ninh nghiêm ngặt, các tù nhân từ khắp nơi trên đất nước được đưa đến đây để thụ án. Nhưng chẳng bao lâu sau, một làn khí độc hại bắt đầu lan tỏa từ bên dưới, làm biến chất tâm trí của cả cai ngục và tù nhân. Để đối phó với tình trạng hỗn loạn ngày càng gia tăng, thành phố đã phong tỏa toàn bộ nhà tù. Không ai biết chuyện gì đã xảy ra với những người bị bỏ mặc cho chết bên trong những bức tường này...
journal.document.intros.prison.title=Nhà tù
journal.document.intros.sewers.body=Các tầng trên của hầm ngục thực chất là hệ thống cống rãnh của thành phố.\n\nKhi năng lượng hắc ám trỗi dậy từ bên dưới, những sinh vật cống rãnh vốn vô hại ngày càng trở nên hung dữ. Thành phố đã phải cử các đội tuần tra xuống đây để cố gắng đảm bảo an toàn cho những người ở phía trên.\n\nNơi này nguy hiểm, nhưng ít nhất ma thuật tà ác ở đây cũng yếu.
journal.document.intros.sewers.title=Cống rãnh
journal.document.intros.title=Giới thiệu khu vực
journal.document.prison_warden.discover_hint=Bạn có thể tìm thấy văn bản này trong một khu vực cụ thể, nhưng chỉ sau khi đã tìm thấy tất cả các văn bản trước đó trong bộ này.
journal.document.prison_warden.journal.body=Ngày 1 tháng 10 năm 362\n\nĐây là mục đầu tiên trong nhật ký công việc của quản ngục Kiana Smith. Với tất cả những gì đã xảy ra gần đây, tôi quyết định bắt đầu viết nhật ký để sắp xếp lại suy nghĩ của mình.\n\nQuản lý một nhà tù sâu nửa dặm dưới lòng đất chưa bao giờ là dễ dàng, nhưng gần đây dường như có một số hành vi gây rối có tổ chức đang xảy ra. Các tù nhân đã có những hành động bất thường mà không có lý do và sau đó từ chối giải thích tại sao.\n\nMột số lính canh bắt đầu nói rằng nơi này bị ma ám. Tôi không thể để người của mình lan truyền tin đồn, nhưng tôi cũng không thể trách họ vì cảm thấy bất an.\n- Smith
journal.document.prison_warden.journal.title=Việc ghi nhật ký
journal.document.prison_warden.letter.body=Thomas,\n\nCậu là một người bạn tuyệt vời, nên tôi đang giúp cậu một việc.\n\nKhi bắt đầu ca trực tối nay, hãy khóa và gia cố buồng giam của Tengu, ném chìa khóa vào một góc nào đó rồi ra ngoài. Không quan trọng các tù nhân khác có bị trông coi hay không, chẳng mấy chốc sẽ không ai có thể rời khỏi nơi này. Nhưng tên quái dị đó phải bị giam giữ, nếu hắn trốn thoát thì không biết hắn sẽ làm gì.\n\nĐừng nói với ai về chuyện này, và đừng bận tâm tìm tôi. Một thuyền trưởng phải chìm cùng con tàu của mình.\n- Kiana
journal.document.prison_warden.letter.title=Thư gửi Thomas
journal.document.prison_warden.mines.body=Ngày 54 tháng Mùa đông, 363\n\nMột nhóm kỹ sư từ thành phố đã đến hôm nay, nói rằng họ đến để bịt kín lối vào cũ của các mỏ bên dưới. Tôi cho rằng thành phố không muốn tốn công bảo trì lối đi này nữa. Như thường lệ, tôi không được thông báo trước.\n\nKỹ sư trưởng của họ cũng nói với tôi vài điều vô lý về ma thuật của người lùn rò rỉ từ các mỏ. Tôi không tin một lời nào trong số đó.\n\nTình hình đã được kiểm soát tốt hơn nhiều với đội ngũ nhân viên mới của chúng tôi, nhưng gốc rễ của vấn đề vẫn chưa được giải quyết. Chắc chắn có điều gì đó đang ảnh hưởng đến những người bị giam giữ ở đây, và việc phá bỏ một vài bức tường sẽ không thay đổi được điều đó.\n- Smith
journal.document.prison_warden.mines.title=Niêm phong các mỏ
journal.document.prison_warden.no_support.body=Ngày 11 tháng 10 năm 364\n\nThành phố đang nghĩ cái quái gì vậy? Sau khi khẩn cấp yêu cầu giúp đỡ, tôi chẳng nhận được phản hồi gì, thậm chí cả một lời xin lỗi sáo rỗng như họ thường gửi khi yêu cầu của tôi bị từ chối.\n\nTrong khi đó, tình hình của các tù nhân ngày càng tồi tệ hơn, và một số lính canh thậm chí còn bắt đầu gây rối. Họ định cứ để tình hình này tiếp diễn cho đến khi chúng ta phải đối phó với một cuộc bạo loạn sao!?\n\nThomas vẫn đáng tin cậy như mọi khi. Sự giúp đỡ về tổ chức của anh ấy là vô giá, và ý tưởng kích hoạt những thiết bị DM-100 cũ đó thật đáng tiếc nhưng cần thiết. Tôi tin tưởng mình có thể kiểm soát được tình hình này, tôi chỉ cần một chút hỗ trợ thôi!\n-Smith
journal.document.prison_warden.no_support.title=Không hỗ trợ
journal.document.prison_warden.recruits.body=Ngày 80 tháng 10 năm 362\n\nNhư đã hứa, một nhóm tân binh đã đến hôm nay. Có vẻ như cũng như thường lệ, một vài người triển vọng và rất nhiều người chỉ muốn nhận lương. Tuy nhiên, việc có thêm nhiều người mới này sẽ giúp ích rất nhiều trong việc xử lý những tù nhân khó bảo gần đây.\n\nTrong một công việc như thế này, điều quan trọng là phải biết ai là người đáng tin cậy. Một người mới được tuyển dụng, Thomas, có vẻ đặc biệt triển vọng. Tôi cần tất cả sự giúp đỡ có thể ngay bây giờ, vì vậy nếu anh ấy làm tốt, tôi sẽ xem xét việc thăng chức cho anh ấy nhanh chóng.\n- Smith
journal.document.prison_warden.recruits.title=Tân binh
journal.document.prison_warden.rotberry.body=Ngày 23 tháng 2 năm 363\n\nHôm nay nhận được một món quà đáng yêu từ Felix. Đó là một loại cây bụi màu đỏ tươi gọi là 'Rotberry'.\n\nTôi đã từng nói với anh ấy rằng nơi này thật ảm đạm, có vẻ như anh ấy đã lắng nghe. Theo anh ấy, loại cây này thực sự không thích ánh sáng và nước, vì vậy tôi chỉ cần tỉa lá khoảng một lần mỗi tháng. Việc tỉa lá chắc hẳn rất quan trọng, anh ấy đã nhắc đến nó cả chục lần trong thư.\n\nTất nhiên, Felix chẳng bao giờ làm gì miễn phí. Anh ấy nói rằng hạt giống mà cây này tạo ra rất tốt để làm đũa phép, vì vậy đương nhiên tôi nợ anh ấy vài hạt mỗi khi cây ra quả.\n- Smith
journal.document.prison_warden.rotberry.title=Cây dâu tằm
journal.document.prison_warden.title=Nhật ký của cai ngục
journal.document.sewers_guard.crabs.body=Ngày 11 tháng Mùa Đông, năm 376\nGửi Mẹ và Bố,\n\nNhư thể lũ chuột chưa đủ tệ, sâu hơn nữa dưới đó còn có những con cua khổng lồ! Một con trong số chúng lao ngay qua con và làm Lee bị thương khá nặng trước khi chúng con giết được nó. Thomas nói đó không phải lỗi của con, nhưng con biết anh ấy chỉ đang cố gắng tốt với con.\n\nMay mắn thay, trên đường ra, chúng con đã gặp một nhà thám hiểm có một ít thuốc mỡ cỏ mặt trời dự trữ. Lee có thể đã không qua khỏi nếu không có thứ đó.\n\nCon thấy nhà thám hiểm đang nhìn chằm chằm vào một bông hồng trước khi họ rời đi, họ nói đó là một món quà. Tại sao họ lại liều mạng xuống đây nếu có người quan tâm đến họ nhiều như vậy?\n\nĐó chính xác là những gì con đang làm phải không? Con cảm thấy mình đang gặp rắc rối lớn.
journal.document.sewers_guard.crabs.title=Cua khổng lồ!
journal.document.sewers_guard.dangerous.body=Ngày 88 tháng 2, năm 375\nKính gửi bố mẹ,\n\nCon hiểu tại sao lương lại cao như vậy rồi, cống rãnh đầy rẫy quái vật! 'Loài gây hại' và 'kẻ ngoài vòng pháp luật' là những con chuột khổng lồ khát máu và những bầy gnoll hung dữ.\n\nMay mắn thay, các thành viên còn lại trong nhóm của con đều biết việc mình đang làm. Đội trưởng Thomas là một chuyên gia trong lĩnh vực này. Con đang cố gắng học hỏi nhanh chóng để không trở thành gánh nặng quá lớn cho mọi người.\n\nCông việc này nguy hiểm hơn con tưởng rất nhiều. Con mừng là không thể gửi những thứ này bây giờ, con không muốn bố mẹ lo lắng.\n\nCon sẽ giữ an toàn,\n- Sonya
journal.document.sewers_guard.dangerous.title=Một vị trí nguy hiểm...
journal.document.sewers_guard.discover_hint=Bạn có thể tìm thấy văn bản này trong một khu vực cụ thể, nhưng chỉ sau khi đã tìm thấy tất cả các văn bản trước đó trong bộ này.
journal.document.sewers_guard.guild.body=Ngày 23 tháng Mùa đông, năm 376\nKính gửi bố mẹ,\n\nLần này không có quái vật mới nào cả, thay vào đó chúng con đã chạm trán một nhóm nhỏ từ hội trộm khi đang tuần tra.\n\nMọi thứ con nghe về hội trộm đều tệ, nhưng những người còn lại trong đội dường như khá thân thiện với họ. Thomas đã trao đổi thông tin và vật tư với một người trong số họ trước khi chúng con chia tay.\n\nCon không hiểu, chẳng phải chúng ta phải tiêu diệt bọn tội phạm sao? Thomas thậm chí còn nói đừng nhắc đến chuyện này với bất kỳ ai trong đội. Tuy nhiên, thông tin và vật tư của họ rất hữu ích, và chúng con không thể chịu đựng thêm bất kỳ cuộc chiến nào nữa.\n\nCon cho rằng tất cả chúng ta đều cùng chung số phận ở đây.
journal.document.sewers_guard.guild.title=Hội trộm
journal.document.sewers_guard.lost.body=Ngày 40 tháng Mùa đông, năm 376\n\nThomas và tôi bị lạc. Chúng tôi bị tách khỏi nhóm khi đang chiến đấu với một số gnoll. Cả hai chúng tôi đều không bị thương, nhưng hệ thống cống ngầm phía dưới giống như một mê cung.\n\nThomas nói rằng cậu ấy biết một lối ra, nhưng nó bắt đầu từ lối vào nhà tù cũ ở dưới cùng của hệ thống cống ngầm. Tôi thực sự không thích đi sâu hơn, nhưng chúng tôi không có lương thực và đi xuống nhanh hơn nhiều so với việc đi lang thang tìm đường tuần tra của chúng tôi.\n\nMọi chuyện sẽ ổn thôi. Thomas biết cậu ấy đang làm gì.
journal.document.sewers_guard.lost.title=Chúng ta lạc đường rồi
journal.document.sewers_guard.new_position.body=Ngày 85 tháng 2, năm 375\nKính gửi bố mẹ,\n\nCon đã nói với bố mẹ rồi, tất cả những nỗ lực ở đội bảo vệ thành phố sẽ được đền đáp. Con vừa được thăng chức!\n\nCon được mời tham gia một đội chuyên trách làm việc trong cống rãnh. Hình như ở đó có vấn đề với lũ chuột và tội phạm, và nhiệm vụ của chúng con là dọn sạch chúng. Công việc khá bẩn thỉu, nhưng cống rãnh ấm áp vào mùa đông và lương gấp ba lần so với công việc bảo vệ bình thường!\n\nTuy nhiên, mọi chuyện hơi bí mật nên con không thể gửi thư này được. Con cảm thấy kỳ lạ khi không được viết thư cho bố mẹ, vì vậy con vẫn sẽ tiếp tục viết. Có lẽ một ngày nào đó con có thể cho bố mẹ xem.\n\nKính gửi,\n- Sonya
journal.document.sewers_guard.new_position.title=Vị trí mới của tôi!
journal.document.sewers_guard.not_worth.body=Thomas và tôi đụng phải một con quái vật chất nhầy khổng lồ ở lối vào nhà tù. Trước khi chúng tôi kịp phản ứng, nó đã tấn công chúng tôi bằng phép thuật. Thomas hứng chịu hầu hết. Cậu ấy đã chết. Không có số tiền nào đáng giá bằng chuyện này. Tôi sẽ rời đi theo con đường mà Thomas đã chỉ cho tôi. Sau đó, tôi sẽ dùng số tiền mình kiếm được khi làm lính canh để đưa bố mẹ và tôi rời khỏi thành phố bị nguyền rủa này. Một phần trong tôi muốn hy vọng rằng nhà vua có kế hoạch cho tất cả chuyện này, nhưng tôi nghi ngờ điều đó. Tôi để lại những lá thư này như một lời cảnh báo cho những người khác. Không chỉ có những con chuột và cua khổng lồ, mà còn có điều gì đó rất bất ổn ở đây.
