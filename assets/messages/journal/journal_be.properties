journal.document.adventurers_guide.alchemy.body=Калі вы лічыце расходны прадмет непрыдатным, вы можаце выкарыстоўваць яго ў якасці алхімічнага інгрэдыента або ператварыць у універсальную алхімічную энергію. Энергетычныя зелля і скруткі таксама іх ідэнтыфікуюць!\n\nЦацанкі — гэта ўнікальны від рыштунку, які ствараецца і паляпшаецца з дапамогай алхіміі. Яны вырабляюцца з дапамогай чароўнага каталізатара для цацанак і невялікай колькасці алхімічнай энергіі.\n\n (Першы алхімічны гаршчок знаходзіцца на 3-м або 4-м паверсе падзямелля. Побач з гэтымі гаршкамі таксама ёсць старонкі кнігі рэцэптаў алхіміі.)
journal.document.adventurers_guide.alchemy.title=Алхімія і цацанкі
journal.document.adventurers_guide.dieing.body=Падзямелле — небяспечнае занятак, і большасць шукальнікаў прыгод у рэшце рэшт сустракаюць сваю гібель.\n\nУдача дапамагае, але найлепшыя шукальнікі прыгод выкарыстоўваюць кожную маленькую хітрасць, каб павялічыць свае шанцы.\n\n (Не засмучайцеся, калі вы часта паміраеце, гэтая гульня складаная! Засяродзьцеся на вывучэнні гульні і паступовым удасканаленні, а не на імгненнай перамозе.)
journal.document.adventurers_guide.dieing.title=Спраўляцца з паразай
journal.document.adventurers_guide.examining.body=Важна вывучаць сваіх ворагаў і наваколле, а не кідацца ўсляпую! Вазьміце за звычку вывучаць усё новае.\n\n (Вы можаце вывучаць, выкарыстоўваючы кнопку павелічальнага шкла, а затым выбіраючы тое, што хочаце вывучаць. Вы таксама можаце вывучаць узмацненні або аслабленні, выбіраючы іх значкі.)
journal.document.adventurers_guide.examining.title=Вывучэнне
journal.document.adventurers_guide.food.body=Эфектыўнае нарміраванне — адзін з найлепшых спосабаў павялічыць свае шанцы на выжыванне, бо не заўсёды трэба правільна харчавацца, калі адчуваеш голад!\n\nКалі вы не галадаеце, ваша здароўе будзе павольна аднаўляецца, таму, калі вы будзеце есці з поўным здароўем, гэтая рэгенерацыя будзе марнавацца!\n\nКалі вы будзеце есці, абапіраючыся на сваё здароўе, ежы хапіць значна даўжэй.
journal.document.adventurers_guide.food.title=Барацьба з голадам
journal.document.adventurers_guide.identifying.body=Колеры зелляў і сімвалаў на скрутках адрозніваюцца ў кожным падзямеллі. Неапазнанае абсталяванне можна палепшыць або зачараваць, калі пашанцуе, альбо яно можа быць праклятым!\n\nСкруткі ідэнтыфікацыі, паляпшэння або зняцця праклёну вельмі карысныя, калі вы хочаце знізіць рызыку выкарыстання неапазнанага абсталявання.\n\n (Вы можаце знайсці спіс усіх прадметаў, якія вы ідэнтыфікавалі, у раздзеле каталога вашага дзённіка)
journal.document.adventurers_guide.identifying.title=Ідэнтыфікацыя прадметаў
journal.document.adventurers_guide.intro.body=Вітаю, Шукальнік прыгод, вы чытаеце «Том майстэрства падзямелля»! Гэты даведнік лепш за ўсё выкарыстоўваць у якасці даведніка, і ён чароўным чынам падкажа вам, калі лепш чытаць кожную старонку. \n\n (Калі кнопка дзённіка міргае, націсніце яе, каб прачытаць, што расказвае вам даведнік! Аднак некаторых старонак не хапае, магчыма, вы зможаце знайсці іх у падзямеллі?)
journal.document.adventurers_guide.intro.title=Уводзіны
journal.document.adventurers_guide.levelling.body=Павышэнне ўзроўню павышае вашыя статыстычныя дадзеныя і дае ачкі талентаў, што можа значна паўплываць на баявыя вынікі. Лепш за ўсё мець хаця б адзін узровень для кожнага паверха падзямелля.\n\nМожа ўзнікнуць спакуса спяшацца і пазбягаць даследавання або бою, але гэта пазбавіць вас прыпасаў і вопыту.\n\n (Вы можаце ўбачыць інфармацыю пра свайго героя, у тым ліку вопыт, на панэлі стану ў куце гульнявога інтэрфейсу. Выберыце партрэт свайго героя, каб атрымаць яшчэ больш інфармацыі.)
journal.document.adventurers_guide.levelling.title=Набыццё вопыту
journal.document.adventurers_guide.looting.body=Пакоі, якія знаходзяцца за замкнёнымі дзвярыма або ў якіх ёсць перашкоды, звычайна маюць лепшую здабычу. Калі перашкода перашкаджае вам на шляху, вы звычайна можаце знайсці прадмет, які дапаможа вам, на тым жа паверсе.\n\nУ кожным пяціпавярховым падзямеллі заўсёды можна знайсці 2 зелля сілы і 3 скруткі паляпшэння, таму яны з'яўляюцца выдатным паказчыкам таго, наколькі добра вы даследуеце.\n\n (Вы можаце ўбачыць спіс славутасцяў і нявыкарыстаных ключоў на ўкладцы нататак у акне дзённіка.)
journal.document.adventurers_guide.looting.title=Эфектыўнае рабаванне
journal.document.adventurers_guide.magic.body=Магічныя атакі праразаюць браню і ад іх цяжка ўхіліцца. Гэта азначае, што пашкоджанні ад палачак вельмі надзейныя, але таксама робяць магічных ворагаў вельмі небяспечнымі!\n\nАднак магічныя атакі заўсёды маюць недахоп. Палачкі маюць абмежаваны зарад, і магічныя ворагі звычайна не могуць выкарыстоўваць сваю магію зблізку.\n\nСутыкаючыся з ворагамі, якія выкарыстоўваюць магію, важна навучыцца не дапускаць яе выкарыстання супраць вас.
journal.document.adventurers_guide.magic.title=Магічныя атакі
journal.document.adventurers_guide.positioning.body=Стратэгія гэтак жа важная, як і рыштунак. Непрыемных сітуацый, такіх як акружэнне, звычайна можна пазбегнуць, добра размясціўшыся.\n\nНапрыклад, большасць падзямелляў маюць вузкія калідоры, якія прымушаюць ворагаў змагацца з вамі па адным. У гэтых калідорах часта ёсць дзвярныя праёмы для нечаканых нападаў!\n\nЁсць таксама шмат дробных спосабаў выкарыстоўваць у сваіх інтарэсах такія элементы навакольнага асяроддзя, як трава, вада, ямы або пасткі.
journal.document.adventurers_guide.positioning.title=Пазіцыянаванне
journal.document.adventurers_guide.searching.body=Падзямелля поўныя сакрэтных дзвярэй і пастак, якія на першы погляд здаюцца нябачнымі. Калі падазраяце, што побач схаваныя дзверы ці пастка, можаце выдаткаваць некаторы час і ўважліва пашукаць. \n\n (Вы можаце абшукаць усе пліткі вакол сябе, двойчы націснуўшы кнопку павелічальнага шкла. Магчыма, побач з тым месцам, дзе вы знайшлі гэтую старонку, ёсць нейкія схаваныя дзверы!)
journal.document.adventurers_guide.searching.title=Пошук
journal.document.adventurers_guide.strength.body=Няма часу трэніравацца са зброяй і даспехамі, якія вы знойдзеце ў падзямеллі, таму вам спатрэбіцца грубая сіла, каб эфектыўна імі карыстацца.\n\nЗелля сілы і скруткі паляпшэння — найбольш эфектыўны спосаб задаволіць патрабаванні да сілы рыштунку вышэйшага ўзроўню.\n\nВажна ў рэшце рэшт пачаць выкарыстоўваць прадметы высокага ўзроўню, але не ігнаруйце рыштунак, якім вы можаце карыстацца прама зараз.
journal.document.adventurers_guide.strength.title=Сіла
journal.document.adventurers_guide.surprise_attacks.body=Нечаканыя атакі гарантавана трапныя, што робіць іх асабліва карыснымі супраць няўлоўных ворагаў, такіх як змеі і прывіды.\n\nВы можаце здзівіць ворагаў адразу пасля таго, як яны ўвойдуць у дзвярны праём, пераследуючы вас, або калі яны іншым чынам страцяць вас з поля зроку.
journal.document.adventurers_guide.surprise_attacks.title=Нечаканыя напады
journal.document.adventurers_guide.title=том майстэрства падзямелля
journal.document.adventurers_guide.upgrades.body=Чым глыбей вы апускаецеся ў падзямелле, тым важней выкарыстоўваць магічна паляпшанае рыштунак высокага ўзроўню, але вам таксама спатрэбіцца сіла, каб правільна ім карыстацца.\n\nЖалезныя палачкі, пярсцёнкі і артэфакты не патрабуюць сілы, але маюць абмежаванае прымяненне або не так непасрэдна дапамагаюць у баі.\n\nПрымаць правільны выбар паляпшэнняў вельмі важна для выжывання на пачатку падзямелля і для таго, каб дасягнуць поспеху ў наступным падзямеллі.
journal.document.adventurers_guide.upgrades.title=Паляпшэнні
journal.document.alchemy_guide.bombs.body=Стандартную бомбу з чорным порахам можна змяшаць з пэўным прадметам, каб стварыць палепшаную бомбу.
journal.document.alchemy_guide.bombs.title=Палепшаныя бомбы
journal.document.alchemy_guide.brews_elixirs.body=Зёлкі і эліксіры — гэта складаныя зелля з рознымі эфектамі, звычайна пры аднаразовым ужыванні.
journal.document.alchemy_guide.brews_elixirs.title=напоі і эліксіры
journal.document.alchemy_guide.energy_food.body=Многія рэцэпты патрабуюць крыштальнай алхімічнай энергіі, якая атрымліваецца шляхам дэканструкцыі расходных матэрыялаў у алхімічным гаршку. Энергетычныя зелля або скруткі таксама дазваляюць іх ідэнтыфікаваць.\n\nНекаторыя рэцэпты, якія патрабуюць энергіі, з'яўляюцца магічнымі, але гэтыя нагадваюць традыцыйную кулінарыю.
journal.document.alchemy_guide.energy_food.title=Энергетыка і прадукты харчавання
journal.document.alchemy_guide.exotic_potions.body=Зелля можна змешваць з энергіяй для стварэння экзатычных зелляў. Яны маюць больш магутныя эфекты, але часта карысныя па-рознаму.
journal.document.alchemy_guide.exotic_potions.title=экзатычныя зелля
journal.document.alchemy_guide.exotic_scrolls.body=Экзатычныя скруткі можна зрабіць з дапамогай энергіі і скрутка. Яны крыху мацнейшыя і даражэйшыя за экзатычныя зелля.
journal.document.alchemy_guide.exotic_scrolls.title=экзатычныя скруткі
journal.document.alchemy_guide.potions.body=Сардэчна запрашаем у «Практычнае прымяненне алхіміі»! Гэтая кніга — даведнік рэцэптаў для вырабу прадметаў у алхімічным гаршку. \n\nПачнем з самага знакавага рэцэпту: зелля! \n\nВыкарыстоўвайце тры насенне, каб прыгатаваць выпадковае зелле! Кожнае насенне мае свой аналаг, выкарыстоўвайце некалькі аднолькавых насення, каб павялічыць верагоднасць таго, што зелле звязана з насеннем, якое вы выкарысталі.
journal.document.alchemy_guide.potions.title=Уступ і зелля
journal.document.alchemy_guide.spells.body=Загаворы ўтрымліваюцца ў крышталях і забяспечваюць розныя эфекты, звычайна з некалькімі спосабамі выкарыстання.
journal.document.alchemy_guide.spells.title=загаворы
journal.document.alchemy_guide.stones.body=Калі пакласці скрутак у алхімічны гаршчок, магія напоўніцца двума камянямі ўнутры гаршка. Гэта дапаможа стварыць рунічныя камяні і ідэнтыфікаваць скрутак!
journal.document.alchemy_guide.stones.title=Стварэнне рунічных камянёў
journal.document.alchemy_guide.title=Кіраўніцтва па алхіміі
journal.document.alchemy_guide.weapons.body=Некаторую з больш лёгкай або больш магічнай зброі можна выкарыстоўваць у алхіміі!\n\nКожны камплект кінутай зброі вырабляе дастаткова вадкага металу, каб цалкам адрамантаваць іншы камплект таго ж узроўню і рангу. Звярніце ўвагу, што алхімізацыя камплекта знішчыць увесь камплект, нават калі ён не цалкам прысутнічае!\n\nАдна палачка вырабляе дастаткова таямнічай смалы, каб палепшыць дзве палачкі аднаго ўзроўню, але не вышэй за +3.
journal.document.alchemy_guide.weapons.title=Паляпшэнне зброі
journal.document.caves_explorer.alive.body=23-га лета, 308\n\nАдна з гномскіх машын неяк ажыла! Мы проста праходзілі міма, калі яна накінулася на нас і ледзь не раздушыла двух нашых сяброў сваімі велізарнымі металічнымі кулакамі. На шчасце, у мяне з сабой была палачка распаду. Некалькі трапных стрэлаў — і гэтая пачвара ператварылася ў металалом.\n\nМяне турбуе тое, што мы абсалютна нічога не зрабілі, каб справакаваць машыну. Гномы ніяк не маглі распрацаваць машыны настолькі агрэсіўнымі, быццам яны спрабавалі ўладкаваць нам засаду!\n\nПрынамсі, я змог хоць раз дапамагчы сваім спадарожнікам.\n — Арчыбальд
journal.document.caves_explorer.alive.title=Яно жывое!
journal.document.caves_explorer.city.body=21 лета, 308\n\nМы ўжо на трохтыднёвай адзнацы, і пасля таго, як большую частку апошніх дзесяці дзён мы правялі, апускаючыся ўсё глыбей у карты, мы нарэшце дасягнулі дна шахт. Мы знайшлі розныя металічныя прылады і вялікую браму, якая блакуе ўваход у стары гномскі мегаполіс.\n\nКаваль папярэдзіў нас пра некаторыя з гэтых механізмаў. Відавочна, яны былі прызначаны для абароны тэрыторыі і маюць тэндэнцыю актывавацца, калі іх парушаць. Нам няма чаго рабіць у горадзе, і метал будзе мець мінімальную каштоўнасць для лому, таму мы вырашылі прыслухацца да яго папярэджання і вярнуцца.\n\nПрызнаюся, мне было цікава, але даследаваць там, унізе, безумоўна, не варта было рызыкі.\n - Арчыбальд
journal.document.caves_explorer.city.title=Уваход у горад
journal.document.caves_explorer.discover_hint=Вы можаце знайсці гэты тэкст у пэўным рэгіёне, але толькі пасля таго, як знойдзеце ўсе папярэднія тэксты ў гэтым наборы.
journal.document.caves_explorer.expedition.body=1-га лета, 308\n\nСёння пачынаецца наша чатырохтыднёвая экспедыцыя ў закінутыя гномскія шахты! Сам кароль даручыў мне даследаваць рэгіён. Мае галоўныя мэты — знайсці любыя невыкарыстаныя прыродныя рэсурсы і абследаваць пячоры для магчымага праекта будаўніцтва турмы.\n\nХоць я і здольны абараняць сябе, па патрабаванні караля я прыняў эскорт ад гарадской варты. Яны — купка прастакоў, але пакуль яны мяне не запавольваюць, іх прысутнасць цярпімая.\n\nЧакаецца, што мы ачысцім каналізацыю і дабярэмся да шахт да вечара.\n — Арчыбальд Драманд. Архімаг, паўднёвы інстытут чараўніцтва.
journal.document.caves_explorer.expedition.title=Пачатак экспедыцыі!
journal.document.caves_explorer.gold.body=4-е лета, 308\n\nНашы першыя некалькі дзён былі сапраўды вельмі плённымі! Пасля ўстаноўкі базавага лагера мы адправіліся даследаваць некаторыя верхнія зоны закінутай шахты. Хоць гномы пакінулі шмат бескарыснага смецця, многія сцены пячоры таксама кішаць золатам!\n\nНа жаль, мы тут не першыя. Пячоры поўныя агрэсіўнай дзікай прыроды, і, здаецца, зграі гнолаў таксама зацікаўлены ў золаце. Прызнаюся, я быў несправядлівы да свайго эскорту-ахоўніка, яны аказаліся значна больш здольнымі даследчыкамі і целаахоўнікамі, чым я чакаў.\n\nНават з гэтым поспехам нам усё яшчэ трэба даследаваць шмат шахт.\n - Арчыбальд
journal.document.caves_explorer.gold.title=Столькі золата!
journal.document.caves_explorer.report.body=28 лета, 308\n\nСёння мы скончым збіраць рэчы і будзем рыхтавацца да ад'езду. Якраз своечасова некалькім членам нашай групы пачалі сніцца жудасныя кашмары пасля інцыдэнту з агрэсіўнай машынай. Хутчэй за ўсё, гэта проста стомленасць, але ўсе іх кашмары трывожна падобныя.\n\nКарацей кажучы, верхнія ўчасткі шахты даволі бяспечныя. Калі б можна было знайсці прымяненне для цёмнага золата, то здабыча яго магла б быць даволі прыбытковай. Вялікія адкрытыя прасторы таксама выдатна падыдуць для будаўнічых планаў горада. Аднак ніжнія шахты больш небяспечныя, і іх варта пазбягаць.\n\nЯ напішу ўсё гэта ў сваёй канчатковай справаздачы ў бліжэйшыя некалькі дзён.\n - Арчыбальд
journal.document.caves_explorer.report.title=Заключная справаздача
journal.document.caves_explorer.title=Журнал даследчыка
journal.document.caves_explorer.troll.body=11-е лета, 308\n\nПачаўшы даследаванне сярэдзіны шахтаў, мы сустрэлі прыязны твар! Ну... адносна прыязны. Пячорны троль стварыў там невялікую кузню. Ён грубы і не вельмі гаваркі, але адрамантаваў наша абсталяванне ў абмен на трохі золата.\n\nНа жаль, троль-каваль таксама паведаміў нам, што ўсё гэта цудоўнае золата не такое добрае, як здаецца. Ён называе яго «цёмным золатам», і, відаць, яно хутка разбураецца на сонечным святле. Гэта, безумоўна, тлумачыць, чаму тут ніколі не было канфліктаў з-за рэсурсаў.\n\nМяркую, нам трэба капнуць крыху глыбей, каб паглядзець, ці ёсць што-небудзь больш каштоўнае.\n - Арчыбальд
journal.document.caves_explorer.troll.title=Сустрэў троля
journal.document.city_warlock.discover_hint=Вы можаце знайсці гэты тэкст у пэўным рэгіёне, але толькі пасля таго, як знойдзеце ўсе папярэднія тэксты ў гэтым наборы.
journal.document.city_warlock.failure.body=Здаецца, я таксама дурань. Я меркаваў, што Новаму Каралю патрэбна добраахвотная пакора двара, але цяпер я бачу, што ён мае сілу кантраляваць нават тых, хто яму супраціўляецца.\n\nЯ сляпа прывёў усіх наймацнейшых праціўнікаў прама да свайго парога, каб асабіста ператварыць іх у сваіх рабоў. Цяпер хвалі яго некратычнай энергіі праносяцца па горадзе, імгненна ператвараючы большасць у яго просьбітаў.\n\nТыя нямногія, хто яшчэ мае свабоду волі, уцякаюць. Я вырашыў застацца, каб як мага лепш назіраць і шукаць праход. З маёй магічнай сілай я павінен мець магчымасць заставацца схаваным і ў бяспецы некаторы час.
journal.document.city_warlock.failure.title=Няўдача
journal.document.city_warlock.more_powerful.body=Сачыць за часам стала складана, але прайшоў прыкладна тыдзень з майго апошняга запісу. Наша цывілізацыя сапраўды развалілася. Брамы зачыненыя, усе функцыі нашага грамадства спыніліся, і па калідорах блукаюць пустыя абалонкі гномаў.\n\nПраз усё гэта Новы Кароль неяк становіцца яшчэ больш магутным. З кожным днём сіла яго волі мацнее, але яна таксама змяняецца. Я не магу гэта апісаць, але адчуванне такое, быццам ён ужо зусім не гном.\n\nЯ пачынаю мірыцца з тым, што лепшае, на што я магу спадзявацца, — гэта задакументаваць гэтыя падзеі. Я застануся тут столькі, колькі змагу, а потым адыду, як толькі мая воля пачне слабець.
journal.document.city_warlock.more_powerful.title=Больш магутны
journal.document.city_warlock.new_power.body=Што тут адбываецца? Сіла, якая зыходзіць ад Новага Караля, сапраўды адрозніваецца ад той, што была спачатку, але ёсць і нешта іншае. Здаецца, што гэтая новая сіла выпраменьваецца з самых унутраных залаў нашага горада.\n\nЯшчэ больш дзіўна тое, што актыўнасць у верхнім мегаполісе таксама знізілася. Я не ведаю, што адбываецца там, унізе, але гэта прыцягвае амаль усю ўвагу Новага Караля.\n\nВяртанне ў глыбокія залы будзе небяспечным, але я павінен высветліць, што выклікае гэтую змену. Магчыма, у Новага Караля ўсё ж ёсць слабасць?
journal.document.city_warlock.new_power.title=Новая сіла
journal.document.city_warlock.old_king.body=5-ы дзень 2-га месяца 33-га года эпохі магіі. Калі гэта чытае жыхар Звышсвету, то гэта недзе зіма 264 года. Мяне завуць Тымор Захір, і, наколькі мне вядома, я апошні выжылы член двара гномаў.\n\nНаш кароль мёртвы, яго месца заняў адзін з маіх былых калег, які звар'яцеў ад улады. Астатнія члены двара падпарадкаваліся яму, як дурні, і ў працэсе страцілі свабоду волі. Толькі я прадбачыў гэта і ўцёк, перш чым яго рытуал паспеў быць завершаны.\n\nУнутранае кола ўпала, але ўлада Новага Караля яшчэ не дасягнула ўсіх. Я павінен як мага хутчэй арганізаваць супраціў. Я адмаўляюся дазволіць нашай цудоўнай цывілізацыі падзенню перад гэтым мегаламанам!
journal.document.city_warlock.old_king.title=Кароль мёртвы
journal.document.city_warlock.resistance.body=Здаецца, вестка хутка разышлася. Прайшло ўсяго некалькі дзён, а я ўжо сабраў невялікую армію верных Старому Каралю. Мала хто валодае магіяй, але амаль увесь ордэн манахаў-ваяроў сярод нас. Мы павінны быць больш чым роўнымі аднаму вар'яту гному і яго двару рабоў.\n\nТым часам Новы Кароль схаваўся ва ўнутраных пакоях нашага горада. Без сумневу, ён выдаткаваў большую частку сваёй сілы і спадзяецца акрыяць, перш чым сустрэне новы супраціў.\n\nМы пачнем атаку праз пару гадзін. Калі пашанцуе, мы зможам сфармаваць часовую раду і вярнуць стабільнасць нашаму цудоўнаму гораду да канца ночы.
journal.document.city_warlock.resistance.title=Супраціў
journal.document.city_warlock.seen_it.body=Я бачыў тое, што ляжыць унізе, але не магу гэтага апісаць. Мае рукі некантралюема трасуцца, калі я спрабую выкласці свае думкі на паперы.\n\nЧаму гэта адбываецца? Ці зрабіў гэта Новы Кароль? Гэта не мае сэнсу. Магчыма, яго бессэнсоўнае выкарыстанне ўлады прыцягнула гэта? Я спадзяваўся выратаваць нашу цывілізацыю, але цяпер я бачу, што на карту пастаўлены ўвесь свет.\n\nНеяк так, кароль — меншае зло. У мяне няма іншага выбару, дзеля большага дабра я аддамся. Калі ласка, вядзі мяне, мой кароль, выкарыстоўвай мяне як інструмент, каб стрымаць Ёг-Дзеву!
journal.document.city_warlock.seen_it.title=Я бачыў гэта
journal.document.city_warlock.title=Дзённік чарадзея
journal.document.halls_king.amulet.body=Я ЗРАБІЎ ГЭТА!\n\nЯ не ведаў, што менавіта магу знайсці, але тое, што я адкрыў там, пераўзыходзіла мае самыя смелыя здагадкі. Столькі сілы, якая проста ляжыць тут, гатовая быць узятай, і ўсё гэта маё!\n\nЗ гэтым ніводзін з дурняў пры двары не адважыцца супраціўляцца мне. Я проста галавакружны, думаючы пра ўсе розныя спосабы, якімі я магу іх прынізіць. Чорт вазьмі, навошта спыняцца на гэтым, у мяне дастаткова сілы, каб знішчыць усіх да апошняга з іх, калі захачу! Гэта можа быць празмернасцю, але я не павінен занадта доўга вырашаць, інакш яны западозраць нешта.\n\nЯ думаю, што я назаву гэтую вялікую сілу Амулетам Ендора!\n- R.
journal.document.halls_king.amulet.title=Амулет
journal.document.halls_king.attrition.body=У мяне ёсць план, як справіцца з гэтай істотай. Яе сіла бясконцая, але яе здольнасць пранікаць у гэты свет — не. Яна спадзяецца на паслугачоў і аватараў, пакуль спрабуе набрацца дастатковай сілы, каб забраць амулет.\n\nХоць я фізічна не валодаю амулетам, я ўсё яшчэ маю поўны кантроль над яго сілай. Маючы ў сваім распараджэнні ўвесь гномскі горад, я таксама маю колькасную перавагу. Я магу проста працягваць пасылаць салдат, каб не даць ёй захапіць амулет, і паступова выйграваць гэтую вайну праз знясіленне!\n\nI, РОДНІ, КАРАЛЬ ГНОМАЎ, ПЕРАЖЫВЕ ЦЯБЕ, ЁГ-ДЗЕВА!
journal.document.halls_king.attrition.title=Зніжэнне
journal.document.halls_king.discover_hint=Вы можаце знайсці гэты тэкст у пэўным рэгіёне, але толькі пасля таго, як знойдзеце ўсе папярэднія тэксты ў гэтым наборы.
journal.document.halls_king.new_king.body=Я КАРАЛЬ, АХАХАХАХААА!\n\nЯны проста дазволілі мне гэта зрабіць! Амаль без усялякіх перакананняў яны пагадзіліся дазволіць мне «падзяліцца» гэтай уладай з імі ў вялікім рытуале. У імгненне вока яны ператварыліся з хору насмешлівых галасоў у мой новы двор маўклівых падданых!\n\nЯк і чакалася, Тымор уцёк, як баязлівец, пры першых прыкметах непрыемнасцей. Я ўжо адчуваю сілу супраціву, якую ён нарошчвае. Думаю, я дазволю яму працягваць, каб ён мог даставіць усіх сваіх змоўшчыкаў прама да маіх дзвярэй!\n\nВідавочна, што каралеўства таксама мяне не паважае, мабыць, я і гэта выпраўлю.\n - Кароль гномаў
journal.document.halls_king.new_king.title=Новы кароль
journal.document.halls_king.rejection.body=ДУРНІ!\n\nЗа апошнія 33 гады наша каралеўства квітнела дзякуючы нашай новай магічнай тэхналогіі. Мы навучыліся заклікаць духаў стыхій і падпарадкоўваць іх сваёй волі, але неяк цяпер далейшыя эксперыменты «занадта небяспечныя».\n\nЯ ведаю, што адбываецца на самой справе. Адмова ад маіх тэорый не мае нічога агульнага з іх вартасцямі і цалкам звязана з чалавекам, які іх прапануе. Яны, напэўна, усе смяюцца з мяне за маёй спіной.\n\nНу, больш няма! Мне ўсё роўна, што яны кажуць, я буду даследаваць самыя далёкія куткі нашага Сусвету адзін і пакіну ўсё, што адкрыю, для сябе!\n- Р.
journal.document.halls_king.rejection.title=Адмова
journal.document.halls_king.ritual.body=Тымар публічна сутыкнуўся са мной сёння і настойваў на тым, каб я растлумачыў сваю новую крыніцу сілы. Я адмахнуўся ад яго як мог, але зноў адчуваю на сабе асуджальныя позіркі астатніх прыдворных.\n\nЯ спадзяваўся правесці яшчэ трохі часу, атрымліваючы асалоду ад цішыні перад бурай, але гэта не мае асаблівага значэння. Я вырашыў, што хачу рабіць. Я буду сцвярджаць, што атрымаў сваю сілу праз новы рытуал, і прапаную правесці яго на іншых чарадзеях і каралі. Пасля заканчэння рытуалу я стану каралём!\n\nТымар, вядома, будзе пярэчыць, але з такой вялікай прапановай сілы я сумняваюся, што яны яго паслухаюць!\n\nУСЕ ПАКЛОНЯЦЦА ПЕРАД МНОЙ!\n - Будучы кароль гномаў
journal.document.halls_king.ritual.title=Рытуал
journal.document.halls_king.thing.body=Ёсць праблема. Тымара пазбавілі без асаблівых высілкаў, але, здаецца, мае пошукі ў знешніх планах не засталіся незаўважанымі.\n\nНешта... "рэч"... прыцягнулася ў мой свет і пачынае прабівацца ўніз па ніжніх залах. Каб яшчэ больш ускладніць сітуацыю, гэта менавіта тое месца, дзе я захоўваў амулет! Такая зласлівая істота, чаму яна павінна спрабаваць пазбавіць мяне маёй сілы, калі там яшчэ шмат чаго трэба ўзяць?\n\nНягледзячы на маю сілу, я не думаю, што магу проста кінуцца і змагацца з ёй. Яго сапраўдная сіла неспасціжная, але павінен быць нейкі спосаб яе абмежаваць. Я АБАРАНІЦУ СВОЙ ПРЫЗ!
journal.document.halls_king.thing.title=Рэч
journal.document.halls_king.title=Дзённік ???
journal.document.intros.caves.body=Гэтыя маланаселеныя пячоры распасціраюцца пад закінутай турмой. Багатыя на карысныя выкапні, яны калісьці былі цэнтрам ажыўленага гандлю і прамысловасці для гномскага грамадства ўнізе, але былі закінутыя, бо гномы сталі апантаныя цёмнай магіяй.\n\nЦяпер пячоры ў асноўным населены падземнымі дзікімі жывёламі, гноламі і закінутай тэхнікай; верагодна, сапсаваны той жа сілай, якая паўплывала на рэгіёны вышэй.
journal.document.intros.caves.title=Пячоры
journal.document.intros.city.body=Гномская метраполія калісьці была найвялікшым з усіх гномскіх гарадоў-дзяржаў. У часы свайго росквіту гномы будавалі цудоўныя машыны з металу і магіі, якія дазвалялі іх гораду хутка пашырацца.\n\nА потым аднойчы гарадскія вароты былі зачыненыя, і больш ніхто не чуў пра гномаў. Тыя нямногія, хто ўцёк з горада, калі ён зачыняўся, расказвалі гісторыі пра вар'ята, які скраў трон, і пра жудасную магію, якую ён навучыўся выкарыстоўваць.
journal.document.intros.city.title=Гномская метраполія
journal.document.intros.discover_hint=Вы можаце знайсці гэты тэкст, калі ўпершыню ўвойдзеце ў пэўны рэгіён.
journal.document.intros.dungeon.body=Шмат герояў адважыліся спусціцца ў падзямелле перад вамі з горада наверсе, але пра большасць з іх больш ніколі не чулі.\n\nКажуць, што ў глыбінях хаваецца старажытнае зло, якое ахоўвае ўсемагутны Амулет Ендора. Нават цяпер цёмная энергія выпраменьваецца знізу, прабіраючыся ў горад.\n\nЦі пераможаце вы падзямелле і атрымаеце амулет? Прыйшоў час пачаць свае ўласныя прыгоды!
journal.document.intros.dungeon.title=Падзямелле
journal.document.intros.halls.body=Гэтыя глыбокія залы гномскай метраполіі былі скажоныя цёмнай магіяй. У мінулым у гэтых рэгіёнах размяшчаўся двор элітных чарадзеяў Караля гномаў, але цяпер, здаецца, іх захапіла нешта яшчэ больш злавеснае... \n\nУ гэтых залах насяляюць ўсялякія жахлівыя дэманічныя істоты, якімі кіруе нейкая жудасная цёмная сіла. Калі Кароль гномаў не быў крыніцай распаўсюджвання карупцыі, то што б там ні было тут, мусіць быць. \n\nСтупайце асцярожна, вельмі мала шукальнікаў прыгод спускаліся так глыбока...
journal.document.intros.halls.discover_hint=Вы можаце знайсці гэты тэкст у пэўным рэгіёне, але толькі пасля таго, як знойдзеце ўсе папярэднія тэксты ў гэтым наборы.
journal.document.intros.halls.title=Дэманныя залы
journal.document.intros.prison.body=Шмат гадоў таму тут была пабудавана турма для небяспечных злачынцаў. Сюды прывозілі асуджаных з усёй краіны, якія строга кантраляваліся і ахоўваліся.\n\nАле неўзабаве знізу пачалі папаўзаць цёмныя міязмы, якія бянтэжаць як ахоўнікаў, так і зняволеных.\n\nУ адказ на нарастаючы хаос горад зачыніў усю турму. Ніхто не ведае, што сталася з тымі, хто застаўся паміраць у гэтых сценах...
journal.document.intros.prison.title=Турма
journal.document.intros.sewers.body=Верхнія паверхі падзямелля насамрэч уяўляюць сабой каналізацыйную сістэму горада.\n\nЦёмная энергія падкралася знізу, і звычайна бяскрыўдныя каналізацыйныя істоты сталі ўсё больш лютымі. Гораду давялося адправіць сюды вартавыя патрулі, каб паспрабаваць забяспечыць бяспеку для тых, хто знаходзіцца наверсе.\n\nГэта месца небяспечнае, але, прынамсі, злая магія, якая тут дзейнічае, слабая.
journal.document.intros.sewers.title=Каналізацыя
journal.document.intros.title=Уводзіны ў рэгіён
journal.document.prison_warden.discover_hint=Вы можаце знайсці гэты тэкст у пэўным рэгіёне, але толькі пасля таго, як знойдзеце ўсе папярэднія тэксты ў гэтым наборы.
journal.document.prison_warden.journal.body=1-га вясны, 362\n\nГэта першы запіс у працоўным дзённіку начальніцы турмы Кіяны Сміт. З улікам усяго, што адбывалася апошнім часам, я вырашыла пачаць весці дзённік, каб падтрымліваць парадак у сваіх думках.\n\nКіраваць турмой на паўмілі пад зямлёй ніколі не было лёгка, але апошнім часам здаецца, што адбываюцца нейкія арганізаваныя беспарадкі. Зняволеныя пачалі паводзіць сябе непрыстойна без прычыны, а потым адмаўляюцца тлумачыць, чаму.\n\nНекаторыя ахоўнікі пачынаюць казаць, што ў гэтым месцы водзяцца прывіды. Я не магу дазволіць сваім людзям распаўсюджваць чуткі, але я не магу вінаваціць іх у тым, што яны неспакойныя.\n - Сміт
journal.document.prison_warden.journal.title=Вядзенне дзённіка
journal.document.prison_warden.letter.body=Томас, \n\nТы быў выдатным сябрам, таму я раблю табе паслугу.\n\nКалі сёння ўвечары пачнецца змена, замкні і ўмацуй камеру Тэнгу, кінь ключ у якую-небудзь нішу і выйдзі. Не мае значэння, ці застануцца іншыя зняволеныя без нагляду, вельмі хутка ніхто не зможа пакінуць гэтае месца. Але гэты вырадак павінен быць у бяспецы, калі ён уцячэ, невядома, што ён зробіць.\n\nНікому пра гэта не кажы і не турбуйся мяне шукаць. Капітан мусіць пайсці на дно разам са сваім караблём.\n - Кіяна
journal.document.prison_warden.letter.title=Ліст да Томаса
journal.document.prison_warden.mines.body=54-я Зіма, 363\n\nA Сёння прыехала група інжынераў з горада і сказала, што яны тут, каб запячатаць стары ўваход у шахты ўнізе. Мяркую, горад больш не хоча турбавацца аб абслугоўванні праходу. Мяне, як звычайна, загадзя не папярэдзілі.\n\nІх галоўны інжынер таксама расказаў мне нейкую лухту пра гномскую магію, якая прасочваецца з шахтаў. Я не веру ніводнаму слову.\n\nСітуацыя значна лепш кантралюецца нашымі новымі супрацоўнікамі, але корань праблемы ўсё яшчэ не вырашаны. Нешта дакладна ўплывае на зняволеных тут, і зруйнаванне некалькіх сцен гэтага не зменіць.\n - Сміт
journal.document.prison_warden.mines.title=Герметызацыя шахтаў
journal.document.prison_warden.no_support.body=11-я вясна, 364\n\nШто, чорт вазьмі, думае горад? Пасля тэрміновага запыту аб дапамозе я нічога не пачуў, нават пустых прабачэнняў, як яны звычайна дасылаюць, калі мае просьбы адхіляюць.\n\nТым часам зняволеным становіцца ўсё горш, а некаторыя ахоўнікі нават пачалі ствараць праблемы. Няўжо яны плануюць проста дазволіць гэтаму пагаршацца, пакуль мы не сутыкнемся з бунтам!?\n\nТомас застаўся надзейным, як і заўсёды. Яго арганізацыйная дапамога была неацэннай, а яго ідэя актываваць тыя старыя адзінкі DM-100 была шкадавай, але неабходнай. Я ўпэўнены, што змагу авалодаць гэтай сітуацыяй, мне проста патрэбна праклятая падтрымка!\n-Сміт
journal.document.prison_warden.no_support.title=Няма падтрымкі
journal.document.prison_warden.recruits.body=80-я вясна, 362\n\nЯк абяцалі, сёння прыбыла куча новых супрацоўнікаў. Здаецца, як звычайна, некалькі перспектыўных і шмат хлопцаў, якія проста хочуць заробку. Тым не менш, наяўнасць усіх гэтых новых сіл павінна вельмі дапамагчы з нашымі нядаўнімі непаслухмянымі зняволенымі.\n\nУ такой працы важна ведаць, каму можна давяраць. Адзін новы супрацоўнік, Томас, здаецца асабліва перспектыўным. Мне патрэбна ўся магчымыя сродкі дапамогі прама зараз, таму, калі ў яго ўсё атрымаецца, я паспрабую хутка дамагчыся яго павышэння.\n - Сміт
journal.document.prison_warden.recruits.title=Новыя рэкруты
journal.document.prison_warden.rotberry.body=23 восені, 363\n\nАтрымала сёння цудоўны падарунак ад Фелікса. Гэта нейкі ярка-чырвоны хмызняк пад назвай «Гніль».\n\nЯ ўжо казала яму, якое змрочнае гэтае месца, здаецца, ён слухаў. Паводле яго слоў, гэтая расліна насамрэч не любіць святло і ваду, таму мне проста трэба абрэзваць лісце раз на месяц ці каля таго. Але абрэзка, напэўна, важная, ён згадваў пра гэта дзясятак разоў у сваім лісце.\n\nВядома, Фелікс ніколі нічога не робіць бясплатна. Ён кажа, што насенне, якое гэтая штука дае, выдатна падыходзіць для вырабу чароўных палачак, таму, натуральна, я павінна яму некалькі кожны раз, калі расліна дае іх.\n- Сміт
journal.document.prison_warden.rotberry.title=Расліна гнільніцы
journal.document.prison_warden.title=Дзённік наглядчыка
journal.document.sewers_guard.crabs.body=11-е зімы, 376\nДарагія мама і тата,\n\nКалі б пацукі былі недастаткова дрэннымі, дык яшчэ глыбей унізе жывуць гіганцкія крабы! Адзін з іх прарваўся прама міма мяне і моцна зачапіў Лі, перш чым мы яго забілі. Томас кажа, што гэта не мая віна, але я ведаю, што ён проста спрабуе быць са мной добрым.\n\nНа шчасце, па дарозе мы сустрэлі шукальніка прыгод, у якога была запасная мазь з сонечнай травы. Лі мог бы не выжыць без яе.\n\nЯ бачыў, як шукальнік прыгод глядзеў на ружу перад тым, як сысці, яны сказалі, што гэта падарунак. Навошта ім рызыкаваць жыццём тут, калі хтосьці так клапоціцца пра іх?\n\nМенавіта гэта я і раблю, ці не так? Мне здаецца, што я ўвязаўся ў гэта не па сілах.
journal.document.sewers_guard.crabs.title=Гіганцкія крабы!
journal.document.sewers_guard.dangerous.body=88-я восень, 375\nДарагія мама і тата,\n\nЯ разумею, чаму цяпер такая добрая зарплата, каналізацыя кішыць пачварамі! «Шкоднікі» і «злачынцы» — гэта гіганцкія крыважэрныя пацукі і зграі раз'юшаных гнолаў.\n\nНа шчасце, астатнія члены маёй каманды сапраўды ведаюць, што робяць. Капітан нашай каманды, Томас, — эксперт у гэтым. Я стараюся хутка вучыцца, каб не быць занадта вялікай цяжарам.\n\nГэтая праца значна больш небяспечная, чым я думаў. Я рады, што не магу зараз адправіць гэта, я не хачу, каб вы хваляваліся.\n\nЯ буду ў бяспецы,\n — Соня
journal.document.sewers_guard.dangerous.title=Небяспечная пазіцыя...
journal.document.sewers_guard.discover_hint=Вы можаце знайсці гэты тэкст у пэўным рэгіёне, але толькі пасля таго, як знойдзеце ўсе папярэднія тэксты ў гэтым наборы.
journal.document.sewers_guard.guild.body=23-га зімы, 376\nДарагія мама і тата,\n\nНа гэты раз новых монстраў не было, замест гэтага мы сутыкнуліся з невялікай групай з гільдыі злодзеяў падчас патрулявання.\n\nУсё, што я чуў пра гільдыю, дрэнна, але астатняя частка маёй каманды здавалася амаль сяброўскай з імі. Томас абмяняўся інфармацыяй і прыпасамі з адным з іх, перш чым мы разышліся.\n\nЯ не разумею, хіба мы не павінны былі пазбаўляцца ад злачынцаў? Томас нават сказаў не казаць пра гэта нікому з камандзіраў. Аднак іх інфармацыя і прыпасы былі вельмі карыснымі, і мы не маглі вытрымаць яшчэ большай бойкі.\n\nМяркую, мы ўсе тут разам у гэтым.
journal.document.sewers_guard.guild.title=Гільдыя злодзеяў
journal.document.sewers_guard.lost.body=40-е чысла Зімы, 376\n\nМы з Томасам заблукалі. Нас адкінула ад астатняй каманды падчас бітвы з гноламі. Ніхто з нас не пацярпеў, але ніжняя каналізацыя падобная на лабірынт.\n\nТомас кажа, што ведае выхад, але ён пачынаецца ля старога ўваходу ў турму ўнізе каналізацыі. Мне вельмі не падабаецца ісці глыбей, але ў нас няма ніякіх пайкоў, і спускацца значна хутчэй, чым блукаць у пошуках маршруту нашага патруля.\n\nУсё будзе добра. Томас ведае, што робіць.
journal.document.sewers_guard.lost.title=Мы згубіліся
journal.document.sewers_guard.new_position.body=85-я восень, 375\nДарагія мама і тата,\n\nЯ ж казаў вам, што цяжкая праца ў гарадской варце акупіцца. Мяне толькі што павысілі!\n\nМяне запрасілі далучыцца да спецыялізаванай каманды, якая працуе ў каналізацыі. Відаць, там ёсць праблемы з шкоднікамі і злачынцамі, і наша задача — іх ачысціць. Гэта брудная праца, але зімой у каналізацыі цёпла, і там плацяць у тры разы больш, чым на звычайнай вартавой службе!\n\nАле ўсё гэта трохі сакрэтна, таму я не магу адправіць гэты ліст. Дзіўна не пісаць табе, таму я ўсё роўна буду працягваць пісаць. Можа, калі-небудзь я змагу паказаць іх табе.\n\nЗ найлепшымі пажаданнямі,\n — Соня
journal.document.sewers_guard.new_position.title=Мая новая пасада!
journal.document.sewers_guard.not_worth.body=Мы з Томасам сутыкнуліся з нейкім велізарным монстрам з слізі ля ўваходу ў турму. Перш чым мы паспелі адрэагаваць, ён абліў нас магіяй. Томас забраў большую частку. Ён знік.\n\nНіякія грошы гэтага не вартыя. Я збіраюся сысці тым маршрутам, пра які мне расказваў Томас. Потым я вазьму тое, што зарабіў на варце, і выкарыстаю гэта, каб перавезці мяне і бацькоў з гэтага праклятага горада. Частка мяне хоча спадзявацца, што ў караля ёсць план на ўсё гэта, але я сумняваюся.\n\nЯ пакідаю гэтыя лісты як папярэджанне іншым. Гэта больш, чым проста гіганцкія пацукі і крабы, тут нешта вельмі не так.
journal.document.sewers_guard.not_worth.title=Гэта таго не варта
journal.document.sewers_guard.title=Лісты гвардыі
