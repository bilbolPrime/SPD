daily.defender_2=전초기지 궁수
daily.defender_desc_0=대장은 전초기지 중앙을 지킵니다. 지원군이 올 때까지 살아 있어야 합니다.
daily.defender_desc_1=자신의 위치 근처에서 싸우고, 공격 사이에는 원래 위치로 돌아갑니다.
daily.defender_desc_2=자리를 크게 벗어나지 않고 활과 화살로 전초기지를 지킵니다.
daily.defender_captive_desc=요새가 함락될 때 갇혔습니다. 감방을 열어 주면 전초기지 방어를 돕습니다.
