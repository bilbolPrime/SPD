daily.brief_0=쥐 왕의 지원군이 오고 있습니다. 궁정에 도착하기 전에 왕을 쓰러뜨리세요. 붙잡힌 간수를 구하면 함께 싸워 줍니다. 경비가 지키는 창고에는 보급품도 있습니다.
daily.brief_1=폭동이 텐구의 탈출을 돕고 있습니다. 탈옥 주동자 둘을 쓰러뜨려 은신처를 연 다음, 시간이 다 되기 전에 텐구를 처치하세요. 죄수를 풀어 경비와 싸우게 하거나 잠긴 무기고에서 보급품을 찾을 수 있습니다. 은신처에 들어가면 뒤에서 문이 닫힙니다.
daily.brief_2=광부 세 명이 지하에 갇혔고, 마지막 승강기는 곧 떠납니다. 대피소를 열고 세 명 모두 살아서 승강기에 데려온 뒤 탈출하세요. DM-300이 갱도를 돌아다닙니다. 싸우거나 다른 길로 돌아가도 됩니다. 보급품과 잠긴 지름길이 구조에 도움이 될 것입니다.
daily.brief_3=얼음발톱, 서리등 놀, 서리뿔이 동굴을 돌아다닙니다. 셋 모두 사냥하고 눈보라가 길을 막기 전에 반대편 출구에 도착하세요. 사냥 순서는 자유입니다. 샛길에 보급품이 있지만 찾는 데 시간이 듭니다.
daily.brief_4=의식 장소 세 곳에서 악마를 불러들이고 있습니다. 의식이 끝나기 전에 각 장소로 가서 봉인하세요. 한 곳을 봉인할 때마다 그곳에서 오는 지원군이 끊깁니다. 경로를 정하고, 보급품이 필요하면 옆방을 살펴보세요.
daily.brief_5=지원군이 올 때까지 전초기지를 지키세요. 다섯 차례의 공격 동안 대장을 살려야 합니다. 수비병들이 중앙을 지키는 동안 싸우거나, 주변에서 보급품을 찾거나, 감방을 열어 동료를 구할 수 있습니다. 후반에는 여러 방향에서 동시에 공격하니 진입로를 주시하세요.
daily.brief_6=도시의 금이 왕의 보물고에 쌓여 있습니다. 대장을 찾아 열쇠를 빼앗고 보물고를 연 다음, 반대편 성문이 닫히기 전에 탈출하세요. 보물고를 열면 경보가 울립니다. 먼저 창고를 뒤지고 지름길을 열거나, 적은 보급품으로 빠르게 훔쳐 달아날 수도 있습니다.
daily.rules=날짜마다 영웅, 장비, 던전이 정해져 있습니다. 출발 전에 기술 점수를 사용하세요. 시간은 턴으로 흐르며, 이벤트를 나가면 도전이 끝납니다. 일일 이벤트는 결과를 따로 기록하고 배지나 도감을 해금하지 않습니다.
daily.time_left=_%d_턴 남음
daily.timeout_0=지원군이 궁정에 도착했습니다. 후퇴해야 합니다.\n\n일일 도전에서 다시 시도할 수 있습니다.
daily.timeout_1=시간이 다 됐습니다. 텐구가 폭동을 틈타 달아났습니다.\n\n일일 도전에서 다시 시도할 수 있습니다.
daily.timeout_2=마지막 승강기가 떠났습니다. 모두를 제때 구하지 못했습니다.\n\n일일 도전에서 다시 시도할 수 있습니다.
daily.timeout_3=눈보라가 출구를 덮었습니다. 사냥은 끝났습니다.\n\n일일 도전에서 다시 시도할 수 있습니다.
daily.timeout_4=의식이 끝나고 악마가 전당을 뒤덮었습니다.\n\n일일 도전에서 다시 시도할 수 있습니다.
daily.timeout_6=성문이 닫히고 경비병들이 퇴로를 막았습니다.\n\n일일 도전에서 다시 시도할 수 있습니다.
