actors.skills.raiseskeletonskill.desc=Przywołuje szkielet, który walczy u twego boku.
network.partysession.background=Połączenie z drużyną zostało przerwane, ponieważ opuściłeś grę.
items.corpse.name=zwłoki
items.corpse.desc=Świeże zwłoki, przydatne do nekromancji.
items.armorkit.desc=Te narzędzia zmieniają dowolną zbroję w epicką. Zachowuje właściwości i zyskuje zdolność twojej klasy. Nie potrzeba umiejętności rzemieślniczych.
items.bomb.desc=Mała bomba wypełniona czarnym prochem. Wybucha tam, gdzie upadnie.
items.quest.driedrose.desc=Róża dawno uschła, ale zachowała wszystkie płatki.\n\nZwróć ten przedmiot duchowi.
items.quest.phantomfish.desc=Tę małą, przezroczystą rybkę ledwo widać w powietrzu. W wodzie jest niemal niewidoczna.\n\nZwróć ten przedmiot duchowi.
items.tomeofmastery.desc=Ta cienka księga w wytartej skórzanej oprawie zdaje się skrywać wiele wiedzy. Lektura zajmie trochę czasu.\n\nPozwala wybrać podklasę.
items.weightstone.desc=Pozwala wyważyć broń do walki wręcz, zwiększając jej szybkość lub celność.
items.wands.wandofamok.desc=Fioletowe światło wprawia cel w szał. Atakuje on pobliskie stworzenia bez rozróżnienia.
items.wands.wandofavalanche.desc=Trafienie w ścianę lub inną solidną przeszkodę wywołuje lawinę kamieni, która rani i ogłusza stworzenia w okolicy.
items.wands.wandofflock.desc=Przywołuje stado magicznych owiec, które na pewien czas blokują przejście.
items.wands.wandofpoison.desc=Zatruwa cel, zadając okresowe obrażenia. Ulepszenia wydłużają działanie trucizny.
items.wands.wandofreach.desc=Podnosi przedmioty z daleka i zamienia cię miejscami z wrogiem. Fala uruchamia pułapki, depcze trawę oraz otwiera lub zamyka drzwi po drodze.
items.wands.wandofslowness.desc=Na pewien czas zmniejsza o połowę szybkość ruchu i ataków celu.
items.wands.wandofteleportation.desc=Przenosi stworzenie w losowe miejsce na tym piętrze.
items.weapon.melee.dualswords.desc=Dwa ostre ostrza do mocniejszych ciosów.
items.weapon.missiles.cupidarrow.desc=Podobno ta strzała należała do Kupidyna. Uważaj, w kogo celujesz.
items.weapon.missiles.curaredart.desc=Te rzutki zadają niewielkie obrażenia, lecz mogą sparaliżować cel i pozostawić go bezbronnym.
items.weapon.missiles.incendiarydart.desc=Grot wbija się w cel, a przytwierdzona do rzutki mieszanka staje w płomieniach.
items.weapon.missiles.soulcrystal.desc=Kryształ zdolny chwytać dusze. Rzuć nim w słabego lub osłabionego wroga, by uwięzić jego ducha.
items.weapon.missiles.tamahawk.desc=Ten toporek do rzucania nie jest ciężki, ale wymaga siły, by dobrze nim władać.
network.partytext.weapon_fast=Ta broń jest szybka.
network.partytext.weapon_slow=Ta broń jest powolna.
network.partytext.weapon_accurate=Ta broń jest celna.
network.partytext.weapon_inaccurate=Ta broń jest mało celna.
network.partytext.weapon_fast_and_accurate=Ta broń jest szybka i celna.
network.partytext.weapon_fast_but_inaccurate=Ta broń jest szybka, ale mało celna.
network.partytext.weapon_slow_but_accurate=Ta broń jest powolna, ale celna.
network.partytext.weapon_slow_and_inaccurate=Ta broń jest powolna i mało celna.
network.partytext.necroblade_bolt=Od poziomu 5 w pełni naładowane ostrze może wystrzelić _Mroczny pocisk_, który może zniszczyć istotę celu i zmienić go w sługę.
network.partytext.necroblade_intro=Ostrze wykute mroczną magią pożera dusze ofiar i rośnie w siłę.
network.partytext.necroblade_energy=Zgromadzone dusze: _%s/100_
network.partytext.necroblade_damage=Dusze dodają _0–%d obrażeń_.
network.partytext.necroblade_hungry=Ostrze może pochłonąć pełny zapas dusz, by stać się silniejsze.
network.partytext.necroblade_full=Ostrza nie da się już ulepszać przez pochłanianie dusz.
