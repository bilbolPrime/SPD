custom.generated.entry_read_this_scroll_to_unleash_the_wrath_of_the_dun_db502abf39=Lees deze perkamentrol om de toorn van de kerkergeesten te ontketenen, die alles op het huidige niveau zullen doden. Nou ja, bijna alles. Sommige van de krachtigere wezens zullen er misschien niet door worden beïnvloed.
custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=De bezwering op deze perkamentrol zal illusoir tweelingen van de lezer creëren, die zijn vijanden zullen achtervolgen.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=De spreuk op deze perkamentrol zal onmiddellijk alle kwade betoveringen verwijderen van het wapen, de bepantsering, de ringen en de voorwerpen die de lezer bij zich draagt, waardoor de drager ze niet kan verwijderen.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=De pure magische kracht die in dit perkament besloten ligt, zal, wanneer deze wordt vrijgelaten, alle toverstokken van de lezer weer volledig opladen.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=De perkamentrol bevat het geheim van een verboden ritueel. In ruil voor het welzijn van de lezer brengt de rol schade toe aan iedereen in de omgeving en geneest hem volledig.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=De perkamentrol lijkt kouder dan de omgeving. Alsof het een portaal naar een koudere dimensie is.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=De spreuk op dit perkament transporteert de lezer direct naar een willekeurige locatie in de kerker. Hij kan gebruikt worden om aan een gevaarlijke situatie te ontsnappen, maar de onfortuinlijke lezer kan zich daardoor ook in een nog gevaarlijkere omgeving bevinden.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Deze perkamentrol bevat vernietigende energie die psionisch kan worden gekanaliseerd om enorme schade toe te brengen aan alle wezens binnen een bepaald gezichtsveld. Een bijbehorende lichtflits zal iedereen in het getroffen gebied, inclusief de lezer van de perkamentrol, tijdelijk verblinden.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Met deze perkamentrol kun je een wapen of pantser voorzien van een willekeurige betovering, waardoor het een speciale kracht krijgt.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Deze perkamentrol verbetert één enkel voorwerp, waardoor de kwaliteit ervan toeneemt. Een toverstaf zal krachtiger worden en het aantal ladingen zal toenemen; een wapen zal meer schade toebrengen of vaker doel treffen; een harnas zal meer klappen afweren; het effect van een ring op de drager zal intensiveren. Wapens en harnassen zullen ook minder kracht vereisen om te gebruiken, en eventuele vloeken op het voorwerp zullen worden opgeheven.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Wanneer deze rol hardop wordt voorgelezen, zal er een uitdagend gebrul klinken dat alle monsters zal wekken en hen zal waarschuwen voor de locatie van de lezer.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Wanneer je deze inspirerende woorden leest, zullen ze je klaarstomen voor de strijd.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=Door wijze woorden te lezen, vergroot je je vaardigheden.

