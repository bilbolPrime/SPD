custom.generated.entry_you_are_playing_in_2_5d_mode_the_game_is_given_a_71c595edb2=Je speelt in 2.5D-modus!\n \n - Het spel heeft een "3D-rendering"-gevoel gekregen.\n - Alle sprites zijn verhoogd en voorzien van schaduwen.\n - Nieuwe implementatie van Fog of War.\n - Er wordt nog aan een aantal problemen gewerkt.\n - Je kunt vanaf dit scherm (bovenaan) tussen modi schakelen. Het is niet gekoppeld aan een opgeslagen spelbestand. Je kunt naar believen van spelmodus wisselen.\n\nWaarschuwing: Sommige tegels (water en dergelijke) tonen onnauwkeurige grenzen bij het laden van een klassieke kaart in 2.5D-modus. Het effect is alleen visueel.\n\nMeld eventuele problemen die je tegenkomt, zodat ik ze zo snel mogelijk kan oplossen.
