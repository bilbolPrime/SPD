custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Câu thần chú trên cuộn giấy này sẽ ngay lập tức loại bỏ khỏi vũ khí, áo giáp, nhẫn và các vật phẩm mà người đọc mang theo bất kỳ bùa chú xấu xa nào có thể ngăn cản người đeo tháo chúng ra.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Sức mạnh ma thuật tiềm ẩn trong tấm giấy da này, khi được giải phóng, sẽ nạp đầy năng lượng cho tất cả các cây đũa phép của người đọc.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Cuộn giấy chứa đựng bí mật của một nghi lễ cấm kỵ. Để đổi lấy sự an lành của người đọc, cuộn giấy sẽ gây hại cho tất cả mọi người xung quanh và chữa lành hoàn toàn cho người đó.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Cuộn giấy trông lạnh lẽo hơn cả môi trường xung quanh. Như thể nó là một cánh cổng dẫn đến một chiều không gian lạnh lẽo hơn.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Câu thần chú trên mảnh giấy da này ngay lập tức đưa người đọc đến một vị trí ngẫu nhiên trong hầm ngục. Nó có thể được sử dụng để thoát khỏi tình huống nguy hiểm, nhưng người đọc không may mắn có thể thấy mình ở một nơi còn nguy hiểm hơn.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Cuộn giấy này chứa đựng năng lượng hủy diệt, có thể được dẫn truyền bằng năng lực tâm linh để gây sát thương lớn cho tất cả sinh vật trong tầm nhìn. Một tia sáng đi kèm sẽ tạm thời làm mù tất cả mọi người trong khu vực ảnh hưởng, kể cả người đọc cuộn giấy.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Cuộn giấy này có khả năng yểm một phép thuật ngẫu nhiên lên vũ khí hoặc áo giáp, ban cho chúng một sức mạnh đặc biệt.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Cuộn giấy này sẽ nâng cấp một vật phẩm duy nhất, cải thiện chất lượng của nó. Gậy phép sẽ tăng sức mạnh và số lần sử dụng; vũ khí sẽ gây sát thương lớn hơn hoặc trúng mục tiêu thường xuyên hơn; áo giáp sẽ đỡ được nhiều đòn tấn công hơn; hiệu quả của chiếc nhẫn đối với người đeo sẽ được tăng cường. Vũ khí và áo giáp cũng sẽ cần ít sức mạnh hơn để sử dụng, và mọi lời nguyền trên vật phẩm sẽ được hóa giải.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Khi được đọc to, cuộn giấy này sẽ phát ra một tiếng gầm đầy thách thức, đánh thức tất cả quái vật và báo hiệu vị trí của người đọc.
