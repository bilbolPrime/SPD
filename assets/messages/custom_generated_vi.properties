custom.generated.entry_you_are_playing_in_2_5d_mode_the_game_is_given_a_71c595edb2=Bạn đang chơi ở chế độ 2.5D!\n \n- Trò chơi được tạo cảm giác "hiển thị 3D".\n- Tất cả các sprite đều được nâng cao và có bóng.\n- Triển khai hiệu ứng Sương mù chiến tranh mới.\n- Một số lỗi vẫn đang được khắc phục.\n- Bạn có thể chuyển đổi giữa các chế độ từ màn hình này (trên cùng). Nó không liên kết với tệp lưu. Thay đổi chế độ chơi tùy ý.\n\nCảnh báo: Một số ô (nước và những thứ tương tự) sẽ hiển thị ranh giới không chính xác khi tải bản đồ cổ điển ở chế độ 2.5D. Hiệu ứng này chỉ mang tính trực quan.\n\nVui lòng thông báo cho tôi về bất kỳ sự cố nào bạn gặp phải để khắc phục sớm nhất có thể.
