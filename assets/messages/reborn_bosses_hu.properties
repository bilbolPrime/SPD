actors.mobs.rebornboss.opening=Védtelen!
actors.mobs.rebornboss.interrupted=%s elveszíti az összpontosítását!
actors.mobs.reborngoo.desc=A Ragacsról keveset tudni. Lehet, hogy nem is élőlény, csupán a csatornák anyagainak egyvelege, amelyben kialakult a szabad akarat csírája.
actors.mobs.reborngoo.warning=Goo felfúvódik. Térj ki előle!
actors.mobs.reborndm300.desc=Ezt a gépet a törpök építették több évszázaddal ezelőtt. Később a gépeket gólemekkel, elementálokkal, sőt démonokkal kezdték helyettesíteni. Ez végül a civilizációjuk hanyatlásához vezetett. A DM-300 és a hasonló gépek főként építkezésre és bányászatra szolgáltak, de néha a város védelmére is használták őket.
actors.mobs.reborndm300.repair=DM-300 megjavítja magát!
actors.mobs.reborndm300.warning=A motor felsivít. Hagyd el a jelölt helyeket!
actors.mobs.rebornking.desc=A törpök utolsó királya híres volt az élet és a halál titkainak mély ismeretéről. Rávette udvartartását, hogy vegyenek részt egy örök fiatalságot ígérő szertartáson. Végül csak ő kapta meg — és mellé egy élőholt sereget is.
actors.mobs.rebornking.warning=A Király felemeli a kezét!
actors.mobs.rebornking.herald_fell=Tartsátok az állást, gyávák!
actors.mobs.rebornking$retainer.name_0=Királyi őr
actors.mobs.rebornking$retainer.desc_0=Egy halott törpe ütött-kopott páncélban. Még mindig a királyát őrzi.
actors.mobs.rebornking$retainer.name_1=Udvari mágus
actors.mobs.rebornking$retainer.desc_1=Egy halottaiból feltámasztott udvari mágus. Sötét mágia gyűlik a kezében.
actors.mobs.rebornking$retainer.name_2=Királyi hírnök
actors.mobs.rebornking$retainer.desc_2=Ez a hírnök törött állkapoccsal is a Király parancsait ordítja. A holtak engedelmeskednek.
actors.mobs.rebornking$retainer.name_3=Élőholt íjász
actors.mobs.rebornking$retainer.desc_3=Ezt a törpét az íjával együtt temették el. Nem felejtette el, hogyan kell használni.
actors.mobs.rebornyog.desc=Yog-Dzewa egy Öreg Isten, egy hatalmas entitás a káosz birodalmából. Egy évszázaddal ezelőtt az ősi törpök alig győzték le a háborút a démonok serege ellen, de magát az istent sem tudták megölni. Ehelyett bebörtönözték a városuk alatti csarnokokban, abban a hitben, hogy túl gyenge ahhoz, hogy valaha is feltámadjon.
actors.mobs.rebornyog.warning=Meghasad a levegő. Hagyd el a vibráló jeleket!
actors.mobs.rebornyog.inherit_rot=A hús elfonnyad. Én megmaradok.
actors.mobs.rebornyog.inherit_fire=A láng már az enyém.
actors.mobs.rebornyog$rotting.desc=Rothadó húsból álló hatalmas ököl. Ujjai között bűzös nyálka szivárog, beszennyezve alatta a követ.
actors.mobs.rebornyog$rotting.warning=A rothadó ököl lendületet vesz!
actors.mobs.rebornyog$burninghand.desc=Lángokba burkolózó hatalmas ököl. Ujjai összezárulva ropognak, és parazsat szórnak a padlóra.
actors.mobs.rebornyog$burninghand.warning=Parázs gyűlik az égő ököl előtt!
actors.mobs.reborntengu.shadow_broken=Az árnyékom…!
