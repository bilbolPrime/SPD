items.scrolls.scrolloffrostlevel.name=Pergamino de escarcha
items.scrolls.scrolloffrostlevel.desc=El frío se filtra a través de este pergamino.\n\nTambién puedes rasgarlo en cualquier lugar para congelar a todos los enemigos del piso hasta que reciban daño. No afecta a los jefes ni a las criaturas inmunes al hielo. No causa daño.
items.scrolls.scrolloffrostlevel.ac_tear=Rasgar
items.scrolls.scrolloffrostlevel.tear_confirm=Al rasgar este pergamino liberarás su magia y congelarás a todos los enemigos del piso hasta que reciban daño. No afecta a los jefes ni a las criaturas inmunes al hielo. No causa daño.\n\n¿Rasgar el pergamino?
items.scrolls.scrolloffrostlevel.wrong_place=El pergamino no funciona aquí.
items.scrolls.scrolloffrostlevel.spent=El paso ya se ha abierto. El pergamino no responde.
items.keys.key.ice_depth=Esta llave pertenece al piso %d de las Cuevas de Hielo.
scenes.interlevelscene$mode.frost=Entrando en las Cuevas de Hielo...
levels.icecaveslevel.water_name=Agua helada
levels.icecaveslevel.water_desc=Una fina capa de hielo se rompe bajo los pies.
levels.icecaveslevel.wall_desc=Las marcas de los picos desaparecen bajo gruesas vetas de hielo. Los mineros abandonaron estas galerías cuando el frío se extendió por la roca.
levels.cavesbosslevel.collapsed_name=Cueva derrumbada
levels.cavesbosslevel.collapsed_desc=Una cueva derrumbada. No hay paso entre las rocas caídas.
actors.buffs.frostbite.name=Congelación
actors.buffs.frostbite.desc=El frío reduce tu velocidad de movimiento un 20%.
actors.mobs.rimebat.name=Murciélago de escarcha
actors.mobs.rimebat.desc=Estos murciélagos pálidos anidan bajo el hielo. Su mordisco helado ralentiza brevemente el movimiento, dándoles tiempo para volver a atacar.\n\nInmune a la congelación y a la magia de hielo.
actors.mobs.iceclaw.name=Garra de hielo
actors.mobs.iceclaw.desc=Un carroñero con un caparazón de hielo compacto. Antes de luchar, refuerza su armadura durante un breve tiempo. El fuego derrite esa protección adicional.\n\nInmune a la congelación y a la magia de hielo.
actors.mobs.frostback.name=Gnoll lomoescarcha
actors.mobs.frostback.desc=Este gnoll sobrevive al frío robando a quienes se aventuran aquí. Cuando levante su arma, apártate: el golpe caerá donde estabas.\n\nInmune a la congelación y a la magia de hielo.
actors.mobs.shardling.name=Esquirla viviente
actors.mobs.shardling.desc=Una inquieta masa de cristales de hielo. Apunta antes de lanzar esquirlas en línea recta. Las paredes detienen la descarga.\n\nInmune a la congelación y a la magia de hielo.
actors.mobs.hollowminer.name=Minero hueco
actors.mobs.hollowminer.desc=Este minero nunca escapó de las galerías heladas. Su farol sigue ardiendo, aunque lleva mucho tiempo muerto. Si consigue levantarlo, llama a las criaturas cercanas al combate. Un golpe interrumpe la señal.\n\nInmune a la congelación y a la magia de hielo.
actors.mobs.rimehorn.name=Cuerno de escarcha
actors.mobs.rimehorn.desc=Una bestia pesada con el pelaje lleno de escarcha. Raspa el suelo antes de cargar en línea recta. Sal de su camino mientras se prepara.\n\nInmune a la congelación y a la magia de hielo.
actors.mobs.oldrime.name=Viejo Escarcha
actors.mobs.oldrime.desc=Los mineros encontraron al Viejo Escarcha bajo la montaña, enterrado en un hielo más antiguo que sus túneles. Sus picos lo despertaron. Ahora guarda las galerías heladas y el paso que hay detrás. Su armadura se rompe al debilitarse, liberando sus extremidades. Cuidado con sus fuertes golpes, el hielo que brota del suelo y su aliento helado.\n\nInmune a la congelación y a la magia de hielo.
actors.mobs.oldrime.warning=¡El Viejo Escarcha se prepara para golpear!
windows.wndjournal.ice_depth=Hielo %d
levels.icebosslevel.exit_name=Paso de la cueva
levels.icebosslevel.exit_desc=Un paso estrecho se adentra en la montaña.
levels.icebosslevel.blocked_name=Paso congelado
levels.icebosslevel.blocked_desc=Un muro de hielo bloquea el paso tras el Viejo Escarcha.
items.weapon.ice.wrong_hero=Esta arma no es para ti.
items.weapon.ice.already_enchanted=Esta arma ya está encantada.
items.weapon.ice.glaciercleaver.name=Cuchilla del glaciar
items.weapon.ice.glaciercleaver.desc=Una hoja ancha tallada en el hielo del Viejo Escarcha. Un golpe cubre al objetivo de escarcha durante cuatro turnos. El siguiente golpe con una Cuchilla del glaciar la rompe e inflige %d de daño adicional. Solo un Guerrero puede usarla.
actors.buffs.frostcoating.name=Cubierto de escarcha
actors.buffs.frostcoating.desc=Una fina capa de escarcha cubre a esta criatura. Un golpe de Cuchilla del glaciar la romperá.
items.weapon.ice.hoarfroststaff.name=Bastón de cencellada
items.weapon.ice.hoarfroststaff.desc=El frío se acumula entre las puntas de este bastón. Sus proyectiles infligen %d-%d de daño antes de los bonos de habilidad y ralentizan el movimiento y los ataques durante dos turnos. Al principio tiene tres cargas y se recarga como una varita. Solo un Mago puede usarlo.
items.weapon.ice.rimepick.name=Pico de escarcha
items.weapon.ice.rimepick.desc=Este estrecho pico de hielo encuentra los huecos de la armadura. Ignora un cuarto de la armadura del objetivo, o la mitad si lo sorprende. Solo un Pícaro puede usarlo.
items.weapon.ice.frostbow.name=Arco de escarcha
items.weapon.ice.frostbow.desc=Las flechas de este arco estallan en hielo afilado al impactar. Infligen un %d%% más de daño al objetivo y un cuarto del daño del golpe a los enemigos adyacentes. Las esquirlas no congelan a sus víctimas. Solo una Cazadora puede usarlo.
items.weapon.ice.gravefrostscythe.name=Guadaña de escarcha sepulcral
items.weapon.ice.gravefrostscythe.desc=La escarcha cubre el mango revestido de huesos de esta guadaña. Mientras la llevas equipada, tus esqueletos y fantasmas invocados infligen %d de daño de frío adicional por golpe. Solo un Nigromante puede usarla.
items.weapon.ice.frostbiterifle.name=Rifle de congelación
items.weapon.ice.frostbiterifle.desc=La recámara de este rifle está revestida de un hielo que nunca se derrite. Cada disparo certero provoca congelación durante dos turnos y ralentiza el movimiento un 20%. Los impactos siguientes renuevan el efecto. Solo un Mercenario puede usarlo.
library.ice_weapon_drop=Cae un arma por cada héroe, según su clase.

actors.mobs.npcs.prospector.name=Prospector atrapado
actors.mobs.npcs.prospector.desc=Un prospector con un abrigo remendado se refugia junto a las escaleras. Su lámpara está a punto de apagarse.
actors.mobs.npcs.prospector.torches=Mi lámpara no durará mucho más. Dejé un cofre de provisiones en este piso al huir. ¿Me traerías _tres antorchas_ de allí?
actors.mobs.npcs.prospector.iceclaws=Las garras de hielo me echaron de la galería. Mata _tres garras de hielo en este piso_ para que pueda volver al trabajo.
actors.mobs.npcs.prospector.accept=Te ayudaré.
actors.mobs.npcs.prospector.later=Ahora no.
actors.mobs.npcs.prospector.need_torches=Necesito _tres antorchas_. El cofre sigue en algún lugar de este piso.
actors.mobs.npcs.prospector.claws_left=Garras de hielo por matar: _%d_.
actors.mobs.npcs.prospector.reward=Buen trabajo. ¿Qué prefieres?
actors.mobs.npcs.prospector.rations=Dos raciones de alimentos
actors.mobs.npcs.prospector.thanks=Una preocupación menos. Gracias.
library.quest.prospector_torches.name=Una lámpara que se apaga
library.quest.prospector_torches.desc=Lleva tres antorchas al prospector atrapado. Un cofre de su piso contiene suficientes.
library.quest.prospector_iceclaws.name=Garras en la galería
library.quest.prospector_iceclaws.desc=Mata tres garras de hielo en el piso del prospector y vuelve a hablar con él.
library.quest.prospector.reward=Elige un pergamino de mejora o dos raciones de alimentos.
items.scrolls.scrolloffrostlevel.read_confirm=Mientras lees, sientes que estás a punto de ser teletransportado.
