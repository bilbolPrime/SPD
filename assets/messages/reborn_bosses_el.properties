actors.mobs.rebornboss.opening=Εκτεθειμένος!
actors.mobs.rebornboss.interrupted=Ο %s χάνει τη συγκέντρωσή του!
actors.mobs.reborngoo.desc=Λίγα είναι γνωστά για τη Γλίτσα. Ίσως να μην είναι καν πλάσμα, αλλά ένα συνονθύλευμα ουσιών από τους υπονόμους που απέκτησε τα πρώτα ίχνη δικής του θέλησης.
actors.mobs.reborngoo.warning=Το Goo φουσκώνει. Φύγε από μπροστά του!
actors.mobs.reborndm300.desc=Αυτή η μηχανή κατασκευάστηκε από τους νάνους πριν από αρκετούς αιώνες. Αργότερα άρχισαν να αντικαθιστούν τις μηχανές με γκόλεμ, στοιχειακά πλάσματα, ακόμη και δαίμονες. Αυτό οδήγησε τελικά τον πολιτισμό τους στην παρακμή. Το DM-300 και παρόμοιες μηχανές χρησιμοποιούνταν κυρίως για οικοδομές και εξόρυξη, αλλά μερικές φορές και για την άμυνα της πόλης.
actors.mobs.reborndm300.repair=Το DM-300 επισκευάζεται!
actors.mobs.reborndm300.warning=Η μηχανή στριγκλίζει. Φύγε από τα σημαδεμένα σημεία!
actors.mobs.rebornking.desc=Ο τελευταίος βασιλιάς των νάνων ήταν γνωστός για τη βαθιά γνώση του γύρω από τη ζωή και τον θάνατο. Έπεισε την αυλή του να συμμετάσχει σε μια τελετή που θα τους χάριζε αιώνια νεότητα. Τελικά την απέκτησε μόνο εκείνος — μαζί με έναν στρατό απέθαντων.
actors.mobs.rebornking.warning=Ο Βασιλιάς σηκώνει το χέρι!
actors.mobs.rebornking.herald_fell=Κρατήστε τις θέσεις σας, δειλοί!
actors.mobs.rebornking$retainer.name_0=Βασιλικός φρουρός
actors.mobs.rebornking$retainer.desc_0=Ένας νεκρός νάνος με χτυπημένη πανοπλία, που ακόμα φυλάει τον βασιλιά του.
actors.mobs.rebornking$retainer.name_1=Μάγος της αυλής
actors.mobs.rebornking$retainer.desc_1=Ένας μάγος της αυλής που αναστήθηκε. Σκοτεινή μαγεία μαζεύεται στα χέρια του.
actors.mobs.rebornking$retainer.name_2=Βασιλικός κήρυκας
actors.mobs.rebornking$retainer.desc_2=Ακόμα και με σπασμένο σαγόνι, αυτός ο κήρυκας ουρλιάζει τις διαταγές του Βασιλιά. Οι νεκροί υπακούν.
actors.mobs.rebornking$retainer.name_3=Απέθαντος τοξότης
actors.mobs.rebornking$retainer.desc_3=Αυτόν τον νάνο τον έθαψαν μαζί με το τόξο του. Δεν ξέχασε πώς να το χρησιμοποιεί.
actors.mobs.rebornyog.desc=Ο Γιογκ-Ντζέβα είναι ένας Παλιός Θεός, μια ισχυρή οντότητα από τα βασίλεια του χάους. Πριν από έναν αιώνα, οι αρχαίοι νάνοι μόλις που κέρδισαν τον πόλεμο ενάντια στον στρατό των δαιμόνων τους, αλλά δεν μπόρεσαν να σκοτώσουν τον ίδιο τον θεό. Αντ' αυτού, τον φυλάκισαν στις αίθουσες κάτω από την πόλη τους, πιστεύοντας ότι ήταν πολύ αδύναμος για να επανέλθει ποτέ.
actors.mobs.rebornyog.warning=Ο αέρας σκίζεται. Φύγε από τα σημάδια που τρεμοπαίζουν!
actors.mobs.rebornyog.inherit_rot=Η σάρκα μαραίνεται. Εγώ μένω.
actors.mobs.rebornyog.inherit_fire=Η φλόγα είναι πια δική μου.
actors.mobs.rebornyog$rotting.desc=Μια τεράστια γροθιά από σάπια σάρκα. Δύσοσμη γλίτσα στάζει ανάμεσα στα δάχτυλά της και λερώνει την πέτρα από κάτω.
actors.mobs.rebornyog$rotting.warning=Η σάπια γροθιά τραβιέται πίσω!
actors.mobs.rebornyog$burninghand.desc=Μια πελώρια γροθιά τυλιγμένη στις φλόγες. Τα δάχτυλά της τρίζουν καθώς κλείνουν, σκορπίζοντας κάρβουνα στο πάτωμα.
actors.mobs.rebornyog$burninghand.warning=Κάρβουνα μαζεύονται μπροστά στη φλεγόμενη γροθιά!
actors.mobs.reborntengu.shadow_broken=Η σκιά μου…!
