items.armorkit.desc=Using this kit of small tools and materials anybody can transform any armor into an "epic armor", which will keep all properties of the original armor, but will also provide its wearer a special ability depending on his class. No skills in tailoring, leatherworking or blacksmithing are required.
items.bomb.desc=This is a relatively small bomb, filled with black powder. Conveniently, its fuse is lit automatically when the bomb is thrown.
items.bombtriggerbeacon.desc=A remote trigger that can detonate thrown remote bombs. It looks a bit worn out... its signal might not reach all the bombs from the first attempt.
items.corpse.name=corpse
items.corpse.desc=A fresh corpse. It can be used for necromancy.
items.remotebomb.desc=After being thrown, this bomb will explode once it receives a signal from a trigger beacon.
items.remotebombground.desc=This small bomb will explode as soon as a signal is sent from a trigger beacon.
items.tomeofmastery.desc=This worn leather book is not that thick, but you feel somehow, that you can gather a lot from it. Remember though that reading this tome may require some time.
items.weightstone.desc=Using a weightstone, you can balance your melee weapon to increase its speed or accuracy.
items.potions.potionofmana.desc=An elixir that will instantly replenish your spiritual energy.
items.quest.driedrose.desc=The rose has dried long ago, but it has kept all its petals somehow.
items.quest.phantomfish.desc=You can barely see this tiny translucent fish in the air. In the water it becomes effectively invisible.
items.wands.wandofamok.desc=The purple light from this wand will make the target run amok attacking random creatures in its vicinity.
items.wands.wandofavalanche.desc=When a discharge of this wand hits a wall (or any other solid obstacle) it causes an avalanche of stones, damaging and stunning all creatures in the affected area.
items.wands.wandofflock.desc=A flick of this wand summons a flock of magic sheep, creating temporary impenetrable obstacle.
items.wands.wandofmagiccasting.desc=The vile blast of this twisted bit of wood will imbue its target with a deadly venom. A creature that is poisoned will suffer periodic damage until the effect ends. The duration of the effect increases with the level of the staff.
items.wands.wandofpoison.desc=The vile blast of this twisted bit of wood will imbue its target with a deadly venom. A creature that is poisoned will suffer periodic damage until the effect ends. The duration of the effect increases with the level of the staff.
items.wands.wandofreach.desc=This utility wand can be used to grab objects from a distance and to switch places with enemies. Waves of magic force radiated from it will affect all cells on their way triggering traps, trampling high vegetation, opening closed doors and closing open ones.
items.wands.wandofslowness.desc=This wand will cause a creature to move and attack at half its ordinary speed until the effect ends
items.wands.wandofteleportation.desc=A blast from this wand will teleport a creature against its will to a random place on the current level.
items.weapon.melee.dualswords.desc=Two razor sharp blades for more damage.
network.partytext.necroblade_intro=A blade forged from dark magic. NecroBlades consume the souls of those who perish by them. The more they consume, the stronger they become.
network.partytext.soulblade_intro=A blade that can only be held by the purest of champions. The soul blade is powered by the very soul essence of its wielder.
items.weapon.missiles.bullet.name=bullet
items.weapon.missiles.bullet.desc=A gun bullet. It exists only long enough to be fired.
items.weapon.missiles.cupidarrow.desc=An arrow believed to belong to cupid. Careful who you aim at.
items.weapon.missiles.curaredart.desc=These little evil darts don't do much damage but they can paralyze the target leaving it helpless and motionless for some time.
items.weapon.missiles.dart.desc=These simple metal spikes are weighted to fly true and sting their prey with a flick of the wrist.
items.weapon.missiles.incendiarydart.desc=The spike on each of these darts is designed to pin it to its target while the unstable compounds strapped to its length burst into brilliant flames.
items.weapon.missiles.mobprojectile.desc=These simple metal spikes are weighted to fly true and sting their prey with a flick of the wrist.
items.weapon.missiles.ninjabomb.desc=A magical crystal capable of capturing soul essence. Throw this at a weak or weakened foe and capture his spirit.
items.weapon.missiles.soulcrystal.desc=A magical crystal capable of capturing soul essence. Throw this at a weak or weakened foe and capture his spirit.
items.weapon.missiles.tamahawk.desc=This throwing axe is not that heavy, but it still requires significant strength to be used effectively.
items.weapon.missiles.throwspear.desc=A spear for joe.
