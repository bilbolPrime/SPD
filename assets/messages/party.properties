network.partytext.necroblade_damage=The energy stored within increases damage by _0_ - _%d_.
network.partytext.necroblade_hungry=The blade _hungers_ for souls.
network.partytext.necroblade_full=The blade _cannot_ consume any more souls.
network.partytext.necroblade_bolt=After level 7, the Necro Blade unlocks _Dark_ _Bolt_. A projectile of negative energy that can completely shatter a target's essence and replace it with a slave.
network.partytext.soulblade_heal=_Level_ _3:_ _Recover_ _20_ _health_ _for_ _20_ _mana_
network.partytext.soulblade_dispel=_Level_ _5:_ _Dispel_ _any_ _curses_ _for_ _50_ _mana_
network.partytext.soulblade_strike=_Level_ _7:_ _Channels_ _all_ _spiritual_ _energy_ _into_ _the_ _blade_ _damage_ _all_ _hostiles;_ _at_ _least_ _50_ _mana_
network.partytext.weapon_fast=This is a rather fast weapon.
