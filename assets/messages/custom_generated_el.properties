custom.generated.entry_read_this_scroll_to_unleash_the_wrath_of_the_dun_db502abf39=Διάβασε αυτόν τον πάπυρο για να εξαπολύσεις την οργή των πνευμάτων των μπουντρουμιών, σκοτώνοντας τα πάντα στο τρέχον επίπεδο. Λοιπόν, σχεδόν τα πάντα. Μερικά από τα πιο ισχυρά πλάσματα μπορεί να μην επηρεαστούν.
custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=Η επωδός σε αυτόν τον πάπυρο θα δημιουργήσει ψευδαισθητικά δίδυμα του αναγνώστη, τα οποία θα κυνηγήσουν τους εχθρούς του.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Η επικλητική φράση σε αυτόν τον πάπυρο θα αφαιρέσει αμέσως από το όπλο, την πανοπλία, τα δαχτυλίδια και τα αντικείμενα που μεταφέρει ο αναγνώστης τυχόν κακά ξόρκια που θα μπορούσαν να εμποδίσουν τον χρήστη να τα αφαιρέσει.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Η ακατέργαστη μαγική δύναμη που είναι δεσμευμένη σε αυτό το περγαμηνό, όταν απελευθερωθεί, θα επαναφορτίσει όλα τα ραβδιά του αναγνώστη σε πλήρη ισχύ.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Ο πάπυρος κρύβει το μυστικό μιας απαγορευμένης τελετουργίας. Σε αντάλλαγμα για την ευημερία του αναγνώστη, ο πάπυρος βλάπτει όλους όσους βρίσκονται κοντά και τον θεραπεύει πλήρως.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Ο πάπυρος φαίνεται πιο κρύος από το περιβάλλον. Σαν να ήταν μια πύλη προς μια πιο ψυχρή διάσταση.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Το ξόρκι σε αυτό το περγαμηνό μεταφέρει αμέσως τον αναγνώστη σε μια τυχαία τοποθεσία στο επίπεδο του μπουντρουμιού. Μπορεί να χρησιμοποιηθεί για να ξεφύγει από μια επικίνδυνη κατάσταση, αλλά ο άτυχος αναγνώστης μπορεί να βρεθεί σε ένα ακόμη πιο επικίνδυνο μέρος.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Αυτός ο πάπυρος περιέχει καταστροφική ενέργεια, η οποία μπορεί να διοχετευτεί ψυχολογικά για να προκαλέσει τεράστια ζημιά σε όλα τα πλάσματα εντός ενός οπτικού πεδίου. Μια συνοδευτική λάμψη φωτός θα τυφλώσει προσωρινά όλους στην περιοχή επίδρασης, συμπεριλαμβανομένου του αναγνώστη του πάπυρου.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Αυτός ο πάπυρος μπορεί να εμπλουτίσει ένα όπλο ή μια πανοπλία με μια τυχαία γοητεία, δίνοντάς του μια ειδική δύναμη.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Αυτός ο πάπυρος θα αναβαθμίσει ένα μεμονωμένο αντικείμενο, βελτιώνοντας την ποιότητά του. Ένα ραβδί θα αυξηθεί σε ισχύ και σε αριθμό φορτίσεων. Ένα όπλο θα προκαλέσει περισσότερη ζημιά ή θα βρει το σημάδι του πιο συχνά. Μια πανοπλία θα εκτρέψει επιπλέον χτυπήματα. Η επίδραση ενός δαχτυλιδιού στον κάτοχό του θα ενταθεί. Τα όπλα και η πανοπλία θα απαιτούν επίσης λιγότερη δύναμη για χρήση και τυχόν κατάρες στο αντικείμενο θα αρθούν.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Όταν διαβαστεί φωναχτά, αυτός ο πάπυρος θα εξαπολύσει ένα απαιτητικό βρυχηθμό που θα ξυπνήσει όλα τα τέρατα και θα τα ειδοποιήσει για την τοποθεσία του αναγνώστη.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Όταν διαβαστούν, τα λόγια έμπνευσης θα σας ετοιμάσουν για μάχη.
