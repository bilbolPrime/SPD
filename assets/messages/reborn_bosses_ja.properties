actors.mobs.rebornboss.opening=隙だらけ！
actors.mobs.rebornboss.interrupted=%sの集中が途切れた！
actors.mobs.reborngoo.desc=グゥについてはほとんど何もわかっていない。生き物ですらなく、下水の物質が寄り集まり、かすかな自我を持つようになったものかもしれない。
actors.mobs.reborngoo.warning=グゥが膨れ上がる。正面から離れろ！
actors.mobs.reborndm300.desc=この機械は数世紀前にドワーフが造ったものだ。その後、ドワーフは機械の代わりにゴーレムや精霊、さらには悪魔まで使い始めた。それがやがて彼らの文明を衰退させた。DM-300と同種の機械は主に建設や採掘に使われ、ときには都市の防衛にも投入された。
actors.mobs.reborndm300.repair=DM-300が自己修復した！
actors.mobs.reborndm300.warning=機関が悲鳴を上げる。印のある場所から離れろ！
actors.mobs.rebornking.desc=ドワーフ最後の王は、生と死に深い知識を持つことで知られていた。王は廷臣たちを説得し、永遠の若さを授けるという儀式に参加させた。だが、若さを手にしたのは王ただ一人だった。おまけに不死者の軍勢まで手に入れたのだ。
actors.mobs.rebornking.warning=王が手を上げた！
actors.mobs.rebornking.herald_fell=持ち場を守れ、臆病者ども！
actors.mobs.rebornking$retainer.name_0=王の衛兵
actors.mobs.rebornking$retainer.desc_0=傷だらけの鎧を着たドワーフの死体。今も王を守り続けている。
actors.mobs.rebornking$retainer.name_1=宮廷術師
actors.mobs.rebornking$retainer.desc_1=死者の中から呼び戻された宮廷魔術師。その手に黒い魔力が集まっている。
actors.mobs.rebornking$retainer.name_2=王の伝令
actors.mobs.rebornking$retainer.desc_2=顎が砕けても、伝令は王の命令を怒鳴り続ける。死者たちはそれに従う。
actors.mobs.rebornking$retainer.name_3=不死の弓兵
actors.mobs.rebornking$retainer.desc_3=弓とともに葬られたドワーフ。使い方はまだ覚えている。
actors.mobs.rebornyog.desc=ヨグ＝ドージェワは古の神であり、混沌の領域から来た強力な存在である。100年前、古代ドワーフたちはその悪魔軍との戦いに辛うじて勝利したが、神自身を倒すことはできなかった。そこで彼らは、ヨグ＝ドージェワは弱体化しており二度と復活できないだろうと考え、都市の地下の広間に幽閉したのである。
actors.mobs.rebornyog.warning=空気が裂ける。明滅する印から離れろ！
actors.mobs.rebornyog.inherit_rot=肉は朽ちる。我は残る。
actors.mobs.rebornyog.inherit_fire=炎は我がものとなった。
actors.mobs.rebornyog$rotting.desc=腐った肉の巨大な拳。指の隙間から悪臭を放つ粘液が染み出し、足元の石を汚している。
actors.mobs.rebornyog$rotting.warning=腐敗の拳が振りかぶった！
actors.mobs.rebornyog$burninghand.desc=炎に包まれた巨大な拳。指を握り込むたびにぱちぱちと音が鳴り、床に火の粉が落ちる。
actors.mobs.rebornyog$burninghand.warning=燃える拳の前に火の粉が集まる！
actors.mobs.reborntengu.shadow_broken=我が影が…！
