levels.rebornsiderooms.leave=Để lại
actors.mobs.npcs.echoreflection.name=hình bóng của bạn
actors.mobs.npcs.echoreflection.desc=Một bản sao nhợt nhạt của bạn đứng im chờ đợi. Nó chỉ chiến đấu khi được thách đấu. Đánh bại nó để nhận một điểm kỹ năng. Rời phòng sẽ kết thúc trận đấu và hồi đầy máu cho hình bóng.
actors.mobs.npcs.echoreflection.challenge=Thách đấu hình bóng của bạn? Chiến thắng mang lại một điểm kỹ năng. Bạn có thể rút lui, nhưng hình bóng sẽ hồi máu nếu bạn rời phòng.
actors.mobs.npcs.echoreflection.accept=Thách đấu
actors.mobs.npcs.echoreflection.withdrawn=Hình bóng của bạn lại đứng im.
actors.mobs.npcs.echoreflection.victory=Hình bóng tan biến, để lại một cuộn giấy kỹ năng.
actors.mobs.npcs.barbecueking.name=vua chuột
actors.mobs.npcs.barbecueking.desc=Ngay cả vua cũng phải ăn. Hắn tìm được một góc yên tĩnh để nướng bữa tối.
actors.mobs.npcs.barbecueking.greeting=Việc triều chính. Rất quan trọng. Rất thơm ngon.
actors.mobs.npcs.barbecueking.stolen=NÀY! Của ta mà!
actors.mobs.npcs.barbecueking.after=Mong là ngươi mắc nghẹn.
actors.mobs.npcs.forgottenoffering.name=lễ vật bị lãng quên
actors.mobs.npcs.forgottenoffering.desc=Một khẩu phần ăn và một lọ thuốc hồi máu nằm dưới lớp pha lê. Chọn một; món còn lại sẽ hóa thành bụi.
actors.mobs.npcs.watchremains.name=người lính gác đã ngã xuống
actors.mobs.npcs.watchremains.desc=Xương của một lính gác nằm cạnh bức tường bị phá. Một mẩu giấy được giắt dưới chiếc mũ sắt.
actors.mobs.npcs.watchremains.note=Giữ cửa suốt đêm. Chúng lại chui qua tường.
