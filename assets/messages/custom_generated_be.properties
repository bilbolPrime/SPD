custom.generated.entry_mages_excel_in_magic_you_have_invested_a_total_o_551400eee3=Магі выдатна валодаюць магіяй.\nВы ўклалі ў гэтую галіну ўсяго %s ачкоў.\nНаступнае прасоўванне будзе каштаваць вам %s ачко навыку.\n%sВы больш не можаце прасоўвацца па гэтай лініі.
