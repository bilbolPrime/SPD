custom.generated.entry_read_this_scroll_to_unleash_the_wrath_of_the_dun_db502abf39=Прачытайце гэты скрутак, каб вызваліць гнеў духаў падзямелля і забіць усіх на бягучым узроўні. Ну, амаль усіх. Некаторыя з найбольш магутных істот могуць не пацярпець.
custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=Загавор на гэтым скрутку створыць ілюзорных двайнікоў чытача, якія будуць пераследваць яго ворагаў.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Загавор на гэтым скрутку імгненна здымае з зброі, даспехаў, пярсцёнкаў і прадметаў, якія чытальнік носіць, любыя злыя чары, якія могуць перашкодзіць уладальніку зняць іх.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Неапрацаваная магічная сіла, заключаная ў гэтым пергаменце, пасля вызвалення зарадзіць усе палачкі чытача да поўнай магутнасці.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Скрутак захоўвае сакрэт забароненага рытуалу. У абмен на дабрабыт чытача скрутак наносіць шкоду ўсім, хто знаходзіцца побач, і цалкам лечыць яго.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Скрутак здаецца халаднейшым за наваколле. Быццам гэта партал у халаднейшае вымярэнне.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Загавор на гэтым пергаменце імгненна пераносіць чытача ў выпадковае месца на ўзроўні падзямелля. Яго можна выкарыстоўваць, каб пазбегнуць небяспечнай сітуацыі, але няўдачлівы чытач можа апынуцца ў яшчэ больш небяспечным месцы.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Гэты скрутак змяшчае разбуральную энергію, якую можна накіраваць псіянічным шляхам, каб нанесці велізарную шкоду ўсім істотам у полі зроку. Суправаджальны ўспышка святла часова асляпіць усіх у зоне ўздзеяння, у тым ліку і чытача скрутка.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Гэты скрутак здольны напаўняць зброю або даспехі выпадковым зачараваннем, надаючы ім асаблівую сілу.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Гэты скрутак палепшыць адзін прадмет, палепшыўшы яго якасць. Магутнасць і колькасць зарадаў палачкі павялічацца; зброя будзе наносіць больш шкоды або часцей трапляць у цэль; даспехі будуць адбіваць дадатковыя ўдары; уздзеянне пярсцёнка на яго ўладальніка ўзмоцніцца. Зброя і даспехі таксама будуць патрабаваць менш сілы для выкарыстання, і любыя праклёны з прадмета будуць знятыя.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Пры чытанні ўслых гэты скрутак выпусціць рык, які абудзіць усіх монстраў і папярэдзіць іх пра месцазнаходжанне чытача.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Калі прачытаць натхняльныя словы, яны падрыхтуюць вас да бою.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=Калі прачытаць мудрыя словы, яны палепшаць вашыя навыкі.

