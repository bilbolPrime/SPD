custom.generated.entry_welcome_to_my_dungeon_non_rodent_here_no_one_que_4a64573e39=Вітаем у маім падзямеллі негрызуноў. Тут ніхто не сумняваецца ў маім кіраванні.\n\nМаё войска амаль гатова ўварвацца ў свет. Аднак мне патрэбен яшчэ адзін пеон для майго плана.\nНе адчувай сябе шчаслівым дурнем, ты толькі сродак для дасягнення мэты.\nЯ павінен выпрабаваць сваё войска, перш чым абліць свой гнеў на ўсіх негрызуноў-едакоў сыру.\nУ наступным пакоі ты знойдзеш самага слабага з майго войска.\n\nКАЛІ ты яго знішчыш, я ўзнагароджу цябе. А потым мы будзем рабіць усё гэта зноў і зноў, пакуль ты не памрэш...
