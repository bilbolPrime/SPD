custom.generated.entry_mages_rely_on_summoned_creatures_to_do_their_bid_c73b92239f=Магі спадзяюцца на выкліканых істот, каб выконваць іх загады.\nАбмежавана 3 (+%s бонус ад навыку Прызывальніка) актыўнымі выклікамі\nВы ўклалі ў гэтую галіну ў агульнай складанасці %s ачкі.\nНаступнае прасоўванне будзе каштаваць вам %s ачко навыку.\n%sВы больш не можаце прасоўвацца ў гэтай лініі
custom.generated.entry_mages_rely_on_their_magical_powers_to_gain_an_ad_a5c9effea1=Магі спадзяюцца на свае магічныя здольнасці, каб атрымаць перавагу над іншымі.\nВы ўклалі ў гэтую галіну ў агульнай складанасці %s ачкоў.\nНаступнае прасоўванне будзе каштаваць вам %s ачко навыку.\n%sВы больш не можаце прасоўвацца ў гэтай лініі.
custom.generated.entry_mages_start_with_a_unique_wand_of_magic_missile_a0dcd053c5=Магі пачынаюць з унікальнай палачкай Магічнага Ракета. Пазней гэтую палачку можна "расчараваць", каб палепшыць іншую палачку.
