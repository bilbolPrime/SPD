journey.title=征途
journey.intro=約格已奪得護符，他的軍隊正湧向地表。\n\n帶領六位英雄穿越淪陷之地。每次出征前，選擇路線和英雄。倒下的英雄將永遠離開本次征途。
journey.badge_hint=完成至少一次征途，即可解鎖「_%s_」徽章。
journey.new=新的征途
journey.deploy=出征
journey.camp=營地
journey.chest=營地儲物箱
journey.chest_hint=點擊裝備可穿戴或卸下。也可以在背包和營地儲物箱之間轉移物品。
journey.store=存入
journey.take=取出
journey.choose=選擇路線，然後在營地為英雄做好準備。
journey.objective=抵達最後一層的出口即可打通這條路線並返回營地。出發前請為英雄備好裝備和補給。
journey.blocked=完成相連的區域後，即可開啟這條路線。
journey.cleared=此區域已完成。
journey.fallen=這位英雄已經陣亡，無法再參加遠征。
journey.lost=六位英雄全部陣亡。征途結束了。
journey.reached=約格倒下了，入侵就此終結。
journey.destination=約格的領地
journey.stage=第%d階段
journey.sewers=下水道
journey.prison=監獄
journey.caves=洞穴
journey.city=矮人都市
journey.halls=惡魔大廳
journey.save_failed=無法儲存征途，請重試。
journey.start_failed=無法開啟征途，請重試。
journey.chest_full=營地儲物箱已滿。
journey.pack_full=這位英雄的背包已滿。
journey.heroes=英雄
journey.choose_subclass=選擇轉職方向
journey.inventory=背包
journey.gold=可在營地購買補給。
journey.exit_hint=到達出口即可完成這片區域並返回營地。
journey.shop=營地商店
journey.buy=購買
journey.sell=出售
journey.hold=預留
journey.release=取消預留
journey.shop_hint=每清理一處區域，商品就會更換。預留的商品會保留下來。
journey.shop_empty=商品已全部售罄。
journey.sell_empty=這個背包裡沒有可出售的物品。
journey.trade_failed=這筆交易已無法進行。
journey.boss_objective=殺出一條通往競技場的路，擊敗首領後從出口離開。
journey.final_objective=擊敗約格，終結他的入侵。
journey.goo_mechanic=站在水中時，黏咕會發動強力潑濺。誘使牠發動這一攻擊，就能讓附近的水窪乾涸，斷掉牠的療傷來源。
journey.tengu_mechanic=天狗跳躍時會在原地留下火焰。
journey.subclass_reward=_解鎖轉職_
journey.dm300_mechanic=維修板只能修復DM-300一次。搶先踩上去就能將其破壞。
journey.king_mechanic=附近的護衛會替國王承受一半傷害。設法將他們引離國王。
journey.yog_mechanic=約格的裂隙攻擊會連續擊打兩次。等第二擊結束後再穿過。
journey.repair_pad=維修板
journey.repair_pad_desc=這塊維修板可以修復DM-300一次。踩上去即可將其破壞。
journey.remains=一位陣亡英雄的遺物仍留在此處。
journey.recover=取回遺物
journey.recovery_objective=取回遺物後，返回第一層的入口。
journey.saves=選擇征途
journey.slot=征途 %d
journey.floors=共%d層
journey.floor=第%1$d層，共%2$d層
journey.target_depth=到達_地下第%d層_。
journey.supply_objective=擊敗各層守衛，再取走補給。營地商店能多出售_四件物品_。
journey.guards_left=剩餘守衛：_%d_。
journey.guards_cleared=道路已暢通。前往最後的出口，返回營地。
journey.guards_blocked=離開前先擊敗剩餘守衛。
journey.entrance_hint=抵達最後一層的出口即可結束本次遠征。
journey.floor_exit_hint=這段樓梯通往這片區域的下一層。
journey.floor_entrance_hint=這段樓梯通往上一層。
journey.supply_guard=守衛
journey.checkpoint=關卡
journey.supplies=補給倉庫
journey.rescue=營救
journey.outpost=前哨站
journey.checkpoint_objective=擊敗守衛並拿到_軍官的鑰匙_，用它打開最後一層的出口。
journey.rescue_objective=擊敗守衛，_救出最後一層的俘虜_。每次營救可使營地商店價格降低_5%_，最多降低_25%_。
journey.outpost_objective=擊敗前哨站的守衛，_阻止援軍支援下一個首領_。
journey.officer_name=軍官
journey.officer_desc=這名軍官帶著最後一道門的鑰匙。
journey.pass_name=大門鑰匙
journey.pass_desc=打開這處關卡的出口。
journey.cache_name=補給箱
journey.cache_desc=送往營地商店的物資。擊敗守衛後才能取走。
journey.captive_name=俘虜
journey.captive_desc=擊敗守衛，救出這名俘虜。他的幫助會降低營地商店的價格。
journey.pass_blocked=拿到軍官的鑰匙才能打開出口。
journey.cache_blocked=離開前先取走補給。
journey.rescue_blocked=離開前先救出俘虜。
journey.cache_secured=補給已備好，可以送回營地了。
journey.captive_freed=俘虜動身前往營地。
journey.shop_discount=營地商店價格降低_%d%%_。
journey.boss_garrison=這個首領有額外的守衛。
journey.outpost_hint=攻下本區域的前哨站，就能阻止援軍與首領會合。
journey.boss_unsupported=首領已無法獲得援軍。
journey.forces=約格的軍隊
journey.forces_desc=約格的軍隊正在擴張勢力。
journey.leader_blocked=離開前先擊敗援軍首領。
journey.leader_name=援軍首領
journey.reinforced=_援軍：_ %s
journey.forces_settled=約格的軍隊正駐守此地。
journey.boss_dispatch=擊敗這個首領，牠就不會再派出援軍。
journey.troops_and=%1$s與%2$s
journey.troops_comma=%1$s、%2$s
journey.loot=戰利品：_%s_
journey.resting=休息中
journey.rest_desc=另一位英雄出發後，這位英雄便可再次出戰。休息期間仍可更換裝備。
