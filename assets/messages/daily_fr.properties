daily.brief_0=Les renforts du Roi des rats approchent. Battez-le avant leur arrivée à la cour. Un gardien captif peut vous prêter main-forte, et des provisions vous attendent dans la réserve gardée.
daily.brief_1=L'émeute couvre la fuite de Tengu. Battez les deux capitaines pour ouvrir son repaire, puis vainquez Tengu à temps. Libérez les prisonniers pour qu'ils combattent les gardes, ou fouillez l'armurerie verrouillée. Le repaire se refermera derrière vous.
daily.brief_2=Trois mineurs sont piégés sous terre, et le dernier ascenseur va partir. Ouvrez leurs abris, ramenez-les tous vivants et remontez avec eux. DM-300 rôde dans les galeries : combattez-le ou contournez-le. Cherchez des provisions et des raccourcis verrouillés.
daily.brief_3=Un Griffe-de-glace, un Gnoll dos-de-givre et une Corne-de-givre rôdent dans ces grottes. Abattez-les dans l'ordre de votre choix, puis gagnez la sortie avant la tempête. Les passages secondaires abritent des provisions, mais les fouiller prend du temps.
daily.brief_4=Trois autels font entrer des démons dans les salles. Scellez-les avant la fin du rituel. Chaque autel fermé coupe une source de renforts. Choisissez votre itinéraire et fouillez les salles voisines si vous manquez de provisions.
daily.brief_5=Tenez l'avant-poste jusqu'à l'arrivée des secours. Le capitaine doit survivre à cinq vagues. Vos défenseurs gardent le centre ; vous pouvez combattre, chercher des provisions ou ouvrir les cellules pour recruter de l'aide. Les dernières vagues peuvent arriver de plusieurs côtés.
daily.brief_6=L'or de la cité est dans le trésor du roi. Prenez la clé du capitaine, ouvrez la chambre forte, puis fuyez par la porte opposée avant sa fermeture. Ouvrir le trésor déclenche l'alarme. Préparez votre fuite en fouillant les réserves et en ouvrant les raccourcis, ou tentez un vol plus rapide.
daily.rules=Chaque date propose son héros, son équipement et son donjon. Dépensez vos points de compétence avant de partir. Le temps se compte en tours. Quitter un événement met fin à la tentative. Les résultats sont séparés ; ces événements ne débloquent ni badges ni découvertes du Codex.
