levels.sign.burn=Gdy próbujesz odczytać znak, wybucha on zielonkawym płomieniem.
levels.sign.tip_01=Nie przeceniaj swojej siły, używaj broni i zbroi, z którymi możesz sobie poradzić.
levels.sign.tip_05=Uważaj na Goo!
levels.sign.tip_06=Pixel-Mart - wszystko, czego potrzebujesz do udanej przygody!
levels.sign.tip_07=Zidentyfikuj swoje mikstury i zwoje jak najszybciej. Nie odkładaj tego na moment, gdy naprawdę ich potrzebujesz.
levels.sign.tip_08=Bycie głodnym nie boli, ale głodowanie już tak.
levels.sign.tip_10=Nie wypuszczaj Tengu!
levels.sign.tip_11=Pixel-Mart. Wydawaj pieniądze. Żyj dłużej.
levels.sign.tip_12=Jeśli zaatakuje cię kilka potworów jednocześnie, spróbuj wycofać się za drzwi.
levels.sign.tip_14=Nie ma sensu posiadać więcej niż jednego Ankh jednocześnie, ponieważ utracisz je po wskrzeszeniu.
levels.sign.tip_15=NIEBEZPIECZEŃSTWO! Ciężki sprzęt może spowodować obrażenia, utratę kończyn lub śmierć!
levels.sign.tip_16=Pixel-Mart. Bezpieczniejsze życie w lochach.
levels.sign.tip_17=Kiedy ulepszasz zaczarowaną broń, istnieje szansa na zniszczenie tego zaklęcia.
levels.sign.tip_18=Broń i zbroje niszczeją szybciej niż różdżki i pierścienie, ale jest więcej sposobów, aby je naprawić.
levels.sign.tip_19=Jedynym sposobem na zdobycie Zwoju Unicestwienia jest otrzymanie go w prezencie od duchów lochów.
levels.sign.tip_20=W obecności Jego Wysokości broń jest niedozwolona!
