custom.difficulty.easy=Łatwy
custom.difficulty.easy.desc=- Zacznij z 2 dodatkowymi racjami.\n- Zacznij z 2 miksturami uzdrawiania.\n- Zacznij z 200 sztukami złota.\n- Zacznij z 2 kryształami duszy.\n- Premia za odkrywanie ukrytych drzwi i pułapek.\n- Moby są słabe, zadają o 25% mniej obrażeń, otrzymują o 10% więcej obrażeń i mają o 15% mniej HP.\n- Częstotliwość pojawiania się bohaterów ustawiono na 10%.\n- Częstotliwość wypadania bohaterów ustawiono na 30%.
custom.difficulty.hard=Twardy
custom.difficulty.hard.desc=- Mikstura lecznicza przywraca 75% maks. HP.\n- Moby są silne, zadają o 10% więcej obrażeń, otrzymują o 10% mniej obrażeń i mają o 20% więcej HP.\n- Częstotliwość pojawiania się bohaterów ustawiono na 30%.\n- Częstotliwość wypadania bohaterów ustawiono na 50%.
custom.difficulty.hell.desc=- Mikstura lecznicza leczy 50% maks. HP.\n- Moby są nieśmiertelne, zadają o 35% więcej obrażeń, otrzymują o 30% mniej obrażeń i mają o 45% więcej HP.\n- Częstotliwość pojawiania się bohaterów ustawiono na 50%.\n- Bohater zaczyna z 4 punktami maks. HP mniej.\n- Bohater zyskuje 1 punkt maks. HP mniej po awansie.\n- Częstotliwość wypadania bohaterów ustawiono na 70%.
custom.difficulty.just_kill_me=Po prostu mnie zabij
custom.difficulty.just_kill_me.desc=- Zaczyna z dwoma miksturami doświadczenia.\n- Mikstura lecznicza leczy 10% maks. HP.\n- Moby są Bóstwami, zadają o 60% więcej obrażeń, otrzymują o 40% mniej obrażeń i mają o 75% więcej HP.\n- Częstotliwość pojawiania się bohaterów ustawiono na 100%.\n- Bohater zaczyna z 8 mniej maks. HP.\n- Bohater zyskuje 3 mniej maks. HP po awansie.\n- Częstotliwość wypadania bohaterów ustawiono na 100%.
custom.difficulty.nightmare.desc=- Mikstura lecznicza leczy 25% maks. HP.\n- Moby są boskie, zadają o 45% więcej obrażeń, otrzymują o 30% mniej obrażeń i mają o 60% więcej HP.\n- Częstotliwość pojawiania się bohaterów ustawiono na 70%.\n- Bohater zaczyna z 8 mniej maks. HP.\n- Bohater zyskuje 3 mniej maks. HP po awansie.\n- Częstotliwość wypadania bohaterów ustawiono na 90%.
custom.difficulty.normal.desc=- Moby są standardowe.\n- Częstotliwość pojawiania się bohaterów ustawiono na 20%.\n- Częstotliwość wypadania bohaterów ustawiono na 40%.
custom.difficulty.super_easy=Super łatwe
custom.difficulty.super_easy.desc=- Zacznij z 5 dodatkowymi racjami.\n- Zacznij z 5 miksturami uzdrawiania.\n- Zacznij z 500 sztukami złota.\n- Zacznij z 3 kryształami dusz.\n- Moby są żałosne, zadają o 50% mniej obrażeń, otrzymują o 50% więcej obrażeń i mają o 50% mniej HP.\n- Częstotliwość pojawiania się bohaterów ustawiono na 10%.\n- Częstotliwość wypadania bohaterów ustawiono na 10%.
levels.sign.dead_end=Co tu robisz?!
levels.sign.tip_02=Nie wszystkie drzwi w lochu są widoczne na pierwszy rzut oka. Jeśli utkniesz, poszukaj ukrytych drzwi.
levels.sign.tip_03=Pamiętaj, że zwiększenie siły to nie jedyny sposób na uzyskanie lepszego ekwipunku. Możesz pójść w drugą stronę, zmniejszając wymaganą siłę za pomocą Zwojów Ulepszeń.
levels.sign.tip_04=Możesz wydawać złoto w sklepach na głębszych poziomach lochów. Pierwszy jest na 6. poziomie.
levels.sign.tip_09=Atak z zaskoczenia ma większą szansę na trafienie. Na przykład, możesz zaskoczyć wroga za zamkniętymi drzwiami, wiedząc, że się zbliża.
levels.sign.tip_13=Jeśli się palisz, nie możesz ugasić ognia w wodzie, lewitując.
levels.sign.tip_21=Pixel-Mart. Specjalne ceny dla łowców demonów!
actors.blobs.waterofawareness.drink_message=Gdy bierzesz łyk, czujesz, jak wiedza wlewa się do twojego umysłu. Teraz wiesz wszystko o swoich przedmiotach. Wyczuwasz też wszystkie przedmioty na poziomie i znasz wszystkie ich sekrety.
