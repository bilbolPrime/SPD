items.scrolls.scrolloffrostlevel.name=Schriftrolle des Frosts
items.scrolls.scrolloffrostlevel.desc=Kälte dringt aus diesem Pergament.\n\nDu kannst die Schriftrolle auch überall zerreißen. Das friert alle Feinde auf der Ebene ein, bis sie Schaden erleiden. Bosse und frostimmune Kreaturen sind davon nicht betroffen. Dabei wird kein Schaden verursacht.
items.scrolls.scrolloffrostlevel.ac_tear=Zerreißen
items.scrolls.scrolloffrostlevel.tear_confirm=Wenn du diese Schriftrolle zerreißt, wird ihre Magie freigesetzt. Alle Feinde auf der Ebene bleiben eingefroren, bis sie Schaden erleiden. Bosse und frostimmune Kreaturen sind davon nicht betroffen. Dabei wird kein Schaden verursacht.\n\nDie Schriftrolle zerreißen?
items.scrolls.scrolloffrostlevel.wrong_place=Die Schriftrolle funktioniert hier nicht.
items.scrolls.scrolloffrostlevel.spent=Der Durchgang wurde bereits geöffnet. Die Schriftrolle bleibt stumm.
items.keys.key.ice_depth=Dieser Schlüssel gehört zu Ebene %d der Eishöhlen.
scenes.interlevelscene$mode.frost=Betrete die Eishöhlen...
levels.icecaveslevel.water_name=Eisiges Wasser
levels.icecaveslevel.water_desc=Eine dünne Eisschicht bricht unter den Füßen.
levels.icecaveslevel.wall_desc=Pickelspuren verschwinden unter dicken Eisadern. Die Bergleute verließen diese Stollen, als sich die Kälte im Gestein ausbreitete.
levels.cavesbosslevel.collapsed_name=Eingestürzte Höhle
levels.cavesbosslevel.collapsed_desc=Eine eingestürzte Höhle. Das Geröll versperrt jeden Durchgang.
actors.buffs.frostbite.name=Erfrierung
actors.buffs.frostbite.desc=Die Kälte verlangsamt deine Bewegung um 20%.
actors.mobs.rimebat.name=Reiffledermaus
actors.mobs.rimebat.desc=Diese blassen Fledermäuse nisten unter dem Eis. Ihr kalter Biss verlangsamt kurz die Bewegung und gibt ihnen Zeit für einen weiteren Angriff.\n\nImmun gegen Einfrieren und Kältemagie.
actors.mobs.iceclaw.name=Eisklaue
actors.mobs.iceclaw.desc=Ein Aasfresser mit einem Panzer aus dichtem Eis. Vor einem Kampf verstärkt er kurz seine Rüstung. Feuer schmilzt diesen zusätzlichen Schutz.\n\nImmun gegen Einfrieren und Kältemagie.
actors.mobs.frostback.name=Frostrücken-Gnoll
actors.mobs.frostback.desc=Dieser Gnoll überlebt die Kälte, indem er unvorsichtige Eindringlinge ausraubt. Weiche aus, wenn er seine Waffe hebt: Der schwere Schlag trifft deine vorherige Position.\n\nImmun gegen Einfrieren und Kältemagie.
actors.mobs.shardling.name=Eissplitterling
actors.mobs.shardling.desc=Ein rastloses Knäuel aus Eiskristallen. Es zielt, bevor es Splitter in gerader Linie abfeuert. Wände halten die Salve auf.\n\nImmun gegen Einfrieren und Kältemagie.
actors.mobs.hollowminer.name=Hohler Bergmann
actors.mobs.hollowminer.desc=Dieser Bergmann entkam den gefrorenen Stollen nie. Seine Laterne brennt noch, obwohl er längst tot ist. Hebt er sie, ruft er nahe Kreaturen zum Kampf. Ein Treffer unterbricht das Signal.\n\nImmun gegen Einfrieren und Kältemagie.
actors.mobs.rimehorn.name=Reifhorn
actors.mobs.rimehorn.desc=Ein schweres Tier mit bereiftem Fell. Es scharrt am Boden, bevor es geradeaus losstürmt. Geh aus dem Weg, während es sich vorbereitet.\n\nImmun gegen Einfrieren und Kältemagie.
actors.mobs.oldrime.name=Altfrost
actors.mobs.oldrime.desc=Die Bergleute fanden Altfrost unter dem Berg, begraben in Eis, das älter war als ihre Tunnel. Ihre Pickel weckten ihn. Nun bewacht er die gefrorenen Stollen und den Durchgang dahinter. Wenn er schwächer wird, bricht seine Rüstung und gibt seine Glieder frei. Achte auf schwere Hiebe, Eisstöße aus dem Boden und seinen eisigen Atem.\n\nImmun gegen Einfrieren und Kältemagie.
actors.mobs.oldrime.warning=Altfrost holt zum Schlag aus!
windows.wndjournal.ice_depth=Eis %d
levels.icebosslevel.exit_name=Höhlendurchgang
levels.icebosslevel.exit_desc=Ein schmaler Gang führt tiefer in den Berg.
levels.icebosslevel.blocked_name=Gefrorener Durchgang
levels.icebosslevel.blocked_desc=Eine Eiswand versperrt den Durchgang hinter Altfrost.
items.weapon.ice.wrong_hero=Diese Waffe ist nicht für dich bestimmt.
items.weapon.ice.already_enchanted=Diese Waffe ist bereits verzaubert.
items.weapon.ice.glaciercleaver.name=Gletscherspalter
items.weapon.ice.glaciercleaver.desc=Eine breite Klinge aus Altfrosts Eis. Ein Treffer überzieht das Ziel vier Runden lang mit Reif. Der nächste Treffer eines Gletscherspalters zerschmettert ihn und verursacht %d zusätzlichen Schaden. Nur ein Krieger kann ihn führen.
actors.buffs.frostcoating.name=Bereift
actors.buffs.frostcoating.desc=Eine dünne Reifschicht haftet an dieser Kreatur. Ein Treffer des Gletscherspalters wird sie zerschmettern.
items.weapon.ice.hoarfroststaff.name=Raureifstab
items.weapon.ice.hoarfroststaff.desc=Zwischen den Zinken dieses Stabs sammelt sich Kälte. Seine Geschosse verursachen vor Fertigkeitsboni %d-%d Schaden und verlangsamen Bewegung und Angriffe für zwei Runden. Er hat anfangs drei Ladungen und lädt sich wie ein Zauberstab auf. Nur ein Magier kann ihn führen.
items.weapon.ice.rimepick.name=Reifpickel
items.weapon.ice.rimepick.desc=Dieser schmale Eispickel findet Lücken in der Rüstung. Er umgeht ein Viertel der gegnerischen Rüstung, bei einem überraschten Ziel die Hälfte. Nur ein Schurke kann ihn führen.
items.weapon.ice.frostbow.name=Frostbogen
items.weapon.ice.frostbow.desc=Pfeile dieses Bogens zerplatzen beim Aufprall in scharfes Eis. Sie verursachen am Ziel %d%% mehr Schaden und an angrenzenden Gegnern ein Viertel des Trefferschadens. Die Splitter frieren ihre Opfer nicht ein. Nur eine Jägerin kann ihn führen.
items.weapon.ice.gravefrostscythe.name=Grabfrostsense
items.weapon.ice.gravefrostscythe.desc=Reif haftet am knochenbesetzten Griff dieser Sense. Solange sie ausgerüstet ist, verursachen deine beschworenen Skelette und Geister pro Treffer %d zusätzlichen Kälteschaden. Nur ein Nekromant kann sie führen.
items.weapon.ice.frostbiterifle.name=Frostbissgewehr
items.weapon.ice.frostbiterifle.desc=Die Kammer dieses Gewehrs ist mit Eis ausgekleidet, das nie schmilzt. Jeder Treffer verursacht zwei Runden lang Erfrierung und verlangsamt die Bewegung um 20%. Weitere Treffer erneuern den Effekt. Nur ein Söldner kann es führen.
library.ice_weapon_drop=Für jeden Helden fällt eine Waffe passend zu seiner Klasse.

actors.mobs.npcs.prospector.name=Gestrandeter Schürfer
actors.mobs.npcs.prospector.desc=Ein Schürfer in einem geflickten Mantel sucht Schutz bei der Treppe. Seine Lampe brennt kaum noch.
actors.mobs.npcs.prospector.torches=Meine Lampe hält nicht mehr lange. Auf der Flucht habe ich eine Vorratskiste auf dieser Ebene zurückgelassen. Bringst du mir _drei Fackeln_ daraus?
actors.mobs.npcs.prospector.iceclaws=Die Eisklauen haben mich aus meinem Stollen vertrieben. Töte _drei Eisklauen auf dieser Ebene_, damit ich wieder arbeiten kann.
actors.mobs.npcs.prospector.accept=Ich helfe dir.
actors.mobs.npcs.prospector.later=Nicht jetzt.
actors.mobs.npcs.prospector.need_torches=Ich brauche _drei Fackeln_. Die Vorratskiste steht noch irgendwo auf dieser Ebene.
actors.mobs.npcs.prospector.claws_left=Noch zu töten: _%d_ Eisklauen.
actors.mobs.npcs.prospector.reward=Gute Arbeit. Was möchtest du haben?
actors.mobs.npcs.prospector.rations=Zwei Lebensmittelrationen
actors.mobs.npcs.prospector.thanks=Eine Sorge weniger. Danke.
library.quest.prospector_torches.name=Eine erlöschende Lampe
library.quest.prospector_torches.desc=Bringe dem gestrandeten Schürfer drei Fackeln. Eine Vorratskiste auf seiner Ebene enthält genug.
library.quest.prospector_iceclaws.name=Eisklauen im Stollen
library.quest.prospector_iceclaws.desc=Töte drei Eisklauen auf der Ebene des Schürfers und kehre zu ihm zurück.
library.quest.prospector.reward=Wähle eine Schriftrolle der Verbesserung oder zwei Lebensmittelrationen.
items.scrolls.scrolloffrostlevel.read_confirm=Beim Lesen spürst du, dass du gleich teleportiert wirst.
