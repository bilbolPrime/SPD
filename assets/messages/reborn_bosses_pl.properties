actors.mobs.rebornboss.opening=Odsłonięty!
actors.mobs.rebornboss.interrupted=%s traci koncentrację!
actors.mobs.reborngoo.desc=Niewiele wiadomo o Glucie. Być może nie jest nawet stworzeniem, a jedynie skupiskiem substancji z kanałów, które zyskało zalążek własnej woli.
actors.mobs.reborngoo.warning=Goo pęcznieje. Zejdź mu z drogi!
actors.mobs.reborndm300.desc=Tę maszynę zbudowały krasnoludy kilka stuleci temu. Później zaczęły zastępować maszyny golemami, żywiołakami, a nawet demonami. Ostatecznie doprowadziło to do upadku ich cywilizacji. DM-300 i podobne maszyny służyły zwykle do budowy i wydobycia, czasem także do obrony miasta.
actors.mobs.reborndm300.repair=DM-300 naprawia się!
actors.mobs.reborndm300.warning=Silnik wyje. Zejdź z oznaczonych pól!
actors.mobs.rebornking.desc=Ostatni król krasnoludów słynął z głębokiej wiedzy o życiu i śmierci. Przekonał dworzan do udziału w rytuale, który miał dać im wieczną młodość. Ostatecznie otrzymał ją tylko on — a do tego armię nieumarłych.
actors.mobs.rebornking.warning=Król podnosi rękę!
actors.mobs.rebornking.herald_fell=Trzymać pozycje, tchórze!
actors.mobs.rebornking$retainer.name_0=Strażnik królewski
actors.mobs.rebornking$retainer.desc_0=Martwy krasnolud w poobijanej zbroi. Wciąż strzeże swojego króla.
actors.mobs.rebornking$retainer.name_1=Nadworny mag
actors.mobs.rebornking$retainer.desc_1=Nadworny mag przywrócony do życia. W jego dłoniach zbiera się mroczna magia.
actors.mobs.rebornking$retainer.name_2=Królewski herold
actors.mobs.rebornking$retainer.desc_2=Nawet ze złamaną szczęką ten herold wykrzykuje rozkazy Króla. Umarli są posłuszni.
actors.mobs.rebornking$retainer.name_3=Nieumarły łucznik
actors.mobs.rebornking$retainer.desc_3=Tego krasnoluda pochowano z łukiem. Nie zapomniał, jak go używać.
actors.mobs.rebornyog.desc=Yog-Dzewa to Stary Bóg, potężna istota z krain chaosu. Sto lat temu pradawne krasnoludy ledwo wygrały wojnę z jego armią demonów, ale nie zdołały zabić samego boga. Zamiast tego uwięziły go w salach pod swoim miastem, wierząc, że jest zbyt słaby, by kiedykolwiek powstać.
actors.mobs.rebornyog.warning=Powietrze pęka. Opuść migoczące znaki!
actors.mobs.rebornyog.inherit_rot=Ciało więdnie. Ja pozostaję.
actors.mobs.rebornyog.inherit_fire=Płomień jest teraz mój.
actors.mobs.rebornyog$rotting.desc=Ogromna pięść z gnijącego mięsa. Między palcami sączy się cuchnący śluz, plamiąc kamień pod nią.
actors.mobs.rebornyog$rotting.warning=Gnijąca pięść bierze zamach!
actors.mobs.rebornyog$burninghand.desc=Wielka pięść spowita ogniem. Jej palce trzaskają, gdy się zaciskają, strącając żar na podłogę.
actors.mobs.rebornyog$burninghand.warning=Przed płonącą pięścią zbiera się żar!
actors.mobs.reborntengu.shadow_broken=Mój cień…!
