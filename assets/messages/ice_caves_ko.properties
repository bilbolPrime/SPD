items.scrolls.scrolloffrostlevel.name=서리의 주문서
items.scrolls.scrolloffrostlevel.desc=양피지에서 냉기가 새어 나옵니다.\n\n어디서든 이 주문서를 찢으면 이 층의 모든 적을 얼릴 수 있습니다. 피해를 받으면 얼음이 깨집니다. 보스와 빙결에 면역인 생물에게는 효과가 없습니다. 피해는 주지 않습니다.
items.scrolls.scrolloffrostlevel.ac_tear=찢기
items.scrolls.scrolloffrostlevel.tear_confirm=이 주문서를 찢으면 안에 담긴 마력이 풀려나 이 층의 모든 적들을 얼립니다. 피해를 받으면 얼음이 깨집니다. 보스와 빙결에 면역인 생물에게는 효과가 없습니다. 피해는 주지 않습니다.\n\n주문서를 찢으시겠습니까?
items.scrolls.scrolloffrostlevel.wrong_place=주문서는 이곳에서 작동하지 않습니다.
items.scrolls.scrolloffrostlevel.spent=통로는 이미 열렸습니다. 주문서가 반응하지 않습니다.
items.keys.key.ice_depth=이 열쇠는 얼음 동굴 %d층의 열쇠입니다.
scenes.interlevelscene$mode.frost=얼음 동굴에 들어가는 중...
levels.icecaveslevel.water_name=얼음물
levels.icecaveslevel.water_desc=얇은 얼음이 발밑에서 부서집니다.
levels.icecaveslevel.wall_desc=곡괭이 자국이 두꺼운 얼음 줄기 아래로 사라집니다. 냉기가 암석에 퍼지자 광부들은 이 갱도를 버렸습니다.
levels.cavesbosslevel.collapsed_name=무너진 동굴
levels.cavesbosslevel.collapsed_desc=무너진 동굴입니다. 떨어진 바위 때문에 지나갈 수 없습니다.
actors.buffs.frostbite.name=동상
actors.buffs.frostbite.desc=냉기로 인해 이동 속도가 20% 감소합니다.
actors.mobs.rimebat.name=서리 박쥐
actors.mobs.rimebat.desc=얼음 아래에 둥지를 트는 창백한 박쥐입니다. 차가운 이빨로 물어 잠시 이동을 늦춘 뒤, 선회하여 다시 공격합니다.\n\n빙결과 냉기 마법에 면역입니다.
actors.mobs.iceclaw.name=얼음발톱
actors.mobs.iceclaw.desc=단단한 얼음 껍질을 두른 청소동물입니다. 싸움에 앞서 몸을 웅크려 잠시 방어력을 높입니다. 불은 이 추가 보호막을 녹입니다.\n\n빙결과 냉기 마법에 면역입니다.
actors.mobs.frostback.name=서리등 놀
actors.mobs.frostback.desc=이 놀은 동굴에 들어온 이들을 약탈하며 추위를 버텼습니다. 무기를 들어 올리면 피하세요. 강한 일격은 당신이 서 있던 곳에 떨어집니다.\n\n빙결과 냉기 마법에 면역입니다.
actors.mobs.shardling.name=얼음 조각령
actors.mobs.shardling.desc=끊임없이 움직이는 얼음 결정 덩어리입니다. 조준한 뒤 직선으로 파편을 발사합니다. 벽이 파편을 막아 줍니다.\n\n빙결과 냉기 마법에 면역입니다.
actors.mobs.hollowminer.name=텅 빈 광부
actors.mobs.hollowminer.desc=얼어붙은 갱도를 빠져나오지 못한 광부입니다. 주인은 오래전에 죽었지만 등불은 아직 타오릅니다. 등불을 들어 올리게 두면 근처 생물을 전투로 불러 모읍니다. 공격을 맞히면 신호를 끊을 수 있습니다.\n\n빙결과 냉기 마법에 면역입니다.
actors.mobs.rimehorn.name=서리뿔
actors.mobs.rimehorn.desc=털에 서리가 잔뜩 낀 육중한 짐승입니다. 땅을 긁다가 일직선으로 돌진합니다. 준비하는 동안 경로에서 벗어나세요.\n\n빙결과 냉기 마법에 면역입니다.
actors.mobs.oldrime.name=고대 서리
actors.mobs.oldrime.desc=광부들은 산 아래에서 갱도보다 오래된 얼음에 묻힌 고대 서리를 발견했습니다. 곡괭이 소리가 그것을 깨웠습니다. 이제 얼어붙은 광산과 그 너머의 통로를 지킵니다. 약해질수록 갑옷이 부서져 팔다리가 자유로워집니다. 강한 휘두르기, 바닥을 뚫고 솟는 얼음, 얼어붙는 숨결을 조심하세요.\n\n빙결과 냉기 마법에 면역입니다.
actors.mobs.oldrime.warning=고대 서리가 공격하려고 몸을 젖힙니다!
windows.wndjournal.ice_depth=얼음 %d
levels.icebosslevel.exit_name=동굴 통로
levels.icebosslevel.exit_desc=좁은 통로가 산속 깊은 곳으로 이어집니다.
levels.icebosslevel.blocked_name=얼어붙은 통로
levels.icebosslevel.blocked_desc=얼음벽이 고대 서리 뒤의 통로를 막고 있습니다.
items.weapon.ice.wrong_hero=당신은 이 무기를 사용할 수 없습니다.
items.weapon.ice.already_enchanted=이 무기에는 이미 마법이 부여되어 있습니다.
items.weapon.ice.glaciercleaver.name=빙하 절단검
items.weapon.ice.glaciercleaver.desc=고대 서리의 얼음을 깎아 만든 넓은 칼날입니다. 명중하면 대상을 네 턴 동안 서리로 덮습니다. 다음 빙하 절단검의 공격이 서리를 부수며 %d의 추가 피해를 줍니다. 전사만 사용할 수 있습니다.
actors.buffs.frostcoating.name=서리 덮임
actors.buffs.frostcoating.desc=이 생물은 얇은 서리로 덮여 있습니다. 빙하 절단검의 공격이 서리를 부술 것입니다.
items.weapon.ice.hoarfroststaff.name=상고대 지팡이
items.weapon.ice.hoarfroststaff.desc=지팡이 끝의 갈래 사이로 냉기가 모입니다. 마법탄은 기술 보너스 적용 전 %d-%d의 피해를 주며, 두 턴 동안 이동과 공격을 느리게 합니다. 처음에는 세 번 충전되며 마법 막대처럼 재충전됩니다. 마법사만 사용할 수 있습니다.
items.weapon.ice.rimepick.name=서리 곡괭이
items.weapon.ice.rimepick.desc=가느다란 얼음 곡괭이가 갑옷의 틈을 파고듭니다. 대상 방어력의 4분의 1을 무시하며, 기습 시에는 절반을 무시합니다. 도적만 사용할 수 있습니다.
items.weapon.ice.frostbow.name=서리 활
items.weapon.ice.frostbow.desc=이 활의 화살은 명중하면 날카로운 얼음으로 터집니다. 대상에게 %d%% 더 많은 피해를 주고, 인접한 적들에게 그 타격 피해의 4분의 1을 줍니다. 파편은 적을 얼리지 않습니다. 사냥꾼만 사용할 수 있습니다.
items.weapon.ice.gravefrostscythe.name=무덤서리 낫
items.weapon.ice.gravefrostscythe.desc=뼈로 감싼 낫자루에 서리가 붙어 있습니다. 장착 중에는 당신이 소환한 해골과 유령이 공격할 때마다 %d의 추가 냉기 피해를 줍니다. 강령술사만 사용할 수 있습니다.
items.weapon.ice.frostbiterifle.name=동상 소총
items.weapon.ice.frostbiterifle.desc=약실에 절대 녹지 않는 얼음이 붙어 있습니다. 사격이 명중하면 두 턴 동안 동상을 입혀 이동 속도를 20% 낮춥니다. 다시 명중하면 지속 시간이 갱신됩니다. 용병만 사용할 수 있습니다.
library.ice_weapon_drop=영웅마다 자신의 직업에 맞는 무기가 하나씩 떨어집니다.

actors.mobs.npcs.prospector.name=발이 묶인 광부
actors.mobs.npcs.prospector.desc=기운 외투를 걸친 광부가 계단 옆에 몸을 피하고 있습니다. 등불은 곧 꺼질 듯합니다.
actors.mobs.npcs.prospector.torches=등불이 얼마 못 갈 것 같아. 도망치면서 이 층에 보급품 상자를 두고 왔지. 거기서 _횃불 세 개_만 가져다주겠나?
actors.mobs.npcs.prospector.iceclaws=얼음발톱들 때문에 갱도에서 쫓겨났어. 다시 일할 수 있게 _이 층의 얼음발톱 세 마리_를 처치해 주겠나?
actors.mobs.npcs.prospector.accept=도와드리죠.
actors.mobs.npcs.prospector.later=지금은 안 됩니다.
actors.mobs.npcs.prospector.need_torches=_횃불 세 개_가 필요해. 보급품 상자는 아직 이 층 어딘가에 있을 거야.
actors.mobs.npcs.prospector.claws_left=남은 얼음발톱: _%d_마리.
actors.mobs.npcs.prospector.reward=수고했어. 어느 쪽이 좋겠나?
actors.mobs.npcs.prospector.rations=식량 2개
actors.mobs.npcs.prospector.thanks=걱정 하나 덜었군. 고맙네.
library.quest.prospector_torches.name=꺼져가는 등불
library.quest.prospector_torches.desc=발이 묶인 광부에게 횃불 세 개를 가져다주세요. 같은 층의 보급품 상자에 충분한 수가 들어 있습니다.
library.quest.prospector_iceclaws.name=갱도의 얼음발톱
library.quest.prospector_iceclaws.desc=광부가 있는 층에서 얼음발톱 세 마리를 처치하고 돌아가세요.
library.quest.prospector.reward=강화의 주문서 1개 또는 식량 2개를 선택할 수 있습니다.
items.scrolls.scrolloffrostlevel.read_confirm=읽다 보니 곧 순간이동될 것 같은 느낌이 듭니다.
