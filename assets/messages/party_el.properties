actors.skills.raiseskeletonskill.desc=Καλεί έναν σκελετό να πολεμήσει στο πλευρό σου.
network.partysession.background=Η σύνδεση με την ομάδα διακόπηκε επειδή έφυγες από το παιχνίδι.
items.corpse.name=πτώμα
items.corpse.desc=Ένα φρέσκο πτώμα, κατάλληλο για νεκρομαντεία.
items.armorkit.desc=Αυτά τα εργαλεία μετατρέπουν οποιαδήποτε πανοπλία σε επική. Διατηρεί τις ιδιότητές της και αποκτά μια ικανότητα της κλάσης σου. Δεν χρειάζονται γνώσεις χειροτεχνίας.
items.bomb.desc=Μια μικρή βόμβα γεμάτη μαύρη πυρίτιδα. Εκρήγνυται εκεί όπου προσγειώνεται.
items.quest.driedrose.desc=Το τριαντάφυλλο έχει ξεραθεί εδώ και καιρό, αλλά κρατά όλα του τα πέταλα.\n\nΕπίστρεψέ το στο φάντασμα.
items.quest.phantomfish.desc=Αυτό το μικρό διάφανο ψάρι διακρίνεται με δυσκολία στον αέρα. Στο νερό γίνεται σχεδόν αόρατο.\n\nΕπίστρεψέ το στο φάντασμα.
items.tomeofmastery.desc=Αυτό το λεπτό βιβλίο με φθαρμένο δερμάτινο εξώφυλλο φαίνεται να κρύβει πολλή γνώση. Το διάβασμα χρειάζεται λίγο χρόνο.\n\nΣου επιτρέπει να επιλέξεις υποκλάση.
items.weightstone.desc=Επιτρέπει τη ζυγοστάθμιση ενός όπλου κοντινής μάχης για μεγαλύτερη ταχύτητα ή ακρίβεια.
items.wands.wandofamok.desc=Το μοβ φως τρελαίνει τον στόχο, που επιτίθεται αδιακρίτως στα κοντινά πλάσματα.
items.wands.wandofavalanche.desc=Αν χτυπήσει τοίχο ή άλλο στερεό εμπόδιο, προκαλεί κατολίσθηση που τραυματίζει και ζαλίζει τα πλάσματα της περιοχής.
items.wands.wandofflock.desc=Καλεί ένα κοπάδι μαγικών προβάτων που κλείνει προσωρινά τον δρόμο.
items.wands.wandofpoison.desc=Δηλητηριάζει τον στόχο και προκαλεί περιοδική ζημιά. Οι αναβαθμίσεις παρατείνουν το δηλητήριο.
items.wands.wandofreach.desc=Μαζεύει αντικείμενα από μακριά και ανταλλάσσει τη θέση σου με εχθρούς. Το κύμα ενεργοποιεί παγίδες, πατά χόρτα και ανοίγει ή κλείνει πόρτες στη διαδρομή του.
items.wands.wandofslowness.desc=Μειώνει προσωρινά στο μισό την ταχύτητα κίνησης και επίθεσης του στόχου.
items.wands.wandofteleportation.desc=Μεταφέρει ένα πλάσμα σε τυχαίο σημείο του ορόφου.
items.weapon.melee.dualswords.desc=Δύο κοφτερές λεπίδες για δυνατότερα χτυπήματα.
items.weapon.missiles.cupidarrow.desc=Λένε πως αυτό το βέλος ανήκε στον Έρωτα. Πρόσεχε ποιον σημαδεύεις.
items.weapon.missiles.curaredart.desc=Αυτά τα βελάκια προκαλούν λίγη ζημιά, αλλά μπορούν να παραλύσουν τον στόχο και να τον αφήσουν ανυπεράσπιστο.
items.weapon.missiles.incendiarydart.desc=Η αιχμή καρφώνεται στον στόχο, ενώ το μείγμα πάνω στο βελάκι παίρνει φωτιά.
items.weapon.missiles.soulcrystal.desc=Ένας κρύσταλλος που μπορεί να αιχμαλωτίσει ψυχές. Ρίξ' τον σε έναν αδύναμο ή εξασθενημένο εχθρό για να παγιδεύσεις το πνεύμα του.
items.weapon.missiles.tamahawk.desc=Αυτό το τσεκούρι ρίψης δεν είναι ιδιαίτερα βαρύ, αλλά απαιτεί δύναμη για σωστή χρήση.
network.partytext.weapon_fast=Αυτό το όπλο είναι γρήγορο.
network.partytext.weapon_slow=Αυτό το όπλο είναι αργό.
network.partytext.weapon_accurate=Αυτό το όπλο είναι ακριβές.
network.partytext.weapon_inaccurate=Αυτό το όπλο είναι ανακριβές.
network.partytext.weapon_fast_and_accurate=Αυτό το όπλο είναι γρήγορο και ακριβές.
network.partytext.weapon_fast_but_inaccurate=Αυτό το όπλο είναι γρήγορο, αλλά ανακριβές.
network.partytext.weapon_slow_but_accurate=Αυτό το όπλο είναι αργό, αλλά ακριβές.
network.partytext.weapon_slow_and_inaccurate=Αυτό το όπλο είναι αργό και ανακριβές.
network.partytext.necroblade_bolt=Από το επίπεδο 5, η πλήρως φορτισμένη λεπίδα μπορεί να ρίξει _Σκοτεινό βλήμα_, που μπορεί να καταστρέψει την ουσία ενός στόχου και να τον κάνει υπηρέτη.
network.partytext.necroblade_intro=Σφυρηλατημένη με σκοτεινή μαγεία, η λεπίδα καταβροχθίζει τις ψυχές των θυμάτων της και δυναμώνει.
network.partytext.necroblade_energy=Αποθηκευμένες ψυχές: _%s/100_
network.partytext.necroblade_damage=Οι ψυχές προσθέτουν _0–%d ζημιά_.
network.partytext.necroblade_hungry=Η λεπίδα μπορεί να καταναλώσει ένα πλήρες απόθεμα ψυχών για να δυναμώσει.
network.partytext.necroblade_full=Η λεπίδα δεν μπορεί πλέον να αναβαθμιστεί καταναλώνοντας ψυχές.
