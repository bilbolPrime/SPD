actors.mobs.rebornboss.opening=Terbuka!
actors.mobs.rebornboss.interrupted=%s kehilangan konsentrasi!
actors.mobs.reborngoo.desc=Tak banyak yang diketahui tentang Goo. Mungkin ia bahkan bukan makhluk hidup, melainkan gumpalan zat dari selokan yang mulai memiliki kehendaknya sendiri.
actors.mobs.reborngoo.warning=Goo mengembang. Minggir dari jalurnya!
actors.mobs.reborndm300.desc=Mesin ini dibuat oleh para kurcaci beberapa abad lalu. Belakangan, mereka mulai mengganti mesin dengan golem, elemental, bahkan iblis. Pada akhirnya, hal itu membawa peradaban mereka menuju kehancuran. DM-300 dan mesin sejenis biasanya dipakai untuk pembangunan dan penambangan, kadang juga untuk mempertahankan kota.
actors.mobs.reborndm300.repair=DM-300 memperbaiki dirinya!
actors.mobs.reborndm300.warning=Mesin menjerit. Tinggalkan tanah yang ditandai!
actors.mobs.rebornking.desc=Raja terakhir para kurcaci dikenal sangat memahami kehidupan dan kematian. Ia membujuk anggota istananya untuk mengikuti ritual yang konon akan memberi mereka masa muda abadi. Pada akhirnya, hanya sang raja yang mendapatkannya — beserta pasukan mayat hidup.
actors.mobs.rebornking.warning=Raja mengangkat tangannya!
actors.mobs.rebornking.herald_fell=Pertahankan posisi, pengecut!
actors.mobs.rebornking$retainer.name_0=Penjaga kerajaan
actors.mobs.rebornking$retainer.desc_0=Kurcaci mati dengan zirah penyok. Ia masih menjaga rajanya.
actors.mobs.rebornking$retainer.name_1=Penyihir istana
actors.mobs.rebornking$retainer.desc_1=Penyihir istana yang dibangkitkan dari kematian. Sihir hitam berkumpul di tangannya.
actors.mobs.rebornking$retainer.name_2=Juru titah kerajaan
actors.mobs.rebornking$retainer.desc_2=Meski rahangnya patah, bentara ini masih meneriakkan perintah Raja. Para mayat patuh.
actors.mobs.rebornking$retainer.name_3=Pemanah mayat hidup
actors.mobs.rebornking$retainer.desc_3=Kurcaci ini dikubur bersama busurnya. Ia belum lupa cara memakainya.
actors.mobs.rebornyog.desc=Yog-Dzewa adalah Dewa Kuno, entitas kuat dari alam kekacauan. Seabad yang lalu, para kurcaci kuno nyaris memenangkan perang melawan pasukan iblisnya, tetapi tidak mampu membunuh dewa itu sendiri. Sebagai gantinya, mereka kemudian memenjarakannya di aula di bawah kota mereka, karena percaya bahwa dewa itu terlalu lemah untuk bangkit kembali.
actors.mobs.rebornyog.warning=Udara terbelah. Tinggalkan tanda yang berkedip!
actors.mobs.rebornyog.inherit_rot=Daging layu. Aku tetap ada.
actors.mobs.rebornyog.inherit_fire=Api itu kini milikku.
actors.mobs.rebornyog$rotting.desc=Tinju raksasa dari daging busuk. Lendir berbau menusuk merembes di sela-sela jarinya dan mengotori batu di bawahnya.
actors.mobs.rebornyog$rotting.warning=Tinju busuk menarik diri untuk menghantam!
actors.mobs.rebornyog$burninghand.desc=Tinju besar berselubung api. Jari-jarinya berderak saat mengepal, menjatuhkan bara ke lantai.
actors.mobs.rebornyog$burninghand.warning=Bara berkumpul di depan tinju membara!
actors.mobs.reborntengu.shadow_broken=Bayanganku…!
