levels.rebornsiderooms.leave=Пакінуць
actors.mobs.npcs.echoreflection.name=ваш адбітак
actors.mobs.npcs.echoreflection.desc=Ваша бледная копія чакае нерухома. Яна будзе біцца толькі пасля выкліку. Перамога дасць адно ачко навыкаў. Калі пакінуць пакой, паядынак скончыцца, а адбітак цалкам адновіць здароўе.
actors.mobs.npcs.echoreflection.challenge=Кінуць выклік адбітку? Перамога дасць адно ачко навыкаў. Можна адступіць, але калі пакінуць пакой, адбітак адновіць здароўе.
actors.mobs.npcs.echoreflection.accept=Кінуць выклік
actors.mobs.npcs.echoreflection.withdrawn=Ваш адбітак зноў замірае.
actors.mobs.npcs.echoreflection.victory=Адбітак раствараецца, пакідаючы скрутак навыкаў.
actors.mobs.npcs.barbecueking.name=пацучыны кароль
actors.mobs.npcs.barbecueking.desc=Нават каралю трэба есці. Ён знайшоў ціхі куток, каб пасмажыць сабе вячэру.
actors.mobs.npcs.barbecueking.greeting=Каралеўскія справы. Вельмі важныя. Вельмі смачныя.
actors.mobs.npcs.barbecueking.stolen=ГЭЙ! Гэта было маё!
actors.mobs.npcs.barbecueking.after=Каб табе ў горле стала.
actors.mobs.npcs.forgottenoffering.name=забытае паднашэнне
actors.mobs.npcs.forgottenoffering.desc=Пад крышталем ляжаць порцыя ежы і зелле лячэння. Выберыце адно — другое ператворыцца ў пыл.
actors.mobs.npcs.watchremains.name=загінулы вартавы
actors.mobs.npcs.watchremains.desc=Каля праламанай сцяны ляжаць косткі вартавога. З-пад шлема тырчыць шматок паперы.
actors.mobs.npcs.watchremains.note=Трымаў дзверы ўсю ноч. Яны прыйшлі праз сцяну.
