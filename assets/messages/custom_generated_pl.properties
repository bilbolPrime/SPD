custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Kiedy przeczytasz ten zwój na głos, wyda on przerażający ryk, który obudzi wszystkie potwory i powiadomi je o miejscu pobytu czytającego.
