custom.difficulty.easy=Легко
custom.difficulty.easy.desc=- Почніть з 2 додаткових пайків.\n - Почніть з 2 зілля лікування.\n - Почніть з 200 золота.\n - Почніть з 2 кристалів душі.\n - Бонус за виявлення прихованих дверей та пасток.\n - Моби слабкі, завдають на 25% менше шкоди, отримують на 10% більше шкоди та мають на 15% менше здоров'я.\n - Шанс появи чемпіонів встановлено на 10%.\n - Шанс випадіння чемпіонів встановлено на 30%.
custom.difficulty.hard=Важко
custom.difficulty.hard.desc=- Зілля зцілення лікує 75% максимального здоров'я.\n - Моби сильні, завдають на 10% більше шкоди, отримують на 10% менше шкоди та мають на 20% більше здоров'я.\n - Шанс появи чемпіонів встановлено на 30%.\n - Шанс випадіння чемпіонів встановлено на 50%.
custom.difficulty.hell.desc=- Зілля зцілення лікує 50% максимального здоров'я.\n - Моби безсмертні, завдають на 35% більше шкоди, отримують на 30% менше шкоди та мають на 45% більше здоров'я.\n - Шанс появи чемпіона встановлено на 50%.\n - Герой починає з максимальним здоров'ям на 4 менше.\n - Герой отримує на максимальне здоров'я менше при підвищенні рівня.\n - Шанс випадання чемпіона встановлено на 70%.
custom.difficulty.just_kill_me=Просто вбий мене
custom.difficulty.just_kill_me.desc=- Починає з двома зіллями досвіду.\n - Зілля зцілення лікує 10% максимального здоров'я.\n - Моби є Божествами, завдають на 60% більше шкоди, отримують на 40% менше шкоди та мають на 75% більше здоров'я.\n - Шанс появи чемпіона встановлено на 100%.\n - Герой починає з максимальним здоров'ям на 8 менше.\n - Герой отримує на 3 менше максимального здоров'я при підвищенні рівня.\n - Шанс випадання чемпіона встановлено на 100%.
custom.difficulty.nightmare.desc=- Зілля зцілення лікує 25% максимального здоров'я.\n - Моби богоподібні, завдають на 45% більше шкоди, отримують на 30% менше шкоди та мають на 60% більше здоров'я.\n - Шанс появи чемпіона встановлено на 70%.\n - Герой починає з максимальним здоров'ям на 8 менше.\n - Герой отримує на 3 менше максимального здоров'я при підвищенні рівня.\n - Шанс випадання чемпіона встановлено на 90%.
custom.difficulty.normal.desc=- Моби стандартні. \n - Шанс появи чемпіонів встановлено на 20%. \n - Шанс випадання чемпіонів встановлено на 40%.
custom.difficulty.super_easy=Суперлегко
custom.difficulty.super_easy.desc=- Почніть з 5 додаткових пайків.\n - Почніть з 5 зілля лікування.\n - Почніть з 500 золота.\n - Почніть з 3 кристалів душі.\n - Моби жалюгідні, завдають на 50% менше шкоди, отримують на 50% більше шкоди та мають на 50% менше здоров'я.\n - Шанс появи чемпіонів встановлено на 10%.\n - Шанс випадіння чемпіонів встановлено на 10%.
levels.sign.dead_end=Що ти тут робиш?!
levels.sign.tip_02=Не всі двері в підземеллі видно з першого погляду. Якщо ви застрягли, пошукайте приховані двері.
levels.sign.tip_03=Пам'ятайте, що підвищення вашої сили — не єдиний спосіб отримати доступ до кращого спорядження. Ви можете піти іншим шляхом, знизивши вимоги до його сили за допомогою Сувоїв Покращення.
levels.sign.tip_04=Ви можете витрачати своє золото в магазинах на глибших рівнях підземелля. Перший знаходиться на 6-му рівні.
levels.sign.tip_09=Раптовий напад має більше шансів на враження. Наприклад, ви можете влаштувати засідку на ворога за зачиненими дверима, коли знаєте, що він наближається.
levels.sign.tip_13=Якщо ви горите, ви не зможете загасити вогонь у воді під час левітації.
levels.sign.tip_21=Pixel-Mart. Спеціальні ціни для мисливців на демонів!
actors.blobs.waterofawareness.drink_message=Роблячи ковток, ви відчуваєте, як знання хлинуть у ваш розум. Тепер ви знаєте все про свої споряджені предмети. Також ви відчуваєте всі предмети на рівні та знаєте всі їхні секрети.
