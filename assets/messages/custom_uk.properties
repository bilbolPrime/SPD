levels.sign.tip_11=Pixel-Mart. Витрачайте гроші. Живіть довше.
levels.sign.tip_12=Коли на вас одночасно нападають кілька монстрів, спробуйте відступити за двері.
levels.sign.tip_14=Немає сенсу володіти більше ніж одним Анкхом одночасно, бо ви втратите їх після воскресіння.
levels.sign.tip_15=НЕБЕЗПЕКА! Важка техніка може призвести до травм, втрати кінцівок або смерті!
levels.sign.tip_16=Pixel-Mart. Безпечніше життя у підземеллі.
levels.sign.tip_17=Коли ви покращуєте зачаровану зброю, є шанс знищити ці чари.
levels.sign.tip_18=Зброя та обладунки псуються швидше, ніж чарівні палички та кільця, але є більше способів їх полагодити.
levels.sign.tip_19=Єдиний спосіб отримати Сувій Знищення – це отримати його в подарунок від духів підземелля.
levels.sign.tip_20=Зброя заборонена в присутності Його Величності!
