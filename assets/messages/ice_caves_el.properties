items.scrolls.scrolloffrostlevel.name=Πάπυρος πάχνης
items.scrolls.scrolloffrostlevel.desc=Κρύο αναδύεται από αυτή την περγαμηνή.\n\nΜπορείς επίσης να τον σκίσεις οπουδήποτε για να παγώσεις όλους τους εχθρούς του ορόφου μέχρι να δεχτούν ζημιά. Τα αφεντικά και τα πλάσματα με ανοσία στον παγετό δεν επηρεάζονται. Δεν προκαλεί ζημιά.
items.scrolls.scrolloffrostlevel.ac_tear=Σκίσιμο
items.scrolls.scrolloffrostlevel.tear_confirm=Αν σκίσεις αυτόν τον πάπυρο, θα ελευθερωθεί η μαγεία του. Όλοι οι εχθροί του ορόφου θα παγώσουν μέχρι να δεχτούν ζημιά. Τα αφεντικά και τα πλάσματα με ανοσία στον παγετό δεν επηρεάζονται. Δεν προκαλεί ζημιά.\n\nΝα σκίσεις τον πάπυρο;
items.scrolls.scrolloffrostlevel.wrong_place=Ο πάπυρος δεν λειτουργεί εδώ.
items.scrolls.scrolloffrostlevel.spent=Το πέρασμα έχει ήδη ανοίξει. Ο πάπυρος δεν αντιδρά.
items.keys.key.ice_depth=Αυτό το κλειδί ανήκει στον όροφο %d των Παγωμένων Σπηλιών.
scenes.interlevelscene$mode.frost=Είσοδος στις Παγωμένες Σπηλιές...
levels.icecaveslevel.water_name=Παγωμένο νερό
levels.icecaveslevel.water_desc=Μια λεπτή κρούστα πάγου σπάει κάτω από τα πόδια.
levels.icecaveslevel.wall_desc=Τα σημάδια από τις αξίνες χάνονται κάτω από παχιές φλέβες πάγου. Οι μεταλλωρύχοι εγκατέλειψαν τις στοές όταν το κρύο απλώθηκε στον βράχο.
levels.cavesbosslevel.collapsed_name=Γκρεμισμένη σπηλιά
levels.cavesbosslevel.collapsed_desc=Μια γκρεμισμένη σπηλιά. Οι πεσμένοι βράχοι δεν αφήνουν πέρασμα.
actors.buffs.frostbite.name=Κρυοπάγημα
actors.buffs.frostbite.desc=Το κρύο επιβραδύνει την κίνησή σου κατά 20%.
actors.mobs.rimebat.name=Νυχτερίδα της πάχνης
actors.mobs.rimebat.desc=Αυτές οι χλωμές νυχτερίδες φωλιάζουν κάτω από τον πάγο. Το κρύο δάγκωμά τους επιβραδύνει για λίγο την κίνηση, δίνοντάς τους χρόνο να επιστρέψουν για νέα επίθεση.\n\nΈχει ανοσία στο πάγωμα και στη μαγεία του πάγου.
actors.mobs.iceclaw.name=Παγονύχι
actors.mobs.iceclaw.desc=Ένα πτωματοφάγο με κέλυφος από συμπαγή πάγο. Πριν πολεμήσει, ενισχύει για λίγο τη θωράκισή του. Η φωτιά λιώνει αυτή την επιπλέον προστασία.\n\nΈχει ανοσία στο πάγωμα και στη μαγεία του πάγου.
actors.mobs.frostback.name=Γκνολ παγόραχο
actors.mobs.frostback.desc=Αυτό το γκνολ επιβίωσε στο κρύο ληστεύοντας απρόσεκτους επισκέπτες. Όταν σηκώνει το όπλο του, κάνε στην άκρη: το βαρύ χτύπημα θα πέσει εκεί που στεκόσουν.\n\nΈχει ανοσία στο πάγωμα και στη μαγεία του πάγου.
actors.mobs.shardling.name=Ζωντανό θραύσμα
actors.mobs.shardling.desc=Μια ανήσυχη μάζα παγοκρυστάλλων. Σημαδεύει και μετά εκτοξεύει θραύσματα σε ευθεία γραμμή. Οι τοίχοι σταματούν την ομοβροντία.\n\nΈχει ανοσία στο πάγωμα και στη μαγεία του πάγου.
actors.mobs.hollowminer.name=Κούφιος μεταλλωρύχος
actors.mobs.hollowminer.desc=Αυτός ο μεταλλωρύχος δεν ξέφυγε ποτέ από τις παγωμένες στοές. Το φανάρι του καίει ακόμη, αν και ο ίδιος έχει πεθάνει από καιρό. Αν το σηκώσει, καλεί τα κοντινά πλάσματα στη μάχη. Ένα χτύπημα διακόπτει το σήμα.\n\nΈχει ανοσία στο πάγωμα και στη μαγεία του πάγου.
actors.mobs.rimehorn.name=Παγοκέρατο
actors.mobs.rimehorn.desc=Ένα βαρύ θηρίο με πάχνη στο τρίχωμά του. Ξύνει το έδαφος πριν ορμήσει σε ευθεία γραμμή. Βγες από την πορεία του όσο ετοιμάζεται.\n\nΈχει ανοσία στο πάγωμα και στη μαγεία του πάγου.
actors.mobs.oldrime.name=Γέρος Πάγος
actors.mobs.oldrime.desc=Οι μεταλλωρύχοι βρήκαν τον Γέρο Πάγο κάτω από το βουνό, θαμμένο σε πάγο αρχαιότερο από τις σήραγγές τους. Οι αξίνες τους τον ξύπνησαν. Τώρα φυλάει τις παγωμένες στοές και το πέρασμα πίσω τους. Καθώς αδυνατίζει, η θωράκισή του σπάει και ελευθερώνει τα άκρα του. Πρόσεχε τα βαριά χτυπήματα, τον πάγο που διαπερνά το δάπεδο και την παγωμένη ανάσα του.\n\nΈχει ανοσία στο πάγωμα και στη μαγεία του πάγου.
actors.mobs.oldrime.warning=Ο Γέρος Πάγος ετοιμάζεται να χτυπήσει!
windows.wndjournal.ice_depth=Πάγος %d
levels.icebosslevel.exit_name=Πέρασμα σπηλιάς
levels.icebosslevel.exit_desc=Ένα στενό πέρασμα οδηγεί βαθύτερα στο βουνό.
levels.icebosslevel.blocked_name=Παγωμένο πέρασμα
levels.icebosslevel.blocked_desc=Ένας τοίχος πάγου φράζει το πέρασμα πίσω από τον Γέρο Πάγο.
items.weapon.ice.wrong_hero=Αυτό το όπλο δεν είναι για σένα.
items.weapon.ice.already_enchanted=Αυτό το όπλο είναι ήδη μαγεμένο.
items.weapon.ice.glaciercleaver.name=Μπαλτάς του παγετώνα
items.weapon.ice.glaciercleaver.desc=Μια φαρδιά λεπίδα λαξευμένη από τον πάγο του Γέρου Πάγου. Ένα χτύπημα καλύπτει τον στόχο με πάχνη για τέσσερις γύρους. Το επόμενο χτύπημα με Μπαλτά του παγετώνα τη συντρίβει, προκαλώντας %d επιπλέον ζημιά. Μόνο ένας Πολεμιστής μπορεί να τον χρησιμοποιήσει.
actors.buffs.frostcoating.name=Καλυμμένο με πάχνη
actors.buffs.frostcoating.desc=Ένα λεπτό στρώμα πάχνης καλύπτει αυτό το πλάσμα. Ένα χτύπημα από Μπαλτά του παγετώνα θα το συντρίψει.
items.weapon.ice.hoarfroststaff.name=Ράβδος λευκής πάχνης
items.weapon.ice.hoarfroststaff.desc=Κρύο συγκεντρώνεται ανάμεσα στις αιχμές της ράβδου. Τα βλήματά της προκαλούν %d-%d ζημιά πριν από τα μπόνους δεξιοτήτων και επιβραδύνουν κίνηση και επιθέσεις για δύο γύρους. Αρχικά έχει τρία φορτία και επαναφορτίζεται όπως ένα ραβδί. Μόνο ένας Μάγος μπορεί να τη χρησιμοποιήσει.
items.weapon.ice.rimepick.name=Αξίνα πάχνης
items.weapon.ice.rimepick.desc=Αυτή η στενή αξίνα πάγου βρίσκει τα κενά στη θωράκιση. Παρακάμπτει το ένα τέταρτο της θωράκισης του στόχου, ή τη μισή αν τον αιφνιδιάσει. Μόνο ένας Κλέφτης μπορεί να τη χρησιμοποιήσει.
items.weapon.ice.frostbow.name=Τόξο παγετού
items.weapon.ice.frostbow.desc=Τα βέλη αυτού του τόξου σπάνε σε κοφτερό πάγο κατά την πρόσκρουση. Προκαλούν %d%% περισσότερη ζημιά στον στόχο και το ένα τέταρτο της ζημιάς του χτυπήματος στους διπλανούς εχθρούς. Τα θραύσματα δεν παγώνουν τα θύματά τους. Μόνο μια Κυνηγός μπορεί να το χρησιμοποιήσει.
items.weapon.ice.gravefrostscythe.name=Δρεπάνι νεκρικής πάχνης
items.weapon.ice.gravefrostscythe.desc=Πάχνη καλύπτει τη λαβή του δρεπανιού, που είναι δεμένη με κόκαλα. Όταν το κρατάς, οι σκελετοί και τα φαντάσματα που καλείς προκαλούν %d επιπλέον ζημιά ψύχους ανά χτύπημα. Μόνο ένας Νεκρομάντης μπορεί να το χρησιμοποιήσει.
items.weapon.ice.frostbiterifle.name=Τυφέκιο κρυοπαγήματος
items.weapon.ice.frostbiterifle.desc=Η θαλάμη αυτού του τυφεκίου είναι καλυμμένη με πάγο που δεν λιώνει ποτέ. Κάθε εύστοχη βολή προκαλεί κρυοπάγημα για δύο γύρους, επιβραδύνοντας την κίνηση κατά 20%. Νέα χτυπήματα ανανεώνουν την επίδραση. Μόνο ένας Μισθοφόρος μπορεί να το χρησιμοποιήσει.
library.ice_weapon_drop=Πέφτει ένα όπλο για κάθε ήρωα, ανάλογα με την κλάση του.

actors.mobs.npcs.prospector.name=Παγιδευμένος μεταλλωρύχος
actors.mobs.npcs.prospector.desc=Ένας μεταλλωρύχος με μπαλωμένο παλτό έχει βρει καταφύγιο δίπλα στις σκάλες. Η λάμπα του κοντεύει να σβήσει.
actors.mobs.npcs.prospector.torches=Η λάμπα μου δεν θα κρατήσει πολύ. Άφησα ένα σεντούκι με εφόδια σε αυτόν τον όροφο όταν έφυγα τρέχοντας. Θα μου φέρεις _τρεις δαυλούς_ από εκεί;
actors.mobs.npcs.prospector.iceclaws=Τα παγονύχια με έδιωξαν από τη στοά μου. Σκότωσε _τρία σε αυτόν τον όροφο_ για να γυρίσω στη δουλειά.
actors.mobs.npcs.prospector.accept=Θα βοηθήσω.
actors.mobs.npcs.prospector.later=Όχι τώρα.
actors.mobs.npcs.prospector.need_torches=Χρειάζομαι _τρεις δαυλούς_. Το σεντούκι είναι ακόμα κάπου σε αυτόν τον όροφο.
actors.mobs.npcs.prospector.claws_left=Παγονύχια που απομένουν: _%d_.
actors.mobs.npcs.prospector.reward=Καλή δουλειά. Τι προτιμάς;
actors.mobs.npcs.prospector.rations=Δύο μερίδες τροφίμων
actors.mobs.npcs.prospector.thanks=Μία έγνοια λιγότερη. Ευχαριστώ.
library.quest.prospector_torches.name=Μια λάμπα που σβήνει
library.quest.prospector_torches.desc=Φέρε τρεις δαυλούς στον παγιδευμένο μεταλλωρύχο. Ένα σεντούκι στον όροφό του έχει αρκετούς.
library.quest.prospector_iceclaws.name=Παγονύχια στη στοά
library.quest.prospector_iceclaws.desc=Σκότωσε τρία παγονύχια στον όροφο του μεταλλωρύχου και γύρνα σε αυτόν.
library.quest.prospector.reward=Διάλεξε έναν πάπυρο αναβάθμισης ή δύο μερίδες τροφίμων.
items.scrolls.scrolloffrostlevel.read_confirm=Καθώς διαβάζεις, νιώθεις ότι πρόκειται να τηλεμεταφερθείς.
