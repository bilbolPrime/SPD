scenes.welcomescene.controller_body=Oyun kumandasıyla mı oynuyorsunuz? Ekrandaki imleci kontrol etmek için sağ analog çubuğu kullanın. RT/R2 tuşuna veya sağ analog çubuğa basarak imleçle seçim yapın.
