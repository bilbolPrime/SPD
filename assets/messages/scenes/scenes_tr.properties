scenes.welcomescene.patch_intro=Pixel Dungeon'a yama yayınlandı!
scenes.welcomescene.patch_msg=Bu yama ayrıca bazı küçük ayarlamalar ve performans iyileştirmeleri de içeriyor.
scenes.welcomescene.patch_translations=Bu yama, çeviri güncellemelerini içermektedir.
scenes.welcomescene.save_warning=Pixel Dungeon, oyun verilerinizi kaydetmeye çalışırken yakın zamanda kesintiye uğradı. Pixel Dungeon'ın buna karşı yerleşik korumaları vardır, bu nedenle oyun verileriniz güvende olmalıdır. Bu genellikle cihazınızın aniden güç kaybettiğinde veya Pixel Dungeon'ı düzgün bir şekilde kapanmasına izin vermeden sonlandırdığında olur. Pil tasarrufu özellikleri genellikle mobil cihazlarda buna neden olabilir. Bu hatayı sık sık görüyorsanız, cihazınızı yeniden başlatmak da yardımcı olabilir.
scenes.welcomescene.update_intro=Pixel Dungeon güncellendi!
scenes.welcomescene.update_msg=v3.3, şehir görevine yapılacak olan yeni revizyon için bir test alanı, yeni eşyalar ve bir dizi küçük düzenleme ve iyileştirme içeriyor.
scenes.welcomescene.what_msg=Görünüşe göre mevcut kayıtlarınız Pixel Dungeon'ın gelecekteki bir sürümünden! Dikkatli olun! Kayıtlarınız bu sürümde bulunmayan şeyler içerebilir, bu da çok garip hatalara neden olabilir.

