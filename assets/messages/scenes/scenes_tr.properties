scenes.welcomescene.controller_title=Kontrol Cihazı Girişi
scenes.welcomescene.lang_warning_msg=Bu güncellemedeki yeni içeriklerin bazıları henüz çevrilmedi. Bazı ifadeler İngilizce yazılmış olabilir. Çeviri ekipleri bu sorunu çözmek için çalışıyor ve tam çeviri yakında eklenecektir. Sabrınız için teşekkür ederiz.
scenes.welcomescene.lang_warning_title=Eksik Çeviri
scenes.welcomescene.patch_balance=Bu yama, oyun dengesine yönelik bazı düzenlemeler içeriyor.
