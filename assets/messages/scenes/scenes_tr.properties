scenes.heroselectscene.daily=Günlük Koşu
scenes.heroselectscene.daily_desc=Her gün herkes için aynı olan yeni bir oyun mevcut! Bu 'günlük koşu', oynayan herkes için aynı zindanı oluşturur (aynı oyun sürümünü oynadıkları sürece). Günlük koşuyu tamamlamak için istediğiniz kadar zaman ayırabilirsiniz, ancak aynı anda yalnızca bir tane aktif olabilir. Günlük koşular rozetler için geçerli değildir ve kendi ayrı sıralama sayfalarına sahiptir. Bugünkü günlük koşuya şu anda seçtiğiniz kahraman ve görevlerle başlamak ister misiniz?
scenes.heroselectscene.daily_existing=Hali hazırda devam eden bir günlük koşunuz var. Başka bir günlük koşuya başlamadan önce bu koşuyu sonlandırmanız gerekiyor.
scenes.heroselectscene.daily_no=HAYIR
scenes.heroselectscene.daily_nowin=Her gün herkes için aynı olan yeni bir oyun mevcut! Bu 'günlük koşu', oynayan herkes için aynı zindanı oluşturur (aynı oyun sürümünü oynadıkları sürece). Günlük koşulara katılabilmek için en az bir oyun kazanmanız gerekir.
scenes.heroselectscene.daily_repeat=Bugünkü günlük görevi zaten oynadınız. Dilerseniz tekrar oynayabilirsiniz, ancak yalnızca sıralamasız bir antrenman olarak. Tekrarı tamamladıktan sonra, kayıt silinmeden önce kısa bir süre için günlük sıralamalar penceresinden görüntüleyebileceksiniz. Şu anda seçili kahramanınız ve görevlerinizle bugünkü günlük görevi tekrar oynamak ister misiniz?
scenes.heroselectscene.daily_unavailable_long=Görünüşe göre gelecekte bir günlük rapor başlatmışsınız! Bu durum, yakın zamanda saat diliminizi değiştirdiyseniz veya sistem saatinizi değiştirdiyseniz olabilir. _Bir sonraki günlük raporunuz %d gün sonra kullanılabilir olacaktır._
