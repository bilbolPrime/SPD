scenes.heroselectscene.custom_seed_desc=Oyun, zindan oluşturmak için bir tohum kodu kullanır; aynı tohum ve oyun sürümü her zaman aynı zindanı oluşturur! _Özel tohum kodlu oyunlar rozet kazanamaz veya oynanan oyunlara katkıda bulunamaz ve sıralama sayfasının en altında görünür._
