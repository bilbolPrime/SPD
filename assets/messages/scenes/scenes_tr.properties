scenes.heroselectscene.challenges_nowin=Zorluklar, oyunu daha zor hale getiren isteğe bağlı değiştiricilerdir. Bazı zorluklar zindanı daha tehlikeli hale getirirken, diğerleri yeteneklerinizin veya eşyalarınızın gücünü azaltır. Zorlukları etkinleştirebilmek için en az bir oyun kazanmanız gerekir.
