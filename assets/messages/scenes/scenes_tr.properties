scenes.firstpersonbutton.mouse_help=Etrafa bakmak için fareyi hareket ettir. Düğmelerde imleci kullanmak için Alt tuşunu basılı tut. Yeniden etrafa bakmak için Alt tuşunu bırak. Menülerde imleç otomatik olarak serbest kalır. Pencereden çıktıktan sonra bakmaya devam etmek için pencerenin içine tıkla; bu tıklama bir eylem gerçekleştirmez. Esc hedef seçimini iptal eder.
scenes.firstpersonbutton.controller_help=Sol çubuk: hareket. Sağ çubuk: etrafa bakma. İmleci kullanmak için %1$s tuşunu basılı tut; bakmaya dönmek için bırak. Seçmek için %2$s tuşunu kullan. Menülerde imleç otomatik olarak devreye girer. Geçiş yaparken sağ çubuğu bırakıp ortaya dönmesini bekle.
