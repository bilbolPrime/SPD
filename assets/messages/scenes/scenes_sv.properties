scenes.titlescene$changesbutton.desc=Pixel Dungeon uppdateras regelbundet med uppdateringar av befintligt spelinnehåll eller helt nytt innehåll!\n\nSpelbalansen förbättras också ofta i speluppdateringar, så att specifika föremål/hjältar/fiender inte är för starka eller för svaga.\n\nUppdateringarna inkluderar även buggfixar och andra olika stabilitetsförbättringar.
