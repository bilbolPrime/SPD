scenes.welcomescene.save_warning=Pixel Dungeon avbröts nyligen när du försökte spara dina speldata. Pixel Dungeon har inbyggt skydd mot detta, så dina speldata borde vara okej.\n\nDetta händer vanligtvis när enheten plötsligt förlorar ström, eller om den avslutar Pixel Dungeon utan att låta den stängas ordentligt. Batterisparfunktioner kan ofta orsaka detta på mobila enheter. Att starta om enheten kan också hjälpa om du ser det här felet ofta.
scenes.welcomescene.update_intro=Pixel Dungeon har uppdaterats!
scenes.welcomescene.update_msg=v3.3 innehåller ett testområde för den kommande översynen av stadsuppdraget, nya föremål och en massa mindre justeringar och förbättringar.
scenes.welcomescene.what_msg=Det verkar som att dina nuvarande sparade filer är från en framtida version av Pixel Dungeon!\n\nVar försiktig! Dina sparade filer kan innehålla saker som inte finns i den här versionen, vilket kan orsaka en del konstiga fel.

