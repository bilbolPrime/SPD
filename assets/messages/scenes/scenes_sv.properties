scenes.heroselectscene.daily=Daglig körning
scenes.heroselectscene.daily_desc=Varje dag finns ett nytt spel tillgängligt som är likadant för alla! Denna "dagliga körning" genererar samma grotte för varje person som spelar den (så länge de också spelar samma spelversion).\n\nDu kan ta så lång tid du vill på dig att slutföra en daglig körning, men du kan bara ha en aktiv åt gången. _Dagliga körningar är inte berättigade till märken och har sin egen separata rankningssida._\n\nVill du starta dagens dagliga spel med din för närvarande valda hjälte och utmaningar?
scenes.heroselectscene.daily_existing=Du har redan en daglig körning på gång. Du måste avsluta den körningen innan du startar en annan daglig körning.
scenes.heroselectscene.daily_no=inga
scenes.heroselectscene.daily_nowin=Varje dag finns ett nytt spel tillgängligt som är likadant för alla! Denna "dagliga körning" genererar samma grottan för varje person som spelar den (så länge de också spelar samma spelversion). \n\n_Du måste vinna minst ett spel innan du kan spela dagliga körningar._
scenes.heroselectscene.daily_repeat=Du har redan spelat dagens dagliga spel. Du kan spela om det om du vill, men bara som en orankad övning.\n\nNär du har slutfört omspelningen kommer du att kunna se det från fönstret för dagliga rankningar en kort stund innan posten raderas.\n\nVill du spela om dagens dagliga spel med din för närvarande valda hjälte och utmaningar?
scenes.heroselectscene.daily_unavailable_long=Det verkar som att du har startat ett dagligt inlägg som ligger i framtiden! Detta kan hända om du nyligen har ändrat tidszon eller om du har ändrat systemklockan. _Din nästa dagliga inlägg kommer att vara tillgängligt om %d dagar._
