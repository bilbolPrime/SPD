scenes.heroselectscene.challenges_nowin=Utmaningar är valfria modifierare som gör spelet svårare. Vissa utmaningar gör grottan farligare, andra minskar kraften i dina förmågor eller föremål. \n\n_Du måste vinna minst ett spel innan du kan aktivera utmaningar._
