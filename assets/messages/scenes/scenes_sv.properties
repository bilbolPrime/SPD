tutorial.menu=Träning
tutorial.preview=Träna som _Krigare_ med en erfaren instruktör. Lär dig att förflytta dig, slåss, använda utrustning och färdigheter och läka innan du går ner i fängelsehålan.
tutorial.start=Börja träna
tutorial.instructor.name=Instruktör
tutorial.instructor.desc=En gammal officer som tränar nya äventyrare.
tutorial.try=Förstått
tutorial.continue=Fortsätt
tutorial.retry=Gör om rummet
tutorial.leave=Lämna träningen
tutorial.leave_text=Lämna träningen? Du kan börja om från huvudmenyn.
tutorial.stay=Stanna
tutorial.return=Huvudmenyn
tutorial.complete_title=Redo för fängelsehålan
tutorial.complete=Det får räcka. Ta god tid på dig, undersök det du inte känner igen och håll en flyktväg öppen. Fängelsehålan kommer inte att skona dig.
tutorial.warning=Lämna den markerade rutan!
tutorial.lesson_0.title=Ett steg i taget
tutorial.lesson_0.text=Tryck på en golvruta för att gå dit. Att röra sig, anfalla och använda föremål tar tid; att läsa menyer gör det inte. Vänta låter en tur passera. Prata med mig om du vill ha en påminnelse eller försöka igen i ett rum.
tutorial.lesson_0.goal=Gå tre steg och vänta en tur.
tutorial.lesson_1.title=Lär känna fienden
tutorial.lesson_1.text=Undersök båda råttorna innan du går närmare. Förkämpar har extra förmågor: tryck på deras ikoner för att läsa om dem. De små ikonerna ovanför en varelse visar aktiva effekter. Att undersöka kostar ingen tur.
tutorial.lesson_1.goal=Undersök den vanliga råttan och förkämpen.
tutorial.lesson_2.title=Välj dina strider
tutorial.lesson_2.text=Låt råttan komma till dig. I en dörröppning kan fiender inte omringa dig. Använd den smala passagen när de andra kommer och ta dem en i taget.
tutorial.lesson_2.goal=Besegra de tre råttorna.
tutorial.lesson_3.title=Utrustning du orkar bära
tutorial.lesson_3.text=Kontrollera styrkekravet innan du tar på dig något. För tung utrustning kan sakta ner dig. Ta på läderrustningen och identifiera ringen med skriftrullen. Se upp med okända föremål: ett förbannat föremål går inte att ta av förrän förbannelsen har brutits.
tutorial.lesson_3.goal=Ta på läderrustningen och identifiera ringen.
tutorial.lesson_4.title=Din första färdighet
tutorial.lesson_4.text=Öppna färdighetsträdet och lär dig %s. Lägg den i en snabbplats, aktivera den och träffa råttan. Den här färdigheten kostar mana och måste laddas om efter användning. Om du måste välja ett mål avbryter Tillbaka siktandet utan att använda färdigheten.
tutorial.lesson_4.goal=Lär dig %s, lägg den i en snabbplats och träffa med den.
tutorial.lesson_5.title=Återhämta dig före striden
tutorial.lesson_5.text=Drick läkedrycken. Den återställer hälsa under 10 turer: den ljusare delen av mätaren är läkning som ännu inte har kommit. Du kan dö innan dess. Ät ransonen och vänta på läkningen. Vila bara där det är säkert. Svält gör att du förlorar hälsa.
tutorial.lesson_5.goal=Drick drycken, ät och vänta tills läkningen är klar.
tutorial.lesson_6.title=Se var du sätter fötterna
tutorial.lesson_6.text=Undersök växten och fällan innan du trampar på dem. Prova eldfällan och gå sedan ner i vattnet för att släcka lågorna. Håll därefter ögonen på markeringen på golvet och flytta dig innan anfallet träffar.
tutorial.lesson_6.goal=Undersök båda farorna, släck elden och undvik det markerade anfallet.
tutorial.lesson_7.title=Vägen ut
tutorial.lesson_7.text=Besegra fienderna och ställ dig på den markerade rutan vid väggen. Håll inne undersökningsknappen för att leta efter en hemlig dörr. Gå igenom den, hitta nyckeln och lås upp utgången.
tutorial.lesson_7.goal=Besegra båda fienderna, sök efter den hemliga dörren och nå trappan.
