scenes.amuletscene.text=Äntligen håller du den i dina händer, Yendors amulett! Med kraften i denna amulett kommer ingenting att kunna stå i din väg! Du har erövrat fängelsehålan och lyckats i ditt uppdrag! \n\nEller kanske du inte är redo än? Du kan också bestämma dig för att bara hålla fast vid amuletten, förbli en vanlig dödlig lite längre och kanske lämna fängelsehålan på det gammaldags sättet...
