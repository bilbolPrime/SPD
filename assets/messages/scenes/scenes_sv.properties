scenes.heroselectscene.custom_seed_desc=Spelet använder en frökod för att generera grottor, samma frö och spelversion genererar alltid samma grottor! _Anpassade fröspel kan inte tjäna märken eller bidra till spelade spel, och visas längst ner på rankningssidan._
