scenes.welcomescene.lang_warning_msg=En del av det nya innehållet från den här uppdateringen har ännu inte översatts. \n\nVissa fraser kan vara skrivna på engelska. \n\nÖversättningsteamen arbetar med att lösa detta och en fullständig översättning bör vara uppdaterad snart. \n\nTack för ditt tålamod.
