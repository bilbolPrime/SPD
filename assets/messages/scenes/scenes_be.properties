scenes.firstpersonview.unavailable=Гэты від недаступны. Уключаны звычайны від.
scenes.firstpersonbutton.title=Віды камеры
scenes.firstpersonbutton.cycle=Націскайце для пераключэння паміж выглядам ад першай асобы, ад трэцяй асобы і звычайным выглядам. Значок паказвае наступны від.
scenes.firstpersonbutton.mouse_help=Рухайце мышшу, каб аглядацца. Утрымлівайце Alt для працы з курсорам на кнопках. Адпусціце Alt, каб зноў аглядацца. У меню курсор вызваляецца аўтаматычна. Пасля выхаду з акна пстрыкніце ўнутры, каб вярнуцца да агляду; гэтая пстрычка не выконвае дзеяння. Esc скасоўвае выбар цэлі.
scenes.firstpersonbutton.controller_help=Левы стык: рух. Правы стык: агляд. Утрымлівайце %1$s для кіравання курсорам; адпусціце для агляду. Выбар: %2$s. У меню курсор уключаецца аўтаматычна. Пры пераключэнні адпускайце правы стык.
scenes.firstpersonbutton.visibility=Абодва віды паказваюць толькі тое, што бачыць герой.
