scenes.amuletscene.text=Нарэшце вы трымаеце яго ў руках, Амулет Ендора! З сілай гэтага амулета нішто не зможа стаць на вашым шляху! Вы заваявалі падзямелле і дасягнулі поспеху ў сваім квэсце!\n\nА можа, вы яшчэ не гатовыя? Вы таксама можаце вырашыць проста захаваць амулет, застацца простым смяротным яшчэ крыху і, магчыма, пакінуць падзямелле па-старому...
