scenes.gamescene.tutorial_guidebook_desktop=Націсніце кнопку мігцення дзённіка (%s) у правым верхнім куце, каб прачытаць кнігу, якую вы толькі што ўзялі.
scenes.gamescene.tutorial_guidebook_mobile=Націсніце на мігаючую кнопку дзённіка ў правым верхнім куце, каб прачытаць кнігу, якую вы толькі што ўзялі.
scenes.gamescene.tutorial_move_controller=Выберыце месцазнаходжанне або выкарыстоўвайце левы джойсцік для перамяшчэння або ўзаемадзеяння.
scenes.gamescene.tutorial_move_desktop=Выкарыстоўвайце мыш, WASD або клавішы са стрэлкамі для перамяшчэння і ўзаемадзеяння.
scenes.gamescene.tutorial_move_mobile=Націсніце на месцазнаходжанне, каб перамясціцца і ўзаемадзейнічаць.
scenes.gamescene.tutorial_ui_desktop=Інфармацыя пра героя (%1$s) ніжэй. Інвентар (%2$s), хуткія слоты і дзеянні гульні — справа. Жадаем поспеху!
scenes.gamescene.tutorial_ui_mobile=Інфармацыя пра герояў знаходзіцца ў левым верхнім куце. Інвентар, хуткія слоты і гульнявыя дзеянні — ніжэй. Жадаем поспеху!
scenes.gamescene.warp=Сцены дэфармуюцца і зрушваюцца вакол цябе!
scenes.heroselectscene.challenges_nowin=Выпрабаванні — гэта дадатковыя мадыфікатары, якія ўскладняюць гульню. Некаторыя выпрабаванні робяць падзямелле больш небяспечным, іншыя зніжаюць сілу вашых здольнасцей або прадметаў.\n\n_Вы павінны выйграць хаця б адну гульню, перш чым зможаце ўключыць выпрабаванні._
scenes.heroselectscene.custom_seed=Карыстальніцкае насенне
scenes.heroselectscene.custom_seed_clear=Ачысціць
scenes.heroselectscene.custom_seed_desc=У гульні выкарыстоўваецца пачатковы код для генерацыі падзямелляў, аднолькавы пачатковы код і версія гульні заўсёды генеруюць аднолькавае падзямелле! _Гульні з карыстальніцкім пачатковым кодам не могуць зарабляць значкі або ўносіць свой уклад у згуляныя гульні і адлюстроўваюцца ўнізе старонкі рэйтынгу._
scenes.heroselectscene.custom_seed_duplicate=У вас ужо ёсць звычайная гульня з гэтым пачаткам. Вы павінны скончыць гэту гульню, перш чым выкарыстоўваць гэта карыстальніцкае пачатковае значэнне.
scenes.heroselectscene.custom_seed_nowin=У гульні выкарыстоўваецца пачатковы код для генерацыі падзямелля, аднолькавы пачатковы код і версія гульні заўсёды генеруюць аднолькавае падзямелле! \n\n_Вы павінны выйграць хаця б адну гульню, перш чым зможаце ўвесці ўласныя пачатковыя коды._
scenes.heroselectscene.custom_seed_set=НАЛАД
scenes.heroselectscene.custom_seed_title=Увядзіце карыстальніцкае пачатковае значэнне
scenes.heroselectscene.daily=Штодзённы забег
scenes.heroselectscene.daily_desc=Кожны дзень даступная новая гульня, аднолькавая для ўсіх! Гэта «штодзённае праходжанне» генеруе аднолькавае падзямелле для кожнага гульца (пры ўмове, што яны гуляюць у адну і тую ж версію гульні).\n\nВы можаце праходзіць штодзённае праходжанне колькі заўгодна часу, але адначасова можа быць актыўным толькі адно праходжанне. _Штодзённыя праходы не даюць права на атрыманне значкоў і маюць асобную старонку рэйтынгу._\n\nЦі хочаце вы пачаць сённяшні штодзённы праход з выбраным вамі героем і выпрабаваннямі?
scenes.heroselectscene.daily_existing=У вас ужо ёсць штодзённы забег. Вы павінны скончыць яго, перш чым пачынаць наступны штодзённы забег.
scenes.heroselectscene.daily_no=не
scenes.heroselectscene.daily_nowin=Кожны дзень даступная новая гульня, аднолькавая для ўсіх! Гэты «штодзённы забег» генеруе аднолькавае падзямелле для кожнага, хто ў яго гуляе (пры ўмове, што яны таксама гуляюць у адну версію гульні).\n\n_Вы павінны выйграць хаця б адну гульню, перш чым зможаце гуляць у штодзённых забегах._
scenes.heroselectscene.daily_repeat=Вы ўжо згулялі сённяшні штодзённы турнір. Вы можаце перагуляць яго, калі хочаце, але толькі як нерэйтынгавы праход.\n\nПасля завяршэння паўтору вы зможаце праглядзець яго ў акне штодзённага рэйтынгу на працягу кароткага часу, перш чым рэкорд будзе выдалены.\n\nХочаце перагуляць сённяшні штодзённы турнір з выбраным вамі героем і выпрабаваннямі?
scenes.heroselectscene.daily_unavailable_long=Здаецца, вы пачалі штодзённы расклад, які знаходзіцца ў будучыні! Гэта можа здарыцца, калі вы нядаўна змянілі часавыя паясы або сістэмны гадзіннік. _Ваш наступны штодзённы расклад будзе даступны праз %d дзён._
