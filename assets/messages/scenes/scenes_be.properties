scenes.titlescene.credits=Skillful Pixel Dungeon - Reborn\n\nКод і графіка: Bilboldev\nМузыка галоўнага меню: Bilboldev\nАльбом: Skillful Pixel Dungeon - Reborn\n\nНа аснове Pixel Dungeon\nКод і графіка: Watabou\nМузыка арыгінала: Cube_Code\n\nЗыходны код даступны на GitHub пад ліцэнзіяй GNU GPL v3 або пазнейшай версіі.
