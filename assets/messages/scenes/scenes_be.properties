scenes.titlescene$changesbutton.desc=Pixel Dungeon рэгулярна абнаўляецца, дадаючы перапрацоўкі існуючага гульнявога кантэнту або цалкам новы кантэнт! \n\nГульнявы баланс таксама часта паляпшаецца ў абнаўленнях гульні, каб пэўныя прадметы/героі/ворагі не былі занадта моцнымі або занадта слабымі. \n\nАбнаўленні таксама ўключаюць выпраўленні памылак і іншыя розныя паляпшэнні стабільнасці.
