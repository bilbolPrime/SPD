scenes.welcomescene.controller_body=Гуляеце на кантролеры? Выкарыстоўвайце правы джойсцік для кіравання курсорам на экране. \n\n Націсніце RT/R2 або правы джойсцік для выбару курсорам.
scenes.welcomescene.controller_okay=Добра
scenes.welcomescene.controller_title=Уваход кантролера
scenes.welcomescene.lang_warning_msg=Некаторы новы кантэнт з гэтага абнаўлення яшчэ не перакладзены.\n\nНекаторыя фразы могуць быць напісаны на англійскай мове.\n\nКаманды перакладаў працуюць над вырашэннем гэтай праблемы, і поўны пераклад павінен быць выпраўлены ў бліжэйшы час.\n\nДзякуй за цярпенне.
scenes.welcomescene.lang_warning_title=Няпоўны пераклад
scenes.welcomescene.patch_balance=Гэты патч утрымлівае змены ў балансе гульні.
scenes.welcomescene.patch_bugfixes=Гэты патч змяшчае выпраўленні памылак.
scenes.welcomescene.patch_intro=Піксельнае падзямелле выпраўлена!
scenes.welcomescene.patch_msg=Гэты патч таксама змяшчае некаторыя невялікія змены і паляпшэнні прадукцыйнасці.
scenes.welcomescene.patch_translations=Гэты патч змяшчае абнаўленні перакладу.
scenes.welcomescene.save_warning=Нядаўна падчас спробы захаваць даныя вашай гульні Pixel Dungeon была перапынена. У Pixel Dungeon ёсць убудаваная абарона ад гэтага, таму з вашымі данымі гульні павінна быць усё ў парадку.\n\nЗвычайна гэта адбываецца, калі прылада раптоўна адключаецца ад сілкавання або калі яна завяршае Pixel Dungeon, не даўшы ёй належным чынам закрыцца. Функцыі эканоміі батарэі часта могуць выклікаць гэта на мабільных прыладах. Перазагрузка прылады таксама можа дапамагчы, калі вы часта бачыце гэтую памылку.
scenes.welcomescene.update_intro=Піксельнае падзямелле абноўлена!
scenes.welcomescene.update_msg=Версія 3.3 уключае зону для тэставання будучай перапрацоўкі гарадскога квэста, новыя прадметы і шэраг дробных налад і паляпшэнняў.
scenes.welcomescene.what_msg=Здаецца, вашы бягучыя захаванні — з будучай версіі Pixel Dungeon!\n\n Будзьце асцярожныя! Вашы захаванні могуць утрымліваць рэчы, якіх няма ў гэтай версіі, і гэта можа прывесці да ўзнікнення вельмі дзіўных памылак.

