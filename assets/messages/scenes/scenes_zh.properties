scenes.heroselectscene.custom_seed_desc=游戏使用种子码生成地下城，相同的种子码和游戏版本总是生成相同的地下城！_自定义种子游戏无法获得徽章或计入游戏次数，并且会显示在排行榜页面的底部。_
scenes.heroselectscene.custom_seed_duplicate=您目前已使用该种子进行一局常规游戏。您必须先结束该游戏，才能使用该自定义种子。
