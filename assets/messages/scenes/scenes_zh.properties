scenes.heroselectscene.daily=每日跑步
scenes.heroselectscene.daily_desc=每天都会推出一款全新的游戏，所有玩家都能体验到相同的内容！这个“每日挑战”会为每位玩家生成相同的地下城（前提是他们玩的是同一游戏版本）。您可以随意安排完成每日挑战的时间，但一次只能进行一次。每日挑战不参与徽章奖励，并拥有独立的排名页面。您想使用当前选择的英雄和挑战开始今天的每日挑战吗？
scenes.heroselectscene.daily_existing=您目前已有一个每日跑步任务正在进行中。您必须先结束当前的跑步任务，才能开始另一个每日跑步任务。
scenes.heroselectscene.daily_no=不
scenes.heroselectscene.daily_nowin=每天都会推出一款全新的游戏，而且所有玩家的游戏内容都相同！这个“每日挑战”会为每位玩家生成相同的地下城（前提是他们玩的是同一游戏版本）。您必须至少赢得一场游戏才能参与每日挑战。
scenes.heroselectscene.daily_repeat=您已完成今天的每日挑战。您可以重玩，但仅限非排名练习。重玩结束后，您可以在每日排名窗口中查看记录一段时间，之后记录将被删除。您想使用当前选择的英雄和挑战重玩今天的每日挑战吗？
scenes.heroselectscene.daily_unavailable_long=您似乎开启了一个未来的每日挑战！如果您最近更改了时区或系统时钟，就可能发生这种情况。您的下一个每日挑战将在 %d 天后发布。
