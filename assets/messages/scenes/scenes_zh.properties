scenes.welcomescene.save_warning=最近，您在尝试保存游戏数据时，《像素地牢》的游戏进程被中断。《像素地牢》内置了保护机制，因此您的游戏数据应该不会受到影响。这种情况通常发生在您的设备突然断电，或者《像素地牢》在未正常关闭的情况下被强制终止时。移动设备的省电模式也经常会导致这种情况。如果您频繁遇到此错误，重启设备或许可以解决问题。
scenes.welcomescene.update_intro=《像素地牢》已更新！
scenes.welcomescene.update_msg=v3.3 版本包含一个用于测试即将进行的城市任务大改版的区域、新物品以及一系列较小的调整和改进。
scenes.welcomescene.what_msg=看来您当前的存档来自《像素地牢》的未来版本！请谨慎操作！您的存档可能包含此版本中不存在的内容，这可能会导致一些非常奇怪的错误。

