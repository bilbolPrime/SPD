scenes.welcomescene.controller_title=Entrée du contrôleur
scenes.welcomescene.lang_warning_msg=Une partie du nouveau contenu de cette mise à jour n'a pas encore été traduite.\n\nCertaines phrases peuvent être écrites en anglais.\n\nLes équipes de traduction travaillent à la résolution de ce problème et une traduction complète devrait être intégrée prochainement.\n\nNous vous remercions de votre patience.
scenes.welcomescene.lang_warning_title=Traduction incomplète
scenes.welcomescene.patch_balance=Ce patch contient des améliorations de l'équilibre du jeu.
scenes.welcomescene.patch_bugfixes=Ce correctif contient des corrections de bogues.
scenes.welcomescene.patch_intro=Pixel Dungeon a été corrigé !
scenes.welcomescene.patch_msg=Ce correctif contient également quelques petits ajustements et améliorations de performance.
scenes.welcomescene.patch_translations=Ce correctif contient des mises à jour de traduction.
scenes.welcomescene.save_warning=Pixel Dungeon a été interrompu lors de la sauvegarde de vos données de jeu récemment. Pixel Dungeon dispose de protections intégrées contre ce problème, vos données de jeu ne devraient donc pas poser de problème.\n\nCela se produit généralement lorsque votre appareil perd soudainement de l'énergie, ou s'il termine Pixel Dungeon sans le laisser se fermer correctement. Les fonctions d'économie de la batterie peuvent souvent être à l'origine de ce problème sur les appareils mobiles. Le redémarrage de votre appareil peut également vous aider si vous rencontrez fréquemment cette erreur.
scenes.welcomescene.update_intro=Pixel Dungeon a été mis à jour !
scenes.welcomescene.update_msg=la v3.3 inclut une zone de test pour la prochaine refonte de la quête de la ville, de nouveaux objets et un tas de petits ajustements et d'améliorations.
scenes.welcomescene.what_msg=Il semble que vos sauvegardes actuelles proviennent d'une version future de Pixel Dungeon !\n\nSoyez prudent ! Vos sauvegardes peuvent contenir des éléments qui n'existent pas dans cette version, ce qui pourrait provoquer des erreurs très bizarres.

