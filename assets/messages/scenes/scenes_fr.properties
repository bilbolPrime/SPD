scenes.titlescene$changesbutton.desc=Pixel Dungeon est régulièrement mis à jour avec des modifications du contenu du jeu existant, ou du contenu entièrement nouveau !\n\nL'équilibre du jeu est également fréquemment amélioré dans les mises à jour, afin que certains objets, héros ou ennemis ne soient pas trop forts ou trop faibles.\n\nLes mises à jour incluent également des corrections de bugs et d'autres améliorations de la stabilité.
