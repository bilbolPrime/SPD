scenes.heroselectscene.challenges_nowin=Les défis sont des modificateurs optionnels qui rendent le jeu plus difficile. Certains défis rendent le donjon plus dangereux, d'autres réduisent la puissance de vos capacités ou de vos objets.\n\nvous devez gagner au moins une partie avant de pouvoir activer les défis
