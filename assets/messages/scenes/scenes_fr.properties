scenes.heroselectscene.daily=Course quotidienne
scenes.heroselectscene.daily_desc=Chaque jour, un nouveau jeu est disponible et il est le même pour tout le monde ! Cette "course quotidienne" génère le même donjon pour chaque personne qui y joue (à condition qu'elle joue également à la même version du jeu).\n\nVous pouvez prendre autant de temps que vous le souhaitez pour terminer une course quotidienne, mais vous ne pouvez en avoir qu'une seule active à la fois. les courses quotidiennes ne donnent pas droit à des badges et ont leur propre page de classement\n\nSouhaitez-vous commencer la course quotidienne d'aujourd'hui avec le héros et les défis que vous avez sélectionnés ?
scenes.heroselectscene.daily_existing=Vous avez déjà une course quotidienne en cours. Vous devez terminer ce cycle avant de commencer un autre cycle quotidien.
scenes.heroselectscene.daily_no=non
scenes.heroselectscene.daily_nowin=Chaque jour, un nouveau jeu est disponible et il est le même pour tout le monde ! Cette "course quotidienne" génère le même donjon pour chaque personne qui y joue (à condition qu'elle joue également à la même version du jeu).\n\nvous devez gagner au moins une partie avant de pouvoir jouer aux runs quotidiens
scenes.heroselectscene.daily_repeat=Vous avez déjà joué la journée d'aujourd'hui. Vous pouvez la rejouer si vous le souhaitez, mais uniquement en tant qu'entraînement non classé.\n\nUne fois la partie rejouée, vous pourrez la consulter dans la fenêtre des classements quotidiens pendant une courte période avant que l'enregistrement ne soit supprimé.\n\nSouhaitez-vous rejouer la journée d'aujourd'hui avec le héros et les défis que vous avez sélectionnés ?
scenes.heroselectscene.daily_unavailable_long=Il semble que vous ayez commencé une journée qui se situe dans le futur ! Cela peut se produire si vous avez récemment changé de fuseau horaire ou si vous avez modifié l'horloge de votre système. votre prochain quotidien sera disponible dans %d jours
