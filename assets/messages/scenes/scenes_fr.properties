scenes.heroselectscene.custom_seed_desc=Le jeu utilise un code de semence pour la génération des donjons, la même semence et la même version du jeu génèrent toujours le même donjon ! les jeux à semences personnalisées ne permettent pas d'obtenir des badges ou de contribuer aux parties jouées, et apparaissent au bas de la page de classement
scenes.heroselectscene.custom_seed_duplicate=Vous avez déjà une partie régulière en cours avec cette graine. Vous devez terminer cette partie avant d'utiliser cette graine personnalisée.
