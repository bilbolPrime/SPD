scenes.welcomescene.controller_title=Ingresso del controller
scenes.welcomescene.lang_warning_msg=Alcuni dei nuovi contenuti di questo aggiornamento non sono ancora stati tradotti. Alcune frasi potrebbero essere scritte in inglese. I team di traduzione stanno lavorando per risolvere il problema e una traduzione completa dovrebbe essere rilasciata a breve. Grazie per la pazienza.
scenes.welcomescene.lang_warning_title=Traduzione incompleta
scenes.welcomescene.patch_balance=Questa patch contiene delle modifiche al bilanciamento del gioco.
scenes.welcomescene.patch_bugfixes=Questa patch contiene correzioni di bug.
scenes.welcomescene.patch_intro=Pixel Dungeon è stato corretto!
scenes.welcomescene.patch_msg=Questa patch contiene anche alcune piccole modifiche e miglioramenti delle prestazioni.
scenes.welcomescene.patch_translations=Questa patch contiene aggiornamenti alle traduzioni.
scenes.welcomescene.save_warning=Pixel Dungeon è stato interrotto di recente durante il tentativo di salvare i dati di gioco. Pixel Dungeon dispone di protezioni integrate contro questo problema, quindi i tuoi dati di gioco dovrebbero essere al sicuro.\n\nQuesto di solito accade quando il dispositivo perde improvvisamente alimentazione o se termina Pixel Dungeon senza consentirne la chiusura corretta. Le funzioni di risparmio energetico possono spesso causare questo problema sui dispositivi mobili. Riavviare il dispositivo potrebbe anche essere d'aiuto se visualizzi questo errore frequentemente.
scenes.welcomescene.update_intro=Pixel Dungeon è stato aggiornato!
scenes.welcomescene.update_msg=La versione 3.3 include un'area di test per la prossima revisione delle missioni cittadine, nuovi oggetti e una serie di piccole modifiche e miglioramenti.
scenes.welcomescene.what_msg=Sembra che i tuoi salvataggi attuali provengano da una versione futura di Pixel Dungeon! Procedi con cautela! I tuoi salvataggi potrebbero contenere elementi inesistenti in questa versione, il che potrebbe causare errori molto strani.

