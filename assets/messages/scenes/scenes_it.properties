scenes.titlescene$changesbutton.desc=Pixel Dungeon viene regolarmente aggiornato con revisioni dei contenuti di gioco esistenti o con contenuti completamente nuovi!\n\nIl bilanciamento del gioco viene inoltre frequentemente migliorato negli aggiornamenti, in modo che specifici oggetti/eroi/nemici non siano troppo forti o troppo deboli.\n\nGli aggiornamenti includono anche correzioni di bug e altri vari miglioramenti della stabilità.
