scenes.heroselectscene.custom_seed_title=Inserisci un seme personalizzato
scenes.heroselectscene.daily=Corsa quotidiana
scenes.heroselectscene.daily_desc=Ogni giorno è disponibile un nuovo gioco uguale per tutti! Questa "corsa giornaliera" genera lo stesso dungeon per ogni persona che ci gioca (a patto che stia giocando anche alla stessa versione del gioco).\n\nPuoi impiegare tutto il tempo che vuoi per completare una corsa giornaliera, ma puoi averne solo una attiva alla volta. _Le corse giornaliere non danno diritto a distintivi e hanno una pagina di classifiche separata._\n\nVuoi iniziare la corsa giornaliera di oggi con l'eroe e le sfide attualmente selezionati?
scenes.heroselectscene.daily_existing=Hai già una corsa giornaliera in corso. Devi terminarla prima di iniziarne un'altra.
scenes.heroselectscene.daily_no=NO
scenes.heroselectscene.daily_nowin=Ogni giorno è disponibile un nuovo gioco uguale per tutti! Questa "corsa giornaliera" genera lo stesso dungeon per ogni persona che ci gioca (a patto che stia giocando anche alla stessa versione del gioco).\n\n_Devi vincere almeno una partita prima di poter giocare alle corse giornaliere._
scenes.heroselectscene.daily_repeat=Hai già giocato la sfida giornaliera di oggi. Puoi rigiocarla se vuoi, ma solo come allenamento non classificato.\n\nDopo aver completato la rigiocata, potrai visualizzarla dalla finestra delle classifiche giornaliere per un breve periodo prima che il record venga eliminato.\n\nVuoi rigiocare la sfida giornaliera di oggi con l'eroe e le sfide attualmente selezionati?
scenes.heroselectscene.daily_unavailable_long=Sembra che tu abbia iniziato una missione giornaliera che si svolge nel futuro! Questo può accadere se hai recentemente cambiato fuso orario o se hai modificato l'orologio di sistema. _La tua prossima missione giornaliera sarà disponibile tra %d giorni._
