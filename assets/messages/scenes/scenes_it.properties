scenes.heroselectscene.challenges_nowin=Le sfide sono modificatori opzionali che rendono il gioco più difficile. Alcune sfide rendono il dungeon più pericoloso, altre riducono la potenza delle tue abilità o dei tuoi oggetti.\n\n_Devi vincere almeno una partita prima di poter attivare le sfide._
scenes.heroselectscene.custom_seed=Sementi personalizzate
scenes.heroselectscene.custom_seed_clear=Chiaro
scenes.heroselectscene.custom_seed_desc=Il gioco utilizza un codice seme per la generazione dei dungeon; lo stesso seme e la stessa versione del gioco generano sempre lo stesso dungeon! _Le partite con seme personalizzato non possono guadagnare distintivi né contribuire al numero di partite giocate e compaiono in fondo alla pagina delle classifiche._
scenes.heroselectscene.custom_seed_duplicate=Hai già una partita regolare in corso con quel seme. Devi terminare quella partita prima di poter utilizzare quel seme personalizzato.
scenes.heroselectscene.custom_seed_nowin=Il gioco utilizza un codice seme per la generazione del dungeon; lo stesso seme e la stessa versione del gioco generano sempre lo stesso dungeon!\n\n_Devi vincere almeno una partita prima di poter inserire semi personalizzati._
