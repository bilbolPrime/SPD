scenes.firstpersonbutton.mouse_help=Muovi il mouse per guardarti intorno. Tieni premuto Alt per usare il cursore sui pulsanti. Rilascia Alt per tornare a guardare. I menu liberano il cursore automaticamente. Dopo essere uscito dalla finestra, clicca al suo interno per riprendere a guardare; quel clic non esegue azioni. Esc annulla la scelta del bersaglio.
scenes.firstpersonbutton.controller_help=Stick sinistro: muovi. Stick destro: guarda. Tieni premuto %1$s per usare il cursore e rilascialo per tornare a guardare. Usa %2$s per selezionare. I menu attivano il cursore automaticamente. Riporta al centro lo stick destro quando cambi modalità.
