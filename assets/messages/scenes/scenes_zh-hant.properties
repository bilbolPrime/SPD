scenes.welcomescene.patch_translations=此補丁包含翻譯更新。
scenes.welcomescene.save_warning=最近，您在嘗試儲存遊戲資料時，《像素地牢》的遊戲進程被中斷。 《像素地牢》內建了保護機制，因此您的遊戲資料應該不會受到影響。這種情況通常發生在您的裝置突然斷電，或是《像素地牢》在未正常關閉的情況下強制終止。行動裝置的省電模式也經常會導致這種情況。如果您頻繁遇到此錯誤，重啟設備或許可以解決問題。
scenes.welcomescene.update_intro=《像素地牢》已更新！
scenes.welcomescene.update_msg=v3.3 版本包含一個用於測試即將進行的城市任務大改版的區域、新物品以及一系列較小的調整和改進。
scenes.welcomescene.what_msg=看來您目前的存檔來自《像素地牢》的未來版本！請謹慎操作！您的存檔可能包含此版本中不存在的內容，這可能會導致一些非常奇怪的錯誤。

