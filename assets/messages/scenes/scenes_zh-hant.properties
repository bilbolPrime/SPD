scenes.heroselectscene.daily=每日跑步
scenes.heroselectscene.daily_desc=每天都會推出一款全新的遊戲，所有玩家都能體驗到相同的內容！這個「每日挑戰」會為每位玩家生成相同的地下城（前提是他們玩的是同一遊戲版本）。您可以隨意安排完成每日挑戰的時間，但一次只能進行一次。每日挑戰不參與徽章獎勵，並擁有獨立的排名頁面。您想使用當前選擇的英雄和挑戰開始今天的每日挑戰嗎？
scenes.heroselectscene.daily_existing=您目前已有一個每日跑步任務正在進行中。您必須先結束目前的跑步任務，才能開始另一個每日跑步任務。
scenes.heroselectscene.daily_no=不
scenes.heroselectscene.daily_nowin=每天都會推出一款全新的遊戲，而且所有玩家的遊戲內容都相同！這個「每日挑戰」會為每位玩家生成相同的地下城（前提是他們玩的是同一遊戲版本）。您必須至少贏得一場遊戲才能參與每日挑戰。
scenes.heroselectscene.daily_repeat=您已完成今天的每日挑戰。您可以重玩，但僅限非排名練習。重玩結束後，您可以在每日排名視窗中查看記錄一段時間，之後記錄將會被刪除。您想使用當前選擇的英雄和挑戰重玩今天的每日挑戰嗎？
scenes.heroselectscene.daily_unavailable_long=您似乎開啟了一個未來的每日挑戰！如果您最近更改了時區或系統時鐘，就可能發生這種情況。您的下一個每日挑戰將在 %d 天後發布。
