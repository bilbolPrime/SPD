scenes.welcomescene.lang_warning_msg=A frissítés új tartalmának egy része még nincs lefordítva.\n\nElőfordulhat, hogy egyes kifejezések angolul vannak írva.\n\nA fordítócsapatok dolgoznak a probléma megoldásán, és a teljes fordítás hamarosan elérhető lesz.\n\nKöszönjük a türelmét.
scenes.welcomescene.lang_warning_title=Hiányos fordítás
scenes.welcomescene.patch_balance=Ez a patch játékegyensúly-módosításokat tartalmaz.
scenes.welcomescene.patch_bugfixes=Ez a javítás hibajavításokat tartalmaz.
scenes.welcomescene.patch_intro=A Pixel Dungeon javításra került!
scenes.welcomescene.patch_msg=Ez a patch néhány apróbb módosítást és teljesítménybeli javítást is tartalmaz.
scenes.welcomescene.patch_translations=Ez a javítás fordítási frissítéseket tartalmaz.
scenes.welcomescene.save_warning=A Pixel Dungeon nemrégiben megszakadt a játékadatok mentése közben. A Pixel Dungeon beépített védelemmel rendelkezik ez ellen, így a játékadatoknak rendben kell lenniük.\n\nEz általában akkor fordul elő, ha az eszköz hirtelen elveszíti az áramellátást, vagy ha a Pixel Dungeon leáll anélkül, hogy megfelelően bezáródna. Az akkumulátorkímélő funkciók gyakran okozhatják ezt a hibát mobileszközökön. Az eszköz újraindítása is segíthet, ha gyakran látod ezt a hibát.
scenes.welcomescene.update_intro=Frissült a Pixel Dungeon!
scenes.welcomescene.update_msg=A v3.3 tartalmaz egy tesztelői területet a városi küldetés közelgő átalakításához, új tárgyakat, valamint számos kisebb módosítást és fejlesztést.
scenes.welcomescene.what_msg=Úgy tűnik, hogy a jelenlegi mentéseid a Pixel Dungeon egy jövőbeli verziójából származnak! \n\n Légy óvatos! A mentéseid olyan dolgokat tartalmazhatnak, amelyek ebben a verzióban nem léteznek, ami néhány nagyon furcsa hibát okozhat.

