scenes.titlescene$changesbutton.desc=A Pixel Dungeon rendszeresen frissül a meglévő játéktartalmak átalakításával, vagy teljesen új tartalommal!\n\nA játék egyensúlyát is gyakran javítják a játékfrissítésekben, így az egyes tárgyak/hősök/ellenségek nem lesznek túl erősek vagy túl gyengék.\n\nUa frissítések hibák javítását és egyéb stabilitási fejlesztéseket is tartalmaznak.
