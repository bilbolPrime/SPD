scenes.firstpersonbutton.mouse_help=Az egér mozgatásával nézhetsz körül. Tartsd lenyomva az Alt billentyűt a kurzor használatához a gombokon. Engedd fel az Alt billentyűt a körülnézéshez. A menük automatikusan elengedik a kurzort. Ha kiléptél az ablakból, kattints bele a körülnézés folytatásához; ez a kattintás nem hajt végre műveletet. Az Esc megszakítja a célpontválasztást.
scenes.firstpersonbutton.controller_help=Bal kar: mozgás. Jobb kar: körülnézés. Tartsd lenyomva a kurzor használatához: %1$s; engedd fel a körülnézéshez. Kiválasztás: %2$s. A menükben automatikusan a kurzort használod. Váltáskor engedd vissza középre a jobb kart.
