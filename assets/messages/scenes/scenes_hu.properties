scenes.heroselectscene.challenges_nowin=A kihívások opcionális módosítók, amelyek nehezítik a játékot. Egyes kihívások veszélyesebbé teszik a kazamatát, mások csökkentik a képességeid vagy tárgyaid erejét.\n\n_Legalább egy játékot meg kell nyerned, mielőtt engedélyezhetnéd a kihívásokat._
scenes.heroselectscene.custom_seed=Egyéni vetőmag
scenes.heroselectscene.custom_seed_clear=Világos
scenes.heroselectscene.custom_seed_desc=A játék egy kezdőkódot használ a kazamaták generálásához, ugyanaz a kezdőkód és játékverzió mindig ugyanazt a kazamatát generálja! _Az egyéni kezdőjátékok nem szerezhetnek jelvényeket, nem járulhatnak hozzá a lejátszott játékokhoz, és a ranglista oldal alján jelennek meg._
scenes.heroselectscene.custom_seed_duplicate=Már van egy folyamatban lévő normál játékod ezzel a kezdőértékkel. Be kell fejezned a játékot, mielőtt használnád az egyéni kezdőértéket.
scenes.heroselectscene.custom_seed_nowin=A játék egy kezdőkódot használ a kazamaták generálásához, ugyanaz a kezdőkód és játékverzió mindig ugyanazt a kazamatát generálja! \n\n_Legalább egy játékot meg kell nyerned, mielőtt egyéni kezdőkódokat adhatsz meg._
scenes.heroselectscene.custom_seed_set=KÉSZLET
scenes.heroselectscene.custom_seed_title=Adjon meg egy egyéni kezdőértéket
scenes.heroselectscene.daily=Napi futás
scenes.heroselectscene.daily_desc=Minden nap elérhető egy új játék, ami mindenkinek ugyanaz! Ez a „napi menet” ugyanazt a kazamatát generálja minden játékos számára, aki játszik (feltéve, hogy ugyanazzal a játékverzióval játszanak).\n\nA napi menetek teljesítéséhez addig használhatsz fel, ameddig csak szeretnél, de egyszerre csak egy lehet aktív. _A napi futások nem jogosítanak jelvényekre, és saját külön rangsoroldallal rendelkeznek._\n\nSzeretnéd a mai napi meccset a jelenleg kiválasztott hőseddel és kihívásokkal kezdeni?
scenes.heroselectscene.daily_existing=Már folyamatban van egy napi futásod. Be kell fejezned azt, mielőtt egy másik napi futást kezdenél.
scenes.heroselectscene.daily_no=nem
scenes.heroselectscene.daily_nowin=Minden nap elérhető egy új játék, ami mindenkinek ugyanaz! Ez a „napi menet” ugyanazt a kazamatát generálja minden játékos számára, aki játszik vele (feltéve, hogy ugyanazt a játékverziót játsszák).\n\n_Legalább egy játékot meg kell nyerned, mielőtt játszhatsz a napi menetekben._
scenes.heroselectscene.daily_repeat=Már lejátszottad a mai napi meccset. Újrajátszhatod, ha szeretnéd, de csak rangsorolatlan gyakorlómenetként.\n\nMiután befejezted a visszajátszást, rövid ideig megtekintheted a napi ranglista ablakban, mielőtt a rekord törlődik.\n\nSzeretnéd újrajátszani a mai napi meccset a jelenleg kiválasztott hősöddel és kihívásokkal?
scenes.heroselectscene.daily_unavailable_long=Úgy tűnik, egy jövőbeni napi programot indítottál! Ez akkor fordulhat elő, ha nemrég időzónát váltottál, vagy ha a rendszerórádat módosítottad. _A következő napi program %d nap múlva lesz elérhető._
