scenes.welcomescene.controller_title=Вхід контролера
scenes.welcomescene.lang_warning_msg=Деякий новий контент із цього оновлення ще не перекладено. \n\nДеякі фрази можуть бути написані англійською мовою. \n\nКоманди перекладачів працюють над вирішенням цієї проблеми, і повний переклад має бути виправлено найближчим часом. \n\nДякуємо за ваше терпіння.
scenes.welcomescene.lang_warning_title=Неповний переклад
