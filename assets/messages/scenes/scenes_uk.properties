scenes.firstpersonbutton.mouse_help=Рухайте мишею, щоб озиратися. Утримуйте Alt для роботи з курсором на кнопках. Відпустіть Alt, щоб знову озиратися. У меню курсор звільняється автоматично. Після виходу з вікна клацніть усередині, щоб повернутися до огляду; цей клік не виконує дії. Esc скасовує вибір цілі.
scenes.firstpersonbutton.controller_help=Лівий стік: рух. Правий стік: огляд. Утримуйте %1$s для керування курсором; відпустіть для огляду. Вибір: %2$s. У меню курсор вмикається автоматично. Під час перемикання відпускайте правий стік.
