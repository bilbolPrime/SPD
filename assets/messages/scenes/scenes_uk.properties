scenes.heroselectscene.daily=Щоденний пробіг
scenes.heroselectscene.daily_desc=Щодня доступна нова гра, однакова для всіх! Цей «щоденний забіг» генерує однакове підземелля для кожної людини, яка в нього грає (за умови, що вони також грають в одну й ту саму версію гри).\n\nВи можете витратити скільки завгодно часу на проходження щоденного забігу, але активним може бути лише один забіг за раз. _Щоденні забіги не дають права на значки та мають окрему сторінку рейтингу._\n\nЧи хотіли б ви розпочати сьогоднішній щоденний забіг із вибраним вами героєм та випробуваннями?
scenes.heroselectscene.daily_existing=У вас вже є щоденний забіг. Ви повинні завершити цей забіг, перш ніж розпочинати інший щоденний забіг.
scenes.heroselectscene.daily_no=ні
scenes.heroselectscene.daily_nowin=Щодня доступна нова гра, однакова для всіх! Цей «щоденний запуск» генерує однакове підземелля для кожної людини, яка в нього грає (за умови, що вони також грають в одну й ту саму версію гри).\n\n_Ви повинні виграти хоча б одну гру, перш ніж зможете грати в щоденних забігах._
scenes.heroselectscene.daily_repeat=Ви вже зіграли сьогоднішню щоденну гру. Ви можете переграти її, якщо хочете, але лише як тренувальний запуск без рейтингу.\n\nПісля завершення повтору ви зможете переглянути її у вікні щоденного рейтингу протягом короткого часу, перш ніж запис буде видалено.\n\nХочете переграти сьогоднішню щоденну гру з вибраним вами героєм та завданнями?
scenes.heroselectscene.daily_unavailable_long=Схоже, ви почали щоденний розклад, який відбудеться в майбутньому! Це може статися, якщо ви нещодавно змінили часові пояси або системний годинник. _Ваш наступний щоденний розклад буде доступний через %d днів._
