scenes.welcomescene.patch_bugfixes=Цей патч містить виправлення помилок.
scenes.welcomescene.patch_intro=Піксельне підземелля виправлено!
scenes.welcomescene.patch_msg=Цей патч також містить деякі невеликі налаштування та покращення продуктивності.
scenes.welcomescene.patch_translations=Цей патч містить оновлення перекладу.
scenes.welcomescene.save_warning=Нещодавно гру Pixel Dungeon було перервано під час спроби зберегти дані вашої гри. У Pixel Dungeon є вбудований захист від цього, тому з вашими даними гри має бути все гаразд.\n\nЗазвичай це трапляється, коли пристрій раптово вимикається або якщо він завершує Pixel Dungeon, не давши йому закритися належним чином. Функції економії заряду батареї часто можуть спричиняти це на мобільних пристроях. Перезавантаження пристрою також може допомогти, якщо ви часто бачите цю помилку.
scenes.welcomescene.update_intro=Піксельне підземелля оновлено!
scenes.welcomescene.update_msg=У версії 3.3 представлено зону для тестування майбутнього оновлення міського квесту, нові предмети та низку дрібних налаштувань та покращень.
scenes.welcomescene.what_msg=Схоже, ваші поточні збереження взяті з майбутньої версії Pixel Dungeon!\n\nБудьте обережні! Ваші збереження можуть містити елементи, яких немає в цій версії, що може призвести до виникнення дуже дивних помилок.

