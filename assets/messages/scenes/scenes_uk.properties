scenes.titlescene$changesbutton.desc=Pixel Dungeon регулярно оновлюється, додаючи як капітальний ремонт існуючого ігрового контенту, так і абсолютно новий! \n\nІгровий баланс також часто покращується в оновленнях гри, щоб певні предмети/герої/вороги не були надто сильними чи надто слабкими. \n\nОновлення також включають виправлення помилок та інші різноманітні покращення стабільності.
