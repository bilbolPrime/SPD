scenes.heroselectscene.challenges_nowin=Випробування – це додаткові модифікатори, які ускладнюють гру. Деякі випробування роблять підземелля небезпечнішим, інші зменшують силу ваших здібностей або предметів. \n\n_Ви повинні виграти принаймні одну гру, перш ніж зможете ввімкнути випробування._
scenes.heroselectscene.custom_seed=Власне насіння
scenes.heroselectscene.custom_seed_clear=Очистити
scenes.heroselectscene.custom_seed_desc=Гра використовує початковий код для генерації підземель, той самий початковий код та версія гри завжди генерують одне й те саме підземелля! _Ігри з початковим кодом не можуть заробляти значки або вносити свій вклад у зіграні ігри, і відображаються внизу сторінки рейтингу._
scenes.heroselectscene.custom_seed_duplicate=У вас вже є звичайна гра з цим початковим значенням. Ви повинні завершити цю гру, перш ніж використовувати це власне початкове значення.
scenes.heroselectscene.custom_seed_nowin=Гра використовує початковий код для генерації підземель, той самий початковий код та версія гри завжди генерують одне й те саме підземелля! \n\n_Ви повинні виграти принаймні одну гру, перш ніж зможете ввести власні початкові коди._
