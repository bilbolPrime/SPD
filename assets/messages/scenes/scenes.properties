scenes.titlescene.hero_mage=Wield wands and arcane power. Shape each encounter with magic.
scenes.titlescene.hero_rogue=Strike from the shadows. Turn stealth and agility into an advantage.
scenes.titlescene.hero_huntress=Keep your distance. Hunt with ranged weapons and the help of nature.
scenes.titlescene.hero_necromancer=Command dark magic and summoned allies. Make the dungeon fight for you.
scenes.titlescene.hero_mercenary=Bring a soldier's arsenal. Control the fight with weapons and tactics.
