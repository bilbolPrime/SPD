scenes.welcomescene.patch_balance=This patch contains tweaks to game balance.
scenes.welcomescene.patch_bugfixes=This patch contains bugfixes.
scenes.welcomescene.patch_intro=Pixel Dungeon has been patched!
scenes.welcomescene.patch_msg=This patch also contains some small tweaks and performance improvements.
scenes.welcomescene.patch_translations=This patch contains translation updates.
scenes.welcomescene.save_warning=Pixel Dungeon was interrupted while trying to save your game data recently. Pixel Dungeon has built-in protections against this, so your game data should be fine.\n\nThis usually happens when your device suddenly loses power, or if it terminates Pixel Dungeon without letting it close properly. Battery saver features can often cause this on mobile devices. Restarting your device may also help if you are seeing this error frequently.
scenes.welcomescene.update_intro=Pixel Dungeon has been updated!
scenes.welcomescene.update_msg=v3.3 includes a tester area for the upcoming overhaul to the city quest, new items, and a bunch of smaller tweaks and improvements.
scenes.welcomescene.what_msg=It seems that your current saves are from a future version of Pixel Dungeon!\n\nTread with caution! Your saves may contain things which don't exist in this version, this could cause some very weird errors to occur.

