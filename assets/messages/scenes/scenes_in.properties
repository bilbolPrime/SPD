scenes.firstpersonbutton.mouse_help=Gerakkan mouse untuk melihat sekeliling. Tahan Alt untuk memakai kursor pada tombol. Lepas Alt untuk melihat sekeliling lagi. Menu otomatis membebaskan kursor. Setelah keluar dari jendela, klik di dalamnya untuk kembali melihat sekeliling; klik ini tidak menjalankan tindakan apa pun. Esc membatalkan pemilihan sasaran.
scenes.firstpersonbutton.controller_help=Stik kiri: bergerak. Stik kanan: melihat sekeliling. Tahan %1$s untuk memakai kursor; lepas untuk melihat sekeliling lagi. Gunakan %2$s untuk memilih. Menu otomatis memakai kursor. Lepaskan stik kanan ke posisi tengah saat berganti mode.
