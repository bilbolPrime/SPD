scenes.amuletscene.text=Akhirnya kau memegangnya di tanganmu, Jimat Yendor! Dengan kekuatan jimat ini, tak ada yang bisa menghalangi jalanmu! Kau telah menaklukkan ruang bawah tanah dan berhasil dalam pencarianmu! Atau, mungkin kau belum siap? Kau juga bisa memutuskan untuk tetap memegang jimat itu, tetap menjadi manusia biasa sedikit lebih lama, dan mungkin meninggalkan ruang bawah tanah dengan cara kuno...
