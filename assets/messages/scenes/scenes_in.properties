scenes.heroselectscene.challenges_nowin=Tantangan adalah pengubah opsional yang membuat permainan lebih sulit. Beberapa tantangan membuat ruang bawah tanah lebih berbahaya, yang lain mengurangi kekuatan kemampuan atau item Anda. Anda harus memenangkan setidaknya satu permainan sebelum dapat mengaktifkan tantangan.
scenes.heroselectscene.custom_seed=Benih Kustom
scenes.heroselectscene.custom_seed_clear=Jernih
scenes.heroselectscene.custom_seed_desc=Gim ini menggunakan kode seed untuk pembuatan dungeon; seed dan versi gim yang sama selalu menghasilkan dungeon yang sama! Gim dengan seed kustom tidak dapat memperoleh lencana atau berkontribusi pada jumlah gim yang dimainkan, dan akan muncul di bagian bawah halaman peringkat.
scenes.heroselectscene.custom_seed_duplicate=Anda sudah memiliki permainan reguler yang sedang berlangsung dengan seed tersebut. Anda harus mengakhiri permainan tersebut sebelum menggunakan seed kustom itu.
scenes.heroselectscene.custom_seed_nowin=Gim ini menggunakan kode seed untuk pembuatan dungeon, seed dan versi gim yang sama selalu menghasilkan dungeon yang sama! \n\n_Anda harus memenangkan setidaknya satu gim sebelum dapat memasukkan seed kustom._
scenes.heroselectscene.custom_seed_set=MENGATUR
scenes.heroselectscene.custom_seed_title=Masukkan Seed Kustom
scenes.heroselectscene.daily=Lari Harian
scenes.heroselectscene.daily_desc=Setiap hari tersedia permainan baru yang sama untuk semua orang! 'Daily Run' ini menghasilkan dungeon yang sama untuk setiap orang yang memainkannya (selama mereka juga memainkan versi game yang sama). Anda dapat meluangkan waktu sebanyak yang Anda inginkan untuk menyelesaikan daily run, tetapi hanya dapat mengaktifkan satu daily run dalam satu waktu. Daily run tidak memenuhi syarat untuk mendapatkan badge dan memiliki halaman peringkat terpisah. Apakah Anda ingin memulai daily run hari ini dengan hero dan tantangan yang saat ini Anda pilih?
scenes.heroselectscene.daily_existing=Anda sudah memiliki sesi lari harian yang sedang berlangsung. Anda harus mengakhiri sesi lari tersebut sebelum memulai sesi lari harian lainnya.
scenes.heroselectscene.daily_no=TIDAK
scenes.heroselectscene.daily_nowin=Setiap hari tersedia permainan baru yang sama untuk semua orang! 'Daily Run' ini menghasilkan dungeon yang sama untuk setiap orang yang memainkannya (selama mereka juga memainkan versi game yang sama).\n\n_Anda harus memenangkan setidaknya satu permainan sebelum dapat memainkan daily run._
scenes.heroselectscene.daily_repeat=Anda sudah memainkan daily quest hari ini. Anda dapat memainkannya kembali jika mau, tetapi hanya sebagai latihan tanpa peringkat. Setelah Anda menyelesaikan replay, Anda dapat melihatnya dari jendela peringkat harian untuk waktu singkat sebelum rekaman dihapus. Apakah Anda ingin memainkan ulang daily quest hari ini dengan hero dan tantangan yang saat ini Anda pilih?
scenes.heroselectscene.daily_unavailable_long=Sepertinya Anda telah memulai tugas harian yang akan datang! Ini dapat terjadi jika Anda baru saja mengubah zona waktu, atau jika Anda mengubah jam sistem Anda. Tugas harian Anda berikutnya akan tersedia dalam %d hari.
