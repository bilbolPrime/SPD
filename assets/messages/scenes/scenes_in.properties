scenes.titlescene$changesbutton.desc=Pixel Dungeon secara teratur diperbarui dengan perbaikan pada konten game yang sudah ada, atau konten baru sepenuhnya! Keseimbangan game juga sering ditingkatkan dalam pembaruan game, sehingga item/hero/musuh tertentu tidak terlalu kuat atau terlalu lemah. Pembaruan juga mencakup perbaikan bug dan berbagai peningkatan stabilitas lainnya.
