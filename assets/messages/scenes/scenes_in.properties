scenes.welcomescene.lang_warning_msg=Sebagian konten baru dari pembaruan ini belum diterjemahkan.\n\nBeberapa frasa mungkin ditulis dalam bahasa Inggris.\n\nTim penerjemahan sedang berupaya menyelesaikan masalah ini dan terjemahan lengkap akan segera ditambahkan.\n\nTerima kasih atas kesabaran Anda.
