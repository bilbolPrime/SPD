scenes.welcomescene.patch_balance=Patch ini berisi penyesuaian pada keseimbangan permainan.
scenes.welcomescene.patch_bugfixes=Patch ini berisi perbaikan bug.
scenes.welcomescene.patch_intro=Pixel Dungeon telah diperbarui!
scenes.welcomescene.patch_msg=Patch ini juga berisi beberapa penyesuaian kecil dan peningkatan kinerja.
scenes.welcomescene.patch_translations=Patch ini berisi pembaruan terjemahan.
scenes.welcomescene.save_warning=Pixel Dungeon terhenti saat mencoba menyimpan data game Anda baru-baru ini. Pixel Dungeon memiliki perlindungan bawaan terhadap hal ini, jadi data game Anda seharusnya aman. Ini biasanya terjadi ketika perangkat Anda tiba-tiba kehilangan daya, atau jika perangkat menghentikan Pixel Dungeon tanpa membiarkannya tertutup dengan benar. Fitur penghemat baterai seringkali dapat menyebabkan hal ini pada perangkat seluler. Memulai ulang perangkat Anda juga dapat membantu jika Anda sering melihat kesalahan ini.
scenes.welcomescene.update_intro=Pixel Dungeon telah diperbarui!
scenes.welcomescene.update_msg=v3.3 menyertakan area pengujian untuk perombakan mendatang pada misi kota, item baru, dan sejumlah penyesuaian serta peningkatan kecil lainnya.
scenes.welcomescene.what_msg=Sepertinya data simpanan Anda saat ini berasal dari versi Pixel Dungeon yang akan datang! Berhati-hatilah! Data simpanan Anda mungkin berisi hal-hal yang tidak ada di versi ini, ini dapat menyebabkan beberapa kesalahan yang sangat aneh terjadi.

