scenes.welcomescene.controller_title=Entrada del controlador
scenes.welcomescene.lang_warning_msg=Parte del nuevo contenido de esta actualización aún no se ha traducido.\n\nAlgunas frases pueden estar escritas en inglés.\n\nLos equipos de traducción están trabajando para resolver esto y pronto se añadirá una traducción completa.\n\nGracias por su paciencia.
scenes.welcomescene.lang_warning_title=Traducción incompleta
scenes.welcomescene.patch_balance=Este parche incluye ajustes en el equilibrio del juego.
scenes.welcomescene.patch_bugfixes=Este parche contiene correcciones de errores.
scenes.welcomescene.patch_intro=¡Pixel Dungeon ha sido parcheado!
scenes.welcomescene.patch_msg=Este parche también incluye algunos pequeños ajustes y mejoras de rendimiento.
scenes.welcomescene.patch_translations=Este parche contiene actualizaciones de traducción.
scenes.welcomescene.save_warning=Pixel Dungeon se interrumpió al intentar guardar los datos del juego recientemente. Pixel Dungeon cuenta con protecciones integradas contra esto, por lo que los datos del juego deberían estar a salvo.\n\nEsto suele ocurrir cuando el dispositivo se queda sin batería repentinamente o si Pixel Dungeon se cierra sin dejar que se cierre correctamente. Las funciones de ahorro de batería suelen causar esto en dispositivos móviles. Reiniciar el dispositivo también puede ayudar si este error aparece con frecuencia.
scenes.welcomescene.update_intro=¡Pixel Dungeon se ha actualizado!
scenes.welcomescene.update_msg=La versión 3.3 incluye un área de prueba para la próxima revisión de la misión de la ciudad, nuevos objetos y una serie de pequeños ajustes y mejoras.
scenes.welcomescene.what_msg=Parece que tus partidas guardadas actuales son de una versión futura de Pixel Dungeon!\n\n¡Procede con precaución! Tus partidas guardadas pueden contener elementos que no existen en esta versión, lo que podría provocar errores muy extraños.

