scenes.heroselectscene.daily=Carrera diaria
scenes.heroselectscene.daily_desc=Cada día hay un nuevo juego disponible que es el mismo para todos. Esta 'carrera diaria' genera la misma mazmorra para cada persona que la juega (siempre que también estén jugando la misma versión del juego).\n\nPuedes tomarte el tiempo que quieras para completar una carrera diaria, pero solo puedes tener una activa a la vez. _Las carreras diarias no son elegibles para insignias y tienen su propia página de clasificación separada._\n\n¿Te gustaría comenzar el diario de hoy con tu héroe y desafíos seleccionados actualmente?
scenes.heroselectscene.daily_existing=Ya tienes una carrera diaria en curso. Debes finalizarla antes de comenzar otra.
scenes.heroselectscene.daily_no=No
scenes.heroselectscene.daily_nowin=Cada día hay disponible un nuevo juego que es el mismo para todos. Esta "partida diaria" genera la misma mazmorra para cada persona que la juega (siempre que también estén jugando la misma versión del juego). Debes ganar al menos una partida antes de poder jugar las partidas diarias.
scenes.heroselectscene.daily_repeat=Ya has jugado el desafío diario de hoy. Puedes volver a jugarlo si quieres, pero solo como una práctica sin clasificación.\n\nDespués de completar la repetición, podrás verla desde la ventana de clasificaciones diarias durante un breve tiempo antes de que se elimine el registro.\n\n¿Te gustaría volver a jugar el desafío diario de hoy con tu héroe y desafíos seleccionados actualmente?
scenes.heroselectscene.daily_unavailable_long=Parece que has empezado una misión diaria que ya ha pasado. Esto puede ocurrir si has cambiado recientemente de zona horaria o si has modificado la hora de tu sistema. Tu próxima misión diaria estará disponible en el día %d.
