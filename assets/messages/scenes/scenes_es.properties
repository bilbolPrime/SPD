scenes.titlescene$changesbutton.desc=Pixel Dungeon se actualiza regularmente con revisiones del contenido del juego existente, ¡o contenido completamente nuevo!\n\nEl equilibrio del juego también se mejora con frecuencia en las actualizaciones del juego, para que ciertos objetos/héroes/enemigos no sean demasiado fuertes o demasiado débiles.\n\nLas actualizaciones también incluyen correcciones de errores y otras mejoras de estabilidad.
