scenes.heroselectscene.challenges_nowin=Los desafíos son modificadores opcionales que hacen que el juego sea más difícil. Algunos desafíos hacen que la mazmorra sea más peligrosa, otros reducen el poder de tus habilidades u objetos. Debes ganar al menos una partida antes de poder activar los desafíos.
scenes.heroselectscene.custom_seed=Semillas personalizadas
scenes.heroselectscene.custom_seed_clear=Claro
scenes.heroselectscene.custom_seed_desc=El juego utiliza un código semilla para la generación de mazmorras; ¡la misma semilla y versión del juego siempre generan la misma mazmorra! _Las partidas con semillas personalizadas no pueden ganar insignias ni contribuir a las partidas jugadas, y aparecen al final de la página de clasificaciones._
scenes.heroselectscene.custom_seed_duplicate=Ya tienes una partida normal en curso con esa semilla. Debes finalizar esa partida antes de usar esa semilla personalizada.
scenes.heroselectscene.custom_seed_nowin=El juego utiliza un código semilla para la generación de mazmorras; ¡la misma semilla y versión del juego siempre generan la misma mazmorra!_\n\n_Debes ganar al menos una partida antes de poder introducir semillas personalizadas._
