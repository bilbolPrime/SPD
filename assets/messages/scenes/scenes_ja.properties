scenes.titlescene$changesbutton.desc=Pixel Dungeonは定期的にアップデートされ、既存のゲームコンテンツが一新されたり、まったく新しいコンテンツが追加されたりします！\n\nゲームバランスも頻繁にアップデートされ、特定のアイテムやヒーロー、敵が強すぎたり弱すぎたりしないように改善されています。\n\nまた、バグの修正や様々な安定性の向上もアップデートに含まれています。
