scenes.firstpersonbutton.title=視点の切り替え
scenes.firstpersonbutton.cycle=タップするたびに、一人称、三人称、通常の視点に切り替わります。アイコンは次の視点を示します。
scenes.firstpersonbutton.mouse_help=マウスを動かすと周囲を見渡せます。Alt を押している間は、カーソルでボタンを操作できます。Alt を離すと視点操作に戻ります。メニューでは自動でカーソル操作に切り替わります。ウィンドウの外に出た後は、ウィンドウ内をクリックすると視点操作に戻ります。このクリックで行動することはありません。Esc で標的の選択を取り消せます。
scenes.firstpersonbutton.controller_help=左スティック：移動。右スティック：視点操作。%1$s を押している間はカーソル操作になり、離すと視点操作に戻ります。%2$s で選択します。メニューでは自動でカーソル操作になります。切り替えるときは右スティックを離して中央に戻してください。
scenes.firstpersonbutton.visibility=どちらの視点でも、ヒーローが見える範囲だけが表示されます。
