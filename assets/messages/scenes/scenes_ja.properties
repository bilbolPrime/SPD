scenes.welcomescene.controller_title=コントローラー入力
scenes.welcomescene.lang_warning_msg=このアップデートの新コンテンツの一部はまだ翻訳されていません。\n\n英語表記のフレーズもあります。\n\n翻訳チームはこの問題を解決すべく取り組んでおり、近日中に完全な翻訳がパッチされる予定です。\n\nしばらくお待ちください。
scenes.welcomescene.lang_warning_title=不完全な翻訳
scenes.welcomescene.patch_balance=このパッチにはゲームバランスの調整が含まれている。
scenes.welcomescene.patch_bugfixes=このパッチにはバグフィックスが含まれています。
scenes.welcomescene.patch_intro=Pixel Dungeonにパッチが適用されました！
scenes.welcomescene.patch_msg=このパッチには、いくつかの小さな調整とパフォーマンスの改善も含まれている。
scenes.welcomescene.patch_translations=このパッチには翻訳の更新が含まれています。
scenes.welcomescene.save_warning=Pixel Dungeonは最近、ゲームデータを保存しようとして中断されました。Pixel Dungeonにはこのような事態を防ぐ機能が組み込まれていますので、ゲームデータは問題ありません。\n\nこの現象は通常、デバイスの電源が突然切れたり、Pixel Dungeonを正しく終了させずに終了した場合に起こります。モバイルデバイスでは、バッテリーセーバー機能がこれを引き起こすことがよくあります。このエラーが頻繁に発生する場合は、デバイスを再起動することも有効です。
scenes.welcomescene.update_intro=Pixel Dungeonがアップデートされました！
scenes.welcomescene.update_msg=v3.3には、都市クエストのオーバーホールのためのテスター・エリア、新しいアイテム、そしてたくさんの小さな調整と改善が含まれています。
scenes.welcomescene.what_msg=あなたの現在のセーブは、Pixel Dungeonの未来のバージョンのものだと思われます！\n\n注意してください！このバージョンには存在しないものがセーブに含まれている可能性があります。

