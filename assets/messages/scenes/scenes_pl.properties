scenes.titlescene$changesbutton.desc=Gra Pixel Dungeon jest regularnie aktualizowana o nowe, udoskonalone treści istniejącej gry lub o zupełnie nowe treści!\n\nBalans gry jest często poprawiany w aktualizacjach gry, dzięki czemu konkretne przedmioty/bohaterowie/przeciwnicy nie są zbyt silni ani zbyt słabi.\n\nAktualizacje obejmują również poprawki błędów i inne usprawnienia zwiększające stabilność.
