scenes.welcomescene.controller_body=Grasz na kontrolerze? Użyj prawego drążka, aby sterować kursorem na ekranie.\n\nNaciśnij RT/R2 lub prawy drążek, aby wybierać kursorem.
scenes.welcomescene.controller_okay=Dobra
scenes.welcomescene.controller_title=Wejście kontrolera
scenes.welcomescene.lang_warning_msg=Część nowej zawartości tej aktualizacji nie została jeszcze przetłumaczona.\n\nNiektóre frazy mogą być napisane w języku angielskim.\n\nZespoły tłumaczy pracują nad rozwiązaniem tego problemu. Pełne tłumaczenie powinno być wkrótce dostępne.\n\nDziękujemy za cierpliwość.
scenes.welcomescene.lang_warning_title=Niekompletne tłumaczenie
scenes.welcomescene.patch_balance=Ta łatka wprowadza zmiany w balansie gry.
scenes.welcomescene.patch_bugfixes=Ta poprawka zawiera poprawki błędów.
scenes.welcomescene.patch_intro=Pixel Dungeon został zaktualizowany!
scenes.welcomescene.patch_msg=Ta poprawka zawiera także kilka drobnych usprawnień i udoskonaleń wydajności.
scenes.welcomescene.patch_translations=Ta poprawka zawiera aktualizacje tłumaczeń.
scenes.welcomescene.save_warning=Gra Pixel Dungeon została ostatnio przerwana podczas próby zapisania danych gry. Pixel Dungeon ma wbudowane zabezpieczenia przed tego typu sytuacjami, więc z danymi gry wszystko powinno być w porządku.\n\nZwykle dzieje się tak, gdy urządzenie nagle traci zasilanie lub gdy gra Pixel Dungeon zostaje zamknięta bez prawidłowego zamknięcia. Funkcje oszczędzania baterii często mogą powodować ten problem na urządzeniach mobilnych. Ponowne uruchomienie urządzenia również może pomóc, jeśli ten błąd pojawia się często.
scenes.welcomescene.update_intro=Pixel Dungeon został zaktualizowany!
scenes.welcomescene.update_msg=Wersja 3.3 zawiera obszar testowy dla nadchodzącej przebudowy zadań miejskich, nowe przedmioty i wiele drobniejszych poprawek i ulepszeń.
scenes.welcomescene.what_msg=Wygląda na to, że Twoje obecne zapisy pochodzą z przyszłej wersji Pixel Dungeon!\n\nZachowaj ostrożność! Twoje zapisy mogą zawierać elementy, które nie występują w tej wersji, co może powodować występowanie bardzo dziwnych błędów.

