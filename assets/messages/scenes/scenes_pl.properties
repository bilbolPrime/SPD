scenes.titlescene.credits=Skillful Pixel Dungeon - Reborn\n\nKod i grafika: Bilboldev\nMuzyka menu głównego: Bilboldev\nAlbum: Skillful Pixel Dungeon - Reborn\n\nNa podstawie Pixel Dungeon\nKod i grafika: Watabou\nOryginalna muzyka: Cube_Code\n\nKod źródłowy jest dostępny na GitHubie na licencji GNU GPL v3 lub nowszej.
