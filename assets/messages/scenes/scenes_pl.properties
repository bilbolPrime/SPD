scenes.heroselectscene.challenges_nowin=Wyzwania to opcjonalne modyfikatory, które utrudniają grę. Niektóre wyzwania czynią lochy bardziej niebezpiecznymi, inne zmniejszają moc twoich umiejętności lub przedmiotów.\n\n_Musisz wygrać co najmniej jedną grę, zanim będziesz mógł włączyć wyzwania._
scenes.heroselectscene.custom_seed=Niestandardowe nasiona
scenes.heroselectscene.custom_seed_clear=Jasne
scenes.heroselectscene.custom_seed_desc=Gra wykorzystuje kod seed do generowania lochów. Ten sam seed i ta sama wersja gry zawsze generują ten sam loch! _Gry z własnym seedem nie mogą zdobywać odznak ani przyczyniać się do rozegranych gier i pojawiają się na dole strony z rankingiem._
scenes.heroselectscene.custom_seed_duplicate=Masz już w toku zwykłą grę z tym ziarnem. Musisz ją zakończyć, zanim użyjesz tego niestandardowego ziarna.
scenes.heroselectscene.custom_seed_nowin=Gra korzysta z kodu źródłowego do generowania lochów. Ten sam kod źródłowy i wersja gry zawsze generują ten sam loch!\n\n_Musisz wygrać co najmniej jedną grę, zanim będziesz mógł wprowadzić niestandardowe kody źródłowe._
scenes.heroselectscene.custom_seed_set=USTAWIĆ
scenes.heroselectscene.custom_seed_title=Wprowadź niestandardowy kod nasion
scenes.heroselectscene.daily=Codzienny bieg
scenes.heroselectscene.daily_desc=Każdego dnia dostępna jest nowa gra, taka sama dla wszystkich! Ta „codzienna rozgrywka” generuje ten sam loch dla każdej osoby, która w nią gra (pod warunkiem, że grają w tę samą wersję gry).\n\nMożesz poświęcić na ukończenie dziennej rozgrywki tyle czasu, ile chcesz, ale możesz mieć aktywną tylko jedną rozgrywkę na raz. _Codzienne rozgrywki nie kwalifikują się do odznak i mają osobną stronę rankingową._\n\nCzy chcesz rozpocząć dzisiejszą rozgrywkę z aktualnie wybranym bohaterem i wyzwaniami?
scenes.heroselectscene.daily_existing=Masz już jedno codzienne bieganie. Musisz je zakończyć, zanim zaczniesz kolejne.
scenes.heroselectscene.daily_no=NIE
scenes.heroselectscene.daily_nowin=Każdego dnia dostępna jest nowa gra, taka sama dla wszystkich! Ta „codzienna rozgrywka” generuje ten sam loch dla każdej osoby, która w nią gra (pod warunkiem, że grają w tę samą wersję gry).\n\n_Musisz wygrać co najmniej jedną grę, zanim będziesz mógł grać w codzienne rozgrywki._
scenes.heroselectscene.daily_repeat=Rozegrałeś już dzisiejszą bitwę dzienną. Możesz ją powtórzyć, jeśli chcesz, ale tylko jako nierankingową rundę treningową.\n\nPo ukończeniu powtórki będziesz mógł ją obejrzeć w oknie dziennych rankingów przez chwilę, zanim zapis zostanie usunięty.\n\nCzy chcesz powtórzyć dzisiejszą bitwę dzienną z aktualnie wybranym bohaterem i wyzwaniami?
scenes.heroselectscene.daily_unavailable_long=Wygląda na to, że rozpocząłeś/aś dziennik, który jest w przyszłości! Może się tak zdarzyć, jeśli niedawno zmieniłeś/aś strefę czasową lub zegar systemowy. _Twój następny dziennik będzie dostępny za %d dni._
