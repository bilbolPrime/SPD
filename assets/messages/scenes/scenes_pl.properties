scenes.firstpersonbutton.title=Widoki kamery
scenes.firstpersonbutton.cycle=Dotknij, aby przełączać widok: pierwsza osoba, trzecia osoba, zwykły. Ikona pokazuje następny widok.
scenes.firstpersonbutton.mouse_help=Ruszaj myszą, aby się rozglądać. Przytrzymaj Alt, aby używać kursora na przyciskach. Puść Alt, aby znów się rozglądać. Menu automatycznie uwalniają kursor. Po opuszczeniu okna kliknij w nim, aby wrócić do rozglądania; to kliknięcie nie wykonuje żadnej akcji. Esc anuluje wybór celu.
scenes.firstpersonbutton.controller_help=Lewy drążek: ruch. Prawy drążek: rozglądanie. Przytrzymaj %1$s, aby używać kursora; puść, aby znów się rozglądać. Wybór: %2$s. W menu kursor włącza się automatycznie. Przy przełączaniu puść prawy drążek.
scenes.firstpersonbutton.visibility=Oba widoki pokazują tylko to, co widzi bohater.
