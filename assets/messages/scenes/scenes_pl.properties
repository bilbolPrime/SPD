scenes.gamescene.tutorial_ui_desktop=Informacje o bohaterze (%1$s) znajdują się poniżej. Ekwipunek (%2$s), szybkie sloty i akcje w grze znajdują się po prawej stronie. Powodzenia!
scenes.gamescene.tutorial_ui_mobile=Informacje o bohaterze znajdują się w lewym górnym rogu. Ekwipunek, szybkie sloty i akcje w grze znajdują się poniżej. Powodzenia!
