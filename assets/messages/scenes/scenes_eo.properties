scenes.firstpersonbutton.mouse_help=Movu la muson por ĉirkaŭrigardi. Tenu Alt por uzi la kursoron sur butonoj. Lasu Alt por denove ĉirkaŭrigardi. Menuoj aŭtomate liberigas la kursoron. Post foriro el la fenestro, alklaku ene por denove ĉirkaŭrigardi; tiu klako ne faras agon. Esc nuligas la elekton de celo.
scenes.firstpersonbutton.controller_help=Maldekstra stirstango: moviĝi. Dekstra stirstango: rigardi. Tenu %1$s por uzi la kursoron; lasu ĝin por denove rigardi. Uzu %2$s por elekti. Menuoj aŭtomate uzas la kursoron. Dum ŝanĝo lasu la dekstran stirstangon reveni al la centro.
