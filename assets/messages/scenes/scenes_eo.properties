scenes.heroselectscene.challenges_nowin=Defioj estas laŭvolaj modifiloj, kiuj malfaciligas la ludon. Kelkaj defioj plidanĝerigas la kelkarceron, aliaj malpliigas la potencon de viaj kapabloj aŭ objektoj. \n\n_Vi devas venki almenaŭ unu ludon antaŭ ol vi povos ebligi defiojn._
scenes.heroselectscene.custom_seed=Propra Semo
scenes.heroselectscene.custom_seed_clear=Klara
scenes.heroselectscene.custom_seed_desc=La ludo uzas semkodon por kelkarcergenerado, la sama semo kaj ludversio ĉiam generas la saman kelkarceron! _Propraj semludoj ne povas gajni insignojn aŭ kontribui al luditaj ludoj, kaj aperas ĉe la fundo de la rangolisto-paĝo._
scenes.heroselectscene.custom_seed_duplicate=Vi jam havas regulan ludon en progreso kun tiu semo. Vi devas fini tiun ludon antaŭ ol uzi tiun kutiman semon.
scenes.heroselectscene.custom_seed_nowin=La ludo uzas semkodon por kelkarcergenerado, la sama semo kaj ludversio ĉiam generas la saman kelkarceron! \n\n_Vi devas venki almenaŭ unu ludon antaŭ ol vi povas enigi kutimajn semojn._
