scenes.titlescene$changesbutton.desc=Pixel Dungeon estas regule ĝisdatigata per revizioj de ekzistanta ludenhavo, aŭ tute nova enhavo!\n\nLudekvilibro ankaŭ estas ofte plibonigita en ludĝisdatigoj, tiel ke specifaj objektoj/herooj/malamikoj ne estas tro fortaj aŭ tro malfortaj.\n\nĜisdatigoj ankaŭ inkluzivas korektojn por cimoj kaj aliajn diversajn stabilecplibonigojn.
