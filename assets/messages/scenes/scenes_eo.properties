scenes.welcomescene.controller_body=Ĉu vi ludas per regilo? Uzu la dekstran stickmanon por regi surekranan kursoron. \n\nPremu RT/R2 aŭ la dekstran stickmanon por elekti per la kursoro.
scenes.welcomescene.controller_okay=Bone
scenes.welcomescene.controller_title=Regila Enigo
scenes.welcomescene.lang_warning_msg=Iuj el la novaj enhavoj de ĉi tiu ĝisdatigo ankoraŭ ne estas tradukitaj. \n\nKelkaj frazoj eble estas skribitaj en la angla. \n\nLa tradukteamoj laboras por solvi ĉi tion kaj plena traduko baldaŭ estos flikita. \n\nDankon pro via pacienco.
scenes.welcomescene.lang_warning_title=Nekompleta Traduko
scenes.welcomescene.patch_balance=Ĉi tiu ĝisdatigo enhavas ŝanĝojn al la ludekvilibro.
scenes.welcomescene.patch_bugfixes=Ĉi tiu peceto enhavas cimo-korektojn.
scenes.welcomescene.patch_intro=Piksela Kelkarcero estis flikita!
scenes.welcomescene.patch_msg=Ĉi tiu peceto ankaŭ enhavas kelkajn malgrandajn ŝanĝojn kaj plibonigojn de rendimento.
scenes.welcomescene.patch_translations=Ĉi tiu peceto enhavas tradukajn ĝisdatigojn.
scenes.welcomescene.save_warning=Pixel Dungeon estis interrompita dum provado konservi viajn luddatumojn antaŭ nelonge. Pixel Dungeon havas enkonstruitajn protektojn kontraŭ tio, do viaj luddatumoj devus esti en ordo. \n\n Tio kutime okazas kiam via aparato subite perdas potencon, aŭ se ĝi finas Pixel Dungeon sen lasi ĝin fermiĝi ĝuste. Baterioŝparaj funkcioj ofte povas kaŭzi tion ĉe porteblaj aparatoj. Rekomenci vian aparaton ankaŭ povas helpi se vi ofte vidas ĉi tiun eraron.
scenes.welcomescene.update_intro=Piksela Kelkarcero estis ĝisdatigita!
scenes.welcomescene.update_msg=v3.3 inkluzivas testareon por la venonta revizio de la urba serĉo, novajn objektojn, kaj multajn pli malgrandajn ŝanĝojn kaj plibonigojn.
scenes.welcomescene.what_msg=Ŝajnas, ke viaj nunaj savoj estas el estonta versio de Pixel Dungeon!\n\nLegu singarde! Viaj savoj eble enhavas aferojn, kiuj ne ekzistas en ĉi tiu versio, tio povus kaŭzi kelkajn tre strangajn erarojn.

