scenes.heroselectscene.daily=Ĉiutaga Kuro
scenes.heroselectscene.daily_desc=Ĉiutage nova ludo haveblas, kiu estas la sama por ĉiuj! Ĉi tiu "ĉiutaga kuro" generas la saman kelkarceron por ĉiu persono, kiu ludas ĝin (kondiĉe ke ili ankaŭ ludas la saman ludversion). \n\nVi povas preni tiom da tempo, kiom vi volas, por kompletigi ĉiutagan kuron, sed povas havi nur unu aktivan samtempe. _Ĉiutagaj kuroj ne rajtas je insignoj kaj havas sian propran apartan rangopaĝon._\n\nĈu vi ŝatus komenci hodiaŭan ĉiutagan ludon kun via nuntempe elektita heroo kaj defioj?
scenes.heroselectscene.daily_existing=Vi jam havas ĉiutagan ruladon en progreso. Vi devas fini tiun ruladon antaŭ ol komenci alian ĉiutagan ruladon.
scenes.heroselectscene.daily_no=ne
scenes.heroselectscene.daily_nowin=Ĉiutage nova ludo estas havebla, kiu estas la sama por ĉiuj! Ĉi tiu 'ĉiutaga kuro' generas la saman kelkarceron por ĉiu persono, kiu ludas ĝin (kondiĉe ke ili ankaŭ ludas la saman ludversion). \n\n_Vi devas venki almenaŭ unu ludon antaŭ ol vi povos ludi ĉiutagajn kurojn._
scenes.heroselectscene.daily_repeat=Vi jam ludis la hodiaŭan ĉiutagan ludon. Vi povas reludi ĝin se vi volas, sed nur kiel nerangitan ekzercludon.\n\nPost kiam vi finos la ripeton, vi povos vidi ĝin el la ĉiutaga rangotabelo dum mallonga tempo antaŭ ol la registro estos forigita.\n\nĈu vi ŝatus reludi la hodiaŭan ĉiutagan ludon kun via nuntempe elektita heroo kaj defioj?
scenes.heroselectscene.daily_unavailable_long=Ŝajnas, ke vi komencis ĉiutagan revuon, kiu estas en la estonteco! Tio povas okazi se vi ĵus ŝanĝis horzonojn, aŭ se vi ŝanĝis vian sisteman horloĝon. _Via sekva ĉiutaga revuo estos havebla post %d tagoj._
