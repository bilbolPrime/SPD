scenes.amuletscene.text=Vi fine tenas ĝin en viaj manoj, la Amuleton de Yendor! Kun la povo de ĉi tiu amuleto nenio povos stari sur via vojo! Vi konkeris la kelkarceron kaj sukcesis en via serĉado! \n\nAŭ, eble vi ankoraŭ ne pretas? Vi ankaŭ povas decidi simple teni la amuleton, resti simpla mortonto iom pli longe, kaj eble forlasi la kelkarceron laŭ la malnova maniero...
