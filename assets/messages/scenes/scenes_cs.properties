scenes.gamescene.tutorial_ui_mobile=Informace o hrdinovi jsou vlevo nahoře. Inventář, rychlá místa a herní akce jsou níže. Hodně štěstí!
scenes.gamescene.warp=Zdi se kolem tebe deformují a posouvají!
scenes.heroselectscene.challenges_nowin=Výzvy jsou volitelné modifikátory, které hru ztěžují. Některé výzvy činí dungeon nebezpečnějším, jiné snižují sílu vašich schopností nebo předmětů. \n\n_Než budete moci výzvy aktivovat, musíte vyhrát alespoň jednu hru._
scenes.heroselectscene.custom_seed=Vlastní semeno
scenes.heroselectscene.custom_seed_clear=Jasný
scenes.heroselectscene.custom_seed_desc=Hra používá pro generování dungeonů seed kód, stejný seed a verze hry vždy generují stejný dungeon! _Vlastní seed hry nemohou získávat odznaky ani přispívat k odehraným hrám a zobrazují se ve spodní části stránky s hodnocením._
scenes.heroselectscene.custom_seed_duplicate=S daným seedem již máte rozehranou běžnou hru. Před použitím vlastního semena musíte tuto hru ukončit.
scenes.heroselectscene.custom_seed_nowin=Hra používá pro generování dungeonů seed kód, stejný seed a verze hry vždy generují stejný dungeon!\n\n_Než budete moci zadat vlastní seedy, musíte vyhrát alespoň jednu hru._
scenes.heroselectscene.custom_seed_set=SOUBOR
scenes.heroselectscene.custom_seed_title=Zadejte vlastní počáteční hodnotu
scenes.heroselectscene.daily=Denní běh
scenes.heroselectscene.daily_desc=Každý den je k dispozici nová hra, která je pro všechny stejná! Tento „denní běh“ generuje stejný dungeon pro každého, kdo ho hraje (pokud hraje také stejnou verzi hry).\n\nDokončení denního běhu si můžete vyhradit libovolně dlouho, ale aktivní může být pouze jeden. _Denní běhy nelze použít pro odznaky a mají svou vlastní stránku s hodnocením._\n\nChcete začít dnešní denní běh s aktuálně vybraným hrdinou a výzvami?
scenes.heroselectscene.daily_existing=Již máte probíhající denní běh. Před zahájením dalšího denního běhu musíte tento běh ukončit.
scenes.heroselectscene.daily_no=žádný
scenes.heroselectscene.daily_nowin=Každý den je k dispozici nová hra, která je pro všechny stejná! Toto „denní běhání“ generuje stejný dungeon pro každého, kdo ho hraje (pokud hraje stejnou verzi hry).\n\n_Než budete moci hrát denní běhy, musíte vyhrát alespoň jednu hru._
scenes.heroselectscene.daily_repeat=Dnešní denní hru jste již odehráli. Můžete si ji přehrát znovu, pokud chcete, ale pouze jako nehodnocený tréninkový běh.\n\nPo dokončení záznamu si ji budete moci krátce prohlédnout v okně denního žebříčku, než bude záznam smazán.\n\nChcete si dnešní denní hru přehrát znovu s aktuálně vybraným hrdinou a výzvami?
scenes.heroselectscene.daily_unavailable_long=Zdá se, že jste spustili denní vysílání, které je v budoucnosti! Může k tomu dojít, pokud jste nedávno změnili časová pásma nebo systémové hodiny. _Váš další denní vysílání bude k dispozici za %d dní._
