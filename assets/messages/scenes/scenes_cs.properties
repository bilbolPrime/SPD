scenes.titlescene$changesbutton.desc=Pixel Dungeon je pravidelně aktualizován o přepracování stávajícího herního obsahu nebo o zcela nový obsah! \n\nVyvážení hry se také v aktualizacích často vylepšuje, aby konkrétní předměty/hrdinové/nepřátelé nebyli příliš silní nebo příliš slabí. \n\nAktualizace také zahrnují opravy chyb a další různá vylepšení stability.
