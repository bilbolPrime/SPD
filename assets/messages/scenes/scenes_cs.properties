scenes.welcomescene.controller_body=Hrajete na ovladači? Pravou páčkou ovládáte kurzor na obrazovce. \n\n Stisknutím RT/R2 nebo pravé páčky vyberete kurzorem.
scenes.welcomescene.controller_okay=Dobře
scenes.welcomescene.controller_title=Vstup regulátoru
scenes.welcomescene.lang_warning_msg=Část nového obsahu z této aktualizace ještě nebyla přeložena.\n\nNěkteré fráze mohou být napsány v angličtině.\n\nPřekladatelské týmy pracují na vyřešení tohoto problému a brzy by měl být k dispozici kompletní překlad.\n\nDěkujeme za vaši trpělivost.
scenes.welcomescene.lang_warning_title=Neúplný překlad
scenes.welcomescene.patch_balance=Tato záplata obsahuje úpravy vyvážení hry.
scenes.welcomescene.patch_bugfixes=Tato oprava obsahuje opravy chyb.
scenes.welcomescene.patch_intro=Pixelový žalář byl opraven!
scenes.welcomescene.patch_msg=Tato záplata obsahuje také několik drobných úprav a vylepšení výkonu.
scenes.welcomescene.patch_translations=Tato záplata obsahuje aktualizace překladů.
scenes.welcomescene.save_warning=Hra Pixel Dungeon byla nedávno přerušena při pokusu o uložení herních dat. Pixel Dungeon má proti tomu vestavěnou ochranu, takže by vaše herní data měla být v pořádku.\n\nK tomu obvykle dochází, když zařízení náhle vypadne z provozu nebo pokud Pixel Dungeon ukončí hru, aniž by ji bylo možné správně zavřít. Funkce úspory baterie mohou tento problém na mobilních zařízeních často způsobovat. Pokud se vám tato chyba zobrazuje často, může pomoci i restartování zařízení.
scenes.welcomescene.update_intro=Pixelový žalář byl aktualizován!
scenes.welcomescene.update_msg=Verze 3.3 obsahuje testovací zónu pro nadcházející přepracování městského úkolu, nové předměty a řadu menších úprav a vylepšení.
scenes.welcomescene.what_msg=Zdá se, že vaše aktuální uložené hry pocházejí z budoucí verze hry Pixel Dungeon!\n\nBuďte opatrní! Vaše uložené hry mohou obsahovat věci, které v této verzi neexistují, což by mohlo způsobit velmi zvláštní chyby.

scenes.firstpersonview.pointer_free=Podrž Alt pro ovládání kurzoru
scenes.firstpersonview.pointer_resume=Klikni do pohledu a znovu se rozhlížej
scenes.firstpersonview.controller_look=Pravá páčka: rozhlížení. Podrž %s pro kurzor.
