scenes.firstpersonview.unavailable=Tento pohled není dostupný. Obnoven běžný pohled.
scenes.firstpersonbutton.title=Pohledy kamery
scenes.firstpersonbutton.cycle=Klepnutím střídáš pohled z první osoby, třetí osoby a běžný pohled. Ikona ukazuje následující pohled.
scenes.firstpersonbutton.mouse_help=Pohybem myši se rozhlížej. Podrž Alt pro ovládání kurzoru na tlačítkách. Puštěním Alt se vrať k rozhlížení. Nabídky kurzor uvolní automaticky. Po opuštění okna klikni dovnitř pro návrat k rozhlížení; toto kliknutí neprovede žádnou akci. Esc zruší výběr cíle.
scenes.firstpersonbutton.controller_help=Levá páčka: pohyb. Pravá páčka: rozhlížení. Podrž %1$s pro ovládání kurzoru; puštěním se vrať k rozhlížení. Výběr: %2$s. V nabídkách se kurzor zapne automaticky. Při přepínání pusť pravou páčku.
scenes.firstpersonbutton.visibility=Oba pohledy ukazují jen to, co vidí tvůj hrdina.
