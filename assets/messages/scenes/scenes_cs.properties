scenes.welcomescene.controller_body=Hrajete na ovladači? Pravou páčkou ovládáte kurzor na obrazovce. \n\n Stisknutím RT/R2 nebo pravé páčky vyberete kurzorem.
scenes.welcomescene.controller_okay=Dobře
scenes.welcomescene.controller_title=Vstup regulátoru
scenes.welcomescene.lang_warning_msg=Část nového obsahu z této aktualizace ještě nebyla přeložena.\n\nNěkteré fráze mohou být napsány v angličtině.\n\nPřekladatelské týmy pracují na vyřešení tohoto problému a brzy by měl být k dispozici kompletní překlad.\n\nDěkujeme za vaši trpělivost.
scenes.welcomescene.lang_warning_title=Neúplný překlad
scenes.welcomescene.patch_balance=Tato záplata obsahuje úpravy vyvážení hry.
scenes.welcomescene.patch_bugfixes=Tato oprava obsahuje opravy chyb.
scenes.welcomescene.patch_intro=Pixelový žalář byl opraven!
scenes.welcomescene.patch_msg=Tato záplata obsahuje také několik drobných úprav a vylepšení výkonu.
scenes.welcomescene.patch_translations=Tato záplata obsahuje aktualizace překladů.
scenes.welcomescene.save_warning=Hra Pixel Dungeon byla nedávno přerušena při pokusu o uložení herních dat. Pixel Dungeon má proti tomu vestavěnou ochranu, takže by vaše herní data měla být v pořádku.\n\nK tomu obvykle dochází, když zařízení náhle vypadne z provozu nebo pokud Pixel Dungeon ukončí hru, aniž by ji bylo možné správně zavřít. Funkce úspory baterie mohou tento problém na mobilních zařízeních často způsobovat. Pokud se vám tato chyba zobrazuje často, může pomoci i restartování zařízení.
scenes.welcomescene.update_intro=Pixelový žalář byl aktualizován!
scenes.welcomescene.update_msg=Verze 3.3 obsahuje testovací zónu pro nadcházející přepracování městského úkolu, nové předměty a řadu menších úprav a vylepšení.
scenes.welcomescene.what_msg=Zdá se, že vaše aktuální uložené hry pocházejí z budoucí verze hry Pixel Dungeon!\n\nBuďte opatrní! Vaše uložené hry mohou obsahovat věci, které v této verzi neexistují, což by mohlo způsobit velmi zvláštní chyby.

scenes.firstpersonview.pointer_free=Podrž Alt pro ovládání kurzoru
scenes.firstpersonview.pointer_resume=Klikni do pohledu a znovu se rozhlížej
scenes.firstpersonview.controller_look=Pravá páčka: rozhlížení. Podrž %s pro kurzor.
scenes.firstpersonview.controller_cursor=Pravá páčka: kurzor. Pusť %s pro rozhlížení.
scenes.firstpersonview.unavailable=Tento pohled není dostupný. Obnoven běžný pohled.
scenes.firstpersonbutton.title=Pohledy kamery
scenes.firstpersonbutton.cycle=Klepnutím přepínáš mezi 2,5D, 2D, pohledem z první a třetí osoby. Ikona ukazuje následující pohled.
scenes.firstpersonbutton.mouse_help=Pohybem myši se rozhlížej. Podrž Alt pro ovládání kurzoru na tlačítkách. Puštěním Alt se vrať k rozhlížení. Nabídky kurzor uvolní automaticky. Po opuštění okna klikni dovnitř pro návrat k rozhlížení; toto kliknutí neprovede žádnou akci. Esc zruší výběr cíle.
scenes.firstpersonbutton.controller_help=Levá páčka: pohyb. Pravá páčka: rozhlížení. Podrž %1$s pro ovládání kurzoru; puštěním se vrať k rozhlížení. Výběr: %2$s. V nabídkách se kurzor zapne automaticky. Při přepínání pusť pravou páčku.
scenes.firstpersonbutton.visibility=Pohledy z první a třetí osoby ukazují jen to, co vidí tvůj hrdina.

tutorial.menu=Výcvik
tutorial.preview=Trénuj za _Bojovníka_ pod vedením zkušeného instruktora. Než vstoupíš do podzemí, naučíš se pohybovat, bojovat, používat vybavení a dovednosti i léčit se.
tutorial.start=Zahájit výcvik
tutorial.instructor.name=Instruktor
tutorial.instructor.desc=Starý důstojník, který cvičí nové dobrodruhy.
tutorial.try=Rozumím
tutorial.continue=Pokračovat
tutorial.retry=Opakovat místnost
tutorial.leave=Opustit výcvik
tutorial.leave_text=Opustit výcvik? Z hlavní nabídky ho můžeš začít znovu.
tutorial.stay=Zůstat
tutorial.return=Hlavní nabídka
tutorial.complete_title=Připraven do podzemí
tutorial.complete=Prozatím stačí. Nespěchej, prohlížej si neznámé věci a nechávej si volnou únikovou cestu. Podzemí tě šetřit nebude.
tutorial.warning=Ustup z označeného políčka!
tutorial.lesson_0.title=Krok za krokem
tutorial.lesson_0.text=Klepni na políčko podlahy a dojdeš tam. Pohyb, útoky a používání předmětů zabírají čas, čtení nabídek ne. Čekáním necháš uběhnout tah. Promluv si se mnou, když potřebuješ radu nebo chceš místnost zopakovat.
tutorial.lesson_0.goal=Udělej tři kroky a počkej jeden tah.
tutorial.lesson_1.title=Poznej nepřítele
tutorial.lesson_1.text=Než se přiblížíš, prohlédni si obě krysy. Šampioni mají další schopnosti: klepni na jejich ikony a přečti si popis. Malé ikony nad tvorem ukazují aktivní účinky. Prohlížení nestojí žádný tah.
tutorial.lesson_1.goal=Prohlédni si obyčejnou krysu i šampiona.
tutorial.lesson_2.title=Vyber si místo boje
tutorial.lesson_2.text=Nech krysu přijít k tobě. Ve dveřích tě nepřátelé nemohou obklíčit. Až dorazí ostatní, využij úzký průchod a bojuj s nimi po jednom.
tutorial.lesson_2.goal=Poraz tři krysy.
tutorial.lesson_3.title=Výbava, na kterou stačíš
tutorial.lesson_3.text=Před nasazením výbavy zkontroluj požadovanou sílu. Příliš těžké věci tě mohou zpomalit. Obleč koženou zbroj a svitkem urči vlastnosti prstenu. Pozor na neznámou výbavu: prokletý předmět nelze sundat, dokud neodstraníš kletbu.
tutorial.lesson_3.goal=Obleč koženou zbroj a identifikuj prsten.
tutorial.lesson_4.title=První dovednost
tutorial.lesson_4.text=Otevři strom dovedností a nauč se „%s“. Přiřaď ji do rychlého slotu, zapni ji a zasáhni krysu. Tato dovednost spotřebuje manu a má dobu obnovy. U dovedností s výběrem cíle můžeš tlačítkem Zpět zrušit míření, aniž bys dovednost použil.
tutorial.lesson_4.goal=Nauč se „%s“, přiřaď ji do slotu a zasáhni s ní krysu.
tutorial.lesson_5.title=Zotav se před bojem
tutorial.lesson_5.text=Vypij léčivý lektvar. Obnovuje zdraví po dobu 10 tahů: světlejší část ukazatele je léčení, které teprve přijde. Můžeš zemřít dřív, než ho dostaneš. Sněz příděl a počkej na konec léčení. Odpočívej jen v bezpečí. Hladovění ubírá zdraví.
tutorial.lesson_5.goal=Vypij lektvar, najez se a počkej na konec léčení.
tutorial.lesson_6.title=Dívej se pod nohy
tutorial.lesson_6.text=Prohlédni si rostlinu a past, než na ně šlápneš. Vyzkoušej ohnivou past a pak vejdi do vody, abys uhasil plameny. Potom sleduj značku na zemi a ustup, než dopadne útok.
tutorial.lesson_6.goal=Prohlédni obě nebezpečí, uhas oheň a vyhni se označenému útoku.
tutorial.lesson_7.title=Cesta ven
tutorial.lesson_7.text=Poraz nepřátele a postav se na označené políčko u zdi. Podrž tlačítko prozkoumání a najdi tajné dveře. Projdi jimi, najdi klíč a odemkni východ.
tutorial.lesson_7.goal=Poraz oba nepřátele, vyhledej tajné dveře a dojdi ke schodům.
