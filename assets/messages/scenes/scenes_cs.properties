scenes.titlescene.credits=Skillful Pixel Dungeon - Reborn\n\nKód a grafika: Bilboldev\nHudba hlavního menu: Bilboldev\nAlbum: Skillful Pixel Dungeon - Reborn\n\nVychází z Pixel Dungeon\nKód a grafika: Watabou\nPůvodní hudba: Cube_Code\n\nZdrojový kód je na GitHubu pod licencí GNU GPL v3 nebo novější.
