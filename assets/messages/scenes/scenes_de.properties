scenes.titlescene$changesbutton.desc=Pixel Dungeon wird regelmäßig mit Überarbeitungen bestehender Spielinhalte oder komplett neuen Inhalten aktualisiert! Die Spielbalance wird ebenfalls häufig durch Updates verbessert, sodass bestimmte Gegenstände, Helden oder Gegner weder zu stark noch zu schwach sind. Updates beinhalten außerdem Fehlerbehebungen und diverse Stabilitätsverbesserungen.
