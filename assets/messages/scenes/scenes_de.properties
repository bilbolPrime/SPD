scenes.welcomescene.patch_intro=Pixel Dungeon wurde gepatcht!
scenes.welcomescene.patch_msg=Dieser Patch enthält außerdem einige kleinere Optimierungen und Leistungsverbesserungen.
scenes.welcomescene.patch_translations=Dieser Patch enthält Übersetzungsaktualisierungen.
scenes.welcomescene.save_warning=Pixel Dungeon wurde beim Speichern deiner Spieldaten unterbrochen. Pixel Dungeon verfügt über integrierte Schutzmechanismen, sodass deine Spieldaten in Ordnung sein sollten. Dieser Fehler tritt normalerweise auf, wenn dein Gerät plötzlich die Stromversorgung verliert oder Pixel Dungeon beendet, ohne es ordnungsgemäß schließen zu lassen. Energiesparfunktionen können dies auf Mobilgeräten häufig verursachen. Ein Neustart deines Geräts kann ebenfalls helfen, wenn dieser Fehler häufiger auftritt.
scenes.welcomescene.update_intro=Pixel Dungeon wurde aktualisiert!
scenes.welcomescene.update_msg=Version 3.3 beinhaltet einen Testbereich für die bevorstehende Überarbeitung der Stadtquest, neue Gegenstände sowie eine Reihe kleinerer Optimierungen und Verbesserungen.
scenes.welcomescene.what_msg=Deine aktuellen Spielstände stammen anscheinend aus einer zukünftigen Version von Pixel Dungeon!\n\n Vorsicht! Deine Spielstände könnten Elemente enthalten, die in dieser Version nicht existieren. Dies könnte zu sehr seltsamen Fehlern führen.

