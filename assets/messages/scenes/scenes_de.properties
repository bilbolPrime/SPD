scenes.heroselectscene.custom_seed_title=Geben Sie einen benutzerdefinierten Seed ein
scenes.heroselectscene.daily=Täglicher Lauf
scenes.heroselectscene.daily_desc=Jeden Tag steht ein neues Spiel für alle zur Verfügung! Dieser „tägliche Lauf“ generiert für jeden Spieler denselben Dungeon (vorausgesetzt, er spielt dieselbe Spielversion). Du kannst dir für einen täglichen Lauf so viel Zeit nehmen, wie du möchtest, aber es kann immer nur einer aktiv sein. Tägliche Läufe sind nicht abzeichenberechtigt und haben eine eigene Rangliste. Möchtest du den heutigen täglichen Lauf mit deinem aktuell ausgewählten Helden und den Herausforderungen beginnen?
scenes.heroselectscene.daily_existing=Du hast bereits einen Tageslauf gestartet. Du musst diesen Lauf beenden, bevor du einen neuen Tageslauf beginnen kannst.
scenes.heroselectscene.daily_no=NEIN
scenes.heroselectscene.daily_nowin=Jeden Tag steht ein neues Spiel zur Verfügung, das für alle gleich ist! Dieser „tägliche Lauf“ generiert für jeden Spieler denselben Dungeon (vorausgesetzt, er spielt dieselbe Spielversion). \n\n_Du musst mindestens ein Spiel gewinnen, bevor du an den täglichen Läufen teilnehmen kannst._
scenes.heroselectscene.daily_repeat=Du hast die heutige Tagesherausforderung bereits gespielt. Du kannst sie gerne wiederholen, aber nur als ungerankten Übungslauf. Nach Abschluss der Wiederholung kannst du sie dir kurz im Tagesranglistenfenster ansehen, bevor der Eintrag gelöscht wird. Möchtest du die heutige Tagesherausforderung mit deinem aktuell ausgewählten Helden und den aktuellen Herausforderungen wiederholen?
scenes.heroselectscene.daily_unavailable_long=Du hast anscheinend eine Tagesaufgabe begonnen, die in der Zukunft liegt! Das kann passieren, wenn du kürzlich die Zeitzone oder die Systemuhr geändert hast. Deine nächste Tagesaufgabe ist in %d Tagen verfügbar.
