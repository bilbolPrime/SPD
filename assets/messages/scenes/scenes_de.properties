scenes.firstpersonbutton.mouse_help=Bewege die Maus, um dich umzusehen. Halte Alt, um den Mauszeiger für Schaltflächen zu benutzen. Lass Alt los, um dich wieder umzusehen. Menüs geben den Mauszeiger automatisch frei. Klicke nach dem Verlassen des Fensters wieder hinein, um dich umzusehen; dieser Klick löst keine Aktion aus. Esc bricht das Zielen ab.
scenes.firstpersonbutton.controller_help=Linker Stick: bewegen. Rechter Stick: umsehen. Halte %1$s für den Mauszeiger und lass los, um dich wieder umzusehen. Mit %2$s wählst du aus. Menüs aktivieren den Mauszeiger automatisch. Lass den rechten Stick beim Wechsel in die Mitte zurückkehren.
