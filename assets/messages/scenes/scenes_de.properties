scenes.heroselectscene.challenges_nowin=Herausforderungen sind optionale Modifikatoren, die das Spiel schwieriger machen. Manche Herausforderungen erhöhen die Gefahr im Dungeon, andere schwächen deine Fähigkeiten oder Gegenstände. Du musst mindestens ein Spiel gewinnen, bevor du Herausforderungen aktivieren kannst.
scenes.heroselectscene.custom_seed=Benutzerdefiniertes Saatgut
scenes.heroselectscene.custom_seed_clear=Klar
scenes.heroselectscene.custom_seed_desc=Das Spiel verwendet einen Seed-Code zur Dungeon-Generierung. Derselbe Seed und dieselbe Spielversion erzeugen immer denselben Dungeon! _Spiele mit benutzerdefiniertem Seed können keine Abzeichen verdienen, tragen nicht zu den gespielten Partien bei und erscheinen am Ende der Rangliste._
scenes.heroselectscene.custom_seed_duplicate=Du hast bereits ein reguläres Spiel mit diesem Seed laufen. Du musst dieses Spiel beenden, bevor du den benutzerdefinierten Seed verwenden kannst.
scenes.heroselectscene.custom_seed_nowin=Das Spiel verwendet einen Seed-Code zur Dungeon-Generierung. Derselbe Seed und dieselbe Spielversion generieren immer denselben Dungeon!\n\n_Du musst mindestens ein Spiel gewinnen, bevor du benutzerdefinierte Seeds eingeben kannst._
