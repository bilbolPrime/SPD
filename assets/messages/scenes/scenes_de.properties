scenes.welcomescene.lang_warning_msg=Einige der neuen Inhalte dieses Updates sind noch nicht übersetzt. Manche Formulierungen sind möglicherweise auf Englisch. Die Übersetzungsteams arbeiten an der Lösung dieses Problems, und eine vollständige Übersetzung sollte in Kürze verfügbar sein. Vielen Dank für Ihre Geduld.
