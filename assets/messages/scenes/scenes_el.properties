scenes.firstpersonbutton.title=Προβολές κάμερας
scenes.firstpersonbutton.cycle=Πάτησε για εναλλαγή μεταξύ 2.5D, 2D, πρώτου και τρίτου προσώπου. Το εικονίδιο δείχνει την επόμενη προβολή.
scenes.firstpersonbutton.mouse_help=Κίνησε το ποντίκι για να κοιτάξεις γύρω σου. Κράτα το Alt για να χρησιμοποιήσεις τον δείκτη στα κουμπιά. Άφησε το Alt για να κοιτάξεις ξανά γύρω σου. Τα μενού απελευθερώνουν αυτόματα τον δείκτη. Αφού βγεις από το παράθυρο, κάνε κλικ μέσα του για να συνεχίσεις να κοιτάζεις· αυτό το κλικ δεν εκτελεί ενέργεια. Το Esc ακυρώνει την επιλογή στόχου.
scenes.firstpersonbutton.controller_help=Αριστερός μοχλός: κίνηση. Δεξιός μοχλός: κοίταγμα. Κράτα το %1$s για τον δείκτη· άφησέ το για να κοιτάξεις ξανά. Επίλεξε με το %2$s. Στα μενού ενεργοποιείται αυτόματα ο δείκτης. Στην εναλλαγή, άφησε τον δεξιό μοχλό να επιστρέψει στο κέντρο.
scenes.firstpersonbutton.visibility=Οι προβολές πρώτου και τρίτου προσώπου δείχνουν μόνο όσα βλέπει ο ήρωάς σου.

tutorial.menu=Εκπαίδευση
tutorial.preview=Εκπαιδεύσου ως _Πολεμιστής_ με έναν έμπειρο εκπαιδευτή. Μάθε να κινείσαι, να πολεμάς, να χρησιμοποιείς εξοπλισμό και δεξιότητες και να θεραπεύεσαι πριν μπεις στο μπουντρούμι.
tutorial.start=Έναρξη εκπαίδευσης
tutorial.instructor.name=Εκπαιδευτής
tutorial.instructor.desc=Ένας παλιός αξιωματικός που εκπαιδεύει νέους τυχοδιώκτες.
tutorial.try=Κατάλαβα
tutorial.continue=Συνέχεια
tutorial.retry=Ξανά το δωμάτιο
tutorial.leave=Έξοδος από την εκπαίδευση
tutorial.leave_text=Να φύγεις από την εκπαίδευση; Μπορείς να την αρχίσεις ξανά από το κεντρικό μενού.
tutorial.stay=Παραμονή
tutorial.return=Κεντρικό μενού
tutorial.complete_title=Έτοιμος για το μπουντρούμι
tutorial.complete=Αρκετά για τώρα. Μη βιάζεσαι, εξέταζε ό,τι δεν γνωρίζεις και κράτα ανοιχτό έναν δρόμο διαφυγής. Το μπουντρούμι δεν θα σε λυπηθεί.
tutorial.warning=Φύγε από το σημαδεμένο πλακίδιο!
tutorial.lesson_0.title=Βήμα βήμα
tutorial.lesson_0.text=Πάτησε ένα πλακίδιο για να πας εκεί. Η κίνηση, οι επιθέσεις και η χρήση αντικειμένων χρειάζονται χρόνο· η ανάγνωση των μενού όχι. Με την αναμονή περνά ένας γύρος. Μίλησέ μου για μια υπενθύμιση ή για να ξαναδοκιμάσεις ένα δωμάτιο.
tutorial.lesson_0.goal=Κάνε τρία βήματα και περίμενε έναν γύρο.
tutorial.lesson_1.title=Γνώρισε τον εχθρό
tutorial.lesson_1.text=Εξέτασε και τους δύο αρουραίους πριν πλησιάσεις. Οι πρωταθλητές έχουν επιπλέον ικανότητες: πάτησε τα εικονίδιά τους για να διαβάσεις σχετικά. Τα μικρά εικονίδια πάνω από ένα πλάσμα δείχνουν τις ενεργές επιδράσεις. Η εξέταση δεν ξοδεύει γύρους.
tutorial.lesson_1.goal=Εξέτασε τον συνηθισμένο αρουραίο και τον πρωταθλητή.
tutorial.lesson_2.title=Διάλεξε τις μάχες σου
tutorial.lesson_2.text=Άφησε τον αρουραίο να έρθει σε σένα. Αν πολεμάς στην πόρτα, οι εχθροί δεν μπορούν να σε περικυκλώσουν. Όταν έρθουν οι υπόλοιποι, χρησιμοποίησε το στενό πέρασμα και αντιμετώπισέ τους έναν έναν.
tutorial.lesson_2.goal=Νίκησε τους τρεις αρουραίους.
tutorial.lesson_3.title=Κατάλληλος εξοπλισμός
tutorial.lesson_3.text=Έλεγξε την απαιτούμενη δύναμη πριν φορέσεις κάτι. Ο πολύ βαρύς εξοπλισμός μπορεί να σε καθυστερεί. Φόρεσε τη δερμάτινη πανοπλία και αναγνώρισε το δαχτυλίδι με τον πάπυρο. Πρόσεχε τα άγνωστα αντικείμενα: ένα καταραμένο αντικείμενο δεν βγαίνει μέχρι να λυθεί η κατάρα.
tutorial.lesson_3.goal=Φόρεσε τη δερμάτινη πανοπλία και αναγνώρισε το δαχτυλίδι.
tutorial.lesson_4.title=Η πρώτη σου ικανότητα
tutorial.lesson_4.text=Άνοιξε το δέντρο ικανοτήτων και μάθε την ικανότητα «%s». Βάλε τη σε θέση γρήγορης χρήσης, ενεργοποίησέ τη και χτύπα τον αρουραίο. Αυτή η ικανότητα καταναλώνει μάνα και χρειάζεται χρόνο για να χρησιμοποιηθεί ξανά. Όταν ζητείται στόχος, το Πίσω ακυρώνει τη στόχευση χωρίς χρήση.
tutorial.lesson_4.goal=Μάθε την ικανότητα «%s», βάλε τη σε θέση γρήγορης χρήσης και πέτυχε ένα χτύπημα.
tutorial.lesson_5.title=Ανάρρωσε πριν πολεμήσεις
tutorial.lesson_5.text=Πιες το φίλτρο θεραπείας. Αναπληρώνει ζωή σε 10 γύρους: το ανοιχτόχρωμο μέρος της μπάρας δείχνει τη θεραπεία που εκκρεμεί. Μπορεί να πεθάνεις πριν τη λάβεις. Φάε τη μερίδα και περίμενε να αναρρώσεις. Ξεκουράσου μόνο σε ασφαλές μέρος. Η ασιτία σου αφαιρεί ζωή.
tutorial.lesson_5.goal=Πιες το φίλτρο, φάε και περίμενε να τελειώσει η θεραπεία.
tutorial.lesson_6.title=Πρόσεχε πού πατάς
tutorial.lesson_6.text=Εξέτασε το φυτό και την παγίδα πριν τα πατήσεις. Δοκίμασε την παγίδα φωτιάς και μπες στο νερό για να σβήσεις τις φλόγες. Έπειτα πρόσεχε τη σήμανση στο πάτωμα και απομακρύνσου πριν πέσει η επίθεση.
tutorial.lesson_6.goal=Εξέτασε τους δύο κινδύνους, σβήσε τη φωτιά και απόφυγε τη σημαδεμένη επίθεση.
tutorial.lesson_7.title=Η έξοδος
tutorial.lesson_7.text=Νίκησε τους εχθρούς και στάσου στο σημαδεμένο πλακίδιο δίπλα στον τοίχο. Κράτησε πατημένο το κουμπί εξέτασης για να ψάξεις για μια κρυφή πόρτα. Πέρνα από μέσα, βρες το κλειδί και ξεκλείδωσε την έξοδο.
tutorial.lesson_7.goal=Νίκησε και τους δύο εχθρούς, ψάξε για την κρυφή πόρτα και φτάσε στις σκάλες.
