scenes.welcomescene.controller_body=Παίζετε σε χειριστήριο; Χρησιμοποιήστε το δεξί μοχλό για να ελέγξετε έναν κέρσορα στην οθόνη. \n\nΠατήστε RT/R2 ή το δεξί μοχλό για να επιλέξετε με τον κέρσορα.
scenes.welcomescene.controller_okay=Καλά
scenes.welcomescene.controller_title=Είσοδος ελεγκτή
scenes.welcomescene.lang_warning_msg=Μέρος του νέου περιεχομένου από αυτήν την ενημέρωση δεν έχει μεταφραστεί ακόμη.\n\nΟρισμένες φράσεις ενδέχεται να είναι γραμμένες στα Αγγλικά.\n\nΟι ομάδες μετάφρασης εργάζονται για την επίλυση αυτού του προβλήματος και σύντομα θα ενσωματωθεί μια πλήρης μετάφραση.\n\nΣας ευχαριστούμε για την υπομονή σας.
scenes.welcomescene.lang_warning_title=Ελλιπής μετάφραση
scenes.welcomescene.patch_balance=Αυτή η ενημέρωση κώδικα περιέχει τροποποιήσεις στην ισορροπία του παιχνιδιού.
scenes.welcomescene.patch_bugfixes=Αυτή η ενημέρωση κώδικα περιέχει διορθώσεις σφαλμάτων.
scenes.welcomescene.patch_intro=Το Pixel Dungeon έχει ενημερωθεί!
scenes.welcomescene.patch_msg=Αυτή η ενημέρωση κώδικα περιέχει επίσης μερικές μικρές τροποποιήσεις και βελτιώσεις στην απόδοση.
scenes.welcomescene.patch_translations=Αυτή η ενημέρωση κώδικα περιέχει ενημερώσεις μετάφρασης.
scenes.welcomescene.save_warning=Το Pixel Dungeon διακόπηκε πρόσφατα κατά την προσπάθεια αποθήκευσης των δεδομένων του παιχνιδιού σας. Το Pixel Dungeon διαθέτει ενσωματωμένη προστασία από αυτό, επομένως τα δεδομένα του παιχνιδιού σας θα πρέπει να είναι εντάξει.\n\nΑυτό συμβαίνει συνήθως όταν η συσκευή σας διακόπτει ξαφνικά την τροφοδοσία της ή εάν τερματίσει το Pixel Dungeon χωρίς να την αφήσει να κλείσει σωστά. Οι λειτουργίες εξοικονόμησης μπαταρίας μπορούν συχνά να προκαλέσουν αυτό σε κινητές συσκευές. Η επανεκκίνηση της συσκευής σας μπορεί επίσης να βοηθήσει εάν βλέπετε αυτό το σφάλμα συχνά.
scenes.welcomescene.update_intro=Το Pixel Dungeon έχει ενημερωθεί!
scenes.welcomescene.update_msg=Η έκδοση 3.3 περιλαμβάνει μια περιοχή δοκιμών για την επερχόμενη αναθεώρηση της αποστολής πόλης, νέα αντικείμενα και μια σειρά από μικρότερες τροποποιήσεις και βελτιώσεις.
scenes.welcomescene.what_msg=Φαίνεται ότι τα τρέχοντα αποθηκευμένα αρχεία σας προέρχονται από μια μελλοντική έκδοση του Pixel Dungeon!\n\nΠροσέξτε με προσοχή! Τα αποθηκευμένα αρχεία σας ενδέχεται να περιέχουν στοιχεία που δεν υπάρχουν σε αυτήν την έκδοση, κάτι που θα μπορούσε να προκαλέσει κάποια πολύ περίεργα σφάλματα.

scenes.firstpersonview.pointer_free=Κράτα πατημένο το Alt για τον δείκτη
scenes.firstpersonview.pointer_resume=Κάνε κλικ στην προβολή για να κοιτάξεις ξανά γύρω σου
scenes.firstpersonview.controller_look=Δεξιός μοχλός: κοίταγμα. Κράτα το %s για τον δείκτη.
scenes.firstpersonview.controller_cursor=Δεξιός μοχλός: δείκτης. Άφησε το %s για κοίταγμα.
scenes.firstpersonview.unavailable=Αυτή η προβολή δεν είναι διαθέσιμη. Επιστροφή στην κανονική προβολή.
scenes.firstpersonbutton.title=Προβολές κάμερας
scenes.firstpersonbutton.cycle=Πάτησε για εναλλαγή μεταξύ πρώτου προσώπου, τρίτου προσώπου και κανονικής προβολής. Το εικονίδιο δείχνει την επόμενη προβολή.
scenes.firstpersonbutton.mouse_help=Κίνησε το ποντίκι για να κοιτάξεις γύρω σου. Κράτα το Alt για να χρησιμοποιήσεις τον δείκτη στα κουμπιά. Άφησε το Alt για να κοιτάξεις ξανά γύρω σου. Τα μενού απελευθερώνουν αυτόματα τον δείκτη. Αφού βγεις από το παράθυρο, κάνε κλικ μέσα του για να συνεχίσεις να κοιτάζεις· αυτό το κλικ δεν εκτελεί ενέργεια. Το Esc ακυρώνει την επιλογή στόχου.
scenes.firstpersonbutton.controller_help=Αριστερός μοχλός: κίνηση. Δεξιός μοχλός: κοίταγμα. Κράτα το %1$s για τον δείκτη· άφησέ το για να κοιτάξεις ξανά. Επίλεξε με το %2$s. Στα μενού ενεργοποιείται αυτόματα ο δείκτης. Στην εναλλαγή, άφησε τον δεξιό μοχλό να επιστρέψει στο κέντρο.
scenes.firstpersonbutton.visibility=Και οι δύο προβολές δείχνουν μόνο όσα βλέπει ο ήρωάς σου.
