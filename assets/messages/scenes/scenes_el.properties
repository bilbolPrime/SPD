scenes.heroselectscene.daily=Καθημερινή εκτέλεση
scenes.heroselectscene.daily_desc=Κάθε μέρα είναι διαθέσιμο ένα νέο παιχνίδι που είναι το ίδιο για όλους! Αυτό το «καθημερινό τρέξιμο» δημιουργεί το ίδιο μπουντρούμι για κάθε άτομο που το παίζει (αρκεί να παίζουν και την ίδια έκδοση παιχνιδιού).\n\nΜπορείτε να αφιερώσετε όσο χρόνο θέλετε για να ολοκληρώσετε ένα καθημερινό τρέξιμο, αλλά μπορείτε να έχετε μόνο ένα ενεργό κάθε φορά. _Οι καθημερινές διαδρομές δεν είναι επιλέξιμες για εμβλήματα και έχουν τη δική τους ξεχωριστή σελίδα κατάταξης._\n\nΘα θέλατε να ξεκινήσετε το σημερινό καθημερινό τρέξιμο με τον ήρωα και τις προκλήσεις που έχετε επιλέξει αυτήν τη στιγμή;
scenes.heroselectscene.daily_existing=Έχετε ήδη ένα καθημερινό τρέξιμο σε εξέλιξη. Πρέπει να τερματίσετε αυτό το τρέξιμο πριν ξεκινήσετε ένα άλλο καθημερινό τρέξιμο.
scenes.heroselectscene.daily_no=Όχι
scenes.heroselectscene.daily_nowin=Κάθε μέρα είναι διαθέσιμο ένα νέο παιχνίδι που είναι το ίδιο για όλους! Αυτό το «καθημερινό τρέξιμο» δημιουργεί το ίδιο μπουντρούμι για κάθε άτομο που το παίζει (αρκεί να παίζει και την ίδια έκδοση παιχνιδιού).\n\n_Πρέπει να κερδίσετε τουλάχιστον ένα παιχνίδι για να μπορέσετε να παίξετε καθημερινά τρεξίματα._
scenes.heroselectscene.daily_repeat=Έχετε ήδη παίξει το σημερινό καθημερινό παιχνίδι. Μπορείτε να το επαναλάβετε αν θέλετε, αλλά μόνο ως μια μη καταταγμένη προπόνηση.\n\nΑφού ολοκληρώσετε την επανάληψη, θα μπορείτε να την δείτε από το παράθυρο ημερήσιας κατάταξης για μικρό χρονικό διάστημα πριν διαγραφεί το ρεκόρ.\n\nΘα θέλατε να επαναλάβετε το σημερινό καθημερινό παιχνίδι με τον ήρωα και τις προκλήσεις που έχετε επιλέξει αυτήν τη στιγμή;
scenes.heroselectscene.daily_unavailable_long=Φαίνεται ότι έχετε ξεκινήσει μια ημερήσια έκδοση που είναι στο μέλλον! Αυτό μπορεί να συμβεί αν αλλάξατε πρόσφατα ζώνες ώρας ή αν αλλάξατε το ρολόι του συστήματός σας. _Η επόμενη ημερήσια έκδοση θα είναι διαθέσιμη σε %d ημέρες._
