scenes.gamescene.warp=Οι τοίχοι παραμορφώνονται και μετακινούνται γύρω σας!
scenes.heroselectscene.challenges_nowin=Οι προκλήσεις είναι προαιρετικοί τροποποιητές που κάνουν το παιχνίδι πιο δύσκολο. Ορισμένες προκλήσεις κάνουν το μπουντρούμι πιο επικίνδυνο, άλλες μειώνουν τη δύναμη των ικανοτήτων ή των αντικειμένων σας.\n\n_Πρέπει να κερδίσετε τουλάχιστον ένα παιχνίδι πριν μπορέσετε να ενεργοποιήσετε τις προκλήσεις._
scenes.heroselectscene.custom_seed=Προσαρμοσμένος σπόρος
scenes.heroselectscene.custom_seed_clear=Σαφής
scenes.heroselectscene.custom_seed_desc=Το παιχνίδι χρησιμοποιεί έναν κωδικό εκκίνησης για τη δημιουργία μπουντρουμιών, με τον ίδιο κωδικό εκκίνησης και την ίδια έκδοση παιχνιδιού να δημιουργούν πάντα το ίδιο μπουντρουμόνι! _Τα παιχνίδια με προσαρμοσμένο κωδικό εκκίνησης δεν μπορούν να κερδίσουν badges ή να συνεισφέρουν στα παιχνίδια που παίζονται και εμφανίζονται στο κάτω μέρος της σελίδας κατάταξης._
scenes.heroselectscene.custom_seed_duplicate=Έχετε ήδη ένα κανονικό παιχνίδι σε εξέλιξη με αυτό το seed. Πρέπει να τερματίσετε αυτό το παιχνίδι πριν χρησιμοποιήσετε αυτό το προσαρμοσμένο seed.
scenes.heroselectscene.custom_seed_nowin=Το παιχνίδι χρησιμοποιεί έναν κωδικό εκκίνησης για τη δημιουργία μπουντρουμιών, με τον ίδιο κωδικό εκκίνησης και την ίδια έκδοση παιχνιδιού να δημιουργούν πάντα το ίδιο μπουντρουμόνι!\n\n_Πρέπει να κερδίσετε τουλάχιστον ένα παιχνίδι πριν μπορέσετε να συμμετάσχετε σε προσαρμοσμένους κωδικούς εκκίνησης._
