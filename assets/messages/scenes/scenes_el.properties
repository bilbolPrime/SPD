scenes.gamescene.tutorial_ui_desktop=Οι πληροφορίες για τον ήρωα (%1$s) βρίσκονται παρακάτω. Το απόθεμα (%2$s), οι γρήγορες υποδοχές και οι ενέργειες του παιχνιδιού βρίσκονται στα δεξιά. Καλή τύχη!
