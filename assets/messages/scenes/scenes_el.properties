scenes.titlescene$changesbutton.desc=Το Pixel Dungeon ενημερώνεται τακτικά με βελτιώσεις στο υπάρχον περιεχόμενο του παιχνιδιού ή με εντελώς νέο περιεχόμενο!\n\nΗ ισορροπία του παιχνιδιού βελτιώνεται επίσης συχνά στις ενημερώσεις του παιχνιδιού, έτσι ώστε συγκεκριμένα αντικείμενα/ήρωες/εχθροί να μην είναι πολύ δυνατά ή πολύ αδύναμα.\n\nΟι ενημερώσεις περιλαμβάνουν επίσης διορθώσεις για σφάλματα και διάφορες άλλες βελτιώσεις σταθερότητας.
