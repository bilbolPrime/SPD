scenes.titlescene$changesbutton.desc=Pixel Dungeon được cập nhật thường xuyên với những cải tiến cho nội dung trò chơi hiện có, hoặc nội dung hoàn toàn mới!\n\nCân bằng trò chơi cũng được cải thiện thường xuyên trong các bản cập nhật, để các vật phẩm/anh hùng/kẻ thù cụ thể không quá mạnh hoặc quá yếu.\n\nCác bản cập nhật cũng bao gồm sửa lỗi và các cải tiến ổn định khác nhau.
