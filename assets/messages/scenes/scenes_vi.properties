scenes.firstpersonview.pointer_resume=Nhấp vào khung nhìn để tiếp tục nhìn quanh
scenes.firstpersonview.controller_look=Cần phải: nhìn quanh. Giữ %s để dùng con trỏ.
scenes.firstpersonview.controller_cursor=Cần phải: con trỏ. Thả %s để nhìn quanh.
scenes.firstpersonview.unavailable=Không dùng được góc nhìn này. Đã trở về góc nhìn thường.
scenes.firstpersonbutton.title=Góc nhìn
scenes.firstpersonbutton.cycle=Chạm để lần lượt chuyển giữa 2.5D, 2D, góc nhìn thứ nhất và thứ ba. Biểu tượng cho biết góc nhìn tiếp theo.
scenes.firstpersonbutton.mouse_help=Di chuyển chuột để nhìn quanh. Giữ Alt để dùng con trỏ trên các nút. Thả Alt để nhìn quanh trở lại. Menu tự động thả con trỏ. Sau khi rời cửa sổ, nhấp vào bên trong để tiếp tục nhìn quanh; lần nhấp này không thực hiện hành động nào. Esc hủy chọn mục tiêu.
scenes.firstpersonbutton.controller_help=Cần trái: di chuyển. Cần phải: nhìn quanh. Giữ %1$s để dùng con trỏ; thả ra để nhìn quanh trở lại. Dùng %2$s để chọn. Menu tự động chuyển sang con trỏ. Khi chuyển chế độ, thả cần phải về giữa.
scenes.firstpersonbutton.visibility=Góc nhìn thứ nhất và thứ ba chỉ hiển thị những gì nhân vật của bạn nhìn thấy.

tutorial.menu=Hướng dẫn
tutorial.preview=Tập luyện với vai _Chiến binh_ dưới sự hướng dẫn của một huấn luyện viên giàu kinh nghiệm. Học cách di chuyển, chiến đấu, dùng trang bị và kỹ năng, cùng cách hồi phục trước khi vào ngục tối.
tutorial.start=Bắt đầu tập luyện
tutorial.instructor.name=Huấn luyện viên
tutorial.instructor.desc=Một sĩ quan già chuyên huấn luyện lính mới.
tutorial.try=Đã hiểu
tutorial.continue=Tiếp tục
tutorial.retry=Thử lại phòng
tutorial.leave=Rời buổi tập
tutorial.leave_text=Rời buổi tập? Bạn có thể bắt đầu lại từ màn hình chính.
tutorial.stay=Ở lại
tutorial.return=Màn hình chính
tutorial.complete_title=Sẵn sàng vào ngục
tutorial.complete=Thế là đủ. Cứ bình tĩnh, xem xét những gì chưa biết và luôn chừa đường lui. Ngục tối sẽ không nương tay đâu.
tutorial.warning=Rời khỏi ô được đánh dấu!
tutorial.lesson_0.title=Từng bước một
tutorial.lesson_0.text=Chạm vào một ô sàn để đi tới đó. Di chuyển, tấn công và dùng đồ đều tốn thời gian; đọc menu thì không. Chờ sẽ cho qua một lượt. Hãy nói chuyện với tôi nếu cần nhắc lại hoặc muốn thử lại một phòng.
tutorial.lesson_0.goal=Đi ba bước và chờ một lượt.
tutorial.lesson_1.title=Hiểu kẻ địch
tutorial.lesson_1.text=Kiểm tra cả hai con chuột trước khi đến gần. Quái tinh anh có thêm kỹ năng: chạm vào biểu tượng để đọc mô tả. Các biểu tượng nhỏ trên sinh vật cho biết hiệu ứng đang có. Kiểm tra không tốn lượt.
tutorial.lesson_1.goal=Kiểm tra chuột thường và chuột tinh anh.
tutorial.lesson_2.title=Chọn chỗ giao chiến
tutorial.lesson_2.text=Để chuột tiến đến. Đứng đánh ở cửa sẽ ngăn kẻ địch bao vây. Khi những con khác tới, tận dụng lối hẹp để đối phó từng con một.
tutorial.lesson_2.goal=Hạ cả ba con chuột.
tutorial.lesson_3.title=Trang bị vừa sức
tutorial.lesson_3.text=Xem yêu cầu sức mạnh trước khi trang bị. Đồ quá nặng có thể làm bạn chậm lại. Mặc giáp da và dùng cuộn giấy để nhận dạng chiếc nhẫn. Cẩn thận với đồ chưa biết: đồ bị nguyền không thể tháo ra cho tới khi lời nguyền được giải.
tutorial.lesson_3.goal=Mặc giáp da và nhận dạng chiếc nhẫn.
tutorial.lesson_4.title=Kỹ năng đầu tiên
tutorial.lesson_4.text=Mở cây kỹ năng và học %s. Gán vào ô dùng nhanh, kích hoạt rồi đánh trúng chuột. Kỹ năng này tốn năng lượng và cần thời gian hồi. Với kỹ năng yêu cầu mục tiêu, Quay lại sẽ hủy ngắm mà không thi triển.
tutorial.lesson_4.goal=Học %s, gán vào ô dùng nhanh và đánh trúng bằng kỹ năng đó.
tutorial.lesson_5.title=Hồi phục trước khi đánh
tutorial.lesson_5.text=Uống thuốc hồi máu. Máu sẽ hồi trong 10 lượt: phần sáng trên thanh máu là lượng hồi còn đang chờ. Bạn vẫn có thể chết trước khi nhận được nó. Ăn khẩu phần rồi đợi hồi phục. Chỉ nghỉ ở nơi an toàn. Nhịn đói sẽ làm bạn mất máu.
tutorial.lesson_5.goal=Uống thuốc, ăn và chờ hồi máu xong.
tutorial.lesson_6.title=Nhìn đường mà đi
tutorial.lesson_6.text=Kiểm tra cây và bẫy trước khi giẫm lên. Thử bẫy lửa rồi bước xuống nước để dập lửa. Sau đó, chú ý dấu cảnh báo trên sàn và tránh đi trước khi đòn đánh tới.
tutorial.lesson_6.goal=Kiểm tra cả hai mối nguy, dập lửa và tránh đòn được báo trước.
tutorial.lesson_7.title=Lối ra
tutorial.lesson_7.text=Hạ kẻ địch rồi đứng trên ô được đánh dấu cạnh tường. Nhấn giữ nút kiểm tra để tìm cửa bí mật. Đi qua đó, tìm chìa khóa rồi mở lối ra.
tutorial.lesson_7.goal=Hạ cả hai kẻ địch, tìm cửa bí mật và đến cầu thang.
