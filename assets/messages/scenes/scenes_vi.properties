scenes.welcomescene.controller_body=Bạn đang chơi bằng tay cầm? Sử dụng cần điều khiển bên phải để điều khiển con trỏ trên màn hình. Nhấn RT/R2 hoặc cần điều khiển bên phải để chọn bằng con trỏ.
scenes.welcomescene.controller_okay=Đồng ý
scenes.welcomescene.controller_title=Đầu vào bộ điều khiển
scenes.welcomescene.lang_warning_msg=Một số nội dung mới trong bản cập nhật này vẫn chưa được dịch. Một số cụm từ có thể được viết bằng tiếng Anh. Các nhóm dịch thuật đang nỗ lực khắc phục vấn đề này và bản dịch đầy đủ sẽ sớm được cập nhật. Cảm ơn sự kiên nhẫn của bạn.
scenes.welcomescene.lang_warning_title=Bản dịch chưa hoàn chỉnh
scenes.welcomescene.patch_balance=Bản vá này chứa các điều chỉnh về cân bằng trò chơi.
scenes.welcomescene.patch_bugfixes=Bản vá này chứa các bản sửa lỗi.
scenes.welcomescene.patch_intro=Bản vá lỗi của Pixel Dungeon đã được cập nhật!
scenes.welcomescene.patch_msg=Bản vá này cũng bao gồm một số tinh chỉnh nhỏ và cải tiến hiệu năng.
scenes.welcomescene.patch_translations=Bản vá này chứa các bản cập nhật dịch thuật.
scenes.welcomescene.save_warning=Trò chơi Pixel Dungeon đã bị gián đoạn khi cố gắng lưu dữ liệu trò chơi gần đây. Pixel Dungeon có các biện pháp bảo vệ tích hợp chống lại điều này, vì vậy dữ liệu trò chơi của bạn sẽ không bị ảnh hưởng. Lỗi này thường xảy ra khi thiết bị của bạn đột ngột mất điện hoặc nếu nó tắt Pixel Dungeon mà không cho phép ứng dụng đóng đúng cách. Các tính năng tiết kiệm pin thường có thể gây ra điều này trên thiết bị di động. Khởi động lại thiết bị cũng có thể giúp khắc phục nếu bạn thường xuyên gặp lỗi này.
scenes.welcomescene.update_intro=Pixel Dungeon đã được cập nhật!
scenes.welcomescene.update_msg=Phiên bản 3.3 bao gồm khu vực thử nghiệm cho bản cập nhật lớn sắp tới về nhiệm vụ thành phố, các vật phẩm mới và một loạt các tinh chỉnh và cải tiến nhỏ khác.
scenes.welcomescene.what_msg=Có vẻ như file lưu hiện tại của bạn đến từ một phiên bản tương lai của Pixel Dungeon!\n\nT. Hãy đọc cẩn thận! File lưu của bạn có thể chứa những thứ không tồn tại trong phiên bản này, điều này có thể gây ra một số lỗi rất kỳ lạ.

