tutorial.menu=Tutorial
tutorial.preview=Treine como _Guerreiro_ com um instrutor experiente. Aprenda a se mover, lutar, usar equipamentos e habilidades e recuperar vida antes de entrar na masmorra.
tutorial.start=Começar treino
tutorial.instructor.name=Instrutor
tutorial.instructor.desc=Um velho oficial que treina novos aventureiros.
tutorial.try=Entendi
tutorial.continue=Continuar
tutorial.retry=Repetir sala
tutorial.leave=Sair do tutorial
tutorial.leave_text=Sair do treino? Você pode recomeçar pelo menu principal.
tutorial.stay=Ficar
tutorial.return=Menu principal
tutorial.complete_title=Pronto para a masmorra
tutorial.complete=Por enquanto basta. Vá com calma, examine o que não conhece e deixe uma rota de fuga livre. A masmorra não vai pegar leve.
tutorial.warning=Saia do piso marcado!
tutorial.lesson_0.title=Um passo de cada vez
tutorial.lesson_0.text=Toque no chão para andar. Mover, atacar e usar itens leva tempo; ler os menus, não. Esperar faz passar um turno. Fale comigo se precisar de uma dica ou quiser repetir uma sala.
tutorial.lesson_0.goal=Dê três passos e espere um turno.
tutorial.lesson_1.title=Conheça seu inimigo
tutorial.lesson_1.text=Examine os dois ratos antes de se aproximar. Campeões têm habilidades extras: toque nos ícones delas para saber mais. Os pequenos ícones sobre uma criatura mostram os efeitos ativos. Examinar não gasta turnos.
tutorial.lesson_1.goal=Examine o rato comum e o campeão.
tutorial.lesson_2.title=Escolha suas lutas
tutorial.lesson_2.text=Deixe o rato vir até você. Lutar numa porta impede que os inimigos cerquem você. Quando os outros chegarem, use a passagem estreita e enfrente um de cada vez.
tutorial.lesson_2.goal=Derrote os três ratos.
tutorial.lesson_3.title=Equipamento adequado
tutorial.lesson_3.text=Confira a força exigida antes de equipar um item. Equipamento pesado demais pode deixar você mais lento. Vista a armadura de couro e use o pergaminho para identificar o anel. Cuidado com itens desconhecidos: um item amaldiçoado não pode ser retirado até a maldição ser removida.
tutorial.lesson_3.goal=Equipe a armadura de couro e identifique o anel.
tutorial.lesson_4.title=Sua primeira habilidade
tutorial.lesson_4.text=Abra a árvore de habilidades e aprenda %s. Coloque a habilidade num atalho, ative e acerte o rato. Esta habilidade gasta mana e precisa de tempo para recarregar. Nas que pedem um alvo, Voltar cancela a mira sem usar a habilidade.
tutorial.lesson_4.goal=Aprenda %s, coloque num atalho e acerte um golpe.
tutorial.lesson_5.title=Recupere-se antes de lutar
tutorial.lesson_5.text=Beba a poção de cura. Ela recupera vida ao longo de 10 turnos: a parte clara da barra mostra a cura que ainda vai chegar. Você pode morrer antes disso. Coma a ração e espere a cura terminar. Descanse só em lugar seguro. Passar fome tira sua vida aos poucos.
tutorial.lesson_5.goal=Beba a poção, coma e espere a cura terminar.
tutorial.lesson_6.title=Olhe onde pisa
tutorial.lesson_6.text=Examine a planta e a armadilha antes de pisar nelas. Ative a armadilha de fogo e entre na água para apagar as chamas. Depois, observe a marca no chão e saia dali antes do ataque.
tutorial.lesson_6.goal=Examine os dois perigos, apague o fogo e desvie do ataque marcado.
tutorial.lesson_7.title=A saída
tutorial.lesson_7.text=Derrote os inimigos e fique na casa marcada junto à parede. Mantenha o botão de examinar pressionado para procurar uma porta secreta. Passe por ela, encontre a chave e destranque a saída.
tutorial.lesson_7.goal=Derrote os dois inimigos, procure a porta secreta e chegue às escadas.
