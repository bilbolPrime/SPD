scenes.welcomescene.save_warning=O jogo Pixel Dungeon foi interrompido durante a tentativa de guardar os seus dados recentemente. O Pixel Dungeon tem proteções integradas contra este tipo de problemas, pelo que os seus dados de jogo devem estar seguros. Isto acontece normalmente quando o seu dispositivo perde energia repentinamente ou se o Pixel Dungeon é encerrado sem permitir que feche corretamente. As características de poupança de bateria em dispositivos móveis costumam causar este tipo de erro. Reiniciar o dispositivo também pode ajudar se estiver a ver este erro com frequência.
scenes.welcomescene.update_intro=Pixel Dungeon foi atualizado!
scenes.welcomescene.update_msg=A versão 3.3 inclui uma área de testes para a próxima reformulação da missão na cidade, novos itens e uma série de pequenos ajustes e melhorias.
scenes.welcomescene.what_msg=Parece que os teus saves actuais são de uma versão futura do Pixel Dungeon! Cuidado! Os teus saves podem conter itens que não existem nesta versão, o que pode causar erros muito estranhos.

