scenes.firstpersonbutton.title=시점 변경
scenes.firstpersonbutton.cycle=누를 때마다 1인칭, 3인칭, 기본 시점으로 바뀝니다. 아이콘은 다음 시점을 나타냅니다.
scenes.firstpersonbutton.mouse_help=마우스를 움직여 둘러보세요. Alt를 누르고 있으면 커서로 버튼을 조작할 수 있습니다. Alt에서 손을 떼면 다시 시점을 조작합니다. 메뉴에서는 자동으로 커서를 사용할 수 있습니다. 창 밖으로 나갔다가 돌아오면 창 안을 클릭해 시점 조작을 재개하세요. 이 클릭으로는 행동하지 않습니다. Esc를 누르면 대상 선택을 취소합니다.
scenes.firstpersonbutton.controller_help=왼쪽 스틱: 이동. 오른쪽 스틱: 시점 조작. %1$s 버튼을 누르고 있으면 커서를 조작하며, 손을 떼면 다시 시점을 조작합니다. %2$s 버튼으로 선택하세요. 메뉴에서는 자동으로 커서를 사용합니다. 전환할 때는 오른쪽 스틱을 놓아 중앙으로 돌아오게 하세요.
scenes.firstpersonbutton.visibility=두 시점 모두 영웅이 볼 수 있는 곳만 보여 줍니다.
