scenes.welcomescene.patch_bugfixes=이 패치는 버그 수정 사항을 포함합니다.
scenes.welcomescene.patch_intro=Pixel Dungeon에 패치가 적용되었습니다!
scenes.welcomescene.patch_msg=이 패치에는 몇 가지 사소한 수정 사항과 성능 개선 사항도 포함되어 있습니다.
scenes.welcomescene.patch_translations=이 패치에는 번역 업데이트 내용이 포함되어 있습니다.
scenes.welcomescene.save_warning=Pixel Dungeon을 실행하던 중 게임 데이터 저장이 중단되었습니다. Pixel Dungeon에는 이러한 상황을 방지하는 기능이 내장되어 있으므로 게임 데이터는 안전하게 저장될 것입니다. 이 오류는 기기의 전원이 갑자기 꺼지거나 Pixel Dungeon가 제대로 종료되지 않고 강제로 종료될 때 발생합니다. 모바일 기기의 배터리 절약 기능으로 인해 이러한 문제가 발생하는 경우가 많습니다. 이 오류가 자주 발생하는 경우 기기를 재시작하면 문제가 해결될 수 있습니다.
scenes.welcomescene.update_intro=Pixel Dungeon이 업데이트되었습니다!
scenes.welcomescene.update_msg=v3.3에는 곧 출시될 도시 퀘스트 개편을 위한 테스트 영역, 새로운 아이템, 그리고 여러 가지 사소한 수정 및 개선 사항이 포함되어 있습니다.
scenes.welcomescene.what_msg=현재 저장된 파일이 Pixel Dungeon의 미래 버전에서 가져온 것 같습니다! \n\nTread 주의하세요! 저장된 파일에는 이 버전에는 없는 내용이 포함되어 있을 수 있으며, 이로 인해 매우 이상한 오류가 발생할 수 있습니다.

