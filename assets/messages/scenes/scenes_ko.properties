scenes.welcomescene.controller_body=컨트롤러로 플레이하시나요? 화면 커서를 조작하려면 오른쪽 스틱을 사용하세요. RT/R2 버튼이나 오른쪽 스틱을 눌러 커서로 선택하세요.
scenes.welcomescene.controller_okay=좋아요
scenes.welcomescene.controller_title=컨트롤러 입력
scenes.welcomescene.lang_warning_msg=이번 업데이트의 일부 새로운 콘텐츠는 아직 번역되지 않았습니다. 일부 문구는 영어로 작성되어 있을 수 있습니다. 번역팀에서 이 문제를 해결하기 위해 노력하고 있으며, 곧 전체 번역이 적용될 예정입니다. 양해해 주셔서 감사합니다.
