scenes.heroselectscene.daily=데일리 런
scenes.heroselectscene.daily_desc=매일 새로운 게임이 모두에게 똑같이 제공됩니다! 이 '일일 플레이'는 플레이하는 모든 사람에게 동일한 던전을 생성합니다(단, 게임 버전이 동일해야 합니다). 일일 플레이는 원하는 만큼 시간을 들여 완료할 수 있지만, 한 번에 하나만 활성화할 수 있습니다. 일일 플레이는 배지 획득 대상이 아니며, 별도의 순위 페이지가 있습니다. 현재 선택한 영웅과 도전 과제로 오늘의 일일 플레이를 시작하시겠습니까?
scenes.heroselectscene.daily_existing=이미 일일 달리기를 진행 중입니다. 다른 일일 달리기를 시작하기 전에 현재 진행 중인 일일 달리기를 종료해야 합니다.
scenes.heroselectscene.daily_no=아니요
scenes.heroselectscene.daily_nowin=매일 새로운 게임이 제공되며, 모든 플레이어가 동일한 던전을 경험할 수 있습니다! 이 '일일 플레이'는 (동일한 게임 버전을 플레이하는 경우) 모든 플레이어에게 동일한 던전을 생성합니다. 일일 플레이를 이용하려면 최소 한 번의 승리를 거두어야 합니다.
scenes.heroselectscene.daily_repeat=오늘의 일일 퀘스트를 이미 플레이하셨습니다. 원하시면 다시 플레이하실 수 있지만, 랭크전이 아닌 연습 모드로만 플레이 가능합니다. 다시 플레이를 완료하시면, 기록이 삭제되기 전까지 잠시 동안 일일 랭킹 창에서 확인하실 수 있습니다. 현재 선택하신 영웅과 도전 과제로 오늘의 일일 퀘스트를 다시 플레이하시겠습니까?
scenes.heroselectscene.daily_unavailable_long=미래 시점의 일일 퀘스트를 시작하신 것 같습니다! 최근에 시간대를 변경하셨거나 시스템 시계를 변경하신 경우 이러한 현상이 발생할 수 있습니다. 다음 일일 퀘스트는 %d일 후에 이용 가능합니다.
