scenes.heroselectscene.custom_seed_desc=이 게임은 던전 생성에 시드 코드를 사용하며, 동일한 시드와 게임 버전을 사용하면 항상 동일한 던전이 생성됩니다! 사용자 지정 시드를 사용한 게임은 배지를 획득하거나 플레이 횟수에 기여할 수 없으며, 순위 페이지 하단에 표시됩니다.
scenes.heroselectscene.custom_seed_duplicate=이미 해당 시드 값으로 일반 게임을 진행 중입니다. 사용자 지정 시드를 사용하려면 기존 게임을 종료해야 합니다.
scenes.heroselectscene.custom_seed_nowin=이 게임은 던전 생성에 시드 코드를 사용합니다. 동일한 시드와 게임 버전을 사용하면 항상 동일한 던전이 생성됩니다! (예: \n\n) 사용자 지정 시드를 입력하려면 최소 한 번 이상 승리해야 합니다.
