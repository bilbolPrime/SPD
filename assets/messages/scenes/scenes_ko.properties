scenes.heroselectscene.challenges_nowin=도전 과제는 게임 난이도를 높이는 선택적 요소입니다. 어떤 도전 과제는 던전을 더 위험하게 만들고, 어떤 도전 과제는 능력이나 아이템의 위력을 약화시킵니다. 도전 과제를 활성화하려면 최소 한 번 이상 승리해야 합니다.
