scenes.titlescene$changesbutton.desc=Pixel Dungeon wordt regelmatig bijgewerkt met herzieningen van bestaande spelinhoud, of met volledig nieuwe content! De spelbalans wordt ook vaak verbeterd in updates, zodat specifieke items/helden/vijanden niet te sterk of te zwak zijn. Updates bevatten ook oplossingen voor bugs en diverse andere verbeteringen aan de stabiliteit.
