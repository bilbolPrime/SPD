scenes.welcomescene.lang_warning_msg=Een deel van de nieuwe inhoud van deze update is nog niet vertaald. Sommige zinnen zijn mogelijk in het Engels geschreven. De vertaalteams werken eraan om dit op te lossen en een volledige vertaling zal binnenkort beschikbaar zijn. Bedankt voor uw geduld.
scenes.welcomescene.lang_warning_title=Onvolledige vertaling
scenes.welcomescene.patch_balance=Deze patch bevat aanpassingen aan de spelbalans.
scenes.welcomescene.patch_bugfixes=Deze patch bevat bugfixes.
scenes.welcomescene.patch_intro=Pixel Dungeon is gepatcht!
scenes.welcomescene.patch_msg=Deze patch bevat ook enkele kleine aanpassingen en prestatieverbeteringen.
scenes.welcomescene.patch_translations=Deze patch bevat updates voor de vertaling.
scenes.welcomescene.save_warning=Pixel Dungeon is onlangs onderbroken tijdens het opslaan van je spelgegevens. Pixel Dungeon heeft ingebouwde beveiligingen hiertegen, dus je spelgegevens zouden veilig moeten zijn. Dit gebeurt meestal wanneer je apparaat plotseling stroom verliest of wanneer Pixel Dungeon wordt afgesloten zonder correct te worden gesloten. Batterijbesparingsfuncties kunnen dit vaak veroorzaken op mobiele apparaten. Het opnieuw opstarten van je apparaat kan ook helpen als je deze foutmelding regelmatig ziet.
scenes.welcomescene.update_intro=Pixel Dungeon is bijgewerkt!
scenes.welcomescene.update_msg=Versie 3.3 bevat een testomgeving voor de aankomende herziening van de stadsmissie, nieuwe items en een aantal kleinere aanpassingen en verbeteringen.
scenes.welcomescene.what_msg=Het lijkt erop dat je huidige savegames afkomstig zijn van een toekomstige versie van Pixel Dungeon!\n\nWees voorzichtig! Je savegames bevatten mogelijk elementen die niet in deze versie voorkomen, wat tot zeer vreemde fouten kan leiden.

