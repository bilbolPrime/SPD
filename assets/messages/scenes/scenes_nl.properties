scenes.heroselectscene.challenges_nowin=Uitdagingen zijn optionele modifiers die het spel moeilijker maken. Sommige uitdagingen maken de kerker gevaarlijker, andere verminderen de kracht van je vaardigheden of voorwerpen. Je moet minstens één spel winnen voordat je uitdagingen kunt inschakelen.
scenes.heroselectscene.custom_seed=Aangepast zaad
scenes.heroselectscene.custom_seed_clear=Duidelijk
scenes.heroselectscene.custom_seed_desc=Het spel gebruikt een seed-code voor het genereren van dungeons; dezelfde seed en spelversie genereren altijd dezelfde dungeon! _Spellen met een aangepaste seed kunnen geen badges verdienen of meetellen voor het aantal gespeelde spellen, en verschijnen onderaan de ranglijst._
scenes.heroselectscene.custom_seed_duplicate=Je hebt al een regulier spel lopen met die seed. Je moet dat spel eerst beëindigen voordat je die aangepaste seed kunt gebruiken.
scenes.heroselectscene.custom_seed_nowin=Het spel gebruikt een seed-code voor het genereren van dungeons; dezelfde seed en spelversie genereren altijd dezelfde dungeon! \n\n_Je moet minstens één spel winnen voordat je aangepaste seeds kunt invoeren._
