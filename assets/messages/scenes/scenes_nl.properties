scenes.firstpersonbutton.mouse_help=Beweeg de muis om rond te kijken. Houd Alt ingedrukt om de cursor op knoppen te gebruiken. Laat Alt los om weer rond te kijken. Menu's geven de cursor automatisch vrij. Klik na het verlaten van het venster weer erin om verder rond te kijken; die klik voert geen actie uit. Esc annuleert het kiezen van een doel.
scenes.firstpersonbutton.controller_help=Linkerstick: bewegen. Rechterstick: rondkijken. Houd %1$s ingedrukt om de cursor te gebruiken; laat los om weer rond te kijken. Gebruik %2$s om te kiezen. In menu's werkt de cursor automatisch. Laat de rechterstick bij het wisselen terugveren naar het midden.
