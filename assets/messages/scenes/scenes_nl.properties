scenes.heroselectscene.daily=Dagelijkse hardloopronde
scenes.heroselectscene.daily_desc=Elke dag is er een nieuw spel beschikbaar dat voor iedereen hetzelfde is! Deze 'dagelijkse run' genereert dezelfde kerker voor iedereen die meedoet (zolang ze ook dezelfde spelversie spelen). Je kunt er zo lang over doen als je wilt om een dagelijkse run te voltooien, maar je kunt er maar één tegelijk actief hebben. Dagelijkse runs komen niet in aanmerking voor badges en hebben een eigen ranglijstpagina. Wil je de dagelijkse run van vandaag starten met je huidige held en uitdagingen?
scenes.heroselectscene.daily_existing=Je bent al bezig met een dagelijkse hardloopsessie. Je moet die sessie beëindigen voordat je aan een nieuwe kunt beginnen.
scenes.heroselectscene.daily_no=Nee
scenes.heroselectscene.daily_nowin=Elke dag is er een nieuw spel beschikbaar dat voor iedereen hetzelfde is! Deze 'dagelijkse run' genereert dezelfde kerker voor iedereen die meedoet (zolang ze ook dezelfde spelversie spelen). Je moet minstens één spel winnen voordat je de dagelijkse runs kunt spelen.
scenes.heroselectscene.daily_repeat=Je hebt de dagelijkse uitdaging van vandaag al gespeeld. Je kunt hem opnieuw spelen als je wilt, maar alleen als een ongerangschikte oefenronde.\n\nNadat je de herhaling hebt voltooid, kun je deze nog even bekijken in het venster met de dagelijkse ranglijsten voordat de record wordt verwijderd.\n\nWil je de dagelijkse uitdaging van vandaag opnieuw spelen met je huidige held en uitdagingen?
scenes.heroselectscene.daily_unavailable_long=Het lijkt erop dat je een dagelijkse uitdaging bent begonnen die in de toekomst ligt! Dit kan gebeuren als je onlangs van tijdzone bent veranderd of als je de systeemklok hebt aangepast. Je volgende dagelijkse uitdaging is beschikbaar over %d dagen.
