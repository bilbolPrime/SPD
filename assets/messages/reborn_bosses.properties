actors.mobs.rebornboss.opening=Exposed!
actors.mobs.rebornboss.interrupted=%s loses concentration!
actors.mobs.reborngoo.desc=Little known about The Goo. It's quite possible that it is not even a creature, but rather a conglomerate of substances from the sewers that gained rudiments of free will.
actors.mobs.reborngoo.warning=Goo swells. Get out of its path!
actors.mobs.reborndm300.desc=This machine was created by the Dwarves several centuries ago. Later, Dwarves started to replace machines with golems, elementals and even demons. Eventually it led their civilization to the decline. The DM-300 and similar machines were typically used for construction and mining, and in some cases, for city defense.
actors.mobs.reborndm300.repair=DM-300 repairs itself!
actors.mobs.reborndm300.warning=The engine screams. Clear the marked ground!
actors.mobs.rebornking.desc=The last king of dwarves was known for his deep understanding of processes of life and death. He has persuaded members of his court to participate in a ritual, that should have granted them eternal youthfulness. In the end he was the only one, who got it - and an army of undead as a bonus.
actors.mobs.rebornking.warning=The King raises his hand!
actors.mobs.rebornking.herald_fell=Stand your ground, cowards!
actors.mobs.rebornking$retainer.name_0=Royal guard
actors.mobs.rebornking$retainer.desc_0=A dead dwarf in battered armour, still guarding his king.
actors.mobs.rebornking$retainer.name_1=Court caster
actors.mobs.rebornking$retainer.desc_1=A court mage raised from the dead. Dark magic gathers in his hands.
actors.mobs.rebornking$retainer.name_2=Royal herald
actors.mobs.rebornking$retainer.desc_2=Even with a broken jaw, this herald still barks the King's orders. The dead obey.
actors.mobs.rebornking$retainer.name_3=Undead archer
actors.mobs.rebornking$retainer.desc_3=This dwarf was buried with his bow. He hasn't forgotten how to use it.
actors.mobs.rebornyog.desc=Yog-Dzewa is an Old God, a powerful entity from the realms of chaos. A century ago, the ancient dwarves barely won the war against its army of demons, but were unable to kill the god itself. Instead, they then imprisoned it in the halls below their city, believing it to be too weak to rise ever again.
actors.mobs.rebornyog.warning=The air splits. Leave the flickering marks!
actors.mobs.rebornyog.inherit_rot=Flesh withers. I remain.
actors.mobs.rebornyog.inherit_fire=The flame is mine now.
actors.mobs.rebornyog$rotting.desc=A huge fist of rotting flesh. Foul slime seeps between its fingers and stains the stone beneath it.
actors.mobs.rebornyog$rotting.warning=The rotting fist draws back!
actors.mobs.rebornyog$burninghand.desc=A great fist wreathed in fire. Its fingers crackle as they close, shedding embers onto the floor.
actors.mobs.rebornyog$burninghand.warning=Embers gather before the burning fist!
actors.mobs.reborntengu.shadow_broken=My shadow...!
