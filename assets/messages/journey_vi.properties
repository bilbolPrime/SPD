journey.title=Hành trình
journey.intro=Yog đã chiếm được Bùa hộ mệnh, và quân của hắn đang tràn lên mặt đất.\n\nDẫn sáu anh hùng băng qua những vùng đất bị chiếm đóng. Chọn tuyến đường và anh hùng cho mỗi chuyến đi. Người đã ngã xuống sẽ không trở lại trong hành trình này.
