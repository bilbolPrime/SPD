actors.mobs.rebornboss.opening=Вразливий!
actors.mobs.rebornboss.interrupted=%s втрачає зосередженість!
actors.mobs.reborngoo.desc=Про Слиз відомо небагато. Можливо, це навіть не істота, а скупчення речовин зі стоків, у якому зародилася власна воля.
actors.mobs.reborngoo.warning=Гу роздувається. Зійдіть з його шляху!
actors.mobs.reborndm300.desc=Цю машину створили дворфи кілька століть тому. Згодом вони почали замінювати машини големами, елементалями й навіть демонами. Зрештою це призвело до занепаду їхньої цивілізації. DM-300 та подібні машини зазвичай працювали на будівництві й у шахтах, а часом і захищали місто.
actors.mobs.reborndm300.repair=DM-300 ремонтує себе!
actors.mobs.reborndm300.warning=Двигун верещить. Зійдіть із позначених клітин!
actors.mobs.rebornking.desc=Останній король дворфів славився глибокими знаннями про життя і смерть. Він переконав придворних узяти участь у ритуалі, що мав подарувати їм вічну молодість. Зрештою її отримав лише сам король — а на додачу ще й армію невмерлих.
actors.mobs.rebornking.warning=Король піднімає руку!
actors.mobs.rebornking.herald_fell=Тримайте стрій, боягузи!
actors.mobs.rebornking$retainer.name_0=Королівський вартовий
actors.mobs.rebornking$retainer.desc_0=Мертвий дворф у пом'ятих обладунках. Він досі охороняє свого короля.
actors.mobs.rebornking$retainer.name_1=Придворний маг
actors.mobs.rebornking$retainer.desc_1=Придворний маг, піднятий із мертвих. У його руках збирається темна магія.
actors.mobs.rebornking$retainer.name_2=Королівський глашатай
actors.mobs.rebornking$retainer.desc_2=Навіть зі зламаною щелепою цей оповісник вигукує накази Короля. Мертві слухаються.
actors.mobs.rebornking$retainer.name_3=Мертвий лучник
actors.mobs.rebornking$retainer.desc_3=Цього дворфа поховали разом із луком. Він не забув, як ним користуватися.
actors.mobs.rebornyog.desc=Йог-Дзева — Стародавній Бог, могутня сутність зі світу хаосу. Століття тому стародавні гноми ледве виграли війну проти його армії демонів, але не змогли вбити самого бога. Натомість вони ув'язнили його в залах під своїм містом, вважаючи, що він надто слабкий, щоб колись знову повстати.
actors.mobs.rebornyog.warning=Повітря розривається. Зійдіть із мерехтливих позначок!
actors.mobs.rebornyog.inherit_rot=Плоть в'яне. Я залишаюся.
actors.mobs.rebornyog.inherit_fire=Тепер полум'я моє.
actors.mobs.rebornyog$rotting.desc=Величезний кулак із гнилої плоті. Між пальцями сочиться смердючий слиз, бруднячи камінь під ним.
actors.mobs.rebornyog$rotting.warning=Гнилий кулак замахується!
actors.mobs.rebornyog$burninghand.desc=Величезний кулак, охоплений вогнем. Пальці з тріском стискаються, розсипаючи жар по підлозі.
actors.mobs.rebornyog$burninghand.warning=Перед палаючим кулаком збираються жарини!
actors.mobs.reborntengu.shadow_broken=Моя тінь…!
