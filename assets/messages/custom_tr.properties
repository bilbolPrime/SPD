levels.sign.burn=Tabelayı okumaya çalışırken yeşilimsi alevler yükseliyor.
levels.sign.tip_01=Gücünüzü abartmayın, başa çıkabileceğiniz silah ve zırhları kullanın.
levels.sign.tip_05=Yapışkan maddeye dikkat edin!
levels.sign.tip_06=Pixel-Mart - başarılı bir macera için ihtiyacınız olan her şey!
levels.sign.tip_07=İksirlerinizi ve parşömenlerinizi mümkün olan en kısa sürede belirleyin. Onlara gerçekten ihtiyacınız olduğu ana kadar ertelemeyin.
levels.sign.tip_08=Aç olmak acı vermez, ama açlıktan ölmek acı verir.
levels.sign.tip_10=Tengu'nun dışarı çıkmasına izin vermeyin!
levels.sign.tip_11=Pixel-Mart. Para harcayın. Daha uzun yaşayın.
levels.sign.tip_12=Aynı anda birden fazla canavarın saldırısına uğradığınızda, bir kapının arkasına çekilmeye çalışın.
levels.sign.tip_14=Aynı anda birden fazla Ankh'a sahip olmanın bir anlamı yok, çünkü dirildiğinizde onları kaybedeceksiniz.
levels.sign.tip_15=TEHLİKE! Ağır makineler yaralanmaya, uzuv kaybına veya ölüme neden olabilir!
levels.sign.tip_16=Pixel-Mart. Zindanlarda daha güvenli bir yaşam.
levels.sign.tip_17=Büyülü bir silahı yükselttiğinizde, o silahın büyüsünü yok etme olasılığı vardır.
levels.sign.tip_18=Silahlar ve zırhlar asa ve yüzüklerden daha hızlı yıpranır, ancak onları tamir etmenin daha fazla yolu vardır.
levels.sign.tip_19=Yok Etme Parşömeni'ni elde etmenin tek yolu, onu zindan ruhlarından hediye olarak almaktır.
levels.sign.tip_20=Majestelerinin huzurunda silah taşımak yasaktır!
