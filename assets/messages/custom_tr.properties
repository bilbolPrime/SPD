custom.difficulty.easy=Kolay
custom.difficulty.easy.desc=- 2 ekstra erzakla başlayın.\n- 2 iyileştirme iksiriyle başlayın.\n- 200 Altınla başlayın.\n- 2 ruh kristaliyle başlayın.\n- Gizli kapıları ve tuzakları keşfetme bonusu.\n- Canavarlar zayıflar, %25 daha az hasar verir, %10 daha fazla hasar alır ve %15 daha az cana sahip olur.\n- Şampiyon ortaya çıkma oranı %10 olarak ayarlandı.\n- Şampiyon düşme oranı %30 olarak ayarlandı.
custom.difficulty.hard=Zor
custom.difficulty.hard.desc=- İyileştirme iksiri maksimum canın %75'ini iyileştirir. - Canavarlar daha güçlüdür, %10 daha fazla hasar verir, %10 daha az hasar alır ve %20 daha fazla cana sahiptir. - Şampiyon ortaya çıkma oranı %30 olarak ayarlandı. - Şampiyon düşme oranı %50 olarak ayarlandı.
custom.difficulty.hell.desc=- İyileştirme iksiri maksimum canın %50'sini iyileştirir.\n- Canavarlar ölümsüzdür, %35 daha fazla hasar verir, %30 daha az hasar alır ve %45 daha fazla cana sahiptir.\n- Şampiyon ortaya çıkma oranı %50 olarak ayarlandı.\n- Kahraman 4 daha az maksimum canla başlar.\n- Kahraman seviye atladığında 1 daha az maksimum can kazanır.\n- Şampiyon düşme oranı %70 olarak ayarlandı.
custom.difficulty.just_kill_me=Beni öldürün
custom.difficulty.just_kill_me.desc=- İki deneyim iksiriyle başlar. \n- İyileştirme iksiri maksimum canın %10'unu iyileştirir. \n- Canavarlar Tanrı seviyesindedir, %60 daha fazla hasar verir, %40 daha az hasar alır ve %75 daha fazla cana sahiptir. \n- Şampiyon ortaya çıkma oranı %100 olarak ayarlanmıştır. \n- Kahraman 8 daha az maksimum canla başlar. \n- Kahraman seviye atladığında 3 daha az maksimum can kazanır. \n- Şampiyon düşme oranı %100 olarak ayarlanmıştır.
custom.difficulty.nightmare.desc=- İyileştirme iksiri maksimum canın %25'ini iyileştirir.\n- Canavarlar tanrısal güçtedir, %45 daha fazla hasar verir, %30 daha az hasar alır ve %60 daha fazla cana sahiptir.\n- Şampiyon ortaya çıkma oranı %70 olarak ayarlandı.\n- Kahraman 8 daha az maksimum canla başlar.\n- Kahraman seviye atladığında 3 daha az maksimum can kazanır.\n- Şampiyon düşme oranı %90 olarak ayarlandı.
custom.difficulty.normal.desc=- Canavarlar standarttır. \n- Şampiyon ortaya çıkma oranı %20 olarak ayarlandı. \n- Şampiyon düşme oranı %40 olarak ayarlandı.
custom.difficulty.super_easy=Çok Kolay
custom.difficulty.super_easy.desc=- 5 ekstra erzakla başlayın.\n- 5 iyileştirme iksiriyle başlayın.\n- 500 Altınla başlayın.\n- 3 ruh kristaliyle başlayın.\n- Canavarlar çok zayıf, %50 daha az hasar veriyor, %50 daha fazla hasar alıyor ve %50 daha az cana sahip.\n- Şampiyon ortaya çıkma oranı %10 olarak ayarlandı.\n- Şampiyon düşme oranı %10 olarak ayarlandı.
levels.sign.dead_end=Burada ne yapıyorsun?!
levels.sign.tip_02=Zindandaki tüm kapılar ilk bakışta görünmez. Eğer takılıp kalırsanız, gizli kapıları arayın.
levels.sign.tip_03=Unutmayın, daha iyi ekipmanlara erişmenin tek yolu gücünüzü artırmak değil. Tersine, Yükseltme Parşömenleri ile ekipmanın güç gereksinimini düşürebilirsiniz.
levels.sign.tip_04=Zindanın daha derin katlarındaki dükkanlarda altınlarınızı harcayabilirsiniz. İlk dükkan 6. katta bulunuyor.
levels.sign.tip_09=Sürpriz saldırıların başarı şansı daha yüksektir. Örneğin, düşmanınızın yaklaştığını bildiğiniz bir anda kapalı bir kapının arkasında pusu kurabilirsiniz.
levels.sign.tip_13=Eğer yanıyorsanız, havada süzülürken sudaki ateşi söndüremezsiniz.
levels.sign.tip_21=Pixel-Mart. Şeytan avcıları için özel fiyatlar!
