levels.sign.burn=Dum vi provas legi la ŝildon, ĝi eksplodas en verdetajn flamojn.
levels.sign.tip_01=Ne supertaksu vian forton, uzu armilojn kaj kirasojn, kiujn vi povas uzi.
levels.sign.tip_05=Gardu vin de Goo!
levels.sign.tip_06=Pixel-Mart - ĉio, kion vi bezonas por sukcesa aventuro!
levels.sign.tip_07=Identigu viajn pociojn kaj volvlibrojn kiel eble plej baldaŭ. Ne prokrastu ĝin ĝis la momento kiam vi efektive bezonas ilin.
levels.sign.tip_08=Malsati ne doloras, sed malsati ja doloras.
levels.sign.tip_10=Ne ellasu la Tenguojn!
levels.sign.tip_11=Pixel-Mart. Elspezu monon. Vivu pli longe.
levels.sign.tip_12=Kiam vin atakas pluraj monstroj samtempe, provu retiriĝi malantaŭ pordon.
levels.sign.tip_14=Ne havas sencon posedi pli ol unu Ankh-on samtempe, ĉar vi perdos ilin reviviĝinte.
levels.sign.tip_15=DANĜERO! Pezaj maŝinoj povas kaŭzi vundojn, perdon de membroj aŭ morton!
levels.sign.tip_16=Pixel-Mart. Pli sekura vivo en kelkarcero.
levels.sign.tip_17=Kiam vi plibonigas sorĉitan armilon, ekzistas ŝanco detrui tiun sorĉon.
levels.sign.tip_18=Armiloj kaj kirasoj difektiĝas pli rapide ol sorĉbastonoj kaj ringoj, sed ekzistas pli da manieroj ripari ilin.
levels.sign.tip_19=La sola maniero akiri Volvlibron de Viŝado estas ricevi ĝin kiel donacon de la kelkarceraj spiritoj.
levels.sign.tip_20=Neniuj armiloj permesitaj en la ĉeesto de Lia Moŝto!
