items.bags.keyring.info=Jen kupra ŝlosilringo, kiu ebligas al vi teni ĉiujn viajn ŝlosilojn aparte de la ceteraj viaj havaĵoj.
custom.difficulty.easy=Facila
custom.difficulty.easy.desc=- Komencu kun 2 ekstraj porcioj.\n- Komencu kun 2 pocioj de resanigo.\n- Komencu kun 200 Oro.\n- Komencu kun 2 animkristaloj.\n- Bonuso por malkovri kaŝitajn pordojn kaj kaptilojn.\n- Homamasoj estas Malfortaj, kaŭzas 25% malpli da damaĝo, ricevas 10% pli da damaĝo kaj havas 15% malpli da Vivpoentoj.\n- Aperofteco de ĉampionoj agordita al 10%.\n- Falofteco de ĉampionoj agordita al 30%.
custom.difficulty.hard=Malfacila
custom.difficulty.hard.desc=- Pocio de resanigo resanigas 75% de la maksimuma vivpovo. \n - Homamasoj estas fortaj, kaŭzas 10% plian damaĝon, ricevas 10% malpli da damaĝo kaj havas 20% pli da vivpovo. \n - Aperofteco de ĉampionoj agordita al 30%. \n - Falofteco de ĉampionoj agordita al 50%.
custom.difficulty.hell.desc=- Pocio de resanigo resanigas 50% de la maksimuma vivpoentoj.\n- Homamasoj estas senmortaj, kaŭzas 35% pli da damaĝo, ricevas 30% malpli da damaĝo kaj havas 45% pli da vivpoentoj.\n- Aperofteco de ĉampionoj agordita al 50%.\n- Heroo komencas kun 4 malpli da maksimuma vivpoentoj.\n- Heroo gajnas 1 malpli da maksimuma vivpoentoj dum nivelaltigo.\n- Falofteco de ĉampionoj agordita al 70%.
custom.difficulty.just_kill_me=Nur Mortigu Min
custom.difficulty.just_kill_me.desc=- Komenciĝas per du pocioj de sperto.\n- Pocio de resanigo resanigas 10% de maksimuma vivpoentoj.\n- Homamasoj estas diaĵoj, kaŭzas 60% pli da damaĝo, ricevas 40% malpli da damaĝo kaj havas 75% pli da vivpoentoj.\n- Aperofteco de ĉampionoj agordita al 100%.\n- Heroo komenciĝas kun 8 malpli da maksimuma vivpoentoj.\n- Heroo gajnas 3 malpli da maksimuma vivpoentoj dum nivelaltigo.\n- Falofteco de ĉampionoj agordita al 100%.
custom.difficulty.nightmare.desc=- Pocio de resanigo resanigas 25% de maksimuma vivpoentoj.\n- Homamasoj estas diecaj, kaŭzas 45% pli da damaĝo, ricevas 30% malpli da damaĝo kaj havas 60% pli da vivpoentoj.\n- Aperofteco de ĉampionoj agordita al 70%.\n- Heroo komencas kun 8 malpli da maksimuma vivpoentoj.\n- Heroo gajnas 3 malpli da maksimuma vivpoentoj dum nivelaltigo.\n- Falofteco de ĉampionoj agordita al 90%.
custom.difficulty.normal.desc=- Mobs estas normaj.\n- Ĉampiona aperfrekvenco agordita al 20%.\n- Ĉampiona falfrekvenco agordita al 40%.
custom.difficulty.super_easy=Superfacila
custom.difficulty.super_easy.desc=- Komencu kun 5 ekstraj porcioj.\n- Komencu kun 5 pocioj de resanigo.\n- Komencu kun 500 Oro.\n- Komencu kun 3 animkristaloj.\n- Homamasoj estas Mizeraj, kaŭzas 50% malpli da damaĝo, ricevas 50% pli da damaĝo kaj havas 50% malpli da Vivpoentoj.\n- Aperofteco de ĉampionoj agordita al 10%.\n- Falofteco de ĉampionoj agordita al 10%.
levels.sign.dead_end=Kion vi faras ĉi tie?!
levels.sign.tip_02=Ne ĉiuj pordoj en la kelkarcero estas videblaj unuarigarde. Se vi estas blokita, serĉu kaŝitajn pordojn.
levels.sign.tip_03=Memoru, ke pliigi vian forton ne estas la sola maniero por aliri pli bonan ekipaĵon. Vi povas iri laŭ la alia maniero, malaltigante ĝian fortpostulon per Volvlibroj de Plibonigo.
levels.sign.tip_04=Vi povas elspezi vian oron en butikoj sur pli profundaj niveloj de la kelkarcero. La unua estas sur la 6-a nivelo.
levels.sign.tip_09=Surprizatako havas pli bonan ŝancon trafi. Ekzemple, vi povas embuski vian malamikon malantaŭ fermita pordo kiam vi scias, ke ĝi alproksimiĝas.
levels.sign.tip_13=Se vi brulas, vi ne povas estingi la fajron en la akvo dum ŝvebado.
levels.sign.tip_21=Pixel-Mart. Specialaj prezoj por demonĉasistoj!
actors.blobs.waterofawareness.drink_message=Dum vi trinketas, vi sentas la scion flui en vian menson. Nun vi scias ĉion pri viaj ekipitaj objektoj. Ankaŭ vi sentas ĉiujn objektojn sur la nivelo kaj konas ĉiujn iliajn sekretojn.
