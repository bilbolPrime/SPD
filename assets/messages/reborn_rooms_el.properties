levels.rebornsiderooms.leave=Άφησέ το
actors.mobs.npcs.echoreflection.name=το είδωλό σου
actors.mobs.npcs.echoreflection.desc=Ένα χλωμό αντίγραφό σου περιμένει ακίνητο. Θα πολεμήσει μόνο αν το προκαλέσεις. Αν το νικήσεις, κερδίζεις έναν πόντο δεξιοτήτων. Αν φύγεις από το δωμάτιο, η μονομαχία τελειώνει και το είδωλο ανακτά όλη την υγεία του.
actors.mobs.npcs.echoreflection.challenge=Να προκαλέσεις το είδωλό σου; Η νίκη δίνει έναν πόντο δεξιοτήτων. Μπορείς να υποχωρήσεις, αλλά αν φύγεις από το δωμάτιο, το είδωλο θα αναρρώσει.
actors.mobs.npcs.echoreflection.accept=Πρόκληση
actors.mobs.npcs.echoreflection.withdrawn=Το είδωλό σου μένει πάλι ακίνητο.
actors.mobs.npcs.echoreflection.victory=Το είδωλο διαλύεται, αφήνοντας έναν πάπυρο δεξιοτήτων.
actors.mobs.npcs.barbecueking.name=βασιλιάς των αρουραίων
actors.mobs.npcs.barbecueking.desc=Ακόμα κι ένας βασιλιάς πρέπει να φάει. Βρήκε μια ήσυχη γωνιά για να ψήσει το δείπνο του.
actors.mobs.npcs.barbecueking.greeting=Βασιλικές υποθέσεις. Πολύ σημαντικές. Πολύ νόστιμες.
actors.mobs.npcs.barbecueking.stolen=ΕΪ! Αυτό ήταν δικό μου!
actors.mobs.npcs.barbecueking.after=Να σου κάτσει στον λαιμό.
actors.mobs.npcs.forgottenoffering.name=ξεχασμένη προσφορά
actors.mobs.npcs.forgottenoffering.desc=Κάτω από τον κρύσταλλο υπάρχουν μια μερίδα φαγητού και ένα φίλτρο θεραπείας. Διάλεξε ένα· το άλλο θα γίνει σκόνη.
actors.mobs.npcs.watchremains.name=πεσμένος φρουρός
actors.mobs.npcs.watchremains.desc=Τα οστά ενός φρουρού κείτονται δίπλα σε έναν γκρεμισμένο τοίχο. Κάτω από το κράνος του υπάρχει ένα χαρτάκι.
actors.mobs.npcs.watchremains.note=Κράτησα την πόρτα όλη νύχτα. Ήρθαν από τον τοίχο.
