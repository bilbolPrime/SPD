custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=La pergamena sembra più fredda dell'ambiente circostante. Come se fosse un portale verso una dimensione più gelida.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=L'incantesimo su questa pergamena teletrasporta istantaneamente chi lo legge in un luogo casuale del livello del dungeon. Può essere usato per sfuggire a una situazione pericolosa, ma lo sfortunato lettore potrebbe ritrovarsi in un posto ancora più pericoloso.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Questa pergamena contiene energia distruttiva che può essere incanalata psionicamente per infliggere danni ingenti a tutte le creature entro un campo visivo. Un lampo di luce concomitante accecherà temporaneamente tutti coloro che si trovano nell'area d'effetto, incluso chi legge la pergamena.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Questa pergamena è in grado di infondere un'arma o un'armatura con un incantesimo casuale, conferendo loro un potere speciale.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Questa pergamena potenzierà un singolo oggetto, migliorandone la qualità. Una bacchetta aumenterà in potenza e nel numero di cariche; un'arma infliggerà più danni o colpirà il bersaglio più frequentemente; un'armatura respingerà più colpi; l'effetto di un anello su chi lo indossa si intensificherà. Armi e armature richiederanno inoltre meno forza per essere utilizzate e qualsiasi maledizione sull'oggetto verrà rimossa.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=Se letto ad alta voce, questo rotolo scatenerà un ruggito minaccioso che risveglierà tutti i mostri e li avviserà della posizione del lettore.
custom.generated.entry_when_read_words_of_inspiration_will_make_your_re_742e301c64=Una volta lette, le parole di ispirazione ti renderanno pronto al combattimento.
custom.generated.entry_when_read_words_of_wisdom_will_increase_your_ski_7456c5ece5=Leggendo, le parole di saggezza accresceranno le tue capacità.

