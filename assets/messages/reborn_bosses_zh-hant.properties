actors.mobs.rebornboss.opening=破綻！
actors.mobs.rebornboss.interrupted=%s的專注被打斷了！
actors.mobs.reborngoo.desc=人們對黏咕所知甚少。牠或許根本不是生物，而是下水道裡的各種物質聚成一團，漸漸有了些自己的意志。
actors.mobs.reborngoo.warning=黏咕正在膨脹，快避開正面！
actors.mobs.reborndm300.desc=這台機器是矮人在幾個世紀前製造的。後來，矮人開始用魔像、元素生物，甚至惡魔取代機器，最終導致了文明的衰落。DM-300及同類機器通常用於建築和採礦，有時也用於保衛城市。
actors.mobs.reborndm300.repair=DM-300修復了自己！
actors.mobs.reborndm300.warning=引擎發出尖嘯，離開地上的標記！
actors.mobs.rebornking.desc=矮人的末代國王以深諳生死之道聞名。他說服宮廷成員參加一場據說能讓人永保青春的儀式。結果只有他一人如願，還附帶得到了一支亡靈大軍。
actors.mobs.rebornking.warning=國王舉起了手！
actors.mobs.rebornking.herald_fell=守住陣地，懦夫！
actors.mobs.rebornking$retainer.name_0=王室衛兵
actors.mobs.rebornking$retainer.desc_0=一具身披破損盔甲的矮人屍體，死後仍在守衛他的國王。
actors.mobs.rebornking$retainer.name_1=宮廷術士
actors.mobs.rebornking$retainer.desc_1=死而復生的宮廷法師，黑暗魔法正在他手中凝聚。
actors.mobs.rebornking$retainer.name_2=王室傳令官
actors.mobs.rebornking$retainer.desc_2=即使下巴已經碎裂，這名傳令官仍在吼叫著傳達國王的命令。亡者們依然服從。
actors.mobs.rebornking$retainer.name_3=亡靈弓手
actors.mobs.rebornking$retainer.desc_3=這個矮人下葬時帶著他的弓。他還沒忘記該怎麼用。
actors.mobs.rebornyog.desc=尤格-澤瓦是一位古神，來自混沌領域的強大存在。一個世紀前，古老的矮人勉強戰勝了它所率領的惡魔大軍，卻未能將其殺死。於是，矮人們將它囚禁在城下的殿堂之中，認為它已虛弱到無法再次復活。
actors.mobs.rebornyog.warning=空氣正在撕裂，離開閃爍的標記！
actors.mobs.rebornyog.inherit_rot=血肉凋零，我仍長存。
actors.mobs.rebornyog.inherit_fire=火焰如今歸我。
actors.mobs.rebornyog$rotting.desc=一隻腐肉堆成的巨大拳頭。惡臭的黏液從指縫滲出，汙染了下方的石面。
actors.mobs.rebornyog$rotting.warning=腐爛之拳正在蓄力！
actors.mobs.rebornyog$burninghand.desc=一隻裹著烈火的巨拳。手指握緊時劈啪作響，餘燼紛紛落到地上。
actors.mobs.rebornyog$burninghand.warning=餘燼正在燃燒之拳前聚集！
actors.mobs.reborntengu.shadow_broken=我的影子……！
