levels.rebornsiderooms.leave=Nechat být
actors.mobs.npcs.echoreflection.name=tvůj odraz
actors.mobs.npcs.echoreflection.desc=Tvá bledá kopie nehybně čeká. Bojuje jen na vyzvání. Poraz ji a získáš bod dovedností. Odchod z místnosti ukončí souboj a obnoví odrazu veškeré zdraví.
actors.mobs.npcs.echoreflection.challenge=Vyzvat svůj odraz? Vítězství přinese bod dovedností. Můžeš ustoupit, ale odraz se po tvém odchodu z místnosti uzdraví.
actors.mobs.npcs.echoreflection.accept=Vyzvat
actors.mobs.npcs.echoreflection.withdrawn=Tvůj odraz znovu znehybní.
actors.mobs.npcs.echoreflection.victory=Odraz se rozplyne a zanechá svitek dovedností.
actors.mobs.npcs.barbecueking.name=krysí král
actors.mobs.npcs.barbecueking.desc=I král musí jíst. Našel si klidný kout, kde si opéká večeři.
actors.mobs.npcs.barbecueking.greeting=Královské záležitosti. Velmi důležité. Velmi chutné.
actors.mobs.npcs.barbecueking.stolen=HEJ! To bylo moje!
actors.mobs.npcs.barbecueking.after=Snad ti to zaskočí.
actors.mobs.npcs.forgottenoffering.name=zapomenutý dar
actors.mobs.npcs.forgottenoffering.desc=Pod krystalem leží příděl jídla a léčivý lektvar. Vyber si jedno; druhé se obrátí v prach.
actors.mobs.npcs.watchremains.name=padlý strážný
actors.mobs.npcs.watchremains.desc=U proražené zdi leží kosti strážného. Pod přilbou má útržek papíru.
actors.mobs.npcs.watchremains.note=Držel jsem dveře celou noc. Přišli zdí.
