actors.skills.raiseskeletonskill.desc=Přivolá kostlivce, který bude bojovat po vašem boku.
network.partysession.background=Spojení s družinou bylo přerušeno, protože jsi opustil hru.
items.corpse.name=mrtvola
items.corpse.desc=Čerstvá mrtvola použitelná pro nekromancii.
items.armorkit.desc=Tyto nástroje změní libovolné brnění v epické. Zachová si vlastnosti a získá schopnost tvého povolání. Řemeslná zručnost není potřeba.
items.bomb.desc=Malá bomba naplněná černým prachem. Vybuchne tam, kam dopadne.
items.quest.driedrose.desc=Růže už dávno uschla, ale zachovala si všechny okvětní lístky.\n\nVrať to duchovi.
items.quest.phantomfish.desc=Tato malá průsvitná rybka je na vzduchu sotva vidět. Ve vodě je téměř neviditelná.\n\nVrať to duchovi.
items.tomeofmastery.desc=Tenká kniha s opotřebovanou koženou vazbou zřejmě skrývá mnoho vědomostí. Čtení chvíli zabere.\n\nUmožní ti vybrat si podtřídu.
items.weightstone.desc=Umožňuje vyvážit zbraň na blízko pro vyšší rychlost nebo přesnost.
items.wands.wandofamok.desc=Fialové světlo přivede cíl k šílenství. Pak bez rozdílu napadá okolní tvory.
items.wands.wandofavalanche.desc=Zásah do zdi nebo jiné pevné překážky spustí kamenný zával, který zraní a omráčí tvory v okolí.
items.wands.wandofflock.desc=Přivolá stádo kouzelných ovcí, které dočasně zablokuje cestu.
items.wands.wandofpoison.desc=Otráví cíl a způsobuje průběžné zranění. Vylepšení prodlužují působení jedu.
items.wands.wandofreach.desc=Sbírá předměty na dálku a vymění tvou pozici s nepřítelem. Vlna spouští pasti, udusává trávu a otevírá či zavírá dveře na své cestě.
items.wands.wandofslowness.desc=Dočasně sníží rychlost pohybu i útoků cíle na polovinu.
items.wands.wandofteleportation.desc=Přenese tvora na náhodné místo tohoto podlaží.
items.weapon.melee.dualswords.desc=Dvě ostré čepele pro silnější údery.
items.weapon.missiles.cupidarrow.desc=Tento šíp prý patřil Amorovi. Dobře si rozmysli, na koho míříš.
items.weapon.missiles.curaredart.desc=Tyto šipky způsobují malé zranění, ale mohou cíl ochromit a zanechat bezbranný.
items.weapon.missiles.incendiarydart.desc=Hrot uvízne v cíli a směs připevněná k šipce vzplane.
items.weapon.missiles.soulcrystal.desc=Krystal schopný zachytit duši. Hoď ho po slabém nebo oslabeném nepříteli, abys uvěznil jeho ducha.
items.weapon.missiles.tamahawk.desc=Tato vrhací sekera není těžká, ale pro účinné použití potřebuješ sílu.
network.partytext.weapon_fast=Tato zbraň je rychlá.
network.partytext.weapon_slow=Tato zbraň je pomalá.
network.partytext.weapon_accurate=Tato zbraň je přesná.
network.partytext.weapon_inaccurate=Tato zbraň je nepřesná.
network.partytext.weapon_fast_and_accurate=Tato zbraň je rychlá a přesná.
network.partytext.weapon_fast_but_inaccurate=Tato zbraň je rychlá, ale nepřesná.
network.partytext.weapon_slow_but_accurate=Tato zbraň je pomalá, ale přesná.
network.partytext.weapon_slow_and_inaccurate=Tato zbraň je pomalá a nepřesná.
network.partytext.necroblade_bolt=Od úrovně 5 může plně nabitá čepel vyslat _Temnou střelu_, která může zničit podstatu cíle a proměnit ho ve služebníka.
network.partytext.necroblade_intro=Čepel ukovaná temnou magií pohlcuje duše svých obětí a sílí.
network.partytext.necroblade_energy=Uložené duše: _%s/100_
network.partytext.necroblade_damage=Uložené duše přidávají _0–%d poškození_.
network.partytext.necroblade_hungry=Čepel může pohltit plnou zásobu duší a zesílit.
network.partytext.necroblade_full=Čepel se už nemůže vylepšovat pohlcováním duší.
