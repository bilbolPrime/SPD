skills4.smash.intro=以蠻力打擊相鄰敵人。
skills4.endurance.intro=增加最大生命值。
skills4.firm_hand.intro=提高近戰命中率。
skills4.regeneration.intro=隨時間額外恢復生命。飢餓時停止恢復。
skills4.toughness.intro=減少受到的傷害，飢餓傷害除外。
skills4.knockback.intro=打擊敵人並將其擊退一格。無法擊退首領。
skills4.second_wind.intro=立即恢復部分生命。
skills4.sure_footing.intro=縮短纏繞和殘廢的持續時間。
skills4.mastery.intro=讓你能使用更重的近戰武器，並提高攻擊速度。
skills4.parry.intro=減輕下一次受到的近戰傷害。防備最多持續四回合。
skills4.smite.intro=發動沉重一擊，無視目標一半護甲。消耗兩回合。
skills4.riposte.intro=格擋後強化下一次近戰攻擊。效果持續四回合。
skills4.footwork.intro=延長近戰連擊允許的攻擊間隔。
skills4.duelist.intro=僅有一名敵人相鄰時，提高閃避。
skills4.disarming_strike.intro=打擊敵人並使其虛弱三回合。
skills4.find_the_gap.intro=連續命中時，從第三次近戰攻擊起，每次攻擊都會無視目標的部分護甲。
skills4.aggression.intro=生命越低，近戰傷害越高。
skills4.charge.intro=衝向最多四格外的敵人並打擊它。路徑必須暢通。
skills4.rampage.intro=攻擊所有相鄰敵人。
skills4.bloodlust.intro=擊殺敵人後，近戰攻擊加速三回合。
skills4.war_cry.intro=使兩格內可見的敵人虛弱。
skills4.rend.intro=衝鋒和橫掃會使倖存敵人流血。
