skills4.smash.intro=Raakt een aangrenzende vijand met brute kracht.
skills4.endurance.intro=Verhoogt je maximale gezondheid.
skills4.firm_hand.intro=Verbetert je nauwkeurigheid in melee-gevechten.
skills4.regeneration.intro=Herstelt geleidelijk extra gezondheid. Dit stopt als je verhongert.
skills4.toughness.intro=Vermindert inkomende schade, behalve verhongering.
skills4.knockback.intro=Raakt een vijand en duwt hem één tegel terug. Bazen kunnen niet worden geduwd.
skills4.second_wind.intro=Herstelt onmiddellijk een deel van de gezondheid.
skills4.sure_footing.intro=Verkort de duur van vastwortelen en kreupelheid.
skills4.mastery.intro=Je kunt zwaardere slagwapens hanteren en sneller aanvallen.
skills4.parry.intro=Vermindert de schade van de volgende slag die je van dichtbij ontvangt. De bescherming duurt hoogstens vier beurten.
skills4.smite.intro=Levert een zware slag uit die de helft van het pantser van het doelwit negeert. Duurt twee beurten.
skills4.riposte.intro=Versterkt je volgende melee-hit na het blokkeren. Duurt vier beurten.
skills4.footwork.intro=Geeft je meer tijd tussen melee-hits om een ​​combo te behouden.
skills4.duelist.intro=Verhoogt de ontwijking terwijl er precies één vijand naast je staat.
skills4.disarming_strike.intro=Raakt een vijand en verzwakt deze gedurende drie beurten.
skills4.find_the_gap.intro=Je derde opeenvolgende treffer van dichtbij en elke volgende negeren een deel van het pantser van het doelwit.
skills4.aggression.intro=Je melee-schade neemt toe naarmate je gezondheid verliest.
skills4.charge.intro=Stormt op een vijand binnen vier vakjes af en slaat toe. De weg moet vrij zijn.
skills4.rampage.intro=Raakt elke aangrenzende vijand.
skills4.bloodlust.intro=Een gedode vijand versnelt je aanvallen van dichtbij gedurende drie beurten.
skills4.war_cry.intro=Verzwakt zichtbare vijanden binnen twee tegels.
skills4.rend.intro=Stormloop en Razernij laten overlevende vijanden bloeden.
skills4.relentless.intro=Een gedode vijand verkort de resterende hersteltijd van Stormloop en Strijdkreet.
skills4.cornered.intro=Vermindert contactschade die wordt opgelopen terwijl twee of meer vijanden je omsingelen.

skills4.spark.intro=Vuurt een vonk af op een zichtbare vijand.
skills4.spirituality.intro=Verhoogt je maximale mana.
skills4.sorcerer.intro=Je toverstokken richten meer schade aan.
skills4.summon_rat.intro=Roep een rat op om voor je te vechten.
skills4.meditation.intro=Herstel na verloop van tijd extra mana.
