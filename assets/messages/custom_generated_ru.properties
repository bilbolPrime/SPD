custom.generated.entry_the_incantation_on_this_scroll_will_create_illus_03adca31a3=Заклинание на этом свитке создаст иллюзорных двойников читателя, которые будут преследовать его врагов.
custom.generated.entry_the_incantation_on_this_scroll_will_instantly_st_aab7f4028d=Заклинание на этом свитке мгновенно снимет с оружия, доспехов, колец и других предметов, которые носит читатель, любые злые чары, которые могут помешать владельцу снять их.
custom.generated.entry_the_raw_magical_power_bound_up_in_this_parchment_3f69966d11=Необузданная магическая сила, заключенная в этом пергаменте, при высвобождении восстановит полную мощность всех волшебных палочек читателя.
custom.generated.entry_the_scroll_holds_the_secret_of_a_forbidden_ritua_e5cba4d63f=Свиток хранит секрет запретного ритуала. В обмен на благополучие читателя свиток наносит вред всем находящимся поблизости, а сам полностью исцеляет.
custom.generated.entry_the_scroll_seems_colder_than_the_surroundings_as_501b2fc4de=Свиток кажется холоднее, чем окружающая обстановка. Словно это портал в более холодное измерение.
custom.generated.entry_the_spell_on_this_parchment_instantly_transports_58e333e1a3=Заклинание на этом пергаменте мгновенно переносит читателя в случайное место на уровне подземелья. Его можно использовать для выхода из опасной ситуации, но невезучий читатель может оказаться в ещё более опасном месте.
custom.generated.entry_this_scroll_contains_destructive_energy_that_can_041c64b608=Этот свиток содержит разрушительную энергию, которую можно псионически направить на нанесение огромного урона всем существам в поле зрения. Сопутствующая вспышка света временно ослепит всех в зоне действия, включая читателя свитка.
custom.generated.entry_this_scroll_is_able_to_imbue_a_weapon_or_an_armo_5fe337f7bb=Этот свиток позволяет наделить оружие или доспехи случайным зачарованием, дарующим им особую силу.
custom.generated.entry_this_scroll_will_upgrade_a_single_item_improving_726b60e198=Этот свиток улучшит один предмет, повысив его качество. Мощь и количество зарядов волшебной палочки возрастут; оружие будет наносить больше урона или чаще попадать в цель; доспехи будут отражать больше ударов; эффект кольца на его владельца усилится. Для использования оружия и доспехов также потребуется меньше силы, а любые проклятия, наложенные на предмет, будут сняты.
custom.generated.entry_when_read_aloud_this_scroll_will_unleash_a_chall_c2ecf67fcd=При прочтении вслух этот свиток издаст грозный рев, который разбудит всех монстров и сообщит им о местонахождении читающего.
