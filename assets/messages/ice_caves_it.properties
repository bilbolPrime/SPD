items.scrolls.scrolloffrostlevel.name=Pergamena del gelo
items.scrolls.scrolloffrostlevel.desc=Il freddo emana da questa pergamena.\n\nPuoi anche strapparla ovunque per congelare tutti i nemici del piano finché non subiscono danni. I boss e le creature immuni al gelo non ne risentono. Non infligge danni.
items.scrolls.scrolloffrostlevel.ac_tear=Strappa
items.scrolls.scrolloffrostlevel.tear_confirm=Strappando questa pergamena libererai la sua magia, congelando tutti i nemici del piano finché non subiscono danni. I boss e le creature immuni al gelo non ne risentono. Non infligge danni.\n\nStrappare la pergamena?
items.scrolls.scrolloffrostlevel.wrong_place=La pergamena non funziona qui.
items.scrolls.scrolloffrostlevel.spent=Il passaggio è già stato aperto. La pergamena tace.
items.keys.key.ice_depth=Questa chiave appartiene al piano %d delle Grotte di Ghiaccio.
scenes.interlevelscene$mode.frost=Ingresso nelle Grotte di Ghiaccio...
levels.icecaveslevel.water_name=Acqua gelida
levels.icecaveslevel.water_desc=Una sottile crosta di ghiaccio si rompe sotto i piedi.
levels.icecaveslevel.wall_desc=I segni dei picconi scompaiono sotto spesse vene di ghiaccio. I minatori abbandonarono queste gallerie mentre il freddo si diffondeva nella roccia.
levels.cavesbosslevel.collapsed_name=Grotta crollata
levels.cavesbosslevel.collapsed_desc=Una grotta crollata. Non c'è modo di attraversare le macerie.
actors.buffs.frostbite.name=Assideramento
actors.buffs.frostbite.desc=Il freddo rallenta i tuoi movimenti del 20%.
actors.mobs.rimebat.name=Pipistrello brinato
actors.mobs.rimebat.desc=Questi pallidi pipistrelli nidificano sotto il ghiaccio. Il loro morso gelido rallenta brevemente i movimenti, dando loro il tempo di tornare all'attacco.\n\nImmune al congelamento e alla magia del gelo.
actors.mobs.iceclaw.name=Artiglio di ghiaccio
actors.mobs.iceclaw.desc=Uno spazzino con un guscio di ghiaccio compatto. Prima di combattere rinforza brevemente la propria armatura. Il fuoco scioglie questa protezione aggiuntiva.\n\nImmune al congelamento e alla magia del gelo.
actors.mobs.frostback.name=Gnoll dorsogelo
actors.mobs.frostback.desc=Questo gnoll sopravvive al freddo derubando chiunque si avventuri qui. Quando alza l'arma, spostati: il colpo pesante cadrà dove ti trovavi.\n\nImmune al congelamento e alla magia del gelo.
actors.mobs.shardling.name=Scheggia vivente
actors.mobs.shardling.desc=Un irrequieto groviglio di cristalli di ghiaccio. Prende la mira prima di sparare schegge in linea retta. I muri fermano la raffica.\n\nImmune al congelamento e alla magia del gelo.
actors.mobs.hollowminer.name=Minatore vuoto
actors.mobs.hollowminer.desc=Questo minatore non è mai uscito dalle gallerie gelate. La sua lanterna brucia ancora, sebbene lui sia morto da tempo. Se riesce ad alzarla, richiama in battaglia le creature vicine. Un colpo interrompe il segnale.\n\nImmune al congelamento e alla magia del gelo.
actors.mobs.rimehorn.name=Cornobrina
actors.mobs.rimehorn.desc=Una bestia massiccia con la pelliccia incrostata di brina. Raspa il terreno prima di caricare in linea retta. Togliti dalla traiettoria mentre si prepara.\n\nImmune al congelamento e alla magia del gelo.
actors.mobs.oldrime.name=Vecchio Gelo
actors.mobs.oldrime.desc=I minatori trovarono Vecchio Gelo sotto la montagna, sepolto in un ghiaccio più antico dei loro tunnel. I picconi lo svegliarono. Ora custodisce le gallerie gelate e il passaggio oltre di esse. La sua armatura si spezza quando si indebolisce, liberandogli gli arti. Fai attenzione ai colpi pesanti, al ghiaccio che spunta dal pavimento e al suo alito gelido.\n\nImmune al congelamento e alla magia del gelo.
actors.mobs.oldrime.warning=Vecchio Gelo si prepara a colpire!
windows.wndjournal.ice_depth=Ghiaccio %d
levels.icebosslevel.exit_name=Passaggio nella grotta
levels.icebosslevel.exit_desc=Uno stretto passaggio si addentra nella montagna.
levels.icebosslevel.blocked_name=Passaggio congelato
levels.icebosslevel.blocked_desc=Un muro di ghiaccio blocca il passaggio dietro Vecchio Gelo.
items.weapon.ice.wrong_hero=Quest'arma non fa per te.
items.weapon.ice.already_enchanted=Quest'arma è già incantata.
items.weapon.ice.glaciercleaver.name=Mannaia del ghiacciaio
items.weapon.ice.glaciercleaver.desc=Una larga lama ricavata dal ghiaccio di Vecchio Gelo. Un colpo ricopre il bersaglio di brina per quattro turni. Il colpo successivo di una Mannaia del ghiacciaio la frantuma, infliggendo %d danni aggiuntivi. Solo un Guerriero può impugnarla.
actors.buffs.frostcoating.name=Coperto di brina
actors.buffs.frostcoating.desc=Un sottile strato di brina ricopre questa creatura. Un colpo di Mannaia del ghiacciaio lo frantumerà.
items.weapon.ice.hoarfroststaff.name=Bastone della galaverna
items.weapon.ice.hoarfroststaff.desc=Il freddo si raccoglie tra le punte di questo bastone. I suoi dardi infliggono %d-%d danni prima dei bonus delle abilità e rallentano movimenti e attacchi per due turni. Inizialmente contiene tre cariche e si ricarica come una bacchetta. Solo un Mago può impugnarlo.
items.weapon.ice.rimepick.name=Piccozza di brina
items.weapon.ice.rimepick.desc=Questa stretta piccozza trova i varchi nell'armatura. Ignora un quarto dell'armatura del bersaglio, o la metà se lo coglie di sorpresa. Solo un Ladro può impugnarla.
items.weapon.ice.frostbow.name=Arco del gelo
items.weapon.ice.frostbow.desc=Le frecce di quest'arco esplodono in ghiaccio tagliente all'impatto. Infliggono il %d%% di danni in più al bersaglio e un quarto dei danni del colpo ai nemici adiacenti. Le schegge non congelano le vittime. Solo una Cacciatrice può impugnarlo.
items.weapon.ice.gravefrostscythe.name=Falce del gelo sepolcrale
items.weapon.ice.gravefrostscythe.desc=La brina ricopre il manico rivestito d'ossa di questa falce. Mentre è equipaggiata, i tuoi scheletri e fantasmi evocati infliggono %d danni da freddo aggiuntivi a colpo. Solo un Negromante può impugnarla.
items.weapon.ice.frostbiterifle.name=Fucile dell'assideramento
items.weapon.ice.frostbiterifle.desc=La camera di questo fucile è rivestita di ghiaccio che non si scioglie mai. Ogni colpo a segno provoca assideramento per due turni, rallentando i movimenti del 20%. I colpi successivi rinnovano l'effetto. Solo un Mercenario può impugnarlo.
library.ice_weapon_drop=Cade un'arma per ogni eroe, adatta alla sua classe.

actors.mobs.npcs.prospector.name=Cercatore bloccato
actors.mobs.npcs.prospector.desc=Un cercatore con un cappotto rattoppato si ripara vicino alle scale. La sua lampada sta per spegnersi.
actors.mobs.npcs.prospector.torches=La mia lampada non durerà ancora molto. Fuggendo ho lasciato una cassa di provviste su questo piano. Mi porteresti _tre torce_ da lì?
actors.mobs.npcs.prospector.iceclaws=Gli artigli di ghiaccio mi hanno cacciato dalla galleria. Uccidine _tre su questo piano_, così potrò tornare al lavoro.
actors.mobs.npcs.prospector.accept=Ti aiuterò.
actors.mobs.npcs.prospector.later=Non ora.
actors.mobs.npcs.prospector.need_torches=Mi servono _tre torce_. La cassa è ancora da qualche parte su questo piano.
actors.mobs.npcs.prospector.claws_left=Artigli di ghiaccio da uccidere: _%d_.
actors.mobs.npcs.prospector.reward=Bel lavoro. Cosa preferisci?
actors.mobs.npcs.prospector.rations=Due razioni di cibo
actors.mobs.npcs.prospector.thanks=Un pensiero in meno. Grazie.
library.quest.prospector_torches.name=Una lampada agli sgoccioli
library.quest.prospector_torches.desc=Porta tre torce al cercatore bloccato. Una cassa sul suo piano ne contiene abbastanza.
library.quest.prospector_iceclaws.name=Artigli nella galleria
library.quest.prospector_iceclaws.desc=Uccidi tre artigli di ghiaccio sul piano del cercatore, poi torna da lui.
library.quest.prospector.reward=Scegli una pergamena di potenziamento o due razioni di cibo.
items.scrolls.scrolloffrostlevel.read_confirm=Mentre leggi, senti che stai per essere teletrasportato.
