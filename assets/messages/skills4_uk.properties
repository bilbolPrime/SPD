skills4.smash.intro=Б'є сусіднього ворога грубою силою.
skills4.endurance.intro=Підвищує ваше максимальне здоров'я.
skills4.firm_hand.intro=Покращує вашу точність у ближньому бою.
skills4.regeneration.intro=Поступово відновлює додаткове здоров'я. Не діє під час голодування.
skills4.toughness.intro=Зменшує вхідну шкоду, за винятком голоду.
skills4.knockback.intro=Б'є ворога та відкидає його на одну клітинку. Не діє на босів.
skills4.second_wind.intro=Негайно відновлює певну кількість здоров'я.
skills4.sure_footing.intro=Скорочує тривалість обплутування та каліцтва.
skills4.mastery.intro=Дозволяє користуватися важчою зброєю ближнього бою й атакувати швидше.
skills4.parry.intro=Зменшує шкоду від наступного отриманого удару в ближньому бою. Захист діє до чотирьох ходів.
skills4.smite.intro=Завдає важкого удару, ігноруючи половину броні цілі. Займає два ходи.
skills4.riposte.intro=Посилює ваш наступний удар ближнього бою після блокування. Триває чотири ходи.
skills4.footwork.intro=Дає вам більше часу між ударами ближнього бою для підтримки комбо.
skills4.duelist.intro=Збільшує ухилення, коли поруч з вами стоїть рівно один ворог.
skills4.disarming_strike.intro=Вражає ворога та послаблює його на три ходи.
skills4.find_the_gap.intro=Третій поспіль удар у ближньому бою та кожен наступний пробивають частину броні цілі.
skills4.aggression.intro=Ваша шкода в ближньому бою зростає, коли ви втрачаєте здоров’я.
skills4.charge.intro=Кидається до ворога на відстані до чотирьох клітинок і б'є його. Шлях має бути вільним.
skills4.rampage.intro=Вражає кожного сусіднього ворога.
skills4.bloodlust.intro=Прискорює атаки ближнього бою на три ходи після вбивства.
skills4.war_cry.intro=Послаблює видимих ​​ворогів у межах двох клітинок.
skills4.rend.intro=Натиск і Буйство спричиняють кровотечу у ворогів, що вижили.
skills4.relentless.intro=Вбивство ворога скорочує час відновлення Натиску та Бойового кличу.
skills4.cornered.intro=Зменшує пошкодження в ближньому бою, коли вас оточують двоє чи більше ворогів.

skills4.spark.intro=Випускає іскру у видимого ворога.
skills4.spirituality.intro=Збільшує вашу максимальну ману.
skills4.sorcerer.intro=Ваші палички завдають більше шкоди.
skills4.summon_rat.intro=Покличте щура битися за вас.
skills4.meditation.intro=Поступово відновлює додаткову ману.
skills4.spirit_armor.intro=Поглинає шкоду, витрачаючи одиницю мани за кожну одиницю поглинутої шкоди.
skills4.wizard.intro=Ваші палички заряджаються швидше.
skills4.channeling.intro=Скорочує час відновлення активних умінь мінімум до одного ходу.
skills4.charged_staff.intro=Удари жезлом у ближньому бою відновлюють ману.
skills4.arcane_ward.intro=Зменшує шкоду від наступного отриманого удару в ближньому бою. Захист діє до чотирьох ходів.
skills4.arcane_strike.intro=Завдає магічний удар, який ігнорує половину броні цілі.
skills4.conductive.intro=Заряди жезла посилюють удари в ближньому бою. Кожне влучання витрачає один заряд замість перезаряджання жезла.
skills4.discharge.intro=Пошкоджує всіх сусідніх ворогів спалахом магії.
skills4.spellweave.intro=Збільшує шкоду чарівною паличкою на три ходи після удару в ближньому бою.
skills4.drain_life.intro=Наносить шкоду ворогу та зцілює вас на половину втраченого здоров’я.
skills4.rabid_minions.intro=Ваші викликані істоти завдають більше шкоди.
skills4.summon_skeleton.intro=Викличте скелета, щоб боротися за вас.
skills4.soul_hunger.intro=Відновлює ману, коли ви вбиваєте ворога.
skills4.enrage.intro=Поки навичка активна, викликані істоти завдають і отримують більше шкоди.
skills4.slow.intro=Уповільнюйте рух і атаки ворога.
skills4.summoner.intro=Ви можете залишити ще одну викликану істоту.
skills4.dark_pact.intro=Жертвує п'ятьма здоров'ями, щоб відновити ману. Потрібно щонайменше шість здоров'я.

skills4.double_strike.intro=Удар двічі поспіль.
skills4.stealth.intro=Ворогам важче вас помітити.
skills4.evasion.intro=Покращує ваш шанс ухилятися від атак.
skills4.smoke_bomb.intro=Зникнути в хмарі диму. Атака порушує ефект.
skills4.bandit.intro=Знайдіть додаткове золото в кожній зібраній купі.
skills4.venom.intro=Поки навичка активна, удари в ближньому бою можуть отруїти ціль.
skills4.locksmith.intro=Ви маєте шанс знешкодити пастку, коли наступите на неї.
skills4.light_step.intro=Скорочує тривалість обплутування та каліцтва.
skills4.dash.intro=Переміщує до двох клітинок уздовж вільного шляху.
skills4.haste.intro=Збільшує вашу швидкість руху на п'ять ходів.
skills4.shadow_clone.intro=Створіть одного сильного клона або трьох слабших клонів, щоб боротися за вас.
skills4.escape.intro=Звільняє від коренів і каліцтва та підвищує ухилення на чотири ходи.
skills4.trailblazer.intro=Збільшує вашу швидкість руху.
skills4.skirmish.intro=Переміщення посилює ваш наступний удар ближнього бою.
skills4.keep_distance.intro=Збільшує ухилення від ворогів, віддалених більше ніж на один тайл.
skills4.ambush.intro=Під час невидимості збільшує шкоду ближнього бою.
skills4.scorpion.intro=Ваша отрута завдає більше шкоди.
skills4.silent_death.intro=Атаки ближнього бою можуть наповал вбити сплячих ворогів. Боси мають імунітет.
skills4.expose.intro=Ваші удари ближнього бою ігнорують деякі обладунки.
skills4.execution.intro=Збільшує шкоду ворогам, здоров'я яких становить менше однієї чверті.
skills4.deadly_throw.intro=Збільшує шкоди від зброї дальньої дії.

skills4.accuracy.intro=Ваші дистанційні атаки точніші.
skills4.awareness.intro=У вас є шанс ухилитися від наступаючої дистанційної атаки.
skills4.double_shot.intro=Випускає дві стріли поспіль. Витрачає дві звичайні стріли.
skills4.hunting.intro=Під час дослідження знаходить сире м’ясо.
skills4.fletching.intro=Під час дослідження створює звичайні стріли.
skills4.ko_arrow.intro=Ваша наступна стріла уповільнює свою ціль і може її заснути.
skills4.woodcraft.intro=Робить вас важче помітити ворогам.
skills4.quickdraw.intro=Прискорює ваші дистанційні атаки.
skills4.barkskin.intro=Збільшує вашу броню.
skills4.nature_mend.intro=Негайно відновлює певну кількість здоров'я.
skills4.entangle.intro=Вкорінює видимого ворога на місці.
skills4.herbalist.intro=Зменшує пошкодження отрутою.
skills4.dew_keeper.intro=Збільшує зцілення, отримане від роси.
skills4.knee_shot.intro=Ваші стріли можуть покалічити ціль.
skills4.thicket.intro=Зменшує шкоду від наступного отриманого удару в ближньому бою. Захист діє до чотирьох ходів.
