skills4.intimidate.intro=Лякає видимого ворога. Боси мають імунітет.
skills4.wanted.intro=Заробляйте золото за кожного вбитого ворога.
skills4.no_witnesses.intro=Ваш наступний постріл завдає більше шкоди та змушує вцілілих ворогів тікати.
