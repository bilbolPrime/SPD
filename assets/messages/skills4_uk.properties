skills4.field_medicine.intro=Негайно відновлює певну кількість здоров'я.
skills4.powder.intro=Збільшує шкоду від вогнепальної зброї.
skills4.steady_nerves.intro=Скорочує тривалість обплутування та каліцтва.
skills4.volley.intro=Зробіть сильніший постріл.
skills4.rally.intro=Лікує вас і союзників у межах двох клітинок.
skills4.guard_order.intro=Найманці під вашим командуванням отримують менше шкоди.
