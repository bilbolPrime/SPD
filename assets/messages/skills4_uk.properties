skills4.subclass.gladiator=Успішні удари ближнього бою створюють комбо, додаючи шкоди наступним ударам.\n\n_+3 точність ближнього бою_\n_10% швидші атаки ближнього бою_
skills4.subclass.berserker=Коли здоров'я нижче 40%, лють підвищує шкоду на 50%.\n\n_На 10% більше шкоди в ближньому бою_\n_На 10% менше отриманої шкоди_
skills4.subclass.battlemage=Удари жезлом у ближньому бою відновлюють один заряд і додають кількість зарядів до шкоди.\n\n_Іскра з імовірністю 50% засліплює ціль на 3 ходи._
skills4.subclass.warlock=Вбивство ворогів відновлює здоров’я та втамовує голод.\n\n_Іскра завдає 5 додаткових ушкоджень._\n_Одна додаткова викликана істота._
skills4.subclass.freerunner=Без надто важкого спорядження та поки не голодуєш, рухаєшся на 60% швидше. Під час руху ухилення подвоюється.
skills4.subclass.assassin=Раптові атаки завдають додаткової шкоди.\n\n_+1 скритність_
skills4.subclass.warden=Витоптування високої трави дає Дубову шкіру. Рослини можуть залишити додаткове насіння та росу.
skills4.subclass.sniper=Дальні атаки ігнорують броню та позначають ціль, прискорюючи наступну атаку.\n\n_На 20% більше шкоди на відстані_
skills4.subclass.spirit_binder=Удари жезлом у ближньому бою відновлюють один заряд і додають кількість зарядів до шкоди.\n\n_Оживлені скелети існують удвічі довше._
skills4.subclass.lich=Вбивство ворогів відновлює здоров’я та втамовує голод.\n\n_Підняті скелети та скелети-лучники мають на 25% більше здоров’я і завдають на 25% більше шкоди._\n_Одна додаткова викликана істота._
skills4.subclass.marshal=Успішні удари ближнього бою створюють комбо.\n\n_+5 боєприпасів_\n_+1 точність_
skills4.subclass.executioner=Коли здоров'я нижче 40%, Лють підвищує шкоду на 50% і пришвидшує стрільбу на 50%.\n\n_Перезаряджання швидше на 25%_
skills4.spark.warlock=чаклун: +5 шкоди.
skills4.spark.battlemage=бойовий маг: 50% шанс осліпнути на 3 ходу.
