journey.title=Reise
journey.intro=Yog hat das Amulett an sich gerissen, und seine Truppen erreichen bereits die Oberfläche.\n\nFühre sechs Helden durch die besetzten Gebiete. Wähle für jeden Einsatz einen Weg und einen Helden. Gefallene Helden kehren auf dieser Reise nicht zurück.
