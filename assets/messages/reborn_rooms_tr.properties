levels.rebornsiderooms.leave=Bırak
actors.mobs.npcs.echoreflection.name=yansıman
actors.mobs.npcs.echoreflection.desc=Solgun bir kopyan hareketsiz bekliyor. Yalnızca meydan okursan savaşır. Onu yenmek bir yetenek puanı kazandırır. Odadan çıkarsan düello biter ve yansıma tamamen iyileşir.
actors.mobs.npcs.echoreflection.challenge=Yansımana meydan oku? Zafer bir yetenek puanı kazandırır. Geri çekilebilirsin ama odadan çıkarsan yansıma iyileşir.
actors.mobs.npcs.echoreflection.accept=Meydan oku
actors.mobs.npcs.echoreflection.withdrawn=Yansıman yeniden hareketsiz kalıyor.
actors.mobs.npcs.echoreflection.victory=Yansıma dağılıyor, geriye bir yetenek parşömeni kalıyor.
actors.mobs.npcs.barbecueking.name=fare kral
actors.mobs.npcs.barbecueking.desc=Kralların da yemek yemesi gerekir. Akşam yemeğini pişirmek için sakin bir köşe bulmuş.
actors.mobs.npcs.barbecueking.greeting=Kraliyet işleri. Çok önemli. Çok lezzetli.
actors.mobs.npcs.barbecueking.stolen=HEY! O benimdi!
actors.mobs.npcs.barbecueking.after=Umarım boğazında kalır.
actors.mobs.npcs.forgottenoffering.name=unutulmuş adak
actors.mobs.npcs.forgottenoffering.desc=Kristalin altında bir erzak ve bir iyileştirme iksiri var. Birini seç; diğeri toza dönüşecek.
actors.mobs.npcs.watchremains.name=düşmüş nöbetçi
actors.mobs.npcs.watchremains.desc=Yıkılmış duvarın yanında bir nöbetçinin kemikleri yatıyor. Miğferinin altına bir kâğıt sıkıştırılmış.
actors.mobs.npcs.watchremains.note=Bütün gece kapıyı tuttum. Duvardan geldiler.
