skills4.max_rank=Μέγιστο επίπεδο: %d
skills4.equipment_locked=Κάλυψε τις παρακάτω προϋποθέσεις για να χρησιμοποιήσεις τη δεξιότητα που δίνει ο εξοπλισμός σου.
skills4.at_cap=Το μέγιστο επίπεδο έχει ήδη επιτευχθεί με τον εξοπλισμό.
