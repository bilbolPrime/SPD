attributes.tree_skills.name=Εκπαίδευση κλάδου
attributes.tree_skills.desc=Ενισχύει τις μαθημένες δεξιότητες στο δέντρο της αναφερόμενης υποκλάσης. Δεν διδάσκει δεξιότητες ούτε καλύπτει τις προϋποθέσεις τους. Ο εξοπλισμός δεν μπορεί να ανεβάσει μια δεξιότητα πάνω από το μέγιστο επίπεδό της.
