skills4.smash.intro=Χτυπά έναν παρακείμενο εχθρό με ωμή δύναμη.
skills4.endurance.intro=Αυξάνει τη μέγιστη υγεία σας.
skills4.firm_hand.intro=Βελτιώνει την ακρίβειά σας στη μάχη σώμα με σώμα.
skills4.regeneration.intro=Αναπληρώνει επιπλέον υγεία με τον χρόνο. Σταματά όταν λιμοκτονείς.
skills4.toughness.intro=Μειώνει τη ζημιά που δέχεσαι, εκτός από τη ζημιά της λιμοκτονίας.
skills4.knockback.intro=Χτυπά έναν εχθρό και τον σπρώχνει ένα τετράγωνο πίσω. Δεν μετακινεί τα αφεντικά.
skills4.second_wind.intro=Αποκαθιστά αμέσως κάποια υγεία.
skills4.sure_footing.intro=Μειώνει τη διάρκεια της ακινητοποίησης από ρίζες και του τραυματισμού που επιβραδύνει την κίνηση.
skills4.mastery.intro=Αυξάνει το επίπεδο ισχύος του όπλου σου και την ταχύτητα επίθεσης.
skills4.parry.intro=Μειώνει τη ζημιά από το επόμενο χτύπημα που θα δεχτείς από κοντά. Η προστασία διαρκεί έως τέσσερις γύρους.
skills4.smite.intro=Καταφέρνει βαρύ χτύπημα που αγνοεί τη μισή πανοπλία του στόχου. Απαιτεί δύο γύρους.
skills4.riposte.intro=Ενισχύει το επόμενο χτύπημα από κοντά αφού αποκρούσεις επίθεση. Διαρκεί τέσσερις γύρους.
skills4.footwork.intro=Σας δίνει περισσότερο χρόνο ανάμεσα στα χτυπήματα σώμα με σώμα για να διατηρήσετε έναν συνδυασμό.
skills4.duelist.intro=Αυξάνει την αποφυγή όταν υπάρχει ακριβώς ένας εχθρός δίπλα σου.
skills4.disarming_strike.intro=Χτυπά έναν εχθρό και τον αποδυναμώνει για τρεις γύρους.
skills4.find_the_gap.intro=Από το τρίτο συνεχόμενο χτύπημα σώμα με σώμα και μετά, αγνοείς μέρος της πανοπλίας του στόχου.
skills4.aggression.intro=Η ζημιά σας από τη μάχη σώμα με σώμα αυξάνεται καθώς χάνετε την υγεία σας.
skills4.charge.intro=Ορμάς σε εχθρό έως τέσσερα τετράγωνα μακριά και τον χτυπάς. Χρειάζεται ελεύθερη διαδρομή.
skills4.rampage.intro=Κτυπά κάθε διπλανό εχθρό.
skills4.bloodlust.intro=Αφού σκοτώσεις εχθρό, οι επιθέσεις από κοντά γίνονται ταχύτερες για τρεις γύρους.
skills4.war_cry.intro=Αποδυναμώνει τους ορατούς εχθρούς σε απόσταση έως δύο τετραγώνων.
skills4.rend.intro=Η Έφοδος και η Μανία προκαλούν αιμορραγία στους εχθρούς που επιζούν.
skills4.relentless.intro=Κάθε εχθρός που σκοτώνεις μειώνει τον χρόνο αναμονής της Εφόδου και της Πολεμικής κραυγής.
skills4.cornered.intro=Δέχεσαι λιγότερη ζημιά από κοντά όταν σε περικυκλώνουν τουλάχιστον δύο εχθροί.

skills4.spark.intro=Εκτοξεύει μια σπίθα σε έναν ορατό εχθρό.
skills4.spirituality.intro=Αυξάνει το μέγιστο μάνα σου.
skills4.sorcerer.intro=Τα ραβδιά σας προκαλούν μεγαλύτερη ζημιά.
skills4.summon_rat.intro=Καλεί έναν αρουραίο που πολεμά στο πλευρό σου.
skills4.meditation.intro=Αναπληρώνει επιπλέον μάνα με τον χρόνο.
skills4.spirit_armor.intro=Απορροφά ζημιά, καταναλώνοντας ένα μάνα για κάθε μονάδα ζημιάς που απορροφά.
skills4.wizard.intro=Τα ραβδιά σας επαναφορτίζονται πιο γρήγορα.
skills4.channeling.intro=Μειώνει τον χρόνο αναμονής των ενεργών δεξιοτήτων, με ελάχιστο τον έναν γύρο.
skills4.charged_staff.intro=Τα εύστοχα χτυπήματα με το ραβδί από κοντά αναπληρώνουν μάνα.
skills4.arcane_ward.intro=Μειώνει τη ζημιά από το επόμενο χτύπημα που θα δεχτείς από κοντά. Η προστασία διαρκεί έως τέσσερις γύρους.
skills4.arcane_strike.intro=Προσφέρει ένα μαγικό χτύπημα που αγνοεί τη μισή πανοπλία του στόχου.
skills4.conductive.intro=Οι αποθηκευμένες φορτίσεις ενισχύουν τα χτυπήματα με το ραβδί από κοντά. Κάθε επιτυχημένο χτύπημα καταναλώνει μία φόρτιση αντί να επαναφορτίζει το ραβδί.
skills4.discharge.intro=Χτυπά όλους τους διπλανούς εχθρούς με μια έκρηξη μαγείας.
skills4.spellweave.intro=Ένα εύστοχο χτύπημα από κοντά ενισχύει τη ζημιά των ραβδιών για τρεις γύρους.
skills4.drain_life.intro=Βλάπτει έναν εχθρό και σε θεραπεύει για τη μισή υγεία που χάνει.
skills4.rabid_minions.intro=Τα πλάσματα που καλείτε προκαλούν περισσότερη ζημιά.
skills4.summon_skeleton.intro=Καλεί έναν σκελετό που πολεμά στο πλευρό σου.
skills4.soul_hunger.intro=Αναπληρώνει μάνα όταν σκοτώνεις εχθρό.
skills4.enrage.intro=Όσο η δεξιότητα είναι ενεργή, τα πλάσματα που καλείς προκαλούν αλλά και δέχονται περισσότερη ζημιά.
skills4.slow.intro=Επιβραδύνει την κίνηση και τις επιθέσεις ενός εχθρού.
skills4.summoner.intro=Μπορείς να διατηρείς ένα επιπλέον πλάσμα που έχεις καλέσει.
skills4.dark_pact.intro=Θυσιάζει πέντε μονάδες υγείας για να αναπληρώσει μάνα. Χρειάζεσαι τουλάχιστον έξι μονάδες υγείας.

skills4.double_strike.intro=Χτύπησε δύο φορές διαδοχικά.
skills4.stealth.intro=Οι εχθροί δυσκολεύονται περισσότερο να σε εντοπίσουν.
skills4.evasion.intro=Αυξάνει την πιθανότητα να αποφύγεις επιθέσεις.
skills4.smoke_bomb.intro=Γίνεσαι αόρατος μέσα σε καπνό. Η επίθεση σπάει την αορατότητα.
skills4.bandit.intro=Βρείτε επιπλέον χρυσό σε κάθε σωρό που συλλέγετε.
skills4.venom.intro=Όσο η δεξιότητα είναι ενεργή, τα χτυπήματά σου από κοντά μπορούν να δηλητηριάσουν τον στόχο.
skills4.locksmith.intro=Έχετε την ευκαιρία να αφοπλίσετε μια παγίδα όταν την πατήσετε.
skills4.light_step.intro=Μειώνει τη διάρκεια της ακινητοποίησης από ρίζες και του τραυματισμού που επιβραδύνει την κίνηση.
skills4.dash.intro=Μετακινείσαι έως δύο τετράγωνα μέσα από ελεύθερη διαδρομή.
