skills4.subclass.freerunner=Χωρίς υπερβολικά βαρύ εξοπλισμό και όσο δεν λιμοκτονείς, κινείσαι 60% ταχύτερα. Η αποφυγή σου διπλασιάζεται όσο κινείσαι.
skills4.subclass.assassin=Οι αιφνιδιαστικές επιθέσεις προκαλούν επιπλέον ζημιά.\n\n_+1 απόκρυψη_
skills4.subclass.warden=Το πάτημα ψηλού χόρτου χαρίζει Δέρμα φλοιού. Τα φυτά μπορεί να δώσουν επιπλέον σπόρους και δροσιά.
skills4.subclass.sniper=Οι επιθέσεις από απόσταση αγνοούν την πανοπλία και σημαδεύουν τον στόχο για ταχύτερη επόμενη επίθεση.\n\n_20% περισσότερη ζημιά από απόσταση_
skills4.subclass.spirit_binder=Τα χτυπήματα με το ραβδί από κοντά αναπληρώνουν μία φόρτιση και προσθέτουν τις διαθέσιμες φορτίσεις στη ζημιά.\n\n_Οι αναστημένοι σκελετοί διαρκούν διπλάσιο χρόνο._
skills4.subclass.lich=Όταν σκοτώνεις εχθρούς, ανακτάς υγεία και μειώνεις την πείνα.\n\n_Οι αναστημένοι σκελετοί και σκελετοί τοξότες έχουν διπλάσια δύναμη._\n_Ένα επιπλέον πλάσμα που μπορείς να καλέσεις._
skills4.subclass.marshal=Τα επιτυχημένα χτυπήματα σώμα με σώμα δημιουργούν έναν συνδυασμό.\n\n_+5 πυρομαχικά όπλου_\n_+1 ακρίβεια όπλου_
skills4.subclass.executioner=Κάτω από 40% υγεία, η μανία αυξάνει τη ζημιά κατά 50% και επιταχύνει τους πυροβολισμούς κατά 50%.\n\n_25% ταχύτερη επαναγέμιση_
skills4.spark.warlock=νεκρομάντης: +5 ζημιές.
skills4.spark.battlemage=μάγος μάχης: 50% πιθανότητα τυφλής για 3 στροφές.
skills4.summon.warlock=Νεκρομάντης: μπορείς να διατηρείς ένα επιπλέον πλάσμα που έχεις καλέσει.
skills4.summon.lich=Λιχ: μπορείς να διατηρείς ένα επιπλέον πλάσμα που έχεις καλέσει. Οι αναστημένοι σκελετοί έχουν διπλάσια δύναμη.
skills4.raise.spirit_binder=Δεσμευτής πνευμάτων: οι αναστημένοι σκελετοί διαρκούν διπλάσιο χρόνο.
