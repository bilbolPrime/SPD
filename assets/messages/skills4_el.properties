attributes.class_skills.name=Εκπαίδευση κλάσης
attributes.class_skills.desc=Ενισχύει τις μαθημένες δεξιότητες της αναγραφόμενης κλάσης. Δεν ξεκλειδώνει δεξιότητες ούτε καλύπτει τις απαιτήσεις τους. Ο εξοπλισμός προσθέτει έως τρία επίπεδα ανά δεξιότητα. Ο εξοπλισμός δεν μπορεί να ανεβάσει μια δεξιότητα πάνω από το μέγιστο επίπεδό της.
attributes.skill.name=Εκπαίδευση δεξιοτήτων
attributes.skill.desc=Προσθέτει ένα ή δύο επίπεδα στην αναγραφόμενη δεξιότητα. Απαιτεί τη σωστή κλάση, την υποκλάση της όπου χρειάζεται και τις προαπαιτούμενες δεξιότητες. Ο εξοπλισμός προσθέτει έως τρία επίπεδα ανά δεξιότητα. Ο εξοπλισμός δεν μπορεί να ανεβάσει μια δεξιότητα πάνω από το μέγιστο επίπεδό της.
