skills4.iron_tip.intro=Οι σιδερένιες μύτες αφήνουν τα βέλη να περάσουν μέσα από τους εχθρούς και να χτυπήσουν αυτούς που βρίσκονται πίσω τους. Τείχη και σύμμαχοι σταματούν το βέλος.
