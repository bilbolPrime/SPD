skills4.quick_draw.intro=Πυροβολήστε το όπλο σας πιο γρήγορα.
skills4.veteran_company.intro=Οι μισθοφόροι υπό τις διαταγές σας προκαλούν μεγαλύτερη ζημιά.
skills4.field_medicine.intro=Αποκαθιστά αμέσως κάποια υγεία.
