skills4.ambush.intro=Αυξάνει τη ζημιά από κοντά όσο είσαι αόρατος.
skills4.scorpion.intro=Το δηλητήριό σας προκαλεί μεγαλύτερη ζημιά.
skills4.silent_death.intro=Οι επιθέσεις σώμα με σώμα μπορεί να σκοτώσουν τους εχθρούς που κοιμούνται. Τα αφεντικά έχουν ανοσία.
