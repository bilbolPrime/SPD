skills4.escape.intro=Σε ελευθερώνει από ρίζες και τραυματισμούς που δυσκολεύουν την κίνηση, και αυξάνει την αποφυγή για τέσσερις γύρους.
skills4.trailblazer.intro=Αυξάνει την ταχύτητα κίνησής σας.
skills4.skirmish.intro=Η κίνηση ενισχύει το επόμενο χτύπημα σώμα με σώμα.
