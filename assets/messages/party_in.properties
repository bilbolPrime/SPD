actors.skills.raiseskeletonskill.desc=Memanggil kerangka untuk bertarung di sisi Anda.
network.partysession.background=Koneksi grup terputus karena kamu meninggalkan game.
items.corpse.name=mayat
items.corpse.desc=Mayat segar yang bisa dipakai untuk nekromansi.
items.armorkit.desc=Peralatan ini bisa mengubah zirah apa pun menjadi zirah epik. Sifat aslinya tetap ada, ditambah kemampuan sesuai kelasmu. Tidak perlu keahlian kerajinan.
items.bomb.desc=Bom kecil berisi bubuk mesiu. Meledak di tempatnya mendarat.
items.quest.driedrose.desc=Mawar ini sudah lama kering, tetapi semua kelopaknya masih utuh.\n\nKembalikan kepada hantu.
items.quest.phantomfish.desc=Ikan kecil yang tembus pandang ini sulit dilihat di udara. Di dalam air, hampir tidak terlihat sama sekali.\n\nKembalikan kepada hantu.
items.tomeofmastery.desc=Buku tipis bersampul kulit usang ini tampaknya menyimpan banyak pengetahuan. Membacanya perlu sedikit waktu.\n\nMemungkinkanmu memilih subkelas.
items.weightstone.desc=Batu ini bisa menyeimbangkan senjata jarak dekat agar lebih cepat atau akurat.
items.wands.wandofamok.desc=Cahaya ungunya membuat sasaran mengamuk dan menyerang makhluk di sekitarnya tanpa membedakan kawan dan lawan.
items.wands.wandofavalanche.desc=Jika tembakannya mengenai dinding atau penghalang padat lain, bebatuan runtuh dan melukai serta membuat makhluk di area itu tertegun.
items.wands.wandofflock.desc=Memanggil sekawanan domba ajaib yang menutup jalan untuk sementara.
items.wands.wandofpoison.desc=Meracuni sasaran dan memberikan kerusakan berkala. Peningkatan memperpanjang durasi racun.
items.wands.wandofreach.desc=Mengambil barang dari jauh dan bertukar tempat dengan musuh. Gelombangnya memicu perangkap, meratakan rumput, serta membuka atau menutup pintu di jalurnya.
items.wands.wandofslowness.desc=Mengurangi kecepatan gerak dan serangan sasaran menjadi separuh untuk sementara.
items.wands.wandofteleportation.desc=Memindahkan makhluk ke tempat acak di lantai ini.
items.weapon.melee.dualswords.desc=Dua bilah tajam untuk serangan lebih kuat.
items.weapon.missiles.cupidarrow.desc=Konon anak panah ini milik dewa cinta. Hati-hati memilih sasaran.
items.weapon.missiles.curaredart.desc=Anak panah kecil ini hanya sedikit melukai, tetapi bisa melumpuhkan sasaran dan membuatnya tak berdaya.
items.weapon.missiles.incendiarydart.desc=Ujungnya menancap pada sasaran sementara campuran yang terikat pada anak panah menyala.
items.weapon.missiles.soulcrystal.desc=Kristal yang mampu menangkap jiwa. Lemparkan pada musuh yang lemah atau sudah dilemahkan untuk menangkap rohnya.
items.weapon.missiles.tamahawk.desc=Kapak lempar ini tidak terlalu berat, tetapi butuh kekuatan agar efektif.
network.partytext.weapon_fast=Senjata ini cepat.
network.partytext.weapon_slow=Senjata ini lambat.
network.partytext.weapon_accurate=Senjata ini akurat.
network.partytext.weapon_inaccurate=Senjata ini kurang akurat.
network.partytext.weapon_fast_and_accurate=Senjata ini cepat dan akurat.
network.partytext.weapon_fast_but_inaccurate=Senjata ini cepat, tetapi kurang akurat.
network.partytext.weapon_slow_but_accurate=Senjata ini lambat, tetapi akurat.
network.partytext.weapon_slow_and_inaccurate=Senjata ini lambat dan kurang akurat.
network.partytext.necroblade_bolt=Mulai tingkat 5, bilah yang terisi penuh dapat melepaskan _Sambaran Gelap_, yang bisa menghancurkan hakikat sasaran dan mengubahnya menjadi pelayan.
network.partytext.necroblade_intro=Bilah dari sihir gelap ini memakan jiwa korbannya dan semakin kuat.
network.partytext.necroblade_energy=Jiwa tersimpan: _%s/100_
network.partytext.necroblade_damage=Jiwa menambah _0–%d kerusakan_.
network.partytext.necroblade_hungry=Bilah dapat menghabiskan simpanan jiwa yang penuh untuk menjadi lebih kuat.
network.partytext.necroblade_full=Bilah tak bisa lagi meningkatkan dirinya dengan memakan jiwa.
