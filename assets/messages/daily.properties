daily.brief_0=The Rat King's reinforcements are on their way. Defeat him before they reach his court. A captured warden can help you fight, and the guarded store holds supplies.
daily.brief_1=The riot is covering Tengu's escape. Defeat both escape captains to open his hideout, then defeat Tengu before time runs out. Free prisoners to turn them against the guards, or search the locked armory for supplies. The hideout seals when you enter.
daily.brief_2=Three miners are trapped below, and the last lift is about to leave. Open their shelters and lead all three back alive, then take the lift out. DM-300 roams the tunnels. You can fight it or find another way around. Supplies and locked shortcuts may help you get everyone home.
daily.brief_3=An Iceclaw, a Frostback gnoll and a Rimehorn roam these caves. Hunt all three, then reach the far exit before the storm closes in. You can hunt them in any order. Supplies lie in side passages, but searching takes time.
daily.brief_4=Three ritual sites are calling demons into the halls. Reach each site and seal it before the ritual finishes. Every seal stops one source of reinforcements. Choose your route, and search the side chambers if you need supplies.
daily.brief_5=Hold the outpost until help arrives. Keep the captain alive through five waves of attackers. Your defenders will guard the center while you fight, search nearby rooms for supplies or open cells to recruit help. Watch the approaches: later waves can attack from more than one side.
daily.brief_6=The King's treasury holds the city's gold. Find the captain and take his key, break into the vault, then escape through the far gate before it closes. Opening the treasury raises the alarm. Search the store rooms and open shortcuts first, or risk a quicker robbery with fewer supplies.
daily.rules=Each date has its own hero, equipment and dungeon. Spend your skill points before setting out. Time is measured in turns. Leaving an event ends the attempt. Daily events have separate results and do not unlock badges or Lore.
