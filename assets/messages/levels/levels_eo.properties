levels.hallslevel.high_grass_name=Ardaĵfungoj
levels.hallslevel.region_deco_desc=Grandega peco da ŝtono, kiu ŝajnas esti derompiĝinta de la plafono aŭ proksima muro.
levels.hallslevel.region_deco_name=Peco da rubo
levels.hallslevel.statue_desc=La kolono estas farita el veraj humanoidaj kranioj. Mirinde.
levels.hallslevel.statue_name=Kolono
levels.hallslevel.water_desc=Ĝi aspektas kiel lafo, sed ĝi estas malvarma kaj verŝajne sekura por tuŝi.
levels.hallslevel.water_name=Malvarma lafo
levels.level$feeling.chasm_desc=Viaj paŝoj eĥas trans la kelkarceron.
levels.level$feeling.chasm_title=abismoplanko
levels.level$feeling.dark_desc=Vi povas aŭdi malamikojn moviĝantajn en la mallumo.
levels.level$feeling.dark_title=malhela planko
levels.level$feeling.grass_desc=La odoro de vegetaĵaro densas en la aero.
levels.level$feeling.grass_title=herba planko
levels.level$feeling.large_desc=Ĉi tiu kelkarcerplanko ŝajnas nekutime granda.
levels.level$feeling.large_title=granda planko
levels.level$feeling.secrets_desc=La etoso sugestas, ke ĉi tiu etaĝo kaŝas multajn sekretojn.
levels.level$feeling.secrets_title=sekreta planko
levels.level$feeling.traps_desc=La tero ŝajnas aparte perfida ĉi tie.
levels.level$feeling.traps_title=kaptiloj planko
levels.level$feeling.water_desc=Vi aŭdas akvon ŝpruci ĉirkaŭ vi.
levels.level$feeling.water_title=akvoplanko
levels.level.alchemy_desc=Ĉi tiu poto estas plena de magia akvo. Oni povas miksi objektojn en la poton por krei ion novan!
levels.level.alchemy_name=alĥemia poto
levels.level.barricade_desc=La ligna barikado estas firme starigita sed sekiĝis tra la jaroj. Ĉu ĝi eble brulos?
levels.level.barricade_name=Barikado
levels.level.bookshelf_name=Librobreto
levels.level.chasm_desc=Vi ne povas vidi la fundon.
levels.level.chasm_name=Abismo
levels.level.closed_door_name=Fermita pordo
levels.level.crystal_door_desc=Ĉi tiu ŝlosita pordo estas farita el magia kristalo. Vi povas vidi tra ĝi, sed vi bezonos kristalan ŝlosilon por malfermi ĝin.
levels.level.crystal_door_name=Kristala pordo
