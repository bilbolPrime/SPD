levels.cavesbosslevel.energy_desc=La tero ĉi tie sparkas per elektro, kaj estas malutile paŝi sur ĝin. _La sparkoj ŝajnas graviti en certa direkto..._ eble ili kondukas al la energifonto?
levels.cavesbosslevel.gate_desc=Granda metala pordego, kiu blokas la vojon en la nanan metropolon. La metala skatolo en la centro produktas laŭtan zuman bruon, ĝi devas esti konektita al la cirkvitoj kaj maŝinoj proksimaj. Eble detrui DM-300 malfermos la pordegon?
levels.cavesbosslevel.gate_desc_broken=La pordego certe estis iel konektita al DM-300, ĉar ĝi eksplodis kiam DM-300 estis venkita. Nun nur rompitaj pecoj restas.
levels.cavesbosslevel.gate_name=Metala pordego
levels.cavesbosslevel.water_desc=Kun la tuta elektro ĉi tie, akvo eble ne ĉiam estas sekura...
levels.cavesbosslevel.wires_desc=La tero estas parte elfosita ĉi tie, montrante kelkajn grandajn nudajn dratojn. Ili certe konektas la diversajn elektrajn maŝinojn kune. \n\n La dratoj certe havas iom da kurento tra ili. Se DM-300 paŝas ĉi tien, ĝi eble povos ĉerpi energion de ili.
levels.cavesbosslevel.wires_name=Malkovrita drataro
levels.caveslevel.bookshelf_desc=Kiu bezonus librobreton en kaverno?
levels.caveslevel.entrance_desc=La ŝtuparo kondukas supren al la supra profundo.
levels.caveslevel.exit_desc=La ŝtuparo kondukas malsupren al la pli malalta profundo.
levels.caveslevel.grass_name=Fluoreska musko
levels.caveslevel.high_grass_desc=Grandegaj fungoj blokas la vidon.
levels.caveslevel.high_grass_name=Fluoreskaj fungoj
levels.caveslevel.region_deco_desc=Granda tute metala strukturo, probable konstruita de la gnomoj kiam ili kutimis mini ĉi tiun lokon. Oni pensas, ke oni povas vidi longe neuzatajn minĉarajn relojn laŭlonge de la supro.
levels.caveslevel.region_deco_name=Metala strukturo
levels.caveslevel.wall_deco_desc=Vejno de iu erco videblas sur la muro. Oro?
levels.caveslevel.water_name=Frosta akvo
levels.citybosslevel.summoning_desc=Ĉi tiu piedestalo havas grandan malfermaĵon en la centro, kiu preskaŭ radias per malhela energio. \n\nNana Reĝo uzas ĉi tiujn piedestalojn kiel fokusojn por sia nekromancia magio, kaj povas alvoki helpantojn al ili. La piedestalo devas ŝargiĝi dum kelkaj turnoj antaŭ ol la helpanto aperas, kaj la tipo de alvokata helpanto estas indikita per la magia povo de la konstruaĵo.
levels.citybosslevel.summoning_name=Alvokanta piedestalo
levels.citybosslevel.throne_desc=Ĉi tiu impone granda trono estas la sidejo de la nana imperio, nun transprenita de potenc-freneza nekromancisto. \n\nŜajnas esti iuj magiaj aŭ mekanikaj partoj de la trono, la Nana Reĝo eble havas plian potencon kiam li sidas sur ĝi.
levels.citybosslevel.throne_name=Trono
levels.citylevel.bookshelf_desc=La vicoj da libroj pri diversaj fakoj plenigas la librobreton.
levels.citylevel.deco_desc=Pluraj kaheloj mankas ĉi tie.
levels.citylevel.entrance_desc=Deklivirejo kondukas supren al la supra profundo.
levels.citylevel.exit_desc=Deklivirejo kondukas malsupren al la pli malalta profundo.
levels.citylevel.high_grass_name=Alte florantaj floroj
levels.citylevel.region_deco_desc=Ŝvelinta piedestalo kun helverda magia flamo supre. La flamo estas tiel densa, ke ĝi povus esti solida.
levels.citylevel.region_deco_name=Flamanta piedestalo
levels.citylevel.sp_desc=Dika tapiŝo kovras la plankon.
levels.citylevel.statue_desc=La statuo prezentas iun nanon starantan en heroa pozo.
levels.citylevel.upcoming_quest_intro_no=Restu ĉi tie
levels.citylevel.upcoming_quest_intro_title=Mesaĝo de programisto
levels.citylevel.upcoming_quest_intro_yes=Descendu en la trezorejon
levels.citylevel.water_name=Suspektinde kolorigita akvo
levels.features.chasm.chasm=Abismo
levels.features.chasm.jump=Ĉu vi vere volas salti en la abismon? Falo tiel malproksimen estos dolora.
levels.features.chasm.no=Ne, mi ŝanĝis mian opinion
levels.features.chasm.ondeath=Vi falis kaj mortis...
levels.features.chasm.rankings_desc=Mortis sur Efiko
levels.features.chasm.yes=Jes, mi scias, kion mi faras
levels.hallslevel.bookshelf_desc=Libroj en antikvaj lingvoj subbrulas en la librobreto.
