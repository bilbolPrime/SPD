levels.level.inactive_trap_name=Ekigita kaptilo
levels.level.locked_door_desc=Ĉi tiu pordo estas ŝlosita, vi bezonas kongruan ŝlosilon por malŝlosi ĝin.
levels.level.locked_door_name=Ŝlosita pordo
levels.level.locked_exit_desc=Pezaj stangoj blokas la ŝtuparon kondukantan malsupren.
levels.level.locked_exit_name=Ŝlosita profunda elirejo
levels.level.open_door_name=Malferma pordo
levels.level.pedestal_name=Piedestalo
levels.level.statue_desc=Iu volis ornami ĉi tiun lokon, sed malsukcesis, evidente.
levels.level.statue_name=Statuo
levels.level.unlocked_exit_name=Malŝlosita profunda elirejo
levels.level.wall_name=Muro
levels.level.water_desc=En kazo de brulvundo, paŝu en la akvon por estingi la fajron.
levels.level.water_name=Akvo
levels.level.well_name=Nu
levels.mininglevel.barricade_desc=La ligna barikado estas firme starigita kaj funkcias kiel subteno por la plafono.\n\n Ĉi tion verŝajne konstruis la gnoluloj por doni iom da protekto kontraŭ falantaj rokoj. _Ĉiuj apudaj ĉeloj estos protektitaj kontraŭ rokfalaj kaptiloj kaj atakoj._\n\nŜajnas, ke ĝi brulus same bone kiel iu ajn alia barikado.
levels.mininglevel.boulder_desc=Granda roko blokas la vojon. Ĝi devus esti sufiĉe facile rompinda per pioĉo.
levels.mininglevel.boulder_name=Roko
levels.mininglevel.crystal_desc=Tie ĉi estas granda kaj bunta kristala elstaraĵo. Ĉi tiuj kristaloj estas fragilaj kaj facile rompiĝeblaj per pioĉo, aŭ rompiĝos se io estos minata apud ĝi.
levels.mininglevel.crystal_name=Kristala pikilo
levels.mininglevel.gold_extra_desc=Vi verŝajne povas elmini ĝin per via pioĉo.
levels.mininglevel.wall_desc=Glata roka muro, kiu estas iom pli mola ol kutime. Vi povas trafosi ĝin per via pioĉo, sed ĝi postulos iom da peno kaj iom pliigos vian malsaton.
levels.prisonlevel.bookshelf_desc=Ĉi tio estas probable spuro de prizona biblioteko. Ĉu ĝi eble brulos?
levels.prisonlevel.empty_deco_desc=Estas malnovaj sangomakuloj sur la planko.
levels.prisonlevel.region_deco_alt_desc=Metala kaĝo ĝuste sufiĉe granda por enhavi homon. Ĝi pendas super profunda abismo, pendigita per ĉeno.
levels.prisonlevel.region_deco_alt_name=Penda kaĝo
levels.prisonlevel.region_deco_desc=Metala kaĝo ĝuste sufiĉe granda por enhavi homon. Ĝi ŝajnas esti iel ŝlosita al la tero, oni ne povas movi ĝin.
levels.prisonlevel.region_deco_name=Mallibereja kaĝo
levels.prisonlevel.water_name=Malhela malvarma akvo
levels.rooms.quest.ambitiousimproom$questentrance.desc=Ĉi tiu malbonaŭgura fosaĵo ŝajnas esti la enirejo al iu antikva nana trezorejo. Magia barilo malhelpas eniron, oni povas marŝi super ĝi kvazaŭ estus planko ĉi tie.
levels.rooms.quest.ambitiousimproom$questentrance.name=Trezoreja Enirejo
levels.rooms.quest.blacksmithroom$questentrance.desc=Tiu ĉi ŝtuparo kondukas al malnova minejo ĝuste sub la forĝista metiejo.
levels.rooms.quest.blacksmithroom$questentrance.name=Minenirejo
levels.rooms.quest.massgraveroom$bones.desc=Ostoj estas sternitaj sur la planko, kio okazis ĉi tie?
levels.rooms.quest.massgraveroom$bones.name=Amasa tombo
levels.rooms.quest.mineentrance$questexit.desc=Ĉi tiu ŝtupetaro kondukas el la minejo, reen en la metiejon de la forĝisto.
levels.rooms.quest.mineentrance$questexit.name=Mina elirejo
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Pentrita markilo por iu malhela rito. Kandeloj kutime estas metitaj sur la kvar angulojn.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Rita markilo
levels.rooms.special.magicalfireroom$eternalfire.desc=Muro de densa helverda fajro estas ĉi tie, ŝajne kaŭzita de magio. Ĝi estas tiel densa, ke oni ne povas moviĝi tra ĝi, kaj ĝi ekbruligas ĉion, kio tro proksimiĝas. Ĝi montras neniujn signojn de natura forbrulo, oni devos uzi ion por estingi ĝin.
levels.rooms.special.sentryroom$sentry.desc=Ŝajnas, ke ĉi tiu sangoruĝa gardostaranto estas poziciigita ĉi tie por gardi la trezoron ĉe la alia fino de ĉi tiu ĉambro. Ĝi pafos radiojn de diseriĝa magio al vi, se vi paŝos en la areon, kiun ĝi defendas. \n\nĜi estas imuna kontraŭ ĉiuj malutilaj efikoj kaj povas vidi tra nevidebleco, sed ŝajnas, ke ĝi bezonas iom da tempo por ŝargiĝi antaŭ ol ĝi komencas pafi. \n\nIel la gardostaranto volas pafi nur al vi, kvazaŭ ĝi scius, ke la loĝantoj de la kelkarcero ne estas minaco al la trezoro.
levels.rooms.special.sentryroom$sentry.discover_hint=Vi povas trovi ĉi tiun malamikon ie ajn en la kelkarcero.
levels.rooms.special.sentryroom$sentry.name=ruĝa gardostaranto
levels.rooms.special.toxicgasroom$toxicvent.desc=Senzorga aventuristo certe ekigis ĉi tiun kaptilon antaŭ longe. Malgraŭ sia neaktiva stato, ĝi ankoraŭ elŝprucas toksan gason en la ĉambron kaj montras neniujn signojn de ĉesado. Vi bezonos iun manieron malhelpi damaĝon de la gaso se vi volas esplori ĉi tiun ĉambron.
levels.rooms.special.toxicgasroom$toxicvent.name=toksa ellastruo
levels.rooms.special.weakfloorroom$hiddenwell.desc=Vi apenaŭ povas distingi puton en la profundo sube, eble estas io tie sube?
levels.rooms.special.weakfloorroom$hiddenwell.name=malproksima puto
levels.sewerlevel.bookshelf_desc=La librobreto estas plena de malmultekostaj senutilaj libroj. Ĉu ĝi eble brulos?
levels.sewerlevel.empty_deco_desc=Malseka flaveca musko kovras la plankon.
levels.sewerlevel.region_deco_desc=Forta barelo preskaŭ tiel granda kiel vi. Ĝi devas esti plena de io aŭ alia, ĝi estas tro peza por movi.
levels.sewerlevel.region_deco_name=Stokadobarelo
levels.sewerlevel.water_name=Malklara akvo
levels.traps.alarmtrap.alarm=La kaptilo elsendas penetran sonon, kiu eĥas tra la tuta kelkarcero!
levels.traps.alarmtrap.desc=Ŝajnas, ke ĉi tiu kaptilo estas ligita al laŭta alarmmekanismo. Ĝia ekigo verŝajne alarmos ĉion sur la nivelo.
levels.traps.alarmtrap.name=alarmkaptilo
levels.traps.blazingtrap.desc=Paŝante sur ĉi tiun kaptilon, oni ekbruligos potencan kemian miksaĵon, ekbruligante vastan areon.
levels.traps.blazingtrap.name=flamanta kaptilo
levels.traps.burningtrap.desc=Paŝado sur ĉi tiun kaptilon ekbruligos kemian miksaĵon, ekbruligante la ĉirkaŭan areon.
levels.traps.burningtrap.name=brulanta kaptilo
levels.traps.chillingtrap.desc=Kiam aktivigite, kemiaĵoj en ĉi tiu kaptilo rapide frostigos la aeron ĉirkaŭ ĝia loko.
levels.traps.chillingtrap.name=malvarmiga kaptilo
levels.traps.confusiontrap.desc=Ekigi ĉi tiun kaptilon liberigos nubon da konfuza gaso en la tuja areo.
levels.traps.confusiontrap.name=konfuza gaskaptilo
levels.traps.corrosiontrap.desc=Ekigante ĉi tiun kaptilon, oni liberigos nubon da mortiga acida gaso en la tuja areo.
levels.traps.corrosiontrap.name=koroda gaskaptilo
levels.traps.cursingtrap.curse=Via eluzita ekipaĵo fariĝas malbenita!
levels.traps.cursingtrap.desc=Ĉi tiu kaptilo enhavas la saman malican magion troveblan en malbenita ekipaĵo. Ekigi ĝin malbenos iujn objektojn en la tuja ĉirkaŭaĵo.
levels.traps.cursingtrap.name=malbena kaptilo
levels.traps.disarmingtrap.desc=Ĉi tiu kaptilo enhavas tre specifan teleportan magion, kiu misportos la armilon de sia viktimo al iu alia loko.
levels.traps.disarmingtrap.disarm=Via armilo estas teleportita for!
levels.traps.disarmingtrap.name=senarmiga kaptilo
levels.traps.disintegrationtrap.desc=Kiam ekigita, ĉi tiu kaptilo trafos la plej proksiman celon per radioj de diseriĝo, kaŭzante signifan damaĝon kaj detruante objektojn. \n\nFeliĉe la ellasilmekanismo ne estas kaŝita.
levels.traps.disintegrationtrap.name=disfala kaptilo
levels.traps.disintegrationtrap.ondeath=Vi estis mortigita de la disfala kaptilo...
levels.traps.disintegrationtrap.one=La kaptilo disintegras vian %s!
levels.traps.disintegrationtrap.some=La kaptilo disintegras iom da via %s!
levels.traps.distortiontrap.desc=Konstruita el stranga magio de nekonata origino, ĉi tiu kaptilo alvokos ĉiuspecajn estaĵojn al ĉi tiu loko.
levels.traps.distortiontrap.name=misprezenta kaptilo
levels.traps.explosivetrap.desc=Ĉi tiu kaptilo enhavas iom da pulvora eksplodaĵo kaj ellasilmekanismon. Aktivigi ĝin kaŭzos eksplodon en la tuja areo.
levels.traps.explosivetrap.name=eksplodema kaptilo
levels.traps.flashingtrap.desc=Ĉe aktivigo, ĉi tiu kaptilo ekbruligos potencan fulmantan pulvoron stokitan interne, provizore blindigante, kripligante kaj vundante sian viktimon. \n\nLa kaptilo devas havi grandan provizon de pulvo, ĉar ĝi povas aktivigi sin multajn fojojn sen rompiĝi.
levels.traps.flashingtrap.name=fulmanta kaptilo
levels.traps.flocktrap.desc=Eble ŝerco de iu amatora magiisto, ekigante ĉi tiun kaptilon, kreos gregon da magiaj ŝafoj.
levels.traps.flocktrap.name=gregkaptilo
levels.traps.frosttrap.desc=Kiam aktivigite, kemiaĵoj en ĉi tiu kaptilo rapide frostigos la aeron en larĝa gamo ĉirkaŭ ĝia loko.
levels.traps.frosttrap.name=frostkaptilo
levels.traps.gatewaytrap.desc=Ĉi tiu speciala teletransporta kaptilo povas aktiviĝi senfinan nombron da fojoj kaj ĉiam teletransportiĝas al la sama loko.
levels.traps.gatewaytrap.name=enireja kaptilo
levels.traps.geysertrap.desc=Kiam ekigita, ĉi tiu kaptilo kaŭzos gejseron da akvo elŝpruci, damaĝante fajrajn malamikojn, forbatante ĉiujn proksimajn rolulojn, estingante fajrojn, kaj transformante la ĉirkaŭan terenon al akvo.
levels.traps.geysertrap.name=gejsera kaptilo
levels.traps.gnollrockfalltrap.desc=Ĉi tiu rokfala kaptilo estas farita per ia formo de magia helpo. Kiam ekigita, ĝi kaŭzos, ke rokoj malfiksiĝos kaj tuj falos de supre en areon 5x5 ĉirkaŭ ĝi. Pro la pli molaj rokoj en la areo, ĝi ne kaŭzos tiom da damaĝo kiel regula rokfala kaptilo, sed via kiraso ankaŭ ne estos efika kontraŭ ĝi. Rokoj ankaŭ ne falos en lokojn kun apuda barikado, ĉar ili helpas teni la plafonon.\n\n_Ĉi tiu kaptilo ne povas distingi amikon de malamiko, kaj tial estas same damaĝa por la gnols kiel por vi._
levels.traps.gnollrockfalltrap.name=gnola rokfala kaptilo
levels.traps.grimtrap.desc=Ekstreme potenca detrua magio estas konservita en ĉi tiu kaptilo, sufiĉe por tuj mortigi ĉiujn krom la plej sanajn heroojn. Ekigante ĝin, oni sendos distanc-atingan eksplodon de mortiga magio al la plej proksima rolulo. \n\nFeliĉe, la ellasilo-mekanismo ne estas kaŝita.
levels.traps.grimtrap.name=sinistra kaptilo
levels.traps.grimtrap.ondeath=Vin mortigis la eksplodo de sinistra kaptilo...
levels.traps.grippingtrap.desc=Ĉi tiu kaptilo alkroĉiĝas al la piedoj de kiu ajn ekigas ĝin, difektante ilin kaj malrapidigante ilian movadon. \n\nPro sia simpla naturo, ĉi tiu kaptilo povas aktiviĝi multajn fojojn sen rompiĝi.
levels.traps.grippingtrap.name=kaptilo
levels.traps.guardiantrap$guardian.desc=Ĉi tiu blua apero ŝajnas esti alvokita eĥo de unu el la ŝtonaj gardantoj de la kelkarcero.
levels.traps.guardiantrap$guardian.desc_weapon=Kvankam la statuo mem estas preskaŭ senkorpa, la _%s_, kiun ĝi tenas, aspektas reala.
levels.traps.guardiantrap$guardian.discover_hint=Vi povas trovi ĉi tiun malamikon per specifa kaptilo.
levels.traps.guardiantrap$guardian.name=alvokita kuratoro
levels.traps.guardiantrap.alarm=La kaptilo elsendas penetran sonon, kiu eĥas tra la tuta kelkarcero!
levels.traps.guardiantrap.desc=Ĉi tiu kaptilo estas ligita al stranga magia mekanismo, kiu alvokos gardantojn kaj avertos ĉiujn malamikojn sur la planko.
levels.traps.guardiantrap.name=gardista kaptilo
levels.traps.oozetrap.desc=Tiu kaptilo ŝprucigos mordan ŝlimon kiam aktivigite, kiu brulos ĝis ĝi estos forlavita.
levels.traps.oozetrap.name=ŝlimo-kaptilo
levels.traps.pitfalltrap.desc=Ĉi tiu kaptilo estas konektita al granda kaptilporda mekanismo, kaj baldaŭ post kiam ĝi estas ekigita, io ajn proksime al ĝi glitos rekte tra la grundo kaj falos! Tamen ĝi ne funkcios en areoj kun aparte solidaj plankoj.
levels.traps.pitfalltrap.name=falkaptilo
levels.traps.pitfalltrap.no_pit=la tero estas tro solida por ke kaptilo funkciu ĉi tie.
levels.traps.pitfalltrap.triggered=La grundo komencas cedi ĉirkaŭ la ekigita kaptilo!
levels.traps.pitfalltrap.triggered_hero=La tero komencas cedi ĉirkaŭ vi!
levels.traps.poisondarttrap.desc=Malgranda sagetĵetilo devas esti kaŝita proksime, aktivigo de ĉi tiu kaptilo igos ĝin pafi venenigitan sageton al la plej proksima celo. \n\nFeliĉe la ellasilmekanismo ne estas kaŝita.
levels.traps.poisondarttrap.name=venensageta kaptilo
levels.traps.poisondarttrap.ondeath=Vi estis mortigita per la venensageta kaptilo...
levels.traps.rockfalltrap.desc=Ĉi tiu kaptilo estas konektita al serio da lozaj rokoj supre, kaj ĝia ekigo kaŭzos ilian falon sur la tutan ĉambron! Se la kaptilo ne estas en specifa ĉambro, rokoj falos en areon ĉirkaŭ la kaptilo anstataŭe. \n\nFeliĉe, la ellasilo-mekanismo ne estas kaŝita.
levels.traps.rockfalltrap.name=rokfala kaptilo
levels.traps.rockfalltrap.ondeath=Vin dispremis la rokfala kaptilo...
levels.traps.shockingtrap.desc=Mekanismo kun granda kvanto da energio stokita en ĝi. Ekigante ĉi tiun kaptilon, tiu energio estos malŝarĝita en kampon ĉirkaŭ ĝi.
levels.traps.shockingtrap.name=ŝoka kaptilo
levels.traps.stormtrap.desc=Mekanismo kun grandega kvanto da energio stokita en ĝi. Ekigante ĉi tiun kaptilon, tiu energio estos malŝarĝita en grandan elektran ŝtormon.
levels.traps.stormtrap.name=ŝtormkaptilo
levels.traps.summoningtrap.desc=Ekigi ĉi tiun kaptilon alvokos kelkajn el la monstroj de ĉi tiu areo al ĉi tiu loko.
levels.traps.summoningtrap.name=alvoka kaptilo
levels.traps.teleportationtrap.desc=Kiam ajn ĉi tiu kaptilo estas ekigita, ĉio ĉirkaŭ ĝi estos teletransportita al hazardaj lokoj sur ĉi tiu etaĝo.
levels.traps.teleportationtrap.name=teleporta kaptilo
levels.traps.tengudarttrap.desc=Tengu klare prepariĝis por batalo. Ĉi tiu kaptilo aktivigos kaŝitan sagetoblovilon, kiu pafos venensageton al la plej proksima aĵo, kiu ne estas Tengu. \n\nLa kaptilo estas tiel bone farita, ke la ellasilmekanismo estas neeble detekti sen magia helpo. Tamen la kaptilo estas videbla momenton kiam ĝi estas starigita.
levels.traps.toxictrap.desc=Ekigante ĉi tiun kaptilon, oni liberigos nubon de toksa gaso en la ĉirkaŭa areo.
levels.traps.toxictrap.name=toksa gaskaptilo
levels.traps.trap.discover_hint=Vi povas trovi ĉi tiun kaptilon hazarde en la kelkarcero. Ĉiu regiono havas malsamajn kaptilojn, kiuj povas aperi.
levels.traps.trap.rankings_desc=Mortigita de: %s
levels.traps.warpingtrap.desc=Ĉi tiu kaptilo similas al teleporta kaptilo, sed ankaŭ kaŭzos, ke la heroo perdos sian scion pri la aranĝo de la planko!
levels.traps.warpingtrap.name=misforma kaptilo
levels.traps.weakeningtrap.desc=Malhela magio en ĉi tiu kaptilo suĉas la energion el ĉio, kio kontaktas ĝin. Tamen, potencaj malamikoj povas rezisti la efikon.
levels.traps.weakeningtrap.name=malfortiganta kaptilo
levels.traps.worndarttrap.desc=Malgranda sagetĵetilo devas esti kaŝita proksime, aktivigo de ĉi tiu kaptilo igos ĝin pafi al la plej proksima celo.\n\nPro sia aĝo ĝi ne estas tre damaĝa tamen, ĝi eĉ ne estas kaŝita...
levels.traps.worndarttrap.name=eluzita sagetkaptilo
levels.traps.worndarttrap.ondeath=Vin mortigis la eluzita sagetkaptilo...
levels.vaultlevel$vaultflametrap.desc=Ŝajnas, ke ĉi tiu ellastruo sendas verdajn flamojn je fiksitaj intervaloj. _Ĉar ĉi tio estas nur testa areo, la flamoj de la ellastruoj fakte ne vundos vin._
levels.vaultlevel$vaultflametrap.name=trezorejo flamo ellastruo

levels.level.sign_desc=Vi ne povas legi la tekston de ĉi tie.
levels.level.sign_name=Subskribi
