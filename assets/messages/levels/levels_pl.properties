levels.cavesbosslevel.energy_desc=Ziemia tutaj iskrzy od elektryczności i chodzenie po niej jest niebezpieczne. _Iskry zdają się zmierzać w określonym kierunku..._ może prowadzą do źródła prądu?
levels.cavesbosslevel.gate_desc=Duża metalowa brama blokująca drogę do krasnoludzkiej metropolii. Metalowa skrzynia pośrodku wydaje głośny brzęczący dźwięk, prawdopodobnie jest podłączona do obwodów i pobliskich maszyn. Może zniszczenie DM-300 otworzy bramę?
levels.cavesbosslevel.gate_desc_broken=Brama musiała być w jakiś sposób powiązana z DM-300, ponieważ eksplodowała, gdy DM-300 został pokonany. Teraz pozostały tylko rozbite fragmenty.
levels.cavesbosslevel.gate_name=Brama metalowa
levels.cavesbosslevel.water_desc=Biorąc pod uwagę dostępność elektryczności, woda nie zawsze jest bezpieczna...
levels.cavesbosslevel.wires_desc=Ziemia jest tu częściowo wykopana, widać więc grube, odsłonięte przewody. Muszą one łączyć ze sobą różne urządzenia elektryczne.\n\nPrzewody muszą przepuszczać prąd. Jeśli DM-300 tu trafi, może być w stanie pobierać z nich energię.
levels.cavesbosslevel.wires_name=Odsłonięte okablowanie
levels.caveslevel.bookshelf_desc=Kto potrzebowałby regału na książki w jaskini?
levels.caveslevel.entrance_desc=Drabina prowadzi na górną głębokość.
levels.caveslevel.exit_desc=Drabina prowadzi w dół, na niższą głębokość.
levels.caveslevel.grass_name=Fluorescencyjny mech
levels.caveslevel.high_grass_desc=Ogromne grzyby zasłaniają widok.
levels.caveslevel.high_grass_name=Grzyby fluorescencyjne
levels.caveslevel.region_deco_desc=Duża, całkowicie metalowa konstrukcja, prawdopodobnie zbudowana przez krasnoludy, gdy kiedyś tu wydobywały. Wydaje ci się, że na jej szczycie widać dawno nieużywane tory kolejki górniczej.
levels.caveslevel.region_deco_name=Konstrukcja metalowa
levels.caveslevel.wall_deco_desc=Na ścianie widoczna jest żyła rudy. Złoto?
levels.caveslevel.water_name=Lodowata woda
levels.citybosslevel.summoning_desc=Ten postument ma duży otwór w środku, który praktycznie promieniuje ciemną energią. \n\nKról Krasnoludów używa tych postumentów jako punktów skupienia swojej magii nekromantycznej i może przywoływać do nich sługi. Postument musi być naładowany przez kilka tur, zanim pojawi się stwór, a rodzaj przywoływanego sługi jest sygnalizowany przez magiczną moc budynku.
levels.citybosslevel.summoning_name=Postument przywoływania
levels.citybosslevel.throne_desc=Ten imponująco wielki tron jest siedzibą imperium krasnoludów, obecnie przejętego przez żądnego władzy nekromantę.\n\nWygląda na to, że tron ma jakieś magiczne lub mechaniczne części, Król Krasnoludów może dysponować dodatkową mocą, gdy na nim siedzi.
levels.citybosslevel.throne_name=Tron
levels.citylevel.bookshelf_desc=Półka jest zapełniona rzędami książek z różnych dziedzin.
levels.citylevel.deco_desc=Tutaj brakuje kilku kafelków.
levels.citylevel.entrance_desc=Rampa prowadzi na górną głębokość.
levels.citylevel.exit_desc=Rampa prowadzi w dół, na niższą głębokość.
levels.citylevel.high_grass_name=Wysoko kwitnące kwiaty
levels.citylevel.region_deco_desc=Podwyższony postument z jasnozielonym magicznym płomieniem na szczycie. Płomień jest tak gęsty, że równie dobrze mógłby być stały.
levels.citylevel.region_deco_name=Płonący cokół
levels.citylevel.sp_desc=Podłogę pokrywa gruby dywan.
levels.citylevel.statue_desc=Rzeźba przedstawia krasnoluda stojącego w bohaterskiej pozie.
levels.citylevel.upcoming_quest_intro_no=Zostań tutaj
levels.citylevel.upcoming_quest_intro_title=Wiadomość od programisty
levels.citylevel.upcoming_quest_intro_yes=Zejdź do skarbca
levels.citylevel.water_name=Podejrzanie zabarwiona woda
levels.features.chasm.chasm=Przepaść
levels.features.chasm.jump=Naprawdę chcesz skoczyć w przepaść? Upadek z takiej wysokości będzie bolesny.
levels.features.chasm.no=Nie, zmieniłem zdanie
levels.features.chasm.ondeath=Spadłeś na śmierć...
levels.features.chasm.rankings_desc=Zginął w wyniku uderzenia
levels.features.chasm.yes=Tak, wiem, co robię
levels.hallslevel.bookshelf_desc=Książki w starożytnych językach tlą się na półce.
levels.hallslevel.grass_name=Mech żarowy
levels.hallslevel.high_grass_name=Grzyby Emberfungi
levels.hallslevel.region_deco_desc=Ogromny kawałek kamienia, który najwyraźniej odłamał się od sufitu lub pobliskiej ściany.
levels.hallslevel.region_deco_name=Kawałek gruzu
levels.hallslevel.statue_desc=Kolumna jest zrobiona z prawdziwych humanoidalnych czaszek. Super.
levels.hallslevel.statue_name=Filar
levels.hallslevel.water_desc=Wygląda jak lawa, ale jest zimna i prawdopodobnie można jej bezpiecznie dotknąć.
levels.hallslevel.water_name=Zimna lawa
levels.level$feeling.chasm_desc=Twoje kroki rozbrzmiewają echem w lochach.
levels.level$feeling.chasm_title=dno przepaści
levels.level$feeling.dark_desc=W ciemnościach słychać ruchy wrogów.
levels.level$feeling.dark_title=ciemna podłoga
levels.level$feeling.grass_desc=W powietrzu unosi się gęsty zapach roślinności.
levels.level$feeling.grass_title=podłoga trawiasta
levels.level$feeling.large_desc=Ta kondygnacja lochów wydaje się niezwykle duża.
levels.level$feeling.large_title=duża podłoga
levels.level$feeling.secrets_desc=Atmosfera tego piętra sugeruje, że kryje ono wiele tajemnic.
levels.level$feeling.secrets_title=piętro sekretów
levels.level$feeling.traps_desc=Tutaj grunt wydaje się szczególnie zdradliwy.
levels.level$feeling.traps_title=pułapki podłogowe
levels.level$feeling.water_desc=Słyszysz plusk wody wokół siebie.
levels.level$feeling.water_title=podłoga wodna
levels.level.alchemy_desc=Ten garnek jest wypełniony magiczną wodą. Można wrzucać do niego przedmioty, aby stworzyć coś nowego!
levels.level.alchemy_name=garnek alchemiczny
levels.level.barricade_desc=Drewniana barykada jest solidnie osadzona, ale wyschła przez lata. Czy może się spalić?
levels.level.barricade_name=Barykada
levels.level.bookshelf_name=Półka na książki
levels.level.chasm_desc=Nie widać dna.
levels.level.chasm_name=Przepaść
levels.level.closed_door_name=Zamknięte drzwi
levels.level.crystal_door_desc=Te zamknięte drzwi są wykonane z magicznego kryształu. Możesz przez nie patrzeć, ale do ich otwarcia potrzebny będzie kryształowy klucz.
levels.level.crystal_door_name=Drzwi kryształowe
levels.level.default_name=???
levels.level.embers_desc=Żar pokrywa podłogę.
levels.level.embers_name=Żar
levels.level.empty_well_desc=Studnia wyschła.
levels.level.empty_well_name=Pusta studnia
levels.level.entrace_name=Wejście głębokie
levels.level.entrance_desc=Schody prowadzą na górną głębokość.
levels.level.exit_desc=Schody prowadzą w dół, na niższą głębokość.
levels.level.exit_name=Wyjście głębinowe
levels.level.floor_name=Podłoga
levels.level.furrowed_grass_name=Roślinność bruzdowana
levels.level.grass_name=Trawa
levels.level.hidden_trap=Aktywuje się ukryty %s!
levels.level.high_grass_desc=Gęsta roślinność blokuje widok.
levels.level.high_grass_name=Wysoka trawa
levels.level.inactive_trap_desc=Pułapka już wcześniej została uruchomiona i nie jest już niebezpieczna.
levels.level.inactive_trap_name=Wyzwalana pułapka
levels.level.locked_door_desc=Te drzwi są zamknięte, aby je otworzyć, potrzebny jest pasujący klucz.
levels.level.locked_door_name=Zamknięte drzwi
levels.level.locked_exit_desc=Ciężkie kraty blokują schody prowadzące w dół.
levels.level.locked_exit_name=Zablokowane wyjście głębokościowe
levels.level.open_door_name=Otwarte drzwi
levels.level.pedestal_name=Piedestał
levels.level.statue_desc=Ktoś chciał ozdobić to miejsce, ale najwyraźniej mu się nie udało.
levels.level.statue_name=Statua
levels.level.unlocked_exit_name=Odblokowane wyjście na głębokość
levels.level.wall_name=Ściana
levels.level.water_desc=W przypadku oparzenia należy wejść do wody, aby ugasić ogień.
levels.level.water_name=Woda
levels.level.well_name=Dobrze
levels.mininglevel.barricade_desc=Drewniana barykada jest solidnie osadzona i pełni funkcję podpory dla sufitu.\n\nPrawdopodobnie została zbudowana przez gnolle, aby zapewnić ochronę przed spadającymi kamieniami. _Wszystkie sąsiednie cele będą chronione przed pułapkami i atakami spadających kamieni._\n\nWygląda na to, że spaliłaby się równie dobrze, jak każda inna barykada.
levels.mininglevel.boulder_desc=Drogę blokuje duży głaz. Powinien być dość łatwy do rozbicia kilofem.
levels.mininglevel.boulder_name=Otoczak
levels.mininglevel.crystal_desc=Znajduje się tu duży i kolorowy kryształ. Kryształy te są kruche i łatwo je rozbić kilofem, a także rozbiją się, jeśli coś zostanie wydobyte w ich pobliżu.
levels.mininglevel.crystal_name=Kryształowy kolec
levels.mininglevel.gold_extra_desc=Prawdopodobnie można go wydobyć kilofem.
levels.mininglevel.wall_desc=Gładka ściana skalna, nieco bardziej miękka niż zwykle. Można się przez nią przebić kilofem, ale będzie to wymagało trochę wysiłku i trochę zaostrzy apetyt.
levels.prisonlevel.bookshelf_desc=To prawdopodobnie pozostałość po bibliotece więziennej. Czy może spłonąć?
levels.prisonlevel.empty_deco_desc=Na podłodze są stare plamy krwi.
levels.prisonlevel.region_deco_alt_desc=Metalowa klatka, na tyle duża, by pomieścić jedną osobę. Wisi nad głęboką przepaścią, zawieszona na łańcuchu.
levels.prisonlevel.region_deco_alt_name=Klatka wisząca
levels.prisonlevel.region_deco_desc=Metalowa klatka, na tyle duża, że zmieści się w niej człowiek. Wygląda na to, że jest w jakiś sposób przytwierdzona do podłoża, nie da się jej ruszyć.
levels.prisonlevel.region_deco_name=Klatka więzienna
levels.prisonlevel.water_name=Ciemna, zimna woda
levels.rooms.quest.ambitiousimproom$questentrance.desc=Ta złowroga jama zdaje się być wejściem do starożytnego krasnoludzkiego skarbca. Magiczna bariera uniemożliwia wejście, można przejść po niej, jakby była tu podłoga.
levels.rooms.quest.ambitiousimproom$questentrance.name=Wejście do skarbca
levels.rooms.quest.blacksmithroom$questentrance.desc=Ta drabina prowadzi do starej kopalni, znajdującej się tuż pod kuźnią.
levels.rooms.quest.blacksmithroom$questentrance.name=Wejście do kopalni
levels.rooms.quest.massgraveroom$bones.desc=Kości walają się po podłodze. Co się tu stało?
levels.rooms.quest.massgraveroom$bones.name=Grób zbiorowy
levels.rooms.quest.mineentrance$questexit.desc=Ta drabina prowadzi z kopalni z powrotem do warsztatu kowala.
levels.rooms.quest.mineentrance$questexit.name=Wyjście z kopalni
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Malowany znacznik jakiegoś mrocznego rytuału. Świece zazwyczaj umieszcza się w czterech rogach.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Znak rytualny
levels.rooms.special.magicalfireroom$eternalfire.desc=Jest tu ściana gęstego, jaskrawozielonego ognia, najwyraźniej wywołanego magią. Jest tak gęsta, że nie da się przez nią przejść i podpala wszystko, co się zbliży. Nie wykazuje oznak naturalnego spalania, trzeba będzie jej czymś ugasić.
levels.rooms.special.sentryroom$sentry.desc=Ten krwistoczerwony strażnik najwyraźniej stoi tutaj, by strzec skarbu na drugim końcu pomieszczenia. Jeśli wejdziesz w obszar, którego broni, będzie strzelał do ciebie wiązkami magii dezintegracji.\n\nJest odporny na wszelkie szkodliwe efekty i widzi przez niewidzialność, ale wydaje się, że potrzebuje trochę czasu, aby się naładować, zanim zacznie strzelać.\n\nZ jakiegoś powodu strażnik chce strzelać tylko do ciebie, jakby wiedział, że mieszkańcy lochów nie stanowią zagrożenia dla skarbu.
levels.rooms.special.sentryroom$sentry.discover_hint=Tego wroga możesz spotkać w dowolnym miejscu lochu.
levels.rooms.special.sentryroom$sentry.name=czerwony wartownik
levels.rooms.special.toxicgasroom$toxicvent.desc=Jakiś nieostrożny poszukiwacz przygód musiał uruchomić tę pułapkę wieki temu. Pomimo stanu nieaktywnego, wciąż zieje toksycznym gazem do pomieszczenia i nic nie wskazuje na to, że przestanie. Jeśli chcesz zbadać to pomieszczenie, będziesz potrzebować sposobu, aby zapobiec obrażeniom wyrządzonym przez gaz.
levels.rooms.special.toxicgasroom$toxicvent.name=toksyczny otwór wentylacyjny
levels.rooms.special.weakfloorroom$hiddenwell.desc=Można dostrzec studnię gdzieś głęboko pod spodem. Może tam coś jest?
levels.rooms.special.weakfloorroom$hiddenwell.name=odległa studnia
levels.sewerlevel.bookshelf_desc=Półka jest pełna tanich, bezużytecznych książek. Czy może się spalić?
levels.sewerlevel.empty_deco_desc=Podłogę pokrywa wilgotny, żółtawy mech.
levels.sewerlevel.region_deco_desc=Solidna beczka, prawie tak duża jak ty. Musi być czymś wypełniona, jest za ciężka, żeby ją ruszyć.
levels.sewerlevel.region_deco_name=Beczka magazynowa
levels.sewerlevel.water_name=Mętna woda
levels.traps.alarmtrap.alarm=Pułapka wydaje przenikliwy dźwięk, który roznosi się echem po całym lochu!
levels.traps.alarmtrap.desc=Ta pułapka wydaje się być połączona z głośnym mechanizmem alarmowym. Jego uruchomienie prawdopodobnie zaalarmuje wszystko na poziomie.
levels.traps.alarmtrap.name=pułapka alarmowa
levels.traps.blazingtrap.desc=Nadepnięcie na tę pułapkę spowoduje zapłon silnej mieszanki chemicznej, która podpali duży obszar.
levels.traps.blazingtrap.name=płonąca pułapka
levels.traps.burningtrap.desc=Nadepnięcie na tę pułapkę spowoduje zapłon mieszanki chemicznej, która podpali cały obszar.
levels.traps.burningtrap.name=płonąca pułapka
levels.traps.chillingtrap.desc=Po aktywacji substancje chemiczne znajdujące się w pułapce szybko zamrożą powietrze w okolicy, w której się znajduje.
levels.traps.chillingtrap.name=pułapka chłodząca
levels.traps.confusiontrap.desc=Uruchomienie tej pułapki spowoduje uwolnienie w bezpośrednim otoczeniu chmury gazu dezorientującego.
levels.traps.confusiontrap.name=pułapka gazowa powodująca zamieszanie
levels.traps.corrosiontrap.desc=Uruchomienie tej pułapki spowoduje uwolnienie w bezpośrednim otoczeniu chmury śmiercionośnego, kwaśnego gazu.
levels.traps.corrosiontrap.name=pułapka na gaz żrący
levels.traps.cursingtrap.curse=Twój zużyty sprzęt staje się przeklęty!
levels.traps.cursingtrap.desc=Ta pułapka zawiera tę samą złowrogą magię, którą można znaleźć w przeklętym ekwipunku. Jej uruchomienie spowoduje przeklęcie niektórych przedmiotów w pobliżu.
levels.traps.cursingtrap.name=pułapka na przekleństwa
levels.traps.disarmingtrap.desc=Pułapka ta zawiera bardzo specyficzną magię teleportacyjną, która przenosi broń swojej ofiary w inne miejsce.
levels.traps.disarmingtrap.disarm=Twoja broń została teleportowana!
levels.traps.disarmingtrap.name=pułapka rozbrajająca
levels.traps.disintegrationtrap.desc=Po uruchomieniu pułapka ta zaatakuje najbliższy cel wiązkami dezintegracji, zadając znaczne obrażenia i niszcząc przedmioty.\n\nNa szczęście mechanizm uruchamiający nie jest ukryty.
levels.traps.disintegrationtrap.name=pułapka rozpadowa
levels.traps.disintegrationtrap.ondeath=Zostałeś zabity przez pułapkę dezintegrującą...
levels.traps.disintegrationtrap.one=Pułapka rozkłada Twoje %s!
levels.traps.disintegrationtrap.some=Pułapka rozkłada część Twoich %s!
levels.traps.distortiontrap.desc=Pułapka ta, zbudowana z dziwnej magii nieznanego pochodzenia, przywoła w to miejsce wszelkiego rodzaju stworzenia.
levels.traps.distortiontrap.name=pułapka zniekształceń
levels.traps.explosivetrap.desc=Ta pułapka zawiera ładunek wybuchowy w postaci proszku i mechanizm spustowy. Jej aktywacja spowoduje eksplozję w pobliżu.
levels.traps.explosivetrap.name=pułapka wybuchowa
levels.traps.flashingtrap.desc=Po aktywacji pułapka zapala silny, migający proch, który jest przechowywany w środku, tymczasowo oślepiając, paraliżując i raniąc ofiarę.\n\nPułapka musi mieć duży zapas prochu, ponieważ może być aktywowana wiele razy bez ryzyka pęknięcia.
levels.traps.flashingtrap.name=migająca pułapka
levels.traps.flocktrap.desc=Być może to żart jakiegoś amatorskiego maga, ale uruchomienie tej pułapki spowoduje powstanie stada magicznych owiec.
levels.traps.flocktrap.name=pułapka na stado
levels.traps.frosttrap.desc=Po aktywacji substancje chemiczne w tej pułapce szybko zamrożą powietrze w szerokim zakresie wokół miejsca jej umieszczenia.
levels.traps.frosttrap.name=pułapka mrozowa
levels.traps.gatewaytrap.desc=Ta specjalna pułapka teleportacyjna może aktywować się nieskończoną liczbę razy i zawsze teleportuje się w to samo miejsce.
levels.traps.gatewaytrap.name=pułapka bramkowa
levels.traps.geysertrap.desc=Po uruchomieniu pułapki wystrzeliwuje gejzer wody, który rani ognistych wrogów, odrzuca wszystkie pobliskie postacie, gasi pożary i zamienia otaczający teren w wodę.
levels.traps.geysertrap.name=pułapka gejzerowa
levels.traps.gnollrockfalltrap.desc=Ta pułapka na spadające kamienie została stworzona przy pomocy jakiejś formy magii. Po uruchomieniu, skały rozluźniają się i natychmiast spadają z góry na obszar 5x5 wokół niej. Ze względu na miększe skały w tym obszarze, pułapka nie zada tak dużych obrażeń jak zwykła pułapka na spadające kamienie, ale twój pancerz też nie będzie przeciwko niej skuteczny. Kamienie nie będą spadać również w miejscach z przyległą barykadą, ponieważ pomagają utrzymać sufit.\n\n_Ta pułapka nie odróżnia wrogów od przyjaciół, przez co jest równie szkodliwa dla gnoli, jak i dla ciebie._
levels.traps.gnollrockfalltrap.name=pułapka na spadające skały gnolli
levels.traps.grimtrap.desc=W tej pułapce znajduje się niezwykle potężna, niszczycielska magia, wystarczająca, by natychmiast zabić wszystkich bohaterów oprócz najzdrowszych. Jej aktywacja spowoduje wysłanie w kierunku najbliższej postaci zabójczej fali magii o dużym zasięgu.\n\nNa szczęście mechanizm aktywacji nie jest ukryty.
levels.traps.grimtrap.name=ponura pułapka
levels.traps.grimtrap.ondeath=Zginąłeś od eksplozji straszliwej pułapki...
levels.traps.grippingtrap.desc=Pułapka ta przyczepia się do stóp osoby, która ją uruchomi, zadając jej obrażenia i spowalniając jej ruchy.\n\nZ uwagi na swoją prostotę pułapki może ona aktywować się wiele razy, nie ulegając zniszczeniu.
levels.traps.grippingtrap.name=pułapka chwytająca
levels.traps.guardiantrap$guardian.desc=Ta niebieska zjawa wydaje się być przywołanym echem jednego z kamiennych strażników lochów.
levels.traps.guardiantrap$guardian.desc_weapon=Choć sama statua jest niemal bezcielesna, dzierżony przez nią _%s_ wygląda realistycznie.
levels.traps.guardiantrap$guardian.discover_hint=Tego wroga można znaleźć za pomocą specjalnej pułapki.
levels.traps.guardiantrap$guardian.name=wezwany strażnik
levels.traps.guardiantrap.alarm=Pułapka wydaje przenikliwy dźwięk, który roznosi się echem po całym lochu!
levels.traps.guardiantrap.desc=Pułapka ta jest powiązana ze dziwnym magicznym mechanizmem, który przywołuje strażników i alarmuje wszystkich wrogów na piętrze.
levels.traps.guardiantrap.name=pułapka strażnicza
levels.traps.oozetrap.desc=Po aktywacji pułapka rozpryskuje żrącą maź, która pali się aż do momentu jej wypłukania.
levels.traps.oozetrap.name=pułapka na szlam
levels.traps.pitfalltrap.desc=Ta pułapka jest połączona z dużym mechanizmem zapadniowym i wkrótce po jej uruchomieniu wszystko w jej pobliżu przebije się przez ziemię i spadnie! Nie zadziała jednak w pomieszczeniach z wyjątkowo solidnymi podłogami.
levels.traps.pitfalltrap.name=pułapka
levels.traps.pitfalltrap.no_pit=grunt jest zbyt twardy, aby pułapka mogła tu zadziałać.
levels.traps.pitfalltrap.triggered=Ziemia zaczyna ustępować miejsca uruchomionej pułapce!
levels.traps.pitfalltrap.triggered_hero=Ziemia zaczyna ustępować Ci miejsca!
levels.traps.poisondarttrap.desc=W pobliżu musi być ukryta mała dmuchawa do strzałek. Uruchomienie tej pułapki spowoduje wystrzelenie zatrutej strzałki w najbliższy cel.\n\nNa szczęście mechanizm spustowy nie jest ukryty.
levels.traps.poisondarttrap.name=pułapka z zatrutymi strzałkami
levels.traps.poisondarttrap.ondeath=Zostałeś zabity przez pułapkę z zatrutymi strzałkami...
levels.traps.rockfalltrap.desc=Ta pułapka jest połączona z serią luźnych kamieni powyżej, a jej uruchomienie spowoduje ich rozsypanie się na cały pokój! Jeśli pułapka nie znajduje się w konkretnym pomieszczeniu, kamienie będą spadać w obszarze wokół niej.\n\nNa szczęście mechanizm uruchamiający nie jest ukryty.
levels.traps.rockfalltrap.name=pułapka na spadające skały
levels.traps.rockfalltrap.ondeath=Zostałeś zmiażdżony przez pułapkę skalną...
levels.traps.shockingtrap.desc=Mechanizm z dużą ilością zmagazynowanej energii. Uruchomienie tej pułapki spowoduje rozładowanie tej energii w polu wokół niej.
levels.traps.shockingtrap.name=szokująca pułapka
levels.traps.stormtrap.desc=Mechanizm z ogromną ilością zmagazynowanej energii. Uruchomienie tej pułapki spowoduje rozładowanie tej energii, tworząc potężną burzę elektryczną.
levels.traps.stormtrap.name=pułapka burzowa
levels.traps.summoningtrap.desc=Uruchomienie tej pułapki spowoduje przywołanie w to miejsce pewnej liczby potworów z tego obszaru.
levels.traps.summoningtrap.name=pułapka przywołująca
levels.traps.teleportationtrap.desc=Za każdym razem, gdy pułapka ta zostanie uruchomiona, wszystko wokół niej zostanie teleportowane w losowe miejsca na tym piętrze.
levels.traps.teleportationtrap.name=pułapka teleportacyjna
levels.traps.tengudarttrap.desc=Tengu ewidentnie przygotowywał się do walki. Ta pułapka aktywuje ukrytą dmuchawę, która wystrzeli zatrutą strzałkę w najbliższy obiekt inny niż Tengu. \n\nPułapka jest tak dobrze wykonana, że mechanizm spustowy jest niemożliwy do wykrycia bez pomocy magii. Jednak pułapka jest widoczna przez chwilę, gdy jest rozstawiana.
levels.traps.toxictrap.desc=Uruchomienie tej pułapki spowoduje uwolnienie w okolicy chmury toksycznego gazu.
levels.traps.toxictrap.name=pułapka na toksyczny gaz
levels.traps.trap.discover_hint=Tę pułapkę można znaleźć losowo w lochach. W każdym regionie mogą pojawić się inne pułapki.
levels.traps.trap.rankings_desc=Zabity przez: %s
levels.traps.warpingtrap.desc=Ta pułapka jest podobna do pułapki teleportacyjnej, ale powoduje też, że bohater traci wiedzę na temat układu piętra!
levels.traps.warpingtrap.name=pułapka wypaczająca
levels.traps.weakeningtrap.desc=Czarna magia w tej pułapce wysysa energię z wszystkiego, co wejdzie z nią w kontakt. Potężni wrogowie mogą jednak oprzeć się temu efektowi.
levels.traps.weakeningtrap.name=osłabiająca pułapka
levels.traps.worndarttrap.desc=W pobliżu musi być ukryta mała dmuchawa do strzałek. Po uruchomieniu pułapki zostanie ona wystrzelona w najbliższy cel.\n\nZ uwagi na swój wiek nie jest zbyt szkodliwa, nawet nie jest ukryta...
levels.traps.worndarttrap.name=zużyta pułapka na strzałki
levels.traps.worndarttrap.ondeath=Zostałeś zabity przez zużytą pułapkę na strzałki...
levels.vaultlevel$vaultflametrap.desc=Wygląda na to, że z tego otworu wentylacyjnego co jakiś czas wydobywają się zielone płomienie. _Ponieważ to tylko obszar testowy, płomienie z otworów wentylacyjnych nie zrobią ci krzywdy._
levels.vaultlevel$vaultflametrap.name=otwór wentylacyjny sklepienia

levels.level.sign_desc=Stąd nie można przeczytać tekstu.
levels.level.sign_name=Podpisać
