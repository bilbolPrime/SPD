levels.cavesbosslevel.energy_desc=Der Boden hier sprüht Funken und ist gefährlich zu betreten. Die Funken scheinen sich in eine bestimmte Richtung zu bewegen... vielleicht führen sie zur Stromquelle?
levels.cavesbosslevel.gate_desc=Ein großes Metalltor versperrt den Weg in die Zwergenmetropole. Der Metallkasten in der Mitte brummt laut; er muss mit den Schaltkreisen und Maschinen in der Nähe verbunden sein. Vielleicht öffnet die Zerstörung von DM-300 das Tor?
levels.cavesbosslevel.gate_desc_broken=Das Tor muss in irgendeiner Weise mit DM-300 verbunden gewesen sein, da es explodierte, als DM-300 besiegt wurde. Jetzt sind nur noch Bruchstücke übrig.
levels.cavesbosslevel.gate_name=Metalltor
levels.cavesbosslevel.water_desc=Bei all dem Strom hier in der Gegend ist Wasser möglicherweise nicht immer sicher...
levels.cavesbosslevel.wires_desc=Der Boden ist hier teilweise aufgerissen und gibt den Blick auf einige große, freiliegende Drähte frei. Diese verbinden vermutlich die verschiedenen elektrischen Maschinen. Durch die Drähte fließt Strom. Wenn DM-300 hierher tritt, kann es möglicherweise Strom daraus beziehen.
levels.cavesbosslevel.wires_name=Freiliegende Kabel
levels.caveslevel.bookshelf_desc=Wer bräuchte schon ein Bücherregal in einer Höhle?
levels.caveslevel.entrance_desc=Die Leiter führt hinauf in die obere Ebene.
levels.caveslevel.exit_desc=Die Leiter führt hinab in die tiefere Ebene.
levels.caveslevel.grass_name=Fluoreszierendes Moos
levels.caveslevel.high_grass_desc=Riesige Pilze versperren die Sicht.
levels.caveslevel.high_grass_name=Fluoreszierende Pilze
levels.caveslevel.region_deco_desc=Eine große, ganz aus Metall gefertigte Konstruktion, vermutlich von den Zwergen errichtet, als sie hier noch Bergbau betrieben. Man meint, oben die Gleise einer längst stillgelegten Lore zu erkennen.
levels.caveslevel.region_deco_name=Metallkonstruktion
levels.caveslevel.wall_deco_desc=An der Wand ist eine Erzader sichtbar. Gold?
levels.caveslevel.water_name=Eiskaltes Wasser
levels.citybosslevel.summoning_desc=Dieser Sockel besitzt eine große Öffnung in der Mitte, die förmlich von dunkler Energie durchdrungen ist. Der Zwergenkönig nutzt diese Sockel als Brennpunkte seiner nekromantischen Magie und kann so Diener herbeirufen. Der Sockel muss sich einige Runden lang aufladen, bevor der Diener erscheint, und die Art des beschworenen Dieners wird durch die aufgebaute magische Kraft angezeigt.
levels.citybosslevel.summoning_name=Beschwörungspodest
levels.citybosslevel.throne_desc=Dieser beeindruckend große Thron ist der Sitz des Zwergenreichs, das nun von einem machthungrigen Nekromanten eingenommen wurde. Der Thron scheint einige magische oder mechanische Teile zu enthalten; der Zwergenkönig könnte zusätzliche Macht besitzen, wenn er darauf sitzt.
levels.citybosslevel.throne_name=Thron
levels.citylevel.bookshelf_desc=Die Reihen von Büchern zu verschiedenen Fachgebieten füllen das Bücherregal.
levels.citylevel.deco_desc=Hier fehlen mehrere Fliesen.
levels.citylevel.entrance_desc=Eine Rampe führt hinauf zur oberen Ebene.
levels.citylevel.exit_desc=Eine Rampe führt hinunter in die tiefere Ebene.
levels.citylevel.high_grass_name=Hochblühende Blumen
levels.citylevel.region_deco_desc=Ein erhöhter Sockel mit einer hellgrünen, magischen Flamme darauf. Die Flamme ist so dicht, dass sie fast fest wirkt.
levels.citylevel.region_deco_name=Flammender Sockel
levels.citylevel.sp_desc=Ein dicker Teppich bedeckt den Boden.
levels.citylevel.statue_desc=Die Statue stellt einen Zwerg in heroischer Pose dar.
levels.citylevel.upcoming_quest_intro_no=Bleiben Sie hier.
levels.citylevel.upcoming_quest_intro_title=Entwicklermitteilung
levels.citylevel.upcoming_quest_intro_yes=Steige hinab in das Gewölbe
levels.citylevel.water_name=Verdächtig gefärbtes Wasser
levels.features.chasm.chasm=Kluft
levels.features.chasm.jump=Willst du wirklich in den Abgrund springen? Ein Sturz aus dieser Tiefe wird schmerzhaft sein.
levels.features.chasm.no=Nein, ich habe meine Meinung geändert
levels.features.chasm.ondeath=Du bist in den Tod gestürzt...
levels.features.chasm.rankings_desc=Beim Aufprall verstarb
levels.features.chasm.yes=Ja, ich weiß, was ich tue.
levels.hallslevel.bookshelf_desc=Bücher in alten Sprachen glimmen im Bücherregal vor sich hin.
levels.hallslevel.grass_name=Glutmoos
levels.hallslevel.high_grass_name=Glühpilze
levels.hallslevel.region_deco_desc=Ein riesiges Stück Stein, das anscheinend von der Decke oder einer nahegelegenen Wand abgebrochen ist.
levels.hallslevel.region_deco_name=Schuttbrocken
levels.hallslevel.statue_desc=Die Säule besteht aus echten humanoiden Schädeln. Wahnsinn!
levels.hallslevel.statue_name=Säule
levels.hallslevel.water_desc=Es sieht aus wie Lava, ist aber kalt und wahrscheinlich gefahrlos zu berühren.
levels.hallslevel.water_name=Kalte Lava
levels.level$feeling.chasm_desc=Deine Schritte hallen durch das Verlies.
levels.level$feeling.chasm_title=Kluftboden
levels.level$feeling.dark_desc=Man kann die Feinde in der Dunkelheit bewegen hören.
levels.level$feeling.dark_title=dunkler Boden
levels.level$feeling.grass_desc=Der Duft von Vegetation liegt schwer in der Luft.
levels.level$feeling.grass_title=Grasboden
levels.level$feeling.large_desc=Dieser Dungeonboden wirkt ungewöhnlich groß.
levels.level$feeling.large_title=großer Boden
levels.level$feeling.secrets_desc=Die Atmosphäre lässt vermuten, dass diese Etage viele Geheimnisse birgt.
levels.level$feeling.secrets_title=Geheimnisse-Etage
levels.level$feeling.traps_desc=Der Untergrund scheint hier besonders tückisch zu sein.
levels.level$feeling.traps_title=Fallenboden
levels.level$feeling.water_desc=Du hörst Wasser um dich herum spritzen.
levels.level$feeling.water_title=Wasserboden
levels.level.alchemy_desc=Dieser Topf ist mit magischem Wasser gefüllt. Man kann verschiedene Gegenstände hineingeben und etwas Neues erschaffen!
levels.level.alchemy_name=Alchemietopf
levels.level.barricade_desc=Die Holzbarrikade steht fest, ist aber über die Jahre ausgetrocknet. Könnte sie brennen?
levels.level.barricade_name=Barrikade
levels.level.bookshelf_name=Bücherregal
levels.level.chasm_desc=Man kann den Boden nicht sehen.
levels.level.chasm_name=Kluft
levels.level.closed_door_name=Geschlossene Tür
levels.level.crystal_door_desc=Diese verschlossene Tür besteht aus magischem Kristall. Man kann hindurchsehen, aber man benötigt einen Kristallschlüssel, um sie zu öffnen.
levels.level.crystal_door_name=Kristalltür
levels.level.default_name=???
levels.level.embers_desc=Glut bedeckt den Boden.
levels.level.embers_name=Glut
levels.level.empty_well_desc=Der Brunnen ist versiegt.
levels.level.empty_well_name=Leerer Brunnen
levels.level.entrace_name=Tiefeneingang
levels.level.entrance_desc=Eine Treppe führt hinauf in die obere Ebene.
levels.level.exit_desc=Eine Treppe führt hinunter in die tiefere Ebene.
levels.level.exit_name=Tiefenausstieg
levels.level.floor_name=Boden
levels.level.furrowed_grass_name=gefurchte Vegetation
levels.level.grass_name=Gras
levels.level.hidden_trap=Ein versteckter %s wird aktiviert!
levels.level.high_grass_desc=Dichte Vegetation versperrt die Sicht.
levels.level.high_grass_name=Hohes Gras
levels.level.inactive_trap_desc=Die Falle wurde schon einmal ausgelöst und ist jetzt nicht mehr gefährlich.
levels.level.inactive_trap_name=Ausgelöste Falle
levels.level.locked_door_desc=Diese Tür ist verschlossen, Sie benötigen einen passenden Schlüssel, um sie zu öffnen.
levels.level.locked_door_name=Verschlossene Tür
levels.level.locked_exit_desc=Schwere Gitterstäbe versperren den Weg nach unten.
levels.level.locked_exit_name=Verriegelter Tiefenausgang
levels.level.open_door_name=Offene Tür
levels.level.pedestal_name=Sockel
levels.level.statue_desc=Jemand wollte diesen Ort verschönern, ist aber offensichtlich gescheitert.
levels.level.statue_name=Statue
levels.level.unlocked_exit_name=Tiefenausgang freigeschaltet
levels.level.wall_name=Wand
levels.level.water_desc=Im Brandfall ins Wasser treten, um das Feuer zu löschen.
levels.level.water_name=Wasser
levels.level.well_name=Also
levels.mininglevel.barricade_desc=Die Holzbarrikade steht fest und stützt die Decke. Sie wurde vermutlich von den Gnollen errichtet, um Schutz vor herabfallenden Steinen zu bieten. Angrenzende Zellen sind dadurch vor Steinschlagfallen und Angriffen geschützt. Sieht so aus, als würde sie genauso gut brennen wie jede andere Barrikade.
levels.mininglevel.boulder_desc=Ein großer Felsbrocken versperrt den Weg. Er sollte sich mit einer Spitzhacke recht einfach zerschlagen lassen.
levels.mininglevel.boulder_name=Felsblock
levels.mininglevel.crystal_desc=Hier befindet sich ein großer, farbenprächtiger Kristallvorkommen. Diese Kristalle sind zerbrechlich und können leicht mit einer Spitzhacke zerbrochen werden; sie zerbrechen auch, wenn in ihrer Nähe etwas abgebaut wird.
levels.mininglevel.crystal_name=Kristallspitze
levels.mininglevel.gold_extra_desc=Du kannst es wahrscheinlich mit deiner Spitzhacke abbauen.
levels.mininglevel.wall_desc=Eine glatte Felswand, die etwas weicher als gewöhnlich ist. Du kannst sie mit deiner Spitzhacke abbauen, aber es wird etwas Mühe kosten und deinen Hunger etwas steigern.
levels.prisonlevel.bookshelf_desc=Dies ist vermutlich ein Überbleibsel einer Gefängnisbibliothek. Könnte sie abbrennen?
levels.prisonlevel.empty_deco_desc=Auf dem Boden befinden sich alte Blutflecken.
levels.prisonlevel.region_deco_alt_desc=Ein metallener Käfig, gerade groß genug, um einen Menschen aufzunehmen. Er hängt an einer Kette über einem tiefen Abgrund.
levels.prisonlevel.region_deco_alt_name=Hängekäfig
levels.prisonlevel.region_deco_desc=Ein Metallkäfig, gerade groß genug, um eine Person aufzunehmen. Er scheint irgendwie am Boden befestigt zu sein; man kann ihn nicht bewegen.
levels.prisonlevel.region_deco_name=Gefängniskäfig
levels.prisonlevel.water_name=Dunkles, kaltes Wasser
levels.rooms.quest.ambitiousimproom$questentrance.desc=Diese unheilvolle Grube scheint der Eingang zu einem uralten Zwergengruft zu sein. Eine magische Barriere versperrt den Zutritt; man kann darüber laufen, als gäbe es hier einen Boden.
levels.rooms.quest.ambitiousimproom$questentrance.name=Tresoreingang
levels.rooms.quest.blacksmithroom$questentrance.desc=Diese Leiter führt zu einem alten Bergwerk direkt unterhalb der Schmiede.
levels.rooms.quest.blacksmithroom$questentrance.name=Mineneingang
levels.rooms.quest.massgraveroom$bones.desc=Knochen liegen überall auf dem Boden, was ist hier geschehen?
levels.rooms.quest.massgraveroom$bones.name=Massengrab
levels.rooms.quest.mineentrance$questexit.desc=Diese Leiter führt aus der Mine hinaus, zurück in die Schmiede.
levels.rooms.quest.mineentrance$questexit.name=Minenausgang
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Ein bemalter Marker für ein düsteres Ritual. Üblicherweise werden an den vier Ecken Kerzen aufgestellt.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritualmarkierung
levels.rooms.special.magicalfireroom$eternalfire.desc=Hier befindet sich eine Wand aus dichtem, hellgrünem Feuer, scheinbar durch Magie entstanden. Sie ist so dicht, dass man sich nicht hindurchbewegen kann, und alles, was ihr zu nahe kommt, entzündet sich. Sie brennt nicht von selbst ab; man muss sie mit etwas löschen.
levels.rooms.special.sentryroom$sentry.desc=Diese blutrote Wache scheint hier positioniert zu sein, um den Schatz am anderen Ende des Raumes zu bewachen. Sie feuert Desintegrationszauber auf dich ab, wenn du den von ihr verteidigten Bereich betrittst. Sie ist immun gegen alle schädlichen Effekte und kann Unsichtbarkeit durchschauen, benötigt aber anscheinend eine Weile zum Aufladen, bevor sie feuert. Irgendwie will die Wache nur auf dich feuern, als ob sie wüsste, dass die Bewohner des Verlieses keine Bedrohung für den Schatz darstellen.
levels.rooms.special.sentryroom$sentry.discover_hint=Diesen Gegner kann man überall im Dungeon finden.
levels.rooms.special.sentryroom$sentry.name=roter Wächter
levels.rooms.special.toxicgasroom$toxicvent.desc=Ein unvorsichtiger Abenteurer muss diese Falle vor langer Zeit ausgelöst haben. Obwohl sie inaktiv ist, stößt sie immer noch giftiges Gas in den Raum aus und es gibt keine Anzeichen dafür, dass sie damit aufhört. Um diesen Raum zu erkunden, benötigen Sie eine Möglichkeit, sich vor dem Gas zu schützen.
levels.rooms.special.toxicgasroom$toxicvent.name=Giftwasserentlüftung
levels.rooms.special.weakfloorroom$hiddenwell.desc=Man kann in der Tiefe gerade noch einen Brunnen erkennen, vielleicht ist da unten etwas?
levels.rooms.special.weakfloorroom$hiddenwell.name=entfernter Brunnen
levels.sewerlevel.bookshelf_desc=Das Bücherregal ist vollgestopft mit billigen, nutzlosen Büchern. Könnte es brennen?
levels.sewerlevel.empty_deco_desc=Der Boden ist mit feuchtem, gelblichem Moos bedeckt.
levels.sewerlevel.region_deco_desc=Ein dickes Fass, fast so groß wie du. Es muss mit irgendetwas gefüllt sein, es ist zu schwer, um es zu bewegen.
levels.sewerlevel.region_deco_name=Lagerfass
levels.sewerlevel.water_name=Trübes Wasser
levels.traps.alarmtrap.alarm=Die Falle erzeugt einen durchdringenden Ton, der im ganzen Verlies widerhallt!
levels.traps.alarmtrap.desc=Diese Falle scheint mit einem lauten Alarmmechanismus verbunden zu sein. Wenn dieser ausgelöst wird, werden wahrscheinlich alle Personen auf der Ebene alarmiert.
levels.traps.alarmtrap.name=Alarmfalle
levels.traps.blazingtrap.desc=Tritt man auf diese Falle, entzündet sich ein starkes chemisches Gemisch, das ein weites Gebiet in Brand setzt.
levels.traps.blazingtrap.name=brennende Falle
levels.traps.burningtrap.desc=Tritt man auf diese Falle, entzündet sich ein chemisches Gemisch, wodurch die Umgebung in Brand gerät.
levels.traps.burningtrap.name=Brennfalle
levels.traps.chillingtrap.desc=Wenn die Chemikalien in dieser Falle aktiviert werden, gefrieren sie die Luft um ihren Standort herum rasend schnell.
levels.traps.chillingtrap.name=eisige Falle
levels.traps.confusiontrap.desc=Durch Auslösen dieser Falle wird in der unmittelbaren Umgebung eine Wolke aus Verwirrungsgas freigesetzt.
levels.traps.confusiontrap.name=Verwirrungsgasfalle
levels.traps.corrosiontrap.desc=Durch Auslösen dieser Falle wird eine Wolke aus tödlichem Säuregas in der unmittelbaren Umgebung freigesetzt.
levels.traps.corrosiontrap.name=Korrosionsgasfalle
levels.traps.cursingtrap.curse=Deine abgenutzte Ausrüstung wird verflucht!
levels.traps.cursingtrap.desc=Diese Falle enthält dieselbe bösartige Magie wie verfluchte Ausrüstung. Durch Auslösen werden einige Gegenstände in der unmittelbaren Umgebung verflucht.
levels.traps.cursingtrap.name=Fluchfalle
levels.traps.disarmingtrap.desc=Diese Falle enthält eine ganz spezielle Teleportationsmagie, die die Waffe des Opfers an einen anderen Ort teleportiert.
levels.traps.disarmingtrap.disarm=Deine Waffe wurde wegteleportiert!
levels.traps.disarmingtrap.name=Entschärfungsfalle
levels.traps.disintegrationtrap.desc=Wird diese Falle ausgelöst, durchbohrt sie das nächstgelegene Ziel mit Desintegrationsstrahlen, verursacht erheblichen Schaden und zerstört Gegenstände. Glücklicherweise ist der Auslösemechanismus nicht versteckt.
levels.traps.disintegrationtrap.name=Zerfallsfalle
levels.traps.disintegrationtrap.ondeath=Du wurdest von der Desintegrationsfalle getötet...
levels.traps.disintegrationtrap.one=Die Falle zersetzt dein %s!
levels.traps.disintegrationtrap.some=Die Falle zersetzt einen Teil Ihres %s!
levels.traps.distortiontrap.desc=Diese Falle, die durch seltsame Magie unbekannter Herkunft erschaffen wurde, wird alle möglichen Kreaturen an diesen Ort rufen.
levels.traps.distortiontrap.name=Verzerrungsfalle
levels.traps.explosivetrap.desc=Diese Falle enthält Sprengstoffpulver und einen Auslösemechanismus. Durch Aktivierung wird eine Explosion in der unmittelbaren Umgebung verursacht.
levels.traps.explosivetrap.name=Sprengfalle
levels.traps.flashingtrap.desc=Bei Aktivierung entzündet diese Falle ein darin gelagertes, starkes Blitzpulver, das das Opfer vorübergehend blendet, lähmt und verletzt. Die Falle muss über einen großen Pulvervorrat verfügen, da sie viele Male auslösen kann, ohne kaputt zu gehen.
levels.traps.flashingtrap.name=blinkende Falle
levels.traps.flocktrap.desc=Vielleicht ein Scherz eines Amateurmagiers; wer diese Falle auslöst, erzeugt eine Herde magischer Schafe.
levels.traps.flocktrap.name=Herdenfalle
levels.traps.frosttrap.desc=Wenn die Chemikalien in dieser Falle aktiviert werden, gefrieren sie die Luft in einem weiten Umkreis um ihren Standort schnell ein.
levels.traps.frosttrap.name=Frostfalle
levels.traps.gatewaytrap.desc=Diese spezielle Teleportationsfalle kann unendlich oft aktiviert werden und teleportiert immer zum selben Ort.
levels.traps.gatewaytrap.name=Torfalle
levels.traps.geysertrap.desc=Wird diese Falle ausgelöst, schießt ein Wassergeysir hervor, der feurige Feinde schädigt, alle Charaktere in der Nähe wegstößt, Feuer löscht und das umliegende Gelände in Wasser verwandelt.
levels.traps.geysertrap.name=Geysirfalle
levels.traps.gnollrockfalltrap.desc=Diese Steinschlagfalle wird mithilfe von Magie hergestellt. Bei Auslösung lockern sich Felsen und fallen sofort in einem 5x5-Feld um sie herum von oben herab. Da die Felsen in diesem Bereich weicher sind, richtet sie weniger Schaden an als eine normale Steinschlagfalle, aber deine Rüstung bietet ihr dennoch keinen Schutz. Felsen fallen auch nicht in Bereiche mit angrenzenden Barrikaden, da diese die Decke stützen. Diese Falle kann Freund und Feind nicht unterscheiden und ist daher für die Gnolle genauso gefährlich wie für dich.
levels.traps.gnollrockfalltrap.name=Gnoll-Steinschlagfalle
levels.traps.grimtrap.desc=In dieser Falle ist extrem starke, zerstörerische Magie gespeichert, genug, um alle Helden außer den gesündesten sofort zu töten. Durch Auslösen wird ein tödlicher Magiestrahl auf den nächstgelegenen Charakter abgefeuert. Glücklicherweise ist der Auslösemechanismus nicht versteckt.
levels.traps.grimtrap.name=grimmige Falle
levels.traps.grimtrap.ondeath=Du wurdest durch die Explosion einer grausamen Falle getötet...
levels.traps.grippingtrap.desc=Diese Falle verhakt sich an den Füßen desjenigen, der sie auslöst, fügt ihm Schaden zu und verlangsamt seine Bewegung. Aufgrund ihrer einfachen Bauweise kann diese Falle viele Male ausgelöst werden, ohne kaputt zu gehen.
levels.traps.grippingtrap.name=greifende Falle
levels.traps.guardiantrap$guardian.desc=Diese blaue Erscheinung scheint ein heraufbeschworenes Echo eines der steinernen Wächter des Verlieses zu sein.
levels.traps.guardiantrap$guardian.desc_weapon=Während die Statue selbst fast körperlos wirkt, sieht das _%s_, das sie hält, echt aus.
levels.traps.guardiantrap$guardian.discover_hint=Diesen Gegner kann man mit einer speziellen Falle aufspüren.
levels.traps.guardiantrap$guardian.name=herbeigerufener Wächter
levels.traps.guardiantrap.alarm=Die Falle erzeugt einen durchdringenden Ton, der im ganzen Verlies widerhallt!
levels.traps.guardiantrap.desc=Diese Falle ist mit einem seltsamen magischen Mechanismus verbunden, der Wächter herbeiruft und alle Feinde auf der Ebene alarmiert.
levels.traps.guardiantrap.name=Wächterfalle
levels.traps.oozetrap.desc=Diese Falle verspritzt beim Aktivieren ätzenden Schlamm, der so lange brennt, bis er weggespült wird.
levels.traps.oozetrap.name=Schleimfalle
levels.traps.pitfalltrap.desc=Diese Falle ist mit einem großen Falltürmechanismus verbunden, und kurz nach dessen Auslösung rutscht alles, was sich in ihrer Nähe befindet, durch den Boden und fällt herunter! In Bereichen mit besonders festen Böden funktioniert sie allerdings nicht.
levels.traps.pitfalltrap.name=Fallgrube
levels.traps.pitfalltrap.no_pit=Der Boden ist hier zu fest, als dass eine Fallgrube funktionieren könnte.
levels.traps.pitfalltrap.triggered=Der Boden gibt um die ausgelöste Falle herum nach!
levels.traps.pitfalltrap.triggered_hero=Der Boden um dich herum gibt nach!
levels.traps.poisondarttrap.desc=Ein kleiner Pfeilwerfer muss in der Nähe versteckt sein; durch Aktivierung dieser Falle wird ein vergifteter Pfeil auf das nächstgelegene Ziel abgefeuert. Glücklicherweise ist der Auslösemechanismus nicht versteckt.
levels.traps.poisondarttrap.name=Giftpfeilfalle
levels.traps.poisondarttrap.ondeath=Du wurdest von der Giftpfeilfalle getötet...
levels.traps.rockfalltrap.desc=Diese Falle ist mit einer Reihe loser Steine darüber verbunden. Wird sie ausgelöst, stürzen diese über den gesamten Raum herab! Befindet sich die Falle nicht in einem bestimmten Raum, fallen die Steine stattdessen in einem Bereich um die Falle herum. Zum Glück ist der Auslösemechanismus nicht versteckt.
levels.traps.rockfalltrap.name=Steinschlagfalle
levels.traps.rockfalltrap.ondeath=Du wurdest von der Steinschlagfalle verschüttet...
levels.traps.shockingtrap.desc=Ein Mechanismus, der eine große Menge an Energie speichert. Durch Auslösen dieser Falle wird diese Energie in ein umgebendes Feld entladen.
levels.traps.shockingtrap.name=Schockierende Falle
levels.traps.stormtrap.desc=Ein Mechanismus, der eine enorme Menge an Energie speichert. Durch Auslösen dieser Falle wird diese Energie in einem gewaltigen Gewitter entladen.
levels.traps.stormtrap.name=Sturmfalle
levels.traps.summoningtrap.desc=Durch Auslösen dieser Falle werden zahlreiche Monster aus diesem Gebiet an diesen Ort beschworen.
levels.traps.summoningtrap.name=Beschwörungsfalle
levels.traps.teleportationtrap.desc=Immer wenn diese Falle ausgelöst wird, wird alles um sie herum an zufällige Orte auf dieser Etage teleportiert.
levels.traps.teleportationtrap.name=Teleportationsfalle
levels.traps.tengudarttrap.desc=Tengu hat sich offensichtlich auf einen Kampf vorbereitet. Diese Falle aktiviert einen versteckten Pfeilwerfer, der einen Giftpfeil auf das nächste Wesen abfeuert, das nicht Tengu ist. Die Falle ist so gut konstruiert, dass der Auslösemechanismus ohne magische Hilfe nicht zu erkennen ist. Allerdings ist die Falle beim Aufstellen kurz sichtbar.
levels.traps.toxictrap.desc=Durch Auslösen dieser Falle wird eine Wolke giftigen Gases in der Umgebung freigesetzt.
levels.traps.toxictrap.name=Giftgasfalle
levels.traps.trap.discover_hint=Diese Falle kann zufällig im Dungeon gefunden werden. In jeder Region gibt es unterschiedliche Fallen.
levels.traps.trap.rankings_desc=Getötet von: %s
levels.traps.warpingtrap.desc=Diese Falle ähnelt einer Teleportationsfalle, führt aber zusätzlich dazu, dass der Held sein Wissen über den Grundriss des Stockwerks verliert!
levels.traps.warpingtrap.name=Verzerrungsfalle
levels.traps.weakeningtrap.desc=Die dunkle Magie dieser Falle saugt allem, was mit ihr in Berührung kommt, die Energie aus. Mächtige Gegner könnten dem Effekt jedoch widerstehen.
levels.traps.weakeningtrap.name=Schwächungsfalle
levels.traps.worndarttrap.desc=Ein kleiner Blasrohrpfeil muss in der Nähe versteckt sein. Durch Aktivierung dieser Falle wird das nächste Ziel angeschossen. Aufgrund ihres Alters ist sie allerdings nicht sehr gefährlich; sie ist ja nicht einmal versteckt...
levels.traps.worndarttrap.name=abgenutzte Pfeilfalle
levels.traps.worndarttrap.ondeath=Du wurdest von der abgenutzten Pfeilfalle getötet...
levels.vaultlevel$vaultflametrap.desc=Diese Lüftungsöffnung scheint in regelmäßigen Abständen grüne Flammen auszustoßen. _Da es sich hier nur um einen Testbereich handelt, stellen die Flammen aus den Lüftungsöffnungen keine Gefahr für Sie dar._
levels.vaultlevel$vaultflametrap.name=Gewölbeflammenentlüftung

levels.level.sign_desc=Von hier aus kann man den Text nicht lesen.
levels.level.sign_name=Zeichen
