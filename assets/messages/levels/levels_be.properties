levels.cavesbosslevel.energy_desc=Зямля тут іскрыцца ад электрычнасці, і наступаць на яе шкодна. _Іскры, здаецца, рухаюцца ў пэўным кірунку..._ магчыма, яны вядуць да крыніцы энергіі?
levels.cavesbosslevel.gate_desc=Вялікая металічная брама, якая перакрывае шлях у гномскі мегаполіс. Металічная скрынка ў цэнтры выдае гучны гудзенне, яна, напэўна, падключана да электрычнай сеткі і машын побач. Магчыма, знішчэнне DM-300 адчыніць браму?
levels.cavesbosslevel.gate_desc_broken=Брама, відаць, была нейкім чынам злучана з DM-300, бо яна выбухнула, калі DM-300 быў пераможаны. Цяпер ад яе засталіся толькі аскепкі.
levels.cavesbosslevel.gate_name=Металічная брама
levels.cavesbosslevel.water_desc=З улікам усёй гэтай электрычнасці, вада не заўсёды бяспечная...
levels.cavesbosslevel.wires_desc=Тут часткова раскапана зямля, на якой бачныя вялікія аголеныя правады. Яны, напэўна, злучаюць розныя электрычныя машыны.\n\n Па правадах павінен праходзіць ток. Калі DM-300 ступіць сюды, ён можа атрымліваць ад іх энергію.
levels.cavesbosslevel.wires_name=Адкрытая праводка
levels.caveslevel.bookshelf_desc=Каму патрэбна кніжная паліца ў пячоры?
levels.caveslevel.entrance_desc=Лесвіца вядзе наверх, на верхнюю глыбіню.
levels.caveslevel.exit_desc=Лесвіца вядзе ўніз, на ніжнюю глыбіню.
levels.caveslevel.grass_name=Флуарэсцэнтны мох
levels.caveslevel.high_grass_desc=Вялізныя грыбы засланяюць від.
levels.caveslevel.high_grass_name=Флуарэсцэнтныя грыбы
levels.caveslevel.region_deco_desc=Вялікая суцэльнаметалічная канструкцыя, верагодна, пабудаваная гномамі, калі яны здабывалі тут карысныя выкапні. Здаецца, што ўздоўж вяршыні пралягаюць даўно забытыя рэйкі для шахтных вагонет.
levels.caveslevel.region_deco_name=Металічная канструкцыя
levels.caveslevel.wall_deco_desc=На сцяне бачная жыла нейкай руды. Золата?
levels.caveslevel.water_name=Ледзяная вада
levels.citybosslevel.summoning_desc=Гэты пастамент мае вялікую адтуліну ў цэнтры, якая практычна выпраменьваецца цёмнай энергіяй.\n\nКароль гномаў выкарыстоўвае гэтыя пастаменты ў якасці цэнтраў для сваёй некрамантычнай магіі і можа заклікаць на іх паслугачоў. Пастамент павінен зараджацца некалькі хадоў, перш чым з'явіцца паслугач, а тып выкліканага паслугача паведамляецца магічнай сілай будынка.
levels.citybosslevel.summoning_name=Пастамент выкліку
levels.citybosslevel.throne_desc=Гэты ўражліва вялікі трон — рэзідэнцыя гномскай імперыі, якой цяпер кіруе апантаны ўладай некрамант.\n\nЗдаецца, што на троне ёсць нейкія магічныя або механічныя часткі, таму Кароль гномаў можа мець дадатковую сілу, калі сядзіць на ім.
levels.citybosslevel.throne_name=Трон
levels.citylevel.bookshelf_desc=Кніжныя паліцы запоўнены шэрагамі кніг па розных дысцыплінах.
levels.citylevel.deco_desc=Тут адсутнічае некалькі плітак.
levels.citylevel.entrance_desc=Да верхняй глыбіні вядзе пандус.
levels.citylevel.exit_desc=Пандус вядзе ўніз, на меншую глыбіню.
levels.citylevel.high_grass_name=Высокаквітнеючыя кветкі
levels.citylevel.region_deco_desc=Узвышаны пастамент з ярка-зялёным чароўным полымем наверсе. Полымя такое шчыльнае, што магло б быць і цвёрдым.
levels.citylevel.region_deco_name=Палымяны пастамент
levels.citylevel.sp_desc=Падлогу пакрывае тоўсты дыван.
levels.citylevel.statue_desc=Статуя адлюстроўвае нейкага карліка, які стаіць у гераічнай позе.
levels.citylevel.upcoming_quest_intro_no=Заставайцеся тут
levels.citylevel.upcoming_quest_intro_title=Паведамленне распрацоўшчыка
levels.citylevel.upcoming_quest_intro_yes=Спусціцеся ў сховішча
levels.citylevel.water_name=Падазрона афарбаваная вада
levels.features.chasm.chasm=Бездань
levels.features.chasm.jump=Ты сапраўды хочаш скокнуць у прорву? Падзенне з такой глыбіні будзе балючым.
levels.features.chasm.no=Не, я перадумаў
levels.features.chasm.ondeath=Ты ўпаў на смерць...
levels.features.chasm.rankings_desc=Памёр пры ўдары
levels.features.chasm.yes=Так, я ведаю, што раблю
levels.hallslevel.bookshelf_desc=На кніжнай паліцы тлеюць кнігі на старажытных мовах.
levels.hallslevel.grass_name=Эмбермох
levels.hallslevel.high_grass_name=Эмберфуні
levels.hallslevel.region_deco_desc=Вялізны кавалак каменя, які, здаецца, адкалоўся ад столі або бліжэйшай сцяны.
levels.hallslevel.region_deco_name=Кавалак друзу
levels.hallslevel.statue_desc=Слуп зроблены з сапраўдных гуманоідных чэрапаў. Выдатна.
levels.hallslevel.statue_name=Слуп
levels.hallslevel.water_desc=Гэта выглядае як лава, але яна халодная і, верагодна, бяспечная для дакрананняў.
levels.hallslevel.water_name=Халодная лава
levels.level$feeling.chasm_desc=Твае крокі адгукаюцца рэхам па падзямеллі.
levels.level$feeling.chasm_title=дно прорвы
levels.level$feeling.dark_desc=У цемры можна пачуць, як рухаюцца ворагі.
levels.level$feeling.dark_title=цёмная падлога
levels.level$feeling.grass_desc=У паветры лунае густы пах расліннасці.
levels.level$feeling.grass_title=травяная падлога
levels.level$feeling.large_desc=Гэты паверх падзямелля здаецца незвычайна вялікім.
levels.level$feeling.large_title=вялікая падлога
levels.level$feeling.secrets_desc=Атмасфера намякае на тое, што гэты паверх хавае шмат таямніц.
levels.level$feeling.secrets_title=падлога сакрэтаў
levels.level$feeling.traps_desc=Зямля тут здаецца асабліва падступнай.
levels.level$feeling.traps_title=падлога для пастак
levels.level$feeling.water_desc=Ты чуеш, як вакол цябе плюхаецца вада.
levels.level$feeling.water_title=вадзяная падлога
levels.level.alchemy_desc=Гэты гаршчок напоўнены чароўнай вадой. У гаршку можна змешваць розныя рэчы, каб стварыць нешта новае!
levels.level.alchemy_name=алхімічны гаршчок
levels.level.barricade_desc=Драўляная барыкада трывала ўсталяваная, але з гадамі высахла. Ці можа яна згарэць?
levels.level.barricade_name=Барыкада
levels.level.bookshelf_name=Кніжная паліца
levels.level.chasm_desc=Дна не відаць.
levels.level.chasm_name=Бездань
levels.level.closed_door_name=Зачыненыя дзверы
levels.level.crystal_door_desc=Гэтыя замкнёныя дзверы зроблены з чароўнага крышталю. Вы можаце бачыць скрозь іх, але вам спатрэбіцца крыштальны ключ, каб іх адчыніць.
levels.level.crystal_door_name=Крыштальныя дзверы
levels.level.default_name=???
levels.level.embers_desc=Падлогу пакрываюць вуголлі.
levels.level.embers_name=Вуголлі
levels.level.empty_well_desc=Калодзеж высах.
levels.level.empty_well_name=Пусты калодзеж
levels.level.entrace_name=Глыбіня ўваходу
levels.level.entrance_desc=Лесвіца вядзе наверх, на верхнюю глыбіню.
levels.level.exit_desc=Лесвіца вядзе ўніз, на ніжнюю глыбіню.
levels.level.exit_name=Выхад з глыбіні
levels.level.floor_name=Падлога
levels.level.furrowed_grass_name=Бороздчатая расліннасць
levels.level.grass_name=Трава
levels.level.hidden_trap=Схаваны %s актывуецца!
levels.level.high_grass_desc=Густая расліннасць засланяе агляд.
levels.level.high_grass_name=Высокая трава
levels.level.inactive_trap_desc=Пастка ўжо спрацавала раней, і яна больш не небяспечная.
levels.level.inactive_trap_name=Пастка, якая спрацавала
levels.level.locked_door_desc=Гэтыя дзверы зачыненыя, вам патрэбен адпаведны ключ, каб іх адчыніць.
levels.level.locked_door_name=Зачыненыя дзверы
levels.level.locked_exit_desc=Тоўстыя краты перакрываюць лесвіцу, якая вядзе ўніз.
levels.level.locked_exit_name=Заблакіраваны выхад з глыбіні
levels.level.open_door_name=Адчыненыя дзверы
levels.level.pedestal_name=Пастамент
levels.level.statue_desc=Хтосьці хацеў упрыгожыць гэтае месца, але, відавочна, не атрымалася.
levels.level.statue_name=Статуя
levels.level.unlocked_exit_name=Выхад з разблакіраванай глыбіні
levels.level.wall_name=Сцяна
levels.level.water_desc=У выпадку ўзгарання, скокніце ў ваду, каб патушыць агонь.
levels.level.water_name=Вада
levels.level.well_name=Ну
levels.mininglevel.barricade_desc=Драўляная барыкада трывала ўсталяваная і служыць апорай для столі.\n\nВерагодна, яе пабудавалі гнолы, каб абараніць ад падаючых камянёў. _Любыя суседнія ячэйкі будуць абаронены ад каменяпадзенняў і нападаў._\n\nЗдаецца, яна гарыць гэтак жа добра, як і любая іншая барыкада.
levels.mininglevel.boulder_desc=Шлях перагароджвае вялікі валун. Яго павінна быць даволі лёгка разбіць кіркай.
levels.mininglevel.boulder_name=Боўлдэр
levels.mininglevel.crystal_desc=Тут ёсць вялікі і маляўнічы крышталь, які выходзіць на паверхню. Гэтыя крышталі далікатныя і іх лёгка разбіць кіркай, альбо яны разбіваюцца, калі побач што-небудзь здабываць.
levels.mininglevel.crystal_name=Крыштальны шып
levels.mininglevel.gold_extra_desc=Ты, напэўна, зможаш выкапаць яго сваёй кіркай.
levels.mininglevel.wall_desc=Гладкая каменная сцяна, крыху мякчэйшая за звычайную. Вы можаце пракапаць яе кіркай, але гэта запатрабуе некаторых намаганняў і крыху павялічыць ваш голад.
levels.prisonlevel.bookshelf_desc=Гэта, напэўна, рэшткі турэмнай бібліятэкі. Ці можа яна згарэць?
levels.prisonlevel.empty_deco_desc=На падлозе ёсць старыя плямы крыві.
levels.prisonlevel.region_deco_alt_desc=Металічная клетка, дастаткова вялікая, каб змясціць чалавека. Яна вісіць над глыбокай прорвай, падвешаная на ланцугу.
levels.prisonlevel.region_deco_alt_name=Падвесная клетка
levels.prisonlevel.region_deco_desc=Металічная клетка, дастаткова вялікая, каб змясціць чалавека. Здаецца, яна неяк прымацаваная да зямлі, яе немагчыма зрушыць з месца.
levels.prisonlevel.region_deco_name=Турэмная клетка
levels.prisonlevel.water_name=Цёмная халодная вада
levels.rooms.quest.ambitiousimproom$questentrance.desc=Здаецца, гэтая злавесная яма — уваход у нейкае старажытнае гномскае сховішча. Уваход перашкаджае магічная перашкода, па якой можна хадзіць, быццам тут падлога.
levels.rooms.quest.ambitiousimproom$questentrance.name=Уваход у сховішча
levels.rooms.quest.blacksmithroom$questentrance.desc=Гэтая лесвіца вядзе ў старую шахту крыху ніжэй за кавальскую майстэрню.
levels.rooms.quest.blacksmithroom$questentrance.name=Уваход у шахту
levels.rooms.quest.massgraveroom$bones.desc=Косці валяюцца на падлозе, што тут здарылася?
levels.rooms.quest.massgraveroom$bones.name=Брацкая магіла
levels.rooms.quest.mineentrance$questexit.desc=Гэтая лесвіца вядзе з шахты назад у майстэрню каваля.
levels.rooms.quest.mineentrance$questexit.name=Выхад з шахты
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Пафарбаваны маркер для нейкага цёмнага рытуалу. Свечкі звычайна ставяць на чатырох кутах.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Рытуальны маркер
levels.rooms.special.magicalfireroom$eternalfire.desc=Тут сцяна густога ярка-зялёнага агню, відаць, выкліканая магіяй. Яна настолькі густая, што праз яе немагчыма прайсці, і яна падпальвае ўсё, што падыдзе занадта блізка. Яна не паказвае ніякіх прыкмет натуральнага гарэння, вам трэба будзе выкарыстаць нешта, каб яе патушыць.
levels.rooms.special.sentryroom$sentry.desc=Здаецца, гэты крывава-чырвоны вартавы знаходзіцца тут, каб ахоўваць скарб у іншым канцы пакоя. Ён будзе страляць у вас прамянямі магіі распаду, калі вы ступіце ў зону, якую ён абараняе.\n\nЁн неўспрымальны да ўсіх шкодных эфектаў і можа бачыць скрозь нябачнасць, але, здаецца, яму патрабуецца некаторы час, каб зарадзіцца, перш чым ён пачне страляць.\n\nНеяк вартавы хоча страляць толькі ў вас, быццам ведае, што жыхары падзямелля не ўяўляюць пагрозы для скарбу.
levels.rooms.special.sentryroom$sentry.discover_hint=Вы можаце знайсці гэтага ворага ў любым месцы падзямелля.
levels.rooms.special.sentryroom$sentry.name=чырвоны вартавы
levels.rooms.special.toxicgasroom$toxicvent.desc=Напэўна, нейкі нядбайны шукальнік прыгод даўно актываваў гэтую пастку. Нягледзячы на неактыўны стан, яна ўсё яшчэ вывяргае ў пакой таксічны газ і не паказвае ніякіх прыкмет спынення. Вам спатрэбіцца нейкі спосаб прадухіліць пашкоджанні ад газу, калі вы хочаце даследаваць гэты пакой.
levels.rooms.special.toxicgasroom$toxicvent.name=таксічны вентыляцыйны канал
levels.rooms.special.weakfloorroom$hiddenwell.desc=Унізе ў глыбіні можна разгледзець толькі калодзеж, магчыма, там нешта ёсць?
levels.rooms.special.weakfloorroom$hiddenwell.name=далёкі калодзеж
levels.sewerlevel.bookshelf_desc=Кніжная паліца завалена танных бескарысных кніг. Ці можа яна згарэць?
levels.sewerlevel.empty_deco_desc=Падлогу пакрывае вільготны жаўтлявы мох.
levels.sewerlevel.region_deco_desc=Тоўстая бочка, амаль такая ж вялікая, як і ты. Яна, напэўна, нечым поўная, яе занадта цяжка зрушыць з месца.
levels.sewerlevel.region_deco_name=Бочка для захоўвання
levels.sewerlevel.water_name=Каламутная вада
levels.traps.alarmtrap.alarm=Пастка выдае пранізлівы гук, які адгукаецца рэхам па ўсім падзямеллі!
levels.traps.alarmtrap.desc=Здаецца, гэтая пастка звязана з гучнай сігналізацыяй. Яе спрацоўванне, хутчэй за ўсё, падасць трывогу ўсім на ўзроўні.
levels.traps.alarmtrap.name=пастка сігналізацыі
levels.traps.blazingtrap.desc=Наступ на гэтую пастку прывядзе да ўзгарання магутнай хімічнай сумесі, якая падпаліць вялікую плошчу.
levels.traps.blazingtrap.name=палаючая пастка
levels.traps.burningtrap.desc=Наступ на гэтую пастку прывядзе да ўзгарання хімічнай сумесі, якая падпаліць навакольную прастору.
levels.traps.burningtrap.name=падпаленая пастка
levels.traps.chillingtrap.desc=Пры актывацыі хімічныя рэчывы ў гэтай пастцы хутка замарожваюць паветра вакол яе месцазнаходжання.
levels.traps.chillingtrap.name=халаднільная пастка
levels.traps.confusiontrap.desc=Спрацоўванне гэтай пасткі прывядзе да вызвалення воблака газу, які выклікае замяшанне, у непасрэднай блізкасці.
levels.traps.confusiontrap.name=пастка для газу блытаніны
levels.traps.corrosiontrap.desc=Спрацоўванне гэтай пасткі прывядзе да вызвалення воблака смяротна небяспечнага кіслага газу ў непасрэднай блізкасці.
levels.traps.corrosiontrap.name=пастка для каразійных газаў
levels.traps.cursingtrap.curse=Ваша зношанае абсталяванне становіцца праклятым!
levels.traps.cursingtrap.desc=Гэтая пастка ўтрымлівае тую ж злосную магію, што і праклятае рыштунак. Яе актывацыя праклінае некаторыя прадметы ў непасрэднай блізкасці.
levels.traps.cursingtrap.name=пастка для праклёнаў
levels.traps.disarmingtrap.desc=Гэтая пастка ўтрымлівае вельмі спецыфічную магію тэлепартацыі, якая перамясціць зброю ахвяры ў іншае месца.
levels.traps.disarmingtrap.disarm=Ваша зброя тэлепартуецца прэч!
levels.traps.disarmingtrap.name=раззбройваючая пастка
levels.traps.disintegrationtrap.desc=Пры спрацоўванні гэтая пастка пранізвае найбліжэйшую цэль прамянямі распаду, наносячы значную шкоду і знішчаючы прадметы.\n\nНа шчасце, механізм спуска не схаваны.
levels.traps.disintegrationtrap.name=пастка распаду
levels.traps.disintegrationtrap.ondeath=Цябе забіла пастка распаду...
levels.traps.disintegrationtrap.one=Пастка разбурае ваш %s!
levels.traps.disintegrationtrap.some=Пастка разбурае частку вашага %s!
levels.traps.distortiontrap.desc=Пабудаваная з дапамогай дзіўнай магіі невядомага паходжання, гэтая пастка прыкліча ў гэтае месца ўсялякіх істот.
levels.traps.distortiontrap.name=пастка скажэнняў
levels.traps.explosivetrap.desc=Гэтая пастка змяшчае выбуховую рэчыва і спускавы механізм. Яе актывацыя выкліча выбух у непасрэднай блізкасці.
levels.traps.explosivetrap.name=выбуховая пастка
levels.traps.flashingtrap.desc=Пры актывацыі гэтая пастка падпальвае магутны бліскучы порах, які захоўваецца ўнутры, часова асляпляючы, калечачы і ранячы ахвяру. \n\n Пастка павінна мець вялікі запас пораху, бо яна можа актывавацца шмат разоў, не парушаючы пры гэтым гатоўнасці.
levels.traps.flashingtrap.name=мігаючая пастка
levels.traps.flocktrap.desc=Магчыма, гэта жарт нейкага мага-аматара, які актывуе гэтую пастку і створыць статак чароўных авечак.
levels.traps.flocktrap.name=пастка для статка
levels.traps.frosttrap.desc=Пры актывацыі хімічныя рэчывы ў гэтай пастцы хутка замарожваюць паветра ў шырокім дыяпазоне вакол яе месцазнаходжання.
levels.traps.frosttrap.name=марозная пастка
levels.traps.gatewaytrap.desc=Гэтая спецыяльная тэлепартацыйная пастка можа актывавацца бясконцую колькасць разоў і заўсёды тэлепартуецца ў адно і тое ж месца.
levels.traps.gatewaytrap.name=пастка-праход
levels.traps.geysertrap.desc=Пры спрацоўванні гэтая пастка выкліча вывяржэнне гейзера вады, які нанясе шкоду вогненным ворагам, знішчыць усіх персанажаў паблізу, патушыць пажары і ператворыць навакольную мясцовасць у ваду.
levels.traps.geysertrap.name=гейзерная пастка
levels.traps.gnollrockfalltrap.desc=Гэтая пастка для абвалу камянёў зроблена з дапамогай нейкай магічнай дапамогі. Пры яе актывацыі камяні адразу ж падаюць зверху ў зоне 5x5 вакол яе. З-за больш мяккіх парод у гэтай зоне яна не нанясе столькі шкоды, колькі звычайная пастка для абвалу камянёў, але ваша браня таксама не будзе эфектыўнай супраць яе. Камяні таксама не будуць падаць у месцах з суседняй барыкадай, бо яны дапамагаюць утрымліваць столь.\n\n_Гэтая пастка не адрознівае сябра ад ворага, таму гэтак жа шкодная як для гнолаў, так і для вас._
levels.traps.gnollrockfalltrap.name=пастка для гнолаў-камянёў
levels.traps.grimtrap.desc=У гэтай пастцы захоўваецца надзвычай магутная разбуральная магія, дастатковая, каб імгненна забіць усіх герояў, акрамя самых здаровых. Яе актывацыя адправіць дыстанцыйны выбух смяротнай магіі ў бок бліжэйшага персанажа.\n\nНа шчасце, механізм спускавога кручка не схаваны.
levels.traps.grimtrap.name=змрочная пастка
levels.traps.grimtrap.ondeath=Цябе забіў выбух змрочнай пасткі...
levels.traps.grippingtrap.desc=Гэтая пастка чапляецца за ногі таго, хто яе актывуе, пашкоджваючы яго і запавольваючы яго рухі.\n\nДзякуючы сваёй прастаты, гэтая пастка можа актывавацца шмат разоў, не зламаючыся.
levels.traps.grippingtrap.name=захопная пастка
levels.traps.guardiantrap$guardian.desc=Гэтая сіняя прывіда, здаецца, выкліканае водгулле аднаго з каменных вартаўнікоў падзямелля.
levels.traps.guardiantrap$guardian.desc_weapon=Хоць сама статуя амаль нематэрыяльная, _%s_, якім яна трымае, выглядае сапраўднай.
levels.traps.guardiantrap$guardian.discover_hint=Вы можаце знайсці гэтага ворага з дапамогай спецыяльнай пасткі.
levels.traps.guardiantrap$guardian.name=выкліканы апекун
levels.traps.guardiantrap.alarm=Пастка выдае пранізлівы гук, які адгукаецца рэхам па ўсім падзямеллі!
levels.traps.guardiantrap.desc=Гэтая пастка звязана з дзіўным магічным механізмам, які будзе выклікаць вартаўнікоў і папярэджваць усіх ворагаў на паверсе.
levels.traps.guardiantrap.name=пастка вартаўніка
levels.traps.oozetrap.desc=Пры актывацыі гэтая пастка выплюхвае едкую вадкасць, якая будзе гарэць, пакуль не змыецца.
levels.traps.oozetrap.name=пастка для слізі
levels.traps.pitfalltrap.desc=Гэтая пастка падключана да вялікага механізму люка, і неўзабаве пасля яго спрацоўвання ўсё, што знаходзіцца побач з ёй, праслізне прама скрозь зямлю і ўпадзе! Аднак яна не будзе працаваць у месцах з асабліва цвёрдай падлогай.
levels.traps.pitfalltrap.name=пастка
levels.traps.pitfalltrap.no_pit=глеба занадта цвёрдая, каб тут спрацавала пастка.
levels.traps.pitfalltrap.triggered=Зямля вакол спрацавалай пасткі пачынае развальвацца!
levels.traps.pitfalltrap.triggered_hero=Зямля вакол цябе пачынае круціцца!
levels.traps.poisondarttrap.desc=Непадалёк трэба схаваць невялікі стрэльчык для дроцікаў. Пасля актывацыі пасткі ён стрэліць атручаным стрэльчыкам у бліжэйшую цэль. \n\nНа шчасце, спускавы механізм не схаваны.
levels.traps.poisondarttrap.name=пастка з атрутнымі стрэлкамі
levels.traps.poisondarttrap.ondeath=Цябе забіла пастка з атрутнымі стрэлкамі...
levels.traps.rockfalltrap.desc=Гэтая пастка злучана з серыяй друзлых камянёў уверсе, і калі яе спусціць, яны абрынуцца на ўвесь пакой! Калі пастка знаходзіцца не ў пэўным пакоі, камяні будуць падаць вакол яе. \n\nНа шчасце, механізм спуска не схаваны.
levels.traps.rockfalltrap.name=пастка для абвалу камянёў
levels.traps.rockfalltrap.ondeath=Цябе раздушыла пастка з абвалам...
levels.traps.shockingtrap.desc=Механізм з вялікай колькасцю назапашанай энергіі. Спрацоўванне гэтай пасткі прывядзе да разраду гэтай энергіі ў поле вакол яе.
levels.traps.shockingtrap.name=шакавальная пастка
levels.traps.stormtrap.desc=Механізм з велізарнай колькасцю назапашанай энергіі. Спрацоўванне гэтай пасткі прывядзе да выкіду гэтай энергіі ў вялікую электрычную буру.
levels.traps.stormtrap.name=штормавая пастка
levels.traps.summoningtrap.desc=Спрацоўванне гэтай пасткі прыкліча ў гэтае месца некалькі монстраў з гэтай мясцовасці.
levels.traps.summoningtrap.name=пастка для выклікання
levels.traps.teleportationtrap.desc=Кожны раз, калі гэтая пастка спрацоўвае, усё вакол яе будзе тэлепартавана ў выпадковыя месцы на гэтым паверсе.
levels.traps.teleportationtrap.name=тэлепартацыйная пастка
levels.traps.tengudarttrap.desc=Тэнгу відавочна рыхтаваўся да бою. Гэтая пастка актывуе схаваны дроцік, які страляе атрутнай стрэлай у бліжэйшую рэч, акрамя Тэнгу.\n\nПастка настолькі добра зроблена, што спускавы механізм немагчыма выявіць без дапамогі магіі. Аднак пастка на імгненне бачная, калі яе ўсталёўваюць.
levels.traps.toxictrap.desc=Спрацоўванне гэтай пасткі прывядзе да ўтварэння воблака таксічнага газу ў навакольнай прасторы.
levels.traps.toxictrap.name=пастка для таксічных газаў
levels.traps.trap.discover_hint=Гэтую пастку можна знайсці выпадковым чынам у падзямеллі. У кожным рэгіёне могуць з'явіцца розныя пасткі.
levels.traps.trap.rankings_desc=Забіты: %s
levels.traps.warpingtrap.desc=Гэтая пастка падобная да тэлепартацыйнай, але ў выніку герой страціць веды пра планіроўку паверха!
levels.traps.warpingtrap.name=дэфармацыйная пастка
levels.traps.weakeningtrap.desc=Цёмная магія ў гэтай пастцы высмоктвае энергію з усяго, што з ёй датыкаецца. Аднак магутныя ворагі могуць супраціўляцца гэтаму эфекту.
levels.traps.weakeningtrap.name=пастка для аслаблення
levels.traps.worndarttrap.desc=Непадалёк трэба схаваць невялікі стрэльчык, актывацыя якога прымусіць яго страляць у бліжэйшую цэль. \n\nЗ-за свайго ўзросту ён не вельмі шкодны, яго нават не схаваць...
levels.traps.worndarttrap.name=зношаная пастка для стрэлак
levels.traps.worndarttrap.ondeath=Цябе забіла зношаная пастка для стрэлак...
levels.vaultlevel$vaultflametrap.desc=Здаецца, з гэтай вентыляцыйнай адтуліны праз пэўныя прамежкі часу вырываецца зялёнае полымя. _Паколькі гэта толькі выпрабавальная зона, полымя з вентыляцыйных адтулін вам не прычыніць шкоды._
levels.vaultlevel$vaultflametrap.name=вентыляцыйная адтуліна полымя ў склепе

levels.level.sign_desc=Адсюль тэкст прачытаць нельга.
levels.level.sign_name=Знак
