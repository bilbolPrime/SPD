levels.cavesbosslevel.energy_desc=De grond is hier elektrisch geladen en het is gevaarlijk om erop te stappen. De vonken lijken in een bepaalde richting te bewegen... misschien leiden ze naar de stroombron?
levels.cavesbosslevel.gate_desc=Een grote metalen poort blokkeert de toegang tot de dwergenmetropool. De metalen doos in het midden produceert een luid zoemend geluid; deze moet verbonden zijn met de circuits en machines in de buurt. Misschien dat het vernietigen van DM-300 de poort zal openen?
levels.cavesbosslevel.gate_desc_broken=De poort moet op de een of andere manier met DM-300 verbonden zijn geweest, aangezien hij explodeerde toen DM-300 werd verslagen. Nu zijn er alleen nog maar brokstukken over.
levels.cavesbosslevel.gate_name=Metalen poort
levels.cavesbosslevel.water_desc=Met al die elektriciteit hier in de buurt is het water misschien niet altijd veilig...
levels.cavesbosslevel.wires_desc=De grond is hier gedeeltelijk opgegraven, waardoor enkele grote, blootliggende draden zichtbaar zijn. Deze verbinden waarschijnlijk de verschillende elektrische machines met elkaar. Er loopt waarschijnlijk stroom door de draden. Als DM-300 hier stapt, kan hij er mogelijk stroom uit halen.
levels.cavesbosslevel.wires_name=Blootliggende bedrading
levels.caveslevel.bookshelf_desc=Wie zou er nu een boekenplank nodig hebben in een grot?
levels.caveslevel.entrance_desc=De ladder leidt naar het bovenste gedeelte van het huis.
levels.caveslevel.exit_desc=De ladder leidt naar het diepere gedeelte.
levels.caveslevel.grass_name=Fluorescerend mos
levels.caveslevel.high_grass_desc=Enorme paddenstoelen belemmeren het zicht.
levels.caveslevel.high_grass_name=Fluorescerende paddenstoelen
levels.caveslevel.region_deco_desc=Een grote, volledig metalen constructie, waarschijnlijk gebouwd door de dwergen toen ze hier nog mijnbouw bedreven. Je denkt dat je de al lang niet meer gebruikte mijnkarsporen over de bovenkant kunt zien lopen.
levels.caveslevel.region_deco_name=Metaalstructuur
levels.caveslevel.wall_deco_desc=Op de muur is een ader van erts te zien. Goud?
levels.caveslevel.water_name=IJskoud water
levels.citybosslevel.summoning_desc=Dit voetstuk heeft een grote opening in het midden, die praktisch uitstraalt met donkere energie. De Dwergkoning gebruikt deze voetstukken als focuspunten voor zijn necromantische magie en kan er handlangers naar oproepen. Het voetstuk moet een paar beurten opladen voordat de handlanger verschijnt, en het type handlanger dat wordt opgeroepen, wordt aangekondigd door de opbouwende magische kracht.
levels.citybosslevel.summoning_name=oproepingsvoetstuk
levels.citybosslevel.throne_desc=Deze indrukwekkend grote troon is de zetel van het dwergenrijk, dat nu in handen is van een machtsbeluste necromancer. Er lijken magische of mechanische onderdelen aan de troon te zitten; de Dwergenkoning zou extra macht kunnen hebben wanneer hij erop zit.
levels.citybosslevel.throne_name=Troon
levels.citylevel.bookshelf_desc=De boekenplank staat vol met rijen boeken over uiteenlopende onderwerpen.
levels.citylevel.deco_desc=Hier ontbreken enkele tegels.
levels.citylevel.entrance_desc=Een hellingbaan leidt naar het bovenste gedeelte van het reservoir.
levels.citylevel.exit_desc=Een helling leidt naar het diepere gedeelte.
levels.citylevel.high_grass_name=Hoogbloeiende bloemen
levels.citylevel.region_deco_desc=Een verhoogd platform met daarop een felgroene, magische vlam. De vlam is zo dicht dat hij bijna massief lijkt.
levels.citylevel.region_deco_name=Vlammend voetstuk
levels.citylevel.sp_desc=De vloer is bedekt met een dik tapijt.
levels.citylevel.statue_desc=Het standbeeld beeldt een dwerg af die in een heldhaftige houding staat.
levels.citylevel.upcoming_quest_intro_no=Blijf hier
levels.citylevel.upcoming_quest_intro_title=Bericht van de ontwikkelaar
levels.citylevel.upcoming_quest_intro_yes=Daal af in de kluis.
levels.citylevel.water_name=Verdacht gekleurd water
levels.features.chasm.chasm=Kloof
levels.features.chasm.jump=Wil je echt in de afgrond springen? Zo'n val zal pijnlijk zijn.
levels.features.chasm.no=Nee, ik ben van gedachten veranderd.
levels.features.chasm.ondeath=Je bent te pletter gevallen...
levels.features.chasm.rankings_desc=Overleden bij de impact.
levels.features.chasm.yes=Ja, ik weet wat ik doe.
levels.hallslevel.bookshelf_desc=In de boekenkast liggen boeken in oude talen te smeulen.
levels.hallslevel.grass_name=Gloeiend mos
levels.hallslevel.high_grass_name=Emberfungi
levels.hallslevel.region_deco_desc=Een enorm stuk steen dat lijkt te zijn afgebroken van het plafond of een nabijgelegen muur.
levels.hallslevel.region_deco_name=Brok puin
levels.hallslevel.statue_desc=De pilaar is gemaakt van echte menselijke schedels. Geweldig.
levels.hallslevel.statue_name=Pijler
levels.hallslevel.water_desc=Het lijkt op lava, maar het is koud en waarschijnlijk veilig om aan te raken.
levels.hallslevel.water_name=Koude lava
levels.level$feeling.chasm_desc=Je voetstappen echoën door de kerker.
levels.level$feeling.chasm_title=kloofvloer
levels.level$feeling.dark_desc=Je kunt vijanden horen bewegen in de duisternis.
levels.level$feeling.dark_title=donkere vloer
levels.level$feeling.grass_desc=De geur van planten hangt zwaar in de lucht.
levels.level$feeling.grass_title=grasvloer
levels.level$feeling.large_desc=Deze kerkerverdieping lijkt ongewoon groot.
levels.level$feeling.large_title=grote vloer
levels.level$feeling.secrets_desc=De sfeer doet vermoeden dat deze verdieping vele geheimen verbergt.
levels.level$feeling.secrets_title=geheime verdieping
levels.level$feeling.traps_desc=De grond lijkt hier bijzonder verraderlijk.
levels.level$feeling.traps_title=vallen vloer
levels.level$feeling.water_desc=Je hoort water om je heen spatten.
levels.level$feeling.water_title=waterbodem
levels.level.alchemy_desc=Deze pot is gevuld met magisch water. Je kunt er allerlei dingen in mengen om iets nieuws te creëren!
levels.level.alchemy_name=alchemiepot
levels.level.barricade_desc=De houten barricade staat stevig, maar is in de loop der jaren uitgedroogd. Zou hij in brand kunnen vliegen?
levels.level.barricade_name=Barricade
levels.level.bookshelf_name=Boekenplank
levels.level.chasm_desc=Je kunt de bodem niet zien.
levels.level.chasm_name=Kloof
levels.level.closed_door_name=Gesloten deur
levels.level.crystal_door_desc=Deze afgesloten deur is gemaakt van magisch kristal. Je kunt erdoorheen kijken, maar je hebt een kristallen sleutel nodig om hem te openen.
levels.level.crystal_door_name=Kristallen deur
levels.level.default_name=???
levels.level.embers_desc=De vloer is bedekt met gloeiende kolen.
levels.level.embers_name=Gloeiende kolen
levels.level.empty_well_desc=De bron is opgedroogd.
levels.level.empty_well_name=Leeg putje
levels.level.entrace_name=Diepte-ingang
levels.level.entrance_desc=Een trap leidt naar het bovenste gedeelte.
levels.level.exit_desc=Een trap leidt naar het lager gelegen gedeelte.
levels.level.exit_name=Diepte-uitgang
levels.level.floor_name=Vloer
levels.level.furrowed_grass_name=Geploegde vegetatie
levels.level.grass_name=Gras
levels.level.hidden_trap=Een verborgen %s wordt geactiveerd!
levels.level.high_grass_desc=Dichte begroeiing belemmert het zicht.
levels.level.high_grass_name=Hoog gras
levels.level.inactive_trap_desc=De val is al eerder geactiveerd en vormt nu geen gevaar meer.
levels.level.inactive_trap_name=Geactiveerde val
levels.level.locked_door_desc=Deze deur is op slot, je hebt een bijpassende sleutel nodig om hem te openen.
levels.level.locked_door_name=Gesloten deur
levels.level.locked_exit_desc=Zware stangen blokkeren de trap naar beneden.
levels.level.locked_exit_name=Vergrendelde diepte-uitgang
levels.level.open_door_name=Open deur
levels.level.pedestal_name=Voetstuk
levels.level.statue_desc=Iemand wilde deze plek verfraaien, maar is daar kennelijk niet in geslaagd.
levels.level.statue_name=Standbeeld
levels.level.unlocked_exit_name=Ontgrendelde diepte-uitgang
levels.level.wall_name=Muur
levels.level.water_desc=In geval van brand, stap in het water om het vuur te blussen.
levels.level.water_name=Water
levels.level.well_name=Goed
levels.mininglevel.barricade_desc=De houten barricade staat stevig vast en dient als steun voor het plafond.\n\nDeze is waarschijnlijk door de gnolls gebouwd om enige bescherming te bieden tegen vallende stenen. _Aangrenzende cellen zullen beschermd zijn tegen vallende stenen en aanvallen._\n\nHet ziet eruit alsof het net zo goed zou branden als elke andere barricade.
levels.mininglevel.boulder_desc=Er ligt een grote kei in de weg. Die zou vrij gemakkelijk met een houweel te breken moeten zijn.
levels.mininglevel.boulder_name=Kei
levels.mininglevel.crystal_desc=Hier bevindt zich een grote en kleurrijke kristalformatie. Deze kristallen zijn fragiel en kunnen gemakkelijk met een houweel worden gebroken, of zullen breken als er iets in de buurt wordt gedolven.
levels.mininglevel.crystal_name=Kristallen piek
levels.mininglevel.gold_extra_desc=Je kunt het waarschijnlijk wel met je houweel uithakken.
levels.mininglevel.wall_desc=Een gladde rotswand die iets zachter is dan normaal. Je kunt er met je houweel doorheen hakken, maar dat kost wat moeite en je honger zal er iets van toenemen.
levels.prisonlevel.bookshelf_desc=Dit is waarschijnlijk een overblijfsel van een gevangenisbibliotheek. Zou het kunnen afbranden?
levels.prisonlevel.empty_deco_desc=Er zitten oude bloedvlekken op de vloer.
levels.prisonlevel.region_deco_alt_desc=Een metalen kooi, net groot genoeg voor één persoon. Hij hangt boven een diepe kloof, opgehangen aan een ketting.
levels.prisonlevel.region_deco_alt_name=Hangende kooi
levels.prisonlevel.region_deco_desc=Een metalen kooi, net groot genoeg voor een persoon. Hij lijkt op de een of andere manier aan de grond vast te zitten; je kunt hem niet verplaatsen.
levels.prisonlevel.region_deco_name=gevangeniscel
levels.prisonlevel.water_name=Donker, koud water
levels.rooms.quest.ambitiousimproom$questentrance.desc=Deze onheilspellende kuil lijkt de ingang te zijn van een oude dwergenkluis. Een magische barrière verhindert de toegang, maar je kunt eroverheen lopen alsof er een vloer is.
levels.rooms.quest.ambitiousimproom$questentrance.name=Ingang van de kluis
levels.rooms.quest.blacksmithroom$questentrance.desc=Deze ladder leidt naar een oude mijn vlak onder de smederij.
levels.rooms.quest.blacksmithroom$questentrance.name=Mijningang
levels.rooms.quest.massgraveroom$bones.desc=Er liggen overal botten op de grond, wat is hier gebeurd?
levels.rooms.quest.massgraveroom$bones.name=Massagraf
levels.rooms.quest.mineentrance$questexit.desc=Deze ladder leidt vanuit de mijn terug naar de smederij.
levels.rooms.quest.mineentrance$questexit.name=Mijnuitgang
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Een beschilderde markering voor een duister ritueel. Meestal worden er kaarsen op de vier hoeken geplaatst.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritueel markeringspunt
levels.rooms.special.magicalfireroom$eternalfire.desc=Er is hier een muur van dicht, felgroen vuur, schijnbaar veroorzaakt door magie. Het is zo dicht dat je er niet doorheen kunt en het ontsteekt alles wat te dichtbij komt. Het vuur zal niet vanzelf doven, je zult iets moeten gebruiken om het te blussen.
levels.rooms.special.sentryroom$sentry.desc=Deze bloedrode wachter lijkt hier te zijn geplaatst om de schat aan de andere kant van deze kamer te bewaken. Hij zal stralen van desintegratiemagie op je afvuren als je het gebied betreedt dat hij verdedigt. Hij is immuun voor alle schadelijke effecten en kan door onzichtbaarheid heen kijken, maar het lijkt even te duren voordat hij oplaadt en begint te schieten. Op de een of andere manier wil de wachter alleen op jou schieten, alsof hij weet dat de bewoners van de kerker geen bedreiging vormen voor de schat.
levels.rooms.special.sentryroom$sentry.discover_hint=Je kunt deze vijand overal in de kerker tegenkomen.
levels.rooms.special.sentryroom$sentry.name=rode schildwacht
levels.rooms.special.toxicgasroom$toxicvent.desc=Een onvoorzichtige avonturier moet deze val lang geleden hebben geactiveerd. Ondanks dat hij inactief is, spuwt hij nog steeds giftig gas de kamer in en lijkt dat niet te stoppen. Je hebt een manier nodig om schade door het gas te voorkomen als je deze kamer wilt verkennen.
levels.rooms.special.toxicgasroom$toxicvent.name=giftige ventilatieopening
levels.rooms.special.weakfloorroom$hiddenwell.desc=Je kunt in de diepte een put onderscheiden, misschien zit daar wel iets?
levels.rooms.special.weakfloorroom$hiddenwell.name=verre put
levels.sewerlevel.bookshelf_desc=De boekenplank staat vol met goedkope, nutteloze boeken. Zou het kunnen afbranden?
levels.sewerlevel.empty_deco_desc=De vloer is bedekt met nat, geelachtig mos.
levels.sewerlevel.region_deco_desc=Een stevig vat, bijna net zo groot als jij. Het moet wel vol zitten met iets, het is te zwaar om te verplaatsen.
levels.sewerlevel.region_deco_name=Opslagvat
levels.sewerlevel.water_name=Troebel water
levels.traps.alarmtrap.alarm=De val produceert een doordringend geluid dat door de hele kerker galmt!
levels.traps.alarmtrap.desc=Deze val lijkt gekoppeld te zijn aan een luid alarmmechanisme. Als het alarm afgaat, zal waarschijnlijk alles op die verdieping gealarmeerd worden.
levels.traps.alarmtrap.name=alarmval
levels.traps.blazingtrap.desc=Als je op deze val stapt, ontbrandt een krachtig chemisch mengsel, waardoor een groot gebied in vlammen opgaat.
levels.traps.blazingtrap.name=brandende val
levels.traps.burningtrap.desc=Als je op deze val stapt, ontbrandt een chemisch mengsel, waardoor de omgeving in vlammen opgaat.
levels.traps.burningtrap.name=brandval
levels.traps.chillingtrap.desc=Wanneer deze val wordt geactiveerd, zullen de chemicaliën erin de lucht eromheen snel bevriezen.
levels.traps.chillingtrap.name=ijzige val
levels.traps.confusiontrap.desc=Als deze val wordt geactiveerd, komt er een wolk verwarringsgas vrij in de directe omgeving.
levels.traps.confusiontrap.name=verwarring gasval
levels.traps.corrosiontrap.desc=Als deze val wordt geactiveerd, komt er een wolk dodelijk zuur gas vrij in de directe omgeving.
levels.traps.corrosiontrap.name=corrosieve gasval
levels.traps.cursingtrap.curse=Je versleten uitrusting wordt vervloekt!
levels.traps.cursingtrap.desc=Deze val bevat dezelfde kwaadaardige magie als vervloekte voorwerpen. Als je hem activeert, worden sommige voorwerpen in de directe omgeving vervloekt.
levels.traps.cursingtrap.name=vloekval
levels.traps.disarmingtrap.desc=Deze val bevat zeer specifieke teleportatiemagie, waarmee het wapen van het slachtoffer naar een andere locatie wordt verplaatst.
levels.traps.disarmingtrap.disarm=Je wapen is weggeteleporteerd!
levels.traps.disarmingtrap.name=ontwapenende val
levels.traps.disintegrationtrap.desc=Wanneer deze val wordt geactiveerd, zal hij het dichtstbijzijnde doelwit doorboren met desintegratiestralen, waardoor aanzienlijke schade wordt toegebracht en voorwerpen worden vernietigd. Gelukkig is het activeringsmechanisme niet verborgen.
levels.traps.disintegrationtrap.name=desintegratieval
levels.traps.disintegrationtrap.ondeath=Je bent omgekomen door de desintegratieval...
levels.traps.disintegrationtrap.one=De val vernietigt je %s!
levels.traps.disintegrationtrap.some=De val vernietigt een deel van je %s!
levels.traps.distortiontrap.desc=Deze val, gemaakt met behulp van vreemde magie van onbekende oorsprong, zal allerlei wezens naar deze locatie lokken.
levels.traps.distortiontrap.name=vervormingsval
levels.traps.explosivetrap.desc=Deze val bevat een explosief in poedervorm en een ontstekingsmechanisme. Activering ervan zal een explosie in de directe omgeving veroorzaken.
levels.traps.explosivetrap.name=explosieve val
levels.traps.flashingtrap.desc=Bij activering ontsteekt deze val een krachtig flitsend poeder dat erin is opgeslagen, waardoor het slachtoffer tijdelijk verblind, verlamd en gewond raakt. De val moet een grote hoeveelheid poeder bevatten, omdat hij vele malen geactiveerd kan worden zonder te breken.
levels.traps.flashingtrap.name=knipperende val
levels.traps.flocktrap.desc=Misschien een grap van een amateur-magiër: als je deze val activeert, verschijnt er een kudde magische schapen.
levels.traps.flocktrap.name=zwermval
levels.traps.frosttrap.desc=Wanneer deze val wordt geactiveerd, zullen de chemicaliën erin de lucht in een groot gebied rondom de val snel bevriezen.
levels.traps.frosttrap.name=vorstval
levels.traps.gatewaytrap.desc=Deze speciale teleportatieval kan oneindig vaak geactiveerd worden en teleporteert altijd naar dezelfde locatie.
levels.traps.gatewaytrap.name=toegangspoort val
levels.traps.geysertrap.desc=Wanneer deze val wordt geactiveerd, zal er een watergeiser uit spuiten die vurige vijanden beschadigt, alle personages in de buurt wegstoot, branden blust en het omliggende terrein in water verandert.
levels.traps.geysertrap.name=geiserval
levels.traps.gnollrockfalltrap.desc=Deze val met vallende rotsen is gemaakt met behulp van een of andere vorm van magie. Wanneer hij wordt geactiveerd, zullen rotsen loskomen en onmiddellijk van bovenaf naar beneden vallen in een gebied van 5x5 eromheen. Door de zachtere rotsen in dit gebied zal hij minder schade aanrichten dan een gewone val met vallende rotsen, maar je pantser zal er ook niet tegen opwegen. Rotsen zullen ook niet vallen op plaatsen waar een barricade in de buurt staat, omdat die helpt het plafond te ondersteunen. Deze val kan geen onderscheid maken tussen vriend en vijand en is daarom net zo schadelijk voor de gnolls als voor jou.
levels.traps.gnollrockfalltrap.name=gnoll rotsval
levels.traps.grimtrap.desc=In deze val is extreem krachtige, vernietigende magie opgeslagen, genoeg om vrijwel alle helden, behalve de gezondste, onmiddellijk te doden. Door de val te activeren, wordt een dodelijke magische aanval op afstand op het dichtstbijzijnde personage afgevuurd. Gelukkig is het activeringsmechanisme niet verborgen.
levels.traps.grimtrap.name=grimmige val
levels.traps.grimtrap.ondeath=Je bent omgekomen door de explosie van een grimmige val...
levels.traps.grippingtrap.desc=Deze val grijpt zich vast aan de voeten van degene die hem activeert, waardoor ze gewond raken en hun beweging wordt vertraagd. Door zijn eenvoudige constructie kan deze val vele malen geactiveerd worden zonder kapot te gaan.
levels.traps.grippingtrap.name=grijpende val
levels.traps.guardiantrap$guardian.desc=Deze blauwe verschijning lijkt een opgeroepen echo te zijn van een van de stenen bewakers van de kerker.
levels.traps.guardiantrap$guardian.desc_weapon=Hoewel het standbeeld zelf bijna onstoffelijk is, ziet de _%s_ die het vasthoudt er echt uit.
levels.traps.guardiantrap$guardian.discover_hint=Je kunt deze vijand vinden met behulp van een specifieke val.
levels.traps.guardiantrap$guardian.name=opgeroepen bewaker
levels.traps.guardiantrap.alarm=De val produceert een doordringend geluid dat door de hele kerker galmt!
levels.traps.guardiantrap.desc=Deze val is verbonden met een vreemd magisch mechanisme dat bewakers oproept en alle vijanden op de verdieping alarmeert.
levels.traps.guardiantrap.name=bewakersval
levels.traps.oozetrap.desc=Deze val spuit bij activering een bijtende vloeistof uit die blijft branden totdat deze is weggespoeld.
levels.traps.oozetrap.name=slijmval
levels.traps.pitfalltrap.desc=Deze val is verbonden met een groot valluikmechanisme, en kort nadat het geactiveerd wordt, zal alles wat zich in de buurt bevindt dwars door de grond zakken en naar beneden vallen! Het werkt echter niet in ruimtes met bijzonder harde vloeren.
levels.traps.pitfalltrap.name=valkuil
levels.traps.pitfalltrap.no_pit=De grond is te hard om hier een valkuil te laten werken.
levels.traps.pitfalltrap.triggered=De grond begint te bezwijken rondom de geactiveerde val!
levels.traps.pitfalltrap.triggered_hero=De grond begint om je heen te verzakken!
levels.traps.poisondarttrap.desc=Er moet een kleine pijlwerper in de buurt verstopt zijn; door deze val te activeren, schiet hij een vergiftigde pijl op het dichtstbijzijnde doelwit. Gelukkig is het activeringsmechanisme niet verborgen.
levels.traps.poisondarttrap.name=gifpijlval
levels.traps.poisondarttrap.ondeath=Je bent gedood door de gifpijlval...
levels.traps.rockfalltrap.desc=Deze val is verbonden met een reeks losse stenen erboven. Als je de val activeert, zullen de stenen met een klap over de hele kamer naar beneden vallen! Als de val zich niet in een specifieke kamer bevindt, zullen de stenen in een gebied rondom de val vallen. Gelukkig is het activeringsmechanisme niet verborgen.
levels.traps.rockfalltrap.name=valgevaar door rotsval
levels.traps.rockfalltrap.ondeath=Je werd verpletterd door de vallende rotsblokken...
levels.traps.shockingtrap.desc=Een mechanisme met een grote hoeveelheid opgeslagen energie. Door deze val te activeren, wordt die energie afgevoerd naar een veld eromheen.
levels.traps.shockingtrap.name=schokkende val
levels.traps.stormtrap.desc=Een mechanisme met een enorme hoeveelheid opgeslagen energie. Door deze val te activeren, wordt die energie ontladen in een grote elektrische storm.
levels.traps.stormtrap.name=stormval
levels.traps.summoningtrap.desc=Als je deze val activeert, worden er een aantal monsters uit dit gebied naar deze locatie geroepen.
levels.traps.summoningtrap.name=oproepval
levels.traps.teleportationtrap.desc=Wanneer deze val wordt geactiveerd, wordt alles eromheen naar willekeurige locaties op deze verdieping geteleporteerd.
levels.traps.teleportationtrap.name=teleportatieval
levels.traps.tengudarttrap.desc=Tengu heeft zich duidelijk voorbereid op een gevecht. Deze val activeert een verborgen pijlenwerper die een gifpijl afvuurt op het dichtstbijzijnde object dat geen Tengu is. De val is zo goed gemaakt dat het activeringsmechanisme zonder magische hulp onmogelijk te detecteren is. De val is echter wel even zichtbaar tijdens het plaatsen ervan.
levels.traps.toxictrap.desc=Als deze val wordt geactiveerd, komt er een wolk giftig gas vrij in de omgeving.
levels.traps.toxictrap.name=giftige gasval
levels.traps.trap.discover_hint=Deze val kun je willekeurig in de kerker tegenkomen. Elke regio heeft andere vallen die kunnen verschijnen.
levels.traps.trap.rankings_desc=Gedood door: %s
levels.traps.warpingtrap.desc=Deze val is vergelijkbaar met een teleportatieval, maar zorgt er ook voor dat de held de plattegrond van de verdieping niet meer kan zien!
levels.traps.warpingtrap.name=vervormingsval
levels.traps.weakeningtrap.desc=De duistere magie in deze val onttrekt de energie aan alles wat ermee in contact komt. Krachtige vijanden kunnen dit effect echter weerstaan.
levels.traps.weakeningtrap.name=verzwakkingsval
levels.traps.worndarttrap.desc=Een kleine pijltjeswerper moet in de buurt verstopt zijn; als je deze val activeert, schiet hij op het dichtstbijzijnde doelwit. \n\nVanwege zijn leeftijd is hij echter niet erg gevaarlijk, hij is zelfs niet eens verstopt...
levels.traps.worndarttrap.name=versleten pijlval
levels.traps.worndarttrap.ondeath=Je bent gedood door de versleten pijlval...
levels.vaultlevel$vaultflametrap.desc=Uit deze ventilatieopening lijken met vaste tussenpozen groene vlammen te komen. _Aangezien dit slechts een testgebied is, zullen de vlammen uit de ventilatieopeningen u geen kwaad doen._
levels.vaultlevel$vaultflametrap.name=vlamventilatie in de kluis

levels.level.sign_desc=Je kunt de tekst vanaf hier niet lezen.
