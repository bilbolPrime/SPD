levels.cavesbosslevel.energy_desc=땅에서 전기 스파크가 튀고 있어서 밟으면 위험해요. 스파크가 특정 방향으로 모이는 것 같은데… 혹시 전원 쪽으로 향하는 걸까요?
levels.cavesbosslevel.gate_desc=드워프 도시로 향하는 길을 막고 있는 거대한 금속 문. 중앙의 금속 상자에서는 시끄러운 윙윙거리는 소리가 나고 있는데, 이는 주변의 회로 및 기계 장치와 연결되어 있음을 시사한다. 혹시 DM-300을 파괴하면 문이 열릴까?
levels.cavesbosslevel.gate_desc_broken=그 문은 DM-300과 어떤 식으로든 연결되어 있었던 것이 분명하다. DM-300이 패배했을 때 문도 폭발했기 때문이다. 이제 남은 것은 부서진 조각들뿐이다.
levels.cavesbosslevel.gate_name=금속 대문
levels.cavesbosslevel.water_desc=이 주변에 전기가 너무 많아서 물이 항상 안전한 건 아닐 수도 있어요...
levels.cavesbosslevel.wires_desc=땅이 부분적으로 파헤쳐져 있어 굵은 전선들이 노출되어 있습니다. 이 전선들은 여러 전기 기계들을 서로 연결하고 있는 것 같습니다. 전선에는 전류가 흐르고 있을 겁니다. 만약 DM-300이 이곳에 접근한다면 전력을 끌어다 쓸 수 있을지도 모릅니다.
levels.cavesbosslevel.wires_name=노출된 배선
levels.caveslevel.bookshelf_desc=동굴에 누가 책장이 필요하겠어요?
levels.caveslevel.entrance_desc=사다리는 더 깊은 곳으로 이어진다.
levels.caveslevel.exit_desc=사다리는 더 깊은 곳으로 이어진다.
levels.caveslevel.grass_name=형광 이끼
levels.caveslevel.high_grass_desc=거대한 버섯들이 시야를 가로막고 있다.
levels.caveslevel.high_grass_name=형광 버섯
levels.caveslevel.region_deco_desc=드워프들이 이곳에서 광물을 캐던 시절에 지었을 것으로 추정되는 거대한 금속 구조물입니다. 꼭대기에는 오랫동안 사용되지 않은 광산 수레 궤도가 나 있는 것 같습니다.
levels.caveslevel.region_deco_name=금속 구조물
levels.caveslevel.wall_deco_desc=벽에 광석 덩어리가 보인다. 금인가?
levels.caveslevel.water_name=얼음처럼 차가운 물
levels.citybosslevel.summoning_desc=이 받침대는 중앙에 커다란 구멍이 뚫려 있는데, 그 안에서 어둠의 에너지가 뿜어져 나오고 있습니다. 드워프 왕은 이 받침대를 자신의 강령술 마법의 중심점으로 사용하며, 하수인을 소환할 수 있습니다. 하수인이 나타나기까지는 몇 턴 동안 받침대가 에너지를 충전해야 하며, 소환되는 하수인의 종류는 충전되는 마법의 강도를 통해 알 수 있습니다.
levels.citybosslevel.summoning_name=소환대
levels.citybosslevel.throne_desc=이 엄청나게 큰 왕좌는 드워프 제국의 왕좌였지만, 지금은 권력에 미친 강령술사가 차지하고 있습니다. 왕좌에는 마법이나 기계적인 장치가 있는 것으로 보이며, 드워프 왕은 이 왕좌에 앉으면 추가적인 힘을 얻는 것 같습니다.
levels.citybosslevel.throne_name=왕좌
levels.citylevel.bookshelf_desc=다양한 분야의 책들이 책장을 가득 채우고 있다.
levels.citylevel.deco_desc=여기에 몇몇 타일이 빠져 있습니다.
levels.citylevel.entrance_desc=경사로를 따라 위쪽 깊이까지 올라갈 수 있습니다.
levels.citylevel.exit_desc=경사로를 따라 더 깊은 곳으로 내려갈 수 있습니다.
levels.citylevel.high_grass_name=높이 피는 꽃
levels.citylevel.region_deco_desc=높이 솟은 받침대 위에 밝은 녹색의 마법 불꽃이 타오르고 있다. 불꽃은 너무나 짙어서 마치 고체처럼 보인다.
levels.citylevel.region_deco_name=불타는 받침대
levels.citylevel.sp_desc=두꺼운 카펫이 바닥을 덮고 있다.
levels.citylevel.statue_desc=그 조각상은 영웅적인 자세로 서 있는 난쟁이를 묘사하고 있다.
levels.citylevel.upcoming_quest_intro_no=여기 머무르세요
levels.citylevel.upcoming_quest_intro_title=개발자 메시지
levels.citylevel.upcoming_quest_intro_yes=금고 안으로 내려가세요
levels.citylevel.water_name=수상쩍은 색깔의 물
levels.features.chasm.chasm=차이
levels.features.chasm.jump=정말 저 낭떠러지 속으로 뛰어들고 싶은 거야? 그렇게 높이 떨어지면 엄청 아플 텐데.
levels.features.chasm.no=아니요, 마음을 바꿨어요.
levels.features.chasm.ondeath=당신은 추락사했습니다...
levels.features.chasm.rankings_desc=충돌 직후 사망
levels.features.chasm.yes=네, 제가 뭘 하고 있는지 알고 있습니다.
levels.hallslevel.bookshelf_desc=고대 언어로 쓰인 책들이 책꽂이에서 연기를 내뿜으며 팽팽하게 서 있다.
levels.hallslevel.grass_name=엠버모스
levels.hallslevel.high_grass_name=에버펀지
levels.hallslevel.region_deco_desc=천장이나 근처 벽에서 떨어져 나온 것으로 보이는 거대한 돌덩이.
levels.hallslevel.region_deco_name=잔해 덩어리
levels.hallslevel.statue_desc=저 기둥은 실제 사람 두개골로 만들어졌네요. 정말 멋집니다.
levels.hallslevel.statue_name=기둥
levels.hallslevel.water_desc=용암처럼 보이지만 차갑고 만져도 안전할 거예요.
levels.hallslevel.water_name=차가운 용암
levels.level$feeling.chasm_desc=당신의 발걸음 소리가 던전 전체에 울려 퍼집니다.
levels.level$feeling.chasm_title=협곡 바닥
levels.level$feeling.dark_desc=어둠 속에서 적들이 움직이는 소리가 들린다.
levels.level$feeling.dark_title=어두운 바닥
levels.level$feeling.grass_desc=공기 중에 풀 냄새가 진하게 풍긴다.
levels.level$feeling.grass_title=잔디 바닥
levels.level$feeling.large_desc=이 던전 층은 유난히 넓어 보이네요.
levels.level$feeling.large_title=넓은 바닥
levels.level$feeling.secrets_desc=분위기가 이 층이 많은 비밀을 숨기고 있음을 암시합니다.
levels.level$feeling.secrets_title=비밀의 층
levels.level$feeling.traps_desc=이곳의 지형은 특히 위험해 보인다.
levels.level$feeling.traps_title=함정 바닥
levels.level$feeling.water_desc=주변에서 물 튀기는 소리가 들립니다.
levels.level$feeling.water_title=물바닥
levels.level.alchemy_desc=이 항아리에는 마법의 물이 가득 담겨 있습니다. 항아리 안에 여러 가지 물건을 넣어 새로운 것을 만들어낼 수 있어요!
levels.level.alchemy_name=연금술 냄비
levels.level.barricade_desc=나무 바리케이드는 단단히 세워져 있지만 세월이 흐르면서 말라버렸습니다. 불이 붙을 가능성이 있을까요?
levels.level.barricade_name=바리케이드
levels.level.bookshelf_name=책장
levels.level.chasm_desc=바닥이 보이지 않아요.
levels.level.chasm_name=차이
levels.level.closed_door_name=닫힌 문
levels.level.crystal_door_desc=이 잠긴 문은 마법의 수정으로 만들어졌습니다. 투명해서 안은 보이지만, 열려면 수정 열쇠가 필요합니다.
levels.level.crystal_door_name=크리스탈 도어
levels.level.default_name=???
levels.level.embers_desc=바닥에는 불씨가 흩어져 있다.
levels.level.embers_name=여신
levels.level.empty_well_desc=우물이 말라버렸습니다.
levels.level.empty_well_name=빈 우물
levels.level.entrace_name=깊이 입구
levels.level.entrance_desc=위층으로 이어지는 계단이 있다.
levels.level.exit_desc=계단은 더 깊은 곳으로 이어진다.
levels.level.exit_name=깊이 출구
levels.level.floor_name=바닥
levels.level.furrowed_grass_name=고랑이 진 식물
levels.level.grass_name=잔디
levels.level.hidden_trap=숨겨진 %s가 활성화되었습니다!
levels.level.high_grass_desc=빽빽한 초목이 시야를 가린다.
levels.level.high_grass_name=키 큰 풀
levels.level.inactive_trap_desc=함정은 이미 한 번 작동했기 때문에 더 이상 위험하지 않습니다.
levels.level.inactive_trap_name=작동된 함정
levels.level.locked_door_desc=이 문은 잠겨 있습니다. 문을 열려면 맞는 열쇠가 필요합니다.
levels.level.locked_door_name=잠긴 문
levels.level.locked_exit_desc=두꺼운 쇠창살이 아래로 내려가는 계단을 막고 있다.
levels.level.locked_exit_name=잠긴 깊이 출구
levels.level.open_door_name=문호 개방
levels.level.pedestal_name=받침대
levels.level.statue_desc=누군가 이곳을 꾸미려 했지만, 분명히 실패한 것 같다.
levels.level.statue_name=동상
levels.level.unlocked_exit_name=잠금 해제된 깊이 출구
levels.level.wall_name=벽
levels.level.water_desc=화재가 발생한 경우, 물속으로 들어가 불을 끄십시오.
levels.level.water_name=물
levels.level.well_name=잘
levels.mininglevel.barricade_desc=나무 바리케이드는 단단히 고정되어 천장을 지탱하는 역할을 합니다. 이것은 아마도 놀들이 낙석으로부터 보호하기 위해 건설한 것으로 보입니다. 인접한 감방들은 낙석 함정과 공격으로부터 보호될 것입니다. 다른 바리케이드처럼 불에도 잘 탈 것 같습니다.
levels.mininglevel.boulder_desc=큰 바위가 길을 막고 있네요. 곡괭이로 부수면 꽤 쉽게 갈 수 있을 거예요.
levels.mininglevel.boulder_name=둥근 돌
levels.mininglevel.crystal_desc=이곳에는 크고 화려한 수정 노두가 있습니다. 이 수정들은 깨지기 쉬워서 곡괭이로 쉽게 부서지거나, 근처에서 다른 광물을 채굴하면 깨질 수 있습니다.
levels.mininglevel.crystal_name=크리스탈 스파이크
levels.mininglevel.gold_extra_desc=곡괭이로 캐낼 수 있을 거예요.
levels.mininglevel.wall_desc=매끈하지만 일반적인 암벽보다 약간 부드러운 바위벽입니다. 곡괭이로 캘 수는 있지만, 힘이 좀 들고 허기도 약간 올라갑니다.
levels.prisonlevel.bookshelf_desc=이건 아마 교도소 도서관의 흔적일 거예요. 불에 탈 수도 있을까요?
levels.prisonlevel.empty_deco_desc=바닥에 오래된 핏자국이 있다.
levels.prisonlevel.region_deco_alt_desc=사람 한 명이 겨우 들어갈 만한 크기의 금속 우리. 사슬에 매달려 깊은 협곡 위에 아슬아슬하게 걸쳐 있다.
levels.prisonlevel.region_deco_alt_name=매달린 새장
levels.prisonlevel.region_deco_desc=사람 한 명이 들어갈 만한 크기의 금속 우리. 어떤 식으로든 땅에 고정되어 있어서 움직일 수가 없다.
levels.prisonlevel.region_deco_name=감옥 우리
levels.prisonlevel.water_name=어둡고 차가운 물
levels.rooms.quest.ambitiousimproom$questentrance.desc=이 불길한 구덩이는 고대 드워프의 금고 입구인 것 같다. 마법 장벽이 입구를 막고 있지만, 마치 바닥이 있는 것처럼 그 위를 걸어갈 수 있다.
levels.rooms.quest.ambitiousimproom$questentrance.name=금고 입구
levels.rooms.quest.blacksmithroom$questentrance.desc=이 사다리는 대장간 바로 아래에 있는 오래된 광산으로 이어진다.
levels.rooms.quest.blacksmithroom$questentrance.name=광산 입구
levels.rooms.quest.massgraveroom$bones.desc=바닥에 뼈들이 널려 있네. 여기서 무슨 일이 있었던 거지?
levels.rooms.quest.massgraveroom$bones.name=집단 매장지
levels.rooms.quest.mineentrance$questexit.desc=이 사다리는 광산 밖으로 나가 대장간 작업장으로 다시 이어진다.
levels.rooms.quest.mineentrance$questexit.name=광산 출구
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=어떤 어두운 의식에 사용되는 페인트로 칠한 표식입니다. 촛불은 보통 네 모서리에 놓입니다.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=의례적 표식
levels.rooms.special.magicalfireroom$eternalfire.desc=마법으로 만들어진 듯한 짙고 선명한 초록색 불꽃 벽이 여기에 있습니다. 불꽃이 너무 짙어서 그 안을 지나갈 수 없고, 가까이 다가가는 모든 것에 불을 붙입니다. 자연적으로 꺼질 기미가 보이지 않으니, 무언가를 사용해서 꺼야 할 겁니다.
levels.rooms.special.sentryroom$sentry.desc=이 핏빛 보초는 이 방 저편에 있는 보물을 지키기 위해 배치된 것 같습니다. 이 보초가 지키는 구역에 발을 들여놓으면 분해 마법 광선을 발사합니다. 모든 유해 효과에 면역이고 투명화도 꿰뚫어 볼 수 있지만, 발사하기 전에 충전하는 데 시간이 좀 걸리는 것 같습니다. 어째서인지 이 보초는 오직 당신에게만 공격을 퍼붓는데, 마치 던전의 거주자들이 보물에 아무런 위협이 되지 않는다는 것을 아는 듯합니다.
levels.rooms.special.sentryroom$sentry.discover_hint=이 적은 던전 어디에서든 찾을 수 있습니다.
levels.rooms.special.sentryroom$sentry.name=붉은 파수꾼
levels.rooms.special.toxicgasroom$toxicvent.desc=오래전 부주의한 모험가가 이 함정을 작동시킨 것이 분명합니다. 작동은 멈춘 상태이지만, 여전히 방 안으로 유독가스를 뿜어내고 있으며 멈출 기미가 보이지 않습니다. 이 방을 탐험하려면 유독가스로 인한 피해를 막을 방법을 찾아야 합니다.
levels.rooms.special.toxicgasroom$toxicvent.name=독성 분출구
levels.rooms.special.weakfloorroom$hiddenwell.desc=저 아래 깊은 곳에 우물이 희미하게 보이는데, 혹시 저 아래에 뭔가 있을지도 몰라?
levels.rooms.special.weakfloorroom$hiddenwell.name=먼 우물
levels.sewerlevel.bookshelf_desc=책꽂이에는 값싸고 쓸모없는 책들이 가득하다. 불이 날 수도 있지 않을까?
levels.sewerlevel.empty_deco_desc=축축하고 누런 이끼가 바닥을 덮고 있다.
levels.sewerlevel.region_deco_desc=당신 키만큼이나 큰 묵직한 통. 안에는 뭔가 가득 차 있을 게 분명해. 너무 무거워서 옮길 수가 없잖아.
levels.sewerlevel.region_deco_name=저장 배럴
levels.sewerlevel.water_name=탁한 물
levels.traps.alarmtrap.alarm=함정에서 날카로운 소리가 나면서 던전 전체에 울려 퍼집니다!
levels.traps.alarmtrap.desc=이 함정은 시끄러운 경보 장치와 연결되어 있는 것 같습니다. 경보가 울리면 같은 층에 있는 모든 사람들이 놀랄 것입니다.
levels.traps.alarmtrap.name=경보 함정
levels.traps.blazingtrap.desc=이 함정을 밟으면 강력한 화학 혼합물이 발화하여 넓은 지역에 화재가 발생합니다.
levels.traps.blazingtrap.name=불타는 함정
levels.traps.burningtrap.desc=이 함정을 밟으면 화학 혼합물에 불이 붙어 주변 지역에 불이 붙게 됩니다.
levels.traps.burningtrap.name=연소 함정
levels.traps.chillingtrap.desc=이 장치가 작동되면 내부의 화학 물질이 주변 공기를 빠르게 얼립니다.
levels.traps.chillingtrap.name=오싹한 함정
levels.traps.confusiontrap.desc=이 함정을 작동시키면 주변 지역에 혼란 가스 구름이 퍼져나갑니다.
levels.traps.confusiontrap.name=혼란 가스 트랩
levels.traps.corrosiontrap.desc=이 함정을 작동시키면 주변에 치명적인 산성 가스 구름이 퍼져나갑니다.
levels.traps.corrosiontrap.name=부식성 가스 트랩
levels.traps.cursingtrap.curse=낡은 장비는 저주받게 됩니다!
levels.traps.cursingtrap.desc=이 함정에는 저주받은 장비에서 발견되는 것과 같은 악의적인 마법이 담겨 있습니다. 함정을 작동시키면 주변의 일부 아이템에 저주가 걸립니다.
levels.traps.cursingtrap.name=저주 함정
levels.traps.disarmingtrap.desc=이 함정에는 매우 특수한 순간 이동 마법이 담겨 있어, 희생자의 무기를 다른 장소로 순간 이동시킵니다.
levels.traps.disarmingtrap.disarm=당신의 무기가 순간이동으로 사라졌습니다!
levels.traps.disarmingtrap.name=함정 해제
levels.traps.disintegrationtrap.desc=이 함정은 작동되면 가장 가까운 목표물을 파괴하는 광선으로 찔러 상당한 피해를 입히고 아이템을 파괴합니다. 다행히 작동 장치는 숨겨져 있지 않습니다.
levels.traps.disintegrationtrap.name=분해 함정
levels.traps.disintegrationtrap.ondeath=당신은 분해 함정에 걸려 죽었습니다...
levels.traps.disintegrationtrap.one=그 함정은 당신의 %s를 산산조각냅니다!
levels.traps.disintegrationtrap.some=함정이 당신의 %s 일부를 분해합니다!
levels.traps.distortiontrap.desc=기원을 알 수 없는 기묘한 마법으로 만들어진 이 함정은 온갖 종류의 생물들을 이곳으로 불러들일 것입니다.
levels.traps.distortiontrap.name=왜곡 함정
levels.traps.explosivetrap.desc=이 함정에는 분말 형태의 폭발물과 기폭 장치가 들어 있습니다. 작동시키면 주변 지역에서 폭발이 일어납니다.
levels.traps.explosivetrap.name=폭발 함정
levels.traps.flashingtrap.desc=이 함정은 작동 시 내부에 저장된 강력한 섬광 화약을 점화시켜 피해자를 일시적으로 눈멀게 하고, 불구로 만들며, 부상을 입힙니다. 이 함정은 고장 없이 여러 번 작동할 수 있으므로 많은 양의 화약을 저장해야 합니다.
levels.traps.flashingtrap.name=번쩍이는 함정
levels.traps.flocktrap.desc=어쩌면 아마추어 마법사의 장난일지도 모르지만, 이 함정을 작동시키면 마법 양 떼가 나타날 것이다.
levels.traps.flocktrap.name=떼덫
levels.traps.frosttrap.desc=이 장치가 작동되면 내부의 화학 물질이 장치 주변 넓은 범위의 공기를 빠르게 얼립니다.
levels.traps.frosttrap.name=서리 방지 장치
levels.traps.gatewaytrap.desc=이 특수한 순간이동 함정은 무한정 발동할 수 있으며, 항상 같은 위치로 순간이동시킵니다.
levels.traps.gatewaytrap.name=게이트웨이 트랩
levels.traps.geysertrap.desc=이 함정이 작동하면 물줄기가 솟구쳐 올라와 불타는 적에게 피해를 주고, 주변의 모든 캐릭터를 날려버리고, 불을 끄고, 주변 지형을 물로 바꿔놓습니다.
levels.traps.geysertrap.name=간헐천 함정
levels.traps.gnollrockfalltrap.desc=이 낙석 함정은 마법의 도움을 받아 만들어졌습니다. 작동되면 주변 5x5 범위 내에서 바위가 떨어져 내립니다. 이 지역의 바위는 비교적 무르기 때문에 일반 낙석 함정만큼 큰 피해를 주지는 않지만, 갑옷도 효과가 없습니다. 또한, 바리케이드가 있는 곳에는 바위가 떨어지지 않는데, 바리케이드가 천장을 지탱하는 역할을 하기 때문입니다. 이 함정은 아군과 적군을 구분하지 않으므로 놀에게도 플레이어에게도 똑같이 위험합니다.
levels.traps.gnollrockfalltrap.name=놀 낙석 함정
levels.traps.grimtrap.desc=이 함정에는 극도로 강력한 파괴 마법이 담겨 있어, 가장 건강한 영웅을 제외한 모든 영웅을 즉사시킬 수 있습니다. 함정을 작동시키면 가장 가까운 캐릭터에게 치명적인 마법의 원거리 공격이 가해집니다. 다행히 작동 장치는 숨겨져 있지 않습니다.
levels.traps.grimtrap.name=끔찍한 함정
levels.traps.grimtrap.ondeath=당신은 섬뜩한 함정의 폭발에 의해 목숨을 잃었습니다...
levels.traps.grippingtrap.desc=이 덫은 작동시킨 사람의 발에 달라붙어 피해를 입히고 움직임을 둔화시킵니다. 구조가 단순하기 때문에 고장 없이 여러 번 작동할 수 있습니다.
levels.traps.grippingtrap.name=꽉 쥐는 덫
levels.traps.guardiantrap$guardian.desc=이 푸른 형체는 던전의 돌 수호자 중 하나의 소환된 메아리인 것 같습니다.
levels.traps.guardiantrap$guardian.desc_weapon=조각상 자체는 거의 실체가 없지만, 조각상이 휘두르는 _%s_는 실체처럼 보인다.
levels.traps.guardiantrap$guardian.discover_hint=특정한 함정을 이용하면 이 적을 찾을 수 있습니다.
levels.traps.guardiantrap$guardian.name=소환된 수호자
levels.traps.guardiantrap.alarm=함정에서 날카로운 소리가 나면서 던전 전체에 울려 퍼집니다!
levels.traps.guardiantrap.desc=이 함정은 기묘한 마법 장치와 연결되어 있어 수호자를 소환하고 해당 층의 모든 적에게 경고를 보냅니다.
levels.traps.guardiantrap.name=수호자 함정
levels.traps.oozetrap.desc=이 함정은 작동되면 부식성 점액을 뿜어내는데, 이는 씻겨 나갈 때까지 화상을 입힙니다.
levels.traps.oozetrap.name=점액 덫
levels.traps.pitfalltrap.desc=이 함정은 커다란 함정문 장치에 연결되어 있으며, 작동되면 근처에 있는 모든 것이 땅속으로 미끄러져 떨어지게 됩니다! 단, 바닥이 특히 단단한 곳에서는 작동하지 않습니다.
levels.traps.pitfalltrap.name=함정
levels.traps.pitfalltrap.no_pit=땅이 너무 단단해서 함정은 여기서는 효과가 없을 겁니다.
levels.traps.pitfalltrap.triggered=덫이 작동하면서 땅이 무너지기 시작합니다!
levels.traps.pitfalltrap.triggered_hero=땅이 무너지기 시작하는 것 같아요!
levels.traps.poisondarttrap.desc=근처에 작은 다트 발사기를 숨겨두어야 합니다. 이 함정을 작동시키면 가장 가까운 목표물을 향해 독침이 발사됩니다. 다행히 방아쇠는 숨겨져 있지 않습니다.
levels.traps.poisondarttrap.name=독침 덫
levels.traps.poisondarttrap.ondeath=당신은 독침 덫에 걸려 사망했습니다...
levels.traps.rockfalltrap.desc=이 함정은 위쪽에 있는 여러 개의 느슨한 돌들과 연결되어 있어, 작동시키면 돌들이 방 전체로 쏟아져 내립니다! 만약 함정이 특정 방에 설치되어 있지 않다면, 돌들은 함정 주변 지역에 떨어질 것입니다. 다행히 작동 장치는 숨겨져 있지 않습니다.
levels.traps.rockfalltrap.name=낙석 함정
levels.traps.rockfalltrap.ondeath=당신은 낙석 함정에 깔려 죽었군요...
levels.traps.shockingtrap.desc=막대한 에너지가 저장된 메커니즘입니다. 이 함정을 작동시키면 저장된 에너지가 주변 자기장으로 방출됩니다.
levels.traps.shockingtrap.name=충격적인 함정
levels.traps.stormtrap.desc=엄청난 양의 에너지가 저장된 메커니즘입니다. 이 함정이 작동되면 저장된 에너지가 거대한 뇌우로 방출됩니다.
levels.traps.stormtrap.name=폭풍 함정
levels.traps.summoningtrap.desc=이 함정을 작동시키면 이 지역의 몬스터들이 이곳으로 몰려옵니다.
levels.traps.summoningtrap.name=소환 함정
levels.traps.teleportationtrap.desc=이 함정이 작동하면 주변의 모든 물체가 이 층의 무작위 위치로 순간 이동합니다.
levels.traps.teleportationtrap.name=순간이동 함정
levels.traps.tengudarttrap.desc=텐구는 분명히 싸움을 준비해 왔습니다. 이 함정은 숨겨진 독침 발사기를 작동시켜 텐구가 아닌 가장 가까운 대상에게 독침을 발사합니다. 함정은 매우 정교하게 만들어져 마법의 도움 없이는 작동 장치를 감지할 수 없습니다. 하지만 함정을 설치하는 순간 잠시 동안은 눈에 보입니다.
levels.traps.toxictrap.desc=이 함정을 작동시키면 주변 지역에 유독 가스 구름이 퍼져나갑니다.
levels.traps.toxictrap.name=유독가스 트랩
levels.traps.trap.discover_hint=이 함정은 던전에서 무작위로 발견될 수 있습니다. 각 지역마다 나타날 수 있는 함정의 종류가 다릅니다.
levels.traps.trap.rankings_desc=살해자: %s
levels.traps.warpingtrap.desc=이 함정은 순간 이동 함정과 비슷하지만, 영웅이 해당 층의 구조에 대한 정보를 잃게 만든다는 점도 다릅니다!
levels.traps.warpingtrap.name=왜곡 함정
levels.traps.weakeningtrap.desc=이 함정에 걸린 어둠의 마법은 접촉하는 모든 것의 에너지를 빨아들입니다. 하지만 강력한 적은 이 효과에 저항할 수도 있습니다.
levels.traps.weakeningtrap.name=약화 함정
levels.traps.worndarttrap.desc=근처에 작은 다트 발사기를 숨겨두어야 합니다. 이 함정을 작동시키면 가장 가까운 목표물을 향해 다트가 발사됩니다. (\n\n) 오래되어서 그다지 위험하지는 않고, 숨겨두지도 않았습니다...
levels.traps.worndarttrap.name=낡은 다트 함정
levels.traps.worndarttrap.ondeath=당신은 낡은 화살 덫에 걸려 죽었습니다...
levels.vaultlevel$vaultflametrap.desc=이 환풍구에서 일정한 간격으로 녹색 불꽃이 나오는 것 같습니다. _이곳은 시험 구역이므로 환풍구에서 나오는 불꽃은 실제로 사람에게 해를 끼치지 않습니다._
levels.vaultlevel$vaultflametrap.name=금고 화염 배출구

levels.level.sign_desc=여기서는 글자를 읽을 수 없습니다.
levels.level.sign_name=징후
