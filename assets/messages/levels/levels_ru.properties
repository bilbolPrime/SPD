levels.cavesbosslevel.energy_desc=Здесь земля искрит электричеством, и наступать на неё опасно. _Искры, кажется, движутся в определённом направлении..._ возможно, они ведут к источнику питания?
levels.cavesbosslevel.gate_desc=Большие металлические ворота преграждают путь в гномий мегаполис. Металлическая коробка в центре издает громкий гудящий звук, она, должно быть, подключена к расположенным рядом схемам и механизмам. Возможно, уничтожение DM-300 откроет ворота?
levels.cavesbosslevel.gate_desc_broken=Ворота, должно быть, были каким-то образом связаны с DM-300, поскольку они взорвались после поражения DM-300. Теперь от них остались только обломки.
levels.cavesbosslevel.gate_name=Металлические ворота
levels.cavesbosslevel.water_desc=Учитывая обилие электричества в этом регионе, вода не всегда может быть безопасной...
levels.cavesbosslevel.wires_desc=Здесь частично раскопана земля, видны крупные оголенные провода. Они, должно быть, соединяют различные электрические машины. По проводам, должно быть, протекает какой-то ток. Если DM-300 ступит сюда, он сможет получить от них питание.
levels.cavesbosslevel.wires_name=Открытая проводка
levels.caveslevel.bookshelf_desc=Кому нужна книжная полка в пещере?
levels.caveslevel.entrance_desc=Лестница ведет на верхнюю глубину.
levels.caveslevel.exit_desc=Лестница ведет вниз, на большую глубину.
levels.caveslevel.grass_name=Флуоресцентный мох
levels.caveslevel.high_grass_desc=Огромные грибы загораживают обзор.
levels.caveslevel.high_grass_name=Флуоресцентные грибы
levels.caveslevel.region_deco_desc=Большая цельнометаллическая конструкция, вероятно, построенная гномами, когда они добывали здесь руду. Кажется, вы видите давно заброшенные рельсы для вагонеток, идущие вдоль вершины.
levels.caveslevel.region_deco_name=Металлическая конструкция
levels.caveslevel.wall_deco_desc=На стене видна жила руды. Золото?
levels.caveslevel.water_name=Ледяная холодная вода
levels.citybosslevel.summoning_desc=Этот постамент имеет большое отверстие в центре, которое практически излучает темную энергию. Король гномов использует эти постаменты как фокусные точки для своей некромантической магии и может призывать к ним приспешников. Постамент должен заряжаться несколько ходов, прежде чем появится приспешник, а тип призываемого приспешника определяется магической силой здания.
levels.citybosslevel.summoning_name=пьедестал призыва
levels.citybosslevel.throne_desc=Этот впечатляюще огромный трон — резиденция гномьей империи, ныне захваченной одержимым властью некромантом. Похоже, что трон имеет какие-то магические или механические части, и, возможно, король гномов обладает дополнительной силой, сидя на нём.
levels.citybosslevel.throne_name=Трон
levels.citylevel.bookshelf_desc=Книжная полка заполнена рядами книг по различным дисциплинам.
levels.citylevel.deco_desc=Здесь отсутствует несколько плиток.
levels.citylevel.entrance_desc=Пандус ведет на верхнюю глубину.
levels.citylevel.exit_desc=Спуск ведет к нижней части бассейна.
levels.citylevel.high_grass_name=Высоко распускающиеся цветы
levels.citylevel.region_deco_desc=Возвышенный постамент с ярким зеленым магическим пламенем наверху. Пламя настолько плотное, что кажется твердым.
levels.citylevel.region_deco_name=Пылающий пьедестал
levels.citylevel.sp_desc=Пол покрыт толстым ковром.
levels.citylevel.statue_desc=Статуя изображает карлика, стоящего в героической позе.
levels.citylevel.upcoming_quest_intro_no=Оставайтесь здесь
levels.citylevel.upcoming_quest_intro_title=Сообщение для разработчиков
levels.citylevel.upcoming_quest_intro_yes=Спуститесь в хранилище
levels.citylevel.water_name=Вода подозрительного цвета
levels.features.chasm.chasm=Пропасть
levels.features.chasm.jump=Вы действительно хотите прыгнуть в пропасть? Падение с такой высоты будет болезненным.
levels.features.chasm.no=Нет, я передумал.
levels.features.chasm.ondeath=Ты упал и погиб...
levels.features.chasm.rankings_desc=Погиб при столкновении
levels.features.chasm.yes=Да, я знаю, что делаю.
levels.hallslevel.bookshelf_desc=На книжной полке тлеют книги на древних языках.
levels.hallslevel.grass_name=Эмбермос
levels.hallslevel.high_grass_name=Эмберфунги
levels.hallslevel.region_deco_desc=Огромный кусок камня, который, по всей видимости, откололся от потолка или ближайшей стены.
levels.hallslevel.region_deco_name=Кусок обломков
levels.hallslevel.statue_desc=Столб сделан из настоящих человеческих черепов. Потрясающе.
levels.hallslevel.statue_name=Столб
levels.hallslevel.water_desc=Выглядит как лава, но она холодная и, вероятно, к ней можно безопасно прикасаться.
levels.hallslevel.water_name=Холодная лава
levels.level$feeling.chasm_desc=Ваши шаги эхом разносятся по подземелью.
levels.level$feeling.chasm_title=пол пропасти
levels.level$feeling.dark_desc=В темноте слышно, как передвигаются враги.
levels.level$feeling.dark_title=темный пол
levels.level$feeling.grass_desc=В воздухе сильно пахнет растительностью.
levels.level$feeling.grass_title=травяной пол
levels.level$feeling.large_desc=Этот этаж подземелья кажется необычно большим.
levels.level$feeling.large_title=большой этаж
levels.level$feeling.secrets_desc=Атмосфера намекает на то, что этот этаж хранит множество секретов.
levels.level$feeling.secrets_title=секретный этаж
levels.level$feeling.traps_desc=Здесь местность кажется особенно опасной.
levels.level$feeling.traps_title=ловушки пол
levels.level$feeling.water_desc=Вы слышите, как вокруг вас плещется вода.
levels.level$feeling.water_title=дно воды
levels.level.alchemy_desc=Этот горшок наполнен волшебной водой. В него можно добавлять разные предметы, чтобы создавать что-то новое!
levels.level.alchemy_name=алхимический горшок
levels.level.barricade_desc=Деревянная баррикада прочно закреплена, но за прошедшие годы высохла. Может ли она загореться?
levels.level.barricade_name=Баррикада
levels.level.bookshelf_name=Книжная полка
levels.level.chasm_desc=Дна не видно.
levels.level.chasm_name=Пропасть
levels.level.closed_door_name=Закрытая дверь
levels.level.crystal_door_desc=Эта запертая дверь сделана из волшебного кристалла. Сквозь неё можно видеть, но чтобы открыть, вам понадобится кристальный ключ.
levels.level.crystal_door_name=Хрустальная дверь
levels.level.default_name=???
levels.level.embers_desc=Пол покрыт тлеющими углями.
levels.level.embers_name=Угли
levels.level.empty_well_desc=Колодец пересох.
levels.level.empty_well_name=Пустой колодец
levels.level.entrace_name=Глубинный вход
levels.level.entrance_desc=Лестница ведет наверх, вглубь помещения.
levels.level.exit_desc=Лестница ведет вниз, в самую глубокую часть.
levels.level.exit_name=Выход из глубины
levels.level.floor_name=Пол
levels.level.furrowed_grass_name=Бороздчатая растительность
levels.level.grass_name=Трава
levels.level.hidden_trap=Активируется скрытый %s!
levels.level.high_grass_desc=Густая растительность загораживает обзор.
levels.level.high_grass_name=Высокая трава
levels.level.inactive_trap_desc=Ловушка уже срабатывала раньше, и теперь она не опасна.
levels.level.inactive_trap_name=Сработала ловушка
levels.level.locked_door_desc=Эта дверь заперта, для её открытия нужен подходящий ключ.
levels.level.locked_door_name=Запертая дверь
levels.level.locked_exit_desc=Тяжелые прутья перекрывают лестницу, ведущую вниз.
levels.level.locked_exit_name=Выход из заблокированной глубины
levels.level.open_door_name=Открыть дверь
levels.level.pedestal_name=Подставка
levels.level.statue_desc=Кто-то хотел украсить это место, но, очевидно, потерпел неудачу.
levels.level.statue_name=Статуя
levels.level.unlocked_exit_name=Открыт выход на разблокированную глубину
levels.level.wall_name=Стена
levels.level.water_desc=В случае возгорания опуститесь в воду, чтобы потушить огонь.
levels.level.water_name=Вода
levels.level.well_name=Хорошо
levels.mininglevel.barricade_desc=Деревянная баррикада прочно закреплена и служит опорой для потолка. Вероятно, она была построена гноллами для защиты от падающих камней. _Любые соседние клетки будут защищены от камнепадов и нападений._ Похоже, она горит так же легко, как и любая другая баррикада.
levels.mininglevel.boulder_desc=Путь преграждает большой валун. Его довольно легко разбить киркой.
levels.mininglevel.boulder_name=Боулдер
levels.mininglevel.crystal_desc=Здесь находится большое и красочное месторождение кристаллов. Эти кристаллы хрупкие и легко ломаются киркой, или же разобьются, если рядом с ними что-нибудь добывать.
levels.mininglevel.crystal_name=Кристаллический шип
levels.mininglevel.gold_extra_desc=Вероятно, вы сможете добыть его киркой.
levels.mininglevel.wall_desc=Гладкая каменная стена, немного мягче обычной. Вы можете прорубить в ней себе путь киркой, но это потребует усилий и немного повысит ваш аппетит.
levels.prisonlevel.bookshelf_desc=Вероятно, это остатки тюремной библиотеки. Может, она сгорит?
levels.prisonlevel.empty_deco_desc=На полу видны старые пятна крови.
levels.prisonlevel.region_deco_alt_desc=Металлическая клетка, едва вмещающая человека. Она висит над глубокой пропастью, подвешенная на цепи.
levels.prisonlevel.region_deco_alt_name=Подвесная клетка
levels.prisonlevel.region_deco_desc=Металлическая клетка, как раз подходящего размера, чтобы вместить человека. Кажется, она каким-то образом прикреплена к земле, её нельзя сдвинуть с места.
levels.prisonlevel.region_deco_name=Тюремная клетка
levels.prisonlevel.water_name=Темная холодная вода
levels.rooms.quest.ambitiousimproom$questentrance.desc=Эта зловещая яма, похоже, является входом в какое-то древнее гномье хранилище. Магический барьер препятствует входу, но можно пройти по нему, как будто здесь есть пол.
levels.rooms.quest.ambitiousimproom$questentrance.name=Вход в хранилище
levels.rooms.quest.blacksmithroom$questentrance.desc=Эта лестница ведет в старую шахту, расположенную прямо под кузницей.
levels.rooms.quest.blacksmithroom$questentrance.name=Вход в шахту
levels.rooms.quest.massgraveroom$bones.desc=Пол усеян костями, что здесь произошло?
levels.rooms.quest.massgraveroom$bones.name=Массовое захоронение
levels.rooms.quest.mineentrance$questexit.desc=Эта лестница ведет из шахты обратно в кузницу.
levels.rooms.quest.mineentrance$questexit.name=Выход из шахты
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Нарисованный маркер для какого-либо темного ритуала. Свечи обычно ставят по четырем углам.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ритуальный маркер
levels.rooms.special.magicalfireroom$eternalfire.desc=Здесь возвышается стена густого ярко-зеленого огня, словно созданная магией. Она настолько плотная, что сквозь неё невозможно пройти, и она поджигает всё, что приближается слишком близко. Она не проявляет признаков естественного сгорания, поэтому вам понадобится что-то, чтобы её потушить.
levels.rooms.special.sentryroom$sentry.desc=Этот кроваво-красный часовой, похоже, расположился здесь, чтобы охранять сокровище в другом конце комнаты. Он будет стрелять в вас лучами магии распада, если вы наступите на защищаемую им территорию. Он невосприимчив ко всем вредным воздействиям и может видеть сквозь невидимость, но, похоже, ему требуется некоторое время, чтобы зарядиться перед началом стрельбы. Каким-то образом часовой хочет стрелять только в вас, как будто знает, что обитатели подземелья не представляют угрозы для сокровища.
levels.rooms.special.sentryroom$sentry.discover_hint=Этот враг может быть найден в любом месте подземелья.
levels.rooms.special.sentryroom$sentry.name=красный часовой
levels.rooms.special.toxicgasroom$toxicvent.desc=Должно быть, какой-то неосторожный искатель приключений активировал эту ловушку давным-давно. Несмотря на то, что она неактивна, она всё ещё извергает ядовитый газ в комнату и не показывает никаких признаков прекращения. Вам понадобится какой-то способ предотвратить повреждения от газа, если вы хотите исследовать эту комнату.
levels.rooms.special.toxicgasroom$toxicvent.name=токсичный вентиляционный канал
levels.rooms.special.weakfloorroom$hiddenwell.desc=В глубине можно различить колодец, возможно, там что-то есть?
levels.rooms.special.weakfloorroom$hiddenwell.name=дальний колодец
levels.sewerlevel.bookshelf_desc=На книжной полке полно дешевых, бесполезных книг. Может, они сгорят?
levels.sewerlevel.empty_deco_desc=Пол покрыт влажным желтоватым мхом.
levels.sewerlevel.region_deco_desc=Крепкая бочка, почти такого же размера, как ты. Должно быть, она чем-то наполнена, раз она слишком тяжелая, чтобы ее передвинуть.
levels.sewerlevel.region_deco_name=бочка для хранения
levels.sewerlevel.water_name=Мутная вода
levels.traps.alarmtrap.alarm=Ловушка издает пронзительный звук, эхом разносящийся по всему подземелью!
levels.traps.alarmtrap.desc=Похоже, эта ловушка подключена к громкой сигнализации. Срабатывание сигнализации, скорее всего, привлечет внимание всех обитателей уровня.
levels.traps.alarmtrap.name=сигнальная ловушка
levels.traps.blazingtrap.desc=Наступив на эту ловушку, вы воспламените мощную химическую смесь, которая вызовет пожар на большой площади.
levels.traps.blazingtrap.name=пылающая ловушка
levels.traps.burningtrap.desc=Наступив на эту ловушку, вы воспламените химическую смесь, что вызовет пожар в окружающей местности.
levels.traps.burningtrap.name=горящая ловушка
levels.traps.chillingtrap.desc=При активации химические вещества в этой ловушке быстро заморозят воздух вокруг места её расположения.
levels.traps.chillingtrap.name=леденящая ловушка
levels.traps.confusiontrap.desc=Активация этой ловушки приведет к выбросу облака газа, вызывающего замешательство, в непосредственной близости.
levels.traps.confusiontrap.name=газовая ловушка для дезинформации
levels.traps.corrosiontrap.desc=Активация этой ловушки приведет к выбросу в непосредственной близости облака смертельно опасного кислотного газа.
levels.traps.corrosiontrap.name=ловушка для коррозионного газа
levels.traps.cursingtrap.curse=Ваше изношенное оборудование становится проклятым!
levels.traps.cursingtrap.desc=Эта ловушка содержит ту же злонамеренную магию, что и проклятое снаряжение. При её срабатывании некоторые предметы в непосредственной близости будут прокляты.
levels.traps.cursingtrap.name=ловушка проклятий
levels.traps.disarmingtrap.desc=Эта ловушка содержит очень специфическую магию телепортации, которая переместит оружие жертвы в другое место.
levels.traps.disarmingtrap.disarm=Ваше оружие телепортировалось!
levels.traps.disarmingtrap.name=обезвреживание ловушки
levels.traps.disintegrationtrap.desc=При срабатывании эта ловушка обрушит на ближайшую цель лучи распада, нанося значительный урон и уничтожая предметы. К счастью, механизм срабатывания не скрыт.
levels.traps.disintegrationtrap.name=ловушка распада
levels.traps.disintegrationtrap.ondeath=Вы погибли в ловушке распада...
levels.traps.disintegrationtrap.one=Ловушка уничтожает ваш %s!
levels.traps.disintegrationtrap.some=Ловушка уничтожает часть вашего %s!
levels.traps.distortiontrap.desc=Эта ловушка, созданная с помощью странной магии неизвестного происхождения, призовет в это место самых разных существ.
levels.traps.distortiontrap.name=ловушка искажений
levels.traps.explosivetrap.desc=Эта ловушка содержит порошкообразное взрывчатое вещество и спусковой механизм. При её активации произойдёт взрыв в непосредственной близости.
levels.traps.explosivetrap.name=взрывная ловушка
levels.traps.flashingtrap.desc=При активации эта ловушка воспламеняет хранящийся внутри мощный порох, временно ослепляя, калеча и раня жертву. Ловушка должна иметь большой запас пороха, так как она может активироваться много раз, не ломаясь.
levels.traps.flashingtrap.name=мигающая ловушка
levels.traps.flocktrap.desc=Возможно, это шутка какого-нибудь мага-любителя, и активация этой ловушки создаст стадо волшебных овец.
levels.traps.flocktrap.name=ловушка для стада
levels.traps.frosttrap.desc=При активации химические вещества в этой ловушке быстро заморозят воздух в широком диапазоне вокруг места её расположения.
levels.traps.frosttrap.name=морозная ловушка
levels.traps.gatewaytrap.desc=Эта особая телепортационная ловушка может активироваться бесконечное количество раз и всегда телепортирует в одно и то же место.
levels.traps.gatewaytrap.name=ловушка шлюза
levels.traps.geysertrap.desc=При срабатывании эта ловушка вызовет извержение водяного гейзера, наносящего урон огненным врагам, отбрасывающего всех находящихся поблизости персонажей, гасящего пожары и превращающего окружающую местность в воду.
levels.traps.geysertrap.name=ловушка для гейзера
levels.traps.gnollrockfalltrap.desc=Эта камнепадная ловушка создана с помощью магии. При срабатывании она заставляет камни разваливаться и немедленно падать сверху в области 5x5 вокруг себя. Из-за более мягких камней в этой области она не нанесет такого же урона, как обычная камнепадная ловушка, но и ваша броня не будет против нее. Камни также не будут падать в местах, где есть баррикада, так как она поддерживает потолок. Эта ловушка не может отличить друга от врага, поэтому она так же опасна для гноллов, как и для вас.
levels.traps.gnollrockfalltrap.name=ловушка для камнепадов гноллов
levels.traps.grimtrap.desc=В этой ловушке хранится невероятно мощная разрушительная магия, достаточная, чтобы мгновенно убить всех героев, кроме самых здоровых. При её активации в ближайшего персонажа будет направлен смертоносный магический заряд дальнего действия. К счастью, механизм срабатывания не скрыт.
levels.traps.grimtrap.name=мрачная ловушка
levels.traps.grimtrap.ondeath=Вы погибли от взрыва зловещей ловушки...
levels.traps.grippingtrap.desc=Эта ловушка цепляется за ноги того, кто её активирует, нанося ему урон и замедляя его движение. Благодаря своей простой конструкции, эта ловушка может срабатывать много раз, не ломаясь.
levels.traps.grippingtrap.name=ловушка для захвата
levels.traps.guardiantrap$guardian.desc=Это синее привидение, похоже, является призванным эхом одного из каменных стражей подземелья.
levels.traps.guardiantrap$guardian.desc_weapon=Хотя сама статуя практически неосязаема, оружие, которое она держит, выглядит очень реалистично.
levels.traps.guardiantrap$guardian.discover_hint=Этого врага можно обнаружить с помощью специальной ловушки.
levels.traps.guardiantrap$guardian.name=призванный страж
levels.traps.guardiantrap.alarm=Ловушка издает пронзительный звук, эхом разносящийся по всему подземелью!
levels.traps.guardiantrap.desc=Эта ловушка связана со странным магическим механизмом, который призовет стражей и оповестит всех врагов на этаже.
levels.traps.guardiantrap.name=ловушка стража
levels.traps.oozetrap.desc=При срабатывании эта ловушка будет разбрызгивать едкую жидкость, которая будет гореть, пока её не смоет.
levels.traps.oozetrap.name=ловушка для слизи
levels.traps.pitfalltrap.desc=Эта ловушка соединена с большим механизмом люка, и вскоре после его срабатывания всё, что находится рядом, провалится сквозь землю и упадёт! Однако она не сработает в местах с особенно твёрдым полом.
levels.traps.pitfalltrap.name=ловушка-яма
levels.traps.pitfalltrap.no_pit=Земля здесь слишком твердая, чтобы здесь сработала ловушка-яма.
levels.traps.pitfalltrap.triggered=Земля начинает проваливаться вокруг сработавшей ловушки!
levels.traps.pitfalltrap.triggered_hero=Земля начинает проваливаться вокруг вас!
levels.traps.poisondarttrap.desc=Неподалеку необходимо спрятать небольшой метатель дротиков; активация этой ловушки заставит её выстрелить отравленным дротиком в ближайшую цель. К счастью, спусковой механизм не спрятан.
levels.traps.poisondarttrap.name=ловушка с отравленными дротиками
levels.traps.poisondarttrap.ondeath=Вы погибли от отравленной ловушки с дротиками...
levels.traps.rockfalltrap.desc=Эта ловушка соединена с рядом рыхлых камней сверху; при её срабатывании камни обрушатся на всю комнату! Если ловушка находится не в конкретной комнате, камни упадут в область вокруг ловушки. К счастью, механизм срабатывания не скрыт.
levels.traps.rockfalltrap.name=камнепадная ловушка
levels.traps.rockfalltrap.ondeath=Вы были раздавлены камнепадом...
levels.traps.shockingtrap.desc=Механизм, в котором запасено большое количество энергии. При срабатывании этой ловушки эта энергия высвобождается в окружающее её поле.
levels.traps.shockingtrap.name=шокирующая ловушка
levels.traps.stormtrap.desc=Механизм, в котором запасено огромное количество энергии. Срабатывание этой ловушки высвободит эту энергию в виде мощной электрической бури.
levels.traps.stormtrap.name=ловушка для шторма
levels.traps.summoningtrap.desc=Активация этой ловушки призовет в это место множество монстров из этой области.
levels.traps.summoningtrap.name=ловушка призыва
levels.traps.teleportationtrap.desc=При каждом срабатывании этой ловушки все предметы вокруг нее телепортируются в случайные места на этом этаже.
levels.traps.teleportationtrap.name=ловушка телепортации
levels.traps.tengudarttrap.desc=Тэнгу явно готовился к бою. Эта ловушка активирует скрытый метатель дротиков, который выстрелит отравленным дротиком в ближайшее существо, не являющееся Тэнгу. Ловушка настолько хорошо сделана, что механизм срабатывания невозможно обнаружить без магической помощи. Однако ловушка видна на мгновение, когда её устанавливают.
levels.traps.toxictrap.desc=При срабатывании этой ловушки в окружающей местности образуется облако токсичных газов.
levels.traps.toxictrap.name=ловушка для токсичных газов
levels.traps.trap.discover_hint=Эту ловушку можно найти случайным образом в подземелье. В каждом регионе встречаются разные ловушки.
levels.traps.trap.rankings_desc=Убит: %s
levels.traps.warpingtrap.desc=Эта ловушка похожа на ловушку телепортации, но при этом заставит героя потерять представление о планировке этажа!
levels.traps.warpingtrap.name=ловушка деформации
levels.traps.weakeningtrap.desc=В этой ловушке темная магия высасывает энергию из всего, что с ней соприкасается. Однако могущественные враги могут противостоять этому эффекту.
levels.traps.weakeningtrap.name=ослабляющая ловушка
levels.traps.worndarttrap.desc=Небольшой метатель дротиков должен быть спрятан неподалеку; активация этой ловушки заставит его выстрелить в ближайшую цель. Из-за своего возраста он не очень опасен, он даже не спрятан...
levels.traps.worndarttrap.name=изношенная ловушка для дротиков
levels.traps.worndarttrap.ondeath=Вы погибли от изношенной ловушки для дротиков...
levels.vaultlevel$vaultflametrap.desc=Из этого вентиляционного отверстия, похоже, периодически вырываются зеленые языки пламени. Поскольку это всего лишь тестовая площадка, пламя из вентиляционных отверстий вам на самом деле не причинит вреда.
levels.vaultlevel$vaultflametrap.name=вентиляционное отверстие для пламени в хранилище

levels.level.sign_desc=Отсюда текст прочитать нельзя.
levels.level.sign_name=Знак
