levels.level.open_door_name=Otevřené dveře
levels.level.pedestal_name=Podstavec
levels.level.statue_desc=Někdo chtěl toto místo ozdobit, ale očividně se mu to nepodařilo.
levels.level.statue_name=Socha
levels.level.unlocked_exit_name=Odemčený hloubkový výstup
levels.level.wall_name=Zeď
levels.level.water_desc=V případě hoření vkročte do vody, abyste oheň uhasili.
levels.level.water_name=Voda
levels.level.well_name=Dobře
levels.mininglevel.barricade_desc=Dřevěná barikáda je pevně postavena a slouží jako opora stropu.\n\nPravděpodobně ji postavili gnollové, aby poskytla určitou ochranu před padajícími kameny. _Všechny sousední buňky budou chráněny před pastmi a útoky způsobenými padajícími kameny._\n\nVypadá to, že by hořela stejně dobře jako jakákoli jiná barikáda.
levels.mininglevel.boulder_desc=Cestu blokuje velký balvan. Mělo by být docela snadné ho rozbít krumpáčem.
levels.mininglevel.boulder_name=Balvan
levels.mininglevel.crystal_desc=Nachází se zde velký a barevný krystalový výběžek. Tyto krystaly jsou křehké a lze je snadno rozbít krumpáčem, nebo se rozbijí, pokud se vedle nich něco vytěží.
levels.mininglevel.crystal_name=Křišťálový hrot
levels.mininglevel.gold_extra_desc=Pravděpodobně to zvládnete vydolovat krumpáčem.
levels.mininglevel.wall_desc=Hladká skalní stěna, která je trochu měkčí než obvykle. Můžete se skrz ni prodírat krumpáčem, ale bude to vyžadovat trochu úsilí a trochu to zvýší váš hlad.
levels.prisonlevel.bookshelf_desc=Tohle je pravděpodobně pozůstatek vězeňské knihovny. Mohla by shořet?
levels.prisonlevel.empty_deco_desc=Na podlaze jsou staré skvrny od krve.
levels.prisonlevel.region_deco_alt_desc=Kovová klec tak akorát velká, aby se do ní vešel člověk. Visí nad hlubokou propastí, zavěšená na řetězu.
levels.prisonlevel.region_deco_alt_name=Závěsná klec
levels.prisonlevel.region_deco_desc=Kovová klec tak akorát velká, aby se do ní vešel člověk. Zdá se, že je nějakým způsobem připevněná k zemi, nedá se s ní hnout.
levels.prisonlevel.region_deco_name=Vězeňská klec
levels.prisonlevel.water_name=Tmavá studená voda
levels.rooms.quest.ambitiousimproom$questentrance.desc=Tato zlověstná jáma vypadá jako vchod do nějaké starobylé trpasličí krypty. Vstupu brání magická bariéra, můžete po ní přejít, jako by zde byla podlaha.
levels.rooms.quest.ambitiousimproom$questentrance.name=Vchod do trezoru
levels.rooms.quest.blacksmithroom$questentrance.desc=Tento žebřík vede do starého dolu hned pod kovárnou.
levels.rooms.quest.blacksmithroom$questentrance.name=Vchod do dolu
levels.rooms.quest.massgraveroom$bones.desc=Kosti poházené po podlaze, co se tu stalo?
levels.rooms.quest.massgraveroom$bones.name=Hromadný hrob
levels.rooms.quest.mineentrance$questexit.desc=Tento žebřík vede z dolu zpět do kovářské dílny.
levels.rooms.quest.mineentrance$questexit.name=Východ z dolu
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Malovaná značka pro nějaký temný rituál. Svíčky se obvykle umisťují na čtyři rohy.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Rituální značka
levels.rooms.special.magicalfireroom$eternalfire.desc=Je zde zeď hustého jasně zeleného ohně, zřejmě způsobená magií. Je tak hustá, že se skrz ni nemůžete pohybovat, a zapálí vše, co se k ní dostane příliš blízko. Nejeví žádné známky přirozeného hoření, budete ji muset uhasit něčím.
levels.rooms.special.sentryroom$sentry.desc=Zdá se, že tento krvavě rudý strážný je zde umístěn, aby střežil poklad na druhém konci této místnosti. Pokud vstoupíte do oblasti, kterou brání, vystřelí na vás paprsky rozkladné magie.\n\nJe imunní vůči všem škodlivým účinkům a dokáže vidět skrz neviditelnost, ale zdá se, že mu chvíli trvá, než se nabije, než začne střílet.\n\nStrážný chce nějakým způsobem střílet jen na vás, jako by věděl, že obyvatelé podzemí nepředstavují pro poklad hrozbu.
levels.rooms.special.sentryroom$sentry.discover_hint=Tohoto nepřítele najdete kdekoli v podzemí.
levels.rooms.special.sentryroom$sentry.name=červená stráž
levels.rooms.special.toxicgasroom$toxicvent.desc=Tuto past musel před dávnými časy spustit nějaký neopatrný dobrodruh. Navzdory neaktivnímu stavu stále chrlí do místnosti toxický plyn a nejeví žádné známky toho, že by přestala. Pokud chcete tuto místnost prozkoumat, budete potřebovat nějaký způsob, jak zabránit poškození plynem.
levels.rooms.special.toxicgasroom$toxicvent.name=toxický výduch
levels.rooms.special.weakfloorroom$hiddenwell.desc=V hlubinách dole je vidět sotva studna, možná tam něco je?
levels.rooms.special.weakfloorroom$hiddenwell.name=vzdálená studna
levels.sewerlevel.bookshelf_desc=Knihovna je plná levných a nepoužitelných knih. Mohla by se spálit?
levels.sewerlevel.empty_deco_desc=Podlahu pokrývá mokrý nažloutlý mech.
levels.sewerlevel.region_deco_desc=Robustní sud, který je skoro stejně velký jako ty. Musí být něčeho plný, je příliš těžký na to, aby se s ním dalo hýbat.
levels.sewerlevel.region_deco_name=Skladovací sud
levels.sewerlevel.water_name=Kalná voda
levels.traps.alarmtrap.alarm=Past vydává pronikavý zvuk, který se rozléhá po celém podzemí!
levels.traps.alarmtrap.desc=Zdá se, že tato past je spojena s hlasitým poplašným mechanismem. Jeho spuštění pravděpodobně upozorní všechny na úrovni.
levels.traps.alarmtrap.name=poplašná past
levels.traps.blazingtrap.desc=Šlápnutí na tuto past zapálí silnou chemickou směs, která vznítí širokou oblast.
levels.traps.blazingtrap.name=planoucí past
levels.traps.burningtrap.desc=Šlápnutí na tuto past zapálí chemickou směs a zapálí okolní oblast.
levels.traps.burningtrap.name=hořící past
levels.traps.chillingtrap.desc=Po aktivaci chemikálie v této pasti rychle zmrazí vzduch v okolí.
levels.traps.chillingtrap.name=mrazivá past
levels.traps.confusiontrap.desc=Spuštění této pasti uvolní v bezprostřední blízkosti oblak plynu způsobujícího zmatek.
levels.traps.confusiontrap.name=past na zmatek
levels.traps.corrosiontrap.desc=Aktivace této pasti uvolní v bezprostřední blízkosti oblak smrtelně kyselého plynu.
levels.traps.corrosiontrap.name=lapač korozivních plynů
levels.traps.cursingtrap.curse=Vaše opotřebované vybavení se stane prokletým!
levels.traps.cursingtrap.desc=Tato past obsahuje stejnou zlověstnou magii, která se nachází v prokletém vybavení. Jejím spuštěním se proklejí některé předměty v bezprostředním okolí.
levels.traps.cursingtrap.name=past na proklínání
levels.traps.disarmingtrap.desc=Tato past obsahuje velmi specifickou teleportační magii, která deformuje zbraň oběti na jiné místo.
levels.traps.disarmingtrap.disarm=Tvoje zbraň je teleportována pryč!
levels.traps.disarmingtrap.name=odzbrojující past
levels.traps.disintegrationtrap.desc=Po spuštění tato past probodne nejbližší cíl paprsky rozpadu, které způsobí značné poškození a zničí předměty. \n\nNaštěstí spouštěcí mechanismus není skrytý.
levels.traps.disintegrationtrap.name=rozpadová past
levels.traps.disintegrationtrap.ondeath=Zabila tě rozpadová past...
levels.traps.disintegrationtrap.one=Past rozloží tvůj %s!
levels.traps.disintegrationtrap.some=Past rozkládá část tvého %s!
levels.traps.distortiontrap.desc=Tato past, postavená z podivné magie neznámého původu, přivolá na toto místo nejrůznější tvory.
levels.traps.distortiontrap.name=past zkreslení
levels.traps.explosivetrap.desc=Tato past obsahuje práškovou výbušninu a spouštěcí mechanismus. Její aktivace způsobí explozi v bezprostřední blízkosti.
levels.traps.explosivetrap.name=výbušná past
levels.traps.flashingtrap.desc=Po aktivaci tato past zapálí silný blikající prášek uložený uvnitř, který dočasně oslepí, ochromí a zraní svou oběť. \n\nPast musí mít velkou zásobu prášku, protože se může aktivovat mnohokrát, aniž by se rozbila.
levels.traps.flashingtrap.name=blikající past
levels.traps.flocktrap.desc=Možná vtip nějakého amatérského mága, spuštění této pasti vytvoří stádo magických ovcí.
levels.traps.flocktrap.name=past na hejna
levels.traps.frosttrap.desc=Po aktivaci chemikálie v této pasti rychle zmrazí vzduch v širokém rozmezí kolem jejího umístění.
levels.traps.frosttrap.name=mrazová past
levels.traps.gatewaytrap.desc=Tato speciální teleportační past se může aktivovat nekonečněkrát a vždy se teleportuje na stejné místo.
levels.traps.gatewaytrap.name=bránová past
levels.traps.geysertrap.desc=Po spuštění této pasti vytryskne gejzír vody, který poškodí ohnivé nepřátele, odrazí všechny postavy v okolí, uhasí požáry a promění okolní terén ve vodu.
levels.traps.geysertrap.name=gejzírová past
levels.traps.gnollrockfalltrap.desc=Tato past na padající kameny je vyrobena s nějakou formou magické asistence. Po spuštění se kameny uvolní a okamžitě spadnou shora v oblasti 5x5 kolem ní. Vzhledem k měkčím kamenům v oblasti nezpůsobí tolik poškození jako běžná past na padající kameny, ale vaše brnění proti ní také nebude účinné. Kameny také nebudou padat v místech s přilehlou barikádou, protože pomáhají držet strop.\n\n_Tato past nedokáže rozeznat přítele od nepřítele, a proto je stejně škodlivá pro gnolly jako pro vás._
levels.traps.gnollrockfalltrap.name=past na skalní sesuvy gnollů
levels.traps.grimtrap.desc=V této pasti je uložena extrémně silná ničivá magie, dostatečná k okamžitému zabití všech hrdinů kromě těch nejzdravějších. Jejím spuštěním se vyšle výbuch smrtící magie na dálku směrem k nejbližší postavě. \n\nNaštěstí spouštěcí mechanismus není skrytý.
levels.traps.grimtrap.name=ponurá past
levels.traps.grimtrap.ondeath=Zabil tě výbuch ponuré pasti...
levels.traps.grippingtrap.desc=Tato past se zachytí na nohou toho, kdo ji spustí, čímž ho poškodí a zpomalí jeho pohyb. \n\nVzhledem ke své jednoduché povaze se tato past může aktivovat mnohokrát, aniž by se zlomila.
levels.traps.grippingtrap.name=uchopovací past
levels.traps.guardiantrap$guardian.desc=Toto modré zjevení se zdá být přivolanou ozvěnou jednoho z kamenných strážců jeskyně.
levels.traps.guardiantrap$guardian.desc_weapon=Zatímco samotná socha je téměř nehmotná, _%s_, kterou drží, vypadá skutečně.
levels.traps.guardiantrap$guardian.discover_hint=Tohoto nepřítele najdete pomocí specifické pasti.
levels.traps.guardiantrap$guardian.name=přivolaný opatrovník
levels.traps.guardiantrap.alarm=Past vydává pronikavý zvuk, který se rozléhá po celém podzemí!
levels.traps.guardiantrap.desc=Tato past je spojena s podivným magickým mechanismem, který přivolá strážce a upozorní všechny nepřátele na podlaze.
levels.traps.guardiantrap.name=past strážců
levels.traps.oozetrap.desc=Tato past po aktivaci vystříkne žíravý sliz, který bude hořet, dokud nebude smyt.
levels.traps.oozetrap.name=lapač slizu
levels.traps.pitfalltrap.desc=Tato past je připojena k velkému mechanismu padacích dveří a krátce po jejím spuštění cokoli v její blízkosti proklouzne skrz zem a spadne! Nebude však fungovat v oblastech s obzvláště pevnou podlahou.
levels.traps.pitfalltrap.name=past
levels.traps.pitfalltrap.no_pit=Země je příliš pevná na to, aby zde fungovala past.
levels.traps.pitfalltrap.triggered=Země kolem spuštěné pasti se začíná propadat!
levels.traps.pitfalltrap.triggered_hero=Země kolem vás se začíná propadat!
levels.traps.poisondarttrap.desc=Poblíž musí být schovaný malý šípový foukač. Aktivace této pasti způsobí, že na nejbližší cíl vystřelí otrávený šíp. \n\nNaštěstí spoušťový mechanismus není skrytý.
levels.traps.poisondarttrap.name=past na jedovaté šípy
levels.traps.poisondarttrap.ondeath=Zabila tě past s jedovatými šipkami...
levels.traps.rockfalltrap.desc=Tato past je propojena s řadou uvolněných kamenů nahoře. Jejím spuštěním se zřítí kameny po celé místnosti! Pokud se past nenachází v konkrétní místnosti, kameny budou padat do oblasti kolem pasti. \n\nNaštěstí spoušťový mechanismus není skrytý.
levels.traps.rockfalltrap.name=past na sesunutí kamení
levels.traps.rockfalltrap.ondeath=Byl jsi rozdrcen pastí zřícených kamenů...
levels.traps.shockingtrap.desc=Mechanismus s velkým množstvím energie, která je v něm uložena. Spuštěním této pasti se tato energie vybije do pole kolem ní.
levels.traps.shockingtrap.name=šokující past
levels.traps.stormtrap.desc=Mechanismus s obrovským množstvím energie, která je v něm uložena. Spuštění této pasti vybije tuto energii do velké elektrické bouře.
levels.traps.stormtrap.name=bouřková past
levels.traps.summoningtrap.desc=Spuštění této pasti přivolá na toto místo několik monster z této oblasti.
levels.traps.summoningtrap.name=přivolávací past
levels.traps.teleportationtrap.desc=Kdykoli se tato past spustí, vše kolem ní se teleportuje na náhodná místa v tomto patře.
levels.traps.teleportationtrap.name=teleportační past
levels.traps.tengudarttrap.desc=Tengu se evidentně připravoval na boj. Tato past aktivuje skrytý šípový ventilátor, který vystřelí jedovatý šíp na nejbližší věc, která není Tengu.\n\nPast je tak dobře vyrobená, že spouštěcí mechanismus je nemožné odhalit bez magické pomoci. Past je však na okamžik viditelná, když se nastražuje.
levels.traps.toxictrap.desc=Aktivace této pasti uvolní v okolním prostoru oblak toxického plynu.
levels.traps.toxictrap.name=past na toxické plyny
levels.traps.trap.discover_hint=Tuto past můžete v podzemí náhodně najít. V každé oblasti se mohou objevit jiné pasti.
levels.traps.trap.rankings_desc=Zabit: %s
levels.traps.warpingtrap.desc=Tato past je podobná teleportační pasti, ale také způsobí, že hrdina ztratí znalosti o rozložení patra!
levels.traps.warpingtrap.name=deformační past
levels.traps.weakeningtrap.desc=Temná magie v této pasti vysává energii ze všeho, co s ní přijde do kontaktu. Silní nepřátelé však mohou tomuto efektu odolat.
levels.traps.weakeningtrap.name=oslabující past
levels.traps.worndarttrap.desc=Poblíž musí být schovaná malá pastička na šipky, její aktivace způsobí, že past vystřelí na nejbližší cíl. \n\nVzhledem ke svému stáří ale není moc škodlivá, není ani schovaná...
levels.traps.worndarttrap.name=opotřebovaná past na šipky
levels.traps.worndarttrap.ondeath=Zabila tě opotřebovaná past na šipky...
levels.vaultlevel$vaultflametrap.desc=Zdá se, že z tohoto větracího otvoru v nastavených intervalech šlehají zelené plameny. _Jelikož se jedná pouze o testovací oblast, plameny z větracích otvorů vám ve skutečnosti neublíží._
levels.vaultlevel$vaultflametrap.name=odvzdušňovací ventil plamene trezoru

levels.level.sign_desc=Odtud text nepřečteš.
levels.level.sign_name=Znamení
