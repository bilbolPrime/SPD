levels.level.hidden_trap=Skrytý %s se aktivuje!
levels.level.high_grass_desc=Hustá vegetace blokuje výhled.
levels.level.high_grass_name=Vysoká tráva
levels.level.inactive_trap_desc=Past už byla dříve spuštěna a už není nebezpečná.
levels.level.inactive_trap_name=Spuštěná past
levels.level.locked_door_desc=Tyto dveře jsou zamčené, k jejich odemčení potřebujete odpovídající klíč.
