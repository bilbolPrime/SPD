levels.level.embers_name=Žhavé uhlíky
levels.level.empty_well_desc=Studna vyschla.
levels.level.empty_well_name=Prázdná studna
levels.level.entrace_name=Hloubkový vstup
levels.level.entrance_desc=Schody vedou do horní hloubky.
levels.level.exit_desc=Schody vedou dolů do spodní hloubky.
