levels.cavesbosslevel.energy_desc=Země tu jiskří elektřinou a je nebezpečné na ni šlápnout. _Jiskry jako by se ubíraly určitým směrem..._ možná vedou ke zdroji energie?
levels.cavesbosslevel.gate_desc=Velká kovová brána, která blokuje cestu do trpasličí metropole. Kovová krabice uprostřed vydává hlasitý hukot, musí být připojena k obvodům a strojům v okolí. Možná zničení DM-300 bránu otevře?
levels.cavesbosslevel.gate_desc_broken=Brána musela být nějakým způsobem spojena s DM-300, protože explodovala, když byl DM-300 poražen. Nyní z ní zbyly jen rozbité kusy.
levels.cavesbosslevel.gate_name=Kovová brána
levels.cavesbosslevel.water_desc=S tou vší tou elektřinou kolem nás nemusí být voda vždy bezpečná...
levels.cavesbosslevel.wires_desc=Země je zde částečně vykopaná a jsou na ní vidět nějaké velké obnažené dráty. Musí spojovat různé elektrické stroje dohromady.\n\nDráty musí protékat nějaký proud. Pokud sem DM-300 vstoupí, mohl by z nich odebírat energii.
levels.cavesbosslevel.wires_name=Odkryté vedení
levels.caveslevel.bookshelf_desc=Kdo by potřeboval knihovnu v jeskyni?
levels.caveslevel.entrance_desc=Žebřík vede nahoru do horní hloubky.
levels.caveslevel.exit_desc=Žebřík vede dolů do spodní hloubky.
levels.caveslevel.grass_name=Fluorescenční mech
levels.caveslevel.high_grass_desc=Obrovské houby blokují výhled.
levels.caveslevel.high_grass_name=Fluorescenční houby
levels.caveslevel.region_deco_desc=Velká celokovová stavba, pravděpodobně postavená trpaslíky, když tu dříve těžili. Člověk si myslí, že podél vrcholu vedou dávno nepoužívané koleje pro důlní vozíky.
levels.caveslevel.region_deco_name=Kovová konstrukce
levels.caveslevel.wall_deco_desc=Na zdi je viditelná žíla nějaké rudy. Zlato?
levels.caveslevel.water_name=Ledová voda
levels.citybosslevel.summoning_desc=Tento podstavec má uprostřed velký otvor, který prakticky vyzařuje temnou energií. \n\nTrpasličí král používá tyto podstavce jako ústřední body pro svou nekromantskou magii a může k nim přivolávat miniony. Podstavec se musí několik kol nabíjet, než se minion objeví, a typ přivolaného miniona je telegrafován magickou silou budovy.
levels.citybosslevel.summoning_name=Přivolávací podstavec
levels.citybosslevel.throne_desc=Tento impozantně velký trůn je sídlem trpasličí říše, kterou nyní ovládl nekromant šílený po moci. \n\nZZXQZZXQZZXQZZXQZZQZXQZXQZXQZXQZXQZXQZXQZXQZXQZXQZXQZXQZXQZXQZXQZXQZdá se, že trůn má nějaké magické nebo mechanické části, takže Trpasličí král může mít při sezení na něm dodatečnou moc.
levels.citybosslevel.throne_name=Trůn
levels.citylevel.bookshelf_desc=Řady knih z různých oborů zaplňují knihovnu.
levels.citylevel.deco_desc=Chybí zde několik dlaždic.
levels.citylevel.entrance_desc=Do horní hloubky vede rampa.
levels.citylevel.exit_desc=Do spodní hloubky vede rampa.
levels.citylevel.high_grass_name=Vysoko kvetoucí květiny
levels.citylevel.region_deco_desc=Vyvýšený podstavec s jasně zeleným magickým plamenem na vrcholu. Plamen je tak hustý, že by klidně mohl být pevný.
levels.citylevel.region_deco_name=Hořící podstavec
levels.citylevel.sp_desc=Podlahu pokrývá silný koberec.
levels.citylevel.statue_desc=Socha zobrazuje nějakého trpaslíka stojícího v hrdinském postoji.
levels.citylevel.upcoming_quest_intro_no=Zůstaňte zde
levels.citylevel.upcoming_quest_intro_title=Zpráva pro vývojáře
levels.citylevel.upcoming_quest_intro_yes=Sestup do trezoru
levels.citylevel.water_name=Podezřele zbarvená voda
levels.features.chasm.chasm=Propast
levels.features.chasm.jump=Opravdu chceš skočit do propasti? Pád tak hluboko bude bolestivý.
levels.features.chasm.no=Ne, změnil jsem názor.
levels.features.chasm.ondeath=Padl jsi k smrti...
levels.features.chasm.rankings_desc=Zemřel při nárazu
levels.features.chasm.yes=Ano, vím, co dělám
levels.hallslevel.bookshelf_desc=V knihovně doutnají knihy ve starověkých jazycích.
levels.hallslevel.grass_name=Embermech
levels.hallslevel.high_grass_name=Emberhouby
levels.hallslevel.region_deco_desc=Obrovský kus kamene, který se zdá být odlomený od stropu nebo blízké zdi.
levels.hallslevel.region_deco_name=Kus suti
levels.hallslevel.statue_desc=Ten sloup je vyrobený ze skutečných humanoidních lebek. Úžasné.
levels.hallslevel.statue_name=Pilíř
levels.hallslevel.water_desc=Vypadá to jako láva, ale je to studené a pravděpodobně bezpečné na dotek.
levels.hallslevel.water_name=Studená láva
levels.level$feeling.chasm_desc=Tvé kroky se rozléhají po žaláři.
levels.level$feeling.chasm_title=dno propasti
levels.level$feeling.dark_desc=Slyšíte nepřátele pohybovat se ve tmě.
levels.level$feeling.dark_title=tmavá podlaha
levels.level$feeling.grass_desc=Ve vzduchu je cítit hustý zápach vegetace.
levels.level$feeling.grass_title=travnatá podlaha
levels.level$feeling.large_desc=Toto patro podzemí se zdá neobvykle velké.
levels.level$feeling.large_title=velká podlaha
levels.level$feeling.secrets_desc=Atmosféra naznačuje, že toto patro skrývá mnoho tajemství.
levels.level$feeling.secrets_title=tajné patro
levels.level$feeling.traps_desc=Terén se zde zdá být obzvláště zrádný.
levels.level$feeling.traps_title=podlaha pro pasti
levels.level$feeling.water_desc=Slyšíš kolem sebe šplouchat vodu.
levels.level$feeling.water_title=vodní podlaha
levels.level.alchemy_desc=Tento hrnec je naplněn magickou vodou. V hrnci lze smíchat různé předměty a vytvořit tak něco nového!
levels.level.alchemy_name=alchymistický hrnec
levels.level.barricade_desc=Dřevěná barikáda je pevně postavená, ale za ta léta vyschla. Mohla by hořet?
levels.level.barricade_name=Barikáda
levels.level.bookshelf_name=Regál
levels.level.chasm_desc=Dno nevidíš.
levels.level.chasm_name=Propast
levels.level.closed_door_name=Zavřené dveře
levels.level.crystal_door_desc=Tyto zamčené dveře jsou vyrobeny z magického křišťálu. Můžete skrz ně vidět, ale k jejich otevření budete potřebovat křišťálový klíč.
levels.level.crystal_door_name=Křišťálové dveře
