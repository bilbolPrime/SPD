levels.cavesbosslevel.energy_desc=这里的地面冒着火花，踩上去很危险。火花似乎朝着某个方向聚集……也许它们通往电源？
levels.cavesbosslevel.gate_desc=一道巨大的金属大门挡住了通往矮人都城的道路。大门中央的金属箱发出嗡嗡的响声，它一定与附近的电路和机器相连。或许摧毁DM-300就能打开这道大门？
levels.cavesbosslevel.gate_desc_broken=这扇门肯定与DM-300有某种联系，因为DM-300被击败时它就爆炸了。现在只剩下碎片了。
levels.cavesbosslevel.gate_name=金属门
levels.cavesbosslevel.water_desc=这里电力供应充足，水可能并不总是安全的……
levels.cavesbosslevel.wires_desc=这里地面部分被挖开，露出一些粗大的裸露电线。它们应该是连接各种电机的。这些电线里肯定有电流通过。如果DM-300走到这里，它或许能从中汲取电力。
levels.cavesbosslevel.wires_name=裸露的电线
levels.caveslevel.bookshelf_desc=谁会在山洞里需要书架？
levels.caveslevel.entrance_desc=梯子通往上层深处。
levels.caveslevel.exit_desc=梯子通往更深的地下。
levels.caveslevel.grass_name=荧光苔藓
levels.caveslevel.high_grass_desc=巨大的蘑菇挡住了视线。
levels.caveslevel.high_grass_name=荧光蘑菇
levels.caveslevel.region_deco_desc=一座大型全金属建筑，很可能是矮人们以前在这里采矿时建造的。你似乎可以看到顶部有废弃已久的矿车轨道。
levels.caveslevel.region_deco_name=金属结构
levels.caveslevel.wall_deco_desc=墙上可以看到一条矿脉。是金子吗？
levels.caveslevel.water_name=冰冷的水
levels.citybosslevel.summoning_desc=这个基座中央有一个巨大的开口，几乎散发着黑暗能量。矮人王利用这些基座作为他亡灵魔法的焦点，并能召唤仆从。仆从出现前，基座需要充能几个回合，而召唤的仆从类型则通过积聚的魔法能量来预示。
levels.citybosslevel.summoning_name=召唤基座
levels.citybosslevel.throne_desc=这座气势恢宏的王座是矮人帝国的王座，如今已被一位权力欲极强的死灵法师占据。王座似乎包含一些魔法或机械部件，矮人国王坐在上面时可能会获得额外的力量。
levels.citybosslevel.throne_name=王座
levels.citylevel.bookshelf_desc=书架上摆满了不同学科的书籍。
levels.citylevel.deco_desc=这里缺了几块瓷砖。
levels.citylevel.entrance_desc=一条斜坡通往更深的水域。
levels.citylevel.exit_desc=一条斜坡通往更深的水域。
levels.citylevel.high_grass_name=高大盛开的花朵
levels.citylevel.region_deco_desc=一个高高的基座，顶端燃烧着明亮的绿色魔法火焰。火焰非常浓密，几乎像固体一样。
levels.citylevel.region_deco_name=燃烧的基座
levels.citylevel.sp_desc=地板上铺着厚厚的地毯。
levels.citylevel.statue_desc=这座雕像描绘的是一位矮人摆出英勇的姿势。
levels.citylevel.upcoming_quest_intro_no=留在这里
levels.citylevel.upcoming_quest_intro_title=开发者留言
levels.citylevel.upcoming_quest_intro_yes=进入金库
levels.citylevel.water_name=颜色可疑的水
levels.features.chasm.chasm=深渊
levels.features.chasm.jump=你真的想跳进深渊吗？从那么高的地方摔下去会很疼的。
levels.features.chasm.no=不，我改变主意了。
levels.features.chasm.ondeath=你坠亡了……
levels.features.chasm.rankings_desc=撞击中身亡
levels.features.chasm.yes=是的，我知道自己在做什么。
levels.hallslevel.bookshelf_desc=书架上，用古代语言写成的书籍在微微冒着热气。
levels.hallslevel.grass_name=余烬苔藓
levels.hallslevel.high_grass_name=余烬菌
levels.hallslevel.region_deco_desc=一块巨大的石头，似乎是从天花板或附近的墙壁上脱落下来的。
levels.hallslevel.region_deco_name=一块碎石
levels.hallslevel.statue_desc=这根柱子是用真正的人类头骨制成的。太棒了。
levels.hallslevel.statue_name=支柱
levels.hallslevel.water_desc=它看起来像熔岩，但很冷，触摸起来可能很安全。
levels.hallslevel.water_name=冷熔岩
levels.level$feeling.chasm_desc=你的脚步声在地牢中回荡。
levels.level$feeling.chasm_title=深渊地板
levels.level$feeling.dark_desc=你能听到敌人在黑暗中移动的声音。
levels.level$feeling.dark_title=深色地板
levels.level$feeling.grass_desc=空气中弥漫着浓郁的植物香气。
levels.level$feeling.grass_title=草地
levels.level$feeling.large_desc=这个地牢楼层看起来异常大。
levels.level$feeling.large_title=大地板
levels.level$feeling.secrets_desc=这里的气氛暗示着这一层隐藏着许多秘密。
levels.level$feeling.secrets_title=秘密楼层
levels.level$feeling.traps_desc=这里的地面似乎特别湿滑。
levels.level$feeling.traps_title=陷阱地板
levels.level$feeling.water_desc=你听到周围有水花飞溅的声音。
levels.level$feeling.water_title=水底
levels.level.alchemy_desc=这个罐子里装满了魔法水。你可以把各种物品放进罐子里，创造出新的东西！
levels.level.alchemy_name=炼金壶
levels.level.barricade_desc=木制路障虽然牢固，但多年使用已经干裂。它会着火吗？
levels.level.barricade_name=路障
levels.level.bookshelf_name=书架
levels.level.chasm_desc=你看不到底部。
levels.level.chasm_name=深渊
levels.level.closed_door_name=关上的门
levels.level.crystal_door_desc=这扇锁着的门是由魔法水晶制成的。你可以透过水晶看到里面，但你需要一把水晶钥匙才能打开它。
levels.level.crystal_door_name=水晶门
levels.level.default_name=？？？
levels.level.embers_desc=地面上满是余烬。
levels.level.embers_name=余烬
levels.level.empty_well_desc=井水干涸了。
levels.level.empty_well_name=空井
levels.level.entrace_name=深度入口
levels.level.entrance_desc=楼梯通往上层。
levels.level.exit_desc=楼梯通往更深处。
levels.level.exit_name=深度出口
levels.level.floor_name=地面
levels.level.furrowed_grass_name=沟壑状植被
levels.level.grass_name=草
levels.level.hidden_trap=隐藏的 %s 激活了！
levels.level.high_grass_desc=茂密的植被遮挡了视线。
levels.level.high_grass_name=高草
levels.level.inactive_trap_desc=这个陷阱以前触发过，现在已经不危险了。
levels.level.inactive_trap_name=触发陷阱
levels.level.locked_door_desc=这扇门锁着，你需要一把匹配的钥匙才能打开。
levels.level.locked_door_name=锁着的门
levels.level.locked_exit_desc=通往楼下的楼梯被厚重的铁栅栏挡住了。
levels.level.locked_exit_name=锁定深度出口
levels.level.open_door_name=打开门
levels.level.pedestal_name=座
levels.level.statue_desc=显然，有人想装饰这个地方，但失败了。
levels.level.statue_name=雕像
levels.level.unlocked_exit_name=解锁深度出口
levels.level.wall_name=墙
levels.level.water_desc=如果着火，请立即跳入水中灭火。
levels.level.water_name=水
levels.level.well_name=出色地
levels.mininglevel.barricade_desc=木制路障牢固地架设起来，支撑着天花板。这很可能是豺狼人建造的，用来抵御落石。_任何相邻的牢房都将免受落石陷阱和攻击。_它看起来和其他路障一样，很容易被烧毁。
levels.mininglevel.boulder_desc=有一块巨石挡住了去路。用镐应该很容易就能敲碎它。
levels.mininglevel.boulder_name=博尔德
levels.mininglevel.crystal_desc=这里有一块硕大而色彩斑斓的水晶露头。这些水晶很脆弱，用镐头很容易就能敲碎，或者在它旁边开采其他东西也会损坏它们。
levels.mininglevel.crystal_name=水晶尖刺
levels.mininglevel.gold_extra_desc=你大概可以用镐把它挖出来。
levels.mininglevel.wall_desc=这是一面光滑的岩壁，比一般的岩壁略微柔软一些。你可以用镐子挖开它，但这会花费一些力气，并且会稍微增加你的饥饿值。
levels.prisonlevel.bookshelf_desc=这很可能是监狱图书馆的遗迹。它会被烧毁吗？
levels.prisonlevel.empty_deco_desc=地板上有陈旧的血迹。
levels.prisonlevel.region_deco_alt_desc=一个刚好能困住一个人的金属笼子，用一条链子悬挂在深渊上方。
levels.prisonlevel.region_deco_alt_name=吊笼
levels.prisonlevel.region_deco_desc=一个刚好能困住一个人的金属笼子。它似乎被某种方式固定在地面上，无法移动。
levels.prisonlevel.region_deco_name=监狱笼子
levels.prisonlevel.water_name=漆黑冰冷的水
levels.rooms.quest.ambitiousimproom$questentrance.desc=这个阴森森的深坑似乎是通往某个古老矮人宝库的入口。一道魔法屏障阻止了进入，但你可以像走过地面一样从屏障上方走过。
levels.rooms.quest.ambitiousimproom$questentrance.name=金库入口
levels.rooms.quest.blacksmithroom$questentrance.desc=这架梯子通往铁匠铺正下方的一个废弃矿井。
levels.rooms.quest.blacksmithroom$questentrance.name=矿井入口
levels.rooms.quest.massgraveroom$bones.desc=地上散落着白骨，这里究竟发生了什么？
levels.rooms.quest.massgraveroom$bones.name=万人坑
levels.rooms.quest.mineentrance$questexit.desc=这架梯子通往矿井外，回到铁匠铺。
levels.rooms.quest.mineentrance$questexit.name=矿井出口
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=这是用于某种黑暗仪式的彩绘标记。通常会在四个角上放置蜡烛。
levels.rooms.quest.ritualsiteroom$ritualmarker.name=仪式标记
levels.rooms.special.magicalfireroom$eternalfire.desc=这里出现了一堵浓密的亮绿色火焰墙，似乎是由魔法造成的。火焰墙密度极高，根本无法穿过，而且任何靠近的东西都会被点燃。它没有自然熄灭的迹象，你必须使用某种方法才能将其扑灭。
levels.rooms.special.sentryroom$sentry.desc=这个血红色的哨兵似乎被安排在这里守护房间另一端的宝藏。如果你踏入它守护的区域，它会向你发射分解魔法光束。它免疫所有有害效果，也能看穿隐形，但似乎需要一段时间充能才能开始攻击。不知为何，这个哨兵似乎只想攻击你，仿佛它知道地牢里的居民对宝藏构不成威胁。
levels.rooms.special.sentryroom$sentry.discover_hint=你可以在地牢的任何地方遇到这种敌人。
levels.rooms.special.sentryroom$sentry.name=红色哨兵
levels.rooms.special.toxicgasroom$toxicvent.desc=一定是某个粗心的冒险者很久以前触发了这个陷阱。尽管它现在处于休眠状态，但仍在向房间里持续释放毒气，而且丝毫没有停止的迹象。如果你想探索这个房间，就必须想办法避免受到毒气的伤害。
levels.rooms.special.toxicgasroom$toxicvent.name=有毒气体排放
levels.rooms.special.weakfloorroom$hiddenwell.desc=你隐约能看到下方深处有一口井，也许下面有什么东西？
levels.rooms.special.weakfloorroom$hiddenwell.name=远处的井
levels.sewerlevel.bookshelf_desc=书架上堆满了廉价无用的书。它会着火吗？
levels.sewerlevel.empty_deco_desc=地板上覆盖着潮湿的淡黄色苔藓。
levels.sewerlevel.region_deco_desc=一个几乎和你一样大的厚重木桶。它肯定装满了什么东西，太重了，根本搬不动。
levels.sewerlevel.region_deco_name=储物桶
levels.sewerlevel.water_name=浑浊的水
levels.traps.alarmtrap.alarm=陷阱发出刺耳的声音，在整个地牢中回荡！
levels.traps.alarmtrap.desc=这个陷阱似乎与一个响亮的警报装置相连。触发它很可能会惊动这一层楼里的所有人。
levels.traps.alarmtrap.name=警报陷阱
levels.traps.blazingtrap.desc=踩到这个陷阱会引燃强力化学混合物，引发大范围火灾。
levels.traps.blazingtrap.name=炽热陷阱
levels.traps.burningtrap.desc=踩到这个陷阱会引燃化学混合物，使周围区域燃起火焰。
levels.traps.burningtrap.name=燃烧陷阱
levels.traps.chillingtrap.desc=启动后，该捕集器中的化学物质会迅速冻结其周围空气。
levels.traps.chillingtrap.name=令人不寒而栗的陷阱
levels.traps.confusiontrap.desc=触发此陷阱会在附近区域释放出一团混乱气体。
levels.traps.confusiontrap.name=混乱气体陷阱
levels.traps.corrosiontrap.desc=触发此陷阱会在附近区域释放出一团致命的酸性气体。
levels.traps.corrosiontrap.name=腐蚀性气体捕集器
levels.traps.cursingtrap.curse=你破旧的装备被诅咒了！
levels.traps.cursingtrap.desc=这个陷阱蕴含着与诅咒装备相同的邪恶魔法。触发它会诅咒周围区域的一些物品。
levels.traps.cursingtrap.name=诅咒陷阱
levels.traps.disarmingtrap.desc=这个陷阱蕴含着非常特殊的传送魔法，可以将受害者的武器传送到其他地方。
levels.traps.disarmingtrap.disarm=你的武器被传送走了！
levels.traps.disarmingtrap.name=解除陷阱
levels.traps.disintegrationtrap.desc=触发后，此陷阱将向最近的目标发射分解光束，造成大量伤害并摧毁物品。值得庆幸的是，触发机制并不隐藏。
levels.traps.disintegrationtrap.name=分解陷阱
levels.traps.disintegrationtrap.ondeath=你被分解陷阱杀死了……
levels.traps.disintegrationtrap.one=陷阱会摧毁你的 %s！
levels.traps.disintegrationtrap.some=陷阱会分解你的一些 %s！
levels.traps.distortiontrap.desc=这个陷阱由来已久的神秘魔法建造而成，它会将各种各样的生物召唤到这里来。
levels.traps.distortiontrap.name=失真陷阱
levels.traps.explosivetrap.desc=这个陷阱里装有粉状炸药和一个触发装置。启动它会导致附近区域发生爆炸。
levels.traps.explosivetrap.name=爆炸陷阱
levels.traps.flashingtrap.desc=一旦启动，此陷阱将引燃储存在内部的强力闪光粉，使受害者暂时失明、丧失行动能力并受伤。该陷阱必须储存大量的闪光粉，因为它可以多次启动而不会损坏。
levels.traps.flashingtrap.name=闪光陷阱
levels.traps.flocktrap.desc=也许这是某个业余魔法师开的一个玩笑，触发这个陷阱会创造出一群魔法绵羊。
levels.traps.flocktrap.name=诱鸟陷阱
levels.traps.frosttrap.desc=启动后，该捕集器中的化学物质会迅速冻结其周围大范围内的空气。
levels.traps.frosttrap.name=霜冻陷阱
levels.traps.gatewaytrap.desc=这种特殊的传送陷阱可以无限次触发，并且每次都会传送到同一个位置。
levels.traps.gatewaytrap.name=网关陷阱
levels.traps.geysertrap.desc=触发此陷阱后，将喷出一股水柱，对火焰敌人造成伤害，击退附近所有角色，扑灭火焰，并将周围地形变成水。
levels.traps.geysertrap.name=间歇泉陷阱
levels.traps.gnollrockfalltrap.desc=这个落石陷阱是借助某种魔法力量制造的。触发后，它会使周围5x5范围内的岩石松动并立即从上方落下。由于该区域岩石较软，它造成的伤害不如普通落石陷阱，但你的盔甲也无法抵挡。此外，如果附近有路障，岩石就不会落下，因为路障可以支撑顶部。这个陷阱无法区分敌我，因此对豺狼人和你一样危险。
levels.traps.gnollrockfalltrap.name=豺狼人落石陷阱
levels.traps.grimtrap.desc=这个陷阱中蕴藏着威力极其强大的破坏性魔法，足以瞬间杀死除最强壮的英雄之外的所有人。触发陷阱后，会向最近的角色发射一道致命的远程魔法冲击波。值得庆幸的是，触发机制并不隐蔽。
levels.traps.grimtrap.name=残酷陷阱
levels.traps.grimtrap.ondeath=你死于一个阴森陷阱的爆炸……
levels.traps.grippingtrap.desc=这种陷阱会抓住触发者的脚，对其造成伤害并减缓其移动速度。由于其结构简单，这种陷阱可以多次触发而不会损坏。
levels.traps.grippingtrap.name=陷阱
levels.traps.guardiantrap$guardian.desc=这个蓝色的幻影似乎是地牢中某个石像守卫的召唤回声。
levels.traps.guardiantrap$guardian.desc_weapon=虽然雕像本身几乎没有实体，但它所挥舞的_%s_看起来却很逼真。
levels.traps.guardiantrap$guardian.discover_hint=你可以通过特定的陷阱找到这个敌人。
levels.traps.guardiantrap$guardian.name=召唤守护者
levels.traps.guardiantrap.alarm=陷阱发出刺耳的声音，在整个地牢中回荡！
levels.traps.guardiantrap.desc=这个陷阱与一种奇特的魔法机制有关，它会召唤守护者并惊动该楼层的所有敌人。
levels.traps.guardiantrap.name=守护者陷阱
levels.traps.oozetrap.desc=这个陷阱启动后会溅出腐蚀性液体，这些液体会燃烧直到被冲走。
levels.traps.oozetrap.name=渗漏陷阱
levels.traps.pitfalltrap.desc=这个陷阱连接着一个大型活板门装置，触发后不久，附近的任何东西都会直接穿过地面掉下去！不过，在地面特别坚实的地方，这个陷阱就不起作用了。
levels.traps.pitfalltrap.name=陷阱
levels.traps.pitfalltrap.no_pit=这里地面太坚实，陷阱无法生效。
levels.traps.pitfalltrap.triggered=触发陷阱后，地面开始塌陷！
levels.traps.pitfalltrap.triggered_hero=你周围的地面开始塌陷！
levels.traps.poisondarttrap.desc=附近必须隐藏一个小型飞镖发射器，激活此陷阱后，它会向最近的目标发射一支毒镖。值得庆幸的是，触发装置并没有被隐藏。
levels.traps.poisondarttrap.name=毒镖陷阱
levels.traps.poisondarttrap.ondeath=你被毒镖陷阱杀死了……
levels.traps.rockfalltrap.desc=这个陷阱与上方的一系列松动岩石相连，触发后这些岩石会轰然落下，覆盖整个房间！如果陷阱不在特定房间内，岩石会落在陷阱周围的区域。值得庆幸的是，触发机制并不隐蔽。
levels.traps.rockfalltrap.name=落石陷阱
levels.traps.rockfalltrap.ondeath=你被落石陷阱砸中了……
levels.traps.shockingtrap.desc=这是一个储存了大量能量的装置。触发这个陷阱会将能量释放到周围的能量场中。
levels.traps.shockingtrap.name=令人震惊的陷阱
levels.traps.stormtrap.desc=这是一个储存着巨大能量的装置。触发这个陷阱会将这些能量释放成一场巨大的雷暴。
levels.traps.stormtrap.name=风暴陷阱
levels.traps.summoningtrap.desc=触发此陷阱会将此区域的许多怪物召唤到此处。
levels.traps.summoningtrap.name=召唤陷阱
levels.traps.teleportationtrap.desc=当这个陷阱被触发时，它周围的所有东西都会被传送到这一层的随机位置。
levels.traps.teleportationtrap.name=传送陷阱
levels.traps.tengudarttrap.desc=天狗显然一直在备战。这个陷阱会启动一个隐藏的飞镖发射器，向除了天狗以外的任何物体发射毒镖。这个陷阱制作得非常精巧，没有魔法的帮助根本无法察觉其触发机制。不过，陷阱在设置过程中会短暂地显露出来。
levels.traps.toxictrap.desc=触发此陷阱会在周围区域释放出一团有毒气体。
levels.traps.toxictrap.name=有毒气体捕集器
levels.traps.trap.discover_hint=这种陷阱会在地牢中随机出现。每个区域出现的陷阱都不一样。
levels.traps.trap.rankings_desc=被 %s 杀死
levels.traps.warpingtrap.desc=这个陷阱类似于传送陷阱，但还会使英雄失去对楼层布局的了解！
levels.traps.warpingtrap.name=扭曲陷阱
levels.traps.weakeningtrap.desc=这个陷阱中的黑暗魔法会吸取任何接触到它的东西的能量。不过，强大的敌人或许能够抵抗这种效果。
levels.traps.weakeningtrap.name=削弱陷阱
levels.traps.worndarttrap.desc=附近必须藏着一个小型飞镖发射器，启动这个陷阱后，它会向最近的目标发射飞镖。\n\n由于年代久远，它其实危害不大，甚至都没藏起来……
levels.traps.worndarttrap.name=磨损的飞镖陷阱
levels.traps.worndarttrap.ondeath=你被那破旧的飞镖陷阱杀死了……
levels.vaultlevel$vaultflametrap.desc=这个通风口似乎会定时喷出绿色火焰。_由于这只是一个测试区域，通风口喷出的火焰不会对您造成实际伤害。_
levels.vaultlevel$vaultflametrap.name=拱顶火焰排放口

levels.level.sign_desc=从这里看不到文字。
levels.level.sign_name=符号
