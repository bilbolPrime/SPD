levels.level$feeling.chasm_desc=Bước chân của bạn vang vọng khắp ngục tối.
levels.level$feeling.chasm_title=sàn vực sâu
levels.level$feeling.dark_desc=Bạn có thể nghe thấy tiếng kẻ thù di chuyển trong bóng tối.
