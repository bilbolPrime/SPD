levels.cavesbosslevel.energy_desc=Mặt đất ở đây đang phát ra tia lửa điện, rất nguy hiểm nếu giẫm phải. _Những tia lửa dường như đang tập trung về một hướng nhất định..._ có lẽ chúng dẫn đến nguồn điện?
levels.cavesbosslevel.gate_desc=Một cánh cổng kim loại lớn chắn ngang đường vào đô thị của người lùn. Chiếc hộp kim loại ở trung tâm đang phát ra tiếng vo ve lớn, chắc hẳn nó được kết nối với hệ thống mạch điện và máy móc gần đó. Có lẽ việc phá hủy DM-300 sẽ mở được cánh cổng?
levels.cavesbosslevel.gate_desc_broken=Cánh cổng chắc hẳn có liên quan đến DM-300 bằng cách nào đó, vì nó đã phát nổ khi DM-300 bị đánh bại. Giờ chỉ còn lại những mảnh vỡ.
levels.cavesbosslevel.gate_name=Cổng kim loại
levels.cavesbosslevel.water_desc=Với lượng điện dồi dào ở đây, nước có thể không phải lúc nào cũng an toàn...
levels.cavesbosslevel.wires_desc=Mặt đất ở đây bị đào xới một phần, để lộ một số dây điện lớn. Chúng chắc hẳn đang kết nối các máy móc điện khác nhau với nhau.\n\nCác dây điện này chắc chắn đang có dòng điện chạy qua. Nếu DM-300 bước vào đây, nó có thể lấy điện từ chúng.
levels.cavesbosslevel.wires_name=Dây điện hở
levels.caveslevel.bookshelf_desc=Ai lại cần giá sách trong hang động chứ?
levels.caveslevel.entrance_desc=Chiếc thang dẫn lên độ sâu phía trên.
levels.caveslevel.exit_desc=Chiếc thang dẫn xuống độ sâu phía dưới.
levels.caveslevel.grass_name=Rêu huỳnh quang
levels.caveslevel.high_grass_desc=Những cây nấm khổng lồ che khuất tầm nhìn.
levels.caveslevel.high_grass_name=Nấm phát quang
levels.caveslevel.region_deco_desc=Một công trình lớn hoàn toàn bằng kim loại, có lẽ được người lùn xây dựng khi họ còn khai thác mỏ ở nơi này. Bạn có thể thấy những đường ray xe đẩy mỏ đã lâu không sử dụng chạy dọc theo đỉnh của nó.
levels.caveslevel.region_deco_name=Cấu trúc kim loại
levels.caveslevel.wall_deco_desc=Trên vách đá có thể nhìn thấy một vệt quặng nào đó. Có phải là vàng không?
levels.caveslevel.water_name=Nước lạnh buốt
levels.citybosslevel.summoning_desc=Bệ đỡ này có một lỗ lớn ở trung tâm, gần như tỏa ra năng lượng hắc ám.\n\nDwarf King sử dụng những bệ đỡ này làm điểm tập trung cho ma thuật hắc ám của mình và có thể triệu hồi tay sai đến đó. Bệ đỡ cần tích tụ năng lượng trong vài lượt trước khi tay sai xuất hiện, và loại tay sai được triệu hồi được báo hiệu bởi sức mạnh ma thuật của tòa nhà.
levels.citybosslevel.summoning_name=Bệ triệu hồi
levels.citybosslevel.throne_desc=Chiếc ngai vàng đồ sộ này là kinh đô của đế chế người lùn, hiện đang bị một tên pháp sư hắc ám cuồng quyền lực chiếm giữ. Có vẻ như chiếc ngai vàng này có một số bộ phận ma thuật hoặc cơ khí, Vua người lùn có thể có thêm sức mạnh khi ngồi trên đó.
levels.citybosslevel.throne_name=Ngai vàng
levels.citylevel.bookshelf_desc=Những dãy sách thuộc nhiều lĩnh vực khác nhau lấp đầy giá sách.
levels.citylevel.deco_desc=Một số viên gạch ở đây bị thiếu.
levels.citylevel.entrance_desc=Một con dốc dẫn lên độ sâu phía trên.
levels.citylevel.exit_desc=Một con dốc dẫn xuống độ sâu thấp hơn.
levels.citylevel.high_grass_name=Hoa nở rộ
levels.citylevel.region_deco_desc=Một bệ cao với ngọn lửa ma thuật màu xanh lục rực rỡ ở trên. Ngọn lửa đặc đến mức gần như là vật thể rắn.
levels.citylevel.region_deco_name=Bệ đỡ bốc cháy
levels.citylevel.sp_desc=Sàn nhà được trải một tấm thảm dày.
levels.citylevel.statue_desc=Bức tượng mô tả một người lùn đang đứng trong tư thế anh hùng.
levels.citylevel.upcoming_quest_intro_no=Hãy ở lại đây
levels.citylevel.upcoming_quest_intro_title=Thông báo dành cho nhà phát triển
