levels.features.chasm.yes=Vâng, tôi biết mình đang làm gì.
levels.hallslevel.bookshelf_desc=Những cuốn sách bằng ngôn ngữ cổ xưa nằm im lìm trên giá sách.
levels.hallslevel.grass_name=Rêu than
levels.hallslevel.high_grass_name=Nấm lửa
levels.hallslevel.region_deco_desc=Một khối đá lớn dường như đã vỡ ra từ trần nhà hoặc bức tường gần đó.
levels.hallslevel.region_deco_name=Mảnh vụn
levels.hallslevel.statue_desc=Cột trụ này được làm từ những hộp sọ người thật. Thật tuyệt vời.
levels.hallslevel.statue_name=Cột
levels.hallslevel.water_desc=Nó trông giống như dung nham, nhưng nó lạnh và có lẽ an toàn khi chạm vào.
