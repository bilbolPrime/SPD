levels.citylevel.water_name=Nước có màu đáng ngờ
levels.features.chasm.chasm=Hang sâu
levels.features.chasm.jump=Bạn thực sự muốn nhảy xuống vực sâu đó sao? Cú ngã từ độ cao đó sẽ rất đau đớn.
