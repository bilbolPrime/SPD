levels.level$feeling.large_desc=Sàn ngục này có vẻ rộng bất thường.
levels.level$feeling.large_title=sàn nhà lớn
levels.level$feeling.secrets_desc=Bầu không khí nơi đây cho thấy tầng này ẩn chứa nhiều bí mật.
levels.level$feeling.secrets_title=tầng bí mật
levels.level$feeling.traps_desc=Địa hình ở đây có vẻ đặc biệt nguy hiểm.
levels.level$feeling.traps_title=bẫy sàn
levels.level$feeling.water_desc=Bạn nghe thấy tiếng nước bắn tung tóe xung quanh.
levels.level$feeling.water_title=đáy nước
levels.level.alchemy_desc=Chiếc bình này chứa đầy nước thần kỳ. Bạn có thể trộn các vật phẩm vào bình để tạo ra thứ gì đó mới!
levels.level.alchemy_name=bình luyện kim
levels.level.barricade_desc=Hàng rào gỗ được dựng chắc chắn nhưng đã khô cứng theo năm tháng. Liệu nó có thể cháy không?
levels.level.barricade_name=Rào chắn
