levels.level.closed_door_name=Cửa đóng kín
levels.level.crystal_door_desc=Cánh cửa khóa này được làm từ tinh thể ma thuật. Bạn có thể nhìn xuyên qua, nhưng cần một chiếc chìa khóa tinh thể để mở nó.
