levels.mininglevel.barricade_desc=Hàng rào gỗ được dựng chắc chắn và đóng vai trò như một giá đỡ cho trần nhà.\n\nCó lẽ nó được xây dựng bởi lũ gnoll để bảo vệ khỏi đá rơi. _Bất kỳ ô nào liền kề sẽ được bảo vệ khỏi bẫy đá rơi và các cuộc tấn công._\n\nTrông có vẻ như nó sẽ cháy tốt như bất kỳ hàng rào nào khác.
levels.mininglevel.boulder_desc=Có một tảng đá lớn chắn ngang đường đi. Dùng cuốc chim thì chắc cũng dễ phá vỡ được.
levels.mininglevel.boulder_name=Đá tảng
levels.mininglevel.crystal_desc=Ở đây có một mỏm đá tinh thể lớn và đầy màu sắc. Những tinh thể này rất dễ vỡ và có thể dễ dàng bị vỡ bởi cuốc, hoặc sẽ vỡ nếu có vật gì đó được khai thác bên cạnh.
levels.mininglevel.crystal_name=Gai tinh thể
levels.mininglevel.gold_extra_desc=Có lẽ bạn có thể dùng cuốc để đào nó lên.
levels.mininglevel.wall_desc=Một bức tường đá nhẵn, mềm hơn bình thường một chút. Bạn có thể dùng cuốc để đào xuyên qua nó, nhưng sẽ tốn khá nhiều sức lực và khiến bạn đói hơn.
levels.prisonlevel.bookshelf_desc=Đây có lẽ là tàn tích của một thư viện nhà tù. Liệu nó có bị cháy không?
levels.prisonlevel.empty_deco_desc=Trên sàn nhà có những vết máu cũ.
levels.prisonlevel.region_deco_alt_desc=Một chiếc lồng kim loại vừa đủ để nhốt một người. Nó treo lơ lửng trên một vực sâu, được giữ bởi một sợi xích.
levels.prisonlevel.region_deco_alt_name=Lồng treo
levels.prisonlevel.region_deco_desc=Một chiếc lồng kim loại vừa đủ để nhốt một người. Có vẻ như nó được cố định xuống đất bằng một cách nào đó, không thể di chuyển được.
levels.prisonlevel.region_deco_name=Lồng giam
levels.prisonlevel.water_name=Nước lạnh tối màu
levels.rooms.quest.ambitiousimproom$questentrance.desc=Hố sâu đáng sợ này dường như là lối vào một hầm mộ cổ xưa của người lùn. Một rào chắn ma thuật ngăn cản lối vào, nhưng bạn có thể đi trên đó như thể có sàn nhà vậy.
levels.rooms.quest.ambitiousimproom$questentrance.name=Lối vào hầm
levels.rooms.quest.blacksmithroom$questentrance.desc=Chiếc thang này dẫn đến một mỏ cũ ngay bên dưới xưởng rèn.
levels.rooms.quest.blacksmithroom$questentrance.name=Lối vào mỏ
levels.rooms.quest.massgraveroom$bones.desc=Xương cốt vương vãi khắp sàn nhà, chuyện gì đã xảy ra ở đây vậy?
levels.rooms.quest.massgraveroom$bones.name=Mộ tập thể
levels.rooms.quest.mineentrance$questexit.desc=Chiếc thang này dẫn ra khỏi hầm mỏ, trở lại xưởng rèn.
levels.rooms.quest.mineentrance$questexit.name=Lối ra mỏ
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Một dấu hiệu được sơn vẽ dùng cho một nghi lễ hắc ám nào đó. Nến thường được đặt ở bốn góc.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Dấu hiệu nghi lễ
levels.rooms.special.magicalfireroom$eternalfire.desc=Một bức tường lửa màu xanh lục sáng rực, dày đặc xuất hiện, dường như được tạo ra bởi phép thuật. Nó dày đặc đến mức bạn không thể di chuyển xuyên qua, và nó sẽ thiêu cháy bất cứ thứ gì đến quá gần. Nó không có dấu hiệu tự tắt, bạn cần phải dùng thứ gì đó để dập tắt nó.
levels.rooms.special.sentryroom$sentry.desc=Tên lính canh màu đỏ máu này dường như được đặt ở đây để canh giữ kho báu ở phía bên kia căn phòng. Nó sẽ bắn những tia ma thuật phân rã vào bạn nếu bạn bước vào khu vực nó bảo vệ.\n\nNó miễn nhiễm với mọi hiệu ứng có hại và có thể nhìn xuyên qua tàng hình, nhưng dường như cần một lúc để tích tụ năng lượng trước khi bắt đầu bắn.\n\nBằng cách nào đó, tên lính canh chỉ muốn bắn vào bạn, như thể nó biết rằng cư dân của hầm ngục không phải là mối đe dọa đối với kho báu.
levels.rooms.special.sentryroom$sentry.discover_hint=Bạn có thể tìm thấy kẻ thù này ở bất cứ đâu trong hầm ngục.
levels.rooms.special.sentryroom$sentry.name=lính canh đỏ
levels.rooms.special.toxicgasroom$toxicvent.desc=Một nhà thám hiểm bất cẩn chắc hẳn đã kích hoạt cái bẫy này từ rất lâu rồi. Mặc dù ở trạng thái không hoạt động, nó vẫn đang phun khí độc vào căn phòng và không có dấu hiệu dừng lại. Bạn cần tìm cách nào đó để tránh bị thương do khí độc nếu muốn khám phá căn phòng này.
levels.rooms.special.toxicgasroom$toxicvent.name=lỗ thoát khí độc
levels.rooms.special.weakfloorroom$hiddenwell.desc=Bạn có thể nhìn thấy một cái giếng ở sâu bên dưới, có lẽ có thứ gì đó ở dưới đó chăng?
levels.rooms.special.weakfloorroom$hiddenwell.name=giếng xa
levels.sewerlevel.bookshelf_desc=Giá sách chất đầy những cuốn sách rẻ tiền và vô dụng. Liệu nó có bị cháy không?
levels.sewerlevel.empty_deco_desc=Lớp rêu vàng ẩm ướt phủ kín mặt đất.
levels.sewerlevel.region_deco_desc=Một cái thùng chắc chắn, gần to bằng người. Chắc hẳn nó chứa đầy thứ gì đó, vì nó quá nặng để di chuyển.
levels.sewerlevel.region_deco_name=Thùng chứa
levels.sewerlevel.water_name=Nước đục
levels.traps.alarmtrap.alarm=Chiếc bẫy phát ra âm thanh chói tai vang vọng khắp hầm ngục!
levels.traps.alarmtrap.desc=Cái bẫy này dường như được kết nối với một cơ chế báo động lớn. Kích hoạt nó rất có thể sẽ báo động cho tất cả mọi thứ trên tầng đó.
levels.traps.alarmtrap.name=bẫy báo động
levels.traps.blazingtrap.desc=Giẫm phải bẫy này sẽ kích hoạt một hỗn hợp hóa chất mạnh, gây cháy lan rộng.
levels.traps.blazingtrap.name=bẫy lửa
levels.traps.burningtrap.desc=Giẫm phải bẫy này sẽ kích hoạt hỗn hợp hóa chất, gây cháy khu vực xung quanh.
levels.traps.burningtrap.name=bẫy cháy
levels.traps.chillingtrap.desc=Khi được kích hoạt, các chất hóa học trong bẫy này sẽ nhanh chóng làm đóng băng không khí xung quanh vị trí của nó.
levels.traps.chillingtrap.name=bẫy lạnh
levels.traps.confusiontrap.desc=Việc kích hoạt bẫy này sẽ giải phóng một đám khí gây hỗn loạn trong khu vực xung quanh.
levels.traps.confusiontrap.name=bẫy khí nhầm lẫn
levels.traps.corrosiontrap.desc=Việc kích hoạt bẫy này sẽ giải phóng một đám khí axit độc hại vào khu vực xung quanh.
levels.traps.corrosiontrap.name=bẫy khí ăn mòn
levels.traps.cursingtrap.curse=Trang thiết bị cũ kỹ của bạn sẽ bị nguyền rủa!
levels.traps.cursingtrap.desc=Cạm bẫy này chứa cùng loại ma thuật độc ác như trong các trang bị bị nguyền rủa. Kích hoạt nó sẽ nguyền rủa một số vật phẩm trong khu vực xung quanh.
levels.traps.cursingtrap.name=bẫy nguyền rủa
levels.traps.disarmingtrap.desc=Cạm bẫy này chứa một loại ma thuật dịch chuyển tức thời rất đặc biệt, có khả năng dịch chuyển vũ khí của nạn nhân đến một vị trí khác.
levels.traps.disarmingtrap.disarm=Vũ khí của bạn đã bị dịch chuyển đi!
levels.traps.disarmingtrap.name=bẫy vô hiệu
levels.traps.disintegrationtrap.desc=Khi được kích hoạt, chiếc bẫy này sẽ bắn những tia hủy diệt vào mục tiêu gần nhất, gây sát thương đáng kể và phá hủy các vật phẩm. May mắn thay, cơ chế kích hoạt không bị giấu kín.
levels.traps.disintegrationtrap.name=bẫy phân rã
levels.traps.disintegrationtrap.ondeath=Bạn đã bị giết bởi bẫy phân rã...
levels.traps.disintegrationtrap.one=Chiếc bẫy sẽ phá hủy %s của bạn!
levels.traps.disintegrationtrap.some=Cái bẫy làm phân rã một số %s của bạn!
levels.traps.distortiontrap.desc=Được tạo ra từ một loại ma thuật kỳ lạ không rõ nguồn gốc, cái bẫy này sẽ triệu hồi đủ loại sinh vật đến địa điểm này.
levels.traps.distortiontrap.name=bẫy biến dạng
levels.traps.explosivetrap.desc=Chiếc bẫy này chứa một ít thuốc nổ dạng bột và một cơ chế kích hoạt. Kích hoạt nó sẽ gây ra một vụ nổ trong khu vực xung quanh.
levels.traps.explosivetrap.name=bẫy chất nổ
levels.traps.flashingtrap.desc=Khi được kích hoạt, chiếc bẫy này sẽ đốt cháy một loại bột gây cháy mạnh được cất giữ bên trong, làm mù tạm thời, làm tê liệt và gây thương tích cho nạn nhân. Chiếc bẫy phải có một lượng bột lớn, vì nó có thể kích hoạt nhiều lần mà không bị hỏng.
levels.traps.flashingtrap.name=bẫy nhấp nháy
levels.traps.flocktrap.desc=Có lẽ đó chỉ là một trò đùa của một pháp sư nghiệp dư nào đó, kích hoạt cái bẫy này sẽ tạo ra một đàn cừu ma thuật.
levels.traps.flocktrap.name=bẫy đàn
levels.traps.frosttrap.desc=Khi được kích hoạt, các chất hóa học trong bẫy này sẽ nhanh chóng làm đóng băng không khí trong một phạm vi rộng xung quanh vị trí của nó.
levels.traps.frosttrap.name=bẫy sương giá
levels.traps.gatewaytrap.desc=Cạm bẫy dịch chuyển đặc biệt này có thể kích hoạt vô số lần và luôn dịch chuyển đến cùng một vị trí.
levels.traps.gatewaytrap.name=bẫy cổng
levels.traps.geysertrap.desc=Khi được kích hoạt, cái bẫy này sẽ khiến một cột nước phun trào, gây sát thương cho kẻ thù đang bốc lửa, hất văng tất cả các nhân vật gần đó, dập tắt lửa và biến địa hình xung quanh thành nước.
levels.traps.geysertrap.name=bẫy mạch nước phun
levels.traps.gnollrockfalltrap.desc=Bẫy đá lở này được tạo ra với sự trợ giúp của một loại ma thuật nào đó. Khi được kích hoạt, nó sẽ khiến đá bị lung lay và ngay lập tức rơi xuống từ trên cao trong khu vực 5x5 xung quanh. Do đá trong khu vực mềm hơn, nó sẽ không gây ra nhiều sát thương như bẫy đá lở thông thường, nhưng áo giáp của bạn cũng sẽ không hiệu quả chống lại nó. Đá cũng sẽ không rơi xuống những vị trí có rào chắn liền kề, vì chúng giúp giữ trần nhà. Bẫy này không phân biệt bạn hay thù, vì vậy nó gây hại cho lũ gnoll cũng như cho bạn.
levels.traps.gnollrockfalltrap.name=bẫy đá lở gnoll
levels.traps.grimtrap.desc=Một loại ma thuật hủy diệt cực mạnh được cất giữ bên trong cái bẫy này, đủ để giết chết ngay lập tức tất cả trừ những anh hùng khỏe mạnh nhất. Kích hoạt nó sẽ phóng một luồng ma thuật chết người tầm xa về phía nhân vật gần nhất. May mắn thay, cơ chế kích hoạt không bị giấu kín.
levels.traps.grimtrap.name=cái bẫy chết chóc
levels.traps.grimtrap.ondeath=Bạn đã thiệt mạng bởi vụ nổ của một cái bẫy chết người...
levels.traps.grippingtrap.desc=Chiếc bẫy này sẽ bám chặt vào chân người nào kích hoạt nó, gây thương tích và làm chậm chuyển động của họ. Nhờ cấu tạo đơn giản, chiếc bẫy này có thể kích hoạt nhiều lần mà không bị hỏng.
levels.traps.grippingtrap.name=bẫy kẹp
levels.traps.guardiantrap$guardian.desc=Hình ảnh ma quái màu xanh này dường như là một tiếng vọng được triệu hồi của một trong những người bảo vệ bằng đá của hầm ngục.
levels.traps.guardiantrap$guardian.desc_weapon=Mặc dù bản thân bức tượng gần như vô hình, nhưng thanh kiếm _%s_ mà nó đang cầm trông rất thật.
levels.traps.guardiantrap$guardian.discover_hint=Bạn có thể tìm thấy kẻ thù này bằng một cái bẫy đặc biệt.
levels.traps.guardiantrap$guardian.name=người giám hộ được triệu hồi
levels.traps.guardiantrap.alarm=Chiếc bẫy phát ra âm thanh chói tai vang vọng khắp hầm ngục!
levels.traps.guardiantrap.desc=Cạm bẫy này được liên kết với một cơ chế ma thuật kỳ lạ, sẽ triệu hồi những người bảo vệ và cảnh báo tất cả kẻ thù trên tầng đó.
levels.traps.guardiantrap.name=bẫy canh gác
levels.traps.oozetrap.desc=Khi được kích hoạt, chiếc bẫy này sẽ phun ra chất lỏng ăn mòn, gây bỏng cho đến khi bị rửa trôi.
levels.traps.oozetrap.name=bẫy chất thải
levels.traps.pitfalltrap.desc=Chiếc bẫy này được nối với một cơ chế cửa sập lớn, và ngay sau khi được kích hoạt, bất cứ thứ gì ở gần đó sẽ trượt xuyên qua mặt đất và rơi xuống! Tuy nhiên, nó sẽ không hoạt động ở những khu vực có sàn nhà quá cứng.
levels.traps.pitfalltrap.name=bẫy hố
levels.traps.pitfalltrap.no_pit=Mặt đất ở đây quá cứng nên bẫy hố không thể hoạt động được.
levels.traps.pitfalltrap.triggered=Mặt đất bắt đầu sụt lún xung quanh chiếc bẫy vừa được kích hoạt!
levels.traps.pitfalltrap.triggered_hero=Mặt đất xung quanh bạn bắt đầu sụp xuống!
levels.traps.poisondarttrap.desc=Một thiết bị bắn phi tiêu nhỏ phải được giấu gần đó; kích hoạt bẫy này sẽ khiến nó bắn một mũi phi tiêu tẩm độc vào mục tiêu gần nhất. May mắn thay, cơ chế kích hoạt không bị giấu kín.
levels.traps.poisondarttrap.name=bẫy phi tiêu độc
levels.traps.poisondarttrap.ondeath=Bạn đã chết vì bẫy phi tiêu tẩm độc...
levels.traps.rockfalltrap.desc=Cái bẫy này được nối với một loạt đá rời rạc phía trên, khi kích hoạt nó sẽ khiến chúng rơi xuống khắp căn phòng! Nếu bẫy không nằm trong một phòng cụ thể, đá sẽ rơi xuống khu vực xung quanh bẫy. May mắn thay, cơ chế kích hoạt không bị giấu kín.
levels.traps.rockfalltrap.name=bẫy đá lở
levels.traps.rockfalltrap.ondeath=Bạn đã bị mắc kẹt trong bẫy đá lở...
levels.traps.shockingtrap.desc=Một cơ chế tích trữ một lượng năng lượng lớn. Kích hoạt cái bẫy này sẽ giải phóng năng lượng đó vào một trường năng lượng xung quanh nó.
levels.traps.shockingtrap.name=bẫy kinh hoàng
levels.traps.stormtrap.desc=Một cơ chế tích trữ một lượng năng lượng khổng lồ. Kích hoạt cái bẫy này sẽ giải phóng năng lượng đó thành một cơn bão điện mạnh.
levels.traps.stormtrap.name=bẫy bão
levels.traps.summoningtrap.desc=Kích hoạt bẫy này sẽ triệu hồi một số quái vật trong khu vực đến vị trí này.
levels.traps.summoningtrap.name=bẫy triệu hồi
levels.traps.teleportationtrap.desc=Mỗi khi bẫy này được kích hoạt, mọi thứ xung quanh nó sẽ bị dịch chuyển đến các vị trí ngẫu nhiên trên tầng này.
levels.traps.teleportationtrap.name=bẫy dịch chuyển tức thời
levels.traps.tengudarttrap.desc=Rõ ràng Tengu đã chuẩn bị cho một cuộc chiến. Cái bẫy này sẽ kích hoạt một máy bắn phi tiêu ẩn, bắn một mũi tên tẩm độc vào bất cứ thứ gì gần nhất không phải là Tengu. Cái bẫy được chế tạo tinh xảo đến mức cơ chế kích hoạt không thể phát hiện được nếu không có sự trợ giúp của phép thuật. Tuy nhiên, cái bẫy sẽ hiện ra trong giây lát khi nó đang được giăng.
levels.traps.toxictrap.desc=Việc kích hoạt bẫy này sẽ giải phóng một đám khí độc vào khu vực xung quanh.
levels.traps.toxictrap.name=bẫy khí độc
levels.traps.trap.discover_hint=Bạn có thể tìm thấy loại bẫy này một cách ngẫu nhiên trong hầm ngục. Mỗi khu vực sẽ có những loại bẫy khác nhau có thể xuất hiện.
levels.traps.trap.rankings_desc=Bị tiêu diệt bởi: %s
levels.traps.warpingtrap.desc=Cạm bẫy này tương tự như bẫy dịch chuyển tức thời, nhưng cũng sẽ khiến người chơi mất đi khả năng nhận biết bố cục tầng!
levels.traps.warpingtrap.name=bẫy biến dạng
levels.traps.weakeningtrap.desc=Ma thuật hắc ám trong cái bẫy này hút cạn năng lượng của bất cứ thứ gì tiếp xúc với nó. Tuy nhiên, những kẻ thù mạnh mẽ có thể kháng lại hiệu ứng này.
levels.traps.weakeningtrap.name=bẫy suy yếu
levels.traps.worndarttrap.desc=Một khẩu súng bắn phi tiêu nhỏ phải được giấu gần đó, kích hoạt bẫy này sẽ khiến nó bắn vào mục tiêu gần nhất.\n\nDo tuổi đời của nó nên nó không gây hại lắm, thậm chí nó còn không được giấu kín...
levels.traps.worndarttrap.name=bẫy phi tiêu cũ
levels.traps.worndarttrap.ondeath=Bạn đã bị giết bởi chiếc bẫy phi tiêu cũ kỹ...
levels.vaultlevel$vaultflametrap.desc=Lỗ thông hơi này dường như đang phun ra những ngọn lửa màu xanh lục theo những khoảng thời gian nhất định. _Vì đây chỉ là khu vực thử nghiệm, nên ngọn lửa từ lỗ thông hơi sẽ không gây hại cho bạn._
levels.vaultlevel$vaultflametrap.name=lỗ thoát lửa hầm

levels.level.sign_desc=Bạn không thể đọc văn bản từ đây.
levels.level.sign_name=Dấu hiệu
