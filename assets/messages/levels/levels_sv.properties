levels.cavesbosslevel.energy_desc=Marken här gnistrar av elektricitet, och det är skadligt att trampa på den. _Gnistorna verkar dras åt ett visst håll..._ kanske leder de till strömkällan?
levels.cavesbosslevel.gate_desc=En stor metallgrind som blockerar vägen in i dvärgarnas metropol. Metalllådan i mitten producerar ett högt surrande ljud, den måste vara ansluten till kretsarna och maskinerna i närheten. Kanske att förstörelsen av DM-300 kommer att öppna grinden?
levels.cavesbosslevel.gate_desc_broken=Porten måste ha varit kopplad till DM-300 på något sätt, eftersom den exploderade när DM-300 besegrades. Nu återstår bara trasiga delar.
levels.cavesbosslevel.gate_name=Metallgrind
levels.cavesbosslevel.water_desc=Med all elektricitet här omkring är vatten kanske inte alltid säkert...
levels.cavesbosslevel.wires_desc=Marken är delvis uppgrävd här, och visar några stora exponerade ledningar. De måste koppla samman de olika elektriska maskinerna. \n\n Ledningarna måste ha ström genom sig. Om DM-300 kliver här kan den eventuellt dra ström från dem.
levels.cavesbosslevel.wires_name=Exponerad ledning
levels.caveslevel.bookshelf_desc=Vem skulle behöva en bokhylla i en grotta?
levels.caveslevel.entrance_desc=Stegen leder upp till det övre djupet.
levels.caveslevel.exit_desc=Stegen leder ner till det lägre djupet.
levels.caveslevel.grass_name=Fluorescerande mossa
levels.caveslevel.high_grass_desc=Stora svampar skymmer utsikten.
levels.caveslevel.high_grass_name=Fluorescerande svampar
levels.caveslevel.region_deco_desc=En stor helmetallstruktur, troligen byggd av dvärgarna när de brukade bryta här. Man tror att man kan se länge oanvända gruvvagnsspår som löper längs toppen.
levels.caveslevel.region_deco_name=Metallstruktur
levels.caveslevel.wall_deco_desc=En åder av malm syns på väggen. Guld?
levels.caveslevel.water_name=Iskallt vatten
levels.citybosslevel.summoning_desc=Denna piedestal har en stor öppning i mitten, som praktiskt taget utstrålar mörk energi. \n\nDvärgkungen använder dessa piedestaler som fokuspunkter för sin nekromantiska magi, och kan kalla fram minions till dem. Piedestalen måste ladda i några varv innan minionen dyker upp, och vilken typ av minion som kallas fram telegraferas av den byggande magiska kraften.
levels.citybosslevel.summoning_name=Tillkallande piedestal
levels.citybosslevel.throne_desc=Denna imponerande stora tron är säte för dvärgriket, nu tagit över av en maktgalen nekromantiker. \n\nDet verkar finnas några magiska eller mekaniska delar på tronen, Dvärgkungen kan ha ytterligare kraft när han sitter på den.
levels.citybosslevel.throne_name=Tron
levels.citylevel.bookshelf_desc=Raderna av böcker om olika discipliner fyller bokhyllan.
levels.citylevel.deco_desc=Flera plattor saknas här.
levels.citylevel.entrance_desc=En ramp leder upp till det övre djupet.
levels.citylevel.exit_desc=En ramp leder ner till det lägre djupet.
levels.citylevel.high_grass_name=Högblommande blommor
levels.citylevel.region_deco_desc=En upphöjd piedestal med en klargrön magisk låga ovanpå. Lågan är så tät att den lika gärna skulle kunna vara solid.
levels.citylevel.region_deco_name=Flammande piedestal
levels.citylevel.sp_desc=Tjock matta täcker golvet.
levels.citylevel.statue_desc=Statyn avbildar en dvärg som står i en heroisk ställning.
levels.citylevel.upcoming_quest_intro_no=Stanna här
levels.citylevel.upcoming_quest_intro_title=Meddelande från utvecklaren
levels.citylevel.upcoming_quest_intro_yes=Gå ner i valvet
levels.citylevel.water_name=Misstänkt färgat vatten
levels.features.chasm.chasm=Klyfta
levels.features.chasm.jump=Vill du verkligen hoppa ner i avgrunden? Ett så djupt fall kommer att vara smärtsamt.
levels.features.chasm.no=Nej, jag ändrade mig
levels.features.chasm.ondeath=Du föll ihjäl...
levels.features.chasm.rankings_desc=Död vid kollision
levels.features.chasm.yes=Ja, jag vet vad jag gör
levels.hallslevel.bookshelf_desc=Böcker på forntida språk pyrar i bokhyllan.
levels.hallslevel.grass_name=Embermossa
levels.hallslevel.high_grass_name=Emberfungi
levels.hallslevel.region_deco_desc=En enorm stenbit som verkar ha brutits loss från taket eller en närliggande vägg.
levels.hallslevel.region_deco_name=En bit spillror
levels.hallslevel.statue_desc=Pelaren är gjord av riktiga människoliknande dödskallar. Häftigt.
levels.hallslevel.statue_name=Pelare
levels.hallslevel.water_desc=Det ser ut som lava, men det är kallt och förmodligen säkert att röra vid.
levels.hallslevel.water_name=Kall lava
levels.level$feeling.chasm_desc=Dina steg ekar över fängelsehålan.
levels.level$feeling.chasm_title=avgrundsgolv
levels.level$feeling.dark_desc=Man kan höra fiender röra sig i mörkret.
levels.level$feeling.dark_title=mörkt golv
levels.level$feeling.grass_desc=Doften av växtlighet ligger tjock i luften.
levels.level$feeling.grass_title=gräsgolv
levels.level$feeling.large_desc=Det här fängelsehålsgolvet verkar ovanligt stort.
levels.level$feeling.large_title=stort golv
levels.level$feeling.secrets_desc=Atmosfären antyder att den här våningen döljer många hemligheter.
levels.level$feeling.secrets_title=hemligheter våningen
levels.level$feeling.traps_desc=Marken verkar särskilt förrädisk här.
levels.level$feeling.traps_title=fällor golv
levels.level$feeling.water_desc=Du hör vatten plaska runt omkring dig.
levels.level$feeling.water_title=vattenbotten
levels.level.alchemy_desc=Denna kruka är fylld med magiskt vatten. Föremål kan blandas i krukan för att skapa något nytt!
levels.level.alchemy_name=alkemikruka
levels.level.barricade_desc=Träbarrikaden är ordentligt monterad men har torkat med åren. Kan den brinna?
levels.level.barricade_name=Barrikad
levels.level.bookshelf_name=Bokhylla
levels.level.chasm_desc=Du kan inte se botten.
levels.level.chasm_name=Klyfta
levels.level.closed_door_name=Stängd dörr
levels.level.crystal_door_desc=Den här låsta dörren är gjord av magisk kristall. Du kan se igenom den, men du behöver en kristallnyckel för att öppna den.
levels.level.crystal_door_name=Kristalldörr
levels.level.default_name=???
levels.level.embers_desc=Glöd täcker golvet.
levels.level.embers_name=Glöd
levels.level.empty_well_desc=Brunnen har sinat.
levels.level.empty_well_name=Töm brunnen
levels.level.entrace_name=Djupingång
levels.level.entrance_desc=Trappor leder upp till det övre djupet.
levels.level.exit_desc=Trappor leder ner till det lägre djupet.
levels.level.exit_name=Djuputgång
levels.level.floor_name=Golv
levels.level.furrowed_grass_name=Fårad vegetation
levels.level.grass_name=Gräs
levels.level.hidden_trap=En dold %s aktiveras!
levels.level.high_grass_desc=Tät vegetation skymmer utsikten.
levels.level.high_grass_name=Högt gräs
levels.level.inactive_trap_desc=Fällan har utlösts tidigare och den är inte farlig längre.
levels.level.inactive_trap_name=Utlöst fälla
levels.level.locked_door_desc=Den här dörren är låst, du behöver en matchande nyckel för att låsa upp den.
levels.level.locked_door_name=Låst dörr
levels.level.locked_exit_desc=Tunga galler blockerar trappan som leder ner.
levels.level.locked_exit_name=Låst djuputgång
levels.level.open_door_name=Öppen dörr
levels.level.pedestal_name=Piedestal
levels.level.statue_desc=Någon ville pryda den här platsen, men misslyckades uppenbarligen.
levels.level.statue_name=Staty
levels.level.unlocked_exit_name=Upplåst djuputgång
levels.level.wall_name=Vägg
levels.level.water_desc=Vid brännskada, gå i vattnet för att släcka elden.
levels.level.water_name=Vatten
levels.level.well_name=Väl
levels.mininglevel.barricade_desc=Träbarrikaden är stadigt monterad och fungerar som ett stöd för taket.\n\nDenna konstruerades förmodligen av gnollarna för att ge ett visst skydd mot fallande stenar. _Alla intilliggande celler kommer att skyddas från stenfallsfällor och attacker._\n\nDet ser ut som att den skulle brinna lika bra som vilken annan barrikad som helst.
levels.mininglevel.boulder_desc=Det finns en stor stenblock som blockerar vägen. Den borde vara ganska lätt att bryta med en hacka.
levels.mininglevel.boulder_name=Flyttblock
levels.mininglevel.crystal_desc=Det finns en stor och färgglad kristall som sprider sig här. Dessa kristaller är ömtåliga och kan lätt brytas med en hacka, eller så går de sönder om något bryts bredvid dem.
levels.mininglevel.crystal_name=Kristallspik
levels.mininglevel.gold_extra_desc=Du kan förmodligen bryta ut den med din hacka.
levels.mininglevel.wall_desc=En slät stenmur som är lite mjukare än vanligt. Du kan bryta igenom den med din hacka, men det kommer att kräva lite ansträngning och öka din hunger lite.
levels.prisonlevel.bookshelf_desc=Detta är förmodligen en rest av ett fängelsebibliotek. Kan det brinna?
levels.prisonlevel.empty_deco_desc=Det finns gamla blodfläckar på golvet.
levels.prisonlevel.region_deco_alt_desc=En metallbur precis stor nog att rymma en person. Den hänger över en djup avgrund, upphängd i en kedja.
levels.prisonlevel.region_deco_alt_name=Hängande bur
levels.prisonlevel.region_deco_desc=En metallbur precis stor nog att rymma en person. Den verkar vara låst i marken på något sätt, man kan inte flytta den.
levels.prisonlevel.region_deco_name=Fängelsebur
levels.prisonlevel.water_name=Mörkt kallt vatten
levels.rooms.quest.ambitiousimproom$questentrance.desc=Denna olycksbådande grop verkar vara ingången till någon gammal dvärgvalv. En magisk barriär hindrar inträde, man kan gå över den som om det fanns golv här.
levels.rooms.quest.ambitiousimproom$questentrance.name=Valvingång
levels.rooms.quest.blacksmithroom$questentrance.desc=Denna stege leder till en gammal gruva alldeles nedanför smedjans verkstad.
levels.rooms.quest.blacksmithroom$questentrance.name=Gruventré
levels.rooms.quest.massgraveroom$bones.desc=Ben ligger utspridda på golvet, vad hände här?
levels.rooms.quest.massgraveroom$bones.name=Massgrav
levels.rooms.quest.mineentrance$questexit.desc=Denna stege leder ut ur gruvan, tillbaka in i smedens verkstad.
levels.rooms.quest.mineentrance$questexit.name=Gruvutgång
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=En målad markör för någon mörk ritual. Ljus placeras vanligtvis i de fyra hörnen.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritualmarkör
levels.rooms.special.magicalfireroom$eternalfire.desc=En vägg av tät, ljusgrön eld finns här, till synes orsakad av magi. Den är så tät att du inte kan röra dig igenom den, och den antänder allt som kommer för nära. Den visar inga tecken på att brinna ner naturligt, du måste använda något för att släcka den.
levels.rooms.special.sentryroom$sentry.desc=Denna blodröda vaktpost verkar vara placerad här för att vakta skatten i andra änden av rummet. Den kommer att avfyra strålar av sönderfallsmagi mot dig om du kliver in i det område den försvarar.\n\nDen är immun mot alla skadliga effekter och kan se genom osynlighet, men det verkar ta ett tag att ladda upp innan den börjar skjuta.\n\nPå något sätt vill vaktposten bara skjuta på dig, som om den vet att invånarna i fängelsehålan inte är något hot mot skatten.
levels.rooms.special.sentryroom$sentry.discover_hint=Du kan hitta den här fienden var som helst i fängelsehålan.
levels.rooms.special.sentryroom$sentry.name=röd vaktpost
levels.rooms.special.toxicgasroom$toxicvent.desc=En slarvig äventyrare måste ha utlöst den här fällan för länge sedan. Trots sitt inaktiva tillstånd spyr den fortfarande ut giftig gas i rummet och visar inga tecken på att sluta. Du behöver något sätt att förhindra skador från gasen om du vill utforska det här rummet.
levels.rooms.special.toxicgasroom$toxicvent.name=giftig ventil
levels.rooms.special.weakfloorroom$hiddenwell.desc=Du kan precis urskilja en brunn i djupet nedanför, kanske finns det något där nere?
levels.rooms.special.weakfloorroom$hiddenwell.name=avlägsen brunn
levels.sewerlevel.bookshelf_desc=Bokhyllan är fullpackad med billiga, oanvändbara böcker. Kan det brinna?
levels.sewerlevel.empty_deco_desc=Våt gulaktig mossa täcker golvet.
levels.sewerlevel.region_deco_desc=En rejäl tunna som är nästan lika stor som du. Den måste vara full av något, den är för tung att flytta.
levels.sewerlevel.region_deco_name=Lagringsfat
levels.sewerlevel.water_name=Grumligt vatten
levels.traps.alarmtrap.alarm=Fällan avger ett genomträngande ljud som ekar genom hela fängelsehålan!
levels.traps.alarmtrap.desc=Den här fällan verkar vara kopplad till en högljudd larmmekanism. Om den utlöses kommer sannolikt allt på nivån att larma.
levels.traps.alarmtrap.name=larmfälla
levels.traps.blazingtrap.desc=Att trampa på den här fällan antänder en kraftfull kemisk blandning som sätter ett stort område i brand.
levels.traps.blazingtrap.name=flammande fälla
levels.traps.burningtrap.desc=Att trampa på denna fälla antänder en kemisk blandning som sätter omgivningen i brand.
levels.traps.burningtrap.name=brinnande fälla
levels.traps.chillingtrap.desc=När den aktiveras kommer kemikalierna i denna fälla snabbt att frysa luften runt dess plats.
levels.traps.chillingtrap.name=kylfälla
levels.traps.confusiontrap.desc=Att utlösa denna fälla kommer att släppa lös ett moln av förvirringsgas i närområdet.
levels.traps.confusiontrap.name=förvirringsgasfälla
levels.traps.corrosiontrap.desc=Att utlösa denna fälla kommer att släppa lös ett moln av dödlig sur gas i närområdet.
levels.traps.corrosiontrap.name=frätande gasfälla
levels.traps.cursingtrap.curse=Din slitna utrustning blir förbannad!
levels.traps.cursingtrap.desc=Den här fällan innehåller samma ondskefulla magi som finns i förbannad utrustning. Om du utlöser den kommer vissa föremål i närområdet att förbannas.
levels.traps.cursingtrap.name=förbannelsefälla
levels.traps.disarmingtrap.desc=Den här fällan innehåller mycket specifik teleporteringsmagi, som kommer att förvränga offrets vapen till någon annan plats.
levels.traps.disarmingtrap.disarm=Ditt vapen är teleporterat bort!
levels.traps.disarmingtrap.name=avväpnande fälla
levels.traps.disintegrationtrap.desc=När den här fällan utlöses kommer den att skjuta närmaste mål med strålar av sönderfall, vilket orsakar betydande skada och förstör föremål. \n\nSom tur är är utlösningsmekanismen inte dold.
levels.traps.disintegrationtrap.name=sönderfallsfälla
levels.traps.disintegrationtrap.ondeath=Du dödades av sönderfallsfällan...
levels.traps.disintegrationtrap.one=Fällan sönderdelar din %s!
levels.traps.disintegrationtrap.some=Fällan sönderdelar en del av dina %s!
levels.traps.distortiontrap.desc=Byggd av märklig magi av okänt ursprung, kommer denna fälla att kalla fram alla möjliga varelser till den här platsen.
levels.traps.distortiontrap.name=distorsionsfälla
levels.traps.explosivetrap.desc=Denna fälla innehåller sprängämnen i pulverform och en utlösningsmekanism. Om den aktiveras kommer en explosion att uppstå i närområdet.
levels.traps.explosivetrap.name=explosiv fälla
levels.traps.flashingtrap.desc=Vid aktivering antänder fällan ett kraftigt blixtande krut som lagras inuti, vilket tillfälligt bländar, förlamar och skadar offret. \n\n Fällan måste ha ett stort krutförråd, eftersom den kan aktiveras många gånger utan att gå sönder.
levels.traps.flashingtrap.name=blinkande fälla
levels.traps.flocktrap.desc=Kanske ett skämt från någon amatörmagiker som utlöser den här fällan kommer att skapa en flock magiska får.
levels.traps.flocktrap.name=flockfälla
levels.traps.frosttrap.desc=När den aktiveras kommer kemikalierna i denna fälla snabbt att frysa luften inom ett brett område runt dess plats.
levels.traps.frosttrap.name=frostfälla
levels.traps.gatewaytrap.desc=Denna speciella teleporteringsfälla kan aktiveras ett oändligt antal gånger och teleporteras alltid till samma plats.
levels.traps.gatewaytrap.name=gateway-fälla
levels.traps.geysertrap.desc=När den utlöses kommer fällan att orsaka att en vattengejser sprutar fram, vilket skadar eldiga fiender, slår bort alla karaktärer i närheten, släcker bränder och omvandlar den omgivande terrängen till vatten.
levels.traps.geysertrap.name=gejserfälla
levels.traps.gnollrockfalltrap.desc=Denna stenfallsfälla är gjord med någon form av magisk hjälp. När den utlöses kommer den att få stenar att lossna och omedelbart falla uppifrån i ett 5x5-område runt den. På grund av de mjukare stenarna i området kommer den inte att göra lika mycket skada som en vanlig stenfallsfälla, men din rustning kommer inte heller att vara effektiv mot den. Stenar kommer inte heller att falla på platser med en intilliggande barrikad, eftersom de hjälper till att hålla uppe taket.\n\n_Denna fälla kan inte skilja vän från fiende, och är därför lika skadlig för gnollarna som för dig._
levels.traps.gnollrockfalltrap.name=Gnoll stenfallsfälla
levels.traps.grimtrap.desc=Extremt kraftfull destruktiv magi lagras i denna fälla, tillräckligt för att omedelbart döda alla utom de friskaste hjältarna. Om den utlöses skickas en långdistansattack av dödlig magi mot närmaste karaktär. \n\n Tack och lov är utlösningsmekanismen inte dold.
levels.traps.grimtrap.name=dyster fälla
levels.traps.grimtrap.ondeath=Du dödades av explosionen från en grym fälla...
levels.traps.grippingtrap.desc=Denna fälla fäster sig på fötterna på den som utlöser den, vilket skadar dem och saktar ner deras rörelser. \n\n På grund av sin enkla natur kan fällan aktiveras många gånger utan att gå sönder.
levels.traps.grippingtrap.name=gripfälla
levels.traps.guardiantrap$guardian.desc=Denna blå uppenbarelse verkar vara ett framkallat eko av en av fängelsehålans stenväktare.
levels.traps.guardiantrap$guardian.desc_weapon=Medan statyn i sig är nästan okroppslig, ser _%s_ den bär verklig ut.
levels.traps.guardiantrap$guardian.discover_hint=Du kan hitta den här fienden med en specifik fälla.
levels.traps.guardiantrap$guardian.name=tillkallad förmyndare
levels.traps.guardiantrap.alarm=Fällan avger ett genomträngande ljud som ekar genom hela fängelsehålan!
levels.traps.guardiantrap.desc=Denna fälla är knuten till en märklig magisk mekanism, som kommer att kalla fram väktare och varna alla fiender på golvet.
levels.traps.guardiantrap.name=skyddsfälla
levels.traps.oozetrap.desc=Denna fälla kommer att stänka ut kaustisk ot när den aktiveras, vilken kommer att brinna tills den har sköljts bort.
levels.traps.oozetrap.name=sörpfälla
levels.traps.pitfalltrap.desc=Den här fällan är kopplad till en stor fallucka, och strax efter att den utlöses kommer allt i närheten att glida rakt ner genom marken och falla! Den fungerar dock inte i områden med särskilt solida golv.
levels.traps.pitfalltrap.name=fallgrop
levels.traps.pitfalltrap.no_pit=Marken är för fast för att en fallgropfälla ska fungera här.
levels.traps.pitfalltrap.triggered=Marken börjar ge vika runt den utlösta fällan!
levels.traps.pitfalltrap.triggered_hero=Marken börjar ge vika runt dig!
levels.traps.poisondarttrap.desc=En liten pilblåsare måste finnas gömd i närheten. Om fällan aktiveras skjuter den en förgiftad pil mot närmaste mål. \n\n Tack och lov är avtryckarmekanismen inte dold.
levels.traps.poisondarttrap.name=giftpilfälla
levels.traps.poisondarttrap.ondeath=Du dödades av giftpilfällan...
levels.traps.rockfalltrap.desc=Den här fällan är kopplad till en serie lösa stenar ovanför, och om den utlöses kommer de att krascha ner över hela rummet! Om fällan inte är i ett specifikt rum kommer stenarna att falla i ett område runt fällan istället. \n\nSom tur är är utlösningsmekanismen inte dold.
levels.traps.rockfalltrap.name=stenfallsfälla
levels.traps.rockfalltrap.ondeath=Du blev krossad av stenrasfällan...
levels.traps.shockingtrap.desc=En mekanism med en stor mängd energi lagrad i sig. Att utlösa denna fälla kommer att släppa ut den energin i ett fält runt omkring den.
levels.traps.shockingtrap.name=chockerande fälla
levels.traps.stormtrap.desc=En mekanism med en enorm mängd energi lagrad i sig. Att utlösa denna fälla kommer att släppa ut den energin i ett kraftigt elektriskt åskväder.
levels.traps.stormtrap.name=stormfälla
levels.traps.summoningtrap.desc=Att utlösa den här fällan kommer att kalla fram ett antal av områdets monster till den här platsen.
levels.traps.summoningtrap.name=kallande fälla
levels.traps.teleportationtrap.desc=Närhelst den här fällan utlöses kommer allt runt omkring den att teleporteras till slumpmässiga platser på den här våningen.
levels.traps.teleportationtrap.name=teleporteringsfälla
levels.traps.tengudarttrap.desc=Tengu har uppenbarligen förberett sig för en strid. Den här fällan aktiverar en dold pilblåsare som skjuter en giftpil mot närmaste sak som inte är Tengu. \n\n Fällan är så välgjord att utlösningsmekanismen är omöjlig att upptäcka utan magisk hjälp. Fällan är dock synlig ett ögonblick när den sätts upp.
levels.traps.toxictrap.desc=Att utlösa denna fälla kommer att släppa lös ett moln av giftig gas i omgivningen.
levels.traps.toxictrap.name=giftig gasfälla
levels.traps.trap.discover_hint=Du kan hitta den här fällan slumpmässigt i grottan. Varje region har olika fällor som kan dyka upp.
levels.traps.trap.rankings_desc=Dödad av: %s
levels.traps.warpingtrap.desc=Den här fällan liknar en teleporteringsfälla, men kommer också att få hjälten att förlora sin kunskap om golvets layout!
levels.traps.warpingtrap.name=skevhetsfälla
levels.traps.weakeningtrap.desc=Mörk magi i den här fällan suger ut energin ur allt som kommer i kontakt med den. Mäktiga fiender kan dock motstå effekten.
levels.traps.weakeningtrap.name=försvagande fälla
levels.traps.worndarttrap.desc=En liten pilblåsare måste finnas gömd i närheten, om den här fällan aktiveras kommer den att skjuta mot närmaste mål. \n\n På grund av sin ålder är den dock inte särskilt skadlig, den är inte ens gömd...
