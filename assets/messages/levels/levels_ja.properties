levels.cavesbosslevel.energy_desc=ここの地面は電気でスパークしている。火花はある方向に引き寄せられているようだ。
levels.cavesbosslevel.gate_desc=ドワーフの大都市への道を塞ぐ大きな金属製の門。中央にある金属製の箱が大きなうなり音を立てている。近くにある回路や機械につながっているのだろう。DM-300を破壊すればゲートが開くのだろうか？
levels.cavesbosslevel.gate_desc_broken=DM-300が倒されたときに爆発したので、ゲートは何らかの形でDM-300とつながっていたのだろう。今は壊れた破片だけが残っている。
levels.cavesbosslevel.gate_name=メタルゲート
levels.cavesbosslevel.water_desc=このあたりは電気が通っているから、水も安全とは限らない......。
levels.cavesbosslevel.wires_desc=地面が部分的に掘り返され、大きなワイヤーが露出している。さまざまな電気機械をつないでいるのだろう。\n\nワイヤーには電流が流れているはずだ。DM-300がここを踏めば、電力を引き出せるかもしれない。
levels.cavesbosslevel.wires_name=露出配線
levels.caveslevel.bookshelf_desc=洞窟に本棚が必要だろうか？
levels.caveslevel.entrance_desc=ハシゴは上層部まで続いている。
levels.caveslevel.exit_desc=梯子は下の深さまで続いている。
levels.caveslevel.grass_name=蛍光苔
levels.caveslevel.high_grass_desc=巨大なキノコが視界を遮る。
levels.caveslevel.high_grass_name=蛍光マッシュルーム
levels.caveslevel.region_deco_desc=おそらくドワーフがこの場所で採掘していたときに建てたと思われる、金属でできた大きな建造物だ。長い間使われていなかった鉱山車の線路が見えると思う。
levels.caveslevel.region_deco_name=金属構造
levels.caveslevel.wall_deco_desc=壁に鉱脈が見える。金か？
levels.caveslevel.water_name=冷たい水を凍らせる
levels.citybosslevel.summoning_desc=この台座の中央には大きな開口部があり、実質的にダークエネルギーが放射されている。\n\nドワーフ・キングはこの台座を黒魔術の焦点として使用し、ミニオンを召喚することができる。ミニオンが出現するまでに、台座は数ターン充電されなければならず、召喚されるミニオンの種類は、構築される魔力によってテレグラフされる。
levels.citybosslevel.summoning_name=召喚台座
levels.citybosslevel.throne_desc=この印象的なほど大きな玉座はドワーフ帝国の座であり、現在は権力に狂った黒魔術師が引き継いでいる。\n\nドワーフの王はこの玉座に座ると、さらなる力を得られるかもしれない。
levels.citybosslevel.throne_name=玉座
levels.citylevel.bookshelf_desc=さまざまな分野の本が本棚いっぱいに並んでいる。
levels.citylevel.deco_desc=ここにはいくつかのタイルが欠けている。
levels.citylevel.entrance_desc=スロープが上の深さまで続いている。
levels.citylevel.exit_desc=スロープが下の深さまで続いている。
levels.citylevel.high_grass_name=満開の花
levels.citylevel.region_deco_desc=盛り上がった台座の上には、鮮やかな緑色の魔法の炎がある。炎は非常に濃く、まるで固体のようだ。
levels.citylevel.region_deco_name=炎の台座
levels.citylevel.sp_desc=厚手のカーペットが床を覆っている。
levels.citylevel.statue_desc=この像には、英雄的な姿勢で立つ小人が描かれている。
levels.citylevel.upcoming_quest_intro_no=ここに滞在する
levels.citylevel.upcoming_quest_intro_title=開発者メッセージ
levels.citylevel.upcoming_quest_intro_yes=金庫室に入る
levels.citylevel.water_name=怪しい色の水
levels.features.chasm.chasm=割れ目
levels.features.chasm.jump=本当にその裂け目に飛び込みたいのか？そこまで落ちたら、痛い思いをするだろう。
levels.features.chasm.no=いや、気が変わったんだ
levels.features.chasm.ondeath=あなたは転落死した...
levels.features.chasm.rankings_desc=衝撃で死亡
levels.features.chasm.yes=ああ、自分が何をしているかは分かっている
levels.hallslevel.bookshelf_desc=本棚には古語の本がくすぶっている。
levels.hallslevel.grass_name=エンバーモス
levels.hallslevel.high_grass_name=琥珀菌
levels.hallslevel.region_deco_desc=天井か近くの壁から割れたと思われる巨大な石の破片。
levels.hallslevel.region_deco_name=瓦礫の塊
levels.hallslevel.statue_desc=柱は本物の人型の頭蓋骨でできている。すごい。
levels.hallslevel.statue_name=柱
levels.hallslevel.water_desc=溶岩のように見えるが、冷たくて触っても安全だろう。
levels.hallslevel.water_name=冷たい溶岩
levels.level$feeling.chasm_desc=あなたの足音がダンジョンに響き渡る。
levels.level$feeling.chasm_title=割れ目
levels.level$feeling.dark_desc=暗闇の中で敵の動きが聞こえる。
levels.level$feeling.dark_title=ダークフロア
levels.level$feeling.grass_desc=草木の匂いが濃い。
levels.level$feeling.grass_title=芝生
levels.level$feeling.large_desc=このダンジョンのフロアは異常に広いようだ。
levels.level$feeling.large_title=大床
levels.level$feeling.secrets_desc=このフロアには多くの秘密が隠されていそうな雰囲気だ。
levels.level$feeling.secrets_title=秘密フロア
levels.level$feeling.traps_desc=ここは特に地面が危険なようだ。
levels.level$feeling.traps_title=トラップフロア
levels.level$feeling.water_desc=周囲から水しぶきが聞こえる。
levels.level$feeling.water_title=水盤
levels.level.alchemy_desc=このポットは魔法の水で満たされている。ポットの中にアイテムを入れて、新しいものを作ることができる！
levels.level.alchemy_name=錬金術の壺
levels.level.barricade_desc=木製のバリケードはしっかりと固定されているが、何年もかけて乾燥している。燃えてしまうのでは？
levels.level.barricade_name=バリケード
levels.level.bookshelf_name=本棚
levels.level.chasm_desc=底が見えない。
levels.level.chasm_name=割れ目
levels.level.closed_door_name=閉ざされた扉
levels.level.crystal_door_desc=この鍵のかかったドアは魔法のクリスタルでできている。中を覗くことはできるが、開けるにはクリスタルの鍵が必要だ。
levels.level.crystal_door_name=クリスタルドア
levels.level.default_name=？？？
levels.level.embers_desc=燃えさしが床を覆う。
levels.level.embers_name=エンバー
levels.level.empty_well_desc=井戸は涸れてしまった。
levels.level.empty_well_name=空の井戸
levels.level.entrace_name=奥行きのある入り口
levels.level.entrance_desc=階段は上層階まで続いている。
levels.level.exit_desc=階段は下の深さまで続いている。
levels.level.exit_name=デプス出口
levels.level.floor_name=フロア
levels.level.furrowed_grass_name=植生
levels.level.grass_name=グラス
levels.level.hidden_trap=隠れていた%sが起動！
levels.level.high_grass_desc=鬱蒼とした草木が視界を遮る。
levels.level.high_grass_name=高草
levels.level.inactive_trap_desc=罠は以前にも仕掛けられたことがあり、もう危険ではない。
levels.level.inactive_trap_name=トリガートラップ
levels.level.locked_door_desc=このドアには鍵がかかっているので、鍵を開けるには同じ鍵が必要です。
levels.level.locked_door_name=施錠されたドア
levels.level.locked_exit_desc=重い鉄格子が下へ続く階段をふさいでいる。
levels.level.locked_exit_name=ロックされた奥行き出口
levels.level.open_door_name=オープンドア
levels.level.pedestal_name=台座
levels.level.statue_desc=誰かがこの場所を飾りたかったが、明らかに失敗した。
levels.level.statue_name=像
levels.level.unlocked_exit_name=デプス出口のロック解除
levels.level.wall_name=壁
levels.level.water_desc=燃えた場合は、水の中に入って消火する。
levels.level.water_name=水
levels.level.well_name=さて
levels.mininglevel.barricade_desc=木製のバリケードはしっかりと固定され、天井を支える役割を果たす。\n\nこれはおそらく、落石から身を守るためにニョールたちが作ったものだろう。_隣接するセルは落石の罠や攻撃から守られる。\n\n他のバリケードと同じように燃えそうだ。
levels.mininglevel.boulder_desc=大きな岩が道をふさいでいる。ツルハシで簡単に壊せるはずだ。
levels.mininglevel.boulder_name=ボルダー
levels.mininglevel.crystal_desc=ここには大きくてカラフルな結晶が露出している。この水晶は壊れやすく、ツルハシで簡単に割ることができる。
levels.mininglevel.crystal_name=クリスタルスパイク
levels.mininglevel.gold_extra_desc=ツルハシで採掘できるだろう。
levels.mininglevel.wall_desc=いつもより少し柔らかい、滑らかな岩壁。ツルハシで掘り進むことができるが、少し手間がかかり、空腹感が増す。
levels.prisonlevel.bookshelf_desc=これはおそらく刑務所図書館の名残だろう。燃えるかも？
levels.prisonlevel.empty_deco_desc=床には古い血痕がある。
levels.prisonlevel.region_deco_alt_desc=人を入れるのに十分な大きさの金属製の檻。鎖で吊るされ、深い裂け目にかかっている。
levels.prisonlevel.region_deco_alt_name=吊り下げ式ケージ
levels.prisonlevel.region_deco_desc=人を入れるのに十分な大きさの金属製の檻。何らかの方法で地面に固定されているようで、動かすことはできない。
levels.prisonlevel.region_deco_name=刑務所の檻
levels.prisonlevel.water_name=濃い冷水
levels.rooms.quest.ambitiousimproom$questentrance.desc=この不気味な穴は、古代のドワーフの金庫の入り口のようだ。魔法の障壁が立ち入りを阻んでいるが、まるでここに床があるかのように、その上を歩くことができる。
levels.rooms.quest.ambitiousimproom$questentrance.name=ボールト・エントランス
levels.rooms.quest.blacksmithroom$questentrance.desc=この梯子は、鍛冶屋の工房のすぐ下にある古い鉱山に通じている。
levels.rooms.quest.blacksmithroom$questentrance.name=鉱山の入り口
levels.rooms.quest.massgraveroom$bones.desc=床には骨が散らばっている。
levels.rooms.quest.massgraveroom$bones.name=集団墓地
levels.rooms.quest.mineentrance$questexit.desc=この梯子は鉱山を出て、鍛冶屋の作業場へと続いている。
levels.rooms.quest.mineentrance$questexit.name=鉱山の出口
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=ある暗い儀式のために描かれた目印。ロウソクは通常、四隅に置かれる。
levels.rooms.quest.ritualsiteroom$ritualmarker.name=儀式用マーカー
levels.rooms.special.magicalfireroom$eternalfire.desc=魔法によるものと思われる、濃密な明るい緑色の炎の壁がここにある。あまりに密集しているため、通り抜けることはできず、近づきすぎたものに引火する。自然に燃え尽きる気配はなく、何かで消す必要がある。
levels.rooms.special.sentryroom$sentry.desc=この血のように赤い歩哨は、この部屋の反対側にある財宝を守るために配置されているようだ。守っているエリアに踏み込むと、崩壊魔法のビームを撃ってくる。\n\nあらゆる有害な効果に免疫があり、透明を通り抜けて見ることができるが、発射を開始するまでのチャージに時間がかかるようだ。\n\nまるでダンジョンの住人が財宝にとって脅威ではないことを知っているかのように。
levels.rooms.special.sentryroom$sentry.discover_hint=この敵はダンジョンのどこにでもいる。
levels.rooms.special.sentryroom$sentry.name=赤の番兵
levels.rooms.special.toxicgasroom$toxicvent.desc=昔、不注意な冒険者が仕掛けた罠だろう。作動していないにもかかわらず、有毒ガスが部屋に噴出しており、止まる気配はない。この部屋を探索するには、ガスによるダメージを防ぐ方法が必要だ。
levels.rooms.special.toxicgasroom$toxicvent.name=有毒ガス排出口
levels.rooms.special.weakfloorroom$hiddenwell.desc=下の方に井戸が見えるが、何かあるのだろうか？
levels.rooms.special.weakfloorroom$hiddenwell.name=遠井
levels.sewerlevel.bookshelf_desc=本棚には安くて役に立たない本がぎっしり。燃えるかも？
levels.sewerlevel.empty_deco_desc=濡れた黄色っぽい苔が床を覆っている。
levels.sewerlevel.region_deco_desc=自分とほぼ同じ大きさの頑丈な樽だ。何かで一杯なのだろう、重くて動かせない。
levels.sewerlevel.region_deco_name=貯蔵樽
levels.sewerlevel.water_name=濁った水
levels.traps.alarmtrap.alarm=罠は、ダンジョン全体に響き渡る貫通音を発する！
levels.traps.alarmtrap.desc=この罠は大音量の警報装置と連動しているようだ。これを作動させれば、そのレベルにいる全員に警告が発せられるだろう。
levels.traps.alarmtrap.name=アラームトラップ
levels.traps.blazingtrap.desc=このトラップを踏むと、強力な化学混合物に引火し、広範囲が燃え上がる。
levels.traps.blazingtrap.name=火炎トラップ
levels.traps.burningtrap.desc=このトラップを踏むと、化学混合物に引火し、周囲が燃え上がる。
levels.traps.burningtrap.name=焚き付けトラップ
levels.traps.chillingtrap.desc=活性化すると、このトラップ内の化学物質が急速に周囲の空気を凍らせる。
levels.traps.chillingtrap.name=れいとうのわな
levels.traps.confusiontrap.desc=このトラップを作動させると、すぐ近くの地域に混乱ガスの雲が放たれる。
levels.traps.confusiontrap.name=混乱ガストラップ
levels.traps.corrosiontrap.desc=このトラップを作動させると、すぐ近くのエリアに猛毒の酸性ガスが放たれる。
levels.traps.corrosiontrap.name=腐食性ガストラップ
levels.traps.cursingtrap.curse=着用した装備が呪われる！
levels.traps.cursingtrap.desc=このトラップには、呪われた装備品に見られるのと同じ悪意のある魔法が含まれている。発動すると、すぐ近くのアイテムが呪われる。
levels.traps.cursingtrap.name=呪いの罠
levels.traps.disarmingtrap.desc=この罠には非常に特殊なテレポートの魔法が含まれており、被害者の武器を別の場所にワープさせる。
levels.traps.disarmingtrap.disarm=武器がテレポートされる！
levels.traps.disarmingtrap.name=解除トラップ
levels.traps.disintegrationtrap.desc=このトラップが発動すると、最も近いターゲットに分解ビームを浴びせ、大ダメージを与え、アイテムを破壊する。\n\nありがたいことに、仕掛けは隠されていない。
levels.traps.disintegrationtrap.name=崩壊トラップ
levels.traps.disintegrationtrap.ondeath=あなたは崩壊トラップに殺された...。
levels.traps.disintegrationtrap.one=罠はあなたの%sを崩壊させる！
levels.traps.disintegrationtrap.some=罠は%sの一部を崩壊させる！
levels.traps.distortiontrap.desc=起源不明の奇妙な魔法で作られたこの罠は、あらゆる生き物をこの場所に呼び寄せる。
levels.traps.distortiontrap.name=ディストーショントラップ
levels.traps.explosivetrap.desc=このトラップには、粉末状の爆薬とトリガー機構が入っている。作動させると、すぐ近くで爆発が起こる。
levels.traps.explosivetrap.name=爆発トラップ
levels.traps.flashingtrap.desc=発動すると、この罠の中に蓄えられた強力な閃光の粉に点火し、被害者を一時的に失明させ、不具にし、負傷させる。\n\nこの罠は壊れることなく何度でも作動させることができるため、火薬を大量に蓄えておく必要がある。
levels.traps.flashingtrap.name=点滅トラップ
levels.traps.flocktrap.desc=おそらく、どこかのアマチュア魔道士のジョークだろうが、この罠を発動させると魔法の羊の群れが生まれる。
levels.traps.flocktrap.name=フロックトラップ
levels.traps.frosttrap.desc=活性化すると、このトラップ内の化学物質が、設置場所周辺の広い範囲の空気を急速に凍結させる。
levels.traps.frosttrap.name=フロストトラップ
levels.traps.gatewaytrap.desc=この特殊なテレポート・トラップは無限に発動でき、常に同じ場所にテレポートする。
levels.traps.gatewaytrap.name=ゲートウェイトラップ
levels.traps.geysertrap.desc=このトラップが発動すると、間欠泉のような水が噴出し、炎に包まれた敵にダメージを与え、近くにいるすべてのキャラクターを倒し、火を消し、周囲の地形を水に変える。
levels.traps.geysertrap.name=間欠泉トラップ
levels.traps.gnollrockfalltrap.desc=この落石トラップは、何らかの魔法の力を借りて作られている。発動すると岩が緩み、すぐに周囲5x5の範囲に上から落下してくる。このエリアは岩が柔らかいため、通常の落石トラップほどのダメージは与えられないが、アーマーも有効ではない。また、バリケードが隣接している場所では、バリケードが天井を支えるのに役立つため、岩は落下しない。\n\nこのトラップは敵味方の区別がつかないので、ニョロニョロにとってもあなたにとっても同じように有害である。
levels.traps.gnollrockfalltrap.name=ノールロックフォールトラップ
levels.traps.grimtrap.desc=この罠には非常に強力な破壊魔法が仕込まれており、健康なヒーロー以外は即死させることができる。この罠を発動すると、最も近くにいるキャラクターに向かって致死量の魔法が放たれる。\n\nありがたいことに、仕掛けは隠されていない。
levels.traps.grimtrap.name=グリムトラップ
levels.traps.grimtrap.ondeath=あなたはグリムトラップの爆風で死んだ...。
levels.traps.grippingtrap.desc=このトラップは発動した者の足にからみつき、ダメージを与えて動きを鈍らせる。\n\nその単純な性質により、この罠は壊れることなく何度でも発動できる。
levels.traps.grippingtrap.name=グリッピングトラップ
levels.traps.guardiantrap$guardian.desc=この青い幻影は、ダンジョンの石の守護者の一人が召喚したこだまのようだ。
levels.traps.guardiantrap$guardian.desc_weapon=像そのものはほとんど実体のないものだが、その像が振り回している_%s_は本物に見える。
levels.traps.guardiantrap$guardian.discover_hint=この敵は特定の罠で見つけることができる。
levels.traps.guardiantrap$guardian.name=召集後見人
levels.traps.guardiantrap.alarm=罠は、ダンジョン全体に響き渡る貫通音を発する！
levels.traps.guardiantrap.desc=このトラップは奇妙な魔法の仕掛けと結びついており、ガーディアンを召喚し、フロアにいるすべての敵に警告を発する。
levels.traps.guardiantrap.name=ガーディアントラップ
levels.traps.oozetrap.desc=このトラップが作動すると、苛性溶液が飛び散り、洗い流されるまで燃える。
levels.traps.oozetrap.name=ウーズトラップ
levels.traps.pitfalltrap.desc=このトラップは大きな仕掛け扉に繋がっており、発動後間もなく、近くにいるものは地面をすり抜けて落下する！特に床が固い場所では機能しない。
levels.traps.pitfalltrap.name=落とし穴
levels.traps.pitfalltrap.no_pit=地盤が固いので、落とし穴用のトラップは使えない。
levels.traps.pitfalltrap.triggered=仕掛けられた罠の周りで地面が崩れ始める！
levels.traps.pitfalltrap.triggered_hero=地面があなたの周りに道を譲り始める！
levels.traps.poisondarttrap.desc=小型のダーツ吹き矢を近くに隠しておく必要があり、この罠を作動させると、最も近い標的に毒矢を放つ。\n\nありがたいことに、引き金の仕掛けは隠されていない。
levels.traps.poisondarttrap.name=ポイズンダートトラップ
levels.traps.poisondarttrap.ondeath=あなたは毒矢の罠で殺された...。
levels.traps.rockfalltrap.desc=このトラップは上にある岩とつながっており、トラップを作動させると部屋全体に岩が落ちてくる！トラップが特定の部屋にない場合は、代わりにトラップ周辺のエリアに岩が落ちてくる。\n\n仕掛けが隠されていないのはありがたい。
levels.traps.rockfalltrap.name=落石落とし
levels.traps.rockfalltrap.ondeath=あなたは落石トラップに押しつぶされた...。
levels.traps.shockingtrap.desc=大量のエネルギーを蓄えた仕掛け。このトラップを作動させると、そのエネルギーが周囲のフィールドに放出される。
levels.traps.shockingtrap.name=衝撃の罠
levels.traps.stormtrap.desc=大量のエネルギーを蓄えた仕掛け。このトラップを作動させると、そのエネルギーが大きな電気の嵐となって放出される。
levels.traps.stormtrap.name=ストームトラップ
levels.traps.summoningtrap.desc=この罠を発動すると、このエリアのモンスターがこの場所に召喚される。
levels.traps.summoningtrap.name=召喚罠
levels.traps.teleportationtrap.desc=このトラップが発動するたびに、周囲にあるすべてのものがこのフロアのランダムな場所にテレポートされる。
levels.traps.teleportationtrap.name=テレポーテーショントラップ
levels.traps.tengudarttrap.desc=天狗は明らかに戦いの準備をしている。この罠は隠しダーツブロワーを作動させ、天狗以外の一番近くにいるものに毒矢を放つ。\n\n罠は非常によくできており、魔法の助けなしには仕掛けを発見することは不可能だ。ただし、罠を仕掛けているときは一瞬見える。
levels.traps.toxictrap.desc=このトラップを作動させると、周囲に有毒ガスの雲が放たれる。
levels.traps.toxictrap.name=有毒ガストラップ
levels.traps.trap.discover_hint=このトラップはダンジョン内でランダムに見つけることができる。地域ごとに出現する罠が異なります。
levels.traps.trap.rankings_desc=殺された%s
levels.traps.warpingtrap.desc=このトラップはテレポートトラップに似ているが、主人公がフロアのレイアウトに関する知識を失ってしまう！
levels.traps.warpingtrap.name=ワープトラップ
levels.traps.weakeningtrap.desc=この罠の暗黒魔法は、接触したものからエネルギーを吸い取る。ただし、強力な敵はこの効果に抵抗するかもしれない。
levels.traps.weakeningtrap.name=弱り罠
levels.traps.worndarttrap.desc=小型のダーツブロワーを近くに隠しておく必要があり、このトラップを作動させると、最も近いターゲットに向けてダーツが発射される。\n\nその古さゆえ、あまり害はないが、隠されてもいない...。
levels.traps.worndarttrap.name=磨耗したダート・トラップ
levels.traps.worndarttrap.ondeath=あなたはダートトラップによって殺された...。
levels.vaultlevel$vaultflametrap.desc=この通気口は、一定の間隔で緑色の炎を上げているようだ。ここは単なるテスターエリアなので、通気口からの炎で実際に怪我をすることはありません」。
levels.vaultlevel$vaultflametrap.name=ヴォールト・フレーム・ベント
levels.level.sign_desc=ここからはテキストを読むことができません。
levels.level.sign_name=サイン
