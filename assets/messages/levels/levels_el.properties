levels.features.chasm.rankings_desc=Πέθανε κατά την πρόσκρουση
levels.features.chasm.yes=Ναι, ξέρω τι κάνω
levels.hallslevel.bookshelf_desc=Βιβλία σε αρχαίες γλώσσες σιγοκαίνε στη βιβλιοθήκη.
levels.hallslevel.grass_name=Έμπερμος
levels.hallslevel.high_grass_name=Εμβέργκι
levels.hallslevel.region_deco_desc=Ένα τεράστιο κομμάτι πέτρας που φαίνεται να έχει αποκολληθεί από την οροφή ή από έναν κοντινό τοίχο.
levels.hallslevel.region_deco_name=Κομμάτι από ερείπια
levels.hallslevel.statue_desc=Η κολόνα είναι φτιαγμένη από πραγματικά ανθρωποειδή κρανία. Φοβερό.
levels.hallslevel.statue_name=Κολόνα
levels.hallslevel.water_desc=Μοιάζει με λάβα, αλλά είναι κρύο και πιθανώς ασφαλές στην αφή.
