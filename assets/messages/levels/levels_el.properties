levels.level$feeling.traps_desc=Το έδαφος φαίνεται ιδιαίτερα επικίνδυνο εδώ.
levels.level$feeling.traps_title=παγίδες δαπέδου
levels.level$feeling.water_desc=Ακούς νερό να πιτσιλάει γύρω σου.
levels.level$feeling.water_title=υδάτινο δάπεδο
levels.level.alchemy_desc=Αυτή η κατσαρόλα είναι γεμάτη με μαγικό νερό. Μπορείτε να αναμίξετε αντικείμενα στην κατσαρόλα για να δημιουργήσετε κάτι νέο!
levels.level.alchemy_name=δοχείο αλχημείας
levels.level.barricade_desc=Το ξύλινο οδόφραγμα είναι γερά στημένο αλλά έχει στεγνώσει με τα χρόνια. Μήπως καίγεται;
