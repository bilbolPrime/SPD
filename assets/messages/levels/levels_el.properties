levels.level.locked_door_desc=Αυτή η πόρτα είναι κλειδωμένη, χρειάζεσαι ένα αντίστοιχο κλειδί για να την ξεκλειδώσεις.
levels.level.locked_door_name=Κλειδωμένη πόρτα
levels.level.locked_exit_desc=Βαριά κάγκελα φράζουν τις σκάλες που οδηγούν προς τα κάτω.
