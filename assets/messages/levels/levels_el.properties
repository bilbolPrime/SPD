levels.level$feeling.dark_desc=Μπορείτε να ακούσετε τους εχθρούς να κινούνται στο σκοτάδι.
levels.level$feeling.dark_title=σκοτεινό πάτωμα
levels.level$feeling.grass_desc=Η μυρωδιά της βλάστησης είναι έντονη στον αέρα.
levels.level$feeling.grass_title=χλοοτάπητας
levels.level$feeling.large_desc=Αυτό το δάπεδο του μπουντρουμιού φαίνεται ασυνήθιστα μεγάλο.
levels.level$feeling.large_title=μεγάλο πάτωμα
levels.level$feeling.secrets_desc=Η ατμόσφαιρα υποδηλώνει ότι αυτός ο όροφος κρύβει πολλά μυστικά.
