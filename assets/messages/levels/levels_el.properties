levels.level.wall_name=Τείχος
levels.level.water_desc=Σε περίπτωση εγκαύματος, μπείτε στο νερό για να σβήσετε τη φωτιά.
levels.level.water_name=Νερό
levels.level.well_name=Λοιπόν
levels.mininglevel.barricade_desc=Το ξύλινο οδόφραγμα είναι σταθερά τοποθετημένο και λειτουργεί ως στήριγμα για την οροφή. \n\nΑυτό πιθανότατα κατασκευάστηκε από τα gnolls για να παρέχει κάποια προστασία από την πτώση βράχων. _Οποιαδήποτε γειτονικά κελιά θα προστατεύονται από παγίδες και επιθέσεις από βραχοπτώσεις._\n\nΦαίνεται ότι θα καιγόταν εξίσου καλά με οποιοδήποτε άλλο οδόφραγμα.
levels.mininglevel.boulder_desc=Υπάρχει ένας μεγάλος βράχος που εμποδίζει το δρόμο. Θα πρέπει να είναι αρκετά εύκολο να τον σπάσετε με αξίνα.
levels.mininglevel.boulder_name=Ογκόλιθος
levels.mininglevel.crystal_desc=Υπάρχει ένας μεγάλος και πολύχρωμος κρύσταλλος που προεξέχει εδώ. Αυτοί οι κρύσταλλοι είναι εύθραυστοι και μπορούν εύκολα να σπάσουν με μια αξίνα ή θα σπάσουν αν εξορυχθεί κάτι δίπλα τους.
levels.mininglevel.crystal_name=Κρυστάλλινη ακίδα
levels.mininglevel.gold_extra_desc=Πιθανότατα μπορείς να το εξορύξεις με την αξίνα σου.
levels.mininglevel.wall_desc=Ένας λείος βράχος που είναι λίγο πιο μαλακός από το συνηθισμένο. Μπορείτε να τον σκάψετε με την αξίνα σας, αλλά θα χρειαστεί λίγη προσπάθεια και θα αυξήσει λίγο την πείνα σας.
levels.prisonlevel.bookshelf_desc=Αυτό είναι πιθανώς ένα απομεινάρι βιβλιοθήκης φυλακής. Μήπως κάηκε;
levels.prisonlevel.empty_deco_desc=Υπάρχουν παλιοί λεκέδες αίματος στο πάτωμα.
levels.prisonlevel.region_deco_alt_desc=Ένα μεταλλικό κλουβί αρκετά μεγάλο για να χωρέσει ένα άτομο. Κρέμεται πάνω από ένα βαθύ χάσμα, κρεμασμένο από μια αλυσίδα.
levels.prisonlevel.region_deco_alt_name=Κρεμαστό κλουβί
levels.prisonlevel.region_deco_desc=Ένα μεταλλικό κλουβί αρκετά μεγάλο για να χωρέσει ένα άτομο. Φαίνεται σαν να είναι κλειδωμένο στο έδαφος με κάποιο τρόπο, δεν μπορείς να το μετακινήσεις.
levels.prisonlevel.region_deco_name=Κλουβί φυλακής
levels.prisonlevel.water_name=Σκοτεινό κρύο νερό
levels.rooms.quest.ambitiousimproom$questentrance.desc=Αυτό το δυσοίωνο λάκκο φαίνεται να είναι η είσοδος σε κάποιο αρχαίο θησαυροφυλάκιο νάνων. Ένα μαγικό φράγμα εμποδίζει την είσοδο, μπορείτε να περπατήσετε πάνω του σαν να υπήρχε πάτωμα εδώ.
levels.rooms.quest.ambitiousimproom$questentrance.name=Είσοδος Θησαυροφυλάκιο
levels.rooms.quest.blacksmithroom$questentrance.desc=Αυτή η σκάλα οδηγεί σε ένα παλιό ορυχείο ακριβώς κάτω από το εργαστήριο του σιδηρουργού.
levels.rooms.quest.blacksmithroom$questentrance.name=Είσοδος ορυχείου
levels.rooms.quest.massgraveroom$bones.desc=Κόκαλα είναι σκορπισμένα στο πάτωμα, τι συνέβη εδώ;
levels.rooms.quest.massgraveroom$bones.name=Μαζικός τάφος
levels.rooms.quest.mineentrance$questexit.desc=Αυτή η σκάλα οδηγεί έξω από το ορυχείο, πίσω στο εργαστήριο του σιδηρουργού.
levels.rooms.quest.mineentrance$questexit.name=Έξοδος ορυχείου
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Ένας ζωγραφισμένος μαρκαδόρος για κάποια σκοτεινή τελετουργία. Συνήθως τοποθετούνται κεριά στις τέσσερις γωνίες.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Τελετουργικό σημάδι
levels.rooms.special.magicalfireroom$eternalfire.desc=Ένας τοίχος από πυκνή, φωτεινή πράσινη φωτιά είναι εδώ, που φαίνεται να έχει προκληθεί από μαγεία. Είναι τόσο πυκνός που δεν μπορείς να κινηθείς μέσα από αυτόν και ανάβει οτιδήποτε πλησιάσει πολύ. Δεν δείχνει σημάδια φυσικής καύσης, θα χρειαστεί να χρησιμοποιήσετε κάτι για να τον σβήσετε.
levels.rooms.special.sentryroom$sentry.desc=Αυτός ο αιματοβαμμένος φρουρός φαίνεται να έχει τοποθετηθεί εδώ για να φυλάει τον θησαυρό στην άλλη άκρη αυτού του δωματίου. Θα εκτοξεύσει ακτίνες μαγείας αποσύνθεσης εναντίον σας αν μπείτε στην περιοχή που υπερασπίζεται.\n\nΕίναι άτρωτος σε όλες τις βλαβερές συνέπειες και μπορεί να δει μέσα από την αορατότητα, αλλά φαίνεται να χρειάζεται λίγο χρόνο για να φορτίσει πριν αρχίσει να πυροβολεί.\n\nΚατά κάποιο τρόπο, ο φρουρός θέλει μόνο να πυροβολήσει εναντίον σας, σαν να ξέρει ότι οι κάτοικοι του μπουντρουμιού δεν αποτελούν απειλή για τον θησαυρό.
levels.rooms.special.sentryroom$sentry.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό οπουδήποτε στο μπουντρούμι.
levels.rooms.special.sentryroom$sentry.name=κόκκινος φρουρός
levels.rooms.special.toxicgasroom$toxicvent.desc=Κάποιος απρόσεκτος τυχοδιώκτης πρέπει να ενεργοποίησε αυτήν την παγίδα πριν από πολύ καιρό. Παρά την ανενεργή της κατάσταση, εξακολουθεί να εκπέμπει τοξικό αέριο στο δωμάτιο και δεν δείχνει σημάδια σταματήματος. Θα χρειαστείτε κάποιον τρόπο για να αποτρέψετε ζημιές από το αέριο, αν θέλετε να εξερευνήσετε αυτό το δωμάτιο.
levels.rooms.special.toxicgasroom$toxicvent.name=τοξική διέξοδος
levels.rooms.special.weakfloorroom$hiddenwell.desc=Μπορείς απλώς να διακρίνεις ένα πηγάδι στα βάθη από κάτω, ίσως υπάρχει κάτι εκεί κάτω;
levels.rooms.special.weakfloorroom$hiddenwell.name=μακρινό πηγάδι
levels.sewerlevel.bookshelf_desc=Η βιβλιοθήκη είναι γεμάτη με φθηνά άχρηστα βιβλία. Μήπως καεί;
levels.sewerlevel.empty_deco_desc=Υγρή κιτρινωπή βρύα καλύπτει το πάτωμα.
levels.sewerlevel.region_deco_desc=Ένα γερό βαρέλι σχεδόν όσο μεγάλο είσαι εσύ. Πρέπει να είναι γεμάτο με κάτι, είναι πολύ βαρύ για να το μετακινήσεις.
levels.sewerlevel.region_deco_name=Βαρέλι αποθήκευσης
levels.sewerlevel.water_name=Θολό νερό
levels.traps.alarmtrap.alarm=Η παγίδα εκπέμπει έναν διαπεραστικό ήχο που αντηχεί σε όλο το μπουντρούμι!
levels.traps.alarmtrap.desc=Αυτή η παγίδα φαίνεται να συνδέεται με έναν δυνατό μηχανισμό συναγερμού. Η ενεργοποίησή της πιθανότατα θα ειδοποιήσει τα πάντα στο επίπεδο.
levels.traps.alarmtrap.name=παγίδα συναγερμού
levels.traps.blazingtrap.desc=Αν πατήσετε αυτήν την παγίδα, θα ανάψει ένα ισχυρό χημικό μείγμα, προκαλώντας πυρκαγιά σε μια μεγάλη περιοχή.
levels.traps.blazingtrap.name=φλεγόμενη παγίδα
levels.traps.burningtrap.desc=Αν πατήσετε αυτήν την παγίδα, θα αναφλεγεί ένα χημικό μείγμα, προκαλώντας πυρκαγιά στη γύρω περιοχή.
levels.traps.burningtrap.name=παγίδα καύσης
levels.traps.chillingtrap.desc=Όταν ενεργοποιηθούν, οι χημικές ουσίες σε αυτήν την παγίδα θα παγώσουν γρήγορα τον αέρα γύρω από την τοποθεσία της.
levels.traps.chillingtrap.name=παγίδα ψύξης
levels.traps.confusiontrap.desc=Η ενεργοποίηση αυτής της παγίδας θα προκαλέσει την απελευθέρωση ενός νέφους αερίου σύγχυσης στην άμεση περιοχή.
levels.traps.confusiontrap.name=παγίδα αερίου σύγχυσης
levels.traps.corrosiontrap.desc=Η ενεργοποίηση αυτής της παγίδας θα απελευθερώσει ένα νέφος θανατηφόρου όξινου αερίου στην άμεση περιοχή.
levels.traps.corrosiontrap.name=διαβρωτική παγίδα αερίου
levels.traps.cursingtrap.curse=Ο φθαρμένος εξοπλισμός σας γίνεται καταραμένος!
levels.traps.cursingtrap.desc=Αυτή η παγίδα περιέχει την ίδια κακόβουλη μαγεία που βρίσκεται στον καταραμένο εξοπλισμό. Η ενεργοποίησή της θα καταράσει ορισμένα αντικείμενα στην άμεση περιοχή.
levels.traps.cursingtrap.name=παγίδα κατάρας
levels.traps.disarmingtrap.desc=Αυτή η παγίδα περιέχει πολύ συγκεκριμένη μαγεία τηλεμεταφοράς, η οποία θα παραμορφώσει το όπλο του θύματός της σε κάποια άλλη τοποθεσία.
levels.traps.disarmingtrap.disarm=Το όπλο σου τηλεμεταφέρεται μακριά!
levels.traps.disarmingtrap.name=παγίδα αφοπλισμού
levels.traps.disintegrationtrap.desc=Όταν ενεργοποιηθεί, αυτή η παγίδα θα εκτοξεύσει τον πλησιέστερο στόχο με ακτίνες αποσύνθεσης, προκαλώντας σημαντική ζημιά και καταστρέφοντας αντικείμενα. \n\n Ευτυχώς, ο μηχανισμός σκανδάλης δεν είναι κρυφός.
levels.traps.disintegrationtrap.name=παγίδα αποσύνθεσης
levels.traps.disintegrationtrap.ondeath=Σκοτώθηκες από την παγίδα της αποσύνθεσης...
levels.traps.disintegrationtrap.one=Η παγίδα διαλύει το %s σου!
levels.traps.disintegrationtrap.some=Η παγίδα διαλύει μερικά από τα %s σου!
levels.traps.distortiontrap.desc=Φτιαγμένη από παράξενη μαγεία άγνωστης προέλευσης, αυτή η παγίδα θα καλέσει κάθε είδους πλάσματα σε αυτήν την τοποθεσία.
levels.traps.distortiontrap.name=παγίδα παραμόρφωσης
levels.traps.explosivetrap.desc=Αυτή η παγίδα περιέχει κάποια εκρηκτική ύλη σε σκόνη και μηχανισμό σκανδάλης. Η ενεργοποίησή της θα προκαλέσει έκρηξη στην άμεση περιοχή.
levels.traps.explosivetrap.name=εκρηκτική παγίδα
levels.traps.flashingtrap.desc=Κατά την ενεργοποίηση, αυτή η παγίδα θα ανάψει μια ισχυρή πυρίτιδα που αναβοσβήνει και είναι αποθηκευμένη στο εσωτερικό της, τυφλώνοντας προσωρινά, παραλύοντας και τραυματίζοντας το θύμα της. \n\nΗ παγίδα πρέπει να έχει μεγάλη ποσότητα πυρίτιδας, καθώς μπορεί να ενεργοποιηθεί πολλές φορές χωρίς να σπάσει.
levels.traps.flashingtrap.name=αναβοσβήνει παγίδα
levels.traps.flocktrap.desc=Ίσως ένα αστείο από κάποιον ερασιτέχνη μάγο, που ενεργοποιεί αυτή την παγίδα, να δημιουργήσει ένα κοπάδι από μαγικά πρόβατα.
levels.traps.flocktrap.name=παγίδα κοπαδιών
levels.traps.frosttrap.desc=Όταν ενεργοποιηθούν, οι χημικές ουσίες σε αυτήν την παγίδα θα παγώσουν γρήγορα τον αέρα σε ένα ευρύ φάσμα γύρω από την τοποθεσία της.
levels.traps.frosttrap.name=παγίδα παγετού
levels.traps.gatewaytrap.desc=Αυτή η ειδική παγίδα τηλεμεταφοράς μπορεί να ενεργοποιηθεί άπειρες φορές και τηλεμεταφέρεται πάντα στην ίδια τοποθεσία.
levels.traps.gatewaytrap.name=παγίδα πύλης
levels.traps.geysertrap.desc=Όταν ενεργοποιηθεί, αυτή η παγίδα θα προκαλέσει την έκχυση ενός θερμοπίδακα νερού, προκαλώντας ζημιά στους πύρινους εχθρούς, σκοτώνοντας όλους τους κοντινούς χαρακτήρες, σβήνοντας τις φωτιές και μετατρέποντας το γύρω έδαφος σε νερό.
levels.traps.geysertrap.name=παγίδα θερμοπίδακα
levels.traps.gnollrockfalltrap.desc=Αυτή η παγίδα κατάρρευσης βράχων κατασκευάζεται με κάποια μορφή μαγικής βοήθειας. Όταν ενεργοποιηθεί, θα προκαλέσει χαλάρωση των βράχων και άμεση πτώση από πάνω σε μια περιοχή 5x5 γύρω της. Λόγω των μαλακότερων βράχων στην περιοχή, δεν θα προκαλέσει τόση ζημιά όσο μια συνηθισμένη παγίδα κατάρρευσης βράχων, αλλά η πανοπλία σας δεν θα είναι αποτελεσματική εναντίον της. Οι βράχοι επίσης δεν θα πέσουν σε τοποθεσίες με παρακείμενο οδόφραγμα, καθώς βοηθούν στη συγκράτηση της οροφής.\n\n_Αυτή η παγίδα δεν μπορεί να ξεχωρίσει τον φίλο από τον εχθρό, και έτσι είναι εξίσου επιβλαβής για τα gnolls όσο και για εσάς._
levels.traps.gnollrockfalltrap.name=παγίδα πτώσεων βράχου Gnol
levels.traps.grimtrap.desc=Μέσα σε αυτήν την παγίδα αποθηκεύεται εξαιρετικά ισχυρή καταστροφική μαγεία, αρκετή για να σκοτώσει αμέσως όλους τους ήρωες εκτός από τους πιο υγιείς. Η ενεργοποίησή της θα στείλει μια έκρηξη θανατηφόρας μαγείας από απόσταση προς τον πλησιέστερο χαρακτήρα. \n\n Ευτυχώς, ο μηχανισμός ενεργοποίησης δεν είναι κρυμμένος.
levels.traps.grimtrap.name=ζοφερή παγίδα
levels.traps.grimtrap.ondeath=Σκοτώθηκες από την έκρηξη μιας ζοφερής παγίδας...
levels.traps.grippingtrap.desc=Αυτή η παγίδα πιάνει στα πόδια όποιου την ενεργοποιήσει, προκαλώντας του ζημιά και επιβράδυνση της κίνησής του. \n\nΛόγω της απλής φύσης της, αυτή η παγίδα μπορεί να ενεργοποιηθεί πολλές φορές χωρίς να σπάσει.
levels.traps.grippingtrap.name=παγίδα πιασίματος
levels.traps.guardiantrap$guardian.desc=Αυτή η μπλε οπτασία μοιάζει με μια επικληθείσα ηχώ ενός από τους πέτρινους φύλακες του μπουντρουμιού.
levels.traps.guardiantrap$guardian.desc_weapon=Ενώ το ίδιο το άγαλμα είναι σχεδόν ασώματο, το _%s_ που κρατάει μοιάζει αληθινό.
levels.traps.guardiantrap$guardian.discover_hint=Μπορείτε να βρείτε αυτόν τον εχθρό με μια συγκεκριμένη παγίδα.
levels.traps.guardiantrap$guardian.name=κλητευμένος κηδεμόνας
levels.traps.guardiantrap.alarm=Η παγίδα εκπέμπει έναν διαπεραστικό ήχο που αντηχεί σε όλο το μπουντρούμι!
levels.traps.guardiantrap.desc=Αυτή η παγίδα είναι συνδεδεμένη με έναν παράξενο μαγικό μηχανισμό, ο οποίος θα καλέσει φύλακες και θα ειδοποιήσει όλους τους εχθρούς στο πάτωμα.
levels.traps.guardiantrap.name=παγίδα φύλακα
levels.traps.oozetrap.desc=Αυτή η παγίδα θα εκτοξεύσει καυστική λάσπη όταν ενεργοποιηθεί, η οποία θα καίγεται μέχρι να ξεπλυθεί.
levels.traps.oozetrap.name=παγίδα λάσπης
levels.traps.pitfalltrap.desc=Αυτή η παγίδα συνδέεται με έναν μεγάλο μηχανισμό καταπακτής και λίγο μετά την ενεργοποίησή της, οτιδήποτε βρίσκεται κοντά της θα γλιστρήσει κατευθείαν στο έδαφος και θα πέσει! Δεν θα λειτουργήσει όμως σε περιοχές με ιδιαίτερα συμπαγή δάπεδα.
levels.traps.pitfalltrap.name=παγίδα
levels.traps.pitfalltrap.no_pit=το έδαφος είναι πολύ στέρεο για να λειτουργήσει εδώ μια παγίδα.
levels.traps.pitfalltrap.triggered=Το έδαφος αρχίζει να υποχωρεί γύρω από την ενεργοποιημένη παγίδα!
levels.traps.pitfalltrap.triggered_hero=Το έδαφος αρχίζει να υποχωρεί γύρω σου!
levels.traps.poisondarttrap.desc=Ένα μικρό φυσητήρα βελών πρέπει να είναι κρυμμένο κοντά. Η ενεργοποίηση αυτής της παγίδας θα την αναγκάσει να εκτοξεύσει ένα δηλητηριασμένο βέλος στον πλησιέστερο στόχο. \n\n Ευτυχώς, ο μηχανισμός σκανδάλης δεν είναι κρυμμένος.
levels.traps.poisondarttrap.name=παγίδα με δηλητηριώδη βέλη
levels.traps.poisondarttrap.ondeath=Σκοτώθηκες από την παγίδα με τα δηλητηριασμένα βέλη...
levels.traps.rockfalltrap.desc=Αυτή η παγίδα συνδέεται με μια σειρά από χαλαρές πέτρες από πάνω, και η ενεργοποίησή της θα τις προκαλέσει να πέσουν σε ολόκληρο το δωμάτιο! Εάν η παγίδα δεν βρίσκεται σε ένα συγκεκριμένο δωμάτιο, οι πέτρες θα πέσουν σε μια περιοχή γύρω από την παγίδα. \n\n Ευτυχώς, ο μηχανισμός σκανδάλης δεν είναι κρυμμένος.
levels.traps.rockfalltrap.name=παγίδα πτώσεων βράχων
levels.traps.rockfalltrap.ondeath=Σε συνέτριψε η παγίδα της πτώσης βράχων...
levels.traps.shockingtrap.desc=Ένας μηχανισμός στον οποίο αποθηκεύεται μεγάλη ποσότητα ενέργειας. Η ενεργοποίηση αυτής της παγίδας θα εκκενώσει αυτήν την ενέργεια σε ένα πεδίο γύρω της.
levels.traps.shockingtrap.name=σοκαριστική παγίδα
levels.traps.stormtrap.desc=Ένας μηχανισμός στον οποίο αποθηκεύεται τεράστια ποσότητα ενέργειας. Η ενεργοποίηση αυτής της παγίδας θα εκφορτίσει αυτήν την ενέργεια με αποτέλεσμα μια μεγάλη ηλεκτρική καταιγίδα.
levels.traps.stormtrap.name=παγίδα καταιγίδας
levels.traps.summoningtrap.desc=Η ενεργοποίηση αυτής της παγίδας θα καλέσει πολλά από τα τέρατα αυτής της περιοχής σε αυτήν την τοποθεσία.
levels.traps.summoningtrap.name=παγίδα επίκλησης
levels.traps.teleportationtrap.desc=Κάθε φορά που ενεργοποιείται αυτή η παγίδα, όλα γύρω της θα τηλεμεταφέρονται σε τυχαίες τοποθεσίες σε αυτόν τον όροφο.
levels.traps.teleportationtrap.name=παγίδα τηλεμεταφοράς
levels.traps.tengudarttrap.desc=Ο Τένγκου προφανώς προετοιμαζόταν για μάχη. Αυτή η παγίδα θα ενεργοποιήσει έναν κρυφό φυσητήρα βελών, ο οποίος θα εκτοξεύσει ένα δηλητηριώδες βέλος στο πλησιέστερο πράγμα που δεν είναι ο Τένγκου. \n\n Η παγίδα είναι τόσο καλοφτιαγμένη που ο μηχανισμός σκανδάλης είναι αδύνατο να ανιχνευθεί χωρίς μαγική βοήθεια. Ωστόσο, η παγίδα είναι ορατή για μια στιγμή όταν στήνεται.
levels.traps.toxictrap.desc=Η ενεργοποίηση αυτής της παγίδας θα απελευθερώσει ένα νέφος τοξικού αερίου στην γύρω περιοχή.
levels.traps.toxictrap.name=παγίδα τοξικού αερίου
levels.traps.trap.discover_hint=Μπορείτε να βρείτε αυτήν την παγίδα τυχαία στο μπουντρούμι. Κάθε περιοχή έχει διαφορετικές παγίδες που μπορεί να εμφανιστούν.
levels.traps.trap.rankings_desc=Σκοτώθηκε από: %s
levels.traps.warpingtrap.desc=Αυτή η παγίδα είναι παρόμοια με μια παγίδα τηλεμεταφοράς, αλλά θα κάνει επίσης τον ήρωα να χάσει τη γνώση του για τη διάταξη του πατώματος!
levels.traps.warpingtrap.name=παγίδα στρέβλωσης
levels.traps.weakeningtrap.desc=Η σκοτεινή μαγεία σε αυτήν την παγίδα απορροφά την ενέργεια από οτιδήποτε έρχεται σε επαφή με αυτήν. Ωστόσο, ισχυροί εχθροί μπορεί να αντισταθούν στο αποτέλεσμα.
levels.traps.weakeningtrap.name=παγίδα αποδυνάμωσης
levels.traps.worndarttrap.desc=Ένα μικρό φυσητήρα βελών πρέπει να είναι κρυμμένο κοντά, η ενεργοποίηση αυτής της παγίδας θα την αναγκάσει να πυροβολήσει στον πλησιέστερο στόχο. \n\nΛόγω της ηλικίας του δεν είναι πολύ επιβλαβές, δεν είναι καν κρυμμένο...
levels.traps.worndarttrap.name=φθαρμένη παγίδα βελών
levels.traps.worndarttrap.ondeath=Σκοτώθηκες από την φθαρμένη παγίδα με βελάκια...
levels.vaultlevel$vaultflametrap.desc=Αυτή η οπή εξαερισμού φαίνεται να βγάζει πράσινες φλόγες σε καθορισμένα χρονικά διαστήματα. _Καθώς πρόκειται απλώς για μια περιοχή δοκιμών, οι φλόγες από τις οπές εξαερισμού δεν θα σας βλάψουν στην πραγματικότητα._
levels.vaultlevel$vaultflametrap.name=εξαερισμός φλόγας θόλου

levels.level.sign_desc=Δεν μπορείτε να διαβάσετε το κείμενο από εδώ.
levels.level.sign_name=Σημείο
