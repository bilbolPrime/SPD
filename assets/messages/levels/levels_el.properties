levels.level.closed_door_name=Κλειστή πόρτα
levels.level.crystal_door_desc=Αυτή η κλειδωμένη πόρτα είναι φτιαγμένη από μαγικό κρύσταλλο. Μπορείτε να δείτε μέσα, αλλά θα χρειαστείτε ένα κρυστάλλινο κλειδί για να την ανοίξετε.
