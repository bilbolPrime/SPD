levels.level.open_door_name=Άνοιγμα πόρτας
levels.level.pedestal_name=Βάθρο
levels.level.statue_desc=Κάποιος ήθελε να στολίσει αυτό το μέρος, αλλά απέτυχε, προφανώς.
