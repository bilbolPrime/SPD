levels.cavesbosslevel.energy_desc=Το έδαφος εδώ βγάζει σπινθήρες από ηλεκτρισμό και είναι επιβλαβές να το πατήσεις. _Οι σπινθήρες φαίνεται να έλκονται προς μια συγκεκριμένη κατεύθυνση..._ ίσως οδηγούν στην πηγή ενέργειας;
levels.cavesbosslevel.gate_desc=Μια μεγάλη μεταλλική πύλη που μπλοκάρει το μονοπάτι προς την μητρόπολη των νάνων. Το μεταλλικό κουτί στο κέντρο παράγει έναν δυνατό βουητό, πρέπει να είναι συνδεδεμένο με τα κυκλώματα και τις μηχανές που βρίσκονται κοντά. Ίσως η καταστροφή του DM-300 να ανοίξει την πύλη;
levels.cavesbosslevel.gate_desc_broken=Η πύλη πρέπει να ήταν συνδεδεμένη με το DM-300 με κάποιο τρόπο, καθώς εξερράγη όταν το DM-300 ηττήθηκε. Τώρα έχουν απομείνει μόνο σπασμένα κομμάτια.
levels.cavesbosslevel.gate_name=Μεταλλική πύλη
levels.cavesbosslevel.water_desc=Με όλο αυτό το ηλεκτρικό ρεύμα τριγύρω, το νερό μπορεί να μην είναι πάντα ασφαλές...
levels.cavesbosslevel.wires_desc=Το έδαφος είναι μερικώς σκαμμένο εδώ, αποκαλύπτοντας μερικά μεγάλα εκτεθειμένα καλώδια. Πρέπει να συνδέουν τις διάφορες ηλεκτρικές μηχανές μεταξύ τους. \n\nΤα καλώδια πρέπει να έχουν κάποιο ρεύμα που να τα διαπερνά. Αν το DM-300 περάσει εδώ, ίσως να μπορεί να αντλήσει ρεύμα από αυτά.
levels.cavesbosslevel.wires_name=Εκτεθειμένη καλωδίωση
levels.caveslevel.bookshelf_desc=Ποιος θα χρειαζόταν μια βιβλιοθήκη σε μια σπηλιά;
levels.caveslevel.entrance_desc=Η σκάλα οδηγεί στο ανώτερο βάθος.
levels.caveslevel.exit_desc=Η σκάλα οδηγεί στο χαμηλότερο βάθος.
levels.caveslevel.grass_name=Φθορίζουσα βρύα
levels.caveslevel.high_grass_desc=Τεράστια μανιτάρια εμποδίζουν τη θέα.
levels.caveslevel.high_grass_name=Φθορίζοντα μανιτάρια
levels.caveslevel.region_deco_desc=Μια μεγάλη, εξ ολοκλήρου μεταλλική κατασκευή, πιθανώς χτισμένη από τους νάνους όταν έκαναν εξόρυξη σε αυτό το μέρος. Νομίζεις ότι μπορείς να δεις αχρησιμοποίητες ερπύστριες από ναρκοκάρρα να τρέχουν κατά μήκος της κορυφής.
levels.caveslevel.region_deco_name=Μεταλλική δομή
levels.caveslevel.wall_deco_desc=Μια φλέβα από κάποιο μετάλλευμα είναι ορατή στον τοίχο. Χρυσός;
levels.caveslevel.water_name=Παγωμένο νερό
levels.citybosslevel.summoning_desc=Αυτό το βάθρο έχει ένα μεγάλο άνοιγμα στο κέντρο, το οποίο ουσιαστικά ακτινοβολεί με σκοτεινή ενέργεια.\n\nΟ Βασιλιάς Νάνος χρησιμοποιεί αυτά τα βάθρα ως σημεία εστίασης για τη νεκρομαντική του μαγεία και μπορεί να καλέσει υπηρέτες σε αυτά. Το βάθρο πρέπει να εφορμήσει για μερικούς γύρους πριν εμφανιστεί ο υπηρέτης και ο τύπος του υπηρέτη που καλείται τηλεγραφείται από τη μαγική δύναμη του κτιρίου.
levels.citybosslevel.summoning_name=Επίκληση βάθρου
levels.citybosslevel.throne_desc=Αυτός ο εντυπωσιακά μεγάλος θρόνος είναι η έδρα της αυτοκρατορίας των νάνων, την οποία τώρα καταλαμβάνει ένας τρελός για τη δύναμη νεκρομάντης. \n\n Φαίνεται ότι υπάρχουν κάποια μαγικά ή μηχανικά μέρη στον θρόνο. Ο Βασιλιάς Νάνος μπορεί να έχει επιπλέον δύναμη όταν κάθεται σε αυτόν.
levels.citybosslevel.throne_name=Θρόνος
levels.citylevel.bookshelf_desc=Οι σειρές από βιβλία για διαφορετικούς κλάδους γεμίζουν τη βιβλιοθήκη.
levels.citylevel.deco_desc=Λείπουν αρκετά πλακάκια εδώ.
levels.citylevel.entrance_desc=Μια ράμπα οδηγεί στο ανώτερο βάθος.
levels.citylevel.exit_desc=Μια ράμπα οδηγεί προς τα κάτω στο χαμηλότερο βάθος.
levels.citylevel.high_grass_name=Λουλούδια με υψηλή ανθοφορία
levels.citylevel.region_deco_desc=Ένα υπερυψωμένο βάθρο με μια φωτεινή πράσινη μαγική φλόγα στην κορυφή. Η φλόγα είναι τόσο πυκνή που θα μπορούσε κάλλιστα να είναι συμπαγής.
levels.citylevel.region_deco_name=Φλεγόμενο βάθρο
levels.citylevel.sp_desc=Χοντρό χαλί καλύπτει το πάτωμα.
levels.citylevel.statue_desc=Το άγαλμα απεικονίζει κάποιον νάνο να στέκεται σε ηρωική στάση.
levels.citylevel.upcoming_quest_intro_no=Μείνε εδώ
