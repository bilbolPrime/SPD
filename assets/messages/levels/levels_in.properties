levels.cavesbosslevel.energy_desc=Tanah di sini mengeluarkan percikan listrik, dan berbahaya jika diinjak. Percikan api itu sepertinya tertarik ke arah tertentu... mungkin mengarah ke sumber listrik?
levels.cavesbosslevel.gate_desc=Sebuah gerbang logam besar yang menghalangi jalan menuju kota kurcaci. Kotak logam di tengahnya mengeluarkan suara dengung yang keras, pasti terhubung ke sirkuit dan mesin di dekatnya. Mungkin menghancurkan DM-300 akan membuka gerbang itu?
levels.cavesbosslevel.gate_desc_broken=Gerbang itu pasti terhubung dengan DM-300 dengan cara tertentu, karena gerbang itu meledak ketika DM-300 dikalahkan. Sekarang hanya tersisa puing-puingnya.
levels.cavesbosslevel.gate_name=Gerbang logam
levels.cavesbosslevel.water_desc=Dengan banyaknya listrik di sekitar sini, air mungkin tidak selalu aman...
levels.cavesbosslevel.wires_desc=Tanah di sini sebagian digali, memperlihatkan beberapa kabel besar yang terbuka. Kabel-kabel ini pasti menghubungkan berbagai mesin listrik. Kabel-kabel tersebut pasti dialiri arus listrik. Jika DM-300 melangkah ke sini, ia mungkin dapat mengambil daya dari kabel-kabel tersebut.
levels.cavesbosslevel.wires_name=Kabel terbuka
levels.caveslevel.bookshelf_desc=Siapa yang butuh rak buku di dalam gua?
levels.caveslevel.entrance_desc=Tangga tersebut mengarah ke bagian atas.
levels.caveslevel.exit_desc=Tangga tersebut mengarah ke kedalaman yang lebih rendah.
levels.caveslevel.grass_name=Lumut berpendar
levels.caveslevel.high_grass_desc=Jamur-jamur raksasa menghalangi pemandangan.
levels.caveslevel.high_grass_name=Jamur berpendar
levels.caveslevel.region_deco_desc=Sebuah struktur besar yang seluruhnya terbuat dari logam, kemungkinan dibangun oleh para kurcaci ketika mereka dulu menambang di tempat ini. Anda pikir Anda bisa melihat jalur kereta tambang yang sudah lama tidak digunakan terbentang di sepanjang bagian atasnya.
levels.caveslevel.region_deco_name=Struktur logam
levels.caveslevel.wall_deco_desc=Terlihat urat bijih di dinding. Emas?
levels.caveslevel.water_name=Air yang sangat dingin
levels.citybosslevel.summoning_desc=Alas ini memiliki lubang besar di tengahnya, yang praktis memancarkan energi gelap. Raja Kurcaci menggunakan alas ini sebagai titik fokus untuk sihir nekromansinya, dan dapat memanggil antek-antek ke sana. Alas tersebut harus diisi daya selama beberapa giliran sebelum antek muncul, dan jenis antek yang dipanggil ditunjukkan oleh kekuatan sihir bangunan tersebut.
levels.citybosslevel.summoning_name=Alas pemanggilan
levels.citybosslevel.throne_desc=Singgasana yang sangat besar ini adalah pusat kekuasaan kekaisaran kurcaci, yang kini dikuasai oleh seorang ahli sihir necromancer yang haus kekuasaan. Tampaknya singgasana ini memiliki beberapa bagian magis atau mekanis, Raja Kurcaci mungkin memiliki kekuatan tambahan saat duduk di atasnya.
levels.citybosslevel.throne_name=Takhta
levels.citylevel.bookshelf_desc=Deretan buku tentang berbagai disiplin ilmu memenuhi rak buku.
levels.citylevel.deco_desc=Beberapa ubin hilang di sini.
levels.citylevel.entrance_desc=Sebuah jalan landai mengarah ke bagian atas.
levels.citylevel.exit_desc=Sebuah jalan landai mengarah ke kedalaman yang lebih rendah.
levels.citylevel.high_grass_name=Bunga-bunga yang mekar tinggi
levels.citylevel.region_deco_desc=Sebuah alas yang ditinggikan dengan nyala api magis berwarna hijau terang di atasnya. Nyala api itu begitu padat sehingga hampir seperti benda padat.
levels.citylevel.region_deco_name=Alas yang menyala
levels.citylevel.sp_desc=Karpet tebal menutupi lantai.
levels.citylevel.statue_desc=Patung itu menggambarkan seorang kurcaci yang berdiri dalam posisi heroik.
levels.citylevel.upcoming_quest_intro_no=Tetaplah di sini
levels.citylevel.upcoming_quest_intro_title=Pesan Pengembang
levels.citylevel.upcoming_quest_intro_yes=Turunlah ke dalam brankas
levels.citylevel.water_name=Air dengan warna yang mencurigakan
levels.features.chasm.chasm=Jurang
levels.features.chasm.jump=Apakah kamu benar-benar ingin melompat ke jurang? Jatuh dari ketinggian seperti itu akan sangat menyakitkan.
levels.features.chasm.no=Tidak, saya berubah pikiran.
levels.features.chasm.ondeath=Kamu jatuh hingga tewas...
levels.features.chasm.rankings_desc=Meninggal seketika akibat benturan.
levels.features.chasm.yes=Ya, saya tahu apa yang saya lakukan.
levels.hallslevel.bookshelf_desc=Buku-buku dalam bahasa kuno membara di rak buku.
levels.hallslevel.grass_name=Lumut bara
levels.hallslevel.high_grass_name=Jamur bara
levels.hallslevel.region_deco_desc=Sebongkah batu besar yang tampaknya terlepas dari langit-langit atau dinding di dekatnya.
levels.hallslevel.region_deco_name=Bongkahan puing
levels.hallslevel.statue_desc=Pilar itu terbuat dari tengkorak manusia asli. Luar biasa.
levels.hallslevel.statue_name=Pilar
levels.hallslevel.water_desc=Sekilas tampak seperti lava, tetapi dingin dan mungkin aman untuk disentuh.
levels.hallslevel.water_name=Lava dingin
levels.level$feeling.chasm_desc=Langkah kakimu bergema di seluruh penjara bawah tanah.
levels.level$feeling.chasm_title=dasar jurang
levels.level$feeling.dark_desc=Anda dapat mendengar musuh bergerak dalam kegelapan.
levels.level$feeling.dark_title=lantai gelap
levels.level$feeling.grass_desc=Aroma tumbuh-tumbuhan sangat pekat di udara.
levels.level$feeling.grass_title=lantai rumput
levels.level$feeling.large_desc=Lantai penjara bawah tanah ini tampak luar biasa luas.
levels.level$feeling.large_title=lantai besar
levels.level$feeling.secrets_desc=Suasana di lantai ini mengisyaratkan bahwa lantai ini menyimpan banyak rahasia.
levels.level$feeling.secrets_title=lantai rahasia
levels.level$feeling.traps_desc=Medan di sini tampaknya sangat berbahaya.
levels.level$feeling.traps_title=perangkap lantai
levels.level$feeling.water_desc=Anda mendengar suara air berhamburan di sekitar Anda.
levels.level$feeling.water_title=dasar air
levels.level.alchemy_desc=Guci ini berisi air ajaib. Berbagai benda dapat dicampurkan ke dalam guci untuk menciptakan sesuatu yang baru!
levels.level.alchemy_name=panci alkimia
levels.level.barricade_desc=Penghalang kayu itu terpasang kokoh tetapi telah mengering selama bertahun-tahun. Mungkinkah itu terbakar?
levels.level.barricade_name=Barikade
levels.level.bookshelf_name=Rak buku
levels.level.chasm_desc=Anda tidak bisa melihat bagian bawahnya.
levels.level.chasm_name=Jurang
levels.level.closed_door_name=Pintu tertutup
levels.level.crystal_door_desc=Pintu terkunci ini terbuat dari kristal ajaib. Anda bisa melihat menembusnya, tetapi Anda membutuhkan kunci kristal untuk membukanya.
levels.level.crystal_door_name=Pintu kristal
levels.level.default_name=???
levels.level.embers_desc=Bara api menutupi lantai.
levels.level.embers_name=Bara api
levels.level.empty_well_desc=Sumur itu sudah kering.
levels.level.empty_well_name=Sumur kosong
levels.level.entrace_name=Pintu masuk kedalaman
levels.level.entrance_desc=Tangga mengarah ke bagian atas.
levels.level.exit_desc=Tangga mengarah ke bagian bawah.
levels.level.exit_name=Keluar kedalaman
levels.level.floor_name=Lantai
levels.level.furrowed_grass_name=Vegetasi berlekuk
levels.level.grass_name=Rumput
levels.level.hidden_trap=%s tersembunyi aktif!
levels.level.high_grass_desc=Vegetasi lebat menghalangi pandangan.
levels.level.high_grass_name=Rumput tinggi
levels.level.inactive_trap_desc=Jebakan itu sudah pernah terpicu sebelumnya dan sudah tidak berbahaya lagi.
levels.level.inactive_trap_name=Perangkap terpicu
levels.level.locked_door_desc=Pintu ini terkunci, Anda memerlukan kunci yang cocok untuk membukanya.
levels.level.locked_door_name=Pintu terkunci
levels.level.locked_exit_desc=Batang besi berat menghalangi tangga yang menuju ke bawah.
levels.level.locked_exit_name=Pintu keluar kedalaman terkunci
levels.level.open_door_name=Buka pintu
levels.level.pedestal_name=Alas
levels.level.statue_desc=Seseorang ingin memperindah tempat ini, tetapi gagal, jelas sekali.
levels.level.statue_name=Patung
levels.level.unlocked_exit_name=Pintu keluar kedalaman tidak terkunci
levels.level.wall_name=Dinding
levels.level.water_desc=Jika terjadi kebakaran, masuklah ke dalam air untuk memadamkan api.
levels.level.water_name=Air
levels.level.well_name=Dengan baik
levels.mininglevel.barricade_desc=Barikade kayu ini terpasang kokoh dan berfungsi sebagai penyangga langit-langit. Ini mungkin dibangun oleh para gnoll untuk memberikan perlindungan terhadap jatuhnya batu. Sel-sel yang berdekatan akan terlindungi dari jebakan dan serangan batu. Tampaknya barikade ini akan terbakar sama baiknya dengan barikade lainnya.
levels.mininglevel.boulder_desc=Ada sebuah batu besar yang menghalangi jalan. Seharusnya cukup mudah untuk menghancurkannya dengan beliung.
levels.mininglevel.boulder_name=Batu besar
levels.mininglevel.crystal_desc=Di sini terdapat singkapan kristal yang besar dan berwarna-warni. Kristal-kristal ini rapuh dan mudah pecah jika digali dengan beliung, atau akan pecah jika ada sesuatu yang ditambang di dekatnya.
levels.mininglevel.crystal_name=Duri kristal
levels.mininglevel.gold_extra_desc=Anda mungkin bisa menambangnya dengan beliung Anda.
levels.mininglevel.wall_desc=Dinding batu halus yang sedikit lebih lunak dari biasanya. Anda dapat menambang menembusnya dengan beliung Anda, tetapi akan membutuhkan sedikit usaha dan meningkatkan rasa lapar Anda.
levels.prisonlevel.bookshelf_desc=Ini mungkin sisa-sisa perpustakaan penjara. Mungkinkah ini terbakar?
levels.prisonlevel.empty_deco_desc=Terdapat noda darah lama di lantai.
levels.prisonlevel.region_deco_alt_desc=Sebuah sangkar logam yang ukurannya hanya cukup untuk menampung seseorang. Sangkar itu tergantung di atas jurang yang dalam, ditopang oleh sebuah rantai.
levels.prisonlevel.region_deco_alt_name=Sangkar gantung
levels.prisonlevel.region_deco_desc=Sebuah sangkar logam yang ukurannya hanya cukup untuk menampung seseorang. Tampaknya sangkar itu terkunci ke tanah dengan cara tertentu, Anda tidak bisa menggerakkannya.
levels.prisonlevel.region_deco_name=Kandang penjara
levels.prisonlevel.water_name=Air dingin gelap
levels.rooms.quest.ambitiousimproom$questentrance.desc=Lubang mengerikan ini tampaknya merupakan pintu masuk ke semacam ruang bawah tanah kurcaci kuno. Sebuah penghalang magis mencegah masuk, Anda dapat berjalan di atasnya seolah-olah ada lantai di sini.
levels.rooms.quest.ambitiousimproom$questentrance.name=Pintu Masuk Brankas
levels.rooms.quest.blacksmithroom$questentrance.desc=Tangga ini mengarah ke tambang tua yang terletak tepat di bawah bengkel pandai besi.
levels.rooms.quest.blacksmithroom$questentrance.name=Pintu masuk tambang
levels.rooms.quest.massgraveroom$bones.desc=Tulang-tulang berserakan di lantai, apa yang terjadi di sini?
levels.rooms.quest.massgraveroom$bones.name=Kuburan massal
levels.rooms.quest.mineentrance$questexit.desc=Tangga ini mengarah keluar dari tambang, kembali ke bengkel pandai besi.
levels.rooms.quest.mineentrance$questexit.name=Pintu keluar tambang
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Sebuah penanda yang dicat untuk ritual gelap tertentu. Lilin biasanya diletakkan di keempat sudutnya.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Penanda ritual
levels.rooms.special.magicalfireroom$eternalfire.desc=Di sini terdapat dinding api hijau terang yang pekat, tampaknya disebabkan oleh sihir. Api ini sangat pekat sehingga Anda tidak dapat bergerak melewatinya, dan akan membakar apa pun yang terlalu dekat. Api ini tidak menunjukkan tanda-tanda akan padam secara alami, Anda perlu menggunakan sesuatu untuk memadamkannya.
levels.rooms.special.sentryroom$sentry.desc=Penjaga berwarna merah darah ini tampaknya ditempatkan di sini untuk menjaga harta karun di ujung ruangan ini. Ia akan menembakkan sinar sihir disintegrasi ke arahmu jika kamu melangkah ke area yang dijaganya.\n\nIa kebal terhadap semua efek berbahaya dan dapat melihat menembus tembus pandang, tetapi tampaknya membutuhkan waktu untuk mengisi daya sebelum mulai menembak.\n\nEntah bagaimana penjaga itu hanya ingin menembakmu, seolah-olah ia tahu bahwa penghuni penjara bawah tanah bukanlah ancaman bagi harta karun tersebut.
levels.rooms.special.sentryroom$sentry.discover_hint=Anda dapat menemukan musuh ini di mana saja di dalam ruang bawah tanah.
levels.rooms.special.sentryroom$sentry.name=penjaga merah
levels.rooms.special.toxicgasroom$toxicvent.desc=Seorang petualang yang ceroboh pasti telah memicu jebakan ini sejak lama. Meskipun tidak aktif, jebakan ini masih menyemburkan gas beracun ke dalam ruangan dan tidak menunjukkan tanda-tanda akan berhenti. Anda perlu cara untuk mencegah kerusakan akibat gas tersebut jika ingin menjelajahi ruangan ini.
levels.rooms.special.toxicgasroom$toxicvent.name=lubang ventilasi beracun
levels.rooms.special.weakfloorroom$hiddenwell.desc=Anda bisa melihat samar-samar sebuah sumur di kedalaman di bawah sana, mungkin ada sesuatu di sana?
levels.rooms.special.weakfloorroom$hiddenwell.name=sumur yang jauh
levels.sewerlevel.bookshelf_desc=Rak buku itu penuh dengan buku-buku murah yang tidak berguna. Mungkinkah rak buku itu terbakar?
levels.sewerlevel.empty_deco_desc=Lumut kekuningan yang basah menutupi lantai.
levels.sewerlevel.region_deco_desc=Sebuah tong kokoh yang hampir sebesar tubuhmu. Pasti berisi sesuatu, karena terlalu berat untuk dipindahkan.
levels.sewerlevel.region_deco_name=Tong penyimpanan
levels.sewerlevel.water_name=Air keruh
levels.traps.alarmtrap.alarm=Jebakan itu mengeluarkan suara melengking yang menggema di seluruh ruang bawah tanah!
levels.traps.alarmtrap.desc=Jebakan ini tampaknya terhubung dengan mekanisme alarm yang keras. Memicunya kemungkinan akan memperingatkan semua yang ada di lantai tersebut.
levels.traps.alarmtrap.name=jebakan alarm
levels.traps.blazingtrap.desc=Menginjak jebakan ini akan memicu campuran bahan kimia yang kuat, membakar area yang luas.
levels.traps.blazingtrap.name=jebakan menyala
levels.traps.burningtrap.desc=Menginjak jebakan ini akan menyulut campuran bahan kimia, sehingga area sekitarnya terbakar.
levels.traps.burningtrap.name=jebakan yang terbakar
levels.traps.chillingtrap.desc=Saat diaktifkan, bahan kimia dalam perangkap ini akan dengan cepat membekukan udara di sekitarnya.
levels.traps.chillingtrap.name=jebakan mengerikan
levels.traps.confusiontrap.desc=Mengaktifkan jebakan ini akan melepaskan awan gas yang menimbulkan kebingungan di area sekitarnya.
levels.traps.confusiontrap.name=kebingungan jebakan gas
levels.traps.corrosiontrap.desc=Memicu jebakan ini akan melepaskan awan gas asam mematikan di area sekitarnya.
levels.traps.corrosiontrap.name=perangkap gas korosif
levels.traps.cursingtrap.curse=Peralatanmu yang sudah usang akan terkutuk!
levels.traps.cursingtrap.desc=Jebakan ini mengandung sihir jahat yang sama seperti yang ditemukan pada peralatan terkutuk. Memicunya akan mengutuk beberapa barang di area sekitarnya.
levels.traps.cursingtrap.name=jebakan kutukan
levels.traps.disarmingtrap.desc=Jebakan ini berisi sihir teleportasi yang sangat spesifik, yang akan memindahkan senjata korbannya ke lokasi lain.
levels.traps.disarmingtrap.disarm=Senjatamu telah diteleportasi!
levels.traps.disarmingtrap.name=jebakan yang melumpuhkan
levels.traps.disintegrationtrap.desc=Saat diaktifkan, jebakan ini akan menusuk target terdekat dengan pancaran disintegrasi, menyebabkan kerusakan signifikan dan menghancurkan barang-barang. Untungnya, mekanisme pemicunya tidak tersembunyi.
levels.traps.disintegrationtrap.name=perangkap disintegrasi
levels.traps.disintegrationtrap.ondeath=Kamu terbunuh oleh jebakan disintegrasi...
levels.traps.disintegrationtrap.one=Perangkap ini akan menghancurkan %s Anda!
levels.traps.disintegrationtrap.some=Perangkap ini akan menghancurkan sebagian dari %s Anda!
levels.traps.distortiontrap.desc=Dibuat dari sihir aneh yang tidak diketahui asalnya, jebakan ini akan memanggil berbagai macam makhluk ke lokasi ini.
levels.traps.distortiontrap.name=jebakan distorsi
levels.traps.explosivetrap.desc=Perangkap ini berisi bubuk peledak dan mekanisme pemicu. Mengaktifkannya akan menyebabkan ledakan di area sekitarnya.
levels.traps.explosivetrap.name=jebakan peledak
levels.traps.flashingtrap.desc=Saat diaktifkan, jebakan ini akan menyalakan bubuk kilat yang kuat yang tersimpan di dalamnya, yang untuk sementara membutakan, melumpuhkan, dan melukai korbannya. Jebakan ini harus memiliki persediaan bubuk yang besar, karena dapat diaktifkan berkali-kali tanpa rusak.
levels.traps.flashingtrap.name=jebakan berkedip
levels.traps.flocktrap.desc=Mungkin ini hanya lelucon dari seorang penyihir amatir, yang memicu jebakan ini akan menciptakan sekumpulan domba ajaib.
levels.traps.flocktrap.name=perangkap kawanan
levels.traps.frosttrap.desc=Saat diaktifkan, bahan kimia dalam perangkap ini akan dengan cepat membekukan udara dalam radius yang luas di sekitar lokasinya.
levels.traps.frosttrap.name=perangkap embun beku
levels.traps.gatewaytrap.desc=Jebakan teleportasi khusus ini dapat aktif berkali-kali tanpa batas dan selalu memindahkan Anda ke lokasi yang sama.
levels.traps.gatewaytrap.name=jebakan gerbang
levels.traps.geysertrap.desc=Saat diaktifkan, jebakan ini akan menyebabkan semburan air menyembur keluar, melukai musuh yang berapi-api, menjauhkan semua karakter di dekatnya, memadamkan api, dan mengubah medan di sekitarnya menjadi air.
levels.traps.geysertrap.name=jebakan geyser
levels.traps.gnollrockfalltrap.desc=Perangkap longsor batu ini dibuat dengan bantuan sihir. Saat dipicu, perangkap ini akan menyebabkan bebatuan terlepas dan langsung jatuh dari atas dalam area 5x5 di sekitarnya. Karena bebatuan di area tersebut lebih lunak, perangkap ini tidak akan menimbulkan kerusakan sebanyak perangkap longsor batu biasa, tetapi baju besi Anda juga tidak akan efektif melawannya. Bebatuan juga tidak akan jatuh di lokasi yang berdekatan dengan barikade, karena barikade tersebut membantu menahan langit-langit. Perangkap ini tidak dapat membedakan teman dari musuh, sehingga sama berbahayanya bagi gnoll maupun Anda.
levels.traps.gnollrockfalltrap.name=jebakan longsoran batu gnoll
levels.traps.grimtrap.desc=Sihir penghancur yang sangat kuat tersimpan di dalam jebakan ini, cukup untuk membunuh seketika semua kecuali pahlawan yang paling sehat. Memicunya akan mengirimkan ledakan sihir mematikan jarak jauh ke arah karakter terdekat. Untungnya, mekanisme pemicunya tidak tersembunyi.
levels.traps.grimtrap.name=jebakan mengerikan
levels.traps.grimtrap.ondeath=Kau tewas akibat ledakan jebakan mengerikan...
levels.traps.grippingtrap.desc=Perangkap ini menempel pada kaki siapa pun yang memicunya, melukai mereka dan memperlambat gerakan mereka. Karena sifatnya yang sederhana, perangkap ini dapat aktif berkali-kali tanpa rusak.
levels.traps.grippingtrap.name=jebakan yang mencengkeram
levels.traps.guardiantrap$guardian.desc=Penampakan biru ini tampaknya merupakan gema yang dipanggil dari salah satu penjaga batu di ruang bawah tanah tersebut.
levels.traps.guardiantrap$guardian.desc_weapon=Meskipun patung itu sendiri hampir tidak berwujud, _%s_ yang dipegangnya tampak nyata.
levels.traps.guardiantrap$guardian.discover_hint=Anda dapat menemukan musuh ini dengan jebakan khusus.
levels.traps.guardiantrap$guardian.name=penjaga yang dipanggil
levels.traps.guardiantrap.alarm=Jebakan itu mengeluarkan suara melengking yang menggema di seluruh ruang bawah tanah!
levels.traps.guardiantrap.desc=Jebakan ini terhubung dengan mekanisme magis yang aneh, yang akan memanggil penjaga dan memperingatkan semua musuh di lantai tersebut.
levels.traps.guardiantrap.name=jebakan penjaga
levels.traps.oozetrap.desc=Perangkap ini akan menyemburkan cairan korosif saat diaktifkan, yang akan terasa panas hingga tercuci bersih.
levels.traps.oozetrap.name=perangkap lendir
levels.traps.pitfalltrap.desc=Perangkap ini terhubung ke mekanisme pintu jebakan besar, dan tak lama setelah diaktifkan, apa pun yang berada di dekatnya akan tergelincir menembus tanah dan jatuh! Namun, perangkap ini tidak akan berfungsi di area dengan lantai yang sangat padat.
levels.traps.pitfalltrap.name=jebakan lubang
levels.traps.pitfalltrap.no_pit=Tanahnya terlalu padat sehingga jebakan lubang tidak akan berfungsi di sini.
levels.traps.pitfalltrap.triggered=Tanah mulai ambles di sekitar jebakan yang sudah terpasang!
levels.traps.pitfalltrap.triggered_hero=Tanah di sekitarmu mulai ambruk!
levels.traps.poisondarttrap.desc=Sebuah alat pelontar anak panah kecil harus disembunyikan di dekatnya; mengaktifkan jebakan ini akan menyebabkan alat tersebut menembakkan anak panah beracun ke target terdekat. Untungnya, mekanisme pemicunya tidak tersembunyi.
levels.traps.poisondarttrap.name=jebakan panah beracun
levels.traps.poisondarttrap.ondeath=Kamu terbunuh oleh jebakan panah beracun...
levels.traps.rockfalltrap.desc=Perangkap ini terhubung ke serangkaian batu lepas di atas, memicunya akan menyebabkan batu-batu tersebut berjatuhan dan menimpa seluruh ruangan! Jika perangkap tidak berada di ruangan tertentu, batu-batu akan jatuh di area sekitar perangkap. Untungnya, mekanisme pemicunya tidak tersembunyi.
levels.traps.rockfalltrap.name=jebakan longsoran batu
levels.traps.rockfalltrap.ondeath=Kamu tertimpa jebakan longsoran batu...
levels.traps.shockingtrap.desc=Suatu mekanisme yang menyimpan sejumlah besar energi di dalamnya. Memicu perangkap ini akan melepaskan energi tersebut ke medan di sekitarnya.
levels.traps.shockingtrap.name=jebakan yang mengejutkan
levels.traps.stormtrap.desc=Sebuah mekanisme yang menyimpan sejumlah besar energi di dalamnya. Memicu jebakan ini akan melepaskan energi tersebut menjadi badai listrik yang besar.
levels.traps.stormtrap.name=jebakan badai
levels.traps.summoningtrap.desc=Mengaktifkan jebakan ini akan memanggil sejumlah monster dari area ini ke lokasi ini.
levels.traps.summoningtrap.name=jebakan pemanggilan
levels.traps.teleportationtrap.desc=Setiap kali jebakan ini terpicu, semua yang ada di sekitarnya akan diteleportasi ke lokasi acak di lantai ini.
levels.traps.teleportationtrap.name=jebakan teleportasi
levels.traps.tengudarttrap.desc=Tengu jelas telah bersiap untuk bertarung. Jebakan ini akan mengaktifkan alat pelontar panah tersembunyi yang akan menembakkan panah beracun ke benda terdekat yang bukan Tengu. Jebakan ini dibuat dengan sangat baik sehingga mekanisme pemicunya tidak mungkin dideteksi tanpa bantuan sihir. Namun, jebakan tersebut terlihat sesaat ketika sedang dipasang.
levels.traps.toxictrap.desc=Mengaktifkan jebakan ini akan melepaskan awan gas beracun ke area sekitarnya.
levels.traps.toxictrap.name=perangkap gas beracun
levels.traps.trap.discover_hint=Anda dapat menemukan jebakan ini secara acak di dalam ruang bawah tanah. Setiap wilayah memiliki jebakan berbeda yang mungkin muncul.
levels.traps.trap.rankings_desc=Dibunuh oleh: %s
levels.traps.warpingtrap.desc=Jebakan ini mirip dengan jebakan teleportasi, tetapi juga akan menyebabkan sang pahlawan kehilangan pengetahuannya tentang tata letak lantai!
levels.traps.warpingtrap.name=jebakan distorsi
levels.traps.weakeningtrap.desc=Sihir hitam dalam jebakan ini menyedot energi dari apa pun yang bersentuhan dengannya. Namun, musuh yang kuat mungkin dapat menahan efek tersebut.
levels.traps.weakeningtrap.name=jebakan pelemahan
levels.traps.worndarttrap.desc=Sebuah alat pelontar anak panah kecil harus disembunyikan di dekatnya; mengaktifkan jebakan ini akan menyebabkannya menembak target terdekat. Karena usianya, alat ini tidak terlalu berbahaya, bahkan tidak disembunyikan...
levels.traps.worndarttrap.name=perangkap anak panah usang
levels.traps.worndarttrap.ondeath=Kau terbunuh oleh jebakan panah yang sudah usang...
levels.vaultlevel$vaultflametrap.desc=Ventilasi ini tampaknya mengeluarkan api hijau secara berkala. Karena ini hanya area uji coba, api dari ventilasi tersebut sebenarnya tidak akan membahayakan Anda.
levels.vaultlevel$vaultflametrap.name=lubang ventilasi api kubah

levels.level.sign_desc=Anda tidak bisa membaca teks dari sini.
levels.level.sign_name=Tanda
