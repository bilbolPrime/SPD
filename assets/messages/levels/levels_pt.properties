levels.cavesbosslevel.energy_desc=O chão aqui está a faiscar com eletricidade e é perigoso pisar. _As faíscas parecem estar a gravitar numa determinada direção..._ talvez levem à fonte de energia?
levels.cavesbosslevel.gate_desc=Um grande portão de metal bloqueia a entrada para a metrópole anã. A caixa de metal no centro emite um zumbido alto; deve estar ligada aos circuitos e máquinas próximos. Talvez destruir o DM-300 abra o portão?
levels.cavesbosslevel.gate_desc_broken=O portal devia estar ligado ao DM-300 de alguma forma, pois explodiu quando o DM-300 foi derrotado. Agora só restam fragmentos.
levels.cavesbosslevel.gate_name=Portão de metal
levels.cavesbosslevel.water_desc=Com toda a eletricidade por aqui, a água pode nem sempre ser segura...
levels.cavesbosslevel.wires_desc=O solo está aqui parcialmente escavado, mostrando alguns fios grossos expostos. Devem estar a ligar as diversas máquinas elétricas. Os fios devem estar a conduzir corrente elétrica. Se o DM-300 pisar aqui, poderá obter energia deles.
levels.cavesbosslevel.wires_name=Fiação exposta
levels.caveslevel.bookshelf_desc=Quem precisaria de uma estante de livros numa caverna?
levels.caveslevel.entrance_desc=A escada conduz à parte superior da estrutura.
levels.caveslevel.exit_desc=A escada leva à parte mais profunda.
levels.caveslevel.grass_name=Musgo fluorescente
levels.caveslevel.high_grass_desc=Cogumelos enormes bloqueiam a vista.
levels.caveslevel.high_grass_name=Cogumelos fluorescentes
levels.caveslevel.region_deco_desc=Uma grande estrutura totalmente metálica, provavelmente construída pelos anões quando exploravam este local. Pensa que consegue ver carris de vagonetes de mina, há muito abandonados, a percorrer o topo.
levels.caveslevel.region_deco_name=Estrutura metálica
levels.caveslevel.wall_deco_desc=É possível ver uma veia de minério na parede. Ouro?
levels.caveslevel.water_name=Água gelada
levels.citybosslevel.summoning_desc=Este pedestal possui uma grande abertura no centro, que praticamente irradia energia sombria. O Rei Anão usa estes pedestais como pontos focais para a sua magia necromântica e pode invocar lacaios para os mesmos. O pedestal precisa de carregar durante alguns turnos antes que o lacaio apareça, e o tipo de lacaio invocado é indicado pelo poder mágico acumulado.
levels.citybosslevel.summoning_name=pedestal de invocação
levels.citybosslevel.throne_desc=Este trono impressionantemente grande é a sede do império anão, agora dominado por um necromante sedento de poder. Parece haver algumas partes mágicas ou mecânicas no trono; o Rei Anão pode ter poder adicional ao sentar-se nele.
levels.citybosslevel.throne_name=Trono
levels.citylevel.bookshelf_desc=Fileiras de livros sobre diferentes disciplinas enchem a estante.
levels.citylevel.deco_desc=Faltam aqui várias peças.
levels.citylevel.entrance_desc=Uma rampa conduz até à parte superior do terreno.
levels.citylevel.exit_desc=Uma rampa leva à parte mais profunda.
levels.citylevel.high_grass_name=Flores de floração alta
levels.citylevel.region_deco_desc=Um pedestal elevado com uma chama mágica verde brilhante no topo. A chama é tão densa que poderia muito bem ser sólida.
levels.citylevel.region_deco_name=pedestal em chamas
levels.citylevel.sp_desc=Um tapete grosso cobre o chão.
levels.citylevel.statue_desc=A estátua retrata um anão numa postura heroica.
levels.citylevel.upcoming_quest_intro_no=Fique aqui
levels.citylevel.upcoming_quest_intro_title=Mensagem do desenvolvedor
levels.citylevel.upcoming_quest_intro_yes=Desça até ao cofre.
levels.citylevel.water_name=Água com coloração suspeita
levels.features.chasm.chasm=Abismo
levels.features.chasm.jump=Quer mesmo saltar no abismo? Uma queda tão grande será dolorosa.
levels.features.chasm.no=Não, mudei de ideias.
levels.features.chasm.ondeath=Caiu e morreu...
levels.features.chasm.rankings_desc=Morreu no impacto.
levels.features.chasm.yes=Sim, eu sei o que estou a fazer.
levels.hallslevel.bookshelf_desc=Os livros em línguas antigas ardem lentamente na estante.
levels.hallslevel.grass_name=Musgo de brasa
levels.hallslevel.high_grass_name=Fungos de brasa
levels.hallslevel.region_deco_desc=Um enorme pedaço de pedra que parece ter-se desprendido do teto ou de uma parede próxima.
levels.hallslevel.region_deco_name=Pedaço de entulho
levels.hallslevel.statue_desc=A coluna é feita de crânios humanoides reais. Incrível.
levels.hallslevel.statue_name=Pilar
levels.hallslevel.water_desc=Parece lava, mas está fria e é provavelmente seguro tocar.
levels.hallslevel.water_name=Lava fria
levels.level$feeling.chasm_desc=Os seus passos ecoam pela masmorra.
levels.level$feeling.chasm_title=chão do abismo
levels.level$feeling.dark_desc=É possível ouvir inimigos a moverem-se na escuridão.
levels.level$feeling.dark_title=chão escuro
levels.level$feeling.grass_desc=O ar está impregnado com o cheiro da vegetação.
levels.level$feeling.grass_title=chão de relva
levels.level$feeling.large_desc=Este piso da masmorra parece excepcionalmente grande.
levels.level$feeling.large_title=piso amplo
levels.level$feeling.secrets_desc=A atmosfera sugere que este piso esconde muitos segredos.
levels.level$feeling.secrets_title=andar dos segredos
levels.level$feeling.traps_desc=O terreno parece especialmente traiçoeiro aqui.
levels.level$feeling.traps_title=armadilhas no chão
levels.level$feeling.water_desc=Ouve água a espirrar ao seu redor.
levels.level$feeling.water_title=piso de água
levels.level.alchemy_desc=Este pote está cheio de água mágica. Os itens podem ser misturados no pote para criar algo novo!
levels.level.alchemy_name=caldeirão de alquimia
levels.level.barricade_desc=A barricada de madeira está bem fixa, mas ressecou com o passar dos anos. Será que pode pegar fogo?
levels.level.barricade_name=Barricada
levels.level.bookshelf_name=Estante de livros
levels.level.chasm_desc=Não consegue ver o fundo.
levels.level.chasm_name=Abismo
levels.level.closed_door_name=Porta fechada
levels.level.crystal_door_desc=Esta porta trancada é feita de cristal mágico. Consegues ver através dela, mas precisarás de uma chave de cristal para a abrir.
levels.level.crystal_door_name=Porta de cristal
levels.level.default_name=???
levels.level.embers_desc=Brasas cobrem o chão.
levels.level.embers_name=Brasas
levels.level.empty_well_desc=A fonte secou.
levels.level.empty_well_name=Poço vazio
levels.level.entrace_name=Entrada em profundidade
levels.level.entrance_desc=Uma escada conduz à parte superior.
levels.level.exit_desc=Uma escadaria conduz à parte inferior.
levels.level.exit_name=Saída de profundidade
levels.level.floor_name=Andar
levels.level.furrowed_grass_name=Vegetação sulcada
levels.level.grass_name=Relva
levels.level.hidden_trap=Um %s oculto é ativado!
levels.level.high_grass_desc=A vegetação densa tapa a vista.
levels.level.high_grass_name=Grama alta
levels.level.inactive_trap_desc=A armadilha já foi acionada anteriormente e já não representa perigo.
levels.level.inactive_trap_name=Armadilha acionada
levels.level.locked_door_desc=Esta porta está trancada; precisa da chave correspondente para a destrancar.
levels.level.locked_door_name=Porta trancada
levels.level.locked_exit_desc=Barras pesadas bloqueiam a escada que conduz ao piso inferior.
levels.level.locked_exit_name=Saída de profundidade bloqueada
levels.level.open_door_name=Abra a porta
levels.level.pedestal_name=Pedestal
levels.level.statue_desc=Alguém quis adornar este local, mas obviamente falhou.
levels.level.statue_name=Estátua
levels.level.unlocked_exit_name=Saída de profundidade desbloqueada
levels.level.wall_name=Parede
levels.level.water_desc=Em caso de incêndio, entre na água para extinguir o fogo.
levels.level.water_name=Água
levels.level.well_name=Bem
levels.mininglevel.barricade_desc=A barricada de madeira está firmemente fixa e serve de suporte para o teto. Provavelmente foi construída pelos gnolls para oferecer alguma proteção contra a queda de rochas. Quaisquer celas adjacentes estarão protegidas contra armadilhas e ataques de queda de rochas. Parece que ela queimaria tão bem como qualquer outra barricada.
levels.mininglevel.boulder_desc=Há uma grande pedra a bloquear o caminho. Deve ser relativamente fácil parti-la com uma picareta.
levels.mininglevel.boulder_name=Pedregulho
levels.mininglevel.crystal_desc=Aqui existe um grande afloramento de cristal colorido. Estes cristais são frágeis e podem ser facilmente quebrados com uma picareta, ou partir-se-ão se algo for minerado perto deles.
levels.mininglevel.crystal_name=Espinho de cristal
levels.mininglevel.gold_extra_desc=Provavelmente consegue extrair isso com a sua picareta.
levels.mininglevel.wall_desc=Uma parede de rocha lisa, um pouco mais macia que o normal. Pode minerá-la com a sua picareta, mas isso exigirá algum esforço e aumentará um pouco a sua fome.
levels.prisonlevel.bookshelf_desc=Provavelmente é um vestígio de uma biblioteca prisional. Será que pode ser destruída pelo fogo?
levels.prisonlevel.empty_deco_desc=Há manchas antigas de sangue no chão.
levels.prisonlevel.region_deco_alt_desc=Uma gaiola de metal com tamanho suficiente apenas para conter uma pessoa. Está suspensa sobre um abismo profundo, presa por uma corrente.
levels.prisonlevel.region_deco_alt_name=gaiola suspensa
levels.prisonlevel.region_deco_desc=Uma gaiola de metal com tamanho suficiente apenas para conter uma pessoa. Parece estar presa ao chão de alguma forma, não é possível movê-la.
levels.prisonlevel.region_deco_name=Jaula de prisão
levels.prisonlevel.water_name=Água escura e fria
levels.rooms.quest.ambitiousimproom$questentrance.desc=Este poço sinistro parece ser a entrada para algum cofre anão antigo. Uma barreira mágica impede a entrada; pode andar sobre ela como se houvesse chão.
levels.rooms.quest.ambitiousimproom$questentrance.name=Entrada do cofre
levels.rooms.quest.blacksmithroom$questentrance.desc=Esta escadaria conduz a uma antiga mina mesmo por baixo da oficina do ferreiro.
levels.rooms.quest.blacksmithroom$questentrance.name=Entrada da mina
levels.rooms.quest.massgraveroom$bones.desc=Ossos espalhados pelo chão, o que aconteceu aqui?
levels.rooms.quest.massgraveroom$bones.name=vala comum
levels.rooms.quest.mineentrance$questexit.desc=Esta escada leva para fora da mina, de volta à oficina do ferreiro.
levels.rooms.quest.mineentrance$questexit.name=Saída da mina
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Um marcador pintado para algum ritual sombrio. As velas são geralmente colocadas nos quatro cantos.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Marcador ritual
levels.rooms.special.magicalfireroom$eternalfire.desc=Uma parede de fogo verde brilhante e denso ergue-se aqui, aparentemente causada por magia. É tão densa que não se consegue atravessá-la e incendeia tudo o que se aproxima demasiado. Não dá sinais de que se vai extinguir naturalmente; será necessário usar algo para apagá-la.
levels.rooms.special.sentryroom$sentry.desc=Esta sentinela vermelho-sangue parece estar aqui posicionada para guardar o tesouro no outro extremo desta sala. Ela disparará raios de magia de desintegração contra ti se entrares na área que ela defende. Ela é imune a todos os efeitos nocivos e consegue ver através da invisibilidade, mas parece demorar algum tempo a carregar antes de começar a disparar. De alguma forma, a sentinela só quer disparar sobre ti, como se soubesse que os habitantes da masmorra não representam uma ameaça para o tesouro.
levels.rooms.special.sentryroom$sentry.discover_hint=Podes encontrar este inimigo em qualquer lugar da masmorra.
levels.rooms.special.sentryroom$sentry.name=sentinela vermelha
levels.rooms.special.toxicgasroom$toxicvent.desc=Um aventureiro descuidado deve ter acionado esta armadilha há muito tempo. Apesar de estar inativa, continua a expelir gás tóxico para a sala e não dá sinais de que vá parar. Precisará de alguma forma de evitar danos causados pelo gás se quiser explorar esta sala.
levels.rooms.special.toxicgasroom$toxicvent.name=ventilação tóxica
levels.rooms.special.weakfloorroom$hiddenwell.desc=É possível distinguir um poço nas profundezas, talvez haja algo lá em baixo?
levels.rooms.special.weakfloorroom$hiddenwell.name=poço distante
levels.sewerlevel.bookshelf_desc=A estante está cheia de livros baratos e inúteis. Será que ela pode pegar fogo?
levels.sewerlevel.empty_deco_desc=Musgo húmido e amarelado cobre o chão.
levels.sewerlevel.region_deco_desc=Um barril robusto, quase do seu tamanho. Deve estar cheio de alguma coisa, pois é demasiado pesado para se mover.
levels.sewerlevel.region_deco_name=Barril de armazenamento
levels.sewerlevel.water_name=Água turva
levels.traps.alarmtrap.alarm=A armadilha emite um som estridente que ecoa por toda a masmorra!
levels.traps.alarmtrap.desc=Esta armadilha parece estar ligada a um mecanismo de alarme muito elevado. Acioná-lo provavelmente alertará todos os que se encontram no piso.
levels.traps.alarmtrap.name=Armadilha de alarme
levels.traps.blazingtrap.desc=Ao pisar esta armadilha, uma poderosa mistura química será acionada, incendiando uma vasta área.
levels.traps.blazingtrap.name=armadilha flamejante
levels.traps.burningtrap.desc=Ao pisar esta armadilha, será desencadeada uma mistura química, incendiando a área circundante.
levels.traps.burningtrap.name=armadilha de fogo
levels.traps.chillingtrap.desc=Quando ativada, as substâncias químicas presentes nesta armadilha irão rapidamente congelar o ar à sua volta.
levels.traps.chillingtrap.name=armadilha arrepiante
levels.traps.confusiontrap.desc=Acionar esta armadilha irá libertar uma nuvem de gás causador de confusão na área imediata.
levels.traps.confusiontrap.name=armadilha de gás de confusão
levels.traps.corrosiontrap.desc=Acionar esta armadilha irá libertar uma nuvem de gás ácido mortal na área imediata.
levels.traps.corrosiontrap.name=armadilha de gás corrosivo
levels.traps.cursingtrap.curse=O seu equipamento desgastado fica amaldiçoado!
levels.traps.cursingtrap.desc=Esta armadilha contém a mesma magia maléfica encontrada em equipamento amaldiçoado. Ao ativá-la, alguns itens na área imediata serão amaldiçoados.
levels.traps.cursingtrap.name=armadilha de maldição
levels.traps.disarmingtrap.desc=Esta armadilha contém uma magia de teletransporte muito específica, que transportará a arma da vítima para outro local.
levels.traps.disarmingtrap.disarm=A sua arma foi teletransportada para longe!
levels.traps.disarmingtrap.name=armadilha de desarmamento
levels.traps.disintegrationtrap.desc=Quando acionada, esta armadilha lançará raios de desintegração no alvo mais próximo, causando dano significativo e destruindo itens. Felizmente, o mecanismo de acionamento não está escondido.
levels.traps.disintegrationtrap.name=armadilha de desintegração
levels.traps.disintegrationtrap.ondeath=Foi morto pela armadilha da desintegração...
levels.traps.disintegrationtrap.one=A armadilha desintegra o seu %s!
levels.traps.disintegrationtrap.some=A armadilha desintegra parte do seu %s!
levels.traps.distortiontrap.desc=Construída com uma estranha magia de origem desconhecida, esta armadilha invocará todo o tipo de criaturas para este local.
levels.traps.distortiontrap.name=armadilha de distorção
levels.traps.explosivetrap.desc=Esta armadilha contém explosivo em pó e um mecanismo de acionamento. Ao ativá-la, ocorrerá uma explosão na área imediata.
levels.traps.explosivetrap.name=armadilha explosiva
levels.traps.flashingtrap.desc=Ao ser ativada, esta armadilha irá inflamar um potente pó inflamável armazenado no seu interior, cegando, incapacitando e ferindo temporariamente a vítima. A armadilha deve ter uma grande quantidade de pó, pois pode ser ativada várias vezes sem se partir.
levels.traps.flashingtrap.name=armadilha intermitente
levels.traps.flocktrap.desc=Talvez seja uma brincadeira de algum mago amador; acionar esta armadilha criará um rebanho de ovelhas mágicas.
levels.traps.flocktrap.name=armadilha para rebanho
levels.traps.frosttrap.desc=Quando ativada, as substâncias químicas presentes nesta armadilha irão rapidamente congelar o ar numa ampla área em redor da sua localização.
levels.traps.frosttrap.name=armadilha de gelo
levels.traps.gatewaytrap.desc=Esta armadilha de teletransporte especial pode ser ativada um número infinito de vezes e teletransporta-se sempre para o mesmo local.
levels.traps.gatewaytrap.name=armadilha de entrada
levels.traps.geysertrap.desc=Quando acionada, esta armadilha fará com que um géiser de água jorre, causando dano aos inimigos em chamas, atirando todas as personagens próximas, apagando incêndios e transformando o terreno circundante em água.
levels.traps.geysertrap.name=armadilha de géiser
levels.traps.gnollrockfalltrap.desc=Esta armadilha de queda de rochas é feita com algum tipo de auxílio mágico. Quando acionada, fará com que as rochas se soltem e caiam imediatamente de cima para uma área de 5x5 à sua volta. Devido às rochas mais macias na área, não causará tanto dano como uma armadilha de queda de rochas comum, mas a sua armadura também não será eficaz contra ela. As rochas também não cairão em locais com uma barricada adjacente, pois ajudam a suportar o tecto. _Esta armadilha não distingue o amigo do inimigo e, por isso, é tão prejudicial para os gnolls como para ti. _
levels.traps.gnollrockfalltrap.name=armadilha de queda de rochas gnoll
levels.traps.grimtrap.desc=Uma magia destrutiva extremamente poderosa está armazenada dentro desta armadilha, suficiente para matar instantaneamente qualquer um, excepto os heróis mais saudáveis. Ao ativá-la, será lançada uma rajada de magia letal em direção à personagem mais próxima. Felizmente, o mecanismo de ativação não está escondido.
levels.traps.grimtrap.name=armadilha sinistra
levels.traps.grimtrap.ondeath=Foste morto pela explosão de uma armadilha sinistra...
levels.traps.grippingtrap.desc=Esta armadilha fixa-se aos pés de quem a aciona, causando dano e reduzindo a velocidade de movimento. Devido à sua simplicidade, esta armadilha pode ser ativada várias vezes sem se partir.
levels.traps.grippingtrap.name=Armadilha de Agarrar
levels.traps.guardiantrap$guardian.desc=Esta aparição azul parece ser um eco invocado de um dos guardiões de pedra da masmorra.
levels.traps.guardiantrap$guardian.desc_weapon=Embora a estátua em si seja quase incorpórea, o _%s_ que empunha parece real.
levels.traps.guardiantrap$guardian.discover_hint=Pode encontrar este inimigo com uma armadilha específica.
levels.traps.guardiantrap$guardian.name=guardião convocado
levels.traps.guardiantrap.alarm=A armadilha emite um som estridente que ecoa por toda a masmorra!
levels.traps.guardiantrap.desc=Esta armadilha está ligada a um estranho mecanismo mágico, que invocará guardiões e alertará todos os inimigos no piso.
levels.traps.guardiantrap.name=armadilha guardiã
levels.traps.oozetrap.desc=Ao ser ativada, esta armadilha lançará um líquido cáustico que provocará queimaduras até ser removido pela água.
levels.traps.oozetrap.name=armadilha de lamas
levels.traps.pitfalltrap.desc=Esta armadilha está ligada a um grande mecanismo de alçapão, e logo após ser acionado, qualquer coisa que esteja perto dele deslizará pelo chão e cairá! No entanto, não funcionará em áreas com pavimentos muito sólidos.
levels.traps.pitfalltrap.name=armadilha de armadilha
levels.traps.pitfalltrap.no_pit=O solo é demasiado firme para que uma armadilha de queda funcione aqui.
levels.traps.pitfalltrap.triggered=O chão começa a ceder em redor da armadilha acionada!
levels.traps.pitfalltrap.triggered_hero=O chão começa a ceder à sua volta!
levels.traps.poisondarttrap.desc=Um pequeno lançador de dardos deve estar escondido nas proximidades; ativar esta armadilha fará com que ela dispare um dardo envenenado para o alvo mais próximo. Felizmente, o mecanismo de disparo não está escondido.
levels.traps.poisondarttrap.name=armadilha de dardo envenenado
levels.traps.poisondarttrap.ondeath=Foste morto pela armadilha de dardos envenenados...
levels.traps.rockfalltrap.desc=Esta armadilha está ligada a uma série de pedras soltas acima; ao acioná-la, cairão sobre toda a sala! Se a armadilha não estiver numa sala específica, as pedras cairão numa área em redor. Felizmente, o mecanismo de acionamento não está escondido.
levels.traps.rockfalltrap.name=armadilha de queda de rochas
levels.traps.rockfalltrap.ondeath=Foste esmagado pela armadilha de queda de rochas...
levels.traps.shockingtrap.desc=Um mecanismo com uma grande quantidade de energia armazenada. Acionar esta armadilha irá libertar essa energia num campo ao seu redor.
levels.traps.shockingtrap.name=armadilha chocante
levels.traps.stormtrap.desc=Um mecanismo com uma enorme quantidade de energia armazenada. Acionar esta armadilha irá libertar essa energia numa grande tempestade elétrica.
levels.traps.stormtrap.name=armadilha de tempestade
levels.traps.summoningtrap.desc=Acionar esta armadilha fará com que vários monstros desta área apareçam neste local.
levels.traps.summoningtrap.name=Armadilha de Invocação
levels.traps.teleportationtrap.desc=Sempre que esta armadilha for acionada, tudo à volta será teletransportado para locais aleatórios neste piso.
levels.traps.teleportationtrap.name=armadilha de teletransporte
levels.traps.tengudarttrap.desc=Tengu preparou-se claramente para uma luta. Esta armadilha ativará um lançador de dardos oculto que disparará um dardo envenenado contra o objeto mais próximo que não seja Tengu. A armadilha está tão bem conseguida que o mecanismo de ativação é impossível de detetar sem ajuda mágica. No entanto, a armadilha é visível por um instante enquanto está a ser montada.
levels.traps.toxictrap.desc=Acionar esta armadilha irá libertar uma nuvem de gás tóxico na área circundante.
levels.traps.toxictrap.name=armadilha de gás tóxico
levels.traps.trap.discover_hint=Podes encontrar esta armadilha aleatoriamente na masmorra. Cada região tem armadilhas diferentes que podem aparecer.
levels.traps.trap.rankings_desc=Morto por: %s
levels.traps.warpingtrap.desc=Esta armadilha é semelhante a uma armadilha de teletransporte, mas também fará com que o herói perca o seu conhecimento do layout do piso!
levels.traps.warpingtrap.name=armadilha de distorção
levels.traps.weakeningtrap.desc=A magia negra desta armadilha suga a energia de tudo o que entra em contacto com ela. Os inimigos poderosos podem resistir ao efeito, no entanto.
levels.traps.weakeningtrap.name=armadilha de enfraquecimento
levels.traps.worndarttrap.desc=Um pequeno lançador de dardos deve estar escondido nas proximidades; ativar esta armadilha fará com que ele dispare para o alvo mais próximo. Devido à sua idade, não é muito perigoso, e nem sequer está escondido...
levels.traps.worndarttrap.name=armadilha de dardos desgastada
