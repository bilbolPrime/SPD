levels.mininglevel.barricade_desc=A fa barikád szilárdan áll, és a mennyezet támasztékaként szolgál.\n\nValószínűleg a gnollok építették, hogy némi védelmet nyújtsanak a lehulló sziklák ellen. _Minden szomszédos cellát védeni fognak a kőomlás csapdáitól és támadásoktól._\n\nÚgy tűnik, ugyanolyan jól égne, mint bármely más barikád.
levels.mininglevel.boulder_desc=Egy nagy szikla állja el az utat. Csákánnyal viszonylag könnyű lesz eltörni.
levels.mininglevel.boulder_name=Szikladarab
levels.mininglevel.crystal_desc=Egy nagy és színes kristálykibúvás található itt. Ezek a kristályok törékenyek, könnyen eltörhetők csákánnyal, vagy eltörnek, ha valamit kibányásznak mellette.
levels.mininglevel.crystal_name=Kristálytüske
levels.mininglevel.gold_extra_desc=Valószínűleg ki tudod bányászni a csákányoddal.
levels.mininglevel.wall_desc=Egy sima sziklafal, ami egy kicsit puhább a szokásosnál. Át tudod ásni a csákányoddal, de némi erőfeszítést igényel, és egy kicsit fokozza az éhségedet.
levels.prisonlevel.bookshelf_desc=Ez valószínűleg egy börtönkönyvtár maradványa. Leéghet?
levels.prisonlevel.empty_deco_desc=Régi vérfoltok vannak a padlón.
levels.prisonlevel.region_deco_alt_desc=Egy fémketrec, amiben éppen csak elfér egy ember. Egy mély szakadék felett lóg, láncon felfüggesztve.
levels.prisonlevel.region_deco_alt_name=Függőkalitka
levels.prisonlevel.region_deco_desc=Egy fémketrec, ami pont akkora, hogy elférjen benne egy ember. Úgy tűnik, valahogy a földhöz van kötve, nem lehet megmozdítani.
levels.prisonlevel.region_deco_name=Börtönketrec
levels.prisonlevel.water_name=Sötét hideg víz
levels.rooms.quest.ambitiousimproom$questentrance.desc=Ez a baljóslatú gödör egy ősi törpe kripta bejáratának tűnik. Egy mágikus akadály akadályozza meg a bejutást, úgy lehet átsétálni rajta, mintha padló lenne itt.
levels.rooms.quest.ambitiousimproom$questentrance.name=Trezor bejárat
levels.rooms.quest.blacksmithroom$questentrance.desc=Ez a létra egy régi bányába vezet, közvetlenül a kovácsműhely alatt.
levels.rooms.quest.blacksmithroom$questentrance.name=Bánya bejárat
levels.rooms.quest.massgraveroom$bones.desc=Csontok hevernek szerteszét a padlón, mi történt itt?
levels.rooms.quest.massgraveroom$bones.name=Tömegsír
levels.rooms.quest.mineentrance$questexit.desc=Ez a létra vezet ki a bányából, vissza a kovácsműhelybe.
levels.rooms.quest.mineentrance$questexit.name=Bánya kijárat
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Festett filctoll valamilyen sötét rituáléhoz. A gyertyákat általában a négy sarokra helyezik.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Rituális jelölő
levels.rooms.special.magicalfireroom$eternalfire.desc=Egy sűrű, élénkzöld tűzfal található itt, látszólag mágia hatására. Olyan sűrű, hogy nem lehet áthaladni rajta, és bármit meggyújt, ami túl közel kerül. Nem mutatja a természetes leégés jeleit, valamivel el kell oltani.
levels.rooms.special.sentryroom$sentry.desc=Úgy tűnik, ez a vérvörös őrszem azért van itt, hogy a szoba másik végében lévő kincset őrizze. Széteső mágiát lő rád, ha belépsz az általa védett területre.\n\nImmunis minden káros hatásra, és átlát a láthatatlanságon, de úgy tűnik, eltart egy ideig, amíg feltöltődik, mielőtt tüzelni kezd.\n\nValahogy az őrszem csak rád akar tüzelni, mintha tudná, hogy a kazamata lakói nem jelentenek veszélyt a kincsre.
levels.rooms.special.sentryroom$sentry.discover_hint=Ezt az ellenséget bárhol megtalálhatod a kazamatában.
levels.rooms.special.sentryroom$sentry.name=vörös őrszem
levels.rooms.special.toxicgasroom$toxicvent.desc=Egy gondatlan kalandornak már réges-régen működnie kellett, hogy működjön ez a csapda. Inaktív állapota ellenére is mérgező gázt okád a szobába, és semmi jelét nem mutatja a megállásra. Szükséged lesz valamilyen módra, hogy megakadályozd a gáz okozta károkat, ha fel akarod fedezni ezt a szobát.
levels.rooms.special.toxicgasroom$toxicvent.name=mérgező szellőzőnyílás
levels.rooms.special.weakfloorroom$hiddenwell.desc=Épp csak egy kutat látsz a mélyben, talán van odalent valami?
levels.rooms.special.weakfloorroom$hiddenwell.name=távoli kút
levels.sewerlevel.bookshelf_desc=A könyvespolc tele van olcsó, haszontalan könyvekkel. Lehet, hogy megég?
levels.sewerlevel.empty_deco_desc=Nedves sárgás moha borítja a padlót.
levels.sewerlevel.region_deco_desc=Egy vaskos hordó, ami majdnem akkora, mint te. Biztos tele van valamivel, túl nehéz ahhoz, hogy megmozdítsd.
levels.sewerlevel.region_deco_name=Tároló hordó
levels.sewerlevel.water_name=Zavaros víz
levels.traps.alarmtrap.alarm=A csapda átható hangot ad ki, ami visszhangzik az egész kazamatában!
levels.traps.alarmtrap.desc=Úgy tűnik, ez a csapda egy hangos riasztórendszerhez van kötve. Ha beindítja, valószínűleg mindenki riasztja a szintet.
levels.traps.alarmtrap.name=riasztócsapda
levels.traps.blazingtrap.desc=Ha rálépsz erre a csapdára, egy erős kémiai keverék lángra kap, ami nagy területet lángra lobbant.
levels.traps.blazingtrap.name=lángoló csapda
levels.traps.burningtrap.desc=Ha rálépsz erre a csapdára, egy kémiai keverék meggyullad, és lángra lobbantja a környező területet.
levels.traps.burningtrap.name=égő csapda
levels.traps.chillingtrap.desc=Aktiváláskor a csapdában lévő vegyi anyagok gyorsan megfagyasztják a körülötte lévő levegőt.
levels.traps.chillingtrap.name=hűtőcsapda
levels.traps.confusiontrap.desc=A csapda beindítása zavaró gázfelhőt szabadít fel a közvetlen közelben.
levels.traps.confusiontrap.name=zavaró gázcsapda
levels.traps.corrosiontrap.desc=A csapda beindítása halálos savas gázfelhőt szabadít fel a közvetlen közelben.
levels.traps.corrosiontrap.name=korrozív gázcsapda
levels.traps.cursingtrap.curse=Elhasználódott felszerelésed átkozottá válik!
levels.traps.cursingtrap.desc=Ez a csapda ugyanazt a rosszindulatú mágiát tartalmazza, mint az elátkozott felszerelések. Aktiválásával néhány tárgyat megátkozhatsz a közvetlen közelben.
levels.traps.cursingtrap.name=káromkodáscsapda
levels.traps.disarmingtrap.desc=Ez a csapda nagyon specifikus teleportációs mágiát tartalmaz, amely az áldozat fegyverét egy másik helyre mozgatja.
levels.traps.disarmingtrap.disarm=A fegyvered elteleportálva van!
levels.traps.disarmingtrap.name=hatástalanító csapda
levels.traps.disintegrationtrap.desc=Amikor beindul, ez a csapda széteső sugarakkal lövi a legközelebbi célpontot, jelentős sebzést okozva és tárgyakat semmisítve meg.\n\nSzerencsére az elsütő mechanizmus nincs elrejtve.
levels.traps.disintegrationtrap.name=szétesési csapda
levels.traps.disintegrationtrap.ondeath=Megölt téged a szétesés csapdája...
levels.traps.disintegrationtrap.one=A csapda szétesik a %s-dat!
levels.traps.disintegrationtrap.some=A csapda szétesik a %s-d egy részét!
levels.traps.distortiontrap.desc=Ismeretlen eredetű különös mágiából épült ez a csapda mindenféle lényt megidéz erre a helyre.
levels.traps.distortiontrap.name=torzításcsapda
levels.traps.explosivetrap.desc=Ez a csapda por alakú robbanóanyagot és egy kioldó mechanizmust tartalmaz. Aktiválása robbanást okoz a közvetlen közelben.
levels.traps.explosivetrap.name=robbanócsapda
levels.traps.flashingtrap.desc=Aktiváláskor ez a csapda meggyújt egy benne tárolt erős, villogó port, ideiglenesen megvakítva, megbénítva és megsebesítve az áldozatot. \n\nA csapdának nagy mennyiségű lőport kell tartalmaznia, mivel sokszor aktiválódhat törés nélkül.
levels.traps.flashingtrap.name=villogó csapda
levels.traps.flocktrap.desc=Talán egy amatőr mágus viccelődik, de ha aktiválja ezt a csapdát, az varázslatos birkanyájat hoz létre.
levels.traps.flocktrap.name=csapdacsapda
levels.traps.frosttrap.desc=Aktiváláskor a csapdában lévő vegyszerek gyorsan megfagyasztják a levegőt a helye körüli széles tartományban.
levels.traps.frosttrap.name=fagycsapda
levels.traps.gatewaytrap.desc=Ez a különleges teleportációs csapda végtelenszer aktiválódhat, és mindig ugyanarra a helyre teleportál.
levels.traps.gatewaytrap.name=átjárócsapda
levels.traps.geysertrap.desc=Amikor ez a csapda beindul, egy vízgejzírt bocsát ki, ami megsebzi a tüzes ellenfeleket, eltaszítja az összes közeli karaktert, eloltja a tüzet, és vízzé változtatja a környező terepet.
levels.traps.geysertrap.name=gejzírcsapda
levels.traps.gnollrockfalltrap.desc=Ez a kőomláscsapda valamilyen mágikus segítséggel készül. Bekapcsoláskor sziklák lazulnak fel, és azonnal leesnek felülről egy 5x5-ös területen belül. A területen lévő puhább sziklák miatt nem fog annyi sebzést okozni, mint egy hagyományos kőomláscsapda, de a páncélod sem lesz hatékony ellene. A sziklák nem fognak olyan helyekre hullani, ahol szomszédos barikád van, mivel segítenek megtartani a mennyezetet. \n\n_Ez a csapda nem tudja megkülönböztetni a barátot az ellenségtől, ezért ugyanolyan káros a gnolloknak, mint neked._
levels.traps.gnollrockfalltrap.name=gnoll kőomlás csapda
levels.traps.grimtrap.desc=Rendkívül erős pusztító mágia van ebben a csapdában, amely elegendő ahhoz, hogy azonnal megöljön mindenkit, kivéve a legegészségesebb hősöket. Bekapcsolása egy halálos mágiahullámot küld a legközelebbi karakter felé. \n\n Szerencsére a kioldó mechanizmus nincs elrejtve.
levels.traps.grimtrap.name=komor csapda
levels.traps.grimtrap.ondeath=Egy komor csapda robbanása ölt meg...
levels.traps.grippingtrap.desc=Ez a csapda annak a lábára akad, aki aktiválja, megsebesítve őt és lelassítva a mozgását.\n\nEgyszerű jellege miatt ez a csapda sokszor aktiválódhat anélkül, hogy eltörne.
levels.traps.grippingtrap.name=megragadó csapda
levels.traps.guardiantrap$guardian.desc=Ez a kék kísértet a kazamata egyik kőőrének megidézett visszhangja.
levels.traps.guardiantrap$guardian.desc_weapon=Míg maga a szobor szinte testetlen, a _%s_, amit a kezében tart, valóságosnak tűnik.
levels.traps.guardiantrap$guardian.discover_hint=Ezt az ellenséget egy speciális csapdával találhatod meg.
levels.traps.guardiantrap$guardian.name=megidézett gyám
levels.traps.guardiantrap.alarm=A csapda átható hangot ad ki, ami visszhangzik az egész kazamatában!
levels.traps.guardiantrap.desc=Ez a csapda egy furcsa mágikus mechanizmushoz van kötve, amely megidézi az őrzőket és riasztja az összes ellenséget a földön.
levels.traps.guardiantrap.name=őrcsapda
levels.traps.oozetrap.desc=Ez a csapda aktiváláskor maró iszapot fröcsköl, amely addig ég, amíg el nem mosódik.
levels.traps.oozetrap.name=iszapfogó
levels.traps.pitfalltrap.desc=Ez a csapda egy nagy csapóajtó mechanizmushoz csatlakozik, és röviddel azután, hogy beindul, bármi, ami a közelében van, átcsúszik a földön és leesik! Különösen szilárd padlójú területeken azonban nem fog működni.
levels.traps.pitfalltrap.name=csapdacsapda
levels.traps.pitfalltrap.no_pit=A talaj túl szilárd ahhoz, hogy egy csapda működjön itt.
levels.traps.pitfalltrap.triggered=A talaj kezd engedni a helyét a kioldott csapda körül!
levels.traps.pitfalltrap.triggered_hero=Kezd engedni a föld körülötted!
levels.traps.poisondarttrap.desc=Egy kis dárdafújót kell elrejteni a közelben, a csapda aktiválásakor mérgezett dárdát lő ki a legközelebbi célpontra. \n\n Szerencsére az elsütőszerkezet nincs elrejtve.
levels.traps.poisondarttrap.name=mérges nyílcsapda
levels.traps.poisondarttrap.ondeath=Mérgezett nyílcsapda ölt meg...
levels.traps.rockfalltrap.desc=Ez a csapda egy sor laza sziklához van csatlakoztatva, amelyek beindítása az egész szobára zuhanását okozza! Ha a csapda nincs egy adott szobában, akkor a kövek a csapda körüli területre hullanak. \n\n Szerencsére az elsütő mechanizmus nincs elrejtve.
levels.traps.rockfalltrap.name=kőomlás csapda
levels.traps.rockfalltrap.ondeath=Összezúzott a kőomlás csapdája...
levels.traps.shockingtrap.desc=Egy nagy mennyiségű energiát tartalmazó mechanizmus. A csapda beindítása ezt az energiát a körülötte lévő mezőbe kisüti.
levels.traps.shockingtrap.name=sokkoló csapda
levels.traps.stormtrap.desc=Egy mechanizmus, amelyben hatalmas mennyiségű energia tárolódik. Ennek a csapdának a beindítása ezt az energiát egy hatalmas elektromos viharrá alakítja.
levels.traps.stormtrap.name=viharcsapda
levels.traps.summoningtrap.desc=A csapda aktiválása számos szörnyet idéz meg a környékről erre a helyszínre.
levels.traps.summoningtrap.name=idézőcsapda
levels.traps.teleportationtrap.desc=Amikor ez a csapda beindul, minden körülötte lévő dolog véletlenszerű helyekre teleportálódik ezen a szinten.
levels.traps.teleportationtrap.name=teleportációs csapda
levels.traps.tengudarttrap.desc=Tengu egyértelműen harcra készült. Ez a csapda aktivál egy rejtett dárdafújót, amely mérgezett dárdát lő ki a legközelebbi dologra, ami nem Tengu.\n\nA csapda olyan jól meg van csinálva, hogy az elsütőszerkezetét mágikus segítség nélkül lehetetlen észlelni. A csapda azonban egy pillanatra látható, amikor felállítják.
levels.traps.toxictrap.desc=A csapda beindítása mérgező gázfelhőt szabadít fel a környező területen.
levels.traps.toxictrap.name=mérgező gázcsapda
levels.traps.trap.discover_hint=Ezt a csapdát véletlenszerűen találhatod meg a kazamatában. Minden régióban más csapdák jelenhetnek meg.
levels.traps.trap.rankings_desc=Megölte: %s
levels.traps.warpingtrap.desc=Ez a csapda hasonló egy teleportációs csapdához, de a hős elveszíti a padló elrendezésének ismeretét is!
levels.traps.warpingtrap.name=vetemedéscsapda
levels.traps.weakeningtrap.desc=A csapdában lévő sötét mágia kiszívja az energiát mindenből, ami kapcsolatba kerül vele. Az erős ellenségek azonban ellenállhatnak a hatásnak.
levels.traps.weakeningtrap.name=gyengülő csapda
levels.traps.worndarttrap.desc=Egy kis dárdafújót kell elrejteni a közelben, a csapda aktiválása a legközelebbi célpontra lövést eredményez.\n\nKorából adódóan nem túl veszélyes, sőt, nincs is elrejtve...
levels.traps.worndarttrap.name=kopott dartscsapda
levels.traps.worndarttrap.ondeath=A kopott nyílvessző csapda ölt meg...
levels.vaultlevel$vaultflametrap.desc=Úgy tűnik, hogy ez a szellőzőnyílás meghatározott időközönként zöld lángokat bocsát ki. _Mivel ez csak egy tesztelési terület, a szellőzőnyílásokból kiáramló lángok valójában nem fognak ártani neked._
levels.vaultlevel$vaultflametrap.name=boltozat lángkivezető

levels.level.sign_desc=Innen nem lehet elolvasni a szöveget.
levels.level.sign_name=Jel
