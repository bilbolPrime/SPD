levels.features.chasm.chasm=Szakadék
levels.features.chasm.jump=Tényleg bele akarsz ugrani a szakadékba? Egy ilyen mélyre zuhanás fájdalmas lesz.
levels.features.chasm.no=Nem, meggondoltam magam
levels.features.chasm.ondeath=Halálra esteltél...
levels.features.chasm.rankings_desc=Becsapódáskor meghalt
levels.features.chasm.yes=Igen, tudom, mit csinálok
