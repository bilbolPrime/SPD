levels.level$feeling.grass_desc=A növények illata sűrűn terjeng a levegőben.
levels.level$feeling.grass_title=füves padló
levels.level$feeling.large_desc=Ez a kazamatapadló szokatlanul nagynak tűnik.
levels.level$feeling.large_title=nagy emelet
levels.level$feeling.secrets_desc=A hangulat arra utal, hogy ez az emelet sok titkot rejt.
