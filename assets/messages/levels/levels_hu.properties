levels.level.inactive_trap_desc=A csapda már korábban is beindult, és most már nem veszélyes.
levels.level.inactive_trap_name=Kiváltott csapda
levels.level.locked_door_desc=Ez az ajtó zárva van, egy hozzá illő kulcsra van szükséged a kinyitásához.
