levels.cavesbosslevel.energy_desc=A föld itt elektromosságtól szikrázik, és veszélyes rálépni. _A szikrák mintha egy bizonyos irányba gravitálódnának..._ talán az áramforráshoz vezetnek?
levels.cavesbosslevel.gate_desc=Egy nagy fémkapu állja el az utat a törp metropoliszba. A középen lévő fémdoboz hangos zümmögő hangot ad ki, valószínűleg a közeli áramkörökhöz és gépekhez van csatlakoztatva. Talán a DM-300 elpusztítása kinyitná a kaput?
levels.cavesbosslevel.gate_desc_broken=A kapunak valamilyen módon kapcsolódnia kellett a DM-300-hoz, mivel felrobbant, amikor a DM-300-at legyőzték. Mára csak törött darabok maradtak fenn belőle.
levels.cavesbosslevel.gate_name=Fém kapu
levels.cavesbosslevel.water_desc=A sok áram miatt a víz nem mindig biztonságos...
levels.cavesbosslevel.wires_desc=A talaj részben ki van ásva, láthatóvá válva néhány nagy, szabadon lévő vezeték. Ezek biztosan összekötik a különböző elektromos gépeket. ZXQPH0 ZXQ ZXQPH1 ZXQ A vezetékeken biztosan folyik valamilyen áram. Ha a DM-300 idelép, képes lehet energiát meríteni belőlük.
levels.cavesbosslevel.wires_name=Fedetlen vezetékek
levels.caveslevel.bookshelf_desc=Kinek lenne szüksége könyvespolcra egy barlangban?
levels.caveslevel.entrance_desc=A létra felvezet a felső mélységbe.
levels.caveslevel.exit_desc=A létra levezet az alsóbb rétegekbe.
levels.caveslevel.grass_name=Fluoreszkáló moha
levels.caveslevel.high_grass_desc=Hatalmas gombák takarják el a kilátást.
levels.caveslevel.high_grass_name=Fluoreszkáló gombák
levels.caveslevel.region_deco_desc=Egy nagy, teljesen fémből készült építmény, valószínűleg a törpök építették, amikor bányásztak ezen a helyen. Azt hiszed, régóta használaton kívüli csekknyomokat látsz a tetején.
levels.caveslevel.region_deco_name=Fémszerkezet
levels.caveslevel.wall_deco_desc=Egy érctelér látszik a falon. Arany?
levels.caveslevel.water_name=Fagyos víz
levels.citybosslevel.summoning_desc=Ennek az emelvénynek közepén egy nagy nyílás található, amely gyakorlatilag sötét energiától sugárzik. \n\n Törpkirály ezeket az emelvényeket nekromanta mágiájának fókuszpontjaként használja, és minionokat is idézhet hozzájuk. Az emelvénynek néhány körig rohamoznia kell, mielőtt a minion megjelenik, és a megidézett minion típusát az épület mágikus ereje jelzi.
levels.citybosslevel.summoning_name=Idéző talapzat
levels.citybosslevel.throne_desc=Ez a lenyűgözően nagy trón a törp birodalom székhelye, melyet most egy hatalommániás nekromanta foglalt el. \n\n Úgy tűnik, hogy a trónnak vannak mágikus vagy mechanikus alkatrészei, a Törp Királynak extra ereje lehet, amikor rajta ül.
levels.citybosslevel.throne_name=Trón
levels.citylevel.bookshelf_desc=Különböző tudományterületeket bemutató könyvek sorai töltik meg a könyvespolcot.
levels.citylevel.deco_desc=Több csempe is hiányzik innen.
levels.citylevel.entrance_desc=Egy rámpa vezet fel a felső mélységbe.
levels.citylevel.exit_desc=Egy rámpa vezet le az alsóbb szintre.
levels.citylevel.high_grass_name=Magasan virágzó virágok
levels.citylevel.region_deco_desc=Egy megemelt talapzat, tetején élénkzöld varázslánggal. A láng olyan sűrű, hogy akár szilárd is lehetne.
levels.citylevel.region_deco_name=Lángoló talapzat
levels.citylevel.sp_desc=Vastag szőnyeg borítja a padlót.
levels.citylevel.statue_desc=A szobor egy törpét ábrázol, aki hősies pózban áll.
