levels.hallslevel.water_desc=Úgy néz ki, mint a láva, de hideg, és valószínűleg biztonságosan megérinthető.
levels.hallslevel.water_name=Hideg láva
levels.level$feeling.chasm_desc=Lépteid visszhangoznak a kazamatában.
levels.level$feeling.chasm_title=szakadékpadló
levels.level$feeling.dark_desc=Hallani lehet az ellenség mozgását a sötétben.
