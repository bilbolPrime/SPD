levels.cavesbosslevel.energy_desc=Земля тут іскрить від електрики, і наступати на неї небезпечно. _Іскри ніби тягнуться в певному напрямку..._ можливо, вони ведуть до джерела енергії?
levels.cavesbosslevel.gate_desc=Велика металева брама, що блокує шлях до гномського мегаполісу. Металева коробка в центрі видає гучний гудіння, вона має бути підключена до схеми та машин поблизу. Можливо, знищення DM-300 відкриє браму?
levels.cavesbosslevel.gate_desc_broken=Ворота, мабуть, були якимось чином пов'язані з DM-300, оскільки вони вибухнули, коли DM-300 було переможено. Тепер від них залишилися лише уламки.
levels.cavesbosslevel.gate_name=Металеві ворота
levels.cavesbosslevel.water_desc=З усією електрикою навколо вода не завжди може бути безпечною...
levels.cavesbosslevel.wires_desc=Земля тут частково розкопана, видно кілька великих оголених дротів. Вони, мабуть, з'єднують різні електричні машини разом.\n\n Через дроти має протікати струм. Якщо DM-300 ступить сюди, він може отримувати від них енергію.
levels.cavesbosslevel.wires_name=Відкрита проводка
levels.caveslevel.bookshelf_desc=Кому потрібна книжкова полиця в печері?
levels.caveslevel.entrance_desc=Драбина веде нагору, на верхню глибину.
levels.caveslevel.exit_desc=Драбина веде вниз, на нижню глибину.
levels.caveslevel.grass_name=Флуоресцентний мох
levels.caveslevel.high_grass_desc=Величезні гриби загороджують вид.
levels.caveslevel.high_grass_name=Флуоресцентні гриби
levels.caveslevel.region_deco_desc=Велика суцільнометалева споруда, ймовірно, збудована гномами, коли вони раніше видобували корисні копалини тут. Здається, що вздовж вершини видно давно невикористані колії для шахтних вагонеток.
levels.caveslevel.region_deco_name=Металева конструкція
levels.caveslevel.wall_deco_desc=На стіні видно жилу якоїсь руди. Золото?
levels.caveslevel.water_name=Крижана вода
levels.citybosslevel.summoning_desc=Цей постамент має великий отвір у центрі, який практично випромінює темну енергію. \n\nКороль гномів використовує ці постаменти як центри своєї некромантичної магії та може викликати до них міньйонів. П'єдестал повинен заряджатися протягом кількох ходів, перш ніж з'явиться міньйон, а тип міньйона, якого викликають, телеграфується магічною силою будівлі.
levels.citybosslevel.summoning_name=П'єдестал виклику
levels.citybosslevel.throne_desc=Цей вражаюче великий трон є місцем розташування імперії гномів, якою тепер править божевільний на владу некромант.\n\nСхоже, що трон має деякі магічні або механічні частини, тому Король гномів може мати додаткову силу, сидячи на ньому.
levels.citybosslevel.throne_name=Трон
levels.citylevel.bookshelf_desc=Книжкову полицю заповнюють ряди книг з різних дисциплін.
levels.citylevel.deco_desc=Тут бракує кількох плиток.
levels.citylevel.entrance_desc=Пандус веде до верхньої глибини.
levels.citylevel.exit_desc=Пандус веде вниз до нижньої глибини.
levels.citylevel.high_grass_name=Висококвітучі квіти
levels.citylevel.region_deco_desc=Піднятий постамент з яскраво-зеленим магічним полум'ям зверху. Полум'я настільки щільне, що його можна було б назвати твердим.
levels.citylevel.region_deco_name=Палаючий п'єдестал
levels.citylevel.sp_desc=Підлогу вкриває товстий килим.
levels.citylevel.statue_desc=Статуя зображує якогось карлика, що стоїть у героїчній позі.
levels.citylevel.upcoming_quest_intro_no=Залишайтеся тут
levels.citylevel.upcoming_quest_intro_title=Повідомлення розробника
levels.citylevel.upcoming_quest_intro_yes=Спустіться у сховище
levels.citylevel.water_name=Підозріло забарвлена вода
levels.features.chasm.chasm=Прірва
levels.features.chasm.jump=Ти справді хочеш стрибнути у прірву? Падіння так низько буде болісним.
levels.features.chasm.no=Ні, я передумав/передумала.
levels.features.chasm.ondeath=Ти впав на смерть...
levels.features.chasm.rankings_desc=Загинув при ударі
levels.features.chasm.yes=Так, я знаю, що роблю
levels.hallslevel.bookshelf_desc=На книжковій полиці тліють книги стародавніми мовами.
levels.hallslevel.grass_name=Ембермох
levels.hallslevel.high_grass_name=Емберфунгі
levels.hallslevel.region_deco_desc=Величезний шматок каменю, який ніби відколовся від стелі або сусідньої стіни.
levels.hallslevel.region_deco_name=Шматок щебеню
levels.hallslevel.statue_desc=Колона зроблена зі справжніх гуманоїдних черепів. Круто.
levels.hallslevel.statue_name=Стовп
levels.hallslevel.water_desc=Це схоже на лаву, але вона холодна і, ймовірно, безпечна на дотик.
levels.hallslevel.water_name=Холодна лава
levels.level$feeling.chasm_desc=Твої кроки луною лунають по підземеллю.
levels.level$feeling.chasm_title=дно прірви
levels.level$feeling.dark_desc=Ви можете чути, як вороги рухаються в темряві.
levels.level$feeling.dark_title=темна підлога
levels.level$feeling.grass_desc=У повітрі густо витає запах рослинності.
levels.level$feeling.grass_title=трав'яна підлога
levels.level$feeling.large_desc=Цей поверх підземелля здається надзвичайно великим.
levels.level$feeling.large_title=велика підлога
levels.level$feeling.secrets_desc=Атмосфера натякає на те, що цей поверх приховує багато таємниць.
levels.level$feeling.secrets_title=поверх секретів
levels.level$feeling.traps_desc=Земля тут здається особливо підступною.
levels.level$feeling.traps_title=підлога для пасток
levels.level$feeling.water_desc=Ти чуєш, як навколо тебе плескається вода.
levels.level$feeling.water_title=водяна підлога
levels.level.alchemy_desc=Цей горщик наповнений чарівною водою. У горщику можна змішувати різні предмети, щоб створити щось нове!
levels.level.alchemy_name=алхімічний горщик
levels.level.barricade_desc=Дерев'яна барикада міцно встановлена, але з роками висохла. Чи може вона згоріти?
levels.level.barricade_name=Барикада
levels.level.bookshelf_name=Книжкова полиця
levels.level.chasm_desc=Дна не видно.
levels.level.chasm_name=Прірва
levels.level.closed_door_name=Зачинені двері
levels.level.crystal_door_desc=Ці замкнені двері зроблені з магічного кришталю. Ви можете бачити крізь них, але вам знадобиться кришталевий ключ, щоб їх відчинити.
levels.level.crystal_door_name=Кришталеві двері
levels.level.default_name=???
levels.level.embers_desc=Підлогу вкриває вугілля.
levels.level.embers_name=Вугілля
levels.level.empty_well_desc=Криниця висохла.
levels.level.empty_well_name=Порожній колодязь
levels.level.entrace_name=Глибина входу
levels.level.entrance_desc=Сходи ведуть на верхню глибину.
levels.level.exit_desc=Сходи ведуть вниз, на нижню глибину.
levels.level.exit_name=Вихід на глибину
levels.level.floor_name=Підлога
levels.level.furrowed_grass_name=Борозниста рослинність
levels.level.grass_name=Трава
levels.level.hidden_trap=Прихований %s активується!
levels.level.high_grass_desc=Густа рослинність загороджує огляд.
levels.level.high_grass_name=Висока трава
levels.level.inactive_trap_desc=Пастка вже спрацьовувала раніше, і вона більше не небезпечна.
levels.level.inactive_trap_name=Пастка, що спрацьовує
levels.level.locked_door_desc=Ці двері замкнені, тобі потрібен відповідний ключ, щоб їх відімкнути.
levels.level.locked_door_name=Замкнені двері
levels.level.locked_exit_desc=Важкі ґрати блокують сходи, що ведуть вниз.
levels.level.locked_exit_name=Вихід із заблокованою глибиною
levels.level.open_door_name=Відчинені двері
levels.level.pedestal_name=П'єдестал
levels.level.statue_desc=Хтось хотів прикрасити це місце, але, очевидно, не вийшло.
levels.level.statue_name=Статуя
levels.level.unlocked_exit_name=Вихід з розблокованої глибини
levels.level.wall_name=Стіна
levels.level.water_desc=У разі пожежі ступіть у воду, щоб загасити вогонь.
levels.level.water_name=Вода
levels.level.well_name=Ну
levels.mininglevel.barricade_desc=Дерев'яна барикада міцно встановлена та слугує опорою для стелі.\n\nЇї, ймовірно, збудували гноли, щоб забезпечити певний захист від падіння каміння. _Будь-які сусідні комірки будуть захищені від пасток та атак каменепадів._\n\nСхоже, що вона горітиме так само добре, як і будь-яка інша барикада.
levels.mininglevel.boulder_desc=Шлях блокує великий валун. Його має бути досить легко розбити киркою.
levels.mininglevel.boulder_name=Боулдер
levels.mininglevel.crystal_desc=Тут є великий та барвистий виступ кристалів. Ці кристали крихкі та їх легко розбити киркою, або ж вони розіб'ються, якщо поруч щось видобувати.
levels.mininglevel.crystal_name=Кришталевий шип
levels.mininglevel.gold_extra_desc=Ви, мабуть, зможете видобути його своєю киркою.
levels.mininglevel.wall_desc=Гладка кам'яна стіна, трохи м'якша, ніж зазвичай. Ви можете пробити її киркою, але це вимагатиме певних зусиль і трохи посилить ваш голод.
levels.prisonlevel.bookshelf_desc=Це, мабуть, залишки тюремної бібліотеки. Чи може вона згоріти?
levels.prisonlevel.empty_deco_desc=На підлозі є старі плями крові.
levels.prisonlevel.region_deco_alt_desc=Металева клітка, достатньо велика, щоб умістити людину. Вона висить над глибокою прірвою, підвішена ланцюгом.
levels.prisonlevel.region_deco_alt_name=Підвісна клітка
levels.prisonlevel.region_deco_desc=Металева клітка, достатньо велика, щоб вмістити людину. Здається, вона якимось чином прикріплена до землі, її не можна зрушити з місця.
levels.prisonlevel.region_deco_name=Тюремна клітка
levels.prisonlevel.water_name=Темна холодна вода
levels.rooms.quest.ambitiousimproom$questentrance.desc=Ця зловісна яма, схоже, є входом до якогось стародавнього гном'ячого склепіння. Магічний бар'єр перешкоджає входу, по ньому можна пройти, ніби тут підлога.
levels.rooms.quest.ambitiousimproom$questentrance.name=Вхід до сховища
levels.rooms.quest.blacksmithroom$questentrance.desc=Ця драбина веде до старої шахти трохи нижче ковальської майстерні.
levels.rooms.quest.blacksmithroom$questentrance.name=Вхід до шахти
levels.rooms.quest.massgraveroom$bones.desc=Кістки валяються на підлозі, що тут сталося?
levels.rooms.quest.massgraveroom$bones.name=Братська могила
levels.rooms.quest.mineentrance$questexit.desc=Ця драбина веде з шахти назад до ковальської майстерні.
levels.rooms.quest.mineentrance$questexit.name=Вихід з шахти
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Намальований маркер для якогось темного ритуалу. Свічки зазвичай розміщують на чотирьох кутах.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ритуальний маркер
levels.rooms.special.magicalfireroom$eternalfire.desc=Тут стіна густого яскраво-зеленого вогню, ймовірно, створена магією. Вона настільки густа, що крізь неї неможливо пройти, і вона запалює все, що підійде надто близько. Вона не має жодних ознак природного горіння, вам потрібно буде використати щось, щоб її загасити.
levels.rooms.special.sentryroom$sentry.desc=Цей криваво-червоний вартовий, здається, розташований тут, щоб охороняти скарб на іншому кінці цієї кімнати. Він стрілятиме у вас променями магії розпаду, якщо ви ступите в область, яку він захищає.\n\nВін має імунітет до всіх шкідливих ефектів і може бачити крізь невидимість, але, здається, йому потрібен деякий час, щоб зарядитися, перш ніж він почне стріляти.\n\nЯкимось чином вартовий хоче стріляти лише у вас, ніби він знає, що мешканці підземелля не становлять загрози для скарбу.
levels.rooms.special.sentryroom$sentry.discover_hint=Ви можете знайти цього ворога будь-де в підземеллі.
levels.rooms.special.sentryroom$sentry.name=червоний вартовий
levels.rooms.special.toxicgasroom$toxicvent.desc=Мабуть, якийсь необережний шукач пригод активував цю пастку давним-давно. Незважаючи на неактивний стан, вона все ще викидає токсичний газ у кімнату і не показує жодних ознак зупинки. Вам знадобиться якийсь спосіб запобігти пошкодженню від газу, якщо ви хочете дослідити цю кімнату.
levels.rooms.special.toxicgasroom$toxicvent.name=токсичний вентиляційний отвір
levels.rooms.special.weakfloorroom$hiddenwell.desc=Ви ледь помітно розгледіли криницю в глибині внизу, можливо, там щось є?
levels.rooms.special.weakfloorroom$hiddenwell.name=далека криниця
levels.sewerlevel.bookshelf_desc=Книжкова полиця завалена дешевими непотрібними книжками. Може, вона згорить?
levels.sewerlevel.empty_deco_desc=Підлогу вкриває мокрий жовтуватий мох.
levels.sewerlevel.region_deco_desc=Міцна бочка, майже така ж велика, як ти. Вона, мабуть, чогось повна, її надто важко зрушити з місця.
levels.sewerlevel.region_deco_name=Бочка для зберігання
levels.sewerlevel.water_name=Каламутна вода
levels.traps.alarmtrap.alarm=Пастка видає пронизливий звук, який луною розноситься по всьому підземеллю!
levels.traps.alarmtrap.desc=Ця пастка, схоже, пов'язана з гучним сигналом тривоги. Його спрацювання, ймовірно, сповістить про все на рівні.
levels.traps.alarmtrap.name=пастка сигналізації
levels.traps.blazingtrap.desc=Наступ на цю пастку призведе до запалювання потужної хімічної суміші, яка підпалить велику площу.
levels.traps.blazingtrap.name=палаюча пастка
levels.traps.burningtrap.desc=Наступ на цю пастку призведе до запалення хімічної суміші, що підпалить навколишню територію.
levels.traps.burningtrap.name=палаюча пастка
levels.traps.chillingtrap.desc=Після активації хімічні речовини в цій пастці швидко заморожують повітря навколо її розташування.
levels.traps.chillingtrap.name=холодна пастка
levels.traps.confusiontrap.desc=Спрацювання цієї пастки призведе до вивільнення хмари газу, що викликає замішання, в безпосередній близькості.
levels.traps.confusiontrap.name=пастка газу плутанини
levels.traps.corrosiontrap.desc=Спрацювання цієї пастки призведе до утворення хмари смертельно небезпечного кислого газу в безпосередній близькості.
levels.traps.corrosiontrap.name=пастка для корозійних газів
levels.traps.cursingtrap.curse=Ваше зношене спорядження стає проклятим!
levels.traps.cursingtrap.desc=Ця пастка містить ту саму зловісну магію, що й прокляте спорядження. Її активація прокляне деякі предмети поблизу.
levels.traps.cursingtrap.name=пастка для прокльонів
levels.traps.disarmingtrap.desc=Ця пастка містить дуже специфічну магію телепортації, яка деформує зброю жертви в якесь інше місце.
levels.traps.disarmingtrap.disarm=Вашу зброю телепортують геть!
levels.traps.disarmingtrap.name=роззброююча пастка
levels.traps.disintegrationtrap.desc=Після спрацювання ця пастка пронизує найближчу ціль променями розпаду, завдаючи значної шкоди та знищуючи предмети. \n\nНа щастя, механізм спрацьовування не прихований.
levels.traps.disintegrationtrap.name=пастка розпаду
levels.traps.disintegrationtrap.ondeath=Тебе вбила пастка розпаду...
levels.traps.disintegrationtrap.one=Пастка розпадається на ваш %s!
levels.traps.disintegrationtrap.some=Пастка розпадається на частину твого %s!
levels.traps.distortiontrap.desc=Побудована за допомогою дивної магії невідомого походження, ця пастка призватиме всіляких істот до цього місця.
levels.traps.distortiontrap.name=пастка спотворень
levels.traps.explosivetrap.desc=Ця пастка містить порошкоподібну вибухівку та спусковий механізм. Її активація спричинить вибух у безпосередній близькості.
levels.traps.explosivetrap.name=вибухова пастка
levels.traps.flashingtrap.desc=Після активації ця пастка запалює потужний спалахуючий порошок, що зберігається всередині, тимчасово засліплюючи, калічачи та травмуючи свою жертву. \n\nПастка повинна мати великий запас пороху, оскільки вона може активуватися багато разів, не ламаючись.
levels.traps.flashingtrap.name=миготлива пастка
levels.traps.flocktrap.desc=Можливо, жарт якогось мага-аматора: активація цієї пастки створить отару магічних овець.
levels.traps.flocktrap.name=пастка для зграї
levels.traps.frosttrap.desc=Після активації хімічні речовини в цій пастці швидко заморожують повітря в широкому діапазоні навколо свого місця розташування.
levels.traps.frosttrap.name=морозну пастку
levels.traps.gatewaytrap.desc=Ця спеціальна телепортаційна пастка може активуватися нескінченну кількість разів і завжди телепортується в одне й те саме місце.
levels.traps.gatewaytrap.name=пастка-шлюз
levels.traps.geysertrap.desc=Коли ця пастка спрацює, вона вивергне гейзер води, який завдасть шкоди вогняним ворогам, знесе всіх персонажів поблизу, загасить пожежі та перетворить навколишню місцевість на воду.
levels.traps.geysertrap.name=гейзерна пастка
levels.traps.gnollrockfalltrap.desc=Ця пастка для каменепадів створена з певною формою магічної допомоги. Коли вона спрацьовує, каміння розхитується та одразу падає зверху в області 5x5 навколо неї. Через м'якше каміння в цій області вона не завдасть стільки шкоди, як звичайна пастка для каменепадів, але ваша броня також не буде ефективною проти неї. Камені також не падатимуть у місцях із сусідньою барикадою, оскільки вони допомагають утримувати стелю.\n\n_Ця пастка не може відрізнити друга від ворога, тому вона така ж шкідлива як для гнолів, так і для вас._
levels.traps.gnollrockfalltrap.name=пастка для гнолів-кам'яних обвалів
levels.traps.grimtrap.desc=У цій пастці зберігається надзвичайно потужна руйнівна магія, достатня для миттєвого вбивства всіх героїв, крім найздоровіших. Її активація відправить дальній вибух смертельної магії в напрямку найближчого персонажа. \n\nНа щастя, механізм спуску не прихований.
levels.traps.grimtrap.name=похмура пастка
levels.traps.grimtrap.ondeath=Тебе вбив вибух похмурої пастки...
levels.traps.grippingtrap.desc=Ця пастка чіпляється за ноги того, хто її активує, пошкоджуючи його та уповільнюючи його рухи. \n\nЗавдяки своїй простій природі, ця пастка може активуватися багато разів, не ламаючись.
levels.traps.grippingtrap.name=захоплююча пастка
levels.traps.guardiantrap$guardian.desc=Це синє привидіння здається викликаним відлунням одного з кам'яних охоронців підземелля.
levels.traps.guardiantrap$guardian.desc_weapon=Хоча сама статуя майже безтілесна, _%s_, яким вона тримає, виглядає справжньою.
levels.traps.guardiantrap$guardian.discover_hint=Ви можете знайти цього ворога за допомогою спеціальної пастки.
levels.traps.guardiantrap$guardian.name=викликаний опікун
levels.traps.guardiantrap.alarm=Пастка видає пронизливий звук, який луною розноситься по всьому підземеллю!
levels.traps.guardiantrap.desc=Ця пастка пов'язана з дивним магічним механізмом, який викликатиме охоронців і попередить усіх ворогів на поверсі.
levels.traps.guardiantrap.name=пастка охоронця
levels.traps.oozetrap.desc=Ця пастка при активації вибризкуватиме їдкий слиз, який горітиме, доки його не змиють.
levels.traps.oozetrap.name=пастка для мулу
levels.traps.pitfalltrap.desc=Ця пастка з'єднана з великим механізмом люка, і невдовзі після його спрацювання все, що опиниться поруч із нею, прослизне крізь землю та впаде! Однак вона не працюватиме в місцях з особливо твердою підлогою.
levels.traps.pitfalltrap.name=пастка-підводний камінь
levels.traps.pitfalltrap.no_pit=Ґрунт надто твердий, щоб тут спрацювала пастка.
levels.traps.pitfalltrap.triggered=Земля починає прогинатися навколо спрацювала пастки!
levels.traps.pitfalltrap.triggered_hero=Земля навколо тебе починає руйнуватися!
levels.traps.poisondarttrap.desc=Неподалік має бути захований невеликий дротик-дувка, активація цієї пастки змусить її вистрілити отруєним дротиком у найближчу ціль. \n\nНа щастя, спусковий механізм не прихований.
levels.traps.poisondarttrap.name=пастка для отруйних стріл
levels.traps.poisondarttrap.ondeath=Тебе вбила пастка з отруйними дротиками...
levels.traps.rockfalltrap.desc=Ця пастка з'єднана з низкою вільних каменів зверху, і якщо її активувати, вони впадуть на всю кімнату! Якщо пастка не знаходиться в певній кімнаті, каміння падатиме навколо пастки. \n\nНа щастя, спусковий механізм не прихований.
levels.traps.rockfalltrap.name=пастка для каменепадів
levels.traps.rockfalltrap.ondeath=Тебе розчавила пастка з каменепадом...
levels.traps.shockingtrap.desc=Механізм з великою кількістю накопиченої енергії. Активація цієї пастки призведе до розрядки цієї енергії в поле навколо неї.
levels.traps.shockingtrap.name=шокуюча пастка
levels.traps.stormtrap.desc=Механізм, у якому накопичена величезна кількість енергії. Запуск цієї пастки призведе до розрядки цієї енергії у велику електричну бурю.
levels.traps.stormtrap.name=штормова пастка
levels.traps.summoningtrap.desc=Активація цієї пастки призведе до появи кількох монстрів цієї області в цьому місці.
levels.traps.summoningtrap.name=пастка для викликання
levels.traps.teleportationtrap.desc=Щоразу, коли ця пастка спрацьовує, все навколо неї телепортується у випадкові місця на цьому поверсі.
levels.traps.teleportationtrap.name=телепортаційна пастка
levels.traps.tengudarttrap.desc=Тенгу явно готувався до бою. Ця пастка активує прихований дротик, який вистрілить отруйною дротиком у найближчу річ, окрім Тенгу.\n\nПастка настільки добре зроблена, що спусковий механізм неможливо виявити без магічної допомоги. Однак пастку видно на мить, коли її встановлюють.
levels.traps.toxictrap.desc=Спрацювання цієї пастки призведе до утворення хмари токсичного газу в навколишньому просторі.
levels.traps.toxictrap.name=пастка для токсичних газів
levels.traps.trap.discover_hint=Ви можете знайти цю пастку випадковим чином у підземеллі. У кожному регіоні можуть з'явитися різні пастки.
levels.traps.trap.rankings_desc=Убитий: %s
levels.traps.warpingtrap.desc=Ця пастка схожа на пастку для телепортації, але також призведе до втрати героя знання про планування поверху!
levels.traps.warpingtrap.name=деформаційна пастка
levels.traps.weakeningtrap.desc=Темна магія в цій пастці висмоктує енергію з усього, що з нею стикається. Однак могутні вороги можуть чинити опір цьому ефекту.
levels.traps.weakeningtrap.name=ослаблююча пастка
levels.traps.worndarttrap.desc=Неподалік має бути захований невеликий дротик, активація цієї пастки змусить його стріляти в найближчу ціль. \n\nЗавдяки своєму віку він не дуже шкідливий, його навіть не заховано...
levels.traps.worndarttrap.name=зношена пастка для дротиків
levels.traps.worndarttrap.ondeath=Тебе вбила зношена пастка для дротиків...
levels.vaultlevel$vaultflametrap.desc=Здається, що з цього вентиляційного отвору через певні проміжки часу виходять зелені язики полум'я. _Оскільки це лише тестова зона, полум'я з вентиляційних отворів насправді вам не зашкодить._
levels.vaultlevel$vaultflametrap.name=вентиляційний отвір полум'я сховища

levels.level.sign_desc=Звідси текст прочитати не можна.
levels.level.sign_name=Знак
