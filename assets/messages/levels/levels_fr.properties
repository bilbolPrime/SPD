levels.cavesbosslevel.energy_desc=Le sol ici produit des étincelles d'électricité, et il est dangereux de marcher dessus. les étincelles semblent graviter dans une certaine direction... Peut-être qu'elles mènent à la source d'énergie ?
levels.cavesbosslevel.gate_desc=Une grande porte métallique qui bloque le chemin vers la métropole naine. La boîte métallique au centre produit un fort bourdonnement, elle doit être connectée aux circuits et aux machines à proximité. Peut-être que la destruction du DM-300 ouvrira la porte ?
levels.cavesbosslevel.gate_desc_broken=Le portail devait être lié à DM-300 d'une manière ou d'une autre, car il a explosé lorsque DM-300 a été vaincu. Il ne reste plus que des morceaux brisés.
levels.cavesbosslevel.gate_name=Porte métallique
levels.cavesbosslevel.water_desc=Avec toute l'électricité qu'il y a ici, l'eau n'est peut-être pas toujours sûre...
levels.cavesbosslevel.wires_desc=Le sol est partiellement creusé ici, ce qui laisse apparaître de gros fils électriques. Ils doivent relier les différentes machines électriques entre elles.\n\nLes fils doivent être parcourus par du courant. Si DM-300 s'approche de ces fils, il pourra peut-être les alimenter.
levels.cavesbosslevel.wires_name=Câblage exposé
levels.caveslevel.bookshelf_desc=Qui aurait besoin d'une bibliothèque dans une grotte ?
levels.caveslevel.entrance_desc=L'échelle permet d'accéder à la profondeur supérieure.
levels.caveslevel.exit_desc=L'échelle permet de descendre à la profondeur inférieure.
levels.caveslevel.grass_name=Mousse fluorescente
levels.caveslevel.high_grass_desc=D'énormes champignons bloquent la vue.
levels.caveslevel.high_grass_name=Champignons fluorescents
levels.caveslevel.region_deco_desc=Une grande structure entièrement métallique, probablement construite par les nains lorsqu'ils exploitaient cet endroit. On croit apercevoir des rails de charrettes minières inutilisés depuis longtemps qui courent le long du sommet.
levels.caveslevel.region_deco_name=Structure métallique
levels.caveslevel.wall_deco_desc=Une veine de minerai est visible sur le mur. De l'or ?
levels.caveslevel.water_name=Congélation de l'eau froide
levels.citybosslevel.summoning_desc=Ce piédestal présente une grande ouverture en son centre, qui rayonne pratiquement d'énergie noire.\n\nLe roi des nains utilise ces piédestaux comme points focaux pour sa magie nécromantique, et peut y invoquer des serviteurs. Le piédestal doit se charger pendant quelques tours avant que le serviteur n'apparaisse, et le type de serviteur invoqué est indiqué par la puissance magique de la construction.
levels.citybosslevel.summoning_name=Piédestal d'invocation
levels.citybosslevel.throne_desc=Ce trône d'une taille impressionnante est le siège de l'empire nain, aujourd'hui repris par un nécromancien assoiffé de pouvoir.\n\nLe trône semble comporter des éléments magiques ou mécaniques, et le roi des nains peut bénéficier de pouvoirs supplémentaires lorsqu'il s'y assoit.
levels.citybosslevel.throne_name=Trône
levels.citylevel.bookshelf_desc=Les rangées de livres sur différentes disciplines remplissent l'étagère.
levels.citylevel.deco_desc=Plusieurs tuiles manquent ici.
levels.citylevel.entrance_desc=Une rampe permet d'accéder à la profondeur supérieure.
levels.citylevel.exit_desc=Une rampe permet de descendre à la profondeur inférieure.
levels.citylevel.high_grass_name=Fleurs à forte floraison
levels.citylevel.region_deco_desc=Un piédestal surélevé surmonté d'une flamme magique d'un vert éclatant. La flamme est si dense qu'elle pourrait être solide.
levels.citylevel.region_deco_name=Piédestal enflammé
levels.citylevel.sp_desc=Le sol est recouvert d'une épaisse moquette.
levels.citylevel.statue_desc=La statue représente un nain debout dans une posture héroïque.
levels.citylevel.upcoming_quest_intro_no=Restez ici
levels.citylevel.upcoming_quest_intro_title=Message du développeur
levels.citylevel.upcoming_quest_intro_yes=Descendre dans la voûte
levels.citylevel.water_name=Eau de couleur suspecte
levels.features.chasm.chasm=Le gouffre
levels.features.chasm.jump=Voulez-vous vraiment sauter dans le gouffre ? Une chute aussi lointaine sera douloureuse.
levels.features.chasm.no=Non, j'ai changé d'avis
levels.features.chasm.ondeath=Vous êtes tombé raide mort...
levels.features.chasm.rankings_desc=Mort à l'impact
levels.features.chasm.yes=Oui, je sais ce que je fais
levels.hallslevel.bookshelf_desc=Des livres en langues anciennes couvent sur l'étagère.
levels.hallslevel.grass_name=La mousse de sphaigne
levels.hallslevel.high_grass_name=Emberfungi
levels.hallslevel.region_deco_desc=Un énorme morceau de pierre qui semble s'être détaché du plafond ou d'un mur voisin.
levels.hallslevel.region_deco_name=Morceaux de décombres
levels.hallslevel.statue_desc=Le pilier est fait de vrais crânes d'humanoïdes. Génial.
levels.hallslevel.statue_name=Pilier
levels.hallslevel.water_desc=Cela ressemble à de la lave, mais c'est froid et il n'y a probablement aucun danger à la toucher.
levels.hallslevel.water_name=La lave froide
levels.level$feeling.chasm_desc=Vos pas résonnent dans le donjon.
levels.level$feeling.chasm_title=fond du gouffre
levels.level$feeling.dark_desc=Vous pouvez entendre les ennemis se déplacer dans l'obscurité.
levels.level$feeling.dark_title=sol sombre
levels.level$feeling.grass_desc=L'odeur de la végétation est très présente dans l'air.
levels.level$feeling.grass_title=sol en herbe
levels.level$feeling.large_desc=Le sol de ce donjon semble inhabituellement grand.
levels.level$feeling.large_title=grand plancher
levels.level$feeling.secrets_desc=L'atmosphère laisse présager que cet étage cache de nombreux secrets.
levels.level$feeling.secrets_title=étage des secrets
levels.level$feeling.traps_desc=Le sol semble particulièrement traître à cet endroit.
levels.level$feeling.traps_title=plancher des pièges
levels.level$feeling.water_desc=Vous entendez des éclaboussures d'eau autour de vous.
levels.level$feeling.water_title=plancher d'eau
levels.level.alchemy_desc=Ce pot est rempli d'eau magique. Les objets peuvent être mélangés dans le pot pour créer quelque chose de nouveau !
levels.level.alchemy_name=pot d'alchimie
levels.level.barricade_desc=La barricade en bois est solidement fixée, mais elle a séché au fil des ans. Risque-t-elle de brûler ?
levels.level.barricade_name=Barricade
levels.level.bookshelf_name=Bibliothèque
levels.level.chasm_desc=On ne voit pas le fond.
levels.level.chasm_name=Le gouffre
levels.level.closed_door_name=Porte fermée
levels.level.crystal_door_desc=Cette porte verrouillée est faite de cristal magique. Vous pouvez voir à travers, mais vous aurez besoin d'une clé de cristal pour l'ouvrir.
levels.level.crystal_door_name=Porte en cristal
levels.level.default_name=? ??
levels.level.embers_desc=Des braises recouvrent le sol.
levels.level.embers_name=La braise
levels.level.empty_well_desc=Le puits est à sec.
levels.level.empty_well_name=Puits vide
levels.level.entrace_name=Entrée en profondeur
levels.level.entrance_desc=Des escaliers mènent à la profondeur supérieure.
levels.level.exit_desc=Des escaliers mènent à la profondeur inférieure.
levels.level.exit_name=Sortie en profondeur
levels.level.floor_name=Plancher
levels.level.furrowed_grass_name=Végétation sillonnée
levels.level.grass_name=L'herbe
levels.level.hidden_trap=Un %s caché s'active !
levels.level.high_grass_desc=Une végétation dense bloque la vue.
levels.level.high_grass_name=Herbe haute
levels.level.inactive_trap_desc=Le piège a déjà été déclenché et il n'est plus dangereux.
levels.level.inactive_trap_name=Piège déclenché
levels.level.locked_door_desc=Cette porte est verrouillée, vous avez besoin d'une clé correspondante pour la déverrouiller.
levels.level.locked_door_name=Porte verrouillée
levels.level.locked_exit_desc=De lourdes barres bloquent les escaliers menant à la descente.
levels.level.locked_exit_name=Sortie en profondeur verrouillée
levels.level.open_door_name=Porte ouverte
levels.level.pedestal_name=Piédestal
levels.level.sign_desc=Vous ne pouvez pas lire le texte d'ici.
levels.level.sign_name=Panneau
levels.level.statue_desc=Quelqu'un a voulu orner cet endroit, mais n'y est pas parvenu, manifestement.
levels.level.statue_name=Statue
levels.level.unlocked_exit_name=Sortie de profondeur déverrouillée
levels.level.wall_name=Mur
levels.level.water_desc=En cas de brûlure, plongez dans l'eau pour éteindre le feu.
levels.level.water_name=L'eau
levels.level.well_name=Bien
levels.mininglevel.barricade_desc=La barricade en bois est solidement fixée et sert de support au plafond.\n\nElle a probablement été construite par les gnolls pour offrir une certaine protection contre les chutes de pierres. toutes les cellules adjacentes seront protégées contre les pièges et les attaques de chutes de pierres\n\nOn dirait qu'elle brûlerait aussi bien que n'importe quelle autre barricade.
levels.mininglevel.boulder_desc=Un gros rocher bloque le chemin. Il devrait être assez facile à briser à l'aide d'une pioche.
levels.mininglevel.boulder_name=Boulder
levels.mininglevel.crystal_desc=Il y a ici un grand affleurement de cristaux colorés. Ces cristaux sont fragiles et peuvent facilement être cassés avec une pioche, ou se briseront si quelque chose est extrait à côté.
levels.mininglevel.crystal_name=Pointes de cristal
levels.mininglevel.gold_extra_desc=Vous pouvez probablement l'extraire à l'aide de votre pioche.
levels.mininglevel.wall_desc=Un mur de roches lisses un peu moins dures que d'habitude. Vous pouvez la traverser à l'aide de votre pioche, mais cela vous demandera un certain effort et augmentera un peu votre faim.
levels.prisonlevel.bookshelf_desc=Il s'agit probablement d'un vestige de la bibliothèque d'une prison. Pourrait-elle brûler ?
levels.prisonlevel.empty_deco_desc=Il y a de vieilles taches de sang sur le sol.
levels.prisonlevel.region_deco_alt_desc=Une cage métallique juste assez grande pour contenir une personne. Elle est suspendue par une chaîne au-dessus d'un gouffre profond.
levels.prisonlevel.region_deco_alt_name=Cage suspendue
levels.prisonlevel.region_deco_desc=Une cage métallique juste assez grande pour contenir une personne. Elle semble être fixée au sol d'une manière ou d'une autre, on ne peut pas la déplacer.
levels.prisonlevel.region_deco_name=Cage de prison
levels.prisonlevel.water_name=Eau froide foncée
levels.rooms.quest.ambitiousimproom$questentrance.desc=Cette fosse sinistre semble être l'entrée d'un ancien coffre-fort nain. Une barrière magique empêche d'y pénétrer, mais on peut marcher dessus comme s'il y avait un sol.
levels.rooms.quest.ambitiousimproom$questentrance.name=Entrée de la chambre forte
levels.rooms.quest.blacksmithroom$questentrance.desc=Cette échelle mène à une ancienne mine située juste en dessous de l'atelier du forgeron.
levels.rooms.quest.blacksmithroom$questentrance.name=Entrée de la mine
levels.rooms.quest.massgraveroom$bones.desc=Des os jonchent le sol, que s'est-il passé ici ?
levels.rooms.quest.massgraveroom$bones.name=Fosse commune
levels.rooms.quest.mineentrance$questexit.desc=Cette échelle permet de sortir de la mine et de retourner dans l'atelier du forgeron.
levels.rooms.quest.mineentrance$questexit.name=Sortie de la mine
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Un marqueur peint pour un sombre rituel. Des bougies sont généralement placées aux quatre coins.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Marqueur rituel
levels.rooms.special.magicalfireroom$eternalfire.desc=Un mur de feu dense et vert vif est ici, apparemment causé par la magie. Il est si dense qu'il est impossible de le traverser, et il enflamme tout ce qui s'en approche de trop près. Il ne montre aucun signe de combustion naturelle, vous devrez utiliser quelque chose pour l'éteindre.
levels.rooms.special.sentryroom$sentry.desc=Cette sentinelle rouge sang semble avoir été placée ici pour garder le trésor à l'autre bout de la pièce. Elle tirera des rayons de magie de désintégration sur vous si vous marchez dans la zone qu'elle défend.\n\nElle est immunisée contre tous les effets néfastes et peut voir à travers l'invisibilité, mais il lui faut un certain temps pour se recharger avant de commencer à tirer.\n\nD'une manière ou d'une autre, la sentinelle ne veut tirer que sur vous, comme si elle savait que les habitants du donjon ne sont pas une menace pour le trésor.
levels.rooms.special.sentryroom$sentry.discover_hint=Vous pouvez trouver cet ennemi n'importe où dans le donjon.
levels.rooms.special.sentryroom$sentry.name=sentinelle rouge
levels.rooms.special.toxicgasroom$toxicvent.desc=Un aventurier imprudent a dû déclencher ce piège il y a bien longtemps. Malgré son état inactif, il crache toujours du gaz toxique dans la pièce et ne montre aucun signe d'arrêt. Vous devrez trouver un moyen d'éviter les dégâts causés par le gaz si vous voulez explorer cette pièce.
levels.rooms.special.toxicgasroom$toxicvent.name=évent toxique
levels.rooms.special.weakfloorroom$hiddenwell.desc=On distingue un puits dans les profondeurs, il y a peut-être quelque chose là-dessous ?
levels.rooms.special.weakfloorroom$hiddenwell.name=puits éloigné
levels.sewerlevel.bookshelf_desc=L'étagère est remplie de livres inutiles et bon marché. Risque-t-elle de brûler ?
levels.sewerlevel.empty_deco_desc=De la mousse jaunâtre humide recouvre le sol.
levels.sewerlevel.region_deco_desc=Un tonneau solide qui est presque aussi grand que toi. Il doit être rempli d'une chose ou d'une autre, il est trop lourd pour être déplacé.
levels.sewerlevel.region_deco_name=Tonneau de stockage
levels.sewerlevel.water_name=Eau trouble
levels.traps.alarmtrap.alarm=Le piège émet un son perçant qui résonne dans tout le donjon !
levels.traps.alarmtrap.desc=Ce piège semble être lié à un mécanisme d'alarme bruyant. Son déclenchement alertera probablement tout le monde au niveau.
levels.traps.alarmtrap.name=piège d'alarme
levels.traps.blazingtrap.desc=En marchant sur ce piège, un puissant mélange chimique s'enflamme, embrasant une large zone.
levels.traps.blazingtrap.name=piège flamboyant
levels.traps.burningtrap.desc=En marchant sur ce piège, un mélange chimique s'enflamme et met le feu à la zone environnante.
levels.traps.burningtrap.name=piège à feu
levels.traps.chillingtrap.desc=Lorsqu'il est activé, les produits chimiques contenus dans ce piège gèlent rapidement l'air autour de son emplacement.
levels.traps.chillingtrap.name=piège à froid
levels.traps.confusiontrap.desc=Le déclenchement de ce piège entraîne la libération d'un nuage de gaz de confusion dans les environs immédiats.
levels.traps.confusiontrap.name=piège à gaz de confusion
levels.traps.corrosiontrap.desc=Le déclenchement de ce piège libère un nuage de gaz acide mortel dans les environs immédiats.
levels.traps.corrosiontrap.name=piège à gaz corrosifs
levels.traps.cursingtrap.curse=Votre équipement usé devient maudit !
levels.traps.cursingtrap.desc=Ce piège contient la même magie malveillante que celle des équipements maudits. En le déclenchant, vous maudirez certains objets dans la zone immédiate.
levels.traps.cursingtrap.name=piège à malédiction
levels.traps.disarmingtrap.desc=Ce piège contient une magie de téléportation très spécifique, qui déforme l'arme de sa victime vers un autre endroit.
levels.traps.disarmingtrap.disarm=Votre arme est téléportée !
levels.traps.disarmingtrap.name=désarmement du piège
levels.traps.disintegrationtrap.desc=Lorsqu'il est déclenché, ce piège lance des rayons de désintégration sur la cible la plus proche, infligeant d'importants dégâts et détruisant les objets.\n\nHeureusement, le mécanisme de déclenchement n'est pas caché.
levels.traps.disintegrationtrap.name=piège à désintégration
levels.traps.disintegrationtrap.ondeath=Vous avez été tué par le piège de désintégration...
levels.traps.disintegrationtrap.one=Le piège désintègre votre %s !
levels.traps.disintegrationtrap.some=Le piège désintègre une partie de votre %s !
levels.traps.distortiontrap.desc=Fabriqué à partir d'une étrange magie d'origine inconnue, ce piège permet d'invoquer toutes sortes de créatures à cet endroit.
levels.traps.distortiontrap.name=piège à distorsion
levels.traps.explosivetrap.desc=Ce piège contient de la poudre explosive et un mécanisme de déclenchement. En l'activant, vous provoquerez une explosion dans les environs immédiats.
levels.traps.explosivetrap.name=piège explosif
levels.traps.flashingtrap.desc=Lorsqu'il est activé, ce piège enflamme une puissante poudre clignotante stockée à l'intérieur, ce qui aveugle, paralyse et blesse temporairement la victime.\n\nLe piège doit contenir une grande quantité de poudre, car il peut s'activer plusieurs fois sans se briser.
levels.traps.flashingtrap.name=piège à clignotement
levels.traps.flocktrap.desc=Il s'agit peut-être d'une plaisanterie d'un mage amateur, mais le déclenchement de ce piège créera un troupeau de moutons magiques.
levels.traps.flocktrap.name=piège à troupeaux
levels.traps.frosttrap.desc=Lorsqu'ils sont activés, les produits chimiques contenus dans ce piège gèlent rapidement l'air dans un large rayon autour de son emplacement.
levels.traps.frosttrap.name=piège à givre
levels.traps.gatewaytrap.desc=Ce piège de téléportation spécial peut être activé un nombre infini de fois et téléporte toujours au même endroit.
levels.traps.gatewaytrap.name=piège de la passerelle
levels.traps.geysertrap.desc=Lorsqu'il est déclenché, ce piège fait jaillir un geyser d'eau qui endommage les ennemis enflammés, fait tomber tous les personnages proches, éteint les incendies et transforme le terrain environnant en eau.
levels.traps.geysertrap.name=piège à geyser
levels.traps.gnollrockfalltrap.desc=Ce piège à rochers est fabriqué avec une certaine forme d'assistance magique. Lorsqu'il est déclenché, les rochers se détachent et tombent immédiatement d'en haut dans une zone de 5 x 5 autour de lui. En raison des roches plus tendres de la zone, il n'infligera pas autant de dégâts qu'un piège à rochers classique, mais votre armure ne sera pas non plus efficace contre lui. Les rochers ne tomberont pas non plus dans les endroits où il y a une barricade adjacente, car ils aident à maintenir le plafond en place.\n\nce piège ne peut pas distinguer l'ami de l'ennemi, et est donc aussi nocif pour les gnolls que pour vous
levels.traps.gnollrockfalltrap.name=piège à éboulis gnoll
levels.traps.grimtrap.desc=Ce piège contient une magie destructrice extrêmement puissante, suffisante pour tuer instantanément tous les héros, à l'exception des plus sains. En le déclenchant, vous envoyez un jet de magie mortelle à distance vers le personnage le plus proche.\n\nHeureusement, le mécanisme de déclenchement n'est pas caché.
levels.traps.grimtrap.name=piège sinistre
levels.traps.grimtrap.ondeath=Vous avez été tué par l'explosion d'un piège sinistre...
levels.traps.grippingtrap.desc=Ce piège s'accroche aux pieds de celui qui le déclenche, l'endommageant et ralentissant ses mouvements.\n\nGrâce à sa simplicité, ce piège peut être activé plusieurs fois sans se briser.
levels.traps.grippingtrap.name=piège de préhension
levels.traps.guardiantrap$guardian.desc=Cette apparition bleue semble être un écho invoqué de l'un des gardiens de pierre du donjon.
levels.traps.guardiantrap$guardian.desc_weapon=Si la statue elle-même est presque incorporelle, le _%s_ qu'elle brandit semble bien réel.
levels.traps.guardiantrap$guardian.discover_hint=Vous pouvez trouver cet ennemi à l'aide d'un piège spécifique.
levels.traps.guardiantrap$guardian.name=gardien convoqué
levels.traps.guardiantrap.alarm=Le piège émet un son perçant qui résonne dans tout le donjon !
levels.traps.guardiantrap.desc=Ce piège est lié à un étrange mécanisme magique, qui invoquera des gardiens et alertera tous les ennemis à l'étage.
levels.traps.guardiantrap.name=piège à gardiens
levels.traps.oozetrap.desc=Lorsqu'il est activé, ce piège projette un liquide caustique qui brûle jusqu'à ce qu'il soit éliminé.
levels.traps.oozetrap.name=piège à boue
levels.traps.pitfalltrap.desc=Ce piège est relié à un grand mécanisme de trappe, et peu de temps après son déclenchement, tout ce qui se trouve à proximité glissera à travers le sol et tombera ! Il ne fonctionne cependant pas dans les zones où le sol est particulièrement solide.
levels.traps.pitfalltrap.name=piège à fosse
levels.traps.pitfalltrap.no_pit=le sol est trop solide pour qu'un piège puisse fonctionner ici.
levels.traps.pitfalltrap.triggered=Le sol commence à céder autour du piège déclenché !
levels.traps.pitfalltrap.triggered_hero=Le sol commence à céder autour de vous !
levels.traps.poisondarttrap.desc=Un petit lanceur de fléchettes doit être caché à proximité. En activant ce piège, il tirera une fléchette empoisonnée sur la cible la plus proche.\n\nHeureusement, le mécanisme de déclenchement n'est pas caché.
levels.traps.poisondarttrap.name=piège à fléchettes empoisonnées
levels.traps.poisondarttrap.ondeath=Vous avez été tué par le piège à fléchettes empoisonnées...
levels.traps.rockfalltrap.desc=Ce piège est relié à une série de rochers détachés situés au-dessus. En le déclenchant, les rochers s'effondreront sur toute la pièce ! Si le piège ne se trouve pas dans une pièce spécifique, les rochers tomberont dans une zone autour du piège.\n\nHeureusement, le mécanisme de déclenchement n'est pas caché.
levels.traps.rockfalltrap.name=piège à éboulis
levels.traps.rockfalltrap.ondeath=Vous avez été écrasé par le piège de l'éboulement...
levels.traps.shockingtrap.desc=Un mécanisme contenant une grande quantité d'énergie. Le déclenchement de ce piège déchargera cette énergie dans un champ autour de lui.
levels.traps.shockingtrap.name=piège choquant
levels.traps.stormtrap.desc=Un mécanisme contenant une énorme quantité d'énergie. Le déclenchement de ce piège déchargera cette énergie dans une grande tempête électrique.
levels.traps.stormtrap.name=piège à tempête
levels.traps.summoningtrap.desc=Le déclenchement de ce piège permet d'invoquer un certain nombre de monstres de la zone à cet endroit.
levels.traps.summoningtrap.name=piège à invocation
levels.traps.teleportationtrap.desc=Lorsque ce piège est déclenché, tout ce qui se trouve autour est téléporté à des endroits aléatoires de l'étage.
levels.traps.teleportationtrap.name=piège à téléportation
levels.traps.tengudarttrap.desc=Tengu s'est manifestement préparé à un combat. Ce piège activera un lanceur de fléchettes caché qui tirera une fléchette empoisonnée sur la chose la plus proche qui n'est pas Tengu.\n\nLe piège est si bien fait que le mécanisme de déclenchement est impossible à détecter sans aide magique. Cependant, le piège est visible pendant un moment lorsqu'il est en train d'être mis en place.
levels.traps.toxictrap.desc=Le déclenchement de ce piège entraîne la libération d'un nuage de gaz toxique dans la zone environnante.
levels.traps.toxictrap.name=piège à gaz toxiques
levels.traps.trap.discover_hint=Vous pouvez trouver ce piège au hasard dans le donjon. Chaque région a des pièges différents qui peuvent apparaître.
levels.traps.trap.rankings_desc=Tué par : %s
levels.traps.warpingtrap.desc=Ce piège est similaire à un piège de téléportation, mais il fait perdre au héros sa connaissance de la disposition de l'étage !
levels.traps.warpingtrap.name=piège à gauchissement
levels.traps.weakeningtrap.desc=La magie noire de ce piège aspire l'énergie de tout ce qui entre en contact avec lui. Les ennemis puissants peuvent toutefois résister à cet effet.
levels.traps.weakeningtrap.name=piège de l'affaiblissement
levels.traps.worndarttrap.desc=Un petit lanceur de fléchettes doit être caché à proximité. En activant ce piège, il tirera sur la cible la plus proche.\n\nEn raison de son âge, il n'est pas très dangereux, il n'est même pas caché...
levels.traps.worndarttrap.name=piège à fléchettes usé
levels.traps.worndarttrap.ondeath=Vous avez été tué par le piège à fléchettes usé...
levels.vaultlevel$vaultflametrap.desc=Cette bouche d'aération semble envoyer des flammes vertes à intervalles réguliers. comme ce n'est qu'une zone de test, les flammes des bouches d'aération ne vous blesseront pas
levels.vaultlevel$vaultflametrap.name=voûte flamme évent
