levels.mininglevel.barricade_desc=Ahşap barikat sağlam bir şekilde yerleştirilmiş ve tavan için destek görevi görüyor. Bu muhtemelen gnoll'lar tarafından düşen kayalara karşı bir miktar koruma sağlamak için inşa edilmişti. _Yanındaki hücreler kaya düşmesi tuzaklarından ve saldırılarından korunacaktır._ Diğer barikatlar kadar iyi yanacak gibi görünüyor.
levels.mininglevel.boulder_desc=Yolu büyük bir kaya parçası kapatmış. Kazma ile kırmak oldukça kolay olmalı.
levels.mininglevel.boulder_name=Kaya
levels.mininglevel.crystal_desc=Burada büyük ve renkli bir kristal çıkıntısı var. Bu kristaller kırılgandır ve kazma ile kolayca kırılabilir veya yanına bir şey kazılırsa kırılırlar.
levels.mininglevel.crystal_name=Kristal sivri uç
levels.mininglevel.gold_extra_desc=Büyük ihtimalle kazmanızla çıkarabilirsiniz.
levels.mininglevel.wall_desc=Normalden biraz daha yumuşak, pürüzsüz bir kaya duvarı. Kazmanızla kırabilirsiniz, ancak biraz çaba gerektirecek ve açlığınızı biraz artıracaktır.
levels.prisonlevel.bookshelf_desc=Bu muhtemelen bir hapishane kütüphanesinden kalma bir kalıntı. Yanabilir mi?
levels.prisonlevel.empty_deco_desc=Yerde eski kan lekeleri var.
levels.prisonlevel.region_deco_alt_desc=Bir insanı ancak sığdırabilecek büyüklükte metal bir kafes. Derin bir uçurumun üzerinde zincirle asılı duruyor.
levels.prisonlevel.region_deco_alt_name=Asılı kafes
levels.prisonlevel.region_deco_desc=Bir insanı sığdıracak kadar büyük metal bir kafes. Bir şekilde yere sabitlenmiş gibi görünüyor, hareket ettirilemiyor.
levels.prisonlevel.region_deco_name=Hapishane kafesi
levels.prisonlevel.water_name=Koyu soğuk su
levels.rooms.quest.ambitiousimproom$questentrance.desc=Bu uğursuz çukur, eski bir cüce mahzeninin girişi gibi görünüyor. Büyülü bir bariyer girişi engelliyor, sanki burada zemin varmış gibi üzerinden yürüyebilirsiniz.
levels.rooms.quest.ambitiousimproom$questentrance.name=Kasa Girişi
levels.rooms.quest.blacksmithroom$questentrance.desc=Bu merdiven, demirci atölyesinin hemen altındaki eski bir madene çıkıyor.
levels.rooms.quest.blacksmithroom$questentrance.name=Maden girişi
levels.rooms.quest.massgraveroom$bones.desc=Yerler kemik yığınlarıyla dolu, burada ne oldu acaba?
