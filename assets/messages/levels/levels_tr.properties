levels.cavesbosslevel.energy_desc=Buradaki zemin elektrikle kıvılcım saçıyor ve üzerine basmak tehlikeli. Kıvılcımlar belli bir yöne doğru çekiliyor gibi görünüyor... Belki de güç kaynağına doğru gidiyorlardır?
levels.cavesbosslevel.gate_desc=Cüce metropolüne giden yolu kapatan büyük bir metal kapı. Ortadaki metal kutu yüksek bir uğultu sesi çıkarıyor, muhtemelen yakındaki devreler ve makinelerle bağlantılı. Belki de DM-300'ü yok etmek kapıyı açar?
levels.cavesbosslevel.gate_desc_broken=Kapı, DM-300 ile bir şekilde bağlantılı olmalıydı, çünkü DM-300 yenildiğinde patladı. Şimdi geriye sadece kırık parçalar kaldı.
levels.cavesbosslevel.gate_name=Metal kapı
levels.cavesbosslevel.water_desc=Burada bu kadar çok elektrik varken, suyun her zaman güvenli olmayabileceği gerçeği ortada...
levels.cavesbosslevel.wires_desc=Burada toprak kısmen kazılmış ve bazı büyük, açıkta kalan teller görülüyor. Bunlar çeşitli elektrikli makineleri birbirine bağlıyor olmalı. Tellerden bir miktar akım geçiyor olmalı. Eğer DM-300 buraya adım atarsa, onlardan güç çekebilir.
levels.cavesbosslevel.wires_name=Açıkta kalan kablolar
levels.caveslevel.bookshelf_desc=Bir mağarada kimin kitaplığa ihtiyacı olur ki?
levels.caveslevel.entrance_desc=Merdiven, üst kata doğru çıkıyor.
