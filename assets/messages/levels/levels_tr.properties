levels.rooms.quest.mineentrance$questexit.desc=Bu merdiven madenden dışarı, demircinin atölyesine çıkıyor.
levels.rooms.quest.mineentrance$questexit.name=Maden çıkışı
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Karanlık bir ritüel için kullanılan boyalı bir işaret. Genellikle dört köşeye mum yerleştirilir.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Ritüel işaretleyici
levels.rooms.special.magicalfireroom$eternalfire.desc=Burada, görünüşe göre sihirle oluşturulmuş, yoğun ve parlak yeşil bir ateş duvarı var. O kadar yoğun ki içinden geçemiyorsunuz ve çok yaklaşan her şeyi tutuşturuyor. Doğal olarak sönme belirtisi göstermiyor, söndürmek için bir şey kullanmanız gerekecek.
levels.rooms.special.sentryroom$sentry.desc=Bu kan kırmızısı nöbetçi, odanın diğer ucundaki hazineyi korumak için buraya yerleştirilmiş gibi görünüyor. Savunduğu alana adım atarsanız size parçalayıcı büyü ışınları fırlatacak. Tüm zararlı etkilere karşı bağışıklıdır ve görünmezliği de görebilir, ancak ateş etmeye başlamadan önce bir süre şarj olması gerekiyor gibi görünüyor. Nöbetçi nedense sadece size ateş etmek istiyor, sanki zindan sakinlerinin hazine için bir tehdit oluşturmadığını biliyor.
levels.rooms.special.sentryroom$sentry.discover_hint=Bu düşmanı zindanın herhangi bir yerinde bulabilirsiniz.
levels.rooms.special.sentryroom$sentry.name=kırmızı nöbetçi
levels.rooms.special.toxicgasroom$toxicvent.desc=Dikkatsiz bir maceracı bu tuzağı çok uzun zaman önce tetiklemiş olmalı. Aktif olmamasına rağmen, odaya zehirli gaz püskürtmeye devam ediyor ve duracak gibi görünmüyor. Bu odayı keşfetmek istiyorsanız, gazdan zarar görmenizi engelleyecek bir yol bulmanız gerekecek.
levels.rooms.special.toxicgasroom$toxicvent.name=zehirli havalandırma
levels.rooms.special.weakfloorroom$hiddenwell.desc=Aşağıda, derinliklerde bir kuyu seçilebiliyor, belki de orada bir şey vardır?
levels.rooms.special.weakfloorroom$hiddenwell.name=uzak kuyu
levels.sewerlevel.bookshelf_desc=Kitaplık ucuz ve işe yaramaz kitaplarla dolu. Yanabilir mi acaba?
levels.sewerlevel.empty_deco_desc=Yeri ıslak, sarımsı yosun kaplıyor.
levels.sewerlevel.region_deco_desc=Neredeyse senin boyun kadar büyük, kalın bir fıçı. İçinde mutlaka bir şeyler vardır, taşımak için çok ağır.
levels.sewerlevel.region_deco_name=Depolama varili
levels.sewerlevel.water_name=Bulanık su
levels.traps.alarmtrap.alarm=Tuzak, zindanın her yerinde yankılanan delici bir ses çıkarıyor!
levels.traps.alarmtrap.desc=Bu tuzak, yüksek sesli bir alarm mekanizmasına bağlı gibi görünüyor. Alarmın tetiklenmesi, katta bulunan herkesi alarma geçirecektir.
levels.traps.alarmtrap.name=alarm tuzağı
levels.traps.blazingtrap.desc=Bu tuzağa basmak, güçlü bir kimyasal karışımı tutuşturarak geniş bir alanı alevlendirecektir.
levels.traps.blazingtrap.name=alevli tuzak
levels.traps.burningtrap.desc=Bu tuzağa basmak, kimyasal bir karışımı tutuşturarak çevredeki alanı alevlendirecektir.
levels.traps.burningtrap.name=yanan tuzak
levels.traps.chillingtrap.desc=Aktif hale getirildiğinde, bu tuzaktaki kimyasallar bulunduğu yerin etrafındaki havayı hızla donduracaktır.
levels.traps.chillingtrap.name=ürpertici tuzak
levels.traps.confusiontrap.desc=Bu tuzağın tetiklenmesi, yakın çevrede bir miktar kafa karıştırıcı gazın yayılmasına neden olacaktır.
levels.traps.confusiontrap.name=karışıklık gaz tuzağı
levels.traps.corrosiontrap.desc=Bu tuzağın tetiklenmesi, yakın çevrede ölümcül asidik gaz bulutunun yayılmasına neden olacaktır.
levels.traps.corrosiontrap.name=aşındırıcı gaz kapanı
levels.traps.cursingtrap.curse=Eskimiş ekipmanlarınız lanetlenir!
levels.traps.cursingtrap.desc=Bu tuzak, lanetli ekipmanlarda bulunan aynı kötücül büyüyü içerir. Tetiklendiğinde, yakın çevredeki bazı eşyalar lanetlenecektir.
levels.traps.cursingtrap.name=küfür tuzağı
levels.traps.disarmingtrap.desc=Bu tuzak, kurbanının silahını başka bir yere ışınlayacak çok özel bir ışınlanma büyüsü içeriyor.
levels.traps.disarmingtrap.disarm=Silahınız ışınlanarak yok oldu!
levels.traps.disarmingtrap.name=silahsızlandırma tuzağı
levels.traps.disintegrationtrap.desc=Tetiklendiğinde, bu tuzak en yakın hedefi parçalayıcı ışınlarla vurarak önemli hasar verir ve eşyaları yok eder. Neyse ki tetikleme mekanizması gizli değil.
levels.traps.disintegrationtrap.name=parçalanma tuzağı
levels.traps.disintegrationtrap.ondeath=Parçalanma tuzağına düşerek öldün...
levels.traps.disintegrationtrap.one=Tuzak, %s'nizi parçalara ayırıyor!
levels.traps.disintegrationtrap.some=Tuzak, %s'nizin bir kısmını parçalıyor!
levels.traps.distortiontrap.desc=Kökeni bilinmeyen tuhaf bir büyüyle inşa edilen bu tuzak, her türlü yaratığı bu bölgeye çağıracak.
levels.traps.distortiontrap.name=bozulma tuzağı
levels.traps.explosivetrap.desc=Bu tuzak, bir miktar toz halinde patlayıcı ve bir tetikleme mekanizması içermektedir. Tetiklendiğinde, yakın çevrede bir patlama meydana gelecektir.
levels.traps.explosivetrap.name=patlayıcı tuzak
levels.traps.flashingtrap.desc=Etkinleştirildiğinde, bu tuzak içinde depolanan güçlü, parıldayan bir tozu tutuşturarak kurbanını geçici olarak kör eder, sakat bırakır ve yaralar. Tuzak, kırılmadan birçok kez etkinleştirilebildiği için büyük miktarda toz depolamalıdır.
levels.traps.flashingtrap.name=yanıp sönen tuzak
levels.traps.flocktrap.desc=Belki de amatör bir büyücünün şakasıdır, bu tuzağı tetiklemek bir sürü sihirli koyun yaratacaktır.
levels.traps.flocktrap.name=sürü tuzağı
levels.traps.frosttrap.desc=Aktif hale getirildiğinde, bu tuzaktaki kimyasallar, bulunduğu yerin çevresindeki geniş bir alanda havayı hızla donduracaktır.
levels.traps.frosttrap.name=don tuzağı
levels.traps.gatewaytrap.desc=Bu özel ışınlanma tuzağı sonsuz sayıda kez aktif hale getirilebilir ve her zaman aynı yere ışınlar.
levels.traps.gatewaytrap.name=geçit tuzağı
levels.traps.geysertrap.desc=Tetiklendiğinde, bu tuzak bir su fışkırmasına neden olacak, ateşli düşmanlara hasar verecek, yakındaki tüm karakterleri uzaklaştıracak, yangınları söndürecek ve çevredeki araziyi suya dönüştürecektir.
levels.traps.geysertrap.name=gayzer tuzağı
levels.traps.gnollrockfalltrap.desc=Bu kaya düşmesi tuzağı bir tür sihirli yardımla yapılmıştır. Tetiklendiğinde, kayaların gevşemesine ve etrafındaki 5x5'lik bir alana yukarıdan düşmesine neden olur. Bölgedeki kayaların daha yumuşak olması nedeniyle, normal bir kaya düşmesi tuzağı kadar hasar vermez, ancak zırhınız da ona karşı etkili olmaz. Ayrıca, bitişik bir barikat bulunan yerlere kayalar düşmez, çünkü barikatlar tavanı tutmaya yardımcı olur. Bu tuzak dostu düşmandan ayırt edemez ve bu nedenle gnoll'lar için de sizin için olduğu kadar zararlıdır.
levels.traps.gnollrockfalltrap.name=gnoll kaya düşmesi tuzağı
levels.traps.grimtrap.desc=Bu tuzakta son derece güçlü, yıkıcı bir sihir depolanmıştır; en sağlıklı kahramanlar hariç herkesi anında öldürmeye yetecek kadar güçlüdür. Tetiklendiğinde, en yakın karaktere doğru ölümcül bir sihir patlaması gönderir. Neyse ki tetikleme mekanizması gizli değildir.
levels.traps.grimtrap.name=acımasız tuzak
levels.traps.grimtrap.ondeath=Korkunç bir tuzağın patlamasıyla öldün...
levels.traps.grippingtrap.desc=Bu tuzak, tetikleyenin ayaklarına yapışarak ona zarar verir ve hareketlerini yavaşlatır. Basit yapısı nedeniyle, bu tuzak kırılmadan birçok kez aktif hale gelebilir.
levels.traps.grippingtrap.name=kavrama tuzağı
levels.traps.guardiantrap$guardian.desc=Bu mavi hayalet, zindanın taş koruyucularından birinin çağrılmış yankısı gibi görünüyor.
levels.traps.guardiantrap$guardian.desc_weapon=Heykelin kendisi neredeyse cisimsiz olsa da, elinde tuttuğu _%s_ gerçek gibi görünüyor.
levels.traps.guardiantrap$guardian.discover_hint=Bu düşmanı özel bir tuzakla bulabilirsiniz.
levels.traps.guardiantrap$guardian.name=çağrılan koruyucu
levels.traps.guardiantrap.alarm=Tuzak, zindanın her yerinde yankılanan delici bir ses çıkarıyor!
levels.traps.guardiantrap.desc=Bu tuzak, koruyucuları çağıracak ve kattaki tüm düşmanları uyaracak garip bir sihirli mekanizmaya bağlıdır.
levels.traps.guardiantrap.name=koruyucu tuzağı
levels.traps.oozetrap.desc=Bu tuzak aktif hale geldiğinde aşındırıcı bir sıvı püskürtecek ve bu sıvı yıkanana kadar yanmaya devam edecektir.
levels.traps.oozetrap.name=sızma tuzağı
levels.traps.pitfalltrap.desc=Bu tuzak, büyük bir tuzak kapısı mekanizmasına bağlıdır ve tetiklendikten kısa bir süre sonra yakınındaki her şey zeminden kayarak aşağı düşer! Ancak özellikle sert zeminli alanlarda işe yaramaz.
levels.traps.pitfalltrap.name=tuzak
levels.traps.pitfalltrap.no_pit=Burada zemin çok sert olduğu için çukur tuzak kurmak mümkün değil.
levels.traps.pitfalltrap.triggered=Tetiklenen tuzağın etrafındaki zemin çökmeye başlıyor!
levels.traps.pitfalltrap.triggered_hero=Etrafınızdaki zemin çökmeye başlıyor!
levels.traps.poisondarttrap.desc=Yakınlarda küçük bir ok fırlatıcı gizlenmelidir; bu tuzağı etkinleştirmek, en yakın hedefe zehirli bir ok fırlatmasına neden olacaktır. Neyse ki tetikleme mekanizması gizlenmemiştir.
levels.traps.poisondarttrap.name=zehirli ok tuzağı
levels.traps.poisondarttrap.ondeath=Zehirli ok tuzağına yakalandın...
levels.traps.rockfalltrap.desc=Bu tuzak, yukarıdaki bir dizi gevşek kayaya bağlıdır; tetiklendiğinde kayalar tüm odaya düşerek büyük bir gürültüye neden olur! Tuzak belirli bir odada değilse, kayalar bunun yerine tuzağın etrafındaki bir alana düşer. Neyse ki tetikleme mekanizması gizli değil.
levels.traps.rockfalltrap.name=kaya düşmesi tuzağı
levels.traps.rockfalltrap.ondeath=Kaya düşmesi tuzağına yakalandınız ve ezildiniz...
levels.traps.shockingtrap.desc=İçinde büyük miktarda enerji depolanmış bir mekanizma. Bu tuzağı tetiklemek, o enerjiyi etrafındaki bir alana boşaltacaktır.
levels.traps.shockingtrap.name=şok edici tuzak
levels.traps.stormtrap.desc=İçinde muazzam miktarda enerji depolanmış bir mekanizma. Bu tuzağı tetiklemek, o enerjiyi büyük bir elektrik fırtınasına dönüştürecektir.
levels.traps.stormtrap.name=fırtına tuzağı
levels.traps.summoningtrap.desc=Bu tuzağı tetiklemek, bölgedeki canavarlardan birkaçını bu konuma çağıracaktır.
levels.traps.summoningtrap.name=çağırma tuzağı
levels.traps.teleportationtrap.desc=Bu tuzak tetiklendiğinde, etrafındaki her şey bu kattaki rastgele konumlara ışınlanacaktır.
levels.traps.teleportationtrap.name=ışınlanma tuzağı
levels.traps.tengudarttrap.desc=Tengu'nun bir dövüşe hazırlandığı açıkça belli. Bu tuzak, gizli bir ok fırlatıcısını harekete geçirecek ve en yakın, Tengu olmayan şeye zehirli bir ok fırlatacak. Tuzak o kadar iyi yapılmış ki, tetikleme mekanizmasını sihirli yardım olmadan tespit etmek imkansız. Ancak tuzak kurulurken bir anlığına görünür durumda.
levels.traps.toxictrap.desc=Bu tuzağın tetiklenmesi, çevredeki alana zehirli bir gaz bulutunun yayılmasına neden olacaktır.
levels.traps.toxictrap.name=zehirli gaz tuzağı
levels.traps.trap.discover_hint=Bu tuzağı zindanda rastgele bulabilirsiniz. Her bölgede farklı tuzaklar ortaya çıkabilir.
levels.traps.trap.rankings_desc=Öldüren: %s
levels.traps.warpingtrap.desc=Bu tuzak, ışınlanma tuzağına benzer, ancak kahramanın zeminin düzeni hakkındaki bilgisini de kaybetmesine neden olur!
levels.traps.warpingtrap.name=çarpıtma tuzağı
levels.traps.weakeningtrap.desc=Bu tuzaktaki kara büyü, onunla temas eden her şeyin enerjisini emer. Ancak güçlü düşmanlar bu etkiye karşı koyabilir.
levels.traps.weakeningtrap.name=zayıflatma tuzağı
levels.traps.worndarttrap.desc=Yakınına küçük bir ok fırlatıcı gizlenmelidir; bu tuzağı etkinleştirmek, en yakın hedefe ok fırlatmasına neden olacaktır. Yaşı nedeniyle çok zararlı değil, hatta gizlenmiş bile değil...
levels.traps.worndarttrap.name=yıpranmış ok tuzağı
levels.traps.worndarttrap.ondeath=Yıpranmış ok tuzağı yüzünden öldün...
levels.vaultlevel$vaultflametrap.desc=Bu havalandırma deliğinden belirli aralıklarla yeşil alevler çıkıyor gibi görünüyor. _Burası sadece bir test alanı olduğu için, havalandırma deliklerinden çıkan alevler size zarar vermez._
levels.vaultlevel$vaultflametrap.name=kasa alev havalandırması

levels.level.sign_desc=Buradan metni okuyamazsınız.
levels.level.sign_name=İmza
