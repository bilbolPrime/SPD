levels.caveslevel.region_deco_desc=Büyük, tamamen metalden yapılmış bir yapı, muhtemelen eskiden burada madencilik yaptıkları dönemde cüceler tarafından inşa edilmiş. Üst kısmında uzun zamandır kullanılmayan maden arabası raylarını görebiliyorsunuz sanırım.
levels.caveslevel.region_deco_name=Metal yapı
levels.caveslevel.wall_deco_desc=Duvarda bir maden damarı görünüyor. Altın mı acaba?
levels.caveslevel.water_name=Buz gibi soğuk su
levels.citybosslevel.summoning_desc=Bu kaidenin ortasında, adeta karanlık enerjiyle ışıldayan büyük bir açıklık bulunmaktadır. Cüce Kral bu kaideleri nekromantik büyüsünün odak noktaları olarak kullanır ve onlara hizmetkarlar çağırabilir. Hizmetkarın ortaya çıkması için kaidenin birkaç tur boyunca şarj olması gerekir ve çağrılan hizmetkarın türü, binanın büyülü gücüyle önceden haber verilir.
levels.citybosslevel.summoning_name=Çağırma kaidesi
levels.citybosslevel.throne_desc=Bu etkileyici büyüklükteki taht, şu anda güç düşkünü bir nekromancer tarafından ele geçirilmiş olan cüce imparatorluğunun tahtıdır. Tahtta bazı sihirli veya mekanik parçalar olduğu anlaşılıyor; Cüce Kral, tahtta oturduğunda ek güçlere sahip olabilir.
