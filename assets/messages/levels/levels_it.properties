levels.cavesbosslevel.energy_desc=Il terreno qui è percorso da scariche elettriche ed è pericoloso camminarci sopra. Le scintille sembrano gravitare in una certa direzione... forse conducono alla fonte di energia?
levels.cavesbosslevel.gate_desc=Un grande cancello di metallo blocca l'accesso alla metropoli nanica. La scatola metallica al centro emette un forte ronzio, probabilmente collegato ai circuiti e ai macchinari nelle vicinanze. Forse distruggendo DM-300 si riuscirà ad aprire il cancello?
levels.cavesbosslevel.gate_desc_broken=Il portale doveva essere in qualche modo collegato al DM-300, poiché è esploso quando il DM-300 è stato sconfitto. Ora ne rimangono solo frammenti.
levels.cavesbosslevel.gate_name=Cancello in metallo
levels.cavesbosslevel.water_desc=Con tutta l'elettricità che c'è qui intorno, l'acqua potrebbe non essere sempre sicura...
levels.cavesbosslevel.wires_desc=Il terreno è parzialmente scavato qui, mostrando alcuni grossi fili scoperti. Devono collegare tra loro le varie macchine elettriche. \n\n Nei fili deve scorrere della corrente. Se DM-300 si avvicina, potrebbe essere in grado di prelevare energia da essi.
levels.cavesbosslevel.wires_name=Cablaggio a vista
levels.caveslevel.bookshelf_desc=Chi mai avrebbe bisogno di una libreria in una caverna?
levels.caveslevel.entrance_desc=La scala conduce al livello superiore.
levels.caveslevel.exit_desc=La scala conduce al livello inferiore.
levels.caveslevel.grass_name=muschio fluorescente
levels.caveslevel.high_grass_desc=Funghi enormi ostruiscono la visuale.
levels.caveslevel.high_grass_name=Funghi fluorescenti
levels.caveslevel.region_deco_desc=Una grande struttura interamente metallica, probabilmente costruita dai nani quando un tempo estraevano minerali in questo luogo. Sembra di scorgere i binari, ormai in disuso, di un tempo utilizzati per i carrelli da miniera, che corrono lungo la sommità.
levels.caveslevel.region_deco_name=Struttura metallica
levels.caveslevel.wall_deco_desc=Sulla parete è visibile una vena di minerale. Oro?
levels.caveslevel.water_name=acqua gelida
levels.citybosslevel.summoning_desc=Questo piedistallo ha una grande apertura al centro, che irradia praticamente energia oscura. Il Re dei Nani usa questi piedistalli come punti focali per la sua magia necromantica e può evocare servitori su di essi. Il piedistallo deve caricarsi per alcuni turni prima che il servitore appaia, e il tipo di servitore evocato è preannunciato dal potere magico che si sta accumulando.
levels.citybosslevel.summoning_name=piedistallo di evocazione
levels.citybosslevel.throne_desc=Questo trono di dimensioni impressionanti è la sede dell'impero nanico, ora occupato da un negromante assetato di potere. Sembra che il trono abbia delle parti magiche o meccaniche; il Re dei Nani potrebbe avere un potere aggiuntivo quando vi si siede sopra.
levels.citybosslevel.throne_name=Trono
levels.citylevel.bookshelf_desc=Gli scaffali sono pieni di libri di diverse discipline.
levels.citylevel.deco_desc=Qui mancano diverse piastrelle.
levels.citylevel.entrance_desc=Una rampa conduce al livello superiore.
levels.citylevel.exit_desc=Una rampa conduce al punto più profondo.
levels.citylevel.high_grass_name=Fiori alti in piena fioritura
levels.citylevel.region_deco_desc=Un piedistallo rialzato con una fiamma magica di un verde brillante in cima. La fiamma è così densa che potrebbe essere considerata solida.
levels.citylevel.region_deco_name=piedistallo fiammeggiante
levels.citylevel.sp_desc=Il pavimento è ricoperto da una spessa moquette.
levels.citylevel.statue_desc=La statua raffigura un nano in posa eroica.
levels.citylevel.upcoming_quest_intro_no=Resta qui
levels.citylevel.upcoming_quest_intro_title=Messaggio dello sviluppatore
levels.citylevel.upcoming_quest_intro_yes=Scendi nella volta
levels.citylevel.water_name=Acqua dal colore sospetto
levels.features.chasm.chasm=Abisso
levels.features.chasm.jump=Vuoi davvero buttarti nel baratro? Una caduta da quella altezza sarebbe dolorosissima.
levels.features.chasm.no=No, ho cambiato idea.
levels.features.chasm.ondeath=Sei morto cadendo...
levels.features.chasm.rankings_desc=Morto sul colpo
levels.features.chasm.yes=Sì, so cosa sto facendo
levels.hallslevel.bookshelf_desc=Libri in lingue antiche ardono fumanti sullo scaffale.
levels.hallslevel.grass_name=Muschio di brace
levels.hallslevel.high_grass_name=Funghi delle braci
levels.hallslevel.region_deco_desc=Un enorme blocco di pietra che sembra essersi staccato dal soffitto o da una parete vicina.
levels.hallslevel.region_deco_name=Pezzo di macerie
levels.hallslevel.statue_desc=La colonna è fatta di veri teschi umanoidi. Impressionante.
levels.hallslevel.statue_name=Pilastro
levels.hallslevel.water_desc=Sembra lava, ma è fredda e probabilmente non si può toccare.
levels.hallslevel.water_name=Lava fredda
levels.level$feeling.chasm_desc=I tuoi passi echeggiano nella prigione.
levels.level$feeling.chasm_title=fondo del burrone
levels.level$feeling.dark_desc=Si possono sentire i nemici muoversi nell'oscurità.
levels.level$feeling.dark_title=pavimento scuro
levels.level$feeling.grass_desc=Nell'aria si percepisce un intenso profumo di vegetazione.
levels.level$feeling.grass_title=prato
levels.level$feeling.large_desc=Questo piano del sotterraneo sembra insolitamente grande.
levels.level$feeling.large_title=grande pavimento
levels.level$feeling.secrets_desc=L'atmosfera suggerisce che questo piano nasconda molti segreti.
levels.level$feeling.secrets_title=piano segreto
levels.level$feeling.traps_desc=Il terreno qui sembra particolarmente insidioso.
levels.level$feeling.traps_title=pavimento delle trappole
levels.level$feeling.water_desc=Senti l'acqua che schizza intorno a te.
levels.level$feeling.water_title=fondo acquatico
levels.level.alchemy_desc=Questo vaso è pieno di acqua magica. È possibile mescolare diversi oggetti al suo interno per creare qualcosa di nuovo!
levels.level.alchemy_name=vaso alchemico
levels.level.barricade_desc=La barricata di legno è ben fissata, ma si è seccata nel corso degli anni. Potrebbe bruciare?
levels.level.barricade_name=Barricata
levels.level.bookshelf_name=Libreria
levels.level.chasm_desc=Non si vede il fondo.
levels.level.chasm_name=Abisso
levels.level.closed_door_name=Porta chiusa
levels.level.crystal_door_desc=Questa porta chiusa a chiave è fatta di cristallo magico. Puoi vedere attraverso, ma avrai bisogno di una chiave di cristallo per aprirla.
levels.level.crystal_door_name=Porta di cristallo
levels.level.default_name=???
levels.level.embers_desc=Il pavimento è ricoperto di braci.
levels.level.embers_name=Brace
levels.level.empty_well_desc=Il pozzo si è prosciugato.
levels.level.empty_well_name=Pozzo vuoto
levels.level.entrace_name=Ingresso profondo
levels.level.entrance_desc=Delle scale conducono al livello superiore.
levels.level.exit_desc=Delle scale conducono al livello inferiore.
levels.level.exit_name=Doppia uscita
levels.level.floor_name=Pavimento
levels.level.furrowed_grass_name=Vegetazione solcata
levels.level.grass_name=Erba
levels.level.hidden_trap=Si attiva un codice nascosto %s!
levels.level.high_grass_desc=La fitta vegetazione ostruisce la vista.
levels.level.high_grass_name=Erba alta
levels.level.inactive_trap_desc=La trappola è già scattata in passato e ora non è più pericolosa.
levels.level.inactive_trap_name=Trappola innescata
levels.level.locked_door_desc=Questa porta è chiusa a chiave, per aprirla serve una chiave corrispondente.
levels.level.locked_door_name=Porta chiusa a chiave
levels.level.locked_exit_desc=Pesanti sbarre bloccano le scale che conducono al piano inferiore.
levels.level.locked_exit_name=Uscita di profondità bloccata
levels.level.open_door_name=Porta aperta
levels.level.pedestal_name=Piedistallo
levels.level.statue_desc=Qualcuno voleva abbellire questo posto, ma evidentemente ha fallito.
levels.level.statue_name=Statua
levels.level.unlocked_exit_name=Uscita di profondità sbloccata
levels.level.wall_name=Parete
levels.level.water_desc=In caso di incendio, immergersi nell'acqua per spegnere le fiamme.
levels.level.water_name=Acqua
levels.level.well_name=BENE
levels.mininglevel.barricade_desc=La barricata di legno è saldamente fissata e funge da supporto per il soffitto.\n\nProbabilmente è stata costruita dagli gnoll per fornire una certa protezione contro la caduta di massi. _Qualsiasi cella adiacente sarà protetta dalle trappole e dagli attacchi di caduta massi._\n\nSembra che brucerebbe bene come qualsiasi altra barricata.
levels.mininglevel.boulder_desc=C'è un grosso masso che blocca il passaggio. Dovrebbe essere abbastanza facile romperlo con un piccone.
levels.mininglevel.boulder_name=Masso
levels.mininglevel.crystal_desc=Qui affiora un grande e colorato giacimento di cristalli. Questi cristalli sono fragili e possono essere facilmente rotti con un piccone, oppure si romperanno se si estrae qualcosa nelle vicinanze.
levels.mininglevel.crystal_name=Punta di cristallo
levels.mininglevel.gold_extra_desc=Probabilmente puoi estrarlo con il tuo piccone.
levels.mininglevel.wall_desc=Una parete rocciosa liscia, leggermente più morbida del solito. Puoi scavarci dentro con il piccone, ma ci vorrà un po' di fatica e aumenterà un po' la tua fame.
levels.prisonlevel.bookshelf_desc=Probabilmente si tratta di ciò che resta di una biblioteca carceraria. Potrebbe bruciare?
levels.prisonlevel.empty_deco_desc=Sul pavimento ci sono vecchie macchie di sangue.
levels.prisonlevel.region_deco_alt_desc=Una gabbia di metallo appena sufficiente a contenere una persona. È sospesa su un profondo burrone, appesa a una catena.
levels.prisonlevel.region_deco_alt_name=Gabbia sospesa
levels.prisonlevel.region_deco_desc=Una gabbia di metallo appena sufficiente a contenere una persona. Sembra essere ancorata al suolo in qualche modo, non si può spostare.
levels.prisonlevel.region_deco_name=gabbia di prigione
levels.prisonlevel.water_name=acqua scura e fredda
levels.rooms.quest.ambitiousimproom$questentrance.desc=Questa sinistra fossa sembra essere l'ingresso di un'antica cripta nanica. Una barriera magica impedisce l'accesso, ma è possibile camminarci sopra come se ci fosse un pavimento.
levels.rooms.quest.ambitiousimproom$questentrance.name=Ingresso della cripta
levels.rooms.quest.blacksmithroom$questentrance.desc=Questa scala conduce a una vecchia miniera situata proprio sotto la fucina del fabbro.
levels.rooms.quest.blacksmithroom$questentrance.name=Ingresso della miniera
levels.rooms.quest.massgraveroom$bones.desc=Ossa sparse sul pavimento, cos'è successo qui?
levels.rooms.quest.massgraveroom$bones.name=Fossa comune
levels.rooms.quest.mineentrance$questexit.desc=Questa scala conduce fuori dalla miniera, verso l'officina del fabbro.
levels.rooms.quest.mineentrance$questexit.name=Uscita della miniera
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Un segno dipinto che indica un rituale oscuro. Di solito, le candele vengono poste ai quattro angoli.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Indicatore rituale
levels.rooms.special.magicalfireroom$eternalfire.desc=Qui si erge un muro di fuoco verde brillante e denso, apparentemente generato dalla magia. È così denso che non ci si può muovere attraverso e incendia qualsiasi cosa si avvicini troppo. Non mostra segni di spegnersi da solo, sarà necessario utilizzare qualcosa per estinguerlo.
levels.rooms.special.sentryroom$sentry.desc=Questa sentinella rosso sangue sembra essere posizionata qui per proteggere il tesoro all'altra estremità della stanza. Ti sparerà raggi di magia di disintegrazione se entri nell'area che difende. È immune a tutti gli effetti nocivi e può vedere attraverso l'invisibilità, ma sembra impiegare un po' di tempo per caricarsi prima di iniziare a sparare. In qualche modo la sentinella vuole sparare solo a te, come se sapesse che gli abitanti del dungeon non rappresentano una minaccia per il tesoro.
levels.rooms.special.sentryroom$sentry.discover_hint=Puoi trovare questo nemico ovunque nel dungeon.
levels.rooms.special.sentryroom$sentry.name=sentinella rossa
levels.rooms.special.toxicgasroom$toxicvent.desc=Probabilmente, qualche avventuriero imprudente ha attivato questa trappola molto tempo fa. Nonostante sia inattiva, continua a sprigionare gas tossico nella stanza e non accenna a fermarsi. Avrai bisogno di un modo per proteggerti dai danni causati dal gas se vuoi esplorare questa stanza.
levels.rooms.special.toxicgasroom$toxicvent.name=emissione di gas tossici
levels.rooms.special.weakfloorroom$hiddenwell.desc=Si intravede appena un pozzo in profondità, forse c'è qualcosa laggiù?
levels.rooms.special.weakfloorroom$hiddenwell.name=pozzo distante
levels.sewerlevel.bookshelf_desc=La libreria è piena di libri economici e inutili. Potrebbe bruciare?
levels.sewerlevel.empty_deco_desc=Il pavimento è ricoperto di muschio giallastro e umido.
levels.sewerlevel.region_deco_desc=Una robusta botte, grande quasi quanto te. Deve essere piena di qualcosa, è troppo pesante da spostare.
levels.sewerlevel.region_deco_name=barile di stoccaggio
levels.sewerlevel.water_name=Acqua torbida
levels.traps.alarmtrap.alarm=La trappola emette un suono penetrante che riecheggia in tutta la prigione!
levels.traps.alarmtrap.desc=Questa trappola sembra essere collegata a un potente meccanismo di allarme. Attivandolo, probabilmente si allarmeranno tutti gli occupanti del piano.
levels.traps.alarmtrap.name=trappola di allarme
levels.traps.blazingtrap.desc=Calpestare questa trappola innescherà una potente miscela chimica, che incendierà una vasta area.
levels.traps.blazingtrap.name=trappola fiammeggiante
levels.traps.burningtrap.desc=Calpestare questa trappola innescherà una miscela chimica, incendiando l'area circostante.
levels.traps.burningtrap.name=trappola infuocata
levels.traps.chillingtrap.desc=Una volta attivata, questa trappola conterrà sostanze chimiche che congeleranno rapidamente l'aria circostante.
levels.traps.chillingtrap.name=trappola agghiacciante
levels.traps.confusiontrap.desc=Attivando questa trappola si sprigionerà una nube di gas che provoca confusione nell'area circostante.
levels.traps.confusiontrap.name=trappola per gas di confusione
levels.traps.corrosiontrap.desc=Attivando questa trappola si sprigionerà una nube di gas acido letale nell'area circostante.
levels.traps.corrosiontrap.name=trappola per gas corrosivo
levels.traps.cursingtrap.curse=La tua attrezzatura usurata sarà maledetta!
levels.traps.cursingtrap.desc=Questa trappola contiene la stessa magia malevola presente negli equipaggiamenti maledetti. Attivandola, maledirà alcuni oggetti nelle immediate vicinanze.
levels.traps.cursingtrap.name=trappola per imprecare
levels.traps.disarmingtrap.desc=Questa trappola contiene una magia di teletrasporto molto specifica, in grado di teletrasportare l'arma della vittima in un altro luogo.
levels.traps.disarmingtrap.disarm=La tua arma è stata teletrasportata via!
levels.traps.disarmingtrap.name=disinnescare la trappola
levels.traps.disintegrationtrap.desc=Quando attivata, questa trappola colpirà il bersaglio più vicino con raggi di disintegrazione, infliggendo danni significativi e distruggendo gli oggetti. Per fortuna il meccanismo di attivazione non è nascosto.
levels.traps.disintegrationtrap.name=trappola di disintegrazione
levels.traps.disintegrationtrap.ondeath=Sei stato ucciso dalla trappola disintegrante...
levels.traps.disintegrationtrap.one=La trappola disintegra il tuo %s!
levels.traps.disintegrationtrap.some=La trappola disintegra alcuni dei tuoi %s!
levels.traps.distortiontrap.desc=Costruita con una strana magia di origine sconosciuta, questa trappola attirerà in questo luogo ogni sorta di creature.
levels.traps.distortiontrap.name=trappola di distorsione
levels.traps.explosivetrap.desc=Questa trappola contiene della polvere esplosiva e un meccanismo di innesco. Attivandola, si verificherà un'esplosione nelle immediate vicinanze.
levels.traps.explosivetrap.name=trappola esplosiva
levels.traps.flashingtrap.desc=All'attivazione, questa trappola farà esplodere una potente polvere fosforescente immagazzinata al suo interno, accecando, paralizzando e ferendo temporaneamente la vittima. La trappola deve avere una grande scorta di polvere, poiché può attivarsi molte volte senza rompersi.
levels.traps.flashingtrap.name=trappola lampeggiante
levels.traps.flocktrap.desc=Forse uno scherzo di qualche mago dilettante: attivando questa trappola si creerà un gregge di pecore magiche.
levels.traps.flocktrap.name=trappola per flocchi
levels.traps.frosttrap.desc=Una volta attivata, questa trappola congelerà rapidamente l'aria in un'ampia area circostante.
levels.traps.frosttrap.name=trappola per il gelo
levels.traps.gatewaytrap.desc=Questa speciale trappola di teletrasporto può attivarsi un numero infinito di volte e teletrasporta sempre nello stesso luogo.
levels.traps.gatewaytrap.name=trappola d'accesso
levels.traps.geysertrap.desc=Quando attivata, questa trappola farà zampillare un geyser d'acqua che danneggerà i nemici infuocati, respingerà tutti i personaggi vicini, spegnerà gli incendi e trasformerà il terreno circostante in acqua.
levels.traps.geysertrap.name=trappola a geyser
levels.traps.gnollrockfalltrap.desc=Questa trappola a caduta massi è realizzata con una qualche forma di aiuto magico. Quando viene attivata, farà sì che le rocce si stacchino e cadano immediatamente dall'alto in un'area 5x5 intorno ad essa. A causa delle rocce più morbide presenti nell'area, non infliggerà tanti danni quanto una normale trappola a caduta massi, ma anche la tua armatura non sarà efficace contro di essa. Le rocce inoltre non cadranno in luoghi con una barricata adiacente, poiché questa contribuisce a sostenere il soffitto.\n\n_Questa trappola non distingue tra amici e nemici, quindi è dannosa tanto per gli gnoll quanto per te._
levels.traps.gnollrockfalltrap.name=trappola per gnoll da caduta massi
levels.traps.grimtrap.desc=All'interno di questa trappola è immagazzinata una magia distruttiva estremamente potente, sufficiente a uccidere all'istante tutti gli eroi tranne i più resistenti. Attivandola, si lancerà un'esplosione a distanza di magia letale verso il personaggio più vicino. Per fortuna, il meccanismo di attivazione non è nascosto.
levels.traps.grimtrap.name=trappola tetra
levels.traps.grimtrap.ondeath=Sei stato ucciso dall'esplosione di una trappola mortale...
levels.traps.grippingtrap.desc=Questa trappola si aggancia ai piedi di chiunque la attivi, danneggiandolo e rallentandone i movimenti.\n\nA causa della sua semplicità, questa trappola può attivarsi molte volte senza rompersi.
levels.traps.grippingtrap.name=trappola di presa
levels.traps.guardiantrap$guardian.desc=Questa apparizione blu sembra essere l'eco evocata di uno dei guardiani di pietra del dungeon.
levels.traps.guardiantrap$guardian.desc_weapon=Sebbene la statua stessa sia quasi incorporea, il _%s_ che impugna sembra reale.
levels.traps.guardiantrap$guardian.discover_hint=È possibile individuare questo nemico tramite una trappola specifica.
levels.traps.guardiantrap$guardian.name=guardiano evocato
levels.traps.guardiantrap.alarm=La trappola emette un suono penetrante che riecheggia in tutta la prigione!
levels.traps.guardiantrap.desc=Questa trappola è legata a uno strano meccanismo magico che evocherà dei guardiani e allerterà tutti i nemici presenti sul piano.
levels.traps.guardiantrap.name=trappola del guardiano
levels.traps.oozetrap.desc=Questa trappola, una volta attivata, schizzerà una sostanza caustica che brucerà finché non verrà lavata via.
levels.traps.oozetrap.name=trappola per melma
levels.traps.pitfalltrap.desc=Questa trappola è collegata a un grande meccanismo a botola e, poco dopo l'azionamento, qualsiasi cosa si trovi nelle vicinanze scivolerà attraverso il terreno e cadrà! Non funziona però in aree con pavimenti particolarmente solidi.
levels.traps.pitfalltrap.name=trappola a insidia
levels.traps.pitfalltrap.no_pit=Il terreno è troppo solido perché una trappola a fossa funzioni qui.
levels.traps.pitfalltrap.triggered=Il terreno comincia a cedere intorno alla trappola che si è attivata!
levels.traps.pitfalltrap.triggered_hero=Il terreno comincia a cedere intorno a te!
levels.traps.poisondarttrap.desc=Nelle vicinanze deve essere nascosto un piccolo dispositivo spara-dardi; attivando questa trappola, esso sparerà un dardo avvelenato contro il bersaglio più vicino. Per fortuna, il meccanismo di innesco non è nascosto.
levels.traps.poisondarttrap.name=trappola con dardo avvelenato
levels.traps.poisondarttrap.ondeath=Sei stato ucciso dalla trappola con il dardo avvelenato...
levels.traps.rockfalltrap.desc=Questa trappola è collegata a una serie di rocce sparse in alto; attivandola, queste crolleranno sull'intera stanza! Se la trappola non si trova in una stanza specifica, le rocce cadranno in un'area circostante. Per fortuna il meccanismo di attivazione non è nascosto.
levels.traps.rockfalltrap.name=trappola per caduta massi
levels.traps.rockfalltrap.ondeath=Sei stato schiacciato dalla trappola della frana...
levels.traps.shockingtrap.desc=Un meccanismo con una grande quantità di energia immagazzinata al suo interno. Attivando questa trappola, tale energia verrà scaricata in un campo circostante.
levels.traps.shockingtrap.name=trappola scioccante
levels.traps.stormtrap.desc=Un meccanismo che immagazzina un'enorme quantità di energia. Attivando questa trappola, tale energia verrà scaricata generando un violento temporale.
levels.traps.stormtrap.name=trappola per tempeste
levels.traps.summoningtrap.desc=Attivando questa trappola, verranno richiamati in questo luogo diversi mostri di quest'area.
levels.traps.summoningtrap.name=trappola di evocazione
levels.traps.teleportationtrap.desc=Ogni volta che questa trappola viene attivata, tutto ciò che si trova nelle vicinanze verrà teletrasportato in posizioni casuali su questo piano.
levels.traps.teleportationtrap.name=trappola di teletrasporto
levels.traps.tengudarttrap.desc=Tengu si è chiaramente preparato per un combattimento. Questa trappola attiverà un dispositivo di lancio di dardi nascosto che sparerà un dardo avvelenato contro la cosa più vicina che non sia Tengu. La trappola è realizzata così bene che il meccanismo di innesco è impossibile da rilevare senza l'aiuto della magia. Tuttavia, la trappola è visibile per un momento durante la fase di attivazione.
levels.traps.toxictrap.desc=Attivando questa trappola si sprigionerà una nube di gas tossico nell'area circostante.
levels.traps.toxictrap.name=trappola per gas tossici
levels.traps.trap.discover_hint=Puoi trovare questa trappola in modo casuale nel dungeon. Ogni regione ha trappole diverse che possono comparire.
levels.traps.trap.rankings_desc=Ucciso da: %s
levels.traps.warpingtrap.desc=Questa trappola è simile a una trappola di teletrasporto, ma farà anche perdere all'eroe la conoscenza della planimetria del piano!
levels.traps.warpingtrap.name=trappola deformante
levels.traps.weakeningtrap.desc=La magia oscura di questa trappola assorbe l'energia da qualsiasi cosa entri in contatto con essa. Tuttavia, nemici potenti potrebbero resistere all'effetto.
