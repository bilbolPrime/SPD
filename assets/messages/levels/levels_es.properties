levels.cavesbosslevel.energy_desc=El suelo aquí está electrificado y es peligroso pisarlo. _Las chispas parecen dirigirse hacia una dirección determinada..._ ¿quizás conducen a la fuente de energía?
levels.cavesbosslevel.gate_desc=Una gran puerta metálica bloquea el paso hacia la metrópolis enana. La caja metálica en el centro emite un fuerte zumbido; debe estar conectada a los circuitos y máquinas cercanas. ¿Quizás destruir a DM-300 abrirá la puerta?
levels.cavesbosslevel.gate_desc_broken=El portal debía estar conectado de alguna manera a DM-300, ya que explotó cuando DM-300 fue derrotado. Ahora solo quedan fragmentos.
levels.cavesbosslevel.gate_name=Puerta metálica
levels.cavesbosslevel.water_desc=Con toda la electricidad que hay por aquí, el agua no siempre es segura...
levels.cavesbosslevel.wires_desc=El suelo está parcialmente excavado aquí, dejando al descubierto algunos cables grandes. Deben estar conectando las distintas máquinas eléctricas entre sí. Los cables deben tener corriente eléctrica. Si DM-300 pisa este punto, podría obtener energía de ellos.
levels.cavesbosslevel.wires_name=Cableado expuesto
levels.caveslevel.bookshelf_desc=¿Quién necesitaría una estantería en una cueva?
levels.caveslevel.entrance_desc=La escalera conduce hasta la parte más profunda.
levels.caveslevel.exit_desc=La escalera conduce a la parte más profunda.
levels.caveslevel.grass_name=Musgo fluorescente
levels.caveslevel.high_grass_desc=Enormes setas bloquean la vista.
levels.caveslevel.high_grass_name=Hongos fluorescentes
levels.caveslevel.region_deco_desc=Una gran estructura totalmente metálica, probablemente construida por los enanos cuando explotaban las minas de este lugar. Parece que aún se pueden ver las vías de vagonetas, en desuso desde hace mucho tiempo, que discurren por la parte superior.
levels.caveslevel.region_deco_name=Estructura metálica
levels.caveslevel.wall_deco_desc=En la pared se aprecia una veta de algún mineral. ¿Oro?
levels.caveslevel.water_name=Agua helada
levels.citybosslevel.summoning_desc=Este pedestal tiene una gran abertura en el centro, que prácticamente irradia energía oscura. El Rey Enano usa estos pedestales como puntos focales para su magia nigromántica y puede invocar esbirros hacia ellos. El pedestal debe cargarse durante algunos turnos antes de que aparezca el esbirro, y el tipo de esbirro invocado se indica mediante el poder mágico que se acumula.
levels.citybosslevel.summoning_name=Pedestal de invocación
levels.citybosslevel.throne_desc=Este trono impresionantemente grande es la sede del imperio enano, ahora tomado por un nigromante sediento de poder.\n\nParece que el trono tiene algunas partes mágicas o mecánicas, el Rey Enano puede tener poder adicional cuando se sienta en él.
levels.citybosslevel.throne_name=Trono
levels.citylevel.bookshelf_desc=Las estanterías están llenas de libros de diferentes disciplinas.
levels.citylevel.deco_desc=Aquí faltan varias baldosas.
levels.citylevel.entrance_desc=Una rampa conduce hasta la parte superior del abismo.
levels.citylevel.exit_desc=Una rampa conduce hacia la parte inferior del cuerpo.
levels.citylevel.high_grass_name=Flores de floración alta
levels.citylevel.region_deco_desc=Un pedestal elevado con una brillante llama mágica de color verde en la parte superior. La llama es tan densa que bien podría ser sólida.
levels.citylevel.region_deco_name=Pedestal en llamas
levels.citylevel.sp_desc=Una gruesa alfombra cubre el suelo.
levels.citylevel.statue_desc=La estatua representa a un enano de pie en una postura heroica.
levels.citylevel.upcoming_quest_intro_no=Quédate aquí
levels.citylevel.upcoming_quest_intro_title=Mensaje del desarrollador
levels.citylevel.upcoming_quest_intro_yes=Desciende a la bóveda
levels.citylevel.water_name=Agua de color sospechoso
levels.features.chasm.chasm=Abismo
levels.features.chasm.jump=¿De verdad quieres saltar al abismo? Una caída desde esa altura será dolorosa.
levels.features.chasm.no=No, cambié de opinión.
levels.features.chasm.ondeath=Caíste y moriste...
levels.features.chasm.rankings_desc=Murió en el impacto
levels.features.chasm.yes=Sí, sé lo que estoy haciendo.
levels.hallslevel.bookshelf_desc=En la estantería arden libros en lenguas antiguas.
levels.hallslevel.grass_name=Musgo de brasas
levels.hallslevel.high_grass_name=Emberhongos
levels.hallslevel.region_deco_desc=Un enorme trozo de piedra que parece haberse desprendido del techo o de una pared cercana.
levels.hallslevel.region_deco_name=Trozo de escombros
levels.hallslevel.statue_desc=El pilar está hecho de cráneos humanoides reales. Impresionante.
levels.hallslevel.statue_name=Pilar
levels.hallslevel.water_desc=Parece lava, pero está fría y probablemente no haya problema en tocarla.
levels.hallslevel.water_name=lava fría
levels.level$feeling.chasm_desc=Tus pasos resuenan por toda la mazmorra.
levels.level$feeling.chasm_title=piso del abismo
levels.level$feeling.dark_desc=Se puede oír a los enemigos moviéndose en la oscuridad.
levels.level$feeling.dark_title=suelo oscuro
levels.level$feeling.grass_desc=El olor a vegetación impregna el aire.
levels.level$feeling.grass_title=suelo de césped
levels.level$feeling.large_desc=Este piso de la mazmorra parece inusualmente grande.
levels.level$feeling.large_title=piso grande
levels.level$feeling.secrets_desc=El ambiente sugiere que esta planta esconde muchos secretos.
levels.level$feeling.secrets_title=piso de secretos
levels.level$feeling.traps_desc=El terreno parece especialmente peligroso aquí.
levels.level$feeling.traps_title=trampas de piso
levels.level$feeling.water_desc=Escuchas el agua chapoteando a tu alrededor.
levels.level$feeling.water_title=fondo de agua
levels.level.alchemy_desc=Esta olla está llena de agua mágica. ¡Puedes mezclar ingredientes en ella para crear algo nuevo!
levels.level.alchemy_name=olla de alquimia
levels.level.barricade_desc=La barricada de madera está bien colocada, pero se ha secado con el paso de los años. ¿Podría incendiarse?
levels.level.barricade_name=Barricada
levels.level.bookshelf_name=Estante para libros
levels.level.chasm_desc=No se ve el fondo.
levels.level.chasm_name=Abismo
levels.level.closed_door_name=Puerta cerrada
levels.level.crystal_door_desc=Esta puerta cerrada está hecha de cristal mágico. Puedes ver a través de ella, pero necesitarás una llave de cristal para abrirla.
levels.level.crystal_door_name=Puerta de cristal
levels.level.default_name=???
levels.level.embers_desc=Las brasas cubren el suelo.
levels.level.embers_name=Ascuas
levels.level.empty_well_desc=El pozo se ha secado.
levels.level.empty_well_name=pozo vacío
levels.level.entrace_name=Entrada de profundidad
levels.level.entrance_desc=Unas escaleras conducen a la parte superior del edificio.
levels.level.exit_desc=Unas escaleras conducen a la parte inferior del edificio.
levels.level.exit_name=Salida de profundidad
levels.level.floor_name=Piso
levels.level.furrowed_grass_name=Vegetación surcada
levels.level.grass_name=Césped
levels.level.hidden_trap=¡Se activa un %s oculto!
levels.level.high_grass_desc=La densa vegetación obstruye la vista.
levels.level.high_grass_name=Hierba alta
levels.level.inactive_trap_desc=La trampa ya se activó anteriormente y ya no representa ningún peligro.
levels.level.inactive_trap_name=Trampa activada
levels.level.locked_door_desc=Esta puerta está cerrada con llave; necesitas la misma llave para abrirla.
levels.level.locked_door_name=Puerta cerrada con llave
levels.level.locked_exit_desc=Unas pesadas barras bloquean las escaleras que bajan.
levels.level.locked_exit_name=Salida de profundidad bloqueada
levels.level.open_door_name=Puerta abierta
levels.level.pedestal_name=Pedestal
levels.level.statue_desc=Alguien quiso adornar este lugar, pero obviamente fracasó.
levels.level.statue_name=Estatua
levels.level.unlocked_exit_name=Salida de profundidad desbloqueada
levels.level.wall_name=Muro
levels.level.water_desc=En caso de incendio, métase en el agua para extinguir el fuego.
levels.level.water_name=Agua
levels.level.well_name=Bien
levels.mininglevel.barricade_desc=La barricada de madera está firmemente colocada y actúa como soporte para el techo.\n\nProbablemente fue construida por los gnolls para brindar cierta protección contra la caída de rocas. _Cualquier celda adyacente estará protegida de trampas y ataques de caída de rocas._\n\nParece que ardería igual que cualquier otra barricada.
levels.mininglevel.boulder_desc=Hay una gran roca que bloquea el paso. Debería ser bastante fácil romperla con un pico.
levels.mininglevel.boulder_name=Roca
levels.mininglevel.crystal_desc=Aquí hay un afloramiento de cristales grandes y coloridos. Estos cristales son frágiles y se pueden romper fácilmente con un pico, o se romperán si se extrae algún material cerca de ellos.
levels.mininglevel.crystal_name=Punta de cristal
levels.mininglevel.gold_extra_desc=Probablemente puedas extraerlo con tu pico.
levels.mininglevel.wall_desc=Una pared de roca lisa, un poco más blanda de lo normal. Puedes excavar a través de ella con tu pico, pero te costará un poco y te dará algo de hambre.
levels.prisonlevel.bookshelf_desc=Probablemente se trate de un vestigio de una biblioteca penitenciaria. ¿Podría incendiarse?
levels.prisonlevel.empty_deco_desc=Hay manchas de sangre antiguas en el suelo.
levels.prisonlevel.region_deco_alt_desc=Una jaula de metal lo suficientemente grande como para albergar a una persona. Cuelga sobre un profundo abismo, suspendida por una cadena.
levels.prisonlevel.region_deco_alt_name=Jaula colgante
levels.prisonlevel.region_deco_desc=Una jaula de metal lo suficientemente grande como para contener a una persona. Parece estar anclada al suelo de alguna manera; no se puede mover.
levels.prisonlevel.region_deco_name=Jaula de prisión
levels.prisonlevel.water_name=Agua oscura y fría
levels.rooms.quest.ambitiousimproom$questentrance.desc=Este pozo siniestro parece ser la entrada a una antigua bóveda enana. Una barrera mágica impide el acceso, pero se puede caminar sobre ella como si hubiera suelo.
levels.rooms.quest.ambitiousimproom$questentrance.name=Entrada a la bóveda
levels.rooms.quest.blacksmithroom$questentrance.desc=Esta escalera conduce a una antigua mina situada justo debajo del taller del herrero.
levels.rooms.quest.blacksmithroom$questentrance.name=Entrada de la mina
levels.rooms.quest.massgraveroom$bones.desc=El suelo está cubierto de huesos, ¿qué ha pasado aquí?
levels.rooms.quest.massgraveroom$bones.name=Fosa común
levels.rooms.quest.mineentrance$questexit.desc=Esta escalera conduce desde la mina hasta el taller del herrero.
levels.rooms.quest.mineentrance$questexit.name=Salida de la mina
levels.rooms.quest.ritualsiteroom$ritualmarker.desc=Un marcador pintado para algún ritual oscuro. Generalmente se colocan velas en las cuatro esquinas.
levels.rooms.quest.ritualsiteroom$ritualmarker.name=Marcador ritual
levels.rooms.special.magicalfireroom$eternalfire.desc=Aquí se alza una densa pared de fuego verde brillante, aparentemente creada por arte de magia. Es tan espesa que impide el paso y prende fuego a todo lo que se acerca demasiado. No muestra signos de extinguirse de forma natural; necesitarás algo para apagarla.
levels.rooms.special.sentryroom$sentry.desc=Este centinela rojo sangre parece estar posicionado aquí para proteger el tesoro al otro extremo de esta habitación. Te disparará rayos de magia desintegradora si entras en la zona que defiende.\n\nEs inmune a todos los efectos dañinos y puede ver a través de la invisibilidad, pero parece tardar un rato en cargarse antes de empezar a disparar.\n\nDe alguna manera, el centinela solo quiere dispararte a ti, como si supiera que los habitantes de la mazmorra no representan ninguna amenaza para el tesoro.
levels.rooms.special.sentryroom$sentry.discover_hint=Puedes encontrar a este enemigo en cualquier parte de la mazmorra.
levels.rooms.special.sentryroom$sentry.name=centinela rojo
levels.rooms.special.toxicgasroom$toxicvent.desc=Un aventurero descuidado debió activar esta trampa hace mucho tiempo. A pesar de estar inactiva, sigue liberando gas tóxico en la habitación y no da señales de detenerse. Necesitarás alguna forma de evitar los daños causados por el gas si quieres explorar esta habitación.
levels.rooms.special.toxicgasroom$toxicvent.name=ventilación tóxica
levels.rooms.special.weakfloorroom$hiddenwell.desc=Apenas se distingue un pozo en las profundidades, ¿quizás haya algo ahí abajo?
levels.rooms.special.weakfloorroom$hiddenwell.name=pozo lejano
levels.sewerlevel.bookshelf_desc=La estantería está repleta de libros baratos e inútiles. ¿Podría incendiarse?
levels.sewerlevel.empty_deco_desc=El suelo está cubierto de musgo húmedo de color amarillento.
levels.sewerlevel.region_deco_desc=Un barril robusto, casi tan grande como tú. Debe estar lleno de algo, porque pesa demasiado para moverlo.
levels.sewerlevel.region_deco_name=barril de almacenamiento
levels.sewerlevel.water_name=Agua turbia
levels.traps.alarmtrap.alarm=¡La trampa emite un sonido penetrante que resuena por toda la mazmorra!
levels.traps.alarmtrap.desc=Esta trampa parece estar conectada a un mecanismo de alarma muy ruidoso. Si se activa, probablemente alertará a todos los que estén en el nivel.
levels.traps.alarmtrap.name=trampa de alarma
levels.traps.blazingtrap.desc=Al pisar esta trampa, se encenderá una potente mezcla química que incendiará una amplia zona.
levels.traps.blazingtrap.name=trampa ardiente
levels.traps.burningtrap.desc=Si se pisa esta trampa, se encenderá una mezcla química que prenderá fuego a la zona circundante.
levels.traps.burningtrap.name=trampa ardiente
levels.traps.chillingtrap.desc=Una vez activadas, las sustancias químicas de esta trampa congelarán rápidamente el aire a su alrededor.
levels.traps.chillingtrap.name=trampa escalofriante
levels.traps.confusiontrap.desc=Al activar esta trampa, se liberará una nube de gas de confusión en la zona inmediata.
levels.traps.confusiontrap.name=trampa de gas de confusión
levels.traps.corrosiontrap.desc=Al activar esta trampa, se liberará una nube de gas ácido letal en la zona inmediata.
levels.traps.corrosiontrap.name=trampa de gas corrosivo
levels.traps.cursingtrap.curse=¡Tu equipo desgastado se vuelve maldito!
levels.traps.cursingtrap.desc=Esta trampa contiene la misma magia maligna que se encuentra en los objetos malditos. Al activarla, maldecirá algunos objetos en las inmediaciones.
levels.traps.cursingtrap.name=trampa de maldiciones
levels.traps.disarmingtrap.desc=Esta trampa contiene magia de teletransportación muy específica, que trasladará el arma de su víctima a otro lugar.
levels.traps.disarmingtrap.disarm=¡Tu arma ha sido teletransportada!
levels.traps.disarmingtrap.name=trampa de desarme
levels.traps.disintegrationtrap.desc=Cuando se activa, esta trampa atravesará al objetivo más cercano con rayos de desintegración, causando un daño significativo y destruyendo objetos.\n\nAfortunadamente, el mecanismo de activación no está oculto.
levels.traps.disintegrationtrap.name=trampa de desintegración
levels.traps.disintegrationtrap.ondeath=Moriste a causa de la trampa de desintegración...
levels.traps.disintegrationtrap.one=¡La trampa desintegra tu %s!
levels.traps.disintegrationtrap.some=¡La trampa desintegra parte de tu %s!
levels.traps.distortiontrap.desc=Construida con magia extraña de origen desconocido, esta trampa convocará a todo tipo de criaturas a este lugar.
levels.traps.distortiontrap.name=trampa de distorsión
levels.traps.explosivetrap.desc=Esta trampa contiene explosivo en polvo y un mecanismo de activación. Al activarla, se producirá una explosión en las inmediaciones.
levels.traps.explosivetrap.name=trampa explosiva
levels.traps.flashingtrap.desc=Al activarse, esta trampa encenderá un potente polvo incandescente almacenado en su interior, cegando, paralizando y lesionando temporalmente a su víctima.\n\nLa trampa debe tener una gran reserva de polvo, ya que puede activarse muchas veces sin romperse.
levels.traps.flashingtrap.name=trampa intermitente
levels.traps.flocktrap.desc=Tal vez sea una broma de algún mago aficionado; activar esta trampa creará un rebaño de ovejas mágicas.
levels.traps.flocktrap.name=trampa para bandadas
levels.traps.frosttrap.desc=Una vez activadas, las sustancias químicas de esta trampa congelarán rápidamente el aire en un amplio radio alrededor de su ubicación.
levels.traps.frosttrap.name=trampa de congelación
levels.traps.gatewaytrap.desc=Esta trampa de teletransportación especial puede activarse un número infinito de veces y siempre teletransporta al mismo lugar.
levels.traps.gatewaytrap.name=trampa de entrada
levels.traps.geysertrap.desc=Cuando se activa, esta trampa provoca que un géiser de agua brote del cielo, dañando a los enemigos en llamas, derribando a todos los personajes cercanos, apagando incendios y convirtiendo el terreno circundante en agua.
levels.traps.geysertrap.name=trampa de géiser
levels.traps.gnollrockfalltrap.desc=Esta trampa de desprendimiento de rocas se creó con algún tipo de ayuda mágica. Al activarse, hará que las rocas se aflojen y caigan inmediatamente desde arriba en un área de 5x5 a su alrededor. Debido a la blandura de las rocas en la zona, no causará tanto daño como una trampa de desprendimiento de rocas normal, pero tu armadura tampoco será efectiva contra ella. Las rocas tampoco caerán en lugares con una barricada adyacente, ya que estas ayudan a sostener el techo. Esta trampa no distingue entre amigos y enemigos, por lo que es igual de dañina para los gnolls que para ti.
levels.traps.gnollrockfalltrap.name=trampa de desprendimiento de rocas de gnoll
levels.traps.grimtrap.desc=Dentro de esta trampa se almacena magia destructiva extremadamente poderosa, suficiente para matar instantáneamente a todos excepto a los héroes más sanos. Al activarla, enviará una ráfaga de magia letal a distancia hacia el personaje más cercano.\n\nPor suerte, el mecanismo de activación no está oculto.
levels.traps.grimtrap.name=trampa macabra
levels.traps.grimtrap.ondeath=Moriste por la explosión de una trampa mortal...
levels.traps.grippingtrap.desc=Esta trampa se adhiere a los pies de quien la activa, dañándolos y ralentizando su movimiento.\n\nDebido a su naturaleza simple, esta trampa puede activarse muchas veces sin romperse.
levels.traps.grippingtrap.name=trampa apasionante
levels.traps.guardiantrap$guardian.desc=Esta aparición azul parece ser un eco invocado de uno de los guardianes de piedra de la mazmorra.
levels.traps.guardiantrap$guardian.desc_weapon=Si bien la estatua en sí es casi incorpórea, el _%s_ que empuña parece real.
levels.traps.guardiantrap$guardian.discover_hint=Puedes encontrar a este enemigo con una trampa específica.
levels.traps.guardiantrap$guardian.name=guardián convocado
levels.traps.guardiantrap.alarm=¡La trampa emite un sonido penetrante que resuena por toda la mazmorra!
levels.traps.guardiantrap.desc=Esta trampa está vinculada a un extraño mecanismo mágico que invocará guardianes y alertará a todos los enemigos en el piso.
levels.traps.guardiantrap.name=trampa del guardián
levels.traps.oozetrap.desc=Esta trampa, al activarse, arrojará una sustancia corrosiva que arderá hasta ser arrastrada por el agua.
levels.traps.oozetrap.name=trampa de lodo
levels.traps.pitfalltrap.desc=Esta trampa está conectada a un gran mecanismo de trampilla, y poco después de activarse, ¡todo lo que esté cerca se deslizará a través del suelo y caerá! Sin embargo, no funcionará en zonas con suelos especialmente duros.
levels.traps.pitfalltrap.name=trampa de foso
levels.traps.pitfalltrap.no_pit=El terreno es demasiado duro para que funcione una trampa de foso.
levels.traps.pitfalltrap.triggered=¡El suelo comienza a ceder alrededor de la trampa activada!
levels.traps.pitfalltrap.triggered_hero=¡El suelo empieza a ceder a tu alrededor!
levels.traps.poisondarttrap.desc=Un pequeño lanzador de dardos debe estar escondido cerca, al activar esta trampa disparará un dardo envenenado al objetivo más cercano.\n\nAfortunadamente, el mecanismo de disparo no está oculto.
levels.traps.poisondarttrap.name=trampa de dardos envenenados
levels.traps.poisondarttrap.ondeath=Moriste a causa de la trampa de dardos envenenados...
levels.traps.rockfalltrap.desc=Esta trampa está conectada a una serie de rocas sueltas en la parte superior; al activarla, ¡estas caerán estrepitosamente sobre toda la habitación! Si la trampa no está en una habitación específica, las rocas caerán en un área alrededor de la trampa. Afortunadamente, el mecanismo de activación no está oculto.
levels.traps.rockfalltrap.name=trampa de desprendimiento de rocas
levels.traps.rockfalltrap.ondeath=Quedaste aplastado por la trampa de desprendimiento de rocas...
levels.traps.shockingtrap.desc=Un mecanismo con una gran cantidad de energía almacenada. Al activar esta trampa, esa energía se liberará en un campo a su alrededor.
levels.traps.shockingtrap.name=trampa impactante
levels.traps.stormtrap.desc=Un mecanismo con una enorme cantidad de energía almacenada. Al activar esta trampa, esa energía se descargará en una gran tormenta eléctrica.
levels.traps.stormtrap.name=trampa de tormenta
levels.traps.summoningtrap.desc=Activar esta trampa invocará a varios monstruos de esta zona a este lugar.
levels.traps.summoningtrap.name=trampa de invocación
levels.traps.teleportationtrap.desc=Cada vez que se active esta trampa, todo lo que esté a su alrededor será teletransportado a ubicaciones aleatorias en este piso.
levels.traps.teleportationtrap.name=trampa de teletransportación
levels.traps.tengudarttrap.desc=Tengu claramente se ha estado preparando para una pelea. Esta trampa activará un lanzador de dardos oculto que disparará un dardo envenenado a lo más cercano que no sea Tengu.\n\nLa trampa está tan bien hecha que el mecanismo de activación es imposible de detectar sin ayuda mágica. Sin embargo, la trampa es visible por un momento cuando se está colocando.
levels.traps.toxictrap.desc=Al activar esta trampa, se liberará una nube de gas tóxico en la zona circundante.
levels.traps.toxictrap.name=trampa de gas tóxico
levels.traps.trap.discover_hint=Esta trampa puede aparecer aleatoriamente en la mazmorra. Cada región tiene trampas diferentes que pueden aparecer.
levels.traps.trap.rankings_desc=Asesinado por: %s
levels.traps.warpingtrap.desc=Esta trampa es similar a una trampa de teletransportación, ¡pero además hará que el héroe pierda el conocimiento del diseño del piso!
levels.traps.warpingtrap.name=trampa deformante
levels.traps.weakeningtrap.desc=La magia oscura de esta trampa absorbe la energía de todo lo que entra en contacto con ella. Sin embargo, los enemigos poderosos pueden resistir el efecto.
levels.traps.weakeningtrap.name=trampa debilitadora
levels.traps.worndarttrap.desc=Un pequeño lanzador de dardos debe estar escondido cerca; al activar esta trampa, disparará al objetivo más cercano.\n\n Sin embargo, debido a su antigüedad, no es muy dañino; ni siquiera está escondido...
levels.traps.worndarttrap.name=trampa de dardos desgastada
levels.traps.worndarttrap.ondeath=Moriste a causa de la trampa de dardos desgastada...
levels.vaultlevel$vaultflametrap.desc=Esta rejilla de ventilación parece emitir llamas verdes a intervalos regulares. _Como se trata solo de una zona de prueba, las llamas de las rejillas no te harán daño._
levels.vaultlevel$vaultflametrap.name=ventilación de llamas de la bóveda

levels.level.sign_desc=No puedes leer el texto desde aquí.
levels.level.sign_name=Firmar
