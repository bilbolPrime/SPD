skills4.smash.intro=Golpea a un enemigo adyacente con fuerza bruta.
skills4.endurance.intro=Aumenta tu salud máxima.
skills4.firm_hand.intro=Mejora tu precisión en el combate cuerpo a cuerpo.
skills4.regeneration.intro=Recupera salud adicional con el tiempo. Deja de funcionar al morir de hambre.
skills4.toughness.intro=Reduce el daño recibido, excepto el hambre.
skills4.knockback.intro=Golpea a un enemigo y lo empuja una casilla hacia atrás. No puede empujar a los jefes.
skills4.second_wind.intro=Restaura algo de salud inmediatamente.
skills4.sure_footing.intro=Reduce la duración del arraigo y de la cojera.
skills4.mastery.intro=Permite usar armas cuerpo a cuerpo más pesadas y atacar más rápido.
skills4.parry.intro=Reduce el siguiente golpe cuerpo a cuerpo que recibas. La guardia dura hasta cuatro turnos.
skills4.smite.intro=Asesta un golpe potente que ignora la mitad de la armadura del objetivo. Consume dos turnos.
skills4.riposte.intro=Fortalece tu próximo golpe cuerpo a cuerpo después del bloqueo. Dura cuatro turnos.
skills4.footwork.intro=Te da más tiempo entre golpes cuerpo a cuerpo para mantener un combo.
skills4.duelist.intro=Aumenta la evasión mientras exactamente un enemigo está a tu lado.
skills4.disarming_strike.intro=Golpea a un enemigo y lo debilita durante tres turnos.
skills4.find_the_gap.intro=Tu tercer golpe cuerpo a cuerpo consecutivo y los siguientes atraviesan parte de la armadura del objetivo.
skills4.aggression.intro=Tu daño cuerpo a cuerpo aumenta a medida que pierdes salud.
skills4.charge.intro=Se lanza hacia un enemigo a una distancia de hasta cuatro casillas y lo golpea. Requiere un camino claro.
skills4.rampage.intro=Golpea a todos los enemigos adyacentes.
skills4.bloodlust.intro=Matar a un enemigo acelera tus ataques cuerpo a cuerpo durante tres turnos.
skills4.war_cry.intro=Debilita a los enemigos visibles dentro de dos casillas.
skills4.rend.intro=Embestida y Frenesí hacen sangrar a los enemigos que sobreviven.
skills4.relentless.intro=Matar a un enemigo reduce la recarga restante de Embestida y Grito de guerra.
skills4.cornered.intro=Reduce el daño cuerpo a cuerpo recibido mientras dos o más enemigos te rodean.

skills4.spark.intro=Dispara una chispa a un enemigo visible.
skills4.spirituality.intro=Aumenta tu maná máximo.
skills4.sorcerer.intro=Tus varitas causan más daño.
skills4.summon_rat.intro=Llama a una rata para que luche por ti.
skills4.meditation.intro=Recupera maná adicional con el tiempo.
skills4.spirit_armor.intro=Absorbe el daño usando un maná por punto absorbido.
skills4.wizard.intro=Tus varitas se recargan más rápido.
skills4.channeling.intro=Acorta los tiempos de reutilización de las habilidades activas, a un mínimo de un turno.
skills4.charged_staff.intro=Los golpes cuerpo a cuerpo con varita recuperan maná.
skills4.arcane_ward.intro=Reduce el siguiente golpe cuerpo a cuerpo que recibes. La protección dura hasta cuatro turnos.
skills4.arcane_strike.intro=Da un golpe mágico que ignora la mitad de la armadura del objetivo.
skills4.conductive.intro=Las cargas de la varita potencian sus golpes cuerpo a cuerpo. Cada golpe que acierta consume una carga en lugar de recargar la varita.
skills4.discharge.intro=Daña a todos los enemigos adyacentes con una explosión de magia.
skills4.spellweave.intro=Aumenta el daño de la varita durante tres turnos después de realizar un golpe cuerpo a cuerpo.
skills4.drain_life.intro=Daña a un enemigo y te cura la mitad de la salud que pierde.
skills4.rabid_minions.intro=Tus criaturas convocadas causan más daño.
skills4.summon_skeleton.intro=Llama a un esqueleto para que luche por ti.
skills4.soul_hunger.intro=Restaura maná cuando matas a un enemigo.
skills4.enrage.intro=Mientras está activo, tus invocaciones causan más daño pero también reciben más daño.
skills4.slow.intro=Ralentiza el movimiento y los ataques de un enemigo.
skills4.summoner.intro=Puedes quedarte con una criatura convocada más.
skills4.dark_pact.intro=Sacrifica cinco puntos de vida para restaurar maná. Requiere al menos seis de salud.

skills4.double_strike.intro=Golpea dos veces seguidas.
skills4.stealth.intro=Hace que sea más difícil que los enemigos te noten.
skills4.evasion.intro=Mejora tus posibilidades de esquivar ataques.
skills4.smoke_bomb.intro=Te hace desaparecer en una nube de humo. Atacar cancela el efecto.
skills4.bandit.intro=Encuentra oro extra en cada pila que recolectes.
skills4.venom.intro=Con esta habilidad activa, tus golpes cuerpo a cuerpo pueden envenenar al objetivo.
skills4.locksmith.intro=Tienes la posibilidad de desarmar una trampa cuando la pisas.
skills4.light_step.intro=Reduce la duración del arraigo y de la cojera.
skills4.dash.intro=Avanza hasta dos casillas por un camino despejado.
skills4.haste.intro=Aumenta tu velocidad de movimiento durante cinco turnos.
skills4.shadow_clone.intro=Crea un clon fuerte o tres clones más débiles para luchar por ti.
skills4.escape.intro=Te libera de las raíces y la cojera, y aumenta la evasión durante cuatro turnos.
skills4.trailblazer.intro=Aumenta tu velocidad de movimiento.
skills4.skirmish.intro=Moverse fortalece tu próximo golpe cuerpo a cuerpo.
skills4.keep_distance.intro=Aumenta la evasión contra enemigos a más de una casilla de distancia.
skills4.ambush.intro=Aumenta el daño cuerpo a cuerpo mientras eres invisible.
skills4.scorpion.intro=Tu veneno causa más daño.
skills4.silent_death.intro=Los ataques cuerpo a cuerpo pueden matar directamente a los enemigos dormidos. Los jefes son inmunes.
skills4.expose.intro=Tus golpes cuerpo a cuerpo ignoran parte de la armadura.
skills4.execution.intro=Aumenta el daño contra enemigos por debajo de un cuarto de salud.
skills4.deadly_throw.intro=Aumenta el daño del arma a distancia.

skills4.accuracy.intro=Tus ataques a distancia son más precisos.
skills4.awareness.intro=Tienes la posibilidad de esquivar un ataque a distancia entrante.
skills4.double_shot.intro=Sigue tu flecha con un segundo disparo. Utiliza dos flechas ordinarias.
skills4.hunting.intro=Encuentra carne cruda a medida que exploras.
skills4.fletching.intro=Crea flechas ordinarias mientras exploras.
skills4.ko_arrow.intro=Tu siguiente flecha ralentiza al objetivo y puede dormirlo.
skills4.woodcraft.intro=Hace que sea más difícil que los enemigos te noten.
skills4.quickdraw.intro=Acelera tus ataques a distancia.
skills4.barkskin.intro=Aumenta tu armadura.
skills4.nature_mend.intro=Restaura algo de salud inmediatamente.
skills4.entangle.intro=Inmoviliza a un enemigo visible en su lugar.
skills4.herbalist.intro=Reduce el daño por veneno.
skills4.dew_keeper.intro=Aumenta la curación recibida del rocío.
skills4.knee_shot.intro=Tus flechas pueden causar cojera al objetivo.
skills4.thicket.intro=Reduce el siguiente golpe cuerpo a cuerpo que recibas. La guardia dura hasta cuatro turnos.
skills4.aimed_shot.intro=Aumenta el daño de tu próximo golpe de flecha.
skills4.long_sight.intro=Aumenta el daño a distancia contra enemigos al menos a cuatro casillas de distancia.
skills4.piercing_shot.intro=Tu próxima flecha ignora parte de la armadura del objetivo.
skills4.iron_tip.intro=Las puntas de hierro permiten que las flechas atraviesen a los enemigos y golpeen a quienes están detrás de ellos. Muros y aliados detienen la flecha.
skills4.mark_prey.intro=Marca a un enemigo durante seis turnos, aumentando tu daño contra él.
skills4.bombvoyage.intro=Convierte una flecha en una bomba. La explosión también puede hacerte daño a ti y a tus aliados.
skills4.follow_through.intro=Matar a un enemigo potencia tu siguiente ataque a distancia durante cuatro turnos.

skills4.curse.intro=Debilita los ataques de un enemigo durante diez turnos.
skills4.necro_spirit.intro=Aumenta tu maná máximo.
skills4.raise_skeleton.intro=Alza un esqueleto a partir de un cadáver en el suelo.
skills4.summon_ghost.intro=Llama a un fantasma para que luche por ti.
skills4.soul_bind.intro=Aumenta el daño de tus invocaciones.
skills4.necro_meditation.intro=Recupera maná adicional con el tiempo.
skills4.necro_drain_life.intro=Drena la salud de un enemigo y recupera la mitad del daño causado.
skills4.master_of_death.intro=Te devuelve a la vida con toda la salud y el maná. Debe recargarse antes de volver a salvarte.
skills4.spirit_army.intro=Permite mantener una criatura invocada más.
skills4.mend_bones.intro=Cura tus invocaciones visibles.
skills4.guardian_bond.intro=Reduce el daño que reciben tus criaturas invocadas.
skills4.corpse_explosion.intro=Hace explotar un cadáver. La explosión alcanza a todos los que lo rodean, incluidos tú y tus aliados.
skills4.raise_skeleton_archer.intro=Alza un arquero esqueleto a partir de un cadáver en el suelo.
skills4.last_rites.intro=Da a cada invocación una oportunidad de sobrevivir a un golpe fatal con un cuarto de salud.
skills4.soul_shelter.intro=Reduce el siguiente golpe cuerpo a cuerpo que recibes. La protección dura hasta cuatro turnos.
skills4.cold_touch.intro=Golpea a un enemigo y lo ralentiza durante tres turnos.
skills4.necro_slow.intro=Ralentiza el movimiento y los ataques de un enemigo.
skills4.bone_spear.intro=Lanza un proyectil de magia sepulcral contra un enemigo.
skills4.death_fed.intro=Restaura maná cuando matas a un enemigo.
skills4.cruel_study.intro=Aumenta el daño causado por las varitas.
skills4.withering_wave.intro=Daña a los enemigos adyacentes con frío y los ralentiza durante tres turnos.

skills4.steady_aim.intro=Tus disparos son más precisos.
skills4.packrat.intro=Lleva más munición en tu arma.
skills4.fast_reload.intro=Acelera la recarga de armas de fuego.
skills4.quick_draw.intro=Dispara tu arma más rápido.
skills4.veteran_company.intro=Los mercenarios bajo tu mando causan más daño.
skills4.field_medicine.intro=Restaura algo de salud inmediatamente.
skills4.powder.intro=Aumenta el daño del arma de fuego.
skills4.steady_nerves.intro=Reduce la duración del arraigo y de la cojera.
skills4.volley.intro=Dispara un tiro más fuerte.
skills4.rally.intro=Te cura a ti y a tus aliados dentro de dos casillas.
skills4.guard_order.intro=Los mercenarios bajo tu mando reciben menos daño.
skills4.suppress.intro=Tu siguiente disparo que acierte debilita al objetivo.
skills4.counter_fire.intro=Recibir daño cuerpo a cuerpo fortalece tu próximo impacto con arma de fuego durante cuatro turnos.
skills4.i_am_the_law.intro=Aumenta temporalmente tu salud máxima y actual durante veinte turnos.
skills4.headshot.intro=Tu siguiente disparo causa más daño y es más preciso.
skills4.intimidate.intro=Asusta a un enemigo visible. Los jefes son inmunes.
skills4.wanted.intro=Gana oro por cada enemigo hostil que mates.
skills4.no_witnesses.intro=Tu siguiente disparo causa más daño y hace huir a los enemigos que sobreviven.
skills4.armor_piercer.intro=Tus ataques a distancia ignoran parte de la armadura.
skills4.execute.intro=Los disparos rematan a los enemigos gravemente heridos. Los jefes son inmunes.
skills4.final_notice.intro=Tu siguiente disparo que acierte ignora más armadura.

