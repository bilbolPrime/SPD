skills4.subclass.gladiator=Los golpes cuerpo a cuerpo exitosos crean un combo, agregando daño a los golpes posteriores.\n\n_+3 precisión cuerpo a cuerpo_\n_ataques cuerpo a cuerpo 10 % más rápidos_
skills4.subclass.berserker=Por debajo del 40% de salud, Furia aumenta el daño en un 50%.\n\n_10% más de daño cuerpo a cuerpo_\n_10% menos de daño recibido_
skills4.subclass.battlemage=Los golpes cuerpo a cuerpo con la varita recuperan una carga y suman el número de cargas al daño.\n\n_Chispa tiene un 50% de probabilidad de cegar al objetivo durante 3 turnos._
skills4.subclass.warlock=Matar enemigos recupera salud y calma el hambre.\n\n_Chispa inflige 5 puntos de daño adicionales._\n_Una criatura invocada adicional._
skills4.subclass.freerunner=Sin equipo demasiado pesado y mientras no sufras inanición, te mueves un 60% más rápido. Tu evasión se duplica al moverte.
skills4.subclass.assassin=Los ataques sorpresa causan daño adicional.\n\n_+1 sigilo_
skills4.subclass.warden=Pisotear hierba alta otorga Piel de corteza. Las plantas pueden soltar semillas y rocío adicionales.
skills4.subclass.sniper=Los ataques a distancia ignoran la armadura y marcan al objetivo para acelerar el siguiente ataque.\n\n_20% más de daño a distancia_
skills4.subclass.spirit_binder=Los golpes cuerpo a cuerpo con la varita recuperan una carga y suman el número de cargas al daño.\n\n_Los esqueletos reanimados duran el doble._
skills4.subclass.lich=Matar enemigos recupera salud y calma el hambre.\n\n_Los esqueletos y arqueros esqueléticos reanimados tienen un 25% más de salud y daño._\n_Una criatura invocada adicional._
skills4.subclass.marshal=Los golpes cuerpo a cuerpo exitosos crean un combo.\n\n_+5 municiones de arma_\n_+1 precisión de arma_
skills4.subclass.executioner=Por debajo del 40% de salud, Furia aumenta el daño un 50% y acelera los disparos un 50%.\n\n_Recarga un 25% más rápida_
