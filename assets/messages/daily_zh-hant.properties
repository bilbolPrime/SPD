daily.brief_0=鼠王的援軍正在趕來。在他們抵達宮廷前擊敗鼠王。被俘的獄卒可以助你戰鬥，守衛把守的倉庫裡也有補給。
daily.brief_1=暴動掩護著天狗逃跑。擊敗兩名越獄頭目，打開他的藏身處，再趕在時間耗盡前擊敗天狗。釋放囚犯可以讓他們對抗守衛，也可以搜查上鎖的軍械庫尋找補給。進入藏身處後，大門會在身後關閉。
daily.brief_2=三名礦工被困在地下，最後一趟升降梯即將離開。打開他們的避難所，將三人全部活著帶回升降梯，再乘梯離開。DM-300正在礦道中遊蕩。你可以與它戰鬥，也可以繞路。補給和上鎖的近路或許能幫你救出所有人。
daily.brief_3=冰爪、霜背豺狼人和霜角獸在洞窟中遊蕩。獵殺三者，再趕在風暴封路前到達遠端出口。狩獵順序由你決定。岔道裡有補給，但搜尋會花費時間。
daily.brief_4=三處儀式地點正向大廳召喚惡魔。在儀式完成前抵達並封印每一處。每封印一處，就能切斷一股援軍。自行選擇路線，需要補給時可以搜查側室。
daily.brief_5=守住哨所，等待援軍到來。隊長必須在五波進攻中活下來。你可以參戰、搜尋附近的補給，或打開牢房解救幫手，其他守軍會留守中央。注意各個入口，後續進攻可能來自多個方向。
daily.brief_6=城裡的黃金藏在國王的寶庫中。找到隊長，奪取鑰匙，打開寶庫，再趕在遠端城門關閉前逃出去。開啟寶庫會觸發警報。可以先搜查倉庫、打開近路，也可以帶著較少的補給速戰速決。
daily.rules=每個日期都有自己的英雄、裝備和地牢。出發前先分配技能點。時間按回合計算，離開活動即結束本次嘗試。每日活動單獨記錄成績，不解鎖徽章或圖鑑內容。
