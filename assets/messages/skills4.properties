skills4.smash.intro=Hits an adjacent enemy with brute force.
skills4.endurance.intro=Increases your maximum health.
skills4.firm_hand.intro=Improves your accuracy in melee combat.
skills4.regeneration.intro=Recover extra health over time. Starvation stops this recovery.
skills4.toughness.intro=Reduces incoming damage, except starvation.
skills4.knockback.intro=Strikes an enemy and pushes it back one tile. Bosses cannot be pushed.
skills4.second_wind.intro=Restores some health immediately.
skills4.sure_footing.intro=Shortens the effects of roots and crippling.
skills4.mastery.intro=Wield heavier melee weapons and attack faster.
skills4.parry.intro=Reduces the next melee hit you take. The guard lasts up to four turns.
skills4.smite.intro=Delivers a heavy blow that ignores half the target's armor. Takes two turns.
skills4.riposte.intro=Strengthens your next melee hit after blocking. Lasts four turns.
skills4.footwork.intro=Gives you more time between melee hits to maintain a combo.
skills4.duelist.intro=Increases evasion while exactly one enemy stands next to you.
skills4.disarming_strike.intro=Strikes an enemy and weakens it for three turns.
skills4.find_the_gap.intro=Your third consecutive melee hit and each hit after it pierce part of the target's armor.
skills4.aggression.intro=Your melee damage rises as you lose health.
skills4.charge.intro=Rushes at an enemy up to four tiles away and strikes it. Requires a clear path.
skills4.rampage.intro=Strikes every adjacent enemy.
skills4.bloodlust.intro=Speeds up melee attacks for three turns after a kill.
skills4.war_cry.intro=Weakens visible enemies within two tiles.
skills4.rend.intro=Charge and Rampage leave surviving enemies bleeding.
skills4.relentless.intro=Kills shorten Charge and War Cry's remaining cooldowns.
skills4.cornered.intro=Reduces melee damage taken while two or more enemies surround you.

skills4.spark.intro=Fires a spark at a visible enemy.
skills4.spirituality.intro=Increases your maximum mana.
skills4.sorcerer.intro=Your wands deal more damage.
skills4.summon_rat.intro=Call a rat to fight for you.
skills4.meditation.intro=Recover extra mana over time.
skills4.spirit_armor.intro=Absorbs damage using one mana per point absorbed.
skills4.wizard.intro=Your wands recharge faster.
skills4.channeling.intro=Shortens active skill cooldowns, to a minimum of one turn.
skills4.charged_staff.intro=Wand melee hits recover mana.
skills4.arcane_ward.intro=Reduces the next melee hit you take. The ward lasts up to four turns.
skills4.arcane_strike.intro=Delivers a magical blow that ignores half the target's armor.
skills4.conductive.intro=Wand melee hits draw on stored charges for extra damage. Each landed hit spends one charge instead of recharging the wand.
skills4.discharge.intro=Damages all adjacent enemies with a burst of magic.
skills4.spellweave.intro=Increases wand damage for three turns after landing a melee hit.
skills4.drain_life.intro=Damages an enemy and heals you for half the health it loses.
skills4.rabid_minions.intro=Your summoned creatures deal more damage.
skills4.summon_skeleton.intro=Call a skeleton to fight for you.
skills4.soul_hunger.intro=Restores mana when you kill an enemy.
skills4.enrage.intro=While active, your summons deal more damage but take more damage too.
skills4.slow.intro=Slow an enemy's movement and attacks.
skills4.summoner.intro=You can keep one more summoned creature.
skills4.dark_pact.intro=Sacrifices five health to restore mana. Requires at least six health.

skills4.double_strike.intro=Strike twice in quick succession.
skills4.stealth.intro=Makes you harder for enemies to notice.
skills4.evasion.intro=Improves your chance to dodge attacks.
skills4.smoke_bomb.intro=Vanish in a cloud of smoke. Attacking breaks the effect.
skills4.bandit.intro=Find extra gold in each pile you collect.
skills4.venom.intro=Your melee hits can poison their target while active.
skills4.locksmith.intro=You have a chance to disarm a trap when you step on it.
skills4.light_step.intro=Shortens the effects of roots and crippling.
skills4.dash.intro=Moves up to two tiles along a clear path.
skills4.haste.intro=Increases your movement speed for five turns.
skills4.shadow_clone.intro=Create one strong clone or three weaker clones to fight for you.
skills4.escape.intro=Breaks roots and crippling, then increases evasion for four turns.
skills4.trailblazer.intro=Increases your movement speed.
skills4.skirmish.intro=Moving strengthens your next melee hit.
skills4.keep_distance.intro=Increases evasion against enemies more than one tile away.
skills4.ambush.intro=Increases melee damage while invisible.
skills4.scorpion.intro=Your venom deals more damage.
skills4.silent_death.intro=Melee attacks can kill sleeping enemies outright. Bosses are immune.
skills4.expose.intro=Your melee hits ignore some armor.
skills4.execution.intro=Increases damage against enemies below one-quarter health.
skills4.deadly_throw.intro=Increases ranged weapon damage.

skills4.accuracy.intro=Your ranged attacks are more accurate.
skills4.awareness.intro=You have a chance to dodge an incoming ranged attack.
skills4.double_shot.intro=Follow your arrow with a second shot. Uses two ordinary arrows.
skills4.hunting.intro=Finds raw meat as you explore.
skills4.fletching.intro=Makes ordinary arrows as you explore.
skills4.ko_arrow.intro=Your next arrow slows its target and may put it to sleep.
skills4.woodcraft.intro=Makes you harder for enemies to notice.
skills4.quickdraw.intro=Speeds up your ranged attacks.
skills4.barkskin.intro=Increases your armor.
skills4.nature_mend.intro=Restores some health immediately.
skills4.entangle.intro=Roots a visible enemy in place.
skills4.herbalist.intro=Reduces poison damage.
skills4.dew_keeper.intro=Increases the healing received from dew.
skills4.knee_shot.intro=Your arrows can cripple their target.
skills4.thicket.intro=Reduces the next melee hit you take. The guard lasts up to four turns.
skills4.aimed_shot.intro=Increases the damage of your next arrow hit.
skills4.long_sight.intro=Increases ranged damage against enemies at least four tiles away.
skills4.piercing_shot.intro=Your next arrow ignores part of the target's armor.
skills4.iron_tip.intro=Iron tips let arrows pass through enemies and strike those behind them. Walls and allies stop the arrow.
skills4.mark_prey.intro=Marks an enemy for six turns, increasing your damage against it.
skills4.bombvoyage.intro=Turn an arrow into a bomb. The explosion can also hurt you and your allies.
skills4.follow_through.intro=A kill strengthens your next ranged hit for four turns.

skills4.curse.intro=Weaken an enemy's attacks for ten turns.
skills4.necro_spirit.intro=Increases your maximum mana.
skills4.raise_skeleton.intro=Raise a skeleton from a corpse on the ground.
skills4.summon_ghost.intro=Call a ghost to fight for you.
skills4.soul_bind.intro=Increases your summons' damage.
skills4.necro_meditation.intro=Recover extra mana over time.
skills4.necro_drain_life.intro=Drain an enemy's health and recover half the damage dealt.
skills4.master_of_death.intro=Return from death with full health and mana. The power must recover before it can save you again.
skills4.spirit_army.intro=Allows you to maintain one more summon.
skills4.mend_bones.intro=Heals your visible summons.
skills4.guardian_bond.intro=Reduces damage taken by your summons.
skills4.corpse_explosion.intro=Detonate a corpse. The blast hits everyone next to it, including you and your allies.
skills4.raise_skeleton_archer.intro=Raise a skeleton archer from a corpse on the ground.
skills4.last_rites.intro=Gives each summon one chance to survive a fatal blow with one-quarter health.
skills4.soul_shelter.intro=Reduces the next melee hit you take. The ward lasts up to four turns.
skills4.cold_touch.intro=Strikes an enemy and slows it for three turns.
skills4.necro_slow.intro=Slow an enemy's movement and attacks.
skills4.bone_spear.intro=Hurls a bolt of grave magic at an enemy.
skills4.death_fed.intro=Restores mana when you kill an enemy.
skills4.cruel_study.intro=Increases the damage dealt by wands.
skills4.withering_wave.intro=Damages adjacent enemies with cold and slows them for three turns.

skills4.steady_aim.intro=Your gunfire is more accurate.
skills4.packrat.intro=Carry more ammunition in your gun.
skills4.fast_reload.intro=Speeds up firearm reloading.
skills4.quick_draw.intro=Fire your gun faster.
skills4.veteran_company.intro=Hired mercenaries under your command deal more damage.
skills4.field_medicine.intro=Restores some health immediately.
skills4.powder.intro=Increases firearm damage.
skills4.steady_nerves.intro=Shortens the effects of roots and crippling.
skills4.volley.intro=Fire a stronger shot.
skills4.rally.intro=Heals you and your allies within two tiles.
skills4.guard_order.intro=Hired mercenaries under your command take less damage.
skills4.suppress.intro=Your next firearm hit weakens its target.
skills4.counter_fire.intro=Taking melee damage strengthens your next firearm hit for four turns.
skills4.i_am_the_law.intro=Temporarily increase your maximum and current health for twenty turns.
skills4.headshot.intro=Your next gunshot deals more damage and gains accuracy.
skills4.intimidate.intro=Frightens a visible enemy. Bosses are immune.
skills4.wanted.intro=Earn gold for each hostile enemy you kill.
skills4.no_witnesses.intro=Your next gunshot deals more damage and sends surviving enemies fleeing.
skills4.armor_piercer.intro=Your ranged hits ignore some armor.
skills4.execute.intro=Gunshots finish off badly wounded enemies. Bosses are immune.
skills4.final_notice.intro=Your next firearm hit ignores extra armor.

