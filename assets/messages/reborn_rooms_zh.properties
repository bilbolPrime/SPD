levels.rebornsiderooms.leave=离开
actors.mobs.npcs.echoreflection.name=你的倒影
actors.mobs.npcs.echoreflection.desc=一个苍白的你静静等候着。只有接受挑战，它才会战斗。击败它可获得一点技能点。离开房间就会结束决斗，倒影也会恢复全部生命。
actors.mobs.npcs.echoreflection.challenge=挑战你的倒影？获胜可获得一点技能点。你可以撤退，但离开房间后，倒影会恢复生命。
actors.mobs.npcs.echoreflection.accept=挑战
actors.mobs.npcs.echoreflection.withdrawn=你的倒影重新归于平静。
actors.mobs.npcs.echoreflection.victory=倒影消散了，留下一张技能卷轴。
actors.mobs.npcs.barbecueking.name=鼠王
actors.mobs.npcs.barbecueking.desc=国王也得吃饭。它找了个安静的角落，正烤着自己的晚餐。
actors.mobs.npcs.barbecueking.greeting=王室要务。非常重要。非常美味。
actors.mobs.npcs.barbecueking.stolen=喂！那是我的！
actors.mobs.npcs.barbecueking.after=小心噎着你。
actors.mobs.npcs.forgottenoffering.name=被遗忘的供品
actors.mobs.npcs.forgottenoffering.desc=水晶下放着一份口粮和一瓶治疗药剂。选一样，另一样就会化为尘土。
actors.mobs.npcs.watchremains.name=阵亡的守卫
actors.mobs.npcs.watchremains.desc=破墙边躺着一具守卫的骸骨，头盔下压着一张纸条。
actors.mobs.npcs.watchremains.note=守了一整夜的门。它们却从墙里进来了。
