items.bags.keyring.info=Jedná se o měděný přívěsek na klíče, který vám umožní uchovávat všechny klíče odděleně od ostatních věcí.
custom.difficulty.easy=Snadný
custom.difficulty.easy.desc=- Začněte se 2 dávkami navíc.\n - Začněte se 2 léčivými lektvary.\n - Začněte s 200 zlaty.\n - Začněte se 2 krystaly duší.\n - Bonus k objevování skrytých dveří a pastí.\n - Mobové jsou slabí, způsobují o 25 % méně poškození, dostávají o 10 % více poškození a mají o 15 % méně HP.\n - Míra objevování šampionů nastavena na 10 %.\n - Míra pádu šampionů nastavena na 30 %.
custom.difficulty.hard=Tvrdý
custom.difficulty.hard.desc=- Lektvar léčení léčí 75 % maximálního zdraví. \n - Mobové jsou silní, způsobují o 10 % větší poškození, dostávají o 10 % méně poškození a mají o 20 % více zdraví. \n - Šance objevování šampionů nastavena na 30 %. \n - Šance pádu šampionů nastavena na 50 %.
custom.difficulty.hell.desc=- Lektvar léčení léčí o 50 % maximálního zdraví.\n - Mobové jsou nesmrtelní, způsobují o 35 % více poškození, dostávají o 30 % méně poškození a mají o 45 % více zdraví.\n - Míra objevování šampionů nastavena na 50 %.\n - Hrdina začíná s o 4 body nižším maximálním zdravím.\n - Hrdina získává o 1 bod nižší maximální zdraví při zvyšování úrovně.\n - Míra pádu šampionů nastavena na 70 %.
custom.difficulty.just_kill_me=Prostě mě zabij
custom.difficulty.just_kill_me.desc=- Začíná se dvěma lektvary zkušeností.\n - Lektvar léčiv léčí 10 % maximálního zdraví.\n - Mobové jsou božstva, způsobují o 60 % více poškození, dostávají o 40 % méně poškození a mají o 75 % více zdraví.\n - Míra objevování šampionů nastavena na 100 %.\n - Hrdina začíná s o 8 méně maximálního zdraví.\n - Hrdina získává o 3 méně maximálního zdraví při zvyšování úrovně.\n - Míra pádu šampionů nastavena na 100 %.
custom.difficulty.nightmare.desc=- Lektvar léčení léčí o 25 % maximálního zdraví.\n - Mobové jsou božští, způsobují o 45 % více poškození, dostávají o 30 % méně poškození a mají o 60 % více zdraví.\n - Míra objevování šampionů nastavena na 70 %.\n - Hrdina začíná s o 8 méně maximálního zdraví.\n - Hrdina získává o 3 méně maximálního zdraví při zvyšování úrovně.\n - Míra pádu šampionů nastavena na 90 %.
custom.difficulty.normal.desc=- Mobové jsou standardní. \n - Šance objevování šampionů nastavena na 20 %. \n - Šance pádu šampionů nastavena na 40 %.
custom.difficulty.super_easy=Super snadné
custom.difficulty.super_easy.desc=- Začněte s 5 extra dávkami.\n - Začněte s 5 léčivými lektvary.\n - Začněte s 500 zlaty.\n - Začněte se 3 krystaly duší.\n - Mobové jsou ubozí, způsobují o 50 % méně poškození, dostávají o 50 % více poškození a mají o 50 % méně HP.\n - Míra objevování šampionů nastavena na 10 %.\n - Míra pádu šampionů nastavena na 10 %.
levels.sign.dead_end=Co tady děláš?!
levels.sign.tip_02=Ne všechny dveře v podzemí jsou na první pohled viditelné. Pokud se zaseknete, hledejte skryté dveře.
levels.sign.tip_03=Nezapomeňte, že zvýšení síly není jediný způsob, jak získat přístup k lepšímu vybavení. Můžete jít i opačně a snížit jeho požadavek na sílu pomocí Svitků vylepšení.
levels.sign.tip_04=Zlato můžete utratit v obchodech v hlubších úrovních podzemí. První z nich je v 6. úrovni.
levels.sign.tip_09=Překvapivý útok má větší šanci na zásah. Například můžete nepřítele přepadnout za zavřenými dveřmi, když víte, že se blíží.
levels.sign.tip_13=Pokud hoříte, nemůžete při levitaci uhasit oheň ve vodě.
levels.sign.tip_21=Pixel-Mart. Speciální ceny pro lovce démonů!
actors.blobs.waterofawareness.drink_message=Jak se napijete, cítíte, jak se vám do mysli vlévají znalosti. Nyní víte všechno o předmětech, které máte ve výbavě. Také cítíte všechny předměty na úrovni a znáte všechna jejich tajemství.
