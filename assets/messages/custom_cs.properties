levels.sign.burn=Jakmile se pokusíte přečíst ceduli, vzplane nazelenalými plameny.
levels.sign.tip_01=Nepřeceňujte své síly, používejte zbraně a brnění, které zvládnete.
levels.sign.tip_05=Pozor na Goo!
levels.sign.tip_06=Pixel-Mart - vše, co potřebujete pro úspěšné dobrodružství!
levels.sign.tip_07=Co nejdříve si najděte své lektvary a svitky. Neodkládejte to na okamžik, kdy je budete skutečně potřebovat.
levels.sign.tip_08=Mít hlad nebolí, ale hladovění ano.
levels.sign.tip_10=Nepouštějte Tengu ven!
levels.sign.tip_11=Pixel-Mart. Utrácejte peníze. Žijte déle.
levels.sign.tip_12=Když vás napadne několik monster najednou, zkuste se schovat za dveře.
levels.sign.tip_14=Nemá smysl vlastnit více než jeden Ankh najednou, protože o ně přijdete po vzkříšení.
levels.sign.tip_15=NEBEZPEČÍ! Těžké stroje mohou způsobit zranění, ztrátu končetin nebo smrt!
levels.sign.tip_16=Pixel-Mart. Bezpečnější život v podzemí.
levels.sign.tip_17=Když vylepšíte očarovanou zbraň, existuje šance toto očarování zničit.
levels.sign.tip_18=Zbraně a brnění se zhoršují rychleji než hůlky a prsteny, ale existuje více způsobů, jak je opravit.
levels.sign.tip_19=Jediný způsob, jak získat Svitek vyhlazení, je dostat ho jako dar od duchů podzemí.
levels.sign.tip_20=V přítomnosti Jeho Veličenstva nejsou povoleny žádné zbraně!
