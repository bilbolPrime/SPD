custom.difficulty.easy=Лёгка
custom.difficulty.easy.desc=- Пачніце з 2 дадатковых пайкоў.\n - Пачніце з 2 зелляў лячэння.\n - Пачніце з 200 золата.\n - Пачніце з 2 крышталяў душы.\n - Бонус за адкрыццё схаваных дзвярэй і пастак.\n - Мобы слабыя, наносяць на 25% менш шкоды, атрымліваюць на 10% больш шкоды і маюць на 15% менш здароўя.\n - Частата з'яўлення чэмпіёна ўстаноўлена на 10%.\n - Частата выпадзення чэмпіёна ўстаноўлена на 30%.
custom.difficulty.hard=Жорстка
custom.difficulty.hard.desc=- Зелле лячэння аднаўляе 75% максімальнага здароўя. \n - Мобы моцныя, наносяць на 10% больш шкоды, атрымліваюць на 10% менш шкоды і маюць на 20% больш здароўя. \n - Частата з'яўлення чэмпіёна ўстаноўлена на 30%. \n - Частата выпадзення чэмпіёна ўстаноўлена на 50%.
custom.difficulty.hell.desc=- Зелле лячэння аднаўляе 50% максімальнага здароўя. \n - Монстры несмяротныя, наносяць на 35% больш шкоды, атрымліваюць на 30% менш шкоды і маюць на 45% больш здароўя. \n - Частата з'яўлення чэмпіёна ўстаноўлена на 50%. \n - Герой пачынае з 4 адзінкамі здароўя менш. \n - Герой атрымлівае на 1 адзінку здароўя менш пры павышэнні ўзроўню. \n - Частата выпадзення чэмпіёна ўстаноўлена на 70%.
custom.difficulty.just_kill_me=Проста забі мяне
custom.difficulty.just_kill_me.desc=- Пачынаецца з двума зеллямі вопыту.\n - Зелле лячэння лечыць 10% ад максімальнага здароўя.\n - Монстры з'яўляюцца бажаствамі, наносяць на 60% больш шкоды, атрымліваюць на 40% менш шкоды і маюць на 75% больш здароўя.\n - Частата з'яўлення чэмпіёна ўстаноўлена на 100%.\n - Герой пачынаецца з максімальным здароўем на 8 менш.\n - Герой атрымлівае на 3 адзінкі меншага максімальнага здароўя пры павышэнні ўзроўню.\n - Частата выпадзення чэмпіёна ўстаноўлена на 100%.
custom.difficulty.nightmare.desc=- Зелле лячэння аднаўляе 25% максімальных здароўя. \n - Монстры падобныя да Бога, наносяць на 45% больш шкоды, атрымліваюць на 30% менш шкоды і маюць на 60% больш здароўя. \n - Частата з'яўлення чэмпіёна ўстаноўлена на 70%. \n - Герой пачынае з максімальным здароўем на 8 менш. \n - Герой атрымлівае на 3 менш максімальнага здароўя пры павышэнні ўзроўню. \n - Частата выпадзення чэмпіёна ўстаноўлена на 90%.
custom.difficulty.normal.desc=- Стандартныя мобы. \n - Частата з'яўлення чэмпіёна ўстаноўлена на 20%. \n - Частата выпадзення чэмпіёна ўстаноўлена на 40%.
custom.difficulty.super_easy=Вельмі лёгка
custom.difficulty.super_easy.desc=- Пачніце з 5 дадатковых пайкоў.\n - Пачніце з 5 зелляў лячэння.\n - Пачніце з 500 золата.\n - Пачніце з 3 крышталяў душы.\n - Мобы жаласныя, наносяць на 50% менш шкоды, атрымліваюць на 50% больш шкоды і маюць на 50% менш здароўя.\n - Частата з'яўлення чэмпіёна ўсталявана на 10%.\n - Частата выпадзення чэмпіёна ўсталявана на 10%.
levels.sign.dead_end=Што ты тут робіш?!
levels.sign.tip_02=Не ўсе дзверы ў падзямеллі бачныя на першы погляд. Калі вы затрымаліся, пашукайце схаваныя дзверы.
levels.sign.tip_03=Памятайце, што павышэнне вашай сілы — не адзіны спосаб атрымаць доступ да лепшага рыштунку. Вы можаце пайсці іншым шляхам, знізіўшы патрабаванні да яго сілы з дапамогай Скруткаў паляпшэння.
levels.sign.tip_04=Вы можаце траціць сваё золата ў крамах на глыбокіх узроўнях падзямелля. Першая з іх знаходзіцца на 6-м узроўні.
levels.sign.tip_09=Раптоўная атака мае больш шанцаў на траплення. Напрыклад, вы можаце падлавіць ворага з засады за зачыненымі дзвярыма, калі ведаеце, што ён набліжаецца.
levels.sign.tip_13=Калі вы гарыце, вы не зможаце патушыць агонь у вадзе падчас левітацыі.
levels.sign.tip_21=Pixel-Mart. Спецыяльныя цэны для паляўнічых на дэманаў!
actors.blobs.waterofawareness.drink_message=Зробіўшы глыток, вы адчуеце, як веды напаўняюць ваш розум. Цяпер вы ведаеце ўсё пра свае экіпіраваныя прадметы. Таксама вы адчуваеце ўсе прадметы на ўзроўні і ведаеце ўсе іх сакрэты.
