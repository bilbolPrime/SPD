levels.sign.burn=Як толькі спрабуеш прачытаць надпіс, ён успыхвае зялёным полымем.
levels.sign.tip_01=Не пераацэньвайце свае сілы, выкарыстоўвайце зброю і даспехі, з якімі можаце справіцца.
levels.sign.tip_05=Сцеражыцеся Гу!
levels.sign.tip_06=Pixel-Mart - усё, што трэба для паспяховага прыгоды!
levels.sign.tip_07=Як мага хутчэй вызначце свае зелля і скруткі. Не адкладайце гэта да таго моманту, калі яны вам сапраўды спатрэбяцца.
levels.sign.tip_08=Быць голадам не баліць, але галадаць баліць.
levels.sign.tip_10=Не выпускай Тэнгу!
levels.sign.tip_11=Pixel-Mart. Трацьце грошы. Жывіце даўжэй.
levels.sign.tip_12=Калі на вас адначасова нападаюць некалькі монстраў, паспрабуйце адступіць за дзверы.
levels.sign.tip_14=Няма сэнсу валодаць больш чым адным Анкх адначасова, бо вы страціце іх пасля ўваскрашэння.
levels.sign.tip_15=НЕБЕЗПЕКА! Цяжкая тэхніка можа прывесці да траўмаў, страты канечнасцяў або смерці!
levels.sign.tip_16=Pixel-Mart. Больш бяспечнае жыццё ў падзямеллі.
levels.sign.tip_17=Калі вы паляпшаеце зачараваную зброю, ёсць шанец знішчыць гэтыя чары.
levels.sign.tip_18=Зброя і даспехі псуюцца хутчэй, чым палачкі і пярсцёнкі, але ёсць больш спосабаў іх паправіць.
levels.sign.tip_19=Адзіны спосаб атрымаць Скрутак Знішчэння — гэта атрымаць яго ў падарунак ад духаў падзямелля.
levels.sign.tip_20=Зброя забароненая ў прысутнасці Яго Вялікасці!
