items.scrolls.scrolloffrostlevel.name=Vorstrol
items.scrolls.scrolloffrostlevel.desc=Er trekt kou uit dit perkament.\n\nJe kunt de boekrol ook overal verscheuren om alle vijanden op de verdieping te bevriezen totdat ze schade oplopen. Bazen en wezens die immuun zijn voor bevriezing worden niet getroffen. Dit veroorzaakt geen schade.
items.scrolls.scrolloffrostlevel.ac_tear=Verscheuren
items.scrolls.scrolloffrostlevel.tear_confirm=Als je deze boekrol verscheurt, komt de magie vrij. Alle vijanden op de verdieping blijven bevroren totdat ze schade oplopen. Bazen en wezens die immuun zijn voor bevriezing worden niet getroffen. Dit veroorzaakt geen schade.\n\nDe boekrol verscheuren?
items.scrolls.scrolloffrostlevel.wrong_place=De rol werkt hier niet.
items.scrolls.scrolloffrostlevel.spent=De doorgang is al geopend. De rol blijft stil.
items.keys.key.ice_depth=Deze sleutel hoort bij verdieping %d van de IJsgrotten.
scenes.interlevelscene$mode.frost=De IJsgrotten binnengaan...
levels.icecaveslevel.water_name=IJskoud water
levels.icecaveslevel.water_desc=Een dunne ijskorst breekt onder je voeten.
levels.icecaveslevel.wall_desc=Sporen van houweelslagen verdwijnen onder dikke ijsaders. De mijnwerkers verlieten deze gangen toen de kou door het gesteente trok.
levels.cavesbosslevel.collapsed_name=Ingestorte grot
levels.cavesbosslevel.collapsed_desc=Een ingestorte grot. De gevallen rotsen versperren de doorgang.
actors.buffs.frostbite.name=Bevriezing
actors.buffs.frostbite.desc=De kou vertraagt je beweging met 20%.
actors.mobs.rimebat.name=Rijpvleermuis
actors.mobs.rimebat.desc=Deze bleke vleermuizen nestelen onder het ijs. Hun koude beet vertraagt beweging even, zodat ze tijd hebben voor een nieuwe aanval.\n\nImmuun voor bevriezing en ijsmagie.
actors.mobs.iceclaw.name=IJsklauw
actors.mobs.iceclaw.desc=Een aaseter met een pantser van samengepakt ijs. Voor een gevecht versterkt hij kort zijn pantser. Vuur smelt die extra bescherming.\n\nImmuun voor bevriezing en ijsmagie.
actors.mobs.frostback.name=Rijpruggnoll
actors.mobs.frostback.desc=Deze gnoll overleeft de kou door onvoorzichtige bezoekers te beroven. Stap opzij als hij zijn wapen heft: de zware slag raakt de plek waar je stond.\n\nImmuun voor bevriezing en ijsmagie.
actors.mobs.shardling.name=IJssplinterling
actors.mobs.shardling.desc=Een rusteloze kluwen ijskristallen. Hij richt voordat hij splinters in een rechte lijn afvuurt. Muren houden het salvo tegen.\n\nImmuun voor bevriezing en ijsmagie.
actors.mobs.hollowminer.name=Holle mijnwerker
actors.mobs.hollowminer.desc=Deze mijnwerker ontsnapte nooit uit de bevroren gangen. Zijn lantaarn brandt nog, hoewel hij al lang dood is. Als hij die kan optillen, roept hij nabije wezens naar het gevecht. Een treffer onderbreekt het signaal.\n\nImmuun voor bevriezing en ijsmagie.
actors.mobs.rimehorn.name=Rijphoorn
actors.mobs.rimehorn.desc=Een zwaar beest met rijp in zijn vacht. Het schraapt over de grond voordat het recht vooruit stormt. Ga opzij terwijl het zich voorbereidt.\n\nImmuun voor bevriezing en ijsmagie.
actors.mobs.oldrime.name=Oude Rijp
actors.mobs.oldrime.desc=De mijnwerkers vonden Oude Rijp onder de berg, begraven in ijs dat ouder was dan hun tunnels. Hun houwelen wekten hem. Nu bewaakt hij de bevroren gangen en de doorgang erachter. Zijn pantser breekt af wanneer hij verzwakt, waardoor zijn ledematen vrijkomen. Pas op voor zware slagen, ijs dat door de vloer breekt en zijn ijzige adem.\n\nImmuun voor bevriezing en ijsmagie.
actors.mobs.oldrime.warning=Oude Rijp haalt uit!
windows.wndjournal.ice_depth=IJs %d
levels.icebosslevel.exit_name=Grotdoorgang
levels.icebosslevel.exit_desc=Een smalle doorgang kronkelt dieper de berg in.
levels.icebosslevel.blocked_name=Bevroren doorgang
levels.icebosslevel.blocked_desc=Een ijsmuur verspert de doorgang achter Oude Rijp.
items.weapon.ice.wrong_hero=Dit wapen is niet voor jou bedoeld.
items.weapon.ice.already_enchanted=Dit wapen is al betoverd.
items.weapon.ice.glaciercleaver.name=Gletsjerkliever
items.weapon.ice.glaciercleaver.desc=Een breed lemmet uit het ijs van Oude Rijp. Een treffer bedekt het doelwit vier beurten lang met rijp. De volgende treffer met een Gletsjerkliever verbrijzelt die voor %d extra schade. Alleen een Krijger kan dit wapen gebruiken.
actors.buffs.frostcoating.name=Met rijp bedekt
actors.buffs.frostcoating.desc=Een dun laagje rijp bedekt dit wezen. Een treffer met een Gletsjerkliever verbrijzelt het.
items.weapon.ice.hoarfroststaff.name=Rijpstaf
items.weapon.ice.hoarfroststaff.desc=Tussen de punten van deze staf verzamelt zich kou. Zijn projectielen doen %d-%d schade vóór vaardigheidsbonussen en vertragen beweging en aanvallen twee beurten lang. Hij begint met drie ladingen en laadt op als een toverstaf. Alleen een Magiër kan hem gebruiken.
items.weapon.ice.rimepick.name=Rijppikhouweel
items.weapon.ice.rimepick.desc=Dit smalle ijspikhouweel vindt de gaten in een pantser. Het negeert een kwart van het pantser van het doelwit, of de helft bij een verraste tegenstander. Alleen een Schurk kan het gebruiken.
items.weapon.ice.frostbow.name=Vorstboog
items.weapon.ice.frostbow.desc=Pijlen van deze boog barsten bij inslag uiteen in scherp ijs. Ze doen %d%% meer schade aan het doelwit en een kwart van die trefferschade aan aangrenzende vijanden. De splinters bevriezen hun slachtoffers niet. Alleen een Jageres kan hem gebruiken.
items.weapon.ice.gravefrostscythe.name=Grafvorstzeis
items.weapon.ice.gravefrostscythe.desc=Rijp bedekt het met botten beklede handvat van deze zeis. Zolang hij is uitgerust, doen je opgeroepen skeletten en geesten %d extra koudeschade per treffer. Alleen een Dodenbezweerder kan hem gebruiken.
items.weapon.ice.frostbiterifle.name=Vrieswondgeweer
items.weapon.ice.frostbiterifle.desc=De kamer van dit geweer is bekleed met ijs dat nooit smelt. Elk raak schot veroorzaakt twee beurten lang bevriezing en vertraagt beweging met 20%. Nieuwe treffers vernieuwen het effect. Alleen een Huurling kan het gebruiken.
library.ice_weapon_drop=Er valt voor elke held een wapen dat bij diens klasse past.

actors.mobs.npcs.prospector.name=Gestrande mijnwerker
actors.mobs.npcs.prospector.desc=Een mijnwerker in een opgelapte jas schuilt bij de trap. Zijn lamp gaat bijna uit.
actors.mobs.npcs.prospector.torches=Mijn lamp houdt het niet lang meer vol. Toen ik vluchtte, liet ik een voorraadkist op deze verdieping achter. Wil je daar _drie fakkels_ uit halen?
actors.mobs.npcs.prospector.iceclaws=De ijsklauwen hebben me uit mijn mijngang verjaagd. Dood _drie ijsklauwen op deze verdieping_, dan kan ik weer aan het werk.
actors.mobs.npcs.prospector.accept=Ik help je.
actors.mobs.npcs.prospector.later=Niet nu.
actors.mobs.npcs.prospector.need_torches=Ik heb _drie fakkels_ nodig. De voorraadkist staat nog ergens op deze verdieping.
actors.mobs.npcs.prospector.claws_left=Nog te doden ijsklauwen: _%d_.
actors.mobs.npcs.prospector.reward=Goed werk. Wat wil je hebben?
actors.mobs.npcs.prospector.rations=Twee voedselrantsoenen
actors.mobs.npcs.prospector.thanks=Weer een zorg minder. Bedankt.
library.quest.prospector_torches.name=Een dovende lamp
library.quest.prospector_torches.desc=Breng drie fakkels naar de gestrande mijnwerker. Een voorraadkist op zijn verdieping bevat er genoeg.
library.quest.prospector_iceclaws.name=IJsklauwen in de mijngang
library.quest.prospector_iceclaws.desc=Dood drie ijsklauwen op de verdieping van de mijnwerker en ga naar hem terug.
library.quest.prospector.reward=Kies een rol van verbetering of twee voedselrantsoenen.
items.scrolls.scrolloffrostlevel.read_confirm=Terwijl je leest, voel je dat je op het punt staat te teleporteren.
