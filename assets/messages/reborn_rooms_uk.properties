levels.rebornsiderooms.leave=Залишити
actors.mobs.npcs.echoreflection.name=ваше відображення
actors.mobs.npcs.echoreflection.desc=Ваша бліда копія чекає нерухомо. Вона битиметься лише після виклику. Перемога дасть одне очко навичок. Якщо залишити кімнату, двобій завершиться, а відображення повністю відновить здоров'я.
actors.mobs.npcs.echoreflection.challenge=Кинути виклик відображенню? Перемога дасть одне очко навичок. Можна відступити, але якщо залишити кімнату, відображення відновить здоров'я.
actors.mobs.npcs.echoreflection.accept=Кинути виклик
actors.mobs.npcs.echoreflection.withdrawn=Ваше відображення знову завмирає.
actors.mobs.npcs.echoreflection.victory=Відображення розчиняється, залишаючи сувій навичок.
actors.mobs.npcs.barbecueking.name=щурячий король
actors.mobs.npcs.barbecueking.desc=Навіть королю треба їсти. Він знайшов тихий куточок, щоб підсмажити собі вечерю.
actors.mobs.npcs.barbecueking.greeting=Королівські справи. Дуже важливі. Дуже смачні.
actors.mobs.npcs.barbecueking.stolen=ГЕЙ! Це було моє!
actors.mobs.npcs.barbecueking.after=Щоб тобі в горлі стало.
actors.mobs.npcs.forgottenoffering.name=забуте підношення
actors.mobs.npcs.forgottenoffering.desc=Під кристалом лежать порція їжі та зілля зцілення. Виберіть одне — інше обернеться на порох.
actors.mobs.npcs.watchremains.name=полеглий вартовий
actors.mobs.npcs.watchremains.desc=Біля проламаного муру лежать кістки вартового. З-під шолома стирчить клаптик паперу.
actors.mobs.npcs.watchremains.note=Тримав двері всю ніч. Вони прийшли крізь стіну.
