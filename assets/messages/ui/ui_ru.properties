ui.updatenotification$wndupdate.button=Перейти на страницу обновления
ui.updatenotification$wndupdate.desc=Pixel Dungeon регулярно обновляется, внося изменения в существующий игровой контент или создавая совершенно новый контент! Баланс игры также часто улучшается в обновлениях, чтобы определенные предметы/герои/враги не были слишком сильными или слишком слабыми. Обновления также включают исправления ошибок и другие улучшения стабильности.
ui.updatenotification$wndupdate.title=Доступно обновление!
