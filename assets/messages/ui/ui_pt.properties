ui.updatenotification$wndupdate.desc=Pixel Dungeon é atualizado regularmente com reformulações no conteúdo existente do jogo ou com conteúdo totalmente novo! O equilíbrio do jogo também é frequentemente melhorado nas atualizações, para que os itens/heróis/inimigos específicos não sejam demasiado fortes nem demasiado fracos. As atualizações incluem também correções de bugs e outras melhorias de estabilidade.
