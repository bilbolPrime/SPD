items.weapon.weaponeffects.weaponeffect.smite.prefix=Bárbaro
items.weapon.weaponeffects.weaponeffect.smite.name=%s de bárbaro
items.weapon.weaponeffects.weaponeffect.smite.desc=Esta arma es _bárbara_. Cada golpe tiene un _20%_ de probabilidad de lanzar _Herir de nivel 1_.
items.weapon.weaponeffects.weaponeffect.smite.activate=¡Herir!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Repulsor
items.weapon.weaponeffects.weaponeffect.knockback.name=%s de repulsión
items.weapon.weaponeffects.weaponeffect.knockback.desc=Esta arma es _repulsora_. Cada golpe tiene un _20%_ de probabilidad de empujar al enemigo _una casilla_. No puede empujar a los jefes.
items.weapon.weaponeffects.weaponeffect.knockback.activate=¡Retroceso!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Serpentino
items.weapon.weaponeffects.weaponeffect.venom.name=%s de serpiente
items.weapon.weaponeffects.weaponeffect.venom.desc=Esta arma es _serpentina_. Cada golpe tiene un _20%_ de probabilidad de envenenar al objetivo.
items.weapon.weaponeffects.weaponeffect.venom.activate=¡Veneno!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Lisiador
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s de lisiadura
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Esta arma es _lisiadora_. Los disparos que aciertan tienen un _20%_ de probabilidad de lisiar al enemigo durante _10 turnos_. Los jefes son inmunes.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=¡Lisiado!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Rúnico
items.weapon.weaponeffects.weaponeffect.spark.name=%s de runas
items.weapon.weaponeffects.weaponeffect.spark.desc=Esta varita es _rúnica_. Su magia tiene un _20%_ de probabilidad de activar _Chispa_, que inflige _4–8_ de daño mágico adicional.
items.weapon.weaponeffects.weaponeffect.spark.activate=¡Chispa!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Maleficiado
items.weapon.weaponeffects.weaponeffect.curse.name=%s de maleficio
items.weapon.weaponeffects.weaponeffect.curse.desc=Esta varita es _maleficiada_. Su magia tiene un _20%_ de probabilidad de debilitar al objetivo, reduciendo su daño un _5%_ durante _10 turnos_.
items.weapon.weaponeffects.weaponeffect.curse.activate=¡Maldición!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Drenador
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s de drenaje
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Esta varita es _drenadora_. Su magia tiene un _20%_ de probabilidad de activar _Drenar vida_, que inflige _8–16_ de daño mágico adicional y te cura por la vida robada.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=¡Drenaje!

items.armor.armorprefix.stalwart.name=%s tenaz
items.armor.armorprefix.stalwart.desc=Esta armadura es _tenaz_. Los ataques enemigos tienen un _20%_ de probabilidad de activar _Dureza de nivel 5_, reduciendo su daño un _20%_.
items.armor.armorprefix.stalwart.activate=¡Dureza!

items.armor.armorprefix.vigilant.name=%s vigilante
items.armor.armorprefix.vigilant.desc=Esta armadura es _vigilante_. Te da un _20%_ de probabilidad de esquivar un ataque enemigo a distancia.
items.armor.armorprefix.vigilant.activate=¡Percepción!

items.armor.armorprefix.elusive.name=%s esquiva
items.armor.armorprefix.elusive.desc=Esta armadura es _esquiva_. Recibir daño de un ataque enemigo tiene un _20%_ de probabilidad de aumentar tu evasión en _5_ durante _5 turnos_.
items.armor.armorprefix.elusive.activate=¡Evasión!
