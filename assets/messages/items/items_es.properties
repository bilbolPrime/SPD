items.weapon.melee.flail$spinabilitytracker.desc=La duelista está haciendo girar su mayal, acumulando daño para su próximo ataque regular con él. Cada giro toma un turno pero aumenta el daño, hasta un máximo de tres giros. El mayal también tiene garantizado golpear mientras gira.\n\nGiros actuales: %1$d%%.\nTurnos restantes: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=hilado
items.weapon.melee.flail.ability_desc=El Duelista puede girar un mayal para acumular energía durante un breve periodo. Cada turno que gire el mayal, infligirá +%d puntos de daño en su siguiente ataque normal, hasta un máximo de 3 veces. Un mayal giratorio también garantiza un impacto. Solo empezar a girar el mayal consume una carga.
items.weapon.melee.flail.ability_name=girar
items.weapon.melee.flail.desc=Una bola con pinchos sujeta a un mango mediante una cadena. Muy difícil de manejar, pero devastadora si impacta con fuerza.
