items.waterskin.ac_drink=BEBER
items.waterskin.collected=Recoges la gota de rocío en tu odre.
items.waterskin.desc=Un recipiente para líquidos, hecho de cuero y cuerda, sellado con un tapón de corcho.
items.waterskin.desc_full=El odre lleno parece irradiar energía, ¿quizás pueda usarse para bendecir otro objeto de supervivencia?
items.waterskin.desc_heal=Actualmente, el odre se utiliza para almacenar agua curativa. Cuanto más lleno esté el odre, mayor será la curación instantánea que experimentarás al beber de él. Solo beberás la cantidad necesaria.
items.waterskin.desc_water=Ahora mismo, el odre solo contiene agua potable. Seguramente hay algo más que podría almacenar en la mazmorra.
