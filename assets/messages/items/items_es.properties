items.weapon.curses.dazzling.desc=En ocasiones, las armas deslumbrantes emiten destellos de luz cegadora, impidiendo que todo aquel que pueda verlas.
items.weapon.curses.dazzling.elestrike_desc=Un ataque elemental con una maldición deslumbrante tiene un 50% de probabilidad de cegar a cada enemigo dentro del alcance durante 6 turnos.
