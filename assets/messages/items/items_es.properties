items.armor.clotharmor.discover_hint=Uno de los héroes comienza con este objeto.
items.armor.clotharmor.name=armadura de tela
items.armor.curses.antientropy.desc=La maldición anti-entropía actúa contra las fuerzas del universo, atrayendo energía hacia quien la porta y alejándola de su entorno. Esto provoca que quien la porta se incendie brevemente, ¡pero congela todo a su alrededor!
items.armor.curses.antientropy.name=%s de antientropía
items.armor.curses.bulk.desc=Las armaduras voluminosas dan una apariencia más grande e imponente, pero en realidad no ofrecen mayor defensa. Peor aún, su mayor tamaño dificulta enormemente el paso por las puertas.
items.armor.curses.bulk.name=%s a granel
items.armor.curses.corrosion.desc=La capa de corrosión es capaz de reventar con un fluido corrosivo, cubriendo todo lo que se encuentra en la zona con una sustancia pegajosa y ácida.
items.armor.curses.corrosion.name=%s de corrosión
items.armor.curses.displacement.desc=La maldición del desplazamiento intenta poner a salvo al portador cuando es atacado. Sin embargo, es demasiado efectiva, teletransportando al usuario aleatoriamente por todo el nivel.
items.armor.curses.displacement.name=%s de desplazamiento
items.armor.curses.metabolism.desc=La maldición del metabolismo convierte directamente la saciedad en salud cuando quien la padece está herido, proporcionando un impulso a la curación, pero provocando rápidamente inanición.
items.armor.curses.metabolism.name=%s del metabolismo
items.armor.curses.multiplicity.desc=Las armaduras malditas con el poder de la multiplicidad contienen una peligrosa magia de duplicación. A veces crean una imagen especular del portador, ¡pero también es muy probable que dupliquen al atacante!
items.armor.curses.multiplicity.name=%s de multiplicidad
items.armor.curses.overgrowth.desc=La armadura de vegetación exuberante está cubierta de diversas plantas en flor. Si bien este efecto luce interesante, no aporta defensa alguna, ¡y estas plantas se activarán aleatoriamente en combate!
items.armor.curses.overgrowth.name=%s de crecimiento excesivo
items.armor.curses.stench.desc=Las armaduras que desprenden un hedor insoportable liberarán nubes de gas tóxico, lo cual es peligroso para todo lo que quede atrapado en la nube.
items.armor.curses.stench.name=%s de hedor
items.armor.duelistarmor.desc=Mientras lleva puesta esta armadura de placas y capa, el Duelista puede realizar una habilidad especial.
items.armor.duelistarmor.name=coraza de héroe
items.armor.glyphs.affection.desc=Este poderoso glifo manipula la mente de los atacantes, encantándolos temporalmente.
items.armor.glyphs.affection.name=%s de afecto
items.armor.glyphs.antimagic.desc=Este poderoso glifo permite que la armadura defienda a su portador tanto de ataques mágicos como físicos. Esta defensa mágica no se ve afectada por el nivel de la armadura.
items.armor.glyphs.antimagic.name=%s de antimagia
items.armor.glyphs.brimstone.desc=Este glifo protege al portador y sus pertenencias del fuego, anulando por completo sus daños y efectos negativos.
items.armor.glyphs.brimstone.name=%s de azufre
items.armor.glyphs.camouflage.desc=Este glifo permite a quien lo lleva camuflarse entre la hierba alta, otorgándole invisibilidad temporal.
items.armor.glyphs.camouflage.name=%s de camuflaje
items.armor.glyphs.entanglement.desc=Este glifo hace crecer una armadura de tierra alrededor del portador para absorber el daño, pero esta armadura se romperá si el portador se mueve.
items.armor.glyphs.entanglement.name=%s de entrelazamiento
items.armor.glyphs.flow.desc=Este glifo manipula el flujo del agua alrededor del portador, lo que le permite moverse mucho más rápido a través de ella.
items.armor.glyphs.flow.name=%s de flujo
items.armor.glyphs.obfuscation.desc=Este glifo oculta a quien lo lleva, lo que dificulta su detección.
items.armor.glyphs.obfuscation.name=%s de ofuscación
items.armor.glyphs.potential.desc=Este glifo acumula energía al ser golpeado, otorgando carga a la varita del portador cuando se activa.
items.armor.glyphs.potential.name=%s de potencial
items.armor.glyphs.repulsion.desc=Este glifo devuelve la fuerza contra los atacantes, haciéndolos salir disparados hacia atrás.
items.armor.glyphs.repulsion.name=%s de repulsión
items.armor.glyphs.stone.desc=Este glifo rodea la armadura con una pesada piedra mágica que hace imposible esquivar, pero bloquea el daño en proporción a la evasión.
items.armor.glyphs.stone.name=%s de piedra
items.armor.glyphs.swiftness.desc=Este glifo aumenta la velocidad del portador siempre que no esté cerca de un enemigo.
items.armor.glyphs.swiftness.name=%s de rapidez
items.armor.glyphs.thorns.desc=Este poderoso glifo daña a los atacantes, provocando que sangren lentamente cuando atacan al portador.
items.armor.glyphs.thorns.name=%s de espinas
items.armor.glyphs.viscosity$defereddamage.desc=El daño se inflige lentamente con el tiempo en lugar de inmediatamente.\n\nDaño diferido restante: %d.
items.armor.glyphs.viscosity$defereddamage.name=daños diferidos
items.armor.glyphs.viscosity$defereddamage.ondeath=El daño diferido te mató...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Muerto por daños diferidos
items.armor.glyphs.viscosity.deferred=diferido %d
items.armor.glyphs.viscosity.desc=Este glifo es capaz de almacenar el daño infligido al portador, administrándoselo lentamente en lugar de todo a la vez.
items.armor.glyphs.viscosity.name=%s de viscosidad
items.armor.huntressarmor.desc=Mientras lleva puesta esta capa, la Cazadora puede realizar una habilidad especial.
items.armor.huntressarmor.name=capa de héroe
items.armor.huntressarmor.no_enemies=No se ve ningún enemigo.
items.armor.leatherarmor.desc=Armadura hecha de piel de monstruo curtida. No es tan ligera como una armadura de tela, pero ofrece mejor protección.
items.armor.leatherarmor.name=armadura de cuero
items.armor.magearmor.desc=Mientras lleva puesta esta magnífica túnica, el mago puede realizar una habilidad especial.
items.armor.magearmor.name=túnica de héroe
items.armor.mailarmor.desc=Los eslabones metálicos entrelazados dan como resultado una armadura resistente pero flexible.
items.armor.mailarmor.name=armadura de malla
items.armor.platearmor.desc=Enormes placas de metal se unen para formar un traje que proporciona una protección inigualable a cualquier aventurero lo suficientemente fuerte como para soportar su asombroso peso.
items.armor.platearmor.name=armadura de placas
items.armor.roguearmor.desc=Mientras viste esta vestimenta oscura, el Pícaro puede realizar una habilidad especial.
items.armor.roguearmor.name=atuendo de héroe
items.armor.scalearmor.desc=Las escamas metálicas cosidas a un chaleco de cuero crean una armadura flexible pero protectora.
items.armor.scalearmor.name=armadura de escamas
items.armor.warriorarmor.desc=Mientras lleva puesta esta pesada armadura de placas, el guerrero puede realizar una habilidad especial.
items.armor.warriorarmor.name=armadura de placas de héroe
items.artifacts.alchemiststoolkit.ac_brew=ELABORAR CERVEZA
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZAR
items.artifacts.alchemiststoolkit.cursed=¡Tu maldito kit de herramientas te impide usar la alquimia!
items.artifacts.alchemiststoolkit.desc=Este kit contiene varios reactivos y hierbas, además de un pequeño frasco para mezclar, lo que permite practicar la alquimia sobre la marcha. El frasco contiene lo que parecen ser cristales de energía alquímica en forma líquida.
items.artifacts.alchemiststoolkit.desc_cursed=El maldito kit de herramientas se ha unido a ti y se niega a dejarte usar la alquimia.
items.artifacts.alchemiststoolkit.desc_hint=El kit de herramientas equipado genera energía alquímica lentamente a medida que ganas experiencia. Parece que la mezcla en el vial podría mejorarse añadiéndole cristales de energía.
items.artifacts.alchemiststoolkit.desc_warming=El conjunto de herramientas se está calentando actualmente y estará listo para usarse dentro de poco tiempo.
items.artifacts.alchemiststoolkit.energize_1=6 energía: +1 nivel
items.artifacts.alchemiststoolkit.energize_all=Energía %1$d: +niveles %2$d
items.artifacts.alchemiststoolkit.energize_desc=Cada 6 cristales de energía le darán al kit de herramientas suficiente energía para subir de nivel, lo que aumenta la velocidad a la que el kit de herramientas genera energía con el tiempo y la rapidez con la que se calienta.\n\n¿Cuánta energía te gustaría usar?
items.artifacts.alchemiststoolkit.name=kit de herramientas del alquimista
items.artifacts.alchemiststoolkit.need_energy=Necesitas al menos 6 de energía para eso.
items.artifacts.alchemiststoolkit.not_ready=Tu caja de herramientas aún no ha terminado de calentarse.
items.artifacts.artifact.cannot_wear_two=No puedes usar dos objetos iguales.
items.artifacts.artifact.curse_known=Se puede sentir una magia maligna acechando en el interior del artefacto.
items.artifacts.artifact.equip_cursed=El artefacto se vincula dolorosamente a ti.
items.artifacts.artifact.need_to_equip=Necesitas equipar tu artefacto para hacer eso.
items.artifacts.artifact.not_cursed=Este artefacto está libre de magia malévola.
items.artifacts.capeofthorns$thorns.desc=Tu capa irradia energía, rodeándote en un campo de fuerza deflectora. Todo el daño que recibas se reduce mientras el efecto de espinas esté activo. Además, si el atacante está a tu lado, la cantidad reducida se refleja de vuelta hacia el atacante. Turnos restantes de espinas:
items.artifacts.capeofthorns$thorns.inert=Tu capa vuelve a quedar inerte.
items.artifacts.capeofthorns$thorns.levelup=¡Tu capa se vuelve más fuerte!
items.artifacts.capeofthorns$thorns.name=espinas
items.artifacts.capeofthorns$thorns.radiating=¡Tu capa comienza a irradiar energía, te sientes protegido!
items.artifacts.capeofthorns.desc=Estas láminas de metal colapsadas del DM-300 se han unido formando una capa rígida. Parece almacenar una energía profunda; ¿quizás contenga parte del poder del DM-300?
items.artifacts.capeofthorns.desc_active=La capa parece estar liberando energía almacenada, irradiando un poder protector.
items.artifacts.capeofthorns.desc_inactive=La capa se siente reconfortantemente pesada sobre tus hombros, parece estar ganando energía con el daño que recibes.
items.artifacts.capeofthorns.name=cabo de espinas
items.artifacts.chaliceofblood.ac_prick=PINCHAZO
items.artifacts.chaliceofblood.desc=Este brillante cáliz de plata está curiosamente adornado con afiladas gemas en el borde.
items.artifacts.chaliceofblood.desc_1=Al sostener el cáliz, sientes una extraña necesidad de pincharte con las afiladas gemas.
items.artifacts.chaliceofblood.desc_2=Parte de tu sangre se acumula en el cáliz; puedes sentir sutilmente cómo el cáliz te infunde energía vital, aumentando la regeneración natural de tu salud. Aun sabiendo que dolerá, sientes el deseo de cortarte con el cáliz.
items.artifacts.chaliceofblood.desc_3=El cáliz está rebosante de tu esencia vital. Puedes sentir cómo el cáliz te devuelve la energía vital.
items.artifacts.chaliceofblood.desc_cursed=El cáliz maldito se ha adherido a tu mano e impide que regeneres tu salud.
items.artifacts.chaliceofblood.name=cáliz de sangre
items.artifacts.chaliceofblood.no=No, cambié de opinión.
items.artifacts.chaliceofblood.ondeath=El Cáliz te absorbe la esencia vital...
items.artifacts.chaliceofblood.onprick=Te pinchas y tu esencia vital se drena en el cáliz.
items.artifacts.chaliceofblood.prick_warn=Cada vez que uses el cáliz, drenará más de tu energía vital, pero a cambio mejorará aún más tu regeneración natural de salud.\n\nActualmente, pincharte a ti mismo infligirá _%1$d-%2$d daño_, aunque este daño puede ser reducido por _tanto el bloqueo físico como el mágico o la reducción de daño_. Sin considerar los efectos de reducción de daño, pincharte a ti mismo actualmente tiene una _%3$s%% probabilidad_ de drenar completamente tu fuerza vital.\n\n¿Estás seguro de que quieres ofrecerle al cáliz más energía vital?
items.artifacts.chaliceofblood.yes=Sí, sé lo que estoy haciendo.
items.artifacts.cloakofshadows$cloakstealth.desc=Tu manto de sombras te otorga invisibilidad mientras estás envuelto en él. Permanecerás cubierto hasta que se cancele o tu manto se agote.\n\nMientras eres invisible, los enemigos no pueden atacarte ni seguirte. Los ataques físicos y los efectos mágicos (como pergaminos y varitas) cancelarán inmediatamente la invisibilidad.\n\nTurnos hasta que se cargue. Usar: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=¡Tu capa se vuelve más fuerte!
items.artifacts.cloakofshadows$cloakstealth.name=encapotado
items.artifacts.cloakofshadows$cloakstealth.no_charge=Tu capa se ha quedado sin energía.
items.artifacts.cloakofshadows.ac_stealth=SIGILO
items.artifacts.cloakofshadows.cooldown=Tu capa necesita %d rondas más para recargarse.
items.artifacts.cloakofshadows.cursed=No puedes usar una capa maldita.
items.artifacts.cloakofshadows.desc=Una capa mágica de valor incalculable, robada de la armería real hace muchos años por el Pícaro. Al usarla, puede volverse completamente invisible por un corto tiempo. Cuanto más se use la capa, más fuerte se volverá, lo que permitirá al Pícaro volverse invisible con mayor frecuencia y por períodos más largos.
items.artifacts.cloakofshadows.discover_hint=Uno de los héroes comienza con este objeto.
items.artifacts.cloakofshadows.name=manto de sombras
items.artifacts.cloakofshadows.no_charge=Tu capa aún no se ha recargado lo suficiente como para poder usarla.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=¿Cómo sobreviviste a eso?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Ojalá tuviera uno de esos...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=¡Oh, Dios mío! ¡Todavía estás vivo!
items.artifacts.driedrose$ghosthero.def_verb=esquivado
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Lo siento... buena suerte...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Termínalo... sin mí...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=No... no puedo...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Buena suerte...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Cansada... por ahora...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Volveré...
items.artifacts.driedrose$ghosthero.desc=Una figura etérea de aspecto frágil con forma humanoide. Su poder parece estar ligado a la rosa que tienes.\n\nEste fantasma puede que no sea gran cosa, pero parece ser tu único amigo verdadero aquí abajo.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=¿Por qué está pasando esto? Creí que lo habíamos logrado.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=¿Cómo es posible que esa cosa siga influyendo en este mundo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Espero que sepas lo que estás haciendo con ese amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Supongo que aún no hemos terminado.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=¡Ya hemos llegado muy lejos, podemos terminar esto!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=¡Un poco más adelante, podremos salir de aquí!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Ningún ser humano ni enano ha estado aquí desde hace muchísimo tiempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=¿Qué podría llevar a los enanos a abandonar una mina de oro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Es una pena que todo el oro que hay aquí sea inútil en la superficie.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Las criaturas de aquí son retorcidas, igual que en las alcantarillas.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Incluso los murciélagos son sanguinarios aquí.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=No hay rastro de ningún equipo minero, ¿lo habrán recuperado los enanos?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Los enanos eran laboriosos, pero codiciosos.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Así que la metrópolis enana realmente ha caído.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Espero que la superficie nunca acabe como este lugar.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Se supone que los enanos no deben verse tan pálidos.
items.artifacts.driedrose$ghosthero.dialogue_city_5=No sé qué es peor, los enanos o sus creaciones.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Parece que ahora los enanos también son monstruos sin cerebro.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=¿Qué es este lugar?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Este lugar es aterrador...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=¿En qué estaban pensando los enanos al jugar con el poder de esta manera?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Los monstruos de aquí son de otro mundo, ¿de dónde han salido?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=¿Lo sientes? Es como si algo nos estuviera observando.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=¡Menos mal que hay antorchas, está muy oscuro aquí!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=He oído historias sobre este lugar, pero ninguna buena.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Este lugar siempre fue más una mazmorra que una prisión.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=No puedo imaginar lo que ocurrió cuando este lugar fue abandonado.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Parece que tanto los prisioneros como los guardias se han convertido en monstruos.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=¿Qué podría ser el responsable de todos estos esqueletos?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Estas personas no tenían por qué haber terminado así...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Estas alcantarillas solían ser seguras; incluso había gente que vivía aquí en invierno.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Me pregunto qué habrá pasado con las patrullas de vigilancia, ¿se habrán dado por vencidas?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Tenía familia en la superficie, espero que estén a salvo.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Los guardias no pudieron derrotar a estos monstruos, pero tal vez nosotros sí.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Si incluso las alcantarillas son tan peligrosas, me pregunto qué habrá debajo...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=¿Qué pudo haber provocado que estas ratas y cangrejos crecieran tanto?
items.artifacts.driedrose$ghosthero.direct_prompt=¿Qué tengo que hacer?
items.artifacts.driedrose$ghosthero.directed_attack_1=De acuerdo, atacaré ese.
items.artifacts.driedrose$ghosthero.directed_attack_2=Yo me encargo de ese.
items.artifacts.driedrose$ghosthero.directed_attack_3=Atractivo...
items.artifacts.driedrose$ghosthero.directed_attack_4=¡Vamos a por ellos!
items.artifacts.driedrose$ghosthero.directed_attack_5=Yo tengo ese.
items.artifacts.driedrose$ghosthero.directed_follow_1=De acuerdo, te seguiré.
items.artifacts.driedrose$ghosthero.directed_follow_2=Te seguiré.
items.artifacts.driedrose$ghosthero.directed_follow_3=Siguiéndote...
items.artifacts.driedrose$ghosthero.directed_follow_4=¡De acuerdo, vamos!
items.artifacts.driedrose$ghosthero.directed_follow_5=Te cubro las espaldas.
items.artifacts.driedrose$ghosthero.directed_position_1=De acuerdo, mantendré esa postura.
items.artifacts.driedrose$ghosthero.directed_position_2=Iré allí y lo defenderé.
items.artifacts.driedrose$ghosthero.directed_position_3=Reposicionamiento...
items.artifacts.driedrose$ghosthero.directed_position_4=¡Estoy en camino!
items.artifacts.driedrose$ghosthero.directed_position_5=Iré para allá.
items.artifacts.driedrose$ghosthero.discover_hint=Puedes encontrar a este personaje con un artefacto específico.
items.artifacts.driedrose$ghosthero.hello=Hola de nuevo %s.
items.artifacts.driedrose$ghosthero.introduce=Mi espíritu está ligado a esta rosa, era muy preciada para mí, un regalo de mi amor a quien dejé en la superficie. No puedo regresar con él, pero gracias a ti tengo una segunda oportunidad para completar mi viaje. Cuando pueda, responderé a tu llamado y lucharé contigo. Mientras tengas la rosa, puedo oír tu voz, así que puedes usarla para guiarme desde lejos. Ojalá tengas éxito donde yo fracasé...
items.artifacts.driedrose$ghosthero.name=fantasma triste
items.artifacts.driedrose$ghosthero.player_killed_1=¡No!...
items.artifacts.driedrose$ghosthero.player_killed_2=No pude ayudarlos...
items.artifacts.driedrose$ghosthero.player_killed_3=No así...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Solo los enanos construirían una máquina minera que matara a los intrusos.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Esa cosa es enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=¿Cómo es posible que esto se haya mantenido activo durante tanto tiempo?
items.artifacts.driedrose$ghosthero.seen_goo_1=¡Cuidado con Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Muchos de mis amigos murieron por culpa de esto, ¡es hora de la venganza!
items.artifacts.driedrose$ghosthero.seen_goo_3=¡No se puede permitir que semejante abominación siga con vida!
items.artifacts.driedrose$ghosthero.seen_king_1=Cuando la gente dice que el poder corrompe, a esto se refieren.
items.artifacts.driedrose$ghosthero.seen_king_2=Ahora es más un lich que un rey.
items.artifacts.driedrose$ghosthero.seen_king_3=Incluso en la muerte, los enanos obedecen a su amo.
items.artifacts.driedrose$ghosthero.seen_tengu_1=El único prisionero que queda es un asesino letal. Por supuesto...
items.artifacts.driedrose$ghosthero.seen_tengu_2=¡Nos ha atrapado!
items.artifacts.driedrose$ghosthero.seen_tengu_3=He oído historias de terror sobre esa máscara...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, esto no tiene buena pinta.
items.artifacts.driedrose$ghosthero.seen_yog_2=¿Así que así es como luce un dios?
items.artifacts.driedrose$ghosthero.seen_yog_3=Esto va a doler...
items.artifacts.driedrose$petal.desc=Un frágil pétalo seco que, de alguna manera, ha sobrevivido hasta aquí en la mazmorra.
items.artifacts.driedrose$petal.levelup=Se añade el pétalo a la rosa.
items.artifacts.driedrose$petal.maxlevel=¡La rosa está terminada!
items.artifacts.driedrose$petal.name=pétalo seco
items.artifacts.driedrose$petal.no_room=No queda espacio para este pétalo, así que lo desechas.
items.artifacts.driedrose$petal.no_rose=No tienes ninguna rosa a la que añadir este pétalo.
items.artifacts.driedrose$wndghosthero.armor_prompt=Seleccione una armadura
items.artifacts.driedrose$wndghosthero.cant_cursed=El fantasma solo puede usar equipo del que estés seguro de que no está maldito.
items.artifacts.driedrose$wndghosthero.cant_strength=El fantasma no es lo suficientemente fuerte como para usar eso.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Puede que el fantasma no sea lo suficientemente fuerte como para usar eso.
items.artifacts.driedrose$wndghosthero.cant_unique=El fantasma no puede usar objetos únicos.
items.artifacts.driedrose$wndghosthero.desc=El fantasma es débil por sí solo, pero su forma es lo suficientemente sólida como para equiparlo con un arma y armadura. Podrá usar estos objetos igual que tú. El fantasma actualmente puede equipar objetos que requieren hasta _%d fuerza._
items.artifacts.driedrose$wndghosthero.title=Equipo de Ghost
items.artifacts.driedrose$wndghosthero.weapon_prompt=Seleccione un arma
