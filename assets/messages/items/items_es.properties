items.weapon.enchantments.unstable.desc=Este encantamiento irradia energía caótica, actuando como un encantamiento diferente con cada impacto.
items.weapon.enchantments.unstable.elestrike_desc=Un ataque elemental con un encantamiento inestable aplica un efecto de encantamiento aleatorio a cada enemigo dentro del alcance, excepto al objetivo principal.
items.weapon.enchantments.unstable.name=%s inestable
items.weapon.enchantments.vampiric.desc=Este poderoso encantamiento absorbe la fuerza vital de los enemigos con cada golpe, canalizándola de vuelta hacia el portador. El efecto es más fuerte cuanto menor sea la salud del portador.
