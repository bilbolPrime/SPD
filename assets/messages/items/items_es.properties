items.weapon.melee.whip.typical_ability_desc=La Duelista puede _azotar_ a todos los enemigos a su alrededor con un látigo. Esta habilidad normalmente inflige _%1$d-%2$d de daño_, ataca a todos los enemigos dentro del rango de ataque y tiene un impacto garantizado.
items.weapon.melee.wornshortsword.ability_desc=El Duelista puede atacar a un enemigo con una espada corta desgastada. Esto inflige daño de %1$d-%2$d y el impacto está garantizado. Si el ataque mata a un enemigo, es instantáneo y el Duelista puede volver a usarlo gratis en un plazo de 5 turnos.
items.weapon.melee.wornshortsword.ability_name=adherirse
