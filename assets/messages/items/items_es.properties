items.weapon.melee.flail.stats_desc=Esta es un arma bastante imprecisa.\nEsta arma no puede realizar un ataque sorpresa.
items.weapon.melee.flail.typical_ability_desc=El Duelista puede girar un mayal para acumular energía durante un breve periodo. Cada turno que gire el mayal, infligirá +%d puntos de daño en su siguiente ataque normal, hasta un máximo de 3 veces. Un mayal giratorio también garantiza un impacto. Solo empezar a girar el mayal consume una carga.
items.weapon.melee.gauntlet.ability_desc=El Duelista puede realizar un _ataque combinado_ con un guantelete de piedra. Este ataque tiene un impacto garantizado e inflige _+%d de daño_ por cada vez que el Duelista haya impactado con un ataque cuerpo a cuerpo o con un arma arrojadiza normal. Si no impacta durante 5 turnos, este combo se reinicia.
items.weapon.melee.gauntlet.ability_name=golpe combinado
items.weapon.melee.gauntlet.desc=Este enorme guantelete está hecho de tela carmesí con pesadas piedras mágicas incrustadas. La tela se ajusta al cuerpo, haciendo que las gruesas placas de piedra se sientan casi como una segunda piel. Blandir un arma tan pesada requiere fuerza, pero añade una potencia tremenda a tus golpes.
items.weapon.melee.gauntlet.name=guantelete de piedra
