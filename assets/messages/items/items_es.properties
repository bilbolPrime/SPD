items.artifacts.hornofplenty.desc=Este cuerno no se puede soplar, sino que parece llenarse de comida a medida que avanzas y ganas experiencia. Puedes consumir cada carga individualmente como un tentempié, o comer hasta saciarte.
items.artifacts.hornofplenty.desc_cursed=El cuerno maldito se ha adherido a tu costado, parece más ansioso por tomar alimento que por producirlo.
items.artifacts.hornofplenty.desc_hint=Quizás exista una forma de aumentar la potencia del cuerno proporcionándole energía alimenticia.
items.artifacts.hornofplenty.eat=Se come del cuerno.
items.artifacts.hornofplenty.feed=El cuerno consume tu ofrenda de comida.
items.artifacts.hornofplenty.full=¡Tu cuerno está lleno de comida!
items.artifacts.hornofplenty.levelup=¡El cuerno consume tu ofrenda de comida y aumenta su fuerza!
items.artifacts.hornofplenty.maxlevel=¡Tu cuerno ha consumido toda la comida que podía!
items.artifacts.hornofplenty.name=cuerno de abundancia
items.artifacts.hornofplenty.no_food=¡Tu cuerno no tiene comida para comer!
items.artifacts.hornofplenty.prompt=Seleccione algún alimento
items.artifacts.hornofplenty.reject=Tu cuerno rechaza la fruta insípida y cruda.
