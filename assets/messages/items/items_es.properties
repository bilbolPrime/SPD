items.weapon.missiles.boomerang.desc=Lanzado al enemigo, este proyectil de madera plano y curvado volverá a las manos de quien lo lanzó.
items.weapon.missiles.boomerang.durability=Gracias a su sólida construcción, este bumerán no se romperá con el uso.
items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.darts.adrenalinedart.desc=Estos dardos tienen una punta con un compuesto a base de cardo veloz que aumenta la velocidad de movimiento y ataque de los aliados, o reduce brevemente la velocidad de movimiento de los enemigos. El dardo en sí sigue siendo dañino para los enemigos, pero no para los aliados.
items.weapon.missiles.darts.adrenalinedart.name=dardo de adrenalina
items.weapon.missiles.darts.blindingdart.desc=Estos dardos tienen una punta con un compuesto a base de hierba ciega que ciega a su objetivo durante un breve periodo. Sin embargo, no desorientan, por lo que el enemigo seguirá sabiendo dónde te vio por última vez.
items.weapon.missiles.darts.blindingdart.name=dardo cegador
items.weapon.missiles.darts.chillingdart.desc=Estos dardos tienen una punta recubierta con un compuesto a base de casquete polar que enfriará significativamente a su objetivo.
items.weapon.missiles.darts.chillingdart.name=dardo escalofriante
items.weapon.missiles.darts.cleansingdart.desc=Estos dardos tienen una punta impregnada con un compuesto a base de magia que inmuniza temporalmente a los aliados contra todos los efectos negativos o elimina los efectos positivos de los enemigos. Incluso podrían olvidar brevemente que te están atacando o huyendo. El dardo en sí sigue siendo dañino para los enemigos, pero no para los aliados.
items.weapon.missiles.darts.cleansingdart.name=dardo limpiador
items.weapon.missiles.darts.dart.ac_tip=CONSEJO
items.weapon.missiles.darts.dart.desc=Estos sencillos palos de madera con punta de púas están lastrados para volar con precisión y picar a su presa con un simple movimiento de muñeca. Se les pueden añadir semillas para obtener efectos adicionales al lanzarlos.
items.weapon.missiles.darts.dart.name=dardo
items.weapon.missiles.darts.dart.prompt=Seleccione una semilla
items.weapon.missiles.darts.dart.tip_all=Punta %1$d dardos con semillas %2$d
items.weapon.missiles.darts.dart.tip_cancel=Cancelar
items.weapon.missiles.darts.dart.tip_desc=Una semilla se puede combinar con uno o dos dardos para darles punta. Cada tipo de semilla produce su propio tipo de dardo con punta, con un efecto único de un solo uso. Al añadir estas semillas a un dardo, se obtendrá un _%s_.
items.weapon.missiles.darts.dart.tip_one=Punta 1 dardo con 1 semilla
items.weapon.missiles.darts.dart.tip_title=Dardos de punta
items.weapon.missiles.darts.dart.tip_two=Punta 2 dardos con 1 semilla
items.weapon.missiles.darts.dart.unlimited_uses=Gracias a su sencilla construcción, los dardos durarán prácticamente para siempre.
items.weapon.missiles.darts.displacingdart.desc=Estos dardos tienen una punta compuesta a base de un compuesto a base de hoja marchita que teletransportará a su objetivo a una corta distancia.
items.weapon.missiles.darts.displacingdart.name=dardo de desplazamiento
items.weapon.missiles.darts.healingdart.desc=Estos dardos tienen una punta con un compuesto a base de hierba solar que proporciona una ráfaga de curación a su objetivo. El dardo en sí sigue siendo dañino para los enemigos, pero no dañará a los aliados.
items.weapon.missiles.darts.healingdart.name=dardo curativo
items.weapon.missiles.darts.holydart.desc=Estos dardos tienen una punta impregnada con un compuesto a base de flor estelar que infunde energía sagrada en su objetivo. Los aliados y enemigos comunes serán bendecidos, pero los enemigos no muertos o demoníacos sufrirán graves daños. El dardo en sí sigue siendo dañino para los enemigos, pero no para los aliados.
items.weapon.missiles.darts.holydart.name=dardo sagrado
items.weapon.missiles.darts.incendiarydart.desc=Estos dardos tienen una punta recubierta con un compuesto a base de flor de fuego que estallará en brillantes llamas al impactar.
items.weapon.missiles.darts.incendiarydart.name=dardo incendiario
items.weapon.missiles.darts.paralyticdart.desc=Estos dardos están recubiertos con un compuesto a base de raíces terrestres que paraliza a su objetivo durante un breve periodo de tiempo.
items.weapon.missiles.darts.paralyticdart.name=dardo paralizante
items.weapon.missiles.darts.poisondart.desc=Estos dardos están rematados con un compuesto a base de musgo de la tristeza que envenenará a su objetivo.
items.weapon.missiles.darts.poisondart.name=dardo envenenado
items.weapon.missiles.darts.rotdart.desc=Estos dardos letales tienen una punta recubierta con un compuesto ácido a base de bayas podridas, que corroe agresivamente todo lo que toca. Los enemigos más poderosos resistirán la mayor parte del efecto, pero la corrosión es lo suficientemente fuerte como para acabar fácilmente con la mayoría de los enemigos comunes. Duran más que otros dardos con punta, pero su durabilidad no se puede aumentar.
items.weapon.missiles.darts.rotdart.discover_hint=Puedes crear este objeto utilizando una semilla de una misión específica.
items.weapon.missiles.darts.rotdart.name=dardo podrido
