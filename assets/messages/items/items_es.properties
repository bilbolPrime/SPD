items.weapon.curses.displacing.desc=Las armas de desplazamiento están imbuidas de magia de teletransportación caótica, y poseen la capacidad de teletransportar a los enemigos aleatoriamente por el suelo.
items.weapon.curses.displacing.elestrike_desc=Un ataque elemental con una maldición de desplazamiento tiene un 50% de probabilidad de teletransportar a cada enemigo dentro del alcance.
items.weapon.curses.displacing.name=desplazando %s
items.weapon.curses.explosive.desc=Las armas explosivas acumulan energía gradualmente y explotan, dañando todo lo que se encuentre cerca.
items.weapon.curses.explosive.desc_cool=Tu arma está fría al tacto.
items.weapon.curses.explosive.desc_hot=¡Tu arma está caliente! ¡Está a punto de explotar!
items.weapon.curses.explosive.desc_warm=Tu arma está acumulando energía y calentándose...
items.weapon.curses.explosive.elestrike_desc=Un ataque elemental con una maldición explosiva tiene un 50% de probabilidad de provocar una explosión en un enemigo aleatorio dentro del alcance.
items.weapon.curses.explosive.hot=¡Caliente!
items.weapon.curses.explosive.name=explosivo %s
items.weapon.curses.explosive.warm=Cálido...
items.weapon.curses.friendly.desc=Las armas aliadas son más adecuadas para los pacifistas, ya que ocasionalmente activan magia que hace imposible luchar.
items.weapon.curses.friendly.elestrike_desc=Un ataque elemental con una maldición amistosa tiene un 50% de probabilidad de encantar a cada enemigo dentro del alcance durante 6 turnos.
items.weapon.curses.friendly.name=amigable %s
items.weapon.curses.polarized.desc=Un arma polarizada se ve afectada por magia que provoca que su ataque cause un 50% más de daño o ningún daño en absoluto.
items.weapon.curses.polarized.elestrike_desc=Un ataque elemental con una maldición polarizada tiene un 50% de probabilidad de infligir entre 24 y 36 puntos de daño a cada enemigo dentro del alcance.
items.weapon.curses.polarized.name=polarizado %s
items.weapon.curses.sacrificial.desc=Las armas sacrificiales exigirán sangre de quien las porte a cambio de atacar a los enemigos. Cuanto más sano esté quien las porte, más sangre le quitará la maldición.
items.weapon.curses.sacrificial.elestrike_desc=Un ataque elemental con una maldición sacrificial provoca que el héroe y cada enemigo dentro del alcance sangren hasta perder 12 puntos de vida.
items.weapon.curses.sacrificial.name=sacrificio %s
items.weapon.curses.wayward$waywardbuff.desc=La magia de tu arma errante se ha activado, lo que la vuelve extremadamente imprecisa durante un breve período. Ten en cuenta que esto no afecta a los ataques que tienen un impacto garantizado, como los ataques sorpresa. Atacar con éxito con el arma errante eliminará este efecto inmediatamente.\n\nTurnos restantes: %s.
items.weapon.curses.wayward$waywardbuff.name=rebelde
items.weapon.curses.wayward.desc=Las armas descontroladas a veces se vuelven extremadamente imprecisas. Esta magia dura poco tiempo al activarse, pero se puede disipar asestando un golpe con el arma descontrolada.
items.weapon.curses.wayward.elestrike_desc=Un ataque elemental con una maldición errante tiene un 50% de probabilidad de maldecir a cada enemigo dentro del alcance durante 6 turnos.
items.weapon.curses.wayward.name=%s descarriado
items.weapon.enchantments.blazing.desc=Este encantamiento provoca que broten llamas del arma, incendiando a los enemigos e infligiendo daño adicional a aquellos que ya estén en llamas.
items.weapon.enchantments.blazing.elestrike_desc=Un ataque elemental con un encantamiento llameante propaga el fuego a todas las casillas dentro del alcance, y dura 8 turnos.
items.weapon.enchantments.blazing.name=%s llameante
items.weapon.enchantments.blocking$blockbuff.desc=El encantamiento de bloqueo de tu arma te ha otorgado un breve aumento en tu poder defensivo!\n\nEscudo restante: %d\n\nTurnos restantes: %s.
items.weapon.enchantments.blocking$blockbuff.name=bloqueo
items.weapon.enchantments.blocking.desc=Las armas de bloqueo tienen la posibilidad de protegerte brevemente después de atacar con ellas.
items.weapon.enchantments.blocking.elestrike_desc=Un ataque elemental con un encantamiento de bloqueo otorga al Duelista 6 puntos de escudo adicionales por cada enemigo dentro del alcance.
items.weapon.enchantments.blocking.name=Bloqueando %s
items.weapon.enchantments.blooming.desc=Las armas florecientes contienen magia que hará que brote vegetación sobre o alrededor de aquellos a quienes alcancen.
items.weapon.enchantments.blooming.elestrike_desc=Un ataque elemental con un encantamiento floreciente extiende la hierba hasta 8 casillas en un radio de 8, y enraíza a todos los enemigos en el radio de 6 turnos.
items.weapon.enchantments.blooming.name=floreciente %s
items.weapon.enchantments.chilling.desc=Los enemigos alcanzados por este encantamiento quedan congelados, lo que ralentiza sus movimientos y ataques.
items.weapon.enchantments.chilling.elestrike_desc=Un ataque elemental con un encantamiento gélido propaga aire helado a cada casilla dentro del alcance, el cual dura 8 turnos.
