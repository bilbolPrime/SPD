items.amulet.ac_end=TERMINA EL JUEGO
items.amulet.ascent_desc=Comienzas a sentir el gran y terrible poder de Yog-Dzewa que irradia del amuleto. ¡Regresar a través de la mazmorra como un mortal podría ser más difícil de lo que pensabas!\n\nSi continúas ascendiendo con el amuleto, la mazmorra se volverá más peligrosa, los teletransportes entre pisos estarán deshabilitados y solo podrás ganar el juego derrotando enemigos mientras asciendes por la mazmorra.\n\nPuedes dejar el amuleto aquí por ahora si quieres ascender sin comenzar este desafío, o activar el amuleto antes de ascender para terminar el juego normalmente.
items.amulet.ascent_no=Detente ahora
items.amulet.ascent_title=Ascensión
items.amulet.ascent_yes=¡Continuar!
items.amulet.desc=El Amuleto de Yendor es el artefacto más poderoso conocido por humanos y enanos. Sus cristales resplandecientes contienen un poder increíble y maravilloso.
items.amulet.desc_ascent=Se desconocen los orígenes del amuleto, pero es evidente que ha sido fuertemente influenciado por el poder de Yog-Dzewa. La mazmorra parece doblegarse a la voluntad de Yog a medida que avanzas, ¡haciendo que los enemigos sean mucho más numerosos y poderosos! Además, ya no puedes activar ni descartar el amuleto, casi como si estuviera maldito.
items.amulet.desc_origins=Se desconocen los orígenes del amuleto. La historia cuenta que el Rey de los Enanos se jactaba de haberlo descubierto poco antes de que la civilización enana cortara todo contacto. ¿Cómo lo encontró? ¿Cómo se lo arrebató Yog-Dzewa? Esas son preguntas para otro momento; lo importante ahora es que el amuleto es tuyo.
items.amulet.discover_hint=Puedes encontrar este objeto en el fondo de la mazmorra...
items.amulet.name=amuleto de Yendor
items.ankh.ac_bless=bendecir
items.ankh.bless=Bendices el ankh con agua mágica.
items.ankh.desc=Este antiguo símbolo de inmortalidad permite volver a la vida tras morir. Al resucitar se pierden todos los objetos que no lleves equipados.
items.ankh.desc_blessed=Este antiguo símbolo de inmortalidad otorga la capacidad de volver a la vida después de la muerte. El ankh ha sido bendecido y ahora es mucho más poderoso. El ankh se sacrificará para salvarte en un momento de peligro mortal.
items.ankh.discover_hint=Puedes comprar este artículo en una tienda.
items.ankh.name=ankh
items.arcaneresin.ac_apply=APLICAR
items.arcaneresin.apply=¡Recubres tu varita con resina, aumentando así su poder!
items.arcaneresin.desc=Este fino polvo brilla entre tonos de púrpura y blanco. Puede actuar como un amplificador de energías mágicas, ¡aumentando el nivel de las varitas cuando se les aplica!\n\nUpmejorar una varita cuesta 1, 2 o 3 resinas dependiendo del nivel inicial de la varita. La resina puede mejorar las varitas hasta un máximo de +3.\n\nLas mejoras de resina son _sobrescritas por otras fuentes de mejora_ (como pergaminos de mejora) y no se aplican cuando se infunde una varita en el bastón del mago.
items.arcaneresin.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.arcaneresin.level_too_high=Esa varita es demasiado poderosa para que la resina la mejore.
items.arcaneresin.name=resina arcana
items.arcaneresin.not_enough=¡No tienes suficiente resina para eso!
items.arcaneresin.prompt=Selecciona una varita
