items.bags.seedpouch.desc=Esta pequeña bolsa de terciopelo permite guardar cualquier cantidad de semillas. Muy práctica.
items.bags.seedpouch.name=bolsa de semillas
items.potions.potionofmight.desc=Este potente líquido recorre tus músculos y aumenta permanentemente tu fuerza en un punto y tu salud en cinco.
items.potions.potionofmight.name=Poción de poder
items.rings.ringofdetection.desc=Este anillo te permite descubrir trampas y puertas secretas sin detenerte a buscar. Si está degradado, embota tus sentidos y hace más difícil descubrir secretos, incluso al buscarlos activamente.
items.rings.ringofdetection.name=Anillo de detección
items.rings.ringofhaggler.desc=Este anillo no tiene ningún poder mágico, pero indica a los comerciantes que su dueño pertenece al Gremio de Ladrones. Suelen ofrecer un descuento a cambio de que se los deje en paz durante un tiempo. Mejorar este anillo no aporta más beneficios.
items.rings.ringofhaggler.name=Anillo del regateador
items.rings.ringofherbalism.desc=Este anillo aumenta tus probabilidades de encontrar rocío y semillas al pisotear la hierba.
items.rings.ringofherbalism.name=Anillo de Herboristería
items.rings.ringofmending.desc=Este anillo mejora la regeneración del cuerpo y permite recuperar la salud más rápido. Un anillo degradado ralentiza la regeneración natural o incluso la detiene.
items.rings.ringofmending.name=anillo de regeneración
items.rings.ringofpower.desc=El campo de energía que emana de este anillo vuelve más poderosas tus varitas. Un anillo degradado las debilita.
items.rings.ringofpower.name=Anillo de Poder
items.rings.ringofsatiety.desc=Este anillo te permite pasar más tiempo sin comer. Un anillo degradado produce el efecto contrario.
items.rings.ringofsatiety.name=Anillo de saciedad
items.rings.ringofshadows.desc=Si llevas este anillo, es menos probable que tus enemigos te detecten. Los anillos de sombras degradados alertarán a los enemigos que, de otro modo, no habrían notado tu presencia.
items.rings.ringofshadows.name=Anillo de Sombras
items.rings.ringofthorns.desc=Aunque este anillo no tiene espinas reales, los enemigos que te atacan reciben una parte del daño que te infligen. Mejorarlo no aporta más beneficios.
items.rings.ringofthorns.name=Anillo de espinas
items.scrolls.scrollofchallenge.desc=Al leerse en voz alta, este pergamino desatará un rugido desafiante que despertará a todos los monstruos y les alertará de la ubicación del lector.
items.scrolls.scrollofchallenge.name=pergamino del desafío
items.scrolls.scrollofenchantment.desc=Este pergamino es capaz de imbuir un arma o una armadura con un encantamiento aleatorio, otorgándole un poder especial.
items.scrolls.scrollofenchantment.name=pergamino de encantamiento
items.scrolls.scrollofpsionicblast.desc=Este pergamino contiene energía destructiva que puede canalizarse psiónicamente para infligir un daño masivo a todas las criaturas dentro de su campo de visión. Un destello de luz cegará temporalmente a todos los que se encuentren en el área de efecto, incluido quien lea el pergamino.
items.scrolls.scrollofpsionicblast.name=pergamino de explosión psiónica
items.scrolls.scrollofwipeout.desc=Lee este pergamino para desatar la ira de los espíritus de la mazmorra, que aniquilarán a todo lo que encuentres en este nivel. Bueno, casi todo. Algunas de las criaturas más poderosas podrían no verse afectadas.
items.scrolls.scrollofwipeout.name=pergamino de aniquilación
items.wands.wandofblink.desc=Esta varita permite teletransportarte en la dirección elegida. Las criaturas y los obstáculos bloquean la teletransportación.
items.wands.wandofblink.name=varita de traslación
items.wands.wandoffirebolt.desc=Esta varita dispara ráfagas de fuego mágico. Prende el terreno inflamable y daña y quema a las criaturas que alcanza.
items.wands.wandoffirebolt.name=varita de fuego
