items.weapon.melee.whip.ability_desc=La Duelista puede _azotar_ a todos los enemigos a su alrededor con un látigo. Esta habilidad inflige _%1$d-%2$d de daño_, ataca a todos los enemigos dentro del rango de ataque y tiene un impacto garantizado.
items.weapon.melee.whip.ability_name=latigazo
items.weapon.melee.whip.desc=Si bien la cuerda con púas en el extremo de esta arma causa poco daño, su alcance es inigualable.
