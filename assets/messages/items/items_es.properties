items.weapon.melee.spear.ability_desc=El Duelista puede usar la punta de una lanza para _clavar_ a un enemigo que esté dentro del alcance pero no adyacente. Esto inflige _%1$d-%2$d de daño_, empuja al enemigo hacia atrás y tiene un impacto garantizado.
