items.armor.armor.seal_attached=El sello roto del Guerrero está unido a esta armadura. Cuando esté a punto de sufrir heridas que le resten la mitad de su salud, le otorgará el escudo _%d_.
items.armor.armor.seal_transfer=El sello roto del guerrero debe adherirse a la armadura que lleva puesta para que le beneficie. ¿Deseas separar automáticamente el sello de la armadura que te quitas y adherirlo a la que te equipas?
