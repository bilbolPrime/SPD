items.scrolls.exotic.exoticscroll.unknown_desc=En este pergamino negro está escrita una runa mágica brillante e indescifrable. Parece ser ajena a esta tierra; ¿quién sabe qué efecto tendrá al ser leída en voz alta?
items.scrolls.exotic.exoticscroll.yngvi=Exótico pergamino de YNGVI
items.scrolls.exotic.scrollofantimagic.desc=El encantamiento de este pergamino te rodeará con un aura mágica que bloquea temporalmente todos los efectos mágicos, tanto dañinos como beneficiosos. Esto incluye la mayoría de los efectos de objetos mágicos como varitas, pergaminos, anillos, artefactos, encantamientos y maldiciones. Sin embargo, las habilidades de armadura heroica son lo suficientemente poderosas como para funcionar de todos modos.
items.scrolls.exotic.scrollofantimagic.name=pergamino antimagia
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Una arena mágica ha aparecido a tu alrededor, denotada por una niebla roja ondulante.\n\nMientras estés en la niebla, tu hambre no aumentará y recibirás 33%% menos daño de todas las fuentes. Si tienes otras fuentes de reducción de daño (como armadura), se aplicarán después de la 33%% reducción.\n\nTurnos restantes: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena de desafío
items.scrolls.exotic.scrollofchallenge.desc=Cuando se lee en voz alta, este pergamino desatará un gran rugido que atrae a los enemigos hacia el usuario mientras simultáneamente crea una pequeña arena a su alrededor.\n\nMientras el lector permanezca en esta arena recibirá un 33% menos de daño de todas las fuentes (esto se aplica antes de otras formas de reducción de daño) y no perderá saciedad.\n\nEl tamaño de la arena escalará con el tamaño del área en la que se encuentre el lector. Será particularmente pequeño en algunas áreas de jefes.
items.scrolls.exotic.scrollofchallenge.name=pergamino del desafío
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Tu pergamino de adivinación ha identificado los siguientes elementos:
items.scrolls.exotic.scrollofdivination.desc=Este pergamino identificará aleatoriamente cuatro tipos de objetos que desconoces. Los tipos identificados pueden ser el color de una poción, la runa de un pergamino o la gema de un anillo. Los objetos identificados no necesariamente serán los que llevas contigo.
items.scrolls.exotic.scrollofdivination.name=pergamino de adivinación
items.scrolls.exotic.scrollofdivination.nothing_left=¡Ya no queda nada por identificar!
items.scrolls.exotic.scrollofdread.desc=Cuando se lea, este pergamino emitirá un destello de luz roja que infundirá un terror increíble en todos los enemigos en tu campo de visión. ¡Tan grande es este efecto que intentarán huir rápidamente de toda la mazmorra, para no ser vistos nunca más!\n\nAl igual que con el terror, este efecto puede expirar con el tiempo o si el enemigo es atacado.\n\nLos enemigos de voluntad fuerte, como los jefes, serán infligidos con terror normal en su lugar.
items.scrolls.exotic.scrollofdread.name=pergamino del terror
items.scrolls.exotic.scrollofenchantment.armor=Selecciona un glifo para aplicar a tu armadura.
items.scrolls.exotic.scrollofenchantment.cancel=Cancelar
items.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelar seguirá consumiendo tu pergamino de encantamiento, ¿estás seguro?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, cambié de opinión.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sí, estoy seguro
items.scrolls.exotic.scrollofenchantment.desc=Este pergamino imbuirá un arma o armadura con una poderosa energía mágica. El lector incluso tiene cierto control sobre qué tipo de magia se infunde.
items.scrolls.exotic.scrollofenchantment.inv_title=Encantar un objeto
items.scrolls.exotic.scrollofenchantment.name=pergamino de encantamiento
items.scrolls.exotic.scrollofenchantment.weapon=Selecciona un encantamiento para aplicar a tu arma.
items.scrolls.exotic.scrollofforesight.desc=Tras leer este pergamino, el lector recibirá una visión nítida y detallada del terreno circundante. Este efecto dura bastante tiempo y revelará todas las puertas y trampas ocultas, haciendo innecesaria la búsqueda.
items.scrolls.exotic.scrollofforesight.name=pergamino de previsión
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelar seguirá consumiendo tu pergamino de metamorfosis, ¿estás seguro?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Elige un talento para transformar.
items.scrolls.exotic.scrollofmetamorphosis.desc=Este pergamino contiene poderosa magia de transmutación, que se aplicará al lanzador en lugar de a un objeto. La magia de este pergamino te permitirá seleccionar un talento y reemplazarlo con uno de los cinco talentos del mismo nivel de diferentes clases de héroe. Este efecto solo se aplica a talentos de clase, no a talentos obtenidos de subclases o habilidades de armadura. Los talentos que no puedas usar no se mostrarán como opciones.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=talento metamorfoseado
items.scrolls.exotic.scrollofmetamorphosis.name=rollo de metamorfosis
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Elige un nuevo talento para reemplazar tu talento transformado.
items.scrolls.exotic.scrollofmysticalenergy.desc=El poder mágico puro que encierra este pergamino, al ser liberado, cargará con el tiempo los artefactos equipados del usuario.
items.scrolls.exotic.scrollofmysticalenergy.name=pergamino de energía mística
items.scrolls.exotic.scrollofpassage.desc=El hechizo de este pergamino transporta instantáneamente al lector a la región más cercana, en el primer piso superior. Muy útil para llegar rápidamente a una tienda.
items.scrolls.exotic.scrollofpassage.name=rollo de pasaje
items.scrolls.exotic.scrollofprismaticimage.desc=El encantamiento de este pergamino creará un gemelo ilusorio y colorido del lector. Esta imagen prismática actúa como un clon más débil del lector, con defensa similar pero menor HP y daño.\n\nLa imagen prismática se mostrará cuando haya enemigos presentes e intentará defender al lector.\n\nSi ya existe una imagen prismática, usar este pergamino la curará por completo.
items.scrolls.exotic.scrollofprismaticimage.name=pergamino de imagen prismática
items.scrolls.exotic.scrollofpsionicblast.desc=Este pergamino contiene una energía destructiva increíble que puede canalizarse para destruir las mentes de todas las criaturas visibles.\n\nSin embargo, hay una retroalimentación significativa, y el lector también resultará dañado, cegado y debilitado. Cuantos más objetivos alcance el pergamino, menor será el daño que se sufrirá.
items.scrolls.exotic.scrollofpsionicblast.name=pergamino de explosión psiónica
items.scrolls.exotic.scrollofpsionicblast.ondeath=La explosión psiónica te destroza la mente...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Esta criatura ha sido hechizada por la magia de un pergamino de canto de sirena.\n\nUn personaje hechizado es permanentemente tu aliado y luchará contra cualquier enemigo que encuentre.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=cautivado
items.scrolls.exotic.scrollofsirenssong.cancel=Debes elegir un objetivo.
items.scrolls.exotic.scrollofsirenssong.desc=Leer este pergamino emite una melodía seductora que hechizará a un enemigo objetivo, ¡convirtiéndolo permanentemente en un aliado! Otros enemigos que la escuchen quedarán temporalmente encantados. Los enemigos particularmente fuertes pueden resistir el efecto de hechización y, en su lugar, quedarán encantados.
items.scrolls.exotic.scrollofsirenssong.name=pergamino del canto de la sirena
items.scrolls.exotic.scrollofsirenssong.no_target=El pergamino se activa sin un objetivo.
items.scrolls.exotic.scrollofsirenssong.prompt=Elige un objetivo
items.scrolls.inventoryscroll.no=No, cambié de opinión.
items.scrolls.inventoryscroll.warning=¿De verdad quieres cancelar el uso de este pergamino? El pergamino no se había identificado previamente, así que se consumirá de todos modos.
items.scrolls.inventoryscroll.yes=Sí, soy positivo.
items.scrolls.scroll$placeholder.name=voluta
items.scrolls.scroll.ac_read=LEER
items.scrolls.scroll.berkanan=pergamino de BERKANAN
items.scrolls.scroll.blinded=No se puede leer un pergamino estando ciego.
items.scrolls.scroll.cursed=¡Tu libro de hechizos maldito te impide invocar la magia de este pergamino! Sin embargo, un pergamino para eliminar maldiciones podría ser lo suficientemente poderoso como para funcionar...
items.scrolls.scroll.gyfu=pergamino de GYFU
items.scrolls.scroll.isaz=pergamino de ISAZ
items.scrolls.scroll.kaunan=pergamino de KAUNAN
items.scrolls.scroll.laguz=pergamino de LAGUZ
items.scrolls.scroll.mannaz=rollo de MANACIO
items.scrolls.scroll.naudiz=pergamino de NAUDIZ
items.scrolls.scroll.no_magic=No puedes leer un pergamino si eres inmune a la magia.
items.scrolls.scroll.odal=rollo de ODAL
items.scrolls.scroll.raido=pergamino de RAIDO
items.scrolls.scroll.sowilo=pergamino de SOWILO
items.scrolls.scroll.tiwaz=pergamino de TIWAZ
items.scrolls.scroll.unknown_desc=Este pergamino está cubierto de escritura indescifrable y lleva la runa %s como título. ¿Quién sabe qué hará al leerlo en voz alta?
items.scrolls.scroll.yngvi=Rollo de YNGVI
items.scrolls.scrollofidentify.desc=Revela de forma permanente todos los secretos de un solo objeto.
items.scrolls.scrollofidentify.inv_title=Identifica un elemento
items.scrolls.scrollofidentify.it_is=Su artículo ha sido identificado: %s.
items.scrolls.scrollofidentify.name=pergamino de identificación
items.scrolls.scrolloflullaby.desc=Una melodía relajante sumirá en un profundo sueño a todas las criaturas que se encuentren en tu campo de visión, dándote la oportunidad de huir o de realizar un ataque sorpresa contra ellas.
items.scrolls.scrolloflullaby.name=pergamino de nana
items.scrolls.scrolloflullaby.sooth=El pergamino emite una melodía relajante. Sientes mucho sueño.
items.scrolls.scrollofmagicmapping.desc=Al leer este pergamino, una imagen nítida quedará grabada en tu memoria, revelándote la disposición exacta del nivel y desvelando todos sus secretos ocultos. La ubicación de los objetos y las criaturas permanecerá desconocida.
items.scrolls.scrollofmagicmapping.layout=Ahora ya conoces la distribución del nivel.
items.scrolls.scrollofmagicmapping.name=pergamino de mapeo mágico
items.scrolls.scrollofmirrorimage.copies=El pergamino forma imágenes especulares de ti.
items.scrolls.scrollofmirrorimage.desc=El conjuro de este pergamino creará gemelos ilusorios del lector, que perseguirán a sus enemigos.
items.scrolls.scrollofmirrorimage.name=pergamino de imagen especular
items.scrolls.scrollofmirrorimage.no_copies=El pergamino intenta crear imágenes especulares de ti, pero no tienen adónde ir.
items.scrolls.scrollofrage.desc=Al leerse en voz alta, este pergamino desatará un gran rugido que atraerá a todos los enemigos hacia el lector y enfurecerá a los que estén cerca.
items.scrolls.scrollofrage.name=pergamino de furia
items.scrolls.scrollofrage.roar=¡El pergamino emite un rugido furioso que resuena por toda la mazmorra!
items.scrolls.scrollofrecharging.desc=El poder mágico puro que encierra este pergamino, al ser liberado, recargará todas las varitas del lector hasta su máxima potencia.
items.scrolls.scrollofrecharging.name=pergamino de recarga
items.scrolls.scrollofrecharging.surge=¡Una oleada de energía recorre tu cuerpo, revitalizando tus varitas!
items.scrolls.scrollofremovecurse.cleansed=¡Tu objeto resplandece con una luz purificadora y la energía maligna se disipa!
items.scrolls.scrollofremovecurse.desc=El conjuro de este pergamino eliminará instantáneamente del arma, armadura, anillos y objetos que lleve el lector cualquier encantamiento maligno que pueda impedirle quitárselos.
items.scrolls.scrollofremovecurse.inv_title=Limpiar un artículo
items.scrolls.scrollofremovecurse.name=pergamino para eliminar maldiciones
items.scrolls.scrollofremovecurse.not_cleansed=Tu objeto emite una luz purificadora, pero no sucede nada.
items.scrolls.scrollofremovecurse.spirit=¡Tu pergamino libera al espíritu atormentado!
items.scrolls.scrollofretribution.blast=¡Una poderosa energía mágica brota del pergamino!
items.scrolls.scrollofretribution.desc=Este pergamino contiene energía destructiva que canaliza el sufrimiento del lector hacia afuera en una explosión de poder. Cuanto más débil sea el lector, más daño infligirá. Con muy poca salud, este pergamino puede matar a la mayoría de los enemigos al instante. Sin embargo, usar el pergamino tiene consecuencias para el usuario, cegándolo y debilitándolo.
items.scrolls.scrollofretribution.name=pergamino de retribución
items.scrolls.scrollofteleportation.cant_reach=No puedes teletransportarte allí.
items.scrolls.scrollofteleportation.desc=El hechizo de este pergamino transporta instantáneamente al lector a un lugar aleatorio de la mazmorra. Puede usarse para escapar de una situación peligrosa, pero el lector desafortunado podría encontrarse en un lugar aún más peligroso.
items.scrolls.scrollofteleportation.name=pergamino de teletransportación
items.scrolls.scrollofteleportation.no_tele=La magia de la teletransportación falla.
items.scrolls.scrollofteleportation.prompt=Elige un lugar para teletransportarte.
items.scrolls.scrollofteleportation.tele=En un abrir y cerrar de ojos, fuiste teletransportado a otra ubicación del nivel.
items.scrolls.scrollofterror.desc=Un destello de luz roja infundirá terror en todas las criaturas que se encuentren en tu campo de visión, obligándolas a huir. Atacar a un enemigo que huye disipará el efecto.
items.scrolls.scrollofterror.many=¡El pergamino emite un brillante destello de luz roja y los monstruos huyen!
items.scrolls.scrollofterror.name=pergamino del terror
items.scrolls.scrollofterror.none=El pergamino emite un brillante destello de luz roja.
items.scrolls.scrollofterror.one=El pergamino emite un brillante destello de luz roja y ¡el %s huye!
items.scrolls.scrolloftransmutation.desc=Este pergamino contiene poderosa magia de transmutación. Al usarlo sobre un objeto apto, lo transformará en otro del mismo tipo. La magia conservará incluso las mejoras, los encantamientos y los glifos. Los pergaminos y las pociones se transmutarán en su equivalente exótico, y viceversa.
items.scrolls.scrolloftransmutation.inv_title=Transmutar un objeto
items.scrolls.scrolloftransmutation.morph=¡Tu objeto se transforma en algo diferente!
items.scrolls.scrolloftransmutation.name=pergamino de transmutación
items.scrolls.scrolloftransmutation.nothing=No pasa nada interesante.
items.scrolls.scrollofupgrade.desc=Este pergamino mejorará un objeto, aumentando su calidad. Una varita aumentará su poder y el número de cargas; un arma infligirá más daño o acertará con mayor frecuencia; una armadura desviará golpes adicionales; el efecto de un anillo sobre su portador se intensificará. Además, las armas y armaduras requerirán menos fuerza para usarse, y cualquier maldición que tengan será eliminada.
items.scrolls.scrollofupgrade.inv_title=Actualizar un artículo
items.scrolls.scrollofupgrade.name=pergamino de mejora
items.scrolls.scrollofupgrade.remove_curse=¡El pergamino de mejora limpia la maldición de tu objeto!
items.scrolls.scrollofupgrade.weaken_curse=El pergamino de mejora debilita la maldición sobre tu objeto.
items.spells.alchemize$wndalchemizeitem.energize=Conviértete en energía %d
items.spells.alchemize$wndalchemizeitem.energize_1=Convierte 1 en energía %d
items.spells.alchemize$wndalchemizeitem.energize_all=Conviértelo todo en energía %d
items.spells.alchemize$wndalchemizeitem.sell=Conviértete en %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Convierta 1 en %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Conviértelo todo en %dg
items.spells.alchemize.desc=Este hechizo contiene poderes transmutativos similares a los que se encuentran en un caldero de alquimia. Cada lanzamiento permite al usuario convertir un objeto (o pila de objetos) en oro o energía alquímica. ¡Convertir pociones o pergaminos en energía incluso los identificará!\n\n Se venden algunos usos de Alquimia en las tiendas, pero se pueden crear muchos más usando alquimia combinando una semilla, una piedra rúnica y un poco de energía alquímica.
items.spells.alchemize.name=alquimia
items.spells.alchemize.prompt=Alquimizar un objeto
items.spells.beaconofreturning.creatures=El aura psíquica de las criaturas vecinas no te permite teletransportarte en este momento.
items.spells.beaconofreturning.desc=Este intrincado hechizo otorga al usuario la capacidad de regresar a una ubicación predefinida, sin importar la distancia. El hechizo solo se consume al regresar, se puede activar tantas veces como se desee, pero solo recordará la última ubicación a la que se aplicó.
items.spells.beaconofreturning.desc_set=Esta baliza fue colocada en algún lugar del piso %d.
items.spells.beaconofreturning.name=faro del regreso
items.spells.beaconofreturning.preventing=¡El fuerte aura mágica de este lugar te impide usar el hechizo!
items.spells.beaconofreturning.set=La baliza se ha colocado en su ubicación actual.
items.spells.beaconofreturning.wnd_body=La configuración anulará la ubicación en la que se configuró previamente la baliza.\n\nRegresar volverá a su última ubicación establecida y consumirá un uso del hechizo.
items.spells.beaconofreturning.wnd_return=DEVOLVER
items.spells.beaconofreturning.wnd_set=COLOCAR
items.spells.curseinfusion.desc=Este hechizo infunde una pieza de equipo con la misma magia maligna poderosa presente en DM-300. El objeto en el que se use será inmediatamente maldito, y cualquier encantamiento o glifo que pudiera tener será sobrescrito.\n\nEn el caso de armas, armaduras y varitas, el objeto obtendrá mejoras además de ser maldecido. Las mejoras de infusión de maldición no se acumulan, y las mejoras se pierden si el objeto se deshace de la maldición.\n\nTambién se pueden usar múltiples infusiones de maldición para cambiar la maldición en un arma o armadura.
items.spells.curseinfusion.inv_title=Maldecir un objeto
items.spells.curseinfusion.name=infusión de maldición
items.spells.magicalinfusion.desc=Este hechizo posee el mismo poder mágico que un pergamino de mejora, pero en una forma más estable.\n\nAdemás de mejorar un objeto normalmente, nunca borrará un encantamiento, glifo o maldición.
items.spells.magicalinfusion.infuse=¡Tu objeto está imbuido de energía arcana!
items.spells.magicalinfusion.inv_title=Infundir un objeto
items.spells.magicalinfusion.name=infusión mágica
items.spells.magicalporter.desc=Este hechizo transportará mágicamente cualquier objeto sobre el que se lance. Sin embargo, a diferencia de la baliza de un mercader, los objetos serán transportados a la entrada del siguiente piso del jefe.
items.spells.magicalporter.inv_title=Portar un artículo
items.spells.magicalporter.name=portero mágico
items.spells.magicalporter.nowhere=No hay ningún lugar al que puedas transferir un artículo.
items.spells.phaseshift.desc=Este hechizo caótico teletransportará a cualquier personaje al que apunte a una ubicación aleatoria en el piso actual y lo aturdirá durante un tiempo considerable. Los enemigos poderosos podrán resistir el efecto de aturdimiento. Este hechizo puede dirigirse a un objetivo o al propio usuario.
items.spells.phaseshift.name=cambio de fase
items.spells.phaseshift.no_target=No hay nada que teletransportar allí.
items.spells.reclaimtrap.desc=Este hechizo contiene restos de la energía mecánica de DM-300. Cuando se lanza sobre una trampa activa, el poder de la trampa se adhiere a ti, lo que te permite usar el hechizo de nuevo para expulsar este poder y activar el efecto de la trampa en cualquier lugar que desees.\n\nSin embargo, algunas trampas pueden no funcionar en todos los lugares, y solo se puede almacenar una trampa a la vez.
items.spells.reclaimtrap.desc_trap=El hechizo está listo para activar un _%s._
items.spells.reclaimtrap.name=Trampa de recuperación
items.spells.reclaimtrap.no_trap=Allí no hay ninguna trampa.
items.spells.recycle.desc=Este hechizo contiene una forma menor de magia de transmutación. Si bien no funciona con equipo, transforma un pergamino, poción, semilla, runa o dardo en un objeto aleatorio del mismo tipo.
items.spells.recycle.inv_title=Reciclar un artículo
items.spells.recycle.name=reciclar
items.spells.recycle.recycled=Su artículo se recicló en: %s.
items.spells.spell.ac_cast=ELENCO
items.spells.spell.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.spells.spell.no_magic=No puedes lanzar hechizos mientras seas inmune a la magia.
items.spells.summonelemental.ac_imbue=IMBUIR
items.spells.summonelemental.desc=Este hechizo canaliza la energía de las brasas elementales con las que fue creado y te permitirá invocar a un elemental aliado para que luche a tu lado. Solo se puede invocar un elemental a la vez, pero puedes volver a lanzar el hechizo para que regrese a ti sin coste alguno.
items.spells.summonelemental.desc_chaos=El hechizo está irradiando energía caótica y convocará a un elemental del caos. Puedes imbuir otro objeto, pero el hechizo perderá su imbuición actual.
items.spells.summonelemental.desc_fire=El hechizo está caliente al tacto y convocará a un elemental de fuego. Puedes imbuir otro objeto, pero el hechizo perderá su encantamiento actual.
items.spells.summonelemental.desc_frost=El hechizo actualmente está frío al tacto; invocará a un elemental de hielo. Puedes imbuir otro objeto, pero el hechizo perderá su imbuición actual.
items.spells.summonelemental.desc_newborn=Actualmente, el hechizo no está imbuido y convocará a un elemental recién nacido sin realizar un ataque a distancia. Puedes imbuirlo con una poción de llama líquida, una poción de escarcha, un pergamino de recarga o un pergamino de transmutación para potenciarlo, ¡lo que hará que las futuras invocaciones sean elementales con todo su poder!
items.spells.summonelemental.desc_shock=El hechizo está emitiendo energía estática y convocará a un elemental de choque. Puedes imbuir otro objeto, pero el hechizo perderá su imbuición actual.
items.spells.summonelemental.imbue_prompt=Imbuir un objeto
items.spells.summonelemental.name=invocar elemental
items.spells.targetedspell.inv_title=Infundir un objeto
items.spells.targetedspell.prompt=Elige un objetivo
items.spells.telekineticgrab.cant_grab=No puedes agarrar eso.
items.spells.telekineticgrab.desc=Este hechizo permite al lanzador agarrar remotamente todos los objetos en una ubicación, ¡o todas las armas arrojadizas que se hayan quedado pegadas a un enemigo!\n\nNo se puede usar para agarrar objetos que le pertenecen a otra persona, ni para agarrar contenedores como cofres.
items.spells.telekineticgrab.name=agarre telequinético
items.spells.telekineticgrab.no_target=No hay nada que agarrar ahí.
items.spells.unstablespell.desc=Este pequeño cristal cuadrado negro tiene símbolos rúnicos cambiantes en cada una de sus superficies.\n\nCuando se activa, desencadenará el efecto de un pergamino aleatorio. El efecto del pergamino siempre estará enfocado en el combate si hay enemigos en tu campo de visión, y siempre estará enfocado en otros aspectos.
items.spells.unstablespell.name=hechizo inestable
items.spells.wildenergy.desc=Este hechizo contiene parte de la energía maldita que alimentaba a DM-300. Al lanzarlo, recargará tus varitas y artefactos desgastados, a la vez que activará un efecto aleatorio de varita maldita. Sin embargo, puedes elegir la dirección en la que se proyectará esta magia maldita.
items.spells.wildenergy.name=energía salvaje
items.stones.inventorystone.ac_use=USAR
items.stones.runestone$placeholder.name=piedra rúnica
items.stones.runestone.discover_hint=Puedes encontrar este objeto al azar en la mazmorra o fabricarlo mediante alquimia.
items.stones.stoneofaggression$aggression.desc=La magia manipuladora está haciendo que todos los enemigos cercanos prefieran atacar a este personaje.\n\nTurnos restantes: %s.
items.stones.stoneofaggression$aggression.name=objetivo
items.stones.stoneofaggression.desc=Cuando esta piedra se lanza contra un aliado o enemigo, todos los enemigos cercanos preferirán atacar a ese personaje durante un breve período. Sin embargo, los jefes pueden resistir el efecto, reduciendo significativamente su duración y recibiendo menos daño de los ataques de sus secuaces.
items.stones.stoneofaggression.name=piedra de agresión
items.stones.stoneofaugmentation$wndaugment.cancel=No importa
items.stones.stoneofaugmentation$wndaugment.choice=¿Qué te gustaría mejorar?
items.stones.stoneofaugmentation$wndaugment.damage=Daño
items.stones.stoneofaugmentation$wndaugment.defense=Defensa
items.stones.stoneofaugmentation$wndaugment.evasion=Evasión
items.stones.stoneofaugmentation$wndaugment.none=Eliminar aumento
items.stones.stoneofaugmentation$wndaugment.speed=Velocidad
items.stones.stoneofaugmentation.desc=Esta runa posee magia potente que puede aumentar el equipo para mejorar una propiedad a costa de otra.\n\nU Usarla en un arma te permitirá mejorar la velocidad o el daño. Las armas arrojadizas también ganarán o perderán durabilidad en proporción a su velocidad.\n\nU Usarla en una armadura te permitirá mejorar la defensa o la evasión.
items.stones.stoneofaugmentation.discover_hint=Puedes comprar este artículo en una tienda o fabricarlo mediante alquimia.
items.stones.stoneofaugmentation.inv_title=Aumentar un elemento
items.stones.stoneofaugmentation.name=piedra de aumento
items.stones.stoneofblast.desc=Esta runa explotará instantáneamente en el lugar donde sea lanzada. Al igual que una bomba, la explosión dañará todo lo que se encuentre cerca.
items.stones.stoneofblast.name=piedra de explosión
items.stones.stoneofblink.desc=Esta runa teletransportará al usuario al lugar donde sea lanzada.
items.stones.stoneofblink.name=piedra de parpadeo
items.stones.stoneofclairvoyance.desc=Esta piedra revelará instantáneamente todas las baldosas en un área muy amplia alrededor del lugar donde se lance. Su efecto incluso atravesará las paredes.
items.stones.stoneofclairvoyance.name=piedra de clarividencia
items.stones.stoneofdeepsleep.desc=Cuando esta piedra sea lanzada contra un enemigo, lo sumirá en un profundo sueño mágico. Los enemigos sumidos en este sueño mágico dormirán eternamente hasta que alguien los despierte.
items.stones.stoneofdeepsleep.name=piedra del sueño profundo
items.stones.stoneofdetectmagic.desc=Esta runa es capaz de detectar la magia que afecta a un objeto. Al usarla sobre un objeto no identificado, podrás saber si está afectado por una maldición maligna o por magia positiva, como un encantamiento o mejoras.
items.stones.stoneofdetectmagic.detected_bad=¡Detectas magia malévola que afecta a este objeto!
items.stones.stoneofdetectmagic.detected_both=¡Detectas tanto magia positiva como malévola que afecta a este objeto!
items.stones.stoneofdetectmagic.detected_good=¡Detectas magia positiva que afecta a este objeto!
items.stones.stoneofdetectmagic.detected_none=No detectas ningún tipo de magia que afecte a este objeto.
items.stones.stoneofdetectmagic.inv_title=Detectar un elemento
items.stones.stoneofdetectmagic.name=piedra de detección de magia
items.stones.stoneofdisarming.desc=Esta runa posee magia capaz de desactivar trampas maliciosas ocultas por toda la mazmorra. Desactivará hasta 9 trampas en la zona donde se lance.
items.stones.stoneofdisarming.name=piedra de desarme
items.stones.stoneofenchantment.armor=¡Tu armadura brilla en la oscuridad!
items.stones.stoneofenchantment.desc=Esta runa posee magia de encantamiento. A diferencia de un pergamino de mejora, no aumenta directamente el poder de un objeto, sino que imbuye un arma o armadura con un encantamiento, otorgándole un nuevo poder.
items.stones.stoneofenchantment.inv_title=Encantar un objeto
items.stones.stoneofenchantment.name=piedra del encantamiento
items.stones.stoneofenchantment.weapon=¡Tu arma brilla en la oscuridad!
items.stones.stoneoffear.desc=Cuando se lanza esta piedra sobre un personaje, este se verá invadido por el terror y huirá. Atacar a un personaje que huye acortará el efecto.
items.stones.stoneoffear.name=piedra del miedo
items.stones.stoneofflock.desc=Esta piedra rúnica invoca ovejas mágicas durante un breve periodo de tiempo alrededor del lugar donde se lanza.
items.stones.stoneofflock.name=piedra de rebaño
items.stones.stoneofintuition$wndguess.break=Tu piedra de la intuición se desmorona hasta convertirse en polvo...
items.stones.stoneofintuition$wndguess.correct=Correcto. ¡El tipo de artículo ha sido identificado!
items.stones.stoneofintuition$wndguess.incorrect=Tu suposición fue incorrecta.
items.stones.stoneofintuition$wndguess.text=Adivina qué tipo de objeto no identificado es. Si aciertas, ¡se revelará el tipo!
items.stones.stoneofintuition.break_info=Puedes usar las piedras de la intuición dos veces antes de que una se rompa; tu próximo uso no consumirá una piedra.
items.stones.stoneofintuition.break_warn=Ya has usado una piedra de intuición anteriormente, así que _tu próximo uso consumirá una piedra_.
items.stones.stoneofintuition.desc=Esta runa contiene una versión más débil de la magia presente en los pergaminos de identificación. En lugar de identificar directamente un objeto, apela a tu intuición, permitiéndote intentar identificar el tipo de poción, pergamino o anillo mediante conjeturas.
items.stones.stoneofintuition.inv_title=Seleccione un artículo
items.stones.stoneofintuition.name=piedra de la intuición
items.stones.stoneofshock.desc=Esta piedra rúnica desata una explosión de energía eléctrica que aturde brevemente a todos los objetivos cercanos y otorga una carga a la varita del lanzador por cada objetivo alcanzado.
items.stones.stoneofshock.name=piedra del shock
items.stylus.ac_inscribe=INSCRIBIR
items.stylus.cursed=La magia del lápiz táctil no funcionará en armaduras malditas.
items.stylus.desc=Este estilete arcano está hecho de una piedra oscura y muy dura. Con él puedes grabar un glifo mágico en tu armadura, pero no tienes control sobre qué glifo será; el estilete lo decidirá por ti.
items.stylus.identify=Primero debes determinar si esa armadura está maldita.
items.stylus.inscribed=Grabaste tu armadura con el estilete.
items.stylus.name=estilete arcano
items.stylus.prompt=Seleccione una armadura
items.tengusmask.ac_wear=TENER PUESTO
items.tengusmask.desc=Esta máscara se cayó del rostro de Tengu cuando murió, puedes sentir un gran poder mágico emanando de ella. ¿Era la máscara la fuente de fuerza de Tengu?\n\nCuando la uses, el tremendo poder de la máscara se transferirá a ti, permitiéndote _elegir una subclase para tu héroe._\n\n¿Qué subclase elegirás?
items.tengusmask.discover_hint=Puedes obtener este objeto como botín de ciertos enemigos.
items.tengusmask.name=Máscara de Tengu
items.tengusmask.used=¡La máscara se desintegra a medida que su poder fluye hacia ti!
items.torch.ac_light=LUZ
items.torch.desc=Un elemento básico en las aventuras, cuando una mazmorra se queda a oscuras, una antorcha puede ayudar a iluminar el camino.
items.torch.name=antorcha
items.trinkets.chaoticcenser.desc=Tras un tiempo en el crisol de alquimia, este incensario parece producir humo por sí solo. Estos gases se acumulan y salen disparados del incensario hacia los enemigos a intervalos semi-aleatorios. Parece capaz de producir todo tipo de gases, pero recibirás una breve advertencia justo antes de que se active.
items.trinkets.chaoticcenser.name=incensario caótico
items.trinkets.chaoticcenser.spew=Tu incensario está a punto de expulsar: %s.
items.trinkets.chaoticcenser.stats_desc=En su nivel actual, este amuleto generará un gas dañino cerca de un enemigo aproximadamente cada _%d_ turnos. Los gases solo aparecerán cuando haya enemigos presentes. En niveles superiores, es más probable que estos gases sean exóticos y potentes.
items.trinkets.chaoticcenser.typical_stats_desc=Normalmente, este amuleto genera un gas dañino cerca de un enemigo aproximadamente cada _%d_ turnos. Los gases solo aparecen cuando hay enemigos presentes. En niveles más altos, estos gases tienen más probabilidades de ser exóticos y potentes.
items.trinkets.crackedspyglass.desc=Este telescopio de mano sería una muestra de excelente y precisa mano de obra, de no ser por la grieta en su lente frontal. El catalejo parece ayudarte a descubrir nuevos objetos en la mazmorra, ¡pero debido a su defecto, los objetos revelados son bastante difíciles de ver!
items.trinkets.crackedspyglass.name=catalejo agrietado
items.trinkets.crackedspyglass.stats_desc=En su nivel actual, este abalorio tiene una probabilidad de _%1$s%%_ de crear un objeto oculto adicional en cada piso que no sea de jefe.
items.trinkets.crackedspyglass.stats_desc_upgraded=En su nivel actual, este abalorio tiene una probabilidad de _100%%_ de crear un objeto oculto adicional en cada piso que no sea de jefe, y una probabilidad de _%1$s%%_ de crear un segundo objeto oculto adicional.
items.trinkets.crackedspyglass.typical_stats_desc=Normalmente, este amuleto tiene una probabilidad de _%1$s%%_ de crear un objeto oculto adicional en cada piso que no sea de jefe.
items.trinkets.dimensionalsundial.desc=Este pequeño reloj de sol portátil es capaz de proyectar una sombra en las profundidades de la mazmorra, incluso si no se sostiene en posición vertical. Lo más extraño es que la posición de la sombra parece no tener relación con el sol en este mundo. Cuando no proyecta sombra, el reloj de sol parece atraer el peligro.
items.trinkets.dimensionalsundial.name=reloj de sol dimensional
items.trinkets.dimensionalsundial.stats_desc=En su nivel actual, este amuleto reducirá la tasa de aparición de enemigos en _%1$d%%_ durante el día en la vida real (8 am-8 pm) y aumentará la tasa de aparición de enemigos en _%2$d%%_ durante la noche (8 pm-8 am).
items.trinkets.dimensionalsundial.typical_stats_desc=Normalmente, este amuleto reducirá la tasa de aparición de enemigos en _%1$d%%_ durante el día en la vida real (8 am - 8 pm), y aumentará la tasa de aparición de enemigos en _%2$d%%_ durante la noche (8 pm - 8 am).
items.trinkets.dimensionalsundial.warning=Tu reloj de sol no proyecta sombra y te sientes incómodo.
items.trinkets.exoticcrystals.desc=Estos pequeños cristales rosados tienen la misma forma que los cristales de energía alquímica. Si bien no se pueden usar directamente como fuente de energía, parecen influir de alguna manera en las pociones y pergaminos que encuentras.
items.trinkets.exoticcrystals.name=cristales exóticos
items.trinkets.exoticcrystals.stats_desc=En su nivel actual, este abalorio reemplazará _%s%%_ de las pociones o pergaminos obtenidos con sus equivalentes exóticos. Esto no afecta a las pociones de fuerza, los pergaminos de mejora ni los objetos generados para ayudar a resolver las salas de peligro.
items.trinkets.exoticcrystals.typical_stats_desc=Normalmente, este abalorio reemplazará _%s%%_ de las pociones o pergaminos obtenidos con sus equivalentes exóticos. Esto no afecta a las pociones de fuerza, los pergaminos de mejora ni los objetos generados para resolver las salas de peligro.
items.trinkets.eyeofnewt.desc=Este ojo de tritón dorado y negro es un ingrediente común, ahora convertido en un amuleto. El ojo parece reducir la visión a cambio de permitir ver las cosas de otra manera.
items.trinkets.eyeofnewt.name=ojo de tritón
items.trinkets.eyeofnewt.stats_desc=En su nivel actual, este abalorio reducirá tu rango de visión en _%1$s%%_, pero también te otorgará visión mental de los enemigos dentro de _%2$d_ casillas.
items.trinkets.eyeofnewt.typical_stats_desc=Normalmente, este amuleto reducirá tu rango de visión en _%1$s%%_, pero también te otorgará visión mental de los enemigos dentro de _%2$d_ casillas.
items.trinkets.ferrettuft.desc=Un mechón de suave pelaje blanco de hurón, sujeto por una cinta verde lima atada en forma de lazo. Los hurones son conocidos por su agilidad, picardía y falta de integridad. Parte de ese poder parece irradiar del adorno, potenciando su capacidad para evadir cualquier cosa cercana.
items.trinkets.ferrettuft.name=mechón de hurón
items.trinkets.ferrettuft.stats_desc=En su nivel actual, este abalorio aumentará la evasión de todos los personajes en _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Normalmente, este amuleto aumentará la evasión de todos los personajes en _%1$s%%_.
items.trinkets.mimictooth.desc=Este gran diente afilado debió haber sido extraído de un mímico muy desdichado. Parece estar influyendo en los mímicos de la mazmorra, haciéndolos más frecuentes y peligrosos.
items.trinkets.mimictooth.name=diente de imitación
items.trinkets.mimictooth.stats_desc=En su nivel actual, este amuleto hará que todo tipo de mímicos _%1$sx_ sean más comunes y mucho más difíciles de detectar, pero también aumentará la cantidad de botín que sueltan. Cada piso de la mazmorra también tendrá una probabilidad _%2$s%%_ de contener un mímico de ébano sigiloso adicional.
items.trinkets.mimictooth.typical_stats_desc=Normalmente, este amuleto hará que todo tipo de mímicos _%1$sx_ sean más comunes y mucho más difíciles de detectar, pero también aumentará la cantidad de botín que sueltan. Cada piso de la mazmorra también tendrá una probabilidad _%2$s%%_ de contener un mímico de ébano sigiloso adicional.
items.trinkets.mossyclump.desc=Este cúmulo de musgo húmedo parece retener la humedad por mucho que lo aprietes. Parece estar mágicamente ligado a la mazmorra, lo que hace que sea más probable que aparezcan hierba y agua.
items.trinkets.mossyclump.name=grupo musgoso
items.trinkets.mossyclump.stats_desc=En su nivel actual, este amuleto hará que _%d%%_ de pisos sin temática se llenen de agua o hierba en su lugar.\n\nEste amuleto cuesta una mayor cantidad de energía para mejorar.
items.trinkets.mossyclump.typical_stats_desc=Normalmente, este amuleto hará que _%d%%_ de los pisos sin temática se llenen de agua o hierba en su lugar.\n\nEste amuleto cuesta una mayor cantidad de energía para mejorar.
items.trinkets.parchmentscrap.desc=Este pequeño trozo de pergamino parece sacado de un rollo. Ha conservado parte de su magia y parece influir en las armas y armaduras que se encuentran en la mazmorra.
items.trinkets.parchmentscrap.name=trozo de pergamino
items.trinkets.parchmentscrap.stats_desc=En su nivel actual, este abalorio hará que los encantamientos y glifos _%dx_ sean comunes, y las maldiciones en armas y armaduras _%sx_ también lo sean. Las maldiciones en varitas, anillos o artefactos no se ven afectadas.\n\nEste abalorio cuesta una mayor cantidad de energía para mejorarlo.
items.trinkets.parchmentscrap.typical_stats_desc=Normalmente, este abalorio hará que los encantamientos y glifos _%dx_ sean comunes, y las maldiciones en armas y armaduras _%sx_ también lo sean. Las maldiciones en varitas, anillos o artefactos no se ven afectadas.\n\nEste abalorio cuesta una mayor cantidad de energía para mejorarlo.
items.trinkets.petrifiedseed.desc=Esta semilla se ha fosilizado, ya sea por lentos procesos geológicos o por arte de magia. La semilla parece influir mágicamente en la flora de la mazmorra, sustituyendo ocasionalmente las semillas de las plantas por runas.
items.trinkets.petrifiedseed.name=semilla petrificada
items.trinkets.petrifiedseed.stats_desc=En su nivel actual, este abalorio hará que la hierba pisoteada suelte runas en lugar de semillas _%1$s%%_ la mayor parte del tiempo, y también hará que la hierba alta suelte objetos _%2$s%%_ con más frecuencia.
items.trinkets.petrifiedseed.typical_stats_desc=Normalmente, este amuleto hará que la hierba pisoteada suelte runas en lugar de semillas _%1$s%%_ la mayor parte del tiempo, y también hará que la hierba alta suelte objetos _%2$s%%_ con más frecuencia.
items.trinkets.ratskull.desc=Este macabro amuleto no es mucho más grande que el cráneo de una rata común, que, curiosamente, es una rareza en esta mazmorra. La influencia mágica del cráneo parece atraer a los habitantes más raros de la mazmorra, haciendo que aparezcan con mucha más frecuencia.
items.trinkets.ratskull.name=cráneo de rata
items.trinkets.ratskull.stats_desc=En su nivel actual, este amuleto hará que aparezcan enemigos exóticos raros _%dx_. Sin embargo, la calavera solo es la mitad de efectiva para atraer mímicos de cristal y estatuas blindadas.
items.trinkets.ratskull.typical_stats_desc=Normalmente, este amuleto aumenta la probabilidad de que aparezcan enemigos exóticos raros (%dx). Sin embargo, la calavera solo es la mitad de efectiva para atraer mímicos de cristal y estatuas blindadas.
items.trinkets.saltcube.desc=Este gran cristal de sal, cortado en forma de cubo casi perfecto, logró, de alguna manera, absorber la mitad del agua del caldero alquímico en lugar de disolverse. Parece deshidratar y conservar mágicamente los alimentos, prolongando la sensación de saciedad, pero también disminuyendo la recuperación de la salud cuando no se padece hambre.
items.trinkets.saltcube.name=cubo de sal
items.trinkets.saltcube.stats_desc=En su nivel actual, este amuleto aumentará la cantidad de tiempo antes de que tengas hambre en _%1$s%%_, pero también reducirá tu tasa de regeneración de salud en _%2$s%%_ a menos que el piso esté bloqueado.
items.trinkets.saltcube.typical_stats_desc=Normalmente, este amuleto aumentará la cantidad de tiempo antes de que tengas hambre en _%1$s%%_, pero también reducirá tu tasa de regeneración de salud en _%2$s%%_ a menos que el piso esté bloqueado.
items.trinkets.shardofoblivion$thrownusetracker.desc=Recientemente has usado un arma arrojadiza no identificada, que cuenta como una pieza de equipo usado no identificado para el fragmento del olvido por un tiempo.\n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Se utilizó un arma arrojadiza no identificada.
items.trinkets.shardofoblivion$wandusetracker.desc=Recientemente has usado una varita no identificada, que cuenta como una pieza de equipo usado no identificado para el fragmento del olvido por un tiempo.\n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Varita no identificada utilizada
items.trinkets.shardofoblivion.ac_identify=IDENTIFICAR
items.trinkets.shardofoblivion.desc=Tras hervir en el crisol de alquimia, este pequeño fragmento de metal maldito se ha transformado en... ¿nada? La luz parece curvarse a su alrededor y flota en el aire cuando no lo sostienes. El fragmento parece absorber energía mágicamente de tu ignorancia, así que probablemente sea mejor no pensar demasiado en él.
items.trinkets.shardofoblivion.identify=¡Identifica el objeto!
items.trinkets.shardofoblivion.identify_not_yet=Ese artículo aún no está listo para ser identificado.
items.trinkets.shardofoblivion.identify_prompt=Identifica un elemento
items.trinkets.shardofoblivion.identify_ready=Hay un objeto listo para ser identificado: %s. Usa tu Fragmento del Olvido sobre él para identificarlo.
items.trinkets.shardofoblivion.identify_ready_worn=Tus objetos desgastados ya están listos para ser identificados. Usa tu Fragmento del Olvido en los objetos para identificarlos.
items.trinkets.shardofoblivion.name=fragmento del olvido
items.trinkets.shardofoblivion.stats_desc=En su nivel actual, este abalorio aumentará la probabilidad de que los enemigos suelten botín en 20%% por cada pieza de equipo no identificado que tengas equipada o hayas usado recientemente, hasta un máximo de _%d objeto(s)_. El fragmento también te impedirá identificar el equipo, pero puede usarse para identificar manualmente los objetos que estén listos para ello.
items.trinkets.shardofoblivion.typical_stats_desc=Normalmente, este abalorio aumenta la probabilidad de que los enemigos suelten botín en 20%% por cada pieza de equipo no identificado que tengas equipada o hayas usado recientemente, hasta un máximo de _%d objeto(s)_. El fragmento también te impedirá identificar el equipo, pero puede usarse para identificar manualmente los objetos que estén listos para ello.
items.trinkets.thirteenleafclover.desc=¡De alguna manera, al cocinarse en el caldero de alquimia, este trébol ha desarrollado un montón de hojas extra! No está claro si este amuleto trae buena o mala suerte; ¿quizás hará que tu suerte sea más caótica?
items.trinkets.thirteenleafclover.name=trébol de trece hojas
items.trinkets.thirteenleafclover.stats_desc=En su nivel actual, este abalorio hará que causes el daño máximo _%1$d%%_ del tiempo y el daño mínimo _%2$d%%_ del tiempo.
items.trinkets.thirteenleafclover.typical_stats_desc=Normalmente, este amuleto hará que causes el daño máximo _%1$d%%_ del tiempo y el daño mínimo _%2$d%%_ del tiempo.
items.trinkets.trapmechanism.desc=El mecanismo principal de una de las trampas de foso de la mazmorra, cuidadosamente tallado en el suelo para poder transportarlo. Parece estar mágicamente ligado a la mazmorra misma, lo que hace que el terreno peligroso sea más frecuente, pero también aumenta tu afinidad con él.
items.trinkets.trapmechanism.name=mecanismo de trampa
items.trinkets.trapmechanism.stats_desc=En su nivel actual, este amuleto hará que los pisos _%1$d%%_ sin temática se llenen de trampas o abismos. Además, las trampas ocultas de la mazmorra _%2$d%%_ se harán visibles.
items.trinkets.trapmechanism.typical_stats_desc=Normalmente, este amuleto hará que los pisos sin temática _%1$d%%_ se llenen de trampas o abismos. Además, las trampas ocultas de la mazmorra _%2$d%%_ se harán visibles.
items.trinkets.trinket$placeholder.name=baratija
items.trinkets.trinket.discover_hint=Este objeto tiene la posibilidad de ser una opción al crear un abalorio mediante alquimia.
items.trinkets.trinketcatalyst$randomtrinket.desc=Un objeto cercano está atascado dentro de una bolsa que no puedes abrir.\n\nEl proceso de alquimia disolverá la bolsa, ¡pero no sabrás qué baratija obtendrás hasta que lo hagas!
items.trinkets.trinketcatalyst$randomtrinket.name=baratija aleatoria
items.trinkets.trinketcatalyst.desc=Esta bola de polvo dorado mágico brilla en la oscuridad de la mazmorra. Este catalizador se puede usar en un caldero de alquimia con un poco de energía alquímica para producir un objeto único. Los objetos proporcionan diversos efectos que alteran ligeramente la mazmorra o sus habitantes. Los objetos se pueden mejorar con más energía para hacer su efecto más poderoso, o se pueden descartar para renunciar al efecto por completo.
items.trinkets.trinketcatalyst.name=catalizador mágico
items.trinkets.trinketcatalyst.window_text=El agua comienza a brillar al añadir el catalizador. Hay algunos objetos cercanos que puedes imbuir de energía para convertirlos en un amuleto mágico.
items.trinkets.trinketcatalyst.window_title=crear un adorno
items.trinkets.vialofblood.desc=Este delgado frasco contiene la sangre de algún habitante de la mazmorra; se mueve lentamente al girarlo. Parece potenciar mágicamente los efectos curativos, pero también los retrasa.
items.trinkets.vialofblood.name=vial de sangre
items.trinkets.vialofblood.stats_desc=En su nivel actual, este amuleto aumentará la salud total que obtienes al beber pociones curativas, odres de agua o pozos de salud en _%1$s%%_. Sin embargo, estos efectos curativos también ocurrirán más lentamente, regenerando un máximo de _%2$s_ HP por turno (esto aumenta con el nivel del héroe).
items.trinkets.vialofblood.typical_stats_desc=Normalmente, este amuleto aumentará la salud total que obtienes al beber pociones curativas, odres de agua o pozos de salud en _%1$s%%_. Sin embargo, estos efectos curativos también se producirán más lentamente, regenerando un máximo de _%2$s_ HP por turno (esto aumenta con el nivel del héroe).
items.trinkets.wondrousresin.desc=Esta resina azul brillante parece contener la esencia destilada de la magia de una varita maldita. La magia del caldero de alquimia parece haberla estabilizado un poco, y ahora está afectando a tus varitas.
items.trinkets.wondrousresin.name=resina maravillosa
items.trinkets.wondrousresin.stats_desc=En su nivel actual, este amuleto hará que los efectos de las varitas malditas se vuelvan neutrales o positivos _%1$s%%_ del tiempo, y hará que las varitas no malditas disparen un rayo maldito neutral o positivo adicional _%2$s%%_ del tiempo.\n\nEste amuleto cuesta una mayor cantidad de energía para mejorar.
items.trinkets.wondrousresin.typical_stats_desc=Normalmente, este amuleto hará que los efectos de las varitas malditas se vuelvan neutrales o positivos _%1$s%%_ del tiempo, y hará que las varitas no malditas disparen un rayo maldito neutral o positivo adicional _%2$s%%_ del tiempo.\n\nEste amuleto cuesta una mayor cantidad de energía para mejorar.
items.wands.cursedwand.disguise=¡Tu apariencia cambia ante tus propios ojos!
items.wands.cursedwand.fire=Hueles a quemado...
items.wands.cursedwand.grass=¡La hierba brota a tu alrededor!
items.wands.cursedwand.gravity=¡La gravedad comienza de repente a tirar en direcciones aleatorias!
items.wands.cursedwand.gravity_end=El caos gravitacional termina.
items.wands.cursedwand.gravity_positive=De repente, la gravedad empieza a tirar en direcciones aleatorias, pero esto no parece afectarte.
items.wands.cursedwand.mass_invuln=¡Una luz brillante brota de tu varita!
items.wands.cursedwand.nothing=No pasa nada.
items.wands.cursedwand.ondeath=Fuiste asesinado por tu propio %s.
items.wands.cursedwand.petrify=¡De repente te quedas paralizado!
items.wands.cursedwand.sinkhole=¡El suelo empieza a ceder a tu alrededor!
items.wands.cursedwand.sinkhole_positive=El suelo empieza a ceder, pero se siente lo suficientemente firme bajo tus pies.
items.wands.cursedwand.supernova=Una bola de energía ardiente comienza a crecer. ¡Quizás quieras correr!
items.wands.cursedwand.supernova_positive=Una bola de energía ardiente comienza a crecer, pero de alguna manera se siente segura.
items.wands.cursedwand.transmogrify_other=¡Tu objeto se transforma en algo diferente!
items.wands.cursedwand.transmogrify_wand=¡Tu varita se transforma en un objeto diferente!
items.wands.damagewand.upgrade_stat_name_1=Daño mágico
items.wands.wand$placeholder.name=varita mágica
items.wands.wand.ac_zap=BORRAR
items.wands.wand.curse_discover=¡Este %s está maldito!
items.wands.wand.cursed=Esta varita está maldita, lo que hace que su magia sea caótica y aleatoria.
items.wands.wand.fizzles=Tu varita no funciona; probablemente no tenga suficiente carga.
items.wands.wand.identify=Ahora ya conoces tu varita lo suficientemente bien como para identificarla.
items.wands.wand.no_magic=Tu varita se apaga; no puedes usar varitas mientras seas inmune a la magia.
items.wands.wand.not_cursed=Esta varita está libre de magia malévola.
items.wands.wand.prompt=Elige una ubicación para descargar
items.wands.wand.resin_many=Esta varita ha ganado niveles _%d_ gracias a la resina arcana.
items.wands.wand.resin_one=Esta varita ha ganado _1 nivel_ gracias a la resina arcana.
items.wands.wand.self_target=¡No puedes apuntarte a ti mismo!
items.wands.wandofblastwave.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo paralizado con un bastón de onda expansiva, consume la parálisis para infligir una ráfaga de daño mágico adicional. Esta habilidad tiene un breve tiempo de reutilización por enemigo.
items.wands.wandofblastwave.desc=Esta varita está hecha de una especie de piedra veteada, con detalles dorados y una gema negra redonda en la punta. Se siente muy pesada en la mano.
items.wands.wandofblastwave.eleblast_desc=Una explosión elemental con un bastón de onda expansiva inflige un 67% de daño y expulsa a todos los enemigos fuera del área de la explosión.
items.wands.wandofblastwave.knockback_ondeath=La colisión te mató...
items.wands.wandofblastwave.name=varita de onda expansiva
items.wands.wandofblastwave.ondeath=Te suicidaste con tu propia Vara de Onda Expansiva...
items.wands.wandofblastwave.staff_name=personal de onda expansiva
items.wands.wandofblastwave.stats_desc=Esta varita dispara un rayo que detona violentamente en la ubicación objetivo. La fuerza de esta explosión inflige _%1$d-%2$d de daño_ y es lo suficientemente fuerte como para lanzar por los aires a la mayoría de los enemigos.
items.wands.wandofblastwave.typical_stats_desc=Esta varita dispara un rayo que detona violentamente en la ubicación objetivo. La fuerza de esta explosión suele infligir _%1$d-%2$d de daño_ y es lo suficientemente fuerte como para lanzar por los aires a la mayoría de los enemigos.
items.wands.wandofblastwave.upgrade_stat_name_2=Rechazo
items.wands.wandofcorrosion.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de corrosión, el enemigo tiene una probabilidad de convertirse en una sustancia viscosa.
items.wands.wandofcorrosion.desc=Esta varita tiene un cuerpo ceniciento que se abre para revelar una brillante gema naranja.
items.wands.wandofcorrosion.eleblast_desc=Un ataque elemental con un bastón de corrosión inflige a los enemigos 4 turnos de corrosión, comenzando con 6 puntos de daño.
items.wands.wandofcorrosion.name=varita de corrosión
items.wands.wandofcorrosion.staff_name=personal de corrosión
items.wands.wandofcorrosion.stats_desc=Esta varita dispara un proyectil que explota en una nube de gas altamente corrosivo en la ubicación objetivo. Todo lo que quede atrapado dentro de esta nube sufrirá daños crecientes con el tiempo, comenzando con _%d de daño._
items.wands.wandofcorrosion.upgrade_stat_name_1=Daños por corrosión
items.wands.wandofcorrosion.upgrade_stat_name_2=Volumen de gas
items.wands.wandofcorruption.already_corrupted=Ese carácter no puede ser influenciado más.
items.wands.wandofcorruption.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de corrupción, el enemigo tiene la posibilidad de quedar ahumado.
items.wands.wandofcorruption.desc=Esta varita irradia una energía oscura y caótica, por si no fuera ya obvio por la pequeña calavera decorativa con forma de calavera que tiene en la punta.
items.wands.wandofcorruption.eleblast_desc=Una explosión elemental con un bastón de corrupción inflige a los enemigos 5 turnos de amok.
items.wands.wandofcorruption.name=varita de corrupción
items.wands.wandofcorruption.staff_name=personal de corrupción
items.wands.wandofcorruption.stats_desc=Esta varita liberará una ráfaga de energía corruptora que debilitará a los enemigos y, finalmente, los doblegará a tu voluntad. Los enemigos pueden resistir la corrupción, pero los debilitados son mucho más fáciles de corromper que los sanos.
items.wands.wandofcorruption.upgrade_stat_name_1=Poder corruptor
items.wands.wandofcorruption.upgrade_stat_name_2=Duración del perjuicio
items.wands.wandofdisintegration.bmage_desc=Cuando lo empuña el Mago de Batalla, un bastón de desintegración tiene un alcance de ataque aumentado, como si tuviera un encantamiento de proyección.
items.wands.wandofdisintegration.desc=Esta varita está hecha de un sólido y liso trozo de obsidiana, con una luz púrpura intensa que recorre su costado y termina en la punta. Brilla con energía destructiva, lista para lanzarse hacia adelante.
items.wands.wandofdisintegration.eleblast_desc=Una explosión elemental con un bastón de desintegración inflige un 100% de daño y atraviesa las paredes.
items.wands.wandofdisintegration.name=varita de desintegración
items.wands.wandofdisintegration.staff_name=personal de desintegración
items.wands.wandofdisintegration.stats_desc=Esta varita dispara un rayo que atraviesa cualquier obstáculo y llega más lejos cuanto más se mejora. El rayo inflige _%1$d-%2$d de daño_ y también inflige daño adicional por cada enemigo y pared que atraviesa.
items.wands.wandofdisintegration.upgrade_stat_name_2=Alcance máximo
items.wands.wandoffireblast.bmage_desc=Cuando el Mago de Batalla golpea a un enemigo con un bastón de fuego explosivo, existe la posibilidad de que se produzca una explosión que dañe a los enemigos y consuma todo el fuego cercano. Esta probabilidad aumenta cuanto más fuego haya junto al enemigo.
items.wands.wandoffireblast.desc=Esta varita está hecha de madera lacada en rojo con abundante pan de oro para darle un aspecto majestuoso. Crepita y sisea en la punta, ansiosa por desatar su poderosa magia.
items.wands.wandoffireblast.eleblast_desc=Un ataque elemental con un bastón de fuego inflige un 100% de daño, abre puertas de golpe y prende fuego a los enemigos y al terreno.
items.wands.wandoffireblast.name=varita de explosión de fuego
items.wands.wandoffireblast.staff_name=personal de Fireblast
items.wands.wandoffireblast.stats_desc=Esta varita lanza un cono de fuego al usarse. Su siguiente ataque consumirá _%1$d cargas_ e infligirá _%2$d-%3$d puntos de daño_. Cuantas más cargas use la varita, mayor y más potente será el efecto.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Carga de daño
items.wands.wandoffireblast.upgrade_stat_name_2=2 Carga de daño
items.wands.wandoffireblast.upgrade_stat_name_3=3 Carga de daño
items.wands.wandoffrost.bmage_desc=Cuando el Mago de Batalla golpea a un enemigo helado con un bastón de escarcha, este tiene la posibilidad de congelarse instantáneamente. Esta posibilidad aumenta cuanto más helado esté.
items.wands.wandoffrost.desc=Esta varita parece estar hecha de algún tipo de hielo mágico. Su brillo aumenta hacia la punta redondeada. Se siente muy fría al sostenerla, pero de alguna manera la mano se mantiene caliente.
items.wands.wandoffrost.eleblast_desc=Un ataque elemental con un bastón de escarcha inflige un 100% de daño, congela a los enemigos y apaga incendios.
items.wands.wandoffrost.name=varita de escarcha
items.wands.wandoffrost.staff_name=bastón de escarcha
items.wands.wandoffrost.stats_desc=Esta varita dispara ráfagas de energía gélida hacia tus enemigos, infligiendo _%1$d-%2$d de daño_ y congelándolos. El efecto parece ser más fuerte en el agua. Los enemigos que ya están congelados o enfriados reciben menos daño de esta varita.
items.wands.wandoffrost.upgrade_stat_name_2=Duración del enfriamiento
items.wands.wandoflightning$lightningcharge.desc=El Mago de Batalla está actualmente cargado de energía, lo que le otorga inmunidad a su bastón de relámpagos y aumenta el alcance que los relámpagos pueden generar desde él.\n\nTurnos restantes: %s.
items.wands.wandoflightning$lightningcharge.name=Cargado eléctricamente
items.wands.wandoflightning.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de relámpagos, tiene la posibilidad de cargarse eléctricamente durante 10 turnos. Mientras está cargado, el Mago de Batalla es inmune al daño de los relámpagos y lanzará rayos a mayor distancia.
items.wands.wandoflightning.desc=Esta varita está hecha de metal macizo, lo que la hace sorprendentemente pesada. Dos puntas se curvan y se unen en el extremo, y entre ellas se produce un arco eléctrico.
items.wands.wandoflightning.eleblast_desc=Un ataque elemental con un bastón de relámpagos inflige un 100% de daño, aturde a los enemigos durante 5 turnos y electrifica el agua.
items.wands.wandoflightning.name=varita de relámpago
items.wands.wandoflightning.ondeath=Te suicidaste con tu propia Vara del Rayo...
items.wands.wandoflightning.staff_name=bastón de relámpago
items.wands.wandoflightning.stats_desc=Esta varita lanza potentes rayos que atraviesan todo a su paso, infligiendo _%1$d-%2$d de daño_. Esta electricidad se propagará a los personajes cercanos y se extenderá con mayor facilidad en el agua. Los rayos de esta varita pueden dañarte, pero no a tus aliados.
items.wands.wandoflivingearth$earthguardian.desc=¡Las rocas de tu varita de tierra viviente se han transformado en un guardián terroso protector! Este protector rocoso atacará a los enemigos cercanos, obligándolos a atacar al guardián en lugar de a ti. Cuando todas las amenazas cercanas hayan desaparecido, el guardián se reformará a tu alrededor y regresará la próxima vez que uses tu varita.
items.wands.wandoflivingearth$earthguardian.discover_hint=Puedes encontrar a este personaje con una varita específica.
items.wands.wandoflivingearth$earthguardian.name=guardián de la tierra
items.wands.wandoflivingearth$earthguardian.wand_info=El poder defensivo del guardián está ligado al nivel de tu varita. Actualmente bloquea _%1$d-%2$d de daño._
items.wands.wandoflivingearth$rockarmor.desc=Rocas mágicas rodean tu cuerpo, cuando te atacan intentarán bloquearte y reducirán el daño que recibes en 50%%. Sin embargo, cada daño bloqueado raspa un poco de la roca.\n\nArmadura restante: %1$d.\n\nSi se acumula suficiente roca a tu alrededor, el siguiente rayo de tu varita de tierra viviente hará que las rocas formen un guardián que luchará contigo.\n\nArmadura necesaria para el Guardián: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Este guardián terrenal también se beneficia del Poder de Muchos. Turnos restantes: %d.
items.wands.wandoflivingearth$rockarmor.name=armadura de roca
items.wands.wandoflivingearth.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de tierra viva, parte del daño infligido se devuelve como armadura de roca.
items.wands.wandoflivingearth.desc=Esta varita está hecha de una roca peculiar, con bandas de energía amarilla brillante. Las rocas parecen moverse ligeramente al sujetar la varita, como si pudieran sentir tu mano.
items.wands.wandoflivingearth.eleblast_desc=Una explosión elemental con un bastón de tierra viviente inflige un 50% de daño y cura a un guardián de tierra activo por cada enemigo alcanzado.
items.wands.wandoflivingearth.name=varita de tierra viviente
items.wands.wandoflivingearth.staff_name=personal de la tierra viviente
items.wands.wandoflivingearth.stats_desc=Esta varita lanza rayos de roca mágica contra los enemigos, infligiendo _%1$d-%2$d de daño._ Las rocas se reformarán alrededor del usuario, otorgándole armadura proporcional al daño recibido. Si se acumula suficiente armadura, se convertirá en un guardián de roca al usar la varita de nuevo.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Bloqueo de guardianes
items.wands.wandofmagicmissile$magiccharge.desc=Tu varita de misil mágico ha devuelto energía a tus varitas, aumentando el nivel efectivo del siguiente rayo que hagan.\n\nTus varitas se potencian a: +%d.\n\nTurnos de carga mágica restantes: %s.
items.wands.wandofmagicmissile$magiccharge.name=carga mágica
items.wands.wandofmagicmissile.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de proyectil mágico, todas sus varitas obtendrán carga además de su bastón.
items.wands.wandofmagicmissile.desc=Esta varita, bastante sencilla, lanza proyectiles de pura energía mágica. Si bien la varita en sí carece de efectos especiales, tiene más cargas disponibles y, al mejorarla, puede potenciar brevemente otras varitas.
items.wands.wandofmagicmissile.discover_hint=Uno de los héroes comienza con este objeto.
items.wands.wandofmagicmissile.eleblast_desc=Un ataque elemental con un bastón de misil mágico inflige un 50% de daño y otorga al mago 15 turnos de recarga.
items.wands.wandofmagicmissile.name=varita de misil mágico
items.wands.wandofmagicmissile.staff_name=bastón de misil mágico
items.wands.wandofmagicmissile.stats_desc=Cada rayo de esta varita inflige _%1$d-%2$d de daño_, y potenciará brevemente a otras varitas si se mejora.
items.wands.wandofprismaticlight.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de luz prismática, este quedará incapacitado durante un tiempo que aumenta con el nivel del bastón.
items.wands.wandofprismaticlight.desc=Esta varita está hecha de una pieza sólida de cristal translúcido, como un trozo largo de vidrio liso. Pequeños destellos de luz de colores danzan alrededor de la punta de la varita, ansiosos por estallar.
items.wands.wandofprismaticlight.eleblast_desc=Una explosión elemental con un bastón de luz prismática inflige un 67% de daño, revela todo el terreno en la explosión y ciega a los enemigos durante 5 turnos.
items.wands.wandofprismaticlight.name=varita de luz prismática
items.wands.wandofprismaticlight.staff_name=bastón de luz prismática
items.wands.wandofprismaticlight.stats_desc=Esta varita dispara rayos de luz que atraviesan la oscuridad de la mazmorra, revelando áreas ocultas y trampas. El rayo puede cegar a los enemigos y causa _%1$d-%2$d de daño_. Los enemigos demoníacos y no muertos arderán bajo la brillante luz de la varita, recibiendo daño adicional.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Azar ciego
items.wands.wandofprismaticlight.upgrade_stat_name_3=Duración de la luz
items.wands.wandofregrowth$dewcatcher.desc=Las atrapa-rocío son plantas maravillosas que se llenan de rocío mágico. Intentan camuflarse como hierba para pasar desapercibidas, pero sus acumulaciones de rocío las delatan.
items.wands.wandofregrowth$dewcatcher.discover_hint=Puedes encontrar esta planta con una varita específica.
items.wands.wandofregrowth$dewcatcher.name=Captador de rocío
items.wands.wandofregrowth$lotus.desc=El loto dorado es una planta mística que solo puede ser invocada mediante una poderosa varita de regeneración. Su aura potencia todas las plantas y sus efectos, pero consume su energía y muere al poco tiempo.
items.wands.wandofregrowth$lotus.discover_hint=Puedes encontrar esta planta con una varita específica, después de mejorarla varias veces.
items.wands.wandofregrowth$lotus.name=Loto dorado
items.wands.wandofregrowth$lotus.wand_info=Este loto fue producido por una varita de regeneración _+%1$d_. Todas las plantas en su área de efecto se activarán instantáneamente si se plantan sobre un personaje. Las plantas también tendrán una probabilidad _%2$d%%_ de soltar su semilla, y los dardos con punta usarán _%3$d%% menos durabilidad_.
items.wands.wandofregrowth$seedpod.desc=Las vainas de semillas son plantas mágicas que producen semillas de otros tipos de plantas, en lugar de semillas propias. De alguna manera, logran propagarse a pesar de no tener semillas propias.
items.wands.wandofregrowth$seedpod.discover_hint=Puedes encontrar esta planta con una varita específica.
items.wands.wandofregrowth$seedpod.name=Cápsula de semillas
items.wands.wandofregrowth.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de regeneración, y ambos están parados sobre hierba, obtendrá curación herbal en proporción al daño infligido.
items.wands.wandofregrowth.degradation=Tras otra carga de _%d_, esta varita dejará de producir plantas y hierba fresca. Este límite aumenta al subir de nivel o mejorar la varita.
items.wands.wandofregrowth.desc=Esta varita está hecha de un fino asta de madera tallada con maestría. De alguna manera, aún conserva vida y vitalidad, de un verde brillante como el núcleo de un árbol joven. «Cuando la vida cesa, siempre comienza a crecer una nueva vida... ¡El ciclo eterno siempre permanece!»
items.wands.wandofregrowth.eleblast_desc=Una explosión elemental con un bastón de regeneración enraíza a los enemigos y hace crecer hierba aleatoriamente sobre el área de la explosión.
items.wands.wandofregrowth.name=varita de regeneración
items.wands.wandofregrowth.staff_name=personal de regeneración
items.wands.wandofregrowth.stats_desc=Al usarse, esta varita lanza energía mágica de regeneración en forma de cono, haciendo que la hierba, las raíces y las plantas raras cobren vida. Su siguiente descarga consumirá _%1$d cargas_. Cuantas más cargas use la varita, mayor y más potente será el efecto.
items.wands.wandofregrowth.upgrade_stat_name_1=Hierba por cargo
items.wands.wandofregrowth.upgrade_stat_name_2=Límite total de césped
items.wands.wandoftransfusion.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo encantado con un bastón de transfusión, obtendrá un escudo y su siguiente ataque con el bastón no le costará puntos de salud.
items.wands.wandoftransfusion.charged=¡Tu personal está cargado con la energía vital de tu enemigo!
items.wands.wandoftransfusion.desc=Se trata de una varita de forma bastante sencilla, que destaca por su tono magenta y la gema de color negro intenso en la punta.
items.wands.wandoftransfusion.eleblast_desc=Un ataque elemental con un bastón de transfusión encanta a los enemigos, cura a los aliados e inflige un 100% de daño a los enemigos no muertos.
items.wands.wandoftransfusion.name=varita de transfusión
items.wands.wandoftransfusion.ondeath=Te suicidaste con tu propia varita de transfusión...
items.wands.wandoftransfusion.staff_name=personal de transfusión
items.wands.wandoftransfusion.stats_desc=Cuando se usa en aliados o enemigos encantados, esta varita drena _%1$d de la salud del usuario_ para curar o proteger al aliado por _%2$d salud._ Cuando se usa en enemigos, la varita los encanta brevemente mientras aplica _%3$d protección_ al usuario. Los muertos vivientes hostiles recibirán _%4$d-%5$d daño_ en lugar de ser encantados.
items.wands.wandoftransfusion.upgrade_stat_name_1=Sanación de aliados
items.wands.wandoftransfusion.upgrade_stat_name_2=Autoprotección
items.wands.wandoftransfusion.upgrade_stat_name_3=Daño de no muertos
items.wands.wandofwarding$ward.desc_1=Este escudo básico electrocutará automáticamente a cualquier enemigo que entre en su rango de visión, infligiendo _%1$d-%2$d de daño._\n\nEfectar este escudo con tu varita de protección lo mejorará.\n\nEste escudo solo electrocutará una vez antes de disiparse.\n\nTu varita de protección está usando _%3$d energía_ para mantener este escudo.
items.wands.wandofwarding$ward.desc_2=Este escudo mejorado tiene un patrón más intrincado y puede atacar varias veces. Cada descarga de este escudo infligirá _%1$d-%2$d de daño._\n\nCalcular este escudo con tu varita de protección lo mejorará.\n\nEste escudo descargará tres veces antes de disiparse.\n\nTu varita de protección está usando _%3$d energía_ para mantener este escudo.
items.wands.wandofwarding$ward.desc_3=Este escudo completamente mejorado puede atacar más veces que sus predecesores. Cada descarga de este escudo infligirá _%1$d-%2$d de daño._\n\nCalcular este escudo con tu varita de protección lo mejorará.\n\nEste escudo descargará cinco veces antes de disiparse.\n\nTu varita de protección está usando _%3$d energía_ para mantener este escudo.
items.wands.wandofwarding$ward.desc_4=Este centinela más pequeño tiene la misma potencia de fuego que un guardián mayor, pero tiene salud en lugar de un número fijo de cargas. Se parece a la gema en la punta de tu varita de protección. Cada descarga de este centinela infligirá _%1$d-%2$d de daño._\n\nCalcular este centinela con tu varita de protección lo mejorará y lo curará.\n\nEste centinela gastará algo de salud cada vez que descargue a un enemigo, pero puede ser curado usando tu varita de protección sobre él.\n\nTu varita de protección está usando _%3$d energía_ para mantener este centinela.
items.wands.wandofwarding$ward.desc_5=Este centinela mejorado es más grande y más resistente que un centinela inferior. Cada descarga de este centinela infligirá _%1$d-%2$d de daño._\n\nCalcular este centinela con tu varita de protección lo mejorará y lo curará.\n\nEste centinela gastará algo de salud cada vez que descargue a un enemigo, pero puede curarse usando tu varita de protección sobre él.\n\nTu varita de protección está usando _%3$d energía_ para mantener este centinela.
items.wands.wandofwarding$ward.desc_6=Esta torreta totalmente mejorada es significativamente más duradera que sus predecesoras. Cada descarga de esta torreta infligirá _%1$d-%2$d de daño._\n\nCalcular esta torreta con tu varita de protección la curará.\n\nEsta torreta gastará algo de salud cada vez que fulmine a un enemigo, pero puede curarse usando tu varita de protección sobre ella.\n\nTu varita de protección está usando _%3$d energía_ para mantener esta torreta.
items.wands.wandofwarding$ward.desc_generic_sentry=Este centinela tiene la misma potencia de fuego que un guardián, pero tiene salud en lugar de un número fijo de cargas. Se parece a la gema en la punta de tu varita de protección.\n\nAl golpear a este centinela con tu varita de protección, se mejorará y se curará.\n\nEste centinela gastará algo de salud cada vez que golpee a un enemigo, pero puede curarse usando tu varita de protección sobre él.
items.wands.wandofwarding$ward.desc_generic_ward=Este amuleto electrocutará automáticamente a cualquier enemigo que entre en su rango de visión.\n\nEfectar este amuleto con tu varita de protección lo mejorará.\n\nLos amuletos tienen un número limitado de descargas antes de disiparse.
items.wands.wandofwarding$ward.discover_hint=Puedes encontrar a este personaje con una varita específica.
items.wands.wandofwarding$ward.dismiss_body=Puedes disipar este encantamiento si ya no quieres que tu varita lo mantenga. Al hacerlo, el encantamiento se destruye inmediatamente. ¿Descartar este encantamiento?
items.wands.wandofwarding$ward.dismiss_cancel=No
items.wands.wandofwarding$ward.dismiss_confirm=Sí
items.wands.wandofwarding$ward.dismiss_title=¿Despachar a este paciente?
