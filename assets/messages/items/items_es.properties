items.artifacts.lloydsbeacon.ac_zap=BORRAR
items.artifacts.lloydsbeacon.creatures=El aura psíquica de las criaturas vecinas no te permite usar la baliza de Lloyd en este momento.
items.artifacts.lloydsbeacon.desc=El faro de Lloyd es un intrincado dispositivo mágico que otorga al usuario el control de la teletransportación. El faro puede usarse para regresar a una ubicación predefinida, pero también puede emitir ráfagas de teletransportación aleatorias una vez cargado. Esta magia puede dirigirse a un objetivo o al propio usuario.
items.artifacts.lloydsbeacon.desc_set=Esta baliza fue colocada en algún lugar del nivel %d de Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=¡Tu baliza se hace más fuerte!
items.artifacts.lloydsbeacon.name=El faro de Lloyd
items.artifacts.lloydsbeacon.no_charge=Tu baliza no tiene suficiente energía en este momento.
items.artifacts.lloydsbeacon.preventing=¡El fuerte aura mágica de este lugar te impide usar el faro de Lloyd!
items.artifacts.lloydsbeacon.prompt=Elige una ubicación para realizar el ataque.
items.artifacts.lloydsbeacon.return=La baliza de Lloyd se ha colocado correctamente en tu ubicación actual; ahora puedes volver aquí cuando quieras.
items.artifacts.lloydsbeacon.tele_fail=La magia de la teletransportación falla.
items.artifacts.masterthievesarmband.ac_steal=ROBAR
items.artifacts.masterthievesarmband.cursed=No puedes usar un brazalete maldito.
items.artifacts.masterthievesarmband.desc=Este brazalete de terciopelo morado lleva la marca de un maestro ladrón. No te pertenece, pero probablemente tampoco le perteneció a su anterior dueño.
items.artifacts.masterthievesarmband.desc_cursed=El brazalete maldito está atado a tu muñeca, y de alguna manera tu bolsa de oro parece estar vaciándose poco a poco...
items.artifacts.masterthievesarmband.desc_worn=Sientes cómo el poder se acumula en el brazalete de tu muñeca a medida que ganas experiencia. ¡Puedes usar este poder para robar en tiendas o asaltar enemigos! \n\n ¡Asaltar enemigos es instantáneo, los desorienta brevemente y te da la oportunidad de obtener el botín que tengan! Este poder es más efectivo contra enemigos desprevenidos. Asaltar al mismo enemigo varias veces no te da más oportunidades de obtener botín.
items.artifacts.masterthievesarmband.failed_steal=No lograste robar nada.
items.artifacts.masterthievesarmband.full=¡Tu brazalete está completamente cargado!
items.artifacts.masterthievesarmband.level_up=¡Tu brazalete se hace más fuerte!
items.artifacts.masterthievesarmband.name=brazalete de maestro ladrón
items.artifacts.masterthievesarmband.no_charge=Tu brazalete no tiene suficiente carga.
items.artifacts.masterthievesarmband.no_steal=Ese enemigo no tiene nada que robar.
items.artifacts.masterthievesarmband.no_target=Debes seleccionar como objetivo a un enemigo que esté junto a ti.
items.artifacts.masterthievesarmband.prompt=Elige un enemigo al que atacar.
items.artifacts.masterthievesarmband.steal_shopkeeper=No se puede robar directamente a los comerciantes.
items.artifacts.masterthievesarmband.stole_item=Has robado un artículo: %s.
items.artifacts.sandalsofnature.absorb_seed=El calzado absorbe la semilla y parecen más saludables.
items.artifacts.sandalsofnature.ac_feed=ALIMENTAR
items.artifacts.sandalsofnature.ac_root=RAÍZ
items.artifacts.sandalsofnature.desc_1=Lo que inicialmente parecen sandalias hechas de cordel son en realidad dos plantas. Se ven muy débiles y pálidas, ¿quizás necesiten nutrientes?
items.artifacts.sandalsofnature.desc_2=El calzado ha crecido y ahora se parece más a dos zapatos a medida. Han recuperado algo de color, ¿quizás puedan seguir creciendo?
items.artifacts.sandalsofnature.desc_3=Las plantas han vuelto a crecer y ahora parecen un par de botas robustas hechas de corteza. Parecen haber recuperado su fuerza, pero ¿quizás puedan seguir creciendo?
items.artifacts.sandalsofnature.desc_4=Las plantas parecen haber alcanzado su tamaño máximo; se asemejan a un par de grebas blindadas. Las grebas son de color marrón oscuro y se parecen a un árbol muy robusto.
items.artifacts.sandalsofnature.desc_ability=El calzado ondula con el color de la última semilla que les diste. Pueden echar raíces brevemente en el suelo y producir el efecto de esa planta en cualquier lugar dentro de un radio de 3 casillas.\nSemilla: _%s_\nCarga necesaria: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Las sandalias malditas impiden cualquier conexión con la naturaleza.
items.artifacts.sandalsofnature.desc_hint=Te sientes más conectado con la naturaleza al usar este objeto.
items.artifacts.sandalsofnature.desc_seeds=Has alimentado el calzado con semillas %d.
items.artifacts.sandalsofnature.levelup=¡Tu calzado aumenta de tamaño!
items.artifacts.sandalsofnature.low_charge=Tu calzado no tiene suficiente energía para eso.
items.artifacts.sandalsofnature.name=sandalias de la naturaleza
items.artifacts.sandalsofnature.name_1=zapatos de la naturaleza
items.artifacts.sandalsofnature.name_2=botas de la naturaleza
items.artifacts.sandalsofnature.name_3=grebas de la naturaleza
items.artifacts.sandalsofnature.no_effect=Primero debes introducir una semilla en tu calzado.
items.artifacts.sandalsofnature.out_of_range=Esa ubicación está fuera de alcance.
items.artifacts.sandalsofnature.prompt=Seleccione una semilla
items.artifacts.sandalsofnature.prompt_target=Seleccione una ubicación
items.artifacts.skeletonkey$keywall.desc=Aquí se ha colocado un muro mágico temporal junto a la llave maestra.
items.artifacts.skeletonkey.ac_insert=INSERTAR
items.artifacts.skeletonkey.crystal_charges=Abrir una cerradura de cristal requiere 5 cargas.
items.artifacts.skeletonkey.cursed=No puedes usar una llave maestra maldita.
items.artifacts.skeletonkey.desc=Una llave de aspecto importante con una cabeza en forma de calavera. Sus dientes parecen diferentes cada vez que los miras.
items.artifacts.skeletonkey.desc_cursed=La llave maldita parece estar evitando activamente encajar en cualquier cerradura, e incluso dificulta (aunque no imposibilita) el uso de tus otras llaves.
items.artifacts.skeletonkey.desc_worn=Esta llave mágica parece ganar poder a medida que la usas en lugar de las llaves normales de la mazmorra. Se puede insertar en casi cualquier cerradura de la mazmorra para abrirlas o cerrarlas, incluidas las puertas que nunca antes habían estado cerradas. La llave incluso se puede usar en un espacio vacío en una dirección cardinal o diagonal para "bloquear" el aire frente a ti, creando una pared sólida de 3 casillas de ancho que dura 10 turnos. Bloquear alejará a los enemigos si hay espacio para hacerlo.
items.artifacts.skeletonkey.discard=Desecha las llaves sobrantes.
items.artifacts.skeletonkey.force_lock=La cerradura se ha debilitado sin tu llave maestra. Lograste forzarla para abrirla.
items.artifacts.skeletonkey.gold_charges=Abrir un candado de oro requiere 2 cargas.
items.artifacts.skeletonkey.invalid_target=Allí no hay nada que cerrar ni que abrir.
items.artifacts.skeletonkey.iron_charges=Abrir una cerradura normal requiere 1 carga.
items.artifacts.skeletonkey.levelup=¡Tu llave maestra se hace más fuerte!
items.artifacts.skeletonkey.lock_charges=Cerrar una puerta con llave requiere 2 cargas.
items.artifacts.skeletonkey.lock_no_space=¡No puedes encerrar a un personaje dentro de una puerta!
items.artifacts.skeletonkey.locked_with_key=Esa puerta estaba cerrada con tu llave maestra.
items.artifacts.skeletonkey.name=llave maestra
items.artifacts.skeletonkey.prompt=Elige un objetivo
items.artifacts.skeletonkey.wall_charges=Crear una pared temporal requiere 2 cargas.
items.artifacts.skeletonkey.wont_open=Por alguna razón, la llave no encaja en esta cerradura.
items.artifacts.talismanofforesight$foresight.desc=Te sientes muy nervioso, como si hubiera un peligro invisible cerca.
items.artifacts.talismanofforesight$foresight.name=previsión
items.artifacts.talismanofforesight$foresight.uneasy=Te sientes incómodo.
items.artifacts.talismanofforesight.ac_scry=Adivinar
items.artifacts.talismanofforesight.desc=Una piedra lisa con extraños grabados. Da la sensación de que te observa todo a tu alrededor, atenta a cualquier cosa oculta.
items.artifacts.talismanofforesight.desc_cursed=El talismán maldito te mira fijamente, embotando tus sentidos.
items.artifacts.talismanofforesight.desc_worn=Cuando sostienes el talismán sientes que tus sentidos se agudizan. El talismán va acumulando carga lentamente a medida que pasa el tiempo y cuando descubres puertas o trampas ocultas.\n\nEl talismán puede gastar su carga para 'escudriñar' en forma de cono, lo que revela todas las casillas y secretos en el área escaneada, y te otorgará visión de enemigos y objetos durante un corto tiempo.
items.artifacts.talismanofforesight.full_charge=¡Tu talismán está completamente cargado!
items.artifacts.talismanofforesight.levelup=¡Tu talismán se hace más fuerte!
items.artifacts.talismanofforesight.low_charge=El talismán requiere al menos un 5% de carga para realizar la adivinación.
items.artifacts.talismanofforesight.name=talismán de la previsión
items.artifacts.talismanofforesight.prompt=Elige una ubicación para escanear.
items.artifacts.timekeepershourglass$sandbag.desc=Esta pequeña bolsa de arena fina debería funcionar perfectamente con tu reloj de arena.\n\nParece extraño que el tendero tenga este artículo específico justo cuando lo necesitas...
items.artifacts.timekeepershourglass$sandbag.levelup=Añades la arena a tu reloj de arena.
items.artifacts.timekeepershourglass$sandbag.maxlevel=¡Tu reloj de arena está lleno de arena mágica!
items.artifacts.timekeepershourglass$sandbag.name=bolsa de arena mágica
items.artifacts.timekeepershourglass$sandbag.no_hourglass=No tienes ningún reloj de arena donde colocar esta arena.
items.artifacts.timekeepershourglass$timefreeze.desc=El tiempo se congela a tu alrededor, permitiéndote realizar acciones al instante. El efecto durará hasta que se cancele o tu reloj de arena se quede sin carga. Atacar o usar magia también romperá este efecto.\n\nTurnos hasta que se cargue el uso: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Congelación del tiempo
items.artifacts.timekeepershourglass.ac_activate=ACTIVAR
items.artifacts.timekeepershourglass.cursed=No puedes usar un reloj de arena maldito.
items.artifacts.timekeepershourglass.deactivate=Desactivas la congelación del tiempo.
items.artifacts.timekeepershourglass.desc=Este gran reloj de arena ornamentado parece bastante sencillo, pero se percibe un gran poder en su marco finamente tallado. Al girarlo y ver caer la arena, se siente cómo su magia te atrae; sin duda, usar esa magia te daría cierto control sobre el tiempo.
items.artifacts.timekeepershourglass.desc_cursed=El reloj de arena maldito está sujeto a tu costado, puedes sentir cómo intenta manipular el transcurso del tiempo.
items.artifacts.timekeepershourglass.desc_hint=Parece que el reloj de arena ha perdido algo de arena, si tan solo pudieras encontrarla...
items.artifacts.timekeepershourglass.freeze=Congela el tiempo a mi alrededor
items.artifacts.timekeepershourglass.name=reloj de arena del cronometrador
items.artifacts.timekeepershourglass.no_charge=Tu reloj de arena aún no se ha recargado lo suficiente como para poder usarlo.
items.artifacts.timekeepershourglass.onfreeze=De repente, todo a tu alrededor se congela.
items.artifacts.timekeepershourglass.onstasis=El mundo parece transformarse a tu alrededor en un instante.
items.artifacts.timekeepershourglass.prompt=¿Cómo te gustaría usar la magia del reloj de arena?\n\nMientras estás en estasis, el tiempo se moverá normalmente mientras estés congelado y completamente invulnerable, consume hasta 2 cargas a la vez.\n\nCuando el tiempo está congelado, puedes moverte como si tus acciones no tomaran tiempo. Esto se puede desactivar en cualquier momento usando el reloj de arena o atacando.
items.artifacts.timekeepershourglass.stasis=Me puse en estado de estasis
items.artifacts.unstablespellbook.ac_add=AGREGAR
items.artifacts.unstablespellbook.ac_read=LEER
items.artifacts.unstablespellbook.blinded=No puedes leer el libro estando ciego.
items.artifacts.unstablespellbook.cursed=No puedes leer un libro de hechizos maldito.
items.artifacts.unstablespellbook.desc=Este tomo se encuentra en sorprendentemente buen estado para su antigüedad. Al pasar las páginas, burbujea y crepita, rebosante de energía inestable. Si lees de este libro, quién sabe qué hechizo podrías lanzar.
items.artifacts.unstablespellbook.desc_cursed=El libro maldito se ha vinculado a ti, impidiéndote usar la mayoría de los pergaminos.
items.artifacts.unstablespellbook.desc_empowered=Los pergaminos que has añadido al libro resplandecen con poder. Podrás elegir la versión exótica de los efectos de estos pergaminos, pero con un coste adicional.
items.artifacts.unstablespellbook.desc_index=El libro está incompleto. Su índice apunta actualmente a las siguientes páginas en blanco:
items.artifacts.unstablespellbook.infuse_scroll=Infundes la energía del pergamino en el libro.
items.artifacts.unstablespellbook.name=libro de hechizos inestable
items.artifacts.unstablespellbook.no_charge=Tu libro de hechizos se ha quedado sin energía por ahora.
items.artifacts.unstablespellbook.prompt=Seleccione un desplazamiento
items.artifacts.unstablespellbook.read_empowered=El pergamino que agregaste al libro de hechizos rebosa de energía. Puedes canalizar la versión normal o la versión exótica del efecto de este pergamino.\n\nElegir la variante exótica costará 2 cargas en lugar de 1.
items.artifacts.unstablespellbook.unable_scroll=No puedes añadir este pergamino al libro.
items.artifacts.unstablespellbook.unknown_scroll=Aún no estás seguro de qué tipo de pergamino es este.
items.bags.bag.discover_hint=Puedes comprar este artículo en una tienda.
items.bags.bag.name=mochila
items.bags.magicalholster.desc=Esta delgada funda está hecha de piel de algún animal exótico y posee magia poderosa que le permite almacenar una gran cantidad de armas de largo alcance.\n\nSimplemente puedes meter la mano en la bolsa y siempre tomarás el artículo que estabas buscando.\n\nDebido a la magia de la funda, las varitas se cargarán un poco más rápido y las armas arrojadizas durarán un poco más dentro de ella.
items.bags.magicalholster.name=funda mágica
items.bags.potionbandolier.desc=Esta gruesa bandolera se ajusta alrededor de tu pecho como una faja, tiene muchas correas aislantes para sujetar frascos de pociones, tu cantimplora o frascos de metal líquido.\n\nMientras esté dentro de la bandolera, tus pociones estarán protegidas del frío.
items.bags.potionbandolier.name=bandolera de pociones
items.bags.scrollholder.desc=Este contenedor tubular parece diseñado para guardar herramientas y mapas astronómicos, pero tus pergaminos también encajarán perfectamente. Incluso tiene algunos compartimentos laterales ideales para cristales mágicos, estiletes arcanos y resina arcana. El soporte no parece inflamable, por lo que tus pergaminos estarán a salvo del fuego en su interior.
items.bags.scrollholder.name=soporte para pergaminos
items.bags.velvetpouch.desc=Esta pequeña bolsa de terciopelo puede guardar muchos objetos pequeños, como semillas, runas y algunos ingredientes de alquimia.
items.bags.velvetpouch.discover_hint=Uno de los héroes comienza con este objeto.
items.bags.velvetpouch.name=bolsa de terciopelo
items.bombs.arcanebomb.desc=Esta bomba ha sido imbuida de propiedades arcanas. Explotará en una poderosa explosión similar al ataque potenciado de Goo, infligiendo _%1$d-%2$d daño mágico_ a cualquier cosa dentro de 2 casillas.
items.bombs.arcanebomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.arcanebomb.name=bomba arcana
items.bombs.bomb$doublebomb.desc=¡Parece que te llevas una pila de dos enormes bombas de pólvora negra, y además te regalan una!
items.bombs.bomb$doublebomb.name=dos bombas
items.bombs.bomb.ac_lightthrow=LIGERA Y DE ALCANCE
items.bombs.bomb.desc=Una bomba de pólvora negra bastante pesada. Una explosión de esta bomba inflige _%1$d-%2$d de daño_ a todo lo que esté adyacente a ella, y destruirá parte del terreno o los objetos adyacentes.
items.bombs.bomb.desc_burning=¡La mecha de la bomba se está consumiendo, mantén la distancia o apágala!
items.bombs.bomb.desc_fuse=Parece que la mecha tardará un par de disparos en consumirse una vez encendida.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=La explosión te mata...
items.bombs.bomb.rankings_desc=Muerto por una explosión
items.bombs.bomb.snuff_fuse=Apagas rápidamente la mecha de la bomba.
items.bombs.firebomb.desc=Esta bomba ha sido modificada para explotar en un área más grande, causando daños de _%1$d-%2$d_ y propagando llamas sostenidas dentro de 2 casillas.
items.bombs.firebomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.firebomb.name=bomba incendiaria
items.bombs.flashbangbomb.desc=Esta bomba personalizada estallará en una explosión de luz, sonido y electricidad. Todo lo que se encuentre a menos de 2 casillas recibirá _%1$d-%2$d de daño_ por la explosión, 25%% de daño adicional por la electricidad y quedará aturdido durante 10 turnos.
items.bombs.flashbangbomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.flashbangbomb.name=granada aturdidora
items.bombs.frostbomb.desc=Esta bomba ha sido modificada para explotar en un área más grande, causando daños de _%1$d-%2$d_ y extendiendo una ráfaga sostenida de aire helado dentro de 2 casillas.
items.bombs.frostbomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.frostbomb.name=bomba de hielo
items.bombs.holybomb.desc=Esta bomba ha sido modificada para emitir luz sagrada en un área mayor al explotar. Todo lo que se encuentre dentro de un radio de 2 casillas recibirá daño de _%1$d-%2$d_ por la explosión, y los enemigos no muertos o demoníacos recibirán daño adicional de 50%% por la luz sagrada.
items.bombs.holybomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.holybomb.name=bomba santa
items.bombs.noisemaker.desc=Esta bomba personalizada hará ruido repetidamente cuando se le acabe la mecha. Cuando algo toque la bomba, explotará e infligirá _%1$d-%2$d de daño_ a todo lo que se encuentre a menos de 2 casillas.
items.bombs.noisemaker.desc_burning=¡El generador de ruido está funcionando, explotará cuando algo se acerque!
items.bombs.noisemaker.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.noisemaker.name=generador de ruido
items.bombs.regrowthbomb.desc=Esta bomba personalizada rociará líquido vital en un radio de 3 casillas en lugar de explotar. En la zona afectada por la explosión, crecerán rápidamente hierba y plantas. Tú y tus aliados que se encuentren en la explosión se curarán como si hubieran bebido una poción curativa.
items.bombs.regrowthbomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.regrowthbomb.name=bomba de regeneración
items.bombs.shrapnelbomb.desc=Esta bomba ha sido modificada con restos de metal del DM-300, que se fragmentarán y saldrán disparados por todas partes al explotar, causando daños de _%1$d-%2$d_ en un amplio radio alrededor de la bomba. Será mejor que te escondas detrás de algo al usarla...
items.bombs.shrapnelbomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.shrapnelbomb.name=bomba de metralla
items.bombs.smokebomb.desc=Esta bomba ha sido modificada para expulsar una densa nube de gas al mismo tiempo que explota. Causará _%1$d-%2$d de daño_ y extenderá una niebla densa en un radio de 2 casillas.
items.bombs.smokebomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.smokebomb.name=bomba de humo
items.bombs.woollybomb.desc=Esta bomba personalizada creará un amplio campo de ovejas mágicas tras explotar. La explosión infligirá _%1$d-%2$d de daño_ a todo lo que se encuentre a 2 casillas de distancia. Las ovejas bloquearán el movimiento y permanecerán durante mucho tiempo. Sin embargo, no durarán tanto en presencia de enemigos poderosos, y pueden ser eliminadas manualmente antes interactuando con ellos.
items.bombs.woollybomb.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.bombs.woollybomb.name=bomba lanuda
items.brokenseal$warriorshield.desc_active=El sello roto del Guerrero actualmente lo está ayudando a perseverar, otorgándole escudo además de su salud. Hay un tiempo de reutilización después de que el escudo se activa inicialmente antes de que pueda usarse de nuevo.\n\nEste escudo no se desintegra con el tiempo, pero terminará si no hay enemigos cerca durante algunos turnos. Cuando termina, cualquier escudo no utilizado reducirá el tiempo de reutilización, hasta un máximo de 50%%.\n\nEscudo restante: %1$d.\n\nTiempo de reutilización actual: %2$d.
items.brokenseal$warriorshield.desc_cooldown=El guerrero ha obtenido recientemente protección gracias a su sello roto, y debe esperar hasta poder beneficiarse de su efecto protector nuevamente.\n\nTurnos restantes: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=El tiempo de reutilización del escudo del Guerrero es actualmente negativo, lo que significa que cuando su escudo se activa, el tiempo de reutilización será menor que los 150 turnos habituales. El tiempo de reutilización del escudo se puede reducir hasta -150 turnos, lo que significa que estará disponible de nuevo inmediatamente una vez que se active.\n\nTiempo de reutilización actual: %d.
items.brokenseal$warriorshield.name=Escudo de guerrero
items.brokenseal.ac_affix=AFIJO
items.brokenseal.affix=¡Colocas el sello en tu armadura!
items.brokenseal.choose_desc=Tanto esta armadura como el sello roto llevan un glifo. Elige qué glifo conservar.\n\nGlifo de armadura: %1$s\nGlifo de sello roto: %2$s\n\nTen en cuenta que si eliges el glifo que está actualmente en la armadura, el sello no podrá transferirlo más tarde.
items.brokenseal.choose_title=Elige un glifo
items.brokenseal.cursed_armor=El sello no se aplicará a las armaduras malditas.
items.brokenseal.desc=Un sello de cera, adherido a la armadura como símbolo de valor. Tiene una runa de protección descolorida grabada en el centro y está partido por la mitad.\n\nUn recuerdo de su hogar, el sello ayuda al guerrero a perseverar. Mientras lleva el sello, el guerrero obtendrá instantáneamente un escudo cuando esté a punto de ser dañado a la mitad de su salud o menos.\n\nEl sello puede ser _adherido a la armadura_ y movido entre armaduras. Puede llevar una sola mejora consigo, siempre que esa mejora se haya aplicado a la armadura mientras el sello estaba adherido a ella.
items.brokenseal.discover_hint=Uno de los héroes comienza con este objeto.
items.brokenseal.inscribed=El sello lleva inscrita la fórmula _%s._
items.brokenseal.name=sello roto
items.brokenseal.prompt=Seleccione una armadura
items.brokenseal.unknown_armor=Primero debes determinar si esa armadura está maldita o no.
items.dewdrop.already_full=Ya gozas de plena salud.
items.dewdrop.desc=Una gota de rocío cristalina.
items.dewdrop.name=gota de rocío
items.dewvial.ac_drink=BEBER
items.dewvial.auto_drink=El frasco de rocío se ha vaciado para curar tus heridas.
items.dewvial.collected=Has recogido una gota de rocío en tu frasco.
items.dewvial.desc=Puedes guardar el rocío sobrante en este pequeño frasco para beberlo más tarde. Si está lleno, el rocío se beberá automáticamente cuando estés en peligro de muerte.
items.dewvial.empty=¡Tu frasco de rocío está vacío!
items.dewvial.full=¡Tu frasco de rocío está lleno!
items.dewvial.name=frasco de rocío
items.energycrystal.desc=Una colección de pequeños cristales mágicos, llenos de energía alquímica.\n\nEstos cristales son el ingrediente más común en las recetas de alquimia y se pueden producir en un caldero de alquimia desechando objetos consumibles.
items.energycrystal.name=cristal de energía
items.equipableitem.ac_equip=EQUIPAR
items.equipableitem.ac_unequip=DESEQUIPO
items.equipableitem.curse_detected=¡Presientes que el objeto está maldito justo antes de equiparlo!
items.equipableitem.unequip_cursed=¡No puedes eliminar un objeto maldito!
items.food.berry.desc=La Cazadora encontró esta pequeña baya entre la vegetación de la mazmorra. Se puede comer rápidamente, repone un poco de saciedad y ¡podría contener una semilla aprovechable!
items.food.berry.discover_hint=Puedes encontrar este objeto utilizando una habilidad específica del héroe.
items.food.berry.eat_msg=¡Esa baya estaba deliciosa!
items.food.berry.name=baya de mazmorra
items.food.blandfruit$chunks.desc=La fruta insípida explotó al impactar, dejando trozos inertes.\n\nA pesar de un poco de tierra, estos grandes trozos de fruta insípida cocida parecen perfectamente comestibles.
items.food.blandfruit$chunks.name=trozos de fruta insípidos
items.food.blandfruit.blindfruit=fruto ciego
items.food.blandfruit.cooked=fruta cocida insípida
items.food.blandfruit.desc=Está tan seco e insustancial que quizás cocerlo a fuego lento con otro ingrediente mejoraría.
items.food.blandfruit.desc_cooked=La fruta se ha hinchado al remojarse en la olla e incluso ha absorbido las propiedades de la semilla con la que se cocinó. Tendrá el efecto de la poción a la que correspondía la semilla.
items.food.blandfruit.desc_eat=¡Parece listo para comer!
items.food.blandfruit.desc_throw=Parece bastante inestable, quizás lo mejor sea tirarlo.
items.food.blandfruit.dreamfruit=fruta mágica
items.food.blandfruit.earthfruit=fruta de tierra
