items.weapon.enchantments.corrupting.desc=Este poderoso encantamiento tiene la capacidad de someter a los enemigos a tu voluntad. Cuando un enemigo muere con esta arma, existe la posibilidad de que se corrompa en lugar de morir.
items.weapon.enchantments.corrupting.elestrike_desc=Un ataque elemental con un encantamiento corruptor tiene una probabilidad del 5 al 25 % (según los puntos de vida faltantes) de corromper a todos los enemigos dentro del alcance, excepto al objetivo principal.
items.weapon.enchantments.corrupting.name=Corrompiendo %s
items.weapon.enchantments.elastic.desc=Las armas elásticas tienen la posibilidad de lanzar a los enemigos hacia atrás a corta distancia.
items.weapon.enchantments.elastic.elestrike_desc=Un ataque elemental con un encantamiento elástico repele a todos los enemigos dentro del alcance 5 casillas hacia atrás.
items.weapon.enchantments.elastic.name=elástico %s
items.weapon.enchantments.grim.desc=Este poderoso encantamiento tiene el poder de ejecutar instantáneamente a un enemigo. Cuanto más débil sea el enemigo, mayor será la probabilidad de que el efecto se produzca.
items.weapon.enchantments.grim.elestrike_desc=Un ataque elemental con un encantamiento sombrío tiene una probabilidad del 6 al 30 % (según los puntos de vida faltantes) de matar a cada enemigo dentro del alcance, excepto al objetivo principal.
items.weapon.enchantments.grim.name=sombrío %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Tu arma ha almacenado la fuerza sobrante de un golpe mortal anterior y la aplicará como daño adicional a tu próximo ataque. Sin embargo, la energía se desvanecerá lentamente con el tiempo.\n\nDaño conservado: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=daños conservados
items.weapon.enchantments.kinetic.desc=Cuando un enemigo muere a causa de un arma cinética, cualquier exceso de fuerza se almacena en el arma y se aplicará al siguiente ataque exitoso.
items.weapon.enchantments.kinetic.elestrike_desc=Un ataque elemental con un encantamiento cinético aplica el 40% del daño almacenado a cada enemigo dentro del alcance, excepto al objetivo principal.
items.weapon.enchantments.kinetic.name=cinético %s
items.weapon.enchantments.lucky.desc=Los enemigos que mueren a manos de un arma afortunada tienen la posibilidad de soltar botín adicional.
items.weapon.enchantments.lucky.elestrike_desc=Un ataque elemental con un encantamiento de suerte tiene un 12,5 % de probabilidad de generar botín debajo de cada enemigo dentro del alcance. Este efecto solo puede activarse una vez por enemigo.
items.weapon.enchantments.lucky.name=afortunado %s
items.weapon.enchantments.projecting.desc=Con este encantamiento, las armas cuerpo a cuerpo obtendrán mayor alcance. Las armas a distancia atravesarán las paredes al apuntar a objetivos cercanos.
items.weapon.enchantments.projecting.elestrike_desc=Un ataque elemental con un encantamiento de proyección inflige un 30% de daño a cada enemigo dentro del alcance, excepto al objetivo principal.
