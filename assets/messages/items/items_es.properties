items.rings.ringofmight.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu fuerza en _%1$d_ y tu HP máximo en _%2$s%%_ en total.
items.rings.ringofmight.desc=Este anillo potencia las cualidades físicas de quien lo lleva, otorgándole mayor fuerza y resistencia. Un anillo maldito debilitará a quien lo use.
items.rings.ringofmight.name=anillo de poder
items.rings.ringofmight.stats=Al usarlo, este anillo aumentará tu fuerza en _%1$d_ y tus puntos de vida máximos en _%2$s%%._
items.rings.ringofmight.typical_stats=Al usarlo, este anillo normalmente aumentará tu fuerza en _%1$d_ y tus puntos de vida máximos en _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=aumento de fuerza
items.rings.ringofmight.upgrade_stat_name_2=Impulso de HP máximo
items.rings.ringofsharpshooting.combined_stats=Tus anillos equipados están combinando su poder, aumentando el nivel efectivo de armas arrojadizas en _%1$d_ y aumentando su durabilidad en _%2$s%%_ en total.
items.rings.ringofsharpshooting.desc=Este anillo mejora la precisión y la puntería de quien lo lleva, lo que hará que todas las armas de proyectiles sean más dañinas y duraderas. Un anillo maldito tendrá el efecto contrario.
items.rings.ringofsharpshooting.name=anillo de francotiradores
items.rings.ringofsharpshooting.stats=Cuando se usa, este anillo aumenta el daño de tus armas arrojadizas como si su nivel aumentara en _%1$d_, y aumenta su durabilidad en _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Cuando se usa, este anillo generalmente aumenta el daño de tus armas arrojadizas como si su nivel aumentara en _%1$d_ y aumenta su durabilidad en _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento de daño de nivel
items.rings.ringofsharpshooting.upgrade_stat_name_2=Mejora de la durabilidad
items.rings.ringoftenacity.combined_stats=Tus anillos equipados están combinando su poder, reduciendo el daño que recibes hasta en _%s%%_ en total.
items.rings.ringoftenacity.desc=Al usarlo, este anillo le permitirá resistir golpes que normalmente serían mortales. Cuanto más herido esté el usuario, mayor será su resistencia al daño. Un anillo maldito, en cambio, facilitará que los enemigos ejecuten a quien lo lleva.
items.rings.ringoftenacity.name=anillo de tenacidad
items.rings.ringoftenacity.stats=Cuando se usa, este anillo reducirá el daño que recibe hasta en _%s%%._
items.rings.ringoftenacity.typical_stats=Cuando se usa, este anillo normalmente reducirá el daño que recibe hasta en _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Resistencia máxima al daño
items.rings.ringofwealth.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu suerte en _%s%%_ en total.
items.rings.ringofwealth.desc=Este anillo actúa como un imán para el tesoro, aumentando la probabilidad de que los enemigos y los contenedores contengan objetos valiosos. Un anillo maldito, en cambio, reducirá tus posibilidades de obtener botín.
items.rings.ringofwealth.name=anillo de riqueza
items.rings.ringofwealth.stats=Cuando lo uses, este anillo aumentará tu suerte en _%s%%._
items.rings.ringofwealth.typical_stats=Cuando se usa, este anillo generalmente aumenta la suerte en _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Impulso de suerte
