items.weapon.melee.warhammer.typical_ability_desc=El Duelista puede realizar un golpe contundente con un martillo de guerra. Este ataque concentrado suele infligir entre %1$d y %2$d de daño si sorprende al enemigo, y lo aturde durante 5 turnos, lo que reduce su precisión y evasión en 50%%. El golpe contundente siempre acierta, pero inflige daño normal si no sorprende al enemigo.
items.weapon.melee.warscythe.ability_desc=El Duelista puede _cosechar_ a un enemigo con una guadaña de guerra. Este devastador ataque tiene un impacto garantizado y causa _%d de daño_. Este daño se aplica como sangrado si el objetivo no es inmune.
items.weapon.melee.warscythe.ability_name=cosecha
