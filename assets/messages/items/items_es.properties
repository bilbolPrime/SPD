items.weapon.melee.sword.typical_ability_desc=El Duelista puede atacar a un enemigo con una espada. Esto suele infligir entre %1$d y %2$d de daño y tiene un impacto garantizado. Si el ataque mata a un enemigo, es instantáneo y el Duelista puede volver a usarlo gratis en un plazo de 5 turnos.
items.weapon.melee.warhammer.ability_desc=El Duelista puede realizar un _golpe pesado_ con un martillo de guerra. Este ataque concentrado inflige _%1$d-%2$d de daño_ si sorprende al enemigo, y lo aturde durante 5 turnos, lo que reduce la precisión y la evasión en 50%%. El golpe pesado siempre acierta, pero inflige daño normal si no sorprende al enemigo.
items.weapon.melee.warhammer.ability_name=golpe fuerte
