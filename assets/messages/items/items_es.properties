items.rings.ring.unknown_desc=Este anillo de metal lleva una gran gema de %s que brilla en la oscuridad. ¿Quién sabe qué efecto tendrá al llevarlo puesto?
items.rings.ringofaccuracy.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu precisión en _%s%%_ en total.
items.rings.ringofaccuracy.desc=Este anillo aumenta tus probabilidades de acertar al enemigo.
