items.food.chargrilledmeat.desc=Parece un buen filete.
items.food.chargrilledmeat.discover_hint=Puedes crear esto utilizando otro alimento.
items.food.chargrilledmeat.name=carne a la parrilla
items.food.food.ac_eat=COMER
items.food.food.desc=Nada del otro mundo: carne seca, algunas galletas, cosas así.
items.food.food.eat_msg=¡Esa comida estaba deliciosa!
items.food.food.name=ración de alimentos
items.food.frozencarpaccio.better=¡Te sientes mejor!
items.food.frozencarpaccio.desc=Es un trozo de carne cruda congelada. La única forma de comerla es cortándola en lonchas finas. Y así está sorprendentemente buena.
items.food.frozencarpaccio.discover_hint=Puedes crear esto utilizando otro alimento.
items.food.frozencarpaccio.hard=¡Sientes cómo se te endurece la piel!
items.food.frozencarpaccio.invis=¡Ves cómo tus manos se vuelven invisibles!
items.food.frozencarpaccio.name=carpaccio congelado
items.food.frozencarpaccio.refresh=¡Refrescante!
items.food.meatpie.desc=Un delicioso pastel relleno de carne sabrosa. Te saciará mucho más que cualquier otra comida.
items.food.meatpie.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.food.meatpie.eat_msg=¡Esa comida estaba increíble!
items.food.meatpie.name=pastel de carne
items.food.mysterymeat$placeholder.name=carne
items.food.mysterymeat.desc=¡Coma bajo su propio riesgo!
items.food.mysterymeat.discover_hint=Puedes obtener este objeto como botín de ciertos enemigos.
items.food.mysterymeat.eat_msg=Esa comida tenía un sabor... extraño.
items.food.mysterymeat.hot=¡Oh, qué calor!
items.food.mysterymeat.legs=¡No sientes las piernas!
items.food.mysterymeat.name=carne misteriosa
items.food.mysterymeat.not_well=No te encuentras bien.
items.food.mysterymeat.stuffed=Estás lleno.
items.food.pasty$fishleftover.desc=Un poco de pescado sobrante de tu comida anterior. Puedes comerlo cuando quieras para calmar un poco el hambre.
items.food.pasty$fishleftover.eat_msg=La comida estaba bien.
items.food.pasty$fishleftover.name=restos de pescado
items.food.pasty.amulet_desc=¡Finalmente lo encontraste, el amuleto mágico de... espera un minuto, ¡esto es solo un chocolate envuelto en papel de aluminio que parece el amuleto! No te otorgará poder ilimitado, pero al menos te llenará y te dará una pequeña carga de artefacto. ¡Día de los Inocentes!
items.food.pasty.amulet_name=¿Amuleto de Yendor?
items.food.pasty.cane_desc=Un enorme bastón de caramelo dulce y azucarado. Es lo suficientemente grande como para llenarte, y el azúcar también podría darle a tus varitas un poquito de carga extra.\n\n¡Felices fiestas!
items.food.pasty.cane_name=bastón de caramelo
items.food.pasty.desc=Una auténtica empanada de Cornualles con un relleno tradicional de carne de res y patata. ¡Deliciosa!
items.food.pasty.egg_desc=Un gran huevo de chocolate, envuelto en papel de aluminio amarillo de colores. Hay suficiente chocolate para saciarte, y el azúcar podría darle a tus artefactos un poquito de energía extra. ¡Felices Pascuas!
items.food.pasty.egg_name=el huevo de Pascua
items.food.pasty.fish_desc=Un pescado entero al vapor, conservado mágicamente sobre una cama de verduras. Es tradición guardar algo de pescado para más adelante en esta época del año, así que tendrás algunas sobras en lugar de comértelo todo de una vez. ¡Feliz Año Nuevo Lunar!
items.food.pasty.fish_name=pescado al vapor
items.food.pasty.name=pastoso
items.food.pasty.pie_desc=Una gran porción de pastel de calabaza. Su sabor dulce y especiado te llenará y te dará un poco de consuelo. ¡Feliz Halloween!
items.food.pasty.pie_name=pastel de calabaza
items.food.pasty.rainbow_desc=Esta colorida poción es una especie de alimento líquido. Además de saciar tu hambre, tiene un poco de magia que calmará a un enemigo cercano que no sea un jefe, haciendo que dude temporalmente en luchar contra ti.\n\n¡Feliz Orgullo!
items.food.pasty.rainbow_name=poción arcoíris
items.food.pasty.sparkling_desc=Esta poción burbujeante es una especie de alimento líquido. Sacia el hambre y simula el vino espumoso, pero en realidad no es alcohólica. La sensación cálida en tu estómago te brindará un poco de protección. ¡Feliz Año Nuevo!
items.food.pasty.sparkling_name=poción brillante
items.food.pasty.vanilla_desc=Esta gran rebanada de pastel de vainilla tiene chispas de colores y glaseado azul. El pastel fue hecho para celebrar años de experiencia, y te otorgará una pequeña cantidad de esa experiencia cuando lo comas.\n\nEl Pixel Dungeon original se lanzó por primera vez el 4 de diciembre de 2012. ¡Feliz cumpleaños Pixel Dungeon!
items.food.pasty.vanilla_name=pastel azul
items.food.phantommeat.desc=Un gran filete brillante y translúcido, cortado de una piraña fantasma. Esta carne mágica no necesita cocinarse y otorga numerosos beneficios defensivos, además de saciarte por completo. Al comerla, te otorga invisibilidad, piel de corteza, cierta capacidad de curación y cura muchos efectos nocivos.
items.food.phantommeat.discover_hint=Puedes obtener este objeto como botín de ciertos enemigos.
items.food.phantommeat.name=carne fantasma
items.food.smallration.desc=Tiene exactamente el mismo aspecto que una ración estándar de comida, pero es más pequeña.
items.food.smallration.discover_hint=Puedes comprar este artículo en una tienda.
items.food.smallration.eat_msg=La comida estaba bien.
items.food.smallration.name=pequeña ración de alimentos
items.food.stewedmeat.desc=Cocinar la carne a fuego lento la ha limpiado de cualquier enfermedad o parásito. Debería ser segura para el consumo.
items.food.stewedmeat.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.food.stewedmeat.eat_msg=La comida estaba bien.
items.food.stewedmeat.name=carne guisada
items.food.supplyration.desc=Esta ración fue dejada en la mazmorra por y para los miembros del gremio de ladrones. Está diseñada específicamente para ser consumida sobre la marcha y para ayudar con las artimañas generales.\n\nSi bien no te llena tanto como una ración normal, se puede comer rápidamente, proporciona un poco de curación directa y restaurará una carga a la capa de sombras del Pícaro.
items.food.supplyration.discover_hint=Puedes encontrar este objeto utilizando una habilidad específica del héroe.
items.food.supplyration.name=ración de suministro
items.gold.desc=Un montón de monedas de oro. Colecciona monedas de oro para gastarlas más tarde en una tienda.
items.gold.name=oro
items.heap.artifact=un artefacto
items.heap.chest=Pecho
items.heap.chest_desc=¡No sabrás lo que hay dentro hasta que lo abras!
items.heap.crystal_chest=cofre de cristal
items.heap.crystal_chest_desc=Puedes ver _%s_ dentro, pero para abrir el cofre necesitas una llave de cristal.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Cofre cerrado con llave
items.heap.locked_chest_desc=¡No sabrás lo que hay dentro hasta que lo abras! Pero para abrirlo necesitas una llave dorada.
items.heap.remains=Restos del héroe
items.heap.remains_desc=Esto es todo lo que queda de uno de tus predecesores. Quizás valga la pena revisar si hay algún objeto de valor.
items.heap.ring=un anillo
items.heap.skeleton=Restos óseos
items.heap.skeleton_desc=Esto es todo lo que queda de algún desafortunado aventurero. Quizás valga la pena revisar si hay algún objeto de valor.
items.heap.tomb=Tumba
items.heap.tomb_desc=Esta antigua tumba puede contener algo útil, pero su propietario seguramente se opondrá a que se revise.
items.heap.wand=una varita
items.honeypot$shatteredpot.desc=La olla se ha roto, solo la miel pegajosa que recubre sus paredes la mantiene unida, y se está desmoronando lentamente.\n\nA pesar de su estado roto, la abeja todavía parece querer proteger la olla.
items.honeypot$shatteredpot.name=olla de miel rota
items.honeypot.ac_shatter=ROMPER
items.honeypot.desc=Este enorme tarro de miel solo está revestido de miel, ¡en realidad alberga una abeja gigante! Este tipo de abejas enormes suelen permanecer en sus colmenas; ¿quizás el tarro sea una especie de jaula especial para atraparlas? La abeja parece bastante a gusto dentro del tarro con su miel y zumba con recelo cuando la miras.
items.honeypot.name=mielero
items.item.ac_drop=GOTA
items.item.ac_throw=TIRAR
items.item.curse=maldición
items.item.custom_note=Este artículo tiene una nota personalizada: "_%s_"
items.item.custom_note_type=Este tipo de artículo tiene una nota personalizada: "_%s_"
items.item.discover_hint=Puedes encontrar este objeto aleatoriamente en la mazmorra.
items.item.prompt=Elige la dirección del lanzamiento
items.item.rankings_desc=Asesinado por: %s
items.journal.alchemypage.desc=Una página arrancada de una guía de alquimia.\n\nLa mayor parte del texto es demasiado pequeño para leerlo a distancia, pero se puede distinguir el título de la página:\n\n_"%s"_
items.journal.alchemypage.name=página rota de un libro de alquimia
items.journal.documentpage.desc=Una página solitaria, probablemente arrancada de algún libro. Tendrás que cogerla para leerla.
items.journal.documentpage.name=página rota
items.journal.guidebook.desc=Una guía para aventureros, dejada aquí por alguien que decidió que la aventura no era lo suyo. Este libro en particular es mágico y puede hacer que los aventureros lean una página en el momento adecuado. A pesar de esa funcionalidad, el libro es más popular por las grandes palabras "¡Que no cunda el pánico!" escritas en letras grandes y amigables en la portada.
items.journal.guidebook.hint_desktop=¡Tu guía tiene consejos para ti! Selecciona el botón del diario parpadeante (%s) en la esquina superior derecha para leerlo.
items.journal.guidebook.hint_mobile=¡Tu guía tiene consejos para ti! Pulsa el botón del diario parpadeante en la esquina superior derecha para leerlos.
items.journal.guidebook.hint_status=Guía
items.journal.guidebook.name=tomo de maestría de mazmorras
items.journal.guidepage.desc=Una página arrancada de una guía de aventuras.\n\nLa mayor parte del texto es demasiado pequeño para leerlo a distancia, pero se puede distinguir el título de la página:\n\n_"%s"_
items.journal.guidepage.name=Página de guía rota
items.journal.regionlorepage$caves.desc=Lo que parece ser una anotación en el diario de a bordo de un explorador, se conserva sorprendentemente bien a pesar de su antigüedad. Tómalo para leerlo.
items.journal.regionlorepage$caves.name=entrada de registro antigua
items.journal.regionlorepage$city.desc=Una pequeña tablilla de metal oxidada con un mensaje grabado mágicamente. Las letras aún se ven claras a pesar de la antigüedad de la tablilla, pero tendrás que levantarla para leerlo.
items.journal.regionlorepage$city.name=tableta oxidada
items.journal.regionlorepage$halls.desc=Una pequeña tableta negra con letras verdes brillantes grabadas. A la distancia, las letras brillantes se difuminan en una neblina; tendrás que cogerla para leerla.
items.journal.regionlorepage$halls.name=tableta brillante
items.journal.regionlorepage$prison.desc=Una entrada de diario, o algún otro tipo de registro, escrita en un trozo de papel viejo. Parece que se ha conservado mejor que las cartas que encontraste en las alcantarillas, pero aun así tendrás que recogerla para leerla.
items.journal.regionlorepage$prison.name=Entrada de diario desgastada
items.journal.regionlorepage$sewers.desc=Lo que parece ser una carta, escrita en un trozo de papel manchado de tierra. Tendrás que cogerla para poder leer lo que pone.
items.journal.regionlorepage$sewers.name=letra desgastada
items.keys.crystalkey.desc=Las superficies talladas de esta llave cristalina brillan en la oscuridad. ¿Quizás abra algo hecho de cristal?
items.keys.crystalkey.name=Llave de cristal
items.keys.goldenkey.desc=Las muescas de esta llave dorada son diminutas y delicadas. ¿Quizás sirva para abrir un cofre cerrado con llave?
items.keys.goldenkey.name=llave dorada
items.keys.ironkey.desc=Las muescas de esta antigua llave de hierro están muy desgastadas; su cordón de cuero está maltrecho por el paso del tiempo. ¿Qué puerta podrá abrir?
items.keys.ironkey.name=llave de hierro
items.keys.skeletonkey.name=llave maestra
items.keys.wornkey.desc=Esta llave está desgastada y descolorida, pero parece seria. Probablemente pueda abrir alguna puerta importante que esté cerca.
items.keys.wornkey.name=llave desgastada
items.kindofmisc.unequip_message=Primero debes desequipar uno de estos objetos. Selecciona un objeto para intercambiar.
items.kindofmisc.unequip_title=Desequipa un objeto
items.kindofweapon.empty=vacío
items.kindofweapon.equip_cursed=Tu agarre se aprieta involuntariamente alrededor del arma.
items.kindofweapon.swift_equip=Rápidamente equipas tu arma.
items.kindofweapon.which_equip_msg=¿En qué ranura de arma te gustaría equipar este objeto?\n\nLa Campeona ataca directamente con su arma principal, pero puede usar la habilidad de cualquiera de las dos armas. Ambas armas comparten el mismo número de cargas.\n\nLa Campeona también puede intercambiar su arma principal y secundaria instantáneamente.
items.kindofweapon.which_equip_primary=Primario (%s)
items.kindofweapon.which_equip_secondary=Secundario (%s)
items.kingscrown.ac_wear=TENER PUESTO
items.kingscrown.desc=La corona del último rey enano, brilla con tremenda energía mágica.\n\nCuando se usa, la magia de la corona fluirá hacia la armadura que llevas puesta, transformándola en una _armadura épica única con habilidades especiales_.La nueva armadura conservará todas las propiedades de la armadura original.
items.kingscrown.discover_hint=Puedes obtener este objeto como botín de ciertos enemigos.
items.kingscrown.naked=Lamentablemente, la corona no puede transformar tu ropa interior.
items.kingscrown.name=Corona del Rey Enano
items.kingscrown.ratgraded=¡Las patas del Rey Rata brillan intensamente mientras tu armadura se transforma!
items.kingscrown.upgraded=¡La corona brilla intensamente y luego se desintegra a medida que tu armadura se transforma!
items.liquidmetal.ac_apply=APLICAR
items.liquidmetal.already_fixed=¡Esa arma arrojadiza ya está en perfectas condiciones!
items.liquidmetal.apply=Utilizas el metal líquido %d para reparar tu arma arrojadiza.
items.liquidmetal.desc=Este líquido mágico puede rellenar las grietas y desgarros de un arma arrojadiza, ¡restaurándola a su estado perfecto! Si a un conjunto de armas le falta un arma pero por lo demás está completamente reparado, ¡el metal líquido incluso se puede usar para reemplazar un arma faltante del conjunto!\n\nUn arma de nivel 1 requiere 10 de metal líquido para ser reparada por completo, un arma de nivel 5 requiere 30. Cada mejora también aumenta la cantidad de metal necesaria en un 35%.\n\nEl metal líquido no se puede usar para reparar las puntas de los dardos con punta.
items.liquidmetal.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.liquidmetal.name=metal líquido
items.liquidmetal.prompt=Selecciona un arma arrojadiza
items.lostbackpack.desc=Este es tu inventario perdido. ¡Recógelo para recuperar todos los objetos que perdiste!
items.lostbackpack.name=mochila perdida
items.merchantsbeacon.ac_use=USAR
items.merchantsbeacon.desc=Esta extraña pieza de tecnología enana te permite comunicarte a grandes distancias.\n\nDespués de ser activada, esta baliza te permitirá vender artículos a Pixel Mart desde cualquier lugar de la mazmorra.\n\nSin embargo, la magia dentro de la baliza solo durará una sesión, así que úsala sabiamente.
items.merchantsbeacon.name=faro del comerciante
items.potions.brews.aquabrew.desc=Al romperse, esta poción libera un chorro de agua a presión en el lugar donde se encuentra. Su fuerza es suficiente solo para dañar a los enemigos en llamas, pero también esparce agua por el terreno cercano, desactiva trampas, apaga incendios y repele a los personajes que se encuentren cerca del punto de impacto.
items.potions.brews.aquabrew.name=infusión de agua
items.potions.brews.blizzardbrew.desc=Al romperse, esta bebida desatará una ventisca arremolinada que se propaga rápidamente como un gas.
items.potions.brews.blizzardbrew.name=cerveza de ventisca
items.potions.brews.brew.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.potions.brews.causticbrew.desc=Esta sustancia corrosiva se extenderá por una amplia zona alrededor del lugar donde se rompa. Todo lo que quede atrapado por la sustancia se derretirá lentamente si no se puede lavar con agua.
items.potions.brews.causticbrew.name=cerveza cáustica
items.potions.brews.infernalbrew.desc=Al romperse, esta bebida desatará un infierno voraz que se propagará rápidamente como un gas.
items.potions.brews.infernalbrew.name=brebaje infernal
items.potions.brews.shockingbrew.desc=Cuando se rompe, esta poción desata una tormenta eléctrica en una amplia zona alrededor del lugar donde se produce la rotura.
items.potions.brews.shockingbrew.name=una mezcla impactante
items.potions.brews.unstablebrew.desc=Esta poción mágica brilla con colores cambiantes del arcoíris.\n\nAl beberla o arrojarla, activará el efecto de una poción aleatoria. El efecto de la poción siempre será beneficioso si se bebe y siempre será perjudicial si se arroja.
items.potions.brews.unstablebrew.name=cerveza inestable
items.potions.elixirs.elixir.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Has obtenido temporalmente propiedades restauradoras similares a las de Goo.\n\nMientras estés en el agua, recuperarás una pequeña cantidad de salud por turno. El efecto se pausa cuando tengas la salud al máximo o salgas del agua.\n\nCuración restante: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=sanación acuática
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Este elixir contiene los restos de Goo mejorados con una poción curativa. Si bien no proporciona curación inmediata, restaurará gradualmente una mayor cantidad de salud mientras estés en el agua.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir de rejuvenecimiento acuático
items.potions.elixirs.elixirofarcanearmor.desc=Este elixir otorgará a quien lo beba una resistencia duradera al daño mágico.
items.potions.elixirs.elixirofarcanearmor.name=elixir de armadura arcana
items.potions.elixirs.elixirofdragonsblood.desc=Al consumirlo, este elixir infundirá un poder ígneo en las venas de quien lo beba. Este efecto lo hará inmune al fuego y le permitirá prender fuego a sus enemigos con ataques físicos.
items.potions.elixirs.elixirofdragonsblood.name=elixir de sangre de dragón
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Estás bajo los efectos de un elixir de caída de pluma, ¡lo que te permite caer en abismos sin sufrir daño!\n\nTurnos restantes: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=caída de plumas
items.potions.elixirs.elixiroffeatherfall.desc=Este elixir ofrece un efecto de levitación más débil pero más controlado, lo que permite a quien lo bebe caer desde grandes alturas sin sufrir daño durante un breve periodo de tiempo.
items.potions.elixirs.elixiroffeatherfall.light=¡Te sientes ligero como una pluma!
items.potions.elixirs.elixiroffeatherfall.name=elixir de caída de plumas
items.potions.elixirs.elixirofhoneyedhealing.desc=Este elixir combina la curación con la dulzura de la miel. Al beberlo, tendrá el mismo efecto que una poción curativa y saciará un poco el hambre, pero también se puede lanzar para curar a un aliado.\n\nLas criaturas con afinidad por la miel podrían apaciguarse si se usa este objeto en ellas.
items.potions.elixirs.elixirofhoneyedhealing.name=elixir de curación dulce como la miel
items.potions.elixirs.elixiroficytouch.desc=Al consumir este elixir, quien lo beba podrá absorber el calor de los enemigos a los que ataque. Este efecto lo hará inmune al frío y le permitirá congelar a sus enemigos con ataques físicos.
items.potions.elixirs.elixiroficytouch.name=elixir de toque helado
items.potions.elixirs.elixirofmight$htboost.desc=Tu cuerpo se siente anormalmente fuerte y saludable.\n\nTu salud máxima se ve potenciada durante un período prolongado. A medida que subas de nivel, la potenciación se desvanecerá gradualmente.\n\nCantidad de potenciación actual: %d.\nNiveles restantes: %d.
items.potions.elixirs.elixirofmight$htboost.name=aumento máximo de salud
items.potions.elixirs.elixirofmight.desc=Este potente líquido recorrerá tus músculos, aumentando permanentemente tu fuerza en un punto y aumentando temporalmente tu salud máxima en %d puntos. El aumento de salud se ajusta a tu salud máxima, pero disminuirá gradualmente a medida que subas de nivel.
items.potions.elixirs.elixirofmight.msg=Una fuerza renovada recorre tu cuerpo, ¡ahora tienes la fuerza %d!
items.potions.elixirs.elixirofmight.name=elixir de poder
items.potions.elixirs.elixiroftoxicessence.desc=Al consumirlo, este elixir imbuirá a quien lo beba de energía tóxica. Quien lo beba esparcirá continuamente gas tóxico a su paso y será inmune al gas tóxico y al veneno durante un tiempo ligeramente superior a la duración del efecto.
items.potions.elixirs.elixiroftoxicessence.name=elixir de esencia tóxica
items.potions.exotic.exoticpotion.amber=poción de ámbar exótico
items.potions.exotic.exoticpotion.azure=poción azul exótica
items.potions.exotic.exoticpotion.bistre=poción de bistre exótico
items.potions.exotic.exoticpotion.charcoal=poción exótica de carbón
items.potions.exotic.exoticpotion.crimson=poción carmesí exótica
items.potions.exotic.exoticpotion.discover_hint=Puedes fabricar este objeto mediante alquimia.
items.potions.exotic.exoticpotion.golden=poción dorada exótica
items.potions.exotic.exoticpotion.indigo=poción índigo exótica
items.potions.exotic.exoticpotion.ivory=poción de marfil exótico
items.potions.exotic.exoticpotion.jade=poción de jade exótico
items.potions.exotic.exoticpotion.magenta=poción magenta exótica
items.potions.exotic.exoticpotion.no=No, cambié de opinión.
items.potions.exotic.exoticpotion.silver=poción exótica de plata
items.potions.exotic.exoticpotion.turquoise=poción turquesa exótica
items.potions.exotic.exoticpotion.unknown_desc=Este frasco redondo contiene un líquido granulado y colorido. Parece ser un lugar extraño; ¿quién sabe qué podría ocurrir si se bebe o se arroja?
items.potions.exotic.exoticpotion.warning=¿De verdad quieres cancelar el uso de esta poción? Se consumirá de todas formas.
items.potions.exotic.exoticpotion.yes=Sí, soy positivo.
items.potions.exotic.potionofcleansing$cleanse.desc=¡Este personaje es temporalmente inmune a todos los efectos de estado dañinos!\n\nTurnos restantes: %s.
items.potions.exotic.potionofcleansing$cleanse.name=purificado
items.potions.exotic.potionofcleansing.desc=Este potente reactivo hará que quien lo beba sea inmune a todos los efectos de estado nocivos durante unos turnos. También se puede lanzar a un objetivo para curarlo.
items.potions.exotic.potionofcleansing.name=poción de limpieza
items.potions.exotic.potionofcorrosivegas.desc=Al abrir o romper este vidrio a presión, su contenido explotará en una nube mortal de gas corrosivo de color óxido. Este gas se propaga más rápidamente que los gases tóxicos y es más letal, pero su efecto es menos duradero.
items.potions.exotic.potionofcorrosivegas.name=poción de gas corrosivo
items.potions.exotic.potionofdivineinspiration.bonus=¡+2 puntos de talento!
items.potions.exotic.potionofdivineinspiration.desc=El poder de la energía sagrada reducido a forma líquida, este brebaje imbuirá al bebedor con poder divino, otorgándole dos puntos de talento adicionales en un nivel de su elección.\n\nEsta poción solo se puede usar una vez por cada nivel de talento.
items.potions.exotic.potionofdivineinspiration.name=poción de inspiración divina
items.potions.exotic.potionofdivineinspiration.no_more_points=No puedes obtener más puntos de talento adicionales.
items.potions.exotic.potionofdivineinspiration.select_tier=Selecciona un nivel de talento para obtener dos puntos extra. Debes haber desbloqueado el nivel para poder usar los puntos.
items.potions.exotic.potionofdragonsbreath.desc=Este frasco contiene un compuesto inusual que se incendia al poco tiempo de mezclarse con la saliva. ¡Escupir rápidamente el líquido permitirá al usuario lanzar llamas por la boca!
items.potions.exotic.potionofdragonsbreath.name=poción de aliento de dragón
items.potions.exotic.potionofdragonsbreath.prompt=Elige un lugar para quemar
items.potions.exotic.potionofearthenarmor.desc=En lugar de paralizar, este líquido tiene un efecto endurecedor sobre la piel, convirtiéndola en una armadura natural temporal.
items.potions.exotic.potionofearthenarmor.name=poción de armadura de tierra
items.potions.exotic.potionofmagicalsight.desc=Tras beber esto, tus sentidos se agudizarán brevemente hasta niveles increíbles, ¡permitiéndote ver a través de las paredes en un radio de 12 casillas!
items.potions.exotic.potionofmagicalsight.name=poción de visión mágica
items.potions.exotic.potionofmastery.armor_easier=¡Tu armadura se vuelve más fácil de usar!
items.potions.exotic.potionofmastery.desc=En lugar de otorgar fuerza bruta, esta poción afinará los músculos del usuario a un objeto específico. Esto facilitará el uso de dicho objeto, como si quien la bebió hubiera practicado con él y desarrollado memoria muscular. El arma o armadura elegida requerirá 2 puntos menos de fuerza para su uso. Esta poción solo puede usarse una vez por objeto.
items.potions.exotic.potionofmastery.name=poción de maestría
items.potions.exotic.potionofmastery.prompt=Dominar un objeto
items.potions.exotic.potionofmastery.weapon_easier=¡Tu arma se vuelve más fácil de manejar!
items.potions.exotic.potionofshielding.desc=En lugar de curar, esta poción proyectará un escudo resistente alrededor del cuerpo del usuario, bloqueando una cantidad considerable de daño.
items.potions.exotic.potionofshielding.name=poción de protección
items.potions.exotic.potionofshroudingfog.desc=Al exponerse al aire, el líquido de este frasco producirá una espesa niebla humeante que se extenderá rápidamente y bloqueará la visión de tus enemigos.
items.potions.exotic.potionofshroudingfog.name=poción de niebla envolvente
items.potions.exotic.potionofsnapfreeze.desc=La sustancia química contenida en esta poción reaccionará rápidamente con el aire, congelando y enraizando instantáneamente todo lo que se encuentre dentro de su área de efecto.
items.potions.exotic.potionofsnapfreeze.name=poción de congelación instantánea
items.potions.exotic.potionofstamina.desc=Beber este líquido de dulzor peculiar te proporcionará un impulso de energía duradero, lo que te permitirá correr a un ritmo más rápido durante un período de tiempo prolongado.
items.potions.exotic.potionofstamina.name=poción de resistencia
items.potions.exotic.potionofstormclouds.desc=Lanzar esta poción creará una nube de vapor concentrado que se extenderá rápidamente, se condensará y se derramará sobre el entorno. La mayor parte del terreno se convertirá en agua, los enemigos de fuego sufrirán daño, el fuego se extinguirá y las trampas se desactivarán y se romperán.
items.potions.exotic.potionofstormclouds.name=poción de nubes de tormenta
items.potions.potion$placeholder.name=poción
items.potions.potion$seedtopotion.name=Poción aleatoria
items.potions.potion.ac_drink=BEBER
items.potions.potion.amber=poción de ámbar
items.potions.potion.azure=poción azul
items.potions.potion.beneficial=Poción beneficiosa
items.potions.potion.bistre=poción de bistre
items.potions.potion.charcoal=poción de carbón
items.potions.potion.crimson=poción carmesí
items.potions.potion.discover_hint=Puedes encontrar este objeto al azar en la mazmorra o fabricarlo mediante alquimia.
items.potions.potion.golden=poción dorada
items.potions.potion.harmful=¡Poción dañina!
items.potions.potion.indigo=poción índigo
items.potions.potion.ivory=poción de marfil
items.potions.potion.jade=poción de jade
items.potions.potion.magenta=poción magenta
items.potions.potion.no=No, cambié de opinión.
items.potions.potion.shatter=El frasco se rompe y el líquido salpica sin causar daño.
items.potions.potion.silver=poción de plata
items.potions.potion.sure_drink=¿Estás seguro de que quieres beberla? En la mayoría de los casos, deberías arrojar esas pociones a tus enemigos.
items.potions.potion.sure_throw=¿Estás seguro de que quieres tirarlo? En la mayoría de los casos, lo mejor es bebérselo.
items.potions.potion.turquoise=poción turquesa
items.potions.potion.unknown_desc=En este frasco se arremolina un líquido %s. ¿Quién sabe qué hará al beberlo o lanzarlo?
items.potions.potion.yes=Sí, sé lo que estoy haciendo.
items.potions.potionofexperience.desc=Esta poción, que condensa las legendarias experiencias de multitud de batallas en forma líquida, elevará instantáneamente tu nivel de experiencia.
items.potions.potionofexperience.name=poción de experiencia
items.potions.potionoffrost.desc=Al entrar en contacto con el aire, este producto se evapora formando una nube helada. Toda criatura que la toque quedará congelada en el sitio, sin poder moverse ni actuar.
items.potions.potionoffrost.name=poción de escarcha
items.potions.potionofhaste.desc=Beber este líquido de dulzor peculiar te infundirá una energía tremenda durante un corto tiempo, lo que te permitirá correr a gran velocidad.
items.potions.potionofhaste.energetic=¡Te sientes lleno de energía!
items.potions.potionofhaste.name=poción de prisa
items.potions.potionofhealing.desc=Un elixir que restaura al instante toda tu salud y cura el envenenamiento.
items.potions.potionofhealing.heal=Tus heridas comienzan a cicatrizar.
items.potions.potionofhealing.name=poción curativa
items.potions.potionofinvisibility.desc=Beber esta poción te vuelve temporalmente invisible para tus enemigos. Atacar, o usar una varita o un pergamino ante sus ojos, disipa el efecto.
items.potions.potionofinvisibility.invisible=¡Ves cómo tus manos se vuelven invisibles!
items.potions.potionofinvisibility.name=poción de invisibilidad
items.potions.potionoflevitation.desc=Este curioso líquido te permite flotar y pasar sobre las trampas sin esfuerzo. Sin embargo, las llamas y los gases también ocupan el aire y no pueden evitarse volando.
items.potions.potionoflevitation.float=¡Flotas en el aire!
items.potions.potionoflevitation.name=poción de levitación
items.potions.potionofliquidflame.desc=Este frasco contiene un compuesto inestable que se incendiará violentamente al exponerse al aire libre.
items.potions.potionofliquidflame.name=poción de llama líquida
items.potions.potionofmindvision.desc=Tras beber esta poción, tu mente se sintonizará con la señal psíquica de criaturas distantes, lo que te permitirá percibir presencias biológicas a través de las paredes. Además, te permitirá ver a través de las paredes y puertas cercanas.
items.potions.potionofmindvision.name=poción de visión mental
items.potions.potionofmindvision.see_mobs=¡De alguna manera puedes sentir la presencia de las mentes de otras criaturas!
items.potions.potionofmindvision.see_none=De alguna manera, puedes darte cuenta de que estás solo en este nivel en este momento.
items.potions.potionofparalyticgas.desc=Al exponerse al aire libre, el líquido de este frasco se vaporizará formando una neblina amarilla paralizante. Quien inhale la nube quedará paralizado al instante, sin poder moverse durante un tiempo después de que se disipe. Este objeto puede lanzarse contra enemigos lejanos para alcanzarlos dentro del alcance del gas.
items.potions.potionofparalyticgas.name=poción de gas paralizante
items.potions.potionofpurity.desc=Este reactivo neutraliza rápidamente todos los gases nocivos de la zona afectada. Beberlo te concede inmunidad temporal a esos gases.
items.potions.potionofpurity.freshness=Se percibe una frescura inusual en el aire.
items.potions.potionofpurity.name=Poción de purificación
items.potions.potionofpurity.protected=¡Una película protectora te envuelve!
items.potions.potionofstrength.desc=Este potente líquido recorrerá tus músculos, aumentando permanentemente tu fuerza en un punto.
items.potions.potionofstrength.msg=Una fuerza renovada recorre tu cuerpo, ¡ahora tienes la fuerza %d!
items.potions.potionofstrength.name=poción de fuerza
items.potions.potionoftoxicgas.desc=Al abrir o romper este frasco a presión, su contenido explotará en una nube letal de gas verde tóxico. Quizás prefieras lanzar esta poción a enemigos lejanos en lugar de abrirla manualmente.
items.potions.potionoftoxicgas.name=poción de gas tóxico
items.quest.ceremonialcandle.desc=Un conjunto de velas, derretidas y fusionadas por el uso.\n\nPor sí solas no valen nada, pero usadas con otras velas en un patrón, pueden concentrar la energía para un ritual de invocación.
items.quest.ceremonialcandle.discover_hint=Puedes encontrar este objeto durante una misión específica.
items.quest.ceremonialcandle.name=vela ceremonial
items.quest.corpsedust.chill=Un escalofrío te recorre la espalda.
items.quest.corpsedust.desc=La bola de polvo cadavérico no se diferencia externamente de una bola de polvo común. Pero se puede sentir una energía malévola acechando en su interior.\n\nDeshacerse de ella lo antes posible sería una buena idea.
items.quest.corpsedust.discover_hint=Puedes encontrar este objeto durante una misión específica.
items.quest.corpsedust.name=polvo de cadáver
items.quest.darkgold.desc=Este metal se llama oscuro no por su color (no se diferencia del oro normal), sino porque se derrite con la luz del día, lo que lo hace inservible en la superficie.
items.quest.darkgold.discover_hint=Puedes encontrar este objeto durante una misión específica.
items.quest.darkgold.name=mineral de oro oscuro
items.quest.darkgold.you_now_have=Ahora tienes el mineral de oro oscuro %d.
items.quest.dwarftoken.desc=Muchos enanos y algunas de sus creaciones más grandes llevan consigo estas pequeñas piezas de metal de propósito desconocido. Quizás sean joyas o tal vez algún tipo de identificación. Los enanos son gente extraña.
items.quest.dwarftoken.discover_hint=Puedes encontrar este objeto durante una misión específica.
items.quest.dwarftoken.name=ficha de enano
items.quest.embers.desc=Brasas especiales que solo se pueden obtener de elementales de fuego jóvenes. Irradian energía térmica.
items.quest.embers.discover_hint=Puedes encontrar este objeto durante una misión específica.
items.quest.embers.name=brasas elementales
items.quest.escapecrystal.ac_use=USAR
items.quest.escapecrystal.desc=Un delgado cristal mágico que parece contener magia de teletransportación. Puedes usar el cristal en cualquier momento para salir de la bóveda enana, ¡pero no podrás llevarte nada contigo!
items.quest.escapecrystal.discover_hint=Puedes encontrar este objeto durante una misión específica.
items.quest.escapecrystal.name=cristal de escape
items.quest.gooblob.desc=Una masa gelatinosa y temblorosa, separada de Goo al morir. Es casi como una gran bola de gelatina, aunque no te atreverías a comértela.\n\nNo hace nada por sí sola, pero podría ser útil combinada con ciertas pociones o una bomba. Como mínimo, debería convertirse en una cantidad decente de energía.
items.quest.gooblob.discover_hint=Puedes obtener este objeto como botín de ciertos enemigos.
items.quest.gooblob.name=masa pegajosa
items.quest.metalshard.desc=Un fragmento de metal oxidado y maldito, que se desprendió del DM-300 al ser destruido. Puedes sentir una magia maligna inactiva en su interior. No hace nada por sí solo, pero podría ser útil combinado con ciertos pergaminos o una bomba. Como mínimo, debería convertirse en una cantidad decente de energía.
items.quest.metalshard.discover_hint=Puedes obtener este objeto como botín de ciertos enemigos.
items.quest.metalshard.name=fragmento de metal maldito
items.quest.pickaxe.ability_desc=El Duelista puede _atravesar_ a un enemigo con un pico. Esto garantiza el impacto, aplica vulnerabilidad durante 3 turnos y causa _%1$d-%2$d de daño_ a los enemigos con piel rígida.
items.quest.pickaxe.ability_name=atravesar
items.quest.pickaxe.desc=Esta es una herramienta robusta y pesada para romper rocas. No necesitas equipar el pico para minar con ella, pero probablemente puedas usarla como arma en caso de necesidad.
items.quest.pickaxe.discover_hint=Puedes encontrar este objeto durante una misión específica.
items.quest.pickaxe.name=piqueta
items.quest.pickaxe.upgrade_ability_stat_name=Daño de habilidad
items.quest.ratskull.desc=Un cráneo de rata sorprendentemente grande. Sería un magnífico trofeo de caza, si tuvieras una pared donde colgarlo.
items.quest.ratskull.name=cráneo de rata gigante
items.remains.bowfragment.desc=Este fragmento de madera roto perteneció al arco espiritual de una Cazadora perdida. Aún se percibe una pizca de energía natural en el fragmento; puedes usarlo para hacer crecer hierba alta a tu alrededor. Sin embargo, al hacerlo, el fragmento se destruirá.
items.remains.bowfragment.name=fragmento de arco
items.remains.brokenhilt.desc=Esta empuñadura rota parece pertenecer al arma de un duelista derrotado. Aún conserva algo de poder marcial; puedes usarla para infligir daño adicional en tus próximos dos golpes cuerpo a cuerpo. Sin embargo, al hacerlo, la empuñadura quedará destruida.
items.remains.brokenhilt.name=empuñadura rota
items.remains.brokenstaff.desc=Este bastón de mago se partió por la mitad tras la muerte de su dueño. Aún se percibe algo de energía mágica en él; puedes usarlo para potenciar tus varitas. Sin embargo, al hacerlo, el bastón quedará destruido.
items.remains.brokenstaff.name=personal roto
items.remains.cloakscrap.desc=Este retazo de tela translúcida parece provenir de la capa de sombras de un pícaro fallecido. Aún se percibe un poco de energía mística en él; puedes usarlo para potenciar la carga de tus artefactos. Sin embargo, al hacerlo, la tela se destruirá.
items.remains.cloakscrap.name=trozo de tela
items.remains.remainsitem.ac_use=USAR
items.remains.remainsitem.discover_hint=Puedes encontrar este objeto entre los restos de un héroe específico de una partida perdida anterior.
items.remains.sealshard.desc=Estos diminutos fragmentos de cera roja parecen provenir del sello de un guerrero caído. Aún se percibe un atisbo de fuerza de voluntad aferrada al sello, que puedes usar para protegerte. Sin embargo, al hacerlo, los fragmentos se destruirán.
items.remains.sealshard.name=fragmentos de sello
items.remains.tornpage.desc=Esta página parece arrancada de un tomo sagrado de clérigo caducado. Aún conserva un poco de energía divina; puedes usarla para recuperar algo de salud. Sin embargo, al hacerlo, la página se destruirá.
items.remains.tornpage.name=página rota
items.rings.ring.agate=anillo de ágata
items.rings.ring.amethyst=anillo de amatista
items.rings.ring.curse_known=Se puede sentir una magia maligna acechando dentro de este anillo.
items.rings.ring.cursed_worn=Debido a que este anillo está maldito, no tienes poder para quitártelo.
items.rings.ring.diamond=anillo de diamantes
items.rings.ring.emerald=anillo de esmeralda
items.rings.ring.equip_cursed=¡El anillo se aprieta dolorosamente alrededor del dedo!
