items.wands.wandofwarding.bmage_desc=Cuando _el Mago de Batalla_ golpea a un enemigo con un bastón de protección, todos los guardianes y centinelas activos tienen la posibilidad de ser curados.
items.wands.wandofwarding.desc=Esta varita corta de metal tiene una gema de color púrpura brillante flotando sobre su punta.
items.wands.wandofwarding.eleblast_desc=Una explosión elemental con un bastón de protección cura todas las protecciones y centinelas en el área de la explosión.
items.wands.wandofwarding.name=varita de protección
items.wands.wandofwarding.no_more_wards=Tu varita no puede mantener más protecciones.
items.wands.wandofwarding.staff_name=personal de sala
items.wands.wandofwarding.stats_desc=En lugar de dañar directamente a un enemigo, esta varita invoca guardianes y centinelas estáticos. Los guardianes se pueden invocar en cualquier lugar, incluso a través de las paredes si tienes visión. Esta varita puede mantener guardianes con una energía equivalente a _%d_ a la vez.
