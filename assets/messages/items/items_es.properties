items.weapon.melee.sword$cleavetracker.desc=La Duelista está lista para continuar con su anterior tajo. El siguiente uso de tajo no costará ninguna carga de habilidad de arma.\n\nTurnos restantes: %s.
items.weapon.melee.sword$cleavetracker.name=adherirse
items.weapon.melee.sword.ability_desc=El Duelista puede _golpear_ a un enemigo con una espada. Esto inflige _%1$d-%2$d de daño_ y tiene un impacto garantizado. Si el golpe mata a un enemigo, es instantáneo y el Duelista puede usar el golpe nuevamente dentro de 5 turnos sin costo alguno.
items.weapon.melee.sword.ability_name=adherirse
items.weapon.melee.sword.desc=Una espada bien equilibrada. No es demasiado grande, pero sí notablemente más larga que una espada corta.
