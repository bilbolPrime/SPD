items.weapon.spiritbow.ac_shoot=DISPARAR
items.weapon.spiritbow.desc=Un arco hecho de madera mágica ancestral. La cuerda y los grabados del arco resplandecen con una luz azul pálida. Al tensar la cuerda, este arco conjurará una flecha mágica que puede dispararse contra un enemigo.
