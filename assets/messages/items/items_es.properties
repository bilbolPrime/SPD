items.waterskin.full=¡Tu odre está lleno!
items.waterskin.name=odre de agua
items.weapon.curses.annoying.desc=Las armas molestas pueden hablar, pero son demasiado enérgicas. A menudo llamarán la atención sobre ti sin quererlo.
items.weapon.curses.annoying.elestrike_desc=Un ataque elemental con una maldición molesta tiene un 20% de probabilidad de enloquecer a cada enemigo dentro del alcance durante 6 turnos.
items.weapon.curses.annoying.msg_1=¡OH, ¿ESTAMOS PELEANDO CONTRA ALGO?!
items.weapon.curses.annoying.msg_10=¡BIEN HECHO!
items.weapon.curses.annoying.msg_11=No quería ser un arma, quería ser el hacha de un leñador.
items.weapon.curses.annoying.msg_12=Recuerda, el exceso de confianza es un asesino lento e insidioso.
items.weapon.curses.annoying.msg_13=¡TODAS SUS BASES NOS PERTENECEN!
items.weapon.curses.annoying.msg_2=¡SÍ, CONSIGUELOS!
items.weapon.curses.annoying.msg_3=¡OYE, ESCUCHA!
items.weapon.curses.annoying.msg_4=¿YA HEMOS LLEGADO AL JEFE?
items.weapon.curses.annoying.msg_5=¡AY, NO ME GOLPEES TAN FUERTE!
items.weapon.curses.annoying.msg_6=¡MUERE, INSECTO!
items.weapon.curses.annoying.msg_7=¡WEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=¿PODEMOS TOMAR UN DESCANSO?
items.weapon.curses.annoying.msg_9=¡POW, JAJA!
