items.rings.ringofarcana.combined_stats=Tus anillos equipados están combinando su poder, aumentando el poder de los encantamientos y glifos en _%s%%_ en total.
items.rings.ringofarcana.desc=Este anillo potencia los encantamientos mágicos en armas y los glifos en armaduras, ¡incluidas las maldiciones! Primero aumenta la probabilidad de activación y luego incrementa la fuerza del efecto una vez que la probabilidad de activación alcanza el 100%. Un anillo maldito, en cambio, debilitará los encantamientos, los glifos y las maldiciones.
items.rings.ringofarcana.name=anillo de arcanos
items.rings.ringofarcana.stats=Al usarlo, este anillo aumentará el poder de los encantamientos y glifos en _%s%%._
items.rings.ringofarcana.typical_stats=Cuando se usa, este anillo generalmente aumenta el poder de los encantamientos y glifos en _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Impulso de Arcanos
items.rings.ringofelements.combined_stats=Tus anillos equipados están combinando su poder, proporcionando _%s%%_ resistencia elemental total.
items.rings.ringofelements.desc=Este anillo proporciona resistencia a distintos elementos, como el fuego, la electricidad y los gases. También reduce la duración de los efectos negativos.
items.rings.ringofelements.name=anillo de elementos
items.rings.ringofelements.stats=Cuando se usa, este anillo proporciona resistencia elemental _%s%%_.
items.rings.ringofelements.typical_stats=Cuando se usa, este anillo normalmente proporcionará _%s%%_ resistencia elemental.
items.rings.ringofelements.upgrade_stat_name_1=Resistencia
items.rings.ringofenergy.combined_stats=Tus anillos equipados están combinando su poder, aumentando la velocidad de carga en _%s%%_ en total.
items.rings.ringofenergy.desc=Tu equipo mágico se recargará más rápidamente en el campo arcano que emana de este anillo. Un anillo maldito, en cambio, ralentizará la recarga.
items.rings.ringofenergy.name=anillo de energía
items.rings.ringofenergy.stats=Cuando se usa, este anillo aumenta la velocidad de carga de varitas, artefactos y armaduras heroicas en _%s%%._
items.rings.ringofenergy.typical_stats=Cuando se usa, este anillo generalmente aumenta la velocidad de carga de varitas, artefactos y armaduras heroicas en _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Impulso de carga
items.rings.ringofevasion.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu evasión en _%s%%_ en total.
items.rings.ringofevasion.desc=Este anillo aumenta tus probabilidades de esquivar los ataques enemigos.
items.rings.ringofevasion.name=anillo de evasión
items.rings.ringofevasion.stats=Cuando se usa, este anillo aumentará tu evasión en _%s%%._
items.rings.ringofevasion.typical_stats=Cuando se usa, este anillo generalmente aumenta tu evasión en _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Impulso de evasión
items.rings.ringofforce$brawlersstance.desc=Mientras esté en esta postura, los ataques regulares de la Duelista usarán un anillo de fuerza equipado incluso cuando tenga un arma equipada. Estos ataques obtienen daño adicional y seguirán usando el aumento y el encantamiento del arma.\n\nMantener esta postura requiere concentración, sin embargo, reduce la velocidad de recarga de la habilidad del arma en un 50%.\n\nEsta postura se puede activar o desactivar usando un anillo de fuerza, pero la reducción en la velocidad de carga persistirá por un tiempo si la postura se activa y desactiva rápidamente.
items.rings.ringofforce$brawlersstance.name=postura del luchador
items.rings.ringofforce.ability_desc=Con este anillo, la Duelista puede adoptar una postura de luchadora, lo que provoca que sus ataques normales siempre utilicen este anillo, incluso con un arma equipada. Estos ataques infligirán un daño de %1$d-%2$d y heredarán el encantamiento y la mejora del arma. Esta postura reduce la velocidad de recarga del arma en 50%%.
items.rings.ringofforce.ability_name=postura del luchador
items.rings.ringofforce.combined_stats=Tus anillos equipados están combinando su poder, infligiendo un daño total de _%1$d-%2$d_ sin un arma, o aumentando el daño en _%3$d_ con una.
items.rings.ringofforce.desc=Este anillo potencia la fuerza de los golpes cuerpo a cuerpo de quien lo lleva. Este poder adicional es bastante débil al usar armas, pero un ataque sin armas se vuelve mucho más poderoso. Un anillo maldito, en cambio, debilitará los golpes de quien lo lleve.
items.rings.ringofforce.name=anillo de fuerza
items.rings.ringofforce.stats=Cuando no estés armado, con tu fuerza actual, este anillo infligirá _%1$d-%2$d de daño._ Con un arma equipada, este anillo aumentará el daño en _%3$d._
items.rings.ringofforce.typical_ability_desc=Con este anillo, la Duelista puede adoptar una postura de luchadora, lo que provoca que sus ataques normales siempre utilicen este anillo, incluso con un arma equipada. Estos ataques suelen infligir entre %1$d y %2$d de daño y heredan el encantamiento y la mejora del arma. Esta postura reduce la velocidad de recarga del arma en 50%%.
items.rings.ringofforce.typical_stats=Cuando estás desarmado, con tu fuerza actual, este anillo normalmente infligirá _%1$d-%2$d de daño._ Con un arma equipada, este anillo normalmente aumentará el daño en _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Daños no causados por armas
items.rings.ringofforce.upgrade_stat_name_2=Aumento de daño armado
items.rings.ringofforce.upgrade_stat_name_3=Daño de habilidad
items.rings.ringoffuror.combined_stats=Tus anillos equipados están combinando su poder, aumentando la velocidad de tus ataques en _%s%%_ en total.
items.rings.ringoffuror.desc=Este anillo otorga a quien lo lleva una furia interior que le permite atacar con mayor rapidez. Un anillo maldito, en cambio, ralentizará la velocidad de ataque de quien lo porta.
items.rings.ringoffuror.name=anillo de furia
items.rings.ringoffuror.stats=Cuando lo uses, este anillo aumentará la velocidad de tus ataques en _%s%%._
items.rings.ringoffuror.typical_stats=Cuando se usa, este anillo generalmente aumenta la velocidad de tus ataques en _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Aumento de velocidad de ataque
items.rings.ringofhaste.combined_stats=Tus anillos equipados están combinando su poder, aumentando tu velocidad de movimiento en _%s%%_ en total.
items.rings.ringofhaste.desc=Este anillo acelera el paso del tiempo para quien lo lleva, permitiéndole realizar todas sus acciones un poco más rápido.
items.rings.ringofhaste.name=anillo de prisa
items.rings.ringofhaste.stats=Cuando lo uses, este anillo aumentará tu velocidad de movimiento en _%s%%._
