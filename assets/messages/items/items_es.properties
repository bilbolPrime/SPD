items.artifacts.driedrose.charged=¡Tu rosa está completamente cargada!
items.artifacts.driedrose.cursed=No puedes usar una rosa maldita.
items.artifacts.driedrose.desc=¿Es esta la rosa que mencionó el fantasma antes de desaparecer? Parece poseer cierto poder espiritual; tal vez pueda usarse para canalizar la energía de aquel guerrero perdido.
items.artifacts.driedrose.desc_armor=Armadura de Ghost: %s
items.artifacts.driedrose.desc_cursed=La rosa maldita está atada a tu mano, y se siente extrañamente fría.
items.artifacts.driedrose.desc_hint=Parece que le faltan algunos pétalos. Quizás al volver a colocarlos la rosa se fortalezca.
items.artifacts.driedrose.desc_no_quest=Una rosa seca y vieja que de alguna manera todavía se mantiene intacta a pesar de su edad.\n\nParece tener algún poder espiritual, pero no tienes idea de cómo usarlo ahora mismo.
items.artifacts.driedrose.desc_strength=Fuerza de Ghost: %s
items.artifacts.driedrose.desc_weapon=Arma de Ghost: %s
items.artifacts.driedrose.name=rosa seca
items.artifacts.driedrose.no_charge=Tu rosa aún no está completamente cargada.
items.artifacts.driedrose.no_space=No hay espacio libre cerca de ti.
items.artifacts.driedrose.spawned=Ya has invocado al fantasma.
items.artifacts.etherealchains$chainsrecharge.levelup=¡Tus cadenas se hacen más fuertes!
items.artifacts.etherealchains.ac_cast=ELENCO
items.artifacts.etherealchains.cant_pull=Tus cadenas no pueden arrastrar ese objetivo.
items.artifacts.etherealchains.cant_reach=Tus cadenas no pueden llegar hasta allí.
items.artifacts.etherealchains.cursed=No puedes usar cadenas malditas.
items.artifacts.etherealchains.desc=Estas cadenas, grandes pero ligeras, irradian energía espiritual. Pueden usarse para atraerte hacia el terreno o para atraer a los enemigos. ¡Su naturaleza etérea les permite incluso atravesar paredes!
items.artifacts.etherealchains.desc_cursed=Las cadenas malditas están sujetas a tu costado, balanceándose constantemente, tratando de hacerte tropezar o inmovilizarte.
items.artifacts.etherealchains.desc_equipped=Las cadenas te rodean, absorbiendo lentamente la energía espiritual de aquellos a quienes derrotas. Cada carga es un eslabón de la cadena, que se extenderá exactamente una casilla.
items.artifacts.etherealchains.does_nothing=Eso no servirá de nada.
items.artifacts.etherealchains.inside_wall=Tus cadenas solo pueden arrastrarte a través de las paredes, no hacia dentro de ellas.
items.artifacts.etherealchains.name=cadenas etéreas
items.artifacts.etherealchains.no_charge=Tus cadenas no tienen suficiente carga.
items.artifacts.etherealchains.nothing_to_grab=No hay nada que agarrar allí.
items.artifacts.etherealchains.prompt=Elige una ubicación a la que dirigirte.
items.artifacts.etherealchains.rooted=Tus cadenas no pueden arrastrarte mientras estés enraizado.
items.artifacts.holytome.ac_cast=ELENCO
items.artifacts.holytome.cursed=No puedes usar un tomo maldito.
items.artifacts.holytome.desc=Un tomo sagrado que actúa como foco para la magia divina del clérigo. Usar el tomo permite al clérigo lanzar una variedad de hechizos mágicos.\n\nEl tomo se volverá cada vez más poderoso a medida que el clérigo lo use, otorgándole al clérigo más cargas máximas y aumentando ligeramente la velocidad de recarga.
items.artifacts.holytome.discover_hint=Uno de los héroes comienza con este objeto.
items.artifacts.holytome.levelup=¡Tu tomo se hace más fuerte!
items.artifacts.holytome.name=tomo sagrado
items.artifacts.holytome.no_spell=No puedes lanzar ese hechizo ahora mismo.
