items.weapon.melee.gauntlet.typical_ability_desc=El Duelista puede realizar un _ataque combinado_ con un guantelete de piedra. Este ataque tiene un impacto garantizado y normalmente inflige _+%d de daño_ por cada vez que el Duelista haya impactado con un ataque cuerpo a cuerpo o con un arma arrojadiza. Si no impacta durante 5 turnos, este combo se reinicia.
items.weapon.melee.glaive.ability_desc=El Duelista puede usar la punta de una guja para _clavar_ a un enemigo que esté dentro del alcance pero no adyacente. Esto inflige _%1$d-%2$d de daño_, empuja al enemigo hacia atrás y tiene un impacto garantizado.
