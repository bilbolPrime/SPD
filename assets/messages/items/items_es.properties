items.weapon.melee.assassinsblade.ability_desc=La Duelista puede _escabullirse_ mientras empuña una espada de asesino. Esta habilidad le permite teletransportarse instantáneamente hasta 3 casillas de distancia y le otorga _%d turnos de invisibilidad._
items.weapon.melee.assassinsblade.ability_name=furtivo
items.weapon.melee.assassinsblade.desc=Una pequeña hoja ondulada hecha de obsidiana, difícil de usar a pesar de su ligereza, pero letal si da en el blanco.
items.weapon.melee.assassinsblade.name=hoja de asesino
items.weapon.melee.assassinsblade.stats_desc=Esta arma es más efectiva contra enemigos desprevenidos.
items.weapon.melee.assassinsblade.typical_ability_desc=La Duelista puede _escabullirse_ mientras empuña una espada de asesino. Esta habilidad le permite teletransportarse instantáneamente hasta 3 casillas de distancia y normalmente le otorga _%d turnos de invisibilidad._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Duración de la habilidad
items.weapon.melee.battleaxe.ability_desc=El Duelista puede realizar un _golpe pesado_ con un hacha de batalla. Este ataque concentrado inflige _%1$d-%2$d de daño_ si sorprende al enemigo, y lo aturde durante 5 turnos, lo que reduce la precisión y la evasión en 50%%. El golpe pesado siempre acierta, pero inflige daño normal si no sorprende al enemigo.
items.weapon.melee.battleaxe.ability_name=golpe fuerte
items.weapon.melee.battleaxe.desc=La enorme cabeza de acero de esta hacha de batalla imprime una fuerza considerable a cada amplio golpe.
items.weapon.melee.battleaxe.name=hacha de batalla
items.weapon.melee.battleaxe.stats_desc=Es un arma bastante precisa.
items.weapon.melee.battleaxe.typical_ability_desc=El Duelista puede realizar un _golpe pesado_ con un hacha de batalla. Este ataque concentrado normalmente inflige _%1$d-%2$d de daño_ si sorprende al enemigo, y lo aturde durante 5 turnos, lo que reduce la precisión y la evasión en 50%%. El golpe pesado siempre acierta, pero inflige daño normal si no sorprende al enemigo.
items.weapon.melee.crossbow$chargedshot.desc=La Duelista está concentrando poder en su ballesta. El siguiente ataque que realice con ella siempre impactará y aplicará uno de tres efectos: \n- Los ataques cuerpo a cuerpo empujarán a los enemigos a unas pocas casillas de distancia. \n- Los dardos sin punta infligirán daño adicional. \n- Los dardos con punta obtendrán usos adicionales y aplicarán su efecto en un área de 7x7. Los efectos positivos de los dardos solo afectarán a los aliados, y los efectos dañinos solo se aplicarán a los enemigos. La Duelista no puede usar esta habilidad para aplicar efectos positivos de dardos a sí misma.
items.weapon.melee.crossbow$chargedshot.name=cargado
items.weapon.melee.crossbow.ability_desc=La Duelista puede _cargar_ su ballesta, lo que hará que su siguiente ataque normal con ella siempre acierte y aplique uno de tres efectos: los ataques cuerpo a cuerpo alejarán a los enemigos, los dardos sin punta infligirán _+%1$d de daño_, y los dardos con punta aplicarán su efecto en un área de 7x7 y durarán _%2$d usos más_.
items.weapon.melee.crossbow.ability_name=disparo cargado
items.weapon.melee.crossbow.desc=Un arma bastante compleja que dispara virotes a velocidades excepcionales. Si bien no está diseñada para ello, su peso y robustez la convierten también en un arma cuerpo a cuerpo bastante eficaz.
items.weapon.melee.crossbow.name=ballesta
items.weapon.melee.crossbow.stats_desc=Esta arma mejora los dardos arrojadizos para infligir _%1$d-%2$d de daño_ cuando está equipada, e incluso les otorgará su encantamiento.
items.weapon.melee.crossbow.typical_ability_desc=La Duelista puede _cargar_ su ballesta, lo que provoca que su siguiente ataque normal con ella siempre acierte y aplique uno de tres efectos: los ataques cuerpo a cuerpo alejarán a los enemigos, los dardos sin punta normalmente infligirán _+%1$d de daño_, y los dardos con punta aplicarán su efecto en un área de 7x7 y normalmente durarán _%2$d usos más_.
items.weapon.melee.crossbow.typical_stats_desc=Normalmente, esta arma mejora los dardos arrojadizos para que causen daño _%1$d-%2$d_ cuando se equipa, e incluso les otorgará su encantamiento.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Mejora de habilidad
items.weapon.melee.cudgel.ability_desc=El Duelista puede realizar un _golpe fuerte_ con un garrote. Este ataque concentrado inflige _%1$d-%2$d de daño_ si sorprende al enemigo, y lo aturde durante 5 turnos, lo que reduce la precisión y la evasión en 50%%. El golpe fuerte siempre acierta, pero inflige daño normal si no sorprende al enemigo.
items.weapon.melee.cudgel.ability_name=golpe fuerte
