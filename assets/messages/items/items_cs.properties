items.artifacts.etherealchains.rooted=Tvé řetězy tě nemohou stáhnout, dokud jsi přikovaný/á.
items.artifacts.holytome.ac_cast=OBSAZENÍ
items.artifacts.holytome.cursed=Nemůžeš použít prokletý svazek.
items.artifacts.holytome.desc=Svatý svazek, který slouží jako ohnisko božské magie klerika. Používání svazku umožňuje klerikovi sesílat různá magická kouzla.\n\nSvazek se s tím, jak ho klerik používá, postupně stává silnějším, což mu dává více maximálních nábojů a mírně zvyšuje rychlost dobíjení.
items.artifacts.holytome.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.artifacts.holytome.levelup=Tvůj svazek sílí!
items.artifacts.holytome.name=svatý svazek
items.artifacts.holytome.no_spell=To kouzlo teď nemůžeš seslat.
items.artifacts.hornofplenty.ac_eat=JÍST
items.artifacts.hornofplenty.ac_snack=SNACK
items.artifacts.hornofplenty.ac_store=OBCHOD
items.artifacts.hornofplenty.desc=Do tohoto rohu se nedá foukat, ale místo toho se zdá, že se plní jídlem, jak se vydáváte na dobrodružství a získáváte zkušenosti. Každou nálož můžete zkonzumovat jednotlivě jako svačinu nebo jíst, dokud se nenasytíte.
items.artifacts.hornofplenty.desc_cursed=Prokletý roh se ti připoutal k boku, zdá se, že touží po potravě spíše přijímat, než ji produkovat.
items.artifacts.hornofplenty.desc_hint=Možná existuje způsob, jak zvýšit sílu rohu tím, že mu dodáme energii z potravy.
items.artifacts.hornofplenty.eat=Jíš z rohu.
items.artifacts.hornofplenty.feed=Roh pohltí tvou obětní potravu.
