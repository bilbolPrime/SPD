items.rings.ringofelements.combined_stats=Vaše vybavené prsteny kombinují svou sílu a celkově poskytují elementární odolnost _%s%%_.
items.rings.ringofelements.desc=Tento prsten poskytuje odolnost vůči ohni, elektřině, plynům a dalším živlům. Také zkracuje trvání škodlivých účinků.
items.rings.ringofelements.name=prsten živlů
items.rings.ringofelements.stats=Při nošení tento prsten poskytuje elementární odolnost _%s%%_.
