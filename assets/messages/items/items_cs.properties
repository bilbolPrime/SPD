items.scrolls.exotic.exoticscroll.unknown_desc=Na tomto černém pergamenu je napsána zářící, nerozluštitelná magická runa. Zdá se, že je této zemi cizí, kdo ví, co udělá, když se přečte nahlas?
items.scrolls.exotic.exoticscroll.yngvi=exotický svitek YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Zaříkávání na tomto svitku vás obklopí magickou aurou, která dočasně blokuje všechny magické účinky, ať už škodlivé nebo prospěšné. To zahrnuje většinu efektů magických předmětů, jako jsou hůlky, svitky, prsteny, artefakty, kouzla a kletby. Schopnosti hrdinského brnění jsou však dostatečně silné, aby fungovaly bez ohledu na to, zda se jedná o jakýkoli zážitek.
items.scrolls.exotic.scrollofantimagic.name=svitek proti magii
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Kolem vás se objevila magická aréna, označená vlnící se rudou mlhou.\n\nKdyž stojíte v mlze, váš hlad se nezvýší a ze všech zdrojů utrpíte o 33%% méně poškození. Pokud máte nějaké jiné zdroje snížení poškození (například brnění), uplatní se po snížení o 33%%.\n\nZbývající tahy: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=výzva aréna
items.scrolls.exotic.scrollofchallenge.desc=Při hlasitém přečtení se z tohoto svitku vydá mohutný řev, který přiláká nepřátele k uživateli a zároveň kolem nich vytvoří malou arénu.\n\nDokud čtenář zůstane v této aréně, bude utrpět o 33 % méně poškození ze všech zdrojů (toto se uplatní před jinými formami snížení poškození) a neztratí pocit sytosti.\n\nVelikost arény se bude měnit s velikostí oblasti, ve které se čtenář nachází. V některých oblastech s bossy bude aréna obzvláště malá.
items.scrolls.exotic.scrollofchallenge.name=svitek výzvy
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Váš věštecký svitek identifikoval následující položky:
items.scrolls.exotic.scrollofdivination.desc=Tento svitek náhodně identifikuje čtyři typy předmětů, které momentálně neznáte. Identifikované typy mohou být barva lektvaru, runa svitku nebo drahokam prstenu. Identifikované předměty nemusí být nutně ty, které máte u sebe.
items.scrolls.exotic.scrollofdivination.name=svitek věštění
items.scrolls.exotic.scrollofdivination.nothing_left=Není už nic k identifikaci!
items.scrolls.exotic.scrollofdread.desc=Po přečtení tento svitek vyzáří záblesk červeného světla, který vštípí neuvěřitelnou hrůzu všem nepřátelům ve vašem zorném poli. Tento efekt je tak silný, že se rychle pokusí uprchnout z celého podzemí, aby je už nikdy neviděli!\n\nStejně jako u hrůzy může tento efekt časem vypršet nebo pokud je nepřítel napaden.\n\nNepřátelé se silnou vůlí, jako jsou bossové, budou místo toho vystaveni běžné hrůze.
items.scrolls.exotic.scrollofdread.name=svitek hrůzy
items.scrolls.exotic.scrollofenchantment.armor=Vyberte si glyf, který chcete použít na své brnění.
items.scrolls.exotic.scrollofenchantment.cancel=zrušit
items.scrolls.exotic.scrollofenchantment.cancel_warn=Zrušením se ti stejně spotřebuje svitek očarování, jsi si jistý?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Ne, změnil jsem názor.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ano, jsem si jistý/á
items.scrolls.exotic.scrollofenchantment.desc=Tento svitek naplní zbraň nebo brnění silnou magickou energií. Čtenář má dokonce do určité míry kontrolu nad tím, která magie je naplněna.
items.scrolls.exotic.scrollofenchantment.inv_title=Očarujte předmět
items.scrolls.exotic.scrollofenchantment.name=svitek očarování
items.scrolls.exotic.scrollofenchantment.weapon=Vyberte kouzlo, které chcete použít na svou zbraň.
items.scrolls.exotic.scrollofforesight.desc=Po přečtení tohoto svitku se čtenář bude neustále zobrazovat v křišťálově jasné paměti s detaily blízkého terénu. Tento efekt trvá značnou dobu a odhalí všechny skryté dveře nebo pasti, takže hledání bude zbytečné.
items.scrolls.exotic.scrollofforesight.name=svitek předvídavosti
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Zrušením se tvůj svitek metamorfózy stejně spotřebuje, jsi si jistý?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Vyberte si talent, který chcete proměnit.
items.scrolls.exotic.scrollofmetamorphosis.desc=Tento svitek obsahuje mocnou transmutační magii, která se vztahuje na sesilatele, nikoli na předmět. Magie tohoto svitku vám umožní vybrat si jeden talent a nahradit ho jedním z pěti talentů stejné úrovně z různých tříd hrdinů!\n\nTento efekt se vztahuje pouze na talenty třídy, nikoli na talenty získané z podtříd nebo schopností brnění. Talenty, které nelze použít, nebudou nabízeny jako možnosti.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=proměnit talent
items.scrolls.exotic.scrollofmetamorphosis.name=svitek metamorfózy
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Vyber si nový talent, kterým nahradíš svůj proměněný talent.
items.scrolls.exotic.scrollofmysticalenergy.desc=Syrová magická síla svázaná v tomto pergamenu po uvolnění časem nabije artefakty uživatele, které má na sobě.
items.scrolls.exotic.scrollofmysticalenergy.name=svitek mystické energie
items.scrolls.exotic.scrollofpassage.desc=Kouzlo na tomto pergamenu okamžitě přenese čtenáře do nejbližší oblasti o patro výše. Velmi praktické pro rychlý přístup do obchodu.
items.scrolls.exotic.scrollofpassage.name=svitek pasáže
items.scrolls.exotic.scrollofprismaticimage.desc=Zaříkávání na tomto svitku vytvoří barevné iluzorní dvojče čtenáře. Tento hranolový obraz funguje jako slabší klon čtenáře s podobnou obranou, ale nižším zdravím a poškozením.\n\nHromazový obraz se objeví, když jsou přítomni nepřátelé, a pokusí se čtenáře bránit.\n\nPokud již hranolový obraz existuje, použití tohoto svitku jej plně vyléčí.
items.scrolls.exotic.scrollofprismaticimage.name=svitek hranolového obrazu
items.scrolls.exotic.scrollofpsionicblast.desc=Tento svitek obsahuje neuvěřitelnou ničivou energii, kterou lze nasměrovat ke zničení myslí všech viditelných tvorů.\n\nDochází však k významné zpětné vazbě a čtenář bude také poškozen, oslepen a oslaben. Čím více cílů svitek zasáhne, tím méně sebepoškození utrpí.
items.scrolls.exotic.scrollofpsionicblast.name=svitek psionického výbuchu
items.scrolls.exotic.scrollofpsionicblast.ondeath=Psionický výbuch ti trhá mysl na kusy...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Toto stvoření bylo očarováno magií svitku siréniny písně. \n\nOčarovaná postava je vaším trvalým spojencem a bude bojovat proti všem nepřátelům, se kterými se setká.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=okouzlen
items.scrolls.exotic.scrollofsirenssong.cancel=Musíte si vybrat cíl.
items.scrolls.exotic.scrollofsirenssong.desc=Přečtení tohoto svitku vydává svůdnou melodii, která okouzlí vybraného nepřítele a trvale ho promění ve spojence! Ostatní nepřátelé, kteří ji uslyší, budou dočasně okouzleni. \n\n Obzvláště silní nepřátelé dokáží odolat efektu okouzlení a místo toho budou okouzleni.
items.scrolls.exotic.scrollofsirenssong.name=svitek písně sirény
items.scrolls.exotic.scrollofsirenssong.no_target=Svitek se aktivuje bez cíle.
items.scrolls.exotic.scrollofsirenssong.prompt=Vyberte cíl
items.scrolls.inventoryscroll.no=Ne, změnil jsem názor.
items.scrolls.inventoryscroll.warning=Opravdu chcete zrušit používání tohoto svitku? Svitek nebyl dříve identifikován, takže bude stejně spotřebován.
items.scrolls.inventoryscroll.yes=Ano, jsem pozitivní/á
items.scrolls.scroll$placeholder.name=svitek
items.scrolls.scroll.ac_read=ČÍST
items.scrolls.scroll.berkanan=svitek BERKANAN
items.scrolls.scroll.blinded=Svitek nemůžeš číst, když jsi oslepený.
items.scrolls.scroll.cursed=Tvoje prokletá kniha kouzel ti brání v vyvolání magie tohoto svitku! Svitek na odstranění kletby by ale mohl být dostatečně silný, aby stále fungoval...
items.scrolls.scroll.gyfu=svitek GYFU
items.scrolls.scroll.isaz=svitek ISAZ
items.scrolls.scroll.kaunan=svitek KAUNAN
items.scrolls.scroll.laguz=svitek LAGUZ
items.scrolls.scroll.mannaz=svitek MANNAZ
items.scrolls.scroll.naudiz=svitek NAUDIZ
items.scrolls.scroll.no_magic=Nemůžeš číst svitek, když jsi imunní vůči magii.
items.scrolls.scroll.odal=svitek ODAL
items.scrolls.scroll.raido=svitek RAIDO
items.scrolls.scroll.sowilo=svitek SOWILO
items.scrolls.scroll.tiwaz=svitek TIWAZ
items.scrolls.scroll.unknown_desc=Tento pergamen pokrývá nečitelné písmo a nese označení runou %s. Kdo ví, co se stane, když ho přečteš nahlas?
items.scrolls.scroll.yngvi=svitek YNGVI
items.scrolls.scrollofidentify.desc=Trvale odhaluje všechna tajemství jedné položky.
items.scrolls.scrollofidentify.inv_title=Identifikace položky
items.scrolls.scrollofidentify.it_is=Vaše položka byla identifikována: %s.
items.scrolls.scrollofidentify.name=svitek identifikace
items.scrolls.scrolloflullaby.desc=Uklidňující melodie uspí všechny tvory ve vašem zorném poli hlubokým spánkem a dá vám šanci uprchnout nebo na ně překvapivě zaútočit.
items.scrolls.scrolloflullaby.name=svitek ukolébavky
items.scrolls.scrolloflullaby.sooth=Svitek vydává uklidňující melodii. Cítíte se velmi ospalí.
items.scrolls.scrollofmagicmapping.desc=Po přečtení tohoto svitku se vám do paměti vryje křišťálově jasný obraz, který vás upozorní na přesné rozložení úrovně a odhalí všechna skrytá tajemství. Umístění předmětů a tvorů zůstane neznámé.
items.scrolls.scrollofmagicmapping.layout=Nyní znáte rozvržení úrovní.
items.scrolls.scrollofmagicmapping.name=svitek magického mapování
items.scrolls.scrollofmirrorimage.copies=Svitek tvoří tvé zrcadlové obrazy.
items.scrolls.scrollofmirrorimage.desc=Zaříkávání na tomto svitku vytvoří iluzorní dvojčata čtenáře, která budou pronásledovat jeho nepřátele.
items.scrolls.scrollofmirrorimage.name=svitek zrcadlového obrazu
items.scrolls.scrollofmirrorimage.no_copies=Svitek se pokouší vytvořit tvé zrcadlové obrazy, ale ty nemají kam jít.
items.scrolls.scrollofrage.desc=Při hlasitém přečtení se z tohoto svitku spustí mohutný řev, který k čtenáři přitáhne všechny nepřátele a rozzuří ty v okolí.
items.scrolls.scrollofrage.name=svitek vzteku
items.scrolls.scrollofrage.roar=Svitek vydává rozzuřený řev, který se rozléhá celým podzemím!
items.scrolls.scrollofrecharging.desc=Syrová magická síla svázaná v tomto pergamenu po uvolnění dobije všechny hůlky čtenáře na plnou kapacitu.
items.scrolls.scrollofrecharging.name=svitek dobíjení
items.scrolls.scrollofrecharging.surge=Tělem vám projede vlna energie, která povzbudí vaše hůlky!
items.scrolls.scrollofremovecurse.cleansed=Tvůj předmět září očistným světlem a zlovolná energie se rozptýlí!
items.scrolls.scrollofremovecurse.desc=Zaříkávání na tomto svitku okamžitě odstraní ze zbraně, brnění, prstenů a nošených předmětů čtenáře veškerá zlá kouzla, která by mohla nositeli bránit v jejich odstranění.
items.scrolls.scrollofremovecurse.inv_title=Vyčištění předmětu
items.scrolls.scrollofremovecurse.name=svitek s odstraněním kletby
items.scrolls.scrollofremovecurse.not_cleansed=Váš předmět září očistným světlem, ale nic se neděje.
items.scrolls.scrollofremovecurse.spirit=Tvůj svitek osvobozuje trýzněného ducha!
items.scrolls.scrollofretribution.blast=Ze svitku vytryskne mocná magická energie!
items.scrolls.scrollofretribution.desc=Tento svitek obsahuje destruktivní energii, která směruje čtenářovo utrpení ven do výbuchu síly. Čím slabší je čtenář, tím více poškození způsobí. S velmi nízkým zdravím dokáže tento svitek okamžitě zabít většinu nepřátel. \n\n Používání svitku si však na uživateli vybírá svou daň, oslepuje ho a oslabuje.
items.scrolls.scrollofretribution.name=svitek odplaty
items.scrolls.scrollofteleportation.cant_reach=Tam se teleportovat nedá.
items.scrolls.scrollofteleportation.desc=Kouzlo na tomto pergamenu okamžitě přenese čtenáře na náhodné místo v úrovni podzemí. Lze ho použít k úniku z nebezpečné situace, ale smolařský čtenář se může ocitnout na ještě nebezpečnějším místě.
items.scrolls.scrollofteleportation.name=svitek teleportace
items.scrolls.scrollofteleportation.no_tele=Teleportační magie selhala.
items.scrolls.scrollofteleportation.prompt=Vyberte místo pro teleportaci
items.scrolls.scrollofteleportation.tele=V mrknutí oka jste byli teleportováni na jiné místo v úrovni.
items.scrolls.scrollofterror.desc=Záblesk červeného světla přemůže všechny tvory ve vašem zorném poli hrůzou, otočí se a utečou. Útok na prchajícího nepřítele tento efekt rozptýlí.
items.scrolls.scrollofterror.many=Svitek vyzařuje oslnivý záblesk červeného světla a příšery prchají!
items.scrolls.scrollofterror.name=svitek hrůzy
items.scrolls.scrollofterror.none=Svitek vyzařuje oslnivý záblesk červeného světla.
items.scrolls.scrollofterror.one=Svitek vyzařuje oslnivý záblesk červeného světla a %s prchá!
items.scrolls.scrolloftransmutation.desc=Tento svitek obsahuje silnou transmutační magii. Při použití na vhodný předmět jej promění v jiný předmět stejného typu. Magie dokonce zachová vylepšení, kouzla a symboly. Svitky a lektvary budou přeměněny na své exotické ekvivalenty a naopak.
items.scrolls.scrolloftransmutation.inv_title=Transmutace předmětu
items.scrolls.scrolloftransmutation.morph=Váš předmět se promění v něco jiného!
items.scrolls.scrolloftransmutation.name=svitek transmutace
items.scrolls.scrolloftransmutation.nothing=Nic zajímavého se neděje.
items.scrolls.scrollofupgrade.desc=Tento svitek vylepší jeden předmět a zlepší jeho kvalitu. Hůlka se zvýší na síle a počtu nabití; zbraň způsobí větší poškození nebo častěji najde svůj cíl; brnění odrazí další údery; účinek prstenu na jeho nositele se zesílí. Zbraně a brnění budou také vyžadovat menší sílu k použití a veškeré kletby na předmětu budou zrušeny.
items.scrolls.scrollofupgrade.inv_title=Vylepšení položky
items.scrolls.scrollofupgrade.name=svitek vylepšení
items.scrolls.scrollofupgrade.remove_curse=Svitek vylepšení zbaví tvého předmětu kletby!
items.scrolls.scrollofupgrade.weaken_curse=Svitek vylepšení oslabí kletbu na vašem předmětu.
items.spells.alchemize$wndalchemizeitem.energize=Proměňte se v energii %d
items.spells.alchemize$wndalchemizeitem.energize_1=Proměňte 1 na energii %d
items.spells.alchemize$wndalchemizeitem.energize_all=Proměňte vše v energii %d
items.spells.alchemize$wndalchemizeitem.sell=Proměňte se na %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Proměňte 1 na %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Proměňte vše na %dg
items.spells.alchemize.desc=Toto kouzlo obsahuje transmutační schopnosti podobné těm, které se nacházejí v alchymistickém hrnci. Každé seslání umožňuje uživateli proměnit předmět (nebo hromádku předmětů) ve zlato nebo alchymistickou energii. Proměna lektvarů nebo svitků v energii je dokonce identifikuje! \n\nA V obchodech se prodává jen málo alchymistických použití, ale mnohem více jich lze vyrobit pomocí alchymie kombinací semene, runového kamene a trochy alchymistické energie.
items.spells.alchemize.name=alchymizovat
items.spells.alchemize.prompt=Alchymizovat předmět
items.spells.beaconofreturning.creatures=Psychická aura sousedních tvorů ti v tuto chvíli neumožňuje teleportaci.
items.spells.beaconofreturning.desc=Toto složité kouzlo dává uživateli schopnost vrátit se na určené místo bez ohledu na vzdálenost. Kouzlo bude spotřebováno pouze návratem, lze ho použít tolikrát, kolikrát chcete, ale pamatuje si pouze poslední místo, na které bylo použito.
items.spells.beaconofreturning.desc_set=Tento maják byl umístěn někde na podlaze %d.
items.spells.beaconofreturning.name=maják návratu
items.spells.beaconofreturning.preventing=Silná magická aura tohoto místa ti brání v použití kouzla!
items.spells.beaconofreturning.set=Maják byl nastaven na vaši aktuální polohu.
items.spells.beaconofreturning.wnd_body=Nastavení přepíše umístění, na kterém byl maják dříve nastaven. \n\nNávratem se vrátíte na poslední nastavené umístění a spotřebujete jedno použití kouzla.
items.spells.beaconofreturning.wnd_return=NÁVRAT
items.spells.beaconofreturning.wnd_set=SOUBOR
items.spells.curseinfusion.desc=Toto kouzlo naplní vybavení stejnou mocnou zhoubnou magií, která je přítomna v DM-300. Předmět, na který je použit, bude okamžitě proklet a jakékoli kouzlo nebo glyf, který mohl mít, bude přepsán.\n\nV případě zbraní, brnění a hůlek předmět kromě prokletstva získá i vylepšení. Vylepšení prokletím se nesčítají a vylepšení se ztratí, pokud se předmět zbaví prokletí.\n\nK změně prokletí zbraně nebo brnění lze také použít více prokletí.
items.spells.curseinfusion.inv_title=Prokletí předmětu
items.spells.curseinfusion.name=prokletí infuze
items.spells.magicalinfusion.desc=Toto kouzlo má stejnou magickou sílu jako svitek vylepšení, ale ve stabilnější formě. \n\nKromě běžného vylepšení předmětu nikdy nevymaže kouzlo, glyf ani kletbu.
items.spells.magicalinfusion.infuse=Váš předmět je naplněn tajemnou energií!
items.spells.magicalinfusion.inv_title=Nalijte předmět
items.spells.magicalinfusion.name=magický nálev
items.spells.magicalporter.desc=Toto kouzlo magicky přenese jakýkoli předmět, na který je sesláno. Na rozdíl od obchodního majáku však budou předměty přeneseny ke vchodu do dalšího patra s bossem.
items.spells.magicalporter.inv_title=Přenést položku
items.spells.magicalporter.name=magický nosič
items.spells.magicalporter.nowhere=Není kam přenést položku.
items.spells.phaseshift.desc=Toto chaotické kouzlo teleportuje jakoukoli postavu, na kterou je zaměřeno, na náhodné místo na aktuálním patře a na značnou dobu ji omráčí. Silní nepřátelé budou schopni omračujícímu efektu odolat. Toto kouzlo lze namířit na cíl nebo na samotného uživatele.
items.spells.phaseshift.name=fázový posun
items.spells.phaseshift.no_target=Tam se nedá nic teleportovat.
items.spells.reclaimtrap.desc=Toto kouzlo obsahuje zbytky mechanické energie DM-300. Po seslání na aktivní past se k vám připojí síla pasti, což vám umožní kouzlo znovu použít k vyhnání této síly a spuštění efektu pasti na jakémkoli místě, které chcete. \n\nNěkteré pasti však nemusí fungovat na všech místech a najednou lze uložit pouze jednu past.
items.spells.reclaimtrap.desc_trap=Kouzlo je momentálně připraveno spustit _%s._
items.spells.reclaimtrap.name=znovuzískání pasti
items.spells.reclaimtrap.no_trap=Žádná past tam není.
items.spells.recycle.desc=Toto kouzlo obsahuje slabší formu transmutační magie. I když nefunguje na vybavení, promění svitek, lektvar, semeno, runový kámen nebo šipku s hrotem na náhodný předmět stejného typu.
items.spells.recycle.inv_title=Recyklace položky
items.spells.recycle.name=recyklovat
items.spells.recycle.recycled=Vaše položka byla recyklována do: %s.
items.spells.spell.ac_cast=OBSAZENÍ
items.spells.spell.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.spells.spell.no_magic=Nemůžeš sesílat kouzla, když jsi imunní vůči magii.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Toto kouzlo využívá energii žhavých uhlíků použitých k jeho výrobě a umožní vám přivolat spřáteleného elementála, aby s vámi bojoval! Najednou lze přivolat pouze jednoho elementála, ale kouzlo lze seslat znovu a elementál vám vrátit bezplatně.
items.spells.summonelemental.desc_chaos=Kouzlo momentálně vyzařuje chaotickou energii, přivolá _elementála chaosu_. Můžete na něj naplnit jiný předmět, ale kouzlo ztratí svou aktuální energii.
items.spells.summonelemental.desc_fire=Kouzlo je momentálně horké na dotek, přivolá _ohnivého elementála_. Můžete na něj navléknout jiný předmět, ale kouzlo ztratí svou aktuální navléknutí.
items.spells.summonelemental.desc_frost=Kouzlo je momentálně na dotek chladné, přivolá _mrazivého elementála_. Můžete na něj nanést jiný předmět, ale kouzlo ztratí svou aktuální schopnost.
items.spells.summonelemental.desc_newborn=Kouzlo je momentálně bez nabití a přivolá _novorozeného elementála_ bez útoku na dálku. Můžete nabít identifikovaný lektvar tekutého plamene, lektvar mrazu, svitek dobíjení nebo svitek transmutace, abyste kouzlo posílili a způsobili, že budoucí vyvolání budou mít plnou sílu elementála!
items.spells.summonelemental.desc_shock=Kouzlo momentálně vyzařuje statickou energii, přivolá _šokového elementála_. Můžete na něj nanést jiný předmět, ale kouzlo ztratí svou aktuální energii.
items.spells.summonelemental.imbue_prompt=Naplňte předmět
items.spells.summonelemental.name=přivolat elementární
items.spells.targetedspell.inv_title=Nalijte předmět
items.spells.targetedspell.prompt=Vyberte cíl
items.spells.telekineticgrab.cant_grab=Toho se nedočkáš.
items.spells.telekineticgrab.desc=Toto kouzlo umožňuje sesilateli na dálku uchopit všechny předměty na daném místě nebo všechny vrhané zbraně přilepené k nepříteli!\n\nNelze ho použít k uchopení předmětů, které vlastní někdo jiný, ani k uchopení kontejnerů, jako jsou truhly.
items.spells.telekineticgrab.name=telekinetické uchopení
items.spells.telekineticgrab.no_target=Tam není čeho se chytit.
items.spells.unstablespell.desc=Tento malý černý čtvercový krystal má na každém svém povrchu měnící se runové symboly.\n\nPo aktivaci spustí efekt náhodného svitku. Efekt svitku bude vždy zaměřen na boj, pokud jsou ve vašem zorném poli nepřátelé, a v opačném případě bude vždy zaměřen na neboj.
items.spells.unstablespell.name=nestabilní kouzlo
items.spells.wildenergy.desc=Toto kouzlo obsahuje část prokleté energie, která poháněla DM-300. Po seslání dobije vaše hůlky a opotřebované artefakty a zároveň spustí náhodný efekt prokleté hůlky. Můžete si však zvolit směr, kterým bude tato prokletá magie vystřelovat.
items.spells.wildenergy.name=divoká energie
items.stones.inventorystone.ac_use=POUŽITÍ
items.stones.runestone$placeholder.name=runový kámen
items.stones.runestone.discover_hint=Tuto položku můžete najít náhodně v podzemí nebo si ji vyrobit pomocí alchymie.
items.stones.stoneofaggression$aggression.desc=Manipulativní magie nutí všechny nepřátele v okolí útočit na tuto postavu. \n\nZbývající tahy: %s.
items.stones.stoneofaggression$aggression.name=cílené
items.stones.stoneofaggression.desc=Když je tento kámen hozen na spojence nebo nepřítele, všichni nepřátelé v okolí budou na krátkou dobu upřednostňovat útok na tuto postavu. \n\nNepřátelští bossové však mohou tomuto efektu odolat, čímž se výrazně zkrátí jeho trvání a útoky jejich minionů jim způsobí menší poškození.
items.stones.stoneofaggression.name=kámen agrese
items.stones.stoneofaugmentation$wndaugment.cancel=Nevadí
items.stones.stoneofaugmentation$wndaugment.choice=Co byste chtěli vylepšit?
items.stones.stoneofaugmentation$wndaugment.damage=Poškození
items.stones.stoneofaugmentation$wndaugment.defense=Obrana
items.stones.stoneofaugmentation$wndaugment.evasion=Únik
items.stones.stoneofaugmentation$wndaugment.none=Odebrat augmentaci
items.stones.stoneofaugmentation$wndaugment.speed=Rychlost
items.stones.stoneofaugmentation.desc=Tento runový kámen má silnou magii, která dokáže vylepšit vybavení a vylepšit jednu vlastnost na úkor jiné. \n\nPoužití na zbrani vám umožní zvýšit buď rychlost, nebo poškození. Vrhací zbraně také získají nebo ztratí odolnost úměrně své rychlosti. \n\nPoužití na brnění vám umožní zvýšit buď obranu, nebo úhybné schopnosti.
items.stones.stoneofaugmentation.discover_hint=Tuto položku si můžete koupit v obchodě nebo si ji vyrobit pomocí alchymie.
items.stones.stoneofaugmentation.inv_title=Vylepšení položky
items.stones.stoneofaugmentation.name=kámen augmentace
items.stones.stoneofblast.desc=Tento runový kámen okamžitě exploduje v místě, kam je hozen. Stejně jako bomba, i exploze způsobí poškození všemu v okolí.
items.stones.stoneofblast.name=kámen výbuchu
items.stones.stoneofblink.desc=Tento runový kámen teleportuje uživatele na místo, kam je hozen.
items.stones.stoneofblink.name=kámen mrknutí
items.stones.stoneofclairvoyance.desc=Tento kámen okamžitě odhalí všechny dlaždice ve velmi široké oblasti kolem místa, kam je hozen. Jeho účinek pronikne i skrz zdi.
items.stones.stoneofclairvoyance.name=kámen jasnovidectví
items.stones.stoneofdeepsleep.desc=Když je tento kámen hozen po nepříteli, uvede ho do hlubokého magického spánku. Magicky usnulí nepřátelé budou spát navždy, dokud je nevyrušíte.
items.stones.stoneofdeepsleep.name=kámen hlubokého spánku
items.stones.stoneofdetectmagic.desc=Tento runový kámen dokáže detekovat magii ovlivňující předmět. Použití tohoto kamene na neidentifikovaném předmětu vám prozradí, zda je ovlivněn zlovolnou kletbou a zda je ovlivněn pozitivní magií, jako je očarování nebo vylepšení.
items.stones.stoneofdetectmagic.detected_bad=Detekujete zlovolnou magii ovlivňující tento předmět!
items.stones.stoneofdetectmagic.detected_both=Detekujete jak pozitivní, tak zlovolnou magii ovlivňující tento předmět!
items.stones.stoneofdetectmagic.detected_good=Detekujete pozitivní magii ovlivňující tento předmět!
items.stones.stoneofdetectmagic.detected_none=Nedetekujete žádnou magii ovlivňující tuto položku.
items.stones.stoneofdetectmagic.inv_title=Detekce položky
items.stones.stoneofdetectmagic.name=kámen detekce magie
items.stones.stoneofdisarming.desc=Tento runový kámen obsahuje magii, která dokáže zneškodnit zlomyslné pasti ukryté v podzemí. Zneškodní až 9 pastí v oblasti, na kterou je hozen.
items.stones.stoneofdisarming.name=kámen odzbrojování
items.stones.stoneofenchantment.armor=Tvoje brnění září ve tmě!
items.stones.stoneofenchantment.desc=Tento runový kámen má očarující magii. Na rozdíl od svitku vylepšení nezvýší přímou sílu předmětu, ale místo toho očaruje zbraň nebo brnění a dodá jí novou moc.
items.stones.stoneofenchantment.inv_title=Očarujte předmět
items.stones.stoneofenchantment.name=kámen kouzel
items.stones.stoneofenchantment.weapon=Tvoje zbraň svítí ve tmě!
items.stones.stoneoffear.desc=Když je tento kámen hozen na postavu, přemůže ji hrůza, otočí se a uteče. Útok na prchající postavu efekt zkrátí.
items.stones.stoneoffear.name=kámen strachu
items.stones.stoneofflock.desc=Tento runový kámen přivolává na krátkou dobu magické ovce v okolí místa, kam je hozen.
items.stones.stoneofflock.name=kámen z hejna
items.stones.stoneofintuition$wndguess.break=Tvůj kámen intuice se rozpadne na prach...
items.stones.stoneofintuition$wndguess.correct=Správně. Typ položky byl identifikován!
items.stones.stoneofintuition$wndguess.incorrect=Váš odhad byl nesprávný.
items.stones.stoneofintuition$wndguess.text=Hádejte, jaký je typ neidentifikovaného předmětu. Pokud uhodnete správně, typ bude identifikován!
items.stones.stoneofintuition.break_info=Kameny intuice můžeš použít dvakrát, než se jeden rozbije, _při dalším použití už žádný kámen nespotřebuje_.
items.stones.stoneofintuition.break_warn=Už jsi dříve použil/a kámen intuice, takže _při příštím použití kámen spotřebuješ_.
items.stones.stoneofintuition.desc=Tento runový kámen v sobě skrývá slabší verzi magie, která se nachází ve svitcích identifikace. Místo přímé identifikace předmětu bude pracovat s vaší intuicí, což vám umožní pokusit se hádat o typ lektvaru, svitku nebo prstenu.
items.stones.stoneofintuition.inv_title=Vyberte položku
items.stones.stoneofintuition.name=kámen intuice
items.stones.stoneofshock.desc=Tento runový kámen uvolní výbuch elektrické energie, který krátce omráčí všechny blízké cíle a za každý zasažený cíl nabije vrhací hůl.
items.stones.stoneofshock.name=kámen šoku
items.stylus.ac_inscribe=VEPSAT
items.stylus.cursed=Magie stylusu nebude fungovat na prokleté brnění.
items.stylus.desc=Toto tajemné pero je vyrobeno z nějakého tmavého, velmi tvrdého kamene. S jeho pomocí si můžete na brnění vyryt magický symbol, ale nemáte žádnou moc nad výběrem, jaký to bude symbol, pero to rozhodne za vás.
items.stylus.identify=Nejdříve musíš zjistit, zda je dané brnění prokleté.
items.stylus.inscribed=Vyryl sis do brnění popisek stylusem.
items.stylus.name=tajemný stylus
items.stylus.prompt=Vyberte si brnění
items.tengusmask.ac_wear=NOSIT
items.tengusmask.desc=Tato maska spadla Tenguovi z obličeje, když umíral, a cítíte z ní velkou magickou sílu. Byla maska Tenguovým zdrojem síly?\n\nPři nošení se do vás přenese obrovská síla masky, což vám umožní _vybrat si podtřídu pro svého hrdinu._\n\nKterou podtřídu si vyberete?
items.tengusmask.discover_hint=Tuto položku můžete získat jako drop z určitých nepřátel.
items.tengusmask.name=Tenguova maska
items.tengusmask.used=Maska se rozpadá, jak do tebe proudí její síla!
items.torch.ac_light=SVĚTLO
items.torch.desc=Pochodeň, základní prvek pro dobrodružné dobrodružství, když se dungeon ztratí v temnotě, vám může pomoci ukázat cestu.
items.torch.name=pochodeň
items.trinkets.chaoticcenser.desc=Po nějaké době v alchymistické nádobě se zdá, že tato kadidelnice na pálení kadidla sama od sebe produkuje kouř! Tyto plyny se hromadí a v polonáhodných intervalech z kadidelnice chrlí směrem k nepřátelům. Zdá se, že je schopna produkovat nejrůznější plyny, ale těsně před aktivací kadidelnice dostanete chvilku varování.
items.trinkets.chaoticcenser.name=chaotická kadidelnice
items.trinkets.chaoticcenser.spew=Tvoje kadidelnice se chystá chrlit: %s.
items.trinkets.chaoticcenser.stats_desc=Na současné úrovni tento drobný předmět zhruba každé kolo _%d_ vyprodukuje poblíž nepřítele škodlivý plyn. Plyny se objeví pouze tehdy, když jsou přítomni nepřátelé. Na vyšších úrovních jsou tyto plyny pravděpodobně exotičtější a silnější.
items.trinkets.chaoticcenser.typical_stats_desc=Tento drobný předmět obvykle vyprodukuje škodlivý plyn poblíž nepřítele zhruba každých _%d_ tah. Plyny se objeví pouze tehdy, když jsou přítomni nepřátelé. Na vyšších úrovních jsou tyto plyny pravděpodobně exotičtější a silnější.
items.trinkets.crackedspyglass.desc=Tento ruční dalekohled by byl ukázkou skvělého a precizního zpracování, nebýt praskliny podél přední čočky. Dalekohled vám zřejmě pomáhá odhalováním nových předmětů v podzemí, ale kvůli jeho vadě je odhalené předměty docela těžké vidět!
items.trinkets.crackedspyglass.name=prasklý dalekohled
items.trinkets.crackedspyglass.stats_desc=Na své současné úrovni má tento trinket _%1$s%% šanci_ vytvořit další skrytý předmět na každém patře, kde není boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=Na současné úrovni má tento trinket _100%% šanci_ vytvořit další skrytý předmět na každém patře bez bossů a _%1$s%% šanci_ vytvořit druhý další skrytý předmět.
items.trinkets.crackedspyglass.typical_stats_desc=Tento drobný předmět má obvykle _%1$s%% šanci_ vytvořit další skrytý předmět na každém patře, kde není boss.
items.trinkets.dimensionalsundial.desc=Tyto malé ruční sluneční hodiny nějakým způsobem vrhají stín v hlubinách podzemí, i když je nedržíte ve svislé poloze. Ještě podivnější je, že poloha stínu jako by neměla žádný vztah ke slunci v tomto světě. Když žádný stín nevrhají, sluneční hodiny jako by přitahovaly nebezpečí.
items.trinkets.dimensionalsundial.name=rozměrné sluneční hodiny
items.trinkets.dimensionalsundial.stats_desc=Na současné úrovni tento trinket v reálném životě během dne (8:00-20:00) sníží rychlost objevování nepřátel o _%1$d%%_ a v noci (20:00-8:00) zvýší rychlost objevování nepřátel o _%2$d%%_.
items.trinkets.dimensionalsundial.typical_stats_desc=Tento drobný předmět obvykle ve dne (8:00-20:00) sníží rychlost objevování nepřátel o _%1$d%%_ a v noci (20:00-8:00) ji zvýší o _%2$d%%_.
items.trinkets.dimensionalsundial.warning=Vaše sluneční hodiny nevrhají stín, cítíte se nesví.
items.trinkets.exoticcrystals.desc=Tyto malé růžové krystaly mají stejný tvar jako krystaly alchymistické energie. I když je nelze přímo použít k získávání energie, zdá se, že nějakým způsobem ovlivňují lektvary a svitky, které najdete.
items.trinkets.exoticcrystals.name=exotické krystaly
items.trinkets.exoticcrystals.stats_desc=Na současné úrovni tento trinket nahradí _%s%%_ z lektvarů nebo svitků jejich exotickými ekvivalenty. Toto neovlivní lektvary síly, svitky vylepšení ani předměty, které se generují k řešení nebezpečných místností.
items.trinkets.exoticcrystals.typical_stats_desc=Tento drobný předmět obvykle nahradí _%s%%_ z lektvarů nebo svitků jejich exotickými ekvivalenty. Toto neovlivní lektvary síly, svitky vylepšení ani předměty, které se generují k řešení nebezpečných místností.
items.trinkets.eyeofnewt.desc=Toto zlaté a černé oko mloka je běžnou ingrediencí, nyní vylepšenou do podoby drobnosti. Zdá se, že oko snižuje vaše vidění výměnou za to, že vám umožňuje vidět věci jinými způsoby.
items.trinkets.eyeofnewt.name=oko mloka
items.trinkets.eyeofnewt.stats_desc=Na současné úrovni vám tento doplňkový předmět sníží dosah vidění o _%1$s%%_, ale také vám poskytne mentální vidění nepřátel v polích _%2$d_.
items.trinkets.eyeofnewt.typical_stats_desc=Tento drobný předmět obvykle sníží váš dohled o _%1$s%%_, ale také vám poskytne mentální vidění nepřátel v polích _%2$d_.
items.trinkets.ferrettuft.desc=Chomáč hedvábně bílé fretčí srsti, držený pohromadě limetkově zelenou stuhou uvázanou do mašle. Fretky jsou známé svou hbitostí, zlomyslností a nedostatkem integrity. Zdá se, že část této síly vyzařuje z tohoto cetku a pomáhá jim uhýbat se všemu, co se nachází v okolí.
items.trinkets.ferrettuft.name=chochol fretky
items.trinkets.ferrettuft.stats_desc=Na současné úrovni tento trinket zvýší schopnost vyhýbání se všem postavám o _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Tento trinket obvykle zvýší vyhýbání se všem postavám o _%1$s%%_.
items.trinkets.mimictooth.desc=Tento velký ostrý zub musel být vytržen z velmi nešťastného napodobitele. Zdá se, že ovlivňuje napodobitele v jeskyni, čímž je činí častějšími a nebezpečnějšími.
items.trinkets.mimictooth.name=napodobit zub
items.trinkets.mimictooth.stats_desc=Na současné úrovni tento trinket způsobí, že všechny druhy napodobenin _%1$sx_ budou běžnější a mnohem obtížnější k odhalení, ale také zvýší množství kořisti, která z nich padne. Každé patro dungeonu bude mít také _%2$s%%_ šanci obsahovat dalšího nenápadného ebenového napodobeninu.
items.trinkets.mimictooth.typical_stats_desc=Tento drobný předmět obvykle zvýší běžnost všech druhů napodobenin _%1$sx_ a jejich odhalení bude mnohem obtížnější, ale také zvýší množství kořisti, která z nich padne. Každé patro dungeonu bude mít také _%2$s%%_ šanci obsahovat další nenápadnou ebenovou napodobeninu.
items.trinkets.mossyclump.desc=Tato chomáčka mokrého mechu si jako by udržela vlhkost, ať ji zmáčknete sebevíc. Zdá se, že je magicky připoutána k samotnému sklepení, takže se tam s větší pravděpodobností objeví tráva a voda.
items.trinkets.mossyclump.name=mechový trs
items.trinkets.mossyclump.stats_desc=Na současné úrovni tento drobný předmět způsobí, že se _%d%%_ netematických podlaží zaplní buď vodou, nebo trávou. \n\nVylepšení tohoto drobného předmětu vyžaduje větší množství energie.
items.trinkets.mossyclump.typical_stats_desc=Tento drobný předmět obvykle způsobí, že se _%d%%_ netematických podlaží zaplní buď vodou, nebo trávou. \n\nVylepšení tohoto drobného předmětu vyžaduje větší množství energie.
items.trinkets.parchmentscrap.desc=Tento malý útržek pergamenu vypadá, jako by pocházel ze svitku. Zachoval si část své magie a zdá se, že ovlivňuje zbraně a brnění nalezené v podzemí.
items.trinkets.parchmentscrap.name=útržek pergamenu
items.trinkets.parchmentscrap.stats_desc=Na současné úrovni tento trinket zvýší hodnotu kouzla a symbolů _%dx_ a hodnotu kletby na zbraních a brnění _%sx_. Kletby na hůlkách, prstenech nebo artefaktech nejsou ovlivněny. \n\nVylepšení tohoto trinketu vyžaduje větší množství energie.
items.trinkets.parchmentscrap.typical_stats_desc=Tento trinket obvykle způsobí, že kouzla a symboly _%dx_ budou běžné a kletby na zbraních a brnění _%sx_ budou běžné. Kletby na hůlkách, prstenech nebo artefaktech nejsou ovlivněny.\n\nVylepšení tohoto trinketu vyžaduje větší množství energie.
items.trinkets.petrifiedseed.desc=Toto semeno bylo zkamenělo, buď pomalými geologickými procesy, nebo magií. Zdá se, že semeno magicky ovlivňuje flóru podzemí a občas nahrazuje semena rostlin runovými kameny.
items.trinkets.petrifiedseed.name=zkamenělé semeno
items.trinkets.petrifiedseed.stats_desc=Na současné úrovni bude tento drobný předmět způsobovat, že z pošlapané trávy budou místo semen _%1$s%%_ padat runové kameny a také bude z vysoké trávy častěji padat předměty _%2$s%%_.
items.trinkets.petrifiedseed.typical_stats_desc=Tento drobný předmět obvykle způsobí, že z pošlapané trávy budou místo semen _%1$s%%_ padat runové kameny a také bude způsobovat, že z vysoké trávy budou častěji padat předměty _%2$s%%_.
items.trinkets.ratskull.desc=Tato morbidní cetka není o moc větší než lebka normální krysy, což je v tomto podzemí nějakým způsobem vzácnost. Magický vliv lebky zřejmě přitahuje vzácnější obyvatele podzemí, díky čemuž se objevují mnohem častěji.
items.trinkets.ratskull.name=lebka krysy
items.trinkets.ratskull.stats_desc=Na současné úrovni se s tímto drobným předmětem pravděpodobně objeví vzácní exotičtí nepřátelé jako _%dx_. Lebka je však jen z poloviny tak účinná v přitahování křišťálových napodobenin a obrněných soch.
items.trinkets.ratskull.typical_stats_desc=Tento drobný předmět obvykle způsobí, že se vzácní exotičtí nepřátelé objeví s menší pravděpodobností než _%dx_. Lebka je však jen z poloviny tak účinná v přitahování křišťálových napodobenin a obrněných soch.
items.trinkets.saltcube.desc=Tento velký krystal soli byl vybroušen do téměř dokonalého tvaru krychle a nějakým způsobem se mu podařilo odvést polovinu vody z alchymistické nádoby, místo aby se rozpustil. Zdá se, že magicky dehydratuje a konzervuje jídlo, které jíte, prodlužuje pocit sytosti, ale také snižuje regeneraci vašeho zdraví, když zrovna nehladovíte.
items.trinkets.saltcube.name=kostka soli
items.trinkets.saltcube.stats_desc=Na současné úrovni tento drobný předmět prodlouží dobu, než dostanete hlad, o _%1$s%%_, ale také sníží rychlost regenerace zdraví o _%2$s%%_, pokud není podlaha zamčená.
items.trinkets.saltcube.typical_stats_desc=Tato drobnost obvykle prodlouží dobu, než dostanete hlad, o _%1$s%%_, ale také sníží rychlost regenerace zdraví o _%2$s%%_, pokud není podlaha zamčená.
items.trinkets.shardofoblivion$thrownusetracker.desc=Nedávno jsi použil neidentifikovanou vrhací zbraň, což se počítá jako jeden kus použitého neidentifikovaného vybavení pro střep zapomnění na krátkou dobu. \n\nZbývající tahy: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Použitá neidentifikovaná vrhací zbraň
items.trinkets.shardofoblivion$wandusetracker.desc=Nedávno jsi použil/a neidentifikovanou hůlku, což se počítá jako jeden kus použitého neidentifikovaného vybavení pro střep zapomnění na krátkou dobu. \n\nZbývající tahy: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Použitá neidentifikovaná hůlka
items.trinkets.shardofoblivion.ac_identify=IDENTIFIKOVAT
items.trinkets.shardofoblivion.desc=Poté, co se vařil v alchymistickém hrnci, se tento malý střep prokletého kovu změnil a je z... ničeho? Zdá se, že se kolem něj ohýbá světlo a když ho nedržíte, vznáší se na místě. Zdá se, že střep magicky čerpá sílu z vaší nevědomosti, takže je asi nejlepší o něm moc nepřemýšlet.
items.trinkets.shardofoblivion.identify=Identifikujete položku!
items.trinkets.shardofoblivion.identify_not_yet=Tato položka ještě není připravena k identifikaci.
items.trinkets.shardofoblivion.identify_prompt=Identifikace položky
items.trinkets.shardofoblivion.identify_ready=Předmět je připraven k identifikaci: %s. Použijte na něj svůj Střep zapomnění k jeho identifikaci.
items.trinkets.shardofoblivion.identify_ready_worn=Vaše opotřebované předměty jsou nyní připraveny k identifikaci. Použijte na předměty Střep zapomnění k jejich identifikaci.
items.trinkets.shardofoblivion.name=střep zapomnění
items.trinkets.shardofoblivion.stats_desc=Na současné úrovni tento trinket zvýší rychlost, s jakou nepřátelé shazují kořist, o 20%% za každý kus neidentifikovaného vybavení, které jste si vybavili nebo nedávno použili, maximálně však na _%d předmět(ů)_. Střep vám také zabrání v identifikaci vybavení, ale lze jej použít k ruční identifikaci předmětů, které jsou na něj připraveny.
items.trinkets.shardofoblivion.typical_stats_desc=Tento drobný předmět obvykle zvýší rychlost, s jakou nepřátelé shazují kořist, o 20%% za každý kus neidentifikovaného vybavení, které jste si vybavili nebo nedávno použili, maximálně však do _%d předmětu(ů)_. Střep vám také zabrání v identifikaci vybavení, ale lze jej použít k ruční identifikaci předmětů, které jsou na to připraveny.
items.trinkets.thirteenleafclover.desc=Nějak se povaření v alchymistickém hrnci podařilo tomuto jetelu narůst spoustu dalších listů! Není zcela jasné, jestli je tento drobný předmět šťastný nebo nešťastný, možná vám štěstí ještě více zkomplikuje?
items.trinkets.thirteenleafclover.name=třináctilistý jetel
items.trinkets.thirteenleafclover.stats_desc=Na současné úrovni vám tento trinket způsobí maximální poškození _%1$d%%_ v daném okamžiku a minimální poškození _%2$d%%_ v daném okamžiku.
items.trinkets.thirteenleafclover.typical_stats_desc=Tento drobný předmět obvykle způsobí maximální poškození _%1$d%%_ v daném okamžiku a minimální poškození _%2$d%%_ v daném okamžiku.
items.trinkets.trapmechanism.desc=Základní mechanismus jedné z pastí v dungeonu, pečlivě vytesaný z podlahy, aby se dal přenášet. Zdá se, že je magicky svázán se samotným dungeonem, což sice zvyšuje výskyt nebezpečného terénu, ale zároveň zvyšuje vaši náklonnost k němu.
items.trinkets.trapmechanism.name=mechanismus pasti
items.trinkets.trapmechanism.stats_desc=Na současné úrovni tento trinket způsobí, že se _%1$d%%_ netematických podlaží zaplní buď pastmi, nebo propastmi. Navíc budou místo toho viditelné _%2$d%%_ ze skrytých pastí v dungeonu.
items.trinkets.trapmechanism.typical_stats_desc=Tento drobný předmět obvykle způsobí, že se _%1$d%%_ netematických podlaží zaplní buď pastmi, nebo propastmi. Navíc se místo toho zviditelní _%2$d%%_ ze skrytých pastí v dungeonu.
items.trinkets.trinket$placeholder.name=tretka
items.trinkets.trinket.discover_hint=Tato položka má šanci být dostupná při výrobě drobnosti pomocí alchymie.
items.trinkets.trinketcatalyst$randomtrinket.desc=Jeden předmět poblíž je zaseknutý uvnitř váčku, který nemůžete otevřít.\n\nAlchymistický proces váček rozpustí, ale dokud to neuděláte, nebudete vědět, jakou cetku získáte!
items.trinkets.trinketcatalyst$randomtrinket.name=náhodný drobný předmět
items.trinkets.trinketcatalyst.desc=Tato koule magického zlatého prachu se třpytí v temnotě jeskyně. Tento katalyzátor lze s trochou alchymistické energie použít v alchymistickém kotli k výrobě unikátního drobného předmětu.\n\nDrobné předměty poskytují různé efekty, které mírně mění jeskyni nebo její obyvatele. Drobné předměty lze vylepšit o více energie, aby se jejich účinek zesílil, nebo je lze odhodit, aby se efektu úplně vzdali.
items.trinkets.trinketcatalyst.name=magický katalyzátor
items.trinkets.trinketcatalyst.window_text=Voda začne zářit, jakmile přidáte katalyzátor. V okolí je několik předmětů, kterým můžete dodat energii a proměnit je v magický suvenýr.
items.trinkets.trinketcatalyst.window_title=vytvořit drobnost
items.trinkets.vialofblood.desc=Tato tenká lahvička obsahuje krev nějakého obyvatele podzemí a při otáčení se pomalu pohybuje. Zdá se, že magicky zesiluje léčivé účinky, ale zároveň je oddaluje.
items.trinkets.vialofblood.name=lahvička s krví
items.trinkets.vialofblood.stats_desc=Na současné úrovni tento drobný předmět zvýší celkové zdraví, které získáte pitím léčivých lektvarů, měchů s vodou nebo studní zdraví, o _%1$s%%_. Tyto léčivé účinky se však budou projevovat také pomaleji a regenerují maximálně _%2$s_ HP za kolo (toto se škáluje s úrovní hrdiny).
items.trinkets.vialofblood.typical_stats_desc=Tento drobný předmět obvykle zvýší celkové zdraví, které získáte pitím léčivých lektvarů, měchů s vodou nebo studní zdraví, o _%1$s%%_. Tyto léčivé účinky se však budou projevovat také pomaleji a regenerují maximálně _%2$s_ HP za kolo (toto se škáluje s úrovní hrdiny).
items.trinkets.wondrousresin.desc=Tato třpytivá modrá pryskyřice vypadá, jako by obsahovala destilovanou esenci magie prokleté hůlky. Magie z alchymistické nádoby ji poněkud stabilizovala a nyní ovlivňuje vaše hůlky.
items.trinkets.wondrousresin.name=úžasná pryskyřice
items.trinkets.wondrousresin.stats_desc=Na současné úrovni tento drobný předmět donutí efekty prokleté hůlky stát se neutrálními nebo pozitivními _%1$s%%_ dané doby a způsobí, že neprokleté hůlky vystřelí další neutrální nebo pozitivní prokletý zásah _%2$s%%_ dané doby.\n\nVylepšení tohoto drobného předmětu vyžaduje větší množství energie.
items.trinkets.wondrousresin.typical_stats_desc=Tento drobný předmět obvykle donutí efekty prokleté hůlky stát se neutrálními nebo pozitivními _%1$s%%_ dané doby a způsobí, že neprokleté hůlky vystřelí další neutrální nebo pozitivní prokletý zásah _%2$s%%_ dané doby.\n\nVylepšení tohoto drobného předmětu vyžaduje větší množství energie.
items.wands.cursedwand.disguise=Váš vzhled se mění před vašima očima!
items.wands.cursedwand.fire=Cítíš spáleninu...
items.wands.cursedwand.grass=Tráva kolem tebe raší!
items.wands.cursedwand.gravity=Gravitace se najednou začne táhnout náhodnými směry!
items.wands.cursedwand.gravity_end=Gravitační chaos končí.
items.wands.cursedwand.gravity_positive=Gravitace najednou začne působit náhodnými směry, ale zdá se, že vás to neovlivňuje.
items.wands.cursedwand.mass_invuln=Z tvé hůlky vyzařuje oslnivé světlo!
items.wands.cursedwand.nothing=Nic se neděje.
items.wands.cursedwand.ondeath=Zabil tě tvůj vlastní %s.
items.wands.cursedwand.petrify=Najednou ztuhneš na místě!
items.wands.cursedwand.sinkhole=Země kolem vás se začíná propadat!
items.wands.cursedwand.sinkhole_positive=Země se začíná propadat, ale pod vámi je dostatečně pevná.
items.wands.cursedwand.supernova=Začne růst planoucí koule energie. Možná byste měli utéct!
items.wands.cursedwand.supernova_positive=Planoucí koule energie začíná růst, ale nějakým způsobem působí bezpečně.
items.wands.cursedwand.transmogrify_other=Tvůj předmět se promění v něco jiného!
items.wands.cursedwand.transmogrify_wand=Tvoje hůlka se promění v jiný předmět!
items.wands.damagewand.upgrade_stat_name_1=Magické poškození
items.wands.wand$placeholder.name=hůlka
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Tento %s je prokletý!
items.wands.wand.cursed=Tato hůlka je prokletá, což její magii činí chaotickou a náhodnou.
items.wands.wand.fizzles=Tvoje hůlka syčí; asi nemá dostatek náboje.
items.wands.wand.identify=Nyní už svou hůlku dostatečně znáte, abyste ji poznali.
items.wands.wand.no_magic=Vaše hůlka se rozpadne; nemůžete používat hůlky, pokud jste imunní vůči magii.
items.wands.wand.not_cursed=Tato hůlka je prostá zlé magie.
items.wands.wand.prompt=Vyberte místo pro úder proudem
items.wands.wand.resin_many=Tato hůlka získala _%d úrovně_ z arkánní pryskyřice.
items.wands.wand.resin_one=Tato hůlka získala _1 úroveň_ z arkánní pryskyřice.
items.wands.wand.self_target=Nemůžeš se zaměřit na sebe!
items.wands.wandofblastwave.bmage_desc=Když _Bojový mág_ zasáhne paralyzovaného nepřítele holí tlakové vlny, pohltí paralýzu a způsobí mu dávku bonusového magického poškození. Toto má krátkou dobu přebíjení na nepřítele.
items.wands.wandofblastwave.desc=Tato hůlka je vyrobena z jakéhosi mramorovaného kamene se zlatým lemováním a kulatým černým drahokamem na špičce. V ruce působí velmi těžce.
items.wands.wandofblastwave.eleblast_desc=Elementární výbuch s holí tlakové vlny způsobí 67% poškození a odhodí všechny nepřátele mimo oblast výbuchu.
items.wands.wandofblastwave.knockback_ondeath=Ta srážka tě zabila...
items.wands.wandofblastwave.name=hůlka tlakové vlny
items.wands.wandofblastwave.ondeath=Zabil ses vlastní Hůlkou tlakové vlny...
items.wands.wandofblastwave.staff_name=zaměstnanci tlakové vlny
items.wands.wandofblastwave.stats_desc=Tato hůlka vystřelí šíp, který prudce exploduje na cílovém místě. Síla tohoto výbuchu způsobí _%1$d-%2$d poškození_ a je dostatečně silná, aby většinu nepřátel vyhodila do vzduchu.
items.wands.wandofblastwave.typical_stats_desc=Tato hůlka vystřelí šíp, který prudce exploduje na cílovém místě. Síla tohoto výbuchu obvykle způsobí _%1$d-%2$d poškození_ a je dostatečně silná, aby většinu nepřátel vyhodila do vzduchu.
items.wands.wandofblastwave.upgrade_stat_name_2=Odražení
items.wands.wandofcorrosion.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí z koroze, má nepřítel šanci, že se otráví.
items.wands.wandofcorrosion.desc=Tato hůlka má popelavě bledé tělo, které se otevírá do zářivě oranžového drahokamu.
items.wands.wandofcorrosion.eleblast_desc=Elementární výbuch s holí koroze způsobí nepřátelům 4 kola koroze, počínaje na 6 bodech poškození.
items.wands.wandofcorrosion.name=hůlka koroze
items.wands.wandofcorrosion.staff_name=personál koroze
items.wands.wandofcorrosion.stats_desc=Tato hůlka vystřelí šíp, který exploduje a na cílovém místě se rozvine oblak vysoce korozivního plynu. Všechno, co se dostane do tohoto oblaku, bude časem utrpět rostoucí poškození, počínaje poškozením _%d._
items.wands.wandofcorrosion.upgrade_stat_name_1=Poškození korozí
items.wands.wandofcorrosion.upgrade_stat_name_2=Objem plynu
items.wands.wandofcorruption.already_corrupted=Tuto postavu nelze dále ovlivnit.
items.wands.wandofcorruption.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí zkázy, má nepřítel šanci se otrávit.
items.wands.wandofcorruption.desc=Tato hůlka vyzařuje chaotickou temnou energii, pokud to již nebylo zřejmé z malé ozdobné lebky ve tvaru její špičky.
items.wands.wandofcorruption.eleblast_desc=Elementární výbuch holí zkázy způsobí nepřátelům 5 kol amoku.
items.wands.wandofcorruption.name=hůlka korupce
items.wands.wandofcorruption.staff_name=zaměstnanci korupce
items.wands.wandofcorruption.stats_desc=Tato hůlka uvolní výbuch zkažené energie, která nepřátele zneškodní a nakonec je podmaní vaší vůli. Nepřátelé jsou schopni zkažení odolat, ale oslabení nepřátelé se mnohem snáze zkazí než ti zdraví.
items.wands.wandofcorruption.upgrade_stat_name_1=Zkorumpovaná moc
items.wands.wandofcorruption.upgrade_stat_name_2=Trvání debuffu
items.wands.wandofdisintegration.bmage_desc=Když ji drží _Bojový mág_, hůl rozkladu má zvýšený dosah útoku, jako by měla vyčnívající kouzlo.
items.wands.wandofdisintegration.desc=Tato hůlka je vyrobena z pevného hladkého kusu obsidiánu, po jehož boku stéká tmavě fialové světlo končící na špičce. Září ničivou energií a čeká, až vystřelí vpřed.
items.wands.wandofdisintegration.eleblast_desc=Elementární výbuch s holí rozkladu způsobí 100% poškození a prorazí zdi.
items.wands.wandofdisintegration.name=hůlka rozkladu
items.wands.wandofdisintegration.staff_name=personál rozpadu
items.wands.wandofdisintegration.stats_desc=Tato hůlka vystřeluje paprsek, který prorazí jakoukoli překážku a s vylepšením doletí dále. Paprsek způsobuje poškození _%1$d-%2$d_ a také bonusové poškození za každého nepřítele a zeď, kterou prorazí.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maximální dosah
items.wands.wandoffireblast.bmage_desc=Když _Bojový mág_ zasáhne nepřítele ohnivou holí, existuje šance, že způsobí explozi, která nepřátelům způsobí poškození a spotřebuje veškerý oheň v okolí! Tato šance se zvyšuje s větším množstvím ohně v blízkosti nepřítele.
items.wands.wandoffireblast.desc=Tato hůlka je vyrobena z červeně lakovaného dřeva s hojným použitím zlatých lístků, které jí dodávají vznešený vzhled. Na špičce praská a syčí, dychtivá uvolnit svou mocnou magii.
items.wands.wandoffireblast.eleblast_desc=Elementární výbuch s ohnivou holí způsobí 100% poškození, vyrazí dveře a zapálí nepřátele i terén.
items.wands.wandoffireblast.name=hůlka ohnivého výbuchu
items.wands.wandoffireblast.staff_name=zaměstnanci ohnivého výbuchu
items.wands.wandoffireblast.stats_desc=Tato hůlka při použití vystřelí ohnivý kužel. Její další útok spotřebuje _%1$d náboje_ a způsobí _%2$d-%3$d poškození._ Čím více nábojů hůlka použije, tím větší a silnější je účinek.
items.wands.wandoffireblast.upgrade_stat_name_1=Poškození 1 nabitím
items.wands.wandoffireblast.upgrade_stat_name_2=2 Poškození nabitím
items.wands.wandoffireblast.upgrade_stat_name_3=Poškození 3 nabitími
items.wands.wandoffrost.bmage_desc=Když _Bojový mág_ zasáhne zmrazeného nepřítele holí mrazu, má šanci okamžitě zmrazit. Tato šance se zvyšuje, čím více je nepřítel zmrazen.
items.wands.wandoffrost.desc=Tato hůlka vypadá, jako by byla vyrobena z nějakého magického ledu. Směrem ke svému zaoblenému konci se rozzáří. Když ji držíte v ruce, je velmi studená, ale ruka vám nějakým způsobem zůstává teplá.
items.wands.wandoffrost.eleblast_desc=Elementární výbuch s holí mrazu způsobí 100% poškození, zmrazí nepřátele a uhasí požáry.
items.wands.wandoffrost.name=hůlka mrazu
items.wands.wandoffrost.staff_name=hůl mrazu
items.wands.wandoffrost.stats_desc=Tato hůlka vystřeluje na nepřátele paprsky ledové energie, které jim způsobují _%1$d-%2$d poškození_ a mrazí je. Ve vodě se zdá, že účinek je silnější. Nepřátelé, kteří jsou již zchlazeni nebo zmrzlí, utrpí od této hůlky menší poškození.
items.wands.wandoffrost.upgrade_stat_name_2=Trvání chladu
items.wands.wandoflightning$lightningcharge.desc=Bojový mág je momentálně nabitý energií, což mu dává imunitu vůči jeho hůli blesků a zvyšuje dosah, na který z ní blesk může vystřelit. \n\nZbývající tahy: %s.
items.wands.wandoflightning$lightningcharge.name=Elektricky nabité
items.wands.wandoflightning.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí blesku, má šanci se na 10 kol elektricky nabít. Dokud je bojový mág nabitý, je imunní vůči poškození bleskem a bude dále sesílat bleskové oblouky.
items.wands.wandoflightning.desc=Tato hůlka je vyrobena z masivního kovu, takže je překvapivě těžká. Dva hroty se na špičce zakřivují k sobě a mezi nimi vzniká elektrický oblouk.
items.wands.wandoflightning.eleblast_desc=Elementární výbuch bleskové hole způsobí 100% poškození, omráčí nepřátele na 5 kol a elektrizuje vodu.
items.wands.wandoflightning.name=hůlka blesku
items.wands.wandoflightning.ondeath=Zabil ses sám svou vlastní Hůlkou blesku...
items.wands.wandoflightning.staff_name=hůl blesku
items.wands.wandoflightning.stats_desc=Tato hůlka vysílá silný blesk skrz cokoli, na co je vystřelena, a způsobuje poškození _%1$d-%2$d._ Tato elektřina se bude šířit do blízkých postav a snáze se šíří ve vodě. Oblouky z této hůlky mohou způsobit poškození vám, ale nezraní vaše spojence.
items.wands.wandoflivingearth$earthguardian.desc=Kameny z tvé hůlky živoucí země se zformovaly do ochranného hliněného strážce! Tento skalní ochránce zaútočí na blízké nepřátele, což je donutí zaútočit na strážce místo na tebe. Jakmile všechny blízké hrozby zmizí, strážce se kolem tebe znovu zformuje a vrátí se, až příště použiješ svou hůlku.
items.wands.wandoflivingearth$earthguardian.discover_hint=Tuto postavu najdete pomocí specifické hůlky.
items.wands.wandoflivingearth$earthguardian.name=hliněný strážce
items.wands.wandoflivingearth$earthguardian.wand_info=Obranná síla strážce je vázána na úroveň vaší hůlky. Aktuálně blokuje poškození _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Tělo obklopují magické kameny. Když jste napadeni, pokusí se vás zablokovat a sníží vám způsobené poškození o 50 bodů. Každé zablokované poškození však část kamene seškrábe. \n\nZbývající brnění: %1$d. \n\nPokud se kolem vás vytvoří dostatek kamení, další výstřel z vaší hůlky živé země způsobí, že se kameny zformují do strážce, který s vámi bude bojovat. \n\nZbrnění potřebné pro strážce: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Tento zemský strážce také těží z Moci mnoha. Zbývající tahy: %d.
items.wands.wandoflivingearth$rockarmor.name=skalní brnění
items.wands.wandoflivingearth.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí z živoucí země, část způsobeného poškození se vrátí jako kamenné brnění.
items.wands.wandoflivingearth.desc=Tato hůlka je vyrobena z kuriózní horniny s pruhy zářící žluté energie. Kameny se při uchopení hůlky mírně posouvají, jako by cítily vaši ruku.
items.wands.wandoflivingearth.eleblast_desc=Elementární výbuch holí živoucí země způsobí 50% poškození a za každého zasaženého nepřítele vyléčí aktivního zemského strážce.
items.wands.wandoflivingearth.name=hůlka živoucí země
items.wands.wandoflivingearth.staff_name=hůl živé země
items.wands.wandoflivingearth.stats_desc=Tato hůlka vysílá na nepřátele magické kamenné záblesky, které způsobují poškození _%1$d-%2$d._ Kameny se poté kolem uživatele přetvoří a poskytnou mu brnění úměrné způsobenému poškození. Pokud je vybudováno dostatečné brnění, při dalším úderu hůlkou se z něj stane kamenný strážce.
items.wands.wandoflivingearth.upgrade_stat_name_2=Maximální HP strážce
items.wands.wandoflivingearth.upgrade_stat_name_3=Blokování strážců
items.wands.wandofmagicmissile$magiccharge.desc=Vaše hůlka magické střely vrátila energii zpět do vašich hůlek a zvýšila tak efektivní úroveň dalšího zásahu, který provedou. \n\nVaše hůlky jsou posíleny na: +%d.\n\nZbývající tahy magického náboje: %s.
items.wands.wandofmagicmissile$magiccharge.name=magický náboj
items.wands.wandofmagicmissile.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí magické střely, všechny jeho hůlky kromě jeho hole získají náboj.
items.wands.wandofmagicmissile.desc=Tato poměrně obyčejná hůlka vystřeluje střely čisté magické energie. I když hůlka samotná postrádá jakékoli speciální efekty, má více dostupných nábojů a po vylepšení dokáže krátkodobě posílit ostatní hůlky.
items.wands.wandofmagicmissile.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.wands.wandofmagicmissile.eleblast_desc=Elementární výbuch magickou střelou v podobě hole způsobí 50% poškození a poskytne mágovi 15 kol nabití.
items.wands.wandofmagicmissile.name=hůlka magické střely
items.wands.wandofmagicmissile.staff_name=hůl magické střely
items.wands.wandofmagicmissile.stats_desc=Každý výboj z této hůlky způsobí poškození o _%1$d-%2$d_ a po vylepšení krátce posílí ostatní hůlky.
items.wands.wandofprismaticlight.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí z prizmatického světla, bude tento na dobu určitou zmrzačený a bude záviset na jeho úrovni.
items.wands.wandofprismaticlight.desc=Tato hůlka je vyrobena z pevného kusu průsvitného křišťálu, podobného dlouhému kusu hladkého skla. Kolem špičky hůlky tančí malé kousky barevného světla, dychtivé vybuchnout.
items.wands.wandofprismaticlight.eleblast_desc=Elementární výbuch s holí prizmatického světla způsobí 67% poškození, odhalí veškerý terén v záběru a oslepí nepřátele na 5 kol.
items.wands.wandofprismaticlight.name=hůlka prizmatického světla
items.wands.wandofprismaticlight.staff_name=hůl hranolového světla
items.wands.wandofprismaticlight.stats_desc=Tato hůlka vystřeluje paprsky světla, které prořezávají temnotu podzemí a odhalují skryté oblasti a pasti. Paprsek může oslepit nepřátele a způsobuje poškození _%1$d-%2$d._ Démoničtí a nemrtví nepřátelé budou v jasném světle hůlky hořet a utrpí bonusové poškození.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Slepá šance
items.wands.wandofprismaticlight.upgrade_stat_name_3=Trvání světla
items.wands.wandofregrowth$dewcatcher.desc=Lapače rosy jsou úžasné rostliny, které se samy plní magickou rosou. Snaží se maskovat jako tráva, aby se vyhnuly pozornosti, ale jejich boule nashromážděné rosy je prozrazují.
items.wands.wandofregrowth$dewcatcher.discover_hint=Tuto rostlinu najdete pomocí speciální hůlky.
items.wands.wandofregrowth$dewcatcher.name=Lapač rosy
items.wands.wandofregrowth$lotus.desc=Zlatý lotos je mystická rostlina, kterou lze vykouzlit pouze mocným mávnutím hůlky. Jeho aura zesiluje všechny rostliny a rostlinné účinky, ale jeho energii spálí a po krátké době umírá.
items.wands.wandofregrowth$lotus.discover_hint=Tuto rostlinu najdete pomocí specifické hůlky, kterou několikrát vylepšíte.
items.wands.wandofregrowth$lotus.name=Zlatý lotos
items.wands.wandofregrowth$lotus.wand_info=Tento lotos byl vytvořen pomocí hůlky opětovného růstu _+%1$d_. Všechny rostliny v jeho efektu se _okamžitě spustí_, pokud jsou zasazeny na postavě. Rostliny budou mít také _%2$d%% šanci_ upustit svá semínka a šipky s hrotem budou mít _%3$d%% menší odolnost_.
items.wands.wandofregrowth$seedpod.desc=Semenné lusky jsou magické rostliny, které produkují semena z jiných druhů rostlin, nikoli z vlastních semen. Nějak se jim daří šířit se, i když nemají vlastní semena.
items.wands.wandofregrowth$seedpod.discover_hint=Tuto rostlinu najdete pomocí speciální hůlky.
items.wands.wandofregrowth$seedpod.name=Semenný lusk
items.wands.wandofregrowth.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí regenerace a jeden z nich stojí na trávě, získá bylinné léčení úměrné způsobenému poškození.
items.wands.wandofregrowth.degradation=Po dalším nabití _%d_ tato hůlka přestane produkovat rostliny a čerstvou trávu. Tento limit se zvyšuje zvyšováním úrovně nebo vylepšením hůlky.
items.wands.wandofregrowth.desc=Tato hůlka je vyrobena z tenké dříky mistrně vyřezávaného dřeva. Nějak je stále živá a zářivá, jasně zelená jako jádro mladého stromu. „Když život skončí, vždycky začne růst nový... Věčný cyklus vždycky přetrvává!“
items.wands.wandofregrowth.eleblast_desc=Elementární výbuch s holí regenerace zakoření nepřátele a náhodně naroste tráva v oblasti výbuchů.
items.wands.wandofregrowth.name=hůlka opětovného růstu
items.wands.wandofregrowth.staff_name=zaměstnanci opětovného růstu
items.wands.wandofregrowth.stats_desc=Při použití tato hůlka vystřelí magickou energii opětovného růstu v kuželu, čímž oživí trávu, kořeny a vzácné rostliny. Další zásah spotřebuje _%1$d náboje_. Čím více nábojů hůlka použije, tím větší a silnější je efekt.
items.wands.wandofregrowth.upgrade_stat_name_1=Tráva na jedno nabití
items.wands.wandofregrowth.upgrade_stat_name_2=Celkový limit trávy
items.wands.wandoftransfusion.bmage_desc=Když _Bojový mág_ zasáhne očarovaného nepřítele holí transfuze, získá štít a jeho další zásah holí ho nebude stát žádné zdraví.
items.wands.wandoftransfusion.charged=Tvoje hůl je nabitá životní energií tvého nepřítele!
items.wands.wandoftransfusion.desc=Hůlka poměrně jednoduchého tvaru vyniká svým purpurovým odstínem a černým drahokamem na špičce.
items.wands.wandoftransfusion.eleblast_desc=Elementární výbuch s holí transfuze okouzlí nepřátele, léčí spojence a způsobí 100% poškození nemrtvým nepřátelům.
items.wands.wandoftransfusion.name=transfuzní hůlka
items.wands.wandoftransfusion.ondeath=Zabil ses vlastní transfuzní hůlkou...
items.wands.wandoftransfusion.staff_name=personál transfuze
items.wands.wandoftransfusion.stats_desc=Při použití na spojencích nebo očarovaných nepřátelích tato hůlka vysává _%1$d zdraví uživatele_, aby spojence vyléčila nebo mu poskytla štít na _%2$d zdraví._ Při použití na nepřátele je hůlka krátce očaruje a zároveň na uživatele aplikuje štít _%3$d_. Nepřátelští nemrtví utrpí _%4$d-%5$d poškození_ místo aby byli očarováni.
items.wands.wandoftransfusion.upgrade_stat_name_1=Spojenecké léčení
items.wands.wandoftransfusion.upgrade_stat_name_2=Samoochrana
items.wands.wandoftransfusion.upgrade_stat_name_3=Poškození nemrtvých
items.wands.wandofwarding$ward.desc_1=Tato základní ochrana automaticky zasáhne každého nepřítele, který se dostane do jejího zorného pole, a způsobí mu poškození _%1$d-%2$d._\n\nZasažení této ochrany vaší ochrannou hůlkou ji vylepší.\n\nTato ochrana zasáhne pouze jednou, než se rozptýlí.\n\nVaše ochranná hůlka spotřebovává k udržení této ochrany energii _%3$d.
items.wands.wandofwarding$ward.desc_2=Tato vylepšená ochrana má složitější strukturu a může útočit vícekrát. Každý zásah touto ochranou způsobí poškození _%1$d-%2$d._\n\nZasažení této ochrany vaší ochrannou hůlkou ji vylepší.\n\nTato ochrana způsobí tři zásahy, než se rozptýlí.\n\nVaše ochranná hůlka spotřebovává k udržení této ochrany energii _%3$d_.
items.wands.wandofwarding$ward.desc_3=Tato plně vylepšená ochrana je schopna útočit vícekrát než její předchůdci. Každý zásah touto ochranou způsobí poškození _%1$d-%2$d._\n\nZasažení této ochrany vaší ochrannou hůlkou ji vylepší.\n\nTato ochrana způsobí pět zásahů, než se rozptýlí.\n\nVaše ochranná hůlka spotřebovává k udržení této ochrany energii _%3$d_.
items.wands.wandofwarding$ward.desc_4=Tato menší strážná má stejnou palebnou sílu jako větší strážná, ale místo pevného počtu nábojů má zdraví. Podobá se drahokamu na špičce vaší ochranné hůlky. Každý zásah touto strážnou způsobí poškození _%1$d-%2$d._\n\nZasažení této strážné vaší ochranné hůlkou ji vylepší a vyléčí.\n\nTato strážná spotřebuje určité množství zdraví pokaždé, když zasáhne nepřítele, ale lze ji vyléčit použitím ochranné hůlky.\n\nVaše ochranná hůlka spotřebovává _%3$d energii_ k udržení této strážné.
items.wands.wandofwarding$ward.desc_5=Tento vylepšený strážný je větší a odolnější než slabší strážný. Každý zásah tímto strážným způsobí poškození _%1$d-%2$d._\n\nZasažení tohoto strážného vaší ochrannou hůlkou ho vylepší a vyléčí.\n\nTento strážný spotřebuje určité množství zdraví pokaždé, když zasáhne nepřítele, ale lze ho vyléčit použitím vaší ochranné hůlky.\n\nVaše ochranná hůlka spotřebovává _%3$d energii_ k udržení tohoto strážného v chodu.
items.wands.wandofwarding$ward.desc_6=Tato plně vylepšená stráž je výrazně odolnější než její předchůdci. Každý zásah tímto strážcem způsobí poškození _%1$d-%2$d._\n\nZasažení tohoto strážce vaší ochrannou hůlkou ho vyléčí.\n\nTento strážce spotřebuje určité množství zdraví pokaždé, když zasáhne nepřítele, ale lze ho vyléčit použitím vaší ochranné hůlky.\n\nVaše ochranná hůlka spotřebovává _%3$d energii_ k udržení tohoto strážce v chodu.
items.wands.wandofwarding$ward.desc_generic_sentry=Tento strážný má stejnou palebnou sílu jako touha, ale místo pevného počtu nábojů má zdraví. Připomíná drahokam na špičce vaší touhy.\n\nZasažení tohoto strážného vaší touhou ho vylepší a vyléčí ho.\n\nTento strážný spotřebuje určité zdraví pokaždé, když zasáhne nepřítele, ale lze ho vyléčit použitím vaší touhy.
items.wands.wandofwarding$ward.desc_generic_ward=Tento totem automaticky zasáhne každého nepřítele, který se dostane do jeho zorného pole.\n\nZasáhnutí tohoto totemu vaší touhou ho vylepší.\n\nTotemy mají omezený počet zasáhnutí, než se rozptýlí.
items.wands.wandofwarding$ward.discover_hint=Tuto postavu najdete pomocí specifické hůlky.
items.wands.wandofwarding$ward.dismiss_body=Pokud již nechcete, aby vaše hůlka udržovala toto totem, můžete ho rozptýlit. Tímto způsobem totem okamžitě zničíte. \n\nZrušit toto totem?
items.wands.wandofwarding$ward.dismiss_cancel=žádný
items.wands.wandofwarding$ward.dismiss_confirm=Ano
items.wands.wandofwarding$ward.dismiss_title=Zavřít toto oddělení?
items.wands.wandofwarding$ward.name_1=menší oddělení
items.wands.wandofwarding$ward.name_2=oddělení
items.wands.wandofwarding$ward.name_3=větší oddělení
items.wands.wandofwarding$ward.name_4=menší strážný
items.wands.wandofwarding$ward.name_5=hlídka
items.wands.wandofwarding$ward.name_6=větší strážce
items.wands.wandofwarding.bad_location=Tam nemůžete umístit ward.
items.wands.wandofwarding.bmage_desc=Když _Bojový mág_ zasáhne nepřítele holí ochrany, všechny aktivní ochrany a stráže mají šanci na uzdravení.
items.wands.wandofwarding.desc=Tato krátká kovová hůlka má nad špičkou vznášející se jasně fialový drahokam.
items.wands.wandofwarding.eleblast_desc=Elementární výbuch s ochrannou holí vyléčí všechny ochranky a stráže v oblasti výbuchu.
items.wands.wandofwarding.name=ochranná hůlka
items.wands.wandofwarding.no_more_wards=Tvoje hůlka už žádné další touhy neunese.
items.wands.wandofwarding.staff_name=personál hlídky
items.wands.wandofwarding.stats_desc=Místo přímého poškození nepřítele tato hůlka vyvolává stacionární touhy a stráže. Touhy lze vyvolat kdekoli, dokonce i skrz zdi, pokud máte zrak. Tato hůlka dokáže najednou udržet touhy v hodnotě _%d energie_.
items.wands.wandofwarding.upgrade_stat_name_1=Poškození wardů
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=PITÍ
items.waterskin.collected=Sbíráš kapku rosy do svého měchu s vodou.
items.waterskin.desc=Nádoba na tekutinu, vyrobená z kůže a provázku, uzavřená korkovou zátkou.
items.waterskin.desc_full=Zdá se, že plný měch s vodou vyzařuje energii, možná by se dal použít k požehnání jinému předmětu pro přežití?
items.waterskin.desc_heal=Měch se v současné době používá k uchovávání léčivé vody. Čím je měch naplněnější, tím více se okamžitě uzdravíte, když z něj pijete. Vypijete jen tolik, kolik potřebujete.
items.waterskin.desc_water=Právě teď měch na vodu obsahuje jen obyčejnou pitnou vodu. V podzemí jistě najdeme něco, co by se v něm dalo uskladnit.
items.waterskin.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.waterskin.empty=Tvůj měch na vodu je prázdný!
items.waterskin.full=Tvůj měch je plný!
items.waterskin.name=měch na vodu
items.weapon.curses.annoying.desc=Otravné zbraně sice mluvit mohou, ale jsou trochu moc energické. Často na vás neúmyslně upoutají pozornost.
items.weapon.curses.annoying.elestrike_desc=Elementární úder s otravnou kletbou má 20% šanci zneškodnit každého nepřítele v dosahu na 6 kol.
items.weapon.curses.annoying.msg_1=JÉÉÉ, HAJUJEME SE S NĚČÍM?!
items.weapon.curses.annoying.msg_10=DOBŘE ZASAŽENO!
items.weapon.curses.annoying.msg_11=Nechtěl jsem být zbraní, chtěl jsem být dřevorubcovou sekerou.
items.weapon.curses.annoying.msg_12=Pamatujte, že přehnaná sebedůvěra je pomalý a zákeřný zabiják.
items.weapon.curses.annoying.msg_13=VŠECHNY VAŠE ZÁKLADNY PATŘÍ NÁM!
items.weapon.curses.annoying.msg_2=JO, ZÍSKEJTE JE!
