items.artifacts.lloydsbeacon.creatures=Psychická aura okolních tvorů ti v tuto chvíli nedovoluje použít Lloydův maják.
items.artifacts.lloydsbeacon.desc=Lloydův maják je složité magické zařízení, které uživateli umožňuje ovládat teleportační magii. Maják lze použít k návratu na určené místo, ale po nabití z vybavení může také vyslat náhodné výboje teleportační magie. Tuto magii lze namířit na cíl nebo na samotného uživatele.
items.artifacts.lloydsbeacon.desc_set=Tento maják byl umístěn někde na úrovni %d v Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Tvůj maják sílí!
items.artifacts.lloydsbeacon.name=Lloydův maják
items.artifacts.lloydsbeacon.no_charge=Váš maják momentálně nemá dostatek energie.
items.artifacts.lloydsbeacon.preventing=Silná magická aura tohoto místa vám brání v použití Lloydova majáku!
items.artifacts.lloydsbeacon.prompt=Vyberte místo pro úder.
items.artifacts.lloydsbeacon.return=Lloydův maják byl úspěšně nastaven na vaši aktuální pozici, nyní se sem můžete kdykoli vrátit.
items.artifacts.lloydsbeacon.tele_fail=Teleportační magie selhala.
items.artifacts.masterthievesarmband.ac_steal=UKRÁST
items.artifacts.masterthievesarmband.cursed=Nemůžeš použít prokletou pásku na ruku.
items.artifacts.masterthievesarmband.desc=Tento fialový sametový náramek nese znamení mistra zloděje. Nepatří tobě, ale pravděpodobně nepatřil ani svému poslednímu uživateli.
items.artifacts.masterthievesarmband.desc_cursed=Prokletá páska je ti přivázaná k zápěstí a tvůj měšec se zlatem se zdá být pomalu lehčí...
items.artifacts.masterthievesarmband.desc_worn=S rostoucími zkušenostmi cítíte v náramku na zápěstí sílu. Tuto schopnost můžete použít ke krádeži z obchodů nebo k okrádání nepřátel!\n\nOkrádání nepřátel probíhá okamžitě, na chvíli je dezorientuje a dává vám šanci získat jakoukoli kořist, kterou mají! Tato schopnost je účinnější proti nevědomým nepřátelům. Vícenásobné okrádání stejného nepřítele nedává více šancí na kořist.
items.artifacts.masterthievesarmband.failed_steal=Nic se ti nepodařilo ukrást.
items.artifacts.masterthievesarmband.full=Váš náramek je plně nabitý!
items.artifacts.masterthievesarmband.level_up=Tvůj náramek sílí!
items.artifacts.masterthievesarmband.name=páska mistra zlodějů
items.artifacts.masterthievesarmband.no_charge=Váš náramek není dostatečně nabitý.
items.artifacts.masterthievesarmband.no_steal=Ten nepřítel nemá co ukrást.
items.artifacts.masterthievesarmband.no_target=Musíte se zaměřit na nepřítele, který je vedle vás.
items.artifacts.masterthievesarmband.prompt=Vyberte si nepřítele, na kterého se zaměříte
items.artifacts.masterthievesarmband.steal_shopkeeper=Nemůžete krást přímo od obchodníků.
items.artifacts.masterthievesarmband.stole_item=Ukradl jsi předmět: %s.
items.artifacts.sandalsofnature.absorb_seed=Obuv absorbuje semínka, vypadá zdravěji.
items.artifacts.sandalsofnature.ac_feed=KRMIVO
items.artifacts.sandalsofnature.ac_root=VYKOŘENIT
items.artifacts.sandalsofnature.desc_1=Co se zpočátku jeví jako sandály z provázku, jsou ve skutečnosti dvě rostliny! Vypadají velmi slabě a bledě, možná potřebují dodat živiny?
items.artifacts.sandalsofnature.desc_2=Obuv povyrostla a nyní se více podobá dvěma střevíčkům na míru. Vrátila se jí trochu barvy, možná může ještě vyrůst?
items.artifacts.sandalsofnature.desc_3=Rostliny znovu vyrostly a nyní připomínají pár pevných bot vyrobených z kůry. Zdá se, že rostliny znovu nabraly sílu, ale možná ještě dokážou růst dál?
items.artifacts.sandalsofnature.desc_4=Rostliny zřejmě dosáhly své maximální velikosti, připomínají dvojici obrněných škvarníků. Švarcové střevy jsou tmavě hnědé a připomínají velmi robustní strom.
items.artifacts.sandalsofnature.desc_ability=Obuv se vlní barvou posledního semínka, kterým jste je nakrmili. Mohou krátce zakořenit v zemi a vyvolat efekt dané rostliny kdekoli v okruhu 3 políček.\nSemínko: _%s_\nPotřebné nabití: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Prokleté sandály blokují jakékoli naladění s přírodou.
items.artifacts.sandalsofnature.desc_hint=S tímto artefaktem se cítíte více v souladu s přírodou.
items.artifacts.sandalsofnature.desc_seeds=Nakrmil jsi obuv semínky %d.
items.artifacts.sandalsofnature.levelup=Vaše boty se zvětší!
items.artifacts.sandalsofnature.low_charge=Vaše obuv na to nemá dostatek energie.
items.artifacts.sandalsofnature.name=sandály z přírody
items.artifacts.sandalsofnature.name_1=boty přírody
items.artifacts.sandalsofnature.name_2=boty přírody
items.artifacts.sandalsofnature.name_3=škvarky přírody
items.artifacts.sandalsofnature.no_effect=Nejprve musíte do své obuvi přivést semínko.
items.artifacts.sandalsofnature.out_of_range=Toto místo je mimo dosah.
items.artifacts.sandalsofnature.prompt=Vyberte semeno
items.artifacts.sandalsofnature.prompt_target=Vyberte místo
items.artifacts.skeletonkey$keywall.desc=Kostrový klíč sem umístil dočasnou magickou zeď.
items.artifacts.skeletonkey.ac_insert=VLOŽIT
items.artifacts.skeletonkey.crystal_charges=Otevření křišťálového zámku vyžaduje 5 nabití.
items.artifacts.skeletonkey.cursed=Nemůžeš použít prokletý kostrový klíč.
items.artifacts.skeletonkey.desc=Důležitě vypadající klíč s hlavicí ve tvaru lebky. Jeho zuby se zdají být pokaždé jiné, když se na ně podíváte.
items.artifacts.skeletonkey.desc_cursed=Zdá se, že prokletý klíč se aktivně vyhýbá zasunutí do jakéhokoli zámku a dokonce vám ztěžuje (ale ne znemožňuje) používání ostatních klíčů.
items.artifacts.skeletonkey.desc_worn=Zdá se, že tento magický klíč získává na síle, když ho používáte místo běžných klíčů od jeskyně. Lze jej vložit do téměř jakéhokoli zámku jeskyně a otevřít nebo zavřít ho, včetně dveří, které nikdy předtím nebyly zamčeny.\n\nKlíč lze dokonce použít na prázdném prostoru ve směru světových stran nebo diagonálně k „uzamčení“ vzduchu před vámi a vytvoření 3 dlaždic široké pevné zdi, která vydrží 10 tahů. Uzamčení odstrčí nepřátele, pokud je k tomu prostor.
items.artifacts.skeletonkey.discard=Zbavíte se přebytečných klíčů.
items.artifacts.skeletonkey.force_lock=Zámek bez tvého kostrového klíče zeslábl. Podaří se ti ho násilím otevřít.
items.artifacts.skeletonkey.gold_charges=Otevření zlatého zámku vyžaduje 2 nabití.
items.artifacts.skeletonkey.invalid_target=Tam se nedá nic zamykat ani odemykat.
items.artifacts.skeletonkey.iron_charges=Otevření běžného zámku vyžaduje 1 nabití.
items.artifacts.skeletonkey.levelup=Tvůj kostrový klíč sílí!
items.artifacts.skeletonkey.lock_charges=Zamčení dveří vyžaduje 2 náboje.
items.artifacts.skeletonkey.lock_no_space=Nemůžeš zamknout postavu uvnitř dveří!
items.artifacts.skeletonkey.locked_with_key=Ty dveře byly zamčené tvým kostrovým klíčem.
items.artifacts.skeletonkey.name=kostrový klíč
items.artifacts.skeletonkey.prompt=Vyberte cíl
items.artifacts.skeletonkey.wall_charges=Vytvoření dočasné zdi vyžaduje 2 nabití.
items.artifacts.skeletonkey.wont_open=Klíč z nějakého důvodu odmítá do tohoto zámku zasunout.
items.artifacts.talismanofforesight$foresight.desc=Cítíte se velmi nervózně, jako by se v blízkosti rýsovalo neviditelné nebezpečí.
items.artifacts.talismanofforesight$foresight.name=předvídavost
items.artifacts.talismanofforesight$foresight.uneasy=Cítíte se neklidně.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Hladký kámen s podivnými rytinami. Máte pocit, jako by sledoval všechno kolem vás a hledal cokoli skrytého.
items.artifacts.talismanofforesight.desc_cursed=Prokletý talisman na tebe upřeně hledí a otupuje ti smysly.
items.artifacts.talismanofforesight.desc_worn=Když držíte talisman, máte pocit, že se vám zostřují smysly. Talisman se s postupem času a objevováním skrytých dveří nebo pastí pomalu nabíjí. \n\nTalisman dokáže svůj náboj vynaložit na „věštění“ ve tvaru kužele, které odhalí všechna políčka a tajemství v prohledávané oblasti a na krátkou dobu vám poskytne zrak nepřátel a předmětů.
items.artifacts.talismanofforesight.full_charge=Tvůj Talisman je plně nabitý!
items.artifacts.talismanofforesight.levelup=Tvůj talisman sílí!
items.artifacts.talismanofforesight.low_charge=Talisman vyžaduje k věštění alespoň 5% nabití.
items.artifacts.talismanofforesight.name=talisman předvídavosti
items.artifacts.talismanofforesight.prompt=Vyberte umístění pro skenování.
items.artifacts.timekeepershourglass$sandbag.desc=Tento malý sáček s jemným pískem by měl perfektně fungovat s vašimi přesýpacími hodinami.\n\nZdá se zvláštní, že by prodavač měl tento konkrétní předmět zrovna když ho potřebujete...
items.artifacts.timekeepershourglass$sandbag.levelup=Přidáš si písek do přesýpacích hodin.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Vaše přesýpací hodiny jsou plné magického písku!
items.artifacts.timekeepershourglass$sandbag.name=pytel magického písku
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Nemáš přesýpací hodiny, do kterých bys mohl umístit tento písek.
items.artifacts.timekeepershourglass$timefreeze.desc=Čas kolem vás je zmrazen, což vám umožňuje provádět akce okamžitě. Efekt bude trvat, dokud nebude zrušen nebo dokud se vaše přesýpací hodiny nevybijí. Útok nebo použití magie tento efekt také přeruší. \n\nTahy do použití nabití: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Zmrazení času
items.artifacts.timekeepershourglass.ac_activate=AKTIVOVAT
items.artifacts.timekeepershourglass.cursed=Nemůžete použít prokleté přesýpací hodiny.
items.artifacts.timekeepershourglass.deactivate=Deaktivujete zmrazení času.
items.artifacts.timekeepershourglass.desc=Tyto velké zdobené přesýpací hodiny vypadají poměrně nenápadně, ale v jejich jemně vyřezávaném rámu cítíte velkou sílu. Když otáčíte přesýpacími hodinami a sledujete, jak se písek sype, cítíte, jak vás jejich magie přitahuje, a použití této magie by vám jistě dalo určitou kontrolu nad časem.
items.artifacts.timekeepershourglass.desc_cursed=Prokleté přesýpací hodiny jsou připevněny k tvému boku, cítíš, jak se snaží manipulovat s tvým proudem času.
items.artifacts.timekeepershourglass.desc_hint=Zdá se, že přesýpací hodiny ztratily trochu písku, kdybyste jen nějaký našli...
items.artifacts.timekeepershourglass.freeze=Zmraz čas kolem mě
items.artifacts.timekeepershourglass.name=přesýpací hodiny časoměřiče
items.artifacts.timekeepershourglass.no_charge=Vaše přesýpací hodiny se ještě dostatečně nenabily, aby byly použitelné.
items.artifacts.timekeepershourglass.onfreeze=Všechno kolem vás najednou zamrzne.
items.artifacts.timekeepershourglass.onstasis=Zdá se, že se svět kolem vás v mžiku otočí.
items.artifacts.timekeepershourglass.prompt=Jak byste chtěli využít magii přesýpacích hodin?\n\nVe stázi se čas bude pohybovat normálně, zatímco vy jste zmrazeni a zcela nezranitelní, spotřebovává se až 2 nabití najednou.\n\nKdyž je čas zmrazen, můžete se pohybovat, jako by vaše akce netrvaly žádný čas. Tuto funkci lze kdykoli deaktivovat použitím přesýpacích hodin nebo útokem.
items.artifacts.timekeepershourglass.stasis=Uvádím se do stagnace
items.artifacts.unstablespellbook.ac_add=PŘIDAT
items.artifacts.unstablespellbook.ac_read=ČÍST
items.artifacts.unstablespellbook.blinded=Nemůžete číst z knihy, když jste oslepeni.
items.artifacts.unstablespellbook.cursed=Z prokleté knihy kouzel se nedá číst.
items.artifacts.unstablespellbook.desc=Tato kniha je vzhledem ke svému stáří v překvapivě dobrém stavu. Při pohybu stránkami šumí a praská, překypuje nestabilní energií. Pokud čtete z této knihy, nelze říct, jaké kouzlo sešlete.
items.artifacts.unstablespellbook.desc_cursed=Prokletá kniha se k tobě připoutala a brání ti v používání většiny svitků.
items.artifacts.unstablespellbook.desc_empowered=Svitky, které jste přidali do knihy, září mocí. Budete si moci vybrat exotickou verzi efektů těchto svitků, ale za příplatek.
items.artifacts.unstablespellbook.desc_index=Kniha je neúplná. Její rejstřík aktuálně ukazuje na následující prázdné stránky:
items.artifacts.unstablespellbook.infuse_scroll=Vkládáš do knihy energii svitku.
items.artifacts.unstablespellbook.name=nestabilní kniha kouzel
items.artifacts.unstablespellbook.no_charge=Tvoje kniha kouzel je momentálně bez energie.
items.artifacts.unstablespellbook.prompt=Vyberte svitek
items.artifacts.unstablespellbook.read_empowered=Svitek, který jsi přidal do knihy kouzel, přetéká energií. Můžeš seslat buď běžnou, nebo exotickou verzi efektu tohoto svitku. \n\nVýběr exotické varianty bude stát 2 nabití místo 1.
items.artifacts.unstablespellbook.unable_scroll=Tento svitek nelze do knihy přidat.
items.artifacts.unstablespellbook.unknown_scroll=Ještě si nejste jisti, o jaký typ svitku se jedná.
items.bags.bag.discover_hint=Tuto položku si můžete koupit v obchodě.
items.bags.bag.name=batoh
items.bags.magicalholster.desc=Toto tenké pouzdro je vyrobeno z kůže exotického zvířete a disponuje silnou magií, která umožňuje uložit obrovské množství zbraní na dálku.\n\nStačí sáhnout do brašny a vždycky tam najdete předmět, který hledáte.\n\nDíky magii pouzdra se hůlky nabíjejí o něco rychleji a vrhané zbraně v něm vydrží o něco déle.
items.bags.magicalholster.name=magické pouzdro
items.bags.potionbandolier.desc=Tento tlustý bandolier se vám obepne kolem hrudníku jako šerpa a má na sobě mnoho izolovaných popruhů pro uchycení lahviček s lektvary, měchu s vodou nebo lahviček s tekutým kovem. \n\nUvnitř bandolieru by měly být vaše lektvary chráněny před chladem.
items.bags.potionbandolier.name=lektvarový bandolier
items.bags.scrollholder.desc=Tato trubková nádoba vypadá, jako by se do ní vešly nástroje a mapy astronoma, ale vaše svitky se do ní vejdou stejně dobře. Má dokonce i několik bočních přihrádek, do kterých se hezky vejdou krystaly kouzel, arkánní doteky a arkánní pryskyřice. \n\nDržák nevypadá moc hořlavě, takže by vaše svitky měly být uvnitř v bezpečí před ohněm.
items.bags.scrollholder.name=držák svitků
items.bags.velvetpouch.desc=Tento malý sametový váček pojme mnoho drobných předmětů, jako jsou semena, runové kameny a některé alchymistické ingredience.
items.bags.velvetpouch.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.bags.velvetpouch.name=sametový váček
items.bombs.arcanebomb.desc=Tato bomba je naplněna tajemnými vlastnostmi. Vydá silný výbuch podobný Gooovu nabuzenému útoku a způsobí _%1$d-%2$d magické poškození_ všemu do 2 políček.
items.bombs.arcanebomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.arcanebomb.name=tajemná bomba
items.bombs.bomb$doublebomb.desc=Hromada dvou pořádných pum s černým prachem, vypadá to, že jednu dostanete zdarma!
items.bombs.bomb$doublebomb.name=dvě bomby
items.bombs.bomb.ac_lightthrow=SVĚTLO A VRH
items.bombs.bomb.desc=Docela robustní střela s černým prachem. Výbuch této střely způsobí _%1$d-%2$d poškození_ všemu, co s ní sousedí, a zničí i některé přilehlé terénní objekty nebo předměty.
items.bombs.bomb.desc_burning=Roznětka bomby hoří, držte se od ní dál, nebo ji uhaste!
items.bombs.bomb.desc_fuse=Vypadá to, že po zapálení zápalnice bude trvat pár ran, než dohoří.
items.bombs.bomb.name=bombardovat
items.bombs.bomb.ondeath=Výbuch tě zabije...
items.bombs.bomb.rankings_desc=Zabit výbuchem
items.bombs.bomb.snuff_fuse=Rychle uhasíš roznětku bomby.
items.bombs.firebomb.desc=Tato bomba byla upravena tak, aby explodovala ve větší oblasti, způsobovala poškození _%1$d-%2$d_ a šířila trvalý plamen do 2 políček.
items.bombs.firebomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.firebomb.name=zápalná bomba
items.bombs.flashbangbomb.desc=Tato upravená bomba po explozi vybuchne a vydá se do záblesku světla, zvuku a elektřiny. Cokoli do 2 políček utrpí poškození _%1$d-%2$d_ z exploze, dalších 25%% poškození z elektřiny a bude na 10 kol omráčeno.
items.bombs.flashbangbomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.flashbangbomb.name=bleskový granát
items.bombs.frostbomb.desc=Tato bomba byla upravena tak, aby explodovala ve větší oblasti, způsobila poškození _%1$d-%2$d_ a šířila trvalý poryv mrazivého vzduchu do 2 políček.
items.bombs.frostbomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.frostbomb.name=mrazivá bomba
items.bombs.holybomb.desc=Tato bomba byla upravena tak, aby při explozi šířila svaté světlo ve větší oblasti. Vše do 2 políček utrpí od exploze poškození _%1$d-%2$d_ a nemrtví nebo démoničtí nepřátelé utrpí od svatého světla dalších 50%% poškození.
items.bombs.holybomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.holybomb.name=svatá bomba
items.bombs.noisemaker.desc=Tato upravená bomba bude opakovaně vydávat zvuky, když dojde její roznětka. Když se bomby něco dotkne, exploduje a způsobí _%1$d-%2$d poškození_ všemu do 2 políček!
items.bombs.noisemaker.desc_burning=Hlukotvorný přístroj tikaje, exploduje, až se něco přiblíží!
items.bombs.noisemaker.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.noisemaker.name=hlukář
items.bombs.regrowthbomb.desc=Tato upravená bomba rozstříkne životodárnou tekutinu všude do 3 políček, místo aby explodovala. Oblast zasažená výbuchem rychle vyroste trávou a rostlinami. Vy i všichni spojenci zasažení výbuchem se uzdravíte, jako byste vypili léčivý lektvar.
items.bombs.regrowthbomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.regrowthbomb.name=bomba pro opětovný růst
items.bombs.shrapnelbomb.desc=Tato bomba byla upravena úlomky kovu z DM-300, které se při explozi roztříští a rozletí všude kolem bomby, čímž způsobí poškození _%1$d-%2$d_ v obrovském rozsahu kolem bomby. Při jejím použití se raději schovejte za něco...
items.bombs.shrapnelbomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.shrapnelbomb.name=šrapnelová bomba
items.bombs.smokebomb.desc=Tato bomba byla upravena tak, aby při explozi chrlila hustý oblak plynu. Způsobí poškození _%1$d-%2$d_ a rozšíří zahalující mlhu do 2 políček.
items.bombs.smokebomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.smokebomb.name=dýmovnice
items.bombs.woollybomb.desc=Tato upravená bomba po explozi vytvoří široké pole magických ovcí. Exploze způsobí poškození _%1$d-%2$d_ všemu do 2 políček. Ovce budou blokovat pohyb a přetrvávat velmi dlouho! Ovce však v přítomnosti silných nepřátel nevydrží tak dlouho a lze je dříve ručně rozptýlit interakcí s nimi.
items.bombs.woollybomb.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.bombs.woollybomb.name=vlněná bomba
items.brokenseal$warriorshield.desc_active=Válečníkova rozbitá pečeť mu v současné době pomáhá vytrvat a poskytuje mu štít navíc k jeho zdraví. Po spuštění štítu probíhá doba zchlazení, než jej lze znovu použít.\n\nTento štít se časem nerozpadá, ale skončí, pokud se poblíž po několik kol nenacházejí žádní nepřátelé. Po skončení jakýkoli nepoužitý štít zkrátí dobu zchlazení, a to maximálně na 50%%.\n\nZbývající štít: %1$d.\n\nAktuální doba zchlazení: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Válečník nedávno získal ochranu díky své rozbité pečeti a musí počkat, až bude moci znovu využít její ochranný účinek. \n\nZbývající tahy: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Doba zchlazení štítu válečníka je momentálně záporná, což znamená, že když se jeho štít aktivuje, doba zchlazení bude kratší než obvyklých 150 kol. Dobu zchlazení štítu lze snížit až na -150 kol, což znamená, že bude štít po aktivaci okamžitě opět k dispozici. \n\nAktuální doba zchlazení: %d.
items.brokenseal$warriorshield.name=Štít válečníka
items.brokenseal.ac_affix=PŘIPEVNIT
items.brokenseal.affix=Připevníš pečeť na své brnění!
items.brokenseal.choose_desc=Jak toto brnění, tak i rozbitá pečeť nesou glyf. Vyberte, který glyf si ponecháte. \n\nGlyf brnění: %1$s\nGlyf rozbité pečeti: %2$s\n\nUpozorňujeme, že pokud si vyberete glyf, který je aktuálně na brnění, pečeť jej později nebude možné přenést.
items.brokenseal.choose_title=Vyberte si glyf
items.brokenseal.cursed_armor=Pečeť se nevztahuje na prokleté brnění.
items.brokenseal.desc=Vosková pečeť, připevněná k brnění jako symbol statečnosti. Uprostřed má vybledlou runu ochrany vyrytou a je uprostřed rozlomená napůl.\n\nA Pečeť je suvenýrem z jeho domova a pomáhá bojovníkovi vytrvat. Při nošení pečeti bojovník okamžitě získá štít, když se blíží poškození na polovinu zdraví nebo méně.\n\nPečeť lze _připevnit k brnění_ a přesouvat ji mezi brněními. Může s sebou nést jedno vylepšení, pokud bylo toto vylepšení na brnění aplikováno v době, kdy k němu byla pečeť připevněna.
items.brokenseal.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.brokenseal.inscribed=Pečeť je s nápisem _%s._
items.brokenseal.name=porušená pečeť
items.brokenseal.prompt=Vyberte si brnění
items.brokenseal.unknown_armor=Nejdříve musíš zjistit, zda je dané brnění prokleté, nebo ne.
items.dewdrop.already_full=Už máš plné zdraví.
items.dewdrop.desc=Křišťálově čistá kapka rosy.
items.dewdrop.name=kapka rosy
items.dewvial.ac_drink=VYPÍT
items.dewvial.auto_drink=Lahvička s rosou se vyprázdnila, aby zahojila tvé rány.
items.dewvial.collected=Do lahvičky přibyla kapka rosy.
items.dewvial.desc=V této malé lahvičce můžeš uchovávat přebytečnou rosu a vypít ji později. Pokud je lahvička plná, v okamžiku smrtelného nebezpečí se rosa vypije automaticky.
items.dewvial.empty=Tvá lahvička na rosu je prázdná!
items.dewvial.full=Tvá lahvička na rosu je plná!
items.dewvial.name=lahvička na rosu
items.energycrystal.desc=Sbírka malých magických krystalů naplněných alchymistickou energií.\n\nTyto krystaly jsou nejběžnější ingrediencí v alchymistických receptech a lze je vyrobit v alchymistickém kotli sešrotováním spotřebních předmětů.
items.energycrystal.name=energetický krystal
items.equipableitem.ac_equip=VYBAVIT
items.equipableitem.ac_unequip=ZBAVIT
