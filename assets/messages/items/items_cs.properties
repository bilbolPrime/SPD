items.weapon.melee.rapier.ability_desc=Duelista se může _výpadnout_ rapírem na nepřítele vzdáleného 1 políčko. Tím se pohne směrem k nepříteli, způsobí mu poškození _%1$d-%2$d_ a zaručeně ho zasáhne.
