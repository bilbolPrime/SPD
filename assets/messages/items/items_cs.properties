items.food.food.ac_eat=JÍST
items.food.food.desc=Nic extravagantního: sušené maso, nějaké sušenky – takové věci.
items.food.food.eat_msg=To jídlo chutnalo lahodně!
items.food.food.name=příděl jídla
items.food.frozencarpaccio.better=Cítíš se lépe!
items.food.frozencarpaccio.desc=Je to kus mraženého syrového masa. Jediný způsob, jak ho jíst, je nakrájet si na tenké plátky. A takhle je překvapivě dobrý.
items.food.frozencarpaccio.discover_hint=Můžete to vytvořit s použitím jiné potraviny.
items.food.frozencarpaccio.hard=Cítíš, jak ti tvrdne kůže!
items.food.frozencarpaccio.invis=Vidíš, jak se tvé ruce stávají neviditelnými!
items.food.frozencarpaccio.name=mražené carpaccio
items.food.frozencarpaccio.refresh=Osvěžující!
items.food.meatpie.desc=Lahodný koláč plněný slaným masem. Zasytí vás mnohem víc než jakékoli jiné jídlo.
items.food.meatpie.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
