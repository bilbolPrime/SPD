items.artifacts.cloakofshadows.desc=Neocenitelný magický plášť, ukradený před mnoha lety z královské zbrojnice Zlodějem. Po nošení se dá na krátkou dobu zcela zneviditelnit.\n\nČím více se plášť používá, tím silnější se stává, což Zloději umožňuje častěji a na delší dobu se neviditelně stávat.
items.artifacts.cloakofshadows.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.artifacts.cloakofshadows.name=plášť stínů
items.artifacts.cloakofshadows.no_charge=Tvůj plášť se ještě dostatečně nenabil, aby byl použitelný.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Jak jsi to přežil/a?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Kéž bych jeden z nich měl/a...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Ach jo! Pořád jsi naživu!
items.artifacts.driedrose$ghosthero.def_verb=uhnul
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Je mi to líto... hodně štěstí...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Dokonči to... beze mě...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Ne... nemůžu...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Hodně štěstí...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Unavený... prozatím...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Vrátím se...
items.artifacts.driedrose$ghosthero.desc=Křehce vypadající éterická postava humanoidního tvaru. Jejich síla se zdá být spojena s růží, kterou máš.\n\nTento duch možná není nic moc, ale zdá se, že je tvým jediným opravdovým přítelem tady dole.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Proč se to děje, myslel jsem, že se nám to povedlo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Jak je možné, že ta věc stále ovlivňuje tento svět?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Doufám, že víš, co s tím amuletem děláš.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Předpokládám, že ještě nejsme hotovi.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Už jsme se dostali tak daleko, že to zvládneme!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Už jen kousek a můžeme se odsud dostat!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Žádný člověk ani trpaslík tu už velmi dlouho nebyl.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Co by vedlo trpaslíky k opuštění zlatého dolu?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Je škoda, že všechno to zlato je na první pohled k ničemu.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Ty tvory jsou tady zvrácené, stejně jako v kanálech.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Dokonce i netopýři jsou tady krvežízniví.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Žádné známky těžebního vybavení, získali trpaslíci zpět všechno?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Trpaslíci byli pilní, ale chamtiví.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Takže trpasličí metropole skutečně padla.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Doufám, že povrch nikdy neskončí jako toto místo.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Trpaslíci by neměli vypadat tak bledě.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Nevím, co je horší, trpaslíci, nebo jejich výtvory.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Zdá se, že i trpaslíci jsou teď bezduché příšery.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Co je tohle za místo?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Tohle místo je děsivé...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Co si asi trpaslíci mysleli, když si takhle hráli s mocí?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Tyhle monstra jsou z jiného světa, odkud se vzala?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Cítíš to? Je to, jako by nás něco sledovalo.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Díkybohu, že tu jsou pochodně, je tu taková tma!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Slyšel jsem o tomhle místě historky, nic dobrého.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Tohle místo bylo vždycky spíš žalářem než vězením.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Nedokážu si představit, co se dělo, když bylo toto místo opuštěné.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Zdá se, že se vězni i dozorci proměnili v monstra.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Co by mohlo být zodpovědné za všechny tyto kostry?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Tito lidé nemuseli takhle skončit...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Tato kanalizace bývala bezpečná, lidé zde žili i v zimě.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Zajímalo by mě, co se stalo s hlídkovými strážemi, vzdaly to?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Měl jsem rodinu na povrchu, doufám, že jsou v bezpečí.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Stráže tyhle monstra porazit nedokázaly, ale my možná ano.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Jestli je i kanalizace tak nebezpečná, zajímalo by mě, co je dole...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Co mohlo způsobit, že tyto krysy a krabi tak vyrostli?
items.artifacts.driedrose$ghosthero.direct_prompt=Co mám dělat?
items.artifacts.driedrose$ghosthero.directed_attack_1=Dobře, na to zaútočím.
items.artifacts.driedrose$ghosthero.directed_attack_2=Ten si pořídím.
items.artifacts.driedrose$ghosthero.directed_attack_3=Poutavé...
items.artifacts.driedrose$ghosthero.directed_attack_4=Pojďme je dostat!
items.artifacts.driedrose$ghosthero.directed_attack_5=Ten mám.
items.artifacts.driedrose$ghosthero.directed_follow_1=Dobře, půjdu za tebou.
items.artifacts.driedrose$ghosthero.directed_follow_2=Zařadím se za tebe.
items.artifacts.driedrose$ghosthero.directed_follow_3=Sleduji tě...
items.artifacts.driedrose$ghosthero.directed_follow_4=Dobře, jdeme na to!
items.artifacts.driedrose$ghosthero.directed_follow_5=Kryju ti záda.
items.artifacts.driedrose$ghosthero.directed_position_1=Dobře, tu pozici si zachovám.
items.artifacts.driedrose$ghosthero.directed_position_2=Půjdu tam a budu se bránit.
items.artifacts.driedrose$ghosthero.directed_position_3=Změna pozice...
items.artifacts.driedrose$ghosthero.directed_position_4=Na cestě!
items.artifacts.driedrose$ghosthero.directed_position_5=Zamířím tam.
items.artifacts.driedrose$ghosthero.discover_hint=Tuto postavu najdete pomocí specifického artefaktu.
items.artifacts.driedrose$ghosthero.hello=Ahoj znovu %s.
items.artifacts.driedrose$ghosthero.introduce=Můj duch je svázán s touto růží, byla pro mě velmi vzácná, dar od mé lásky, kterou jsem zanechal na povrchu.\n\nNemohu se k němu vrátit, ale díky tobě mám druhou šanci dokončit svou cestu. Až budu schopen, odpovím na tvé volání a budu s tebou bojovat.\n\nDokud budeš mít růži, slyším tvůj hlas, takže ji můžeš použít k tomu, abys mě vedl z dálky.\n\nDoufejme, že uspěješ tam, kde já selhal...
items.artifacts.driedrose$ghosthero.name=smutný duch
items.artifacts.driedrose$ghosthero.player_killed_1=Žádný!...
items.artifacts.driedrose$ghosthero.player_killed_2=Nemohl jsem jim pomoct...
items.artifacts.driedrose$ghosthero.player_killed_3=Ne takhle...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Pouze trpaslíci by postavili těžební stroj, který by zabíjel vetřelce.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Ta věc je obrovská...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Jak je možné, že tahle věc zůstala tak dlouho aktivní?
items.artifacts.driedrose$ghosthero.seen_goo_1=Pozor, Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Mnoho mých přátel kvůli tomu zemřelo, čas na pomstu!
items.artifacts.driedrose$ghosthero.seen_goo_3=Taková ohavnost nesmí žít!
items.artifacts.driedrose$ghosthero.seen_king_1=Když lidé říkají, že moc korumpuje, myslí tím toto.
items.artifacts.driedrose$ghosthero.seen_king_2=Teď je spíš lich než král.
items.artifacts.driedrose$ghosthero.seen_king_3=I po smrti trpaslíci poslouchají svého pána.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Jediný zbývající vězeň je smrtící vrah. Samozřejmě...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Chytil nás do pasti!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Slyšel jsem o té masce hororové historky...
items.artifacts.driedrose$ghosthero.seen_yog_1=Jé, tohle nevypadá dobře.
items.artifacts.driedrose$ghosthero.seen_yog_2=Takže takhle vypadá bůh?
items.artifacts.driedrose$ghosthero.seen_yog_3=Tohle bude bolet...
items.artifacts.driedrose$petal.desc=Křehký uschlý okvětní lístek, který se nějakým způsobem dočkal až do hlubin podzemí.
items.artifacts.driedrose$petal.levelup=Přidáte okvětní lístek k růži.
items.artifacts.driedrose$petal.maxlevel=Růže je hotová!
items.artifacts.driedrose$petal.name=sušený okvětní lístek
items.artifacts.driedrose$petal.no_room=Pro tento okvětní lístek už nezbývá místo, takže ho zahodíte.
items.artifacts.driedrose$petal.no_rose=Nemáš žádnou růži, ke které bys mohl přidat tento okvětní lístek.
items.artifacts.driedrose$wndghosthero.armor_prompt=Vyberte si brnění
items.artifacts.driedrose$wndghosthero.cant_cursed=Duch může používat pouze vybavení, o kterém jste si jisti, že není prokleté.
items.artifacts.driedrose$wndghosthero.cant_strength=Duch není dost silný na to, aby to použil.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Duch možná není dost silný na to, aby to použil.
items.artifacts.driedrose$wndghosthero.cant_unique=Duch nemůže používat unikátní předměty.
items.artifacts.driedrose$wndghosthero.desc=Duch je sám o sobě slabý, ale jeho forma je dostatečně pevná na to, aby se dal vybavit zbraní a brněním. Budou moci tyto předměty používat stejně jako vy. \n\nDuch se v současné době může vybavit předměty vyžadujícími sílu až do _%d._
items.artifacts.driedrose$wndghosthero.title=Duchovo vybavení
items.artifacts.driedrose$wndghosthero.weapon_prompt=Vyberte zbraň
