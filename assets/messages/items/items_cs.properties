items.equipableitem.unequip_cursed=Prokletý předmět nemůžeš odstranit!
items.food.berry.desc=Tuto malou bobulku našla Lovkyně mezi vegetací v jeskyni. Dá se rychle sníst, trochu zasytí a může obsahovat použitelné semínko!
items.food.berry.discover_hint=Tuto položku můžete najít pomocí specifického hrdinského talentu.
