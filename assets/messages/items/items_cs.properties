items.potions.potion.magenta=purpurový lektvar
items.potions.potion.no=Ne, změnil jsem názor.
items.potions.potion.shatter=Baňka se roztříští a tekutina neškodně vystříkne.
items.potions.potion.silver=stříbrný lektvar
items.potions.potion.sure_drink=Jsi si jistý/á, že to chceš vypít? Ve většině případů bys takové lektvary měl/a házet po nepřátelích.
items.potions.potion.sure_throw=Jsi si jistý/á, že to chceš vyhodit? Ve většině případů má smysl to vypít.
items.potions.potion.turquoise=tyrkysový lektvar
items.potions.potion.unknown_desc=V této lahvičce víří %s tekutina. Kdo ví, co se stane, když ji vypiješ nebo hodíš?
items.potions.potion.yes=Ano, vím, co dělám
items.potions.potionofexperience.desc=Tento nápoj, změkčený do tekuté formy, vám okamžitě zvýší úroveň zkušeností a pohádkové zážitky z mnoha bitev.
items.potions.potionofexperience.name=lektvar zkušeností
items.potions.potionoffrost.desc=Na vzduchu se tato látka vypaří v mrazivý oblak. Každý tvor, který se ho dotkne, zamrzne na místě a nemůže se hýbat ani jednat.
items.potions.potionoffrost.name=lektvar mrazu
items.potions.potionofhaste.desc=Pití této podivně sladké tekutiny vám na krátkou dobu dodá obrovskou energii, která vám umožní běhat vysokou rychlostí.
items.potions.potionofhaste.energetic=Cítíte se energičtí!
items.potions.potionofhaste.name=lektvar spěchu
items.potions.potionofhealing.desc=Elixír, který ti okamžitě obnoví plné zdraví a vyléčí otravu.
items.potions.potionofhealing.heal=Tvé rány se začínají hojit.
items.potions.potionofhealing.name=lektvar léčení
items.potions.potionofinvisibility.desc=Po vypití tohoto lektvaru budeš dočasně neviditelný a nepřátelé tě neuvidí. Útok na nepřítele nebo použití hůlky či svitku před jeho očima účinek zruší.
items.potions.potionofinvisibility.invisible=Vidíš, jak se tvé ruce stávají neviditelnými!
items.potions.potionofinvisibility.name=lektvar neviditelnosti
items.potions.potionoflevitation.desc=Po vypití této zvláštní tekutiny se vzneseš do vzduchu a snadno přeletíš přes pasti. Plameny a plyny však vyplňují i vzduch, takže se jim takto nevyhneš.
items.potions.potionoflevitation.float=Vznášíš se ve vzduchu!
items.potions.potionoflevitation.name=lektvar levitace
items.potions.potionofliquidflame.desc=Tato baňka obsahuje nestabilní sloučeninu, která se při vystavení otevřenému vzduchu prudce vznítí.
items.potions.potionofliquidflame.name=lektvar tekutého plamene
items.potions.potionofmindvision.desc=Po vypití se vaše mysl naladí na psychický podpis vzdálených tvorů, což vám umožní vnímat biologickou přítomnost skrz zdi. Tento lektvar vám také umožní vidět skrz blízké zdi a dveře.
items.potions.potionofmindvision.name=lektvar vidění mysli
items.potions.potionofmindvision.see_mobs=Nějak můžete cítit přítomnost myslí jiných tvorů!
items.potions.potionofmindvision.see_none=Nějak poznáte, že jste na této úrovni momentálně sami.
items.potions.potionofparalyticgas.desc=Po vystavení otevřenému vzduchu se kapalina v této baňce odpaří do znecitlivujícího žlutého oparu. Každý, kdo vdechne oblak, bude okamžitě paralyzován a nebude se moci pohybovat po určitou dobu poté, co se oblak rozplyne. Tento předmět lze hodit na vzdálené nepřátele, aby se dostali do dosahu plynu.
items.potions.potionofparalyticgas.name=lektvar paralytického plynu
items.potions.potionofpurity.desc=Tato látka rychle zneškodní všechny škodlivé plyny v oblasti účinku. Její vypití poskytne dočasnou odolnost vůči těmto plynům.
items.potions.potionofpurity.freshness=Ve vzduchu cítíte neobvyklou svěžest.
items.potions.potionofpurity.name=Lektvar očisty
items.potions.potionofpurity.protected=Ochranná fólie vás obalí!
items.potions.potionofstrength.desc=Tato silná tekutina protéká vašimi svaly a trvale zvýší vaši sílu o jeden bod.
items.potions.potionofstrength.msg=Nově nabytá síla se rozlévá tvým tělem, teď máš sílu %d!
items.potions.potionofstrength.name=lektvar síly
items.potions.potionoftoxicgas.desc=Otevření nebo rozbití této tlakové sklenice způsobí, že její obsah exploduje do smrtícího oblaku toxického zeleného plynu. Můžete se rozhodnout tento lektvar vrhnout na vzdálené nepřátele, místo abyste ho otevírali ručně.
items.potions.potionoftoxicgas.name=lektvar toxického plynu
items.quest.ceremonialcandle.desc=Sada svíček, roztavených a používáním spojených dohromady. \n\nA Samy o sobě jsou bezcenné, ale v kombinaci s jinými svíčkami ve vzoru mohou soustředit energii pro vyvolávací rituál.
items.quest.ceremonialcandle.discover_hint=Tuto položku najdete během konkrétního úkolu.
items.quest.ceremonialcandle.name=slavnostní svíčka
items.quest.corpsedust.chill=Po zádech vám přeběhne mráz.
items.quest.corpsedust.desc=Koule mrtvolného prachu se navenek neliší od běžné koule prachu. Ale cítíte v ní zlověstnou energii, která se skrývá. \n\nZbavit se jí co nejdříve by byl dobrý nápad.
items.quest.corpsedust.discover_hint=Tuto položku najdete během konkrétního úkolu.
items.quest.corpsedust.name=mrtvolný prach
items.quest.darkgold.desc=Tento kov se nazývá tmavý ne kvůli své barvě (neliší se od běžného zlata), ale proto, že se pod denním světlem taví, takže je na povrchu nepoužitelný.
items.quest.darkgold.discover_hint=Tuto položku najdete během konkrétního úkolu.
items.quest.darkgold.name=tmavá zlatá ruda
items.quest.darkgold.you_now_have=Nyní máte tmavou zlatou rudu %d.
items.quest.dwarftoken.desc=Mnoho trpaslíků a některé z jejich větších výtvorů nosí tyto malé kousky kovu neznámého účelu. Možná jsou to šperky nebo nějaký druh průkazu totožnosti. Trpaslíci jsou zvláštní lidé.
items.quest.dwarftoken.discover_hint=Tuto položku najdete během konkrétního úkolu.
items.quest.dwarftoken.name=žeton trpaslíka
items.quest.embers.desc=Speciální uhlíky, které lze získat pouze z mladých ohnivých elementálů. Vyzařují tepelnou energii.
items.quest.embers.discover_hint=Tuto položku najdete během konkrétního úkolu.
items.quest.embers.name=elementární uhlíky
items.quest.escapecrystal.ac_use=POUŽITÍ
items.quest.escapecrystal.desc=Tenký magický krystal, který zřejmě obsahuje teleportační magii. Krystal můžete kdykoli použít k opuštění trpasličího trezoru, ale nebudete si moci nic vzít s sebou!
items.quest.escapecrystal.discover_hint=Tuto položku najdete během konkrétního úkolu.
items.quest.escapecrystal.name=únikový krystal
items.quest.gooblob.desc=Mihotavá skvrna hlenu, odlomená od umírajícího hlenu. Je to skoro jako velká koule želé, i když byste se ji neodvážili sníst.\n\nSamotně to nic nedělá, ale v kombinaci s určitými lektvary nebo bombou by to mohlo být užitečné. Přinejmenším by se to mělo přeměnit na slušné množství energie.
items.quest.gooblob.discover_hint=Tuto položku můžete získat jako drop z určitých nepřátel.
items.quest.gooblob.name=kapka slizu
items.quest.metalshard.desc=Úlomek zrezivělého prokletého kovu, který se odlomil od DM-300 při jeho zničení. Cítíte v něm neaktivní zlomyslnou magii. \n\nSamotný nic nedělá, ale v kombinaci s určitými svitky nebo bombou by mohl být užitečný. Přinejmenším by se měl přeměnit na slušné množství energie.
items.quest.metalshard.discover_hint=Tuto položku můžete získat jako drop z určitých nepřátel.
items.quest.metalshard.name=prokletý kovový střep
items.quest.pickaxe.ability_desc=Duelista může _probodnout_ nepřítele krumpáčem. Toto zaručeně zasáhne, na 3 kola se aktivuje zranitelnost a nepřátelům s tvrdou kůží způsobí _%1$d-%2$d poškození_.
items.quest.pickaxe.ability_name=prorazit
items.quest.pickaxe.desc=Toto je robustní a těžký nástroj na lámání kamenů. K těžení s ním nemusíte mít krumpáč, ale v nouzi ho pravděpodobně můžete použít jako zbraň.
items.quest.pickaxe.discover_hint=Tuto položku najdete během konkrétního úkolu.
items.quest.pickaxe.name=krumpáč
items.quest.pickaxe.upgrade_ability_stat_name=Poškození schopností
items.quest.ratskull.desc=Překvapivě velká lebka krysy. Byla by to skvělá lovecká trofej, kdybyste měli zeď, na kterou byste ji mohli pověsit.
items.quest.ratskull.name=obří lebka krysy
items.remains.bowfragment.desc=Tento rozbitý úlomek dřeva byl kdysi součástí duchovního luku ztracené Lovkyně. V úlomku stále cítíte trochu přírodní energie, kterou můžete použít k pěstování vysoké trávy kolem sebe. Tímto úlomkem však úlomek zničíte.
items.remains.bowfragment.name=úlomek luku
items.remains.brokenhilt.desc=Tato zlomená jílec vypadá, jako by pocházela ze zbraně poraženého duelisty. V jílci stále cítíte trochu bojové síly, kterou můžete použít k získání malého bonusového poškození při dalších dvou zásahech zblízka. Tímto se však jílec zničí.
items.remains.brokenhilt.name=zlomený jílec
items.remains.brokenstaff.desc=Hůl tohoto mága byla po smrti svého majitele zlomena vedví. V holi stále cítíte magickou energii, kterou můžete použít k nabití hůlek. Tímto krokem však hůl zničíte.
items.remains.brokenstaff.name=zlomený personál
items.remains.cloakscrap.desc=Tento kousek průsvitné látky vypadá, jako by pocházel z pláště stínů pozdního Rogue. Stále v něm cítíte trochu mystické energie, kterou můžete použít k nabití svých artefaktů. Tímto se však látka zničí.
items.remains.cloakscrap.name=kousek látky
items.remains.remainsitem.ac_use=POUŽITÍ
items.remains.remainsitem.discover_hint=Tuto položku najdete v pozůstatcích konkrétního hrdiny z předchozího prohraného běhu.
items.remains.sealshard.desc=Tyto drobné střepy červeného vosku vypadají, jako by pocházely z pečeti padlého válečníka. Stále cítíte, jak se na pečeti drží síla vůle, kterou můžete použít k vytvoření štítu. Tímto se však střepy pečeti zničí.
items.remains.sealshard.name=střepy tuleňů
items.remains.tornpage.desc=Tato stránka vypadá, jako by byla vytržena z prošlého svatého svazku klerika. Stále na ní lpí trochu božské energie, kterou můžete použít k obnovení trochy zdraví. Tímto krokem však vytrženou stránku zničíte.
items.remains.tornpage.name=roztrhaná stránka
items.rings.ring.agate=achátový prsten
items.rings.ring.amethyst=ametystový prsten
items.rings.ring.curse_known=V tomto prstenu cítíte zlověstnou magii.
items.rings.ring.cursed_worn=Protože tento prsten je prokletý, nemáš sílu ho odstranit.
items.rings.ring.diamond=diamantový prsten
items.rings.ring.emerald=smaragdový prsten
items.rings.ring.equip_cursed=Prsten se ti bolestivě utahuje kolem prstu!
items.rings.ring.garnet=granátový prsten
items.rings.ring.identify=Nyní jste se svým prstenem dostatečně obeznámeni, abyste ho dokázali identifikovat.
