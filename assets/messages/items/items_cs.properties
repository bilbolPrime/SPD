items.weapon.melee.quarterstaff$defensivestance.desc=Duelistka používá svou hůl k odrážení přicházejících úderů a projektilů. Dokud je v tomto postoji, její úhybné schopnosti proti všem útokům se ztrojnásobí. \n\nZbývající tahy: %s.
items.weapon.melee.quarterstaff$defensivestance.name=obranný postoj
items.weapon.melee.quarterstaff.ability_desc=Duelistka může zaujmout _obranný postoj_ s hůlkou. Tento postoj se aktivuje okamžitě a ztrojnásobí její schopnost úhybného úhybu po dobu _%d tahů._
