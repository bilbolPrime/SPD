items.rings.ringofwealth.desc=Tento prsten funguje jako magnet na poklad, což zvyšuje pravděpodobnost, že nepřátelé a kontejnery budou obsahovat cenné předměty. Prokletý prsten naopak snižuje vaši šanci na získání kořisti.
