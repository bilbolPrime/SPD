items.weapon.melee.magesstaff.imbue=Vdechnete svým zaměstnancům %s.
items.weapon.melee.magesstaff.imbue_cursed=_Pokud naplníš prokletou hůlku, prokleje se i tvá hůl!_
items.weapon.melee.magesstaff.imbue_desc=Jste si jistý/á, že chcete svou hůl obohatit touto hůlkou?\n\nPokud je obohacovaná hůlka stejné nebo vyšší úrovně než hůl, hůl zdědí úroveň dané hůlky plus jedno z jejích vlastních vylepšení.
