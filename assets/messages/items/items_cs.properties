items.rings.ringofenergy.combined_stats=Vaše vybavené prsteny kombinují svou sílu a zvyšují rychlost nabíjení celkem o _%s%%_.
items.rings.ringofenergy.desc=Vaše magické vybavení se bude v arkánním poli, které z tohoto prstenu vyzařuje, dobíjet rychleji. Prokletý prsten místo toho dobíjení zpomalí.
items.rings.ringofenergy.name=prstenec energie
items.rings.ringofenergy.stats=Při nošení tento prsten zvýší rychlost nabíjení hůlky, artefaktu a hrdinského brnění o _%s%%._
items.rings.ringofenergy.typical_stats=Při nošení tento prsten obvykle zvýší rychlost nabíjení hůlky, artefaktu a hrdinského brnění o _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Zvýšení nabíjení
items.rings.ringofevasion.combined_stats=Tvé vybavené prsteny kombinují svou sílu a celkovou míru úhybnosti zvyšuje tvou schopnost úhybu o _%s%%_.
items.rings.ringofevasion.desc=Tento prsten zvyšuje šanci vyhnout se nepřátelskému útoku.
items.rings.ringofevasion.name=prsten úhybu
items.rings.ringofevasion.stats=Při nošení tento prsten zvýší vaši schopnost úhybného manévru o _%s%%._
items.rings.ringofevasion.typical_stats=Při nošení tento prsten obvykle zvýší vaši schopnost úhybného manévru o _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Zvýšení úhybnosti
items.rings.ringofforce$brawlersstance.desc=V tomto postoji bude Duelistka při svých běžných útokech používat vybavený prsten síly, i když bude mít zbraň. Tyto útoky získávají bonusové poškození a stále budou používat vylepšení a očarování zbraně. \n\nUdržování tohoto postoje však vyžaduje soustředění a snižuje rychlost dobíjení schopností zbraně o 50 %. \n\nTento postoj lze zapnout nebo vypnout pomocí prstenu síly, ale snížení rychlosti nabíjení po chvíli přetrvá, pokud je postoj rychle aktivován a deaktivován.
items.rings.ringofforce$brawlersstance.name=postoj rváče
items.rings.ringofforce.ability_desc=Duelistka může s tímto prstenem zaujmout _rváčnický postoj_, což způsobí, že její běžné útoky budou vždy používat tento prsten, i když je vybavena zbraní. Tyto útoky způsobí _%1$d-%2$d poškození_ a také zdědí kouzlo a vylepšení zbraně. Tento postoj zpomalí rychlost nabíjení zbraně o 50%%.
items.rings.ringofforce.ability_name=postoj rváče
items.rings.ringofforce.combined_stats=Vaše vybavené prsteny kombinují svou sílu a bez zbraně způsobují celkem _%1$d-%2$d poškození_, nebo s jednou zbraní zvyšují poškození o _%3$d_.
items.rings.ringofforce.desc=Tento prsten zesiluje sílu úderů zblízka nositele. Tato dodatečná síla je při držení zbraně poměrně slabá, ale útok beze zbraně bude mnohem silnější. Prokletý prsten naopak údery nositele oslabí.
items.rings.ringofforce.name=prsten síly
items.rings.ringofforce.stats=Když nejste ozbrojeni, při vaší aktuální síle, tento prsten způsobí poškození o _%1$d-%2$d._ Se zbraní v ruce tento prsten zvýší poškození o _%3$d._
items.rings.ringofforce.typical_ability_desc=Duelistka může s tímto prstenem zaujmout _rváčnický postoj_, což způsobí, že její běžné útoky budou tento prsten vždy používat, i když je vybavena zbraní. Tyto útoky obvykle způsobí poškození _%1$d-%2$d_ a také zdědí očarování a vylepšení zbraně. Tento postoj zpomalí rychlost nabíjení zbraně o 50%%.
items.rings.ringofforce.typical_stats=Když nejste ozbrojeni, při vaší aktuální síle, tento prsten obvykle způsobí poškození o _%1$d-%2$d._ Se zbraní v ruce tento prsten obvykle zvýší poškození o _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Poškození beze zbraně
items.rings.ringofforce.upgrade_stat_name_2=Zvýšení poškození ozbrojenými silami
items.rings.ringofforce.upgrade_stat_name_3=Poškození schopností
