items.weapon.melee.quarterstaff.typical_ability_desc=Duelistka může zaujmout _obranný postoj_ s hůlkou. Tento postoj se aktivuje velmi rychle a obvykle se během _%d tahů ztrojnásobí její úhybná schopnost._
