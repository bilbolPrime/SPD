items.food.mysterymeat.legs=Necítíš si nohy!
items.food.mysterymeat.name=záhadné maso
items.food.mysterymeat.not_well=Necítíš se dobře.
items.food.mysterymeat.stuffed=Jsi přecpaný/á.
items.food.pasty$fishleftover.desc=Trochu ryb z tvého předchozího jídla. Můžeš si je dát, kdykoli budeš chtít, abys trochu zahnal/a hlad.
items.food.pasty$fishleftover.eat_msg=To jídlo chutnalo dobře.
items.food.pasty$fishleftover.name=zbytky ryb
items.food.pasty.amulet_desc=Konečně jste ho našli, magický amulet - počkejte chvilku, tohle je jen čokoláda zabalená ve fólii, která vypadá jako amulet! Nedá vám neomezenou moc, ale alespoň vás zasytí a dodá vám malý artefaktový náboj. \n\nPrvní apríl!
items.food.pasty.amulet_name=amulet z Yendoru?
items.food.pasty.cane_desc=Obrovská sladká cukrová hůl. Je dost velká na to, aby vás zasytila, a cukr by vašim hůlkám mohl dodat i trochu navíc. \n\nVeselé svátky!
items.food.pasty.cane_name=cukrová hůl
items.food.pasty.desc=Autentický cornwallský koláč s tradiční náplní z hovězího masa a brambor. Výborné!
items.food.pasty.egg_desc=Velké čokoládové vajíčko zabalené v barevné žluté fólii. Čokolády je tu dost na to, aby vás zasytila, a cukr by mohl vašim artefaktům dodat trochu navíc. \n\nVeselé Velikonoce!
items.food.pasty.egg_name=velikonoční vajíčko
items.food.pasty.fish_desc=Celá dušená ryba, magicky zakonzervovaná na lůžku ze zeleniny. V tomto ročním období je tradicí schovat si trochu ryby na později, abyste si nechali nějaké zbytky, místo abyste je snědli najednou. \n\nŠťastný lunární nový rok!
items.food.pasty.fish_name=dušená ryba
items.food.pasty.name=pastovitý
items.food.pasty.pie_desc=Velký kus dýňového koláče. Jeho sladká a pikantní chuť vás zasytí a dodá vám trochu léčivých účinků. \n\nVeselý Halloween!
items.food.pasty.pie_name=dýňový koláč
items.food.pasty.rainbow_desc=Tento barevný lektvar je druh tekuté potravy. Kromě toho, že ukojí váš hlad, obsahuje trochu magie, která uklidní sousedního nepřítele, který není boss, a dočasně ho tak znepokojí, zda s vámi bojovat. \n\nŠťastnou hrdost!
items.food.pasty.rainbow_name=duhový lektvar
items.food.pasty.sparkling_desc=Tento šumivý lektvar je druh tekuté stravy. Zasytí hlad a napodobí šumivé víno, ale ve skutečnosti není alkoholický. Teplý pocit v břiše vám poskytne trochu ochrany. \n\nŠťastný nový rok!
items.food.pasty.sparkling_name=šumivý lektvar
items.food.pasty.vanilla_desc=Tento velký kus vanilkového dortu má barevné posypky a modrou polevu. Dort byl vyroben na oslavu let zkušeností a při konzumaci vám dodá malou dávku těchto zážitků. \n\n Původní Pixel Dungeon byl poprvé vydán 4. prosince 2012. Všechno nejlepší k narozeninám, Pixel Dungeon!
items.food.pasty.vanilla_name=modrý dort
items.food.phantommeat.desc=Velký třpytivý průsvitný steak, vyříznutý z přízračné piraně. Toto magické maso se nemusí vařit a kromě plného zasycení poskytuje řadu obranných výhod. Po snědení získáte neviditelnost, kůru, určité léčebné účinky a vyléčíte mnoho škodlivých účinků.
items.food.phantommeat.discover_hint=Tuto položku můžete získat jako drop z určitých nepřátel.
items.food.phantommeat.name=fantomové maso
items.food.smallration.desc=Vypadá to přesně jako standardní dávka jídla, ale menší.
items.food.smallration.discover_hint=Tuto položku si můžete koupit v obchodě.
items.food.smallration.eat_msg=To jídlo chutnalo dobře.
items.food.smallration.name=malá potravinová dávka
items.food.stewedmeat.desc=Dušením se maso zbavilo všech nemocí a parazitů. Mělo by být bezpečné k jídlu.
items.food.stewedmeat.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.food.stewedmeat.eat_msg=To jídlo chutnalo dobře.
items.food.stewedmeat.name=dušené maso
items.food.supplyration.desc=Tato dávka byla zanechána v podzemí členy cechu zlodějů pro členy cechu zlodějů. Je speciálně navržena k jídlu na cestách a pomáhá při obecných podvodech s lebkami.\n\nI když vás nezasytí tolik jako běžná dávka, dá se sníst rychle, poskytuje trochu přímého uzdravení a obnoví náboj Zlodějova pláště stínů.
items.food.supplyration.discover_hint=Tuto položku můžete najít pomocí specifického hrdinského talentu.
items.food.supplyration.name=příděl zásob
items.gold.desc=Hromada zlatých mincí. Sbírejte zlaté mince, abyste je později utratili v obchodě.
items.gold.name=zlato
items.heap.artifact=artefakt
items.heap.chest=Truhla
items.heap.chest_desc=Nebudete vědět, co je uvnitř, dokud to neotevřete!
items.heap.crystal_chest=Křišťálová truhla
items.heap.crystal_chest_desc=Uvnitř vidíš _%s_, ale k otevření truhly potřebuješ křišťálový klíč.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Zamčená hrudník
items.heap.locked_chest_desc=Nebudeš vědět, co je uvnitř, dokud to neotevřeš! Ale k otevření potřebuješ zlatý klíč.
items.heap.remains=Ostatky hrdiny
items.heap.remains_desc=Tohle je vše, co zbylo po jednom z tvých předchůdců. Možná by stálo za to zkontrolovat, jestli tam nejsou nějaké cennosti.
items.heap.ring=prsten
items.heap.skeleton=Kosterní pozůstatky
items.heap.skeleton_desc=Tohle je všechno, co zbylo po nějakém nešťastném dobrodruhovi. Možná by stálo za to zkontrolovat, jestli se tam nenacházejí nějaké cennosti.
items.heap.tomb=Hrobka
items.heap.tomb_desc=Tato starobylá hrobka sice může obsahovat něco užitečného, ale její majitel bude proti kontrole jistě protestovat.
items.heap.wand=hůlka
items.honeypot$shatteredpot.desc=Hrnec je rozbitý, pohromadě ho drží jen lepkavý med, který lemuje jeho stěny, a pomalu se rozpadá.\n\nNavzdory rozbitému stavu se zdá, že včela stále chce hrnec chránit.
items.honeypot$shatteredpot.name=rozbitý medový hrnec
items.honeypot.ac_shatter=ROZBÍT
items.honeypot.desc=Tento velký medník je ve skutečnosti jen vystlaný medem, místo toho v něm bydlí obří včela! Tyto obrovské včely obvykle zůstávají ve svých úlech, možná je ten medník nějakou specializovanou klecí pro lovce? Včela se uvnitř medníku zdá být docela spokojená a když se na ni podíváte, ostražitě na vás bzučí.
items.honeypot.name=medový hrnec
items.item.ac_drop=POKLES
items.item.ac_throw=HOD
items.item.curse=prokletí
items.item.custom_note=Tato položka má vlastní poznámku: „_%s_“
items.item.custom_note_type=Tento typ položky má vlastní poznámku: „_%s_“
