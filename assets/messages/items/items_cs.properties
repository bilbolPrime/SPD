items.weapon.melee.sai$combostriketracker.desc=Duelist si vytváří kombo, které lze použít ke zvýšení poškození schopnosti kombinovaného úderu. Každý úspěšný útok běžnou zbraní na blízko nebo vrhací útok se bude počítát, ale pokud se po dobu 5 kol nepodaří zaútočit, toto kombo se resetuje. \n\nNedávné zásahy: %1$d.\n\nTahy do ztráty zásahů: %2$s.
items.weapon.melee.sai$combostriketracker.name=kombinovaný úder
items.weapon.melee.sai.ability_desc=Duelista může provést _kombinovaný úder_ se sai. Tento útok zaručeně zasáhne a způsobí _+%d poškození_ za každý zásah, který Duelista provede běžným útokem zblízka nebo vrhací zbraní. Pokud Duelista 5 kol nezasáhne, toto kombo se resetuje.
items.weapon.melee.sai.ability_name=kombinovaný úder
items.weapon.melee.sai.desc=Dvě tenké čepele určené k držení v jedné ruce. Vynikající pro drcení nepřátel sprškou seků.
