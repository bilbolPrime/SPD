items.rings.ring.unknown_desc=Tento kovový prsten zdobí velký %s, který se třpytí ve tmě. Kdo ví, jaký účinek bude mít, když si ho nasadíš?
items.rings.ringofaccuracy.combined_stats=Vaše vybavené prsteny kombinují svou sílu a celkovou přesnost se tak zvyšuje o _%s%%_.
items.rings.ringofaccuracy.desc=Tento prsten zvyšuje šanci zasáhnout nepřítele.
