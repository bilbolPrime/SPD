items.weapon.weaponeffects.weaponeffect.smite.prefix=Barbarský
items.weapon.weaponeffects.weaponeffect.smite.name=%s barbara
items.weapon.weaponeffects.weaponeffect.smite.desc=Tato zbraň je _barbarská_. Při zásahu má _20%_ šanci vyvolat _Úder 1. úrovně_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Úder!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Odhazující
items.weapon.weaponeffects.weaponeffect.knockback.name=%s odhození
items.weapon.weaponeffects.weaponeffect.knockback.desc=Tato zbraň _odhazuje_. Při zásahu má _20%_ šanci odhodit nepřítele o _jedno políčko_. Bossy odhodit nelze.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Odhození!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Hadí
items.weapon.weaponeffects.weaponeffect.venom.name=Hadí %s
items.weapon.weaponeffects.weaponeffect.venom.desc=Tato zbraň je _hadí_. Při zásahu má _20%_ šanci otrávit cíl.
items.weapon.weaponeffects.weaponeffect.venom.activate=Jed!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Mrzačící
items.weapon.weaponeffects.weaponeffect.kneeshot.name=Mrzačící %s
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Tato zbraň _mrzačí_. Zásahy na dálku mají _20%_ šanci zmrzačit nepřítele na _10 tahů_. Bossové jsou imunní.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Zmrzačení!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Runový
items.weapon.weaponeffects.weaponeffect.spark.name=%s run
items.weapon.weaponeffects.weaponeffect.spark.desc=Tato hůlka je _runová_. Její magie má _20%_ šanci vyvolat _Jiskru_, která způsobí _4–8_ magického zranění navíc.
items.weapon.weaponeffects.weaponeffect.spark.activate=Jiskra!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Uhranutý
items.weapon.weaponeffects.weaponeffect.curse.name=%s uhranutí
items.weapon.weaponeffects.weaponeffect.curse.desc=Tato hůlka _uhrane_. Její magie má _20%_ šanci oslabit cíl a snížit jeho způsobené zranění o _5%_ na _10 tahů_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Kletba!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Vysávající
items.weapon.weaponeffects.weaponeffect.drainlife.name=Vysávající %s
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Tato hůlka _vysává život_. Její magie má _20%_ šanci způsobit _8–16_ magického zranění navíc a vyléčit tě o tolik zdraví, kolik cíli vzala.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Vysátí!

items.armor.armorprefix.stalwart.name=%s nezdolnosti
items.armor.armorprefix.stalwart.desc=Tato zbroj dává _nezdolnost_. Útoky nepřátel mají _20%_ šanci vyvolat _Houževnatost 5. úrovně_, která sníží jejich zranění o _20%_.
items.armor.armorprefix.stalwart.activate=Houževnatost!

items.armor.armorprefix.vigilant.name=%s ostražitosti
items.armor.armorprefix.vigilant.desc=Tato zbroj dává _ostražitost_. Máš _20%_ šanci vyhnout se nepřátelskému útoku na dálku.
items.armor.armorprefix.vigilant.activate=Ostražitost!

items.armor.armorprefix.elusive.name=%s nepolapitelnosti
items.armor.armorprefix.elusive.desc=Tato zbroj dává _nepolapitelnost_. Když tě nepřátelský útok zraní, máš _20%_ šanci zvýšit své vyhýbání o _5_ na _5 tahů_.
items.armor.armorprefix.elusive.activate=Vyhnutí!
