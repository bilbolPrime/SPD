items.weapon.melee.magesstaff.desc=Tato hůl, vyrobená samotným Mágem, je unikátní magická zbraň, které lze dodat hůlku.
items.weapon.melee.magesstaff.discover_hint=Jeden z hrdinů začíná s touto položkou.
