items.rings.ringofsharpshooting.combined_stats=Vaše vybavené prsteny kombinují svou sílu, čímž zvyšují úroveň efektivní vrhací zbraně o _%1$d_ a celkovou odolnost o _%2$s%%_.
items.rings.ringofsharpshooting.desc=Tento prsten zvyšuje přesnost a míření nositele, což ze všech projektilních zbraní udělá ničivější a odolnější. Prokletý prsten bude mít opačný účinek.
items.rings.ringofsharpshooting.name=kruh střelby
items.rings.ringofsharpshooting.stats=Při nošení tento prsten zvýší poškození vašich vrhaných zbraní, jako by se jejich úroveň zvýšila o _%1$d_, a zvýší jejich odolnost o _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Při nošení tento prsten obvykle zvýší poškození vašich vrhaných zbraní, jako by jejich úroveň byla zvýšena o _%1$d_, a zvýší jejich odolnost o _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Zvýšení poškození na úrovni
items.rings.ringofsharpshooting.upgrade_stat_name_2=Zvýšení odolnosti
items.rings.ringoftenacity.combined_stats=Vaše vybavené prsteny kombinují svou sílu a snižují tak celkové poškození až o _%s%%_.
items.rings.ringoftenacity.desc=Při nošení tento prsten umožní nositeli odolat úderům, které by normálně způsobily smrt. Čím více je uživatel zraněn, tím odolnější bude vůči poškození. Prokletý prsten naopak usnadní nepřátelům jeho popravu.
items.rings.ringoftenacity.name=prsten houževnatosti
