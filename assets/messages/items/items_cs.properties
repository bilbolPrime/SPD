items.weapon.curses.annoying.msg_9=PRÁSK, HAHA!
items.weapon.curses.annoying.name=otravný %s
items.weapon.curses.dazzling.desc=Oslňující zbraně se někdy zablesknou oslnivým světlem a oslepí vše, co je vidí.
items.weapon.curses.dazzling.elestrike_desc=Elementární úder s oslnivou kletbou má 50% šanci oslepit každého nepřítele v dosahu na 6 kol.
items.weapon.curses.dazzling.name=oslnivý %s
items.weapon.curses.displacing.desc=Přemisťovací zbraně jsou naplněny chaotickou teleportační magií, která má schopnost náhodně deformovat nepřátele po podlaze.
items.weapon.curses.displacing.elestrike_desc=Elementární úder s kletbou vymísťování má 50% šanci teleportovat každého nepřítele v dosahu.
items.weapon.curses.displacing.name=vytlačování %s
items.weapon.curses.explosive.desc=Výbušné zbraně postupně nabývají na síle a explodují, čímž poškozují vše v okolí.
items.weapon.curses.explosive.desc_cool=Tvoje zbraň je momentálně na dotek chladná.
items.weapon.curses.explosive.desc_hot=Tvoje zbraň je horká! Chvíli exploduje!
items.weapon.curses.explosive.desc_warm=Tvoje zbraň shromažďuje energii a zahřívá se...
items.weapon.curses.explosive.elestrike_desc=Elementární úder s výbušnou kletbou má 50% šanci způsobit explozi na náhodném nepříteli v dosahu.
items.weapon.curses.explosive.hot=Horký!
items.weapon.curses.explosive.name=výbušnina %s
items.weapon.curses.explosive.warm=Teplý...
items.weapon.curses.friendly.desc=Přátelské zbraně se nejlépe hodí pro pacifisty, občas spustí magii, která znemožní boj.
items.weapon.curses.friendly.elestrike_desc=Elementární úder s přátelskou kletbou má 50% šanci okouzlit každého nepřítele v dosahu na 6 kol.
items.weapon.curses.friendly.name=přátelský %s
items.weapon.curses.polarized.desc=Polarizovaná zbraň je ovlivněna magií, která způsobí, že její útok buď způsobí o 50 % větší poškození, nebo nezpůsobí žádné poškození.
items.weapon.curses.polarized.elestrike_desc=Elementární úder s polarizovanou kletbou má 50% šanci způsobit 24-36 bodů poškození každému nepříteli v dosahu.
items.weapon.curses.polarized.name=polarizované %s
items.weapon.curses.sacrificial.desc=Obětní zbraně budou od nositele vyžadovat krev výměnou za útok na nepřátele. Čím zdravější je nositel, tím více krve kletba vyžádá.
items.weapon.curses.sacrificial.elestrike_desc=Elementární úder s obětní kletbou způsobí, že hrdina a každý nepřítel v dosahu krvácí, čímž mu udělí 12 HP.
items.weapon.curses.sacrificial.name=obětní %s
items.weapon.curses.wayward$waywardbuff.desc=Magie vaší zbloudilé zbraně se aktivovala, takže je na krátkou dobu extrémně nepřesná. Upozorňujeme, že to neovlivňuje útoky, u kterých je zásah zaručen, jako například překvapivé útoky. Úspěšný útok zbloudilou zbraní tento efekt okamžitě zruší. \n\nZbývající tahy: %s.
items.weapon.curses.wayward$waywardbuff.name=nevyzpytatelný
items.weapon.curses.wayward.desc=Zbloudilé zbraně se někdy stanou extrémně nepřesnými. Tato magie po aktivaci trvá krátkou dobu, ale lze ji rozptýlit úderem zbloudilou zbraní.
items.weapon.curses.wayward.elestrike_desc=Elementární úder s kletbou zbloudilého ducha má 50% šanci proklet každého nepřítele v dosahu na 6 kol.
items.weapon.curses.wayward.name=svéhlavý %s
items.weapon.enchantments.blazing.desc=Toto kouzlo způsobí, že ze zbraně vyšlehnou plameny, které zapálí nepřátele a způsobí bonusové poškození nepřátelům, kteří již hoří.
items.weapon.enchantments.blazing.elestrike_desc=Elementární úder s planoucím kouzlem rozšíří oheň na každé políčko v dosahu, což trvá 8 kol.
items.weapon.enchantments.blazing.name=planoucí %s
items.weapon.enchantments.blocking$blockbuff.desc=Blokovací kouzlo tvé zbraně ti na krátkou dobu zvýšilo obrannou sílu!\n\nZbývající štít: %d\n\nZbývající tahy: %s.
items.weapon.enchantments.blocking$blockbuff.name=blokování
items.weapon.enchantments.blocking.desc=Blokující zbraně mají šanci vás po útoku krátce chránit.
items.weapon.enchantments.blocking.elestrike_desc=Elementární úder s blokujícím kouzlem poskytne Duelistovi dalších 6 bodů štítu za každého nepřítele v dosahu.
items.weapon.enchantments.blocking.name=blokování %s
items.weapon.enchantments.blooming.desc=Kvetoucí zbraně obsahují magii, která způsobí, že na nebo kolem těch, které zasáhnou, vyraší vegetace.
items.weapon.enchantments.blooming.elestrike_desc=Elementární úder s kvetoucím kouzlem rozšíří trávu až na 8 políček v dosahu a na 6 kol znehybní všechny nepřátele v dosahu.
items.weapon.enchantments.blooming.name=kvetoucí %s
items.weapon.enchantments.chilling.desc=Nepřátelé zasažení tímto kouzlem jsou zmrazeni, což zpomaluje jejich pohyb a útoky.
items.weapon.enchantments.chilling.elestrike_desc=Elementární úder s mrazivým kouzlem rozšíří mrazivý vzduch na každé políčko v dosahu, což trvá 8 kol.
items.weapon.enchantments.chilling.name=chlazení %s
items.weapon.enchantments.corrupting.desc=Toto mocné kouzlo má schopnost podřídit se vaší vůli nepřátelům. Když je nepřítel touto zbraní zabit, existuje šance, že se místo smrti zkažení.
items.weapon.enchantments.corrupting.elestrike_desc=Elementární úder s kouzlem s poškozením má 5-25% šanci (na základě chybějících HP) poškození každého nepřítele v dosahu kromě primárního cíle.
items.weapon.enchantments.corrupting.name=poškozuje %s
items.weapon.enchantments.elastic.desc=Elastické zbraně mají šanci odmrštit nepřátele na krátké vzdálenosti.
items.weapon.enchantments.elastic.elestrike_desc=Elementární úder s elastickým kouzlem odhodí všechny nepřátele v dosahu o 5 políček zpět.
items.weapon.enchantments.elastic.name=elastický %s
items.weapon.enchantments.grim.desc=Toto mocné kouzlo má schopnost okamžitě popravit nepřítele. Účinek se projeví tím pravděpodobněji, čím slabší je nepřítel.
items.weapon.enchantments.grim.elestrike_desc=Elementární úder s ponurým očarováním má 6–30% šanci (na základě chybějících HP) zabít každého nepřítele v dosahu, kromě primárního cíle.
items.weapon.enchantments.grim.name=ponurý %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Vaše zbraň si uložila přebytečnou sílu z předchozího smrtícího úderu a použije ji jako bonusové poškození při vašem dalším útoku. Energie však bude časem pomalu slábnout. \n\nUložená poškození: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=konzervované poškození
items.weapon.enchantments.kinetic.desc=Když je nepřítel zabit kinetickou zbraní, veškerá přebytečná síla se ve zbrani uloží a bude použita při dalším úspěšném útoku.
items.weapon.enchantments.kinetic.elestrike_desc=Elementární úder s kinetickým očarováním způsobí 40 % uloženého poškození každému nepříteli v dosahu, kromě primárního cíle.
items.weapon.enchantments.kinetic.name=kinetický %s
items.weapon.enchantments.lucky.desc=Nepřátelé zabiti šťastnou zbraní mají šanci získat další kořist.
items.weapon.enchantments.lucky.elestrike_desc=Elementární úder s očarováním štěstí má 12,5% šanci objevit kořist pod každým nepřítelem v dosahu. Tento efekt se může spustit pouze jednou na nepřítele.
items.weapon.enchantments.lucky.name=štěstí %s
items.weapon.enchantments.projecting.desc=S tímto kouzlem získají zbraně na blízko větší dosah. Zbraně na dálku prorazí zdi, když budou namířeny na blízké cíle.
items.weapon.enchantments.projecting.elestrike_desc=Elementární úder s vyčnívajícím očarováním způsobí 30% poškození každému nepříteli v dosahu, kromě primárního cíle.
items.weapon.enchantments.projecting.name=promítání %s
items.weapon.enchantments.shocking.desc=Elektrické oblouky z šokující zbraně, které způsobují dodatečné poškození všem nepřátelům v okolí.
items.weapon.enchantments.shocking.elestrike_desc=Elementární úder se šokujícím očarováním rozšíří elektřinu na každé políčko v dosahu, což trvá 8 kol.
items.weapon.enchantments.shocking.name=šokující %s
items.weapon.enchantments.unstable.desc=Toto kouzlo vyzařuje chaotickou energii a s každým zásahem funguje jako jiné kouzlo.
items.weapon.enchantments.unstable.elestrike_desc=Elementární úder s nestabilním očarováním aplikuje náhodný efekt očarování na každého nepřítele v dosahu, kromě primárního cíle.
items.weapon.enchantments.unstable.name=nestabilní %s
items.weapon.enchantments.vampiric.desc=Toto mocné kouzlo s každým úderem vysává z nepřátel životní sílu a vrací ji zpět do nositele. Účinek je silnější, čím nižší je zdraví nositele.
items.weapon.enchantments.vampiric.elestrike_desc=Elementární úder s upířím očarováním vyléčí Duelistu o 2,5 HP za každého nepřítele v dosahu.
items.weapon.enchantments.vampiric.name=upírský %s
items.weapon.melee.assassinsblade.ability_desc=Duelant se může _plížit_, zatímco má v ruce meč vraha. Tato schopnost mu umožňuje okamžitě mrknout až na 3 políčka a udělit mu _%d tahy neviditelnosti._
items.weapon.melee.assassinsblade.ability_name=žalobníček
items.weapon.melee.assassinsblade.desc=Malá vlnitá čepel vyrobená z obsidiánu, obtížně použitelná i přes svou nízkou hmotnost, ale smrtící, pokud se trefí do správného cíle.
items.weapon.melee.assassinsblade.name=čepel vraha
items.weapon.melee.assassinsblade.stats_desc=Tato zbraň je silnější proti nevědomým nepřátelům.
items.weapon.melee.assassinsblade.typical_ability_desc=Duelistka se může _plížit_, zatímco má v ruce meč vraha. Tato schopnost jí umožňuje okamžitě mrknout až na 3 políčka a obvykle jí uděluje _%d tahy neviditelnosti._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.battleaxe.ability_desc=Duelista může zasadit _těžký úder_ bitevní sekerou. Tento koncentrovaný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.battleaxe.ability_name=těžká rána
items.weapon.melee.battleaxe.desc=Obrovská ocelová hlava této bojové sekery dodává každému širokému úderu značnou váhu.
items.weapon.melee.battleaxe.name=bojová sekera
items.weapon.melee.battleaxe.stats_desc=Tohle je poměrně přesná zbraň.
items.weapon.melee.battleaxe.typical_ability_desc=Duelista může zasadit _těžký úder_ bitevní sekerou. Tento koncentrovaný útok obvykle způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.crossbow$chargedshot.desc=Duelistka soustředí sílu do své kuše. Další útok, který s ní provede, vždy zasáhne nepřátele a aplikuje jeden ze tří efektů: \n - Útoky zblízka odhodí nepřátele o několik políček dál. \n - Šipky bez hrotu způsobí bonusové poškození. \n - Šipky s hrotem získají další využití a jejich efekt se aplikuje v oblasti 7x7. Pozitivní efekty šipek ovlivní pouze spojence a škodlivé efekty pouze nepřátele. Duelistka nemůže tuto schopnost použít k aplikaci pozitivních efektů šipek na sebe.
items.weapon.melee.crossbow$chargedshot.name=nabitý
items.weapon.melee.crossbow.ability_desc=Duelistka může _nabít_ svou kuši, což způsobí, že její další běžný útok s ní vždy zasáhne a aplikuje jeden ze tří efektů: útoky zblízka odhodí nepřátele, nehrotované šípy způsobí _+%1$d poškození_ a hrotované šípy aplikují svůj efekt v oblasti 7x7 a vydrží _%2$d dalších použití_.
items.weapon.melee.crossbow.ability_name=nabitá střela
items.weapon.melee.crossbow.desc=Poměrně složitá zbraň, která střílí šípy výjimečnou rychlostí. I když k tomu není určena, těžká a robustní konstrukce této kuše z ní dělá slušnou zbraň i pro boj zblízka.
items.weapon.melee.crossbow.name=kuše
items.weapon.melee.crossbow.stats_desc=Tato zbraň vylepšuje vržené šipky tak, aby způsobovaly poškození _%1$d-%2$d_, pokud jsou vybaveny, a dokonce jim uděluje i své očarování.
items.weapon.melee.crossbow.typical_ability_desc=Duelistka může _nabít_ svou kuši, což způsobí, že její další běžný útok s ní vždy zasáhne a aplikuje jeden ze tří efektů: útoky zblízka odhodí nepřátele, nehrotované šípy obvykle způsobí _+%1$d poškození_ a hrotované šípy aplikují svůj efekt v oblasti 7x7 a obvykle vydrží _%2$d dalších použití_.
items.weapon.melee.crossbow.typical_stats_desc=Tato zbraň obvykle vylepšuje vržené šipky tak, aby způsobily poškození _%1$d-%2$d_, když jsou vybaveny, a dokonce jim udělí své očarování.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Zvýšení schopností
items.weapon.melee.cudgel.ability_desc=Duelista může provést _těžký úder_ kyjem. Tento koncentrovaný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.cudgel.ability_name=těžká rána
items.weapon.melee.cudgel.desc=Malý mosazný palcát, vyrobený spíše jako nástroj sebeobrany pro šlechtice než jako zbraň pro dobrodružné výpravy.
items.weapon.melee.cudgel.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.melee.cudgel.name=palice
items.weapon.melee.cudgel.stats_desc=Tohle je poměrně přesná zbraň.
items.weapon.melee.cudgel.typical_ability_desc=Duelista může provést _těžký úder_ kyjem. Tento koncentrovaný útok obvykle způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.dagger.ability_desc=Duelistka se může _plížit_, zatímco má v ruce dýku. Tato schopnost jí umožňuje okamžitě mrknout až na 5 políček a udělit jí _%d kola neviditelnosti._
items.weapon.melee.dagger.ability_name=žalobníček
items.weapon.melee.dagger.desc=Jednoduchá železná dýka s opotřebovanou dřevěnou rukojetí.
items.weapon.melee.dagger.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.melee.dagger.name=dýka
items.weapon.melee.dagger.stats_desc=Tato zbraň je silnější proti nevědomým nepřátelům.
items.weapon.melee.dagger.typical_ability_desc=Duelistka se může _plížit_, zatímco má v ruce dýku. Tato schopnost jí umožňuje okamžitě mrknout až na 5 políček a obvykle jí _%d kola neviditelnosti._
items.weapon.melee.dagger.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.dirk.ability_desc=Duelistka se může _plížit_, zatímco má v ruce dýku. Tato schopnost jí umožňuje okamžitě mrknout až na 4 políčka a udělit jí _%d kola neviditelnosti._
items.weapon.melee.dirk.ability_name=žalobníček
items.weapon.melee.dirk.desc=Delší bodná dýka dává trochu více oceli k zaboření do nepřátel.
items.weapon.melee.dirk.name=dýka
items.weapon.melee.dirk.stats_desc=Tato zbraň je silnější proti nevědomým nepřátelům.
items.weapon.melee.dirk.typical_ability_desc=Duelistka se může _plížit_, zatímco má v ruce dýku. Tato schopnost jí umožňuje okamžitě mrknout až na 4 políčka a obvykle jí _%d kola neviditelnosti._
items.weapon.melee.dirk.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.flail$spinabilitytracker.desc=Duelistka točí svým cepem a zvyšuje s ním poškození pro svůj další běžný útok. Každé otočení trvá jedno kolo, ale zvyšuje poškození, maximálně však na tři otočení. Cep během otáčení zaručeně zasáhne. \n\nAktuální otočení: %1$d%%.\nZbývající tahy: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=předení
items.weapon.melee.flail.ability_desc=Duelista může _roztočit_ cep, aby si na krátkou dobu nahromadil sílu. V každém kole, kdy se cep roztočí, způsobí _+%d poškození_ při svém dalším běžném útoku, maximálně však 3krát. Roztočený cep také zaručeně zasáhne. Pouhé spuštění cepu stojí nabití.
items.weapon.melee.flail.ability_name=roztočit
items.weapon.melee.flail.desc=Hrotnatá koule připevněná k rukojeti řetězem. Velmi nepraktická, ale při silném zásahu zničující.
items.weapon.melee.flail.name=cep
items.weapon.melee.flail.spin_warn=S cepem už točit nemůžeš.
items.weapon.melee.flail.stats_desc=Toto je poměrně nepřesná zbraň. \nTato zbraň nedokáže překvapivý útok.
items.weapon.melee.flail.typical_ability_desc=Duelista může _roztočit_ cep, aby si na krátkou dobu nahromadil sílu. V každém kole, kdy se cep roztočí, obvykle způsobí _+%d poškození_ při svém dalším běžném útoku, maximálně však 3krát. Roztočený cep také zaručeně zasáhne. Pouhé spuštění roztočení cepu stojí nabití.
items.weapon.melee.gauntlet.ability_desc=Duelista může provést _kombinovaný úder_ kamennou rukavicí. Tento útok zaručeně zasáhne a způsobí _+%d poškození_ za každý zásah běžnou zbraní na blízko nebo vrhací zbraní. Pokud duelista nezasáhne po dobu 5 kol, toto kombo se resetuje.
items.weapon.melee.gauntlet.ability_name=kombinovaný úder
items.weapon.melee.gauntlet.desc=Tato mohutná rukavice je vyrobena z karmínové látky s vrstvou těžkých magických kamenů navrchu. Látka se kolem vás stahuje a tlusté kamenné desky se téměř stáhnou jako druhá kůže. Švihání tak těžkou zbraní vyžaduje sílu, ale vašim úderům dodává obrovskou razanci.
items.weapon.melee.gauntlet.name=kamenná rukavice
items.weapon.melee.gauntlet.stats_desc=Tohle je velmi rychlá zbraň.
items.weapon.melee.gauntlet.typical_ability_desc=Duelista může provést _kombinovaný úder_ kamennou rukavicí. Tento útok zaručeně zasáhne a obvykle způsobí _+%d poškození_ za každý zásah běžnou zbraní na blízko nebo vrhací zbraní. Pokud duelista nezasáhne po dobu 5 kol, toto kombo se resetuje.
items.weapon.melee.glaive.ability_desc=Duelista může použít špičku glaivy k _probodnutí_ nepřítele, který je v dosahu, ale není v jeho blízkosti. To způsobí _%1$d-%2$d poškození_, odhodí nepřítele zpět a zaručeně ho zasáhne.
items.weapon.melee.glaive.ability_name=špice
items.weapon.melee.glaive.desc=Masivní tyčová zbraň sestávající z mečové čepele na konci tyče.
items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=Toto je poměrně pomalá zbraň. \nTato zbraň má extra dosah.
items.weapon.melee.glaive.typical_ability_desc=Duelista může použít špičku glaivy k _probodnutí_ nepřítele, který je v dosahu, ale není v jeho blízkosti. To obvykle způsobí _%1$d-%2$d poškození_, odhodí nepřítele zpět a zaručeně ho zasáhne.
items.weapon.melee.gloves.ability_desc=Duelista může provést _kombinovaný úder_ s rukavicemi s cvočky. Tento útok zaručeně zasáhne a způsobí _+%d poškození_ za každý zásah běžnou zbraní na blízko nebo vrhací zbraní. Pokud duelista nezasáhne po dobu 5 kol, toto kombo se resetuje.
items.weapon.melee.gloves.ability_name=kombinovaný úder
items.weapon.melee.gloves.desc=Tyto rukavice s cvočky neposkytují žádnou skutečnou ochranu, ale fungují jako použitelná zbraň a zároveň vám uvolní ruce.
items.weapon.melee.gloves.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.melee.gloves.name=rukavice s cvočky
items.weapon.melee.gloves.stats_desc=Tohle je velmi rychlá zbraň.
items.weapon.melee.gloves.typical_ability_desc=Duelista může provést _kombinovaný úder_ s rukavicemi s cvočky. Tento útok zaručeně zasáhne a obvykle způsobí _+%d poškození_ za každý zásah běžnou zbraní na blízko nebo vrhací zbraní. Pokud duelista nezasáhne po dobu 5 kol, toto kombo se resetuje.
items.weapon.melee.greataxe.ability_desc=Duelistka může provést útok _odplaty_ velkou sekerou, pokud má méně než 50%% zdraví. Tento zničující útok způsobí _%1$d-%2$d poškození,_ zaručeně zasáhne a je okamžitý, pokud zabije nepřítele.
items.weapon.melee.greataxe.ability_name=odškodnění
items.weapon.melee.greataxe.desc=Tato titánská sekera, určená k nošení přes rameno, je stejně silná jako těžká.
items.weapon.melee.greataxe.name=velká sekera
items.weapon.melee.greataxe.stats_desc=Tato zbraň je neuvěřitelně těžká.
items.weapon.melee.greataxe.typical_ability_desc=Duelistka může provést útok _odplaty_ velkou sekerou, pokud má méně než 50%% zdraví. Tento zničující útok obvykle způsobí _%1$d-%2$d poškození,_ zaručeně zasáhne a je okamžitý, pokud zabije nepřítele.
items.weapon.melee.greatshield.ability_desc=Duelista se může _bránit_ velkým štítem, který po dobu _%d tahů_ zcela zneplatní všechny fyzické nebo magické útoky namířené proti němu. Jakmile duelista útok zablokuje, opětovný útok nebo použití magie ukončí obranu.
items.weapon.melee.greatshield.ability_name=hlídat
items.weapon.melee.greatshield.desc=Tato gigantická masa kovu, spíše jako mobilní zeď než štít, napomáhá obraně, ale neponechává mnoho prostoru pro útok.
items.weapon.melee.greatshield.name=velký štít
items.weapon.melee.greatshield.stats_desc=Tato zbraň blokuje poškození 0-%d. Toto blokování se škáluje s vylepšeními.
items.weapon.melee.greatshield.typical_ability_desc=Duelista se může _bránit_ velkým štítem, který zcela zneguje všechny fyzické nebo magické útoky proti němu, obvykle po dobu _%d tahů_. Jakmile duelista útok zablokuje, opětovný útok nebo použití magie ukončí obranu.
items.weapon.melee.greatshield.typical_stats_desc=Tato zbraň obvykle blokuje poškození 0-%d. Toto blokování se škáluje s vylepšeními.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.greatsword.ability_desc=Duelista může _rozseknout_ nepřítele dvouručním mečem. Tím se způsobí _%1$d-%2$d poškození_ a je zaručeno, že nepřítel zasáhne sekání. Pokud sekání zabije nepřítele, je to okamžitě a duelista může sekání použít znovu do 5 kol zdarma.
items.weapon.melee.greatsword.ability_name=rozštípnout
items.weapon.melee.greatsword.desc=Tato tyčící se čepel způsobuje těžké poškození tím, že do každého švihu vkládá svou tíhu.
items.weapon.melee.greatsword.name=dvouruční meč
items.weapon.melee.greatsword.typical_ability_desc=Duelista může _rozseknout_ nepřítele dvouručním mečem. To obvykle způsobí _%1$d-%2$d poškození_ a je zaručeno, že zasáhne. Pokud rozseknutí zabije nepřítele, je to okamžitě a duelista může rozseknutí použít znovu do 5 kol zdarma.
items.weapon.melee.handaxe.ability_desc=Duelista může provést _těžký úder_ ruční sekerou. Tento koncentrovaný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.handaxe.ability_name=těžká rána
items.weapon.melee.handaxe.desc=Lehká sekera, nejčastěji používaná ke kácení stromů. Široká čepel funguje dobře i proti nepřátelům.
items.weapon.melee.handaxe.name=ruční sekera
items.weapon.melee.handaxe.stats_desc=Tohle je poměrně přesná zbraň.
items.weapon.melee.handaxe.typical_ability_desc=Duelista může provést _těžký úder_ ruční sekerou. Tento koncentrovaný útok obvykle způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.katana.ability_desc=Duelista se může _výpadnout_ katanou na nepřítele vzdáleného 1 políčko. Tato výpadová zbraň se pohybuje směrem k nepříteli, způsobuje poškození _%1$d-%2$d_ a zaručeně ho zasáhne.
items.weapon.melee.katana.ability_name=výpad
items.weapon.melee.katana.desc=Štíhlý meč s velkou kovovou záštitou nad rukojetí.
items.weapon.melee.katana.name=katana
items.weapon.melee.katana.stats_desc=Tato zbraň blokuje 0-3 poškození.
items.weapon.melee.katana.typical_ability_desc=Duelista se může _výpadnout_ katanou na nepřítele vzdáleného 1 políčko. Tato výpadová zbraň se pohybuje směrem k nepříteli, obvykle způsobuje poškození _%1$d-%2$d_ a je zaručeno, že zasáhne.
items.weapon.melee.longsword.ability_desc=Duelista může _rozseknout_ nepřítele dlouhým mečem. Tím se způsobí _%1$d-%2$d poškození_ a je zaručeno, že se nepřítel zasáhne. Pokud sekání zabije nepřítele, je to okamžitě a duelista může sekání použít znovu do 5 kol zdarma.
items.weapon.melee.longsword.ability_name=rozštípnout
items.weapon.melee.longsword.desc=Dlouhá ocelová čepel ostrá jako břitva se uklidňujícím způsobem leskne, i když je kvůli své velikosti poměrně těžký.
items.weapon.melee.longsword.name=dlouhý meč
items.weapon.melee.longsword.typical_ability_desc=Duelista může _rozseknout_ nepřítele dlouhým mečem. To obvykle způsobí _%1$d-%2$d poškození_ a je zaručeno, že zasáhne. Pokud rozseknutí zabije nepřítele, je to okamžitě a Duelista může rozseknutí použít znovu do 5 tahů zdarma.
items.weapon.melee.mace.ability_desc=Duelista může provést _těžký úder_ palcátem. Tento koncentrovaný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.mace.ability_name=těžká rána
items.weapon.melee.mace.desc=Velká železná hlava této zbraně způsobuje značné poškození.
items.weapon.melee.mace.name=žezlo
items.weapon.melee.mace.stats_desc=Tohle je poměrně přesná zbraň.
items.weapon.melee.mace.typical_ability_desc=Duelista může provést _těžký úder_ palcátem. Tento koncentrovaný útok obvykle způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
