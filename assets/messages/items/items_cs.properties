items.journal.alchemypage.desc=Vytržená stránka z průvodce alchymií.\n\nVětšina textu je příliš malá na to, aby se dala číst z dálky, ale název stránky je rozeznatelný:\n\n_"%s"_
items.journal.alchemypage.name=roztrhaná stránka knihy alchymie
items.journal.documentpage.desc=Osamělá stránka, pravděpodobně vytržená z nějaké knihy. Budete si ji muset vzít, abyste si ji mohli přečíst.
items.journal.documentpage.name=roztrhaná stránka
items.journal.guidebook.desc=Průvodce pro dobrodruhy, zanechaný někým, kdo se rozhodl, že dobrodružství není pro něj! Tato konkrétní kniha je kouzelná a dokáže dobrodruhy přimět k přečtení stránky ve správný okamžik.\n\nNavzdory této funkčnosti je kniha nejoblíbenější díky velkým slovům „Nepanikařte!“ napsaným velkými přátelskými písmeny na obálce.
items.journal.guidebook.hint_desktop=Váš průvodce má pro vás radu! Vyberte blikající tlačítko deníku (%s) v pravém horním rohu a přečtěte si ho.
items.journal.guidebook.hint_mobile=Váš průvodce má pro vás rady! Klepnutím na blikající tlačítko deníku v pravém horním rohu si ho můžete přečíst.
items.journal.guidebook.hint_status=Průvodce
items.journal.guidebook.name=svazek o zvládnutí dungeonů
items.journal.guidepage.desc=Vytržená stránka z dobrodružného průvodce.\n\nVětšina textu je příliš malá na to, aby se dala číst z dálky, ale název stránky je rozeznatelný:\n\n_"%s"_
items.journal.guidepage.name=roztrhaná stránka průvodce
items.journal.regionlorepage$caves.desc=Vypadá to jako zápis v lodním deníku nějakého průzkumníka, překvapivě dobře zachovaný, navzdory tomu, jak starý musí být. Vezměte si ho a přečtěte si ho.
items.journal.regionlorepage$caves.name=starý záznam v protokolu
items.journal.regionlorepage$city.desc=Malá zrezivělá kovová tabulka s magicky vyrytým vzkazem. Písmena jsou i přes stáří tabulky stále čitelná, ale abyste si je mohli přečíst, budete ji muset zvednout.
items.journal.regionlorepage$city.name=zrezivělý tablet
items.journal.regionlorepage$halls.desc=Malá černá tabulka s vyrytými zářícími zelenými písmeny. Svítící písmena se v dálce rozmazávají do mlhy, budete ji muset zvednout, abyste si ji mohli přečíst.
items.journal.regionlorepage$halls.name=zářící tablet
items.journal.regionlorepage$prison.desc=Zápis z deníku nebo nějaký jiný druh záznamu napsaný na starém kousku papíru. Zdá se, že se mu dařilo lépe než dopisům, které jste našli v kanálech, ale i tak si ho budete muset sebrat, abyste si ho mohli přečíst.
items.journal.regionlorepage$prison.name=opotřebovaný zápis v deníku
items.journal.regionlorepage$sewers.desc=Něco, co vypadá jako dopis, napsané na zašpiněném kousku papíru. Budete ho muset zvednout, abyste rozeznali, co je na něm napsáno.
items.journal.regionlorepage$sewers.name=opotřebovaný dopis
items.keys.crystalkey.desc=Broušené plochy tohoto křišťálového klíče se třpytí ve tmě. Možná otevře něco z křišťálu?
items.keys.crystalkey.name=Křišťálový klíč
items.keys.goldenkey.desc=Zářezy na tomto zlatém klíči jsou drobné a složité. Možná otevře zamčenou truhlici?
items.keys.goldenkey.name=zlatý klíč
items.keys.ironkey.desc=Zářezy na tomto starobylém železném klíči jsou značně opotřebované; jeho kožená šňůrka je otlučená věkem. Jaké dveře by mohl otevřít?
items.keys.ironkey.name=železný klíč
items.keys.skeletonkey.name=kostrový klíč
items.keys.wornkey.desc=Tento klíč je opotřebovaný a zabarvený, ale vypadá vážně. Pravděpodobně by mohl otevřít nějaké vážné dveře poblíž.
items.keys.wornkey.name=opotřebovaný klíč
items.kindofmisc.unequip_message=Nejprve musíte jeden z těchto předmětů vyjmout. Vyberte předmět, za který ho chcete vyměnit.
items.kindofmisc.unequip_title=Zbavte se jednoho předmětu
items.kindofweapon.empty=prázdný
items.kindofweapon.equip_cursed=Tvá stisk mimovolně sevře zbraň.
items.kindofweapon.swift_equip=Rychle si vybavíš zbraň.
items.kindofweapon.which_equip_msg=Do kterého slotu na zbraň byste chtěli tuto položku umístit?\n\nŠampion útočí přímo svou primární zbraní, ale může použít schopnost kterékoli z obou zbraní. Obě zbraně mají stejný počet nabití.\n\nŠampion si také může okamžitě vyměnit svou primární a sekundární zbraň.
items.kindofweapon.which_equip_primary=Primární (%s)
items.kindofweapon.which_equip_secondary=Sekundární (%s)
items.kingscrown.ac_wear=NOSIT
items.kingscrown.desc=Koruna posledního trpasličího krále září ohromnou magickou energií. \n\nPři nošení se magie koruny přenese do brnění, které právě nosíte, a promění ho v _jedinečné epické brnění se speciálními schopnostmi._ Nové brnění si zachová všechny vlastnosti původního brnění.
items.kingscrown.discover_hint=Tuto položku můžete získat jako drop z určitých nepřátel.
items.kingscrown.naked=Korunka bohužel nedokáže proměnit vaše spodní prádlo.
items.kingscrown.name=Koruna trpasličího krále
items.kingscrown.ratgraded=Tlapky Krále Krys jasně září, jak se vaše brnění transformuje!
items.kingscrown.upgraded=Koruna jasně září a pak se rozpadá, jak se vaše brnění transformuje!
items.liquidmetal.ac_apply=PŘIHLÁSIT SE
items.liquidmetal.already_fixed=Ta vrhací zbraň je už v perfektním stavu!
items.liquidmetal.apply=K opravě vrhací zbraně použijete tekutý kov %d.
items.liquidmetal.desc=Tato magická tekutina dokáže vyplnit praskliny a trhliny na hozené zbrani a obnovit ji do perfektního stavu! Pokud v sadě zbraní chybí zbraň, ale jinak je plně opravena, lze tekutý kov dokonce použít k nahrazení chybějící zbraně ze sady! \n\nA Zbraň 1. úrovně vyžaduje k úplné opravě 10 tekutého kovu, zbraň 5. úrovně 30. Každé vylepšení také zvyšuje množství potřebného kovu o 35 %. \n\n Tekutý kov nelze použít k opravě hrotů šipek s hrotem.
items.liquidmetal.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.liquidmetal.name=tekutý kov
items.liquidmetal.prompt=Vyberte vrhací zbraň
items.lostbackpack.desc=Toto je váš ztracený inventář. Sesbírejte ho, abyste získali zpět všechny ztracené předměty!
items.lostbackpack.name=ztracený batoh
items.merchantsbeacon.ac_use=POUŽITÍ
items.merchantsbeacon.desc=Tento zvláštní kousek trpasličí technologie vám umožňuje komunikovat na velké vzdálenosti.\n\nPo aktivaci vám tento maják umožní prodávat předměty do Pixel Martu odkudkoli z podzemí.\n\nMagie uvnitř majáku však vydrží pouze jednu seanci, takže ji používejte moudře.
items.merchantsbeacon.name=obchodní maják
items.potions.brews.aquabrew.desc=Když se tento odvar roztříští, uvolní v místě svého výbuchu tlakovou vodu. Její síla je jen taková, aby poškodila ohnivé nepřátele, ale také rozptýlí vodu do blízkého terénu, zneškodní pasti, uhasí požáry a odhodí postavy v blízkosti výbuchu.
items.potions.brews.aquabrew.name=vodní nápoj
items.potions.brews.blizzardbrew.desc=Když se tento nápoj rozbije, spustí se vířivá sněhová bouře, která se rychle šíří jako plyn.
items.potions.brews.blizzardbrew.name=vánice
items.potions.brews.brew.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.potions.brews.causticbrew.desc=Tento nápoj rozptýlí korozivní sliz v široké oblasti kolem místa, kde se roztříští. Všechno, co se do slizu zachytí, se pomalu roztaví, pokud to nelze smýt vodou.
items.potions.brews.causticbrew.name=žíravý nápoj
items.potions.brews.infernalbrew.desc=Když se tento nápoj rozbije, rozpoutá zuřivé peklo, které se rychle šíří jako plyn.
items.potions.brews.infernalbrew.name=pekelný nápoj
items.potions.brews.shockingbrew.desc=Když se tento nápoj rozbije, vyvolá elektrickou bouři v široké oblasti kolem místa, kde praskne.
items.potions.brews.shockingbrew.name=šokující nápoj
items.potions.brews.unstablebrew.desc=Tento magický nápoj září měnícími se barvami duhy.\n\nPo vypití nebo hození se spustí efekt náhodného lektvaru. Lektvar bude vždy prospěšný, pokud se vypije, a vždy bude škodlivý, pokud se ho hodí.
items.potions.brews.unstablebrew.name=nestabilní nápoj
items.potions.elixirs.elixir.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Dočasně jsi získal/a regenerační vlastnosti podobné těm, které má Goo.\n\nKdyž stojíš ve vodě, obnovíš malé množství zdraví za kolo. Efekt se pozastaví, když máš plné zdraví nebo jsi mimo vodu.\n\nZbývající léčení: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=vodní léčení
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Tento elixír obsahuje zbytky slizu (Goo) vylepšené léčivým lektvarem. I když neposkytne okamžité uzdravení, bude postupně obnovovat větší množství zdraví, zatímco stojíte ve vodě.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elixír vodního omlazení
items.potions.elixirs.elixirofarcanearmor.desc=Tento elixír poskytne pijákovi dlouhodobou odolnost vůči magickému poškození.
items.potions.elixirs.elixirofarcanearmor.name=elixír tajemného brnění
items.potions.elixirs.elixirofdragonsblood.desc=Po požití tento elixír vyšle ohnivou sílu do žil pijáka. Tento efekt ho učiní imunním vůči ohni a umožní mu zapálit nepřátele fyzickými útoky.
items.potions.elixirs.elixirofdragonsblood.name=elixír dračí krve
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Jsi pod vlivem elixíru pádu z peří, který ti umožňuje padat do propastí bez utrpení poškození!\n\nZbývající tahy: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=pád peří
items.potions.elixirs.elixiroffeatherfall.desc=Tento elixír nabízí slabší, ale kontrolovanější levitační efekt, který umožňuje pijákovi na chvíli padat na velké vzdálenosti bez újmy.
items.potions.elixirs.elixiroffeatherfall.light=Cítíte se lehkí jako pírko!
items.potions.elixirs.elixiroffeatherfall.name=elixír pádu peří
items.potions.elixirs.elixirofhoneyedhealing.desc=Tento elixír kombinuje léčivé účinky se sladkostí medu. Po vypití má stejný účinek jako léčivý lektvar a ukojí malé množství hladu, ale lze jej také seslat k uzdravení spojence. \n\nTvorové se sklonem k medu by mohli být uklidněni, pokud se na ně tento předmět použije.
items.potions.elixirs.elixirofhoneyedhealing.name=medový léčivý elixír
items.potions.elixirs.elixiroficytouch.desc=Po požití tento elixír umožní pijákovi vysát teplo z nepřátel, na které útočí. Tento efekt ho učiní imunním vůči chladu a umožní mu zmrazit nepřátele fyzickými útoky.
items.potions.elixirs.elixiroficytouch.name=elixír ledového doteku
items.potions.elixirs.elixirofmight$htboost.desc=Vaše tělo se cítí nepřirozeně silné a zdravé. \n\nVaše maximální zdraví je po delší dobu zvýšeno. S rostoucími úrovněmi se toto zvýšení postupně snižuje. \n\nAktuální výše zvýšení: %d.\nZbývající úrovně: %d.
items.potions.elixirs.elixirofmight$htboost.name=maximální zvýšení zdraví
items.potions.elixirs.elixirofmight.desc=Tato silná tekutina protéká vašimi svaly, trvale zvyšuje vaši sílu o jeden bod a dočasně zvyšuje maximální zdraví o %d bodů. Zvýšení zdraví se zvyšuje s vaším maximálním zdravím, ale s rostoucími úrovněmi bude pomalu odeznívat.
items.potions.elixirs.elixirofmight.msg=Nově nabytá síla se rozlévá tvým tělem, teď máš sílu %d!
items.potions.elixirs.elixirofmight.name=elixír moci
items.potions.elixirs.elixiroftoxicessence.desc=Po požití tento elixír naplní pijáka toxickou energií. Piják bude při svém pohybu nepřetržitě šířit toxický plyn a bude imunní vůči toxickému plynu a jedu po dobu o něco delší, než trvá účinek.
items.potions.elixirs.elixiroftoxicessence.name=elixír toxické esence
items.potions.exotic.exoticpotion.amber=exotický jantarový lektvar
items.potions.exotic.exoticpotion.azure=exotický azurový lektvar
items.potions.exotic.exoticpotion.bistre=exotický bistrový lektvar
items.potions.exotic.exoticpotion.charcoal=exotický lektvar s dřevěným uhlím
items.potions.exotic.exoticpotion.crimson=exotický karmínový lektvar
items.potions.exotic.exoticpotion.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.potions.exotic.exoticpotion.golden=exotický zlatý lektvar
items.potions.exotic.exoticpotion.indigo=exotický indigový lektvar
items.potions.exotic.exoticpotion.ivory=exotický lektvar ze slonoviny
items.potions.exotic.exoticpotion.jade=exotický nefritový lektvar
items.potions.exotic.exoticpotion.magenta=exotický purpurový lektvar
items.potions.exotic.exoticpotion.no=Ne, změnil jsem názor.
items.potions.exotic.exoticpotion.silver=exotický stříbrný lektvar
items.potions.exotic.exoticpotion.turquoise=exotický tyrkysový lektvar
items.potions.exotic.exoticpotion.unknown_desc=Tato kulatá baňka obsahuje zrnitou barevnou tekutinu. Zdá se být pro tuto zemi cizí, kdo ví, co by se s ní dalo dělat, když se vypije nebo ji hodí do vody?
items.potions.exotic.exoticpotion.warning=Opravdu chcete zrušit užívání tohoto lektvaru? Stejně bude spotřebován.
items.potions.exotic.exoticpotion.yes=Ano, jsem pozitivní/á
items.potions.exotic.potionofcleansing$cleanse.desc=Tato postava je dočasně imunní vůči všem škodlivým statusovým efektům!\n\nZbývající tahy: %s.
items.potions.exotic.potionofcleansing$cleanse.name=očištěný
items.potions.exotic.potionofcleansing.desc=Toto silné činidlo po vypití učiní pijáka imunním vůči všem škodlivým statusovým efektům na několik kol. Lze jej také hodit na cíl, aby se očistil.
items.potions.exotic.potionofcleansing.name=lektvar očisty
items.potions.exotic.potionofcorrosivegas.desc=Otevření nebo rozbití této tlakové sklenice způsobí, že její obsah exploduje do smrtícího oblaku korozivního rezavě zbarveného plynu. Plyn se šíří rychleji než toxický plyn a je smrtelnější, ale také nevydrží tak dlouho.
items.potions.exotic.potionofcorrosivegas.name=lektvar korozivního plynu
items.potions.exotic.potionofdivineinspiration.bonus=+2 body talentu!
items.potions.exotic.potionofdivineinspiration.desc=Síla svaté energie zredukované na tekutou formu, tento nápoj naplní pijáka božskou mocí a poskytne mu dva bonusové talentové body v úrovni dle vlastního výběru. \n\nTento lektvar lze pro každou úroveň talentu použít pouze jednou.
items.potions.exotic.potionofdivineinspiration.name=lektvar božské inspirace
items.potions.exotic.potionofdivineinspiration.no_more_points=Nemůžete získat žádné další bonusové talentové body.
items.potions.exotic.potionofdivineinspiration.select_tier=Vyberte úroveň talentu, za kterou získáte dva bonusové body. Abyste mohli body utratit, musíte mít úroveň odemčenou.
items.potions.exotic.potionofdragonsbreath.desc=Tato baňka obsahuje neobvyklou sloučeninu, která se krátce po smíchání se slinami vznítí. Rychlé vyplivnutí tekutiny umožní uživateli vychrlit plamen z úst!
items.potions.exotic.potionofdragonsbreath.name=lektvar dračího dechu
items.potions.exotic.potionofdragonsbreath.prompt=Vyberte místo pro vypálení
items.potions.exotic.potionofearthenarmor.desc=Spíše než paralyzovat, má tato tekutina na pokožku ztvrdlý účinek, který ji promění v dočasný přirozený pancíř.
items.potions.exotic.potionofearthenarmor.name=lektvar hliněného brnění
items.potions.exotic.potionofmagicalsight.desc=Po vypití se vaše smysly na chvíli zintenzivní na neuvěřitelnou úroveň, což vám umožní vidět skrz zdi v okruhu 12 dlaždic!
items.potions.exotic.potionofmagicalsight.name=lektvar magického zraku
items.potions.exotic.potionofmastery.armor_easier=Vaše brnění se bude snáze nosit!
items.potions.exotic.potionofmastery.desc=Místo toho, aby tento lektvar poskytoval surovou sílu, naladí svaly uživatele na konkrétní předmět. Díky tomu se daný předmět snáze používá, jako by si s ním piják procvičoval a budoval svalovou paměť. \n\nVybraná zbraň nebo brnění bude k použití vyžadovat o 2 body síly méně. Tento lektvar lze na každý předmět použít pouze jednou.
items.potions.exotic.potionofmastery.name=lektvar mistrovství
items.potions.exotic.potionofmastery.prompt=Zvládnutí položky
items.potions.exotic.potionofmastery.weapon_easier=Vaše zbraň se bude ovládat snáze!
items.potions.exotic.potionofshielding.desc=Spíše než léčení tento lektvar vytvoří kolem těla uživatele odolný štít, který blokuje značné množství poškození.
items.potions.exotic.potionofshielding.name=lektvar ochrany
items.potions.exotic.potionofshroudingfog.desc=Když je kapalina v této baňce vystavena vzduchu, vytvoří hustou kouřovou mlhu, která se rychle šíří a blokuje výhled vašich nepřátel.
items.potions.exotic.potionofshroudingfog.name=lektvar zahalující mlhy
items.potions.exotic.potionofsnapfreeze.desc=Chemikálie obsažená v tomto lektvaru rychle reaguje se vzduchem, okamžitě zmrazí a zničí vše, co se dostane do jeho působení.
items.potions.exotic.potionofsnapfreeze.name=lektvar rychlého zmrazení
items.potions.exotic.potionofstamina.desc=Pití této podivně sladké tekutiny vám dodá dlouhotrvající dávku energie, která vám umožní běhat zrychleným tempem po delší dobu.
items.potions.exotic.potionofstamina.name=lektvar výdrže
items.potions.exotic.potionofstormclouds.desc=Vržení tohoto lektvaru vytvoří rychle se šířící oblak koncentrované páry, která se zkondenzuje a rozlije se po okolí. Většina terénu se přemění na vodu, ohniví nepřátelé utrpí poškození, oheň bude uhašen a pasti budou přemoženy a zničeny.
items.potions.exotic.potionofstormclouds.name=lektvar bouřkových mraků
items.potions.potion$placeholder.name=lektvar
items.potions.potion$seedtopotion.name=Náhodný lektvar
items.potions.potion.ac_drink=VYPÍT
items.potions.potion.amber=jantarový lektvar
items.potions.potion.azure=azurový lektvar
items.potions.potion.beneficial=Blahodárný lektvar
