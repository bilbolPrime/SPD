items.food.berry.name=bobule z podzemí
items.food.blandfruit$chunks.desc=Mdlé ovoce při nárazu explodovalo a zanechalo po sobě nehybné kusy. \n\nNavzdory troše nečistot se tyto velké kusy uvařeného mlhavého ovoce zdají být dokonale jedlé.
items.food.blandfruit$chunks.name=kousky nevýrazného ovoce
items.food.blandfruit.blindfruit=slepý plod
items.food.blandfruit.cooked=vařené nevýrazné ovoce
items.food.blandfruit.desc=Tak suché a nehmotné, že by ho možná dušení s jinou ingrediencí vylepšilo.
items.food.blandfruit.desc_cooked=Ovoce od doby, kdy se máčelo v hrnci, nabobtnalo a dokonce absorbovalo vlastnosti semínka, se kterým bylo vařeno. Bude mít účinek lektvaru, kterému semínko odpovídalo.
items.food.blandfruit.desc_eat=Vypadá to, že je připravené k jídlu!
items.food.blandfruit.desc_throw=Zdá se to dost nestálé, možná by bylo nejlepší to hodit.
