items.rings.ringofmight.combined_stats=Tvé vybavené prsteny kombinují svou sílu a celkově zvyšují tvou sílu o _%1$d_ a maximální HP o _%2$s%%_.
items.rings.ringofmight.desc=Tento prsten posiluje fyzické vlastnosti nositele a dodává mu větší fyzickou sílu a konstituci. Prokletý prsten nositele oslabí.
items.rings.ringofmight.name=prsten moci
items.rings.ringofmight.stats=Při nošení tento prsten zvýší vaši sílu o _%1$d_ a vaše maximální HP o _%2$s%%._
items.rings.ringofmight.typical_stats=Při nošení tento prsten obvykle zvýší vaši sílu o _%1$d_ a vaše maximální HP o _%2$s%%._
