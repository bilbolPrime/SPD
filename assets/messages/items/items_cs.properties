items.artifacts.etherealchains.cant_reach=Tvoje řetězy tam nedosáhnou.
items.artifacts.etherealchains.cursed=Nemůžeš použít prokleté řetězy.
items.artifacts.etherealchains.desc=Tyto velké, ale lehké řetězy září duchovní energií. Mohou být použity k přitažení vás k terénu nebo k přitažení nepřátel k vám. Éterická povaha řetězů jim dokonce umožňuje procházet skrz zdi!
items.artifacts.etherealchains.desc_cursed=Prokleté řetězy jsou připoutány k tvému boku, neustále se houpou a snaží se tě svázat nebo zakopnout.
items.artifacts.etherealchains.desc_equipped=Řetězy spočívají po tvém boku a pomalu vysávají duchovní energii těch, které porazíš. Každý náboj je článkem řetězu, který se rozprostírá přesně o jedno políčko dál.
items.artifacts.etherealchains.does_nothing=To nic nezmůže.
items.artifacts.etherealchains.inside_wall=Tvé řetězy tě můžou protáhnout jen skrz zdi, ne do nich.
items.artifacts.etherealchains.name=éterické řetězy
items.artifacts.etherealchains.no_charge=Vaše řetězy nemají dostatečné náboje.
items.artifacts.etherealchains.nothing_to_grab=Tam není nic, čeho by se dalo chytit.
