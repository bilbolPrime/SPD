items.amulet.ac_end=UKONČETE HRU
items.amulet.ascent_desc=Začneš cítit, jak z amuletu vyzařuje Yog-Dzewaova velká a děsivá síla. Výstup zpět dungeonem jako smrtelník by mohl být obtížnější, než sis myslel!\n\nPokud budeš s amuletem pokračovat ve výstupu, dungeon se stane nebezpečnějším, teleporty mezi patry budou deaktivovány a hru budeš moci vyhrát pouze porážkou nepřátel při výstupu dungeonem!\n\nAmulet zde prozatím můžeš nechat, pokud chceš vystoupit bez zahájení této výzvy, nebo ho aktivovat před výstupem a hru tak normálně ukončit.
items.amulet.ascent_no=Zastavte se pro teď
items.amulet.ascent_title=Nanebevstoupení
items.amulet.ascent_yes=Pokračovat!
items.amulet.desc=Amulet Yendoru je nejmocnější artefakt známý lidstvu i trpaslíkům. Jeho třpytivé krystaly v sobě ukrývají neuvěřitelnou a úžasnou sílu.
items.amulet.desc_ascent=Původ amuletu není znám, ale je zřejmé, že byl silně ovlivněn Yog-Dzewovou mocí. Zdá se, že jeskyně se s postupem podřizuje Yogově vůli, čímž se nepřátelé stávají mnohem početnějšími a silnějšími! Také už nemůžete amulet aktivovat ani odhodit, téměř jako by byl prokletý.
items.amulet.desc_origins=Původ amuletu není znám. Historie praví, že král trpaslíků se chlubil, že artefakt objevil krátce předtím, než s ním trpasličí civilizace přerušila veškerý kontakt. Jak ho našel? Jak mu ho Yog-Dzewa vzal? Otázky možná na jindy, teď už jen záleží na tom, že amulet je váš!
items.amulet.discover_hint=Tuto položku najdete na dně podzemí...
items.amulet.name=amulet z Yendoru
items.ankh.ac_bless=žehnat
items.ankh.bless=Ankh požehnáš magickou vodou.
items.ankh.desc=Prastarý symbol nesmrtelnosti umožňuje návrat do života po smrti. Při vzkříšení se ztratí všechny předměty, které nemáš nasazené.
items.ankh.desc_blessed=Tento starověký symbol nesmrtelnosti dává schopnost vrátit se k životu po smrti. Ankh byl požehnán a nyní je mnohem silnější. Ankh se obětuje, aby vás zachránil v okamžiku smrtelného nebezpečí.
items.ankh.discover_hint=Tuto položku si můžete koupit v obchodě.
items.ankh.name=ankh
items.arcaneresin.ac_apply=PŘIHLÁSIT SE
items.arcaneresin.apply=Potřeš svou hůlku pryskyřicí, čímž zvýšíš její sílu!
items.arcaneresin.desc=Tento jemný prášek se třpytí mezi odstíny fialové a bílé. Může působit jako zesilovač magických energií a zvyšovat úroveň hůlek, když se na ně aplikuje!\n\nVylepšení hůlky stojí 1, 2 nebo 3 pryskyřice v závislosti na počáteční úrovni hůlky. Pryskyřice může vylepšit hůlky maximálně na +3.\n\nVylepšení z pryskyřice jsou však _přepsána jinými zdroji vylepšení_ (například svitky vylepšení) a neplatí při vkládání hůlky do hole Mága.
items.arcaneresin.discover_hint=Tuto položku si můžete vyrobit pomocí alchymie.
items.arcaneresin.level_too_high=Ta hůlka je příliš silná na to, aby se pryskyřicí vylepšila.
items.arcaneresin.name=tajemná pryskyřice
items.arcaneresin.not_enough=Na to nemáš dost pryskyřice!
items.arcaneresin.prompt=Vyberte hůlku
items.armor.armor$glyph.discover_hint=Předmět s tímto efektem můžete v podzemí náhodně najít, nebo se ho pokusit na předmět aplikovat sami.
items.armor.armor$glyph.glyph=glyf
items.armor.armor$glyph.killed=%s tě zabil...
items.armor.armor$glyph.rankings_desc=Zabit glyfem
items.armor.armor.ac_detach=ODPOJIT
items.armor.armor.avg_absorb=Toto brnění _tier-%1$d_ obvykle blokuje poškození _%2$d-%3$d_ a pro správné použití vyžaduje sílu _%4$d_.
items.armor.armor.curr_absorb=Toto brnění _tier-%1$d_ blokuje poškození _%2$d-%3$d_ a pro správné použití vyžaduje sílu _%4$d_.
items.armor.armor.cursed=Cítíte zlověstnou magii, která se skrývá v tomto brnění.
items.armor.armor.cursed_worn=Protože toto brnění je prokleté, nejsi schopen ho odstranit.
items.armor.armor.defense=Je vylepšen pro zvýšení _obrany_.
items.armor.armor.detach_seal=Oddělíš pečeť od svého brnění.
items.armor.armor.equip_cursed=Brnění se kolem tebe bolestivě stahuje.
items.armor.armor.evasion=Je vylepšen pro zvýšení _úhybnosti_.
items.armor.armor.excess_str=Díky tvé nadměrné síle jsi v tomto brnění _vyhýbavější_.
items.armor.armor.glyph_hardened=Bylo to _zpevněné._
items.armor.armor.hardened_no_glyph=Tato zbroj byla _kalená_, ale momentálně na ní není žádný symbol.
items.armor.armor.hardening_gone=Zpevnění tohoto brnění se vytratilo!
items.armor.armor.identify=Nyní už jsi se svým brněním dostatečně obeznámen/a, abys ho dokázal/a identifikovat.
items.armor.armor.incompatible=Interakce různých druhů magie vymazala symbol na tomto brnění!
items.armor.armor.inscribed=je na něm vyryto _%s._
items.armor.armor.not_cursed=Toto brnění je prosté zlověstné magie.
items.armor.armor.probably_too_heavy=Pravděpodobně je pro tebe to brnění příliš těžké.
items.armor.armor.seal_attached=K tomuto brnění je připevněna zlomená pečeť válečníka. Když se blíží zranění pod polovinu jeho zdraví, získá _%d štít_.
items.armor.armor.seal_transfer=Aby válečník měl z rozbité pečetidlo, musí být připevněno k jeho aktuálně nošenému brnění. Chcete automaticky oddělit pečeť od brnění, které odstraňujete, a připevnit ji k brnění, které si vybavujete?
items.armor.armor.seal_transfer_no=žádný
items.armor.armor.seal_transfer_yes=Ano
items.armor.armor.too_heavy=Kvůli tvé nedostatečné síle nošení tohoto brnění sníží tvou schopnost pohybu, uhýbání a obrany.
items.armor.armor.weak_cursed=Navzdory kletbě si můžete toto brnění sundat.
items.armor.classarmor.ac_ability=VYBERTE SI SCHOPNOSTI
items.armor.classarmor.ac_transfer=PŘEVOD
items.armor.classarmor.charge_use=Použití schopnosti právě teď spotřebuje náboj _%s_.
items.armor.classarmor.discover_hint=Tuto položku najdete po porážce bosse na 20. patře s konkrétním hrdinou.
items.armor.classarmor.low_charge=Brnění nemá dostatek náboje k použití své speciální síly!
items.armor.classarmor.no_ability=Tvoje zbroj momentálně nemá žádnou schopnost, měl by sis nějakou vybrat!
items.armor.classarmor.not_equipped=Abyste mohli používat tuto speciální sílu, musíte mít na sobě toto brnění!
items.armor.classarmor.transfer_cancel=zrušit
items.armor.classarmor.transfer_complete=Vlastnosti tvého hrdinského brnění byly převedeny!
items.armor.classarmor.transfer_desc=Magii koruny trpasličího krále lze přenést na jinou sadu brnění. Upozorňujeme, že původní brnění bude při tom zničeno.
items.armor.classarmor.transfer_prompt=Vyberte si brnění
items.armor.classarmor.transfer_title=Přenosové brnění
items.armor.clericarmor.desc=Když má na sobě tuto směs látky a plátů, může kněz vykonávat speciální schopnost.
items.armor.clericarmor.name=hrdinské roucho
items.armor.clotharmor.desc=Toto lehké brnění nabízí základní ochranu.
items.armor.clotharmor.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.armor.clotharmor.name=látkové brnění
items.armor.curses.antientropy.desc=Kletba proti entropii působí proti silám vesmíru a přitahuje energii do nositele a odvádí ji od jeho okolí. Kletba ho krátce zapálí, ale zmrazí vše kolem něj!
items.armor.curses.antientropy.name=%s antientropie
items.armor.curses.bulk.desc=Mohutné brnění vypadá větší a impozantnější, ale ve skutečnosti nenabízí vylepšenou obranu. Ještě horší je, že větší rozměry značně ztěžují pohyb do dveří.
items.armor.curses.bulk.name=%s hromadného
items.armor.curses.corrosion.desc=Korozní pancíř je schopen prasknout korozivní tekutinou a pokrýt vše v oblasti lepkavým kyselým slizem.
items.armor.curses.corrosion.name=%s koroze
items.armor.curses.displacement.desc=Kletba posunutí se snaží přesunout nositele do bezpečí, když je napaden. Je však trochu moc efektivní, protože uživatele náhodně teleportuje po úrovni.
items.armor.curses.displacement.name=%s posunutí
items.armor.curses.metabolism.desc=Kletba metabolismu přímo přeměňuje pocit sytosti na zdraví, když je nositel zraněn, což sice urychluje hojení, ale rychle způsobuje hladovění.
items.armor.curses.metabolism.name=%s metabolismu
items.armor.curses.multiplicity.desc=Zbroj prokletá multiplicitou obsahuje nebezpečnou duplikační magii. Někdy vytvoří zrcadlový obraz nositele, ale stejně pravděpodobně zkopíruje i útočníka!
items.armor.curses.multiplicity.name=%s multiplicity
items.armor.curses.overgrowth.desc=Brnění z přerostlých rostlin je pokryto různými kvetoucími rostlinami. I když tento efekt vypadá zajímavě, nedělá nic pro obranu a tyto rostliny se v boji náhodně aktivují!
items.armor.curses.overgrowth.name=%s nadměrného růstu
items.armor.curses.stench.desc=Brnění prokleté zápachem uvolní oblaka jedovatého plynu, který je nebezpečný pro vše, co se v oblaku uchytí.
items.armor.curses.stench.name=%s zápachu
items.armor.duelistarmor.desc=V tomto plátovém brnění a plášti může Duelista provádět speciální schopnost.
items.armor.duelistarmor.name=hrdinův náprsník
items.armor.glyphs.affection.desc=Tento mocný glyf manipuluje s myslí útočníků a dočasně je okouzluje.
items.armor.glyphs.affection.name=%s náklonnosti
items.armor.glyphs.antimagic.desc=Tento mocný symbol umožňuje brnění bránit svého nositele jak před magickými, tak i fyzickými útoky. Tato magická obrana není ovlivněna úrovní brnění.
items.armor.glyphs.antimagic.name=%s anti-magie
items.armor.glyphs.brimstone.desc=Tento symbol chrání nositele a jeho majetek před ohněm a zcela eliminuje jeho poškození a negativní účinky.
items.armor.glyphs.brimstone.name=%s síry
items.armor.glyphs.camouflage.desc=Tento glyf umožňuje nositeli splynout s vysokou trávou a poskytnout mu dočasnou neviditelnost.
items.armor.glyphs.camouflage.name=%s kamufláže
items.armor.glyphs.entanglement.desc=Tento glyf vytvoří kolem nositele hliněné brnění, které absorbuje poškození, ale toto brnění se zlomí, pokud se nositel pohne.
items.armor.glyphs.entanglement.name=%s zapletení
items.armor.glyphs.flow.desc=Tento glyf manipuluje s tokem vody kolem nositele, díky čemuž je při pohybu skrz něj mnohem rychlejší.
items.armor.glyphs.flow.name=%s průtoku
items.armor.glyphs.obfuscation.desc=Tento glyf zakrývá nositele, takže je obtížnější ho odhalit.
items.armor.glyphs.obfuscation.name=%s zmatku
items.armor.glyphs.potential.desc=Tento glyf při úderu nahromadí energii a při aktivaci nabije hůlku nositele.
items.armor.glyphs.potential.name=%s potenciálu
items.armor.glyphs.repulsion.desc=Tento glyf odráží sílu proti útočníkům a odmrští je zpět.
items.armor.glyphs.repulsion.name=%s odporu
items.armor.glyphs.stone.desc=Tento glyf obklopuje brnění těžkým magickým kamenem, který znemožňuje uhýbání, ale blokuje poškození úměrně k úhybnosti.
items.armor.glyphs.stone.name=%s z kamene
items.armor.glyphs.swiftness.desc=Tento glyf zvyšuje rychlost nositele, kdykoli není poblíž nepřítele.
items.armor.glyphs.swiftness.name=%s rychlosti
items.armor.glyphs.thorns.desc=Tento mocný glyf útočníkům ubližuje a způsobuje jim pomalé krvácení, když zaútočí na nositele.
items.armor.glyphs.thorns.name=%s z trnů
items.armor.glyphs.viscosity$defereddamage.desc=Poškození je způsobováno pomalu, nikoli okamžitě. \n\nZbývající odložené poškození: %d.
items.armor.glyphs.viscosity$defereddamage.name=odložené poškození
items.armor.glyphs.viscosity$defereddamage.ondeath=Odložené poškození tě zabilo...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Zabit odloženým poškozením
items.armor.glyphs.viscosity.deferred=odložené %d
items.armor.glyphs.viscosity.desc=Tento glyf dokáže ukládat poškození způsobené nositeli a udělovat mu ho pomalu, nikoli najednou.
items.armor.glyphs.viscosity.name=%s viskozity
items.armor.huntressarmor.desc=S tímto pláštěm může Lovkyně vykonávat speciální schopnost.
items.armor.huntressarmor.name=hrdinský plášť
items.armor.huntressarmor.no_enemies=Žádní nepřátelé v dohledu
items.armor.leatherarmor.desc=Brnění vyrobené z vyčiněné kůže nestvůry. Není tak lehké jako látkové brnění, ale poskytuje lepší ochranu.
items.armor.leatherarmor.name=kožené brnění
items.armor.magearmor.desc=V tomto nádherném róbě může Mág vykonávat speciální schopnost.
items.armor.magearmor.name=hrdinské roucho
items.armor.mailarmor.desc=Propletené kovové články vytvářejí pevný, ale flexibilní brnění.
items.armor.mailarmor.name=kroužkové brnění
items.armor.platearmor.desc=Obrovské kovové pláty jsou spojeny dohromady do obleku, který poskytuje bezkonkurenční ochranu každému dobrodruhovi dostatečně silnému, aby unesl jeho ohromující váhu.
items.armor.platearmor.name=plátové brnění
items.armor.roguearmor.desc=V tomto tmavém oděvu může Zloděj použít speciální schopnost.
items.armor.roguearmor.name=hrdinský oděv
items.armor.scalearmor.desc=Kovové šupiny přišité na kožené vestě vytvářejí pružné, ale ochranné brnění.
items.armor.scalearmor.name=šupinové brnění
items.armor.warriorarmor.desc=V tomto těžkém plátovaném brnění může válečník vykonávat speciální schopnost.
items.armor.warriorarmor.name=hrdinova plátová zbroj
items.artifacts.alchemiststoolkit.ac_brew=VAŘIT
items.artifacts.alchemiststoolkit.ac_energize=DOBIT ENERGII
items.artifacts.alchemiststoolkit.cursed=Tvoje prokletá sada nástrojů ti brání v používání alchymie!
items.artifacts.alchemiststoolkit.desc=Tato sada nástrojů obsahuje řadu činidel a bylin spolu s malou míchací lahvičkou, která umožňuje alchymii na cestách. Lahvička obsahuje něco, co vypadá jako alchymistické energetické krystaly v tekuté formě.
items.artifacts.alchemiststoolkit.desc_cursed=Prokletá sada nástrojů se připoutala k tvému boku a odmítá ti dovolit používat alchymii.
items.artifacts.alchemiststoolkit.desc_hint=Vybavená sada nástrojů pomalu generuje alchymistickou energii, jak získáváte zkušenosti. Vypadá to, že směs v lahvičce by se dala vylepšit přidáním energetických krystalů.
items.artifacts.alchemiststoolkit.desc_warming=Sada nástrojů se momentálně zahřívá a za chvíli bude připravena k použití.
items.artifacts.alchemiststoolkit.energize_1=6 energie: +1 úroveň
items.artifacts.alchemiststoolkit.energize_all=Energie %1$d: úrovně +%2$d
items.artifacts.alchemiststoolkit.energize_desc=Každých 6 energetických krystalů dodá sadě nástrojů dostatek energie k dosažení určité úrovně, což zvyšuje rychlost, s jakou sada nástrojů v průběhu času generuje energii, a rychlost jejího zahřívání. \n\nKolik energie chcete použít?
items.artifacts.alchemiststoolkit.name=alchymistická sada nástrojů
items.artifacts.alchemiststoolkit.need_energy=Na to potřebujete alespoň 6 energií.
items.artifacts.alchemiststoolkit.not_ready=Vaše sada nástrojů se ještě nezahřívala.
items.artifacts.artifact.cannot_wear_two=Nemůžete nosit dva stejné artefakty.
items.artifacts.artifact.curse_known=V artefaktu cítíte zlověstnou magii.
items.artifacts.artifact.equip_cursed=Artefakt se k tobě bolestně připoutá.
items.artifacts.artifact.need_to_equip=K tomu si musíte vybavit svůj artefakt.
items.artifacts.artifact.not_cursed=Tento artefakt je prostý zlé magie.
items.artifacts.capeofthorns$thorns.desc=Tvůj plášť vyzařuje energii a obklopuje tě polem vychylující síly!\n\nVeškeré poškození, které utrpíš, je sníženo, dokud je efekt trnů aktivní. Navíc, pokud je útočník vedle tebe, snížené množství je odraženo zpět na útočníka.\n\nZbývající závity trnů: %s.
items.artifacts.capeofthorns$thorns.inert=Tvůj plášť se opět stane nehybným.
items.artifacts.capeofthorns$thorns.levelup=Tvůj plášť sílí!
items.artifacts.capeofthorns$thorns.name=trny
items.artifacts.capeofthorns$thorns.radiating=Váš plášť začíná vyzařovat energii, cítíte se chráněni!
items.artifacts.capeofthorns.desc=Tyto zhroucené plechy z DM-300 se shlukly do pevného pláště. Zdá se, že uchovává hlubokou energii, možná má něco ze síly DM-300?
items.artifacts.capeofthorns.desc_active=Zdá se, že plášť uvolňuje nahromaděnou energii, vyzařuje ochrannou sílu.
items.artifacts.capeofthorns.desc_inactive=Plášť ti na ramenou působí uklidňujícím dojmem těžké váhy, zdá se, že z utrpěného zranění získává energii.
items.artifacts.capeofthorns.name=trnový mys
items.artifacts.chaliceofblood.ac_prick=BODNUTÍ
items.artifacts.chaliceofblood.desc=Tento lesklý stříbrný kalich je na okraji podivně zdoben ostrými drahokamy.
items.artifacts.chaliceofblood.desc_1=Když držíte kalich, cítíte zvláštní nutkání píchnout se o ostré drahokamy.
items.artifacts.chaliceofblood.desc_2=Část vaší krve se shromažďuje v kalichu, jemně cítíte, jak vás kalich zásobuje životní energií a zvyšuje vaši přirozenou regeneraci zdraví. Přesto se chcete o kalich říznout, i když víte, že to bude bolet.
items.artifacts.chaliceofblood.desc_3=Kalich je naplněn až po okraj vaší životní esencí. Cítíte, jak do vás kalich vlévá životní energii zpět.
items.artifacts.chaliceofblood.desc_cursed=Prokletý kalich se ti připoutal k ruce a brání ti v regeneraci zdraví.
items.artifacts.chaliceofblood.name=kalich krve
items.artifacts.chaliceofblood.no=Ne, změnil jsem názor.
items.artifacts.chaliceofblood.ondeath=Kalich vysaje z tvé životní esence suchou esenci...
items.artifacts.chaliceofblood.onprick=Píchneš se a tvá životní esence stéká do kalichu.
items.artifacts.chaliceofblood.prick_warn=Pokaždé, když použijete kalich, vysá vám to více životní energie, ale výměnou to dále zlepší vaši přirozenou regeneraci zdraví.\n\nAktuální píchnutí se způsobí _%1$d-%2$d poškození_, i když toto poškození lze snížit _fyzickým i magickým blokováním nebo snížením poškození._ Bez ohledu na účinky snížení poškození má píchnutí se v současné době _%3$s%% šanci_ zcela vysát vaši životní sílu.\n\nJste si jisti, že chcete kalichu nabídnout více životní energie?
items.artifacts.chaliceofblood.yes=Ano, vím, co dělám
items.artifacts.cloakofshadows$cloakstealth.desc=Tvůj plášť stínů ti dodává neviditelnost, dokud jsi jím zahalen. Zůstaneš zahalen, dokud nebude plášť zrušen nebo dokud se ti nevybije náboj.\n\nDokud jsi neviditelný, nepřátelé na tebe nemohou útočit ani tě sledovat. Fyzické útoky a magické efekty (jako svitky a hůlky) neviditelnost okamžitě zruší.\n\nTahy do použití nabití: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Tvůj plášť sílí!
items.artifacts.cloakofshadows$cloakstealth.name=zahalený
items.artifacts.cloakofshadows$cloakstealth.no_charge=Tvému plášti došla energie.
