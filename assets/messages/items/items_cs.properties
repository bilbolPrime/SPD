items.rings.ringofarcana.combined_stats=Vaše vybavené prsteny kombinují svou sílu a zvyšují tak celkovou sílu kouzel a symbolů o _%s%%_.
items.rings.ringofarcana.desc=Tento prsten zesiluje magická kouzla na zbraních a symboly na brnění, včetně kleteb! Nejprve zvyšuje šanci na aktivaci a poté zvyšuje sílu efektu, jakmile je šance na aktivaci 100 %. Prokletý prsten naopak oslabuje kouzla, symboly a kletby.
items.rings.ringofarcana.name=prsten arkány
items.rings.ringofarcana.stats=Při nošení tento prsten zvýší sílu kouzel a symbolů o _%s%%._
