items.weapon.melee.sai.stats_desc=Tohle je velmi rychlá zbraň.
items.weapon.melee.sai.typical_ability_desc=Duelista může provést _kombinovaný úder_ se sai. Tento útok zaručeně zasáhne a obvykle způsobí _+%d poškození_ za každý zásah, který Duelista provede běžným útokem zblízka nebo vrhací zbraní. Pokud Duelista 5 kol nezasáhne, toto kombo se resetuje.
items.weapon.melee.scimitar$sworddance.desc=Duelistka provádí rychlé údery založené na hybnosti v jakémsi tanci. V tomto postoji útočí o 60%% rychleji (dost na to, aby zaútočila přesně dvakrát za kolo šavlí) a má přesnost +50%%.\n\nZbývající tahy: %s.
items.weapon.melee.scimitar$sworddance.name=tanec s meči
items.weapon.melee.scimitar.ability_desc=Duelista může předvést _tanec s meči_ se scimitarem. Tento postoj se aktivuje velmi rychle a dává Duelistovi +60%% rychlost útoku a +50%% přesnost na _%d tahy._
items.weapon.melee.scimitar.ability_name=tanec s meči
items.weapon.melee.scimitar.desc=Silná zakřivená čepel. Její tvar umožňuje rychlejší, ale méně silné útoky.
items.weapon.melee.scimitar.name=turecká šavle
items.weapon.melee.scimitar.stats_desc=Tohle je poměrně rychlá zbraň.
items.weapon.melee.scimitar.typical_ability_desc=Duelista může předvést _tanec s meči_ se scimitarem. Tento postoj se aktivuje velmi rychle a dává Duelistovi +60%% rychlost útoku a +50%% přesnost, obvykle pro _%d tahy._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Trvání schopnosti
items.weapon.melee.shortsword.ability_desc=Duelista může _rozseknout_ nepřítele krátkým mečem. Tím se způsobí _%1$d-%2$d poškození_ a je zaručeno, že se nepřítel zasáhne. Pokud sekání zabije nepřítele, je to okamžitě a duelista může sekání použít znovu do 5 kol zdarma.
items.weapon.melee.shortsword.ability_name=rozštípnout
items.weapon.melee.shortsword.desc=Docela krátký meč, jen o pár centimetrů delší než dýka.
items.weapon.melee.shortsword.name=krátký meč
items.weapon.melee.shortsword.typical_ability_desc=Duelista může _rozseknout_ nepřítele krátkým mečem. To obvykle způsobí _%1$d-%2$d poškození_ a je zaručeno, že zasáhne. Pokud rozseknutí zabije nepřítele, je to okamžitě a Duelista může rozseknutí použít znovu do 5 kol zdarma.
items.weapon.melee.sickle.ability_desc=Duelista může _sklidit_ nepřítele srpem. Tento zničující útok zaručeně zasáhne a způsobí _%d poškození_. Toto poškození se aplikuje jako krvácení, pokud cíl není imunní.
items.weapon.melee.sickle.ability_name=sklizeň
items.weapon.melee.sickle.desc=Ruční zemědělský nástroj, který může sloužit i jako silná, ale nepraktická zbraň.
items.weapon.melee.sickle.name=srp
items.weapon.melee.sickle.stats_desc=Tohle je dost nepřesná zbraň.
items.weapon.melee.sickle.typical_ability_desc=Duelista může _sklízet_ nepřítele srpem. Tento zničující útok zaručeně zasáhne a obvykle způsobí _%d poškození_. Toto poškození se aplikuje jako krvácení, pokud cíl není imunní.
items.weapon.melee.spear.ability_desc=Duelista může použít špičku kopí k _probodnutí_ nepřítele, který je v dosahu, ale není v jeho blízkosti. To způsobí _%1$d-%2$d poškození_, odhodí nepřítele zpět a zaručeně ho zasáhne.
items.weapon.melee.spear.ability_name=špice
items.weapon.melee.spear.desc=Štíhlá dřevěná tyč s naostřeným železným koncem.
items.weapon.melee.spear.name=kopí
items.weapon.melee.spear.stats_desc=Toto je poměrně pomalá zbraň. \nTato zbraň má extra dosah.
items.weapon.melee.spear.typical_ability_desc=Duelista může použít špičku kopí k _probodnutí_ nepřítele, který je v dosahu, ale není v jeho blízkosti. To obvykle způsobí _%1$d-%2$d poškození_, odhodí nepřítele zpět a zaručeně ho zasáhne.
items.weapon.melee.sword$cleavetracker.desc=Duelistka je připravena navázat na své předchozí sekání. Další použití sekání nebude stát žádné nabití schopnosti zbraně. \n\nZbývající tahy: %s.
items.weapon.melee.sword$cleavetracker.name=rozštípnout
items.weapon.melee.sword.ability_desc=Duelista může _rozseknout_ nepřítele mečem. Toto způsobí _%1$d-%2$d poškození_ a je zaručeno, že zasáhne. Pokud rozseknutí zabije nepřítele, je to okamžitě a Duelista může rozseknutí použít znovu do 5 kol zdarma.
items.weapon.melee.sword.ability_name=rozštípnout
items.weapon.melee.sword.desc=Pěkně vyvážený meč. Ne příliš velký, ale stále znatelně delší než krátký meč.
items.weapon.melee.sword.name=meč
items.weapon.melee.sword.typical_ability_desc=Duelista může _rozseknout_ nepřítele mečem. To obvykle způsobí _%1$d-%2$d poškození_ a je zaručeno, že zasáhne. Pokud rozseknutí zabije nepřítele, je to okamžitě a Duelista může rozseknutí použít znovu do 5 kol zdarma.
items.weapon.melee.warhammer.ability_desc=Duelista může provést _těžký úder_ válečným kladivem. Tento koncentrovaný útok způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.warhammer.ability_name=těžká rána
items.weapon.melee.warhammer.desc=Jen málo tvorů dokáže odolat drtivému úderu této tyčící se masy olova a oceli, ale k jejímu efektivnímu použití je zapotřebí velké síly.
items.weapon.melee.warhammer.name=válečné kladivo
items.weapon.melee.warhammer.stats_desc=Tohle je poměrně přesná zbraň.
items.weapon.melee.warhammer.typical_ability_desc=Duelista může provést _těžký úder_ válečným kladivem. Tento koncentrovaný útok obvykle způsobí _%1$d-%2$d poškození_, pokud nepřítele překvapí, a omráčí ho na 5 kol, což snižuje přesnost a úhybnost o 50%%. Těžký úder vždy zasáhne, ale pokud nepřítele nepřekvapí, způsobí běžné poškození.
items.weapon.melee.warscythe.ability_desc=Duelista může _sklidit_ nepřítele válečnou kosou. Tento zničující útok zaručeně zasáhne a způsobí _%d poškození_. Toto poškození se aplikuje jako krvácení, pokud cíl není imunní.
items.weapon.melee.warscythe.ability_name=sklizeň
items.weapon.melee.warscythe.desc=Tento velký a nepraktický nástroj byl zesílen, aby lépe sekal nepřátele než plodiny.
items.weapon.melee.warscythe.name=válečná kosa
items.weapon.melee.warscythe.stats_desc=Tohle je dost nepřesná zbraň.
items.weapon.melee.warscythe.typical_ability_desc=Duelista může _sklidit_ nepřítele válečnou kosou. Tento zničující útok zaručeně zasáhne a obvykle způsobí _%d poškození_. Toto poškození se aplikuje jako krvácení, pokud cíl není imunní.
items.weapon.melee.whip.ability_desc=Duelistka může _šlehnout_ všechny nepřátele kolem sebe bičem. Tato schopnost způsobuje _%1$d-%2$d poškození_, útočí na všechny nepřátele v dosahu útoku a zaručeně zasáhne.
items.weapon.melee.whip.ability_name=bič
items.weapon.melee.whip.desc=I když ostnatá délka lana na konci této zbraně způsobuje jen malé poškození, její dosah se nedá srovnat.
items.weapon.melee.whip.name=bič
items.weapon.melee.whip.stats_desc=Tato zbraň má ohromný dosah.
items.weapon.melee.whip.typical_ability_desc=Duelistka může _šlehnout_ všechny nepřátele kolem sebe bičem. Tato schopnost obvykle způsobuje _%1$d-%2$d poškození_, útočí na všechny nepřátele v dosahu útoku a zaručeně zasáhne.
items.weapon.melee.wornshortsword.ability_desc=Duelista může _rozseknout_ nepřítele opotřebovaným krátkým mečem. Toto poškození způsobí _%1$d-%2$d_ a je zaručeno, že zasáhne. Pokud rozseknutí zabije nepřítele, je to okamžitě a Duelista může rozseknutí použít znovu do 5 kol zdarma.
items.weapon.melee.wornshortsword.ability_name=rozštípnout
items.weapon.melee.wornshortsword.desc=Docela krátký meč, opotřebovaný intenzivním používáním. Je slabší a o něco lehčí než krátký meč v lepším stavu.
items.weapon.melee.wornshortsword.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.melee.wornshortsword.name=opotřebovaný krátký meč
items.weapon.melee.wornshortsword.typical_ability_desc=Duelista může _rozseknout_ nepřítele opotřebovaným krátkým mečem. To obvykle způsobí _%1$d-%2$d poškození_ a je zaručeno, že zasáhne. Pokud rozseknutí zabije nepřítele, je to okamžitě a Duelista může rozseknutí použít znovu do 5 kol zdarma.
items.weapon.missiles.bolas.desc=Tyto neobvyklé zbraně na dálku nejsou příliš ničivé, ale skvěle zpomalují svůj cíl.
items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Tato zbraň způsobí svému cíli mrzák.
items.weapon.missiles.boomerang.desc=Hozena na nepřítele se tato plochá zakřivená dřevěná střela vrátí do rukou svého vrhače.
items.weapon.missiles.boomerang.durability=Díky své pevné konstrukci se tento bumerang při používání nezlomí.
items.weapon.missiles.boomerang.name=bumerang
items.weapon.missiles.darts.adrenalinedart.desc=Tyto šipky jsou zakončeny směsí na bázi rychlobodláka, která zvýší rychlost pohybu a útoku spojenců nebo krátkodobě sníží rychlost pohybu nepřátel. Samotná šipka je stále škodlivá pro nepřátele, ale neublíží spojencům.
items.weapon.missiles.darts.adrenalinedart.name=adrenalinová šipka
items.weapon.missiles.darts.blindingdart.desc=Tyto šipky jsou zakončeny směsí na bázi slepice, která na krátkou dobu oslepí cíl. Nedezorientují však, takže nepřítel bude stále vědět, kde vás naposledy viděl.
items.weapon.missiles.darts.blindingdart.name=oslepující šíp
items.weapon.missiles.darts.chillingdart.desc=Tyto šipky jsou opatřeny směsí na bázi ledových čepiček, která výrazně ochladí cíl.
items.weapon.missiles.darts.chillingdart.name=mrazivý oštěp
items.weapon.missiles.darts.cleansingdart.desc=Tyto šipky jsou zakončeny směsí na bázi mageroyalů, která dočasně učiní spojence imunními vůči všem negativním účinkům, nebo je zbaví pozitivních efektů. Nepřátelé mohou dokonce na chvíli zapomenout, že útočí nebo před vámi prchají. Samotná šipka je stále škodlivá pro nepřátele, ale neublíží spojencům.
items.weapon.missiles.darts.cleansingdart.name=čisticí šipka
items.weapon.missiles.darts.dart.ac_tip=TIP
items.weapon.missiles.darts.dart.desc=Tyto jednoduché dřevěné tyče s hroty jsou závažím, které letí přímo a bodnou kořist pohybem zápěstí. Lze je zakončit semínky, aby získaly bonusové účinky při hodu.
items.weapon.missiles.darts.dart.name=šipka
items.weapon.missiles.darts.dart.prompt=Vyberte semeno
items.weapon.missiles.darts.dart.tip_all=šipky %1$d se semínky %2$d
items.weapon.missiles.darts.dart.tip_cancel=zrušit
items.weapon.missiles.darts.dart.tip_desc=Semeno lze kombinovat s jednou nebo dvěma šipkami, aby se vytvořila špička. Každý typ semene vytváří svůj vlastní typ špičky s jedinečným jednorázovým efektem. \n\nŠpička šipky s těmito semínky vytvoří _%s._
items.weapon.missiles.darts.dart.tip_one=hrot 1 šipka s 1 semínkem
items.weapon.missiles.darts.dart.tip_title=Šipky
items.weapon.missiles.darts.dart.tip_two=hrot 2 šipky s 1 semínkem
items.weapon.missiles.darts.dart.unlimited_uses=Díky své jednoduché konstrukci šipky vydrží prakticky věčně.
items.weapon.missiles.darts.displacingdart.desc=Tyto šipky jsou zakončeny směsí na bázi bledého listu, která teleportuje svůj cíl na krátkou vzdálenost.
items.weapon.missiles.darts.displacingdart.name=posuvná šipka
items.weapon.missiles.darts.healingdart.desc=Tyto šipky jsou zakončeny směsí na bázi slunečnice, která cíli poskytuje dávku léčiva. Samotná šipka je stále škodlivá pro nepřátele, ale neublíží spojencům.
items.weapon.missiles.darts.healingdart.name=léčivá šipka
items.weapon.missiles.darts.holydart.desc=Tyto šipky jsou zakončeny směsí na bázi hvězdnice, která do cíle vlévá svatou energii. Spojenci a běžní nepřátelé budou požehnáni, ale nemrtví nebo démoničtí nepřátelé utrpí těžké poškození. Samotná šipka je stále škodlivá pro nepřátele, ale neublíží spojencům.
items.weapon.missiles.darts.holydart.name=svatý šíp
items.weapon.missiles.darts.incendiarydart.desc=Tyto šipky jsou opatřeny směsí na bázi ohnivého květu, která při nárazu vzplane jasnými plameny.
items.weapon.missiles.darts.incendiarydart.name=zápalná šipka
items.weapon.missiles.darts.paralyticdart.desc=Tyto šipky jsou naplněny směsí na bázi zemních kořenů, která na krátkou dobu paralyzuje cíl.
items.weapon.missiles.darts.paralyticdart.name=paralytická šipka
items.weapon.missiles.darts.poisondart.desc=Tyto šipky jsou naplněny směsí na bázi mechu smutného, která otráví svůj cíl.
items.weapon.missiles.darts.poisondart.name=jedovatý šíp
items.weapon.missiles.darts.rotdart.desc=Tyto zákeřné šipky jsou zakončeny kyselou směsí na bázi hniloby, která agresivně rozežírá vše, s čím se šipka dostane do kontaktu. Silní nepřátelé odolají většině účinku, ale koroze je dostatečně silná na to, aby snadno zabila většinu standardních nepřátel. Tyto šipky vydrží déle než jiné šipky s koncovkou, ale jejich odolnost nelze zvýšit.
items.weapon.missiles.darts.rotdart.discover_hint=Tuto položku můžete vytvořit pomocí semínka z konkrétního úkolu.
items.weapon.missiles.darts.rotdart.name=hniloba šípu
items.weapon.missiles.darts.shockingdart.desc=Tyto šipky jsou opatřeny směsí na bázi bouřkové révy, která cíli způsobí nepříjemný šok.
items.weapon.missiles.darts.shockingdart.name=šokující šipka
items.weapon.missiles.darts.tippeddart.about_to_break=Hrot tvé šipky brzy vyprší.
items.weapon.missiles.darts.tippeddart.ac_clean=ČISTÝ
items.weapon.missiles.darts.tippeddart.cancel=zrušit
items.weapon.missiles.darts.tippeddart.clean_all=vyčistit vše
items.weapon.missiles.darts.tippeddart.clean_desc=Tato akce odstraní vychýlení semínka z vašich šipek a vrátí je zpět do normální podoby.
items.weapon.missiles.darts.tippeddart.clean_one=čistý
items.weapon.missiles.darts.tippeddart.clean_title=Čisté šipky
items.weapon.missiles.darts.tippeddart.discover_hint=Tuto položku si můžete koupit v obchodě nebo si ji vytvořit pomocí semínka.
items.weapon.missiles.darts.tippeddart.has_broken=Hrot tvé šipky vypršel.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_Ale tyto jsou tak kvalitní, že vydrží fakticky věčně._
items.weapon.missiles.darts.tippeddart.uses_left=Této hromádce šipek zbývá použít _%d/%d_, než se jeden hrot opotřebuje.
items.weapon.missiles.fishingspear.desc=Drobné vrhací oštěpy, které fungují dobře jako improvizovaná zbraň, přestože jsou určeny k rybolovu.
items.weapon.missiles.fishingspear.name=rybářský oštěp
items.weapon.missiles.forcecube.desc=Tyto podivně tvarované magické kostky jsou dostatečně malé na to, aby se vešly do ruky, ale jsou neuvěřitelně těžké.
items.weapon.missiles.forcecube.name=silová kostka
items.weapon.missiles.forcecube.ondeath=Zabil ses sám svou vlastní Silovou kostkou...
items.weapon.missiles.forcecube.stats_desc=Tato zbraň rozprostírá sílu svého nárazu na malou plochu a zasahuje vše v okolí.
items.weapon.missiles.heavyboomerang.desc=Tento velký bumerang se obtížně efektivně používá, ale způsobí značné škody.
items.weapon.missiles.heavyboomerang.name=těžký bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Tato zbraň se po pěti kolech vrátí zpět na místo, odkud byla vržena.
items.weapon.missiles.javelin.desc=Tato větší vrhací oštěpy jsou závažím udržujícím hrot na špičce vpředu, když se vznášejí vzduchem.
items.weapon.missiles.javelin.name=oštěp
items.weapon.missiles.kunai.desc=Tyto malé nože jsou v rukou zkušeného uživatele velmi silné.
items.weapon.missiles.kunai.name=kunai
items.weapon.missiles.kunai.stats_desc=Tato zbraň je silnější proti nevědomým nepřátelům.
items.weapon.missiles.missileweapon$placeholder.name=vržená zbraň
items.weapon.missiles.missileweapon.about_to_break=Tvá hozená zbraň se brzy zlomí.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Pokud se poslední vrhací zbraň ve vaší vylepšené sadě vrhacích zbraní rozbije, sada bude trvale ztracena. Jste si jisti, že ji chcete hodit?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=žádný
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ano
items.weapon.missiles.missileweapon.curse_discover=Tato vržená zbraň je prokletá!
items.weapon.missiles.missileweapon.distance=Vrhací zbraně jsou přesnější na dálku, ale méně přesné zblízka.
items.weapon.missiles.missileweapon.durability=Vrhací zbraně se při používání opotřebují a zlomí.
items.weapon.missiles.missileweapon.dust=Hozená zbraň se při dotyku rozpadne na prach.
items.weapon.missiles.missileweapon.has_broken=Jedna z tvých vrhaných zbraní se rozbila.
items.weapon.missiles.missileweapon.probably_too_heavy=Pravděpodobně je pro tebe tato zbraň příliš těžká.
items.weapon.missiles.missileweapon.stats_known=Tato sada vrhacích zbraní _tier-%1$d_ způsobuje _%2$d-%3$d poškození_ a k použití vyžaduje _%4$d sílu_.
items.weapon.missiles.missileweapon.stats_unknown=Tato sada vrhacích zbraní _tier-%1$d_ obvykle způsobuje _%2$d-%3$d poškození_ a k použití vyžaduje _%4$d sílu_.
items.weapon.missiles.missileweapon.unknown_uses=Tato sada vrhacích zbraní má obvykle několik použití, než se jedna rozbije.
items.weapon.missiles.missileweapon.unlimited_uses=Tato sada je tak kvalitní, že vám skutečně vydrží věčně.
items.weapon.missiles.missileweapon.uses_left=Tato sada vrhacích zbraní má zbývajících _%d/%d_ použití, než se jedna rozbije.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Nedávno jsi okamžitě hodil šuriken a musíš počkat, než to uděláš znovu. Šurikeny lze stále vrhat, ale normální rychlostí zbraně. \n\nZbývající tahy: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Znovunabíjecí doba šurikenů
items.weapon.missiles.shuriken.desc=Hvězdicovité kousky kovu s ostřím ostrým jako břitva způsobí při zásahu značné zranění. Lze je házet velmi rychle.
items.weapon.missiles.shuriken.name=šuriken
items.weapon.missiles.shuriken.stats_desc=Šurikeny lze vrhnout okamžitě s 20kolovou cooldown.
items.weapon.missiles.throwingclub.desc=Poměrně jednoduchá, ale odolná vrhací zbraň, v podstatě velký kámen připevněný k tyči.
items.weapon.missiles.throwingclub.name=vrhací klub
items.weapon.missiles.throwingclub.stats_desc=Tato zbraň se nelepí na nepřátele a lze ji sebrat okamžitě.
items.weapon.missiles.throwinghammer.desc=Tato mohutná kladiva jsou navržena tak, aby se s nimi vrhalo na nepřítele. Jejich hladká celokovová konstrukce je činí poměrně odolnými.
items.weapon.missiles.throwinghammer.name=vrhací kladivo
items.weapon.missiles.throwinghammer.stats_desc=Tato zbraň se nelepí na nepřátele a lze ji sebrat okamžitě.
items.weapon.missiles.throwingknife.desc=Tyto lehké nože jsou vyvážené tak, aby se obloukem vrhaly vzduchem přímo do cíle.
items.weapon.missiles.throwingknife.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.missiles.throwingknife.name=vrhací nůž
items.weapon.missiles.throwingknife.stats_desc=Tato zbraň je silnější proti nevědomým nepřátelům.
items.weapon.missiles.throwingspear.desc=Tato lehká kopí mají tenké rámy, které jsou navrženy k házení, nikoli k bodání.
items.weapon.missiles.throwingspear.name=vrhací oštěp
items.weapon.missiles.throwingspike.desc=Tyto odolné špičaté kovové šípy jsou určeny k házení do vzdálených nepřátel.
items.weapon.missiles.throwingspike.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.missiles.throwingspike.name=vrhací hrot
items.weapon.missiles.throwingstone.desc=Tyto kameny jsou obroušeny, aby se daly házet s větší silou než běžný kámen.
items.weapon.missiles.throwingstone.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.missiles.throwingstone.name=házení kamene
items.weapon.missiles.tomahawk.desc=Tyto vrhací sekery mají zoubkované ostří, které se při zasažení nepřítele trhá.
items.weapon.missiles.tomahawk.name=tomahavk
items.weapon.missiles.tomahawk.stats_desc=Tato zbraň způsobí cíli _%1$d-%2$d krvácení_.
items.weapon.missiles.tomahawk.typical_stats_desc=Tato zbraň obvykle způsobuje cíli _%1$d-%2$d krvácení_.
items.weapon.missiles.trident.desc=Masivní vrhací oštěpy se třemi smrtícími hroty na konci. Jsou silné, ale poměrně těžké.
items.weapon.missiles.trident.name=trojzubec
items.weapon.spiritbow.ac_shoot=STŘÍLET
items.weapon.spiritbow.desc=Luk vyrobený ze starobylého magického dřeva. Tětiva a rytiny září bledě modrým světlem. Po natažení tětivy tento luk vykouzlí magický šíp, který lze vystřelit na nepřítele.
items.weapon.spiritbow.discover_hint=Jeden z hrdinů začíná s touto položkou.
items.weapon.spiritbow.name=duch luk
items.weapon.spiritbow.prompt=Vyberte cíl
items.weapon.spiritbow.stats=Luk nelze přímo vylepšovat, ale místo toho se bude s rostoucí úrovní postupně zesilovat. Na vaší aktuální úrovni způsobí šípy vystřelené z luku _%1$d-%2$d poškození_ a pro správné použití vyžadují _%3$d sílu_.
items.weapon.weapon$enchantment.discover_hint=Předmět s tímto efektem můžete v podzemí náhodně najít, nebo se ho pokusit na předmět aplikovat sami.
items.weapon.weapon$enchantment.enchant=okouzlení
items.weapon.weapon$enchantment.rankings_desc=Zabit kouzlem
items.weapon.weapon.cursed=V této zbrani cítíte zlověstnou magii.
items.weapon.weapon.cursed_worn=Protože je tato zbraň prokletá, nemáš sílu ji odstranit.
items.weapon.weapon.enchant_hardened=Bylo to _zpevněné._
items.weapon.weapon.enchanted=má _%s._
items.weapon.weapon.excess_str=Kvůli tvé nadměrné síle způsobíš touto zbraní _0-%d bonusové poškození_.
items.weapon.weapon.faster=Je vylepšen pro zvýšení _rychlosti_.
items.weapon.weapon.hardened_no_enchant=Tato zbraň byla _kalená_, ale momentálně není očarovaná.
items.weapon.weapon.hardening_gone=Kalení této zbraně se vytratilo!
items.weapon.weapon.identify=Nyní jste se svou zbraní dostatečně obeznámeni, abyste ji dokázali identifikovat.
items.weapon.weapon.incompatible=Interakce různých druhů magie zneplatnila kouzlo na této zbrani!
items.weapon.weapon.not_cursed=Tato zbraň je prostá zlomyslné magie.
items.weapon.weapon.stronger=Je vylepšeno pro zvýšení _poškození._
items.weapon.weapon.too_heavy=Kvůli vaší nedostatečné síle tato zbraň omezí vaši rychlost útoku, přesnost a schopnost překvapivého útoku.
items.weapon.weapon.weak_cursed=Navzdory kletbě můžete tuto zbraň odpojit.

items.keys.skeletonkey.desc=Tenhle klíč vypadá vážně: jeho hlava má tvar lebky. Pravděpodobně dokáže otevřít nějaké vážné dveře.
items.weapon.missiles.bombarrow.desc=Šíp s připevněnou bombou. Držte si odstup.
items.weapon.missiles.bombarrow.name=bombový šíp
items.weapon.missiles.missileweapon.damage_desc=Tato zbraň způsobuje _%1$d_ až _%2$d_ poškození na zásah.
items.bags.seedpouch.desc=Do tohoto malého sametového váčku se vejde libovolné množství semen. Velmi praktické.
items.bags.seedpouch.name=sáček se semeny
items.potions.potionofmight.desc=Tato mocná tekutina ti proudí svaly a trvale zvýší sílu o jeden bod a zdraví o pět bodů.
items.potions.potionofmight.name=Lektvar moci
items.rings.ringofdetection.desc=S tímto prstenem si všimneš skrytých pastí a tajných dveří, aniž bys musel ztrácet čas hledáním. Oslabené prsteny odhalení otupí tvé smysly a ztíží hledání tajemství i při důkladném pátrání.
items.rings.ringofdetection.name=prsten odhalení
items.rings.ringofhaggler.desc=Tento prsten ve skutečnosti žádnou magickou moc nemá. Obchodníkům ale ukazuje, že jeho nositel patří k Cechu zlodějů. Ti obvykle rádi nabídnou slevu výměnou za příslib dočasného klidu. Vylepšení prstenu nepřinese žádné další výhody.
items.rings.ringofhaggler.name=prsten smlouvání
items.rings.ringofherbalism.desc=Tento prsten zvyšuje šanci najít rosu a semena při sešlapávání trávy.
items.rings.ringofherbalism.name=Prsten bylinkářství
items.rings.ringofmending.desc=Tento prsten posiluje regenerační schopnosti těla, a tak urychluje obnovu ztraceného zdraví. Oslabené prsteny přirozené léčení zpomalí, nebo dokonce zastaví.
items.rings.ringofmending.name=prsten regenerace
items.rings.ringofpower.desc=Energetické pole vyzařující z tohoto prstenu posiluje tvé hůlky. Oslabené prsteny moci je naopak oslabí.
items.rings.ringofpower.name=Prsten moci
items.rings.ringofsatiety.desc=S tímto prstenem vydržíš déle bez jídla. Oslabené prsteny sytosti mají opačný účinek.
items.rings.ringofsatiety.name=Prsten sytosti
items.rings.ringofshadows.desc=Nepřátelé si vás s tímto prstenem méně pravděpodobně všimnou. Zhoršené prsteny stínů upozorní nepřátele, kteří by si vaší přítomnosti jinak možná nevšimli.
items.rings.ringofshadows.name=Prsten stínů
items.rings.ringofthorns.desc=Prsten sice nemá skutečné trny, ale nepřítel, který tě napadne, sám utrpí část způsobeného zranění. Vylepšení prstenu nepřinese žádné další výhody.
items.rings.ringofthorns.name=Trnový prsten
items.scrolls.scrollofchallenge.desc=Při hlasitém přečtení se z tohoto svitku ozve náročný řev, který probudí všechny příšery a upozorní je na polohu čtenáře.
items.scrolls.scrollofchallenge.name=svitek výzvy
items.scrolls.scrollofenchantment.desc=Tento svitek dokáže naplnit zbraň nebo brnění náhodným očarováním, které jí udělí speciální sílu.
items.scrolls.scrollofenchantment.name=svitek očarování
items.scrolls.scrollofpsionicblast.desc=Tento svitek obsahuje ničivou energii, kterou lze psionicky nasměrovat a způsobit masivní poškození všem tvorům v zorném poli. Doprovodný záblesk světla dočasně oslepí všechny v oblasti působení, včetně čtenáře svitku.
items.scrolls.scrollofpsionicblast.name=svitek psionického výbuchu
items.scrolls.scrollofwipeout.desc=Přečtěte si tento svitek a uvolněte hněv duchů jeskyně, kteří zabijí vše na aktuální úrovni. No, téměř všechno. Některá z mocnějších stvoření nemusí být ovlivněna.
items.scrolls.scrollofwipeout.name=svitek vyhlazení
items.wands.wandofblink.desc=Tato hůlka umožňuje teleportovat se zvoleným směrem. Tvorové a pevné překážky teleportaci zastaví.
items.wands.wandofblink.name=hůlka teleportace
items.wands.wandoffirebolt.desc=Tato hůlka vystřeluje dávky magického ohně. Zapálí hořlavý terén a zasaženého tvora zraní i podpálí.
items.wands.wandoffirebolt.name=Hůlka Ohnivého blesku
