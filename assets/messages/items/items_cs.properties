items.artifacts.driedrose.charged=Tvoje růže je plně nabitá!
items.artifacts.driedrose.cursed=Nemůžeš použít prokletou růži.
items.artifacts.driedrose.desc=Je to ta růže, o které se duch zmínil před svým zmizením? Zdá se, že v sobě skrývá nějakou duchovní sílu, možná se dá použít k nasměrování energie onoho ztraceného bojovníka.
items.artifacts.driedrose.desc_armor=Duchova zbroj: %s
items.artifacts.driedrose.desc_cursed=Prokletá růže je připoutána k tvé ruce, je strašidelně studená.
items.artifacts.driedrose.desc_hint=Zdá se, že jí chybí některé okvětní lístky. Možná, že jejich opětovné připevnění růži posílí.
items.artifacts.driedrose.desc_no_quest=Usušená zralejší růže, která se i přes svůj věk nějakým způsobem stále drží pohromadě.\n\nZZdá se, že má nějakou duchovní sílu, ale vy teď nemáte tušení, jak ji využít.
