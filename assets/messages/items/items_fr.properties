items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Cette arme est _estropiante_. Chaque tir qui touche a _20%_ de chances d'estropier un ennemi pendant _10 tours_. Les boss sont immunisés.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Estropié !

