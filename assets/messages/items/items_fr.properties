items.food.blandfruit.desc_cooked=Le fruit a gonflé après avoir trempé dans la marmite et a même absorbé les propriétés de la graine avec laquelle il a été cuit. Il aura l'effet de la potion à laquelle la graine correspondait.
items.food.blandfruit.desc_eat=Il a l'air prêt à être mangé !
