items.artifacts.driedrose.desc_hint=Il semble qu'il manque quelques pétales. Peut-être que le fait de les rattacher renforcera la rose.
items.artifacts.driedrose.desc_no_quest=Une rose séchée et vieillie qui, d'une manière ou d'une autre, se maintient malgré son âge.\n\nElle semble avoir un certain pouvoir spirituel, mais vous ne savez pas du tout comment l'utiliser pour l'instant.
