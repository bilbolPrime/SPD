items.dewvial.ac_drink=BOIRE
items.dewvial.auto_drink=La fiole de rosée s'est vidée pour soigner vos blessures.
items.dewvial.collected=Vous avez recueilli une goutte de rosée dans votre fiole.
items.dewvial.desc=Cette petite fiole permet de garder le surplus de rosée pour le boire plus tard. Si elle est pleine, la rosée sera bue automatiquement pour vous sauver de la mort.
items.dewvial.empty=Votre fiole de rosée est vide !
items.dewvial.full=Votre fiole de rosée est pleine !
items.dewvial.name=fiole de rosée
items.energycrystal.desc=Une collection de petits cristaux magiques, remplis d'énergie alchimique.\n\nCes cristaux sont l'ingrédient le plus courant des recettes d'alchimie et peuvent être produits dans un pot d'alchimie en récupérant des objets consommables.
items.energycrystal.name=cristal d'énergie
