items.weapon.missiles.throwingstone.name=pierre de jet
items.weapon.missiles.tomahawk.desc=Ces haches de jet ont un bord dentelé qui se déchire lorsqu'elles se collent à l'ennemi.
items.weapon.missiles.tomahawk.name=tomahawk
items.weapon.missiles.tomahawk.stats_desc=Cette arme inflige des _%1$d-%2$d saignements_ à sa cible.
