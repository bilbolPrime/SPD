items.rings.ring.unknown_desc=Cet anneau de métal est orné %s qui brille dans l'obscurité. Qui sait quel effet il aura une fois porté ?
items.rings.ringofaccuracy.combined_stats=Les anneaux dont vous êtes équipés combinent leur puissance, augmentant votre précision de _%s%%_ au total.
items.rings.ringofaccuracy.desc=Cette bague augmente vos chances de toucher l'ennemi.
items.rings.ringofaccuracy.name=anneau de précision
items.rings.ringofaccuracy.stats=Lorsqu'elle est portée, cette bague augmente votre précision de _%s%%._
items.rings.ringofaccuracy.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement votre précision de _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Accroissement de la précision
items.rings.ringofarcana.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant la puissance des enchantements et des glyphes de _%s%%_ au total.
items.rings.ringofarcana.desc=Cet anneau renforce les enchantements magiques sur les armes et les glyphes sur les armures, y compris les malédictions ! Il augmente d'abord les chances d'activation, puis la puissance de l'effet une fois que les chances d'activation sont de 100 %. Un anneau maudit affaiblit les enchantements, les glyphes et les malédictions.
items.rings.ringofarcana.name=anneau des arcanes
items.rings.ringofarcana.stats=Lorsqu'il est porté, cet anneau augmente la puissance des enchantements et des glyphes de _%s%%
items.rings.ringofarcana.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement la puissance des enchantements et des glyphes de _%s%%
items.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.rings.ringofelements.combined_stats=Les anneaux dont vous êtes équipés combinent leur puissance, offrant une résistance élémentaire _%s%%_ au total.
items.rings.ringofelements.desc=Cette bague protège contre divers éléments, comme le feu, l'électricité et les gaz. Elle réduit aussi la durée des effets néfastes.
items.rings.ringofelements.name=anneau des éléments
items.rings.ringofelements.stats=Lorsqu'il est porté, cet anneau offre une _%s%%_ résistance élémentaire.
