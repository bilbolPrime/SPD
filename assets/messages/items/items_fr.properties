items.weapon.melee.sai$combostriketracker.desc=Le duelliste est un combo de construction qui peut être utilisé pour augmenter les dégâts de la capacité de frappe combinée. Chaque attaque de mêlée ou d'arme de jet réussie compte, mais l'absence d'attaque réussie pendant 5 tours réinitialise ce combo.\n\nCoups récents : %1$d.\n\nTours jusqu'à ce que les touches soient perdues : %2$s.
items.weapon.melee.sai$combostriketracker.name=grève combinée
items.weapon.melee.sai.ability_desc=Le duelliste peut effectuer une _combinaison de coups_ avec le sai. Cette attaque est garantie de toucher et inflige _+%d dommages_ pour chaque fois que le duelliste a touché avec une attaque de mêlée normale ou une attaque d'arme de jet. Ne pas toucher pendant 5 tours réinitialise ce combo.
items.weapon.melee.sai.ability_name=grève combinée
items.weapon.melee.sai.desc=Deux fines lames destinées à être maniées d'une seule main chacune. Elles sont idéales pour abattre les ennemis en un tour de main.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Il s'agit d'une arme très rapide.
items.weapon.melee.sai.typical_ability_desc=Le duelliste peut effectuer une _combinaison de coups_ avec le sai. Cette attaque est garantie de toucher et inflige généralement _+%d dommages_ pour chaque fois que le duelliste a touché avec une attaque de mêlée normale ou une attaque d'arme de jet. Ne pas toucher pendant 5 tours réinitialise ce combo.
items.weapon.melee.scimitar$sworddance.desc=La duelliste effectue des frappes rapides basées sur l'élan dans une sorte de danse. Lorsque cette posture est active, elle attaque 60%% plus vite (assez pour attaquer exactement deux fois par tour avec un cimeterre) et a une précision de +50%%.\n\nTours restants : %s.
