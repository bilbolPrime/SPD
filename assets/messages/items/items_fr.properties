items.weapon.melee.shortsword.ability_desc=Le duelliste peut _fendre_ un ennemi avec une épée courte. Cela inflige _%1$d-%2$d dégâts_ et est garanti de toucher. Si la fente tue un ennemi, elle est instantanée et le duelliste peut utiliser la fente à nouveau dans les 5 tours gratuitement.
