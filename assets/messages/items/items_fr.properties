items.potions.potion.no=Non, j'ai changé d'avis
items.potions.potion.shatter=La fiole se brise et le liquide éclabousse sans dommage.
items.potions.potion.silver=potion d'argent
items.potions.potion.sure_drink=Êtes-vous sûr de vouloir la boire ? Dans la plupart des cas, vous devez lancer ces potions sur vos ennemis.
items.potions.potion.sure_throw=Êtes-vous sûr de vouloir le jeter ? Dans la plupart des cas, il est préférable de le boire.
items.potions.potion.turquoise=potion turquoise
items.potions.potion.unknown_desc=Cette fiole contient un liquide %s qui tourbillonne. Qui sait ce qui arrivera si on le boit ou si on lance la fiole ?
items.potions.potion.yes=Oui, je sais ce que je fais
items.potions.potionofexperience.desc=L'expérience de multitudes de batailles réduite à l'état liquide, cette bière à la pression élèvera instantanément votre niveau d'expérience.
items.potions.potionofexperience.name=potion d'expérience
items.potions.potionoffrost.desc=Au contact de l'air, ce produit s'évapore en un nuage glacial. Toute créature qui le touche est gelée sur place, incapable de bouger ou d'agir.
items.potions.potionoffrost.name=potion de givre
items.potions.potionofhaste.desc=La consommation de ce liquide étrangement sucré vous confère une énergie considérable pendant une courte période, ce qui vous permet de courir à grande vitesse.
items.potions.potionofhaste.energetic=Vous vous sentez énergique !
items.potions.potionofhaste.name=potion de hâte
items.potions.potionofhealing.desc=Un élixir qui vous rend instantanément toute votre santé et vous guérit du poison.
items.potions.potionofhealing.heal=Vos blessures commencent à se refermer.
items.potions.potionofhealing.name=potion de guérison
items.potions.potionofinvisibility.desc=Boire cette potion vous rend temporairement invisible aux ennemis. Attaquer, ou utiliser une baguette ou un parchemin sous leurs yeux, dissipe l'effet.
items.potions.potionofinvisibility.invisible=Vous voyez vos mains devenir invisibles !
items.potions.potionofinvisibility.name=potion d'invisibilité
items.potions.potionoflevitation.desc=Ce curieux liquide vous fait flotter dans les airs et franchir les pièges sans effort. Les flammes et les gaz remplissent aussi l'air : voler ne permet pas de les éviter.
items.potions.potionoflevitation.float=Vous flottez dans les airs !
items.potions.potionoflevitation.name=potion de lévitation
items.potions.potionofliquidflame.desc=Ce flacon contient un composé instable qui s'enflammera violemment s'il est exposé à l'air libre.
items.potions.potionofliquidflame.name=potion de flamme liquide
items.potions.potionofmindvision.desc=Après avoir bu cette potion, votre esprit s'accordera à la signature psychique des créatures lointaines, ce qui vous permettra de sentir les présences biologiques à travers les murs. Cette potion vous permettra également de voir à travers les murs et les portes à proximité.
items.potions.potionofmindvision.name=potion de vision de l'esprit
items.potions.potionofmindvision.see_mobs=Vous pouvez en quelque sorte sentir la présence de l'esprit d'autres créatures !
items.potions.potionofmindvision.see_none=Vous pouvez vous rendre compte que vous êtes seul à ce niveau en ce moment.
items.potions.potionofparalyticgas.desc=Lorsqu'il est exposé à l'air libre, le liquide contenu dans cette fiole se vaporise en une brume jaune engourdissante. Quiconque inhale le nuage sera paralysé instantanément et incapable de bouger pendant un certain temps après que le nuage se soit dissipé. Cet objet peut être lancé sur des ennemis éloignés pour les attraper sous l'effet du gaz.
items.potions.potionofparalyticgas.name=potion de gaz paralysant
items.potions.potionofpurity.desc=Ce réactif neutralise rapidement tous les gaz nocifs dans la zone touchée. Le boire vous immunise temporairement contre ces gaz.
items.potions.potionofpurity.freshness=Vous sentez une fraîcheur peu commune dans l'air.
items.potions.potionofpurity.name=Potion de purification
items.potions.potionofpurity.protected=Un film protecteur vous enveloppe !
items.potions.potionofstrength.desc=Ce liquide puissant se répand dans vos muscles et augmente votre force d'un point de façon permanente.
items.potions.potionofstrength.msg=Une force nouvelle envahit votre corps, vous avez maintenant une force %d !
items.potions.potionofstrength.name=potion de force
items.potions.potionoftoxicgas.desc=Si vous débouchez ou brisez ce verre pressurisé, son contenu explosera en un nuage mortel de gaz vert toxique. Vous pouvez choisir de lancer cette potion sur des ennemis éloignés plutôt que de la déboucher à la main.
items.potions.potionoftoxicgas.name=potion de gaz toxique
items.quest.ceremonialcandle.desc=Un ensemble de bougies, fondues et fusionnées par l'usage.\n\nSeules, elles ne valent rien, mais utilisées avec d'autres bougies dans un schéma, elles peuvent concentrer l'énergie pour un rituel d'invocation.
items.quest.ceremonialcandle.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
items.quest.ceremonialcandle.name=bougie de cérémonie
items.quest.corpsedust.chill=Un frisson vous parcourt l'échine.
items.quest.corpsedust.desc=La boule de poussière de cadavre ne diffère pas extérieurement d'une boule de poussière ordinaire. Mais on peut y sentir une énergie malveillante.\n\nIl serait bon de s'en débarrasser au plus vite.
items.quest.corpsedust.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
items.quest.corpsedust.name=poussière de cadavre
items.quest.darkgold.desc=Ce métal est appelé sombre non pas en raison de sa couleur (il ne diffère pas de l'or normal), mais parce qu'il fond sous la lumière du jour, ce qui le rend inutilisable en surface.
items.quest.darkgold.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
items.quest.darkgold.name=minerai d'or foncé
items.quest.darkgold.you_now_have=Vous avez maintenant %d minerai d'or foncé.
items.quest.dwarftoken.desc=De nombreux nains et certaines de leurs plus grandes créations portent ces petits morceaux de métal dont l'utilité est inconnue. Il peut s'agir de bijoux ou de pièces d'identité. Les nains sont des gens étranges.
items.quest.dwarftoken.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
items.quest.dwarftoken.name=jeton nain
items.quest.embers.desc=Des braises spéciales qui ne peuvent être récoltées que sur de jeunes élémentaires de feu. Elles dégagent de l'énergie thermique.
items.quest.embers.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
items.quest.embers.name=braises élémentaires
items.quest.escapecrystal.ac_use=UTILISER
items.quest.escapecrystal.desc=Un cristal magique fin qui semble contenir de la magie de téléportation. Vous pouvez utiliser le cristal à tout moment pour quitter la chambre forte des nains, mais vous ne pourrez rien emporter avec vous !
items.quest.escapecrystal.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
items.quest.escapecrystal.name=cristal de fuite
items.quest.gooblob.desc=Il s'agit d'une boule de glu qui s'est détachée de Goo au moment de sa mort. On dirait une grosse boule de gelée, mais on n'oserait pas la manger.\n\nElle ne fait rien toute seule, mais elle peut être utile lorsqu'elle est combinée à certaines potions ou à une bombe. Au minimum, elle devrait se convertir en une quantité décente d'énergie.
items.quest.gooblob.discover_hint=Vous pouvez obtenir cet objet auprès de certains ennemis.
items.quest.gooblob.name=bloc de matière gluante
items.quest.metalshard.desc=Un éclat de métal rouillé et maudit, qui s'est détaché du DM-300 lors de sa destruction. On y sent une magie malveillante inactive.\n\nIl ne sert à rien en soi, mais il peut être utile si on le combine à certains parchemins ou à une bombe. Au moins, il devrait se convertir en une quantité décente d'énergie.
items.quest.metalshard.discover_hint=Vous pouvez obtenir cet objet auprès de certains ennemis.
items.quest.metalshard.name=éclat de métal maudit
items.quest.pickaxe.ability_desc=Le duelliste peut _piercer_ un ennemi avec une pioche. Ce coup est garanti, il est vulnérable pendant 3 tours et inflige des dégâts _%1$d-%2$d_ aux ennemis à la peau rigide.
items.quest.pickaxe.ability_name=percer
items.quest.pickaxe.desc=Il s'agit d'un outil robuste et lourd pour briser les rochers. Vous n'avez pas besoin d'équiper la pioche pour miner avec, mais vous pouvez probablement l'équiper comme une arme en cas de besoin.
items.quest.pickaxe.discover_hint=Vous pouvez trouver cet objet au cours d'une quête spécifique.
items.quest.pickaxe.name=pioche
items.quest.pickaxe.upgrade_ability_stat_name=Capacité Dommages
items.quest.ratskull.desc=Un crâne de rat étonnamment grand. Il ferait un excellent trophée de chasse, à condition d'avoir un mur sur lequel l'accrocher.
items.quest.ratskull.name=crâne de rat géant
items.remains.bowfragment.desc=Ce fragment de bois brisé faisait autrefois partie de l'arc spirituel d'une chasseresse perdue. Vous pouvez encore sentir un peu d'énergie naturelle dans le fragment, vous pouvez l'utiliser pour faire pousser de l'herbe haute autour de vous. Cependant, cela détruira le fragment.
items.remains.bowfragment.name=fragment d'arc
items.remains.brokenhilt.desc=Cette poignée cassée semble provenir de l'arme d'un duelliste vaincu. Vous pouvez encore sentir un peu de puissance martiale dans la poignée, vous pouvez l'utiliser pour obtenir un petit bonus de dégâts sur vos deux prochains coups au corps à corps. Cependant, cela détruira la poignée.
items.remains.brokenhilt.name=poignée cassée
items.remains.brokenstaff.desc=Ce bâton de mage a été brisé en deux après la mort de son propriétaire. Vous pouvez encore sentir de l'énergie magique dans le bâton, vous pouvez l'utiliser pour augmenter la charge de vos baguettes. Cependant, cela détruira le bâton.
items.remains.brokenstaff.name=personnel en rupture
items.remains.cloakscrap.desc=Ce morceau de tissu translucide semble provenir de la cape d'ombre d'un ancien Rogue. On y sent encore un peu d'énergie mystique. Vous pouvez l'utiliser pour augmenter la charge de vos artefacts. Vous pouvez l'utiliser pour recharger vos artefacts, mais cela détruira le tissu.
items.remains.cloakscrap.name=un morceau de tissu
items.remains.remainsitem.ac_use=UTILISER
items.remains.remainsitem.discover_hint=Vous pouvez trouver cet objet dans les restes d'un héros spécifique d'une précédente course perdue.
items.remains.sealshard.desc=Ces petits éclats de cire rouge semblent provenir du sceau d'un guerrier déchu. Vous pouvez encore sentir un peu de volonté s'accrocher au sceau, vous pouvez l'utiliser pour vous donner un peu de bouclier. Cependant, cela détruira les éclats du sceau.
items.remains.sealshard.name=éclats de scellés
items.remains.tornpage.desc=Cette page semble avoir été arrachée au tome sacré d'un Clerc périmé. Elle contient encore un peu d'énergie divine, que vous pouvez utiliser pour regagner un peu de santé. Cependant, la page déchirée sera détruite.
items.remains.tornpage.name=page déchirée
items.rings.ring.agate=bague en agate
items.rings.ring.amethyst=bague en améthyste
items.rings.ring.curse_known=On peut sentir une magie malveillante à l'intérieur de cet anneau.
items.rings.ring.cursed_worn=Comme cet anneau est maudit, vous ne pouvez pas l'enlever.
items.rings.ring.diamond=bague en diamant
items.rings.ring.emerald=bague en émeraude
items.rings.ring.equip_cursed=L'anneau se resserre douloureusement autour de votre doigt !
