items.rings.ringofenergy.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant la vitesse de charge de _%s%%_ au total.
items.rings.ringofenergy.desc=Votre équipement magique se rechargera plus rapidement dans le champ arcanique qui émane de cet anneau. Un anneau maudit ralentira au contraire la recharge.
items.rings.ringofenergy.name=anneau d'énergie
items.rings.ringofenergy.stats=Lorsqu'il est porté, cet anneau augmente la vitesse de charge de la baguette, de l'artefact et de l'armure héroïque de _%s%%._
items.rings.ringofenergy.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement la vitesse de charge des baguettes, artefacts et armures héroïques de _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Charge Boost
items.rings.ringofevasion.combined_stats=Les anneaux dont vous êtes équipés combinent leur puissance, augmentant votre évasion de _%s%%_ au total.
items.rings.ringofevasion.desc=Cette bague augmente vos chances d'esquiver les attaques ennemies.
items.rings.ringofevasion.name=anneau d'esquive
items.rings.ringofevasion.stats=Lorsqu'il est porté, cet anneau augmente votre évasion de _%s%%
items.rings.ringofevasion.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement votre évasion de _%s%%
items.rings.ringofevasion.upgrade_stat_name_1=Augmentation de l'évasion
items.rings.ringofforce$brawlersstance.desc=Dans cette posture, les attaques régulières de la duelliste utiliseront un anneau de force équipé, même si elle a une arme équipée. Ces attaques bénéficient d'un bonus de dégâts et utilisent toujours l'augmentation et l'enchantement de l'arme.\n\nMaintenir cette position demande de la concentration et réduit la vitesse de recharge des capacités de l'arme de 50 %.\n\nCette posture peut être activée ou désactivée à l'aide d'un anneau de force, mais la réduction de la vitesse de recharge persistera pendant un certain temps si la posture est activée et désactivée rapidement.
items.rings.ringofforce$brawlersstance.name=position du bagarreur
items.rings.ringofforce.ability_desc=Le duelliste peut adopter une _stance de bagarreur_ avec cet anneau, ce qui fait que ses attaques régulières utilisent toujours cet anneau, même si une arme est équipée. Ces attaques infligent des _%1$d-%2$d dégâts_ et héritent également de l'enchantement et de l'augmentation de l'arme. Cette posture ralentit la vitesse de recharge des armes de 50%%.
items.rings.ringofforce.ability_name=position du bagarreur
items.rings.ringofforce.combined_stats=Vos anneaux équipés combinent leur puissance, infligeant un total de _%1$d-%2$d_ de dégâts sans arme, ou augmentant les dégâts de _%3$d_ avec une arme.
items.rings.ringofforce.desc=Cet anneau augmente la force des coups de mêlée du porteur. Ce surcroît de puissance est assez faible lorsque l'on manie une arme, mais une attaque à mains nues sera beaucoup plus puissante. Un anneau maudit affaiblira au contraire les coups du porteur.
items.rings.ringofforce.name=anneau de force
items.rings.ringofforce.stats=A mains nues, à votre force actuelle, cet anneau inflige _%1$d-%2$d._ Avec une arme équipée, cet anneau augmente les dégâts de _%3$d._
items.rings.ringofforce.typical_ability_desc=La duelliste peut adopter une _stance de bagarreur_ avec cet anneau, ce qui fait que ses attaques régulières utilisent toujours cet anneau, même si elle est équipée d'une arme. Ces attaques infligent généralement des _%1$d-%2$d dégâts_ et héritent également de l'enchantement et de l'augmentation de l'arme. Cette posture ralentit la vitesse de recharge des armes de 50%%.
items.rings.ringofforce.typical_stats=A mains nues, à votre force actuelle, cet anneau inflige généralement _%1$d-%2$d._ Avec une arme équipée, cet anneau augmente généralement les dégâts de _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Dégâts à l'arme blanche
items.rings.ringofforce.upgrade_stat_name_2=Augmentation des dégâts armés
items.rings.ringofforce.upgrade_stat_name_3=Capacité Dommages
items.rings.ringoffuror.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant la vitesse de vos attaques de _%s%%_ au total.
items.rings.ringoffuror.desc=Cet anneau confère au porteur une fureur intérieure qui lui permet d'attaquer plus rapidement. Un anneau maudit ralentira au contraire la vitesse d'attaque du porteur.
items.rings.ringoffuror.name=anneau de fureur
items.rings.ringoffuror.stats=Lorsqu'il est porté, cet anneau augmente la vitesse de vos attaques de _%s%%
items.rings.ringoffuror.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement la vitesse de vos attaques de _%s%%
items.rings.ringoffuror.upgrade_stat_name_1=Augmentation de la vitesse d'attaque
items.rings.ringofhaste.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre vitesse de déplacement de _%s%%_ au total.
items.rings.ringofhaste.desc=Cette bague accélère le passage du temps pour son porteur, lui permettant d'accomplir toutes ses actions un peu plus vite.
items.rings.ringofhaste.name=anneau de hâte
items.rings.ringofhaste.stats=Lorsqu'il est porté, cet anneau augmente votre vitesse de déplacement de _%s%%
items.rings.ringofhaste.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement votre vitesse de déplacement de _%s%%
items.rings.ringofhaste.upgrade_stat_name_1=Augmentation de la vitesse de déplacement
items.rings.ringofmight.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant votre force de _%1$d_ et vos HP maximum de _%2$s%%_ au total.
items.rings.ringofmight.desc=Cet anneau améliore les caractéristiques physiques de son porteur, lui conférant une plus grande force physique et une meilleure constitution. Un anneau maudit affaiblira son porteur.
items.rings.ringofmight.name=anneau de puissance
items.rings.ringofmight.stats=Lorsqu'il est porté, cet anneau augmente votre force de _%1$d_ et votre puissance maximale de _%2$s%%
items.rings.ringofmight.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement votre force de _%1$d_ et votre puissance maximale de _%2$s%%
items.rings.ringofmight.upgrade_stat_name_1=renforcement de la force
items.rings.ringofmight.upgrade_stat_name_2=Augmentation de la puissance maximale
items.rings.ringofsharpshooting.combined_stats=Vos anneaux équipés combinent leur puissance, augmentant le niveau de l'arme de jet efficace de _%1$d_ et leur durabilité de _%2$s%%_ au total.
items.rings.ringofsharpshooting.desc=Cet anneau améliore la précision et la visée du porteur, ce qui rend toutes les armes à projectiles plus dommageables et plus durables. Un anneau maudit aura l'effet inverse.
items.rings.ringofsharpshooting.name=anneau de tir à l'arc
items.rings.ringofsharpshooting.stats=Lorsqu'il est porté, cet anneau augmente les dégâts de vos armes de jet comme si leur niveau était augmenté de _%1$d_, et augmente leur durabilité de _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Lorsqu'il est porté, cet anneau augmente les dégâts de vos armes de jet comme si leur niveau était augmenté de _%1$d_ et augmente leur durabilité de _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Augmentation des dégâts par niveau
items.rings.ringofsharpshooting.upgrade_stat_name_2=Amélioration de la durabilité
items.rings.ringoftenacity.combined_stats=Vos anneaux équipés combinent leur puissance, réduisant les dégâts que vous subissez jusqu'à _%s%%_ au total.
items.rings.ringoftenacity.desc=Lorsqu'il est porté, cet anneau permet au porteur de résister à des coups normalement mortels. Plus l'utilisateur est blessé, plus il résiste aux dégâts. Un anneau maudit permettra au contraire aux ennemis d'exécuter plus facilement le porteur.
items.rings.ringoftenacity.name=anneau de ténacité
items.rings.ringoftenacity.stats=Lorsqu'il est porté, cet anneau réduit les dégâts que vous subissez de _%s%%._
items.rings.ringoftenacity.typical_stats=Lorsqu'il est porté, cet anneau réduit généralement les dégâts que vous subissez jusqu'à _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Résistance maximale aux dégâts
items.rings.ringofwealth.combined_stats=Vos anneaux équipés combinent leurs pouvoirs, augmentant votre chance de _%s%%_ au total.
items.rings.ringofwealth.desc=Cet anneau agit comme un aimant pour les trésors, augmentant la probabilité que les ennemis et les conteneurs transportent des objets de valeur. Un anneau maudit réduira au contraire vos chances de recevoir du butin.
items.rings.ringofwealth.name=anneau de richesse
items.rings.ringofwealth.stats=Lorsqu'il est porté, cet anneau augmente votre chance de _%s%%._
items.rings.ringofwealth.typical_stats=Lorsqu'il est porté, cet anneau augmente généralement votre chance de _%s%%
items.rings.ringofwealth.upgrade_stat_name_1=Coup de pouce de la chance
items.scrolls.exotic.exoticscroll.berkanan=parchemin exotique de BERKANAN
items.scrolls.exotic.exoticscroll.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.scrolls.exotic.exoticscroll.gyfu=parchemin exotique de GYFU
items.scrolls.exotic.exoticscroll.isaz=rouleau exotique d'ISAZ
items.scrolls.exotic.exoticscroll.kaunan=parchemin exotique de KAUNAN
items.scrolls.exotic.exoticscroll.laguz=parchemin exotique de LAGUZ
items.scrolls.exotic.exoticscroll.mannaz=parchemin exotique de MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=rouleau exotique de NAUDIZ
items.scrolls.exotic.exoticscroll.odal=parchemin exotique d'ODAL
items.scrolls.exotic.exoticscroll.raido=parchemin exotique de RAIDO
items.scrolls.exotic.exoticscroll.sowilo=parchemin exotique de SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=rouleau exotique de TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Une rune magique indéchiffrable et lumineuse est écrite sur ce parchemin noir. Elle semble étrangère à cette terre, qui sait ce qu'elle fera lorsqu'elle sera lue à haute voix ?
items.scrolls.exotic.exoticscroll.yngvi=parchemin exotique de YNGVI
items.scrolls.exotic.scrollofantimagic.desc=L'incantation de ce parchemin vous entoure d'une aura magique qui bloque temporairement tous les effets magiques, qu'ils soient utiles ou nuisibles. Cela inclut la plupart des effets des objets magiques tels que les baguettes, les parchemins, les anneaux, les artefacts, les enchantements et les malédictions. Les capacités des armures héroïques sont suffisamment puissantes pour fonctionner malgré tout.
items.scrolls.exotic.scrollofantimagic.name=parchemin anti-magie
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Une arène magique est apparue autour de vous, signalée par un brouillard rouge.\n\nLorsque vous vous trouvez dans le brouillard, votre faim n'augmente pas et vous subissez 33%% de dégâts en moins, toutes sources confondues. Si vous avez d'autres sources de réduction des dégâts (comme une armure), elles s'appliqueront après la réduction de 33%%.\n\nTours restants : %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=l'arène des défis
items.scrolls.exotic.scrollofchallenge.desc=Lorsqu'il est lu à haute voix, ce parchemin déclenche un grand rugissement qui attire les ennemis vers l'utilisateur tout en créant une petite arène autour de lui.\n\nTant que le lecteur reste dans cette arène, il subit 33 % de dégâts en moins, toutes sources confondues (cette réduction s'applique avant les autres formes de réduction des dégâts), et il ne perd pas sa satiété.\n\nLa taille de l'arène est proportionnelle à la taille de la zone dans laquelle se trouve le lecteur. Elle sera particulièrement petite dans certaines zones de boss.
items.scrolls.exotic.scrollofchallenge.name=parchemin de défi
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Votre parchemin de divination a identifié les objets suivants :
items.scrolls.exotic.scrollofdivination.desc=Ce parchemin identifie au hasard quatre types d'objets que tu ne connais pas encore. Les types identifiés peuvent être la couleur d'une potion, la rune d'un parchemin ou la gemme d'un anneau. Les objets identifiés ne sont pas nécessairement ceux que tu portes sur toi.
items.scrolls.exotic.scrollofdivination.name=parchemin de divination
items.scrolls.exotic.scrollofdivination.nothing_left=Il n'y a plus rien à identifier !
items.scrolls.exotic.scrollofdread.desc=Lorsqu'il est lu, ce parchemin émet un éclair de lumière rouge qui inspire une incroyable terreur à tous les ennemis qui se trouvent dans votre champ de vision. L'effet est tel qu'ils essaieront rapidement de s'enfuir du donjon pour ne plus jamais être vus !\n\nComme pour la terreur, cet effet peut disparaître avec le temps ou si l'ennemi est attaqué.\n\nLes ennemis les plus tenaces, tels que les boss, se verront infliger l'effet de terreur normal.
items.scrolls.exotic.scrollofdread.name=parchemin d'effroi
items.scrolls.exotic.scrollofenchantment.armor=Sélectionnez un glyphe à appliquer à votre armure.
items.scrolls.exotic.scrollofenchantment.cancel=annuler
items.scrolls.exotic.scrollofenchantment.cancel_warn=L'annulation consommera toujours votre parchemin d'enchantement, en êtes-vous sûr ?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Non, j'ai changé d'avis
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Oui, j'en suis sûr
items.scrolls.exotic.scrollofenchantment.desc=Ce parchemin imprègne une arme ou une armure d'une puissante énergie magique. Le lecteur peut même contrôler dans une certaine mesure la magie qui est imprégnée.
items.scrolls.exotic.scrollofenchantment.inv_title=Enchanter un objet
items.scrolls.exotic.scrollofenchantment.name=parchemin d'enchantement
items.scrolls.exotic.scrollofenchantment.weapon=Sélectionnez un enchantement à appliquer à votre arme.
items.scrolls.exotic.scrollofforesight.desc=Après avoir lu ce parchemin, les détails du terrain à proximité seront constamment transmis à l'esprit du lecteur avec une clarté cristalline. Cet effet dure un temps considérable et révèle toutes les portes ou pièges cachés, rendant les recherches inutiles.
items.scrolls.exotic.scrollofforesight.name=parchemin de prévoyance
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=L'annulation consommera quand même votre parchemin de métamorphose, vous êtes sûr ?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Choisissez un talent à métamorphoser.
items.scrolls.exotic.scrollofmetamorphosis.desc=Ce parchemin contient une puissante magie de transmutation, qui s'applique au lanceur de sorts et non à un objet. La magie de ce parchemin permet de choisir un talent et de le remplacer par l'un des cinq talents de même niveau de différentes classes de héros !\n\nCet effet ne peut s'appliquer qu'aux talents de classe, pas aux talents gagnés par les sous-classes ou les capacités d'armure. Les talents que vous ne pouvez pas utiliser ne seront pas proposés en option.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=métamorphoser le talent
items.scrolls.exotic.scrollofmetamorphosis.name=parchemin de métamorphose
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Choisissez un nouveau talent pour remplacer le talent métamorphosé.
items.scrolls.exotic.scrollofmysticalenergy.desc=La puissance magique brute contenue dans ce parchemin, une fois libérée, chargera les artefacts équipés par l'utilisateur au fil du temps.
items.scrolls.exotic.scrollofmysticalenergy.name=parchemin d'énergie mystique
items.scrolls.exotic.scrollofpassage.desc=Le sortilège de ce parchemin transporte instantanément le lecteur dans la région la plus proche, au premier étage au-dessus de lui. Très pratique pour se rendre rapidement dans un magasin.
items.scrolls.exotic.scrollofpassage.name=parchemin de passage
items.scrolls.exotic.scrollofprismaticimage.desc=L'incantation de ce parchemin crée un jumeau illusoire et coloré du lecteur. Cette image prismatique agit comme un clone plus faible du lecteur, avec une défense similaire mais une pv et des dégâts inférieurs.\n\nL'image prismatique se manifestera en présence d'ennemis et tentera de défendre le lecteur.\n\nSi une image prismatique existe déjà, l'utilisation de ce parchemin la guérira complètement.
items.scrolls.exotic.scrollofprismaticimage.name=rouleau de l'image prismatique
items.scrolls.exotic.scrollofpsionicblast.desc=Ce parchemin contient une incroyable énergie destructrice qui peut être canalisée pour détruire l'esprit de toutes les créatures visibles.\n\nIl y a cependant un retour d'énergie important, et le lecteur sera également endommagé, aveuglé et affaibli. Plus le parchemin touche de cibles, moins il subit de dommages.
items.scrolls.exotic.scrollofpsionicblast.name=parchemin d'explosion psionique
items.scrolls.exotic.scrollofpsionicblast.ondeath=Le souffle psionique déchire votre esprit...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Cette créature a été ensorcelée par la magie d'un parchemin de chant de sirène.\n\nUn personnage ensorcelé est en permanence votre allié et combattra tous les ennemis qu'il rencontrera.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=captivé
items.scrolls.exotic.scrollofsirenssong.cancel=Vous devez choisir une cible.
items.scrolls.exotic.scrollofsirenssong.desc=La lecture de ce parchemin émet une mélodie séduisante qui envoûte l'ennemi ciblé, le transformant définitivement en allié ! Les autres ennemis qui l'entendent sont temporairement charmés.\n\nLes ennemis particulièrement forts peuvent résister à l'effet d'envoûtement et seront charmés à leur place.
items.scrolls.exotic.scrollofsirenssong.name=parchemin du chant des sirènes
items.scrolls.exotic.scrollofsirenssong.no_target=Le parchemin s'active sans cible.
items.scrolls.exotic.scrollofsirenssong.prompt=Choisir une cible
items.scrolls.inventoryscroll.no=Non, j'ai changé d'avis
items.scrolls.inventoryscroll.warning=Voulez-vous vraiment annuler l'utilisation de ce parchemin ? Le parchemin n'a pas été identifié au préalable, il sera donc consommé de toute façon.
items.scrolls.inventoryscroll.yes=Oui, je suis positif
items.scrolls.scroll$placeholder.name=défilement
items.scrolls.scroll.ac_read=LIRE
items.scrolls.scroll.berkanan=parchemin de BERKANAN
items.scrolls.scroll.blinded=On ne peut pas lire un parchemin quand on est aveuglé.
items.scrolls.scroll.cursed=Votre livre de sorts maudit vous empêche d'invoquer la magie de ce parchemin ! Un parchemin de levée de malédiction pourrait être assez puissant pour fonctionner...
items.scrolls.scroll.gyfu=parchemin de GYFU
items.scrolls.scroll.isaz=rouleau d'ISAZ
items.scrolls.scroll.kaunan=rouleau de KAUNAN
items.scrolls.scroll.laguz=parchemin de LAGUZ
items.scrolls.scroll.mannaz=parchemin de MANNAZ
items.scrolls.scroll.naudiz=parchemin de NAUDIZ
items.scrolls.scroll.no_magic=Vous ne pouvez pas lire un parchemin lorsque vous êtes immunisé contre la magie.
items.scrolls.scroll.odal=parchemin de ODAL
items.scrolls.scroll.raido=parchemin de RAIDO
items.scrolls.scroll.sowilo=parchemin de SOWILO
items.scrolls.scroll.tiwaz=parchemin de TIWAZ
items.scrolls.scroll.unknown_desc=Ce parchemin est couvert d'une écriture indéchiffrable et porte la rune %s en guise de titre. Qui sait ce qui arrivera si on le lit à voix haute ?
items.scrolls.scroll.yngvi=parchemin de YNGVI
items.scrolls.scrollofidentify.desc=Révèle définitivement tous les secrets d'un seul objet.
items.scrolls.scrollofidentify.inv_title=Identifier un élément
items.scrolls.scrollofidentify.it_is=Votre article a été identifié : %s.
items.scrolls.scrollofidentify.name=parchemin d'identification
items.scrolls.scrolloflullaby.desc=Une mélodie apaisante plongera toutes les créatures dans votre champ de vision dans un profond sommeil, vous donnant ainsi l'opportunité de fuir ou de leur lancer une attaque surprise.
items.scrolls.scrolloflullaby.name=parchemin de berceuse
items.scrolls.scrolloflullaby.sooth=Le rouleau émet une mélodie apaisante. Vous vous sentez très endormi.
items.scrolls.scrollofmagicmapping.desc=À la lecture de ce parchemin, une image d'une clarté cristalline se gravera dans votre mémoire, vous indiquant la disposition précise du niveau et révélant tous les secrets cachés. L'emplacement des objets et des créatures reste inconnu.
items.scrolls.scrollofmagicmapping.layout=Vous connaissez maintenant la disposition des niveaux.
items.scrolls.scrollofmagicmapping.name=parchemin de cartographie magique
items.scrolls.scrollofmirrorimage.copies=Le rouleau forme des images miroir de vous.
items.scrolls.scrollofmirrorimage.desc=L'incantation inscrite sur ce parchemin créera des jumeaux illusoires du lecteur, qui poursuivront ses ennemis.
items.scrolls.scrollofmirrorimage.name=parchemin d'image miroir
items.scrolls.scrollofmirrorimage.no_copies=Le rouleau tente de créer des images miroir de vous, mais il n'a nulle part où aller.
items.scrolls.scrollofrage.desc=Lorsqu'il est lu à haute voix, ce parchemin déclenche un grand rugissement qui attire tous les ennemis vers le lecteur et rend furieux ceux qui se trouvent à proximité.
items.scrolls.scrollofrage.name=parchemin de rage
items.scrolls.scrollofrage.roar=Le parchemin émet un rugissement rageur qui se répercute dans tout le donjon !
items.scrolls.scrollofrecharging.desc=La puissance magique brute contenue dans ce parchemin, une fois libérée, rechargera toutes les baguettes du lecteur à pleine puissance.
items.scrolls.scrollofrecharging.name=parchemin de recharge
items.scrolls.scrollofrecharging.surge=Une vague d'énergie parcourt votre corps, revigorant vos baguettes !
items.scrolls.scrollofremovecurse.cleansed=Votre objet brille d'une lumière purificatrice et une énergie malveillante se disperse !
items.scrolls.scrollofremovecurse.desc=L'incantation inscrite sur ce parchemin dépouillera instantanément l'arme, l'armure, les bagues et les objets portés par le lecteur de tout enchantement maléfique susceptible de l'empêcher de les retirer.
items.scrolls.scrollofremovecurse.inv_title=Nettoyer un objet
items.scrolls.scrollofremovecurse.name=parchemin de désenvoûtement
items.scrolls.scrollofremovecurse.not_cleansed=Votre objet s'illumine d'une lumière purificatrice, mais rien ne se passe.
items.scrolls.scrollofremovecurse.spirit=Votre parchemin libère l'esprit tourmenté !
items.scrolls.scrollofretribution.blast=Une puissante énergie magique jaillit du parchemin !
items.scrolls.scrollofretribution.desc=Ce parchemin contient une énergie destructrice qui canalise la souffrance du lecteur vers l'extérieur en une explosion de puissance. Plus le lecteur est faible, plus il inflige de dégâts. Lorsque la santé du lecteur est très faible, ce parchemin peut tuer instantanément la plupart des ennemis.\n\nL'utilisation du parchemin a cependant des conséquences sur l'utilisateur, l'aveuglant et l'affaiblissant.
items.scrolls.scrollofretribution.name=parchemin du châtiment
items.scrolls.scrollofteleportation.cant_reach=Vous ne pouvez pas vous y téléporter.
items.scrolls.scrollofteleportation.desc=Le sortilège inscrit sur ce parchemin transporte instantanément le lecteur à un endroit aléatoire du donjon. Il peut servir à échapper à une situation périlleuse, mais le lecteur malchanceux risque de se retrouver dans un lieu encore plus dangereux.
items.scrolls.scrollofteleportation.name=parchemin de téléportation
items.scrolls.scrollofteleportation.no_tele=La magie de la téléportation échoue.
items.scrolls.scrollofteleportation.prompt=Choisir un lieu de téléportation
items.scrolls.scrollofteleportation.tele=En un clin d'œil, vous êtes téléporté à un autre endroit du niveau.
items.scrolls.scrollofterror.desc=Un éclair de lumière rouge terrifiera toutes les créatures dans votre champ de vision, qui prendront la fuite. Attaquer un ennemi en fuite dissipera l'effet.
items.scrolls.scrollofterror.many=Le parchemin émet un brillant éclair de lumière rouge et les monstres s'enfuient !
items.scrolls.scrollofterror.name=parchemin de terreur
items.scrolls.scrollofterror.none=Le parchemin émet un brillant éclair de lumière rouge.
items.scrolls.scrollofterror.one=Le parchemin émet un brillant éclair de lumière rouge et le %s s'enfuit !
items.scrolls.scrolloftransmutation.desc=Ce parchemin contient une puissante magie de transmutation. Lorsqu'il est utilisé sur un objet éligible, il le transforme en un autre objet du même type. La magie préserve même les améliorations, les enchantements et les glyphes. Les parchemins et les potions seront transformés en leur équivalent exotique, et vice-versa.
items.scrolls.scrolloftransmutation.inv_title=Transmuter un objet
items.scrolls.scrolloftransmutation.morph=Votre objet se transforme en quelque chose de différent !
items.scrolls.scrolloftransmutation.name=parchemin de transmutation
items.scrolls.scrolloftransmutation.nothing=Il ne se passe rien d'intéressant.
items.scrolls.scrollofupgrade.desc=Ce parchemin améliorera un objet, augmentant ainsi sa qualité. Une baguette magique gagnera en puissance et en nombre de charges ; une arme infligera plus de dégâts ou atteindra sa cible plus fréquemment ; une armure déviera davantage de coups ; l’effet d’une bague sur son porteur s’intensifiera. Les armes et armures nécessiteront également moins d’effort pour être utilisées, et toute malédiction les affectant sera levée.
items.scrolls.scrollofupgrade.inv_title=Améliorer un article
items.scrolls.scrollofupgrade.name=parchemin d'amélioration
items.scrolls.scrollofupgrade.remove_curse=Le parchemin d'amélioration purifie la malédiction qui pèse sur votre objet !
items.scrolls.scrollofupgrade.weaken_curse=Le parchemin d'amélioration affaiblit la malédiction sur votre objet.
items.spells.alchemize$wndalchemizeitem.energize=Transformer en énergie %d
items.spells.alchemize$wndalchemizeitem.energize_1=Transformer 1 en énergie %d
items.spells.alchemize$wndalchemizeitem.energize_all=Transformer le tout en énergie %d
items.spells.alchemize$wndalchemizeitem.sell=Transformer en %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Tourner 1 en %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Tout transformer en %dg
items.spells.alchemize.desc=Ce sort contient des pouvoirs de transmutation similaires à ceux que l'on trouve dans un pot d'alchimie. Chaque lancement permet à l'utilisateur de transformer un objet (ou une pile d'objets) en or ou en énergie alchimique. Transformer des potions ou des parchemins en énergie permet même de les identifier !\n\nQuelques utilisations d'Alchimisation sont vendues dans les boutiques, mais beaucoup d'autres peuvent être fabriquées par alchimie en combinant une graine, une pierre runique et un peu d'énergie alchimique.
items.spells.alchemize.name=alchimiser
items.spells.alchemize.prompt=Alchimiser un objet
items.spells.beaconofreturning.creatures=L'aura psychique des créatures voisines ne vous permet pas de vous téléporter pour le moment.
items.spells.beaconofreturning.desc=Ce sort complexe permet à l'utilisateur de retourner à un endroit donné, quelle que soit la distance. Le sort ne sera consommé qu'en revenant, il peut être lancé autant de fois que vous le souhaitez, mais il ne se souviendra que de l'endroit le plus récent sur lequel il a été lancé.
items.spells.beaconofreturning.desc_set=Cette balise a été placée quelque part à l'étage %d.
items.spells.beaconofreturning.name=le phare du retour
items.spells.beaconofreturning.preventing=La forte aura magique de ce lieu vous empêche d'utiliser le sort !
items.spells.beaconofreturning.set=La balise a été placée à votre emplacement actuel.
items.spells.beaconofreturning.wnd_body=Ce réglage annule l'emplacement sur lequel la balise était précédemment réglée.\n\nLe retour permet de revenir au dernier emplacement défini et consomme une utilisation du sort.
items.spells.beaconofreturning.wnd_return=RETOUR
items.spells.beaconofreturning.wnd_set=SET
items.spells.curseinfusion.desc=Ce sort insuffle à une pièce d'équipement la même puissante magie maligne que celle présente dans DM-300. L'objet sur lequel il est utilisé sera immédiatement maudit, et tout enchantement ou glyphe qu'il aurait pu avoir sera annulé.\n\nDans le cas d'une arme, d'une armure ou d'une baguette, l'objet sera amélioré en plus d'être maudit. Les améliorations apportées par l'infusion de malédiction ne s'empilent pas et sont perdues si l'objet n'est plus maudit.\n\nPlusieurs infusions de malédiction peuvent également être utilisées pour modifier la malédiction d'une arme ou d'une armure.
items.spells.curseinfusion.inv_title=Maudire un objet
items.spells.curseinfusion.name=infusion de malédiction
items.spells.magicalinfusion.desc=Ce sort possède la même puissance magique qu'un parchemin d'amélioration, mais sous une forme plus stable.\n\nEn plus d'améliorer un objet normalement, il n'efface jamais un enchantement, un glyphe ou une malédiction.
items.spells.magicalinfusion.infuse=Votre objet est imprégné d'énergie arcanique !
items.spells.magicalinfusion.inv_title=Infuser un objet
items.spells.magicalinfusion.name=infusion magique
items.spells.magicalporter.desc=Ce sort transporte magiquement tout objet sur lequel il est lancé. Contrairement à la balise du marchand, les objets sont transportés jusqu'à l'entrée de l'étage du boss suivant.
items.spells.magicalporter.inv_title=Portage d'un article
items.spells.magicalporter.name=le portage magique
items.spells.magicalporter.nowhere=Il n'y a aucun endroit où vous pouvez porter un objet.
items.spells.phaseshift.desc=Ce sort chaotique téléporte tout personnage visé à un endroit aléatoire de l'étage où il se trouve et l'étourdit pendant un certain temps. Les ennemis les plus puissants pourront résister à l'effet d'étourdissement. Ce sort peut être dirigé vers une cible ou vers l'utilisateur lui-même.
items.spells.phaseshift.name=décalage de phase
items.spells.phaseshift.no_target=Il n'y a rien à téléporter à cet endroit.
items.spells.reclaimtrap.desc=Ce sort contient des restes de l'énergie mécanique du DM-300. Lorsqu'il est lancé sur un piège actif, le pouvoir du piège s'attache à vous, ce qui vous permet d'utiliser le sort à nouveau pour expulser ce pouvoir et déclencher l'effet du piège à l'endroit de votre choix.\n\nCependant, certains pièges peuvent ne pas fonctionner dans tous les endroits, et un seul piège peut être stocké à la fois.
items.spells.reclaimtrap.desc_trap=Le sort est actuellement prêt à déclencher un _%s._
items.spells.reclaimtrap.name=piège de récupération
items.spells.reclaimtrap.no_trap=Il n'y a pas de piège.
items.spells.recycle.desc=Ce sort contient une forme réduite de magie de transmutation. Bien qu'il ne fonctionne pas sur l'équipement, ce sort transforme un parchemin, une potion, une graine, une pierre runique ou une fléchette en un objet aléatoire du même type.
items.spells.recycle.inv_title=Recycler un article
items.spells.recycle.name=recycler
items.spells.recycle.recycled=Votre article a été recyclé en : %s.
items.spells.spell.ac_cast=CAST
items.spells.spell.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.spells.spell.no_magic=Vous ne pouvez pas lancer de sorts lorsque vous êtes immunisé contre la magie.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Ce sort canalise l'énergie des braises élémentaires utilisées pour le fabriquer et vous permet d'invoquer un élémentaire amical pour se battre avec vous ! Un seul élémentaire peut être invoqué à la fois, mais le sort peut être relancé pour vous rendre l'élémentaire sans frais.
items.spells.summonelemental.desc_chaos=Le sort rayonne actuellement de l'énergie chaotique, il invoquera un _élémentaire chaotique_. Vous pouvez imprégner un autre objet, mais le sort perdra son imprégnation actuelle.
items.spells.summonelemental.desc_fire=Le sort est actuellement chaud au toucher, il invoquera un _élémentaire de feu_. Vous pouvez imprégner un autre objet, mais le sort perdra son imprégnation actuelle.
items.spells.summonelemental.desc_frost=Le sort est actuellement froid au toucher, il invoquera un _élémentaire de givre_. Vous pouvez imprégner un autre objet, mais le sort perdra son imprégnation actuelle.
items.spells.summonelemental.desc_newborn=Ce sort n'est actuellement pas imprégné et permet d'invoquer un _élémentaire nouveau-né_ sans attaque à distance. Vous pouvez imprégner une potion de flamme liquide, une potion de givre, un parchemin de recharge ou un parchemin de transmutation pour augmenter la puissance du sort et faire en sorte que les invocations futures soient des élémentaires à pleine puissance !
items.spells.summonelemental.desc_shock=Le sort rayonne actuellement de l'énergie statique, il invoquera un _élémentaire de choc_. Vous pouvez imprégner un autre objet, mais le sort perdra son imprégnation actuelle.
items.spells.summonelemental.imbue_prompt=Imposer un objet
items.spells.summonelemental.name=invoquer un élémentaire
items.spells.targetedspell.inv_title=Infuser un objet
items.spells.targetedspell.prompt=Choisir une cible
items.spells.telekineticgrab.cant_grab=Vous ne pouvez pas l'attraper.
items.spells.telekineticgrab.desc=Ce sort permet au lanceur d'attraper à distance tous les objets se trouvant à un endroit donné, ou toutes les armes de jet collées à un ennemi !\n\nIl ne peut pas être utilisé pour saisir des objets appartenant à quelqu'un d'autre, ni pour saisir des contenants comme des coffres.
items.spells.telekineticgrab.name=saisie télékinésique
items.spells.telekineticgrab.no_target=Il n'y a rien à saisir.
items.spells.unstablespell.desc=Ce petit cristal noir de forme carrée présente des symboles runiques changeants sur chacune de ses surfaces.\n\nLorsqu'il est activé, il déclenche l'effet d'un parchemin aléatoire. L'effet du parchemin sera toujours axé sur le combat s'il y a des ennemis dans votre champ de vision, et sera toujours axé sur le non-combat dans le cas contraire.
items.spells.unstablespell.name=sort instable
items.spells.wildenergy.desc=Ce sort contient une partie de l'énergie maudite qui alimentait le DM-300. Lorsqu'il est lancé, il recharge vos baguettes et vos artefacts usés, tout en déclenchant un effet de baguette maudite aléatoire. Vous pouvez cependant choisir la direction dans laquelle cette magie maudite sera dirigée.
items.spells.wildenergy.name=l'énergie sauvage
items.stones.inventorystone.ac_use=UTILISER
items.stones.runestone$placeholder.name=pierre runique
items.stones.runestone.discover_hint=Vous pouvez trouver cet objet au hasard dans le donjon, ou le fabriquer par alchimie.
items.stones.stoneofaggression$aggression.desc=La magie manipulatrice fait que tous les ennemis proches préfèrent attaquer ce personnage.\n\nTours restants : %s.
items.stones.stoneofaggression$aggression.name=ciblée
items.stones.stoneofaggression.desc=Lorsque cette pierre est lancée sur un allié ou un ennemi, tous les ennemis proches préfèrent attaquer ce personnage pendant une courte période.\n\nLes boss peuvent toutefois résister à l'effet, ce qui réduit considérablement la durée de l'attaque et diminue les dégâts des attaques de leurs sous-fifres.
items.stones.stoneofaggression.name=pierre d'agression
items.stones.stoneofaugmentation$wndaugment.cancel=Peu importe
items.stones.stoneofaugmentation$wndaugment.choice=Qu'aimeriez-vous améliorer ?
items.stones.stoneofaugmentation$wndaugment.damage=Dommages
items.stones.stoneofaugmentation$wndaugment.defense=Défense
items.stones.stoneofaugmentation$wndaugment.evasion=Evasion
items.stones.stoneofaugmentation$wndaugment.none=Supprimer l'augmentation
items.stones.stoneofaugmentation$wndaugment.speed=Vitesse
items.stones.stoneofaugmentation.desc=Cette pierre runique possède une magie puissante qui peut augmenter l'équipement pour améliorer une propriété au détriment d'une autre.\n\nSi vous l'utilisez sur une arme, vous pourrez améliorer sa vitesse ou ses dégâts. Les armes de jet gagneront ou perdront également en durabilité en fonction de leur vitesse.\n\nL'utilisation sur une armure permet d'améliorer la défense ou l'évasion.
items.stones.stoneofaugmentation.discover_hint=Vous pouvez acheter cet objet dans un magasin ou le fabriquer par alchimie.
items.stones.stoneofaugmentation.inv_title=Augmenter un article
items.stones.stoneofaugmentation.name=pierre d'augmentation
items.stones.stoneofblast.desc=Cette pierre runique explose instantanément à l'endroit où elle est lancée. Comme une bombe, l'explosion inflige des dégâts à tout ce qui se trouve à proximité.
items.stones.stoneofblast.name=pierre de taille
items.stones.stoneofblink.desc=Cette pierre runique téléporte l'utilisateur à l'endroit où elle est lancée.
items.stones.stoneofblink.name=la pierre de blink
items.stones.stoneofclairvoyance.desc=Cette pierre révèle instantanément toutes les tuiles dans une zone très large autour de l'endroit où elle est lancée. Son effet peut même traverser les murs.
items.stones.stoneofclairvoyance.name=pierre de clairvoyance
items.stones.stoneofdeepsleep.desc=Lorsque cette pierre est lancée sur un ennemi, elle le plonge dans un profond sommeil magique. Les ennemis endormis magiquement dormiront pour toujours jusqu'à ce qu'ils soient dérangés.
items.stones.stoneofdeepsleep.name=pierre du sommeil profond
items.stones.stoneofdetectmagic.desc=Cette pierre runique est capable de détecter la magie qui affecte un objet. En utilisant cette pierre sur un objet non identifié, vous saurez s'il est affecté par une malédiction malveillante et s'il est affecté par une magie positive telle qu'un enchantement ou une amélioration.
items.stones.stoneofdetectmagic.detected_bad=Vous détectez une magie malveillante affectant cet objet !
items.stones.stoneofdetectmagic.detected_both=Vous détectez une magie positive et malveillante qui affecte cet objet !
items.stones.stoneofdetectmagic.detected_good=Vous détectez une magie positive affectant cet objet !
items.stones.stoneofdetectmagic.detected_none=Vous ne détectez aucune magie affectant cet objet.
items.stones.stoneofdetectmagic.inv_title=Détecter un élément
items.stones.stoneofdetectmagic.name=pierre de détection de la magie
items.stones.stoneofdisarming.desc=Cette pierre runique contient de la magie qui peut désactiver les pièges malveillants cachés dans le donjon. Elle désamorce jusqu'à 9 pièges autour de la zone où elle est lancée.
items.stones.stoneofdisarming.name=pierre de désarmement
items.stones.stoneofenchantment.armor=Votre armure brille dans l'obscurité !
items.stones.stoneofenchantment.desc=Cette pierre runique possède une magie d'enchantement. Contrairement à un parchemin d'amélioration, il n'augmente pas la puissance directe d'un objet, mais imprègne l'arme ou l'armure d'un enchantement qui lui confère un nouveau pouvoir.
items.stones.stoneofenchantment.inv_title=Enchanter un objet
items.stones.stoneofenchantment.name=pierre d'enchantement
items.stones.stoneofenchantment.weapon=Votre arme brille dans l'obscurité !
items.stones.stoneoffear.desc=Lorsque cette pierre est lancée sur un personnage, celui-ci est submergé par la terreur et s'enfuit. L'attaque d'un personnage en fuite raccourcit l'effet.
items.stones.stoneoffear.name=pierre de la peur
items.stones.stoneofflock.desc=Cette pierre runique invoque des moutons magiques pendant une courte période autour de l'endroit où elle est lancée.
items.stones.stoneofflock.name=pierre de troupeau
items.stones.stoneofintuition$wndguess.break=Votre pierre d'intuition tombe en poussière...
items.stones.stoneofintuition$wndguess.correct=C'est exact. Le type d'article a été identifié !
items.stones.stoneofintuition$wndguess.incorrect=Vous n'avez pas deviné.
items.stones.stoneofintuition$wndguess.text=Devinez le type de l'objet non identifié. Si vous devinez correctement, le type sera identifié !
items.stones.stoneofintuition.break_info=Vous pouvez utiliser les pierres d'intuition deux fois avant qu'une ne se brise, _votre prochaine utilisation ne consommera pas de pierre_.
items.stones.stoneofintuition.break_warn=Vous avez déjà utilisé une pierre d'intuition, donc _votre prochaine utilisation consommera une pierre_.
items.stones.stoneofintuition.desc=Cette pierre runique contient une version plus faible de la magie que l'on trouve dans les parchemins d'identification. Plutôt que d'identifier directement un objet, elle fait appel à votre intuition, vous permettant d'essayer d'identifier le type d'une potion, d'un parchemin ou d'un anneau en devinant.
items.stones.stoneofintuition.inv_title=Sélectionner un élément
items.stones.stoneofintuition.name=pierre d'intuition
items.stones.stoneofshock.desc=Cette pierre runique libère une explosion d'énergie électrique qui étourdit brièvement toutes les cibles proches et accorde au lanceur une charge de baguette pour chaque cible touchée.
items.stones.stoneofshock.name=pierre de choc
items.stylus.ac_inscribe=INSCRIRE
items.stylus.cursed=La magie du stylet ne fonctionne pas sur les armures maudites.
items.stylus.desc=Ce stylet arcane est fait d'une pierre sombre et très dure. En l'utilisant, vous pouvez inscrire un glyphe magique sur votre armure, mais vous n'avez aucun pouvoir sur le choix du glyphe, le stylet en décidera pour vous.
items.stylus.identify=Vous devez d'abord déterminer si cette armure est maudite.
items.stylus.inscribed=Vous avez inscrit votre armure avec le stylet.
items.stylus.name=stylet arcane
items.stylus.prompt=Sélectionner une armure
items.tengusmask.ac_wear=PORTEZ
items.tengusmask.desc=Ce masque est tombé du visage de Tengu lorsqu'il est mort, on peut sentir une grande puissance magique émaner de lui. Le masque était-il la source de force de Tengu ?\n\nLorsque vous le portez, l'immense pouvoir du masque est transféré en vous, ce qui vous permet de _choisir une sous-classe pour votre héros_\n\nQuelle sous-classe allez-vous choisir ?
items.tengusmask.discover_hint=Vous pouvez obtenir cet objet auprès de certains ennemis.
items.tengusmask.name=Masque de Tengu
items.tengusmask.used=Le masque se désintègre à mesure que son pouvoir s'infiltre en vous !
items.torch.ac_light=LIGHT
items.torch.desc=Un élément essentiel de l'aventure, lorsqu'un donjon est plongé dans l'obscurité, une torche peut aider à trouver le chemin.
items.torch.name=torche
items.trinkets.chaoticcenser.desc=Après avoir passé un certain temps dans le pot d'alchimie, cet encensoir semble produire de la fumée tout seul ! Ces gaz s'accumulent et jaillissent de l'encensoir vers les ennemis à intervalles semi-aléatoires. Il semble capable de produire toutes sortes de gaz, mais vous serez averti juste avant que l'encensoir ne s'active.
items.trinkets.chaoticcenser.name=encensoir chaotique
items.trinkets.chaoticcenser.spew=Votre encensoir est sur le point de cracher : %s.
items.trinkets.chaoticcenser.stats_desc=À son niveau actuel, cette babiole fait apparaître un gaz nocif près d'un ennemi environ tous les _%d_ tours. Les gaz n'apparaissent qu'en présence d'ennemis. Aux niveaux supérieurs, ces gaz sont plus susceptibles d'être exotiques et puissants.
items.trinkets.chaoticcenser.typical_stats_desc=En général, cette babiole fait apparaître un gaz nocif près d'un ennemi environ tous les _%d_ tours. Les gaz n'apparaissent qu'en présence d'ennemis. Aux niveaux supérieurs, ces gaz sont plus susceptibles d'être exotiques et puissants.
items.trinkets.crackedspyglass.desc=Ce télescope de poche serait la preuve d'un travail de qualité et de précision s'il n'y avait pas une fissure le long de sa lentille frontale. La longue-vue semble vous aider en vous révélant de nouveaux objets dans le donjon, mais à cause de son défaut, les objets révélés sont difficiles à voir !
items.trinkets.crackedspyglass.name=lorgnette fissurée
items.trinkets.crackedspyglass.stats_desc=Au niveau actuel, ce bibelot a une _%1$s%% chance_ de créer un objet caché supplémentaire à chaque étage sans boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=Au niveau actuel, cette babiole a _100%% chances_ de créer un objet caché supplémentaire à chaque étage sans boss, et _%1$s%% chances_ de créer un deuxième objet caché supplémentaire.
items.trinkets.crackedspyglass.typical_stats_desc=En général, ce bibelot a une _%1$s%% chance_ de créer un objet caché supplémentaire à chaque étage sans boss.
items.trinkets.dimensionalsundial.desc=Ce petit cadran solaire de poche est capable de projeter une ombre dans les profondeurs du donjon, même si vous ne le tenez pas à la verticale. Plus étrange encore, la position de l'ombre semble n'avoir aucun rapport avec le soleil dans ce monde. Lorsque l'ombre n'est pas projetée, le cadran solaire semble attirer le danger.
items.trinkets.dimensionalsundial.name=cadran solaire dimensionnel
items.trinkets.dimensionalsundial.stats_desc=À son niveau actuel, cette babiole réduit le taux de reproduction des ennemis de _%1$d%%_ pendant la journée dans la vie réelle (8h-20h), et augmente le taux de reproduction des ennemis de _%2$d%%_ pendant la nuit (20h-8h).
items.trinkets.dimensionalsundial.typical_stats_desc=En règle générale, cette babiole réduit le taux de reproduction des ennemis de _%1$d%%_ pendant la journée (de 8 h à 20 h) et augmente le taux de reproduction des ennemis de _%2$d%%_ pendant la nuit (de 20 h à 8 h).
items.trinkets.dimensionalsundial.warning=Votre cadran solaire ne projette pas d'ombre, vous vous sentez mal à l'aise.
items.trinkets.exoticcrystals.desc=Ces petits cristaux roses ont la même forme que les cristaux d'énergie alchimique. Bien qu'ils ne puissent pas être utilisés directement comme source d'énergie, ils semblent influencer d'une manière ou d'une autre les potions et les parchemins que vous trouvez.
items.trinkets.exoticcrystals.name=cristaux exotiques
items.trinkets.exoticcrystals.stats_desc=À son niveau actuel, cette babiole remplacera _%s%%_ des potions ou des parchemins par leurs équivalents exotiques. Cela n'affecte pas les potions de force, les parchemins d'amélioration ou les objets générés pour aider à résoudre les salles de danger.
items.trinkets.exoticcrystals.typical_stats_desc=En général, cette babiole remplace _%s%%_ des potions ou des parchemins par leurs équivalents exotiques. Cela n'affecte pas les potions de force, les parchemins d'amélioration ou les objets générés pour aider à résoudre les salles de danger.
items.trinkets.eyeofnewt.desc=Cet œil de triton noir et doré est un ingrédient courant, désormais transformé en bibelot. L'œil semble réduire votre vision en échange de vous permettre de voir les choses d'une autre manière.
items.trinkets.eyeofnewt.name=œil de triton
items.trinkets.eyeofnewt.stats_desc=Au niveau actuel, cette babiole réduit votre portée de vision de _%1$s%%_, mais vous permet également d'avoir une vision mentale des ennemis situés dans un rayon de _%2$d_ carreaux.
items.trinkets.eyeofnewt.typical_stats_desc=En général, cette babiole réduit votre portée de vision de _%1$s%%_, mais elle vous permet également d'avoir une vision mentale sur les ennemis situés dans un rayon de _%2$d_ carreaux.
items.trinkets.ferrettuft.desc=Une touffe de fourrure de furet blanche et soyeuse, maintenue par un ruban vert tilleul noué en forme de nœud. Les furets sont connus pour leur agilité, leur espièglerie et leur manque d'intégrité. Une partie de ce pouvoir semble rayonner de la babiole, améliorant l'évasion de tout ce qui se trouve à proximité.
items.trinkets.ferrettuft.name=touffe de furet
items.trinkets.ferrettuft.stats_desc=Au niveau actuel, cette babiole augmente l'évasion de tous les personnages de _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Généralement, cette babiole augmente l'évasion de tous les personnages de _%1$s%%_.
items.trinkets.mimictooth.desc=Cette grande dent pointue a dû être arrachée à un mimique très malheureux. Elle semble influencer les mimiques du donjon, les rendant plus fréquentes et plus dangereuses.
items.trinkets.mimictooth.name=dent mimétique
items.trinkets.mimictooth.stats_desc=À son niveau actuel, cette babiole rendra tous les types de mimiques _%1$sx_ plus courants et beaucoup plus difficiles à détecter, mais augmentera également la quantité de butin qu'ils laissent tomber. Chaque étage de donjon aura également une _%2$s%%_ chance de contenir une mimique ébène furtive supplémentaire.
items.trinkets.mimictooth.typical_stats_desc=En règle générale, cette babiole rendra tous les types de mimiques _%1$sx_ plus courants et plus difficiles à détecter, mais augmentera également la quantité de butin qu'ils laissent tomber. Chaque étage de donjon aura également une _%2$s%%_ chance de contenir une mimique d'ébène furtive supplémentaire.
items.trinkets.mossyclump.desc=Cette touffe de mousse humide semble conserver son humidité, quelle que soit la force avec laquelle vous la pressez. Elle semble liée magiquement au donjon lui-même, ce qui favorise l'apparition d'herbe et d'eau.
items.trinkets.mossyclump.name=touffe de mousse
items.trinkets.mossyclump.stats_desc=À son niveau actuel, cette babiole fera en sorte que _%d%%_ des sols non thématiques soient remplis d'eau ou d'herbe à la place.\n\nCette babiole coûte une plus grande quantité d'énergie pour être améliorée.
items.trinkets.mossyclump.typical_stats_desc=En général, cette babiole permet de remplir d'eau ou d'herbe les _%d%%_ des sols non thématisés.\n\nCette babiole coûte une plus grande quantité d'énergie pour être améliorée.
items.trinkets.parchmentscrap.desc=Ce petit bout de parchemin semble provenir d'un parchemin. Il a conservé une partie de sa magie et semble influencer les armes et armures trouvées dans le donjon.
items.trinkets.parchmentscrap.name=chutes de parchemin
items.trinkets.parchmentscrap.stats_desc=A son niveau actuel, cette babiole rend les enchantements et les glyphes _%dx_ courants, et les malédictions sur les armes et les armures _%sx_ courantes. Les malédictions sur les baguettes, les anneaux ou les artefacts ne sont pas affectées.\n\nCette babiole coûte une plus grande quantité d'énergie pour être améliorée.
items.trinkets.parchmentscrap.typical_stats_desc=En règle générale, cette babiole rend les enchantements et les glyphes _%dx_ courants, et les malédictions sur les armes et les armures _%sx_ courantes. Les malédictions sur les baguettes, les anneaux ou les artefacts ne sont pas affectées.\n\nCette babiole coûte une plus grande quantité d'énergie pour être améliorée.
items.trinkets.petrifiedseed.desc=Cette graine a été fossilisée, soit par un lent processus géologique, soit par magie. La graine semble influencer magiquement la flore du donjon, remplaçant parfois les graines de plantes par des pierres runiques.
items.trinkets.petrifiedseed.name=graine pétrifiée
items.trinkets.petrifiedseed.stats_desc=À son niveau actuel, cette babiole fait en sorte que l'herbe piétinée laisse tomber des pierres runiques au lieu de graines _%1$s%%_ dans la plupart des cas, et que l'herbe haute laisse tomber des objets _%2$s%%_ plus souvent.
items.trinkets.petrifiedseed.typical_stats_desc=En général, cette babiole fait en sorte que l'herbe piétinée laisse tomber des pierres runiques au lieu de graines _%1$s%%_ dans la plupart des cas, et que l'herbe haute laisse tomber des objets _%2$sZXQQPH3ZXQ_ plus souvent.
items.trinkets.ratskull.desc=Ce bibelot macabre n'est pas beaucoup plus grand que le crâne d'un rat normal, ce qui est une rareté dans ce donjon. L'influence magique du crâne semble attirer les créatures les plus rares du donjon et les faire apparaître plus souvent.
items.trinkets.ratskull.name=crâne de rat
items.trinkets.ratskull.stats_desc=À son niveau actuel, cette babiole rend les ennemis exotiques rares _%dx_ plus susceptibles d'apparaître. Cependant, le crâne n'est que deux fois moins efficace pour attirer les mimiques de cristal et les statues en armure.
items.trinkets.ratskull.typical_stats_desc=En général, cette babiole rend les ennemis exotiques rares _%dx_ plus susceptibles d'apparaître. Cependant, le crâne n'est que deux fois moins efficace pour attirer les mimiques de cristal et les statues en armure.
items.trinkets.saltcube.desc=Ce gros cristal de sel a été taillé en forme de cube presque parfait, et il a réussi à drainer la moitié de l'eau du pot d'alchimie au lieu de se dissoudre. Il semble déshydrater et conserver magiquement les aliments que vous mangez, prolongeant ainsi votre sensation de satiété, mais réduisant également votre rétablissement lorsque vous n'êtes pas affamé.
items.trinkets.saltcube.name=cube de sel
items.trinkets.saltcube.stats_desc=À son niveau actuel, cette babiole augmentera le temps avant que vous n'ayez faim de _%1$s%%_, mais réduira également votre taux de régénération de la santé de _%2$s%%_, à moins que l'étage ne soit verrouillé.
items.trinkets.saltcube.typical_stats_desc=En général, cette babiole augmente de _%1$s%%_ le temps avant que vous n'ayez faim, mais elle réduit également votre taux de régénération de la santé de _%2$s%%_, à moins que l'étage ne soit verrouillé.
items.trinkets.shardofoblivion$thrownusetracker.desc=Vous avez récemment utilisé une arme de jet non identifiée, qui compte comme une pièce d'équipement non identifiée utilisée pour le tesson de l'oubli pendant un petit moment.\n\nTours restants : %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Utilisation d'une arme jetée non identifiée
items.trinkets.shardofoblivion$wandusetracker.desc=Vous avez récemment utilisé une baguette non identifiée, qui compte comme une pièce d'équipement non identifiée utilisée pour le tesson de l'oubli pendant un petit moment.\n\nTours restants : %s.
items.trinkets.shardofoblivion$wandusetracker.name=Baguette non identifiée utilisée
items.trinkets.shardofoblivion.ac_identify=IDENTIFIER
items.trinkets.shardofoblivion.desc=Après avoir mijoté dans la marmite d'alchimie, ce petit éclat de métal maudit s'est transformé en... rien du tout ? La lumière semble se plier autour de lui, et il reste en suspension lorsque vous ne le tenez pas. Le tesson semble tirer magiquement de l'énergie de votre ignorance, il est donc préférable de ne pas trop y penser.
items.trinkets.shardofoblivion.identify=Vous identifiez l'objet !
items.trinkets.shardofoblivion.identify_not_yet=Cet élément n'est pas encore prêt à être identifié.
items.trinkets.shardofoblivion.identify_prompt=Identifier un élément
items.trinkets.shardofoblivion.identify_ready=Un élément est prêt à être identifié : %s. Utilisez votre éclat d'Oblivion pour l'identifier.
items.trinkets.shardofoblivion.identify_ready_worn=Vos objets usés sont maintenant prêts à être identifiés. Utilisez votre tesson d'Oblivion sur les objets pour les identifier.
items.trinkets.shardofoblivion.name=l'éclat de l'oubli
items.trinkets.shardofoblivion.stats_desc=À son niveau actuel, cette babiole augmente le taux d'abandon de butin par les ennemis de 20%% pour chaque pièce d'équipement non identifiée que vous avez équipée ou récemment utilisée, jusqu'à un maximum de _%d objet(s)_. L'éclat vous empêchera également d'identifier l'équipement, mais il peut être utilisé pour identifier manuellement les objets qui sont prêts à l'être.
items.trinkets.shardofoblivion.typical_stats_desc=En général, cette babiole augmente le taux d'abandon de butin par les ennemis de 20%% pour chaque pièce d'équipement non identifiée que vous avez équipée ou récemment utilisée, jusqu'à un maximum de _%d objet(s)_. L'éclat vous empêchera également d'identifier l'équipement, mais il peut être utilisé pour identifier manuellement les objets qui sont prêts à l'être.
items.trinkets.thirteenleafclover.desc=Le trèfle a poussé des feuilles supplémentaires en raison de sa cuisson dans le pot d'alchimie ! On ne sait pas vraiment si ce bibelot est chanceux ou malchanceux, peut-être qu'il rendra votre chance plus chaotique ?
items.trinkets.thirteenleafclover.name=trèfle à treize feuilles
items.trinkets.thirteenleafclover.stats_desc=Au niveau actuel, cette babiole vous permet d'infliger des dégâts maximums _%1$dZXQQPH1ZXQ_ dans un certain nombre de cas, et des dégâts minimums _%2$d%%_ dans un certain nombre de cas.
items.trinkets.thirteenleafclover.typical_stats_desc=En général, cette babiole vous permet d'infliger des dégâts maximums _%1$d%%_ dans un certain nombre de cas, et des dégâts minimums _%2$dZXQXQ3ZXQ_ dans un certain nombre de cas.
items.trinkets.trapmechanism.desc=Le mécanisme central d'un des pièges du donjon, soigneusement taillé dans le sol pour pouvoir être transporté. Il semble être lié magiquement au donjon lui-même, ce qui rend les terrains dangereux plus fréquents mais augmente également votre affinité envers eux.
items.trinkets.trapmechanism.name=mécanisme du piège
items.trinkets.trapmechanism.stats_desc=À son niveau actuel, cette babiole fera en sorte que _%1$d%%_ des étages sans thème seront remplis de pièges ou de gouffres à la place. De plus, _%2$d%%_ des pièges cachés du donjon seront visibles.
items.trinkets.trapmechanism.typical_stats_desc=En règle générale, cette babiole fait en sorte que _%1$d%%_ des étages sans thème sont remplis de pièges ou de gouffres. De plus, _%2$d%%_ des pièges cachés du donjon seront visibles.
items.trinkets.trinket$placeholder.name=bibelot
items.trinkets.trinket.discover_hint=Cet objet a une chance d'être une option chaque fois que vous fabriquez un bibelot par l'alchimie.
items.trinkets.trinketcatalyst$randomtrinket.desc=Un objet proche est coincé dans une pochette que vous ne pouvez pas ouvrir.\n\nLe processus d'alchimie dissoudra la poche, mais vous ne saurez pas quelle babiole vous obtiendrez tant que vous ne l'aurez pas fait !
items.trinkets.trinketcatalyst$randomtrinket.name=bibelot aléatoire
items.trinkets.trinketcatalyst.desc=Cette boule de poussière magique et dorée brille dans l'obscurité du donjon. Ce catalyseur peut être utilisé dans un pot d'alchimie avec un peu d'énergie alchimique pour produire un bibelot unique.\n\nLes bibelots produisent différents effets qui modifient légèrement le donjon ou ses habitants. Les bibelots peuvent être améliorés avec plus d'énergie pour rendre leur effet plus puissant, ou abandonnés pour renoncer complètement à l'effet.
items.trinkets.trinketcatalyst.name=catalyseur magique
items.trinkets.trinketcatalyst.window_text=L'eau commence à briller lorsque vous ajoutez le catalyseur. Il y a quelques objets à proximité que vous pourriez imprégner d'énergie pour les transformer en bibelots magiques.
items.trinkets.trinketcatalyst.window_title=créer un bibelot
items.trinkets.vialofblood.desc=Cette fiole fine contient le sang d'un habitant du donjon. Il se déplace lentement lorsque vous faites tourner la fiole. Il semble renforcer magiquement les effets de guérison, mais aussi les retarder.
items.trinkets.vialofblood.name=flacon de sang
items.trinkets.vialofblood.stats_desc=À son niveau actuel, cette babiole augmente de _%1$s%%_ les points de vie que vous gagnez en buvant des potions de soins, des gourdes ou des puits de santé. Cependant, ces effets de guérison se produiront plus lentement, régénérant un maximum de _%2$s_ HP par tour (ceci s'échelonne avec le niveau du héros).
items.trinkets.vialofblood.typical_stats_desc=En règle générale, cette babiole augmente de _%1$sQ%%_ les points de vie que vous gagnez en buvant des potions de soins, des gourdes ou des puits de santé. Cependant, ces effets de guérison se produiront plus lentement, régénérant un maximum de _%2$s_ HP par tour (ce qui s'échelonne avec le niveau du héros).
items.trinkets.wondrousresin.desc=Cette résine bleue scintillante semble contenir l'essence distillée de la magie d'une baguette maudite. La magie du pot d'alchimie a semblé la stabiliser quelque peu, et elle affecte maintenant vos baguettes.
items.trinkets.wondrousresin.name=résine merveilleuse
items.trinkets.wondrousresin.stats_desc=A son niveau actuel, cette babiole forcera les effets maudits de la baguette à devenir neutres ou positifs _%1$s%%_ du temps, et fera en sorte que les baguettes non maudites tirent un zap maudit neutre ou positif supplémentaire _%2$s%%_ du temps.\n\nCette babiole coûte une plus grande quantité d'énergie pour être améliorée.
items.trinkets.wondrousresin.typical_stats_desc=En général, cette babiole oblige les effets de la baguette maudite à devenir neutres ou positifs _%1$s%%_ dans la plupart des cas, et les baguettes non maudites à tirer un zap maudit neutre ou positif supplémentaire _%2$sZXQQPH3ZXQ_ dans la plupart des cas.\n\nCette babiole coûte une plus grande quantité d'énergie pour être améliorée.
items.wands.cursedwand.disguise=Votre apparence change sous vos yeux !
items.wands.cursedwand.fire=Vous sentez une odeur de brûlé...
items.wands.cursedwand.grass=L'herbe jaillit autour de vous !
items.wands.cursedwand.gravity=La gravité commence soudain à tirer dans des directions aléatoires !
items.wands.cursedwand.gravity_end=Le chaos gravitationnel prend fin.
items.wands.cursedwand.gravity_positive=La gravité se met soudain à tirer dans des directions aléatoires, mais cela ne semble pas vous affecter.
items.wands.cursedwand.mass_invuln=Une lumière brillante jaillit de votre baguette !
items.wands.cursedwand.nothing=Rien ne se passe.
items.wands.cursedwand.ondeath=Vous avez été tué par votre propre %s.
items.wands.cursedwand.petrify=Vous vous figez soudain sur place !
items.wands.cursedwand.sinkhole=Le sol commence à céder autour de vous !
items.wands.cursedwand.sinkhole_positive=Le sol commence à se dérober, mais il semble assez solide sous vos pieds.
items.wands.cursedwand.supernova=Une boule d'énergie flamboyante commence à grandir. Vous pourriez avoir envie de courir !
items.wands.cursedwand.supernova_positive=Une boule d'énergie flamboyante commence à grandir, mais elle se sent en sécurité.
items.wands.cursedwand.transmogrify_other=Votre objet se transforme en quelque chose de différent !
items.wands.cursedwand.transmogrify_wand=Votre baguette se transmogrifie en un autre objet !
items.wands.damagewand.upgrade_stat_name_1=Dégâts magiques
items.wands.wand$placeholder.name=baguette
items.wands.wand.ac_zap=ZAPPER
items.wands.wand.curse_discover=Ce %s est maudit !
items.wands.wand.cursed=Cette baguette est maudite, ce qui rend sa magie chaotique et aléatoire.
items.wands.wand.fizzles=Votre baguette s'éteint ; elle ne doit pas être suffisamment chargée.
items.wands.wand.identify=Vous connaissez maintenant suffisamment votre baguette pour l'identifier.
items.wands.wand.no_magic=Votre baguette s'éteint ; vous ne pouvez pas utiliser de baguette tant que vous êtes immunisé contre la magie.
items.wands.wand.not_cursed=Cette baguette est exempte de magie malveillante.
items.wands.wand.prompt=Choisir un lieu pour zapper
items.wands.wand.resin_many=Cette baguette a gagné _%d niveaux_ de résine arcanique.
items.wands.wand.resin_one=Cette baguette a gagné _1 niveau_ de résine arcanique.
items.wands.wand.self_target=Vous ne pouvez pas vous cibler vous-même !
items.wands.wandofblastwave.bmage_desc=Lorsque _le mage de bataille_ frappe un ennemi paralysé avec un bâton d'onde de souffle, il consomme la paralysie pour infliger une rafale de dégâts magiques bonus. Le temps de recharge est court pour chaque ennemi.
items.wands.wandofblastwave.desc=Cette baguette est faite d'une sorte de pierre marbrée, avec une bordure dorée et une pierre précieuse noire ronde à l'extrémité. Elle est très lourde dans la main.
items.wands.wandofblastwave.eleblast_desc=Un souffle élémentaire avec une portée de vague de souffle inflige 67% de dégâts et renverse tous les ennemis en dehors de la zone de souffle.
items.wands.wandofblastwave.knockback_ondeath=La collision vous a tué...
items.wands.wandofblastwave.name=baguette de l'onde de choc
items.wands.wandofblastwave.ondeath=Vous vous êtes tué avec votre propre baguette d'onde de choc...
items.wands.wandofblastwave.staff_name=personnel de l'onde de souffle
items.wands.wandofblastwave.stats_desc=Cette baguette projette un éclair qui explose violemment à l'endroit ciblé. La force de cette explosion inflige _%1$d-%2$d dégâts_ et est suffisamment puissante pour faire voler la plupart des ennemis.
items.wands.wandofblastwave.typical_stats_desc=Cette baguette projette un éclair qui explose violemment à l'endroit ciblé. La force de cette explosion inflige généralement _%1$d-%2$d_ de dégâts et est suffisamment puissante pour faire voler la plupart des ennemis.
items.wands.wandofblastwave.upgrade_stat_name_2=Coup de poing
items.wands.wandofcorrosion.bmage_desc=Lorsque le _Mage de Bataille_ frappe un ennemi avec un bâton de corrosion, l'ennemi a une chance de devenir suintant.
items.wands.wandofcorrosion.desc=Cette baguette a un corps cendré qui s'ouvre sur une gemme orange brillante.
items.wands.wandofcorrosion.eleblast_desc=Une explosion élémentaire avec un bâton de corrosion inflige aux ennemis 4 tours de corrosion, à partir de 6 points de dégâts.
items.wands.wandofcorrosion.name=baguette de corrosion
items.wands.wandofcorrosion.staff_name=personnel de corrosion
items.wands.wandofcorrosion.stats_desc=Cette baguette tire un éclair qui explose en un nuage de gaz hautement corrosif à l'endroit ciblé. Tout ce qui se trouve dans ce nuage subit des dégâts croissants au fil du temps, à partir de _%d_
items.wands.wandofcorrosion.upgrade_stat_name_1=Dommages dus à la corrosion
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume de gaz
items.wands.wandofcorruption.already_corrupted=Ce caractère ne peut plus être influencé.
items.wands.wandofcorruption.bmage_desc=Lorsque le _Mage de Bataille_ frappe un ennemi avec un bâton de corruption, l'ennemi a une chance d'être enfumé.
items.wands.wandofcorruption.desc=Cette baguette rayonne d'une énergie noire chaotique, comme le montre la petite tête de mort décorative qui orne son extrémité.
items.wands.wandofcorruption.eleblast_desc=Une explosion élémentaire avec un bâton de corruption inflige aux ennemis 5 tours d'amok.
items.wands.wandofcorruption.name=baguette magique de la corruption
items.wands.wandofcorruption.staff_name=personnel de la corruption
items.wands.wandofcorruption.stats_desc=Cette baguette libère une énergie corruptrice qui affaiblit les ennemis et finit par les plier à votre volonté. Les ennemis sont capables de résister à la corruption, mais les ennemis affaiblis sont plus faciles à corrompre que les ennemis en bonne santé.
items.wands.wandofcorruption.upgrade_stat_name_1=Corruption du pouvoir
items.wands.wandofcorruption.upgrade_stat_name_2=Durée de l'affaiblissement
items.wands.wandofdisintegration.bmage_desc=Lorsqu'il est manié par le _mage de bataille_, le bâton de désintégration a une portée d'attaque accrue, comme s'il était doté d'un enchantement de projection.
items.wands.wandofdisintegration.desc=Cette baguette est faite d'un solide morceau d'obsidienne lisse, avec une lumière d'un violet profond qui court le long de son flanc et se termine à son extrémité. Elle brille d'une énergie destructrice, attendant d'être projetée vers l'avant.
items.wands.wandofdisintegration.eleblast_desc=Une explosion élémentaire avec un bâton de désintégration inflige 100 % de dégâts et traverse les murs.
items.wands.wandofdisintegration.name=baguette de désintégration
items.wands.wandofdisintegration.staff_name=personnel de désintégration
items.wands.wandofdisintegration.stats_desc=Cette baguette projette un rayon qui transperce n'importe quel obstacle, et qui ira d'autant plus loin qu'il aura été amélioré. Le rayon inflige des dégâts _%1$d-%2$d,_ et inflige également des dégâts bonus pour chaque ennemi et mur qu'il traverse.
items.wands.wandofdisintegration.upgrade_stat_name_2=Portée maximale
items.wands.wandoffireblast.bmage_desc=Lorsque le _Mage de Bataille_ frappe un ennemi avec un bâton de feu, il a une chance de produire une explosion qui endommage les ennemis et consume tout le feu à proximité ! Cette probabilité augmente avec la quantité de feu adjacente à l'ennemi.
items.wands.wandoffireblast.desc=Cette baguette est fabriquée en bois laqué rouge avec des feuilles d'or utilisées généreusement pour lui donner une allure royale. Elle crépite et siffle à son extrémité, impatiente de libérer sa puissante magie.
items.wands.wandoffireblast.eleblast_desc=Un souffle élémentaire avec un bâton de feu inflige 100 % de dégâts, fait exploser les portes et met le feu aux ennemis et au terrain.
items.wands.wandoffireblast.name=baguette de feu
items.wands.wandoffireblast.staff_name=le personnel du coup de feu
items.wands.wandoffireblast.stats_desc=Cette baguette projette un cône de feu lorsqu'elle est utilisée. Sa prochaine attaque consommera _%1$d charges_ et infligera _%2$d-%3$d dégâts._ Plus la baguette utilise de charges, plus l'effet est grand et puissant.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Charge Dommages
items.wands.wandoffireblast.upgrade_stat_name_2=2 Dommages de charge
items.wands.wandoffireblast.upgrade_stat_name_3=3 Dommages de charge
items.wands.wandoffrost.bmage_desc=Lorsque le _Mage de Bataille_ frappe un ennemi glacé avec un bâton de givre, celui-ci a une chance de geler instantanément. Cette probabilité est d'autant plus grande que l'ennemi est refroidi.
items.wands.wandoffrost.desc=Cette baguette semble être faite d'une sorte de glace magique. Elle devient de plus en plus lumineuse vers son extrémité arrondie. Elle est très froide lorsqu'on la tient, mais la main reste chaude.
items.wands.wandoffrost.eleblast_desc=Un coup élémentaire avec un bâton de givre inflige 100 % de dégâts, gèle les ennemis et éteint les incendies.
items.wands.wandoffrost.name=baguette de givre
items.wands.wandoffrost.staff_name=personnel de gel
items.wands.wandoffrost.stats_desc=Cette baguette projette des décharges d'énergie glacée vers vos ennemis, infligeant des _%1$d-%2$d dégâts_ et refroidissant. L'effet semble plus fort dans l'eau. Les ennemis déjà refroidis ou gelés subissent moins de dégâts avec cette baguette.
items.wands.wandoffrost.upgrade_stat_name_2=Durée du refroidissement
items.wands.wandoflightning$lightningcharge.desc=Le Battlemage est actuellement chargé d'énergie, ce qui lui confère une immunité à son bâton de foudre et augmente la portée des éclairs qu'il peut lancer.\n\nTours restants : %s.
items.wands.wandoflightning$lightningcharge.name=Chargé électriquement
items.wands.wandoflightning.bmage_desc=Lorsque _le Battlemage_ frappe un ennemi avec un bâton de foudre, il a une chance de se charger électriquement pendant 10 tours. Lorsqu'il est chargé, le Battlemage est immunisé contre les dégâts causés par la foudre et peut faire courir la foudre plus loin.
items.wands.wandoflightning.desc=Cette baguette est fabriquée en métal massif, ce qui la rend étonnamment lourde. Les deux branches se rejoignent à l'extrémité et l'électricité passe entre elles.
items.wands.wandoflightning.eleblast_desc=Un coup élémentaire avec un bâton de foudre inflige 100 % de dégâts, étourdit les ennemis pendant 5 tours et électrise l'eau.
items.wands.wandoflightning.name=baguette de foudre
items.wands.wandoflightning.ondeath=Vous vous êtes tué avec votre propre baguette de foudre...
items.wands.wandoflightning.staff_name=le bâton de la foudre
items.wands.wandoflightning.stats_desc=Cette baguette envoie de puissants éclairs qui traversent tout ce qui est visé, infligeant des dégâts _%1$d-%2$d _ Cette électricité s'étend aux personnages proches et se propage plus facilement dans l'eau. Les arcs électriques de cette baguette peuvent vous endommager, mais ne blesseront pas vos alliés.
items.wands.wandoflivingearth$earthguardian.desc=Les roches de votre baguette de terre vivante se sont transformées en un gardien de terre protecteur ! Ce protecteur rocheux attaquera les ennemis proches, ce qui les forcera à s'en prendre au gardien plutôt qu'à vous. Lorsque tous les ennemis proches auront disparu, le gardien se reformera autour de vous et reviendra à la prochaine utilisation de votre baguette.
items.wands.wandoflivingearth$earthguardian.discover_hint=Vous pouvez trouver ce personnage avec une baguette spécifique.
items.wands.wandoflivingearth$earthguardian.name=gardien de terre
items.wands.wandoflivingearth$earthguardian.wand_info=La puissance défensive du gardien est liée au niveau de votre baguette. Il bloque actuellement _%1$d-%2$d dégâts
items.wands.wandoflivingearth$rockarmor.desc=Des roches magiques entourent votre corps, lorsque vous êtes attaqué, elles tentent de vous bloquer et réduisent les dégâts que vous subissez de 50%%. Cependant, chaque dégât bloqué enlève une partie de la roche.\n\nArmure restante : %1$d.\n\nSi suffisamment de rochers sont construits autour de vous, la prochaine décharge de votre baguette de terre vivante les transformera en un gardien qui se battra avec vous.\n\nArmure nécessaire pour le gardien : %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Ce gardien de terre bénéficie également du pouvoir de la multitude. Tours restants : %d.
items.wands.wandoflivingearth$rockarmor.name=armure de roche
items.wands.wandoflivingearth.bmage_desc=Lorsque _le Battlemage_ frappe un ennemi avec un bâton de terre vivante, une partie des dégâts infligés est renvoyée sous forme d'armure de roche.
items.wands.wandoflivingearth.desc=Cette baguette est faite d'un curieux rocher, avec des bandes d'énergie jaune incandescente. Les pierres semblent se déplacer légèrement lorsque vous saisissez la baguette, comme si elles sentaient votre main.
items.wands.wandoflivingearth.eleblast_desc=Une attaque élémentaire avec un bâton de terre vivante inflige 50 % des dégâts et soigne un gardien de terre actif pour chaque ennemi touché.
items.wands.wandoflivingearth.name=baguette de terre vivante
items.wands.wandoflivingearth.staff_name=bâton de la terre vivante
items.wands.wandoflivingearth.stats_desc=Cette baguette envoie des éclairs de roche magique sur les ennemis, infligeant des dégâts _%1$d-%2$d._ Les roches se reforment ensuite autour de l'utilisateur, lui conférant une armure proportionnelle aux dégâts infligés. Si l'armure est suffisante, elle se transformera en gardien de roche lors de la prochaine utilisation de la baguette.
items.wands.wandoflivingearth.upgrade_stat_name_2=Gardien Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Blocage des gardiens
items.wands.wandofmagicmissile$magiccharge.desc=Votre baguette de missile magique a réinjecté de l'énergie dans vos baguettes, augmentant ainsi le niveau d'efficacité de la prochaine détonation qu'elles produiront.\n\nVos baguettes sont boostées à : +%d.\n\nNombre de tours de charge magique restants : %s.
items.wands.wandofmagicmissile$magiccharge.name=charge magique
items.wands.wandofmagicmissile.bmage_desc=Lorsque _le mage de bataille_ frappe un ennemi avec un bâton de missile magique, toutes ses baguettes gagnent de la charge en plus de son bâton.
items.wands.wandofmagicmissile.desc=Cette baguette assez simple lance des missiles d'énergie magique pure. Si la baguette elle-même n'a pas d'effets spéciaux, elle a plus de charges disponibles et peut brièvement donner du pouvoir à d'autres baguettes lorsqu'elle est améliorée.
items.wands.wandofmagicmissile.discover_hint=L'un des héros commence avec cet objet.
items.wands.wandofmagicmissile.eleblast_desc=Un tir élémentaire avec un bâton de missile magique inflige 50 % des dégâts et permet au mage de se recharger pendant 15 tours.
items.wands.wandofmagicmissile.name=baguette magique missile
items.wands.wandofmagicmissile.staff_name=bâton de missile magique
items.wands.wandofmagicmissile.stats_desc=Chaque éclair de cette baguette inflige _%1$d-%2$d dégâts,_ et donne brièvement du pouvoir aux autres baguettes si elle est améliorée.
items.wands.wandofprismaticlight.bmage_desc=Lorsque _le Battlemage_ frappe un ennemi avec un bâton de lumière prismatique, celui-ci est paralysé pendant une durée qui varie en fonction du niveau du bâton.
items.wands.wandofprismaticlight.desc=Cette baguette est faite d'un solide morceau de cristal translucide, comme un long morceau de verre lisse. De petits éclats de lumière colorée dansent autour de l'extrémité de la baguette, impatients de jaillir.
items.wands.wandofprismaticlight.eleblast_desc=Une explosion élémentaire avec un bâton de lumière prismatique inflige 67% de dégâts, révèle tout le terrain dans l'explosion et aveugle les ennemis pendant 5 tours.
items.wands.wandofprismaticlight.name=baguette de lumière prismatique
items.wands.wandofprismaticlight.staff_name=bâton de lumière prismatique
items.wands.wandofprismaticlight.stats_desc=Cette baguette émet des rayons de lumière qui traversent l'obscurité du donjon, révélant les zones cachées et les pièges. Le rayon peut aveugler les ennemis et infliger des dégâts _%1$d-%2$d _ Les démons et les morts-vivants brûlent sous la lumière de la baguette et subissent des dégâts supplémentaires.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind Chance
items.wands.wandofprismaticlight.upgrade_stat_name_3=Durée de la lumière
items.wands.wandofregrowth$dewcatcher.desc=Les cercopes sont des plantes merveilleuses qui se remplissent d'une rosée magique. Elles tentent de se camoufler en herbe pour éviter d'attirer l'attention, mais leurs bourrelets de rosée collectée les trahissent.
items.wands.wandofregrowth$dewcatcher.discover_hint=Vous pouvez trouver cette plante avec une baguette spécifique.
items.wands.wandofregrowth$dewcatcher.name=Le capteur d'eau de mer
items.wands.wandofregrowth$lotus.desc=Le lotus doré est une plante mystique qui ne peut être conjurée que par une puissante baguette de repousse. Son aura renforce toutes les plantes et leurs effets, mais elle brûle son énergie et meurt au bout de peu de temps.
items.wands.wandofregrowth$lotus.discover_hint=Vous pouvez trouver cette plante avec une baguette spécifique, après l'avoir améliorée plusieurs fois.
items.wands.wandofregrowth$lotus.name=Lotus d'or
items.wands.wandofregrowth$lotus.wand_info=Ce lotus a été produit par une _+%1$d_ baguette de repousse. Toutes les plantes dans son effet se _déclencheront instantanément_ si elles sont plantées sur un personnage. Les plantes auront également une _%2$d%% chance_ de laisser tomber leur graine, et les fléchettes à pointe utiliseront _%3$d%% moins de durabilité_.
items.wands.wandofregrowth$seedpod.desc=Les gousses sont des plantes magiques qui produisent des graines à partir d'autres types de plantes, plutôt que leurs propres graines. Elles parviennent à se répandre bien qu'elles n'aient pas de graines propres.
items.wands.wandofregrowth$seedpod.discover_hint=Vous pouvez trouver cette plante avec une baguette spécifique.
items.wands.wandofregrowth$seedpod.name=Gousse de semence
items.wands.wandofregrowth.bmage_desc=Lorsque _le Battlemage_ frappe un ennemi avec un bâton de repousse et que l'un ou l'autre se trouve sur de l'herbe, il bénéficie d'une guérison par les plantes proportionnelle aux dégâts infligés.
items.wands.wandofregrowth.degradation=Après une autre _%d charges_, cette baguette commencera à ne plus produire de plantes et d'herbe fraîche. Cette limite peut être augmentée en montant de niveau ou en améliorant la baguette.
items.wands.wandofregrowth.desc=Cette baguette est faite d'une fine tige de bois sculptée par des experts. D'une manière ou d'une autre, elle est encore vivante et vibrante, d'un vert éclatant comme le cœur d'un jeune arbre. "Quand la vie s'arrête, une nouvelle vie commence toujours à pousser... Le cycle éternel demeure toujours !"
items.wands.wandofregrowth.eleblast_desc=Une explosion élémentaire avec un bâton de repousse enracine les ennemis et fait pousser de l'herbe de façon aléatoire sur la zone de l'explosion.
items.wands.wandofregrowth.name=baguette de repousse
items.wands.wandofregrowth.staff_name=personnel de repousse
items.wands.wandofregrowth.stats_desc=Lorsqu'elle est utilisée, cette baguette projette de l'énergie magique de repousse dans un cône, faisant renaître l'herbe, les racines et les plantes rares. Le prochain coup consommera _%1$d charges_. Plus la baguette utilise de charges, plus l'effet est grand et puissant.
items.wands.wandofregrowth.upgrade_stat_name_1=Herbe par charge
items.wands.wandofregrowth.upgrade_stat_name_2=Limite totale d'herbe
items.wands.wandoftransfusion.bmage_desc=Lorsque _le Battlemage_ frappe un ennemi charmé avec un bâton de transfusion, il gagne un bouclier et son prochain coup avec le bâton ne coûtera pas de points de vie.
items.wands.wandoftransfusion.charged=Votre bâton est chargé de l'énergie vitale de votre ennemi !
items.wands.wandoftransfusion.desc=De forme assez simple, cette baguette se distingue par sa teinte magenta et sa gemme noire à l'extrémité.
items.wands.wandoftransfusion.eleblast_desc=Une explosion élémentaire avec un bâton de transfusion charme les ennemis, soigne les alliés et inflige 100 % de dégâts aux ennemis morts-vivants.
items.wands.wandoftransfusion.name=la baguette de la transfusion
items.wands.wandoftransfusion.ondeath=Vous vous êtes tué avec votre propre baguette de transfusion...
items.wands.wandoftransfusion.staff_name=personnel de transfusion
items.wands.wandoftransfusion.stats_desc=Lorsqu'elle est utilisée sur des alliés ou des ennemis charmés, cette baguette prélève _%1$d de la santé de l'utilisateur pour soigner ou protéger l'allié pour _%2$d de la santé._ Lorsqu'elle est utilisée sur des ennemis, la baguette les charme brièvement tout en appliquant _%3$d de bouclier à l'utilisateur. Les morts-vivants hostiles subissent _%4$d-%5$d dégâts_ au lieu d'être charmés.
items.wands.wandoftransfusion.upgrade_stat_name_1=Allié guérisseur
items.wands.wandoftransfusion.upgrade_stat_name_2=Autoblindage
items.wands.wandoftransfusion.upgrade_stat_name_3=Dommages aux morts-vivants
items.wands.wandofwarding$ward.desc_1=Cette protection de base zappe automatiquement tout ennemi qui entre dans son champ de vision, lui infligeant _%1$d-%2$d_\n\nLe fait de frapper cette protection avec votre baguette de protection permet de l'améliorer.\n\nCette protection n'est activée qu'une seule fois avant de se dissiper.\n\nVotre baguette utilise de l'énergie _%3$d_ pour maintenir cette protection.
items.wands.wandofwarding$ward.desc_2=Cette protection améliorée a un motif plus complexe et peut attaquer plusieurs fois. Chaque coup porté par cette enceinte inflige _%1$d-%2$d_\n\nL'utilisation de votre baguette de protection permet d'améliorer cette protection.\n\nElle zappe trois fois avant de se dissiper.\n\nVotre baguette de protection utilise de l'énergie _%3$d_ pour maintenir cette protection.
items.wands.wandofwarding$ward.desc_3=Cette protection entièrement améliorée est capable d'attaquer plus de fois que ses prédécesseurs. Chaque coup porté par cette enceinte inflige _%1$d-%2$d_ de dégâts\n\nL'utilisation de votre baguette de protection permet d'améliorer cette protection.\n\nCe sort zappera cinq fois avant de se dissiper.\n\nVotre baguette de protection utilise de l'énergie _%3$d_ pour maintenir cette protection.
items.wands.wandofwarding$ward.desc_4=Cette petite sentinelle a la même puissance de feu qu'une grande garde, mais elle dispose de points de vie au lieu d'un nombre déterminé de charges. Elle ressemble à la gemme qui se trouve à l'extrémité de votre baguette de protection. Chaque coup de cette sentinelle inflige _%1$d-%2$d dégâts\n\nLe fait de frapper cette sentinelle avec votre baguette de protection l'améliore et la soigne.\n\nCette sentinelle perd un peu de santé à chaque fois qu'elle frappe un ennemi, mais elle peut être soignée en utilisant votre baguette de protection sur elle.\n\nVotre baguette de protection utilise de l'énergie _%3$d_ pour soutenir cette sentinelle.
items.wands.wandofwarding$ward.desc_5=Cette sentinelle améliorée est plus grande et plus durable qu'une sentinelle de moindre importance. Chaque coup de cette sentinelle inflige _%1$d-%2$d dégâts\n\nSi vous frappez cette sentinelle avec votre baguette de protection, elle sera améliorée et soignée.\n\nCette sentinelle perd un peu de santé à chaque fois qu'elle frappe un ennemi, mais elle peut être soignée en utilisant votre baguette de protection sur elle.\n\nVotre baguette de protection utilise de l'énergie _%3$d_ pour soutenir cette sentinelle.
items.wands.wandofwarding$ward.desc_6=Cette sentinelle entièrement améliorée est nettement plus résistante que ses prédécesseurs. Chaque coup de cette sentinelle inflige _%1$d-%2$d dégâts\n\nSi vous frappez cette sentinelle avec votre baguette de protection, elle sera soignée.\n\nCette sentinelle perd un peu de santé à chaque fois qu'elle frappe un ennemi, mais elle peut être soignée en utilisant votre baguette de protection sur elle.\n\nVotre baguette de garde utilise de l'énergie _%3$d_ pour soutenir cette sentinelle.
items.wands.wandofwarding$ward.desc_generic_sentry=Cette sentinelle a la même puissance de feu qu'un gardien, mais elle dispose de points de vie au lieu d'un nombre déterminé de charges. Elle ressemble à la gemme qui se trouve à l'extrémité de votre baguette de protection.\n\nEn frappant cette sentinelle avec votre baguette de gardien, vous l'améliorez et la soignez.\n\nCette sentinelle perd de la santé à chaque fois qu'elle touche un ennemi, mais elle peut être soignée en utilisant votre baguette de protection.
items.wands.wandofwarding$ward.desc_generic_ward=Cette protection zèbre automatiquement tout ennemi qui entre dans son champ de vision.\n\nLe fait de frapper cette protection avec votre baguette de protection l'améliorera.\n\nLes protections ont un nombre limité de zaps avant de se dissiper.
items.wands.wandofwarding$ward.discover_hint=Vous pouvez trouver ce personnage avec une baguette spécifique.
items.wands.wandofwarding$ward.dismiss_body=Vous pouvez dissiper cette protection si vous ne souhaitez plus qu'elle soit maintenue par votre baguette. Ce faisant, vous détruisez immédiatement la protection.\n\nDissiper cette protection ?
items.wands.wandofwarding$ward.dismiss_cancel=non
items.wands.wandofwarding$ward.dismiss_confirm=oui
items.wands.wandofwarding$ward.dismiss_title=Rejeter cette pupille ?
items.wands.wandofwarding$ward.name_1=petite salle
items.wands.wandofwarding$ward.name_2=pupille
items.wands.wandofwarding$ward.name_3=grand quartier
items.wands.wandofwarding$ward.name_4=petite sentinelle
items.wands.wandofwarding$ward.name_5=sentinelle
items.wands.wandofwarding$ward.name_6=plus grande sentinelle
items.wands.wandofwarding.bad_location=Il n'est pas possible d'y placer une pupille.
items.wands.wandofwarding.bmage_desc=Lorsque _le Battlemage_ frappe un ennemi avec un bâton de garde, tous les gardes et sentinelles actifs ont une chance d'être soignés.
items.wands.wandofwarding.desc=Cette courte baguette en métal est surmontée d'une pierre précieuse d'un violet éclatant.
items.wands.wandofwarding.eleblast_desc=Un souffle élémentaire avec un bâton de garde soigne tous les gardes et les sentinelles dans la zone du souffle.
items.wands.wandofwarding.name=baguette de garde
items.wands.wandofwarding.no_more_wards=Votre baguette ne peut plus supporter d'autres protections.
items.wands.wandofwarding.staff_name=personnel de garde
items.wands.wandofwarding.stats_desc=Au lieu d'endommager directement l'ennemi, cette baguette invoque des gardes et des sentinelles stationnaires. Les protections peuvent être invoquées n'importe où, même à travers les murs si vous avez une vision. Cette baguette peut soutenir _%d_ d'énergie à la fois.
items.wands.wandofwarding.upgrade_stat_name_1=Dommages au quartier
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=BOISSONS
items.waterskin.collected=Vous recueillez la goutte de rosée dans votre gourde.
items.waterskin.desc=Récipient pour liquide, fabriqué à partir de cuir et de ficelle, fermé par un bouchon de liège.
items.waterskin.desc_full=La gourde pleine semble irradier de l'énergie, peut-être peut-elle être utilisée pour bénir un autre objet de survie ?
items.waterskin.desc_heal=La gourde est actuellement utilisée pour stocker de l'eau de guérison. Plus la gourde est pleine, plus vous serez instantanément guéri lorsque vous en boirez. Vous ne boirez que la quantité dont vous avez besoin.
items.waterskin.desc_water=Pour l'instant, la gourde ne contient que de l'eau potable. Il y a sûrement quelque chose dans le donjon que la gourde pourrait stocker à la place.
items.waterskin.discover_hint=L'un des héros commence avec cet objet.
items.waterskin.empty=Votre gourde est vide !
items.waterskin.full=Votre gourde est pleine !
items.waterskin.name=gourde
items.weapon.curses.annoying.desc=Les armes gênantes sont capables de parler, mais elles sont un peu trop énergiques. Elles attirent souvent l'attention sur vous sans le vouloir.
items.weapon.curses.annoying.elestrike_desc=Une frappe élémentaire avec une malédiction gênante a 20 % de chances d'endommager chaque ennemi à portée pendant 6 tours.
items.weapon.curses.annoying.msg_1=OOH, SOMMES-NOUS EN TRAIN DE NOUS BATTRE CONTRE QUELQUE CHOSE ?
items.weapon.curses.annoying.msg_10=BIEN EN PLACE !
items.weapon.curses.annoying.msg_11=Je ne voulais pas être une arme, mais une hache de bûcheron.
items.weapon.curses.annoying.msg_12=N'oubliez pas que l'excès de confiance est un tueur lent et insidieux.
items.weapon.curses.annoying.msg_13=TOUTES VOS BASES NOUS APPARTIENNENT !
items.weapon.curses.annoying.msg_2=OUI, ACHETEZ-LES !
items.weapon.curses.annoying.msg_3=HEY, LISTEN !
items.weapon.curses.annoying.msg_4=SOMMES-NOUS DÉJÀ ARRIVÉS À LA TÊTE DE L'ENTREPRISE ?
items.weapon.curses.annoying.msg_5=OUCH, NE ME BALANCEZ PAS SI FORT !
items.weapon.curses.annoying.msg_6=MEURS, INSECT !
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE !
items.weapon.curses.annoying.msg_8=PEUT-ON FAIRE UNE PAUSE ?
items.weapon.curses.annoying.msg_9=POW, HAHA !
items.weapon.curses.annoying.name=ennuyeux %s
items.weapon.curses.dazzling.desc=Les armes éblouissantes émettent parfois des éclairs de lumière éblouissante, aveuglant tout ce qui peut les voir.
items.weapon.curses.dazzling.elestrike_desc=Une attaque élémentaire avec une malédiction éblouissante a 50% de chances d'aveugler chaque ennemi à portée pendant 6 tours.
items.weapon.curses.dazzling.name=éblouissant %s
items.weapon.curses.displacing.desc=Les armes de déplacement sont dotées d'une magie de téléportation chaotique et ont la capacité de déplacer les ennemis sur le sol de façon aléatoire.
items.weapon.curses.displacing.elestrike_desc=Une frappe élémentaire avec un sort de déplacement a 50% de chances de téléporter chaque ennemi à portée.
items.weapon.curses.displacing.name=déplacer %s
items.weapon.curses.explosive.desc=Les armes explosives augmentent progressivement leur puissance et explosent, endommageant tout ce qui se trouve à proximité.
items.weapon.curses.explosive.desc_cool=Votre arme est actuellement froide au toucher.
items.weapon.curses.explosive.desc_hot=Votre arme est brûlante ! Elle est sur le point d'exploser !
items.weapon.curses.explosive.desc_warm=Votre arme accumule de l'énergie et se réchauffe...
items.weapon.curses.explosive.elestrike_desc=Une frappe élémentaire avec un sort explosif a 50% de chances de provoquer une explosion sur un ennemi aléatoire à portée.
items.weapon.curses.explosive.hot=Chaud !
items.weapon.curses.explosive.name=explosif %s
items.weapon.curses.explosive.warm=Chaud...
items.weapon.curses.friendly.desc=Les armes amicales conviennent mieux aux pacifistes et déclenchent parfois des effets magiques qui rendent le combat impossible.
items.weapon.curses.friendly.elestrike_desc=Une frappe élémentaire avec une malédiction amie a 50% de chances de charmer chaque ennemi à portée pendant 6 tours.
items.weapon.curses.friendly.name=amical %s
items.weapon.curses.polarized.desc=Une arme polarisée est affectée par une magie qui fait que son attaque inflige 50 % de dégâts en plus ou n'en inflige pas du tout.
items.weapon.curses.polarized.elestrike_desc=Une frappe élémentaire avec une malédiction polarisée a 50% de chances d'infliger 24-36 points de dégâts à chaque ennemi à portée.
items.weapon.curses.polarized.name=polarisé %s
items.weapon.curses.sacrificial.desc=Les armes sacrificielles exigent du sang de la part du porteur en échange de l'attaque des ennemis. Plus le porteur est en bonne santé, plus la malédiction prendra de sang.
items.weapon.curses.sacrificial.elestrike_desc=Une frappe élémentaire avec une malédiction sacrificielle fait saigner le héros et chaque ennemi à portée pour 12 PV.
items.weapon.curses.sacrificial.name=sacrificiel %s
items.weapon.curses.wayward$waywardbuff.desc=La magie de votre arme de combat s'est activée, ce qui la rend extrêmement imprécise pendant une courte période. Notez que cela n'affecte pas les attaques qui sont sûres de toucher, comme les attaques surprises. Une attaque réussie avec l'arme de contournement annule immédiatement cet effet.\n\nTours restants : %s.
items.weapon.curses.wayward$waywardbuff.name=en difficulté
items.weapon.curses.wayward.desc=Les armes de la voie deviennent parfois extrêmement imprécises. Cette magie ne dure qu'un temps lorsqu'elle est activée, mais elle peut être dissipée en portant un coup avec l'arme déviée.
items.weapon.curses.wayward.elestrike_desc=Une frappe élémentaire avec une malédiction de fuite a 50% de chances d'infliger un sort à chaque ennemi à portée pendant 6 tours.
items.weapon.curses.wayward.name=en chemin %s
items.weapon.enchantments.blazing.desc=Cet enchantement fait jaillir des flammes de l'arme, enflammant les ennemis et infligeant des dégâts bonus aux ennemis déjà enflammés.
items.weapon.enchantments.blazing.elestrike_desc=Une frappe élémentaire avec un enchantement de feu propage le feu sur toutes les tuiles à portée, ce qui dure 8 tours.
items.weapon.enchantments.blazing.name=flamboyant %s
items.weapon.enchantments.blocking$blockbuff.desc=L'enchantement de blocage de votre arme vous a permis d'augmenter brièvement votre puissance défensive !\n\nBouclier restant : %d\n\nTours restants : %s.
items.weapon.enchantments.blocking$blockbuff.name=blocage
items.weapon.enchantments.blocking.desc=Les armes de blocage ont une chance de vous protéger brièvement après une attaque.
items.weapon.enchantments.blocking.elestrike_desc=Une frappe élémentaire avec un enchantement de blocage accorde au duelliste un bouclier supplémentaire de 6 pour chaque ennemi à portée.
items.weapon.enchantments.blocking.name=blocage %s
items.weapon.enchantments.blooming.desc=Les armes fleuries contiennent de la magie qui fait germer de la végétation sur ou autour des personnes touchées.
items.weapon.enchantments.blooming.elestrike_desc=Une frappe élémentaire avec un enchantement de floraison répand de l'herbe jusqu'à 8 carreaux à portée, et enracine tous les ennemis à portée pendant 6 tours.
items.weapon.enchantments.blooming.name=floraison %s
items.weapon.enchantments.chilling.desc=Les ennemis touchés par cet enchantement sont refroidis, ce qui ralentit leurs mouvements et leurs attaques.
items.weapon.enchantments.chilling.elestrike_desc=Une frappe élémentaire avec un enchantement glacial répand de l'air glacial sur toutes les tuiles à portée, ce qui dure 8 tours.
items.weapon.enchantments.chilling.name=refroidissement %s
items.weapon.enchantments.corrupting.desc=Ce puissant enchantement a la capacité de soumettre les ennemis à votre volonté. Lorsqu'un ennemi est tué avec cette arme, il est possible qu'il soit corrompu au lieu de mourir.
items.weapon.enchantments.corrupting.elestrike_desc=Une frappe élémentaire avec un enchantement de corruption a 5 à 25 % de chances (en fonction des PV manquants) de corrompre chaque ennemi à portée, à l'exception de la cible principale.
items.weapon.enchantments.corrupting.name=corrompant %s
items.weapon.enchantments.elastic.desc=Les armes élastiques ont une chance d'envoyer les ennemis voler en arrière sur de courtes distances.
items.weapon.enchantments.elastic.elestrike_desc=Une frappe élémentaire avec un enchantement d'élasticité fait reculer tous les ennemis à portée de 5 carreaux.
items.weapon.enchantments.elastic.name=élastique %s
items.weapon.enchantments.grim.desc=Ce puissant enchantement a le pouvoir d'exécuter instantanément un ennemi. L'effet a d'autant plus de chances de se produire que l'ennemi est faible.
items.weapon.enchantments.grim.elestrike_desc=Un coup élémentaire bénéficiant d'un enchantement sinistre a 6 à 30 % de chances (en fonction des PV manquants) de tuer tous les ennemis à portée, à l'exception de la cible principale.
items.weapon.enchantments.grim.name=sinistre %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Votre arme a emmagasiné la force excédentaire d'un coup mortel précédent, et l'appliquera sous forme de dégâts bonus à votre prochaine attaque. Cependant, l'énergie s'estompe lentement avec le temps.\n\nDégâts conservés : %d.
items.weapon.enchantments.kinetic$conserveddamage.name=dommages conservés
items.weapon.enchantments.kinetic.desc=Lorsqu'un ennemi est tué avec une arme cinétique, la force excédentaire est stockée dans l'arme et sera appliquée à la prochaine attaque réussie.
items.weapon.enchantments.kinetic.elestrike_desc=Une frappe élémentaire avec un enchantement cinétique applique 40% des dégâts stockés à chaque ennemi à portée, à l'exception de la cible principale.
items.weapon.enchantments.kinetic.name=cinétique %s
items.weapon.enchantments.lucky.desc=Les ennemis qui sont tués par une arme chanceuse ont une chance de laisser un butin supplémentaire.
items.weapon.enchantments.lucky.elestrike_desc=Un coup élémentaire avec un enchantement de chance a 12,5 % de chances de faire apparaître du butin sous chaque ennemi à portée. Cet effet ne peut être déclenché qu'une seule fois par ennemi.
items.weapon.enchantments.lucky.name=chanceux %s
items.weapon.enchantments.projecting.desc=Avec cet enchantement, les armes de mêlée gagnent en portée. Les armes à distance pénètrent les murs lorsqu'elles visent des cibles proches.
items.weapon.enchantments.projecting.elestrike_desc=Une frappe élémentaire avec un enchantement de projection inflige 30% de dégâts à chaque ennemi à portée, à l'exception de la cible principale.
items.weapon.enchantments.projecting.name=projeter %s
items.weapon.enchantments.shocking.desc=Un arc électrique jaillit d'une arme à électrochocs, infligeant des dégâts supplémentaires à tous les ennemis proches.
items.weapon.enchantments.shocking.elestrike_desc=Une frappe élémentaire avec un enchantement de choc propage de l'électricité à toutes les tuiles à portée, ce qui dure 8 tours.
items.weapon.enchantments.shocking.name=choquant %s
items.weapon.enchantments.unstable.desc=Cet enchantement irradie une énergie chaotique, agissant comme un enchantement différent à chaque coup.
items.weapon.enchantments.unstable.elestrike_desc=Une frappe élémentaire avec un enchantement instable applique un effet d'enchantement aléatoire à chaque ennemi à portée, à l'exception de la cible principale.
items.weapon.enchantments.unstable.name=instable %s
items.weapon.enchantments.vampiric.desc=Ce puissant enchantement absorbe la force vitale de l'ennemi à chaque coup, et la renvoie vers le porteur. L'effet est d'autant plus fort que la santé du porteur est faible.
items.weapon.enchantments.vampiric.elestrike_desc=Une frappe élémentaire avec un enchantement vampirique soigne le duelliste de 2,5 PV pour chaque ennemi à portée.
