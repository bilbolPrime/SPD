items.weapon.missiles.trident.desc=Ces lances massives sont munies de trois pointes mortelles à leur extrémité. Elles sont puissantes, mais assez lourdes.
items.weapon.missiles.trident.name=trident
items.weapon.spiritbow.ac_shoot=SHOOT
items.weapon.spiritbow.desc=Un arc fabriqué à partir d'un ancien bois magique. La corde et les gravures de l'arc brillent d'une lumière bleue pâle. Lorsque la corde est tirée, l'arc fait apparaître une flèche magique qui peut être tirée sur un ennemi.
items.weapon.spiritbow.discover_hint=L'un des héros commence avec cet objet.
items.weapon.spiritbow.name=arc spirituel
items.weapon.spiritbow.prompt=Choisir une cible
items.weapon.spiritbow.stats=L'arc ne peut pas être amélioré directement, mais devient de plus en plus puissant au fur et à mesure que vous montez en niveau. À votre niveau actuel, les flèches tirées avec l'arc infligent _%1$d-%2$d_ de dégâts et nécessitent _%3$d de force_ pour être utilisées correctement.
items.weapon.weapon$enchantment.discover_hint=Vous pouvez trouver un objet avec cet effet au hasard dans le donjon, ou essayer de l'appliquer vous-même à un objet.
items.weapon.weapon$enchantment.enchant=enchantement
items.weapon.weapon$enchantment.rankings_desc=Tué par un enchantement
items.weapon.weapon.cursed=Vous sentez qu'une magie malveillante se cache dans cette arme.
items.weapon.weapon.cursed_worn=Cette arme étant maudite, vous ne pouvez pas la retirer.
items.weapon.weapon.enchant_hardened=Il a été _durci_
items.weapon.weapon.enchanted=il a une _%s._
items.weapon.weapon.excess_str=Grâce à votre excès de force, vous infligez _0-%d bonus de dégâts_ avec cette arme.
items.weapon.weapon.faster=Elle est augmentée pour améliorer la _vitesse_
items.weapon.weapon.hardened_no_enchant=Cette arme a été _durcie_, mais n'est pas enchantée pour le moment.
items.weapon.weapon.hardening_gone=Le durcissement de cette arme a disparu !
items.weapon.weapon.identify=Vous êtes maintenant suffisamment familiarisé avec votre arme pour l'identifier.
items.weapon.weapon.incompatible=L'interaction de différents types de magie a annulé l'enchantement de cette arme !
items.weapon.weapon.not_cursed=Cette arme est exempte de magie malveillante.
items.weapon.weapon.stronger=Il est augmenté pour accroître les _dommages_
items.weapon.weapon.too_heavy=En raison de votre force insuffisante, cette arme entravera votre vitesse d'attaque, votre précision et votre capacité à attaquer par surprise.
items.weapon.weapon.weak_cursed=Malgré la malédiction, vous pouvez déséquiper cette arme.
items.bags.seedpouch.desc=Cette petite bourse de velours peut contenir autant de graines que vous le souhaitez. Très pratique.
items.bags.seedpouch.name=sachet de graines
items.potions.potionofmight.desc=Ce liquide puissant se répand dans vos muscles et augmente définitivement votre force d'un point et votre santé de cinq points.
items.potions.potionofmight.name=Potion de puissance
items.rings.ringofdetection.desc=Cette bague permet de repérer les pièges et les portes secrètes sans prendre le temps de chercher. Si elle est dégradée, elle émousse vos sens et rend les secrets plus difficiles à trouver, même en les cherchant.
items.rings.ringofdetection.name=Anneau de détection
items.rings.ringofhaggler.desc=Cette bague n'a aucun pouvoir magique. Elle signale aux marchands que vous appartenez à la Guilde des voleurs. Ils accordent volontiers une remise en échange de la promesse d'être épargnés quelque temps. Améliorer cette bague n'apporte aucun bonus supplémentaire.
items.rings.ringofhaggler.name=anneau du marchand
items.rings.ringofherbalism.desc=Cette bague augmente vos chances de trouver de la rosée et des graines en piétinant l'herbe.
items.rings.ringofherbalism.name=Anneau d'herboristerie
items.rings.ringofmending.desc=Cette bague renforce la régénération du corps et permet de récupérer plus vite la santé perdue. Une bague dégradée ralentit cette régénération, voire l'arrête.
items.rings.ringofmending.name=anneau de régénération
items.rings.ringofpower.desc=Le champ d'énergie de cette bague rend vos baguettes plus puissantes. Une bague dégradée les affaiblit au contraire.
items.rings.ringofpower.name=Anneau de pouvoir
items.rings.ringofsatiety.desc=Cette bague permet de rester plus longtemps sans manger. Une bague dégradée produit l'effet inverse.
items.rings.ringofsatiety.name=Anneau de satiété
items.rings.ringofshadows.desc=Vous passerez plus inaperçu si vous portez cette bague. Les anneaux d'ombre dégradés alerteront les ennemis qui, autrement, n'auraient pas remarqué votre présence.
items.rings.ringofshadows.name=Anneau des ombres
items.rings.ringofthorns.desc=Cette bague ne porte pas de vraies épines, mais tout ennemi qui vous attaque subit une partie des dégâts qu'il inflige. Améliorer cette bague n'apporte aucun bonus supplémentaire.
items.rings.ringofthorns.name=Anneau d'épines
items.scrolls.scrollofchallenge.desc=Lu à haute voix, ce parchemin libérera un rugissement menaçant qui réveillera tous les monstres et les alertera de la présence du lecteur.
items.scrolls.scrollofchallenge.name=parchemin de défi
items.scrolls.scrollofenchantment.desc=Ce parchemin permet d'imprégner une arme ou une armure d'un enchantement aléatoire, lui conférant un pouvoir spécial.
items.scrolls.scrollofenchantment.name=parchemin d'enchantement
items.scrolls.scrollofpsionicblast.desc=Ce parchemin renferme une énergie destructrice, canalisable par la pensée pour infliger des dégâts considérables à toutes les créatures dans son champ de vision. Un éclair de lumière aveuglera temporairement tous ceux qui se trouvent dans la zone d'effet, y compris le lecteur du parchemin.
items.scrolls.scrollofpsionicblast.name=parchemin d'explosion psionique
items.scrolls.scrollofwipeout.desc=Lisez ce parchemin pour déchaîner la colère des esprits du donjon et anéantir toute vie au niveau actuel. Enfin, presque toute vie. Certaines créatures puissantes pourraient y échapper.
items.scrolls.scrollofwipeout.name=parchemin d'anéantissement
items.wands.wandofblink.desc=Cette baguette vous téléporte dans la direction choisie. Les créatures et les obstacles bloquent la téléportation.
items.wands.wandofblink.name=baguette de téléportation
items.wands.wandoffirebolt.desc=Cette baguette projette des flammes magiques. Elle enflamme le terrain combustible et blesse et brûle les créatures qu'elle touche.
items.wands.wandoffirebolt.name=baguette de feu
