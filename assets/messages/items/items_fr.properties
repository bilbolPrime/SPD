items.weapon.melee.spear.typical_ability_desc=Le duelliste peut utiliser la pointe de sa lance pour _pique_ un ennemi qui est à portée mais pas adjacent. Cela inflige généralement des _%1$d-%2$d dégâts_, fait reculer l'ennemi et le touche à coup sûr.
items.weapon.melee.sword$cleavetracker.desc=Le duelliste est prêt à donner suite à son précédent coup de taille. La prochaine utilisation de la fente ne coûtera pas de charge de capacité d'arme.\n\nTours restants : %s.
items.weapon.melee.sword$cleavetracker.name=cliver
items.weapon.melee.sword.ability_desc=Le duelliste peut _fendre_ un ennemi avec son épée. Cela inflige _%1$d-%2$d dégâts_ et est garanti de toucher. Si la fente tue un ennemi, elle est instantanée et le duelliste peut utiliser la fente à nouveau dans les 5 tours gratuitement.
items.weapon.melee.sword.ability_name=cliver
items.weapon.melee.sword.desc=Une épée bien équilibrée. Pas trop grande, mais nettement plus longue qu'une épée courte.
items.weapon.melee.sword.name=épée
items.weapon.melee.sword.typical_ability_desc=Le duelliste peut _fendre_ un ennemi avec son épée. Il inflige généralement _%1$d-%2$d_ de dégâts et est sûr de toucher. Si la fente tue un ennemi, elle est instantanée et le duelliste peut utiliser la fente à nouveau dans les 5 tours gratuitement.
items.weapon.melee.warhammer.ability_desc=Le duelliste peut effectuer un _coup violent_ avec un marteau de guerre. Cette attaque concentrée inflige des _%1$d-%2$d dégâts_ si elle a surpris l'ennemi, et l'étourdit pendant 5 tours, ce qui réduit sa précision et son évasion de 50%%. Coup violent touche toujours mais inflige des dégâts normaux s'il ne surprend pas l'ennemi.
items.weapon.melee.warhammer.ability_name=coup dur
items.weapon.melee.warhammer.desc=Peu de créatures peuvent résister au coup écrasant de cette imposante masse de plomb et d'acier, mais il faut une grande force pour l'utiliser efficacement.
items.weapon.melee.warhammer.name=marteau de guerre
items.weapon.melee.warhammer.stats_desc=Il s'agit d'une arme assez précise.
items.weapon.melee.warhammer.typical_ability_desc=Le duelliste peut effectuer un _coup violent_ avec son marteau de guerre. Cette attaque concentrée inflige généralement des _%1$d-%2$d dégâts_ si elle a surpris l'ennemi, et l'étourdit pendant 5 tours, ce qui réduit sa précision et son évasion de 50%%. Coup violent touche toujours mais inflige des dégâts normaux s'il ne surprend pas l'ennemi.
items.weapon.melee.warscythe.ability_desc=Le duelliste peut _récolter_ un ennemi avec une faux de guerre. Cette attaque dévastatrice est garantie de toucher et inflige _%d dégâts_. Ces dégâts sont appliqués sous forme de saignement si la cible n'est pas immunisée.
items.weapon.melee.warscythe.ability_name=récolte
items.weapon.melee.warscythe.desc=Ce grand outil peu maniable a été renforcé afin qu'il soit plus efficace pour couper les ennemis que les récoltes.
items.weapon.melee.warscythe.name=faux de guerre
items.weapon.melee.warscythe.stats_desc=Il s'agit d'une arme assez imprécise.
items.weapon.melee.warscythe.typical_ability_desc=Le duelliste peut _récolter_ un ennemi avec une faux de guerre. Cette attaque dévastatrice est garantie de toucher et inflige généralement _%d dégâts_. Ces dégâts sont appliqués sous forme de saignement si la cible n'est pas immunisée.
items.weapon.melee.whip.ability_desc=La duelliste peut _fouetter_ tous les ennemis autour d'elle avec un fouet. Cette capacité inflige _%1$d-%2$d dégâts_, attaque tous les ennemis à portée d'attaque et est garantie de toucher.
items.weapon.melee.whip.ability_name=cils
items.weapon.melee.whip.desc=La corde barbelée à l'extrémité de cette arme inflige de faibles dégâts, mais sa portée est incomparable.
items.weapon.melee.whip.name=fouet
items.weapon.melee.whip.stats_desc=Cette arme a une portée considérable.
items.weapon.melee.whip.typical_ability_desc=Le duelliste peut _fouetter_ tous les ennemis autour de lui avec un fouet. Cette capacité inflige généralement des _%1$d-%2$d dégâts_, attaque tous les ennemis à portée d'attaque et est garantie de toucher.
items.weapon.melee.wornshortsword.ability_desc=Le duelliste peut _sauver_ un ennemi à l'aide d'une épée courte usée. Cela inflige _%1$d-%2$d dégâts_ et est garanti de toucher. Si la fente tue un ennemi, elle est instantanée et le duelliste peut l'utiliser à nouveau dans les 5 tours gratuitement.
items.weapon.melee.wornshortsword.ability_name=cliver
items.weapon.melee.wornshortsword.desc=Une épée assez courte, usée par un usage intensif. Elle est à la fois plus faible et un peu plus légère qu'une épée courte en meilleur état.
items.weapon.melee.wornshortsword.discover_hint=L'un des héros commence avec cet objet.
items.weapon.melee.wornshortsword.name=épée courte usée
items.weapon.melee.wornshortsword.typical_ability_desc=Le duelliste peut _fendre_ un ennemi avec une épée courte usée. Il inflige généralement _%1$d-%2$d_ de dégâts et est sûr de toucher. Si la fente tue un ennemi, elle est instantanée et le duelliste peut l'utiliser à nouveau dans les 5 tours gratuitement.
items.weapon.missiles.bolas.desc=Ces armes à distance inhabituelles ne font pas beaucoup de dégâts, mais ralentissent très bien leur cible.
items.weapon.missiles.bolas.name=bolas
items.weapon.missiles.bolas.stats_desc=Cette arme inflige une infirmité à la cible.
items.weapon.missiles.boomerang.desc=Lancé à l'ennemi, ce missile en bois plat et incurvé revient dans les mains de son lanceur.
items.weapon.missiles.boomerang.durability=Grâce à sa construction solide, ce boomerang ne se cassera pas à l'usage.
items.weapon.missiles.boomerang.name=boomerang
items.weapon.missiles.darts.adrenalinedart.desc=Ces fléchettes sont dotées d'un composé à base de chardon vert qui augmente la vitesse de déplacement et d'attaque des alliés, ou réduit brièvement la vitesse de déplacement des ennemis. La fléchette elle-même est toujours nocive pour les ennemis, mais ne blesse pas les alliés.
items.weapon.missiles.darts.adrenalinedart.name=fléchette d'adrénaline
items.weapon.missiles.darts.blindingdart.desc=Ces fléchettes sont dotées d'un composé à base d'herbe aveugle qui aveugle la cible pendant une courte période. Elles ne désorientent cependant pas l'ennemi, qui saura toujours où il vous a vu pour la dernière fois.
items.weapon.missiles.darts.blindingdart.name=fléchette aveuglante
items.weapon.missiles.darts.chillingdart.desc=Ces fléchettes sont dotées d'un composé à base de calotte glaciaire qui refroidit considérablement la cible.
items.weapon.missiles.darts.chillingdart.name=fléchette réfrigérante
items.weapon.missiles.darts.cleansingdart.desc=Ces fléchettes sont dotées d'un composé à base de mageroyal qui immunise temporairement les alliés contre tous les effets négatifs, ou qui nettoie les effets positifs des ennemis. Les ennemis peuvent même oublier brièvement qu'ils vous attaquent ou vous fuient. La fléchette elle-même est toujours nocive pour les ennemis, mais ne blesse pas les alliés.
items.weapon.missiles.darts.cleansingdart.name=fléchette de nettoyage
items.weapon.missiles.darts.dart.ac_tip=TIP
items.weapon.missiles.darts.dart.desc=Ces simples hampes de bois hérissées de pointes sont lestées pour voler droit et piquer leur proie d'un simple mouvement du poignet. Ils peuvent être garnis de graines pour bénéficier d'effets bonus lorsqu'ils sont lancés.
items.weapon.missiles.darts.dart.name=fléchette
items.weapon.missiles.darts.dart.prompt=Sélectionner une semence
items.weapon.missiles.darts.dart.tip_all=pointer les fléchettes %1$d avec les graines %2$d
items.weapon.missiles.darts.dart.tip_cancel=annuler
items.weapon.missiles.darts.dart.tip_desc=Une graine peut être combinée avec une ou deux fléchettes pour les faire basculer. Chaque type de graine produit son propre type de fléchette à pointe, avec un effet unique à usage unique.\n\nL'utilisation de ces graines pour faire basculer une fléchette produira une _%s._
items.weapon.missiles.darts.dart.tip_one=pointe 1 dard avec 1 graine
items.weapon.missiles.darts.dart.tip_title=Fléchettes à pointe
items.weapon.missiles.darts.dart.tip_two=pointe 2 fléchettes avec 1 graine
items.weapon.missiles.darts.dart.unlimited_uses=Grâce à leur construction simple, les fléchettes sont effectivement éternelles.
items.weapon.missiles.darts.displacingdart.desc=Ces fléchettes sont dotées d'un composé à base de feuille de fumée qui téléporte la cible à une courte distance.
items.weapon.missiles.darts.displacingdart.name=fléchette de déplacement
items.weapon.missiles.darts.healingdart.desc=Ces fléchettes sont dotées d'un composé à base d'herbe de soleil qui confère à la cible une poussée de guérison. La fléchette elle-même est toujours nocive pour les ennemis, mais ne blesse pas les alliés.
items.weapon.missiles.darts.healingdart.name=fléchette de guérison
items.weapon.missiles.darts.holydart.desc=Ces fléchettes sont dotées d'un composé à base de fleurs d'étoiles qui infuse de l'énergie sacrée dans leur cible. Les alliés et les ennemis ordinaires seront bénis, mais les morts-vivants et les ennemis démoniaques subiront de lourds dégâts. La fléchette elle-même est toujours nocive pour les ennemis, mais pas pour les alliés.
items.weapon.missiles.darts.holydart.name=fléchette sacrée
items.weapon.missiles.darts.incendiarydart.desc=Ces fléchettes sont dotées d'un composé à base de fleurs de feu qui s'enflamme à l'impact.
items.weapon.missiles.darts.incendiarydart.name=fléchette incendiaire
items.weapon.missiles.darts.paralyticdart.desc=Ces fléchettes sont munies d'un composé à base de racine de terre qui paralyse la cible pendant une courte période.
items.weapon.missiles.darts.paralyticdart.name=fléchette paralytique
items.weapon.missiles.darts.poisondart.desc=Ces fléchettes sont munies d'un composé à base de mousse de chagrin qui empoisonne la cible.
items.weapon.missiles.darts.poisondart.name=fléchette empoisonnée
items.weapon.missiles.darts.rotdart.desc=Ces fléchettes sont dotées d'un composé acide à base de mûres, qui ronge agressivement tout ce qui entre en contact avec la fléchette. Les ennemis puissants résisteront à la plupart des effets, mais la corrosion est suffisamment forte pour tuer facilement la plupart des ennemis standard. Ces fléchettes durent plus longtemps que les autres, mais leur durabilité ne peut pas être augmentée.
items.weapon.missiles.darts.rotdart.discover_hint=Vous pouvez créer cet objet en utilisant une graine provenant d'une quête spécifique.
items.weapon.missiles.darts.rotdart.name=fléchette rotative
items.weapon.missiles.darts.shockingdart.desc=Ces fléchettes sont dotées d'un composé à base de stormvine qui inflige un choc violent à la cible.
items.weapon.missiles.darts.shockingdart.name=fléchette choquante
items.weapon.missiles.darts.tippeddart.about_to_break=La pointe de votre fléchette est sur le point d'expirer.
items.weapon.missiles.darts.tippeddart.ac_clean=NETTETÉ
items.weapon.missiles.darts.tippeddart.cancel=annuler
items.weapon.missiles.darts.tippeddart.clean_all=nettoyer tout
items.weapon.missiles.darts.tippeddart.clean_desc=Cette action supprimera le basculement des graines sur vos fléchettes, qui redeviendront des fléchettes normales.
items.weapon.missiles.darts.tippeddart.clean_one=nettoyer un
items.weapon.missiles.darts.tippeddart.clean_title=Fléchettes propres
items.weapon.missiles.darts.tippeddart.discover_hint=Vous pouvez acheter cet objet dans un magasin ou le créer à l'aide d'une graine.
items.weapon.missiles.darts.tippeddart.has_broken=La pointe de votre fléchette a expiré.
items.weapon.missiles.darts.tippeddart.unlimited_uses=mais ils sont d'une telle qualité qu'ils dureront effectivement éternellement
items.weapon.missiles.darts.tippeddart.uses_left=Cette pile de fléchettes a _%d/%d_ utilisations restantes avant que l'une des pointes ne s'use.
items.weapon.missiles.fishingspear.desc=De minuscules lances qui, bien que conçues pour la pêche, peuvent être utilisées comme armes improvisées.
items.weapon.missiles.fishingspear.name=lance de pêche
items.weapon.missiles.forcecube.desc=Ces cubes magiques de forme étrange sont suffisamment petits pour être tenus dans la main, mais ils sont incroyablement lourds.
items.weapon.missiles.forcecube.name=cube de force
items.weapon.missiles.forcecube.ondeath=Tu t'es tué avec ton propre cube de force...
