items.weapon.missiles.throwinghammer.stats_desc=Cette arme ne colle pas aux ennemis et peut être récupérée instantanément.
items.weapon.missiles.throwingknife.desc=Ces couteaux légers sont équilibrés de manière à décrire un arc dans l'air et à atteindre leur cible.
items.weapon.missiles.throwingknife.discover_hint=L'un des héros commence avec cet objet.
items.weapon.missiles.throwingknife.name=couteau de lancer
items.weapon.missiles.throwingknife.stats_desc=Cette arme est plus puissante contre les ennemis inconscients.
items.weapon.missiles.throwingspear.desc=Ces lances légères ont un cadre fin et sont conçues pour être lancées et non poussées.
items.weapon.missiles.throwingspear.name=lance de jet
items.weapon.missiles.throwingspike.desc=Ces tiges métalliques pointues et résistantes sont destinées à être lancées sur des ennemis éloignés.
items.weapon.missiles.throwingspike.discover_hint=L'un des héros commence avec cet objet.
items.weapon.missiles.throwingspike.name=pointe de lancement
items.weapon.missiles.throwingstone.desc=Ces pierres sont poncées pour pouvoir être lancées avec plus de puissance qu'une pierre ordinaire.
