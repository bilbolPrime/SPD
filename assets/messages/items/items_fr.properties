items.equipableitem.unequip_cursed=Vous ne pouvez pas retirer un objet maudit !
items.food.berry.desc=Cette petite baie a été trouvée par la Chasseuse dans la végétation du donjon. Elle peut être mangée rapidement, redonne un peu de satiété et peut contenir une graine utilisable !
