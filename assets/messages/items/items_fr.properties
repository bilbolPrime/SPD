items.amulet.ac_end=FIN DU JEU
items.amulet.ascent_desc=Vous commencez à sentir le grand et terrible pouvoir de Yog-Dzewa rayonner de l'amulette. Remonter dans le donjon en tant que mortel pourrait s'avérer plus difficile que vous ne le pensiez !\n\nSi vous continuez à monter avec l'amulette, le donjon deviendra plus dangereux, les téléportations entre les étages seront désactivées et vous ne pourrez gagner le jeu qu'en battant les ennemis lors de votre ascension dans le donjon !\n\nVous pouvez laisser l'amulette ici pour l'instant si vous voulez monter sans commencer ce défi, ou activer l'amulette avant de monter pour terminer le jeu normalement.
items.amulet.ascent_no=Arrêter pour l'instant
items.amulet.ascent_title=Ascension
items.amulet.ascent_yes=Poursuivre !
items.amulet.desc=L'amulette de Yendor est le plus puissant artefact connu des humains et des nains. Ses cristaux scintillants renferment un pouvoir incroyable et merveilleux.
items.amulet.desc_ascent=Les origines de l'amulette sont inconnues, mais il est clair qu'elle a été fortement influencée par le pouvoir de Yog-Dzewa. Le donjon semble se plier à la volonté de Yog au fur et à mesure que vous le traversez, rendant les ennemis beaucoup plus nombreux et puissants ! De plus, vous ne pouvez plus activer ou vous débarrasser de l'amulette, comme si elle était maudite.
items.amulet.desc_origins=Les origines de l'amulette sont inconnues. L'histoire raconte que le roi des nains s'est vanté d'avoir découvert l'artefact peu avant que la civilisation naine ne coupe tout contact. Comment l'a-t-il trouvé ? Comment Yog-Dzewa le lui a-t-il pris ? Des questions pour une autre fois peut-être, tout ce qui compte maintenant, c'est que l'amulette est à vous !
items.amulet.discover_hint=Vous trouverez cet objet au fond du donjon...
items.amulet.name=amulette de yendor
items.ankh.ac_bless=bénir
items.ankh.bless=Vous bénissez l'ankh avec de l'eau magique.
items.ankh.desc=Cet ancien symbole d'immortalité permet de revenir à la vie après la mort. À la résurrection, tous les objets qui ne sont pas équipés sont perdus.
items.ankh.desc_blessed=Cet ancien symbole d'immortalité confère la capacité de revenir à la vie après la mort. L'Ankh a été béni et est maintenant beaucoup plus fort. L'Ankh se sacrifiera pour vous sauver dans un moment de péril mortel.
items.ankh.discover_hint=Vous pouvez acheter cet article dans un magasin.
items.ankh.name=ankh
items.arcaneresin.ac_apply=POSTULER
items.arcaneresin.apply=Tu enduis ta baguette de résine, ce qui augmente sa puissance !
items.arcaneresin.desc=Cette fine poudre scintille entre les nuances de violet et de blanc. Elle peut agir comme un amplificateur des énergies magiques, augmentant le niveau des baguettes lorsqu'elle leur est appliquée !\n\nL'amélioration d'une baguette coûte 1, 2 ou 3 résines, selon le niveau initial de la baguette. La résine peut augmenter le niveau des baguettes jusqu'à un maximum de +3.\n\nLes améliorations en résine sont toutefois _compensées par d'autres sources d'amélioration_ (comme les parchemins d'amélioration), et ne s'appliquent pas lors de l'imprégnation d'une baguette dans le bâton de mage.
items.arcaneresin.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.arcaneresin.level_too_high=Cette baguette est trop puissante pour que la résine s'améliore.
items.arcaneresin.name=résine arcane
items.arcaneresin.not_enough=Vous n'avez pas assez de résine pour cela !
items.arcaneresin.prompt=Sélectionner une baguette
