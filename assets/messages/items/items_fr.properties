items.weapon.weaponeffects.weaponeffect.curse.name=%s maléfique
items.weapon.weaponeffects.weaponeffect.curse.desc=Cette baguette est _maléfique_. Sa magie a _20%_ de chances d'affaiblir la cible, réduisant ses dégâts de _5%_ pendant _10 tours_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Malédiction !

