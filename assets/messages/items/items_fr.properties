items.weapon.melee.gloves.ability_desc=Le duelliste peut effectuer une _combinaison de coups_ avec ses gants cloutés. Cette attaque est garantie de toucher et inflige _+%d dommages_ pour chaque fois que le duelliste a touché avec une attaque de mêlée normale ou une attaque d'arme de jet. Ne pas toucher pendant 5 tours réinitialise ce combo.
items.weapon.melee.gloves.ability_name=grève combinée
