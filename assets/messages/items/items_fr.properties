items.artifacts.driedrose$wndghosthero.cant_cursed=Le fantôme ne peut utiliser que du matériel dont vous êtes sûr qu'il n'est pas maudit.
items.artifacts.driedrose$wndghosthero.cant_strength=Le fantôme n'est pas assez fort pour utiliser cela.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Le fantôme n'est peut-être pas assez fort pour l'utiliser.
items.artifacts.driedrose$wndghosthero.cant_unique=Le fantôme ne peut pas utiliser d'objets uniques.
items.artifacts.driedrose$wndghosthero.desc=Le fantôme est faible, mais sa forme est suffisamment solide pour qu'il puisse être équipé d'une arme et d'une armure. Il pourra utiliser ces objets tout comme vous.\n\nLe fantôme peut actuellement équiper des objets nécessitant jusqu'à _%d de force
