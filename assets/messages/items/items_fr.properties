items.artifacts.lloydsbeacon.creatures=L'aura psychique des créatures voisines ne vous permet pas d'utiliser la balise de Lloyd pour le moment.
items.artifacts.lloydsbeacon.desc=La balise de Lloyd est un dispositif magique complexe qui permet à son utilisateur de contrôler la magie de téléportation. La balise peut être utilisée pour retourner à un endroit précis, mais elle peut aussi expulser des rafales de magie de téléportation aléatoire une fois qu'elle a été chargée après avoir été équipée. Cette magie peut être dirigée vers une cible ou vers l'utilisateur lui-même.
items.artifacts.lloydsbeacon.desc_set=Cette balise se trouvait quelque part au niveau %d du Donjon de Pixel.
items.artifacts.lloydsbeacon.levelup=Votre phare devient plus fort !
items.artifacts.lloydsbeacon.name=Phare de Lloyd
items.artifacts.lloydsbeacon.no_charge=Votre balise n'a pas assez d'énergie pour le moment.
items.artifacts.lloydsbeacon.preventing=La forte aura magique de ce lieu vous empêche d'utiliser la balise de Lloyd !
items.artifacts.lloydsbeacon.prompt=Choisissez un endroit où zapper.
items.artifacts.lloydsbeacon.return=La balise Lloyd's a été placée avec succès à l'endroit où vous vous trouvez. Vous pouvez maintenant revenir ici à tout moment.
items.artifacts.lloydsbeacon.tele_fail=La magie de la téléportation échoue.
items.artifacts.masterthievesarmband.ac_steal=VOL
items.artifacts.masterthievesarmband.cursed=Vous ne pouvez pas utiliser un brassard maudit.
items.artifacts.masterthievesarmband.desc=Ce brassard de velours violet porte la marque d'un maître voleur. Il ne vous appartient pas, mais il n'appartenait probablement pas non plus à son dernier utilisateur.
items.artifacts.masterthievesarmband.desc_cursed=Le brassard maudit est attaché à votre poignet et, d'une manière ou d'une autre, votre pochette d'or semble s'alléger peu à peu...
items.artifacts.masterthievesarmband.desc_worn=Au fur et à mesure que vous gagnez de l'expérience, vous sentez le pouvoir s'accumuler dans le brassard que vous portez au poignet. Vous pouvez utiliser ce pouvoir pour voler dans les magasins ou pour détrousser vos ennemis !\n\nVoler les ennemis se fait instantanément, les désoriente brièvement et vous donne une chance de vous emparer de tout le butin qu'ils ont ! Ce pouvoir est plus efficace contre les ennemis inconscients. Voler plusieurs fois le même ennemi ne donne pas plus de chances d'obtenir du butin.
items.artifacts.masterthievesarmband.failed_steal=Vous n'avez rien volé.
items.artifacts.masterthievesarmband.full=Votre brassard est complètement chargé !
items.artifacts.masterthievesarmband.level_up=Ton brassard devient plus fort !
