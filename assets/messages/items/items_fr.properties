items.artifacts.etherealchains.cursed=Vous ne pouvez pas utiliser de chaînes maudites.
items.artifacts.etherealchains.desc=Ces chaînes, à la fois grandes et légères, brillent d'une énergie spirituelle. Elles peuvent être utilisées pour vous attirer vers le terrain ou attirer les ennemis vers vous. La nature éthérée des chaînes leur permet même de traverser les murs !
items.artifacts.etherealchains.desc_cursed=Les chaînes maudites sont bloquées à vos côtés, se balançant constamment, essayant de vous faire trébucher ou de vous lier.
items.artifacts.etherealchains.desc_equipped=Les chaînes s'enroulent autour de vous et siphonnent lentement l'énergie spirituelle de ceux que vous avez vaincus. Chaque charge est un maillon de la chaîne, qui s'étend sur une tuile.
items.artifacts.etherealchains.does_nothing=Cela ne servira à rien.
items.artifacts.etherealchains.inside_wall=Vos chaînes ne peuvent vous tirer qu'à travers les murs, pas à l'intérieur.
items.artifacts.etherealchains.name=chaînes éthérées
items.artifacts.etherealchains.no_charge=Vos chaînes ne sont pas suffisamment chargées.
items.artifacts.etherealchains.nothing_to_grab=Il n'y a rien à saisir.
