items.artifacts.skeletonkey$keywall.desc=Un mur magique temporaire a été placé ici par le passe-partout.
items.artifacts.skeletonkey.ac_insert=INSÉRER
items.artifacts.skeletonkey.crystal_charges=L'ouverture d'une serrure de cristal nécessite 5 charges.
items.artifacts.skeletonkey.cursed=Vous ne pouvez pas utiliser un passe-partout maudit.
items.artifacts.skeletonkey.desc=Une clé d'apparence importante avec une tête en forme de crâne. Ses dents semblent être différentes à chaque fois qu'on les regarde.
items.artifacts.skeletonkey.desc_cursed=La clé maudite semble éviter de s'insérer dans n'importe quelle serrure, et rend même difficile (mais pas impossible) l'utilisation de vos autres clés.
items.artifacts.skeletonkey.desc_worn=Cette clé magique semble gagner en puissance lorsque vous l'utilisez à la place des clés habituelles du donjon. Elle peut être insérée dans presque toutes les serrures du donjon pour les ouvrir ou les fermer, y compris des portes qui n'ont jamais été verrouillées auparavant.\n\nLa clé peut même être utilisée sur un espace vide dans une direction cardinale ou diagonale pour " verrouiller " l'air devant vous, créant ainsi un mur solide de 3 tuiles de large qui dure 10 tours. Le verrouillage repousse les ennemis s'il y a suffisamment d'espace pour le faire.
items.artifacts.skeletonkey.discard=Vous vous débarrassez de vos clés excédentaires.
items.artifacts.skeletonkey.force_lock=La serrure s'est affaiblie sans votre passe-partout. Vous parvenez à l'ouvrir de force.
items.artifacts.skeletonkey.gold_charges=L'ouverture d'une serrure en or nécessite 2 charges.
items.artifacts.skeletonkey.invalid_target=Il n'y a rien à verrouiller ou à déverrouiller.
items.artifacts.skeletonkey.iron_charges=L'ouverture d'une serrure ordinaire nécessite 1 charge.
items.artifacts.skeletonkey.levelup=Votre clé squelette se renforce !
items.artifacts.skeletonkey.lock_charges=Le verrouillage d'une porte nécessite 2 charges.
items.artifacts.skeletonkey.lock_no_space=On ne peut pas enfermer un personnage dans une porte !
items.artifacts.skeletonkey.locked_with_key=Cette porte était verrouillée par votre passe-partout.
items.artifacts.skeletonkey.name=passe-partout
items.artifacts.skeletonkey.prompt=Choisir une cible
items.artifacts.skeletonkey.wall_charges=La création d'un mur temporaire nécessite 2 charges.
items.artifacts.skeletonkey.wont_open=La clé refuse d'entrer dans cette serrure pour une raison quelconque.
items.artifacts.talismanofforesight$foresight.desc=Vous vous sentez très nerveux, comme s'il y avait un danger invisible à proximité.
items.artifacts.talismanofforesight$foresight.name=prévoyance
items.artifacts.talismanofforesight$foresight.uneasy=Vous vous sentez mal à l'aise.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Une pierre lisse avec d'étranges gravures. On a l'impression qu'elle surveille tout ce qui se passe autour de nous, qu'elle est à l'affût de tout ce qui est caché.
items.artifacts.talismanofforesight.desc_cursed=Le talisman maudit vous fixe intensément, endormant vos sens.
items.artifacts.talismanofforesight.desc_worn=Lorsque vous tenez le talisman, vous avez l'impression que vos sens sont exacerbés. Le talisman se charge lentement au fur et à mesure que le temps passe et que vous découvrez des portes ou des pièges cachés.\n\nLe talisman peut dépenser sa charge pour "scruter" en forme de cône, ce qui révèle toutes les tuiles et tous les secrets de la zone scannée, et vous permet de voir les ennemis et les objets pendant un court moment.
items.artifacts.talismanofforesight.full_charge=Votre Talisman est complètement chargé !
items.artifacts.talismanofforesight.levelup=Votre Talisman se renforce !
items.artifacts.talismanofforesight.low_charge=Le talisman nécessite une charge d'au moins 5 % pour être utilisé.
items.artifacts.talismanofforesight.name=talisman de prévoyance
items.artifacts.talismanofforesight.prompt=Choisissez un emplacement pour la numérisation.
items.artifacts.timekeepershourglass$sandbag.desc=Ce petit sac de sable fin devrait parfaitement convenir à votre sablier.\n\nIl semble étrange que le commerçant ait cet objet spécifique au moment où vous en avez besoin...
items.artifacts.timekeepershourglass$sandbag.levelup=Vous ajoutez le sable à votre sablier.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Votre sablier est rempli de sable magique !
items.artifacts.timekeepershourglass$sandbag.name=sac de sable magique
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Vous n'avez pas de sablier pour y déposer ce sable.
items.artifacts.timekeepershourglass$timefreeze.desc=Le temps se fige autour de vous, vous permettant d'effectuer des actions instantanément. L'effet dure jusqu'à ce qu'il soit annulé ou que votre sablier soit déchargé. L'attaque ou l'utilisation de la magie interrompt également cet effet.\n\nTours jusqu'à l'utilisation de la charge : %s.
items.artifacts.timekeepershourglass$timefreeze.name=Gel du temps
items.artifacts.timekeepershourglass.ac_activate=ACTIVER
items.artifacts.timekeepershourglass.cursed=Vous ne pouvez pas utiliser un sablier maudit.
items.artifacts.timekeepershourglass.deactivate=Vous désactivez le gel du temps.
items.artifacts.timekeepershourglass.desc=Ce grand sablier orné ne paie pas de mine, mais vous sentez une grande puissance dans son cadre finement sculpté. En faisant tourner le sablier et en regardant le sable se déverser, vous sentez sa magie vous attirer, car l'utilisation de cette magie vous permettrait sans doute de contrôler le temps.
items.artifacts.timekeepershourglass.desc_cursed=Le sablier maudit est bloqué à vos côtés, vous pouvez le sentir essayer de manipuler votre flux de temps.
items.artifacts.timekeepershourglass.desc_hint=Le sablier semble avoir perdu du sable, si seulement vous pouviez en trouver...
items.artifacts.timekeepershourglass.freeze=Geler le temps autour de moi
items.artifacts.timekeepershourglass.name=sablier du chronométreur
items.artifacts.timekeepershourglass.no_charge=Votre sablier ne s'est pas encore suffisamment rechargé pour être utilisable.
items.artifacts.timekeepershourglass.onfreeze=Tout ce qui vous entoure se fige soudainement.
items.artifacts.timekeepershourglass.onstasis=Le monde semble changer autour de vous en un instant.
items.artifacts.timekeepershourglass.prompt=Comment voulez-vous utiliser la magie du sablier ?\n\nEn stase, le temps s'écoule normalement alors que vous êtes gelé et complètement invulnérable. Cette magie consomme jusqu'à 2 charges à la fois.\n\nLorsque le temps est gelé, vous pouvez vous déplacer comme si vos actions ne prenaient pas de temps. Ceci peut être désactivé à tout moment en utilisant le sablier ou en attaquant.
items.artifacts.timekeepershourglass.stasis=Me mettre en stase
items.artifacts.unstablespellbook.ac_add=ADD
items.artifacts.unstablespellbook.ac_read=LIRE
items.artifacts.unstablespellbook.blinded=Vous ne pouvez pas lire dans le livre lorsque vous êtes aveuglé.
items.artifacts.unstablespellbook.cursed=Vous ne pouvez pas lire dans un livre de sorts maudit.
items.artifacts.unstablespellbook.desc=Ce tome est étonnamment en bon état compte tenu de son âge. Il pétille et crépite lorsque l'on tourne les pages, chargé d'une énergie instable. Si vous lisez dans ce livre, il est impossible de savoir quel sort vous pourriez lancer.
items.artifacts.unstablespellbook.desc_cursed=Le livre maudit s'est lié à vous et vous empêche d'utiliser la plupart des parchemins.
items.artifacts.unstablespellbook.desc_empowered=Les parchemins que tu as ajoutés au livre brillent de mille feux. Vous pourrez choisir la version exotique des effets de ces parchemins, mais au prix d'un supplément.
items.artifacts.unstablespellbook.desc_index=Le livre est incomplet. Son index renvoie actuellement aux pages blanches suivantes :
items.artifacts.unstablespellbook.infuse_scroll=Vous insufflez l'énergie du parchemin dans le livre.
items.artifacts.unstablespellbook.name=livre de sorts instable
items.artifacts.unstablespellbook.no_charge=Votre livre de sorts n'a plus d'énergie pour le moment.
items.artifacts.unstablespellbook.prompt=Sélectionner un défilement
items.artifacts.unstablespellbook.read_empowered=Le parchemin que tu as ajouté au livre de sorts déborde d'énergie. Tu peux canaliser soit la version normale, soit la version exotique de l'effet de ce parchemin.\n\nLe choix de la variante exotique coûte 2 charges au lieu de 1.
items.artifacts.unstablespellbook.unable_scroll=Vous ne pouvez pas ajouter ce parchemin au livre.
items.artifacts.unstablespellbook.unknown_scroll=Vous ne savez pas encore de quel type de rouleau il s'agit.
items.bags.bag.discover_hint=Vous pouvez acheter cet article dans un magasin.
items.bags.bag.name=sac à dos
items.bags.magicalholster.desc=Cet étui mince est fabriqué à partir d'une peau d'animal exotique et possède une puissante magie qui lui permet de stocker un grand nombre d'armes à distance.\n\nIl vous suffit de plonger la main dans l'étui pour attraper l'objet que vous cherchiez.\n\nGrâce à la magie de l'étui, les baguettes se rechargent un peu plus vite et les armes de jet durent un peu plus longtemps à l'intérieur.
items.bags.magicalholster.name=étui magique
items.bags.potionbandolier.desc=Ce bandolier épais se porte autour de la poitrine comme une ceinture. Il comporte de nombreuses sangles isolées pour contenir des fioles de potion, votre gourde ou des fioles de métal liquide.\n\nÀ l'intérieur du bandolier, vos potions sont protégées du froid.
items.bags.potionbandolier.name=bandolière à potions
items.bags.scrollholder.desc=Ce conteneur tubulaire a l'air de contenir les outils et les cartes d'un astronome, mais vos parchemins y trouveront tout aussi bien leur place. Il y a même quelques compartiments latéraux qui peuvent accueillir des cristaux de sorts, des stylets arcaniques et de la résine arcanique.\n\nLe support n'a pas l'air très inflammable, vos parchemins devraient donc être à l'abri du feu à l'intérieur.
items.bags.scrollholder.name=porte-rouleau
items.bags.velvetpouch.desc=Cette petite pochette de velours peut contenir de nombreux petits objets, tels que des graines, des pierres runiques et des ingrédients d'alchimie.
items.bags.velvetpouch.discover_hint=L'un des héros commence avec cet objet.
items.bags.velvetpouch.name=pochette en velours
items.bombs.arcanebomb.desc=Cette bombe a été imprégnée de propriétés arcaniques. Elle explose en une puissante explosion similaire à l'attaque de Goo, infligeant _%1$d-%2$d dégâts magiques_ à tout ce qui se trouve dans un rayon de 2 carreaux.
items.bombs.arcanebomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.arcanebomb.name=bombe arcanique
items.bombs.bomb$doublebomb.desc=Une pile de deux grosses bombes à poudre noire, on dirait que l'une d'entre elles est gratuite !
items.bombs.bomb$doublebomb.name=deux bombes
items.bombs.bomb.ac_lightthrow=LIGHT & THROW
items.bombs.bomb.desc=Une bombe à poudre noire assez lourde. L'explosion de cette bombe inflige _%1$d-%2$d des dégâts à tout ce qui lui est adjacent, et détruit certains terrains ou objets adjacents.
items.bombs.bomb.desc_burning=La mèche de la bombe se consume, gardez vos distances ou éteignez-la !
items.bombs.bomb.desc_fuse=Il semble que la mèche mette quelques tours à se consumer une fois allumée.
items.bombs.bomb.name=bombe
items.bombs.bomb.ondeath=L'explosion vous tue...
items.bombs.bomb.rankings_desc=Tué par une explosion
items.bombs.bomb.snuff_fuse=Vous éteignez rapidement la mèche de la bombe.
items.bombs.firebomb.desc=Cette bombe a été modifiée pour exploser dans une zone plus large, infligeant _%1$d-%2$d_ de dégâts et propageant des flammes soutenues dans un rayon de 2 tuiles.
items.bombs.firebomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.firebomb.name=bombe incendiaire
items.bombs.flashbangbomb.desc=Cette bombe personnalisée explosera dans un souffle de lumière, de son et d'électricité. Tout ce qui se trouve dans un rayon de 2 tuiles subit _%1$d-%2$d_ dégâts de l'explosion, 25%% dégâts supplémentaires de l'électricité et est étourdi pendant 10 tours.
items.bombs.flashbangbomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.flashbangbomb.name=grenade assourdissante
items.bombs.frostbomb.desc=Cette bombe a été modifiée pour exploser dans une zone plus large, infligeant _%1$d-%2$d_ de dégâts et répandant une rafale d'air glacé dans un rayon de 2 tuiles.
items.bombs.frostbomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.frostbomb.name=bombe de givre
items.bombs.holybomb.desc=Cette bombe a été modifiée pour projeter une lumière sacrée dans une zone plus large lorsqu'elle explose. Tout ce qui se trouve dans un rayon de 2 tuiles subit _%1$d-%2$d des dégâts de l'explosion, et les ennemis morts-vivants ou démoniaques subissent 50%% de dégâts supplémentaires à cause de la lumière sacrée.
items.bombs.holybomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.holybomb.name=bombe sacrée
items.bombs.noisemaker.desc=Cette bombe personnalisée fait du bruit de façon répétée lorsque sa mèche est épuisée. Lorsque quelque chose touche la bombe, elle explose et inflige des _%1$d-%2$d dommages_ à tout ce qui se trouve dans un rayon de 2 tuiles !
items.bombs.noisemaker.desc_burning=Le bruiteur fait tic-tac, il explosera quand quelque chose s'approchera !
items.bombs.noisemaker.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.noisemaker.name=bruiteur
items.bombs.regrowthbomb.desc=Au lieu d'exploser, cette bombe personnalisée projette un liquide vivifiant partout dans un rayon de 3 tuiles. L'herbe et les plantes poussent rapidement dans la zone touchée par l'explosion. Vous et vos alliés pris dans l'explosion serez soignés comme s'ils avaient bu une potion de soins.
items.bombs.regrowthbomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.regrowthbomb.name=bombe de repousse
items.bombs.shrapnelbomb.desc=Cette bombe a été modifiée avec des morceaux de métal de DM-300, qui se fragmentent et volent partout lorsqu'elle explose, infligeant des _%1$d-%2$d dégâts_ dans un rayon très large autour de la bombe. Il vaut mieux se cacher derrière quelque chose quand on l'utilise...
items.bombs.shrapnelbomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.shrapnelbomb.name=bombe à éclats
items.bombs.smokebomb.desc=Cette bombe a été modifiée pour cracher un épais nuage de gaz en même temps qu'elle explose. Elle inflige _%1$d-%2$d dégâts_ et répand un brouillard enveloppant dans un rayon de 2 tuiles.
items.bombs.smokebomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.smokebomb.name=bombe fumigène
items.bombs.woollybomb.desc=Cette bombe personnalisée crée un vaste champ de moutons magiques après avoir explosé. L'explosion inflige _%1$d-%2$d dommages_ à tout ce qui se trouve dans un rayon de 2 tuiles. Les moutons bloquent les mouvements et persistent très longtemps ! Les moutons ne dureront pas aussi longtemps en présence d'ennemis puissants, et peuvent être dissipés manuellement plus tôt en interagissant avec eux.
items.bombs.woollybomb.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.bombs.woollybomb.name=bombe laineuse
items.brokenseal$warriorshield.desc_active=Le sceau brisé du guerrier l'aide actuellement à persévérer, en lui accordant un bouclier en plus de ses points de vie. Il y a un temps de recharge après le déclenchement initial du bouclier avant qu'il ne puisse être utilisé à nouveau.\n\nCe bouclier ne se dégrade pas avec le temps, mais il s'éteint si aucun ennemi ne se trouve à proximité pendant quelques tours. À la fin du bouclier, tout bouclier non utilisé réduira le temps de recharge, jusqu'à un maximum de 50%%.\n\nBouclier restant : %1$d.\n\nTemps de recharge actuel : %2$d.
items.brokenseal$warriorshield.desc_cooldown=Le guerrier a récemment gagné un bouclier grâce à son sceau brisé, et doit attendre de pouvoir bénéficier à nouveau de son effet de bouclier.\n\nTours restants : %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Le temps de recharge du bouclier du Guerrier est actuellement négatif, ce qui signifie que lorsque son bouclier s'active, le temps de recharge est inférieur aux 150 tours habituels. Le temps de recharge du bouclier peut être réduit jusqu'à -150 tours, ce qui signifie qu'il sera immédiatement disponible une fois activé.\n\nTemps de recharge actuel : %d.
items.brokenseal$warriorshield.name=Bouclier du guerrier
items.brokenseal.ac_affix=AFFIX
items.brokenseal.affix=Vous apposez le sceau sur votre armure !
items.brokenseal.choose_desc=Cette armure et le sceau brisé portent tous deux un glyphe. Choisissez le glyphe à conserver.\n\nGlyphe de l'armure : %1$s\nGlyphe du sceau brisé : %2$s\n\nNotez que si vous choisissez le glyphe qui est actuellement sur l'armure, le sceau ne pourra pas le transférer plus tard.
items.brokenseal.choose_title=Choisir un glyphe
items.brokenseal.cursed_armor=Le sceau ne s'applique pas aux armures maudites.
items.brokenseal.desc=Un sceau de cire, apposé sur une armure comme symbole de bravoure. Une rune de protection décolorée est gravée en son centre, et il est fendu en deux en son milieu.\n\nSouvenir de son foyer, le sceau aide le guerrier à persévérer. Lorsqu'il porte le sceau, le guerrier bénéficie instantanément d'un bouclier lorsqu'il est sur le point d'être endommagé à la moitié de sa santé ou moins.\n\nLe sceau peut être _fixé à l'armure_ et déplacé d'une armure à l'autre. Il peut porter une seule amélioration, à condition que cette amélioration ait été appliquée à l'armure pendant que le sceau y était attaché.
items.brokenseal.discover_hint=L'un des héros commence avec cet objet.
items.brokenseal.inscribed=Le sceau porte l'inscription _%s._
items.brokenseal.name=rupture de scellé
items.brokenseal.prompt=Sélectionner une armure
items.brokenseal.unknown_armor=Vous devez d'abord déterminer si cette armure est maudite ou non.
