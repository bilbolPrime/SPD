items.weapon.melee.scimitar.typical_ability_desc=Le duelliste peut effectuer une _danse de l'épée_ avec un cimeterre. Cette posture ne prend pas de temps à activer et accorde au duelliste +60%% de vitesse d'attaque et +50%% de précision pendant _%d tours
