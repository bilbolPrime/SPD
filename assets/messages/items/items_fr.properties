items.armor.armor.seal_transfer=Le sceau brisé du guerrier doit être apposé sur l'armure qu'il porte actuellement pour qu'il puisse en bénéficier. Souhaitez-vous détacher automatiquement le sceau de l'armure que vous retirez et l'apposer sur l'armure que vous équipez ?
