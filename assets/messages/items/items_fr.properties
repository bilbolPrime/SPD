items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Vous venez de lancer un shuriken instantanément et devez attendre avant de le refaire. Les shurikens peuvent toujours être lancés, mais à la vitesse normale de l'arme.\n\nTours restants : %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Refroidissement du Shuriken
items.weapon.missiles.shuriken.desc=Ces étoiles métalliques aux lames tranchantes infligent de lourds dégâts. Elles peuvent être lancées à une cadence très élevée.
items.weapon.missiles.shuriken.name=shuriken
items.weapon.missiles.shuriken.stats_desc=Les shurikens peuvent être lancés instantanément avec un temps de recharge de 20 tours.
items.weapon.missiles.throwingclub.desc=Une arme de jet assez simple mais durable, essentiellement une grosse pierre attachée à un bâton.
items.weapon.missiles.throwingclub.name=club de lancer
items.weapon.missiles.throwingclub.stats_desc=Cette arme ne colle pas aux ennemis et peut être récupérée instantanément.
items.weapon.missiles.throwinghammer.desc=Ces lourds marteaux sont conçus pour être lancés sur un ennemi. Leur construction lisse entièrement métallique leur confère une grande longévité.
