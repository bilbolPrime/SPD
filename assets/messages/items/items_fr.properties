items.weapon.melee.spear.ability_desc=Le duelliste peut utiliser la pointe de sa lance pour _pique_ un ennemi à portée mais non adjacent. Cela inflige _%1$d-%2$d dégâts_, fait reculer l'ennemi et est garanti de toucher.
