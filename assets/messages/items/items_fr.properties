items.armor.glyphs.viscosity$defereddamage.ondeath=Les dommages différés vous ont tué...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Tué par des dommages différés
items.armor.glyphs.viscosity.deferred=différé %d
items.armor.glyphs.viscosity.desc=Ce glyphe est capable d'emmagasiner les dégâts infligés au porteur, les lui infligeant lentement plutôt que d'un seul coup.
items.armor.glyphs.viscosity.name=%s de la viscosité
items.armor.huntressarmor.desc=Lorsqu'elle porte cette cape, la chasseresse peut exécuter une capacité spéciale.
items.armor.huntressarmor.name=cape du héros
items.armor.huntressarmor.no_enemies=Pas d'ennemis en vue
items.armor.leatherarmor.desc=Armure fabriquée à partir de la peau tannée d'un monstre. Elle n'est pas aussi légère qu'une armure en tissu mais offre une meilleure protection.
items.armor.leatherarmor.name=armure en cuir
items.armor.magearmor.desc=Lorsqu'il porte cette magnifique robe, le Mage peut exécuter une capacité spéciale.
items.armor.magearmor.name=robe de héros
items.armor.mailarmor.desc=Les maillons métalliques qui s'emboîtent les uns dans les autres forment une armure résistante mais souple.
items.armor.mailarmor.name=armure de mailles
items.armor.platearmor.desc=D'énormes plaques de métal sont assemblées pour former une combinaison qui offre une protection inégalée à tout aventurier assez fort pour supporter son poids stupéfiant.
items.armor.platearmor.name=armure de plaques
items.armor.roguearmor.desc=Lorsqu'il porte ce vêtement sombre, le voleur peut utiliser une capacité spéciale.
items.armor.roguearmor.name=tenue de héros
items.armor.scalearmor.desc=Les écailles métalliques cousues sur une veste en cuir créent une armure souple mais protectrice.
items.armor.scalearmor.name=armure en écailles
items.armor.warriorarmor.desc=Lorsqu'il porte cette armure lourde, le guerrier peut utiliser une capacité spéciale.
items.armor.warriorarmor.name=le plateau du héros
items.artifacts.alchemiststoolkit.ac_brew=BREW
items.artifacts.alchemiststoolkit.ac_energize=ÉNERGIE
items.artifacts.alchemiststoolkit.cursed=Votre boîte à outils maudite vous empêche d'utiliser l'alchimie !
items.artifacts.alchemiststoolkit.desc=Cette boîte à outils contient un certain nombre de réactifs et d'herbes, ainsi qu'une petite fiole de mélange, permettant de pratiquer l'alchimie en déplacement. La fiole contient ce qui ressemble à des cristaux d'énergie alchimique sous forme liquide.
items.artifacts.alchemiststoolkit.desc_cursed=La boîte à outils maudite s'est attachée à votre côté et refuse de vous laisser utiliser l'alchimie.
items.artifacts.alchemiststoolkit.desc_hint=La boîte à outils équipée génère lentement de l'énergie alchimique à mesure que vous gagnez de l'expérience. Il semblerait que le mélange contenu dans la fiole puisse être amélioré en y ajoutant des cristaux d'énergie.
items.artifacts.alchemiststoolkit.desc_warming=La boîte à outils est actuellement en cours d'échauffement et sera prête à être utilisée dans quelques instants.
items.artifacts.alchemiststoolkit.energize_1=6 énergie : +1 niveau
items.artifacts.alchemiststoolkit.energize_all=%1$d énergie : +%2$d niveaux
items.artifacts.alchemiststoolkit.energize_desc=Tous les 6 cristaux d'énergie donnent à la trousse suffisamment d'énergie pour gagner un niveau, ce qui augmente la vitesse à laquelle la trousse génère de l'énergie au fil du temps et la vitesse à laquelle elle se réchauffe.\n\nQuelle quantité d'énergie souhaitez-vous utiliser ?
items.artifacts.alchemiststoolkit.name=boîte à outils de l'alchimiste
items.artifacts.alchemiststoolkit.need_energy=Vous avez besoin d'au moins 6 énergies pour cela.
items.artifacts.alchemiststoolkit.not_ready=Votre boîte à outils n'a pas fini de chauffer.
items.artifacts.artifact.cannot_wear_two=Vous ne pouvez pas porter deux artefacts identiques.
items.artifacts.artifact.curse_known=Vous sentez qu'une magie malveillante se cache dans l'artefact.
items.artifacts.artifact.equip_cursed=L'artefact se lie douloureusement à vous.
items.artifacts.artifact.need_to_equip=Pour ce faire, vous devez équiper votre artefact.
items.artifacts.artifact.not_cursed=Cet artefact est exempt de magie malveillante.
items.artifacts.capeofthorns$thorns.desc=Votre cape rayonne d'énergie et vous entoure d'un champ de force défensive !\n\nTous les dégâts que vous recevez sont réduits tant que l'effet d'épines est actif. De plus, si l'attaquant se trouve à côté de vous, les dégâts réduits sont déviés vers l'attaquant.\n\nTours d'épines restants : %s.
items.artifacts.capeofthorns$thorns.inert=Votre Cape redevient inerte.
items.artifacts.capeofthorns$thorns.levelup=Votre cap se renforce !
items.artifacts.capeofthorns$thorns.name=épines
items.artifacts.capeofthorns$thorns.radiating=Votre cap commence à rayonner d'énergie, vous vous sentez protégé !
items.artifacts.capeofthorns.desc=Ces feuilles de métal effondrées du DM-300 se sont assemblées pour former une cape rigide. Elle semble emmagasiner une énergie profonde, peut-être possède-t-elle une partie du pouvoir du DM-300 ?
items.artifacts.capeofthorns.desc_active=La cape semble libérer de l'énergie stockée, elle rayonne un pouvoir protecteur.
items.artifacts.capeofthorns.desc_inactive=La cape semble rassurante par son poids sur vos épaules, elle semble gagner de l'énergie grâce aux dégâts que vous subissez.
items.artifacts.capeofthorns.name=cape d'épines
items.artifacts.chaliceofblood.ac_prick=PRICK
items.artifacts.chaliceofblood.desc=Ce calice en argent brillant est curieusement orné de pierres précieuses sur le bord.
items.artifacts.chaliceofblood.desc_1=Lorsque vous tenez le calice, vous vous sentez étrangement obligé de vous piquer sur les gemmes acérées.
items.artifacts.chaliceofblood.desc_2=Une partie de votre sang s'accumule dans le calice, vous sentez subtilement que le calice vous apporte de l'énergie vitale, augmentant ainsi votre régénération naturelle. Vous avez toujours envie de vous couper sur le calice, même si vous savez que cela vous fera mal.
items.artifacts.chaliceofblood.desc_3=Le calice est rempli à ras bord de votre essence de vie. Vous pouvez sentir le calice déverser de l'énergie vitale en vous.
items.artifacts.chaliceofblood.desc_cursed=Le calice maudit s'est lié à votre main et inhibe votre capacité à régénérer la santé.
items.artifacts.chaliceofblood.name=calice de sang
items.artifacts.chaliceofblood.no=Non, j'ai changé d'avis
items.artifacts.chaliceofblood.ondeath=Le Calice aspire l'essence de votre vie...
items.artifacts.chaliceofblood.onprick=Vous vous piquez et votre essence vitale s'écoule dans le calice.
items.artifacts.chaliceofblood.prick_warn=Chaque fois que vous utiliserez le calice, il drainera une plus grande partie de votre énergie vitale, mais améliorera en échange votre régénération naturelle de santé.\n\nActuellement, se piquer inflige _%1$d-%2$d dégâts_, bien que ces dégâts puissent être réduits par _le blocage physique et magique ou la réduction des dégâts_. Sans tenir compte des effets de réduction des dégâts, se piquer a actuellement _%3$s%% chances_ de drainer complètement votre énergie vitale.\n\nÊtes-vous sûr de vouloir offrir plus d'énergie vitale au calice ?
items.artifacts.chaliceofblood.yes=Oui, je sais ce que je fais
items.artifacts.cloakofshadows$cloakstealth.desc=Votre cape d'ombre vous confère l'invisibilité tant qu'elle vous enveloppe. Vous resterez invisible jusqu'à ce qu'elle soit annulée ou qu'elle n'ait plus de charge.\n\nPendant que vous êtes invisible, les ennemis sont incapables de vous attaquer ou de vous suivre. Les attaques physiques et les effets magiques (tels que les parchemins et les baguettes) annulent immédiatement l'invisibilité.\n\nTourne jusqu'à l'utilisation de la charge : %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Votre cape se renforce !
items.artifacts.cloakofshadows$cloakstealth.name=occulté
items.artifacts.cloakofshadows$cloakstealth.no_charge=Votre cape n'a plus d'énergie.
items.artifacts.cloakofshadows.ac_stealth=SANTÉ
items.artifacts.cloakofshadows.cooldown=Votre cape a besoin de %d rounds supplémentaires pour se réénergiser.
items.artifacts.cloakofshadows.cursed=Vous ne pouvez pas utiliser une cape maudite.
items.artifacts.cloakofshadows.desc=Une cape magique d'une valeur inestimable, volée à l'armurerie royale il y a de nombreuses années par le Voyou. Lorsqu'elle est portée, elle peut être utilisée pour devenir complètement invisible pendant une courte période.\n\nPlus la cape est utilisée, plus elle devient forte, permettant au Voleur de devenir invisible plus fréquemment et pour de plus longues durées.
items.artifacts.cloakofshadows.discover_hint=L'un des héros commence avec cet objet.
items.artifacts.cloakofshadows.name=cape d'ombres
items.artifacts.cloakofshadows.no_charge=Votre cape ne s'est pas encore suffisamment rechargée pour être utilisable.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Comment avez-vous survécu à cela ?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=J'aimerais bien en avoir un...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh là là ! Vous êtes encore en vie !
items.artifacts.driedrose$ghosthero.def_verb=esquivé
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Je suis désolé... bonne chance...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finissez-en... sans moi...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Non... Je ne peux pas...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Bonne chance...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Fatigué... pour l'instant...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Je reviendrai...
items.artifacts.driedrose$ghosthero.desc=Une figure éthérée à l'apparence frêle et à la forme humanoïde. Son pouvoir semble lié à la rose que vous possédez.\n\nCe fantôme n'est peut-être pas grand-chose, mais il semble être votre seul véritable ami ici.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Pourquoi cela se produit-il, je pensais que nous avions réussi ?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Comment cette chose peut-elle encore influencer ce monde ?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=J'espère que vous savez ce que vous faites avec cette amulette.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Je suppose que nous n'avons pas encore terminé.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Nous sommes déjà allés si loin, nous pouvons en finir !
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Encore un peu, et nous pourrons sortir d'ici !
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Aucun humain ou nain n'est venu ici depuis très longtemps.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Qu'est-ce qui pousserait les nains à abandonner une mine d'or ?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Il est dommage que tout l'or ici ne serve à rien en surface.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Les créatures y sont tordues, comme dans les égouts.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Ici, même les chauves-souris sont assoiffées de sang.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Aucune trace d'équipement minier, les nains ont-ils tout récupéré ?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Les nains étaient travailleurs, mais avides.
items.artifacts.driedrose$ghosthero.dialogue_city_2=La métropole naine est donc bel et bien tombée.
items.artifacts.driedrose$ghosthero.dialogue_city_3=J'espère que la surface ne finira jamais par ressembler à cet endroit.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Les nains ne sont pas censés être aussi pâles.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Je ne sais pas ce qui est le plus grave, les nains ou leurs créations.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Il semble que les nains soient devenus des monstres sans cervelle.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Quel est cet endroit ?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Cet endroit est terrifiant...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=A quoi pensaient les nains en jouant ainsi avec le pouvoir ?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Les monstres ici sont d'un autre monde, d'où viennent-ils ?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Vous le sentez ? C'est comme si quelque chose nous observait.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Heureusement qu'il y a des torches, il fait si sombre ici !
items.artifacts.driedrose$ghosthero.dialogue_prison_1=J'ai entendu des histoires sur cet endroit, rien de bon.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Cet endroit a toujours été plus un donjon qu'une prison.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Je n'ose imaginer ce qui s'est passé lorsque cet endroit a été abandonné.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Il semble que les prisonniers et les gardes aient été transformés en monstres.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Qu'est-ce qui pourrait être à l'origine de tous ces squelettes ?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ces personnes n'avaient pas à finir comme ça...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Ces égouts étaient autrefois sûrs, on y vivait même en hiver.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Je me demande ce qu'il est advenu des patrouilles de garde, ont-elles abandonné ?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=J'avais de la famille à la surface, j'espère qu'ils sont sains et saufs.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Les gardes n'ont pas pu vaincre ces monstres, mais peut-être pouvons-nous le faire.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Si même les égouts sont aussi dangereux, je me demande ce qu'il y a en dessous...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Qu'est-ce qui a pu faire grossir ces rats et ces crabes ?
items.artifacts.driedrose$ghosthero.direct_prompt=Que dois-je faire ?
items.artifacts.driedrose$ghosthero.directed_attack_1=D'accord, j'attaquerai celui-là.
items.artifacts.driedrose$ghosthero.directed_attack_2=Je m'occupe de celui-là.
items.artifacts.driedrose$ghosthero.directed_attack_3=Engageant...
items.artifacts.driedrose$ghosthero.directed_attack_4=Allons les chercher !
items.artifacts.driedrose$ghosthero.directed_attack_5=Je m'en occupe.
items.artifacts.driedrose$ghosthero.directed_follow_1=D'accord, je vous suis.
items.artifacts.driedrose$ghosthero.directed_follow_2=Je me rangerai derrière vous.
items.artifacts.driedrose$ghosthero.directed_follow_3=Vous suivre...
items.artifacts.driedrose$ghosthero.directed_follow_4=D'accord, allons-y !
items.artifacts.driedrose$ghosthero.directed_follow_5=J'assure vos arrières.
items.artifacts.driedrose$ghosthero.directed_position_1=D'accord, je maintiens cette position.
items.artifacts.driedrose$ghosthero.directed_position_2=Je m'y rendrai et je le défendrai.
items.artifacts.driedrose$ghosthero.directed_position_3=Repositionnement...
items.artifacts.driedrose$ghosthero.directed_position_4=En route !
items.artifacts.driedrose$ghosthero.directed_position_5=Je m'y rendrai.
items.artifacts.driedrose$ghosthero.discover_hint=Vous pouvez trouver ce personnage avec un artefact spécifique.
items.artifacts.driedrose$ghosthero.hello=Bonjour à nouveau %s.
items.artifacts.driedrose$ghosthero.introduce=Mon esprit est lié à cette rose, elle m'était très précieuse, un cadeau de mon amour que j'ai laissé à la surface.\n\nJe ne peux pas retourner auprès de lui, mais grâce à toi, j'ai une seconde chance d'achever mon voyage. Quand je le pourrai, je répondrai à ton appel et je me battrai avec toi.\n\nTant que tu as la rose, je peux entendre ta voix, alors tu peux l'utiliser pour me diriger de loin.\n\nJ'espère que vous réussirez là où j'ai échoué...
items.artifacts.driedrose$ghosthero.name=fantôme triste
items.artifacts.driedrose$ghosthero.player_killed_1=Non !...
items.artifacts.driedrose$ghosthero.player_killed_2=Je n'ai pas pu les aider...
items.artifacts.driedrose$ghosthero.player_killed_3=Pas comme ça...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Seuls des nains construiraient une machine minière qui tue les intrus.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Cette chose est énorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Comment cette chose est-elle restée active aussi longtemps ?
items.artifacts.driedrose$ghosthero.seen_goo_1=Attention Goo !
items.artifacts.driedrose$ghosthero.seen_goo_2=Beaucoup de mes amis sont morts à cause de cette chose, il est temps de se venger !
items.artifacts.driedrose$ghosthero.seen_goo_3=Une telle abomination ne peut être autorisée à vivre !
items.artifacts.driedrose$ghosthero.seen_king_1=Quand on dit que le pouvoir corrompt, c'est ce qu'on veut dire.
items.artifacts.driedrose$ghosthero.seen_king_2=Il est plus une liche qu'un roi maintenant.
items.artifacts.driedrose$ghosthero.seen_king_3=Même dans la mort, les nains obéissent à leur maître.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Le seul prisonnier restant est un assassin mortel. Bien sûr...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Il nous a piégés !
items.artifacts.driedrose$ghosthero.seen_tengu_3=J'ai entendu des histoires d'horreur à propos de ce masque...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, ça n'a pas l'air bon.
items.artifacts.driedrose$ghosthero.seen_yog_2=C'est donc à cela que ressemble un dieu ?
items.artifacts.driedrose$ghosthero.seen_yog_3=Cela va faire mal...
items.artifacts.driedrose$petal.desc=Un frêle pétale desséché, qui a survécu jusqu'ici dans le donjon.
items.artifacts.driedrose$petal.levelup=Vous ajoutez le pétale à la rose.
items.artifacts.driedrose$petal.maxlevel=La rose est terminée !
items.artifacts.driedrose$petal.name=pétale séché
items.artifacts.driedrose$petal.no_room=Il n'y a plus de place pour ce pétale, vous le jetez donc.
items.artifacts.driedrose$petal.no_rose=Vous n'avez pas de rose à laquelle ajouter ce pétale.
