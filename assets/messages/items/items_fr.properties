items.artifacts.driedrose.desc=Est-ce la rose dont le fantôme a parlé avant de disparaître ? Elle semble détenir un certain pouvoir spirituel, peut-être pourrait-elle être utilisée pour canaliser l'énergie de ce guerrier disparu.
