items.weapon.melee.assassinsblade.name=lame d'assassin
items.weapon.melee.assassinsblade.stats_desc=Cette arme est plus puissante contre les ennemis inconscients.
items.weapon.melee.assassinsblade.typical_ability_desc=Le duelliste peut _sneak_ lorsqu'il manie une lame d'assassin. Cette capacité permet au duelliste d'être instantanément aveugle jusqu'à 3 tuiles de distance et lui accorde généralement _%d tours d'invisibilité
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Durée de l'aptitude
items.weapon.melee.battleaxe.ability_desc=Le duelliste peut effectuer un _coup violent_ avec sa hache de guerre. Cette attaque concentrée inflige des _%1$d-%2$d dégâts_ si elle a surpris l'ennemi, et l'étourdit pendant 5 tours, ce qui réduit sa précision et son évasion de 50%%. Coup violent touche toujours mais inflige des dégâts normaux s'il ne surprend pas l'ennemi.
items.weapon.melee.battleaxe.ability_name=coup dur
items.weapon.melee.battleaxe.desc=L'énorme tête en acier de cette hache de guerre confère un poids considérable à chaque coup.
items.weapon.melee.battleaxe.name=hache de guerre
items.weapon.melee.battleaxe.stats_desc=Il s'agit d'une arme assez précise.
items.weapon.melee.battleaxe.typical_ability_desc=Le duelliste peut effectuer un _coup violent_ avec sa hache de guerre. Cette attaque concentrée inflige généralement des _%1$d-%2$d dégâts_ si elle a surpris l'ennemi, et l'étourdit pendant 5 tours, ce qui réduit sa précision et son évasion de 50%%. Coup violent touche toujours mais inflige des dégâts normaux s'il ne surprend pas l'ennemi.
items.weapon.melee.crossbow$chargedshot.desc=La duelliste concentre de la puissance dans son arbalète. La prochaine attaque qu'elle effectuera avec l'arbalète touchera toujours et appliquera l'un des trois effets suivants :\n- Les attaques de mêlée repoussent les ennemis de quelques cases.\n- Les fléchettes non tirées infligent des dégâts supplémentaires.\n- Les fléchettes à pointe gagneront des utilisations supplémentaires et appliqueront leur effet dans une zone de 7x7. Les effets positifs des fléchettes n'affectent que les alliés, et les effets négatifs ne s'appliquent qu'aux ennemis. Le duelliste ne peut pas utiliser cette capacité pour s'appliquer à lui-même les effets positifs des fléchettes.
items.weapon.melee.crossbow$chargedshot.name=chargé
items.weapon.melee.crossbow.ability_desc=La duelliste peut _charger_ son arbalète, ce qui fait que sa prochaine attaque régulière avec l'arbalète touchera toujours et appliquera l'un des trois effets suivants : les attaques de mêlée feront tomber les ennemis, les fléchettes non amorcées infligeront _+%1$d dégâts_, et les fléchettes amorcées appliqueront leur effet dans une zone de 7x7 et dureront _%2$d utilisations de plus_.
items.weapon.melee.crossbow.ability_name=tir chargé
items.weapon.melee.crossbow.desc=Une arme assez complexe qui tire des carreaux à une vitesse exceptionnelle. Bien qu'elle ne soit pas conçue pour cela, son poids et sa solidité en font une arme de mêlée tout à fait convenable.
items.weapon.melee.crossbow.name=arbalète
items.weapon.melee.crossbow.stats_desc=Cette arme améliore les fléchettes lancées pour qu'elles infligent _%1$d-%2$d_ de dégâts lorsqu'elle est équipée, et leur accorde même son enchantement.
items.weapon.melee.crossbow.typical_ability_desc=La duelliste peut _charger_ son arbalète, ce qui fait que sa prochaine attaque régulière avec l'arbalète touchera toujours et appliquera l'un des trois effets suivants : les attaques de mêlée feront tomber les ennemis, les fléchettes non amorcées infligeront généralement _+%1$d dégâts_, et les fléchettes amorcées appliqueront leur effet dans une zone de 7x7 et dureront généralement _%2$d plus d'utilisations_.
items.weapon.melee.crossbow.typical_stats_desc=En général, cette arme améliore les fléchettes lancées pour qu'elles infligent _%1$d-%2$d dégâts_ lorsqu'elle est équipée, et leur accorde même son enchantement.
