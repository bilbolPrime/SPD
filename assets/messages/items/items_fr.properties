items.food.pasty$fishleftover.eat_msg=Le goût de la nourriture était bon.
items.food.pasty$fishleftover.name=restes de poisson
items.food.pasty.amulet_desc=Vous l'avez enfin trouvée, l'amulette magique de - attendez une minute, ce n'est qu'un chocolat enveloppé d'une feuille d'aluminium et conçu pour ressembler à l'amulette ! Il ne te donnera pas un pouvoir illimité, mais au moins, il te remplira et te donnera une petite charge d'artefact.\n\nPoisson d'avril !
items.food.pasty.amulet_name=amulette de yendor ?
items.food.pasty.cane_desc=Un énorme sucre d'orge sucré. Il est assez gros pour vous rassasier, et le sucre peut aussi donner à vos baguettes un petit supplément d'énergie.\n\nBonnes fêtes de fin d'année !
items.food.pasty.cane_name=sucre d'orge
items.food.pasty.desc=Une authentique pâte de Cornouailles avec une farce traditionnelle de bœuf et de pommes de terre. Un délice !
items.food.pasty.egg_desc=Un gros œuf en chocolat, enveloppé dans une feuille jaune colorée. Il y a facilement assez de chocolat pour vous rassasier, et le sucre peut donner à vos artefacts un petit supplément de charge.\n\nJoyeuses Pâques !
items.food.pasty.egg_name=œuf de Pâques
items.food.pasty.fish_desc=Un poisson entier cuit à la vapeur, magiquement conservé sur un lit de verdure. À cette époque de l'année, il est de tradition de garder du poisson pour plus tard, ce qui permet de conserver des restes au lieu de tout manger en une seule fois.\n\nBonne année lunaire !
items.food.pasty.fish_name=poisson à la vapeur
items.food.pasty.name=pâteux
items.food.pasty.pie_desc=Une grande part de tarte à la citrouille. Sa saveur sucrée et épicée vous rassasiera et vous apportera un peu de réconfort.\n\nJoyeux Halloween !
items.food.pasty.pie_name=tarte à la citrouille
items.food.pasty.rainbow_desc=Cette potion colorée est une sorte de nourriture liquide. En plus de vous rassasier, elle contient un peu de magie qui calmera un ennemi adjacent qui n'est pas un boss, le rendant temporairement hésitant à vous combattre.\n\nBonne fierté !
items.food.pasty.rainbow_name=potion arc-en-ciel
items.food.pasty.sparkling_desc=Cette potion pétillante est une sorte de nourriture liquide. Elle apaise la faim et simule un vin pétillant, mais n'est pas vraiment alcoolisée. La sensation de chaleur dans votre ventre vous apportera un peu de protection.\n\nBonne année à tous !
items.food.pasty.sparkling_name=potion pétillante
items.food.pasty.vanilla_desc=Cette grande part de gâteau à la vanille est parsemée de paillettes colorées et d'un glaçage bleu. Ce gâteau a été fait pour célébrer des années d'expérience, et vous accordera une petite partie de cette expérience lorsque vous le mangerez.\n\nPixel Dungeon a été publié pour la première fois le 4 décembre 2012. Joyeux anniversaire Pixel Dungeon !
items.food.pasty.vanilla_name=gâteau bleu
items.food.phantommeat.desc=Un gros steak translucide et scintillant, découpé dans un piranha fantôme. Cette viande magique n'a pas besoin d'être cuite et offre un certain nombre d'avantages défensifs en plus de vous rassasier. Lorsqu'elle est mangée, elle confère l'invisibilité, la peau de barque, quelques soins et guérit de nombreux effets néfastes.
items.food.phantommeat.discover_hint=Vous pouvez obtenir cet objet auprès de certains ennemis.
items.food.phantommeat.name=viande fantôme
items.food.smallration.desc=Il ressemble exactement à une ration alimentaire standard, mais en plus petit.
items.food.smallration.discover_hint=Vous pouvez acheter cet article dans un magasin.
items.food.smallration.eat_msg=Le goût de la nourriture était bon.
items.food.smallration.name=petite ration alimentaire
items.food.stewedmeat.desc=L'étuvage de la viande l'a débarrassée de toute maladie ou parasite. Elle peut donc être consommée en toute sécurité.
items.food.stewedmeat.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.food.stewedmeat.eat_msg=Le goût de la nourriture était bon.
items.food.stewedmeat.name=viande en ragoût
items.food.supplyration.desc=Cette ration a été laissée dans le donjon par et pour les membres de la guilde des voleurs. Elle est spécialement conçue pour être consommée sur le pouce et pour aider à l'escroquerie en général.\n\nBien qu'elle ne vous remplisse pas autant qu'une ration normale, elle peut être mangée rapidement, fournit un peu de guérison directe et redonnera une charge à la cape d'ombres du voleur.
items.food.supplyration.discover_hint=Vous pouvez trouver cet objet en utilisant un talent de héros spécifique.
items.food.supplyration.name=ration d'approvisionnement
items.gold.desc=Un tas de pièces d'or. Ramassez des pièces d'or pour les dépenser plus tard dans un magasin.
items.gold.name=l'or
items.heap.artifact=un artefact
items.heap.chest=Coffre
items.heap.chest_desc=Vous ne saurez pas ce qu'il contient avant de l'ouvrir !
items.heap.crystal_chest=Coffre en cristal
items.heap.crystal_chest_desc=Vous pouvez voir _%s_ à l'intérieur, mais pour ouvrir le coffre, vous avez besoin d'une clé de cristal.
items.heap.for_sale=%1$dg : %2$s
items.heap.locked_chest=Coffre verrouillé
items.heap.locked_chest_desc=Tu ne sauras pas ce qu'il contient tant que tu ne l'auras pas ouvert ! Mais pour l'ouvrir, tu as besoin d'une clé en or.
items.heap.remains=Les restes du héros
items.heap.remains_desc=C'est tout ce qui reste de l'un de vos prédécesseurs. Cela vaut peut-être la peine de vérifier s'il n'y a pas d'objets de valeur.
items.heap.ring=un anneau
items.heap.skeleton=Les restes squelettiques
items.heap.skeleton_desc=C'est tout ce qui reste d'un malheureux aventurier. Cela vaut peut-être la peine de vérifier s'il y a des objets de valeur.
items.heap.tomb=Tombe
items.heap.tomb_desc=Cette ancienne tombe contient peut-être quelque chose d'utile, mais son propriétaire s'opposera certainement à toute vérification.
items.heap.wand=une baguette
items.honeypot$shatteredpot.desc=Le pot a été brisé, seul le miel collant qui tapisse ses parois le maintient en place, et il se désagrège lentement.\n\nMalgré son état brisé, l'abeille semble toujours vouloir protéger le pot.
items.honeypot$shatteredpot.name=pot de miel brisé
items.honeypot.ac_shatter=ÉCLATEMENT
items.honeypot.desc=Ce grand pot de miel n'est en réalité que doublé de miel, mais il abrite une abeille géante ! Ces sortes d'abeilles massives restent généralement dans leurs ruches, peut-être le pot est-il une sorte de cage de trappeur spécialisée ? L'abeille semble plutôt satisfaite de son miel à l'intérieur du pot et bourdonne d'un air méfiant lorsque vous la regardez.
items.honeypot.name=pot de miel
items.item.ac_drop=LACHER
items.item.ac_throw=LANCER
items.item.curse=malédiction
items.item.custom_note=Cet article a une note personnalisée : "_%s_"
items.item.custom_note_type=Ce type d'article a une note personnalisée : "_%s_"
items.item.discover_hint=Vous trouverez cet objet au hasard dans le donjon.
items.item.prompt=Choisir la direction du lancer
items.item.rankings_desc=Tué par : %s
items.journal.alchemypage.desc=Page déchirée d'un guide d'alchimie.\n\nLa majeure partie du texte est trop petite pour être lue à distance, mais on peut distinguer le titre de la page :\n\n"%s"
items.journal.alchemypage.name=page de livre d'alchimie déchirée
items.journal.documentpage.desc=Une page isolée, probablement arrachée d'un livre quelconque. Il faut la prendre pour la lire.
items.journal.documentpage.name=page déchirée
items.journal.guidebook.desc=Un guide de l'aventurier, laissé ici par quelqu'un qui a décidé que l'aventure n'était pas pour lui ! Ce livre est magique et peut inciter les aventuriers à lire une page au bon moment.\n\nMalgré cette fonctionnalité, le livre est surtout populaire en raison des grands mots "Don't Panic !" écrits en grandes lettres amicales sur la couverture.
items.journal.guidebook.hint_desktop=Ton guide a des conseils à te donner ! Sélectionnez le bouton clignotant du journal (%s) en haut à droite pour le lire.
items.journal.guidebook.hint_mobile=Ton guide a des conseils à te donner ! Touchez le bouton clignotant du journal en haut à droite pour le lire.
items.journal.guidebook.hint_status=Guide
items.journal.guidebook.name=tome de la maîtrise des donjons
items.journal.guidepage.desc=Page déchirée d'un guide d'aventures.\n\nLa plupart du texte est trop petit pour être lu à distance, mais on peut distinguer le titre de la page :\n\n"%s"
items.journal.guidepage.name=page déchirée du guide
items.journal.regionlorepage$caves.desc=Ce qui semble être une entrée dans le journal de bord d'un explorateur, étonnamment bien conservé malgré son ancienneté. Prenez-le pour le lire.
items.journal.regionlorepage$caves.name=ancienne entrée dans le journal
items.journal.regionlorepage$city.desc=Une petite tablette en métal rouillé sur laquelle est gravé un message par magie. Les lettres sont encore claires malgré l'âge de la tablette, mais il faut la prendre pour la lire.
items.journal.regionlorepage$city.name=tablette rouillée
items.journal.regionlorepage$halls.desc=Une petite tablette noire sur laquelle sont gravées des lettres vertes lumineuses. À distance, les lettres lumineuses se confondent dans un brouillard, il faut les prendre en main pour les lire.
items.journal.regionlorepage$halls.name=tablette lumineuse
items.journal.regionlorepage$prison.desc=Un journal, ou un autre type d'enregistrement, écrit sur un vieux morceau de papier. Il semble avoir mieux résisté que les lettres que vous avez trouvées dans les égouts, mais vous devrez quand même le ramasser pour le lire.
items.journal.regionlorepage$prison.name=entrée de journal usée
items.journal.regionlorepage$sewers.desc=Ce qui semble être une lettre, écrite sur un morceau de papier taché de saleté. Il faut le ramasser pour en distinguer le contenu.
items.journal.regionlorepage$sewers.name=lettre usée
items.keys.crystalkey.desc=Les surfaces taillées de cette clé cristalline brillent dans l'obscurité. Peut-être ouvrira-t-elle un objet en cristal ?
items.keys.crystalkey.name=Clé en cristal
items.keys.goldenkey.desc=Les encoches de cette clé en or sont minuscules et complexes. Peut-être ouvrira-t-elle un coffre fermé à clé ?
items.keys.goldenkey.name=clé d'or
items.keys.ironkey.desc=Les crans de cette ancienne clé en fer sont usés, son cordon en cuir est abîmé par le temps. Quelle porte pourrait-elle ouvrir ?
items.keys.ironkey.name=clé en fer
items.keys.skeletonkey.desc=Cette clé a l'air sérieuse : sa tête a la forme d'un crâne. Elle peut probablement ouvrir une porte sérieuse.
items.keys.skeletonkey.name=clé squelette
items.keys.wornkey.desc=Cette clé est usée et décolorée, mais elle a l'air sérieuse. Elle peut probablement ouvrir une porte sérieuse à proximité.
items.keys.wornkey.name=clé usée
items.kindofmisc.unequip_message=Vous devez d'abord déséquiper l'un de ces objets. Sélectionnez un objet à échanger.
items.kindofmisc.unequip_title=Déséquiper un objet
items.kindofweapon.empty=vide
items.kindofweapon.equip_cursed=Votre poigne se resserre involontairement autour de l'arme.
items.kindofweapon.swift_equip=Vous équipez rapidement votre arme.
items.kindofweapon.which_equip_msg=Dans quel emplacement d'arme souhaitez-vous équiper cet objet ?\n\nLa championne attaque directement avec son arme principale, mais peut utiliser la capacité de l'une ou l'autre arme. Les deux armes ont le même nombre de charges.\n\nLa championne peut également échanger instantanément son arme principale et son arme secondaire.
items.kindofweapon.which_equip_primary=Primaire (%s)
items.kindofweapon.which_equip_secondary=Secondaire (%s)
items.kingscrown.ac_wear=PORTEZ
items.kingscrown.desc=Couronne du dernier roi nain, elle brille d'une formidable énergie magique.\n\nLorsqu'elle est portée, la magie de la couronne s'infiltre dans l'armure que vous portez actuellement, la transformant en une _armure épique unique dotée de capacités spéciales_.
items.kingscrown.discover_hint=Vous pouvez obtenir cet objet auprès de certains ennemis.
items.kingscrown.naked=Malheureusement, la couronne ne peut pas transformer vos sous-vêtements.
items.kingscrown.name=Couronne du roi nain
items.kingscrown.ratgraded=Les pattes du roi des rats brillent de mille feux lorsque ton armure se transforme !
items.kingscrown.upgraded=La couronne brille de mille feux, puis se désintègre au fur et à mesure que ton armure se transforme !
items.liquidmetal.ac_apply=POSTULER
items.liquidmetal.already_fixed=Cette arme de jet est déjà en parfait état !
items.liquidmetal.apply=Vous utilisez le métal liquide %d pour réparer votre arme de jet.
items.liquidmetal.desc=Ce liquide magique peut combler les fissures et les déchirures d'une arme de jet et la remettre en parfait état ! S'il manque une arme à une série d'armes, mais qu'elle est entièrement réparée, le métal liquide peut même être utilisé pour remplacer l'arme manquante de la série !\n\nUne arme de niveau 1 nécessite 10 de métal liquide pour être entièrement réparée, une arme de niveau 5 en nécessite 30. Chaque amélioration augmente également la quantité de métal nécessaire de 35 %.\n\nLe métal liquide ne peut pas être utilisé pour réparer les pointes des fléchettes.
items.liquidmetal.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.liquidmetal.name=métal liquide
items.liquidmetal.prompt=Choisir une arme de jet
items.lostbackpack.desc=Il s'agit de votre inventaire perdu. Ramassez-le pour récupérer tous les objets que vous avez perdus !
items.lostbackpack.name=sac à dos perdu
items.merchantsbeacon.ac_use=UTILISER
items.merchantsbeacon.desc=Ce curieux objet de technologie naine permet de communiquer à grande distance.\n\nUne fois activée, cette balise vous permettra de vendre des objets à Pixel Mart depuis n'importe quel endroit du donjon.\n\nCependant, la magie de la balise ne dure que le temps d'une session, alors utilisez-la à bon escient.
items.merchantsbeacon.name=balise du marchand
items.potions.brews.aquabrew.desc=Lorsqu'il est brisé, ce breuvage libère une rafale d'eau sous pression à l'endroit où il se trouve. Elle est suffisamment puissante pour endommager les ennemis enflammés, mais elle répand également de l'eau sur les terrains avoisinants, désactive les pièges, éteint les incendies et fait reculer les personnages proches de la rafale.
items.potions.brews.aquabrew.name=brassin d'eau
items.potions.brews.blizzardbrew.desc=Lorsqu'il est brisé, ce breuvage libère un blizzard tourbillonnant qui se répand rapidement comme un gaz.
items.potions.brews.blizzardbrew.name=bière du blizzard
items.potions.brews.brew.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.potions.brews.causticbrew.desc=Ce breuvage répandra de la suie corrosive dans une large zone autour de l'endroit où il se brise. Tout ce qui est touché par l'écume fondra lentement s'il n'est pas possible de l'éliminer avec de l'eau.
items.potions.brews.causticbrew.name=brassage caustique
items.potions.brews.infernalbrew.desc=Lorsqu'il est brisé, ce breuvage déclenche un brasier qui se propage rapidement comme un gaz.
items.potions.brews.infernalbrew.name=infusion infernale
items.potions.brews.shockingbrew.desc=Lorsqu'il est brisé, ce breuvage déclenche une tempête électrique dans une vaste zone autour de l'endroit où il se brise.
items.potions.brews.shockingbrew.name=brassage choquant
items.potions.brews.unstablebrew.desc=Ce breuvage magique brille des couleurs changeantes de l'arc-en-ciel.\n\nLorsqu'il est bu ou jeté, il déclenche l'effet d'une potion aléatoire. L'effet de la potion sera toujours bénéfique si elle est bue, et toujours néfaste si elle est jetée.
items.potions.brews.unstablebrew.name=brassage instable
items.potions.elixirs.elixir.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Vous avez temporairement acquis des propriétés réparatrices similaires à celles de Goo.\n\nLorsque vous êtes dans l'eau, vous récupérez une petite quantité de points de vie par tour. L'effet est interrompu lorsque vous êtes en pleine santé ou que vous êtes hors de l'eau.\n\nGuérison à gauche : %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=guérison aquatique
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Cet élixir contient les restes de Goo enrichis d'une potion de soin. Bien qu'il ne permette pas une guérison immédiate, il rétablit progressivement un plus grand nombre de points de vie lorsque vous êtes dans l'eau.
items.potions.elixirs.elixirofaquaticrejuvenation.name=élixir de jouvence aquatique
items.potions.elixirs.elixirofarcanearmor.desc=Cet élixir confère au buveur une résistance durable aux dégâts magiques.
items.potions.elixirs.elixirofarcanearmor.name=élixir de l'armure des arcanes
items.potions.elixirs.elixirofdragonsblood.desc=Lorsqu'il est consommé, cet élixir envoie une puissance ardente dans les veines du buveur. Cet effet immunise le buveur contre le feu et lui permet d'enflammer ses ennemis avec des attaques physiques.
items.potions.elixirs.elixirofdragonsblood.name=élixir de sang de dragon
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Vous êtes sous l'effet d'un élixir de chute de plumes, qui vous permet de tomber dans les gouffres sans subir de dégâts !\n\nTours restants : %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=chute de plumes
items.potions.elixirs.elixiroffeatherfall.desc=Cet élixir offre un effet de lévitation plus faible mais mieux contrôlé, permettant au buveur de tomber sur de grandes distances sans dommage pendant un certain temps.
items.potions.elixirs.elixiroffeatherfall.light=Vous vous sentez léger comme une plume !
items.potions.elixirs.elixiroffeatherfall.name=élixir de chute de plumes
items.potions.elixirs.elixirofhoneyedhealing.desc=Cet élixir allie la guérison à la douceur du miel. Lorsqu'il est bu, il a le même effet qu'une potion de guérison et apaise un peu la faim, mais il peut aussi être lancé pour soigner un allié.\n\nLes créatures ayant une affinité avec le miel peuvent être apaisées si cet objet est utilisé sur elles.
items.potions.elixirs.elixirofhoneyedhealing.name=l'élixir de guérison au miel
items.potions.elixirs.elixiroficytouch.desc=Lorsqu'il est consommé, cet élixir permet au buveur d'absorber la chaleur des ennemis qu'il attaque. Cet effet immunise le buveur contre le froid et lui permet de refroidir ses ennemis par des attaques physiques.
items.potions.elixirs.elixiroficytouch.name=l'élixir du toucher glacé
items.potions.elixirs.elixirofmight$htboost.desc=Votre corps se sent anormalement fort et sain.\n\nVotre santé maximale est augmentée pendant une longue période. Au fur et à mesure que vous gagnez des niveaux, ce boost s'estompe progressivement.\n\nMontant actuel de l'augmentation : %d.\nNiveaux restants : %d.
items.potions.elixirs.elixirofmight$htboost.name=augmentation maximale de la santé
items.potions.elixirs.elixirofmight.desc=Ce puissant liquide se répand dans vos muscles, augmentant en permanence votre force d'un point et augmentant temporairement votre santé maximale de %d points. L'augmentation de la santé est proportionnelle à votre santé maximale, mais s'estompe lentement au fur et à mesure que vous gagnez des niveaux.
items.potions.elixirs.elixirofmight.msg=Une force nouvelle envahit votre corps, vous avez maintenant une force %d !
items.potions.elixirs.elixirofmight.name=élixir de puissance
items.potions.elixirs.elixiroftoxicessence.desc=Lorsqu'il est consommé, cet élixir imprègne le buveur d'énergie toxique. Le buveur répand continuellement du gaz toxique en se déplaçant et est immunisé contre le gaz toxique et le poison pendant un peu plus longtemps que la durée de l'effet.
items.potions.elixirs.elixiroftoxicessence.name=élixir d'essence toxique
items.potions.exotic.exoticpotion.amber=potion d'ambre exotique
items.potions.exotic.exoticpotion.azure=potion exotique azur
items.potions.exotic.exoticpotion.bistre=potion bistre exotique
items.potions.exotic.exoticpotion.charcoal=potion au charbon de bois exotique
items.potions.exotic.exoticpotion.crimson=potion exotique cramoisie
items.potions.exotic.exoticpotion.discover_hint=Vous pouvez fabriquer cet objet par alchimie.
items.potions.exotic.exoticpotion.golden=potion exotique dorée
items.potions.exotic.exoticpotion.indigo=potion exotique indigo
items.potions.exotic.exoticpotion.ivory=potion exotique ivoire
items.potions.exotic.exoticpotion.jade=potion de jade exotique
items.potions.exotic.exoticpotion.magenta=potion exotique magenta
items.potions.exotic.exoticpotion.no=Non, j'ai changé d'avis
items.potions.exotic.exoticpotion.silver=potion d'argent exotique
items.potions.exotic.exoticpotion.turquoise=potion exotique turquoise
items.potions.exotic.exoticpotion.unknown_desc=Cette gourde ronde contient un liquide coloré et granuleux. Il semble étranger à cette terre, qui sait ce qu'il peut faire lorsqu'il est bu ou jeté ?
items.potions.exotic.exoticpotion.warning=Voulez-vous vraiment annuler l'utilisation de cette potion ? Elle sera consommée de toute façon.
items.potions.exotic.exoticpotion.yes=Oui, je suis positif
items.potions.exotic.potionofcleansing$cleanse.desc=Ce personnage est temporairement immunisé contre tous les effets d'état nuisibles !\n\nTours restants : %s.
items.potions.exotic.potionofcleansing$cleanse.name=nettoyé
items.potions.exotic.potionofcleansing.desc=Ce puissant réactif immunise le buveur contre tous les effets d'état néfastes pendant quelques tours lorsqu'il est consommé. Il peut également être jeté sur une cible pour la purifier.
items.potions.exotic.potionofcleansing.name=potion de purification
items.potions.exotic.potionofcorrosivegas.desc=Le débouchage ou le bris de ce verre pressurisé provoque l'explosion de son contenu en un nuage mortel de gaz corrosif de couleur rouille. Le gaz se répand plus rapidement que le gaz toxique et est plus mortel, mais il ne dure pas aussi longtemps.
items.potions.exotic.potionofcorrosivegas.name=potion de gaz corrosif
items.potions.exotic.potionofdivineinspiration.bonus=+2 points de talent !
items.potions.exotic.potionofdivineinspiration.desc=Le pouvoir de l'énergie sacrée réduit à l'état liquide, cette boisson imprègne le buveur de puissance divine, lui accordant deux points de talent supplémentaires dans le niveau de son choix.\n\nCette potion ne peut être utilisée qu'une seule fois par niveau de talent.
items.potions.exotic.potionofdivineinspiration.name=potion d'inspiration divine
items.potions.exotic.potionofdivineinspiration.no_more_points=Vous ne pouvez plus gagner de points de talent bonus.
items.potions.exotic.potionofdivineinspiration.select_tier=Sélectionnez un niveau de talent pour gagner deux points bonus. Vous devez avoir débloqué le niveau pour pouvoir dépenser les points.
items.potions.exotic.potionofdragonsbreath.desc=Cette flasque contient un composé inhabituel qui s'enflamme peu après avoir été mélangé à la salive. En crachant rapidement le liquide, l'utilisateur peut faire jaillir des flammes de sa bouche !
items.potions.exotic.potionofdragonsbreath.name=potion de souffle de dragon
items.potions.exotic.potionofdragonsbreath.prompt=Choisir un lieu de combustion
items.potions.exotic.potionofearthenarmor.desc=Plutôt que de paralyser, ce liquide a un effet durcissant sur la peau qui la transforme en armure naturelle temporaire.
items.potions.exotic.potionofearthenarmor.name=potion d'armure de terre
items.potions.exotic.potionofmagicalsight.desc=Après avoir bu cette boisson, vos sens seront brièvement augmentés à des niveaux incroyables, vous permettant de voir à travers les murs dans un rayon de 12 tuiles !
items.potions.exotic.potionofmagicalsight.name=potion de vision magique
items.potions.exotic.potionofmastery.armor_easier=Votre armure devient plus facile à porter !
items.potions.exotic.potionofmastery.desc=Plutôt que de donner de la force brute, cette potion accorde les muscles de l'utilisateur à un objet particulier. Cet objet sera plus facile à utiliser, comme si le buveur s'était entraîné avec et avait développé une mémoire musculaire.\n\nL'arme ou l'armure choisie nécessitera 2 fois moins de force pour être utilisée. Cette potion ne peut être utilisée qu'une seule fois par objet.
items.potions.exotic.potionofmastery.name=potion de maîtrise
items.potions.exotic.potionofmastery.prompt=Maîtriser un objet
items.potions.exotic.potionofmastery.weapon_easier=Votre arme devient plus facile à manier !
items.potions.exotic.potionofshielding.desc=Au lieu de soigner, cette potion projette un bouclier durable autour du corps de l'utilisateur, bloquant une quantité considérable de dégâts.
items.potions.exotic.potionofshielding.name=potion de protection
items.potions.exotic.potionofshroudingfog.desc=Lorsqu'il est exposé à l'air, le liquide contenu dans cette fiole produit un épais brouillard fumeux qui se répand rapidement et bloque la vision de vos ennemis.
items.potions.exotic.potionofshroudingfog.name=potion de brouillard obscurcissant
items.potions.exotic.potionofsnapfreeze.desc=Le produit chimique contenu dans cette potion réagit rapidement avec l'air, gelant instantanément et enracinant tous ceux qui se trouvent dans son champ d'action.
items.potions.exotic.potionofsnapfreeze.name=potion de gel rapide
items.potions.exotic.potionofstamina.desc=En buvant ce liquide étrangement sucré, vous bénéficierez d'un regain d'énergie durable, ce qui vous permettra de courir à un rythme accéléré pendant une période prolongée.
items.potions.exotic.potionofstamina.name=potion d'endurance
items.potions.exotic.potionofstormclouds.desc=En lançant cette potion, vous créerez un nuage de vapeur concentrée qui se répandra rapidement, se condensera et se déversera sur l'environnement. La plupart des terrains seront transformés en eau, les ennemis enflammés subiront des dégâts, le feu sera éteint et les pièges seront submergés et se briseront.
items.potions.exotic.potionofstormclouds.name=potion de nuages d'orage
