items.weapon.weaponeffects.weaponeffect.drainlife.desc=Cette baguette est _drainante_. Sa magie a _20%_ de chances de déclencher _Drain de vie_, qui inflige _8–16_ dégâts magiques supplémentaires et vous soigne à hauteur de la vie dérobée.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Drain !

items.armor.armorprefix.stalwart.name=%s tenace
items.armor.armorprefix.stalwart.desc=Cette armure est _tenace_. Les attaques ennemies ont _20%_ de chances de déclencher _Robustesse de niveau 5_, réduisant leurs dégâts de _20%_.
items.armor.armorprefix.stalwart.activate=Robustesse !

items.armor.armorprefix.vigilant.name=%s de vigilance
items.armor.armorprefix.vigilant.desc=Cette armure est _vigilante_. Elle vous donne _20%_ de chances d'esquiver une attaque ennemie à distance.
items.armor.armorprefix.vigilant.activate=Vigilance !

items.armor.armorprefix.elusive.name=%s insaisissable
items.armor.armorprefix.elusive.desc=Cette armure est _insaisissable_. Subir des dégâts d'une attaque ennemie a _20%_ de chances d'augmenter votre esquive de _5_ pendant _5 tours_.
items.armor.armorprefix.elusive.activate=Esquive !
