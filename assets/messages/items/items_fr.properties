items.armor.curses.antientropy.desc=La malédiction anti-entropie va à l'encontre des forces de l'univers, attirant l'énergie vers le porteur et l'éloignant de son environnement. Cela met brièvement le porteur en feu, mais gèle tout ce qui l'entoure !
items.armor.curses.antientropy.name=%s de l'anti-entropie
items.armor.curses.bulk.desc=L'armure de masse semble plus grande et plus imposante, mais elle n'offre pas de défense améliorée. Pire encore, la taille supplémentaire rend le passage dans les embrasures de porte très difficile.
items.armor.curses.bulk.name=%s en vrac
items.armor.curses.corrosion.desc=L'armure de corrosion est capable d'éclater avec un fluide corrosif, recouvrant tout ce qui se trouve dans la zone d'un suintement acide et collant.
items.armor.curses.corrosion.name=%s de la corrosion
items.armor.curses.displacement.desc=La malédiction du déplacement tente de mettre le porteur à l'abri lorsqu'il est attaqué. Elle est cependant un peu trop efficace, téléportant l'utilisateur de façon aléatoire dans le niveau.
items.armor.curses.displacement.name=%s de déplacement
items.armor.curses.metabolism.desc=La malédiction du métabolisme convertit directement la satiété en santé lorsque le porteur est blessé, ce qui favorise la guérison, mais provoque rapidement la famine.
items.armor.curses.metabolism.name=%s du métabolisme
items.armor.curses.multiplicity.desc=Les armures maudites par la multiplicité contiennent une dangereuse magie de duplication. Elle crée parfois une image miroir du porteur, mais il est tout aussi probable qu'elle duplique l'attaquant !
items.armor.curses.multiplicity.name=%s de la multiplicité
items.armor.curses.overgrowth.desc=L'armure de l'overgrowth est recouverte de diverses plantes en fleurs. Bien que cet effet soit intéressant, il n'apporte rien à la défense et ces plantes s'activeront aléatoirement en combat !
items.armor.curses.overgrowth.name=%s de la croissance excessive
items.armor.curses.stench.desc=Les armures dotées d'une odeur nauséabonde libèrent des nuages de gaz nocifs, qui sont dangereux pour tout ce qui se trouve dans le nuage.
items.armor.curses.stench.name=%s de la puanteur
items.armor.duelistarmor.desc=Lorsqu'il porte cette armure de plaque et cette cape, le duelliste peut exécuter une capacité spéciale.
items.armor.duelistarmor.name=cuirasse du héros
items.armor.glyphs.affection.desc=Ce glyphe puissant manipule l'esprit des attaquants, les charmant temporairement.
items.armor.glyphs.affection.name=%s d'affection
items.armor.glyphs.antimagic.desc=Ce glyphe puissant permet à l'armure de défendre son porteur contre les attaques magiques et physiques. Cette défense magique n'est pas affectée par le niveau de l'armure.
items.armor.glyphs.antimagic.name=%s de l'anti-magie
items.armor.glyphs.brimstone.desc=Ce glyphe protège le porteur et ses biens du feu, annulant complètement ses dégâts et ses effets négatifs.
items.armor.glyphs.brimstone.name=%s de soufre
items.armor.glyphs.camouflage.desc=Ce glyphe permet au porteur de se fondre dans les hautes herbes, lui conférant une invisibilité temporaire.
items.armor.glyphs.camouflage.name=%s de camouflage
items.armor.glyphs.entanglement.desc=Ce glyphe fait pousser une armure de terre autour du porteur pour absorber les dégâts, mais cette armure se brise si le porteur bouge.
items.armor.glyphs.entanglement.name=%s de l'enchevêtrement
items.armor.glyphs.flow.desc=Ce glyphe manipule le flux d'eau autour du porteur, le rendant beaucoup plus rapide lorsqu'il se déplace dans l'eau.
items.armor.glyphs.flow.name=%s du flux
items.armor.glyphs.obfuscation.desc=Ce glyphe obscurcit le porteur, le rendant plus difficile à détecter.
items.armor.glyphs.obfuscation.name=%s d'obscurcissement
items.armor.glyphs.potential.desc=Ce glyphe accumule de l'énergie lorsqu'il est frappé, conférant une charge à la baguette du porteur lorsqu'il s'active.
items.armor.glyphs.potential.name=%s de potentiel
items.armor.glyphs.repulsion.desc=Ce glyphe fait rebondir la force contre les attaquants, les renvoyant en arrière.
items.armor.glyphs.repulsion.name=%s de répulsion
items.armor.glyphs.stone.desc=Ce glyphe entoure l'armure d'une lourde pierre magique qui rend l'esquive impossible, mais bloque les dégâts proportionnellement à l'esquive.
items.armor.glyphs.stone.name=%s de la pierre
items.armor.glyphs.swiftness.desc=Ce glyphe augmente la vitesse du porteur lorsqu'il n'est pas à proximité d'un ennemi.
items.armor.glyphs.swiftness.name=%s de rapidité
items.armor.glyphs.thorns.desc=Ce glyphe puissant nuit aux attaquants, les faisant saigner lentement lorsqu'ils attaquent le porteur.
items.armor.glyphs.thorns.name=%s d'épines
