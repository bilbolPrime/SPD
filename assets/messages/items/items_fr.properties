items.artifacts.masterthievesarmband.steal_shopkeeper=Vous ne pouvez pas voler directement les commerçants.
items.artifacts.masterthievesarmband.stole_item=Vous avez volé un objet : %s.
items.artifacts.sandalsofnature.absorb_seed=Les chaussures absorbent les graines, elles semblent plus saines.
