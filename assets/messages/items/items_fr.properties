items.weapon.melee.shortsword.typical_ability_desc=Le duelliste peut _fendre_ un ennemi avec une épée courte. Cela inflige généralement _%1$d-%2$dQ dégâts_ et est garanti de toucher. Si la fente tue un ennemi, elle est instantanée et le duelliste peut l'utiliser à nouveau dans les 5 tours gratuitement.
items.weapon.melee.sickle.ability_desc=Le duelliste peut _récolter_ un ennemi avec une faucille. Cette attaque dévastatrice est garantie de toucher et inflige _%d dégâts_. Ces dégâts sont appliqués sous forme de saignement si la cible n'est pas immunisée.
