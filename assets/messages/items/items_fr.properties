items.artifacts.etherealchains.rooted=Vos chaînes ne peuvent pas vous tirer tant que vous êtes enraciné.
items.artifacts.holytome.ac_cast=CAST
items.artifacts.holytome.cursed=Vous ne pouvez pas utiliser un tome maudit.
items.artifacts.holytome.desc=Un tome sacré qui sert de point focal à la magie divine du clerc. L'utilisation du tome permet au clerc de lancer une variété de sorts magiques.\n\nLe tome devient de plus en plus puissant au fur et à mesure que l'Ecclésiaste l'utilise, lui donnant plus de charges maximales et augmentant légèrement la vitesse de recharge.
items.artifacts.holytome.discover_hint=L'un des héros commence avec cet objet.
items.artifacts.holytome.levelup=Votre tome se renforce !
items.artifacts.holytome.name=tome sacré
items.artifacts.holytome.no_spell=Tu n'es pas en mesure de jeter ce sort pour l'instant.
