items.food.blandfruit$chunks.desc=Le fruit blond a explosé lors de l'impact, laissant derrière lui des morceaux inertes.\n\nMalgré un peu de terre, ces gros morceaux de fruits à baies cuits semblent parfaitement comestibles.
