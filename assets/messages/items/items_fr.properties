items.weapon.melee.greataxe.ability_desc=La duelliste peut effectuer une attaque de _rétribution_ avec une grande hache si elle a moins de 50%% points de vie. Cette attaque dévastatrice inflige _%1$d-%2$d dégâts,_ est garantie de toucher et est instantanée si elle tue un ennemi.
