items.weapon.missiles.javelin.desc=Ces grandes lances sont lestées afin de maintenir la pointe en avant lorsqu'elles naviguent dans l'air.
items.weapon.missiles.javelin.name=javelot
items.weapon.missiles.kunai.desc=Ces petits couteaux sont très puissants dans les mains d'un utilisateur expérimenté.
