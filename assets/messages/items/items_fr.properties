items.weapon.melee.greatshield.ability_desc=La duelliste peut se _garder_ avec un grand bouclier, annulant complètement toutes les attaques physiques ou magiques faites contre elle pendant _%d tours_. Une fois que la duelliste a bloqué une attaque, le fait de riposter ou d'utiliser la magie met fin à la protection.
