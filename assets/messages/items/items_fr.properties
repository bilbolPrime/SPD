items.artifacts.hornofplenty.desc=On ne peut pas souffler dans cette corne, mais elle semble se remplir de nourriture au fur et à mesure que vous avancez dans l'aventure et que vous gagnez de l'expérience. Vous pouvez consommer chaque charge individuellement en guise d'en-cas ou manger jusqu'à satiété.
items.artifacts.hornofplenty.desc_cursed=La corne maudite s'est attachée à votre flanc, elle semble vouloir prendre de la nourriture plutôt que d'en produire.
items.artifacts.hornofplenty.desc_hint=Il existe peut-être un moyen d'augmenter la puissance de la corne en lui donnant de l'énergie alimentaire.
items.artifacts.hornofplenty.eat=Vous mangez dans la corne.
