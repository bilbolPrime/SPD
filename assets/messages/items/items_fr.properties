items.artifacts.sandalsofnature.ac_root=RACINE
items.artifacts.sandalsofnature.desc_1=Ce qui ressemble d'abord à des sandales faites de ficelle est en fait deux plantes ! Elles semblent très faibles et pâles, peut-être ont-elles besoin d'être nourries ?
items.artifacts.sandalsofnature.desc_2=Les chaussures ont grandi et ressemblent désormais davantage à deux chaussures sur mesure. Elles ont retrouvé un peu de couleur, peut-être peuvent-elles encore grandir ?
items.artifacts.sandalsofnature.desc_3=Les plantes ont repoussé et ressemblent maintenant à une paire de bottes solides faites d'écorce. Les plantes semblent avoir retrouvé leur force, mais peut-être peuvent-elles encore grandir ?
items.artifacts.sandalsofnature.desc_4=Les plantes semblent avoir atteint leur taille maximale, elles ressemblent à une paire de greffons blindés. Les greaves sont d'un brun profond et ressemblent à un arbre très robuste.
items.artifacts.sandalsofnature.desc_ability=Les chaussures ondulent de la couleur de la dernière graine que vous leur avez donnée. Elles peuvent s'enraciner brièvement dans le sol et produire l'effet de cette plante dans un rayon de 3 tuiles.\nGraine : _%s_\nCharge nécessaire : _%dXXPH2ZXQ_
items.artifacts.sandalsofnature.desc_cursed=Les sandales maudites empêchent tout contact avec la nature.
items.artifacts.sandalsofnature.desc_hint=Vous vous sentez plus en harmonie avec la nature lorsque vous portez cet artefact.
items.artifacts.sandalsofnature.desc_seeds=Vous avez nourri les semences de chaussures %d.
items.artifacts.sandalsofnature.levelup=Vos chaussures prennent de l'ampleur !
items.artifacts.sandalsofnature.low_charge=Vos chaussures n'ont pas assez d'énergie pour cela.
