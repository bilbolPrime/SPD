items.weapon.weaponeffects.weaponeffect.spark.desc=Cette baguette est _runique_. Sa magie a _20%_ de chances de déclencher _Étincelle_, qui inflige _4–8_ dégâts magiques supplémentaires.
items.weapon.weaponeffects.weaponeffect.spark.activate=Étincelle !

