items.weapon.melee.assassinsblade.ability_desc=Le duelliste peut _sneak_ en brandissant une lame d'assassin. Cette capacité permet à la duelliste de clignoter instantanément jusqu'à 3 tuiles de distance et lui accorde _%d tours d'invisibilité
items.weapon.melee.assassinsblade.ability_name=se faufiler
