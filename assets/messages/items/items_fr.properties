items.weapon.melee.flail$spinabilitytracker.desc=Le duelliste fait tourner son fléau, accumulant des dégâts pour sa prochaine attaque régulière. Chaque rotation prend un tour mais augmente les dégâts, jusqu'à un maximum de trois rotations. Le fléau est également garanti de toucher pendant qu'il tourne.\n\nTours actuels : %1$d%%.\nTours restants : %2$s.
items.weapon.melee.flail$spinabilitytracker.name=filature
items.weapon.melee.flail.ability_desc=Le duelliste peut _faire tourner_ un fléau pour accumuler de la puissance pendant une courte période. Chaque fois que le fléau est tourné, il inflige _+%d_ de dégâts à sa prochaine attaque normale, jusqu'à un maximum de 3 fois. Un fléau qui tourne est également sûr de toucher. Le seul fait de commencer à faire tourner le fléau coûte une charge.
items.weapon.melee.flail.ability_name=rotation
items.weapon.melee.flail.desc=Une balle à pointes attachée à un manche par une chaîne. Elle est très peu maniable, mais dévastatrice si elle est bien touchée.
items.weapon.melee.flail.name=fléau
items.weapon.melee.flail.spin_warn=On ne peut plus faire tourner le fléau.
items.weapon.melee.flail.stats_desc=Il s'agit d'une arme assez imprécise.\nCette arme ne peut pas effectuer d'attaque surprise.
items.weapon.melee.flail.typical_ability_desc=Le duelliste peut _faire tourner_ un fléau pour accumuler de la puissance pendant une courte période. Chaque fois que le fléau est tourné, il inflige _+%d dommages_ à sa prochaine attaque normale, jusqu'à un maximum de 3 fois. Un fléau qui tourne est également sûr de toucher. Le seul fait de commencer à faire tourner le fléau coûte une charge.
items.weapon.melee.gauntlet.ability_desc=Le duelliste peut effectuer une _combinaison de coups_ avec un gantelet de pierre. Cette attaque est garantie de toucher et inflige _+%d dommages_ pour chaque fois que le duelliste a touché avec une attaque de mêlée ou d'arme de jet. Ne pas toucher pendant 5 tours réinitialise ce combo.
items.weapon.melee.gauntlet.ability_name=grève combinée
items.weapon.melee.gauntlet.desc=Ce gantelet massif est fait d'un tissu cramoisi recouvert de lourdes pierres magiques. Le tissu se resserre autour de vous, faisant des épaisses plaques de pierre presque une seconde peau. Le maniement d'une arme aussi lourde demande de la force, mais ajoute une force considérable à vos coups.
items.weapon.melee.gauntlet.name=gantelet de pierre
items.weapon.melee.gauntlet.stats_desc=Il s'agit d'une arme très rapide.
items.weapon.melee.gauntlet.typical_ability_desc=Le duelliste peut effectuer une _combinaison de coups_ avec un gantelet de pierre. Cette attaque est garantie de toucher et inflige généralement _+%d dommages_ pour chaque fois que le duelliste a touché avec une attaque de mêlée ou d'arme de jet. Ne pas toucher pendant 5 tours réinitialise ce combo.
items.weapon.melee.glaive.ability_desc=Le duelliste peut utiliser la pointe de son glaive pour _pointer_ un ennemi à portée mais non adjacent. Cela inflige _%1$d-%2$d dégâts_, fait reculer l'ennemi et est garanti de toucher.
