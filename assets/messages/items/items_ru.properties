items.weapon.weaponeffects.weaponeffect.smite.prefix=Варварский
items.weapon.weaponeffects.weaponeffect.smite.name=%s варвара
items.weapon.weaponeffects.weaponeffect.smite.desc=Это _варварское_ оружие. При попадании с вероятностью _20%_ оно применяет _Кару 1-го уровня_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Кара!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Отталкивающий
items.weapon.weaponeffects.weaponeffect.knockback.name=%s отталкивания
items.weapon.weaponeffects.weaponeffect.knockback.desc=Это _отталкивающее_ оружие. При попадании с вероятностью _20%_ оно отбрасывает врага на _одну клетку_. Боссов оттолкнуть нельзя.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Отбрасывание!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Змеиный
items.weapon.weaponeffects.weaponeffect.venom.name=%s змеи
items.weapon.weaponeffects.weaponeffect.venom.desc=Это _змеиное_ оружие. При попадании с вероятностью _20%_ оно отравляет цель.
items.weapon.weaponeffects.weaponeffect.venom.activate=Яд!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Калечащий
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s увечья
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Это _калечащее_ оружие. Попадания с расстояния с вероятностью _20%_ накладывают на врага хромоту на _10 ходов_. На боссов не действует.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Хромота!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Рунический
items.weapon.weaponeffects.weaponeffect.spark.name=%s рун
items.weapon.weaponeffects.weaponeffect.spark.desc=Это _руническая_ палочка. Её магия с вероятностью _20%_ вызывает _Искру_, нанося _4–8_ дополнительного магического урона.
items.weapon.weaponeffects.weaponeffect.spark.activate=Искра!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Проклинающий
items.weapon.weaponeffects.weaponeffect.curse.name=%s сглаза
items.weapon.weaponeffects.weaponeffect.curse.desc=Это _проклинающая_ палочка. Её магия с вероятностью _20%_ ослабляет цель, снижая наносимый ею урон на _5%_ на _10 ходов_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Проклятие!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Вытягивающий
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s поглощения
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Эта палочка _вытягивает жизнь_. Её магия с вероятностью _20%_ наносит _8–16_ дополнительного магического урона и восстанавливает вам столько здоровья, сколько отняла у цели.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Поглощение!

items.armor.armorprefix.stalwart.name=%s стойкости
items.armor.armorprefix.stalwart.desc=Эта броня даёт _стойкость_. Атаки врагов с вероятностью _20%_ активируют _Крепость 5-го уровня_, снижая свой урон на _20%_.
items.armor.armorprefix.stalwart.activate=Крепость!

items.armor.armorprefix.vigilant.name=%s бдительности
items.armor.armorprefix.vigilant.desc=Эта броня даёт _бдительность_. С вероятностью _20%_ она позволяет уклониться от дальней атаки врага.
items.armor.armorprefix.vigilant.activate=Бдительность!

items.armor.armorprefix.elusive.name=%s неуловимости
items.armor.armorprefix.elusive.desc=Эта броня делает вас _неуловимым_. Получив урон от атаки врага, вы с вероятностью _20%_ повышаете уклонение на _5_ на _5 ходов_.
items.armor.armorprefix.elusive.activate=Уклонение!
