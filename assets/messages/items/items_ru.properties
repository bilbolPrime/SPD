items.amulet.ac_end=ЗАВЕРШИТЬ ИГРУ
items.amulet.ascent_desc=Вы начинаете чувствовать великую и ужасающую силу Йог-Дзевы, исходящую от амулета. Подняться обратно через подземелье в качестве смертного может оказаться сложнее, чем вы думали! Если вы продолжите подниматься с амулетом, подземелье станет опаснее, телепортация между этажами будет отключена, и вы сможете выиграть игру, только побеждая врагов по мере подъема через подземелье! Вы можете оставить амулет здесь, если хотите подняться, не начиная это испытание, или активировать амулет перед подъемом, чтобы закончить игру обычным способом.
items.amulet.ascent_no=Стоп на сегодня
items.amulet.ascent_title=Вознесение
items.amulet.ascent_yes=Продолжать!
items.amulet.desc=Амулет Йендора — самый могущественный артефакт, известный людям и гномам. Его сверкающие кристаллы обладают невероятной и чудесной силой.
items.amulet.desc_ascent=Происхождение амулета неизвестно, но очевидно, что на него сильно повлияла сила Йог-Дзевы. Подземелье, кажется, подчиняется воле Йога по мере вашего продвижения, из-за чего врагов становится намного больше и они становятся сильнее! Кроме того, вы больше не можете активировать или выбросить амулет, словно он проклят.
items.amulet.desc_origins=Происхождение амулета неизвестно. История гласит, что король гномов хвастался тем, что обнаружил артефакт незадолго до того, как гномья цивилизация разорвала с ним все контакты. Как он его нашел? Как Йог-Дзева забрал его у него? Возможно, это вопросы для другого раза, но сейчас важно лишь одно: амулет ваш!
items.amulet.discover_hint=Этот предмет можно найти на дне подземелья...
items.amulet.name=амулет Йендора
items.ankh.ac_bless=благословить
items.ankh.bless=Вы благословляете анкх волшебной водой.
items.ankh.desc=Древний символ бессмертия позволяет вернуться к жизни после смерти. При воскрешении теряются все предметы, которые не были надеты.
items.ankh.desc_blessed=Этот древний символ бессмертия дарует способность возвращаться к жизни после смерти. Анкх был освящен и теперь стал намного сильнее. Анкх пожертвует собой, чтобы спасти вас в момент смертельной опасности.
items.ankh.discover_hint=Этот товар можно приобрести в магазине.
items.ankh.name=анкх
items.arcaneresin.ac_apply=ПРИМЕНЯТЬ
items.arcaneresin.apply=Вы покрываете свою волшебную палочку смолой, увеличивая её мощность!
items.arcaneresin.desc=Этот мелкий порошок переливается оттенками фиолетового и белого. Он может усиливать магическую энергию, повышая уровень волшебных палочек при нанесении на них! Улучшение волшебной палочки стоит 1, 2 или 3 смолы в зависимости от начального уровня палочки. Смола может улучшить волшебные палочки максимум до +3. Однако улучшения, полученные с помощью смолы, _перекрываются другими источниками улучшений_ (например, свитками улучшений) и не применяются при зачаровании волшебной палочки в посох мага.
items.arcaneresin.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.arcaneresin.level_too_high=Эта насадка слишком мощная, чтобы смола могла её улучшить.
items.arcaneresin.name=таинственная смола
items.arcaneresin.not_enough=У вас недостаточно смолы для этого!
items.arcaneresin.prompt=Выберите волшебную палочку
items.armor.armor$glyph.discover_hint=Предмет с таким эффектом можно найти случайным образом в подземелье, или же можно попробовать применить его к предмету самостоятельно.
items.armor.armor$glyph.glyph=глиф
items.armor.armor$glyph.killed=%s убил тебя...
items.armor.armor$glyph.rankings_desc=Убит глифом
items.armor.armor.ac_detach=ОТСОЕДИНИТЬ
items.armor.armor.avg_absorb=Как правило, броня этого уровня блокирует урон от уровней %1$d и %2$d-%3$d и требует для корректного использования силы уровня %4$d.
items.armor.armor.curr_absorb=Эта броня уровня %1$d блокирует урон от %2$d-%3$d и требует для корректного использования силы %4$d.
items.armor.armor.cursed=В этих доспехах чувствуется зловещая магия.
items.armor.armor.cursed_worn=Поскольку эта броня проклята, вы не в силах снять её.
items.armor.armor.defense=Оно усовершенствовано для повышения уровня защиты.
items.armor.armor.detach_seal=Вы отсоединяете печать от доспехов.
items.armor.armor.equip_cursed=Броня болезненно сдавливает вас.
items.armor.armor.evasion=Оно усилено для повышения _уклонения_.
items.armor.armor.excess_str=Благодаря вашей избыточной силе, вы _более неуловимы_ в этих доспехах.
items.armor.armor.glyph_hardened=Оно затвердело.
items.armor.armor.hardened_no_glyph=Эти доспехи были _закалены_, но в настоящее время на них нет выгравированного глифа.
items.armor.armor.hardening_gone=Защитное покрытие на этих доспехах стерлось!
items.armor.armor.identify=Теперь вы достаточно хорошо знакомы со своими доспехами, чтобы их опознать.
items.armor.armor.incompatible=Взаимодействие различных видов магии стёрло глиф на этих доспехах!
items.armor.armor.inscribed=На нем выгравирована надпись _%s._
items.armor.armor.not_cursed=Эти доспехи свободны от злонамеренной магии.
items.armor.armor.probably_too_heavy=Вероятно, эта броня для тебя слишком тяжелая.
items.armor.armor.seal_attached=К этой броне прикреплена сломанная печать Воина. Когда его здоровье опустится ниже половины, печать даст ему _%d защиту_.
items.armor.armor.seal_transfer=Чтобы получить выгоду, сломанная печать Воина должна быть прикреплена к его текущей броне. Хотите ли вы автоматически отсоединить печать от снимаемой брони и прикрепить её к надеваемой броне?
items.armor.armor.seal_transfer_no=нет
items.armor.armor.seal_transfer_yes=да
items.armor.armor.too_heavy=Из-за недостаточной физической силы ношение этой брони снизит вашу способность двигаться, уклоняться и защищаться.
items.armor.armor.weak_cursed=Несмотря на проклятие, вы можете снять эту броню.
items.armor.classarmor.ac_ability=ВЫБЕРИТЕ СПОСОБНОСТЬ
items.armor.classarmor.ac_transfer=ПЕРЕДАЧА
items.armor.classarmor.charge_use=Использование этой способности прямо сейчас приведет к расходованию заряда _%s_.
items.armor.classarmor.discover_hint=Этот предмет можно найти после победы над боссом 20-го этажа, используя определённого героя.
items.armor.classarmor.low_charge=Броня не обладает достаточным зарядом для использования своей особой способности!
items.armor.classarmor.no_ability=В данный момент ваша броня не обладает никакими способностями, вам следует выбрать одну!
items.armor.classarmor.not_equipped=Чтобы использовать эту особую силу, необходимо носить эти доспехи!
items.armor.classarmor.transfer_cancel=отмена
items.armor.classarmor.transfer_complete=Свойства вашей героической брони перенесены!
items.armor.classarmor.transfer_desc=Магию короны короля гномов можно перенести на другой комплект доспехов. Обратите внимание, что при этом оригинальные доспехи будут уничтожены.
items.armor.classarmor.transfer_prompt=Выберите доспехи
items.armor.classarmor.transfer_title=Переносная броня
items.armor.clericarmor.desc=Нося эту смесь ткани и лат, жрец может использовать особую способность.
items.armor.clericarmor.name=облачения героя
items.armor.clotharmor.desc=Этот лёгкий бронежилет обеспечивает базовую защиту.
items.armor.clotharmor.discover_hint=Один из героев начинает игру с этим предметом.
items.armor.clotharmor.name=тканевые доспехи
items.armor.curses.antientropy.desc=Проклятие «Антиэнтропия» действует против сил Вселенной, притягивая энергию к носителю и отводя её от окружающего мира. Это на короткое время поджигает носителя, но замораживает всё вокруг!
items.armor.curses.antientropy.name=%s антиэнтропии
items.armor.curses.bulk.desc=Броня, придающая ей массивность, выглядит крупнее и внушительнее, но на самом деле не обеспечивает повышенной защиты. Хуже того, увеличенные размеры значительно затрудняют проход в дверные проемы.
items.armor.curses.bulk.name=%s в большом количестве
items.armor.curses.corrosion.desc=Коррозионный слой способен лопнуть, выпустив едкую жидкость и покрыв все вокруг липкой кислотной слизью.
items.armor.curses.corrosion.name=%s коррозии
items.armor.curses.displacement.desc=Проклятие перемещения пытается переместить владельца в безопасное место при нападении. Однако оно слишком эффективно, случайным образом телепортируя пользователя по уровню.
items.armor.curses.displacement.name=%s смещения
items.armor.curses.metabolism.desc=Проклятие метаболизма напрямую преобразует чувство сытости в здоровье, когда его обладатель получает травму, обеспечивая ускоренное заживление, но быстро вызывая голодание.
items.armor.curses.metabolism.name=%s метаболизма
items.armor.curses.multiplicity.desc=Броня, проклятая способностью к кратности, содержит опасную магию дублирования. Иногда она создает зеркальное отражение владельца, но с той же вероятностью может создать копию нападающего!
items.armor.curses.multiplicity.name=%s кратности
items.armor.curses.overgrowth.desc=«Броня из разросшихся растений» покрыта различными цветущими растениями. Хотя этот эффект, безусловно, выглядит интересно, он никак не защищает, и эти растения будут случайным образом активироваться в бою!
items.armor.curses.overgrowth.name=%s чрезмерного роста
items.armor.curses.stench.desc=Броня, проклятая зловонием, будет выпускать облака ядовитого газа, опасного для всего, что попадет в это облако.
items.armor.curses.stench.name=%s зловония
items.armor.duelistarmor.desc=В этих пластинчатых доспехах и плаще дуэлист может использовать особую способность.
items.armor.duelistarmor.name=нагрудник героя
items.armor.glyphs.affection.desc=Этот мощный символ манипулирует сознанием нападающих, временно очаровывая их.
items.armor.glyphs.affection.name=%s привязанности
items.armor.glyphs.antimagic.desc=Этот мощный глиф позволяет доспехам защищать своего владельца как от магических, так и от физических атак. Уровень доспехов не влияет на эту магическую защиту.
items.armor.glyphs.antimagic.name=%s антимагии
items.armor.glyphs.brimstone.desc=Этот глиф защищает владельца и его имущество от огня, полностью нейтрализуя его разрушительное воздействие и негативные последствия.
items.armor.glyphs.brimstone.name=%s серы
items.armor.glyphs.camouflage.desc=Этот глиф позволяет владельцу сливаться с высокой травой, даруя ему временную невидимость.
items.armor.glyphs.camouflage.name=%s камуфляжа
items.armor.glyphs.entanglement.desc=Этот глиф создает вокруг владельца земляную броню, поглощающую урон, но эта броня сломается, если владелец пошевелится.
items.armor.glyphs.entanglement.name=%s запутанности
items.armor.glyphs.flow.desc=Этот глиф управляет потоком воды вокруг владельца, позволяя ему значительно быстрее передвигаться в ней.
items.armor.glyphs.flow.name=%s потока
items.armor.glyphs.obfuscation.desc=Этот символ скрывает того, кто его носит, что затрудняет его обнаружение.
items.armor.glyphs.obfuscation.name=%s обфускации
items.armor.glyphs.potential.desc=Этот глиф накапливает энергию при ударе, передавая заряд волшебной палочке владельца при активации.
items.armor.glyphs.potential.name=%s потенциала
items.armor.glyphs.repulsion.desc=Этот символ отражает силу удара по нападающим, отбрасывая их назад.
items.armor.glyphs.repulsion.name=%s отталкивания
items.armor.glyphs.stone.desc=Этот глиф окружает доспехи тяжелым магическим камнем, который делает уклонение невозможным, но блокирует урон пропорционально умению уклоняться.
items.armor.glyphs.stone.name=%s камня
items.armor.glyphs.swiftness.desc=Этот глиф увеличивает скорость владельца, когда тот находится вдали от врага.
items.armor.glyphs.swiftness.name=%s быстроты
items.armor.glyphs.thorns.desc=Этот мощный глиф наносит вред нападающим, вызывая у них медленное кровотечение при нападении на владельца.
items.armor.glyphs.thorns.name=%s шипов
items.armor.glyphs.viscosity$defereddamage.desc=Ущерб наносится постепенно, а не мгновенно. \n\nОставшийся отложенный ущерб: %d.
items.armor.glyphs.viscosity$defereddamage.name=отложенный ущерб
items.armor.glyphs.viscosity$defereddamage.ondeath=Отложенный ущерб погубил вас...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Погиб в результате отложенного ущерба
items.armor.glyphs.viscosity.deferred=отложенный %d
items.armor.glyphs.viscosity.desc=Этот глиф способен сохранять информацию о нанесенном владельцу уроне, нанося его постепенно, а не сразу.
items.armor.glyphs.viscosity.name=%s вязкости
items.armor.huntressarmor.desc=Надев этот плащ, Охотница может использовать особую способность.
items.armor.huntressarmor.name=плащ героя
items.armor.huntressarmor.no_enemies=Врагов не видно.
items.armor.leatherarmor.desc=Броня, изготовленная из дубленой шкуры монстра. Не такая легкая, как тканевая броня, но обеспечивает лучшую защиту.
items.armor.leatherarmor.name=кожаные доспехи
items.armor.magearmor.desc=Надев эту великолепную мантию, маг может использовать особую способность.
items.armor.magearmor.name=мантия героя
items.armor.mailarmor.desc=Взаимосвязанные металлические звенья образуют прочный, но гибкий доспех.
items.armor.mailarmor.name=кольчужные доспехи
items.armor.platearmor.desc=Огромные металлические пластины соединены между собой, образуя костюм, обеспечивающий непревзойденную защиту любому искателю приключений, достаточно сильному, чтобы выдержать его ошеломляющий вес.
items.armor.platearmor.name=пластинчатая броня
items.armor.roguearmor.desc=В этом темном одеянии Разбойник может использовать особую способность.
items.armor.roguearmor.name=одежда героя
items.armor.scalearmor.desc=Металлические чешуйки, пришитые к кожаному жилету, создают гибкую, но при этом защитную броню.
items.armor.scalearmor.name=чешуйчатая броня
items.armor.warriorarmor.desc=В этих тяжелых пластинчатых доспехах воин может использовать особую способность.
items.armor.warriorarmor.name=броня героя
items.artifacts.alchemiststoolkit.ac_brew=ПИВО
items.artifacts.alchemiststoolkit.ac_energize=ВДОХНОВИТЬ
items.artifacts.alchemiststoolkit.cursed=Ваш проклятый набор инструментов не позволяет вам использовать алхимию!
items.artifacts.alchemiststoolkit.desc=Этот набор содержит ряд реагентов и трав, а также небольшой флакон для смешивания, позволяющий заниматься алхимией на ходу. Флакон содержит вещества, похожие на алхимические энергетические кристаллы в жидкой форме.
items.artifacts.alchemiststoolkit.desc_cursed=Проклятый набор инструментов привязался к вам и не позволяет использовать алхимию.
items.artifacts.alchemiststoolkit.desc_hint=По мере накопления опыта, комплект инструментов постепенно генерирует алхимическую энергию. Похоже, что состав смеси во флаконе можно улучшить, добавив в неё энергетические кристаллы.
items.artifacts.alchemiststoolkit.desc_warming=Набор инструментов сейчас находится в стадии подготовки и будет готов к использованию через некоторое время.
items.artifacts.alchemiststoolkit.energize_1=6 энергии: +1 уровень
items.artifacts.alchemiststoolkit.energize_all=Энергия %1$d: уровни +%2$d
items.artifacts.alchemiststoolkit.energize_desc=Каждые 6 энергетических кристаллов дадут набору инструментов достаточно энергии для повышения уровня, что увеличивает скорость выработки энергии набором инструментов с течением времени и скорость его нагрева. Сколько энергии вы хотели бы использовать?
items.artifacts.alchemiststoolkit.name=набор инструментов алхимика
items.artifacts.alchemiststoolkit.need_energy=Для этого вам потребуется как минимум 6 единиц энергии.
items.artifacts.alchemiststoolkit.not_ready=Ваш набор инструментов еще не полностью разогрелся.
items.artifacts.artifact.cannot_wear_two=Нельзя носить два одинаковых артефакта.
items.artifacts.artifact.curse_known=В этом артефакте ощущается зловещая магия.
items.artifacts.artifact.equip_cursed=Этот артефакт мучительно привязывается к вам.
items.artifacts.artifact.need_to_equip=Для этого вам нужно экипировать свой артефакт.
items.artifacts.artifact.not_cursed=Этот артефакт свободен от злонамеренной магии.
items.artifacts.capeofthorns$thorns.desc=Ваш плащ излучает энергию, окружая вас полем отклоняющей силы! \n\n Весь получаемый вами урон уменьшается, пока активен эффект шипов. Кроме того, если атакующий находится рядом с вами, уменьшенная величина урона отражается обратно на атакующего. \n\n Осталось ходов шипов: %s.
items.artifacts.capeofthorns$thorns.inert=Ваш плащ снова становится инертным.
items.artifacts.capeofthorns$thorns.levelup=Ваш плащ становится крепче!
items.artifacts.capeofthorns$thorns.name=шипы
items.artifacts.capeofthorns$thorns.radiating=Ваш плащ начинает излучать энергию, вы чувствуете себя защищенными!
items.artifacts.capeofthorns.desc=Эти обломки металла от DM-300 слились воедино, образовав жесткий плащ. Кажется, он хранит в себе некую скрытую энергию, возможно, часть силы DM-300?
items.artifacts.capeofthorns.desc_active=Кажется, что плащ высвобождает накопленную энергию, излучая защитное действие.
items.artifacts.capeofthorns.desc_inactive=Накидка приятно тяжело давит на плечи, кажется, она набирает энергию от полученных повреждений.
items.artifacts.capeofthorns.name=терновый мыс
items.artifacts.chaliceofblood.ac_prick=УКОЛОТЬ
items.artifacts.chaliceofblood.desc=Этот сверкающий серебряный кубок необычно украшен острыми драгоценными камнями по краю.
items.artifacts.chaliceofblood.desc_1=Держа чашу в руках, вы испытываете странное желание уколоться острыми драгоценными камнями.
items.artifacts.chaliceofblood.desc_2=Часть вашей крови скапливается в чаше, вы едва ощущаете, как чаша наполняет вас жизненной энергией, усиливая естественную регенерацию здоровья. Вам все еще хочется порезаться о чашу, хотя вы знаете, что это будет больно.
items.artifacts.chaliceofblood.desc_3=Чаша до краев наполнена вашей жизненной энергией. Вы чувствуете, как чаша возвращает вам эту энергию.
items.artifacts.chaliceofblood.desc_cursed=Проклятая чаша привязалась к твоей руке и препятствует восстановлению здоровья.
items.artifacts.chaliceofblood.name=чаша крови
items.artifacts.chaliceofblood.no=Нет, я передумал.
items.artifacts.chaliceofblood.ondeath=Чаша высасывает из вас всю жизненную энергию...
items.artifacts.chaliceofblood.onprick=Вы укололись, и вся ваша жизненная энергия испарилась в чашу.
items.artifacts.chaliceofblood.prick_warn=Каждый раз, когда вы используете чашу, она будет истощать вашу жизненную энергию, но взамен будет усиливать вашу естественную регенерацию здоровья. В настоящее время укол наносит _%1$d-%2$d урона_, хотя этот урон может быть уменьшен _как физическим, так и магическим блокированием или снижением урона_. Без учета эффектов снижения урона, укол в настоящее время имеет _%3$s%% шанс_ полностью истощить вашу жизненную силу. Вы уверены, что хотите дать чаше больше жизненной энергии?
items.artifacts.chaliceofblood.yes=Да, я знаю, что делаю.
items.artifacts.cloakofshadows$cloakstealth.desc=Ваш плащ теней дарует вам невидимость, пока вы им окутаны. Вы останетесь невидимым, пока эффект не будет снят или пока не закончится заряд плаща. Пока вы невидимы, враги не могут атаковать вас или следовать за вами. Физические атаки и магические эффекты (такие как свитки и жезлы) немедленно снимают невидимость. Количество ходов до использования заряда: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=Твой плащ становится крепче!
items.artifacts.cloakofshadows$cloakstealth.name=закутанная
items.artifacts.cloakofshadows$cloakstealth.no_charge=В вашем плаще закончилась энергия.
items.artifacts.cloakofshadows.ac_stealth=СКРЫТНОСТЬ
items.artifacts.cloakofshadows.cooldown=Вашему плащу требуется %d больше патронов для восстановления энергии.
items.artifacts.cloakofshadows.cursed=Использовать проклятый плащ нельзя.
items.artifacts.cloakofshadows.desc=Бесценный волшебный плащ, украденный много лет назад из королевской оружейной Разбойником. При ношении он позволяет на короткое время стать совершенно невидимым. Чем чаще используется плащ, тем сильнее он становится, позволяя Разбойнику становиться невидимым чаще и на более длительное время.
items.artifacts.cloakofshadows.discover_hint=Один из героев начинает игру с этим предметом.
items.artifacts.cloakofshadows.name=плащ теней
items.artifacts.cloakofshadows.no_charge=Ваш плащ ещё недостаточно зарядился, чтобы его можно было использовать.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Как ты это пережил?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Как бы мне хотелось иметь такой...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=О боже! Ты всё ещё жив!
items.artifacts.driedrose$ghosthero.def_verb=увернулся
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Извините... удачи...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Заверши это... без меня...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Нет... я не могу...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Удачи...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Устал... пока что...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Я вернусь...
items.artifacts.driedrose$ghosthero.desc=Хрупкая, эфирная фигура человекоподобной формы. Её сила, похоже, связана с розой, которая у тебя есть. Этот призрак, возможно, ничего собой не представляет, но, кажется, он твой единственный настоящий друг здесь, внизу.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Почему это происходит? Я думал, мы добились успеха.
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Как эта штука до сих пор способна влиять на этот мир?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Надеюсь, вы знаете, что делаете с этим амулетом.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Полагаю, мы еще не закончили.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Мы уже так далеко продвинулись, мы можем это закончить!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Проедем еще немного, и мы сможем отсюда выбраться!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Здесь очень давно не было ни людей, ни карликов.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Что могло заставить гномов бросить золотой рудник?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Жаль, что всё это золото здесь бесполезно на поверхности.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Здесь обитают изуродованные существа, точно такие же, как в канализации.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Даже летучие мыши здесь кровожадны.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Никаких следов горнодобывающего оборудования не обнаружено, неужели гномы всё забрали себе?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Гномы были трудолюбивы, но жадны.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Так что гномий мегаполис действительно пал.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Надеюсь, поверхность никогда не окажется в таком состоянии.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Гномы не должны выглядеть такими бледными.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Я не знаю, что хуже: гномы или их творения.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Похоже, гномы теперь тоже превратились в безмозглых чудовищ.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Что это за место?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Это место ужасно...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=О чём думали гномы, играя с властью таким образом?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Эти монстры — существа из другого мира, откуда они взялись?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Вы это чувствуете? Как будто за нами кто-то наблюдает.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Слава богу, есть факелы, здесь так темно!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Я слышал об этом месте разные истории, ничего хорошего.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Это место всегда больше напоминало темницу, чем тюрьму.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Я даже не могу представить, что происходило, когда это место было заброшено.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Похоже, и заключенные, и охранники превратились в чудовищ.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Что могло стать причиной появления всех этих скелетов?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Эти люди не должны были оказаться в таком положении...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Раньше эти канализационные каналы были безопасными, люди даже жили здесь зимой.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Интересно, что случилось с патрулями охраны, они что, сдались?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=У меня на поверхности были родственники, надеюсь, они в безопасности.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Охранники не смогли победить этих монстров, но, может быть, сможем.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Если даже канализация настолько опасна, интересно, что же находится под ней...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Что могло стать причиной того, что эти крысы и крабы выросли до таких размеров?
items.artifacts.driedrose$ghosthero.direct_prompt=Что я должен делать?
items.artifacts.driedrose$ghosthero.directed_attack_1=Хорошо, я займусь этим вопросом.
items.artifacts.driedrose$ghosthero.directed_attack_2=Я возьму этот.
items.artifacts.driedrose$ghosthero.directed_attack_3=Увлекательно...
items.artifacts.driedrose$ghosthero.directed_attack_4=Давайте их заполучим!
items.artifacts.driedrose$ghosthero.directed_attack_5=У меня есть такой.
items.artifacts.driedrose$ghosthero.directed_follow_1=Хорошо, я пойду за тобой.
items.artifacts.driedrose$ghosthero.directed_follow_2=Я пойду следом за тобой.
items.artifacts.driedrose$ghosthero.directed_follow_3=Следую за тобой...
items.artifacts.driedrose$ghosthero.directed_follow_4=Хорошо, поехали!
items.artifacts.driedrose$ghosthero.directed_follow_5=Я тебя поддержу.
items.artifacts.driedrose$ghosthero.directed_position_1=Хорошо, я останусь при своем мнении.
items.artifacts.driedrose$ghosthero.directed_position_2=Я пойду туда и буду защищаться.
items.artifacts.driedrose$ghosthero.directed_position_3=Перепозиционирование...
items.artifacts.driedrose$ghosthero.directed_position_4=На моем пути!
items.artifacts.driedrose$ghosthero.directed_position_5=Я пойду туда.
items.artifacts.driedrose$ghosthero.discover_hint=Этот персонаж встречается у определённого артефакта.
items.artifacts.driedrose$ghosthero.hello=Привет ещё раз, %s.
items.artifacts.driedrose$ghosthero.introduce=Моя душа связана с этой розой, она была для меня очень дорога, подарок от моей любимой, которую я оставила на поверхности. Я не могу вернуться к нему, но благодаря тебе у меня есть второй шанс завершить свой путь. Когда я смогу, я отвечу на твой зов и буду сражаться вместе с тобой. Пока у тебя есть роза, я слышу твой голос, поэтому ты можешь использовать его, чтобы направлять меня издалека. Надеюсь, тебе удастся добиться успеха там, где я потерпела неудачу...
items.artifacts.driedrose$ghosthero.name=грустный призрак
items.artifacts.driedrose$ghosthero.player_killed_1=Нет!...
items.artifacts.driedrose$ghosthero.player_killed_2=Я ничем не мог им помочь...
items.artifacts.driedrose$ghosthero.player_killed_3=Не так...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Только гномы могли построить горнодобывающую машину, которая убивает нарушителей.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Эта штука огромная...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Как эта штука оставалась активной так долго?
items.artifacts.driedrose$ghosthero.seen_goo_1=Осторожно, слизь!
items.artifacts.driedrose$ghosthero.seen_goo_2=Многие мои друзья погибли от этой штуки, пришло время мести!
items.artifacts.driedrose$ghosthero.seen_goo_3=Такому чудовищу нельзя позволять существовать!
items.artifacts.driedrose$ghosthero.seen_king_1=Когда говорят, что власть развращает, имеют в виду именно это.
items.artifacts.driedrose$ghosthero.seen_king_2=Теперь он скорее лич, чем король.
items.artifacts.driedrose$ghosthero.seen_king_3=Даже после смерти гномы повинуются своему господину.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Оставшийся в живых заключенный — смертельно опасный убийца. Разумеется...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Он заманил нас в ловушку!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Я слышал ужасные истории об этой маске...
items.artifacts.driedrose$ghosthero.seen_yog_1=О, это выглядит не очень хорошо.
items.artifacts.driedrose$ghosthero.seen_yog_2=Так вот как выглядит бог?
items.artifacts.driedrose$ghosthero.seen_yog_3=Это будет больно...
items.artifacts.driedrose$petal.desc=Хрупкий, засохший лепесток, который каким-то чудом уцелел в подземелье.
items.artifacts.driedrose$petal.levelup=Вы добавляете лепесток к розе.
items.artifacts.driedrose$petal.maxlevel=Роза готова!
items.artifacts.driedrose$petal.name=высушенный лепесток
items.artifacts.driedrose$petal.no_room=Для этого лепестка места больше нет, поэтому его нужно выбросить.
items.artifacts.driedrose$petal.no_rose=У вас нет розы, к которой можно было бы прикрепить этот лепесток.
items.artifacts.driedrose$wndghosthero.armor_prompt=Выберите доспехи
items.artifacts.driedrose$wndghosthero.cant_cursed=Призрак может использовать только то снаряжение, в котором вы уверены, что оно не проклято.
items.artifacts.driedrose$wndghosthero.cant_strength=Призрак недостаточно силен, чтобы использовать это.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Возможно, призрак недостаточно силен, чтобы использовать это.
items.artifacts.driedrose$wndghosthero.cant_unique=Призрак не может использовать уникальные предметы.
items.artifacts.driedrose$wndghosthero.desc=Сам по себе призрак слаб, но его форма достаточно прочна, чтобы надеть на него оружие и доспехи. Он сможет использовать эти предметы так же, как и вы. В настоящее время призрак может экипировать предметы, требующие силы до _%d._
items.artifacts.driedrose$wndghosthero.title=Снаряжение Призрака
items.artifacts.driedrose$wndghosthero.weapon_prompt=Выберите оружие
items.artifacts.driedrose.ac_direct=ПРЯМОЙ
items.artifacts.driedrose.ac_outfit=ОДЕЖДА
items.artifacts.driedrose.ac_summon=ПРИЗВАТЬ
items.artifacts.driedrose.charged=Ваша роза полностью заряжена!
items.artifacts.driedrose.cursed=Вы не можете использовать проклятую розу.
items.artifacts.driedrose.desc=Это та самая роза, о которой упоминал призрак перед своим исчезновением? Кажется, она обладает какой-то духовной силой, возможно, её можно использовать для направления энергии того пропавшего воина.
items.artifacts.driedrose.desc_armor=Броня Призрака: %s
items.artifacts.driedrose.desc_cursed=Проклятая роза привязана к твоей руке, она жутко холодная на ощупь.
items.artifacts.driedrose.desc_hint=Кажется, у розы не хватает нескольких лепестков. Возможно, если их прикрепить обратно, она станет крепче.
items.artifacts.driedrose.desc_no_quest=Высохшая, засохшая роза, которая каким-то образом всё ещё держится, несмотря на свой возраст. Кажется, она обладает какой-то духовной силой, но вы понятия не имеете, как её использовать прямо сейчас.
items.artifacts.driedrose.desc_strength=Сила Призрака: %s
items.artifacts.driedrose.desc_weapon=Оружие Призрака: %s
items.artifacts.driedrose.name=сушеная роза
items.artifacts.driedrose.no_charge=Ваша роза ещё не полностью заряжена.
items.artifacts.driedrose.no_space=В вашем районе нет свободных мест.
items.artifacts.driedrose.spawned=Вы уже призвали призрака.
items.artifacts.etherealchains$chainsrecharge.levelup=Ваши цепи становятся крепче!
items.artifacts.etherealchains.ac_cast=БРОСАТЬ
items.artifacts.etherealchains.cant_pull=Ваши цепи не смогут сдвинуть эту цель.
items.artifacts.etherealchains.cant_reach=Ваши цепи туда не дотянутся.
items.artifacts.etherealchains.cursed=Использовать проклятые цепи нельзя.
items.artifacts.etherealchains.desc=Эти большие, но легкие цепи светятся духовной энергией. Их можно использовать, чтобы притягивать вас к местности или притягивать к себе врагов. Эфирная природа цепей позволяет им даже проходить сквозь стены!
items.artifacts.etherealchains.desc_cursed=Проклятые цепи прикованы к вам, постоянно раскачиваются, пытаясь споткнуть или связать вас.
items.artifacts.etherealchains.desc_equipped=Цепи окружают вас сбоку, медленно высасывая духовную энергию тех, кого вы побеждаете. Каждый заряд — это звено в цепи, которая простирается ровно на одну клетку.
items.artifacts.etherealchains.does_nothing=Это ни к чему не приведёт.
items.artifacts.etherealchains.inside_wall=Ваши цепи могут протянуть вас только сквозь стены, но не в них.
items.artifacts.etherealchains.name=эфирные цепи
items.artifacts.etherealchains.no_charge=В ваших цепях недостаточно заряда.
items.artifacts.etherealchains.nothing_to_grab=Там не за что ухватиться.
items.artifacts.etherealchains.prompt=Выберите целевое местоположение.
items.artifacts.etherealchains.rooted=Пока вы стоите на месте, цепи не смогут вас тянуть.
items.artifacts.holytome.ac_cast=БРОСАТЬ
items.artifacts.holytome.cursed=Использовать проклятый фолиант нельзя.
items.artifacts.holytome.desc=Священный фолиант, служащий центром божественной магии жреца. Использование фолианта позволяет жрецу применять различные магические заклинания. Мощь фолианта будет неуклонно расти по мере его использования, увеличивая максимальное количество зарядов и немного повышая скорость перезарядки.
items.artifacts.holytome.discover_hint=Один из героев начинает игру с этим предметом.
items.artifacts.holytome.levelup=Твоя воля становится сильнее!
items.artifacts.holytome.name=святой фолиант
items.artifacts.holytome.no_spell=В данный момент вы не можете произнести это заклинание.
items.artifacts.hornofplenty.ac_eat=ЕСТЬ
items.artifacts.hornofplenty.ac_snack=ЗАКУСКА
items.artifacts.hornofplenty.ac_store=МАГАЗИН
items.artifacts.hornofplenty.desc=В этот рог нельзя подуть, но, похоже, он наполняется едой по мере ваших приключений и накопления опыта. Вы можете использовать каждый заряд отдельно в качестве перекуса или есть, пока не насытитесь.
items.artifacts.hornofplenty.desc_cursed=Проклятый рог прирос к вашему боку, кажется, он больше стремится забирать пищу, чем производить её.
items.artifacts.hornofplenty.desc_hint=Возможно, есть способ увеличить силу рога, обеспечив его энергией за счет питания.
items.artifacts.hornofplenty.eat=Вы едите из рога.
items.artifacts.hornofplenty.feed=Рог поедает ваше пищевое подношение.
items.artifacts.hornofplenty.full=Твой рог полон еды!
items.artifacts.hornofplenty.levelup=Рог поглощает вашу подношения и становится всё сильнее!
items.artifacts.hornofplenty.maxlevel=Ваш рог съел всю пищу, которую смог!
items.artifacts.hornofplenty.name=рог изобилия
items.artifacts.hornofplenty.no_food=В вашем роге нет еды!
items.artifacts.hornofplenty.prompt=Выберите несколько продуктов
items.artifacts.hornofplenty.reject=Ваш рог отторгает недоваренные, безвкусные фрукты.
items.artifacts.lloydsbeacon.ac_return=ВОЗВРАЩАТЬСЯ
items.artifacts.lloydsbeacon.ac_set=НАБОР
items.artifacts.lloydsbeacon.ac_zap=ЗАП
items.artifacts.lloydsbeacon.creatures=Психическая аура соседних существ не позволяет вам использовать маяк Ллойда в данный момент.
items.artifacts.lloydsbeacon.desc=Маяк Ллойда — это сложное магическое устройство, которое даёт пользователю контроль над магией телепортации. Маяк можно использовать для возвращения в заданное место, а также для испускания случайных вспышек магии телепортации после того, как он зарядится после экипировки. Эта магия может быть направлена на цель или на самого пользователя.
items.artifacts.lloydsbeacon.desc_set=Этот маяк был установлен где-то на уровне %d в игре Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Ваш маяк становится всё сильнее!
items.artifacts.lloydsbeacon.name=маяк Ллойда
items.artifacts.lloydsbeacon.no_charge=Вашему маяку сейчас не хватает энергии.
items.artifacts.lloydsbeacon.preventing=Сильная магическая аура этого места не позволяет вам использовать маяк Ллойда!
items.artifacts.lloydsbeacon.prompt=Выберите место для воздействия.
items.artifacts.lloydsbeacon.return=Сигнальный маяк Ллойда успешно установлен в вашем текущем местоположении, теперь вы можете вернуться сюда в любое время.
items.artifacts.lloydsbeacon.tele_fail=Магия телепортации не сработала.
items.artifacts.masterthievesarmband.ac_steal=ВОРОВАТЬ
items.artifacts.masterthievesarmband.cursed=Использовать проклятую повязку нельзя.
items.artifacts.masterthievesarmband.desc=Этот фиолетовый бархатный браслет носит клеймо опытного вора. Он не ваш, но, вероятно, и не принадлежал своему предыдущему владельцу.
items.artifacts.masterthievesarmband.desc_cursed=Проклятый браслет прикован к вашему запястью, и почему-то ваш мешочек с золотом постепенно становится легче...
items.artifacts.masterthievesarmband.desc_worn=По мере накопления опыта вы чувствуете, как в браслете на вашем запястье нарастает сила. Вы можете использовать эту силу, чтобы воровать из магазинов или грабить врагов! Ограбление врагов происходит мгновенно, ненадолго дезориентирует их и дает вам шанс забрать их добычу! Эта сила более эффективна против ничего не подозревающих врагов. Многократное ограбление одного и того же врага не увеличивает ваши шансы на получение добычи.
items.artifacts.masterthievesarmband.failed_steal=Тебе не удалось ничего украсть.
items.artifacts.masterthievesarmband.full=Ваш браслет полностью заряжен!
items.artifacts.masterthievesarmband.level_up=Ваша нарукавная повязка становится всё крепче!
items.artifacts.masterthievesarmband.name=Нарукавная повязка мастера-вора
items.artifacts.masterthievesarmband.no_charge=В вашем нарукавном браслете недостаточно заряда.
items.artifacts.masterthievesarmband.no_steal=Этому врагу нечего красть.
items.artifacts.masterthievesarmband.no_target=Вы должны нацелиться на врага, находящегося рядом с вами.
items.artifacts.masterthievesarmband.prompt=Выберите врага, на которого хотите нацелиться.
items.artifacts.masterthievesarmband.steal_shopkeeper=Нельзя красть напрямую у продавцов в магазинах.
items.artifacts.masterthievesarmband.stole_item=Вы украли предмет: %s.
items.artifacts.sandalsofnature.absorb_seed=Обувь впитывает семена, поэтому кажется, что они выглядят здоровее.
items.artifacts.sandalsofnature.ac_feed=КОРМИТЬ
items.artifacts.sandalsofnature.ac_root=КОРЕНЬ
items.artifacts.sandalsofnature.desc_1=То, что сначала кажется сандалиями из бечёвки, на самом деле — два растения! Они выглядят очень слабыми и бледными, возможно, им нужно подкормиться?
items.artifacts.sandalsofnature.desc_2=Обувь выросла и теперь больше напоминает две туфли, сшитые на заказ. В них вернулся цвет, возможно, они еще могут вырасти?
items.artifacts.sandalsofnature.desc_3=Растения снова подросли и теперь напоминают пару прочных сапог из коры. Кажется, растения восстановили свои силы, но, возможно, они еще смогут вырасти?
items.artifacts.sandalsofnature.desc_4=Растения, похоже, достигли своего максимального размера, они напоминают пару бронированных поножей. Поножи имеют темно-коричневый цвет и напоминают очень крепкое дерево.
items.artifacts.sandalsofnature.desc_ability=Обувь переливается цветом последнего семени, которым вы их подкормили. Они могут ненадолго укорениться в земле и вызвать эффект этого растения в любом месте в радиусе 3 клеток. \nСемя: _%s_\nНеобходимый заряд: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Проклятые сандалии препятствуют установлению связи с природой.
items.artifacts.sandalsofnature.desc_hint=Ношение этого украшения позволит вам почувствовать себя ближе к природе.
items.artifacts.sandalsofnature.desc_seeds=Вы посадили семена в обувь %d.
items.artifacts.sandalsofnature.levelup=Размер вашей обуви резко увеличился!
items.artifacts.sandalsofnature.low_charge=Вашей обуви не хватит энергии для этого.
items.artifacts.sandalsofnature.name=сандалии природы
items.artifacts.sandalsofnature.name_1=обувь природы
items.artifacts.sandalsofnature.name_2=сапоги природы
items.artifacts.sandalsofnature.name_3=набедренники природы
items.artifacts.sandalsofnature.no_effect=Сначала нужно скормить семечко своей обуви.
items.artifacts.sandalsofnature.out_of_range=Это местоположение находится вне зоны действия.
items.artifacts.sandalsofnature.prompt=Выберите семя
items.artifacts.sandalsofnature.prompt_target=Выберите местоположение
items.artifacts.skeletonkey$keywall.desc=Здесь, с помощью скелетного ключа, воздвигнута временная магическая стена.
items.artifacts.skeletonkey.ac_insert=ВСТАВЛЯТЬ
items.artifacts.skeletonkey.crystal_charges=Для открытия кристаллического замка требуется 5 зарядов.
items.artifacts.skeletonkey.cursed=Использовать проклятый скелетный ключ невозможно.
items.artifacts.skeletonkey.desc=Важный на вид ключ с головкой в форме черепа. Кажется, что его зубы каждый раз выглядят по-разному.
items.artifacts.skeletonkey.desc_cursed=Проклятый ключ, похоже, всячески избегает входить в любой замок и даже затрудняет (но не делает невозможным) использование других ваших ключей.
items.artifacts.skeletonkey.desc_worn=Этот волшебный ключ, кажется, набирает силу по мере использования вместо обычных ключей подземелья. Его можно вставить практически в любой замок подземелья, чтобы открыть или закрыть его, включая двери, которые никогда раньше не были заперты. Ключ можно даже использовать на пустом пространстве в одном из основных или диагональных направлений, чтобы «заблокировать» пространство перед собой, создав сплошную стену шириной в 3 клетки, которая продержится 10 ходов. Блокировка оттолкнет врагов, если для этого есть место.
items.artifacts.skeletonkey.discard=Выбрасываете лишние ключи.
items.artifacts.skeletonkey.force_lock=Замок ослабел без вашего самодельного ключа. Вам удаётся его взломать.
items.artifacts.skeletonkey.gold_charges=Для открытия золотого замка требуется 2 заряда.
items.artifacts.skeletonkey.invalid_target=Там нечего запирать или отпирать.
items.artifacts.skeletonkey.iron_charges=Для открытия обычного замка требуется 1 заряд.
items.artifacts.skeletonkey.levelup=Ваш универсальный ключ становится сильнее!
items.artifacts.skeletonkey.lock_charges=Для запирания двери требуется 2 заряда.
items.artifacts.skeletonkey.lock_no_space=Нельзя запереть персонажа внутри двери!
items.artifacts.skeletonkey.locked_with_key=Эта дверь была заперта вашим самодельным ключом.
items.artifacts.skeletonkey.name=скелетный ключ
items.artifacts.skeletonkey.prompt=Выберите цель
items.artifacts.skeletonkey.wall_charges=Для создания временной стены требуется 2 заряда.
items.artifacts.skeletonkey.wont_open=Ключ почему-то не подходит к этому замку.
items.artifacts.talismanofforesight$foresight.desc=Вы испытываете сильное волнение, как будто где-то рядом таится невидимая опасность.
items.artifacts.talismanofforesight$foresight.name=предвидение
items.artifacts.talismanofforesight$foresight.uneasy=Вы чувствуете беспокойство.
items.artifacts.talismanofforesight.ac_scry=СКАРИ
items.artifacts.talismanofforesight.desc=Гладкий камень со странными гравировками. Создается ощущение, что он наблюдает за всем вокруг, высматривая все, что может спрятаться.
items.artifacts.talismanofforesight.desc_cursed=Проклятый талисман пристально смотрит на вас, притупляя ваши чувства.
items.artifacts.talismanofforesight.desc_worn=Когда вы держите талисман, вы чувствуете, как ваши чувства обостряются. Талисман постепенно накапливает заряд с течением времени, и вы можете обнаружить скрытые двери или ловушки. Талисман может расходовать свой заряд, чтобы «прорицать» в форме конуса, который показывает все клетки и секреты в сканируемой области и на короткое время дает вам возможность видеть врагов и предметы.
items.artifacts.talismanofforesight.full_charge=Ваш талисман полностью заряжен!
items.artifacts.talismanofforesight.levelup=Ваш талисман становится сильнее!
items.artifacts.talismanofforesight.low_charge=Для использования талисмана в режиме ясновидения требуется заряд не менее 5%.
items.artifacts.talismanofforesight.name=талисман предвидения
items.artifacts.talismanofforesight.prompt=Выберите место для сканирования.
items.artifacts.timekeepershourglass$sandbag.desc=Этот небольшой мешочек с мелким песком идеально подойдет для ваших песочных часов.\n\n Кажется странным, что у продавца оказался именно этот товар именно тогда, когда он вам нужен...
items.artifacts.timekeepershourglass$sandbag.levelup=Вы насыпаете песок в песочные часы.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Ваши песочные часы наполнены волшебным песком!
items.artifacts.timekeepershourglass$sandbag.name=мешок волшебного песка
items.artifacts.timekeepershourglass$sandbag.no_hourglass=У вас нет песочных часов, в которые можно было бы засыпать этот песок.
items.artifacts.timekeepershourglass$timefreeze.desc=Время вокруг вас замирает, позволяя вам мгновенно совершать действия. Эффект будет действовать до тех пор, пока он не будет отменен или пока не закончится заряд ваших песочных часов. Атака или использование магии также прервут этот эффект. \n\n Количество ходов до использования заряда: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Заморозить время
items.artifacts.timekeepershourglass.ac_activate=АКТИВИРОВАТЬ
items.artifacts.timekeepershourglass.cursed=Использовать проклятые песочные часы нельзя.
items.artifacts.timekeepershourglass.deactivate=Вы отключаете заморозку времени.
items.artifacts.timekeepershourglass.desc=Эти большие, богато украшенные песочные часы выглядят довольно скромно, но в их изящно вырезанной раме чувствуется огромная сила. Вращая песочные часы и наблюдая за тем, как пересыпается песок, вы чувствуете, как их магия притягивает вас; несомненно, использование этой магии даст вам некоторый контроль над временем.
items.artifacts.timekeepershourglass.desc_cursed=Проклятые песочные часы прижаты к тебе, ты чувствуешь, как они пытаются манипулировать течением времени.
items.artifacts.timekeepershourglass.desc_hint=Кажется, из песочных часов высыпался песок, вот бы еще его найти...
items.artifacts.timekeepershourglass.freeze=Остановите время вокруг меня
items.artifacts.timekeepershourglass.name=песочные часы хронометриста
items.artifacts.timekeepershourglass.no_charge=Ваши песочные часы еще недостаточно зарядились, чтобы ими можно было пользоваться.
items.artifacts.timekeepershourglass.onfreeze=Всё вокруг вас внезапно замирает.
items.artifacts.timekeepershourglass.onstasis=Кажется, что мир вокруг вас меняется в одно мгновение.
items.artifacts.timekeepershourglass.prompt=Как бы вы хотели использовать магию песочных часов? \n\nВ состоянии стазиса время будет течь нормально, пока вы заморожены и полностью неуязвимы, расходует до 2 зарядов за раз. \n\nКогда время заморожено, вы можете двигаться так, как будто ваши действия не занимают времени. Это можно отключить в любой момент, используя песочные часы или атакуя.
items.artifacts.timekeepershourglass.stasis=Погрузить себя в анабиоз
items.artifacts.unstablespellbook.ac_add=ДОБАВЛЯТЬ
items.artifacts.unstablespellbook.ac_read=ЧИТАТЬ
items.artifacts.unstablespellbook.blinded=Читать из книги, будучи слепым, невозможно.
items.artifacts.unstablespellbook.cursed=Из проклятой книги заклинаний невозможно читать.
items.artifacts.unstablespellbook.desc=Этот том находится в удивительно хорошем состоянии, учитывая его возраст. При перелистывании страниц он искрится и потрескивает, излучая неустойчивую энергию. Если вы будете читать из этой книги, кто знает, какое заклинание вы сможете сотворить.
items.artifacts.unstablespellbook.desc_cursed=Проклятая книга привязалась к тебе, она препятствует использованию большинства свитков.
items.artifacts.unstablespellbook.desc_empowered=Свитки, которые вы добавили в книгу, излучают силу. Вы сможете выбрать экзотический вариант эффектов этих свитков, но за дополнительную плату.
items.artifacts.unstablespellbook.desc_index=Книга неполная. В настоящее время указатель указывает на следующие пустые страницы:
items.artifacts.unstablespellbook.infuse_scroll=Вы вкладываете энергию свитка в книгу.
items.artifacts.unstablespellbook.name=нестабильная книга заклинаний
items.artifacts.unstablespellbook.no_charge=В вашей книге заклинаний сейчас закончилась энергия.
items.artifacts.unstablespellbook.prompt=Выберите прокрутку
items.artifacts.unstablespellbook.read_empowered=Свиток, который вы добавили в книгу заклинаний, наполняется энергией. Вы можете использовать либо обычную, либо экзотическую версию эффекта этого свитка. Выбор экзотического варианта потребует 2 заряда вместо 1.
items.artifacts.unstablespellbook.unable_scroll=Вы не можете добавить этот свиток в книгу.
items.artifacts.unstablespellbook.unknown_scroll=Вы пока не уверены, что это за тип свитка.
items.bags.bag.discover_hint=Этот товар можно приобрести в магазине.
items.bags.bag.name=рюкзак
items.bags.magicalholster.desc=Эта тонкая кобура изготовлена из экзотической шкуры животного и обладает мощной магией, позволяющей хранить в ней огромное количество дальнобойного оружия. Вы можете просто засунуть руку в сумку и всегда достанете нужный вам предмет. Благодаря магии кобуры, волшебные палочки будут заряжаться немного быстрее, а метательное оружие будет дольше оставаться внутри неё.
items.bags.magicalholster.name=волшебная кобура
items.bags.potionbandolier.desc=Этот толстый патронташ обхватывает грудь как пояс, на нём множество утеплённых ремней для крепления флаконов с зельями, фляги с водой или флаконов с жидким металлом. Внутри патронташа ваши зелья будут защищёны от холода.
items.bags.potionbandolier.name=патронташ для зелий
items.bags.scrollholder.desc=Этот трубчатый контейнер выглядит так, будто в нём хранятся инструменты и карты астронома, но ваши свитки поместятся в него ничуть не хуже. Есть даже несколько боковых отделений, в которые отлично поместятся магические кристаллы, магические стилусы и магическая смола. Контейнер выглядит не очень легковоспламеняющимся, поэтому ваши свитки внутри него будут в безопасности от огня.
items.bags.scrollholder.name=держатель свитка
items.bags.velvetpouch.desc=В этом небольшом бархатном мешочке можно хранить множество мелких предметов, таких как семена, рунные камни и некоторые алхимические ингредиенты.
items.bags.velvetpouch.discover_hint=Один из героев начинает игру с этим предметом.
items.bags.velvetpouch.name=бархатный мешочек
items.bombs.arcanebomb.desc=Эта бомба наделена магическими свойствами. Она взорвётся мощным взрывом, похожим на усиленную атаку Гу, нанося _%1$d-%2$d магический урон_ всему, что находится в радиусе 2 клеток.
items.bombs.arcanebomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.arcanebomb.name=таинственная бомба
items.bombs.bomb$doublebomb.desc=Стопка из двух увесистых бомб с чёрным порохом, похоже, одну ты получишь бесплатно!
items.bombs.bomb$doublebomb.name=две бомбы
items.bombs.bomb.ac_lightthrow=СВЕТ И ДАЛЬНИЙ СВЕТ
items.bombs.bomb.desc=Довольно мощная бомба с чёрным порохом. Взрыв этой бомбы наносит _%1$d-%2$d урона_ всему, что находится рядом, и уничтожает некоторые прилегающие участки местности или предметы.
items.bombs.bomb.desc_burning=Фитиль бомбы горит, держитесь на расстоянии или потушите её!
items.bombs.bomb.desc_fuse=Похоже, что после зажигания фитиль сгорит только через пару выстрелов.
items.bombs.bomb.name=бомбить
items.bombs.bomb.ondeath=Взрыв убивает...
items.bombs.bomb.rankings_desc=Погиб в результате взрыва
items.bombs.bomb.snuff_fuse=Вы быстро сдуваете фитиль бомбы.
items.bombs.firebomb.desc=Эта бомба была модифицирована таким образом, чтобы взрываться на большей площади, нанося урон в размере _%1$d-%2$d_ и распространяя устойчивое пламя в пределах 2 клеток.
items.bombs.firebomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.firebomb.name=зажигательная бомба
items.bombs.flashbangbomb.desc=Эта модифицированная бомба при взрыве вызовет вспышку света, звука и электричества. Все, что находится в пределах 2 клеток, получит _%1$d-%2$d урона_ от взрыва, дополнительно 25%% урона от электричества и будет оглушено на 10 ходов.
items.bombs.flashbangbomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.flashbangbomb.name=светошумовая граната
items.bombs.frostbomb.desc=Эта бомба была модифицирована таким образом, чтобы взрываться на большей площади, нанося урон в размере _%1$d-%2$d_ и распространяя устойчивый порыв ледяного воздуха в пределах 2 клеток.
items.bombs.frostbomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.frostbomb.name=морозная бомба
items.bombs.holybomb.desc=Эта бомба была модифицирована таким образом, чтобы при взрыве испускать святой свет на большей площади. Все, что находится в пределах 2 клеток, получит _%1$d-%2$d урона_ от взрыва, а нежить или демоны получат дополнительно 50%% урона от святого света.
items.bombs.holybomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.holybomb.name=священная бомба
items.bombs.noisemaker.desc=Эта модифицированная бомба будет многократно издавать шум, когда закончится её взрыватель. При прикосновении к бомбе что-либо взорвётся и нанесёт _%1$d-%2$d урона_ всему, что находится в радиусе 2 клеток!
items.bombs.noisemaker.desc_burning=Шумовка тикает, она взорвётся, когда что-нибудь приблизится!
items.bombs.noisemaker.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.noisemaker.name=шумовой
items.bombs.regrowthbomb.desc=Эта модифицированная бомба вместо взрыва разбрызгивает животворящую жидкость по всей области в радиусе 3 клеток. В зоне взрыва быстро вырастет трава и растения. Вы и ваши союзники, попавшие под взрыв, будут исцелены, как если бы они выпили целебное зелье.
items.bombs.regrowthbomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.regrowthbomb.name=бомба повторного роста
items.bombs.shrapnelbomb.desc=Эта бомба модифицирована обломками металла от ДМ-300, которые при взрыве разлетятся на осколки, нанося урон в огромной зоне вокруг бомбы. Лучше спрятаться за чем-нибудь, когда будете её использовать...
items.bombs.shrapnelbomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.shrapnelbomb.name=осколочная бомба
items.bombs.smokebomb.desc=Эта бомба модифицирована таким образом, чтобы одновременно со взрывом выбрасывать густое облако газа. Она нанесет _%1$d-%2$d урона_ и распространит окутывающий туман в радиусе 2 клеток.
items.bombs.smokebomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.smokebomb.name=дымовая шашка
items.bombs.woollybomb.desc=Эта модифицированная бомба после взрыва создаст обширное поле магических овец. Взрыв нанесет _%1$d-%2$d урона_ всему, что находится в радиусе 2 клеток. Овцы будут блокировать движение и существовать очень долго! Однако овцы не проживут так долго в присутствии сильных врагов, и их можно быстрее развеять, взаимодействуя с ними.
items.bombs.woollybomb.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.bombs.woollybomb.name=шерстяная бомба
items.brokenseal$warriorshield.desc_active=В данный момент сломанная печать Воина помогает ему выстоять, предоставляя ему щит в дополнение к здоровью. После первоначального срабатывания щита существует время перезарядки, прежде чем его можно будет использовать снова. Этот щит не исчезает со временем, но исчезнет, если поблизости не будет врагов в течение нескольких ходов. Когда он исчезнет, любой неиспользованный щит уменьшит время перезарядки, максимум до 50. Остаток щита: %1$d.\n\nТекущее время перезарядки: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Воин недавно получил защиту от сломанной печати и должен подождать, пока снова не сможет воспользоваться её защитным эффектом. \n\nОсталось ходов: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=В настоящее время время восстановления щита Воина отрицательное, это означает, что при активации щита время восстановления будет меньше обычных 150 ходов. Время восстановления щита может быть уменьшено до -150 ходов, что означает, что он сразу же станет доступен после активации.
items.brokenseal$warriorshield.name=Щит Воина
items.brokenseal.ac_affix=АФФИКС
items.brokenseal.affix=Вы прикрепляете печать к своим доспехам!
items.brokenseal.choose_desc=И на этих доспехах, и на сломанной печати есть глифы. Выберите, какой глиф следует сохранить. \n\n Глиф доспехов: %1$s\n Глиф сломанной печати: %2$s\n\n Обратите внимание, что если вы выберете глиф, который уже есть на доспехах, печать не сможет перенести его позже.
items.brokenseal.choose_title=Выберите глиф
items.brokenseal.cursed_armor=Печать не распространяется на проклятые доспехи.
items.brokenseal.desc=Восковая печать, прикрепленная к доспехам как символ доблести. В центре выгравирована выцветшая руна защиты, а сама печать расколота пополам. Этот сувенир из дома помогает воину выстоять. Нося печать, воин мгновенно получает щит, когда его здоровье вот-вот уменьшится до половины или ниже. Печать может быть прикреплена к доспехам и перемещаться между ними. Она может нести одно улучшение, если это улучшение было применено к доспехам, когда печать была прикреплена к ним.
items.brokenseal.discover_hint=Один из героев начинает игру с этим предметом.
items.brokenseal.inscribed=На печати выгравировано _%s._
items.brokenseal.name=поврежденная пломба
items.brokenseal.prompt=Выберите доспехи
items.brokenseal.unknown_armor=Сначала нужно определить, проклята эта броня или нет.
items.dewdrop.already_full=У вас уже отличное здоровье.
items.dewdrop.desc=Кристально чистая капля росы.
items.dewdrop.name=капля росы
items.dewvial.ac_drink=ВЫПИТЬ
items.dewvial.auto_drink=Роса из пузырька исцелила ваши раны. Пузырёк опустел.
items.dewvial.collected=Вы собрали каплю росы в пузырёк.
items.dewvial.desc=В этом маленьком пузырьке можно хранить лишнюю росу, чтобы выпить её позже. Если пузырёк полон, в момент смертельной опасности роса будет выпита автоматически.
items.dewvial.empty=Ваш пузырёк для росы пуст!
items.dewvial.full=Ваш пузырёк для росы полон!
items.dewvial.name=пузырёк для росы
items.energycrystal.desc=Коллекция маленьких магических кристаллов, наполненных алхимической энергией. Эти кристаллы являются наиболее распространенным ингредиентом в алхимических рецептах и могут быть получены в алхимическом котле путем разборки расходуемых предметов.
items.energycrystal.name=энергетический кристалл
items.equipableitem.ac_equip=ОБОРУДОВАНИЕ
items.equipableitem.ac_unequip=НЕОБОРУДОВАННЫЙ
items.equipableitem.curse_detected=Вы чувствуете, что предмет проклят, прямо перед тем, как надеть его!
items.equipableitem.unequip_cursed=Нельзя снять проклятый предмет!
items.food.berry.desc=Эту маленькую ягоду Охотница нашла среди растительности в подземелье. Её можно быстро съесть, она немного восстанавливает чувство сытости и, возможно, содержит пригодное для употребления семя!
items.food.berry.discover_hint=Этот предмет можно найти, используя определённый талант героя.
items.food.berry.eat_msg=Эта ягода была вкусной!
items.food.berry.name=ягода подземелья
items.food.blandfruit$chunks.desc=Плоды мякоти взорвались при ударе, оставив после себя инертные куски. Несмотря на небольшое количество грязи, эти большие куски приготовленных плодов мякоти кажутся вполне съедобными.
items.food.blandfruit$chunks.name=безвкусные кусочки фруктов
items.food.blandfruit.blindfruit=слепой фрукт
items.food.blandfruit.cooked=приготовленные пресные фрукты
items.food.blandfruit.desc=Настолько сухое и безвкусное, что, возможно, тушение с другим ингредиентом улучшило бы его вкус.
items.food.blandfruit.desc_cooked=Плоды запеклись в кастрюле и даже впитали в себя свойства семян, с которыми их готовили. Они будут действовать так же, как и зелье, для которого предназначалось это семя.
items.food.blandfruit.desc_eat=Выглядит так, будто его уже можно есть!
items.food.blandfruit.desc_throw=Кажется, он довольно взрывоопасный, возможно, лучше его выбросить.
items.food.blandfruit.dreamfruit=магический фрукт
items.food.blandfruit.earthfruit=земляной фрукт
items.food.blandfruit.fadefruit=фэйдфрут
items.food.blandfruit.firefruit=огненный фрукт
items.food.blandfruit.icefruit=ледяной фрукт
items.food.blandfruit.name=пресный фрукт
items.food.blandfruit.raw=Вы не можете есть его в сыром виде.
items.food.blandfruit.rotfruit=гнилые фрукты
items.food.blandfruit.sorrowfruit=печальный плод
items.food.blandfruit.starfruit=карамбола
items.food.blandfruit.stormfruit=штормфрут
items.food.blandfruit.sunfruit=подсолнечник
items.food.blandfruit.swiftfruit=свирепый фрукт
items.food.chargrilledmeat.desc=Выглядит как неплохой стейк.
items.food.chargrilledmeat.discover_hint=Это можно приготовить, используя другой продукт питания.
items.food.chargrilledmeat.name=мясо, приготовленное на гриле
items.food.food.ac_eat=ЕСТЬ
items.food.food.desc=Ничего особенного: вяленое мясо, немного печенья — и тому подобное.
items.food.food.eat_msg=Еда была восхитительна на вкус!
items.food.food.name=рацион питания
items.food.frozencarpaccio.better=Вы чувствуете себя лучше!
items.food.frozencarpaccio.desc=Это кусок замороженного сырого мяса. Единственный способ его съесть — нарезать тонкими ломтиками. И таким образом он оказывается на удивление вкусным.
items.food.frozencarpaccio.discover_hint=Это можно приготовить, используя другой продукт питания.
items.food.frozencarpaccio.hard=Вы чувствуете, как ваша кожа твердеет!
items.food.frozencarpaccio.invis=Вы видите, как ваши руки становятся невидимыми!
items.food.frozencarpaccio.name=замороженное карпаччо
items.food.frozencarpaccio.refresh=Освежающе!
items.food.meatpie.desc=Вкусный пирог с аппетитной мясной начинкой. Он насытит вас гораздо больше, чем любое другое блюдо.
items.food.meatpie.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.food.meatpie.eat_msg=Еда была невероятной!
items.food.meatpie.name=мясной пирог
items.food.mysterymeat$placeholder.name=мясо
items.food.mysterymeat.desc=Употребляйте на свой страх и риск!
items.food.mysterymeat.discover_hint=Этот предмет можно получить в качестве добычи с некоторых врагов.
items.food.mysterymeat.eat_msg=Еда на вкус... странная.
items.food.mysterymeat.hot=Ой, как жарко!
items.food.mysterymeat.legs=Вы не чувствуете ног!
items.food.mysterymeat.name=загадочное мясо
items.food.mysterymeat.not_well=Вы плохо себя чувствуете.
items.food.mysterymeat.stuffed=Ты наелся до отвала.
items.food.pasty$fishleftover.desc=Остатки рыбы с вашего предыдущего приема пищи. Вы можете съесть их в любое время, чтобы немного утолить голод.
items.food.pasty$fishleftover.eat_msg=Еда была неплохой на вкус.
items.food.pasty$fishleftover.name=остатки рыбы
items.food.pasty.amulet_desc=Вы наконец-то нашли его, волшебный амулет... подождите-ка, это всего лишь завернутая в фольгу шоколадка, замаскированная под амулет! Он не дарует вам безграничную силу, но, по крайней мере, наполнит вас энергией и даст небольшой заряд артефакта. \n\nПервое апреля!
items.food.pasty.amulet_name=Амулет Йендора?
items.food.pasty.cane_desc=Огромная, сладкая, сахарная трость. Она достаточно большая, чтобы наесться досыта, а сахар, возможно, еще и немного подзарядит ваши волшебные палочки. Счастливых праздников!
items.food.pasty.cane_name=леденец-трость
items.food.pasty.desc=Настоящий корнуоллский пирожок с традиционной начинкой из говядины и картофеля. Очень вкусно!
items.food.pasty.egg_desc=Огромное шоколадное яйцо, завернутое в яркую желтую фольгу. Шоколада здесь предостаточно, чтобы наесться досыта, а сахар может придать вашим изделиям немного дополнительной ценности. Счастливой Пасхи!
items.food.pasty.egg_name=пасхальное яйцо
items.food.pasty.fish_desc=Целая рыба, приготовленная на пару и волшебным образом законсервированная на подушке из зелени. По традиции, в это время года часть рыбы оставляют на потом, чтобы сохранить остатки, а не съесть все сразу. Счастливого Лунного Нового года!
items.food.pasty.fish_name=рыба на пару
items.food.pasty.name=пирожок
items.food.pasty.pie_desc=Большой кусок тыквенного пирога. Его сладкий и пряный вкус насытит вас и подарит немного исцеления. Счастливого Хэллоуина!
items.food.pasty.pie_name=тыквенный пирог
items.food.pasty.rainbow_desc=Это красочное зелье — своего рода жидкая еда. Помимо утоления голода, оно содержит немного магии, которая успокоит находящегося рядом врага, не являющегося боссом, заставляя его временно отказаться от боя с вами. \n\nСчастливого Прайда!
items.food.pasty.rainbow_name=радужное зелье
items.food.pasty.sparkling_desc=Этот игристый напиток — своего рода жидкая пища. Он утоляет голод и имитирует игристое вино, но на самом деле не содержит алкоголя. Тепло в животе обеспечит небольшую защиту. С Новым годом!
items.food.pasty.sparkling_name=сверкающее зелье
items.food.pasty.vanilla_desc=Этот большой кусок ванильного торта украшен разноцветной посыпкой и голубой глазурью. Торт был создан в честь многолетнего опыта и подарит вам небольшую часть этого опыта, когда вы его съедите. Оригинальная игра Pixel Dungeon была впервые выпущена 4 декабря 2012 года. С днем рождения, Pixel Dungeon!
items.food.pasty.vanilla_name=синий торт
items.food.phantommeat.desc=Большой блестящий полупрозрачный стейк, вырезанный из призрачной пираньи. Это волшебное мясо не требует приготовления и, помимо полного насыщения, дарует ряд защитных свойств. При употреблении в пищу оно дарует невидимость, кору дерева, некоторое исцеление и снимает многие вредные эффекты.
items.food.phantommeat.discover_hint=Этот предмет можно получить в качестве добычи с некоторых врагов.
items.food.phantommeat.name=фантомное мясо
items.food.smallration.desc=Выглядит в точности как стандартный пищевой рацион, только меньшего размера.
items.food.smallration.discover_hint=Этот товар можно приобрести в магазине.
items.food.smallration.eat_msg=Еда была неплохой на вкус.
items.food.smallration.name=небольшой пищевой рацион
items.food.stewedmeat.desc=Тушение мяса очистило его от любых болезней и паразитов. Поэтому его можно безопасно употреблять в пищу.
items.food.stewedmeat.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.food.stewedmeat.eat_msg=Еда была неплохой на вкус.
items.food.stewedmeat.name=тушеное мясо
items.food.supplyration.desc=Этот паек был оставлен в подземелье членами гильдии воров для них. Он специально предназначен для употребления на ходу и помогает в различных махинациях. Хотя он не насыщает так сильно, как обычный паек, его можно съесть быстро, он обеспечивает небольшое прямое исцеление и восстанавливает заряд плаща теней разбойника.
items.food.supplyration.discover_hint=Этот предмет можно найти, используя определённый талант героя.
items.food.supplyration.name=норма снабжения
items.gold.desc=Куча золотых монет. Собирайте золотые монеты, чтобы потратить их позже в магазине.
items.gold.name=золото
items.heap.artifact=артефакт
items.heap.chest=Грудь
items.heap.chest_desc=Вы не узнаете, что внутри, пока не откроете!
items.heap.crystal_chest=Хрустальный сундук
items.heap.crystal_chest_desc=Внутри вы можете увидеть _%s_, но для открытия сундука вам понадобится кристаллический ключ.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Запертый сундук
items.heap.locked_chest_desc=Вы не узнаете, что внутри, пока не откроете! Но чтобы открыть, вам понадобится золотой ключ.
items.heap.remains=останки героя
items.heap.remains_desc=Это всё, что осталось от одного из ваших предшественников. Возможно, стоит проверить, нет ли там каких-нибудь ценностей.
items.heap.ring=кольцо
items.heap.skeleton=Останки скелета
items.heap.skeleton_desc=Это всё, что осталось от какого-то несчастного искателя приключений. Может, стоит проверить, нет ли там каких-нибудь ценностей.
items.heap.tomb=Гробница
items.heap.tomb_desc=В этой древней гробнице может находиться что-то полезное, но её владелец, безусловно, возразит против проверки.
items.heap.wand=палочка
items.honeypot$shatteredpot.desc=Горшок разбит, его удерживает лишь липкий мед, покрывающий стенки, и он медленно разваливается. Несмотря на разбитое состояние, пчела, похоже, все еще хочет защитить горшок.
items.honeypot$shatteredpot.name=разбитый горшок с медом
items.honeypot.ac_shatter=РАЗРУШЕНИЕ
items.honeypot.desc=Этот огромный горшок для меда на самом деле заполнен только медом, а внутри него живет гигантская пчела! Такие огромные пчелы обычно живут в своих ульях, возможно, этот горшок — какая-то специальная клетка для пчеловодов? Пчела, кажется, вполне довольна своим медом внутри горшка и настороженно жужжит, когда вы на нее смотрите.
items.honeypot.name=медовый горшок
items.item.ac_drop=УРОНИТЬ
items.item.ac_throw=БРОСАТЬ
items.item.curse=проклинать
items.item.custom_note=К этому товару прилагается примечание: "_%s_"
items.item.custom_note_type=К этому типу товара прилагается примечание: "_%s_"
items.item.discover_hint=Этот предмет можно найти случайным образом в подземелье.
items.item.prompt=Выберите направление броска
items.item.rankings_desc=Убит: %s
items.journal.alchemypage.desc=Вырванная страница из руководства по алхимии. Большая часть текста слишком мелкая, чтобы прочитать её издалека, но можно разобрать заголовок страницы: \n\n_"%s"_
items.journal.alchemypage.name=разорванная страница из книги по алхимии
items.journal.documentpage.desc=Одинокая страница, вероятно, вырванная из какой-то книги. Чтобы прочитать её, вам нужно будет взять её в руки.
items.journal.documentpage.name=разорванная страница
items.journal.guidebook.desc=Путеводитель для искателей приключений, оставленный здесь тем, кто решил, что приключения не для него! Эта книга поистине волшебная и может побудить искателей приключений прочитать страницу в нужный момент. Несмотря на свою функциональность, книга наиболее популярна благодаря крупным, дружелюбным буквам на обложке: «Не паникуйте!»
items.journal.guidebook.hint_desktop=В вашем путеводителе есть для вас полезные советы! Нажмите на мигающую кнопку журнала (%s) в правом верхнем углу, чтобы прочитать его.
items.journal.guidebook.hint_mobile=В вашем путеводителе есть для вас полезные советы! Нажмите на мигающую кнопку журнала в правом верхнем углу, чтобы прочитать его.
items.journal.guidebook.hint_status=Путеводитель
items.journal.guidebook.name=том мастерства подземелий
items.journal.guidepage.desc=Вырванная страница из путеводителя для путешественников. Большая часть текста слишком мелкая, чтобы прочитать ее издалека, но можно разглядеть заголовок страницы: \n\n_"%s"_
items.journal.guidepage.name=порванная страница путеводителя
items.journal.regionlorepage$caves.desc=Похоже, это запись из бортового журнала исследователя, удивительно хорошо сохранившаяся, несмотря на свой почтенный возраст. Возьмите её в руки и почитайте.
items.journal.regionlorepage$caves.name=старая запись в журнале
items.journal.regionlorepage$city.desc=Небольшая ржавая металлическая табличка с магически выгравированным на ней посланием. Буквы, несмотря на возраст таблички, всё ещё чётко видны, но чтобы прочитать их, придётся поднять её.
items.journal.regionlorepage$city.name=ржавая табличка
items.journal.regionlorepage$halls.desc=Небольшая черная табличка с выгравированными на ней светящимися зелеными буквами. Вдали светящиеся буквы сливаются в некую дымку, чтобы прочитать надпись, нужно поднять табличку.
items.journal.regionlorepage$halls.name=светящаяся табличка
items.journal.regionlorepage$prison.desc=Запись в дневнике или какой-либо другой документ, написанный на старом клочке бумаги. Кажется, он сохранился лучше, чем письма, найденные в канализации, но вам все равно придется его подобрать, чтобы прочитать.
items.journal.regionlorepage$prison.name=изношенная запись в журнале
items.journal.regionlorepage$sewers.desc=На клочке бумаги, испачканном грязью, видно что-то похожее на письмо. Чтобы разобрать, нужно поднять его.
items.journal.regionlorepage$sewers.name=изношенное письмо
items.keys.crystalkey.desc=Скошенные поверхности этого кристаллического ключа мерцают в темноте. Возможно, он откроет что-нибудь из кристалла?
items.keys.crystalkey.name=Хрустальный ключ
items.keys.goldenkey.desc=Выемки на этом золотом ключе крошечные и замысловатые. Возможно, он откроет запертый сундук?
items.keys.goldenkey.name=золотой ключ
items.keys.ironkey.desc=Зазубрины на этом старинном железном ключе сильно изношены; его кожаный ремешок потрепан временем. Какую дверь он может открыть?
items.keys.ironkey.name=железный ключ
items.keys.skeletonkey.name=скелетный ключ
items.keys.wornkey.desc=Этот ключ изношен и потускнел, но выглядит солидно. Вероятно, он сможет открыть какую-нибудь серьёзную дверь поблизости.
items.keys.wornkey.name=изношенный ключ
items.kindofmisc.unequip_message=Сначала необходимо снять один из этих предметов. Выберите предмет, на который хотите поменяться.
items.kindofmisc.unequip_title=Снять один предмет
items.kindofweapon.empty=пустой
items.kindofweapon.equip_cursed=Ваша хватка на оружии непроизвольно усиливается.
items.kindofweapon.swift_equip=Вы быстро достаёте оружие.
items.kindofweapon.which_equip_msg=В какой слот оружия вы хотите экипировать этот предмет? \n\nЧемпион атакует напрямую своим основным оружием, но может использовать способности любого из них. Оба оружия имеют одинаковое количество зарядов. \n\nЧемпион также может мгновенно менять основное и дополнительное оружие.
items.kindofweapon.which_equip_primary=Основной (%s)
items.kindofweapon.which_equip_secondary=Вторичный (%s)
items.kingscrown.ac_wear=НОСИТЬ
items.kingscrown.desc=Корона последнего короля гномов, она сияет невероятной магической энергией. При надевании магия короны проникнет в вашу текущую броню, превратив её в уникальную эпическую броню со специальными способностями. Новая броня сохранит все свойства оригинальной брони.
items.kingscrown.discover_hint=Этот предмет можно получить в качестве добычи с некоторых врагов.
items.kingscrown.naked=К сожалению, корона не может преобразить ваше нижнее белье.
items.kingscrown.name=Корона Короля Гномов
items.kingscrown.ratgraded=Лапы Крысиного Короля ярко светятся, когда ваша броня трансформируется!
items.kingscrown.upgraded=Корона ярко светится, а затем распадается, когда ваши доспехи трансформируются!
items.liquidmetal.ac_apply=ПРИМЕНЯТЬ
items.liquidmetal.already_fixed=Метательное оружие уже в идеальном состоянии!
items.liquidmetal.apply=Для ремонта метательного оружия вы используете жидкий металл %d.
items.liquidmetal.desc=Эта волшебная жидкость может заполнить трещины и разрывы на метательном оружии, восстановив его до идеального состояния! Если в наборе оружия отсутствует одно оружие, но в остальном он полностью отремонтирован, то жидкий металл можно использовать даже для замены отсутствующего оружия из набора! Для полного ремонта оружия 1-го уровня требуется 10 единиц жидкого металла, для оружия 5-го уровня — 30. Каждое улучшение также увеличивает количество необходимого металла на 35%. Жидкий металл нельзя использовать для ремонта наконечников дротиков.
items.liquidmetal.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.liquidmetal.name=жидкий металл
items.liquidmetal.prompt=Выберите метательное оружие
items.lostbackpack.desc=Это ваш потерянный инвентарь. Заберите его, чтобы вернуть все потерянные предметы!
items.lostbackpack.name=потерянный рюкзак
items.merchantsbeacon.ac_use=ИСПОЛЬЗОВАТЬ
items.merchantsbeacon.desc=Этот необычный артефакт гномьей технологии позволяет общаться на больших расстояниях. После активации этот маяк позволит вам продавать товары в Pixel Mart из любой точки подземелья. Однако магия маяка будет действовать только один раз, поэтому используйте его с умом.
items.merchantsbeacon.name=Торговый маяк
items.potions.brews.aquabrew.desc=При разрушении это зелье выпустит поток воды под давлением в месте своего расположения. Его силы достаточно, чтобы нанести урон только огненным врагам, но оно также разбрызгивает воду по близлежащей местности, обезвреживает ловушки, гасит пожары и отбрасывает персонажей, находящихся рядом с местом взрыва.
items.potions.brews.aquabrew.name=аква брожение
items.potions.brews.blizzardbrew.desc=При разрушении это зелье вызовет вихревую метель, которая быстро распространится, как газ.
items.potions.brews.blizzardbrew.name=снежное пиво
items.potions.brews.brew.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.potions.brews.causticbrew.desc=Эта смесь распространит едкую слизь на большой площади вокруг места разрушения. Все, что попадет в эту слизь, будет медленно плавиться, если ее не смоют водой.
items.potions.brews.causticbrew.name=едкое пиво
items.potions.brews.infernalbrew.desc=При разрушении это зелье высвободит бушующий адский огонь, который быстро распространится, как газ.
items.potions.brews.infernalbrew.name=адское зелье
items.potions.brews.shockingbrew.desc=При разрушении это зелье вызовет электрическую бурю на обширной территории вокруг места, где оно разобьется.
items.potions.brews.shockingbrew.name=шокирующий напиток
items.potions.brews.unstablebrew.desc=Это волшебное зелье светится переливающимися цветами радуги. При употреблении или бросании оно активирует эффект случайного зелья. Эффект зелья всегда будет положительным, если его выпить, и всегда будет вредным, если его бросить.
items.potions.brews.unstablebrew.name=нестабильный эль
items.potions.elixirs.elixir.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Вы временно получили восстанавливающие свойства, аналогичные свойствам Гу. \n\nНаходясь в воде, вы будете восстанавливать небольшое количество здоровья за ход. Эффект приостанавливается, когда у вас полное здоровье или вы находитесь вне воды. \n\nОсталось здоровья: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=лечение водой
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Этот эликсир содержит остатки Слизи, усиленные целебным зельем. Хотя он не обеспечит мгновенного исцеления, он будет постепенно восстанавливать всё большее количество здоровья, пока вы стоите в воде.
items.potions.elixirs.elixirofaquaticrejuvenation.name=эликсир водного омоложения
items.potions.elixirs.elixirofarcanearmor.desc=Этот эликсир дарует выпившему его человеку длительную защиту от магического урона.
items.potions.elixirs.elixirofarcanearmor.name=эликсир магической брони
items.potions.elixirs.elixirofdragonsblood.desc=При употреблении этот эликсир наполнит вены пьющего огненной энергией. Этот эффект сделает пьющего невосприимчивым к огню и позволит ему поджигать врагов физическими атаками.
items.potions.elixirs.elixirofdragonsblood.name=эликсир драконьей крови
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Вы находитесь под действием эликсира «Падение пера», позволяющего вам падать в пропасти, не получая урона! \n\n Осталось ходов: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=падение пера
items.potions.elixirs.elixiroffeatherfall.desc=Этот эликсир оказывает более слабое, но более контролируемое левитирующее действие, позволяя выпитому на короткое время упасть с большой высоты без вреда для здоровья.
items.potions.elixirs.elixiroffeatherfall.light=Чувствуешь себя лёгким, как пёрышко!
items.potions.elixirs.elixiroffeatherfall.name=эликсир падения перьев
items.potions.elixirs.elixirofhoneyedhealing.desc=Этот эликсир сочетает в себе целебные свойства и сладость меда. При употреблении он оказывает тот же эффект, что и зелье исцеления, и немного утоляет голод, но его также можно бросить, чтобы исцелить союзника. Существа, питающие пристрастие к меду, могут быть умиротворены, если использовать этот предмет на них.
items.potions.elixirs.elixirofhoneyedhealing.name=эликсир медового исцеления
items.potions.elixirs.elixiroficytouch.desc=При употреблении этот эликсир позволит пьющему вытягивать тепло из атакуемых врагов. Этот эффект сделает пьющего невосприимчивым к холоду и позволит ему замораживать врагов физическими атаками.
items.potions.elixirs.elixiroficytouch.name=эликсир ледяного прикосновения
items.potions.elixirs.elixirofmight$htboost.desc=Ваше тело ощущает неестественную силу и здоровье. \n\nВаш максимальный уровень здоровья увеличен на длительный период времени. По мере повышения уровня эффект будет постепенно ослабевать. \n\nТекущий уровень усиления: %d.\nОсталось уровней: %d.
items.potions.elixirs.elixirofmight$htboost.name=максимальное усиление здоровья
items.potions.elixirs.elixirofmight.desc=Эта мощная жидкость будет циркулировать по вашим мышцам, навсегда увеличивая вашу силу на одно очко и временно увеличивая максимальное здоровье на %d очков. Увеличение здоровья зависит от вашего максимального здоровья, но постепенно будет уменьшаться по мере повышения уровня.
items.potions.elixirs.elixirofmight.msg=В вашем теле пробуждается новая сила, теперь у вас есть %d сила!
items.potions.elixirs.elixirofmight.name=эликсир могущества
items.potions.elixirs.elixiroftoxicessence.desc=При употреблении этот эликсир наполнит пьющего токсичной энергией. Пьющий будет постоянно распространять токсичный газ во время движения и будет невосприимчив к токсичным газам и ядам в течение времени, немного превышающего продолжительность действия эликсира.
items.potions.elixirs.elixiroftoxicessence.name=эликсир токсичной эссенции
items.potions.exotic.exoticpotion.amber=экзотическое янтарное зелье
items.potions.exotic.exoticpotion.azure=экзотическое лазурное зелье
items.potions.exotic.exoticpotion.bistre=экзотическое бистровое зелье
items.potions.exotic.exoticpotion.charcoal=экзотический угольный эликсир
items.potions.exotic.exoticpotion.crimson=экзотическое багровое зелье
items.potions.exotic.exoticpotion.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.potions.exotic.exoticpotion.golden=экзотическое золотое зелье
items.potions.exotic.exoticpotion.indigo=экзотическое индиговое зелье
items.potions.exotic.exoticpotion.ivory=экзотическое зелье из слоновой кости
items.potions.exotic.exoticpotion.jade=экзотическое нефритовое зелье
items.potions.exotic.exoticpotion.magenta=экзотическое пурпурное зелье
items.potions.exotic.exoticpotion.no=Нет, я передумал.
items.potions.exotic.exoticpotion.silver=экзотическое серебряное зелье
items.potions.exotic.exoticpotion.turquoise=экзотическое бирюзовое зелье
items.potions.exotic.exoticpotion.unknown_desc=В этой круглой колбе находится зернистая разноцветная жидкость. Кажется, она чужеродна для этой страны, кто знает, что с ней может произойти, если её выпить или выбросить?
items.potions.exotic.exoticpotion.warning=Вы действительно хотите отменить использование этого зелья? Оно всё равно будет израсходовано.
items.potions.exotic.exoticpotion.yes=Да, я уверен.
items.potions.exotic.potionofcleansing$cleanse.desc=Этот персонаж временно невосприимчив ко всем вредным негативным эффектам! \n\n Осталось ходов: %s.
items.potions.exotic.potionofcleansing$cleanse.name=очищенный
items.potions.exotic.potionofcleansing.desc=Этот мощный реагент на несколько ходов сделает выпившего его невосприимчивым ко всем вредным негативным эффектам. Его также можно бросить в цель, чтобы снять с неё негативные эффекты.
items.potions.exotic.potionofcleansing.name=очищающее зелье
items.potions.exotic.potionofcorrosivegas.desc=Откупоривание или разбивание этого герметичного стакана приведет к взрыву его содержимого, в результате чего образуется смертоносное облако едкого газа ржавого цвета. Этот газ распространяется быстрее, чем токсичный газ, и более опасен, но и сохраняется не так долго.
items.potions.exotic.potionofcorrosivegas.name=зелье едкого газа
items.potions.exotic.potionofdivineinspiration.bonus=+2 очка таланта!
items.potions.exotic.potionofdivineinspiration.desc=Эта зелье, представляющее собой силу святой энергии, превращенную в жидкость, наполнит пьющего божественной силой, даруя ему два бонусных очка талантов на выбранном им уровне. Это зелье можно использовать только один раз для каждого уровня талантов.
items.potions.exotic.potionofdivineinspiration.name=зелье божественного вдохновения
items.potions.exotic.potionofdivineinspiration.no_more_points=Вы больше не сможете получить бонусные очки талантов.
items.potions.exotic.potionofdivineinspiration.select_tier=Выберите уровень талантов, чтобы получить два бонусных очка. Для того чтобы потратить очки, вы должны разблокировать этот уровень.
items.potions.exotic.potionofdragonsbreath.desc=В этой колбе находится необычное соединение, которое вспыхивает пламенем вскоре после смешивания со слюной. Быстро выплюнув жидкость, пользователь сможет извергнуть пламя изо рта!
items.potions.exotic.potionofdragonsbreath.name=зелье драконьего дыхания
items.potions.exotic.potionofdragonsbreath.prompt=Выберите место для сжигания
items.potions.exotic.potionofearthenarmor.desc=Вместо того чтобы парализовать, эта жидкость оказывает на кожу укрепляющее действие, превращая ее во временную естественную броню.
items.potions.exotic.potionofearthenarmor.name=зелье земляной брони
items.potions.exotic.potionofmagicalsight.desc=После того, как вы это выпьете, ваши чувства на короткое время обострятся до невероятного уровня, позволяя вам видеть сквозь стены в радиусе 12 клеток!
items.potions.exotic.potionofmagicalsight.name=зелье магического зрения
items.potions.exotic.potionofmastery.armor_easier=Ваша броня станет удобнее в носке!
items.potions.exotic.potionofmastery.desc=Вместо того чтобы даровать чистую силу, это зелье настроит мышцы пользователя на использование определенного предмета. Это облегчит использование предмета, как если бы пьющий тренировался с ним и выработал мышечную память. Выбранное оружие или доспехи потребуют на 2 меньше силы для использования. Это зелье можно использовать только один раз на каждом предмете.
items.potions.exotic.potionofmastery.name=зелье мастерства
items.potions.exotic.potionofmastery.prompt=Освоить предмет
items.potions.exotic.potionofmastery.weapon_easier=Ваше оружие станет легче в обращении!
items.potions.exotic.potionofshielding.desc=Вместо исцеления это зелье создаст вокруг тела пользователя прочный щит, блокирующий значительную часть урона.
items.potions.exotic.potionofshielding.name=зелье защиты
items.potions.exotic.potionofshroudingfog.desc=При контакте с воздухом жидкость в этой колбе образует густой дым, который быстро распространяется и заслоняет обзор вашим врагам.
items.potions.exotic.potionofshroudingfog.name=зелье окутывающего тумана
items.potions.exotic.potionofsnapfreeze.desc=Содержащееся в этом зелье химическое вещество быстро вступает в реакцию с воздухом, мгновенно замораживая и укореняя всё, что находится в зоне его действия.
items.potions.exotic.potionofsnapfreeze.name=зелье мгновенной заморозки
items.potions.exotic.potionofstamina.desc=Употребление этой необычайно сладкой жидкости придаст вам длительный прилив энергии, позволяющий бегать с повышенной скоростью в течение продолжительного времени.
items.potions.exotic.potionofstamina.name=зелье выносливости
items.potions.exotic.potionofstormclouds.desc=Выплев это зелье, вы создадите быстро распространяющееся облако концентрированного пара, который сконденсируется и выльется на окружающую среду. Большая часть местности превратится в воду, огненные враги получат урон, огонь погаснет, а ловушки будут преодолены и сломаны.
items.potions.exotic.potionofstormclouds.name=зелье грозовых туч
items.potions.potion$placeholder.name=зелье
items.potions.potion$seedtopotion.name=Случайное зелье
items.potions.potion.ac_drink=ВЫПИТЬ
items.potions.potion.amber=янтарное зелье
items.potions.potion.azure=лазурное зелье
items.potions.potion.beneficial=Полезное зелье
items.potions.potion.bistre=бистровое зелье
items.potions.potion.charcoal=угольное зелье
items.potions.potion.crimson=багровое зелье
items.potions.potion.discover_hint=Этот предмет можно найти случайным образом в подземелье или изготовить с помощью алхимии.
items.potions.potion.golden=золотое зелье
items.potions.potion.harmful=Вредное зелье!
items.potions.potion.indigo=зелье индиго
items.potions.potion.ivory=зелье из слоновой кости
items.potions.potion.jade=нефритовое зелье
items.potions.potion.magenta=зелье пурпурного цвета
items.potions.potion.no=Нет, я передумал.
items.potions.potion.shatter=Колба разбивается, и жидкость безвредно разбрызгивается.
items.potions.potion.silver=серебряное зелье
items.potions.potion.sure_drink=Вы уверены, что хотите это выпить? В большинстве случаев такие зелья следует бросать во врагов.
items.potions.potion.sure_throw=Вы уверены, что хотите его выбросить? В большинстве случаев разумнее его выпить.
items.potions.potion.turquoise=бирюзовое зелье
items.potions.potion.unknown_desc=В этом пузырьке клубится жидкость %s. Кто знает, что будет, если выпить её или бросить пузырёк?
items.potions.potion.yes=Да, я знаю, что делаю.
items.potions.potionofexperience.desc=Легендарные истории многочисленных сражений, воплощенные в жидкой форме, — этот напиток мгновенно повысит ваш уровень опыта.
items.potions.potionofexperience.name=зелье опыта
items.potions.potionoffrost.desc=На открытом воздухе это вещество испаряется, образуя ледяное облако. Любое существо, коснувшееся его, замерзает на месте и не может ни двигаться, ни действовать.
items.potions.potionoffrost.name=зелье мороза
items.potions.potionofhaste.desc=Употребление этой необычайно сладкой жидкости на короткое время придаст вам огромную энергию, позволяющую бегать с высокой скоростью.
items.potions.potionofhaste.energetic=Вы чувствуете прилив энергии!
items.potions.potionofhaste.name=зелье спешки
items.potions.potionofhealing.desc=Эликсир, который мгновенно восстановит всё здоровье и вылечит отравление.
items.potions.potionofhealing.heal=Ваши раны начинают заживать.
items.potions.potionofhealing.name=зелье исцеления
items.potions.potionofinvisibility.desc=Это зелье на время сделает тебя невидимым для врагов. Атака на врага, а также использование жезла или свитка у него на глазах развеют эффект.
items.potions.potionofinvisibility.invisible=Вы видите, как ваши руки становятся невидимыми!
items.potions.potionofinvisibility.name=зелье невидимости
items.potions.potionoflevitation.desc=Эта необычная жидкость позволит парить в воздухе и без труда пролетать над ловушками. Однако пламя и газы заполняют и воздух, так что их таким способом не избежать.
items.potions.potionoflevitation.float=Вы парите в воздухе!
items.potions.potionoflevitation.name=зелье левитации
items.potions.potionofliquidflame.desc=В этой колбе находится нестабильное соединение, которое при контакте с открытым воздухом резко воспламенится.
items.potions.potionofliquidflame.name=зелье жидкого пламени
items.potions.potionofmindvision.desc=После употребления этого зелья ваш разум настроится на психический след далёких существ, что позволит вам чувствовать присутствие живых организмов сквозь стены. Кроме того, это зелье даст вам возможность видеть сквозь стены и двери.
items.potions.potionofmindvision.name=зелье мысленного видения
items.potions.potionofmindvision.see_mobs=Каким-то образом можно почувствовать присутствие разума других существ!
items.potions.potionofmindvision.see_none=В данный момент вы почему-то чувствуете себя одиноким на этом уровне.
items.potions.potionofparalyticgas.desc=При контакте с открытым воздухом жидкость в этой колбе испаряется, образуя оглушающую желтую дымку. Любой, кто вдохнет это облако, мгновенно парализуется и не сможет двигаться некоторое время после того, как облако рассеется. Этот предмет можно бросать в врагов на расстоянии, чтобы застать их в зоне действия газа.
items.potions.potionofparalyticgas.name=зелье парализующего газа
items.potions.potionofpurity.desc=Это вещество быстро нейтрализует все вредные газы в области действия. Если выпить его, оно на время защитит от таких газов.
items.potions.potionofpurity.freshness=Вы ощущаете необычайную свежесть в воздухе.
items.potions.potionofpurity.name=Зелье очищения
items.potions.potionofpurity.protected=Вас окутывает защитная пленка!
items.potions.potionofstrength.desc=Эта мощная жидкость будет циркулировать по вашим мышцам, навсегда увеличивая вашу силу на один пункт.
items.potions.potionofstrength.msg=В вашем теле пробуждается новая сила, теперь у вас есть %d сила!
items.potions.potionofstrength.name=зелье силы
items.potions.potionoftoxicgas.desc=Откупоривание или разбивание этого герметичного стакана приведет к взрыву его содержимого, в результате которого образуется смертоносное облако токсичного зеленого газа. Возможно, вы предпочтете бросить это зелье в врагов на расстоянии, вместо того чтобы откупоривать его вручную.
items.potions.potionoftoxicgas.name=зелье токсичного газа
items.quest.ceremonialcandle.desc=Набор свечей, расплавленных и сплавленных вместе в процессе использования. Сами по себе они бесполезны, но, используемые вместе с другими свечами в определенной последовательности, они могут сфокусировать энергию для ритуала призыва.
items.quest.ceremonialcandle.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
items.quest.ceremonialcandle.name=церемониальная свеча
items.quest.corpsedust.chill=По спине пробегает мурашка.
items.quest.corpsedust.desc=Шар из трупной пыли внешне ничем не отличается от обычного пыльного шара. Но внутри него чувствуется зловещая энергия. Избавиться от него как можно скорее было бы хорошей идеей.
items.quest.corpsedust.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
items.quest.corpsedust.name=трупная пыль
items.quest.darkgold.desc=Этот металл называется тёмным не из-за своего цвета (он ничем не отличается от обычного золота), а потому что он плавится на дневном свете, что делает его непригодным для использования на поверхности.
items.quest.darkgold.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
items.quest.darkgold.name=темная золотая руда
items.quest.darkgold.you_now_have=Теперь у вас есть темная золотая руда %d.
items.quest.dwarftoken.desc=Многие гномы и некоторые из их более крупных творений носят с собой эти маленькие металлические предметы неизвестного назначения. Возможно, это украшения или какие-то идентификационные документы. Гномы — странный народ.
items.quest.dwarftoken.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
items.quest.dwarftoken.name=жетон гнома
items.quest.embers.desc=Особые угли, которые можно собрать только с молодых огненных элементалей. Они излучают тепловую энергию.
items.quest.embers.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
items.quest.embers.name=элементарные угли
items.quest.escapecrystal.ac_use=ИСПОЛЬЗОВАТЬ
items.quest.escapecrystal.desc=Тонкий магический кристалл, который, кажется, содержит магию телепортации. Вы можете использовать кристалл в любое время, чтобы покинуть гномье хранилище, но ничего с собой вынести не сможете!
items.quest.escapecrystal.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
items.quest.escapecrystal.name=кристалл побега
items.quest.gooblob.desc=Желеобразный комок слизи, отделившийся от Слизи при её смерти. Он почти как большой желеобразный шар, хотя вы бы не осмелились его съесть. Сам по себе он ничего не делает, но может быть полезен в сочетании с некоторыми зельями или бомбой. По крайней мере, он должен превратиться в приличное количество энергии.
items.quest.gooblob.discover_hint=Этот предмет можно получить в качестве добычи с некоторых врагов.
items.quest.gooblob.name=комок липкой массы
items.quest.metalshard.desc=Осколок ржавого проклятого металла, отколовшийся от DM-300 при его уничтожении. В нём чувствуется неактивная зловещая магия. Сам по себе он ничего не делает, но может быть полезен в сочетании с определёнными свитками или бомбой. По крайней мере, он должен преобразовываться в приличное количество энергии.
items.quest.metalshard.discover_hint=Этот предмет можно получить в качестве добычи с некоторых врагов.
items.quest.metalshard.name=проклятый металлический осколок
items.quest.pickaxe.ability_desc=Дуэлист может _пронзить_ врага киркой. Это гарантированное попадание, накладывает эффект уязвимости на 3 хода и наносит _%1$d-%2$d урона_ врагам с твердой кожей.
items.quest.pickaxe.ability_name=пронзить
items.quest.pickaxe.desc=Это прочный и тяжёлый инструмент для дробления камней. Для добычи ресурсов с его помощью не обязательно экипировать кирку, но в крайнем случае его можно использовать как оружие.
items.quest.pickaxe.discover_hint=Этот предмет можно найти во время выполнения определённого задания.
items.quest.pickaxe.name=кирка
items.quest.pickaxe.upgrade_ability_stat_name=Урон от способностей
items.quest.ratskull.desc=Удивительно большой череп крысы. Из него получился бы отличный охотничий трофей, если бы у вас была возможность повесить его на стену.
items.quest.ratskull.name=гигантский крысиный череп
items.remains.bowfragment.desc=Этот обломок дерева когда-то был частью потерянного лука Охотницы. Вы всё ещё можете почувствовать в нём немного природной энергии, и можете использовать его, чтобы вырастить вокруг себя высокую траву. Однако это уничтожит обломок.
items.remains.bowfragment.name=фрагмент лука
items.remains.brokenhilt.desc=Эта сломанная рукоять выглядит так, будто она от оружия побежденного дуэлиста. В ней еще чувствуется некоторая боевая мощь, которую можно использовать для получения небольшого бонуса к урону в следующих двух ударах ближнего боя. Однако это приведет к разрушению рукояти.
items.remains.brokenhilt.name=сломанная рукоять
items.remains.brokenstaff.desc=Этот магический посох сломан пополам после смерти его владельца. Вы всё ещё можете почувствовать в посохе остатки магической энергии, которую можно использовать для небольшого увеличения заряда ваших волшебных палочек. Однако это приведёт к уничтожению посоха.
items.remains.brokenstaff.name=сломанный посох
items.remains.cloakscrap.desc=Этот клочок полупрозрачной ткани выглядит так, будто он от плаща теней какого-то позднего разбойника. В нём всё ещё чувствуется немного мистической энергии, которую можно использовать для небольшого повышения заряда ваших артефактов. Однако это приведёт к разрушению ткани.
items.remains.cloakscrap.name=клочок ткани
items.remains.remainsitem.ac_use=ИСПОЛЬЗОВАТЬ
items.remains.remainsitem.discover_hint=Этот предмет можно найти в останках определённого героя из предыдущего неудачного прохождения.
items.remains.sealshard.desc=Эти крошечные осколки красного воска выглядят так, будто они отпечатались на печати павшего Воина. Вы всё ещё можете почувствовать остатки силы воли, которые держатся за печать, и использовать их для создания небольшой защиты. Однако это разрушит осколки печати.
items.remains.sealshard.name=осколки печати
items.remains.tornpage.desc=Эта страница выглядит так, будто её вырвали из просроченного священного фолианта жреца. На ней всё ещё сохранилось немного божественной энергии, которую можно использовать для восстановления небольшого количества здоровья. Однако это уничтожит вырванную страницу.
items.remains.tornpage.name=разорванная страница
items.rings.ring.agate=агатовое кольцо
items.rings.ring.amethyst=аметистовое кольцо
items.rings.ring.curse_known=В этом кольце чувствуется зловещая магия.
items.rings.ring.cursed_worn=Поскольку это кольцо проклято, вы бессильны снять его.
items.rings.ring.diamond=бриллиантовое кольцо
items.rings.ring.emerald=изумрудное кольцо
items.rings.ring.equip_cursed=Кольцо болезненно сжимает палец!
items.rings.ring.garnet=кольцо с гранатом
items.rings.ring.identify=Теперь вы достаточно хорошо знакомы со своим кольцом, чтобы его узнать.
items.rings.ring.known=Это %s
items.rings.ring.not_cursed=Это кольцо свободно от злой магии.
items.rings.ring.onyx=кольцо с ониксом
items.rings.ring.opal=опаловое кольцо
items.rings.ring.quartz=кварцевое кольцо
items.rings.ring.ruby=рубиновое кольцо
items.rings.ring.sapphire=сапфировое кольцо
items.rings.ring.topaz=кольцо с топазом
items.rings.ring.tourmaline=кольцо с турмалином
items.rings.ring.unknown_desc=Это металлическое кольцо украшено большим %s, который сверкает в темноте. Кто знает, что будет, если его надеть?
items.rings.ringofaccuracy.combined_stats=Ваши надетые кольца объединяют свою силу, повышая вашу точность в сумме на _%s%%_.
items.rings.ringofaccuracy.desc=Это кольцо увеличивает шанс попасть по врагу.
items.rings.ringofaccuracy.name=кольцо точности
items.rings.ringofaccuracy.stats=При ношении это кольцо повысит вашу точность на _%s%%._
items.rings.ringofaccuracy.typical_stats=При ношении это кольцо, как правило, повышает вашу точность на _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Повышение точности
items.rings.ringofarcana.combined_stats=Сила ваших надетых колец суммируется, увеличивая силу зачарований и глифов в общей сложности на _%s%%_.
items.rings.ringofarcana.desc=Это кольцо усиливает магические зачарования на оружии и глифы на доспехах, включая проклятия! Сначала оно увеличивает вероятность активации, а затем усиливает эффект, когда вероятность активации достигает 100%. Проклятое кольцо, напротив, ослабляет зачарования, глифы и проклятия.
items.rings.ringofarcana.name=кольцо арканы
items.rings.ringofarcana.stats=При ношении это кольцо увеличит силу заклинаний и глифов на _%s%%._
items.rings.ringofarcana.typical_stats=При ношении это кольцо обычно увеличивает силу заклинаний и глифов на _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Усиление Арканы
items.rings.ringofelements.combined_stats=Ваши надетые кольца объединяют свою силу, обеспечивая суммарную элементальную защиту _%s%%_.
items.rings.ringofelements.desc=Это кольцо даёт сопротивление огню, электричеству, газам и другим стихиям. Также оно сокращает длительность вредных эффектов.
items.rings.ringofelements.name=кольцо стихий
items.rings.ringofelements.stats=При ношении это кольцо обеспечит защиту от стихий.
items.rings.ringofelements.typical_stats=При ношении это кольцо, как правило, обеспечивает защиту от стихийных бедствий.
items.rings.ringofelements.upgrade_stat_name_1=Сопротивление
items.rings.ringofenergy.combined_stats=Ваши надетые кольца объединяют свою силу, увеличивая скорость зарядки в сумме на _%s%%_.
items.rings.ringofenergy.desc=Ваше магическое снаряжение будет быстрее восстанавливаться в магическом поле, исходящем от этого кольца. Проклятое кольцо, напротив, будет восстанавливаться медленнее.
items.rings.ringofenergy.name=кольцо энергии
items.rings.ringofenergy.stats=При ношении это кольцо увеличит скорость зарядки жезла, артефакта и героической брони на _%s%%._
items.rings.ringofenergy.typical_stats=При ношении это кольцо обычно увеличивает скорость зарядки жезла, артефакта и героической брони на _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Ускорение зарядки
items.rings.ringofevasion.combined_stats=Ваши надетые кольца объединяют свою силу, увеличивая вашу общую уклоняемость на _%s%%_.
items.rings.ringofevasion.desc=Это кольцо увеличивает шанс уклониться от вражеской атаки.
items.rings.ringofevasion.name=кольцо уклонения
items.rings.ringofevasion.stats=При ношении это кольцо увеличит вашу уклонение на _%s%%._
items.rings.ringofevasion.typical_stats=При ношении это кольцо, как правило, увеличивает вашу способность уклоняться от ударов на _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Усиление уклонения
items.rings.ringofforce$brawlersstance.desc=В этой стойке обычные атаки Дуэлистки будут использовать экипированное кольцо силы, даже если у неё экипировано оружие. Эти атаки получают бонусный урон и по-прежнему будут использовать усиление и зачарование оружия. Поддержание этой стойки требует концентрации, однако скорость перезарядки способностей оружия снижается на 50%. Эту стойку можно включать и выключать с помощью кольца силы, но снижение скорости зарядки будет сохраняться некоторое время, если стойка быстро активируется и деактивируется.
items.rings.ringofforce$brawlersstance.name=стойка бойца
items.rings.ringofforce.ability_desc=Дуэлистка может принять стойку бойца с этим кольцом, в результате чего её обычные атаки всегда будут использовать это кольцо, даже если у неё экипировано оружие. Эти атаки будут наносить _%1$d-%2$d урона_ и также будут наследовать зачарование и улучшение оружия. Эта стойка замедляет скорость перезарядки оружия на 50%%.
items.rings.ringofforce.ability_name=стойка бойца
items.rings.ringofforce.combined_stats=Ваши надетые кольца объединяют свою силу, нанося в сумме _%1$d-%2$d урона_ без оружия или увеличивая урон на _%3$d_ с оружием.
items.rings.ringofforce.desc=Это кольцо усиливает силу ударов в ближнем бою. Эта дополнительная сила довольно слаба при использовании оружия, но безоружный удар станет намного мощнее. Проклятое кольцо, напротив, ослабит удары владельца.
items.rings.ringofforce.name=кольцо силы
items.rings.ringofforce.stats=В режиме без оружия, при вашем текущем уровне силы, это кольцо нанесет _%1$d-%2$d урона._ При наличии оружия это кольцо увеличит урон на _%3$d._
items.rings.ringofforce.typical_ability_desc=Дуэлистка может принять стойку бойца с этим кольцом, в результате чего её обычные атаки всегда будут использовать это кольцо, даже если у неё экипировано оружие. Эти атаки обычно наносят _%1$d-%2$d урона_ и также наследуют зачарование и улучшение оружия. Эта стойка замедляет скорость перезарядки оружия на 50%%.
items.rings.ringofforce.typical_stats=В режиме без оружия, при вашем текущем уровне силы, это кольцо обычно наносит _%1$d-%2$d урона._ При наличии оружия, обычно это кольцо увеличивает урон на _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Урон без оружия
items.rings.ringofforce.upgrade_stat_name_2=Усиление урона от оружия
items.rings.ringofforce.upgrade_stat_name_3=Урон от способностей
items.rings.ringoffuror.combined_stats=Ваши надетые кольца объединяют свою силу, увеличивая скорость ваших атак в сумме на _%s%%_.
items.rings.ringoffuror.desc=Это кольцо наделяет своего владельца внутренней яростью, позволяя ему атаковать быстрее. Проклятое кольцо, напротив, замедлит скорость атаки владельца.
items.rings.ringoffuror.name=кольцо ярости
items.rings.ringoffuror.stats=При ношении это кольцо увеличит скорость ваших атак на _%s%%._
items.rings.ringoffuror.typical_stats=При ношении это кольцо обычно увеличивает скорость ваших атак на _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Увеличение скорости атаки
items.rings.ringofhaste.combined_stats=Ваши надетые кольца объединяют свою силу, увеличивая вашу скорость передвижения в сумме на _%s%%_.
items.rings.ringofhaste.desc=Это кольцо ускоряет течение времени для своего владельца, позволяя выполнять любые действия немного быстрее.
items.rings.ringofhaste.name=кольцо скорости
items.rings.ringofhaste.stats=При ношении это кольцо увеличит вашу скорость передвижения на _%s%%._
items.rings.ringofhaste.typical_stats=При ношении это кольцо, как правило, увеличивает вашу скорость передвижения на _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Ускорение передвижения
items.rings.ringofmight.combined_stats=Ваши надетые кольца объединяют свою силу, увеличивая вашу общую силу на _%1$d_ и максимальное количество HP на _%2$s%%_.
items.rings.ringofmight.desc=Это кольцо усиливает физические качества своего владельца, даруя ему большую физическую силу и выносливость. Проклятое кольцо ослабит своего владельца.
items.rings.ringofmight.name=кольцо могущества
items.rings.ringofmight.stats=При ношении это кольцо увеличит вашу силу на _%1$d_ и максимальное количество HP на _%2$s%%_.
items.rings.ringofmight.typical_stats=При ношении это кольцо обычно увеличивает вашу силу на _%1$d_ и максимальное количество HP на _%2$s%%_.
items.rings.ringofmight.upgrade_stat_name_1=повышение силы
items.rings.ringofmight.upgrade_stat_name_2=Максимальное увеличение HP
items.rings.ringofsharpshooting.combined_stats=Ваши надетые кольца объединяют свою силу, повышая эффективный уровень метательного оружия на _%1$d_ и увеличивая его прочность на _%2$s%%_ в сумме.
items.rings.ringofsharpshooting.desc=Это кольцо повышает точность и меткость владельца, благодаря чему все метательные виды оружия становятся более разрушительными и живучими. Проклятое кольцо окажет противоположный эффект.
items.rings.ringofsharpshooting.name=кольцо снайперской стрельбы
items.rings.ringofsharpshooting.stats=При ношении это кольцо увеличит урон от вашего метательного оружия, как если бы его уровень был повышен на _%1$d_, и повысит его прочность на _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=При ношении это кольцо, как правило, увеличивает урон от метательного оружия, как если бы его уровень был повышен на _%1$d_, и повышает его прочность на _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Повышение урона по уровню
items.rings.ringofsharpshooting.upgrade_stat_name_2=Повышение долговечности
items.rings.ringoftenacity.combined_stats=Ваши надетые кольца объединяют свою силу, снижая получаемый вами урон в сумме до _%s%%_.
items.rings.ringoftenacity.desc=При ношении это кольцо позволит своему владельцу противостоять обычным смертельным ударам. Чем сильнее ранен пользователь, тем выше будет его устойчивость к повреждениям. Проклятое же кольцо, наоборот, облегчит врагам убийство владельца.
items.rings.ringoftenacity.name=кольцо упорства
items.rings.ringoftenacity.stats=При ношении это кольцо уменьшит получаемый вами урон до _%s%%._
items.rings.ringoftenacity.typical_stats=При ношении это кольцо, как правило, снижает получаемый вами урон до _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Максимальное сопротивление урону
items.rings.ringofwealth.combined_stats=Ваши надетые кольца объединяют свою силу, увеличивая вашу удачу в сумме на _%s%%_.
items.rings.ringofwealth.desc=Это кольцо действует как магнит для сокровищ, увеличивая вероятность того, что враги и контейнеры будут переносить ценные предметы. Проклятое же кольцо, наоборот, уменьшит ваши шансы получить добычу.
items.rings.ringofwealth.name=кольцо богатства
items.rings.ringofwealth.stats=Ношение этого кольца увеличит вашу удачу на _%s%%._
items.rings.ringofwealth.typical_stats=При ношении это кольцо, как правило, увеличивает вашу удачу на _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Усиление удачи
items.scrolls.exotic.exoticscroll.berkanan=экзотический свиток Берканана
items.scrolls.exotic.exoticscroll.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.scrolls.exotic.exoticscroll.gyfu=экзотический свиток ГЮФУ
items.scrolls.exotic.exoticscroll.isaz=экзотический свиток ИСАЗ
items.scrolls.exotic.exoticscroll.kaunan=экзотический свиток КАУНАНА
items.scrolls.exotic.exoticscroll.laguz=экзотический свиток Лагуза
items.scrolls.exotic.exoticscroll.mannaz=экзотический свиток МАННАЗА
items.scrolls.exotic.exoticscroll.naudiz=экзотический свиток Наудиза
items.scrolls.exotic.exoticscroll.odal=экзотический свиток ОДАЛА
items.scrolls.exotic.exoticscroll.raido=экзотический свиток RAIDO
items.scrolls.exotic.exoticscroll.sowilo=экзотический свиток СОВИЛО
items.scrolls.exotic.exoticscroll.tiwaz=экзотический свиток ТИВАЗ
items.scrolls.exotic.exoticscroll.unknown_desc=На этом чёрном пергаменте написана светящаяся, неразборчивая магическая руна. Кажется, она чужда этой земле, кто знает, что произойдёт, если её прочитать вслух?
items.scrolls.exotic.exoticscroll.yngvi=экзотический свиток YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Заклинание на этом свитке окружит вас магической аурой, которая временно блокирует все магические эффекты, как вредные, так и полезные. Это включает в себя эффекты большинства магических предметов, таких как жезлы, свитки, кольца, артефакты, зачарования и проклятия. Однако способности героической брони достаточно сильны, чтобы действовать независимо от этого.
items.scrolls.exotic.scrollofantimagic.name=свиток антимагии
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Вокруг вас появилась волшебная арена, обозначенная клубящимся красным туманом. Пока вы стоите в тумане, ваш голод не будет увеличиваться, и вы будете получать на 33%% меньше урона от всех источников. Если у вас есть другие источники снижения урона (например, броня), они будут применяться после снижения на 33%%.\n\nОсталось ходов: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=арена испытаний
items.scrolls.exotic.scrollofchallenge.desc=При прочтении вслух этот свиток издаст оглушительный рёв, который привлечёт врагов к пользователю, одновременно создавая вокруг него небольшую арену. Пока читающий находится на этой арене, он будет получать на 33% меньше урона от всех источников (это применяется до применения других форм снижения урона) и не будет терять чувство сытости. Размер арены будет масштабироваться в зависимости от размера области, в которой находится читающий. В некоторых областях с боссами она будет особенно мала.
items.scrolls.exotic.scrollofchallenge.name=свиток испытания
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ваш свиток гадания определил следующие предметы:
items.scrolls.exotic.scrollofdivination.desc=Этот свиток случайным образом определит четыре типа предметов, которые вам пока неизвестны. Типы могут быть определены по цвету зелья, руне свитка или драгоценному камню кольца. Определенные предметы не обязательно будут теми, которые вы носите с собой.
items.scrolls.exotic.scrollofdivination.name=свиток гадания
items.scrolls.exotic.scrollofdivination.nothing_left=Идентифицировать больше нечего!
items.scrolls.exotic.scrollofdread.desc=При прочтении этот свиток испустит вспышку красного света, которая вселит невероятный ужас во всех врагов в вашем поле зрения. Эффект настолько силен, что они быстро попытаются сбежать из подземелья и больше никогда не появятся! Как и в случае с ужасом, этот эффект может исчезнуть со временем или при нападении на врага. Сильные духом враги, такие как боссы, будут наделены обычным ужасом.
items.scrolls.exotic.scrollofdread.name=свиток ужаса
items.scrolls.exotic.scrollofenchantment.armor=Выберите глиф, который хотите применить к своей броне.
items.scrolls.exotic.scrollofenchantment.cancel=отмена
items.scrolls.exotic.scrollofenchantment.cancel_warn=Отмена действия все равно приведет к расходованию свитка зачарования, вы уверены?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Нет, я передумал.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Да, я уверен.
items.scrolls.exotic.scrollofenchantment.desc=Этот свиток наполнит оружие или доспехи мощной магической энергией. Читатель даже в некоторой степени контролирует, какая именно магия будет наделена энергией.
items.scrolls.exotic.scrollofenchantment.inv_title=Зачаровать предмет
items.scrolls.exotic.scrollofenchantment.name=свиток заклинаний
items.scrolls.exotic.scrollofenchantment.weapon=Выберите зачарование, которое хотите применить к своему оружию.
items.scrolls.exotic.scrollofforesight.desc=После прочтения этого свитка информация о местности вокруг будет постоянно и кристально чисто передаваться в сознание читателя. Этот эффект длится довольно долго и позволит обнаружить все скрытые двери или ловушки, что сделает поиски ненужными.
items.scrolls.exotic.scrollofforesight.name=свиток предвидения
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Отмена все равно приведет к расходованию свитка метаморфозы, вы уверены?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Выберите талант, который вы хотите преобразить.
items.scrolls.exotic.scrollofmetamorphosis.desc=Этот свиток содержит мощную магию трансмутации, которая будет применяться к заклинателю, а не к предмету. Магия этого свитка позволит вам выбрать один талант и заменить его одним из пяти талантов того же уровня из разных классов героев! Этот эффект может применяться только к талантам класса, а не к талантам, полученным от подклассов или способностей брони. Таланты, которые вы не можете использовать, не будут доступны в качестве вариантов.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=метаморфоза таланта
items.scrolls.exotic.scrollofmetamorphosis.name=свиток метаморфозы
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Выберите новый талант, которым заменит ваш преображенный талант.
items.scrolls.exotic.scrollofmysticalenergy.desc=Необузданная магическая сила, заключенная в этом пергаменте, при высвобождении будет со временем заряжать экипированные пользователем артефакты.
items.scrolls.exotic.scrollofmysticalenergy.name=свиток мистической энергии
items.scrolls.exotic.scrollofpassage.desc=Заклинание на этом пергаменте мгновенно переносит читателя в ближайшую область, на первый этаж выше. Очень удобно, чтобы быстро добраться до магазина.
items.scrolls.exotic.scrollofpassage.name=свиток перехода
items.scrolls.exotic.scrollofprismaticimage.desc=Заклинание на этом свитке создаст красочного иллюзорного двойника читателя. Это призматическое изображение будет действовать как более слабый клон читателя, с аналогичной защитой, но меньшим количеством HP и урона. Если призматическое изображение уже существует, использование этого свитка полностью его восстановит.
items.scrolls.exotic.scrollofprismaticimage.name=свиток с призматическим изображением
items.scrolls.exotic.scrollofpsionicblast.desc=Этот свиток содержит невероятную разрушительную энергию, которую можно направить на уничтожение разума всех видимых существ. Однако он также будет иметь значительные последствия, и читатель получит повреждения, ослепнет и ослабнет. Чем больше целей поразит свиток, тем меньше урона получит сам.
items.scrolls.exotic.scrollofpsionicblast.name=свиток псионического взрыва
items.scrolls.exotic.scrollofpsionicblast.ondeath=Псионический взрыв разрывает ваш разум на части...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Это существо было околдовано магией свитка с песней сирены. \n\nОчарованный персонаж навсегда станет вашим союзником и будет сражаться с любыми врагами, которых встретит.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=очарованный
items.scrolls.exotic.scrollofsirenssong.cancel=Вы должны выбрать цель.
items.scrolls.exotic.scrollofsirenssong.desc=Прочтение этого свитка издаёт пленительную мелодию, которая очарует выбранного врага, навсегда превратив его в союзника! Другие враги, услышавшие её, будут временно очарованы. Особенно сильные враги могут противостоять эффекту очарования и вместо этого будут очарованы.
items.scrolls.exotic.scrollofsirenssong.name=свиток песни сирены
items.scrolls.exotic.scrollofsirenssong.no_target=Флешмоб активируется без указания цели.
items.scrolls.exotic.scrollofsirenssong.prompt=Выберите цель
items.scrolls.inventoryscroll.no=Нет, я передумал.
items.scrolls.inventoryscroll.warning=Вы действительно хотите отменить использование этого свитка? Свиток не был ранее идентифицирован, поэтому он всё равно будет использован.
items.scrolls.inventoryscroll.yes=Да, я уверен.
items.scrolls.scroll$placeholder.name=прокрутка
items.scrolls.scroll.ac_read=ЧИТАТЬ
items.scrolls.scroll.berkanan=свиток БЕРКАНАНА
items.scrolls.scroll.blinded=Невозможно прочитать свиток, будучи слепым.
items.scrolls.scroll.cursed=Ваша проклятая книга заклинаний не позволяет вам использовать магию этого свитка! Однако свиток снятия проклятия может оказаться достаточно сильным, чтобы всё же сработать...
items.scrolls.scroll.gyfu=свиток ГЮФУ
items.scrolls.scroll.isaz=свиток ИСАЗ
items.scrolls.scroll.kaunan=свиток КАУНАНА
items.scrolls.scroll.laguz=свиток Лагуза
items.scrolls.scroll.mannaz=свиток МАННАЗА
items.scrolls.scroll.naudiz=свиток Наудиза
items.scrolls.scroll.no_magic=Вы не можете читать свиток, если у вас есть иммунитет к магии.
items.scrolls.scroll.odal=свиток ОДАЛА
items.scrolls.scroll.raido=свиток RAIDO
items.scrolls.scroll.sowilo=свиток Совило
items.scrolls.scroll.tiwaz=свиток Тиваз
items.scrolls.scroll.unknown_desc=Этот пергамент покрыт неразборчивыми письменами и озаглавлен руной %s. Кто знает, что будет, если прочесть его вслух?
items.scrolls.scroll.yngvi=свиток ИНГВИ
items.scrolls.scrollofidentify.desc=Навсегда раскрывает все секреты одного предмета.
items.scrolls.scrollofidentify.inv_title=Определите предмет
items.scrolls.scrollofidentify.it_is=Ваш товар идентифицирован: %s.
items.scrolls.scrollofidentify.name=свиток опознания
items.scrolls.scrolloflullaby.desc=Успокаивающая мелодия погрузит всех существ в поле вашего зрения в глубокий сон, дав вам возможность убежать или нанести им внезапный удар.
items.scrolls.scrolloflullaby.name=свиток колыбельной
items.scrolls.scrolloflullaby.sooth=Свиток издает успокаивающую мелодию. Вас охватывает сильная сонливость.
items.scrolls.scrollofmagicmapping.desc=Прочитав этот свиток, вы навсегда запомните образ кристальной четкости, который укажет на точное расположение уровней и раскроет все скрытые секреты. Местонахождение предметов и существ останется неизвестным.
items.scrolls.scrollofmagicmapping.layout=Теперь вы знаете расположение уровней.
items.scrolls.scrollofmagicmapping.name=свиток магического картирования
items.scrolls.scrollofmirrorimage.copies=Свиток образует ваши зеркальные отражения.
items.scrolls.scrollofmirrorimage.desc=Заклинание на этом свитке создаст иллюзорных двойников читателя, которые будут преследовать его врагов.
items.scrolls.scrollofmirrorimage.name=свиток зеркального изображения
items.scrolls.scrollofmirrorimage.no_copies=Свиток пытается создать ваши зеркальные изображения, но им некуда деваться.
items.scrolls.scrollofrage.desc=При прочтении вслух этот свиток издаст оглушительный рёв, который привлечёт к читающему всех врагов и приведёт в ярость находящихся поблизости.
items.scrolls.scrollofrage.name=свиток ярости
items.scrolls.scrollofrage.roar=Свиток издает яростный рев, эхом разносящийся по всему подземелью!
items.scrolls.scrollofrecharging.desc=Необузданная магическая сила, заключенная в этом пергаменте, при высвобождении восстановит полную мощность всех волшебных палочек читателя.
items.scrolls.scrollofrecharging.name=свиток перезарядки
items.scrolls.scrollofrecharging.surge=По вашему телу прокатывается мощный поток энергии, наполняя ваши волшебные палочки силой!
items.scrolls.scrollofremovecurse.cleansed=Ваш предмет излучает очищающий свет, и злая энергия рассеивается!
items.scrolls.scrollofremovecurse.desc=Заклинание на этом свитке мгновенно снимет с оружия, доспехов, колец и других предметов, которые носит читатель, любые злые чары, которые могут помешать владельцу снять их.
items.scrolls.scrollofremovecurse.inv_title=Очистить предмет
items.scrolls.scrollofremovecurse.name=свиток снятия проклятия
items.scrolls.scrollofremovecurse.not_cleansed=Ваш предмет светится очищающим светом, но ничего не происходит.
items.scrolls.scrollofremovecurse.spirit=Ваш свиток освобождает истерзанный дух!
items.scrolls.scrollofretribution.blast=Из свитка исходит мощная магическая энергия!
items.scrolls.scrollofretribution.desc=Этот свиток содержит разрушительную энергию, которая направляет страдания читателя наружу в мощный энергетический взрыв. Чем слабее читатель, тем больше урона он нанесет. При очень низком уровне здоровья этот свиток может мгновенно убить большинство врагов. Однако использование свитка наносит пользователю вред, ослепляя и ослабляя его.
items.scrolls.scrollofretribution.name=свиток возмездия
items.scrolls.scrollofteleportation.cant_reach=Телепортироваться туда нельзя.
items.scrolls.scrollofteleportation.desc=Заклинание на этом пергаменте мгновенно переносит читателя в случайное место на уровне подземелья. Его можно использовать для выхода из опасной ситуации, но невезучий читатель может оказаться в ещё более опасном месте.
items.scrolls.scrollofteleportation.name=свиток телепортации
items.scrolls.scrollofteleportation.no_tele=Магия телепортации не сработала.
items.scrolls.scrollofteleportation.prompt=Выберите место для телепортации.
items.scrolls.scrollofteleportation.tele=В мгновение ока вас телепортировало в другое место на уровне.
items.scrolls.scrollofterror.desc=Вспышка красного света повергнет всех существ в поле вашего зрения в ужас, и они повернутся и убегут. Атака убегающего врага развеет этот эффект.
items.scrolls.scrollofterror.many=Свиток испускает ослепительную вспышку красного света, и чудовища разбегаются!
items.scrolls.scrollofterror.name=свиток ужаса
items.scrolls.scrollofterror.none=Свиток испускает яркую вспышку красного света.
items.scrolls.scrollofterror.one=Свиток испускает яркую вспышку красного света, и %s убегает!
items.scrolls.scrolloftransmutation.desc=Этот свиток содержит мощную магию трансмутации. При использовании на подходящем предмете он превратит его в другой предмет того же типа. Магия сохранит даже улучшения, зачарования и глифы. Свитки и зелья будут трансмутированы в свои экзотические аналоги, и наоборот.
items.scrolls.scrolloftransmutation.inv_title=Преобразовать предмет
items.scrolls.scrolloftransmutation.morph=Ваш предмет превращается во что-то другое!
items.scrolls.scrolloftransmutation.name=свиток трансмутации
items.scrolls.scrolloftransmutation.nothing=Ничего интересного не происходит.
items.scrolls.scrollofupgrade.desc=Этот свиток улучшит один предмет, повысив его качество. Мощь и количество зарядов волшебной палочки возрастут; оружие будет наносить больше урона или чаще попадать в цель; доспехи будут отражать больше ударов; эффект кольца на его владельца усилится. Для использования оружия и доспехов также потребуется меньше силы, а любые проклятия, наложенные на предмет, будут сняты.
items.scrolls.scrollofupgrade.inv_title=Улучшить предмет
items.scrolls.scrollofupgrade.name=свиток улучшения
items.scrolls.scrollofupgrade.remove_curse=Свиток улучшения снимает проклятие с вашего предмета!
items.scrolls.scrollofupgrade.weaken_curse=Свиток улучшения ослабляет проклятие, наложенное на ваш предмет.
items.spells.alchemize$wndalchemizeitem.energize=Превратитесь в энергию %d
items.spells.alchemize$wndalchemizeitem.energize_1=Превратите 1 в энергию %d
items.spells.alchemize$wndalchemizeitem.energize_all=Превратите всё в энергию %d
items.spells.alchemize$wndalchemizeitem.sell=Превратиться в %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Превратите 1 в %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Превратите все в %dg
items.spells.alchemize.desc=Это заклинание обладает трансмутационными свойствами, подобными тем, что содержатся в алхимическом сосуде. Каждое применение позволяет пользователю превратить предмет (или стопку предметов) в золото или алхимическую энергию. Превращение зелий или свитков в энергию даже позволит их идентифицировать! Некоторые применения заклинания «Алхимизация» продаются в магазинах, но гораздо большее количество можно создать с помощью алхимии, объединив семя, рунный камень и немного алхимической энергии.
items.spells.alchemize.name=алхимизировать
items.spells.alchemize.prompt=Превратить предмет в алхимический.
items.spells.beaconofreturning.creatures=Психическая аура соседних существ в данный момент не позволяет вам телепортироваться.
items.spells.beaconofreturning.desc=Это сложное заклинание даёт пользователю возможность вернуться в заданное место, независимо от расстояния. Заклинание будет использовано только при возвращении, его можно применять сколько угодно раз, но оно запомнит только последнее местоположение, в котором было установлено.
items.spells.beaconofreturning.desc_set=Этот маяк был установлен где-то на этаже %d.
items.spells.beaconofreturning.name=маяк возвращения
items.spells.beaconofreturning.preventing=Сильная магическая аура этого места не позволяет вам использовать заклинание!
items.spells.beaconofreturning.set=Сигнальный маяк установлен в вашем текущем местоположении.
items.spells.beaconofreturning.wnd_body=Настройка переопределит местоположение, которое было установлено маяком ранее. \n\nВозвращение вернет вас в последнее установленное местоположение и потребует одного применения заклинания.
items.spells.beaconofreturning.wnd_return=ВОЗВРАЩАТЬСЯ
items.spells.beaconofreturning.wnd_set=НАБОР
items.spells.curseinfusion.desc=Это заклинание наделяет предмет экипировки той же мощной злой магией, что и DM-300. Предмет, на который оно применено, немедленно будет проклят, и любые наложенные на него зачарования или глифы будут отменены. В случае с оружием, доспехами и жезлами предмет получит улучшения в дополнение к проклятию. Улучшения от наложения проклятия не суммируются, и улучшения теряются, если предмет становится свободным от проклятия. Несколько наложений проклятия также можно использовать для изменения проклятия на оружии или доспехах.
items.spells.curseinfusion.inv_title=Проклятие предмета
items.spells.curseinfusion.name=вливание проклятия
items.spells.magicalinfusion.desc=Это заклинание обладает той же магической силой, что и свиток улучшения, но в более стабильной форме. Помимо обычного улучшения предмета, оно никогда не удалит зачарование, глиф или проклятие.
items.spells.magicalinfusion.infuse=Ваш предмет наполнен таинственной энергией!
items.spells.magicalinfusion.inv_title=Наделить предмет
items.spells.magicalinfusion.name=волшебный настой
items.spells.magicalporter.desc=Это заклинание магическим образом переместит любой предмет, на который оно наложено. Однако, в отличие от торгового маяка, предметы будут перемещены к входу на следующий этаж с боссом.
items.spells.magicalporter.inv_title=Перенести предмет
items.spells.magicalporter.name=волшебный носильщик
items.spells.magicalporter.nowhere=Вам некуда перенести предмет.
items.spells.phaseshift.desc=Это хаотическое заклинание телепортирует любого персонажа, на которого оно направлено, в случайное место на текущем этаже и оглушает его на значительное время. Сильные враги смогут противостоять эффекту оглушения. Это заклинание может быть направлено на цель или на самого пользователя.
items.spells.phaseshift.name=фазовый сдвиг
items.spells.phaseshift.no_target=Там нет ничего, куда можно было бы телепортироваться.
items.spells.reclaimtrap.desc=Это заклинание содержит остатки механической энергии DM-300. При применении на действующую ловушку сила ловушки привяжется к вам, позволяя вам использовать заклинание снова, чтобы изгнать эту энергию и активировать эффект ловушки в любом месте по вашему желанию. Однако некоторые ловушки могут не срабатывать во всех местах, и одновременно можно хранить только одну ловушку.
items.spells.reclaimtrap.desc_trap=Заклинание в данный момент готово к запуску _%s._
items.spells.reclaimtrap.name=ловушка для восстановления
items.spells.reclaimtrap.no_trap=Там нет никакой ловушки.
items.spells.recycle.desc=Это заклинание представляет собой менее мощную форму магии трансмутации. Хотя оно не действует на снаряжение, это заклинание превратит свиток, зелье, семя, рунный камень или дротик с наконечником в случайный предмет того же типа.
items.spells.recycle.inv_title=Переработайте предмет
items.spells.recycle.name=переработка
items.spells.recycle.recycled=Ваш товар был переработан в: %s.
items.spells.spell.ac_cast=БРОСАТЬ
items.spells.spell.discover_hint=Этот предмет можно изготовить с помощью алхимии.
items.spells.spell.no_magic=Вы не можете применять заклинания, если у вас есть иммунитет к магии.
items.spells.summonelemental.ac_imbue=ИМБУ
items.spells.summonelemental.desc=Это заклинание направляет энергию элементальных углей, использованных для его создания, и позволит вам призвать дружественного элементаля для сражения на вашей стороне! За один раз можно призвать только одного элементаля, но заклинание можно использовать повторно, чтобы вернуть элементаля вам бесплатно.
items.spells.summonelemental.desc_chaos=В данный момент заклинание излучает хаотическую энергию и призовет элементаля хаоса. Вы можете наделить его другим предметом, но заклинание потеряет текущее действие.
items.spells.summonelemental.desc_fire=В данный момент предмет, на который действует заклинание, горячий на ощупь, и он призовет огненного элементаля. Вы можете наделить его другим заклинанием, но при этом заклинание потеряет текущее действие.
items.spells.summonelemental.desc_frost=В данный момент заклинание холодное на ощупь, оно призовет элементаля льда. Вы можете наделить его другим предметом, но заклинание потеряет текущее наложение эффекта.
items.spells.summonelemental.desc_newborn=В настоящее время заклинание не зачаровано и призывает _новорожденного элементаля_ без возможности атаки на расстоянии. Вы можете зачаровать его зельем жидкого пламени, зельем мороза, свитком перезарядки или свитком трансмутации, чтобы усилить заклинание, благодаря чему будущие призванные существа будут элементалями полной силы!
items.spells.summonelemental.desc_shock=В данный момент заклинание излучает статическую энергию и призывает элементаля электрического разряда. Вы можете наделить его другим предметом, но заклинание потеряет текущее действие.
items.spells.summonelemental.imbue_prompt=Наделить предмет
items.spells.summonelemental.name=призыв элементаля
items.spells.targetedspell.inv_title=Наделить предмет
items.spells.targetedspell.prompt=Выберите цель
items.spells.telekineticgrab.cant_grab=Вы не сможете это забрать.
items.spells.telekineticgrab.desc=Это заклинание позволяет заклинателю дистанционно захватывать все предметы в определенном месте или все метательные оружия, прилипшие к врагу! Его нельзя использовать для захвата предметов, принадлежащих кому-либо другому, или для захвата контейнеров, таких как сундуки.
items.spells.telekineticgrab.name=телекинетический захват
items.spells.telekineticgrab.no_target=Там не за что ухватиться.
items.spells.unstablespell.desc=Этот небольшой черный квадратный кристалл имеет меняющиеся рунические символы на каждой из своих поверхностей. При активации он запускает эффект случайного свитка. Эффект свитка всегда будет направлен на бой, если в поле вашего зрения есть враги, и всегда будет направлен вне боя в противном случае.
items.spells.unstablespell.name=нестабильное заклинание
items.spells.wildenergy.desc=Это заклинание содержит часть проклятой энергии, которая питала DM-300. При применении оно перезарядит ваши волшебные палочки и изношенные артефакты, а также вызовет случайный эффект проклятой палочки. Однако вы можете выбрать направление, в котором будет направлена эта проклятая магия.
items.spells.wildenergy.name=дикая энергия
items.stones.inventorystone.ac_use=ИСПОЛЬЗОВАТЬ
items.stones.runestone$placeholder.name=рунический камень
items.stones.runestone.discover_hint=Этот предмет можно найти случайным образом в подземелье или изготовить с помощью алхимии.
items.stones.stoneofaggression$aggression.desc=Манипулятивная магия заставляет всех ближайших врагов отдавать предпочтение атаке этого персонажа. \n\nОсталось ходов: %s.
items.stones.stoneofaggression$aggression.name=целевой
items.stones.stoneofaggression.desc=Когда этот камень бросают в союзника или врага, все находящиеся поблизости враги на короткое время начинают атаковать этого персонажа. Однако враги-боссы (\n\nBoss) могут противостоять этому эффекту, значительно сокращая его продолжительность и получая меньше урона от атак своих приспешников.
items.stones.stoneofaggression.name=камень агрессии
items.stones.stoneofaugmentation$wndaugment.cancel=Неважно
items.stones.stoneofaugmentation$wndaugment.choice=Что бы вы хотели улучшить?
items.stones.stoneofaugmentation$wndaugment.damage=Повреждать
items.stones.stoneofaugmentation$wndaugment.defense=Защита
items.stones.stoneofaugmentation$wndaugment.evasion=Уклонение
items.stones.stoneofaugmentation$wndaugment.none=Удалить аугментацию
items.stones.stoneofaugmentation$wndaugment.speed=Скорость
items.stones.stoneofaugmentation.desc=Этот рунный камень обладает мощной магией, которая может улучшать снаряжение, повышая одно свойство за счет другого. Использование на оружии позволит вам увеличить либо скорость, либо урон. Метательное оружие также будет приобретать или терять прочность пропорционально своей скорости. Использование на броне позволит вам улучшить либо защиту, либо уклонение.
items.stones.stoneofaugmentation.discover_hint=Этот предмет можно купить в магазине или изготовить с помощью алхимии.
items.stones.stoneofaugmentation.inv_title=Улучшить предмет
items.stones.stoneofaugmentation.name=камень усиления
items.stones.stoneofblast.desc=Этот рунный камень мгновенно взорвется в том месте, куда его бросят. Как и бомба, взрыв нанесет урон всему, что находится поблизости.
items.stones.stoneofblast.name=камень взрыва
items.stones.stoneofblink.desc=Этот рунный камень телепортирует пользователя в то место, куда он был брошен.
items.stones.stoneofblink.name=камень моргания
items.stones.stoneofclairvoyance.desc=Этот камень мгновенно откроет все клетки на очень широкой площади вокруг места броска. Его действие распространится даже сквозь стены.
items.stones.stoneofclairvoyance.name=камень ясновидения
items.stones.stoneofdeepsleep.desc=Если бросить этот камень во врага, он погрузит его в глубокий магический сон. Враги, находящиеся в магическом сне, будут спать вечно, пока их не потревожат.
items.stones.stoneofdeepsleep.name=камень глубокого сна
items.stones.stoneofdetectmagic.desc=Этот рунный камень способен обнаруживать магию, воздействующую на предмет. Использование этого камня на неопознанном предмете покажет, подвержен ли он воздействию злонамеренного проклятия, а также положительной магии, такой как зачарование или улучшения.
items.stones.stoneofdetectmagic.detected_bad=Вы обнаружили, что на этот предмет воздействует злонамеренная магия!
items.stones.stoneofdetectmagic.detected_both=Вы обнаружили, что на этот предмет воздействует как позитивная, так и злонамеренная магия!
items.stones.stoneofdetectmagic.detected_good=Вы обнаружили, что на этот предмет воздействует позитивная магия!
items.stones.stoneofdetectmagic.detected_none=Вы не обнаружили никакого воздействия магии на этот предмет.
items.stones.stoneofdetectmagic.inv_title=Обнаружить предмет
items.stones.stoneofdetectmagic.name=камень обнаружения магии
items.stones.stoneofdisarming.desc=Этот рунный камень хранит магию, способную обезвредить опасные ловушки, спрятанные по всему подземелью. Он обезвредит до 9 ловушек в области, куда его бросят.
items.stones.stoneofdisarming.name=камень разоружения
items.stones.stoneofenchantment.armor=Ваши доспехи светятся в темноте!
items.stones.stoneofenchantment.desc=Этот рунный камень обладает зачарованной магией. В отличие от свитка улучшения, он не увеличивает прямую силу предмета, а вместо этого наделяет оружие или доспехи зачарованием, даруя им новую силу.
items.stones.stoneofenchantment.inv_title=Зачаровать предмет
items.stones.stoneofenchantment.name=камень чародейства
items.stones.stoneofenchantment.weapon=Ваше оружие светится в темноте!
items.stones.stoneoffear.desc=Если бросить этот камень в персонажа, тот будет охвачен ужасом, повернется и убежит. Нападение на убегающего персонажа сократит эффект.
items.stones.stoneoffear.name=камень страха
items.stones.stoneofflock.desc=Этот рунный камень на короткое время призывает волшебных овец в том месте, куда он был брошен.
items.stones.stoneofflock.name=камень стада
items.stones.stoneofintuition$wndguess.break=Ваш камень интуиции рассыпается в прах...
items.stones.stoneofintuition$wndguess.correct=Верно. Тип товара определен!
items.stones.stoneofintuition$wndguess.incorrect=Ваше предположение было неверным.
items.stones.stoneofintuition$wndguess.text=Угадайте, к какому типу относится неопознанный предмет. Если вы угадаете правильно, тип будет определен!
items.stones.stoneofintuition.break_info=Камни интуиции можно использовать дважды, прежде чем один из них разобьется; _следующее использование не потребует расхода камня_.
items.stones.stoneofintuition.break_warn=Вы уже использовали камень интуиции, поэтому _ваше следующее использование потребует еще один камень_.
items.stones.stoneofintuition.desc=Этот рунический камень содержит ослабленную версию магии, присущей свиткам идентификации. Вместо прямой идентификации предмета, он будет воздействовать на вашу интуицию, позволяя вам попытаться определить тип зелья, свитка или кольца наугад.
items.stones.stoneofintuition.inv_title=Выберите товар
items.stones.stoneofintuition.name=камень интуиции
items.stones.stoneofshock.desc=Этот рунный камень высвобождает поток электрической энергии, который на короткое время оглушает все цели поблизости и заряжает метательный жезл за каждую пораженную цель.
items.stones.stoneofshock.name=камень шока
items.stylus.ac_inscribe=ПОДПИСАТЬСЯ
items.stylus.cursed=Магия стилуса не подействует на проклятые доспехи.
items.stylus.desc=Этот мистический стилус сделан из какого-то темного, очень твердого камня. С его помощью вы можете начертать магический глиф на своих доспехах, но вы не можете выбрать, какой именно глиф это будет — стилус определит его за вас.
items.stylus.identify=Сначала нужно определить, проклята ли эта броня.
items.stylus.inscribed=Вы нанесли надпись на свои доспехи стилусом.
items.stylus.name=загадочный стилус
items.stylus.prompt=Выберите доспехи
items.tengusmask.ac_wear=НОСИТЬ
items.tengusmask.desc=Эта маска упала с лица Тэнгу перед его смертью, и от неё исходит огромная магическая сила. Была ли маска источником силы Тэнгу? \n\nПри ношении огромная сила маски передаётся вам, позволяя _выбрать подкласс для вашего героя._\n\nКакой подкласс вы выберете?
items.tengusmask.discover_hint=Этот предмет можно получить в качестве добычи с некоторых врагов.
items.tengusmask.name=Маска Тэнгу
items.tengusmask.used=Маска распадается, когда её энергия проникает в вас!
items.torch.ac_light=СВЕТ
items.torch.desc=Факел — неотъемлемая часть снаряжения искателей приключений: когда в подземелье гаснет свет, он может помочь указать путь.
items.torch.name=факел
items.trinkets.chaoticcenser.desc=После некоторого времени, проведенного в алхимическом котле, эта кадильница для благовоний, кажется, начинает самостоятельно производить дым! Эти газы накапливаются и будут извергаться из кадильницы в сторону врагов с полуслучайными интервалами. Кажется, она способна производить самые разные газы, но у вас будет предупреждающий момент непосредственно перед тем, как кадильница активируется.
items.trinkets.chaoticcenser.name=хаотичный кадильник
items.trinkets.chaoticcenser.spew=Ваш кадильник вот-вот извергнет: %s.
items.trinkets.chaoticcenser.stats_desc=На текущем уровне этот аксессуар будет создавать опасный газ рядом с врагом примерно каждые _%d_ ходов. Газы будут появляться только при наличии врагов. На более высоких уровнях эти газы, скорее всего, будут более экзотическими и мощными.
items.trinkets.chaoticcenser.typical_stats_desc=Как правило, этот аксессуар будет создавать опасный газ рядом с врагом примерно каждые _%d_ ходов. Газы появляются только в присутствии врагов. На более высоких уровнях эти газы, скорее всего, будут экзотическими и мощными.
items.trinkets.crackedspyglass.desc=Этот ручной телескоп мог бы стать образцом высокого и точного мастерства, если бы не трещина на передней линзе. Подзорная труба, похоже, помогает вам обнаруживать новые предметы в подземелье, но из-за дефекта эти предметы довольно трудно разглядеть!
items.trinkets.crackedspyglass.name=треснувший подзорная труба
items.trinkets.crackedspyglass.stats_desc=На текущем уровне этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже, кроме этажей с боссами.
items.trinkets.crackedspyglass.stats_desc_upgraded=На текущем уровне этот аксессуар имеет _100%% шанс_ создать дополнительный скрытый предмет на каждом этаже, кроме этажей с боссами, и _%1$s%% шанс_ создать второй дополнительный скрытый предмет.
items.trinkets.crackedspyglass.typical_stats_desc=Как правило, этот аксессуар имеет _%1$s%% шанс_ создать дополнительный скрытый предмет на каждом этаже, кроме этажей с боссами.
items.trinkets.dimensionalsundial.desc=Эти маленькие ручные солнечные часы каким-то образом способны отбрасывать тень в глубине подземелья, даже если вы не держите их вертикально. Что еще более странно, положение тени, похоже, никак не связано с положением солнца в этом мире. Когда тень не отбрасывается, солнечные часы, кажется, притягивают опасность.
items.trinkets.dimensionalsundial.name=объемные солнечные часы
items.trinkets.dimensionalsundial.stats_desc=На текущем уровне этот аксессуар будет снижать частоту появления врагов на _%1$d%%_ в дневное время в реальной жизни (с 8:00 до 20:00) и увеличивать частоту появления врагов на _%2$d%%_ в ночное время (с 20:00 до 8:00).
items.trinkets.dimensionalsundial.typical_stats_desc=Как правило, этот аксессуар снижает частоту появления врагов на _%1$d%%_ в дневное время в реальной жизни (с 8:00 до 20:00) и увеличивает частоту появления врагов на _%2$d%%_ в ночное время (с 20:00 до 8:00).
items.trinkets.dimensionalsundial.warning=Ваши солнечные часы не отбрасывают тень, вы чувствуете беспокойство.
items.trinkets.exoticcrystals.desc=Эти маленькие розовые кристаллы имеют ту же форму, что и кристаллы алхимической энергии. Хотя их нельзя использовать для получения энергии напрямую, они, похоже, каким-то образом влияют на зелья и свитки, которые вы находите.
items.trinkets.exoticcrystals.name=экзотические кристаллы
items.trinkets.exoticcrystals.stats_desc=На текущем уровне этот аксессуар заменит _%s%%_ выпадающих зелий или свитков на их экзотические аналоги. Это не влияет на зелья силы, свитки улучшения или предметы, генерируемые для прохождения опасных комнат.
items.trinkets.exoticcrystals.typical_stats_desc=Как правило, этот аксессуар заменяет выпадающие зелья или свитки на их экзотические аналоги. Это не влияет на зелья силы, свитки улучшения или предметы, создаваемые для прохождения опасных комнат.
items.trinkets.eyeofnewt.desc=Этот золотисто-чёрный глаз тритона — распространённый ингредиент, который теперь используется в качестве украшения. По всей видимости, глаз ухудшает зрение в обмен на возможность видеть вещи по-другому.
items.trinkets.eyeofnewt.name=глаз тритона
items.trinkets.eyeofnewt.stats_desc=На текущем уровне этот аксессуар уменьшит вашу дальность обзора на _%1$s%%_, но также даст вам возможность видеть врагов в пределах _%2$d_ клеток.
items.trinkets.eyeofnewt.typical_stats_desc=Как правило, этот аксессуар уменьшит вашу дальность обзора на _%1$s%%_, но также даст вам возможность видеть врагов в пределах _%2$d_ клеток.
items.trinkets.ferrettuft.desc=Пучок шелковистой белой шерсти хорька, скрепленный салатовой лентой, завязанной бантом. Хорьки известны своей ловкостью, озорством и отсутствием принципов. Часть этой силы, кажется, исходит от этой безделушки, усиливая способность избегать всего, что находится поблизости.
items.trinkets.ferrettuft.name=пучок хорька
items.trinkets.ferrettuft.stats_desc=На текущем уровне этот аксессуар увеличит уклонение всех персонажей на _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Как правило, этот аксессуар увеличивает уклонение всех персонажей на _%1$s%%_.
items.trinkets.mimictooth.desc=Этот большой острый зуб, должно быть, был вырван у очень недовольного мимика. Похоже, он оказывает влияние на мимиков в подземелье, делая их более частыми и опасными.
items.trinkets.mimictooth.name=имитирующий зуб
items.trinkets.mimictooth.stats_desc=На текущем уровне этот аксессуар сделает всех мимиков _%1$sx_ более распространенными и значительно более сложными для обнаружения, но также увеличит количество выпадающей из них добычи. На каждом этаже подземелья также будет _%2$s%%_ шанс обнаружить дополнительно скрытного черного мимика.
items.trinkets.mimictooth.typical_stats_desc=Как правило, этот аксессуар делает всех мимиков более распространёнными и значительно затрудняет их обнаружение, но также увеличивает количество выпадающей с них добычи. На каждом этаже подземелья также есть _%2$s%%_ шанс обнаружить дополнительно скрытного эбенового мимика.
items.trinkets.mossyclump.desc=Этот комок влажного мха, кажется, удерживает влагу, как бы сильно вы его ни сжимали. Он словно волшебным образом связан с самим подземельем, из-за чего трава и вода появляются гораздо чаще.
items.trinkets.mossyclump.name=моховой комок
items.trinkets.mossyclump.stats_desc=На текущем уровне этот аксессуар заставит _%d%%_ этажи без тематики заполниться водой или травой.\n\n Для улучшения этого аксессуара требуется больше энергии.
items.trinkets.mossyclump.typical_stats_desc=Как правило, этот аксессуар заставляет _%d%%_ этажи без тематики заполняться водой или травой.\n\nДля улучшения этого аксессуара требуется больше энергии.
items.trinkets.parchmentscrap.desc=Этот маленький клочок пергамента выглядит так, будто он взят из свитка. Он сохранил часть своей магии и, похоже, оказывает влияние на оружие и доспехи, найденные в подземелье.
items.trinkets.parchmentscrap.name=обрывок пергамента
items.trinkets.parchmentscrap.stats_desc=На текущем уровне этот аксессуар сделает зачарования и глифы обычными, а проклятия на оружии и доспехах — обычными. Проклятия на жезлах, кольцах или артефактах не затрагиваются. Для улучшения этого аксессуара требуется больше энергии.
items.trinkets.parchmentscrap.typical_stats_desc=Как правило, этот аксессуар делает зачарования и глифы обычными, а проклятия на оружии и доспехах — обычными. Проклятия на жезлах, кольцах или артефактах не затрагиваются. Для улучшения этого аксессуара требуется больше энергии.
items.trinkets.petrifiedseed.desc=Это семя окаменело, либо в результате медленных геологических процессов, либо под воздействием магии. По всей видимости, семя магически влияет на флору подземелья, время от времени заменяя семена растений рунными камнями.
items.trinkets.petrifiedseed.name=окаменевшее семя
items.trinkets.petrifiedseed.stats_desc=На текущем уровне этот аксессуар будет заставлять вытоптанную траву чаще выпадать рунные камни вместо семян, а также чаще заставлять высокую траву выпадать предметы.
items.trinkets.petrifiedseed.typical_stats_desc=Как правило, этот амулет заставляет вытоптанную траву чаще выпадать рунные камни вместо семян, а также чаще заставляет высокую траву выпадать предметы.
items.trinkets.ratskull.desc=Эта жутковатая безделушка ненамного больше черепа обычной крысы, что по какой-то причине является редкостью в этом подземелье. Магическое воздействие черепа, похоже, привлекает более редких обитателей подземелья, заставляя их появляться гораздо чаще.
items.trinkets.ratskull.name=череп крысы
items.trinkets.ratskull.stats_desc=На текущем уровне этот амулет снижает вероятность появления редких экзотических врагов _%dx_. Однако череп вдвое менее эффективен в привлечении кристаллических мимиков и бронированных статуй.
items.trinkets.ratskull.typical_stats_desc=Как правило, этот амулет снижает вероятность появления редких экзотических врагов. Однако череп вдвое менее эффективен в привлечении кристаллических мимиков и бронированных статуй.
items.trinkets.saltcube.desc=Этот большой кристалл соли был огранен почти в идеальный куб, и каким-то образом ему удалось вылить половину воды из алхимического сосуда, вместо того чтобы раствориться. Похоже, он волшебным образом обезвоживает и сохраняет пищу, которую вы едите, продлевая чувство сытости, но также замедляя восстановление здоровья, когда вы не голодаете.
items.trinkets.saltcube.name=кубик соли
items.trinkets.saltcube.stats_desc=На текущем уровне этот аксессуар увеличит время до наступления чувства голода на _%1$s%%_, но также снизит скорость восстановления здоровья на _%2$s%%_, если этаж не заблокирован.
items.trinkets.saltcube.typical_stats_desc=Как правило, этот аксессуар увеличивает время до наступления чувства голода на _%1$s%%_, но также снижает скорость восстановления здоровья на _%2$s%%_, если этаж не заблокирован.
items.trinkets.shardofoblivion$thrownusetracker.desc=Вы недавно использовали неопознанное метательное оружие, которое на некоторое время засчитывается как один использованный неопознанный предмет снаряжения для осколка забвения. \n\nОсталось ходов: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Неопознанное метательное оружие использовано
items.trinkets.shardofoblivion$wandusetracker.desc=Вы недавно использовали неопознанную волшебную палочку, которая на некоторое время засчитывается как один использованный неопознанный предмет снаряжения для осколка забвения. \n\nОсталось ходов: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Использована неопознанная палочка.
items.trinkets.shardofoblivion.ac_identify=ИДЕНТИФИЦИРОВАТЬ
items.trinkets.shardofoblivion.desc=После томления в алхимическом котле этот маленький осколок проклятого металла превратился в... ничто? Свет, кажется, искривляется вокруг него, и он парит на месте, когда вы его не держите. Осколок, похоже, магическим образом черпает силу из вашего невежества, поэтому, вероятно, лучше не думать о нем слишком много.
items.trinkets.shardofoblivion.identify=Вы определяете предмет!
items.trinkets.shardofoblivion.identify_not_yet=Идентификация этого предмета пока невозможна.
items.trinkets.shardofoblivion.identify_prompt=Определите предмет
items.trinkets.shardofoblivion.identify_ready=Предмет готов к идентификации: %s. Используйте на нём Осколок Забвения, чтобы идентифицировать его.
items.trinkets.shardofoblivion.identify_ready_worn=Теперь все ваши изношенные вещи готовы к идентификации. Используйте Осколок Забвения на предметах, чтобы их идентифицировать.
items.trinkets.shardofoblivion.name=осколок забвения
items.trinkets.shardofoblivion.stats_desc=На текущем уровне этот аксессуар увеличит вероятность выпадения добычи из врагов на 20%% за каждый предмет неопознанного снаряжения, который вы экипировали или недавно использовали, до максимального значения в _%d предметов_. Осколок также не позволит вам идентифицировать снаряжение, но его можно использовать для ручной идентификации предметов, которые готовы к идентификации.
items.trinkets.shardofoblivion.typical_stats_desc=Как правило, этот аксессуар увеличивает вероятность выпадения добычи из врагов на 20%% за каждый предмет неопознанного снаряжения, который вы экипировали или недавно использовали, до максимального значения в _%d предметов_. Осколок также не позволит вам идентифицировать снаряжение, но его можно использовать для ручной идентификации предметов, которые готовы к идентификации.
items.trinkets.thirteenleafclover.desc=Каким-то образом, из-за томления в алхимическом котле, на этом клевере выросло множество лишних листьев! Не совсем ясно, приносит ли эта безделушка удачу или неудачу, возможно, она сделает вашу удачу более непредсказуемой?
items.trinkets.thirteenleafclover.name=тринадцатилистный клевер
items.trinkets.thirteenleafclover.stats_desc=На текущем уровне этот аксессуар позволит вам наносить максимальный урон _%1$d%%_ за раз и минимальный урон _%2$d%%_ за раз.
items.trinkets.thirteenleafclover.typical_stats_desc=Как правило, этот аксессуар позволит вам наносить максимальный урон _%1$d%%_ в определенный момент времени и минимальный урон _%2$d%%_ в определенный момент времени.
items.trinkets.trapmechanism.desc=Основной механизм одной из ловушек-ям в подземелье, аккуратно вырезанный в полу, чтобы его можно было переносить. Кажется, он магически связан с самим подземельем, делая опасные участки более распространенными, но также увеличивая вашу привязанность к ним.
items.trinkets.trapmechanism.name=механизм ловушки
items.trinkets.trapmechanism.stats_desc=На текущем уровне этот аксессуар заставит _%1$d%%_ нетематических этажей заполниться ловушками или пропастями. Кроме того, _%2$d%%_ скрытых ловушек подземелья станут видимыми.
items.trinkets.trapmechanism.typical_stats_desc=Как правило, этот аксессуар заставит _%1$d%%_ нетематических этажей заполниться ловушками или пропастями. Кроме того, _%2$d%%_ скрытых ловушек подземелья станут видимыми.
items.trinkets.trinket$placeholder.name=безделушка
items.trinkets.trinket.discover_hint=Этот предмет может появиться в качестве опции при создании амулета с помощью алхимии.
items.trinkets.trinketcatalyst$randomtrinket.desc=Один из находящихся рядом предметов застрял в мешочке, который вы не можете открыть. Алхимический процесс растворит мешочек, но вы не узнаете, какой именно предмет получите, пока не проведете этот процесс!
items.trinkets.trinketcatalyst$randomtrinket.name=случайная безделушка
items.trinkets.trinketcatalyst.desc=Этот шар волшебной золотой пыли мерцает в темноте подземелья. Этот катализатор можно использовать в алхимическом котле с небольшим количеством алхимической энергии для создания уникального предмета-талисмана. Талисманы обладают различными эффектами, которые немного изменяют подземелье или его обитателей. Талисманы можно улучшать, добавляя больше энергии, чтобы сделать их эффект более мощным, или выбрасывать, чтобы полностью отказаться от эффекта.
items.trinkets.trinketcatalyst.name=магический катализатор
items.trinkets.trinketcatalyst.window_text=Вода начинает светиться, когда вы добавляете катализатор. Рядом находится несколько предметов, которые можно наполнить энергией, чтобы превратить их в волшебную безделушку.
items.trinkets.trinketcatalyst.window_title=создать безделушку
items.trinkets.vialofblood.desc=В этом тонком флаконе находится кровь какого-то обитателя подземелья; он медленно движется при вращении флакона. Похоже, он магическим образом усиливает более сильные лечебные эффекты, но также и замедляет их.
items.trinkets.vialofblood.name=пробирка крови
items.trinkets.vialofblood.stats_desc=На текущем уровне этот аксессуар увеличит общее количество здоровья, получаемого от зелий исцеления, бурдюков с водой или колодцев здоровья, на _%1$s%%_. Однако эффект исцеления будет проявляться медленнее, восстанавливая максимум _%2$s_ HP за ход (это зависит от уровня героя).
items.trinkets.vialofblood.typical_stats_desc=Как правило, этот аксессуар увеличивает общее количество здоровья, получаемого от зелий исцеления, бурдюков с водой или колодцев здоровья, на _%1$s%%_. Однако эффект исцеления будет проявляться медленнее, восстанавливая максимум _%2$s_ HP за ход (это зависит от уровня героя).
items.trinkets.wondrousresin.desc=Эта мерцающая синяя смола, похоже, содержит в себе концентрированную сущность магии проклятой волшебной палочки. Магия из алхимического сосуда, кажется, несколько стабилизировала её, и теперь она воздействует на ваши палочки.
items.trinkets.wondrousresin.name=чудесная смола
items.trinkets.wondrousresin.stats_desc=На текущем уровне этот аксессуар заставит эффекты проклятых жезлов становиться нейтральными или положительными в течение определенного времени, а непроклятые жезлы будут выпускать дополнительный нейтральный или положительный проклятый разряд в течение определенного времени. Для улучшения этого аксессуара требуется больше энергии.
items.trinkets.wondrousresin.typical_stats_desc=Как правило, этот аксессуар заставляет проклятые жезлы становиться нейтральными или положительными в течение определенного времени, а непроклятые жезлы будут выпускать дополнительный нейтральный или положительный проклятый разряд в течение определенного времени. Для улучшения этого аксессуара требуется больше энергии.
items.wands.cursedwand.disguise=Ваша внешность меняется прямо на глазах!
items.wands.cursedwand.fire=Вы чувствуете запах гари...
items.wands.cursedwand.grass=Вокруг вас буйно растет трава!
items.wands.cursedwand.gravity=Гравитация внезапно начинает тянуть в случайных направлениях!
items.wands.cursedwand.gravity_end=Гравитационный хаос прекращается.
items.wands.cursedwand.gravity_positive=Гравитация внезапно начинает притягивать предметы в случайных направлениях, но это, похоже, на вас никак не влияет.
items.wands.cursedwand.mass_invuln=Из вашей волшебной палочки исходит яркий свет!
items.wands.cursedwand.nothing=Ничего не происходит.
items.wands.cursedwand.ondeath=Вас убил ваш собственный %s.
items.wands.cursedwand.petrify=Вы внезапно замираете на месте!
items.wands.cursedwand.sinkhole=Земля начинает проваливаться вокруг вас!
items.wands.cursedwand.sinkhole_positive=Земля начинает прогибаться, но при этом кажется достаточно твердой под ногами.
items.wands.cursedwand.supernova=Взрывной сгусток энергии начинает расти. Возможно, вам захочется бежать!
items.wands.cursedwand.supernova_positive=Начинает расти пылающий шар энергии, но при этом он почему-то чувствует себя в безопасности.
items.wands.cursedwand.transmogrify_other=Ваш предмет превращается во что-то другое!
items.wands.cursedwand.transmogrify_wand=Ваша волшебная палочка превращается в другой предмет!
items.wands.damagewand.upgrade_stat_name_1=Магический урон
items.wands.wand$placeholder.name=палочка
items.wands.wand.ac_zap=ЗАП
items.wands.wand.curse_discover=Этот %s проклят!
items.wands.wand.cursed=Эта волшебная палочка проклята, из-за чего её магия хаотична и непредсказуема.
items.wands.wand.fizzles=Ваша волшебная палочка шипит; видимо, ей не хватает заряда.
items.wands.wand.identify=Теперь вы достаточно хорошо знакомы со своей волшебной палочкой, чтобы её узнать.
items.wands.wand.no_magic=Ваша волшебная палочка затухает; вы не можете использовать волшебные палочки, пока невосприимчивы к магии.
items.wands.wand.not_cursed=Эта волшебная палочка свободна от злой магии.
items.wands.wand.prompt=Выберите место для применения молнии.
items.wands.wand.resin_many=Эта волшебная палочка приобрела уровни _%d_ благодаря магической смоле.
items.wands.wand.resin_one=Эта волшебная палочка получила _1 уровень_ благодаря магической смоле.
items.wands.wand.self_target=Вы не можете нацелиться на себя!
items.wands.wandofblastwave.bmage_desc=Когда _Боевой Маг_ поражает парализованного врага посохом взрывной волны, он расходует паралич, нанося дополнительный магический урон. Для каждого врага действует короткое время восстановления.
items.wands.wandofblastwave.desc=Эта волшебная палочка сделана из мраморного камня, отделана золотом и украшена круглым черным камнем на кончике. Она очень увесистая в руке.
items.wands.wandofblastwave.eleblast_desc=Стихийный взрыв с помощью посоха взрывной волны наносит 67% урона и отбрасывает всех врагов за пределы зоны поражения.
items.wands.wandofblastwave.knockback_ondeath=В результате столкновения вы погибли...
items.wands.wandofblastwave.name=жезл ударной волны
items.wands.wandofblastwave.ondeath=Ты покончил с собой, используя свой собственный Жезл Взрывной Волны...
items.wands.wandofblastwave.staff_name=посох ударной волны
items.wands.wandofblastwave.stats_desc=Эта волшебная палочка выпускает разряд, который с силой взрывается в указанном месте. Сила этого взрыва наносит _%1$d-%2$d урона_ и достаточно велика, чтобы отбросить большинство врагов.
items.wands.wandofblastwave.typical_stats_desc=Эта волшебная палочка выпускает разряд, который с силой взрывается в указанном месте. Сила этого взрыва обычно наносит _%1$d-%2$d урона_ и достаточно велика, чтобы отбросить большинство врагов.
items.wands.wandofblastwave.upgrade_stat_name_2=Отбрасывание
items.wands.wandofcorrosion.bmage_desc=Когда _Боевой Маг_ наносит удар врагу посохом коррозии, у врага появляется шанс превратиться в сгусток скверны.
items.wands.wandofcorrosion.desc=Эта волшебная палочка имеет пепельный корпус, который раскрывается, обнажая сверкающий оранжевый камень.
items.wands.wandofcorrosion.eleblast_desc=Стихийный взрыв с помощью посоха коррозии наносит врагам 4 хода коррозии, начиная с 6 единиц урона.
items.wands.wandofcorrosion.name=палочка коррозии
items.wands.wandofcorrosion.staff_name=персонал коррозии
items.wands.wandofcorrosion.stats_desc=Эта волшебная палочка выпускает разряд, который взрывается, образуя облако высококоррозионного газа в указанном месте. Все, что окажется внутри этого облака, будет получать всё больший урон с течением времени, начиная с _%d урона._
items.wands.wandofcorrosion.upgrade_stat_name_1=Коррозионное повреждение
items.wands.wandofcorrosion.upgrade_stat_name_2=Объем газа
items.wands.wandofcorruption.already_corrupted=На этот характер больше нельзя повлиять.
items.wands.wandofcorruption.bmage_desc=Когда _Боевой Маг_ наносит удар врагу посохом скверны, у врага появляется шанс прийти в ярость.
items.wands.wandofcorruption.desc=Эта волшебная палочка излучает хаотическую темную энергию, если это еще не очевидно из небольшого декоративного черепа, выточенного на ее кончике.
items.wands.wandofcorruption.eleblast_desc=Стихийный взрыв с помощью посоха порчи наносит врагам 5 ходов ярости.
items.wands.wandofcorruption.name=жезл коррупции
items.wands.wandofcorruption.staff_name=коррупционные структуры
items.wands.wandofcorruption.stats_desc=Эта волшебная палочка высвободит поток развращающей энергии, которая ослабит врагов и в конечном итоге подчинит их вашей воле. Враги способны сопротивляться развращению, но ослабленных врагов развратить гораздо легче, чем здоровых.
items.wands.wandofcorruption.upgrade_stat_name_1=Развращающая власть
items.wands.wandofcorruption.upgrade_stat_name_2=Длительность дебаффа
items.wands.wandofdisintegration.bmage_desc=Когда посох распада находится в руках _Боевого Мага_, он обладает увеличенной дальностью атаки, как если бы на нём было наложено зачарование, позволяющее ему проецировать свет.
items.wands.wandofdisintegration.desc=Эта волшебная палочка сделана из цельного гладкого куска обсидиана, по её боковой стороне, заканчивающейся на кончике, проходит глубокий фиолетовый свет. Она светится разрушительной энергией, готовой вырваться вперёд.
items.wands.wandofdisintegration.eleblast_desc=Стихийный взрыв с помощью посоха распада наносит 100% урона и пробивает стены.
items.wands.wandofdisintegration.name=палочка распада
items.wands.wandofdisintegration.staff_name=посох распада
items.wands.wandofdisintegration.stats_desc=Эта волшебная палочка выпускает луч, пробивающий любые препятствия, и его дальность увеличивается с улучшением. Луч наносит _%1$d-%2$d урона_, а также наносит дополнительный урон за каждого врага и стену, которые он пробивает.
items.wands.wandofdisintegration.upgrade_stat_name_2=Максимальная дальность
items.wands.wandoffireblast.bmage_desc=Когда _Боевой Маг_ наносит удар врагу посохом огненного взрыва, существует вероятность того, что это вызовет взрыв, который нанесет урон врагам и поглотит весь находящийся рядом огонь! Эта вероятность увеличивается по мере того, как рядом с врагом находится больше огня.
items.wands.wandoffireblast.desc=Эта волшебная палочка изготовлена из дерева, покрытого красным лаком, с обильным использованием золотой фольги, что придает ей поистине величественный вид. Наконечник палочки потрескивает и шипит, готовая высвободить свою могущественную магию.
items.wands.wandoffireblast.eleblast_desc=Стихийный взрыв, нанесенный посохом огненного взрыва, наносит 100% урона, выбивает двери и поджигает врагов и местность.
items.wands.wandoffireblast.name=жезл огненного взрыва
items.wands.wandoffireblast.staff_name=посох огненного взрыва
items.wands.wandoffireblast.stats_desc=Эта волшебная палочка при использовании выпускает огненный конус. Следующая атака израсходует _%1$d зарядов_ и нанесет _%2$d-%3$d урона_. Чем больше зарядов использует палочка, тем сильнее и мощнее эффект.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Урон от заряда
items.wands.wandoffireblast.upgrade_stat_name_2=2 Урон от заряда
items.wands.wandoffireblast.upgrade_stat_name_3=3 Урон от заряда
items.wands.wandoffrost.bmage_desc=Когда _Боевой Маг_ наносит удар по замерзшему врагу посохом мороза, у того есть шанс мгновенно заморозиться. Этот шанс возрастает по мере того, как сильно враг замерзает.
items.wands.wandoffrost.desc=Эта волшебная палочка, кажется, сделана из какого-то магического льда. Она становится ярче к своему закругленному кончику. На ощупь она очень холодная, но рука почему-то остается теплой.
items.wands.wandoffrost.eleblast_desc=Стихийный взрыв с помощью ледяного посоха наносит 100% урона, замораживает врагов и гасит огонь.
items.wands.wandoffrost.name=палочка мороза
items.wands.wandoffrost.staff_name=посох мороза
items.wands.wandoffrost.stats_desc=Эта волшебная палочка выпускает в ваших врагов потоки ледяной энергии, нанося урон и вызывая эффект заморозки. Эффект, по-видимому, сильнее в воде. Враги, уже замороженные или обмороженные, получают меньше урона от этой палочки.
items.wands.wandoffrost.upgrade_stat_name_2=Продолжительность охлаждения
items.wands.wandoflightning$lightningcharge.desc=Боевой маг в данный момент заряжен энергией, что даёт ему иммунитет к молнии от его посоха и увеличивает дальность действия молнии. \n\nОсталось ходов: %s.
items.wands.wandoflightning$lightningcharge.name=Электрически заряженный
items.wands.wandoflightning.bmage_desc=Когда Боевой Маг поражает врага посохом молнии, у него есть шанс зарядиться электрическим током на 10 ходов. В заряженном состоянии Боевой Маг невосприимчив к урону от молнии и будет распространять разряды молнии на большее расстояние.
items.wands.wandoflightning.desc=Эта волшебная палочка сделана из цельного металла, поэтому она на удивление тяжелая. Два зубца изогнуты вместе на кончике, и между ними возникает электрическая дуга.
items.wands.wandoflightning.eleblast_desc=Стихийный взрыв с помощью посоха молнии наносит 100% урона, оглушает врагов на 5 ходов и электризует воду.
items.wands.wandoflightning.name=жезл молнии
items.wands.wandoflightning.ondeath=Ты покончил с собой, используя свой собственный Жезл Молнии...
items.wands.wandoflightning.staff_name=посох молнии
items.wands.wandoflightning.stats_desc=Эта волшебная палочка испускает мощные молнии, пронизывающие всё, во что она направлена, нанося урон в размере _%1$d-%2$d. Эти электрические разряды будут передаваться ближайшим персонажам и легче распространяются в воде. Электрические разряды от этой палочки могут нанести урон вам, но не причинят вреда вашим союзникам.
items.wands.wandoflivingearth$earthguardian.desc=Камни из вашей волшебной палочки живой земли превратились в защитного земляного стража! Этот каменный защитник будет атаковать ближайших врагов, заставляя их атаковать стража, а не вас. Когда все ближайшие угрозы будут устранены, страж снова сформируется вокруг вас и вернется, когда вы в следующий раз используете свою волшебную палочку.
items.wands.wandoflivingearth$earthguardian.discover_hint=Этого персонажа можно найти с помощью определённой волшебной палочки.
items.wands.wandoflivingearth$earthguardian.name=земляной страж
items.wands.wandoflivingearth$earthguardian.wand_info=Защитная способность стража зависит от уровня вашей волшебной палочки. В настоящее время она блокирует урон в диапазоне _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Ваше тело окружено магическими камнями. При атаке они будут пытаться блокировать удары, уменьшая получаемый урон на 50. Однако каждый заблокированный удар отбрасывает часть камней. Если вокруг вас будет достаточно камней, следующий разряд вашей палочки живой земли заставит камни сформироваться в стража, который будет сражаться вместе с вами.
items.wands.wandoflivingearth$rockarmor.desc_many=Этот земляной страж также получает выгоду от Силы Множества. Осталось ходов: %d.
items.wands.wandoflivingearth$rockarmor.name=каменная броня
items.wands.wandoflivingearth.bmage_desc=Когда _Боевой Маг_ наносит удар врагу посохом из живой земли, часть нанесенного урона возвращается в виде каменной брони.
items.wands.wandoflivingearth.desc=Эта волшебная палочка сделана из необычного камня с полосами светящейся жёлтой энергии. Камни слегка смещаются, когда вы держите палочку, словно ощущая вашу руку.
items.wands.wandoflivingearth.eleblast_desc=Стихийный взрыв с помощью посоха живой земли наносит 50% урона и исцеляет активного земляного стража за каждого пораженного врага.
items.wands.wandoflivingearth.name=жезл живой земли
items.wands.wandoflivingearth.staff_name=посох живой земли
items.wands.wandoflivingearth.stats_desc=Эта волшебная палочка выпускает в врагов сгустки магического камня, наносящие урон в размере _%1$d-%2$d. Затем камни формируются вокруг пользователя, наделяя его броней пропорционально нанесенному урону. Если накопится достаточно брони, при следующем использовании палочки она превратится в каменного стража.
items.wands.wandoflivingearth.upgrade_stat_name_2=Страж Макс. HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Блокировка Guardian
items.wands.wandofmagicmissile$magiccharge.desc=Ваша волшебная палочка, способная метать магические снаряды, восстановила энергию, повысив эффективный уровень следующего разряда, который они создадут. \n\nУровень ваших палочек увеличен до: +%d.\n\nОсталось магического заряда: %s.
items.wands.wandofmagicmissile$magiccharge.name=магический заряд
items.wands.wandofmagicmissile.bmage_desc=Когда _Боевой Маг_ поражает врага посохом или магической стрелой, все его жезлы, помимо посоха, получают заряд.
items.wands.wandofmagicmissile.desc=Эта довольно простая волшебная палочка запускает снаряды из чистой магической энергии. Хотя сама палочка не обладает никакими особыми эффектами, у неё больше доступных зарядов, и при улучшении она может ненадолго активировать другие палочки.
items.wands.wandofmagicmissile.discover_hint=Один из героев начинает игру с этим предметом.
items.wands.wandofmagicmissile.eleblast_desc=Стихийный взрыв с помощью посоха магической стрелы наносит 50% урона и дает магу 15 ходов на перезарядку.
items.wands.wandofmagicmissile.name=волшебная палочка волшебной ракеты
items.wands.wandofmagicmissile.staff_name=посох магической стрелы
items.wands.wandofmagicmissile.stats_desc=Каждый разряд этой палочки наносит _%1$d-%2$d урона_ и при улучшении ненадолго активирует другие палочки.
items.wands.wandofprismaticlight.bmage_desc=Когда _Боевой Маг_ поражает врага посохом призматического света, тот получает эффект замедления на время, зависящее от уровня посоха.
items.wands.wandofprismaticlight.desc=Эта волшебная палочка сделана из цельного куска полупрозрачного хрусталя, похожего на длинный кусок гладкого стекла. Вокруг кончика палочки танцуют маленькие искорки разноцветного света, готовые вырваться наружу.
items.wands.wandofprismaticlight.eleblast_desc=Стихийный взрыв с помощью посоха призматического света наносит 67% урона, открывает все участки местности в зоне поражения и ослепляет врагов на 5 ходов.
items.wands.wandofprismaticlight.name=жезл призматического света
items.wands.wandofprismaticlight.staff_name=посох призматического света
items.wands.wandofprismaticlight.stats_desc=Эта волшебная палочка испускает лучи света, которые прорезают тьму подземелья, открывая скрытые области и ловушки. Луч может ослеплять врагов и наносит _%1$d-%2$d урона. Демонические и немертвые враги будут гореть в ярком свете палочки, получая дополнительный урон.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Слепой шанс
items.wands.wandofprismaticlight.upgrade_stat_name_3=Продолжительность светового дня
items.wands.wandofregrowth$dewcatcher.desc=Растения-ловцы росы — это удивительные создания, которые наполняются волшебной росой. Они пытаются замаскироваться под траву, чтобы избежать внимания, но скопления росы выдают их с потрохами.
items.wands.wandofregrowth$dewcatcher.discover_hint=Это растение можно найти с помощью специальной палочки.
items.wands.wandofregrowth$dewcatcher.name=Ловец росы
items.wands.wandofregrowth$lotus.desc=Золотой лотос — мистическое растение, которое можно призвать только с помощью мощного жезла возрождения. Его аура усиливает все растения и их эффекты, но он быстро расходует свою энергию и погибает.
items.wands.wandofregrowth$lotus.discover_hint=Это растение можно найти с помощью определённой волшебной палочки, после нескольких её улучшений.
items.wands.wandofregrowth$lotus.name=Золотой Лотос
items.wands.wandofregrowth$lotus.wand_info=Этот лотос был создан с помощью жезла возрождения. Все растения, находящиеся под его действием, мгновенно активируются, если их посадить на персонажа. Растения также будут иметь шанс выпадения семян, а дротики с наконечниками будут расходовать на прочность меньше.
items.wands.wandofregrowth$seedpod.desc=Стручки с семенами — это волшебные растения, которые производят семена из других растений, а не из собственных. Каким-то образом им удаётся распространяться, несмотря на отсутствие собственных семян.
items.wands.wandofregrowth$seedpod.discover_hint=Это растение можно найти с помощью специальной палочки.
items.wands.wandofregrowth$seedpod.name=Стручок семени
items.wands.wandofregrowth.bmage_desc=Когда _Боевой Маг_ поражает врага посохом возрождения, и оба находятся на траве, он получает исцеление травами пропорционально нанесенному урону.
items.wands.wandofregrowth.degradation=После очередной зарядки (_%d) эта волшебная палочка перестанет производить растения и свежую траву. Этот лимит увеличивается при повышении уровня или улучшении палочки.
items.wands.wandofregrowth.desc=Эта волшебная палочка сделана из тонкого стержня, искусно вырезанного из дерева. Каким-то образом она всё ещё жива и полна жизни, ярко-зелёная, как сердцевина молодого дерева. «Когда жизнь заканчивается, всегда начинается новая жизнь... Вечный цикл всегда продолжается!»
items.wands.wandofregrowth.eleblast_desc=Стихийный взрыв с посохом возрождения приковывает врагов к земле и случайным образом высаживает траву в зоне поражения.
items.wands.wandofregrowth.name=жезл возрождения
items.wands.wandofregrowth.staff_name=персонал возрождения
items.wands.wandofregrowth.stats_desc=При использовании эта палочка выпускает магическую энергию возрождения в виде конуса, заставляя траву, корни и редкие растения оживать. Следующий разряд потребляет _%1$d зарядов_. Чем больше зарядов использует палочка, тем сильнее и мощнее эффект.
items.wands.wandofregrowth.upgrade_stat_name_1=Трава за зарядку
items.wands.wandofregrowth.upgrade_stat_name_2=Общий лимит травы
items.wands.wandoftransfusion.bmage_desc=Когда _Боевой Маг_ поражает зачарованного врага посохом переливания крови, он получает щит, и его следующий удар посохом не отнимает здоровье.
items.wands.wandoftransfusion.charged=Ваши сотрудники заряжены жизненной энергией вашего врага!
items.wands.wandoftransfusion.desc=Эта довольно простая по форме волшебная палочка выделяется своим пурпурным оттенком и угольно-черным камнем на кончике.
items.wands.wandoftransfusion.eleblast_desc=Стихийный взрыв с помощью посоха переливания крови очаровывает врагов, исцеляет союзников и наносит 100% урона врагам-нежити.
items.wands.wandoftransfusion.name=палочка для переливания крови
items.wands.wandoftransfusion.ondeath=Ты покончил с собой, используя собственную палочку переливания крови...
items.wands.wandoftransfusion.staff_name=персонал по переливанию крови
items.wands.wandoftransfusion.stats_desc=При использовании на союзниках или очарованных врагах этот жезл отнимает _%1$d здоровья пользователя_, чтобы исцелить или защитить союзника на _%2$d здоровья_. При использовании на врагах жезл ненадолго очаровывает их, одновременно накладывая _%3$d защиту_ на пользователя. Враждебные немертвые получают _%4$d-%5$d урона_ вместо того, чтобы быть очарованными.
items.wands.wandoftransfusion.upgrade_stat_name_1=Исцеление союзников
items.wands.wandoftransfusion.upgrade_stat_name_2=Самоэкранирование
items.wands.wandoftransfusion.upgrade_stat_name_3=Урон от нежити
items.wands.wandofwarding$ward.desc_1=Этот базовый защитный барьер автоматически поразит любого врага, попавшего в зону его видимости, нанося _%1$d-%2$d урона._\n\n Поражение этого барьера вашей защитной палочкой улучшит его._\n\nЭтот барьер поразит врага только один раз, после чего рассеется._\n\nВаша защитная палочка использует _%3$d энергии_ для поддержания этого барьера.
items.wands.wandofwarding$ward.desc_2=Этот улучшенный защитный барьер имеет более сложную схему атаки и может атаковать несколько раз. Каждый разряд этого барьера нанесет _%1$d-%2$d урона._\n\nУдар по этому барьеру вашей защитной палочкой улучшит его._\n\nЭтот барьер разрядится три раза, прежде чем рассеется._\n\nВаша защитная палочка использует _%3$d энергии_ для поддержания этого барьера.
items.wands.wandofwarding$ward.desc_3=Этот полностью улучшенный защитный барьер способен атаковать больше раз, чем его предшественники. Каждый разряд этого барьера нанесет _%1$d-%2$d урона._\n\n Разряд этого барьера вашей защитной палочкой улучшит его._\n\nЭтот барьер разрядится пять раз, прежде чем рассеется._\n\nВаша защитная палочка использует _%3$d энергии_ для поддержания этого барьера.
items.wands.wandofwarding$ward.desc_4=Этот меньший по размеру страж обладает той же огневой мощью, что и больший, но вместо фиксированного количества зарядов имеет запас здоровья. Он напоминает драгоценный камень на кончике вашей защитной палочки. Каждый разряд этого стража наносит _%1$d-%2$d урона._\n\nУдар по этому стражу вашей защитной палочкой улучшит и восстановит его здоровье._\n\nЭтот страж будет тратить часть здоровья каждый раз, когда поражает врага, но его можно восстановить, используя на нем вашу защитную палочку._\n\nВаша защитная палочка использует _%3$d энергии_ для поддержания этого стража.
items.wands.wandofwarding$ward.desc_5=Этот улучшенный страж больше и прочнее, чем обычный. Каждый разряд этого стража наносит _%1$d-%2$d урона._\n\nУдар по этому стражу с помощью вашей защитной палочки улучшит и восстановит его здоровье._\n\nЭтот страж будет тратить часть здоровья каждый раз, когда поражает врага, но его можно восстановить, используя на нем вашу защитную палочку._\n\nВаша защитная палочка использует _%3$d энергию_ для поддержания работы этого стража.
items.wands.wandofwarding$ward.desc_6=Этот полностью модернизированный сторожевой робот значительно прочнее своих предшественников. Каждый разряд этого робота наносит _%1$d-%2$d урона._\n\nУдар по этому роботу с помощью вашей защитной палочки исцелит его._\n\nЭтот робот будет тратить часть здоровья каждый раз, когда поражает врага, но его можно исцелить, используя на нем вашу защитную палочку._\n\nВаша защитная палочка использует _%3$d энергии_ для поддержания работы этого робота.
items.wands.wandofwarding$ward.desc_generic_sentry=Этот страж обладает той же огневой мощью, что и защитный щит, но вместо фиксированного количества зарядов имеет здоровье. Он напоминает драгоценный камень на кончике вашей защитной палочки. \n\nУдар по этому стражу вашей защитной палочкой улучшит и восстановит его здоровье. \n\nЭтот страж будет тратить некоторое количество здоровья каждый раз, когда поражает врага, но его можно восстановить, используя на нем вашу защитную палочку.
items.wands.wandofwarding$ward.desc_generic_ward=Этот вард автоматически поразит электрическим разрядом любого врага, попавшего в зону его видимости. \n\n Поражение этого варда вашей волшебной палочкой улучшит его. \n\n У вардов ограниченное количество разрядов, после чего они рассеиваются.
items.wands.wandofwarding$ward.discover_hint=Этого персонажа можно найти с помощью определённой волшебной палочки.
items.wands.wandofwarding$ward.dismiss_body=Вы можете снять этот защитный эффект, если больше не хотите, чтобы ваша волшебная палочка его поддерживала. Это действие немедленно уничтожит защитный эффект.
items.wands.wandofwarding$ward.dismiss_cancel=нет
items.wands.wandofwarding$ward.dismiss_confirm=да
items.wands.wandofwarding$ward.dismiss_title=Отпустить это отделение?
items.wands.wandofwarding$ward.name_1=меньший палата
items.wands.wandofwarding$ward.name_2=сторожить
items.wands.wandofwarding$ward.name_3=больший район
items.wands.wandofwarding$ward.name_4=малый часовой
items.wands.wandofwarding$ward.name_5=часовой
items.wands.wandofwarding$ward.name_6=больший часовой
items.wands.wandofwarding.bad_location=Там нельзя разместить палату.
items.wands.wandofwarding.bmage_desc=Когда _Боевой Маг_ наносит удар врагу посохом защиты, все активные защитные заклинания и стражи получают шанс быть исцеленными.
items.wands.wandofwarding.desc=Эта короткая металлическая волшебная палочка украшена ярко-фиолетовым камнем, парящим над её кончиком.
items.wands.wandofwarding.eleblast_desc=Стихийный взрыв с помощью посоха защиты исцеляет все защитные чары и стражи в зоне поражения.
items.wands.wandofwarding.name=жезл защиты
items.wands.wandofwarding.no_more_wards=Ваша волшебная палочка больше не может поддерживать никакие защитные заклинания.
items.wands.wandofwarding.staff_name=персонал палаты
items.wands.wandofwarding.stats_desc=Вместо прямого нанесения урона врагу, эта палочка призывает стационарные варды и стражи. Варды можно призвать где угодно, даже сквозь стены, если у вас есть обзор. Эта палочка может поддерживать количество вардов, равное _%d энергии_, одновременно.
items.wands.wandofwarding.upgrade_stat_name_1=Урон по варду
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=НАПИТОК
items.waterskin.collected=Вы собираете каплю росы в свою флягу для воды.
items.waterskin.desc=Емкость для жидкости, изготовленная из кожи и веревки, герметично закрывающаяся пробкой.
items.waterskin.desc_full=Кажется, что полный бурдюк излучает энергию, возможно, его можно использовать для освящения другого предмета для выживания?
items.waterskin.desc_heal=В настоящее время бурдюк используется для хранения целебной воды. Чем полнее бурдюк, тем больше мгновенного исцеления вы получите, выпив из него. Вы будете пить только столько, сколько вам нужно.
items.waterskin.desc_water=Сейчас в бурдюке находится просто питьевая вода. Наверняка в подземелье найдется что-нибудь, что можно было бы в нём хранить.
items.waterskin.discover_hint=Один из героев начинает игру с этим предметом.
items.waterskin.empty=Ваш бурдюк с водой пуст!
items.waterskin.full=Ваш бурдюк полон!
items.waterskin.name=бурдюк
items.weapon.curses.annoying.desc=Раздражающее оружие способно говорить, но оно слишком энергично. Зачастую оно будет привлекать к вам внимание, даже если вы этого не хотите.
items.weapon.curses.annoying.elestrike_desc=Удар стихии, накладывающий раздражающее проклятие, имеет 20% шанс активировать каждого врага в радиусе действия на 6 ходов.
items.weapon.curses.annoying.msg_1=Ой, мы с чем-то боремся?!
items.weapon.curses.annoying.msg_10=Отлично получилось!
items.weapon.curses.annoying.msg_11=Я не хотел быть оружием, я хотел быть топором лесоруба.
items.weapon.curses.annoying.msg_12=Помните, чрезмерная самоуверенность — это медленный и коварный убийца.
items.weapon.curses.annoying.msg_13=Вся ваша база принадлежит нам!
items.weapon.curses.annoying.msg_2=Да, хватайте их!
items.weapon.curses.annoying.msg_3=ЭЙ, ПОСЛУШАЙ!
items.weapon.curses.annoying.msg_4=Мы уже добрались до босса?!
items.weapon.curses.annoying.msg_5=Ой, не бейте меня так сильно!
items.weapon.curses.annoying.msg_6=Сдохни, насекомое!
items.weapon.curses.annoying.msg_7=УУ ...
items.weapon.curses.annoying.msg_8=Можно нам сделать перерыв?!
items.weapon.curses.annoying.msg_9=БАМ, ХАХА!
items.weapon.curses.annoying.name=раздражающий %s
items.weapon.curses.dazzling.desc=Ослепительное оружие порой сверкает ослепительным светом, слепя все, что его видит.
items.weapon.curses.dazzling.elestrike_desc=Удар стихии, накладывающий ослепляющее проклятие, имеет 50% шанс ослепить каждого врага в радиусе действия на 6 ходов.
items.weapon.curses.dazzling.name=ослепительный %s
items.weapon.curses.displacing.desc=Перемещающееся оружие пропитано хаотической магией телепортации и обладает способностью случайным образом перемещать врагов по полу.
items.weapon.curses.displacing.elestrike_desc=Удар стихийным оружием, накладывающим смещающее проклятие, имеет 50% шанс телепортировать каждого врага в пределах досягаемости.
items.weapon.curses.displacing.name=перемещение %s
items.weapon.curses.explosive.desc=Взрывчатое оружие постепенно набирает мощность и взрывается, повреждая все, что находится поблизости.
items.weapon.curses.explosive.desc_cool=Ваше оружие в данный момент прохладное на ощупь.
items.weapon.curses.explosive.desc_hot=Ваше оружие раскалено! Оно вот-вот взорвётся!
items.weapon.curses.explosive.desc_warm=Ваше оружие накапливает энергию и нагревается...
items.weapon.curses.explosive.elestrike_desc=Удар стихийным оружием, накладывающим взрывное проклятие, имеет 50% шанс вызвать взрыв у случайного врага в пределах досягаемости.
items.weapon.curses.explosive.hot=Горячий!
items.weapon.curses.explosive.name=взрывной %s
items.weapon.curses.explosive.warm=Теплый...
items.weapon.curses.friendly.desc=Дружественное оружие лучше всего подходит для пацифистов, так как иногда оно активирует магию, делающую бой невозможным.
items.weapon.curses.friendly.elestrike_desc=Удар стихии, накладывающий дружественное проклятие, имеет 50% шанс очаровать каждого врага в радиусе действия на 6 ходов.
items.weapon.curses.friendly.name=дружелюбный %s
items.weapon.curses.polarized.desc=Поляризованное оружие подвержено воздействию магии, в результате чего урон от его атаки увеличивается на 50%, либо не увеличивается вовсе.
items.weapon.curses.polarized.elestrike_desc=Удар стихии с поляризованным проклятием имеет 50% шанс нанести 24-36 урона каждому врагу в радиусе действия.
items.weapon.curses.polarized.name=поляризованный %s
items.weapon.curses.sacrificial.desc=Жертвенное оружие потребует от владельца крови в обмен на нападение на врагов. Чем здоровее владелец, тем больше крови потребует проклятие.
items.weapon.curses.sacrificial.elestrike_desc=Удар стихии с жертвенным проклятием наносит герою и каждому врагу в радиусе действия кровотечение на 12 единиц здоровья.
items.weapon.curses.sacrificial.name=жертвенный %s
items.weapon.curses.wayward$waywardbuff.desc=Магия вашего беспорядочного оружия активировалась, что на короткое время делает его крайне неточным. Обратите внимание, что это не влияет на атаки, которые гарантированно попадают в цель, такие как внезапные атаки. Успешная атака беспорядочным оружием немедленно снимает этот эффект. \n\nОсталось ходов: %s.
items.weapon.curses.wayward$waywardbuff.name=своенравный
items.weapon.curses.wayward.desc=Иногда неточное оружие становится крайне неточным. Это магическое действие длится недолго после активации, но его можно развеять, нанеся удар неточностям.
items.weapon.curses.wayward.elestrike_desc=Удар стихии, накладывающий проклятие, имеет 50% шанс наложить проклятие на каждого врага в радиусе действия на 6 ходов.
items.weapon.curses.wayward.name=своенравный %s
items.weapon.enchantments.blazing.desc=Это заклинание заставляет оружие извергать пламя, поджигая врагов и нанося дополнительный урон уже объятым пламенем противникам.
items.weapon.enchantments.blazing.elestrike_desc=Удар стихии с пылающим зачарованием распространяет огонь на все клетки в радиусе действия, и эффект длится 8 ходов.
items.weapon.enchantments.blazing.name=пылающий %s
items.weapon.enchantments.blocking$blockbuff.desc=Зачарование вашего оружия, блокирующее удары, на короткое время повысило вашу защитную силу! \n\nОсталось щитов: %d\n\nОсталось ходов: %s.
items.weapon.enchantments.blocking$blockbuff.name=блокирование
items.weapon.enchantments.blocking.desc=При использовании блокирующего оружия есть шанс ненадолго защитить вас после атаки.
items.weapon.enchantments.blocking.elestrike_desc=Удар стихии с блокирующим зачарованием даёт дуэлянту дополнительные 6 единиц щита за каждого врага в радиусе действия.
items.weapon.enchantments.blocking.name=блокировка %s
items.weapon.enchantments.blooming.desc=Цветущее оружие содержит магию, которая заставляет растительность прорастать на тех, кто был поражен им, или вокруг них.
items.weapon.enchantments.blooming.elestrike_desc=Удар стихии с эффектом цветения распространяет траву на расстояние до 8 клеток и обездвиживает всех врагов в радиусе действия на 6 ходов.
items.weapon.enchantments.blooming.name=цветущий %s
items.weapon.enchantments.chilling.desc=Враги, пораженные этим заклинанием, охлаждаются, что замедляет их передвижение и атаки.
items.weapon.enchantments.chilling.elestrike_desc=Удар стихии с леденящим зачарованием распространяет ледяной воздух на все клетки в радиусе действия, эффект длится 8 ходов.
items.weapon.enchantments.chilling.name=охлаждающий %s
items.weapon.enchantments.corrupting.desc=Это мощное заклинание обладает способностью подчинять врагов своей воле. При убийстве врага этим оружием существует вероятность, что он не умрёт, а подвергнется порче.
items.weapon.enchantments.corrupting.elestrike_desc=Удар стихии с зачарованием, вызывающим порчу, имеет 5-25% шанс (в зависимости от недостающего здоровья) поразить каждого врага в радиусе действия, кроме основной цели.
items.weapon.enchantments.corrupting.name=искажение %s
items.weapon.enchantments.elastic.desc=Эластичное оружие имеет шанс отбросить врагов на небольшое расстояние.
items.weapon.enchantments.elastic.elestrike_desc=Стихийный удар с эластичным зачарованием отбрасывает всех врагов в радиусе действия на 5 клеток назад.
items.weapon.enchantments.elastic.name=эластичный %s
items.weapon.enchantments.grim.desc=Это мощное заклинание способно мгновенно убить врага. Чем слабее враг, тем выше вероятность того, что эффект произойдёт.
items.weapon.enchantments.grim.elestrike_desc=Удар стихии с мрачным зачарованием имеет 6-30% шанс (в зависимости от недостающего здоровья) убить каждого врага в радиусе действия, кроме основной цели.
items.weapon.enchantments.grim.name=мрачный %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Ваше оружие накопило избыточную силу от предыдущего смертельного удара и применит её в качестве бонусного урона к вашей следующей атаке. Однако со временем эта энергия будет постепенно угасать. \n\nНакопленный урон: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=сохраненный ущерб
items.weapon.enchantments.kinetic.desc=Когда противник уничтожен кинетическим оружием, избыточная сила накапливается в оружии и будет использована при следующей успешной атаке.
items.weapon.enchantments.kinetic.elestrike_desc=Удар стихийным уроном с кинетическим зачарованием наносит 40% накопленного урона каждому врагу в радиусе действия, за исключением основной цели.
items.weapon.enchantments.kinetic.name=кинетический %s
items.weapon.enchantments.lucky.desc=У врагов, убитых удачным оружием, есть шанс выпадения дополнительной добычи.
items.weapon.enchantments.lucky.elestrike_desc=Удар стихии с зачарованием «Удача» имеет 12,5%-ный шанс появления добычи под каждым врагом в радиусе действия. Этот эффект может сработать только один раз для каждого врага.
items.weapon.enchantments.lucky.name=счастливый %s
items.weapon.enchantments.projecting.desc=Благодаря этому зачарованию оружие ближнего боя получит дополнительную дальность действия. Оружие дальнего боя будет пробивать стены при наведении на ближайшие цели.
items.weapon.enchantments.projecting.elestrike_desc=Удар стихии с направленным зачарованием наносит 30% урона каждому врагу в радиусе действия, кроме основной цели.
items.weapon.enchantments.projecting.name=проецирование %s
items.weapon.enchantments.shocking.desc=Из электрического разряда вырываются электрические дуги, наносящие дополнительный урон всем находящимся поблизости врагам.
items.weapon.enchantments.shocking.elestrike_desc=Удар стихии с шокирующим зачарованием распространяет электричество по всем клеткам в радиусе действия, эффект длится 8 ходов.
items.weapon.enchantments.shocking.name=шокирующий %s
items.weapon.enchantments.unstable.desc=Это заклинание излучает хаотическую энергию, и при каждом попадании действует как новое заклинание.
items.weapon.enchantments.unstable.elestrike_desc=Удар стихии с нестабильным зачарованием накладывает случайный эффект зачарования на каждого врага в радиусе действия, кроме основной цели.
items.weapon.enchantments.unstable.name=нестабильный %s
items.weapon.enchantments.vampiric.desc=Это мощное заклинание высасывает жизненную силу из врагов с каждым ударом, направляя её обратно в владельца. Эффект тем сильнее, чем ниже уровень здоровья владельца.
items.weapon.enchantments.vampiric.elestrike_desc=Удар стихии с вампирским зачарованием восстанавливает Дуэлисту 2,5 HP за каждого врага в радиусе действия.
items.weapon.enchantments.vampiric.name=вампирский %s
items.weapon.melee.assassinsblade.ability_desc=Дуэлистка может _скрытно_ передвигаться, держа в руках клинок убийцы. Эта способность позволяет Дуэлистке мгновенно телепортироваться на расстояние до 3 клеток и даёт ей _%d ходов невидимости._
items.weapon.melee.assassinsblade.ability_name=крадущийся
items.weapon.melee.assassinsblade.desc=Небольшой волнистый клинок из обсидиана, сложный в использовании, несмотря на свою легкость, но смертельно опасный, если попадет в цель.
items.weapon.melee.assassinsblade.name=клинок убийцы
items.weapon.melee.assassinsblade.stats_desc=Это оружие эффективнее против ничего не подозревающих врагов.
items.weapon.melee.assassinsblade.typical_ability_desc=Дуэлистка может _скрытно_ передвигаться, держа в руках клинок убийцы. Эта способность позволяет Дуэлистке мгновенно телепортироваться на расстояние до 3 клеток и обычно даёт ей _%d ходов невидимости._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Длительность действия способности
items.weapon.melee.battleaxe.ability_desc=Дуэлист может нанести _сильный удар_ боевым топором. Эта концентрированная атака наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.battleaxe.ability_name=сильный удар
items.weapon.melee.battleaxe.desc=Огромная стальная головка этого боевого топора придает значительный вес каждому широкому удару.
items.weapon.melee.battleaxe.name=боевой топор
items.weapon.melee.battleaxe.stats_desc=Это довольно точное оружие.
items.weapon.melee.battleaxe.typical_ability_desc=Дуэлист может нанести _сильный удар_ боевым топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.crossbow$chargedshot.desc=Дуэлистка концентрирует силу в своем арбалете. Следующая атака, которую она совершит с его помощью, всегда будет попадать в цель и применять один из трех эффектов: \n — атаки ближнего боя отбросят врагов на несколько клеток; \n — дротики без наконечников нанесут дополнительный урон; \n — дротики с наконечниками получат дополнительные применения и применят свой эффект в области 7x7. Положительные эффекты дротиков будут действовать только на союзников, а вредные эффекты — только на врагов. Дуэлистка не может использовать эту способность для применения положительных эффектов дротиков к себе.
items.weapon.melee.crossbow$chargedshot.name=обвинен
items.weapon.melee.crossbow.ability_desc=Дуэлистка может зарядить свой арбалет, благодаря чему её следующая обычная атака всегда будет попадать в цель и применять один из трёх эффектов: рукопашные атаки отбрасывают врагов, дротики без наконечника наносят +%1$d урона, а дротики с наконечником применяют свой эффект в области 7x7 и действуют ещё _%2$d раз_.
items.weapon.melee.crossbow.ability_name=заряженный выстрел
items.weapon.melee.crossbow.desc=Довольно сложное оружие, стреляющее болтами с исключительной скоростью. Хотя оно и не предназначено для этого, вес и прочная конструкция этого арбалета делают его также неплохим оружием ближнего боя.
items.weapon.melee.crossbow.name=арбалет
items.weapon.melee.crossbow.stats_desc=Это оружие усиливает метательные дротики, увеличивая их урон на _%1$d-%2$d_ при экипировке, и даже накладывает на них своё зачарование.
items.weapon.melee.crossbow.typical_ability_desc=Дуэлистка может зарядить свой арбалет, благодаря чему её следующая обычная атака всегда будет попадать в цель и применять один из трёх эффектов: рукопашные атаки отбрасывают врагов, дротики без наконечника обычно наносят +%1$d урона, а дротики с наконечником применяют свой эффект в области 7x7 и обычно действуют ещё _%2$d раз.
items.weapon.melee.crossbow.typical_stats_desc=Как правило, это оружие усиливает метательные дротики, увеличивая их урон до _%1$d-%2$d_ при экипировке, и даже накладывает на них своё зачарование.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Усиление способностей
items.weapon.melee.cudgel.ability_desc=Дуэлист может нанести _сильный удар_ дубиной. Эта концентрированная атака наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.cudgel.ability_name=сильный удар
items.weapon.melee.cudgel.desc=Небольшая латунная булава, созданная скорее как средство самообороны для знати, чем как оружие для искателей приключений.
items.weapon.melee.cudgel.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.melee.cudgel.name=дубинка
items.weapon.melee.cudgel.stats_desc=Это довольно точное оружие.
items.weapon.melee.cudgel.typical_ability_desc=Дуэлист может нанести _сильный удар_ дубиной. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.dagger.ability_desc=Дуэлистка может _красться_, держа в руках кинжал. Эта способность позволяет Дуэлистке мгновенно телепортироваться на расстояние до 5 клеток и даёт ей _%d ходов невидимости._
items.weapon.melee.dagger.ability_name=крадущийся
items.weapon.melee.dagger.desc=Простой железный кинжал с изношенной деревянной рукоятью.
items.weapon.melee.dagger.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.melee.dagger.name=кинжал
items.weapon.melee.dagger.stats_desc=Это оружие эффективнее против ничего не подозревающих врагов.
items.weapon.melee.dagger.typical_ability_desc=Дуэлистка может _красться_, держа в руках кинжал. Эта способность позволяет Дуэлистке мгновенно телепортироваться на расстояние до 5 клеток и обычно даёт ей _%d ходов невидимости._
items.weapon.melee.dagger.upgrade_ability_stat_name=Длительность действия способности
items.weapon.melee.dirk.ability_desc=Дуэлистка может _красться_, держа в руках кинжал. Эта способность позволяет Дуэлистке мгновенно телепортироваться на расстояние до 4 клеток и даёт ей _%d ходов невидимости._
items.weapon.melee.dirk.ability_name=крадущийся
items.weapon.melee.dirk.desc=Более длинный колющий кинжал обеспечивает больше стали для нанесения ударов по врагам.
items.weapon.melee.dirk.name=Дирк
items.weapon.melee.dirk.stats_desc=Это оружие эффективнее против ничего не подозревающих врагов.
items.weapon.melee.dirk.typical_ability_desc=Дуэлистка может _красться_, держа в руках кинжал. Эта способность позволяет ей мгновенно телепортироваться на расстояние до 4 клеток и обычно даёт ей _%d ходов невидимости._
items.weapon.melee.dirk.upgrade_ability_stat_name=Длительность действия способности
items.weapon.melee.flail$spinabilitytracker.desc=Дуэлистка вращает свой цеп, накапливая урон для своей следующей обычной атаки. Каждый оборот занимает один ход, но увеличивает урон, максимум до трех оборотов. Цеп также гарантированно наносит удар во время вращения. \n\nТекущие вращения: %1$d%%.\nОсталось ходов: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=вращение
items.weapon.melee.flail.ability_desc=Дуэлист может вращать цеп, чтобы накапливать энергию в течение короткого времени. Каждый ход вращения цепа он будет наносить +%d урона_ при следующей обычной атаке, максимум 3 раза. Вращающийся цеп также гарантированно попадает в цель. Заряд расходуется только на начало вращения цепа.
items.weapon.melee.flail.ability_name=вращаться
items.weapon.melee.flail.desc=Шипастый мяч, прикрепленный к ручке цепью. Очень неудобный в обращении, но разрушительный при сильном ударе.
items.weapon.melee.flail.name=цеп
items.weapon.melee.flail.spin_warn=Больше нельзя вращать цеп.
items.weapon.melee.flail.stats_desc=Это довольно неточное оружие. \n Это оружие не способно нанести внезапный удар.
items.weapon.melee.flail.typical_ability_desc=Дуэлист может вращать цеп, чтобы накапливать энергию в течение короткого времени. Каждый ход вращения цепа он обычно наносит +%d урона_ при следующей обычной атаке, максимум 3 раза. Вращающийся цеп также гарантированно попадает в цель. Заряд расходуется только на начало вращения цепа.
items.weapon.melee.gauntlet.ability_desc=Дуэлист может выполнить комбинированный удар каменной перчаткой. Эта атака гарантированно попадает и наносит +%d урона за каждый удар обычным оружием ближнего боя или метательным оружием. Отсутствие попадания в течение 5 ходов сбрасывает эту комбинацию.
items.weapon.melee.gauntlet.ability_name=комбинированный удар
items.weapon.melee.gauntlet.desc=Эта массивная перчатка сделана из багровой ткани, поверх которой нанесены тяжелые магические камни. Ткань плотно облегает тело, превращая толстые каменные пластины почти во вторую кожу. Размахивание таким тяжелым оружием требует силы, но придает ударам огромную мощь.
items.weapon.melee.gauntlet.name=каменная перчатка
items.weapon.melee.gauntlet.stats_desc=Это очень быстродействующее оружие.
items.weapon.melee.gauntlet.typical_ability_desc=Дуэлист может выполнить комбинированный удар каменной перчаткой. Эта атака гарантированно попадает в цель и обычно наносит +%d урона за каждый удар обычным оружием ближнего боя или метательным оружием. Отсутствие попадания в течение 5 ходов сбрасывает эту комбинацию.
items.weapon.melee.glaive.ability_desc=Дуэлист может использовать кончик глефы, чтобы _пронзить_ врага, находящегося в пределах досягаемости, но не рядом с ним. Это наносит _%1$d-%2$d урона_, отбрасывает врага назад и гарантированно попадает в цель.
items.weapon.melee.glaive.ability_name=шип
items.weapon.melee.glaive.desc=Массивное древковое оружие, представляющее собой клинок меча на конце шеста.
items.weapon.melee.glaive.name=глефа
items.weapon.melee.glaive.stats_desc=Это довольно медленное оружие. \n Это оружие имеет увеличенную дальность стрельбы.
items.weapon.melee.glaive.typical_ability_desc=Дуэлист может использовать кончик глефы, чтобы _пронзить_ врага, находящегося в пределах досягаемости, но не рядом с ним. Обычно это наносит _%1$d-%2$d урона_, отбрасывает врага назад и гарантированно попадает в цель.
items.weapon.melee.gloves.ability_desc=Дуэлист может выполнить комбинированный удар перчатками с шипами. Эта атака гарантированно попадает и наносит +%d урона за каждый удар обычным оружием ближнего боя или метательным оружием. Отсутствие попадания в течение 5 ходов сбрасывает эту комбинацию.
items.weapon.melee.gloves.ability_name=комбинированный удар
items.weapon.melee.gloves.desc=Эти перчатки с шипами не обеспечивают реальной защиты, но могут служить неплохим оружием, оставляя руки свободными.
items.weapon.melee.gloves.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.melee.gloves.name=перчатки с шипами
items.weapon.melee.gloves.stats_desc=Это очень быстродействующее оружие.
items.weapon.melee.gloves.typical_ability_desc=Дуэлист может выполнить комбинированный удар перчатками с шипами. Эта атака гарантированно попадает в цель и обычно наносит +%d урона за каждый удар обычным оружием ближнего боя или метательным оружием. Отсутствие попадания в течение 5 ходов сбрасывает эту комбинацию.
items.weapon.melee.greataxe.ability_desc=Дуэлистка может совершить атаку возмездия двуручным топором, если у неё осталось меньше 50%% здоровья. Эта сокрушительная атака наносит _%1$d-%2$d урона, гарантированно попадает в цель и наносит мгновенный урон, если убивает врага.
items.weapon.melee.greataxe.ability_name=возмездие
items.weapon.melee.greataxe.desc=Этот гигантский топор, предназначенный для ношения на плече, одновременно мощный и тяжелый.
items.weapon.melee.greataxe.name=большой топор
items.weapon.melee.greataxe.stats_desc=Это оружие невероятно тяжёлое.
items.weapon.melee.greataxe.typical_ability_desc=Дуэлистка может совершить атаку возмездия двуручным топором, если у неё меньше 50%% здоровья. Эта сокрушительная атака обычно наносит _%1$d-%2$d урона, гарантированно попадает в цель и наносит мгновенный урон, если убивает врага.
items.weapon.melee.greatshield.ability_desc=Дуэлистка может _защититься_ большим щитом, полностью нейтрализуя все физические или магические атаки, направленные против неё, в течение _%d ходов_. После того, как дуэлистка заблокировала атаку, ответная атака или использование магии прекращают защиту.
items.weapon.melee.greatshield.ability_name=сторожить
items.weapon.melee.greatshield.desc=Эта гигантская металлическая масса, больше похожая на передвижную стену, чем на щит, помогает в обороне, но не оставляет много места для атаки.
items.weapon.melee.greatshield.name=большой щит
items.weapon.melee.greatshield.stats_desc=Это оружие блокирует урон от 0 до %d. Эффективность блокировки увеличивается с улучшением.
items.weapon.melee.greatshield.typical_ability_desc=Дуэлистка может _защититься_ большим щитом, полностью нейтрализуя все физические или магические атаки, направленные против неё, обычно на _%d ходов_. После того, как дуэлистка заблокировала атаку, ответная атака или использование магии прекращают защиту.
items.weapon.melee.greatshield.typical_stats_desc=Как правило, это оружие блокирует урон от 0 до %d. Эффективность блокировки увеличивается с улучшением.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Длительность действия способности
items.weapon.melee.greatsword.ability_desc=Дуэлист может _рубить_ врага двуручным мечом. Это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если рубящий удар убивает врага, это происходит мгновенно, и дуэлист может использовать рубящий удар снова в течение 5 ходов бесплатно.
items.weapon.melee.greatsword.ability_name=расщепление
items.weapon.melee.greatsword.desc=Этот огромный клинок наносит серьёзный урон, вкладывая всю свою мощь в каждый удар.
items.weapon.melee.greatsword.name=двуручный меч
items.weapon.melee.greatsword.typical_ability_desc=Дуэлист может _рубить_ врага двуручным мечом. Обычно это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если рубящий удар убивает врага, это происходит мгновенно, и дуэлист может использовать рубящий удар снова в течение 5 ходов бесплатно.
items.weapon.melee.handaxe.ability_desc=Дуэлист может нанести _сильный удар_ ручным топором. Эта концентрированная атака наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.handaxe.ability_name=сильный удар
items.weapon.melee.handaxe.desc=Легкий топор, чаще всего используемый для валки деревьев. Широкое лезвие также хорошо подходит для борьбы с врагами.
items.weapon.melee.handaxe.name=ручной топор
items.weapon.melee.handaxe.stats_desc=Это довольно точное оружие.
items.weapon.melee.handaxe.typical_ability_desc=Дуэлист может нанести _сильный удар_ ручным топором. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.katana.ability_desc=Дуэлист может совершить _выпад_ с катаной в сторону врага, находящегося в 1 клетке от него. Этот удар движется в сторону врага, наносит _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.katana.ability_name=выпад
items.weapon.melee.katana.desc=Тонкий меч с большой металлической гардой над рукоятью.
items.weapon.melee.katana.name=катана
items.weapon.melee.katana.stats_desc=Это оружие блокирует от 0 до 3 единиц урона.
items.weapon.melee.katana.typical_ability_desc=Дуэлист может совершить _выпад_ с катаной в сторону врага, находящегося в 1 клетке от него. Этот удар движется в сторону врага, обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.longsword.ability_desc=Дуэлист может _рубить_ врага длинным мечом. Это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если рубящий удар убивает врага, это происходит мгновенно, и дуэлист может использовать рубящий удар снова в течение 5 ходов бесплатно.
items.weapon.melee.longsword.ability_name=расщепление
items.weapon.melee.longsword.desc=Длинное, острое как бритва стальное лезвие этого меча внушает доверие своим блеском, хотя из-за своих размеров он довольно тяжелый.
items.weapon.melee.longsword.name=длинный меч
items.weapon.melee.longsword.typical_ability_desc=Дуэлист может _рубить_ врага длинным мечом. Обычно это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если рубящий удар убивает врага, это происходит мгновенно, и дуэлист может использовать рубящий удар снова в течение 5 ходов бесплатно.
items.weapon.melee.mace.ability_desc=Дуэлист может нанести _сильный удар_ булавой. Эта концентрированная атака наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.mace.ability_name=сильный удар
items.weapon.melee.mace.desc=Большой железный наконечник этого оружия наносит существенный урон.
items.weapon.melee.mace.name=булава
items.weapon.melee.mace.stats_desc=Это довольно точное оружие.
items.weapon.melee.mace.typical_ability_desc=Дуэлист может нанести _сильный удар_ булавой. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Сильный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.magesstaff.ac_imbue=ИМБУ
items.weapon.melee.magesstaff.ac_zap=ЗАП
items.weapon.melee.magesstaff.cursed_wand=Посох проклят, из-за чего его магия становится хаотичной и непредсказуемой.
items.weapon.melee.magesstaff.desc=Этот посох, созданный самим Магом, является уникальным магическим оружием, которое можно наделить силой волшебной палочки.
items.weapon.melee.magesstaff.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.melee.magesstaff.has_wand=В настоящее время персонал обладает _%s._
items.weapon.melee.magesstaff.imbue=Вы передаете своим сотрудникам код %s.
items.weapon.melee.magesstaff.imbue_cursed=Если вы наделите проклятием волшебную палочку, то и ваш посох тоже станет проклятым!
items.weapon.melee.magesstaff.imbue_desc=Вы уверены, что хотите наделить свой посох этой волшебной палочкой? Если уровень надеваемой палочки совпадает или выше уровня посоха, посох унаследует уровень этой палочки плюс одно из своих собственных улучшений.
items.weapon.melee.magesstaff.imbue_level=В результате этого процесса появится персонал _+%d._
items.weapon.melee.magesstaff.imbue_lost=Волшебная палочка, которая сейчас находится в вашем посохе, будет потеряна.
items.weapon.melee.magesstaff.imbue_talent=Волшебная палочка, в которую в данный момент вложена сила вашего посоха, _будет возвращена с показателем +0_.
items.weapon.melee.magesstaff.imbue_unknown=Вы не знаете уровень этой волшебной палочки, но это зачарование позволит получить как минимум посох _+%d._
items.weapon.melee.magesstaff.name=посох мага
items.weapon.melee.magesstaff.no=Нет, я передумал.
items.weapon.melee.magesstaff.no_wand=В настоящее время посох не обладает магическими свойствами; его необходимо _наделить силой волшебной палочки_, прежде чем его можно будет использовать для произнесения заклинаний.
items.weapon.melee.magesstaff.preserved=Предыдущая волшебная палочка была сохранена!
items.weapon.melee.magesstaff.prompt=Выберите волшебную палочку
items.weapon.melee.magesstaff.yes=Да, я уверен.
items.weapon.melee.meleeweapon.ability_cant_use=В данный момент вы не можете использовать эту способность.
items.weapon.melee.meleeweapon.ability_low_str=Вы недостаточно сильны, чтобы использовать способности этого оружия.
items.weapon.melee.meleeweapon.ability_need_equip=Для использования этой способности необходимо экипировать это оружие.
items.weapon.melee.meleeweapon.ability_no_charge=У вас недостаточно энергии, чтобы использовать эту способность.
items.weapon.melee.meleeweapon.ability_no_target=Там нет цели.
items.weapon.melee.meleeweapon.ability_occupied=Это место занято.
items.weapon.melee.meleeweapon.ability_target_range=Цель находится вне зоны досягаемости.
items.weapon.melee.meleeweapon.ac_ability=СПОСОБНОСТЬ
items.weapon.melee.meleeweapon.probably_too_heavy=Вероятно, это оружие слишком тяжелое для вас.
items.weapon.melee.meleeweapon.prompt=Выберите цель
items.weapon.melee.meleeweapon.stats_known=Это оружие ближнего боя _tier-%1$d_ наносит _%2$d-%3$d урона_ и требует _%4$d силы_ для правильного использования.
items.weapon.melee.meleeweapon.stats_unknown=Как правило, это оружие ближнего боя уровня %1$d наносит урон уровня %2$d-%3$d и требует для корректного использования силы уровня %4$d.
items.weapon.melee.meleeweapon.swap=Смена оружия
items.weapon.melee.meleeweapon.swap_full=С полным инвентарем это сделать невозможно.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Урон от способностей
items.weapon.melee.quarterstaff$defensivestance.desc=Дуэлистка использует свой посох для отражения входящих ударов и снарядов. Пока она находится в этой стойке, её уклонение от всех атак утраивается. \n\nОсталось ходов: %s.
items.weapon.melee.quarterstaff$defensivestance.name=оборонительная стойка
items.weapon.melee.quarterstaff.ability_desc=Дуэлистка может принять _оборонительную стойку_ с посохом. Эта стойка активируется мгновенно и утраивает её уклонение на _%d ходов._
items.weapon.melee.quarterstaff.ability_name=оборонительная стойка
items.weapon.melee.quarterstaff.desc=Посох из твердой древесины, концы которого обуты в железо.
items.weapon.melee.quarterstaff.name=квартирмейстер
items.weapon.melee.quarterstaff.stats_desc=Это оружие блокирует 0-2 единицы урона.
items.weapon.melee.quarterstaff.typical_ability_desc=Дуэлистка может принять _оборонительную стойку_ с посохом. Эта стойка активируется мгновенно и утраивает её уклонение, как правило, на _%d ходов._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Длительность действия способности
items.weapon.melee.rapier.ability_desc=Дуэлист может совершить _выпад_ с рапирой в сторону врага, находящегося в 1 клетке от него. Этот удар движется в сторону врага, наносит _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.rapier.ability_name=выпад
items.weapon.melee.rapier.desc=Тонкий прямой меч, обеспечивающий некоторую защиту в обмен на меньшую рубящую силу.
items.weapon.melee.rapier.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.melee.rapier.name=рапира
items.weapon.melee.rapier.stats_desc=Это оружие блокирует 0-1 единицу урона.
items.weapon.melee.rapier.typical_ability_desc=Дуэлист может совершить _выпад_ с рапирой в сторону врага, находящегося в 1 клетке от него. Этот удар движется в сторону врага, обычно наносит _%1$d-%2$d урона_ и гарантированно попадает в цель.
items.weapon.melee.roundshield$guardtracker.desc=Дуэлистка приготовила свой щит в ожидании атак. Физические или магические атаки, направленные против неё, будут полностью нейтрализованы. \n\nОсталось ходов: %s.
items.weapon.melee.roundshield$guardtracker.guarded=охраняемый
items.weapon.melee.roundshield$guardtracker.name=охрана
items.weapon.melee.roundshield.ability_desc=Дуэлистка может _защититься_ круглым щитом, полностью нейтрализуя все физические или магические атаки, направленные против неё, в течение _%d ходов_. После того, как дуэлистка заблокирует атаку, ответная атака или использование магии прекратят защиту.
items.weapon.melee.roundshield.ability_name=сторожить
items.weapon.melee.roundshield.desc=Этот большой щит эффективно блокирует атаки и может служить неплохим оружием в критической ситуации.
items.weapon.melee.roundshield.name=круглый щит
items.weapon.melee.roundshield.stats_desc=Это оружие блокирует урон от 0 до %d. Эффективность блокировки увеличивается с улучшением.
items.weapon.melee.roundshield.typical_ability_desc=Дуэлистка может _защититься_ круглым щитом, полностью нейтрализуя все физические или магические атаки, направленные против неё, обычно на _%d ходов_. После того, как дуэлистка заблокирует атаку, ответная атака или использование магии прекратят защиту.
items.weapon.melee.roundshield.typical_stats_desc=Как правило, это оружие блокирует урон от 0 до %d. Эффективность блокировки увеличивается с улучшением.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Длительность действия способности
items.weapon.melee.runicblade.ability_desc=Дуэлист может выполнить рунический удар руническим клинком. Эта атака гарантированно попадает в цель и обладает силой зачарования +%d%%.
items.weapon.melee.runicblade.ability_name=рунический слэш
items.weapon.melee.runicblade.desc=Загадочное оружие из далёкой страны, с ярко-синим лезвием.
items.weapon.melee.runicblade.name=рунический клинок
items.weapon.melee.runicblade.stats_desc=Это оружие лучше всего поддается модернизации.
items.weapon.melee.runicblade.typical_ability_desc=Дуэлист может выполнить рунический удар руническим клинком. Эта атака гарантированно попадает в цель и обычно обладает силой зачарования +%d%%.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Способность Сила
items.weapon.melee.sai$combostriketracker.desc=Дуэлист собирает комбо, которое можно использовать для увеличения урона от комбинированного удара. Каждая успешная обычная рукопашная атака или атака метательным оружием засчитывается, но отсутствие успешных атак в течение 5 ходов сбрасывает это комбо. \n\nНедавние попадания: %1$d.\n\nКоличество ходов до потери попаданий: %2$s.
items.weapon.melee.sai$combostriketracker.name=комбинированный удар
items.weapon.melee.sai.ability_desc=Дуэлист может выполнить комбинированный удар саи. Эта атака гарантированно попадает и наносит +%d урона за каждый удар обычным оружием ближнего боя или метательным оружием. Отсутствие попадания в течение 5 ходов сбрасывает эту комбинацию.
items.weapon.melee.sai.ability_name=комбинированный удар
items.weapon.melee.sai.desc=Два тонких клинка, предназначенных для использования в одной руке. Отлично подходят для нанесения сокрушительных ударов по врагам.
items.weapon.melee.sai.name=сай
items.weapon.melee.sai.stats_desc=Это очень быстродействующее оружие.
items.weapon.melee.sai.typical_ability_desc=Дуэлист может выполнить комбинированный удар саи. Эта атака гарантированно попадает в цель и обычно наносит +%d урона за каждый удар обычным оружием ближнего боя или метательным оружием. Отсутствие попадания в течение 5 ходов сбрасывает эту комбинацию.
items.weapon.melee.scimitar$sworddance.desc=Дуэлистка наносит быстрые, основанные на инерции удары, словно танцуя. В этой стойке она атакует на 60%% быстрее (достаточно, чтобы атаковать ровно два раза за ход саблей) и имеет +50%% к точности.\n\nОсталось ходов: %s.
items.weapon.melee.scimitar$sworddance.name=танец с мечами
items.weapon.melee.scimitar.ability_desc=Дуэлист может исполнить _танец мечей_ с ятаганом. Эта стойка активируется мгновенно и дает Дуэлисту +60%% скорости атаки и +50%% точности на _%d ходов._
items.weapon.melee.scimitar.ability_name=танец с мечами
items.weapon.melee.scimitar.desc=Толстый изогнутый клинок. Его форма позволяет наносить более быстрые, но менее мощные удары.
items.weapon.melee.scimitar.name=сабля
items.weapon.melee.scimitar.stats_desc=Это довольно быстродействующее оружие.
items.weapon.melee.scimitar.typical_ability_desc=Дуэлист может исполнить _танец мечей_ с ятаганом. Эта стойка активируется мгновенно и дает дуэлисту +60%% скорости атаки и +50%% точности, как правило, на _%d ходов._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Длительность действия способности
items.weapon.melee.shortsword.ability_desc=Дуэлист может _рубить_ врага коротким мечом. Это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если рубящий удар убивает врага, это происходит мгновенно, и дуэлист может использовать рубящий удар снова в течение 5 ходов бесплатно.
items.weapon.melee.shortsword.ability_name=расщепление
items.weapon.melee.shortsword.desc=Довольно короткий меч, всего на несколько дюймов длиннее кинжала.
items.weapon.melee.shortsword.name=короткий меч
items.weapon.melee.shortsword.typical_ability_desc=Дуэлист может _рубить_ врага коротким мечом. Обычно это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если удар убивает врага, это происходит мгновенно, и дуэлист может использовать удар снова в течение 5 ходов бесплатно.
items.weapon.melee.sickle.ability_desc=Дуэлист может _собрать_ врага серпом. Эта сокрушительная атака гарантированно попадает в цель и наносит _%d урона_. Этот урон наносится в виде кровотечения, если цель не обладает иммунитетом.
items.weapon.melee.sickle.ability_name=урожай
items.weapon.melee.sickle.desc=Ручной сельскохозяйственный инструмент, который также может служить мощным, но неудобным оружием.
items.weapon.melee.sickle.name=серп
items.weapon.melee.sickle.stats_desc=Это довольно неточное оружие.
items.weapon.melee.sickle.typical_ability_desc=Дуэлист может _собрать_ врага серпом. Эта сокрушительная атака гарантированно попадает в цель и обычно наносит _%d урона_. Этот урон наносится в виде кровотечения, если цель не обладает иммунитетом.
items.weapon.melee.spear.ability_desc=Дуэлист может использовать наконечник копья, чтобы поразить врага, находящегося в пределах досягаемости, но не рядом с ним. Это наносит урон в размере _%1$d-%2$d_, отбрасывает врага назад и гарантированно попадает в цель.
items.weapon.melee.spear.ability_name=шип
items.weapon.melee.spear.desc=Тонкий деревянный стержень с заточенным железным наконечником.
items.weapon.melee.spear.name=копье
items.weapon.melee.spear.stats_desc=Это довольно медленное оружие. \n Это оружие имеет увеличенную дальность стрельбы.
items.weapon.melee.spear.typical_ability_desc=Дуэлист может использовать наконечник копья, чтобы поразить врага, находящегося в пределах досягаемости, но не рядом с ним. Обычно это наносит _%1$d-%2$d урона_, отбрасывает врага назад и гарантированно попадает в цель.
items.weapon.melee.sword$cleavetracker.desc=Дуэлистка готова продолжить свой предыдущий удар. Следующее использование удара не потребует затрат заряда способности оружия. \n\nОсталось ходов: %s.
items.weapon.melee.sword$cleavetracker.name=расщепление
items.weapon.melee.sword.ability_desc=Дуэлист может _рубить_ врага мечом. Это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если рубящий удар убивает врага, это происходит мгновенно, и дуэлист может использовать рубящий удар снова в течение 5 ходов бесплатно.
items.weapon.melee.sword.ability_name=расщепление
items.weapon.melee.sword.desc=Меч с хорошим балансом. Не слишком большой, но всё же заметно длиннее короткого меча.
items.weapon.melee.sword.name=меч
items.weapon.melee.sword.typical_ability_desc=Дуэлист может _рубить_ врага мечом. Обычно это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если рубящий удар убивает врага, это происходит мгновенно, и дуэлист может использовать рубящий удар снова в течение 5 ходов бесплатно.
items.weapon.melee.warhammer.ability_desc=Дуэлист может нанести _мощный удар_ боевым молотом. Эта концентрированная атака наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.warhammer.ability_name=сильный удар
items.weapon.melee.warhammer.desc=Немногие существа способны выдержать сокрушительный удар этой огромной массы свинца и стали, но для эффективного применения требуется огромная сила.
items.weapon.melee.warhammer.name=боевой молот
items.weapon.melee.warhammer.stats_desc=Это довольно точное оружие.
items.weapon.melee.warhammer.typical_ability_desc=Дуэлист может нанести _мощный удар_ боевым молотом. Эта концентрированная атака обычно наносит _%1$d-%2$d урона_, если она застала противника врасплох, и оглушает его на 5 ходов, что снижает точность и уклонение на 50%%. Мощный удар всегда попадает в цель, но наносит обычный урон, если не застал противника врасплох.
items.weapon.melee.warscythe.ability_desc=Дуэлист может _собрать_ врага боевой косой. Эта сокрушительная атака гарантированно попадает в цель и наносит _%d урона_. Этот урон наносится в виде кровотечения, если цель не обладает иммунитетом.
items.weapon.melee.warscythe.ability_name=урожай
items.weapon.melee.warscythe.desc=Этот большой и громоздкий инструмент был усилен, чтобы лучше справляться с уничтожением врагов, чем с посевами.
items.weapon.melee.warscythe.name=боевая коса
items.weapon.melee.warscythe.stats_desc=Это довольно неточное оружие.
items.weapon.melee.warscythe.typical_ability_desc=Дуэлист может _собрать_ врага боевой косой. Эта сокрушительная атака гарантированно попадает в цель и обычно наносит _%d урона_. Этот урон наносится в виде кровотечения, если цель не обладает иммунитетом.
items.weapon.melee.whip.ability_desc=Дуэлистка может хлестать кнутом всех врагов вокруг себя. Эта способность наносит _%1$d-%2$d урона_, атакует всех врагов в пределах досягаемости и гарантированно попадает в цель.
items.weapon.melee.whip.ability_name=ресница
items.weapon.melee.whip.desc=Хотя зазубренный конец веревки на этом оружии наносит небольшой урон, его дальность действия не имеет себе равных.
items.weapon.melee.whip.name=хлыст
items.weapon.melee.whip.stats_desc=Это оружие обладает огромной дальностью действия.
items.weapon.melee.whip.typical_ability_desc=Дуэлистка может хлестать кнутом всех врагов вокруг себя. Эта способность обычно наносит _%1$d-%2$d урона_, атакует всех врагов в пределах досягаемости и гарантированно попадает в цель.
items.weapon.melee.wornshortsword.ability_desc=Дуэлист может _рубить_ врага изношенным коротким мечом. Это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если удар убивает врага, он происходит мгновенно, и дуэлист может использовать его снова в течение 5 ходов бесплатно.
items.weapon.melee.wornshortsword.ability_name=расщепление
items.weapon.melee.wornshortsword.desc=Довольно короткий меч, изношенный от интенсивного использования. Он слабее и немного легче, чем короткий меч в лучшем состоянии.
items.weapon.melee.wornshortsword.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.melee.wornshortsword.name=изношенный короткий меч
items.weapon.melee.wornshortsword.typical_ability_desc=Дуэлист может _рубить_ врага изношенным коротким мечом. Обычно это наносит _%1$d-%2$d урона_ и гарантированно попадает в цель. Если удар убивает врага, он происходит мгновенно, и дуэлист может использовать его снова в течение 5 ходов бесплатно.
items.weapon.missiles.bolas.desc=Это необычное дальнобойное оружие не наносит большого урона, но отлично замедляет цель.
items.weapon.missiles.bolas.name=болас
items.weapon.missiles.bolas.stats_desc=Это оружие наносит цели сокрушительный урон.
items.weapon.missiles.boomerang.desc=Этот плоский изогнутый деревянный снаряд, брошенный в противника, вернется в руки того, кто его бросил.
items.weapon.missiles.boomerang.durability=Благодаря своей прочной конструкции этот бумеранг не сломается при использовании.
items.weapon.missiles.boomerang.name=бумеранг
items.weapon.missiles.darts.adrenalinedart.desc=Наконечники этих дротиков изготовлены из соединения на основе стрелиции, которое увеличивает скорость передвижения и атаки союзников или ненадолго снижает скорость передвижения врагов. Сам дротик по-прежнему опасен для врагов, но не причинит вреда союзникам.
items.weapon.missiles.darts.adrenalinedart.name=адреналиновый дротик
items.weapon.missiles.darts.blindingdart.desc=Наконечники этих дротиков покрыты составом на основе растения "слепая трава", который на короткое время ослепляет цель. Однако они не дезориентируют, поэтому противник все равно будет знать, где он вас в последний раз видел.
items.weapon.missiles.darts.blindingdart.name=ослепляющая стрела
items.weapon.missiles.darts.chillingdart.desc=Наконечники этих дротиков покрыты составом на основе ледяной шапки, который значительно охлаждает цель.
items.weapon.missiles.darts.chillingdart.name=леденящий дротик
items.weapon.missiles.darts.cleansingdart.desc=Наконечники этих дротиков покрыты соединением на основе магерояла, которое временно делает союзников невосприимчивыми ко всем негативным эффектам или снимает положительные эффекты с врагов. Враги могут даже на мгновение забыть, что атакуют или убегают от вас. Сам дротик по-прежнему опасен для врагов, но не причинит вреда союзникам.
items.weapon.missiles.darts.cleansingdart.name=очищающий дротик
items.weapon.missiles.darts.dart.ac_tip=КОНЧИК
items.weapon.missiles.darts.dart.desc=Эти простые древки из дерева с заостренными наконечниками утяжелены, чтобы лететь точно и жалить добычу легким движением запястья. Наконечники древков можно украсить семенами, чтобы получить дополнительные эффекты при броске.
items.weapon.missiles.darts.dart.name=дротик
items.weapon.missiles.darts.dart.prompt=Выберите семя
items.weapon.missiles.darts.dart.tip_all=дротики %1$d с семенами %2$d
items.weapon.missiles.darts.dart.tip_cancel=отмена
items.weapon.missiles.darts.dart.tip_desc=Одно семя можно соединить с одной или двумя дротиками, чтобы насадить на них наконечник. Каждый тип семени дает свой собственный тип дротика с уникальным эффектом одноразового использования. Насадка на дротик этими семенами даст _%s._
items.weapon.missiles.darts.dart.tip_one=наконечник 1 дротика с 1 семенем
items.weapon.missiles.darts.dart.tip_title=Дартс с наконечником
items.weapon.missiles.darts.dart.tip_two=насадите 2 дротика с 1 семенем.
items.weapon.missiles.darts.dart.unlimited_uses=Благодаря своей простой конструкции дротики, по сути, прослужат вечно.
items.weapon.missiles.darts.displacingdart.desc=Наконечники этих дротиков покрыты составом на основе фейдлифа, который телепортирует цель на небольшое расстояние.
items.weapon.missiles.darts.displacingdart.name=смещающий дротик
items.weapon.missiles.darts.healingdart.desc=Наконечники этих дротиков покрыты составом на основе солнечной травы, который обеспечивает мгновенное исцеление цели. Сам дротик по-прежнему опасен для врагов, но не причинит вреда союзникам.
items.weapon.missiles.darts.healingdart.name=лечебный дротик
items.weapon.missiles.darts.holydart.desc=Наконечники этих дротиков покрыты соединением на основе звездчатого цветка, которое наполняет цель святой энергией. Союзники и обычные враги получат благословение, но нежить или демонические враги получат сильный урон. Сам дротик по-прежнему опасен для врагов, но не причинит вреда союзникам.
items.weapon.missiles.darts.holydart.name=священный дротик
items.weapon.missiles.darts.incendiarydart.desc=Наконечники этих дротиков покрыты составом на основе огненного цветка, который при ударе вспыхивает ярким пламенем.
items.weapon.missiles.darts.incendiarydart.name=зажигательная стрела
items.weapon.missiles.darts.paralyticdart.desc=Наконечники этих дротиков покрыты веществом на основе корня сорняка, которое на короткое время парализует цель.
items.weapon.missiles.darts.paralyticdart.name=паралитический дротик
items.weapon.missiles.darts.poisondart.desc=Наконечники этих дротиков покрыты веществом на основе мха печального, которое отравляет цель.
items.weapon.missiles.darts.poisondart.name=отравленный дротик
items.weapon.missiles.darts.rotdart.desc=Эти смертоносные дротики снабжены кислым соединением на основе гнилых ягод, которое агрессивно разъедает все, с чем соприкасается дротик. Сильные враги будут противостоять большей части этого воздействия, но коррозия достаточно сильна, чтобы легко убить большинство обычных противников. Эти дротики служат дольше, чем другие, но их прочность нельзя повысить.
items.weapon.missiles.darts.rotdart.discover_hint=Этот предмет можно создать, используя семя, полученное в ходе выполнения определённого задания.
items.weapon.missiles.darts.rotdart.name=гнилая стрела
items.weapon.missiles.darts.shockingdart.desc=Наконечники этих дротиков покрыты составом на основе растения «штормовая лоза», который нанесет цели сильный электрический разряд.
items.weapon.missiles.darts.shockingdart.name=шокирующий дротик
items.weapon.missiles.darts.tippeddart.about_to_break=Кончик вашей дротики вот-вот испортится.
items.weapon.missiles.darts.tippeddart.ac_clean=ЧИСТЫЙ
items.weapon.missiles.darts.tippeddart.cancel=отмена
items.weapon.missiles.darts.tippeddart.clean_all=все почистить
items.weapon.missiles.darts.tippeddart.clean_desc=Эта операция удалит семя с кончиков ваших дротиков, и они снова станут обычными дротиками.
items.weapon.missiles.darts.tippeddart.clean_one=чистый один
items.weapon.missiles.darts.tippeddart.clean_title=Чистые дротики
items.weapon.missiles.darts.tippeddart.discover_hint=Этот предмет можно купить в магазине или создать, используя семя.
items.weapon.missiles.darts.tippeddart.has_broken=Срок годности наконечника вашей дротики истёк.
items.weapon.missiles.darts.tippeddart.unlimited_uses=Но они настолько высокого качества, что, по сути, прослужат вечно.
items.weapon.missiles.darts.tippeddart.uses_left=В этой стопке дротиков осталось _%d/%d_ использований, прежде чем один наконечник износится.
items.weapon.missiles.fishingspear.desc=Миниатюрные метательные копья, которые, несмотря на то, что предназначены для рыбалки, хорошо подходят в качестве импровизированного оружия.
items.weapon.missiles.fishingspear.name=рыболовное копье
items.weapon.missiles.forcecube.desc=Эти причудливые волшебные кубы достаточно малы, чтобы поместиться в руке, но невероятно тяжелы.
items.weapon.missiles.forcecube.name=куб силы
items.weapon.missiles.forcecube.ondeath=Ты покончил с собой, используя свой собственный Силовой Куб...
items.weapon.missiles.forcecube.stats_desc=Это оружие распределяет силу удара по небольшой площади, поражая всё, что находится поблизости.
items.weapon.missiles.heavyboomerang.desc=Этот большой бумеранг сложен в эффективном использовании, но способен нанести значительный урон.
items.weapon.missiles.heavyboomerang.name=тяжелый бумеранг
items.weapon.missiles.heavyboomerang.stats_desc=Это оружие возвращается в то место, откуда было брошено, через пять ходов.
items.weapon.missiles.javelin.desc=Эти более крупные метательные копья утяжелены таким образом, чтобы их острие находилось впереди, когда они летят по воздуху.
items.weapon.missiles.javelin.name=копье
items.weapon.missiles.kunai.desc=Эти небольшие ножи в руках опытного пользователя обладают большой мощностью.
items.weapon.missiles.kunai.name=кунай
items.weapon.missiles.kunai.stats_desc=Это оружие эффективнее против ничего не подозревающих врагов.
items.weapon.missiles.missileweapon$placeholder.name=метательное оружие
items.weapon.missiles.missileweapon.about_to_break=Ваше метательное оружие вот-вот сломается.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Если последнее метательное оружие из вашего улучшенного набора метательного оружия сломается, набор будет безвозвратно утерян. Вы уверены, что хотите его бросить?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=нет
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=да
items.weapon.missiles.missileweapon.curse_discover=Это метательное оружие проклято!
items.weapon.missiles.missileweapon.distance=Метательное оружие точнее на расстоянии, но менее точно в ближнем бою.
items.weapon.missiles.missileweapon.durability=Метательное оружие изнашивается и ломается в процессе использования.
items.weapon.missiles.missileweapon.dust=Метаемое оружие рассыпается в пыль при прикосновении.
items.weapon.missiles.missileweapon.has_broken=Одно из ваших метательных орудий сломалось.
items.weapon.missiles.missileweapon.probably_too_heavy=Вероятно, это оружие слишком тяжелое для вас.
items.weapon.missiles.missileweapon.stats_known=Этот набор метательного оружия _tier-%1$d_ наносит _%2$d-%3$d урона_ и требует _%4$d силы_ для использования.
items.weapon.missiles.missileweapon.stats_unknown=Как правило, этот набор метательного оружия _tier-%1$d_ наносит _%2$d-%3$d урона_ и требует _%4$d силы_ для использования.
items.weapon.missiles.missileweapon.unknown_uses=Как правило, этот набор метательного оружия можно использовать _%d_ раз, прежде чем один из предметов сломается.
items.weapon.missiles.missileweapon.unlimited_uses=Этот набор настолько высокого качества, что прослужит практически вечно.
items.weapon.missiles.missileweapon.uses_left=Этот набор метательного оружия имеет _%d/%d_ оставшихся использований, прежде чем одно из них сломается.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Вы недавно мгновенно метнули сюрикен и должны подождать, прежде чем сделать это снова. Сюрикены по-прежнему можно метать, но со скоростью обычного оружия. \n\nОсталось ходов: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Время перезарядки сюрикена
items.weapon.missiles.shuriken.desc=Звёздочки из металла с острыми как бритва краями наносят серьёзные раны при попадании. Их можно метать очень быстро.
items.weapon.missiles.shuriken.name=сюрикен
items.weapon.missiles.shuriken.stats_desc=Сюрикены можно метать мгновенно, время перезарядки составляет 20 ходов.
items.weapon.missiles.throwingclub.desc=Довольно простое, но прочное метательное оружие, по сути, большой камень, прикрепленный к палке.
items.weapon.missiles.throwingclub.name=метательный клуб
items.weapon.missiles.throwingclub.stats_desc=Это оружие не прилипает к врагам и может быть мгновенно подобрано.
items.weapon.missiles.throwinghammer.desc=Эти массивные молотки предназначены для метания во врага. Благодаря цельнометаллической конструкции они отличаются высокой прочностью.
items.weapon.missiles.throwinghammer.name=метательный молот
items.weapon.missiles.throwinghammer.stats_desc=Это оружие не прилипает к врагам и может быть мгновенно подобрано.
items.weapon.missiles.throwingknife.desc=Эти легкие ножи сбалансированы таким образом, чтобы рассекать воздух и поражать цель по дуге.
items.weapon.missiles.throwingknife.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.missiles.throwingknife.name=метательный нож
items.weapon.missiles.throwingknife.stats_desc=Это оружие эффективнее против ничего не подозревающих врагов.
items.weapon.missiles.throwingspear.desc=Эти легкие копья имеют тонкие рамы и предназначены для метания, а не для нанесения колющих ударов.
items.weapon.missiles.throwingspear.name=метательное копье
items.weapon.missiles.throwingspike.desc=Эти прочные заостренные металлические древки предназначены для метания в врагов на расстоянии.
items.weapon.missiles.throwingspike.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.missiles.throwingspike.name=метательный шип
items.weapon.missiles.throwingstone.desc=Эти камни шлифуются, чтобы их можно было бросать с большей силой, чем обычные камни.
items.weapon.missiles.throwingstone.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.missiles.throwingstone.name=бросание камня
items.weapon.missiles.tomahawk.desc=Эти метательные топоры имеют зазубренное лезвие, которое, вонзившись во врага, наносит ему удар.
items.weapon.missiles.tomahawk.name=томагавк
items.weapon.missiles.tomahawk.stats_desc=Это оружие наносит цели кровотечение (_%1$d-%2$d).
items.weapon.missiles.tomahawk.typical_stats_desc=Это оружие обычно наносит цели кровотечение (_%1$d-%2$d).
items.weapon.missiles.trident.desc=Массивные метательные копья с тремя смертоносными зубцами на конце. Они мощные, но довольно тяжелые.
items.weapon.missiles.trident.name=трезубец
items.weapon.spiritbow.ac_shoot=СТРЕЛЯТЬ
items.weapon.spiritbow.desc=Лук, изготовленный из древнего магического дерева. Тетива и гравировка лука светятся бледно-голубым светом. При натяжении тетивы этот лук создаёт магическую стрелу, которую можно выстрелить во врага.
items.weapon.spiritbow.discover_hint=Один из героев начинает игру с этим предметом.
items.weapon.spiritbow.name=духовный лук
items.weapon.spiritbow.prompt=Выберите цель
items.weapon.spiritbow.stats=Лук нельзя улучшить напрямую, но его характеристики будут неуклонно расти по мере повышения уровня. На вашем текущем уровне стрелы, выпущенные из лука, наносят _%1$d-%2$d урона_ и требуют _%3$d силы_ для корректного использования.
items.weapon.weapon$enchantment.discover_hint=Предмет с таким эффектом можно найти случайным образом в подземелье, или же можно попробовать применить его к предмету самостоятельно.
items.weapon.weapon$enchantment.enchant=очарование
items.weapon.weapon$enchantment.rankings_desc=Убит заклинанием
items.weapon.weapon.cursed=В этом оружии чувствуется зловещая магия.
items.weapon.weapon.cursed_worn=Поскольку это оружие проклято, вы бессильны снять с него проклятие.
items.weapon.weapon.enchant_hardened=Оно затвердело.
items.weapon.weapon.enchanted=У него есть _%s._
items.weapon.weapon.excess_str=Благодаря вашей избыточной силе, вы будете наносить _0-%d дополнительного урона_ этим оружием.
items.weapon.weapon.faster=Он усовершенствован для повышения _скорости_.
items.weapon.weapon.hardened_no_enchant=Это оружие было _закалено_, но в данный момент не зачаровано.
items.weapon.weapon.hardening_gone=Закалочное покрытие этого оружия стерлось!
items.weapon.weapon.identify=Теперь вы достаточно хорошо знакомы со своим оружием, чтобы его опознать.
items.weapon.weapon.incompatible=Взаимодействие различных видов магии нейтрализовало заклинание, наложенное на это оружие!
items.weapon.weapon.not_cursed=Это оружие не обладает злонамеренной магией.
items.weapon.weapon.stronger=Он улучшен для увеличения урона.
items.weapon.weapon.too_heavy=Из-за вашей недостаточной силы это оружие будет препятствовать скорости атаки, точности и способности совершать внезапные нападения.
items.weapon.weapon.weak_cursed=Несмотря на проклятие, вы можете снять это оружие.

items.keys.skeletonkey.desc=Этот ключ выглядит внушительно: его головка имеет форму черепа. Вероятно, он способен открыть какую-нибудь серьёзную дверь.
items.weapon.missiles.bombarrow.desc=Стрела с прикрепленной бомбой. Держитесь на расстоянии.
items.weapon.missiles.bombarrow.name=бомбовая стрела
items.weapon.missiles.missileweapon.damage_desc=Это оружие наносит от _%1$d_ до _%2$d_ урона за удар.
items.bags.seedpouch.desc=В этот маленький бархатный мешочек можно сложить сколько угодно семян. Очень удобно.
items.bags.seedpouch.name=мешочек с семенами
items.potions.potionofmight.desc=Эта мощная жидкость разольётся по мышцам, навсегда увеличив силу на один пункт, а здоровье — на пять.
items.potions.potionofmight.name=Зелье Могущества
items.rings.ringofdetection.desc=С этим кольцом можно замечать скрытые ловушки и потайные двери, не тратя время на поиски. Ослабленные кольца обнаружения притупляют чувства, мешая находить тайники даже при тщательном поиске.
items.rings.ringofdetection.name=Кольцо обнаружения
items.rings.ringofhaggler.desc=На самом деле у этого кольца нет магических свойств. Оно показывает торговцам, что его владелец состоит в Гильдии воров. Обычно они охотно дают скидку в обмен на обещание какое-то время их не трогать. Улучшение кольца не даёт дополнительных преимуществ.
items.rings.ringofhaggler.name=Кольцо Торговца
items.rings.ringofherbalism.desc=Это кольцо увеличивает шанс найти росу и семена при вытаптывании травы.
items.rings.ringofherbalism.name=Кольцо травничества
items.rings.ringofmending.desc=Это кольцо усиливает способность тела к восстановлению, ускоряя заживление ран. Ослабленные кольца замедляют или даже останавливают естественное восстановление здоровья.
items.rings.ringofmending.name=кольцо восстановления
items.rings.ringofpower.desc=Энергетическое поле этого кольца усиливает твои жезлы. Ослабленные кольца могущества, наоборот, делают их слабее.
items.rings.ringofpower.name=кольцо могущества
items.rings.ringofsatiety.desc=С этим кольцом можно дольше обходиться без еды. Ослабленные кольца сытости действуют наоборот.
items.rings.ringofsatiety.name=Кольцо насыщения
items.rings.ringofshadows.desc=С этим кольцом враги с меньшей вероятностью заметят вас. Уменьшенные кольца теней предупредят врагов, которые в противном случае могли бы и не заметить вашего присутствия.
items.rings.ringofshadows.name=Кольцо теней
items.rings.ringofthorns.desc=У этого кольца нет настоящих шипов, но атакующий тебя враг сам получит часть нанесённого урона. Улучшение кольца не даёт дополнительных преимуществ.
items.rings.ringofthorns.name=Кольцо Терновника
items.scrolls.scrollofchallenge.desc=При прочтении вслух этот свиток издаст грозный рев, который разбудит всех монстров и сообщит им о местонахождении читающего.
items.scrolls.scrollofchallenge.name=свиток испытания
items.scrolls.scrollofenchantment.desc=Этот свиток позволяет наделить оружие или доспехи случайным зачарованием, дарующим им особую силу.
items.scrolls.scrollofenchantment.name=свиток зачарования
items.scrolls.scrollofpsionicblast.desc=Этот свиток содержит разрушительную энергию, которую можно псионически направить на нанесение огромного урона всем существам в поле зрения. Сопутствующая вспышка света временно ослепит всех в зоне действия, включая читателя свитка.
items.scrolls.scrollofpsionicblast.name=свиток псионического взрыва
items.scrolls.scrollofwipeout.desc=Прочитайте этот свиток, чтобы высвободить гнев духов подземелья, которые уничтожат всё на текущем уровне. Ну, почти всё. Некоторые из самых могущественных существ могут остаться незатронутыми.
items.scrolls.scrollofwipeout.name=Свиток уничтожения
items.wands.wandofblink.desc=Этот жезл позволяет телепортироваться в выбранном направлении. Существа и неподвижные преграды останавливают телепортацию.
items.wands.wandofblink.name=жезл перемещения
items.wands.wandoffirebolt.desc=Этот жезл выпускает заряды магического огня. Он поджигает горючую местность, ранит и воспламеняет существо, в которое попадёт.
items.wands.wandoffirebolt.name=Жезл Огненной Молнии
