items.artifacts.sandalsofnature.ac_root=根
items.artifacts.sandalsofnature.desc_1=乍一看像是麻绳做成的凉鞋，实际上是两株植物！它们看起来很虚弱，颜色也很苍白，或许需要施肥？
items.artifacts.sandalsofnature.desc_2=鞋子长大了，现在更像两双定制皮鞋了。它们恢复了一些颜色，也许还能继续长大？
items.artifacts.sandalsofnature.desc_3=这些植物又重新生长了，现在看起来像一双用树皮制成的结实靴子。它们似乎恢复了活力，但或许还能继续生长？
items.artifacts.sandalsofnature.desc_4=这些植物似乎已经长到了最大尺寸，看起来像一双铠甲般的胫甲。这双胫甲呈深棕色，形似一棵非常粗壮的树。
items.artifacts.sandalsofnature.desc_ability=鞋子会泛起你喂给它们的最后一颗种子的颜色。它们可以短暂地扎根于地面，并在3格半径内产生该植物的效果。种子：_%s_\n所需充能：_%d%%_
items.artifacts.sandalsofnature.desc_cursed=这双被诅咒的凉鞋阻碍了人与自然的和谐相处。
items.artifacts.sandalsofnature.desc_hint=佩戴这件饰品，你会感觉与自然更加和谐。
items.artifacts.sandalsofnature.desc_seeds=你已经给鞋子喂了 %d 种子。
items.artifacts.sandalsofnature.levelup=你的鞋子突然变大了！
items.artifacts.sandalsofnature.low_charge=你的鞋子没有足够的能量来做到这一点。
items.artifacts.sandalsofnature.name=自然凉鞋
items.artifacts.sandalsofnature.name_1=自然之鞋
items.artifacts.sandalsofnature.name_2=自然之靴
items.artifacts.sandalsofnature.name_3=自然胫甲
items.artifacts.sandalsofnature.no_effect=你必须先在鞋子里放一颗种子。
items.artifacts.sandalsofnature.out_of_range=该位置超出范围。
items.artifacts.sandalsofnature.prompt=选择一颗种子
items.artifacts.sandalsofnature.prompt_target=选择位置
items.artifacts.skeletonkey$keywall.desc=骷髅钥匙在这里设置了一道临时魔法墙。
items.artifacts.skeletonkey.ac_insert=插入
items.artifacts.skeletonkey.crystal_charges=打开水晶锁需要 5 次充能。
items.artifacts.skeletonkey.cursed=你不能使用被诅咒的骷髅钥匙。
items.artifacts.skeletonkey.desc=一把看起来很重要的钥匙，钥匙头形状像骷髅头。每次看，它的齿似乎都不一样。
items.artifacts.skeletonkey.desc_cursed=这把该死的钥匙似乎故意避免插入任何锁，甚至让你很难（但并非不可能）使用其他钥匙。
items.artifacts.skeletonkey.desc_worn=这把魔法钥匙似乎会随着使用次数的增加而增强力量，取代地牢中普通的钥匙。它几乎可以插入地牢中任何锁，用于打开或关闭锁，包括之前从未上锁的门。这把钥匙甚至可以用于正前方或斜前方的空白区域，以“锁定”你面前的空气，形成一道持续10回合的3格宽的实体墙。如果空间允许，锁定还会将敌人推开。
items.artifacts.skeletonkey.discard=你丢弃多余的钥匙。
items.artifacts.skeletonkey.force_lock=没有了万能钥匙，锁已经松动了。你设法把它撬开了。
items.artifacts.skeletonkey.gold_charges=打开金锁需要2次充能。
items.artifacts.skeletonkey.invalid_target=那里没有需要上锁或解锁的东西。
items.artifacts.skeletonkey.iron_charges=打开一把普通锁需要 1 次充能。
items.artifacts.skeletonkey.levelup=你的万能钥匙越来越强了！
items.artifacts.skeletonkey.lock_charges=锁门需要2次充电。
items.artifacts.skeletonkey.lock_no_space=你不能把角色锁在门里！
items.artifacts.skeletonkey.locked_with_key=那扇门是用你的万能钥匙锁上的。
items.artifacts.skeletonkey.name=万能钥匙
items.artifacts.skeletonkey.prompt=选择目标
items.artifacts.skeletonkey.wall_charges=建造临时墙需要 2 次充能。
items.artifacts.skeletonkey.wont_open=不知为何，钥匙插不进这把锁里。
items.artifacts.talismanofforesight$foresight.desc=你感到非常紧张，仿佛附近有看不见的危险。
items.artifacts.talismanofforesight$foresight.name=远见
items.artifacts.talismanofforesight$foresight.uneasy=你感到不安。
items.artifacts.talismanofforesight.ac_scry=惊魂
items.artifacts.talismanofforesight.desc=一块光滑的石头，上面刻着奇怪的图案。你感觉它好像在注视着你周围的一切，警惕着任何隐藏的东西。
items.artifacts.talismanofforesight.desc_cursed=那枚被诅咒的护身符正专注地盯着你，麻痹你的感官。
items.artifacts.talismanofforesight.desc_worn=握住护身符后，你会感觉自己的感官变得更加敏锐。随着时间的推移，护身符会缓慢积攒能量，当你发现隐藏的门或陷阱时，能量也会随之积攒。护身符可以消耗能量进行锥形范围的“占卜”，揭示扫描区域内的所有地块和秘密，并在短时间内让你看到敌人和物品。
items.artifacts.talismanofforesight.full_charge=你的护身符已充满电！
items.artifacts.talismanofforesight.levelup=你的护身符变得更强了！
items.artifacts.talismanofforesight.low_charge=该护符需要至少 5% 的能量才能进行占卜。
items.artifacts.talismanofforesight.name=预知护身符
items.artifacts.talismanofforesight.prompt=选择扫描位置。
items.artifacts.timekeepershourglass$sandbag.desc=这小袋细沙应该非常适合你的沙漏。\n\n店主恰好在你需要的时候有这个东西，这似乎有点奇怪……
items.artifacts.timekeepershourglass$sandbag.levelup=你把沙子倒入沙漏里。
items.artifacts.timekeepershourglass$sandbag.maxlevel=你的沙漏里装满了神奇的沙子！
items.artifacts.timekeepershourglass$sandbag.name=一袋魔法沙
items.artifacts.timekeepershourglass$sandbag.no_hourglass=你没有沙漏来装这些沙子。
items.artifacts.timekeepershourglass$timefreeze.desc=时间在你周围静止，使你可以瞬间执行动作。此效果持续到被取消或你的沙漏能量耗尽为止。攻击或使用魔法也会打破此效果。\n\n持续回合数直到充能使用：%s。
items.artifacts.timekeepershourglass$timefreeze.name=时间冻结
items.artifacts.timekeepershourglass.ac_activate=激活
items.artifacts.timekeepershourglass.cursed=你不能使用被诅咒的沙漏。
items.artifacts.timekeepershourglass.deactivate=你关闭了时间冻结功能。
items.artifacts.timekeepershourglass.desc=这个硕大的华丽沙漏外表朴素，但你却能感受到它精雕细琢的外壳中蕴藏着强大的力量。当你转动沙漏，看着沙子缓缓流淌时，你会感觉到它散发出的魔力在牵引着你，你不禁会想，如果运用这股魔力，你或许就能掌控时间。
items.artifacts.timekeepershourglass.desc_cursed=那只被诅咒的沙漏被锁在你的身边，你能感觉到它试图操纵你的时间流逝。
items.artifacts.timekeepershourglass.desc_hint=沙漏似乎漏掉了一些沙子，要是你能找到一些就好了……
items.artifacts.timekeepershourglass.freeze=让我周围的时间静止
items.artifacts.timekeepershourglass.name=计时员的沙漏
items.artifacts.timekeepershourglass.no_charge=你的沙漏还没有充满电，暂时无法使用。
items.artifacts.timekeepershourglass.onfreeze=周围的一切突然静止了。
items.artifacts.timekeepershourglass.onstasis=世界仿佛在一瞬间发生了变化。
items.artifacts.timekeepershourglass.prompt=你想如何使用沙漏的魔法？\n\n静止状态下，时间正常流逝，而你则处于冻结状态且完全无敌，每次最多消耗2次充能。\n\n时间冻结时，你的行动仿佛没有时间限制。此状态可随时通过使用沙漏或攻击来解除。
items.artifacts.timekeepershourglass.stasis=让自己进入静止状态
items.artifacts.unstablespellbook.ac_add=添加
items.artifacts.unstablespellbook.ac_read=读
items.artifacts.unstablespellbook.blinded=失明时无法阅读书籍。
items.artifacts.unstablespellbook.cursed=你无法阅读被诅咒的魔法书。
items.artifacts.unstablespellbook.desc=考虑到它的年代，这本古籍的保存状况出奇地好。翻动书页时，它会发出嘶嘶声和噼啪声，仿佛蕴含着一股不稳定的能量。如果你阅读这本书，谁也无法预料你会施展什么样的魔法。
items.artifacts.unstablespellbook.desc_cursed=这本被诅咒的书已经与你束缚在一起，它阻碍了你使用大多数卷轴的能力。
items.artifacts.unstablespellbook.desc_empowered=你添加到书中的卷轴散发着强大的能量。你可以选择这些卷轴的异域版本效果，但需要额外付费。
items.artifacts.unstablespellbook.desc_index=这本书并不完整。它的索引目前指向以下空白页：
items.artifacts.unstablespellbook.infuse_scroll=你将卷轴的能量注入到书中。
items.artifacts.unstablespellbook.name=不稳定的魔法书
items.artifacts.unstablespellbook.no_charge=你的魔法书暂时没能量了。
items.artifacts.unstablespellbook.prompt=选择滚动条
items.artifacts.unstablespellbook.read_empowered=你添加到法术书中的卷轴能量涌动。你可以选择引导此卷轴的普通版或异域版效果。选择异域版效果将消耗2点充能而非1点。
items.artifacts.unstablespellbook.unable_scroll=您无法将此卷轴添加到书中。
items.artifacts.unstablespellbook.unknown_scroll=你还不确定这是什么类型的卷轴。
items.bags.bag.discover_hint=你可以在商店里买到这个商品。
items.bags.bag.name=背包
items.bags.magicalholster.desc=这款纤薄的枪套由某种珍稀动物皮毛制成，蕴含强大的魔法，可以收纳大量远程武器。您只需伸手即可轻松取用所需物品。由于枪套的魔法作用，魔杖在枪套内充能速度略微加快，投掷武器的续航时间也略微延长。
items.bags.magicalholster.name=魔法枪套
items.bags.potionbandolier.desc=这条厚实的弹药带像腰带一样系在胸前，上面有很多隔热带，可以用来装药水瓶、水袋或液态金属瓶。装在弹药带里，你的药水就能免受寒冷侵袭。
items.bags.potionbandolier.name=药水弹药带
items.bags.scrollholder.desc=这个管状容器看起来像是用来装天文学家的工具和海图的，但你的卷轴放进去也一样合适。它甚至还有几个侧隔层，可以很好地放置魔法水晶、奥术笔和奥术树脂。这个容器看起来不太易燃，所以你的卷轴放在里面应该不会着火。
items.bags.scrollholder.name=卷轴支架
items.bags.velvetpouch.desc=这个小小的天鹅绒袋可以存放很多小物件，例如种子、符文石和一些炼金材料。
items.bags.velvetpouch.discover_hint=其中一位英雄初始就拥有这件物品。
items.bags.velvetpouch.name=天鹅绒小袋
items.bombs.arcanebomb.desc=这枚炸弹被赋予了神秘的力量。它会像古伊的强化攻击一样爆炸，对2格范围内的所有目标造成_%1$d-%2$d点魔法伤害_。
items.bombs.arcanebomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.arcanebomb.name=奥术炸弹
items.bombs.bomb$doublebomb.desc=两枚沉重的黑火药炸弹叠在一起，看起来好像可以免费获得一枚！
items.bombs.bomb$doublebomb.name=两枚炸弹
items.bombs.bomb.ac_lightthrow=灯光和投射
items.bombs.bomb.desc=一枚威力相当大的黑火药炸弹。这枚炸弹爆炸后会对周围所有物体造成_%1$d-%2$d点伤害_，并摧毁部分相邻地形或物品。
items.bombs.bomb.desc_burning=炸弹的引信快要烧完了，请保持距离或将其扑灭！
items.bombs.bomb.desc_fuse=看起来引信点燃后需要几轮射击才能烧尽。
items.bombs.bomb.name=炸弹
items.bombs.bomb.ondeath=爆炸会要了你的命……
items.bombs.bomb.rankings_desc=死于爆炸
items.bombs.bomb.snuff_fuse=你迅速掐灭了炸弹的引信。
items.bombs.firebomb.desc=这枚炸弹经过改造，爆炸范围更大，造成_%1$d-%2$d伤害_，并在2格范围内蔓延持续火焰。
items.bombs.firebomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.firebomb.name=燃烧弹
items.bombs.flashbangbomb.desc=这枚特制炸弹爆炸时会爆发出耀眼的光芒、震撼的音效和强劲的电流。爆炸产生的冲击波会使周围两格范围内的物体受到_%1$d-%2$d点伤害，电流还会额外造成25%%点伤害，并使其眩晕10回合。
items.bombs.flashbangbomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.flashbangbomb.name=闪光弹
items.bombs.frostbomb.desc=这枚炸弹经过改造，爆炸范围更大，造成 _%1$d-%2$d 点伤害，并在 2 格范围内持续释放一股冰冷的空气。
items.bombs.frostbomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.frostbomb.name=霜弹
items.bombs.holybomb.desc=这枚炸弹经过改造，爆炸时会在更大范围内闪耀圣光。爆炸产生的伤害为_%1$d-%2$d_，爆炸范围内两格内的所有目标都会受到_%1$d-%2$d_点伤害，而亡灵或恶魔敌人还会额外受到50%%_点圣光伤害。
items.bombs.holybomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.holybomb.name=圣弹
items.bombs.noisemaker.desc=这枚特制炸弹的引信耗尽时会反复发出噪音。当有物体触碰到炸弹时，它会爆炸，并对2格范围内的所有物体造成_%1$d-%2$d点伤害_！
items.bombs.noisemaker.desc_burning=这个发出噪音的装置正在滴答作响，当有东西靠近时它就会爆炸！
items.bombs.noisemaker.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.noisemaker.name=噪音制造器
items.bombs.regrowthbomb.desc=这枚特制炸弹不会爆炸，而是会在周围三格范围内喷洒生命之液。爆炸区域会迅速长出青草和植物。你和所有被爆炸波及的盟友都会获得如同饮用治疗药水般的生命值恢复。
items.bombs.regrowthbomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.regrowthbomb.name=再生炸弹
items.bombs.shrapnelbomb.desc=这枚炸弹经过改造，加入了DM-300的金属碎片，爆炸时碎片会四处飞溅，对炸弹周围大范围内的敌人造成_%1$d-%2$d点伤害_。使用时最好找个掩体躲起来……
items.bombs.shrapnelbomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.shrapnelbomb.name=弹片炸弹
items.bombs.smokebomb.desc=这枚炸弹经过改造，爆炸的同时会喷出一团浓厚的气体云。它会造成_%1$d-%2$d点伤害_，并在2格范围内散布迷雾。
items.bombs.smokebomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.smokebomb.name=烟雾弹
items.bombs.woollybomb.desc=这枚特制炸弹爆炸后会生成一大片魔法绵羊。爆炸会对周围两格内的所有目标造成_%1$d-%2$d点伤害_。这些绵羊会阻挡移动，并且持续存在很长时间！不过，如果遇到强大的敌人，绵羊的持续时间会缩短，而且可以通过与敌人互动来更快地驱散它们。
items.bombs.woollybomb.discover_hint=你可以通过炼金术制作这个物品。
items.bombs.woollybomb.name=毛绒炸弹
items.brokenseal$warriorshield.desc_active=战士破碎的封印目前正帮助他坚持下去，除了生命值之外，还能为他提供护盾。护盾初始触发后会有一段冷却时间，之后才能再次使用。此护盾不会随时间衰减，但如果附近几个回合内没有敌人，护盾就会消失。护盾消失时，任何未使用的护盾值都会减少冷却时间，最多可减少 50 回合。剩余护盾值：当前冷却时间：
items.brokenseal$warriorshield.desc_cooldown=战士最近因封印破损而获得了护盾，必须等待一段时间才能再次受益于其护盾效果。剩余回合数：\n\n。
items.brokenseal$warriorshield.desc_negative_cooldown=战士的护盾冷却时间目前为负值，这意味着当他的护盾激活时，冷却时间将低于通常的 150 回合。护盾冷却时间可以减少到最低 -150 回合，这意味着一旦激活，护盾将立即再次可用。当前冷却时间：%d。
items.brokenseal$warriorshield.name=战士之盾
items.brokenseal.ac_affix=词缀
items.brokenseal.affix=你将封印贴在你的盔甲上！
items.brokenseal.choose_desc=这件盔甲和破损的封印都带有符文。请选择保留哪个符文。盔甲符文：\n\n破损封印符文：%2$s\n\n请注意，如果您选择盔甲上当前的符文，封印之后将无法转移该符文。
items.brokenseal.choose_title=选择一个字形
items.brokenseal.cursed_armor=该封印对诅咒盔甲无效。
items.brokenseal.desc=一枚蜡封，作为英勇的象征，被贴在盔甲上。蜡封中央刻着褪色的保护符文，中间裂开成两半。这枚来自家乡的印记，能帮助战士坚持不懈。佩戴此印记的战士，在生命值即将降至一半或以下时，会立即获得护盾。此印记可以贴在盔甲上，并且可以在不同盔甲之间转移。它还可以携带一项升级，前提是该升级是在印记贴附于盔甲期间应用的。
items.brokenseal.discover_hint=其中一位英雄初始就拥有这件物品。
items.brokenseal.inscribed=印章上刻有_%s。_
items.brokenseal.name=封条破损
items.brokenseal.prompt=选择一件盔甲
items.brokenseal.unknown_armor=你首先必须确定那件盔甲是否被诅咒了。
items.dewdrop.already_full=你目前健康状况完全正常。
items.dewdrop.desc=晶莹剔透的露珠。由于此地的神奇力量，纯净水具有轻微的疗愈功效。
items.dewdrop.name=露珠
items.dewvial.ac_drink=饮用
items.dewvial.auto_drink=你喝光了瓶中的露水，治好了伤口。
items.dewvial.collected=你将一滴露水收集到了露水瓶中。
items.dewvial.desc=这个小瓶子可以储存多余的露水，留着以后饮用。瓶子装满后，若你濒临死亡，就会自动喝下其中的露水。
items.dewvial.empty=你的露水瓶空了！
items.dewvial.full=你的露水瓶满了！
items.dewvial.name=露水瓶
items.energycrystal.desc=一堆充满炼金能量的小型魔法水晶。这些水晶是炼金配方中最常见的原料，可以通过在炼金锅中分解消耗品来获得。
items.energycrystal.name=能量晶体
items.equipableitem.ac_equip=装备
items.equipableitem.ac_unequip=取消装备
items.equipableitem.curse_detected=就在你装备这件物品之前，你感觉到它被诅咒了！
items.equipableitem.unequip_cursed=你无法移除被诅咒的物品！
items.food.berry.desc=女猎手在地牢的植物丛中发现了这种小浆果。它可以快速食用，恢复少量饱腹感，而且可能含有可用的种子！
items.food.berry.discover_hint=你可以通过特定的英雄天赋找到这件物品。
items.food.berry.eat_msg=那颗浆果真好吃！
items.food.berry.name=地牢浆果
items.food.blandfruit$chunks.desc=这种味道寡淡的水果在撞击后爆炸，留下了一堆块状物。尽管沾了一些泥土，但这些煮熟的味道寡淡的水果大块看起来完全可以食用。
items.food.blandfruit$chunks.name=淡味水果块
items.food.blandfruit.blindfruit=盲果
items.food.blandfruit.cooked=煮熟的淡味水果
items.food.blandfruit.desc=太干太淡了，或许加点别的食材炖一下会好一些。
items.food.blandfruit.desc_cooked=果实浸泡在锅里一段时间后变得饱满多汁，甚至吸收了与之一起烹煮的种子的成分。它将具有与种子对应的药剂的功效。
items.food.blandfruit.desc_eat=它看起来好像已经可以吃了！
items.food.blandfruit.desc_throw=它看起来非常不稳定，最好把它扔掉。
items.food.blandfruit.dreamfruit=魔芋
items.food.blandfruit.earthfruit=土果
items.food.blandfruit.fadefruit=褪色果实
items.food.blandfruit.firefruit=火果
items.food.blandfruit.icefruit=冰果
items.food.blandfruit.name=淡果
items.food.blandfruit.raw=你无法忍受生吃它。
items.food.blandfruit.rotfruit=烂果
items.food.blandfruit.sorrowfruit=悲伤果
items.food.blandfruit.starfruit=杨桃
items.food.blandfruit.stormfruit=风暴果
items.food.blandfruit.sunfruit=太阳果
items.food.blandfruit.swiftfruit=迅捷果
items.food.chargrilledmeat.desc=看起来像是一块不错的牛排。
items.food.chargrilledmeat.discover_hint=你可以用另一种食物来制作这道菜。
items.food.chargrilledmeat.name=炭烤肉
items.food.food.ac_eat=吃
items.food.food.desc=这里没什么特别的：肉干、一些饼干——诸如此类的东西。
items.food.food.eat_msg=那食物味道真好！
items.food.food.name=食物配给
items.food.frozencarpaccio.better=你感觉好多了！
items.food.frozencarpaccio.desc=这是一块冷冻生肉。唯一的食用方法是切成薄片。而这样吃起来却出奇地好吃。
items.food.frozencarpaccio.discover_hint=你可以用另一种食物来制作这道菜。
items.food.frozencarpaccio.hard=你感觉皮肤变硬了！
items.food.frozencarpaccio.invis=你看到你的双手消失了！
items.food.frozencarpaccio.name=冷冻生牛肉片
items.food.frozencarpaccio.refresh=清爽！
items.food.meatpie.desc=美味的馅饼，里面塞满了鲜嫩的肉馅。这道菜比任何其他食物都更能让你感到满足。
items.food.meatpie.discover_hint=你可以通过炼金术制作这个物品。
items.food.meatpie.eat_msg=那食物太棒了！
items.food.meatpie.name=肉饼
items.food.mysterymeat$placeholder.name=肉
items.food.mysterymeat.desc=后果自负！
items.food.mysterymeat.discover_hint=你可以从某些敌人身上掉落此物品。
items.food.mysterymeat.eat_msg=那食物的味道……很奇怪。
items.food.mysterymeat.hot=哦，好热！
items.food.mysterymeat.legs=你感觉不到你的腿了！
items.food.mysterymeat.name=神秘肉
items.food.mysterymeat.not_well=你感觉不太舒服。
items.food.mysterymeat.stuffed=你吃饱了。
items.food.pasty$fishleftover.desc=这是你上一餐剩下的一些鱼。你可以随时吃掉它来补充一些饥饿感。
items.food.pasty$fishleftover.eat_msg=那食物味道还可以。
items.food.pasty$fishleftover.name=鱼的剩菜
items.food.pasty.amulet_desc=你终于找到了，神奇的护身符——等等，这只是一块用锡纸包裹的巧克力，看起来像护身符！它不会赋予你无限的力量，但至少可以填饱肚子，并给你一点神器能量。愚人节快乐！
items.food.pasty.amulet_name=延多尔护身符？
items.food.pasty.cane_desc=一根巨大的、甜腻腻的拐杖糖。它大到可以让你吃饱，而且糖分可能还会给你的魔杖增加一点点能量。节日快乐！
items.food.pasty.cane_name=拐杖糖
items.food.pasty.desc=正宗的康沃尔馅饼，馅料是传统的牛肉土豆馅。美味！
items.food.pasty.egg_desc=一个巨大的巧克力蛋，用彩色的黄色锡纸包裹着。这里面的巧克力足够让你吃饱，糖分或许还能给你的神器增添一点额外的能量。复活节快乐！
items.food.pasty.egg_name=复活节彩蛋
items.food.pasty.fish_desc=一条完整的清蒸鱼，神奇地保存在绿叶蔬菜上。每年这个时候，人们都会留一些鱼过年吃，这样你就可以留一些剩菜，而不是一次吃完。新年快乐！
items.food.pasty.fish_name=清蒸鱼
items.food.pasty.name=糊状物
items.food.pasty.pie_desc=一大块南瓜派。它香甜微辣的味道会让你饱腹，还能给你带来一丝慰藉。万圣节快乐！
items.food.pasty.pie_name=南瓜派
items.food.pasty.rainbow_desc=这种色彩缤纷的药水是一种液态食物。除了能满足你的饥饿感之外，它还蕴含着一点魔法，可以安抚附近非首领敌人，使其暂时不愿与你战斗。\n\n骄傲月快乐！
items.food.pasty.rainbow_name=彩虹药水
items.food.pasty.sparkling_desc=这种闪闪发光的饮品是一种液态食物。它能满足饥饿感，模拟起泡酒的口感，但实际上并不含酒精。喝下去后，腹部会感到温暖，给你带来一丝慰藉。新年快乐！
items.food.pasty.sparkling_name=闪亮药水
items.food.pasty.vanilla_desc=这块巨大的香草蛋糕上撒满了彩色糖屑，并淋上了蓝色糖霜。这款蛋糕是为了庆祝多年的游戏经验而制作的，吃掉它，你也能获得一些游戏经验。\n\n初代《像素地牢》于2012年12月4日首次发布。祝《像素地牢》生日快乐！
items.food.pasty.vanilla_name=蓝色蛋糕
items.food.phantommeat.desc=一块晶莹剔透、闪闪发光的大牛排，取自幽灵食人鱼。这种神奇的肉无需烹饪，除了能让你完全饱腹之外，还能提供诸多防御增益。食用后，你将获得隐身术、树皮术、一些治疗效果，并能治愈许多有害的负面状态。
items.food.phantommeat.discover_hint=你可以从某些敌人身上掉落此物品。
items.food.phantommeat.name=幻影肉
items.food.smallration.desc=它看起来和标准口粮一模一样，只是份量更小。
items.food.smallration.discover_hint=你可以在商店里买到这个商品。
items.food.smallration.eat_msg=那食物味道还可以。
items.food.smallration.name=少量食物配给
items.food.stewedmeat.desc=炖煮已经清除了肉中的所有疾病和寄生虫，可以安全食用。
items.food.stewedmeat.discover_hint=你可以通过炼金术制作这个物品。
items.food.stewedmeat.eat_msg=那食物味道还可以。
items.food.stewedmeat.name=把子肉
items.food.supplyration.desc=这份口粮是盗贼公会成员留在地牢里的，也是为他们准备的。它专为边走边吃而设计，有助于进行各种阴谋诡计。虽然它不像普通口粮那样饱腹，但它可以快速食用，提供少量直接治疗，并能恢复盗贼暗影斗篷的充能。
items.food.supplyration.discover_hint=你可以通过特定的英雄天赋找到这件物品。
items.food.supplyration.name=供应配给
items.gold.desc=一堆金币。收集金币，以便之后在商店里消费。
items.gold.name=金子
items.heap.artifact=一件文物
items.heap.chest=胸部
items.heap.chest_desc=不打开你永远不会知道里面是什么！
items.heap.crystal_chest=水晶箱
items.heap.crystal_chest_desc=你可以看到里面有 _%s_，但是要打开宝箱，你需要一把水晶钥匙。
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=上锁的箱子
items.heap.locked_chest_desc=不打开它你永远不会知道里面是什么！但要打开它，你需要一把金钥匙。
items.heap.remains=英雄遗骸
items.heap.remains_desc=这是你前任留下的全部遗物。或许值得看看里面有没有什么值钱的东西。
items.heap.ring=一枚戒指
items.heap.skeleton=骨骼遗骸
items.heap.skeleton_desc=这就是某个不幸的冒险者留下的全部遗物。或许值得搜查一下里面有没有什么值钱的东西。
items.heap.tomb=墓
items.heap.tomb_desc=这座古墓里可能藏有有用的东西，但它的主人肯定会反对你去查看。
items.heap.wand=魔杖
items.honeypot$shatteredpot.desc=花盆已经破碎，只有粘在盆壁上的黏稠蜂蜜勉强维持着它的完整性，但它正在慢慢散架。尽管花盆已经破碎，蜜蜂似乎仍然想要保护它。
items.honeypot$shatteredpot.name=破碎的蜜罐
items.honeypot.ac_shatter=破碎
items.honeypot.desc=这个巨大的蜜罐里其实只装了蜂蜜，里面竟然住着一只巨型蜜蜂！这种体型庞大的蜜蜂通常都待在蜂巢里，或许这个罐子是某种特制的捕蜂笼？蜜蜂在罐子里享用着蜂蜜，看起来十分惬意，当你注视它时，它会警惕地嗡嗡叫着。
items.honeypot.name=蜜罐
items.item.ac_drop=降低
items.item.ac_throw=扔
items.item.curse=诅咒
items.item.custom_note=此物品有自定义备注：“_%s_”
items.item.custom_note_type=此类商品带有自定义备注：“_%s_”
items.item.discover_hint=你可以在地牢中随机找到这件物品。
items.item.prompt=选择投掷方向
items.item.rankings_desc=被 %s 杀死
items.journal.alchemypage.desc=一张撕下来的炼金术指南书页。大部分文字太小，远距离难以辨认，但可以辨认出页面标题。
items.journal.alchemypage.name=撕碎的炼金术书页
items.journal.documentpage.desc=一张孤零零的纸页，可能是从某本书上撕下来的。你需要把它捡起来才能阅读。
items.journal.documentpage.name=撕破的页面
items.journal.guidebook.desc=这是一本冒险者指南，一位最终决定放弃冒险的人把它留在了这里！这本书很神奇，能在关键时刻提醒冒险者翻开其中一页。尽管它有这种神奇的功能，但这本书最受欢迎的原因还是封面上用醒目的大字写着的“别慌！”
items.journal.guidebook.hint_desktop=您的旅行指南里有建议！点击右上角闪烁的日志按钮（%s）即可阅读。
items.journal.guidebook.hint_mobile=您的旅行指南里有建议！点击右上角闪烁的日志按钮即可阅读。
items.journal.guidebook.hint_status=指南
items.journal.guidebook.name=地下城精通之书
items.journal.guidepage.desc=一本冒险指南撕下的一页。大部分文字太小，远距离难以辨认，但可以辨认出页面标题。
items.journal.guidepage.name=撕破的旅行指南页
items.journal.regionlorepage$caves.desc=这是一份看似探险家航海日志的记录，保存得相当完好，尽管年代久远。拿起来读一读吧。
items.journal.regionlorepage$caves.name=旧日志条目
items.journal.regionlorepage$city.desc=一块锈迹斑斑的小金属板，上面神奇地刻着一段信息。尽管年代久远，上面的字迹依然清晰，但你必须拿起它才能阅读。
items.journal.regionlorepage$city.name=生锈的石板
items.journal.regionlorepage$halls.desc=一块黑色小平板，上面刻着闪着绿光的字母。从远处看，这些闪闪发光的字母模糊成一片，需要拿起来才能看清。
items.journal.regionlorepage$halls.name=发光平板电脑
items.journal.regionlorepage$prison.desc=一张写在旧纸上的日记或其他记录。它似乎比你在下水道里找到的信件保存得更好，但你仍然需要把它捡起来才能阅读。
items.journal.regionlorepage$prison.name=磨损的日记条目
items.journal.regionlorepage$sewers.desc=看起来像是一封信，写在一张沾满泥土的纸上。你需要把它捡起来才能看清上面写的是什么。
items.journal.regionlorepage$sewers.name=磨损的字母
items.keys.crystalkey.desc=这把水晶钥匙的切割面在黑暗中闪闪发光。或许它能打开什么水晶制品？
items.keys.crystalkey.name=水晶钥匙
items.keys.goldenkey.desc=这把金钥匙上的凹槽细小而复杂。或许它能打开一个上锁的箱子？
items.keys.goldenkey.name=金钥匙
items.keys.ironkey.desc=这把古老的铁钥匙上的凹槽已经磨损严重；它的皮质挂绳也因年代久远而破旧不堪。它能打开哪扇门呢？
items.keys.ironkey.name=铁钥匙
items.keys.skeletonkey.name=万能钥匙
items.keys.wornkey.desc=这把钥匙虽然磨损褪色，但看起来很结实。说不定能打开附近某扇很重要的门。
items.keys.wornkey.name=磨损的钥匙
items.kindofmisc.unequip_message=您必须先卸下其中一件物品。选择一件物品进行交换。
items.kindofmisc.unequip_title=卸下一件物品
items.kindofweapon.empty=空的
items.kindofweapon.equip_cursed=你不由自主地握紧了武器。
items.kindofweapon.swift_equip=你迅速装备好武器。
items.kindofweapon.which_equip_msg=你想把这件物品装备到哪个武器栏位？\n\n该英雄直接使用主武器攻击，但可以使用两把武器的技能。两把武器共享相同的充能次数。\n\n该英雄还可以瞬间切换主武器和副武器。
items.kindofweapon.which_equip_primary=主要 (%s)
items.kindofweapon.which_equip_secondary=二级 (%s)
items.kingscrown.ac_wear=穿
items.kingscrown.desc=这是最后一位矮人国王的王冠，它散发着强大的魔法能量。佩戴后，王冠的魔法会注入你当前穿着的盔甲，将其转化为一件拥有特殊能力的独一无二的史诗级盔甲。新的盔甲将保留原盔甲的所有属性。
items.kingscrown.discover_hint=你可以从某些敌人身上掉落此物品。
items.kingscrown.naked=可惜的是，皇冠并不能改变你的内衣。
items.kingscrown.name=矮人王的王冠
items.kingscrown.ratgraded=鼠王的爪子发出耀眼的光芒，你的盔甲也随之变形！
items.kingscrown.upgraded=王冠发出耀眼的光芒，然后随着你的盔甲变形而消散！
items.liquidmetal.ac_apply=申请
items.liquidmetal.already_fixed=那件投掷武器已经完好无损了！
items.liquidmetal.apply=你使用 %d 液态金属来修复你的投掷武器。
items.liquidmetal.desc=这种神奇的液体可以填补投掷武器上的裂缝和破损，使其恢复完美状态！如果一套武器缺少一件，但其他部分都已修复，那么液态金属甚至可以用来替换缺失的武器！1级武器完全修复需要10个液态金属，5级武器需要30个。每次升级都会使所需的液态金属量增加35%。液态金属不能用于修复飞镖的镖尖。
items.liquidmetal.discover_hint=你可以通过炼金术制作这个物品。
items.liquidmetal.name=液态金属
items.liquidmetal.prompt=选择投掷武器
items.lostbackpack.desc=这是你丢失的物品清单。收集它们即可找回所有丢失的物品！
items.lostbackpack.name=背包丢失了
items.merchantsbeacon.ac_use=使用
items.merchantsbeacon.desc=这件奇特的矮人科技制品能让你远距离通讯。激活后，这个信标能让你在地牢的任何地方向像素商店出售物品。然而，信标中的魔法只能持续一个游戏回合，所以要谨慎使用。
items.merchantsbeacon.name=商人的灯塔
items.potions.brews.aquabrew.desc=这种药剂破碎后，会在其所在位置释放出一股高压水流。水流威力仅足以伤害火焰敌人，但也会将水扩散到附近地形，解除陷阱，扑灭火焰，并将附近的敌人击退。
items.potions.brews.aquabrew.name=水酿
items.potions.brews.blizzardbrew.desc=这种酒瓶破碎后会释放出一阵旋风般的暴风雪，并像气体一样迅速蔓延。
items.potions.brews.blizzardbrew.name=暴雪酿造
items.potions.brews.brew.discover_hint=你可以通过炼金术制作这个物品。
items.potions.brews.causticbrew.desc=这种药剂破碎后会在周围大片区域内扩散腐蚀性粘液。任何被粘液沾染的物体，如果不能用水冲洗干净，都会慢慢融化。
items.potions.brews.causticbrew.name=腐蚀性药剂
items.potions.brews.infernalbrew.desc=这种酒一旦破碎，就会释放出熊熊烈火，并像气体一样迅速蔓延。
items.potions.brews.infernalbrew.name=地狱佳酿
items.potions.brews.shockingbrew.desc=这种酒瓶破碎时，会在破碎位置周围的大片区域引发雷暴。
items.potions.brews.shockingbrew.name=令人震惊的酿造
items.potions.brews.unstablebrew.desc=这瓶神奇的药剂会发出变幻莫测的彩虹光芒。饮用或投掷后，它会触发一种随机药剂的效果。饮用后，药剂效果总是有益的；投掷后，药剂效果总是有害的。
items.potions.brews.unstablebrew.name=不稳定的酿造
items.potions.elixirs.elixir.discover_hint=你可以通过炼金术制作这个物品。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=你暂时获得了类似粘液的恢复能力。站在水中时，你每回合都会恢复少量生命值。当你的生命值全满或离开水面时，此效果暂停。剩余生命值：
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=水疗法
items.potions.elixirs.elixirofaquaticrejuvenation.desc=这种药剂含有残留的粘液，并添加了治疗药水。虽然它不能立即恢复生命值，但当你站在水中时，它会持续恢复更多生命值。
items.potions.elixirs.elixirofaquaticrejuvenation.name=水生复原灵药
items.potions.elixirs.elixirofarcanearmor.desc=这种药剂能使饮用者获得持久的魔法伤害抵抗力。
items.potions.elixirs.elixirofarcanearmor.name=奥术护甲药剂
items.potions.elixirs.elixirofdragonsblood.desc=饮用此药剂后，炽热的力量将涌遍饮用者的血管。此效果将使饮用者免疫火焰伤害，并使其能够通过物理攻击点燃敌人。
items.potions.elixirs.elixirofdragonsblood.name=龙血药剂
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=你处于羽落药剂的效果之下，可以落入深渊而不会受到伤害！剩余回合数：\n\n。
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=羽毛落下
items.potions.elixirs.elixiroffeatherfall.desc=这种药剂能产生较弱但更可控的悬浮效果，使饮用者能够在短时间内从很高的地方坠落而不会受到伤害。
items.potions.elixirs.elixiroffeatherfall.light=你感觉轻如鸿毛！
items.potions.elixirs.elixiroffeatherfall.name=羽毛坠落的灵药
items.potions.elixirs.elixirofhoneyedhealing.desc=这种药剂结合了治愈能力和蜂蜜的甜美。饮用后，它能达到与治疗药水相同的效果，并能少量缓解饥饿感；它也可以投掷出去治疗盟友。对嗜蜜的生物使用此物品可能会使其平静下来。
items.potions.elixirs.elixirofhoneyedhealing.name=蜂蜜疗愈灵药
items.potions.elixirs.elixiroficytouch.desc=服用此药剂后，饮用者可以吸取攻击敌人的热量。此效果会使饮用者免疫寒冷，并能通过物理攻击使敌人降温。
items.potions.elixirs.elixiroficytouch.name=冰触灵药
items.potions.elixirs.elixirofmight$htboost.desc=你的身体感觉异常强壮健康。你的最大生命值会在一段时间内大幅提升。随着等级提升，提升效果会逐渐减弱。当前提升数值：剩余等级：
items.potions.elixirs.elixirofmight$htboost.name=最大生命值提升
items.potions.elixirs.elixirofmight.desc=这种强效液体会流遍你的肌肉，永久提升你的力量值1点，并暂时提升你的最大生命值%d点。生命值提升效果与你的最大生命值成正比，但会随着等级提升而逐渐消失。
items.potions.elixirs.elixirofmight.msg=新的力量涌遍全身，你现在拥有了%d的力量！
items.potions.elixirs.elixirofmight.name=力量灵药
items.potions.elixirs.elixiroftoxicessence.desc=服用此药剂后，饮用者将获得毒性能量。饮用者移动时会持续散发毒气，并且在药剂效果持续时间略长于其作用持续时间后，将免疫毒气和毒素。
items.potions.elixirs.elixiroftoxicessence.name=毒液精华
items.potions.exotic.exoticpotion.amber=异域琥珀药剂
items.potions.exotic.exoticpotion.azure=异域蔚蓝药剂
items.potions.exotic.exoticpotion.bistre=异域苦酒药剂
items.potions.exotic.exoticpotion.charcoal=异域木炭药剂
items.potions.exotic.exoticpotion.crimson=异域深红药剂
items.potions.exotic.exoticpotion.discover_hint=你可以通过炼金术制作这个物品。
items.potions.exotic.exoticpotion.golden=异域黄金药水
items.potions.exotic.exoticpotion.indigo=异域靛蓝药剂
items.potions.exotic.exoticpotion.ivory=异域象牙药剂
items.potions.exotic.exoticpotion.jade=异域玉药水
items.potions.exotic.exoticpotion.magenta=异域洋红色药水
items.potions.exotic.exoticpotion.no=不，我改变主意了。
items.potions.exotic.exoticpotion.silver=异域银药剂
items.potions.exotic.exoticpotion.turquoise=异域绿松石药水
items.potions.exotic.exoticpotion.unknown_desc=这个圆形的烧瓶里装着一种颗粒状的彩色液体。它似乎来自外地，谁知道喝下去或者扔掉之后会发生什么呢？
items.potions.exotic.exoticpotion.warning=你真的要取消这次药水的使用吗？反正它最终都会被消耗掉。
items.potions.exotic.exoticpotion.yes=是的，我肯定
items.potions.exotic.potionofcleansing$cleanse.desc=该角色暂时免疫所有有害状态效果！剩余回合数：\n\n。
items.potions.exotic.potionofcleansing$cleanse.name=已清洗
items.potions.exotic.potionofcleansing.desc=这种强效试剂饮用后，可使饮用者在几个回合内免疫所有有害状态效果。它也可以投掷到目标身上进行净化。
items.potions.exotic.potionofcleansing.name=净化药剂
items.potions.exotic.potionofcorrosivegas.desc=打开或打碎这个加压玻璃瓶会导致瓶内液体爆炸，喷出致命的腐蚀性锈色气体。这种气体扩散速度比有毒气体更快，毒性也更强，但持续时间更短。
items.potions.exotic.potionofcorrosivegas.name=腐蚀性气体
items.potions.exotic.potionofdivineinspiration.bonus=+2 天赋点数！
items.potions.exotic.potionofdivineinspiration.desc=此药水将神圣能量浓缩成液体，饮用者将获得神圣力量，并可在其选择的天赋等级中获得两个额外天赋点数。每个天赋等级只能使用一次此药水。
items.potions.exotic.potionofdivineinspiration.name=神圣灵感的药剂
items.potions.exotic.potionofdivineinspiration.no_more_points=你不能再获得任何额外的天赋点数了。
items.potions.exotic.potionofdivineinspiration.select_tier=选择一个天赋等级即可获得两个奖励点数。您必须先解锁该等级才能使用这些点数。
items.potions.exotic.potionofdragonsbreath.desc=这个烧瓶里装着一种不寻常的化合物，它与唾液混合后会立即燃烧。快速吐出瓶中的液体，使用者就能从口中喷出火焰！
items.potions.exotic.potionofdragonsbreath.name=龙息药剂
items.potions.exotic.potionofdragonsbreath.prompt=选择一个地点进行焚烧
items.potions.exotic.potionofearthenarmor.desc=这种液体不会使皮肤麻痹，反而会使皮肤硬化，使其暂时变成天然盔甲。
items.potions.exotic.potionofearthenarmor.name=土之铠甲药剂
items.potions.exotic.potionofmagicalsight.desc=喝下这瓶酒后，你的感官会短暂地增强到难以置信的程度，让你能够看穿半径 12 格范围内的墙壁！
items.potions.exotic.potionofmagicalsight.name=魔法视力药水
items.potions.exotic.potionofmastery.armor_easier=你的盔甲穿起来更轻松了！
items.potions.exotic.potionofmastery.desc=这种药剂不会直接赋予使用者力量，而是使使用者的肌肉与特定物品相匹配。这会使该物品更容易使用，如同饮用者已经练习过并形成了肌肉记忆一般。所选武器或盔甲的使用所需力量将减少2点。每种物品只能使用一次此药剂。
items.potions.exotic.potionofmastery.name=精通药剂
items.potions.exotic.potionofmastery.prompt=精通一件物品
items.potions.exotic.potionofmastery.weapon_easier=你的武器更容易使用了！
items.potions.exotic.potionofshielding.desc=这种药水不会治愈伤势，而是会在使用者身体周围形成一个坚固的护盾，抵挡相当一部分伤害。
items.potions.exotic.potionofshielding.name=护盾药水
items.potions.exotic.potionofshroudingfog.desc=当暴露在空气中时，这个烧瓶中的液体会产生浓厚的烟雾，迅速扩散并阻挡敌人的视线。
items.potions.exotic.potionofshroudingfog.name=迷雾药剂
items.potions.exotic.potionofsnapfreeze.desc=这种药剂中所含的化学物质会迅速与空气发生反应，瞬间冻结并固定其作用范围内的所有物体。
items.potions.exotic.potionofsnapfreeze.name=速冻药水
items.potions.exotic.potionofstamina.desc=饮用这种味道奇特的甜液体，可以让你获得持久的能量提升，使你能够以更快的速度长时间奔跑。
items.potions.exotic.potionofstamina.name=耐力药水
items.potions.exotic.potionofstormclouds.desc=投掷此药剂会产生一团迅速扩散的浓缩蒸汽云，蒸汽凝结后倾泻而下。大部分地形将变为水，火焰敌人会受到伤害，火焰会被扑灭，陷阱也会被冲破。
items.potions.exotic.potionofstormclouds.name=暴风云药剂
items.potions.potion$placeholder.name=药水
items.potions.potion$seedtopotion.name=随机药水
items.potions.potion.ac_drink=饮用
items.potions.potion.amber=琥珀药水
items.potions.potion.azure=天青药水
items.potions.potion.beneficial=有益药剂
items.potions.potion.bistre=苦艾药剂
items.potions.potion.charcoal=木炭药剂
items.potions.potion.crimson=深红药剂
items.potions.potion.discover_hint=你可以在地牢中随机找到这件物品，或者通过炼金术制作它。
items.potions.potion.golden=黄金药水
items.potions.potion.harmful=有害药水！
items.potions.potion.indigo=靛蓝药水
items.potions.potion.ivory=象牙药水
items.potions.potion.jade=玉药水
items.potions.potion.magenta=品红色药水
items.potions.potion.no=不，我改变主意了。
items.potions.potion.shatter=烧瓶破碎，液体溅出，但无害。
items.potions.potion.silver=银色药水
items.potions.potion.sure_drink=你确定要喝吗？大多数情况下，你应该把这种药水扔向你的敌人。
items.potions.potion.sure_throw=你确定要扔掉它吗？大多数情况下，喝掉它才是明智之举。
items.potions.potion.turquoise=绿松石药水
items.potions.potion.unknown_desc=这只小瓶里翻涌着%s的液体。谁知道喝下或扔出它会发生什么？
items.potions.potion.yes=是的，我知道自己在做什么。
items.potions.potionofexperience.desc=这款药剂凝聚了无数战役的传奇经验，能够瞬间提升你的经验等级。
items.potions.potionofexperience.name=经验药剂
items.potions.potionoffrost.desc=这种药剂接触空气后会蒸发成冰冷的云雾。碰到云雾的生物会冻在原地，无法行动或移动。
items.potions.potionoffrost.name=冰霜药剂
items.potions.potionofhaste.desc=喝下这种味道奇甜的液体，会在短时间内给你带来巨大的能量，让你能够高速奔跑。
items.potions.potionofhaste.energetic=你感觉精力充沛！
items.potions.potionofhaste.name=加速药水
items.potions.potionofhealing.desc=能立刻恢复全部生命并解除中毒的灵药。
items.potions.potionofhealing.heal=你的伤口开始愈合。
items.potions.potionofhealing.name=治疗药水
items.potions.potionofinvisibility.desc=喝下这瓶药水能让你暂时隐形，敌人将无法看见你。攻击敌人，或在敌人眼前使用法杖或卷轴，都会解除效果。
items.potions.potionofinvisibility.invisible=你看到你的双手消失了！
items.potions.potionofinvisibility.name=隐形药水
items.potions.potionoflevitation.desc=喝下这种奇妙的液体后，你会浮在空中，轻松越过陷阱。不过，火焰和气体也会充斥空气，不能靠漂浮避开。
items.potions.potionoflevitation.float=你飘到空中了！
items.potions.potionoflevitation.name=悬浮药水
items.potions.potionofliquidflame.desc=这个烧瓶里装着一种不稳定的化合物，一旦暴露在空气中就会剧烈燃烧。
items.potions.potionofliquidflame.name=液态火焰药剂
items.potions.potionofmindvision.desc=喝下此药后，你的意识将与远处生物的灵能信号相协调，使你能够隔墙感知生物的存在。此外，此药还能让你看穿附近的墙壁和门。
items.potions.potionofmindvision.name=灵视药剂
items.potions.potionofmindvision.see_mobs=你似乎能感受到其他生物的意识存在！
items.potions.potionofmindvision.see_none=你会隐约感觉到，此刻在这个层面上，你是孤身一人。
items.potions.potionofparalyticgas.desc=暴露在空气中后，此瓶中的液体会汽化成令人麻痹的黄色烟雾。任何吸入这种烟雾的人都会立即麻痹，即使烟雾消散后也会有一段时间无法动弹。此物品可以投掷向远处的敌人，使其受到烟雾的影响。
items.potions.potionofparalyticgas.name=麻痹气体药剂
items.potions.potionofpurity.desc=这种药剂能迅速中和范围内的所有有害气体。喝下它，还能暂时免受这些气体的影响。
items.potions.potionofpurity.freshness=你感到空气异常清新。
items.potions.potionofpurity.name=净化药水
items.potions.potionofpurity.protected=一层保护膜包裹着你！
items.potions.potionofstrength.desc=这种强效液体会流遍你的肌肉，永久性地增强你的力量1点。
items.potions.potionofstrength.msg=新的力量涌遍全身，你现在拥有了%d的力量！
items.potions.potionofstrength.name=力量药剂
items.potions.potionoftoxicgas.desc=打开或打碎这个加压玻璃瓶会导致里面的东西爆炸，喷出一团致命的绿色毒气。你可以选择把这瓶药水扔向远处的敌人，而不是用手打开它。
items.potions.potionoftoxicgas.name=毒气药剂
items.quest.ceremonialcandle.desc=一组蜡烛，因使用而熔化并融合在一起。单独使用时它们毫无价值，但与其他蜡烛按一定图案一起使用时，它们可以集中能量用于召唤仪式。
items.quest.ceremonialcandle.discover_hint=你可以在特定任务中找到这件物品。
items.quest.ceremonialcandle.name=仪式蜡烛
items.quest.corpsedust.chill=一股寒意涌上脊背。
items.quest.corpsedust.desc=这团尸尘从外表上看与普通尘球并无二致，但你能感觉到其中潜藏着一股邪恶的能量。尽快清除它或许是个好主意。
items.quest.corpsedust.discover_hint=你可以在特定任务中找到这件物品。
items.quest.corpsedust.name=尸粉
items.quest.darkgold.desc=这种金属被称为“暗金”，不是因为它的颜色（它与普通黄金没有区别），而是因为它在日光下会熔化，因此在表面毫无用处。
items.quest.darkgold.discover_hint=你可以在特定任务中找到这件物品。
items.quest.darkgold.name=黑金矿石
items.quest.darkgold.you_now_have=您现在拥有 %d 深色金矿石。
items.quest.dwarftoken.desc=许多矮人以及他们的一些大型造物都携带着这些用途不明的小金属片。或许是首饰，或许是某种身份标识。矮人真是个奇特的种族。
items.quest.dwarftoken.discover_hint=你可以在特定任务中找到这件物品。
items.quest.dwarftoken.name=矮人代币
items.quest.embers.desc=只能从幼年火元素身上采集到的特殊余烬。它们会散发热能。
items.quest.embers.discover_hint=你可以在特定任务中找到这件物品。
items.quest.embers.name=元素余烬
items.quest.escapecrystal.ac_use=使用
items.quest.escapecrystal.desc=这是一块纤薄的魔法水晶，似乎蕴含着传送魔法。你可以随时使用这块水晶离开矮人宝库，但你无法带走任何东西！
items.quest.escapecrystal.discover_hint=你可以在特定任务中找到这件物品。
items.quest.escapecrystal.name=逃逸水晶
items.quest.gooblob.desc=一团黏糊糊的、软绵绵的物质，从死去的Goo身上分离出来。它几乎就像一大团果冻，不过你肯定不敢吃它。它本身没有任何作用，但或许可以和某些药水或炸弹结合使用。至少它应该能转化为相当可观的能量。
items.quest.gooblob.discover_hint=你可以从某些敌人身上掉落此物品。
items.quest.gooblob.name=一团黏糊糊的东西
items.quest.metalshard.desc=一块锈迹斑斑、诅咒缠身的金属碎片，是DM-300被摧毁时脱落的。你能感觉到其中蕴含着一股沉寂的邪恶魔法。它本身毫无作用，但或许可以与某些卷轴或炸弹结合使用。至少，它应该能转化为相当可观的能量。
items.quest.metalshard.discover_hint=你可以从某些敌人身上掉落此物品。
items.quest.metalshard.name=诅咒金属碎片
items.quest.pickaxe.ability_desc=决斗者可以用镐刺穿敌人。此招必定命中，使敌人陷入3回合的易伤状态，并对拥有坚硬皮肤的敌人造成_%1$d-%2$d点伤害_。
items.quest.pickaxe.ability_name=刺穿
items.quest.pickaxe.desc=这是一把坚固而沉重的碎石工具。虽然不用装备镐子也能用它挖矿，但在紧急情况下它或许可以当作武器使用。
items.quest.pickaxe.discover_hint=你可以在特定任务中找到这件物品。
items.quest.pickaxe.name=镐
items.quest.pickaxe.upgrade_ability_stat_name=技能伤害
items.quest.ratskull.desc=一个出乎意料的大老鼠头骨。如果你有墙可以挂起来，它会是一件很棒的狩猎战利品。
items.quest.ratskull.name=巨鼠头骨
items.remains.bowfragment.desc=这块破碎的木片曾是某个失落的女猎手的灵弓的一部分。你还能感受到碎片中残留的些许自然能量，你可以用它在周围种出一些高草。不过，这样做会摧毁碎片本身。
items.remains.bowfragment.name=弓碎片
items.remains.brokenhilt.desc=这断剑柄看起来像是来自一位战败决斗者的武器。你还能感受到剑柄中残留的一丝武力，你可以用它来为接下来的两次近战攻击造成一些额外伤害。不过，这样做会彻底摧毁剑柄。
items.remains.brokenhilt.name=断柄
items.remains.brokenstaff.desc=这根法杖在主人去世后断成了两截。你仍然可以感受到法杖中残留的魔力，可以用它来稍微增强你的魔杖能量。但是这样做会彻底摧毁法杖。
items.remains.brokenstaff.name=断裂的杖
items.remains.cloakscrap.desc=这块半透明的布料看起来像是来自一位已故盗贼的暗影斗篷。你还能感觉到它残留着一丝神秘能量，可以用它来稍微提升你的神器能量。不过，这样做会破坏这块布料。
items.remains.cloakscrap.name=碎布
items.remains.remainsitem.ac_use=使用
items.remains.remainsitem.discover_hint=你可以在之前某次失败的冒险中某个特定英雄的遗骸中找到这件物品。
items.remains.sealshard.desc=这些细小的红色蜡片看起来像是来自一位阵亡战士的封印。你还能感觉到封印上残留着一丝意志力，你可以用它来给自己提供一些保护。但是这样做会摧毁这些封印碎片。
items.remains.sealshard.name=封印碎片
items.remains.tornpage.desc=这一页看起来像是从一本过期的牧师圣典上撕下来的。上面还残留着一些神圣能量，你可以用它来恢复少量生命值。不过，这样做会毁掉这页撕下来的东西。
items.remains.tornpage.name=撕破的页面
items.rings.ring.agate=玛瑙戒指
items.rings.ring.amethyst=紫水晶戒指
items.rings.ring.curse_known=你能感觉到这枚戒指里潜藏着一股邪恶的魔法。
items.rings.ring.cursed_worn=因为这枚戒指被诅咒了，你无力将其取下。
items.rings.ring.diamond=钻石戒指
items.rings.ring.emerald=祖母绿戒指
items.rings.ring.equip_cursed=戒指勒得手指生疼！
items.rings.ring.garnet=石榴石戒指
items.rings.ring.identify=你现在对自己的戒指已经足够熟悉，可以认出它了。
items.rings.ring.known=这是 %s
items.rings.ring.not_cursed=这枚戒指没有邪恶魔法。
items.rings.ring.onyx=缟玛瑙戒指
