items.artifacts.holytome.desc=一本神圣的典籍，作为牧师神圣魔法的媒介。使用这本典籍可以让牧师施放各种魔法。随着牧师使用次数的增加，典籍的力量会逐渐增强，增加牧师的最大充能次数，并略微提高充能速度。
items.artifacts.holytome.discover_hint=其中一位英雄初始就拥有这件物品。
