items.artifacts.lloydsbeacon.desc=劳埃德的信标是一件精巧的魔法装置，它赋予使用者控制传送魔法的能力。信标可以用来返回指定地点，也可以在装备充能后释放随机的传送魔法。这种魔法可以指向目标，也可以指向使用者自身。
