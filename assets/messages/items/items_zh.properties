items.artifacts.etherealchains.desc=这些粗大却轻盈的锁链散发着灵能的光芒。它们可以用来将你拉向地形，或者将敌人拉向你。这些锁链的虚幻特性甚至使它们能够穿墙而过！
items.artifacts.etherealchains.desc_cursed=诅咒的锁链锁在你的腰间，不停地摆动，试图绊倒你或束缚你。
items.artifacts.etherealchains.desc_equipped=锁链环绕在你身侧，缓缓吸取你击败之人的精神能量。每次充能都相当于锁链上的一个环节，锁链会向外延伸一格。
