items.potions.potion.color_ivory=象牙色
items.rings.ring.gem_tourmaline=碧玺
items.potions.potion.color_amber=琥珀色
items.rings.ring.gem_emerald=祖母绿
items.potions.potion.color_bistre=深褐色
