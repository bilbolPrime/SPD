items.artifacts.hornofplenty.desc=这只号角不能吹响，而是会随着你的冒险和经验积累而逐渐积攒食物。你可以把每次积攒的食物当作零食单独食用，也可以一直吃到饱为止。
items.artifacts.hornofplenty.desc_cursed=那只被诅咒的号角已经与你紧紧相连，它似乎更渴望获取食物而不是创造食物。
items.artifacts.hornofplenty.desc_hint=或许可以通过给角提供食物能量来增强其威力。
