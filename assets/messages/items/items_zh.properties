items.amulet.ac_end=结束游戏
items.amulet.ascent_desc=你开始感受到尤格-泽瓦强大而可怕的力量从护身符中散发出来。以凡人的身份重返地牢可能比你想象的要困难得多！如果你继续带着护身符向上攀登，地牢将变得更加危险，楼层间的传送将被禁用，你只能通过在攀登过程中击败敌人来赢得游戏！如果你想在不进行此挑战的情况下继续攀登，可以暂时将护身符留在这里；或者在攀登之前激活护身符，以正常方式结束游戏。
items.amulet.ascent_no=暂时停止
items.amulet.ascent_title=升天
items.amulet.ascent_yes=继续！
items.amulet.desc=延多护符是人类和矮人已知的最强大的神器。它闪闪发光的晶体蕴含着不可思议的神奇力量。
items.amulet.desc_ascent=这枚护身符的来历不明，但显然受到了尤格·泽瓦力量的强烈影响。随着你在地牢中穿行，地牢似乎也在屈从于尤格的意志，敌人数量和实力都大幅提升！而且，你现在也无法激活或丢弃这枚护身符，仿佛它被诅咒了一般。
items.amulet.desc_origins=这枚护身符的来历无人知晓。史书记载，矮人王曾夸耀自己在矮人文明断绝一切联系前不久发现了这件神器。他是如何找到它的？尤格-泽瓦又是如何从他手中夺走它的？这些问题或许留待以后再问，现在最重要的是，这枚护身符归你所有了！
items.amulet.discover_hint=你可以在地牢底部找到这件物品……
items.amulet.name=延多尔护身符
items.ankh.ac_bless=保佑
items.ankh.bless=你用魔法水祝福生命之符。
items.ankh.desc=这个古老的不朽象征能让人死而复生。复活时，所有未装备的物品都会丢失。
items.ankh.desc_blessed=这个古老的永生象征赋予人死后复生的能力。安卡已被加持，如今更加强大。在危难之际，安卡会牺牲自己来拯救你。
items.ankh.discover_hint=你可以在商店里买到这个商品。
items.ankh.name=安卡
items.arcaneresin.ac_apply=申请
items.arcaneresin.apply=你在魔杖上涂抹树脂，增强它的威力！
items.arcaneresin.desc=这种细粉闪烁着紫白交织的光芒。它可以增强魔法能量，涂抹在魔杖上即可提升魔杖等级！升级魔杖需要消耗1、2或3个树脂，具体数量取决于魔杖的初始等级。树脂最多可将魔杖升级至+3级。然而，树脂升级的效果会被其他升级方式（例如升级卷轴）覆盖，并且在将魔杖附魔到法师法杖时无效。
items.arcaneresin.discover_hint=你可以通过炼金术制作这个物品。
items.arcaneresin.level_too_high=那根魔杖威力太大，树脂无法增强其效果。
items.arcaneresin.name=神秘树脂
items.arcaneresin.not_enough=你的树脂不够用！
items.arcaneresin.prompt=选择一根魔杖
