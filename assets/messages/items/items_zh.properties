items.rings.ring.unknown_desc=这枚金属戒指上嵌着一颗硕大的%s，在黑暗中闪闪发光。谁知道戴上它会有什么效果？
items.rings.ringofaccuracy.combined_stats=你装备的戒指正在结合它们的力量，总共使你的命中率提高_%s%%_。
items.rings.ringofaccuracy.desc=这枚戒指能提高你击中敌人的几率。
items.rings.ringofaccuracy.name=精准之戒
items.rings.ringofaccuracy.stats=佩戴此戒指可提升您的精准度_%s%%。_
items.rings.ringofaccuracy.typical_stats=佩戴此戒指后，您的精准度通常会提高_%s%%。_
items.rings.ringofaccuracy.upgrade_stat_name_1=精准度提升
items.rings.ringofarcana.combined_stats=你装备的戒指正在结合它们的力量，总共使附魔和符文的力量增加_%s%%_。
items.rings.ringofarcana.desc=这枚戒指可以增强武器上的魔法附魔和盔甲上的符文，包括诅咒！它首先提高触发几率，然后在触发几率达到100%时增强效果强度。诅咒戒指则会削弱附魔、符文和诅咒的效果。
items.rings.ringofarcana.name=奥术之戒
items.rings.ringofarcana.stats=佩戴此戒指后，附魔和符文的威力将提升_%s%%。_
items.rings.ringofarcana.typical_stats=佩戴此戒指时，通常会使附魔和符文的威力提升_%s%%。
items.rings.ringofarcana.upgrade_stat_name_1=至宝强化
items.rings.ringofelements.combined_stats=你装备的戒指正在结合它们的力量，总共提供_%s%%_元素抗性。
items.rings.ringofelements.desc=这枚戒指能抵御火焰、电击、气体等元素的伤害，也能缩短负面效果的持续时间。
items.rings.ringofelements.name=元素之戒
items.rings.ringofelements.stats=佩戴此戒指时，将提供_%s%%_元素抵抗力。
items.rings.ringofelements.typical_stats=佩戴此戒指时，通常会提供_%s%%_元素抵抗力。
items.rings.ringofelements.upgrade_stat_name_1=反抗
items.rings.ringofenergy.combined_stats=你装备的戒指正在结合它们的力量，总共将充能速度提高_%s%%_。
items.rings.ringofenergy.desc=在这枚戒指散发的奥术力场中，你的魔法装备会更快地充能。而一枚被诅咒的戒指则会减慢充能速度。
items.rings.ringofenergy.name=能量环
items.rings.ringofenergy.stats=佩戴此戒指后，魔杖、神器和英雄护甲的充能速度将提高_%s%%。_
items.rings.ringofenergy.typical_stats=佩戴此戒指后，通常会使魔杖、神器和英雄护甲的充能速度提高_%s%%。_
items.rings.ringofenergy.upgrade_stat_name_1=充能加速
items.rings.ringofevasion.combined_stats=你装备的戒指正在结合它们的力量，总共使你的闪避能力提高_%s%%_。
items.rings.ringofevasion.desc=这枚戒指能提高你躲开敌人攻击的几率。
items.rings.ringofevasion.name=闪避之戒
items.rings.ringofevasion.stats=佩戴此戒指后，你的闪避率将提高_%s%%。_
items.rings.ringofevasion.typical_stats=佩戴此戒指后，通常会使你的闪避率提高_%s%%。_
items.rings.ringofevasion.upgrade_stat_name_1=回避性能提升
items.rings.ringofforce$brawlersstance.desc=在此姿态下，决斗者的普通攻击即使装备了武器也会使用已装备的力量戒指。这些攻击会获得额外伤害，并且仍然会使用武器的强化和附魔效果。然而，维持此姿态需要专注力，会使武器技能的充能速度降低50%。此姿态可以通过使用力量戒指来切换开启或关闭，但如果快速激活和关闭此姿态，充能速度的降低效果会持续一段时间。
items.rings.ringofforce$brawlersstance.name=斗士的姿态
items.rings.ringofforce.ability_desc=决斗者佩戴此戒指后可进入_斗士姿态_，使其普通攻击始终使用此戒指，即使装备武器亦是如此。这些攻击将造成_%1$d-%2$d点伤害_，并继承武器的附魔和强化效果。此姿态会使武器充能速度降低50%%点。
items.rings.ringofforce.ability_name=斗士的姿态
items.rings.ringofforce.combined_stats=你装备的戒指正在结合它们的力量，在没有武器的情况下造成总共 _%1$d-%2$d 点伤害_，或者在使用武器的情况下增加 _%3$d 点伤害_。
items.rings.ringofforce.desc=这枚戒指能增强佩戴者近战攻击的威力。使用武器时，这种额外力量提升幅度较小，但徒手攻击则会大幅增强。而诅咒戒指则会削弱佩戴者的攻击力。
items.rings.ringofforce.name=力量之环
items.rings.ringofforce.stats=空手时，以你当前的力量值，这枚戒指将造成_%1$d-%2$d点伤害。装备武器后，这枚戒指将增加_%3$d点伤害。
items.rings.ringofforce.typical_ability_desc=决斗者佩戴此戒指后可进入_斗士姿态_，使其普通攻击始终使用此戒指，即使装备武器亦是如此。这些攻击通常会造成_%1$d-%2$d点伤害_，并且会继承武器的附魔和强化效果。此姿态会使武器充能速度降低50%%点。
items.rings.ringofforce.typical_stats=空手时，以你当前的力量值，这枚戒指通常会造成_%1$d-%2$d点伤害。装备武器后，这枚戒指通常会增加_%3$d点伤害。
items.rings.ringofforce.upgrade_stat_name_1=非武装伤害
items.rings.ringofforce.upgrade_stat_name_2=武装伤害提升
items.rings.ringofforce.upgrade_stat_name_3=技能伤害
items.rings.ringoffuror.combined_stats=你装备的戒指正在结合它们的力量，使你的攻击速度总共提高_%s%%_。
items.rings.ringoffuror.desc=这枚戒指能赋予佩戴者内心的狂怒，使其攻击速度更快。而一枚诅咒戒指则会降低佩戴者的攻击速度。
items.rings.ringoffuror.name=狂怒之环
items.rings.ringoffuror.stats=佩戴此戒指后，你的攻击速度将提升_%s%%。
items.rings.ringoffuror.typical_stats=佩戴此戒指后，通常会使你的攻击速度提高_%s%%。
items.rings.ringoffuror.upgrade_stat_name_1=攻击速度提升
items.rings.ringofhaste.combined_stats=你装备的戒指正在结合它们的力量，总共使你的移动速度提高_%s%%_。
items.rings.ringofhaste.desc=这枚戒指能加快佩戴者的时间流速，让一切行动都快上少许。
items.rings.ringofhaste.name=疾速之戒
items.rings.ringofhaste.stats=佩戴此戒指后，您的移动速度将提升_%s%%。_
items.rings.ringofhaste.typical_stats=佩戴此戒指后，您的移动速度通常会提高_%s%%。
items.rings.ringofhaste.upgrade_stat_name_1=移动速度提升
items.rings.ringofmight.combined_stats=你装备的戒指正在结合它们的力量，总共可以提升你的力量_%1$d_和最大生命值_%2$s%%_。
items.rings.ringofmight.desc=这枚戒指能增强佩戴者的体能，赋予他们更强健的体魄和更佳的耐力。而一枚被诅咒的戒指则会削弱佩戴者的力量。
items.rings.ringofmight.name=威力之戒
items.rings.ringofmight.stats=佩戴此戒指后，你的力量值将增加_%1$d_，最大生命值将增加_%2$s%%_。
items.rings.ringofmight.typical_stats=佩戴此戒指后，通常会使你的力量值增加_%1$d_，最大生命值增加_%2$s%%_。
items.rings.ringofmight.upgrade_stat_name_1=增强
items.rings.ringofmight.upgrade_stat_name_2=最大生命值提升
items.rings.ringofsharpshooting.combined_stats=你装备的戒指正在结合它们的力量，总共将有效投掷武器等级提高_%1$d_，耐久度提高_%2$s%%_。
items.rings.ringofsharpshooting.desc=这枚戒指能提升佩戴者的精准度和瞄准能力，使所有投掷武器的威力和耐久度都得到提升。诅咒戒指则会产生相反的效果。
items.rings.ringofsharpshooting.name=神枪手之环
items.rings.ringofsharpshooting.stats=佩戴此戒指后，投掷武器的伤害将提升至相当于武器等级提升_%1$d_的水平，耐久度也将提升_%2$s%%_。
items.rings.ringofsharpshooting.typical_stats=佩戴此戒指后，通常会将你的投掷武器的伤害提升至相当于武器等级提升了_%1$d_，并将武器耐久度提升_%2$s%%_。
items.rings.ringofsharpshooting.upgrade_stat_name_1=等级伤害提升
items.rings.ringofsharpshooting.upgrade_stat_name_2=耐久度提升
items.rings.ringoftenacity.combined_stats=你装备的戒指正在结合它们的力量，总共最多可减少你受到的伤害_%s%%_。
items.rings.ringoftenacity.desc=佩戴此戒指后，佩戴者可以抵抗通常致命的攻击。佩戴者受伤越重，抵抗力就越强。而诅咒戒指则会使敌人更容易处决佩戴者。
items.rings.ringoftenacity.name=坚韧之环
items.rings.ringoftenacity.stats=佩戴此戒指可减少您受到的伤害，最多可达_%s%%。_
items.rings.ringoftenacity.typical_stats=佩戴此戒指时，通常可减少您受到的伤害，最多可达_%s%%。_
items.rings.ringoftenacity.upgrade_stat_name_1=最大伤害抗性
items.rings.ringofwealth.combined_stats=你装备的戒指正在结合它们的力量，总共使你的运气增加_%s%%_。
items.rings.ringofwealth.desc=这枚戒指如同磁铁般吸引宝藏，增加敌人和容器中掉落贵重物品的概率。而诅咒戒指则会降低你获得战利品的几率。
items.rings.ringofwealth.name=财富之环
items.rings.ringofwealth.stats=佩戴此戒指可提升您的运气值_%s%%。_
items.rings.ringofwealth.typical_stats=佩戴此戒指通常会增加您的运气值_%s%%。
items.rings.ringofwealth.upgrade_stat_name_1=幸运值提升
items.scrolls.exotic.exoticscroll.berkanan=贝尔卡南的异域卷轴
items.scrolls.exotic.exoticscroll.discover_hint=你可以通过炼金术制作这个物品。
items.scrolls.exotic.exoticscroll.gyfu=GYFU的异域卷轴
items.scrolls.exotic.exoticscroll.isaz=伊萨兹的异域卷轴
items.scrolls.exotic.exoticscroll.kaunan=考南的异域卷轴
items.scrolls.exotic.exoticscroll.laguz=拉古兹的异域卷轴
items.scrolls.exotic.exoticscroll.mannaz=曼纳兹的异域卷轴
items.scrolls.exotic.exoticscroll.naudiz=瑙迪兹的异域风情卷轴
items.scrolls.exotic.exoticscroll.odal=奥达尔的异域卷轴
items.scrolls.exotic.exoticscroll.raido=雷多的异域卷轴
items.scrolls.exotic.exoticscroll.sowilo=索维洛的异域卷轴
items.scrolls.exotic.exoticscroll.tiwaz=TIWAZ的异域卷轴
items.scrolls.exotic.exoticscroll.unknown_desc=这张黑色羊皮纸上写着一个闪闪发光、难以辨认的魔法符文。它似乎与这片土地格格不入，谁知道当它被大声朗读时会发生什么呢？
items.scrolls.exotic.exoticscroll.yngvi=YNGVI的异域卷轴
items.scrolls.exotic.scrollofantimagic.desc=此卷轴上的咒语会为你营造一层魔法光环，暂时阻挡所有魔法效果，无论有害还是有益。这包括大多数魔法物品的效果，例如魔杖、卷轴、戒指、神器、附魔和诅咒。不过，英雄护甲的技能威力强大，足以不受此影响。
items.scrolls.exotic.scrollofantimagic.name=反魔法卷轴
items.scrolls.exotic.scrollofchallenge$challengearena.desc=你周围出现了一个魔法竞技场，周围弥漫着翻滚的红色迷雾。站在迷雾中，你的饥饿值不会增加，并且受到的所有伤害减少33。如果你有其他减伤效果（例如护甲），这些效果会在减伤之后生效。剩余回合数：2。
items.scrolls.exotic.scrollofchallenge$challengearena.name=挑战竞技场
items.scrolls.exotic.scrollofchallenge.desc=朗读此卷轴时，会发出震耳欲聋的咆哮，吸引敌人靠近使用者，同时在其周围生成一个小型竞技场。只要朗读者待在这个竞技场内，就能减少33%的伤害（此效果优先于其他伤害减免），并且不会失去饱食度。竞技场的大小会根据朗读者所在区域的大小而变化。在某些首领战区域，竞技场会特别小。
items.scrolls.exotic.scrollofchallenge.name=挑战卷轴
items.scrolls.exotic.scrollofdivination$wnddivination.desc=你的占卜卷轴已确定以下物品：
items.scrolls.exotic.scrollofdivination.desc=此卷轴将随机识别四种你目前未知的物品类型。识别出的物品类型可能是药水的颜色、卷轴上的符文或戒指上的宝石。识别出的物品不一定会是你目前携带的物品。
items.scrolls.exotic.scrollofdivination.name=占卜卷轴
items.scrolls.exotic.scrollofdivination.nothing_left=已经没有什么可以辨认的了！
items.scrolls.exotic.scrollofdread.desc=阅读此卷轴后，会发出一道红光，令视野内的所有敌人陷入极度恐惧之中。此效果极其强大，他们会迅速逃离整个地牢，从此消失无踪！如同恐惧效果一样，此效果会随时间流逝或敌人受到攻击而消失。意志坚定的敌人，例如首领，则会受到普通的恐惧效果影响。
items.scrolls.exotic.scrollofdread.name=恐惧卷轴
items.scrolls.exotic.scrollofenchantment.armor=选择一个符文应用到你的盔甲上。
items.scrolls.exotic.scrollofenchantment.cancel=取消
items.scrolls.exotic.scrollofenchantment.cancel_warn=取消操作仍然会消耗你的附魔卷轴，你确定吗？
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=不，我改变主意了。
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=是的，我确定
items.scrolls.exotic.scrollofenchantment.desc=这张卷轴能将强大的魔法能量注入武器或盔甲中。读者甚至可以在一定程度上控制注入的是哪种魔法。
items.scrolls.exotic.scrollofenchantment.inv_title=给物品附魔
items.scrolls.exotic.scrollofenchantment.name=魔法卷轴
items.scrolls.exotic.scrollofenchantment.weapon=选择一种附魔方式应用到你的武器上。
items.scrolls.exotic.scrollofforesight.desc=阅读此卷轴后，周围地形的细节将以水晶般清晰的形态持续呈现在读者脑海中。此效果持续相当长的时间，并会揭示所有隐藏的门或陷阱，使搜寻变得毫无必要。
items.scrolls.exotic.scrollofforesight.name=预见卷轴
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=取消操作仍然会消耗你的变形卷轴，你确定吗？
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=选择一项天赋去蜕变。
items.scrolls.exotic.scrollofmetamorphosis.desc=此卷轴蕴含强大的变形魔法，其效果作用于施法者而非物品。卷轴的魔法允许你选择一个天赋，并将其替换为五个来自不同英雄职业的同等级天赋之一！此效果仅适用于职业天赋，不适用于子职业或护甲技能。你无法使用的天赋将不会显示在选项中。
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=蜕变天赋
items.scrolls.exotic.scrollofmetamorphosis.name=变形卷轴
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=选择一项新天赋来替换你已蜕变的天赋。
items.scrolls.exotic.scrollofmysticalenergy.desc=这张羊皮纸中蕴藏着原始的魔法力量，释放后会逐渐为使用者装备的神器充能。
items.scrolls.exotic.scrollofmysticalenergy.name=神秘能量卷轴
items.scrolls.exotic.scrollofpassage.desc=这张羊皮纸上的咒语能瞬间将读者传送到离自己最近的、位于其上方一楼的区域。非常适合快速前往商店。
items.scrolls.exotic.scrollofpassage.name=通道卷轴
items.scrolls.exotic.scrollofprismaticimage.desc=此卷轴上的咒语将创造出一个色彩斑斓的幻象，与施法者形成镜像。这个棱镜般的幻象如同施法者的弱化版，防御力与施法者相似，但生命值和攻击力较低。当敌人出现时，棱镜幻象便会现身，并试图保护施法者。如果棱镜幻象已存在，使用此卷轴将使其完全恢复。
items.scrolls.exotic.scrollofprismaticimage.name=棱镜图像卷轴
items.scrolls.exotic.scrollofpsionicblast.desc=此卷轴蕴含着惊人的破坏性能量，可引导之摧毁所有可见生物的心智。然而，此能量会产生强烈的反作用力，阅读者自身也会受到伤害、失明和虚弱。卷轴击中的目标越多，自身受到的伤害就越小。
items.scrolls.exotic.scrollofpsionicblast.name=灵能冲击卷轴
items.scrolls.exotic.scrollofpsionicblast.ondeath=灵能冲击会撕裂你的心智……
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=这个生物被海妖之歌卷轴的魔法迷惑了。被迷惑的角色将永久成为你的盟友，并会与遇到的任何敌人战斗。
items.scrolls.exotic.scrollofsirenssong$enthralled.name=着迷
items.scrolls.exotic.scrollofsirenssong.cancel=你必须选择一个目标。
items.scrolls.exotic.scrollofsirenssong.desc=阅读此卷轴会发出迷人的旋律，魅惑目标敌人，将其永久转化为盟友！其他听到此旋律的敌人会被暂时魅惑。特别强大的敌人可以抵抗魅惑效果，反而会被魅惑。
items.scrolls.exotic.scrollofsirenssong.name=海妖之歌卷轴
items.scrolls.exotic.scrollofsirenssong.no_target=卷轴无需指定目标即可激活。
items.scrolls.exotic.scrollofsirenssong.prompt=选择目标
items.scrolls.inventoryscroll.no=不，我改变主意了。
items.scrolls.inventoryscroll.warning=您确定要取消此次卷轴使用吗？该卷轴之前未被识别，因此无论如何都会被消耗掉。
items.scrolls.inventoryscroll.yes=是的，我肯定
items.scrolls.scroll$placeholder.name=滚动
items.scrolls.scroll.ac_read=读
items.scrolls.scroll.berkanan=贝尔卡南卷轴
items.scrolls.scroll.blinded=失明的时候是看不清卷轴的。
items.scrolls.scroll.cursed=你那本被诅咒的魔法书阻止你使用这张卷轴的魔法！不过，一张移除诅咒的卷轴或许足够强大，仍然有效……
items.scrolls.scroll.gyfu=GYFU卷轴
items.scrolls.scroll.isaz=伊萨兹卷轴
items.scrolls.scroll.kaunan=考南卷轴
items.scrolls.scroll.laguz=拉古兹卷轴
items.scrolls.scroll.mannaz=曼纳兹卷轴
items.scrolls.scroll.naudiz=瑙迪兹卷轴
items.scrolls.scroll.no_magic=免疫魔法时无法阅读卷轴。
items.scrolls.scroll.odal=奥达尔卷轴
items.scrolls.scroll.raido=雷多的卷轴
items.scrolls.scroll.sowilo=索维洛卷轴
items.scrolls.scroll.tiwaz=提瓦兹卷轴
items.scrolls.scroll.unknown_desc=这张羊皮纸上写满了无法辨认的文字，标题处印着符文%s。谁知道大声读出它会发生什么？
items.scrolls.scroll.yngvi=YNGVI卷轴
items.scrolls.scrollofidentify.desc=永久揭示单个物品的所有秘密。
items.scrolls.scrollofidentify.inv_title=识别一个项目
items.scrolls.scrollofidentify.it_is=您的物品已被识别：%s。
items.scrolls.scrollofidentify.name=鉴定卷轴
items.scrolls.scrolloflullaby.desc=舒缓的旋律会让视野内的所有生物都进入深度睡眠，给你逃跑或对它们发动突袭的机会。
items.scrolls.scrolloflullaby.name=摇篮曲卷轴
items.scrolls.scrolloflullaby.sooth=卷轴奏出舒缓的旋律，你感到昏昏欲睡。
items.scrolls.scrollofmagicmapping.desc=阅读此卷轴后，一幅清晰无比的图像将深深烙印在你的记忆中，让你清晰地了解关卡的布局，并揭示所有隐藏的秘密。物品和生物的具体位置仍将未知。
items.scrolls.scrollofmagicmapping.layout=您现在应该已经了解关卡布局了。
items.scrolls.scrollofmagicmapping.name=魔法地图卷轴
items.scrolls.scrollofmirrorimage.copies=卷轴上会形成你的镜像。
items.scrolls.scrollofmirrorimage.desc=此卷轴上的咒语将创造出读者的幻影分身，这些分身将追击他的敌人。
items.scrolls.scrollofmirrorimage.name=镜像卷轴
items.scrolls.scrollofmirrorimage.no_copies=卷轴试图创造出你的镜像，但它们无处可去。
items.scrolls.scrollofrage.desc=大声朗读此卷轴，将发出震耳欲聋的咆哮，吸引所有敌人来到读者面前，并激怒附近的敌人。
items.scrolls.scrollofrage.name=愤怒卷轴
items.scrolls.scrollofrage.roar=卷轴发出震耳欲聋的咆哮声，响彻整个地牢！
items.scrolls.scrollofrecharging.desc=这张羊皮纸中蕴藏着原始的魔法力量，一旦释放，就能将读者的所有魔杖重新充满能量。
items.scrolls.scrollofrecharging.name=充能卷轴
items.scrolls.scrollofrecharging.surge=一股能量涌遍全身，为你的魔杖注入活力！
items.scrolls.scrollofremovecurse.cleansed=你的物品散发出洁净的光芒，邪恶的能量消散了！
items.scrolls.scrollofremovecurse.desc=此卷轴上的咒语将立即解除读者武器、盔甲、戒指和随身物品上任何可能阻止佩戴者移除它们的邪恶魔法。
items.scrolls.scrollofremovecurse.inv_title=清洁物品
items.scrolls.scrollofremovecurse.name=解除诅咒卷轴
items.scrolls.scrollofremovecurse.not_cleansed=你的物品发出净化之光，但什么也没发生。
items.scrolls.scrollofremovecurse.spirit=你的卷轴解救了受折磨的灵魂！
items.scrolls.scrollofretribution.blast=强大的魔法能量从卷轴中爆发而出！
items.scrolls.scrollofretribution.desc=这卷轴蕴含着毁灭性的能量，能将读者的痛苦转化为一股强大的力量。读者越虚弱，造成的伤害就越大。在生命值极低的情况下，这卷轴可以瞬间杀死大多数敌人。然而，使用卷轴也会对使用者造成伤害，使其失明并虚弱。
items.scrolls.scrollofretribution.name=复仇卷轴
items.scrolls.scrollofteleportation.cant_reach=你无法瞬间移动到那里。
items.scrolls.scrollofteleportation.desc=这张羊皮纸上的咒语能瞬间将读者传送到地牢某一层的随机地点。它可以用来逃离危险境地，但运气不好的读者也可能发现自己身处更加危险的地方。
items.scrolls.scrollofteleportation.name=传送卷轴
items.scrolls.scrollofteleportation.no_tele=传送魔法失效了。
items.scrolls.scrollofteleportation.prompt=选择传送地点
items.scrolls.scrollofteleportation.tele=眨眼间，你就被传送到了关卡中的另一个地点。
items.scrolls.scrollofterror.desc=一道红光闪过，你视野内的所有生物都会惊恐万分，转身逃窜。攻击逃跑的敌人可以驱散这种效果。
items.scrolls.scrollofterror.many=卷轴发出耀眼的红光，怪物们四散奔逃！
items.scrolls.scrollofterror.name=恐怖卷轴
items.scrolls.scrollofterror.none=卷轴发出耀眼的红光。
items.scrolls.scrollofterror.one=卷轴发出耀眼的红光，%s 逃走了！
items.scrolls.scrolloftransmutation.desc=这张卷轴蕴含着强大的变形魔法。对符合条件的物品使用后，它会将物品转化为同类型的其他物品。魔法甚至会保留物品的升级、附魔和符文。卷轴和药水会被转化为同类型的异种物品，反之亦然。
items.scrolls.scrolloftransmutation.inv_title=转化物品
items.scrolls.scrolloftransmutation.morph=你的物品会变成别的东西！
items.scrolls.scrolloftransmutation.name=变形卷轴
items.scrolls.scrolloftransmutation.nothing=什么有趣的事情也没发生。
items.scrolls.scrollofupgrade.desc=此卷轴可升级一件物品，提升其品质。魔杖的威力及充能次数将会增加；武器的伤害会更高或命中率会更高；盔甲能抵挡更多攻击；戒指对佩戴者的效果会增强。武器和盔甲的使用所需力量也会降低，并且物品上的所有诅咒都将被解除。
items.scrolls.scrollofupgrade.inv_title=升级物品
items.scrolls.scrollofupgrade.name=升级卷轴
items.scrolls.scrollofupgrade.remove_curse=升级卷轴可以清除你物品上的诅咒！
items.scrolls.scrollofupgrade.weaken_curse=升级卷轴可以削弱物品上的诅咒。
items.spells.alchemize$wndalchemizeitem.energize=转化为 %d 能量
items.spells.alchemize$wndalchemizeitem.energize_1=将 1 转化为 %d 能量
items.spells.alchemize$wndalchemizeitem.energize_all=将所有能量转化为 %d 能量
items.spells.alchemize$wndalchemizeitem.sell=变成 %dg
items.spells.alchemize$wndalchemizeitem.sell_1=将 1 转换为 %dg
items.spells.alchemize$wndalchemizeitem.sell_all=全部变成 %dg
items.spells.alchemize.desc=这个法术蕴含着类似于炼金壶的转化力量。每次施法都能将一件物品（或一组物品）转化为金币或炼金能量。将药水或卷轴转化为能量甚至还能识别它们！一些炼金术道具可以在商店购买，但更多道具可以通过炼金术合成，只需将种子、符文石和少量炼金能量组合即可。
items.spells.alchemize.name=炼金术
items.spells.alchemize.prompt=炼金术改造物品
items.spells.beaconofreturning.creatures=周围生物的灵能光环暂时阻止你进行传送。
items.spells.beaconofreturning.desc=这个精妙的法术赋予使用者返回指定地点的能力，无论距离远近。法术效果仅在返回时消耗，可以设置任意次数，但只会记住最近一次设置的位置。
items.spells.beaconofreturning.desc_set=该信标设置在 %d 楼层的某个位置。
items.spells.beaconofreturning.name=回归的灯塔
items.spells.beaconofreturning.preventing=这里强大的魔法气息阻止你使用魔法！
items.spells.beaconofreturning.set=信标已设置在您当前位置。
items.spells.beaconofreturning.wnd_body=设置将覆盖信标先前设置的位置。返回将返回您上次设置的位置并消耗一次法术使用次数。
items.spells.beaconofreturning.wnd_return=返回
items.spells.beaconofreturning.wnd_set=放
items.spells.curseinfusion.desc=此法术会将DM-300中存在的强大邪恶魔法注入一件装备。被施法的物品会立即受到诅咒，其原有的任何附魔或符文都会被覆盖。对于武器、盔甲和魔杖，除了受到诅咒之外，物品还会获得升级。诅咒注入的升级效果不会叠加，如果物品解除诅咒，所有升级效果都会消失。也可以使用多次诅咒注入来改变武器或盔甲上的诅咒。
items.spells.curseinfusion.inv_title=诅咒一件物品
items.spells.curseinfusion.name=诅咒灌注
items.spells.magicalinfusion.desc=此法术拥有与升级卷轴相同的魔法力量，但形式更加稳定。除了像普通升级卷轴一样升级物品外，它永远不会清除附魔、符文或诅咒。
items.spells.magicalinfusion.infuse=你的物品注入了神秘能量！
items.spells.magicalinfusion.inv_title=注入物品
items.spells.magicalinfusion.name=魔法灌注
items.spells.magicalporter.desc=这个法术能将施放的任何物品神奇地传送过去。但与商人的信标不同，这些物品会被传送到下一层首领关卡的入口处。
items.spells.magicalporter.inv_title=移植物品
items.spells.magicalporter.name=神奇的搬运工
items.spells.magicalporter.nowhere=你没有地方可以转移物品。
items.spells.phaseshift.desc=这个混乱的法术会将目标角色传送到当前楼层的随机位置，并使其眩晕一段时间。强大的敌人能够抵抗眩晕效果。该法术可以指向目标，也可以指向施法者自身。
items.spells.phaseshift.name=相移
items.spells.phaseshift.no_target=那里没有可以传送的东西。
items.spells.reclaimtrap.desc=此法术蕴含着DM-300机械能量的残余。当施放于已激活的陷阱时，陷阱的力量将附着于你，使你能够再次使用此法术释放这股力量，并在任何你想要的位置触发陷阱的效果。然而，某些陷阱可能无法在所有地方生效，且一次只能储存一个陷阱。
items.spells.reclaimtrap.desc_trap=该法术目前已准备好触发_%s。
items.spells.reclaimtrap.name=回收陷阱
items.spells.reclaimtrap.no_trap=那里没有陷阱。
items.spells.recycle.desc=这个法术包含一种低阶变形魔法。虽然它对装备无效，但可以将卷轴、药水、种子、符文石或带尖飞镖随机转化为同类型的物品。
items.spells.recycle.inv_title=回收物品
items.spells.recycle.name=回收
items.spells.recycle.recycled=您的物品已被回收为：%s。
items.spells.spell.ac_cast=投掷
items.spells.spell.discover_hint=你可以通过炼金术制作这个物品。
items.spells.spell.no_magic=处于魔法免疫状态时无法施法。
items.spells.summonelemental.ac_imbue=浸润
items.spells.summonelemental.desc=这个法术会引导用于制作它的元素余烬的能量，让你召唤一个友方元素生物与你并肩作战！一次只能召唤一个元素生物，但你可以再次施放此法术，免费将元素生物召回。
items.spells.summonelemental.desc_chaos=该法术目前散发着混沌能量，它会召唤一个混沌元素。你可以给其他物品附魔，但该法术会失去当前的附魔效果。
items.spells.summonelemental.desc_fire=该法术目前触感滚烫，会召唤一个火元素。你可以给其他物品附魔，但该法术会失去当前的附魔效果。
items.spells.summonelemental.desc_frost=该法术目前带有冰冷效果，会召唤一个冰霜元素。你可以给其他物品附魔，但该法术会失去当前的附魔效果。
items.spells.summonelemental.desc_newborn=该法术目前尚未附魔，会召唤一个没有远程攻击能力的新生元素生物。你可以使用已鉴定的液态火焰药水、冰霜药水、充能卷轴或变形卷轴来强化该法术，使之后召唤的元素生物拥有完整的力量！
items.spells.summonelemental.desc_shock=该法术目前散发着静电能量，会召唤一个电击元素。你可以给其他物品附魔，但该法术会失去当前的附魔效果。
items.spells.summonelemental.imbue_prompt=赋予物品
items.spells.summonelemental.name=召唤元素
items.spells.targetedspell.inv_title=注入物品
items.spells.targetedspell.prompt=选择目标
items.spells.telekineticgrab.cant_grab=你抓不到它。
items.spells.telekineticgrab.desc=此法术允许施法者远程获取某个地点的所有物品，或所有粘在敌人身上的投掷武器！它不能用于获取其他人拥有的物品，也不能用于获取箱子之类的容器。
items.spells.telekineticgrab.name=念动力抓取
items.spells.telekineticgrab.no_target=那里没有什么可以拿的。
items.spells.unstablespell.desc=这颗黑色小方水晶的每个面上都刻有不断变化的符文符号。激活后，它会触发一张随机卷轴的效果。如果视野范围内有敌人，卷轴效果必定与战斗相关；否则，卷轴效果必定与非战斗相关。
items.spells.unstablespell.name=不稳定咒语
items.spells.wildenergy.desc=这个咒语蕴含着驱动DM-300的部分诅咒能量。施放后，它会为你的魔杖和佩戴的神器充能，同时还会随机触发一个诅咒魔杖效果。不过，你可以选择这股诅咒魔法的射向方向。
items.spells.wildenergy.name=狂野的能量
items.stones.inventorystone.ac_use=使用
items.stones.runestone$placeholder.name=符文石
items.stones.runestone.discover_hint=你可以在地牢中随机找到这件物品，或者通过炼金术制作它。
items.stones.stoneofaggression$aggression.desc=操纵魔法使附近所有敌人优先攻击该角色。剩余回合数：\n\n。
items.stones.stoneofaggression$aggression.name=目标
items.stones.stoneofaggression.desc=当这块石头投掷向友军或敌军时，附近所有敌人会在短时间内优先攻击该角色。然而，首领级敌人可以抵抗此效果，大幅缩短持续时间并减少其爪牙的攻击伤害。
items.stones.stoneofaggression.name=侵略之石
items.stones.stoneofaugmentation$wndaugment.cancel=没关系
items.stones.stoneofaugmentation$wndaugment.choice=您希望改进哪些方面？
items.stones.stoneofaugmentation$wndaugment.damage=损害
items.stones.stoneofaugmentation$wndaugment.defense=防御
items.stones.stoneofaugmentation$wndaugment.evasion=规避
items.stones.stoneofaugmentation$wndaugment.none=移除增强功能
items.stones.stoneofaugmentation$wndaugment.speed=速度
items.stones.stoneofaugmentation.desc=这块符文石蕴含强大的魔法，可以强化装备，以牺牲另一项属性为代价来提升其某项属性。将其用于武器上，可以提升速度或伤害。投掷武器的耐久度也会根据其速度成比例地增加或减少。将其用于盔甲上，可以提升防御力或闪避力。
items.stones.stoneofaugmentation.discover_hint=你可以从商店购买此物品，或者通过炼金术制作。
items.stones.stoneofaugmentation.inv_title=增强物品
items.stones.stoneofaugmentation.name=增生石
items.stones.stoneofblast.desc=这块符文石会在投掷到的位置立即爆炸。就像炸弹一样，爆炸会对附近的一切物体造成伤害。
items.stones.stoneofblast.name=爆破石
items.stones.stoneofblink.desc=这块符文石会将使用者传送到它被投掷的位置。
items.stones.stoneofblink.name=眨眼之石
items.stones.stoneofclairvoyance.desc=这块石头会立即显现出它周围一大片区域内的所有地砖。它的效果甚至可以穿透墙壁。
items.stones.stoneofclairvoyance.name=透视之石
items.stones.stoneofdeepsleep.desc=这块石头扔向敌人时，会让他们陷入深度魔法沉睡。陷入魔法沉睡的敌人会永远沉睡，直到被唤醒。
items.stones.stoneofdeepsleep.name=深眠之石
items.stones.stoneofdetectmagic.desc=这块符文石能够探测物品上受到的魔法影响。用这块符文石检测一件未鉴定的物品，可以判断它是否受到邪恶诅咒的影响，以及是否受到附魔或升级等正面魔法的影响。
items.stones.stoneofdetectmagic.detected_bad=你检测到这件物品受到了邪恶魔法的影响！
items.stones.stoneofdetectmagic.detected_both=你检测到这件物品同时受到正面和恶意魔法的影响！
items.stones.stoneofdetectmagic.detected_good=你检测到这件物品受到正面魔法的影响！
items.stones.stoneofdetectmagic.detected_none=你没有检测到任何魔法影响到这件物品。
items.stones.stoneofdetectmagic.inv_title=检测物品
items.stones.stoneofdetectmagic.name=魔法探测石
items.stones.stoneofdisarming.desc=这块符文石蕴含着魔法，可以解除隐藏在地牢各处的恶意陷阱。它投掷到目标区域后，最多可以解除9个陷阱。
items.stones.stoneofdisarming.name=解除武装之石
items.stones.stoneofenchantment.armor=你的盔甲在黑暗中闪闪发光！
items.stones.stoneofenchantment.desc=这块符文石蕴含着强大的魔法。与升级卷轴不同，它不会直接提升物品的威力，而是会给武器或盔甲附魔，赋予其新的力量。
items.stones.stoneofenchantment.inv_title=给物品附魔
items.stones.stoneofenchantment.name=魔法石
items.stones.stoneofenchantment.weapon=你的武器在黑暗中会发光！
items.stones.stoneoffear.desc=这块石头扔向角色时，角色会极度恐惧，转身逃跑。攻击逃跑中的角色会缩短效果持续时间。
items.stones.stoneoffear.name=恐惧之石
items.stones.stoneofflock.desc=这块符文石会在投掷地点附近短时间内召唤魔法绵羊。
items.stones.stoneofflock.name=羊群之石
items.stones.stoneofintuition$wndguess.break=你的直觉之石化为尘埃……
items.stones.stoneofintuition$wndguess.correct=正确。物品类型已识别！
items.stones.stoneofintuition$wndguess.incorrect=你的猜测是错误的。
items.stones.stoneofintuition$wndguess.text=猜猜这个未识别物品的类型。如果你猜对了，就能识别出它的类型！
items.stones.stoneofintuition.break_info=直觉之石可以使用两次才会损坏，_下次使用不会消耗石头_。
items.stones.stoneofintuition.break_warn=你之前已经使用过直觉之石，所以_你下次使用将会消耗一块直觉之石_。
items.stones.stoneofintuition.desc=这块符文石蕴含着一种威力较弱的鉴定卷轴魔法。它并非直接鉴定物品，而是运用你的直觉，让你通过猜测来尝试识别药水、卷轴或戒指的类型。
items.stones.stoneofintuition.inv_title=选择一个项目
items.stones.stoneofintuition.name=直觉之石
items.stones.stoneofshock.desc=这块符文石会释放出一股电能，短暂地使附近所有目标昏迷，并且每击中一个目标，就会为投掷魔杖增加一次充能。
items.stones.stoneofshock.name=震惊之石
items.stylus.ac_inscribe=题
items.stylus.cursed=触控笔的魔法对诅咒盔甲无效。
items.stylus.desc=这支神秘的触控笔由某种深色、极其坚硬的石头制成。用它可以将魔法符文刻在你的盔甲上，但你无法选择刻的符文是什么，触控笔会替你决定。
items.stylus.identify=你必须先确定那件盔甲是否被诅咒了。
items.stylus.inscribed=你用触控笔在盔甲上刻字。
items.stylus.name=神秘触控笔
items.stylus.prompt=选择一件盔甲
items.tengusmask.ac_wear=穿
items.tengusmask.desc=天狗死后，面具从他脸上脱落，你能感受到其中散发出的强大魔力。这面具是天狗力量的源泉吗？佩戴面具后，其强大的力量将转移到你身上，使你能够为你的英雄选择一个子职业。你会选择哪个子职业呢？
items.tengusmask.discover_hint=你可以从某些敌人身上掉落此物品。
items.tengusmask.name=天狗的面具
items.tengusmask.used=面具在力量流入你体内时便会消散！
items.torch.ac_light=光
items.torch.desc=火把是冒险者的必备品，当地牢陷入黑暗时，它可以指引方向。
items.torch.name=火炬
items.trinkets.chaoticcenser.desc=这件炼金术物品在炼金炉中放置一段时间后，这只焚香炉似乎会自行冒烟！这些气体不断积聚，并会以半随机的间隔从炉中喷向敌人。它似乎能够产生各种各样的气体，但在焚香炉启动前，你会得到短暂的预警。
items.trinkets.chaoticcenser.name=混乱的香炉
items.trinkets.chaoticcenser.spew=你的香炉即将喷出：%s。
items.trinkets.chaoticcenser.stats_desc=当前等级下，这件饰品大约每隔_%d_回合会在敌人附近生成一团有害气体。气体只会在有敌人出现时才会生成。等级越高，这些气体越有可能变得奇特且威力强大。
items.trinkets.chaoticcenser.typical_stats_desc=通常情况下，这件饰品大约每隔_%d_回合会在敌人附近生成一种有害气体。气体只会在有敌人出现时才会生成。等级越高，这些气体越有可能变得奇特且威力强大。
items.trinkets.crackedspyglass.desc=如果不是前镜片上的裂缝，这台手持望远镜堪称精湛工艺的典范。这台望远镜似乎能帮助你发现地牢中的新物品，但由于它的缺陷，发现的物品却很难看清！
items.trinkets.crackedspyglass.name=破裂的望远镜
items.trinkets.crackedspyglass.stats_desc=当前等级，此饰品有 _%1$s%% 的几率在每个非首领楼层生成一个额外的隐藏物品。
items.trinkets.crackedspyglass.stats_desc_upgraded=当前等级，该饰品有 _100%% 的几率在每个非首领楼层生成一个额外的隐藏物品，有 _%1$s%% 的几率生成第二个额外的隐藏物品。
items.trinkets.crackedspyglass.typical_stats_desc=通常情况下，这个饰品有 _%1$s%% 的几率在每个非 Boss 层生成一个额外的隐藏物品。
items.trinkets.dimensionalsundial.desc=这个小小的手持日晷，即使你没有把它竖直拿着，也能在地牢深处投射出影子。更奇怪的是，影子的位置似乎与这个世界的太阳毫无关联。当日晷没有投射出影子时，它似乎就会招来危险。
items.trinkets.dimensionalsundial.name=立体日晷
items.trinkets.dimensionalsundial.stats_desc=就目前而言，这件饰品会在现实生活中的白天（上午 8 点至晚上 8 点）将敌人的生成率降低 _%1$d%%_，并在夜晚（晚上 8 点至次日早上 8 点）将敌人的生成率提高 _%2$d%%_。
items.trinkets.dimensionalsundial.typical_stats_desc=通常情况下，这个饰品会在现实生活中的白天（上午 8 点至晚上 8 点）将敌人的生成率降低 _%1$d%%_，并在夜晚（晚上 8 点至早上 8 点）将敌人的生成率提高 _%2$d%%_。
items.trinkets.dimensionalsundial.warning=日晷没有投下阴影，你感到不安。
items.trinkets.exoticcrystals.desc=这些粉红色的小晶体形状与炼金能量晶体相同。虽然它们不能直接用于获取能量，但似乎会对你找到的药剂和卷轴产生某种影响。
items.trinkets.exoticcrystals.name=奇异水晶
items.trinkets.exoticcrystals.stats_desc=目前，此饰品会将掉落的药水或卷轴替换为对应的异域版本。但力量药水、升级卷轴以及用于解决危险房间的物品不受影响。
items.trinkets.exoticcrystals.typical_stats_desc=通常情况下，这件饰品会将掉落的药水或卷轴替换为对应的稀有物品。但这不会影响力量药水、升级卷轴或用于解决危险房间的物品。
items.trinkets.eyeofnewt.desc=这种金黑色的蝾螈眼珠原本是一种常见的材料，如今却被制成了饰品。据说，这只眼睛会降低你的视力，但能让你以其他方式看待事物。
items.trinkets.eyeofnewt.name=蝾螈眼
items.trinkets.eyeofnewt.stats_desc=当前等级的这个饰品会将你的视野范围减少_%1$s%%_，但也会赋予你对_%2$d_格内敌人的心灵视觉。
items.trinkets.eyeofnewt.typical_stats_desc=通常情况下，这个饰品会将你的视野范围减少_%1$s%%_，但也会赋予你对_%2$d_格内敌人的心灵视觉。
items.trinkets.ferrettuft.desc=一撮丝滑的白色雪貂毛，用一条亮绿色的丝带系成蝴蝶结。雪貂以敏捷、淘气和不守规矩而闻名。这件小饰品似乎也散发着雪貂的某种魔力，增强了它躲避附近一切事物的能力。
items.trinkets.ferrettuft.name=雪貂毛簇
items.trinkets.ferrettuft.stats_desc=当前等级下，该饰品将使所有角色的闪避率提高_%1$s%%_。
items.trinkets.ferrettuft.typical_stats_desc=通常情况下，这个饰品会使所有角色的闪避率提高_%1$s%%_。
items.trinkets.mimictooth.desc=这颗又大又尖的牙齿一定是从一个非常不高兴的拟态怪身上拔下来的。它似乎对地牢里的拟态怪产生了影响，使它们出现得更加频繁，也更加危险。
items.trinkets.mimictooth.name=仿生牙
items.trinkets.mimictooth.stats_desc=目前，这件饰品会使各种拟态怪_%1$sx_出现频率更高，更难被发现，但同时也会增加它们掉落的战利品数量。此外，每个地牢楼层都有_%2$s%%_的几率额外出现一只隐秘的乌木拟态怪。
items.trinkets.mimictooth.typical_stats_desc=通常情况下，这件饰品会使各种拟态怪出现频率更高，更难被发现，但同时也会增加它们掉落的战利品数量。此外，每个地牢楼层都有一定几率出现一只额外的隐秘乌木拟态怪。
items.trinkets.mossyclump.desc=这团湿漉漉的苔藓似乎无论你怎么用力挤压都无法保持水分。它好像与地牢本身有着某种神奇的联系，使得草和水更容易出现。
items.trinkets.mossyclump.name=苔藓丛
items.trinkets.mossyclump.stats_desc=当前等级下，此饰品会使_%d%%_个无主题楼层变成充满水或草地。\n\n升级此饰品需要消耗更多能量。
items.trinkets.mossyclump.typical_stats_desc=通常情况下，这个饰品会让_%d%%_的非主题楼层变成充满水或草。\n\n升级这个饰品需要消耗更多能量。
items.trinkets.parchmentscrap.desc=这张小小的羊皮纸碎片看起来像是从卷轴上撕下来的。它保留了一些魔法，而且似乎对地牢里找到的武器和盔甲有着影响。
items.trinkets.parchmentscrap.name=羊皮纸碎片
items.trinkets.parchmentscrap.stats_desc=当前等级下，此饰品可将附魔和符文变为普通品质，武器和盔甲上的诅咒变为普通品质。魔杖、戒指或神器上的诅咒不受影响。升级此饰品需要消耗更多能量。
items.trinkets.parchmentscrap.typical_stats_desc=通常情况下，这件饰品会将附魔和符文_%dx_变为普通品质，并将武器和盔甲上的诅咒_%sx_变为普通品质。魔杖、戒指或神器上的诅咒不受影响。\n\n升级这件饰品需要消耗更多能量。
items.trinkets.petrifiedseed.desc=这颗种子已经化石化，可能是缓慢的地质过程或魔法作用的结果。这颗种子似乎以某种魔法影响着地牢中的植物群落，偶尔会将植物种子替换成符文石。
items.trinkets.petrifiedseed.name=石化种子
items.trinkets.petrifiedseed.stats_desc=目前的等级，这个饰品会使被踩踏的草有 _%1$s%%_ 次掉落符文石而不是种子，还会使高高的草更容易掉落物品 _%2$s%%_。
items.trinkets.petrifiedseed.typical_stats_desc=通常情况下，这个饰品会让被踩踏的草掉落符文石而不是种子，并且会让高高的草更频繁地掉落物品。
items.trinkets.ratskull.desc=这件诡异的小玩意儿比普通老鼠的头骨大不了多少，而老鼠在这个地牢里却十分罕见。这颗头骨似乎蕴含着某种魔法力量，吸引着地牢里那些更为稀有的生物，使它们出现的频率大大增加。
items.trinkets.ratskull.name=老鼠头骨
items.trinkets.ratskull.stats_desc=就目前等级而言，这件饰品会使稀有异域敌人_%dx_出现的概率增加一半。然而，骷髅头对吸引水晶拟态怪和装甲雕像的效果只有原来的一半。
items.trinkets.ratskull.typical_stats_desc=通常情况下，这件饰品会提高稀有异域敌人_%dx_出现的概率。然而，骷髅头对吸引水晶拟态怪和装甲雕像的效果只有一半。
items.trinkets.saltcube.desc=这块巨大的盐晶被切割成近乎完美的立方体形状，它非但没有溶解，反而吸走了炼金锅里一半的水。它似乎具有神奇的脱水和保存食物的功效，能延长饱腹感，但同时也会降低非饥饿状态下的生命值恢复速度。
items.trinkets.saltcube.name=盐块
items.trinkets.saltcube.stats_desc=当前等级的这个饰品可以增加你饥饿前的持续时间_%1$s%%_，但也会降低你的生命恢复速度_%2$s%%_，除非该楼层被锁定。
items.trinkets.saltcube.typical_stats_desc=通常情况下，这个饰品会使你的饥饿时间延长_%1$s%%_，但也会降低你的生命值恢复速度_%2$s%%_，除非该楼层被锁定。
items.trinkets.shardofoblivion$thrownusetracker.desc=你最近使用了一件未鉴定的投掷武器，这件武器在一段时间内会被视为一件已使用的未鉴定装备，计入湮灭碎片。剩余回合数：\n\n。
items.trinkets.shardofoblivion$thrownusetracker.name=使用身份不明的投掷武器
items.trinkets.shardofoblivion$wandusetracker.desc=你最近使用了一根未鉴定的魔杖，在一段时间内，它会被计为一件已使用的未鉴定装备，用于遗忘碎片。剩余回合数：\n\n。
items.trinkets.shardofoblivion$wandusetracker.name=使用身份不明的魔杖
items.trinkets.shardofoblivion.ac_identify=确认
items.trinkets.shardofoblivion.desc=这块被诅咒的金属碎片在炼金锅里熬煮了一段时间后，竟然变成了……虚无？光线似乎会绕着它弯曲，而且当你不握住它时，它会悬浮在空中。这块碎片似乎在以魔法的方式汲取你的无知，所以最好还是别想太多。
items.trinkets.shardofoblivion.identify=你认出了这件物品！
items.trinkets.shardofoblivion.identify_not_yet=该物品尚未准备好进行鉴定。
items.trinkets.shardofoblivion.identify_prompt=识别一个项目
items.trinkets.shardofoblivion.identify_ready=物品已准备好鉴定：%s。使用你的湮灭碎片进行鉴定。
items.trinkets.shardofoblivion.identify_ready_worn=你所有穿戴过的物品现在都可以进行鉴定了。使用你的湮灭碎片对物品进行鉴定。
items.trinkets.shardofoblivion.name=遗忘碎片
items.trinkets.shardofoblivion.stats_desc=目前，这件饰品会使敌人掉落战利品的几率提高20%%，每件你装备或最近使用过的未鉴定装备增加一次掉落，最多可增加_%d件_。该碎片还会阻止你鉴定装备，但可用于手动鉴定已准备好鉴定的物品。
items.trinkets.shardofoblivion.typical_stats_desc=通常情况下，这件饰品会使敌人掉落战利品的几率提高20%%，每件你装备或最近使用过的未鉴定装备增加20%%，最多可增加_%d件_。该碎片还会阻止你鉴定装备，但可用于手动鉴定已准备好鉴定的物品。
items.trinkets.thirteenleafclover.desc=不知为何，这株三叶草在炼金锅里熬煮后竟然长出了好多额外的叶子！这件饰品究竟是吉利还是厄运还真不好说，或许它会让你的运气更加捉摸不定？
items.trinkets.thirteenleafclover.name=十三叶三叶草
items.trinkets.thirteenleafclover.stats_desc=当前等级的这个饰品会使你在_%1$d%%_次造成最大伤害，在_%2$d%%_次造成最小伤害。
items.trinkets.thirteenleafclover.typical_stats_desc=通常情况下，这个饰品会让你在_%1$d%%_天造成最大伤害，在_%2$d%%_天造成最小伤害。
items.trinkets.trapmechanism.desc=这是地牢中一个陷阱的核心部件，精心雕刻在地板上以便携带。它似乎与地牢本身有着某种魔法联系，使危险地形更加常见，同时也提升了你与该地形的亲和力。
items.trinkets.trapmechanism.name=陷阱机制
items.trinkets.trapmechanism.stats_desc=目前，这件饰品会使_%1$d%%_个无主题楼层变成布满陷阱或深渊。此外，地牢中_%2$d%%_个隐藏陷阱也会变得可见。
items.trinkets.trapmechanism.typical_stats_desc=通常情况下，这件饰品会让_%1$d%%_部分原本没有主题的楼层变成布满陷阱或深渊。此外，地牢中_%2$d%%_部分隐藏陷阱也会变得可见。
items.trinkets.trinket$placeholder.name=小饰品
items.trinkets.trinket.discover_hint=当你通过炼金术制作饰品时，该物品有一定几率成为可选物品。
items.trinkets.trinketcatalyst$randomtrinket.desc=附近有一件物品卡在一个你打不开的小袋子里。炼金术会溶解这个小袋子，但你不做炼金术就不知道会得到什么小玩意儿！
items.trinkets.trinketcatalyst$randomtrinket.name=随机小饰品
items.trinkets.trinketcatalyst.desc=这团神奇的金色粉末在地牢的黑暗中闪烁。只需少量炼金能量，即可将此催化剂用于炼金锅，制作出一件独特的饰品。饰品能提供各种不同的效果，略微改变地牢或其居民的属性。饰品可以消耗更多能量进行升级，增强其效果；也可以丢弃饰品，使其完全失去效果。
items.trinkets.trinketcatalyst.name=魔法催化剂
items.trinkets.trinketcatalyst.window_text=加入催化剂后，水开始发光。附近有一些物品可以注入能量，变成魔法饰品。
items.trinkets.trinketcatalyst.window_title=制作一件小饰品
items.trinkets.vialofblood.desc=这个细长的试管里装着地牢里某个居民的血液，当你旋转试管时，血液会缓慢流动。它似乎能以某种魔法增强治疗效果，但同时也会延缓治疗的生效。
items.trinkets.vialofblood.name=一小瓶血
items.trinkets.vialofblood.stats_desc=当前等级下，此饰品可使你从饮用治疗药水、水袋或生命之泉中获得的生命值增加_%1$s%%_。但是，这些治疗效果的恢复速度也会变慢，每回合最多恢复_%2$s_点生命值（此数值随英雄等级提升）。
items.trinkets.vialofblood.typical_stats_desc=通常情况下，这件饰品会使你从饮用治疗药水、水袋或生命之泉中获得的生命值增加_%1$s%%_。但是，这些治疗效果的恢复速度也会变慢，每回合最多恢复_%2$s_点生命值（此数值随英雄等级提升）。
items.trinkets.wondrousresin.desc=这种闪着蓝光的树脂似乎蕴含着被诅咒魔杖魔法的精华。炼金术坩埚中的魔法似乎使其稳定了一些，现在它正在影响你的魔杖。
items.trinkets.wondrousresin.name=奇妙的树脂
items.trinkets.wondrousresin.stats_desc=当前等级下，此饰品有 _%1$s%%_ 的概率使诅咒魔杖的效果变为中性或正面效果，并且有 _%2$s%%_ 的概率使未诅咒的魔杖额外释放一次中性或正面的诅咒电击。升级此饰品需要消耗更多能量。
items.trinkets.wondrousresin.typical_stats_desc=通常情况下，这件饰品会使诅咒魔杖的效果在一定概率下变为中性或正面效果，并且会使未诅咒的魔杖在一定概率下额外释放一次中性或正面的诅咒电击。升级这件饰品需要消耗更多能量。
items.wands.cursedwand.disguise=你的外貌会在你眼前发生变化！
items.wands.cursedwand.fire=你闻到了烧焦的味道……
items.wands.cursedwand.grass=你周围的草丛突然冒了出来！
items.wands.cursedwand.gravity=重力突然开始向随机方向拉扯！
items.wands.cursedwand.gravity_end=重力混乱结束了。
items.wands.cursedwand.gravity_positive=重力突然开始向随机方向拉扯，但这似乎并没有影响到你。
items.wands.cursedwand.mass_invuln=你的魔杖迸发出耀眼的光芒！
items.wands.cursedwand.nothing=什么也没发生。
items.wands.cursedwand.ondeath=你被你自己的 %s 杀死了。
items.wands.cursedwand.petrify=你突然僵在了原地！
items.wands.cursedwand.sinkhole=你周围的地面开始塌陷！
items.wands.cursedwand.sinkhole_positive=地面开始下陷，但感觉脚下还算稳固。
items.wands.cursedwand.supernova=一团炽热的能量球开始膨胀。你最好赶紧跑！
items.wands.cursedwand.supernova_positive=一个炽热的能量球开始膨胀，但不知为何却让人感觉很安全。
items.wands.cursedwand.transmogrify_other=你的物品会变成别的东西！
items.wands.cursedwand.transmogrify_wand=你的魔杖变成了另一件物品！
items.wands.damagewand.upgrade_stat_name_1=魔法伤害
items.wands.wand$placeholder.name=魔杖
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=这个 %s 被诅咒了！
items.wands.wand.cursed=这根魔杖被诅咒了，它的魔法混乱而随机。
items.wands.wand.fizzles=你的魔杖没电了；它一定是电量不足。
items.wands.wand.identify=你现在已经足够熟悉你的魔杖，能够认出它了。
items.wands.wand.no_magic=你的魔杖失效了；在魔法免疫状态下，你无法使用魔杖。
items.wands.wand.not_cursed=这根魔杖没有邪恶魔法。
items.wands.wand.prompt=选择要传送的位置
items.wands.wand.resin_many=这根魔杖从神秘树脂中获得了_%d层数_。
items.wands.wand.resin_one=这根魔杖因吸收了奥术树脂而提升了 1 级。
items.wands.wand.self_target=你不能以自己为目标！
items.wands.wandofblastwave.bmage_desc=当战斗法师使用冲击波法杖攻击麻痹状态的敌人时，会消耗麻痹效果，造成额外魔法伤害。此效果对每个敌人都有短暂的冷却时间。
items.wands.wandofblastwave.desc=这根魔杖由一种类似大理石的石头制成，镶有金边，顶端镶嵌着一颗圆形的黑色宝石。拿在手里很有分量。
items.wands.wandofblastwave.eleblast_desc=使用冲击波法杖的元素冲击可造成 67% 的伤害，并将所有敌人击出冲击范围。
items.wands.wandofblastwave.knockback_ondeath=那场车祸夺走了你的生命……
items.wands.wandofblastwave.name=冲击波魔杖
items.wands.wandofblastwave.ondeath=你用自己的冲击波魔杖自杀了……
items.wands.wandofblastwave.staff_name=冲击波之杖
items.wands.wandofblastwave.stats_desc=这根魔杖会射出一道光束，光束会在目标位置剧烈爆炸。爆炸威力巨大，可造成_%1$d-%2$d点伤害，足以将大多数敌人击飞。
items.wands.wandofblastwave.typical_stats_desc=这根魔杖会射出一道光束，光束会在目标位置剧烈爆炸。爆炸威力通常为_%1$d-%2$d点伤害_，足以将大多数敌人击飞。
items.wands.wandofblastwave.upgrade_stat_name_2=击退
items.wands.wandofcorrosion.bmage_desc=当战斗法师用腐蚀法杖攻击敌人时，敌人有几率被腐蚀。
items.wands.wandofcorrosion.desc=这根魔杖杖身呈灰白色，打开后会露出一颗璀璨的橙色宝石。
items.wands.wandofcorrosion.eleblast_desc=使用腐蚀法杖的元素爆炸会使敌人受到 4 回合的腐蚀效果，初始伤害为 6 点。
items.wands.wandofcorrosion.name=腐蚀之杖
items.wands.wandofcorrosion.staff_name=腐蚀人员
items.wands.wandofcorrosion.stats_desc=这根魔杖会射出一道光束，光束会在目标位置爆炸并释放出一团高腐蚀性气体。任何被这团气体包围的物体都会随着时间推移受到不断增加的伤害，初始伤害值为_%d。
items.wands.wandofcorrosion.upgrade_stat_name_1=腐蚀损伤
items.wands.wandofcorrosion.upgrade_stat_name_2=气体体积
items.wands.wandofcorruption.already_corrupted=那个性格无法再被改变。
items.wands.wandofcorruption.bmage_desc=当战斗法师用腐化法杖攻击敌人时，敌人有几率陷入狂暴状态。
items.wands.wandofcorruption.desc=这根魔杖散发着混乱的黑暗能量，如果从它顶端的小骷髅装饰造型还不够明显的话。
items.wands.wandofcorruption.eleblast_desc=使用腐化法杖的元素爆炸会使敌人陷入 5 回合的狂暴状态。
items.wands.wandofcorruption.name=腐败之杖
items.wands.wandofcorruption.staff_name=腐败人员
items.wands.wandofcorruption.stats_desc=这根魔杖会释放出一股腐蚀能量，削弱敌人，最终迫使他们屈服于你的意志。敌人能够抵抗腐蚀，但虚弱的敌人比健康的敌人更容易被腐蚀。
items.wands.wandofcorruption.upgrade_stat_name_1=腐败的权力
items.wands.wandofcorruption.upgrade_stat_name_2=减益效果持续时间
items.wands.wandofdisintegration.bmage_desc=当战斗法师使用分解法杖时，其攻击范围会增加，就像它具有投射魔法一样。
items.wands.wandofdisintegration.desc=这根魔杖由一块光滑的黑曜石实心制成，深紫色的光芒沿着杖身向上延伸，直至杖尖。它散发着毁灭性的能量，随时准备向前喷射。
items.wands.wandofdisintegration.eleblast_desc=使用分解法杖释放的元素冲击波可造成 100% 的伤害，并能穿透墙壁。
items.wands.wandofdisintegration.name=分解魔杖
items.wands.wandofdisintegration.staff_name=瓦解人员
items.wands.wandofdisintegration.stats_desc=这根魔杖发射的光束可以穿透任何障碍物，升级后射程更远。光束造成_%1$d-%2$d点伤害，并且每穿透一个敌人或一面墙，都会造成额外伤害。
items.wands.wandofdisintegration.upgrade_stat_name_2=最大射程
items.wands.wandoffireblast.bmage_desc=当战斗法师使用火焰冲击法杖攻击敌人时，有几率引发爆炸，对敌人造成伤害并吞噬附近所有火焰！敌人周围火焰越多，引发爆炸的几率就越高。
items.wands.wandoffireblast.desc=这根魔杖由涂有红漆的木制成，并大量贴有金箔，显得十分华丽。杖尖发出噼啪声和嘶嘶声，仿佛随时准备释放其强大的魔法。
items.wands.wandoffireblast.eleblast_desc=使用火焰冲击法杖进行元素冲击，可造成 100% 的伤害，炸开大门，并点燃敌人和地形。
items.wands.wandoffireblast.name=火焰冲击魔杖
items.wands.wandoffireblast.staff_name=火焰冲击
items.wands.wandoffireblast.stats_desc=这根魔杖使用时会喷射出一道锥形火焰。它的下一次攻击会消耗_%1$d点能量，并造成_%2$d-%3$d点伤害。魔杖消耗的能量越多，效果范围越大、威力越强。
items.wands.wandoffireblast.upgrade_stat_name_1=1 点充能伤害
items.wands.wandoffireblast.upgrade_stat_name_2=2点充能伤害
items.wands.wandoffireblast.upgrade_stat_name_3=3点充能伤害
items.wands.wandoffrost.bmage_desc=当战斗法师用冰霜法杖攻击一个处于冰冻状态的敌人时，有几率使其立即冻结。敌人越是处于冰冻状态，冻结的几率就越高。
items.wands.wandoffrost.desc=这根魔杖似乎是用某种魔法冰制成的。它的光芒越靠近圆润的杖尖越亮。握在手里感觉非常冰冷，但不知为何，你的手却依然温暖。
items.wands.wandoffrost.eleblast_desc=使用冰霜法杖释放元素冲击，可造成 100% 的伤害，冻结敌人，并扑灭火焰。
items.wands.wandoffrost.name=冰霜魔杖
items.wands.wandoffrost.staff_name=霜冻之杖
items.wands.wandoffrost.stats_desc=这根魔杖会向敌人发射冰冷能量冲击波，造成_%1$d-%2$d点伤害并使其冰冻。在水中效果似乎更强。已被冰冻或冰冻的敌人受到的伤害会降低。
items.wands.wandoffrost.upgrade_stat_name_2=冷却时间
items.wands.wandoflightning$lightningcharge.desc=战斗法师目前能量充沛，使他免疫闪电法杖的攻击，并增加闪电弧的范围。剩余回合数：\n\n。
items.wands.wandoflightning$lightningcharge.name=带电
items.wands.wandoflightning.bmage_desc=当战斗法师用闪电法杖攻击敌人时，有几率给自己充能，持续10回合。充能期间，战斗法师免疫闪电伤害，并且能更远距离地释放闪电。
items.wands.wandoflightning.desc=这根魔杖由实心金属制成，因此出乎意料地重。杖尖的两个叉状物弯曲汇合，电流在它们之间产生电弧。
items.wands.wandoflightning.eleblast_desc=使用闪电法杖进行元素爆炸，可造成 100% 的伤害，使敌人昏迷 5 回合，并使水带电。
items.wands.wandoflightning.name=闪电魔杖
items.wands.wandoflightning.ondeath=你用自己的闪电魔杖自杀了……
items.wands.wandoflightning.staff_name=闪电权杖
items.wands.wandoflightning.stats_desc=这根魔杖会释放出强大的闪电，穿透它所击中的目标，造成_%1$d-%2$d点伤害。这种电流会波及附近的敌人，并且在水中更容易扩散。这根魔杖释放的闪电会伤害你，但不会伤害你的队友。
items.wands.wandoflivingearth$earthguardian.desc=你手中的活土魔杖所召唤的岩石已经化作一个守护你的大地卫士！这个岩石卫士会攻击附近的敌人，迫使他们攻击卫士而不是你。当所有威胁都消失后，卫士会在你周围重新凝聚，并在你下次使用魔杖时再次出现。
items.wands.wandoflivingearth$earthguardian.discover_hint=你可以用特定的魔杖找到这个角色。
items.wands.wandoflivingearth$earthguardian.name=大地守护者
items.wands.wandoflivingearth$earthguardian.wand_info=守护者的防御力与你的魔杖等级挂钩。它目前可以抵挡_%1$d-%2$d点伤害。
items.wands.wandoflivingearth$rockarmor.desc=魔法岩石环绕着你的身体，当你受到攻击时，它们会尝试为你格挡，并减少你受到的伤害50点。然而，每次格挡都会刮掉一些岩石。剩余护甲：如果围绕你聚集的岩石足够多，你下一次使用活土魔杖的攻击会使岩石凝聚成一个守护者，与你并肩作战。守护者所需的护甲：
items.wands.wandoflivingearth$rockarmor.desc_many=这位大地守护者也受益于“众生之力”。剩余回合数：%d。
items.wands.wandoflivingearth$rockarmor.name=岩石护甲
items.wands.wandoflivingearth.bmage_desc=当战斗法师用活土法杖攻击敌人时，造成的伤害的一部分会转化为岩石护甲返回。
items.wands.wandoflivingearth.desc=这根魔杖由一种奇特的岩石制成，上面闪烁着黄色的能量条纹。当你握住魔杖时，这些岩石似乎会微微移动，仿佛它们能感受到你的手。
items.wands.wandoflivingearth.eleblast_desc=使用活土法杖的元素冲击可造成 50% 的伤害，并且每击中一个敌人，即可治疗一名活跃的土元素守护者。
items.wands.wandoflivingearth.name=活土魔杖
items.wands.wandoflivingearth.staff_name=活地球的工作人员
items.wands.wandoflivingearth.stats_desc=这根魔杖会向敌人发射魔法岩石，造成_%1$d-%2$d点伤害。岩石随后会在使用者周围重新凝聚，根据造成的伤害量为其提供护甲。如果护甲积攒到一定程度，魔杖下次施法时会形成一个岩石守卫。
items.wands.wandoflivingearth.upgrade_stat_name_2=守护者最大生命值
items.wands.wandoflivingearth.upgrade_stat_name_3=守护者阻挡
items.wands.wandofmagicmissile$magiccharge.desc=你的魔法飞弹魔杖已将能量回馈给你的其他魔杖，提升了下一次魔法攻击的有效等级。你的魔杖威力提升至：+%d.\n\n剩余魔法充能回合数：%s.
items.wands.wandofmagicmissile$magiccharge.name=魔法充能
items.wands.wandofmagicmissile.bmage_desc=当战斗法师用魔法飞弹法杖攻击敌人时，除了他的法杖之外，他所有的魔杖都会获得充能。
items.wands.wandofmagicmissile.desc=这根外观朴素的魔杖能发射纯粹的魔法能量弹。虽然魔杖本身没有任何特殊效果，但它拥有更多的充能次数，并且在升级后可以短暂地强化其他魔杖。
items.wands.wandofmagicmissile.discover_hint=其中一位英雄初始就拥有这件物品。
items.wands.wandofmagicmissile.eleblast_desc=使用魔法飞弹法杖的元素冲击可造成 50% 的伤害，并使法师获得 15 回合的冷却时间。
items.wands.wandofmagicmissile.name=魔杖魔法飞弹
items.wands.wandofmagicmissile.staff_name=魔法飞弹法杖
items.wands.wandofmagicmissile.stats_desc=这根魔杖射出的每一支箭都会造成_%1$d-%2$d点伤害，如果升级的话，还会短暂地强化其他魔杖。
items.wands.wandofprismaticlight.bmage_desc=当战斗法师用棱彩光杖攻击敌人时，敌人将被削弱，削弱持续时间随法杖等级而增加。
items.wands.wandofprismaticlight.desc=这根魔杖由一整块半透明的水晶制成，就像一块光滑的长玻璃。五彩斑斓的光芒在魔杖尖端翩翩起舞，仿佛随时都会迸发出来。
items.wands.wandofprismaticlight.eleblast_desc=使用棱彩光杖的元素爆炸可造成 67% 的伤害，揭示爆炸范围内的所有地形，并使敌人失明 5 回合。
items.wands.wandofprismaticlight.name=棱镜之光魔杖
items.wands.wandofprismaticlight.staff_name=棱镜之光权杖
items.wands.wandofprismaticlight.stats_desc=这根魔杖射出的光束能穿透地牢的黑暗，照亮隐藏区域和陷阱。光束能使敌人失明，并造成_%1$d-%2$d点伤害。恶魔和亡灵敌人会在魔杖的强光下燃烧，受到额外伤害。
items.wands.wandofprismaticlight.upgrade_stat_name_2=盲目机会
items.wands.wandofprismaticlight.upgrade_stat_name_3=光照持续时间
items.wands.wandofregrowth$dewcatcher.desc=露珠草是一种神奇的植物，它们会吸收大量的露水。为了不引人注目，它们会伪装成草丛，但身上积聚的露水却暴露了它们的行踪。
items.wands.wandofregrowth$dewcatcher.discover_hint=你可以用特定的魔杖找到这种植物。
items.wands.wandofregrowth$dewcatcher.name=露捕手
items.wands.wandofregrowth$lotus.desc=金莲花是一种神秘植物，只能通过强大的再生魔杖召唤而来。它的灵气可以增强所有植物及其效果，但它会消耗自身能量，并在短时间内枯萎。
items.wands.wandofregrowth$lotus.discover_hint=你可以用特定的魔杖找到这种植物，但需要多次升级魔杖才能找到它。
items.wands.wandofregrowth$lotus.name=金莲
items.wands.wandofregrowth$lotus.wand_info=这株莲花是由一根再生魔杖（_+%1$d_）培育而成。所有受其效果影响的植物，如果种植在角色身上，都会立即生效。植物还有一定几率（_%2$d%%）掉落种子，而带有尖端的飞镖消耗的耐久度会减少（_%3$d%%）。
items.wands.wandofregrowth$seedpod.desc=种子荚是一种神奇的植物，它们不会产生自身的种子，而是从其他植物中获取种子。尽管没有自己的种子，它们却能以某种方式传播开来。
items.wands.wandofregrowth$seedpod.discover_hint=你可以用特定的魔杖找到这种植物。
items.wands.wandofregrowth$seedpod.name=种子荚
items.wands.wandofregrowth.bmage_desc=当战斗法师用再生法杖攻击敌人，且双方都站在草地上时，他将获得与造成的伤害成比例的草药治疗。
items.wands.wandofregrowth.degradation=再充能_%d次后，这根魔杖将无法再生长出植物和新鲜的草。升级或强化魔杖可以提高这个上限。
items.wands.wandofregrowth.desc=这根魔杖由一根精雕细琢的细木杖身制成。它仿佛依然鲜活灵动，翠绿如幼树的树心。“当生命终结，新的生命总会萌芽……永恒的轮回永不停息！”
items.wands.wandofregrowth.eleblast_desc=使用再生法杖进行元素爆炸，可以使敌人扎根，并在爆炸区域随机生长出青草。
items.wands.wandofregrowth.name=再生魔杖
items.wands.wandofregrowth.staff_name=再生人员
items.wands.wandofregrowth.stats_desc=使用时，这根魔杖会向外锥形发射魔法再生能量，使草木、根茎和珍稀植物复苏。下一次释放能量将消耗_%1$d点能量。魔杖消耗的能量越多，效果越强，范围也越大。
items.wands.wandofregrowth.upgrade_stat_name_1=每笔费用
items.wands.wandofregrowth.upgrade_stat_name_2=总草量限制
items.wands.wandoftransfusion.bmage_desc=当战斗法师用输血法杖攻击被魅惑的敌人时，他将获得护盾，并且他下次用法杖攻击不会消耗任何生命值。
items.wands.wandoftransfusion.charged=你的工作人员被赋予了敌人的生命能量！
items.wands.wandoftransfusion.desc=这根魔杖形状相当普通，但它的洋红色调和顶端的漆黑宝石使其格外引人注目。
items.wands.wandoftransfusion.eleblast_desc=使用输血法杖释放元素冲击波，可以魅惑敌人、治疗盟友，并对亡灵敌人造成 100% 的伤害。
items.wands.wandoftransfusion.name=输血魔杖
items.wands.wandoftransfusion.ondeath=你用自己的输血魔杖自杀了……
items.wands.wandoftransfusion.staff_name=输血人员
items.wands.wandoftransfusion.stats_desc=对盟友或被魅惑的敌人使用时，这根魔杖会消耗使用者_%1$d点生命值，为盟友恢复或提供_%2$d点生命值的护盾。对敌人使用时，魔杖会短暂魅惑敌人，同时为使用者提供_%3$d点护盾。敌对亡灵生物会受到_%4$d-%5$d点伤害，而不是被魅惑。
items.wands.wandoftransfusion.upgrade_stat_name_1=盟友治疗
items.wands.wandoftransfusion.upgrade_stat_name_2=自屏蔽
items.wands.wandoftransfusion.upgrade_stat_name_3=亡灵伤害
items.wands.wandofwarding$ward.desc_1=这个基础结界会自动电击任何进入其视野范围内的敌人，造成_%1$d-%2$d点伤害。_\n\n用你的守护魔杖强化这个结界会将其升级。_\n\n这个结界只会电击一次，之后便会消失。_\n\n你的守护魔杖正在消耗_%3$d点能量来维持这个结界。
items.wands.wandofwarding$ward.desc_2=这个升级后的结界拥有更复杂的图案，并且可以多次攻击。每次攻击都会造成_%1$d-%2$d点伤害。用你的守护魔杖攻击这个结界可以升级它。这个结界会在消失前攻击三次。你的守护魔杖需要消耗_%3$d点能量来维持这个结界。
items.wands.wandofwarding$ward.desc_3=这个完全升级的结界比之前的结界攻击次数更多。每次攻击都会造成_%1$d-%2$d点伤害。用你的守护魔杖攻击这个结界可以升级它。这个结界会在消失前攻击五次。你的守护魔杖需要消耗_%3$d点能量来维持这个结界。
items.wands.wandofwarding$ward.desc_4=这个小型哨兵拥有与大型守卫相同的火力，但它拥有生命值而非固定的充能次数。它的形状类似于你守护魔杖顶端的宝石。该哨兵每次攻击都会造成_%1$d-%2$d点伤害。_\n\n用你的守护魔杖攻击该哨兵可以升级并治疗它。_\n\n该哨兵每次攻击敌人都会消耗一些生命值，但可以通过使用你的守护魔杖来治疗它。_\n\n你的守护魔杖正在消耗_%3$d点能量来维持该哨兵的运作。
items.wands.wandofwarding$ward.desc_5=这个升级后的哨兵比普通哨兵更大更耐用。它每次电击都会造成_%1$d-%2$d点伤害。用你的守护魔杖电击这个哨兵可以升级并治疗它。每次电击敌人时，这个哨兵都会消耗一些生命值，但可以用你的守护魔杖治疗它。你的守护魔杖正在消耗_%3$d点能量来维持这个哨兵。
items.wands.wandofwarding$ward.desc_6=这个完全升级的哨兵比之前的哨兵更加耐打。它每次电击都会造成_%1$d-%2$d点伤害。用你的守护魔杖电击这个哨兵可以治疗它。每次电击敌人时，这个哨兵都会消耗一些生命值，但可以用你的守护魔杖治疗它。你的守护魔杖正在消耗_%3$d点能量来维持这个哨兵的生命值。
items.wands.wandofwarding$ward.desc_generic_sentry=这个哨兵拥有与守护者相同的火力，但它拥有生命值而非固定的充能次数。它的外形类似于你守护魔杖顶端的宝石。用你的守护魔杖攻击这个哨兵可以升级并治疗它。这个哨兵每次攻击敌人都会消耗一些生命值，但可以用你的守护魔杖治疗它。
items.wands.wandofwarding$ward.desc_generic_ward=这个守卫会自动电击任何进入其视野范围内的敌人。用你的守护魔杖电击这个守卫可以升级它。守卫的电击次数有限，超过次数就会消失。
items.wands.wandofwarding$ward.discover_hint=你可以用特定的魔杖找到这个角色。
items.wands.wandofwarding$ward.dismiss_body=如果你不再希望魔杖维持这个结界，你可以将其驱散。这样做会立即摧毁该结界。\n\n解除此结界？
items.wands.wandofwarding$ward.dismiss_cancel=不
items.wands.wandofwarding$ward.dismiss_confirm=是的
items.wands.wandofwarding$ward.dismiss_title=解散这个病房？
items.wands.wandofwarding$ward.name_1=较小的病房
items.wands.wandofwarding$ward.name_2=病房
items.wands.wandofwarding$ward.name_3=大病房
items.wands.wandofwarding$ward.name_4=低级哨兵
items.wands.wandofwarding$ward.name_5=哨兵
items.wands.wandofwarding$ward.name_6=更强大的哨兵
items.wands.wandofwarding.bad_location=那里不能设置病房。
items.wands.wandofwarding.bmage_desc=当战斗法师用守护法杖攻击敌人时，所有激活的守护和哨兵都有几率得到治疗。
items.wands.wandofwarding.desc=这根短小的金属魔杖顶端漂浮着一颗明亮的紫色宝石。
items.wands.wandofwarding.eleblast_desc=使用守护法杖进行元素冲击可以治疗冲击范围内的所有守护和哨兵。
items.wands.wandofwarding.name=防护魔杖
items.wands.wandofwarding.no_more_wards=你的魔杖无法再维持更多的结界了。
items.wands.wandofwarding.staff_name=病房工作人员
items.wands.wandofwarding.stats_desc=这根魔杖不会直接伤害敌人，而是召唤固定的守卫和哨兵。守卫可以召唤在任何地方，即使穿墙也可以（只要你有视野）。这根魔杖一次可以维持价值_%d能量_个的守卫。
items.wands.wandofwarding.upgrade_stat_name_1=守卫伤害
items.wands.wandofwarding.upgrade_stat_name_2=沃德能源
items.waterskin.ac_drink=喝
items.waterskin.collected=你把露珠收集到水囊里。
items.waterskin.desc=用皮革和绳子制成的盛放液体的容器，用软木塞密封。
items.waterskin.desc_full=装满水的水囊似乎散发着能量，或许可以用来祝福其他生存用品？
items.waterskin.desc_heal=这个水囊目前用来储存疗愈之水。水囊越满，你喝到里面的水后就能立即恢复越多的生命值。你只会喝到所需的水量。
items.waterskin.desc_water=现在水囊里只有一些普通的饮用水。地牢里肯定有其他东西可以装在水囊里。
items.waterskin.discover_hint=其中一位英雄初始就拥有这件物品。
items.waterskin.empty=你的水囊空了！
items.waterskin.full=你的水囊满了！
items.waterskin.name=水袋
items.weapon.curses.annoying.desc=烦人的武器会说话，但它们精力过于旺盛。它们常常会在无意中引起你的注意。
items.weapon.curses.annoying.elestrike_desc=带有烦人诅咒的元素打击有 20% 的几率使范围内的每个敌人陷入狂暴状态，持续 6 回合。
items.weapon.curses.annoying.msg_1=哦，我们是在和什么东西战斗吗？！
items.weapon.curses.annoying.msg_10=击中目标！
items.weapon.curses.annoying.msg_11=我不想成为武器，我想成为伐木工的斧头。
items.weapon.curses.annoying.msg_12=记住，过度自信是一个缓慢而隐蔽的杀手。
items.weapon.curses.annoying.msg_13=你们的基地都属于我们了！
items.weapon.curses.annoying.msg_2=耶，拿下他们！
items.weapon.curses.annoying.msg_3=嘿，听着！
items.weapon.curses.annoying.msg_4=我们见到老板了吗！？
items.weapon.curses.annoying.msg_5=哎哟，别把我甩得那么用力！
items.weapon.curses.annoying.msg_6=去死吧，昆虫！
items.weapon.curses.annoying.msg_7=哇哦！
items.weapon.curses.annoying.msg_8=我们能休息一下吗？！
items.weapon.curses.annoying.msg_9=砰！哈哈！
items.weapon.curses.annoying.name=烦人的 %s
items.weapon.curses.dazzling.desc=炫目武器有时会发出耀眼的光芒，使所有能看到它们的人或物都睁不开眼。
items.weapon.curses.dazzling.elestrike_desc=带有眩目诅咒的元素打击有 50% 的几率使范围内的每个敌人失明 6 回合。
items.weapon.curses.dazzling.name=耀眼的 %s
items.weapon.curses.displacing.desc=位移武器蕴含着混乱的传送魔法，能够随机将敌人传送到地板的任何地方。
items.weapon.curses.displacing.elestrike_desc=带有位移诅咒的元素攻击有 50% 的几率将范围内的每个敌人传送走。
items.weapon.curses.displacing.name=置换 %s
items.weapon.curses.explosive.desc=爆炸性武器会逐渐积蓄能量并爆炸，对附近的任何物体造成破坏。
items.weapon.curses.explosive.desc_cool=你的武器现在摸起来是凉的。
items.weapon.curses.explosive.desc_hot=你的武器太烫了！它快要爆炸了！
items.weapon.curses.explosive.desc_warm=你的武器正在积蓄能量并升温……
items.weapon.curses.explosive.elestrike_desc=带有爆炸诅咒的元素打击有 50% 的几率使范围内随机的敌人发生爆炸。
items.weapon.curses.explosive.hot=热的！
items.weapon.curses.explosive.name=爆炸 %s
items.weapon.curses.explosive.warm=温暖的...
items.weapon.curses.friendly.desc=友善的武器最适合和平主义者，但偶尔会触发魔法，使人无法战斗。
items.weapon.curses.friendly.elestrike_desc=带有友方诅咒的元素攻击有 50% 的几率魅惑范围内的所有敌人，持续 6 回合。
items.weapon.curses.friendly.name=友好的 %s
items.weapon.curses.polarized.desc=极化武器会受到魔法的影响，使其攻击力要么提高 50%，要么完全不造成伤害。
items.weapon.curses.polarized.elestrike_desc=带有极化诅咒的元素打击有 50% 的几率对范围内的每个敌人造成 24-36 点伤害。
items.weapon.curses.polarized.name=极化的 %s
items.weapon.curses.sacrificial.desc=祭祀武器会要求佩戴者献上鲜血才能攻击敌人。佩戴者越健康，诅咒夺取的鲜血就越多。
items.weapon.curses.sacrificial.elestrike_desc=带有献祭诅咒的元素攻击会使英雄和范围内的每个敌人流血，造成 12 点生命值伤害。
items.weapon.curses.sacrificial.name=牺牲 %s
items.weapon.curses.wayward$waywardbuff.desc=你的离经叛道的武器的魔法已激活，使其在短时间内极度不准。请注意，这不会影响必定命中的攻击，例如突袭。使用离经叛道的武器成功攻击将立即解除此效果。剩余回合数：\n\n。
items.weapon.curses.wayward$waywardbuff.name=任性的
items.weapon.curses.wayward.desc=偏离预定轨道的武器有时会变得极其不精准。这种魔法效果会在激活后持续一段时间，但可以通过用偏离预定轨道的武器击中目标来解除。
items.weapon.curses.wayward.elestrike_desc=带有邪咒的元素攻击有 50% 的几率使范围内的每个敌人陷入 6 回合的诅咒状态。
items.weapon.curses.wayward.name=任性的 %s
items.weapon.enchantments.blazing.desc=这种附魔效果会使火焰从武器中喷涌而出，点燃敌人，并对已经着火的敌人造成额外伤害。
items.weapon.enchantments.blazing.elestrike_desc=带有炽热附魔的元素打击会将火焰扩散到范围内的每一格，持续 8 回合。
items.weapon.enchantments.blazing.name=炽热的 %s
items.weapon.enchantments.blocking$blockbuff.desc=你的武器的格挡附魔使你的防御力短暂提升！剩余护盾：剩余回合数 ...
items.weapon.enchantments.blocking$blockbuff.name=阻塞
items.weapon.enchantments.blocking.desc=格挡武器在使用后有几率短暂地为你提供护盾。
items.weapon.enchantments.blocking.elestrike_desc=带有格挡附魔的元素打击，每有一个敌人处于攻击范围内，决斗者便可获得额外的 6 点护盾值。
items.weapon.enchantments.blocking.name=阻塞 %s
items.weapon.enchantments.blooming.desc=绽放武器蕴含魔法，能使被击中的目标身上或周围长出植物。
items.weapon.enchantments.blooming.elestrike_desc=带有绽放附魔的元素打击会在范围内最多 8 格范围内散播青草，并使范围内的所有敌人定身 6 回合。
items.weapon.enchantments.blooming.name=盛开的 %s
items.weapon.enchantments.chilling.desc=受到此魔法影响的敌人会感到寒冷，移动和攻击速度都会减慢。
items.weapon.enchantments.chilling.elestrike_desc=带有寒冰附魔的元素打击会将寒气扩散到范围内的每一格，持续 8 回合。
items.weapon.enchantments.chilling.name=冷却 %s
items.weapon.enchantments.corrupting.desc=这种强大的附魔能够将敌人转化为你的附身对象。当敌人被这件武器击杀时，有一定几率会堕落而非死亡。
items.weapon.enchantments.corrupting.elestrike_desc=带有腐化附魔的元素打击有 5-25% 的几率（基于损失的生命值）腐化范围内的每个敌人，但主要目标除外。
items.weapon.enchantments.corrupting.name=损坏 %s
items.weapon.enchantments.elastic.desc=弹性武器有几率将敌人击飞一段距离。
items.weapon.enchantments.elastic.elestrike_desc=带有弹性附魔的元素攻击会将范围内的所有敌人击退 5 格。
items.weapon.enchantments.elastic.name=弹性 %s
items.weapon.enchantments.grim.desc=这种强大的魔法拥有瞬间处决敌人的力量。敌人越弱，效果触发的几率就越高。
items.weapon.enchantments.grim.elestrike_desc=带有凶猛附魔的元素打击有 6-30% 的几率（基于损失的生命值）杀死范围内的所有敌人，但主要目标除外。
items.weapon.enchantments.grim.name=严峻的 %s
items.weapon.enchantments.kinetic$conserveddamage.desc=你的武器储存了上次致命一击的剩余能量，并将在下次攻击中将其转化为额外伤害。然而，能量会随着时间推移而逐渐消散。\n\n 保留伤害：%d。
items.weapon.enchantments.kinetic$conserveddamage.name=保护性损伤
items.weapon.enchantments.kinetic.desc=当敌人被动能武器杀死时，任何多余的能量都会储存在武器中，并用于下一次成功的攻击。
items.weapon.enchantments.kinetic.elestrike_desc=带有动能附魔的元素打击会对范围内的每个敌人造成 40% 的储存伤害，但主要目标除外。
items.weapon.enchantments.kinetic.name=动力学 %s
items.weapon.enchantments.lucky.desc=被幸运武器击杀的敌人有几率掉落额外战利品。
items.weapon.enchantments.lucky.elestrike_desc=带有幸运附魔的元素打击有 12.5% 的几率在范围内每个敌人脚下生成战利品。此效果对每个敌人只能触发一次。
items.weapon.enchantments.lucky.name=幸运 %s
items.weapon.enchantments.projecting.desc=获得此附魔后，近战武器的攻击范围将增加。远程武器在瞄准附近目标时可以穿透墙壁。
items.weapon.enchantments.projecting.elestrike_desc=带有投射附魔的元素打击会对范围内的每个敌人造成 30% 的伤害，但主要目标除外。
items.weapon.enchantments.projecting.name=投影 %s
items.weapon.enchantments.shocking.desc=电击武器发出电弧，对附近所有敌人造成额外伤害。
items.weapon.enchantments.shocking.elestrike_desc=一次带有惊人附魔的元素打击会将电流扩散到范围内的每一格，持续 8 回合。
items.weapon.enchantments.shocking.name=令人震惊的 %s
items.weapon.enchantments.unstable.desc=这种附魔散发出混乱的能量，每次受到攻击都会产生不同的附魔效果。
items.weapon.enchantments.unstable.elestrike_desc=带有不稳定附魔的元素打击会对范围内的每个敌人施加随机附魔效果，但主要目标除外。
items.weapon.enchantments.unstable.name=不稳定的 %s
items.weapon.enchantments.vampiric.desc=这种强大的附魔每次攻击都会吸取敌人的生命力，并将其输送回穿戴者自身。穿戴者生命值越低，效果越强。
items.weapon.enchantments.vampiric.elestrike_desc=带有吸血附魔的元素打击，每有一个敌人在范围内，决斗者就能恢复 2.5 点生命值。
items.weapon.enchantments.vampiric.name=吸血鬼 %s
items.weapon.melee.assassinsblade.ability_desc=决斗者在使用刺客之刃时可以潜行。此能力使决斗者瞬间闪现至多3格远，并获得%d回合的隐身效果。
items.weapon.melee.assassinsblade.ability_name=潜行
items.weapon.melee.assassinsblade.desc=一把由黑曜石制成的小巧波浪形刀刃，虽然轻巧，但难以使用，如果击中正确的目标，则会致命。
items.weapon.melee.assassinsblade.name=刺客之刃
items.weapon.melee.assassinsblade.stats_desc=这种武器对毫无防备的敌人效果更佳。
items.weapon.melee.assassinsblade.typical_ability_desc=决斗者在使用刺客之刃时可以潜行。这项能力可以让决斗者瞬间闪现至多3格远，通常会赋予她%d回合的隐身效果。
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=能力持续时间
items.weapon.melee.battleaxe.ability_desc=决斗者可以使用战斧发动重击。如果重击使敌人措手不及，则会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未能使敌人措手不及，则造成普通伤害。
items.weapon.melee.battleaxe.ability_name=重击
items.weapon.melee.battleaxe.desc=这把战斧巨大的钢制斧头，每次挥砍都威力十足。
items.weapon.melee.battleaxe.name=战斧
items.weapon.melee.battleaxe.stats_desc=这是一件相当精准的武器。
items.weapon.melee.battleaxe.typical_ability_desc=决斗者可以使用战斧发动重击。这种集中攻击如果使敌人措手不及，通常会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未能使敌人措手不及，则造成普通伤害。
items.weapon.melee.crossbow$chargedshot.desc=决斗者将力量集中于弩箭之上。她下一次的攻击必定命中，并附加以下三种效果之一：\n - 近战攻击会将敌人击退数格。\n - 未加箭头的飞镖会造成额外伤害。\n - 加箭头的飞镖会获得额外使用次数，并在7x7范围内施加效果。正面飞镖效果只会影响友方单位，负面效果只会影响敌方单位。决斗者无法使用此能力为自己施加正面飞镖效果。
items.weapon.melee.crossbow$chargedshot.name=带电
items.weapon.melee.crossbow.ability_desc=决斗者可以给她的弩充能，使她的下一次普通攻击必定命中，并施加以下三种效果之一：近战攻击会将敌人击退，未加箭头的飞镖会造成 +%1$d 点伤害，加箭头的飞镖会在 7x7 的范围内施加效果，并持续使用 10 次。
items.weapon.melee.crossbow.ability_name=蓄力射击
items.weapon.melee.crossbow.desc=这是一种结构相当精巧的武器，能以极快的速度发射箭矢。虽然它并非为此而设计，但这把弩的重量和坚固的结构也使它成为一种不错的近战武器。
items.weapon.melee.crossbow.name=弩
items.weapon.melee.crossbow.stats_desc=装备此武器后，投掷飞镖可造成 _%1$d-%2$d 点伤害_，并且还会将其附魔效果赋予飞镖。
items.weapon.melee.crossbow.typical_ability_desc=决斗者可以给她的弩充能，使她的下一次普通攻击必定命中，并施加以下三种效果之一：近战攻击会将敌人击退，未加箭头的飞镖通常会造成 +%1$d 点伤害，加箭头的飞镖会在 7x7 的范围内施加效果，并且通常会持续使用 +%2$d 次。
items.weapon.melee.crossbow.typical_stats_desc=通常情况下，装备此武器后，投掷的飞镖会受到 _%1$d-%2$d 伤害_，甚至还会将其附魔效果赋予飞镖。
items.weapon.melee.crossbow.upgrade_ability_stat_name=能力提升
items.weapon.melee.cudgel.ability_desc=决斗者可以使用棍棒发动重击。如果此集中攻击使敌人措手不及，则会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未使敌人措手不及，则只会造成普通伤害。
items.weapon.melee.cudgel.ability_name=重击
items.weapon.melee.cudgel.desc=一把小型黄铜权杖，与其说是冒险武器，不如说是贵族们的自卫工具。
items.weapon.melee.cudgel.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.melee.cudgel.name=棍棒
items.weapon.melee.cudgel.stats_desc=这是一件相当精准的武器。
items.weapon.melee.cudgel.typical_ability_desc=决斗者可以使用棍棒发动重击。这种集中攻击如果使敌人措手不及，通常会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未能使敌人措手不及，则造成普通伤害。
items.weapon.melee.dagger.ability_desc=决斗者可以使用匕首进行潜行。此能力使决斗者瞬间闪现至多5格远，并获得%d回合的隐身效果。
items.weapon.melee.dagger.ability_name=潜行
items.weapon.melee.dagger.desc=一把简单的铁匕首，配有磨损的木柄。
items.weapon.melee.dagger.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.melee.dagger.name=匕首
items.weapon.melee.dagger.stats_desc=这种武器对毫无防备的敌人效果更佳。
items.weapon.melee.dagger.typical_ability_desc=决斗者在使用匕首时可以潜行。这项能力可以让决斗者瞬间闪现到最多5格远的地方，通常会赋予她%d回合的隐身效果。
items.weapon.melee.dagger.upgrade_ability_stat_name=能力持续时间
items.weapon.melee.dirk.ability_desc=决斗者在使用匕首时可以潜行。此能力使决斗者瞬间闪现至多4格远，并获得%d回合的隐身效果。
items.weapon.melee.dirk.ability_name=潜行
items.weapon.melee.dirk.desc=更长的刺刀，能提供更多的钢材刺入敌人体内。
items.weapon.melee.dirk.name=短剑
items.weapon.melee.dirk.stats_desc=这种武器对毫无防备的敌人效果更佳。
items.weapon.melee.dirk.typical_ability_desc=决斗者在使用匕首时可以潜行。这项能力可以让决斗者瞬间闪现到最多4格之外，通常会赋予她%d回合的隐身效果。
items.weapon.melee.dirk.upgrade_ability_stat_name=能力持续时间
items.weapon.melee.flail$spinabilitytracker.desc=决斗者正在旋转她的连枷，积攒伤害以进行下一次普通攻击。每次旋转消耗一回合，但会增加伤害，最多可旋转三次。旋转期间，连枷必定命中。当前旋转次数：剩余回合数：2。
items.weapon.melee.flail$spinabilitytracker.name=旋转
items.weapon.melee.flail.ability_desc=决斗者可以旋转连枷来积蓄力量，持续一段时间。每次旋转连枷，其下一次普通攻击都会造成额外伤害，最多可叠加3次。旋转的连枷必定命中。只有开始旋转连枷才会消耗一点能量。
items.weapon.melee.flail.ability_name=旋转
items.weapon.melee.flail.desc=一个带刺的球，通过一条链子连接到一个把手上。虽然非常笨重，但如果击中要害，威力巨大。
items.weapon.melee.flail.name=连枷
items.weapon.melee.flail.spin_warn=你不能再转动连枷了。
items.weapon.melee.flail.stats_desc=这是一把精度不高的武器。这把武器无法进行突袭。
items.weapon.melee.flail.typical_ability_desc=决斗者可以旋转连枷来积蓄力量，持续一段时间。每次旋转连枷，通常会在下一次普通攻击中造成+%d点伤害，最多可触发3次。旋转的连枷必定命中。只有开始旋转连枷才会消耗一点能量。
items.weapon.melee.gauntlet.ability_desc=决斗者可以使用石拳套发动连击。此攻击必定命中，并且每次决斗者使用普通近战或投掷武器攻击命中目标后，都会造成额外伤害（+%d）。如果连续5回合未命中目标，则连击将被重置。
items.weapon.melee.gauntlet.ability_name=连击
items.weapon.melee.gauntlet.desc=这副巨大的护手由深红色织物制成，表面覆盖着厚重的魔法石层。织物紧紧包裹着你，使厚实的石板如同第二层皮肤般贴合。挥舞如此沉重的武器需要强大的力量，但也能赋予你的攻击惊人的威力。
items.weapon.melee.gauntlet.name=石手套
items.weapon.melee.gauntlet.stats_desc=这是一种速度非常快的武器。
items.weapon.melee.gauntlet.typical_ability_desc=决斗者可以使用石拳套发动连击。此攻击必定命中，并且通常会造成额外伤害，伤害值等于决斗者每次使用普通近战或投掷武器攻击命中目标后的伤害值。如果连续5回合未命中目标，则连击将被重置。
items.weapon.melee.glaive.ability_desc=决斗者可以使用长柄刀的尖端刺击范围内但不在相邻位置的敌人。这会造成 %1$d-%2$d 点伤害，击退敌人，并且必定命中。
items.weapon.melee.glaive.ability_name=长钉
items.weapon.melee.glaive.desc=一种巨大的长柄武器，由一根杆子末端装上剑刃组成。
items.weapon.melee.glaive.name=长柄刀
items.weapon.melee.glaive.stats_desc=这把武器速度较慢。这把武器射程更远。
items.weapon.melee.glaive.typical_ability_desc=决斗者可以使用长柄刀的刀尖刺击范围内但不在相邻位置的敌人。这通常会造成 %1$d-%2$d 点伤害，击退敌人，并且必定命中。
items.weapon.melee.gloves.ability_desc=决斗者可以使用镶钉手套发动连击。此攻击必定命中，并且每次决斗者使用普通近战或投掷武器攻击命中目标后，都会造成额外伤害（+%d）。如果连续5回合未命中目标，则连击将被重置。
items.weapon.melee.gloves.ability_name=连击
items.weapon.melee.gloves.desc=这些带铆钉的手套虽然不能提供任何真正的保护，但它们可以作为一种实用的武器，同时还能解放双手。
items.weapon.melee.gloves.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.melee.gloves.name=铆钉手套
items.weapon.melee.gloves.stats_desc=这是一种速度非常快的武器。
items.weapon.melee.gloves.typical_ability_desc=决斗者可以使用镶钉手套发动连击。此攻击必定命中，并且通常会造成额外伤害，伤害值等于决斗者每次使用普通近战或投掷武器攻击命中目标后的伤害值。如果连续5回合未命中目标，则连击将被重置。
items.weapon.melee.greataxe.ability_desc=决斗者生命值低于 50 时，可以使用巨斧发动复仇攻击。此毁灭性攻击造成 1-2 点伤害，必定命中，若击杀敌人则立即生效。
items.weapon.melee.greataxe.ability_name=报应
items.weapon.melee.greataxe.desc=这把巨型战斧设计成肩扛式使用，威力巨大，重量也相当惊人。
items.weapon.melee.greataxe.name=巨斧
items.weapon.melee.greataxe.stats_desc=这件武器非常重。
items.weapon.melee.greataxe.typical_ability_desc=决斗者生命值低于 50 时，可以使用巨斧发动复仇攻击。此毁灭性攻击通常会造成 1-2 点伤害，必定命中，若击杀敌人则立即生效。
items.weapon.melee.greatshield.ability_desc=决斗者可以使用巨盾保护自己，在_%d回合内完全抵挡所有针对她的物理或魔法攻击。决斗者格挡攻击后，若再进行反击或使用魔法，防御状态将会结束。
items.weapon.melee.greatshield.ability_name=警卫
items.weapon.melee.greatshield.desc=与其说是盾牌，不如说是移动的墙，这巨大的金属块有助于防御，但却几乎没有留下任何进攻空间。
items.weapon.melee.greatshield.name=大盾
items.weapon.melee.greatshield.stats_desc=这把武器可以抵挡 0-%d 点伤害。抵挡效果会随着升级而提升。
items.weapon.melee.greatshield.typical_ability_desc=决斗者可以使用巨盾保护自己，完全抵挡所有针对她的物理或魔法攻击，通常持续_%d回合_。决斗者格挡攻击后，若再进行反击或使用魔法，防御状态将会结束。
items.weapon.melee.greatshield.typical_stats_desc=通常情况下，这把武器可以抵挡 0-%d 点伤害。抵挡效果会随着升级而提升。
items.weapon.melee.greatshield.upgrade_ability_stat_name=能力持续时间
items.weapon.melee.greatsword.ability_desc=决斗者可以使用巨剑对敌人进行劈砍。此技能造成 %1$d-%2$d 点伤害，且必定命中。如果劈砍击杀敌人，则击杀立即生效，决斗者可在 5 回合内再次免费使用劈砍。
items.weapon.melee.greatsword.ability_name=劈开
items.weapon.melee.greatsword.desc=这把高耸的刀刃每次挥动都会倾注其自身重量，造成巨大伤害。
items.weapon.melee.greatsword.name=巨剑
items.weapon.melee.greatsword.typical_ability_desc=决斗者可以使用巨剑对敌人进行劈砍。此技能通常会造成 %1$d-%2$d 点伤害，并且必定命中。如果劈砍击杀了敌人，则击杀立即生效，决斗者可以在 5 回合内再次免费使用劈砍。
items.weapon.melee.handaxe.ability_desc=决斗者可以使用手斧发动重击。如果重击使敌人措手不及，则会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未能使敌人措手不及，则造成普通伤害。
items.weapon.melee.handaxe.ability_name=重击
items.weapon.melee.handaxe.desc=轻型斧头，最常用于砍伐树木。宽大的斧刃对付敌人也十分有效。
items.weapon.melee.handaxe.name=手斧
items.weapon.melee.handaxe.stats_desc=这是一件相当精准的武器。
items.weapon.melee.handaxe.typical_ability_desc=决斗者可以使用手斧发动重击。这种集中攻击如果使敌人措手不及，通常会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未能使敌人措手不及，则造成普通伤害。
items.weapon.melee.katana.ability_desc=决斗者可以挥舞武士刀向1格外的敌人发起突刺。此攻击会向敌人移动，造成_%1$d-%2$d点伤害_，并且必定命中。
items.weapon.melee.katana.ability_name=弓步
items.weapon.melee.katana.desc=一把细长的剑，剑柄上方有一个大型金属护手。
items.weapon.melee.katana.name=武士刀
items.weapon.melee.katana.stats_desc=这件武器可以抵挡0-3点伤害。
items.weapon.melee.katana.typical_ability_desc=决斗者可以挥舞武士刀向1格外的敌人发起突刺。此攻击会向敌人移动，通常会造成_%1$d-%2$d点伤害_，并且必定命中。
items.weapon.melee.longsword.ability_desc=决斗者可以使用长剑对敌人进行劈砍。此技能造成 %1$d-%2$d 点伤害，且必定命中。如果劈砍击杀敌人，则击杀立即生效，决斗者可在 5 回合内再次免费使用劈砍。
items.weapon.melee.longsword.ability_name=劈开
items.weapon.melee.longsword.desc=这把剑锋利的长钢刃闪闪发光，令人安心，不过它的尺寸也让它相当重。
items.weapon.melee.longsword.name=长剑
items.weapon.melee.longsword.typical_ability_desc=决斗者可以使用长剑对敌人进行劈砍。此技能通常会造成 %1$d-%2$d 点伤害，并且必定命中。如果劈砍击杀了敌人，则击杀立即生效，决斗者可以在 5 回合内再次免费使用劈砍。
items.weapon.melee.mace.ability_desc=决斗者可以使用钉头锤发动重击。如果重击使敌人措手不及，则会造成_%1$d-%2$d点伤害，并使其眩晕5回合，期间命中率和闪避率降低50%%点。重击必定命中，但如果未能使敌人措手不及，则只会造成普通伤害。
items.weapon.melee.mace.ability_name=重击
items.weapon.melee.mace.desc=这种武器硕大的铁质头部能造成巨大的伤害。
items.weapon.melee.mace.name=锤
items.weapon.melee.mace.stats_desc=这是一件相当精准的武器。
items.weapon.melee.mace.typical_ability_desc=决斗者可以使用钉头锤发动重击。这种集中攻击如果使敌人措手不及，通常会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未能使敌人措手不及，则只会造成普通伤害。
items.weapon.melee.magesstaff.ac_imbue=浸润
items.weapon.melee.magesstaff.ac_zap=ZAP
items.weapon.melee.magesstaff.cursed_wand=这根法杖被诅咒了，使其魔法变得混乱而随机。
items.weapon.melee.magesstaff.desc=这根法杖由法师亲自打造，是一件独特的魔法武器，可以附魔。
items.weapon.melee.magesstaff.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.melee.magesstaff.has_wand=员工目前被赋予了_%s。_
items.weapon.melee.magesstaff.imbue=你让你的员工充满 %s。
items.weapon.melee.magesstaff.imbue_cursed=如果你给一根被诅咒的魔杖附魔，那么你的法杖也会被诅咒！
items.weapon.melee.magesstaff.imbue_desc=你确定要将这根魔杖附魔到你的法杖上吗？如果被附魔的魔杖等级与法杖等级相同或更高，则法杖将继承该魔杖的等级，外加自身的一项升级。
items.weapon.melee.magesstaff.imbue_level=这次灌注将产生一个_+%d法杖。_
items.weapon.melee.magesstaff.imbue_lost=你法杖上目前附有魔杖的力量将会消失。
items.weapon.melee.magesstaff.imbue_talent=你法杖中当前附魔的魔杖将以+0的状态归还。
items.weapon.melee.magesstaff.imbue_unknown=你不知道这根魔杖的等级，但这次附魔至少会得到一根_+%d级法杖。_
items.weapon.melee.magesstaff.name=法师之杖
items.weapon.melee.magesstaff.no=不，我改变主意了。
items.weapon.melee.magesstaff.no_wand=这根法杖目前没有魔法，必须先注入魔杖的力量才能用来施法。
items.weapon.melee.magesstaff.preserved=之前的魔杖被保存了下来！
items.weapon.melee.magesstaff.prompt=选择一根魔杖
items.weapon.melee.magesstaff.yes=是的，我确定
items.weapon.melee.meleeweapon.ability_cant_use=你现在还不能使用这项能力。
items.weapon.melee.meleeweapon.ability_low_str=你的力量不足以使用这件武器的能力。
items.weapon.melee.meleeweapon.ability_need_equip=你必须装备该武器才能使用它的能力。
items.weapon.melee.meleeweapon.ability_no_charge=你没有足够的精力来使用那种能力。
items.weapon.melee.meleeweapon.ability_no_target=那里没有目标。
items.weapon.melee.meleeweapon.ability_occupied=该位置已被占用。
items.weapon.melee.meleeweapon.ability_target_range=目标不在射程内。
