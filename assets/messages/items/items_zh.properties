items.armor.warriorarmor.desc=穿上这套厚重的板甲后，战士可以施展特殊能力。
items.armor.warriorarmor.name=英雄的板甲
items.artifacts.alchemiststoolkit.ac_brew=酿造
items.artifacts.alchemiststoolkit.ac_energize=通电
items.artifacts.alchemiststoolkit.cursed=你那该死的工具包让你无法使用炼金术！
items.artifacts.alchemiststoolkit.desc=这套工具包包含多种试剂和草药，以及一个小型混合瓶，方便随时随地进行炼金术实验。瓶中装着液态的、看起来像是炼金能量晶体的物质。
items.artifacts.alchemiststoolkit.desc_cursed=这套被诅咒的工具箱已经束缚在你身边，不让你使用炼金术。
items.artifacts.alchemiststoolkit.desc_hint=随着经验的积累，你装备的工具箱会缓慢产生炼金能量。看起来，向小瓶中的混合物中添加能量晶体可以增强其效果。
items.artifacts.alchemiststoolkit.desc_warming=工具包目前正在预热，稍等片刻即可使用。
items.artifacts.alchemiststoolkit.energize_1=6点能量：+1级
items.artifacts.alchemiststoolkit.energize_all=%1$d 能量：+%2$d 水平
items.artifacts.alchemiststoolkit.energize_desc=每收集 6 个能量水晶，工具包就能获得足够的能量升级，升级后工具包的能量生成速度和升温速度都会加快。您想使用多少能量？
items.artifacts.alchemiststoolkit.name=炼金术士的工具箱
items.artifacts.alchemiststoolkit.need_energy=你至少需要6点能量。
items.artifacts.alchemiststoolkit.not_ready=你的工具包还没完全预热。
items.artifacts.artifact.cannot_wear_two=你不能佩戴两件相同的圣物。
items.artifacts.artifact.curse_known=你能感觉到这件神器中潜藏着一股邪恶的魔法。
items.artifacts.artifact.equip_cursed=这件神器会痛苦地与你紧紧相连。
items.artifacts.artifact.need_to_equip=你需要装备你的神器才能做到这一点。
items.artifacts.artifact.not_cursed=这件神器没有邪恶魔法。
items.artifacts.capeofthorns$thorns.desc=你的披风散发着能量，在你周围形成一个偏转力场！荆棘效果激活期间，你受到的所有伤害都会减少。此外，如果攻击者在你旁边，减少的伤害会反弹给攻击者。荆棘效果剩余回合数：0。
items.artifacts.capeofthorns$thorns.inert=你的披风再次变得无法使用。
items.artifacts.capeofthorns$thorns.levelup=你的披风变得更强了！
items.artifacts.capeofthorns$thorns.name=荆棘
items.artifacts.capeofthorns$thorns.radiating=你的披风开始散发能量，你感到受到了保护！
items.artifacts.capeofthorns.desc=DM-300残骸的金属片坍塌后聚合成一件坚硬的披风。它似乎储存着巨大的能量，或许蕴含着DM-300的部分力量？
items.artifacts.capeofthorns.desc_active=这件披风似乎在释放储存的能量，散发出一种保护性的力量。
items.artifacts.capeofthorns.desc_inactive=披风压在肩上，沉甸甸的，让人感到安心，它似乎能从你受到的伤害中汲取能量。
items.artifacts.capeofthorns.name=荆棘斗篷
items.artifacts.chaliceofblood.ac_prick=刺
items.artifacts.chaliceofblood.desc=这个闪亮的银圣杯边缘装饰着奇特的尖锐宝石。
items.artifacts.chaliceofblood.desc_1=当你手捧圣杯时，你会莫名其妙地想要用尖锐的宝石刺破自己。
items.artifacts.chaliceofblood.desc_2=你的一部分血液汇聚在圣杯中，你能隐约感觉到圣杯正将生命能量注入你的体内，增强你的自然健康再生能力。即使明知会很痛，你仍然想用圣杯割伤自己。
items.artifacts.chaliceofblood.desc_3=圣杯盛满了你的生命精华。你能感觉到圣杯正在将生命能量重新注入你的体内。
items.artifacts.chaliceofblood.desc_cursed=被诅咒的圣杯已经束缚在你的手上，并抑制了你恢复生命值的能力。
items.artifacts.chaliceofblood.name=血之圣杯
items.artifacts.chaliceofblood.no=不，我改变主意了。
items.artifacts.chaliceofblood.ondeath=圣杯会吸干你的生命精华……
items.artifacts.chaliceofblood.onprick=你刺破自己，你的生命精华流入圣杯。
items.artifacts.chaliceofblood.prick_warn=每次使用圣杯都会消耗你的生命能量，但作为交换，你的自然生命恢复能力也会得到提升。目前，刺伤自己会造成_%1$d-%2$d点伤害，但这种伤害可以通过_物理和魔法格挡或伤害减免_来降低。如果不考虑伤害减免效果，刺伤自己目前有_%3$s%%点几率_完全耗尽你的生命力。你确定要继续向圣杯提供生命能量吗？
items.artifacts.chaliceofblood.yes=是的，我知道自己在做什么。
items.artifacts.cloakofshadows$cloakstealth.desc=你的暗影斗篷赋予你隐身能力，当你被它遮蔽时，隐身状态将持续到斗篷能量耗尽或斗篷效果消失为止。隐身期间，敌人无法攻击或追踪你。物理攻击和魔法效果（例如卷轴和魔杖）会立即解除隐身状态。使用暗影斗篷前的回合数：0。
items.artifacts.cloakofshadows$cloakstealth.levelup=你的斗篷变得更坚固了！
items.artifacts.cloakofshadows$cloakstealth.name=隐蔽的
items.artifacts.cloakofshadows$cloakstealth.no_charge=你的斗篷能量耗尽了。
