items.artifacts.driedrose$ghosthero.desc=一个身形缥缈、人形缥缈的身影。它的力量似乎与你拥有的那朵玫瑰有关。这个幽灵或许并不强大，但它似乎是你在这里唯一真正的朋友。
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=为什么会发生这种情况？我以为我们成功了？
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=那东西为何至今仍能影响这个世界？
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=我希望你知道该如何使用那个护身符。
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=看来我们还没完呢。
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=我们已经走了这么远，一定能完成这件事！
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=再走一小段路，我们就能出去了！
items.artifacts.driedrose$ghosthero.dialogue_caves_1=这里已经很久没有人类或矮人居住过了。
items.artifacts.driedrose$ghosthero.dialogue_caves_2=什么原因会导致矮人放弃金矿？
items.artifacts.driedrose$ghosthero.dialogue_caves_3=可惜的是，这里所有的黄金在地表上都毫无用处。
items.artifacts.driedrose$ghosthero.dialogue_caves_4=这里的生物都扭曲变形，就像下水道里的生物一样。
items.artifacts.driedrose$ghosthero.dialogue_caves_5=就连这里的蝙蝠都嗜血成性。
items.artifacts.driedrose$ghosthero.dialogue_caves_6=没有发现任何采矿设备的踪迹，矮人们都把矿场全部收回了吗？
items.artifacts.driedrose$ghosthero.dialogue_city_1=矮人们勤劳，但贪婪。
items.artifacts.driedrose$ghosthero.dialogue_city_2=矮人大都会真的陷落了。
items.artifacts.driedrose$ghosthero.dialogue_city_3=我希望地表永远不会变成这里这样。
items.artifacts.driedrose$ghosthero.dialogue_city_4=矮人不应该看起来这么苍白。
items.artifacts.driedrose$ghosthero.dialogue_city_5=我不知道哪个更糟糕，是矮人，还是他们的造物。
items.artifacts.driedrose$ghosthero.dialogue_city_6=看来矮人们现在也变成了没有理智的怪物。
items.artifacts.driedrose$ghosthero.dialogue_halls_1=这是什么地方？
items.artifacts.driedrose$ghosthero.dialogue_halls_2=这个地方太可怕了……
items.artifacts.driedrose$ghosthero.dialogue_halls_3=矮人们究竟在想什么，竟然如此玩弄权力？
items.artifacts.driedrose$ghosthero.dialogue_halls_4=这里的怪物来自另一个世界，它们究竟是从哪里来的？
items.artifacts.driedrose$ghosthero.dialogue_halls_5=你能感觉到吗？感觉好像有什么东西在看着我们。
items.artifacts.driedrose$ghosthero.dialogue_halls_6=幸好有手电筒，这里太黑了！
items.artifacts.driedrose$ghosthero.dialogue_prison_1=我听说过一些关于这个地方的传闻，都不是什么好话。
items.artifacts.driedrose$ghosthero.dialogue_prison_2=这里与其说是监狱，不如说更像个地牢。
items.artifacts.driedrose$ghosthero.dialogue_prison_3=我无法想象这个地方被废弃时发生了什么。
items.artifacts.driedrose$ghosthero.dialogue_prison_4=囚犯和狱警似乎都变成了怪物。
items.artifacts.driedrose$ghosthero.dialogue_prison_5=这些骸骨究竟是什么原因造成的？
items.artifacts.driedrose$ghosthero.dialogue_prison_6=这些人本不该落得如此下场……
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=这些下水道以前很安全，甚至冬天也有人住在这里。
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=我想知道那些巡逻队员都怎么样了，他们放弃了吗？
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=我的家人在地面上，希望他们平安无事。
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=守卫们无法战胜这些怪物，但也许我们可以。
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=如果连下水道都这么危险，真不知道下面是什么样……
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=是什么原因导致这些老鼠和螃蟹长得这么大？
items.artifacts.driedrose$ghosthero.direct_prompt=我应该怎么办？
items.artifacts.driedrose$ghosthero.directed_attack_1=好的，我来攻克这个问题。
items.artifacts.driedrose$ghosthero.directed_attack_2=我来买那个。
items.artifacts.driedrose$ghosthero.directed_attack_3=引人入胜……
items.artifacts.driedrose$ghosthero.directed_attack_4=去抓他们！
items.artifacts.driedrose$ghosthero.directed_attack_5=我已经有了。
items.artifacts.driedrose$ghosthero.directed_follow_1=好的，我跟随你。
items.artifacts.driedrose$ghosthero.directed_follow_2=我跟在你后面。
items.artifacts.driedrose$ghosthero.directed_follow_3=正在关注你……
items.artifacts.driedrose$ghosthero.directed_follow_4=好，我们走吧！
items.artifacts.driedrose$ghosthero.directed_follow_5=我会保护你。
items.artifacts.driedrose$ghosthero.directed_position_1=好的，我坚持这个立场。
items.artifacts.driedrose$ghosthero.directed_position_2=我会去那里捍卫自己。
items.artifacts.driedrose$ghosthero.directed_position_3=重新定位……
items.artifacts.driedrose$ghosthero.directed_position_4=我在途中！
items.artifacts.driedrose$ghosthero.directed_position_5=我过去看看。
items.artifacts.driedrose$ghosthero.discover_hint=你可以通过一件特定的神器找到这个角色。
items.artifacts.driedrose$ghosthero.hello=你好 %s。
items.artifacts.driedrose$ghosthero.introduce=我的灵魂与这朵玫瑰紧紧相连，它对我来说无比珍贵，是我留在人世间的爱人送给我的礼物。我无法回到他身边，但多亏了你，我才有了第二次机会完成我的旅程。当我能够做到时，我会回应你的召唤，与你并肩作战。只要你拥有这朵玫瑰，我就能听到你的声音，你可以用它在远方指引我。但愿你能在我失败的地方取得成功……
items.artifacts.driedrose$ghosthero.name=悲伤的鬼魂
items.artifacts.driedrose$ghosthero.player_killed_1=不！...
items.artifacts.driedrose$ghosthero.player_killed_2=我帮不了他们……
items.artifacts.driedrose$ghosthero.player_killed_3=不是这样的……
items.artifacts.driedrose$ghosthero.seen_dm300_1=只有矮人才会建造能杀死入侵者的采矿机器。
items.artifacts.driedrose$ghosthero.seen_dm300_2=那东西真大……
items.artifacts.driedrose$ghosthero.seen_dm300_3=这东西怎么能一直保持活跃状态？
items.artifacts.driedrose$ghosthero.seen_goo_1=小心黏糊糊的东西！
items.artifacts.driedrose$ghosthero.seen_goo_2=我的很多朋友都死于这种东西，是时候复仇了！
items.artifacts.driedrose$ghosthero.seen_goo_3=这种可憎之物绝不能存活！
items.artifacts.driedrose$ghosthero.seen_king_1=人们常说权力使人腐败，指的就是这个意思。
items.artifacts.driedrose$ghosthero.seen_king_2=他现在更像个巫妖而不是国王。
items.artifacts.driedrose$ghosthero.seen_king_3=即使在死后，矮人们依然服从他们的主人。
items.artifacts.driedrose$ghosthero.seen_tengu_1=剩下的唯一一个囚犯是个冷血杀手。当然……
items.artifacts.driedrose$ghosthero.seen_tengu_2=他把我们困住了！
items.artifacts.driedrose$ghosthero.seen_tengu_3=我听说过很多关于那款面具的恐怖故事……
items.artifacts.driedrose$ghosthero.seen_yog_1=哦，情况不太妙。
items.artifacts.driedrose$ghosthero.seen_yog_2=这就是神的样子吗？
items.artifacts.driedrose$ghosthero.seen_yog_3=这会很疼……
