items.weapon.melee.meleeweapon.probably_too_heavy=这件武器可能对你来说太重了。
items.weapon.melee.meleeweapon.prompt=选择目标
items.weapon.melee.meleeweapon.stats_known=这把 _tier-%1$d_ 近战武器造成 _%2$d-%3$d 点伤害，需要 _%4$d 点力量才能正确使用。
items.weapon.melee.meleeweapon.stats_unknown=通常情况下，这把 _tier-%1$d_ 近战武器造成 _%2$d-%3$d 点伤害，并且需要 _%4$d 点力量才能正确使用。
items.weapon.melee.meleeweapon.swap=交换武器
items.weapon.melee.meleeweapon.swap_full=库存充足的情况下，你无法做到这一点。
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=技能伤害
items.weapon.melee.quarterstaff$defensivestance.desc=决斗者正用她的短棍格挡来袭的攻击和投射物。只要她保持这种姿态，她对所有攻击的闪避率就会提高三倍。剩余回合数：\n\n。
items.weapon.melee.quarterstaff$defensivestance.name=防御姿态
items.weapon.melee.quarterstaff.ability_desc=决斗者可以摆出使用长棍的防御姿态。此姿态无需任何时间即可激活，并使其闪避率在接下来的 %d 回合内提升至三倍。
items.weapon.melee.quarterstaff.ability_name=防御姿态
items.weapon.melee.quarterstaff.desc=一根硬木杖，杖头套着铁。
items.weapon.melee.quarterstaff.name=四分之一杖
items.weapon.melee.quarterstaff.stats_desc=这件武器可以抵挡0-2点伤害。
items.weapon.melee.quarterstaff.typical_ability_desc=决斗者可以使用长棍摆出防御姿态。此姿态无需任何时间即可激活，并且通常会在_%d回合内使其闪避率提升至三倍。
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=能力持续时间
items.weapon.melee.rapier.ability_desc=决斗者可以用细剑向1格外的敌人发起突刺。突刺会向敌人移动，造成_%1$d-%2$d点伤害_，并且必定命中。
items.weapon.melee.rapier.ability_name=弓步
items.weapon.melee.rapier.desc=一把纤细的直剑，以较小的劈砍威力为代价，提供了一定的防护能力。
items.weapon.melee.rapier.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.melee.rapier.name=细剑
items.weapon.melee.rapier.stats_desc=这件武器可以抵挡0-1点伤害。
items.weapon.melee.rapier.typical_ability_desc=决斗者可以用细剑向 1 格外的敌人发起突刺。此攻击会向敌人移动，通常会造成 _%1$d-%2$d 点伤害_，并且必定命中。
items.weapon.melee.roundshield$guardtracker.desc=决斗者已准备好盾牌，以应对即将到来的攻击。对她发动的物理或魔法攻击将被完全抵消。剩余回合数：\n\n。
items.weapon.melee.roundshield$guardtracker.guarded=守卫
items.weapon.melee.roundshield$guardtracker.name=守护
items.weapon.melee.roundshield.ability_desc=决斗者可以使用圆形盾牌保护自己，在_%d回合内完全抵挡所有针对她的物理或魔法攻击。决斗者格挡攻击后，若再进行反击或使用魔法，防御状态将会结束。
items.weapon.melee.roundshield.ability_name=警卫
items.weapon.melee.roundshield.desc=这面大盾牌能有效阻挡攻击，在紧急情况下也能作为不错的武器。
items.weapon.melee.roundshield.name=圆形盾牌
items.weapon.melee.roundshield.stats_desc=这把武器可以抵挡 0-%d 点伤害。抵挡效果会随着升级而提升。
items.weapon.melee.roundshield.typical_ability_desc=决斗者可以使用圆形盾牌保护自己，完全抵挡所有针对她的物理或魔法攻击，通常持续_%d回合_。决斗者格挡攻击后，若反击或使用魔法，防御状态将结束。
items.weapon.melee.roundshield.typical_stats_desc=通常情况下，这把武器可以抵挡 0-%d 点伤害。抵挡效果会随着升级而提升。
items.weapon.melee.roundshield.upgrade_ability_stat_name=能力持续时间
items.weapon.melee.runicblade.ability_desc=决斗者可以使用符文之刃施展符文斩击。此攻击必定命中，并具有+%d%%的附魔威力。
items.weapon.melee.runicblade.ability_name=符文斩
items.weapon.melee.runicblade.desc=来自遥远国度的神秘武器，拥有明亮的蓝色刀刃。
items.weapon.melee.runicblade.name=符文之刃
items.weapon.melee.runicblade.stats_desc=这件武器升级后收益更大。
items.weapon.melee.runicblade.typical_ability_desc=决斗者可以使用符文之刃施展符文斩击。此攻击必定命中，通常具有+%d%%的附魔威力。
items.weapon.melee.runicblade.upgrade_ability_stat_name=能力强度
items.weapon.melee.sai$combostriketracker.desc=决斗者正在积累连击，该连击可用于提升连击技能的伤害。每次成功的普通近战攻击或投掷武器攻击都会累积连击，但如果连续5回合未成功攻击，则连击将被重置。最近命中次数：\n\n。\n\n。剩余回合数：%2$s。
items.weapon.melee.sai$combostriketracker.name=连击
items.weapon.melee.sai.ability_desc=决斗者可以使用三叉戟发动连击。此攻击必定命中，并且每次决斗者使用普通近战或投掷武器攻击命中目标后，都会造成额外伤害（+%d）。如果连续5回合未命中目标，则连击将被重置。
items.weapon.melee.sai.ability_name=连击
items.weapon.melee.sai.desc=两把纤细的刀刃，每把都设计成单手挥舞。非常适合用连环斩击迅速击溃敌人。
items.weapon.melee.sai.name=赛
items.weapon.melee.sai.stats_desc=这是一种速度非常快的武器。
items.weapon.melee.sai.typical_ability_desc=决斗者可以使用三叉戟发动连击。此攻击必定命中，并且通常会造成额外伤害，伤害值等于决斗者每次使用普通近战或投掷武器攻击命中目标后的伤害值。如果连续5回合未命中目标，则连击将被重置。
items.weapon.melee.scimitar$sworddance.desc=决斗者以迅猛的动量进行攻击，如同舞蹈一般。在此姿态激活期间，她的攻击速度提升 60%%（足以让她每回合用弯刀攻击两次），命中率提升 50%%。剩余回合数：%s。
items.weapon.melee.scimitar$sworddance.name=剑舞
items.weapon.melee.scimitar.ability_desc=决斗者可以使用弯刀施展剑舞。此姿态无需等待即可激活，并使决斗者在接下来的 2 回合内获得 +60 攻击速度和 +50 命中率。
items.weapon.melee.scimitar.ability_name=剑舞
items.weapon.melee.scimitar.desc=一把厚重的弯刀。这种形状使其攻击速度更快，但威力稍弱。
items.weapon.melee.scimitar.name=弯刀
items.weapon.melee.scimitar.stats_desc=这是一种速度相当快的武器。
items.weapon.melee.scimitar.typical_ability_desc=决斗者可以使用弯刀施展剑舞。此姿态无需任何时间即可激活，并使决斗者获得+60攻击速度和+50命中率，通常持续_2回合_。
items.weapon.melee.scimitar.upgrade_ability_stat_name=能力持续时间
items.weapon.melee.shortsword.ability_desc=决斗者可以使用短剑对敌人进行劈砍。此技能造成 %1$d-%2$d 点伤害，且必定命中。如果劈砍击杀敌人，则立即生效，决斗者可在 5 回合内再次免费使用劈砍。
items.weapon.melee.shortsword.ability_name=劈开
items.weapon.melee.shortsword.desc=这是一把很短的剑，只比匕首长几英寸。
items.weapon.melee.shortsword.name=短剑
items.weapon.melee.shortsword.typical_ability_desc=决斗者可以使用短剑对敌人进行劈砍。此技能通常会造成 %1$d-%2$d 点伤害，并且必定命中。如果劈砍击杀了敌人，则击杀立即生效，决斗者可以在 5 回合内再次免费使用劈砍。
items.weapon.melee.sickle.ability_desc=决斗者可以用镰刀收割敌人。这一毁灭性的攻击必定命中，造成_%d点伤害。如果目标不免疫流血效果，则该伤害会转化为流血效果。
items.weapon.melee.sickle.ability_name=收成
items.weapon.melee.sickle.desc=一种手持式农具，也可作为威力强大但笨重的武器使用。
items.weapon.melee.sickle.name=镰刀
items.weapon.melee.sickle.stats_desc=这是一种精度较低的武器。
items.weapon.melee.sickle.typical_ability_desc=决斗者可以用镰刀收割敌人。这一毁灭性的攻击必定命中，通常会造成 %d 点伤害。如果目标不免疫流血效果，则该伤害会转化为流血效果。
items.weapon.melee.spear.ability_desc=决斗者可以使用长矛尖端刺击范围内但不在相邻位置的敌人。这会造成 %1$d-%2$d 点伤害，击退敌人，并且必定命中。
items.weapon.melee.spear.ability_name=长钉
items.weapon.melee.spear.desc=一根细长的木棍，顶端装有磨尖的铁棒。
items.weapon.melee.spear.name=矛
items.weapon.melee.spear.stats_desc=这把武器速度较慢。这把武器射程更远。
items.weapon.melee.spear.typical_ability_desc=决斗者可以使用长矛尖端刺击范围内但不在相邻位置的敌人。这通常会造成 %1$d-%2$d 点伤害，击退敌人，并且必定命中。
items.weapon.melee.sword$cleavetracker.desc=决斗者已准备好再次使用顺劈斩。下一次使用顺劈斩不会消耗任何武器技能充能。剩余回合数：\n\n。
items.weapon.melee.sword$cleavetracker.name=劈开
items.weapon.melee.sword.ability_desc=决斗者可以用剑劈砍敌人。此技能造成 %1$d-%2$d 点伤害，且必定命中。如果劈砍击杀敌人，则立即生效，决斗者可在 5 回合内再次免费使用劈砍。
items.weapon.melee.sword.ability_name=劈开
items.weapon.melee.sword.desc=这是一把平衡性很好的剑。尺寸适中，但比短剑明显长。
items.weapon.melee.sword.name=剑
items.weapon.melee.sword.typical_ability_desc=决斗者可以用剑对敌人进行劈砍。此技能通常会造成 %1$d-%2$d 点伤害，并且必定命中。如果劈砍击杀了敌人，则击杀立即生效，决斗者可以在 5 回合内再次免费使用劈砍。
items.weapon.melee.warhammer.ability_desc=决斗者可以使用战锤发动重击。如果重击使敌人措手不及，则会造成_%1$d-%2$d点伤害，并使其眩晕5回合，期间命中率和闪避率降低50%%点。重击必定命中，但如果未能使敌人措手不及，则只会造成普通伤害。
items.weapon.melee.warhammer.ability_name=重击
items.weapon.melee.warhammer.desc=很少有生物能够承受住这尊高耸的铅钢巨像的重击，但要有效地使用它需要极大的力量。
items.weapon.melee.warhammer.name=战锤
items.weapon.melee.warhammer.stats_desc=这是一件相当精准的武器。
items.weapon.melee.warhammer.typical_ability_desc=决斗者可以使用战锤发动重击。这种集中攻击如果使敌人措手不及，通常会造成_%1$d-%2$d点伤害，并使其眩晕5回合，降低50%%点命中率和闪避率。重击必定命中，但如果未能使敌人措手不及，则只会造成普通伤害。
items.weapon.melee.warscythe.ability_desc=决斗者可以用战镰收割敌人。这招威力巨大的攻击必定命中，造成 %d 点伤害。如果目标不免疫流血，则该伤害会转化为流血效果。
items.weapon.melee.warscythe.ability_name=收成
items.weapon.melee.warscythe.desc=这种笨重的大工具经过加固，使其更适合用来对付敌人而不是农作物。
items.weapon.melee.warscythe.name=战争镰刀
items.weapon.melee.warscythe.stats_desc=这是一种精度较低的武器。
items.weapon.melee.warscythe.typical_ability_desc=决斗者可以用战镰收割敌人。这项威力巨大的攻击必定命中，通常会造成 %d 点伤害。如果目标不免疫流血，则该伤害会以流血效果的形式生效。
items.weapon.melee.whip.ability_desc=决斗者可以用鞭子抽打周围所有敌人。此技能造成 %1$d-%2$d 点伤害，攻击范围内所有敌人，且必定命中。
items.weapon.melee.whip.ability_name=睫毛
items.weapon.melee.whip.desc=虽然这种武器末端的带倒钩的绳索造成的伤害很小，但它的攻击范围是无与伦比的。
items.weapon.melee.whip.name=鞭
items.weapon.melee.whip.stats_desc=这种武器射程极远。
items.weapon.melee.whip.typical_ability_desc=决斗者可以用鞭子抽打周围所有敌人。此技能通常会造成 %1$d-%2$d 点伤害，攻击范围内所有敌人，并且必定命中。
items.weapon.melee.wornshortsword.ability_desc=决斗者可以用一把破旧的短剑对敌人进行劈砍。此攻击造成_%1$d-%2$d点伤害，且必定命中。如果劈砍击杀了敌人，则击杀立即生效，决斗者可以在5回合内再次免费使用劈砍。
items.weapon.melee.wornshortsword.ability_name=劈开
items.weapon.melee.wornshortsword.desc=这是一把很短的剑，因长期使用而磨损严重。它比保存完好的短剑更脆弱也更轻一些。
items.weapon.melee.wornshortsword.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.melee.wornshortsword.name=磨损的短剑
items.weapon.melee.wornshortsword.typical_ability_desc=决斗者可以用一把破旧的短剑对敌人进行劈砍。这通常会造成 %1$d-%2$d 点伤害，并且必定命中。如果劈砍击杀了敌人，则击杀立即生效，决斗者可以在 5 回合内再次免费使用劈砍。
items.weapon.missiles.bolas.desc=这些不寻常的远程武器虽然杀伤力不大，但却能很好地减缓目标的速度。
items.weapon.missiles.bolas.name=博拉斯
items.weapon.missiles.bolas.stats_desc=这种武器能使目标丧失行动能力。
items.weapon.missiles.boomerang.desc=这种扁平弯曲的木制投掷物投向敌人后会返回到投掷者的手中。
items.weapon.missiles.boomerang.durability=由于其结构坚固，这款回旋镖不会因使用而损坏。
items.weapon.missiles.boomerang.name=回旋镖
items.weapon.missiles.darts.adrenalinedart.desc=这些飞镖的镖尖涂有以蓟草为原料的化合物，可以提升友军的移动速度和攻击速度，或短暂降低敌人的移动速度。飞镖本身仍然会对敌人造成伤害，但不会伤害友军。
items.weapon.missiles.darts.adrenalinedart.name=肾上腺素飞镖
items.weapon.missiles.darts.blindingdart.desc=这些飞镖的镖尖涂有以盲草为原料的化合物，能使目标短暂失明。但它们不会使目标失去方向感，所以敌人仍然会知道最后看到你的位置。
items.weapon.missiles.darts.blindingdart.name=致盲飞镖
items.weapon.missiles.darts.chillingdart.desc=这些飞镖的镖尖涂有冰盖基化合物，可以显著降低目标温度。
items.weapon.missiles.darts.chillingdart.name=令人胆寒的飞镖
items.weapon.missiles.darts.cleansingdart.desc=这些飞镖的镖尖涂有以魔力草为原料的化合物，能暂时使盟友免疫所有负面效果，或清除敌人身上的正面效果。敌人甚至可能短暂地忘记自己正在攻击或逃离你。飞镖本身仍然会对敌人造成伤害，但不会伤害盟友。
items.weapon.missiles.darts.cleansingdart.name=清洁飞镖
items.weapon.missiles.darts.dart.ac_tip=提示
items.weapon.missiles.darts.dart.desc=这些简单的木棍顶端装有尖刺，重量经过精心设计，飞行轨迹稳定，只需手腕轻轻一甩即可刺穿猎物。在木棍顶端绑上种子，投掷后还能获得额外效果。
items.weapon.missiles.darts.dart.name=镖
items.weapon.missiles.darts.dart.prompt=选择一颗种子
items.weapon.missiles.darts.dart.tip_all=尖端 %1$d 飞镖，带有 %2$d 种子
items.weapon.missiles.darts.dart.tip_cancel=取消
items.weapon.missiles.darts.dart.tip_desc=种子可以与一枚或两枚飞镖组合，用来制作镖尖。每种种子都会制作出专属的镖尖飞镖，具有独特的单次使用效果。用这些种子制作的镖尖飞镖会产生_%s。
items.weapon.missiles.darts.dart.tip_one=尖端 1 飞镖，带 1 颗种子
items.weapon.missiles.darts.dart.tip_title=飞镖尖端
items.weapon.missiles.darts.dart.tip_two=尖端 2 飞镖，1 个种子
items.weapon.missiles.darts.dart.unlimited_uses=由于结构简单，飞镖实际上可以永久使用。
items.weapon.missiles.darts.displacingdart.desc=这些飞镖的镖尖涂有以褪色叶为基础的化合物，可以将目标瞬间传送到一小段距离之外。
items.weapon.missiles.darts.displacingdart.name=移位飞镖
items.weapon.missiles.darts.healingdart.desc=这些飞镖的镖尖涂有以太阳草为原料的化合物，能为目标提供短暂的治疗效果。飞镖本身仍然会对敌人造成伤害，但不会伤害友军。
items.weapon.missiles.darts.healingdart.name=治疗飞镖
items.weapon.missiles.darts.holydart.desc=这些飞镖的镖尖涂有星花提取物，能将神圣能量注入目标体内。盟友和普通敌人会获得祝福，但亡灵或恶魔敌人会受到重创。飞镖本身对敌人仍然有害，但不会伤害盟友。
items.weapon.missiles.darts.holydart.name=圣镖
items.weapon.missiles.darts.incendiarydart.desc=这些飞镖的镖尖涂有火花化合物，撞击时会燃起耀眼的火焰。
items.weapon.missiles.darts.incendiarydart.name=燃烧镖
items.weapon.missiles.darts.paralyticdart.desc=这些飞镖的尖端涂有以土根为基础的化合物，可以短时间内麻痹目标。
items.weapon.missiles.darts.paralyticdart.name=麻痹镖
items.weapon.missiles.darts.poisondart.desc=这些飞镖的尖端涂有以苦苔藓为基础的化合物，可以毒害目标。
items.weapon.missiles.darts.poisondart.name=毒镖
items.weapon.missiles.darts.rotdart.desc=这些邪恶的飞镖尖端涂有酸性腐烂浆果化合物，能够迅速腐蚀飞镖接触到的任何物体。强大的敌人能够抵抗大部分腐蚀效果，但其腐蚀力足以轻易杀死大多数普通敌人。这些飞镖比其他尖端涂有腐蚀化合物的飞镖更持久，但其耐久度无法提升。
items.weapon.missiles.darts.rotdart.discover_hint=你可以使用特定任务中获得的种子来制作此物品。
items.weapon.missiles.darts.rotdart.name=腐烂飞镖
items.weapon.missiles.darts.shockingdart.desc=这些飞镖的镖尖涂有以风暴藤蔓为基础的化合物，会对目标造成剧烈的电击。
items.weapon.missiles.darts.shockingdart.name=电击飞镖
items.weapon.missiles.darts.tippeddart.about_to_break=你的飞镖镖尖快要失效了。
items.weapon.missiles.darts.tippeddart.ac_clean=干净的
items.weapon.missiles.darts.tippeddart.cancel=取消
items.weapon.missiles.darts.tippeddart.clean_all=全部清理干净
items.weapon.missiles.darts.tippeddart.clean_desc=此操作将去除飞镖上的种子尖端，使其恢复为普通飞镖。
items.weapon.missiles.darts.tippeddart.clean_one=干净的
items.weapon.missiles.darts.tippeddart.clean_title=清洁飞镖
items.weapon.missiles.darts.tippeddart.discover_hint=你可以在商店购买此物品，或者使用种子制作它。
items.weapon.missiles.darts.tippeddart.has_broken=你的飞镖镖尖已经失效了。
items.weapon.missiles.darts.tippeddart.unlimited_uses=但这些产品质量极高，实际上可以永久使用。
items.weapon.missiles.darts.tippeddart.uses_left=这叠飞镖在其中一个镖尖磨损之前还能使用 _%d/%d_ 次。
items.weapon.missiles.fishingspear.desc=虽然最初是为捕鱼而设计的，但这种小型投掷矛作为临时武器也非常好用。
items.weapon.missiles.fishingspear.name=鱼叉
items.weapon.missiles.forcecube.desc=这些形状奇特的魔法立方体体积小巧，可以握在手中，但却非常重。
items.weapon.missiles.forcecube.name=力立方体
items.weapon.missiles.forcecube.ondeath=你用自己的原力立方体自杀了……
items.weapon.missiles.forcecube.stats_desc=这种武器能将冲击力分散到一个很小的范围内，击中附近的一切物体。
items.weapon.missiles.heavyboomerang.desc=这个大型回旋镖难以有效使用，但能造成相当大的伤害。
items.weapon.missiles.heavyboomerang.name=重型回旋镖
items.weapon.missiles.heavyboomerang.stats_desc=这件武器会在五回合后返回到投掷点。
items.weapon.missiles.javelin.desc=这些较大的投掷长矛都经过加重处理，以便在飞行过程中保持矛尖朝前。
items.weapon.missiles.javelin.name=标枪
items.weapon.missiles.kunai.desc=这些小刀在熟练使用者手中威力无穷。
items.weapon.missiles.kunai.name=苦无
items.weapon.missiles.kunai.stats_desc=这种武器对毫无防备的敌人效果更佳。
items.weapon.missiles.missileweapon$placeholder.name=投掷武器
items.weapon.missiles.missileweapon.about_to_break=你投掷的武器即将断裂。
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=如果你强化投掷武器套装中的最后一件投掷武器损坏，该套装将永久丢失。你确定要投掷它吗？
items.weapon.missiles.missileweapon.break_upgraded_warn_no=不
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=是的
items.weapon.missiles.missileweapon.curse_discover=这件投掷武器被诅咒了！
items.weapon.missiles.missileweapon.distance=投掷武器远距离射击更精准，近距离射击则不太精准。
items.weapon.missiles.missileweapon.durability=投掷武器在使用过程中会磨损和损坏。
items.weapon.missiles.missileweapon.dust=投掷出去的武器一碰就化为尘埃。
items.weapon.missiles.missileweapon.has_broken=你的一件投掷武器坏了。
items.weapon.missiles.missileweapon.probably_too_heavy=这件武器可能对你来说太重了。
items.weapon.missiles.missileweapon.stats_known=这套 _tier-%1$d_ 投掷武器造成 _%2$d-%3$d 点伤害，使用需要 _%4$d 点力量。
items.weapon.missiles.missileweapon.stats_unknown=通常情况下，这套 _tier-%1$d_ 投掷武器会造成 _%2$d-%3$d 点伤害，并且需要 _%4$d 点力量才能使用。
items.weapon.missiles.missileweapon.unknown_uses=通常情况下，这套投掷武器在损坏之前可以使用 _%d_ 次。
items.weapon.missiles.missileweapon.unlimited_uses=这套产品质量极佳，几乎可以永久使用。
items.weapon.missiles.missileweapon.uses_left=这套投掷武器还剩下_%d/%d_次使用次数，之后就会有一个损坏。
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=你刚刚瞬间投掷了一枚手里剑，必须等待一段时间才能再次投掷。手里剑仍然可以投掷，但速度为正常武器速度。剩余回合数：\n\n。
items.weapon.missiles.shuriken$shurikeninstanttracker.name=手里剑冷却时间
items.weapon.missiles.shuriken.desc=这些星形金属片有着剃刀般锋利的刃口，命中目标时能造成重创。投掷速度非常快。
items.weapon.missiles.shuriken.name=手里剑
items.weapon.missiles.shuriken.stats_desc=手里剑可以立即投掷，冷却时间为20回合。
items.weapon.missiles.throwingclub.desc=一种结构相当简单但经久耐用的投掷武器，本质上就是一块绑在棍子上的大石头。
items.weapon.missiles.throwingclub.name=投掷棍
items.weapon.missiles.throwingclub.stats_desc=这种武器不会粘在敌人身上，可以立即拾取。
items.weapon.missiles.throwinghammer.desc=这些厚重的锤子设计用来投掷攻击敌人。它们光滑的全金属结构意味着它们非常耐用。
items.weapon.missiles.throwinghammer.name=投掷锤
items.weapon.missiles.throwinghammer.stats_desc=这种武器不会粘在敌人身上，可以立即拾取。
items.weapon.missiles.throwingknife.desc=这些轻巧的刀具经过精心平衡，能够划出一道弧线，精准地击中目标。
items.weapon.missiles.throwingknife.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.missiles.throwingknife.name=飞刀
items.weapon.missiles.throwingknife.stats_desc=这种武器对毫无防备的敌人效果更佳。
items.weapon.missiles.throwingspear.desc=这些轻型长矛的框架很薄，设计用于投掷，而不是刺击。
items.weapon.missiles.throwingspear.name=投掷长矛
items.weapon.missiles.throwingspike.desc=这些坚固耐用的尖头金属杆是用来投掷攻击远处敌人的。
items.weapon.missiles.throwingspike.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.missiles.throwingspike.name=投掷扣球
items.weapon.missiles.throwingstone.desc=这些石头经过打磨，使其投掷时比普通石头更有力。
items.weapon.missiles.throwingstone.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.missiles.throwingstone.name=投掷石块
items.weapon.missiles.tomahawk.desc=这些投掷斧的边缘呈锯齿状，会在粘住敌人时撕裂敌人。
items.weapon.missiles.tomahawk.name=钺
items.weapon.missiles.tomahawk.stats_desc=该武器会对目标造成_%1$d-%2$d流血_效果。
items.weapon.missiles.tomahawk.typical_stats_desc=该武器通常会对目标造成_%1$d-%2$d流血_。
items.weapon.missiles.trident.desc=巨大的投掷长矛，末端有三个致命的尖刺。它们威力强大，但也很重。
items.weapon.missiles.trident.name=三叉戟
items.weapon.spiritbow.ac_shoot=射击
items.weapon.spiritbow.desc=一把由远古魔法木材制成的弓。弓弦和弓身上的纹饰散发着淡蓝色的光芒。拉动弓弦，即可召唤出一支魔法箭矢，射向敌人。
items.weapon.spiritbow.discover_hint=其中一位英雄初始就拥有这件物品。
items.weapon.spiritbow.name=灵弓
items.weapon.spiritbow.prompt=选择目标
items.weapon.spiritbow.stats=弓箭无法直接升级，而是会随着等级提升而逐渐变强。在你当前等级，弓箭射出的箭矢会造成_%1$d-%2$d点伤害_，并且需要_%3$d点力量才能正确使用。
items.weapon.weapon$enchantment.discover_hint=你可以在地牢中随机找到具有这种效果的物品，或者尝试自己将其应用到物品上。
items.weapon.weapon$enchantment.enchant=魅力
items.weapon.weapon$enchantment.rankings_desc=被魔法杀死
items.weapon.weapon.cursed=你能感觉到这件武器中潜藏着一股邪恶的魔法。
items.weapon.weapon.cursed_worn=因为这件武器被诅咒了，你无力将其移除。
items.weapon.weapon.enchant_hardened=它已经_硬化了_。
items.weapon.weapon.enchanted=它有一个_%s。_
items.weapon.weapon.excess_str=由于你的力量过剩，你将使用这把武器造成 _0-%d 额外伤害_。
items.weapon.weapon.faster=它经过增强以提升速度。
items.weapon.weapon.hardened_no_enchant=这件武器已经过强化，但目前尚未附魔。
items.weapon.weapon.hardening_gone=这件武器的硬化层已经磨损了！
items.weapon.weapon.identify=你现在对自己的武器已经足够熟悉，能够识别它了。
items.weapon.weapon.incompatible=不同类型魔法的相互作用使这件武器上的附魔失效了！
items.weapon.weapon.not_cursed=这件武器没有邪恶魔法。
items.weapon.weapon.stronger=它被强化以增强伤害。
items.weapon.weapon.too_heavy=由于你的力量不足，这件武器会降低你的攻击速度、精准度和奇袭能力。
items.weapon.weapon.weak_cursed=尽管受到诅咒，你仍然可以卸下这件武器。

items.keys.skeletonkey.desc=这把钥匙看起来很厉害：它的钥匙头形状像骷髅头。或许它能打开一扇非常特别的门。
items.weapon.missiles.bombarrow.desc=一支箭，箭上绑着炸弹。保持距离。
items.weapon.missiles.bombarrow.name=炸弹箭
items.weapon.missiles.missileweapon.damage_desc=该武器每次攻击造成_%1$d_至_%2$d_点伤害。
items.bags.seedpouch.desc=这个小小的天鹅绒袋子能装下任意数量的种子。十分方便。
items.bags.seedpouch.name=种子袋
items.potions.potionofmight.desc=这股强劲的液体会流遍你的肌肉，永久增加一点力量和五点生命。
items.potions.potionofmight.name=强壮药剂
items.rings.ringofdetection.desc=戴上这枚戒指，不必花时间搜索，也能察觉隐藏的陷阱和暗门。弱化的探知之戒会让感官变得迟钝，即使主动搜索，也更难发现秘密。
items.rings.ringofdetection.name=探知之戒
items.rings.ringofhaggler.desc=这枚戒指其实没有魔法效果，却能让商人知道佩戴者是盗贼公会的一员。只要答应暂时不找他们的麻烦，他们通常很乐意打个折。升级戒指不会带来额外好处。
items.rings.ringofhaggler.name=砍价之戒
items.rings.ringofherbalism.desc=这枚戒指能提高你踩踏草丛时找到露水和种子的几率。
items.rings.ringofherbalism.name=草药之戒
items.rings.ringofmending.desc=这枚戒指能增强身体的自愈能力，加快生命恢复。弱化的戒指会减慢自然恢复，甚至使其完全停止。
items.rings.ringofmending.name=再生之戒
items.rings.ringofpower.desc=这枚戒指散发出的能量场会增强你的法杖。弱化的能量之戒则会削弱法杖。
items.rings.ringofpower.name=能量之戒
items.rings.ringofsatiety.desc=戴上这枚戒指，你能更久不吃东西。弱化的饱腹之戒会起到相反的效果。
items.rings.ringofsatiety.name=饱腹之戒
items.rings.ringofshadows.desc=佩戴这枚戒指，敌人更难注意到你。而破损的暗影戒指则会惊动那些原本可能不会察觉你存在的敌人。
items.rings.ringofshadows.name=暗影之戒
items.rings.ringofthorns.desc=这枚戒指并不会长出真的荆棘，但攻击你的敌人会承受自己所造成的部分伤害。升级戒指不会带来额外好处。
items.rings.ringofthorns.name=荆棘之戒
items.scrolls.scrollofchallenge.desc=大声朗读此卷轴，将会发出震耳欲聋的咆哮，唤醒所有怪物，并让它们察觉到朗读者的位置。
items.scrolls.scrollofchallenge.name=挑战卷轴
items.scrolls.scrollofenchantment.desc=此卷轴可以随机给武器或盔甲附魔，赋予其特殊力量。
items.scrolls.scrollofenchantment.name=附魔卷轴
items.scrolls.scrollofpsionicblast.desc=此卷轴蕴含着毁灭性的能量，可通过心灵感应引导，对视野范围内的所有生物造成巨大伤害。伴随而来的闪光将暂时致盲作用范围内的所有人，包括卷轴的阅读者。
items.scrolls.scrollofpsionicblast.name=灵能冲击卷轴
items.scrolls.scrollofwipeout.desc=阅读此卷轴，即可释放地牢恶灵的怒火，屠戮当前层的一切。嗯，几乎所有生物都会被杀。一些更强大的生物或许不受影响。
items.scrolls.scrollofwipeout.name=灭绝卷轴
items.wands.wandofblink.desc=这根法杖能让你朝选定的方向瞬间移动。生物和障碍物都会阻断传送。
items.wands.wandofblink.name=闪现法杖
items.wands.wandoffirebolt.desc=这根法杖能射出魔法火焰，点燃可燃的地形，并对击中的生物造成伤害，使其燃烧。
items.wands.wandoffirebolt.name=火焰箭法杖
items.potions.potion.color_turquoise=青绿色
items.rings.ring.gem_diamond=钻石
items.potions.potion.color_crimson=深红色
items.rings.ring.gem_opal=蛋白石
