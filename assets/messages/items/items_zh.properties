items.weapon.weaponeffects.weaponeffect.smite.prefix=野蛮
items.weapon.weaponeffects.weaponeffect.smite.name=野蛮%s
items.weapon.weaponeffects.weaponeffect.smite.desc=这件武器带有_野蛮_之力。命中时有_20%_的几率施放_1级惩击_。
items.weapon.weaponeffects.weaponeffect.smite.activate=惩击！

items.weapon.weaponeffects.weaponeffect.knockback.prefix=斥退
items.weapon.weaponeffects.weaponeffect.knockback.name=斥退%s
items.weapon.weaponeffects.weaponeffect.knockback.desc=这件武器带有_斥退_之力。命中时有_20%_的几率将敌人击退_一格_。无法击退首领。
items.weapon.weaponeffects.weaponeffect.knockback.activate=击退！

items.weapon.weaponeffects.weaponeffect.venom.prefix=蛇牙
items.weapon.weaponeffects.weaponeffect.venom.name=蛇牙%s
items.weapon.weaponeffects.weaponeffect.venom.desc=这件武器带有_蛇牙_之毒。命中时有_20%_的几率使目标中毒。
items.weapon.weaponeffects.weaponeffect.venom.activate=毒液！

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=致残
items.weapon.weaponeffects.weaponeffect.kneeshot.name=致残%s
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=这件武器能够_致残_。远程攻击命中时有_20%_的几率使敌人残废_10回合_。首领不受影响。
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=残废！

items.weapon.weaponeffects.weaponeffect.spark.prefix=符文
items.weapon.weaponeffects.weaponeffect.spark.name=符文%s
items.weapon.weaponeffects.weaponeffect.spark.desc=这根法杖刻有_符文_。其魔法有_20%_的几率触发_火花_，额外造成_4–8_点魔法伤害。
items.weapon.weaponeffects.weaponeffect.spark.activate=火花！

items.weapon.weaponeffects.weaponeffect.curse.prefix=咒术
items.weapon.weaponeffects.weaponeffect.curse.name=咒术%s
items.weapon.weaponeffects.weaponeffect.curse.desc=这根法杖蕴含_咒术_。其魔法有_20%_的几率削弱目标，使其造成的伤害降低_5%_，持续_10回合_。
items.weapon.weaponeffects.weaponeffect.curse.activate=诅咒！

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=汲取
items.weapon.weaponeffects.weaponeffect.drainlife.name=汲取%s
items.weapon.weaponeffects.weaponeffect.drainlife.desc=这根法杖能够_汲取_生命。其魔法有_20%_的几率额外造成_8–16_点魔法伤害，并为你恢复等同于目标实际损失的生命值。
items.weapon.weaponeffects.weaponeffect.drainlife.activate=汲取！

items.armor.armorprefix.stalwart.name=坚毅%s
items.armor.armorprefix.stalwart.desc=这件护甲赋予你_坚毅_之力。敌人的攻击有_20%_的几率触发_5级坚韧_，使该次伤害降低_20%_。
items.armor.armorprefix.stalwart.activate=坚韧！

items.armor.armorprefix.vigilant.name=警戒%s
items.armor.armorprefix.vigilant.desc=这件护甲让你保持_警戒_。你有_20%_的几率躲过敌人的远程攻击。
items.armor.armorprefix.vigilant.activate=警觉！

items.armor.armorprefix.elusive.name=灵巧%s
items.armor.armorprefix.elusive.desc=这件护甲让你更加_灵巧_。受到敌人攻击的伤害时，有_20%_的几率使闪避提高_5_，持续_5回合_。
items.armor.armorprefix.elusive.activate=闪避！
