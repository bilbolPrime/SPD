items.artifacts.masterthievesarmband.desc=这条紫色天鹅绒臂环带有盗贼大师的标志。它不属于你，但它之前的拥有者可能也不属于它。
items.artifacts.masterthievesarmband.desc_cursed=那条被诅咒的臂环绑在你的手腕上，不知为何，你口袋里的金子似乎正在慢慢变轻……
items.artifacts.masterthievesarmband.desc_worn=随着经验的积累，你会感到手腕上的臂环力量不断增强。你可以利用这股力量从商店行窃，或者抢劫敌人！抢劫敌人会瞬间发生，短暂地使其失去方向感，并让你有机会获得他们身上的所有战利品！这种力量对毫无防备的敌人效果更佳。多次抢劫同一个敌人并不会增加获得战利品的几率。
items.artifacts.masterthievesarmband.failed_steal=你什么也没偷到。
items.artifacts.masterthievesarmband.full=您的臂带已充满电！
items.artifacts.masterthievesarmband.level_up=你的臂章越来越牢固了！
