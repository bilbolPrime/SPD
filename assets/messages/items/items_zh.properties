items.armor.curses.antientropy.desc=反熵诅咒能够对抗宇宙的力量，将能量吸入佩戴者体内，并从周围环境中抽离。这会使佩戴者短暂地燃烧起来，但会冻结周围的一切！
items.armor.curses.antientropy.name=反熵的 %s
items.armor.curses.bulk.desc=厚重的盔甲看起来更大更威武，但实际上防御力并没有增强。更糟糕的是，增加的体积反而使进出门口变得非常困难。
items.armor.curses.bulk.name=散装 %s
items.armor.curses.corrosion.desc=腐蚀护甲能够喷涌出腐蚀性液体，使周围所有物体都沾满粘稠的酸性液体。
items.armor.curses.corrosion.name=腐蚀的 %s
items.armor.curses.displacement.desc=位移诅咒会在佩戴者受到攻击时将其转移到安全位置。然而，它的效果过于强大，会将使用者随机传送到关卡中的其他地方。
items.armor.curses.displacement.name=位移 %s
items.armor.curses.metabolism.desc=新陈代谢诅咒会在佩戴者受伤时直接将饱腹感转化为健康，从而加快愈合速度，但也会很快导致饥饿。
items.armor.curses.metabolism.name=%s 代谢
items.armor.curses.multiplicity.desc=被诅咒拥有复制能力的盔甲蕴含着危险的复制魔法。它有时会创造出穿戴者的镜像，但同样也有可能复制攻击者！
items.armor.curses.multiplicity.name=%s 多重性
items.armor.curses.overgrowth.desc=茂盛的盔甲上覆盖着各种盛开的植物。虽然这种效果看起来很有趣，但对防御毫无作用，而且这些植物会在战斗中随机激活！
items.armor.curses.overgrowth.name=%s 过度生长
items.armor.curses.stench.desc=被恶臭诅咒的盔甲会释放出有毒气体云，对云中的一切生物都具有危害性。
items.armor.curses.stench.name=恶臭
items.armor.duelistarmor.desc=穿上这套板甲和披风后，决斗者可以施展特殊能力。
items.armor.duelistarmor.name=英雄的胸甲
items.armor.glyphs.affection.desc=这个强大的符文可以操控攻击者的心智，暂时迷惑他们。
items.armor.glyphs.affection.name=%s 的爱意
items.armor.glyphs.antimagic.desc=这种强大的符文能让盔甲同时抵御物理和魔法攻击。这种魔法防御力不受盔甲等级的影响。
items.armor.glyphs.antimagic.name=反魔法的 %s
items.armor.glyphs.brimstone.desc=这个符文可以保护佩戴者及其财物免受火焰伤害，完全消除火焰的损害和负面影响。
items.armor.glyphs.brimstone.name=硫磺的 %s
items.armor.glyphs.camouflage.desc=这个符文可以让佩戴者融入高高的草丛中，使其暂时隐身。
items.armor.glyphs.camouflage.name=迷彩的 %s
items.armor.glyphs.entanglement.desc=这个符文会在穿戴者周围生成一层土质盔甲来吸收伤害，但如果穿戴者移动，这层盔甲就会破碎。
items.armor.glyphs.entanglement.name=纠缠的 %s
items.armor.glyphs.flow.desc=这个符号可以控制佩戴者周围的水流，使他们在水中移动时速度更快。
items.armor.glyphs.flow.name=%s 流量
items.armor.glyphs.obfuscation.desc=这个符号会遮蔽佩戴者，使其更难被发现。
items.armor.glyphs.obfuscation.name=混淆的 %s
items.armor.glyphs.potential.desc=击打此符文可积蓄能量，激活后可为佩戴者的魔杖充能。
items.armor.glyphs.potential.name=潜在的 %s
items.armor.glyphs.repulsion.desc=这个符号能反弹攻击者的力量，将他们击飞。
items.armor.glyphs.repulsion.name=%s 排斥
items.armor.glyphs.stone.desc=这个符文用厚重的魔法石包裹住盔甲，使闪避成为不可能，但能根据闪避程度阻挡相应的伤害。
items.armor.glyphs.stone.name=%s 石头
items.armor.glyphs.swiftness.desc=当佩戴者远离敌人时，此符文可提升其速度。
items.armor.glyphs.swiftness.name=%s 的速度
items.armor.glyphs.thorns.desc=这个强大的符文会伤害攻击者，使他们在攻击佩戴者时缓慢流血。
items.armor.glyphs.thorns.name=荆棘的 %s
items.armor.glyphs.viscosity$defereddamage.desc=伤害会随着时间的推移缓慢造成，而不是立即造成。剩余延迟伤害：\n\n。
items.armor.glyphs.viscosity$defereddamage.name=延迟损害
items.armor.glyphs.viscosity$defereddamage.ondeath=延迟造成的伤害最终害死了你……
items.armor.glyphs.viscosity$defereddamage.rankings_desc=因延迟伤害而死
items.armor.glyphs.viscosity.deferred=延迟 %d
items.armor.glyphs.viscosity.desc=这个符文能够储存佩戴者所受到的伤害，并缓慢地将伤害释放给佩戴者，而不是一次性释放。
items.armor.glyphs.viscosity.name=%s 粘度
items.armor.huntressarmor.desc=穿上这件斗篷后，女猎手可以施展特殊能力。
items.armor.huntressarmor.name=英雄斗篷
items.armor.huntressarmor.no_enemies=周围没有敌人
items.armor.leatherarmor.desc=用鞣制过的怪物皮制成的盔甲。虽然不如布甲轻便，但防护性能更好。
items.armor.leatherarmor.name=皮甲
items.armor.magearmor.desc=穿上这件华丽的长袍，法师可以施展特殊能力。
items.armor.magearmor.name=英雄长袍
items.armor.mailarmor.desc=相互连接的金属链节造就了一套既坚固又灵活的盔甲。
items.armor.mailarmor.name=锁子甲
items.armor.platearmor.desc=巨大的金属板连接在一起，组成了一套盔甲，为任何足够强壮、能够承受其惊人重量的冒险者提供无与伦比的保护。
items.armor.platearmor.name=板甲
items.armor.roguearmor.desc=穿上这身黑色装束时，盗贼可以使用特殊能力。
items.armor.roguearmor.name=英雄的装束
items.armor.scalearmor.desc=缝在皮背心上的金属鳞片形成了一种既灵活又具有保护作用的盔甲。
