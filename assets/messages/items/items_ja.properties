items.armor.curses.bulk.desc=バルクのアーマーはより大きく堂々として見えるが、実際には防御力は強化されていない。さらに悪いことに、サイズが大きくなると、出入り口への移動が非常に困難になる。
items.armor.curses.bulk.name=バルクの%s
items.armor.curses.corrosion.desc=腐食の鎧は腐食液で破裂し、粘着性のある酸性の滲出液で周囲をコーティングすることができる。
items.armor.curses.corrosion.name=腐食の%s
items.armor.curses.displacement.desc=変位の呪いは、攻撃されたときに着用者を安全な場所に移動させようとする。しかし、この呪いは少し効きすぎており、使用者をランダムにテレポートさせる。
items.armor.curses.displacement.name=変位の%s
items.armor.curses.metabolism.desc=新陳代謝の呪いは、着用者が負傷したときに満腹感を直接健康に変換し、治癒力を高めるが、すぐに飢餓状態に陥る。
items.armor.curses.metabolism.name=代謝の%s
items.armor.curses.multiplicity.desc=多重性の呪いをかけられた鎧は、危険な複製魔法を含んでいる。着用者の鏡像を作り出すこともあるが、攻撃者を複製する可能性も同様に高い！
items.armor.curses.multiplicity.name=倍数の%s
items.armor.curses.overgrowth.desc=生い茂る鎧は様々な植物で覆われている。この効果は確かに面白そうだが、防御には何の役にも立たず、これらの植物は戦闘中にランダムに発動する！
items.armor.curses.overgrowth.name=過成長の%s
items.armor.curses.stench.desc=悪臭の呪いをかけられた鎧は、有害なガスの雲を放出し、雲に巻き込まれたすべてのものに害を及ぼす。
