items.weapon.missiles.missileweapon.curse_discover=この投げ武器は呪われている！
items.weapon.missiles.missileweapon.distance=投擲武器は遠距離では正確だが、近距離では精度が落ちる。
items.weapon.missiles.missileweapon.durability=投擲武器は使っているうちに消耗し、壊れる。
