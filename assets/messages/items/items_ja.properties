items.journal.regionlorepage$caves.desc=探検家の日誌と思われるもので、古いはずなのに驚くほどよく保存されている。手に取って読んでみよう。
items.journal.regionlorepage$caves.name=古いログエントリ
items.journal.regionlorepage$city.desc=錆びた金属製の小さな石版には、魔法のようにメッセージが刻まれている。年季が入っているにもかかわらず文字は鮮明だが、読むには手に取らなければならない。
items.journal.regionlorepage$city.name=錆びたタブレット
items.journal.regionlorepage$halls.desc=緑色に光る文字が刻まれた小さな黒い石版。光っている文字は遠くから見ると霞んで見えるので、手に取らないと読めない。
items.journal.regionlorepage$halls.name=光るタブレット
items.journal.regionlorepage$prison.desc=古い紙に書かれた日記か何かの記録。下水道で見つけた手紙よりはましなようだが、それでも読むには手に取る必要がある。
items.journal.regionlorepage$prison.name=着用日誌
items.journal.regionlorepage$sewers.desc=汚れた紙に書かれた手紙のようなもの。手に取らないと何が書いてあるかわからない。
items.journal.regionlorepage$sewers.name=すりきれ
items.keys.crystalkey.desc=このクリスタルの鍵の切断面は、暗闇の中でキラキラと輝いている。もしかしたら、クリスタルでできた何かを開けることができるかもしれない。
items.keys.crystalkey.name=クリスタルキー
items.keys.goldenkey.desc=この黄金の鍵の切り込みは小さく、複雑だ。もしかしたら、鍵のかかった宝箱を開けることができるかもしれない。
items.keys.goldenkey.name=ゴールデンキー
items.keys.ironkey.desc=この古びた鉄の鍵の刻み目はよく磨り減り、革のヒモは年季が入ってボロボロになっている。どんなドアを開けるのだろう？
items.keys.ironkey.name=アイアンキー
items.keys.wornkey.desc=この鍵は摩耗して変色しているが、見た目は真面目そうだ。おそらく、この鍵で近くのドアを開けることができるだろう。
items.keys.wornkey.name=摩耗したキー
