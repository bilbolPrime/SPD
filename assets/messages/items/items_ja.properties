items.armor.curses.antientropy.desc=アンチエントロピーの呪いは宇宙の力に逆らい、エネルギーを装着者に引き寄せ、周囲から遠ざける。これにより着用者は短時間燃え上がるが、周囲のものはすべて凍結する！
