items.weapon.missiles.missileweapon.stats_desc=
items.weapon.missiles.bombarrow.desc=爆弾が取り付けられた矢。距離を保ってください。
items.weapon.missiles.bombarrow.name=爆弾矢
items.bags.seedpouch.desc=この小さなビロードの袋には、いくつでも種を入れておける。とても便利だ。
items.bags.seedpouch.name=種袋
items.potions.potionofmight.desc=この強力な液体は筋肉に行き渡り、筋力を1、体力を5、永続的に増やす。
items.potions.potionofmight.name=剛力の薬
items.rings.ringofdetection.desc=この指輪を身につけると、探す手間をかけずに隠された罠や秘密の扉に気づける。劣化した探知の指輪は感覚を鈍らせ、意識して探しても秘密を見つけにくくする。
items.rings.ringofdetection.name=探知の指輪
items.rings.ringofhaggler.desc=実のところ、この指輪に魔力はない。だが商人には、持ち主が盗賊ギルドの一員であることを示す。しばらく手出しをされない保証と引き換えなら、たいていは喜んで値引きしてくれる。強化しても、それ以上の恩恵はない。
items.rings.ringofhaggler.name=値切りの指輪
items.rings.ringofherbalism.desc=この指輪は、草を踏んだときに露や種を見つける確率を高める。
items.rings.ringofherbalism.name=薬草の指輪
items.rings.ringofmending.desc=この指輪は体の再生力を高め、失った体力の回復を速める。劣化した指輪は自然回復を遅らせ、完全に止めてしまうこともある。
items.rings.ringofmending.name=再生の指輪
items.rings.ringofpower.desc=この指輪から放たれる力の場は、杖の威力を高める。劣化した力の指輪は、逆に杖を弱める。
items.rings.ringofpower.name=魔力の指輪
items.rings.ringofsatiety.desc=この指輪を身につけると、食事をせずに長く過ごせる。劣化した満腹の指輪は逆の効果をもたらす。
items.rings.ringofsatiety.name=満腹の指輪
items.rings.ringofshadows.desc=この指輪を身につけていれば、敵に気づかれにくくなります。ただし、劣化した影の指輪は、普段ならあなたの存在に気づかないような敵にも警戒心を抱かせます。
items.rings.ringofshadows.name=影の指輪
items.rings.ringofthorns.desc=本物の棘が生えるわけではないが、あなたを攻撃した敵は、自ら与えたダメージの一部を受ける。強化しても、それ以上の恩恵はない。
items.rings.ringofthorns.name=いばらの指輪
items.scrolls.scrollofchallenge.desc=この巻物を声に出して読むと、すべてのモンスターを目覚めさせ、読み手の位置を知らせる、威嚇的な咆哮が放たれる。
items.scrolls.scrollofchallenge.name=挑戦の巻物
items.scrolls.scrollofenchantment.desc=この巻物は、武器や防具にランダムな魔法を付与し、特別な力を与えることができる。
items.scrolls.scrollofenchantment.name=付呪の巻物
items.scrolls.scrollofpsionicblast.desc=この巻物には破壊的なエネルギーが宿っており、サイオニックな力でそのエネルギーを操ることで、視界内のすべての生物に甚大なダメージを与えることができる。同時に発生する閃光は、巻物を読む者を含め、効果範囲内のすべての生物を一時的に盲目にする。
items.scrolls.scrollofpsionicblast.name=精神爆発の巻物
items.scrolls.scrollofwipeout.desc=この巻物を読むと、ダンジョンの精霊たちの怒りが解き放たれ、現在の階層にいるすべてのものが殺されます。まあ、ほとんどすべてですが。より強力なクリーチャーの中には、影響を受けないものもあります。
items.scrolls.scrollofwipeout.name=殲滅の巻物
items.wands.wandofblink.desc=この杖は、選んだ方向へ瞬間移動させてくれる。生き物や障害物があると、そこで移動が止まる。
items.wands.wandofblink.name=瞬間移動の杖
items.wands.wandoffirebolt.desc=この杖は魔法の火炎を放つ。燃えやすい地形に火をつけ、命中した生き物を傷つけて炎上させる。
items.wands.wandoffirebolt.name=火炎弾の杖
