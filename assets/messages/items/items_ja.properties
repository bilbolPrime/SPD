items.weapon.missiles.shuriken$shurikeninstanttracker.desc=最近、手裏剣を即座に投げた。手裏剣はまだ投げることができるが、通常の武器速度である。\n\n残りターン%s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=手裏剣クールダウン
items.weapon.missiles.shuriken.desc=鋭い刃を持つ星形の金属片で、命中すれば大きな傷を負わせる。非常に素早く投げられる。
items.weapon.missiles.shuriken.name=手裏剣
