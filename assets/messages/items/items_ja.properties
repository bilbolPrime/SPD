items.artifacts.skeletonkey$keywall.desc=スケルトン・キーによって、ここには仮設の魔法の壁が設置されている。
items.artifacts.skeletonkey.ac_insert=インサート
items.artifacts.skeletonkey.crystal_charges=クリスタル・ロックを開けるには5チャージが必要。
items.artifacts.skeletonkey.cursed=呪われたスケルトンキーは使えない。
items.artifacts.skeletonkey.desc=ドクロのような頭をした重要そうな鍵。その歯は見るたびに違って見える。
items.artifacts.skeletonkey.desc_cursed=その呪われた鍵は、どの鍵にもはまらないように積極的に動いているようで、他の鍵を使うことさえ難しくしている（不可能ではないが）。
items.artifacts.skeletonkey.desc_worn=この魔法の鍵は、ダンジョンの通常の鍵の代わりに使うことで力を得るようだ。ダンジョン内のほとんどの鍵に差し込むことができ、今まで鍵がかかっていなかった扉も含めて、鍵を開けたり閉めたりすることができる。\n\nまた、この鍵は何もない場所でも、方角や斜め方向から使うことができ、前方の空気を「ロック」し、幅3タイルの強固な壁を作り、10ターン持続させることができる。ロックするスペースがあれば、敵を押しのけることもできる。
items.artifacts.skeletonkey.discard=余分な鍵を捨てる。
items.artifacts.skeletonkey.force_lock=スケルトン・キーがないとロックが弱くなっている。何とか無理やり開ける。
items.artifacts.skeletonkey.gold_charges=金錠を開けるには2チャージが必要。
items.artifacts.skeletonkey.invalid_target=そこにはロックもアンロックもない。
items.artifacts.skeletonkey.iron_charges=通常のロックを開けるには1回の充電が必要。
items.artifacts.skeletonkey.levelup=スケルトンキーが強くなる！
items.artifacts.skeletonkey.lock_charges=ドアをロックするには2チャージが必要。
items.artifacts.skeletonkey.lock_no_space=ドアの内側にキャラクターを閉じ込めることはできない！
items.artifacts.skeletonkey.locked_with_key=そのドアは、あなたのスケルトンキーでロックされていた。
items.artifacts.skeletonkey.name=合い鍵
items.artifacts.skeletonkey.prompt=ターゲットを選ぶ
items.artifacts.skeletonkey.wall_charges=仮設の壁を作るには2チャージが必要。
items.artifacts.skeletonkey.wont_open=鍵がなぜかこのロックに入らない。
items.artifacts.talismanofforesight$foresight.desc=目に見えない危険が近くにあるような、とても緊張した気分になる。
items.artifacts.talismanofforesight$foresight.name=先見の明
items.artifacts.talismanofforesight$foresight.uneasy=不安になる。
items.artifacts.talismanofforesight.ac_scry=スクライ
items.artifacts.talismanofforesight.desc=滑らかな石に奇妙な彫刻が施されている。何か隠されたものがないかと、周囲のすべてを監視しているような気がする。
items.artifacts.talismanofforesight.desc_cursed=呪われたタリスマンはじっとあなたを見つめており、感覚を鈍らせている。
items.artifacts.talismanofforesight.desc_worn=タリスマンを持つと、感覚が鋭くなる。時間が経つにつれて、また隠されたドアや罠を発見するにつれて、タリスマンはゆっくりと充電されていく。\n\nこのタリスマンはチャージを消費して円錐形の "スケア "を行うことができ、スキャンした範囲内のすべてのタイルや秘密を明らかにし、短時間だが敵やアイテムの視界を得ることができる。
items.artifacts.talismanofforesight.full_charge=あなたのタリスマンはフル充電されている！
items.artifacts.talismanofforesight.levelup=あなたのタリスマンは強くなる！
items.artifacts.talismanofforesight.low_charge=このタリスマンを使用するには、少なくとも5％のチャージが必要である。
items.artifacts.talismanofforesight.name=先見の明
items.artifacts.talismanofforesight.prompt=スキャンする場所を選択します。
items.artifacts.timekeepershourglass$sandbag.desc=この小さな砂袋は、砂時計にぴったり合うはずだ。\n\n必要な時に、店主がこの特定の品を持っているのは奇妙に思えるが...。
items.artifacts.timekeepershourglass$sandbag.levelup=砂時計に砂を入れる。
items.artifacts.timekeepershourglass$sandbag.maxlevel=あなたの砂時計は魔法の砂で満たされている！
items.artifacts.timekeepershourglass$sandbag.name=魔法の砂袋
items.artifacts.timekeepershourglass$sandbag.no_hourglass=あなたにはこの砂を入れる砂時計がない。
items.artifacts.timekeepershourglass$timefreeze.desc=あなたの周りの時間が凍りつき、即座に行動を起こすことができる。この効果はキャンセルされるか、砂時計のチャージがなくなるまで続く。攻撃や魔法を使っても、この効果は解除される。\n\nチャージ使用までターン：%s。
items.artifacts.timekeepershourglass$timefreeze.name=タイム・フリーズ
items.artifacts.timekeepershourglass.ac_activate=アクティブ
items.artifacts.timekeepershourglass.cursed=呪われた砂時計は使えない。
items.artifacts.timekeepershourglass.deactivate=タイムフリーズを解除する。
items.artifacts.timekeepershourglass.desc=この大きな装飾が施された砂時計は地味に見えるが、繊細な彫刻が施された枠に大きな力を感じる。砂時計を回転させ、砂が注がれるのを見ていると、その魔力に引き寄せられるのを感じる。この魔力を使えば、時間をコントロールできるに違いない。
items.artifacts.timekeepershourglass.desc_cursed=呪われた砂時計があなたのそばに固定され、時間の流れを操作しようとしているのを感じるだろう。
items.artifacts.timekeepershourglass.desc_hint=砂時計は砂を失ってしまったようだ。
items.artifacts.timekeepershourglass.freeze=私の周りの時間を凍らせる
items.artifacts.timekeepershourglass.name=計時砂時計
items.artifacts.timekeepershourglass.no_charge=砂時計はまだ使えるほど充電されていない。
items.artifacts.timekeepershourglass.onfreeze=周囲が突然凍りつく。
items.artifacts.timekeepershourglass.onstasis=世界は一瞬にしてあなたの周囲に移り変わるようだ。
items.artifacts.timekeepershourglass.prompt=砂時計の魔法をどう使いたい？\n\n静止している間、時間は普通に動き、あなたは凍りつき、完全に無敵になる。\n\n一度に2チャージまで消費する。時間が凍結している間は、自分の行動に時間がかからないかのように動くことができる。これは砂時計を使うか攻撃することでいつでも解除できる。
items.artifacts.timekeepershourglass.stasis=自分を静止状態に置く
items.artifacts.unstablespellbook.ac_add=追加
items.artifacts.unstablespellbook.ac_read=読む
items.artifacts.unstablespellbook.blinded=目が見えない状態では、本を読むことはできない。
items.artifacts.unstablespellbook.cursed=呪われた呪文書を読むことはできない。
items.artifacts.unstablespellbook.desc=この書物は、その古さを考えれば驚くほど良好な状態である。ページをめくると、不安定なエネルギーが渦巻いている。この本を読めば、どんな呪文を唱えられるかわからない。
items.artifacts.unstablespellbook.desc_cursed=呪われた本があなたに縛り付けられ、ほとんどの巻物を使う能力を阻害している。
items.artifacts.unstablespellbook.desc_empowered=あなたが追加した巻物はパワーで輝いています。これらの巻物の効果のエキゾチックバージョンを選ぶことができるようになりますが、追加料金がかかります。
items.artifacts.unstablespellbook.desc_index=この本は不完全である。その索引は現在、以下の空白のページを指している：
items.artifacts.unstablespellbook.infuse_scroll=巻物のエネルギーを本に注入するのです。
items.artifacts.unstablespellbook.name=不安定な呪文書
items.artifacts.unstablespellbook.no_charge=今のところ、あなたの呪文はエネルギー切れです。
items.artifacts.unstablespellbook.prompt=スクロールを選択する
items.artifacts.unstablespellbook.read_empowered=あなたが呪文書に加えた巻物はエネルギーで急上昇する。あなたはこの巻物の通常版かエキゾチック版の効果をチャネリングすることができる。\n\nエキゾチックバージョンを選ぶと、1チャージではなく2チャージになる。
items.artifacts.unstablespellbook.unable_scroll=この巻物を本に追加することはできません。
items.artifacts.unstablespellbook.unknown_scroll=これがどんな巻物なのか、まだわからないでしょう。
items.bags.bag.discover_hint=このアイテムはショップで購入できる。
items.bags.bag.name=バックパック
items.bags.magicalholster.desc=このスリムなホルスターは、エキゾチックな動物の皮で作られており、強力な魔法で大量の射撃武器を収納することができる。\n\nバッグの中に手を入れるだけで、探していたアイテムが必ず手に入る。\n\nこのホルスターの魔法により、杖のチャージはわずかに早くなり、投げた武器はわずかに長持ちする。
items.bags.magicalholster.name=魔法のホルスター
items.bags.potionbandolier.desc=この分厚いバンドリエは帯のように胸に巻くことができ、ポーションの小瓶や水筒、液体金属の小瓶を入れるための断熱ストラップがたくさんついている。\n\nバンドリエの中にいる間、ポーションは寒さから守られるはずだ。
items.bags.potionbandolier.name=ポーションバンドリエ
items.bags.scrollholder.desc=この筒状の容器は天文学者の道具や海図を入れるように見えるが、巻物も同じように入る。側面には、呪文の結晶、アーケイン・スタイラス、アーケイン・レジンを入れるのに適したコンパートメントがいくつかある。\n\nこのホルダーはあまり燃えにくそうなので、巻物は火から守ることができるだろう。
items.bags.scrollholder.name=スクロールホルダー
items.bags.velvetpouch.desc=この小さなベルベットのポーチには、種やルーンストーン、錬金術の材料など、たくさんの小物を入れることができる。
items.bags.velvetpouch.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.bags.velvetpouch.name=ベルベットポーチ
items.bombs.arcanebomb.desc=この爆弾にはアーケイン特性が付与されている。グーのパンプアップ攻撃に似た強力な爆発を起こし、2タイル以内のものに_%1$d-%2$dの魔法ダメージを与える。
items.bombs.arcanebomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.arcanebomb.name=アーケインばくだん
items.bombs.bomb$doublebomb.desc=重量のある黒色火薬爆弾が2つ重なったもの！
items.bombs.bomb$doublebomb.name=爆弾2発
items.bombs.bomb.ac_lightthrow=ライト＆スロー
items.bombs.bomb.desc=かなり重い黒色火薬爆弾。この爆弾の爆発は隣接するものに_%1$d-%2$dダメージを与え、隣接する地形やアイテムを破壊する。
items.bombs.bomb.desc_burning=爆弾の導火線が燃え尽きている！
items.bombs.bomb.desc_fuse=導火線は一度火がつくと、燃え尽きるまで2、3発かかるようだ。
items.bombs.bomb.name=爆弾
items.bombs.bomb.ondeath=爆発で死ぬ...。
items.bombs.bomb.rankings_desc=爆発で死亡
items.bombs.bomb.snuff_fuse=あなたはすぐに爆弾の導火線を消す。
items.bombs.firebomb.desc=この爆弾はより広い範囲で爆発するように改良され、_%1$d-%2$dダメージを与え、2タイル以内に持続的な炎を広げる。
items.bombs.firebomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.firebomb.name=ファイアボム
items.bombs.flashbangbomb.desc=このカスタマイズされた爆弾は、爆発すると光と音と電気の爆風を巻き起こす。2タイル以内にいるものは爆発による_%1$d-%2$dダメージを受け、さらに電気による25%%ダメージを受け、10ターンの間気絶する。
items.bombs.flashbangbomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.flashbangbomb.name=閃光弾
items.bombs.frostbomb.desc=この爆弾はより広い範囲で爆発するように改良され、_%1$d-%2$dダメージを与え、2タイル以内に凍てつくような突風を持続的にまき散らす。
items.bombs.frostbomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.frostbomb.name=フロストボム
items.bombs.holybomb.desc=この爆弾は爆発時、より広い範囲に聖なる光を放つように改良されている。2タイル以内のものは爆発によって_%1$d-%2$dダメージを受け、アンデッドや悪魔の敵は聖なる光によってさらに50%%ダメージを受ける。
items.bombs.holybomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.holybomb.name=聖なる爆弾
items.bombs.noisemaker.desc=このカスタマイズされた爆弾は、導火線が切れると繰り返し音を出す。爆弾に何かが触れると爆発し、2タイル以内のものに_%1$d-%2$dダメージを与える！
items.bombs.noisemaker.desc_burning=ノイズメーカーは時を刻んでいる。何かが近づくと爆発する！
items.bombs.noisemaker.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.noisemaker.name=ノイズメーカー
items.bombs.regrowthbomb.desc=このカスタマイズされた爆弾は、爆発する代わりに3タイル以内に生命を与える液体を撒き散らす。爆風に巻き込まれたエリアは急速に草や植物が芽吹く。自分と爆風に巻き込まれた味方は、回復のポーションを飲んだかのように回復する。
items.bombs.regrowthbomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.regrowthbomb.name=再生爆弾
items.bombs.shrapnelbomb.desc=この爆弾はDM-300の金属片で改造されており、爆発すると破片があちこちに飛び散り、爆弾の周囲の広い範囲に_%1$d-%2$dのダメージを与える。使用するときは、何かの陰に隠れた方がいい...。
items.bombs.shrapnelbomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.shrapnelbomb.name=りゅうさんだん
items.bombs.smokebomb.desc=この爆弾は爆発と同時に濃いガスの雲を噴出するように改良されている。%1$d-%2$dダメージを与え、2タイル以内に霧をまき散らす。
items.bombs.smokebomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.smokebomb.name=発煙筒
items.bombs.woollybomb.desc=このカスタマイズされた爆弾は爆発後、広い魔法の羊のフィールドを作り出す。爆発は2タイル以内のものに_%1$d-%2$dダメージを与える。羊は動きを封じ、非常に長い時間持続する！強力な敵がいる場合、羊はそれほど長くは続かない。
items.bombs.woollybomb.discover_hint=このアイテムは錬金術で作ることができる。
items.bombs.woollybomb.name=毛糸爆弾
items.brokenseal$warriorshield.desc_active=ウォリアーの壊れた封印は現在、彼の忍耐を助け、ヘルスに加えてシールドを付与している。シールドが発動してから再び使用できるようになるまでにはクールダウンがある。\n\nこのシールドは時間が経っても減衰しないが、数ターンの間近くに敵がいなければ終了する。シールドが終了すると、未使用のシールドがあればクールダウンが減少し、最大で50%%まで減少する。\n\nシールド残り%1$d。\n\n現在のクールダウン%2$d.
items.brokenseal$warriorshield.desc_cooldown=ウォリアーは最近、破れた封印からシールドを得たが、再びシールドの恩恵を受けられるようになるまで待たなければならない。\n\n残りターン%d.
items.brokenseal$warriorshield.desc_negative_cooldown=ウォリアーのシールドのクールダウンは現在マイナスで、シールド発動時のクールダウンは通常の150ターンより短くなる。シールドのクールダウンは-150ターンまで減少させることができる。\n\n現在のクールダウン%d.
items.brokenseal$warriorshield.name=戦士の盾
items.brokenseal.ac_affix=接辞
items.brokenseal.affix=鎧にシールを貼る！
items.brokenseal.choose_desc=この鎧も壊れた封印もグリフを持っている。どちらのグリフを残すべきかを選べ。\n\n鎧のグリフ：%1$s\n壊れた封印のグリフ: %2$s\n\n現在鎧についているグリフを選ぶと、後で封印を移すことができなくなるので注意。
items.brokenseal.choose_title=グリフを選ぶ
items.brokenseal.cursed_armor=呪われた鎧には封印は適用されない。
items.brokenseal.desc=武勇の象徴として鎧に貼られる蝋印。中央には色あせた護符のルーンが刻まれており、真ん中が真っ二つに割れている。\n\n故郷からの形見であるこの印章は、戦士の忍耐を助ける。この印章を身につけている間、戦士は体力の半分以下までダメージを受けそうになると、即座にシールドを得る。\n\n印章はアーマーに貼り付けたり、アーマー間で移動させたりすることができる。封印が鎧に装着されている間にその鎧にアップグレードが適用されている限り、1つのアップグレードを持ち運ぶことができる。
items.brokenseal.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.brokenseal.inscribed=印章には_%s._が刻まれている。
items.brokenseal.name=わりいん
