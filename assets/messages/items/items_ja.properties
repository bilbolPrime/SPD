items.artifacts.lloydsbeacon.desc=ロイドのビーコンは、テレポートの魔法を操ることができる複雑な魔法装置である。ビーコンは決められた場所に戻るために使うことができるが、装備した状態からチャージすれば、ランダムなテレポート魔法を放つこともできる。この魔法はターゲットに向けることも、使用者自身に向けることもできる。
