items.honeypot.desc=この大きな蜜壺には蜂蜜しか入っていないが、その代わりに巨大な蜂が入っている！この種の巨大なミツバチは通常、巣箱の中にいるものだが、この蜜壺はある種の特殊な捕獲用の檻なのだろうか？蜂は蜜壺の中でかなり満足しているようで、こちらを見ると警戒してブンブンと鳴く。
