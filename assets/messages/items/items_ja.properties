items.scrolls.exotic.exoticscroll.gyfu=GYFUのエキゾチックな巻物
items.scrolls.exotic.exoticscroll.isaz=異国情緒あふれるISAZの巻物
items.scrolls.exotic.exoticscroll.kaunan=薫南異国情緒絵巻
items.scrolls.exotic.exoticscroll.laguz=エキゾチック・スクロール
items.scrolls.exotic.exoticscroll.mannaz=MANNAZのエキゾチックな巻物
items.scrolls.exotic.exoticscroll.naudiz=NAUDIZのエキゾチックなスクロール
