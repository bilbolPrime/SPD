items.artifacts.masterthievesarmband.desc_worn=経験を積むにつれ、手首の腕輪に力がみなぎるのを感じる。このパワーを使って店から盗んだり、敵から奪ったりすることができる！\n\n敵から奪うと即座に戦意を喪失させ、戦利品を奪うチャンスを得ることができる！このパワーは無意識の敵に効果的です。同じ敵から何度も奪っても、戦利品を手に入れるチャンスは増えない。
