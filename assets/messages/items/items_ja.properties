items.artifacts.capeofthorns$thorns.radiating=ケープがエネルギーを放ち始め、守られていると感じる！
items.artifacts.capeofthorns.desc=DM-300の金属板が崩れ、硬いマントになった。DM-300のパワーを受け継いでいるのだろうか。
items.artifacts.capeofthorns.desc_active=マントは蓄積されたエネルギーを放出し、保護する力を放っているようだ。
items.artifacts.capeofthorns.desc_inactive=マントはあなたの肩の上で心強く重く感じられ、あなたが受けるダメージからエネルギーを得ているようだ。
