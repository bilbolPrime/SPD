items.artifacts.sandalsofnature.absorb_seed=履物は種を吸収し、より健康になるようだ。
items.artifacts.sandalsofnature.ac_feed=フィード
items.artifacts.sandalsofnature.ac_root=ルート
items.artifacts.sandalsofnature.desc_1=最初はヒモでできたサンダルのように見えるが、実は2本の植物だ！とても弱々しく、青白く見えるが、栄養を与える必要があるのだろうか？
items.artifacts.sandalsofnature.desc_2=履物は成長し、今では2足のテーラードシューズに近くなった。色も戻ってきたし、まだまだ成長できるだろう。
items.artifacts.sandalsofnature.desc_3=植物は再び成長し、今では樹皮でできたしっかりとしたブーツのようだ。植物は力を取り戻したように見えるが、もしかしたら、まだまだ成長できるのだろうか？
items.artifacts.sandalsofnature.desc_4=植物は最大サイズに達したようで、一対の鎧の薙刀のようだ。薙刀は深い茶色で、とても頑丈な木に似ている。
items.artifacts.sandalsofnature.desc_ability=最後に与えた種の色で足元が波打つ。地面に短時間根を張り、半径3タイル内のどこでもその植物の効果を生み出すことができる。\n種: _%s_\nチャージが必要：zxqph1zxqzqph2zxq_
items.artifacts.sandalsofnature.desc_cursed=呪われたサンダルが自然との同調を妨げている。
items.artifacts.sandalsofnature.desc_hint=このアーティファクトを身につけると、自然との同調をより感じられる。
items.artifacts.sandalsofnature.desc_seeds=あなたは履物に%dの種を与えた。
items.artifacts.sandalsofnature.levelup=履物が大きくなる！
items.artifacts.sandalsofnature.low_charge=履物にはそのための十分なエネルギーがない。
