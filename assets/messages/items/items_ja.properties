items.artifacts.capeofthorns$thorns.desc=あなたのマントはエネルギーを放射し、あなたを偏向力のフィールドで取り囲んでいる！\n\n棘の効果が発動している間、受けるダメージはすべて軽減される。さらに、攻撃者があなたの隣にいる場合、軽減されたダメージは攻撃者に反射される。\n\n茨の残りターン%s。
items.artifacts.capeofthorns$thorns.inert=岬は再び不活性化する。
