items.artifacts.etherealchains.desc=この大きくも軽い鎖は、スピリチュアルなエネルギーで輝いている。地形に引き寄せたり、敵を引き寄せたりするのに使える。鎖のエーテル的な性質により、壁を通り抜けて伸びることもできる！
