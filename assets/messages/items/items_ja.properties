items.amulet.ac_end=ゲーム終了
items.amulet.ascent_desc=お守りからヨグ＝デゼヴァの偉大で恐ろしい力が放たれているのを感じ始める。人間としてダンジョンに戻るのは、思ったより難しいかもしれない！\n\nアミュレットを持ったまま上昇を続けると、ダンジョンはより危険になり、フロア間のテレポートが使えなくなり、ダンジョンを上昇しながら敵を倒すことでしかゲームに勝てなくなる！\n\nこのチャレンジを開始せずに上昇したい場合は、アミュレットをここに置いておくか、上昇する前にアミュレットを起動し、普通にゲームを終了することができます。
items.amulet.ascent_no=とりあえずストップ
items.amulet.ascent_title=昇天
items.amulet.ascent_yes=続ける！
items.amulet.desc=イェンドールのアミュレットは、人間やドワーフが知る限り最も強力なアーティファクトである。そのきらめく結晶には、信じられないほどの不思議な力が秘められている。
items.amulet.desc_ascent=お守りの起源は不明だが、明らかにヨグ＝デゼヴァの力の影響を強く受けている。ダンジョンを進むにつれてヨグの意のままに曲がっていくようで、敵はより多く、より強力になる！また、アミュレットを起動することも捨てることもできなくなり、まるで呪われているかのようだ。
items.amulet.desc_origins=このアミュレットの起源は不明である。歴史によると、ドワーフの王は、ドワーフ文明がすべての接触を断つ直前に、このアーティファクトを発見したと自慢したという。どうやって見つけたのか？ヨグ＝デゼヴァはどうやってそれを奪ったのか？それはまた別の機会にするとして、今大切なのは、このアミュレットがあなたのものだということだ！
items.amulet.discover_hint=このアイテムはダンジョンの一番下にある...。
items.amulet.name=イェンドールのお守り
items.ankh.ac_bless=恵む
items.ankh.bless=魔法の水でアンクを祝福する。
items.ankh.desc=この古代の不死の象徴は、死後に蘇る力を授ける。復活すると、装備していないアイテムはすべて失われる。
items.ankh.desc_blessed=この古代の不死のシンボルは、死後に生に戻る能力を与える。アンクは祝福を受け、より強くなった。アンクは、絶体絶命の危機に陥った時、自らを犠牲にしてあなたを救うだろう。
items.ankh.discover_hint=このアイテムはショップで購入できる。
items.ankh.name=アンク
items.arcaneresin.ac_apply=応募する
items.arcaneresin.apply=杖を樹脂でコーティングし、威力を増す！
items.arcaneresin.desc=紫と白の間できらめく細かいパウダー。魔法のエネルギーを増幅する作用があり、杖につけると杖のレベルを上げる！\n\n杖をアップグレードするには、杖の初期レベルに応じて1、2、3のレジンを必要とします。レジンは杖を最大+3までアップグレードできます。\n\nただし、樹脂のアップグレードは他のアップグレード・ソース（アップグレード・スクロールなど）に上書きされ、杖をメイジの杖に埋め込む際には適用されない。
items.arcaneresin.discover_hint=このアイテムは錬金術で作ることができる。
items.arcaneresin.level_too_high=あの杖は樹脂が改良するには強力すぎる。
items.arcaneresin.name=アルカン樹脂
items.arcaneresin.not_enough=そのためには樹脂が足りない！
items.arcaneresin.prompt=杖を選ぶ
