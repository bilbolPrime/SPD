items.artifacts.alchemiststoolkit.desc=このツールキットには多くの試薬とハーブ、そして小さな混合用小瓶が入っており、外出先で錬金術を行うことができる。小瓶には錬金術のエネルギー結晶のようなものが液体で入っている。
items.artifacts.alchemiststoolkit.desc_cursed=呪われたツールキットはあなたの側に縛り付けられ、錬金術を使わせてくれない。
items.artifacts.alchemiststoolkit.desc_hint=装備したツールキットは、経験を積むにつれて徐々に錬金術のエネルギーを生成していく。小瓶の中の調合液は、エネルギーの結晶を加えることでさらに強化できそうだ。
items.artifacts.alchemiststoolkit.desc_warming=ツールキットは現在ウォームアップ中で、しばらくすれば使えるようになる。
items.artifacts.alchemiststoolkit.energize_1=6エネルギー：レベル+1
items.artifacts.alchemiststoolkit.energize_all=%1$dエネルギー：+%2$dレベル
items.artifacts.alchemiststoolkit.energize_desc=エネルギー・クリスタル6個ごとに、ツールキットのレベルを上げるのに十分なエネルギーが得られる。\n\nどのくらいのエネルギーを使いますか？
