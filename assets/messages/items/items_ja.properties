items.scrolls.exotic.exoticscroll.tiwaz=エキゾチック・スクロール
items.scrolls.exotic.exoticscroll.unknown_desc=この黒い羊皮紙には、解読不能な魔法のルーンが書かれている。この土地にとっては異質なもののようだが、声に出して読んだらどうなるかは誰にもわからない。
items.scrolls.exotic.exoticscroll.yngvi=YNGVIのエキゾチックな巻物
items.scrolls.exotic.scrollofantimagic.desc=この巻物に書かれている呪文は、あなたを魔法のオーラで包み込み、有害なものであれ有用なものであれ、あらゆる魔法の効果を一時的に遮断します。これには杖、巻物、指輪、アーティファクト、エンチャント、呪いなど、ほとんどの魔法のアイテム効果が含まれる。ただし、ヒロイック・アーマーのアビリティは、それに関係なく機能するほど強力である。
items.scrolls.exotic.scrollofantimagic.name=対魔力の巻物
items.scrolls.exotic.scrollofchallenge$challengearena.desc=赤い霧が立ち込める魔法の闘技場があなたの周りに出現した。\n\n霧の中に立っている間、君の空腹度は上がらず、全てのダメージ源からのダメージが33%%減少する。他のダメージ軽減手段（アーマーなど）を持っている場合、それらは33%%軽減の後に適用される。\n\n残りターン%d。
items.scrolls.exotic.scrollofchallenge$challengearena.name=チャレンジアリーナ
items.scrolls.exotic.scrollofchallenge.desc=この巻物を声に出して読むと、大きな咆哮を放ち、敵を引き寄せると同時に、周囲に小さな闘技場を作り出す。\n\n読み手がこの闘技場に留まる限り、あらゆるソースから受けるダメージが33％減少し（これは他のダメージ減少の前に適用される）、満腹中枢が失われることもない。\n\nアリーナの大きさは読者がいるエリアの大きさに比例する。一部のボス・エリアでは特に小さくなる。
items.scrolls.exotic.scrollofchallenge.name=挑戦の巻物
items.scrolls.exotic.scrollofdivination$wnddivination.desc=あなたの占いの巻物は以下のアイテムを特定した：
items.scrolls.exotic.scrollofdivination.desc=この巻物は、あなたが現在知らない4種類のアイテムをランダムに識別します。識別されるアイテムは、ポーションの色、巻物のルーン、指輪の宝石です。識別されるアイテムは必ずしもあなたが持っているものとは限りません。
items.scrolls.exotic.scrollofdivination.name=えき
items.scrolls.exotic.scrollofdivination.nothing_left=識別するものは何も残っていない！
items.scrolls.exotic.scrollofdread.desc=この巻物を読むと、視界にいる全ての敵に信じられないほどの恐怖を与える赤い閃光が放たれる。この効果は絶大で、敵は急速にダンジョン全体から逃げ出し、二度と姿を現さなくなる！\n\n恐怖と同じように、この効果は時間経過や敵の攻撃によって切れることがある。\n\nボスのような意志の強い敵には、代わりに通常の恐怖が与えられる。
items.scrolls.exotic.scrollofdread.name=恐怖の巻物
items.scrolls.exotic.scrollofenchantment.armor=アーマーに適用するグリフを選択する。
items.scrolls.exotic.scrollofenchantment.cancel=キャンセル
items.scrolls.exotic.scrollofenchantment.cancel_warn=キャンセルしても、エンチャントの巻物は消費されますよ。
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=いや、気が変わったんだ
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=そうだね。
items.scrolls.exotic.scrollofenchantment.desc=この巻物は武器や防具に強力な魔力を吹き込む。読み手はどの魔法を吹き込むかをある程度コントロールすることもできる。
items.scrolls.exotic.scrollofenchantment.inv_title=アイテムをエンチャントする
items.scrolls.exotic.scrollofenchantment.name=魅惑の巻物
items.scrolls.exotic.scrollofenchantment.weapon=武器に適用するエンチャントを選択する。
items.scrolls.exotic.scrollofforesight.desc=この巻物を読むと、近くの地形の詳細が常に明瞭に読者の脳裏に浮かぶようになる。この効果はかなりの時間持続し、すべての隠されたドアや罠を明らかにし、探索を不要にする。
items.scrolls.exotic.scrollofforesight.name=先見の巻
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=キャンセルしても変態の巻物は消費されますよ？
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=変身する才能を選ぶ。
items.scrolls.exotic.scrollofmetamorphosis.desc=このスクロールには強力な変換魔法が含まれており、アイテムではなくキャスターに適用される。このスクロールの魔法は、才能を1つ選択し、それを異なるヒーロークラスの同じティアの5つの才能のうちの1つに置き換えることができる！\n\nこの効果はクラス・タレントにのみ適用され、サブクラスやアーマー・アビリティから得られるタレントには適用されない。使用できない才能は選択肢として与えられない。
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=変態タレント
items.scrolls.exotic.scrollofmetamorphosis.name=変身スクロール
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=変身した才能に代わる新しい才能を選ぶ。
items.scrolls.exotic.scrollofmysticalenergy.desc=この羊皮紙に込められた未加工の魔力は、放出されると使用者の装備したアーティファクトを時間経過とともにチャージする。
items.scrolls.exotic.scrollofmysticalenergy.name=神秘のエネルギーの巻物
items.scrolls.exotic.scrollofpassage.desc=この羊皮紙に書かれている呪文は、読み手を瞬時に1階上の最も近い地域へと移動させる。素早く店に行くのにとても便利だ。
items.scrolls.exotic.scrollofpassage.name=通過のスクロール
items.scrolls.exotic.scrollofprismaticimage.desc=この巻物に書かれた呪文は、読み手の色鮮やかな幻影の双子を作り出す。このプリズムのようなイメージは読み手の弱いクローンとして機能し、防御力は似ているがHPとダメージは低い。\n\nこのプリズム・イメージは敵がいると姿を現し、読者を守ろうとする。\n\n既にプリズム・イメージが存在する場合、このスクロールを使用すると完全に回復する。
items.scrolls.exotic.scrollofprismaticimage.name=プリズムの巻物
items.scrolls.exotic.scrollofpsionicblast.desc=この巻物には驚異的な破壊エネルギーが秘められており、目に見えるすべての生き物の心を破壊することができる。\n\nただし、大きな反動があり、読み手もダメージを受け、目が見えなくなり、弱体化する。この巻物が命中する対象が多ければ多いほど、受ける自己ダメージは少なくなる。
items.scrolls.exotic.scrollofpsionicblast.name=サイオニック・ブラスト・スクロール
items.scrolls.exotic.scrollofpsionicblast.ondeath=サイオニック・ブラストがあなたの心を引き裂く...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=このクリーチャーはサイレンの歌の巻物の魔法に魅了されている。\n\n魅了されたキャラクターは永久に君の味方となり、遭遇した敵と戦ってくれる。
items.scrolls.exotic.scrollofsirenssong$enthralled.name=うっとり
items.scrolls.exotic.scrollofsirenssong.cancel=ターゲットを選ばなければならない。
items.scrolls.exotic.scrollofsirenssong.desc=この巻物を読むと魅力的なメロディが流れ、ターゲットした敵を魅了し、永久に味方に変える！それを聞いた他の敵も一時的に魅了される。\n\n特に強い敵は魅了の効果に抵抗し、代わりに魅了される。
items.scrolls.exotic.scrollofsirenssong.name=サイレンズ・ソングの巻
items.scrolls.exotic.scrollofsirenssong.no_target=対象がなくても発動する。
items.scrolls.exotic.scrollofsirenssong.prompt=ターゲットを選ぶ
items.scrolls.inventoryscroll.no=いや、気が変わったんだ
items.scrolls.inventoryscroll.warning=本当にこの巻物の使用をキャンセルしますか？巻物は確認されていないので、いずれにせよ消費されます。
items.scrolls.inventoryscroll.yes=はい、私は前向きです
items.scrolls.scroll$placeholder.name=スクロール
items.scrolls.scroll.ac_read=読む
items.scrolls.scroll.berkanan=ベルカナンの巻
items.scrolls.scroll.blinded=目が見えないと巻物は読めない。
items.scrolls.scroll.cursed=呪われた呪文書によって、この巻物の魔法を発動することができません！呪いを解く巻物ならまだ使えるかもしれませんが...。
items.scrolls.scroll.gyfu=GYFUのスクロール
items.scrolls.scroll.isaz=ISAZの巻
items.scrolls.scroll.kaunan=KAUNANの巻
items.scrolls.scroll.laguz=ラグズの巻
items.scrolls.scroll.mannaz=MANNAZのスクロール
items.scrolls.scroll.naudiz=NAUDIZの巻
items.scrolls.scroll.no_magic=魔法の免疫がある間は巻物を読むことはできない。
items.scrolls.scroll.odal=ODALのスクロール
items.scrolls.scroll.raido=RAIDOのスクロール
items.scrolls.scroll.sowilo=SOWILOの巻
items.scrolls.scroll.tiwaz=TIWAZの巻
items.scrolls.scroll.unknown_desc=この羊皮紙には判読できない文字がびっしりと書かれ、表題には%sのルーンが記されている。声に出して読むと何が起こるのだろう？
items.scrolls.scroll.yngvi=YNGVIの巻
items.scrolls.scrollofidentify.desc=一つのアイテムにまつわるすべての秘密を永久に明らかにする。
items.scrolls.scrollofidentify.inv_title=アイテムを特定する
items.scrolls.scrollofidentify.it_is=商品が特定されました：%s.
items.scrolls.scrollofidentify.name=鑑定の巻物
items.scrolls.scrolloflullaby.desc=心地よいメロディーは、視界に入るすべての生き物を深い眠りに誘い、逃げるチャンスや奇襲攻撃を仕掛けるチャンスを与えてくれる。
items.scrolls.scrolloflullaby.name=子守唄の巻物
items.scrolls.scrolloflullaby.sooth=巻物が心地よいメロディーを奏でる。あなたはとても眠くなる。
items.scrolls.scrollofmagicmapping.desc=この巻物を読むと、鮮明なイメージがあなたの記憶に刻まれ、レベルの正確なレイアウトと隠された秘密がすべて明らかになります。アイテムやクリーチャーの位置は不明のままである。
items.scrolls.scrollofmagicmapping.layout=これでレベルレイアウトはお分かりいただけただろう。
items.scrolls.scrollofmagicmapping.name=魔法の地図の巻物
items.scrolls.scrollofmirrorimage.copies=巻物はあなたの鏡像を形成する。
items.scrolls.scrollofmirrorimage.desc=この巻物に記された呪文は、読者の幻影の双子を生み出し、それが読者の敵を追い詰めるだろう。
items.scrolls.scrollofmirrorimage.name=鏡像の巻物
items.scrolls.scrollofmirrorimage.no_copies=巻物はあなたの鏡像を作ろうとするが、行き場がない。
items.scrolls.scrollofrage.desc=この巻物を声に出して読むと、大咆哮を放ち、すべての敵を読者に引き寄せ、近くにいる敵を激怒させる。
items.scrolls.scrollofrage.name=怒りの巻物
items.scrolls.scrollofrage.roar=巻物はダンジョン全体に響き渡る怒号を発する！
items.scrolls.scrollofrecharging.desc=この羊皮紙に秘められた純粋な魔力が解放されると、読者の杖はすべて完全な力を取り戻すだろう。
items.scrolls.scrollofrecharging.name=充填の巻物
items.scrolls.scrollofrecharging.surge=エネルギーの波が全身を駆け巡り、杖を活性化させる！
items.scrolls.scrollofremovecurse.cleansed=あなたのアイテムは浄化の光で輝き、邪悪なエネルギーが散っていく！
items.scrolls.scrollofremovecurse.desc=この巻物に記された呪文は、読者の武器、防具、指輪、そして所持品にかけられた、着用者がそれらを取り外すことを妨げる可能性のあるあらゆる邪悪な魔法を瞬時に解除します。
items.scrolls.scrollofremovecurse.inv_title=アイテムをクリーニングする
items.scrolls.scrollofremovecurse.name=解呪の巻物
items.scrolls.scrollofremovecurse.not_cleansed=アイテムが浄化の光で輝くが、何も起こらない。
items.scrolls.scrollofremovecurse.spirit=あなたの巻物は苦悩する魂を解放する！
items.scrolls.scrollofretribution.blast=巻物から強力な魔力が噴出する！
items.scrolls.scrollofretribution.desc=この巻物には破壊的なエネルギーが含まれており、読者の苦しみを力の爆発に変える。読み手が弱ければ弱いほど、与えるダメージは大きくなる。体力が非常に少ない場合、この巻物はほとんどの敵を即死させることができる。\n\nしかし、この巻物を使用すると、使用者は目が見えなくなり、弱体化する。
items.scrolls.scrollofretribution.name=報復の巻物
items.scrolls.scrollofteleportation.cant_reach=テレポートはできない。
items.scrolls.scrollofteleportation.desc=この羊皮紙に書かれた呪文は、読者をダンジョン内のランダムな場所に瞬時に転送します。危険な状況から脱出するために使用できますが、不運な読者はさらに危険な場所に迷い込んでしまうかもしれません。
items.scrolls.scrollofteleportation.name=転移の巻物
items.scrolls.scrollofteleportation.no_tele=テレポートの魔法は失敗した。
items.scrolls.scrollofteleportation.prompt=テレポートする場所を選ぶ
items.scrolls.scrollofteleportation.tele=瞬く間に、あなたはレベルの別の場所にテレポートされた。
items.scrolls.scrollofterror.desc=赤い閃光が視界内のすべての生物を恐怖に陥れ、彼らは向きを変えて逃げ出す。逃げる敵を攻撃すると、この効果は解除される。
items.scrolls.scrollofterror.many=巻物は鮮やかな赤い閃光を放ち、怪物たちは逃げていく！
items.scrolls.scrollofterror.name=恐怖の巻物
items.scrolls.scrollofterror.none=巻物が赤い閃光を放つ。
items.scrolls.scrollofterror.one=巻物は鮮やかな赤い閃光を放ち、%sは逃げ去った！
items.scrolls.scrolloftransmutation.desc=この巻物には強力な変身魔法が秘められている。対象となるアイテムに使用すると、同じ種類の別のアイテムに変身する。この魔法はアップグレード、エンチャント、グリフも保存する。スクロールやポーションはエキゾチックなアイテムに変換される。
items.scrolls.scrolloftransmutation.inv_title=アイテムを変換する
items.scrolls.scrolloftransmutation.morph=あなたのアイテムは違うものに変身する！
items.scrolls.scrolloftransmutation.name=転生の巻物
items.scrolls.scrolloftransmutation.nothing=何も面白いことは起こらない。
items.scrolls.scrollofupgrade.desc=この巻物は、特定のアイテムを強化し、その品質を向上させます。杖は威力と使用回数が増加し、武器はより大きなダメージを与えたり、命中率が向上したりします。鎧はより多くの攻撃を防御し、指輪は装着者への効果を強めます。また、武器や防具の使用に必要な力も軽減され、アイテムにかけられた呪いもすべて解かれます。
items.scrolls.scrollofupgrade.inv_title=アイテムのアップグレード
items.scrolls.scrollofupgrade.name=強化の巻物
items.scrolls.scrollofupgrade.remove_curse=アップグレードの巻物は、アイテムにかけられた呪いを浄化する！
items.scrolls.scrollofupgrade.weaken_curse=アップグレードの巻物は、アイテムの呪いを弱める。
items.spells.alchemize$wndalchemizeitem.energize=%dエネルギーに変わる
items.spells.alchemize$wndalchemizeitem.energize_1=1を%dエネルギーに変える
items.spells.alchemize$wndalchemizeitem.energize_all=すべてを%dのエネルギーに変える
items.spells.alchemize$wndalchemizeitem.sell=%dgに変わる
items.spells.alchemize$wndalchemizeitem.sell_1=ターン1を%dgへ
items.spells.alchemize$wndalchemizeitem.sell_all=すべてを%dgに変える
items.spells.alchemize.desc=この呪文には錬金術の壺にあるような変成の力が含まれている。1回唱えるごとに、アイテム（またはアイテムの束）を金や錬金術のエネルギーに変えることができる。ポーションや巻物をエネルギーに変えると、それらを識別することもできる！\n\nアルケマイズはショップで販売されているものもあるが、シード、ルーンストーン、そして少量の錬金術エネルギーを組み合わせることで、錬金術で作ることができるものも多い。
items.spells.alchemize.name=アルケマイズ
items.spells.alchemize.prompt=アイテムを錬金する
items.spells.beaconofreturning.creatures=隣接するクリーチャーのサイキックオーラによって、この瞬間はテレポートできない。
items.spells.beaconofreturning.desc=この複雑な呪文は、距離に関係なく、設定した場所に戻る能力を使用者に与える。この呪文は戻ることでのみ消費され、何度でも設定できるが、設定した直近の場所しか記憶しない。
items.spells.beaconofreturning.desc_set=このビーコンは%d階のどこかに設置されていた。
items.spells.beaconofreturning.name=帰国ののろし
items.spells.beaconofreturning.preventing=この場所には強い魔法のオーラがあり、呪文を使うことができない！
items.spells.beaconofreturning.set=ビーコンは現在地に設置された。
items.spells.beaconofreturning.wnd_body=設定は、ビーコンが以前に設定されていた場所を上書きする。\n\n戻ると最後に設定した場所に戻り、呪文を1回消費する。
items.spells.beaconofreturning.wnd_return=リターン
items.spells.beaconofreturning.wnd_set=セット
items.spells.curseinfusion.desc=この魔法はDM-300に存在するのと同じ強力な悪性魔法を装備品に吹き込む。使用されたアイテムは即座に呪われ、エンチャントやグリフは上書きされる。\n\n武器、防具、杖の場合、アイテムは呪われるだけでなくアップグレードされる。呪い注入のアップグレードはスタックせず、アイテムが呪われていない状態になるとアップグレードは失われる。\n\n複数のCurse Infusionを使用して武器や防具の呪いを変更することもできる。
items.spells.curseinfusion.inv_title=アイテムを呪う
items.spells.curseinfusion.name=呪い注入
items.spells.magicalinfusion.desc=この呪文はアップグレードの巻物と同じ魔力を持つが、より安定した形をしている。\n\n通常通りアイテムをアップグレードするだけでなく、エンチャントやグリフ、呪いを消すこともない。
items.spells.magicalinfusion.infuse=アイテムにアーケイン・エネルギーが注入される！
items.spells.magicalinfusion.inv_title=アイテムを注入する
items.spells.magicalinfusion.name=マジカルインフュージョン
items.spells.magicalporter.desc=この魔法は魔法でアイテムを転送する。ただし、商人のビーコンとは異なり、アイテムは次のボスフロアの入り口まで転送される。
items.spells.magicalporter.inv_title=アイテムの移植
items.spells.magicalporter.name=マジカルポーター
items.spells.magicalporter.nowhere=アイテムを移植する場所がない。
items.spells.phaseshift.desc=このカオスな呪文は、狙ったキャラクターを現在のフロアのランダムな場所にテレポートさせ、かなりの時間スタンさせる。強力な敵はスタン効果に耐えることができる。この呪文はターゲットに向けることも、使用者自身に向けることもできる。
items.spells.phaseshift.name=位相シフト
items.spells.phaseshift.no_target=そこにはテレポートするものは何もない。
items.spells.reclaimtrap.desc=この呪文にはDM-300の機械エネルギーの残骸が含まれている。アクティブな罠にかけると、罠のパワーがあなたに付着し、再び呪文を使うことでこのパワーを追い出し、好きな場所で罠の効果を発動させることができる。\n\nただし、場所によっては機能しない罠もあり、一度に保管できる罠は1つだけである。
items.spells.reclaimtrap.desc_trap=呪文は現在、_%s._を発動する準備ができています。
items.spells.reclaimtrap.name=罠を埋め立てる
items.spells.reclaimtrap.no_trap=そこに罠はない。
items.spells.recycle.desc=この呪文には転生魔法の一種が含まれている。装備品には効かないが、この呪文は巻物、ポーション、シード、ルーンストーン、先端が尖ったダーツを、同じ種類のランダムなアイテムに変化させる。
items.spells.recycle.inv_title=アイテムをリサイクルする
items.spells.recycle.name=リサイクル
items.spells.recycle.recycled=あなたの商品はリサイクルされました：%s.
items.spells.spell.ac_cast=キャスト
items.spells.spell.discover_hint=このアイテムは錬金術で作ることができる。
items.spells.spell.no_magic=魔法免疫がある間は呪文を唱えられない。
items.spells.summonelemental.ac_imbue=インビュー
items.spells.summonelemental.desc=この呪文はエレメンタルの燃えかすのエネルギーをチャネリングし、友好的なエレメンタルを召喚して共に戦わせることができる！一度に召喚できるエレメンタルは1体だけだが、この呪文を唱え直すことでコストをかけずにエレメンタルを自分のもとに戻すことができる。
items.spells.summonelemental.desc_chaos=その呪文は現在カオスエネルギーを放っており、カオスエレメンタルを召喚する。別のアイテムを呪文に込めることはできるが、その呪文は現在のアイテムを失う。
items.spells.summonelemental.desc_fire=その呪文は現在触ると熱く、_fire elemental_を召喚する。別のアイテムを呪文に込めることもできるが、その呪文は現在の効果を失う。
items.spells.summonelemental.desc_frost=その呪文は現在冷たく、_frost elemental_を召喚する。別のアイテムを付与することもできるが、その呪文は現在の付与を失う。
items.spells.summonelemental.desc_newborn=この呪文は現在染み込ませておらず、範囲攻撃なしで_新生エレメンタル_を召喚する。この呪文をパワーアップさせるために、炎の液体ポーション、霜のポーション、充電の巻物、変成の巻物のいずれかを埋め込めば、将来召喚されるエレメンタルをフルパワーにすることができる！
items.spells.summonelemental.desc_shock=その呪文は現在静的エネルギーを放っており、_shock elemental_を召喚する。別のアイテムを付与することもできるが、その呪文は現在の付与を失う。
items.spells.summonelemental.imbue_prompt=アイテムを埋め込む
items.spells.summonelemental.name=エレメンタルを召喚
items.spells.targetedspell.inv_title=アイテムを注入する
items.spells.targetedspell.prompt=ターゲットを選ぶ
items.spells.telekineticgrab.cant_grab=それをつかむことはできない。
items.spells.telekineticgrab.desc=この呪文により、キャスターは遠隔操作でその場所にあるすべてのアイテム、あるいは敵に突き刺さったすべての投擲武器をつかむことができる！\n\n他人が所有しているアイテムを掴んだり、チェストのような容器を掴んだりすることはできない。
items.spells.telekineticgrab.name=テレキネティック・グラブ
items.spells.telekineticgrab.no_target=そこにつかむものは何もない。
items.spells.unstablespell.desc=この小さな黒い正方形のクリスタルの表面には、それぞれルーン文字が描かれている。\n\n発動するとランダムなスクロールの効果が発動する。スクロールの効果は、視界内に敵がいる場合は常に戦闘に集中し、それ以外の場合は常に非戦闘に集中する。
items.spells.unstablespell.name=不安定な呪文
items.spells.wildenergy.desc=この呪文にはDM-300の動力源となった呪われたエネルギーの一部が含まれている。この魔法を唱えると、杖や身につけたアーティファクトをリチャージし、ランダムな呪いの杖の効果を発動する。ただし、この呪われた魔法を放つ方向を選ぶことができる。
items.spells.wildenergy.name=ワイルド・エネルギー
items.stones.inventorystone.ac_use=使用
items.stones.runestone$placeholder.name=ルーンストーン
items.stones.runestone.discover_hint=このアイテムはダンジョン内でランダムに見つかるか、錬金術で作ることができる。
items.stones.stoneofaggression$aggression.desc=操作魔法により、近くにいるすべての敵がこのキャラクターを攻撃したがるようになる。\n\n残りターン%s。
items.stones.stoneofaggression$aggression.name=ターゲット
items.stones.stoneofaggression.desc=この石を味方か敵に投げつけると、近くにいるすべての敵が短時間そのキャラクターを攻撃するようになる。\n\nただし、ボスの敵はこの効果に抵抗することができ、効果時間が大幅に短縮され、ミニオンの攻撃から受けるダメージが減少する。
items.stones.stoneofaggression.name=侵略の石
items.stones.stoneofaugmentation$wndaugment.cancel=気にするな
items.stones.stoneofaugmentation$wndaugment.choice=何を強化したい？
items.stones.stoneofaugmentation$wndaugment.damage=ダメージ
items.stones.stoneofaugmentation$wndaugment.defense=ディフェンス
items.stones.stoneofaugmentation$wndaugment.evasion=回避
items.stones.stoneofaugmentation$wndaugment.none=補強を取り除く
items.stones.stoneofaugmentation$wndaugment.speed=スピード
items.stones.stoneofaugmentation.desc=このルーンストーンは強力な魔法を持っており、装備品を補強することで、別の特性を犠牲にして別の特性を強化することができる。\n\n武器に使用すると、スピードかダメージのどちらかを強化できる。また、投擲武器はスピードに比例して耐久力が増減する。\n\nアーマーに使用すると、防御力と回避力のどちらかを強化できる。
items.stones.stoneofaugmentation.discover_hint=このアイテムは店で買うか、錬金術で作ることができる。
items.stones.stoneofaugmentation.inv_title=アイテムを補強する
items.stones.stoneofaugmentation.name=増強石
items.stones.stoneofblast.desc=このルーンストーンは投げられた場所で即座に爆発する。爆弾のように、爆発は近くにあるものにダメージを与える。
items.stones.stoneofblast.name=爆風石
items.stones.stoneofblink.desc=このルーンストーンは投げられた場所にテレポートする。
items.stones.stoneofblink.name=瞬きの石
items.stones.stoneofclairvoyance.desc=この石を投げると、投げる場所の非常に広い範囲にあるすべてのタイルが瞬時に浮かび上がる。その効果は壁を通り抜けて届くことさえある。
items.stones.stoneofclairvoyance.name=千里眼の石
items.stones.stoneofdeepsleep.desc=この石を敵に投げつけると、深い魔法の眠りにつく。魔法で眠らされた敵は、邪魔が入るまで永遠に眠り続ける。
items.stones.stoneofdeepsleep.name=眠りの石
items.stones.stoneofdetectmagic.desc=このルーンストーンは、アイテムに影響を及ぼしている魔法を検出することができる。正体不明のアイテムにこの石を使用すると、それが悪意のある呪いの影響を受けているかどうか、またエンチャントやアップグレードのようなポジティブな魔法の影響を受けているかどうかがわかる。
items.stones.stoneofdetectmagic.detected_bad=このアイテムに影響する悪意のある魔法を感知する！
items.stones.stoneofdetectmagic.detected_both=あなたはこのアイテムに影響を与える正と悪の両方の魔法を感知する！
items.stones.stoneofdetectmagic.detected_good=あなたはこのアイテムに影響を与える正の魔法を感知する！
items.stones.stoneofdetectmagic.detected_none=このアイテムに影響を与える魔法は検出されない。
items.stones.stoneofdetectmagic.inv_title=アイテムを検出する
items.stones.stoneofdetectmagic.name=けんまいし
items.stones.stoneofdisarming.desc=このルーンストーンは、ダンジョンのあちこちに隠された悪質な罠を無効化する魔法を秘めている。投げられた場所の周囲にある最大9つの罠を解除することができる。
items.stones.stoneofdisarming.name=武装解除の石
items.stones.stoneofenchantment.armor=暗闇の中で鎧が光る！
items.stones.stoneofenchantment.desc=このルーンストーンはエンチャント・マジックを持っている。アップグレード・スクロールとは異なり、アイテムの直接的なパワーを増加させるのではなく、武器や防具にエンチャントを付与し、新たなパワーを与える。
items.stones.stoneofenchantment.inv_title=アイテムをエンチャントする
items.stones.stoneofenchantment.name=魅惑の石
items.stones.stoneofenchantment.weapon=暗闇の中で武器が光る！
items.stones.stoneoffear.desc=この石を投げつけられたキャラクターは恐怖に圧倒され、向きを変えて逃げ出す。逃げているキャラクターを攻撃すると、効果が短くなる。
items.stones.stoneoffear.name=恐れの石
items.stones.stoneofflock.desc=このルーンストーンは、投げられた場所の周囲に魔法の羊を短時間召喚する。
items.stones.stoneofflock.name=群れの石
items.stones.stoneofintuition$wndguess.break=あなたの直感の石は粉々に砕け散る...。
items.stones.stoneofintuition$wndguess.correct=正しい。アイテムのタイプは特定されている！
items.stones.stoneofintuition$wndguess.incorrect=あなたの推測は間違っていた。
items.stones.stoneofintuition$wndguess.text=未確認アイテムの種類を当ててください。正解すると、種類が特定されます！
items.stones.stoneofintuition.break_info=直観の石は1つ壊れるまでに2回使うことができ、次の使用では石を消費しない。
items.stones.stoneofintuition.break_warn=あなたは以前に直観の石を使ったので、次に使うときは石を消費する。
items.stones.stoneofintuition.desc=このルーンストーンは、識別の巻物に見られる魔法の弱いバージョンである。アイテムを直接識別するのではなく、あなたの直感に働きかけ、ポーションや巻物、指輪の種類を推測して識別することを可能にする。
items.stones.stoneofintuition.inv_title=項目を選択
items.stones.stoneofintuition.name=直観の石
items.stones.stoneofshock.desc=このルーンストーンは電気エネルギーの爆発を放ち、近くにいるすべての対象を短時間スタンさせる。
items.stones.stoneofshock.name=衝撃の石
items.stylus.ac_inscribe=インスクライブ
items.stylus.cursed=呪われた鎧にはタッチペンの魔法が効かない。
items.stylus.desc=このアーケイン・スタイラスは暗くて非常に硬い石でできている。これを使えば鎧に魔法のグリフを刻むことができるが、どんなグリフにするかは君には決められない。
items.stylus.identify=まず、その鎧が呪われているかどうかを確認しなければならない。
items.stylus.inscribed=あなたはスタイラスで鎧を刻んだ。
items.stylus.name=アルカンスタイラス
items.stylus.prompt=防具の選択
items.tengusmask.ac_wear=ウェア
items.tengusmask.desc=このマスクは天狗が死ぬときに顔から落ちたもので、そこから大きな魔力が発せられているのを感じる。この仮面が天狗の力の源だったのだろうか。\n\nこの仮面を身につけると、仮面の強大な力があなたに乗り移り、ヒーローのサブクラスを選ぶことができる。\n\nどのサブクラスを選ぶ？
items.tengusmask.discover_hint=このアイテムは特定の敵からドロップで入手できる。
items.tengusmask.name=天狗のマスク
items.tengusmask.used=マスクの力があなたに流れ込むと、マスクは崩壊する！
items.torch.ac_light=ライト
items.torch.desc=ダンジョンが暗くなると、松明が道しるべとなる。
items.torch.name=トーチ
items.trinkets.chaoticcenser.desc=錬金術の壺の中に入れてしばらくすると、この香炉は勝手に煙を出しているように見える！このガスは蓄積され、半不規則な間隔で敵に向かって噴出する。あらゆる種類のガスを発生させることができるようだが、香炉が作動する直前に一瞬だけ警告が出る。
items.trinkets.chaoticcenser.name=混沌香炉
items.trinkets.chaoticcenser.spew=あなたの香炉は噴出しようとしている%s。
items.trinkets.chaoticcenser.stats_desc=現在のレベルでは、この装身具はおよそ_%d_ターンごとに敵の近くで有害なガスを発生させる。ガスは敵がいるときのみ出現する。レベルが高くなると、これらのガスはエキゾチックで強力なものになる可能性が高くなる。
items.trinkets.chaoticcenser.typical_stats_desc=通常、この装身具はおよそ_%d_ターンごとに敵の近くで有害なガスを発生させる。ガスは敵がいるときのみ出現する。レベルが高くなると、これらのガスはエキゾチックで強力なものになる可能性が高くなる。
items.trinkets.crackedspyglass.desc=この手持ち望遠鏡は、前面のレンズにひびが入っていなければ、素晴らしく精密な出来栄えを示すものだ。この覗き眼鏡はダンジョン内の新しいアイテムを発見することであなたを助けているようだが、その欠陥のせいで発見されたアイテムはかなり見づらい！
items.trinkets.crackedspyglass.name=ひび割れスパイグラス
items.trinkets.crackedspyglass.stats_desc=現在のレベルでは、この装身具はボス以外の各フロアに_%1$s%%の確率で追加の隠しアイテムを作る。
items.trinkets.crackedspyglass.stats_desc_upgraded=現在のレベルでは、この装身具はボス以外の各フロアに_100%%の確率で隠しアイテムを1つ、_%1$s%%の確率で2つ目の隠しアイテムを生成する。
items.trinkets.crackedspyglass.typical_stats_desc=通常、このアイテムはボスフロア以外の各フロアに_%1$s%%の確率で隠されたアイテムを生成する。
items.trinkets.dimensionalsundial.desc=この小さな手持ち式の日時計は、なぜかダンジョンの奥深くに影を落とすことができる。さらに不思議なことに、影の位置はこの世界の太陽とは無関係のようだ。影がないとき、日時計は危険を引き寄せているようだ。
items.trinkets.dimensionalsundial.name=次元日時計
items.trinkets.dimensionalsundial.stats_desc=現在のレベルでは、この装身具は現実の昼間（午前8時～午後8時）に敵の出現率を_%1$d%%_減少させ、夜間（午後8時～午前8時）に敵の出現率を_%2$d%%_増加させる。
items.trinkets.dimensionalsundial.typical_stats_desc=通常この装身具は、現実の昼間（午前8時～午後8時）には敵の出現率を_%1$d%%_減らし、夜間（午後8時～午前8時）には敵の出現率を_%2$d%%_増やす。
items.trinkets.dimensionalsundial.warning=日時計が影を落としていない。
items.trinkets.exoticcrystals.desc=この小さなピンク色の結晶は、錬金術のエネルギーの結晶と同じ形をしている。直接エネルギーとして使うことはできないが、見つけたポーションや巻物に何らかの影響を与えているようだ。
items.trinkets.exoticcrystals.name=エキゾチック・クリスタル
items.trinkets.exoticcrystals.stats_desc=現在のレベルでは、この装身具はポーションやスクロールのドロップの_%s%%_をエキゾチックな同等品に置き換えます。これは強さのポーション、アップグレードのスクロール、ハザードルームを解決するために生成されるアイテムには影響しません。
items.trinkets.exoticcrystals.typical_stats_desc=通常、この装身具はポーションやスクロールのドロップの_%s%%_をエキゾチックな同等品に置き換える。これは、強さのポーション、アップグレードのスクロール、ハザードルームを解決するために生成されるアイテムには影響しません。
items.trinkets.eyeofnewt.desc=この黄金色と黒色のイモリの目は一般的な材料で、現在は装身具として強化されている。この眼は、別の方法で物事を見られるようにする代わりに、視力を低下させているようだ。
items.trinkets.eyeofnewt.name=イモリの目
items.trinkets.eyeofnewt.stats_desc=現在のレベルでは、この装身具は視界の範囲を_%1$s%%_狭めるが、_%2$d_タイル内の敵にマインド・ビジョンを与える。
items.trinkets.eyeofnewt.typical_stats_desc=通常、この装身具は視界の範囲を_%1$s%%_狭めるが、_%2$d_タイル内の敵にマインド・ビジョンを与える。
items.trinkets.ferrettuft.desc=絹のような白いフェレットの毛を、ライムグリーンのリボンでつないだもの。フェレットは敏捷で、いたずら好きで、誠実さに欠けることで知られている。そのパワーの一部は、この装身具から放たれているようで、近くにいるものの回避能力を高めている。
items.trinkets.ferrettuft.name=フェレットタフト
items.trinkets.ferrettuft.stats_desc=現在のレベルでは、この装身具はすべてのキャラクターの回避を_%1$s%%_増加させる。
items.trinkets.ferrettuft.typical_stats_desc=通常、この装身具は全キャラクターの回避を_%1$s%%_増加させる。
items.trinkets.mimictooth.desc=この大きな鋭い歯は、とても不幸なミミックから抜かれたに違いない。ダンジョンのミミックたちに影響を与え、より頻繁に、より危険な状態にしているようだ。
items.trinkets.mimictooth.name=擬態歯
items.trinkets.mimictooth.stats_desc=現在のレベルでは、この装身具はあらゆる種類のミミック_%1$sx_をより一般的に、より発見しにくくしますが、彼らが落とす戦利品の量も増やします。また、ダンジョンの各フロアには、_%2$s%%_の確率でステルス黒檀ミミックが出現する。
items.trinkets.mimictooth.typical_stats_desc=通常、この装身具はあらゆる種類のミミック_%1$sx_をより多く出現させ、発見するのをより困難にするが、彼らが落とす戦利品の量も増加させる。また、ダンジョンの各フロアには_%2$s%%_の確率でステルス性の黒檀のミミックが出現する。
items.trinkets.mossyclump.desc=この湿ったミズゴケの塊は、どんなに強く握りしめても水分を保っているようだ。ダンジョン自体に魔法がかけられているようで、草や水が現れやすくなっている。
items.trinkets.mossyclump.name=苔の塊
items.trinkets.mossyclump.stats_desc=現在のレベルでは、この装身具はテーマのないフロアの_%d%%_を水か草で満たすようにする。\n\nこの装身具はアップグレードに多くのエネルギーを消費します。
items.trinkets.mossyclump.typical_stats_desc=通常、このアクセサリーを使うと、テーマがないフロアの_%d%%_が水か草で満たされるようになる。\n\nこの装身具はアップグレードに多くのエネルギーを消費します。
items.trinkets.parchmentscrap.desc=この羊皮紙の切れ端は、まるで巻物のようだ。魔力の一部を残しており、ダンジョンで見つけた武器や防具に影響を与えているようだ。
items.trinkets.parchmentscrap.name=パーチメントスクラップ
items.trinkets.parchmentscrap.stats_desc=現在のレベルでは、この装身具はエンチャントとグリフ_%dx_をコモンにし、武器と防具の呪い_%sx_をコモンにする。杖、指輪、アーティファクトの呪いは影響を受けない。\n\nこの装身具はアップグレードに多くのエネルギーを消費する。
items.trinkets.parchmentscrap.typical_stats_desc=通常、この装身具はエンチャントとグリフを_%dx_コモンにし、武器と防具の呪いを_%sx_コモンにする。杖、指輪、アーティファクトの呪いは影響を受けない。\n\nこの装身具はアップグレードに多くのエネルギーを消費する。
items.trinkets.petrifiedseed.desc=この種子は、ゆっくりとした地質学的過程か魔法によって化石化したものである。この種は魔法によってダンジョンの植物相に影響を与えているようで、時折植物の種をルーンストーンに置き換えている。
items.trinkets.petrifiedseed.name=石種
items.trinkets.petrifiedseed.stats_desc=現在のレベルでは、この装身具は踏まれた草が種の代わりにルーンストーンを落とすことが_%1$s%%_多くなり、高い草がアイテムを落とすことも_%2$s%%_多くなる。
items.trinkets.petrifiedseed.typical_stats_desc=通常、この装身具を使用すると、踏み荒らされた草が種の代わりにルーンストーンを落とすことが多くなり、草が高い場所にあるとアイテムを落とすことが多くなる。
items.trinkets.ratskull.desc=この不気味な装身具は、普通のネズミの頭蓋骨よりそれほど大きくない。この頭蓋骨の魔力は、ダンジョンの珍しい住人たちを引きつけ、より頻繁に出現させるようだ。
items.trinkets.ratskull.name=ラットスカル
items.trinkets.ratskull.stats_desc=現在のレベルでは、この装身具はレアなエキゾチック・エネミー_%dx_を出現しやすくする。しかし、この頭蓋骨は水晶の模造品や鎧の彫像を引き寄せる効果は半分しかない。
items.trinkets.ratskull.typical_stats_desc=通常、この装身具はレアなエキゾチック・エネミー_%dx_を出現しやすくする。しかし、この頭蓋骨は水晶の模造品や鎧の彫像を引き寄せる効果は半分しかない。
items.trinkets.saltcube.desc=この大きな塩の結晶は、ほぼ完璧な立方体の形にカットされており、どういうわけか溶ける代わりに錬金術の鍋から半分の水を排出することに成功した。食べたものを魔法のように脱水して保存し、満腹感を長持ちさせているようだが、飢餓状態でないときの健康回復も弱めている。
items.trinkets.saltcube.name=角塩
items.trinkets.saltcube.stats_desc=現在のレベルでは、この装身具は空腹になるまでの時間を_%1$s%%_増加させるが、フロアがロックされていない限り、体力の回復速度を_%2$s%%_減少させる。
items.trinkets.saltcube.typical_stats_desc=通常、この装身具は空腹になるまでの時間を_%1$s%%_増加させるが、フロアがロックされていない限り、体力の回復速度を_%2$s%%_減少させる。
items.trinkets.shardofoblivion$thrownusetracker.desc=あなたは最近、未確認の投擲武器を使用したが、これは少しの間、忘却の欠片の使用済み未確認装備品としてカウントされる。\n\n残りターン%s.
items.trinkets.shardofoblivion$thrownusetracker.name=使用された正体不明の投擲武器
items.trinkets.shardofoblivion$wandusetracker.desc=あなたは最近、正体不明の杖を使用したが、これは少しの間、忘却の欠片の使用済み正体不明の装備品1個としてカウントされる。\n\n残りターン数%s.
items.trinkets.shardofoblivion$wandusetracker.name=使用された正体不明の杖
items.trinkets.shardofoblivion.ac_identify=識別
items.trinkets.shardofoblivion.desc=錬金術の鍋で煮込んだ後、この呪われた金属の小さな欠片は、何もないものに変わった。光は欠片のまわりで曲がっているように見え、あなたが欠片を持っていないときはその場に浮かんでいる。その破片は、あなたの無知から魔法でパワーを引き出しているようだ。
items.trinkets.shardofoblivion.identify=あなたはそのアイテムを特定する！
items.trinkets.shardofoblivion.identify_not_yet=その項目はまだ特定できていない。
items.trinkets.shardofoblivion.identify_prompt=アイテムを特定する
items.trinkets.shardofoblivion.identify_ready=アイテムが識別できるようになりました：%s。それを識別するために「忘却の欠片」を使用する。
items.trinkets.shardofoblivion.identify_ready_worn=これで着用アイテムの識別が完了した。アイテムに "忘却の欠片 "を使ってアイテムを識別しましょう。
items.trinkets.shardofoblivion.name=忘却の欠片
items.trinkets.shardofoblivion.stats_desc=現在のレベルでは、敵が戦利品をドロップする確率を、装備している、または最近使用した未識別の装備品1つにつき20%%増加させる。この欠片は装備の識別を妨げるが、手動でアイテムを識別することができる。
items.trinkets.shardofoblivion.typical_stats_desc=通常、この装身具は敵が戦利品をドロップする確率を、装備している、もしくは最近使用した未識別の装備品1つにつき20%%増加させる。この欠片は装備の識別を妨げるが、手動でアイテムを識別することができる。
items.trinkets.thirteenleafclover.desc=錬金術の鍋で煮込んでいるうちに、どういうわけかこのクローバーの葉がたくさん増えてしまった！この装身具が幸運なのか不運なのかよくわからないが、もしかしたらこの装身具があなたの運をより混沌とさせるのだろうか？
items.trinkets.thirteenleafclover.name=十三葉のクローバー
items.trinkets.thirteenleafclover.stats_desc=現在のレベルでは、この装身具は最大ダメージ_%1$d%%_と最小ダメージ_%2$d%%_を与える。
items.trinkets.thirteenleafclover.typical_stats_desc=通常、この装身具は最大ダメージ（%1$d%%）と最小ダメージ（%2$d%%）を与える。
items.trinkets.trapmechanism.desc=ダンジョンの落とし穴トラップの核となる仕掛けで、持ち運べるように床から慎重に削り出してある。ダンジョンそのものと魔法で結びついているようで、危険な地形がより一般的になるが、それに対する親和性も高まる。
items.trinkets.trapmechanism.name=トラップ機構
items.trinkets.trapmechanism.stats_desc=現在のレベルでは、この装身具はテーマのないフロアの_%1$d%%_をトラップか峡谷で埋め尽くすようにする。さらに、ダンジョンの隠された罠の_%2$d%%_が見えるようになる。
items.trinkets.trapmechanism.typical_stats_desc=通常、この装身具を使用すると、テーマのないフロアの_%1$d%%_がトラップか峡谷で埋め尽くされるようになる。さらに、ダンジョンの隠された罠の_%2$d%%_が見えるようになる。
items.trinkets.trinket$placeholder.name=ストーン
items.trinkets.trinket.discover_hint=このアイテムは、錬金術で装身具を作るたびに選択肢に入る可能性がある。
items.trinkets.trinketcatalyst$randomtrinket.desc=近くにあるアイテムが1つ、袋の中に入っていて開けられない。\n\n錬金術で袋を溶かすことができるが、どんなアクセサリーが手に入るかはやってみないとわからない！
items.trinkets.trinketcatalyst$randomtrinket.name=ランダム装身具
items.trinkets.trinketcatalyst.desc=ダンジョンの暗闇の中でキラキラと輝く、魔法の金粉の玉。この触媒を錬金釜で使用すると、わずかな錬金エネルギーでユニークな装身具を作ることができる。\n\nトリンケットは、ダンジョンやその住人をわずかに変化させるさまざまな効果をもたらす。このアイテムは、より強力な効果を得るために、より多くのエネルギーを使ってアップグレードすることができる。
items.trinkets.trinketcatalyst.name=魔法の触媒
items.trinkets.trinketcatalyst.window_text=触媒を加えると、水が輝き始める。近くに、エネルギーを注入して魔法の装身具に変身させることができるアイテムがいくつかある。
items.trinkets.trinketcatalyst.window_title=装身具を作る
items.trinkets.vialofblood.desc=この薄い小瓶には、ダンジョンの住人の血液が入っていて、小瓶を回すとゆっくりと動く。魔法で治癒効果を高めているようだが、同時に遅らせることもできる。
items.trinkets.vialofblood.name=血液瓶
items.trinkets.vialofblood.stats_desc=現在のレベルでは、この装身具はヒーリングのポーション、ウォータースキン、あるいは健康の井戸を飲んで得られる全体的なヘルスを_%1$s%%_増加させる。ただし、これらのヒーリング効果はよりゆっくりと発生し、1ターンに最大で_%2$s_のHPを回復する（これはヒーローレベルに応じて変化する）。
items.trinkets.vialofblood.typical_stats_desc=通常、この装身具はヒーリングのポーションやウォータースキン、あるいは健康の井戸を飲んで得られる全体的なヘルスを_%1$s%%_増加させる。ただし、これらのヒーリング効果はよりゆっくりと発生し、1ターンに最大_%2$s_のHPを回復する（これはヒーローレベルに応じて変化する）。
items.trinkets.wondrousresin.desc=この青く輝く樹脂は、呪われた杖の魔法のエッセンスを抽出したもののようだ。錬金術の壺から出た魔力がそれをいくらか安定させたようで、今あなたの杖に影響を及ぼしている。
items.trinkets.wondrousresin.name=不思議な樹脂
items.trinkets.wondrousresin.stats_desc=現在のレベルでは、この装身具は呪われた杖の効果を強制的に中立か正にし、呪われていない杖に中立か正の呪いのザップを発射させる_%1$s%%_。\n\nこの装身具はアップグレードに多くのエネルギーを消費する。
items.trinkets.wondrousresin.typical_stats_desc=通常、この装身具は呪われた杖の効果を強制的に中立か正にし、呪われていない杖に中立か正の呪いのザップを追加で発射させる_%1$s%%_。\n\nこの装身具はアップグレードに多くのエネルギーを消費する。
items.wands.cursedwand.disguise=あなたの外見は目の前で変わる！
items.wands.cursedwand.fire=焦げ臭い...
items.wands.cursedwand.grass=周囲に草が噴出している！
items.wands.cursedwand.gravity=重力は突然、ランダムな方向に引っ張り始める！
items.wands.cursedwand.gravity_end=重力のカオスは終わる。
items.wands.cursedwand.gravity_positive=重力は突然ランダムな方向に引っ張られ始めるが、あなたには影響がないようだ。
items.wands.cursedwand.mass_invuln=あなたの杖から輝かしい光が噴き出す！
items.wands.cursedwand.nothing=何も起こらない。
items.wands.cursedwand.ondeath=あなたは自分の%sに殺されたのだ。
items.wands.cursedwand.petrify=突然、その場で固まる！
items.wands.cursedwand.sinkhole=地面があなたの周りに道を譲り始める！
items.wands.cursedwand.sinkhole_positive=地面が揺れ始めたが、足下は十分に固い。
items.wands.cursedwand.supernova=燃え盛るエネルギーの球が成長し始める。走り出したくなるかもしれない！
items.wands.cursedwand.supernova_positive=燃え盛るエネルギーの球が成長し始めるが、どこか安全な感じがする。
items.wands.cursedwand.transmogrify_other=アイテムが別のものに変身する！
items.wands.cursedwand.transmogrify_wand=杖が別のアイテムに変身する！
items.wands.damagewand.upgrade_stat_name_1=マジックダメージ
items.wands.wand$placeholder.name=ワンド
items.wands.wand.ac_zap=ザップ
items.wands.wand.curse_discover=この%sは呪われている！
items.wands.wand.cursed=この杖には呪いがかけられており、魔法が無秩序でランダムになる。
items.wands.wand.fizzles=杖が消えるのは、充電が十分でないに違いない。
items.wands.wand.identify=あなたは今、杖を識別できるほど杖に精通している。
items.wands.wand.no_magic=魔法が使えない間は杖を使うことができない。
items.wands.wand.not_cursed=この杖には邪悪な魔力はない。
items.wands.wand.prompt=ザッピングする場所を選ぶ
items.wands.wand.resin_many=この杖はアーケイン樹脂から_%dレベル_を得た。
items.wands.wand.resin_one=この杖はアーケイン樹脂から_1レベル_を得ている。
items.wands.wand.self_target=自分をターゲットにすることはできない！
items.wands.wandofblastwave.bmage_desc=Battlemage_が麻痺状態の敵をBlast waveの杖で攻撃すると、麻痺を消費して魔法ダメージを与える。敵ごとのクールダウンが短い。
items.wands.wandofblastwave.desc=この杖は一種のマーブル模様の石でできており、金色の縁取りと先端に丸い黒い宝石が付いている。手に持つととても重みを感じる。
items.wands.wandofblastwave.eleblast_desc=ブラストウェーブの杖によるエレメンタルブラストは67%のダメージを与え、ブラストエリアの外にいる全ての敵をノックアウトする。
items.wands.wandofblastwave.knockback_ondeath=衝突で死んだのか
items.wands.wandofblastwave.name=ブラストウェーブ
items.wands.wandofblastwave.ondeath=君は自分の杖で自殺したんだ...。
items.wands.wandofblastwave.staff_name=爆風スタッフ
items.wands.wandofblastwave.stats_desc=この杖は標的の位置で激しく爆発するボルトを発射する。この爆発の威力は_%1$d-%2$dのダメージを与え、ほとんどの敵を飛ばすのに十分な強さである。
items.wands.wandofblastwave.typical_stats_desc=この杖は標的の位置で激しく爆発するボルトを発射する。この爆発の威力は通常_%1$d-%2$dのダメージを与え、ほとんどの敵を飛ばすのに十分な強さである。
items.wands.wandofblastwave.upgrade_stat_name_2=ノックバック
items.wands.wandofcorrosion.bmage_desc=バトルメイジが腐食の杖で敵を殴ったとき、その敵は確率で滲み出る。
items.wands.wandofcorrosion.desc=このワンドは、灰がかったボディから鮮やかなオレンジ色の宝石へと変化する。
items.wands.wandofcorrosion.eleblast_desc=腐食の杖によるエレメンタル・ブラストは敵に4ターンの腐食を与え、ダメージは6から始まる。
items.wands.wandofcorrosion.name=腐食の杖
items.wands.wandofcorrosion.staff_name=腐食スタッフ
items.wands.wandofcorrosion.stats_desc=この杖はボルトを放ち、狙った場所に腐食性の高いガスの雲を爆発させる。この雲の中にいるものは、時間とともにダメージが増加し、_%dダメージから始まる。
items.wands.wandofcorrosion.upgrade_stat_name_1=腐食損傷
items.wands.wandofcorrosion.upgrade_stat_name_2=ガス量
items.wands.wandofcorruption.already_corrupted=そのキャラクターは、それ以上影響を与えることはできない。
items.wands.wandofcorruption.bmage_desc=バトルメイジが腐敗の杖で敵を殴ったとき、その敵は確率で燻製になる。
items.wands.wandofcorruption.desc=この杖は混沌としたダークエネルギーを放っている。
items.wands.wandofcorruption.eleblast_desc=腐敗の杖によるエレメンタル・ブラストは敵に5ターンのアモックを与える。
items.wands.wandofcorruption.name=汚職の杖
items.wands.wandofcorruption.staff_name=汚職スタッフ
items.wands.wandofcorruption.stats_desc=この杖は、敵をデバフし、最終的には自分の意のままにする腐敗エネルギーの爆風を放つ。敵は腐敗に抵抗できるが、弱った敵は健康な敵よりも腐敗させやすい。
items.wands.wandofcorruption.upgrade_stat_name_1=腐敗する力
items.wands.wandofcorruption.upgrade_stat_name_2=デバフ持続時間
items.wands.wandofdisintegration.bmage_desc=The Battlemage_が振るう場合、崩壊の杖はあたかも投影エンチャントを持っているかのように攻撃範囲が広がる。
items.wands.wandofdisintegration.desc=この杖は黒曜石の滑らかな固まりでできており、その側面には深い紫色の光が走り、先端で終わる。破壊的なエネルギーで光り、前方に放たれるのを待っている。
items.wands.wandofdisintegration.eleblast_desc=崩壊の杖によるエレメンタル・ブラストは100％のダメージを与え、壁を貫通する。
items.wands.wandofdisintegration.name=崩壊の杖
items.wands.wandofdisintegration.staff_name=崩壊のスタッフ
items.wands.wandofdisintegration.stats_desc=どんな障害物でも貫通するビームを放ち、アップグレードすればするほど遠くまで飛ばすことができる。ビームは_%1$d-%2$dダメージを与え、敵や壁を貫通するごとにボーナスダメージも与える。
items.wands.wandofdisintegration.upgrade_stat_name_2=最大レンジ
items.wands.wandoffireblast.bmage_desc=バトルメイジがファイアブラストの杖で敵を攻撃すると、確率で爆発が起こり、敵にダメージを与え、近くにあるすべての炎を消費する！この確率は、敵に隣接する火の数が多いほど高くなる。
items.wands.wandoffireblast.desc=この杖は赤漆塗りの木でできており、金箔がふんだんに使われている。先端はパチパチと音を立て、強力な魔法を放とうとする。
items.wands.wandoffireblast.eleblast_desc=ファイアブラストの杖によるエレメンタルブラストは100％のダメージを与え、ドアを破裂させ、敵や地形に火をつける。
items.wands.wandoffireblast.name=ファイアブラストの杖
items.wands.wandoffireblast.staff_name=ファイアブラストのスタッフ
items.wands.wandoffireblast.stats_desc=この杖は使用時に炎の円錐を吹き出す。次の攻撃は_%1$dチャージ_を消費し、_%2$d-%3$dダメージを与える。
items.wands.wandoffireblast.upgrade_stat_name_1=1チャージダメージ
items.wands.wandoffireblast.upgrade_stat_name_2=2チャージダメージ
items.wands.wandoffireblast.upgrade_stat_name_3=3チャージダメージ
items.wands.wandoffrost.bmage_desc=バトルメイジが冷えた敵を霜の杖で殴ると、その敵は瞬時に凍る。この確率は冷えた敵ほど高くなる。
items.wands.wandoffrost.desc=この杖はある種の魔法の氷でできているようだ。丸みを帯びた先端に向かって輝きを増している。持つととても冷たく感じるが、なぜか手は温かいままだ。
items.wands.wandoffrost.eleblast_desc=霜の杖によるエレメンタル・ブラストは100％のダメージを与え、敵を凍らせ、火を消す。
items.wands.wandoffrost.name=霜の杖
items.wands.wandoffrost.staff_name=霜のスタッフ
items.wands.wandoffrost.stats_desc=この杖は敵に向かって氷のエネルギーを放ち、_%1$d-%2$dダメージを与え、凍らせる。この効果は水の中でより強くなる。すでに冷えているか凍っている敵は、この杖から受けるダメージが少なくなる。
items.wands.wandoffrost.upgrade_stat_name_2=チル持続時間
items.wands.wandoflightning$lightningcharge.desc=バトルメイジは現在エネルギーをチャージしており、稲妻の杖に免疫力を与え、稲妻が弧を描く範囲を広げている。\n\n残りターン%s.
items.wands.wandoflightning$lightningcharge.name=帯電
items.wands.wandoflightning.bmage_desc=バトルメイジが稲妻の杖で敵を攻撃すると、10ターンの間、自身を帯電させる。帯電している間、バトルメイジは雷のダメージを受けず、さらに雷を弧状に放つ。
items.wands.wandoflightning.desc=この杖は頑丈な金属製で、驚くほど重い。2本の突起が先端でカーブし、その間に電気が流れる。
items.wands.wandoflightning.eleblast_desc=雷の杖によるエレメンタル・ブラストは100％のダメージを与え、敵を5ターンの間スタンさせ、水に電撃を与える。
items.wands.wandoflightning.name=稲妻の杖
items.wands.wandoflightning.ondeath=あなたは自分の稲妻の杖で自殺した...。
items.wands.wandoflightning.staff_name=稲妻の杖
items.wands.wandoflightning.stats_desc=このワンドは強力な稲妻を放ち、放たれたものに_%1$d-%2$dのダメージを与える。この杖から放たれる弧は自分にダメージを与えるが、味方にダメージを与えることはない。
items.wands.wandoflivingearth$earthguardian.desc=あなたの生きた大地の杖の岩が、土の守護者になった！この岩の守護者は近くの敵を攻撃し、あなたの代わりに守護者を攻撃させる。近くの脅威がすべてなくなると、ガーディアンは君の周りに再び形成され、次に杖を使うときに戻ってくる。
items.wands.wandoflivingearth$earthguardian.discover_hint=このキャラクターは特定の杖で見つけることができる。
items.wands.wandoflivingearth$earthguardian.name=土方
items.wands.wandoflivingearth$earthguardian.wand_info=ガーディアンの防御力は杖のレベルに連動している。現在は_%1$d-%2$dダメージをブロックする。
items.wands.wandoflivingearth$rockarmor.desc=魔法の岩があなたの体を取り囲んでおり、攻撃を受けると岩がブロックしようとし、受けるダメージを50%%減らす。しかし、ダメージを受けるたびに岩の一部が削られる。\n\n残りのアーマー：%1$d。\n\nあなたの周囲に十分な岩が築かれている場合、次に生ける大地の杖から放たれるザップで、岩がガーディアンに形成され、あなたと一緒に戦ってくれる。\n\nガーディアンに必要な防具%2$d。
items.wands.wandoflivingearth$rockarmor.desc_many=この土の守護者もまた、《多数の力》の恩恵を受けている。残りターン：%d。
items.wands.wandoflivingearth$rockarmor.name=ロックアーマー
items.wands.wandoflivingearth.bmage_desc=バトルメイジが生きた大地の杖で敵を殴った場合、与えたダメージの一部が岩の鎧として戻ってくる。
items.wands.wandoflivingearth.desc=この杖は不思議な岩でできており、黄色いエネルギーの帯が光っている。岩は、あなたが杖を握ると、あなたの手を感じるかのように、わずかに変化するようだ。
items.wands.wandoflivingearth.eleblast_desc=生きた土の杖によるエレメンタル・ブラストは50％のダメージを与え、敵に命中するごとにアクティブな土の守護者を回復する。
items.wands.wandoflivingearth.name=生ける大地の杖
items.wands.wandoflivingearth.staff_name=大地の杖
items.wands.wandoflivingearth.stats_desc=この杖は敵に向かって魔法の岩のボルトを放ち、_%1$d-%2$dのダメージを与える。_その後、岩は使用者の周囲に再形成され、与えたダメージに比例して装甲を付与する。十分なアーマーが構築されていれば、次にワンドがザッピングされるときにロック・ガーディアンに形成される。
items.wands.wandoflivingearth.upgrade_stat_name_2=ガーディアンの最大HP
items.wands.wandoflivingearth.upgrade_stat_name_3=ガーディアン・ブロック
items.wands.wandofmagicmissile$magiccharge.desc=あなたの魔法の杖のミサイルは、あなたの杖にパワーを戻し、次に放つザップの有効レベルを上げた。\n\nあなたの杖はブーストされる：+%d。\n\n魔法チャージ残りターン数%s。
items.wands.wandofmagicmissile$magiccharge.name=マジックチャージ
items.wands.wandofmagicmissile.bmage_desc=バトルメイジがマジック・ミサイルの杖で敵を攻撃した場合、杖に加えて杖もチャージされる。
items.wands.wandofmagicmissile.desc=純粋な魔法のエネルギーでミサイルを発射する。杖自体には特別な効果はないが、使用可能なチャージ数が多く、アップグレードすると他の杖に一時的に力を与えることができる。
items.wands.wandofmagicmissile.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.wands.wandofmagicmissile.eleblast_desc=マジック・ミサイルの杖によるエレメンタル・ブラストは50％のダメージを与え、15ターンのリチャージを与える。
items.wands.wandofmagicmissile.name=マジックミサイル
items.wands.wandofmagicmissile.staff_name=マジックミサイル
items.wands.wandofmagicmissile.stats_desc=このワンドから放たれるボルトはそれぞれ_%1$d-%2$dダメージを与え、アップグレードされると他のワンドに短時間パワーを与える。
items.wands.wandofprismaticlight.bmage_desc=バトルメイジがプリズム・ライトの杖で敵を殴ると、杖のレベルに応じて変化する効果時間の間、その敵は戦闘不能になる。
items.wands.wandofprismaticlight.desc=この杖は、滑らかなガラスの長い塊のような、半透明のクリスタルの固まりでできている。杖の先端には、色とりどりの光の小片が今にも飛び出さんばかりに舞っている。
items.wands.wandofprismaticlight.eleblast_desc=プリズムの杖によるエレメンタル・ブラストは67％のダメージを与え、ブラスト内のすべての地形を明らかにし、敵を5ターンの間盲目にする。
items.wands.wandofprismaticlight.name=プリズム光の杖
items.wands.wandofprismaticlight.staff_name=プリズムの杖
items.wands.wandofprismaticlight.stats_desc=この杖は光線を放ち、ダンジョンの暗闇を切り裂き、隠れた場所や罠を明らかにする。光線は敵の目をくらませ、_%1$d-%2$dダメージを与える。_魔物とアンデッドの敵は杖の明るい光で燃え上がり、ボーナスダメージを受ける。
items.wands.wandofprismaticlight.upgrade_stat_name_2=ブラインド・チャンス
items.wands.wandofprismaticlight.upgrade_stat_name_3=点灯時間
items.wands.wandofregrowth$dewcatcher.desc=デュウキャッチャーは不思議な植物で、自らを魔法の露で満たしている。人目を避けるために草にカモフラージュしようとするが、露が溜まった膨らみでバレてしまう。
items.wands.wandofregrowth$dewcatcher.discover_hint=この植物は特定の杖で見つけることができる。
items.wands.wandofregrowth$dewcatcher.name=デューキャッチャー
items.wands.wandofregrowth$lotus.desc=黄金の蓮は、強力な再生の杖によってのみ呼び出すことができる神秘的な植物である。そのオーラはあらゆる植物と植物の効果を高めるが、エネルギーを使い果たし、短時間で枯れてしまう。
items.wands.wandofregrowth$lotus.discover_hint=この植物は、特定の杖を何度かアップグレードすると見つけることができる。
items.wands.wandofregrowth$lotus.name=ゴールデン・ロータス
items.wands.wandofregrowth$lotus.wand_info=この蓮は_+%1$d_再生の杖によって生み出された。その効果に含まれる植物はすべて、キャラクターに植えられると_即座に発動する。また、植物は_%2$d%%の確率で種を落とし、先端のダーツは_%3$d%%の確率で耐久力が減少する。
items.wands.wandofregrowth$seedpod.desc=シード・ポッドは、自分の種ではなく、他の種類の植物の種を作り出す魔法の植物である。自分の種がないにもかかわらず、どうにか広がっていく。
items.wands.wandofregrowth$seedpod.discover_hint=この植物は特定の杖で見つけることができる。
items.wands.wandofregrowth$seedpod.name=種子ポッド
items.wands.wandofregrowth.bmage_desc=バトルメイジが再生の杖で敵を殴り、そのどちらかが草の上に立っている場合、与えたダメージに比例してハーブの回復を得る。
items.wands.wandofregrowth.degradation=さらに_%dチャージ_すると、この杖は植物や新鮮な草を生産できなくなる。この限界は、杖のレベルアップやアップグレードによって増えます。
items.wands.wandofregrowth.desc=この杖は、熟練の技で彫られた木の細い軸でできている。若木の芯のような鮮やかな緑色をしている。「生命が絶えたとき、常に新しい生命が芽生え始める。永遠のサイクルが常に残っているのだ！"
items.wands.wandofregrowth.eleblast_desc=エレメンタル・ブラストで敵を根こそぎにし、その範囲にランダムに草を生やす。
items.wands.wandofregrowth.name=再生の杖
items.wands.wandofregrowth.staff_name=再生スタッフ
items.wands.wandofregrowth.stats_desc=この杖を使用すると、魔法の再生エネルギーが円錐状に吹き出し、草や根、珍しい植物に生命が吹き込まれる。次のザップは_%1$dチャージ_を消費する。チャージが多ければ多いほど、効果は大きく強くなる。
items.wands.wandofregrowth.upgrade_stat_name_1=チャージごとの芝生
items.wands.wandofregrowth.upgrade_stat_name_2=草の総量制限
items.wands.wandoftransfusion.bmage_desc=バトルメイジが輸血の杖で魅了状態の敵を殴ると、その敵はシールドを獲得し、次に杖で殴る際にヘルスを消費しなくなる。
items.wands.wandoftransfusion.charged=あなたの杖には敵の生命エネルギーがチャージされている！
items.wands.wandoftransfusion.desc=かなり地味な形の杖だが、マゼンタの色合いと先端の真っ黒な宝石のおかげで目立つ。
items.wands.wandoftransfusion.eleblast_desc=輸血の杖によるエレメンタル・ブラストは敵を魅了し、味方を回復し、アンデッドの敵に100％のダメージを与える。
items.wands.wandoftransfusion.name=輸血の杖
items.wands.wandoftransfusion.ondeath=あなたは自分の輸血の杖で自殺した...。
items.wands.wandoftransfusion.staff_name=輸血スタッフ
items.wands.wandoftransfusion.stats_desc=敵に使用すると、使用者に_%3$dのシールドをかけながら、敵を短時間魅了する。敵対するアンデッドは魅了される代わりに_%4$d-%5$dダメージを受ける。
items.wands.wandoftransfusion.upgrade_stat_name_1=アリー・ヒーリング
items.wands.wandoftransfusion.upgrade_stat_name_2=自己遮蔽
items.wands.wandoftransfusion.upgrade_stat_name_3=アンデッドダメージ
items.wands.wandofwarding$ward.desc_1=この基本結界は、視界に入った敵を自動的にザッピングし、_%1$d-%2$dダメージを与える_。\n\n結界の杖でこの結界を叩くとアップグレードする。\n\nこの結界は1回だけザッピングしてから消滅する。\n\n結界の杖はこの結界を維持するために_%3$dエネルギーを使用している。
items.wands.wandofwarding$ward.desc_2=このアップグレードされた結界はより複雑なパターンを持ち、複数回攻撃することができる。この結界から放たれる各ザップは_%1$d-%2$dダメージを与える。\n\n結界の杖でこの結界をザッピングすると、アップグレードされる。\n\nこの結界は消滅する前に3回ザッピングする。\n\n結界の杖はこの結界を維持するために_%3$dエネルギーを使用している。
items.wands.wandofwarding$ward.desc_3=完全にアップグレードされたこの結界は、前作よりも攻撃回数が増える。この結界から放たれる各ザップは_%1$d-%2$dのダメージを与える。\n\n結界の杖でこの結界をザッピングすると、アップグレードされる。\n\nこの結界は消滅する前に5回ザッピングする。\n\nあなたの結界の杖はこの結界を維持するために_%3$dエネルギーを使用している。
items.wands.wandofwarding$ward.desc_4=この小型の歩哨は大結界と同じ火力を持つが、決まったチャージ数の代わりにヘルスを持っている。あなたの結界の杖の先端にある宝石に似ている。このセントリーから放たれるそれぞれのザップは_%1$d-%2$dダメージを与える。\n\n結界の杖でこの歩哨をザッピングすると、アップグレードして回復する。\n\nこの歩哨は敵をザッピングするたびに体力を消費するが、結界の杖を使うことで回復させることができる。\n\nあなたの結界の杖はこのセントリー維持のために_%3$dエネルギー_を使用している。
items.wands.wandofwarding$ward.desc_5=このアップグレードされたセントリー は、それ以下のセントリーよりも大きく、耐久性が高い。このセントリーからの各ザップは_%1$d-%2$dダメージを与える。\n\n結界の杖でこの歩哨をザッピングすると、アップグレードして回復する。\n\nこの歩哨は敵をザッピングするたびに体力を消費するが、結界の杖を使うことで回復させることができる。\n\nあなたの結界の杖はこのセントリー維持のために_%3$dエネルギー_を使用している。
items.wands.wandofwarding$ward.desc_6=完全にアップグレードされたこのセントリー は、前作よりも耐久性が大幅に向上している。このセントリーからのザップは1発ごとに_%1$d-%2$dのダメージを与える。\n\n結界の杖でザッピングすると回復する。\n\nこの歩哨は敵をザッピングするたびに体力を消費するが、結界の杖を使うことで回復できる。\n\nあなたの結界の杖はこのセントリー維持のために_%3$dエネルギー_を使用している。
items.wands.wandofwarding$ward.desc_generic_sentry=このセントリーもウォードと同じ火力を持つが、決まったチャージ数の代わりにヘルスを持っている。結界の杖の先端にある宝石に似ている。\n\n結界の杖でこの歩哨をザッピングすると、アップグレードして回復する。\n\nこのセントリーには敵をザッピングするたびにヘルスが消費されるが、結界の杖を使うことで回復させることができる。
items.wands.wandofwarding$ward.desc_generic_ward=この結界は、視界に入った敵を自動的にザッピングする。\n\n結界の杖でこの結界を叩くとアップグレードする。\n\n結界は消滅するまでのザッピング回数に制限がある。
items.wands.wandofwarding$ward.discover_hint=このキャラクターは特定の杖で見つけることができる。
items.wands.wandofwarding$ward.dismiss_body=杖に結界を維持させたくない場合、この結界を消すことができる。そうすることで、結界は即座に破壊される。\n\nこの結界を解除しますか？
items.wands.wandofwarding$ward.dismiss_cancel=いいえ
items.wands.wandofwarding$ward.dismiss_confirm=はい
items.wands.wandofwarding$ward.dismiss_title=この病棟を解散させるのか？
items.wands.wandofwarding$ward.name_1=小区
items.wands.wandofwarding$ward.name_2=区
items.wands.wandofwarding$ward.name_3=大区
items.wands.wandofwarding$ward.name_4=しょうへい
items.wands.wandofwarding$ward.name_5=番兵
items.wands.wandofwarding$ward.name_6=大番兵
items.wands.wandofwarding.bad_location=そこに病室は置けない。
items.wands.wandofwarding.bmage_desc=バトルメイジが結界の杖で敵を攻撃したとき、すべての有効な結界と歩哨は確率で回復する。
items.wands.wandofwarding.desc=この短い金属製の杖の先端には、鮮やかな紫色の宝石が浮かんでいる。
items.wands.wandofwarding.eleblast_desc=結界の杖によるエレメンタル・ブラストは、ブラストエリア内のすべての結界と歩哨を回復する。
items.wands.wandofwarding.name=結界の杖
items.wands.wandofwarding.no_more_wards=あなたの杖はこれ以上結界を維持できない。
items.wands.wandofwarding.staff_name=結界員
items.wands.wandofwarding.stats_desc=このワンドは敵に直接ダメージを与えるのではなく、静止しているワードやセントリーを召喚する。ワードはどこにでも召喚でき、視力があれば壁を通り抜けて召喚することもできる。このワンドは一度に_%dエネルギー分のワードを維持できる。
items.wands.wandofwarding.upgrade_stat_name_1=病棟ダメージ
items.wands.wandofwarding.upgrade_stat_name_2=ワード・エナジー
items.waterskin.ac_drink=ドリンク
items.waterskin.collected=あなたは露を水筒に集める。
items.waterskin.desc=革と紐で作られ、コルク栓で密閉された液体用の容器。
items.waterskin.desc_full=満タンのウォータースキンはエネルギーを放射しているようだが、おそらく別のサバイバル・アイテムを祝福するために使えるのでは？
items.waterskin.desc_heal=ウォータースキンは現在、癒しの水を貯めるために使われている。ウォータースキンが満タンであればあるほど、それを飲むと瞬時に回復する。必要な分だけ飲む。
items.waterskin.desc_water=今のところ、ウォータースキンの中身はただの飲料水だ。きっとダンジョンには、ウォータースキンの代わりに何か保存できるものがあるはずだ。
items.waterskin.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.waterskin.empty=水筒は空だ！
items.waterskin.full=水筒は満タンだ！
items.waterskin.name=ウオータースキン
items.weapon.curses.annoying.desc=迷惑兵器はスピーチができるが、ちょっと元気が良すぎる。意味もなく注意を引くことも多い。
items.weapon.curses.annoying.elestrike_desc=迷惑な呪いを持つエレメンタル・ストライクは、20％の確率で範囲内の各敵を6ターンの間混乱させる。
items.weapon.curses.annoying.msg_1=おお、何かと戦っているのか？
items.weapon.curses.annoying.msg_10=よく頑張った！
items.weapon.curses.annoying.msg_11=武器ではなく、木こりの斧になりたかった。
items.weapon.curses.annoying.msg_12=自信過剰は、じわじわと陰湿な殺人者であることを忘れてはならない。
items.weapon.curses.annoying.msg_13=君たちのベースはすべて我々のものだ！
items.weapon.curses.annoying.msg_2=そうだ！
items.weapon.curses.annoying.msg_3=聞いてくれ！
items.weapon.curses.annoying.msg_4=ボスはまだか？
items.weapon.curses.annoying.msg_5=痛い、そんなに強く振らないで！
items.weapon.curses.annoying.msg_6=死ね、昆虫！
items.weapon.curses.annoying.msg_7=うひゃひゃひゃ！
items.weapon.curses.annoying.msg_8=ちょっと休まないか？
items.weapon.curses.annoying.msg_9=ポウ、ハハ！
items.weapon.curses.annoying.name=迷惑な%s
items.weapon.curses.dazzling.desc=ダズリングウェポンは時にまばゆい光を放ち、見るものすべてをくらませる。
items.weapon.curses.dazzling.elestrike_desc=眩惑の呪いによるエレメンタル・ストライクは、50％の確率で範囲内の敵を6ターンの間盲目にする。
items.weapon.curses.dazzling.name=眩しい%s
items.weapon.curses.displacing.desc=ディスプレーシング・ウェポンにはカオティック・テレポートの魔法が仕込まれており、敵をランダムにフロアのあちこちにワープさせる能力を持つ。
items.weapon.curses.displacing.elestrike_desc=変位呪いのエレメンタル・ストライクは50％の確率で範囲内の各敵をテレポートさせる。
items.weapon.curses.displacing.name=%sを置き換える
items.weapon.curses.explosive.desc=爆発性の武器は着実にパワーを蓄積し、爆発して近くにあるものにダメージを与える。
items.weapon.curses.explosive.desc_cool=あなたの武器は現在、触ると冷たい。
items.weapon.curses.explosive.desc_hot=武器が熱い！爆発するぞ
items.weapon.curses.explosive.desc_warm=あなたの武器はエネルギーを蓄積し、暖かくなっている...。
items.weapon.curses.explosive.elestrike_desc=爆発呪いのエレメンタルストライクは50％の確率で範囲内のランダムな敵に爆発を発生させる。
items.weapon.curses.explosive.hot=ホットだ！
items.weapon.curses.explosive.name=爆発的 %s
items.weapon.curses.explosive.warm=暖かい...
items.weapon.curses.friendly.desc=友好的な武器は平和主義者に最適で、時折、戦闘を不可能にする魔法を発動する。
items.weapon.curses.friendly.elestrike_desc=味方の呪いによるエレメンタル・ストライクは、50％の確率で範囲内の各敵を6ターンの間魅了する。
items.weapon.curses.friendly.name=フレンドリー%s
items.weapon.curses.polarized.desc=偏光した武器は魔法の影響を受け、その攻撃はダメージが50％増加するか、まったくダメージを与えなくなる。
items.weapon.curses.polarized.elestrike_desc=極まった呪いによるエレメンタル・ストライクは、50％の確率で範囲内の各敵に24～36ダメージを与える。
items.weapon.curses.polarized.name=偏光%s
items.weapon.curses.sacrificial.desc=生贄の武器は、敵を攻撃する見返りとして、着用者から血を要求する。着用者が健康であればあるほど、呪いはより多くの血を奪う。
items.weapon.curses.sacrificial.elestrike_desc=犠牲の呪いを伴うエレメンタル・ストライクは、ヒーローと範囲内の各敵のHPを12回出血させる。
items.weapon.curses.sacrificial.name=犠牲的%s
items.weapon.curses.wayward$waywardbuff.desc=あなたのウェイウェイ武器の魔法が発動し、短時間の間、極めて不正確になる。奇襲攻撃など、命中が保証されている攻撃には影響しないので注意。ウェイワード・ウェポンで攻撃を成功させれば、この効果は即座に解除される。\n\n残りターン%s.
items.weapon.curses.wayward$waywardbuff.name=ウェイワード
items.weapon.curses.wayward.desc=ウェイワード・ウェポンの精度が極端に落ちることがある。この魔法は発動すると少しの間持続するが、ウェイワード武器で一撃を加えれば解除される。
items.weapon.curses.wayward.elestrike_desc=エレメンタルストライクによる往路の呪いは、50％の確率で範囲内の各敵に6ターンの間呪いをかける。
items.weapon.curses.wayward.name=ウェイワード%s
items.weapon.enchantments.blazing.desc=このエンチャントは武器から炎を吐き出し、敵を発火させ、すでに燃えている敵にボーナスダメージを与える。
items.weapon.enchantments.blazing.elestrike_desc=エレメンタル・ストライクに炎のエンチャントをかけると、範囲内のすべてのタイルに炎が広がり、その効果は8ターン持続する。
items.weapon.enchantments.blazing.name=燃え盛る%s
items.weapon.enchantments.blocking$blockbuff.desc=武器のブロッキング・エンチャントにより、防御力が一時的にアップした！\n\nシールド残量%d\n\n残りターン%s
items.weapon.enchantments.blocking$blockbuff.name=ブロッキング
items.weapon.enchantments.blocking.desc=ブロッキング・ウェポンは、攻撃した後に一時的にシールドになるチャンスがある。
items.weapon.enchantments.blocking.elestrike_desc=ブロッキング・エンチャント付きのエレメンタル・ストライクは、範囲内の敵1体につき、デュエリストにシールド6を追加で与える。
items.weapon.enchantments.blocking.name=ブロック %s
items.weapon.enchantments.blooming.desc=ブルーミング・ウェポンには魔法が込められており、その魔法で殴られた者やその周囲に植物が芽吹く。
items.weapon.enchantments.blooming.elestrike_desc=開花エンチャント付きのエレメンタルストライクは範囲内の最大8タイルに草を広げ、範囲内の全ての敵を6ターンの間根こそぎにする。
items.weapon.enchantments.blooming.name=開花 %s
items.weapon.enchantments.chilling.desc=このエンチャントで攻撃された敵は冷え、動きと攻撃が遅くなる。
items.weapon.enchantments.chilling.elestrike_desc=冷気のエンチャントを持つエレメンタル・ストライクは、範囲内のすべてのタイルに冷気をまき散らし、8ターン持続する。
items.weapon.enchantments.chilling.name=チリング%s
items.weapon.enchantments.corrupting.desc=この強力なエンチャントは、敵を意のままにする能力を持つ。この武器で敵を倒すと、死ぬ代わりに堕落する可能性がある。
items.weapon.enchantments.corrupting.elestrike_desc=Corruptingエンチャントを持つエレメンタル・ストライクは、5～25%の確率で（欠損HPに基づき）範囲内の敵を堕落させる。
items.weapon.enchantments.corrupting.name=堕落した%s
items.weapon.enchantments.elastic.desc=伸縮性のある武器は、敵を短距離後ろに飛ばすチャンスがある。
items.weapon.enchantments.elastic.elestrike_desc=弾性エンチャント付きのエレメンタル・ストライクは範囲内の全ての敵を5タイル後退させる。
items.weapon.enchantments.elastic.name=エラスティック%s
items.weapon.enchantments.grim.desc=敵を即座に処刑する力を持つ強力なエンチャント。敵が弱いほど効果が発生しやすい。
items.weapon.enchantments.grim.elestrike_desc=グリムエンチャント付きのエレメンタルストライクは、6～30％の確率（欠損HPに基づく）で、主目標を除く範囲内の各敵を殺す。
items.weapon.enchantments.grim.name=グリム%s
items.weapon.enchantments.kinetic$conserveddamage.desc=あなたの武器は、以前の必殺の一撃から余分な力を蓄え、次の攻撃にボーナスダメージとして適用する。ただし、エネルギーは時間の経過とともに徐々に薄れていく。\n\n保存ダメージ：%d.
items.weapon.enchantments.kinetic$conserveddamage.name=保存された損傷
items.weapon.enchantments.kinetic.desc=キネティック・ウェポンで敵を倒した場合、余った力はウェポンに蓄積され、次の攻撃に生かされる。
items.weapon.enchantments.kinetic.elestrike_desc=キネティック・エンチャント付きのエレメンタル・ストライクは、範囲内にいる主対象以外の各敵に蓄積ダメージの40％を適用する。
items.weapon.enchantments.kinetic.name=キネティック%s
items.weapon.enchantments.lucky.desc=幸運な武器で倒された敵は、追加の戦利品を落とすチャンスがある。
items.weapon.enchantments.lucky.elestrike_desc=幸運のエンチャントを持つエレメンタルストライクは12.5%の確率で範囲内の各敵の下に戦利品を産み出す。この効果は敵1体につき1回のみ発動する。
items.weapon.enchantments.lucky.name=ラッキー%s
items.weapon.enchantments.projecting.desc=このエンチャントにより、近接武器はリーチが増加する。射撃武器は近くの目標に向けると壁を貫通する。
items.weapon.enchantments.projecting.elestrike_desc=射出エンチャント付きのエレメンタル・ストライクは、範囲内にいる主対象以外の各敵に30％のダメージを与える。
items.weapon.enchantments.projecting.name=プロジェクション%s
items.weapon.enchantments.shocking.desc=衝撃を与える武器から電気が弧を描き、近くにいるすべての敵に追加ダメージを与える。
items.weapon.enchantments.shocking.elestrike_desc=エレメンタルストライクは範囲内のすべてのタイルに電気をまき散らし、8ターン持続する。
items.weapon.enchantments.shocking.name=ショッキング%s
items.weapon.enchantments.unstable.desc=このエンチャントは混沌としたエネルギーを放ち、ヒットするたびに異なるエンチャントとして作用する。
items.weapon.enchantments.unstable.elestrike_desc=不安定なエンチャントによるエレメンタル・ストライクは、範囲内にいる主対象以外の各敵にランダムなエンチャント効果を適用する。
items.weapon.enchantments.unstable.name=不安定な%s
items.weapon.enchantments.vampiric.desc=この強力なエンチャントは一撃ごとに敵から生命力を吸い上げ、それを装着者に戻す。この効果は体力が低いほど強くなる。
items.weapon.enchantments.vampiric.elestrike_desc=吸血鬼エンチャント付きのエレメンタル・ストライクは範囲内の敵1体につき、デュエリストのHPを2.5回復する。
items.weapon.enchantments.vampiric.name=吸血鬼%s
items.weapon.melee.assassinsblade.ability_desc=デュエリストは暗殺者の剣を振り回しながら_sneak_することができる。この能力は3タイル先まで瞬きさせ、_%dターンの透明化を与える。
items.weapon.melee.assassinsblade.ability_name=ひれつかん
items.weapon.melee.assassinsblade.desc=黒曜石でできた小さな波状の刃は、軽量だが使いこなすのは難しい。
items.weapon.melee.assassinsblade.name=アサシンブレード
items.weapon.melee.assassinsblade.stats_desc=この武器は無意識の敵に強い。
items.weapon.melee.assassinsblade.typical_ability_desc=デュエリストは暗殺者の剣を振り回しながら_sneak_することができる。この能力により、デュエリストは最大3タイル先まで瞬きすることができ、通常_%dターンの透明状態を得ることができる。
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=能力持続時間
items.weapon.melee.battleaxe.ability_desc=デュエリストは戦斧で_重い一撃_を与えることができる。この集中攻撃は敵を驚かせた場合、_%1$d-%2$dのダメージを与え、5ターンの間、敵の命中率と回避率を50%%低下させる。重い一撃は常に命中するが、敵を驚かせなければ通常のダメージを与える。
items.weapon.melee.battleaxe.ability_name=猛打
items.weapon.melee.battleaxe.desc=この斧の巨大な鋼鉄の頭部は、一撃一撃にかなりの重みがある。
items.weapon.melee.battleaxe.name=バトルアックス
items.weapon.melee.battleaxe.stats_desc=これはかなり正確な武器だ。
items.weapon.melee.battleaxe.typical_ability_desc=デュエリストはバトルアックスで_重い一撃_を与えることができる。この集中攻撃は敵を驚かせた場合、通常_%1$d-%2$dのダメージを与え、5ターンの間敵を朦朧とさせ、命中率と回避率を50%%低下させる。重い一撃は常に命中するが、敵を驚かせなければ通常のダメージを与える。
items.weapon.melee.crossbow$chargedshot.desc=デュエリストはクロスボウにパワーを集中している。次にクロスボウで行う攻撃は必ず命中し、3つの効果のいずれかが適用される：\n- 近接攻撃は敵を数タイル先に倒す。\n- 先端のないダーツはボーナスダメージを与える。\n- 先端が尖っているダーツは使用回数が増え、7×7の範囲に効果が適用される。プラスの効果は味方にのみ適用され、マイナスの効果は敵にのみ適用される。デュエリストはこのアビリティを使用して自分にプラスのダーツ効果を与えることはできない。
items.weapon.melee.crossbow$chargedshot.name=有料
items.weapon.melee.crossbow.ability_desc=デュエリストはクロスボウをチャージすることができ、次のクロスボウによる通常攻撃が必ず命中し、3つの効果のうち1つを適用する。近接攻撃は敵をノック・アウェイし、先端のないダーツは_+%1$dダメージを与え、先端のあるダーツは7×7の範囲に効果が適用され、さらに_%2$dの間効果が持続する。
items.weapon.melee.crossbow.ability_name=チャージショット
items.weapon.melee.crossbow.desc=かなり手の込んだ武器で、並外れたスピードでボルトを射出する。このクロスボウはその重さと頑丈な構造により、近接武器としても使用できる。
items.weapon.melee.crossbow.name=クロスボー
items.weapon.melee.crossbow.stats_desc=この武器は装備時に投げられたダーツが_%1$d-%2$dダメージを与えるように強化され、さらにそのダーツにエンチャントを付与する。
items.weapon.melee.crossbow.typical_ability_desc=デュエリストはクロスボウをチャージすることができ、クロスボウを使った次の通常攻撃が必ず命中し、3つの効果のうち1つを適用させることができる。近接攻撃は敵をノックアウトし、先端が尖っていないダーツは通常+%1$dダメージを与え、先端が尖ったダーツは7×7の範囲に効果を適用し、通常+%2$dの間効果が持続する。
items.weapon.melee.crossbow.typical_stats_desc=通常、この武器は装備時に投げられたダーツが強化され、_%1$d-%2$dダメージを与える。
items.weapon.melee.crossbow.upgrade_ability_stat_name=能力ブースト
items.weapon.melee.cudgel.ability_desc=デュエリストは棍棒で_重い一撃_を与えることができる。この集中攻撃は敵を驚かせた場合、_%1$d-%2$dのダメージを与え、5ターンの間敵を朦朧とさせ、命中率と回避率を50%%減少させる。重い一撃は常に命中するが、敵を驚かせなければ通常のダメージを与える。
items.weapon.melee.cudgel.ability_name=猛打
items.weapon.melee.cudgel.desc=冒険用の武器というよりは、貴族の護身用として作られた小型の真鍮製メイス。
items.weapon.melee.cudgel.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.melee.cudgel.name=こん棒
items.weapon.melee.cudgel.stats_desc=これはかなり正確な武器だ。
items.weapon.melee.cudgel.typical_ability_desc=デュエリストは棍棒で_重い一撃_を与えることができる。この集中攻撃は敵を驚かせた場合、通常_%1$d-%2$dのダメージを与え、5ターンの間敵を朦朧とさせ、命中率と回避率を50%%低下させる。重い一撃は常に命中するが、敵を驚かせなければ通常のダメージを与える。
items.weapon.melee.dagger.ability_desc=デュエリストはダガーを振り回しながら_sneak_することができる。この能力は5タイル先まで瞬きさせ、_%dターンの透明状態を与える。
items.weapon.melee.dagger.ability_name=ひれつかん
items.weapon.melee.dagger.desc=使い古された木の柄がついたシンプルな鉄の短剣。
items.weapon.melee.dagger.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.melee.dagger.name=短剣
items.weapon.melee.dagger.stats_desc=この武器は無意識の敵に強い。
items.weapon.melee.dagger.typical_ability_desc=デュエリストはダガーを振り回しながら_sneak_することができる。この能力により、デュエリストは瞬時に5タイル先まで瞬きすることができ、通常_%dターンの透明状態を得ることができる。
items.weapon.melee.dagger.upgrade_ability_stat_name=能力持続時間
items.weapon.melee.dirk.ability_desc=デュエリストはダークを振り回しながら_sneak_することができる。この能力によってデュエリストは最大4タイル先まで瞬きすることができ、_%dターンの透明状態を得ることができる。
items.weapon.melee.dirk.ability_name=ひれつかん
items.weapon.melee.dirk.desc=突き出しの長いダガーで、敵に突き刺す鋼の量が少し増える。
items.weapon.melee.dirk.name=ダーク
items.weapon.melee.dirk.stats_desc=この武器は無意識の敵に強い。
items.weapon.melee.dirk.typical_ability_desc=デュエリストはダークを振り回しながら_sneak_することができる。この能力により、デュエリストは最大4タイル先まで瞬きをすることができ、通常_%dターンの透明状態を得ることができる。
items.weapon.melee.dirk.upgrade_ability_stat_name=能力持続時間
items.weapon.melee.flail$spinabilitytracker.desc=デュエリストはフレイルを回転させ、次の通常攻撃に向けてダメージを蓄積する。1回回すごとに1ターンかかるが、ダメージは増加し、最大3回まで回すことができる。回転中のフレイルは命中も保証される。\n\n現在のスピンzxqph0zxqzxqph1zxq.\n残りターン数%2$s。
items.weapon.melee.flail$spinabilitytracker.name=紡績
items.weapon.melee.flail.ability_desc=デュエリストはフレイルをスピンさせて短時間パワーを溜めることができる。フレイルが回転するたびに、次の通常攻撃に_+%dダメージを与える。回転するフレイルは命中も保証される。チャージを消費するのは、フレイルを回転させ始めるときだけである。
items.weapon.melee.flail.ability_name=スピン
items.weapon.melee.flail.desc=鎖でつながれたトゲ付きボール。非常に扱いにくいが、当たれば破壊的。
items.weapon.melee.flail.name=フレイル
items.weapon.melee.flail.spin_warn=もうフレイルは回せない。
items.weapon.melee.flail.stats_desc=これはかなり不正確な武器である。\n奇襲攻撃はできない。
items.weapon.melee.flail.typical_ability_desc=デュエリストはフレイルをスピンさせて短時間パワーを溜めることができる。フレイルが回転するたびに、通常次の通常攻撃に_+%dダメージを与える。回転するフレイルは命中も保証される。フレイルの回転を開始するときのみチャージが必要となる。
items.weapon.melee.gauntlet.ability_desc=デュエリストはストーンガントレットで_コンボ攻撃_を行うことができる。この攻撃は命中が保証され、デュエリストが通常の近接攻撃か投擲武器による攻撃を命中させるたびに_+%dダメージを与える。5ターンの間ヒットしなかった場合、このコンボはリセットされる。
items.weapon.melee.gauntlet.ability_name=コンボストライク
items.weapon.melee.gauntlet.desc=この巨大なガントレットは、真紅の布地に重い魔法石を重ねたものだ。生地が体を締め付け、分厚い石板がまるで第二の皮膚のようになる。このような重い武器を振り回すには力が必要だが、打撃には大きな力が加わる。
items.weapon.melee.gauntlet.name=ストーンガントレット
items.weapon.melee.gauntlet.stats_desc=これは非常に速い武器だ。
items.weapon.melee.gauntlet.typical_ability_desc=デュエリストはストーンガントレットで_コンボ攻撃_を行うことができる。この攻撃は命中が保証されており、通常デュエリストが通常の近接攻撃か投擲武器による攻撃を命中させるたびに_+%dダメージを与える。5ターンの間ヒットしなかった場合、このコンボはリセットされる。
items.weapon.melee.glaive.ability_desc=デュエリストはグレイヴの先端を使って、範囲内にいるが隣接していない敵をスパイクすることができる。これは_%1$d-%2$dダメージを与え、敵をノックバックさせる。
items.weapon.melee.glaive.ability_name=スパイク
items.weapon.melee.glaive.desc=棒の先に剣の刃をつけた巨大な棒状の武器。
items.weapon.melee.glaive.name=グレイヴ
items.weapon.melee.glaive.stats_desc=この武器はかなり遅い。\nこの武器にはリーチがある。
items.weapon.melee.glaive.typical_ability_desc=デュエリストはグレイヴの先端を使って、範囲内にいるが隣接していない敵をスパイクすることができる。これは通常_%1$d-%2$dダメージを与え、敵をノックバックさせる。
items.weapon.melee.gloves.ability_desc=デュエリストはスタッズグローブで_コンボストライク_を行うことができる。この攻撃は命中が保証され、デュエリストが通常の近接攻撃か投擲武器による攻撃を命中させるたびに_+%dダメージを与える。5ターンの間ヒットしなかった場合、このコンボはリセットされる。
items.weapon.melee.gloves.ability_name=コンボストライク
items.weapon.melee.gloves.desc=このスタッズ付きグローブは、本当のプロテクションは提供しないが、両手を自由に保ちながら、役に立つ武器として機能する。
items.weapon.melee.gloves.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.melee.gloves.name=スタッドグローブ
items.weapon.melee.gloves.stats_desc=これは非常に速い武器だ。
items.weapon.melee.gloves.typical_ability_desc=デュエリストはスタッドグローブで_コンボ攻撃_を行うことができる。この攻撃は命中が保証されており、通常デュエリストが通常の近接攻撃か投擲武器による攻撃を命中させるたびに_+%dダメージを与える。5ターンの間ヒットしなかった場合、このコンボはリセットされる。
items.weapon.melee.greataxe.ability_desc=デュエリストは体力が50%%以下の場合、大斧による_報復_攻撃を行うことができる。この壊滅的な攻撃は_%1$d-%2$dのダメージを与え、命中が保証され、敵を倒せば即死する。
items.weapon.melee.greataxe.ability_name=応報
items.weapon.melee.greataxe.desc=肩にかけて振るうことを想定したこの巨人のような斧は、重いだけでなく力強い。
items.weapon.melee.greataxe.name=大斧
items.weapon.melee.greataxe.stats_desc=この武器はとてつもなく重い。
items.weapon.melee.greataxe.typical_ability_desc=デュエリストは体力が50%%以下の場合、大斧による_報復_攻撃を行うことができる。この壊滅的な攻撃は通常_%1$d-%2$dのダメージを与え、命中が保証され、敵を倒せば即座に終了する。
items.weapon.melee.greatshield.ability_desc=デュエリストはグレートシールドで自身をガードすることができ、_%dターンの間、自身に対して行われるすべての物理攻撃や魔法攻撃を完全に無効化することができる。デュエリストが攻撃をブロックした後、反撃したり魔法を使ったりするとガードが終了する。
items.weapon.melee.greatshield.ability_name=ガード
items.weapon.melee.greatshield.desc=シールドというより移動可能な壁のようなこの巨大な金属の塊は、防御を助けるが、攻撃する余地をあまり残さない。
items.weapon.melee.greatshield.name=グレートシールド
items.weapon.melee.greatshield.stats_desc=この武器は0-%dダメージをブロックする。このブロックはアップグレードによって変化する。
items.weapon.melee.greatshield.typical_ability_desc=デュエリストはグレートシールドで自身をガードすることができ、通常_%dターンの間、自身に対して行われるすべての物理攻撃や魔法攻撃を完全に無効化する。デュエリストが攻撃をブロックした後、反撃したり魔法を使ったりするとガードが終了する。
items.weapon.melee.greatshield.typical_stats_desc=通常この武器は0～%dのダメージをブロックする。このブロックはアップグレードによって変化する。
items.weapon.melee.greatshield.upgrade_ability_stat_name=能力持続時間
items.weapon.melee.greatsword.ability_desc=デュエリストは大剣で敵を薙ぎ払うことができる。これは_%1$d-%2$dダメージを与え、命中が保証される。薙ぎ払いで敵を倒した場合は即座に終了し、デュエリストは5ターン以内に無料でもう一度薙ぎ払いを使うことができる。
items.weapon.melee.greatsword.ability_name=裂く
items.weapon.melee.greatsword.desc=このそびえ立つ刃は、その重さを一振り一振りに注ぎ込むことで大ダメージを与える。
items.weapon.melee.greatsword.name=大剣
items.weapon.melee.greatsword.typical_ability_desc=デュエリストは大剣で敵を薙ぎ払うことができる。これは通常_%1$d-%2$dダメージを与え、命中は保証されている。薙ぎ払いで敵を倒した場合は即座に終了し、デュエリストは5ターン以内に無料でもう一度薙ぎ払いを使うことができる。
items.weapon.melee.handaxe.ability_desc=デュエリストは手斧で_重い一撃_を繰り出すことができる。この集中攻撃は敵を驚かせた場合、_%1$d-%2$dのダメージを与え、5ターンの間敵を朦朧とさせ、命中率と回避率を50%%減少させる。重い一撃は常に命中するが、敵を驚かせなければ通常のダメージを与える。
items.weapon.melee.handaxe.ability_name=猛打
items.weapon.melee.handaxe.desc=木の伐採によく使われる軽い斧。幅の広い刃は敵に対しても有効。
items.weapon.melee.handaxe.name=ハンドアックス
items.weapon.melee.handaxe.stats_desc=これはかなり正確な武器だ。
