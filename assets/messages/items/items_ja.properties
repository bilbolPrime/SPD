items.weapon.melee.whip.typical_ability_desc=デュエリストは周囲の敵を鞭で一閃することができる。このアビリティは通常_%1$d-%2$dダメージを与え、攻撃範囲内の全ての敵を攻撃し、命中は保証されている。
items.weapon.melee.wornshortsword.ability_desc=デュエリストは装着したショートソードで敵を薙ぎ払うことができる。これは_%1$d-%2$dダメージを与え、命中が保証される。薙ぎ払いが敵を倒した場合は即座に終了し、デュエリストは5ターン以内に無料でもう一度薙ぎ払いを使うことができる。
items.weapon.melee.wornshortsword.ability_name=裂く
items.weapon.melee.wornshortsword.desc=かなり短い剣で、酷使されて磨り減っている。状態の良いショートソードよりも弱く、少し軽い。
items.weapon.melee.wornshortsword.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.melee.wornshortsword.name=着古したショートソード
items.weapon.melee.wornshortsword.typical_ability_desc=デュエリストは装着したショートソードで敵を薙ぎ払うことができる。これは通常_%1$d-%2$dダメージを与え、命中は保証されている。薙ぎ払いで敵を倒した場合は即座に終了し、デュエリストは5ターン以内に無料でもう一度薙ぎ払いを使うことができる。
items.weapon.missiles.bolas.desc=この珍しい射撃武器は、ダメージはそれほど大きくないが、標的の動きを鈍らせるのに優れている。
items.weapon.missiles.bolas.name=ボーラス
items.weapon.missiles.bolas.stats_desc=この武器はターゲットに不具を与える。
items.weapon.missiles.boomerang.desc=敵に投げつけられたこの平たく曲がった木のミサイルは、投げた人の手に戻る。
items.weapon.missiles.boomerang.durability=このブーメランは頑丈に作られているため、使っても壊れることはありません。
items.weapon.missiles.boomerang.name=ブーメラン
items.weapon.missiles.darts.adrenalinedart.desc=このダーツの先端にはスイフトアザミをベースにした化合物が練りこまれており、味方の移動速度と攻撃速度を上げたり、敵の移動速度を一時的に下げたりする。ダーツ自体は敵にダメージを与えるが、味方にダメージを与えることはない。
items.weapon.missiles.darts.adrenalinedart.name=アドレナリンダート
items.weapon.missiles.darts.blindingdart.desc=このダーツの先端にはブラインド・ウィード（目くらまし草）をベースにした化合物が練りこまれており、標的の目を短時間くらませる。しかし、方向感覚を失わせることはないので、敵は最後にあなたを見た場所を知ることができる。
items.weapon.missiles.darts.blindingdart.name=バインドダーツ
items.weapon.missiles.darts.chillingdart.desc=このダーツの先端には氷帽ベースのコンパウンドが塗られており、標的を大きく冷やす。
items.weapon.missiles.darts.chillingdart.name=チリングダーツ
items.weapon.missiles.darts.cleansingdart.desc=このダーツの先端にはマゼロイヤルを主成分とする化合物が練りこまれており、味方に一時的にあらゆるマイナス効果を与えなくしたり、敵のプラス効果を浄化したりする。敵は自分が攻撃していることや、自分から逃げていることを一時的に忘れることさえある。ダーツ自体は依然として敵に有害だが、味方に害を与えることはない。
items.weapon.missiles.darts.cleansingdart.name=クレンジングダート
items.weapon.missiles.darts.dart.ac_tip=ヒント
items.weapon.missiles.darts.dart.desc=先端にスパイクのついたシンプルな木の軸は、手首をひねるだけで真直ぐ飛び、獲物に刺さるように重くなっている。先端に種を付けることで、投げたときにボーナス効果を得ることができる。
items.weapon.missiles.darts.dart.name=剣
items.weapon.missiles.darts.dart.prompt=種を選ぶ
items.weapon.missiles.darts.dart.tip_all=先端%1$dダーツと%2$dシード
items.weapon.missiles.darts.dart.tip_cancel=キャンセル
items.weapon.missiles.darts.dart.tip_desc=シードは、1本または2本のダーツと組み合わせてチップにすることができる。シードの種類によって、それぞれ独自の先端ダーツが生まれ、ユニークなシングルユース効果を発揮する。\n\nこれらのシードでダーツを傾けると、_%s._が生まれる。
items.weapon.missiles.darts.dart.tip_one=先端ダーツ1個、シード1個
items.weapon.missiles.darts.dart.tip_title=チップダーツ
items.weapon.missiles.darts.dart.tip_two=チップ 2 ダーツ 1 シード
items.weapon.missiles.darts.dart.unlimited_uses=シンプルな構造のため、ダーツは効果的に長持ちする。
items.weapon.missiles.darts.displacingdart.desc=このダーツの先端にはフェードリーフが塗られており、標的を短距離テレポートさせる。
items.weapon.missiles.darts.displacingdart.name=ディスプレーシングダーツ
items.weapon.missiles.darts.healingdart.desc=このダーツの先端にはサングラスをベースにした化合物が練りこまれており、この化合物によってターゲットに回復効果を与える。ダーツ自体は敵にダメージを与えるが、味方にダメージを与えることはない。
items.weapon.missiles.darts.healingdart.name=ヒーリングダーツ
items.weapon.missiles.darts.holydart.desc=このダーツの先端にはスターフラワーをベースにした化合物が練りこまれており、ターゲットに聖なるエネルギーを注入する。味方や通常の敵は祝福を受けるが、アンデッドや悪魔の敵は大ダメージを受ける。ダーツ自体は依然として敵に害を与えるが、味方に害を与えることはない。
items.weapon.missiles.darts.holydart.name=ホーリーダーツ
items.weapon.missiles.darts.incendiarydart.desc=このダーツの先端には、ファイヤーブルームをベースにしたコンパウンドが塗られており、着弾時に鮮やかな炎を上げる。
items.weapon.missiles.darts.incendiarydart.name=焼夷弾
items.weapon.missiles.darts.paralyticdart.desc=このダーツの先端には土の根をベースにした化合物が練りこまれており、標的を短時間麻痺させる。
items.weapon.missiles.darts.paralyticdart.name=麻痺性ダート
items.weapon.missiles.darts.poisondart.desc=このダーツの先端には、ターゲットに毒を盛るソーンモス系の化合物が練りこまれている。
items.weapon.missiles.darts.poisondart.name=ポイズンダート
items.weapon.missiles.darts.rotdart.desc=この邪悪なダーツの先端には、酸性のロットベリーをベースにした化合物が練りこまれており、ダーツが接触したものを積極的に蝕む。強力な敵であればほとんどの効果に耐えるが、一般的な敵であれば簡単に倒せるほど腐食力は強い。このダーツは他のダーツよりも長持ちするが、耐久力を上げることはできない。
items.weapon.missiles.darts.rotdart.discover_hint=このアイテムは、特定のクエストのシードを使って作ることができる。
items.weapon.missiles.darts.rotdart.name=ロットダート
items.weapon.missiles.darts.shockingdart.desc=このダーツの先端にはストームバインをベースにしたコンパウンドが使用されており、ターゲットに強烈な衝撃を与える。
items.weapon.missiles.darts.shockingdart.name=ショッキングダーツ
items.weapon.missiles.darts.tippeddart.about_to_break=ダーツのティップがもうすぐ切れる。
items.weapon.missiles.darts.tippeddart.ac_clean=クリーン
items.weapon.missiles.darts.tippeddart.cancel=キャンセル
items.weapon.missiles.darts.tippeddart.clean_all=すべてきれいにする
items.weapon.missiles.darts.tippeddart.clean_desc=この操作により、ダーツのシードティップが取り除かれ、通常のダーツに戻る。
items.weapon.missiles.darts.tippeddart.clean_one=クリーンワン
items.weapon.missiles.darts.tippeddart.clean_title=クリーンダーツ
items.weapon.missiles.darts.tippeddart.discover_hint=このアイテムはショップで買うこともできるし、シードを使って作ることもできる。
items.weapon.missiles.darts.tippeddart.has_broken=ダーツの有効期限が切れています。
items.weapon.missiles.darts.tippeddart.unlimited_uses=でも、これは品質が高いから、事実上永遠に使えるんだ」。
items.weapon.missiles.darts.tippeddart.uses_left=このダーツのスタックには、1本のティップが切れるまでに_%d/%d_の使用回数が残っている。
items.weapon.missiles.fishingspear.desc=釣り用に作られたにもかかわらず、即席の武器として活躍する小さな投げ槍。
items.weapon.missiles.fishingspear.name=つりざお
items.weapon.missiles.forcecube.desc=この奇妙な形をした魔法のキューブは、手で持てるほど小さいが、とてつもなく重い。
items.weapon.missiles.forcecube.name=フォースキューブ
items.weapon.missiles.forcecube.ondeath=自分のフォースキューブで自殺したのか...。
items.weapon.missiles.forcecube.stats_desc=この武器は衝撃の力を狭い範囲に拡散させ、近くにあるものすべてに命中させる。
items.weapon.missiles.heavyboomerang.desc=この大きなブーメランを効果的に振るうのは難しいが、かなりのダメージを与えることができる。
items.weapon.missiles.heavyboomerang.name=ヘビーブーメラン
items.weapon.missiles.heavyboomerang.stats_desc=この武器は5ターン後に投げた場所に戻る。
items.weapon.missiles.javelin.desc=このような大型の投げ槍は、宙を舞うときに先端のスパイクを最前面に保つように重みが加えられている。
items.weapon.missiles.javelin.name=ジャベリン
items.weapon.missiles.kunai.desc=これらの小型ナイフは、熟練した使い手の手にかかると非常に強力な威力を発揮する。
items.weapon.missiles.kunai.name=クナイ
items.weapon.missiles.kunai.stats_desc=この武器は無意識の敵に強い。
