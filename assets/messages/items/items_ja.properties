items.weapon.missiles.missileweapon.about_to_break=投げた武器が壊れかけている。
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=強化投げ武器セットの最後の投げ武器が壊れると、そのセットは永久に失われます。本当に投げますか？
items.weapon.missiles.missileweapon.break_upgraded_warn_no=いいえ
