items.artifacts.chaliceofblood.ac_prick=プリック
items.artifacts.chaliceofblood.desc=この輝く銀の聖杯は、縁に鋭い宝石で奇妙に飾られている。
items.artifacts.chaliceofblood.desc_1=聖杯を持つと、鋭利な宝石で自分の体を刺したくなる。
items.artifacts.chaliceofblood.desc_2=自分の血液の一部が聖杯にたまり、聖杯が自分に生命エネルギーを送り込み、自然な健康再生力を高めているのをさりげなく感じることができる。痛いとわかっていても、聖杯で自分の体を切りたくなる。
items.artifacts.chaliceofblood.desc_3=聖杯はあなたのライフエッセンスで満たされています。あなたは、聖杯があなたに生命エネルギーを注いでいるのを感じることができる。
items.artifacts.chaliceofblood.desc_cursed=呪われた聖杯があなたの手に結合し、体力を回復する能力を阻害している。
items.artifacts.chaliceofblood.name=血の聖杯
items.artifacts.chaliceofblood.no=いや、気が変わったんだ
items.artifacts.chaliceofblood.ondeath=聖杯はあなたの命のエッセンスを吸い取る...。
items.artifacts.chaliceofblood.onprick=自分の体を刺すと、ライフエッセンスが聖杯に流れ込む。
items.artifacts.chaliceofblood.prick_warn=聖杯を使うたびに生命エネルギーを消耗するが、その代わり、自然治癒力がさらに高まる。\n\n現在のところ、自分を刺すと_%1$d-%2$dのダメージを与えるが、このダメージは_物理・魔法両方のブロックやダメージ軽減によって軽減できる_ダメージ軽減効果を考慮しなければ、自分を刺すと_%3$s%%の確率で生命力を完全に消耗する。\n\n本当に聖杯にもっと生命力を捧げたいのですか？
items.artifacts.chaliceofblood.yes=ああ、自分が何をしているかは分かっている
items.artifacts.cloakofshadows$cloakstealth.desc=影のマントで覆われている間、あなたは透明化される。キャンセルされるか、マントのチャージがなくなるまで、あなたはマントに覆われたままである。\n\n君が透明になっている間、敵は君を攻撃したり追ったりすることができない。物理攻撃や魔法効果（巻物や杖など）は即座に透明化を解除する。\n\nチャージ使用までのターン：%d。
