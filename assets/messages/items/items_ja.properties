items.rings.ring.unknown_desc=この金属の指輪には大きな%sがはめ込まれ、暗闇の中できらめいている。身につけるとどんな効果があるのだろう？
items.rings.ringofaccuracy.combined_stats=あなたの装備しているリングはその力を合わせ、あなたの命中精度を合計で_%s%%_向上させている。
items.rings.ringofaccuracy.desc=この指輪は、敵に攻撃を当てる確率を高める。
items.rings.ringofaccuracy.name=命中の指輪
items.rings.ringofaccuracy.stats=このリングを着用すると、命中精度が_%s%%._向上します。
items.rings.ringofaccuracy.typical_stats=このリングを装着すると、通常、命中精度が_%s%%._向上します。
items.rings.ringofaccuracy.upgrade_stat_name_1=精度向上
items.rings.ringofarcana.combined_stats=あなたの装備している指輪はその力を合わせ、エンチャントとグリフのパワーを合計で_%s%%_増加させる。
items.rings.ringofarcana.desc=武器の魔法エンチャントや防具のグリフ（呪いを含む）を強化するリング！まず発動確率が上昇し、発動確率が100%になると効果の強さが上昇する。呪われた指輪は代わりにエンチャント、グリフ、呪いを弱める。
items.rings.ringofarcana.name=アルカナのリング
items.rings.ringofarcana.stats=このリングを身につけると、エンチャントとグリフのパワーが_%s%%._増加する。
items.rings.ringofarcana.typical_stats=このリングを身につけると、エンチャントやグリフの威力が通常_%s%%._増加する。
items.rings.ringofarcana.upgrade_stat_name_1=アルカナブースト
items.rings.ringofelements.combined_stats=あなたの装備しているリングは、その力を合わせ、合計で_%s%%_元素耐性を提供する。
items.rings.ringofelements.desc=この指輪は火、電気、ガスなどへの耐性を与える。また、悪い効果が続く時間を短くする。
items.rings.ringofelements.name=元素の指輪
items.rings.ringofelements.stats=このリングを装着すると、_%s%%_元素耐性が得られる。
items.rings.ringofelements.typical_stats=このリングを着用すると、通常、_%s%%_の元素抵抗が得られる。
items.rings.ringofelements.upgrade_stat_name_1=抵抗
items.rings.ringofenergy.combined_stats=装備しているリングのパワーが合体し、チャージ速度が合計で_%s%%_増加する。
items.rings.ringofenergy.desc=このリングから放射されるアーケイン・フィールドの中では、魔法の装備のリチャージがより速くなる。呪われたリングはその代わりにチャージが遅くなる。
items.rings.ringofenergy.name=エネルギー・リング
items.rings.ringofenergy.stats=このリングを装着すると、ワンド、アーティファクト、ヒロイックアーマーのチャージ速度が_%s%%._増加する。
items.rings.ringofenergy.typical_stats=このリングを装着すると、通常、ワンド、アーティファクト、ヒロイック・アーマーのチャージ・スピードが_%s%%._増加する。
items.rings.ringofenergy.upgrade_stat_name_1=チャージ・ブースト
items.rings.ringofevasion.combined_stats=装備しているリングのパワーが合体し、回避力が合計で_%s%%_増加する。
items.rings.ringofevasion.desc=この指輪は、敵の攻撃をかわす確率を高める。
items.rings.ringofevasion.name=回避の指輪
items.rings.ringofevasion.stats=この指輪を身につけると、回避力が_%s%%._増加する。
items.rings.ringofevasion.typical_stats=このリングを身につけると、通常、回避力が_%s%%._増加する。
items.rings.ringofevasion.upgrade_stat_name_1=回避ブースト
items.rings.ringofforce$brawlersstance.desc=このスタンスの間、デュエリストの通常攻撃は武器を装備していても装備している力の指輪を使用する。これらの攻撃はボーナスダメージを獲得し、武器のオーグメンテーションとエンチャントを使用する。\n\nただし、このスタンスを維持するには集中力が必要であり、武器能力のチャージ速度が50％低下する。\n\nこのスタンスはリング・オブ・フォースでオン・オフを切り替えることができるが、素早くスタンスを発動したり解除したりすると、チャージ速度の低下は少しの間持続する。
items.rings.ringofforce$brawlersstance.name=喧嘩腰
items.rings.ringofforce.ability_desc=デュエリストはこのリングで_ブロウの構え_を取ることができ、武器を装備していても通常攻撃が常にこのリングを使用するようになる。この攻撃は_%1$d-%2$dのダメージを与え、武器のエンチャントとオーグメントも引き継ぐ。この構えは武器の充電速度を50%%遅くする。
items.rings.ringofforce.ability_name=喧嘩腰
items.rings.ringofforce.combined_stats=装備しているリングのパワーが合体し、武器なしなら合計_%1$d-%2$dダメージを与え、武器ありなら_%3$d_ダメージを増加させる。
items.rings.ringofforce.desc=このリングは着用者の近接攻撃の威力を強化する。この強化されたパワーは武器を使う場合にはかなり弱いが、武器を使わない攻撃はかなり強くなる。呪われた指輪は、代わりに着用者の打撃を弱める。
items.rings.ringofforce.name=力リング
items.rings.ringofforce.stats=武器を装備している場合、このリングはダメージを_%1$d-%2$d増加させる_%3$d._。
items.rings.ringofforce.typical_ability_desc=デュエリストはこのリングで_ブロウの構え_を取ることができ、武器を装備していても通常攻撃は常にこのリングを使用するようになる。これらの攻撃は通常_%1$d-%2$dのダメージを与え、武器のエンチャントとオーグメントも引き継ぐ。このスタンスは武器の充電速度を50%%遅くする。
items.rings.ringofforce.typical_stats=武器を装備している場合、通常このリングはダメージを_%1$d-%2$d増加させる_%3$d._。
items.rings.ringofforce.upgrade_stat_name_1=非武装ダメージ
items.rings.ringofforce.upgrade_stat_name_2=武装ダメージブースト
items.rings.ringofforce.upgrade_stat_name_3=能力ダメージ
items.rings.ringoffuror.combined_stats=装備したリングのパワーが合体し、攻撃のスピードが合計で_%s%%_アップする。
items.rings.ringoffuror.desc=このリングは着用者に内なる怒りを与え、より素早い攻撃を可能にする。呪われた指輪は、代わりに着用者の攻撃速度を遅くする。
items.rings.ringoffuror.name=どよめき
items.rings.ringoffuror.stats=このリングを身につけると、攻撃速度が_%s%%._増加する。
items.rings.ringoffuror.typical_stats=このリングを身につけると、通常、攻撃速度が_%s%%._増加する。
items.rings.ringoffuror.upgrade_stat_name_1=攻撃速度ブースト
items.rings.ringofhaste.combined_stats=装備しているリングのパワーが合体し、移動速度が合計で_%s%%_増加する。
items.rings.ringofhaste.desc=この指輪は身につけた者の時間の流れを速め、あらゆる行動を少し速くする。
items.rings.ringofhaste.name=加速の指輪
items.rings.ringofhaste.stats=このリングを身につけると、移動速度が_%s%%._増加する。
items.rings.ringofhaste.typical_stats=このリングを身につけると、通常、移動速度が_%s%%._増加する。
