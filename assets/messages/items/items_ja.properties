items.weapon.missiles.throwingclub.stats_desc=この武器は敵にくっつかず、即座に回収できる。
items.weapon.missiles.throwinghammer.desc=この重いハンマーは敵に投げつけるように設計されている。滑らかなオールメタル製で、耐久性はかなり高い。
items.weapon.missiles.throwinghammer.name=スローイングハンマー
items.weapon.missiles.throwinghammer.stats_desc=この武器は敵にくっつかず、即座に回収できる。
items.weapon.missiles.throwingknife.desc=この軽量ナイフは、空中を弧を描いてターゲットに突き刺さるようにバランスされている。
items.weapon.missiles.throwingknife.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.missiles.throwingknife.name=スローイングナイフ
items.weapon.missiles.throwingknife.stats_desc=この武器は無意識の敵に強い。
items.weapon.missiles.throwingspear.desc=この軽量の槍はフレームが細く、投げるように設計されており、突き刺すことはできない。
items.weapon.missiles.throwingspear.name=投擲槍
items.weapon.missiles.throwingspike.desc=この耐久性のある金属の尖った軸は、遠くの敵に投げつけるためのものだ。
items.weapon.missiles.throwingspike.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.missiles.throwingspike.name=スローイングスパイク
items.weapon.missiles.throwingstone.desc=これらの石は、普通の石よりも力強く投げることができるようにやすりがかけられている。
items.weapon.missiles.throwingstone.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.missiles.throwingstone.name=いしつぶて
items.weapon.missiles.tomahawk.desc=この投げ斧には鋸歯状の刃があり、敵に突き刺さると裂ける。
items.weapon.missiles.tomahawk.name=トマホーク
items.weapon.missiles.tomahawk.stats_desc=この武器は対象に_%1$d-%2$d出血_を与える。
items.weapon.missiles.tomahawk.typical_stats_desc=この武器は通常、対象に_%1$d-%2$d出血_を与える。
items.weapon.missiles.trident.desc=先端に3つの致命的な突起がついた巨大な投げ槍。強力だがかなり重い。
items.weapon.missiles.trident.name=簎
items.weapon.spiritbow.ac_shoot=シュート
items.weapon.spiritbow.desc=古代の魔法の木で作られた弓。弓の弦とエッチングが青白く光る。弦を引くと魔法の矢を放ち、敵に向けることができる。
items.weapon.spiritbow.discover_hint=ヒーローの一人はこのアイテムを持っている。
items.weapon.spiritbow.name=あずさゆみ
items.weapon.spiritbow.prompt=ターゲットを選ぶ
items.weapon.spiritbow.stats=弓は直接アップグレードすることはできないが、レベルが上がるにつれて着実に強くなっていく。現在のレベルでは、弓から放たれる矢は_%1$d-%2$dのダメージを与え、適切に使用するには_%3$dの強さを必要とする。
items.weapon.weapon$enchantment.discover_hint=この効果を持つアイテムは、ダンジョン内でランダムに見つけることができる。
