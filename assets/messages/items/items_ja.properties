items.weapon.weaponeffects.weaponeffect.smite.prefix=野蛮
items.weapon.weaponeffects.weaponeffect.smite.name=野蛮な%s
items.weapon.weaponeffects.weaponeffect.smite.desc=この武器は_野蛮_な力を持つ。命中時に_20%_の確率で_レベル1の強打_を放つ。
items.weapon.weaponeffects.weaponeffect.smite.activate=強打！

items.weapon.weaponeffects.weaponeffect.knockback.prefix=撃退
items.weapon.weaponeffects.weaponeffect.knockback.name=撃退の%s
items.weapon.weaponeffects.weaponeffect.knockback.desc=この武器は_撃退_の力を持つ。命中時に_20%_の確率で敵を_1マス_押し戻す。ボスには効かない。
items.weapon.weaponeffects.weaponeffect.knockback.activate=ノックバック！

items.weapon.weaponeffects.weaponeffect.venom.prefix=蛇牙
items.weapon.weaponeffects.weaponeffect.venom.name=蛇牙の%s
items.weapon.weaponeffects.weaponeffect.venom.desc=この武器には_蛇牙_の毒が宿る。命中時に_20%_の確率で相手を毒にする。
items.weapon.weaponeffects.weaponeffect.venom.activate=ヴェノム！

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=足止め
items.weapon.weaponeffects.weaponeffect.kneeshot.name=足止めの%s
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=この武器は_足止め_の力を持つ。遠距離攻撃の命中時に_20%_の確率で敵を_10ターン_不具にする。ボスには効かない。
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=足止め！

items.weapon.weaponeffects.weaponeffect.spark.prefix=ルーン
items.weapon.weaponeffects.weaponeffect.spark.name=ルーンの%s
items.weapon.weaponeffects.weaponeffect.spark.desc=この杖には_ルーン_が刻まれている。魔法が_20%_の確率で_スパーク_を起こし、追加で_4～8_の魔法ダメージを与える。
items.weapon.weaponeffects.weaponeffect.spark.activate=スパーク！

items.weapon.weaponeffects.weaponeffect.curse.prefix=呪術
items.weapon.weaponeffects.weaponeffect.curse.name=呪術の%s
items.weapon.weaponeffects.weaponeffect.curse.desc=この杖には_呪術_が宿る。魔法が_20%_の確率で相手を弱め、与えるダメージを_10ターン_の間_5%_減らす。
items.weapon.weaponeffects.weaponeffect.curse.activate=呪い！

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=吸命
items.weapon.weaponeffects.weaponeffect.drainlife.name=吸命の%s
items.weapon.weaponeffects.weaponeffect.drainlife.desc=この杖は_生命を吸い取る_。魔法が_20%_の確率で追加の_8～16_魔法ダメージを与え、相手から奪った体力と同じだけ自分を回復する。
items.weapon.weaponeffects.weaponeffect.drainlife.activate=吸命！

items.armor.armorprefix.stalwart.name=堅固な%s
items.armor.armorprefix.stalwart.desc=この鎧は_堅固_だ。敵の攻撃を受けると_20%_の確率で_レベル5の頑強_が発動し、そのダメージを_20%_減らす。
items.armor.armorprefix.stalwart.activate=頑強！

items.armor.armorprefix.vigilant.name=警戒の%s
items.armor.armorprefix.vigilant.desc=この鎧は_警戒_の力を持つ。敵の遠距離攻撃を_20%_の確率でかわす。
items.armor.armorprefix.vigilant.activate=警戒！

items.armor.armorprefix.elusive.name=身かわしの%s
items.armor.armorprefix.elusive.desc=この鎧は_身かわし_の力を持つ。敵の攻撃でダメージを受けると、_20%_の確率で回避が_5ターン_の間_5_上がる。
items.armor.armorprefix.elusive.activate=回避！
