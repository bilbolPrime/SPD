items.kindofweapon.equip_cursed=思わず武器を握り締める。
items.kindofweapon.swift_equip=素早く武器を装備する。
items.kindofweapon.which_equip_msg=このアイテムをどの武器スロットに装備したいですか？\n\nチャンピオンはメインウェポンで直接攻撃するが、どちらのウェポンのアビリティも使用できる。どちらの武器もチャージ数は同じです。\n\nまた、チャンピオンはプライマリウェポンとセカンダリウェポンを瞬時に交換することができる。
items.kindofweapon.which_equip_primary=プライマリー (%s)
items.kindofweapon.which_equip_secondary=セカンダリー（%s）
items.kingscrown.ac_wear=ウェア
items.kingscrown.desc=ドワーフ最後の王の王冠で、とてつもない魔力で輝いている。\n\n着用すると、王冠の魔力が現在着用している鎧に流れ込み、特別な能力を持つユニークなエピック・アーマーに変身する_新しい鎧は元の鎧の特性をすべて維持する。
items.kingscrown.discover_hint=このアイテムは特定の敵からドロップで入手できる。
items.kingscrown.naked=残念ながら、クラウンは下着を変身させることはできない。
items.kingscrown.name=ドワーフの王冠
items.kingscrown.ratgraded=アーマーが変身すると、ラット・キングの前足が明るく輝く！
items.kingscrown.upgraded=王冠は明るく輝き、鎧が変身すると同時に崩壊する！
items.liquidmetal.ac_apply=応募する
items.liquidmetal.already_fixed=その投擲武器はすでに完璧な状態だ！
items.liquidmetal.apply=あなたは%dリキッドメタルを使って投げた武器を修理する。
items.liquidmetal.desc=この魔法の液体は、投げられた武器のひび割れや裂け目を埋め、完璧な状態に修復することができる！武器のセットに欠けている武器があるが、それ以外は完全に修復されている場合、リキッドメタルを使ってセットの欠けている武器の代わりにすることもできる！\n\nティア1の武器を完全に修理するにはリキッドメタルを10個、ティア5の武器には30個必要とする。アップグレードするごとに、必要なメタルの量も35％ずつ増える。\n\nリキッドメタルは先端ダーツの先端の修理には使用できない。
items.liquidmetal.discover_hint=このアイテムは錬金術で作ることができる。
items.liquidmetal.name=液体金属
items.liquidmetal.prompt=投擲武器を選択する
items.lostbackpack.desc=これはあなたの失われたインベントリです。これを集めて、失ったアイテムを取り戻そう！
items.lostbackpack.name=ロストリュック
items.merchantsbeacon.ac_use=使用
items.merchantsbeacon.desc=このドワーフの奇妙な技術によって、遠く離れた場所からでも通信することができる。\n\nこのビーコンを起動すると、ダンジョンのどこからでもピクセルマートにアイテムを売ることができるようになる。\n\nただし、ビーコンの魔法は1セッションしか使えないので、賢く使おう。
items.merchantsbeacon.name=マーチャント・ビーコン
items.potions.brews.aquabrew.desc=この酒は砕けると、その場所に加圧された水のバーストを放つ。灼熱の敵にダメージを与えるには十分な威力だが、近くの地形に水を撒き散らし、罠を無効化し、火を消し、バースト地点の近くにいるキャラクターをノックバックさせる。
items.potions.brews.aquabrew.name=アクア・ブリュー
items.potions.brews.blizzardbrew.desc=粉々になると、この醸造酒は渦巻く吹雪を巻き起こし、すぐにガスのように広がる。
items.potions.brews.blizzardbrew.name=ブリザード・ブルー
items.potions.brews.brew.discover_hint=このアイテムは錬金術で作ることができる。
items.potions.brews.causticbrew.desc=この醸造酒は、粉々になった場所の周囲に広範囲に腐食性の滲出物を撒き散らす。水で洗い流すことができなければ、滲出液に巻き込まれたものはゆっくりと溶けていく。
items.potions.brews.causticbrew.name=苛性醸造
items.potions.brews.infernalbrew.desc=粉々になると、この酒は猛烈な地獄の炎を放ち、たちまちガスのように燃え広がる。
items.potions.brews.infernalbrew.name=インファナル・ブリュー
items.potions.brews.shockingbrew.desc=この酒は砕けると、砕けた場所を中心に広範囲に電気の嵐を巻き起こす。
items.potions.brews.shockingbrew.name=ショッキングブリュー
items.potions.brews.unstablebrew.desc=この不思議な醸造酒は、移り変わる虹色に輝いている。\n\n飲んだり投げたりすると、ランダムなポーションの効果が発動する。ポーションの効果は、飲めば必ず有益になり、投げれば必ず有害になる。
items.potions.brews.unstablebrew.name=不安定な酒
items.potions.elixirs.elixir.discover_hint=このアイテムは錬金術で作ることができる。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=あなたは一時的にグーに似た回復力を得た。\n\n水中に立っている間、1ターンにつき少量のヘルスが回復する。体力が満タンになるか、水の外に出ると効果は一時停止する。\n\n左から回復：%d。
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=アクアティック・ヒーリング
items.potions.elixirs.elixirofaquaticrejuvenation.desc=このエリクサーはグーの残骸をヒーリングポーションで強化したものである。すぐに回復するわけではないが、水中に立っている間は着実に体力を回復させることができる。
items.potions.elixirs.elixirofaquaticrejuvenation.name=水中若返りの霊薬
items.potions.elixirs.elixirofarcanearmor.desc=このエリクサーを飲むと、魔法ダメージに対する耐性が長期間持続する。
items.potions.elixirs.elixirofarcanearmor.name=アーケインアーマー
items.potions.elixirs.elixirofdragonsblood.desc=このエリクサーを飲むと、飲んだ者の血管に炎のようなパワーが走る。この効果により、飲んだ者は炎に対する免疫ができ、物理攻撃で敵を炎に包むことができる。
items.potions.elixirs.elixirofdragonsblood.name=エリクサー・オブ・ドラゴンズ・ブラッド
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=あなたはフェザー・フォール・エリクサーの効果下にあり、ダメージを受けることなく峡谷に落ちることができる！\n\n残りターン%s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=フェザーフォール
items.potions.elixirs.elixiroffeatherfall.desc=この霊薬は弱いが、より制御された浮遊効果をもたらし、飲んだ者は少しの間、無傷で長距離を落下することができる。
items.potions.elixirs.elixiroffeatherfall.light=羽のように軽く感じる！
items.potions.elixirs.elixiroffeatherfall.name=フェザーフォールのエリクサー
items.potions.elixirs.elixirofhoneyedhealing.desc=この霊薬は治癒と蜂蜜の甘さを兼ね備えている。飲むと治癒のポーションと同じ効果を発揮し、少量の空腹を満たすが、味方を癒すために投げることもできる。\n\n蜂蜜に親和性のあるクリーチャーには、このアイテムを使うとなだめることができるかもしれない。
items.potions.elixirs.elixirofhoneyedhealing.name=蜂蜜の癒しの万能薬
items.potions.elixirs.elixiroficytouch.desc=このエリクサーを飲むと、攻撃した敵から熱を奪うことができる。この効果により、飲み手は寒さに対する免疫ができ、物理攻撃で敵を冷やすことができるようになる。
items.potions.elixirs.elixiroficytouch.name=氷の感触のエリクサー
items.potions.elixirs.elixirofmight$htboost.desc=身体は不自然なほど強く、健康だと感じる。\n\n最大ヘルスが長時間ブーストされる。レベルが上がるにつれて、ブーストは着実に弱まる。\n\n現在のブースト量%d.\n残りレベル：%d。
items.potions.elixirs.elixirofmight$htboost.name=マックス・ヘルス・ブースト
items.potions.elixirs.elixirofmight.desc=この強力な液体は筋肉を通り抜け、体力を永続的に1ポイント増加させ、最大体力を一時的に%dポイント増加させる。ヘルスブーストは最大ヘルスに比例するが、レベルが上がるにつれて徐々に減少する。
items.potions.elixirs.elixirofmight.msg=新たな力が全身を駆け巡り、あなたは%dの力を手に入れた！
items.potions.elixirs.elixirofmight.name=力薬
items.potions.elixirs.elixiroftoxicessence.desc=このエリクサーを飲むと、毒のエネルギーが飲用者に付与される。飲んだ者は移動しながら毒ガスを撒き散らし続け、効果時間より少し長い間、毒ガスや毒に対する免疫ができる。
items.potions.elixirs.elixiroftoxicessence.name=毒性エッセンスのエリクサー
items.potions.exotic.exoticpotion.amber=エキゾチック・アンバー・ポーション
items.potions.exotic.exoticpotion.azure=エキゾチック・アズール・ポーション
items.potions.exotic.exoticpotion.bistre=エキゾチック・ビストル・ポーション
items.potions.exotic.exoticpotion.charcoal=エキゾチック・チャコール・ポーション
items.potions.exotic.exoticpotion.crimson=エキゾチック・クリムゾン・ポーション
items.potions.exotic.exoticpotion.discover_hint=このアイテムは錬金術で作ることができる。
items.potions.exotic.exoticpotion.golden=エキゾチック・ゴールデン・ポーション
items.potions.exotic.exoticpotion.indigo=エキゾチック・インディゴ・ポーション
items.potions.exotic.exoticpotion.ivory=エキゾチック・アイボリー・ポーション
items.potions.exotic.exoticpotion.jade=エキゾチック・ジェイド・ポーション
items.potions.exotic.exoticpotion.magenta=エキゾチック・マゼンタ・ポーション
items.potions.exotic.exoticpotion.no=いや、気が変わったんだ
items.potions.exotic.exoticpotion.silver=エキゾチックシルバーポーション
items.potions.exotic.exoticpotion.turquoise=エキゾチック・ターコイズ・ポーション
items.potions.exotic.exoticpotion.unknown_desc=この丸いフラスコには、粒状のカラフルな液体が入っている。この土地にとっては異質なもののようだが、飲んだり投げたりしたらどうなるかは誰にもわからない。
items.potions.exotic.exoticpotion.warning=本当にこのポーションの使用をキャンセルしたいのですか？どうせ消費されてしまう。
items.potions.exotic.exoticpotion.yes=はい、私は前向きです
items.potions.exotic.potionofcleansing$cleanse.desc=このキャラクターは一時的にすべての有害なステータス効果に対して免疫がある！\n\n残りターン%s.
items.potions.exotic.potionofcleansing$cleanse.name=清浄
items.potions.exotic.potionofcleansing.desc=この強力な試薬を飲むと、飲んだ者は数ターンの間、あらゆる有害なステータス効果を受けなくなる。対象に投げつけて浄化することもできる。
items.potions.exotic.potionofcleansing.name=清めの水
items.potions.exotic.potionofcorrosivegas.desc=この加圧されたグラスの栓を抜いたり、砕いたりすると、中身が爆発し、腐食性の錆色のガスが発生する。ガスは有毒ガスよりも早く拡散し、より致命的だが、持続時間もそれほど長くはない。
items.potions.exotic.potionofcorrosivegas.name=腐食性ガス水溶液
items.potions.exotic.potionofdivineinspiration.bonus=タレントポイント+2！
items.potions.exotic.potionofdivineinspiration.desc=聖なるエネルギーのパワーを液体にしたもので、飲む者に神聖なパワーを与え、好きな階層で2ポイントのボーナス才能を与える。\n\nこのポーションは各階層につき1回のみ使用できる。
items.potions.exotic.potionofdivineinspiration.name=霊薬
items.potions.exotic.potionofdivineinspiration.no_more_points=これ以上ボーナスの才能ポイントを得ることはできない。
items.potions.exotic.potionofdivineinspiration.select_tier=ボーナスポイントを2ポイント獲得するには、タレントレベルを選択する。ポイントを使用するには、そのタレントをアンロックしている必要がある。
items.potions.exotic.potionofdragonsbreath.desc=このフラスコには、唾液と混ざった直後に炎を噴き出す珍しい化合物が含まれている。液体を素早く吐き出せば、口から炎を噴出させることができる！
items.potions.exotic.potionofdragonsbreath.name=りゅうのいぶくろ
items.potions.exotic.potionofdragonsbreath.prompt=焼却場所を選ぶ
items.potions.exotic.potionofearthenarmor.desc=この液体は麻痺させるのではなく、皮膚を硬化させ、一時的な天然の鎧に変える効果がある。
items.potions.exotic.potionofearthenarmor.name=土の鎧のポーション
items.potions.exotic.potionofmagicalsight.desc=これを飲むと、一時的に感覚が驚異的に高まり、半径12タイルの壁を見通すことができるようになる！
items.potions.exotic.potionofmagicalsight.name=魔眼薬
items.potions.exotic.potionofmastery.armor_easier=鎧が着やすくなる！
items.potions.exotic.potionofmastery.desc=このポーションは生の力を与えるのではなく、使用者の筋肉を特定のアイテムに同調させる。これにより、飲んだ者はそのアイテムを使って練習し、筋肉を記憶したかのように、そのアイテムを使いやすくなる。\n\n選んだ武器や防具を使用するのに必要な筋力が2少なくなる。このポーションは各アイテムに1回しか使えない。
items.potions.exotic.potionofmastery.name=妙薬
items.potions.exotic.potionofmastery.prompt=アイテムをマスターする
items.potions.exotic.potionofmastery.weapon_easier=武器が振りやすくなる！
items.potions.exotic.potionofshielding.desc=このポーションは回復する代わりに、使用者の体の周囲に耐久性のあるシールドを張り、かなりの量のダメージをブロックする。
items.potions.exotic.potionofshielding.name=シールド・ポーション
items.potions.exotic.potionofshroudingfog.desc=空気に触れると、このフラスコ内の液体は濃い煙のような霧を発生させ、すぐに広がって敵の視界を遮る。
items.potions.exotic.potionofshroudingfog.name=霧隠しの水
items.potions.exotic.potionofsnapfreeze.desc=このポーションに含まれる化学物質は空気と急速に反応し、効果範囲内のすべてのものを瞬時に凍結させ、根こそぎにする。
items.potions.exotic.potionofsnapfreeze.name=スナップフリーズ
items.potions.exotic.potionofstamina.desc=この奇妙な甘さの液体を飲むと、エネルギーが長時間持続し、ペースを上げて長時間走ることができる。
items.potions.exotic.potionofstamina.name=スタミナ剤
items.potions.exotic.potionofstormclouds.desc=このポーションを投げると、濃縮された蒸気の雲が素早く広がり、凝縮して周囲に降り注ぐ。ほとんどの地形は水に変換され、炎に包まれた敵はダメージを受け、火は弱まり、罠は圧倒されて壊れる。
items.potions.exotic.potionofstormclouds.name=嵐雲のポーション
items.potions.potion$placeholder.name=水薬
items.potions.potion$seedtopotion.name=ランダムポーション
items.potions.potion.ac_drink=飲む
items.potions.potion.amber=こはくざい
items.potions.potion.azure=紺青の薬
items.potions.potion.beneficial=有益な薬
items.potions.potion.bistre=ビストレ薬
items.potions.potion.charcoal=炭の薬
items.potions.potion.crimson=深紅の薬
items.potions.potion.discover_hint=このアイテムはダンジョン内でランダムに見つかるか、錬金術で作ることができる。
items.potions.potion.golden=黄金ポーション
items.potions.potion.harmful=有害な薬！
items.potions.potion.indigo=藍薬
items.potions.potion.ivory=象牙の薬
items.potions.potion.jade=翡翠の薬
items.potions.potion.magenta=マゼンタポーション
items.potions.potion.no=いや、気が変わったんだ
items.potions.potion.shatter=フラスコは砕け、液体は無害に飛び散る。
items.potions.potion.silver=銀の薬
items.potions.potion.sure_drink=本当に飲むのか？ほとんどの場合、このようなポーションは敵に投げつけるべきだ。
items.potions.potion.sure_throw=本当に投げるのか？ほとんどの場合、飲むことに意味がある。
items.potions.potion.turquoise=ターコイズポーション
items.potions.potion.unknown_desc=この小瓶の中では、%sの液体が渦巻いている。飲んだり投げたりすると何が起こるのだろう？
items.potions.potion.yes=ああ、自分が何をしているかは分かっている
items.potions.potionofexperience.desc=幾多の戦いの経験を液体にしたこのドラフトは、あなたの経験値を一気に高めてくれるだろう。
items.potions.potionofexperience.name=経験の薬
items.potions.potionoffrost.desc=この薬品は外気に触れると蒸発し、凍える雲になる。雲に触れた生き物はその場で凍りつき、動くことも行動することもできなくなる。
items.potions.potionoffrost.name=凍結の薬
items.potions.potionofhaste.desc=この奇妙に甘い液体を飲むと、短時間の間、驚異的なエネルギーが得られ、高速で走ることができる。
items.potions.potionofhaste.energetic=エネルギッシュだ！
items.potions.potionofhaste.name=いそぎのすいやく
items.potions.potionofhealing.desc=体力を瞬時に全回復させ、毒も治す霊薬。
items.potions.potionofhealing.heal=傷口がふさがり始める。
items.potions.potionofhealing.name=治癒の薬
items.potions.potionofinvisibility.desc=この薬を飲むと一時的に透明になり、敵から見えなくなる。敵を攻撃したり、敵の目の前で杖や巻物を使ったりすると効果は消える。
items.potions.potionofinvisibility.invisible=自分の手が見えなくなるのがわかるだろう！
items.potions.potionofinvisibility.name=透明化の薬
items.potions.potionoflevitation.desc=この不思議な液体を飲むと空中に浮かび、罠の上を楽に通り抜けられる。ただし炎やガスは空気中にも広がるため、浮いていても避けられない。
items.potions.potionoflevitation.float=宙に浮く！
items.potions.potionoflevitation.name=浮き身の薬
items.potions.potionofliquidflame.desc=このフラスコには不安定な化合物が含まれており、外気に触れると激しく燃え上がる。
items.potions.potionofliquidflame.name=液体火炎の薬
items.potions.potionofmindvision.desc=この薬を飲むと、遠くの生き物のサイキック・サインに同調し、壁越しに生物の気配を感じることができるようになる。また、このポーションを飲むと、近くの壁やドアを見通すことができるようになる。
items.potions.potionofmindvision.name=精神視の薬
items.potions.potionofmindvision.see_mobs=他の生き物の心の存在をなんとなく感じることができる！
items.potions.potionofmindvision.see_none=今のところ、このレベルにいるのは自分ひとりだということがなんとなくわかる。
items.potions.potionofparalyticgas.desc=外気に触れると、フラスコ内の液体が気化し、しびれるような黄色い靄が発生する。雲を吸い込んだ者は即座に麻痺し、雲が消えた後もしばらく身動きが取れなくなる。このアイテムは遠くの敵に投げつけて、ガスの効果内に捕らえることができる。
items.potions.potionofparalyticgas.name=麻痺ガスの薬
items.potions.potionofpurity.desc=この薬品は、効果範囲内の有害なガスをすばやく無害化する。飲めば、そうしたガスを一時的に受けつけなくなる。
items.potions.potionofpurity.freshness=空気中にただならぬ新鮮さを感じる。
items.potions.potionofpurity.name=浄化の薬
items.potions.potionofpurity.protected=保護フィルムがあなたを包む！
items.potions.potionofstrength.desc=この強力な液体が筋肉を通り抜け、体力を永久に1ポイント増加させる。
items.potions.potionofstrength.msg=新たな力が全身を駆け巡り、あなたは%dの力を手に入れた！
items.potions.potionofstrength.name=力の薬
items.potions.potionoftoxicgas.desc=この加圧グラスの栓を抜いたり、砕いたりすると、中身が爆発して有毒な緑色のガスが発生する。手で栓を抜く代わりに、このポーションを遠くの敵に投げつけることもできる。
items.potions.potionoftoxicgas.name=毒ガスの薬
items.quest.ceremonialcandle.desc=キャンドルのセットは、使い込むうちに溶けて融合する。\n\n単体では無価値だが、他のロウソクと組み合わせて使うことで、召喚儀式のエネルギーを集中させることができる。
items.quest.ceremonialcandle.discover_hint=このアイテムは特定のクエストで見つけることができる。
items.quest.ceremonialcandle.name=儀式用ろうそく
items.quest.corpsedust.chill=背筋が寒くなる。
items.quest.corpsedust.desc=死体の粉玉は、外見上は普通の粉玉と変わらない。しかし、その中に潜む邪悪なエネルギーを感じることができる。\n\n一刻も早く取り除くのが得策だろう。
items.quest.corpsedust.discover_hint=このアイテムは特定のクエストで見つけることができる。
items.quest.corpsedust.name=屍塵
items.quest.darkgold.desc=この金属がダークと呼ばれるのは、その色のせいではなく（通常のゴールドと変わらない）、日光の下で溶けてしまい、表面では役に立たないからである。
items.quest.darkgold.discover_hint=このアイテムは特定のクエストで見つけることができる。
items.quest.darkgold.name=暗黒金鉱
items.quest.darkgold.you_now_have=あなたは今、%dダークゴールド鉱石を持っている。
items.quest.dwarftoken.desc=多くのドワーフや大きな創造物の中には、このような用途不明の小さな金属片を持っている者もいる。宝石なのかもしれないし、身分証明書なのかもしれない。ドワーフは奇妙な民族だ。
items.quest.dwarftoken.discover_hint=このアイテムは特定のクエストで見つけることができる。
items.quest.dwarftoken.name=ドワーフトークン
items.quest.embers.desc=若いファイヤー・エレメンタルからしか採取できない特別な燠火。熱エネルギーを放射する。
items.quest.embers.discover_hint=このアイテムは特定のクエストで見つけることができる。
items.quest.embers.name=元素の残り火
items.quest.escapecrystal.ac_use=使用
items.quest.escapecrystal.desc=テレポートの魔法が込められていると思われる、薄い魔法の呪文結晶。この水晶を使えばいつでもドワーフの金庫を出ることができるが、何も持ち出すことはできない！
items.quest.escapecrystal.discover_hint=このアイテムは特定のクエストで見つけることができる。
items.quest.escapecrystal.name=エスケープクリスタル
items.quest.gooblob.desc=死んだグーから切り離された、ぐちゃぐちゃの塊。まるで大きなゼリーの玉のようだが、食べる勇気はないだろう。\n\n単体では何の役にも立たないが、ある種のポーションや爆弾と組み合わせれば役に立つかもしれない。少なくとも、ちゃんとしたエネルギーに変換してくれるはずだ。
items.quest.gooblob.discover_hint=このアイテムは特定の敵からドロップで入手できる。
items.quest.gooblob.name=ベトベトの塊
items.quest.metalshard.desc=DM-300が破壊される際に割れた、錆びた呪われた金属の破片。その中に不活性な邪悪な魔力を感じる。\n\nそれだけでは何の役にも立たないが、ある種の巻物や爆弾と組み合わせれば役に立つかもしれない。少なくとも、それなりのエネルギーに変換できるはずだ。
items.quest.metalshard.discover_hint=このアイテムは特定の敵からドロップで入手できる。
items.quest.metalshard.name=呪いの金属片
items.quest.pickaxe.ability_desc=デュエリストはツルハシで敵を貫くことができる。これは命中が保証され、3ターンの間弱体効果が適用され、皮膚が硬い敵には_%1$d-%2$dダメージを与える。
items.quest.pickaxe.ability_name=突き刺さる
items.quest.pickaxe.desc=岩を砕くための頑丈で重い道具。ツルハシを装備しなくても採掘はできるが、いざというときには武器として装備することもできるだろう。
items.quest.pickaxe.discover_hint=このアイテムは特定のクエストで見つけることができる。
items.quest.pickaxe.name=つるはし
items.quest.pickaxe.upgrade_ability_stat_name=能力ダメージ
items.quest.ratskull.desc=驚くほど大きなネズミの頭蓋骨。壁に飾ることができれば、狩猟のトロフィーになるだろう。
items.quest.ratskull.name=巨大なネズミの頭蓋骨
items.remains.bowfragment.desc=この割れた木片は、かつて失われたハントレスのスピリットボウの一部だった。破片にはまだ自然のエネルギーが少し残っているので、それを使って周りに草を生やすことができる。ただし、それをすると破片は壊れてしまう。
items.remains.bowfragment.name=弓の断片
items.remains.brokenhilt.desc=この折れた柄は、敗れたデュエリストの武器のようだ。柄にはまだ少し武力が残っているようで、それを使って次の2回の近接攻撃で少しボーナスダメージを与えることができる。ただし、これを使うと柄は壊れてしまう。
items.remains.brokenhilt.name=めぬき
items.remains.brokenstaff.desc=このメイジの杖は、持ち主が亡くなった後、真っ二つに折れてしまった。杖にはまだ魔法のエネルギーが残っているので、それを使って杖のチャージを少し増やすことができる。ただし、これを使うと杖は壊れてしまう。
items.remains.brokenstaff.name=故障スタッフ
items.remains.cloakscrap.desc=この半透明の布切れは、ローグ亡き後の影のマントから出てきたもののようだ。まだ少し神秘的なエネルギーが残っているようで、これを使えばアーティファクトのチャージを少し増やすことができる。ただし、これを使うと布が壊れてしまう。
items.remains.cloakscrap.name=端切れ
items.remains.remainsitem.ac_use=使用
items.remains.remainsitem.discover_hint=このアイテムは、以前のロストランで特定のヒーローの遺体から見つけることができる。
items.remains.sealshard.desc=この赤い蝋の小さな破片は、倒れた戦士の封印から出てきたもののようだ。印章にはまだ少し意志の力が残っているので、それを使って自分をシールドすることができる。しかし、これを使うと封印の破片は破壊されてしまう。
items.remains.sealshard.name=はんこ
items.remains.tornpage.desc=このページは賞味期限切れのクレリックの聖典から切り取ったようなものだ。まだ少し神聖なエネルギーが付着しているので、それを使って少し体力を回復させることができる。ただし、これを使うと破れたページは壊れてしまう。
items.remains.tornpage.name=破れたページ
