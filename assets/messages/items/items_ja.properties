items.weapon.weapon.weak_cursed=呪いにもかかわらず、この武器を装備解除することができる。
items.keys.skeletonkey.name=合い鍵
items.keys.skeletonkey.desc=この鍵はいかにも重厚な雰囲気だ。頭の部分がドクロの形をしている。きっと何か重大な扉を開けることができるのだろう。
items.weapon.melee.meleeweapon.stats_desc=
