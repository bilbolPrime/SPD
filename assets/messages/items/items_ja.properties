items.rings.ringofmight.combined_stats=装備しているリングのパワーが合体し、体力が_%1$d_、最大HPが_%2$s%%_アップする。
items.rings.ringofmight.desc=このリングは着用者の身体的特徴を強化し、より大きな体力と体力を与える。呪われた指輪は着用者を弱体化させる。
items.rings.ringofmight.name=かん
items.rings.ringofmight.stats=この指輪をはめると、体力が_%1$d_、最大HPが_%2$s%%_増加する。
items.rings.ringofmight.typical_stats=このリングを装着すると、通常、体力が_%1$d_増加し、最大HPが_%2$s%%._増加します。
items.rings.ringofmight.upgrade_stat_name_1=ストレングス・ブースト
items.rings.ringofmight.upgrade_stat_name_2=最大HPブースト
items.rings.ringofsharpshooting.combined_stats=装備しているリングのパワーが合体し、投擲武器の有効レベルが_%1$d_上がり、耐久力が_%2$s%%_上がる。
items.rings.ringofsharpshooting.desc=このリングは装着者の正確さと狙いを強化し、すべての投擲武器のダメージと耐久性を高める。呪われたリングは逆の効果をもたらす。
items.rings.ringofsharpshooting.name=リング・オブ・シャープシューティング
items.rings.ringofsharpshooting.stats=このリングを着用すると、投擲武器のレベルが_%1$d_上昇したかのようにダメージが増加し、_%2$s%%._の耐久度が増加する。
items.rings.ringofsharpshooting.typical_stats=このリングを着用すると、通常、投擲武器のレベルが_%1$d_上昇したかのようにダメージが増加し、_%2$s%%._の耐久度が増加する。
items.rings.ringofsharpshooting.upgrade_stat_name_1=レベルダメージブースト
items.rings.ringofsharpshooting.upgrade_stat_name_2=耐久性の向上
items.rings.ringoftenacity.combined_stats=装備しているリングのパワーが合体し、合計で最大_%s%%_まで受けるダメージを軽減する。
items.rings.ringoftenacity.desc=このリングを身につけると、通常なら致命傷となるような攻撃にも耐えることができるようになる。使用者が負傷していればしているほど、ダメージに対する耐性が強くなる。呪われた指輪は、代わりに敵が着用者を処刑しやすくなる。
items.rings.ringoftenacity.name=粘着リング
items.rings.ringoftenacity.stats=このリングを身につけると、受けるダメージを_%s%%._まで軽減する。
items.rings.ringoftenacity.typical_stats=このリングを身につけると、通常、受けるダメージが_%s%%._まで軽減される。
items.rings.ringoftenacity.upgrade_stat_name_1=最大ダメージ耐性
items.rings.ringofwealth.combined_stats=あなたの装備している指輪はそれぞれのパワーを合わせ、あなたの運を合計で_%s%%_増加させる。
items.rings.ringofwealth.desc=この指輪は財宝を引き寄せる磁石のような役割を果たし、敵やコンテナが貴重なアイテムを運んでいる可能性を高めてくれる。呪われた指輪は、代わりに戦利品を受け取る確率を下げてしまう。
items.rings.ringofwealth.name=富の環
items.rings.ringofwealth.stats=このリングを身につけると、運気が上昇します。
