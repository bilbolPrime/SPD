items.artifacts.driedrose$ghosthero.introduce=私の魂はこのバラと結びついている。それは私にとってとても貴重なもので、私が表面に残してきた愛からの贈り物だった。\n\n彼のもとへ戻ることはできないけれど、あなたのおかげで、私の旅を完遂するための再度のチャンスがある。できるようになったら、あなたの呼びかけに応え、あなたとともに戦います。\n\nあなたがバラを持っている限り、私はあなたの声を聞くことができます。\n\n願わくば、私が失敗したところをあなたが成功させてくださることを......。
