items.journal.guidebook.desc=冒険が向いていないと判断した人がここに残した冒険者のガイドブック！この本は魔法の本で、冒険者がページを読むタイミングを促すことができる。\n\nしかし、表紙に大きく書かれた「Don't Panic!
items.journal.guidebook.hint_desktop=ガイドブックにアドバイスがあります！右上の点滅している日記ボタン（%s）を選択すると読むことができます。
