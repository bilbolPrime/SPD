items.food.pasty.amulet_desc=ついに見つけた、魔法のアミュレットを......ちょっと待て、これはアミュレットに似せて作られたただのホイル包みチョコレートだ！無限のパワーは得られないが、少なくとも満腹にはなるし、ちょっとしたアーティファクト・チャージにもなる。\n\nエイプリル・フール！
items.food.pasty.amulet_name=イェンドールのお守り？
items.food.pasty.cane_desc=巨大な砂糖菓子。お腹を満たすのに十分な大きさだし、砂糖が杖にほんの少し余分な電荷を与えてくれるかもしれない。\n\nハッピーホリデー！
items.food.pasty.cane_name=キャンディー・ケーン
items.food.pasty.desc=伝統的なビーフとポテトのフィリングが入った本格的なコーニッシュ・パスティ。おいしい！
items.food.pasty.egg_desc=カラフルな黄色のホイルに包まれた大きなチョコレート・エッグ。おなか一杯になるのに十分な量のチョコレートがあり、砂糖はあなたの芸術品にほんの少しの追加料金を与えてくれるかもしれない。\n\nハッピー・イースター！
items.food.pasty.egg_name=イースターエッグ
items.food.pasty.fish_desc=丸ごと一匹の蒸し魚が、魔法のように保存された青菜の上にのっている。この時期、魚は一度に食べずに少し残しておく習慣がある。\n\n旧正月おめでとう！
items.food.pasty.fish_name=蒸し魚
items.food.pasty.name=パティ
items.food.pasty.pie_desc=大きな一切れのパンプキンパイ。その甘くてスパイシーな味は、あなたを満たし、ほんの少しの癒しを与えてくれる。\n\nハッピーハロウィン！
items.food.pasty.pie_name=パンプキンパイ
items.food.pasty.rainbow_desc=このカラフルなポーションは一種の流動食だ。空腹を満たすだけでなく、隣接するボス以外の敵を落ち着かせ、一時的に戦うのをためらわせる魔法が少し入っている。\n\nハッピー・プライド
items.food.pasty.rainbow_name=レインボーポーション
items.food.pasty.sparkling_desc=このスパークリングポーションは一種の流動食だ。空腹を満たし、スパークリングワインを模しているが、実際にはアルコールではない。お腹の温かい感じが、ちょっとしたシールドを与えてくれる。\n\nよいお年を！
items.food.pasty.sparkling_name=きらめきポーション
items.food.pasty.vanilla_desc=この大きなバニラケーキには、カラフルなスプリンクルと青いフロスティングが施されている。このケーキは長年の経験を祝うために作られたもので、食べるとその経験をほんの少しあなたに与えてくれるでしょう。\n\nオリジナルのピクセルダンジョンは2012年12月4日にリリースされました。ピクセルダンジョン誕生日おめでとう！
items.food.pasty.vanilla_name=ブルーケーキ
items.food.phantommeat.desc=幻のピラニアから切り出された、光り輝く半透明の大きなステーキ。この魔法の肉は調理する必要がなく、十分に満足させるだけでなく、多くの防御的な効果を与える。食べると、透明化、バークスキン、若干の治癒、多くの有害な効果の治癒が得られる。
items.food.phantommeat.discover_hint=このアイテムは特定の敵からドロップで入手できる。
items.food.phantommeat.name=幻の肉
items.food.smallration.desc=見た目は標準的な食糧配給量にそっくりだが、もっと小さい。
items.food.smallration.discover_hint=このアイテムはショップで購入できる。
items.food.smallration.eat_msg=味はまあまあだった。
items.food.smallration.name=少食
items.food.stewedmeat.desc=肉を煮込むことで、病気や寄生虫が取り除かれている。食べても安全なはずだ。
items.food.stewedmeat.discover_hint=このアイテムは錬金術で作ることができる。
items.food.stewedmeat.eat_msg=味はまあまあだった。
items.food.stewedmeat.name=肉の煮込み
items.food.supplyration.desc=このレーションは、盗賊ギルドのメンバーがダンジョンに置いていったものだ。外出先で食べたり、一般的な窃盗を助けるために特別に設計されている。\n\n通常のレーションほどは満腹にならないが、素早く食べることができ、少し直接的な回復をもたらし、ローグの影のマントにチャージを回復させる。
items.food.supplyration.discover_hint=このアイテムは特定のヒーローのタレントを使って見つけることができる。
items.food.supplyration.name=供給量
