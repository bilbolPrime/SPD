items.rings.ring.unknown_desc=Este anel de metal tem uma grande gema de %s que brilha no escuro. Quem sabe qual será seu efeito ao usá-lo?
items.rings.ringofaccuracy.combined_stats=Os anéis que equipou estão a combinar os seus poderes, aumentando a sua precisão num total de _%s%%_.
items.rings.ringofaccuracy.desc=Este anel aumenta a probabilidade de acertar no inimigo.
