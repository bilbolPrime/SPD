items.weapon.melee.whip.typical_ability_desc=A Duelista pode _chicoteá_ todos os inimigos à sua volta. Esta habilidade causa normalmente _%1$d-%2$d de dano_, atinge todos os inimigos dentro do alcance de ataque e tem acerto garantido.
items.weapon.melee.wornshortsword.ability_desc=O Duelista pode _golpear_ um inimigo com uma espada curta gasta. Isto causa _%1$d-%2$d de dano_ e tem acerto garantido. Se o golpe matar um inimigo, a morte é instantânea e o Duelista pode voltar a utilizar o golpe dentro de 5 turnos gratuitamente.
items.weapon.melee.wornshortsword.ability_name=clivar
items.weapon.melee.wornshortsword.desc=Uma espada bastante curta, desgastada pelo uso intenso. É mais frágil e um pouco mais leve do que uma espada curta em melhores condições.
