items.weapon.melee.spear.ability_desc=O Duelista pode utilizar a ponta de uma lança para _espetar_ um inimigo que esteja ao alcance, mas não adjacente. Isto causa _%1$d-%2$d de dano_, empurra o inimigo para trás e tem acerto garantido.
