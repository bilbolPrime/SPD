items.potions.potion.ivory=poção de marfim
items.potions.potion.jade=poção de jade
items.potions.potion.magenta=poção magenta
items.potions.potion.no=Não, mudei de ideias.
items.potions.potion.shatter=O frasco estilhaça-se e o líquido espirra sem causar danos.
items.potions.potion.silver=poção de prata
items.potions.potion.sure_drink=Tem a certeza de que quer beber isto? Na maioria dos casos, deves atirar estas poções aos teus inimigos.
items.potions.potion.sure_throw=Tem a certeza de que quer deitar fora? Na maioria dos casos, faz sentido beber.
items.potions.potion.turquoise=poção turquesa
items.potions.potion.unknown_desc=Um líquido %s gira dentro deste frasco. Quem sabe o que acontecerá se você beber ou arremessar?
items.potions.potion.yes=Sim, eu sei o que estou a fazer.
items.potions.potionofexperience.desc=As experiências lendárias de inúmeras batalhas reduzidas à forma líquida, esta poção aumentará instantaneamente o seu nível de experiência.
items.potions.potionofexperience.name=poção de experiência
items.potions.potionoffrost.desc=Em contacto com o ar, este produto evapora-se numa nuvem gelada. Qualquer criatura que lhe toque fica congelada no sítio, sem poder mover-se ou agir.
items.potions.potionoffrost.name=poção de gelo
items.potions.potionofhaste.desc=Ingerir este líquido estranhamente doce dar-lhe-á uma energia tremenda durante um curto período de tempo, permitindo-lhe correr a alta velocidade.
items.potions.potionofhaste.energetic=Sente-se cheio de energia!
items.potions.potionofhaste.name=poção da pressa
items.potions.potionofhealing.desc=Um elixir que restaura instantaneamente toda a saúde e cura o envenenamento.
items.potions.potionofhealing.heal=As suas feridas começam a cicatrizar.
items.potions.potionofhealing.name=poção de cura
items.potions.potionofinvisibility.desc=Esta poção torna-o temporariamente invisível aos inimigos. Atacar, ou usar uma varinha ou um pergaminho à vista deles, desfaz o efeito.
items.potions.potionofinvisibility.invisible=Vê as suas mãos ficarem invisíveis!
items.potions.potionofinvisibility.name=poção da invisibilidade
items.potions.potionoflevitation.desc=Este líquido curioso permite flutuar no ar e passar sobre armadilhas sem esforço. As chamas e os gases também enchem o ar, pelo que voar não permite evitá-los.
items.potions.potionoflevitation.float=Você flutua no ar!
items.potions.potionoflevitation.name=poção de levitação
items.potions.potionofliquidflame.desc=Este frasco contém um composto instável que entrará em combustão espontânea violenta ao entrar em contacto com o ar.
items.potions.potionofliquidflame.name=poção de chama líquida
items.potions.potionofmindvision.desc=Após beber esta poção, a sua mente irá sintonizar-se com a assinatura psíquica de criaturas distantes, permitindo-lhe sentir presenças biológicas através das paredes. Além disso, esta poção permitir-lhe-á ver através de paredes e portas próximas.
items.potions.potionofmindvision.name=poção da visão mental
items.potions.potionofmindvision.see_mobs=De alguma forma, consegue sentir a presença da mente de outras criaturas!
items.potions.potionofmindvision.see_none=De alguma forma, consegue perceber que está sozinho neste nível neste momento.
items.potions.potionofparalyticgas.desc=Ao entrar em contacto com o ar, o líquido deste frasco irá vaporizar, formando uma névoa amarela e entorpecente. Qualquer pessoa que inale a nuvem ficará instantaneamente paralisada, incapaz de se mover durante algum tempo após a dissipação da nuvem. Este item pode ser atirado contra inimigos distantes para os atingir dentro do efeito do gás.
items.potions.potionofparalyticgas.name=poção de gás paralisante
items.potions.potionofpurity.desc=Este reagente neutraliza rapidamente todos os gases nocivos na área afetada. Bebê-lo concede imunidade temporária a esses gases.
items.potions.potionofpurity.freshness=Sente-se uma frescura invulgar no ar.
items.potions.potionofpurity.name=Poção de Purificação
items.potions.potionofpurity.protected=Uma película protetora envolve-te!
items.potions.potionofstrength.desc=Este poderoso líquido percorrerá os seus músculos, aumentando permanentemente a sua força em um ponto.
items.potions.potionofstrength.msg=Uma força inédita percorre o seu corpo, agora possui a força %d!
items.potions.potionofstrength.name=poção da força
items.potions.potionoftoxicgas.desc=Ao abrir ou partir este frasco de vidro pressurizado, o seu conteúdo explodirá numa nuvem mortal de gás verde tóxico. Podes optar por atirar esta poção contra inimigos distantes em vez de a abrir manualmente.
items.potions.potionoftoxicgas.name=poção de gás tóxico
items.quest.ceremonialcandle.desc=Um conjunto de velas, derretidas e fundidas pelo uso. Sozinhas, não têm qualquer valor, mas utilizadas com outras velas num padrão, podem concentrar a energia para um ritual de invocação.
items.quest.ceremonialcandle.discover_hint=Podes encontrar este item durante uma missão específica.
items.quest.ceremonialcandle.name=vela cerimonial
items.quest.corpsedust.chill=Um arrepio percorre-lhe a espinha.
items.quest.corpsedust.desc=A bola de pó para cadáveres não difere externamente de uma bola de pó comum. Mas pode sentir uma energia malévola à espreita dentro dela. Livrar-se dela o mais rapidamente possível seria uma boa ideia.
items.quest.corpsedust.discover_hint=Podes encontrar este item durante uma missão específica.
items.quest.corpsedust.name=pó de cadáver
items.quest.darkgold.desc=Este metal é chamado de escuro não pela sua cor (que não difere da cor do ouro normal), mas porque derrete sob a luz do dia, tornando-se inútil à superfície.
items.quest.darkgold.discover_hint=Podes encontrar este item durante uma missão específica.
items.quest.darkgold.name=minério de ouro escuro
items.quest.darkgold.you_now_have=Possui agora minério de ouro escuro %d.
items.quest.dwarftoken.desc=Muitos anões e algumas das suas criações maiores transportam estes pequenos pedaços de metal de propósito desconhecido. Talvez sejam jóias ou algum tipo de identificação. Os anões são um povo estranho.
items.quest.dwarftoken.discover_hint=Podes encontrar este item durante uma missão específica.
items.quest.dwarftoken.name=ficha de anão
items.quest.embers.desc=Brasas especiais que só podem ser recolhidas de elementais de fogo jovens. Irradiam energia térmica.
items.quest.embers.discover_hint=Podes encontrar este item durante uma missão específica.
items.quest.embers.name=brasas elementais
items.quest.escapecrystal.ac_use=USO
items.quest.escapecrystal.desc=Um fino cristal mágico que parece conter magia de teletransporte. Podes usar o cristal a qualquer momento para sair do cofre anão, mas não poderás levar nada contigo!
items.quest.escapecrystal.discover_hint=Podes encontrar este item durante uma missão específica.
items.quest.escapecrystal.name=cristal de escape
items.quest.gooblob.desc=Uma gosma gelatinosa, desprendida de Goo quando este morreu. É quase como uma grande bola de gelatina, embora não se atreva a comê-la. Ela não faz nada sozinha, mas pode ser útil quando combinada com certas poções ou uma bomba. No mínimo, deve converter-se numa quantidade razoável de energia.
items.quest.gooblob.discover_hint=Pode obter este item como recompensa ao derrotar certos inimigos.
items.quest.gooblob.name=bolha de gosma
items.quest.metalshard.desc=Um fragmento de metal amaldiçoado e enferrujado, que se desprendeu do DM-300 quando este foi destruído. É possível sentir uma magia maléfica inativa dentro dele. Não faz nada por si só, mas pode ser útil quando combinado com certos pergaminhos ou uma bomba. No mínimo, deve converter-se numa quantidade razoável de energia.
items.quest.metalshard.discover_hint=Pode obter este item como recompensa ao derrotar certos inimigos.
items.quest.metalshard.name=fragmento de metal amaldiçoado
items.quest.pickaxe.ability_desc=O Duelista pode perfurar um inimigo com uma picareta. O ataque acerta com certeza, aplica vulnerabilidade durante 3 turnos e causa dano de %1$d a %2$d a inimigos com pele rígida.
items.quest.pickaxe.ability_name=perfurar
items.quest.pickaxe.desc=Esta é uma ferramenta robusta e pesada para quebrar rochas. Não precisa de equipar a picareta para minerar com ela, mas provavelmente pode equipá-la como arma em caso de necessidade.
items.quest.pickaxe.discover_hint=Podes encontrar este item durante uma missão específica.
items.quest.pickaxe.name=picareta
items.quest.pickaxe.upgrade_ability_stat_name=Dano de Habilidade
items.quest.ratskull.desc=Um crânio de rato surpreendentemente grande. Seria um excelente troféu de caça, se tivesse uma parede para o pendurar.
items.quest.ratskull.name=crânio de rato gigante
items.remains.bowfragment.desc=Este fragmento de madeira partido fazia parte de um arco espiritual perdido de uma Caçadora. Pode ainda sentir um pouco de energia natural residual no fragmento; pode usá-lo para fazer crescer erva alta à sua volta. No entanto, fazer isto destruirá o fragmento.
items.remains.bowfragment.name=fragmento de arco
items.remains.brokenhilt.desc=Este cabo partido parece ter vindo da arma de um duelista derrotado. Ainda sente um pouco de poder marcial residual no cabo, que pode ser usado para causar um pequeno bónus de dano nos seus próximos dois golpes corpo a corpo. No entanto, fazer isto destruirá o cabo.
items.remains.brokenhilt.name=cabo quebrado
items.remains.brokenstaff.desc=Este bastão de mago foi partido ao meio após a morte do seu dono. Pode ainda sentir alguma energia mágica residual no bastão, que pode ser utilizada para dar um pequeno impulso de carga às suas varinhas. No entanto, fazer isso destruirá o bastão.
items.remains.brokenstaff.name=equipe quebrada
items.remains.cloakscrap.desc=Este pedaço de tecido translúcido parece ter vindo do manto das sombras de um Ladino falecido. Ainda se pode sentir um pouco de energia mística nele; pode usá-la para dar um pequeno impulso de carga aos seus artefactos. No entanto, fazer isso destruirá o tecido.
items.remains.cloakscrap.name=retalho de tecido
items.remains.remainsitem.ac_use=USO
items.remains.remainsitem.discover_hint=Podes encontrar este item nos restos mortais de um herói específico de uma missão anterior perdida.
items.remains.sealshard.desc=Estes minúsculos fragmentos de cera vermelha parecem ter vindo do selo de um guerreiro caído. Sente ainda um resquício de força de vontade ligado ao selo; pode usá-lo para se proteger um pouco. No entanto, fazer isto destruirá os fragmentos do selo.
items.remains.sealshard.name=fragmentos de selo
items.remains.tornpage.desc=Esta página parece ter sido arrancada de um tomo sagrado de um clérigo antigo. Ainda há um pouco de energia divina nela, que pode usar para recuperar alguma saúde. No entanto, fazer isto destruirá a página rasgada.
items.remains.tornpage.name=página rasgada
items.rings.ring.agate=anel de ágata
items.rings.ring.amethyst=anel de ametista
items.rings.ring.curse_known=É possível sentir uma magia malévola à espreita dentro deste anel.
items.rings.ring.cursed_worn=Como este anel está amaldiçoado, não tem poder para o remover.
