items.rings.ringofmight.combined_stats=Os anéis equipados por ti estão a combinar os teus poderes, aumentando a tua força em _%1$d_ e o teu HP máximo em _%2$s%%_ no total.
items.rings.ringofmight.desc=Este anel melhora os atributos físicos de quem o usa, concedendo-lhe maior força física e constituição. Um anel amaldiçoado enfraquecerá quem o usar.
items.rings.ringofmight.name=anel do poder
items.rings.ringofmight.stats=Quando utilizado, este anel aumentará a sua força em _%1$d_ e o seu HP máximo em _%2$s%%_.
items.rings.ringofmight.typical_stats=Quando utilizado, este anel irá normalmente aumentar a sua força em _%1$d_ e o seu HP máximo em _%2$s%%_.
items.rings.ringofmight.upgrade_stat_name_1=aumento da força
items.rings.ringofmight.upgrade_stat_name_2=Aumento máximo de HP
items.rings.ringofsharpshooting.combined_stats=Os anéis equipados por si estão a combinar os seus poderes, aumentando o nível efetivo de lançamento de armas em _%1$d_ e aumentando a sua durabilidade em _%2$s%%_ no total.
items.rings.ringofsharpshooting.desc=Este anel melhora a precisão e a mira do utilizador, tornando todas as armas de projéteis mais poderosas e duráveis. Um anel amaldiçoado terá o efeito oposto.
items.rings.ringofsharpshooting.name=anel de atiradores de elite
items.rings.ringofsharpshooting.stats=Ao ser utilizado, este anel aumentará o dano das suas armas de arremesso como se o nível das mesmas tivesse sido aumentado em _%1$d_, e aumentará a sua durabilidade em _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Quando utilizado, este anel irá normalmente aumentar o dano das suas armas de arremesso como se o nível das mesmas tivesse sido aumentado em _%1$d_ e aumentará a sua durabilidade em _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Aumento de dano de nível
items.rings.ringofsharpshooting.upgrade_stat_name_2=Aumento da durabilidade
items.rings.ringoftenacity.combined_stats=Os anéis equipados por ti estão a combinar os teus poderes, reduzindo o dano recebido até _%s%%_ no total.
items.rings.ringoftenacity.desc=Quando utilizado, este anel permitirá ao portador resistir a golpes normalmente mortais. Quanto mais ferido estiver o utilizador, mais resistente será a danos. Um anel amaldiçoado, por outro lado, facilitará a execução do portador pelos inimigos.
items.rings.ringoftenacity.name=anel de tenacidade
items.rings.ringoftenacity.stats=Quando utilizado, este anel reduzirá os danos que sofre até _%s%%._
items.rings.ringoftenacity.typical_stats=Quando utilizado, este anel reduz normalmente o dano sofrido até _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Resistência máxima a danos
items.rings.ringofwealth.combined_stats=Os anéis que equipou estão a combinar os seus poderes, aumentando a sua sorte num total de _%s%%_.
items.rings.ringofwealth.desc=Este anel atua como um íman para tesouros, aumentando a probabilidade de os inimigos e contentores conterem itens valiosos. Um anel amaldiçoado, por outro lado, reduzirá as suas hipóteses de obter itens.
items.rings.ringofwealth.name=anel da riqueza
