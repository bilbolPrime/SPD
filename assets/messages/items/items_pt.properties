items.weapon.melee.shortsword.name=espada curta
items.weapon.melee.shortsword.typical_ability_desc=O Duelista pode _golpear_ um inimigo com uma espada curta. Normalmente, isto causa _%1$d-%2$d de dano_ e tem acerto garantido. Se o golpe matar um inimigo, a morte é instantânea e o Duelista pode voltar a utilizar o golpe dentro de 5 turnos gratuitamente.
