items.weapon.melee.flail$spinabilitytracker.desc=A Duelista está a rodar o seu mangual, acumulando dano para o seu próximo ataque normal. Cada jogada consome um turno, mas aumenta o dano, até um máximo de três jogadas. O mangual também tem a garantia de acertar enquanto gira. Rotações atuais: %1$d%%.\n Rotações restantes: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=fiação
items.weapon.melee.flail.ability_desc=O Duelista pode rodar um mangual para acumular poder durante um curto período. A cada turno em que o mangual é rodado, causará +%d de dano no seu próximo ataque normal, até um máximo de 3 vezes. Um mangual rotativo também garante o acerto. Apenas iniciar a rotação do mangual consome uma carga.
items.weapon.melee.flail.ability_name=rodar
items.weapon.melee.flail.desc=Uma bola com picos presa a um cabo por uma corrente. Muito difícil de manusear, mas devastadora se acertar em cheio.
