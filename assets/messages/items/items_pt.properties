items.potions.exotic.exoticpotion.indigo=poção exótica índigo
items.potions.exotic.exoticpotion.ivory=poção de marfim exótico
items.potions.exotic.exoticpotion.jade=poção de jade exótica
items.potions.exotic.exoticpotion.magenta=poção magenta exótica
items.potions.exotic.exoticpotion.no=Não, mudei de ideias.
items.potions.exotic.exoticpotion.silver=poção de prata exótica
items.potions.exotic.exoticpotion.turquoise=poção turquesa exótica
items.potions.exotic.exoticpotion.unknown_desc=Este frasco redondo contém um líquido granulado e colorido. Parece ser algo estranho a esta terra; quem sabe o que poderá acontecer se for bebido ou atirado?
items.potions.exotic.exoticpotion.warning=Deseja mesmo cancelar o uso desta poção? Ela será consumida de qualquer maneira.
items.potions.exotic.exoticpotion.yes=Sim, tenho a certeza.
items.potions.exotic.potionofcleansing$cleanse.desc=Esta personagem é temporariamente imune a todos os efeitos negativos de estado!\n\nTurnos restantes: %s.
items.potions.exotic.potionofcleansing$cleanse.name=purificado
items.potions.exotic.potionofcleansing.desc=Este poderoso reagente tornará o utilizador imune a todos os efeitos negativos durante alguns turnos após ser ingerido. Também pode ser atirado a um alvo para o purificar.
items.potions.exotic.potionofcleansing.name=poção de limpeza
items.potions.exotic.potionofcorrosivegas.desc=Ao abrir ou partir este recipiente de vidro pressurizado, o seu conteúdo explodirá numa nuvem mortal de gás corrosivo cor de ferrugem. O gás propaga-se mais rapidamente do que os gases tóxicos e é mais letal, mas também não dura tanto tempo.
items.potions.exotic.potionofcorrosivegas.name=poção de gás corrosivo
items.potions.exotic.potionofdivineinspiration.bonus=+2 Pontos de Talento!
items.potions.exotic.potionofdivineinspiration.desc=O poder da energia sagrada reduzido à forma líquida, esta poção imbuirá o bebedor com poder divino, concedendo-lhe dois pontos de talento bónus num nível à sua escolha. Esta poção só pode ser utilizada uma vez por cada nível de talento.
items.potions.exotic.potionofdivineinspiration.name=poção de inspiração divina
items.potions.exotic.potionofdivineinspiration.no_more_points=Não pode ganhar mais pontos de talento bónus.
items.potions.exotic.potionofdivineinspiration.select_tier=Selecione um nível de talento para ganhar dois pontos de bónus. Precisas de ter desbloqueado o nível para poderes gastar os pontos.
items.potions.exotic.potionofdragonsbreath.desc=Este frasco contém um composto invulgar que entra em combustão logo após se misturar com a saliva. Cuspir o líquido rapidamente permitirá ao utilizador expelir chamas pela boca!
items.potions.exotic.potionofdragonsbreath.name=poção do hálito do dragão
items.potions.exotic.potionofdragonsbreath.prompt=Escolha um local para queimar
items.potions.exotic.potionofearthenarmor.desc=Em vez de paralisar, este líquido tem um efeito endurecedor na pele, transformando-a numa armadura natural temporária.
items.potions.exotic.potionofearthenarmor.name=poção de armadura de terra
items.potions.exotic.potionofmagicalsight.desc=Após beber isto, os seus sentidos serão brevemente aguçados para níveis incríveis, permitindo-lhe ver através de paredes num raio de 12 quadrados!
items.potions.exotic.potionofmagicalsight.name=poção da visão mágica
items.potions.exotic.potionofmastery.armor_easier=A sua armadura ficará mais fácil de vestir!
items.potions.exotic.potionofmastery.desc=Em vez de conceder força bruta, esta poção irá sintonizar os músculos do utilizador com um item específico. Isto tornará o item mais fácil de utilizar, como se o utilizador tivesse praticado com ele e desenvolvido memória muscular. A arma ou armadura escolhida exigirá menos 2 pontos de força para ser utilizada. Esta poção só pode ser utilizada uma vez em cada item.
items.potions.exotic.potionofmastery.name=poção da mestria
items.potions.exotic.potionofmastery.prompt=Domine um item
items.potions.exotic.potionofmastery.weapon_easier=A sua arma ficará mais fácil de manejar!
items.potions.exotic.potionofshielding.desc=Em vez de curar, esta poção irá projetar um escudo resistente em torno do corpo do utilizador, bloqueando uma quantidade considerável de dano.
items.potions.exotic.potionofshielding.name=poção de proteção
items.potions.exotic.potionofshroudingfog.desc=Quando exposto ao ar, o líquido deste frasco produzirá uma densa névoa fumada que se espalhará rapidamente e bloqueará a visão dos seus inimigos.
items.potions.exotic.potionofshroudingfog.name=poção de névoa envolvente
items.potions.exotic.potionofsnapfreeze.desc=A substância química contida nesta poção irá reagir rapidamente com o ar, congelando e imobilizando instantaneamente tudo o que se encontra dentro da sua área de efeito.
items.potions.exotic.potionofsnapfreeze.name=poção de congelação instantânea
items.potions.exotic.potionofstamina.desc=Ingerir este líquido estranhamente doce proporcionar-lhe-á um aumento de energia duradouro, permitindo-lhe correr a um ritmo acelerado durante um período prolongado.
items.potions.exotic.potionofstamina.name=poção de resistência
items.potions.exotic.potionofstormclouds.desc=Ao lançar esta poção, será criada uma nuvem de vapor concentrado que se espalhará rapidamente, condensando-se e espalhando-se pelo ambiente. A maior parte do terreno será transformada em água, os inimigos de fogo sofrerão danos, o fogo será extinto e as armadilhas serão sobrecarregadas e destruídas.
items.potions.exotic.potionofstormclouds.name=poção de nuvens de tempestade
items.potions.potion$placeholder.name=poção
items.potions.potion$seedtopotion.name=Poção Aleatória
