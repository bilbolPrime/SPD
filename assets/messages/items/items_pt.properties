items.artifacts.lloydsbeacon.ac_zap=ZAP
items.artifacts.lloydsbeacon.creatures=A aura psíquica das criaturas vizinhas impede o uso do farol de Lloyd neste momento.
items.artifacts.lloydsbeacon.desc=O farol de Lloyd é um complexo dispositivo mágico que concede ao utilizador o controlo das magias de teletransporte. O farol pode ser utilizado para regressar a um local predefinido, mas também pode expelir rajadas de magia de teletransporte aleatórias após ser carregado quando equipado. Esta magia pode ser dirigida a um alvo ou ao próprio utilizador.
items.artifacts.lloydsbeacon.desc_set=Este sinalizador foi posicionado algures no nível %d da Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=O seu farol está ficando mais forte!
items.artifacts.lloydsbeacon.name=farol de Lloyd
items.artifacts.lloydsbeacon.no_charge=O seu sinalizador não tem energia suficiente no momento.
items.artifacts.lloydsbeacon.preventing=A forte aura mágica deste lugar impede-te de usar o farol de Lloyd!
items.artifacts.lloydsbeacon.prompt=Escolha um local para eletrocutar.
items.artifacts.lloydsbeacon.return=O sinalizador Lloyd's foi configurado com sucesso na sua localização atual. Agora pode regressar aqui a qualquer momento.
items.artifacts.lloydsbeacon.tele_fail=A magia de teletransporte falha.
items.artifacts.masterthievesarmband.ac_steal=ROUBAR
items.artifacts.masterthievesarmband.cursed=Não pode usar uma braçadeira amaldiçoada.
items.artifacts.masterthievesarmband.desc=Esta braçadeira de veludo roxo tem a marca de um mestre ladrão. Ela não lhe pertence, mas provavelmente também não pertencia ao seu último dono.
items.artifacts.masterthievesarmband.desc_cursed=A maldita braçadeira está presa ao seu pulso e, de alguma forma, a sua bolsa de ouro parece estar a ficar cada vez mais leve...
items.artifacts.masterthievesarmband.desc_worn=Sente o poder acumular-se na braçadeira no seu pulso à medida que ganha experiência. Podes usar este poder para roubar lojas ou assaltar inimigos! Assaltar inimigos acontece instantaneamente, desorienta-os brevemente e dá-lhe a hipótese de apanhar qualquer saque que tenham! Este poder é mais eficaz contra inimigos desatentos. Assaltar o mesmo inimigo várias vezes não aumenta as suas hipóteses de obter loot.
items.artifacts.masterthievesarmband.failed_steal=Não conseguiu roubar nada.
items.artifacts.masterthievesarmband.full=A sua pulseira está totalmente carregada!
items.artifacts.masterthievesarmband.level_up=A sua braçadeira está a ficar mais forte!
items.artifacts.masterthievesarmband.name=braçadeira de mestre ladrão
items.artifacts.masterthievesarmband.no_charge=A sua pulseira não tem carga suficiente.
items.artifacts.masterthievesarmband.no_steal=Este inimigo não tem nada para roubar.
items.artifacts.masterthievesarmband.no_target=Deve escolher como alvo um inimigo que esteja adjacente a si.
items.artifacts.masterthievesarmband.prompt=Escolha um inimigo para alvejar.
items.artifacts.masterthievesarmband.steal_shopkeeper=Não pode roubar diretamente dos lojistas.
items.artifacts.masterthievesarmband.stole_item=Roubou um item: %s.
items.artifacts.sandalsofnature.absorb_seed=O calçado absorve as sementes, parecem mais saudáveis.
items.artifacts.sandalsofnature.ac_feed=ALIMENTAR
items.artifacts.sandalsofnature.ac_root=RAIZ
items.artifacts.sandalsofnature.desc_1=O que inicialmente parecem ser sandálias feitas de cordel são, na verdade, duas plantas! Parecem muito fracas e pálidas, talvez precisem de nutrientes?
items.artifacts.sandalsofnature.desc_2=O calçado cresceu e assemelha-se agora mais a dois sapatos de alfaiataria. Parte da cor regressou a eles; talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_3=As plantas voltaram a crescer e assemelham-se agora a um par de botas robustas feitas de casca de árvore. Parecem ter recuperado as suas forças, mas talvez ainda possam crescer mais?
items.artifacts.sandalsofnature.desc_4=As plantas parecem ter atingido o seu tamanho máximo, assemelhando-se a um par de caneleiras blindadas. As caneleiras são de um castanho escuro e fazem lembrar uma árvore muito robusta.
items.artifacts.sandalsofnature.desc_ability=O calçado ondula com a cor da última semente que usou. Pode criar raízes brevemente no solo e produzir o efeito dessa planta em qualquer lugar num raio de 3 quadrados. \nSemente: _%s_\nCarga necessária: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=As sandálias amaldiçoadas estão a bloquear qualquer sintonia com a natureza.
items.artifacts.sandalsofnature.desc_hint=Sente-se mais em sintonia com a natureza ao usar este artefacto.
items.artifacts.sandalsofnature.desc_seeds=Alimentou o calçado com sementes %d.
items.artifacts.sandalsofnature.levelup=Os seus calçados aumentaram de tamanho!
items.artifacts.sandalsofnature.low_charge=O seu calçado não tem energia suficiente para isso.
