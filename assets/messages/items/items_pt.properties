items.weapon.melee.greataxe.ability_desc=A Duelista pode realizar um ataque de _retaliação_ com um machado grande se a sua vida estiver abaixo de 50%%. Este ataque devastador causa _%1$d-%2$d de dano_, tem acerto garantido e é instantâneo se matar um inimigo.
