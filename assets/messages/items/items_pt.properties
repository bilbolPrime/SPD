items.weapon.melee.sword.ability_desc=O Duelista pode _golpear_ um inimigo com uma espada. Isto causa _%1$d-%2$d de dano_ e tem acerto garantido. Se o golpe matar um inimigo, a morte é instantânea e o Duelista pode voltar a utilizar o golpe dentro de 5 turnos gratuitamente.
items.weapon.melee.sword.ability_name=clivar
