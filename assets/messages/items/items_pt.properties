items.scrolls.exotic.exoticscroll.raido=pergaminho exótico de RAIDO
items.scrolls.exotic.exoticscroll.sowilo=pergaminho exótico de SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=pergaminho exótico de TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Uma runa mágica brilhante e indecifrável está escrita neste pergaminho negro. Parece ser de outro mundo; quem sabe o que acontecerá quando for lida em voz alta?
items.scrolls.exotic.exoticscroll.yngvi=pergaminho exótico de YNGVI
items.scrolls.exotic.scrollofantimagic.desc=O encantamento neste pergaminho irá envolvê-lo com uma aura mágica que bloqueia temporariamente todos os efeitos mágicos, sejam eles prejudiciais ou benéficos. Isto inclui a maioria dos efeitos de itens mágicos, como varinhas, pergaminhos, anéis, artefactos, encantamentos e maldições. No entanto, as habilidades da armadura heroica são suficientemente fortes para funcionar independentemente disso.
items.scrolls.exotic.scrollofantimagic.name=pergaminho de antimagia
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Uma arena mágica surgiu à sua volta, indicada por uma densa névoa vermelha. Enquanto estiver na névoa, a sua fome não aumentará e receberá 33%% menos dano de todas as fontes. Se tiver outras fontes de redução de dano (como armadura), estas serão aplicadas após a redução de 33%%. Turnos restantes: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=arena de desafio
items.scrolls.exotic.scrollofchallenge.desc=Ao ser lido em voz alta, este pergaminho irá libertar um grande rugido que atrairá os inimigos para o utilizador, criando simultaneamente uma pequena arena à sua volta. Enquanto o leitor permanecer nesta arena, receberá menos 33% de dano de todas as fontes (isto é aplicado antes de outras formas de redução de dano) e não perderá a saciedade. O tamanho da arena será proporcional ao tamanho da área em que o leitor se encontra. Será particularmente pequena em algumas áreas de bosses.
items.scrolls.exotic.scrollofchallenge.name=pergaminho de desafio
items.scrolls.exotic.scrollofdivination$wnddivination.desc=O seu pergaminho de adivinhação identificou os seguintes itens:
items.scrolls.exotic.scrollofdivination.desc=Este pergaminho identificará aleatoriamente quatro tipos de itens que desconhece. Os tipos identificados podem ser a cor de uma poção, a runa de um pergaminho ou a gema de um anel. Os artigos identificados não serão necessariamente artigos que esteja a transportar.
items.scrolls.exotic.scrollofdivination.name=pergaminho de adivinhação
items.scrolls.exotic.scrollofdivination.nothing_left=Não há mais nada a identificar!
items.scrolls.exotic.scrollofdread.desc=Ao ser lido, este pergaminho emitirá um clarão de luz vermelha que instilará um terror incrível em todos os inimigos no seu campo de visão. Tão grande é o efeito que tentarão fugir rapidamente de toda a masmorra, para nunca mais serem vistos! Tal como o terror, este efeito pode expirar com o tempo ou se o inimigo for atacado. Os inimigos com uma vontade forte, como os chefes, serão afetados pelo terror comum.
items.scrolls.exotic.scrollofdread.name=pergaminho do terror
items.scrolls.exotic.scrollofenchantment.armor=Selecione um glifo para aplicar à sua armadura.
items.scrolls.exotic.scrollofenchantment.cancel=Cancelar
items.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelar ainda consumirá o seu pergaminho de encantamento, tem a certeza?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Não, mudei de ideias.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Sim, tenho a certeza.
items.scrolls.exotic.scrollofenchantment.desc=Este pergaminho irá imprimir a uma arma ou armadura uma poderosa energia mágica. O leitor terá até certo ponto de controlo sobre qual a magia que será imbuída.
items.scrolls.exotic.scrollofenchantment.inv_title=Encantar um item
items.scrolls.exotic.scrollofenchantment.name=pergaminho de encantamento
items.scrolls.exotic.scrollofenchantment.weapon=Selecione um encantamento para aplicar à sua arma.
items.scrolls.exotic.scrollofforesight.desc=Após a leitura deste pergaminho, os detalhes do terreno próximo serão constantemente transmitidos à mente do leitor com uma clareza cristalina. Este efeito dura um período considerável e revelará todas as portas ou armadilhas ocultas, tornando a busca desnecessária.
items.scrolls.exotic.scrollofforesight.name=pergaminho da previsão
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelar ainda consumirá o seu pergaminho de metamorfose, tem a certeza?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Escolha um talento para se transformar.
items.scrolls.exotic.scrollofmetamorphosis.desc=Este pergaminho contém uma poderosa magia de transmutação, que se aplicará ao conjurador em vez de a um item. A magia deste pergaminho permitir-lhe-á selecionar um talento e substituí-lo por um de cinco talentos do mesmo nível de diferentes classes de herói! Este efeito só pode ser aplicado a talentos de classe, e não a talentos obtidos por subclasses ou habilidades de armadura. Os talentos que não pode usar não serão oferecidos como opções.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=talento de metamorfose
items.scrolls.exotic.scrollofmetamorphosis.name=pergaminho da metamorfose
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Escolha um novo talento para substituir o talento em que se transformou.
items.scrolls.exotic.scrollofmysticalenergy.desc=O poder mágico bruto contido neste pergaminho, quando libertado, carregará os artefactos equipados pelo utilizador ao longo do tempo.
items.scrolls.exotic.scrollofmysticalenergy.name=pergaminho de energia mística
items.scrolls.exotic.scrollofpassage.desc=O feitiço deste pergaminho transporta instantaneamente o leitor para a região mais próxima, no primeiro piso acima. Muito útil para chegar rapidamente a uma loja.
items.scrolls.exotic.scrollofpassage.name=pergaminho de passagem
items.scrolls.exotic.scrollofprismaticimage.desc=O encantamento neste pergaminho criará um gémeo ilusório e colorido do leitor. Esta imagem prismática age como um clone mais fraco do leitor, com uma defesa semelhante, mas com menos pontos de vida e dano. A imagem prismática revelar-se-á quando houver inimigos presentes e tentará defender o leitor. Se já existir uma imagem prismática, a utilização deste pergaminho irá curá-la completamente.
items.scrolls.exotic.scrollofprismaticimage.name=pergaminho de imagem prismática
items.scrolls.exotic.scrollofpsionicblast.desc=Este pergaminho contém uma energia destrutiva incrível que pode ser canalizada para destruir as mentes de todas as criaturas visíveis. Há, no entanto, um efeito secundário significativo, e o leitor também sofrerá danos, ficará cego e enfraquecido. Quanto mais alvos o pergaminho atingir, menor será o dano sofrido pelo leitor.
items.scrolls.exotic.scrollofpsionicblast.name=pergaminho de explosão psíquica
items.scrolls.exotic.scrollofpsionicblast.ondeath=A Explosão Psiónica despedaça a sua mente...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Esta criatura foi enfeitiçada pela magia de um pergaminho com o canto de uma sereia. Um personagem enfeitiçado torna-se permanentemente seu aliado e lutará contra qualquer inimigo que encontrar.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=fascinado
items.scrolls.exotic.scrollofsirenssong.cancel=Deve escolher um alvo.
items.scrolls.exotic.scrollofsirenssong.desc=A leitura deste pergaminho emite uma melodia sedutora que enfeitiçará o inimigo alvo, transformando-o permanentemente num aliado! Outros inimigos que a ouvirem ficarão temporariamente encantados. Os inimigos particularmente fortes podem resistir ao efeito de encantamento e serão enfeitiçados em vez disso.
items.scrolls.exotic.scrollofsirenssong.name=pergaminho da canção da sereia
items.scrolls.exotic.scrollofsirenssong.no_target=O pergaminho ativa-se sem um alvo.
items.scrolls.exotic.scrollofsirenssong.prompt=Escolha um alvo
items.scrolls.inventoryscroll.no=Não, mudei de ideias.
items.scrolls.inventoryscroll.warning=Tem mesmo vontade de cancelar esta utilização de scroll? A rolagem não foi identificada anteriormente, pelo que será consumida de qualquer forma.
items.scrolls.inventoryscroll.yes=Sim, tenho a certeza.
items.scrolls.scroll$placeholder.name=rolagem
items.scrolls.scroll.ac_read=LER
items.scrolls.scroll.berkanan=pergaminho de BERKANAN
items.scrolls.scroll.blinded=Não é possível ler um pergaminho estando cego.
items.scrolls.scroll.cursed=O seu livro de feitiços amaldiçoado impede-o de invocar a magia deste pergaminho! Um pergaminho de remover maldição talvez seja forte o suficiente para ainda funcionar...
items.scrolls.scroll.gyfu=pergaminho de GYFU
items.scrolls.scroll.isaz=pergaminho de ISAZ
items.scrolls.scroll.kaunan=pergaminho de KAUNAN
items.scrolls.scroll.laguz=pergaminho de LAGUZ
items.scrolls.scroll.mannaz=pergaminho de MANNAZ
items.scrolls.scroll.naudiz=pergaminho de NAUDIZ
items.scrolls.scroll.no_magic=Não pode ler um pergaminho enquanto for imune à magia.
items.scrolls.scroll.odal=pergaminho de ODAL
items.scrolls.scroll.raido=pergaminho de RAIDO
items.scrolls.scroll.sowilo=pergaminho de SOWILO
items.scrolls.scroll.tiwaz=pergaminho de TIWAZ
items.scrolls.scroll.unknown_desc=Este pergaminho está coberto de escrita indecifrável e traz a runa %s como título. Quem sabe o que acontecerá se for lido em voz alta?
items.scrolls.scroll.yngvi=pergaminho de YNGVI
items.scrolls.scrollofidentify.desc=Revela permanentemente todos os segredos de um único item.
items.scrolls.scrollofidentify.inv_title=Identifique um item
items.scrolls.scrollofidentify.it_is=O seu artigo foi identificado: %s.
items.scrolls.scrollofidentify.name=pergaminho de identificação
items.scrolls.scrolloflullaby.desc=Uma melodia suave fará com que todas as criaturas no seu campo de visão caiam num sono profundo, dando-lhe a hipótese de fugir ou desferir um ataque surpresa.
items.scrolls.scrolloflullaby.name=pergaminho de canção de embalar
items.scrolls.scrolloflullaby.sooth=O pergaminho emite uma melodia suave. Sente muito sono.
items.scrolls.scrollofmagicmapping.desc=Ao ler este pergaminho, uma imagem de uma clareza cristalina ficará gravada na sua memória, revelando o layout preciso do nível e todos os segredos escondidos. A localização dos itens e das criaturas permanecerá desconhecida.
items.scrolls.scrollofmagicmapping.layout=Agora já conhece o layout do nível.
items.scrolls.scrollofmagicmapping.name=pergaminho de mapeamento mágico
items.scrolls.scrollofmirrorimage.copies=O pergaminho forma imagens espelhadas de si.
items.scrolls.scrollofmirrorimage.desc=O encantamento neste pergaminho criará gémeos ilusórios do leitor, que perseguirão os seus inimigos.
items.scrolls.scrollofmirrorimage.name=pergaminho de imagem espelhada
items.scrolls.scrollofmirrorimage.no_copies=O pergaminho tenta criar imagens espelhadas suas, mas estas não têm para onde ir.
items.scrolls.scrollofrage.desc=Ao ser lido em voz alta, este pergaminho libertará um grande rugido que atrairá todos os inimigos para o leitor e enfurecerá os que estiverem por perto.
items.scrolls.scrollofrage.name=pergaminho de fúria
items.scrolls.scrollofrage.roar=O pergaminho emite um rugido ensurdecedor que ecoa por toda a masmorra!
items.scrolls.scrollofrecharging.desc=O poder mágico em bruto contido neste pergaminho, quando libertado, recarregará todas as varinhas do leitor até ao seu poder máximo.
items.scrolls.scrollofrecharging.name=pergaminho de recarga
items.scrolls.scrollofrecharging.surge=Uma onda de energia percorre o seu corpo, revigorando as suas varinhas!
items.scrolls.scrollofremovecurse.cleansed=O seu objeto irradia uma luz purificadora, e a energia malévola dispersa-se!
items.scrolls.scrollofremovecurse.desc=O encantamento contido neste pergaminho removerá instantaneamente da arma, armadura, anéis e itens transportados pelo leitor quaisquer encantamentos malignos que possam impedi-lo de os remover.
items.scrolls.scrollofremovecurse.inv_title=Limpe um item
items.scrolls.scrollofremovecurse.name=pergaminho de remover maldição
items.scrolls.scrollofremovecurse.not_cleansed=O seu objeto emite uma luz purificadora, mas nada acontece.
items.scrolls.scrollofremovecurse.spirit=O seu pergaminho liberta o espírito atormentado!
items.scrolls.scrollofretribution.blast=Uma poderosa energia mágica irrompe do pergaminho!
items.scrolls.scrollofretribution.desc=Este pergaminho contém energia destrutiva que canaliza o sofrimento do leitor para o exterior, transformando-o numa explosão de poder. Quanto mais fraco estiver o leitor, mais danos causará. Com pouca vida, este pergaminho pode matar a maioria dos inimigos instantaneamente. O uso do pergaminho, no entanto, cobra um preço ao utilizador, cegando-o e enfraquecendo-o.
items.scrolls.scrollofretribution.name=pergaminho da retribuição
items.scrolls.scrollofteleportation.cant_reach=Não se pode teletransportar para lá.
items.scrolls.scrollofteleportation.desc=O feitiço neste pergaminho transporta instantaneamente o leitor para um local aleatório no nível da masmorra. Pode ser utilizado para escapar a uma situação perigosa, mas o leitor azarado pode encontrar-se num lugar ainda mais perigoso.
items.scrolls.scrollofteleportation.name=pergaminho de teletransporte
items.scrolls.scrollofteleportation.no_tele=A magia de teletransporte falha.
items.scrolls.scrollofteleportation.prompt=Escolha um local para se teletransportar.
items.scrolls.scrollofteleportation.tele=Num ápice, foste teletransportado para outro local da fase.
items.scrolls.scrollofterror.desc=Um clarão de luz vermelha aterrorizará todas as criaturas no seu campo de visão, fazendo-as fugir. Atacar um inimigo em fuga dissipará o efeito.
items.scrolls.scrollofterror.many=O pergaminho emite um brilho intenso de luz vermelha e os monstros fogem!
items.scrolls.scrollofterror.name=pergaminho do terror
items.scrolls.scrollofterror.none=O pergaminho emite um brilho intenso de luz vermelha.
items.scrolls.scrollofterror.one=O pergaminho emite um brilho intenso de luz vermelha e o %s foge!
items.scrolls.scrolloftransmutation.desc=Este pergaminho contém uma poderosa magia de transmutação. Quando utilizado num item elegível, irá transformá-lo num item diferente do mesmo tipo. A magia preservará até mesmo melhorias, encantamentos e glifos. Os pergaminhos e as poções serão transmutados nos seus equivalentes exóticos e vice-versa.
items.scrolls.scrolloftransmutation.inv_title=Transmutar um item
items.scrolls.scrolloftransmutation.morph=O seu objeto transforma-se em algo diferente!
items.scrolls.scrolloftransmutation.name=pergaminho de transmutação
items.scrolls.scrolloftransmutation.nothing=Nada de interessante acontece.
items.scrolls.scrollofupgrade.desc=Este pergaminho irá melhorar um único item, melhorando a sua qualidade. Uma varinha terá o seu poder e número de cargas aumentados; uma arma causará mais dano ou atingirá o alvo com mais frequência; uma armadura desviará golpes adicionais; o efeito de um anel sobre o seu utilizador será intensificado. As armas e armaduras também exigirão menos força para serem utilizadas, e quaisquer maldições sobre o item serão removidas.
items.scrolls.scrollofupgrade.inv_title=Melhore um item
items.scrolls.scrollofupgrade.name=pergaminho de melhoria
items.scrolls.scrollofupgrade.remove_curse=O pergaminho de melhoramento remove a maldição do teu item!
items.scrolls.scrollofupgrade.weaken_curse=O pergaminho de melhoramento enfraquece a maldição do seu item.
items.spells.alchemize$wndalchemizeitem.energize=Transforme em energia %d
items.spells.alchemize$wndalchemizeitem.energize_1=Transforme 1 em energia %d
items.spells.alchemize$wndalchemizeitem.energize_all=Transforme tudo em energia %d
items.spells.alchemize$wndalchemizeitem.sell=Transforme em %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Transforme 1 em %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Converter tudo para %dg
items.spells.alchemize.desc=Este feitiço contém poderes transmutativos semelhantes aos que se encontram num caldeirão de alquimia. Cada conjuração permite ao utilizador transformar um item (ou conjunto de itens) em ouro ou energia alquímica. Transformar poções ou pergaminhos em energia até os identificará! Alguns usos de Alquimia são vendidos em lojas, mas muitos mais podem ser criados usando alquimia, combinando uma semente, uma runa e um pouco de energia alquímica.
items.spells.alchemize.name=alquimizar
items.spells.alchemize.prompt=Alquimizar um item
items.spells.beaconofreturning.creatures=A aura psíquica das criaturas vizinhas não te permite teletransportar-te neste momento.
items.spells.beaconofreturning.desc=Este feitiço complexo concede ao utilizador a capacidade de regressar a um local predefinido, independentemente da distância. O feitiço só será consumido quando regressar, podendo ser conjurado as vezes que desejar, mas apenas se lembrará do último local para o qual foi conjurado.
items.spells.beaconofreturning.desc_set=Este farol foi posicionado algures no piso %d.
items.spells.beaconofreturning.name=farol do retorno
items.spells.beaconofreturning.preventing=A forte aura mágica deste lugar impede-te de usar o feitiço!
items.spells.beaconofreturning.set=O sinalizador foi posicionado na sua localização atual.
items.spells.beaconofreturning.wnd_body=A configuração irá substituir a localização para a qual o farol foi definido anteriormente. \n\nRetornar fará com que voltes para a última localização definida e consumirá um uso do feitiço.
items.spells.beaconofreturning.wnd_return=DEVOLVER
items.spells.beaconofreturning.wnd_set=CONJUNTO
items.spells.curseinfusion.desc=Esta magia infunde um equipamento com a mesma poderosa magia maléfica presente em DM-300. O item em que for utilizada será imediatamente amaldiçoado, e qualquer encantamento ou glifo que possua será anulado. No caso de armas, armaduras e varinhas, o item receberá melhorias para além de ser amaldiçoado. As melhorias da infusão de maldição não se acumulam e são perdidas se o item for desamaldiçoado. As infusões de maldição múltiplas também podem ser utilizadas para alterar a maldição de uma arma ou armadura.
items.spells.curseinfusion.inv_title=Amaldiçoar um item
items.spells.curseinfusion.name=infusão de maldição
items.spells.magicalinfusion.desc=Este feitiço possui o mesmo poder mágico que um pergaminho de melhoramento, mas de forma mais estável. Para além de melhorar um item normalmente, nunca apagará um encantamento, glifo ou maldição.
items.spells.magicalinfusion.infuse=O seu item está imbuído de energia arcana!
items.spells.magicalinfusion.inv_title=Infundir um item
items.spells.magicalinfusion.name=infusão mágica
items.spells.magicalporter.desc=Este feitiço transportará magicamente qualquer item em que for lançado. Ao contrário do farol de um mercador, no entanto, os itens serão transportados para a entrada do próximo piso do boss.
items.spells.magicalporter.inv_title=Transportar um artigo
items.spells.magicalporter.name=porteiro mágico
items.spells.magicalporter.nowhere=Não há nenhum lugar para onde possa enviar um artigo.
items.spells.phaseshift.desc=Este feitiço caótico teletransportará qualquer personagem alvo para um local aleatório no piso atual e atordoá-lo-á durante um período considerável. Os inimigos poderosos serão capazes de resistir ao efeito de atordoamento. Este feitiço pode ser dirigido a um alvo ou ao próprio utilizador.
items.spells.phaseshift.name=Deslocamento de fase
items.spells.phaseshift.no_target=Não há nada para se teletransportar ali.
items.spells.reclaimtrap.desc=Esta magia contém resquícios da energia mecânica de DM-300. Quando conjurada sobre uma armadilha ativa, o poder da armadilha irá ligar-se a si, permitindo-lhe utilizar novamente a magia para expelir esse poder e ativar o efeito da armadilha em qualquer local que desejar. No entanto, algumas armadilhas podem não funcionar em todo o lado, e apenas uma armadilha pode ser armazenada de cada vez.
items.spells.reclaimtrap.desc_trap=O feitiço está pronto para activar um _%s._
items.spells.reclaimtrap.name=armadilha de recuperação
items.spells.reclaimtrap.no_trap=Não há ali nenhuma armadilha.
items.spells.recycle.desc=Este feitiço contém uma forma inferior de magia de transmutação. Embora não funcione em equipamento, transformará um pergaminho, poção, semente, runa ou dardo com ponta num item aleatório do mesmo tipo.
items.spells.recycle.inv_title=Recicle um item
items.spells.recycle.name=reciclar
items.spells.recycle.recycled=O seu artigo foi reciclado em: %s.
items.spells.spell.ac_cast=ELENCO
items.spells.spell.discover_hint=Podes criar este item através da alquimia.
items.spells.spell.no_magic=Não pode lançar feitiços enquanto for imune à magia.
items.spells.summonelemental.ac_imbue=IMPURRAR
items.spells.summonelemental.desc=Este feitiço canaliza a energia das brasas elementais utilizadas para o criar e permite-te invocar um elemental aliado para lutar ao teu lado! Apenas um elemental pode ser invocado de cada vez, mas o feitiço pode ser conjurado novamente para trazer o elemental de volta sem qualquer custo.
items.spells.summonelemental.desc_chaos=O feitiço está atualmente a irradiar energia caótica e invocará um elemental do caos. Pode imbuir um item diferente, mas o feitiço perderá a sua imbução atual.
items.spells.summonelemental.desc_fire=O feitiço está quente ao toque e invocará um elemental de fogo. Pode imbuir um item diferente, mas o feitiço perderá a sua imbução atual.
items.spells.summonelemental.desc_frost=O feitiço está frio ao toque e invocará um elemental de gelo. Pode imbuir um item diferente, mas o feitiço perderá o seu efeito atual.
items.spells.summonelemental.desc_newborn=O feitiço está atualmente sem imbuimento e invocará um elemental recém-nascido sem ataque à distância. Podes imbuir uma poção de chama líquida, poção de gelo, pergaminho de recarga ou pergaminho de transmutação para fortalecer o feitiço, fazendo com que as invocações futuras sejam elementais com poder total!
items.spells.summonelemental.desc_shock=O feitiço está atualmente a irradiar energia estática e invocará um _elemental de choque_. Pode imbuir um item diferente, mas o feitiço perderá a sua imbução atual.
items.spells.summonelemental.imbue_prompt=Imbuir um artigo
items.spells.summonelemental.name=invocar elemental
items.spells.targetedspell.inv_title=Infundir um item
items.spells.targetedspell.prompt=Escolha um alvo
items.spells.telekineticgrab.cant_grab=Não pode pegar isso.
items.spells.telekineticgrab.desc=Este feitiço permite ao conjurador apanhar remotamente todos os itens num local, ou todas as armas arremessadas que estejam presas num inimigo! Não pode ser utilizado para apanhar itens que pertencem a outra pessoa, ou para apanhar recipientes como baús.
items.spells.telekineticgrab.name=agarrar telecinético
items.spells.telekineticgrab.no_target=Não há nada para agarrar ali.
items.spells.unstablespell.desc=Este pequeno cristal quadrado preto possui símbolos rúnicos variáveis em cada uma das suas superfícies. \n\n. Quando ativado, irá desencadear o efeito de um pergaminho aleatório. O efeito do pergaminho será sempre focado no combate se houver inimigos no seu campo de visão e sempre não será focado no combate caso contrário.
items.spells.unstablespell.name=feitiço instável
items.spells.wildenergy.desc=Este feitiço contém parte da energia amaldiçoada que alimentava o DM-300. Ao ser conjurado, recarregará as suas varinhas e artefactos equipados, além de ativar um efeito aleatório de varinha amaldiçoada. Poderá escolher a direção para onde esta magia amaldiçoada será direcionada.
items.spells.wildenergy.name=energia selvagem
items.stones.inventorystone.ac_use=USO
items.stones.runestone$placeholder.name=pedra rúnica
items.stones.runestone.discover_hint=Podes encontrar este item aleatoriamente na masmorra ou criá-lo através da alquimia.
items.stones.stoneofaggression$aggression.desc=A magia manipulativa está a fazer com que todos os inimigos próximos prefiram atacar esta personagem.\n\nTurnos restantes: %s.
items.stones.stoneofaggression$aggression.name=direcionado
items.stones.stoneofaggression.desc=Quando esta pedra é atirada contra um aliado ou inimigo, todos os inimigos próximos terão prioridade para atacar essa personagem durante um curto período. Os bosses, no entanto, podem resistir ao efeito, reduzindo significativamente a duração e sofrendo menos dano dos ataques dos seus lacaios.
items.stones.stoneofaggression.name=pedra da agressão
items.stones.stoneofaugmentation$wndaugment.cancel=Não importa
items.stones.stoneofaugmentation$wndaugment.choice=O que gostaria de melhorar?
items.stones.stoneofaugmentation$wndaugment.damage=Dano
items.stones.stoneofaugmentation$wndaugment.defense=Defesa
items.stones.stoneofaugmentation$wndaugment.evasion=Evasão
items.stones.stoneofaugmentation$wndaugment.none=Remover Aumento
items.stones.stoneofaugmentation$wndaugment.speed=Velocidade
items.stones.stoneofaugmentation.desc=Esta runa possui uma magia poderosa que pode melhorar o equipamento, melhorando uma propriedade em detrimento de outra. Usá-la numa arma permitirá aumentar a velocidade ou o dano. As armas arremessáveis também ganharão ou perderão durabilidade proporcionalmente à sua velocidade. Usá-la numa armadura permitirá aumentar a defesa ou a evasão.
items.stones.stoneofaugmentation.discover_hint=Pode comprar este item numa loja ou criá-lo através da alquimia.
items.stones.stoneofaugmentation.inv_title=Aumentar um item
items.stones.stoneofaugmentation.name=pedra de aumento
items.stones.stoneofblast.desc=Esta runa explodirá instantaneamente no local onde for lançada. Tal como uma bomba, a explosão causará danos a tudo o que estiver por perto.
items.stones.stoneofblast.name=pedra de explosão
items.stones.stoneofblink.desc=Esta runa teletransportará o utilizador para o local para onde for lançada.
items.stones.stoneofblink.name=pedra do piscar
items.stones.stoneofclairvoyance.desc=Esta pedra revelará instantaneamente todos os azulejos numa área muito ampla em redor de onde for lançada. O seu efeito estender-se-á até mesmo através das paredes.
items.stones.stoneofclairvoyance.name=pedra da clarividência
items.stones.stoneofdeepsleep.desc=Quando esta pedra for atirada contra um inimigo, fá-lo-á cair num sono mágico profundo. Os inimigos adormecidos dormirão magicamente para sempre até serem perturbados.
items.stones.stoneofdeepsleep.name=pedra do sono profundo
items.stones.stoneofdetectmagic.desc=Esta runa é capaz de detetar a magia que afeta um item. Usá-la num item não identificado revelará se está afetado por uma maldição maléfica e se está sob o efeito de magia positiva, como encantamentos ou melhorias.
items.stones.stoneofdetectmagic.detected_bad=Detetaste magia malévola afetando este item!
items.stones.stoneofdetectmagic.detected_both=Detetas efeitos mágicos tanto positivos como negativos neste item!
items.stones.stoneofdetectmagic.detected_good=Detetas uma influência mágica positiva sobre este objeto!
items.stones.stoneofdetectmagic.detected_none=Não detetou nenhuma magia afetando este item.
items.stones.stoneofdetectmagic.inv_title=Detetar um item
items.stones.stoneofdetectmagic.name=pedra de detecção mágica
items.stones.stoneofdisarming.desc=Esta runa contém magia capaz de desativar armadilhas maliciosas escondidas por toda a masmorra. Desarmará até 9 armadilhas na área onde for lançada.
items.stones.stoneofdisarming.name=pedra de desarmamento
items.stones.stoneofenchantment.armor=A sua armadura brilha na escuridão!
items.stones.stoneofenchantment.desc=Esta runa possui magia de encantamento. Ao contrário de um pergaminho de melhoramento, não aumentará o poder direto de um item, mas imbuirá uma arma ou armadura com um encantamento, concedendo-lhe um novo poder.
items.stones.stoneofenchantment.inv_title=Encantar um item
items.stones.stoneofenchantment.name=pedra de encantamento
items.stones.stoneofenchantment.weapon=A sua arma brilha no escuro!
items.stones.stoneoffear.desc=Quando esta pedra for atirada a uma personagem, esta ficará tomada de terror e fugirá. Atacar um personagem em fuga reduzirá a duração do efeito.
items.stones.stoneoffear.name=pedra do medo
items.stones.stoneofflock.desc=Esta pedra rúnica invoca ovelhas mágicas durante um curto período de tempo em redor do local onde é lançada.
items.stones.stoneofflock.name=pedra do rebanho
items.stones.stoneofintuition$wndguess.break=A sua pedra da intuição desfaz-se em pó...
items.stones.stoneofintuition$wndguess.correct=Correto. O tipo de artigo foi identificado!
items.stones.stoneofintuition$wndguess.incorrect=O seu palpite estava incorreto.
items.stones.stoneofintuition$wndguess.text=Tente adivinhar o tipo do item não identificado. Se acertar, o tipo será identificado!
items.stones.stoneofintuition.break_info=Pode usar as pedras da intuição duas vezes antes que uma se parta; o seu próximo uso não consumirá uma pedra.
items.stones.stoneofintuition.break_warn=Já utilizou uma pedra da intuição anteriormente, pelo que _a sua próxima utilização consumirá uma pedra_.
items.stones.stoneofintuition.desc=Esta runa contém uma versão mais fraca da magia que se encontra nos pergaminhos de identificação. Em vez de identificar diretamente um item, atuará sobre a sua intuição, permitindo-lhe tentar identificar o tipo de uma poção, pergaminho ou anel através de palpites.
items.stones.stoneofintuition.inv_title=Selecione um item
items.stones.stoneofintuition.name=pedra da intuição
items.stones.stoneofshock.desc=Esta runa liberta uma explosão de energia elétrica que atordoa brevemente todos os alvos próximos e concede ao lançador uma carga de varinha por cada alvo atingido.
items.stones.stoneofshock.name=pedra de choque
items.stylus.ac_inscribe=INSCREVER
items.stylus.cursed=A magia da caneta não funcionará em armaduras amaldiçoadas.
items.stylus.desc=Este estilete arcano é feito de uma pedra escura e muito dura. Usando-o, pode inscrever um glifo mágico na sua armadura, mas não tem poder para escolher qual será o glifo; o estilete decidirá por si.
items.stylus.identify=Primeiro precisa de identificar se esta armadura está amaldiçoada.
items.stylus.inscribed=Gravou a sua armadura com a caneta.
items.stylus.name=caneta arcana
items.stylus.prompt=Selecione uma armadura
items.tengusmask.ac_wear=VESTIR
items.tengusmask.desc=Esta máscara caiu do rosto de Tengu quando ele morreu, e pode sentir-se um grande poder mágico a emanar dela. Seria a máscara a fonte de força de Tengu? Ao usá-la, o tremendo poder da máscara será transferido para si, permitindo-lhe escolher uma subclasse para o seu herói. Qual a subclasse que escolherá?
items.tengusmask.discover_hint=Pode obter este item como recompensa ao derrotar certos inimigos.
items.tengusmask.name=Máscara de Tengu
items.tengusmask.used=A máscara desintegra-se à medida que o seu poder flui para dentro de si!
items.torch.ac_light=LUZ
items.torch.desc=Item essencial para aventureiros, quando uma masmorra fica escura, uma tocha pode ajudar a iluminar o caminho.
items.torch.name=tocha
items.trinkets.chaoticcenser.desc=Após algum tempo no caldeirão de alquimia, este incensário parece produzir fumo por si só! Estes gases acumulam-se e são expelidos do incensário em direção aos inimigos em intervalos quase aleatórios. Parece capaz de produzir todos os tipos de gases, mas terá um breve aviso antes de o incensário ser ativado.
items.trinkets.chaoticcenser.name=incensário caótico
items.trinkets.chaoticcenser.spew=O seu incensário está prestes a expelir: %s.
items.trinkets.chaoticcenser.stats_desc=No nível atual, este item gera um gás nocivo perto de um inimigo aproximadamente a cada _%d_ turnos. Os gases só aparecem quando há inimigos presentes. Em níveis mais elevados, estes gases têm maior probabilidade de serem exóticos e poderosos.
items.trinkets.chaoticcenser.typical_stats_desc=Normalmente, este amuleto gera um gás nocivo perto de um inimigo a cada _%d_ turnos aproximadamente. Os gases só aparecem quando há inimigos presentes. Em níveis mais elevados, estes gases têm maior probabilidade de serem exóticos e poderosos.
items.trinkets.crackedspyglass.desc=Este telescópio de mão seria uma demonstração de um grande e preciso trabalho artesanal, não fosse a fissura na sua lente frontal. A luneta parece estar a ajudar-te a revelar novos itens na masmorra, mas devido à tua falha, os itens revelados são bastante difíceis de ver!
items.trinkets.crackedspyglass.name=luneta rachada
items.trinkets.crackedspyglass.stats_desc=No nível atual, este objeto tem uma probabilidade de _%1$s%%_ de criar um item oculto extra em cada piso que não seja de boss.
items.trinkets.crackedspyglass.stats_desc_upgraded=No nível atual, este objeto tem _100%% de chance_ de criar um item oculto extra em cada piso que não seja de boss, e _%1$s%% de chance_ de criar um segundo item oculto extra.
items.trinkets.crackedspyglass.typical_stats_desc=Normalmente, este objeto tem uma probabilidade de _%1$s%%_ de criar um item oculto extra em cada piso que não seja de boss.
items.trinkets.dimensionalsundial.desc=Este pequeno relógio de sol portátil consegue, de alguma forma, projetar uma sombra nas profundezas da masmorra, mesmo que não esteja na vertical. Mais estranho ainda, a posição da sombra parece não ter qualquer relação com o sol neste mundo. Quando não projeta sombra, o relógio de sol parece atrair o perigo.
items.trinkets.dimensionalsundial.name=relógio de sol dimensional
items.trinkets.dimensionalsundial.stats_desc=No seu nível atual, este item reduzirá a taxa de aparecimento de inimigos em _%1$d%%_ durante o dia (das 8h às 20h) e aumentará a taxa de aparecimento de inimigos em _%2$d%%_ durante a noite (das 20h às 8h).
items.trinkets.dimensionalsundial.typical_stats_desc=Normalmente, este amuleto reduzirá a taxa de aparecimento de inimigos em _%1$d%%_ durante o dia (das 8h às 20h) e aumentará a taxa de aparecimento de inimigos em _%2$d%%_ à noite (das 20h às 8h).
items.trinkets.dimensionalsundial.warning=O seu relógio de sol não está a projetar sombra, e sente-se inquieto.
items.trinkets.exoticcrystals.desc=Estes pequenos cristais cor-de-rosa têm a mesma forma que os cristais de energia alquímica. Embora não possam ser utilizados diretamente para gerar energia, parecem influenciar de alguma forma as poções e os pergaminhos que encontra.
items.trinkets.exoticcrystals.name=cristais exóticos
items.trinkets.exoticcrystals.stats_desc=No nível atual, este item substituirá _%s%%_ de poções ou pergaminhos obtidos como recompensa pelos seus equivalentes exóticos. Isto não afeta poções de força, pergaminhos de melhoramento ou itens gerados para ajudar a resolver salas de perigo.
items.trinkets.exoticcrystals.typical_stats_desc=Normalmente, este item substituirá _%s%%_ de poções ou pergaminhos obtidos como recompensa pelos seus equivalentes exóticos. Isto não afeta poções de força, pergaminhos de melhoramento ou itens gerados para ajudar a resolver salas de perigo.
items.trinkets.eyeofnewt.desc=Este olho de tritão dourado e preto é um ingrediente comum, agora transformado num objeto decorativo. O olho parece reduzir a sua visão em troca de lhe permitir ver as coisas de outras formas.
items.trinkets.eyeofnewt.name=olho de tritão
items.trinkets.eyeofnewt.stats_desc=No seu nível atual, este acessório reduzirá o seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental sobre os inimigos dentro de _%2$d_ quadrados.
items.trinkets.eyeofnewt.typical_stats_desc=Normalmente, este acessório reduzirá o seu alcance de visão em _%1$s%%_, mas também lhe concederá visão mental sobre os inimigos dentro de _%2$d_ quadrados.
items.trinkets.ferrettuft.desc=Um tufo de pêlo branco e sedoso de furão, preso por uma fita verde-limão atada em forma de laço. Os furões são conhecidos pela sua agilidade, travessuras e falta de integridade. Parte deste poder parece emanar do enfeite, aumentando a capacidade de evasão de qualquer coisa que esteja por perto.
items.trinkets.ferrettuft.name=tufo de furão
items.trinkets.ferrettuft.stats_desc=No seu nível atual, este item aumentará a evasão de todas as personagens em _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Normalmente, este item aumentará a evasão de todas as personagens em _%1$s%%_.
items.trinkets.mimictooth.desc=Este dente grande e afiado deve ter sido arrancado a um imitador muito infeliz. Parece estar a influenciar os imitadores da masmorra, tornando-os mais frequentes e perigosos.
items.trinkets.mimictooth.name=imitar dente
items.trinkets.mimictooth.stats_desc=No nível atual, este amuleto tornará todos os tipos de mímicos _%1$sx_ mais comuns e muito mais difíceis de detetar, mas também aumentará a quantidade de itens que deixam cair. Cada piso da masmorra terá também uma hipótese _%2$s%%_ de conter um mimo de ébano furtivo extra.
items.trinkets.mimictooth.typical_stats_desc=Normalmente, este amuleto tornará todos os tipos de mimos _%1$sx_ mais comuns e muito mais difíceis de detetar, mas também aumentará a quantidade de itens que deixam cair. Cada piso da masmorra terá também uma hipótese _%2$s%%_ de conter um mimo de ébano furtivo extra.
items.trinkets.mossyclump.desc=Este aglomerado de musgo húmido parece reter a humidade, independentemente do quanto o aperte. Parece estar magicamente ligado à própria masmorra, fazendo com que a erva e a água apareçam com mais frequência.
items.trinkets.mossyclump.name=tufo de musgo
items.trinkets.mossyclump.stats_desc=No nível atual, este item fará com que _%d%%_ dos pavimentos sem tema se encha com água ou relva.\n\nEste item custa uma maior quantidade de energia para ser melhorado.
items.trinkets.mossyclump.typical_stats_desc=Normalmente, este item fará com que _%d%%_ pisos sem tema fiquem cheios de água ou relva.\n\nEste item custa uma maior quantidade de energia para ser melhorado.
items.trinkets.parchmentscrap.desc=Este pequeno pedaço de pergaminho parece ter vindo de um rolo. Reteve parte da sua magia e parece estar a influenciar as armas e armaduras encontradas na masmorra.
items.trinkets.parchmentscrap.name=pedaço de pergaminho
items.trinkets.parchmentscrap.stats_desc=No nível atual, este amuleto tornará comuns os encantamentos e glifos _%dx_, e as maldições em armas e armaduras _%sx_ comuns. As maldições em varinhas, anéis ou artefactos não são afetadas. Este amuleto custa uma maior quantidade de energia para ser melhorado.
items.trinkets.parchmentscrap.typical_stats_desc=Normalmente, este amuleto tornará comuns os encantamentos e glifos _%dx_, e as maldições em armas e armaduras _%sx_ comuns. As maldições em varinhas, anéis ou artefactos não são afetadas. \n\n Este amuleto custa uma maior quantidade de energia para ser melhorado.
items.trinkets.petrifiedseed.desc=Esta semente foi fossilizada, quer por lentos processos geológicos, quer por magia. A semente parece estar a influenciar magicamente a flora da masmorra, substituindo ocasionalmente as sementes de plantas por runas.
items.trinkets.petrifiedseed.name=semente petrificada
items.trinkets.petrifiedseed.stats_desc=No seu nível atual, este trinket fará com que a erva pisoteada deixe cair runas em vez de sementes _%1$s%%_ da maioria das vezes, e também fará com que a erva alta deixe cair itens _%2$s%%_ com mais frequência.
items.trinkets.petrifiedseed.typical_stats_desc=Normalmente, este amuleto fará com que a erva pisada deixe cair runas em vez de sementes _%1$s%%_ da maioria das vezes, e também fará com que a erva alta deixe cair itens _%2$s%%_ com mais frequência.
items.trinkets.ratskull.desc=Este objeto macabro não é muito maior do que o crânio de um rato comum, que, por alguma razão, é uma raridade nesta masmorra. A influência mágica do crânio parece atrair os habitantes mais raros da masmorra, fazendo com que apareçam com muito mais frequência.
items.trinkets.ratskull.name=crânio de rato
items.trinkets.ratskull.stats_desc=No nível atual, este amuleto fará com que os inimigos exóticos raros _%dx_ tenham a mesma probabilidade de aparecer. No entanto, o crânio é apenas metade tão eficaz em atrair mímicos de cristal e estátuas blindadas.
items.trinkets.ratskull.typical_stats_desc=Normalmente, este amuleto fará com que os inimigos exóticos raros _%dx_ tenham a mesma probabilidade de aparecer. No entanto, o crânio é apenas metade tão eficaz para atrair mímicos de cristal e estátuas blindadas.
items.trinkets.saltcube.desc=Este grande cristal de sal foi cortado num formato cúbico quase perfeito e, de alguma forma, conseguiu drenar metade da água do caldeirão de alquimia em vez de se dissolver. Parece estar magicamente a desidratar e a preservar os alimentos que ingere, prolongando a sensação de saciedade, mas também diminuindo a recuperação da sua saúde quando não está em estado de inanição.
items.trinkets.saltcube.name=cubo de sal
items.trinkets.saltcube.stats_desc=No nível atual, este item aumentará o tempo antes de sentir fome em _%1$s%%_, mas também reduzirá a sua taxa de regeneração de saúde em _%2$s%%_, a menos que o chão esteja trancado.
items.trinkets.saltcube.typical_stats_desc=Normalmente, este item aumentará o tempo antes de sentir fome em _%1$s%%_, mas também reduzirá a sua taxa de regeneração de saúde em _%2$s%%_, a menos que o chão esteja trancado.
items.trinkets.shardofoblivion$thrownusetracker.desc=Utilizou recentemente uma arma de arremesso não identificada, que conta como um item de equipamento não identificado utilizado para o fragmento do esquecimento durante um curto período. \n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Arma de arremesso não identificada utilizada
items.trinkets.shardofoblivion$wandusetracker.desc=Utilizou recentemente uma varinha não identificada, que conta como um item de equipamento não identificado utilizado para o fragmento do esquecimento durante um curto período. \n\nTurnos restantes: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Varinha não identificada utilizada
items.trinkets.shardofoblivion.ac_identify=IDENTIFICAR
items.trinkets.shardofoblivion.desc=Depois de ser fervido no caldeirão de alquimia, este pequeno fragmento de metal amaldiçoado transformou-se em... nada? A luz parece curvar-se à sua volta, e paira no ar quando não o está a segurar. O fragmento parece estar a absorver poder magicamente da sua ignorância, por isso é melhor não pensar muito nisso.
items.trinkets.shardofoblivion.identify=Você identifica o artigo!
items.trinkets.shardofoblivion.identify_not_yet=Este item ainda não está pronto para ser identificado.
items.trinkets.shardofoblivion.identify_prompt=Identifique um item
items.trinkets.shardofoblivion.identify_ready=Um item está pronto para ser identificado: %s. Utilize o seu Fragmento do Esquecimento para o identificar.
items.trinkets.shardofoblivion.identify_ready_worn=Os seus itens desgastados estão agora prontos para serem identificados. Utilize o seu Fragmento do Esquecimento nos itens para os identificar.
items.trinkets.shardofoblivion.name=fragmento do esquecimento
items.trinkets.shardofoblivion.stats_desc=No nível atual, este trinket aumentará a taxa de drop de itens dos inimigos em 20%% por cada peça de equipamento não identificado que tenhas equipado ou utilizado recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que identifique equipamentos, mas pode ser utilizado para identificar manualmente itens que estejam prontos para serem identificados.
items.trinkets.shardofoblivion.typical_stats_desc=Normalmente, este trinket aumentará a taxa de drop de itens dos inimigos em 20%% por cada peça de equipamento não identificado que tenhas equipado ou utilizado recentemente, até um máximo de _%d item(ns)_. O fragmento também impedirá que identifique equipamentos, mas pode ser utilizado para identificar manualmente itens que estejam prontos para serem identificados.
items.trinkets.thirteenleafclover.desc=De alguma forma, a cozedura no caldeirão de alquimia fez com que este trevo criasse um monte de folhas extra! Não é muito claro se este objeto traz sorte ou azar; talvez ele torne a sua sorte ainda mais caótica?
items.trinkets.thirteenleafclover.name=trevo de treze folhas
items.trinkets.thirteenleafclover.stats_desc=No seu nível atual, este trinket fará com que cause dano máximo _%1$d%%_ do tempo, e dano mínimo _%2$d%%_ do tempo.
items.trinkets.thirteenleafclover.typical_stats_desc=Normalmente, este trinket fará com que causes dano máximo _%1$d%%_ do tempo, e dano mínimo _%2$d%%_ do tempo.
items.trinkets.trapmechanism.desc=O mecanismo central de uma das armadilhas de queda da masmorra, cuidadosamente esculpido no chão para que possa ser transportado. Parece estar magicamente ligado à própria masmorra, tornando o terreno perigoso mais comum, mas também aumentando a sua afinidade com ele.
items.trinkets.trapmechanism.name=mecanismo de armadilha
items.trinkets.trapmechanism.stats_desc=No nível actual, este item fará com que _%1$d%%_ dos andares sem tema se tornem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra tornar-se-ão visíveis.
items.trinkets.trapmechanism.typical_stats_desc=Normalmente, este amuleto fará com que _%1$d%%_ dos andares sem tema se tornem cheios de armadilhas ou abismos. Além disso, _%2$d%%_ das armadilhas escondidas da masmorra tornar-se-ão visíveis.
items.trinkets.trinket$placeholder.name=bugiganga
items.trinkets.trinket.discover_hint=Este item tem uma hipótese de ser uma opção sempre que criar um objeto decorativo através da alquimia.
items.trinkets.trinketcatalyst$randomtrinket.desc=Um item próximo está preso dentro de uma bolsa que não consegues abrir. O processo de alquimia dissolverá a bolsa, mas não saberá qual a bugiganga que obterá até o fazer!
items.trinkets.trinketcatalyst$randomtrinket.name=bugiganga aleatória
items.trinkets.trinketcatalyst.desc=Esta esfera de pó dourado mágico brilha na escuridão da masmorra. Este catalisador pode ser utilizado num caldeirão de alquimia com um pouco de energia alquímica para produzir um item de bugiganga único. Os itens de bugiganga proporcionam diversos efeitos diferentes que alteram ligeiramente a masmorra ou os seus habitantes. Os itens de bugiganga podem ser melhorados com mais energia para tornar o seu efeito mais poderoso ou descartados para que o efeito seja anulado por completo.
items.trinkets.trinketcatalyst.name=catalisador mágico
items.trinkets.trinketcatalyst.window_text=A água começa a brilhar ao adicionar o catalisador. Existem alguns objetos próximos que pode imbuir de energia para os transformar num objeto mágico.
items.trinkets.trinketcatalyst.window_title=criar uma bugiganga
items.trinkets.vialofblood.desc=Este frasco fino contém o sangue de algum habitante da masmorra; move-se lentamente à medida que roda o frasco. Parece potenciar magicamente os efeitos de cura, mas também atrasá-los.
items.trinkets.vialofblood.name=frasco de sangue
items.trinkets.vialofblood.stats_desc=No nível atual, este item aumentará a saúde geral que ganhas ao beber poções de cura, cantis ou fontes de saúde em _%1$s%%_. No entanto, estes efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (isto aumenta com o nível do herói).
items.trinkets.vialofblood.typical_stats_desc=Normalmente, este amuleto aumentará a saúde geral que ganhas ao beber poções de cura, cantis ou fontes de saúde em _%1$s%%_. No entanto, estes efeitos de cura também ocorrerão mais lentamente, regenerando um máximo de _%2$s_ PV por turno (isto aumenta com o nível do herói).
items.trinkets.wondrousresin.desc=Esta resina azul brilhante parece conter a essência destilada da magia de uma varinha amaldiçoada. A magia do caldeirão de alquimia parece tê-la estabilizado um pouco, e agora está a afetar as suas varinhas.
items.trinkets.wondrousresin.name=resina maravilhosa
items.trinkets.wondrousresin.stats_desc=No nível atual, este amuleto fará com que os efeitos de varinhas amaldiçoadas se tornem neutros ou positivos _%1$s%%_ da vez, e fará com que varinhas não amaldiçoadas disparem um raio amaldiçoado neutro ou positivo adicional _%2$s%%_ da vez.\n\nEste amuleto custa uma quantidade maior de energia para ser melhorado.
items.trinkets.wondrousresin.typical_stats_desc=Normalmente, este amuleto forçará os efeitos das varinhas amaldiçoadas a tornarem-se neutros ou positivos _%1$s%%_ da vez, e fará com que as varinhas não amaldiçoadas disparem um raio amaldiçoado neutro ou positivo adicional _%2$s%%_ da vez.\n\nEste amuleto custa uma maior quantidade de energia para ser melhorado.
items.wands.cursedwand.disguise=A sua aparência muda diante dos seus olhos!
items.wands.cursedwand.fire=Sente cheiro a queimado...
items.wands.cursedwand.grass=A erva brota ao seu redor!
items.wands.cursedwand.gravity=De repente, a gravidade começa a puxar em direções aleatórias!
items.wands.cursedwand.gravity_end=O caos gravitacional chega ao fim.
items.wands.cursedwand.gravity_positive=De repente, a gravidade começa a puxar em direções aleatórias, mas isso não parece afetar-te.
items.wands.cursedwand.mass_invuln=Uma luz brilhante irrompe da sua varinha!
items.wands.cursedwand.nothing=Nada acontece.
items.wands.cursedwand.ondeath=Foste morto pelo teu próprio %s.
items.wands.cursedwand.petrify=De repente, congela no lugar!
items.wands.cursedwand.sinkhole=O chão começa a ceder à sua volta!
items.wands.cursedwand.sinkhole_positive=O chão começa a ceder, mas parece suficientemente firme debaixo de si.
items.wands.cursedwand.supernova=Uma bola de energia flamejante começa a crescer. É melhor correr!
items.wands.cursedwand.supernova_positive=Uma bola de energia flamejante começa a crescer, mas de alguma forma parece segura.
items.wands.cursedwand.transmogrify_other=O seu item transforma-se em algo diferente!
items.wands.cursedwand.transmogrify_wand=A sua varinha transforma-se em um item diferente!
items.wands.damagewand.upgrade_stat_name_1=Dano Mágico
items.wands.wand$placeholder.name=varinha
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Este %s está amaldiçoado!
items.wands.wand.cursed=Esta varinha está amaldiçoada, tornando a sua magia caótica e aleatória.
items.wands.wand.fizzles=A sua varinha falha; provavelmente não tem carga suficiente.
items.wands.wand.identify=Já está familiarizado o suficiente com a sua varinha para a identificar.
items.wands.wand.no_magic=A sua varinha falha; não pode usar varinhas enquanto estiver imune à magia.
items.wands.wand.not_cursed=Esta varinha está livre de magia malévola.
items.wands.wand.prompt=Escolha um local para eletrocutar
items.wands.wand.resin_many=Esta varinha ganhou _%d níveis_ de resina arcana.
items.wands.wand.resin_one=Esta varinha ganhou _1 nível_ com resina arcana.
items.wands.wand.self_target=Não se pode escolher como alvo!
items.wands.wandofblastwave.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo paralisado com um bastão de onda explosiva, consome a paralisia para causar uma explosão de dano mágico adicional. Este possui um curto tempo de recarga por inimigo.
items.wands.wandofblastwave.desc=Esta varinha é feita de uma espécie de pedra marmoreada, com detalhes em ouro e uma gema preta redonda na ponta. Ela é bastante pesada na mão.
items.wands.wandofblastwave.eleblast_desc=Uma explosão elemental com um bastão de onda de choque causa 67% de dano e atira todos os inimigos para fora da área de impacto.
items.wands.wandofblastwave.knockback_ondeath=A colisão matou-te...
items.wands.wandofblastwave.name=varinha de onda de choque
items.wands.wandofblastwave.ondeath=Matou-se com a sua própria Varinha de Onda de Choque...
items.wands.wandofblastwave.staff_name=equipa de onda de choque
items.wands.wandofblastwave.stats_desc=Esta varinha dispara um raio que detona violentamente no local alvo. A força desta explosão causa dano de _%1$d a %2$d_ e é forte o suficiente para atirar a maioria dos inimigos para longe.
items.wands.wandofblastwave.typical_stats_desc=Esta varinha dispara um raio que detona violentamente no local alvo. A força desta explosão causa normalmente dano de _%1$d a %2$d_ e é forte o suficiente para atirar a maioria dos inimigos para longe.
items.wands.wandofblastwave.upgrade_stat_name_2=Repulsão
items.wands.wandofcorrosion.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão de corrosão, o inimigo tem uma probabilidade de ficar coberto de gosma.
items.wands.wandofcorrosion.desc=Esta varinha tem um corpo acinzentado que se abre para revelar uma gema laranja brilhante.
items.wands.wandofcorrosion.eleblast_desc=Uma explosão elemental com um bastão de corrosão inflige corrosão aos inimigos durante 4 turnos, começando com 6 de dano.
items.wands.wandofcorrosion.name=varinha de corrosão
items.wands.wandofcorrosion.staff_name=equipa de corrosão
items.wands.wandofcorrosion.stats_desc=Esta varinha dispara um raio que explode numa nuvem de gás altamente corrosivo no local alvo. Qualquer coisa atingida por esta nuvem sofrerá dano crescente ao longo do tempo, começando com _%d de dano._
items.wands.wandofcorrosion.upgrade_stat_name_1=Danos por corrosão
items.wands.wandofcorrosion.upgrade_stat_name_2=Volume de gás
items.wands.wandofcorruption.already_corrupted=Esta personagem não pode ser mais influenciada.
items.wands.wandofcorruption.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão da corrupção, o inimigo tem uma probabilidade de ficar enlouquecido.
items.wands.wandofcorruption.desc=Esta varinha irradia uma energia escura e caótica, caso isso já não fosse óbvio pela pequena caveira decorativa esculpida na sua ponta.
items.wands.wandofcorruption.eleblast_desc=Uma explosão elemental com um bastão da corrupção inflige aos inimigos 5 turnos de descontrolo.
items.wands.wandofcorruption.name=varinha da corrupção
items.wands.wandofcorruption.staff_name=funcionários da corrupção
items.wands.wandofcorruption.stats_desc=Esta varinha irá libertar uma explosão de energia corruptora que enfraquecerá os inimigos e, eventualmente, os dobrará à sua vontade. Os inimigos podem resistir à corrupção, mas os inimigos enfraquecidos são muito mais fáceis de corromper do que os inimigos saudáveis.
items.wands.wandofcorruption.upgrade_stat_name_1=Poder Corruptor
items.wands.wandofcorruption.upgrade_stat_name_2=Duração do efeito negativo
items.wands.wandofdisintegration.bmage_desc=Quando empunhado pelo _Mago de Batalha_, um bastão de desintegração tem o seu alcance de ataque aumentado, como se possuísse um encantamento de projeção.
items.wands.wandofdisintegration.desc=Esta varinha é feita de um bloco sólido e liso de obsidiana, com uma luz púrpura profunda a percorrer a sua lateral, terminando na ponta. Ela brilha com energia destrutiva, pronta a disparar.
items.wands.wandofdisintegration.eleblast_desc=Uma explosão elemental com um bastão de desintegração causa 100% de dano e atravessa paredes.
items.wands.wandofdisintegration.name=varinha de desintegração
items.wands.wandofdisintegration.staff_name=equipa de desintegração
items.wands.wandofdisintegration.stats_desc=Esta varinha dispara um raio que atravessa qualquer obstáculo e terá um maior alcance à medida que for melhorada. O raio causa dano de _%1$d a %2$d_ e também causará dano bónus por cada inimigo e parede que atravesse.
items.wands.wandofdisintegration.upgrade_stat_name_2=Alcance máximo
items.wands.wandoffireblast.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão de explosão de fogo, existe a hipótese de produzir uma explosão que causa dano aos inimigos e consome todo o fogo nas proximidades! Esta chance aumenta quanto mais fogo estiver adjacente ao inimigo.
items.wands.wandoffireblast.desc=Esta varinha é feita de madeira lacada de vermelho com folhas de ouro aplicadas generosamente para lhe conferir um aspecto bastante régio. Ela crepita e chia na ponta, ansiosa por libertar a sua poderosa magia.
items.wands.wandoffireblast.eleblast_desc=Uma explosão elemental com um bastão de fogo causa 100% de dano, arromba portas e incendeia os inimigos e o terreno.
items.wands.wandoffireblast.name=varinha de rajada de fogo
items.wands.wandoffireblast.staff_name=equipa de explosão de fogo
items.wands.wandoffireblast.stats_desc=Esta varinha dispara um cone de fogo quando utilizada. O seu próximo ataque consumirá _%1$d cargas_ e causará _%2$d-%3$d de dano_. Quanto mais cargas a varinha utilizar, maior e mais forte será o efeito.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Dano de Carga
items.wands.wandoffireblast.upgrade_stat_name_2=2 Dano de Carga
items.wands.wandoffireblast.upgrade_stat_name_3=3 Dano de Carga
items.wands.wandoffrost.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo congelado com um bastão de gelo, tem uma hipótese de o congelar instantaneamente. Esta hipótese aumenta quanto mais congelado ele estiver.
items.wands.wandoffrost.desc=Esta varinha parece ser feita de algum tipo de gelo mágico. Ela brilha cada vez mais em direção à sua ponta arredondada. É muito fria ao toque, mas, de alguma forma, a mão mantém-se aquecida.
items.wands.wandoffrost.eleblast_desc=Uma explosão elemental com um bastão de gelo causa 100% de dano, congela os inimigos e apaga incêndios.
items.wands.wandoffrost.name=varinha de gelo
items.wands.wandoffrost.staff_name=cajado de geada
items.wands.wandoffrost.stats_desc=Esta varinha dispara rajadas de energia gélida contra os seus inimigos, causando dano de _%1$d-%2$d_ e congelando-os. O efeito parece ser mais forte na água. Os inimigos já congelados ou constipados sofrem menos dano desta varinha.
items.wands.wandoffrost.upgrade_stat_name_2=Duração do arrefecimento
items.wands.wandoflightning$lightningcharge.desc=O Mago de Batalha está atualmente carregado de energia, o que lhe concede imunidade ao seu bastão de relâmpagos e aumenta o alcance dos raios que podem ser emitidos por ele.\n\nTurnos restantes: %s.
items.wands.wandoflightning$lightningcharge.name=Carregado eletricamente
items.wands.wandoflightning.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão de relâmpagos, tem uma probabilidade de se carregar eletricamente durante 10 turnos. Enquanto estiver carregado, o Mago de Batalha é imune a danos de relâmpago e poderá lançar raios ainda mais longe.
items.wands.wandoflightning.desc=Esta varinha é feita de metal maciço, o que a torna surpreendentemente pesada. Duas pontas curvam-se juntas na extremidade, e formam-se arcos elétricos entre elas.
items.wands.wandoflightning.eleblast_desc=Uma explosão elemental com um bastão de relâmpago causa 100% de dano, atordoa os inimigos durante 5 turnos e eletrifica a água.
items.wands.wandoflightning.name=varinha de relâmpago
items.wands.wandoflightning.ondeath=Matou-se com a sua própria Varinha de Relâmpagos...
items.wands.wandoflightning.staff_name=cajado do relâmpago
items.wands.wandoflightning.stats_desc=Esta varinha emite raios poderosos que atravessam qualquer alvo, causando dano de _%1$d-%2$d_. Esta eletricidade propaga-se para personagens próximas e espalha-se mais facilmente na água. Os raios desta varinha podem causar-lhe dano, mas não aos seus aliados.
items.wands.wandoflivingearth$earthguardian.desc=As rochas da sua varinha de terra viva transformaram-se num guardião rochoso protetor! Este protetor rochoso atacará os inimigos próximos, forçando-os a atacar o guardião em vez de ti. Quando todas as ameaças próximas forem eliminadas, o guardião irá reformar-se à sua volta e regressará quando voltar a usar a sua varinha.
items.wands.wandoflivingearth$earthguardian.discover_hint=Podes encontrar esse personagem com uma varinha específica.
items.wands.wandoflivingearth$earthguardian.name=guardião da terra
items.wands.wandoflivingearth$earthguardian.wand_info=O poder defensivo do guardião está ligado ao nível da sua varinha. Atualmente, bloqueia dano de _%1$d a %2$d._
items.wands.wandoflivingearth$rockarmor.desc=Rochas mágicas rodeiam o seu corpo; quando fores atacado, tentarão bloquear o ataque e reduzirão o dano recebido em 50%%. Cada dano bloqueado, no entanto, remove um pouco da rocha.\n\nArmadura restante: %1$d.\n\nSe se acumularem rochas suficientes à sua volta, o próximo ataque da sua varinha de terra viva fará com que as rochas se unam num guardião que lutará ao seu lado.\n\nArmadura necessária para o Guardião: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Este guardião da terra está também a beneficiar do Poder de Muitos. Turnos restantes: %d.
items.wands.wandoflivingearth$rockarmor.name=armadura de rocha
items.wands.wandoflivingearth.bmage_desc=Quando o _Mago de Batalha_ ataca um inimigo com um bastão de terra viva, parte do dano causado é refletido como armadura de pedra.
items.wands.wandoflivingearth.desc=Esta varinha é feita de uma rocha curiosa, com faixas de energia amarela brilhante. As rochas parecem mover-se ligeiramente quando segura a varinha, como se pudessem sentir a sua mão.
items.wands.wandoflivingearth.eleblast_desc=Uma explosão elemental com um bastão de terra viva causa 50% de dano e cura um guardião da terra ativo por cada inimigo atingido.
items.wands.wandoflivingearth.name=varinha da terra viva
items.wands.wandoflivingearth.staff_name=equipa da terra viva
items.wands.wandoflivingearth.stats_desc=Esta varinha dispara projéteis de rocha mágica contra os inimigos, causando dano de _%1$d a %2$d_. As rochas irão reformar-se em redor do utilizador, concedendo-lhe armadura proporcional ao dano causado. Se for acumulada armadura suficiente, esta transformar-se-á num guardião de rocha quando a varinha for usada novamente.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardião HP Máximo
items.wands.wandoflivingearth.upgrade_stat_name_3=Bloqueio do Guardião
items.wands.wandofmagicmissile$magiccharge.desc=A sua varinha de míssil mágico recarregou as suas varinhas, aumentando o nível efetivo do próximo raio que lançarem. As suas varinhas foram melhoradas para: +ZXQPH0. Turnos de carga mágica restantes: ZXQPH1.
items.wands.wandofmagicmissile$magiccharge.name=carga mágica
items.wands.wandofmagicmissile.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão de mísseis mágicos, todas as suas varinhas ganharão carga, para além do bastão.
items.wands.wandofmagicmissile.desc=Esta varinha bastante simples lança mísseis de pura energia mágica. Embora a varinha em si não possua efeitos especiais, tem mais cargas disponíveis e pode fortalecer brevemente outras varinhas quando melhorada.
items.wands.wandofmagicmissile.discover_hint=Um dos heróis começa com este item.
items.wands.wandofmagicmissile.eleblast_desc=Uma explosão elemental com um bastão de mísseis mágicos causa 50% de dano e concede ao mago 15 turnos de recarga.
items.wands.wandofmagicmissile.name=varinha de míssil mágico
items.wands.wandofmagicmissile.staff_name=bastão de mísseis mágicos
items.wands.wandofmagicmissile.stats_desc=Cada raio disparado por esta varinha causa dano de _%1$d-%2$d_ e, se estiver melhorada, fortalecerá brevemente outras varinhas.
items.wands.wandofprismaticlight.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão de luz prismática, este ficará incapacitado durante um período que varia de acordo com o nível do bastão.
items.wands.wandofprismaticlight.desc=Esta varinha é feita de um único pedaço sólido de cristal translúcido, como um longo bloco de vidro liso. Pequenos fragmentos de luz colorida dançam à volta da ponta da varinha, ansiosos por explodir.
items.wands.wandofprismaticlight.eleblast_desc=Uma explosão elemental com um bastão de luz prismática causa 67% de dano, revela todo o terreno na área da explosão e cega os inimigos durante 5 turnos.
items.wands.wandofprismaticlight.name=varinha de luz prismática
items.wands.wandofprismaticlight.staff_name=bastão de luz prismática
items.wands.wandofprismaticlight.stats_desc=Esta varinha dispara raios de luz que cortam a escuridão da masmorra, revelando áreas escondidas e armadilhas. O feixe pode cegar os inimigos e causa dano de _%1$d a %2$d_. Os inimigos demoníacos e os mortos-vivos arderão na luz intensa da varinha, sofrendo dano bónus.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Acaso cego
items.wands.wandofprismaticlight.upgrade_stat_name_3=Duração da luz
items.wands.wandofregrowth$dewcatcher.desc=As plantas do género <i>Cata-orvalho</i> são maravilhosas por se encherem de orvalho mágico. Tentam camuflar-se como erva para evitar chamar a atenção, mas os seus aglomerados de orvalho denunciam-nas.
items.wands.wandofregrowth$dewcatcher.discover_hint=Pode encontrar esta planta com uma varinha específica.
items.wands.wandofregrowth$dewcatcher.name=Coletor de orvalho
items.wands.wandofregrowth$lotus.desc=O lótus dourado é uma planta mística que só pode ser conjurada por uma poderosa varinha de regeneração. A sua aura potencia todas as plantas e os seus efeitos, mas consome a sua energia rapidamente e morre em pouco tempo.
items.wands.wandofregrowth$lotus.discover_hint=Pode encontrar esta planta com uma varinha específica, após aprimorá-la várias vezes.
items.wands.wandofregrowth$lotus.name=Lótus Dourado
items.wands.wandofregrowth$lotus.wand_info=Este lótus foi produzido por uma varinha de regeneração. Todas as plantas sob o seu efeito serão ativadas instantaneamente se plantadas numa personagem. As plantas também terão uma hipótese de libertar as suas sementes, e os dardos com ponta utilizarão menos durabilidade.
items.wands.wandofregrowth$seedpod.desc=As vagens de sementes são plantas mágicas que produzem sementes de outros tipos de plantas, em vez de sementes próprias. De alguma forma, conseguem espalhar-se apesar de não terem sementes próprias.
items.wands.wandofregrowth$seedpod.discover_hint=Pode encontrar esta planta com uma varinha específica.
items.wands.wandofregrowth$seedpod.name=Vagem de sementes
items.wands.wandofregrowth.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão de regeneração, e ambos estiverem de pé sobre erva, receberá cura herbal proporcional ao dano causado.
items.wands.wandofregrowth.degradation=Após mais _%d cargas_, esta varinha começará a falhar na produção de plantas e relva fresca. Este limite aumenta ao subir de nível ou ao melhorar a varinha.
items.wands.wandofregrowth.desc=Esta varinha é feita de uma fina haste de madeira habilmente esculpida. De alguma forma, ela ainda está viva e vibrante, de um verde brilhante como o cerne de uma árvore jovem. "Quando a vida cessa, uma nova vida começa sempre a crescer... O ciclo eterno permanece!"
items.wands.wandofregrowth.eleblast_desc=Uma explosão elemental com um bastão de regeneração cria raízes nos inimigos e faz crescer erva aleatoriamente na área da explosão.
items.wands.wandofregrowth.name=varinha de regeneração
items.wands.wandofregrowth.staff_name=equipa de regeneração
items.wands.wandofregrowth.stats_desc=Ao ser utilizada, esta varinha lançará energia mágica de regeneração num cone, fazendo com que a erva, as raízes e as plantas raras brotem. O seu próximo disparo consumirá _%1$d cargas_. Quanto mais cargas a varinha utilizar, maior e mais forte será o efeito.
items.wands.wandofregrowth.upgrade_stat_name_1=Relva por carga
items.wands.wandofregrowth.upgrade_stat_name_2=Limite total de relva
items.wands.wandoftransfusion.bmage_desc=Quando o _Mago de Batalha_ atingir um inimigo enfeitiçado com um bastão de transfusão, ganhará um escudo e o seu próximo ataque com o bastão não lhe custará qualquer ponto de vida.
items.wands.wandoftransfusion.charged=Os seus colaboradores estão carregados com a energia vital dos seus inimigos!
items.wands.wandoftransfusion.desc=Com um formato bastante simples, esta varinha destaca-se pela sua tonalidade magenta e pela gema preta na ponta.
items.wands.wandoftransfusion.eleblast_desc=Uma explosão elemental com um bastão de transfusão encanta os inimigos, cura os aliados e causa 100% de dano aos inimigos mortos-vivos.
items.wands.wandoftransfusion.name=varinha de transfusão
items.wands.wandoftransfusion.ondeath=Matou-se com a sua própria Varinha de Transfusão...
items.wands.wandoftransfusion.staff_name=equipa de transfusão
items.wands.wandoftransfusion.stats_desc=Quando utilizada em aliados ou inimigos enfeitiçados, esta varinha drenará _%1$d da saúde do utilizador_ para curar ou proteger o aliado em _%2$d de saúde_. Quando utilizada nos inimigos, a varinha enfeitiça-os brevemente enquanto aplica _%3$d de proteção_ ao utilizador. Os mortos-vivos hostis sofrerão _%4$d-%5$d de dano_ em vez de serem enfeitiçados.
items.wands.wandoftransfusion.upgrade_stat_name_1=Cura Aliada
items.wands.wandoftransfusion.upgrade_stat_name_2=Autoproteção
items.wands.wandoftransfusion.upgrade_stat_name_3=Dano de Mortos-Vivos
items.wands.wandofwarding$ward.desc_1=Esta sentinela básica irá eletrocutar automaticamente qualquer inimigo que entre no seu campo de visão, causando _%1$d-%2$d de dano._\n\nEletrocutar esta sentinela com a sua varinha de proteção irá aperfeiçoá-la.\n\nEsta sentinela só irá eletrocutá-la uma vez antes de se dissipar.\n\nA sua varinha de proteção está a utilizar _%3$d de energia_ para manter esta sentinela.
items.wands.wandofwarding$ward.desc_2=Esta proteção melhorada tem um padrão mais complexo e pode atacar várias vezes. Cada disparo desta proteção causará danos de _%1$d a %2$d_._\n\nAtacar esta proteção com a sua varinha de proteção irá aperfeiçoá-la.\n\nEsta proteção disparará três vezes antes de se dissipar.\n\nA sua varinha de proteção está a utilizar _%3$d de energia_ para manter esta proteção.
items.wands.wandofwarding$ward.desc_3=Esta proteção totalmente melhorada é capaz de atacar mais vezes do que as suas antecessoras. Cada raio desta proteção causará _%1$d-%2$d de dano._\n\nUsar esta proteção com a sua varinha de proteção irá melhorá-la.\n\nEsta proteção irá disparar cinco raios antes de se dissipar.\n\nA sua varinha de proteção está a utilizar _%3$d de energia_ para manter esta proteção.
items.wands.wandofwarding$ward.desc_4=Esta sentinela mais pequena tem o mesmo poder de fogo que uma sentinela maior, mas possui vida em vez de um número fixo de cargas. Assemelha-se à gema na ponta da sua varinha de proteção. Cada disparo desta sentinela causará dano de _%1$d a %2$d._\n\nDisparar esta sentinela com a sua varinha de proteção irá melhorá-la e curá-la.\n\nEsta sentinela gastará um pouco de vida cada vez que disparar contra um inimigo, mas pode ser curada usando a sua varinha de proteção nela.\n\nA sua varinha de proteção está a utilizar _%3$d de energia_ para manter esta sentinela ativa.
items.wands.wandofwarding$ward.desc_5=Esta sentinela melhorada é maior e mais resistente do que uma sentinela inferior. Cada disparo desta sentinela causará dano de _%1$d a %2$d._\n\nDisparar esta sentinela com a sua varinha de proteção irá melhorá-la e curá-la.\n\nEsta sentinela gastará um pouco de vida cada vez que disparar contra um inimigo, mas pode ser curada usando a sua varinha de proteção nela.\n\nA sua varinha de proteção está a utilizar _%3$d de energia_ para manter esta sentinela ativa.
items.wands.wandofwarding$ward.desc_6=Esta sentinela totalmente melhorada é significativamente mais resistente do que as suas antecessoras. Cada disparo desta sentinela causará dano de _%1$d a %2$d_. Usar a sua varinha de proteção nesta sentinela irá curá-la. Ela gastará um pouco de vida cada vez que atingir um inimigo, mas pode ser curada usando a sua varinha de proteção nela. A sua varinha de proteção está a utilizar _%3$d de energia_ para manter esta sentinela ativa.
items.wands.wandofwarding$ward.desc_generic_sentry=Esta sentinela tem o mesmo poder de fogo que uma proteção, mas possui vida em vez de um número fixo de cargas. Assemelha-se à gema na ponta da sua varinha de proteção. Ao atingir esta sentinela com a sua varinha de proteção, esta será melhorada e curada. Esta sentinela gastará um pouco de vida cada vez que atingir um inimigo, mas pode ser curada ao usar a sua varinha de proteção nela.
items.wands.wandofwarding$ward.desc_generic_ward=Esta sentinela irá eletrocutar automaticamente qualquer inimigo que entre no seu campo de visão. Usar a sua varinha de proteção nesta sentinela irá aperfeiçoá-la. As sentinelas têm um número limitado de eletrocutações antes de se dissiparem.
items.wands.wandofwarding$ward.discover_hint=Podes encontrar esse personagem com uma varinha específica.
items.wands.wandofwarding$ward.dismiss_body=Pode dissipar esta proteção se já não quiser que a sua varinha a mantenha. Fazer isso destrói a proteção imediatamente.
