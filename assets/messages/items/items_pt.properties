items.weapon.missiles.boomerang.desc=Lançado contra o inimigo, este projétil de madeira plano e curvo regressará às mãos de quem o lançou.
items.weapon.missiles.boomerang.durability=Graças à sua construção sólida, este bumerangue não se partirá com o uso.
items.weapon.missiles.boomerang.name=bumerangue
items.weapon.missiles.darts.adrenalinedart.desc=Estas flechas são revestidas com um composto à base de cardo-veloz que aumenta a velocidade de movimento e de ataque dos aliados, ou reduz brevemente a velocidade de movimento dos inimigos. A flecha em si ainda causa dano aos inimigos, mas não aos aliados.
items.weapon.missiles.darts.adrenalinedart.name=dardo de adrenalina
items.weapon.missiles.darts.blindingdart.desc=Estes dardos são revestidos com um composto à base de erva-cega que cegará o alvo por um curto período. No entanto, não desorientam, pelo que o inimigo ainda saberá onde o viu pela última vez.
items.weapon.missiles.darts.blindingdart.name=dardo cegante
items.weapon.missiles.darts.chillingdart.desc=Estes dardos possuem pontas feitas com um composto à base de gelo que irá arrefecer significativamente o alvo.
items.weapon.missiles.darts.chillingdart.name=dardo arrepiante
items.weapon.missiles.darts.cleansingdart.desc=Estas flechas são revestidas com um composto à base de magia real que tornará os aliados temporariamente imunes a todos os efeitos negativos ou removerá os efeitos positivos dos inimigos. Os inimigos podem até esquecer-se brevemente de que estão a atacar ou a fugir de si. A flecha em si ainda é prejudicial para os inimigos, mas não afetará os aliados.
items.weapon.missiles.darts.cleansingdart.name=dardo de limpeza
items.weapon.missiles.darts.dart.ac_tip=DICA
items.weapon.missiles.darts.dart.desc=Estas hastes simples de madeira com pontas afiadas são equilibradas para voar em linha reta e atingir a presa com um simples movimento do pulso. Podem ser envolvidas em sementes para obter efeitos adicionais ao serem lançadas.
items.weapon.missiles.darts.dart.name=dardo
items.weapon.missiles.darts.dart.prompt=Selecione uma semente
items.weapon.missiles.darts.dart.tip_all=dardos de ponta %1$d com sementes %2$d
items.weapon.missiles.darts.dart.tip_cancel=Cancelar
items.weapon.missiles.darts.dart.tip_desc=Uma semente pode ser combinada com um ou dois dardos para criar pontas. Cada tipo de semente produz um tipo diferente de dardo com ponta, com um efeito único de utilização única. \n\n Aplicando estas sementes num dardo, obterá um _%s_.
items.weapon.missiles.darts.dart.tip_one=ponta 1 dardo com 1 semente
items.weapon.missiles.darts.dart.tip_title=Dardos de ponta
items.weapon.missiles.darts.dart.tip_two=Dica: 2 dardos com 1 semente
items.weapon.missiles.darts.dart.unlimited_uses=Graças à sua construção simples, os dardos duram praticamente para sempre.
items.weapon.missiles.darts.displacingdart.desc=Estes dardos possuem pontas com um composto à base de folhas de ágar que teletransportará o alvo para uma curta distância.
items.weapon.missiles.darts.displacingdart.name=dardo deslocador
items.weapon.missiles.darts.healingdart.desc=Estas flechas são revestidas com um composto à base de erva-sol que concede uma pequena quantidade de cura ao alvo. A flecha em si ainda causa dano aos inimigos, mas não afeta os aliados.
items.weapon.missiles.darts.healingdart.name=dardo curativo
items.weapon.missiles.darts.holydart.desc=Estas setas são revestidas com um composto à base de flor-estrela que infunde energia sagrada no seu alvo. Os aliados e inimigos comuns serão abençoados, mas os inimigos mortos-vivos ou demoníacos sofrerão danos pesados. A flecha em si ainda é prejudicial para os inimigos, mas não afetará os aliados.
items.weapon.missiles.darts.holydart.name=dardo sagrado
items.weapon.missiles.darts.incendiarydart.desc=Estes dardos têm pontas feitas com um composto à base de flor de fogo que explode em chamas brilhantes ao impacto.
items.weapon.missiles.darts.incendiarydart.name=dardo incendiário
items.weapon.missiles.darts.paralyticdart.desc=Estes dardos são revestidos com um composto à base de raízes que paralisa o alvo durante um curto período de tempo.
items.weapon.missiles.darts.paralyticdart.name=dardo paralisante
items.weapon.missiles.darts.poisondart.desc=Estes dardos são revestidos com um composto à base de musgo-da-paz que envenenará o alvo.
items.weapon.missiles.darts.poisondart.name=dardo envenenado
items.weapon.missiles.darts.rotdart.desc=Estes dardos malignos possuem pontas revestidas com um composto ácido à base de podridão, que corrói agressivamente tudo o que entra em contacto. Os inimigos poderosos resistirão à maior parte do efeito, mas a corrosão é suficientemente forte para matar facilmente a maioria dos inimigos comuns. Duram mais tempo do que outros dardos com ponta, mas a sua durabilidade não pode ser aumentada.
items.weapon.missiles.darts.rotdart.discover_hint=Podes criar este item usando uma semente de uma missão específica.
items.weapon.missiles.darts.rotdart.name=dardo podre
items.weapon.missiles.darts.shockingdart.desc=Estes dardos possuem pontas feitas com um composto à base de videira-da-tempestade que causará um choque desagradável no alvo.
