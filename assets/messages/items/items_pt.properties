items.armor.clericarmor.desc=Ao usar esta combinação de tecido e armadura de placas, o clérigo pode executar uma habilidade especial.
items.armor.clericarmor.name=vestes de herói
items.armor.clotharmor.desc=Esta armadura leve oferece proteção básica.
items.armor.clotharmor.discover_hint=Um dos heróis começa com este item.
items.armor.clotharmor.name=armadura de tecido
items.armor.curses.antientropy.desc=A maldição Anti-entropia actua contra as forças do universo, atraindo energia para o interior do utilizador e afastando-a do ambiente que o rodeia. Isto faz com que o utilizador pegue fogo brevemente, mas congela tudo à sua volta!
items.armor.curses.antientropy.name=%s de anti-entropia
items.armor.curses.bulk.desc=As armaduras volumosas parecem maiores e mais imponentes, mas na verdade não oferecem uma defesa melhorada. Pior ainda, o tamanho adicional dificulta bastante a passagem por portas.
items.armor.curses.bulk.name=%s a granel
items.armor.curses.corrosion.desc=A armadura de corrosão é capaz de se romper com um fluido corrosivo, revestindo tudo o que se encontra na zona com uma gosma ácida e pegajosa.
items.armor.curses.corrosion.name=%s de corrosão
items.armor.curses.displacement.desc=A maldição do deslocamento tenta mover o utilizador para um local seguro quando é atacado. No entanto, é um pouco eficaz demais, teletransportando o utilizador aleatoriamente pelo cenário.
items.armor.curses.displacement.name=%s de deslocamento
items.armor.curses.metabolism.desc=A maldição do metabolismo converte diretamente a saciedade em saúde quando o utilizador está ferido, proporcionando um aumento da cura, mas causando rapidamente inanição.
items.armor.curses.metabolism.name=%s do metabolismo
items.armor.curses.multiplicity.desc=As armaduras amaldiçoadas com multiplicidade contêm magia de duplicação perigosa. Podem, por vezes, criar uma imagem espelhada do utilizador, mas também podem duplicar o atacante!
items.armor.curses.multiplicity.name=%s de multiplicidade
items.armor.curses.overgrowth.desc=A armadura de crescimento excessivo está coberta por diversas plantas floridas. Embora este efeito seja certamente interessante, não oferece qualquer defesa, e estas plantas irão ativar-se aleatoriamente em combate!
items.armor.curses.overgrowth.name=%s de crescimento excessivo
items.armor.curses.stench.desc=As armaduras amaldiçoadas com mau cheiro libertam nuvens de gás tóxico, que são perigosas para tudo o que for atingido por elas.
items.armor.curses.stench.name=%s de fedor
items.armor.duelistarmor.desc=Ao usar esta armadura de placas e capa, o Duelista pode executar uma habilidade especial.
items.armor.duelistarmor.name=couraça do herói
items.armor.glyphs.affection.desc=Este poderoso glifo manipula a mente dos atacantes, enfeitiçando-os temporariamente.
items.armor.glyphs.affection.name=%s de afeição
items.armor.glyphs.antimagic.desc=Este poderoso glifo permite que a armadura defenda o seu utilizador contra ataques mágicos, bem como físicos. Esta defesa mágica não é afetada pelo nível da armadura.
items.armor.glyphs.antimagic.name=%s de anti-magia
items.armor.glyphs.brimstone.desc=Este glifo protege o utilizador e os seus pertences do fogo, anulando por completo os seus danos e efeitos negativos.
items.armor.glyphs.brimstone.name=%s de enxofre
items.armor.glyphs.camouflage.desc=Este glifo permite ao utilizador camuflar-se na erva alta, concedendo-lhe invisibilidade temporária.
items.armor.glyphs.camouflage.name=%s de camuflagem
items.armor.glyphs.entanglement.desc=Este glifo cria uma armadura de terra à volta do utilizador para absorver dano, mas esta armadura irá partir-se se o utilizador se mover.
items.armor.glyphs.entanglement.name=%s de emaranhamento
items.armor.glyphs.flow.desc=Este glifo manipula o fluxo de água em torno de quem o utiliza, tornando-o muito mais rápido ao mover-se através dela.
items.armor.glyphs.flow.name=%s de fluxo
items.armor.glyphs.obfuscation.desc=Este glifo oculta o utilizador, tornando-o mais difícil de detetar.
items.armor.glyphs.obfuscation.name=%s de ofuscação
items.armor.glyphs.potential.desc=Este glifo acumula energia ao ser atingido, concedendo carga à varinha do utilizador quando ativada.
items.armor.glyphs.potential.name=%s de potencial
items.armor.glyphs.repulsion.desc=Este glifo reflete a força contra os atacantes, lançando-os para trás.
items.armor.glyphs.repulsion.name=%s de repulsão
items.armor.glyphs.stone.desc=Este glifo envolve a armadura com uma pesada pedra mágica que torna a esquiva impossível, mas bloqueia o dano proporcionalmente à evasão.
items.armor.glyphs.stone.name=%s de pedra
items.armor.glyphs.swiftness.desc=Este glifo aumenta a velocidade do utilizador sempre que este não está perto de um inimigo.
items.armor.glyphs.swiftness.name=%s de rapidez
items.armor.glyphs.thorns.desc=Este poderoso glifo fere os atacantes, fazendo com que sangrem lentamente ao atacarem o portador.
items.armor.glyphs.thorns.name=%s de espinhos
items.armor.glyphs.viscosity$defereddamage.desc=O dano está a ser causado lentamente ao longo do tempo, em vez de imediatamente.\n\nDano diferido restante: %d.
items.armor.glyphs.viscosity$defereddamage.name=dano diferido
items.armor.glyphs.viscosity$defereddamage.ondeath=O dano adiado matou-te...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Morto por dano retardado
items.armor.glyphs.viscosity.deferred=%d adiado
items.armor.glyphs.viscosity.desc=Este glifo é capaz de armazenar o dano causado ao utilizador, libertando-o gradualmente em vez de todo de uma só vez.
items.armor.glyphs.viscosity.name=%s de viscosidade
items.armor.huntressarmor.desc=Ao usar esta capa, a Caçadora pode executar uma habilidade especial.
items.armor.huntressarmor.name=capa de herói
items.armor.huntressarmor.no_enemies=Sem inimigo à vista.
items.armor.leatherarmor.desc=Armadura feita de pele curtida de monstro. Não tão leve como uma armadura de tecido, mas oferece uma melhor proteção.
items.armor.leatherarmor.name=armadura de couro
items.armor.magearmor.desc=Ao usar este magnífico manto, o Mago pode executar uma habilidade especial.
items.armor.magearmor.name=manto de herói
items.armor.mailarmor.desc=Os elos metálicos interligados criam uma armadura resistente, mas flexível.
items.armor.mailarmor.name=armadura de malha
items.armor.platearmor.desc=Enormes placas de metal são unidas para formar uma armadura que oferece uma proteção incomparável a qualquer aventureiro forte o suficiente para suportar o seu peso impressionante.
items.armor.platearmor.name=armadura de placas
items.armor.roguearmor.desc=Ao usar esta vestimenta escura, o Ladino pode executar uma habilidade especial.
items.armor.roguearmor.name=Fato de herói
items.armor.scalearmor.desc=As escamas de metal costuradas num colete de couro criam uma armadura flexível, mas protetora.
items.armor.scalearmor.name=armadura de escamas
items.armor.warriorarmor.desc=Ao usar esta armadura pesada, o Guerreiro pode executar uma habilidade especial.
items.armor.warriorarmor.name=armadura de placas do herói
items.artifacts.alchemiststoolkit.ac_brew=CERVEJA
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZAR
items.artifacts.alchemiststoolkit.cursed=O seu kit de ferramentas amaldiçoado impede-o de usar alquimia!
items.artifacts.alchemiststoolkit.desc=Este kit contém diversos reagentes e ervas, bem como um pequeno frasco para mistura, permitindo a prática de alquimia em qualquer lugar. O frasco contém o que parecem ser cristais de energia alquímica em forma líquida.
items.artifacts.alchemiststoolkit.desc_cursed=O kit de ferramentas amaldiçoado ligou-se a si e recusa-se a deixá-lo usar alquimia.
items.artifacts.alchemiststoolkit.desc_hint=O kit de ferramentas equipado está a gerar energia alquímica lentamente à medida que ganha experiência. Parece que a mistura no frasco poderia ser melhorada com a adição de cristais de energia.
items.artifacts.alchemiststoolkit.desc_warming=O kit de ferramentas está em fase de arranque e estará pronto a utilizar em breve.
items.artifacts.alchemiststoolkit.energize_1=6 de energia: +1 nível
items.artifacts.alchemiststoolkit.energize_all=Energia %1$d: +Níveis %2$d
items.artifacts.alchemiststoolkit.energize_desc=A cada 6 cristais de energia, o kit de ferramentas receberá energia suficiente para subir de nível, o que aumenta a taxa de geração de energia ao longo do tempo e a rapidez com que aquece. Quanta energia gostaria de utilizar?
items.artifacts.alchemiststoolkit.name=kit de ferramentas do alquimista
items.artifacts.alchemiststoolkit.need_energy=Precisa de pelo menos 6 pontos de energia para isso.
items.artifacts.alchemiststoolkit.not_ready=O seu conjunto de ferramentas ainda não terminou de aquecer.
items.artifacts.artifact.cannot_wear_two=Não é possível utilizar dois artefactos iguais.
items.artifacts.artifact.curse_known=É possível sentir uma magia malévola à espreita dentro do artefacto.
items.artifacts.artifact.equip_cursed=O artefacto liga-se a si de uma forma dolorosa.
items.artifacts.artifact.need_to_equip=Precisa de equipar o seu artefacto para fazer isso.
items.artifacts.artifact.not_cursed=Este artefacto está livre de magia malévola.
items.artifacts.capeofthorns$thorns.desc=A sua capa está a irradiar energia, envolvendo-o num campo de força deflector!\n\nTodo o dano recebido é reduzido enquanto o efeito de espinhos estiver activo. Além disso, se o atacante estiver perto de si, a quantidade reduzida é reflectida de volta para o atacante.\n\nTurnos de espinhos restantes: %s.
items.artifacts.capeofthorns$thorns.inert=A sua capa volta a ficar inerte.
items.artifacts.capeofthorns$thorns.levelup=A sua capa está a ficar mais forte!
items.artifacts.capeofthorns$thorns.name=espinhos
items.artifacts.capeofthorns$thorns.radiating=A sua capa começa a irradiar energia, sente-se protegido!
items.artifacts.capeofthorns.desc=Estas chapas de metal colapsadas do DM-300 uniram-se formando uma capa rígida. Ela parece armazenar uma energia profunda; talvez contenha parte do poder do DM-300?
items.artifacts.capeofthorns.desc_active=A capa parece estar a libertar energia armazenada, irradiando uma energia protetora.
items.artifacts.capeofthorns.desc_inactive=A capa parece ter um peso reconfortante sobre os ombros, como se estivesse a ganhar energia com os danos que sofre.
items.artifacts.capeofthorns.name=cabo de espinhos
items.artifacts.chaliceofblood.ac_prick=ESPINHO
items.artifacts.chaliceofblood.desc=Este cálice de prata brilhante é curiosamente adornado com gemas afiadas na borda.
items.artifacts.chaliceofblood.desc_1=Ao segurar o cálice, sente uma estranha compulsão para se picar nas pedras afiadas.
items.artifacts.chaliceofblood.desc_2=Parte do seu sangue acumula-se no cálice, e sente subtilmente o cálice a fornecer-lhe energia vital, aumentando a sua regeneração natural da saúde. Mesmo sabendo que vai doer, ainda sente vontade de se cortar no cálice.
items.artifacts.chaliceofblood.desc_3=O cálice está repleto da sua essência vital. Pode sentir o cálice a derramar energia vital de volta para si.
items.artifacts.chaliceofblood.desc_cursed=O cálice amaldiçoado prendeu-se à sua mão e está a impedir a sua capacidade de regenerar a saúde.
items.artifacts.chaliceofblood.name=cálice de sangue
items.artifacts.chaliceofblood.no=Não, mudei de ideias.
items.artifacts.chaliceofblood.ondeath=O Cálice suga toda a sua essência vital...
items.artifacts.chaliceofblood.onprick=Espeta-se e a sua essência vital escorre para o cálice.
items.artifacts.chaliceofblood.prick_warn=Cada vez que utiliza o cálice, este drena mais da sua energia vital, mas em troca, aumenta ainda mais a sua regeneração natural de saúde. Atualmente, espetar-se causa dano de _%1$d a %2$d_, embora este dano possa ser reduzido por _bloqueio físico e mágico ou redução de dano_. Sem considerar os efeitos de redução de dano, o espetar-se tem atualmente uma hipótese de _%3$s%%_ de drenar completamente a sua força vital. Tem a certeza de que quer oferecer mais energia vital ao cálice?
items.artifacts.chaliceofblood.yes=Sim, eu sei o que estou a fazer.
items.artifacts.cloakofshadows$cloakstealth.desc=O seu manto das sombras concede-lhe invisibilidade enquanto estiver envolto por ele. Permanecerá invisível até que o efeito seja cancelado ou que a carga do manto se esgote. Enquanto estiver invisível, os inimigos não poderão atacá-lo ou segui-lo. Ataques físicos e efeitos mágicos (como pergaminhos e varinhas) cancelarão imediatamente a invisibilidade. Turnos até à utilização da carga: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=A sua capa está a ficar mais forte!
items.artifacts.cloakofshadows$cloakstealth.name=camuflado
items.artifacts.cloakofshadows$cloakstealth.no_charge=A sua capa ficou sem energia.
items.artifacts.cloakofshadows.ac_stealth=FURTIVIDADE
items.artifacts.cloakofshadows.cooldown=A tua capa precisa de mais rondas (%d) para recarregar.
items.artifacts.cloakofshadows.cursed=Não pode usar uma capa amaldiçoada.
items.artifacts.cloakofshadows.desc=Uma capa mágica de valor inestimável, roubada do arsenal real há muitos anos pelo Ladino. Quando utilizada, permite que o ladino fique completamente invisível durante um curto período. Quanto mais a capa for utilizada, mais forte se tornará, permitindo que o Ladino se torne invisível com mais frequência e durante períodos mais longos.
items.artifacts.cloakofshadows.discover_hint=Um dos heróis começa com este item.
items.artifacts.cloakofshadows.name=manto das sombras
items.artifacts.cloakofshadows.no_charge=A sua capa ainda não recarregou o suficiente para ser utilizável.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Como sobreviveu a isso?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Quem me dera ter um destes...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Uau! Você ainda está vivo!
items.artifacts.driedrose$ghosthero.def_verb=esquivou-se
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Lamento... boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Finalize isto... sem mim...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Não... não posso...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Boa sorte...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Cansado... por enquanto...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Eu voltarei...
items.artifacts.driedrose$ghosthero.desc=Uma figura etérea de aparência frágil com forma humanoide. O seu poder parece estar ligado à rosa que possui. \n\nEste fantasma pode não ser grande coisa, parece ser o teu único amigo verdadeiro aqui em baixo.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Por que razão isso está a acontecer? Eu pensei que tínhamos conseguido!
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Como é que esta coisa ainda consegue influenciar este mundo?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Espero que saiba o que está a fazer com este amuleto.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Imagino que ainda não tenhamos terminado.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Já chegámos tão longe, podemos terminar isto!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Só mais um bocadinho e conseguiremos sair daqui!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Não há humanos ou anões aqui há muito tempo.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=O que levaria os anões a abandonar uma mina de ouro?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=É uma pena que todo o ouro aqui seja inútil à primeira vista.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=As criaturas daqui são deformadas, assim como as dos esgotos.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Até os morcegos são sedentos de sangue por aqui.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Não há sinal de qualquer equipamento de mineração; será que os anões recuperaram tudo?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Os anões eram trabalhadores, mas gananciosos.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Então a metrópole dos anões caiu mesmo.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Espero que a superfície nunca acabe como este lugar.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Os anões não deveriam ter um aspeto tão pálido.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Não sei o que é pior, se os anões ou as suas criações.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Parece que agora os anões também são monstros sem cérebro.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Que lugar é este?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Este lugar é aterrador...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=O que estavam os anões a pensar, brincando com o poder desta maneira?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Os monstros daqui são de outro mundo, de onde vieram?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Consegue sentir? É como se algo nos estivesse a observar.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Ainda bem que há tochas, está tão escuro aqui!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Já ouvi histórias sobre este local, nada de bom.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Este lugar sempre foi mais uma masmorra do que uma prisão.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Não consigo imaginar o que aconteceu quando este local foi abandonado.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Parece que tanto os prisioneiros como os guardas se transformaram em monstros.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=O que poderá ser responsável por todos estes esqueletos?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Estas pessoas não precisavam de ter terminado assim...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Estes esgotos costumavam ser seguros, as pessoas até viviam aqui no inverno.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Gostaria de saber o que aconteceu às patrulhas da guarda, será que desistiram?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Tive família à superfície, espero que estejam em segurança.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Os guardas não conseguiram derrotar estes monstros, mas talvez nós consigamos.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Se até os esgotos são assim tão perigosos, fico a imaginar o que estará lá em baixo...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=O que poderá ter feito com que estes ratos e caranguejos crescessem tanto?
items.artifacts.driedrose$ghosthero.direct_prompt=O que devo fazer?
items.artifacts.driedrose$ghosthero.directed_attack_1=Certo, vou abordar essa questão.
items.artifacts.driedrose$ghosthero.directed_attack_2=Eu vou atender esse.
items.artifacts.driedrose$ghosthero.directed_attack_3=Envolvente...
items.artifacts.driedrose$ghosthero.directed_attack_4=Vamos apanhá-los!
items.artifacts.driedrose$ghosthero.directed_attack_5=Essa já tenho.
items.artifacts.driedrose$ghosthero.directed_follow_1=Certo, eu sigo-te.
items.artifacts.driedrose$ghosthero.directed_follow_2=Vou atrás de ti.
items.artifacts.driedrose$ghosthero.directed_follow_3=Seguindo-o...
items.artifacts.driedrose$ghosthero.directed_follow_4=Ok, vamos lá!
items.artifacts.driedrose$ghosthero.directed_follow_5=Pode contar comigo.
items.artifacts.driedrose$ghosthero.directed_position_1=Certo, vou manter essa posição.
items.artifacts.driedrose$ghosthero.directed_position_2=Eu irei lá e defenderei.
items.artifacts.driedrose$ghosthero.directed_position_3=Reposicionamento...
items.artifacts.driedrose$ghosthero.directed_position_4=Estou a caminho!
items.artifacts.driedrose$ghosthero.directed_position_5=Vou até lá.
items.artifacts.driedrose$ghosthero.discover_hint=Podes encontrar esse personagem com um artefacto específico.
items.artifacts.driedrose$ghosthero.hello=Olá novamente %s.
items.artifacts.driedrose$ghosthero.introduce=O meu espírito está ligado a esta rosa, ela era muito preciosa para mim, um presente do meu amor que deixei à superfície. Não posso regressar a ele, mas graças a ti tenho uma segunda oportunidade de completar a minha viagem. Quando puder, responderei ao seu apelo e lutarei ao seu lado. Enquanto tiver a rosa, poderei ouvir a sua voz, pelo que poderá usá-la para me guiar de longe. Espero que consigas onde eu falhei...
items.artifacts.driedrose$ghosthero.name=fantasma triste
items.artifacts.driedrose$ghosthero.player_killed_1=Não!...
items.artifacts.driedrose$ghosthero.player_killed_2=Eu não os pude ajudar...
items.artifacts.driedrose$ghosthero.player_killed_3=Não assim...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Só os anões construiriam uma máquina de mineração que matasse intrusos.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Aquilo é enorme...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Como é que esta coisa se manteve ativa durante tanto tempo?
items.artifacts.driedrose$ghosthero.seen_goo_1=Cuidado com a gosma!
items.artifacts.driedrose$ghosthero.seen_goo_2=Muitos dos meus amigos morreram por causa disso, chegou a hora da vingança!
items.artifacts.driedrose$ghosthero.seen_goo_3=Tal aberração não pode ter permissão para viver!
items.artifacts.driedrose$ghosthero.seen_king_1=Quando as pessoas dizem que o poder corrompe, é a isso que se referem.
items.artifacts.driedrose$ghosthero.seen_king_2=Ele é mais um lich do que um rei agora.
items.artifacts.driedrose$ghosthero.seen_king_3=Até mesmo na morte, os anões obedecem ao seu mestre.
items.artifacts.driedrose$ghosthero.seen_tengu_1=O único prisioneiro que resta é um assassino mortal. Claro...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Ele prendeu-nos!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Já ouvi histórias terríveis sobre esta máscara...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, isso não parece nada bem.
items.artifacts.driedrose$ghosthero.seen_yog_2=Então é assim que um deus se parece?
items.artifacts.driedrose$ghosthero.seen_yog_3=Isto vai doer...
items.artifacts.driedrose$petal.desc=Uma pétala frágil e ressequida, que de alguma forma sobreviveu até aqui, no interior da masmorra.
items.artifacts.driedrose$petal.levelup=Junta-se a pétala à rosa.
items.artifacts.driedrose$petal.maxlevel=A rosa está pronta!
items.artifacts.driedrose$petal.name=pétala seca
items.artifacts.driedrose$petal.no_room=Não há mais espaço para esta pétala, por isso descarta-a.
items.artifacts.driedrose$petal.no_rose=Não tem nenhuma rosa para adicionar essa pétala.
items.artifacts.driedrose$wndghosthero.armor_prompt=Selecione uma armadura
items.artifacts.driedrose$wndghosthero.cant_cursed=O fantasma só pode usar equipamento que tenhas a certeza de que não estão amaldiçoados.
items.artifacts.driedrose$wndghosthero.cant_strength=O fantasma não é forte o suficiente para usar isto.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=O fantasma pode não ser forte o suficiente para usar isto.
items.artifacts.driedrose$wndghosthero.cant_unique=O fantasma não pode usar itens únicos.
items.artifacts.driedrose$wndghosthero.desc=O fantasma é fraco por si só, mas a sua forma é sólida o suficiente para ser equipado com armas e armaduras. Ele poderá usar estes itens assim como você. O fantasma pode equipar itens que exijam até _%d de força. _
