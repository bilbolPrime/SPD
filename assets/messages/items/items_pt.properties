items.weapon.curses.explosive.warm=Quente...
items.weapon.curses.friendly.desc=As armas amigáveis são mais adequadas para os pacifistas, desencadeando ocasionalmente magia que torna o combate impossível.
items.weapon.curses.friendly.elestrike_desc=Um ataque elemental com uma maldição aliada tem 50% de hipóteses de enfeitiçar cada inimigo ao alcance durante 6 turnos.
items.weapon.curses.friendly.name=amigável %s
items.weapon.curses.polarized.desc=Uma arma polarizada é afetada por magia, fazendo com que o seu ataque cause mais 50% de dano ou nenhum dano.
items.weapon.curses.polarized.elestrike_desc=Um ataque elemental com uma maldição polarizada tem 50% de hipóteses de causar 24 a 36 de dano a cada inimigo dentro do alcance.
items.weapon.curses.polarized.name=polarizado %s
items.weapon.curses.sacrificial.desc=As armas sacrificiais exigirão sangue do portador em troca de ataques contra os inimigos. Quanto mais saudável estiver o portador, mais sangue a maldição consumirá.
items.weapon.curses.sacrificial.elestrike_desc=Um ataque elemental com uma maldição sacrificial faz com que o herói e cada inimigo ao alcance sangrem, perdendo 12 pontos de vida.
items.weapon.curses.sacrificial.name=sacrificial %s
items.weapon.curses.wayward$waywardbuff.desc=A magia da sua arma descontrolada foi ativada, tornando-a extremamente imprecisa durante um curto período. Note que isto não afeta ataques com acerto garantido, como ataques surpresa. Atacar com sucesso usando a arma descontrolada removerá este efeito imediatamente.
items.weapon.curses.wayward$waywardbuff.name=rebelde
items.weapon.curses.wayward.desc=As armas descontroladas podem, por vezes, tornar-se extremamente imprecisas. Esta magia dura pouco tempo após ser activada, mas pode ser dissipada ao acertar um golpe com a arma descontrolada.
items.weapon.curses.wayward.elestrike_desc=Um ataque elemental com uma maldição descontrolada tem 50% de hipóteses de amaldiçoar cada inimigo no alcance durante 6 turnos.
items.weapon.curses.wayward.name=%s desgarrado
items.weapon.enchantments.blazing.desc=Este encantamento faz com que as chamas jorrem de uma arma, incendiando os inimigos e causando dano bónus a quem já está em chamas.
items.weapon.enchantments.blazing.elestrike_desc=Um ataque elemental com um encantamento flamejante espalha fogo por todos os quadrados ao alcance, com uma duração de 8 turnos.
items.weapon.enchantments.blazing.name=flamejante %s
items.weapon.enchantments.blocking$blockbuff.desc=O encantamento de bloqueio da sua arma concedeu um breve aumento ao seu poder defensivo!\n\nEscudo restante: %d\n\nTurnos restantes: %s.
items.weapon.enchantments.blocking$blockbuff.name=bloqueio
items.weapon.enchantments.blocking.desc=As armas de bloqueio têm uma hipótese de te proteger brevemente após um ataque.
items.weapon.enchantments.blocking.elestrike_desc=Um ataque elemental com um encantamento de bloqueio concede ao Duelista 6 de escudo adicional por cada inimigo ao alcance.
items.weapon.enchantments.blocking.name=bloqueando %s
items.weapon.enchantments.blooming.desc=As armas florescentes contêm magia que fará com que a vegetação brote sobre ou em redor daqueles que são atingidos por elas.
items.weapon.enchantments.blooming.elestrike_desc=Um ataque elemental com um encantamento de florescimento espalha erva num raio de até 8 quadrados e imobiliza todos os inimigos dentro do alcance durante 6 turnos.
items.weapon.enchantments.blooming.name=florescente %s
items.weapon.enchantments.chilling.desc=Os inimigos atingidos por este encantamento ficam congelados, tendo os seus movimentos e ataques reduzidos.
items.weapon.enchantments.chilling.elestrike_desc=Um ataque elemental com um encantamento gélido espalha ar gélido por todos os quadrados dentro do alcance, com a duração de 8 turnos.
items.weapon.enchantments.chilling.name=arrepiante %s
items.weapon.enchantments.corrupting.desc=Este poderoso encantamento possui a capacidade de fazer com que os inimigos se submetam à sua vontade. Quando um inimigo é morto com esta arma, existe a possibilidade de que seja corrompido em vez de morrer.
items.weapon.enchantments.corrupting.elestrike_desc=Um ataque elemental com um encantamento corruptor tem 5 a 25% de hipóteses (com base nos pontos de vida perdidos) de corromper todos os inimigos dentro do alcance, excepto o alvo principal.
items.weapon.enchantments.corrupting.name=corrompendo %s
items.weapon.enchantments.elastic.desc=As armas elásticas têm uma hipótese de atirar os inimigos para trás a curtas distâncias.
items.weapon.enchantments.elastic.elestrike_desc=Um ataque elemental com encantamento elástico empurra todos os inimigos dentro do alcance 5 quadrados para trás.
items.weapon.enchantments.elastic.name=elástico %s
items.weapon.enchantments.grim.desc=Este poderoso encantamento possui o poder de executar um inimigo instantaneamente. O efeito é mais provável de ocorrer quanto mais fraco for o inimigo.
items.weapon.enchantments.grim.elestrike_desc=Um ataque elemental com um encantamento sombrio tem 6 a 30% de hipóteses (com base nos pontos de vida perdidos) de matar todos os inimigos dentro do alcance, excepto o alvo principal.
items.weapon.enchantments.grim.name=sombrio %s
items.weapon.enchantments.kinetic$conserveddamage.desc=A sua arma armazenou o excesso de força de um golpe fatal anterior e irá aplicá-la como dano bónus ao seu próximo ataque. No entanto, a energia dissipar-se-á lentamente com o tempo. \n\nDano Conservado: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=danos conservados
items.weapon.enchantments.kinetic.desc=Quando um inimigo é morto com uma arma cinética, qualquer excesso de força é armazenado na arma e será aplicado no próximo ataque bem sucedido.
items.weapon.enchantments.kinetic.elestrike_desc=Um ataque elemental com encantamento cinético aplica 40% do dano armazenado a cada inimigo dentro do alcance, exceto ao alvo principal.
items.weapon.enchantments.kinetic.name=cinética %s
items.weapon.enchantments.lucky.desc=Os inimigos mortos por uma arma da sorte têm uma probabilidade de deixar cair itens extra.
items.weapon.enchantments.lucky.elestrike_desc=Um ataque elemental com um encantamento de sorte tem 12,5% de hipóteses de gerar itens sob cada inimigo no alcance. Este efeito só pode ser ativado uma vez por inimigo.
items.weapon.enchantments.lucky.name=sortudo %s
items.weapon.enchantments.projecting.desc=Com este encantamento, as armas de combate corpo a corpo terão um alcance maior. As armas de longo alcance atravessarão paredes ao serem apontadas para alvos próximos.
items.weapon.enchantments.projecting.elestrike_desc=Um ataque elemental com um encantamento de projeção causa 30% de dano a cada inimigo no alcance, exceto ao alvo principal.
items.weapon.enchantments.projecting.name=projetando %s
items.weapon.enchantments.shocking.desc=Os arcos elétricos emanam de uma arma de choque, causando dano extra a todos os inimigos que se encontrem nas proximidades.
items.weapon.enchantments.shocking.elestrike_desc=Um ataque elemental com um encantamento chocante espalha eletricidade por todos os quadrados ao alcance, com uma duração de 8 turnos.
items.weapon.enchantments.shocking.name=chocante %s
items.weapon.enchantments.unstable.desc=Este encantamento irradia energia caótica, atuando como um encantamento diferente a cada golpe.
items.weapon.enchantments.unstable.elestrike_desc=Um ataque elemental com um encantamento instável aplica um efeito de encantamento aleatório a cada inimigo dentro do alcance, exceto ao alvo principal.
items.weapon.enchantments.unstable.name=instável %s
items.weapon.enchantments.vampiric.desc=Este poderoso encantamento drena a força vital dos inimigos a cada golpe, canalizando-a de volta para o utilizador. O efeito é tanto mais forte quanto menor for a saúde do utilizador.
items.weapon.enchantments.vampiric.elestrike_desc=Um ataque elemental com encantamento vampírico cura o Duelista em 2,5 PV por cada inimigo ao alcance.
items.weapon.enchantments.vampiric.name=vampírico %s
items.weapon.melee.assassinsblade.ability_desc=A Duelista pode esgueirar-se enquanto empunha uma lâmina de assassina. Esta habilidade permite à Duelista teletransportar-se instantaneamente até 3 quadrados de distância e concede-lhe _%d turnos de invisibilidade._
items.weapon.melee.assassinsblade.ability_name=esgueirar-se
items.weapon.melee.assassinsblade.desc=Uma pequena lâmina ondulada feita de obsidiana, difícil de usar apesar de ser leve, mas mortal se atingir o alvo certo.
items.weapon.melee.assassinsblade.name=lâmina de assassino
items.weapon.melee.assassinsblade.stats_desc=Esta arma é mais eficaz contra inimigos incautos.
items.weapon.melee.assassinsblade.typical_ability_desc=A Duelista pode esgueirar-se enquanto empunha uma lâmina de assassina. Esta habilidade permite à Duelista teletransportar-se instantaneamente até 3 quadrados de distância e geralmente concede-lhe _%d turnos de invisibilidade._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Duração da habilidade
items.weapon.melee.battleaxe.ability_desc=O Duelista pode desferir um _golpe pesado_ com um machado de batalha. Este ataque concentrado causa _%1$d-%2$d de dano_ se surpreender o inimigo e o atordoar durante 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado acerta sempre, mas causa dano normal se não surpreender o inimigo.
items.weapon.melee.battleaxe.ability_name=golpe forte
items.weapon.melee.battleaxe.desc=A enorme cabeça de aço deste machado de batalha confere um peso considerável a cada golpe largo.
items.weapon.melee.battleaxe.name=machado de batalha
items.weapon.melee.battleaxe.stats_desc=Esta é uma arma bastante precisa.
items.weapon.melee.battleaxe.typical_ability_desc=O Duelista pode desferir um _golpe pesado_ com um machado de batalha. Este ataque concentrado causa normalmente _%1$d-%2$d de dano_ se surpreender o inimigo, e atordoa-o durante 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado acerta sempre, mas causa dano normal se não surpreender o inimigo.
items.weapon.melee.crossbow$chargedshot.desc=A Duelista está a concentrar poder na sua besta. O próximo ataque que ela fizer com ela irá sempre acertar e aplicar um de três efeitos: \n - Os ataques corpo a corpo atirarão os inimigos a alguns quadrados de distância. \n - Dardos sem ponta causarão dano bónus. \n - Os dardos com ponta ganharão utilizações extra e aplicarão o seu efeito numa área de 7x7. Os efeitos positivos dos dardos apenas afetarão os aliados, e os efeitos negativos aplicar-se-ão apenas aos inimigos. A Duelista não pode utilizar esta capacidade para aplicar efeitos positivos de dardos a si própria.
items.weapon.melee.crossbow$chargedshot.name=cobrado
items.weapon.melee.crossbow.ability_desc=A Duelista pode _carregar_ a sua besta, fazendo com que o seu próximo ataque normal com ela acerte sempre e aplique um dos três efeitos: os ataques corpo a corpo empurrarão os inimigos para longe, os dardos sem ponta causarão _+%1$d de dano_, e os dardos com ponta aplicarão o seu efeito numa área de 7x7 e durarão _%2$d utilizações adicionais_.
items.weapon.melee.crossbow.ability_name=tiro carregado
items.weapon.melee.crossbow.desc=Uma arma bastante complexa que dispara virotes a velocidades excepcionais. Embora não tenha sido concebida para tal, o peso e a construção robusta desta besta também a tornam uma arma de combate corpo a corpo decente.
items.weapon.melee.crossbow.name=besta
items.weapon.melee.crossbow.stats_desc=Esta arma melhora os dardos arremessados para causar _%1$d-%2$d de dano_ quando equipada, e ainda lhes concede o seu encantamento.
items.weapon.melee.crossbow.typical_ability_desc=A Duelista pode _carregar_ a sua besta, fazendo com que o seu próximo ataque normal com ela acerte sempre e aplique um dos três efeitos: os ataques corpo a corpo empurrarão os inimigos para longe, os dardos sem ponta normalmente causarão _+%1$d de dano_, e os dardos com ponta aplicarão o seu efeito numa área de 7x7 e normalmente durarão _%2$d utilizações adicionais_.
items.weapon.melee.crossbow.typical_stats_desc=Normalmente, esta arma melhora os dardos lançados para causar _%1$d-%2$d de dano_ quando equipada, e até lhes concede o seu encantamento.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Aumento de Habilidade
items.weapon.melee.cudgel.ability_desc=O Duelista pode desferir um _golpe pesado_ com um cacete. Este ataque concentrado causa _%1$d-%2$d de dano_ se surpreender o inimigo e o atordoar durante 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado acerta sempre, mas causa dano normal se não surpreender o inimigo.
items.weapon.melee.cudgel.ability_name=golpe forte
items.weapon.melee.cudgel.desc=Uma pequena maça de latão, feita mais como uma ferramenta de autodefesa para os nobres do que como uma arma para os aventureiros.
items.weapon.melee.cudgel.discover_hint=Um dos heróis começa com este item.
items.weapon.melee.cudgel.name=porrete
