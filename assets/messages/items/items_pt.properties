items.weapon.curses.displacing.desc=As armas de deslocamento estão imbuídas com magia de teletransporte caótica, possuindo a capacidade de teletransportar os inimigos pelo chão de forma aleatória.
items.weapon.curses.displacing.elestrike_desc=Um ataque elemental com uma maldição de deslocamento tem 50% de hipóteses de teletransportar cada inimigo dentro do alcance.
items.weapon.curses.displacing.name=deslocando %s
items.weapon.curses.explosive.desc=As armas explosivas acumulam energia gradualmente e explodem, danificando tudo o que estiver por perto.
items.weapon.curses.explosive.desc_cool=A sua arma está fria ao toque neste momento.
items.weapon.curses.explosive.desc_hot=A sua arma está quente! Ela está prestes a explodir!
items.weapon.curses.explosive.desc_warm=A sua arma está a acumular energia e a aquecer...
items.weapon.curses.explosive.elestrike_desc=Um ataque elemental com maldição explosiva tem 50% de hipóteses de causar uma explosão a um inimigo aleatório dentro do alcance.
items.weapon.curses.explosive.hot=Quente!
