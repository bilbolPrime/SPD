items.rings.ringofaccuracy.upgrade_stat_name_1=Aumento de Precisão
items.rings.ringofarcana.combined_stats=Os anéis equipados por ti estão a combinar os teus poderes, aumentando o poder dos encantamentos e dos glifos em _%s%%_ no total.
items.rings.ringofarcana.desc=Este anel melhora os encantamentos mágicos nas armas e os glifos nas armaduras, incluindo maldições! Primeiro, aumenta a probabilidade de ativação e, em seguida, aumenta a força do efeito quando a probabilidade de ativação atinge os 100%. Um anel amaldiçoado, por outro lado, enfraquecerá encantamentos, glifos e maldições.
items.rings.ringofarcana.name=anel arcano
items.rings.ringofarcana.stats=Ao ser utilizado, este anel aumentará o poder dos encantamentos e dos glifos em _%s%%._
items.rings.ringofarcana.typical_stats=Quando utilizado, este anel irá normalmente aumentar o poder dos encantamentos e glifos em _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Aumento de Arcana
items.rings.ringofelements.combined_stats=Os seus anéis equipados estão a combinar os seus poderes, fornecendo uma resistência elementar total de _%s%%_.
items.rings.ringofelements.desc=Este anel protege contra vários elementos, como fogo, eletricidade e gases. Também reduz a duração dos efeitos negativos.
items.rings.ringofelements.name=anel de elementos
items.rings.ringofelements.stats=Quando utilizado, este anel proporcionará uma resistência elementar de _%s%%_.
items.rings.ringofelements.typical_stats=Quando utilizado, este anel irá normalmente fornecer uma resistência elementar de _%s%%_.
items.rings.ringofelements.upgrade_stat_name_1=Resistência
items.rings.ringofenergy.combined_stats=Os seus anéis equipados estão a combinar os seus poderes, aumentando a velocidade de carregamento em _%s%%_ no total.
items.rings.ringofenergy.desc=O seu equipamento mágico recarregará mais rapidamente no campo arcano que emana deste anel. Um anel amaldiçoado, por outro lado, terá uma recarga mais lenta.
items.rings.ringofenergy.name=anel de energia
items.rings.ringofenergy.stats=Ao ser equipado, este anel aumentará a velocidade de carregamento de varinhas, artefactos e armaduras heroicas em _%s%%._
items.rings.ringofenergy.typical_stats=Quando equipado, este anel irá normalmente aumentar a velocidade de carregamento de varinhas, artefactos e armaduras heroicas em _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Reforço de carga
items.rings.ringofevasion.combined_stats=Os anéis que equipou estão a combinar os seus poderes, aumentando a sua evasão em _%s%%_ no total.
items.rings.ringofevasion.desc=Este anel aumenta a probabilidade de se esquivar dos ataques inimigos.
items.rings.ringofevasion.name=anel de evasão
items.rings.ringofevasion.stats=Ao ser utilizado, este anel aumentará a sua evasão em _%s%%._
items.rings.ringofevasion.typical_stats=Quando utilizado, este anel irá normalmente aumentar a sua evasão em _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Aumento da evasão
items.rings.ringofforce$brawlersstance.desc=Nesta postura, os ataques normais da Duelista utilizarão o anel de força equipado, mesmo quando esta tiver uma arma na mão. Estes ataques recebem dano bónus e ainda usarão o melhoramento e o encantamento da arma. Manter esta postura exige concentração, reduzindo a velocidade de recarga das habilidades da arma em 50%. Esta postura pode ser ativada ou desativada utilizando um anel de força, mas a redução da velocidade de recarga persistirá durante um curto período se a postura for ativada e desativada rapidamente.
items.rings.ringofforce$brawlersstance.name=postura do brigão
items.rings.ringofforce.ability_desc=A Duelista pode adotar uma postura de brigão com este anel, fazendo com que os seus ataques normais utilizem sempre este anel, mesmo com uma arma equipada. Estes ataques causarão dano de %1$d a %2$d e também herdarão o encantamento e o melhoramento da arma. Esta postura reduz a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.ability_name=postura do brigão
items.rings.ringofforce.combined_stats=Os anéis equipados estão a combinar os seus poderes, causando um total de _%1$d-%2$d de dano_ sem uma arma, ou aumentando o dano em _%3$d_ com uma.
items.rings.ringofforce.desc=Este anel aumenta a força dos golpes corpo a corpo do utilizador. Este poder extra é relativamente fraco quando se empunham armas, mas um ataque desarmado tornar-se-á muito mais forte. Um anel amaldiçoado, por outro lado, enfraquecerá os golpes do utilizador.
items.rings.ringofforce.name=anel de força
items.rings.ringofforce.stats=Quando desarmado, com a sua força atual, este anel causará _%1$d-%2$d de dano. _ Com uma arma equipada, este anel aumentará o dano em _%3$d. _
items.rings.ringofforce.typical_ability_desc=A Duelista pode adotar uma postura de brigão com este anel, fazendo com que os seus ataques normais utilizem sempre este anel, mesmo com uma arma equipada. Estes ataques normalmente causarão dano de %1$d a %2$d e também herdarão o encantamento e o melhoramento da arma. Esta postura reduz a velocidade de recarga da arma em 50%%.
items.rings.ringofforce.typical_stats=Quando desarmado, com a sua força actual, este anel causará normalmente de _%1$d a _%2$d de dano. _ Com uma arma equipada, este anel irá normalmente aumentar o dano em _%3$d. _
items.rings.ringofforce.upgrade_stat_name_1=Dano Desarmado
items.rings.ringofforce.upgrade_stat_name_2=Aumento de dano armado
items.rings.ringofforce.upgrade_stat_name_3=Dano de Habilidade
items.rings.ringoffuror.combined_stats=Os anéis equipados por ti estão a combinar os teus poderes, aumentando a velocidade dos teus ataques num total de _%s%%_.
items.rings.ringoffuror.desc=Este anel concede ao utilizador uma fúria interior, permitindo-lhe atacar mais rapidamente. Um anel amaldiçoado, por outro lado, diminuirá a velocidade de ataque do utilizador.
items.rings.ringoffuror.name=anel de furor
items.rings.ringoffuror.stats=Ao ser utilizado, este anel aumentará a velocidade dos seus ataques em _%s%%._
items.rings.ringoffuror.typical_stats=Quando utilizado, este anel irá normalmente aumentar a velocidade dos seus ataques em _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Aumento da velocidade de ataque
