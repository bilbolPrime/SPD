items.weapon.spiritbow.ac_shoot=TIROTEIO
items.weapon.spiritbow.desc=Um arco feito de madeira mágica ancestral. A corda e as gravuras do arco brilham com uma luz azul pálida. Ao puxar a corda, este arco lança uma flecha mágica que pode ser disparada contra um inimigo.
