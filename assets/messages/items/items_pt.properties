items.weapon.spiritbow.stats=O arco não pode ser melhorado diretamente, mas ficará cada vez mais forte à medida que sobe de nível. No seu nível atual, as flechas disparadas pelo arco causarão _%1$d-%2$d de dano_ e exigirão _%3$d de força_ para serem utilizadas corretamente.
items.weapon.weapon$enchantment.discover_hint=Podes encontrar um item com este efeito aleatoriamente na masmorra, ou tentar aplicá-lo a um item tu próprio.
items.weapon.weapon$enchantment.enchant=encantamento
items.weapon.weapon$enchantment.rankings_desc=Morto por um encantamento
items.weapon.weapon.cursed=É possível sentir uma magia maléfica à espreita dentro desta arma.
items.weapon.weapon.cursed_worn=Como esta arma está amaldiçoada, não tem poder para a remover.
items.weapon.weapon.enchant_hardened=Foi endurecido.
items.weapon.weapon.enchanted=Possui um _%s._
items.weapon.weapon.excess_str=Devido à sua força excessiva, causará _0-%d de dano bónus_ com esta arma.
items.weapon.weapon.faster=Foi melhorado para melhorar a velocidade.
items.weapon.weapon.hardened_no_enchant=Esta arma foi _endurecida_, mas atualmente não está encantada.
items.weapon.weapon.hardening_gone=O revestimento endurecido desta arma desgastou-se!
items.weapon.weapon.identify=Agora já está familiarizado o suficiente com a sua arma para a identificar.
items.weapon.weapon.incompatible=A interação de diferentes tipos de magia anulou o encantamento desta arma!
items.weapon.weapon.not_cursed=Esta arma está livre de magia malévola.
items.weapon.weapon.stronger=É melhorado para aumentar o dano.
items.weapon.weapon.too_heavy=Devido à sua força insuficiente, esta arma irá prejudicar a sua velocidade de ataque, precisão e capacidade de realizar ataques surpresa.
items.weapon.weapon.weak_cursed=Apesar da maldição, podes desequipar esta arma.

items.keys.skeletonkey.desc=Esta chave parece séria: a sua cabeça tem a forma de uma caveira. Provavelmente ela abre alguma porta séria.
items.weapon.missiles.bombarrow.desc=Uma flecha com uma bomba acoplada. Mantenha a distância.
items.weapon.missiles.bombarrow.name=flecha bomba
items.weapon.missiles.missileweapon.damage_desc=Esta arma causa de _%1$d_ a _%2$d_ de dano por golpe.
items.bags.seedpouch.desc=Esta pequena bolsa de veludo permite guardar qualquer quantidade de sementes. Muito prática.
items.bags.seedpouch.name=saco de sementes
items.potions.potionofmight.desc=Este líquido poderoso percorre os músculos, aumentando permanentemente a força em um ponto e a saúde em cinco.
items.potions.potionofmight.name=Poção do Poder
items.rings.ringofdetection.desc=Este anel permite detetar armadilhas e portas secretas sem perder tempo a procurar. Um anel degradado embota os sentidos e torna os segredos mais difíceis de descobrir, mesmo quando se procura por eles.
items.rings.ringofdetection.name=Anel de Detecção
items.rings.ringofhaggler.desc=Este anel não tem qualquer poder mágico, mas mostra aos comerciantes que o seu dono pertence à Guilda dos Ladrões. Costumam oferecer um desconto em troca da promessa de serem deixados em paz durante algum tempo. Melhorar o anel não traz mais benefícios.
items.rings.ringofhaggler.name=Anel do Negociador
items.rings.ringofherbalism.desc=Este anel aumenta a probabilidade de encontrar orvalho e sementes ao pisar a erva.
items.rings.ringofherbalism.name=Anel de Herbalismo
items.rings.ringofmending.desc=Este anel melhora a regeneração do corpo, permitindo recuperar a saúde mais depressa. Um anel degradado abranda ou até interrompe a regeneração natural.
items.rings.ringofmending.name=anel de regeneração
items.rings.ringofpower.desc=O campo de energia deste anel torna as varinhas mais poderosas. Um anel degradado enfraquece-as.
items.rings.ringofpower.name=Anel do Poder
items.rings.ringofsatiety.desc=Este anel permite passar mais tempo sem comer. Um anel degradado tem o efeito contrário.
items.rings.ringofsatiety.name=Anel da Saciedade
items.rings.ringofshadows.desc=Os inimigos terão menos probabilidade de reparar em ti se estiveres a usar este anel. Anéis de sombras degradados alertarão os inimigos que, de outra forma, poderiam não se ter apercebido da sua presença.
items.rings.ringofshadows.name=Anel das Sombras
items.rings.ringofthorns.desc=Este anel não tem espinhos verdadeiros, mas um inimigo que ataque quem o usa sofre parte do dano que inflige. Melhorar o anel não traz mais benefícios.
items.rings.ringofthorns.name=Anel de Espinhos
items.scrolls.scrollofchallenge.desc=Ao ser lido em voz alta, este pergaminho irá libertar um rugido desafiante que despertará todos os monstros e os alertará para a localização do leitor.
items.scrolls.scrollofchallenge.name=pergaminho de desafio
items.scrolls.scrollofenchantment.desc=Este pergaminho é capaz de imbuir uma arma ou armadura com um encantamento aleatório, concedendo-lhe um poder especial.
items.scrolls.scrollofenchantment.name=pergaminho de encantamento
items.scrolls.scrollofpsionicblast.desc=Este pergaminho contém energia destrutiva que pode ser canalizada psionicamente para infligir danos maciços a todas as criaturas dentro do campo de visão. Um clarão de luz concomitante cegará temporariamente todos os que se encontram na área de efeito, incluindo o leitor do pergaminho.
items.scrolls.scrollofpsionicblast.name=pergaminho de explosão psíquica
items.scrolls.scrollofwipeout.desc=Lê este pergaminho para libertar a fúria dos espíritos da masmorra, matando tudo no nível atual. Bem, quase tudo. Algumas das criaturas mais poderosas podem não ser afetadas.
items.scrolls.scrollofwipeout.name=pergaminho de aniquilação
items.wands.wandofblink.desc=Esta varinha permite teleportar-se na direção escolhida. As criaturas e os obstáculos bloqueiam a teleportação.
items.wands.wandofblink.name=varinha de teletransporte
items.wands.wandoffirebolt.desc=Esta varinha lança rajadas de fogo mágico. Incendeia o terreno inflamável e fere e queima as criaturas atingidas.
items.wands.wandoffirebolt.name=Varinha de Raio de Fogo
