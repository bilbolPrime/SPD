items.waterskin.collected=Recolhe a gota de orvalho no seu odre de água.
items.waterskin.desc=Um recipiente para líquidos, feito de couro e corda, selado com uma rolha de cortiça.
items.waterskin.desc_full=O odre cheio parece irradiar energia; talvez possa ser usado para abençoar outro item de sobrevivência?
items.waterskin.desc_heal=O odre está a ser utilizado para armazenar água curativa. Quanto mais cheio estiver, mais se sentirá curado(a) ao beber dela. Só beberá a quantidade necessária.
items.waterskin.desc_water=Neste momento, o cantil contém apenas água potável. Há certamente algo na masmorra que o cantil poderia armazenar.
items.waterskin.discover_hint=Um dos heróis começa com este item.
