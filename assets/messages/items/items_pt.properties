items.weapon.melee.scimitar$sworddance.desc=A Duelista executa golpes rápidos baseados no impulso, numa espécie de dança. Enquanto esta postura estiver ativa, ataca 60%% mais rapidamente (o suficiente para atacar exatamente duas vezes por turno com uma cimitarra) e tem +50%% de precisão.\n\nTurnos restantes: %s.
items.weapon.melee.scimitar$sworddance.name=dança da espada
items.weapon.melee.scimitar.ability_desc=O Duelista pode executar uma _dança de espadas_ com uma cimitarra. Esta postura é ativada instantaneamente e concede ao Duelista +60%% de velocidade de ataque e +50%% de precisão durante _%d turnos._
items.weapon.melee.scimitar.ability_name=dança da espada
items.weapon.melee.scimitar.desc=Uma lâmina grossa e curva. O seu formato permite ataques mais rápidos, mas menos potentes.
