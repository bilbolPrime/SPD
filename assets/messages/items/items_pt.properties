items.weapon.curses.annoying.desc=As armas irritantes são capazes de falar, mas são um pouco energéticas demais. Costumam chamar a atenção para si sem querer.
items.weapon.curses.annoying.elestrike_desc=Um ataque elemental com uma maldição irritante tem 20% de hipóteses de enlouquecer todos os inimigos ao alcance durante 6 turnos.
