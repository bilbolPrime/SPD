items.wands.wandofwarding.bad_location=Não pode colocar uma sentinela ali.
items.wands.wandofwarding.bmage_desc=Quando o _Mago de Batalha_ atinge um inimigo com um bastão de proteção, todas as proteções e sentinelas ativas têm uma probabilidade de serem curadas.
items.wands.wandofwarding.desc=Esta pequena varinha de metal tem uma gema roxa brilhante a flutuar acima da ponta.
items.wands.wandofwarding.eleblast_desc=Uma explosão elemental com um bastão de proteção cura todas as proteções e sentinelas na área da explosão.
items.wands.wandofwarding.name=varinha de proteção
items.wands.wandofwarding.no_more_wards=A sua varinha não consegue sustentar mais nenhuma proteção.
items.wands.wandofwarding.staff_name=equipa de enfermagem
items.wands.wandofwarding.stats_desc=Em vez de causar dano direto ao inimigo, esta varinha invoca sentinelas e proteções estacionárias. As sentinelas podem ser invocadas em qualquer lugar, até mesmo através de paredes, se tiver visão. Esta varinha pode manter sentinelas equivalentes a _%d de energia_ de cada vez.
items.wands.wandofwarding.upgrade_stat_name_1=Dano de sentinela
items.wands.wandofwarding.upgrade_stat_name_2=Energia Ward
