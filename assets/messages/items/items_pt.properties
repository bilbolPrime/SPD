items.weapon.curses.dazzling.desc=As armas deslumbrantes emitem por vezes uma luz ofuscante, cegando tudo o que as consegue ver.
items.weapon.curses.dazzling.elestrike_desc=Um ataque elemental com uma maldição deslumbrante tem 50% de hipóteses de cegar todos os inimigos ao alcance durante 6 turnos.
