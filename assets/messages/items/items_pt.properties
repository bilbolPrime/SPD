items.weapon.melee.flail.spin_warn=Já não consegue girar o mangual.
items.weapon.melee.flail.stats_desc=Esta é uma arma bastante imprecisa. \nEsta arma não pode realizar ataques surpresa.
items.weapon.melee.flail.typical_ability_desc=O Duelista pode rodar um mangual para acumular poder durante um curto período. A cada turno em que o mangual é rodado, normalmente causa +%d de dano no seu próximo ataque normal, até um máximo de 3 vezes. Um mangual giratório também garante o acerto. Apenas iniciar a rotação do mangual consome uma carga.
items.weapon.melee.gauntlet.ability_desc=O Duelista pode executar um _golpe combinado_ com uma manopla de pedra. Este ataque tem acerto garantido e causa _+%d de dano_ por cada vez que o Duelista acerta um ataque corpo a corpo ou com uma arma de arremesso normal. Se o Duelista não acertar durante 5 turnos, o combo é reiniciado.
items.weapon.melee.gauntlet.ability_name=golpe combinado
items.weapon.melee.gauntlet.desc=Esta enorme manopla é feita de tecido carmesim com pesadas camadas de pedra mágica sobrepostas. O tecido ajusta-se ao corpo, fazendo com que as grossas placas de pedra se assemelhem quase a uma segunda pele. Empunhar uma arma tão pesada exige força, mas confere uma potência tremenda aos golpes.
items.weapon.melee.gauntlet.name=manopla de pedra
items.weapon.melee.gauntlet.stats_desc=Esta é uma arma muito rápida.
items.weapon.melee.gauntlet.typical_ability_desc=O Duelista pode executar um _golpe combinado_ com uma manopla de pedra. Este ataque tem acerto garantido e normalmente causa _+%d de dano_ por cada vez que o Duelista acerta um ataque corpo a corpo ou com arma de arremesso. Se o Duelista não acertar durante 5 turnos, o combo é reiniciado.
items.weapon.melee.glaive.ability_desc=O Duelista pode usar a ponta de uma glaive para _espetar_ um inimigo que esteja ao alcance, mas não adjacente. Isto causa _%1$d-%2$d de dano_, empurra o inimigo para trás e tem acerto garantido.
