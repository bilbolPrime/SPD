items.armor.armor.seal_attached=O selo quebrado do Guerreiro está ligado a esta armadura. Quando ele estiver prestes a ser ferido com menos de metade da vida, ela conceder-lhe-á um escudo de _%d_.
items.armor.armor.seal_transfer=O selo quebrado do Guerreiro precisa de ser fixado à armadura que ele está a usar para que possa beneficiar dele. Deseja remover automaticamente o selo da armadura que está a tirar e fixá-lo na armadura que está a usar?
