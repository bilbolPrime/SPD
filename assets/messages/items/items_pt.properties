items.amulet.ac_end=TERMINE O JOGO
items.amulet.ascent_desc=Começa-se a sentir o grande e terrível poder de Yog-Dzewa a emanar do amuleto. Subir de volta pela masmorra como um mortal pode ser mais difícil do que imaginava! Se continuares a subir com o amuleto, a masmorra tornar-se-á mais perigosa, os teletransportes entre os andares serão desativados e só poderás vencer o jogo derrotando os inimigos à medida que sobes pela masmorra! Pode deixar o amuleto aqui por enquanto, se quiser subir sem iniciar este desafio, ou ativar o amuleto antes de subir para terminar o jogo normalmente.
items.amulet.ascent_no=Pare por agora.
items.amulet.ascent_title=Ascensão
items.amulet.ascent_yes=Continuar!
items.amulet.desc=O Amuleto de Yendor é o artefacto mais poderoso conhecido pelos humanos e anões. Os seus cristais cintilantes contêm um poder incrível e maravilhoso.
items.amulet.desc_ascent=A origem do amuleto é desconhecida, mas é evidente que foi fortemente influenciado pelo poder de Yog-Dzewa. A masmorra parece estar a curvar-se à vontade de Yog à medida que avanças, tornando os inimigos muito mais numerosos e poderosos! Também já não consegue ativar ou descartar o amuleto, quase como se estivesse amaldiçoado.
items.amulet.desc_origins=A origem do amuleto é desconhecida. Reza a história que o Rei dos Anões se gabou de o ter descoberto pouco antes de a civilização anã cortar todos os laços com os outros. Como é que ele o encontrou? Como é que Yog-Dzewa o tomou dele? Talvez estas sejam questões para outra ocasião; o que importa agora é que o amuleto é teu!
items.amulet.discover_hint=Podes encontrar este item no fundo da masmorra...
items.amulet.name=amuleto de yendor
items.ankh.ac_bless=abençoar
items.ankh.bless=Abençoas o ankh com água mágica.
items.ankh.desc=Este antigo símbolo de imortalidade permite voltar à vida depois da morte. Ao ressuscitar, perdem-se todos os objetos que não estiverem equipados.
items.ankh.desc_blessed=Este antigo símbolo da imortalidade concede a capacidade de regressar à vida após a morte. O ankh foi abençoado e agora é muito mais forte. O ankh sacrificar-se-á para o salvar num momento de perigo mortal.
items.ankh.discover_hint=Pode comprar este item em uma loja.
items.ankh.name=ankh
items.arcaneresin.ac_apply=CANDIDATAR-SE
items.arcaneresin.apply=Reveste a sua varinha com resina, aumentando o seu poder!
items.arcaneresin.desc=Este pó fino brilha entre tons de roxo e branco. Pode atuar como um amplificador de energias mágicas, aumentando o nível das varinhas quando aplicado nas mesmas! Melhorar uma varinha custa 1, 2 ou 3 resinas, dependendo do nível inicial da varinha. A resina pode melhorar as varinhas até um máximo de +3. No entanto, os melhoramentos de resina são anulados por outras fontes de melhoramento (como pergaminhos de melhoramento) e não se aplicam ao imbuir uma varinha no bastão do mago.
items.arcaneresin.discover_hint=Podes criar este item através da alquimia.
items.arcaneresin.level_too_high=Esta varinha é demasiado poderosa para que a resina a melhore.
items.arcaneresin.name=resina arcana
items.arcaneresin.not_enough=Não tem resina suficiente para isso!
items.arcaneresin.prompt=Selecione uma varinha
