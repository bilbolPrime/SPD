items.weapon.melee.gloves.ability_desc=O Duelista pode executar um _golpe combinado_ com luvas cravejadas. Este ataque tem acerto garantido e causa _+%d de dano_ por cada vez que o Duelista acerta um ataque corpo a corpo ou com uma arma de arremesso normal. Se o Duelista não acertar durante 5 turnos, o combo é reiniciado.
