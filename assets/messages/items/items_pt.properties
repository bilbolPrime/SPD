items.potions.potion.amber=poção âmbar
items.potions.potion.azure=poção azul
items.potions.potion.beneficial=Poção benéfica
items.potions.potion.bistre=poção bistre
items.potions.potion.charcoal=poção de carvão
items.potions.potion.crimson=poção carmesim
items.potions.potion.discover_hint=Podes encontrar este item aleatoriamente na masmorra ou criá-lo através da alquimia.
items.potions.potion.golden=poção dourada
items.potions.potion.harmful=Poção nociva!
