items.artifacts.driedrose.cursed=Não pode usar uma rosa amaldiçoada.
items.artifacts.driedrose.desc=Será esta a rosa que o fantasma mencionou antes de desaparecer? Parece possuir algum poder espiritual; talvez possa ser utilizada para canalizar a energia daquele guerreiro perdido.
items.artifacts.driedrose.desc_armor=Armadura do Fantasma: %s
items.artifacts.driedrose.desc_cursed=A rosa amaldiçoada está presa à sua mão, e está estranhamente fria.
items.artifacts.driedrose.desc_hint=Parece que faltam algumas pétalas. Talvez recolocá-las fortaleça a rosa.
items.artifacts.driedrose.desc_no_quest=Uma rosa seca e envelhecida que, de alguma forma, ainda se mantém inteira apesar da idade. Parece ter algum poder espiritual, mas não faz ideia de como usá-lo agora.
items.artifacts.driedrose.desc_strength=Força do Fantasma: %s
items.artifacts.driedrose.desc_weapon=Arma do Fantasma: %s
items.artifacts.driedrose.name=rosa seca
items.artifacts.driedrose.no_charge=A sua rosa ainda não está totalmente carregada.
