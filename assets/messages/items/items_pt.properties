items.artifacts.driedrose.spawned=Já invocou o fantasma.
items.artifacts.etherealchains$chainsrecharge.levelup=As suas correntes ficam mais fortes!
items.artifacts.etherealchains.ac_cast=ELENCO
items.artifacts.etherealchains.cant_pull=As suas correntes não conseguem puxar esse alvo.
items.artifacts.etherealchains.cant_reach=As suas correntes não alcançam aí.
items.artifacts.etherealchains.cursed=Não pode usar correntes amaldiçoadas.
items.artifacts.etherealchains.desc=Estas correntes grandes, mas leves, brilham de energia espiritual. Podem ser usadas para o puxar em direção ao terreno ou para atrair inimigos. A natureza etérea das correntes permite-lhes até atravessar paredes!
items.artifacts.etherealchains.desc_cursed=As correntes amaldiçoadas estão presas ao teu corpo, balançando constantemente, tentando fazer-te tropeçar ou imobilizar-te.
items.artifacts.etherealchains.desc_equipped=As correntes repousam à sua volta, drenando lentamente a energia espiritual daqueles que derrota. Cada carga é um elo na corrente, que se estenderá exatamente um quadrado.
items.artifacts.etherealchains.does_nothing=Isso não vai servir para nada.
items.artifacts.etherealchains.inside_wall=As suas correntes só podem puxá-lo através das paredes, não para dentro delas.
items.artifacts.etherealchains.name=correntes etéreas
items.artifacts.etherealchains.no_charge=As suas correntes não têm carga suficiente.
items.artifacts.etherealchains.nothing_to_grab=Não há nada para agarrar ali.
items.artifacts.etherealchains.prompt=Escolha um local para segmentar.
items.artifacts.etherealchains.rooted=As suas correntes não o podem puxar enquanto estiver enraizado.
items.artifacts.holytome.ac_cast=ELENCO
items.artifacts.holytome.cursed=Não pode usar um tomo amaldiçoado.
items.artifacts.holytome.desc=Um tomo sagrado que serve de foco para a magia divina do Clérigo. Usar o tomo permite ao Clérigo lançar uma variedade de feitiços mágicos. O tomo tornar-se-á progressivamente mais poderoso à medida que o Clérigo o utilizar, concedendo-lhe mais cargas máximas e aumentando ligeiramente a velocidade de recarga.
items.artifacts.holytome.discover_hint=Um dos heróis começa com este item.
items.artifacts.holytome.levelup=O seu tomo está a ficar mais forte!
items.artifacts.holytome.name=tomo sagrado
items.artifacts.holytome.no_spell=Não pode lançar esse feitiço agora.
items.artifacts.hornofplenty.ac_eat=COMER
items.artifacts.hornofplenty.ac_snack=LANCHE
items.artifacts.hornofplenty.ac_store=LOJA
items.artifacts.hornofplenty.desc=Este corno não pode ser soprado, mas parece encher-se de comida à medida que se aventura e ganha experiência. Pode consumir cada carga individualmente como snack ou comer até ficar satisfeito.
items.artifacts.hornofplenty.desc_cursed=O chifre amaldiçoado prendeu-se ao seu lado, parecendo mais interessado em receber alimento do que em produzi-lo.
items.artifacts.hornofplenty.desc_hint=Talvez haja uma forma de aumentar o poder do chifre, fornecendo-lhe energia alimentar.
items.artifacts.hornofplenty.eat=Você come do chifre.
items.artifacts.hornofplenty.feed=O chifre consome a sua oferenda de alimentos.
items.artifacts.hornofplenty.full=O seu chifre está cheio de comida!
items.artifacts.hornofplenty.levelup=O chifre consome a sua oferenda de alimentos e fortalece-se!
items.artifacts.hornofplenty.maxlevel=O seu chifre consumiu toda a comida que podia!
items.artifacts.hornofplenty.name=cornucópia
items.artifacts.hornofplenty.no_food=O seu chifre está vazio!
