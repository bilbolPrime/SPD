items.artifacts.skeletonkey$keywall.desc=Uma parede mágica temporária foi aqui colocada pela chave mestra.
items.artifacts.skeletonkey.ac_insert=INSERIR
items.artifacts.skeletonkey.crystal_charges=Para abrir uma fechadura de cristal são necessárias 5 cargas.
items.artifacts.skeletonkey.cursed=Não pode usar uma chave mestra amaldiçoada.
items.artifacts.skeletonkey.desc=Uma chave de aspeto imponente, com a cabeça em forma de caveira. Os seus dentes parecem diferentes a cada olhar.
items.artifacts.skeletonkey.desc_cursed=A chave amaldiçoada parece estar a evitar ativamente encaixar em qualquer fechadura, e está até a dificultar (mas não impossibilitar) o uso das suas outras chaves.
items.artifacts.skeletonkey.desc_worn=Esta chave mágica parece ganhar poder à medida que a usas em vez das chaves comuns da masmorra. Pode ser inserida em quase todas as fechaduras da masmorra para as abrir ou fechar, incluindo portas que nunca foram trancadas antes. A chave pode até ser utilizada num espaço vazio numa direção cardeal ou diagonal para "travar" o ar à sua frente, criando uma parede sólida de 3 quadrados de largura que dura 10 turnos. Travar o ar repelirá os inimigos se houver espaço para isso.
items.artifacts.skeletonkey.discard=Elimine as chaves que não estiverem a ser utilizadas.
items.artifacts.skeletonkey.force_lock=A fechadura tornou-se mais frágil sem a sua chave mestra. Consegue forçá-la e abri-la.
items.artifacts.skeletonkey.gold_charges=Para abrir um cadeado de ouro são necessárias 2 cargas.
items.artifacts.skeletonkey.invalid_target=Não há nada para trancar ou destrancar ali.
items.artifacts.skeletonkey.iron_charges=Abrir uma fechadura comum requer 1 carga.
items.artifacts.skeletonkey.levelup=A sua chave mestra está a ficar mais forte!
items.artifacts.skeletonkey.lock_charges=O bloqueio de uma porta requer 2 cargas.
items.artifacts.skeletonkey.lock_no_space=Não podes trancar um personagem dentro de uma porta!
items.artifacts.skeletonkey.locked_with_key=Aquela porta estava trancada com a sua chave mestra.
items.artifacts.skeletonkey.name=chave mestra
items.artifacts.skeletonkey.prompt=Escolha um alvo
items.artifacts.skeletonkey.wall_charges=Criar uma parede temporária requer 2 encargos.
items.artifacts.skeletonkey.wont_open=Por algum motivo, a chave não encaixa nesta fechadura.
items.artifacts.talismanofforesight$foresight.desc=Sente-se muito nervoso, como se houvesse um perigo invisível por perto.
items.artifacts.talismanofforesight$foresight.name=previsão
items.artifacts.talismanofforesight$foresight.uneasy=Sente-se inquieto(a).
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Uma pedra lisa com estranhas gravuras. Tem a sensação de que ela está a observar tudo à sua volta, atenta a qualquer coisa escondida.
items.artifacts.talismanofforesight.desc_cursed=O talismã amaldiçoado está a olhar fixamente para si, embotando os seus sentidos.
items.artifacts.talismanofforesight.desc_worn=Ao segurar o talismã, sente os seus sentidos apurados. O talismã vai acumulando carga lentamente com o passar do tempo e à medida que vai descobrindo portas ou armadilhas escondidas. O talismã pode usar a sua carga para "espiar" num formato cónico, revelando todos os quadrados e segredos na área digitalizada, e concedendo-lhe a visão de inimigos e itens por um curto período.
items.artifacts.talismanofforesight.full_charge=O seu Talismã está totalmente carregado!
items.artifacts.talismanofforesight.levelup=O seu Talismã fica mais forte!
items.artifacts.talismanofforesight.low_charge=O talismã requer pelo menos 5% de carga para realizar a adivinhação.
items.artifacts.talismanofforesight.name=talismã da premonição
items.artifacts.talismanofforesight.prompt=Escolha um local para digitalizar.
items.artifacts.timekeepershourglass$sandbag.desc=Este pequeno saco de areia fina deve funcionar perfeitamente com a sua ampulheta. Parece estranho que o comerciante tenha este item específico precisamente quando se precisa dele...
items.artifacts.timekeepershourglass$sandbag.levelup=Adiciona a areia à sua ampulheta.
items.artifacts.timekeepershourglass$sandbag.maxlevel=A sua ampulheta está cheia de areia mágica!
items.artifacts.timekeepershourglass$sandbag.name=saco de areia mágica
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Não tem uma ampulheta para colocar essa areia.
items.artifacts.timekeepershourglass$timefreeze.desc=O tempo fica congelado à sua volta, permitindo-lhe executar ações instantaneamente. O efeito durará até ser cancelado ou a sua ampulheta ficar sem carga. Atacar ou usar magia também interromperá este efeito. \n\nTurnos até à utilização da carga: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Congelamento do tempo
items.artifacts.timekeepershourglass.ac_activate=ATIVAR
items.artifacts.timekeepershourglass.cursed=Não pode usar uma ampulheta amaldiçoada.
items.artifacts.timekeepershourglass.deactivate=Desativa o congelamento do tempo.
items.artifacts.timekeepershourglass.desc=Esta grande ampulheta ornamentada parece bastante modesta, mas sente-se um grande poder na sua moldura finamente esculpida. Ao rodar a ampulheta e observar a areia a escorrer, pode sentir a sua magia a atraí-lo; certamente, usar esta magia dar-lhe-ia algum controlo sobre o tempo.
items.artifacts.timekeepershourglass.desc_cursed=A ampulheta amaldiçoada está presa ao seu lado, pode senti-la a tentar manipular o fluxo do seu tempo.
items.artifacts.timekeepershourglass.desc_hint=A ampulheta parece ter perdido um pouco de areia, se ao menos se pudesse encontrar um pouco...
items.artifacts.timekeepershourglass.freeze=Congele o tempo à minha volta
items.artifacts.timekeepershourglass.name=ampulheta do cronometrista
items.artifacts.timekeepershourglass.no_charge=A sua ampulheta ainda não recarregou o suficiente para ser utilizada.
items.artifacts.timekeepershourglass.onfreeze=De repente, tudo à sua volta congela.
items.artifacts.timekeepershourglass.onstasis=O mundo parece mudar à sua volta num instante.
items.artifacts.timekeepershourglass.prompt=Como gostaria de usar a magia da ampulheta? Enquanto estiver em estase, o tempo correrá normalmente enquanto estiver congelado e completamente invulnerável, consumindo até 2 cargas de cada vez. Quando o tempo estiver congelado, poderá mover-se como se as suas ações não demorassem. Isto pode ser desativado a qualquer momento usando a ampulheta ou atacando.
items.artifacts.timekeepershourglass.stasis=Coloquei-me em estado de estase
items.artifacts.unstablespellbook.ac_add=ADICIONAR
items.artifacts.unstablespellbook.ac_read=LER
items.artifacts.unstablespellbook.blinded=Não é possível ler o livro estando cego.
items.artifacts.unstablespellbook.cursed=Não se pode ler um livro de feitiços amaldiçoado.
items.artifacts.unstablespellbook.desc=Este tomo encontra-se em surpreendentemente bom estado de conservação, tendo em conta a sua idade. Crepita e estala ao folhear as páginas, pulsando com uma energia instável. Se ler este livro, não há forma de prever que feitiço poderá lançar.
items.artifacts.unstablespellbook.desc_cursed=O livro amaldiçoado ligou-se a si, impedindo a sua capacidade de usar a maioria dos pergaminhos.
items.artifacts.unstablespellbook.desc_empowered=Os pergaminhos que adicionou ao livro estão a irradiar poder. Poderá escolher a versão exótica dos efeitos destes pergaminhos, mas isso terá um custo adicional.
items.artifacts.unstablespellbook.desc_index=O livro está incompleto. O seu índice aponta atualmente para as seguintes páginas em branco:
items.artifacts.unstablespellbook.infuse_scroll=Infunde a energia do pergaminho no livro.
items.artifacts.unstablespellbook.name=livro de feitiços instável
items.artifacts.unstablespellbook.no_charge=O seu livro de feitiços está sem energia neste momento.
items.artifacts.unstablespellbook.prompt=Selecione um pergaminho
items.artifacts.unstablespellbook.read_empowered=O pergaminho que adicionaste ao grimório está repleto de energia. Podes canalizar tanto a versão normal como a exótica do efeito deste pergaminho. Escolher a variante exótica custará 2 cargas em vez de 1.
items.artifacts.unstablespellbook.unable_scroll=Não pode adicionar este pergaminho ao livro.
items.artifacts.unstablespellbook.unknown_scroll=Ainda não tem a certeza de que tipo de pergaminho é este.
items.bags.bag.discover_hint=Pode comprar este item em uma loja.
items.bags.bag.name=mochila
items.bags.magicalholster.desc=Este coldre fino é feito de couro de animal exótico e possui uma poderosa magia que lhe permite armazenar uma enorme quantidade de armas de longo alcance. Pode simplesmente enfiar a mão na mala e encontrará sempre o item que procura. Devido à magia do coldre, as varinhas carregarão um pouco mais rápido e as armas de arremesso durarão um pouco mais dentro dele.
items.bags.magicalholster.name=coldre mágico
items.bags.potionbandolier.desc=Esta bandoleira grossa envolve o peito como uma faixa e possui várias tiras isolantes para acomodar frascos de poções, o seu cantil ou frascos de metal líquido. Enquanto estiverem dentro da bandoleira, as suas poções estarão protegidas do frio.
items.bags.potionbandolier.name=bandoleira de poções
items.bags.scrollholder.desc=Este recipiente tubular parece ideal para guardar ferramentas e mapas de astrónomos, mas os seus pergaminhos também caberão perfeitamente. Existem ainda alguns compartimentos laterais que acomodariam cristais mágicos, estiletes arcanos e resina arcana. O recipiente não parece ser muito inflamável, pelo que os seus pergaminhos estarão protegidos do fogo no seu interior.
items.bags.scrollholder.name=suporte de pergaminho
items.bags.velvetpouch.desc=Esta pequena bolsa de veludo pode guardar vários pequenos itens, como sementes, runas e alguns ingredientes de alquimia.
items.bags.velvetpouch.discover_hint=Um dos heróis começa com este item.
items.bags.velvetpouch.name=bolsa de veludo
items.bombs.arcanebomb.desc=Esta bomba foi imbuída de propriedades arcanas. Irá explodir numa poderosa rajada semelhante ao ataque potenciado de Goo, causando _%1$d-%2$d de dano mágico_ a tudo num raio de 2 quadrados.
items.bombs.arcanebomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.arcanebomb.name=bomba arcana
items.bombs.bomb$doublebomb.desc=Um pacote com duas bombas de pólvora negra muito pesadas; parece que se recebe uma de graça!
items.bombs.bomb$doublebomb.name=duas bombas
items.bombs.bomb.ac_lightthrow=LUZ E PROJEÇÃO
items.bombs.bomb.desc=Uma bomba de pólvora negra bastante pesada. A explosão desta bomba causa dano de _%1$d a _%2$d_ a tudo o que estiver adjacente a ela e destruirá parte do terreno ou de alguns itens próximos.
items.bombs.bomb.desc_burning=O rastilho da bomba está a arder, mantenha distância ou apague-a!
items.bombs.bomb.desc_fuse=Parece que o pavio vai precisar de algumas rondas para queimar completamente depois de aceso.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=A explosão mata-te...
items.bombs.bomb.rankings_desc=Morto por uma explosão
items.bombs.bomb.snuff_fuse=Rapidamente apaga o pavio da bomba.
items.bombs.firebomb.desc=Esta bomba foi modificada para explodir numa área maior, causando _%1$d-%2$d de dano_ e espalhando chamas contínuas num raio de 2 quadrados.
items.bombs.firebomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.firebomb.name=bomba incendiária
items.bombs.flashbangbomb.desc=Esta bomba personalizada explodirá numa explosão de luz, som e eletricidade ao detonar. Tudo o que estiver até 2 quadrados de distância sofrerá dano de _%1$d a %2$d_ pela explosão, mais 25%% de dano da eletricidade e ficará atordoado durante 10 turnos.
items.bombs.flashbangbomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.flashbangbomb.name=granada de efeito moral
items.bombs.frostbomb.desc=Esta bomba foi modificada para explodir numa área maior, causando _%1$d-%2$d de dano_ e espalhando uma rajada contínua de ar gelado num raio de 2 quadrados.
items.bombs.frostbomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.frostbomb.name=bomba de gelo
items.bombs.holybomb.desc=Esta bomba foi modificada para emitir luz sagrada numa área maior ao explodir. Qualquer coisa a menos de 2 quadrados sofrerá _%1$d-%2$d de dano_ da explosão, e os inimigos mortos-vivos ou demoníacos sofrerão 50%% de dano adicional da luz sagrada.
items.bombs.holybomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.holybomb.name=bomba sagrada
items.bombs.noisemaker.desc=Esta bomba personalizada emitirá sons repetidamente quando o seu pavio se apagar. Quando algo tocar na bomba, esta explodirá e causará dano de _%1$d-%2$d_ a tudo num raio de 2 quadrados!
items.bombs.noisemaker.desc_burning=O dispositivo sonoro está a funcionar, explodirá quando algo se aproximar!
items.bombs.noisemaker.discover_hint=Podes criar este item através da alquimia.
items.bombs.noisemaker.name=gerador de ruído
items.bombs.regrowthbomb.desc=Esta bomba personalizada espalhará um líquido vital por toda a parte num raio de 3 quadrados, em vez de explodir. A área atingida pela explosão fará brotar erva e plantas rapidamente. Tu e quaisquer aliados atingidos pela explosão serão curados como se tivessem bebido uma poção de cura.
items.bombs.regrowthbomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.regrowthbomb.name=bomba de regeneração
items.bombs.shrapnelbomb.desc=Esta bomba foi modificada com pedaços de metal da DM-300, que se fragmentarão e voarão para todo o lado ao explodir, causando dano de _%1$d a %2$d_ numa enorme área em redor da bomba. É melhor esconder-se atrás de algo ao usá-la...
items.bombs.shrapnelbomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.shrapnelbomb.name=bomba de estilhaços
items.bombs.smokebomb.desc=Esta bomba foi modificada para expelir uma densa nuvem de gás ao mesmo tempo que explode. Causará dano de _%1$d a %2$d_ e espalhará uma névoa densa num raio de 2 quadrados.
items.bombs.smokebomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.smokebomb.name=bomba de fumo
items.bombs.woollybomb.desc=Esta bomba personalizada criará um amplo campo de ovelhas mágicas após explodir. A explosão causará dano de _%1$d a %2$d_ a tudo o que estiver num raio de 2 quadrados. As ovelhas bloquearão o movimento e persistirão durante muito tempo! No entanto, as ovelhas não durarão tanto tempo na presença de inimigos poderosos e poderão ser dissipadas manualmente mais cedo interagindo com eles.
items.bombs.woollybomb.discover_hint=Podes criar este item através da alquimia.
items.bombs.woollybomb.name=bomba lanosa
items.brokenseal$warriorshield.desc_active=O selo quebrado do Guerreiro está a ajudá-lo a perseverar, concedendo-lhe um escudo para além da sua saúde. Existe um tempo de recarga após o escudo ser ativado inicialmente, antes de poder ser utilizado novamente. Este escudo não se dissipa com o tempo, mas terminará se não houver inimigos por perto durante alguns turnos. Quando terminar, qualquer escudo não utilizado reduzirá o tempo de recarga, até um máximo de 50. Escudo restante: Tempo de recarga atual:
items.brokenseal$warriorshield.desc_cooldown=O Guerreiro obteve recentemente proteção devido ao seu selo quebrado e deve esperar até poder beneficiar novamente do seu efeito de proteção.\n\nTurnos restantes: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=O tempo de recarga do escudo do Guerreiro está atualmente negativo, o que significa que, quando o seu escudo é ativado, o tempo de recarga será inferior aos habituais 150 turnos. O tempo de recarga do escudo pode ser reduzido para até -150 turnos, o que significa que estará disponível imediatamente após ser ativado.
items.brokenseal$warriorshield.name=Escudo do Guerreiro
items.brokenseal.ac_affix=AFIXO
items.brokenseal.affix=Fixas o selo na tua armadura!
items.brokenseal.choose_desc=Tanto esta armadura como o selo quebrado possuem um glifo. Escolha qual o glifo que deve ser mantido. ZXQPH2 ZXQ ZXQPH3 ZXQ Glifo da Armadura: ZXQPH0 ZXQ ZXQPH4 ZXQ Glifo do Selo Quebrado: ZXQPH1 ZXQ ZXQPH5 ZXQ ZXQPH6 ZXQ Note que se escolher o glifo que está actualmente na armadura, o selo não poderá transferi-lo posteriormente.
items.brokenseal.choose_title=Escolha um glifo
items.brokenseal.cursed_armor=O selo não se aplica a armaduras amaldiçoadas.
items.brokenseal.desc=Um selo de cera, aposto à armadura como símbolo de bravura. Tem uma runa de proteção desbotada gravada no centro e está rachado ao meio. Como lembrança da sua terra natal, o selo ajuda o guerreiro a perseverar. Enquanto estiver a usar o selo, o guerreiro ganhará instantaneamente proteção quando estiver prestes a sofrer dano que reduza a sua saúde para metade ou menos. O selo pode ser aposto à armadura e transferido entre armaduras. Pode transportar consigo uma única melhoria, desde que essa melhoria tenha sido aplicada à armadura enquanto o selo estava ligado a esta.
items.brokenseal.discover_hint=Um dos heróis começa com este item.
items.brokenseal.inscribed=O selo contém a inscrição _%s._
items.brokenseal.name=selo rompido
items.brokenseal.prompt=Selecione uma armadura
items.brokenseal.unknown_armor=Primeiro precisa de identificar se esta armadura está amaldiçoada ou não.
items.dewdrop.already_full=Já goza de plena saúde.
items.dewdrop.desc=Uma gota de orvalho cristalina. Devido à magia deste local, a água pura possui pequenas propriedades reparadoras.
items.dewdrop.name=gota de orvalho
items.dewvial.ac_drink=BEBER
items.dewvial.auto_drink=O frasco de orvalho esvaziou-se para curar as suas feridas.
items.dewvial.collected=Recolheu uma gota de orvalho no frasco.
items.dewvial.desc=Pode guardar o orvalho que sobra neste pequeno frasco para o beber mais tarde. Se o frasco estiver cheio, o orvalho será bebido automaticamente em caso de perigo de morte.
items.dewvial.empty=O seu frasco de orvalho está vazio!
items.dewvial.full=O seu frasco de orvalho está cheio!
items.dewvial.name=frasco de orvalho
items.energycrystal.desc=Uma coleção de pequenos cristais mágicos, repletos de energia alquímica. Estes cristais são o ingrediente mais comum em receitas de alquimia e podem ser produzidos num caldeirão de alquimia ao desmontar artigos consumíveis.
items.energycrystal.name=cristal de energia
items.equipableitem.ac_equip=EQUIPAR
items.equipableitem.ac_unequip=DESEQUIPAR
items.equipableitem.curse_detected=Sente que o item está amaldiçoado pouco antes de o equipar!
items.equipableitem.unequip_cursed=Não pode remover um item amaldiçoado!
items.food.berry.desc=Esta pequena baga foi encontrada pela Caçadora entre a vegetação da masmorra. Pode ser consumida rapidamente, restaura alguma saciedade e pode conter uma semente útil!
items.food.berry.discover_hint=Podes encontrar este item usando um talento específico do herói.
items.food.berry.eat_msg=Aquela frutinha estava deliciosa!
items.food.berry.name=baga da masmorra
items.food.blandfruit$chunks.desc=A fruta insípida explodiu com o impacto, deixando para trás pedaços inertes. Apesar de um pouco de sujidade, estes grandes pedaços de fruta insípida cozida parecem perfeitamente comestíveis.
items.food.blandfruit$chunks.name=pedaços de fruta sem graça
items.food.blandfruit.blindfruit=fruta cega
items.food.blandfruit.cooked=fruta cozida sem graça
items.food.blandfruit.desc=Tão seco e insípido, talvez cozinhá-lo com outro ingrediente o melhorasse.
items.food.blandfruit.desc_cooked=O fruto inchou por ter ficado de molho na panela e até absorveu as propriedades da semente com que foi cozido. Terá o efeito da poção correspondente à semente.
items.food.blandfruit.desc_eat=Parece pronto a ser comido!
items.food.blandfruit.desc_throw=Parece bastante instável, talvez seja melhor descartá-lo.
items.food.blandfruit.dreamfruit=fruta mágica
items.food.blandfruit.earthfruit=fruta da terra
