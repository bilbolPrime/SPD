items.food.chargrilledmeat.desc=Parece um bom bife.
items.food.chargrilledmeat.discover_hint=Pode criar isso usando outro alimento.
items.food.chargrilledmeat.name=carne grelhada
items.food.food.ac_eat=COMER
items.food.food.desc=Nada de extravagante: carne seca, umas bolachas - coisas desse género.
items.food.food.eat_msg=Aquela comida estava deliciosa!
items.food.food.name=ração de alimentos
items.food.frozencarpaccio.better=Sente-se melhor!
items.food.frozencarpaccio.desc=É um pedaço de carne crua congelada. A única forma de a comer é cortando-a em fatias finas. E, surpreendentemente, fica muito boa assim.
items.food.frozencarpaccio.discover_hint=Pode criar isso usando outro alimento.
items.food.frozencarpaccio.hard=Sente a sua pele endurecer!
items.food.frozencarpaccio.invis=Vê as suas mãos ficarem invisíveis!
items.food.frozencarpaccio.name=carpaccio congelado
items.food.frozencarpaccio.refresh=Refrescante!
items.food.meatpie.desc=Uma deliciosa tarte recheada com saborosa carne. Ela vai satisfazê-lo muito mais do que qualquer outra refeição.
items.food.meatpie.discover_hint=Podes criar este item através da alquimia.
items.food.meatpie.eat_msg=Aquela comida estava incrível!
items.food.meatpie.name=torta de carne
items.food.mysterymeat$placeholder.name=carne
items.food.mysterymeat.desc=Coma por sua conta e risco!
items.food.mysterymeat.discover_hint=Pode obter este item como recompensa ao derrotar certos inimigos.
items.food.mysterymeat.eat_msg=Aquela comida tinha um sabor... estranho.
items.food.mysterymeat.hot=Ui, que calor!
items.food.mysterymeat.legs=Não consegue sentir as suas pernas!
items.food.mysterymeat.name=carne misteriosa
items.food.mysterymeat.not_well=Não se está sentindo bem.
items.food.mysterymeat.stuffed=Está satisfeito.
items.food.pasty$fishleftover.desc=Um pouco de peixe que sobrou da sua refeição anterior. Pode comê-lo quando quiser para matar um pouco a fome.
items.food.pasty$fishleftover.eat_msg=Aquela comida estava razoável.
items.food.pasty$fishleftover.name=restos de peixe
items.food.pasty.amulet_desc=Finalmente encontrou, o amuleto mágico de... espera um minuto, isto é apenas um chocolate embrulhado em papel de alumínio feito para se parecer com o amuleto! Não lhe dará poder ilimitado, mas pelo menos saciará e dar-lhe-á uma pequena carga de artefacto. \n\nPrimeiro de Abril!
items.food.pasty.amulet_name=amuleto de Yendor?
items.food.pasty.cane_desc=Uma enorme bengala doce e açucarada. É grande o suficiente para o satisfazer, e o açúcar pode até dar uma pequena carga extra às suas varinhas. Boas Festas!
items.food.pasty.cane_name=bengala doce
items.food.pasty.desc=Um autêntico pastel da Cornualha com recheio tradicional de carne e batata. Delicioso!
items.food.pasty.egg_desc=Um enorme ovo de chocolate, embrulhado em papel de alumínio amarelo colorido. Tem chocolate suficiente para o deixar satisfeito, e o açúcar pode dar um toque extra aos seus objetos de decoração. Feliz Páscoa!
items.food.pasty.egg_name=ovos da pascoa
items.food.pasty.fish_desc=Um peixe inteiro cozido a vapor, magicamente preservado sobre uma cama de verduras. É tradição guardar um pouco de peixe para mais tarde nesta altura do ano, por isso aproveita as sobras em vez de comer tudo de uma vez. Feliz Ano Novo Lunar!
items.food.pasty.fish_name=peixe cozido a vapor
items.food.pasty.name=pastoso
items.food.pasty.pie_desc=Uma fatia enorme de tarte de abóbora. O seu sabor doce e picante vai satisfazê-lo e dar-lhe um pouquinho de conforto. Feliz Halloween!
items.food.pasty.pie_name=torta de abóbora
items.food.pasty.rainbow_desc=Esta poção colorida é um tipo de alimento líquido. Além de saciar a sua fome, contém um pouco de magia que acalma os inimigos comuns nas proximidades, fazendo com que hesitem temporariamente em lutar contra si. Feliz Orgulho!
items.food.pasty.rainbow_name=poção do arco-íris
items.food.pasty.sparkling_desc=Esta poção espumante é um tipo de alimento líquido. Sacia a fome e simula o sabor do vinho espumante, mas não contém álcool. A sensação de calor na barriga proporciona um pouco de proteção. Feliz Ano Novo!
items.food.pasty.sparkling_name=poção cintilante
items.food.pasty.vanilla_desc=Esta grande fatia de bolo de baunilha tem confeitos coloridos e cobertura azul. O bolo foi feito para celebrar anos de experiência e, ao ser devorado, terá acesso a um pouco dessa experiência. O Pixel Dungeon original foi lançado a 4 de dezembro de 2012. Feliz aniversário, Pixel Dungeon!
items.food.pasty.vanilla_name=bolo azul
items.food.phantommeat.desc=Um grande bife translúcido e brilhante, cortado de uma piranha fantasma. Esta carne mágica não necessita de ser cozinhada e concede diversos benefícios defensivos, além de saciar completamente a fome. Ao ser consumida, concede invisibilidade, pele de casca de árvore, cura parcial e elimina muitos efeitos nocivos.
items.food.phantommeat.discover_hint=Pode obter este item como recompensa ao derrotar certos inimigos.
items.food.phantommeat.name=carne fantasma
items.food.smallration.desc=Parece exatamente uma ração alimentar padrão, só que mais pequena.
items.food.smallration.discover_hint=Pode comprar este item em uma loja.
items.food.smallration.eat_msg=Aquela comida estava razoável.
items.food.smallration.name=pequena ração alimentar
items.food.stewedmeat.desc=A cozedura lenta da carne livrou-a de quaisquer doenças ou parasitas. Deve ser segura para consumo.
items.food.stewedmeat.discover_hint=Podes criar este item através da alquimia.
items.food.stewedmeat.eat_msg=Aquela comida estava razoável.
items.food.stewedmeat.name=carne cozida
items.food.supplyration.desc=Esta ração foi deixada na masmorra por e para os membros da guilda dos ladrões. Foi especialmente criada para ser consumida em movimento e auxiliar em truques em geral. Embora não sacie tanto como uma ração normal, pode ser consumida rapidamente, proporciona uma pequena cura direta e restaura uma carga da capa das sombras do Ladino.
items.food.supplyration.discover_hint=Podes encontrar este item usando um talento específico do herói.
items.food.supplyration.name=ração de fornecimento
items.gold.desc=Uma pilha de moedas de ouro. Apanha moedas de ouro para as gastar mais tarde numa loja.
items.gold.name=ouro
items.heap.artifact=um artefacto
items.heap.chest=Peito
items.heap.chest_desc=Só saberá o que tem lá dentro depois de abrir!
items.heap.crystal_chest=Baú de cristal
items.heap.crystal_chest_desc=Podes ver _%s_ lá dentro, mas para abrir o baú precisas de uma chave de cristal.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Baú trancado
items.heap.locked_chest_desc=Só saberá o que tem lá dentro depois de abrir! Mas para abrir, precisa de uma chave dourada.
items.heap.remains=Restos mortais do herói
items.heap.remains_desc=Isto é tudo o que restou de um dos seus antecessores. Talvez valha a pena verificar se existe algum objeto de valor.
items.heap.ring=um anel
items.heap.skeleton=Restos esqueléticos
items.heap.skeleton_desc=Isto é tudo o que resta de algum aventureiro azarado. Talvez valha a pena verificar se existe algum objeto de valor.
items.heap.tomb=Túmulo
items.heap.tomb_desc=Esta antiga tumba pode conter algo útil, mas o seu dono certamente se oporá a ser verificada.
items.heap.wand=uma varinha
items.honeypot$shatteredpot.desc=O pote foi estilhaçado, apenas o mel pegajoso que reveste as suas paredes o mantém unido, e está a desfazer-se lentamente. Apesar de estar partido, a abelha parece ainda querer proteger o pote.
items.honeypot$shatteredpot.name=pote de mel partido
items.honeypot.ac_shatter=ESTILHAÇO
items.honeypot.desc=Este grande pote de mel está apenas forrado com mel; na verdade, ele alberga uma abelha gigante! Abelhas enormes como estas geralmente ficam nas suas colmeias; talvez o pote seja algum tipo de gaiola especializada para abelhas? A abelha parece bem satisfeita dentro do pote com o seu mel e zumbindo cautelosamente quando a observa.
items.honeypot.name=pote de mel
items.item.ac_drop=GOTA
items.item.ac_throw=ATIRAR
items.item.curse=maldição
items.item.custom_note=Este artigo tem uma nota personalizada: "_%s_"
items.item.custom_note_type=Este tipo de artigo tem uma nota personalizada: "_%s_"
items.item.discover_hint=Podes encontrar este item aleatoriamente na masmorra.
items.item.prompt=Escolha a direção do lançamento
items.item.rankings_desc=Morto por: %s
items.journal.alchemypage.desc=Uma página rasgada de um guia de alquimia. A maior parte do texto é demasiado pequena para ser lida à distância, mas é possível distinguir o título da página:
items.journal.alchemypage.name=página rasgada de um livro de alquimia
items.journal.documentpage.desc=Uma página solitária, provavelmente arrancada de algum livro. Terá de pegá-la para lê-la.
items.journal.documentpage.name=página rasgada
items.journal.guidebook.desc=Um guia para aventureiros, deixado aqui por alguém que decidiu que as aventuras não eram para si! Este livro em particular é mágico e pode inspirar os aventureiros a ler uma página no momento certo. Apesar desta funcionalidade, o livro é mais popular por causa das grandes palavras "Não entre em pânico!". escritas em letras grandes e amigáveis na capa.
items.journal.guidebook.hint_desktop=O seu guia tem dicas para si! Selecione o botão intermitente do diário (%s) no canto superior direito para o ler.
items.journal.guidebook.hint_mobile=O seu guia tem dicas para si! Toca no botão intermitente do diário no canto superior direito para o ler.
items.journal.guidebook.hint_status=Guia
items.journal.guidebook.name=tomo de domínio de masmorras
items.journal.guidepage.desc=Uma página rasgada de um guia de aventuras. A maior parte do texto é demasiado pequena para ler à distância, mas é possível distinguir o título da página:
items.journal.guidepage.name=página rasgada do guia
items.journal.regionlorepage$caves.desc=O que parece ser uma anotação no diário de bordo de um explorador, está surpreendentemente bem preservado apesar da sua idade. Pegue nele para ler.
items.journal.regionlorepage$caves.name=entrada de registo antiga
items.journal.regionlorepage$city.desc=Uma pequena placa de metal enferrujada com uma mensagem magicamente gravada. As letras ainda são legíveis apesar da idade da placa, mas terá de pegar nela para a ler.
items.journal.regionlorepage$city.name=tablete enferrujado
items.journal.regionlorepage$halls.desc=Um pequeno tablet preto com letras verdes brilhantes gravadas. À distância, as letras brilhantes confundem-se numa névoa; terá de pegar nele para ler.
items.journal.regionlorepage$halls.name=tablet brilhante
items.journal.regionlorepage$prison.desc=Uma anotação de diário, ou algum outro tipo de registo, escrita num pedaço de papel antigo. Parece ter-se conservado melhor do que as cartas que encontraste nos esgotos, mas ainda precisarás de a apanhar para a ler.
items.journal.regionlorepage$prison.name=anotação de diário desgastada
items.journal.regionlorepage$sewers.desc=O que parece ser uma carta, escrita num pedaço de papel sujo. Terá de apanhá-la para conseguir decifrar o que está escrito.
items.journal.regionlorepage$sewers.name=carta gasta
items.keys.crystalkey.desc=As superfícies cortadas desta chave cristalina brilham na escuridão. Talvez ela abra algo feito de cristal?
items.keys.crystalkey.name=Chave de cristal
items.keys.goldenkey.desc=Os entalhes nesta chave dourada são minúsculos e intrincados. Talvez ela abra um baú trancado?
items.keys.goldenkey.name=chave dourada
items.keys.ironkey.desc=Os entalhes desta antiga chave de ferro estão bastante gastos; o seu cordão de couro está deteriorado pelo tempo. Que porta poderia ela abrir?
items.keys.ironkey.name=chave de ferro
items.keys.skeletonkey.name=chave mestra
items.keys.wornkey.desc=Esta chave está gasta e descolorada, mas parece robusta. Provavelmente consegue abrir alguma porta importante por perto.
items.keys.wornkey.name=chave gasta
items.kindofmisc.unequip_message=Primeiro, precisa de desequipar um destes itens. Selecione um artigo para trocar.
items.kindofmisc.unequip_title=Desequipar um item
items.kindofweapon.empty=vazio
items.kindofweapon.equip_cursed=O seu aperto em torno da arma intensifica-se involuntariamente.
items.kindofweapon.swift_equip=Equipa a sua arma rapidamente.
items.kindofweapon.which_equip_msg=Em que espaço de armas gostaria de equipar este item?\n\nA Campeã ataca directamente com a sua arma primária, mas pode usar a habilidade de qualquer uma das armas. Ambas as armas partilham a mesma quantidade de cargas.\n\nA Campeã também pode trocar instantaneamente entre a sua arma primária e secundária.
items.kindofweapon.which_equip_primary=Primário (%s)
items.kindofweapon.which_equip_secondary=Secundário (%s)
items.kingscrown.ac_wear=VESTIR
items.kingscrown.desc=A coroa do último rei anão, brilha com uma tremenda energia mágica. Ao ser utilizada, a magia da coroa fluirá para a armadura que estiver a usar, transformando-a numa armadura épica única com habilidades especiais. A nova armadura manterá todas as propriedades da armadura original.
items.kingscrown.discover_hint=Pode obter este item como recompensa ao derrotar certos inimigos.
items.kingscrown.naked=Infelizmente, a coroa não pode transformar a sua roupa interior.
items.kingscrown.name=Coroa do Rei Anão
items.kingscrown.ratgraded=As patas do Rei Rato brilham intensamente à medida que a sua armadura se transforma!
items.kingscrown.upgraded=A coroa brilha intensamente e depois desintegra-se à medida que a sua armadura se transforma!
items.liquidmetal.ac_apply=CANDIDATAR-SE
items.liquidmetal.already_fixed=Esta arma arremessada já se encontra em perfeitas condições!
items.liquidmetal.apply=Utilizas o metal líquido %d para reparar a tua arma de arremesso.
items.liquidmetal.desc=Este líquido mágico pode preencher fissuras e rasgos numa arma de arremesso, restaurando-a à sua condição perfeita! Se um conjunto de armas estiver em falta de uma arma, mas totalmente reparado, o metal líquido pode até ser utilizado para substituir a arma em falta do conjunto! Uma arma de nível 1 requer 10 unidades de metal líquido para ser totalmente reparada, enquanto uma arma de nível 5 requer 30. Cada melhoria também aumenta a quantidade de metal necessária em 35%. O metal líquido não pode ser utilizado para reparar as pontas de dardos com ponta.
items.liquidmetal.discover_hint=Podes criar este item através da alquimia.
items.liquidmetal.name=metal líquido
items.liquidmetal.prompt=Selecione uma arma de arremesso.
items.lostbackpack.desc=Este é o seu inventário perdido. Apanha-o para recuperar todos os itens que perdeste!
items.lostbackpack.name=mochila perdida
items.merchantsbeacon.ac_use=USO
items.merchantsbeacon.desc=Esta estranha peça de tecnologia anã permite comunicar a grandes distâncias. Após ser ativado, este farol permitirá vender itens ao Pixel Mart a partir de qualquer lugar da masmorra. No entanto, a magia dentro do farol durará apenas uma sessão, por isso usa-a com sabedoria.
items.merchantsbeacon.name=farol do comerciante
items.potions.brews.aquabrew.desc=Ao ser quebrada, esta poção liberta um jato de água pressurizada no local. A força é apenas suficiente para causar dano a inimigos em chamas, mas também espalha água pelo terreno próximo, desativa armadilhas, apaga incêndios e empurra personagens para perto do ponto de impacto.
items.potions.brews.aquabrew.name=água
items.potions.brews.blizzardbrew.desc=Ao ser quebrada, esta poção irá libertar uma tempestade giratória que se espalhará rapidamente como um gás.
items.potions.brews.blizzardbrew.name=cerveja de nevasca
items.potions.brews.brew.discover_hint=Podes criar este item através da alquimia.
items.potions.brews.causticbrew.desc=Esta mistura espalhará uma gosma corrosiva numa vasta área em redor do local onde se partir. Qualquer coisa atingida pela gosma derreterá lentamente se não puder ser removida com água.
items.potions.brews.causticbrew.name=bebida cáustica
items.potions.brews.infernalbrew.desc=Ao ser quebrada, esta poção irá libertar um incêndio devastador que se espalhará rapidamente como gás.
items.potions.brews.infernalbrew.name=poção infernal
items.potions.brews.shockingbrew.desc=Ao ser quebrada, esta poção irá desencadear uma tempestade elétrica numa vasta área em redor do local onde se parte.
items.potions.brews.shockingbrew.name=mistura chocante
items.potions.brews.unstablebrew.desc=Esta poção mágica brilha com as cores mutáveis do arco-íris. Ao ser bebida ou atirada, desencadeará o efeito de uma poção aleatória. O efeito da poção será sempre benéfico se for bebida e sempre prejudicial se for lançada.
items.potions.brews.unstablebrew.name=cerveja instável
items.potions.elixirs.elixir.discover_hint=Podes criar este item através da alquimia.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Adquiriu temporariamente propriedades restauradoras semelhantes às de Goo. Enquanto estiver na água, recuperará uma pequena quantidade de saúde por turno. O efeito é pausado quando a sua saúde estiver completa ou sair da água. Cura restante: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=cura aquática
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Este elixir contém os restos de Goo melhorados com uma poção de cura. Embora não proporcione uma cura imediata, irá restaurar gradualmente uma maior quantidade de saúde enquanto estiver na água.
items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir de rejuvenescimento aquático
items.potions.elixirs.elixirofarcanearmor.desc=Este elixir concederá ao bebedor uma resistência duradoura aos danos mágicos.
items.potions.elixirs.elixirofarcanearmor.name=elixir de armadura arcana
items.potions.elixirs.elixirofdragonsblood.desc=Ao ser consumido, este elixir enviará um poder ígneo pelas veias de quem o beber. Este efeito tornará o bebedor imune ao fogo e permitir-lhe-á incendiar os inimigos com ataques físicos.
items.potions.elixirs.elixirofdragonsblood.name=elixir de sangue de dragão
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Está sob o efeito de um elixir de queda suave, permitindo-lhe cair em abismos sem sofrer dano!\n\nTurnos restantes: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=queda de penas
items.potions.elixirs.elixiroffeatherfall.desc=Este elixir oferece um efeito de levitação mais fraco, mas mais controlado, permitindo que quem o bebe caia de grandes alturas sem se magoar por um curto período de tempo.
items.potions.elixirs.elixiroffeatherfall.light=Sente-se leve como uma pluma!
items.potions.elixirs.elixiroffeatherfall.name=elixir da queda suave
items.potions.elixirs.elixirofhoneyedhealing.desc=Este elixir combina a cura com a doçura do mel. Quando ingerido, terá o mesmo efeito que uma poção de cura e saciará uma pequena quantidade de fome, mas também pode ser atirado para curar um aliado. As criaturas com afinidade por mel podem ser apaziguadas se este item for utilizado nelas.
items.potions.elixirs.elixirofhoneyedhealing.name=elixir de cura adocicado
items.potions.elixirs.elixiroficytouch.desc=Ao ser consumido, este elixir permitirá ao bebedor absorver o calor dos inimigos que atacar. Este efeito tornará o bebedor imune ao frio e permitir-lhe-á congelar os inimigos com ataques físicos.
items.potions.elixirs.elixiroficytouch.name=elixir de toque gélido
items.potions.elixirs.elixirofmight$htboost.desc=O seu corpo sente-se anormalmente forte e saudável. A sua saúde máxima é aumentada por um período prolongado. À medida que sobe de nível, o aumento irá diminuir gradualmente. Valor atual do aumento: PH0. Níveis restantes: PH1.
items.potions.elixirs.elixirofmight$htboost.name=aumento máximo da saúde
items.potions.elixirs.elixirofmight.desc=Este poderoso líquido percorrerá os seus músculos, aumentando permanentemente a sua força em um ponto e aumentando temporariamente a sua saúde máxima em %d pontos. O aumento de saúde é proporcional à sua saúde máxima, mas irá diminuir gradualmente à medida que sobe de nível.
items.potions.elixirs.elixirofmight.msg=Uma força inédita percorre o seu corpo, agora possui a força %d!
items.potions.elixirs.elixirofmight.name=elixir do poder
items.potions.elixirs.elixiroftoxicessence.desc=Ao ser consumido, este elixir irá imbuir o bebedor de energia tóxica. O bebedor espalhará continuamente gás tóxico enquanto se move e ficará imune ao gás tóxico e ao veneno por um período ligeiramente superior à duração do efeito.
items.potions.elixirs.elixiroftoxicessence.name=elixir de essência tóxica
items.potions.exotic.exoticpotion.amber=poção de âmbar exótica
items.potions.exotic.exoticpotion.azure=poção azul exótica
items.potions.exotic.exoticpotion.bistre=poção de bistre exótica
items.potions.exotic.exoticpotion.charcoal=poção de carvão exótica
items.potions.exotic.exoticpotion.crimson=poção carmesim exótica
items.potions.exotic.exoticpotion.discover_hint=Podes criar este item através da alquimia.
