items.weapon.melee.warhammer.ability_desc=O Duelista pode desferir um _golpe pesado_ com um martelo de guerra. Este ataque concentrado causa _%1$d-%2$d de dano_ se surpreender o inimigo e o atordoar durante 5 turnos, reduzindo a precisão e a evasão em 50%%. O golpe pesado acerta sempre, mas causa dano normal se não surpreender o inimigo.
items.weapon.melee.warhammer.ability_name=golpe forte
