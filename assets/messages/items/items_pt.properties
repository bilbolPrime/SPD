items.weapon.weaponeffects.weaponeffect.smite.prefix=Bárbaro
items.weapon.weaponeffects.weaponeffect.smite.name=%s de bárbaro
items.weapon.weaponeffects.weaponeffect.smite.desc=Esta arma é _bárbara_. Cada golpe tem _20%_ de chance de lançar _Golpear de nível 1_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Golpear!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Repulsor
items.weapon.weaponeffects.weaponeffect.knockback.name=%s de repulsão
items.weapon.weaponeffects.weaponeffect.knockback.desc=Esta arma é _repulsora_. Cada golpe tem _20%_ de chance de empurrar o inimigo _uma casa_ para trás. Chefes não podem ser empurrados.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Recuo!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Serpentino
items.weapon.weaponeffects.weaponeffect.venom.name=%s da serpente
items.weapon.weaponeffects.weaponeffect.venom.desc=Esta arma é _serpentina_. Cada golpe tem _20%_ de chance de envenenar o alvo.
items.weapon.weaponeffects.weaponeffect.venom.activate=Veneno!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Aleijante
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s de mutilação
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Esta arma é _aleijante_. Os tiros que acertam têm _20%_ de chance de aleijar o inimigo por _10 turnos_. Chefes são imunes.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Aleijado!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Rúnico
items.weapon.weaponeffects.weaponeffect.spark.name=%s de runas
items.weapon.weaponeffects.weaponeffect.spark.desc=Esta varinha é _rúnica_. Sua magia tem _20%_ de chance de ativar _Fagulha_, causando _4–8_ de dano mágico extra.
items.weapon.weaponeffects.weaponeffect.spark.activate=Fagulha!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Enfeitiçante
items.weapon.weaponeffects.weaponeffect.curse.name=%s de malefício
items.weapon.weaponeffects.weaponeffect.curse.desc=Esta varinha é _enfeitiçante_. Sua magia tem _20%_ de chance de enfraquecer o alvo, reduzindo seu dano em _5%_ por _10 turnos_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Maldição!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Drenante
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s de drenagem
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Esta varinha é _drenante_. Sua magia tem _20%_ de chance de ativar _Drenar vida_, causando _8–16_ de dano mágico extra e curando você pela vida roubada.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Drenagem!

items.armor.armorprefix.stalwart.name=%s tenaz
items.armor.armorprefix.stalwart.desc=Esta armadura é _tenaz_. Os ataques inimigos têm _20%_ de chance de ativar _Resistência de nível 5_, reduzindo o dano em _20%_.
items.armor.armorprefix.stalwart.activate=Resistência!

items.armor.armorprefix.vigilant.name=%s vigilante
items.armor.armorprefix.vigilant.desc=Esta armadura é _vigilante_. Ela dá a você _20%_ de chance de esquivar de um ataque inimigo à distância.
items.armor.armorprefix.vigilant.activate=Percepção!

items.armor.armorprefix.elusive.name=%s esquiva
items.armor.armorprefix.elusive.desc=Esta armadura é _esquiva_. Sofrer dano de um ataque inimigo tem _20%_ de chance de aumentar sua evasão em _5_ por _5 turnos_.
items.armor.armorprefix.elusive.activate=Evasão!
