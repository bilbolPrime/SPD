items.weapon.melee.greatshield.ability_desc=A Duelista pode proteger-se com um grande escudo, anulando completamente todos os ataques físicos ou mágicos feitos contra ela durante _%d turnos_. Assim que a Duelista tiver bloqueado um ataque, contra-atacar ou usar magia terminará com a proteção.
