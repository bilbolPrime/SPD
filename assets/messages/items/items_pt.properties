items.weapon.melee.scimitar.typical_ability_desc=O Duelista pode executar uma _dança de espadas_ com uma cimitarra. Esta postura é ativada instantaneamente e concede ao Duelista +60%% de velocidade de ataque e +50%% de precisão, geralmente por _%d turnos._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Duração da habilidade
items.weapon.melee.shortsword.ability_desc=O Duelista pode _golpear_ um inimigo com uma espada curta. Isto causa _%1$d-%2$d de dano_ e tem acerto garantido. Se o golpe matar um inimigo, a morte é instantânea e o Duelista pode voltar a utilizar o golpe dentro de 5 turnos gratuitamente.
items.weapon.melee.shortsword.ability_name=clivar
