items.artifacts.etherealchains.cursed=Nem használhatsz elátkozott láncokat.
items.artifacts.etherealchains.desc=Ezek a nagy, mégis könnyű láncok spirituális energiával ragyognak. Használhatod őket, hogy a terep felé húzz, vagy magadhoz vonzd az ellenséget. A láncok éteri természete lehetővé teszi, hogy még a falakon is átnyúljanak!
items.artifacts.etherealchains.desc_cursed=Az elátkozott láncok az oldaladhoz vannak kötve, folyamatosan lengnek, megpróbálnak elgáncsolni vagy megkötözni.
items.artifacts.etherealchains.desc_equipped=A láncok az oldaladon nyugszanak, lassan elszívva a legyőzöttek spirituális energiáját. Minden egyes töltet egy láncszem a láncban, amely pontosan egy mezőnyire nyúlik ki.
items.artifacts.etherealchains.does_nothing=Azzal nem lesz semmi baj.
items.artifacts.etherealchains.inside_wall=A láncaid csak a falakon keresztül tudnak áthúzni, nem pedig bele.
