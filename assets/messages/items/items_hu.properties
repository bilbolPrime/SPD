items.armor.classarmor.charge_use=A képesség jelenlegi használata _%s_ töltetet fogyaszt.
items.armor.classarmor.discover_hint=Ezt a tárgyat a 20. emeleti főellenség legyőzése után találhatod meg egy adott hőssel.
items.armor.classarmor.low_charge=A páncélnak nincs elég töltése ahhoz, hogy használja a különleges képességét!
items.armor.classarmor.no_ability=A páncélodnak jelenleg nincs képessége, válassz egyet!
items.armor.classarmor.not_equipped=Ezt a páncélt kell viselned, hogy használhasd a különleges erejét!
items.armor.classarmor.transfer_cancel=mégsem
items.armor.classarmor.transfer_complete=Hősies páncélod tulajdonságait átruháztuk!
items.armor.classarmor.transfer_desc=A törpe király koronájának varázsa átvihető egy másik páncélkészletre. Fontos megjegyezni, hogy az eredeti páncél a folyamat során megsemmisül.
items.armor.classarmor.transfer_prompt=Válasszon egy páncélt
items.armor.classarmor.transfer_title=Átadópáncél
items.armor.clericarmor.desc=Miközben ezt a szövet és lemez keverékét viseli, a Klerikus egy különleges képességet hajthat végre.
items.armor.clericarmor.name=hősi ruhák
items.armor.clotharmor.desc=Ez a könnyű páncél alapvető védelmet nyújt.
items.armor.clotharmor.discover_hint=Az egyik hős ezzel a tárggyal kezdi.
items.armor.clotharmor.name=szövetpáncél
items.armor.curses.antientropy.desc=Az antientrópia átok az univerzum erői ellen hat, energiát von el a viselőjéből és eltávolítja a környezetéből. Ez rövid időre lángra lobbantja a viselőjét, de mindent megfagyaszt maga körül!
items.armor.curses.antientropy.name=Az anti-entrópia %s-ja
items.armor.curses.bulk.desc=A masszív páncélzat nagyobbnak és impozánsabbnak tűnik, de valójában nem rendelkezik fokozott védelemmel. Ami még rosszabb, a megnövekedett méret miatt nagyon nehéz bejutni az ajtókba.
items.armor.curses.bulk.name=%s ömlesztett
items.armor.curses.corrosion.desc=A korrózió páncélja képes szétrepedni a korrozív folyadékkal, és mindent ragacsos, savas iszappal vonhat be a területen.
items.armor.curses.corrosion.name=%s korrózió
items.armor.curses.displacement.desc=Az elmozdulás átka megpróbálja biztonságba helyezni viselőjét, amikor támadás éri. Azonban egy kicsit túl hatékony, véletlenszerűen teleportálja a felhasználót a pályán belül.
items.armor.curses.displacement.name=%s az elmozdulás
items.armor.curses.metabolism.desc=Az anyagcsere-átok a jóllakottságot közvetlenül egészséggé alakítja, amikor a viselőjét megsérül, lendületet adva a gyógyulásnak, de gyorsan éhezést okozva.
items.armor.curses.metabolism.name=az anyagcsere %s-ja
items.armor.curses.multiplicity.desc=A sokszorossággal átkozott páncél veszélyes másoló mágiát tartalmaz. Néha a viselőjének tükörképét hozza létre, de ugyanilyen valószínűséggel másolja le a támadót is!
items.armor.curses.multiplicity.name=%s a multiplicitásból
items.armor.curses.overgrowth.desc=A túlburjánzás páncélját különféle virágzó növények borítják. Bár ez a hatás kétségtelenül érdekesnek tűnik, semmit sem tesz a védekezésért, és ezek a növények véletlenszerűen aktiválódnak a harcban!
items.armor.curses.overgrowth.name=%s a túlnövekedésből
items.armor.curses.stench.desc=A bűzzel átkozott páncél mérgező gázfelhőket szabadít fel, amelyek veszélyesek mindenre, ami a felhőben rekedt.
items.armor.curses.stench.name=%s a bűz
items.armor.duelistarmor.desc=Amíg ezt a lemezpáncélt és köpenyt viseli, a Párbajozó egy különleges képességet tud végrehajtani.
items.armor.duelistarmor.name=hős mellvértje
items.armor.glyphs.affection.desc=Ez a hatékony jel manipulálja a támadók elméjét, átmenetileg elbűvölve őket.
items.armor.glyphs.affection.name=%s a szeretetből
items.armor.glyphs.antimagic.desc=Ez az erőteljes jel lehetővé teszi a páncél számára, hogy viselőjét a mágikus és a fizikai támadások ellen is megvédje. Ezt a mágikus védelmet nem befolyásolja a páncél szintje.
items.armor.glyphs.antimagic.name=%s antimágia
items.armor.glyphs.brimstone.desc=Ez a jel megvédi viselőjét és holmiját a tűztől, teljesen semlegesítve annak sebzését és negatív hatásait.
items.armor.glyphs.brimstone.name=%s kénből
items.armor.glyphs.camouflage.desc=Ez a jel lehetővé teszi viselőjének, hogy beleolvadjon a magas fűbe, ideiglenes láthatatlanságot biztosítva számára.
items.armor.glyphs.camouflage.name=%s álcázás
items.armor.glyphs.entanglement.desc=Ez a jel földpáncélt növeszt viselője köré, hogy elnyelje a sebzést, de ez a páncél eltörik, ha a viselője megmozdul.
items.armor.glyphs.entanglement.name=%s az összefonódásból
items.armor.glyphs.flow.desc=Ez a jel manipulálja a víz áramlását a viselője körül, így sokkal gyorsabban mozog rajta.
items.armor.glyphs.flow.name=%s az áramlás
items.armor.glyphs.obfuscation.desc=Ez a jel eltakarja viselőjét, így nehezebben észrevehető.
items.armor.glyphs.obfuscation.name=%s a homályosításból
items.armor.glyphs.potential.desc=Ez a jel energiát termel, ha eltalálják, és aktiváláskor töltéssel látja el viselője pálcáját.
items.armor.glyphs.potential.name=%s a potenciálból
items.armor.glyphs.repulsion.desc=Ez a jel visszaveri az erőt a támadók ellen, és visszarepíti őket.
items.armor.glyphs.repulsion.name=%s a taszítás
items.armor.glyphs.stone.desc=Ez a jel nehéz mágikus kővel veszi körül a páncélt, ami lehetetlenné teszi a kitérés, de a menekülés arányában blokkolja a sebzést.
items.armor.glyphs.stone.name=%s kőből
items.armor.glyphs.swiftness.desc=Ez a jel növeli a viselője sebességét, amikor nincs ellenség közelében.
items.armor.glyphs.swiftness.name=A gyorsaság %s-ja
items.armor.glyphs.thorns.desc=Ez az erős jel sebzi a támadókat, ami miatt lassan vérezni kezdenek, amikor megtámadják viselőjét.
items.armor.glyphs.thorns.name=%s tövisekből
items.armor.glyphs.viscosity$defereddamage.desc=A sebzést lassan, idővel okozzák, ahelyett, hogy azonnal okoznák.\n\nFennmaradó elhalasztott sebzés: %d.
items.armor.glyphs.viscosity$defereddamage.name=elhalasztott kár
items.armor.glyphs.viscosity$defereddamage.ondeath=A halogatott kár megölt téged...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Halasztott sérülés miatt ölték meg
items.armor.glyphs.viscosity.deferred=halasztott %d
items.armor.glyphs.viscosity.desc=Ez a jel képes tárolni a viselőjének okozott sebzést, lassan, ahelyett, hogy egyszerre okozná azt.
items.armor.glyphs.viscosity.name=%s viszkozitás
items.armor.huntressarmor.desc=A köpeny viselése közben a Vadásznő egy különleges képességet tud alkalmazni.
items.armor.huntressarmor.name=hősi köpeny
items.armor.huntressarmor.no_enemies=Nincsenek ellenségek a láthatáron
items.armor.leatherarmor.desc=Cserzett szörnyetegbőrből készült páncél. Nem olyan könnyű, mint a szövetpáncél, de jobb védelmet nyújt.
items.armor.leatherarmor.name=bőrpáncél
items.armor.magearmor.desc=Miközben ezt a gyönyörű köpenyt viseli, a Mágus egy különleges képességet tud alkalmazni.
items.armor.magearmor.name=hősi köntös
items.armor.mailarmor.desc=Az egymásba kapcsolódó fémláncok egy kemény, de rugalmas páncélt alkotnak.
items.armor.mailarmor.name=láncpáncél
items.armor.platearmor.desc=Hatalmas fémlemezekből álló öltözék páratlan védelmet nyújt minden kalandornak, aki elég erős ahhoz, hogy elbírja a döbbenetes súlyát.
items.armor.platearmor.name=lemezpáncél
items.armor.roguearmor.desc=Miközben ezt a sötét öltözéket viseli, a Zsivány egy különleges képességet tud végrehajtani.
items.armor.roguearmor.name=hősi öltözék
items.armor.scalearmor.desc=A bőr mellényre varrt fémpikkelyek rugalmas, mégis védelmező páncélt hoznak létre.
items.armor.scalearmor.name=pikkelypáncél
items.armor.warriorarmor.desc=Amíg ezt a nehéz lemezpáncélt viseli, a Harcos egy különleges képességet tud végrehajtani.
items.armor.warriorarmor.name=hős páncélja
items.artifacts.alchemiststoolkit.ac_brew=SÖRFŐZÉS
items.artifacts.alchemiststoolkit.ac_energize=ENERGIZÁLÁS
items.artifacts.alchemiststoolkit.cursed=Az átkozott eszköztárad megakadályozza, hogy alkímiát használj!
items.artifacts.alchemiststoolkit.desc=Ez az eszközkészlet számos reagenst és gyógynövényt tartalmaz egy kis keverőfiolával együtt, amely lehetővé teszi az alkímiai munkát útközben. A fiola folyékony formában lévő, alkímiai energiakristályokra emlékeztető anyagokat tartalmaz.
items.artifacts.alchemiststoolkit.desc_cursed=Az elátkozott eszköztár a te oldaladra állt, és nem engedi, hogy alkímiát használj.
items.artifacts.alchemiststoolkit.desc_hint=A felszerelt eszközkészlet lassan alkímiai energiát termel, ahogy tapasztalatot szerzel. Úgy tűnik, hogy az üvegcsében lévő keverék energiakristályok hozzáadásával fokozható.
items.artifacts.alchemiststoolkit.desc_warming=Az eszköztár jelenleg bemelegszik, és egy kis idő múlva használatra kész lesz.
items.artifacts.alchemiststoolkit.energize_1=6 energia: +1 szint
items.artifacts.alchemiststoolkit.energize_all=%1$d energia: +%2$d szintek
items.artifacts.alchemiststoolkit.energize_desc=Minden 6 energiakristály elegendő energiát ad a szerszámkészletnek egy szint eléréséhez, ami növeli az eszközkészlet energiatermelésének sebességét az idő múlásával, és azt is, hogy milyen gyorsan melegszik fel.\n\nMennyi energiát szeretnél használni?
items.artifacts.alchemiststoolkit.name=alkimista eszköztár
items.artifacts.alchemiststoolkit.need_energy=Ehhez legalább 6 energiaegységre van szükséged.
items.artifacts.alchemiststoolkit.not_ready=A szerszámkészleted még nem fejezte be a bemelegedést.
items.artifacts.artifact.cannot_wear_two=Nem viselhetsz két ugyanolyan ereklyét.
items.artifacts.artifact.curse_known=Érezheted, hogy egy rosszindulatú mágia lappang a tárgyban.
items.artifacts.artifact.equip_cursed=A műtárgy fájdalmasan hozzád kötődik.
items.artifacts.artifact.need_to_equip=Ehhez fel kell szerelned az ereklyédet.
items.artifacts.artifact.not_cursed=Ez a tárgy mentes a rosszindulatú mágiától.
items.artifacts.capeofthorns$thorns.desc=A köpenyed energiát sugároz, eltérítő erőtérrel körülvéve!\n\nA tövishatás aktív állapotában az összes kapott sebzés csökken. Továbbá, ha a támadó melletted van, a csökkentett mennyiség visszaverődik rá.\n\nHátralévő tövisfordulók száma: %s.
items.artifacts.capeofthorns$thorns.inert=A köpenyed ismét mozdulatlanná válik.
items.artifacts.capeofthorns$thorns.levelup=A köpenyed egyre erősebbé válik!
items.artifacts.capeofthorns$thorns.name=tövisek
items.artifacts.capeofthorns$thorns.radiating=A köpenyed energiát kezd sugározni, védettnek érzed magad!
items.artifacts.capeofthorns.desc=Ezek a DM-300-ból származó, összeomlott fémlemezek merev köpenyt alkotnak. Úgy tűnik, mély energiát tárol, talán a DM-300 erejének egy részét hordozza magában?
items.artifacts.capeofthorns.desc_active=A köpeny mintha felszabadítaná a tárolt energiát, védelmező erőt sugároz.
items.artifacts.capeofthorns.desc_inactive=A köpeny megnyugtatóan nehéznek érződik a válladon, mintha energiát nyerne a beléd szoruló sebzéstől.
items.artifacts.capeofthorns.name=tövisfok
items.artifacts.chaliceofblood.ac_prick=PÖCS
items.artifacts.chaliceofblood.desc=Ez a ragyogó ezüst kehely furcsán éles drágakövekkel van díszítve a peremén.
items.artifacts.chaliceofblood.desc_1=Miközben a kezedben tartod a kelyhet, furcsa késztetést érzel, hogy megszúrd magad az éles drágakövekkel.
items.artifacts.chaliceofblood.desc_2=Véred egy része a kehelybe gyűlik, finoman érezheted, ahogy a kehely életenergiával tölt fel, fokozva természetes egészséged regenerálódását. Még mindig meg akarod vágni magad a kehelyen, pedig tudod, hogy fájni fog.
items.artifacts.chaliceofblood.desc_3=A kehely színültig megtelik az életed esszenciájával. Érzed, ahogy a kehely visszaáramlik beléd az életenergiát.
items.artifacts.chaliceofblood.desc_cursed=Az elátkozott kehely a kezedhez kötötte magát, és gátolja az életerő regenerálódásának képességét.
items.artifacts.chaliceofblood.name=véres kehely
items.artifacts.chaliceofblood.no=Nem, meggondoltam magam
items.artifacts.chaliceofblood.ondeath=A Kehely kiszívja az életed esszenciáját...
items.artifacts.chaliceofblood.onprick=Megszúrod magad, és az életlényeged a kehelybe folyik.
items.artifacts.chaliceofblood.prick_warn=Minden alkalommal, amikor használod a kehelyt, az egyre több életenergiát szív el, de cserébe tovább fokozza a természetes életerő-regenerációdat.\n\nJelenleg a saját szúrásod _%1$d-%2$d sebzést_ okozol, bár ez a sebzés csökkenthető _fizikai és mágikus blokkolással vagy sebzéscsökkentéssel_.A sebzéscsökkentő hatások figyelembevétele nélkül a saját szúrásodnak jelenleg _%3$s%% esélye van_ arra, hogy teljesen kiszívja az életerődet.\n\nBiztos vagy benne, hogy több életenergiát szeretnél adni a kehelynek?
items.artifacts.chaliceofblood.yes=Igen, tudom, mit csinálok
items.artifacts.cloakofshadows$cloakstealth.desc=Az árnyékköpenye láthatatlanságot kölcsönöz neked, amíg beborít. Köpeny alatt maradsz, amíg az be nem vonódik, vagy a köpenyed le nem merül.\n\nAmíg láthatatlan vagy, az ellenségek nem tudnak megtámadni vagy követni. A fizikai támadások és a mágikus hatások (például tekercsek és pálcák) azonnal megszüntetik a láthatatlanságot.\n\nKörök a töltethasználatig: %d.
