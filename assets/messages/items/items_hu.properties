items.weapon.melee.magesstaff.imbue_desc=Biztosan át akarod adni a személyzetednek ezt a pálcát?\n\nHa a felruházandó pálca azonos vagy magasabb szintű, mint a személyzet, a személyzet örökli a pálca szintjét, plusz egyetlen saját fejlesztését.
