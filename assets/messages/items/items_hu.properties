items.rings.ringofwealth.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%s%%_-val növelve a szerencsédet.
items.rings.ringofwealth.desc=Ez a gyűrű mágnesként vonzza a kincseket, növelve annak valószínűségét, hogy az ellenségek és a tárolók értékes tárgyakat hordoznak. Egy elátkozott gyűrű ehelyett csökkenti a zsákmány megszerzésének esélyét.
