items.artifacts.masterthievesarmband.cursed=Nem használhatsz elátkozott karszalagot.
items.artifacts.masterthievesarmband.desc=Ez a lila bársony karszalag egy mestertolvaj bélyegét viseli magán. Ez nem a tiéd, de valószínűleg az előző használójáé sem volt.
items.artifacts.masterthievesarmband.desc_cursed=Az elátkozott karszalag a csuklódra van kötve, és valahogy az aranyzacskód is egyre könnyebbnek tűnik...
items.artifacts.masterthievesarmband.desc_worn=Ahogy tapasztalatot szerzel, érzed, ahogy a csuklódon lévő karszalagban egyre több erő gyűlik. Ezt a képességet boltokból való lopásra vagy ellenségek kirablására használhatod!\n\nAz ellenségek kirablása azonnal megtörténik, rövid időre megzavarja őket, és esélyt ad arra, hogy megszerezd a zsákmányukat! Ez a képesség hatékonyabb a nem tudó ellenségek ellen. Ugyanazon ellenség többszöri kirablása nem ad több esélyt a zsákmányra.
items.artifacts.masterthievesarmband.failed_steal=Nem sikerült semmit ellopnod.
items.artifacts.masterthievesarmband.full=A karpántod teljesen fel van töltve!
items.artifacts.masterthievesarmband.level_up=Egyre erősebb a karszalagod!
items.artifacts.masterthievesarmband.name=mestertolvajok karszalagja
items.artifacts.masterthievesarmband.no_charge=A karpántod nincs elég feltöltve.
items.artifacts.masterthievesarmband.no_steal=Annak az ellenségnek nincs mit ellopnia.
items.artifacts.masterthievesarmband.no_target=Egy veled szomszédos ellenséget kell megcéloznod.
items.artifacts.masterthievesarmband.prompt=Válassz egy ellenséget a célpontodnak
items.artifacts.masterthievesarmband.steal_shopkeeper=Közvetlenül a boltosoktól nem lehet lopni.
items.artifacts.masterthievesarmband.stole_item=Elloptál egy tárgyat: %s.
items.artifacts.sandalsofnature.absorb_seed=A lábbeli magába szívja a magot, egészségesebbnek tűnnek.
items.artifacts.sandalsofnature.ac_feed=TAKARMÁNY
items.artifacts.sandalsofnature.ac_root=GYÖKÉR
items.artifacts.sandalsofnature.desc_1=Ami elsőre zsinegből készült szandálnak tűnik, valójában két növény! Nagyon gyengének és sápadtnak tűnnek, talán tápanyagra van szükségük?
items.artifacts.sandalsofnature.desc_2=A lábbeli megnőtt, és most már jobban hasonlít két szabott cipőre. Visszatért rájuk a szín, talán még tovább nőhetnek?
items.artifacts.sandalsofnature.desc_3=A növények újra kinőttek, és most egy pár tömör, kéregből készült csizmára hasonlítanak. Úgy tűnik, a növények visszanyerték erejüket, de talán még tovább is növekedhetnek?
items.artifacts.sandalsofnature.desc_4=A növények láthatóan elérték maximális méretüket, egy pár páncélos lábszárvédőre hasonlítanak. A lábszárszár mélybarna és egy nagyon erős fára hasonlít.
items.artifacts.sandalsofnature.desc_ability=A lábbeli a legutóbb adott mag színében fodrozódik. Rövid időre meggyökerezhetnek a földben, és 3 csempés sugarú körön belül bárhol előidézhetik a növény hatását.\nMag: _%s_\nSzükséges töltés: _%d%%_
items.artifacts.sandalsofnature.desc_cursed=Az elátkozott szandálok megakadályozzák a természettel való összhangot.
items.artifacts.sandalsofnature.desc_hint=Miközben ezt az ékszert viseled, jobban ráhangolódsz a természetre.
items.artifacts.sandalsofnature.desc_seeds=Magokkal etetted a lábbelit %d.
items.artifacts.sandalsofnature.levelup=Megnő a lábbeli mérete!
items.artifacts.sandalsofnature.low_charge=A cipődnek nincs elég energiája ehhez.
items.artifacts.sandalsofnature.name=a természet szandáljai
items.artifacts.sandalsofnature.name_1=a természet cipői
items.artifacts.sandalsofnature.name_2=a természet csizmái
items.artifacts.sandalsofnature.name_3=a természet lábtörlője
items.artifacts.sandalsofnature.no_effect=Először egy magot kell a lábbelidbe juttatnod.
items.artifacts.sandalsofnature.out_of_range=A helyszín hatótávolságon kívül esik.
items.artifacts.sandalsofnature.prompt=Válasszon egy vetőmagot
items.artifacts.sandalsofnature.prompt_target=Válasszon egy helyet
items.artifacts.skeletonkey$keywall.desc=Egy ideiglenes mágikus falat helyezett el itt a csontvázkulcs.
items.artifacts.skeletonkey.ac_insert=BESZÚRÁS
items.artifacts.skeletonkey.crystal_charges=Egy kristályzár kinyitásához 5 töltés szükséges.
items.artifacts.skeletonkey.cursed=Nem használhatsz elátkozott csontkulcsot.
items.artifacts.skeletonkey.desc=Egy fontosnak tűnő kulcs, koponya alakú fejjel. A fogai minden ránézésre másnak tűnnek.
items.artifacts.skeletonkey.desc_cursed=Az elátkozott kulcs mintha aktívan kerülné a zárba férését, sőt, még a többi kulcsod használatát is megnehezíti (de nem lehetetlenné teszi).
items.artifacts.skeletonkey.desc_worn=Ez a varázslatos kulcs úgy tűnik, egyre erősebbé válik, ha a kazamata normál kulcsai helyett használod. Szinte bármelyik kazamata zárjába beilleszthető, hogy kinyissa vagy bezárja azokat, beleértve azokat az ajtókat is, amelyek korábban soha nem voltak zárva. \n\n A kulcs akár üres térben is használható, kardinális vagy átlós irányban, hogy „lezárja” magad előtt a levegőt, egy 3 mező széles tömör falat hozva létre, amely 10 körig tart. A bezárás eltaszítja az ellenséget, ha van rá hely.
items.artifacts.skeletonkey.discard=Eldobod a felesleges kulcsaidat.
items.artifacts.skeletonkey.force_lock=A zár meggyengült a csontkulcsod nélkül. Sikerül kinyitnod.
items.artifacts.skeletonkey.gold_charges=Egy arany lakat kinyitásához 2 töltet szükséges.
items.artifacts.skeletonkey.invalid_target=Nincs ott semmi, amit zárni vagy kinyitni lehetne.
items.artifacts.skeletonkey.iron_charges=Egy normál zár kinyitása 1 feltöltéssel lehetséges.
items.artifacts.skeletonkey.levelup=A csontkulcsod egyre erősebbé válik!
items.artifacts.skeletonkey.lock_charges=Egy ajtó bezárása 2 töltést igényel.
items.artifacts.skeletonkey.lock_no_space=Nem zárhatsz be egy karaktert egy ajtón belülre!
items.artifacts.skeletonkey.locked_with_key=Az ajtót a te csontkulcsoddal zártad.
items.artifacts.skeletonkey.name=álkulcs
items.artifacts.skeletonkey.prompt=Válasszon egy célt
items.artifacts.skeletonkey.wall_charges=Egy ideiglenes fal létrehozásához 2 töltet szükséges.
items.artifacts.skeletonkey.wont_open=A kulcs valamiért nem akar beleférni ebbe a zárba.
items.artifacts.talismanofforesight$foresight.desc=Nagyon idegesnek érzed magad, mintha láthatatlan veszély leselkedne a közelben.
items.artifacts.talismanofforesight$foresight.name=előrelátás
items.artifacts.talismanofforesight$foresight.uneasy=Nyugtalanul érzed magad.
items.artifacts.talismanofforesight.ac_scry=KRISTÁLYGOLYÓBÓL JÖVENDÖL
items.artifacts.talismanofforesight.desc=Egy sima kő, furcsa bevésésekkel. Úgy érzed, mintha mindent figyelne körülötted, és minden rejtett dolgot keresne.
items.artifacts.talismanofforesight.desc_cursed=Az elátkozott talizmán feszülten bámul beléd, eltompítva az érzékeidet.
items.artifacts.talismanofforesight.desc_worn=Amikor a kezedben tartod a talizmánt, úgy érzed, hogy az érzékeid felerősödnek. A talizmán lassan feltöltődik az idő múlásával, és ahogy rejtett ajtókat vagy csapdákat fedezel fel. \n\n A talizmán a töltését kúp alakban képes „felderíteni”, ami felfedi a beolvasott területen lévő összes mezőt és titkot, és rövid időre látást biztosít az ellenségekről és a tárgyakról.
items.artifacts.talismanofforesight.full_charge=A Talizmánod teljesen fel van töltve!
items.artifacts.talismanofforesight.levelup=Egyre erősebb lesz a talizmánod!
items.artifacts.talismanofforesight.low_charge=A talizmánnak legalább 5% töltésre van szüksége a sikításhoz.
items.artifacts.talismanofforesight.name=az előrelátás talizmánja
items.artifacts.talismanofforesight.prompt=Válasszon egy helyet a szkenneléshez.
items.artifacts.timekeepershourglass$sandbag.desc=Ez a kis zacskó finom homok tökéletesen illik a homokórádhoz.\n\nFurcsának tűnik, hogy a boltosnak pont ez a konkrét tárgya van a kezében, amikor szükséged van rá...
items.artifacts.timekeepershourglass$sandbag.levelup=Homokot teszel a homokórádba.
items.artifacts.timekeepershourglass$sandbag.maxlevel=A homokórád varázslatos homokkal van tele!
items.artifacts.timekeepershourglass$sandbag.name=zacskó varázshomok
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Nincs homokórád, amibe beletehetnéd ezt a homokot.
items.artifacts.timekeepershourglass$timefreeze.desc=Az idő megfagy körülötted, így azonnal végrehajthatsz akciókat. A hatás addig tart, amíg vissza nem vonják, vagy a homokórád le nem merül. Támadás vagy mágia használata is megtöri ezt a hatást. \n\nFordulások a töltésfelhasználásig: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Időfagyasztás
items.artifacts.timekeepershourglass.ac_activate=AKTIVÁLÁS
items.artifacts.timekeepershourglass.cursed=Nem használhatsz elátkozott homokórát.
items.artifacts.timekeepershourglass.deactivate=Kikapcsolod az időbeállítást.
items.artifacts.timekeepershourglass.desc=Ez a nagy, díszes homokóra meglehetősen szerénynek tűnik, de finoman faragott keretében hatalmas erő lakozik. Ahogy forgatod a homokórát és nézed, ahogy ömlik a homok, érezheted, ahogy a varázslat magával ragad. Biztosan adna némi kontrollt az idő felett.
items.artifacts.timekeepershourglass.desc_cursed=Az elátkozott homokóra az oldaladhoz van szorítva, érzed, ahogy megpróbálja manipulálni az idő folyását.
items.artifacts.timekeepershourglass.desc_hint=Úgy tűnik, a homokóra veszített némi homokot, bárcsak találnál egy kicsit...
items.artifacts.timekeepershourglass.freeze=Fagyaszd meg az időt körülöttem
items.artifacts.timekeepershourglass.name=időmérő homokórája
items.artifacts.timekeepershourglass.no_charge=A homokórád még nem töltött fel annyira, hogy használható legyen.
items.artifacts.timekeepershourglass.onfreeze=Hirtelen minden megfagy körülötted.
items.artifacts.timekeepershourglass.onstasis=Úgy tűnik, a világ egy szempillantás alatt megváltozik körülötted.
items.artifacts.timekeepershourglass.prompt=Hogyan szeretnéd használni a homokóra varázslatát?\n\nÁtállásban az idő a szokásos módon telik, míg te megfagyva és teljesen sebezhetetlen vagy, és egyszerre legfeljebb 2 töltetet fogyaszt.\n\nAmikor az idő meg van fagyva, úgy mozoghatsz, mintha a cselekedeteid nem tartanának sokáig. Ez bármikor kikapcsolható a homokóra használatával vagy támadással.
items.artifacts.timekeepershourglass.stasis=Állandó állapotba hozom magam
items.artifacts.unstablespellbook.ac_add=HOZZÁADÁS
items.artifacts.unstablespellbook.ac_read=OLVAS
items.artifacts.unstablespellbook.blinded=Vakon nem lehet olvasni a könyvből.
items.artifacts.unstablespellbook.cursed=Egy elátkozott varázskönyvből nem lehet olvasni.
items.artifacts.unstablespellbook.desc=Ez a kötet meglepően jó állapotban van a korához képest. Recsegés-ropogás folyik benne, ahogy lapozol, ingatag energiával telve. Ha ebből a könyvből olvasol, nem tudhatod, milyen varázslatot használhatsz.
items.artifacts.unstablespellbook.desc_cursed=Az elátkozott könyv hozzád kötötte magát, és megakadályozza, hogy a legtöbb tekercset használd.
items.artifacts.unstablespellbook.desc_empowered=A könyvhöz hozzáadott tekercsek erőtől ragyognak. Kiválaszthatod a tekercsek effektjeinek egzotikus változatát, de felár ellenében.
items.artifacts.unstablespellbook.desc_index=A könyv hiányos. A tárgymutató jelenleg a következő üres oldalakra mutat:
items.artifacts.unstablespellbook.infuse_scroll=A tekercs energiáját beleviszed a könyvbe.
items.artifacts.unstablespellbook.name=instabil varázskönyv
items.artifacts.unstablespellbook.no_charge=A varázskönyvedből egyelőre kifogyott az energia.
items.artifacts.unstablespellbook.prompt=Válasszon ki egy görgetést
items.artifacts.unstablespellbook.read_empowered=A varázskönyvhöz adott tekercs energiával teli. A tekercs hatásának normál vagy egzotikus változatát is aktiválhatod. Az egzotikus változat kiválasztása 2 töltetbe kerül 1 helyett.
items.artifacts.unstablespellbook.unable_scroll=Ezt a tekercset nem lehet hozzáadni a könyvhöz.
items.artifacts.unstablespellbook.unknown_scroll=Még nem vagy biztos benne, hogy milyen típusú tekercs ez.
items.bags.bag.discover_hint=Ezt a terméket megvásárolhatja egy üzletben.
items.bags.bag.name=hátizsák
items.bags.magicalholster.desc=Ez a karcsú tok egzotikus állatbőrből készült, és erős mágiával rendelkezik, amely lehetővé teszi, hogy hatalmas mennyiségű távolsági fegyvert tároljon benne.\n\nEgyszerűen benyúlhatsz a táskába, és mindig megragadhatod a keresett tárgyat.\n\nA tok mágiájának köszönhetően a pálcák valamivel gyorsabban töltődnek, és a hajítófegyverek valamivel tovább bírják benne.
items.bags.magicalholster.name=varázslatos tok
items.bags.potionbandolier.desc=Ez a vastag vállpánt övként illeszkedik a mellkasodra, és számos szigetelt pánt található rajta, amelyekben bájitalfiolákat, vizestömlőt vagy folyékony fémfiolákat tarthatsz. \n\n A vállpántban tartva a bájitalaidat védeni kell a hidegtől.
items.bags.potionbandolier.name=bájitaltartó
items.bags.scrollholder.desc=Ez a cső alakú tartály úgy néz ki, mintha egy csillagász eszközeit és térképeit tartaná, de a tekercseid is ugyanúgy elférnek benne. Van még néhány oldalsó rekesz is, amelyekben szépen elférnek a varázskristályok, az arkán stylusok és az arkán gyanta.\n\nA tartó nem tűnik túl gyúlékonynak, így a tekercseidnek biztonságban kell lenniük a benne lévő tűztől.
items.bags.scrollholder.name=tekercstartó
items.bags.velvetpouch.desc=Ez a kis bársony tasak sok apró tárgyat tárolhat benne, például magokat, rúnaköveket és néhány alkímiai hozzávalót.
items.bags.velvetpouch.discover_hint=Az egyik hős ezzel a tárggyal kezdi.
items.bags.velvetpouch.name=bársony tasak
items.bombs.arcanebomb.desc=Ez a bomba arkán tulajdonságokkal van felruházva. Egy erős robbanássá fog robbanni, hasonlóan Goo felpörgetett támadásához, _%1$d-%2$d mágikus sebzést_ okozva bárminek 2 mezőn belül.
items.bombs.arcanebomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.arcanebomb.name=arkán bomba
items.bombs.bomb$doublebomb.desc=Két jókora fekete lőporos bomba egy halomban, úgy tűnik, egyet ingyen kapsz!
items.bombs.bomb$doublebomb.name=két bomba
items.bombs.bomb.ac_lightthrow=VILÁGÍTÁS ÉS DOBÁS
items.bombs.bomb.desc=Egy meglehetősen nehéz fekete lőporos bomba. Egy robbanás ebből a bombából _%1$d-%2$d sebzést okoz_ mindennek, ami mellette van, és elpusztít néhány szomszédos tereptárgyat vagy tárgyat.
items.bombs.bomb.desc_burning=Ég a bomba gyújtózsinórja, tarts távolságot, vagy oltsd el!
items.bombs.bomb.desc_fuse=Úgy tűnik, a biztosítéknak pár lövés kell, hogy kiégjen, ha meggyulladt.
items.bombs.bomb.name=bomba
items.bombs.bomb.ondeath=A robbanás megöl...
items.bombs.bomb.rankings_desc=Robbanás ölte meg
items.bombs.bomb.snuff_fuse=Gyorsan eloltod a bomba gyújtózsinórját.
items.bombs.firebomb.desc=Ez a bomba úgy lett módosítva, hogy nagyobb területen robbanjon fel, _%1$d-%2$d sebzést okozva_ és tartós lángot terjesztve 2 mezőn belül.
items.bombs.firebomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.firebomb.name=gyújtóbomba
items.bombs.flashbangbomb.desc=Ez a testreszabott bomba fény-, hang- és elektromos robbanássá válik, amikor felrobban. Bármi, ami 2 mezőn belül van, _%1$d-%2$d sebzést_ szenved el a robbanástól, további 25%% sebzést az elektromosságtól, és 10 körre elkábul.
items.bombs.flashbangbomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.flashbangbomb.name=villanás
items.bombs.frostbomb.desc=Ez a bomba úgy lett módosítva, hogy nagyobb területen robbanjon fel, _%1$d-%2$d sebzést okozva_ és hosszan tartó, jeges levegőt terjesztve 2 mezőn belül.
items.bombs.frostbomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.frostbomb.name=fagybomba
items.bombs.holybomb.desc=Ezt a bombát úgy módosították, hogy robbanáskor nagyobb területen villanjon fel szent fény. Bármi, ami 2 mezőn belül van, _%1$d-%2$d sebzést_ szenved el a robbanástól, az élőhalott vagy démoni ellenségek pedig további 50%% sebzést szenvednek el a szent fénytől.
items.bombs.holybomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.holybomb.name=szent bomba
items.bombs.noisemaker.desc=Ez a testreszabott bomba ismételten zajt ad ki, amikor a gyújtózsinórja kiég. Amikor valami hozzáér a bombához, felrobban, és _%1$d-%2$d sebzést_ okoz bárminek 2 mezőn belül!
items.bombs.noisemaker.desc_burning=A zajkeltő ketyeg, felrobban, ha valami a közelébe ér!
items.bombs.noisemaker.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.noisemaker.name=zajkeltő
items.bombs.regrowthbomb.desc=Ez a testreszabott bomba 3 mezőn belül mindenfelé életet adó folyadékot fröcsköl szét a robbanás helyett. A robbanás által elfogott területen gyorsan fű és növények nőnek. Te és a robbanás által elfogott szövetségeseid úgy gyógyulnak meg, mintha gyógyító italt ittak volna.
items.bombs.regrowthbomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.regrowthbomb.name=újranövesztő bomba
items.bombs.shrapnelbomb.desc=Ezt a bombát DM-300 fémforgáccsal módosították, ami felrobbanáskor darabokra törik és szétszóródik, hatalmas távolságban _%1$d-%2$d sebzést_ okozva a bomba körül. Jobb, ha elbújsz valami mögé, amikor használod...
items.bombs.shrapnelbomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.shrapnelbomb.name=repeszbomba
items.bombs.smokebomb.desc=Ezt a bombát úgy módosították, hogy a robbanással egy időben vastag gázfelhőt köpjön ki. _%1$d-%2$d sebzést okoz_ és ködöt terjeszt 2 mezőn belül.
items.bombs.smokebomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.smokebomb.name=füstbomba
items.bombs.woollybomb.desc=Ez a testreszabott bomba felrobbanása után egy széles, varázslatos juhokból álló mezőt hoz létre. A robbanás _%1$d-%2$d sebzést_ okoz mindennek 2 mezőn belül. A juhok blokkolják a mozgást és nagyon sokáig kitartanak! Erős ellenségek jelenlétében azonban nem maradnak olyan sokáig, és manuálisan, velük interakcióba lépve hamarabb eloszlathatók.
items.bombs.woollybomb.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.bombs.woollybomb.name=gyapjas bomba
items.brokenseal$warriorshield.desc_active=A Harcos feltört pecsétje jelenleg segít neki kitartani, az életereje mellett pajzsot is biztosít neki. A pajzs aktiválódása után van egy kis lehűlési idő, mielőtt újra használható lenne.\n\nEz a pajzs idővel nem gyengül, de megszűnik, ha néhány körig nincsenek ellenségek a közelben. Amikor véget ér, a fel nem használt pajzs csökkenti a lehűlési időt, maximum 50-ig.%%.\n\nMegmaradt pajzs: %1$d.\n\nJelenlegi lehűlési idő: %2$d.
items.brokenseal$warriorshield.desc_cooldown=A Harcos nemrég pajzsot kapott a feltört pecsétjétől, és várnia kell, amíg újra élvezheti annak előnyeit. \n\nHátralévő körök: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=A Harcos pajzsának töltési ideje jelenleg negatív, ami azt jelenti, hogy amikor a pajzsa aktiválódik, a töltési idő alacsonyabb lesz, mint a szokásos 150 kör. A pajzs töltési ideje akár -150 körre is csökkenthető, ami azt jelenti, hogy aktiválás után azonnal újra elérhető lesz. \n\nJelenlegi töltési idő: %d.
items.brokenseal$warriorshield.name=Harcos pajzs
items.brokenseal.ac_affix=RAGASZTÁS
items.brokenseal.affix=Te ragaszd a pecsétet a páncélodra!
items.brokenseal.choose_desc=Ez a páncél és a feltört pecsét is hordoz egy jelet. Válaszd ki, melyik jelet szeretnéd megtartani.\n\nPáncél jele: %1$s\nTörött pecsét jele: %2$s\n\nVedd figyelembe, hogy ha a páncélon jelenleg lévő jelet választod, a pecsét később nem tudja átvinni.
items.brokenseal.choose_title=Válasszon egy karakterjelet
items.brokenseal.cursed_armor=A pecsét nem vonatkozik az elátkozott páncélra.
items.brokenseal.desc=Egy viaszpecsét, amelyet páncélra erősítettek a bátorság szimbólumaként. Közepére egy kifakult, védelmet jelképező rúna van vésve, és középen ketté van repedve.\n\nEgy otthonából származó emlék, a pecsét segít a harcosnak kitartani. A pecsét viselése közben a harcos azonnal pajzsot kap, amikor az életerejének felére vagy az alá csökkenne a sebzése.\n\nA pecsét _páncélra rögzíthető_, és páncélok között mozgatható. Egyetlen fejlesztést hordozhat magában, amennyiben azt a fejlesztést a páncélra alkalmazták, miközben a pecsét rajta volt.
items.brokenseal.discover_hint=Az egyik hős ezzel a tárggyal kezdi.
