items.weapon.melee.greatsword.ability_desc=A Párbajozó _hasíthat_ egy ellenséget egy nagykarddal. Ez _%1$d-%2$d sebzést okoz_ és garantáltan talál. Ha a hasítás megöl egy ellenséget, az azonnal hat, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.melee.greatsword.ability_name=hasít
items.weapon.melee.greatsword.desc=Ez a magas penge minden lendítésbe beleteszi súlyát, és súlyos sebzést okoz.
