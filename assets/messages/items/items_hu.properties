items.scrolls.scroll.no_magic=Mágiaimmunitás alatt nem olvashatsz tekercset.
items.scrolls.scroll.odal=ODAL tekercs
items.scrolls.scroll.raido=RAIDO tekercs
items.scrolls.scroll.sowilo=SOWILO tekercs
items.scrolls.scroll.tiwaz=TIWAZ tekercs
items.scrolls.scroll.unknown_desc=Ezt a pergament olvashatatlan írás borítja, címként a %s rúna áll rajta. Ki tudja, mi történik, ha hangosan felolvasod?
items.scrolls.scroll.yngvi=YNGVI tekercse
items.scrolls.scrollofidentify.desc=Véglegesen felfedi egyetlen tárgy összes titkát.
items.scrolls.scrollofidentify.inv_title=Egy elem azonosítása
items.scrolls.scrollofidentify.it_is=A tételed azonosítása megtörtént: %s.
items.scrolls.scrollofidentify.name=azonosító tekercs
items.scrolls.scrolloflullaby.desc=Egy nyugtató dallam mély álomba taszít minden lényt a látóteredben, lehetőséget adva arra, hogy elmenekülj, vagy meglepetésszerűen támadj rájuk.
items.scrolls.scrolloflullaby.name=altatódaltekercs
items.scrolls.scrolloflullaby.sooth=A tekercs megnyugtató dallamot szól. Nagyon álmosnak érzed magad.
items.scrolls.scrollofmagicmapping.desc=Amikor ezt a tekercset elolvasod, egy kristálytiszta kép vésődik az emlékezetedbe, amely figyelmeztet a pálya pontos elrendezésére és feltárja az összes rejtett titkot. A tárgyak és lények helyzete ismeretlen marad.
items.scrolls.scrollofmagicmapping.layout=Most már ismeri a szintek elrendezését.
items.scrolls.scrollofmagicmapping.name=mágikus térképezés tekercs
items.scrolls.scrollofmirrorimage.copies=A tekercs tükörképedet alkotja.
items.scrolls.scrollofmirrorimage.desc=A tekercsen lévő varázsige illúziós ikreket hoz létre az olvasóból, akik üldözőbe veszik ellenségeit.
items.scrolls.scrollofmirrorimage.name=tükörkép tekercs
items.scrolls.scrollofmirrorimage.no_copies=A tekercs megpróbál tükörképedet létrehozni, de nincs hová menniük.
items.scrolls.scrollofrage.desc=Ha hangosan felolvasod, ez a tekercs hatalmas üvöltést szabadít fel, ami minden ellenséget az olvasóhoz vonz, a közelben lévőket pedig feldühíti.
items.scrolls.scrollofrage.name=dühtekercs
items.scrolls.scrollofrage.roar=A tekercs dühítő üvöltést hallat, ami visszhangzik az egész kazamatában!
items.scrolls.scrollofrecharging.desc=A pergamenbe zárt nyers mágikus erő, amikor felszabadul, teljes erővel tölti fel az olvasó összes pálcáját.
items.scrolls.scrollofrecharging.name=feltöltés tekercse
items.scrolls.scrollofrecharging.surge=Energiaáradat járja át a tested, felpezsdítve a pálcáidat!
items.scrolls.scrollofremovecurse.cleansed=A tárgyad tisztító fénnyel izzik, és egy rosszindulatú energia szétszóródik!
items.scrolls.scrollofremovecurse.desc=A tekercsen található varázsige azonnal eltávolítja az olvasó fegyveréről, páncéljáról, gyűrűiről és hordott tárgyairól az összes gonosz varázslatot, ami megakadályozhatná viselőjét azok eltávolításában.
items.scrolls.scrollofremovecurse.inv_title=Tisztítson meg egy elemet
items.scrolls.scrollofremovecurse.name=átok eltávolításának tekercse
items.scrolls.scrollofremovecurse.not_cleansed=A tárgyad tisztító fénnyel világít, de semmi sem történik.
items.scrolls.scrollofremovecurse.spirit=A tekercsed kiszabadítja a gyötrődő lelket!
items.scrolls.scrollofretribution.blast=Erőteljes mágikus energia tör elő a tekercsből!
items.scrolls.scrollofretribution.desc=Ez a tekercs pusztító energiát tartalmaz, amely az olvasó szenvedését egy erőkifejtéssé formálja. Minél gyengébb az olvasó, annál több sebzést okoz. Nagyon alacsony életerővel ez a tekercs a legtöbb ellenséget azonnal megölheti. A tekercs használata azonban megviseli a felhasználót, megvakítja és legyengíti.
items.scrolls.scrollofretribution.name=a megtorlás tekercsét
items.scrolls.scrollofteleportation.cant_reach=Oda nem lehet teleportálni.
items.scrolls.scrollofteleportation.desc=A pergamenen lévő varázslat azonnal egy véletlenszerű helyre repíti az olvasót a kazamata szintjén. Használható egy veszélyes helyzetből való menekülésre, de a balszerencsés olvasó egy még veszélyesebb helyen találhatja magát.
items.scrolls.scrollofteleportation.name=teleportációs tekercs
items.scrolls.scrollofteleportation.no_tele=A teleportációs varázslat kudarcot vall.
items.scrolls.scrollofteleportation.prompt=Válasszon egy helyet a teleportáláshoz
items.scrolls.scrollofteleportation.tele=Egy szempillantás alatt teleportáltak a szint egy másik helyére.
items.scrolls.scrollofterror.desc=Egy vörös fényvillanás rémülettel tölti el a látóteredben lévő összes lényt, akik megfordulnak és elmenekülnek. Egy menekülő ellenség megtámadása eloszlatja a hatást.
items.scrolls.scrollofterror.many=A tekercs ragyogó vörös fényvillanást bocsát ki, és a szörnyek elmenekülnek!
items.scrolls.scrollofterror.name=rémület tekercse
items.scrolls.scrollofterror.none=A tekercs ragyogó vörös fényvillanást bocsát ki.
items.scrolls.scrollofterror.one=A tekercs ragyogó vörös fényvillanást bocsát ki, és a %s elmenekül!
items.scrolls.scrolloftransmutation.desc=Ez a tekercs erős transzmutációs mágiát tartalmaz. Ha egy erre a célra alkalmas tárgyon használod, akkor azt egy ugyanolyan típusú, de azonos tárggyá alakítja át. A mágia még a fejlesztéseket, varázslatokat és szimbólumokat is megőrzi. A tekercsek és főzetek egzotikus megfelelőikké alakulnak át, és fordítva.
items.scrolls.scrolloftransmutation.inv_title=Egy tárgy átalakítása
items.scrolls.scrolloftransmutation.morph=A tárgyad valami mássá alakul!
items.scrolls.scrolloftransmutation.name=transzmutációs tekercs
items.scrolls.scrolloftransmutation.nothing=Semmi érdekes nem történik.
items.scrolls.scrollofupgrade.desc=Ez a tekercs egyetlen tárgyat fejleszt, javítva annak minőségét. Egy pálca ereje és a töltetek száma megnő; egy fegyver több sebzést okoz vagy gyakrabban találja el a célpontját; egy páncél több ütést hárít el; egy gyűrű hatása a viselőjére fokozódik. A fegyverek és a páncélok használatához kevesebb erőre lesz szükség, és a tárgyra vonatkozó átkok is eltűnnek.
items.scrolls.scrollofupgrade.inv_title=Tárgy fejlesztése
items.scrolls.scrollofupgrade.name=fejlesztés tekercse
items.scrolls.scrollofupgrade.remove_curse=A fejlesztés tekercse megtisztítja a tárgyadon lévő átkot!
items.scrolls.scrollofupgrade.weaken_curse=A fejlesztés tekercs gyengíti a tárgyadon lévő átkot.
items.spells.alchemize$wndalchemizeitem.energize=Válts %d energiává
items.spells.alchemize$wndalchemizeitem.energize_1=Válts 1-et %d energiává
items.spells.alchemize$wndalchemizeitem.energize_all=Válts mindent %d energiává
items.spells.alchemize$wndalchemizeitem.sell=Válts %dg-vé
items.spells.alchemize$wndalchemizeitem.sell_1=1-et %dg-vé alakítsd
items.spells.alchemize$wndalchemizeitem.sell_all=Mindent %dg-vé alakíts
items.spells.alchemize.desc=Ez a varázslat átalakító erőkkel rendelkezik, amelyek hasonlóak az alkímiai edényekben találhatóakhoz. Minden egyes varázslat lehetővé teszi a felhasználó számára, hogy egy tárgyat (vagy tárgyköteget) arannyá vagy alkímiai energiává alakítson. A főzetek vagy tekercsek energiává alakítása még azonosítani is tudja őket! Néhány alkímiai felhasználási módot árulnak a boltokban, de sokkal több elkészíthető alkímiai úton egy mag, rúnakő és egy kevés alkímiai energia kombinálásával.
items.spells.alchemize.name=alkimizál
items.spells.alchemize.prompt=Alkimisálj egy tárgyat
items.spells.beaconofreturning.creatures=A szomszédos lények pszichikus aurája jelenleg nem teszi lehetővé a teleportálást.
items.spells.beaconofreturning.desc=Ez a bonyolult varázslat lehetővé teszi a felhasználó számára, hogy visszatérjen egy megadott helyre, a távolságtól függetlenül. A varázslat csak visszatéréskor szűnik meg, annyiszor állíthatod be, ahányszor csak szeretnéd, de csak a legutóbbi beállított helyszínre fog emlékezni.
items.spells.beaconofreturning.desc_set=Ez a jelzőfény valahol a %d emeleten volt elhelyezve.
items.spells.beaconofreturning.name=a visszatérés jelzőfénye
items.spells.beaconofreturning.preventing=A hely erős mágikus aurája megakadályoz abban, hogy használd a varázslatot!
items.spells.beaconofreturning.set=A jelzőfényt az aktuális tartózkodási helyedre állítottuk be.
items.spells.beaconofreturning.wnd_body=A beállítás felülírja a korábban beállított helyet, amelyre a jelzőfény volt beállítva. A visszatéréskor a legutóbb beállított helyre térsz vissza, és a varázslat egyszeri használatára lesz szükséged.
items.spells.beaconofreturning.wnd_return=VISSZATÉRÉS
items.spells.beaconofreturning.wnd_set=KÉSZLET
items.spells.curseinfusion.desc=Ez a varázslat egy felszerelési tárgyat ugyanolyan erős rosszindulatú mágiával itat át, mint ami a DM-300-ban van. A tárgy, amelyen használják, azonnal megátkozódik, és minden varázslat vagy jel felülíródik. ZXQPH0 ZXQ ZXQPH1 ZXQ Fegyverek, páncélok és pálcák esetében a tárgy az átkozás mellett fejlesztéseket is kap. Az átokinfúzió fejlesztései nem halmozódnak, és a fejlesztések elvesznek, ha a tárgy meg nem átokolja. ZXQPH2 ZXQ ZXQPH3 ZXQ Több átokinfúzió is használható egy fegyver vagy páncél átkának megváltoztatására.
items.spells.curseinfusion.inv_title=Átkozz meg egy tárgyat
items.spells.curseinfusion.name=átok infúzió
items.spells.magicalinfusion.desc=Ez a varázslat ugyanolyan mágikus erővel rendelkezik, mint egy fejlesztési tekercs, de stabilabb formában. \n\n A tárgyak normál fejlesztése mellett soha nem törli ki a varázslatot, a jelet vagy az átkot.
items.spells.magicalinfusion.infuse=A tárgyad arkán energiával van átitatva!
items.spells.magicalinfusion.inv_title=Tárgy betöltése
items.spells.magicalinfusion.name=varázslatos infúzió
items.spells.magicalporter.desc=Ez a varázslat varázslatosan elszállítja a tárgyat, amire rávetik. A kereskedők jelzőfényével ellentétben azonban a tárgyak a következő főellenség emeletének bejáratához kerülnek.
items.spells.magicalporter.inv_title=Elem átvitele
items.spells.magicalporter.name=varázslatos portőr
items.spells.magicalporter.nowhere=Nincs hová átmásolnod egy tárgyat.
items.spells.phaseshift.desc=Ez a kaotikus varázslat bármelyik karaktert, akire céloz, egy véletlenszerű helyre teleportálja az aktuális szinten, és jelentős időre elkábítja őket. Az erős ellenfelek képesek lesznek ellenállni a kábító hatásnak. A varázslat irányítható egy célpontra vagy magára a felhasználóra.
items.spells.phaseshift.name=fáziseltolódás
items.spells.phaseshift.no_target=Nincs ott semmi teleportálnivaló.
items.spells.reclaimtrap.desc=Ez a varázslat DM-300 mechanikai energiájának maradványait tartalmazza. Amikor egy aktív csapdára veted be, a csapda ereje hozzád kapcsolódik, lehetővé téve, hogy újra használd a varázslatot az erő kiűzésére és a csapda hatásának bárhol történő kiváltására.\n\nAzonban egyes csapdák nem minden helyen működnek, és egyszerre csak egy csapda tárolható.
items.spells.reclaimtrap.desc_trap=A varázslat jelenleg készen áll egy _%s._ aktiválására.
items.spells.reclaimtrap.name=visszaszerezni a csapdát
items.spells.reclaimtrap.no_trap=Nincs ott csapda.
items.spells.recycle.desc=Ez a varázslat az átalakító mágia egy gyengébb formáját tartalmazza. Bár felszerelésre nem hat, a varázslat egy tekercset, főzetet, magot, rúnakövet vagy hegyű dárdát véletlenszerűen kiválasztott, azonos típusú tárggyá alakít.
items.spells.recycle.inv_title=Hasznosíts újra egy tárgyat
items.spells.recycle.name=újrahasznosít
items.spells.recycle.recycled=A terméket a következő újrahasznosítási módba hasznosították: %s.
items.spells.spell.ac_cast=ÖNTVÉNY
items.spells.spell.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.spells.spell.no_magic=Mágiaimmunitás alatt nem varázsolhatsz.
items.spells.summonelemental.ac_imbue=TELÍT
items.spells.summonelemental.desc=Ez a varázslat az elkészítéséhez használt elementál parazsak energiáját használja, és lehetővé teszi, hogy egy barátságos elementált idézz meg, aki veled harcol! Egyszerre csak egy elementált lehet megidézni, de a varázslat újrahasznosítható, hogy ingyenesen visszaadja neked az elementált.
items.spells.summonelemental.desc_chaos=A varázslat jelenleg kaotikus energiát sugároz, megidéz egy _káosz elementált_. Felruházhatsz egy másik tárgyat, de a varázslat elveszíti a jelenlegi felruházását.
items.spells.summonelemental.desc_fire=A varázslat jelenleg forró tapintásra, egy _tűzelementált_ fog megidézni. Feltölthetsz egy másik tárgyat, de a varázslat elveszíti a jelenlegi feltöltetét.
items.spells.summonelemental.desc_frost=A varázslat jelenleg hideg tapintású, egy _fagyelementált_ fog megidézni. Felölthetsz rá egy másik tárgyat, de a varázslat elveszíti a jelenlegi felöltését.
items.spells.summonelemental.desc_newborn=A varázslat jelenleg nincs beoltva, és egy _újszülött elementált_ idéz meg távolsági támadás nélkül. Beolthatsz egy azonosított folyékony láng, fagy, újratöltő tekercs vagy transzmutációs tekercs keverékét, hogy megerősítsd a varázslatot, így a jövőbeni megidézések teljes erejű elementált fognak idézni!
items.spells.summonelemental.desc_shock=A varázslat jelenleg statikus energiát sugároz, megidéz egy _sokk elementált_. Feltölthetsz egy másik tárgyat, de a varázslat elveszíti a jelenlegi feltöltetét.
items.spells.summonelemental.imbue_prompt=Átitat egy tárgyat
items.spells.summonelemental.name=elementális megidézése
items.spells.targetedspell.inv_title=Tárgy betöltése
items.spells.targetedspell.prompt=Válasszon egy célt
items.spells.telekineticgrab.cant_grab=Azt nem tudod elkapni.
items.spells.telekineticgrab.desc=Ez a varázslat lehetővé teszi a varázsló számára, hogy távolról megragadja az összes tárgyat egy adott helyszínen, vagy az összes eldobott fegyvert, ami egy ellenséghez ragadt! Nem használható más tulajdonában lévő tárgyak, vagy ládákhoz hasonló tárolók megragadására.
items.spells.telekineticgrab.name=telekinetikus megragadás
items.spells.telekineticgrab.no_target=Nincs ott mit megfogni.
items.spells.unstablespell.desc=Ennek a kis fekete négyzet alakú kristálynak minden felületén mozgó rúna szimbólumok vannak.\n\nAktiválva egy véletlenszerű görgetés hatását váltja ki. A görgetés hatása mindig harcra fókuszált lesz, ha ellenségek vannak a látóteredben, egyébként pedig mindig nem harcra fókuszált.
items.spells.unstablespell.name=instabil varázslat
items.spells.wildenergy.desc=Ez a varázslat tartalmaz egy részét annak az átkozott energiának, amely a DM-300-at működtette. Elsütéskor feltölti a pálcáidat és a kopott tárgyakat, miközben egy véletlenszerű átkozott pálca hatást is kivált. Azonban kiválaszthatod az irányt, amerre az átkozott mágia lőni kezd.
items.spells.wildenergy.name=vad energia
items.stones.inventorystone.ac_use=HASZNÁLAT
items.stones.runestone$placeholder.name=rúnakő
items.stones.runestone.discover_hint=Ezt a tárgyat véletlenszerűen megtalálhatod a kazamatában, vagy alkímiával is elkészítheted.
items.stones.stoneofaggression$aggression.desc=A manipulatív mágia miatt az összes közeli ellenség inkább ezt a karaktert támadja.\n\nHátralévő körök: %s.
items.stones.stoneofaggression$aggression.name=célzott
items.stones.stoneofaggression.desc=Amikor ezt a követ egy szövetségesre vagy ellenségre dobják, az összes közeli ellenség rövid időre azt a karaktert fogja támadni. A főellenfelek azonban ellenállhatnak a hatásnak, jelentősen csökkentve az időtartamot és kevesebb sebzést szenvedve el a minionjaik támadásaitól.
items.stones.stoneofaggression.name=az agresszió köve
items.stones.stoneofaugmentation$wndaugment.cancel=Mindegy
items.stones.stoneofaugmentation$wndaugment.choice=Mit szeretnél fokozni?
items.stones.stoneofaugmentation$wndaugment.damage=Kár
items.stones.stoneofaugmentation$wndaugment.defense=Védelem
items.stones.stoneofaugmentation$wndaugment.evasion=Kijátszás
items.stones.stoneofaugmentation$wndaugment.none=Augmentáció eltávolítása
items.stones.stoneofaugmentation$wndaugment.speed=Sebesség
items.stones.stoneofaugmentation.desc=Ez a rúnakő erős mágiával rendelkezik, amely felszerelések kiegészítésével egy tulajdonságot egy másik rovására fokozhat.\n\nFegyveren használva növelheted a sebességedet vagy a sebzésedet. A dobófegyverek tartóssága is a sebességükkel arányosan nő vagy csökken.\n\nPáncélon használva fokozhatod a védelmet vagy a kitérést.
items.stones.stoneofaugmentation.discover_hint=Ezt a tárgyat megvásárolhatod egy boltban, vagy alkímiai úton elkészítheted.
items.stones.stoneofaugmentation.inv_title=Egy elem bővítése
items.stones.stoneofaugmentation.name=növesztő kő
items.stones.stoneofblast.desc=Ez a rúnakő azonnal felrobban azon a helyen, ahová dobják. Akárcsak egy bomba, a robbanás mindenben sebzést okoz, ami a közelben van.
items.stones.stoneofblast.name=robbantáskő
items.stones.stoneofblink.desc=Ez a rúnakő teleportálja a felhasználót oda, ahová eldobják.
items.stones.stoneofblink.name=pislogás köve
items.stones.stoneofclairvoyance.desc=Ez a kő azonnal felfedi az összes mezőt egy nagyon széles területen a dobás körül. A hatása még a falakon keresztül is elér.
items.stones.stoneofclairvoyance.name=tisztánlátás köve
items.stones.stoneofdeepsleep.desc=Amikor ezt a követ egy ellenségre dobják, mély mágikus álomba merül. A mágikusan alvó ellenségek örökre alszanak, amíg meg nem zavarják őket.
items.stones.stoneofdeepsleep.name=mély álom köve
items.stones.stoneofdetectmagic.desc=Ez a rúnakő képes érzékelni a tárgyakra ható mágiát. Ha azonosítatlan tárgyakon használod, megtudhatod, hogy érinti-e őket rosszindulatú átok, és hogy érinti-e őket pozitív mágia, például varázslat vagy fejlesztések.
items.stones.stoneofdetectmagic.detected_bad=Rosszindulatú mágiát észlelsz, ami hatással van erre a tárgyra!
items.stones.stoneofdetectmagic.detected_both=Mind pozitív, mind rosszindulatú mágiát észlelsz, amely hatással van erre a tárgyra!
items.stones.stoneofdetectmagic.detected_good=Pozitív mágiát észlelsz, amely hatással van erre a tárgyra!
items.stones.stoneofdetectmagic.detected_none=Nem észlelsz semmilyen mágiát, ami befolyásolná ezt a tárgyat.
items.stones.stoneofdetectmagic.inv_title=Elem észlelése
items.stones.stoneofdetectmagic.name=a detektív mágia köve
items.stones.stoneofdisarming.desc=Ez a rúnakő olyan varázslatot rejt, amely képes hatástalanítani a kazamatában elrejtett rosszindulatú csapdákat. Akár 9 csapdát is hatástalaníthat a területen, ahová dobják.
items.stones.stoneofdisarming.name=lefegyverző kő
items.stones.stoneofenchantment.armor=A páncélod világít a sötétben!
items.stones.stoneofenchantment.desc=Ez a rúnakő varázslatos mágiával rendelkezik. A fejlesztési tekercsekkel ellentétben nem növeli egy tárgy közvetlen erejét, hanem varázslattal ruházza fel a fegyvert vagy páncélt, új erőt adva neki.
items.stones.stoneofenchantment.inv_title=Elvarázsol egy tárgyat
items.stones.stoneofenchantment.name=varázslat köve
items.stones.stoneofenchantment.weapon=A fegyvered világít a sötétben!
items.stones.stoneoffear.desc=Amikor ezt a követ egy karakterre dobják, rémület fogja el, megfordul és elmenekül. Menekülő karakter megtámadása lerövidíti a hatást.
items.stones.stoneoffear.name=a félelem köve
items.stones.stoneofflock.desc=Ez a rúnakő rövid időre varázslatos birkákat idéz meg a dobás helyszínének környékén.
items.stones.stoneofflock.name=nyájkő
items.stones.stoneofintuition$wndguess.break=Az intuíciód köve porrá omlik...
items.stones.stoneofintuition$wndguess.correct=Helyes. A tárgy típusa azonosítva!
items.stones.stoneofintuition$wndguess.incorrect=A tipped helytelen volt.
items.stones.stoneofintuition$wndguess.text=Találd ki az azonosítatlan tárgy típusát. Ha helyesen tippelsz, a típus azonosítva lesz!
items.stones.stoneofintuition.break_info=Az intuíció köveit kétszer is felhasználhatod, mielőtt az egyik eltörik, _a következő használatod nem emészt fel követ_.
items.stones.stoneofintuition.break_warn=Korábban már használtál egy intuíciós követ, így _a következő használatodkor fel fogsz emészteni egy követ_.
items.stones.stoneofintuition.desc=Ez a rúnakő a tekercsekben található mágia gyengébb változatát hordozza. Ahelyett, hogy közvetlenül azonosítana egy tárgyat, az intuíciódra hat, lehetővé téve, hogy találgatással próbáld meg beazonosítani egy varázsital, tekercs vagy gyűrű típusát.
items.stones.stoneofintuition.inv_title=Válasszon ki egy elemet
items.stones.stoneofintuition.name=az intuíció köve
items.stones.stoneofshock.desc=Ez a rúnakő egy elektromos energiakitörést bocsát ki, amely rövid időre elkábítja az összes közeli célpontot, és minden eltalált célpontért töltetet ad a dobópálcának.
items.stones.stoneofshock.name=sokkoló kő
items.stylus.ac_inscribe=RÁÍR
items.stylus.cursed=Az stylus varázslata nem működik az elátkozott páncélokon.
items.stylus.desc=Ez az arkán stylus sötét, nagyon kemény kőből készült. Segítségével mágikus jelet véshetsz a páncélodra, de nincs hatalmad afelett, hogy melyik legyen az, a stylus fogja eldönteni helyetted.
items.stylus.identify=Először meg kell állapítanod, hogy az a páncél elátkozott-e.
items.stylus.inscribed=A páncélodat az íróvesszővel véste.
items.stylus.name=arkán stylus
items.stylus.prompt=Válasszon egy páncélt
items.tengusmask.ac_wear=VISELET
items.tengusmask.desc=Ez a maszk leesett Tengu arcáról, miközben meghalt, és érezni lehetett belőle áradó hatalmas mágikus erőt. Vajon a maszk volt Tengu erejének forrása? Viseléskor a maszk hatalmas ereje átkerül beléd, lehetővé téve, hogy _alosztályt válassz a hősödnek._\n\n Melyik alosztályt választod?
items.tengusmask.discover_hint=Ezt a tárgyat bizonyos ellenfelektől leejtve szerezheted meg.
items.tengusmask.name=Tengu maszkja
items.tengusmask.used=A maszk szétesik, ahogy az ereje beléd áramlik!
items.torch.ac_light=FÉNY
items.torch.desc=A kalandok egyik alapköve, amikor egy kazamata elsötétül, egy fáklya segíthet az útmutatásban.
items.torch.name=fáklya
items.trinkets.chaoticcenser.desc=Egy idő után az alkímiás edényben ez a füstölőüst magától füstölni kezd! Ezek a gázok felhalmozódnak, és félig véletlenszerű időközönként az ellenség felé fújnak a füstölőből. Úgy tűnik, mindenféle gázt képes előállítani, de a füstölő aktiválása előtt egy pillanatnyi figyelmeztetést kapsz.
items.trinkets.chaoticcenser.name=kaotikus füstölő
items.trinkets.chaoticcenser.spew=A füstölődből mindjárt kitör a szó: %s.
items.trinkets.chaoticcenser.stats_desc=Jelenlegi szintjén ez a csecsebecse nagyjából minden _%d_ körben egy káros gázt idéz elő az ellenség közelében. A gázok csak akkor jelennek meg, ha ellenségek vannak jelen. Magasabb szinteken ezek a gázok valószínűbb, hogy egzotikusak és erősebbek.
items.trinkets.chaoticcenser.typical_stats_desc=Ez a csecsebecse jellemzően minden _%d_ körben egy káros gázt hoz létre az ellenség közelében. A gázok csak akkor jelennek meg, ha ellenségek vannak jelen. Magasabb szinteken ezek a gázok valószínűbb, hogy egzotikusak és erősebbek.
items.trinkets.crackedspyglass.desc=Ez a kézi távcső a nagyszerű és precíz kivitelezés demonstrációja lenne, ha nem lenne repedés az elülső lencséjén. A távcső látszólag segít neked azzal, hogy új tárgyakat fed fel a kazamatában, de a hibája miatt a feltárt tárgyakat elég nehéz látni!
items.trinkets.crackedspyglass.name=repedt távcső
items.trinkets.crackedspyglass.stats_desc=Jelenlegi szintjén ennek a csecsebecsének _%1$s%% esélye_ van egy extra rejtett tárgy létrehozására minden nem-főnök szinten.
items.trinkets.crackedspyglass.stats_desc_upgraded=Jelenlegi szintjén ennek a csecsebecsének _100%% esélye_ van egy extra rejtett tárgy létrehozására minden nem-főnök szinten, és _%1$s%% esélye_ egy második extra rejtett tárgy létrehozására.
items.trinkets.crackedspyglass.typical_stats_desc=Ennek a csecsebecsének jellemzően _%1$s%% esélye_ van egy extra rejtett tárgy létrehozására minden nem-főnök szinten.
items.trinkets.dimensionalsundial.desc=Ez a kis kézi napóra valahogy képes árnyékot vetni a kazamata mélyére, még akkor is, ha nem tartod függőlegesen. Még furcsább, hogy az árnyék helyzetének látszólag semmi köze sincs a Naphoz ebben a világban. Amikor nincs árnyék, a napóra veszélyt vonz magához.
items.trinkets.dimensionalsundial.name=dimenzionális napóra
items.trinkets.dimensionalsundial.stats_desc=Jelenlegi szintjén ez a csecsebecse _%1$d%%_-kal csökkenti az ellenségek megjelenési arányát nappal a való életben (8:00-20:00), és _%2$d%%_-kal növeli éjszaka (20:00-8:00).
items.trinkets.dimensionalsundial.typical_stats_desc=Ez a csecsebecse jellemzően _%1$d%%_-kal csökkenti az ellenségek megjelenési arányát nappal a való életben (reggel 8-20 óra között), és _%2$d%%_-kal növeli éjszaka (este 8-8 óra között).
items.trinkets.dimensionalsundial.warning=A napórád nem vet árnyékot, nyugtalanul érzed magad.
items.trinkets.exoticcrystals.desc=Ezek a kis rózsaszín kristályok ugyanolyan alakúak, mint az alkímiai energia kristályai. Bár közvetlenül nem használhatók energia előállítására, úgy tűnik, valahogy befolyásolják a talált varázsitalokat és tekercseket.
items.trinkets.exoticcrystals.name=egzotikus kristályok
items.trinkets.exoticcrystals.stats_desc=Jelenlegi szintjén ez a csecsebecse a _%s%%_ varázsital- vagy tekercscseppeket egzotikus megfelelőire cseréli. Ez nem befolyásolja az erő varázsitalait, a fejlesztés tekercseit, illetve a veszélyes szobák megoldásához generált tárgyakat.
items.trinkets.exoticcrystals.typical_stats_desc=Ez a csecsebecse jellemzően a _%s%%_ varázsital- vagy tekercscseppeket egzotikus megfelelőikkel helyettesíti. Ez nem vonatkozik az erő varázsitalokra, a fejlesztés tekercseire vagy a veszélyes szobák megoldásához generált tárgyakra.
items.trinkets.eyeofnewt.desc=Ez az arany-fekete gőteszem egy gyakori összetevő, amelyet most egy apró csecsebecsévé fejlesztettek át. A szem mintha csökkentené a látásodat, cserébe azért, hogy másképp lásd a dolgokat.
items.trinkets.eyeofnewt.name=gőte szeme
items.trinkets.eyeofnewt.stats_desc=Jelenlegi szintjén ez a csecsebecse _%1$s%%_-val csökkenti a látótávolságodat, de mentális látást is biztosít az ellenfelekre a _%2$d_ mezőkön belül.
items.trinkets.eyeofnewt.typical_stats_desc=Ez a csecsebecse jellemzően _%1$s%%_-val csökkenti a látótávolságodat, de emellett mentális látást is biztosít az ellenfelekre a _%2$d_ mezőkön belül.
items.trinkets.ferrettuft.desc=Egy selymes fehér görényszőr-csomó, melyet egy masnivá kötött limezöld szalag tart össze. A görények fürgeségükről, huncutságukról és becsületességük hiányáról ismertek. Ebből az erőből árad egy része a csecsebecséből, fokozva a közelben lévő dolgok kitérését.
items.trinkets.ferrettuft.name=görénycsomó
items.trinkets.ferrettuft.stats_desc=Jelenlegi szintjén ez a csecsebecse _%1$s%%_ értékkel növeli az összes karakter kitérését.
items.trinkets.ferrettuft.typical_stats_desc=Ez a csecsebecse jellemzően növeli a _%1$s%%_ általi összes karakter elkerülését.
items.trinkets.mimictooth.desc=Ezt a nagy, éles fogat egy nagyon boldogtalan utánzó húzhatta ki. Úgy tűnik, befolyásolja a kazamata utánzóit, gyakoribbá és veszélyesebbé teszi őket.
items.trinkets.mimictooth.name=utánzó fog
items.trinkets.mimictooth.stats_desc=Jelenlegi szintjén ez a csecsebecse mindenféle mimikust _%1$sx_ gyakoribbá és sokkal nehezebben észlelhetővé tesz, de a zsákmány mennyiségét is növeli. Minden kazamata szintjén _%2$s%%_ lesz egy esély arra, hogy egy extra lopakodó ébenfa mimikust tartalmazzon.
items.trinkets.mimictooth.typical_stats_desc=Ez a csecsebecse jellemzően mindenféle mimikust _%1$sx_ gyakoribbá és sokkal nehezebben észlelhetővé tesz, de a zsákmány mennyiségét is növeli. Minden kazamata szintjén _%2$s%%_ lesz egy esély arra, hogy egy extra lopakodó ébenfa mimikust rejtsen.
items.trinkets.mossyclump.desc=Ez a nedves mohacsomó úgy tűnik, megtartja a nedvességet, bármennyire is erősen szorítod. Mintha varázslatosan a kazamatához lenne kötve, így nagyobb valószínűséggel jelenik meg benne fű és víz.
items.trinkets.mossyclump.name=mohás csomó
items.trinkets.mossyclump.stats_desc=Jelenlegi szintjén ez a csecsebecse a _%d%%_ nem tematikus padlót vízzel vagy fűvel fogja megtölteni.\n\nEnnek a csecsebecsének a fejlesztése több energiába kerül.
items.trinkets.mossyclump.typical_stats_desc=Ez a csecsebecse jellemzően a _%d%%_ nem tematikus padlókat tölti meg vízzel vagy fűvel.\n\nEnnek a csecsebecsének a fejlesztése több energiába kerül.
items.trinkets.parchmentscrap.desc=Ez a kis pergamendarab úgy néz ki, mintha egy tekercsből származna. Megőrizte varázserejének egy részét, és úgy tűnik, befolyásolja a kazamatában található fegyvereket és páncélokat.
items.trinkets.parchmentscrap.name=pergamenhulladék
items.trinkets.parchmentscrap.stats_desc=Jelenlegi szintjén ez a csecsebecse a varázslatokat és a szimbólumokat _%dx_ gyakorivá teszi, a fegyverekre és páncélokra vonatkozó átkokat pedig _%sx_ gyakorivá. A pálcákra, gyűrűkre vagy tárgyakra vonatkozó átkokat ez nem érinti. ZXQPH2 ZXQ ZXQPH3 ZXQ Ennek a csecsebecsének a fejlesztése nagyobb energiába kerül.
items.trinkets.parchmentscrap.typical_stats_desc=Ez a csecsebecse jellemzően a _%dx_ varázslatokat és jeleket, a _%sx_ pedig a fegyverekre és páncélokra vonatkozó átkokat teszi gyakorivá. A pálcákra, gyűrűkre vagy tárgyakra vonatkozó átkokat ez nem érinti.\n\nEnnek a csecsebecsének a fejlesztése nagyobb energiába kerül.
items.trinkets.petrifiedseed.desc=Ez a mag megkövesedett, vagy lassú geológiai folyamatok, vagy mágia útján. Úgy tűnik, a mag mágikus módon befolyásolja a kazamata növényvilágát, időnként rúnakövekkel helyettesítve a növényi magokat.
items.trinkets.petrifiedseed.name=megkövesedett mag
items.trinkets.petrifiedseed.stats_desc=Jelenlegi szintjén ez a csecsebecse miatt a letaposott fű rúnaköveket fog hullatni magok helyett _%1$s%%_, és a magas fű is gyakrabban fog tárgyakat hullatni _%2$s%%_.
items.trinkets.petrifiedseed.typical_stats_desc=Ez a csecsebecse jellemzően azt okozza, hogy a letaposott fű rúnaköveket hullat magok helyett _%1$s%%_, és a magas fű is gyakrabban hullat tárgyakat _%2$s%%_.
items.trinkets.ratskull.desc=Ez a hátborzongató csecsebecse nem sokkal nagyobb egy átlagos patkány koponyájánál, ami valahogy ritkaságszámba megy ebben a kazamatában. A koponya mágikus hatása vonzza a kazamata ritkább lakóit, így sokkal gyakrabban jelennek meg.
items.trinkets.ratskull.name=patkánykoponya
items.trinkets.ratskull.stats_desc=Jelenlegi szintjén ez a csecsebecse csökkenti a ritka, egzotikus ellenségek _%dx_ megjelenésének valószínűségét. A koponya azonban csak feleannyira hatékony a kristálymimikák és a páncélos szobrok vonzásában.
items.trinkets.ratskull.typical_stats_desc=Ez a csecsebecse jellemzően csökkenti a ritka, egzotikus ellenségek _%dx_ megjelenésének valószínűségét. A koponya azonban csak feleannyira hatékony a kristálymimikák és a páncélos szobrok vonzásában.
items.trinkets.saltcube.desc=Ezt a nagy sókristályt szinte tökéletes kocka alakúra vágták, és valahogy sikerült a víz felét leeresztenie az alkímiai edényből ahelyett, hogy feloldódott volna. Úgy tűnik, varázslatosan kiszárítja és tartósítja az elfogyasztott ételt, meghosszabbítva a jóllakottság érzését, de csökkentve az egészség helyreállítását, amikor nem vagy éhezve.
items.trinkets.saltcube.name=sókocka
items.trinkets.saltcube.stats_desc=Jelenlegi szintjén ez a csecsebecse _%1$s%%_-kal növeli az éhségérzet kialakulásának idejét, de _%2$s%%_-kal csökkenti az életerő-regenerálódási sebességedet, kivéve, ha a padló zárva van.
items.trinkets.saltcube.typical_stats_desc=Ez a csecsebecse jellemzően _%1$s%%_-val növeli az éhségérzet kialakulásának idejét, de _%2$s%%_-val csökkenti az életerő-regenerálódási sebességedet, kivéve, ha a padló zárva van.
items.trinkets.shardofoblivion$thrownusetracker.desc=Nemrég egy azonosítatlan dobófegyvert használtál, ami egy ideig a Feledés Szilánkjának egy használt, azonosítatlan felszerelésének számít.\n\nHátralévő körök: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Azonosítatlan dobott fegyver használata
items.trinkets.shardofoblivion$wandusetracker.desc=Nemrég használtál egy azonosítatlan pálcát, ami egy darabig a Feledés Szilánkjához tartozó használt azonosítatlan felszerelésnek számít.\n\nHátralévő körök: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Azonosítatlan pálca használata
items.trinkets.shardofoblivion.ac_identify=AZONOSÍTÁS
items.trinkets.shardofoblivion.desc=Miután az alkímiás fazékban párolták, ez az átkozott fémszilánk átalakult, és a semmiből áll...? Fény görbül körülötte, és egy helyben lebeg, amikor nem tartod a kezedben. A szilánk mintha mágikus úton merítene erőt a tudatlanságodból, ezért valószínűleg jobb, ha nem gondolsz rá túl sokat.
items.trinkets.shardofoblivion.identify=Azonosítsd a tárgyat!
items.trinkets.shardofoblivion.identify_not_yet=Ez a tétel még nem azonosítható.
items.trinkets.shardofoblivion.identify_prompt=Egy elem azonosítása
items.trinkets.shardofoblivion.identify_ready=Egy tárgy azonosításra kész: %s. Használd rajta a Feledés Szilánkját az azonosításhoz.
items.trinkets.shardofoblivion.identify_ready_worn=A kopott tárgyaid most már mind azonosításra készek. Használd a Feledés Szilánkját a tárgyakon az azonosításukhoz.
items.trinkets.shardofoblivion.name=a feledés szilánkja
items.trinkets.shardofoblivion.stats_desc=Jelenlegi szintjén ez a csecsebecse minden egyes felszerelt vagy nemrég használt azonosítatlan felszerelés után 20%%-val növeli az ellenséges zsákmányszerzések arányát, maximum _%d tárgyig_. A szilánk megakadályozza a felszerelések azonosítását is, de manuálisan azonosíthatóak a rá váró tárgyak.
items.trinkets.shardofoblivion.typical_stats_desc=Ez a csecsebecse jellemzően 20%%-val növeli az ellenséges zsákmányszerzések arányát minden egyes felszerelt vagy nemrég használt azonosítatlan felszerelés után, maximum _%d tárgyig_. A szilánk megakadályozza a felszerelések azonosítását is, de felhasználható a zsákmányra készen álló tárgyak manuális azonosítására.
items.trinkets.thirteenleafclover.desc=Valahogy az alkímiai fazékban való fortyogástól ez a lóhere extra leveleket növesztett! Nem igazán világos, hogy ez a csecsebecse szerencsét vagy balszerencsét hoz-e, talán ez a csecsebecse kaotikusabbá teszi a szerencsédet?
items.trinkets.thirteenleafclover.name=tizenhárom levelű lóhere
items.trinkets.thirteenleafclover.stats_desc=Jelenlegi szintjén ez a csecsebecse az idő _%1$d%%_ maximális, és a _%2$d%%_ minimális sebzését okozza.
items.trinkets.thirteenleafclover.typical_stats_desc=Ez a csecsebecse jellemzően azt eredményezi, hogy az idő _%1$d%%_ maximális, és _%2$d%%_ minimális sebzést okoz.
items.trinkets.trapmechanism.desc=A kazamata egyik veremcsapdájának központi mechanizmusa, gondosan kifaragva a padlóból, hogy hordozható legyen. Úgy tűnik, mágikusan kapcsolódik magához a kazamatához, ami gyakoribbá teszi a veszélyes terepet, de növeli az iránta való vonzalmadat is.
items.trinkets.trapmechanism.name=csapda mechanizmus
items.trinkets.trapmechanism.stats_desc=Jelenlegi szintjén ez a csecsebecse a nem tematizált emeletek _%1$d%%_ részét csapdákkal vagy szakadékokkal fogja megtölteni. Ezenkívül a kazamata rejtett csapdáinak _%2$d%%_ része is láthatóvá válik.
items.trinkets.trapmechanism.typical_stats_desc=Ez a csecsebecse jellemzően azt eredményezi, hogy a nem tematizált emeletek _%1$d%%_ részeit csapdákkal vagy szakadékokkal tölti meg. Ezenkívül a kazamata rejtett csapdáinak _%2$d%%_ részei is láthatóvá válnak.
items.trinkets.trinket$placeholder.name=bizsu
items.trinkets.trinket.discover_hint=Ez a tárgy opcióként jöhet szóba, amikor alkímiával készítesz egy csecsebecsét.
items.trinkets.trinketcatalyst$randomtrinket.desc=Egy közeli tárgy egy tasakba szorult, amit nem tudsz kinyitni.\n\nAz alkímiai folyamat feloldja az tasakot, de amíg meg nem teszed, nem tudhatod, milyen csecsebecsét kapsz!
items.trinkets.trinketcatalyst$randomtrinket.name=véletlenszerű csecsebecse
items.trinkets.trinketcatalyst.desc=Ez a varázslatos arany porgömb csillog a kazamata sötétjében. Ez a katalizátor egy alkímiai edényben használható egy kis alkímiai energiával, hogy egyedi csecsebecséket készítsen. A csecsebecsék különféle hatásokat biztosítanak, amelyek kissé megváltoztatják a kazamatát vagy annak lakóit. A csecsebecsék fejleszthetők több energiával, hogy hatásuk erősebb legyen, vagy ledobhatók, hogy teljesen megszüntessék a hatást.
items.trinkets.trinketcatalyst.name=varázslatos katalizátor
items.trinkets.trinketcatalyst.window_text=A víz izzani kezd, ahogy hozzáadod a katalizátort. Van néhány közeli tárgy, amit energiával feltölthetsz, hogy varázslatos csecsebecsét készíts belőlük.
items.trinkets.trinketcatalyst.window_title=készíts egy csecsebecsét
items.trinkets.vialofblood.desc=Ez a vékony fiola a kazamata valamelyik lakójának vérét tartalmazza, ami lassan mozog, ahogy forgatod a fiolát. Úgy tűnik, mágikusan fokozza az erősebb gyógyító hatásokat, de késlelteti is azokat.
items.trinkets.vialofblood.name=véres fiola
items.trinkets.vialofblood.stats_desc=Jelenlegi szintjén ez a csecsebecse _%1$s%%_ értékkel növeli a gyógyító italok, víztömlők vagy egészségforrások ivásából nyert életerődet. Ezek a gyógyító hatások azonban lassabban is jelentkeznek, körönként maximum _%2$s_ életerőt regenerálva (ez a hős szintjével arányos).
items.trinkets.vialofblood.typical_stats_desc=Ez a csecsebecse jellemzően _%1$s%%_ értékkel növeli a gyógyító italok, víztömlők vagy egészségforrások ivásából nyert életerődet. Ezek a gyógyító hatások azonban lassabban is jelentkeznek, körönként maximum _%2$s_ életerőt regenerálva (ez a hős szintjével arányos).
items.trinkets.wondrousresin.desc=Ez a csillogó kék gyanta úgy tűnik, egy elátkozott pálca mágiájának desztillált esszenciáját tartalmazza. Az alkímiai edényből származó mágia mintha némileg stabilizálta volna, és most a pálcáidra hat.
items.trinkets.wondrousresin.name=csodálatos gyanta
items.trinkets.wondrousresin.stats_desc=Jelenlegi szintjén ez a csecsebecse az átkozott pálcák hatásait _%1$s%%_ időbeli semleges vagy pozitívvá teszi, és az átkozatlan pálcák egy további semleges vagy pozitív átkozott zúgást okoznak _%2$s%%_ időbeli semleges vagy pozitív elátkozott zúgást.\n\nEnnek a csecsebecsének a fejlesztése nagyobb energiába kerül.
items.trinkets.wondrousresin.typical_stats_desc=Ez a csecsebecse jellemzően arra kényszeríti az átkozott pálcák hatásait, hogy azok időnként semlegesek vagy pozitívak legyenek _%1$s%%_, és arra készteti az átkozatlan pálcákat, hogy egy további semleges vagy pozitív átkozott zúgást _%2$s%%_ tüzeljenek.\n\nEnnek a csecsebecsének a fejlesztése nagyobb energiába kerül.
items.wands.cursedwand.disguise=A külsőd a szemed láttára változik!
items.wands.cursedwand.fire=Égett szagot érzel...
items.wands.cursedwand.grass=Fű tör fel körülötted!
items.wands.cursedwand.gravity=A gravitáció hirtelen véletlenszerű irányokba kezd húzni!
items.wands.cursedwand.gravity_end=A gravitációs káosz véget ér.
items.wands.cursedwand.gravity_positive=A gravitáció hirtelen véletlenszerű irányokba kezd húzni, de úgy tűnik, ez nem érint téged.
items.wands.cursedwand.mass_invuln=Ragyogó fény tör elő a pálcádból!
items.wands.cursedwand.nothing=Semmi sem történik.
items.wands.cursedwand.ondeath=A saját %s-d ölt meg.
items.wands.cursedwand.petrify=Hirtelen lefagysz egy helyben!
items.wands.cursedwand.sinkhole=Kezd engedni a föld körülötted!
items.wands.cursedwand.sinkhole_positive=A talaj kezd engedni, de elég szilárdnak érzed magad alatt.
items.wands.cursedwand.supernova=Egy lángoló energiagömb kezd növekedni. Lehet, hogy futnod kellene!
items.wands.cursedwand.supernova_positive=Egy lángoló energiagömb kezd növekedni, de valahogy biztonságosnak érződik.
items.wands.cursedwand.transmogrify_other=A tárgyad átalakul valami mássá!
items.wands.cursedwand.transmogrify_wand=A pálcád átalakul egy másik tárggyá!
items.wands.damagewand.upgrade_stat_name_1=Mágikus sebzés
items.wands.wand$placeholder.name=pálca
items.wands.wand.ac_zap=TÁMAD
items.wands.wand.curse_discover=Ez a %s el van átkozva!
items.wands.wand.cursed=Ez a pálca elátkozott, ami miatt a mágiája kaotikus és véletlenszerű.
items.wands.wand.fizzles=A pálcád sistereg; biztos nincs elég töltése.
items.wands.wand.identify=Most már elég jól ismered a pálcádat ahhoz, hogy felismerd.
items.wands.wand.no_magic=A pálcád sistereg; varázsimmunitás alatt nem használhatsz pálcákat.
items.wands.wand.not_cursed=Ez a pálca mentes a rosszindulatú mágiától.
items.wands.wand.prompt=Válasszon egy helyet a gyorsításhoz
items.wands.wand.resin_many=Ez a pálca _%d szinteket_ szerzett az arkán gyantától.
items.wands.wand.resin_one=Ez a pálca _1 szintet_ nőtt az arkán gyantától.
items.wands.wand.self_target=Nem célozhatod meg magad!
items.wands.wandofblastwave.bmage_desc=Amikor _a Harcmágus_ egy robbanáshullámból álló bottal lecsap egy megbénult ellenségre, elnyeli a bénultságot, hogy bónusz mágikus sebzést okozzon. Ennek ellenfélenként rövid a lehűlési ideje.
items.wands.wandofblastwave.desc=Ez a pálca egyfajta márványozott kőből készült, arany szegéllyel és egy kerek fekete drágakővel a hegyén. Nagyon nehéznek érződik a kézben.
items.wands.wandofblastwave.eleblast_desc=Egy robbantási hullámból álló bottal végrehajtott elementális robbanás 67%-os sebzést okoz és minden ellenséget a robbanási zónán kívülre lök.
items.wands.wandofblastwave.knockback_ondeath=Az ütközés megölt téged...
items.wands.wandofblastwave.name=robbanáshullám pálcája
items.wands.wandofblastwave.ondeath=Saját magadat ölted meg a saját Robbanáshullám-pálcáddal...
items.wands.wandofblastwave.staff_name=robbanáshullám személyzete
items.wands.wandofblastwave.stats_desc=Ez a pálca egy nyílvesszőt lő ki, amely hevesen felrobban a célponton. A robbanás ereje _%1$d-%2$d sebzést okoz_, és elég erős ahhoz, hogy a legtöbb ellenséget a levegőbe repítse.
items.wands.wandofblastwave.typical_stats_desc=Ez a pálca egy nyílvesszőt lő ki, amely hevesen felrobban a célponton. A robbanás ereje jellemzően _%1$d-%2$d sebzést okoz_, és elég erős ahhoz, hogy a legtöbb ellenséget elrepüljön.
items.wands.wandofblastwave.upgrade_stat_name_2=Visszaütés
items.wands.wandofcorrosion.bmage_desc=Amikor _a csatamágus_ rozsdás bottal sújt le egy ellenségre, az könnyen elázhat.
items.wands.wandofcorrosion.desc=Ennek a pálcának hamuszürke teste van, amely egy ragyogó narancssárga drágakővé nyílik.
items.wands.wandofcorrosion.eleblast_desc=Egy korróziós bottal történő elemi robbanás 4 korróziós kört okoz az ellenségeknek, 6 sebzéstől kezdődően.
items.wands.wandofcorrosion.name=korróziós pálca
items.wands.wandofcorrosion.staff_name=korrózióvédelmi személyzet
items.wands.wandofcorrosion.stats_desc=Ez a pálca egy nyilat lő ki, amely egy célzott helyen erősen korrozív gázfelhővé robban. Bármi, ami ebbe a felhőbe kerül, idővel egyre nagyobb sebzést szenved el, _%d sebzéstől kezdődően._
items.wands.wandofcorrosion.upgrade_stat_name_1=Korróziós károk
items.wands.wandofcorrosion.upgrade_stat_name_2=Gázmennyiség
items.wands.wandofcorruption.already_corrupted=Azt a karaktert már nem lehet tovább befolyásolni.
items.wands.wandofcorruption.bmage_desc=Amikor _a csatamágus_ romlottságból álló bottal sújt le egy ellenségre, az elfüstölődik.
items.wands.wandofcorruption.desc=Ez a pálca kaotikus sötét energiát sugároz, ha ez nem lenne már nyilvánvaló a hegyére formált apró, díszes koponyából.
items.wands.wandofcorruption.eleblast_desc=Egy romboló bottal leadott elementális robbanás 5 ámokfájást okoz az ellenségnek.
items.wands.wandofcorruption.name=korrupció pálcája
items.wands.wandofcorruption.staff_name=korrupciós személyzet
items.wands.wandofcorruption.stats_desc=Ez a pálca egy romboló energia lökést bocsát ki, amely csökkenti az ellenségek erejét, és végül az akaratod alá hajtja őket. Az ellenségek képesek ellenállni a romlásnak, de a legyengült ellenfeleket sokkal könnyebb megrontani, mint az egészségeseket.
items.wands.wandofcorruption.upgrade_stat_name_1=Korrupt hatalom
items.wands.wandofcorruption.upgrade_stat_name_2=Gyengítés időtartama
items.wands.wandofdisintegration.bmage_desc=Amikor _a Harcmágus_ viseli, a szétesés botjának megnövekedett támadási hatótávolsága van, mintha kiálló varázslat lenne rajta.
items.wands.wandofdisintegration.desc=Ez a pálca egy tömör, sima obszidián darabból készült, mélylila fény árad az oldalán, ami a hegyénél ér véget. Pusztító energiával izzik, várva, hogy előretörhessen.
items.wands.wandofdisintegration.eleblast_desc=Egy elemi lövedék egy szétesést okozó bottal 100%-os sebzést okoz és áthatol a falakon.
items.wands.wandofdisintegration.name=szétesés pálcája
items.wands.wandofdisintegration.staff_name=a szétesés személyzete
items.wands.wandofdisintegration.stats_desc=Ez a pálca egy sugarat lő ki, amely áthatol bármilyen akadályon, és minél fejlettebbé van téve, annál messzebbre hat. A sugár _%1$d-%2$d sebzést okoz,_ valamint bónusz sebzést minden ellenfélért és falért, amelyen áthatol.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max. hatótávolság
items.wands.wandoffireblast.bmage_desc=Amikor _a csatamágus_ tűzcsóvával lecsap egy ellenségre, fennáll annak a lehetősége, hogy robbanást idéz elő, amely megsebzi az ellenséget és felemészti az összes közeli tüzet! Ez az esély annál nagyobb, minél több tűz van az ellenség közelében.
items.wands.wandoffireblast.desc=Ez a pálca vörösre lakkozott fából készült, amelyhez bőségesen használtak aranylevelet, hogy igazán királyi hatást keltsen. A hegye serceg és sziszeg, alig várja, hogy szabadjára engedhesse erőteljes varázslatát.
items.wands.wandoffireblast.eleblast_desc=Egy tűzcsóva-bottal végrehajtott elementális robbanás 100%-os sebzést okoz, ajtókat nyit ki, és lángra lobbantja az ellenséget és a terepet.
items.wands.wandoffireblast.name=tűzrobbanás pálcája
items.wands.wandoffireblast.staff_name=tűzrobbantás személyzete
items.wands.wandoffireblast.stats_desc=Ez a pálca használatkor tűzkúpot bocsát ki. A következő támadása _%1$d tölteteket_ fogyaszt el és _%2$d-%3$d sebzést okoz._ Minél több töltetet használ fel a pálca, annál nagyobb és erősebb a hatás.
items.wands.wandoffireblast.upgrade_stat_name_1=1 töltet sebzése
items.wands.wandoffireblast.upgrade_stat_name_2=2 Töltet Sebzése
items.wands.wandoffireblast.upgrade_stat_name_3=3 Töltet sebzése
items.wands.wandoffrost.bmage_desc=Amikor _a csatamágus_ dérbottal sújt le egy átfázott ellenségre, az azonnal megfagyhat. Ez az esély annál nagyobb, minél jobban átfáznak.
items.wands.wandoffrost.desc=Ez a pálca mintha valamiféle varázslatos jégből készült volna. A lekerekített hegye felé egyre fényesebb. Fogva nagyon hidegnek érződik, de a kezed valahogy meleg marad.
items.wands.wandoffrost.eleblast_desc=Egy fagybottal végrehajtott elementális robbanás 100%-os sebzést okoz, megfagyasztja az ellenfeleket és eloltja a tüzeket.
items.wands.wandoffrost.name=fagypálca
items.wands.wandoffrost.staff_name=fagy személyzete
items.wands.wandoffrost.stats_desc=Ez a pálca jeges energiasugarakat lő ki az ellenfeleid felé, _%1$d-%2$d sebzést_ okozva és fagyasztást okozva. A hatás vízben erősebbnek tűnik. A már átfagyott vagy megfagyott ellenfelek kevesebb sebzést szenvednek el ettől a pálcától.
items.wands.wandoffrost.upgrade_stat_name_2=Hűtési időtartam
items.wands.wandoflightning$lightningcharge.desc=A csatamágus jelenleg energiával van feltöltve, ami immunitást biztosít számára a villámcsapásokkal szemben, és növeli a belőle kilövellő villámok hatótávolságát.\n\nHátralévő körök: %s.
items.wands.wandoflightning$lightningcharge.name=Elektromosan töltött
items.wands.wandoflightning.bmage_desc=Amikor _a csatamágus_ villámcsapással lesújt egy ellenségre, lehetősége van 10 körre elektromosan feltölteni magát. Feltöltött állapotban a csatamágus immunis a villámcsapásokra, és tovább villámlik.
items.wands.wandoflightning.desc=Ez a pálca tömör fémből készült, így meglepően nehéz. Két ága a hegyénél összehajlik, és közöttük elektromos ívek vannak.
items.wands.wandoflightning.eleblast_desc=Egy villámcsapással leadott elementális robbanás 100%-os sebzést okoz, 5 körre elkábítja az ellenfeleket, és elektromossá teszi a vizet.
items.wands.wandoflightning.name=villámcsapás
items.wands.wandoflightning.ondeath=Saját magadat ölted meg a saját villámpálcáddal...
items.wands.wandoflightning.staff_name=villámcsapat
items.wands.wandoflightning.stats_desc=Ez a pálca erős villámokat küld át bármire, amire lőnek, _%1$d-%2$d sebzést okozva._ Ez az elektromosság a közeli karakterekhez is eljut, és könnyebben terjed vízben. A pálca ívei téged sebezhetnek, de a szövetségeseidet nem.
items.wands.wandoflivingearth$earthguardian.desc=Élő föld pálcád sziklái védelmező földőrré formálódtak! Ez a sziklás védő megtámadja a közeli ellenségeket, ami arra kényszeríti őket, hogy az őrt támadják meg helyetted. Amikor minden közeli fenyegetés elmúlt, az őr újraformálódik körülötted, és visszatér, amikor legközelebb használod a pálcádat.
items.wands.wandoflivingearth$earthguardian.discover_hint=Ezt a karaktert egy speciális pálcával találhatod meg.
items.wands.wandoflivingearth$earthguardian.name=földes őr
items.wands.wandoflivingearth$earthguardian.wand_info=Az őrző védekező ereje a pálcád szintjéhez kötött. Jelenleg _%1$d-%2$d sebzést blokkol._
items.wands.wandoflivingearth$rockarmor.desc=Varázslatos kövek veszik körül a tested, és támadáskor megpróbálják blokkolni őket, így 50%%-val csökkentik az elszenvedett sebzést. Minden blokkolt sebzés azonban lekaparja a kőzet egy részét.\n\nMarrántott páncél: %1$d.\n\nHa elég kő épült fel körülötted, az élő föld pálcád következő csapódása a sziklákat egy őrzővé formálja, amely harcolni fog veled.\n\nŐrzőhöz szükséges páncél: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Ez a földi őrző a Sokak Erejének előnyeit is élvezi. Hátralévő körök: %d.
items.wands.wandoflivingearth$rockarmor.name=sziklapáncél
items.wands.wandoflivingearth.bmage_desc=Amikor _a csatamágus_ élő földből készült bottal csap le egy ellenségre, a sebzés egy része kőpáncélként térül meg.
items.wands.wandoflivingearth.desc=Ez a pálca egy különös kőzetből készült, izzó sárga energiacsíkokkal. A sziklák kissé elmozdulni látszanak, ahogy a pálcát szorítod, mintha éreznék a kezed.
items.wands.wandoflivingearth.eleblast_desc=Egy élő föld bottal történő elementális robbanás 50% sebzést okoz, és minden eltalált ellenféllel meggyógyít egy aktív földőrzőt.
items.wands.wandoflivingearth.name=élő föld pálcája
items.wands.wandoflivingearth.staff_name=az élő föld személyzete
items.wands.wandoflivingearth.stats_desc=Ez a pálca mágikus kősugarakat küld az ellenfelekre, _%1$d-%2$d sebzést okozva._ A sziklák ezután átalakulnak a használója körül, az okozott sebzés arányában páncélt adva neki. Ha elegendő páncél épül fel, akkor a pálca következő megsebzésekor egy kőőrzővé alakul.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Őrző blokkolása
items.wands.wandofmagicmissile$magiccharge.desc=A varázslövedék pálcád visszatöltötte az energiát a pálcáidba, növelve a következő lökésük effektív szintjét.\n\nA pálcáid erre lettek növelve: +%d.\n\nHátralévő varázstöltés körök száma: %s.
items.wands.wandofmagicmissile$magiccharge.name=mágikus töltés
items.wands.wandofmagicmissile.bmage_desc=Amikor _a csatamágus_ varázslövedékből álló bottal lecsap egy ellenségre, a botja mellett az összes pálcája is töltést kap.
items.wands.wandofmagicmissile.desc=Ez a meglehetősen egyszerű pálca tiszta mágikus energiájú rakétákat lő ki. Bár maga a pálca semmilyen speciális effektussal nem rendelkezik, több töltése van, és fejlesztéskor rövid időre képes felerősíteni más pálcákat.
items.wands.wandofmagicmissile.discover_hint=Az egyik hős ezzel a tárggyal kezdi.
items.wands.wandofmagicmissile.eleblast_desc=Egy mágikus rakéta botjával végrehajtott elementális robbanás 50% sebzést okoz, és 15 újratöltődési kört biztosít a mágusnak.
items.wands.wandofmagicmissile.name=varázsrakéta pálcája
items.wands.wandofmagicmissile.staff_name=mágikus rakéta személyzete
items.wands.wandofmagicmissile.stats_desc=Ennek a pálcának minden egyes nyílvesszeje _%1$d-%2$d sebzést okoz,_ és fejlesztés esetén rövid időre megerősíti a többi pálcát.
items.wands.wandofprismaticlight.bmage_desc=Amikor _a Harcmágus_ prizmás fénybottal sújt le egy ellenségre, az a bot szintjével arányos ideig megbénul.
items.wands.wandofprismaticlight.desc=Ez a pálca egy tömör, áttetsző kristálydarabból készült, mint egy hosszú, sima üvegdarab. Apró, színes fénydarabkák táncolnak a pálca hegye körül, alig várva, hogy kitörhessenek.
items.wands.wandofprismaticlight.eleblast_desc=Egy prizmás fényből álló bottal történő elementális robbanás 67%-os sebzést okoz, felfedi a robbanás teljes tereptárgyát, és 5 körre megvakítja az ellenfeleket.
items.wands.wandofprismaticlight.name=prizmás fénypálca
items.wands.wandofprismaticlight.staff_name=prizmás fény személyzete
items.wands.wandofprismaticlight.stats_desc=Ez a pálca fénysugarakat lő ki, amelyek áthatolnak a kazamata sötétségén, feltárva rejtett területeket és csapdákat. A sugár megvakíthatja az ellenséget, és _%1$d-%2$d sebzést okoz._ A démoni és élőhalott ellenfelek a pálca erős fényében elégnek, bónusz sebzést szenvedve el.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Vak esély
items.wands.wandofprismaticlight.upgrade_stat_name_3=Fény időtartama
items.wands.wandofregrowth$dewcatcher.desc=A harmatfogók csodálatos növények, amelyek varázslatos harmattal töltik fel magukat. Megpróbálnak fűnek álcázni magukat, hogy elkerüljék a figyelmet, de az összegyűlt harmatból álló dudoraik elárulják őket.
items.wands.wandofregrowth$dewcatcher.discover_hint=Ezt a növényt egy speciális pálcával találhatod meg.
items.wands.wandofregrowth$dewcatcher.name=Harmatfogó
items.wands.wandofregrowth$lotus.desc=Az aranylótusz egy misztikus növény, amelyet csak egy erős, újranövesztő pálcával lehet előidézni. Aurája minden növényt és növényi hatást felerősít, de energiáját elégetve rövid idő után elpusztul.
items.wands.wandofregrowth$lotus.discover_hint=Ezt a növényt egy speciális pálcával találhatod meg, miután többször is fejlesztetted.
items.wands.wandofregrowth$lotus.name=Aranylótusz
items.wands.wandofregrowth$lotus.wand_info=Ezt a lótuszt egy _+%1$d_ újranövekedést elősegítő pálca hozta létre. Az összes, a hatásában lévő növény _azonnal aktiválódik_, ha egy karakterre ültetik őket. A növényeknek _%2$d%% esélyük_ van a magjuk elejtésére, a hegyes dárdák pedig _%3$d%%-val kevesebb tartósságot_ használnak.
items.wands.wandofregrowth$seedpod.desc=A magtokok varázslatos növények, amelyek más növényfajták magjait teremik saját magjaik helyett. Valahogy mégis sikerül elterjedniük annak ellenére, hogy nincs saját magjuk.
items.wands.wandofregrowth$seedpod.discover_hint=Ezt a növényt egy speciális pálcával találhatod meg.
items.wands.wandofregrowth$seedpod.name=Vetőmagtok
items.wands.wandofregrowth.bmage_desc=Amikor _a csatamágus_ újranőtt bottal üt meg egy ellenséget, és bármelyikük füvön áll, a sebzés arányában gyógynövényes gyógyulást kap.
items.wands.wandofregrowth.degradation=Egy újabb _%d töltés_ után ez a pálca nem fog növényeket és friss füvet termelni. Ez a korlát a pálca szintjének növelésével vagy fejlesztésével nő.
items.wands.wandofregrowth.desc=Ez a pálca egy vékony, mesterien faragott fa nyeléből készült. Valahogy még mindig él és vibrál, élénkzöld, mint egy fiatal fa magja. "Amikor az élet megszűnik, mindig új élet kezd növekedni... Az örök körforgás mindig fennmarad!"
items.wands.wandofregrowth.eleblast_desc=Egy újranövésű bottal ellátott elementális robbanás gyökerestül elpusztítja az ellenségeket, és véletlenszerűen füvet növeszt a robbanás területén.
items.wands.wandofregrowth.name=visszanövekedés pálcája
items.wands.wandofregrowth.staff_name=az újranövekedés személyzete
items.wands.wandofregrowth.stats_desc=Használatkor ez a pálca mágikus újranövekedési energiát lövell kifelé egy kúp alakban, életre keltve a füvet, a gyökereket és a ritka növényeket. A következő suhintása _%1$d tölteteket_ fogyaszt. Minél több töltetet használ fel a pálca, annál nagyobb és erősebb a hatás.
items.wands.wandofregrowth.upgrade_stat_name_1=Fű töltésenként
items.wands.wandofregrowth.upgrade_stat_name_2=Teljes fűlimit
items.wands.wandoftransfusion.bmage_desc=Amikor _a csatamágus_ vérátömlesztéses bottal sújt le egy elbűvölő ellenségre, az pajzsot kap, és a következő botütése nem kerül életerőbe.
items.wands.wandoftransfusion.charged=A személyzeted az ellenséged életenergiájával van feltöltve!
items.wands.wandoftransfusion.desc=Egy meglehetősen egyszerű formájú pálca, amely bíborvörös árnyalatával és a hegyén lévő koromsötét drágakővel tűnik ki.
items.wands.wandoftransfusion.eleblast_desc=Egy vérátömlesztéses bottal leadott elementális robbanás elbűvöli az ellenségeket, meggyógyítja a szövetségeseidet, és 100%-os sebzést okoz az élőhalott ellenségeknek.
items.wands.wandoftransfusion.name=transzfúziós pálca
items.wands.wandoftransfusion.ondeath=Saját magadat ölted meg a vérátömlesztéses pálcáddal...
items.wands.wandoftransfusion.staff_name=transzfúziós személyzet
items.wands.wandoftransfusion.stats_desc=Szövetségeseken vagy elbűvölő ellenségeken használva ez a pálca _%1$d életerőt szív el a használójától, hogy meggyógyítsa vagy megvédje a szövetségest _%2$d életerőért._ Ellenfeleken használva a pálca rövid időre elbűvöli őket, miközben _%3$d pajzsot_ ad a használójának. Az ellenséges élőhalottak _%4$d-%5$d sebzést szenvednek el_ ahelyett, hogy elbűvölnék őket.
items.wands.wandoftransfusion.upgrade_stat_name_1=Szövetséges gyógyítás
items.wands.wandoftransfusion.upgrade_stat_name_2=Önvédő
items.wands.wandoftransfusion.upgrade_stat_name_3=Élőhalott sebzés
items.wands.wandofwarding$ward.desc_1=Ez az alap őrszem automatikusan megsemmisít minden ellenséget, ami a látóterébe kerül, _%1$d-%2$d sebzést okozva._\n\nHa megsemmisíted ezt az őrszemet a védelmi pálcáddal, azzal fejleszted azt.\n\nEz az őrszem csak egyszer megsemmisíti magát, mielőtt eloszlik.\n\nAz őrszem pálcád _%3$d energiát_ használ a őrszem fenntartásához.
items.wands.wandofwarding$ward.desc_2=Ennek a fejlesztett őrszemnek bonyolultabb a mintázata, és többször is támadhat. Minden egyes zuhanás ebből az őrszemből _%1$d-%2$d sebzést okoz._\n\nHa a őrszemet a védelem pálcájával támadod, azzal fejleszted azt.\n\nEz az őrszem háromszor zuhan, mielőtt eloszlik.\n\nA őrszem pálcája _%3$d energiát_ használ a őrszem fenntartásához.
items.wands.wandofwarding$ward.desc_3=Ez a teljesen felfejlesztett őrszem többször képes támadni, mint elődei. Minden egyes zuhanás ebből az őrszemből _%1$d-%2$d sebzést okoz._\n\nHa a őrszemet a védelem pálcájával támadod, azzal fejleszted azt.\n\nEz az őrszem ötször zuhan, mielőtt eloszlik.\n\nA védelem pálcája _%3$d energiát_ használ a őrszem fenntartásához.
items.wands.wandofwarding$ward.desc_4=Ennek a kisebb őrszemnek ugyanolyan tűzereje van, mint egy nagyobb őrszemnek, de életereje van a rögzített számú töltet helyett. Hasonló a védelmi pálcád hegyén lévő drágakőhöz. Minden egyes zapolás ettől az őrszemtől _%1$d-%2$d sebzést okoz._\n\nHa a védelmi pálcáddal zapolásra hozod ezt az őrszemet, azzal fejleszted és gyógyítod azt.\n\nEz az őrszem minden alkalommal életerőt költ, amikor zapolásra hoz egy ellenséget, de meggyógyítható, ha a védelmi pálcádat használod ellene.\n\nA védelmi pálcád _%3$d energiát_ használ az őrszem fenntartásához.
items.wands.wandofwarding$ward.desc_5=Ez a fejlesztett őrszem nagyobb és tartósabb, mint egy kisebb őrszem. Minden egyes lövése _%1$d-%2$d sebzést okoz._\n\nHa a védelmi pálcáddal lősz le egy őrszemet, azzal fejleszted és gyógyítod azt.\n\nEz az őrszem minden alkalommal életerőt költ, amikor lő egy ellenséget, de a védelmi pálcáddal gyógyítható.\n\nA védelmi pálcád _%3$d energiát_ használ az őrszem fenntartásához.
items.wands.wandofwarding$ward.desc_6=Ez a teljesen felfejlesztett őrszem jelentősen tartósabb, mint elődei. Minden egyes zapolása _%1$d-%2$d sebzést okoz._\n\nHa a védelmi pálcáddal lecsapsz egy ellenfélre, meggyógyítod.\n\nEz az őrszem minden alkalommal életerőt költ, amikor lecsap egy ellenfelet, de a védelmi pálcáddal meggyógyítható.\n\nA védelmi pálcád _%3$d energiát_ használ az őrszem fenntartásához.
items.wands.wandofwarding$ward.desc_generic_sentry=Ennek az őrszemnek ugyanolyan tűzereje van, mint egy őrszemnek, de életereje van a meghatározott számú töltet helyett. Hasonló a védelem pálcád hegyén lévő drágakőhöz.\n\nHa lecsapsz erre az őrszemre a védelem pálcáddal, azzal fejleszted és gyógyítod azt.\n\nEz az őrszem minden alkalommal életerőt költ, amikor lecsap egy ellenségre, de meggyógyítható, ha a védelem pálcádat használod rajta.
items.wands.wandofwarding$ward.desc_generic_ward=Ez a védelem automatikusan megsemmisít minden ellenséget, amely a látóterébe kerül.\n\nHa a védelem pálcájával megsemmisíted ezt a védelemet, azzal feljavítod azt.\n\nAz őrszemek korlátozott számú megsemmisítést végezhetnek, mielőtt feloszlanak.
items.wands.wandofwarding$ward.discover_hint=Ezt a karaktert egy speciális pálcával találhatod meg.
items.wands.wandofwarding$ward.dismiss_body=Eltávolíthatod ezt a védővarázslatot, ha már nem szeretnéd, hogy a pálcád fenntartsa. Ezzel azonnal megsemmisíted a védővarázslatot. \n\nEltávolítod a védővarázslatot?
items.wands.wandofwarding$ward.dismiss_cancel=nem
items.wands.wandofwarding$ward.dismiss_confirm=igen
items.wands.wandofwarding$ward.dismiss_title=Elutasítom ezt a gyülekezetet?
items.wands.wandofwarding$ward.name_1=kisebb egyházközség
items.wands.wandofwarding$ward.name_2=kórterem
items.wands.wandofwarding$ward.name_3=nagyobb egyházközség
items.wands.wandofwarding$ward.name_4=kisebb őrszem
items.wands.wandofwarding$ward.name_5=őrszem
items.wands.wandofwarding$ward.name_6=nagyobb őrszem
items.wands.wandofwarding.bad_location=Nem lehet oda védőőrséget helyezni.
items.wands.wandofwarding.bmage_desc=Amikor _a csatamágus_ őrzőbottal lecsap egy ellenségre, minden aktív őrszemnek és őrszemnek lehetősége van a gyógyulásra.
items.wands.wandofwarding.desc=Ennek a rövid fém pálcának a hegye felett egy élénklila drágakő lebeg.
items.wands.wandofwarding.eleblast_desc=Egy őrszemélyzettel végzett elementális robbanás meggyógyítja a robbanás területén lévő összes őrszemet és védőszemélyt.
