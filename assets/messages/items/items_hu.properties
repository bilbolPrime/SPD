items.rings.ring.unknown_desc=Ezt a fémgyűrűt egy nagy %s díszíti, amely csillog a sötétben. Ki tudja, milyen hatása lesz, ha felveszed?
items.rings.ringofaccuracy.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%s%%_-val növelve a pontosságodat.
items.rings.ringofaccuracy.desc=Ez a gyűrű növeli az esélyedet, hogy eltaláld az ellenséget.
