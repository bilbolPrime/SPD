items.heap.skeleton_desc=Ez minden, ami egy szerencsétlen kalandorból megmaradt. Talán érdemes lenne átnézni, hogy nincsenek-e benne értéktárgyak.
items.heap.tomb=Sír
items.heap.tomb_desc=Ez az ősi sírbolt talán tartalmaz valami hasznosat, de a tulajdonosa biztosan tiltakozni fog az ellenőrzés ellen.
items.heap.wand=egy pálca
items.honeypot$shatteredpot.desc=A fazék széttört, csak a falát bélelő ragacsos méz tartja egyben, és lassan szétesik.\n\nTörött állapota ellenére a méh még mindig meg akarja védeni az edényt.
