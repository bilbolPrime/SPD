items.potions.potionofmight.name=hatalomitala
items.rings.ringofdetection.desc=Ezzel a gyűrűvel keresgélés nélkül is észreveheted a rejtett csapdákat és titkos ajtókat. A meggyengített felderítőgyűrűk eltompítják az érzékeidet, így még keresés közben is nehezebben találsz titkokra.
items.rings.ringofdetection.name=Az észlelés gyűrűje
items.rings.ringofhaggler.desc=Ennek a gyűrűnek valójában nincs varázsereje. A kereskedőknek azt jelzi, hogy viselője a Tolvajcéh tagja. Általában szívesen adnak kedvezményt, ha cserébe egy időre békén hagyják őket. A gyűrű fejlesztése nem jár további előnyökkel.
items.rings.ringofhaggler.name=Alkudozó Gyűrűje
