items.artifacts.driedrose$wndghosthero.cant_cursed=A szellem csak olyan felszerelést használhat, amiről biztos vagy benne, hogy nincs elátkozva.
items.artifacts.driedrose$wndghosthero.cant_strength=A szellem nem elég erős ahhoz, hogy ezt használja.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Lehet, hogy a szellem nem elég erős ahhoz, hogy ezt használja.
items.artifacts.driedrose$wndghosthero.cant_unique=A szellem nem használhat egyedi tárgyakat.
items.artifacts.driedrose$wndghosthero.desc=A szellem önmagában gyenge, de a teste elég erős ahhoz, hogy fegyverrel és páncéllal felszerelhető legyen. Ezeket a tárgyakat ugyanúgy tudják majd használni, mint te.\n\nA szellem jelenleg olyan tárgyakat tud felszerelni, amelyekhez legfeljebb _%d erő szükséges._
