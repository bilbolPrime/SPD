items.weapon.curses.dazzling.elestrike_desc=Egy káprázatos átokkal járó elementális csapás 50% eséllyel vakít meg minden ellenfelet a hatótávolságon belül 6 körön keresztül.
items.weapon.curses.dazzling.name=káprázatos %s
items.weapon.curses.displacing.desc=A fegyverek elmozdítása kaotikus teleportációs mágiával van átitatva, képessé téve az ellenségeket véletlenszerűen a padló körül mozgatni.
items.weapon.curses.displacing.elestrike_desc=Egy elmozdító átokot tartalmazó elementális csapás 50% eséllyel képes teleportálni minden hatótávolságon belüli ellenfelet.
