items.rings.ringofsharpshooting.typical_stats=Viselés közben ez a gyűrű jellemzően növeli a dobófegyverek sebzését, mintha azok szintje _%1$d_-val nőtt volna, és _%2$s%%_-val növeli a tartósságukat.
