items.scrolls.exotic.exoticscroll.unknown_desc=Egy izzó, megfejthetetlen mágikus rúna van erre a fekete pergamenre írva. Úgy tűnik, idegen erről a földről, ki tudja, mit tesz majd, ha felolvassák?
items.scrolls.exotic.exoticscroll.yngvi=YNGVI egzotikus tekercs
items.scrolls.exotic.scrollofantimagic.desc=A tekercsen lévő varázsige mágikus aurával vesz körül, amely ideiglenesen blokkol minden mágikus hatást, legyen az káros vagy hasznos. Ez magában foglalja a legtöbb mágikus tárgy hatását, például a pálcákat, tekercseket, gyűrűket, ereklyéket, varázslatokat és átkokat. A hősies páncél képességei azonban elég erősek ahhoz, hogy ettől függetlenül működjenek.
items.scrolls.exotic.scrollofantimagic.name=antimágia tekercs
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Egy varázslatos aréna jelent meg körülötted, amit gomolygó vörös köd jelez.\n\nAmíg a ködben állsz, az éhséged nem fog növekedni, és 33%%-val kevesebb sebzést fogsz elszenvedni minden forrásból. Ha bármilyen más sebzéscsökkentő forrásod van (például páncél), azok a 33%% csökkentés után érvényesülnek.\n\nHátralévő körök: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=kihívás aréna
items.scrolls.exotic.scrollofchallenge.desc=Hangos felolvasáskor ez a tekercs egy hatalmas üvöltést szabadít fel, amely az ellenségeket a felhasználóhoz vonzza, miközben egy kis arénát hoz létre körülöttük.\n\nAmíg az olvasó ebben az arénában marad, 33%-kal kevesebb sebzést szenved el minden forrásból (ez a sebzéscsökkentés más formái előtt érvényesül), és nem veszíti el a jóllakottságát.\n\nAz aréna mérete az olvasó által használt terület méretével arányos lesz. Egyes főellenségeken különösen kicsi lesz.
items.scrolls.exotic.scrollofchallenge.name=kihívás tekercs
items.scrolls.exotic.scrollofdivination$wnddivination.desc=A jóslótekercsed a következő tárgyakat azonosította:
items.scrolls.exotic.scrollofdivination.desc=Ez a tekercs véletlenszerűen négy olyan tárgytípust azonosít, amelyeket jelenleg nem ismersz. Az azonosított típusok lehetnek egy varázsital színe, egy tekercs rúnája vagy egy gyűrű drágaköve. Az azonosított tárgyak nem feltétlenül azok, amelyeket nálad hordasz.
items.scrolls.exotic.scrollofdivination.name=jóslás tekercs
items.scrolls.exotic.scrollofdivination.nothing_left=Nincs már mit azonosítani!
items.scrolls.exotic.scrollofdread.desc=Olvasás közben ez a tekercs vörös fényt bocsát ki, ami hihetetlen rettegést kelt a látóteredben lévő összes ellenségben. Ez a hatás olyan nagy, hogy gyorsan megpróbálnak elmenekülni az egész kazamatából, és soha többé nem látják őket!\n\nA terrorhoz hasonlóan ez a hatás is idővel, vagy ha az ellenséget megtámadják, elmúlhat.\n\nAz erős akaratú ellenségeket, például a főellenségeket, ehelyett normál rettegés fogja érni.
items.scrolls.exotic.scrollofdread.name=rettegés tekercs
items.scrolls.exotic.scrollofenchantment.armor=Válassz egy jelet a páncélodhoz.
items.scrolls.exotic.scrollofenchantment.cancel=mégsem
items.scrolls.exotic.scrollofenchantment.cancel_warn=A visszavonás továbbra is felemészti a varázslatos tekercsed, biztos vagy benne?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nem, meggondoltam magam
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Igen, biztos vagyok benne
items.scrolls.exotic.scrollofenchantment.desc=Ez a tekercs erőteljes mágikus energiával ruház fel egy fegyvert vagy páncélt. Az olvasónak bizonyos mértékig még az is van hatalmában, hogy melyik mágiát alkalmazza.
items.scrolls.exotic.scrollofenchantment.inv_title=Elvarázsol egy tárgyat
items.scrolls.exotic.scrollofenchantment.name=varázslatos tekercs
items.scrolls.exotic.scrollofenchantment.weapon=Válassz egy varázslatot, amit a fegyveredre szeretnél alkalmazni.
items.scrolls.exotic.scrollofforesight.desc=A tekercs elolvasása után a közeli terep részletei kristálytisztán jelennek meg az olvasó elméjében. Ez a hatás jelentős ideig tart, és feltárja az összes rejtett ajtót vagy csapdát, így a keresés szükségtelenné válik.
items.scrolls.exotic.scrollofforesight.name=előrelátás tekercs
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=A visszavonás továbbra is felemészti az átváltozás tekercsét, biztos vagy benne?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Válassz egy tehetséget az átalakuláshoz.
items.scrolls.exotic.scrollofmetamorphosis.desc=Ez a tekercs erős átalakító mágiát tartalmaz, amely a varázslóra hat tárgy helyett. A tekercs mágiája lehetővé teszi, hogy kiválassz egy tehetséget, és lecseréld öt, azonos szintű, különböző hősosztályokból származó tehetség egyikére! Ez a hatás csak az osztály tehetségeire érvényes, az alosztályokból vagy páncélképességekből szerzett tehetségekre nem. A nem használható tehetségek nem lesznek választhatók.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorfózis tehetség
items.scrolls.exotic.scrollofmetamorphosis.name=metamorfózis tekercs
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Válassz egy új tehetséget, amivel lecseréled az átalakult tehetségedet.
items.scrolls.exotic.scrollofmysticalenergy.desc=A pergamenbe kötött nyers mágikus erő, amikor felszabadul, idővel feltölti a felhasználó felszerelt ereklyéit.
items.scrolls.exotic.scrollofmysticalenergy.name=misztikus energia tekercs
items.scrolls.exotic.scrollofpassage.desc=A pergamenen lévő varázslat azonnal a legközelebbi, felette lévő első emeletre repíti az olvasót. Nagyon hasznos a boltok gyors eléréséhez.
items.scrolls.exotic.scrollofpassage.name=szövegrész
items.scrolls.exotic.scrollofprismaticimage.desc=Az ezen a tekercsen lévő varázsige az olvasó színes, illuzórikus ikertestvérét hozza létre. Ez a prizmatikus kép az olvasó gyengébb klónjaként működik, hasonló védelemmel, de alacsonyabb életerővel és sebzéssel.\n\nA prizmatikus kép megmutatja magát, amikor ellenségek vannak jelen, és megpróbálja megvédeni az olvasót.\n\nHa már létezik egy prizmatikus kép, akkor a tekercs használata teljesen meggyógyítja.
items.scrolls.exotic.scrollofprismaticimage.name=prizmás kép görgetése
items.scrolls.exotic.scrollofpsionicblast.desc=Ez a tekercs hihetetlen pusztító energiát tartalmaz, amelyet arra lehet használni, hogy elpusztítsa az összes látható lény elméjét.\n\nJelentős visszacsatolás van azonban, és az olvasó is megsérül, megvakul és legyengül. Minél több célpontot talál el a tekercs, annál kevesebb önkárosítást szenved el.
items.scrolls.exotic.scrollofpsionicblast.name=pszionikus robbanás tekercs
items.scrolls.exotic.scrollofpsionicblast.ondeath=A Pszionikus Robbanás széttépi az elméd...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Ezt a lényt egy sziréndal tekercsének varázslata bűvölte el. Egy elbűvölt karakter örökre a szövetségesed lesz, és minden ellenséggel megküzd, akivel találkozik.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=elbűvölt
items.scrolls.exotic.scrollofsirenssong.cancel=Ki kell választani egy célpontot.
items.scrolls.exotic.scrollofsirenssong.desc=A tekercs olvasása egy csábító dallamot bocsát ki, amely lenyűgözi a célzott ellenséget, és véglegesen szövetségesévé változtatja őket! A többi ellenség, aki meghallja, átmenetileg elbűvölődik. A különösen erős ellenfelek ellenállnak az elbűvölő hatásnak, és ehelyett ők lesznek elbűvölve.
items.scrolls.exotic.scrollofsirenssong.name=szirén dalának tekercsét
items.scrolls.exotic.scrollofsirenssong.no_target=A tekercs célpont nélkül aktiválódik.
items.scrolls.exotic.scrollofsirenssong.prompt=Válasszon egy célt
items.scrolls.inventoryscroll.no=Nem, meggondoltam magam
items.scrolls.inventoryscroll.warning=Biztosan megszakítja a tekercs használatát? A tekercs korábban nem volt azonosítva, így akkor is felhasználásra kerül.
items.scrolls.inventoryscroll.yes=Igen, pozitív vagyok
items.scrolls.scroll$placeholder.name=görgetés
items.scrolls.scroll.ac_read=OLVAS
items.scrolls.scroll.berkanan=BERKANAN tekercs
items.scrolls.scroll.blinded=Vakság alatt nem lehet elolvasni egy tekercset.
items.scrolls.scroll.cursed=Az átkozott varázskönyved megakadályozza, hogy előhívd ennek a tekercsnek a mágiáját! Egy átkot eltávolító tekercs talán elég erős ahhoz, hogy működjön...
items.scrolls.scroll.gyfu=GYFU tekercs
