items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Fáradt... egyelőre...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Visszatérek...
items.artifacts.driedrose$ghosthero.desc=Egy törékeny, éteri alak humanoid alakkal. Erejük a rózsádhoz kötődik. \n\nEz a szellem lehet, hogy nem sok, de úgy tűnik, ő az egyetlen igaz barátod itt lent.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Miért történik ez, azt hittem, sikerült?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Hogyan képes ez a dolog még mindig befolyásolni ezt a világot?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Remélem, tudod, mit csinálsz azzal az amulettel.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Gondolom, még nem végeztünk.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Már odáig jutottunk, hogy be tudjuk fejezni!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Már csak egy kicsit arrébb, és kijutunk innen!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Már nagyon régóta nem járt itt ember vagy törpe.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Mi késztetné a törpéket arra, hogy felhagyjanak egy aranybányával?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Kár, hogy az itt lévő összes arany felszínesen haszontalan.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=A lények itt eltorzultak, akárcsak a csatornában.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Még a denevérek is vérszomjasak itt.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Semmi jelét nem láttam bányászfelszerelésnek, vajon a törpök visszaszerezték az egészet?
items.artifacts.driedrose$ghosthero.dialogue_city_1=A törpök szorgalmasak voltak, de kapzsik.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Tehát a törpe metropolisz tényleg elesett.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Remélem, a felszín sosem lesz ilyen.
items.artifacts.driedrose$ghosthero.dialogue_city_4=A törpéknek nem szabadna ilyen sápadtnak kinézniük.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Nem tudom, mi a rosszabb, a törpök, vagy a teremtményeik.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Úgy tűnik, a törpök is agyatlan szörnyetegek lettek mostanra.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Mi ez a hely?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Ez a hely ijesztő...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Mire gondolhattak a törpök, miközben így játszadoztak a hatalommal?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=A szörnyek itt túlvilágiak, honnan jöttek?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Érzed? Mintha valami figyelne minket.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Hála istennek, hogy vannak fáklyák, olyan sötét van itt!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Hallottam már történeteket erről a helyről, semmi jót.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Ez a hely mindig is inkább volt kazamata, mint börtön.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=El sem tudom képzelni, mi történt, amikor ezt a helyet elhagyták.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Úgy tűnik, mind a foglyok, mind az őrök szörnyetegekké változtak.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Mi lehet a felelős ennyi csontvázért?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Ezeknek az embereknek nem kellett volna így végzniük...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Ezek a csatornák régen biztonságosak voltak, télen is éltek itt emberek.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Vajon mi lett az őrjáratokkal, feladták?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Családtagjaim voltak a felszínen, remélem, biztonságban vannak.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Az őrök nem tudták legyőzni ezeket a szörnyeket, de talán mi igen.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Ha már a csatornák is ilyen veszélyesek, vajon mi lehet odalent...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Mi okozhatta, hogy ezek a patkányok és rákok ilyen nagyra nőttek?
items.artifacts.driedrose$ghosthero.direct_prompt=Mit tegyek?
items.artifacts.driedrose$ghosthero.directed_attack_1=Oké, akkor megtámadom azt.
items.artifacts.driedrose$ghosthero.directed_attack_2=Majd én megszerzem.
items.artifacts.driedrose$ghosthero.directed_attack_3=Megnyerő...
items.artifacts.driedrose$ghosthero.directed_attack_4=Kapjuk el őket!
items.artifacts.driedrose$ghosthero.directed_attack_5=Nekem az van.
items.artifacts.driedrose$ghosthero.directed_follow_1=Rendben, követlek.
items.artifacts.driedrose$ghosthero.directed_follow_2=Beállok mögéd.
items.artifacts.driedrose$ghosthero.directed_follow_3=Követlek...
items.artifacts.driedrose$ghosthero.directed_follow_4=Oké, indulhatunk!
items.artifacts.driedrose$ghosthero.directed_follow_5=Mögötted állok.
items.artifacts.driedrose$ghosthero.directed_position_1=Rendben, ezt az álláspontot fenntartom.
items.artifacts.driedrose$ghosthero.directed_position_2=Odamegyek és védekezem.
items.artifacts.driedrose$ghosthero.directed_position_3=Áthelyezés...
items.artifacts.driedrose$ghosthero.directed_position_4=Úton vagyok!
items.artifacts.driedrose$ghosthero.directed_position_5=Oda fogok menni.
items.artifacts.driedrose$ghosthero.discover_hint=Ezt a karaktert egy adott ereklyével találhatod meg.
items.artifacts.driedrose$ghosthero.hello=Üdvözlöm ismét, %s.
items.artifacts.driedrose$ghosthero.introduce=A lelkem ehhez a rózsához kötődik, nagyon értékes volt számomra, ajándék a szerelmemtől, akit a felszínen hagytam.\n\nNem térhetek vissza hozzá, de neked köszönhetően van egy második esélyem, hogy befejezzem az utamat. Amikor képes leszek rá, válaszolok a hívásodra és harcolni fogok veled.\n\nAmíg nálad van a rózsa, hallom a hangod, így messziről is irányíthatsz általa.\n\nRemélem, te sikerrel jársz ott, ahol én kudarcot vallottam...
items.artifacts.driedrose$ghosthero.name=szomorú szellem
items.artifacts.driedrose$ghosthero.player_killed_1=Nem!...
items.artifacts.driedrose$ghosthero.player_killed_2=Nem tudtam segíteni nekik...
items.artifacts.driedrose$ghosthero.player_killed_3=Nem így...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Csak a törpök építenének olyan bányászgépet, ami megöli a betolakodókat.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Az a valami hatalmas...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Hogy maradhatott ez a dolog ilyen sokáig aktív?
items.artifacts.driedrose$ghosthero.seen_goo_1=Vigyázz, Goo!
items.artifacts.driedrose$ghosthero.seen_goo_2=Sok barátom meghalt emiatt, itt az ideje a bosszúnak!
items.artifacts.driedrose$ghosthero.seen_goo_3=Egy ilyen förtelmességet nem szabad életben hagyni!
items.artifacts.driedrose$ghosthero.seen_king_1=Amikor az emberek azt mondják, hogy a hatalom megront, erre gondolnak.
items.artifacts.driedrose$ghosthero.seen_king_2=Inkább lich, mint király most már.
items.artifacts.driedrose$ghosthero.seen_king_3=A törpök még halálukban is engedelmeskednek uruknak.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Az egyetlen megmaradt fogoly egy halálos bérgyilkos. Természetesen...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Csapdába ejtett minket!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Hallottam már rémtörténeteket erről a maszkról...
items.artifacts.driedrose$ghosthero.seen_yog_1=Ó, ez nem néz ki jól.
items.artifacts.driedrose$ghosthero.seen_yog_2=Szóval így néz ki egy isten?
items.artifacts.driedrose$ghosthero.seen_yog_3=Ez fájni fog...
items.artifacts.driedrose$petal.desc=Egy törékeny, kiszáradt szirom, amely valahogy idáig eljutott a kazamatában.
