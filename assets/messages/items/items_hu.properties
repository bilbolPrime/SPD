items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Bocsánat... sok szerencsét...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Fejezd be... nélkülem...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nem... Nem tehetem...
