items.journal.alchemypage.desc=Egy tépett oldal egy alkímia kalauzból.\n\nA szöveg nagy része túl apró ahhoz, hogy távolról olvasható legyen, de az oldal címe kivehető:\n\n_"%s"_
items.journal.alchemypage.name=szakadt alkímia könyvoldal
items.journal.documentpage.desc=Egy magányos oldal, valószínűleg valamilyen könyvből tépték ki. Fel kell venned, hogy elolvashasd.
items.journal.documentpage.name=szakadt oldal
items.journal.guidebook.desc=Egy kalandorok útikönyve, amit valaki hagyott itt, aki úgy döntött, hogy a kalandozás nem neki való! Ez a könyv varázslatos, és arra késztetheti a kalandorokat, hogy a megfelelő pillanatban elolvassanak egy oldalt. \n\n Funkcionalitása ellenére a könyv a borítóján nagy, barátságos betűkkel írt "Ne ess pánikba!" szavak miatt a legnépszerűbb.
items.journal.guidebook.hint_desktop=Az útikönyvedben vannak tanácsok! Válaszd ki a villogó napló gombot (%s) a jobb felső sarokban az elolvasásához.
items.journal.guidebook.hint_mobile=Az útikönyvedben vannak tanácsok! Koppints a jobb felső sarokban villogó napló gombra az elolvasásához.
