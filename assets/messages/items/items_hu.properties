items.kindofweapon.equip_cursed=Akaratlanul is megszorul a fegyver szorítása.
items.kindofweapon.swift_equip=Gyorsan felszereled a fegyvered.
items.kindofweapon.which_equip_msg=Melyik fegyverhelyre szeretnéd felszerelni ezt a tárgyat?\n\nA Bajnok közvetlenül az elsődleges fegyverével támad, de bármelyik fegyver képességét használhatja. Mindkét fegyver töltetszáma megegyezik.\n\nA Bajnok azonnal felcserélheti elsődleges és másodlagos fegyverét.
items.kindofweapon.which_equip_primary=Elsődleges (%s)
items.kindofweapon.which_equip_secondary=Másodlagos (%s)
items.kingscrown.ac_wear=VISELET
items.kingscrown.desc=Az utolsó törpekirály koronája, hatalmas mágikus energiával izzik.Viseléskor a korona varázsereje átáramlik a jelenleg viselt páncélodba, _egyedi, különleges képességekkel rendelkező epikus páncéllá_ alakítva azt. Az új páncél megőrzi az eredeti páncél összes tulajdonságát.
items.kingscrown.discover_hint=Ezt a tárgyat bizonyos ellenfelektől leejtve szerezheted meg.
items.kingscrown.naked=Sajnos a korona nem tudja átalakítani az alsóneműdet.
items.kingscrown.name=Törpe király koronája
items.kingscrown.ratgraded=Patkánykirály mancsai fényesen ragyognak, miközben a páncélod átalakul!
items.kingscrown.upgraded=A korona fényesen világít, majd szétesik, ahogy a páncélod átalakul!
items.liquidmetal.ac_apply=JELENTKEZÉS
items.liquidmetal.already_fixed=Az a hajított fegyver már tökéletes állapotban van!
items.liquidmetal.apply=%d folyékony fémet használsz a dobófegyvered javításához.
items.liquidmetal.desc=Ez a varázslatos folyadék képes kitölteni az eldobott fegyver repedéseit és szakadásait, helyreállítva annak tökéletes állapotát! Ha egy fegyverkészletből hiányzik egy fegyver, de egyébként teljesen megjavították, akkor folyékony fémmel akár pótolható is a készletből egy hiányzó fegyver! ZXQPH0 ZXQ ZXQPH1 ZXQEgy 1. szintű fegyver teljes javításához 10 folyékony fém szükséges, egy 5. szintű fegyverhez 30. Minden fejlesztés 35%-kal növeli a szükséges fém mennyiségét. ZXQPH2 ZXQ ZXQPH3 ZXQA folyékony fém nem használható a hegyes dárda hegyeinek javítására.
items.liquidmetal.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.liquidmetal.name=folyékony fém
items.liquidmetal.prompt=Válasszon egy dobófegyvert
items.lostbackpack.desc=Ez az elveszett leltárod. Gyűjtsd össze, hogy visszaszerezd az összes elvesztett tárgyat!
items.lostbackpack.name=elveszett hátizsák
items.merchantsbeacon.ac_use=HASZNÁLAT
items.merchantsbeacon.desc=Ez a különös törpe technológia lehetővé teszi, hogy nagy távolságokból is kommunikálj.\n\nAktiválása után ezzel a jeladóval a kazamata bármely pontjáról eladhatsz tárgyakat a Pixel Martnak.\n\nAzonban a jeladóban lévő varázslat csak egyetlen alkalomig tart, ezért használd bölcsen.
items.merchantsbeacon.name=kereskedői jelzőfény
items.potions.brews.aquabrew.desc=Amikor ez a főzet összetörik, nyomás alatt lévő víz robban ki a helyén. Ez csak annyira erős, hogy sebezze a tüzes ellenfeleket, de vizet is szétterít a közeli terepre, hatástalanítja a csapdákat, eloltja a tüzet, és hátralöki a robbanás közelében lévő karaktereket.
items.potions.brews.aquabrew.name=vízi főzet
items.potions.brews.blizzardbrew.desc=Amikor ez a főzet összetörik, örvénylő hóvihart szabadít fel, amely gyorsan terjed, mint egy gáz.
items.potions.brews.blizzardbrew.name=hóviharos főzet
items.potions.brews.brew.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.potions.brews.causticbrew.desc=Ez a főzet maró iszapot terjeszt majd széles területen a szétesés helye körül. Bármi, amit az iszap magába fog, lassan megolvad, ha nem tudja lemosni vízzel.
items.potions.brews.causticbrew.name=marószer
items.potions.brews.infernalbrew.desc=Amikor ez a főzet összetörik, tomboló tüzet szabadít fel, amely gyorsan terjed, mint egy gáz.
items.potions.brews.infernalbrew.name=pokoli főzet
items.potions.brews.shockingbrew.desc=Amikor ez a főzet összetörik, elektromos vihart szabadít fel a törés helye körüli széles területen.
items.potions.brews.shockingbrew.name=sokkoló ital
items.potions.brews.unstablebrew.desc=Ez a varázslatos ital a szivárvány változó színeiben ragyog. \n\nItatás vagy eldobás esetén egy véletlenszerű főzet hatását váltja ki. A főzet hatása mindig előnyös lesz, ha megisszák, és mindig káros, ha eldobják.
items.potions.brews.unstablebrew.name=instabil főzet
items.potions.elixirs.elixir.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Ideiglenesen helyreállító tulajdonságokra tettél szert, amelyek hasonlóak Goo-hoz.\n\nVízben állva körönként kis mennyiségű életerőt nyersz vissza. A hatás szünetel, ha teljes életerőd van, vagy elfogy a víz.\n\nHátralévő gyógyulás: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=vízi gyógyítás
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Ez az elixír Goo maradványait tartalmazza, melyeket egy gyógyító bájital egészít ki. Bár nem biztosít azonnali gyógyulást, a vízben állva fokozatosan visszaállítja az életerődet.
items.potions.elixirs.elixirofaquaticrejuvenation.name=vízi megfiatalodás elixírje
items.potions.elixirs.elixirofarcanearmor.desc=Ez az elixír hosszan tartó ellenállást biztosít az ivójának a mágikus sebzéssel szemben.
items.potions.elixirs.elixirofarcanearmor.name=misztikus páncél elixírje
items.potions.elixirs.elixirofdragonsblood.desc=Fogyasztáskor ez az elixír tüzes erőt küld az ivó ereiben. Ez a hatás immunissá teszi az ivót a tűzre, és lehetővé teszi számára, hogy fizikai támadásokkal lángra lobbantsa az ellenségeit.
items.potions.elixirs.elixirofdragonsblood.name=sárkányvér elixírje
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Egy tollhullás elixír hatása alatt állsz, ami lehetővé teszi, hogy sérülés nélkül szakadékokba ess!\n\nHátralévő körök: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=tollhullás
items.potions.elixirs.elixiroffeatherfall.desc=Ez az elixír gyengébb, de jobban kontrollált levitációs hatást kínál, lehetővé téve az ivó számára, hogy egy ideig nagy távolságokat zuhanjon sérülés nélkül.
items.potions.elixirs.elixiroffeatherfall.light=Könnyűnek érzed magad, mint a pehely!
items.potions.elixirs.elixiroffeatherfall.name=tollhullás elixírje
items.potions.elixirs.elixirofhoneyedhealing.desc=Ez az elixír a gyógyítást a méz édességével ötvözi. Megivás esetén ugyanazt a hatást éri el, mint egy gyógyító bájital, és csillapítja a kis mértékű éhséget, de eldobásával szövetségeseket is gyógyíthat. A méz iránt érdeklődő lények megnyugtatóak lehetnek, ha ezt a tárgyat rajtuk használják.
items.potions.elixirs.elixirofhoneyedhealing.name=mézes gyógyító elixír
items.potions.elixirs.elixiroficytouch.desc=Fogyasztáskor ez az elixír lehetővé teszi az ivó számára, hogy elszívja a megtámadott ellenségek hőjét. Ez a hatás immunissá teszi az ivót a hidegre, és lehetővé teszi számára, hogy fizikai támadásokkal lehűtse az ellenséget.
items.potions.elixirs.elixiroficytouch.name=jeges érintés elixírje
items.potions.elixirs.elixirofmight$htboost.desc=A tested természetellenesen erősnek és egészségesnek érzed magad.\n\nA maximális életerőd hosszabb ideig megnő. Ahogy szintet emelsz, a bónusz fokozatosan csökken.\n\nJelenlegi bónusz összege: %d.\nHátralévő szintek: %d.
items.potions.elixirs.elixirofmight$htboost.name=maximális életerő-növelés
items.potions.elixirs.elixirofmight.desc=Ez az erős folyadék átjárja az izmaidat, véglegesen egy ponttal növelve az erődet, és ideiglenesen %d pontokkal a maximális életerődet. Az életerő-növelés a maximális életerőddel arányos, de lassan elmúlik, ahogy szintet emelsz.
items.potions.elixirs.elixirofmight.msg=Újdonsült erő áramlik át a testeden, most már %d erőd van!
items.potions.elixirs.elixirofmight.name=az erő elixírje
items.potions.elixirs.elixiroftoxicessence.desc=Fogyasztáskor ez az elixír mérgező energiával tölti fel az ivót. Az ivó mozgás közben folyamatosan mérgező gázt fog terjeszteni, és valamivel hosszabb ideig lesz immunis a mérgező gázokra és a méregre, mint a hatás időtartama.
items.potions.elixirs.elixiroftoxicessence.name=mérgező esszencia elixírje
items.potions.exotic.exoticpotion.amber=egzotikus borostyánfőzet
items.potions.exotic.exoticpotion.azure=egzotikus azúrkék főzet
