items.weapon.melee.roundshield.ability_desc=A Párbajozó _védheti_ magát egy kerek pajzzsal, amivel teljesen semlegesíthet minden ellene irányuló fizikai vagy mágikus támadást _%d körökre_. Miután a Párbajozó blokkolt egy támadást, a visszatámadás vagy a mágia használata véget vet a védekezésnek.
items.weapon.melee.roundshield.ability_name=őr
items.weapon.melee.roundshield.desc=Ez a nagy pajzs hatékonyan blokkolja a támadásokat, és vészhelyzetben tisztességes fegyver lehet.
items.weapon.melee.roundshield.name=kerek pajzs
items.weapon.melee.roundshield.stats_desc=Ez a fegyver 0-%d sebzést blokkol. A blokkolás mértéke a fejlesztésekkel növekszik.
items.weapon.melee.roundshield.typical_ability_desc=A Párbajozó _védheti_ magát egy kerek pajzzsal, amivel teljesen semlegesíthet minden ellene irányuló fizikai vagy mágikus támadást, jellemzően _%d körökre_. Miután a Párbajozó blokkolt egy támadást, a visszatámadás vagy a mágia használata véget vet a védekezésnek.
items.weapon.melee.roundshield.typical_stats_desc=Ez a fegyver jellemzően 0-%d sebzést blokkol. Ez a blokkolás a fejlesztésekkel arányos.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Képesség időtartama
items.weapon.melee.runicblade.ability_desc=A Párbajozó rúnakarddal _rúnavágást_ tud végrehajtani. Ez a támadás garantáltan találó, és _+%d%% varázslatos ereje van._
items.weapon.melee.runicblade.ability_name=rúnajel
items.weapon.melee.runicblade.desc=Egy titokzatos fegyver egy távoli vidékről, élénkkék pengével.
items.weapon.melee.runicblade.name=rúna penge
items.weapon.melee.runicblade.stats_desc=Ez a fegyver jobban profitál a fejlesztésekből.
items.weapon.melee.runicblade.typical_ability_desc=A Párbajozó rúnakarddal _rúnavágást_ tud végrehajtani. Ez a támadás garantáltan találó, és jellemzően _+%d%% varázslatos ereje van._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Képességerő
items.weapon.melee.sai$combostriketracker.desc=A Párbajozó egy olyan kombót épít, amivel növelhető a kombó ütési képességének sebzése. Minden sikeres normál közelharci vagy dobófegyveres támadás számít, de ha 5 körig nem támadsz sikeresen, az visszaállítja ezt a kombót.\n\nLegutóbbi találatok: %1$d.\n\nKörök a találatok elvesztéséig: %2$s.
items.weapon.melee.sai$combostriketracker.name=kombinált ütés
items.weapon.melee.sai.ability_desc=A Párbajozó végrehajthat egy _kombó támadást_ sai-val. Ez a támadás garantáltan találatot okoz, és _+%d sebzést_ okoz minden alkalommal, amikor a Párbajozó közelharci vagy dobófegyveres támadással talál el. Ha 5 körig nem talál, ez a kombó visszaáll.
items.weapon.melee.sai.ability_name=kombinált ütés
items.weapon.melee.sai.desc=Két vékony penge, amelyeket egy-egy kézben kell tartani. Kiválóan alkalmasak ellenfelek lesújtására vágások sorozatával.
items.weapon.melee.sai.name=sai
items.weapon.melee.sai.stats_desc=Ez egy nagyon gyors fegyver.
items.weapon.melee.sai.typical_ability_desc=A Párbajozó végrehajthat egy _kombó támadást_ sai-val. Ez a támadás garantáltan találatot okoz, és jellemzően _+%d sebzést_ okoz minden alkalommal, amikor a Párbajozó közelharci vagy dobófegyveres támadással talál el. Ha 5 körig nem talál, ez a kombó visszaáll.
items.weapon.melee.scimitar$sworddance.desc=A Párbajozó gyors, lendületalapú csapásokat hajt végre, egyfajta táncban. Amíg ez a póz aktív, 60%%-val gyorsabban támad (elég ahhoz, hogy körönként pontosan kétszer támadhasson szablyával), és +50%% pontossággal rendelkezik.\n\nHátralévő körök: %s.
items.weapon.melee.scimitar$sworddance.name=kardtánc
items.weapon.melee.scimitar.ability_desc=A Párbajozó _kardtáncot_ tud előadni egy szablyával. Ez a póz gyorsan aktiválódik, és +60%% támadási sebességet és +50%% pontosságot biztosít a Párbajozónak _%d körökben._
items.weapon.melee.scimitar.ability_name=kardtánc
items.weapon.melee.scimitar.desc=Vastag, ívelt penge. Alakja gyorsabb, mégis kevésbé erőteljes támadásokat tesz lehetővé.
items.weapon.melee.scimitar.name=handzsár
items.weapon.melee.scimitar.stats_desc=Ez egy meglehetősen gyors fegyver.
items.weapon.melee.scimitar.typical_ability_desc=A Párbajozó _kardtáncot_ tud előadni egy szablyával. Ez a póz gyorsan aktiválódik, és +60%% támadási sebességet és +50%% pontosságot biztosít a Párbajozónak, jellemzően _%d körökre._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Képesség időtartama
items.weapon.melee.shortsword.ability_desc=A Párbajozó _hasíthat_ egy ellenséget egy rövidkarddal. Ez _%1$d-%2$d sebzést okoz_ és garantáltan talál. Ha a hasítás megöl egy ellenséget, az azonnali, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.melee.shortsword.ability_name=hasít
items.weapon.melee.shortsword.desc=Egy meglehetősen rövid kard, csak néhány hüvelykkel hosszabb, mint egy tőr.
items.weapon.melee.shortsword.name=rövidkard
items.weapon.melee.shortsword.typical_ability_desc=A Párbajozó _hasíthat_ egy ellenséget egy rövidkarddal. Ez jellemzően _%1$d-%2$d sebzést okoz_, és garantáltan talál. Ha a hasítás megöl egy ellenséget, az azonnali, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.melee.sickle.ability_desc=A Párbajozó sarlóval _learathatja_ az ellenséget. Ez a pusztító támadás garantáltan eltalálja és _%d sebzést_ okoz. Ez a sebzés vérzésként hat, ha a célpont nem immunis.
items.weapon.melee.sickle.ability_name=aratás
items.weapon.melee.sickle.desc=Egy kézi mezőgazdasági eszköz, amely erős, de nehezen kezelhető fegyverként is funkcionál.
items.weapon.melee.sickle.name=sarló
items.weapon.melee.sickle.stats_desc=Ez egy meglehetősen pontatlan fegyver.
items.weapon.melee.sickle.typical_ability_desc=A Párbajozó sarlóval _learathatja_ az ellenséget. Ez a pusztító támadás garantáltan eltalálja, és jellemzően _%d sebzést_ okoz. Ez a sebzés vérzésként jelentkezik, ha a célpont nem immunis.
items.weapon.melee.spear.ability_desc=A Párbajozó egy lándzsa hegyével _leszúrhat_ egy ellenfelet, aki a hatótávolságán belül van, de nem mellette. Ez _%1$d-%2$d sebzést okoz_, hátralöki az ellenfelet, és garantáltan talál.
items.weapon.melee.spear.ability_name=tüske
items.weapon.melee.spear.desc=Egy karcsú, kihegyezett vassal kihegyezett farúd.
items.weapon.melee.spear.name=lándzsa
items.weapon.melee.spear.stats_desc=Ez egy meglehetősen lassú fegyver.\nEnnek a fegyvernek extra hatótávolsága van.
items.weapon.melee.spear.typical_ability_desc=A Párbajozó egy lándzsa hegyével _leszúrhat_ egy ellenfelet, aki a hatótávolságán belül van, de nem mellette. Ez jellemzően _%1$d-%2$d sebzést okoz_, hátralöki az ellenfelet, és garantáltan talál.
items.weapon.melee.sword$cleavetracker.desc=A Párbajozó készen áll az előző hasításának folytatására. A hasítás következő használata nem kerül fegyverképesség-töltésbe. \n\nHátralévő körök: %s.
items.weapon.melee.sword$cleavetracker.name=hasít
items.weapon.melee.sword.ability_desc=A Párbajozó karddal _hasíthat_ egy ellenséget. Ez _%1$d-%2$d sebzést_ okoz, és garantáltan talál. Ha a hasítás megöl egy ellenséget, az azonnali, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.melee.sword.ability_name=hasít
items.weapon.melee.sword.desc=Egy szépen kiegyensúlyozott kard. Nem túl nagy, de mégis jelentősen hosszabb, mint egy rövidkard.
items.weapon.melee.sword.name=kard
items.weapon.melee.sword.typical_ability_desc=A Párbajozó karddal _hasíthat_ egy ellenséget. Ez jellemzően _%1$d-%2$d sebzést_ okoz, és garantáltan talál. Ha a hasítás megöl egy ellenséget, az azonnali, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.melee.warhammer.ability_desc=A Párbajozó képes egy _erős csapást_ mérni egy harci kalapáccsal. Ez a koncentrált támadás _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérést. Az erős csapás mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
items.weapon.melee.warhammer.ability_name=nehéz ütés
items.weapon.melee.warhammer.desc=Kevés teremtmény képes ellenállni ennek a hatalmas ólom- és acéltömegnek a zúzó csapásának, de nagy erő kell a hatékony használatához.
items.weapon.melee.warhammer.name=harci kalapács
items.weapon.melee.warhammer.stats_desc=Ez egy meglehetősen pontos fegyver.
items.weapon.melee.warhammer.typical_ability_desc=A Párbajozó képes egy _erős csapást_ mérni egy harci kalapáccsal. Ez a koncentrált támadás jellemzően _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérési esélyt. Az erős csapás mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
items.weapon.melee.warscythe.ability_desc=A Párbajozó _learathatja_ az ellenséget egy harci kaszával. Ez a pusztító támadás garantáltan eltalálja és _%d sebzést_ okoz. Ez a sebzés vérzésként hat, ha a célpont nem immunis.
items.weapon.melee.warscythe.ability_name=aratás
items.weapon.melee.warscythe.desc=Ezt a nagy és nehézkes eszközt megerősítették, hogy jobban tudja vágni az ellenségeket, mint a terményeket.
items.weapon.melee.warscythe.name=háborús kasza
items.weapon.melee.warscythe.stats_desc=Ez egy meglehetősen pontatlan fegyver.
items.weapon.melee.warscythe.typical_ability_desc=A Párbajozó _arathat_ egy ellenséget egy harci kaszával. Ez a pusztító támadás garantáltan eltalálja, és jellemzően _%d sebzést_ okoz. Ez a sebzés vérzésként hat, ha a célpont nem immunis.
items.weapon.melee.whip.ability_desc=A Párbajozó _megcsaphatja_ maga körül az összes ellenséget egy ostorral. Ez a képesség _%1$d-%2$d sebzést okoz_, megtámadja az összes ellenséget a támadási távolságon belül, és garantáltan talál.
items.weapon.melee.whip.ability_name=szempilla
items.weapon.melee.whip.desc=Bár a fegyver végén lévő szöges kötél hossza gyenge sebzést okoz, a hatótávolsága páratlan.
items.weapon.melee.whip.name=ostor
items.weapon.melee.whip.stats_desc=Ennek a fegyvernek óriási a hatótávolsága.
items.weapon.melee.whip.typical_ability_desc=A Párbajozó _megcsaphatja_ maga körül az összes ellenséget egy ostorral. Ez a képesség jellemzően _%1$d-%2$d sebzést okoz_, megtámadja az összes ellenséget a támadási távolságon belül, és garantáltan talál.
items.weapon.melee.wornshortsword.ability_desc=A Párbajozó _hasíthat_ egy ellenfelet egy kopott rövidkarddal. Ez _%1$d-%2$d sebzést okoz_ és garantáltan talál. Ha a hasítás megöl egy ellenfelet, az azonnali, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.melee.wornshortsword.ability_name=hasít
items.weapon.melee.wornshortsword.desc=Egy meglehetősen rövid kard, a sok használattól elkopott. Gyengébb és egy kicsit könnyebb is, mint egy jobb állapotban lévő rövidkard.
items.weapon.melee.wornshortsword.discover_hint=Az egyik hős ezzel a tárggyal kezdi.
items.weapon.melee.wornshortsword.name=kopott rövidkard
items.weapon.melee.wornshortsword.typical_ability_desc=A Párbajozó _hasíthat_ egy ellenfelet egy kopott rövidkarddal. Ez jellemzően _%1$d-%2$d sebzést okoz_, és garantáltan talál. Ha a hasítás megöl egy ellenfelet, az azonnali, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.missiles.bolas.desc=Ezek a szokatlan távolsági fegyverek nem túl sebezhetőek, de kiváló munkát végeznek a célpont lelassításában.
items.weapon.missiles.bolas.name=bolák
items.weapon.missiles.bolas.stats_desc=Ez a fegyver bénulást okoz a célpontnak.
items.weapon.missiles.boomerang.desc=Ha az ellenségre dobják, ez a lapos, ívelt fa lövedék visszatér a dobó kezébe.
items.weapon.missiles.boomerang.durability=Masszív felépítésének köszönhetően ez a bumeráng nem fog eltörni használat közben.
items.weapon.missiles.boomerang.name=bumeráng
items.weapon.missiles.darts.adrenalinedart.desc=Ezeknek a nyílvesszőknek a hegye egy sebezhető bogáncs alapú vegyülettel van átitatva, ami felpörgeti a szövetségesek mozgási és támadási sebességét, vagy rövid időre csökkenti az ellenségek mozgási sebességét. Maga a nyílvessző továbbra is káros az ellenségekre, de a szövetségeseknek nem okoz kárt.
items.weapon.missiles.darts.adrenalinedart.name=adrenalin nyíl
items.weapon.missiles.darts.blindingdart.desc=Ezeknek a nyílvesszőknek a hegye egy gyomnövény alapú vegyülettel van átitatva, ami rövid időre megvakítja a célpontot. Azonban nem zavarják el a tájékozódást, így az ellenfél továbbra is tudni fogja, hol látott utoljára.
items.weapon.missiles.darts.blindingdart.name=vakító dárda
items.weapon.missiles.darts.chillingdart.desc=Ezeknek a darts nyilaknak a hegye jégsapka alapú vegyülettel van bevonva, ami jelentősen lehűti a célpontot.
items.weapon.missiles.darts.chillingdart.name=hűtéses nyílvessző
items.weapon.missiles.darts.cleansingdart.desc=Ezeknek a nyílvesszőknek a hegye mageroyal alapú vegyülettel van átitatva, amely ideiglenesen immunissá teszi a szövetségeseket minden negatív hatással szemben, vagy megtisztítja az ellenségeket a pozitív hatásoktól. Az ellenségek akár rövid időre el is felejthetik, hogy támadnak vagy menekülnek előled. Maga a nyílvessző továbbra is káros az ellenségekre, de a szövetségeseknek nem okoz kárt.
items.weapon.missiles.darts.cleansingdart.name=tisztító nyíl
items.weapon.missiles.darts.dart.ac_tip=TIPP
items.weapon.missiles.darts.dart.desc=Ezek az egyszerű, tüskés végű fa nyelek súlyozottak, hogy egyenesen repüljenek, és egyetlen csuklómozdulattal megcsípjék zsákmányukat. Magokkal megszórva dobhatják őket, hogy bónusz hatásokat érjenek el.
items.weapon.missiles.darts.dart.name=dárda
items.weapon.missiles.darts.dart.prompt=Válasszon egy vetőmagot
items.weapon.missiles.darts.dart.tip_all=%1$d darts hegyű nyíl %2$d magokkal
items.weapon.missiles.darts.dart.tip_cancel=mégsem
items.weapon.missiles.darts.dart.tip_desc=Egy magot egy vagy két nyílvesszővel kombinálva lehet hegyezni őket. Minden magtípus a saját típusú hegyű nyílvesszőt eredményezi, egyedi, egyszer használatos hatással.\n\nHa ezekkel a magokkal hegyezi a nyílvesszőt, akkor egy _%s_ lesz belőle.
items.weapon.missiles.darts.dart.tip_one=1 nyíl hegye 1 maggal
items.weapon.missiles.darts.dart.tip_title=Hegyes darts
items.weapon.missiles.darts.dart.tip_two=tipp 2 darts 1 kiemelt
items.weapon.missiles.darts.dart.unlimited_uses=Egyszerű felépítésüknek köszönhetően a nyílvesszők gyakorlatilag örökké tartanak.
items.weapon.missiles.darts.displacingdart.desc=Ezeknek a nyílvesszőknek a hegye egy fadeleaf alapú vegyülettel van ellátva, amely rövid távolságra teleportálja a célpontjukat.
items.weapon.missiles.darts.displacingdart.name=elmozdító dárda
items.weapon.missiles.darts.healingdart.desc=Ezeknek a nyílvesszőknek a hegye egy napfű alapú vegyülettel van átitatva, amely gyógyító erőt ad a célpontnak. Maga a nyílvessző továbbra is káros az ellenségre, de a szövetségeseknek nem okoz kárt.
items.weapon.missiles.darts.healingdart.name=gyógyító nyíl
items.weapon.missiles.darts.holydart.desc=Ezeknek a nyílvesszőknek a hegye csillagvirág alapú vegyülettel van átitatva, amely szent energiát juttat a célpontjukba. A szövetségesek és a sima ellenségek áldást kapnak, de az élőhalott vagy démoni ellenségek súlyos sebzést szenvednek. Maga a nyílvessző továbbra is káros az ellenségekre, de a szövetségeseknek nem okoz kárt.
items.weapon.missiles.darts.holydart.name=szent dárda
items.weapon.missiles.darts.incendiarydart.desc=Ezek a nyílvesszők tűzvirág alapú vegyülettel vannak ellátva, amely becsapódáskor ragyogó lángra lobban.
items.weapon.missiles.darts.incendiarydart.name=gyújtónyíl
items.weapon.missiles.darts.paralyticdart.desc=Ezeknek a nyilaknak a hegye földgyökér alapú vegyülettel van ellátva, amely rövid időre megbénítja a célpontot.
items.weapon.missiles.darts.paralyticdart.name=bénító dárda
items.weapon.missiles.darts.poisondart.desc=Ezeknek a nyílvesszőknek a hegye egy bánatmoha alapú vegyülettel van átitatva, ami megmérgezi a célpontjukat.
items.weapon.missiles.darts.poisondart.name=mérges nyíl
items.weapon.missiles.darts.rotdart.desc=Ezeknek a gonosz nyilaknak a hegye egy savas, rothadóbogyó alapú vegyülettel van bevonva, amely agresszíven átrág mindent, amivel a nyila érintkezik. Az erős ellenfelek ellenállnak a hatás nagy részének, de a korrózió elég erős ahhoz, hogy a legtöbb hagyományos ellenfelet könnyen megölje. Ezek tovább tartanak, mint más hegyű nyilak, de a tartósságukat nem lehet fokozni.
items.weapon.missiles.darts.rotdart.discover_hint=Ezt a tárgyat egy adott küldetésből származó mag felhasználásával hozhatod létre.
items.weapon.missiles.darts.rotdart.name=rothadás nyíl
items.weapon.missiles.darts.shockingdart.desc=Ezeknek a nyílvesszőknek a hegye viharvíz alapú vegyülettel van ellátva, ami kellemetlen ütést okoz a célpontnak.
items.weapon.missiles.darts.shockingdart.name=sokkoló nyílvessző
items.weapon.missiles.darts.tippeddart.about_to_break=A nyíl hegye hamarosan lejár.
items.weapon.missiles.darts.tippeddart.ac_clean=TISZTA
items.weapon.missiles.darts.tippeddart.cancel=mégsem
items.weapon.missiles.darts.tippeddart.clean_all=mindent kitisztít
items.weapon.missiles.darts.tippeddart.clean_desc=Ez a művelet eltávolítja a magvak lebukását a darts nyilairól, és visszaállítja azokat normál darts nyilakká.
items.weapon.missiles.darts.tippeddart.clean_one=tiszta
items.weapon.missiles.darts.tippeddart.clean_title=Tiszta darts
items.weapon.missiles.darts.tippeddart.discover_hint=Ezt a terméket megvásárolhatod egy boltban, vagy elkészítheted magból.
items.weapon.missiles.darts.tippeddart.has_broken=A nyíl hegye lejárt.
items.weapon.missiles.darts.tippeddart.unlimited_uses=_De ezek olyan jó minőségűek, hogy gyakorlatilag örökké kitartanak._
items.weapon.missiles.darts.tippeddart.uses_left=Ennek a darts kötegnek _%d/%d_ felhasználása van hátra, mielőtt az egyik hegy elhasználódik.
items.weapon.missiles.fishingspear.desc=Apró dobólándzsák, amelyek jól működnek improvizált fegyverként annak ellenére, hogy horgászatra tervezték őket.
items.weapon.missiles.fishingspear.name=horgászlándzsa
