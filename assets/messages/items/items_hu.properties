items.wands.wandofwarding.no_more_wards=A pálcád nem bír el több védővarázslatot.
items.wands.wandofwarding.staff_name=az őrs személyzete
items.wands.wandofwarding.stats_desc=Ahelyett, hogy közvetlenül sebeznéd az ellenséget, ez a pálca álló őrszemeket és védőőrszemeket idéz meg. Az őrszemek bárhonnan megidézhetők, akár falakon keresztül is, ha van látásod. Ez a pálca egyszerre _%d energia_ értékű őrszemet tud fenntartani.
