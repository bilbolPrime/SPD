items.journal.regionlorepage$caves.desc=Valami, ami egy felfedező naplójának bejegyzésének tűnik, meglepően jól megőrződve, annak ellenére, hogy milyen régi lehet. Vedd fel, hogy elolvasd.
items.journal.regionlorepage$caves.name=régi naplóbejegyzés
items.journal.regionlorepage$city.desc=Egy kicsi, rozsdás fémtábla, amelybe varázslatosan vésett üzenet van. A betűk a tábla kora ellenére is tiszták, de fel kell venned, hogy elolvasd.
items.journal.regionlorepage$city.name=rozsdás tabletta
items.journal.regionlorepage$halls.desc=Egy apró fekete tábla, amelybe világító zöld betűk vannak vésve. A világító betűk távolról homályos köddé olvadnak össze, fel kell venned, hogy elolvashasd.
items.journal.regionlorepage$halls.name=világító tabletta
items.journal.regionlorepage$prison.desc=Egy naplóbejegyzés, vagy valami más feljegyzés, egy régi papírra írva. Úgy tűnik, jobban sikerült, mint a csatornában talált levelek, de akkor is elő kell venned, hogy elolvasd.
items.journal.regionlorepage$prison.name=kopott naplóbejegyzés
items.journal.regionlorepage$sewers.desc=Valami, ami egy levélnek tűnik, egy piszkos papírra írva. Fel kell venned, hogy ki tudd venni, mi van ráírva.
items.journal.regionlorepage$sewers.name=kopott betű
items.keys.crystalkey.desc=Ennek a kristálykulcsnak a vágott felülete csillog a sötétben. Talán kinyit valamit, ami kristályból van?
