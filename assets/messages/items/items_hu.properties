items.weapon.melee.longsword.typical_ability_desc=A Párbajozó _hasíthat_ egy ellenséget egy hosszúkarddal. Ez jellemzően _%1$d-%2$d sebzést okoz_, és garantáltan talál. Ha a hasítás megöl egy ellenséget, az azonnali, és a Párbajozó 5 körön belül ingyen használhatja újra a hasítást.
items.weapon.melee.mace.ability_desc=A Párbajozó képes egy _erős csapást_ végrehajtani buzogánnyal. Ez a koncentrált támadás _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérést. Az erős csapás mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
