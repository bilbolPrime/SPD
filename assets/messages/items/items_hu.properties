items.food.pasty.amulet_desc=Végre megtaláltad, a varázslatos amulettet – várj egy percet, ez csak egy fóliába csomagolt csokoládé, ami úgy néz ki, mint az amulett! Nem ad korlátlan erőt, de legalább feltöltődsz és egy kis tárgytöltést ad. \n\nÁprilis elseje!
items.food.pasty.amulet_name=yendor amulettje?
items.food.pasty.cane_desc=Egy hatalmas, cukros, édes cukorpálca. Akkora, hogy jóllakhatsz tőle, és a cukor talán egy kicsit feldobja a pálcáidat is. \n\nBoldog ünnepeket!
items.food.pasty.cane_name=cukorpálca
items.food.pasty.desc=Egy autentikus cornwalli lepény hagyományos marhahúsos és burgonyás töltelékkel. Isteni!
items.food.pasty.egg_desc=Egy hatalmas csokitojás, színes sárga fóliába csomagolva. Könnyen elég csokoládé van itt ahhoz, hogy jóllakj, és a cukor talán egy apró felárat adhat az alkotásaidnak. \n\n Kellemes Húsvéti Ünnepeket!
items.food.pasty.egg_name=húsvéti tojás
items.food.pasty.fish_desc=Egy egész párolt hal, varázslatosan tartósítva zöldségágyon. Hagyomány, hogy az évnek ebben az időszakában eltesznek belőle későbbre, így marad belőle, ahelyett, hogy egyszerre megennéd. \n\nBoldog holdújévet!
items.food.pasty.fish_name=párolt hal
items.food.pasty.name=tésztás
items.food.pasty.pie_desc=Egy nagy szelet sütőtökös pite. Édes-fűszeres íze jóllakásig el fog telik tőle, és egy kis gyógyulást is ad. \n\nBoldog Halloweent!
items.food.pasty.pie_name=tökös pite
items.food.pasty.rainbow_desc=Ez a színes bájital egyfajta folyékony étel. Az éhség csillapítása mellett egy kis varázslatot is tartalmaz, amely megnyugtatja a szomszédos, nem főellenfeleket, így ideiglenesen haboznak harcolni veled. \n\n Boldog büszkeséget!
items.food.pasty.rainbow_name=szivárvány bájital
items.food.pasty.sparkling_desc=Ez a pezsgő főzet egyfajta folyékony étel. Csillapítja az éhséget és a pezsgőt utánozza, de valójában nem alkoholos. A gyomrodban érzett melegség egy kis védelmet nyújt. \n\nBoldog Új Évet!
items.food.pasty.sparkling_name=pezsgő főzet
items.food.pasty.vanilla_desc=Ez a nagy szelet vaníliás torta színes szórócukorral és kék cukormázzal van bevonva. A tortát az évek során szerzett tapasztalat megünneplésére készítettük, és ha elfogyasztod, ebből az élményből egy kis adagot ad át neked. \n\n Az eredeti Pixel Dungeon először 2012. december 4-én jelent meg. Boldog születésnapot, Pixel Dungeon!
items.food.pasty.vanilla_name=kék torta
items.food.phantommeat.desc=Egy nagy, csillogó, áttetsző steak, egy fantom piranhából vágva. Ez a varázslatos hús nem igényel sütést, és számos védekező előnyt biztosít a teljes jóllakottság mellett. Elfogyasztása láthatatlanná tesz, kéregbőrt képez, némi gyógyulást biztosít, és számos káros hatást gyógyít.
items.food.phantommeat.discover_hint=Ezt a tárgyat bizonyos ellenfelektől leejtve szerezheted meg.
items.food.phantommeat.name=fantomhús
items.food.smallration.desc=Pontosan úgy néz ki, mint egy átlagos adag étel, csak kisebb.
items.food.smallration.discover_hint=Ezt a terméket megvásárolhatja egy üzletben.
