items.weapon.melee.katana.ability_desc=A Párbajozó _kitörést_ tud végrehajtani egy katanával egy 1 mezőnyire lévő ellenfélre. Ez az ellenség felé mozog, _%1$d-%2$d sebzést_ okoz, és garantáltan talál.
