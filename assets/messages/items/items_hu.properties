items.weapon.curses.explosive.warm=Meleg...
items.weapon.curses.friendly.desc=A baráti fegyverek a pacifisták számára a legalkalmasabbak, időnként olyan mágiát váltanak ki, amely lehetetlenné teszi a harcot.
items.weapon.curses.friendly.elestrike_desc=Egy barátságos átokkal ellátott elementális csapás 50% eséllyel képes elbűvölni minden ellenséget a hatótávolságon belül 6 körön keresztül.
items.weapon.curses.friendly.name=barátságos %s
items.weapon.curses.polarized.desc=Egy polarizált fegyverre olyan mágia hat, ami vagy 50%-kal nagyobb sebzést okoz, vagy egyáltalán nem okoz sebzést.
items.weapon.curses.polarized.elestrike_desc=Egy polarizált átokkal ellátott elementális csapás 50% eséllyel 24-36 sebzést okoz minden hatótávolságon belüli ellenfélnek.
items.weapon.curses.polarized.name=polarizált %s
items.weapon.curses.sacrificial.desc=Az áldozati fegyverek viselőjétől vért követelnek az ellenség támadásáért cserébe. Minél egészségesebb a viselője, annál több vért vesz el az átok.
items.weapon.curses.sacrificial.elestrike_desc=Egy áldozati átokkal kísért elementális csapás a hős és a hatótávolságon belüli összes ellenség 12 ÉP-s vérzését okozza.
items.weapon.curses.sacrificial.name=áldozati %s
items.weapon.curses.wayward$waywardbuff.desc=A félresikerült fegyvered varázsa aktiválódott, így rövid időre rendkívül pontatlanná válik. Fontos megjegyezni, hogy ez nem befolyásolja a garantáltan találó támadásokat, például a meglepetésszerű támadásokat. A félresikerült fegyverrel való sikeres támadás azonnal megszünteti ezt a hatást. \n\nHátralévő körök: %s.
items.weapon.curses.wayward$waywardbuff.name=önfejű
items.weapon.curses.wayward.desc=A téves fegyverek néha rendkívül pontatlanná válhatnak. Ez a varázslat aktiválódás után egy ideig tart, de a téves fegyverrel mért csapással eloszlatható.
items.weapon.curses.wayward.elestrike_desc=Egy téves átokkal ellátott elementális csapás 50% eséllyel átkoz meg minden ellenfelet a hatótávolságon belül 6 körön keresztül.
items.weapon.curses.wayward.name=szeszélyes %s
items.weapon.enchantments.blazing.desc=Ez a varázslat lángokat okád a fegyverből, meggyújtva az ellenfeleket és bónusz sebzést okozva a már lángoló ellenfeleknek.
items.weapon.enchantments.blazing.elestrike_desc=Egy lángoló varázslattal járó elementális csapás tüzet terjeszt szét minden hatótávolságon belüli mezőre, ami 8 körig tart.
items.weapon.enchantments.blazing.name=lángoló %s
items.weapon.enchantments.blocking$blockbuff.desc=Fegyvered blokkoló varázslata rövid időre megnövelte a védekező erődet!\n\nHárulékos pajzs: %d\n\nHárulékos körök: %s.
items.weapon.enchantments.blocking$blockbuff.name=blokkolás
items.weapon.enchantments.blocking.desc=A blokkoló fegyvereknek van esélyük arra, hogy rövid ideig megvédjenek a támadás után.
items.weapon.enchantments.blocking.elestrike_desc=Egy blokkoló varázslattal ellátott elementális csapás plusz 6 pajzsot ad a Párbajozónak minden hatótávolságon belüli ellenfél után.
items.weapon.enchantments.blocking.name=%s blokkolása
items.weapon.enchantments.blooming.desc=A virágzó fegyverek varázslatot tartalmaznak, amely növényzetet hoz létre az eltalált fegyvereken vagy azok körül.
items.weapon.enchantments.blooming.elestrike_desc=Egy virágzó varázslattal ellátott elementális csapás legfeljebb 8 mezőnyire terjeszti ki a füvet a hatótávolságon belül, és 6 körre földbe gyökerezi az összes ellenséget a hatótávolságon belül.
items.weapon.enchantments.blooming.name=virágzó %s
items.weapon.enchantments.chilling.desc=Az ezzel a varázslattal eltalált ellenségek lehűlnek, lelassítják mozgásukat és támadásaikat.
items.weapon.enchantments.chilling.elestrike_desc=Egy hátborzongató varázslattal járó elementális csapás hátborzongató levegőt juttat minden mezőre a hatótávolságon belül, ami 8 körig tart.
items.weapon.enchantments.chilling.name=dermesztő %s
items.weapon.enchantments.corrupting.desc=Ez az erős varázslat képes az ellenséget az akaratod alá hajtani. Amikor egy ellenséget ezzel a fegyverrel megölsz, fennáll az esélye, hogy a halál helyett megromlik.
items.weapon.enchantments.corrupting.elestrike_desc=Egy megrontó varázslattal ellátott elementális csapás 5-25% eséllyel (a hiányzó HP alapján) megrontja a hatótávolságon belüli összes ellenfelet, kivéve az elsődleges célpontot.
items.weapon.enchantments.corrupting.name=megrontja a %s-t
items.weapon.enchantments.elastic.desc=A rugalmas fegyvereknek esélyük van arra, hogy rövid távolságokra visszarepítsék az ellenséget.
items.weapon.enchantments.elastic.elestrike_desc=Egy rugalmas varázslattal ellátott elementális csapás 5 mezőt hátráltat a hatótávolságon belüli összes ellenfelet.
items.weapon.enchantments.elastic.name=rugalmas %s
items.weapon.enchantments.grim.desc=Ez az erős varázslat képes azonnal kivégezni egy ellenséget. A hatás valószínűsége annál nagyobb, minél gyengébb az ellenség.
items.weapon.enchantments.grim.elestrike_desc=Egy komor varázslattal ellátott elementális csapás 6-30% eséllyel (a hiányzó HP-k alapján) megöl minden ellenfelet a hatótávolságon belül, kivéve az elsődleges célpontot.
items.weapon.enchantments.grim.name=komor %s
items.weapon.enchantments.kinetic$conserveddamage.desc=A fegyvered elraktározta az előző halálos csapásból származó felesleges erőt, és bónusz sebzésként fogja alkalmazni a következő támadásod során. Az energia azonban idővel lassan elhalványul.\n\nMegőrzött sebzés: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=konzervált kár
items.weapon.enchantments.kinetic.desc=Amikor egy ellenséget kinetikus fegyverrel ölnek meg, a felesleges erő a fegyverben tárolódik, és a következő sikeres támadásra lesz felhasználva.
items.weapon.enchantments.kinetic.elestrike_desc=Egy kinetikus varázslattal ellátott elementális csapás a tárolt sebzés 40%-át okozza minden hatótávolságon belüli ellenfélnek, kivéve az elsődleges célpontot.
items.weapon.enchantments.kinetic.name=kinetikus %s
items.weapon.enchantments.lucky.desc=A szerencsés fegyverrel megölt ellenségeknek esélyük van extra zsákmányra.
items.weapon.enchantments.lucky.elestrike_desc=Egy szerencsés varázslattal ellátott elementális csapás 12,5% eséllyel zsákmányt hoz létre minden hatótávolságon belüli ellenfél alatt. Ez a hatás ellenségenként csak egyszer aktiválódhat.
items.weapon.enchantments.lucky.name=szerencsés %s
items.weapon.enchantments.projecting.desc=Ezzel a varázslattal a közelharci fegyverek hatótávolsága megnő. A távolsági fegyverek áthatolnak a falakon, ha közeli célpontokra irányulnak.
items.weapon.enchantments.projecting.elestrike_desc=Egy kiálló varázslattal ellátott elementális csapás 30% sebzést okoz minden hatótávolságon belüli ellenfélnek, kivéve az elsődleges célpontot.
items.weapon.enchantments.projecting.name=kiálló %s
items.weapon.enchantments.shocking.desc=Egy sokkoló fegyverből elektromos ívek keletkeznek, amelyek extra sebzést okoznak az összes közeli ellenfélnek.
items.weapon.enchantments.shocking.elestrike_desc=Egy sokkoló varázslattal járó elementális csapás elektromossággal árasztja el a hatótávolságon belüli összes mezőt, ami 8 körig tart.
items.weapon.enchantments.shocking.name=sokkoló %s
items.weapon.enchantments.unstable.desc=Ez a varázslat kaotikus energiát sugároz, minden ütéssel más varázslatként hat.
items.weapon.enchantments.unstable.elestrike_desc=Egy instabil varázslattal járó elementális csapás véletlenszerű varázslathatást alkalmaz minden hatótávolságon belüli ellenfélre, kivéve az elsődleges célpontot.
items.weapon.enchantments.unstable.name=instabil %s
items.weapon.enchantments.vampiric.desc=Ez az erőteljes varázslat minden ütéssel életerőt szív el az ellenségekből, és visszajuttatja azt a viselőjébe. A hatás annál erősebb, minél alacsonyabb a viselője életereje.
items.weapon.enchantments.vampiric.elestrike_desc=Egy vámpírbűbájjal eltalált elementális csapás 2,5 ÉP-vel gyógyítja a Párbajozót minden hatótávolságon belüli ellenfél után.
items.weapon.enchantments.vampiric.name=vámpír %s
items.weapon.melee.assassinsblade.ability_desc=A Párbajozó _losonhat_, miközben egy bérgyilkos kardját forgatja. Ez a képesség lehetővé teszi, hogy a Párbajozó azonnal pislogjon akár 3 mezőnyire is, és _%d láthatatlansági köröket ad neki._
items.weapon.melee.assassinsblade.ability_name=settenkedik
items.weapon.melee.assassinsblade.desc=Egy kicsi, hullámos, obszidiánból készült penge, nehéz használni a könnyű súlya ellenére, de halálos, ha a megfelelő célpontra talál.
items.weapon.melee.assassinsblade.name=bérgyilkos pengéje
items.weapon.melee.assassinsblade.stats_desc=Ez a fegyver erősebb a nem tudatos ellenségek ellen.
items.weapon.melee.assassinsblade.typical_ability_desc=A Párbajozó _losonhat_, miközben egy bérgyilkos kardját forgatja. Ez a képesség lehetővé teszi, hogy a Párbajozó azonnal pislogjon akár 3 mezőnyire is, és jellemzően _%d láthatatlansági köröket ad neki._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Képesség időtartama
items.weapon.melee.battleaxe.ability_desc=A Párbajozó képes egy _erős csapást_ mérni egy harci baltával. Ez a koncentrált támadás _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérési esélyt. Az erős csapás mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
items.weapon.melee.battleaxe.ability_name=nehéz ütés
items.weapon.melee.battleaxe.desc=Ennek a harci fejszének hatalmas acélfeje minden széles csapásnál jelentős súlyt ad.
items.weapon.melee.battleaxe.name=harci fejsze
items.weapon.melee.battleaxe.stats_desc=Ez egy meglehetősen pontos fegyver.
items.weapon.melee.battleaxe.typical_ability_desc=A Párbajozó képes egy _erős csapást_ mérni egy harci baltával. Ez a koncentrált támadás jellemzően _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérési esélyt. Az erős csapás mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
items.weapon.melee.crossbow$chargedshot.desc=A Párbajozó az erejét a számszeríjába fókuszálja. A következő támadása mindig eltalálja és a következő három hatás egyikét alkalmazza:\n - A közelharci támadások néhány mezőnyire lökik az ellenfeleket.\n - A hegy nélküli nyilak bónusz sebzést okoznak.\n - A hegyű nyilak extra felhasználási lehetőségeket kapnak, és hatásuk egy 7x7-es területen érvényesül. A pozitív nyilahatások csak a szövetségesekre hatnak, a káros hatások pedig csak az ellenségekre. A Párbajozó ezt a képességet nem használhatja arra, hogy pozitív nyilahatásokat alkalmazzon magára.
items.weapon.melee.crossbow$chargedshot.name=töltött
items.weapon.melee.crossbow.ability_desc=A Párbajozó _feltöltheti_ a számszeríját, aminek következtében a következő rendszeres támadása mindig eltalálja az ellenfeleket, és három hatás egyikét alkalmazza: a közelharci támadások ellövik az ellenfeleket, a hegy nélküli dárdák _+%1$d sebzést_ okoznak, a hegyes dárdák pedig egy 7x7-es területen fejtik ki hatásukat, és _%2$d még _használási_ ideig tartanak.
items.weapon.melee.crossbow.ability_name=feltöltött lövés
items.weapon.melee.crossbow.desc=Egy meglehetősen bonyolult fegyver, amely kivételes sebességgel lő ki nyilait. Bár nem erre tervezték, súlya és masszív felépítése miatt ez a számszeríj közelharci fegyver is egy tisztességes fegyver.
items.weapon.melee.crossbow.name=nyílpuska
items.weapon.melee.crossbow.stats_desc=Ez a fegyver fokozza a dobott dárdák hatását, hogy _%1$d-%2$d sebzést okozzon_, amikor felszerelték, sőt, még varázslatot is biztosít számukra.
items.weapon.melee.crossbow.typical_ability_desc=A Párbajozó _feltöltheti_ a számszeríját, aminek következtében a következő rendszeres támadása mindig eltalálja az ellenfeleket, és három hatás egyikét alkalmazza: a közelharci támadások ellövik az ellenfeleket, a hegy nélküli dárdák jellemzően _+%1$d sebzést_ okoznak, a hegyes dárdák pedig egy 7x7-es területen fejtik ki hatásukat, és jellemzően _%2$d még _használásig_ tartanak.
items.weapon.melee.crossbow.typical_stats_desc=Ez a fegyver jellemzően fokozza a dobott dartsokat, hogy _%1$d-%2$d sebzést okozzon_, amikor felszerelték, sőt, még varázslatot is ad nekik.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Képességnövelés
items.weapon.melee.cudgel.ability_desc=A Párbajozó képes egy _erős ütést_ végrehajtani egy bottal. Ez a koncentrált támadás _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérést. Az erős ütés mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
items.weapon.melee.cudgel.ability_name=nehéz ütés
items.weapon.melee.cudgel.desc=Egy kis rézbuzogány, inkább önvédelmi eszköznek készült nemesek számára, mint kalandfegyvernek.
items.weapon.melee.cudgel.discover_hint=Az egyik hős ezzel a tárggyal kezdi.
items.weapon.melee.cudgel.name=husáng
items.weapon.melee.cudgel.stats_desc=Ez egy meglehetősen pontos fegyver.
items.weapon.melee.cudgel.typical_ability_desc=A Párbajozó képes egy _erős ütést_ végrehajtani egy bottal. Ez a koncentrált támadás jellemzően _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérést. Az erős ütés mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
items.weapon.melee.dagger.ability_desc=A Párbajozó _osonhat_, miközben tőrt forgat. Ez a képesség lehetővé teszi, hogy a Párbajozó azonnal pislogjon akár 5 mezőnyire is, és _%d láthatatlansági köröket ad neki._
