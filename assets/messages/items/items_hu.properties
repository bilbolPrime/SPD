items.armor.armor.too_heavy=Mivel nem vagy elég erős, ennek a páncélnak a viselése csökkenti a mozgás-, kitérési és védekezési képességedet.
items.armor.armor.weak_cursed=Az átok ellenére le tudod venni ezt a páncélt.
