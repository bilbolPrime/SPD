items.energycrystal.desc=Apró, mágikus kristályok gyűjteménye, alkímiai energiával töltve. \n\nEzek a kristályok a leggyakoribb összetevők az alkímiai receptekben, és egy alkímiai edényben előállíthatók fogyóeszközök selejtezésével.
