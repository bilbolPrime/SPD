items.rings.ring.amethyst=ametiszt gyűrű
items.rings.ring.curse_known=Érezheted, hogy egy rosszindulatú mágia lappang ebben a gyűrűben.
items.rings.ring.cursed_worn=Mivel ez a gyűrű el van átkozva, te képtelen vagy eltávolítani.
