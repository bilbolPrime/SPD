items.artifacts.holytome.desc=Egy szent kötet, amely a pap isteni mágiájának középpontjában áll. A kötet segítségével a pap különféle mágikus varázslatokat hozhat létre. \n\n A kötet fokozatosan egyre erősebb lesz, ahogy a pap használja, nagyobb maximális töltést adva a papnak, és kissé megnövelve az újratöltési sebességet.
