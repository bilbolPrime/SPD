items.food.smallration.name=kis élelmiszeradag
items.food.stewedmeat.desc=A hús párolása megtisztította minden betegségtől vagy parazitától. Biztonságosan fogyaszthatónak kell lennie.
items.food.stewedmeat.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
