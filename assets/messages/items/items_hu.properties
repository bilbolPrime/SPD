items.journal.guidebook.name=a kazamatamesterség kötete
items.journal.guidepage.desc=Egy kalandos útikönyvből származó tépett oldal.\n\nA szöveg nagy része túl apró ahhoz, hogy távolról olvasható legyen, de az oldal címe kivehető:\n\n_"%s"_
