items.weapon.melee.flail$spinabilitytracker.desc=A Párbajozó forgatja a cséplőjét, sebzést gyűjtve a következő normál támadásához. Minden pörgés egy körbe tart, de növeli a sebzést, maximum három pörgetésre. A cséplő garantáltan eltalálja pörgés közben.\n\nJelenlegi pörgetések: %1$d%%.\nHátralévő körök: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=fonás
items.weapon.melee.flail.ability_desc=A Párbajozó _megforgathat_ egy cséplőt, hogy rövid ideig erőt gyűjtsön. Minden körben, amikor a cséplő megpörgetődik, _+%d sebzést_ okoz a következő normál támadásakor, maximum 3-szor. A forgó cséplő garantáltan találatot is okoz. Csak a cséplő megforgatásának elindítása kerül töltésre.
items.weapon.melee.flail.ability_name=pörgés
items.weapon.melee.flail.desc=Egy tüskés labda, amelyet egy lánc rögzít a fogantyúhoz. Nagyon nehézkes, de pusztító, ha szilárdan eltalálja.
items.weapon.melee.flail.name=hadonászik
items.weapon.melee.flail.spin_warn=Nem forgathatod tovább a cséplőgépet.
items.weapon.melee.flail.stats_desc=Ez egy meglehetősen pontatlan fegyver. \nEz a fegyver nem tud meglepetéstámadást okozni.
items.weapon.melee.flail.typical_ability_desc=A Párbajozó _megpörgethet_ egy cséplőt, hogy rövid ideig erőt gyűjtsön. Minden körben, amikor a cséplő megpörgetve van, jellemzően _+%d sebzést_ okoz a következő normál támadásánál, maximum 3-szor. A forgó cséplő garantáltan találatot is okoz. Csak a cséplő megpörgetésének elindítása kerül töltésre.
items.weapon.melee.gauntlet.ability_desc=A Párbajozó végrehajthat egy _kombó csapást_ egy kőkesztyűvel. Ez a támadás garantáltan találatot okoz, és _+%d sebzést_ okoz minden alkalommal, amikor a Párbajozó közelharci vagy dobófegyveres támadással talál el. Ha 5 körig nem talál, ez a kombó visszaáll.
items.weapon.melee.gauntlet.ability_name=kombinált ütés
items.weapon.melee.gauntlet.desc=Ez a hatalmas kesztyű bíborvörös anyagból készült, tetején nehéz varázskővel. Az anyag szorosabbra húzódik körülötted, így a vastag kőlapok szinte második bőrként fekszenek körülötted. Egy ilyen nehéz fegyver lendítése erőt igényel, de óriási erőt ad az ütéseidhez.
items.weapon.melee.gauntlet.name=kőkesztyű
items.weapon.melee.gauntlet.stats_desc=Ez egy nagyon gyors fegyver.
items.weapon.melee.gauntlet.typical_ability_desc=A Párbajozó végrehajthat egy _kombó csapást_ egy kőkesztyűvel. Ez a támadás garantáltan találatot okoz, és jellemzően _+%d sebzést_ okoz minden alkalommal, amikor a Párbajozó közelharci vagy dobófegyveres támadással talál el. Ha 5 körig nem talál, ez a kombó visszaáll.
items.weapon.melee.glaive.ability_desc=A Párbajozó egy kard hegyével _megszúrhat_ egy ellenfelet, aki a hatótávolságán belül van, de nem mellette. Ez _%1$d-%2$d sebzést okoz_, hátralöki az ellenfelet, és garantáltan talál.
items.weapon.melee.glaive.ability_name=tüske
items.weapon.melee.glaive.desc=Egy hatalmas rúdfegyver, amely egy rúd végén lévő kardpengéből áll.
items.weapon.melee.glaive.name=kard
items.weapon.melee.glaive.stats_desc=Ez egy meglehetősen lassú fegyver.\nEnnek a fegyvernek extra hatótávolsága van.
items.weapon.melee.glaive.typical_ability_desc=A Párbajozó egy kard hegyével _megszúrhat_ egy ellenfelet, aki a hatótávolságán belül van, de nem mellette. Ez jellemzően _%1$d-%2$d sebzést okoz_, hátralöki az ellenfelet, és garantáltan talál.
items.weapon.melee.gloves.ability_desc=A Párbajozó _kombinált támadást_ hajthat végre szegecses kesztyűkkel. Ez a támadás garantáltan találatot okoz, és _+%d sebzést_ okoz minden alkalommal, amikor a Párbajozó közelharci vagy dobófegyveres támadással talál el. Ha 5 körig nem talál, ez a kombó visszaáll.
items.weapon.melee.gloves.ability_name=kombinált ütés
items.weapon.melee.gloves.desc=Ezek a szegecses kesztyűk nem nyújtanak valódi védelmet, de használható fegyverként funkcionálnak, miközben szabadon hagyják a kezeket.
items.weapon.melee.gloves.discover_hint=Az egyik hős ezzel a tárggyal kezdi.
items.weapon.melee.gloves.name=szegecses kesztyűk
items.weapon.melee.gloves.stats_desc=Ez egy nagyon gyors fegyver.
items.weapon.melee.gloves.typical_ability_desc=A Párbajozó _kombinált támadást_ tud végrehajtani szegecses kesztyűkkel. Ez a támadás garantáltan találó, és jellemzően _+%d sebzést_ okoz minden alkalommal, amikor a Párbajozó közelharci vagy dobófegyveres támadással talál el. Ha 5 körig nem talál, ez a kombó visszaáll az eredeti állapotába.
items.weapon.melee.greataxe.ability_desc=A Párbajozó _megtorló_ támadást hajthat végre egy nagybaltával, ha az életpontja 50%% alatt van. Ez a pusztító támadás _%1$d-%2$d sebzést okoz,_ garantáltan eltalálja, és azonnali, ha megöl egy ellenséget.
items.weapon.melee.greataxe.ability_name=büntetés
items.weapon.melee.greataxe.desc=A vállon viselhető titáni fejsze ugyanolyan erős, mint amilyen nehéz.
items.weapon.melee.greataxe.name=nagyfejsze
items.weapon.melee.greataxe.stats_desc=Ez a fegyver hihetetlenül nehéz.
items.weapon.melee.greataxe.typical_ability_desc=A Párbajozó _megtorló_ támadást hajthat végre egy nagybaltával, ha az életpontja 50%% alatt van. Ez a pusztító támadás jellemzően _%1$d-%2$d sebzést okoz,_ garantáltan eltalálja, és azonnali, ha megöl egy ellenséget.
items.weapon.melee.greatshield.ability_desc=A Párbajozó _védheti_ magát egy nagy pajzzsal, amivel teljesen semlegesíthet minden ellene irányuló fizikai vagy mágikus támadást _%d körökre_. Miután a Párbajozó blokkolt egy támadást, a visszatámadás vagy a mágia használata véget vet a védekezésnek.
items.weapon.melee.greatshield.ability_name=őr
items.weapon.melee.greatshield.desc=Ez a gigantikus fémtömeg inkább egy mozgó falra, mint pajzsra hasonlít, segíti a védelmet, de nem hagy sok helyet a támadásnak.
items.weapon.melee.greatshield.name=nagy pajzs
items.weapon.melee.greatshield.stats_desc=Ez a fegyver 0-%d sebzést blokkol. A blokkolás mértéke a fejlesztésekkel növekszik.
items.weapon.melee.greatshield.typical_ability_desc=A Párbajozó _védheti_ magát egy nagy pajzszal, amivel teljesen semlegesíthet minden ellene irányuló fizikai vagy mágikus támadást, jellemzően _%d körökre_. Miután a Párbajozó blokkolt egy támadást, a visszatámadás vagy a mágia használata véget vet a védekezésnek.
items.weapon.melee.greatshield.typical_stats_desc=Ez a fegyver jellemzően 0-%d sebzést blokkol. Ez a blokkolás a fejlesztésekkel arányos.
