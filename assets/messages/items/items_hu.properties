items.artifacts.hornofplenty.ac_store=BOLT
items.artifacts.hornofplenty.desc=Ebbe a kürtbe nem lehet belefújni, ehelyett úgy tűnik, hogy feltöltődik étellel, ahogy kalandozol és tapasztalatot szerzel. Minden egyes töltetet külön-külön is elfogyaszthatsz nassolnivalóként, vagy ehetsz, amíg jóllaksz.
items.artifacts.hornofplenty.desc_cursed=Az elátkozott szarv hozzád kötődött, úgy tűnik, inkább a táplálékra vágyik, mintsem hogy termeljen.
items.artifacts.hornofplenty.desc_hint=Talán van mód arra, hogy a szarv erejét növeljük azáltal, hogy táplálékenergiát adunk neki.
