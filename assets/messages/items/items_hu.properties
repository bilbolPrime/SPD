items.armor.armor.excess_str=A túlzott erőd miatt _kitérőbb_ vagy ebben a páncélban.
items.armor.armor.glyph_hardened=Megkeményedett.
items.armor.armor.hardened_no_glyph=Ez a páncél _megkeményedett_, de jelenleg nincs rajta jel.
items.armor.armor.hardening_gone=Ennek a páncélnak a keménysége lekopott!
items.armor.armor.identify=Most már elég jól ismered a páncélodat ahhoz, hogy felismerd.
items.armor.armor.incompatible=Különböző típusú mágiák kölcsönhatása kitörölte a páncélról a jelet!
items.armor.armor.inscribed=egy _%s._ felirattal van ellátva.
items.armor.armor.not_cursed=Ez a páncél mentes a rosszindulatú mágiától.
items.armor.armor.probably_too_heavy=Valószínűleg ez a páncél túl nehéz neked.
items.armor.armor.seal_attached=A Harcos sérült pecsétje ehhez a páncélhoz van rögzítve. Amikor az életerejének felénél kisebb sérülést szenvedhet, _%d pajzsot_ ad neki.
items.armor.armor.seal_transfer=A Harcos feltört pecsétjét a jelenleg viselt páncéljára kell ragasztani ahhoz, hogy az a hasznára váljon. Szeretnéd automatikusan leválasztani a pecsétet a leveendő páncélról, és a felvenni kívánt páncélra ragasztani?
