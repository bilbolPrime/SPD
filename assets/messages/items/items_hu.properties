items.rings.ringofhaste.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%s%%_ értékkel növelve a mozgási sebességedet.
items.rings.ringofhaste.desc=Ez a gyűrű felgyorsítja viselője számára az idő múlását, így minden cselekedetet valamivel gyorsabban végezhet el.
items.rings.ringofhaste.name=sietség gyűrűje
