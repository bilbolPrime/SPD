items.food.blandfruit.cooked=főtt ízetlen gyümölcs
items.food.blandfruit.desc=Olyan száraz és löttyedt, talán egy másik hozzávalóval való párolás javítana az ízén.
items.food.blandfruit.desc_cooked=A gyümölcs megduzzadt az edényben töltött áztatástól, sőt, még a főzéshez használt mag tulajdonságait is magába szívta. Annak a főzetnek a hatása lesz, amelyiknek a mag megfelelt.
