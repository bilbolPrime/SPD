items.rings.ringofsharpshooting.combined_stats=A felszerelt gyűrűid egyesítik erejüket, _%1$d_-val növelve a hatékony dobófegyver szintjét, és összesen _%2$s%%_-val növelve a tartósságukat.
items.rings.ringofsharpshooting.desc=Ez a gyűrű fokozza viselője pontosságát és célzását, ami minden lövedékes fegyvert sebzőbbé és tartósabbá tesz. Egy elátkozott gyűrűnek az ellenkező hatása lesz.
