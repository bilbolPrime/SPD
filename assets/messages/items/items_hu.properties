items.rings.ringoffuror.desc=Ez a gyűrű belső dühöt kölcsönöz viselőjének, ami lehetővé teszi számára, hogy gyorsabban támadjon. Egy elátkozott gyűrű ehelyett lelassítja viselője támadási sebességét.
