items.waterskin.desc_full=A teli víztömlő energiát sugároz, talán felhasználható egy másik túlélőeszköz megáldására?
items.waterskin.desc_heal=A tömlőt jelenleg gyógyító víz tárolására használják. Minél tele van a tömlő, annál jobban meggyógyulsz, ha iszol belőle. Csak annyit fogsz inni, amennyire szükséged van.
items.waterskin.desc_water=Jelenleg a tömlőben csak némi sima ivóvíz van. Biztosan van valami a kazamatában, amit a tömlőben tárolhatnánk.
