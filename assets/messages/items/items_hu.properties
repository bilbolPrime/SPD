items.potions.potion.discover_hint=Ezt a tárgyat véletlenszerűen megtalálhatod a kazamatában, vagy alkímiával is elkészítheted.
items.potions.potion.golden=arany bájital
items.potions.potion.harmful=Ártalmas bájital!
