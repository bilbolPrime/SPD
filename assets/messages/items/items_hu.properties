items.wands.wandofblink.desc=Ezzel a pálcával a kiválasztott irányba teleportálhatsz. Élőlények és szilárd akadályok megállítják a teleportálást.
items.wands.wandofblink.name=teleportálás pálcája
items.wands.wandoffirebolt.desc=Ez a pálca mágikus tűzcsóvákat lő ki. Lángra lobbantja az éghető terepet, a talált lényt pedig megsebzi és felgyújtja.
items.wands.wandoffirebolt.name=Tűzvillám pálcája
