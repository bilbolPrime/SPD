items.rings.ringofmight.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%1$d_-val növelve az erődet és _%2$s%%_-val a maximális HP-dat.
items.rings.ringofmight.desc=Ez a gyűrű fokozza viselőjének fizikai tulajdonságait, nagyobb fizikai erőt és alkatot kölcsönöz neki. Egy elátkozott gyűrű legyengíti viselőjét.
