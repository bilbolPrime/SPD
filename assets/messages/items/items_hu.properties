items.honeypot.ac_shatter=ÖSSZETÖR
items.honeypot.desc=Ez a nagy mézesedény igazából csak mézzel van bélelve, ehelyett egy óriási méh lakozik benne! Az ilyen hatalmas méhek általában a kaptárukban maradnak, talán a cserép valami speciális csapdázó ketrec? A méh elégedettnek tűnik a cserépben a mézzel, és óvatosan zümmög rád, amikor ránézel.
