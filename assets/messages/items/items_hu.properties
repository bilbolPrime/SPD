items.rings.ringofenergy.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%s%%_ értékkel növelve a töltési sebességet.
items.rings.ringofenergy.desc=A mágikus felszerelésed gyorsabban töltődik fel az ebből a gyűrűből sugárzó arkán mezőben. Egy elátkozott gyűrű ehelyett lassítja az újratöltést.
items.rings.ringofenergy.name=energiagyűrű
items.rings.ringofenergy.stats=Viselés közben ez a gyűrű _%s%%._ értékkel növeli a pálca, az ereklye és a hősi páncél töltési sebességét.
items.rings.ringofenergy.typical_stats=Viselés közben ez a gyűrű jellemzően _%s%%._ értékkel növeli a pálca, az ereklye és a hősi páncél töltési sebességét.
items.rings.ringofenergy.upgrade_stat_name_1=Töltésnövelés
items.rings.ringofevasion.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%s%%_-val növelve a kitérésedet.
items.rings.ringofevasion.desc=Ez a gyűrű növeli az esélyedet, hogy kitérj az ellenség támadása elől.
items.rings.ringofevasion.name=kitérés gyűrűje
items.rings.ringofevasion.stats=Viselés közben ez a gyűrű _%s%%_-kal növeli a kitérési képességedet.
items.rings.ringofevasion.typical_stats=Viselés közben ez a gyűrű jellemzően _%s%%_-val növeli a kitérési képességedet.
items.rings.ringofevasion.upgrade_stat_name_1=Kitérési bónusz
items.rings.ringofforce$brawlersstance.desc=Ebben a testhelyzetben a Párbajozó szokásos támadásai egy felszerelt erőgyűrűt használnak, még akkor is, ha van fegyvere. Ezek a támadások bónusz sebzést szereznek, és továbbra is használják a fegyver fokozását és varázslatát.\n\nEnnek a testhelyzetnek a fenntartása azonban fókuszt igényel, mivel a fegyver képességeinek újratöltési sebessége 50%-kal csökken.\n\nEz a testhelyzet be- és kikapcsolható egy erőgyűrű használatával, de a töltési sebesség csökkenése egy ideig fennmarad, ha a testhelyzetet gyorsan aktiválják és deaktiválják.
items.rings.ringofforce$brawlersstance.name=verekedő álláspontja
items.rings.ringofforce.ability_desc=A Párbajozó felveheti a _verekedő állását_ ezzel a gyűrűvel, aminek következtében a szokásos támadásai mindig ezt a gyűrűt használják, még felszerelt fegyverrel is. Ezek a támadások _%1$d-%2$d sebzést okoznak_, és öröklik a fegyver varázslatát és fokozását is. Ez az állás 50%%-val lassítja a fegyver újratöltési sebességét.
items.rings.ringofforce.ability_name=verekedő álláspontja
items.rings.ringofforce.combined_stats=A felszerelt gyűrűid egyesítik erejüket, fegyver nélkül összesen _%1$d-%2$d sebzést okozva, vagy eggyel _%3$d_-val növelve a sebzést.
items.rings.ringofforce.desc=Ez a gyűrű fokozza viselője közelharci ütéseinek erejét. Ez az extra erő fegyverek viselésekor meglehetősen gyenge, de egy fegyvertelen támadás sokkal erősebb lesz. Egy elátkozott gyűrű ehelyett gyengíti viselője ütéseit.
items.rings.ringofforce.name=erőgyűrű
items.rings.ringofforce.stats=Fegyvertelenül, a jelenlegi erősségeddel ez a gyűrű _%1$d-%2$d sebzést okoz._ Felszerelt fegyverrel a gyűrű _%3$d_-val növeli a sebzést.
items.rings.ringofforce.typical_ability_desc=A Párbajozó felveheti egy _verekedő állását_ ezzel a gyűrűvel, aminek következtében a szokásos támadásai mindig ezt a gyűrűt használják, még felszerelt fegyverrel is. Ezek a támadások jellemzően _%1$d-%2$d sebzést okoznak_, és öröklik a fegyver varázslatát és fokozását is. Ez az állás 50%%-val lassítja a fegyver újratöltési sebességét.
items.rings.ringofforce.typical_stats=Fegyvertelenül, az aktuális erősségeddel ez a gyűrű jellemzően _%1$d-%2$d sebzést okoz._ Felszerelt fegyverrel ez a gyűrű jellemzően _%3$d_-val növeli a sebzést._
