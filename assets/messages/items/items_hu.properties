items.rings.ringofarcana.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%s%%_ értékkel növelve a varázslatok és a szimbólumok erejét.
items.rings.ringofarcana.desc=Ez a gyűrű fokozza a fegyvereken lévő mágikus varázslatokat és a páncélokon lévő jeleket, beleértve az átkokat is! Először az aktiválási esélyt növeli, majd a hatás erősségét, ha az aktiválási esély eléri a 100%-ot. Az átkozott gyűrű ehelyett gyengíti a varázslatokat, jeleket és átkokat.
items.rings.ringofarcana.name=arkánum gyűrű
items.rings.ringofarcana.stats=Viselés közben ez a gyűrű _%s%%._ értékkel növeli a varázslatok és a szimbólumok erejét.
items.rings.ringofarcana.typical_stats=Viselés közben ez a gyűrű jellemzően _%s%%._ értékkel növeli a varázslatok és a szimbólumok erejét.
items.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.rings.ringofelements.combined_stats=A felszerelt gyűrűid egyesítik erejüket, összesen _%s%%_ elemi ellenállást biztosítva.
items.rings.ringofelements.desc=Ez a gyűrű ellenállást ad többek között a tűzzel, az elektromossággal és a gázokkal szemben. A káros hatások időtartamát is csökkenti.
items.rings.ringofelements.name=elemek gyűrűje
