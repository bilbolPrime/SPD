items.amulet.ac_end=VÉGE A JÁTÉKNAK
items.amulet.ascent_desc=Érezni kezded Yog-Dzewa hatalmas és szörnyű erejét, ami az amulettből sugárzik. Halandóként visszamászni a kazamatába nehezebb lehet, mint gondoltad!\n\nHa folytatod az amulettet, a kazamata veszélyesebbé válik, a szintek közötti teleportálás letiltásra kerül, és csak úgy nyerheted meg a játékot, ha legyőzöd az ellenségeket, miközben felmész a kazamatába!\n\nEgyelőre itt hagyhatod az amulettet, ha a kihívás elindítása nélkül szeretnél felemelkedni, vagy aktiválhatod az amulettet a felemelkedés előtt, hogy normál módon fejezd be a játékot.
items.amulet.ascent_no=Állj meg most
items.amulet.ascent_title=Felemelkedés
items.amulet.ascent_yes=Folytatás!
items.amulet.desc=Yendor amulettje a legerősebb ereklye, amelyet az emberek vagy törpék ismernek. Csillogó kristályai hihetetlen és csodálatos erőt hordoznak.
items.amulet.desc_ascent=Az amulett eredete ismeretlen, de egyértelműen nagy hatással volt rá Yog-Dzewa ereje. Úgy tűnik, a kazamata Yog akaratának engedelmeskedik, ahogy haladsz benne, így az ellenségek sokkal több és erősebb lesz! Az amulettet már nem tudod aktiválni vagy eldobni, mintha elátkozott lenne.
items.amulet.desc_origins=Az amulett eredete ismeretlen. A történelem szerint a törpök királya azzal dicsekedett, hogy nem sokkal azelőtt fedezte fel az ereklyét, hogy a törp civilizáció minden kapcsolatot megszakított vele. Hogyan találta meg? Hogyan vette el tőle Yog-Dzewa? A kérdések talán majd máskor lesznek, most már csak az számít, hogy az amulett a tiéd!
items.amulet.discover_hint=Ezt a tárgyat a kazamata alján találod...
items.amulet.name=yendor amulettje
items.ankh.ac_bless=áldás
items.ankh.bless=Varázsvízzel áldod meg az ankh-ot.
items.ankh.desc=A halhatatlanság ősi jelképe lehetővé teszi, hogy a halál után visszatérj az életbe. Feltámadáskor minden fel nem szerelt tárgyad elvész.
items.ankh.desc_blessed=Ez az ősi halhatatlanság szimbóluma képessé tesz az életre való visszatérésre a halál után. Az ankh megáldást kapott, és most sokkal erősebb. Az Ankh feláldozza magát, hogy megmentsen téged egy halálos veszély pillanatában.
items.ankh.discover_hint=Ezt a terméket megvásárolhatja egy üzletben.
items.ankh.name=ankh
items.arcaneresin.ac_apply=JELENTKEZÉS
items.arcaneresin.apply=Gyantával vonod be a pálcádat, növelve az erejét!
items.arcaneresin.desc=Ez a finom por a lila és a fehér árnyalatai között csillog. Felerősítheti a mágikus energiákat, növelve a pálcák szintjét, amikor rájuk alkalmazzuk!\n\nUEgy pálca fejlesztése 1, 2 vagy 3 gyantaegységbe kerül a pálca kezdeti szintjétől függően. A gyanta maximum +3-mal fejlesztheti a pálcákat.\n\nA gyantafejlesztéseket azonban _felülírják más fejlesztési források_ (például a fejlesztési tekercsek), és nem érvényesek, ha egy pálcát a mágus botjába mélyesztenek.
items.arcaneresin.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.arcaneresin.level_too_high=Az a pálca túl erős ahhoz, hogy a gyanta feljavuljon.
items.arcaneresin.name=arkán gyanta
items.arcaneresin.not_enough=Nincs elég gyantád ahhoz!
items.arcaneresin.prompt=Válasszon egy pálcát
items.armor.armor$glyph.discover_hint=Véletlenszerűen találhatsz egy ilyen hatású tárgyat a kazamatában, vagy megpróbálhatod magad is alkalmazni egy tárgyra.
