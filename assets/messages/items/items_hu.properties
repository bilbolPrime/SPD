items.artifacts.driedrose.desc_no_quest=Egy szárított, érlelt rózsa, ami valahogy még mindig egyben van a kora ellenére. \n\nÚgy tűnik, van némi spirituális ereje, de most fogalmad sincs, hogyan használd.
