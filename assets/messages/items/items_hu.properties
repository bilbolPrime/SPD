items.weapon.melee.handaxe.ability_desc=A Párbajozó képes egy _erős csapást_ végrehajtani egy kézibaltával. Ez a koncentrált támadás _%1$d-%2$d sebzést_ okoz, ha meglepte az ellenséget, és 5 körre megbénítja, ami 50%%-val csökkenti a pontosságot és a kitérési esélyt. Az erős csapás mindig talál, de normál sebzést okoz, ha nem lepi meg az ellenséget.
