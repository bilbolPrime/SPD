items.potions.potion.shatter=A lombik széttörik, és a folyadék ártalmatlanul kifröccsen.
items.potions.potion.silver=ezüst bájital
items.potions.potion.sure_drink=Biztosan meg akarod inni? A legtöbb esetben az ilyen italokat az ellenségeidre kell dobnod.
items.potions.potion.sure_throw=Biztosan ki akarod dobni? A legtöbb esetben van értelme meginni.
items.potions.potion.turquoise=türkiz bájital
items.potions.potion.unknown_desc=Ebben az üvegcsében %s folyadék kavarog. Ki tudja, mi történik, ha megiszod vagy elhajítod?
items.potions.potion.yes=Igen, tudom, mit csinálok
items.potions.potionofexperience.desc=A csaták sokaságának történetmesélő élményei folyékony formává redukálódtak, ez az ital azonnal megemeli a tapasztalati szinted.
items.potions.potionofexperience.name=tapasztalatital
items.potions.potionoffrost.desc=A levegőre kerülve ez az anyag fagyos felhővé párolog. A felhővel érintkező lények helyben megfagynak, és sem mozogni, sem cselekedni nem tudnak.
items.potions.potionoffrost.name=fagyital
items.potions.potionofhaste.desc=Ennek a furcsán édes folyadéknak az ivása rövid időre hatalmas energiával tölt fel, lehetővé téve, hogy nagy sebességgel fusson.
items.potions.potionofhaste.energetic=Energikusnak érzed magad!
items.potions.potionofhaste.name=sietség bájitala
items.potions.potionofhealing.desc=Elixír, amely azonnal teljesen helyreállítja az egészségedet, és megszünteti a mérgezést.
items.potions.potionofhealing.heal=A sebeid kezdenek bezárulni.
items.potions.potionofhealing.name=gyógyító ital
items.potions.potionofinvisibility.desc=Ettől az italtól átmenetileg láthatatlanná válsz, így az ellenségeid nem látnak. Ha megtámadsz egy ellenséget, vagy pálcát, illetve tekercset használsz a szeme láttára, a hatás megszűnik.
items.potions.potionofinvisibility.invisible=Látod, hogy a kezeid láthatatlanná válnak!
items.potions.potionofinvisibility.name=láthatatlansági ital
items.potions.potionoflevitation.desc=Ez a különös folyadék a levegőbe emel, így könnyedén átsuhanhatsz a csapdák fölött. A lángok és a gázok azonban a levegőt is betöltik, ezért lebegve sem kerülheted el őket.
items.potions.potionoflevitation.float=A levegőbe szállsz!
items.potions.potionoflevitation.name=levitációs ital
items.potions.potionofliquidflame.desc=Ez a lombik egy instabil vegyületet tartalmaz, amely nyílt levegőn hevesen lángra lobban.
items.potions.potionofliquidflame.name=folyékony láng főzet
items.potions.potionofmindvision.desc=Miután megittad ezt az italt, elméd ráhangolódik a távoli lények pszichikai jeleire, lehetővé téve, hogy a falakon keresztül is érzékeld a biológiai jelenlétet. A főzet lehetővé teszi, hogy átláss a közeli falakon és ajtókon.
items.potions.potionofmindvision.name=elmelátás itala
items.potions.potionofmindvision.see_mobs=Valahogyan érezheted más lények elméjének jelenlétét!
items.potions.potionofmindvision.see_none=Valahogy érzed, hogy jelenleg egyedül vagy ezen a szinten.
items.potions.potionofparalyticgas.desc=Nyílt levegőn a lombikban lévő folyadék zsibbasztó sárga köddé párolog. Bárki, aki belélegzi a felhőt, azonnal megbénul, és a felhő eloszlása után egy ideig képtelen lesz mozogni. Ez a tárgy a távoli ellenségekre dobható, hogy a gáz hatása alatt elkapja őket.
items.potions.potionofparalyticgas.name=bénító gáz főzet
items.potions.potionofpurity.desc=Ez az anyag gyorsan semlegesíti a hatóterületén lévő összes káros gázt. Megivása átmeneti védelmet ad az ilyen gázok ellen.
items.potions.potionofpurity.freshness=Szokatlan frissességet érzel a levegőben.
items.potions.potionofpurity.name=tisztító ital
items.potions.potionofpurity.protected=Egy védőfólia vesz körül!
items.potions.potionofstrength.desc=Ez az erős folyadék átjárja az izmaidat, és tartósan egy ponttal növeli az erődet.
items.potions.potionofstrength.msg=Újdonsült erő áramlik át a testeden, most már %d erőd van!
items.potions.potionofstrength.name=erőital
items.potions.potionoftoxicgas.desc=A nyomás alatt álló üveg kinyitása vagy összetörése a tartalmát halálos, mérgező zöld gázfelhővé robbantja fel. Dönthetsz úgy is, hogy ezt a főzetet távoli ellenségekre dobod, ahelyett, hogy kézzel nyitnád ki.
items.potions.potionoftoxicgas.name=mérgező gáz főzet
items.quest.ceremonialcandle.desc=Egy sor gyertya, melyeket használat során megolvasztottak és összeforrtak.\n\nEgymagukban értéktelenek, de más gyertyákkal együtt, mintázatban használva, az energiát egy idéző rituáléhoz tudják összpontosítani.
items.quest.ceremonialcandle.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
items.quest.ceremonialcandle.name=ünnepi gyertya
items.quest.corpsedust.chill=Borzongás fut végig a gerinceden.
items.quest.corpsedust.desc=A hullaporból álló gömb kívülről nem különbözik egy átlagos porgömbtől. De érezni lehet benne egy rosszindulatú energia megbúvását.Jó ötlet lenne mielőbb megszabadulni tőle.
items.quest.corpsedust.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
items.quest.corpsedust.name=holttestpor
items.quest.darkgold.desc=Ezt a fémet nem a színe miatt nevezik sötétnek (nem különbözik a normál aranytól), hanem azért, mert napfény alatt megolvad, így a felszínen használhatatlanná válik.
items.quest.darkgold.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
items.quest.darkgold.name=sötét aranyérc
items.quest.darkgold.you_now_have=Most már van %d sötétaranyérced.
items.quest.dwarftoken.desc=Sok törpe és néhány nagyobb teremtményük hordoz ilyen apró, ismeretlen célú fémdarabokat. Talán ékszerek, vagy valamiféle azonosító okmány. A törpök különös népség.
items.quest.dwarftoken.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
items.quest.dwarftoken.name=törpe zseton
items.quest.embers.desc=Különleges parázs, amelyet csak fiatal tűzelementálokból lehet kinyerni. Hőenergiát sugároznak.
items.quest.embers.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
items.quest.embers.name=elemi parázs
items.quest.escapecrystal.ac_use=HASZNÁLAT
items.quest.escapecrystal.desc=Egy vékony mágikus varázsigekristály, ami látszólag teleportációs mágiát tartalmaz. A kristályt bármikor használhatod a törp kripta elhagyására, de nem fogsz tudni magaddal vinni semmit!
items.quest.escapecrystal.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
items.quest.escapecrystal.name=menekülési kristály
items.quest.gooblob.desc=Egy remegő ragacspamacs, ami levált a ragacsról, ahogy az meghalt. Majdnem olyan, mint egy nagy zselégolyó, bár megenni nem mernéd.\n\nÖnmagában semmit sem csinál, de bizonyos bájitalokkal vagy egy bombával kombinálva hasznos lehet. Legalábbis megfelelő mennyiségű energiává kellene alakulnia.
items.quest.gooblob.discover_hint=Ezt a tárgyat bizonyos ellenfelektől leejtve szerezheted meg.
items.quest.gooblob.name=ragacsfolt
items.quest.metalshard.desc=Egy rozsdás, elátkozott fémszilánk, ami letört a DM-300-ról, amikor az megsemmisült. Érezni lehet benne egy inaktív, rosszindulatú mágiát.\n\nÖnmagában semmit sem tesz, de bizonyos tekercsekkel vagy egy bombával kombinálva hasznos lehet. Legalábbis megfelelő mennyiségű energiává kellene alakulnia.
items.quest.metalshard.discover_hint=Ezt a tárgyat bizonyos ellenfelektől leejtve szerezheted meg.
items.quest.metalshard.name=elátkozott fémszilánk
items.quest.pickaxe.ability_desc=A Párbajozó _szúrhat_ egy ellenfelet csákánnyal. Ez garantáltan eltalál, 3 körre sebezhetővé tesz, és _%1$d-%2$d sebzést_ okoz a merev bőrű ellenfeleknek.
items.quest.pickaxe.ability_name=átszúr
items.quest.pickaxe.desc=Ez egy masszív és nehéz eszköz sziklák töréséhez. Nem kell csákányt használnod a bányászáshoz, de szükség esetén valószínűleg fegyverként is használható.
items.quest.pickaxe.discover_hint=Ezt a tárgyat egy adott küldetés során találhatod meg.
items.quest.pickaxe.name=csákány
items.quest.pickaxe.upgrade_ability_stat_name=Képességkárosodás
items.quest.ratskull.desc=Meglepően nagy patkánykoponya. Remek vadásztrófea lehetne belőle, ha lenne egy fal, amire fel lehetne akasztani.
items.quest.ratskull.name=óriás patkánykoponya
items.remains.bowfragment.desc=Ez a törött fadarab egykor egy elveszett Vadásznő szellemíjának része volt. Még mindig érezni lehet egy kis természeti energiát a darabban, felhasználhatod arra, hogy magas füvet növessz magad köré. Ez azonban elpusztítja a darabot.
items.remains.bowfragment.name=íjtöredék
items.remains.brokenhilt.desc=Ez a törött markolat úgy néz ki, mintha egy legyőzött párbajozó fegyveréből származna. Még érzel egy kis harci erőt a markolatban, amit felhasználhatsz, hogy egy kis bónusz sebzést szerezz a következő két közelharci találatodnál. Ez azonban megsemmisíti a markolatot.
items.remains.brokenhilt.name=törött markolat
items.remains.brokenstaff.desc=Ennek a mágusnak a botja kettétört, miután tulajdonosa meghalt. Még mindig érzel némi mágikus energiát a botban, amit felhasználhatsz arra, hogy egy kis töltést adj a pálcáidnak. Ez azonban elpusztítja a botot.
items.remains.brokenstaff.name=törött személyzet
items.remains.cloakscrap.desc=Ez az áttetsző anyagdarab úgy néz ki, mintha egy elhunyt Zsivány árnyékköpenyéből származna. Még mindig érezni lehet benne egy kis misztikus energiát, amit felhasználhatsz arra, hogy egy kis töltésnövelést adj a tárgyaidnak. Ez azonban tönkreteszi az anyagot.
items.remains.cloakscrap.name=szövetdarab
items.remains.remainsitem.ac_use=HASZNÁLAT
items.remains.remainsitem.discover_hint=Ezt a tárgyat egy korábbi elveszett menetelésből származó adott hős maradványaiban találhatod meg.
items.remains.sealshard.desc=Ezek az apró vörös viaszszilánkok úgy néznek ki, mintha egy elesett harcos pecsétjéből származnának. Még mindig érzed, hogy egy kis akaraterő kapaszkodik a pecsétbe, használhatod, hogy egy kis védelmet nyújts magadnak. Ez azonban elpusztítja a pecsétszilánkokat.
items.remains.sealshard.name=fókadarabok
items.remains.tornpage.desc=Ez az oldal úgy néz ki, mintha egy lejárt szavatosságú pap szent könyvéből tépték volna ki. Még mindig tapad hozzá egy kis isteni energia, amit felhasználhatsz egy kis életerő visszaszerzésére. Ez azonban megsemmisíti a tépett oldalt.
items.remains.tornpage.name=szakadt oldal
