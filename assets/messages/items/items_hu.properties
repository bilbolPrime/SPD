items.weapon.curses.explosive.elestrike_desc=Egy robbanó átokkal ellátott elementális csapás 50% esélyt ad arra, hogy robbanást okozzon egy véletlenszerű ellenfélen a hatótávolságon belül.
items.weapon.curses.explosive.hot=Forró!
