items.artifacts.cloakofshadows.desc=Egy felbecsülhetetlen értékű varázspálca, melyet sok évvel ezelőtt lopott el a királyi fegyvertárból a Zsivány. Viseléskor rövid időre teljesen láthatatlanná válhat. \n\n Minél többet használják a köpenyt, annál erősebbé válik, lehetővé téve a Zsivány számára, hogy gyakrabban és hosszabb ideig láthatatlanná váljon.
