items.food.blandfruit$chunks.desc=A zamatos gyümölcs az ütés hatására felrobbant, élettelen darabokat hagyva maga után.\n\nNémi kosz ellenére ezek a nagy darab főtt zamatos gyümölcs tökéletesen ehetőnek tűnik.
