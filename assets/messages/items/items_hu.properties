items.rings.ringofherbalism.name=Gyógynövények Gyűrűje
items.rings.ringofmending.desc=Ez a gyűrű fokozza a test regenerációját, így gyorsabban visszanyered elvesztett egészségedet. A meggyengített gyűrűk lassítják vagy akár meg is állítják a természetes gyógyulást.
items.rings.ringofmending.name=regeneráció gyűrűje
items.rings.ringofpower.desc=A gyűrűből áradó energiamező megerősíti a pálcáidat. A meggyengített erőgyűrűk ehelyett gyengítik őket.
items.rings.ringofpower.name=A hatalom gyűrűje
items.rings.ringofsatiety.desc=Ezzel a gyűrűvel tovább bírod étel nélkül. A meggyengített jóllakottsággyűrűk az ellenkező hatást váltják ki.
items.rings.ringofsatiety.name=A jóllakottság gyűrűje
items.rings.ringofshadows.desc=Az ellenségek kevésbé fognak észrevenni, ha ezt a gyűrűt viseled. A leromlott árnygyűrűk riasztják azokat, akik egyébként nem vennék észre a jelenlétedet.
items.rings.ringofshadows.name=Árnyak gyűrűje
items.rings.ringofthorns.desc=A gyűrűnek nincsenek valódi tövisei, de az ellened támadó ellenség maga is elszenvedi az okozott sebzés egy részét. A gyűrű fejlesztése nem jár további előnyökkel.
items.rings.ringofthorns.name=Tövisgyűrű
items.scrolls.scrollofchallenge.desc=Amikor hangosan felolvasod, ez a tekercs egy kihívást jelentő üvöltést szabadít fel, amely felébreszti az összes szörnyet, és figyelmezteti őket az olvasó hollétére.
items.scrolls.scrollofchallenge.name=kihívás tekercs
items.scrolls.scrollofenchantment.desc=Ez a tekercs képes véletlenszerű varázslattal ellátni egy fegyvert vagy páncélt, különleges erőt adva neki.
items.scrolls.scrollofenchantment.name=varázslatos tekercs
items.scrolls.scrollofpsionicblast.desc=Ez a tekercs pusztító energiát tartalmaz, amely pszichikailag képes hatalmas sebzést okozni a látómezőben tartózkodó összes lénynek. Egy kísérő fényvillanás ideiglenesen megvakít mindenkit a hatókörben, beleértve a tekercs olvasóját is.
items.scrolls.scrollofpsionicblast.name=pszionikus robbanás tekercs
items.scrolls.scrollofwipeout.desc=Olvasd el ezt a tekercset, hogy szabadjára engedd a kazamataszellemek haragját, és megölj mindent az aktuális pályán. Nos, majdnem mindent. Néhány erősebb lényre ez talán nem lesz hatással.
