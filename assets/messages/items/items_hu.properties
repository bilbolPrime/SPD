items.keys.wornkey.desc=Ez a kulcs kopott és elszíneződött, de komolynak tűnik. Valószínűleg ki tud nyitni valami komoly ajtót a közelben.
items.keys.wornkey.name=kopott kulcs
items.kindofmisc.unequip_message=Először le kell venned az egyik tárgyat. Válassz ki egy tárgyat, amivel cserélni szeretnél.
