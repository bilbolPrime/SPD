items.food.supplyration.desc=Ezt az adagot a tolvajok céhének tagjai hagyták a kazamatában. Kifejezetten arra tervezték, hogy útközben lehessen enni, és általános lopás elleni küzdelemben segítsen. \n\nBár nem tölt el annyira, mint egy normál adag, gyorsan megehető, egy kis közvetlen gyógyítást biztosít, és visszaállítja a Zsivány árnyékköpenye töltöttségét.
items.food.supplyration.discover_hint=Ezt a tárgyat egy adott hős tehetséggel találhatod meg.
items.food.supplyration.name=ellátási adag
items.gold.desc=Egy halom aranyérme. Gyűjts össze aranyérméket, hogy később elkölthesd őket egy boltban.
