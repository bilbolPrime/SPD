items.heap.locked_chest_desc=Nem fogod tudni, mi van benne, amíg ki nem nyitod! De a kinyitásához aranykulcsra van szükséged.
items.heap.remains=A hős maradványai
items.heap.remains_desc=Ez minden, ami az egyik elődödtől megmaradt. Talán érdemes lenne átnézned, hogy vannak-e benne értéktárgyak.
