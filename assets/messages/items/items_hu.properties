items.rings.ringoftenacity.combined_stats=A felszerelt gyűrűid egyesítik erejüket, így összesen akár _%s%%_-val csökkentve az elszenvedett sebzést.
items.rings.ringoftenacity.desc=Viselve ez a gyűrű lehetővé teszi viselőjének, hogy ellenálljon a halálos csapásoknak. Minél súlyosabb sérülést szenved a viselője, annál ellenállóbb a sérülésekkel szemben. Egy elátkozott gyűrű ehelyett megkönnyíti az ellenség számára a viselő kivégzését.
