items.artifacts.lloydsbeacon.creatures=A szomszédos lények pszichikus aurája jelenleg nem teszi lehetővé a Lloyd jelzőfényének használatát.
items.artifacts.lloydsbeacon.desc=Lloyd jeladója egy bonyolult mágikus eszköz, amely teleportációs mágia irányítását adja a felhasználónak. A jeladó segítségével visszatérhet egy adott helyre, de miután feltöltötte magát, véletlenszerű teleportációs mágiát is kilőhet. Ez a mágia irányítható egy célpontra vagy magára a felhasználóra.
items.artifacts.lloydsbeacon.desc_set=Ez a jelzőfény valahol a Pixel Dungeon %d szintjén volt beállítva.
