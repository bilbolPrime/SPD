items.potions.exotic.exoticpotion.charcoal=egzotikus faszén főzet
items.potions.exotic.exoticpotion.crimson=egzotikus bíbor bájital
items.potions.exotic.exoticpotion.discover_hint=Alkímia segítségével készítheted el ezt a tárgyat.
items.potions.exotic.exoticpotion.golden=egzotikus aranyfőzet
items.potions.exotic.exoticpotion.indigo=egzotikus indigó bájital
items.potions.exotic.exoticpotion.ivory=egzotikus elefántcsont bájital
items.potions.exotic.exoticpotion.jade=egzotikus jáde bájital
items.potions.exotic.exoticpotion.magenta=egzotikus bíbor bájital
items.potions.exotic.exoticpotion.no=Nem, meggondoltam magam
items.potions.exotic.exoticpotion.silver=egzotikus ezüst főzet
items.potions.exotic.exoticpotion.turquoise=egzotikus türkiz főzet
items.potions.exotic.exoticpotion.unknown_desc=Ez a kerek lombik szemcsés, színes folyadékot tartalmaz. Úgy tűnik, idegen erre a földre, ki tudja, mit tehet, ha részegen vagy eldobva használják?
items.potions.exotic.exoticpotion.warning=Biztosan megszakítod ennek a bájitalnak a felhasználását? Úgyis el lesz fogyasztva.
items.potions.exotic.exoticpotion.yes=Igen, pozitív vagyok
items.potions.exotic.potionofcleansing$cleanse.desc=Ez a karakter átmenetileg immunis minden káros állapothatással szemben!\n\nHátralévő körök: %s.
items.potions.exotic.potionofcleansing$cleanse.name=megtisztított
items.potions.exotic.potionofcleansing.desc=Ez az erős reagens immunissá teszi az ivót minden káros állapothatással szemben néhány körre, miután kortyolgatták. A célpontra dobható, hogy megtisztítsa őket.
items.potions.exotic.potionofcleansing.name=tisztító ital
items.potions.exotic.potionofcorrosivegas.desc=A nyomás alatt álló üveg kidugózásakor vagy összetörése a tartalmát halálos, maró, rozsdaszínű gázfelhővé robbantja fel. A gáz gyorsabban terjed, mint a mérgező gáz, és halálosabb, de rövidebb ideig is tart.
items.potions.exotic.potionofcorrosivegas.name=maró gázkeverék
items.potions.exotic.potionofdivineinspiration.bonus=+2 Tehetségpont!
items.potions.exotic.potionofdivineinspiration.desc=A szent energia folyékony formává alakított ereje isteni erővel ruházza fel az ivót, két bónusz tehetségpontot adva neki egy általa választott szinten.\n\nEz a főzet csak egyszer használható minden tehetségszinten.
items.potions.exotic.potionofdivineinspiration.name=isteni ihletésű ital
items.potions.exotic.potionofdivineinspiration.no_more_points=Nem szerezhetsz több bónusz tehetségpontot.
items.potions.exotic.potionofdivineinspiration.select_tier=Válassz egy tehetségszintet, hogy két bónuszpontot szerezz. A pontok elköltéséhez fel kell oldanod a szintet.
items.potions.exotic.potionofdragonsbreath.desc=Ez a lombik egy szokatlan vegyületet tartalmaz, amely a nyállal való keveredés után rövid időn belül lángra lobban. A folyadék gyors kiköpése lehetővé teszi a felhasználó számára, hogy lángot okádjon a szájából!
items.potions.exotic.potionofdragonsbreath.name=sárkány leheletének főzetét
items.potions.exotic.potionofdragonsbreath.prompt=Válasszon egy helyet az égetéshez
items.potions.exotic.potionofearthenarmor.desc=A bénítás helyett ez a folyadék keményítő hatással van a bőrre, amely ideiglenes természetes páncéllá alakítja azt.
items.potions.exotic.potionofearthenarmor.name=földpáncélból készült főzet
items.potions.exotic.potionofmagicalsight.desc=Miután megittad, az érzékeid rövid időre hihetetlen mértékben felerősödnek, lehetővé téve, hogy 12 csempés sugarú körben átláss a falakon!
items.potions.exotic.potionofmagicalsight.name=varázslatos látvány varázsital
items.potions.exotic.potionofmastery.armor_easier=Könnyebb lesz viselni a páncélodat!
items.potions.exotic.potionofmastery.desc=A nyers erő adására nem szolgál, hanem a használó izmait egy adott tárgyhoz hangolja. Ez megkönnyíti a tárgy használatát, mintha az ivó gyakorolt volna vele és izommemóriát fejlesztett volna. A választott fegyver vagy páncél használatához 2-vel kevesebb erőre lesz szükség. Ez a főzet csak egyszer használható fel tárgyanként.
items.potions.exotic.potionofmastery.name=mesteri varázsital
items.potions.exotic.potionofmastery.prompt=Elem elsajátítása
items.potions.exotic.potionofmastery.weapon_easier=Könnyebb lesz a fegyvered forgatása!
items.potions.exotic.potionofshielding.desc=A gyógyítás helyett ez a bájital egy tartós pajzsot vetít a felhasználó teste köré, jelentős mennyiségű sebzést blokkolva.
items.potions.exotic.potionofshielding.name=pajzsmirigy-ital
items.potions.exotic.potionofshroudingfog.desc=Levegővel érintkezve a lombikban lévő folyadék sűrű, füstös ködöt képez, amely gyorsan terjed és eltakarja az ellenségeid látását.
items.potions.exotic.potionofshroudingfog.name=ködbe burkolózó ital
items.potions.exotic.potionofsnapfreeze.desc=A főzetben található vegyi anyag gyorsan reakcióba lép a levegővel, azonnal megfagy és gyökeret ereszt a hatása alatt.
items.potions.exotic.potionofsnapfreeze.name=gyorsfagyasztás főzet
items.potions.exotic.potionofstamina.desc=Ennek a furcsán édes folyadéknak az ivása hosszan tartó energialöketet ad, lehetővé téve, hogy hosszabb ideig gyorsított tempóban fusson.
items.potions.exotic.potionofstamina.name=állóképességi ital
items.potions.exotic.potionofstormclouds.desc=Ennek a bájitalnak a kidobása egy gyorsan terjedő, koncentrált gőzfelhőt hoz létre, amely lecsapódik és a környezetre ömlik. A terep nagy része vízzé alakul, a tüzes ellenfelek sebzést szenvednek, a tűz kialszik, a csapdák pedig túlterhelődnek és feltörnek.
items.potions.exotic.potionofstormclouds.name=viharfelhőkből készült ital
