items.weapon.melee.roundshield.ability_name=경비원
items.weapon.melee.roundshield.desc=이 커다란 방패는 공격을 효과적으로 막아낼 뿐만 아니라, 필요할 때는 훌륭한 무기로도 사용할 수 있습니다.
