items.amulet.ac_end=게임을 끝내다
items.amulet.ascent_desc=요그-제와의 위대하고 무시무시한 힘이 부적에서 뿜어져 나오는 것을 느끼기 시작합니다. 필멸자의 모습으로 던전을 다시 올라가는 것은 생각보다 훨씬 어려울 것입니다! 부적을 착용한 채로 계속 올라가면 던전은 더욱 위험해지고, 층간 순간이동은 불가능해지며, 오직 던전을 올라가면서 적을 물리쳐야만 승리할 수 있습니다! 이 도전을 시작하지 않고 올라가고 싶다면 부적을 여기에 두고 가거나, 올라가기 전에 부적을 활성화하여 게임을 정상적으로 종료할 수 있습니다.
items.amulet.ascent_no=지금은 멈춰주세요
items.amulet.ascent_title=승천
items.amulet.ascent_yes=계속하다!
items.amulet.desc=옌도르의 부적은 인간과 드워프 종족에게 알려진 가장 강력한 유물이다. 그 반짝이는 수정에는 믿을 수 없을 만큼 신비로운 힘이 담겨 있다.
items.amulet.desc_ascent=이 부적의 기원은 알려지지 않았지만, 요그-제와의 힘에 크게 영향을 받은 것은 분명합니다. 던전을 진행할수록 적들이 요그의 의지에 따라 더욱 많아지고 강력해지는 것을 느낄 수 있습니다! 또한, 마치 저주라도 걸린 듯 부적을 활성화하거나 버릴 수도 없게 되었습니다.
items.amulet.desc_origins=이 부적의 기원은 알려지지 않았습니다. 전승에 따르면 드워프 왕은 드워프 문명이 모든 연락을 끊기 직전에 이 유물을 발견했다고 자랑했다고 합니다. 그는 어떻게 그것을 발견했을까요? 요그-제와는 어떻게 그것을 빼앗았을까요? 어쩌면 훗날을 위한 질문일지도 모르겠습니다. 지금 중요한 것은 이 부적이 당신의 것이라는 사실입니다!
items.amulet.discover_hint=이 아이템은 던전 맨 아래쪽에서 찾을 수 있습니다...
items.amulet.name=옌도르의 부적
items.ankh.ac_bless=신을 하다
items.ankh.bless=당신은 마법의 물로 앙크를 축복합니다.
items.ankh.desc=이 고대의 불멸의 상징은 죽은 뒤 다시 살아날 힘을 줍니다. 부활할 때 착용하지 않은 아이템은 모두 잃습니다.
items.ankh.desc_blessed=이 고대 불멸의 상징은 사후에 다시 살아날 수 있는 능력을 부여합니다. 축복받은 앙크는 이제 훨씬 더 강력해졌습니다. 죽음의 위기에 처했을 때, 앙크는 당신을 구하기 위해 스스로를 희생할 것입니다.
items.ankh.discover_hint=이 물건은 가게에서 구입할 수 있습니다.
items.ankh.name=앙크
items.arcaneresin.ac_apply=적용하다
items.arcaneresin.apply=지팡이에 레진을 바르면 그 위력이 증가합니다!
items.arcaneresin.desc=이 고운 가루는 보라색과 흰색 사이에서 은은하게 빛납니다. 마법 에너지를 증폭시켜 지팡이에 바르면 지팡이의 레벨을 높여줍니다! 지팡이를 업그레이드하는 데는 지팡이의 초기 레벨에 따라 레진 1, 2, 또는 3개가 소모됩니다. 레진으로 지팡이를 최대 +3까지 업그레이드할 수 있습니다. 레진 업그레이드는 다른 업그레이드 방법(예: 업그레이드 주문서)에 의해 무효화되며, 마법사의 지팡이에 지팡이를 부여할 때는 적용되지 않습니다.
items.arcaneresin.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.arcaneresin.level_too_high=저 마법 지팡이는 너무 강력해서 레진으로는 개선될 수 없어요.
items.arcaneresin.name=신비로운 수지
items.arcaneresin.not_enough=그걸 하려면 레진이 충분하지 않아요!
items.arcaneresin.prompt=지팡이를 선택하세요
items.armor.armor$glyph.discover_hint=던전에서 무작위로 이 효과가 있는 아이템을 찾을 수도 있고, 직접 아이템에 적용해 볼 수도 있습니다.
items.armor.armor$glyph.glyph=상형문자
items.armor.armor$glyph.killed=%s가 널 죽였어...
items.armor.armor$glyph.rankings_desc=상형문자에 의해 죽임을 당하다
items.armor.armor.ac_detach=분리하다
items.armor.armor.avg_absorb=일반적으로 이 _티어-%1$d_ 갑옷은 _%2$d-%3$d 피해_를 막아주며, 제대로 사용하려면 _%4$d의 힘이 필요합니다.
items.armor.armor.curr_absorb=이 _티어-%1$d_ 갑옷은 _%2$d-%3$d 피해_를 막아주며, 제대로 사용하려면 _%4$d의 힘_이 필요합니다.
items.armor.armor.cursed=이 갑옷 안에는 사악한 마법이 도사리고 있음을 느낄 수 있다.
items.armor.armor.cursed_worn=이 갑옷은 저주받았기 때문에 당신은 그것을 벗길 수 없습니다.
items.armor.armor.defense=방어력을 강화하기 위해 증강되었습니다.
items.armor.armor.detach_seal=갑옷에서 봉인을 떼어냅니다.
items.armor.armor.equip_cursed=갑옷이 당신을 고통스럽게 조여옵니다.
items.armor.armor.evasion=회피 능력을 향상시키도록 강화되었습니다.
items.armor.armor.excess_str=당신은 엄청난 힘 덕분에 이 갑옷을 입으면 더욱 민첩하게 움직일 수 있습니다.
items.armor.armor.glyph_hardened=그것은 경화되었습니다.
items.armor.armor.hardened_no_glyph=이 갑옷은 강화되었지만, 현재 문양은 새겨져 있지 않습니다.
items.armor.armor.hardening_gone=이 갑옷의 경화 처리가 벗겨졌습니다!
items.armor.armor.identify=이제 당신은 자신의 갑옷을 알아볼 수 있을 만큼 충분히 익숙해졌습니다.
items.armor.armor.incompatible=서로 다른 종류의 마법이 상호작용하여 이 갑옷에 새겨진 문양이 지워졌습니다!
items.armor.armor.inscribed=그 위에는 _%s_라는 글자가 새겨져 있습니다.
items.armor.armor.not_cursed=이 갑옷에는 악의적인 마법이 깃들어 있지 않습니다.
items.armor.armor.probably_too_heavy=아마 이 갑옷은 당신에게 너무 무거울 겁니다.
items.armor.armor.seal_attached=전사의 깨진 봉인이 이 갑옷에 부착되어 있습니다. 체력이 절반 이하로 떨어지기 직전에 이 갑옷은 전사에게 _%d 보호막_을 부여합니다.
items.armor.armor.seal_transfer=전사의 깨진 봉인은 현재 착용 중인 갑옷에 부착해야만 효과를 발휘합니다. 벗는 갑옷에서 봉인을 자동으로 분리하여 착용하는 갑옷에 부착하시겠습니까?
items.armor.armor.seal_transfer_no=아니요
items.armor.armor.seal_transfer_yes=예
items.armor.armor.too_heavy=당신은 힘이 부족하기 때문에 이 갑옷을 착용하면 움직임, 회피 및 방어 능력이 저하될 것입니다.
items.armor.armor.weak_cursed=저주에도 불구하고, 당신은 이 갑옷을 해제할 수 있습니다.
items.armor.classarmor.ac_ability=능력 선택
items.armor.classarmor.ac_transfer=옮기다
items.armor.classarmor.charge_use=지금 이 능력을 사용하면 _%s_ 충전량이 소모됩니다.
items.armor.classarmor.discover_hint=이 아이템은 특정 영웅으로 20층 보스를 물리치면 얻을 수 있습니다.
items.armor.classarmor.low_charge=갑옷의 특수 능력을 사용하기에 충전량이 부족합니다!
items.armor.classarmor.no_ability=현재 당신의 갑옷에는 능력이 없습니다. 능력을 하나 선택하세요!
items.armor.classarmor.not_equipped=이 갑옷의 특수 능력을 사용하려면 반드시 이 갑옷을 착용해야 합니다!
items.armor.classarmor.transfer_cancel=취소
items.armor.classarmor.transfer_complete=영웅 갑옷의 속성이 이전되었습니다!
items.armor.classarmor.transfer_desc=드워프 왕의 왕관에 깃든 마법은 다른 갑옷으로 옮길 수 있습니다. 단, 이 과정에서 원래 갑옷은 파괴됩니다.
items.armor.classarmor.transfer_prompt=갑옷을 선택하세요
items.armor.classarmor.transfer_title=트랜스퍼 아머
items.armor.clericarmor.desc=천과 판금으로 된 이 갑옷을 착용한 상태에서 성직자는 특별한 능력을 사용할 수 있습니다.
items.armor.clericarmor.name=영웅의 의복
items.armor.clotharmor.desc=이 경량 갑옷은 기본적인 보호 기능을 제공합니다.
items.armor.clotharmor.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.armor.clotharmor.name=천 갑옷
items.armor.curses.antientropy.desc=반엔트로피 저주는 우주의 힘에 반하여 작용하며, 착용자에게 에너지를 끌어당기고 주변에서 에너지를 빼앗아 갑니다. 이로 인해 착용자는 순간적으로 불타오르지만, 주변의 모든 것은 얼어붙습니다!
items.armor.curses.antientropy.name=반엔트로피의 %s
items.armor.curses.bulk.desc=부피가 큰 갑옷은 더 크고 위압적으로 보이지만, 실제로 방어력이 향상된 것은 아닙니다. 오히려 크기가 커져서 출입구를 통과하기가 매우 어려워집니다.
items.armor.curses.bulk.name=대량의 %s
items.armor.curses.corrosion.desc=부식 방지막은 부식성 액체를 분출하며 파열될 수 있으며, 그 결과 주변 모든 것이 끈적끈적한 산성 액체로 뒤덮입니다.
items.armor.curses.corrosion.name=부식의 %s
items.armor.curses.displacement.desc=순간이동의 저주는 착용자가 공격받을 때 안전한 곳으로 이동시키려는 시도입니다. 하지만 너무 효과적이어서 착용자를 레벨 곳곳으로 무작위로 순간이동시켜 버립니다.
items.armor.curses.displacement.name=변위 %s
items.armor.curses.metabolism.desc=신진대사 저주는 착용자가 부상을 입었을 때 포만감을 직접적으로 건강으로 전환시켜 회복력을 높여주지만, 곧바로 기아 상태를 유발합니다.
items.armor.curses.metabolism.name=대사의 %s
items.armor.curses.multiplicity.desc=복제 마법이 걸린 갑옷에는 위험한 복제 마법이 깃들어 있다. 때로는 착용자의 거울 이미지를 만들어내지만, 공격자의 모습까지 복제해낼 가능성도 똑같이 높다!
items.armor.curses.multiplicity.name=다중성의 %s
items.armor.curses.overgrowth.desc=과성장 갑옷은 다양한 꽃 피는 식물로 뒤덮여 있습니다. 이 효과는 확실히 흥미로워 보이지만 방어에는 아무런 도움이 되지 않으며, 전투 중에 이 식물들이 무작위로 활성화됩니다!
items.armor.curses.overgrowth.name=과성장의 %s
items.armor.curses.stench.desc=악취가 나는 갑옷은 유독 가스 구름을 내뿜어 그 구름에 갇힌 모든 것을 위험에 빠뜨립니다.
items.armor.curses.stench.name=악취의 %s
items.armor.duelistarmor.desc=이 판금 갑옷과 망토를 착용하면 결투사는 특별한 능력을 사용할 수 있습니다.
items.armor.duelistarmor.name=영웅의 흉갑
items.armor.glyphs.affection.desc=이 강력한 문양은 공격자의 마음을 조종하여 일시적으로 매혹시킵니다.
items.armor.glyphs.affection.name=애정의 %s
items.armor.glyphs.antimagic.desc=이 강력한 문양은 갑옷 착용자를 물리 공격뿐 아니라 마법 공격으로부터도 보호해줍니다. 이 마법 방어력은 갑옷의 등급에 영향을 받지 않습니다.
items.armor.glyphs.antimagic.name=반마법의 %s
items.armor.glyphs.brimstone.desc=이 문양은 착용자와 소지품을 화재로부터 보호하여 화재로 인한 피해와 부정적인 영향을 완전히 무효화합니다.
items.armor.glyphs.brimstone.name=유황의 %s
items.armor.glyphs.camouflage.desc=이 문양은 착용자가 키 큰 풀숲에 녹아들어 일시적으로 투명해질 수 있도록 해줍니다.
items.armor.glyphs.camouflage.name=위장 무늬 %s
items.armor.glyphs.entanglement.desc=이 문양은 착용자 주변에 흙으로 된 갑옷을 생성하여 피해를 흡수하지만, 착용자가 움직이면 이 갑옷은 부서집니다.
items.armor.glyphs.entanglement.name=얽힘의 %s
items.armor.glyphs.flow.desc=이 문양은 착용자 주변의 물 흐름을 조작하여 착용자가 물속을 이동할 때 훨씬 빠르게 움직일 수 있도록 합니다.
items.armor.glyphs.flow.name=흐름의 %s
items.armor.glyphs.obfuscation.desc=이 문양은 착용자를 가려 탐지하기 어렵게 만듭니다.
items.armor.glyphs.obfuscation.name=난독화의 %s
items.armor.glyphs.potential.desc=이 문양은 타격 시 에너지를 축적하여, 활성화될 때 착용자의 지팡이에 에너지를 공급합니다.
items.armor.glyphs.potential.name=잠재력 %s
items.armor.glyphs.repulsion.desc=이 문양은 공격자에게 반격을 가해 그들을 날려버립니다.
items.armor.glyphs.repulsion.name=반발력의 %s
items.armor.glyphs.stone.desc=이 문양은 갑옷을 무거운 마법석으로 감싸 회피를 불가능하게 만들지만, 회피율에 비례하여 피해를 막아줍니다.
items.armor.glyphs.stone.name=%s의 돌
items.armor.glyphs.swiftness.desc=이 문양은 착용자가 적과 가까이 있지 않을 때 착용자의 속도를 향상시킵니다.
items.armor.glyphs.swiftness.name=신속함의 %s
items.armor.glyphs.thorns.desc=이 강력한 문양은 공격자에게 피해를 입히며, 착용자를 공격하는 공격자는 천천히 피를 흘리게 됩니다.
items.armor.glyphs.thorns.name=가시의 %s
items.armor.glyphs.viscosity$defereddamage.desc=피해가 즉시 발생하는 것이 아니라 시간이 지남에 따라 천천히 발생합니다.\n\n남은 지연 피해: %d.
items.armor.glyphs.viscosity$defereddamage.name=지연된 손해
items.armor.glyphs.viscosity$defereddamage.ondeath=누적된 손해가 당신을 죽였습니다...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=지연된 피해로 사망
items.armor.glyphs.viscosity.deferred=연기된 %d
items.armor.glyphs.viscosity.desc=이 문양은 착용자에게 가해진 피해를 저장하여, 한 번에 모두 적용하는 대신 천천히 적용하는 기능을 합니다.
items.armor.glyphs.viscosity.name=점도 %s
items.armor.huntressarmor.desc=이 망토를 착용하면 사냥꾼은 특별한 능력을 사용할 수 있습니다.
items.armor.huntressarmor.name=영웅의 망토
items.armor.huntressarmor.no_enemies=주변에 적이 보이지 않습니다.
items.armor.leatherarmor.desc=무두질한 몬스터 가죽으로 만든 갑옷. 천 갑옷만큼 가볍지는 않지만 더 나은 보호력을 제공합니다.
items.armor.leatherarmor.name=가죽 갑옷
items.armor.magearmor.desc=이 아름다운 예복을 입고 있으면 마법사는 특별한 능력을 사용할 수 있습니다.
items.armor.magearmor.name=영웅의 로브
items.armor.mailarmor.desc=서로 맞물리는 금속 고리는 견고하면서도 유연한 갑옷을 만들어냅니다.
items.armor.mailarmor.name=사슬 갑옷
items.armor.platearmor.desc=거대한 금속판들이 서로 연결되어 만들어진 이 슈트는, 그 엄청난 무게를 견딜 수 있을 만큼 강한 모험가에게 비할 데 없는 보호 기능을 제공합니다.
items.armor.platearmor.name=판금 갑옷
items.armor.roguearmor.desc=이 어두운 복장을 착용하면 도적은 특별한 능력을 사용할 수 있습니다.
items.armor.roguearmor.name=영웅의 복장
items.armor.scalearmor.desc=가죽 조끼에 꿰매 붙인 금속 비늘은 유연하면서도 보호력이 뛰어난 갑옷 역할을 합니다.
items.armor.scalearmor.name=비늘 갑옷
items.armor.warriorarmor.desc=이 두꺼운 판금 갑옷을 착용하면 전사는 특별한 능력을 사용할 수 있습니다.
items.armor.warriorarmor.name=영웅의 갑옷
items.artifacts.alchemiststoolkit.ac_brew=꾸미다
items.artifacts.alchemiststoolkit.ac_energize=에너지
items.artifacts.alchemiststoolkit.cursed=저주받은 도구 세트 때문에 연금술을 사용할 수 없잖아!
items.artifacts.alchemiststoolkit.desc=이 도구 키트에는 여러 가지 시약과 약초, 그리고 작은 혼합용 병이 들어 있어 이동 중에도 연금술을 할 수 있습니다. 병 안에는 액체 형태의 연금술 에너지 결정처럼 보이는 물질이 들어 있습니다.
items.artifacts.alchemiststoolkit.desc_cursed=저주받은 도구 상자가 당신 곁에 달라붙어 연금술을 사용하지 못하게 막고 있습니다.
items.artifacts.alchemiststoolkit.desc_hint=장착한 도구 세트는 경험치를 얻을수록 서서히 연금술 에너지를 생성합니다. 병 안의 혼합물에 에너지 결정을 추가하면 그 효과를 강화할 수 있을 것 같습니다.
items.artifacts.alchemiststoolkit.desc_warming=툴킷은 현재 준비 작업 중이며, 잠시 후 사용 가능해질 것입니다.
items.artifacts.alchemiststoolkit.energize_1=에너지 6: 레벨 +1
items.artifacts.alchemiststoolkit.energize_all=%1$d 에너지: +%2$d 레벨
items.artifacts.alchemiststoolkit.energize_desc=에너지 크리스탈 6개를 모으면 툴킷이 레벨을 올릴 수 있을 만큼 충분한 에너지를 얻게 되며, 레벨이 올라갈수록 툴킷의 에너지 생성 속도와 예열 속도가 빨라집니다. 얼마나 많은 에너지를 사용하시겠습니까?
items.artifacts.alchemiststoolkit.name=연금술사의 도구 세트
items.artifacts.alchemiststoolkit.need_energy=그러려면 최소 6의 에너지가 필요합니다.
items.artifacts.alchemiststoolkit.not_ready=당신의 도구 세트는 아직 예열이 끝나지 않았습니다.
items.artifacts.artifact.cannot_wear_two=같은 장신구를 두 개 착용할 수 없습니다.
items.artifacts.artifact.curse_known=그 유물 안에는 사악한 마법이 도사리고 있음을 느낄 수 있다.
items.artifacts.artifact.equip_cursed=그 유물은 고통스럽게도 당신에게 얽매입니다.
items.artifacts.artifact.need_to_equip=그러려면 유물을 장착해야 합니다.
items.artifacts.artifact.not_cursed=이 유물에는 악의적인 마법이 깃들어 있지 않습니다.
items.artifacts.capeofthorns$thorns.desc=당신의 망토가 에너지를 발산하며, 당신을 반사력의 장으로 감싸고 있습니다! 가시 효과가 활성화된 동안 당신이 받는 모든 피해가 감소합니다. 또한, 공격자가 당신 바로 옆에 있을 경우, 감소된 피해량이 공격자에게 되돌려집니다. 가시 효과 지속 시간: 0턴.
items.artifacts.capeofthorns$thorns.inert=당신의 망토는 다시 움직이지 않게 됩니다.
items.artifacts.capeofthorns$thorns.levelup=망토가 점점 더 튼튼해집니다!
items.artifacts.capeofthorns$thorns.name=가시
items.artifacts.capeofthorns$thorns.radiating=망토에서 에너지가 뿜어져 나오기 시작하고, 보호받는 느낌이 듭니다!
items.artifacts.capeofthorns.desc=DM-300의 부서진 금속 조각들이 뭉쳐 단단한 망토를 형성했다. 이 망토는 깊은 에너지를 저장하고 있는 듯하며, 어쩌면 DM-300의 힘 일부를 지니고 있을지도 모른다.
items.artifacts.capeofthorns.desc_active=망토에서 저장된 에너지가 방출되는 듯하며, 보호의 기운이 뿜어져 나오고 있다.
items.artifacts.capeofthorns.desc_inactive=망토는 어깨에 묵직하게 걸쳐져 든든한 느낌을 주며, 마치 당신이 입는 피해로부터 에너지를 얻는 듯하다.
items.artifacts.capeofthorns.name=가시 망토
items.artifacts.chaliceofblood.ac_prick=찌르기
items.artifacts.chaliceofblood.desc=이 반짝이는 은빛 성배는 테두리에 날카로운 보석이 특이하게 장식되어 있다.
items.artifacts.chaliceofblood.desc_1=성배를 손에 쥐는 순간, 날카로운 보석에 찔리고 싶은 이상한 충동이 느껴진다.
items.artifacts.chaliceofblood.desc_2=당신의 피가 성배에 고이면서, 성배가 당신에게 생명 에너지를 공급하여 자연적인 건강 회복력을 증진시키는 것을 미묘하게 느낄 수 있습니다. 아플 것을 알면서도 여전히 성배에 손을 베고 싶어집니다.
items.artifacts.chaliceofblood.desc_3=성배는 당신의 생명 정수로 가득 차 있습니다. 성배가 당신에게 생명 에너지를 되돌려주는 것을 느낄 수 있습니다.
items.artifacts.chaliceofblood.desc_cursed=저주받은 성배가 당신의 손에 묶여, 당신의 체력 회복 능력을 저해하고 있습니다.
items.artifacts.chaliceofblood.name=피의 성배
items.artifacts.chaliceofblood.no=아니요, 마음을 바꿨어요.
items.artifacts.chaliceofblood.ondeath=성배는 당신의 생명력을 완전히 빨아들입니다...
items.artifacts.chaliceofblood.onprick=바늘에 찔리면 생명의 정수가 성배 속으로 흘러들어간다.
items.artifacts.chaliceofblood.prick_warn=성배를 사용할 때마다 생명력이 더 많이 소모되지만, 그 대신 자연적인 체력 회복력이 더욱 향상됩니다. 현재 자신을 찌르면 _%1$d-%2$d의 피해를 입습니다_. 이 피해는 _물리적 및 마법적 방어 또는 피해 감소_로 줄일 수 있습니다. 피해 감소 효과를 고려하지 않을 경우, 현재 자신을 찌르면 _%3$s%% 확률_로 생명력이 완전히 소모됩니다. 성배에 더 많은 생명력을 바치시겠습니까?
items.artifacts.chaliceofblood.yes=네, 제가 뭘 하고 있는지 알고 있습니다.
items.artifacts.cloakofshadows$cloakstealth.desc=그림자 망토는 당신을 감싸는 동안 투명하게 만들어 줍니다. 망토가 해제되거나 충전량이 소진될 때까지 투명 상태가 유지됩니다. 투명 상태인 동안 적들은 당신을 공격하거나 추적할 수 없습니다. 물리 공격과 마법 효과(두루마리나 지팡이 등)는 투명 상태를 즉시 해제합니다. 충전될 때까지 턴이 반복됩니다. 사용: %d.
items.artifacts.cloakofshadows$cloakstealth.levelup=당신의 망토가 더욱 강해집니다!
items.artifacts.cloakofshadows$cloakstealth.name=망토를 두른
items.artifacts.cloakofshadows$cloakstealth.no_charge=망토의 에너지가 다 떨어졌습니다.
items.artifacts.cloakofshadows.ac_stealth=몰래 하기
items.artifacts.cloakofshadows.cooldown=망토를 재충전하려면 %d 라운드가 더 필요합니다.
items.artifacts.cloakofshadows.cursed=저주받은 망토는 사용할 수 없습니다.
items.artifacts.cloakofshadows.desc=수년 전 도적이 왕실 무기고에서 훔쳐낸 값비싼 마법 망토. 이 망토를 입으면 짧은 시간 동안 완전히 투명해질 수 있다. 망토를 많이 사용할수록 더욱 강력해져서 도적은 더 자주, 더 오랫동안 투명해질 수 있게 된다.
items.artifacts.cloakofshadows.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.artifacts.cloakofshadows.name=그림자의 망토
items.artifacts.cloakofshadows.no_charge=망토가 아직 충분히 충전되지 않아 사용할 수 없습니다.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=어떻게 살아남았어요?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=나도 저런 거 하나 갖고 싶다...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=어머나! 아직 살아계셨군요!
items.artifacts.driedrose$ghosthero.def_verb=피했다
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=미안해... 행운을 빌어...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=나 없이 마무리해...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=아니요... 못해요...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=행운을 빌어요...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=피곤해... 지금은...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=나는 돌아오겠다...
items.artifacts.driedrose$ghosthero.desc=연약해 보이는, 신비로운 형체가 인간의 모습을 하고 있다. 그들의 힘은 당신이 가진 장미와 연결되어 있는 듯하다. 이 유령은 별것 아닌 것처럼 보일지 모르지만, 이곳에서 당신의 유일한 진정한 친구인 것 같다.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=왜 이런 일이 벌어지는 거지? 우리는 성공했다고 생각했는데?
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=저것이 어떻게 여전히 이 세상에 영향을 미칠 수 있는 걸까?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=당신이 그 부적을 어떻게 사용하는지 잘 알고 있기를 바랍니다.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=아직 끝난 건 아닌 것 같네요.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=우리는 이미 여기까지 왔으니, 끝낼 수 있어!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=조금만 더 가면 여기서 나갈 수 있어!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=아주 오래전부터 인간이나 드워프는 이곳에 오지 않았습니다.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=드워프들이 금광을 버리게 된 이유는 무엇일까요?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=이곳의 금이 표면적으로는 쓸모없다는 게 참 안타깝네요.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=이곳의 생물들은 하수도에서처럼 기괴한 모습을 하고 있다.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=이곳의 박쥐들조차도 피에 굶주려 있다.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=채굴 장비의 흔적이 전혀 없는데, 드워프들이 전부 되찾아간 건가?
items.artifacts.driedrose$ghosthero.dialogue_city_1=드워프들은 근면했지만 탐욕스러웠다.
items.artifacts.driedrose$ghosthero.dialogue_city_2=그렇게 드워프의 대도시는 정말로 함락되었다.
items.artifacts.driedrose$ghosthero.dialogue_city_3=지구 표면이 절대 이곳처럼 되지 않기를 바랍니다.
items.artifacts.driedrose$ghosthero.dialogue_city_4=드워프들은 원래 그렇게 창백해 보이면 안 돼요.
items.artifacts.driedrose$ghosthero.dialogue_city_5=난쟁이들이 더 나쁜지, 아니면 그들이 만든 것들이 더 나쁜지 모르겠어.
items.artifacts.driedrose$ghosthero.dialogue_city_6=드워프들도 이제는 생각 없는 괴물이 된 것 같군요.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=여기는 어디죠?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=이곳은 정말 무서워요...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=드워프들은 도대체 무슨 생각을 하고 이렇게 권력을 가지고 장난을 치는 걸까?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=이곳의 괴물들은 마치 다른 세상에서 온 것 같아. 도대체 어디서 온 걸까?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=느껴지세요? 마치 누군가 우리를 지켜보는 것 같아요.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=다행히 손전등이 있네요, 여기는 너무 어두워요!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=이곳에 대해 안 좋은 이야기를 많이 들었어요.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=이곳은 감옥이라기보다는 지하 감옥에 더 가까웠다.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=이곳이 버려졌을 때 무슨 일이 벌어졌을지 상상도 안 가네요.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=죄수들과 간수들 모두 괴물로 변한 것 같습니다.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=이 모든 해골들의 원인은 무엇일까요?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=이 사람들은 이렇게 비극적인 최후를 맞이할 필요가 없었는데...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=이 하수도는 예전에는 안전했고, 사람들은 겨울에도 여기서 생활하곤 했습니다.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=경비 순찰대는 어떻게 됐을까? 포기한 걸까?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=지상에 가족들이 있는데, 모두 무사하길 바랍니다.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=경비병들은 이 괴물들을 물리치지 못했지만, 우리는 할 수 있을지도 몰라.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=하수도조차 이렇게 위험하다면, 그 아래는 어떨지 정말 궁금하네요...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=이 쥐와 게들이 이렇게 크게 자란 원인은 무엇일까요?
items.artifacts.driedrose$ghosthero.direct_prompt=어떻게 해야 할까요?
items.artifacts.driedrose$ghosthero.directed_attack_1=좋아요, 그럼 제가 그 문제를 해결해 보겠습니다.
items.artifacts.driedrose$ghosthero.directed_attack_2=저거 제가 살게요.
items.artifacts.driedrose$ghosthero.directed_attack_3=매력적인...
items.artifacts.driedrose$ghosthero.directed_attack_4=자, 잡아보자!
items.artifacts.driedrose$ghosthero.directed_attack_5=저거 제가 가지고 있어요.
items.artifacts.driedrose$ghosthero.directed_follow_1=알겠습니다, 따라가겠습니다.
items.artifacts.driedrose$ghosthero.directed_follow_2=제가 뒤따라가겠습니다.
items.artifacts.driedrose$ghosthero.directed_follow_3=당신을 따라가고 있습니다...
items.artifacts.driedrose$ghosthero.directed_follow_4=좋아, 가자!
items.artifacts.driedrose$ghosthero.directed_follow_5=내가 네 든든한 지원군이야.
items.artifacts.driedrose$ghosthero.directed_position_1=알겠습니다, 그 입장을 고수하겠습니다.
items.artifacts.driedrose$ghosthero.directed_position_2=제가 가서 방어하겠습니다.
items.artifacts.driedrose$ghosthero.directed_position_3=재배치 중...
items.artifacts.driedrose$ghosthero.directed_position_4=가는 중이에요!
items.artifacts.driedrose$ghosthero.directed_position_5=저는 그쪽으로 가겠습니다.
items.artifacts.driedrose$ghosthero.discover_hint=이 캐릭터는 특정 유물을 통해 찾을 수 있습니다.
items.artifacts.driedrose$ghosthero.hello=안녕하세요, %s님.
items.artifacts.driedrose$ghosthero.introduce=내 영혼은 이 장미에 묶여 있어요. 이 장미는 제게 너무나 소중했고, 지상에 남겨두고 온 사랑하는 이가 준 선물이었죠. 그에게 돌아갈 수는 없지만, 당신 덕분에 제 여정을 마무리할 두 번째 기회를 얻었어요. 제가 할 수 있게 되면 당신의 부름에 응답하고 함께 싸울 거예요. 당신이 이 장미를 가지고 있는 한, 저는 당신의 목소리를 들을 수 있어요. 그러니 당신은 이 장미를 통해 멀리서도 저를 인도해 주세요. 제가 실패한 곳에서 당신은 성공하길 바라요...
items.artifacts.driedrose$ghosthero.name=슬픈 유령
items.artifacts.driedrose$ghosthero.player_killed_1=아니요!...
items.artifacts.driedrose$ghosthero.player_killed_2=난 그들을 도울 수 없었어...
items.artifacts.driedrose$ghosthero.player_killed_3=이런 건 아니야...
items.artifacts.driedrose$ghosthero.seen_dm300_1=침입자를 죽이는 채굴 기계를 만들 수 있는 종족은 드워프뿐이다.
items.artifacts.driedrose$ghosthero.seen_dm300_2=저거 엄청 크네...
items.artifacts.driedrose$ghosthero.seen_dm300_3=이 기계는 어떻게 이렇게 오랫동안 활동을 유지해 온 걸까요?
items.artifacts.driedrose$ghosthero.seen_goo_1=구를 조심하세요!
items.artifacts.driedrose$ghosthero.seen_goo_2=내 친구들 중 많은 수가 이 병으로 죽었어, 이제 복수할 때다!
items.artifacts.driedrose$ghosthero.seen_goo_3=저런 끔찍한 존재는 절대 살아남게 놔둘 수 없다!
items.artifacts.driedrose$ghosthero.seen_king_1=권력이 부패를 낳는다고 말할 때, 바로 이런 의미입니다.
items.artifacts.driedrose$ghosthero.seen_king_2=그는 이제 왕이라기보다는 리치에 가깝다.
items.artifacts.driedrose$ghosthero.seen_king_3=드워프들은 죽어서도 주인에게 복종한다.
items.artifacts.driedrose$ghosthero.seen_tengu_1=남은 죄수는 단 한 명, 바로 흉악한 암살자다. 당연하지...
items.artifacts.driedrose$ghosthero.seen_tengu_2=그가 우리를 함정에 빠뜨렸어!
items.artifacts.driedrose$ghosthero.seen_tengu_3=그 가면 때문에 끔찍한 이야기를 많이 들었어요...
items.artifacts.driedrose$ghosthero.seen_yog_1=어머, 이거 안 좋은 징조네요.
items.artifacts.driedrose$ghosthero.seen_yog_2=신은 저렇게 생긴 건가?
items.artifacts.driedrose$ghosthero.seen_yog_3=이건 아플 거야...
items.artifacts.driedrose$petal.desc=연약하고 말라버린 꽃잎 하나가 어떻게든 이 깊은 지하 감옥까지 살아남았다.
items.artifacts.driedrose$petal.levelup=장미에 꽃잎을 더하는 거예요.
items.artifacts.driedrose$petal.maxlevel=장미가 완성되었습니다!
items.artifacts.driedrose$petal.name=말린 꽃잎
items.artifacts.driedrose$petal.no_room=이 꽃잎이 들어갈 자리가 없으니 버립니다.
items.artifacts.driedrose$petal.no_rose=당신에게는 이 꽃잎을 붙일 장미가 없습니다.
items.artifacts.driedrose$wndghosthero.armor_prompt=갑옷을 선택하세요
items.artifacts.driedrose$wndghosthero.cant_cursed=유령은 저주받지 않았다고 확신하는 장비만 사용할 수 있습니다.
items.artifacts.driedrose$wndghosthero.cant_strength=그 유령은 그걸 사용할 만큼 강하지 않아.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=유령은 그걸 사용할 만큼 강하지 않을지도 몰라.
items.artifacts.driedrose$wndghosthero.cant_unique=유령은 고유 아이템을 사용할 수 없습니다.
items.artifacts.driedrose$wndghosthero.desc=유령은 스스로는 약하지만, 무기와 갑옷을 장착할 수 있을 만큼 형태가 견고합니다. 유령은 당신처럼 이러한 아이템을 사용할 수 있습니다. 현재 유령은 최대 _%d_의 힘을 요구하는 아이템을 장착할 수 있습니다.
items.artifacts.driedrose$wndghosthero.title=고스트의 장비
items.artifacts.driedrose$wndghosthero.weapon_prompt=무기를 선택하세요
items.artifacts.driedrose.ac_direct=직접
items.artifacts.driedrose.ac_outfit=차림새
items.artifacts.driedrose.ac_summon=소환하다
items.artifacts.driedrose.charged=장미가 완전히 충전되었습니다!
items.artifacts.driedrose.cursed=저주받은 장미는 사용할 수 없습니다.
items.artifacts.driedrose.desc=이것이 유령이 사라지기 전에 언급했던 그 장미인가요? 어떤 영적인 힘을 지닌 것 같은데, 어쩌면 사라진 전사의 에너지를 끌어내는 데 사용할 수 있을지도 몰라요.
items.artifacts.driedrose.desc_armor=고스트의 갑옷: %s
items.artifacts.driedrose.desc_cursed=저주받은 장미가 당신의 손에 묶여 있고, 섬뜩할 정도로 차갑게 느껴집니다.
items.artifacts.driedrose.desc_hint=꽃잎 몇 장이 떨어져 나간 것 같습니다. 떨어진 꽃잎을 다시 붙이면 장미가 더 튼튼해질지도 모르겠네요.
items.artifacts.driedrose.desc_no_quest=말라버린 오래된 장미꽃잎이 신기하게도 오랜 세월에도 불구하고 여전히 형태를 유지하고 있다. 마치 어떤 영적인 힘을 지닌 듯하지만, 당신은 지금 당장 그 힘을 어떻게 사용해야 할지 전혀 모른다.
items.artifacts.driedrose.desc_strength=고스트의 강점: %s
items.artifacts.driedrose.desc_weapon=고스트의 무기: %s
items.artifacts.driedrose.name=말린 장미
items.artifacts.driedrose.no_charge=장미가 아직 완전히 충전되지 않았습니다.
items.artifacts.driedrose.no_space=주변에 빈 공간이 없습니다.
items.artifacts.driedrose.spawned=당신은 이미 유령을 소환했습니다.
items.artifacts.etherealchains$chainsrecharge.levelup=당신의 사슬은 점점 더 강해집니다!
items.artifacts.etherealchains.ac_cast=깁스
items.artifacts.etherealchains.cant_pull=당신의 사슬로는 저 목표물을 끌어당길 수 없습니다.
items.artifacts.etherealchains.cant_reach=당신의 사슬은 거기까지 닿을 수 없어요.
items.artifacts.etherealchains.cursed=저주받은 사슬은 사용할 수 없습니다.
items.artifacts.etherealchains.desc=크지만 가벼운 이 사슬들은 영적인 에너지로 빛납니다. 이 사슬을 이용해 특정 지형으로 자신을 끌어당기거나 적을 자신에게 끌어당길 수 있습니다. 또한, 사슬의 영적인 성질 덕분에 벽을 뚫고 뻗어 나갈 수도 있습니다!
items.artifacts.etherealchains.desc_cursed=저주받은 사슬이 당신의 옆구리에 묶여 끊임없이 휘몰아치며 당신을 넘어뜨리거나 묶으려 합니다.
items.artifacts.etherealchains.desc_equipped=사슬이 당신의 옆구리에 감겨 있으며, 당신이 물리친 적들의 영력을 천천히 빨아들입니다. 각 공격은 사슬의 고리가 되며, 사슬은 정확히 한 칸씩 늘어납니다.
items.artifacts.etherealchains.does_nothing=그렇게 하면 아무 소용이 없을 거예요.
items.artifacts.etherealchains.inside_wall=사슬은 당신을 벽을 뚫고 지나갈 수는 있어도 벽 안으로 끌어당길 수는 없습니다.
items.artifacts.etherealchains.name=에테르 사슬
items.artifacts.etherealchains.no_charge=체인에 충전량이 부족합니다.
items.artifacts.etherealchains.nothing_to_grab=거기엔 잡을 만한 게 아무것도 없어.
items.artifacts.etherealchains.prompt=목표로 삼을 위치를 선택하세요.
items.artifacts.etherealchains.rooted=뿌리를 내리고 있는 한, 당신의 사슬은 당신을 끌어당길 수 없습니다.
items.artifacts.holytome.ac_cast=깁스
items.artifacts.holytome.cursed=저주받은 책은 사용할 수 없습니다.
items.artifacts.holytome.desc=성직자의 신성 마법을 집중시키는 성서입니다. 이 책을 사용하면 성직자는 다양한 마법 주문을 시전할 수 있습니다. 성서는 사용할수록 점점 더 강력해지며, 최대 사용 횟수가 늘어나고 재충전 속도가 약간 빨라집니다.
items.artifacts.holytome.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.artifacts.holytome.levelup=당신의 책이 더욱 견고해지고 있습니다!
items.artifacts.holytome.name=성서
items.artifacts.holytome.no_spell=지금은 그 주문을 시전할 수 없습니다.
items.artifacts.hornofplenty.ac_eat=먹다
items.artifacts.hornofplenty.ac_snack=간식
items.artifacts.hornofplenty.ac_store=가게
items.artifacts.hornofplenty.desc=이 뿔피리는 불어서 넣는 것이 아니라, 모험을 하고 경험치를 얻을 때마다 음식이 차오르는 것처럼 보입니다. 차오른 음식은 간식처럼 하나씩 먹거나, 배가 부를 때까지 먹을 수 있습니다.
items.artifacts.hornofplenty.desc_cursed=저주받은 뿔이 당신 곁에 달라붙어, 먹이를 만들어내기보다는 빼앗아 가기만 하는 것 같습니다.
items.artifacts.hornofplenty.desc_hint=어쩌면 뿔에 음식 에너지를 공급하면 뿔의 위력을 높일 수 있는 방법이 있을지도 모릅니다.
items.artifacts.hornofplenty.eat=뿔로 음식을 먹습니다.
items.artifacts.hornofplenty.feed=뿔이 당신이 바친 음식을 먹어치웁니다.
items.artifacts.hornofplenty.full=네 뿔에 음식이 가득하구나!
items.artifacts.hornofplenty.levelup=뿔은 당신이 바친 음식을 먹어치우고 점점 강해집니다!
items.artifacts.hornofplenty.maxlevel=네 뿔은 먹을 것을 다 먹어버렸어!
items.artifacts.hornofplenty.name=풍요의 뿔
items.artifacts.hornofplenty.no_food=네 뿔에는 먹을 것이 없잖아!
items.artifacts.hornofplenty.prompt=음식을 몇 개 골라보세요
items.artifacts.hornofplenty.reject=당신의 뿔은 익히지 않은 밍밍한 과일을 거부합니다.
items.artifacts.lloydsbeacon.ac_return=반품
items.artifacts.lloydsbeacon.ac_set=세트
items.artifacts.lloydsbeacon.ac_zap=기력
items.artifacts.lloydsbeacon.creatures=주변 생명체의 정신적 기운 때문에 지금은 로이드의 신호기를 사용할 수 없습니다.
items.artifacts.lloydsbeacon.desc=로이드의 신호기는 사용자가 순간 이동 마법을 제어할 수 있게 해주는 정교한 마법 장치입니다. 신호기는 특정 위치로 돌아갈 때 사용할 수 있을 뿐 아니라, 장착 후 충전이 완료되면 무작위로 순간 이동 마법을 발산할 수도 있습니다. 이 마법은 특정 대상을 향해 사용하거나 사용자 자신에게 사용할 수 있습니다.
items.artifacts.lloydsbeacon.desc_set=이 신호기는 픽셀 던전의 %d 레벨 어딘가에 설치되었습니다.
items.artifacts.lloydsbeacon.levelup=당신의 신호가 점점 더 강해지고 있습니다!
items.artifacts.lloydsbeacon.name=로이드의 등대
items.artifacts.lloydsbeacon.no_charge=현재 신호 발신기의 에너지가 부족합니다.
items.artifacts.lloydsbeacon.preventing=이곳의 강력한 마법 기운 때문에 로이드의 신호기를 사용할 수 없습니다!
items.artifacts.lloydsbeacon.prompt=전기 충격을 가할 위치를 선택하세요.
items.artifacts.lloydsbeacon.return=로이드 비콘이 현재 위치에 성공적으로 설정되었습니다. 이제 언제든지 이곳으로 돌아오실 수 있습니다.
items.artifacts.lloydsbeacon.tele_fail=순간 이동 마법이 실패했다.
items.artifacts.masterthievesarmband.ac_steal=훔치다
items.artifacts.masterthievesarmband.cursed=저주받은 팔찌는 사용할 수 없습니다.
items.artifacts.masterthievesarmband.desc=이 보라색 벨벳 팔찌에는 거장 도둑의 표식이 새겨져 있습니다. 당신의 것은 아니지만, 이전 사용자의 것도 아니었을 겁니다.
items.artifacts.masterthievesarmband.desc_cursed=저주받은 팔찌가 당신의 손목에 채워져 있고, 어쩐 일인지 금화가 든 주머니가 서서히 가벼워지는 것 같습니다...
items.artifacts.masterthievesarmband.desc_worn=경험치를 쌓을수록 손목의 완장에 힘이 솟아오르는 것을 느낄 수 있습니다. 이 힘을 이용해 상점에서 물건을 훔치거나 적을 강탈할 수 있습니다! 적을 강탈하면 즉시 발동되어 적이 잠시 혼란에 빠지고, 그들이 가지고 있는 전리품을 획득할 기회를 얻게 됩니다! 이 능력은 방심한 적에게 더욱 효과적입니다. 같은 적을 여러 번 강탈해도 전리품을 얻을 확률이 높아지는 것은 아닙니다.
items.artifacts.masterthievesarmband.failed_steal=넌 아무것도 훔치지 못했어.
items.artifacts.masterthievesarmband.full=팔찌가 완전히 충전되었습니다!
items.artifacts.masterthievesarmband.level_up=팔찌가 점점 더 튼튼해집니다!
items.artifacts.masterthievesarmband.name=대도둑의 팔찌
items.artifacts.masterthievesarmband.no_charge=팔찌의 배터리 잔량이 부족합니다.
items.artifacts.masterthievesarmband.no_steal=저 적은 훔칠 것이 아무것도 없다.
items.artifacts.masterthievesarmband.no_target=자신에게 인접한 적을 목표로 삼아야 합니다.
items.artifacts.masterthievesarmband.prompt=공격할 적을 선택하세요
items.artifacts.masterthievesarmband.steal_shopkeeper=상점 주인에게서 직접 물건을 훔칠 수는 없습니다.
items.artifacts.masterthievesarmband.stole_item=당신은 %s라는 아이템을 훔쳤습니다.
items.artifacts.sandalsofnature.absorb_seed=신발이 씨앗을 흡수해서 더 건강해 보이는 것 같아요.
items.artifacts.sandalsofnature.ac_feed=밥을 먹이다
items.artifacts.sandalsofnature.ac_root=뿌리
items.artifacts.sandalsofnature.desc_1=처음에는 끈으로 만든 샌들처럼 보이지만, 사실은 두 개의 식물입니다! 잎이 너무 약하고 창백해 보이는데, 영양분이 필요한 것 같습니다.
items.artifacts.sandalsofnature.desc_2=신발 모양이 자라서 이제는 맞춤 구두 두 켤레에 더 가까워졌습니다. 색깔도 조금 돌아왔는데, 앞으로 더 자랄 수도 있을 것 같습니다.
items.artifacts.sandalsofnature.desc_3=식물들이 다시 자라나 이제는 나무껍질로 만든 단단한 부츠 한 켤레처럼 보입니다. 식물들은 다시 활력을 되찾은 것 같지만, 어쩌면 더 자랄 수도 있을 것입니다.
items.artifacts.sandalsofnature.desc_4=식물들은 최대 크기에 도달한 듯 보이며, 마치 갑옷으로 덮인 정강이 보호대처럼 보인다. 그 보호대는 짙은 갈색이며 매우 견고한 나무를 닮았다.
items.artifacts.sandalsofnature.desc_ability=신발은 마지막으로 먹인 씨앗의 색깔로 물결칩니다. 신발은 잠시 땅에 뿌리를 내리고 반경 3타일 이내 어디든 해당 식물의 효과를 낼 수 있습니다. 씨앗: \n, %s, \n, 필요 충전량: %d%%
items.artifacts.sandalsofnature.desc_cursed=저주받은 샌들이 자연과의 조화를 가로막고 있다.
items.artifacts.sandalsofnature.desc_hint=이 물건을 착용하면 자연과 더욱 교감하는 느낌을 받습니다.
items.artifacts.sandalsofnature.desc_seeds=당신은 신발에 %d 씨앗을 먹였습니다.
items.artifacts.sandalsofnature.levelup=신발 사이즈가 갑자기 커졌어요!
items.artifacts.sandalsofnature.low_charge=당신의 신발은 그럴 만한 에너지를 가지고 있지 않습니다.
items.artifacts.sandalsofnature.name=자연의 샌들
items.artifacts.sandalsofnature.name_1=자연의 신발
items.artifacts.sandalsofnature.name_2=자연의 부츠
items.artifacts.sandalsofnature.name_3=자연의 정강이 보호대
items.artifacts.sandalsofnature.no_effect=먼저 신발에 씨앗을 넣어줘야 합니다.
items.artifacts.sandalsofnature.out_of_range=해당 위치는 통신 범위 밖입니다.
items.artifacts.sandalsofnature.prompt=씨앗을 선택하세요
items.artifacts.sandalsofnature.prompt_target=위치를 선택하세요
items.artifacts.skeletonkey$keywall.desc=해골 열쇠로 임시 마법의 벽이 여기에 설치되었습니다.
items.artifacts.skeletonkey.ac_insert=끼워 넣다
items.artifacts.skeletonkey.crystal_charges=수정 자물쇠를 열려면 5번의 충전이 필요합니다.
items.artifacts.skeletonkey.cursed=저주받은 해골 열쇠는 사용할 수 없어요.
items.artifacts.skeletonkey.desc=머리 부분이 해골처럼 생긴 중요한 열쇠처럼 보인다. 이빨 모양이 볼 때마다 다르게 보이는 것 같다.
items.artifacts.skeletonkey.desc_cursed=저주받은 열쇠는 마치 일부러 어떤 자물쇠에도 맞지 않으려는 듯하며, 다른 열쇠를 사용하는 것조차 어렵게 만들고 있습니다(불가능한 것은 아니지만).
items.artifacts.skeletonkey.desc_worn=이 마법의 열쇠는 던전의 일반 열쇠 대신 사용할수록 힘이 강해지는 것 같습니다. 던전의 거의 모든 자물쇠에 꽂아 열거나 닫을 수 있으며, 이전에는 잠겨 있지 않았던 문까지도 열 수 있습니다. 이 열쇠는 심지어 동서남북 방향의 빈 공간에 사용하여 앞쪽의 공간을 '잠금' 상태로 만들 수도 있습니다. 그러면 3칸 너비의 단단한 벽이 생성되어 10턴 동안 유지됩니다. 벽을 잠그면 공간이 있는 경우 적을 밀어낼 수 있습니다.
items.artifacts.skeletonkey.discard=남는 열쇠는 버리세요.
items.artifacts.skeletonkey.force_lock=만능 열쇠가 없으니 자물쇠가 약해졌습니다. 당신은 간신히 자물쇠를 열 수 있었습니다.
items.artifacts.skeletonkey.gold_charges=금색 자물쇠를 열려면 2개의 충전이 필요합니다.
items.artifacts.skeletonkey.invalid_target=거기에는 잠그거나 열어야 할 것이 아무것도 없습니다.
items.artifacts.skeletonkey.iron_charges=일반 자물쇠를 열려면 1회 충전이 필요합니다.
items.artifacts.skeletonkey.levelup=당신의 만능 열쇠가 점점 더 강력해지고 있어요!
items.artifacts.skeletonkey.lock_charges=문을 잠그려면 2번 충전해야 합니다.
items.artifacts.skeletonkey.lock_no_space=캐릭터를 문 안에 가둘 수는 없어요!
items.artifacts.skeletonkey.locked_with_key=그 문은 당신의 만능 열쇠로 잠겨 있었어요.
items.artifacts.skeletonkey.name=맞쇠
items.artifacts.skeletonkey.prompt=목표를 선택하세요
items.artifacts.skeletonkey.wall_charges=임시 벽을 설치하려면 2회 충전이 필요합니다.
items.artifacts.skeletonkey.wont_open=무슨 이유인지 열쇠가 이 자물쇠에 맞지 않아요.
items.artifacts.talismanofforesight$foresight.desc=마치 보이지 않는 위험이 가까이에 있는 것처럼 매우 불안한 기분이 듭니다.
items.artifacts.talismanofforesight$foresight.name=선견
items.artifacts.talismanofforesight$foresight.uneasy=당신은 불안감을 느낍니다.
items.artifacts.talismanofforesight.ac_scry=스크라이
items.artifacts.talismanofforesight.desc=표면에 기묘한 문양이 새겨진 매끄러운 돌. 마치 주변 모든 것을 지켜보며 숨겨진 것이 없는지 살피는 듯한 느낌이 든다.
items.artifacts.talismanofforesight.desc_cursed=저주받은 부적이 당신을 강렬하게 응시하며 당신의 감각을 무디게 합니다.
items.artifacts.talismanofforesight.desc_worn=부적을 손에 쥐면 감각이 예민해지는 것을 느낄 수 있습니다. 부적은 시간이 지남에 따라, 그리고 숨겨진 문이나 함정을 발견할 때마다 서서히 에너지를 축적합니다. 부적은 에너지를 소모하여 원뿔형 범위 내에서 '투시'를 할 수 있습니다. 투시 영역 내의 모든 타일과 비밀을 드러내고, 짧은 시간 동안 적과 아이템의 위치를 보여줍니다.
items.artifacts.talismanofforesight.full_charge=당신의 부적이 완전히 충전되었습니다!
items.artifacts.talismanofforesight.levelup=당신의 부적이 더욱 강력해졌습니다!
items.artifacts.talismanofforesight.low_charge=부적을 점술에 사용하려면 최소 5%의 충전량이 필요합니다.
items.artifacts.talismanofforesight.name=예지력의 부적
items.artifacts.talismanofforesight.prompt=스캔할 위치를 선택하세요.
items.artifacts.timekeepershourglass$sandbag.desc=이 고운 모래가 든 작은 봉지는 당신의 모래시계에 딱 맞을 거예요. 그런데 가게 주인이 당신이 딱 필요한 바로 이 물건을 가지고 있다는 게 좀 이상하네요...
items.artifacts.timekeepershourglass$sandbag.levelup=모래시계에 모래를 넣으세요.
items.artifacts.timekeepershourglass$sandbag.maxlevel=당신의 모래시계에는 마법의 모래가 가득 차 있어요!
items.artifacts.timekeepershourglass$sandbag.name=마법의 모래 주머니
items.artifacts.timekeepershourglass$sandbag.no_hourglass=모래시계가 없으니 이 모래를 넣을 필요가 없겠네요.
items.artifacts.timekeepershourglass$timefreeze.desc=주변의 시간이 멈춰 즉시 행동할 수 있습니다. 이 효과는 해제하거나 모래시계의 충전량이 소진될 때까지 지속됩니다. 공격하거나 마법을 사용하면 이 효과가 해제됩니다. \n\n충전 사용까지 턴 수: %s.
items.artifacts.timekeepershourglass$timefreeze.name=시간 정지
items.artifacts.timekeepershourglass.ac_activate=활성화
items.artifacts.timekeepershourglass.cursed=저주받은 모래시계는 사용할 수 없습니다.
items.artifacts.timekeepershourglass.deactivate=시간 정지 기능을 해제합니다.
items.artifacts.timekeepershourglass.desc=이 크고 화려한 모래시계는 겉보기에는 소박해 보이지만, 정교하게 조각된 틀에서 굉장한 힘이 느껴집니다. 모래시계를 돌리며 모래가 쏟아지는 모습을 지켜보면 마치 마법에 걸린 듯한 기분이 들고, 이 마법을 이용하면 시간을 조종할 수 있지 않을까 하는 생각이 듭니다.
items.artifacts.timekeepershourglass.desc_cursed=저주받은 모래시계가 당신 옆에 묶여 있고, 당신은 그것이 시간의 흐름을 조종하려 한다는 것을 느낄 수 있습니다.
items.artifacts.timekeepershourglass.desc_hint=모래시계의 모래가 좀 빠진 것 같은데, 찾을 수만 있다면 좋을 텐데...
items.artifacts.timekeepershourglass.freeze=내 주변의 시간을 멈춰줘
items.artifacts.timekeepershourglass.name=시간 측정기의 모래시계
items.artifacts.timekeepershourglass.no_charge=모래시계가 아직 충분히 충전되지 않아 사용할 수 없습니다.
items.artifacts.timekeepershourglass.onfreeze=주변의 모든 것이 갑자기 멈춰버립니다.
items.artifacts.timekeepershourglass.onstasis=세상이 순식간에 변하는 것처럼 느껴집니다.
items.artifacts.timekeepershourglass.prompt=모래시계의 마법을 어떻게 사용하시겠습니까? 정지 상태에서는 시간이 정상적으로 흐르지만, 당신은 완전히 무적 상태가 됩니다. 한 번에 최대 2회 사용 가능합니다. 시간이 멈춘 상태에서는 마치 시간이 흐르지 않는 것처럼 움직일 수 있습니다. 모래시계를 사용하거나 공격하면 언제든지 해제할 수 있습니다.
items.artifacts.timekeepershourglass.stasis=나 자신을 정지 상태에 빠뜨렸다
items.artifacts.unstablespellbook.ac_add=추가하다
items.artifacts.unstablespellbook.ac_read=읽다
items.artifacts.unstablespellbook.blinded=앞을 볼 수 없는 상태에서는 책을 읽을 수 없습니다.
items.artifacts.unstablespellbook.cursed=저주받은 마법책으로는 아무것도 읽을 수 없다.
items.artifacts.unstablespellbook.desc=이 책은 연식을 고려하면 놀라울 정도로 상태가 좋다. 페이지를 넘길 때마다 보글보글 끓는 소리가 나며 불안정한 에너지가 솟구친다. 이 책을 읽는다면 어떤 마법이 걸릴지 아무도 모른다.
items.artifacts.unstablespellbook.desc_cursed=저주받은 책이 당신에게 얽매여 대부분의 두루마리를 사용하는 능력을 저해하고 있습니다.
items.artifacts.unstablespellbook.desc_empowered=당신이 책에 추가한 두루마리들이 강력한 힘으로 빛나고 있습니다. 추가 요금을 지불하면 이 두루마리들의 특수한 효과를 선택할 수 있습니다.
items.artifacts.unstablespellbook.desc_index=이 책은 미완성입니다. 현재 색인에서 다음과 같은 빈 페이지를 가리키고 있습니다.
items.artifacts.unstablespellbook.infuse_scroll=두루마리의 에너지를 책에 불어넣는 것입니다.
items.artifacts.unstablespellbook.name=불안정한 주문서
items.artifacts.unstablespellbook.no_charge=당신의 마법책은 현재 에너지가 고갈되었습니다.
items.artifacts.unstablespellbook.prompt=스크롤을 선택하세요
items.artifacts.unstablespellbook.read_empowered=주문서에 추가한 두루마리에 에너지가 넘쳐흐릅니다. 일반 버전 또는 특수 버전 중 하나를 선택하여 사용할 수 있습니다. 특수 버전을 선택하면 일반 버전보다 2개의 사용 횟수가 소모됩니다.
items.artifacts.unstablespellbook.unable_scroll=이 두루마리를 책에 추가할 수 없습니다.
items.artifacts.unstablespellbook.unknown_scroll=당신은 아직 이것이 어떤 종류의 두루마리인지 확신하지 못하는군요.
items.bags.bag.discover_hint=이 물건은 가게에서 구입할 수 있습니다.
items.bags.bag.name=배낭
items.bags.magicalholster.desc=이 날렵한 홀스터는 희귀한 동물의 가죽으로 만들어졌으며, 엄청난 양의 원거리 무기를 보관할 수 있는 강력한 마법을 지니고 있습니다. 홀스터에 손을 넣기만 하면 언제든 원하는 무기를 꺼낼 수 있습니다. 홀스터의 마법 덕분에 지팡이는 약간 더 빨리 충전되고, 투척 무기는 더 오래 지속됩니다.
items.bags.magicalholster.name=마법의 홀스터
items.bags.potionbandolier.desc=이 두꺼운 탄띠는 허리띠처럼 가슴에 두르며, 물약병, 물통, 액체 금속병 등을 고정할 수 있는 여러 개의 단열 끈이 달려 있습니다. 탄띠 안에 물약을 넣어두면 추위로부터 보호할 수 있습니다.
items.bags.potionbandolier.name=물약 탄띠
items.bags.scrollholder.desc=이 원통형 용기는 천문학자의 도구와 해도 등을 보관할 것 같지만, 두루마리도 쏙 들어갑니다. 옆쪽에는 마법 수정, 마법용 스타일러스, 마법 수지 등을 넣을 수 있는 작은 수납공간도 몇 개 있습니다. 이 용기는 불에 잘 타지 않는 것 같으니 안에 넣어두면 두루마리가 불에 타지 않을 겁니다.
items.bags.scrollholder.name=두루마리 보관함
items.bags.velvetpouch.desc=이 작은 벨벳 주머니에는 씨앗, 룬스톤, 연금술 재료 등 여러 작은 물건들을 보관할 수 있습니다.
items.bags.velvetpouch.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.bags.velvetpouch.name=벨벳 파우치
items.bombs.arcanebomb.desc=이 폭탄에는 신비로운 힘이 깃들어 있습니다. 이 폭탄은 구의 강화 공격과 유사한 강력한 폭발을 일으키며, 2칸 이내의 모든 대상에게 _%1$d-%2$d의 마법 피해_를 입힙니다.
items.bombs.arcanebomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.arcanebomb.name=신비로운 폭탄
items.bombs.bomb$doublebomb.desc=묵직한 흑색 화약 폭탄 두 개가 쌓여있네요. 하나는 공짜로 얻는 것 같아요!
items.bombs.bomb$doublebomb.name=폭탄 두 개
items.bombs.bomb.ac_lightthrow=조명 및 투척
items.bombs.bomb.desc=상당히 강력한 흑색 화약 폭탄입니다. 이 폭탄이 폭발하면 주변의 모든 것에 _%1$d-%2$d의 피해_를 입히고, 인접한 지형이나 물건을 파괴합니다.
items.bombs.bomb.desc_burning=폭탄의 도화선이 타들어 가고 있으니, 거리를 유지하거나 불을 끄세요!
items.bombs.bomb.desc_fuse=일단 불이 붙으면 심지가 완전히 타버리려면 몇 발의 총알이 필요할 것 같네요.
items.bombs.bomb.name=폭탄
items.bombs.bomb.ondeath=그 폭발로 당신은 죽습니다...
items.bombs.bomb.rankings_desc=폭발로 사망
items.bombs.bomb.snuff_fuse=당신은 재빨리 폭탄의 도화선을 꺼버립니다.
items.bombs.firebomb.desc=이 폭탄은 더 넓은 범위에서 폭발하도록 개조되었으며, _%1$d-%2$d의 피해를 입히고 2칸 이내에 지속적인 화염을 확산시킵니다.
items.bombs.firebomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.firebomb.name=화염병
items.bombs.flashbangbomb.desc=이 맞춤형 폭탄은 폭발 시 빛, 소리, 그리고 전기를 동반한 강력한 폭발을 일으킵니다. 폭탄 반경 2칸 이내의 모든 것은 폭발로 인해 _%1$d-%2$d의 피해_를 입고, 추가로 전기로 인해 25%%의 피해를 입으며, 10턴 동안 기절합니다.
items.bombs.flashbangbomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.flashbangbomb.name=섬광탄
items.bombs.frostbomb.desc=이 폭탄은 더 넓은 범위에서 폭발하도록 개조되었으며, _%1$d-%2$d의 피해를 입히고 2칸 이내에 지속적인 냉기 바람을 확산시킵니다.
items.bombs.frostbomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.frostbomb.name=서리 폭탄
items.bombs.holybomb.desc=이 폭탄은 폭발 시 더 넓은 범위에 성스러운 빛을 발하도록 개량되었습니다. 폭발로부터 2칸 이내의 모든 것은 _%1$d-%2$d의 피해_를 입으며, 언데드 또는 악마 적은 성스러운 빛으로 인해 추가로 50%%의 피해를 입습니다.
items.bombs.holybomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.holybomb.name=성스러운 폭탄
items.bombs.noisemaker.desc=이 특수 제작된 폭탄은 심지가 다 떨어지면 반복적으로 소음을 냅니다. 폭탄에 무언가가 닿으면 폭발하여 2칸 이내의 모든 것에 _%1$d-%2$d의 피해_를 입힙니다!
items.bombs.noisemaker.desc_burning=소음기가 째깍째깍 소리를 내고 있어. 뭔가 가까이 오면 터질 거야!
items.bombs.noisemaker.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.noisemaker.name=소음 발생기
items.bombs.regrowthbomb.desc=이 특수 폭탄은 폭발하는 대신 3칸 반경 내에 생명력을 불어넣는 액체를 뿌립니다. 폭발 범위 내에는 풀과 식물이 빠르게 자라납니다. 폭발 범위 안에 있는 자신과 아군은 마치 회복 물약을 마신 것처럼 회복됩니다.
items.bombs.regrowthbomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.regrowthbomb.name=재생 폭탄
items.bombs.shrapnelbomb.desc=이 폭탄은 DM-300의 금속 조각으로 개조되었으며, 폭발 시 파편이 사방으로 흩날리면서 폭탄 주변의 넓은 범위에 _%1$d-%2$d_의 피해를 입힙니다. 사용할 때는 어딘가 뒤에 숨는 게 좋을 겁니다...
items.bombs.shrapnelbomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.shrapnelbomb.name=파편 폭탄
items.bombs.smokebomb.desc=이 폭탄은 폭발과 동시에 짙은 가스 구름을 뿜어내도록 개조되었습니다. 폭발 시 _%1$d-%2$d의 피해를 입히고 2칸 범위 내에 안개를 확산시킵니다.
items.bombs.smokebomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.smokebomb.name=연막탄
items.bombs.woollybomb.desc=이 맞춤형 폭탄은 폭발 후 넓은 범위에 마법 양떼를 생성합니다. 폭발 시 2칸 이내의 모든 대상에게 _%1$d-%2$d의 피해_를 입힙니다. 양떼는 이동을 차단하며 매우 오랫동안 유지됩니다! 강력한 적이 주변에 있을 경우 양떼의 지속 시간이 짧아지며, 적과 상호작용하면 더 빨리 제거할 수 있습니다.
items.bombs.woollybomb.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.bombs.woollybomb.name=털복숭이 폭탄
items.brokenseal$warriorshield.desc_active=전사의 깨진 봉인은 현재 그에게 생명력에 더해 보호막을 부여하여 버틸 수 있도록 도와주고 있습니다. 보호막은 처음 발동된 후 일정 시간 동안 재사용할 수 없습니다. 이 보호막은 시간이 지나도 줄어들지 않지만, 몇 턴 동안 주변에 적이 없으면 사라집니다. 보호막이 사라지면 사용하지 않은 보호막은 재사용 대기시간을 최대 50까지 줄여줍니다. 남은 보호막: 1. 현재 재사용 대기시간: 2.
items.brokenseal$warriorshield.desc_cooldown=전사는 최근 봉인이 깨지면서 보호막을 얻었지만, 다시 보호막 효과를 누릴 수 있을 때까지 기다려야 합니다. 남은 턴:
items.brokenseal$warriorshield.desc_negative_cooldown=전사의 방패 재사용 대기시간이 현재 음수입니다. 즉, 방패가 활성화되면 재사용 대기시간이 일반적인 150턴보다 짧아집니다. 방패 재사용 대기시간은 -150턴까지 줄일 수 있으며, 이는 방패가 활성화되는 즉시 다시 사용할 수 있음을 의미합니다. (현재 재사용 대기시간: \n\n)
items.brokenseal$warriorshield.name=전사의 방패
items.brokenseal.ac_affix=부착
items.brokenseal.affix=갑옷에 인장을 붙이세요!
items.brokenseal.choose_desc=이 갑옷과 부서진 봉인에는 각각 문양이 새겨져 있습니다. 어떤 문양을 남길지 선택하세요. 갑옷 문양: \n\n 부서진 봉인 문양: %1$s\n 참고로, 현재 갑옷에 있는 문양을 선택하면 나중에 봉인에서 해당 문양을 옮길 수 없습니다.
items.brokenseal.choose_title=문양을 선택하세요
items.brokenseal.cursed_armor=그 봉인은 저주받은 갑옷에는 적용되지 않습니다.
items.brokenseal.desc=갑옷에 부착하여 용기를 상징하는 밀랍 도장입니다. 중앙에는 희미하게 보호의 룬 문자가 새겨져 있으며, 가운데가 갈라져 있습니다. 이 도장은 전사가 고향에서 가져온 기념품으로, 전투에서 승리할 수 있도록 도와줍니다. 도장을 착용하면 체력이 절반 이하로 떨어지기 직전에 즉시 보호막이 생성됩니다. 도장은 갑옷에 부착할 수 있으며, 다른 갑옷으로 옮겨 사용할 수도 있습니다. 도장이 부착된 상태에서 갑옷에 적용된 업그레이드 하나만을 함께 휴대할 수 있습니다.
items.brokenseal.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.brokenseal.inscribed=인장에는 _%s_라는 글자가 새겨져 있습니다.
items.brokenseal.name=봉인 파손
items.brokenseal.prompt=갑옷을 선택하세요
items.brokenseal.unknown_armor=먼저 그 갑옷이 저주받은 것인지 아닌지를 확인해야 합니다.
items.dewdrop.already_full=당신은 이미 건강 상태가 완벽합니다.
items.dewdrop.desc=수정처럼 맑은 이슬방울. 이곳의 신비로움 덕분에 순수한 물은 약간의 회복력을 지니고 있다.
items.dewdrop.name=이슬 방울
items.dewvial.ac_drink=마시기
items.dewvial.auto_drink=상처를 치료하기 위해 이슬병을 비웠다.
items.dewvial.collected=이슬병에 이슬 한 방울을 모았다.
items.dewvial.desc=남은 이슬을 담아 두었다가 나중에 마실 수 있는 작은 병이다. 병이 가득 차 있으면 죽음의 위기에 처했을 때 이슬을 자동으로 마신다.
items.dewvial.empty=이슬병이 비어 있다!
items.dewvial.full=이슬병이 가득 찼다!
items.dewvial.name=이슬병
items.energycrystal.desc=연금술적 에너지로 가득 찬 작은 마법 수정들의 모음입니다. 이 수정들은 연금술 레시피에서 가장 흔한 재료이며, 소모품을 분해하여 연금술 솥에서 만들 수 있습니다.
items.energycrystal.name=에너지 결정
items.equipableitem.ac_equip=갖추게 하다
items.equipableitem.ac_unequip=장비 해제
items.equipableitem.curse_detected=아이템을 장착하기 직전에 그 아이템이 저주받았다는 느낌이 듭니다!
items.equipableitem.unequip_cursed=저주받은 아이템은 제거할 수 없어요!
items.food.berry.desc=이 작은 열매는 사냥꾼이 던전의 식물 사이에서 발견했습니다. 빨리 먹을 수 있고, 포만감을 약간 회복시켜주며, 유용한 씨앗이 들어있을지도 모릅니다!
items.food.berry.discover_hint=이 아이템은 특정 영웅 특성을 사용하여 획득할 수 있습니다.
items.food.berry.eat_msg=그 열매 맛있었어!
items.food.berry.name=던전 베리
items.food.blandfruit$chunks.desc=밋밋한 과일은 충격과 동시에 터져 버렸고, 남은 것은 아무런 변화도 없는 덩어리들이었다. 약간의 흙이 묻어 있긴 하지만, 이렇게 커다란 덩어리로 부서진 밋밋한 과일 조각들은 멀쩡히 먹을 수 있을 것처럼 보인다.
items.food.blandfruit$chunks.name=밍밍한 과일 조각
items.food.blandfruit.blindfruit=블라인드프루트
items.food.blandfruit.cooked=익힌 밍밍한 과일
items.food.blandfruit.desc=너무 건조하고 밍밍해서 다른 재료와 함께 끓이면 나아질 것 같네요.
items.food.blandfruit.desc_cooked=냄비에 담가두는 동안 과일은 통통해졌고, 함께 삶았던 씨앗의 성질까지 흡수했습니다. 따라서 그 씨앗에 해당하는 물약의 효과를 발휘할 것입니다.
items.food.blandfruit.desc_eat=지금 당장이라도 먹을 수 있을 것 같네요!
items.food.blandfruit.desc_throw=상당히 불안정해 보이니 버리는 게 최선일 것 같습니다.
items.food.blandfruit.dreamfruit=마법과일
items.food.blandfruit.earthfruit=땅과일
items.food.blandfruit.fadefruit=페이드프루트
items.food.blandfruit.firefruit=불과일
items.food.blandfruit.icefruit=아이스프루트
items.food.blandfruit.name=밍밍한 과일
items.food.blandfruit.raw=날것으로 먹기엔 너무 힘들어요.
items.food.blandfruit.rotfruit=썩은 과일
items.food.blandfruit.sorrowfruit=슬픔과일
items.food.blandfruit.starfruit=스타프루트
items.food.blandfruit.stormfruit=스톰프루트
items.food.blandfruit.sunfruit=해바라기
items.food.blandfruit.swiftfruit=스위프트프루트
items.food.chargrilledmeat.desc=꽤 괜찮아 보이는 스테이크네요.
items.food.chargrilledmeat.discover_hint=다른 식재료를 사용해서도 만들 수 있습니다.
items.food.chargrilledmeat.name=숯불에 구운 고기
items.food.food.ac_eat=먹다
items.food.food.desc=특별한 건 없어요. 말린 고기, 비스킷 같은 것들이죠.
items.food.food.eat_msg=그 음식 정말 맛있었어요!
items.food.food.name=식량 배급
items.food.frozencarpaccio.better=기분이 훨씬 나아지셨네요!
items.food.frozencarpaccio.desc=이건 꽁꽁 얼린 생고기예요. 얇게 썰어서 먹어야 하는데, 이렇게 먹으니 의외로 맛있어요.
items.food.frozencarpaccio.discover_hint=다른 식재료를 사용해서도 만들 수 있습니다.
items.food.frozencarpaccio.hard=피부가 굳어지는 느낌이 들어요!
items.food.frozencarpaccio.invis=손이 투명해지는 게 보이시죠!
items.food.frozencarpaccio.name=냉동 카르파초
items.food.frozencarpaccio.refresh=상쾌하네요!
items.food.meatpie.desc=짭짤한 고기로 속을 꽉 채운 맛있는 파이입니다. 이 파이 하나면 다른 어떤 음식보다 훨씬 더 포만감을 느낄 수 있을 거예요.
items.food.meatpie.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.food.meatpie.eat_msg=그 음식 정말 맛있었어요!
items.food.meatpie.name=고기 파이
items.food.mysterymeat$placeholder.name=고기
items.food.mysterymeat.desc=섭취는 본인의 책임입니다!
items.food.mysterymeat.discover_hint=이 아이템은 특정 적에게서 드롭으로 획득할 수 있습니다.
items.food.mysterymeat.eat_msg=그 음식 맛이… 이상했어.
items.food.mysterymeat.hot=아, 너무 덥다!
items.food.mysterymeat.legs=다리에 감각이 없어요!
items.food.mysterymeat.name=정체불명의 고기
items.food.mysterymeat.not_well=몸이 안 좋으신 것 같네요.
items.food.mysterymeat.stuffed=배가 너무 불러요.
items.food.pasty$fishleftover.desc=지난 식사에서 남은 생선이 조금 있습니다. 언제든 원하실 때 드시면 허기를 조금 달랠 수 있습니다.
items.food.pasty$fishleftover.eat_msg=그 음식 맛은 괜찮았어요.
items.food.pasty$fishleftover.name=생선 남은 것
items.food.pasty.amulet_desc=드디어 찾았군, 마법의 부적을! 잠깐만, 이건 그냥 부적처럼 보이게 포장된 초콜릿이잖아! 무한한 힘을 주지는 않겠지만, 적어도 배는 채워주고 유물 충전량도 조금 늘려줄 거야. \n\n만우절이야!
items.food.pasty.amulet_name=옌도르의 부적?
items.food.pasty.cane_desc=엄청나게 큰 달콤한 사탕 지팡이. 크기가 꽤 커서 배를 든든하게 채울 수 있고, 설탕이 지팡이에 약간의 추가 에너지를 줄지도 몰라요. 즐거운 휴일 보내세요!
items.food.pasty.cane_name=캔디 케인
items.food.pasty.desc=소고기와 감자를 전통 방식으로 채워 넣은 정통 콘월식 파스티입니다. 정말 맛있어요!
items.food.pasty.egg_desc=커다란 초콜릿 달걀이 화려한 노란색 포장지에 싸여 있어요. 초콜릿이 듬뿍 들어있어 배가 든든하고, 설탕 덕분에 기분도 좋아질 거예요. 해피 이스터!
items.food.pasty.egg_name=부활절 달걀
items.food.pasty.fish_desc=신선한 채소 위에 통째로 찐 생선이 마법처럼 보존되어 있습니다. 이맘때쯤에는 생선을 조금 남겨두는 것이 전통이니, 한꺼번에 다 먹지 않고 남은 생선을 보관해 두세요. 새해 복 많이 받으세요!
items.food.pasty.fish_name=찜 생선
items.food.pasty.name=풀 같은
items.food.pasty.pie_desc=커다란 호박 파이 한 조각. 달콤하고 매콤한 맛이 포만감을 주고 약간의 치유 효과도 줄 거예요. 해피 할로윈!
items.food.pasty.pie_name=호박 파이
items.food.pasty.rainbow_desc=이 화려한 물약은 일종의 액체 음식입니다. 허기를 달래주는 것 외에도, 이 물약에는 약간의 마법이 깃들어 있어 주변의 일반 적을 진정시켜 일시적으로 전투를 주저하게 만듭니다. \n\n해피 프라이드!
items.food.pasty.rainbow_name=무지개 물약
items.food.pasty.sparkling_desc=이 반짝이는 물약은 일종의 액체 음식입니다. 허기를 달래주고 스파클링 와인과 비슷한 느낌을 주지만, 실제로는 알코올이 들어있지 않습니다. 따뜻한 기운이 배를 감싸주어 약간의 보호막을 형성해 줍니다. 새해 복 많이 받으세요!
items.food.pasty.sparkling_name=반짝이는 물약
items.food.pasty.vanilla_desc=이 커다란 바닐라 케이크 조각에는 알록달록한 스프링클과 파란색 크림이 뿌려져 있습니다. 이 케이크는 오랜 경험을 기념하기 위해 만들어졌으며, 드시면 그 경험의 일부를 얻으실 수 있습니다. 오리지널 픽셀 던전은 2012년 12월 4일에 처음 출시되었습니다. 픽셀 던전, 생일 축하해요!
items.food.pasty.vanilla_name=블루 케이크
items.food.phantommeat.desc=크고 윤기 나는 반투명 스테이크는 유령 피라냐에서 잘라낸 것입니다. 이 마법의 고기는 조리할 필요가 없으며, 포만감을 주는 것 외에도 여러 방어 효과를 제공합니다. 섭취하면 투명화, 나무껍질 피부, 약간의 치유 효과를 얻고 많은 해로운 효과를 치료합니다.
items.food.phantommeat.discover_hint=이 아이템은 특정 적에게서 드롭으로 획득할 수 있습니다.
items.food.phantommeat.name=유령 고기
items.food.smallration.desc=겉모습은 일반 배급식량과 똑같지만 크기만 작습니다.
items.food.smallration.discover_hint=이 물건은 가게에서 구입할 수 있습니다.
items.food.smallration.eat_msg=그 음식 맛은 괜찮았어요.
items.food.smallration.name=적은 식량 배급량
items.food.stewedmeat.desc=고기를 끓이는 과정에서 질병이나 기생충이 제거되었으므로 안심하고 드셔도 됩니다.
items.food.stewedmeat.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.food.stewedmeat.eat_msg=그 음식 맛은 괜찮았어요.
items.food.stewedmeat.name=스튜 고기
items.food.supplyration.desc=이 식량은 도적 길드원들이 지하 감옥에 남겨둔 것입니다. 이동 중에 간편하게 먹을 수 있도록 고안되었으며, 은밀한 활동에 도움을 줍니다. 일반 식량만큼 포만감을 주지는 않지만, 빠르게 섭취할 수 있고, 약간의 체력 회복 효과를 제공하며, 도적의 그림자 망토 충전량을 1만큼 채워줍니다.
items.food.supplyration.discover_hint=이 아이템은 특정 영웅 특성을 사용하여 획득할 수 있습니다.
items.food.supplyration.name=보급 배급량
items.gold.desc=금화 더미. 금화를 모아서 나중에 상점에서 사용하세요.
items.gold.name=금
items.heap.artifact=유물
items.heap.chest=가슴
items.heap.chest_desc=열어보기 전까지는 안에 뭐가 들어있는지 알 수 없을 거예요!
items.heap.crystal_chest=크리스탈 상자
items.heap.crystal_chest_desc=상자 안쪽에는 _%s_가 보이지만, 상자를 열려면 수정 열쇠가 필요합니다.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=잠긴 상자
items.heap.locked_chest_desc=열어보기 전까지는 안에 뭐가 있는지 알 수 없어요! 하지만 열려면 황금 열쇠가 필요하죠.
items.heap.remains=영웅의 유해
items.heap.remains_desc=이건 당신 전임자 중 한 명이 남긴 전부입니다. 혹시 귀중품이 있는지 한번 살펴보는 게 좋을 것 같습니다.
items.heap.ring=반지
items.heap.skeleton=유골
items.heap.skeleton_desc=이건 불행한 모험가의 유품일 뿐이야. 혹시 귀중품이 있을지도 모르니 한번 살펴볼 만하겠어.
items.heap.tomb=무덤
items.heap.tomb_desc=이 고대 무덤에는 유용한 물건이 들어 있을지도 모르지만, 무덤 주인은 틀림없이 확인을 거부할 것이다.
items.heap.wand=지팡이
items.honeypot$shatteredpot.desc=항아리는 산산조각이 났고, 벽에 발린 끈적끈적한 꿀만이 겨우 붙어 있을 뿐, 천천히 부서지고 있다. 깨진 항아리임에도 불구하고, 벌은 여전히 항아리를 지키려는 듯 보인다.
items.honeypot$shatteredpot.name=산산조각난 꿀단지
items.honeypot.ac_shatter=파편
items.honeypot.desc=이 커다란 꿀단지는 꿀로만 덮여 있는 게 아니라, 거대한 벌 한 마리가 살고 있습니다! 이렇게 큰 벌들은 보통 벌집에 머무르는데, 어쩌면 이 꿀단지는 벌을 잡는 데 쓰는 특수한 장치일지도 모르겠네요. 벌은 꿀단지 안에서 아주 만족스러워 보이며, 당신이 쳐다보면 경계하는 듯 윙윙거립니다.
items.honeypot.name=허니팟
items.item.ac_drop=떨어지다
items.item.ac_throw=던지다
items.item.curse=저주
items.item.custom_note=이 항목에는 "_%s_"라는 사용자 지정 메모가 있습니다.
items.item.custom_note_type=이 항목 유형에는 "_%s_"라는 사용자 지정 메모가 있습니다.
items.item.discover_hint=이 아이템은 던전에서 무작위로 발견할 수 있습니다.
items.item.prompt=던지는 방향을 선택하세요
items.item.rankings_desc=살해자: %s
items.journal.alchemypage.desc=연금술 안내서에서 찢어진 페이지입니다. 글씨가 너무 작아서 멀리서 읽기는 어렵지만 페이지 제목은 알아볼 수 있습니다.
items.journal.alchemypage.name=찢어진 연금술 책 페이지
items.journal.documentpage.desc=책에서 찢어낸 듯한 한 장의 종이입니다. 읽으려면 집어 들어야 할 겁니다.
items.journal.documentpage.name=찢어진 페이지
items.journal.guidebook.desc=모험가를 위한 안내서인데, 모험이 자신에게 맞지 않는다고 생각한 누군가가 여기에 남겨두었네요! 이 책은 마법이 걸려 있어서, 모험가들이 적절한 순간에 특정 페이지를 읽도록 유도할 수 있어요. 하지만 이런 기능에도 불구하고, 이 책이 가장 인기 있는 이유는 표지에 크고 친근한 글씨로 쓰인 "당황하지 마!"라는 문구 때문이에요.
items.journal.guidebook.hint_desktop=가이드북에 유용한 조언이 담겨 있습니다! 오른쪽 상단에 깜빡이는 저널 버튼(%s)을 눌러 읽어보세요.
items.journal.guidebook.hint_mobile=가이드북에 유용한 조언이 담겨 있어요! 오른쪽 상단에 깜빡이는 일지 모양 버튼을 눌러 읽어보세요.
items.journal.guidebook.hint_status=안내서
items.journal.guidebook.name=던전 마스터리의 서
items.journal.guidepage.desc=모험 안내서에서 찢어진 페이지. 대부분의 글씨가 너무 작아서 멀리서 읽기 어렵지만, 페이지 제목은 알아볼 수 있습니다:\n\n _"%s"_
items.journal.guidepage.name=찢어진 가이드북 페이지
items.journal.regionlorepage$caves.desc=탐험가의 항해일지에 적힌 것으로 보이는 글이 놀랍도록 잘 보존되어 있습니다. 얼마나 오래되었을지 상상도 못 할 겁니다. 집어 들어 읽어 보세요.
items.journal.regionlorepage$caves.name=이전 로그 항목
items.journal.regionlorepage$city.desc=마법처럼 메시지가 새겨진 작고 녹슨 금속판. 오랜 세월이 흘렀지만 글자는 여전히 선명하다. 하지만 읽으려면 직접 집어 들어야 한다.
items.journal.regionlorepage$city.name=녹슨 태블릿
items.journal.regionlorepage$halls.desc=빛나는 녹색 글자가 새겨진 작은 검은색 태블릿. 멀리서 보면 빛나는 글자들이 흐릿하게 보여서, 읽으려면 태블릿을 들어 올려야 한다.
items.journal.regionlorepage$halls.name=빛나는 태블릿
items.journal.regionlorepage$prison.desc=낡은 종이에 적힌 일기나 다른 기록물입니다. 하수도에서 찾은 편지들보다는 상태가 나은 것 같지만, 읽으려면 직접 집어 들어야 할 겁니다.
items.journal.regionlorepage$prison.name=낡은 일기 항목
items.journal.regionlorepage$sewers.desc=흙먼지가 묻은 종이에 편지처럼 보이는 것이 쓰여 있습니다. 무슨 내용이 쓰여 있는지 알아보려면 집어 들어야 할 겁니다.
items.journal.regionlorepage$sewers.name=낡은 글자
items.keys.crystalkey.desc=이 수정 열쇠의 잘린 면들이 어둠 속에서 반짝인다. 어쩌면 이 열쇠로 수정으로 만들어진 무언가를 열 수 있을지도 모른다.
items.keys.crystalkey.name=크리스탈 키
items.keys.goldenkey.desc=이 황금 열쇠의 홈은 아주 작고 정교합니다. 어쩌면 이 열쇠로 잠긴 상자를 열 수 있을지도 모릅니다.
items.keys.goldenkey.name=황금 열쇠
items.keys.ironkey.desc=이 오래된 쇠열쇠의 홈은 닳아빠졌고, 가죽 끈은 세월의 흔적으로 너덜너덜해졌다. 이 열쇠로 어떤 문을 열 수 있을까?
items.keys.ironkey.name=철 열쇠
items.keys.skeletonkey.name=맞쇠
items.keys.wornkey.desc=이 열쇠는 낡고 변색되었지만, 위풍당당해 보입니다. 아마도 근처의 중요한 문을 열 수 있을 것 같습니다.
items.keys.wornkey.name=낡은 열쇠
items.kindofmisc.unequip_message=먼저 이 아이템 중 하나를 장착 해제해야 합니다. 교체할 아이템을 선택하세요.
items.kindofmisc.unequip_title=아이템 하나를 장착 해제하세요
items.kindofweapon.empty=비어 있는
items.kindofweapon.equip_cursed=당신은 자신도 모르게 무기를 움켜쥔 손에 힘을 준다.
items.kindofweapon.swift_equip=당신은 재빨리 무기를 장착합니다.
items.kindofweapon.which_equip_msg=어느 무기 슬롯에 이 아이템을 장착하시겠습니까? \n\n챔피언은 주무기로 직접 공격하지만, 두 무기의 능력을 모두 사용할 수 있습니다. 두 무기의 사용 횟수는 동일합니다. \n\n챔피언은 주무기와 보조무기를 즉시 교체할 수도 있습니다.
items.kindofweapon.which_equip_primary=기본(%s)
items.kindofweapon.which_equip_secondary=보조 (%s)
items.kingscrown.ac_wear=입다
items.kingscrown.desc=마지막 드워프 왕의 왕관은 엄청난 마법 에너지로 빛납니다. 왕관을 착용하면 왕관의 마법이 현재 착용하고 있는 갑옷으로 흘러 들어가 특별한 능력을 지닌 독특한 에픽 갑옷으로 변모합니다. 새 갑옷은 기존 갑옷의 모든 속성을 그대로 유지합니다.
items.kingscrown.discover_hint=이 아이템은 특정 적에게서 드롭으로 획득할 수 있습니다.
items.kingscrown.naked=아쉽게도 왕관으로는 속옷을 바꿀 수 없습니다.
items.kingscrown.name=드워프 왕의 왕관
items.kingscrown.ratgraded=갑옷이 변신하는 순간, 쥐왕의 발이 밝게 빛납니다!
items.kingscrown.upgraded=왕관이 밝게 빛나다가 갑옷이 변형되면서 사라집니다!
items.liquidmetal.ac_apply=적용하다
items.liquidmetal.already_fixed=저 투척 무기는 이미 완벽한 상태입니다!
items.liquidmetal.apply=%d 액체 금속을 사용하여 투척 무기를 수리할 수 있습니다.
items.liquidmetal.desc=이 마법의 액체는 투척 무기의 갈라진 틈과 찢어진 부분을 메워 완벽한 상태로 복원할 수 있습니다! 무기 세트에서 무기 하나가 빠졌지만 다른 부분은 모두 수리된 경우, 액체 금속을 사용하여 빠진 무기를 교체할 수도 있습니다! 1단계 무기를 완전히 수리하려면 액체 금속 10개가 필요하고, 5단계 무기는 30개가 필요합니다. 등급이 올라갈수록 필요한 금속의 양도 35%씩 증가합니다. 액체 금속은 끝이 뾰족한 다트의 끝부분을 수리하는 데는 사용할 수 없습니다.
items.liquidmetal.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.liquidmetal.name=액체 금속
items.liquidmetal.prompt=투척 무기를 선택하세요
items.lostbackpack.desc=잃어버린 아이템 목록입니다. 모두 모아서 잃어버린 아이템들을 되찾으세요!
items.lostbackpack.name=잃어버린 배낭
items.merchantsbeacon.ac_use=사용
items.merchantsbeacon.desc=이 기묘한 드워프 기술 장치는 먼 거리에서도 통신할 수 있게 해줍니다. 활성화되면 이 신호기를 통해 던전 어디에서든 픽셀 마트에 아이템을 판매할 수 있습니다. 하지만 신호기의 마법은 한 번의 사용 동안만 지속되므로 현명하게 사용하세요.
items.merchantsbeacon.name=상인의 봉화
items.potions.brews.aquabrew.desc=이 물약이 깨지면 그 자리에 고압의 물이 분출됩니다. 이 물줄기는 불을 띤 적에게만 피해를 줄 수 있을 정도로 강력할 뿐 아니라, 주변 지형으로 물을 퍼뜨리고, 함정을 무력화하고, 불을 끄고, 분출 지점 근처의 캐릭터를 뒤로 밀쳐내는 효과도 있습니다.
items.potions.brews.aquabrew.name=아쿠아 브루
items.potions.brews.blizzardbrew.desc=이 물약을 깨뜨리면 소용돌이치는 눈보라가 발생하여 가스처럼 빠르게 퍼져나갑니다.
items.potions.brews.blizzardbrew.name=블리자드 브루
items.potions.brews.brew.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.potions.brews.causticbrew.desc=이 액체는 깨지는 지점 주변 넓은 지역에 부식성 액체를 퍼뜨립니다. 액체에 닿은 물체는 물로 씻어낼 수 없다면 천천히 녹아내립니다.
items.potions.brews.causticbrew.name=부식성 맥주
items.potions.brews.infernalbrew.desc=이 물약이 깨지면 마치 가스처럼 빠르게 퍼져나가는 맹렬한 화염이 발생합니다.
items.potions.brews.infernalbrew.name=지옥의 술
items.potions.brews.shockingbrew.desc=이 물약이 깨지면 깨진 지점 주변 넓은 지역에 전기 폭풍이 발생합니다.
items.potions.brews.shockingbrew.name=충격적인 맥주
items.potions.brews.unstablebrew.desc=이 마법의 물약은 무지개처럼 색이 변하며 빛납니다. 마시거나 던지면 무작위로 물약 효과가 발동됩니다. 마셨을 때는 항상 이로운 효과가 나타나고, 던졌을 때는 항상 해로운 효과가 나타납니다.
items.potions.brews.unstablebrew.name=불안정한 맥주
items.potions.elixirs.elixir.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=당신은 일시적으로 구(Goo)와 유사한 회복 능력을 얻었습니다. 물 속에 서 있는 동안 매 턴마다 소량의 체력을 회복합니다. 체력이 최대치에 도달하거나 물 밖으로 나오면 효과가 일시 중지됩니다. 남은 회복량:
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=수중 치유
items.potions.elixirs.elixirofaquaticrejuvenation.desc=이 영약은 치유 물약으로 강화된 구의 잔해를 함유하고 있습니다. 즉각적인 치유 효과는 없지만, 물 속에 서 있는 동안 꾸준히 체력을 회복시켜 줍니다.
items.potions.elixirs.elixirofaquaticrejuvenation.name=수중 회춘의 묘약
items.potions.elixirs.elixirofarcanearmor.desc=이 영약은 마신 자에게 마법 공격에 대한 지속적인 저항력을 부여합니다.
items.potions.elixirs.elixirofarcanearmor.name=신비로운 갑옷의 영약
items.potions.elixirs.elixirofdragonsblood.desc=이 영약을 마시면 마신 자의 혈관에 불꽃 같은 힘이 흐르게 됩니다. 이 효과로 마신 자는 불에 면역이 되며, 물리 공격으로 적에게 불을 붙일 수 있게 됩니다.
items.potions.elixirs.elixirofdragonsblood.name=용의 피의 영약
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=당신은 낙하의 깃털 물약 효과를 받고 있어, 절벽 아래로 떨어져도 피해를 입지 않습니다!\n\n남은 턴: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=깃털처럼 가벼운
items.potions.elixirs.elixiroffeatherfall.desc=이 영약은 약하지만 제어 가능한 부양 효과를 제공하여, 마신 사람이 잠시 동안 먼 높이에서 떨어져도 다치지 않게 해줍니다.
items.potions.elixirs.elixiroffeatherfall.light=깃털처럼 가볍게 느껴져요!
items.potions.elixirs.elixiroffeatherfall.name=깃털 낙하의 묘약
items.potions.elixirs.elixirofhoneyedhealing.desc=이 엘릭서는 치유력과 꿀의 달콤함을 결합한 제품입니다. 마시면 치유 물약과 같은 효과를 내며 약간의 허기를 달래줍니다. 또한 아군에게 던져 치유할 수도 있습니다. 꿀을 좋아하는 생물에게 이 아이템을 사용하면 진정될 수 있습니다.
items.potions.elixirs.elixirofhoneyedhealing.name=꿀처럼 달콤한 치유의 묘약
items.potions.elixirs.elixiroficytouch.desc=이 영약을 마시면 공격하는 적의 열기를 흡수할 수 있습니다. 이 효과로 인해 마시는 사람은 추위에 면역이 되며, 물리 공격으로 적을 얼릴 수 있게 됩니다.
items.potions.elixirs.elixiroficytouch.name=얼음처럼 차가운 손길의 묘약
items.potions.elixirs.elixirofmight$htboost.desc=몸이 비정상적으로 강하고 건강해진 느낌입니다. 최대 체력이 장시간 동안 증가합니다. 레벨이 오를수록 증가 효과는 점차 감소합니다. 현재 증가량: 0. 남은 레벨: 1.
items.potions.elixirs.elixirofmight$htboost.name=최대 체력 증가
items.potions.elixirs.elixirofmight.desc=이 강력한 액체가 근육을 타고 흐르면 힘이 영구적으로 1포인트 증가하고 최대 체력이 일시적으로 %d포인트 증가합니다. 체력 증가는 최대 체력에 비례하지만 레벨이 오를수록 서서히 감소합니다.
items.potions.elixirs.elixirofmight.msg=새로운 힘이 온몸을 휘감으며, 이제 당신은 %d의 힘을 갖게 되었습니다!
items.potions.elixirs.elixirofmight.name=힘의 묘약
items.potions.elixirs.elixiroftoxicessence.desc=이 묘약을 마시면 독성 에너지가 사용자에게 주입됩니다. 사용자는 움직일 때마다 지속적으로 독가스를 퍼뜨리며, 효과가 지속되는 시간보다 약간 더 오랫동안 독가스와 독에 대한 면역력을 갖게 됩니다.
items.potions.elixirs.elixiroftoxicessence.name=독성 정수의 영약
items.potions.exotic.exoticpotion.amber=이국적인 호박색 물약
items.potions.exotic.exoticpotion.azure=이국적인 푸른 물약
items.potions.exotic.exoticpotion.bistre=이국적인 비스트르 포션
items.potions.exotic.exoticpotion.charcoal=이국적인 숯 물약
items.potions.exotic.exoticpotion.crimson=이국적인 진홍색 물약
items.potions.exotic.exoticpotion.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.potions.exotic.exoticpotion.golden=이국적인 황금 물약
items.potions.exotic.exoticpotion.indigo=이국적인 인디고 포션
items.potions.exotic.exoticpotion.ivory=이국적인 상아 물약
items.potions.exotic.exoticpotion.jade=이국적인 옥 물약
items.potions.exotic.exoticpotion.magenta=이국적인 마젠타 포션
items.potions.exotic.exoticpotion.no=아니요, 마음을 바꿨어요.
items.potions.exotic.exoticpotion.silver=이국적인 은빛 물약
items.potions.exotic.exoticpotion.turquoise=이국적인 터키석 물약
items.potions.exotic.exoticpotion.unknown_desc=이 둥근 플라스크에는 알갱이가 섞인 색색의 액체가 들어 있습니다. 이 땅에서는 보기 드문 액체인 것 같은데, 마시거나 던지면 어떻게 될지 누가 알겠습니까?
items.potions.exotic.exoticpotion.warning=정말로 이 물약 사용을 취소하시겠습니까? 어차피 소모될 텐데요.
items.potions.exotic.exoticpotion.yes=네, 저는 확신합니다.
items.potions.exotic.potionofcleansing$cleanse.desc=이 캐릭터는 일시적으로 모든 유해한 상태 이상 효과에 면역입니다!\n\n남은 턴: %s.
items.potions.exotic.potionofcleansing$cleanse.name=정화된
items.potions.exotic.potionofcleansing.desc=이 강력한 시약을 마시면 몇 턴 동안 모든 유해한 상태 이상 효과에 면역이 됩니다. 또한 대상에게 던져서 상태를 해제할 수도 있습니다.
items.potions.exotic.potionofcleansing.name=정화의 물약
items.potions.exotic.potionofcorrosivegas.desc=이 가압 유리병의 마개를 열거나 깨뜨리면 내용물이 폭발하여 부식성이 강한 녹슨 색깔의 가스 구름이 발생합니다. 이 가스는 독가스보다 더 빠르게 퍼지고 더 치명적이지만, 지속 시간은 더 짧습니다.
items.potions.exotic.potionofcorrosivegas.name=부식성 가스 용액
items.potions.exotic.potionofdivineinspiration.bonus=재능 포인트 +2!
items.potions.exotic.potionofdivineinspiration.desc=신성한 에너지가 액체 형태로 응축된 이 물약은 마시는 자에게 신성한 힘을 불어넣어, 원하는 특성 단계에서 보너스 특성 포인트 2점을 부여합니다. 이 물약은 각 특성 단계마다 한 번씩만 사용할 수 있습니다.
items.potions.exotic.potionofdivineinspiration.name=신성한 영감의 물약
items.potions.exotic.potionofdivineinspiration.no_more_points=더 이상 보너스 특성 포인트를 획득할 수 없습니다.
items.potions.exotic.potionofdivineinspiration.select_tier=재능 등급을 선택하면 보너스 포인트 2점을 획득할 수 있습니다. 해당 등급을 잠금 해제해야만 포인트를 사용할 수 있습니다.
items.potions.exotic.potionofdragonsbreath.desc=이 플라스크에는 침과 섞이면 곧바로 불이 붙는 특이한 화합물이 들어 있습니다. 액체를 재빨리 뱉으면 입에서 불꽃을 뿜어낼 수 있습니다!
items.potions.exotic.potionofdragonsbreath.name=용의 숨결 물약
items.potions.exotic.potionofdragonsbreath.prompt=태울 장소를 선택하세요
items.potions.exotic.potionofearthenarmor.desc=이 액체는 마비시키는 대신 피부를 경화시켜 일시적인 천연 갑옷으로 만들어줍니다.
items.potions.exotic.potionofearthenarmor.name=흙 갑옷의 물약
items.potions.exotic.potionofmagicalsight.desc=이 음료를 마시면 감각이 일시적으로 놀라울 정도로 예민해져서 반경 12타일 이내의 벽을 투시할 수 있게 됩니다!
items.potions.exotic.potionofmagicalsight.name=마법의 시력 물약
items.potions.exotic.potionofmastery.armor_easier=갑옷을 입기가 훨씬 쉬워집니다!
items.potions.exotic.potionofmastery.desc=이 물약은 순수한 힘을 부여하는 대신, 사용자의 근육을 특정 아이템에 맞게 조율해 줍니다. 이를 통해 사용자는 마치 해당 아이템을 오랫동안 사용해 온 것처럼, 근육 기억을 형성하여 더욱 쉽게 사용할 수 있게 됩니다. 선택한 무기나 갑옷을 사용하는 데 필요한 힘이 2 감소합니다. 이 물약은 각 아이템에 한 번씩만 사용할 수 있습니다.
items.potions.exotic.potionofmastery.name=숙련의 물약
items.potions.exotic.potionofmastery.prompt=아이템 마스터하기
items.potions.exotic.potionofmastery.weapon_easier=무기를 다루기가 훨씬 쉬워집니다!
items.potions.exotic.potionofshielding.desc=이 물약은 치유하는 대신 사용자의 몸 주위에 내구성이 뛰어난 보호막을 생성하여 상당한 양의 피해를 막아줍니다.
items.potions.exotic.potionofshielding.name=보호막의 물약
items.potions.exotic.potionofshroudingfog.desc=이 플라스크 안의 액체가 공기에 노출되면 짙은 연기가 발생하여 빠르게 퍼져나가 적의 시야를 가립니다.
items.potions.exotic.potionofshroudingfog.name=안개를 가리는 물약
items.potions.exotic.potionofsnapfreeze.desc=이 물약에 함유된 화학 물질은 공기와 빠르게 반응하여 그 영향권 내에 있는 모든 것을 즉시 얼어붙게 하고 움직이지 못하게 만듭니다.
items.potions.exotic.potionofsnapfreeze.name=급속 냉동 물약
items.potions.exotic.potionofstamina.desc=이 특이하게 달콤한 액체를 마시면 오랫동안 지속되는 에너지 부스트를 얻어 장시간 빠른 속도로 달릴 수 있습니다.
items.potions.exotic.potionofstamina.name=체력 회복 물약
items.potions.exotic.potionofstormclouds.desc=이 물약을 던지면 농축된 증기 구름이 빠르게 퍼져나가고, 이 증기가 응축되어 주변 환경으로 쏟아집니다. 대부분의 지형은 물로 변하고, 불타는 적들은 피해를 입으며, 불은 꺼지고, 함정은 파괴됩니다.
items.potions.exotic.potionofstormclouds.name=폭풍 구름의 물약
items.potions.potion$placeholder.name=물약
items.potions.potion$seedtopotion.name=랜덤 포션
items.potions.potion.ac_drink=마시기
items.potions.potion.amber=호박색 물약
items.potions.potion.azure=푸른 물약
items.potions.potion.beneficial=유익한 물약
items.potions.potion.bistre=비스트르 포션
items.potions.potion.charcoal=숯 물약
items.potions.potion.crimson=진홍색 물약
items.potions.potion.discover_hint=이 아이템은 던전에서 무작위로 획득하거나 연금술을 통해 제작할 수 있습니다.
items.potions.potion.golden=황금 물약
items.potions.potion.harmful=위험한 물약이야!
items.potions.potion.indigo=인디고 포션
items.potions.potion.ivory=상아 물약
items.potions.potion.jade=옥 물약
items.potions.potion.magenta=마젠타 포션
items.potions.potion.no=아니요, 마음을 바꿨어요.
items.potions.potion.shatter=플라스크가 깨지고 액체가 튀어 오르지만 아무런 해를 끼치지 않습니다.
items.potions.potion.silver=은빛 물약
items.potions.potion.sure_drink=정말 마시고 싶으세요? 대부분의 경우 그런 물약은 적에게 던져야 합니다.
items.potions.potion.sure_throw=정말 버리시겠어요? 대부분의 경우 마시는 게 더 나을 텐데요.
items.potions.potion.turquoise=터키석 물약
items.potions.potion.unknown_desc=이 작은 병 안에는 %s 액체가 소용돌이치고 있다. 마시거나 던지면 무슨 일이 일어날까?
items.potions.potion.yes=네, 제가 뭘 하고 있는지 알고 있습니다.
items.potions.potionofexperience.desc=수많은 전투의 생생한 경험을 액체 형태로 응축한 이 물약은 당신의 경험치를 즉시 올려줄 것입니다.
items.potions.potionofexperience.name=경험치 물약
items.potions.potionoffrost.desc=이 화학물질은 공기에 닿으면 증발하여 얼어붙는 구름이 됩니다. 구름에 닿은 생물은 그 자리에서 얼어붙어 움직이지도 행동하지도 못합니다.
items.potions.potionoffrost.name=서리의 물약
items.potions.potionofhaste.desc=이 이상하리만치 달콤한 액체를 마시면 짧은 시간 동안 엄청난 에너지를 얻어 빠른 속도로 달릴 수 있게 됩니다.
items.potions.potionofhaste.energetic=에너지가 넘치는 기분이 드네요!
items.potions.potionofhaste.name=신속의 물약
items.potions.potionofhealing.desc=체력을 즉시 모두 회복하고 중독을 치료하는 영약입니다.
items.potions.potionofhealing.heal=상처가 아물기 시작합니다.
items.potions.potionofhealing.name=치유의 물약
items.potions.potionofinvisibility.desc=이 물약을 마시면 잠시 투명해져 적이 당신을 볼 수 없습니다. 적을 공격하거나 적이 보는 앞에서 마법 막대나 주문서를 쓰면 효과가 사라집니다.
items.potions.potionofinvisibility.invisible=손이 투명해지는 게 보이시죠!
items.potions.potionofinvisibility.name=투명 물약
items.potions.potionoflevitation.desc=이 신기한 액체를 마시면 공중에 떠올라 함정을 쉽게 넘을 수 있습니다. 하지만 불길과 가스는 공기 중에도 퍼지므로 떠 있다고 피할 수는 없습니다.
items.potions.potionoflevitation.float=당신은 공중으로 떠오릅니다!
items.potions.potionoflevitation.name=공중부양 물약
items.potions.potionofliquidflame.desc=이 플라스크에는 공기에 노출되면 격렬하게 화염에 휩싸이는 불안정한 화합물이 들어 있습니다.
items.potions.potionofliquidflame.name=액체 불꽃의 물약
items.potions.potionofmindvision.desc=이 물약을 마시면 멀리 있는 생명체의 정신적 신호를 감지할 수 있게 되어 벽 너머로도 생명체의 존재를 느낄 수 있습니다. 또한, 이 물약은 가까운 벽과 문 너머를 볼 수 있게 해줍니다.
items.potions.potionofmindvision.name=심안의 물약
items.potions.potionofmindvision.see_mobs=당신은 어떻게든 다른 생명체의 마음의 존재를 느낄 수 있어요!
items.potions.potionofmindvision.see_none=지금 이 단계에는 당신 혼자뿐이라는 것을 어쩐지 알 수 있습니다.
items.potions.potionofparalyticgas.desc=이 플라스크 안의 액체는 공기에 노출되면 마비를 일으키는 노란색 연기로 기화됩니다. 이 연기를 들이마신 사람은 즉시 마비되어 연기가 사라진 후에도 한동안 움직일 수 없게 됩니다. 이 플라스크를 멀리 있는 적에게 던져 가스의 영향권 안에 가둘 수 있습니다.
items.potions.potionofparalyticgas.name=마비 가스 물약
items.potions.potionofpurity.desc=이 약품은 범위 안의 모든 유해한 가스를 빠르게 중화합니다. 마시면 잠시 그런 가스에 면역이 됩니다.
items.potions.potionofpurity.freshness=공기에서 평소와 다른 상쾌함을 느낄 수 있습니다.
items.potions.potionofpurity.name=정화의 물약
items.potions.potionofpurity.protected=보호막이 당신을 감싸고 있습니다!
items.potions.potionofstrength.desc=이 강력한 액체는 근육 속으로 흘러 들어가 영구적으로 근력을 1포인트 증가시켜 줍니다.
items.potions.potionofstrength.msg=새로운 힘이 온몸을 휘감으며, 이제 당신은 %d의 힘을 갖게 되었습니다!
items.potions.potionofstrength.name=힘의 물약
items.potions.potionoftoxicgas.desc=이 가압 유리병의 마개를 열거나 깨뜨리면 내용물이 폭발하여 치명적인 독성 녹색 가스 구름이 발생합니다. 손으로 마개를 여는 대신 멀리 있는 적에게 이 물약을 던지는 것을 선택할 수도 있습니다.
items.potions.potionoftoxicgas.name=독가스 물약
items.quest.ceremonialcandle.desc=여러 개의 양초가 사용 과정에서 녹아 붙어버린 세트입니다. 개별적으로는 가치가 없지만, 다른 양초들과 함께 일정한 패턴으로 배치하면 소환 의식을 위한 에너지를 집중시킬 수 있습니다.
items.quest.ceremonialcandle.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
items.quest.ceremonialcandle.name=의식용 양초
items.quest.corpsedust.chill=등골이 오싹해진다.
items.quest.corpsedust.desc=시체 먼지 덩어리는 겉보기에는 일반 먼지 덩어리와 다를 바 없습니다. 하지만 그 안에는 불길한 기운이 감돌고 있음을 느낄 수 있습니다. 가능한 한 빨리 없애버리는 것이 좋을 것입니다.
items.quest.corpsedust.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
items.quest.corpsedust.name=시체 먼지
items.quest.darkgold.desc=이 금속이 '어두운'이라고 불리는 이유는 색깔 때문이 아니라(일반 금과 색깔이 다르지 않음) 햇빛에 노출되면 녹아서 표면에 사용할 수 없기 때문입니다.
items.quest.darkgold.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
items.quest.darkgold.name=어두운 금 광석
items.quest.darkgold.you_now_have=이제 당신은 %d 다크 골드 광석을 가지고 있습니다.
items.quest.dwarftoken.desc=많은 드워프들과 그들이 만든 거대한 생물들은 용도를 알 수 없는 작은 금속 조각들을 지니고 다닙니다. 장신구일 수도 있고, 일종의 신분증일 수도 있겠죠. 드워프들은 참으로 기묘한 종족입니다.
items.quest.dwarftoken.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
items.quest.dwarftoken.name=드워프 토큰
items.quest.embers.desc=어린 불의 정령에게서만 얻을 수 있는 특별한 불씨. 이 불씨는 열에너지를 방출합니다.
items.quest.embers.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
items.quest.embers.name=원소의 불씨
items.quest.escapecrystal.ac_use=사용
items.quest.escapecrystal.desc=순간 이동 마법이 담긴 듯한 얇은 마법 수정입니다. 이 수정을 사용하면 언제든 드워프 금고를 나갈 수 있지만, 아무것도 가지고 나갈 수는 없습니다!
items.quest.escapecrystal.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
items.quest.escapecrystal.name=탈출 크리스탈
items.quest.gooblob.desc=구가 죽으면서 분리된, 출렁거리는 끈적끈적한 덩어리입니다. 마치 커다란 젤리 공 같지만, 감히 먹을 엄두도 나지 않죠. 그 자체로는 아무런 기능도 없지만, 특정 물약이나 폭탄과 조합하면 유용할지도 모릅니다. 최소한 상당한 양의 에너지로 변환될 수 있을 겁니다.
items.quest.gooblob.discover_hint=이 아이템은 특정 적에게서 드롭으로 획득할 수 있습니다.
items.quest.gooblob.name=끈적끈적한 덩어리
items.quest.metalshard.desc=DM-300이 파괴될 때 떨어져 나온 녹슨 저주받은 금속 조각. 그 안에는 비활성화된 악의적인 마법이 느껴진다. 이 조각 자체는 아무런 효과가 없지만, 특정 두루마리나 폭탄과 조합하면 유용할 수도 있다. 최소한 상당한 양의 에너지로 변환될 것이다.
items.quest.metalshard.discover_hint=이 아이템은 특정 적에게서 드롭으로 획득할 수 있습니다.
items.quest.metalshard.name=저주받은 금속 조각
items.quest.pickaxe.ability_desc=결투사는 곡괭이로 적을 _찌를_ 수 있습니다. 이 공격은 반드시 명중하며, 3턴 동안 무방비 상태를 부여하고, 단단한 피부를 가진 적에게 _%1$d-%2$d의 피해_를 입힙니다.
items.quest.pickaxe.ability_name=내뚫다
items.quest.pickaxe.desc=이것은 바위를 부수는 데 적합한 튼튼하고 무거운 도구입니다. 곡괭이를 장착하지 않아도 광물을 캘 수 있지만, 필요할 때는 무기로 사용할 수도 있을 것 같습니다.
items.quest.pickaxe.discover_hint=이 아이템은 특정 퀘스트를 진행하는 동안 얻을 수 있습니다.
items.quest.pickaxe.name=곡괭이
items.quest.pickaxe.upgrade_ability_stat_name=능력 피해
items.quest.ratskull.desc=놀라울 정도로 큰 쥐 두개골이네요. 벽에 걸어둘 곳만 있다면 훌륭한 사냥 트로피가 될 것 같습니다.
items.quest.ratskull.name=거대한 쥐 두개골
items.remains.bowfragment.desc=이 부서진 나무 조각은 한때 잃어버린 사냥꾼의 영혼 활의 일부였습니다. 조각에는 아직 자연의 에너지가 조금 남아 있는 것을 느낄 수 있으며, 이 조각을 이용해 주변에 키 큰 풀을 자라게 할 수 있습니다. 하지만 이렇게 하면 조각은 사라집니다.
items.remains.bowfragment.name=활 조각
items.remains.brokenhilt.desc=이 부러진 검자루는 패배한 결투사의 무기에서 나온 것처럼 보입니다. 검자루에는 아직 약간의 무기력이 남아 있는 듯하며, 이를 이용해 다음 두 번의 근접 공격에 추가 피해를 줄 수 있습니다. 하지만 이렇게 하면 검자루가 파괴됩니다.
items.remains.brokenhilt.name=부러진 손잡이
items.remains.brokenstaff.desc=이 마법사의 지팡이는 주인이 죽은 후 반으로 부러졌습니다. 지팡이에는 아직 약간의 마법 에너지가 남아 있어, 이를 이용해 마법봉의 에너지를 조금 증폭시킬 수 있습니다. 하지만 이렇게 하면 지팡이가 파괴됩니다.
items.remains.brokenstaff.name=부서진 직원
items.remains.cloakscrap.desc=이 반투명 천 조각은 마치 고인이 된 도적의 그림자 망토에서 나온 것 같습니다. 아직 약간의 신비로운 에너지가 남아 있는 듯하며, 이를 이용해 유물에 약간의 충전량을 더할 수 있습니다. 하지만 이렇게 하면 천이 파괴됩니다.
items.remains.cloakscrap.name=천 조각
items.remains.remainsitem.ac_use=사용
items.remains.remainsitem.discover_hint=이 아이템은 이전에 클리어하지 못한 특정 영웅의 유해에서 찾을 수 있습니다.
items.remains.sealshard.desc=이 작은 붉은 밀랍 조각들은 쓰러진 전사의 인장에서 나온 것처럼 보입니다. 인장에는 아직 약간의 의지가 남아 있는 듯하며, 이를 이용해 자신을 보호하는 방패로 사용할 수 있습니다. 하지만 이렇게 하면 인장 조각들이 모두 파괴됩니다.
items.remains.sealshard.name=봉인 조각
items.remains.tornpage.desc=이 페이지는 마치 수명이 다한 성직자의 성서에서 찢어낸 것처럼 보입니다. 아직 약간의 신성한 에너지가 남아 있는데, 이를 이용하면 체력을 조금 회복할 수 있습니다. 하지만 이렇게 하면 찢어진 페이지는 파괴됩니다.
items.remains.tornpage.name=찢어진 페이지
items.rings.ring.agate=마노 반지
items.rings.ring.amethyst=자수정 반지
items.rings.ring.curse_known=이 반지 안에는 사악한 마법이 도사리고 있음을 느낄 수 있다.
items.rings.ring.cursed_worn=이 반지는 저주받았기 때문에 당신은 그것을 없앨 수 없습니다.
items.rings.ring.diamond=다이아몬드 반지
items.rings.ring.emerald=에메랄드 반지
items.rings.ring.equip_cursed=반지가 손가락을 꽉 조여서 아파요!
items.rings.ring.garnet=가넷 반지
items.rings.ring.identify=이제 당신은 반지에 대해 충분히 익숙해져서 어떤 반지인지 알아낼 수 있을 것입니다.
items.rings.ring.known=이것은 %s입니다.
items.rings.ring.not_cursed=이 반지는 악의적인 마법에 물들지 않았습니다.
items.rings.ring.onyx=오닉스 반지
items.rings.ring.opal=오팔 반지
items.rings.ring.quartz=석영 반지
items.rings.ring.ruby=루비 반지
items.rings.ring.sapphire=사파이어 반지
items.rings.ring.topaz=토파즈 반지
items.rings.ring.tourmaline=투르말린 반지
items.rings.ring.unknown_desc=이 금속 반지에는 커다란 %s 보석이 박혀 어둠 속에서 반짝인다. 끼면 어떤 효과가 있을까?
items.rings.ringofaccuracy.combined_stats=장착한 반지들이 힘을 합쳐 정확도를 총 _%s%%_만큼 높여줍니다.
items.rings.ringofaccuracy.desc=이 반지는 적에게 공격을 명중시킬 확률을 높입니다.
items.rings.ringofaccuracy.name=정확성의 반지
items.rings.ringofaccuracy.stats=이 반지를 착용하면 정확도가 _%s%%만큼 향상됩니다._
items.rings.ringofaccuracy.typical_stats=이 반지를 착용하면 일반적으로 정확도가 _%s%%만큼 향상됩니다._
items.rings.ringofaccuracy.upgrade_stat_name_1=정확도 향상
items.rings.ringofarcana.combined_stats=장착한 반지들이 힘을 합쳐 마법 부여와 문양의 위력을 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofarcana.desc=이 반지는 무기에 걸린 마법 부여와 갑옷에 새겨진 문양, 심지어 저주까지 강화시켜 줍니다! 처음에는 발동 확률을 높여주고, 발동 확률이 100%가 되면 효과의 강도를 증가시킵니다. 저주받은 반지는 반대로 마법 부여, 문양, 저주를 약화시킵니다.
items.rings.ringofarcana.name=아르카나의 반지
items.rings.ringofarcana.stats=이 반지를 착용하면 마법과 문양의 위력이 _%s%%_만큼 증가합니다.
items.rings.ringofarcana.typical_stats=이 반지를 착용하면 일반적으로 마법과 문양의 위력이 _%s%%_만큼 증가합니다.
items.rings.ringofarcana.upgrade_stat_name_1=아르카나 부스트
items.rings.ringofelements.combined_stats=장착한 반지들이 힘을 합쳐 총 _%s%%_의 원소 저항력을 제공합니다.
items.rings.ringofelements.desc=이 반지는 불, 전기, 가스 등의 원소에 저항력을 줍니다. 해로운 효과가 지속되는 시간도 줄여 줍니다.
items.rings.ringofelements.name=원소의 반지
items.rings.ringofelements.stats=이 반지를 착용하면 _%s%%_ 원소 저항력을 제공합니다.
items.rings.ringofelements.typical_stats=이 반지를 착용하면 일반적으로 _%s%%_ 원소 저항력을 제공합니다.
items.rings.ringofelements.upgrade_stat_name_1=저항
items.rings.ringofenergy.combined_stats=장착한 반지들이 힘을 합쳐 충전 속도를 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofenergy.desc=이 반지에서 뿜어져 나오는 마법장 속에서는 마법 장비가 더 빠르게 재충전됩니다. 저주받은 반지는 반대로 재충전 속도를 늦춥니다.
items.rings.ringofenergy.name=에너지 고리
items.rings.ringofenergy.stats=이 반지를 착용하면 지팡이, 유물, 영웅 갑옷의 충전 속도가 _%s%%_만큼 증가합니다.
items.rings.ringofenergy.typical_stats=이 반지를 착용하면 일반적으로 지팡이, 유물, 영웅 갑옷의 충전 속도가 _%s%%_만큼 증가합니다.
items.rings.ringofenergy.upgrade_stat_name_1=충전 부스트
items.rings.ringofevasion.combined_stats=장착한 반지들이 힘을 합쳐 회피율을 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofevasion.desc=이 반지는 적의 공격을 피할 확률을 높입니다.
items.rings.ringofevasion.name=회피의 반지
items.rings.ringofevasion.stats=이 반지를 착용하면 회피율이 _%s%%만큼 증가합니다._
items.rings.ringofevasion.typical_stats=이 반지를 착용하면 일반적으로 회피율이 _%s%%만큼 증가합니다._
items.rings.ringofevasion.upgrade_stat_name_1=회피 강화
items.rings.ringofforce$brawlersstance.desc=이 자세를 유지하는 동안 결투사는 무기를 장착하고 있더라도 일반 공격에 장착된 힘의 반지를 사용합니다. 이 공격은 추가 피해를 입으며 무기의 강화 및 마법 부여 효과도 그대로 적용됩니다. 하지만 이 자세를 유지하려면 집중력이 필요하며, 무기 능력 재충전 속도가 50% 감소합니다. 힘의 반지를 사용하면 이 자세를 켜거나 끌 수 있지만, 자세를 빠르게 활성화하고 해제하면 재충전 속도 감소 효과가 잠시 동안 지속됩니다.
items.rings.ringofforce$brawlersstance.name=싸움꾼의 자세
items.rings.ringofforce.ability_desc=결투사는 이 반지를 착용하면 '격투가 자세'를 취할 수 있으며, 무기를 장착했을 때에도 일반 공격 시 항상 이 반지의 효과가 적용됩니다. 이 공격은 '%1$d-%2$d'의 피해를 입히고 무기의 마법 부여 및 강화 효과를 계승합니다. 이 자세는 무기 재충전 속도를 50%%만큼 느리게 합니다.
items.rings.ringofforce.ability_name=싸움꾼의 자세
items.rings.ringofforce.combined_stats=장착한 반지들이 힘을 합쳐 무기 없이 총 _%1$d-%2$d의 피해를 입히거나, 무기를 착용하면 피해량이 _%3$d_만큼 증가합니다.
items.rings.ringofforce.desc=이 반지는 착용자의 근접 공격력을 강화합니다. 무기를 사용할 때는 그 효과가 미미하지만, 맨손 공격 시에는 훨씬 강력해집니다. 저주받은 반지는 오히려 착용자의 공격력을 약화시킵니다.
items.rings.ringofforce.name=힘의 고리
items.rings.ringofforce.stats=무기를 장착하지 않은 상태에서 현재 전투력으로 이 반지를 착용하면 _%1$d-%2$d의 피해를 입힙니다. 무기를 장착한 상태에서는 이 반지로 인한 피해가 _%3$d만큼 증가합니다._
items.rings.ringofforce.typical_ability_desc=결투사는 이 반지를 착용하면 '격투가 자세'를 취할 수 있으며, 무기를 장착했을 때에도 일반 공격 시 항상 이 반지의 효과가 적용됩니다. 이러한 공격은 일반적으로 '%1$d-%2$d'의 피해를 입히며, 무기의 마법 부여 및 강화 효과를 그대로 계승합니다. 이 자세는 무기 재충전 속도를 50%%만큼 느리게 합니다.
items.rings.ringofforce.typical_stats=무기를 들지 않은 상태에서 현재 전투력으로 이 반지를 끼우면 일반적으로 _%1$d-%2$d의 피해를 입힙니다. 무기를 장착한 상태에서는 일반적으로 이 반지로 인해 피해량이 _%3$d만큼 증가합니다.
items.rings.ringofforce.upgrade_stat_name_1=무장하지 않은 상태에서의 피해
items.rings.ringofforce.upgrade_stat_name_2=무장 피해량 증가
items.rings.ringofforce.upgrade_stat_name_3=능력 피해
items.rings.ringoffuror.combined_stats=장착한 반지들이 힘을 합쳐 공격 속도를 총 _%s%%_만큼 증가시킵니다.
items.rings.ringoffuror.desc=이 반지는 착용자에게 내면의 분노를 부여하여 더욱 빠르게 공격할 수 있게 해줍니다. 저주받은 반지는 오히려 착용자의 공격 속도를 늦춥니다.
items.rings.ringoffuror.name=분노의 고리
items.rings.ringoffuror.stats=이 반지를 착용하면 공격 속도가 _%s%%_만큼 증가합니다.
items.rings.ringoffuror.typical_stats=이 반지를 착용하면 일반적으로 공격 속도가 _%s%%만큼 증가합니다._
items.rings.ringoffuror.upgrade_stat_name_1=공격 속도 증가
items.rings.ringofhaste.combined_stats=장착한 반지들이 힘을 합쳐 이동 속도를 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofhaste.desc=이 반지는 착용자에게 흐르는 시간을 빠르게 하여 모든 행동을 조금 더 빨리 하게 합니다.
items.rings.ringofhaste.name=신속의 반지
items.rings.ringofhaste.stats=이 반지를 착용하면 이동 속도가 _%s%%만큼 증가합니다._
items.rings.ringofhaste.typical_stats=이 반지를 착용하면 일반적으로 이동 속도가 _%s%%만큼 증가합니다._
items.rings.ringofhaste.upgrade_stat_name_1=이동 속도 증가
items.rings.ringofmight.combined_stats=장착한 반지들이 힘을 합쳐 총 _%1$d_만큼 공격력을, _%2$s%%_만큼 최대 HP를 증가시킵니다.
items.rings.ringofmight.desc=이 반지는 착용자의 신체적 능력을 향상시켜 더 강한 체력과 건강을 부여합니다. 저주받은 반지는 착용자를 약화시킵니다.
items.rings.ringofmight.name=힘의 반지
items.rings.ringofmight.stats=이 반지를 착용하면 힘이 _%1$d_만큼 증가하고 최대 HP가 _%2$s%%_만큼 증가합니다.
items.rings.ringofmight.typical_stats=이 반지를 착용하면 일반적으로 힘이 _%1$d_만큼 증가하고 최대 HP가 _%2$s%%_만큼 증가합니다.
items.rings.ringofmight.upgrade_stat_name_1=힘 강화
items.rings.ringofmight.upgrade_stat_name_2=최대 HP 부스트
items.rings.ringofsharpshooting.combined_stats=장착한 반지들이 힘을 합쳐 투척 무기의 유효 레벨을 _%1$d_만큼 높이고 내구성을 _%2$s%%_만큼 증가시킵니다.
items.rings.ringofsharpshooting.desc=이 반지는 착용자의 정확도와 조준력을 향상시켜 모든 투사체 무기의 위력과 내구성을 높여줍니다. 저주받은 반지는 정반대의 효과를 나타냅니다.
items.rings.ringofsharpshooting.name=명사수의 고리
items.rings.ringofsharpshooting.stats=이 반지를 착용하면 투척 무기의 공격력이 _%1$d_만큼 증가한 것처럼 높아지고, 내구도는 _%2$s%%_만큼 증가합니다.
items.rings.ringofsharpshooting.typical_stats=이 반지를 착용하면 투척 무기의 공격력이 _%1$d_만큼 증가하고 내구도는 _%2$s%%_만큼 증가합니다.
items.rings.ringofsharpshooting.upgrade_stat_name_1=레벨별 대미지 증가
items.rings.ringofsharpshooting.upgrade_stat_name_2=내구성 강화
items.rings.ringoftenacity.combined_stats=장착한 반지들이 힘을 합쳐 받는 피해를 최대 _%s%%_까지 줄여줍니다.
items.rings.ringoftenacity.desc=이 반지를 착용하면 착용자는 치명적인 공격을 저항할 수 있습니다. 부상 정도가 심할수록 저항력이 강해지지만, 저주받은 반지는 오히려 적들이 착용자를 더 쉽게 처형하도록 만듭니다.
items.rings.ringoftenacity.name=끈기의 고리
items.rings.ringoftenacity.stats=이 반지를 착용하면 받는 피해를 최대 _%s%%_까지 줄여줍니다.
items.rings.ringoftenacity.typical_stats=이 반지를 착용하면 일반적으로 입는 피해를 최대 _%s%%_까지 줄여줍니다.
items.rings.ringoftenacity.upgrade_stat_name_1=최대 피해 저항
items.rings.ringofwealth.combined_stats=장착한 반지들이 힘을 합쳐 행운을 총 _%s%%_만큼 증가시킵니다.
items.rings.ringofwealth.desc=이 반지는 보물을 끌어당기는 자석처럼 작용하여 적이나 상자에서 귀중한 아이템을 얻을 확률을 높여줍니다. 반대로 저주받은 반지는 전리품을 얻을 확률을 낮춥니다.
items.rings.ringofwealth.name=부의 반지
items.rings.ringofwealth.stats=이 반지를 착용하면 행운이 _%s%%만큼 증가합니다._
items.rings.ringofwealth.typical_stats=이 반지를 착용하면 일반적으로 행운이 _%s%%만큼 증가합니다._
items.rings.ringofwealth.upgrade_stat_name_1=행운 증진
items.scrolls.exotic.exoticscroll.berkanan=베르카난의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.scrolls.exotic.exoticscroll.gyfu=GYFU의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.isaz=이사즈의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.kaunan=카우난의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.laguz=라구즈의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.mannaz=만나즈의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.naudiz=나우디즈의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.odal=오달의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.raido=라이도의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.sowilo=소윌로의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.tiwaz=TIWAZ의 이국적인 두루마리
items.scrolls.exotic.exoticscroll.unknown_desc=이 검은 양피지에는 해독할 수 없는 빛나는 마법의 룬 문자가 새겨져 있다. 이 땅에는 낯선 문자 같으니, 소리 내어 읽으면 어떤 일이 벌어질지 누가 알겠는가?
items.scrolls.exotic.exoticscroll.yngvi=잉비의 이국적인 두루마리
items.scrolls.exotic.scrollofantimagic.desc=이 두루마리에 적힌 주문은 당신을 마법의 기운으로 감싸 모든 마법 효과(유익한 효과든 해로운 효과든)를 일시적으로 차단합니다. 여기에는 지팡이, 두루마리, 반지, 유물, 마법 부여, 저주 등 대부분의 마법 아이템 효과가 포함됩니다. 하지만 영웅 갑옷의 능력은 강력하기 때문에 이러한 차단 효과에도 영향을 받지 않습니다.
items.scrolls.exotic.scrollofantimagic.name=반마법의 두루마리
items.scrolls.exotic.scrollofchallenge$challengearena.desc=붉은 안개가 피어오르는 마법의 경기장이 당신 주변에 나타났습니다. 안개 속에 서 있는 동안에는 허기가 증가하지 않으며 모든 공격으로부터 받는 피해가 33만큼 감소합니다. 갑옷과 같은 다른 피해 감소 효과가 있는 경우, 해당 효과는 33만큼 감소한 후에 적용됩니다. 남은 턴: 2턴.
items.scrolls.exotic.scrollofchallenge$challengearena.name=챌린지 아레나
items.scrolls.exotic.scrollofchallenge.desc=이 두루마리를 소리 내어 읽으면 강력한 포효가 울려 퍼지며 적들을 사용자에게 끌어당기는 동시에 사용자 주변에 작은 영역을 생성합니다. 사용자가 이 영역 안에 머무르는 동안 모든 공격으로부터 받는 피해가 33% 감소하며(다른 피해 감소 효과보다 먼저 적용됨), 포만감도 유지됩니다. 영역의 크기는 사용자가 있는 지역의 크기에 비례하며, 일부 보스 지역에서는 특히 작아집니다.
items.scrolls.exotic.scrollofchallenge.name=도전의 두루마리
items.scrolls.exotic.scrollofdivination$wnddivination.desc=점술서에서 다음과 같은 항목들이 확인되었습니다.
items.scrolls.exotic.scrollofdivination.desc=이 두루마리는 현재 당신이 알지 못하는 네 가지 유형의 아이템을 무작위로 알려줍니다. 알려지는 유형은 물약의 색깔, 두루마리의 룬 문자, 또는 반지의 보석일 수 있습니다. 알려지는 아이템이 당신이 현재 소지하고 있는 아이템일 필요는 없습니다.
items.scrolls.exotic.scrollofdivination.name=점술 두루마리
items.scrolls.exotic.scrollofdivination.nothing_left=더 이상 확인할 것이 없습니다!
items.scrolls.exotic.scrollofdread.desc=이 두루마리를 읽으면 붉은 섬광이 뿜어져 나와 시야 내 모든 적에게 극심한 공포를 심어줍니다. 그 효과는 너무나 강력해서 적들은 순식간에 던전에서 도망쳐 다시는 나타나지 않을 것입니다! 공포 효과와 마찬가지로, 이 효과도 시간이 지나면 사라지거나 적을 공격하면 해제됩니다. 보스와 같이 의지가 강한 적들은 일반적인 공포 효과에 걸립니다.
items.scrolls.exotic.scrollofdread.name=공포의 두루마리
items.scrolls.exotic.scrollofenchantment.armor=갑옷에 적용할 문양을 선택하세요.
items.scrolls.exotic.scrollofenchantment.cancel=취소
items.scrolls.exotic.scrollofenchantment.cancel_warn=취소해도 마법 부여 두루마리는 소모될 텐데, 정말이세요?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=아니요, 마음을 바꿨어요.
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=네, 확실해요.
items.scrolls.exotic.scrollofenchantment.desc=이 두루마리는 무기나 갑옷에 강력한 마법 에너지를 불어넣어 줍니다. 사용자는 어떤 마법이 주입될지 어느 정도 제어할 수도 있습니다.
items.scrolls.exotic.scrollofenchantment.inv_title=아이템에 마법을 부여하세요
items.scrolls.exotic.scrollofenchantment.name=마법의 두루마리
items.scrolls.exotic.scrollofenchantment.weapon=무기에 적용할 마법 부여를 선택하세요.
items.scrolls.exotic.scrollofforesight.desc=이 두루마리를 읽고 나면, 주변 지형의 세부 사항이 수정처럼 선명한 이미지로 끊임없이 독자의 마음에 각인될 것입니다. 이 효과는 상당한 시간 동안 지속되며, 숨겨진 문이나 함정을 모두 드러내어 수색할 필요가 없게 해 줄 것입니다.
items.scrolls.exotic.scrollofforesight.name=미래를 내다보는 두루마리
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=취소해도 변신 주문서는 소모될 텐데, 정말 확실해요?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=변신하고 싶은 재능을 선택하세요.
items.scrolls.exotic.scrollofmetamorphosis.desc=이 두루마리에는 강력한 변환 마법이 담겨 있으며, 아이템이 아닌 시전자 본인에게 적용됩니다. 이 두루마리의 마법을 사용하면 특성 하나를 선택하여 다른 영웅 직업의 동일 등급 특성 다섯 개 중 하나로 교체할 수 있습니다! 이 효과는 직업 특성에만 적용되며, 하위 직업이나 방어구 능력에서 얻는 특성에는 적용되지 않습니다. 사용할 수 없는 특성은 선택지에 나타나지 않습니다.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=재능을 변형시키다
items.scrolls.exotic.scrollofmetamorphosis.name=변신의 두루마리
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=변형된 재능을 대체할 새로운 재능을 선택하세요.
items.scrolls.exotic.scrollofmysticalenergy.desc=이 양피지에 담긴 순수한 마법의 힘은 방출될 때 사용자가 장착한 유물에 시간이 지남에 따라 에너지를 공급할 것입니다.
items.scrolls.exotic.scrollofmysticalenergy.name=신비로운 에너지의 두루마리
items.scrolls.exotic.scrollofpassage.desc=이 양피지에 적힌 마법은 읽는 사람을 즉시 가장 가까운 지역, 즉 위층으로 순간 이동시켜 줍니다. 상점에 빨리 갈 때 아주 유용하죠.
items.scrolls.exotic.scrollofpassage.name=통행의 두루마리
items.scrolls.exotic.scrollofprismaticimage.desc=이 두루마리에 적힌 주문은 읽는 사람의 화려한 환영 쌍둥이를 만들어냅니다. 이 무지개빛 이미지는 읽는 사람의 약한 복제본으로, 방어력은 비슷하지만 체력과 공격력은 더 낮습니다. 무지개빛 이미지는 적이 나타나면 모습을 드러내어 읽는 사람을 보호하려고 합니다. 이미 무지개빛 이미지가 존재한다면, 이 두루마리를 사용하면 해당 이미지의 체력이 완전히 회복됩니다.
items.scrolls.exotic.scrollofprismaticimage.name=프리즘 이미지의 두루마리
items.scrolls.exotic.scrollofpsionicblast.desc=이 두루마리에는 모든 가시적인 생명체의 정신을 파괴할 수 있는 엄청난 파괴력이 담겨 있습니다. 하지만 이 두루마리를 사용하는 사람은 상당한 부작용을 겪게 되며, 피해를 입고 시력을 잃거나 몸이 약해집니다. 두루마리가 더 많은 대상을 공격할수록 자신에게 가해지는 피해는 줄어듭니다.
items.scrolls.exotic.scrollofpsionicblast.name=사이오닉 블래스트 스크롤
items.scrolls.exotic.scrollofpsionicblast.ondeath=사이오닉 블래스트는 당신의 정신을 산산조각냅니다...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=이 생물은 사이렌의 노래가 담긴 두루마리의 마법에 걸렸습니다. 마법에 걸린 캐릭터는 영구적으로 당신의 아군이 되며, 마주치는 모든 적과 싸울 것입니다.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=매료되다
items.scrolls.exotic.scrollofsirenssong.cancel=목표를 선택해야 합니다.
items.scrolls.exotic.scrollofsirenssong.desc=이 두루마리를 읽으면 매혹적인 멜로디가 울려 퍼져 지정된 적을 매혹시켜 영구적으로 아군으로 만듭니다! 이 멜로디를 듣는 다른 적들도 일시적으로 매혹됩니다. 특히 강력한 적은 매혹 효과에 저항할 수 있으며, 대신 매혹됩니다.
items.scrolls.exotic.scrollofsirenssong.name=사이렌의 노래 두루마리
items.scrolls.exotic.scrollofsirenssong.no_target=스크롤은 대상을 지정하지 않아도 활성화됩니다.
