items.scrolls.scroll.tiwaz=티와즈의 두루마리
items.scrolls.scroll.unknown_desc=이 양피지에는 알아볼 수 없는 글씨가 가득하며, 제목으로 %s 룬이 적혀 있다. 소리 내어 읽으면 무슨 일이 일어날까?
items.scrolls.scroll.yngvi=잉비의 두루마리
items.scrolls.scrollofidentify.desc=하나의 아이템에 숨겨진 모든 비밀을 영구적으로 밝혀줍니다.
items.scrolls.scrollofidentify.inv_title=항목을 식별하세요
items.scrolls.scrollofidentify.it_is=귀하의 제품이 %s로 식별되었습니다.
items.scrolls.scrollofidentify.name=감정의 주문서
items.scrolls.scrolloflullaby.desc=잔잔한 멜로디는 시야에 있는 모든 생명체를 깊은 잠에 빠뜨려 도망치거나 기습 공격을 가할 기회를 제공합니다.
items.scrolls.scrolloflullaby.name=자장가의 주문서
items.scrolls.scrolloflullaby.sooth=두루마리에서 잔잔한 멜로디가 흘러나온다. 당신은 몹시 졸려진다.
items.scrolls.scrollofmagicmapping.desc=이 두루마리를 읽으면 수정처럼 맑은 이미지가 기억 속에 새겨져 해당 레벨의 정확한 구조와 숨겨진 모든 비밀을 알려줄 것입니다. 아이템과 몬스터의 위치는 여전히 알 수 없습니다.
items.scrolls.scrollofmagicmapping.layout=이제 여러분은 층별 구조를 알게 되었습니다.
items.scrolls.scrollofmagicmapping.name=마법 지도의 주문서
items.scrolls.scrollofmirrorimage.copies=두루마리에는 당신의 모습이 거울처럼 비춰집니다.
items.scrolls.scrollofmirrorimage.desc=이 두루마리에 적힌 주문은 읽는 사람의 환영 쌍둥이를 만들어내어 그의 적들을 쫓아낼 것입니다.
items.scrolls.scrollofmirrorimage.name=거울상의 주문서
items.scrolls.scrollofmirrorimage.no_copies=두루마리는 당신의 거울 이미지를 만들려고 하지만, 그것들은 갈 곳이 없습니다.
items.scrolls.scrollofrage.desc=이 두루마리를 소리 내어 읽으면 엄청난 포효가 울려 퍼져 모든 적들이 읽는 사람에게 몰려들고 주변의 적들은 격노하게 된다.
items.scrolls.scrollofrage.name=분노의 두루마리
items.scrolls.scrollofrage.roar=두루마리에서 분노에 찬 포효가 터져 나와 던전 전체에 울려 퍼진다!
items.scrolls.scrollofrecharging.desc=이 양피지에 담긴 순수한 마법의 힘은 방출될 때 독자의 모든 지팡이를 최대치로 재충전할 것입니다.
items.scrolls.scrollofrecharging.name=충전의 주문서
items.scrolls.scrollofrecharging.surge=온몸에 에너지가 솟구치며 지팡이에 활력을 불어넣습니다!
items.scrolls.scrollofremovecurse.cleansed=당신의 물건에서 정화의 빛이 뿜어져 나오고, 악의적인 에너지가 사라집니다!
items.scrolls.scrollofremovecurse.desc=이 두루마리에 적힌 주문은 읽는 사람의 무기, 갑옷, 반지, 소지품에 걸린 모든 악한 마법을 즉시 제거하여 착용자가 그것들을 제거할 수 없도록 합니다.
items.scrolls.scrollofremovecurse.inv_title=물건을 세척하세요
items.scrolls.scrollofremovecurse.name=저주 해제의 주문서
items.scrolls.scrollofremovecurse.not_cleansed=물건에서 정화의 빛이 나지만 아무런 변화도 일어나지 않습니다.
items.scrolls.scrollofremovecurse.spirit=당신의 두루마리가 고통받는 영혼을 해방시켜 줍니다!
items.scrolls.scrollofretribution.blast=두루마리에서 강력한 마법의 에너지가 뿜어져 나온다!
items.scrolls.scrollofretribution.desc=이 두루마리에는 읽는 자의 고통을 외부로 방출하는 파괴적인 에너지가 담겨 있습니다. 읽는 자가 약할수록 더 큰 피해를 입힐 수 있으며, 체력이 매우 낮을 때는 대부분의 적을 즉사시킬 수 있습니다. 하지만 이 두루마리를 사용하는 것은 사용자에게 큰 부담을 주어 시력을 잃게 하고 몸을 약화시킵니다.
items.scrolls.scrollofretribution.name=복수의 두루마리
items.scrolls.scrollofteleportation.cant_reach=그곳으로 순간이동할 수는 없어요.
items.scrolls.scrollofteleportation.desc=이 양피지에 적힌 주문은 읽는 자를 던전 내 임의의 장소로 즉시 이동시킵니다. 위험한 상황에서 탈출하는 데 사용할 수 있지만, 운이 나쁜 사람은 훨씬 더 위험한 장소에 도착할 수도 있습니다.
items.scrolls.scrollofteleportation.name=순간이동의 주문서
items.scrolls.scrollofteleportation.no_tele=순간 이동 마법이 실패했다.
items.scrolls.scrollofteleportation.prompt=순간이동할 위치를 선택하세요
items.scrolls.scrollofteleportation.tele=눈 깜짝할 사이에 당신은 레벨의 다른 위치로 순간 이동했습니다.
items.scrolls.scrollofterror.desc=붉은 섬광이 시야에 들어오는 모든 생명체를 공포에 질리게 하여 도망치게 할 것입니다. 도망치는 적을 공격하면 이 효과가 사라집니다.
items.scrolls.scrollofterror.many=두루마리에서 눈부신 붉은 빛이 뿜어져 나오자 괴물들이 도망쳤다!
items.scrolls.scrollofterror.name=공포의 주문서
items.scrolls.scrollofterror.none=두루마리에서 눈부신 붉은빛이 번쩍인다.
items.scrolls.scrollofterror.one=두루마리에서 눈부신 붉은 섬광이 뿜어져 나오자 %s는 도망쳤다!
items.scrolls.scrolloftransmutation.desc=이 두루마리에는 강력한 변환 마법이 담겨 있습니다. 적합한 아이템에 사용하면 같은 종류의 다른 아이템으로 변환됩니다. 마법은 강화, 마법 부여, 문양까지 그대로 유지합니다. 두루마리와 물약은 해당 이국적인 아이템으로, 이국적인 아이템은 두루마리와 물약으로 변환됩니다.
items.scrolls.scrolloftransmutation.inv_title=아이템을 변환하다
items.scrolls.scrolloftransmutation.morph=당신의 물건이 전혀 다른 것으로 변신합니다!
items.scrolls.scrolloftransmutation.name=변환의 두루마리
items.scrolls.scrolloftransmutation.nothing=별다른 흥미로운 일은 일어나지 않습니다.
items.scrolls.scrollofupgrade.desc=이 두루마리는 아이템 하나를 업그레이드하여 품질을 향상시킵니다. 마법 지팡이는 위력과 사용 횟수가 증가하고, 무기는 공격력이 강해지거나 명중률이 높아지며, 갑옷은 더 많은 공격을 막아내고, 반지는 착용자에게 더 강력한 효과를 발휘합니다. 또한 무기와 갑옷을 사용하는 데 필요한 힘이 줄어들고, 아이템에 걸린 저주가 해제됩니다.
items.scrolls.scrollofupgrade.inv_title=아이템 업그레이드
items.scrolls.scrollofupgrade.name=강화의 주문서
items.scrolls.scrollofupgrade.remove_curse=업그레이드 주문서는 아이템에 걸린 저주를 풀어줍니다!
items.scrolls.scrollofupgrade.weaken_curse=업그레이드 주문서는 아이템에 걸린 저주를 약화시킵니다.
items.spells.alchemize$wndalchemizeitem.energize=%d 에너지로 전환하세요
items.spells.alchemize$wndalchemizeitem.energize_1=1을 %d 에너지로 전환
items.spells.alchemize$wndalchemizeitem.energize_all=모든 것을 %d 에너지로 전환하세요
items.spells.alchemize$wndalchemizeitem.sell=%dg로 변환
items.spells.alchemize$wndalchemizeitem.sell_1=1을 %dg로 변환하세요
items.spells.alchemize$wndalchemizeitem.sell_all=모두 %dg로 변환하세요
items.spells.alchemize.desc=이 주문은 연금술 솥에서 발견되는 것과 유사한 변환 능력을 가지고 있습니다. 시전할 때마다 사용자는 아이템(또는 아이템 묶음)을 금이나 연금술 에너지로 바꿀 수 있습니다. 물약이나 두루마리를 에너지로 바꾸면 그 종류까지 식별할 수 있습니다! 상점에서 판매하는 연금술 도구는 몇 가지뿐이지만, 씨앗, 룬스톤, 그리고 약간의 연금술 에너지를 조합하여 연금술로 훨씬 더 많은 도구를 만들 수 있습니다.
items.spells.alchemize.name=연금술
items.spells.alchemize.prompt=아이템을 연금술로 변환하세요
items.spells.beaconofreturning.creatures=주변 생명체의 정신적 기운 때문에 지금은 순간 이동이 불가능합니다.
items.spells.beaconofreturning.desc=이 복잡한 마법은 사용자가 거리에 상관없이 지정된 위치로 돌아갈 수 있게 해줍니다. 마법은 돌아갈 때만 소모되며, 원하는 만큼 위치를 설정할 수 있지만 가장 최근에 설정한 위치만 기억합니다.
items.spells.beaconofreturning.desc_set=이 신호기는 %d 층 어딘가에 설치되었습니다.
items.spells.beaconofreturning.name=귀환의 등대
items.spells.beaconofreturning.preventing=이곳의 강력한 마법 기운 때문에 주문을 사용할 수 없습니다!
items.spells.beaconofreturning.set=신호기가 현재 위치에 설치되었습니다.
items.spells.beaconofreturning.wnd_body=설정을 변경하면 이전에 비콘이 설정되었던 위치가 덮어쓰여집니다. \n\n돌아가기 버튼을 누르면 마지막으로 설정한 위치로 돌아가며 주문 사용 횟수가 1회 소모됩니다.
items.spells.beaconofreturning.wnd_return=반품
items.spells.beaconofreturning.wnd_set=세트
items.spells.curseinfusion.desc=이 주문은 DM-300에 내재된 강력한 악의 마법을 장비에 주입합니다. 이 주문이 사용된 장비는 즉시 저주받게 되며, 기존에 부여되었던 모든 마법이나 문양은 무효화됩니다. 무기, 갑옷, 지팡이의 경우, 저주 외에도 강화 효과가 추가됩니다. 저주 주입으로 인한 강화 효과는 중첩되지 않으며, 저주가 풀리면 강화 효과도 사라집니다. 또한, 여러 번의 저주 주입을 통해 무기나 갑옷에 부여된 저주를 변경할 수도 있습니다.
items.spells.curseinfusion.inv_title=아이템에 저주를 걸다
items.spells.curseinfusion.name=저주 주입
items.spells.magicalinfusion.desc=이 주문은 강화 주문서와 동일한 마법력을 지니지만, 더욱 안정적인 형태입니다. 또한 일반적인 아이템 강화 기능 외에도, 마법 부여, 문양, 저주를 절대 지우지 않습니다.
items.spells.magicalinfusion.infuse=당신의 아이템에 신비로운 에너지가 깃들었습니다!
items.spells.magicalinfusion.inv_title=아이템에 주입하기
items.spells.magicalinfusion.name=마법의 주입
items.spells.magicalporter.desc=이 마법은 시전 대상 아이템을 마법적으로 이동시킵니다. 하지만 상인의 신호기와는 달리, 아이템은 다음 보스 층의 입구로 이동합니다.
items.spells.magicalporter.inv_title=물품을 운반하세요
items.spells.magicalporter.name=마법의 짐꾼
items.spells.magicalporter.nowhere=아이템을 옮길 곳이 없습니다.
items.spells.phaseshift.desc=이 혼돈의 마법은 시전 대상을 현재 층의 임의 위치로 순간 이동시키고 상당한 시간 동안 기절시킵니다. 강력한 적은 기절 효과에 저항할 수 있습니다. 이 마법은 대상을 직접 공격하거나 시전자 자신에게 사용할 수 있습니다.
items.spells.phaseshift.name=위상차
items.spells.phaseshift.no_target=그곳으로 순간 이동할 수 있는 것은 아무것도 없습니다.
items.spells.reclaimtrap.desc=이 주문에는 DM-300의 기계 에너지 잔여물이 포함되어 있습니다. 작동 중인 함정에 시전하면 함정의 힘이 당신에게 붙어, 주문을 다시 사용하여 이 힘을 방출하고 원하는 위치에서 함정의 효과를 발동시킬 수 있습니다. 하지만 일부 함정은 모든 장소에서 작동하지 않을 수 있으며, 한 번에 하나의 함정만 저장할 수 있습니다.
items.spells.reclaimtrap.desc_trap=해당 주문은 현재 _%s_를 발동시킬 준비가 되어 있습니다.
items.spells.reclaimtrap.name=함정을 되찾다
items.spells.reclaimtrap.no_trap=거기에는 함정이 없습니다.
items.spells.recycle.desc=이 주문은 변형 마법의 하위 형태를 띠고 있습니다. 장비에는 효과가 없지만, 두루마리, 물약, 씨앗, 룬석 또는 화살촉이 달린 다트를 같은 종류의 임의 아이템으로 변형시킬 수 있습니다.
items.spells.recycle.inv_title=물건을 재활용하세요
items.spells.recycle.name=재활용
items.spells.recycle.recycled=해당 제품은 %s로 재활용되었습니다.
items.spells.spell.ac_cast=깁스
items.spells.spell.discover_hint=이 아이템은 연금술을 통해 제작할 수 있습니다.
items.spells.spell.no_magic=마법 면역 상태에서는 주문을 시전할 수 없습니다.
items.spells.summonelemental.ac_imbue=주입하다
items.spells.summonelemental.desc=이 주문은 주문을 만드는 데 사용된 정령의 불씨 에너지를 집중시켜, 당신과 함께 싸울 아군 정령을 소환할 수 있게 해줍니다! 한 번에 하나의 정령만 소환할 수 있지만, 주문을 다시 시전하면 추가 비용 없이 소환된 정령을 되돌릴 수 있습니다.
items.spells.summonelemental.desc_chaos=현재 이 주문은 혼돈의 에너지를 방출하고 있으며, 혼돈의 정령을 소환합니다. 다른 아이템에 마법을 부여할 수는 있지만, 현재 부여된 마법 효과는 사라집니다.
items.spells.summonelemental.desc_fire=현재 이 주문은 매우 뜨거우며, 불의 정령을 소환합니다. 다른 아이템에 마법을 부여할 수는 있지만, 현재 부여된 마법 효과는 사라집니다.
items.spells.summonelemental.desc_frost=현재 이 주문은 차가운 성질을 지니고 있으며, _서리 정령_을 소환합니다. 다른 아이템에 마법을 부여할 수는 있지만, 그렇게 하면 현재 부여된 마법 효과가 사라집니다.
items.spells.summonelemental.desc_newborn=현재 이 주문은 강화되지 않은 상태이며, 원거리 공격 능력이 없는 _갓 태어난 정령_을 소환합니다. 액체 화염 물약, 냉기 물약, 재충전 주문서 또는 변환 주문서를 사용하여 주문의 위력을 강화하면, 앞으로 소환하는 정령은 완전한 위력을 갖게 됩니다!
items.spells.summonelemental.desc_shock=현재 주문은 정전기를 방출하고 있으며, 충격 정령을 소환합니다. 다른 아이템에 마법을 부여할 수는 있지만, 현재 부여된 마법 효과는 사라집니다.
items.spells.summonelemental.imbue_prompt=아이템에 부여하다
items.spells.summonelemental.name=정령 소환
items.spells.targetedspell.inv_title=아이템에 주입하기
items.spells.targetedspell.prompt=목표를 선택하세요
items.spells.telekineticgrab.cant_grab=저건 잡을 수 없어.
items.spells.telekineticgrab.desc=이 주문은 시전자가 특정 위치에 있는 모든 아이템이나 적에게 박힌 모든 투척 무기를 원격으로 잡을 수 있게 해줍니다! 하지만 다른 사람이 소유한 아이템이나 상자 같은 용기는 잡을 수 없습니다.
items.spells.telekineticgrab.name=염력을 이용한 잡기
items.spells.telekineticgrab.no_target=거기엔 잡을 게 아무것도 없어.
items.spells.unstablespell.desc=이 작은 검은색 정사각형 수정에는 각 면에 변하는 룬 문자가 새겨져 있습니다. (\n\n) 활성화되면 무작위 두루마리의 효과가 발동됩니다. 시야에 적이 있으면 두루마리 효과는 항상 전투에 집중되고, 그렇지 않으면 비전투에 집중됩니다.
items.spells.unstablespell.name=불안정한 주문
items.spells.wildenergy.desc=이 주문에는 DM-300에 동력을 공급했던 저주받은 에너지의 일부가 담겨 있습니다. 시전하면 지팡이와 착용한 유물이 재충전되는 동시에 무작위로 저주받은 지팡이 효과가 발동됩니다. 저주받은 마법이 발동될 방향을 선택할 수도 있습니다.
items.spells.wildenergy.name=야생 에너지
items.stones.inventorystone.ac_use=사용
items.stones.runestone$placeholder.name=룬스톤
items.stones.runestone.discover_hint=이 아이템은 던전에서 무작위로 획득하거나 연금술을 통해 제작할 수 있습니다.
items.stones.stoneofaggression$aggression.desc=조종 마법으로 인해 주변의 모든 적들이 이 캐릭터를 공격하는 것을 선호하게 되었습니다. 남은 턴:
items.stones.stoneofaggression$aggression.name=목표로 삼은
items.stones.stoneofaggression.desc=이 돌을 아군이나 적에게 던지면, 주변의 모든 적들이 잠시 동안 해당 캐릭터를 우선적으로 공격합니다. 단, 보스 몬스터는 이 효과에 저항할 수 있으며, 저항 시 지속 시간이 크게 줄어들고 보스 몬스터의 하수인 공격으로 받는 피해량도 감소합니다.
items.stones.stoneofaggression.name=공격의 돌
items.stones.stoneofaugmentation$wndaugment.cancel=괜찮아요
items.stones.stoneofaugmentation$wndaugment.choice=어떤 부분을 개선하고 싶으신가요?
items.stones.stoneofaugmentation$wndaugment.damage=손상
items.stones.stoneofaugmentation$wndaugment.defense=방어
items.stones.stoneofaugmentation$wndaugment.evasion=회피
items.stones.stoneofaugmentation$wndaugment.none=증강 제거
items.stones.stoneofaugmentation$wndaugment.speed=속도
items.stones.stoneofaugmentation.desc=이 룬스톤은 강력한 마법을 지니고 있어 장비의 속성을 강화하여 한 가지 속성을 다른 속성보다 약화시킬 수 있습니다. 무기에 장착하면 속도 또는 공격력 중 하나를 강화할 수 있으며, 투척 무기는 속도에 비례하여 내구도가 증가하거나 감소합니다. 갑옷에 장착하면 방어력 또는 회피율 중 하나를 강화할 수 있습니다.
items.stones.stoneofaugmentation.discover_hint=이 아이템은 상점에서 구입하거나 연금술을 통해 제작할 수 있습니다.
items.stones.stoneofaugmentation.inv_title=아이템을 강화하세요
items.stones.stoneofaugmentation.name=증강석
items.stones.stoneofblast.desc=이 룬스톤은 던지는 즉시 그 자리에서 폭발합니다. 폭탄처럼 폭발은 주변의 모든 것에 피해를 입힙니다.
items.stones.stoneofblast.name=폭발의 돌
items.stones.stoneofblink.desc=이 룬스톤은 던진 위치로 사용자를 순간 이동시킵니다.
items.stones.stoneofblink.name=깜빡임의 돌
items.stones.stoneofclairvoyance.desc=이 돌을 던지면 주변 넓은 영역의 모든 타일이 즉시 드러납니다. 그 효과는 벽을 통과해서도 미칩니다.
items.stones.stoneofclairvoyance.name=투시력의 돌
items.stones.stoneofdeepsleep.desc=이 돌을 적에게 던지면 적은 깊은 마법의 잠에 빠지게 됩니다. 마법에 걸린 적은 방해받을 때까지 영원히 잠들어 있게 됩니다.
items.stones.stoneofdeepsleep.name=깊은 잠의 돌
items.stones.stoneofdetectmagic.desc=이 룬스톤은 아이템에 걸린 마법을 감지할 수 있습니다. 미확인 아이템에 이 룬스톤을 사용하면 악의적인 저주에 걸렸는지, 아니면 마법 부여나 강화와 같은 긍정적인 마법의 영향을 받았는지 알 수 있습니다.
items.stones.stoneofdetectmagic.detected_bad=이 아이템에 악의적인 마법이 작용하고 있음을 감지했습니다!
items.stones.stoneofdetectmagic.detected_both=당신은 이 물건에 긍정적인 마법과 악의적인 마법이 모두 작용하고 있음을 감지했습니다!
items.stones.stoneofdetectmagic.detected_good=이 아이템에 긍정적인 마법의 기운이 감지되었습니다!
items.stones.stoneofdetectmagic.detected_none=이 아이템에 마법의 영향이 느껴지지 않습니다.
items.stones.stoneofdetectmagic.inv_title=항목을 감지합니다
items.stones.stoneofdetectmagic.name=마법을 감지하는 돌
items.stones.stoneofdisarming.desc=이 룬스톤에는 던전 곳곳에 숨겨진 위험한 함정을 무력화할 수 있는 마법이 깃들어 있습니다. 던지는 지점 주변의 함정 9개를 동시에 해제할 수 있습니다.
items.stones.stoneofdisarming.name=무장 해제의 돌
items.stones.stoneofenchantment.armor=당신의 갑옷이 어둠 속에서 빛납니다!
items.stones.stoneofenchantment.desc=이 룬스톤은 매혹적인 마법을 지니고 있습니다. 강화 주문서와는 달리 아이템의 직접적인 위력을 증가시키지는 않지만, 무기나 갑옷에 마법을 부여하여 새로운 능력을 선사합니다.
items.stones.stoneofenchantment.inv_title=아이템에 마법을 부여하세요
items.stones.stoneofenchantment.name=마법의 돌
items.stones.stoneofenchantment.weapon=당신의 무기는 어둠 속에서 빛납니다!
items.stones.stoneoffear.desc=이 돌을 캐릭터에게 던지면 캐릭터는 극심한 공포에 휩싸여 도망칩니다. 도망치는 캐릭터를 공격하면 효과 지속 시간이 줄어듭니다.
items.stones.stoneoffear.name=공포의 돌
items.stones.stoneofflock.desc=이 룬스톤은 던진 위치 주변에 짧은 시간 동안 마법의 양을 소환합니다.
items.stones.stoneofflock.name=양떼의 돌
items.stones.stoneofintuition$wndguess.break=당신의 직관이라는 돌이 먼지로 부서져 버립니다...
items.stones.stoneofintuition$wndguess.correct=맞습니다. 해당 품목의 종류가 확인되었습니다!
items.stones.stoneofintuition$wndguess.incorrect=당신의 추측은 틀렸습니다.
items.stones.stoneofintuition$wndguess.text=이 미확인 물체의 종류가 무엇일지 맞춰보세요. 정답을 맞추시면 종류를 알려드립니다!
items.stones.stoneofintuition.break_info=직관의 돌은 하나가 부서지기 전에 두 번 사용할 수 있으며, 다음 사용 시에는 돌이 소모되지 않습니다.
items.stones.stoneofintuition.break_warn=이전에 직관의 돌을 사용했으므로, 다음에 사용할 때는 돌이 소모됩니다.
items.stones.stoneofintuition.desc=이 룬스톤은 감정 두루마리에 담긴 마법보다 약한 힘을 지니고 있습니다. 아이템을 직접 감정하는 대신, 직관에 의존하여 물약, 두루마리, 반지 등의 종류를 추측할 수 있게 해줍니다.
items.stones.stoneofintuition.inv_title=항목을 선택하세요
items.stones.stoneofintuition.name=직관의 돌
items.stones.stoneofshock.desc=이 룬스톤은 강력한 전기 에너지를 방출하여 주변의 모든 대상을 잠시 기절시키고, 명중한 대상 하나당 투척 지팡이에 충전량을 부여합니다.
items.stones.stoneofshock.name=충격의 돌
items.stylus.ac_inscribe=쓰다
items.stylus.cursed=스타일러스의 마법은 저주받은 갑옷에는 통하지 않을 것이다.
items.stylus.desc=이 신비로운 스타일러스는 어둡고 매우 단단한 돌로 만들어졌습니다. 이것을 사용하면 갑옷에 마법 문자를 새길 수 있지만, 어떤 문자가 새겨질지는 선택할 수 없고 스타일러스가 알아서 결정합니다.
items.stylus.identify=먼저 그 갑옷이 저주받은 것인지 확인해야 합니다.
items.stylus.inscribed=당신은 스타일러스로 갑옷에 글자를 새겼습니다.
items.stylus.name=신비로운 스타일러스
items.stylus.prompt=갑옷을 선택하세요
items.tengusmask.ac_wear=입다
items.tengusmask.desc=이 가면은 텐구가 죽을 때 얼굴에서 떨어져 나갔는데, 가면에서 뿜어져 나오는 엄청난 마법의 기운을 느낄 수 있습니다. 이 가면이 텐구의 힘의 원천이었을까요? 이 가면을 착용하면 가면의 엄청난 힘이 당신에게 전해져 영웅의 하위 직업을 선택할 수 있게 됩니다. 어떤 하위 직업을 선택하시겠습니까?
items.tengusmask.discover_hint=이 아이템은 특정 적에게서 드롭으로 획득할 수 있습니다.
items.tengusmask.name=텐구의 가면
items.tengusmask.used=가면의 힘이 당신에게 흘러들어가면서 가면은 산산이 조각납니다!
items.torch.ac_light=빛
items.torch.desc=모험에 필수적인 아이템인 손전등은 던전이 어두워졌을 때 길을 밝혀주는 데 도움을 줄 수 있습니다.
items.torch.name=토치
items.trinkets.chaoticcenser.desc=연금술 솥에서 일정 시간이 지나면 이 향로가 저절로 연기를 내뿜기 시작합니다! 이 가스들은 축적되어 불규칙적인 간격으로 적들을 향해 분출됩니다. 다양한 종류의 가스를 생성할 수 있는 것처럼 보이지만, 향로가 작동하기 직전에 경고 메시지가 표시됩니다.
items.trinkets.chaoticcenser.name=혼돈의 향로
items.trinkets.chaoticcenser.spew=향로에서 곧 %s가 쏟아져 나올 겁니다.
items.trinkets.chaoticcenser.stats_desc=현재 레벨에서 이 장신구는 대략 _%d_ 턴마다 적 근처에 유해 가스를 생성합니다. 가스는 적이 있을 때만 나타납니다. 레벨이 높아질수록 이러한 가스는 더욱 강력하고 희귀한 종류로 변할 가능성이 커집니다.
items.trinkets.chaoticcenser.typical_stats_desc=일반적으로 이 장신구는 약 _%d_ 턴마다 적 근처에 유해한 가스를 생성합니다. 가스는 적이 있을 때만 나타납니다. 레벨이 높을수록 이러한 가스는 희귀하고 강력한 가스가 될 가능성이 높아집니다.
items.trinkets.crackedspyglass.desc=이 휴대용 망원경은 앞쪽 렌즈에 금이 가지 않았더라면 훌륭하고 정교한 장인정신을 보여주는 작품이었을 겁니다. 이 망원경은 던전에서 새로운 아이템을 발견하는 데 도움을 주는 것 같지만, 금이 간 탓에 드러난 아이템을 제대로 보기가 어렵습니다!
items.trinkets.crackedspyglass.name=금이 간 망원경
items.trinkets.crackedspyglass.stats_desc=현재 레벨에서 이 장신구는 보스 층을 제외한 각 층에서 추가 숨겨진 아이템을 생성할 확률이 _%1$s%%입니다._
items.trinkets.crackedspyglass.stats_desc_upgraded=현재 레벨에서 이 장신구는 보스 층을 제외한 각 층에서 추가 숨겨진 아이템을 생성할 확률이 _100%%이고, 두 번째 추가 숨겨진 아이템을 생성할 확률이 _%1$s%%입니다.
items.trinkets.crackedspyglass.typical_stats_desc=일반적으로 이 장신구는 보스 층을 제외한 각 층에서 추가 숨겨진 아이템을 생성할 확률이 _%1$s%%입니다._
items.trinkets.dimensionalsundial.desc=이 작은 휴대용 해시계는 똑바로 들고 있지 않아도 지하 감옥 깊숙한 곳에서 그림자를 드리울 수 있는 신기한 능력을 지녔습니다. 더욱 기이한 것은 그림자의 위치가 이 세계의 태양과는 아무런 관련이 없어 보인다는 점입니다. 그림자가 드리워지지 않을 때는 해시계가 위험을 끌어들이는 듯합니다.
items.trinkets.dimensionalsundial.name=차원 해시계
items.trinkets.dimensionalsundial.stats_desc=현재 레벨에서 이 장신구는 현실 시간으로 낮 시간(오전 8시~오후 8시)에는 적 생성률을 _%1$d%%_만큼 감소시키고, 밤 시간(오후 8시~오전 8시)에는 적 생성률을 _%2$d%%_만큼 증가시킵니다.
items.trinkets.dimensionalsundial.typical_stats_desc=일반적으로 이 장신구는 현실 시간으로 낮 시간(오전 8시~오후 8시)에는 적의 생성률을 _%1$d%%_만큼 감소시키고, 밤 시간(오후 8시~오전 8시)에는 적의 생성률을 _%2$d%%_만큼 증가시킵니다.
items.trinkets.dimensionalsundial.warning=해시계에 그림자가 드리워지지 않자 불안한 기분이 듭니다.
items.trinkets.exoticcrystals.desc=이 작은 분홍색 결정들은 연금술 에너지 결정과 같은 모양을 하고 있습니다. 직접적으로 에너지를 얻는 데 사용할 수는 없지만, 발견하는 물약이나 두루마리에 어떤 식으로든 영향을 미치는 것으로 보입니다.
items.trinkets.exoticcrystals.name=이국적인 크리스탈
items.trinkets.exoticcrystals.stats_desc=현재 레벨에서 이 장신구는 _%s%%_개의 물약 또는 주문서 드롭을 해당 희귀 등급의 아이템으로 대체합니다. 단, 힘의 물약, 업그레이드 주문서, 위험 구역 해결에 도움이 되는 아이템은 영향을 받지 않습니다.
items.trinkets.exoticcrystals.typical_stats_desc=일반적으로 이 장신구는 _%s%%_개의 물약이나 주문서 드롭 아이템을 해당 희귀 등급의 아이템으로 대체합니다. 단, 힘의 물약, 업그레이드 주문서 또는 위험 구역 해결에 도움이 되는 아이템은 영향을 받지 않습니다.
items.trinkets.eyeofnewt.desc=황금빛과 검은색이 어우러진 이 도롱뇽 눈은 흔한 재료이지만, 이제는 고급 장신구로 탈바꿈했습니다. 이 눈은 시력을 저하시키는 대신 다른 방식으로 사물을 볼 수 있게 해준다고 합니다.
items.trinkets.eyeofnewt.name=도롱뇽 눈
items.trinkets.eyeofnewt.stats_desc=현재 레벨에서 이 장신구는 시야 범위를 _%1$s%%_만큼 감소시키지만, _%2$d_ 타일 이내의 적에 대한 정신 시야를 부여합니다.
items.trinkets.eyeofnewt.typical_stats_desc=일반적으로 이 장신구는 시야 범위를 _%1$s%%_만큼 감소시키지만, _%2$d_ 타일 이내의 적에 대한 정신 시야를 부여합니다.
items.trinkets.ferrettuft.desc=부드러운 흰 담비털 한 뭉치가 연두색 리본으로 묶여 나비 모양으로 장식되어 있다. 담비는 민첩하고 장난기가 많으며 정직하지 못한 것으로 유명하다. 이 장신구에서는 담비의 특유의 힘이 뿜어져 나와 주변의 모든 것을 피하는 능력을 강화하는 듯하다.
items.trinkets.ferrettuft.name=족제비털
items.trinkets.ferrettuft.stats_desc=현재 레벨에서 이 장신구는 모든 캐릭터의 회피율을 _%1$s%%_만큼 증가시킵니다.
items.trinkets.ferrettuft.typical_stats_desc=일반적으로 이 장신구는 모든 캐릭터의 회피율을 _%1$s%%_만큼 증가시킵니다.
items.trinkets.mimictooth.desc=이 크고 날카로운 이빨은 틀림없이 몹시 불행한 미믹에게서 뽑힌 것일 겁니다. 이것이 던전의 미믹들에게 영향을 미쳐, 미믹들이 더 자주 나타나고 더 위험해지게 만드는 것 같습니다.
items.trinkets.mimictooth.name=모방 치아
items.trinkets.mimictooth.stats_desc=현재 레벨에서 이 장신구는 모든 종류의 미믹 _%1$sx_의 출현 빈도를 높이고 탐지하기 어렵게 만들지만, 드롭하는 전리품의 양도 증가시킵니다. 또한 각 던전 층에는 _%2$s%%_ 확률로 은신 에보니 미믹이 추가로 등장합니다.
items.trinkets.mimictooth.typical_stats_desc=일반적으로 이 장신구는 모든 종류의 미믹 _%1$sx_의 출현 빈도를 높이고 탐지하기 어렵게 만들지만, 드롭하는 전리품의 양도 증가시킵니다. 또한 각 던전 층에는 _%2$s%%_ 확률로 은신 에보니 미믹이 추가로 등장합니다.
items.trinkets.mossyclump.desc=이 축축한 이끼 덩어리는 아무리 세게 쥐어짜도 수분을 머금고 있는 듯하다. 마치 마법처럼 던전 자체에 연결되어 있어서 풀과 물이 더 쉽게 솟아나게 하는 것 같다.
items.trinkets.mossyclump.name=이끼 덩어리
items.trinkets.mossyclump.stats_desc=현재 레벨에서 이 장신구는 테마가 없는 바닥의 _%d%%_개를 물이나 잔디로 채웁니다.\n\n 이 장신구를 업그레이드하려면 더 많은 에너지가 필요합니다.
items.trinkets.mossyclump.typical_stats_desc=일반적으로 이 장신구는 테마가 없는 바닥을 물이나 잔디로 채웁니다. 이 장신구를 업그레이드하려면 더 많은 에너지가 필요합니다.
items.trinkets.parchmentscrap.desc=이 작은 양피지 조각은 두루마리에서 나온 것 같습니다. 마법의 기운이 일부 남아 있으며, 던전에서 발견되는 무기와 갑옷에 영향을 미치는 듯합니다.
items.trinkets.parchmentscrap.name=양피지 조각
items.trinkets.parchmentscrap.stats_desc=현재 레벨에서 이 장신구는 마법 부여와 문양을 일반 등급으로, 무기와 갑옷에 걸린 저주를 일반 등급으로 만듭니다. 지팡이, 반지 또는 유물에 걸린 저주는 영향을 받지 않습니다. (\n\n) 이 장신구를 업그레이드하려면 더 많은 에너지가 필요합니다.
items.trinkets.parchmentscrap.typical_stats_desc=일반적으로 이 장신구는 마법 부여와 문양(_%dx_)을 흔하게 만들고, 무기와 갑옷에 저주(_%sx_)를 흔하게 만듭니다. 지팡이, 반지 또는 유물에 걸린 저주는 영향을 받지 않습니다. 이 장신구는 업그레이드하는 데 더 많은 에너지가 필요합니다.
items.trinkets.petrifiedseed.desc=이 씨앗은 느린 지질학적 과정이나 마법에 의해 화석화되었습니다. 이 씨앗은 던전의 식물에 마법적인 영향을 미치는 것으로 보이며, 때때로 식물 씨앗을 룬석으로 대체합니다.
items.trinkets.petrifiedseed.name=화석화된 씨앗
items.trinkets.petrifiedseed.stats_desc=현재 레벨에서 이 장신구는 밟힌 풀에서 씨앗 대신 _%1$s%%_이 드롭되도록 하고, 또한 키 큰 풀에서 _%2$s%%_ 아이템이 더 자주 드롭되도록 합니다.
items.trinkets.petrifiedseed.typical_stats_desc=일반적으로 이 장신구는 밟힌 풀에서 씨앗 대신 룬석이 드롭되도록 하며, 키가 큰 풀에서는 아이템이 더 자주 드롭되도록 합니다.
items.trinkets.ratskull.desc=이 섬뜩한 장신구는 일반 쥐의 두개골보다 크지 않은데, 어쩐지 이 던전에서는 쥐 두개골이 매우 드물다. 두개골의 마법적인 영향력은 던전의 더욱 희귀한 거주자들을 끌어들이는 듯하며, 그들이 훨씬 더 자주 나타나게 한다.
items.trinkets.ratskull.name=쥐 두개골
items.trinkets.ratskull.stats_desc=현재 레벨에서 이 장신구는 희귀한 이국적인 적 _%dx_의 출현 확률을 높여줍니다. 하지만 해골은 수정 모방체와 갑옷 조각상을 유인하는 데는 절반의 효과만 있습니다.
items.trinkets.ratskull.typical_stats_desc=일반적으로 이 장신구는 희귀한 이국적인 적 _%dx_의 출현 확률을 높여줍니다. 하지만 해골은 수정 모방체와 갑옷 조각상을 유인하는 데는 절반 정도의 효과만 있습니다.
items.trinkets.saltcube.desc=이 거대한 소금 결정은 거의 완벽한 정육면체 모양으로 잘려 있었는데, 신기하게도 연금술 솥에서 녹는 대신 물의 절반을 빨아들였습니다. 이 소금은 마법처럼 음식을 탈수시키고 보존하여 포만감을 오래 유지시켜 주지만, 굶주리지 않았을 때는 체력 회복 속도를 늦추는 것 같습니다.
items.trinkets.saltcube.name=소금 큐브
items.trinkets.saltcube.stats_desc=현재 레벨에서 이 장신구는 배고픔을 느끼기까지의 시간을 _%1$s%%_만큼 늘려주지만, 층이 잠겨 있지 않은 경우 체력 회복 속도를 _%2$s%%_만큼 감소시킵니다.
items.trinkets.saltcube.typical_stats_desc=일반적으로 이 장신구는 배고픔을 느끼기까지의 시간을 _%1$s%%_만큼 늘려주지만, 바닥이 잠겨 있지 않은 한 체력 회복 속도를 _%2$s%%_만큼 감소시킵니다.
items.trinkets.shardofoblivion$thrownusetracker.desc=당신은 최근에 정체를 알 수 없는 투척 무기를 사용했습니다. 이는 잠시 동안 망각의 파편에 사용된 정체불명의 장비 1개로 간주됩니다. \n\n남은 턴: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=정체불명의 투척 무기 사용
items.trinkets.shardofoblivion$wandusetracker.desc=최근에 정체불명의 지팡이를 사용하셨습니다. 이는 잠시 동안 망각의 조각에 사용된 정체불명의 장비 1개로 간주됩니다. \n\n남은 턴: %s.
items.trinkets.shardofoblivion$wandusetracker.name=정체불명의 지팡이 사용
items.trinkets.shardofoblivion.ac_identify=식별하다
items.trinkets.shardofoblivion.desc=연금술 솥에서 끓인 후, 이 저주받은 금속 조각은 아무것도 없는 것으로 변했습니다. 빛이 그 주위를 휘감는 듯하고, 손에 쥐고 있지 않으면 제자리에 떠 있습니다. 이 조각은 당신의 무지에서 마법적인 힘을 빨아들이는 것 같으니, 너무 깊이 생각하지 않는 게 좋을 겁니다.
items.trinkets.shardofoblivion.identify=물건을 맞춰보세요!
items.trinkets.shardofoblivion.identify_not_yet=해당 품목은 아직 식별 준비가 되지 않았습니다.
items.trinkets.shardofoblivion.identify_prompt=항목을 식별하세요
items.trinkets.shardofoblivion.identify_ready=아이템 %s를 감정할 준비가 되었습니다. 망각의 파편을 사용하여 감정을 진행하세요.
items.trinkets.shardofoblivion.identify_ready_worn=착용했던 아이템들을 이제 모두 감정할 준비가 되었습니다. 망각의 조각을 아이템에 사용하여 감정을 진행하세요.
items.trinkets.shardofoblivion.name=망각의 조각
items.trinkets.shardofoblivion.stats_desc=현재 레벨에서 이 장신구는 장착했거나 최근 사용한 미확인 장비 하나당 적의 전리품 드롭률을 20%%씩 증가시키며, 최대 _%d개_까지 증가합니다. 또한 이 파편은 장비 감정을 불가능하게 하지만, 감정 준비가 완료된 아이템을 수동으로 감정하는 데 사용할 수 있습니다.
items.trinkets.shardofoblivion.typical_stats_desc=일반적으로 이 장신구는 장착했거나 최근 사용한 미확인 장비 하나당 적의 전리품 드롭률을 20%%씩 증가시키며, 최대 _%d개_까지 증가합니다. 또한 이 파편은 장비 감정을 불가능하게 하지만, 감정 준비가 완료된 아이템을 수동으로 감정하는 데 사용할 수 있습니다.
items.trinkets.thirteenleafclover.desc=어찌 된 일인지 연금술 솥에서 끓이는 동안 이 클로버에 잎이 잔뜩 자랐네요! 이 장신구가 행운을 가져다줄지 불운을 가져다줄지는 확실하지 않지만, 어쩌면 운을 더 엉망으로 만들지도 모르겠어요.
items.trinkets.thirteenleafclover.name=열세잎클로버
items.trinkets.thirteenleafclover.stats_desc=현재 레벨에서 이 장신구는 일정 확률로 최대 피해를 입히고, 일정 확률로 최소 피해를 입힙니다.
items.trinkets.thirteenleafclover.typical_stats_desc=일반적으로 이 장신구는 일정 확률로 최대 피해를 입히고, 일정 확률로 최소 피해를 입힙니다.
items.trinkets.trapmechanism.desc=던전 함정의 핵심 메커니즘으로, 운반할 수 있도록 바닥에서 정교하게 조각되어 있습니다. 마법적으로 던전 자체와 연결되어 있는 듯하며, 위험한 지형을 더 자주 만나게 하지만 동시에 던전에 대한 친밀도를 높여줍니다.
items.trinkets.trapmechanism.name=함정 메커니즘
items.trinkets.trapmechanism.stats_desc=현재 레벨에서 이 장신구는 테마가 없는 바닥의 _%1$d%%_개를 함정이나 틈으로 채웁니다. 또한 던전의 숨겨진 함정 중 _%2$d%%_개가 보이게 됩니다.
items.trinkets.trapmechanism.typical_stats_desc=일반적으로 이 장신구는 테마가 없는 바닥의 _%1$d%%_개를 함정이나 틈으로 채웁니다. 또한 던전의 숨겨진 함정 중 _%2$d%%_개가 보이게 됩니다.
items.trinkets.trinket$placeholder.name=하찮은 것
items.trinkets.trinket.discover_hint=이 아이템은 연금술을 통해 장신구를 제작할 때 획득할 수 있는 옵션 중 하나로 등장할 가능성이 있습니다.
items.trinkets.trinketcatalyst$randomtrinket.desc=근처에 있는 물건 하나가 열 수 없는 주머니 안에 갇혀 있습니다. 연금술 과정을 통해 주머니를 녹일 수 있지만, 어떤 장신구가 나올지는 과정을 거치기 전까지는 알 수 없습니다!
items.trinkets.trinketcatalyst$randomtrinket.name=랜덤 장신구
items.trinkets.trinketcatalyst.desc=이 마법의 황금 가루 구슬은 던전의 어둠 속에서 반짝입니다. 이 촉매는 약간의 연금술 에너지와 함께 연금술 솥에 넣어 특별한 장신구를 만들 수 있습니다. 장신구는 던전이나 그 안에 사는 생물들에게 다양한 효과를 부여합니다. 에너지를 더 투자하면 효과가 더욱 강력해지거나, 버리면 효과가 사라집니다.
items.trinkets.trinketcatalyst.name=마법의 촉매제
items.trinkets.trinketcatalyst.window_text=촉매를 넣으면 물이 빛나기 시작합니다. 주변에 있는 몇 가지 물건에 에너지를 불어넣어 마법의 장신구로 만들 수 있습니다.
items.trinkets.trinketcatalyst.window_title=장신구를 만들다
items.trinkets.vialofblood.desc=이 가느다란 병에는 던전 거주자의 피가 담겨 있는데, 병을 돌리면 피가 천천히 움직입니다. 이 피는 강력한 치유 효과를 마법적으로 증폭시키는 듯하지만, 동시에 치유 효과가 나타나는 시간을 지연시키기도 합니다.
items.trinkets.vialofblood.name=혈액 한 병
items.trinkets.vialofblood.stats_desc=현재 레벨에서 이 장신구는 회복 물약, 물통, 또는 생명의 샘을 마셨을 때 얻는 전체 생명력을 _%1$s%%_만큼 증가시킵니다. 하지만 이러한 회복 효과는 더 느리게 작용하여 턴당 최대 _%2$s_ HP만 회복합니다(이 수치는 영웅 레벨에 따라 증가합니다).
items.trinkets.vialofblood.typical_stats_desc=일반적으로 이 장신구는 회복 물약, 물통, 또는 회복의 샘을 마셨을 때 얻는 전체 체력을 _%1$s%%_만큼 증가시킵니다. 하지만 이러한 회복 효과는 더 느리게 나타나며, 턴당 최대 _%2$s_ HP까지만 회복됩니다(이 수치는 영웅 레벨에 따라 증가합니다).
items.trinkets.wondrousresin.desc=이 반짝이는 푸른색 수지는 저주받은 지팡이의 마법이 응축된 정수처럼 보입니다. 연금술 솥의 마법이 어느 정도 안정화시킨 덕분에 이제 당신의 지팡이에도 영향을 미치고 있습니다.
items.trinkets.wondrousresin.name=놀라운 수지
items.trinkets.wondrousresin.stats_desc=현재 레벨에서 이 장신구는 저주받은 지팡이 효과를 일정 확률로 중립 또는 긍정적으로 바꾸고, 저주받지 않은 지팡이가 일정 확률로 추가적인 중립 또는 긍정적인 저주받은 전기 충격을 가하게 합니다. 이 장신구를 업그레이드하려면 더 많은 에너지가 필요합니다.
items.trinkets.wondrousresin.typical_stats_desc=일반적으로 이 장신구는 저주받은 지팡이 효과를 일정 확률로 중립 또는 긍정적으로 바꾸고, 저주받지 않은 지팡이가 일정 확률로 추가적인 중립 또는 긍정적인 저주받은 전기 충격을 가하게 합니다. 이 장신구를 업그레이드하려면 더 많은 에너지가 필요합니다.
items.wands.cursedwand.disguise=당신의 외모가 눈앞에서 변합니다!
items.wands.cursedwand.fire=타는 냄새가 나네요...
items.wands.cursedwand.grass=주변에서 풀들이 솟아오릅니다!
items.wands.cursedwand.gravity=중력이 갑자기 제멋대로 작용하기 시작했다!
items.wands.cursedwand.gravity_end=중력의 혼란이 끝난다.
items.wands.cursedwand.gravity_positive=중력이 갑자기 무작위 방향으로 작용하기 시작하지만, 당신에게는 아무런 영향도 미치지 않는 것 같습니다.
items.wands.cursedwand.mass_invuln=당신의 지팡이에서 눈부신 빛이 뿜어져 나옵니다!
items.wands.cursedwand.nothing=아무 일도 일어나지 않습니다.
items.wands.cursedwand.ondeath=당신은 당신 자신의 %s에 의해 죽임을 당했습니다.
items.wands.cursedwand.petrify=당신은 그 자리에 갑자기 얼어붙었습니다!
items.wands.cursedwand.sinkhole=땅이 무너지기 시작하는 것 같아요!
items.wands.cursedwand.sinkhole_positive=땅이 꺼지기 시작하지만, 발밑은 여전히 단단하게 느껴진다.
items.wands.cursedwand.supernova=불타는 에너지 덩어리가 점점 커지기 시작합니다. 도망치는 게 좋을 거예요!
items.wands.cursedwand.supernova_positive=불타는 에너지 덩어리가 점점 커지기 시작하지만, 왠지 모르게 안전하다는 느낌이 든다.
items.wands.cursedwand.transmogrify_other=당신의 아이템이 전혀 다른 것으로 변형됩니다!
items.wands.cursedwand.transmogrify_wand=당신의 지팡이가 다른 아이템으로 변신합니다!
items.wands.damagewand.upgrade_stat_name_1=마법 피해
items.wands.wand$placeholder.name=지팡이
items.wands.wand.ac_zap=기력
items.wands.wand.curse_discover=이 %s는 저주받은 거야!
items.wands.wand.cursed=이 지팡이는 저주받아 마법이 혼란스럽고 예측 불가능하게 작용합니다.
items.wands.wand.fizzles=지팡이가 제대로 작동하지 않네요. 충전량이 부족한 것 같습니다.
items.wands.wand.identify=이제 당신은 지팡이에 대해 충분히 익숙해져서 그것을 알아볼 수 있을 것입니다.
items.wands.wand.no_magic=지팡이가 작동하지 않습니다. 마법에 면역이 된 상태에서는 지팡이를 사용할 수 없습니다.
items.wands.wand.not_cursed=이 지팡이에는 악의적인 마법이 없습니다.
items.wands.wand.prompt=전기 충격을 가할 위치를 선택하세요
items.wands.wand.resin_many=이 지팡이는 마법 수지로 인해 _%d 레벨_을 얻었습니다.
items.wands.wand.resin_one=이 지팡이는 마법 수지로 인해 레벨이 _1_ 상승했습니다.
items.wands.wand.self_target=스스로를 표적으로 삼을 수는 없어요!
items.wands.wandofblastwave.bmage_desc=전투 마법사가 마비된 적에게 폭발파 지팡이를 휘두르면, 마비 효과를 소모하여 추가 마법 피해를 입힙니다. 이 효과는 적 하나당 짧은 재사용 대기시간이 있습니다.
items.wands.wandofblastwave.desc=이 지팡이는 대리석 같은 돌로 만들어졌고, 금색 테두리와 끝에 둥근 검은색 보석이 박혀 있습니다. 손에 쥐었을 때 묵직한 느낌이 듭니다.
items.wands.wandofblastwave.eleblast_desc=폭발파 지팡이로 날리는 원소 폭발은 67%의 피해를 입히고 폭발 범위 밖의 모든 적을 날려버립니다.
items.wands.wandofblastwave.knockback_ondeath=그 충돌로 당신은 죽었습니다...
items.wands.wandofblastwave.name=폭발파의 지팡이
items.wands.wandofblastwave.ondeath=너는 네 자신의 폭발파 지팡이로 자살했구나...
items.wands.wandofblastwave.staff_name=폭발파의 직원
items.wands.wandofblastwave.stats_desc=이 지팡이는 목표 지점에서 강력하게 폭발하는 광선을 발사합니다. 이 폭발의 위력은 _%1$d-%2$d_의 피해를 입히며, 대부분의 적을 날려버릴 만큼 강력합니다.
items.wands.wandofblastwave.typical_stats_desc=이 지팡이는 목표 지점에서 격렬하게 폭발하는 번개를 발사합니다. 이 폭발의 위력은 일반적으로 _%1$d-%2$d의 피해_를 입히며, 대부분의 적을 날려버릴 만큼 강력합니다.
items.wands.wandofblastwave.upgrade_stat_name_2=넉백
items.wands.wandofcorrosion.bmage_desc=전투 마법사가 부식 지팡이로 적을 공격하면, 적은 일정 확률로 점액질에 휩싸입니다.
items.wands.wandofcorrosion.desc=이 지팡이는 회색빛 몸체를 가지고 있으며, 속을 열면 찬란한 오렌지색 보석이 나타납니다.
items.wands.wandofcorrosion.eleblast_desc=부식 지팡이로 일으키는 원소 폭발은 적에게 4턴 동안 부식 효과를 부여하며, 초기 피해량은 6입니다.
items.wands.wandofcorrosion.name=부식의 지팡이
items.wands.wandofcorrosion.staff_name=부식 담당 직원
items.wands.wandofcorrosion.stats_desc=이 지팡이는 목표 지점에서 강력한 부식성 가스 구름으로 폭발하는 볼트를 발사합니다. 이 가스 구름 안에 갇힌 모든 것은 _%d의 피해부터 시작하여 시간이 지남에 따라 점점 더 큰 피해를 입습니다.
items.wands.wandofcorrosion.upgrade_stat_name_1=부식 손상
items.wands.wandofcorrosion.upgrade_stat_name_2=가스 부피
items.wands.wandofcorruption.already_corrupted=그 인물은 더 이상 영향을 받을 수 없습니다.
items.wands.wandofcorruption.bmage_desc=전투 마법사가 부패의 지팡이로 적을 공격하면, 적은 일정 확률로 광폭화 상태가 됩니다.
items.wands.wandofcorruption.desc=이 지팡이는 혼돈스럽고 어두운 에너지를 내뿜는데, 끝부분에 장식된 작은 해골 모양만 봐도 이미 짐작할 수 있을 것이다.
items.wands.wandofcorruption.eleblast_desc=부패의 지팡이로 날리는 원소 폭발은 적들에게 5턴 동안 광폭화 효과를 부여합니다.
items.wands.wandofcorruption.name=부패의 지팡이
items.wands.wandofcorruption.staff_name=부패한 직원들
items.wands.wandofcorruption.stats_desc=이 지팡이는 적들을 약화시키고 결국에는 당신의 의지대로 조종하는 타락의 에너지를 방출합니다. 적들은 타락에 저항할 수 있지만, 약해진 적일수록 건강한 적보다 훨씬 쉽게 타락시킬 수 있습니다.
items.wands.wandofcorruption.upgrade_stat_name_1=부패한 권력
items.wands.wandofcorruption.upgrade_stat_name_2=디버프 지속 시간
items.wands.wandofdisintegration.bmage_desc=전투 마법사가 분해의 지팡이를 휘두르면, 마치 투사 마법이 걸린 것처럼 공격 범위가 증가합니다.
items.wands.wandofdisintegration.desc=이 지팡이는 매끈한 흑요석 덩어리로 만들어졌으며, 측면을 따라 짙은 보라색 빛이 흐르다가 끝부분에서 멈춥니다. 파괴적인 에너지를 내뿜으며 앞으로 뻗어나갈 기세입니다.
items.wands.wandofdisintegration.eleblast_desc=분해의 지팡이로 발사하는 원소 폭발은 100%의 피해를 입히고 벽을 관통합니다.
items.wands.wandofdisintegration.name=분해의 지팡이
items.wands.wandofdisintegration.staff_name=붕괴의 직원들
items.wands.wandofdisintegration.stats_desc=이 지팡이는 모든 장애물을 관통하는 광선을 발사하며, 업그레이드할수록 사거리가 늘어납니다. 광선은 _%1$d-%2$d_의 피해를 입히고, 관통하는 적과 벽의 개수만큼 추가 피해를 줍니다.
items.wands.wandofdisintegration.upgrade_stat_name_2=최대 범위
items.wands.wandoffireblast.bmage_desc=전투 마법사가 화염 폭발 지팡이로 적을 공격하면 일정 확률로 폭발이 일어나 적에게 피해를 주고 주변의 모든 불을 소멸시킵니다! 적 주변에 불이 많을수록 폭발 확률이 높아집니다.
items.wands.wandoffireblast.desc=이 지팡이는 붉은색 칠을 한 나무로 만들어졌으며, 금박을 아낌없이 사용하여 매우 위엄 있어 보입니다. 끝부분에서는 탁탁탁 소리가 나며, 강력한 마법을 펼칠 준비가 된 듯합니다.
items.wands.wandoffireblast.eleblast_desc=화염 폭발 지팡이로 발사하는 원소 폭발은 100%의 피해를 입히고, 문을 부수고, 적과 지형에 불을 붙입니다.
items.wands.wandoffireblast.name=화염 폭발 지팡이
items.wands.wandoffireblast.staff_name=화염 폭발 직원
items.wands.wandoffireblast.stats_desc=이 지팡이는 사용 시 원뿔형 화염을 발사합니다. 다음 공격 시에는 _%1$d개의 충전량을 소모하고 _%2$d-%3$d개의 피해를 줍니다._ 지팡이가 소모하는 충전량이 많을수록 효과가 더 크고 강력해집니다.
items.wands.wandoffireblast.upgrade_stat_name_1=1 차지 데미지
items.wands.wandoffireblast.upgrade_stat_name_2=2 차지 데미지
items.wands.wandoffireblast.upgrade_stat_name_3=3 차지 데미지
items.wands.wandoffrost.bmage_desc=전투 마법사가 냉기 상태의 적에게 얼음 지팡이를 휘두르면, 적은 즉시 얼어붙을 확률이 있습니다. 적의 냉기 정도가 심할수록 이 확률이 높아집니다.
items.wands.wandoffrost.desc=이 지팡이는 마치 마법의 얼음으로 만들어진 것 같다. 둥근 끝으로 갈수록 점점 더 밝아진다. 손에 쥐면 매우 차갑지만, 신기하게도 손은 따뜻하게 유지된다.
items.wands.wandoffrost.eleblast_desc=얼음 지팡이로 날리는 원소 폭발은 100%의 피해를 입히고, 적을 얼리고, 불을 끕니다.
items.wands.wandoffrost.name=서리 지팡이
items.wands.wandoffrost.staff_name=서리의 직원들
items.wands.wandoffrost.stats_desc=이 지팡이는 적에게 얼음 에너지를 발사하여 _%1$d-%2$d_의 피해를 주고 냉기를 부여합니다. 물 속에서는 효과가 더 강하게 나타납니다. 이미 냉기 또는 얼어붙은 적은 이 지팡이로 받는 피해가 줄어듭니다.
items.wands.wandoffrost.upgrade_stat_name_2=냉각 시간
items.wands.wandoflightning$lightningcharge.desc=전투 마법사는 현재 에너지로 충전되어 있어 지팡이의 번개 공격에 면역이 되었으며, 지팡이에서 번개가 뻗어 나가는 범위가 증가했습니다. 남은 턴:
items.wands.wandoflightning$lightningcharge.name=전기적으로 충전됨
items.wands.wandoflightning.bmage_desc=전투 마법사가 번개 지팡이로 적을 공격하면 일정 확률로 10턴 동안 자신에게 전기 에너지를 충전합니다. 충전된 동안 전투 마법사는 번개 피해에 면역이 되며, 더 멀리까지 번개를 뿜어냅니다.
items.wands.wandoflightning.desc=이 지팡이는 단단한 금속으로 만들어져서 놀라울 정도로 무겁습니다. 두 개의 갈래가 끝에서 서로 구부러지며, 그 사이에서 전기 아크가 발생합니다.
items.wands.wandoflightning.eleblast_desc=번개 지팡이로 날리는 원소 폭발은 100%의 피해를 입히고, 적을 5턴 동안 기절시키며, 물을 감전시킵니다.
items.wands.wandoflightning.name=번개 지팡이
items.wands.wandoflightning.ondeath=너는 네 번개 지팡이로 스스로 목숨을 끊었구나...
items.wands.wandoflightning.staff_name=번개의 지팡이
items.wands.wandoflightning.stats_desc=이 지팡이는 강력한 번개를 발사하여 목표물에 %1$d-%2$d의 피해를 입힙니다. 이 전기는 주변 캐릭터에게 전파되며, 물 속에서 더 쉽게 퍼집니다. 지팡이에서 발사되는 번개는 사용자에게 피해를 줄 수 있지만, 아군에게는 피해를 주지 않습니다.
items.wands.wandoflivingearth$earthguardian.desc=당신의 생명의 흙 지팡이에서 나온 돌들이 굳어져 당신을 보호하는 흙 수호자가 되었습니다! 이 바위 수호자는 주변의 적들을 공격하여 적들이 당신 대신 수호자를 공격하도록 만듭니다. 주변의 모든 위협이 사라지면 수호자는 다시 당신 주위에 형성되며, 다음에 지팡이를 사용할 때 다시 나타납니다.
items.wands.wandoflivingearth$earthguardian.discover_hint=이 캐릭터는 특정한 지팡이를 사용하면 찾을 수 있습니다.
items.wands.wandoflivingearth$earthguardian.name=흙의 수호자
items.wands.wandoflivingearth$earthguardian.wand_info=수호자의 방어력은 지팡이 레벨에 따라 결정됩니다. 현재 _%1$d-%2$d_ 범위의 피해를 막아냅니다.
items.wands.wandoflivingearth$rockarmor.desc=마법의 바위들이 당신의 몸을 둘러싸고 있습니다. 공격을 받으면 이 바위들이 당신을 막아주려 하며, 받는 피해를 50%%만큼 줄여줍니다. 하지만 막아낸 피해마다 바위가 조금씩 떨어져 나갑니다.\n\n남은 방어력: %1$d.\n\n충분한 양의 바위가 당신 주위에 쌓이면, 살아있는 흙의 지팡이에서 나오는 다음 공격으로 바위들이 수호자로 변하여 당신과 함께 싸워줄 것입니다.\n\n수호자에게 필요한 방어력: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=이 흙의 수호자는 다수의 힘의 효과를 받고 있습니다. 남은 턴: %d.
items.wands.wandoflivingearth$rockarmor.name=암석 갑옷
items.wands.wandoflivingearth.bmage_desc=전투 마법사가 살아있는 흙의 지팡이로 적을 공격하면, 입힌 피해의 일부가 바위 갑옷으로 되돌아옵니다.
items.wands.wandoflivingearth.desc=이 지팡이는 신비로운 돌로 만들어졌는데, 노란색으로 빛나는 에너지 띠가 있다. 지팡이를 쥐면 돌들이 마치 손을 감지하는 듯 미세하게 움직이는 것처럼 보인다.
items.wands.wandoflivingearth.eleblast_desc=생명의 대지 지팡이로 날리는 정령 폭발은 50%의 피해를 입히고, 적중한 적 하나당 활성화된 대지의 수호자를 치유합니다.
items.wands.wandoflivingearth.name=살아있는 흙의 지팡이
items.wands.wandoflivingearth.staff_name=살아있는 지구의 직원들
items.wands.wandoflivingearth.stats_desc=이 지팡이는 적에게 마법의 바위를 발사하여 _%1$d-%2$d_의 피해를 입힙니다. 바위는 사용자의 주위로 다시 뭉쳐져 입힌 피해량에 비례하는 방어력을 부여합니다. 충분한 방어력이 쌓이면, 다음에 지팡이를 사용할 때 바위 수호자로 변합니다.
items.wands.wandoflivingearth.upgrade_stat_name_2=가디언 최대 HP
items.wands.wandoflivingearth.upgrade_stat_name_3=가디언 차단
items.wands.wandofmagicmissile$magiccharge.desc=마법 미사일 지팡이가 마법 지팡이에 다시 힘을 불어넣어 다음 공격의 위력을 높였습니다. 지팡이 위력이 +\n\n만큼 강화되었습니다. 남은 마법 충전 횟수: %s.
items.wands.wandofmagicmissile$magiccharge.name=마법 충전
items.wands.wandofmagicmissile.bmage_desc=전투 마법사가 마법 미사일 지팡이로 적을 공격하면, 지팡이뿐 아니라 모든 마법 지팡이에도 충전량이 추가됩니다.
items.wands.wandofmagicmissile.desc=이 평범해 보이는 지팡이는 순수한 마법 에너지로 이루어진 미사일을 발사합니다. 지팡이 자체에는 특별한 효과가 없지만, 사용 횟수가 더 많고 업그레이드하면 다른 지팡이의 능력을 일시적으로 강화할 수 있습니다.
items.wands.wandofmagicmissile.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.wands.wandofmagicmissile.eleblast_desc=마법 미사일 지팡이로 발사하는 원소 폭발은 50%의 피해를 입히고 마법사에게 15턴의 재충전 시간을 부여합니다.
items.wands.wandofmagicmissile.name=마법 미사일 지팡이
items.wands.wandofmagicmissile.staff_name=마법 미사일 지팡이
items.wands.wandofmagicmissile.stats_desc=이 지팡이에서 발사되는 번개는 각각 _%1$d-%2$d의 피해를 입히며, 업그레이드하면 다른 지팡이의 능력을 일시적으로 강화합니다.
items.wands.wandofprismaticlight.bmage_desc=전투 마법사가 프리즘 빛의 지팡이로 적을 공격하면, 적은 지팡이 레벨에 비례하는 시간 동안 이동 불능 상태가 됩니다.
items.wands.wandofprismaticlight.desc=이 지팡이는 마치 매끄러운 유리 조각처럼 반투명한 크리스탈로 만들어졌습니다. 지팡이 끝 주위로 작고 다채로운 빛 조각들이 춤추듯 움직이며, 금방이라도 밖으로 튀어나올 듯합니다.
items.wands.wandofprismaticlight.eleblast_desc=프리즘 빛의 지팡이로 발사하는 원소 폭발은 67%의 피해를 입히고, 폭발 범위 내의 모든 지형을 드러내며, 적들을 5턴 동안 실명시킵니다.
items.wands.wandofprismaticlight.name=프리즘 빛의 지팡이
items.wands.wandofprismaticlight.staff_name=프리즘 빛의 지팡이
items.wands.wandofprismaticlight.stats_desc=이 지팡이는 던전의 어둠을 가르는 빛줄기를 발사하여 숨겨진 구역과 함정을 드러냅니다. 빛줄기는 적의 시야를 가리고 _%1$d-%2$d_의 피해를 입힙니다. 악마와 언데드 적은 지팡이의 밝은 빛에 타오르며 추가 피해를 입습니다.
items.wands.wandofprismaticlight.upgrade_stat_name_2=맹목적인 기회
items.wands.wandofprismaticlight.upgrade_stat_name_3=빛 지속 시간
items.wands.wandofregrowth$dewcatcher.desc=이슬방울꽃은 신비로운 이슬로 가득 차는 신기한 식물입니다. 풀처럼 위장하여 눈에 띄지 않으려 하지만, 이슬이 맺힌 볼록한 부분 때문에 정체가 드러납니다.
items.wands.wandofregrowth$dewcatcher.discover_hint=특정한 지팡이를 사용하면 이 식물을 찾을 수 있습니다.
items.wands.wandofregrowth$dewcatcher.name=이슬방울꽃
items.wands.wandofregrowth$lotus.desc=황금 연꽃은 강력한 재생 지팡이로만 소환할 수 있는 신비로운 식물입니다. 그 기운은 모든 식물과 식물 효과를 강화하지만, 에너지를 빠르게 소모하여 얼마 지나지 않아 시들어 버립니다.
items.wands.wandofregrowth$lotus.discover_hint=이 식물은 특정 마법 지팡이를 여러 번 업그레이드한 후에 찾을 수 있습니다.
items.wands.wandofregrowth$lotus.name=황금 연꽃
items.wands.wandofregrowth$lotus.wand_info=이 연꽃은 _+%1$d_ 재생 지팡이로 만들어졌습니다. 이 지팡이의 효과를 받는 모든 식물은 캐릭터에 심으면 _즉시_ 효과를 발휘합니다. 또한 식물은 _%2$d%% 확률_로 씨앗을 떨어뜨리고, 촉이 달린 다트는 _%3$d%% 내구도가 감소합니다_.
items.wands.wandofregrowth$seedpod.desc=씨앗 꼬투리는 스스로 씨앗을 맺는 것이 아니라 다른 식물의 씨앗을 맺는 마법의 식물입니다. 씨앗이 없는데도 불구하고 어떻게든 번식해 나가는 것이죠.
items.wands.wandofregrowth$seedpod.discover_hint=특정한 지팡이를 사용하면 이 식물을 찾을 수 있습니다.
items.wands.wandofregrowth$seedpod.name=씨앗 꼬투리
items.wands.wandofregrowth.bmage_desc=전투 마법사가 재생의 지팡이로 적을 공격할 때, 둘 중 하나라도 풀밭 위에 서 있다면, 전투 마법사는 입힌 피해량에 비례하여 약초를 통해 치유 효과를 얻습니다.
items.wands.wandofregrowth.degradation=_%d번 충전_ 후에는 이 지팡이가 식물과 새 풀을 만들어내지 못하게 됩니다. 이 제한은 지팡이 레벨을 올리거나 업그레이드하면 증가합니다.
items.wands.wandofregrowth.desc=이 지팡이는 정교하게 조각된 얇은 나무 막대로 만들어졌습니다. 놀랍게도 여전히 살아 숨 쉬는 듯 생기 넘치고, 어린 나무의 심장처럼 밝은 초록빛을 띠고 있습니다. "생명이 멈춰도 새로운 생명은 언제나 자라나기 마련이지… 영원한 순환은 언제나 계속된다!"
items.wands.wandofregrowth.eleblast_desc=재생의 지팡이로 강력한 원소 폭발을 일으키면 적들이 뿌리 뽑히고 폭발 범위에 무작위로 풀이 자라납니다.
items.wands.wandofregrowth.name=재생의 지팡이
items.wands.wandofregrowth.staff_name=재생 담당 직원
items.wands.wandofregrowth.stats_desc=이 지팡이를 사용하면 마법의 재생 에너지가 원뿔 형태로 사방으로 발사되어 풀, 뿌리, 희귀 식물들이 다시 살아납니다. 다음 발사에는 _%1$d개의 에너지가 소모됩니다. 지팡이가 소모하는 에너지가 많을수록 효과는 더 크고 강력해집니다.
items.wands.wandofregrowth.upgrade_stat_name_1=잔디 (요금당)
items.wands.wandofregrowth.upgrade_stat_name_2=총 잔디 제한
items.wands.wandoftransfusion.bmage_desc=전투 마법사가 매혹된 적을 수혈의 지팡이로 공격하면 보호막을 얻고, 다음번 지팡이 공격은 체력 소모 없이 진행됩니다.
items.wands.wandoftransfusion.charged=당신의 지팡이에는 적의 생명 에너지가 담겨 있습니다!
items.wands.wandoftransfusion.desc=모양은 비교적 평범하지만, 자홍색을 띠고 끝부분에 박힌 새까만 보석이 눈에 띈다.
items.wands.wandoftransfusion.eleblast_desc=수혈 지팡이로 발동하는 원소 폭발은 적을 매혹시키고, 아군을 치유하며, 언데드 적에게 100%의 피해를 입힙니다.
items.wands.wandoftransfusion.name=수혈 지팡이
items.wands.wandoftransfusion.ondeath=당신은 당신의 수혈 지팡이로 스스로 목숨을 끊었군요...
items.wands.wandoftransfusion.staff_name=수혈 담당 직원
items.wands.wandoftransfusion.stats_desc=이 지팡이를 아군이나 매혹된 적에게 사용하면 사용자의 체력을 _%1$d만큼 흡수하여 아군을 _%2$d만큼 회복시키거나 보호막을 씌웁니다. 적에게 사용하면 잠시 동안 적을 매혹시키면서 사용자에게 _%3$d만큼의 보호막을 부여합니다. 적대적인 언데드는 매혹되는 대신 _%4$d-%5$d만큼의 피해를 입습니다.
items.wands.wandoftransfusion.upgrade_stat_name_1=아군 치유
items.wands.wandoftransfusion.upgrade_stat_name_2=자체 차폐
items.wands.wandoftransfusion.upgrade_stat_name_3=언데드 피해
items.wands.wandofwarding$ward.desc_1=이 기본 보호막은 시야 범위 내에 들어오는 모든 적에게 자동으로 전기를 흘려보내 _%1$d-%2$d_의 피해를 줍니다._\n\n 보호의 지팡이로 이 보호막을 공격하면 업그레이드됩니다._\n\n 이 보호막은 한 번만 공격한 후 사라집니다._\n\n 보호의 지팡이는 이 보호막을 유지하는 데 _%3$d_의 에너지를 사용합니다.
items.wands.wandofwarding$ward.desc_2=이 업그레이드된 보호막은 더욱 복잡한 패턴을 가지고 있으며, 여러 번 공격할 수 있습니다. 이 보호막에서 발사되는 각 광선은 _%1$d-%2$d_의 피해를 줍니다._\n\n 보호의 지팡이로 이 보호막을 공격하면 업그레이드됩니다._\n\n 이 보호막은 사라지기 전에 세 번 공격합니다._\n\n 보호의 지팡이는 이 보호막을 유지하기 위해 _%3$d_의 에너지를 사용합니다.
items.wands.wandofwarding$ward.desc_3=완전히 업그레이드된 이 보호막은 이전 버전보다 더 많이 공격할 수 있습니다. 이 보호막에서 발사되는 각 광선은 _%1$d-%2$d_의 피해를 줍니다._ (\n\n) 보호의 지팡이로 이 보호막을 공격하면 업그레이드됩니다._ (\n\n) 이 보호막은 사라지기 전에 다섯 번 공격합니다._ (\n\n) 보호의 지팡이는 이 보호막을 유지하기 위해 _%3$d_의 에너지를 사용합니다.
items.wands.wandofwarding$ward.desc_4=이 작은 센트리는 더 큰 센트리와 동일한 화력을 가지고 있지만, 충전 횟수 대신 체력을 가지고 있습니다. 마치 마법 지팡이 끝에 있는 보석처럼 생겼습니다. 이 센트리가 쏘는 빛은 _%1$d-%2$d_만큼의 피해를 줍니다. 마법 지팡이로 이 센트리를 공격하면 업그레이드되고 체력이 회복됩니다. 이 센트리는 적을 공격할 때마다 체력을 소모하지만, 마법 지팡이를 사용하면 체력을 회복할 수 있습니다. 마법 지팡이는 이 센트리를 유지하는 데 _%3$d_만큼의 에너지를 사용합니다.
items.wands.wandofwarding$ward.desc_5=이 업그레이드된 센트리는 일반 센트리보다 크고 내구성이 뛰어납니다. 이 센트리가 쏘는 빛은 _%1$d-%2$d_만큼의 피해를 줍니다._ (\n\n) 수호의 지팡이로 이 센트리를 공격하면 업그레이드되고 체력이 회복됩니다._ (\n\n) 이 센트리는 적을 공격할 때마다 체력을 소모하지만, 수호의 지팡이를 사용하면 체력을 회복할 수 있습니다._ (\n\n) 수호의 지팡이는 이 센트리를 유지하는 데 _%3$d_만큼의 에너지를 사용합니다.
items.wands.wandofwarding$ward.desc_6=완전히 업그레이드된 이 센트리는 이전 모델보다 훨씬 더 강력합니다. 이 센트리가 쏘는 빛은 _%1$d-%2$d의 피해를 줍니다._\n\n 수호의 지팡이로 이 센트리를 공격하면 체력이 회복됩니다._\n\n 이 센트리는 적을 공격할 때마다 체력을 소모하지만, 수호의 지팡이를 사용하면 회복할 수 있습니다._\n\n 수호의 지팡이는 이 센트리를 유지하는 데 _%3$d의 에너지를 사용합니다._
items.wands.wandofwarding$ward.desc_generic_sentry=이 센트리는 수호 마법과 동일한 화력을 가지고 있지만, 충전 횟수 대신 체력을 가지고 있습니다. 마치 수호 지팡이 끝에 있는 보석처럼 생겼습니다. (\n\n) 수호 지팡이로 이 센트리를 공격하면 업그레이드되고 체력이 회복됩니다. (\n\n) 이 센트리는 적을 공격할 때마다 체력을 소모하지만, 수호 지팡이를 사용하면 체력을 회복할 수 있습니다.
items.wands.wandofwarding$ward.desc_generic_ward=이 와드는 시야 범위 안에 들어오는 모든 적을 자동으로 감전시킵니다. (\n\n) 마법 지팡이로 이 와드를 공격하면 업그레이드됩니다. (\n\n) 와드는 일정 횟수 이상 공격할 수 없으며, 일정 횟수를 초과하면 사라집니다.
items.wands.wandofwarding$ward.discover_hint=이 캐릭터는 특정한 지팡이를 사용하면 찾을 수 있습니다.
items.wands.wandofwarding$ward.dismiss_body=지팡이가 더 이상 이 보호막을 유지하지 않도록 하려면 직접 해제할 수 있습니다. 해제하면 보호막이 즉시 사라집니다.
items.wands.wandofwarding$ward.dismiss_cancel=아니요
items.wands.wandofwarding$ward.dismiss_confirm=예
items.wands.wandofwarding$ward.dismiss_title=이 병동을 폐쇄하시겠습니까?
items.wands.wandofwarding$ward.name_1=소병동
items.wands.wandofwarding$ward.name_2=구
items.wands.wandofwarding$ward.name_3=더 큰 구역
items.wands.wandofwarding$ward.name_4=하급 경비병
items.wands.wandofwarding$ward.name_5=보초
items.wands.wandofwarding$ward.name_6=더 큰 경비병
items.wands.wandofwarding.bad_location=거기에는 병동을 설치할 수 없습니다.
items.wands.wandofwarding.bmage_desc=전투 마법사가 보호의 지팡이로 적을 공격하면, 활성화된 모든 보호막과 파수꾼이 일정 확률로 치유됩니다.
items.wands.wandofwarding.desc=이 짧은 금속 지팡이 끝 위에는 밝은 보라색 보석이 떠 있습니다.
items.wands.wandofwarding.eleblast_desc=수호 지팡이로 원소 폭발을 일으키면 폭발 범위 내의 모든 수호물자와 경비병을 치유합니다.
items.wands.wandofwarding.name=수호의 지팡이
items.wands.wandofwarding.no_more_wards=당신의 지팡이는 더 이상 보호 마법을 유지할 수 없습니다.
items.wands.wandofwarding.staff_name=병동 직원
items.wands.wandofwarding.stats_desc=이 지팡이는 적에게 직접적인 피해를 주는 대신, 고정된 보호막과 경비병을 소환합니다. 보호막은 시야만 확보된다면 벽을 통해서도 소환할 수 있습니다. 이 지팡이는 한 번에 _%d 에너지_만큼의 보호막을 유지할 수 있습니다.
items.wands.wandofwarding.upgrade_stat_name_1=와드 피해
items.wands.wandofwarding.upgrade_stat_name_2=워드 에너지
items.waterskin.ac_drink=마시다
items.waterskin.collected=물통에 이슬방울을 모읍니다.
items.waterskin.desc=가죽과 끈으로 만들어지고 코르크 마개로 밀봉되는 액체 용기.
items.waterskin.desc_full=물이 가득 찬 물통에서 에너지가 뿜어져 나오는 것 같은데, 혹시 다른 생존 용품에 축복을 내리는 데 사용할 수 있을까?
items.waterskin.desc_heal=현재 물통에는 치유의 물이 담겨 있습니다. 물통이 가득 찰수록, 물을 마실 때 즉시 치유되는 양이 늘어납니다. 필요한 만큼만 마시게 됩니다.
items.waterskin.desc_water=지금 물통에는 그냥 마실 물만 들어있어. 분명 던전 안에는 물통에 담을 만한 다른 무언가가 있을 거야.
items.waterskin.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.waterskin.empty=물통이 비어있네요!
items.waterskin.full=물통이 가득 찼어요!
items.waterskin.name=물통
items.weapon.curses.annoying.desc=성가신 무기들은 말도 할 수 있지만, 에너지가 너무 넘쳐서 의도치 않게 당신의 주의를 끌곤 합니다.
items.weapon.curses.annoying.elestrike_desc=성가신 저주가 걸린 원소 공격은 범위 내 모든 적을 6턴 동안 광폭화시킬 확률이 20%입니다.
items.weapon.curses.annoying.msg_1=어머, 우리가 뭔가와 싸우고 있는 건가요!?
items.weapon.curses.annoying.msg_10=잘 맞췄어!
items.weapon.curses.annoying.msg_11=나는 무기가 되고 싶지 않았어. 나무꾼의 도끼가 되고 싶었지.
items.weapon.curses.annoying.msg_12=지나친 자신감은 서서히 그리고 교활하게 사람을 죽이는 살인자라는 것을 명심하십시오.
items.weapon.curses.annoying.msg_13=모든 기지는 우리 것이다!
items.weapon.curses.annoying.msg_2=그래, 잡아!
items.weapon.curses.annoying.msg_3=이봐, 잘 들어봐!
items.weapon.curses.annoying.msg_4=우리가 사장님 댁에 도착했나요!?
items.weapon.curses.annoying.msg_5=아야, 너무 세게 흔들지 마!
items.weapon.curses.annoying.msg_6=죽어라, 벌레야!
items.weapon.curses.annoying.msg_7=와아 ...
items.weapon.curses.annoying.msg_8=잠깐 쉬어도 될까요!?
items.weapon.curses.annoying.msg_9=쾅! 하하!
items.weapon.curses.annoying.name=짜증나는 %s
items.weapon.curses.dazzling.desc=눈부신 무기는 때때로 눈부신 빛을 내뿜어 그것을 볼 수 있는 모든 것을 눈멀게 합니다.
items.weapon.curses.dazzling.elestrike_desc=눈부신 저주가 포함된 원소 공격은 범위 내 모든 적을 6턴 동안 실명시킬 확률이 50%입니다.
items.weapon.curses.dazzling.name=눈부신 %s
items.weapon.curses.displacing.desc=순간 이동 무기는 혼돈의 순간 이동 마법이 깃들어 있어 적들을 바닥 곳곳으로 무작위로 순간 이동시키는 능력을 지니고 있다.
items.weapon.curses.displacing.elestrike_desc=이동 저주가 포함된 원소 공격은 범위 내 모든 적을 50% 확률로 순간 이동시킵니다.
items.weapon.curses.displacing.name=%s를 변위시키다
items.weapon.curses.explosive.desc=폭발성 무기는 서서히 위력을 축적한 후 폭발하여 주변의 모든 것을 파괴합니다.
items.weapon.curses.explosive.desc_cool=현재 당신의 무기는 만져보면 차갑습니다.
items.weapon.curses.explosive.desc_hot=무기가 뜨거워요! 곧 폭발할 것 같아요!
items.weapon.curses.explosive.desc_warm=당신의 무기가 에너지를 축적하며 예열되고 있습니다...
items.weapon.curses.explosive.elestrike_desc=폭발 저주가 포함된 원소 공격은 범위 내 무작위 적에게 50% 확률로 폭발을 일으킵니다.
items.weapon.curses.explosive.hot=더운!
items.weapon.curses.explosive.name=폭발성 %s
items.weapon.curses.explosive.warm=따뜻한...
items.weapon.curses.friendly.desc=아군 무기는 평화주의자에게 가장 적합하며, 때때로 전투를 불가능하게 만드는 마법을 발동시키기도 합니다.
items.weapon.curses.friendly.elestrike_desc=아군 저주가 포함된 원소 공격은 범위 내 모든 적을 6턴 동안 매혹시킬 확률이 50%입니다.
items.weapon.curses.friendly.name=친절한 %s
items.weapon.curses.polarized.desc=극성을 띤 무기는 마법의 영향을 받아 공격력이 50% 증가하거나 전혀 피해를 주지 않게 됩니다.
items.weapon.curses.polarized.elestrike_desc=극성 저주가 포함된 원소 공격은 범위 내 모든 적에게 50% 확률로 24~36의 피해를 입힙니다.
items.weapon.curses.polarized.name=편광 %s
items.weapon.curses.sacrificial.desc=희생용 무기는 적을 공격하는 대가로 착용자의 피를 요구합니다. 착용자가 건강할수록 저주는 더 많은 피를 요구합니다.
items.weapon.curses.sacrificial.elestrike_desc=희생의 저주가 담긴 원소 공격은 영웅과 범위 내 모든 적에게 12 HP의 출혈 피해를 입힙니다.
items.weapon.curses.sacrificial.name=희생적인 %s
items.weapon.curses.wayward$waywardbuff.desc=당신의 변덕스러운 무기에 마법이 발동되어 잠시 동안 명중률이 극도로 떨어집니다. 단, 기습 공격과 같이 명중이 보장되는 공격에는 영향을 미치지 않습니다. 변덕스러운 무기로 공격에 성공하면 이 효과는 즉시 사라집니다. 남은 턴:
items.weapon.curses.wayward$waywardbuff.name=흔들리는
items.weapon.curses.wayward.desc=제멋대로인 무기는 때때로 극도로 정확도가 떨어지게 됩니다. 이 마법은 발동 시 잠시 동안 지속되지만, 제멋대로인 무기로 공격을 가하면 해제될 수 있습니다.
items.weapon.curses.wayward.elestrike_desc=변덕스러운 저주가 섞인 원소 공격은 범위 내 모든 적에게 6턴 동안 저주를 걸 확률이 50%입니다.
items.weapon.curses.wayward.name=변덕스러운 %s
items.weapon.enchantments.blazing.desc=이 마법은 무기에서 불꽃을 뿜어내어 적에게 불을 붙이고, 이미 불이 붙은 적에게는 추가 피해를 입힙니다.
items.weapon.enchantments.blazing.elestrike_desc=불타는 마법이 부여된 원소 공격은 범위 내 모든 타일에 불을 퍼뜨리며, 이 효과는 8턴 동안 지속됩니다.
items.weapon.enchantments.blazing.name=불타는 %s
items.weapon.enchantments.blocking$blockbuff.desc=무기에 부여된 방어 마법이 당신의 방어력을 잠시 동안 강화시켜 주었습니다! 남은 방어력: \n\n 남은 턴: %s.
items.weapon.enchantments.blocking$blockbuff.name=블로킹
items.weapon.enchantments.blocking.desc=방어용 무기는 공격 후 일정 시간 동안 보호막을 생성할 확률이 있습니다.
items.weapon.enchantments.blocking.elestrike_desc=방어 마법이 부여된 원소 공격은 사정거리 내 적 하나당 결투사에게 추가 보호막 6을 부여합니다.
items.weapon.enchantments.blocking.name=%s 차단
items.weapon.enchantments.blooming.desc=꽃이 피는 무기에는 마법이 깃들어 있어, 무기에 맞은 사람이나 그 주변에 식물이 돋아나게 합니다.
items.weapon.enchantments.blooming.elestrike_desc=꽃 피는 마법이 부여된 원소 공격은 범위 내 최대 8칸까지 풀을 퍼뜨리고, 범위 내 모든 적을 6턴 동안 속박합니다.
items.weapon.enchantments.blooming.name=꽃피는 %s
items.weapon.enchantments.chilling.desc=이 마법에 걸린 적은 냉기에 노출되어 움직임과 공격 속도가 느려집니다.
items.weapon.enchantments.chilling.elestrike_desc=냉기 마법이 부여된 원소 공격은 범위 내 모든 타일에 냉기를 퍼뜨리며, 이 효과는 8턴 동안 지속됩니다.
items.weapon.enchantments.chilling.name=칠링 %s
items.weapon.enchantments.corrupting.desc=이 강력한 마법은 적을 당신의 의지대로 조종하는 능력을 지니고 있습니다. 이 무기로 적을 처치하면, 적은 죽는 대신 타락할 가능성이 있습니다.
items.weapon.enchantments.corrupting.elestrike_desc=타락 마법이 부여된 원소 공격은 주 대상을 제외한 범위 내 모든 적에게 5~25%의 확률(상대방의 잃은 HP에 따라 다름)로 타락 효과를 부여합니다.
items.weapon.enchantments.corrupting.name=%s를 손상시키는 중
items.weapon.enchantments.elastic.desc=탄성 무기는 적을 짧은 거리만큼 날려버릴 확률이 있습니다.
items.weapon.enchantments.elastic.elestrike_desc=탄력 마법이 부여된 원소 공격은 범위 내 모든 적을 5칸 뒤로 밀쳐냅니다.
items.weapon.enchantments.elastic.name=탄성 %s
items.weapon.enchantments.grim.desc=이 강력한 마법은 적을 즉사시킬 수 있는 힘을 지니고 있습니다. 적이 약할수록 이 마법이 발동될 확률이 높아집니다.
items.weapon.enchantments.grim.elestrike_desc=음울한 마법이 부여된 원소 공격은 주 대상을 제외한 범위 내 모든 적을 처치할 확률을 6~30%(상대방의 잃은 체력에 따라 다름)로 갖습니다.
items.weapon.enchantments.grim.name=음울한 %s
items.weapon.enchantments.kinetic$conserveddamage.desc=당신의 무기는 이전 결정타에서 남은 힘을 저장해 두었다가 다음 공격에 추가 피해로 적용합니다. 하지만 이 에너지는 시간이 지남에 따라 서서히 사라집니다. \n\n저장된 피해: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=보존된 손상
items.weapon.enchantments.kinetic.desc=운동 에너지 무기로 적을 사살하면 남은 힘은 무기에 저장되었다가 다음 공격에 사용됩니다.
items.weapon.enchantments.kinetic.elestrike_desc=운동 에너지 마법이 부여된 원소 공격은 주 대상을 제외한 범위 내 모든 적에게 저장된 피해량의 40%를 입힙니다.
items.weapon.enchantments.kinetic.name=운동학적 %s
items.weapon.enchantments.lucky.desc=운이 좋은 무기로 처치된 적은 추가 전리품을 떨어뜨릴 확률이 있습니다.
items.weapon.enchantments.lucky.elestrike_desc=행운 마법이 부여된 원소 공격은 범위 내 모든 적 아래에 전리품을 생성할 확률이 12.5%입니다. 이 효과는 적 하나당 한 번만 발동할 수 있습니다.
items.weapon.enchantments.lucky.name=행운의 %s
items.weapon.enchantments.projecting.desc=이 마법 부여로 근접 무기의 사거리가 증가합니다. 원거리 무기는 가까운 목표물을 조준할 때 벽을 관통합니다.
items.weapon.enchantments.projecting.elestrike_desc=원거리 공격 마법이 부여된 원소 공격은 주 대상을 제외한 범위 내 모든 적에게 30%의 피해를 입힙니다.
items.weapon.enchantments.projecting.name=%s를 투영합니다
items.weapon.enchantments.shocking.desc=충격 무기에서 전기가 튀면서 주변의 모든 적에게 추가 피해를 입힙니다.
items.weapon.enchantments.shocking.elestrike_desc=충격적인 마법이 부여된 원소 공격은 범위 내 모든 타일에 8턴 동안 지속되는 전기를 퍼뜨립니다.
items.weapon.enchantments.shocking.name=충격적인 %s
items.weapon.enchantments.unstable.desc=이 마법은 혼돈의 에너지를 방출하며, 공격할 때마다 다른 마법처럼 작용합니다.
items.weapon.enchantments.unstable.elestrike_desc=불안정한 마법 부여가 있는 원소 공격은 주 대상을 제외한 범위 내 모든 적에게 무작위 마법 부여 효과를 적용합니다.
items.weapon.enchantments.unstable.name=불안정한 %s
items.weapon.enchantments.vampiric.desc=이 강력한 마법은 공격할 때마다 적의 생명력을 흡수하여 착용자에게 되돌려줍니다. 착용자의 체력이 낮을수록 효과가 강해집니다.
items.weapon.enchantments.vampiric.elestrike_desc=흡혈 마법이 부여된 원소 공격은 범위 내 적 하나당 결투사의 체력을 2.5만큼 회복시켜 줍니다.
items.weapon.enchantments.vampiric.name=흡혈귀 %s
items.weapon.melee.assassinsblade.ability_desc=결투사는 암살자의 검을 휘두르며 은신할 수 있습니다. 이 능력은 결투사가 최대 3칸 떨어진 곳으로 순간 이동할 수 있게 해주고, _%d턴 동안 투명화_를 부여합니다.
items.weapon.melee.assassinsblade.ability_name=좀도둑
items.weapon.melee.assassinsblade.desc=가볍고 사용하기는 어렵지만, 제대로 맞추면 치명적인 흑요석으로 만든 작고 물결 모양의 칼날.
items.weapon.melee.assassinsblade.name=암살자의 칼
items.weapon.melee.assassinsblade.stats_desc=이 무기는 방심한 적에게 더 효과적입니다.
items.weapon.melee.assassinsblade.typical_ability_desc=결투사는 암살자의 검을 휘두르며 은신할 수 있습니다. 이 능력은 결투사를 최대 3칸 떨어진 곳으로 순간 이동시켜주며, 일반적으로 20턴 동안 투명 상태를 유지하게 해줍니다.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.battleaxe.ability_desc=결투사는 전투 도끼로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만, 일반적인 피해를 입힙니다.
items.weapon.melee.battleaxe.ability_name=강한 타격
items.weapon.melee.battleaxe.desc=이 전투 도끼의 거대한 강철 날은 넓게 휘두르는 한 번의 공격에 상당한 무게감을 실어줍니다.
items.weapon.melee.battleaxe.name=전투 도끼
items.weapon.melee.battleaxe.stats_desc=이 무기는 상당히 정확합니다.
items.weapon.melee.battleaxe.typical_ability_desc=결투사는 전투 도끼로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 일반적으로 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만, 일반적인 피해를 입힙니다.
items.weapon.melee.crossbow$chargedshot.desc=결투사는 석궁에 힘을 집중하고 있습니다. 다음 공격은 항상 명중하며 다음 세 가지 효과 중 하나를 적용합니다. \n - 근접 공격 시 적을 몇 칸 뒤로 밀쳐냅니다. \n - 화살촉이 없는 화살은 추가 피해를 줍니다. \n - 화살촉이 있는 화살은 사용 횟수가 늘어나고 7x7 범위에 효과를 적용합니다. 긍정적인 효과는 아군에게만 적용되고, 부정적인 효과는 적에게만 적용됩니다. 결투사는 이 능력을 사용하여 자신에게 긍정적인 효과를 적용할 수 없습니다.
items.weapon.melee.crossbow$chargedshot.name=충전됨
items.weapon.melee.crossbow.ability_desc=결투사는 석궁을 충전할 수 있으며, 충전 후 다음 일반 공격은 항상 명중하고 다음 세 가지 효과 중 하나를 적용합니다. 근접 공격은 적을 밀쳐내고, 화살촉이 없는 화살은 +%1$d의 피해를 입히며, 화살촉이 있는 화살은 7x7 범위에 효과를 적용하고 %2$d번 더 사용할 수 있습니다.
items.weapon.melee.crossbow.ability_name=충전된 샷
items.weapon.melee.crossbow.desc=상당히 복잡한 구조로 만들어진 이 무기는 화살을 매우 빠른 속도로 발사합니다. 본래 용도는 아니지만, 묵직하고 견고한 구조 덕분에 근접 무기로도 손색이 없습니다.
items.weapon.melee.crossbow.name=석궁
items.weapon.melee.crossbow.stats_desc=이 무기는 장착 시 투척 다트의 공격력을 _%1$d-%2$d_만큼 증가시키며, 장착한 다트에 무기의 마법 부여 효과까지 부여합니다.
items.weapon.melee.crossbow.typical_ability_desc=결투사는 석궁을 충전할 수 있으며, 충전 후 다음 일반 공격은 항상 명중하고 다음 세 가지 효과 중 하나를 적용합니다. 근접 공격은 적을 밀쳐내고, 화살촉이 없는 화살은 일반적으로 +%1$d의 피해를 입히며, 화살촉이 있는 화살은 7x7 범위에 효과를 적용하고 일반적으로 %2$d번 더 사용할 수 있습니다.
items.weapon.melee.crossbow.typical_stats_desc=일반적으로 이 무기는 장착 시 투척 다트의 공격력을 _%1$d-%2$d_만큼 증가시키며, 장착한 무기의 마법 부여 효과까지 부여합니다.
items.weapon.melee.crossbow.upgrade_ability_stat_name=능력 강화
items.weapon.melee.cudgel.ability_desc=결투사는 곤봉으로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만, 일반적인 피해를 입힙니다.
items.weapon.melee.cudgel.ability_name=강한 타격
items.weapon.melee.cudgel.desc=작은 황동 철퇴로, 모험가의 무기라기보다는 귀족들의 자기 방어 도구로 더 적합하게 만들어졌다.
items.weapon.melee.cudgel.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.melee.cudgel.name=곤장
items.weapon.melee.cudgel.stats_desc=이 무기는 상당히 정확합니다.
items.weapon.melee.cudgel.typical_ability_desc=결투사는 곤봉으로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 일반적으로 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만 일반적인 피해를 입힙니다.
items.weapon.melee.dagger.ability_desc=결투사는 단검을 든 채로 은신할 수 있습니다. 이 능력은 결투사가 최대 5칸 떨어진 곳으로 순간 이동할 수 있게 해주고, _%d턴 동안 투명화_를 부여합니다.
items.weapon.melee.dagger.ability_name=좀도둑
items.weapon.melee.dagger.desc=손잡이가 닳아빠진 단순한 철제 단검.
items.weapon.melee.dagger.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.melee.dagger.name=단검
items.weapon.melee.dagger.stats_desc=이 무기는 방심한 적에게 더 효과적입니다.
items.weapon.melee.dagger.typical_ability_desc=결투사는 단검을 든 채 은신할 수 있습니다. 이 능력은 결투사를 최대 5칸 떨어진 곳으로 순간 이동시켜주며, 일반적으로 _%d 턴 동안 투명 상태를 유지하게 해줍니다._
items.weapon.melee.dagger.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.dirk.ability_desc=결투사는 단검을 든 채 은신할 수 있습니다. 이 능력은 결투사가 최대 4칸 떨어진 곳으로 순간 이동할 수 있게 해주고, _%d턴 동안 투명화_를 부여합니다.
items.weapon.melee.dirk.ability_name=좀도둑
items.weapon.melee.dirk.desc=더 긴 찌르기용 단검은 적에게 더 깊숙이 꽂을 수 있는 더 많은 강철 부분을 제공합니다.
items.weapon.melee.dirk.name=단도
items.weapon.melee.dirk.stats_desc=이 무기는 방심한 적에게 더 효과적입니다.
items.weapon.melee.dirk.typical_ability_desc=결투사는 단검을 든 채로 은신할 수 있습니다. 이 능력은 결투사를 최대 4칸 떨어진 곳으로 순간 이동시켜주며, 일반적으로 _%d 턴 동안 투명 상태를 유지하게 해줍니다._
items.weapon.melee.dirk.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.flail$spinabilitytracker.desc=결투사는 도리깨를 휘두르며 다음 일반 공격의 피해량을 증가시키고 있습니다. 도리깨를 휘두를 때마다 한 턴이 소모되지만 피해량이 증가하며, 최대 세 번까지 휘두를 수 있습니다. 또한 도리깨는 휘두르는 동안 반드시 공격에 명중합니다. (현재 회전 횟수: 0회, 남은 턴 수: 2회)
items.weapon.melee.flail$spinabilitytracker.name=제사
items.weapon.melee.flail.ability_desc=결투사는 도리깨를 돌려 짧은 시간 동안 힘을 모을 수 있습니다. 도리깨를 돌리는 매 턴마다 다음 일반 공격에 +%d의 피해를 입히며, 최대 3회까지 적용됩니다. 회전하는 도리깨는 반드시 명중합니다. 도리깨를 돌리기 시작하는 데에만 힘이 소모됩니다.
items.weapon.melee.flail.ability_name=회전
items.weapon.melee.flail.desc=손잡이에 사슬로 연결된 가시 달린 공. 다루기 힘들지만, 제대로 맞으면 엄청난 피해를 줄 수 있다.
items.weapon.melee.flail.name=도리깨
items.weapon.melee.flail.spin_warn=이제 더 이상 도리깨를 돌릴 수 없어.
items.weapon.melee.flail.stats_desc=이 무기는 정확도가 상당히 떨어집니다. \n 이 무기는 기습 공격에 적합하지 않습니다.
items.weapon.melee.flail.typical_ability_desc=결투사는 도리깨를 돌려 짧은 시간 동안 힘을 모을 수 있습니다. 도리깨를 돌리는 매 턴마다 다음 일반 공격에 +%d의 피해를 입히며, 최대 3회까지 적용됩니다. 회전하는 도리깨는 반드시 명중합니다. 도리깨를 돌리기 시작하는 데에만 힘이 소모됩니다.
items.weapon.melee.gauntlet.ability_desc=결투사는 돌 장갑을 이용해 콤보 공격을 할 수 있습니다. 이 공격은 반드시 명중하며, 결투사가 일반 근접 공격이나 투척 무기 공격으로 적중시킬 때마다 +%d의 피해를 줍니다. 5턴 동안 공격이 명중하지 않으면 이 콤보 공격은 초기화됩니다.
items.weapon.melee.gauntlet.ability_name=콤보 스트라이크
items.weapon.melee.gauntlet.desc=이 거대한 건틀릿은 진홍색 천으로 만들어졌고, 그 위에 무거운 마법석이 겹겹이 덧대어져 있습니다. 천은 착용감을 조여주며, 두꺼운 돌판은 마치 제2의 피부처럼 느껴집니다. 이렇게 무거운 무기를 휘두르려면 상당한 힘이 필요하지만, 그만큼 공격력도 엄청나게 강해집니다.
items.weapon.melee.gauntlet.name=돌 장갑
items.weapon.melee.gauntlet.stats_desc=이것은 매우 빠른 무기입니다.
items.weapon.melee.gauntlet.typical_ability_desc=결투사는 돌 장갑을 이용해 콤보 공격을 할 수 있습니다. 이 공격은 반드시 명중하며, 일반적으로 결투사가 일반 근접 공격이나 투척 무기 공격으로 적중시킬 때마다 +%d의 피해를 입힙니다. 5턴 동안 공격이 명중하지 않으면 이 콤보 공격은 초기화됩니다.
items.weapon.melee.glaive.ability_desc=결투사는 사정거리 내에 있지만 인접하지 않은 적을 글레이브 끝으로 찌를 수 있습니다. 이 공격은 %1$d-%2$d의 피해를 주고 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.glaive.ability_name=스파이크
items.weapon.melee.glaive.desc=긴 막대기 끝에 검날이 달린 거대한 장창.
items.weapon.melee.glaive.name=검
items.weapon.melee.glaive.stats_desc=이 무기는 상당히 느립니다. \n 이 무기는 사거리가 더 깁니다.
items.weapon.melee.glaive.typical_ability_desc=결투사는 글레이브 끝으로 사정거리 내에 있지만 인접하지 않은 적을 찌를 수 있습니다. 이 공격은 일반적으로 %1$d-%2$d의 피해를 주고 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.gloves.ability_desc=결투사는 스터드 장갑을 착용하고 콤보 공격을 할 수 있습니다. 이 공격은 반드시 명중하며, 결투사가 일반 근접 공격이나 투척 무기 공격으로 적중시킬 때마다 +%d의 추가 피해를 줍니다. 5턴 동안 공격이 적중하지 않으면 이 콤보 공격은 초기화됩니다.
items.weapon.melee.gloves.ability_name=콤보 스트라이크
items.weapon.melee.gloves.desc=이 스터드 장갑은 실질적인 보호 기능은 없지만, 손을 자유롭게 유지하면서도 쓸만한 무기 역할을 합니다.
items.weapon.melee.gloves.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.melee.gloves.name=스터드 장갑
items.weapon.melee.gloves.stats_desc=이것은 매우 빠른 무기입니다.
items.weapon.melee.gloves.typical_ability_desc=결투사는 스터드 장갑을 사용하여 콤보 공격을 할 수 있습니다. 이 공격은 반드시 명중하며, 일반적으로 결투사가 일반 근접 공격이나 투척 무기 공격으로 적중시킬 때마다 +%d의 피해를 입힙니다. 5턴 동안 공격이 명중하지 않으면 이 콤보 공격은 초기화됩니다.
items.weapon.melee.greataxe.ability_desc=결투사는 체력이 50%% 미만일 경우 대형 도끼로 복수 공격을 할 수 있습니다. 이 파괴적인 공격은 _%1$d-%2$d의 피해를 입히고, 반드시 명중하며, 적을 처치하면 즉사합니다.
items.weapon.melee.greataxe.ability_name=보복
items.weapon.melee.greataxe.desc=어깨에 메고 휘두르도록 설계된 이 거대한 도끼는 무게만큼이나 강력합니다.
items.weapon.melee.greataxe.name=그레이트액스
items.weapon.melee.greataxe.stats_desc=이 무기는 엄청나게 무겁다.
items.weapon.melee.greataxe.typical_ability_desc=결투사는 체력이 50%% 미만일 경우 대형 도끼로 복수 공격을 할 수 있습니다. 이 파괴적인 공격은 일반적으로 _%1$d-%2$d의 피해를 입히며, 반드시 명중하고 적을 처치하면 즉사합니다.
items.weapon.melee.greatshield.ability_desc=결투사는 거대한 방패로 자신을 보호하여 _%d 턴_ 동안 자신에게 가해지는 모든 물리적 또는 마법적 공격을 완전히 막아낼 수 있습니다. 결투사가 공격을 막아낸 후 반격하거나 마법을 사용하면 방어가 해제됩니다.
items.weapon.melee.greatshield.ability_name=경비원
items.weapon.melee.greatshield.desc=방패라기보다는 움직이는 벽에 더 가까운 이 거대한 금속 덩어리는 방어에는 도움이 되지만 공격할 여지는 거의 남겨두지 않습니다.
items.weapon.melee.greatshield.name=대형 방패
items.weapon.melee.greatshield.stats_desc=이 무기는 0-%d의 피해를 막아줍니다. 방어력은 업그레이드에 따라 증가합니다.
items.weapon.melee.greatshield.typical_ability_desc=결투사는 거대한 방패로 자신을 보호할 수 있으며, 일반적으로 _%d 턴_ 동안 자신에게 가해지는 모든 물리적 또는 마법적 공격을 완전히 막아낼 수 있습니다. 결투사가 공격을 막아낸 후 반격하거나 마법을 사용하면 방어가 해제됩니다.
items.weapon.melee.greatshield.typical_stats_desc=일반적으로 이 무기는 0-%d의 피해를 막아냅니다. 이 방어력은 업그레이드에 따라 증가합니다.
items.weapon.melee.greatshield.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.greatsword.ability_desc=결투사는 대검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적을 처치하면 즉사하며, 결투사는 5턴 이내에 베기 공격을 무료로 다시 사용할 수 있습니다.
items.weapon.melee.greatsword.ability_name=쪼개다
items.weapon.melee.greatsword.desc=이 거대한 검은 휘두를 때마다 무게를 실어 막대한 피해를 입힙니다.
items.weapon.melee.greatsword.name=대검
items.weapon.melee.greatsword.typical_ability_desc=결투사는 대검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 일반적으로 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적을 처치하면 즉사하며, 결투사는 5턴 이내에 베기 공격을 무료로 다시 사용할 수 있습니다.
items.weapon.melee.handaxe.ability_desc=결투사는 손도끼로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만 일반 피해를 입힙니다.
items.weapon.melee.handaxe.ability_name=강한 타격
items.weapon.melee.handaxe.desc=가벼운 도끼로, 주로 나무를 베는 데 사용됩니다. 넓은 날은 적을 상대할 때도 효과적입니다.
items.weapon.melee.handaxe.name=손도끼
items.weapon.melee.handaxe.stats_desc=이 무기는 상당히 정확합니다.
items.weapon.melee.handaxe.typical_ability_desc=결투사는 손도끼로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 일반적으로 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만 일반적인 피해를 입힙니다.
items.weapon.melee.katana.ability_desc=결투사는 1칸 떨어진 적에게 카타나를 휘두르며 돌진할 수 있습니다. 이 공격은 적을 향해 이동하며 %1$d-%2$d의 피해를 입히고, 반드시 명중합니다.
items.weapon.melee.katana.ability_name=찌르기
items.weapon.melee.katana.desc=손잡이 위에 커다란 금속 가드가 있는 가느다란 검.
items.weapon.melee.katana.name=카타나
items.weapon.melee.katana.stats_desc=이 무기는 0~3의 피해를 막아줍니다.
items.weapon.melee.katana.typical_ability_desc=결투사는 1칸 떨어진 적에게 카타나를 휘두르며 돌진할 수 있습니다. 이 공격은 적을 향해 이동하며, 일반적으로 _%1$d-%2$d의 피해_를 입히고, 반드시 명중합니다.
items.weapon.melee.longsword.ability_desc=결투사는 장검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적을 처치하면 즉사하며, 결투사는 5턴 이내에 베기 공격을 무료로 다시 사용할 수 있습니다.
items.weapon.melee.longsword.ability_name=쪼개다
items.weapon.melee.longsword.desc=이 검의 길고 날카로운 강철 칼날은 위엄 있게 빛나지만, 크기 때문에 꽤 무겁습니다.
items.weapon.melee.longsword.name=장검
items.weapon.melee.longsword.typical_ability_desc=결투사는 장검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 일반적으로 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적이 즉사하면 결투사는 5턴 이내에 베기 공격을 무료로 다시 사용할 수 있습니다.
items.weapon.melee.mace.ability_desc=결투사는 철퇴로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만, 일반적인 피해를 입힙니다.
items.weapon.melee.mace.ability_name=강한 타격
items.weapon.melee.mace.desc=이 무기의 커다란 철제 머리는 상당한 피해를 입힙니다.
items.weapon.melee.mace.name=메이스
items.weapon.melee.mace.stats_desc=이 무기는 상당히 정확합니다.
items.weapon.melee.mace.typical_ability_desc=결투사는 철퇴로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 일반적으로 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만 일반적인 피해를 입힙니다.
items.weapon.melee.magesstaff.ac_imbue=주입하다
items.weapon.melee.magesstaff.ac_zap=기력
items.weapon.melee.magesstaff.cursed_wand=그 지팡이는 저주받아서 그 마법이 혼란스럽고 예측 불가능하게 작용한다.
items.weapon.melee.magesstaff.desc=마법사가 직접 제작한 이 지팡이는 마법 지팡이의 힘을 불어넣을 수 있는 독특한 마법 무기입니다.
items.weapon.melee.magesstaff.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.melee.magesstaff.has_wand=직원들은 현재 _%s_라는 속성을 지니고 있습니다.
items.weapon.melee.magesstaff.imbue=당신은 직원들에게 %s 정신을 불어넣습니다.
items.weapon.melee.magesstaff.imbue_cursed=저주받은 지팡이에 마법을 부여하면, 지팡이 자체도 저주받게 될 것이다!
items.weapon.melee.magesstaff.imbue_desc=지팡이에 이 능력을 부여하시겠습니까? (\n\n) 부여하려는 지팡이의 레벨이 지팡이와 같거나 높으면, 지팡이는 해당 지팡이의 레벨에 자체 업그레이드 하나를 더한 레벨을 계승합니다.
items.weapon.melee.magesstaff.imbue_level=이 부여를 통해 _+%d 지팡이가 생성됩니다._
items.weapon.melee.magesstaff.imbue_lost=현재 당신의 지팡이에 깃든 마법의 힘은 사라질 것입니다.
items.weapon.melee.magesstaff.imbue_talent=현재 당신의 지팡이에 부여된 마법력은 +0으로 반환됩니다.
items.weapon.melee.magesstaff.imbue_unknown=당신은 이 지팡이의 레벨을 모르지만, 이 마법 부여를 통해 최소한 _+%d 등급의 지팡이를 얻게 될 것입니다._
items.weapon.melee.magesstaff.name=마법사의 지팡이
items.weapon.melee.magesstaff.no=아니요, 마음을 바꿨어요.
items.weapon.melee.magesstaff.no_wand=현재 이 지팡이에는 마법의 힘이 전혀 없으므로, 마법을 시전하기 위해서는 지팡이의 힘을 불어넣어야 합니다.
items.weapon.melee.magesstaff.preserved=이전 지팡이는 보존되었습니다!
items.weapon.melee.magesstaff.prompt=지팡이를 선택하세요
items.weapon.melee.magesstaff.yes=네, 확실해요.
items.weapon.melee.meleeweapon.ability_cant_use=지금은 그 능력을 사용할 수 없습니다.
items.weapon.melee.meleeweapon.ability_low_str=당신은 이 무기의 능력을 사용할 만큼 강하지 않습니다.
items.weapon.melee.meleeweapon.ability_need_equip=해당 무기의 능력을 사용하려면 먼저 그 무기를 장착해야 합니다.
items.weapon.melee.meleeweapon.ability_no_charge=당신은 그 능력을 사용할 만큼 충분한 에너지가 없습니다.
items.weapon.melee.meleeweapon.ability_no_target=그곳에는 목표물이 없습니다.
items.weapon.melee.meleeweapon.ability_occupied=그곳은 이미 사용 중입니다.
items.weapon.melee.meleeweapon.ability_target_range=저 목표물은 사정거리 밖에 있습니다.
items.weapon.melee.meleeweapon.ac_ability=능력
items.weapon.melee.meleeweapon.probably_too_heavy=아마 이 무기는 당신에게 너무 무거울 겁니다.
items.weapon.melee.meleeweapon.prompt=대상을 선택하세요
items.weapon.melee.meleeweapon.stats_known=이 _티어-%1$d_ 근접 무기는 _%2$d-%3$d의 피해_를 입히며, 제대로 사용하려면 _%4$d의 힘_이 필요합니다.
items.weapon.melee.meleeweapon.stats_unknown=일반적으로 이 _티어-%1$d_ 근접 무기는 _%2$d-%3$d의 피해_를 입히며, 제대로 사용하려면 _%4$d의 힘_이 필요합니다.
items.weapon.melee.meleeweapon.swap=무기 교체
items.weapon.melee.meleeweapon.swap_full=재고가 가득 찬 상태에서는 그렇게 할 수 없어요.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=능력 피해
items.weapon.melee.quarterstaff$defensivestance.desc=결투사는 쿼터스태프를 사용하여 날아오는 공격과 투사체를 막아내고 있습니다. 이 자세를 유지하는 동안 모든 공격에 대한 회피율이 세 배가 됩니다. 남은 턴:
items.weapon.melee.quarterstaff$defensivestance.name=방어적 자세
items.weapon.melee.quarterstaff.ability_desc=결투사는 쿼터스태프를 들고 방어 자세를 취할 수 있습니다. 이 자세는 즉시 발동되며 _%d 턴 동안 회피율을 세 배로 증가시킵니다.
items.weapon.melee.quarterstaff.ability_name=방어적 자세
items.weapon.melee.quarterstaff.desc=양 끝에 쇠가 덧대어진 단단한 나무로 만든 지팡이.
items.weapon.melee.quarterstaff.name=병참
items.weapon.melee.quarterstaff.stats_desc=이 무기는 0~2의 피해를 막아줍니다.
items.weapon.melee.quarterstaff.typical_ability_desc=결투사는 쿼터스태프를 들고 방어 자세를 취할 수 있습니다. 이 자세는 즉시 발동되며, 일반적으로 20턴 동안 회피율을 세 배로 증가시킵니다.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.rapier.ability_desc=결투사는 1칸 떨어진 적에게 레이피어로 돌진할 수 있습니다. 이 공격은 적을 향해 이동하며 %1$d-%2$d의 피해를 입히고, 반드시 명중합니다.
items.weapon.melee.rapier.ability_name=찌르기
items.weapon.melee.rapier.desc=날렵하고 곧은 검으로, 베는 힘은 다소 약하지만 어느 정도 방어력을 제공합니다.
items.weapon.melee.rapier.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.melee.rapier.name=레이피어
items.weapon.melee.rapier.stats_desc=이 무기는 0~1의 피해를 막아줍니다.
items.weapon.melee.rapier.typical_ability_desc=결투사는 1칸 떨어진 적에게 레이피어를 휘두르며 돌진할 수 있습니다. 이 공격은 적을 향해 이동하며, 일반적으로 _%1$d-%2$d의 피해_를 입히고, 반드시 명중합니다.
items.weapon.melee.roundshield$guardtracker.desc=결투사는 다가오는 공격에 대비하여 방패를 준비했습니다. 그녀에게 가해지는 물리적 또는 마법적 공격은 완전히 무효화됩니다. 남은 턴:
