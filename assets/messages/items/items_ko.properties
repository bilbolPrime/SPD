items.weapon.melee.roundshield.stats_desc=이 무기는 0-%d의 피해를 막아줍니다. 방어력은 업그레이드에 따라 증가합니다.
items.weapon.melee.roundshield.typical_ability_desc=결투사는 둥근 방패로 자신을 보호할 수 있으며, 일반적으로 _%d 턴_ 동안 자신에게 가해지는 모든 물리적 또는 마법적 공격을 완전히 막아낼 수 있습니다. 결투사가 공격을 막아낸 후 반격하거나 마법을 사용하면 방어가 해제됩니다.
items.weapon.melee.roundshield.typical_stats_desc=일반적으로 이 무기는 0-%d의 피해를 막아냅니다. 이 방어력은 업그레이드에 따라 증가합니다.
items.weapon.melee.roundshield.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.runicblade.ability_desc=결투사는 룬 검으로 _룬 베기_를 시전할 수 있습니다. 이 공격은 반드시 명중하며 _+%d%%의 마법 부여 효과를 받습니다._
items.weapon.melee.runicblade.ability_name=룬 슬래시
items.weapon.melee.runicblade.desc=머나먼 땅에서 온 신비로운 무기, 밝은 파란색 칼날을 가진.
items.weapon.melee.runicblade.name=룬 문자가 새겨진 검
items.weapon.melee.runicblade.stats_desc=이 무기는 업그레이드를 통해 더욱 큰 효과를 발휘합니다.
items.weapon.melee.runicblade.typical_ability_desc=결투사는 룬 검으로 _룬 베기_를 시전할 수 있습니다. 이 공격은 반드시 명중하며, 일반적으로 _+%d%%의 마법 부여 효과를 가집니다._
items.weapon.melee.runicblade.upgrade_ability_stat_name=능력치
items.weapon.melee.sai$combostriketracker.desc=결투사는 콤보 공격 능력의 피해량을 증가시키는 데 사용할 수 있는 콤보를 구축하고 있습니다. 일반 근접 공격이나 투척 무기 공격이 성공할 때마다 콤보가 누적되지만, 5턴 동안 공격에 성공하지 못하면 이 콤보가 초기화됩니다. \n\n최근 공격: %1$d.\n\n공격이 초기화될 때까지 남은 턴: %2$s.
items.weapon.melee.sai$combostriketracker.name=콤보 스트라이크
items.weapon.melee.sai.ability_desc=결투사는 사이를 이용한 콤보 공격을 할 수 있습니다. 이 공격은 반드시 명중하며, 결투사가 일반 근접 공격이나 투척 무기 공격으로 적중시킬 때마다 +%d의 피해를 줍니다. 5턴 동안 공격이 명중하지 않으면 콤보 공격이 초기화됩니다.
items.weapon.melee.sai.ability_name=콤보 스트라이크
items.weapon.melee.sai.desc=한 손에 쥐고 휘두르도록 고안된 얇은 칼날 두 개. 빠른 베기로 적들을 쓰러뜨리기에 탁월합니다.
items.weapon.melee.sai.name=사이
items.weapon.melee.sai.stats_desc=이것은 매우 빠른 무기입니다.
items.weapon.melee.sai.typical_ability_desc=결투사는 사이를 이용한 콤보 공격을 할 수 있습니다. 이 공격은 반드시 명중하며, 일반적으로 결투사가 일반 근접 공격이나 투척 무기 공격으로 적중시킬 때마다 +%d의 피해를 입힙니다. 5턴 동안 공격이 명중하지 않으면 콤보 공격이 초기화됩니다.
items.weapon.melee.scimitar$sworddance.desc=결투사는 마치 춤을 추듯 빠른 속도로 기세를 이용한 공격을 퍼붓습니다. 이 자세가 활성화된 동안, 결투사는 60%%만큼 더 빠르게 공격할 수 있으며 (초승달 모양의 검으로 한 턴에 정확히 두 번 공격할 수 있을 정도), 명중률이 +50%%만큼 증가합니다. 남은 턴: %s.
items.weapon.melee.scimitar$sworddance.name=검무
items.weapon.melee.scimitar.ability_desc=결투사는 시미터를 들고 검무를 출 수 있습니다. 이 자세는 즉시 발동되며, 결투사에게 2턴 동안 공격 속도 +60%%, 명중률 +50%%의 효과를 부여합니다.
items.weapon.melee.scimitar.ability_name=검무
items.weapon.melee.scimitar.desc=두껍고 구부러진 칼날. 그 모양 덕분에 공격 속도는 빠르지만 위력은 다소 약하다.
items.weapon.melee.scimitar.name=시미터
items.weapon.melee.scimitar.stats_desc=이건 상당히 빠른 무기네요.
items.weapon.melee.scimitar.typical_ability_desc=결투사는 시미터를 들고 검무를 출 수 있습니다. 이 자세는 즉시 발동되며, 결투사에게 일반적으로 2턴 동안 공격 속도 +60%%, 명중률 +50%%의 효과를 부여합니다.
items.weapon.melee.scimitar.upgrade_ability_stat_name=능력 지속 시간
items.weapon.melee.shortsword.ability_desc=결투사는 단검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적을 처치하면 즉사하며, 결투사는 5턴 이내에 베기 공격을 무료로 다시 사용할 수 있습니다.
items.weapon.melee.shortsword.ability_name=쪼개다
items.weapon.melee.shortsword.desc=상당히 짧은 검으로, 단검보다 몇 인치 정도 더 길 뿐입니다.
items.weapon.melee.shortsword.name=단검
items.weapon.melee.shortsword.typical_ability_desc=결투사는 단검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 일반적으로 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적이 즉사하면 결투사는 5턴 이내에 무료로 다시 베기 공격을 사용할 수 있습니다.
items.weapon.melee.sickle.ability_desc=결투사는 낫으로 적을 베어낼 수 있습니다. 이 파괴적인 공격은 반드시 명중하며 %d의 피해를 입힙니다. 대상이 출혈 면역이 아니라면 이 피해는 출혈 효과로 이어집니다.
items.weapon.melee.sickle.ability_name=수확하다
items.weapon.melee.sickle.desc=손으로 들고 쓰는 농기구이면서 강력하지만 다루기 힘든 무기로도 사용할 수 있다.
items.weapon.melee.sickle.name=낫
items.weapon.melee.sickle.stats_desc=이 무기는 정확도가 상당히 떨어집니다.
items.weapon.melee.sickle.typical_ability_desc=결투사는 낫으로 적을 베어낼 수 있습니다. 이 파괴적인 공격은 반드시 명중하며 일반적으로 %d의 피해를 입힙니다. 대상이 출혈 면역이 아니라면 이 피해는 출혈 효과로 이어집니다.
items.weapon.melee.spear.ability_desc=결투사는 사정거리 내에 있지만 인접하지 않은 적을 창끝으로 찌를 수 있습니다. 이 공격은 %1$d-%2$d의 피해를 주고 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.spear.ability_name=스파이크
items.weapon.melee.spear.desc=끝이 뾰족한 쇠붙이가 달린 가느다란 나무 막대기.
items.weapon.melee.spear.name=창
items.weapon.melee.spear.stats_desc=이 무기는 상당히 느립니다. \n 이 무기는 사거리가 더 깁니다.
items.weapon.melee.spear.typical_ability_desc=결투사는 사정거리 내에 있지만 인접하지 않은 적을 창끝으로 찌를 수 있습니다. 이 공격은 일반적으로 %1$d-%2$d의 피해를 입히고 적을 뒤로 밀쳐내며, 반드시 명중합니다.
items.weapon.melee.sword$cleavetracker.desc=결투사는 이전의 베기 공격에 이어 다음 베기 공격을 할 준비가 되었습니다. 다음 베기 공격은 무기 능력 충전량을 소모하지 않습니다. \n\n남은 턴: %s.
items.weapon.melee.sword$cleavetracker.name=쪼개다
items.weapon.melee.sword.ability_desc=결투사는 검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적을 처치하면 즉사하며, 결투사는 5턴 이내에 베기 공격을 무료로 다시 사용할 수 있습니다.
items.weapon.melee.sword.ability_name=쪼개다
items.weapon.melee.sword.desc=균형이 잘 잡힌 검입니다. 너무 크지도 않고, 그렇다고 단검보다 확실히 길지도 않습니다.
items.weapon.melee.sword.name=검
items.weapon.melee.sword.typical_ability_desc=결투사는 검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 일반적으로 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적이 즉사하면 결투사는 5턴 이내에 무료로 다시 베기 공격을 사용할 수 있습니다.
items.weapon.melee.warhammer.ability_desc=결투사는 전투망치로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만, 일반적인 피해를 입힙니다.
items.weapon.melee.warhammer.ability_name=강한 타격
items.weapon.melee.warhammer.desc=이 거대한 납과 강철 덩어리의 강력한 일격을 견딜 수 있는 생물은 거의 없지만, 효과적으로 사용하려면 엄청난 힘이 필요하다.
items.weapon.melee.warhammer.name=워 해머
items.weapon.melee.warhammer.stats_desc=이 무기는 상당히 정확합니다.
items.weapon.melee.warhammer.typical_ability_desc=결투사는 전투망치로 강력한 일격을 가할 수 있습니다. 이 집중 공격은 적을 기습했을 경우 일반적으로 %1$d-%2$d의 피해를 입히고, 5턴 동안 적을 기절시켜 명중률과 회피율을 50%%만큼 감소시킵니다. 강력한 일격은 적을 기습하지 않았을 경우 항상 명중하지만 일반적인 피해를 입힙니다.
items.weapon.melee.warscythe.ability_desc=결투사는 전쟁 낫으로 적을 _수확_할 수 있습니다. 이 파괴적인 공격은 반드시 명중하며 _%d의 피해_를 입힙니다. 대상이 출혈 면역이 아니라면 이 피해는 출혈 효과로 적용됩니다.
items.weapon.melee.warscythe.ability_name=수확하다
items.weapon.melee.warscythe.desc=이 크고 다루기 힘든 도구는 적을 베는 데 더 적합하도록 강화되었으며, 작물을 베는 데는 그다지 효과적이지 않습니다.
items.weapon.melee.warscythe.name=전쟁 낫
items.weapon.melee.warscythe.stats_desc=이 무기는 정확도가 상당히 떨어집니다.
items.weapon.melee.warscythe.typical_ability_desc=결투사는 전쟁 낫으로 적을 _수확_할 수 있습니다. 이 파괴적인 공격은 반드시 명중하며 일반적으로 _%d의 피해_를 입힙니다. 대상이 출혈 면역이 아니라면 이 피해는 출혈 효과로 적용됩니다.
items.weapon.melee.whip.ability_desc=결투사는 채찍으로 주변의 모든 적을 공격할 수 있습니다. 이 능력은 %1$d-%2$d의 피해를 입히고, 공격 범위 내의 모든 적을 공격하며, 반드시 명중합니다.
items.weapon.melee.whip.ability_name=속눈썹
items.weapon.melee.whip.desc=이 무기 끝에 달린 가시 달린 밧줄은 공격력은 약하지만, 그 사거리는 타의 추종을 불허합니다.
items.weapon.melee.whip.name=채찍
items.weapon.melee.whip.stats_desc=이 무기는 사거리가 엄청나게 깁니다.
items.weapon.melee.whip.typical_ability_desc=결투사는 채찍으로 주변의 모든 적을 공격할 수 있습니다. 이 능력은 일반적으로 %1$d-%2$d의 피해를 입히고, 공격 범위 내의 모든 적을 공격하며, 반드시 명중합니다.
items.weapon.melee.wornshortsword.ability_desc=결투사는 낡은 단검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 _%1$d-%2$d의 피해_를 입히며 반드시 명중합니다. 베기 공격으로 적이 즉사하면 결투사는 5턴 이내에 무료로 다시 베기 공격을 사용할 수 있습니다.
items.weapon.melee.wornshortsword.ability_name=쪼개다
items.weapon.melee.wornshortsword.desc=상당히 짧은 검으로, 많이 사용해서 마모되었습니다. 상태가 좋은 단검보다 약하고 약간 가볍습니다.
items.weapon.melee.wornshortsword.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.melee.wornshortsword.name=낡은 단검
items.weapon.melee.wornshortsword.typical_ability_desc=결투사는 낡은 단검으로 적을 베는 공격을 할 수 있습니다. 이 공격은 일반적으로 %1$d-%2$d의 피해를 주며, 반드시 명중합니다. 베기 공격으로 적이 즉사하면 결투사는 5턴 이내에 무료로 다시 베기 공격을 사용할 수 있습니다.
items.weapon.missiles.bolas.desc=이 특이한 원거리 무기들은 위력은 약하지만, 목표물의 속도를 늦추는 데는 탁월한 효과를 발휘합니다.
items.weapon.missiles.bolas.name=볼라스
items.weapon.missiles.bolas.stats_desc=이 무기는 대상에게 심각한 부상을 입힙니다.
items.weapon.missiles.boomerang.desc=납작하고 구부러진 나무로 만든 이 투사체는 적에게 던지면 던진 사람의 손으로 되돌아옵니다.
items.weapon.missiles.boomerang.durability=견고한 구조 덕분에 이 부메랑은 사용 중에 부러지지 않습니다.
items.weapon.missiles.boomerang.name=부메랑
items.weapon.missiles.darts.adrenalinedart.desc=이 화살촉에는 엉겅퀴 추출물을 기반으로 한 화합물이 발라져 있어 아군의 이동 속도와 공격 속도를 높여주거나 적의 이동 속도를 일시적으로 낮춥니다. 화살 자체는 적에게 피해를 주지만 아군에게는 해를 끼치지 않습니다.
items.weapon.missiles.darts.adrenalinedart.name=아드레날린 다트
items.weapon.missiles.darts.blindingdart.desc=이 화살촉에는 맹독성 식물에서 추출한 화합물이 발라져 있어 목표물의 시야를 잠시 흐리게 합니다. 하지만 방향 감각을 잃게 하지는 않으므로 적은 마지막으로 당신을 본 위치를 여전히 알 수 있습니다.
items.weapon.missiles.darts.blindingdart.name=눈을 멀게 하는 화살
items.weapon.missiles.darts.chillingdart.desc=이 다트는 빙하에서 추출한 성분을 기반으로 한 화합물로 끝부분이 코팅되어 있어 목표물을 상당히 차갑게 만듭니다.
items.weapon.missiles.darts.chillingdart.name=오싹한 다트
items.weapon.missiles.darts.cleansingdart.desc=이 다트는 마게로얄 기반 화합물로 끝부분이 코팅되어 있어 아군을 일시적으로 모든 부정적 효과에 면역으로 만들거나 적의 긍정적 효과를 제거합니다. 적들은 심지어 공격하거나 도망치고 있다는 사실조차 잠시 잊어버릴 수도 있습니다. 다트 자체는 적에게만 해롭고 아군에게는 아무런 피해를 주지 않습니다.
items.weapon.missiles.darts.cleansingdart.name=정화 다트
items.weapon.missiles.darts.dart.ac_tip=팁
items.weapon.missiles.darts.dart.desc=이 단순한 나무 막대기는 끝이 뾰족하게 되어 있으며, 무게 중심이 잘 잡혀 있어 정확하게 날아가 손목을 휙 움직이는 것만으로도 먹잇감을 찌를 수 있습니다. 씨앗을 끝에 붙여 던질 때 추가적인 효과를 얻을 수도 있습니다.
items.weapon.missiles.darts.dart.name=다트
items.weapon.missiles.darts.dart.prompt=씨앗을 선택하세요
items.weapon.missiles.darts.dart.tip_all=%1$d 다트 끝에 %2$d 씨앗을 넣으세요.
items.weapon.missiles.darts.dart.tip_cancel=취소
items.weapon.missiles.darts.dart.tip_desc=씨앗은 하나 또는 두 개의 다트와 결합하여 다트 끝에 붙일 수 있습니다. 각 씨앗 종류는 고유한 효과를 가진 다트 끝 장식을 만들어내며, 한 번만 사용할 수 있습니다. (\n\n) 이 씨앗으로 다트 끝 장식을 만들면 _%s_가 됩니다.
items.weapon.missiles.darts.dart.tip_one=다트 끝에 씨앗 1개를 꽂으세요.
items.weapon.missiles.darts.dart.tip_title=팁 다트
items.weapon.missiles.darts.dart.tip_two=다트 2개 끝에 씨앗 1개를 끼우세요.
items.weapon.missiles.darts.dart.unlimited_uses=간단한 구조 덕분에 다트는 사실상 영구적으로 사용할 수 있습니다.
items.weapon.missiles.darts.displacingdart.desc=이 다트는 잎사귀를 기반으로 한 화합물이 끝에 발라져 있어 목표물을 짧은 거리만큼 순간 이동시킵니다.
items.weapon.missiles.darts.displacingdart.name=다트를 이동시키다
items.weapon.missiles.darts.healingdart.desc=이 화살촉에는 해바라기풀을 기반으로 한 화합물이 묻어 있어 대상에게 순간적인 치유 효과를 부여합니다. 화살 자체는 적에게는 여전히 위험하지만 아군에게는 해를 끼치지 않습니다.
items.weapon.missiles.darts.healingdart.name=치유의 화살
items.weapon.missiles.darts.holydart.desc=이 화살촉에는 별꽃 추출물을 기반으로 한 화합물이 발라져 있어 목표물에 신성한 에너지를 불어넣습니다. 아군과 일반 적은 축복을 받지만, 언데드나 악마 적은 큰 피해를 입습니다. 화살 자체는 적에게만 해롭고 아군에게는 아무런 피해를 주지 않습니다.
items.weapon.missiles.darts.holydart.name=성스러운 화살
items.weapon.missiles.darts.incendiarydart.desc=이 다트는 화염을 일으키는 화합물로 끝부분이 코팅되어 있어, 명중 시 화려한 불꽃을 일으킵니다.
items.weapon.missiles.darts.incendiarydart.name=소이탄
items.weapon.missiles.darts.paralyticdart.desc=이 화살촉에는 흙뿌리에서 추출한 화합물이 발라져 있어 목표물을 단시간 동안 마비시킵니다.
items.weapon.missiles.darts.paralyticdart.name=마비 화살
items.weapon.missiles.darts.poisondart.desc=이 화살촉에는 슬픔이끼를 기반으로 한 화합물이 발라져 있어 목표물을 독살합니다.
items.weapon.missiles.darts.poisondart.name=독침
items.weapon.missiles.darts.rotdart.desc=이 사악한 다트는 산성 로트베리 기반 화합물로 끝부분이 코팅되어 있어 닿는 모든 것을 맹렬하게 부식시킵니다. 강력한 적은 대부분의 부식 효과에 저항하지만, 일반 적들은 이 부식성 물질로 쉽게 처치할 수 있습니다. 이 다트는 다른 다트보다 오래가지만, 내구성을 높일 수는 없습니다.
items.weapon.missiles.darts.rotdart.discover_hint=특정 퀘스트에서 얻은 시드를 사용하여 이 아이템을 제작할 수 있습니다.
items.weapon.missiles.darts.rotdart.name=썩은 다트
items.weapon.missiles.darts.shockingdart.desc=이 다트는 폭풍덩굴을 기반으로 한 화합물로 끝부분이 코팅되어 있어 목표물에 심한 충격을 가합니다.
items.weapon.missiles.darts.shockingdart.name=충격적인 다트
items.weapon.missiles.darts.tippeddart.about_to_break=다트 끝부분의 수명이 거의 다 됐습니다.
items.weapon.missiles.darts.tippeddart.ac_clean=깨끗한
items.weapon.missiles.darts.tippeddart.cancel=취소
items.weapon.missiles.darts.tippeddart.clean_all=모두 청소하세요
items.weapon.missiles.darts.tippeddart.clean_desc=이 작업을 수행하면 다트의 시드 팁이 제거되어 일반 다트로 되돌아갑니다.
items.weapon.missiles.darts.tippeddart.clean_one=깨끗한 것
items.weapon.missiles.darts.tippeddart.clean_title=클린 다트
items.weapon.missiles.darts.tippeddart.discover_hint=이 아이템은 상점에서 구입하거나 시드를 사용하여 만들 수 있습니다.
items.weapon.missiles.darts.tippeddart.has_broken=다트 끝의 수명이 다했습니다.
items.weapon.missiles.darts.tippeddart.unlimited_uses=하지만 이 제품들은 품질이 매우 뛰어나서 사실상 영구적으로 사용할 수 있을 것입니다.
items.weapon.missiles.darts.tippeddart.uses_left=이 다트 묶음에는 다트 끝 하나가 닳기 전에 _%d/%d_번 사용할 수 있는 여유가 있습니다.
items.weapon.missiles.fishingspear.desc=낚시용으로 설계되었지만, 즉석 무기로도 훌륭한 성능을 발휘하는 아주 작은 투척용 창.
items.weapon.missiles.fishingspear.name=낚시용 창
items.weapon.missiles.forcecube.desc=이 기묘한 모양의 마법 큐브는 손에 쥘 수 있을 만큼 작지만, 엄청나게 무겁습니다.
items.weapon.missiles.forcecube.name=포스 큐브
items.weapon.missiles.forcecube.ondeath=넌 네 포스 큐브로 자살했어...
items.weapon.missiles.forcecube.stats_desc=이 무기는 충격력을 좁은 영역에 분산시켜 주변의 모든 것을 파괴합니다.
items.weapon.missiles.heavyboomerang.desc=이 거대한 부메랑은 효과적으로 다루기 어렵지만 상당한 피해를 입힐 수 있습니다.
items.weapon.missiles.heavyboomerang.name=무거운 부메랑
items.weapon.missiles.heavyboomerang.stats_desc=이 무기는 5턴 후에 던진 위치로 되돌아옵니다.
items.weapon.missiles.javelin.desc=이러한 대형 투창은 무게 중심이 잘 잡혀 있어 창끝의 뾰족한 부분이 공중을 날아갈 때 앞쪽으로 향하도록 설계되었습니다.
items.weapon.missiles.javelin.name=던지는 창
items.weapon.missiles.kunai.desc=이 작은 칼들은 숙련된 사용자의 손에서 매우 강력한 위력을 발휘합니다.
items.weapon.missiles.kunai.name=쿠나이
items.weapon.missiles.kunai.stats_desc=이 무기는 방심한 적에게 더 효과적입니다.
items.weapon.missiles.missileweapon$placeholder.name=투척 무기
items.weapon.missiles.missileweapon.about_to_break=당신이 던진 무기가 곧 부러질 것 같습니다.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=강화 투척 무기 세트의 마지막 투척 무기가 파손되면 해당 세트는 영구적으로 사라집니다. 정말 던지시겠습니까?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=아니요
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=예
items.weapon.missiles.missileweapon.curse_discover=이 투척 무기는 저주받았어!
items.weapon.missiles.missileweapon.distance=투척 무기는 원거리에서는 정확도가 높지만 근거리에서는 정확도가 떨어집니다.
items.weapon.missiles.missileweapon.durability=투척 무기는 사용하면서 마모되고 부러지게 됩니다.
items.weapon.missiles.missileweapon.dust=던진 무기는 만지는 순간 먼지로 부서진다.
items.weapon.missiles.missileweapon.has_broken=당신이 던진 무기 중 하나가 파손되었습니다.
items.weapon.missiles.missileweapon.probably_too_heavy=아마 이 무기는 당신에게 너무 무거울 겁니다.
items.weapon.missiles.missileweapon.stats_known=이 _티어-%1$d_ 투척 무기 세트는 _%2$d-%3$d의 피해_를 입히며 사용하려면 _%4$d의 힘_이 필요합니다.
items.weapon.missiles.missileweapon.stats_unknown=일반적으로 이 _티어-%1$d_ 투척 무기 세트는 _%2$d-%3$d의 피해_를 입히고 사용하려면 _%4$d의 힘_이 필요합니다.
items.weapon.missiles.missileweapon.unknown_uses=일반적으로 이 투척 무기 세트는 하나가 부서지기 전에 _%d_번 사용할 수 있습니다.
items.weapon.missiles.missileweapon.unlimited_uses=이 세트는 품질이 매우 뛰어나 사실상 영구적으로 사용할 수 있을 것입니다.
items.weapon.missiles.missileweapon.uses_left=이 투척 무기 세트는 하나가 파손되기 전까지 _%d/%d_번 사용할 수 있습니다.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=방금 즉시 수리검을 던졌으므로 다시 던지려면 기다려야 합니다. 수리검은 계속 던질 수 있지만 일반 무기 속도로 던집니다. \n\n남은 턴: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=수리검 재사용 대기시간
items.weapon.missiles.shuriken.desc=면도날처럼 날카로운 날이 달린 별 모양 금속 조각으로, 명중하면 큰 상처를 냅니다. 아주 빠르게 던질 수 있습니다.
items.weapon.missiles.shuriken.name=수리검
items.weapon.missiles.shuriken.stats_desc=수리검은 20턴의 재사용 대기시간 후 즉시 던질 수 있습니다.
items.weapon.missiles.throwingclub.desc=비교적 단순하지만 내구성이 뛰어난 투척 무기로, 기본적으로 막대기에 커다란 돌을 붙인 형태입니다.
items.weapon.missiles.throwingclub.name=던지는 곤봉
items.weapon.missiles.throwingclub.stats_desc=이 무기는 적에게 달라붙지 않으며 즉시 획득할 수 있습니다.
items.weapon.missiles.throwinghammer.desc=이 묵직한 망치는 적에게 던지기 위해 설계되었습니다. 매끄러운 금속 재질로 만들어져 내구성이 매우 뛰어납니다.
items.weapon.missiles.throwinghammer.name=던지는 망치
items.weapon.missiles.throwinghammer.stats_desc=이 무기는 적에게 달라붙지 않으며 즉시 획득할 수 있습니다.
items.weapon.missiles.throwingknife.desc=이 가벼운 칼들은 균형이 잘 잡혀 있어 공중에서 포물선을 그리며 목표물에 정확히 명중합니다.
items.weapon.missiles.throwingknife.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.missiles.throwingknife.name=던지는 칼
items.weapon.missiles.throwingknife.stats_desc=이 무기는 방심한 적에게 더 효과적입니다.
items.weapon.missiles.throwingspear.desc=이 가벼운 창은 얇은 틀로 만들어져 있어 찌르기보다는 던지기에 적합합니다.
items.weapon.missiles.throwingspear.name=투창
items.weapon.missiles.throwingspike.desc=이 튼튼하고 뾰족한 금속 막대는 멀리 있는 적에게 던지기 위해 만들어졌습니다.
items.weapon.missiles.throwingspike.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.missiles.throwingspike.name=스파이크 던지기
items.weapon.missiles.throwingstone.desc=이 돌들은 일반 돌보다 더 강하게 던질 수 있도록 표면을 매끄럽게 다듬었습니다.
items.weapon.missiles.throwingstone.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.missiles.throwingstone.name=돌 던지기
items.weapon.missiles.tomahawk.desc=이 투척용 도끼는 톱니 모양의 날이 있어 적에게 박히면서 찢어지는 효과를 냅니다.
items.weapon.missiles.tomahawk.name=큰 도끼
items.weapon.missiles.tomahawk.stats_desc=이 무기는 대상에게 _%1$d-%2$d 출혈_ 효과를 부여합니다.
items.weapon.missiles.tomahawk.typical_stats_desc=이 무기는 일반적으로 대상에게 _%1$d-%2$d 출혈_ 효과를 부여합니다.
items.weapon.missiles.trident.desc=끝에 세 개의 날카로운 갈고리가 달린 거대한 투창. 위력은 강력하지만 상당히 무겁다.
items.weapon.missiles.trident.name=삼지창
items.weapon.spiritbow.ac_shoot=사격
items.weapon.spiritbow.desc=고대의 마법 나무로 만들어진 활. 활시위와 새겨진 문양은 옅은 푸른빛을 발한다. 활시위를 당기면 마법 화살이 소환되어 적에게 발사할 수 있다.
items.weapon.spiritbow.discover_hint=영웅 중 한 명이 이 아이템을 가지고 시작합니다.
items.weapon.spiritbow.name=스피릿 보우
items.weapon.spiritbow.prompt=목표를 선택하세요
items.weapon.spiritbow.stats=활은 직접 업그레이드할 수 없지만, 레벨이 오를수록 점차 강해집니다. 현재 레벨에서 활에서 쏘는 화살은 _%1$d-%2$d의 피해를 입히며, 제대로 사용하려면 _%3$d의 힘이 필요합니다_.
items.weapon.weapon$enchantment.discover_hint=던전에서 무작위로 이 효과가 있는 아이템을 찾을 수도 있고, 직접 아이템에 적용해 볼 수도 있습니다.
items.weapon.weapon$enchantment.enchant=마법
items.weapon.weapon$enchantment.rankings_desc=마법에 걸려 죽었다
items.weapon.weapon.cursed=이 무기에는 사악한 마법이 도사리고 있음을 느낄 수 있다.
items.weapon.weapon.cursed_worn=이 무기는 저주받았기 때문에 당신은 그것을 없앨 수 없습니다.
items.weapon.weapon.enchant_hardened=그것은 경화되었습니다.
items.weapon.weapon.enchanted=이것은 _%s_를 가지고 있습니다.
items.weapon.weapon.excess_str=당신은 과도한 힘 때문에 이 무기로 _0-%d의 추가 피해_를 입힐 것입니다.
items.weapon.weapon.faster=속도 향상을 위해 강화되었습니다.
items.weapon.weapon.hardened_no_enchant=이 무기는 강화되었지만, 현재 마법 부여는 되어 있지 않습니다.
items.weapon.weapon.hardening_gone=이 무기의 경화 처리가 벗겨졌습니다!
items.weapon.weapon.identify=이제 당신은 자신의 무기를 식별할 수 있을 만큼 충분히 익숙해졌습니다.
items.weapon.weapon.incompatible=서로 다른 종류의 마법이 상호작용하여 이 무기에 걸린 마법이 무효화되었습니다!
items.weapon.weapon.not_cursed=이 무기는 악의적인 마법에 물들지 않았습니다.
items.weapon.weapon.stronger=피해량을 증가시키도록 강화되었습니다.
items.weapon.weapon.too_heavy=당신의 부족한 힘 때문에 이 무기는 공격 속도, 정확도, 그리고 기습 공격 능력을 저해할 것입니다.
items.weapon.weapon.weak_cursed=저주에도 불구하고, 당신은 이 무기를 해제할 수 있습니다.

items.keys.skeletonkey.desc=이 열쇠는 뭔가 심상치 않아 보이네요. 머리 부분이 해골 모양이라니. 아마도 아주 중요한 문을 열 수 있을 것 같아요.
items.weapon.missiles.bombarrow.desc=폭탄이 달린 화살입니다. 거리를 유지하세요.
items.weapon.missiles.bombarrow.name=폭탄 화살
items.weapon.missiles.missileweapon.damage_desc=이 무기는 공격당 _%1$d_에서 _%2$d_의 피해를 입힙니다.
items.bags.seedpouch.desc=이 작은 벨벳 주머니에는 씨앗을 얼마든지 담을 수 있습니다. 무척 편리합니다.
items.bags.seedpouch.name=씨앗 주머니
items.potions.potionofmight.desc=이 강력한 액체는 근육으로 퍼져 힘을 1, 체력을 5만큼 영구히 늘려 줍니다.
items.potions.potionofmight.name=완력의 물약
items.rings.ringofdetection.desc=이 반지를 끼면 따로 찾는 데 시간을 쓰지 않아도 숨겨진 함정과 비밀 문을 알아챌 수 있습니다. 약화된 탐지의 반지는 감각을 둔하게 하여 직접 찾을 때조차 비밀을 발견하기 어렵게 만듭니다.
items.rings.ringofdetection.name=탐지의 반지
items.rings.ringofhaggler.desc=사실 이 반지에는 마법 효과가 없습니다. 대신 상인들에게 착용자가 도둑 길드의 일원임을 알립니다. 상인들은 한동안 건드리지 않겠다는 약속을 받으면 기꺼이 값을 깎아 줍니다. 반지를 강화해도 더 큰 이득은 없습니다.
items.rings.ringofhaggler.name=흥정꾼의 반지
items.rings.ringofherbalism.desc=이 반지는 풀을 밟을 때 이슬과 씨앗을 얻을 확률을 높입니다.
items.rings.ringofherbalism.name=약초학의 반지
items.rings.ringofmending.desc=이 반지는 몸의 재생력을 높여 잃은 체력을 더 빨리 되찾게 합니다. 약화된 반지는 자연 회복을 늦추거나 아예 멈추게 합니다.
items.rings.ringofmending.name=치유의 반지
items.rings.ringofpower.desc=이 반지에서 뿜어져 나오는 에너지는 마법 막대의 힘을 높입니다. 약화된 마력의 반지는 오히려 막대를 약하게 만듭니다.
items.rings.ringofpower.name=마력의 반지
items.rings.ringofsatiety.desc=이 반지를 끼면 먹지 않고도 더 오래 버틸 수 있습니다. 약화된 포만의 반지는 반대로 작용합니다.
items.rings.ringofsatiety.name=포만의 반지
items.rings.ringofshadows.desc=이 반지를 착용하면 적들이 당신을 알아차릴 가능성이 줄어듭니다. 그림자 반지가 손상되면 평소에는 눈치채지 못했을 적들도 당신의 존재를 알아차리게 됩니다.
items.rings.ringofshadows.name=그림자의 반지
items.rings.ringofthorns.desc=진짜 가시가 돋지는 않지만, 당신을 공격한 적은 자신이 입힌 피해의 일부를 되돌려 받습니다. 반지를 강화해도 더 큰 이득은 없습니다.
items.rings.ringofthorns.name=가시 반지
items.scrolls.scrollofchallenge.desc=이 두루마리를 소리 내어 읽으면 위협적인 포효가 울려 퍼져 모든 괴물을 깨우고 읽는 사람의 위치를 알려줍니다.
items.scrolls.scrollofchallenge.name=도전의 주문서
items.scrolls.scrollofenchantment.desc=이 두루마리는 무기나 갑옷에 무작위 마법을 부여하여 특별한 능력을 불어넣을 수 있습니다.
items.scrolls.scrollofenchantment.name=마법 부여의 주문서
items.scrolls.scrollofpsionicblast.desc=이 두루마리에는 파괴적인 에너지가 담겨 있으며, 이를 정신력으로 집중시키면 시야 내 모든 생명체에게 막대한 피해를 입힐 수 있습니다. 또한, 섬광과 함께 두루마리를 읽는 자를 포함하여 효과 범위 내 모든 존재의 시력을 일시적으로 상실하게 합니다.
items.scrolls.scrollofpsionicblast.name=정신 폭발의 주문서
items.scrolls.scrollofwipeout.desc=이 두루마리를 읽으면 던전 정령의 분노가 unleashed되어 현재 레벨의 모든 것이 사라집니다. 물론, 거의 모든 것이 죽지만요. 일부 강력한 몬스터는 영향을 받지 않을 수도 있습니다.
items.scrolls.scrollofwipeout.name=전멸의 주문서
items.wands.wandofblink.desc=이 막대는 선택한 방향으로 순간이동하게 해 줍니다. 생물이나 장애물이 있으면 그 앞에서 이동이 멈춥니다.
items.wands.wandofblink.name=순간이동의 마법 막대
items.wands.wandoffirebolt.desc=이 막대는 마법의 불꽃을 쏩니다. 불에 타는 지형을 점화하고, 맞은 생물에게 피해를 주며 불을 붙입니다.
items.wands.wandoffirebolt.name=화염탄의 마법 막대
