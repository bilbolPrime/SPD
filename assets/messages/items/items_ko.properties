items.weapon.weaponeffects.weaponeffect.smite.prefix=거친
items.weapon.weaponeffects.weaponeffect.smite.name=거친 %s
items.weapon.weaponeffects.weaponeffect.smite.desc=이 무기는 _거칩니다_. 적중 시 _20%_ 확률로 _1레벨 강타_를 발동합니다.
items.weapon.weaponeffects.weaponeffect.smite.activate=강타!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=밀쳐내는
items.weapon.weaponeffects.weaponeffect.knockback.name=밀쳐내는 %s
items.weapon.weaponeffects.weaponeffect.knockback.desc=이 무기는 적을 _밀쳐냅니다_. 적중 시 _20%_ 확률로 적을 _한 칸_ 밀어냅니다. 보스는 밀어낼 수 없습니다.
items.weapon.weaponeffects.weaponeffect.knockback.activate=넉백!

items.weapon.weaponeffects.weaponeffect.venom.prefix=뱀의
items.weapon.weaponeffects.weaponeffect.venom.name=뱀의 %s
items.weapon.weaponeffects.weaponeffect.venom.desc=이 무기에는 _뱀의_ 독이 깃들어 있습니다. 적중 시 _20%_ 확률로 대상을 중독시킵니다.
items.weapon.weaponeffects.weaponeffect.venom.activate=독액!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=불구의
items.weapon.weaponeffects.weaponeffect.kneeshot.name=불구의 %s
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=이 무기는 적을 _불구로 만듭니다_. 원거리 공격 적중 시 _20%_ 확률로 적을 _10턴_ 동안 불구로 만듭니다. 보스에게는 통하지 않습니다.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=불구!

items.weapon.weaponeffects.weaponeffect.spark.prefix=룬의
items.weapon.weaponeffects.weaponeffect.spark.name=룬의 %s
items.weapon.weaponeffects.weaponeffect.spark.desc=이 마법 막대에는 _룬_이 새겨져 있습니다. 마법이 _20%_ 확률로 _불꽃_을 일으켜 _4–8_의 추가 마법 피해를 줍니다.
items.weapon.weaponeffects.weaponeffect.spark.activate=불꽃!

items.weapon.weaponeffects.weaponeffect.curse.prefix=주술의
items.weapon.weaponeffects.weaponeffect.curse.name=주술의 %s
items.weapon.weaponeffects.weaponeffect.curse.desc=이 마법 막대에는 _주술_이 깃들어 있습니다. 마법이 _20%_ 확률로 대상을 약화시켜 _10턴_ 동안 대상이 주는 피해를 _5%_ 줄입니다.
items.weapon.weaponeffects.weaponeffect.curse.activate=저주!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=흡명의
items.weapon.weaponeffects.weaponeffect.drainlife.name=흡명의 %s
items.weapon.weaponeffects.weaponeffect.drainlife.desc=이 마법 막대는 _생명력을 흡수합니다_. 마법이 _20%_ 확률로 _8–16_의 추가 마법 피해를 주고, 대상에게서 빼앗은 체력만큼 사용자를 치유합니다.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=흡수!

items.armor.armorprefix.stalwart.name=굳건한 %s
items.armor.armorprefix.stalwart.desc=이 갑옷은 _굳건합니다_. 적의 공격을 받으면 _20%_ 확률로 _5레벨 강인함_이 발동하여 해당 피해를 _20%_ 줄입니다.
items.armor.armorprefix.stalwart.activate=강인함!

items.armor.armorprefix.vigilant.name=경계의 %s
items.armor.armorprefix.vigilant.desc=이 갑옷은 _경계심_을 높여 줍니다. _20%_ 확률로 적의 원거리 공격을 피합니다.
items.armor.armorprefix.vigilant.activate=경계!

items.armor.armorprefix.elusive.name=날렵한 %s
items.armor.armorprefix.elusive.desc=이 갑옷은 사용자를 _날렵하게_ 만듭니다. 적의 공격으로 피해를 받으면 _20%_ 확률로 _5턴_ 동안 회피가 _5_ 증가합니다.
items.armor.armorprefix.elusive.activate=회피!
