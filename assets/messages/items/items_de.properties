items.weapon.weaponeffects.weaponeffect.smite.prefix=Barbarisch
items.weapon.weaponeffects.weaponeffect.smite.name=%s der Barbaren
items.weapon.weaponeffects.weaponeffect.smite.desc=Diese Waffe ist _barbarisch_. Treffer lösen mit _20%_ Wahrscheinlichkeit _Schlag auf Stufe 1_ aus.
items.weapon.weaponeffects.weaponeffect.smite.activate=Schlag!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Zurückstoßend
items.weapon.weaponeffects.weaponeffect.knockback.name=%s des Rückstoßes
items.weapon.weaponeffects.weaponeffect.knockback.desc=Diese Waffe ist _zurückstoßend_. Treffer stoßen einen Gegner mit _20%_ Wahrscheinlichkeit _ein Feld_ zurück. Bosse können nicht zurückgestoßen werden.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Rückstoß!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Schlangenhaft
items.weapon.weaponeffects.weaponeffect.venom.name=%s der Schlange
items.weapon.weaponeffects.weaponeffect.venom.desc=Diese Waffe ist _schlangenhaft_. Treffer vergiften das Ziel mit _20%_ Wahrscheinlichkeit.
items.weapon.weaponeffects.weaponeffect.venom.activate=Gift!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Verkrüppelnd
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s der Verkrüppelung
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Diese Waffe ist _verkrüppelnd_. Fernkampftreffer verkrüppeln einen Gegner mit _20%_ Wahrscheinlichkeit für _10 Runden_. Bosse sind immun.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Verkrüppelt!

