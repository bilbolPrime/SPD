items.weapon.weaponeffects.weaponeffect.spark.name=%s der Runen
items.weapon.weaponeffects.weaponeffect.spark.desc=Dieser Zauberstab ist _runisch_. Seine Magie löst mit _20%_ Wahrscheinlichkeit _Funke_ aus und verursacht _4–8_ zusätzlichen Magieschaden.
