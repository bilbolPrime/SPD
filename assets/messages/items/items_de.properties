items.amulet.ac_end=SPIEL BEENDEN
items.amulet.ascent_desc=Du spürst, wie Yog-Dzewas gewaltige und furchtbare Macht vom Amulett ausgeht. Der Aufstieg durch den Dungeon als Sterblicher könnte schwieriger werden als gedacht! Wenn du mit dem Amulett weiter aufsteigst, wird der Dungeon gefährlicher, Teleportationen zwischen den Ebenen werden deaktiviert und du kannst das Spiel nur noch gewinnen, indem du Gegner auf deinem Weg durch den Dungeon besiegst! Du kannst das Amulett vorerst hier lassen, wenn du aufsteigen möchtest, ohne diese Herausforderung anzunehmen, oder es vor dem Aufstieg aktivieren, um das Spiel normal zu beenden.
items.amulet.ascent_no=Halt für jetzt
items.amulet.ascent_title=Aufstieg
items.amulet.ascent_yes=Weitermachen!
items.amulet.desc=Das Amulett von Yendor ist das mächtigste Artefakt, das Menschen und Zwergen bekannt ist. Seine schimmernden Kristalle bergen unglaubliche und wundersame Kräfte.
items.amulet.desc_ascent=Die Herkunft des Amuletts ist unbekannt, doch es ist offensichtlich stark von Yog-Dzewas Macht beeinflusst. Der Dungeon scheint sich Yogs Willen zu beugen, während man ihn durchquert, wodurch die Gegner deutlich zahlreicher und stärker werden! Man kann das Amulett auch nicht mehr aktivieren oder ablegen, fast so, als wäre es verflucht.
items.amulet.desc_origins=Die Herkunft des Amuletts ist unbekannt. Der Legende nach prahlte der Zwergenkönig damit, das Artefakt kurz vor dem Abbruch des Kontakts zur Zwergenzivilisation entdeckt zu haben. Wie fand er es? Wie konnte Yog-Dzewa es ihm abnehmen? Fragen für ein anderes Mal; jetzt zählt nur noch eins: Das Amulett gehört dir!
items.amulet.discover_hint=Diesen Gegenstand findest du ganz unten im Verlies...
items.amulet.name=Amulett von Yendor
items.ankh.ac_bless=segnen
items.ankh.bless=Du segnest das Ankh mit magischem Wasser.
items.ankh.desc=Dieses uralte Symbol der Unsterblichkeit lässt dich nach dem Tod ins Leben zurückkehren. Bei der Wiederauferstehung gehen alle nicht angelegten Gegenstände verloren.
items.ankh.desc_blessed=Dieses uralte Symbol der Unsterblichkeit verleiht die Fähigkeit, nach dem Tod ins Leben zurückzukehren. Das Anch wurde gesegnet und ist nun viel stärker. Das Anch wird sich opfern, um dich in tödlicher Gefahr zu retten.
items.ankh.discover_hint=Diesen Artikel können Sie in einem Geschäft kaufen.
items.ankh.name=Ankh
items.arcaneresin.ac_apply=ANWENDEN
items.arcaneresin.apply=Du überziehst deinen Zauberstab mit Harz und verstärkst so seine Kraft!
items.arcaneresin.desc=Dieses feine Pulver schimmert zwischen Violett- und Weißtönen. Es verstärkt magische Energien und erhöht so die Stufe von Zauberstäben, wenn es auf sie aufgetragen wird! Die Aufwertung eines Zauberstabs kostet 1, 2 oder 3 Harz, abhängig von seiner Ausgangsstufe. Harz kann Zauberstäbe maximal um +3 aufwerten. Harz-Aufwertungen werden jedoch durch andere Aufwertungsquellen (wie z. B. Schriftrollen der Aufwertung) überschrieben und haben keine Wirkung, wenn ein Zauberstab in den Stab des Magiers eingesetzt wird.
items.arcaneresin.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.arcaneresin.level_too_high=Dieser Zauberstab ist zu mächtig, als dass Harz ihn verbessern könnte.
items.arcaneresin.name=geheimnisvolles Harz
items.arcaneresin.not_enough=Dafür hast du nicht genug Harz!
items.arcaneresin.prompt=Wähle einen Zauberstab
items.armor.armor$glyph.discover_hint=Du kannst im Dungeon zufällig einen Gegenstand mit diesem Effekt finden oder versuchen, ihn selbst auf einen Gegenstand anzuwenden.
items.armor.armor$glyph.glyph=Glyphe
items.armor.armor$glyph.killed=%s hat dich getötet...
items.armor.armor$glyph.rankings_desc=Von einer Glyphe getötet
items.armor.armor.ac_detach=ABNEHMEN
items.armor.armor.avg_absorb=Typischerweise blockiert diese _tier-%1$d_ Rüstung _%2$d-%3$d Schaden_ und erfordert _%4$d Stärke_, um richtig eingesetzt zu werden.
items.armor.armor.curr_absorb=Diese Rüstung der Stufe _tier-%1$d_ blockiert _%2$d-%3$d Schaden_ und erfordert _%4$d Stärke_, um richtig eingesetzt zu werden.
items.armor.armor.cursed=Man spürt eine bösartige Magie, die in dieser Rüstung lauert.
items.armor.armor.cursed_worn=Da diese Rüstung verflucht ist, bist du machtlos, sie abzulegen.
items.armor.armor.defense=Es wurde erweitert, um die Verteidigung zu verbessern.
items.armor.armor.detach_seal=Du trennst das Siegel von deiner Rüstung.
items.armor.armor.equip_cursed=Die Rüstung schnürt dich schmerzhaft ein.
items.armor.armor.evasion=Es wurde erweitert, um die _Ausweichfähigkeit_ zu verbessern.
items.armor.armor.excess_str=Aufgrund deiner übermenschlichen Stärke bist du in dieser Rüstung _ausweichender_.
items.armor.armor.glyph_hardened=Es wurde gehärtet.
items.armor.armor.hardened_no_glyph=Diese Rüstung wurde gehärtet, trägt aber derzeit keine Glyphe.
items.armor.armor.hardening_gone=Die Härtung dieser Rüstung hat nachgelassen!
items.armor.armor.identify=Du kennst deine Rüstung nun gut genug, um sie zu identifizieren.
items.armor.armor.incompatible=Durch das Zusammenwirken verschiedener Arten von Magie wurde die Glyphe auf dieser Rüstung ausgelöscht!
items.armor.armor.inscribed=Es trägt die Inschrift _%s._
items.armor.armor.not_cursed=Diese Rüstung ist frei von bösartiger Magie.
items.armor.armor.probably_too_heavy=Diese Rüstung ist wahrscheinlich zu schwer für dich.
items.armor.armor.seal_attached=Das gebrochene Siegel des Kriegers ist an dieser Rüstung befestigt. Wenn seine Gesundheit unter die Hälfte sinkt, gewährt es ihm einen Schutzschild.
items.armor.armor.seal_transfer=Das gebrochene Siegel des Kriegers muss an seiner aktuell getragenen Rüstung angebracht werden, damit es ihm nützt. Möchtest du das Siegel automatisch von der Rüstung, die du ablegst, lösen und an der Rüstung anbringen, die du anlegst?
items.armor.armor.seal_transfer_no=NEIN
items.armor.armor.seal_transfer_yes=Ja
items.armor.armor.too_heavy=Aufgrund Ihrer unzureichenden Stärke wird das Tragen dieser Rüstung Ihre Bewegungs-, Ausweich- und Verteidigungsfähigkeit einschränken.
items.armor.armor.weak_cursed=Trotz des Fluchs kannst du diese Rüstung ablegen.
items.armor.classarmor.ac_ability=WÄHLE DIE FÄHIGKEIT
items.armor.classarmor.ac_transfer=ÜBERWEISEN
items.armor.classarmor.charge_use=Die Nutzung dieser Funktion verbraucht jetzt _%s_ Ladung.
items.armor.classarmor.discover_hint=Diesen Gegenstand findet man, nachdem man den Boss in Ebene 20 mit einem bestimmten Helden besiegt hat.
items.armor.classarmor.low_charge=Die Rüstung hat nicht genügend Ladung, um ihre Spezialkraft einzusetzen!
items.armor.classarmor.no_ability=Deine Rüstung hat momentan keine Fähigkeit, du solltest eine auswählen!
items.armor.classarmor.not_equipped=Du musst diese Rüstung tragen, um ihre Spezialkraft nutzen zu können!
items.armor.classarmor.transfer_cancel=stornieren
items.armor.classarmor.transfer_complete=Die Eigenschaften eurer Heldenrüstung wurden übertragen!
items.armor.classarmor.transfer_desc=Die Magie der Krone des Zwergenkönigs kann auf eine andere Rüstung übertragen werden. Beachte, dass die ursprüngliche Rüstung dabei zerstört wird.
items.armor.classarmor.transfer_prompt=Wähle eine Rüstung
items.armor.classarmor.transfer_title=Panzerung übertragen
items.armor.clericarmor.desc=Beim Tragen dieser Mischung aus Stoff und Plattenrüstung kann der Kleriker eine besondere Fähigkeit einsetzen.
items.armor.clericarmor.name=Heldengewänder
items.armor.clotharmor.desc=Diese leichte Rüstung bietet grundlegenden Schutz.
items.armor.clotharmor.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.armor.clotharmor.name=Stoffrüstung
items.armor.curses.antientropy.desc=Der Anti-Entropie-Fluch wirkt den Kräften des Universums entgegen, indem er Energie in den Träger hinein und aus seiner Umgebung wegzieht. Dies setzt den Träger kurzzeitig in Brand, während alles um ihn herum gefriert!
items.armor.curses.antientropy.name=%s der Anti-Entropie
items.armor.curses.bulk.desc=Schwere Rüstungen wirken zwar größer und imposanter, bieten aber keinen besseren Schutz. Schlimmer noch: Durch ihre zusätzliche Größe wird das Passieren von Türen erheblich erschwert.
items.armor.curses.bulk.name=%s von Bulk
items.armor.curses.corrosion.desc=Die Korrosionspanzerung kann durch ätzende Flüssigkeit aufplatzen und alles in der Umgebung mit klebrigem, säurehaltigem Schlamm überziehen.
items.armor.curses.corrosion.name=%s der Korrosion
items.armor.curses.displacement.desc=Der Fluch der Verschiebung versucht, den Träger bei einem Angriff in Sicherheit zu bringen. Er ist jedoch etwas zu effektiv und teleportiert den Benutzer willkürlich durch das Level.
items.armor.curses.displacement.name=%s der Verschiebung
items.armor.curses.metabolism.desc=Der Stoffwechselfluch wandelt Sättigung direkt in Gesundheit um, wenn der Träger verletzt wird, was zwar die Heilung beschleunigt, aber schnell zu Hunger führt.
items.armor.curses.metabolism.name=%s des Stoffwechsels
items.armor.curses.multiplicity.desc=Rüstungen, die mit dem Fluch der Vielheit belegt sind, bergen gefährliche Duplikationsmagie. Sie erzeugen mitunter ein Spiegelbild des Trägers, aber genauso wahrscheinlich ist es, dass sie den Angreifer duplizieren!
items.armor.curses.multiplicity.name=%s der Vielfachheit
items.armor.curses.overgrowth.desc=Die Rüstung des Überwucherns ist mit verschiedenen blühenden Pflanzen bedeckt. Dieser Effekt sieht zwar interessant aus, bietet aber keinerlei Verteidigungsvorteil, und diese Pflanzen werden im Kampf zufällig aktiviert!
items.armor.curses.overgrowth.name=%s des Überwucherns
items.armor.curses.stench.desc=Mit Gestank verfluchte Rüstungen setzen Wolken giftigen Gases frei, die für alles, was sich in der Wolke befindet, gefährlich sind.
items.armor.curses.stench.name=%s des Gestanks
items.armor.duelistarmor.desc=Beim Tragen dieser Plattenrüstung und des Umhangs kann der Duellant eine Spezialfähigkeit einsetzen.
items.armor.duelistarmor.name=Brustpanzer des Helden
items.armor.glyphs.affection.desc=Dieses mächtige Glyphe manipuliert den Verstand der Angreifer und bezaubert sie vorübergehend.
items.armor.glyphs.affection.name=%s der Zuneigung
items.armor.glyphs.antimagic.desc=Dieses mächtige Glyphe verleiht der Rüstung Schutz vor magischen wie auch vor physischen Angriffen. Dieser magische Schutz wird nicht durch die Rüstungsstufe beeinflusst.
items.armor.glyphs.antimagic.name=%s der Anti-Magie
items.armor.glyphs.brimstone.desc=Dieses Glyphe schützt den Träger und seine Besitztümer vor Feuer und hebt dessen Schaden und negative Auswirkungen vollständig auf.
items.armor.glyphs.brimstone.name=%s von Schwefel
items.armor.glyphs.camouflage.desc=Dieses Symbol ermöglicht es dem Träger, mit hohem Gras zu verschmelzen und verleiht ihm vorübergehende Unsichtbarkeit.
items.armor.glyphs.camouflage.name=%s der Tarnung
items.armor.glyphs.entanglement.desc=Dieses Glyphe lässt um den Träger eine Art Erdpanzer wachsen, der Schaden absorbiert, aber dieser Panzer zerbricht, wenn sich der Träger bewegt.
items.armor.glyphs.entanglement.name=%s der Verschränkung
items.armor.glyphs.flow.desc=Dieses Glyphe manipuliert den Wasserfluss um den Träger herum und macht ihn dadurch viel schneller, wenn er sich darin bewegt.
items.armor.glyphs.flow.name=%s des Flusses
items.armor.glyphs.obfuscation.desc=Dieses Glyphe verhüllt den Träger und macht ihn dadurch schwerer erkennbar.
items.armor.glyphs.obfuscation.name=%s der Verschleierung
items.armor.glyphs.potential.desc=Dieses Symbol baut beim Anschlagen Energie auf und lädt so den Zauberstab des Trägers auf, sobald es aktiviert wird.
items.armor.glyphs.potential.name=%s potenziell
items.armor.glyphs.repulsion.desc=Dieses Symbol lenkt die Kraft gegen Angreifer zurück und schleudert sie weg.
items.armor.glyphs.repulsion.name=%s der Abstoßung
items.armor.glyphs.stone.desc=Dieses Glyphe umgibt die Rüstung mit schwerem magischem Stein, der Ausweichen unmöglich macht, aber Schaden im Verhältnis zur Ausweichrate abblockt.
items.armor.glyphs.stone.name=%s aus Stein
items.armor.glyphs.swiftness.desc=Dieses Symbol erhöht die Geschwindigkeit des Trägers, solange er sich nicht in der Nähe eines Feindes befindet.
items.armor.glyphs.swiftness.name=%s der Schnelligkeit
items.armor.glyphs.thorns.desc=Dieses mächtige Symbol fügt Angreifern Schaden zu und lässt sie langsam bluten, wenn sie den Träger angreifen.
items.armor.glyphs.thorns.name=%s von Dornen
items.armor.glyphs.viscosity$defereddamage.desc=Der Schaden wird langsam über einen längeren Zeitraum anstatt sofort verursacht.\n\nVerbleibender verzögerter Schaden: %d.
items.armor.glyphs.viscosity$defereddamage.name=aufgeschobener Schaden
items.armor.glyphs.viscosity$defereddamage.ondeath=Der aufgeschobene Schaden hat dich getötet...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Getötet durch aufgeschobenen Schaden
items.armor.glyphs.viscosity.deferred=aufgeschoben %d
items.armor.glyphs.viscosity.desc=Dieses Glyphe kann den dem Träger zugefügten Schaden speichern und ihn ihm langsam statt auf einmal zukommen lassen.
items.armor.glyphs.viscosity.name=%s der Viskosität
items.armor.huntressarmor.desc=Wenn die Jägerin diesen Umhang trägt, kann sie eine besondere Fähigkeit einsetzen.
items.armor.huntressarmor.name=Heldenmantel
items.armor.huntressarmor.no_enemies=Keine Feinde in Sicht
items.armor.leatherarmor.desc=Rüstung aus gegerbtem Monsterfell. Nicht so leicht wie Stoffrüstung, bietet aber besseren Schutz.
items.armor.leatherarmor.name=Lederrüstung
items.armor.magearmor.desc=Beim Tragen dieser prächtigen Robe kann der Magier eine besondere Fähigkeit einsetzen.
items.armor.magearmor.name=Heldenrobe
items.armor.mailarmor.desc=Ineinandergreifende Metallglieder ergeben eine robuste, aber flexible Rüstung.
items.armor.mailarmor.name=Kettenrüstung
items.armor.platearmor.desc=Enorme Metallplatten werden zu einem Anzug zusammengefügt, der jedem Abenteurer, der stark genug ist, sein gewaltiges Gewicht zu tragen, unvergleichlichen Schutz bietet.
items.armor.platearmor.name=Plattenpanzerung
items.armor.roguearmor.desc=In dieser dunklen Kleidung kann der Schurke eine besondere Fähigkeit einsetzen.
items.armor.roguearmor.name=Heldenkleidung
items.armor.scalearmor.desc=Die auf eine Lederweste genähten Metallschuppen bilden eine flexible und dennoch schützende Rüstung.
items.armor.scalearmor.name=Schuppenpanzerung
items.armor.warriorarmor.desc=Beim Tragen dieser schweren Plattenrüstung kann der Krieger eine besondere Fähigkeit einsetzen.
items.armor.warriorarmor.name=Heldenplattenrüstung
items.artifacts.alchemiststoolkit.ac_brew=BRAUEN
items.artifacts.alchemiststoolkit.ac_energize=ENERGIE
items.artifacts.alchemiststoolkit.cursed=Dein verfluchtes Werkzeugset hindert dich daran, Alchemie anzuwenden!
items.artifacts.alchemiststoolkit.desc=Dieses Set enthält verschiedene Reagenzien und Kräuter sowie ein kleines Mischfläschchen für alchemistische Rituale unterwegs. Das Fläschchen enthält etwas, das wie alchemistische Energiekristalle in flüssiger Form aussieht.
items.artifacts.alchemiststoolkit.desc_cursed=Das verfluchte Werkzeugset hat sich an dich gebunden und weigert sich, dich Alchemie anwenden zu lassen.
items.artifacts.alchemiststoolkit.desc_hint=Das ausgerüstete Werkzeugset erzeugt mit zunehmender Erfahrung langsam alchemistische Energie. Es sieht so aus, als ließe sich die Mischung im Fläschchen durch die Zugabe von Energiekristallen verstärken.
items.artifacts.alchemiststoolkit.desc_warming=Das Toolkit wird gerade aufwärmt und ist nach kurzer Zeit einsatzbereit.
items.artifacts.alchemiststoolkit.energize_1=6 Energie: +1 Stufe
items.artifacts.alchemiststoolkit.energize_all=%1$d Energie: +%2$d Niveaus
items.artifacts.alchemiststoolkit.energize_desc=Alle 6 Energiekristalle geben dem Werkzeugkasten genug Energie, um eine Stufe aufzusteigen. Dadurch erhöht sich die Rate, mit der der Werkzeugkasten im Laufe der Zeit Energie erzeugt, und wie schnell er sich aufwärmt. Wie viel Energie möchten Sie verwenden?
items.artifacts.alchemiststoolkit.name=Werkzeugkasten des Alchemisten
items.artifacts.alchemiststoolkit.need_energy=Dafür benötigst du mindestens 6 Energie.
items.artifacts.alchemiststoolkit.not_ready=Ihr Werkzeugkasten ist noch nicht vollständig auf Betriebsbereitschaft.
items.artifacts.artifact.cannot_wear_two=Man kann nicht zwei gleiche Artefakte tragen.
items.artifacts.artifact.curse_known=Man spürt, wie eine bösartige Magie in dem Artefakt lauert.
items.artifacts.artifact.equip_cursed=Das Artefakt bindet sich auf schmerzhafte Weise an dich.
items.artifacts.artifact.need_to_equip=Dazu musst du dein Artefakt ausrüsten.
items.artifacts.artifact.not_cursed=Dieses Artefakt ist frei von böswilliger Magie.
items.artifacts.capeofthorns$thorns.desc=Dein Umhang strahlt Energie aus und umgibt dich mit einem Feld ablenkender Kraft! \n\nJeglicher Schaden, den du erleidest, wird reduziert, solange der Dorneneffekt aktiv ist. Befindet sich der Angreifer neben dir, wird der reduzierte Schaden zusätzlich auf ihn zurückgeworfen. \n\nVerbleibende Dornenumdrehungen: %s.
items.artifacts.capeofthorns$thorns.inert=Dein Umhang wird wieder wirkungslos.
items.artifacts.capeofthorns$thorns.levelup=Dein Umhang wird stärker!
items.artifacts.capeofthorns$thorns.name=Dornen
items.artifacts.capeofthorns$thorns.radiating=Ihr Cape beginnt Energie auszustrahlen, Sie fühlen sich beschützt!
items.artifacts.capeofthorns.desc=Diese zusammengefallenen Metallplatten der DM-300 haben sich zu einem starren Umhang verbunden. Er scheint eine immense Energie zu speichern; vielleicht besitzt er einen Teil der Kraft der DM-300?
items.artifacts.capeofthorns.desc_active=Der Umhang scheint gespeicherte Energie freizusetzen, er strahlt eine schützende Kraft aus.
items.artifacts.capeofthorns.desc_inactive=Der Umhang fühlt sich beruhigend schwer auf deinen Schultern an, er scheint aus dem Schaden, den du erleidest, Energie zu gewinnen.
items.artifacts.capeofthorns.name=Dornenkap
items.artifacts.chaliceofblood.ac_prick=STECHEN
items.artifacts.chaliceofblood.desc=Dieser glänzende silberne Kelch ist am Rand seltsamerweise mit scharfen Edelsteinen verziert.
items.artifacts.chaliceofblood.desc_1=Während du den Kelch in Händen hältst, verspürst du einen seltsamen Drang, dich an den scharfen Edelsteinen zu stechen.
items.artifacts.chaliceofblood.desc_2=Ein Teil deines Blutes sammelt sich im Kelch, und du spürst, wie er dir Lebensenergie zuführt und deine natürlichen Regenerationskräfte stärkt. Trotzdem möchtest du dich am Kelch schneiden, obwohl du weißt, dass es weh tun wird.
items.artifacts.chaliceofblood.desc_3=Der Kelch ist bis zum Rand mit deiner Lebensessenz gefüllt. Du kannst spüren, wie der Kelch Lebensenergie in dich zurückfließen lässt.
items.artifacts.chaliceofblood.desc_cursed=Der verfluchte Kelch hat sich an deine Hand gebunden und behindert deine Fähigkeit, deine Gesundheit zu regenerieren.
items.artifacts.chaliceofblood.name=Kelch des Blutes
items.artifacts.chaliceofblood.no=Nein, ich habe meine Meinung geändert
items.artifacts.chaliceofblood.ondeath=Der Kelch saugt dir die Lebensessenz aus...
items.artifacts.chaliceofblood.onprick=Du stichst dich, und deine Lebensessenz strömt in den Kelch.
items.artifacts.chaliceofblood.prick_warn=Jedes Mal, wenn du den Kelch benutzt, verbraucht er mehr Lebensenergie, verstärkt aber im Gegenzug deine natürliche Gesundheitsregeneration. Derzeit verursacht das Stechen selbst Schaden, der jedoch durch physische und magische Blockierung oder Schadensreduktion verringert werden kann. Ohne Berücksichtigung von Schadensreduktionseffekten besteht derzeit eine Chance von 2 bis 3, dass das Stechen deine Lebenskraft vollständig aufbraucht. Bist du sicher, dass du dem Kelch weitere Lebensenergie geben möchtest?
items.artifacts.chaliceofblood.yes=Ja, ich weiß, was ich tue.
items.artifacts.cloakofshadows$cloakstealth.desc=Dein Schattenmantel verleiht dir Unsichtbarkeit, solange du von ihm umhüllt bist. Du bleibst unsichtbar, bis der Effekt aufgehoben wird oder die Ladung deines Mantels aufgebraucht ist. Solange du unsichtbar bist, können dich Feinde weder angreifen noch verfolgen. Physische Angriffe und magische Effekte (wie Schriftrollen und Zauberstäbe) heben die Unsichtbarkeit sofort auf. Runden bis zur Aufladung: 0
items.artifacts.cloakofshadows$cloakstealth.levelup=Dein Umhang wird stärker!
items.artifacts.cloakofshadows$cloakstealth.name=verhüllt
items.artifacts.cloakofshadows$cloakstealth.no_charge=Dein Umhang hat keine Energie mehr.
items.artifacts.cloakofshadows.ac_stealth=Tarnung
items.artifacts.cloakofshadows.cooldown=Dein Tarnumhang benötigt %d weitere Runden, um sich wieder aufzuladen.
items.artifacts.cloakofshadows.cursed=Du kannst keinen verfluchten Umhang benutzen.
items.artifacts.cloakofshadows.desc=Ein unbezahlbarer magischer Umhang, vor vielen Jahren vom Schurken aus der königlichen Waffenkammer gestohlen. Beim Tragen verleiht er dem Schurken für kurze Zeit vollkommene Unsichtbarkeit. Je öfter der Umhang benutzt wird, desto stärker wird seine Wirkung, wodurch der Schurke immer häufiger und länger unsichtbar werden kann.
items.artifacts.cloakofshadows.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.artifacts.cloakofshadows.name=Mantel der Schatten
items.artifacts.cloakofshadows.no_charge=Dein Umhang ist noch nicht ausreichend aufgeladen, um einsatzbereit zu sein.
items.artifacts.driedrose$ghosthero.blessed_ankh_1=Wie hast du das überlebt?
items.artifacts.driedrose$ghosthero.blessed_ankh_2=Ich wünschte, ich hätte auch so einen...
items.artifacts.driedrose$ghosthero.blessed_ankh_3=Oh je! Du lebst ja noch!
items.artifacts.driedrose$ghosthero.def_verb=ausgewichen
items.artifacts.driedrose$ghosthero.defeated_by_boss_1=Es tut mir leid... viel Glück...
items.artifacts.driedrose$ghosthero.defeated_by_boss_2=Mach es fertig... ohne mich...
items.artifacts.driedrose$ghosthero.defeated_by_boss_3=Nein... ich kann nicht...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_1=Viel Glück...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_2=Müde... vorerst...
items.artifacts.driedrose$ghosthero.defeated_by_enemy_3=Ich werde zurückkehren...
items.artifacts.driedrose$ghosthero.desc=Eine zerbrechlich wirkende, ätherische Gestalt mit menschenähnlichen Zügen. Ihre Macht scheint an die Rose gebunden zu sein, die du besitzt. Dieser Geist mag nicht viel bedeuten, doch er scheint dein einziger wahrer Freund hier unten zu sein.
items.artifacts.driedrose$ghosthero.dialogue_ascension_1=Warum passiert das? Ich dachte, wir hätten es geschafft!
items.artifacts.driedrose$ghosthero.dialogue_ascension_2=Wie kann dieses Ding diese Welt noch immer beeinflussen?
items.artifacts.driedrose$ghosthero.dialogue_ascension_3=Ich hoffe, du weißt, was du mit diesem Amulett anstellst.
items.artifacts.driedrose$ghosthero.dialogue_ascension_4=Ich nehme an, wir sind noch nicht fertig.
items.artifacts.driedrose$ghosthero.dialogue_ascension_5=Wir sind schon so weit gekommen, wir können das auch schaffen!
items.artifacts.driedrose$ghosthero.dialogue_ascension_6=Nur noch ein kleines Stück, dann schaffen wir es hier raus!
items.artifacts.driedrose$ghosthero.dialogue_caves_1=Seit sehr langer Zeit hat sich hier kein Mensch und kein Zwerg mehr aufgehalten.
items.artifacts.driedrose$ghosthero.dialogue_caves_2=Was würde die Zwerge dazu veranlassen, eine Goldmine zu verlassen?
items.artifacts.driedrose$ghosthero.dialogue_caves_3=Schade, dass das ganze Gold hier an der Oberfläche nutzlos ist.
items.artifacts.driedrose$ghosthero.dialogue_caves_4=Die Kreaturen hier sind verdreht, genau wie in der Kanalisation.
items.artifacts.driedrose$ghosthero.dialogue_caves_5=Sogar die Fledermäuse sind hier blutrünstig.
items.artifacts.driedrose$ghosthero.dialogue_caves_6=Keine Spur von Bergbauausrüstung, haben die Zwerge alles zurückerobert?
items.artifacts.driedrose$ghosthero.dialogue_city_1=Die Zwerge waren fleißig, aber gierig.
items.artifacts.driedrose$ghosthero.dialogue_city_2=Die Zwergenmetropole ist also tatsächlich gefallen.
items.artifacts.driedrose$ghosthero.dialogue_city_3=Ich hoffe, die Oberfläche endet niemals so wie dieser Ort.
items.artifacts.driedrose$ghosthero.dialogue_city_4=Zwerge sollten nicht so blass aussehen.
items.artifacts.driedrose$ghosthero.dialogue_city_5=Ich weiß nicht, was schlimmer ist, die Zwerge oder ihre Schöpfungen.
items.artifacts.driedrose$ghosthero.dialogue_city_6=Es scheint, als wären die Zwerge jetzt auch hirnlose Monster.
items.artifacts.driedrose$ghosthero.dialogue_halls_1=Was ist das für ein Ort?
items.artifacts.driedrose$ghosthero.dialogue_halls_2=Dieser Ort ist furchterregend...
items.artifacts.driedrose$ghosthero.dialogue_halls_3=Was dachten sich die Zwerge nur dabei, so mit der Macht zu spielen?
items.artifacts.driedrose$ghosthero.dialogue_halls_4=Die Monster hier sind außerweltlich, woher kommen sie?
items.artifacts.driedrose$ghosthero.dialogue_halls_5=Spürst du es? Es ist, als ob uns etwas beobachtet.
items.artifacts.driedrose$ghosthero.dialogue_halls_6=Gott sei Dank gibt es Taschenlampen, es ist so dunkel hier!
items.artifacts.driedrose$ghosthero.dialogue_prison_1=Ich habe Geschichten über diesen Ort gehört, nichts Gutes.
items.artifacts.driedrose$ghosthero.dialogue_prison_2=Dieser Ort war immer eher ein Verlies als ein Gefängnis.
items.artifacts.driedrose$ghosthero.dialogue_prison_3=Ich kann mir nicht vorstellen, was geschah, als dieser Ort verlassen wurde.
items.artifacts.driedrose$ghosthero.dialogue_prison_4=Es scheint, als seien sowohl die Gefangenen als auch die Wärter in Monster verwandelt worden.
items.artifacts.driedrose$ghosthero.dialogue_prison_5=Was könnte für all diese Skelette verantwortlich sein?
items.artifacts.driedrose$ghosthero.dialogue_prison_6=Diese Menschen hätten nicht so enden müssen...
items.artifacts.driedrose$ghosthero.dialogue_sewers_1=Früher waren diese Abwasserkanäle sicher, die Leute lebten hier sogar im Winter.
items.artifacts.driedrose$ghosthero.dialogue_sewers_2=Ich frage mich, was mit den Wachpatrouillen passiert ist, haben sie aufgegeben?
items.artifacts.driedrose$ghosthero.dialogue_sewers_3=Ich hatte Familie an der Oberfläche, ich hoffe, sie sind in Sicherheit.
items.artifacts.driedrose$ghosthero.dialogue_sewers_4=Die Wachen konnten diese Monster nicht besiegen, aber vielleicht können wir es.
items.artifacts.driedrose$ghosthero.dialogue_sewers_5=Wenn selbst die Kanalisation schon so gefährlich ist, frage ich mich, was sich darunter verbirgt...
items.artifacts.driedrose$ghosthero.dialogue_sewers_6=Was könnte die Ursache dafür sein, dass diese Ratten und Krebse so groß geworden sind?
items.artifacts.driedrose$ghosthero.direct_prompt=Was soll ich tun?
items.artifacts.driedrose$ghosthero.directed_attack_1=Okay, ich werde mich darum kümmern.
items.artifacts.driedrose$ghosthero.directed_attack_2=Ich nehme das.
items.artifacts.driedrose$ghosthero.directed_attack_3=Spannend...
items.artifacts.driedrose$ghosthero.directed_attack_4=Lasst sie uns holen!
items.artifacts.driedrose$ghosthero.directed_attack_5=Ich hab's.
items.artifacts.driedrose$ghosthero.directed_follow_1=Okay, ich folge dir.
items.artifacts.driedrose$ghosthero.directed_follow_2=Ich schließe mich dir an.
items.artifacts.driedrose$ghosthero.directed_follow_3=Ich folge Ihnen...
items.artifacts.driedrose$ghosthero.directed_follow_4=Okay, los geht's!
items.artifacts.driedrose$ghosthero.directed_follow_5=Ich stehe hinter dir.
items.artifacts.driedrose$ghosthero.directed_position_1=Okay, ich bleibe bei dieser Position.
items.artifacts.driedrose$ghosthero.directed_position_2=Ich werde hingehen und verteidigen.
items.artifacts.driedrose$ghosthero.directed_position_3=Neupositionierung...
items.artifacts.driedrose$ghosthero.directed_position_4=Auf meinem Weg!
items.artifacts.driedrose$ghosthero.directed_position_5=Ich werde hinübergehen.
items.artifacts.driedrose$ghosthero.discover_hint=Diese Figur kann man bei einem bestimmten Artefakt finden.
items.artifacts.driedrose$ghosthero.hello=Hallo nochmal %s.
items.artifacts.driedrose$ghosthero.introduce=Mein Geist ist an diese Rose gebunden, sie war mir sehr kostbar, ein Geschenk meiner Liebe, die ich hier zurückließ. Ich kann nicht zu ihm zurückkehren, aber dank dir habe ich eine zweite Chance, meine Reise zu vollenden. Sobald ich dazu in der Lage bin, werde ich deinem Ruf folgen und an deiner Seite kämpfen. Solange du die Rose besitzt, kann ich deine Stimme hören, sodass du sie nutzen kannst, um mich aus der Ferne zu leiten. Hoffentlich gelingt es dir, wo ich gescheitert bin...
items.artifacts.driedrose$ghosthero.name=trauriger Geist
items.artifacts.driedrose$ghosthero.player_killed_1=NEIN!...
items.artifacts.driedrose$ghosthero.player_killed_2=Ich konnte ihnen nicht helfen...
items.artifacts.driedrose$ghosthero.player_killed_3=Nicht so...
items.artifacts.driedrose$ghosthero.seen_dm300_1=Nur Zwerge würden eine Bergbaumaschine bauen, die Eindringlinge tötet.
items.artifacts.driedrose$ghosthero.seen_dm300_2=Das Ding ist riesig...
items.artifacts.driedrose$ghosthero.seen_dm300_3=Wie konnte dieses Ding so lange aktiv bleiben?
items.artifacts.driedrose$ghosthero.seen_goo_1=Vorsicht, Schleim!
items.artifacts.driedrose$ghosthero.seen_goo_2=Viele meiner Freunde sind an dieser Sache gestorben, Zeit für Rache!
items.artifacts.driedrose$ghosthero.seen_goo_3=Ein solches Gräuel darf nicht am Leben bleiben!
items.artifacts.driedrose$ghosthero.seen_king_1=Wenn die Leute sagen, Macht korrumpiert, meinen sie genau das.
items.artifacts.driedrose$ghosthero.seen_king_2=Er ist mittlerweile eher ein Lich als ein König.
items.artifacts.driedrose$ghosthero.seen_king_3=Selbst im Tod gehorchen die Zwerge ihrem Herrn.
items.artifacts.driedrose$ghosthero.seen_tengu_1=Der letzte verbliebene Gefangene ist ein tödlicher Attentäter. Natürlich...
items.artifacts.driedrose$ghosthero.seen_tengu_2=Er hat uns in die Falle gelockt!
items.artifacts.driedrose$ghosthero.seen_tengu_3=Ich habe Horrorgeschichten über diese Maske gehört...
items.artifacts.driedrose$ghosthero.seen_yog_1=Oh, das sieht nicht gut aus.
items.artifacts.driedrose$ghosthero.seen_yog_2=So sieht also ein Gott aus?
items.artifacts.driedrose$ghosthero.seen_yog_3=Das wird weh tun...
items.artifacts.driedrose$petal.desc=Ein zerbrechliches, vertrocknetes Blütenblatt, das auf unerklärliche Weise bis hierher ins Verlies überlebt hat.
items.artifacts.driedrose$petal.levelup=Du fügst das Blütenblatt der Rose hinzu.
items.artifacts.driedrose$petal.maxlevel=Die Rose ist fertig!
items.artifacts.driedrose$petal.name=getrocknete Blütenblätter
items.artifacts.driedrose$petal.no_room=Für dieses Blütenblatt ist kein Platz mehr, also verwerfen Sie es.
items.artifacts.driedrose$petal.no_rose=Du hast keine Rose, an die du dieses Blütenblatt anbringen könntest.
items.artifacts.driedrose$wndghosthero.armor_prompt=Wähle eine Rüstung
items.artifacts.driedrose$wndghosthero.cant_cursed=Der Geist kann nur Ausrüstung benutzen, von der du sicher bist, dass sie nicht verflucht ist.
items.artifacts.driedrose$wndghosthero.cant_strength=Der Geist ist nicht stark genug, um das zu nutzen.
items.artifacts.driedrose$wndghosthero.cant_strength_unknown=Der Geist ist möglicherweise nicht stark genug, um das zu nutzen.
items.artifacts.driedrose$wndghosthero.cant_unique=Der Geist kann keine einzigartigen Gegenstände benutzen.
items.artifacts.driedrose$wndghosthero.desc=Der Geist ist von sich aus schwach, aber seine Gestalt ist fest genug, um mit Waffen und Rüstung ausgerüstet zu werden. Er kann diese Gegenstände genauso benutzen wie du. Der Geist kann derzeit Gegenstände ausrüsten, die eine Stärke von bis zu _%d erfordern._
items.artifacts.driedrose$wndghosthero.title=Ghosts Ausrüstung
items.artifacts.driedrose$wndghosthero.weapon_prompt=Wähle eine Waffe
items.artifacts.driedrose.ac_direct=DIREKT
items.artifacts.driedrose.ac_outfit=OUTFIT
items.artifacts.driedrose.ac_summon=BESCHWÖRUNG
items.artifacts.driedrose.charged=Ihre Rose ist voll aufgeladen!
items.artifacts.driedrose.cursed=Man kann keine verfluchte Rose verwenden.
items.artifacts.driedrose.desc=Ist das die Rose, die der Geist vor seinem Verschwinden erwähnte? Sie scheint eine gewisse spirituelle Kraft zu besitzen; vielleicht kann man mit ihr die Energie des verlorenen Kriegers kanalisieren.
items.artifacts.driedrose.desc_armor=Ghosts Rüstung: %s
items.artifacts.driedrose.desc_cursed=Die verfluchte Rose ist an deine Hand gebunden, sie fühlt sich unheimlich kalt an.
items.artifacts.driedrose.desc_hint=Es scheinen einige Blütenblätter zu fehlen. Vielleicht stärkt das Wiederanbringen die Rose.
items.artifacts.driedrose.desc_no_quest=Eine vertrocknete, alte Rose, die trotz ihres Alters irgendwie noch zusammenhält. Sie scheint eine gewisse spirituelle Kraft zu besitzen, aber du hast im Moment keine Ahnung, wie du sie einsetzen sollst.
items.artifacts.driedrose.desc_strength=Stärke des Geistes: %s
items.artifacts.driedrose.desc_weapon=Ghosts Waffe: %s
items.artifacts.driedrose.name=getrocknete Rose
items.artifacts.driedrose.no_charge=Deine Rose ist noch nicht vollständig aufgeladen.
items.artifacts.driedrose.no_space=In Ihrer Nähe ist kein Platz mehr frei.
items.artifacts.driedrose.spawned=Du hast den Geist bereits beschworen.
items.artifacts.etherealchains$chainsrecharge.levelup=Deine Ketten werden stärker!
items.artifacts.etherealchains.ac_cast=GIESSEN
items.artifacts.etherealchains.cant_pull=Deine Ketten können dieses Ziel nicht erreichen.
items.artifacts.etherealchains.cant_reach=Deine Ketten können dort nicht hinreichen.
items.artifacts.etherealchains.cursed=Verfluchte Ketten kann man nicht benutzen.
items.artifacts.etherealchains.desc=Diese großen, aber dennoch leichten Ketten leuchten vor spiritueller Energie. Man kann sie benutzen, um sich in Richtung Gelände zu ziehen oder Feinde heranzuziehen. Dank ihrer ätherischen Beschaffenheit können die Ketten sogar durch Wände hindurchreichen!
items.artifacts.etherealchains.desc_cursed=Die verfluchten Ketten sind an deiner Seite befestigt, schwingen ständig herum und versuchen, dich zu Fall zu bringen oder zu fesseln.
items.artifacts.etherealchains.desc_equipped=Die Ketten liegen um deine Seite und saugen langsam die spirituelle Energie deiner Besiegten auf. Jede Ladung entspricht einem Kettenglied, das sich genau ein Feld weit ausdehnt.
items.artifacts.etherealchains.does_nothing=Das wird nichts bringen.
items.artifacts.etherealchains.inside_wall=Deine Ketten können dich nur durch Wände ziehen, nicht in sie hinein.
items.artifacts.etherealchains.name=ätherische Ketten
items.artifacts.etherealchains.no_charge=Ihre Ketten sind nicht ausreichend geladen.
items.artifacts.etherealchains.nothing_to_grab=Da gibt es nichts zum Festhalten.
items.artifacts.etherealchains.prompt=Wählen Sie einen Zielort aus.
items.artifacts.etherealchains.rooted=Deine Ketten können dich nicht ziehen, solange du fest verwurzelt bist.
items.artifacts.holytome.ac_cast=GIESSEN
items.artifacts.holytome.cursed=Du kannst kein verfluchtes Buch benutzen.
items.artifacts.holytome.desc=Ein heiliges Buch, das als Fokus für die göttliche Magie des Klerikers dient. Durch die Benutzung des Buches kann der Kleriker eine Vielzahl von Zaubersprüchen wirken. Das Buch wird mit der Zeit immer mächtiger, wodurch der Kleriker mehr maximale Ladungen erhält und die Aufladegeschwindigkeit leicht erhöht wird.
items.artifacts.holytome.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.artifacts.holytome.levelup=Dein Buch wird immer stärker!
items.artifacts.holytome.name=heiliges Buch
items.artifacts.holytome.no_spell=Du kannst diesen Zauber im Moment nicht wirken.
items.artifacts.hornofplenty.ac_eat=ESSEN
items.artifacts.hornofplenty.ac_snack=SNACK
items.artifacts.hornofplenty.ac_store=SPEICHERN
items.artifacts.hornofplenty.desc=Man kann in dieses Horn nicht blasen, sondern es füllt sich scheinbar mit Nahrung, während man Abenteuer erlebt und Erfahrung sammelt. Man kann jede Ladung einzeln als Snack verzehren oder sich satt essen.
items.artifacts.hornofplenty.desc_cursed=Das verfluchte Horn hat sich an deine Seite gebunden; es scheint begierig darauf zu sein, Nahrung zu nehmen, anstatt sie zu produzieren.
items.artifacts.hornofplenty.desc_hint=Vielleicht gibt es eine Möglichkeit, die Leistung des Horns zu steigern, indem man ihm Nahrungsenergie zuführt.
items.artifacts.hornofplenty.eat=Man isst aus dem Horn.
items.artifacts.hornofplenty.feed=Das Horn verzehrt deine Speiseopfergabe.
items.artifacts.hornofplenty.full=Dein Horn ist voller Essen!
items.artifacts.hornofplenty.levelup=Das Horn verzehrt deine Speiseopfergabe und gewinnt an Kraft!
items.artifacts.hornofplenty.maxlevel=Dein Horn hat alles Futter verschlungen, was es fressen konnte!
items.artifacts.hornofplenty.name=Füllhorn
items.artifacts.hornofplenty.no_food=Dein Horn hat keine Nahrung darin!
items.artifacts.hornofplenty.prompt=Wähle ein paar Lebensmittel aus.
items.artifacts.hornofplenty.reject=Dein Horn verschmäht die rohe, geschmacklose Frucht.
items.artifacts.lloydsbeacon.ac_return=ZURÜCKKEHREN
items.artifacts.lloydsbeacon.ac_set=SATZ
items.artifacts.lloydsbeacon.ac_zap=ZAP
items.artifacts.lloydsbeacon.creatures=Die psychische Aura benachbarter Kreaturen erlaubt es Ihnen in diesem Moment nicht, das Lloyd-Leuchtfeuer zu benutzen.
items.artifacts.lloydsbeacon.desc=Lloyds Leuchtfeuer ist ein komplexes magisches Gerät, das dem Benutzer die Kontrolle über Teleportationsmagie verleiht. Mit dem Leuchtfeuer kann man zu einem festgelegten Ort zurückkehren, aber es kann, sobald es durch das Ausrüsten aufgeladen ist, auch zufällige Teleportationszauber aussenden. Diese Magie kann auf ein Ziel oder auf den Benutzer selbst gerichtet werden.
items.artifacts.lloydsbeacon.desc_set=Dieses Leuchtfeuer befand sich irgendwo auf Ebene %d von Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Dein Leuchtfeuer wird stärker!
items.artifacts.lloydsbeacon.name=Lloyd's Beacon
items.artifacts.lloydsbeacon.no_charge=Ihr Leuchtfeuer verfügt momentan nicht über genügend Energie.
items.artifacts.lloydsbeacon.preventing=Die starke magische Aura dieses Ortes hindert dich daran, das Lloyd-Leuchtfeuer zu benutzen!
items.artifacts.lloydsbeacon.prompt=Wähle einen Ort aus, der geblitzt werden soll.
items.artifacts.lloydsbeacon.return=Das Lloyd-Leuchtfeuer wurde erfolgreich an Ihrem aktuellen Standort platziert, Sie können nun jederzeit hierher zurückkehren.
items.artifacts.lloydsbeacon.tele_fail=Der Teleportationszauber schlägt fehl.
items.artifacts.masterthievesarmband.ac_steal=STEHLEN
items.artifacts.masterthievesarmband.cursed=Ein verfluchtes Armband kann man nicht benutzen.
items.artifacts.masterthievesarmband.desc=Dieses violette Samtarmband trägt die Handschrift eines Meisterdiebs. Es gehört nicht dir, aber vermutlich auch nicht seinem letzten Besitzer.
items.artifacts.masterthievesarmband.desc_cursed=Das verfluchte Armband ist an deinem Handgelenk befestigt, und irgendwie scheint dein Goldbeutel langsam leichter zu werden...
items.artifacts.masterthievesarmband.desc_worn=Du spürst, wie die Kraft in dem Armband an deinem Handgelenk mit zunehmender Erfahrung wächst. Diese Kraft kannst du nutzen, um in Läden zu stehlen oder Feinde auszurauben! Das Ausrauben von Feinden geschieht sofort, desorientiert sie kurzzeitig und gibt dir die Chance, ihre Beute zu ergattern! Diese Kraft ist besonders effektiv gegen ahnungslose Feinde. Wenn du denselben Feind mehrmals ausraubst, erhältst du keine zusätzlichen Beutechancen.
items.artifacts.masterthievesarmband.failed_steal=Du hast es nicht geschafft, etwas zu stehlen.
items.artifacts.masterthievesarmband.full=Ihr Armband ist vollständig aufgeladen!
items.artifacts.masterthievesarmband.level_up=Dein Armband wird stärker!
items.artifacts.masterthievesarmband.name=Armband für Meisterdiebe
items.artifacts.masterthievesarmband.no_charge=Ihr Armband ist nicht ausreichend geladen.
items.artifacts.masterthievesarmband.no_steal=Dieser Feind hat nichts zu stehlen.
items.artifacts.masterthievesarmband.no_target=Du musst einen Gegner anvisieren, der sich in deiner Nähe befindet.
items.artifacts.masterthievesarmband.prompt=Wähle einen Gegner als Ziel aus
items.artifacts.masterthievesarmband.steal_shopkeeper=Man kann Ladenbesitzer nicht direkt bestehlen.
items.artifacts.masterthievesarmband.stole_item=Du hast einen Gegenstand gestohlen: %s.
items.artifacts.sandalsofnature.absorb_seed=Das Schuhwerk saugt die Samen auf, die Schuhe scheinen gesünder zu sein.
items.artifacts.sandalsofnature.ac_feed=FÜTTERN
items.artifacts.sandalsofnature.ac_root=WURZEL
items.artifacts.sandalsofnature.desc_1=Was zunächst wie Sandalen aus Bindfaden aussieht, sind in Wirklichkeit zwei Pflanzen! Sie wirken sehr schwach und blass, vielleicht brauchen sie Nährstoffe?
items.artifacts.sandalsofnature.desc_2=Die Schuhe sind gewachsen und ähneln nun eher zwei maßgeschneiderten Schuhen. Sie haben wieder etwas Farbe angenommen, vielleicht können sie ja noch weiter wachsen?
items.artifacts.sandalsofnature.desc_3=Die Pflanzen sind wieder gewachsen und ähneln nun einem Paar fester Stiefel aus Rinde. Sie scheinen ihre Kraft zurückgewonnen zu haben, aber vielleicht können sie ja noch weiter wachsen?
items.artifacts.sandalsofnature.desc_4=Die Pflanzen scheinen ihre maximale Größe erreicht zu haben; sie ähneln einem Paar gepanzerter Beinschienen. Die Beinschienen sind dunkelbraun und sehen aus wie ein sehr kräftiger Baum.
items.artifacts.sandalsofnature.desc_ability=Die Schuhe schimmern in der Farbe des zuletzt gesäten Samens. Sie können kurzzeitig Wurzeln schlagen und den Effekt dieser Pflanze in einem Radius von 3 Feldern erzeugen.
items.artifacts.sandalsofnature.desc_cursed=Die verfluchten Sandalen verhindern jede Verbindung zur Natur.
items.artifacts.sandalsofnature.desc_hint=Beim Tragen dieses Artefakts fühlt man sich stärker mit der Natur verbunden.
items.artifacts.sandalsofnature.desc_seeds=Du hast dem Schuhwerk %d Samen gegeben.
items.artifacts.sandalsofnature.levelup=Ihre Schuhe nehmen an Größe zu!
items.artifacts.sandalsofnature.low_charge=Ihre Schuhe haben dafür nicht genügend Energie.
items.artifacts.sandalsofnature.name=Sandalen der Natur
items.artifacts.sandalsofnature.name_1=Schuhe der Natur
items.artifacts.sandalsofnature.name_2=Stiefel der Natur
items.artifacts.sandalsofnature.name_3=Beinschienen der Natur
items.artifacts.sandalsofnature.no_effect=Zuerst müssen Sie Ihrem Schuhwerk ein Samenkorn geben.
items.artifacts.sandalsofnature.out_of_range=Dieser Standort liegt außerhalb der Reichweite.
items.artifacts.sandalsofnature.prompt=Wähle einen Samen aus
items.artifacts.sandalsofnature.prompt_target=Wählen Sie einen Standort aus
items.artifacts.skeletonkey$keywall.desc=Hier wurde mithilfe des Skelettschlüssels eine temporäre magische Wand errichtet.
items.artifacts.skeletonkey.ac_insert=EINFÜGEN
items.artifacts.skeletonkey.crystal_charges=Zum Öffnen eines Kristallschlosses werden 5 Ladungen benötigt.
items.artifacts.skeletonkey.cursed=Einen verfluchten Skelettschlüssel kann man nicht benutzen.
items.artifacts.skeletonkey.desc=Ein wichtig aussehender Schlüssel mit einem schädelförmigen Kopf. Seine Zähne scheinen jedes Mal anders auszusehen, wenn man sie betrachtet.
items.artifacts.skeletonkey.desc_cursed=Der verfluchte Schlüssel scheint sich aktiv zu weigern, in irgendein Schloss zu passen, und macht es Ihnen sogar schwer (aber nicht unmöglich), Ihre anderen Schlüssel zu benutzen.
items.artifacts.skeletonkey.desc_worn=Dieser magische Schlüssel scheint mit der Zeit an Kraft zu gewinnen, wenn man ihn anstelle der normalen Dungeon-Schlüssel benutzt. Er kann in fast jedes Schloss des Dungeons gesteckt werden, um es zu öffnen oder zu schließen, sogar Türen, die zuvor nie verschlossen waren. Der Schlüssel kann sogar auf leerem Raum in einer der vier Himmelsrichtungen oder diagonal verwendet werden, um die Luft vor einem zu „sperren“ und so eine drei Felder breite, feste Wand zu erschaffen, die zehn Runden lang bestehen bleibt. Wenn genügend Platz vorhanden ist, werden Gegner durch die Sperrung zurückgestoßen.
items.artifacts.skeletonkey.discard=Sie entsorgen Ihre überflüssigen Schlüssel.
items.artifacts.skeletonkey.force_lock=Ohne Ihren Generalschlüssel ist das Schloss geschwächt. Es gelingt Ihnen, es aufzubrechen.
items.artifacts.skeletonkey.gold_charges=Zum Öffnen eines Goldschlosses werden 2 Ladungen benötigt.
items.artifacts.skeletonkey.invalid_target=Dort gibt es nichts zu verriegeln oder zu entriegeln.
items.artifacts.skeletonkey.iron_charges=Zum Öffnen eines normalen Schlosses wird eine Ladung benötigt.
items.artifacts.skeletonkey.levelup=Dein Generalschlüssel wird dadurch stärker!
items.artifacts.skeletonkey.lock_charges=Zum Abschließen einer Tür werden 2 Ladungen benötigt.
items.artifacts.skeletonkey.lock_no_space=Man kann eine Spielfigur nicht in einer Tür einsperren!
items.artifacts.skeletonkey.locked_with_key=Diese Tür war mit Ihrem Generalschlüssel verschlossen.
items.artifacts.skeletonkey.name=Dietrich
items.artifacts.skeletonkey.prompt=Wählen Sie ein Ziel aus
items.artifacts.skeletonkey.wall_charges=Für die Errichtung einer temporären Wand werden 2 Ladungen benötigt.
items.artifacts.skeletonkey.wont_open=Aus irgendeinem Grund passt der Schlüssel nicht in dieses Schloss.
items.artifacts.talismanofforesight$foresight.desc=Sie fühlen sich sehr nervös, als ob eine unsichtbare Gefahr in der Nähe lauerte.
items.artifacts.talismanofforesight$foresight.name=Voraussicht
items.artifacts.talismanofforesight$foresight.uneasy=Du fühlst dich unwohl.
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.desc=Ein glatter Stein mit seltsamen Gravuren. Man hat das Gefühl, er beobachtet alles um sich herum und hält Ausschau nach allem Verborgenen.
items.artifacts.talismanofforesight.desc_cursed=Der verfluchte Talisman starrt dich eindringlich an und betäubt deine Sinne.
items.artifacts.talismanofforesight.desc_worn=Wenn du den Talisman hältst, spürst du, wie deine Sinne geschärft werden. Der Talisman lädt sich langsam auf, je mehr Zeit vergeht und je mehr versteckte Türen oder Fallen du entdeckst. Mit seiner Ladung kann der Talisman einen kegelförmigen „Spähvorgang“ durchführen, der alle Felder und Geheimnisse im gescannten Bereich aufdeckt und dir für kurze Zeit Sicht auf Feinde und Gegenstände gewährt.
items.artifacts.talismanofforesight.full_charge=Dein Talisman ist vollständig aufgeladen!
items.artifacts.talismanofforesight.levelup=Dein Talisman wird stärker!
items.artifacts.talismanofforesight.low_charge=Der Talisman benötigt mindestens 5 % Ladung, um gespäht werden zu können.
items.artifacts.talismanofforesight.name=Talisman der Voraussicht
items.artifacts.talismanofforesight.prompt=Wählen Sie einen zu scannenden Ort aus.
items.artifacts.timekeepershourglass$sandbag.desc=Dieser kleine Beutel mit feinem Sand sollte perfekt für Ihre Sanduhr geeignet sein. Es erscheint seltsam, dass der Ladenbesitzer genau diesen Artikel ausgerechnet dann vorrätig hat, wenn Sie ihn brauchen...
items.artifacts.timekeepershourglass$sandbag.levelup=Du füllst den Sand in deine Sanduhr.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Deine Sanduhr ist mit magischem Sand gefüllt!
items.artifacts.timekeepershourglass$sandbag.name=Beutel mit Zaubersand
items.artifacts.timekeepershourglass$sandbag.no_hourglass=Du hast keine Sanduhr, in die du diesen Sand füllen könntest.
items.artifacts.timekeepershourglass$timefreeze.desc=Die Zeit um dich herum steht still, sodass du Aktionen sofort ausführen kannst. Der Effekt hält an, bis er abgebrochen wird oder deine Sanduhr leer ist. Angriffe oder Magie brechen diesen Effekt ebenfalls. \n\n Runden bis zur Aufladung: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Zeit anhalten
items.artifacts.timekeepershourglass.ac_activate=AKTIVIEREN
items.artifacts.timekeepershourglass.cursed=Man kann keine verfluchte Sanduhr benutzen.
items.artifacts.timekeepershourglass.deactivate=Sie deaktivieren die Zeitsperre.
items.artifacts.timekeepershourglass.desc=Diese große, reich verzierte Sanduhr wirkt recht unscheinbar, doch man spürt eine große Kraft in ihrem fein gearbeiteten Rahmen. Während man die Sanduhr dreht und den Sand rieseln sieht, spürt man ihre Magie, die einen magisch anzieht; sicherlich könnte man mit dieser Magie die Zeit beherrschen.
items.artifacts.timekeepershourglass.desc_cursed=Die verfluchte Sanduhr klebt an deiner Seite, du spürst, wie sie versucht, deinen Zeitfluss zu manipulieren.
items.artifacts.timekeepershourglass.desc_hint=Die Sanduhr scheint etwas Sand verloren zu haben, wenn man nur welchen finden könnte...
items.artifacts.timekeepershourglass.freeze=Die Zeit um mich herum einfrieren
items.artifacts.timekeepershourglass.name=Sanduhr des Zeitnehmers
items.artifacts.timekeepershourglass.no_charge=Ihre Sanduhr ist noch nicht ausreichend aufgeladen, um benutzt werden zu können.
items.artifacts.timekeepershourglass.onfreeze=Plötzlich erstarrt alles um dich herum.
items.artifacts.timekeepershourglass.onstasis=Die Welt um dich herum scheint sich in einem Augenblick zu verändern.
items.artifacts.timekeepershourglass.prompt=Wie möchtest du die Magie der Sanduhr nutzen? ZXQPH0 ZXQ ZXQPH1 ZXQ Im Stasis-Zustand vergeht die Zeit normal, während du eingefroren und völlig unverwundbar bist. Verbraucht bis zu 2 Ladungen gleichzeitig. ZXQPH2 ZXQ ZXQPH3 ZXQ Wenn die Zeit angehalten ist, kannst du dich bewegen, als ob deine Aktionen keine Zeit in Anspruch nähmen. Dieser Zustand kann jederzeit durch die Benutzung der Sanduhr oder durch einen Angriff deaktiviert werden.
items.artifacts.timekeepershourglass.stasis=Ich versetzte mich in Stasis
items.artifacts.unstablespellbook.ac_add=HINZUFÜGEN
items.artifacts.unstablespellbook.ac_read=LESEN
items.artifacts.unstablespellbook.blinded=Man kann nicht aus dem Buch lesen, wenn man blind ist.
items.artifacts.unstablespellbook.cursed=Man kann nicht aus einem verfluchten Zauberbuch lesen.
items.artifacts.unstablespellbook.desc=Dieses Buch ist für sein Alter in erstaunlich gutem Zustand. Es knistert und knistert beim Umblättern und pulsiert vor ungebändigter Energie. Wer aus diesem Buch liest, kann jeden Zauber wirken.
items.artifacts.unstablespellbook.desc_cursed=Das verfluchte Buch hat sich an dich gebunden und hindert dich daran, die meisten Schriftrollen zu benutzen.
items.artifacts.unstablespellbook.desc_empowered=Die Schriftrollen, die Sie dem Buch hinzugefügt haben, strahlen vor Macht. Sie können die exotische Version der Effekte dieser Schriftrollen auswählen, allerdings gegen einen Aufpreis.
items.artifacts.unstablespellbook.desc_index=Das Buch ist unvollständig. Sein Inhaltsverzeichnis verweist derzeit auf folgende leere Seiten:
items.artifacts.unstablespellbook.infuse_scroll=Du überträgst die Energie der Schriftrolle in das Buch.
items.artifacts.unstablespellbook.name=instabiles Zauberbuch
items.artifacts.unstablespellbook.no_charge=Dein Zauberbuch hat im Moment keine Energie mehr.
items.artifacts.unstablespellbook.prompt=Wählen Sie eine Schriftrolle aus.
items.artifacts.unstablespellbook.read_empowered=Die Schriftrolle, die du dem Zauberbuch hinzugefügt hast, ist voller Energie. Du kannst entweder die reguläre oder die exotische Version des Effekts dieser Schriftrolle nutzen. Die exotische Variante kostet 2 Ladungen statt 1.
items.artifacts.unstablespellbook.unable_scroll=Diese Schriftrolle kann dem Buch nicht hinzugefügt werden.
items.artifacts.unstablespellbook.unknown_scroll=Sie sind sich noch nicht sicher, um welche Art von Schriftrolle es sich handelt.
items.bags.bag.discover_hint=Diesen Artikel können Sie in einem Geschäft kaufen.
items.bags.bag.name=Rucksack
items.bags.magicalholster.desc=Dieses schlanke Holster ist aus exotischem Tierleder gefertigt und verfügt über mächtige Magie, die es ihm ermöglicht, eine große Anzahl an Fernkampfwaffen aufzubewahren. Man kann einfach in die Tasche greifen und findet immer den gesuchten Gegenstand. Dank der Magie des Holsters laden sich Zauberstäbe darin etwas schneller auf und Wurfwaffen halten etwas länger.
items.bags.magicalholster.name=magisches Holster
items.bags.potionbandolier.desc=Dieser dicke Patronengurt sitzt wie eine Schärpe um Ihre Brust und verfügt über zahlreiche isolierte Riemen zur Aufbewahrung von Trankfläschchen, Ihrem Wasserschlauch oder Fläschchen mit flüssigem Metall. Innerhalb des Patronengurts sollten Ihre Tränke vor Kälte geschützt sein.
items.bags.potionbandolier.name=Trank-Bandolier
items.bags.scrollholder.desc=Dieser röhrenförmige Behälter sieht aus, als würde er astronomische Instrumente und Karten enthalten, aber Ihre Schriftrollen passen genauso gut hinein. Es gibt sogar einige Seitenfächer, in denen Zauberkristalle, arkane Stifte und arkane Harze gut Platz finden. Der Behälter wirkt nicht besonders feuerfest, daher sollten Ihre Schriftrollen darin vor Feuer sicher sein.
items.bags.scrollholder.name=Schriftrollenhalter
items.bags.velvetpouch.desc=In diesem kleinen Samtbeutel lassen sich viele kleine Gegenstände aufbewahren, wie zum Beispiel Samen, Runensteine und einige Alchemiezutaten.
items.bags.velvetpouch.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.bags.velvetpouch.name=Samtbeutel
items.bombs.arcanebomb.desc=Diese Bombe ist mit arkanen Eigenschaften ausgestattet. Sie explodiert in einer gewaltigen Druckwelle, ähnlich Goos verstärktem Angriff, und verursacht magischen Schaden von _%1$d-%2$d_ an allen Zielen innerhalb von 2 Feldern.
items.bombs.arcanebomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.arcanebomb.name=Arkane Bombe
items.bombs.bomb$doublebomb.desc=Ein Stapel von zwei gewaltigen Schwarzpulverbomben, sieht so aus, als ob man eine gratis dazu bekommt!
items.bombs.bomb$doublebomb.name=zwei Bomben
items.bombs.bomb.ac_lightthrow=LICHT & WERFEN
items.bombs.bomb.desc=Eine ziemlich gewaltige Schwarzpulverbombe. Die Explosion dieser Bombe verursacht _%1$d-%2$d Schaden_ an allem, was sich in ihrer Nähe befindet, und zerstört angrenzendes Gelände oder Gegenstände.
items.bombs.bomb.desc_burning=Die Lunte der Bombe brennt durch, halte Abstand oder lösche sie!
items.bombs.bomb.desc_fuse=Es sieht so aus, als ob die Zündschnur ein paar Zündungen benötigt, um abzubrennen, sobald sie angezündet ist.
items.bombs.bomb.name=Bombe
items.bombs.bomb.ondeath=Die Explosion tötet dich...
items.bombs.bomb.rankings_desc=Getötet durch eine Explosion
items.bombs.bomb.snuff_fuse=Du löschst schnell die Lunte der Bombe.
items.bombs.firebomb.desc=Diese Bombe wurde so modifiziert, dass sie in einem größeren Bereich explodiert, _%1$d-%2$d Schaden_ verursacht und sich innerhalb von 2 Feldern eine anhaltende Flamme ausbreitet.
items.bombs.firebomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.firebomb.name=Brandbombe
items.bombs.flashbangbomb.desc=Diese Spezialbombe detoniert in einem Feuerwerk aus Licht, Schall und Elektrizität. Alles im Umkreis von 2 Feldern erleidet durch die Explosion _%1$d-%2$d Schaden_, zusätzlich 25%% Schaden durch die Elektrizität und ist 10 Runden lang betäubt.
items.bombs.flashbangbomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.flashbangbomb.name=Blendgranate
items.bombs.frostbomb.desc=Diese Bombe wurde so modifiziert, dass sie in einem größeren Bereich explodiert, _%1$d-%2$d Schaden_ verursacht und einen anhaltenden Hauch eisiger Luft innerhalb von 2 Feldern verbreitet.
items.bombs.frostbomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.frostbomb.name=Frostbombe
items.bombs.holybomb.desc=Diese Bombe wurde so modifiziert, dass sie beim Explodieren ein größeres Gebiet mit heiligem Licht erhellt. Alles innerhalb von 2 Feldern erleidet durch die Explosion _%1$d-%2$d Schaden_, und untote oder dämonische Gegner erleiden zusätzlich 50%% Schaden durch das heilige Licht.
items.bombs.holybomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.holybomb.name=Heilige Bombe
items.bombs.noisemaker.desc=Diese Spezialbombe macht wiederholt Geräusche, sobald ihre Zündschnur abgebrannt ist. Sobald etwas die Bombe berührt, explodiert sie und verursacht _%1$d-%2$d Schaden_ an allen Zielen im Umkreis von 2 Feldern!
items.bombs.noisemaker.desc_burning=Der Lärmmacher tickt vor sich hin, er wird explodieren, sobald sich etwas nähert!
items.bombs.noisemaker.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.noisemaker.name=Lärmmacher
items.bombs.regrowthbomb.desc=Diese Spezialbombe versprüht statt zu explodieren lebensspendende Flüssigkeit in einem Umkreis von 3 Feldern. Im Explosionsgebiet sprießen schnell Gras und Pflanzen. Du und alle Verbündeten im Explosionsgebiet werden geheilt, als hätten sie einen Heiltrank getrunken.
items.bombs.regrowthbomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.regrowthbomb.name=Nachwuchsbombe
items.bombs.shrapnelbomb.desc=Diese Bombe wurde mit Metallresten der DM-300 modifiziert. Beim Explodieren zersplittern die Teile und verstreuen sich in alle Richtungen. Dabei verursachen sie in einem großen Umkreis um die Bombe herum Schaden in Höhe von _%1$d-%2$d_. Versteck dich besser hinter etwas, wenn du sie benutzt...
items.bombs.shrapnelbomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.shrapnelbomb.name=Splitterbombe
items.bombs.smokebomb.desc=Diese Bombe wurde so modifiziert, dass sie beim Explodieren gleichzeitig eine dichte Gaswolke ausstößt. Sie verursacht _%1$d-%2$d Schaden_ und verbreitet einen dichten Nebel innerhalb von 2 Feldern.
items.bombs.smokebomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.smokebomb.name=Rauchbombe
items.bombs.woollybomb.desc=Diese Spezialbombe erzeugt nach der Explosion ein weites Feld magischer Schafe. Die Explosion verursacht _%1$d-%2$d Schaden_ an allen Zielen innerhalb von 2 Feldern. Die Schafe blockieren die Bewegung und bleiben sehr lange bestehen! In der Nähe starker Gegner halten die Schafe jedoch nicht so lange und können durch Interaktion mit ihnen schneller verschwinden.
items.bombs.woollybomb.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.bombs.woollybomb.name=Wollbombe
items.brokenseal$warriorshield.desc_active=Das gebrochene Siegel des Kriegers hilft ihm derzeit, durchzuhalten und gewährt ihm zusätzlich zu seiner Gesundheit einen Schild. Nach der ersten Aktivierung des Schildes gibt es eine Abklingzeit, bevor er erneut eingesetzt werden kann. Dieser Schild verfällt nicht mit der Zeit, endet aber, wenn sich einige Runden lang keine Gegner in der Nähe befinden. Nach Ablauf des Schildes reduziert jeder ungenutzte Schild die Abklingzeit bis maximal 50. Verbleibender Schild: Aktuelle Abklingzeit:
items.brokenseal$warriorshield.desc_cooldown=Der Krieger hat durch sein gebrochenes Siegel kürzlich einen Schutz erlangt und muss warten, bis er wieder von dessen Schutzwirkung profitieren kann.\n\nVerbleibende Züge: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Die Abklingzeit des Kriegerschildes ist aktuell negativ. Das bedeutet, dass sie nach Aktivierung des Schildes kürzer als die üblichen 150 Runden ist. Die Abklingzeit kann auf bis zu -150 Runden reduziert werden, wodurch der Schild nach Aktivierung sofort wieder verfügbar ist. Aktuelle Abklingzeit:
items.brokenseal$warriorshield.name=Kriegerschild
items.brokenseal.ac_affix=AFFIX
items.brokenseal.affix=Du befestigst das Siegel an deiner Rüstung!
items.brokenseal.choose_desc=Sowohl diese Rüstung als auch das zerbrochene Siegel tragen eine Glyphe. Wähle die Glyphe, die behalten werden soll. \n\n Rüstungsglyphe: %1$s\n Siegelglyphe: %2$s\n\n Beachte: Wenn du die Glyphe auswählst, die sich aktuell auf der Rüstung befindet, kann das Siegel sie später nicht übertragen.
items.brokenseal.choose_title=Wähle eine Glyphe
items.brokenseal.cursed_armor=Das Siegel gilt nicht für verfluchte Rüstungen.
items.brokenseal.desc=Ein Wachssiegel, das als Symbol der Tapferkeit an einer Rüstung angebracht ist. Es trägt eine verblasste Schutzrune in der Mitte und ist in der Mitte gespalten. Als Andenken an seine Heimat hilft das Siegel dem Krieger, durchzuhalten. Solange er das Siegel trägt, erhält er sofort einen Schild, wenn seine Gesundheit auf die Hälfte oder weniger sinkt. Das Siegel kann an Rüstungen angebracht und zwischen verschiedenen Rüstungen gewechselt werden. Es kann eine einzelne Verbesserung mit sich führen, sofern diese Verbesserung auf die Rüstung angewendet wurde, während das Siegel daran befestigt war.
items.brokenseal.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.brokenseal.inscribed=Das Siegel trägt die Inschrift _%s._
items.brokenseal.name=beschädigtes Siegel
items.brokenseal.prompt=Wähle eine Rüstung
items.brokenseal.unknown_armor=Zuerst muss festgestellt werden, ob die Rüstung verflucht ist oder nicht.
items.dewdrop.already_full=Sie sind bereits bei voller Gesundheit.
items.dewdrop.desc=Ein kristallklarer Tautropfen. Aufgrund der Magie dieses Ortes besitzt reines Wasser leichte heilende Eigenschaften.
items.dewdrop.name=Tautropfen
items.dewvial.ac_drink=TRINKEN
items.dewvial.auto_drink=Das Taufläschchen wurde geleert, um deine Wunden zu heilen.
items.dewvial.collected=Du hast einen Tautropfen in deinem Taufläschchen gesammelt.
items.dewvial.desc=In diesem kleinen Fläschchen kannst du überschüssigen Tau aufbewahren, um ihn später zu trinken. Ist es voll, wird der Tau bei tödlicher Gefahr automatisch getrunken.
items.dewvial.empty=Dein Taufläschchen ist leer!
items.dewvial.full=Dein Taufläschchen ist voll!
items.dewvial.name=Taufläschchen
items.energycrystal.desc=Eine Sammlung kleiner magischer Kristalle, gefüllt mit alchemistischer Energie.\n\nDiese Kristalle sind die häufigste Zutat in Alchemierezepten und können an einem Alchemiekessel durch das Zerlegen von Verbrauchsmaterialien hergestellt werden.
items.energycrystal.name=Energiekristall
items.equipableitem.ac_equip=AUSRÜSTUNG
items.equipableitem.ac_unequip=AUSRÜSTUNG
items.equipableitem.curse_detected=Du spürst, dass der Gegenstand verflucht ist, kurz bevor du ihn anlegst!
items.equipableitem.unequip_cursed=Man kann einen verfluchten Gegenstand nicht entfernen!
items.food.berry.desc=Diese kleine Beere wurde von der Jägerin in der Vegetation des Verlieses gefunden. Sie lässt sich schnell verzehren, stillt ein wenig den Hunger und könnte einen brauchbaren Samen enthalten!
items.food.berry.discover_hint=Du kannst diesen Gegenstand mithilfe eines bestimmten Heldentalents finden.
items.food.berry.eat_msg=Die Beere war lecker!
items.food.berry.name=Dungeonbeeren
items.food.blandfruit$chunks.desc=Die Blandfruit ist beim Aufprall explodiert und hat inerte Stücke zurückgelassen. Trotz etwas Schmutz scheinen diese großen Stücke gekochter Blandfruit durchaus essbar zu sein.
items.food.blandfruit$chunks.name=fade Fruchtstücke
items.food.blandfruit.blindfruit=Blindfrucht
items.food.blandfruit.cooked=gekochtes, geschmackloses Obst
items.food.blandfruit.desc=So trocken und substanzlos, vielleicht würde es besser schmecken, wenn man es mit einer anderen Zutat köcheln ließe.
items.food.blandfruit.desc_cooked=Die Frucht ist durch das Einweichen im Topf aufgequollen und hat sogar die Eigenschaften des Samens aufgenommen, mit dem sie gekocht wurde. Sie wird die Wirkung des jeweiligen Tranks haben, dem der Samen entsprach.
items.food.blandfruit.desc_eat=Es sieht aus, als ob man es direkt essen könnte!
items.food.blandfruit.desc_throw=Es scheint ziemlich instabil zu sein, vielleicht ist es am besten, es wegzuwerfen.
items.food.blandfruit.dreamfruit=Magefruit
items.food.blandfruit.earthfruit=Erdfrucht
items.food.blandfruit.fadefruit=Fadefruit
items.food.blandfruit.firefruit=Feuerfrucht
items.food.blandfruit.icefruit=Eisfrucht
items.food.blandfruit.name=fade Früchte
items.food.blandfruit.raw=Man kann es nicht ertragen, es roh zu essen.
items.food.blandfruit.rotfruit=faule Früchte
items.food.blandfruit.sorrowfruit=Trauerfrucht
items.food.blandfruit.starfruit=Sternfrucht
items.food.blandfruit.stormfruit=Sturmfrucht
items.food.blandfruit.sunfruit=Sonnenblumen
items.food.blandfruit.swiftfruit=Swiftfruit
items.food.chargrilledmeat.desc=Das sieht nach einem ordentlichen Steak aus.
items.food.chargrilledmeat.discover_hint=Das lässt sich auch mit einem anderen Lebensmittel zubereiten.
items.food.chargrilledmeat.name=gegrilltes Fleisch
items.food.food.ac_eat=ESSEN
items.food.food.desc=Hier gibt es nichts Besonderes: Trockenfleisch, ein paar Kekse – so etwas in der Art.
items.food.food.eat_msg=Das Essen hat köstlich geschmeckt!
items.food.food.name=Lebensmittelration
items.food.frozencarpaccio.better=Du fühlst dich besser!
items.food.frozencarpaccio.desc=Es handelt sich um ein Stück gefrorenes rohes Fleisch. Man kann es nur essen, indem man es in dünne Scheiben schneidet. Und so schmeckt es überraschend gut.
items.food.frozencarpaccio.discover_hint=Das lässt sich auch mit einem anderen Lebensmittel zubereiten.
items.food.frozencarpaccio.hard=Du spürst, wie deine Haut härter wird!
items.food.frozencarpaccio.invis=Du siehst, wie deine Hände unsichtbar werden!
items.food.frozencarpaccio.name=gefrorenes Carpaccio
items.food.frozencarpaccio.refresh=Erfrischend!
items.food.meatpie.desc=Eine köstliche Pastete gefüllt mit herzhaftem Fleisch. Davon werden Sie viel mehr satt als von jeder anderen Mahlzeit.
items.food.meatpie.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.food.meatpie.eat_msg=Das Essen war unglaublich!
items.food.meatpie.name=Fleischpastete
items.food.mysterymeat$placeholder.name=Fleisch
items.food.mysterymeat.desc=Verzehr auf eigene Gefahr!
items.food.mysterymeat.discover_hint=Diesen Gegenstand kann man als Beute von bestimmten Gegnern erhalten.
items.food.mysterymeat.eat_msg=Das Essen schmeckte... seltsam.
items.food.mysterymeat.hot=Oh, ist das heiß!
items.food.mysterymeat.legs=Du spürst deine Beine nicht mehr!
items.food.mysterymeat.name=mysteriöses Fleisch
items.food.mysterymeat.not_well=Du fühlst dich nicht wohl.
items.food.mysterymeat.stuffed=Du bist pappsatt.
items.food.pasty$fishleftover.desc=Etwas übriggebliebener Fisch von Ihrer vorherigen Mahlzeit. Sie können ihn essen, wann immer Sie möchten, um Ihren Hunger etwas zu stillen.
items.food.pasty$fishleftover.eat_msg=Das Essen hat ganz gut geschmeckt.
items.food.pasty$fishleftover.name=Fischreste
items.food.pasty.amulet_desc=Du hast es endlich gefunden, das magische Amulett – Moment mal, das ist nur eine in Folie gewickelte Schokolade, die wie das Amulett aussieht! Es verleiht dir keine grenzenlose Macht, aber es sättigt dich wenigstens und gibt dir einen kleinen Artefakt-Schub. April, April!
items.food.pasty.amulet_name=Amulett von Yendor?
items.food.pasty.cane_desc=Ein riesiger, zuckersüßer Zuckerstock. Er ist so groß, dass er dich satt macht, und der Zucker könnte deinen Zauberstäben auch noch einen kleinen Extra-Schub verleihen. Frohe Feiertage!
items.food.pasty.cane_name=Zuckerstange
items.food.pasty.desc=Eine authentische Cornish Pasty mit traditioneller Füllung aus Rindfleisch und Kartoffeln. Köstlich!
items.food.pasty.egg_desc=Ein riesiges Schokoladenei, eingewickelt in bunte gelbe Folie. Da ist so viel Schokolade drin, dass man garantiert satt wird, und der Zucker verleiht deinen Kunstwerken vielleicht sogar noch einen kleinen Extra-Kick. Frohe Ostern!
items.food.pasty.egg_name=Osterei
items.food.pasty.fish_desc=Ein ganzer, gedämpfter Fisch, wie von Zauberhand auf einem Bett aus grünem Gemüse konserviert. Es ist Tradition, um diese Jahreszeit etwas Fisch für später aufzubewahren, damit man Reste hat, anstatt alles auf einmal zu essen. Frohes Mondneujahr!
items.food.pasty.fish_name=gedämpfter Fisch
items.food.pasty.name=Pastete
items.food.pasty.pie_desc=Ein großes Stück Kürbiskuchen. Sein süß-würziger Geschmack sättigt und schenkt dir ein wenig Wohlbefinden. Frohes Halloween!
items.food.pasty.pie_name=Kürbiskuchen
items.food.pasty.rainbow_desc=Dieser farbenfrohe Trank ist eine Art flüssige Nahrung. Er stillt nicht nur deinen Hunger, sondern enthält auch einen kleinen Zauber, der einen benachbarten Gegner (keinen Boss) beruhigt und ihn vorübergehend zögern lässt, gegen dich zu kämpfen.
items.food.pasty.rainbow_name=Regenbogen-Trank
items.food.pasty.sparkling_desc=Dieser prickelnde Trank ist eine Art flüssige Nahrung. Er stillt den Hunger und ähnelt Sekt, ist aber tatsächlich alkoholfrei. Das warme Gefühl im Bauch bietet einen gewissen Schutz. Frohes Neues Jahr!
items.food.pasty.sparkling_name=Funkelnder Zaubertrank
items.food.pasty.vanilla_desc=Dieses große Stück Vanillekuchen ist mit bunten Streuseln und blauem Zuckerguss verziert. Der Kuchen wurde gebacken, um jahrelange Erfahrung zu feiern, und schenkt dir beim Verzehr einen kleinen Teil dieser Erfahrung. \n\n Das Original-Pixel-Dungeon erschien erstmals am 4. Dezember 2012. Herzlichen Glückwunsch zum Geburtstag, Pixel Dungeon!
items.food.pasty.vanilla_name=blauer Kuchen
items.food.phantommeat.desc=Ein großes, glänzendes, durchscheinendes Steak, geschnitten von einem Phantompiranha. Dieses magische Fleisch muss nicht gekocht werden und gewährt neben seiner Sättigung auch eine Reihe von Verteidigungsboni. Beim Verzehr verleiht es Unsichtbarkeit, Baumrinde, etwas Heilung und heilt viele schädliche Effekte.
items.food.phantommeat.discover_hint=Diesen Gegenstand kann man als Beute von bestimmten Gegnern erhalten.
items.food.phantommeat.name=Phantomfleisch
items.food.smallration.desc=Es sieht genauso aus wie eine normale Essensration, nur kleiner.
items.food.smallration.discover_hint=Diesen Artikel können Sie in einem Geschäft kaufen.
items.food.smallration.eat_msg=Das Essen hat ganz gut geschmeckt.
items.food.smallration.name=kleine Lebensmittelration
items.food.stewedmeat.desc=Durch das Schmoren wurde das Fleisch von allen Krankheitserregern und Parasiten befreit. Es sollte unbedenklich verzehrt werden können.
items.food.stewedmeat.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.food.stewedmeat.eat_msg=Das Essen hat ganz gut geschmeckt.
items.food.stewedmeat.name=Schmorbraten
items.food.supplyration.desc=Diese Ration wurde von und für Mitglieder der Diebesgilde im Verlies zurückgelassen. Sie ist speziell für den Verzehr unterwegs konzipiert und soll bei allgemeinen Schurkereien helfen. Obwohl sie nicht so sättigt wie eine normale Ration, kann sie schnell verzehrt werden, bietet eine leichte direkte Heilung und stellt eine Ladung des Schattenumhangs des Schurken wieder her.
items.food.supplyration.discover_hint=Du kannst diesen Gegenstand mithilfe eines bestimmten Heldentalents finden.
items.food.supplyration.name=Versorgungsration
items.gold.desc=Ein Haufen Goldmünzen. Sammle Goldmünzen, um sie später in einem Laden auszugeben.
items.gold.name=Gold
items.heap.artifact=ein Artefakt
items.heap.chest=Brust
items.heap.chest_desc=Man weiß erst, was drin ist, wenn man es öffnet!
items.heap.crystal_chest=Kristalltruhe
items.heap.crystal_chest_desc=Im Inneren ist _%s_ zu sehen, aber um die Truhe zu öffnen, benötigt man einen Kristallschlüssel.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Verschlossene Truhe
items.heap.locked_chest_desc=Du wirst nicht wissen, was drin ist, bis du es öffnest! Aber um es zu öffnen, brauchst du einen goldenen Schlüssel.
items.heap.remains=Überreste des Helden
items.heap.remains_desc=Das ist alles, was von einem deiner Vorgänger übrig geblieben ist. Vielleicht lohnt es sich, nach Wertgegenständen zu suchen.
items.heap.ring=ein Ring
items.heap.skeleton=Skelettreste
items.heap.skeleton_desc=Das ist alles, was von einem unglückseligen Abenteurer übrig geblieben ist. Vielleicht lohnt es sich, nach Wertgegenständen zu suchen.
items.heap.tomb=Grab
items.heap.tomb_desc=Dieses uralte Grab mag etwas Nützliches enthalten, aber sein Besitzer wird sich mit Sicherheit gegen eine Untersuchung wehren.
items.heap.wand=ein Zauberstab
items.honeypot$shatteredpot.desc=Der Topf ist zerbrochen, nur der klebrige Honig, der seine Wände auskleidet, hält ihn noch zusammen, und er zerfällt langsam. Trotz seines zerbrochenen Zustands scheint die Biene den Topf immer noch beschützen zu wollen.
items.honeypot$shatteredpot.name=zerbrochener Honigtopf
items.honeypot.ac_shatter=ZERSCHMETTERN
items.honeypot.desc=Dieser große Honigtopf ist zwar mit Honig gefüllt, beherbergt aber in Wirklichkeit eine riesige Biene! Solche großen Bienen bleiben normalerweise in ihren Stöcken; vielleicht ist der Topf eine Art spezieller Bienenfänger? Die Biene scheint sich in ihrem Honigtopf pudelwohl zu fühlen und summt einen misstrauisch an, wenn man sie ansieht.
items.honeypot.name=Honigtopf
items.item.ac_drop=FALLEN
items.item.ac_throw=WERFEN
items.item.curse=Fluch
items.item.custom_note=Dieser Artikel hat eine benutzerdefinierte Notiz: "_%s_"
items.item.custom_note_type=Dieser Artikeltyp hat eine benutzerdefinierte Notiz: "_%s_"
items.item.discover_hint=Diesen Gegenstand findet man zufällig im Dungeon.
items.item.prompt=Wähle die Wurfrichtung.
items.item.rankings_desc=Getötet von: %s
items.journal.alchemypage.desc=Eine zerrissene Seite aus einem Alchemie-Handbuch. Der größte Teil des Textes ist aus der Ferne zu klein, aber man kann den Titel der Seite erkennen:
items.journal.alchemypage.name=zerrissene Seite aus einem Alchemiebuch
items.journal.documentpage.desc=Eine einzelne Seite, wahrscheinlich aus einem Buch gerissen. Man muss sie aufheben, um sie zu lesen.
items.journal.documentpage.name=zerrissene Seite
items.journal.guidebook.desc=Ein Abenteuerhandbuch, hier zurückgelassen von jemandem, der beschloss, dass Abenteuer doch nichts für ihn sind! Dieses besondere Buch ist magisch und kann Abenteurer dazu anregen, im richtigen Moment eine Seite zu lesen. Trotz dieser Funktion ist das Buch vor allem wegen der großen, freundlichen Worte „Keine Panik!“ auf dem Cover so beliebt.
items.journal.guidebook.hint_desktop=Ihr Reiseführer enthält Tipps für Sie! Wählen Sie die blinkende Schaltfläche „Journal“ (%s) oben rechts, um ihn zu lesen.
items.journal.guidebook.hint_mobile=Ihr Reiseführer enthält Tipps für Sie! Tippen Sie auf die blinkende Tagebuch-Schaltfläche oben rechts, um sie zu lesen.
items.journal.guidebook.hint_status=Reiseführer
items.journal.guidebook.name=Wälzer der Dungeons
items.journal.guidepage.desc=Eine zerrissene Seite aus einem Abenteuerführer. Der größte Teil des Textes ist aus der Ferne zu klein, aber man kann den Titel der Seite erkennen:
items.journal.guidepage.name=zerrissene Reiseführerseite
items.journal.regionlorepage$caves.desc=Es scheint sich um einen Eintrag im Logbuch eines Entdeckers zu handeln, der trotz seines hohen Alters erstaunlich gut erhalten ist. Nehmen Sie es zur Hand und lesen Sie es.
items.journal.regionlorepage$caves.name=alter Logbucheintrag
items.journal.regionlorepage$city.desc=Eine kleine, verrostete Metalltafel mit einer auf magische Weise eingravierten Botschaft. Die Buchstaben sind trotz des Alters der Tafel noch deutlich lesbar, aber man muss sie in die Hand nehmen, um sie zu lesen.
items.journal.regionlorepage$city.name=verrostete Tablette
items.journal.regionlorepage$halls.desc=Eine kleine schwarze Tafel mit eingravierten, leuchtend grünen Buchstaben. Aus der Ferne verschwimmen die leuchtenden Buchstaben zu einem Nebel; man muss die Tafel in die Hand nehmen, um sie lesen zu können.
items.journal.regionlorepage$halls.name=leuchtende Tafel
items.journal.regionlorepage$prison.desc=Ein Tagebucheintrag oder eine andere Aufzeichnung auf einem alten Stück Papier. Es scheint besser erhalten zu sein als die Briefe, die du in der Kanalisation gefunden hast, aber du musst es trotzdem aufheben, um es zu lesen.
items.journal.regionlorepage$prison.name=abgenutzter Tagebucheintrag
items.journal.regionlorepage$sewers.desc=Es sieht aus wie ein Brief, geschrieben auf einem schmutzbefleckten Stück Papier. Man muss es aufheben, um lesen zu können, was darauf steht.
items.journal.regionlorepage$sewers.name=abgenutzter Buchstabe
items.keys.crystalkey.desc=Die Schnittflächen dieses kristallinen Schlüssels schimmern in der Dunkelheit. Vielleicht öffnet er etwas aus Kristall?
items.keys.crystalkey.name=Kristallschlüssel
items.keys.goldenkey.desc=Die Kerben an diesem goldenen Schlüssel sind winzig und filigran. Vielleicht kann er eine verschlossene Truhe öffnen?
items.keys.goldenkey.name=goldener Schlüssel
items.keys.ironkey.desc=Die Kerben dieses alten Eisenschlüssels sind stark abgenutzt; sein Lederband ist vom Alter gezeichnet. Welche Tür mag er wohl öffnen?
items.keys.ironkey.name=Eisenschlüssel
items.keys.skeletonkey.name=Dietrich
items.keys.wornkey.desc=Dieser Schlüssel ist abgenutzt und verfärbt, sieht aber ernst aus. Wahrscheinlich kann er eine wichtige Tür in der Nähe öffnen.
items.keys.wornkey.name=abgenutzter Schlüssel
items.kindofmisc.unequip_message=Sie müssen zuerst einen dieser Gegenstände ablegen. Wählen Sie einen Gegenstand zum Austauschen aus.
items.kindofmisc.unequip_title=Einen Gegenstand ablegen
items.kindofweapon.empty=leer
items.kindofweapon.equip_cursed=Ihr Griff um die Waffe verstärkt sich unwillkürlich.
items.kindofweapon.swift_equip=Du rüstest dich schnell mit deiner Waffe aus.
items.kindofweapon.which_equip_msg=In welchem Waffenslot möchtest du diesen Gegenstand ausrüsten? ZXQPH0 ZXQ ZXQPH1 ZXQ Der Champion greift direkt mit seiner Primärwaffe an, kann aber die Fähigkeit beider Waffen nutzen. Beide Waffen haben die gleiche Anzahl an Ladungen. ZXQPH2 ZXQ ZXQPH3 ZXQ Der Champion kann außerdem seine Primär- und Sekundärwaffe sofort wechseln.
items.kindofweapon.which_equip_primary=Primär (%s)
items.kindofweapon.which_equip_secondary=Sekundär (%s)
items.kingscrown.ac_wear=TRAGEN
items.kingscrown.desc=Die Krone des letzten Zwergenkönigs erstrahlt in gewaltiger magischer Energie. Wenn du sie trägst, fließt ihre Magie in deine Rüstung und verwandelt sie in eine einzigartige, epische Rüstung mit besonderen Fähigkeiten. Die neue Rüstung behält alle Eigenschaften der ursprünglichen Rüstung.
items.kingscrown.discover_hint=Diesen Gegenstand kann man als Beute von bestimmten Gegnern erhalten.
items.kingscrown.naked=Leider kann die Krone Ihre Unterwäsche nicht verwandeln.
items.kingscrown.name=Krone des Zwergenkönigs
items.kingscrown.ratgraded=Die Pfoten des Rattenkönigs leuchten hell auf, während sich deine Rüstung verwandelt!
items.kingscrown.upgraded=Die Krone leuchtet hell auf und zerfällt dann, während sich deine Rüstung verwandelt!
items.liquidmetal.ac_apply=ANWENDEN
items.liquidmetal.already_fixed=Diese Wurfwaffe ist bereits in perfektem Zustand!
items.liquidmetal.apply=Du verwendest flüssiges Metall vom Typ %d, um deine Wurfwaffe zu reparieren.
items.liquidmetal.desc=Diese magische Flüssigkeit füllt Risse und Löcher in Wurfwaffen und stellt ihren perfekten Zustand wieder her! Fehlt in einem Waffenset eine Waffe, ist es ansonsten aber vollständig repariert, kann Flüssigmetall sogar verwendet werden, um die fehlende Waffe zu ersetzen! Eine Waffe der Stufe 1 benötigt 10 Einheiten Flüssigmetall für die vollständige Reparatur, eine Waffe der Stufe 5 benötigt 30 Einheiten. Jede Verbesserung erhöht die benötigte Menge an Flüssigmetall um 35 %. Flüssigmetall kann nicht zur Reparatur der Spitzen von Wurfpfeilen verwendet werden.
items.liquidmetal.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.liquidmetal.name=Flüssigmetall
items.liquidmetal.prompt=Wähle eine Wurfwaffe
items.lostbackpack.desc=Dies ist dein verlorenes Inventar. Sammle es ein, um alle verlorenen Gegenstände zurückzuerhalten!
items.lostbackpack.name=verlorener Rucksack
items.merchantsbeacon.ac_use=VERWENDEN
items.merchantsbeacon.desc=Dieses seltsame Stück Zwergentechnologie ermöglicht die Kommunikation über große Entfernungen. Nach der Aktivierung können Sie mit diesem Leuchtfeuer von überall im Dungeon Gegenstände an Pixel Mart verkaufen. Die Magie des Leuchtfeuers hält jedoch nur für eine Sitzung an, also setzen Sie es mit Bedacht ein.
items.merchantsbeacon.name=Leuchtfeuer des Händlers
items.potions.brews.aquabrew.desc=Wenn dieses Gebräu zerbricht, setzt es an seinem Ort einen Schwall unter Druck stehenden Wassers frei. Dieser ist zwar stark genug, um Feuergegnern Schaden zuzufügen, verteilt aber auch Wasser auf nahegelegenes Gelände, deaktiviert Fallen, löscht Feuer und stößt Charaktere in der Nähe des Explosionsherdes zurück.
items.potions.brews.aquabrew.name=Wasserbrühe
items.potions.brews.blizzardbrew.desc=Wenn diese Brühe zerbricht, entfesselt sie einen wirbelnden Schneesturm, der sich rasend schnell wie ein Gas ausbreitet.
items.potions.brews.blizzardbrew.name=Blizzard-Gebräu
items.potions.brews.brew.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.potions.brews.causticbrew.desc=Dieses Gebräu verbreitet ätzenden Schleim in einem weiten Bereich um den Ort, an dem es zerbricht. Alles, was mit dem Schleim in Berührung kommt, schmilzt langsam, wenn es nicht mit Wasser abgewaschen werden kann.
items.potions.brews.causticbrew.name=ätzendes Gebräu
items.potions.brews.infernalbrew.desc=Wenn dieses Gebräu zerbricht, entfesselt es ein wütendes Inferno, das sich rasend schnell wie ein Gas ausbreitet.
items.potions.brews.infernalbrew.name=höllisches Gebräu
items.potions.brews.shockingbrew.desc=Wenn dieses Gebräu zerbricht, entfesselt es einen elektrischen Sturm in einem weiten Umkreis um den Ort des Zerbrechens.
items.potions.brews.shockingbrew.name=schockierendes Gebräu
items.potions.brews.unstablebrew.desc=Dieses magische Gebräu leuchtet in den wechselnden Farben des Regenbogens. Wird es getrunken oder geworfen, löst es die Wirkung eines zufälligen Tranks aus. Die Wirkung des Tranks ist beim Trinken stets vorteilhaft und beim Werfen stets schädlich.
items.potions.brews.unstablebrew.name=instabiles Gebräu
items.potions.elixirs.elixir.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Du hast vorübergehend regenerative Eigenschaften erlangt, ähnlich denen von Goo. Solange du im Wasser stehst, regenerierst du pro Runde etwas Gesundheit. Der Effekt endet, sobald du volle Gesundheit hast oder dich nicht mehr im Wasser befindest. Verbleibende Heilung:
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=Wasserheilung
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Dieses Elixier enthält die Überreste von Schleim, angereichert mit einem Heiltrank. Es heilt zwar nicht sofort, stellt aber stetig einen größeren Teil deiner Gesundheit wieder her, solange du im Wasser stehst.
items.potions.elixirs.elixirofaquaticrejuvenation.name=Elixier der aquatischen Verjüngung
items.potions.elixirs.elixirofarcanearmor.desc=Dieses Elixier verleiht dem Trinker eine lang anhaltende Resistenz gegen magischen Schaden.
items.potions.elixirs.elixirofarcanearmor.name=Elixier der arkanen Rüstung
items.potions.elixirs.elixirofdragonsblood.desc=Beim Genuss dieses Elixiers durchströmt den Trinker feurige Kraft. Dadurch wird er immun gegen Feuer und kann Feinde mit physischen Angriffen in Brand setzen.
items.potions.elixirs.elixirofdragonsblood.name=Elixier des Drachenbluts
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Du stehst unter dem Einfluss eines Federfall-Elixiers, das es dir ermöglicht, in Abgründe zu fallen, ohne Schaden zu nehmen!\n\nVerbleibende Züge: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=Federfall
items.potions.elixirs.elixiroffeatherfall.desc=Dieses Elixier bietet einen schwächeren, aber besser kontrollierbaren Levitationseffekt, der es dem Trinker ermöglicht, für kurze Zeit große Höhen unbeschadet zu erreichen.
items.potions.elixirs.elixiroffeatherfall.light=Du fühlst dich federleicht!
items.potions.elixirs.elixiroffeatherfall.name=Elixier des Federfalls
items.potions.elixirs.elixirofhoneyedhealing.desc=Dieses Elixier vereint Heilung mit der Süße von Honig. Beim Trinken wirkt es wie ein Heiltrank und stillt einen kleinen Hunger. Es kann auch geworfen werden, um einen Verbündeten zu heilen. Kreaturen mit einer Vorliebe für Honig können besänftigt werden, wenn dieses Elixier bei ihnen angewendet wird.
items.potions.elixirs.elixirofhoneyedhealing.name=Heiltrank aus Honig
items.potions.elixirs.elixiroficytouch.desc=Nach dem Verzehr dieses Elixiers kann der Trinker den angegriffenen Feinden die Körperwärme entziehen. Dadurch wird er immun gegen Kälte und kann Feinde mit physischen Angriffen unterkühlen.
items.potions.elixirs.elixiroficytouch.name=Elixier der eisigen Berührung
items.potions.elixirs.elixirofmight$htboost.desc=Dein Körper fühlt sich ungewöhnlich stark und gesund an. Deine maximale Gesundheit wird für einen längeren Zeitraum erhöht. Mit jedem Levelaufstieg nimmt die Erhöhung allmählich ab. Aktuelle Erhöhung: 0. Verbleibende Level: 1.
items.potions.elixirs.elixirofmight$htboost.name=Maximaler Gesundheitsbonus
items.potions.elixirs.elixirofmight.desc=Diese kraftvolle Flüssigkeit durchströmt deine Muskeln, erhöht deine Stärke dauerhaft um einen Punkt und deine maximale Gesundheit vorübergehend um %d Punkte. Der Gesundheitsbonus skaliert mit deiner maximalen Gesundheit, lässt aber mit steigendem Level allmählich nach.
items.potions.elixirs.elixirofmight.msg=Neue Kraft durchströmt deinen Körper, du besitzt jetzt die Kraft %d!
items.potions.elixirs.elixirofmight.name=Elixier der Macht
items.potions.elixirs.elixiroftoxicessence.desc=Nach dem Verzehr dieses Elixiers wird der Trinker mit toxischer Energie erfüllt. Er verbreitet beim Bewegen fortwährend giftiges Gas und ist etwas länger als die Wirkungsdauer anhält, immun gegen giftiges Gas und Gift.
items.potions.elixirs.elixiroftoxicessence.name=Elixier toxischer Essenz
items.potions.exotic.exoticpotion.amber=exotischer Bernsteintrank
items.potions.exotic.exoticpotion.azure=exotischer azurblauer Trank
items.potions.exotic.exoticpotion.bistre=exotischer Bister-Trank
items.potions.exotic.exoticpotion.charcoal=exotischer Holzkohle-Trank
items.potions.exotic.exoticpotion.crimson=exotischer purpurroter Trank
items.potions.exotic.exoticpotion.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.potions.exotic.exoticpotion.golden=exotischer Goldtrank
items.potions.exotic.exoticpotion.indigo=exotischer Indigo-Trank
items.potions.exotic.exoticpotion.ivory=exotischer Elfenbeintrank
items.potions.exotic.exoticpotion.jade=exotischer Jade-Trank
items.potions.exotic.exoticpotion.magenta=exotischer magentafarbener Trank
items.potions.exotic.exoticpotion.no=Nein, ich habe meine Meinung geändert
items.potions.exotic.exoticpotion.silver=exotischer Silbertrank
items.potions.exotic.exoticpotion.turquoise=exotischer Türkis-Zaubertrank
items.potions.exotic.exoticpotion.unknown_desc=Diese runde Flasche enthält eine körnige, farbige Flüssigkeit. Sie scheint aus diesem Land nicht zu stammen; wer weiß, was passiert, wenn man sie trinkt oder wegwirft?
items.potions.exotic.exoticpotion.warning=Möchtest du die Verwendung dieses Tranks wirklich abbrechen? Er wird sowieso verbraucht.
items.potions.exotic.exoticpotion.yes=Ja, ich bin mir sicher.
items.potions.exotic.potionofcleansing$cleanse.desc=Dieser Charakter ist vorübergehend immun gegen alle schädlichen Statuseffekte!\n\nVerbleibende Züge: %s.
items.potions.exotic.potionofcleansing$cleanse.name=gereinigt
items.potions.exotic.potionofcleansing.desc=Dieses wirkungsvolle Reagenz macht den Trinker nach dem Trinken für einige Runden immun gegen alle schädlichen Statuseffekte. Es kann auch auf ein Ziel geworfen werden, um es zu reinigen.
items.potions.exotic.potionofcleansing.name=Reinigungstrank
items.potions.exotic.potionofcorrosivegas.desc=Wird dieses unter Druck stehende Glas geöffnet oder zerbrochen, explodiert sein Inhalt und bildet eine tödliche Wolke aus ätzendem, rostfarbenem Gas. Dieses Gas breitet sich schneller aus als giftiges Gas und ist tödlicher, hält aber auch nicht so lange an.
items.potions.exotic.potionofcorrosivegas.name=Mischung aus ätzendem Gas
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talentpunkte!
items.potions.exotic.potionofdivineinspiration.desc=Die Kraft heiliger Energie, reduziert auf flüssige Form, verleiht diesem Trank dem Trinker göttliche Macht und gewährt ihm zwei zusätzliche Talentpunkte in einer Stufe seiner Wahl. Dieser Trank kann nur einmal pro Talentstufe verwendet werden.
items.potions.exotic.potionofdivineinspiration.name=Trank göttlicher Inspiration
items.potions.exotic.potionofdivineinspiration.no_more_points=Du kannst keine weiteren Bonus-Talentpunkte mehr erhalten.
items.potions.exotic.potionofdivineinspiration.select_tier=Wähle eine Talentstufe, um zwei Bonuspunkte zu erhalten. Du musst die Stufe freigeschaltet haben, um die Punkte ausgeben zu können.
items.potions.exotic.potionofdragonsbreath.desc=Diese Flasche enthält eine ungewöhnliche Substanz, die sich kurz nach dem Kontakt mit Speichel entzündet. Durch schnelles Ausspucken der Flüssigkeit kann der Benutzer Flammen aus seinem Mund speien!
items.potions.exotic.potionofdragonsbreath.name=Drachenatem-Trank
items.potions.exotic.potionofdragonsbreath.prompt=Wähle einen Ort zum Verbrennen.
items.potions.exotic.potionofearthenarmor.desc=Anstatt zu lähmen, bewirkt diese Flüssigkeit eine Härtung der Haut, wodurch diese vorübergehend in einen natürlichen Schutzpanzer verwandelt wird.
items.potions.exotic.potionofearthenarmor.name=Trank aus irdener Rüstung
items.potions.exotic.potionofmagicalsight.desc=Nach dem Trinken dieses Getränks werden Ihre Sinne kurzzeitig auf ein unglaubliches Niveau gesteigert, sodass Sie in einem Radius von 12 Feldern durch Wände sehen können!
items.potions.exotic.potionofmagicalsight.name=Trank der magischen Sehkraft
items.potions.exotic.potionofmastery.armor_easier=Deine Rüstung wird leichter zu tragen!
items.potions.exotic.potionofmastery.desc=Anstatt rohe Stärke zu verleihen, stimmt dieser Trank die Muskeln des Anwenders auf einen bestimmten Gegenstand ab. Dadurch wird die Benutzung des Gegenstands einfacher, als hätte der Trinker damit geübt und ein Muskelgedächtnis entwickelt. Die gewählte Waffe oder Rüstung benötigt 2 Punkte weniger Stärke. Dieser Trank kann nur einmal pro Gegenstand verwendet werden.
items.potions.exotic.potionofmastery.name=Meistertrank
items.potions.exotic.potionofmastery.prompt=Meistere einen Gegenstand
items.potions.exotic.potionofmastery.weapon_easier=Deine Waffe lässt sich leichter handhaben!
items.potions.exotic.potionofshielding.desc=Anstatt zu heilen, projiziert dieser Trank stattdessen einen beständigen Schild um den Körper des Anwenders, der einen beträchtlichen Teil des Schadens abwehrt.
items.potions.exotic.potionofshielding.name=Schutztrank
items.potions.exotic.potionofshroudingfog.desc=Wenn die Flüssigkeit in dieser Flasche mit Luft in Berührung kommt, bildet sie einen dichten, rauchigen Nebel, der sich schnell ausbreitet und die Sicht Ihrer Feinde behindert.
items.potions.exotic.potionofshroudingfog.name=Trank des verhüllenden Nebels
items.potions.exotic.potionofsnapfreeze.desc=Die in diesem Trank enthaltene Chemikalie reagiert rasch mit der Luft und friert alles, was sich in ihrem Wirkungsbereich befindet, augenblicklich ein und verankert es.
items.potions.exotic.potionofsnapfreeze.name=Trank aus Schnellgefrieren
items.potions.exotic.potionofstamina.desc=Das Trinken dieser ungewöhnlich süßen Flüssigkeit verleiht Ihnen einen lang anhaltenden Energieschub, der es Ihnen ermöglicht, über einen längeren Zeitraum in einem schnelleren Tempo zu laufen.
items.potions.exotic.potionofstamina.name=Ausdauertrank
items.potions.exotic.potionofstormclouds.desc=Wirft man diesen Trank, entsteht eine sich schnell ausbreitende Wolke aus konzentriertem Dampf, der kondensiert und auf die Umgebung herabregnet. Das Gelände verwandelt sich größtenteils in Wasser, feurige Gegner erleiden Schaden, Feuer erlischt und Fallen werden überwältigt und zerbrechen.
items.potions.exotic.potionofstormclouds.name=Trank der Gewitterwolken
items.potions.potion$placeholder.name=Trank
items.potions.potion$seedtopotion.name=Zufälliger Trank
items.potions.potion.ac_drink=TRINKEN
items.potions.potion.amber=Bernsteintrank
items.potions.potion.azure=Azurtrank
items.potions.potion.beneficial=Wohltuender Trank
items.potions.potion.bistre=Bister-Trank
items.potions.potion.charcoal=Holzkohle-Trank
items.potions.potion.crimson=Purpurtrank
items.potions.potion.discover_hint=Diesen Gegenstand findet man zufällig im Dungeon oder man kann ihn durch Alchemie herstellen.
items.potions.potion.golden=goldener Trank
items.potions.potion.harmful=Schädlicher Trank!
items.potions.potion.indigo=Indigotrank
items.potions.potion.ivory=Elfenbeintrank
items.potions.potion.jade=Jadetrank
items.potions.potion.magenta=Magenta-Trank
items.potions.potion.no=Nein, ich habe meine Meinung geändert
items.potions.potion.shatter=Die Flasche zerbricht und die Flüssigkeit spritzt harmlos heraus.
items.potions.potion.silver=Silbertrank
items.potions.potion.sure_drink=Bist du sicher, dass du es trinken willst? In den meisten Fällen solltest du solche Tränke deinen Feinden ins Gesicht werfen.
items.potions.potion.sure_throw=Bist du sicher, dass du es wegschütten willst? In den meisten Fällen ist es sinnvoller, es zu trinken.
items.potions.potion.turquoise=Türkis-Zaubertrank
items.potions.potion.unknown_desc=In diesem Fläschchen wirbelt eine %s Flüssigkeit. Wer weiß, welche Wirkung sie beim Trinken oder Werfen hat?
items.potions.potion.yes=Ja, ich weiß, was ich tue.
items.potions.potionofexperience.desc=Die sagenumwobenen Erlebnisse unzähliger Schlachten, reduziert auf flüssige Form – dieser Trank wird Ihr Erfahrungsniveau sofort erhöhen.
items.potions.potionofexperience.name=Erfahrungstrank
items.potions.potionoffrost.desc=An der Luft verdampft diese Chemikalie zu einer eisigen Wolke. Jedes Wesen, das sie berührt, friert auf der Stelle ein und kann sich weder bewegen noch handeln.
items.potions.potionoffrost.name=Trank des Frostes
items.potions.potionofhaste.desc=Das Trinken dieser seltsam süßen Flüssigkeit verleiht Ihnen für kurze Zeit enorme Energie, sodass Sie mit hoher Geschwindigkeit laufen können.
items.potions.potionofhaste.energetic=Du fühlst dich energiegeladen!
items.potions.potionofhaste.name=Hasttrank
items.potions.potionofhealing.desc=Ein Elixier, das sofort deine gesamte Gesundheit wiederherstellt und Vergiftungen heilt.
items.potions.potionofhealing.heal=Deine Wunden beginnen sich zu schließen.
items.potions.potionofhealing.name=Heiltrank
items.potions.potionofinvisibility.desc=Dieser Trank macht dich vorübergehend unsichtbar für deine Feinde. Ein Angriff oder der Einsatz eines Zauberstabs oder einer Schriftrolle vor ihren Augen beendet die Wirkung.
items.potions.potionofinvisibility.invisible=Du siehst, wie deine Hände unsichtbar werden!
items.potions.potionofinvisibility.name=Unsichtbarkeitstrank
items.potions.potionoflevitation.desc=Diese seltsame Flüssigkeit lässt dich durch die Luft schweben und mühelos über Fallen gleiten. Flammen und Gase füllen jedoch auch die Luft und lassen sich so nicht umgehen.
items.potions.potionoflevitation.float=Du schwebst in die Luft!
items.potions.potionoflevitation.name=Trank der Levitation
items.potions.potionofliquidflame.desc=Dieser Kolben enthält eine instabile Verbindung, die sich bei Kontakt mit Luft heftig entzündet.
items.potions.potionofliquidflame.name=Trank aus flüssiger Flamme
items.potions.potionofmindvision.desc=Nach dem Trinken dieses Tranks wird Ihr Geist auf die psychische Signatur entfernter Wesen eingestimmt, sodass Sie deren Anwesenheit durch Wände hindurch spüren können. Außerdem ermöglicht Ihnen dieser Trank, durch nahegelegene Wände und Türen zu sehen.
items.potions.potionofmindvision.name=Trank der Geistesvision
items.potions.potionofmindvision.see_mobs=Man kann die Anwesenheit der Gedanken anderer Geschöpfe irgendwie spüren!
items.potions.potionofmindvision.see_none=Man merkt irgendwie, dass man im Moment auf dieser Ebene allein ist.
items.potions.potionofparalyticgas.desc=An der Luft verdampft die Flüssigkeit in dieser Flasche zu einem betäubenden gelben Nebel. Wer diesen Nebel einatmet, wird sofort gelähmt und kann sich nach dem Auflösen des Nebels für einige Zeit nicht bewegen. Man kann diesen Gegenstand auf entfernte Gegner werfen, um sie dem Gas auszusetzen.
items.potions.potionofparalyticgas.name=Trank aus Lähmungsgas
items.potions.potionofpurity.desc=Dieses Mittel neutralisiert rasch alle schädlichen Gase im Wirkungsbereich. Wenn du es trinkst, wirst du vorübergehend gegen diese Gase immun.
items.potions.potionofpurity.freshness=Die Luft ist ungewöhnlich frisch.
items.potions.potionofpurity.name=Reinigungstrank
items.potions.potionofpurity.protected=Ein Schutzfilm umhüllt dich!
items.potions.potionofstrength.desc=Diese kraftvolle Flüssigkeit durchdringt Ihre Muskeln und erhöht Ihre Kraft dauerhaft um einen Punkt.
items.potions.potionofstrength.msg=Neue Kraft durchströmt deinen Körper, du besitzt jetzt die Kraft %d!
items.potions.potionofstrength.name=Stärketrank
items.potions.potionoftoxicgas.desc=Wenn man dieses unter Druck stehende Glas öffnet oder zerbricht, explodiert sein Inhalt in einer tödlichen Wolke aus giftigem grünem Gas. Alternativ könntest du den Trank auch auf entfernte Feinde schleudern, anstatt ihn von Hand zu öffnen.
items.potions.potionoftoxicgas.name=Trank aus giftigem Gas
items.quest.ceremonialcandle.desc=Ein Satz Kerzen, die durch den Gebrauch eingeschmolzen und miteinander verschmolzen sind. \n\n Für sich genommen sind sie wertlos, aber in Kombination mit anderen Kerzen in einem bestimmten Muster können sie die Energie für ein Beschwörungsritual bündeln.
items.quest.ceremonialcandle.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
items.quest.ceremonialcandle.name=Zeremonienkerze
items.quest.corpsedust.chill=Ein Schauer läuft dir über den Rücken.
items.quest.corpsedust.desc=Der Leichenstaubballen unterscheidet sich äußerlich nicht von einem gewöhnlichen Staubballen. Doch man spürt eine bösartige Energie, die in ihm lauert. Es wäre ratsam, ihn so schnell wie möglich zu beseitigen.
items.quest.corpsedust.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
items.quest.corpsedust.name=Leichenstaub
items.quest.darkgold.desc=Dieses Metall wird nicht wegen seiner Farbe als dunkel bezeichnet (es unterscheidet sich nicht von normalem Gold), sondern weil es unter Tageslicht schmilzt und dadurch an der Oberfläche nutzlos wird.
items.quest.darkgold.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
items.quest.darkgold.name=dunkelgoldenes Erz
items.quest.darkgold.you_now_have=Du besitzt nun das dunkle Golderz %d.
items.quest.dwarftoken.desc=Viele Zwerge und einige ihrer größeren Geschöpfe tragen diese kleinen Metallstücke unbekannter Bedeutung bei sich. Vielleicht sind es Schmuckstücke oder eine Art Ausweis. Zwerge sind schon ein seltsames Volk.
items.quest.dwarftoken.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
items.quest.dwarftoken.name=Zwergen-Spielstein
items.quest.embers.desc=Besondere Glut, die nur von jungen Feuerwesen geerntet werden kann. Sie strahlen thermische Energie ab.
items.quest.embers.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
items.quest.embers.name=elementare Glut
items.quest.escapecrystal.ac_use=VERWENDEN
items.quest.escapecrystal.desc=Ein dünner, magischer Kristall, der Teleportationsmagie zu enthalten scheint. Du kannst den Kristall jederzeit benutzen, um das Zwergengewölbe zu verlassen, aber du kannst nichts mitnehmen!
items.quest.escapecrystal.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
items.quest.escapecrystal.name=Fluchtkristall
items.quest.gooblob.desc=Ein wabbeliger Klumpen Schleim, der sich beim Tod von Goo abgespalten hat. Er ähnelt einem großen Wackelpudding, den man aber niemals essen würde. Er ist allein nutzlos, könnte aber in Kombination mit bestimmten Tränken oder einer Bombe nützlich sein. Zumindest sollte er sich in eine ordentliche Menge Energie umwandeln lassen.
items.quest.gooblob.discover_hint=Diesen Gegenstand kann man als Beute von bestimmten Gegnern erhalten.
items.quest.gooblob.name=Schleimklumpen
items.quest.metalshard.desc=Ein Splitter verrosteten, verfluchten Metalls, der beim Zerstören von DM-300 abbrach. Man spürt eine inaktive, bösartige Magie darin. Allein bewirkt er nichts, könnte aber in Kombination mit bestimmten Schriftrollen oder einer Bombe nützlich sein. Zumindest sollte er sich in eine ansehnliche Menge Energie umwandeln lassen.
items.quest.metalshard.discover_hint=Diesen Gegenstand kann man als Beute von bestimmten Gegnern erhalten.
items.quest.metalshard.name=verfluchter Metallsplitter
items.quest.pickaxe.ability_desc=Der Duellant kann einen Gegner mit einer Spitzhacke durchbohren. Dieser Treffer ist garantiert, macht den Gegner für 3 Runden verwundbar und verursacht bei Gegnern mit starrer Haut _%1$d-%2$d Schaden_.
items.quest.pickaxe.ability_name=durchbohren
items.quest.pickaxe.desc=Dies ist ein robustes und schweres Werkzeug zum Steinebrechen. Man muss die Spitzhacke nicht zum Abbauen von Gestein ausrüsten, aber im Notfall kann sie wahrscheinlich auch als Waffe verwendet werden.
items.quest.pickaxe.discover_hint=Diesen Gegenstand findest du im Rahmen einer bestimmten Quest.
items.quest.pickaxe.name=Spitzhacke
items.quest.pickaxe.upgrade_ability_stat_name=Fähigkeitsschaden
items.quest.ratskull.desc=Ein überraschend großer Rattenschädel. Er wäre eine tolle Jagdtrophäe, wenn man eine Wand hätte, an der man ihn aufhängen könnte.
items.quest.ratskull.name=riesiger Rattenschädel
items.remains.bowfragment.desc=Dieses zerbrochene Holzstück war einst Teil des verlorenen Geisterbogens einer Jägerin. Du kannst noch etwas Naturenergie in dem Stück spüren und es nutzen, um hohes Gras um dich herum wachsen zu lassen. Dadurch wird das Stück jedoch zerstört.
items.remains.bowfragment.name=Bogenfragment
items.remains.brokenhilt.desc=Dieser zerbrochene Griff sieht aus, als stamme er von der Waffe eines besiegten Duellanten. Man spürt noch etwas Kampfkraft im Griff; damit kann man bei den nächsten beiden Nahkampfangriffen etwas Bonusschaden verursachen. Dadurch wird der Griff jedoch zerstört.
items.remains.brokenhilt.name=zerbrochener Griff
items.remains.brokenstaff.desc=Dieser Zauberstab ist nach dem Tod seines Besitzers in zwei Hälften zerbrochen. Du kannst noch etwas magische Energie im Stab spüren; du kannst sie nutzen, um deine Zauberstäbe etwas aufzuladen. Dadurch wird der Stab jedoch zerstört.
items.remains.brokenstaff.name=zerbrochener Stab
items.remains.cloakscrap.desc=Dieses Stück durchscheinenden Stoff sieht aus, als stamme es vom Schattenumhang eines verstorbenen Schurken. Man spürt noch etwas mystische Energie darin; man kann es nutzen, um die Artefakte etwas aufzuladen. Dabei wird der Stoff jedoch zerstört.
items.remains.cloakscrap.name=Stoffrest
items.remains.remainsitem.ac_use=VERWENDEN
items.remains.remainsitem.discover_hint=Diesen Gegenstand findet man in den Überresten eines bestimmten Helden aus einem zuvor verlorenen Durchlauf.
items.remains.sealshard.desc=Diese winzigen roten Wachssplitter sehen aus, als stammten sie vom Siegel eines gefallenen Kriegers. Man spürt noch etwas Willenskraft, die an dem Siegel haftet; man kann sie nutzen, um sich einen gewissen Schutz zu verschaffen. Dadurch werden die Siegelsplitter jedoch zerstört.
items.remains.sealshard.name=Siegelsplitter
items.remains.tornpage.desc=Diese Seite sieht aus, als wäre sie aus dem heiligen Buch eines abgelaufenen Klerikers gerissen worden. Noch haftet etwas göttliche Energie daran; du kannst sie nutzen, um etwas Gesundheit wiederherzustellen. Dadurch wird die Seite jedoch zerstört.
items.remains.tornpage.name=zerrissene Seite
items.rings.ring.agate=Achatring
items.rings.ring.amethyst=Amethystring
items.rings.ring.curse_known=Man spürt eine bösartige Magie, die in diesem Ring lauert.
items.rings.ring.cursed_worn=Weil dieser Ring verflucht ist, bist du machtlos, ihn abzunehmen.
items.rings.ring.diamond=Diamantring
items.rings.ring.emerald=Smaragdring
items.rings.ring.equip_cursed=Der Ring zieht sich schmerzhaft um Ihren Finger zusammen!
items.rings.ring.garnet=Granatring
items.rings.ring.identify=Sie kennen Ihren Ring nun so gut, dass Sie ihn identifizieren können.
items.rings.ring.known=Dies ist ein %s
items.rings.ring.not_cursed=Dieser Ring ist frei von böswilliger Magie.
items.rings.ring.onyx=Onyxring
items.rings.ring.opal=Opalring
items.rings.ring.quartz=Quarzring
items.rings.ring.ruby=Rubinring
items.rings.ring.sapphire=Saphirring
items.rings.ring.topaz=Topasring
items.rings.ring.tourmaline=Turmalinring
items.rings.ring.unknown_desc=Dieser Metallring ist mit einem großen %s besetzt, der im Dunkeln funkelt. Wer weiß, welche Wirkung er hat, wenn man ihn trägt?
items.rings.ringofaccuracy.combined_stats=Die von Ihnen ausgerüsteten Ringe kombinieren ihre Kräfte und erhöhen Ihre Treffsicherheit insgesamt um _%s%%_.
items.rings.ringofaccuracy.desc=Dieser Ring erhöht deine Chance, den Gegner zu treffen.
items.rings.ringofaccuracy.name=Ring der Genauigkeit
items.rings.ringofaccuracy.stats=Wenn Sie diesen Ring tragen, erhöht er Ihre Treffsicherheit um _%s%%._
items.rings.ringofaccuracy.typical_stats=Beim Tragen dieses Rings erhöht sich Ihre Treffsicherheit in der Regel um _%s%%._
items.rings.ringofaccuracy.upgrade_stat_name_1=Genauigkeitssteigerung
items.rings.ringofarcana.combined_stats=Eure ausgerüsteten Ringe kombinieren ihre Kräfte und erhöhen die Stärke von Verzauberungen und Glyphen insgesamt um _%s%%_.
items.rings.ringofarcana.desc=Dieser Ring verstärkt magische Verzauberungen auf Waffen und Glyphen auf Rüstungen, einschließlich Flüche! Er erhöht zunächst die Aktivierungschance und anschließend die Stärke des Effekts, sobald die Aktivierungschance 100 % erreicht hat. Ein verfluchter Ring hingegen schwächt Verzauberungen, Glyphen und Flüche.
items.rings.ringofarcana.name=Ring der Arkana
items.rings.ringofarcana.stats=Wenn dieser Ring getragen wird, erhöht er die Kraft von Verzauberungen und Glyphen um _%s%%._
items.rings.ringofarcana.typical_stats=Beim Tragen erhöht dieser Ring typischerweise die Stärke von Verzauberungen und Glyphen um _%s%%._
items.rings.ringofarcana.upgrade_stat_name_1=Arcana-Boost
items.rings.ringofelements.combined_stats=Eure ausgerüsteten Ringe kombinieren ihre Kraft und bieten insgesamt _%s%%_ Elementarresistenz.
items.rings.ringofelements.desc=Dieser Ring schützt vor verschiedenen Elementen wie Feuer, Elektrizität und Gasen. Außerdem verkürzt er die Dauer schädlicher Effekte.
items.rings.ringofelements.name=Ring der Elemente
items.rings.ringofelements.stats=Beim Tragen bietet dieser Ring _%s%%_ Elementarresistenz.
items.rings.ringofelements.typical_stats=Beim Tragen bietet dieser Ring typischerweise eine Elementarresistenz von _%s%%_.
items.rings.ringofelements.upgrade_stat_name_1=Widerstand
items.rings.ringofenergy.combined_stats=Die von Ihnen ausgerüsteten Ringe kombinieren ihre Kräfte und erhöhen die Ladegeschwindigkeit insgesamt um _%s%%_.
items.rings.ringofenergy.desc=Eure magische Ausrüstung lädt sich im arkanen Feld dieses Rings schneller auf. Ein verfluchter Ring hingegen verlangsamt die Aufladung.
items.rings.ringofenergy.name=Energiering
items.rings.ringofenergy.stats=Beim Tragen erhöht dieser Ring die Aufladegeschwindigkeit von Zauberstäben, Artefakten und Heldenrüstungen um _%s%%._
items.rings.ringofenergy.typical_stats=Beim Tragen erhöht dieser Ring typischerweise die Aufladegeschwindigkeit von Zauberstäben, Artefakten und Heldenrüstungen um _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Ladeverstärkung
items.rings.ringofevasion.combined_stats=Die Kraft deiner ausgerüsteten Ringe wird kombiniert, wodurch sich deine Ausweichchance insgesamt um _%s%%_ erhöht.
items.rings.ringofevasion.desc=Dieser Ring erhöht deine Chance, einem gegnerischen Angriff auszuweichen.
items.rings.ringofevasion.name=Ausweichring
items.rings.ringofevasion.stats=Wenn dieser Ring getragen wird, erhöht er Ihre Ausweichchance um _%s%%._
items.rings.ringofevasion.typical_stats=Beim Tragen erhöht dieser Ring typischerweise Ihre Ausweichchance um _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Ausweichbonus
items.rings.ringofforce$brawlersstance.desc=In dieser Haltung nutzen die regulären Angriffe der Duellantin einen ausgerüsteten Kraftring, selbst wenn sie eine Waffe ausgerüstet hat. Diese Angriffe verursachen Bonusschaden und nutzen weiterhin die Verstärkung und Verzauberung der Waffe. Das Aufrechterhalten dieser Haltung erfordert jedoch Konzentration und reduziert die Aufladegeschwindigkeit der Waffenfähigkeit um 50 %. Diese Haltung kann mithilfe eines Kraftrings aktiviert oder deaktiviert werden, die Reduzierung der Aufladegeschwindigkeit bleibt jedoch kurzzeitig bestehen, wenn die Haltung schnell aktiviert und deaktiviert wird.
items.rings.ringofforce$brawlersstance.name=Schlägerhaltung
items.rings.ringofforce.ability_desc=Die Duellantin kann mit diesem Ring die Nahkampfhaltung einnehmen, wodurch ihre normalen Angriffe immer diesen Ring verwenden, selbst wenn sie eine Waffe ausgerüstet hat. Diese Angriffe verursachen _%1$d-%2$d Schaden_ und übernehmen außerdem die Verzauberung und Verstärkung der Waffe. Diese Haltung verlangsamt die Waffenaufladegeschwindigkeit um 50%%.
items.rings.ringofforce.ability_name=Schlägerhaltung
items.rings.ringofforce.combined_stats=Eure ausgerüsteten Ringe kombinieren ihre Kraft und verursachen ohne Waffe insgesamt _%1$d-%2$d Schaden_, mit einer Waffe erhöht sich der Schaden um _%3$d_.
items.rings.ringofforce.desc=Dieser Ring verstärkt die Wucht der Nahkampfangriffe seines Trägers. Diese zusätzliche Kraft ist beim Führen von Waffen eher gering, doch unbewaffnete Angriffe werden dadurch deutlich verstärkt. Ein verfluchter Ring hingegen schwächt die Schläge des Trägers.
items.rings.ringofforce.name=Ring der Kraft
items.rings.ringofforce.stats=Unbewaffnet und bei deiner aktuellen Stärke verursacht dieser Ring _%1$d-%2$d Schaden._ Mit einer ausgerüsteten Waffe erhöht dieser Ring den Schaden um _%3$d._
items.rings.ringofforce.typical_ability_desc=Mit diesem Ring kann die Duellantin eine Nahkampfhaltung einnehmen, wodurch ihre normalen Angriffe immer diesen Ring verwenden, selbst wenn sie eine Waffe ausgerüstet hat. Diese Angriffe verursachen typischerweise _%1$d-%2$d Schaden_ und übernehmen außerdem die Verzauberung und Verstärkung der Waffe. Diese Haltung verlangsamt die Waffenaufladegeschwindigkeit um 50%%.
items.rings.ringofforce.typical_stats=Unbewaffnet und bei deiner aktuellen Stärke verursacht dieser Ring typischerweise _%1$d-%2$d Schaden._ Mit einer ausgerüsteten Waffe erhöht dieser Ring den Schaden typischerweise um _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Unbewaffneter Schaden
items.rings.ringofforce.upgrade_stat_name_2=Bewaffneter Schadensbonus
items.rings.ringofforce.upgrade_stat_name_3=Fähigkeitsschaden
items.rings.ringoffuror.combined_stats=Die von dir ausgerüsteten Ringe kombinieren ihre Kräfte und erhöhen die Geschwindigkeit deiner Angriffe insgesamt um _%s%%_.
items.rings.ringoffuror.desc=Dieser Ring verleiht seinem Träger innere Wut und ermöglicht ihm so schnellere Angriffe. Ein verfluchter Ring hingegen verlangsamt die Angriffsgeschwindigkeit des Trägers.
items.rings.ringoffuror.name=Ring des Zorns
items.rings.ringoffuror.stats=Wenn du diesen Ring trägst, erhöht er die Geschwindigkeit deiner Angriffe um _%s%%._
items.rings.ringoffuror.typical_stats=Wenn dieser Ring getragen wird, erhöht er typischerweise die Geschwindigkeit deiner Angriffe um _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Angriffsgeschwindigkeitserhöhung
items.rings.ringofhaste.combined_stats=Die von dir ausgerüsteten Ringe kombinieren ihre Kräfte und erhöhen deine Bewegungsgeschwindigkeit insgesamt um _%s%%_.
items.rings.ringofhaste.desc=Dieser Ring beschleunigt den Zeitfluss für seinen Träger, sodass er alle Handlungen etwas schneller ausführen kann.
items.rings.ringofhaste.name=Ring der Hast
items.rings.ringofhaste.stats=Wenn Sie diesen Ring tragen, erhöht er Ihre Bewegungsgeschwindigkeit um _%s%%._
items.rings.ringofhaste.typical_stats=Beim Tragen erhöht dieser Ring typischerweise Ihre Bewegungsgeschwindigkeit um _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Bewegungsgeschwindigkeitsboost
items.rings.ringofmight.combined_stats=Die von dir ausgerüsteten Ringe kombinieren ihre Kräfte und erhöhen deine Stärke um _%1$d_ und deine maximalen HP um _%2$s%%_ insgesamt.
items.rings.ringofmight.desc=Dieser Ring stärkt die körperlichen Eigenschaften seines Trägers und verleiht ihm größere Kraft und Konstitution. Ein verfluchter Ring hingegen schwächt seinen Träger.
items.rings.ringofmight.name=Ring der Macht
items.rings.ringofmight.stats=Wenn du diesen Ring trägst, erhöht er deine Stärke um _%1$d_ und deine maximalen HP um _%2$s%%_.
items.rings.ringofmight.typical_stats=Beim Tragen erhöht dieser Ring typischerweise deine Stärke um _%1$d_ und deine maximalen HP um _%2$s%%_.
items.rings.ringofmight.upgrade_stat_name_1=Kraftzuwachs
items.rings.ringofmight.upgrade_stat_name_2=Maximaler HP-Boost
items.rings.ringofsharpshooting.combined_stats=Eure ausgerüsteten Ringe kombinieren ihre Kräfte, wodurch die effektive Wurfwaffenstärke um _%1$d_ erhöht und ihre Haltbarkeit insgesamt um _%2$s%%_ gesteigert wird.
items.rings.ringofsharpshooting.desc=Dieser Ring steigert die Präzision und Zielgenauigkeit des Trägers, wodurch alle Fernkampfwaffen mehr Schaden anrichten und ihre Haltbarkeit erhöhen. Ein verfluchter Ring hat den gegenteiligen Effekt.
items.rings.ringofsharpshooting.name=Ring der Scharfschützen
items.rings.ringofsharpshooting.stats=Wenn du diesen Ring trägst, erhöht er den Schaden deiner Wurfwaffen, als ob deren Stufe um _%1$d_ erhöht worden wäre, und ihre Haltbarkeit um _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Beim Tragen dieses Rings wird der Schaden eurer Wurfwaffen in der Regel so erhöht, als ob deren Stufe um _%1$d_ erhöht worden wäre, und ihre Haltbarkeit um _%2$s%%_ erhöht.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Level-Schadensbonus
items.rings.ringofsharpshooting.upgrade_stat_name_2=Haltbarkeitsbonus
items.rings.ringoftenacity.combined_stats=Die von Ihnen ausgerüsteten Ringe kombinieren ihre Kräfte und reduzieren den erlittenen Schaden um insgesamt bis zu _%s%%_.
items.rings.ringoftenacity.desc=Dieser Ring verleiht dem Träger Schutz vor normalerweise tödlichen Angriffen. Je schwerer der Träger verletzt ist, desto widerstandsfähiger ist er. Ein verfluchter Ring hingegen erleichtert es Feinden, den Träger zu töten.
items.rings.ringoftenacity.name=Ring der Beharrlichkeit
items.rings.ringoftenacity.stats=Wenn Sie diesen Ring tragen, reduziert er den erlittenen Schaden um bis zu _%s%%._
items.rings.ringoftenacity.typical_stats=Beim Tragen reduziert dieser Ring den erlittenen Schaden typischerweise um bis zu _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Maximale Schadensresistenz
items.rings.ringofwealth.combined_stats=Die von Ihnen ausgerüsteten Ringe kombinieren ihre Kräfte und erhöhen Ihr Glück insgesamt um _%s%%_.
items.rings.ringofwealth.desc=Dieser Ring wirkt wie ein Magnet für Schätze und erhöht die Wahrscheinlichkeit, dass Gegner und Behälter wertvolle Gegenstände enthalten. Ein verfluchter Ring hingegen verringert eure Chancen auf Beute.
items.rings.ringofwealth.name=Ring des Reichtums
items.rings.ringofwealth.stats=Wenn Sie diesen Ring tragen, erhöht er Ihr Glück um _%s%%._
items.rings.ringofwealth.typical_stats=Wenn Sie diesen Ring tragen, erhöht er in der Regel Ihr Glück um _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Glücksbonus
items.scrolls.exotic.exoticscroll.berkanan=exotische Schriftrolle von Berkanan
items.scrolls.exotic.exoticscroll.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.scrolls.exotic.exoticscroll.gyfu=exotische Schriftrolle von GYFU
items.scrolls.exotic.exoticscroll.isaz=exotische Schriftrolle von ISAZ
items.scrolls.exotic.exoticscroll.kaunan=exotische Schriftrolle von Kaunan
items.scrolls.exotic.exoticscroll.laguz=exotische Schriftrolle von LAGUZ
items.scrolls.exotic.exoticscroll.mannaz=exotische Schriftrolle von MANNAZ
items.scrolls.exotic.exoticscroll.naudiz=exotische Schriftrolle von Nauliz
items.scrolls.exotic.exoticscroll.odal=exotische Schriftrolle von ODAL
items.scrolls.exotic.exoticscroll.raido=exotische Schriftrolle von RAIDO
items.scrolls.exotic.exoticscroll.sowilo=exotische Schriftrolle von SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=exotische Schriftrolle von TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=Auf diesem schwarzen Pergament ist eine leuchtende, unentzifferbare magische Rune geschrieben. Sie scheint diesem Land fremd zu sein; wer weiß, was passiert, wenn man sie laut vorliest?
items.scrolls.exotic.exoticscroll.yngvi=exotische Schriftrolle von YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Der Zauberspruch auf dieser Schriftrolle umgibt euch mit einer magischen Aura, die vorübergehend alle magischen Effekte – ob schädlich oder nützlich – blockiert. Dies betrifft die meisten Effekte magischer Gegenstände wie Zauberstäbe, Schriftrollen, Ringe, Artefakte, Verzauberungen und Flüche. Heldenrüstungen sind jedoch stark genug, um unabhängig davon zu wirken.
items.scrolls.exotic.scrollofantimagic.name=Schriftrolle der Anti-Magie
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Eine magische Arena ist um dich herum erschienen, erkennbar an einem wogenden roten Nebel. Solange du dich im Nebel befindest, steigt dein Hunger nicht an und du erleidest 33%% weniger Schaden aus allen Quellen. Falls du über weitere Schadensreduktionsquellen (wie Rüstung) verfügst, werden diese nach der 33%%-Reduzierung angewendet. Verbleibende Runden: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=Herausforderungsarena
items.scrolls.exotic.scrollofchallenge.desc=Wird diese Schriftrolle laut vorgelesen, ertönt ein gewaltiges Gebrüll, das Feinde anlockt und gleichzeitig eine kleine Arena um den Leser herum erschafft. Solange sich der Leser in dieser Arena aufhält, erleidet er 33 % weniger Schaden aus allen Quellen (dieser Effekt wird vor anderen Schadensreduktionsmaßnahmen angewendet) und verliert keine Sättigung. Die Größe der Arena skaliert mit der Größe des Gebiets, in dem sich der Leser befindet. In manchen Bossgebieten ist sie besonders klein.
items.scrolls.exotic.scrollofchallenge.name=Herausforderungsrolle
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Ihre Wahrsagerolle hat folgende Punkte identifiziert:
items.scrolls.exotic.scrollofdivination.desc=Diese Schriftrolle identifiziert zufällig vier Gegenstände, die du noch nicht kennst. Es kann sich dabei um die Farbe eines Tranks, eine Rune einer Schriftrolle oder einen Edelstein eines Rings handeln. Die identifizierten Gegenstände müssen nicht unbedingt zu deinem Besitz gehören.
items.scrolls.exotic.scrollofdivination.name=Schriftrolle der Weissagung
items.scrolls.exotic.scrollofdivination.nothing_left=Es gibt nichts mehr zu identifizieren!
items.scrolls.exotic.scrollofdread.desc=Beim Lesen dieser Schriftrolle erstrahlt ein roter Lichtblitz, der alle Feinde in deinem Sichtfeld in unglaubliches Grauen versetzt. Die Wirkung ist so gewaltig, dass sie fluchtartig aus dem gesamten Dungeon fliehen und nie wieder gesehen werden! Wie der Schrecken selbst, kann auch dieser Effekt mit der Zeit oder bei einem Angriff des Feindes abklingen. Willensstarke Feinde, wie beispielsweise Bosse, werden stattdessen von normalem Schrecken erfasst.
items.scrolls.exotic.scrollofdread.name=Schriftrolle des Schreckens
items.scrolls.exotic.scrollofenchantment.armor=Wähle ein Glyphensymbol aus, das du auf deine Rüstung anwenden möchtest.
items.scrolls.exotic.scrollofenchantment.cancel=stornieren
items.scrolls.exotic.scrollofenchantment.cancel_warn=Das Abbrechen verbraucht trotzdem deine Verzauberungsrolle, bist du dir sicher?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Nein, ich habe meine Meinung geändert
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Ja, ich bin mir sicher.
items.scrolls.exotic.scrollofenchantment.desc=Diese Schriftrolle wird eine Waffe oder Rüstung mit mächtiger magischer Energie erfüllen. Der Leser hat sogar ein gewisses Maß an Kontrolle darüber, welche Magie übertragen wird.
items.scrolls.exotic.scrollofenchantment.inv_title=Verzaubere einen Gegenstand
items.scrolls.exotic.scrollofenchantment.name=Schriftrolle der Verzauberung
items.scrolls.exotic.scrollofenchantment.weapon=Wähle eine Verzauberung aus, die du auf deine Waffe anwenden möchtest.
items.scrolls.exotic.scrollofforesight.desc=Nach dem Lesen dieser Schriftrolle werden dem Leser die Details der umliegenden Landschaft in kristallklarer Deutlichkeit vor Augen geführt. Dieser Effekt hält über einen längeren Zeitraum an und enthüllt alle verborgenen Türen und Fallen, sodass die Suche überflüssig wird.
items.scrolls.exotic.scrollofforesight.name=Schriftrolle der Voraussicht
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Auch wenn du abbrichst, wird deine Metamorphose-Schriftrolle verbraucht, bist du dir sicher?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Wähle ein Talent, das du verwandeln möchtest.
items.scrolls.exotic.scrollofmetamorphosis.desc=Diese Schriftrolle enthält mächtige Transmutationsmagie, die auf den Zaubernden selbst und nicht auf einen Gegenstand wirkt. Mit dieser Magie kannst du ein Talent auswählen und es durch eines von fünf Talenten derselben Stufe aus verschiedenen Heldenklassen ersetzen! Dieser Effekt gilt nur für Klassentalente, nicht für Talente aus Unterklassen oder Rüstungsfähigkeiten. Talente, die du nicht verwenden kannst, werden dir nicht zur Auswahl angeboten.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=Talent zur Metamorphose
items.scrolls.exotic.scrollofmetamorphosis.name=Schriftrolle der Metamorphose
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Wähle ein neues Talent, um dein verändertes Talent zu ersetzen.
items.scrolls.exotic.scrollofmysticalenergy.desc=Die in diesem Pergament gebundene rohe magische Kraft wird, wenn sie freigesetzt wird, die ausgerüsteten Artefakte des Benutzers mit der Zeit aufladen.
items.scrolls.exotic.scrollofmysticalenergy.name=Schriftrolle mystischer Energie
items.scrolls.exotic.scrollofpassage.desc=Der Zauberspruch auf diesem Pergament versetzt den Leser augenblicklich in die nächstgelegene Region im ersten Stock über ihm. Sehr praktisch, um schnell zu einem Laden zu gelangen.
items.scrolls.exotic.scrollofpassage.name=Schriftrolle des Durchgangs
items.scrolls.exotic.scrollofprismaticimage.desc=Der Zauberspruch auf dieser Schriftrolle erschafft ein farbenprächtiges, illusorisches Abbild des Lesers. Dieses prismatische Bild fungiert als schwächerer Klon des Lesers mit ähnlicher Verteidigung, aber geringeren Lebenspunkten und niedrigerem Schaden. Das prismatische Bild erscheint, sobald Feinde anwesend sind, und versucht, den Leser zu verteidigen. Existiert bereits ein prismatisches Bild, wird es durch die Verwendung dieser Schriftrolle vollständig geheilt.
items.scrolls.exotic.scrollofprismaticimage.name=Schriftrolle mit prismatischem Bild
items.scrolls.exotic.scrollofpsionicblast.desc=Diese Schriftrolle birgt ungeheure Zerstörungsenergie, die kanalisiert werden kann, um den Verstand aller sichtbaren Kreaturen zu vernichten. Es gibt jedoch erhebliche Rückwirkungen, und der Leser wird ebenfalls Schaden erleiden, geblendet und geschwächt. Je mehr Ziele die Schriftrolle trifft, desto geringer ist der erlittene Schaden.
items.scrolls.exotic.scrollofpsionicblast.name=Schriftrolle des psionischen Stoßes
items.scrolls.exotic.scrollofpsionicblast.ondeath=Der Psionische Stoß zerreißt deinen Verstand...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Dieses Wesen wurde durch die Magie einer Schriftrolle mit Sirenengesang verzaubert. Ein verzauberter Charakter ist dauerhaft euer Verbündeter und kämpft gegen alle Feinde, denen er begegnet.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=gebannt
items.scrolls.exotic.scrollofsirenssong.cancel=Sie müssen ein Ziel auswählen.
items.scrolls.exotic.scrollofsirenssong.desc=Das Lesen dieser Schriftrolle erzeugt eine betörende Melodie, die einen anvisierten Feind in ihren Bann zieht und ihn dauerhaft zu einem Verbündeten macht! Andere Feinde, die sie hören, werden vorübergehend verzaubert. Besonders starke Feinde können dem Zauber widerstehen und werden stattdessen verzaubert.
items.scrolls.exotic.scrollofsirenssong.name=Schriftrolle mit Sirenengesang
items.scrolls.exotic.scrollofsirenssong.no_target=Die Schriftrolle wird auch ohne Ziel aktiviert.
items.scrolls.exotic.scrollofsirenssong.prompt=Wählen Sie ein Ziel aus
items.scrolls.inventoryscroll.no=Nein, ich habe meine Meinung geändert
items.scrolls.inventoryscroll.warning=Möchten Sie diese Scrollnutzung wirklich abbrechen? Der Scrollvorgang wurde zuvor nicht identifiziert und wird daher trotzdem verbraucht.
items.scrolls.inventoryscroll.yes=Ja, ich bin mir sicher.
items.scrolls.scroll$placeholder.name=scrollen
items.scrolls.scroll.ac_read=LESEN
items.scrolls.scroll.berkanan=Schriftrolle von Berkanan
items.scrolls.scroll.blinded=Man kann keine Schriftrolle lesen, wenn man blind ist.
items.scrolls.scroll.cursed=Dein verfluchtes Zauberbuch hindert dich daran, die Magie dieser Schriftrolle zu nutzen! Eine Schriftrolle zur Fluchaufhebung könnte jedoch stark genug sein, um dennoch zu wirken...
items.scrolls.scroll.gyfu=Schriftrolle von GYFU
items.scrolls.scroll.isaz=Schriftrolle von ISAZ
items.scrolls.scroll.kaunan=Schriftrolle von KAUNAN
items.scrolls.scroll.laguz=Schriftrolle von LAGUZ
items.scrolls.scroll.mannaz=Schriftrolle von MANNAZ
items.scrolls.scroll.naudiz=Schriftrolle von Nauliz
items.scrolls.scroll.no_magic=Man kann keine Schriftrolle lesen, wenn man immun gegen Magie ist.
items.scrolls.scroll.odal=Schriftrolle von ODAL
items.scrolls.scroll.raido=Schriftrolle von RAIDO
items.scrolls.scroll.sowilo=Schriftrolle von Sowilo
items.scrolls.scroll.tiwaz=Schriftrolle von TIWAZ
items.scrolls.scroll.unknown_desc=Dieses Pergament ist mit unleserlichen Schriftzeichen bedeckt und trägt die Rune %s als Titel. Wer weiß, welche Wirkung es beim lauten Vorlesen hat?
items.scrolls.scroll.yngvi=Schriftrolle von YNGVI
items.scrolls.scrollofidentify.desc=Enthüllt dauerhaft alle Geheimnisse eines einzelnen Gegenstands.
items.scrolls.scrollofidentify.inv_title=Identifizieren Sie einen Gegenstand
items.scrolls.scrollofidentify.it_is=Ihr Artikel wurde identifiziert: %s.
items.scrolls.scrollofidentify.name=Schriftrolle der Identifikation
items.scrolls.scrolloflullaby.desc=Eine sanfte Melodie versetzt alle Kreaturen in Ihrem Sichtfeld in einen tiefen Schlaf und gibt Ihnen die Möglichkeit zu fliehen oder sie mit einem Überraschungsangriff zu überfallen.
items.scrolls.scrolloflullaby.name=Schriftrolle des Wiegenlieds
items.scrolls.scrolloflullaby.sooth=Die Schriftrolle erklingt mit einer beruhigenden Melodie. Du wirst sehr schläfrig.
items.scrolls.scrollofmagicmapping.desc=Beim Lesen dieser Schriftrolle prägt sich ein gestochen scharfes Bild in dein Gedächtnis ein, das dir den genauen Aufbau des Levels zeigt und alle verborgenen Geheimnisse enthüllt. Die Standorte von Gegenständen und Kreaturen bleiben unbekannt.
items.scrolls.scrollofmagicmapping.layout=Sie kennen nun den Levelaufbau.
items.scrolls.scrollofmagicmapping.name=Schriftrolle der magischen Karte
items.scrolls.scrollofmirrorimage.copies=Die Schriftrolle bildet Spiegelbilder von dir ab.
items.scrolls.scrollofmirrorimage.desc=Der Zauberspruch auf dieser Schriftrolle erzeugt illusionäre Zwillinge des Lesers, die seine Feinde verfolgen werden.
items.scrolls.scrollofmirrorimage.name=Schriftrolle des Spiegelbilds
items.scrolls.scrollofmirrorimage.no_copies=Die Schriftrolle versucht, Spiegelbilder von dir zu erzeugen, aber diese können nirgendwohin.
items.scrolls.scrollofrage.desc=Wenn diese Schriftrolle laut vorgelesen wird, ertönt ein gewaltiges Gebrüll, das alle Feinde zum Vorleser lockt und die in der Nähe befindlichen in Wut versetzt.
items.scrolls.scrollofrage.name=Schriftrolle des Zorns
items.scrolls.scrollofrage.roar=Die Schriftrolle stößt ein ohrenbetäubendes Gebrüll aus, das durch das ganze Verlies hallt!
items.scrolls.scrollofrecharging.desc=Die in diesem Pergament gebundene rohe magische Kraft wird, wenn sie freigesetzt wird, alle Zauberstäbe des Lesers wieder vollständig aufladen.
items.scrolls.scrollofrecharging.name=Schriftrolle der Aufladung
items.scrolls.scrollofrecharging.surge=Ein Energieschub durchströmt deinen Körper und belebt deine Zauberstäbe!
items.scrolls.scrollofremovecurse.cleansed=Dein Gegenstand erstrahlt in einem reinigenden Licht, und eine bösartige Energie verfliegt!
items.scrolls.scrollofremovecurse.desc=Der Zauberspruch auf dieser Schriftrolle entfernt augenblicklich alle bösen Verzauberungen von der Waffe, der Rüstung, den Ringen und den mitgeführten Gegenständen des Lesers, die den Träger daran hindern könnten, sie abzulegen.
items.scrolls.scrollofremovecurse.inv_title=Einen Gegenstand reinigen
items.scrolls.scrollofremovecurse.name=Schriftrolle zur Fluchbeseitigung
items.scrolls.scrollofremovecurse.not_cleansed=Ihr Gegenstand leuchtet in einem Reinigungslicht, aber es passiert nichts.
items.scrolls.scrollofremovecurse.spirit=Deine Schriftrolle befreit den gequälten Geist!
items.scrolls.scrollofretribution.blast=Mächtige magische Energie bricht aus der Schriftrolle hervor!
items.scrolls.scrollofretribution.desc=Diese Schriftrolle birgt zerstörerische Energie, die das Leid des Lesers in eine gewaltige Kraftexplosion umwandelt. Je schwächer der Leser ist, desto mehr Schaden richtet er an. Bei sehr geringer Gesundheit kann diese Schriftrolle die meisten Feinde sofort töten. Die Benutzung der Schriftrolle zehrt jedoch am Benutzer, indem sie ihn erblinden und schwächen lässt.
items.scrolls.scrollofretribution.name=Schriftrolle der Vergeltung
items.scrolls.scrollofteleportation.cant_reach=Man kann sich nicht dorthin teleportieren.
items.scrolls.scrollofteleportation.desc=Der Zauber auf diesem Pergament versetzt den Leser augenblicklich an einen zufälligen Ort im Verlies. Er kann genutzt werden, um einer gefährlichen Situation zu entkommen, doch der unglückliche Leser könnte sich dadurch in einer noch gefährlicheren Lage wiederfinden.
items.scrolls.scrollofteleportation.name=Schriftrolle der Teleportation
items.scrolls.scrollofteleportation.no_tele=Der Teleportationszauber schlägt fehl.
items.scrolls.scrollofteleportation.prompt=Wähle einen Ort zum Teleportieren.
items.scrolls.scrollofteleportation.tele=Im Nu wurdest du an einen anderen Ort des Levels teleportiert.
items.scrolls.scrollofterror.desc=Ein roter Lichtblitz versetzt alle Kreaturen in deinem Sichtfeld in Schrecken, und sie werden sich umdrehen und fliehen. Ein Angriff auf einen fliehenden Feind hebt den Effekt auf.
items.scrolls.scrollofterror.many=Die Schriftrolle erstrahlt in einem grellen roten Lichtblitz und die Monster fliehen!
items.scrolls.scrollofterror.name=Schriftrolle des Schreckens
items.scrolls.scrollofterror.none=Die Schriftrolle gibt einen grellen roten Lichtblitz von sich.
items.scrolls.scrollofterror.one=Die Schriftrolle strahlt einen grellen roten Lichtblitz aus und der %s flieht!
items.scrolls.scrolloftransmutation.desc=Diese Schriftrolle enthält mächtige Transmutationsmagie. Bei Anwendung auf einen geeigneten Gegenstand verwandelt sie diesen in einen anderen Gegenstand desselben Typs. Die Magie erhält dabei sogar Verbesserungen, Verzauberungen und Glyphen. Schriftrollen und Tränke werden in ihre exotischen Entsprechungen umgewandelt und umgekehrt.
items.scrolls.scrolloftransmutation.inv_title=Einen Gegenstand umwandeln
items.scrolls.scrolloftransmutation.morph=Dein Gegenstand verwandelt sich in etwas anderes!
items.scrolls.scrolloftransmutation.name=Schriftrolle der Verwandlung
items.scrolls.scrolloftransmutation.nothing=Es passiert nichts Interessantes.
items.scrolls.scrollofupgrade.desc=Diese Schriftrolle wertet einen einzelnen Gegenstand auf und verbessert seine Qualität. Ein Zauberstab wird stärker und hat mehr Ladungen; eine Waffe verursacht mehr Schaden oder trifft ihr Ziel häufiger; eine Rüstung wehrt mehr Schläge ab; die Wirkung eines Rings auf seinen Träger verstärkt sich. Waffen und Rüstungen benötigen außerdem weniger Kraftaufwand, und etwaige Flüche auf dem Gegenstand werden aufgehoben.
items.scrolls.scrollofupgrade.inv_title=Werten Sie einen Gegenstand auf
items.scrolls.scrollofupgrade.name=Schriftrolle der Verbesserung
items.scrolls.scrollofupgrade.remove_curse=Die Schriftrolle der Aufwertung reinigt euren Gegenstand vom Fluch!
items.scrolls.scrollofupgrade.weaken_curse=Die Schriftrolle der Aufwertung schwächt den Fluch auf deinem Gegenstand.
items.spells.alchemize$wndalchemizeitem.energize=In %d-Energie umwandeln
items.spells.alchemize$wndalchemizeitem.energize_1=Wandle 1 in %d-Energie um
items.spells.alchemize$wndalchemizeitem.energize_all=Alles in %d-Energie umwandeln
items.spells.alchemize$wndalchemizeitem.sell=In %dg umwandeln
items.spells.alchemize$wndalchemizeitem.sell_1=Wandeln Sie 1 in %dg um.
items.spells.alchemize$wndalchemizeitem.sell_all=Alles in %dg umwandeln
items.spells.alchemize.desc=Dieser Zauber besitzt transformative Kräfte, ähnlich denen eines Alchemiekessels. Jeder Zauber ermöglicht es dem Anwender, einen Gegenstand (oder mehrere Gegenstände) in Gold oder alchemistische Energie zu verwandeln. Tränke oder Schriftrollen werden durch die Umwandlung in Energie sogar identifiziert! Einige Alchemize-Anwendungen sind in Läden erhältlich, viele weitere können jedoch durch Alchemie hergestellt werden, indem man einen Samen, einen Runenstein und etwas alchemistische Energie kombiniert.
items.spells.alchemize.name=alchemisieren
items.spells.alchemize.prompt=Einen Gegenstand alchemisieren
items.spells.beaconofreturning.creatures=Die psychische Aura benachbarter Kreaturen erlaubt dir in diesem Moment keine Teleportation.
items.spells.beaconofreturning.desc=Dieser komplexe Zauber verleiht dem Anwender die Fähigkeit, unabhängig von der Entfernung zu einem festgelegten Ort zurückzukehren. Der Zauber wird erst durch die Rückkehr verbraucht; er kann beliebig oft angewendet werden, merkt sich aber nur den zuletzt festgelegten Ort.
items.spells.beaconofreturning.desc_set=Dieser Beacon wurde irgendwo auf Etage %d aufgestellt.
items.spells.beaconofreturning.name=Leuchtfeuer der Rückkehr
items.spells.beaconofreturning.preventing=Die starke magische Aura dieses Ortes hindert dich daran, den Zauber anzuwenden!
items.spells.beaconofreturning.set=Der Peilsender wurde an Ihrem aktuellen Standort aufgestellt.
items.spells.beaconofreturning.wnd_body=Die Einstellung überschreibt den zuvor festgelegten Standort des Leuchtfeuers.\n\nDie Rückkehr führt zurück zum zuletzt festgelegten Standort und verbraucht eine Anwendung des Zaubers.
items.spells.beaconofreturning.wnd_return=ZURÜCKKEHREN
items.spells.beaconofreturning.wnd_set=SATZ
items.spells.curseinfusion.desc=Dieser Zauber durchdringt einen Ausrüstungsgegenstand mit derselben mächtigen, bösartigen Magie wie in DM-300. Der Gegenstand wird sofort verflucht, und jegliche Verzauberungen oder Glyphen werden überschrieben. Bei Waffen, Rüstungen und Zauberstäben erhält der Gegenstand zusätzlich zum Fluch Verbesserungen. Die Verbesserungen durch die Fluchinfusion sind nicht stapelbar und gehen verloren, sobald der Fluch aufgehoben wird. Mehrere Fluchinfusionen können auch verwendet werden, um den Fluch auf einer Waffe oder Rüstung zu verändern.
items.spells.curseinfusion.inv_title=Verfluche einen Gegenstand
items.spells.curseinfusion.name=Fluchinfusion
items.spells.magicalinfusion.desc=Dieser Zauber besitzt die gleiche magische Kraft wie eine Schriftrolle der Aufwertung, jedoch in einer stabileren Form. Zusätzlich zur normalen Aufwertung eines Gegenstands wird er niemals eine Verzauberung, Glyphe oder einen Fluch löschen.
items.spells.magicalinfusion.infuse=Dein Gegenstand ist mit arkaner Energie erfüllt!
items.spells.magicalinfusion.inv_title=Einen Gegenstand durchdringen
items.spells.magicalinfusion.name=magischer Aufguss
items.spells.magicalporter.desc=Dieser Zauber teleportiert jeden Gegenstand, auf den er gewirkt wird, auf magische Weise. Anders als bei einem Leuchtfeuer eines Händlers werden die Gegenstände jedoch zum Eingang der nächsten Boss-Ebene transportiert.
items.spells.magicalporter.inv_title=Port an item
items.spells.magicalporter.name=magischer Porter
items.spells.magicalporter.nowhere=Es gibt keinen Ort, an den Sie einen Gegenstand übertragen können.
items.spells.phaseshift.desc=Dieser chaotische Zauber teleportiert jeden anvisierten Charakter an einen zufälligen Ort auf der aktuellen Ebene und betäubt ihn für längere Zeit. Mächtige Gegner können dem Betäubungseffekt widerstehen. Der Zauber kann auf ein Ziel oder auf den Anwender selbst gewirkt werden.
items.spells.phaseshift.name=Phasenverschiebung
items.spells.phaseshift.no_target=Dort gibt es nichts, wohin man teleportieren könnte.
items.spells.reclaimtrap.desc=Dieser Zauber enthält Reste der mechanischen Energie von DM-300. Wird er auf eine aktive Falle gewirkt, überträgt sich deren Kraft auf dich. Dadurch kannst du den Zauber erneut anwenden, um diese Kraft freizusetzen und den Effekt der Falle an einem beliebigen Ort auszulösen. Allerdings funktionieren manche Fallen möglicherweise nicht überall, und es kann immer nur eine Falle gleichzeitig gelagert werden.
items.spells.reclaimtrap.desc_trap=Der Zauber ist aktuell bereit, ein _%s_ auszulösen.
items.spells.reclaimtrap.name=Rückholfalle
items.spells.reclaimtrap.no_trap=Dort gibt es keine Falle.
items.spells.recycle.desc=Dieser Zauber beinhaltet eine schwächere Form der Verwandlungsmagie. Er wirkt zwar nicht auf Ausrüstung, verwandelt aber eine Schriftrolle, einen Trank, einen Samen, einen Runenstein oder einen Pfeil mit Spitze in einen zufälligen Gegenstand derselben Art.
items.spells.recycle.inv_title=Einen Gegenstand recyceln
items.spells.recycle.name=recyceln
items.spells.recycle.recycled=Ihr Artikel wurde recycelt zu: %s.
items.spells.spell.ac_cast=GIESSEN
items.spells.spell.discover_hint=Dieses Item kann man durch Alchemie herstellen.
items.spells.spell.no_magic=Du kannst keine Zauber wirken, solange du immun gegen Magie bist.
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.desc=Dieser Zauber nutzt die Energie der Elementarglut, aus der er hergestellt wurde, und ermöglicht es dir, ein freundliches Elementarwesen herbeizurufen, das an deiner Seite kämpft! Es kann immer nur ein Elementarwesen gleichzeitig beschworen werden, aber der Zauber kann erneut gewirkt werden, um das Elementarwesen kostenlos zurückzuholen.
items.spells.summonelemental.desc_chaos=Der Zauber strahlt derzeit chaotische Energie aus und wird ein Chaos-Elementarwesen beschwören. Du kannst einen anderen Gegenstand einsetzen, aber der Zauber verliert dadurch seine aktuelle Wirkung.
items.spells.summonelemental.desc_fire=Der Zauber ist momentan heiß und beschwört ein Feuerelementar. Du kannst einen anderen Gegenstand einsetzen, aber der Zauber verliert dadurch seine aktuelle Wirkung.
items.spells.summonelemental.desc_frost=Der Zauber fühlt sich momentan kalt an und beschwört ein Frostelementar. Du kannst einen anderen Gegenstand einsetzen, aber der Zauber verliert dadurch seine aktuelle Wirkung.
items.spells.summonelemental.desc_newborn=Der Zauber ist derzeit nicht verstärkt und beschwört ein neugeborenes Elementarwesen ohne Fernkampfangriff. Du kannst einen bestimmten Trank der flüssigen Flamme, einen Frosttrank, eine Schriftrolle der Wiederaufladung oder eine Schriftrolle der Verwandlung hinzufügen, um den Zauber zu verstärken und zukünftige Beschwörungen zu Elementarwesen voller Stärke zu machen!
items.spells.summonelemental.desc_shock=Der Zauber strahlt derzeit statische Energie aus und beschwört ein Schockelementar. Du kannst einen anderen Gegenstand einsetzen, aber der Zauber verliert dadurch seine aktuelle Wirkung.
items.spells.summonelemental.imbue_prompt=Einen Gegenstand
items.spells.summonelemental.name=Elementar beschwören
items.spells.targetedspell.inv_title=Einen Gegenstand durchdringen
items.spells.targetedspell.prompt=Wählen Sie ein Ziel aus
items.spells.telekineticgrab.cant_grab=Das kannst du nicht greifen.
items.spells.telekineticgrab.desc=Dieser Zauber erlaubt es dem Zaubernden, aus der Ferne alle Gegenstände an einem Ort oder alle Wurfwaffen, die an einem Feind kleben bleiben, zu greifen!\n\nEr kann nicht verwendet werden, um Gegenstände zu greifen, die jemand anderem gehören, oder um Behälter wie Truhen zu greifen.
items.spells.telekineticgrab.name=telekinetischer Griff
items.spells.telekineticgrab.no_target=Da gibt es nichts zum Festhalten.
items.spells.unstablespell.desc=Dieser kleine schwarze quadratische Kristall trägt auf jeder seiner Oberflächen wechselnde Runensymbole. \n\n Bei Aktivierung löst er den Effekt einer zufälligen Schriftrolle aus. Der Effekt der Schriftrolle ist stets kampfbezogen, solange sich Gegner in deinem Sichtfeld befinden, und ansonsten immer nicht kampfbezogen.
items.spells.unstablespell.name=instabiler Zauber
items.spells.wildenergy.desc=Dieser Zauber enthält einen Teil der verfluchten Energie, die DM-300 einst antrieb. Beim Wirken lädt er eure Zauberstäbe und getragenen Artefakte wieder auf und löst gleichzeitig einen zufälligen verfluchten Zauberstab-Effekt aus. Ihr könnt jedoch die Richtung wählen, in die diese verfluchte Magie wirkt.
items.spells.wildenergy.name=ungebändigte Energie
items.stones.inventorystone.ac_use=VERWENDEN
items.stones.runestone$placeholder.name=Runenstein
items.stones.runestone.discover_hint=Diesen Gegenstand findet man zufällig im Dungeon oder man kann ihn durch Alchemie herstellen.
items.stones.stoneofaggression$aggression.desc=Manipulative Magie bewirkt, dass alle Feinde in der Nähe diesen Charakter bevorzugt angreifen.\n\nVerbleibende Züge: %s.
items.stones.stoneofaggression$aggression.name=gezielt
items.stones.stoneofaggression.desc=Wird dieser Stein auf einen Verbündeten oder Feind geworfen, greifen alle Feinde in der Nähe diesen Charakter für kurze Zeit bevorzugt an. Bossgegner können dem Effekt jedoch widerstehen, wodurch sich die Wirkungsdauer deutlich verkürzt und sie weniger Schaden durch die Angriffe ihrer Diener erleiden.
items.stones.stoneofaggression.name=Stein der Aggression
items.stones.stoneofaugmentation$wndaugment.cancel=Egal
items.stones.stoneofaugmentation$wndaugment.choice=Was möchten Sie verbessern?
items.stones.stoneofaugmentation$wndaugment.damage=Schaden
items.stones.stoneofaugmentation$wndaugment.defense=Verteidigung
items.stones.stoneofaugmentation$wndaugment.evasion=Ausweichen
items.stones.stoneofaugmentation$wndaugment.none=Augmentation entfernen
items.stones.stoneofaugmentation$wndaugment.speed=Geschwindigkeit
items.stones.stoneofaugmentation.desc=Dieser Runenstein besitzt mächtige Magie, die Ausrüstung verstärken kann, indem sie eine Eigenschaft auf Kosten einer anderen verbessert. \n\n Die Anwendung auf einer Waffe erhöht entweder die Geschwindigkeit oder den Schaden. Wurfwaffen gewinnen oder verlieren zudem an Haltbarkeit proportional zu ihrer Geschwindigkeit. \n\n Die Anwendung auf einer Rüstung erhöht entweder die Verteidigung oder die Ausweichfähigkeit.
items.stones.stoneofaugmentation.discover_hint=Diesen Gegenstand kann man in einem Laden kaufen oder durch Alchemie herstellen.
items.stones.stoneofaugmentation.inv_title=Verbessere einen Gegenstand
items.stones.stoneofaugmentation.name=Stein der Vergrößerung
items.stones.stoneofblast.desc=Dieser Runenstein explodiert sofort an dem Ort, an den er geworfen wird. Wie eine Bombe fügt die Explosion allem in der Nähe Schaden zu.
items.stones.stoneofblast.name=Steinsprengung
items.stones.stoneofblink.desc=Dieser Runenstein teleportiert den Benutzer an den Ort, zu dem er geworfen wird.
items.stones.stoneofblink.name=Stein des Blinkens
items.stones.stoneofclairvoyance.desc=Dieser Stein enthüllt augenblicklich alle Fliesen in einem sehr weiten Umkreis um den Ort, an dem er geworfen wird. Seine Wirkung reicht sogar durch Wände hindurch.
items.stones.stoneofclairvoyance.name=Stein der Hellseherei
items.stones.stoneofdeepsleep.desc=Wenn dieser Stein auf einen Feind geworfen wird, versetzt er ihn in einen tiefen magischen Schlaf. Feinde, die in magischem Schlaf verharren, schlafen ewig, bis sie gestört werden.
items.stones.stoneofdeepsleep.name=Stein des tiefen Schlafs
items.stones.stoneofdetectmagic.desc=Dieser Runenstein kann Magie aufspüren, die auf einen Gegenstand wirkt. Wendet man ihn auf einen unbekannten Gegenstand an, erfährt man, ob er von einem bösartigen Fluch oder von positiver Magie wie Verzauberungen oder Verbesserungen betroffen ist.
items.stones.stoneofdetectmagic.detected_bad=Du spürst böswillige Magie, die diesen Gegenstand beeinflusst!
items.stones.stoneofdetectmagic.detected_both=Du spürst sowohl positive als auch bösartige Magie, die diesen Gegenstand beeinflusst!
items.stones.stoneofdetectmagic.detected_good=Du spürst, wie positive Magie auf diesen Gegenstand wirkt!
items.stones.stoneofdetectmagic.detected_none=Du kannst keine magische Wirkung auf diesen Gegenstand feststellen.
items.stones.stoneofdetectmagic.inv_title=Ein Element erkennen
items.stones.stoneofdetectmagic.name=Stein der Magieerkennung
items.stones.stoneofdisarming.desc=Dieser Runenstein birgt Magie, die bösartige, im gesamten Dungeon versteckte Fallen entschärfen kann. Er deaktiviert bis zu neun Fallen in dem Bereich, in den er geworfen wird.
items.stones.stoneofdisarming.name=Stein der Entwaffnung
items.stones.stoneofenchantment.armor=Deine Rüstung leuchtet in der Dunkelheit!
items.stones.stoneofenchantment.desc=Dieser Runenstein besitzt bezaubernde Magie. Anders als eine Schriftrolle der Aufwertung erhöht er nicht die direkte Stärke eines Gegenstands, sondern verleiht einer Waffe oder Rüstung einen Zauber und damit neue Kräfte.
items.stones.stoneofenchantment.inv_title=Verzaubere einen Gegenstand
items.stones.stoneofenchantment.name=Stein der Verzauberung
items.stones.stoneofenchantment.weapon=Deine Waffe leuchtet in der Dunkelheit!
items.stones.stoneoffear.desc=Wird dieser Stein auf eine Spielfigur geworfen, wird diese von Entsetzen ergriffen und flieht. Ein Angriff auf eine fliehende Spielfigur verkürzt die Wirkungsdauer.
items.stones.stoneoffear.name=Stein der Furcht
items.stones.stoneofflock.desc=Dieser Runenstein beschwört für kurze Zeit magische Schafe in der Nähe des Ortes herauf, an dem er geworfen wird.
items.stones.stoneofflock.name=Stein der Herde
items.stones.stoneofintuition$wndguess.break=Dein Stein der Intuition zerfällt zu Staub...
items.stones.stoneofintuition$wndguess.correct=Korrekt. Der Artikeltyp wurde identifiziert!
items.stones.stoneofintuition$wndguess.incorrect=Ihre Vermutung war falsch.
items.stones.stoneofintuition$wndguess.text=Errate, um welche Art von Gegenstand es sich handelt. Wenn du richtig rätst, wird die Art bestimmt!
items.stones.stoneofintuition.break_info=Du kannst die Steine der Intuition zweimal verwenden, bevor einer zerbricht; bei der nächsten Verwendung wird kein Stein verbraucht.
items.stones.stoneofintuition.break_warn=Du hast bereits einen Stein der Intuition benutzt, daher verbrauchst du bei deiner nächsten Benutzung einen Stein.
items.stones.stoneofintuition.desc=Dieser Runenstein birgt eine schwächere Form der Magie, die in Schriftrollen zur Identifizierung zu finden ist. Anstatt einen Gegenstand direkt zu identifizieren, nutzt er deine Intuition und ermöglicht es dir, die Art eines Tranks, einer Schriftrolle oder eines Rings durch Raten zu bestimmen.
items.stones.stoneofintuition.inv_title=Wählen Sie einen Artikel aus
items.stones.stoneofintuition.name=Stein der Intuition
items.stones.stoneofshock.desc=Dieser Runenstein entfesselt einen elektrischen Energiestoß, der alle Ziele in der Nähe kurzzeitig betäubt und dem Werfer für jedes getroffene Ziel eine Zauberstabladung gewährt.
items.stones.stoneofshock.name=Schockstein
items.stylus.ac_inscribe=ABONNIEREN
items.stylus.cursed=Die Magie des Stiftes funktioniert nicht bei verfluchter Rüstung.
items.stylus.desc=Dieser geheimnisvolle Griffel besteht aus einem dunklen, sehr harten Stein. Mit ihm kannst du ein magisches Symbol in deine Rüstung einritzen, doch du hast keinen Einfluss darauf, welches Symbol es sein wird; der Griffel entscheidet darüber.
items.stylus.identify=Zuerst muss festgestellt werden, ob die Rüstung verflucht ist.
items.stylus.inscribed=Du hast deine Rüstung mit dem Stift beschriftet.
items.stylus.name=geheimnisvoller Stift
items.stylus.prompt=Wähle eine Rüstung
items.tengusmask.ac_wear=TRAGEN
items.tengusmask.desc=Diese Maske fiel Tengu im Sterben vom Gesicht. Man spürt eine gewaltige magische Kraft, die von ihr ausgeht. War die Maske Tengus Stärkequelle? Wenn du sie trägst, wird die enorme Kraft der Maske auf dich übertragen und ermöglicht es dir, eine Unterklasse für deinen Helden zu wählen. Welche Unterklasse wählst du?
items.tengusmask.discover_hint=Diesen Gegenstand kann man als Beute von bestimmten Gegnern erhalten.
items.tengusmask.name=Tengus Maske
items.tengusmask.used=Die Maske zerfällt, während ihre Kraft in dich fließt!
items.torch.ac_light=LICHT
items.torch.desc=Eine Fackel ist ein unverzichtbares Ausrüstungsteil für Abenteurer: Wenn es in einem Dungeon dunkel wird, kann sie den Weg weisen.
items.torch.name=Fackel
items.trinkets.chaoticcenser.desc=Nach einiger Zeit im Alchemiekessel scheint dieses Weihrauchgefäß von selbst Rauch zu produzieren! Die Gase sammeln sich an und strömen in unregelmäßigen Abständen aus dem Gefäß auf die Feinde. Es scheint alle möglichen Gase erzeugen zu können, aber du erhältst kurz vor der Aktivierung eine Warnung.
items.trinkets.chaoticcenser.name=chaotisches Weihrauchfass
items.trinkets.chaoticcenser.spew=Ihr Weihrauchfass wird gleich ausstoßen: %s.
items.trinkets.chaoticcenser.stats_desc=Auf der aktuellen Stufe erzeugt dieses Schmuckstück etwa alle _%d_ Runden ein schädliches Gas in der Nähe eines Gegners. Gase erscheinen nur, wenn Gegner anwesend sind. Auf höheren Stufen sind diese Gase mit größerer Wahrscheinlichkeit exotischer und mächtiger.
items.trinkets.chaoticcenser.typical_stats_desc=Dieses Schmuckstück erzeugt normalerweise etwa alle _%d_ Runden ein schädliches Gas in der Nähe eines Gegners. Gase erscheinen nur, wenn Gegner anwesend sind. Auf höheren Stufen sind diese Gase mit größerer Wahrscheinlichkeit exotischer und mächtiger.
items.trinkets.crackedspyglass.desc=Dieses Handfernrohr wäre ein Beweis für hervorragende und präzise Handwerkskunst, wenn da nicht der Riss in der Frontlinse wäre. Das Fernrohr scheint zwar neue Gegenstände im Dungeon aufzudecken, doch aufgrund des Defekts sind diese kaum zu erkennen!
items.trinkets.crackedspyglass.name=zerbrochenes Fernglas
items.trinkets.crackedspyglass.stats_desc=Auf der aktuellen Stufe hat dieses Schmuckstück eine Chance von _%1$s%%_, auf jeder Ebene außer Boss-Ebenen einen zusätzlichen versteckten Gegenstand zu erzeugen.
items.trinkets.crackedspyglass.stats_desc_upgraded=Auf der aktuellen Stufe besteht bei diesem Schmuckstück eine Chance von _100%%_, auf jeder Ebene außer Bossen einen zusätzlichen versteckten Gegenstand zu erzeugen, und eine Chance von _%1$s%%_, einen zweiten zusätzlichen versteckten Gegenstand zu erzeugen.
items.trinkets.crackedspyglass.typical_stats_desc=Normalerweise besteht bei diesem Schmuckstück eine Chance von _%1$s%%_, auf jeder Ebene außer Boss-Ebenen einen zusätzlichen versteckten Gegenstand zu erzeugen.
items.trinkets.dimensionalsundial.desc=Diese kleine, handliche Sonnenuhr wirft auf unerklärliche Weise einen Schatten in den Tiefen des Verlieses, selbst wenn man sie nicht aufrecht hält. Noch seltsamer ist, dass die Position des Schattens scheinbar in keinem Zusammenhang mit der Sonne in dieser Welt steht. Wirft die Sonnenuhr keinen Schatten, scheint sie Gefahr anzuziehen.
items.trinkets.dimensionalsundial.name=dimensionale Sonnenuhr
items.trinkets.dimensionalsundial.stats_desc=In seiner jetzigen Stufe verringert dieses Schmuckstück die Spawnrate von Feinden tagsüber (8:00-20:00 Uhr) um _%1$d%%_ und erhöht sie nachts (20:00-8:00 Uhr) um _%2$d%%_.
items.trinkets.dimensionalsundial.typical_stats_desc=Dieses Schmuckstück verringert normalerweise die Spawnrate von Feinden tagsüber (8:00-20:00 Uhr) um _%1$d%%_ und erhöht sie nachts (20:00-8:00 Uhr) um _%2$d%%_.
items.trinkets.dimensionalsundial.warning=Deine Sonnenuhr wirft keinen Schatten, du fühlst dich unwohl.
items.trinkets.exoticcrystals.desc=Diese kleinen rosa Kristalle haben dieselbe Form wie Kristalle alchemistischer Energie. Obwohl sie nicht direkt zur Energiegewinnung genutzt werden können, scheinen sie die gefundenen Tränke und Schriftrollen auf irgendeine Weise zu beeinflussen.
items.trinkets.exoticcrystals.name=exotische Kristalle
items.trinkets.exoticcrystals.stats_desc=Auf der aktuellen Stufe ersetzt dieses Schmuckstück _%s%%_ der gefundenen Tränke oder Schriftrollen durch ihre exotischen Entsprechungen. Dies betrifft nicht Stärketränke, Aufwertungsschriftrollen oder Gegenstände, die zur Bewältigung von Gefahrenräumen generiert werden.
items.trinkets.exoticcrystals.typical_stats_desc=Dieses Schmuckstück ersetzt normalerweise Tränke oder Schriftrollen (_%s%%_) durch ihre exotischen Entsprechungen. Dies betrifft keine Stärketränke, Aufwertungsschriftrollen oder Gegenstände, die zur Bewältigung von Gefahrenräumen generiert werden.
items.trinkets.eyeofnewt.desc=Dieses gold-schwarze Molchauge ist eine gängige Zutat, die nun zu einem Schmuckstück verarbeitet wird. Es scheint die Sehkraft einzuschränken, ermöglicht aber im Gegenzug, Dinge auf andere Weise wahrzunehmen.
items.trinkets.eyeofnewt.name=Auge des Molchs
items.trinkets.eyeofnewt.stats_desc=Auf der aktuellen Stufe verringert dieses Schmuckstück Ihre Sichtweite um _%1$s%%_, gewährt Ihnen aber gleichzeitig Gedankensicht auf Feinde innerhalb von _%2$d_ Feldern.
items.trinkets.eyeofnewt.typical_stats_desc=Dieses Schmuckstück verringert normalerweise Ihre Sichtweite um _%1$s%%_, gewährt Ihnen aber gleichzeitig Gedankensicht auf Feinde innerhalb von _%2$d_ Feldern.
items.trinkets.ferrettuft.desc=Ein Büschel seidig-weißen Frettchenfells, zusammengehalten von einem limettengrünen Band, das zu einer Schleife gebunden ist. Frettchen sind bekannt für ihre Wendigkeit, ihren Schalk und ihre Unzuverlässigkeit. Etwas von dieser Kraft scheint von dem Schmuckstück auszugehen und verstärkt die Fähigkeit, allem in der Nähe auszuweichen.
items.trinkets.ferrettuft.name=Frettchenbüschel
items.trinkets.ferrettuft.stats_desc=Auf der aktuellen Stufe erhöht dieses Schmuckstück die Ausweichchance aller Charaktere um _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Dieses Schmuckstück erhöht typischerweise die Ausweichchance aller Charaktere um _%1$s%%_.
items.trinkets.mimictooth.desc=Dieser große, scharfe Zahn muss einem äußerst unglücklichen Mimikry-Wesen entrissen worden sein. Er scheint die Mimikry-Wesen des Verlieses zu beeinflussen und sie dadurch häufiger und gefährlicher zu machen.
items.trinkets.mimictooth.name=Mimikzahn
items.trinkets.mimictooth.stats_desc=Auf der aktuellen Stufe erhöht dieses Schmuckstück die Häufigkeit und die Aufspürbarkeit aller Arten von Mimik-Gegnern, steigert aber gleichzeitig deren Beuteausbeute. Jede Dungeon-Ebene bietet zudem eine Chance von 6,5 %, einen zusätzlichen, schwer zu entdeckenden Ebenholz-Mimik zu enthalten.
items.trinkets.mimictooth.typical_stats_desc=Dieses Schmuckstück erhöht normalerweise die Häufigkeit und die Aufspürbarkeit aller Arten von Mimik-Gegnern und steigert gleichzeitig deren Beuteausbeute. Jede Dungeon-Ebene bietet zudem eine Chance von 6,5 %, einen zusätzlichen, schwer zu entdeckenden Ebenholz-Mimik zu enthalten.
items.trinkets.mossyclump.desc=Dieser Klumpen nassen Mooses scheint seine Feuchtigkeit zu halten, egal wie fest man ihn drückt. Er scheint auf magische Weise mit dem Verlies selbst verbunden zu sein, wodurch Gras und Wasser eher erscheinen.
items.trinkets.mossyclump.name=moosiger Klumpen
items.trinkets.mossyclump.stats_desc=Auf der aktuellen Stufe bewirkt dieses Schmuckstück, dass _%d%%_ der nicht thematisierten Böden entweder mit Wasser oder Gras gefüllt werden.\n\nDieses Schmuckstück benötigt mehr Energie zum Aufwerten.
items.trinkets.mossyclump.typical_stats_desc=Normalerweise bewirkt dieses Schmuckstück, dass _%d%%_ von nicht thematisierten Böden entweder mit Wasser oder Gras gefüllt werden.\n\nDieses Schmuckstück benötigt eine größere Menge Energie zum Aufrüsten.
items.trinkets.parchmentscrap.desc=Dieses kleine Pergamentstück sieht aus, als stamme es von einer Schriftrolle. Es hat etwas von seiner Magie bewahrt und scheint Waffen und Rüstungen im Verlies zu beeinflussen.
items.trinkets.parchmentscrap.name=Pergamentfetzen
items.trinkets.parchmentscrap.stats_desc=Auf der aktuellen Stufe macht dieses Schmuckstück Verzauberungen und Glyphen (_%dx_) sowie Flüche auf Waffen und Rüstungen (_%sx_) genauso häufig. Flüche auf Zauberstäben, Ringen oder Artefakten sind davon nicht betroffen. (\n\n) Die Aufwertung dieses Schmuckstücks erfordert eine größere Menge Energie.
items.trinkets.parchmentscrap.typical_stats_desc=Dieses Schmuckstück erhöht normalerweise die Häufigkeit von Verzauberungen und Glyphen (_%dx_) sowie von Flüchen auf Waffen und Rüstungen (_%sx_). Flüche auf Zauberstäben, Ringen oder Artefakten sind davon nicht betroffen. (\n\n) Die Aufwertung dieses Schmuckstücks erfordert eine größere Menge Energie.
items.trinkets.petrifiedseed.desc=Dieser Samen wurde entweder durch langsame geologische Prozesse oder durch Magie versteinert. Er scheint die Flora des Dungeons auf magische Weise zu beeinflussen und ersetzt gelegentlich Pflanzensamen durch Runensteine.
items.trinkets.petrifiedseed.name=versteinerter Samen
items.trinkets.petrifiedseed.stats_desc=Auf der aktuellen Stufe bewirkt dieses Schmuckstück, dass zertretenes Gras Runensteine anstelle von Samen fallen lässt, und dass hohes Gras häufiger Gegenstände fallen lässt.
items.trinkets.petrifiedseed.typical_stats_desc=Dieses Schmuckstück bewirkt normalerweise, dass zertretenes Gras Runensteine statt Samen fallen lässt, und es bewirkt außerdem, dass hohes Gras häufiger Gegenstände fallen lässt.
items.trinkets.ratskull.desc=Dieses makabre Schmuckstück ist kaum größer als der Schädel einer gewöhnlichen Ratte, die in diesem Verlies seltsamerweise eine Seltenheit darstellt. Der magische Einfluss des Schädels scheint die selteneren Bewohner des Verlieses anzulocken, wodurch sie viel häufiger erscheinen.
items.trinkets.ratskull.name=Rattenschädel
items.trinkets.ratskull.stats_desc=Auf der aktuellen Stufe erhöht dieses Schmuckstück die Wahrscheinlichkeit, dass seltene exotische Gegner erscheinen. Der Schädel ist jedoch nur halb so effektiv, um Kristallmimes und gepanzerte Statuen anzulocken.
items.trinkets.ratskull.typical_stats_desc=Dieses Schmuckstück erhöht normalerweise die Wahrscheinlichkeit, dass seltene exotische Gegner erscheinen. Der Schädel ist jedoch nur halb so effektiv, um Kristallmimes und gepanzerte Statuen anzulocken.
items.trinkets.saltcube.desc=Dieser große Salzkristall war zu einem nahezu perfekten Würfel geschnitten und hat es irgendwie geschafft, die Hälfte des Wassers aus dem Alchemiekessel zu verdrängen, anstatt sich aufzulösen. Er scheint die Nahrung, die man zu sich nimmt, auf magische Weise zu entwässern und zu konservieren, wodurch das Sättigungsgefühl verlängert wird, gleichzeitig aber die Regeneration der Gesundheit beeinträchtigt wird, wenn man nicht hungert.
items.trinkets.saltcube.name=Salzwürfel
items.trinkets.saltcube.stats_desc=Auf der aktuellen Stufe erhöht dieses Schmuckstück die Zeitspanne, bevor du hungrig wirst, um _%1$s%%_, verringert aber gleichzeitig deine Gesundheitsregenerationsrate um _%2$s%%_, es sei denn, der Boden ist verschlossen.
items.trinkets.saltcube.typical_stats_desc=Dieses Schmuckstück verlängert normalerweise die Zeit, bevor du hungrig wirst, um _%1$s%%_, verringert aber gleichzeitig deine Gesundheitsregeneration um _%2$s%%_, es sei denn, der Boden ist verschlossen.
items.trinkets.shardofoblivion$thrownusetracker.desc=Du hast vor Kurzem eine nicht identifizierte Wurfwaffe benutzt, die für kurze Zeit als ein benutztes, nicht identifiziertes Ausrüstungsteil für den Splitter des Vergessens zählt.\n\nVerbleibende Züge: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Unbekannte Wurfwaffe verwendet
items.trinkets.shardofoblivion$wandusetracker.desc=Du hast vor Kurzem einen nicht identifizierten Zauberstab benutzt, der für kurze Zeit als ein gebrauchtes, nicht identifiziertes Ausrüstungsteil für die Scherbe des Vergessens zählt.\n\nVerbleibende Züge: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Unbekannter Zauberstab verwendet
items.trinkets.shardofoblivion.ac_identify=IDENTIFIZIEREN
items.trinkets.shardofoblivion.desc=Nachdem dieses kleine Splitterchen verfluchten Metalls im Alchemiekessel geköchelt hat, besteht es nun aus … nichts? Licht scheint sich um es herum zu krümmen, und es schwebt an Ort und Stelle, solange man es nicht berührt. Das Splitterchen scheint auf magische Weise Kraft aus deiner Unwissenheit zu ziehen, daher ist es wohl am besten, nicht zu viel darüber nachzudenken.
items.trinkets.shardofoblivion.identify=Sie identifizieren den Gegenstand!
items.trinkets.shardofoblivion.identify_not_yet=Dieser Artikel kann noch nicht identifiziert werden.
items.trinkets.shardofoblivion.identify_prompt=Identifizieren Sie einen Gegenstand
items.trinkets.shardofoblivion.identify_ready=Ein Gegenstand kann identifiziert werden: %s. Benutze deine Scherbe des Vergessens, um ihn zu identifizieren.
items.trinkets.shardofoblivion.identify_ready_worn=Eure abgenutzten Gegenstände können nun identifiziert werden. Nutzt euren Splitter des Vergessens, um die Gegenstände zu identifizieren.
items.trinkets.shardofoblivion.name=Splitter des Vergessens
items.trinkets.shardofoblivion.stats_desc=Auf der aktuellen Stufe erhöht dieses Schmuckstück die Wahrscheinlichkeit, dass Gegner Beute fallen lassen, um 20%% für jedes nicht identifizierte Ausrüstungsteil, das du angelegt oder kürzlich benutzt hast, bis maximal _%d Gegenstände_. Der Splitter verhindert außerdem, dass du Ausrüstung identifizieren kannst, kann aber verwendet werden, um Gegenstände, die dafür bereit sind, manuell zu identifizieren.
items.trinkets.shardofoblivion.typical_stats_desc=Dieses Schmuckstück erhöht normalerweise die Wahrscheinlichkeit, dass Gegner Beute fallen lassen, um 20%% für jedes nicht identifizierte Ausrüstungsteil, das du angelegt oder kürzlich benutzt hast, bis maximal _%d Gegenstände_. Der Splitter verhindert außerdem, dass du Ausrüstung identifizieren kannst, kann aber verwendet werden, um Gegenstände, die dafür bereit sind, manuell zu identifizieren.
items.trinkets.thirteenleafclover.desc=Irgendwie hat das Kochen im Alchemiekessel dazu geführt, dass dieses Kleeblatt viele zusätzliche Blätter bekommen hat! Es ist nicht ganz klar, ob dieses Schmuckstück Glück oder Unglück bringt; vielleicht macht es dein Glück ja nur noch chaotischer?
items.trinkets.thirteenleafclover.name=dreizehnblättriges Kleeblatt
items.trinkets.thirteenleafclover.stats_desc=Auf der aktuellen Stufe bewirkt dieses Schmuckstück, dass du in der jeweiligen Situation maximalen Schaden _%1$d%%_ und minimalen Schaden _%2$d%%_ verursachst.
items.trinkets.thirteenleafclover.typical_stats_desc=Normalerweise bewirkt dieses Schmuckstück, dass du in der Regel maximalen Schaden _%1$d%%_ und minimalen Schaden _%2$d%%_ verursachst.
items.trinkets.trapmechanism.desc=Der Kernmechanismus einer der Fallgruben des Dungeons ist sorgfältig in den Boden eingelassen, sodass er getragen werden kann. Er scheint magisch mit dem Dungeon selbst verbunden zu sein, wodurch gefährliches Terrain häufiger auftritt, aber auch die Affinität des Spielers dazu erhöht wird.
items.trinkets.trapmechanism.name=Fallenmechanismus
items.trinkets.trapmechanism.stats_desc=Auf der aktuellen Stufe bewirkt dieses Schmuckstück, dass _%1$d%%_ der nicht thematisch gestalteten Ebenen entweder mit Fallen oder Abgründen gefüllt werden. Zusätzlich werden _%2$d%%_ der versteckten Fallen des Dungeons sichtbar.
items.trinkets.trapmechanism.typical_stats_desc=Dieses Schmuckstück bewirkt normalerweise, dass _%1$d%%_ der nicht thematisch gestalteten Ebenen entweder mit Fallen oder Abgründen gefüllt werden. Zusätzlich werden _%2$d%%_ der versteckten Fallen des Dungeons sichtbar.
items.trinkets.trinket$placeholder.name=Schmuckstück
items.trinkets.trinket.discover_hint=Dieser Gegenstand kann mit etwas Glück als Option verfügbar sein, wenn man durch Alchemie ein Schmuckstück herstellt.
items.trinkets.trinketcatalyst$randomtrinket.desc=Ein Gegenstand in der Nähe steckt in einem Beutel, den du nicht öffnen kannst. Der Alchemieprozess wird den Beutel auflösen, aber du wirst erst wissen, welches Schmuckstück du erhältst, wenn du es tust!
items.trinkets.trinketcatalyst$randomtrinket.name=zufälliges Schmuckstück
items.trinkets.trinketcatalyst.desc=Diese Kugel aus magischem Goldstaub glitzert in der Dunkelheit des Verlieses. Dieser Katalysator kann mit etwas alchemistischer Energie an einem Alchemiekessel verwendet werden, um ein einzigartiges Schmuckstück herzustellen. Schmuckstücke verleihen verschiedene Effekte, die das Verlies oder seine Bewohner leicht verändern. Sie können mit mehr Energie aufgewertet werden, um ihren Effekt zu verstärken, oder abgelegt werden, um den Effekt vollständig zu verlieren.
items.trinkets.trinketcatalyst.name=magischer Katalysator
items.trinkets.trinketcatalyst.window_text=Das Wasser beginnt zu leuchten, sobald man den Katalysator hinzufügt. In der Nähe befinden sich einige Gegenstände, die man mit Energie aufladen kann, um daraus ein magisches Schmuckstück zu machen.
items.trinkets.trinketcatalyst.window_title=ein Schmuckstück herstellen
items.trinkets.vialofblood.desc=Dieses dünne Fläschchen enthält das Blut eines Bewohners des Verlieses; es bewegt sich langsam, wenn man das Fläschchen dreht. Es scheint stärkere Heilwirkungen auf magische Weise zu verstärken, sie aber gleichzeitig zu verzögern.
items.trinkets.vialofblood.name=Ampulle mit Blut
items.trinkets.vialofblood.stats_desc=Auf der aktuellen Stufe erhöht dieses Schmuckstück die Gesamtgesundheit, die ihr durch das Trinken von Heiltränken, Wasserschläuchen oder Heilbrunnen erhaltet, um _%1$s%%_. Allerdings treten diese Heilungseffekte langsamer ein und regenerieren maximal _%2$s_ LP pro Runde (dies skaliert mit der Heldenstufe).
items.trinkets.vialofblood.typical_stats_desc=Dieses Schmuckstück erhöht normalerweise die Gesamtgesundheit, die du durch das Trinken von Heiltränken, Wasserschläuchen oder Heilbrunnen erhältst, um _%1$s%%_. Allerdings treten diese Heilungseffekte langsamer ein und regenerieren maximal _%2$s_ LP pro Runde (dies skaliert mit der Heldenstufe).
items.trinkets.wondrousresin.desc=Dieses schimmernde blaue Harz scheint die Essenz der Magie eines verfluchten Zauberstabs zu enthalten. Die Magie aus dem Alchemiekessel hat es anscheinend etwas stabilisiert, und nun beeinflusst es eure Zauberstäbe.
items.trinkets.wondrousresin.name=Wunderharz
items.trinkets.wondrousresin.stats_desc=Auf der aktuellen Stufe bewirkt dieses Schmuckstück, dass verfluchte Zauberstabeffekte neutral oder positiv werden (%1$s%%_ der Zeit) und dass nicht verfluchte Zauberstäbe einen zusätzlichen neutralen oder positiven Fluchblitz auslösen (%2$s%%_ der Zeit). Die Aufwertung dieses Schmuckstücks erfordert eine größere Menge Energie.
items.trinkets.wondrousresin.typical_stats_desc=Dieses Schmuckstück bewirkt normalerweise, dass verfluchte Zauberstabeffekte neutral oder positiv werden (%1$s%%_ der Zeit) und dass nicht verfluchte Zauberstäbe einen zusätzlichen neutralen oder positiven Fluchblitz auslösen (%2$s%%_ der Zeit). Die Aufwertung dieses Schmuckstücks erfordert eine größere Menge Energie.
items.wands.cursedwand.disguise=Dein Aussehen verändert sich vor deinen Augen!
items.wands.cursedwand.fire=Es riecht verbrannt...
items.wands.cursedwand.grass=Um dich herum sprießt das Gras!
items.wands.cursedwand.gravity=Die Schwerkraft wirkt plötzlich in zufällige Richtungen!
items.wands.cursedwand.gravity_end=Das Gravitationschaos endet.
items.wands.cursedwand.gravity_positive=Plötzlich wirkt die Schwerkraft in zufällige Richtungen, aber das scheint dich nicht zu betreffen.
items.wands.cursedwand.mass_invuln=Strahlendes Licht bricht aus deinem Zauberstab hervor!
items.wands.cursedwand.nothing=Nichts passiert.
items.wands.cursedwand.ondeath=Du wurdest von deinem eigenen %s getötet.
items.wands.cursedwand.petrify=Du erstarrst plötzlich!
items.wands.cursedwand.sinkhole=Der Boden um dich herum gibt nach!
items.wands.cursedwand.sinkhole_positive=Der Boden gibt langsam nach, fühlt sich aber noch fest genug an.
items.wands.cursedwand.supernova=Ein lodernder Energieball beginnt sich zu entwickeln. Vielleicht solltest du rennen!
items.wands.cursedwand.supernova_positive=Ein lodernder Energieball beginnt zu wachsen, aber irgendwie fühlt es sich sicher an.
items.wands.cursedwand.transmogrify_other=Dein Gegenstand verwandelt sich in etwas anderes!
items.wands.cursedwand.transmogrify_wand=Dein Zauberstab verwandelt sich in einen anderen Gegenstand!
items.wands.damagewand.upgrade_stat_name_1=Magischer Schaden
items.wands.wand$placeholder.name=Zauberstab
items.wands.wand.ac_zap=ZAP
items.wands.wand.curse_discover=Dieser %s ist verflucht!
items.wands.wand.cursed=Dieser Zauberstab ist verflucht, wodurch seine Magie chaotisch und unberechenbar ist.
items.wands.wand.fizzles=Dein Zauberstab gibt keinen Ton von sich; er hat wohl nicht genug Ladung.
items.wands.wand.identify=Du kennst deinen Zauberstab nun gut genug, um ihn zu identifizieren.
items.wands.wand.no_magic=Dein Zauberstab versagt; du kannst keine Zauberstäbe benutzen, solange du immun gegen Magie bist.
items.wands.wand.not_cursed=Dieser Zauberstab ist frei von böswilliger Magie.
items.wands.wand.prompt=Wählen Sie einen Ort zum Stromschlag aus.
items.wands.wand.resin_many=Dieser Zauberstab hat durch arkanes Harz _%d Stufen_ gewonnen.
items.wands.wand.resin_one=Dieser Zauberstab hat durch arkanes Harz _1 Stufe_ hinzugewonnen.
items.wands.wand.self_target=Du kannst dich nicht selbst ins Visier nehmen!
items.wands.wandofblastwave.bmage_desc=Wenn der Kampfmagier einen gelähmten Gegner mit einem Stab der Druckwelle angreift, wird die Lähmung verbraucht, um zusätzlichen magischen Schaden zu verursachen. Diese Fähigkeit hat eine kurze Abklingzeit pro Gegner.
items.wands.wandofblastwave.desc=Dieser Zauberstab ist aus einer Art marmoriertem Stein gefertigt, mit Goldverzierungen und einem runden schwarzen Edelstein an der Spitze. Er liegt sehr schwer in der Hand.
items.wands.wandofblastwave.eleblast_desc=Ein Elementarstoß mit einem Stab der Druckwelle verursacht 67% Schaden und schleudert alle Feinde außerhalb des Explosionsbereichs.
items.wands.wandofblastwave.knockback_ondeath=Der Zusammenstoß hat dich getötet...
items.wands.wandofblastwave.name=Zauberstab der Druckwelle
items.wands.wandofblastwave.ondeath=Du hast dich mit deinem eigenen Zauberstab der Druckwelle selbst getötet...
items.wands.wandofblastwave.staff_name=Personal der Druckwelle
items.wands.wandofblastwave.stats_desc=Dieser Zauberstab verschießt einen Bolzen, der an einem Zielort mit voller Wucht detoniert. Die Wucht dieser Explosion verursacht _%1$d-%2$d Schaden_ und ist stark genug, um die meisten Gegner wegzuschleudern.
items.wands.wandofblastwave.typical_stats_desc=Dieser Zauberstab verschießt einen Bolzen, der an einem Zielort mit voller Wucht detoniert. Die Wucht dieser Explosion verursacht typischerweise _%1$d-%2$d Schaden_ und ist stark genug, um die meisten Gegner wegzuschleudern.
items.wands.wandofblastwave.upgrade_stat_name_2=Rückstoß
items.wands.wandofcorrosion.bmage_desc=Wenn der Kampfmagier einen Feind mit einem Korrosionsstab angreift, besteht die Chance, dass der Feind zu einem Schleimwesen wird.
items.wands.wandofcorrosion.desc=Dieser Zauberstab hat einen aschgrauen Korpus, der sich zu einem leuchtend orangefarbenen Edelstein öffnet.
items.wands.wandofcorrosion.eleblast_desc=Ein Elementarstoß mit einem Korrosionsstab belegt Feinde mit Korrosion für 4 Runden, beginnend mit 6 Schadenspunkten.
items.wands.wandofcorrosion.name=Korrosionsstab
items.wands.wandofcorrosion.staff_name=Korrosionsschutz
items.wands.wandofcorrosion.stats_desc=Dieser Zauberstab verschießt einen Bolzen, der an einem anvisierten Ort in einer Wolke hochkorrosiven Gases explodiert. Alles, was sich in dieser Wolke befindet, erleidet mit der Zeit zunehmenden Schaden, beginnend bei _%d Schaden.
items.wands.wandofcorrosion.upgrade_stat_name_1=Korrosionsschäden
items.wands.wandofcorrosion.upgrade_stat_name_2=Gasvolumen
items.wands.wandofcorruption.already_corrupted=Dieser Charakter kann nicht weiter beeinflusst werden.
items.wands.wandofcorruption.bmage_desc=Wenn der Kampfmagier einen Feind mit einem Stab der Verderbnis angreift, besteht die Chance, dass der Feind in Raserei verfällt.
items.wands.wandofcorruption.desc=Dieser Zauberstab verströmt chaotische dunkle Energie, falls das nicht schon an dem kleinen, dekorativen Totenkopf an seiner Spitze deutlich erkennbar wäre.
items.wands.wandofcorruption.eleblast_desc=Ein Elementarstoß mit einem Stab der Verderbnis versetzt Feinde in 5 Runden des Amoklaufs.
items.wands.wandofcorruption.name=Zauberstab der Verderbnis
items.wands.wandofcorruption.staff_name=Korruptionsbefugnisse
items.wands.wandofcorruption.stats_desc=Dieser Zauberstab entfesselt einen Strahl verderblicher Energie, der Feinde schwächt und sie schließlich deinem Willen unterwirft. Feinde können der Verderbnis widerstehen, doch geschwächte Feinde lassen sich viel leichter korrumpieren als gesunde.
items.wands.wandofcorruption.upgrade_stat_name_1=Korrumpierende Macht
items.wands.wandofcorruption.upgrade_stat_name_2=Dauer des Debuffs
items.wands.wandofdisintegration.bmage_desc=Wenn ein Kampfmagier einen Stab der Desintegration führt, erhöht sich seine Angriffsreichweite, als ob er mit einem Projektionszauber belegt wäre.
items.wands.wandofdisintegration.desc=Dieser Zauberstab besteht aus einem massiven, glatten Obsidianblock, an dessen Seite ein tiefviolettes Licht emporläuft, das an der Spitze endet. Er strahlt zerstörerische Energie aus und wartet darauf, sich entfesselnd zu entfesseln.
items.wands.wandofdisintegration.eleblast_desc=Ein Elementarstoß mit einem Stab der Desintegration verursacht 100% Schaden und durchdringt Wände.
items.wands.wandofdisintegration.name=Zauberstab der Auflösung
items.wands.wandofdisintegration.staff_name=Personal des Zerfalls
items.wands.wandofdisintegration.stats_desc=Dieser Zauberstab verschießt einen Strahl, der jedes Hindernis durchdringt und mit jedem Upgrade weiter reicht. Der Strahl verursacht _%1$d-%2$d Schaden_ und zusätzlich Bonusschaden für jeden durchdrungenen Gegner und jede Wand.
items.wands.wandofdisintegration.upgrade_stat_name_2=Maximale Reichweite
items.wands.wandoffireblast.bmage_desc=Wenn der Kampfmagier einen Feind mit seinem Feuerstab angreift, besteht die Chance, dass eine Explosion ausgelöst wird, die Feinden Schaden zufügt und alles Feuer in der Nähe verzehrt! Diese Chance erhöht sich, je mehr Feuer sich in der Nähe des Feindes befindet.
items.wands.wandoffireblast.desc=Dieser Zauberstab ist aus rot lackiertem Holz gefertigt und großzügig mit Blattgold verziert, was ihm ein wahrhaft königliches Aussehen verleiht. An der Spitze knistert und zischt er und ist begierig darauf, seine mächtige Magie zu entfesseln.
items.wands.wandoffireblast.eleblast_desc=Ein Elementarstoß mit einem Feuerstab verursacht 100% Schaden, sprengt Türen auf und setzt Feinde und Gelände in Brand.
items.wands.wandoffireblast.name=Feuerzauberstab
items.wands.wandoffireblast.staff_name=Mitarbeiter von Fireblast
items.wands.wandoffireblast.stats_desc=Dieser Zauberstab verschießt beim Einsatz einen Feuerkegel. Sein nächster Angriff verbraucht _%1$d Ladungen_ und verursacht _%2$d-%3$d Schaden_. Je mehr Ladungen der Zauberstab verbraucht, desto größer und stärker ist der Effekt.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Ladungsschaden
items.wands.wandoffireblast.upgrade_stat_name_2=2 Ladungsschaden
items.wands.wandoffireblast.upgrade_stat_name_3=3 Ladungsschaden
items.wands.wandoffrost.bmage_desc=Wenn der Kampfmagier einen unterkühlten Gegner mit einem Froststab trifft, besteht die Chance, dass dieser augenblicklich einfriert. Diese Chance erhöht sich, je stärker der Gegner unterkühlt ist.
items.wands.wandoffrost.desc=Dieser Zauberstab scheint aus einer Art magischem Eis gefertigt zu sein. Er leuchtet zur abgerundeten Spitze hin immer heller. Er fühlt sich beim Halten sehr kalt an, doch seltsamerweise bleibt die Hand warm.
items.wands.wandoffrost.eleblast_desc=Ein Elementarstoß mit einem Froststab verursacht 100% Schaden, friert Feinde ein und löscht Feuer.
items.wands.wandoffrost.name=Zauberstab des Frostes
items.wands.wandoffrost.staff_name=Mitarbeiter des Frostes
items.wands.wandoffrost.stats_desc=Dieser Zauberstab verschießt eisige Energiestrahlen auf eure Feinde, die _%1$d-%2$d Schaden_ verursachen und sie einfrieren. Der Effekt scheint im Wasser stärker zu sein. Gegner, die bereits eingefroren oder unterkühlt sind, erleiden weniger Schaden durch diesen Zauberstab.
items.wands.wandoffrost.upgrade_stat_name_2=Entspannungsdauer
items.wands.wandoflightning$lightningcharge.desc=Der Kampfmagier ist derzeit mit Energie aufgeladen, was ihm Immunität gegen seinen Blitzstab verleiht und die Reichweite der Blitze, die von ihm ausgehen können, erhöht. \n\n Verbleibende Züge: %s.
items.wands.wandoflightning$lightningcharge.name=Elektrisch geladen
items.wands.wandoflightning.bmage_desc=Wenn der Kampfmagier einen Gegner mit einem Blitzstab angreift, besteht die Chance, dass er sich für 10 Runden elektrisch auflädt. Solange er aufgeladen ist, ist er immun gegen Blitzschaden und kann Blitze weiter schleudern.
items.wands.wandoflightning.desc=Dieser Zauberstab ist aus massivem Metall gefertigt und daher überraschend schwer. Zwei Zinken sind an der Spitze zusammengebogen, und zwischen ihnen überträgt sich ein elektrischer Lichtbogen.
items.wands.wandoflightning.eleblast_desc=Ein Elementarstoß mit einem Blitzstab verursacht 100% Schaden, betäubt Gegner für 5 Runden und elektrisiert Wasser.
items.wands.wandoflightning.name=Blitzzauberstab
items.wands.wandoflightning.ondeath=Du hast dich mit deinem eigenen Blitzzauberstab selbst getötet...
items.wands.wandoflightning.staff_name=Blitzstab
items.wands.wandoflightning.stats_desc=Dieser Zauberstab entfesselt einen mächtigen Blitz, der alles durchschlägt, worauf er gerichtet ist, und dabei _%1$d-%2$d Schaden verursacht. Der Blitz springt auf nahe Charaktere über und breitet sich in Wasser leichter aus. Die Blitze dieses Zauberstabs können dich verletzen, schaden aber deinen Verbündeten nicht.
items.wands.wandoflivingearth$earthguardian.desc=Die Steine deines Zauberstabs aus lebendiger Erde haben sich zu einem schützenden Erdwächter geformt! Dieser steinerne Beschützer greift nahe Feinde an, wodurch diese gezwungen sind, den Wächter anstatt dich anzugreifen. Sobald alle Bedrohungen in der Nähe beseitigt sind, formt sich der Wächter um dich herum neu und kehrt zurück, wenn du deinen Zauberstab das nächste Mal benutzt.
items.wands.wandoflivingearth$earthguardian.discover_hint=Diese Figur kann man mit einem bestimmten Zauberstab finden.
items.wands.wandoflivingearth$earthguardian.name=Erdwächter
items.wands.wandoflivingearth$earthguardian.wand_info=Die Verteidigungskraft des Wächters ist an die Stufe deines Zauberstabs gebunden. Sie blockiert derzeit Schaden in Höhe von _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Magische Felsen umgeben deinen Körper. Bei einem Angriff versuchen sie, dich zu schützen und den erlittenen Schaden um 50 zu reduzieren. Jeder abgewehrte Schaden trägt jedoch etwas von dem Felsen ab. Verbleibende Rüstung: Wenn genügend Felsen um dich herum aufgebaut sind, formt der nächste Zauber deines Zauberstabs aus lebender Erde einen Wächter, der an deiner Seite kämpft. Benötigte Rüstung für den Wächter: 2.
items.wands.wandoflivingearth$rockarmor.desc_many=Dieser irdene Wächter profitiert ebenfalls von der Macht der Vielen. Verbleibende Züge: %d.
items.wands.wandoflivingearth$rockarmor.name=Felspanzerung
items.wands.wandoflivingearth.bmage_desc=Wenn der Kampfmagier einen Feind mit einem Stab aus lebender Erde angreift, wird ein Teil des verursachten Schadens als Felsrüstung zurückgegeben.
items.wands.wandoflivingearth.desc=Dieser Zauberstab ist aus einem seltsamen Gestein gefertigt, das von leuchtend gelben Energiebändern durchzogen ist. Die Steine scheinen sich leicht zu verschieben, wenn man den Zauberstab berührt, als könnten sie die Hand spüren.
items.wands.wandoflivingearth.eleblast_desc=Ein Elementarstoß mit einem Stab aus lebender Erde verursacht 50% Schaden und heilt einen aktiven Erdenwächter für jeden getroffenen Feind.
items.wands.wandoflivingearth.name=Zauberstab aus lebendiger Erde
items.wands.wandoflivingearth.staff_name=Mitarbeiter der lebendigen Erde
items.wands.wandoflivingearth.stats_desc=Dieser Zauberstab schleudert Blitze aus magischem Gestein auf Feinde und verursacht dabei _%1$d-%2$d Schaden._ Die Felsen formen sich anschließend um den Benutzer herum neu und verleihen ihm Rüstung proportional zum verursachten Schaden. Bei ausreichend aufgebauter Rüstung entsteht beim nächsten Einsatz des Zauberstabs ein Felswächter.
items.wands.wandoflivingearth.upgrade_stat_name_2=Maximale HP des Wächters
items.wands.wandoflivingearth.upgrade_stat_name_3=Wächterblockierung
items.wands.wandofmagicmissile$magiccharge.desc=Dein Zauberstab mit magischen Geschossen hat deine Zauberstäbe aufgeladen und die Stärke des nächsten Zaubers erhöht. Deine Zauberstäbe sind nun verstärkt auf: +%d. \n\n Verbleibende Zauberladungen: %s.
items.wands.wandofmagicmissile$magiccharge.name=magische Ladung
items.wands.wandofmagicmissile.bmage_desc=Wenn der Kampfmagier einen Feind mit einem Stab des Magischen Geschosses angreift, werden zusätzlich zu seinem Stab alle seine Zauberstäbe aufgeladen.
items.wands.wandofmagicmissile.desc=Dieser recht schlichte Zauberstab verschießt Geschosse reiner magischer Energie. Obwohl der Zauberstab selbst keine Spezialeffekte besitzt, verfügt er über mehr Ladungen und kann, nach einem Upgrade, andere Zauberstäbe kurzzeitig verstärken.
items.wands.wandofmagicmissile.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.wands.wandofmagicmissile.eleblast_desc=Ein Elementarstoß mit einem Stab aus magischen Geschossen verursacht 50% Schaden und gewährt dem Magier 15 Runden Aufladezeit.
items.wands.wandofmagicmissile.name=Zauberstab des magischen Geschosses
items.wands.wandofmagicmissile.staff_name=Stab der magischen Rakete
items.wands.wandofmagicmissile.stats_desc=Jeder Blitz aus diesem Zauberstab verursacht _%1$d-%2$d Schaden_ und verstärkt kurzzeitig andere Zauberstäbe, wenn er aufgerüstet wird.
items.wands.wandofprismaticlight.bmage_desc=Wenn der Kampfmagier einen Feind mit einem Stab aus prismatischem Licht angreift, wird dieser für eine Dauer, die mit der Stufe des Stabes skaliert, handlungsunfähig gemacht.
items.wands.wandofprismaticlight.desc=Dieser Zauberstab besteht aus einem massiven Stück durchscheinenden Kristalls, wie ein langes Stück glattes Glas. Kleine, farbige Lichtpunkte tanzen um die Spitze des Zauberstabs und warten darauf, hervorzubrechen.
items.wands.wandofprismaticlight.eleblast_desc=Ein Elementarstoß mit einem Stab aus prismatischem Licht verursacht 67% Schaden, deckt das gesamte Terrain im Wirkungsbereich auf und blendet Feinde für 5 Runden.
items.wands.wandofprismaticlight.name=Zauberstab aus prismatischem Licht
items.wands.wandofprismaticlight.staff_name=Stab aus prismatischem Licht
items.wands.wandofprismaticlight.stats_desc=Dieser Zauberstab verschießt Lichtstrahlen, die die Dunkelheit des Verlieses durchdringen und verborgene Bereiche und Fallen enthüllen. Der Strahl kann Feinde blenden und verursacht _%1$d-%2$d Schaden._ Dämonische und untote Gegner verbrennen im hellen Licht des Zauberstabs und erleiden zusätzlichen Schaden.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind Chance
items.wands.wandofprismaticlight.upgrade_stat_name_3=Lichtdauer
items.wands.wandofregrowth$dewcatcher.desc=Taufänger sind wundersame Pflanzen, die sich mit magischem Tau füllen. Sie versuchen, sich als Gras zu tarnen, um nicht aufzufallen, aber ihre angesammelten Tautropfen verraten sie.
items.wands.wandofregrowth$dewcatcher.discover_hint=Diese Pflanze kann man mit einem speziellen Zauberstab finden.
items.wands.wandofregrowth$dewcatcher.name=Taufänger
items.wands.wandofregrowth$lotus.desc=Die goldene Lotusblume ist eine mystische Pflanze, die nur mit einem mächtigen Zauberstab der Regeneration herbeigerufen werden kann. Ihre Aura verstärkt alle Pflanzen und deren Wirkungen, doch sie verbraucht ihre Energie und stirbt nach kurzer Zeit.
items.wands.wandofregrowth$lotus.discover_hint=Diese Pflanze kann man mit einem bestimmten Zauberstab finden, nachdem man ihn mehrmals aufgerüstet hat.
items.wands.wandofregrowth$lotus.name=Goldener Lotus
items.wands.wandofregrowth$lotus.wand_info=Diese Lotusblume wurde durch einen Zauberstab der Wiedergeburt erzeugt. Alle Pflanzen in ihrem Wirkungsbereich werden sofort aktiviert, wenn sie auf einem Charakter gepflanzt werden. Pflanzen haben außerdem eine Chance von 1, 2, 3, 4, 5, 6, 6, 7, 8, 8, 9, 10 ...
items.wands.wandofregrowth$seedpod.desc=Samenkapseln sind magische Pflanzen, die Samen anderer Pflanzenarten produzieren, anstatt eigene Samen zu bilden. Trotz ihrer fehlenden eigenen Samen gelingt es ihnen auf wundersame Weise, sich zu verbreiten.
items.wands.wandofregrowth$seedpod.discover_hint=Diese Pflanze kann man mit einem speziellen Zauberstab finden.
items.wands.wandofregrowth$seedpod.name=Samenkapsel
items.wands.wandofregrowth.bmage_desc=Wenn der Kampfmagier einen Feind mit einem Stab des Nachwachsens angreift und beide auf Gras stehen, erhält er Kräuterheilung im Verhältnis zum verursachten Schaden.
items.wands.wandofregrowth.degradation=Nach weiteren _%d Aufladungen_ produziert dieser Zauberstab keine Pflanzen und kein frisches Gras mehr. Dieses Limit kann durch Levelaufstiege oder Verbesserungen des Zauberstabs erhöht werden.
items.wands.wandofregrowth.desc=Dieser Zauberstab besteht aus einem dünnen Schaft aus kunstvoll geschnitztem Holz. Er wirkt erstaunlich lebendig und strahlend grün wie der Kern eines jungen Baumes. „Wenn Leben endet, beginnt immer neues Leben zu wachsen … Der ewige Kreislauf bleibt bestehen!“
items.wands.wandofregrowth.eleblast_desc=Ein Elementarstoß mit einem Stab des Nachwachsens fesselt Feinde und lässt zufällig Gras über dem Wirkungsbereich wachsen.
items.wands.wandofregrowth.name=Zauberstab des Wiederwachstums
items.wands.wandofregrowth.staff_name=Mitarbeiter des Wiederaufbaus
items.wands.wandofregrowth.stats_desc=Bei Benutzung entfesselt dieser Zauberstab magische Wachstumsenergie in einem Kegel, wodurch Gras, Wurzeln und seltene Pflanzen zum Leben erwachen. Der nächste Zauber verbraucht _%1$d Ladungen_. Je mehr Ladungen der Zauberstab verbraucht, desto größer und stärker ist der Effekt.
items.wands.wandofregrowth.upgrade_stat_name_1=Gras pro Gebühr
items.wands.wandofregrowth.upgrade_stat_name_2=Gesamtgrasgrenze
items.wands.wandoftransfusion.bmage_desc=Wenn der Kampfmagier einen verzauberten Feind mit einem Transfusionsstab angreift, erhält er einen Schild und sein nächster Blitzschlag mit dem Stab kostet ihn keine Gesundheit.
items.wands.wandoftransfusion.charged=Deine Mitarbeiter sind mit der Lebensenergie deines Feindes aufgeladen!
items.wands.wandoftransfusion.desc=Der Zauberstab ist zwar recht schlicht geformt, besticht aber durch seinen magentafarbenen Farbton und den pechschwarzen Edelstein an der Spitze.
items.wands.wandoftransfusion.eleblast_desc=Ein Elementarstoß mit einem Transfusionsstab bezaubert Feinde, heilt Verbündete und fügt untoten Feinden 100% Schaden zu.
items.wands.wandoftransfusion.name=Transfusionsstab
items.wands.wandoftransfusion.ondeath=Du hast dich mit deinem eigenen Transfusionsstab selbst getötet...
items.wands.wandoftransfusion.staff_name=Personal der Bluttransfusion
items.wands.wandoftransfusion.stats_desc=Bei Anwendung auf Verbündete oder verzauberte Feinde entzieht dieser Zauberstab dem Benutzer _%1$d Lebenspunkte_, um den Verbündeten um _%2$d Lebenspunkte_ zu heilen oder zu schützen. Bei Anwendung auf Feinde verzaubert der Zauberstab diese kurzzeitig und gewährt dem Benutzer _%3$d Schutz_. Feindliche Untote erleiden _%4$d-%5$d Schaden_, anstatt verzaubert zu werden.
items.wands.wandoftransfusion.upgrade_stat_name_1=Verbündetenheilung
items.wands.wandoftransfusion.upgrade_stat_name_2=Selbstabschirmung
items.wands.wandoftransfusion.upgrade_stat_name_3=Schaden durch Untote
items.wands.wandofwarding$ward.desc_1=Dieser einfache Schutzzauber belegt automatisch jeden Gegner in seinem Sichtfeld mit einem Blitzschlag und verursacht _%1$d-%2$d Schaden._\n\n Durch das Aktivieren dieses Schutzzaubers mit deinem Schutzzauberstab wird er verbessert._\n\n Dieser Schutzzauber kann nur einmal aktiviert werden, bevor er sich auflöst._\n\n Dein Schutzzauberstab verbraucht _%3$d Energie_, um diesen Schutzzauber aufrechtzuerhalten.
items.wands.wandofwarding$ward.desc_2=Dieser verbesserte Schutzzauber hat ein komplexeres Muster und kann mehrfach angreifen. Jeder Blitzschlag dieses Schutzzaubers verursacht _%1$d-%2$d Schaden._\n\n Durch das Angreifen dieses Schutzzaubers mit deinem Schutzzauberstab wird er verbessert._\n\n Dieser Schutzzauber kann dreimal blitzen, bevor er sich auflöst._\n\n Dein Schutzzauberstab verbraucht _%3$d Energie_, um diesen Schutzzauber aufrechtzuerhalten.
items.wands.wandofwarding$ward.desc_3=Dieser vollständig aufgerüstete Schutzzauber kann häufiger angreifen als seine Vorgänger. Jeder Blitzschlag dieses Schutzzaubers verursacht _%1$d-%2$d Schaden._\n\n Durch das Angreifen dieses Schutzzaubers mit deinem Schutzzauberstab wird er verbessert._\n\n Dieser Schutzzauber kann fünf Blitzschläge ausführen, bevor er sich auflöst._\n\n Dein Schutzzauberstab verbraucht _%3$d Energie_, um diesen Schutzzauber aufrechtzuerhalten.
items.wands.wandofwarding$ward.desc_4=Diese kleinere Wache hat dieselbe Feuerkraft wie eine größere, verfügt aber über Lebenspunkte anstelle einer festen Anzahl an Ladungen. Sie ähnelt dem Edelstein an der Spitze deines Schutzzauberstabs. Jeder Blitz dieser Wache verursacht _%1$d-%2$d Schaden._\n\n Durch das Angreifen dieser Wache mit deinem Schutzzauberstab wird sie verbessert und geheilt._\n\n Diese Wache verbraucht jedes Mal etwas Lebenspunkte, wenn sie einen Gegner trifft, kann aber durch den Einsatz deines Schutzzauberstabs geheilt werden._\n\n Dein Schutzzauberstab verbraucht _%3$d Energie_, um diese Wache aufrechtzuerhalten.
items.wands.wandofwarding$ward.desc_5=Diese verbesserte Wache ist größer und widerstandsfähiger als eine schwächere Wache. Jeder Blitzschlag dieser Wache verursacht _%1$d-%2$d Schaden._\n\nWenn du diese Wache mit deinem Schutzzauberstab angreifst, wird sie verbessert und geheilt._\n\nDiese Wache verliert jedes Mal etwas Gesundheit, wenn sie einen Gegner angreift, kann aber durch den Einsatz deines Schutzzauberstabs geheilt werden._\n\nDein Schutzzauberstab verbraucht _%3$d Energie_, um diese Wache aufrechtzuerhalten.
items.wands.wandofwarding$ward.desc_6=Diese vollständig aufgerüstete Wache ist deutlich widerstandsfähiger als ihre Vorgänger. Jeder Blitzschlag dieser Wache verursacht _%1$d-%2$d Schaden._\n\nWenn du diese Wache mit deinem Schutzzauberstab triffst, wird sie geheilt._\n\nJedes Mal, wenn sie einen Gegner trifft, verliert diese Wache etwas Gesundheit, die jedoch durch den Einsatz deines Schutzzauberstabs wiederhergestellt werden kann._\n\nDein Schutzzauberstab verbraucht _%3$d Energie_, um diese Wache aufrechtzuerhalten.
items.wands.wandofwarding$ward.desc_generic_sentry=Diese Wache hat dieselbe Feuerkraft wie ein Schutzzauber, verfügt aber über Lebenspunkte anstelle einer festen Anzahl an Ladungen. Sie ähnelt dem Edelstein an der Spitze deines Schutzzauberstabs. Wenn du diese Wache mit deinem Schutzzauberstab angreifst, wird sie verbessert und geheilt. Diese Wache verliert jedes Mal Lebenspunkte, wenn sie einen Gegner angreift, kann aber durch den Einsatz deines Schutzzauberstabs geheilt werden.
items.wands.wandofwarding$ward.desc_generic_ward=Dieser Schutzzauber belegt automatisch jeden Gegner, der in seinen Sichtbereich gelangt. Wenn du diesen Schutzzauber mit deinem Schutzzauberstab aktivierst, wird er verbessert. Schutzzauber haben eine begrenzte Anzahl an Aktivierungen, bevor sie sich auflösen.
items.wands.wandofwarding$ward.discover_hint=Diese Figur kann man mit einem bestimmten Zauberstab finden.
items.wands.wandofwarding$ward.dismiss_body=Du kannst diesen Schutzzauber aufheben, wenn dein Zauberstab ihn nicht länger aufrechterhalten soll. Dadurch wird der Schutzzauber sofort zerstört. \n\nSchutzzauber aufheben?
items.wands.wandofwarding$ward.dismiss_cancel=NEIN
items.wands.wandofwarding$ward.dismiss_confirm=Ja
items.wands.wandofwarding$ward.dismiss_title=Soll diese Station entlassen werden?
items.wands.wandofwarding$ward.name_1=kleinerer Bezirk
items.wands.wandofwarding$ward.name_2=Station
items.wands.wandofwarding$ward.name_3=größerer Bezirk
items.wands.wandofwarding$ward.name_4=kleinerer Wächter
items.wands.wandofwarding$ward.name_5=Posten
items.wands.wandofwarding$ward.name_6=größerer Wächter
items.wands.wandofwarding.bad_location=Dort kann man keinen Schutzzauber platzieren.
items.wands.wandofwarding.bmage_desc=Wenn der Kampfmagier einen Feind mit einem Schutzstab angreift, besteht die Chance, dass alle aktiven Schutzzauber und Wachen geheilt werden.
items.wands.wandofwarding.desc=Dieser kurze Metallstab hat einen leuchtend violetten Edelstein, der über seiner Spitze schwebt.
items.wands.wandofwarding.eleblast_desc=Ein Elementarstoß mit einem Schutzstab heilt alle Schutzzauber und Wächter im Wirkungsbereich.
items.wands.wandofwarding.name=Zauberstab der Abwehr
items.wands.wandofwarding.no_more_wards=Dein Zauberstab kann keine weiteren Schutzzauber mehr aufrechterhalten.
items.wands.wandofwarding.staff_name=Stationspersonal
items.wands.wandofwarding.stats_desc=Anstatt Gegner direkt zu verletzen, beschwört dieser Zauberstab stationäre Schutzzauber und Wächter. Schutzzauber können überall beschworen werden, sogar durch Wände hindurch, sofern Sicht vorhanden ist. Dieser Zauberstab kann Schutzzauber im Wert von _%d Energie_ gleichzeitig aufrechterhalten.
items.wands.wandofwarding.upgrade_stat_name_1=Schutzschaden
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.waterskin.ac_drink=TRINKEN
items.waterskin.collected=Du sammelst den Tautropfen in deinem Wasserschlauch.
items.waterskin.desc=Ein Behälter für Flüssigkeiten, gefertigt aus Leder und Schnur und mit einem Korken verschlossen.
items.waterskin.desc_full=Der volle Wasserschlauch scheint Energie auszustrahlen, vielleicht kann man ihn verwenden, um einen anderen Überlebensgegenstand zu segnen?
items.waterskin.desc_heal=Der Wasserschlauch dient derzeit zur Aufbewahrung von Heilwasser. Je voller der Wasserschlauch ist, desto stärker ist die sofortige Heilung beim Trinken. Sie trinken nur so viel, wie Sie benötigen.
items.waterskin.desc_water=Im Moment enthält der Wasserschlauch nur einfaches Trinkwasser. Sicherlich gibt es im Verlies etwas, das man stattdessen darin aufbewahren könnte.
items.waterskin.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.waterskin.empty=Dein Wasserschlauch ist leer!
items.waterskin.full=Dein Wasserschlauch ist voll!
items.waterskin.name=Wasserschlauch
items.weapon.curses.annoying.desc=Nervige Waffen können sprechen, sind aber etwas zu energisch. Sie lenken oft ungewollt die Aufmerksamkeit auf dich.
items.weapon.curses.annoying.elestrike_desc=Ein Elementarschlag mit einem lästigen Fluch hat eine 20%ige Chance, jeden Gegner in Reichweite für 6 Runden in Raserei zu versetzen.
items.weapon.curses.annoying.msg_1=Oh, kämpfen wir etwa gegen etwas?!
items.weapon.curses.annoying.msg_10=Gut getroffen!
items.weapon.curses.annoying.msg_11=Ich wollte keine Waffe sein, ich wollte die Axt eines Holzfällers sein.
items.weapon.curses.annoying.msg_12=Denken Sie daran: Übermäßiges Selbstvertrauen ist ein schleichender und heimtückischer Killer.
items.weapon.curses.annoying.msg_13=ALLE IHRE BASISSTÄTTEN GEHÖREN UNS!
items.weapon.curses.annoying.msg_2=JA, HOLT SIE EUCH!
items.weapon.curses.annoying.msg_3=HEY, HÖRT ZU!
items.weapon.curses.annoying.msg_4=SIND WIR SCHON AM BOSS ANGEKOMMEN!?
items.weapon.curses.annoying.msg_5=AUA, SCHWING MICH NICHT SO HART!
items.weapon.curses.annoying.msg_6=STIRB, INSEKT!
items.weapon.curses.annoying.msg_7=JAAA ...
items.weapon.curses.annoying.msg_8=KÖNNEN WIR EINE PAUSE MACHEN!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.name=nerviges %s
items.weapon.curses.dazzling.desc=Blendende Waffen blitzen manchmal mit blendendem Licht auf und blenden alles, was sie sehen kann.
items.weapon.curses.dazzling.elestrike_desc=Ein Elementarschlag mit einem blendenden Fluch hat eine 50%ige Chance, jeden Gegner in Reichweite für 6 Runden zu blenden.
items.weapon.curses.dazzling.name=blendend %s
items.weapon.curses.displacing.desc=Die Waffen, die Gegner verschieben, sind mit chaotischer Teleportationsmagie durchdrungen und besitzen die Fähigkeit, Feinde zufällig über den Boden zu teleportieren.
items.weapon.curses.displacing.elestrike_desc=Ein Elementarschlag mit einem Verschiebungsfluch hat eine 50%ige Chance, jeden Gegner in Reichweite zu teleportieren.
items.weapon.curses.displacing.name=verdrängt %s
items.weapon.curses.explosive.desc=Explosive Waffen bauen stetig Energie auf und explodieren dann, wobei alles in der Nähe beschädigt wird.
items.weapon.curses.explosive.desc_cool=Ihre Waffe fühlt sich momentan kalt an.
items.weapon.curses.explosive.desc_hot=Deine Waffe ist heiß! Sie wird gleich explodieren!
items.weapon.curses.explosive.desc_warm=Ihre Waffe lädt sich auf und wird warm...
items.weapon.curses.explosive.elestrike_desc=Ein Elementarschlag mit einem explosiven Fluch hat eine 50%ige Chance, bei einem zufälligen Gegner in Reichweite eine Explosion auszulösen.
items.weapon.curses.explosive.hot=Heiß!
items.weapon.curses.explosive.name=Explosivstoff %s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.friendly.desc=Freundliche Waffen eignen sich am besten für Pazifisten, da sie gelegentlich Magie auslösen, die einen Kampf unmöglich macht.
items.weapon.curses.friendly.elestrike_desc=Ein Elementarschlag mit einem freundlichen Fluch hat eine 50%ige Chance, jeden Gegner in Reichweite für 6 Runden zu bezaubern.
items.weapon.curses.friendly.name=freundlich %s
items.weapon.curses.polarized.desc=Eine polarisierte Waffe wird von Magie beeinflusst, die bewirkt, dass ihr Angriff entweder 50 % mehr Schaden verursacht oder gar keinen Schaden.
items.weapon.curses.polarized.elestrike_desc=Ein Elementarschlag mit polarisiertem Fluch hat eine 50%ige Chance, jedem Gegner in Reichweite 24-36 Schadenspunkte zuzufügen.
items.weapon.curses.polarized.name=polarisiert %s
items.weapon.curses.sacrificial.desc=Opferwaffen fordern vom Träger Blut, um Feinde anzugreifen. Je gesünder der Träger ist, desto mehr Blut benötigt der Fluch.
items.weapon.curses.sacrificial.elestrike_desc=Ein Elementarschlag mit einem Opferfluch bewirkt, dass der Held und jeder Feind in Reichweite 12 HP bluten.
items.weapon.curses.sacrificial.name=Opfer %s
items.weapon.curses.wayward$waywardbuff.desc=Die Magie deiner unkontrollierten Waffe wurde aktiviert, wodurch sie für kurze Zeit extrem ungenau ist. Beachte, dass dies keine Angriffe betrifft, die garantiert treffen, wie z. B. Überraschungsangriffe. Ein erfolgreicher Angriff mit der unkontrollierten Waffe hebt diesen Effekt sofort auf. \n\n Verbleibende Züge: %s.
items.weapon.curses.wayward$waywardbuff.name=eigensinnig
items.weapon.curses.wayward.desc=Abtrünnige Waffen werden mitunter extrem ungenau. Dieser Effekt hält nach seiner Aktivierung kurz an, kann aber durch einen Treffer mit der abtrünnigen Waffe aufgehoben werden.
items.weapon.curses.wayward.elestrike_desc=Ein Elementarschlag mit einem unberechenbaren Fluch hat eine 50%ige Chance, jeden Feind in Reichweite für 6 Runden zu verhexen.
items.weapon.curses.wayward.name=abtrünnig %s
items.weapon.enchantments.blazing.desc=Dieser Zauber bewirkt, dass Flammen aus einer Waffe hervorschießen, Feinde entzünden und bereits brennenden Feinden zusätzlichen Schaden zufügen.
items.weapon.enchantments.blazing.elestrike_desc=Ein Elementarschlag mit einer lodernden Verzauberung breitet Feuer auf alle Felder in Reichweite aus, das 8 Runden anhält.
items.weapon.enchantments.blazing.name=flammendes %s
items.weapon.enchantments.blocking$blockbuff.desc=Die Blockverzauberung deiner Waffe hat dir einen kurzen Schub für deine Verteidigungskraft verliehen!\n\nVerbleibender Schild: %d\n\nVerbleibende Züge: %s.
items.weapon.enchantments.blocking$blockbuff.name=Blockierung
items.weapon.enchantments.blocking.desc=Blockende Waffen bieten nach einem Angriff die Chance, dich kurzzeitig zu schützen.
items.weapon.enchantments.blocking.elestrike_desc=Ein Elementarschlag mit Blockzauber gewährt dem Duellanten zusätzlich 6 Schildpunkte für jeden Gegner in Reichweite.
items.weapon.enchantments.blocking.name=%s wird blockiert
items.weapon.enchantments.blooming.desc=Blühende Waffen enthalten Magie, die bewirkt, dass Vegetation auf oder um die Getroffenen herum sprießt.
items.weapon.enchantments.blooming.elestrike_desc=Ein Elementarschlag mit einem Blühzauber breitet Gras auf bis zu 8 Feldern im Umkreis aus und hält alle Feinde im Umkreis für 6 Runden fest.
items.weapon.enchantments.blooming.name=blühendes %s
items.weapon.enchantments.chilling.desc=Gegner, die von diesem Zauber getroffen werden, sind wie gelähmt, was ihre Bewegungen und Angriffe verlangsamt.
items.weapon.enchantments.chilling.elestrike_desc=Ein Elementarschlag mit einem eisigen Zauber verbreitet eisige Luft auf alle Felder in Reichweite, die 8 Runden anhält.
items.weapon.enchantments.chilling.name=chilling %s
items.weapon.enchantments.corrupting.desc=Dieser mächtige Zauber verleiht die Fähigkeit, Feinde deinem Willen zu unterwerfen. Wird ein Feind mit dieser Waffe getötet, besteht die Chance, dass er verdorben wird, anstatt zu sterben.
items.weapon.enchantments.corrupting.elestrike_desc=Ein Elementarschlag mit einer verderblichen Verzauberung hat eine Chance von 5-25% (basierend auf fehlenden HP), jeden Gegner in Reichweite zu verderben, außer dem primären Ziel.
items.weapon.enchantments.corrupting.name=%s wird beschädigt
items.weapon.enchantments.elastic.desc=Elastische Waffen können Gegner über kurze Distanzen zurückschleudern.
items.weapon.enchantments.elastic.elestrike_desc=Ein Elementarschlag mit elastischer Verzauberung stößt alle Feinde in Reichweite 5 Felder zurück.
items.weapon.enchantments.elastic.name=elastisches %s
items.weapon.enchantments.grim.desc=Dieser mächtige Zauber besitzt die Kraft, einen Feind augenblicklich zu vernichten. Je schwächer der Feind ist, desto wahrscheinlicher tritt dieser Effekt ein.
items.weapon.enchantments.grim.elestrike_desc=Ein Elementarschlag mit einer düsteren Verzauberung hat eine 6-30%ige Chance (basierend auf den fehlenden HP), jeden Gegner in Reichweite zu töten, außer dem primären Ziel.
items.weapon.enchantments.grim.name=grim %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Deine Waffe hat die überschüssige Kraft eines vorherigen tödlichen Schlags gespeichert und wendet sie als Bonusschaden auf deinen nächsten Angriff an. Die Energie lässt jedoch mit der Zeit langsam nach.
items.weapon.enchantments.kinetic$conserveddamage.name=erhaltene Schäden
items.weapon.enchantments.kinetic.desc=Wird ein Feind mit einer kinetischen Waffe getötet, wird die überschüssige Energie in der Waffe gespeichert und für den nächsten erfolgreichen Angriff genutzt.
items.weapon.enchantments.kinetic.elestrike_desc=Ein Elementarschlag mit kinetischer Verzauberung fügt jedem Gegner in Reichweite, außer dem primären Ziel, 40 % des gespeicherten Schadens zu.
items.weapon.enchantments.kinetic.name=kinetisches %s
items.weapon.enchantments.lucky.desc=Gegner, die mit einer Glückswaffe getötet werden, haben die Chance, zusätzliche Beute fallen zu lassen.
items.weapon.enchantments.lucky.elestrike_desc=Ein Elementarschlag mit Glücksverzauberung hat eine Chance von 12,5 %, Beute unter jedem Gegner in Reichweite erscheinen zu lassen. Dieser Effekt kann nur einmal pro Gegner ausgelöst werden.
items.weapon.enchantments.lucky.name=Glücks-%s
items.weapon.enchantments.projecting.desc=Durch diese Verzauberung erhalten Nahkampfwaffen eine größere Reichweite. Fernkampfwaffen durchdringen Wände, wenn sie auf nahe Ziele gerichtet sind.
items.weapon.enchantments.projecting.elestrike_desc=Ein Elementarschlag mit einer Projektionsverzauberung verursacht 30% Schaden an jedem Gegner in Reichweite, außer am primären Ziel.
items.weapon.enchantments.projecting.name=projiziert %s
items.weapon.enchantments.shocking.desc=Von einer Schockwaffe gehen elektrische Blitze aus, die allen nahen Feinden zusätzlichen Schaden zufügen.
items.weapon.enchantments.shocking.elestrike_desc=Ein Elementarschlag mit einer schockierenden Verzauberung verbreitet Elektrizität auf alle Felder in Reichweite, die 8 Runden anhält.
items.weapon.enchantments.shocking.name=schockierend %s
items.weapon.enchantments.unstable.desc=Dieser Zauber strahlt chaotische Energie aus und wirkt bei jedem Treffer als ein anderer Zauber.
items.weapon.enchantments.unstable.elestrike_desc=Ein Elementarschlag mit einer instabilen Verzauberung belegt jeden Gegner in Reichweite mit einem zufälligen Verzauberungseffekt, außer dem primären Ziel.
items.weapon.enchantments.unstable.name=instabiles %s
items.weapon.enchantments.vampiric.desc=Dieser mächtige Zauber entzieht Feinden mit jedem Treffer Lebenskraft und leitet sie zurück zum Träger. Je niedriger die Gesundheit des Trägers ist, desto stärker ist der Effekt.
items.weapon.enchantments.vampiric.elestrike_desc=Ein Elementarschlag mit vampirischer Verzauberung heilt den Duellanten um 2,5 HP für jeden Gegner in Reichweite.
items.weapon.enchantments.vampiric.name=vampirisch %s
items.weapon.melee.assassinsblade.ability_desc=Die Duellantin kann sich mit einer Assassinenklinge anschleichen. Diese Fähigkeit erlaubt es ihr, sich augenblicklich bis zu 3 Felder weit wegzuteleportieren und gewährt ihr _%d Runden Unsichtbarkeit._
items.weapon.melee.assassinsblade.ability_name=schleichen
items.weapon.melee.assassinsblade.desc=Eine kleine, wellenförmige Klinge aus Obsidian, die trotz ihres geringen Gewichts schwer zu handhaben ist, aber tödlich sein kann, wenn sie das richtige Ziel trifft.
items.weapon.melee.assassinsblade.name=Assassinenklinge
items.weapon.melee.assassinsblade.stats_desc=Diese Waffe ist gegen ahnungslose Feinde wirksamer.
items.weapon.melee.assassinsblade.typical_ability_desc=Die Duellantin kann sich mit einer Assassinenklinge anschleichen. Diese Fähigkeit erlaubt es ihr, sich augenblicklich bis zu 3 Felder weit wegzuteleportieren und gewährt ihr in der Regel _%d Runden Unsichtbarkeit._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Fähigkeitsdauer
items.weapon.melee.battleaxe.ability_desc=Der Duellant kann mit einer Streitaxt einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.battleaxe.ability_name=schwerer Schlag
items.weapon.melee.battleaxe.desc=Der gewaltige Stahlkopf dieser Streitaxt verleiht jedem weiten Hieb beträchtliches Gewicht.
items.weapon.melee.battleaxe.name=Streitaxt
items.weapon.melee.battleaxe.stats_desc=Das ist eine ziemlich präzise Waffe.
items.weapon.melee.battleaxe.typical_ability_desc=Der Duellant kann mit einer Streitaxt einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht typischerweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.crossbow$chargedshot.desc=Die Duellantin konzentriert ihre Kraft auf ihre Armbrust. Ihr nächster Angriff trifft garantiert und löst einen von drei Effekten aus: \n – Nahkampfangriffe stoßen Gegner einige Felder weit weg. \n – Pfeile ohne Spitze verursachen Bonusschaden. \n – Pfeile mit Spitze erhalten zusätzliche Anwendungen und wirken in einem 7x7-Feld. Positive Pfeileffekte wirken nur auf Verbündete, negative Effekte nur auf Gegner. Die Duellantin kann diese Fähigkeit nicht nutzen, um positive Pfeileffekte auf sich selbst anzuwenden.
items.weapon.melee.crossbow$chargedshot.name=angeklagt
items.weapon.melee.crossbow.ability_desc=Die Duellantin kann ihre Armbrust _aufladen_, wodurch ihr nächster normaler Angriff damit immer trifft und einen von drei Effekten auslöst: Nahkampfangriffe stoßen Gegner weg, ungespannte Pfeile verursachen _+%1$d Schaden_, und gespannte Pfeile lösen ihren Effekt in einem 7x7-Bereich aus und halten für _%2$d weitere Anwendungen_ an.
items.weapon.melee.crossbow.ability_name=geladener Schuss
items.weapon.melee.crossbow.desc=Eine recht aufwendige Waffe, die Bolzen mit außergewöhnlicher Geschwindigkeit verschießt. Obwohl sie nicht dafür konzipiert wurde, eignet sich diese Armbrust aufgrund ihres Gewichts und ihrer robusten Bauweise auch gut als Nahkampfwaffe.
items.weapon.melee.crossbow.name=Armbrust
items.weapon.melee.crossbow.stats_desc=Diese Waffe verstärkt Wurfpfeile, sodass sie beim Ausrüsten _%1$d-%2$d Schaden_ verursachen, und verleiht ihnen sogar ihre Verzauberung.
items.weapon.melee.crossbow.typical_ability_desc=Die Duellantin kann ihre Armbrust aufladen, wodurch ihr nächster normaler Angriff damit immer trifft und einen von drei Effekten auslöst: Nahkampfangriffe stoßen Gegner weg, ungespannte Pfeile verursachen in der Regel +%1$d Schaden, und gespannte Pfeile wirken in einem 7x7-Bereich und halten in der Regel für %2$d weitere Anwendungen an.
items.weapon.melee.crossbow.typical_stats_desc=Normalerweise verstärkt diese Waffe geworfene Pfeile, sodass sie beim Ausrüsten _%1$d-%2$d Schaden_ verursachen, und verleiht ihnen sogar ihre Verzauberung.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Fähigkeitsverstärkung
items.weapon.melee.cudgel.ability_desc=Der Duellant kann mit einem Knüppel einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.cudgel.ability_name=schwerer Schlag
items.weapon.melee.cudgel.desc=Eine kleine Messingkeule, die eher als Selbstverteidigungsmittel für Adlige denn als Waffe für Abenteurer diente.
items.weapon.melee.cudgel.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.melee.cudgel.name=Knüppel
items.weapon.melee.cudgel.stats_desc=Das ist eine ziemlich präzise Waffe.
items.weapon.melee.cudgel.typical_ability_desc=Der Duellant kann mit einem Knüppel einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht typischerweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.dagger.ability_desc=Die Duellantin kann sich mit einem Dolch in der Hand anschleichen. Diese Fähigkeit erlaubt es ihr, sich augenblicklich bis zu 5 Felder weit wegzuteleportieren und gewährt ihr _%d Runden Unsichtbarkeit._
items.weapon.melee.dagger.ability_name=schleichen
items.weapon.melee.dagger.desc=Ein einfacher Eisendolch mit abgenutztem Holzgriff.
items.weapon.melee.dagger.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.melee.dagger.name=Dolch
items.weapon.melee.dagger.stats_desc=Diese Waffe ist gegen ahnungslose Feinde wirksamer.
items.weapon.melee.dagger.typical_ability_desc=Die Duellantin kann sich mit einem Dolch in der Hand anschleichen. Diese Fähigkeit erlaubt es ihr, sich augenblicklich bis zu 5 Felder weit wegzuteleportieren und gewährt ihr in der Regel _%d Runden Unsichtbarkeit._
items.weapon.melee.dagger.upgrade_ability_stat_name=Fähigkeitsdauer
items.weapon.melee.dirk.ability_desc=Die Duellantin kann sich mit einem Dolch in der Hand anschleichen. Diese Fähigkeit erlaubt es ihr, sich augenblicklich bis zu 4 Felder weit wegzuteleportieren und gewährt ihr _%d Runden Unsichtbarkeit._
items.weapon.melee.dirk.ability_name=schleichen
items.weapon.melee.dirk.desc=Ein längerer Stoßdolch bietet etwas mehr Stahl, um in Feinde einzudringen.
items.weapon.melee.dirk.name=Dolch
items.weapon.melee.dirk.stats_desc=Diese Waffe ist gegen ahnungslose Feinde wirksamer.
items.weapon.melee.dirk.typical_ability_desc=Die Duellantin kann sich mit einem Dolch in der Hand anschleichen. Diese Fähigkeit erlaubt es ihr, sich augenblicklich bis zu 4 Felder weit wegzuteleportieren und gewährt ihr in der Regel _%d Runden Unsichtbarkeit._
items.weapon.melee.dirk.upgrade_ability_stat_name=Fähigkeitsdauer
items.weapon.melee.flail$spinabilitytracker.desc=Die Duellantin schwingt ihren Flegel und baut so Schaden für ihren nächsten normalen Angriff auf. Jede Drehung dauert eine Runde, erhöht aber den Schaden, bis maximal drei Drehungen möglich sind. Der Flegel trifft garantiert während der Drehung. Aktuelle Drehungen: 0, 1, 5. Verbleibende Runden: 2.
items.weapon.melee.flail$spinabilitytracker.name=Spinnen
items.weapon.melee.flail.ability_desc=Der Duellant kann einen Flegel wirbeln, um kurzzeitig Kraft aufzubauen. Jede Drehung des Flegels verursacht bei seinem nächsten regulären Angriff +%d Schaden, maximal dreimal. Ein wirbelnder Flegel trifft garantiert. Allein das Beginnen der Drehung kostet eine Ladung.
items.weapon.melee.flail.ability_name=drehen
items.weapon.melee.flail.desc=Eine mit Stacheln besetzte Kugel, die über eine Kette an einem Griff befestigt ist. Sehr unhandlich, aber verheerend, wenn sie einen Volltreffer landet.
items.weapon.melee.flail.name=Flegel
items.weapon.melee.flail.spin_warn=Man kann den Dreschflegel nicht mehr drehen.
items.weapon.melee.flail.stats_desc=Dies ist eine ziemlich ungenaue Waffe.\nDiese Waffe kann keinen Überraschungsangriff ausführen.
items.weapon.melee.flail.typical_ability_desc=Der Duellant kann einen Flegel wirbeln, um kurzzeitig Kraft aufzubauen. Jede Drehung des Flegels verursacht bei seinem nächsten normalen Angriff typischerweise +%d Schaden, maximal jedoch dreimal. Ein wirbelnder Flegel trifft garantiert. Allein das Beginnen der Drehung kostet eine Ladung.
items.weapon.melee.gauntlet.ability_desc=Der Duellant kann mit einem Steinhandschuh eine _Kombinationsattacke_ ausführen. Dieser Angriff trifft garantiert und verursacht _+%d Schaden_ für jeden Treffer des Duellanten mit einer normalen Nahkampfwaffe oder einer Wurfwaffe. Trifft der Duellant 5 Runden lang nicht, wird die Kombo zurückgesetzt.
items.weapon.melee.gauntlet.ability_name=Kombinationsschlag
items.weapon.melee.gauntlet.desc=Dieser gewaltige Panzerhandschuh besteht aus purpurrotem Stoff, der mit schweren, magischen Steinplatten überzogen ist. Der Stoff schmiegt sich eng um den Körper und lässt die dicken Steinplatten fast wie eine zweite Haut wirken. Das Schwingen einer so schweren Waffe erfordert Kraft, verleiht den Schlägen aber ungeheure Wucht.
items.weapon.melee.gauntlet.name=Steinhandschuh
items.weapon.melee.gauntlet.stats_desc=Das ist eine sehr schnelle Waffe.
items.weapon.melee.gauntlet.typical_ability_desc=Der Duellant kann mit einem Steinhandschuh eine _Kombinationsattacke_ ausführen. Dieser Angriff trifft garantiert und verursacht typischerweise _+%d Schaden_ für jeden Treffer des Duellanten mit einer normalen Nahkampfwaffe oder einer Wurfwaffe. Trifft der Duellant 5 Runden lang nicht, wird die Kombo zurückgesetzt.
items.weapon.melee.glaive.ability_desc=Der Duellant kann die Spitze einer Gleve benutzen, um einen Gegner in Reichweite, aber nicht direkt neben ihm, aufzuspießen. Dies verursacht _%1$d-%2$d Schaden_, stößt den Gegner zurück und trifft garantiert.
items.weapon.melee.glaive.ability_name=Spitze
items.weapon.melee.glaive.desc=Eine massive Stangenwaffe, bestehend aus einer Schwertklinge am Ende einer Stange.
items.weapon.melee.glaive.name=Gleve
items.weapon.melee.glaive.stats_desc=Dies ist eine eher langsame Waffe.\nDiese Waffe hat eine größere Reichweite.
items.weapon.melee.glaive.typical_ability_desc=Der Duellant kann die Spitze einer Gleve benutzen, um einen Gegner in Reichweite, aber nicht direkt neben ihm, aufzuspießen. Dies verursacht typischerweise _%1$d-%2$d Schaden_, stößt den Gegner zurück und trifft garantiert.
items.weapon.melee.gloves.ability_desc=Der Duellant kann mit den Nietenhandschuhen einen Komboangriff ausführen. Dieser Angriff trifft garantiert und verursacht +%d Schaden für jeden Treffer des Duellanten mit einem normalen Nahkampf- oder Wurfwaffenangriff. Trifft der Duellant 5 Runden lang nicht, wird die Kombo zurückgesetzt.
items.weapon.melee.gloves.ability_name=Kombinationsschlag
items.weapon.melee.gloves.desc=Diese mit Nieten besetzten Handschuhe bieten zwar keinen wirklichen Schutz, dienen aber als brauchbare Waffe und lassen gleichzeitig die Hände frei.
items.weapon.melee.gloves.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.melee.gloves.name=genietete Handschuhe
items.weapon.melee.gloves.stats_desc=Das ist eine sehr schnelle Waffe.
items.weapon.melee.gloves.typical_ability_desc=Der Duellant kann mit den Nietenhandschuhen einen Kombinationsangriff ausführen. Dieser Angriff trifft garantiert und verursacht in der Regel +%d Schaden für jeden Treffer des Duellanten mit einem normalen Nahkampf- oder Wurfwaffenangriff. Trifft der Duellant 5 Runden lang nicht, wird die Kombination zurückgesetzt.
items.weapon.melee.greataxe.ability_desc=Die Duellantin kann einen Vergeltungsangriff mit einer Streitaxt ausführen, wenn ihre Gesundheit unter 50%% liegt. Dieser verheerende Angriff verursacht _%1$d-%2$d Schaden_, trifft garantiert und ist sofortig, wenn er einen Gegner tötet.
items.weapon.melee.greataxe.ability_name=Vergeltung
items.weapon.melee.greataxe.desc=Diese gigantische Axt, die über der Schulter getragen werden soll, ist ebenso kraftvoll wie schwer.
items.weapon.melee.greataxe.name=Streitaxt
items.weapon.melee.greataxe.stats_desc=Diese Waffe ist unglaublich schwer.
items.weapon.melee.greataxe.typical_ability_desc=Die Duellantin kann einen Vergeltungsangriff mit einer Streitaxt ausführen, wenn ihre Lebenspunkte unter 50 liegen. Dieser verheerende Angriff verursacht typischerweise 1–2 Schaden, trifft garantiert und ist sofort tödlich, wenn er einen Gegner tötet.
items.weapon.melee.greatshield.ability_desc=Die Duellantin kann sich mit einem Großschild schützen und so für %d Runden alle physischen und magischen Angriffe abwehren. Sobald die Duellantin einen Angriff abgewehrt hat, beendet ein Gegenangriff oder der Einsatz von Magie die Abwehr.
items.weapon.melee.greatshield.ability_name=bewachen
items.weapon.melee.greatshield.desc=Eher eine mobile Mauer als ein Schild: Diese gigantische Metallmasse hilft bei der Verteidigung, lässt aber nicht viel Raum für Angriffe.
items.weapon.melee.greatshield.name=Großschild
items.weapon.melee.greatshield.stats_desc=Diese Waffe blockiert 0-%d Schaden. Die Blockierwirkung skaliert mit Verbesserungen.
items.weapon.melee.greatshield.typical_ability_desc=Die Duellantin kann sich mit einem Großschild schützen und so alle physischen und magischen Angriffe für etwa 200 Runden abwehren. Sobald die Duellantin einen Angriff abgewehrt hat, beendet ein Gegenangriff oder der Einsatz von Magie die Abwehr.
items.weapon.melee.greatshield.typical_stats_desc=Diese Waffe blockiert normalerweise 0-%d Schaden. Die Blockierwirkung skaliert mit Verbesserungen.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Fähigkeitsdauer
items.weapon.melee.greatsword.ability_desc=Der Duellant kann einen Gegner mit einem Großschwert spalten. Dieser Angriff verursacht _%1$d-%2$d Schaden_ und trifft garantiert. Tötet der Spaltangriff einen Gegner, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.greatsword.ability_name=spalten
items.weapon.melee.greatsword.desc=Diese gewaltige Klinge richtet schweren Schaden an, indem sie ihr gesamtes Gewicht in jeden Schlag einbringt.
items.weapon.melee.greatsword.name=Großschwert
items.weapon.melee.greatsword.typical_ability_desc=Der Duellant kann einen Gegner mit einem Großschwert spalten. Dies verursacht typischerweise _%1$d-%2$d Schaden_ und trifft garantiert. Wenn der Gegner durch den Spaltenangriff getötet wird, geschieht dies sofort, und der Duellant kann den Spaltenangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.handaxe.ability_desc=Der Duellant kann mit einer Handaxt einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.handaxe.ability_name=schwerer Schlag
items.weapon.melee.handaxe.desc=Eine leichte Axt, die meist zum Fällen von Bäumen verwendet wird. Die breite Klinge eignet sich auch gut zur Verteidigung gegen Feinde.
items.weapon.melee.handaxe.name=Faustkeil
items.weapon.melee.handaxe.stats_desc=Das ist eine ziemlich präzise Waffe.
items.weapon.melee.handaxe.typical_ability_desc=Der Duellant kann mit einer Handaxt einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht typischerweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.katana.ability_desc=Der Duellant kann mit einem Katana einen Gegner in einem Feld Entfernung angreifen. Dabei bewegt er sich auf den Gegner zu, verursacht Schaden in Höhe von %1$d-%2$d und trifft garantiert.
items.weapon.melee.katana.ability_name=Ausfallschritt
