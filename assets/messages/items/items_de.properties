items.weapon.melee.katana.stats_desc=Diese Waffe blockt 0-3 Schadenspunkte.
items.weapon.melee.katana.typical_ability_desc=Der Duellant kann mit einem Katana einen Gegner in einem Feld Entfernung angreifen. Dieser Angriff bewegt sich auf den Gegner zu, verursacht typischerweise _%1$d-%2$d Schaden_ und trifft garantiert.
items.weapon.melee.longsword.ability_desc=Der Duellant kann einen Gegner mit einem Langschwert spalten. Dieser Angriff verursacht _%1$d-%2$d Schaden_ und trifft garantiert. Tötet der Spaltangriff einen Gegner, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.longsword.ability_name=spalten
items.weapon.melee.longsword.desc=Die lange, rasiermesserscharfe Stahlklinge dieses Schwertes glänzt beruhigend, allerdings ist es aufgrund seiner Größe recht schwer.
items.weapon.melee.longsword.name=Langschwert
items.weapon.melee.longsword.typical_ability_desc=Der Duellant kann einen Gegner mit einem Langschwert spalten. Dies verursacht typischerweise _%1$d-%2$d Schaden_ und trifft garantiert. Wenn der Gegner durch den Spaltangriff getötet wird, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.mace.ability_desc=Der Duellant kann mit einer Keule einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.mace.ability_name=schwerer Schlag
items.weapon.melee.mace.desc=Der große eiserne Kopf dieser Waffe verursacht erheblichen Schaden.
items.weapon.melee.mace.name=Keule
items.weapon.melee.mace.stats_desc=Das ist eine ziemlich präzise Waffe.
items.weapon.melee.mace.typical_ability_desc=Der Duellant kann mit einer Keule einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht typischerweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.magesstaff.ac_imbue=IMBUE
items.weapon.melee.magesstaff.ac_zap=ZAP
items.weapon.melee.magesstaff.cursed_wand=Der Stab ist verflucht, wodurch seine Magie chaotisch und unberechenbar ist.
items.weapon.melee.magesstaff.desc=Dieser vom Magier persönlich gefertigte Stab ist eine einzigartige magische Waffe, die mit einem Zauberstab aufgeladen werden kann.
items.weapon.melee.magesstaff.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.melee.magesstaff.has_wand=Das Personal ist derzeit von einem _%s._ durchdrungen.
items.weapon.melee.magesstaff.imbue=Sie verleihen Ihren Mitarbeitern das %s.
items.weapon.melee.magesstaff.imbue_cursed=Wenn du einen verfluchten Zauberstab mit einem Fluch versiehst, wird auch dein Stab verflucht!
items.weapon.melee.magesstaff.imbue_desc=Bist du sicher, dass du deinen Stab mit diesem Zauberstab verstärken möchtest?\n\nWenn der zu verstärkende Zauberstab die gleiche oder eine höhere Stufe als der Stab hat, erbt der Stab die Stufe des Zauberstabs plus eine seiner eigenen Verbesserungen.
items.weapon.melee.magesstaff.imbue_level=Diese Einbettung führt zu einem _+%d-Stab.
items.weapon.melee.magesstaff.imbue_lost=Der Zauberstab, der sich derzeit in Ihrem Stab befindet, _wird verloren gehen_.
items.weapon.melee.magesstaff.imbue_talent=Der Zauberstab, der sich derzeit in Ihrem Stab befindet, wird bei +0 zurückgegeben.
items.weapon.melee.magesstaff.imbue_unknown=Du kennst die Stufe dieses Zauberstabs nicht, aber diese Verzauberung wird mindestens zu einem _+%d-Stab führen.
items.weapon.melee.magesstaff.name=Zauberstab
items.weapon.melee.magesstaff.no=Nein, ich habe meine Meinung geändert
items.weapon.melee.magesstaff.no_wand=Der Stab besitzt derzeit keine magischen Kräfte; er muss erst mit der Kraft eines Zauberstabs aufgeladen werden, bevor er zum Wirken von Zaubersprüchen verwendet werden kann.
items.weapon.melee.magesstaff.preserved=Der vorherige Zauberstab wurde aufbewahrt!
items.weapon.melee.magesstaff.prompt=Wähle einen Zauberstab
items.weapon.melee.magesstaff.yes=Ja, ich bin mir sicher.
items.weapon.melee.meleeweapon.ability_cant_use=Diese Fähigkeit können Sie im Moment nicht nutzen.
items.weapon.melee.meleeweapon.ability_low_str=Du bist nicht stark genug, um die Fähigkeiten dieser Waffe zu nutzen.
items.weapon.melee.meleeweapon.ability_need_equip=Du musst diese Waffe ausrüsten, um ihre Fähigkeit nutzen zu können.
items.weapon.melee.meleeweapon.ability_no_charge=Du hast nicht genug Energie, um diese Fähigkeit einzusetzen.
items.weapon.melee.meleeweapon.ability_no_target=Dort gibt es kein Ziel.
items.weapon.melee.meleeweapon.ability_occupied=Dieser Platz ist belegt.
items.weapon.melee.meleeweapon.ability_target_range=Das Ziel ist nicht in Reichweite.
