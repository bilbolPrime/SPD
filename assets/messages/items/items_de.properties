items.weapon.melee.quarterstaff$defensivestance.desc=Die Duellantin nutzt ihren Kampfstab, um Angriffe und Geschosse abzuwehren. Solange sie diese Haltung einnimmt, ist ihre Ausweichchance gegen alle Angriffe dreifach erhöht. \n\n Verbleibende Züge: %s.
items.weapon.melee.quarterstaff$defensivestance.name=Verteidigungshaltung
items.weapon.melee.quarterstaff.ability_desc=Die Duellantin kann mit einem Kampfstab eine _defensive Haltung_ einnehmen. Diese Haltung wird sofort aktiviert und verdreifacht ihre Ausweichchance für _%d Runden_.
items.weapon.melee.quarterstaff.ability_name=Verteidigungshaltung
items.weapon.melee.quarterstaff.desc=Ein Stab aus Hartholz, dessen Enden mit Eisen beschlagen sind.
items.weapon.melee.quarterstaff.name=Viertelstab
items.weapon.melee.quarterstaff.stats_desc=Diese Waffe blockt 0-2 Schadenspunkte.
items.weapon.melee.quarterstaff.typical_ability_desc=Die Duellantin kann mit einem Kampfstab eine _defensive Haltung_ einnehmen. Diese Haltung lässt sich sofort aktivieren und verdreifacht ihre Ausweichchance typischerweise für _%d Runden_.
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Fähigkeitsdauer
items.weapon.melee.rapier.ability_desc=Der Duellant kann mit einem Rapier einen Gegner in einem Feld Entfernung angreifen. Dabei bewegt er sich auf den Gegner zu, verursacht _%1$d-%2$d Schaden_ und trifft garantiert.
items.weapon.melee.rapier.ability_name=Ausfallschritt
items.weapon.melee.rapier.desc=Ein schlankes, gerades Schwert, das etwas Schutz bietet, dafür aber weniger Hiebkraft besitzt.
items.weapon.melee.rapier.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.melee.rapier.name=Rapier
items.weapon.melee.rapier.stats_desc=Diese Waffe blockt 0-1 Schadenspunkte.
items.weapon.melee.rapier.typical_ability_desc=Der Duellant kann mit einem Rapier einen Gegner in einem Feld Entfernung angreifen. Dieser Angriff bewegt sich auf den Gegner zu, verursacht typischerweise _%1$d-%2$d Schaden_ und trifft garantiert.
items.weapon.melee.roundshield$guardtracker.desc=Die Duellantin hat ihren Schild bereit, um sich gegen Angriffe zu verteidigen. Physische und magische Angriffe gegen sie werden vollständig abgewehrt. \n\n Verbleibende Züge: %s.
items.weapon.melee.roundshield$guardtracker.guarded=bewacht
items.weapon.melee.roundshield$guardtracker.name=Bewachung
items.weapon.melee.roundshield.ability_desc=Die Duellantin kann sich mit einem Rundschild schützen und so für %d Runden alle physischen und magischen Angriffe abwehren. Sobald die Duellantin einen Angriff abgewehrt hat, beendet ein Gegenangriff oder der Einsatz von Magie die Abwehr.
items.weapon.melee.roundshield.ability_name=bewachen
items.weapon.melee.roundshield.desc=Dieser große Schild blockt Angriffe effektiv ab und eignet sich im Notfall auch als Waffe.
items.weapon.melee.roundshield.name=Rundschild
items.weapon.melee.roundshield.stats_desc=Diese Waffe blockiert 0-%d Schaden. Die Blockierwirkung skaliert mit Verbesserungen.
items.weapon.melee.roundshield.typical_ability_desc=Die Duellantin kann sich mit einem Rundschild schützen und so alle physischen und magischen Angriffe für etwa 200 Runden abwehren. Sobald die Duellantin einen Angriff abgewehrt hat, beendet ein Gegenangriff oder der Einsatz von Magie die Abwehr.
items.weapon.melee.roundshield.typical_stats_desc=Diese Waffe blockiert normalerweise 0-%d Schaden. Die Blockierwirkung skaliert mit Verbesserungen.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Fähigkeitsdauer
items.weapon.melee.runicblade.ability_desc=Der Duellant kann mit einer Runenklinge einen Runenhieb ausführen. Dieser Angriff trifft garantiert und besitzt die Verzauberungskraft +%d%%.
items.weapon.melee.runicblade.ability_name=Runenhieb
items.weapon.melee.runicblade.desc=Eine geheimnisvolle Waffe aus einem fernen Land mit einer leuchtend blauen Klinge.
items.weapon.melee.runicblade.name=Runenklinge
items.weapon.melee.runicblade.stats_desc=Diese Waffe profitiert am meisten von Verbesserungen.
items.weapon.melee.runicblade.typical_ability_desc=Der Duellant kann mit einer Runenklinge einen Runenhieb ausführen. Dieser Angriff trifft garantiert und besitzt typischerweise eine Verzauberungskraft von +%d%%.
items.weapon.melee.runicblade.upgrade_ability_stat_name=Fähigkeitsstärke
items.weapon.melee.sai$combostriketracker.desc=Der Duellant baut eine Kombo auf, die den Schaden der Komboschlag-Fähigkeit erhöht. Jeder erfolgreiche Nahkampf- oder Wurfwaffenangriff zählt, aber wenn 5 Runden lang kein erfolgreicher Angriff erfolgt, wird diese Kombo zurückgesetzt. \n\nLetzte Treffer: %1$d.\n\nRunden bis zum Verlust der Treffer: %2$s.
items.weapon.melee.sai$combostriketracker.name=Kombinationsschlag
items.weapon.melee.sai.ability_desc=Der Duellant kann mit Sai einen _Kombinationsangriff_ ausführen. Dieser Angriff trifft garantiert und verursacht _+%d Schaden_ für jeden Treffer des Duellanten mit einer normalen Nahkampfwaffe oder einer Wurfwaffe. Trifft der Duellant 5 Runden lang nicht, wird die Kombo zurückgesetzt.
items.weapon.melee.sai.ability_name=Kombinationsschlag
items.weapon.melee.sai.desc=Zwei dünne Klingen, die jeweils einhändig geführt werden. Hervorragend geeignet, um Feinde mit einer Salve von Hieben niederzustrecken.
items.weapon.melee.sai.name=Sai
items.weapon.melee.sai.stats_desc=Das ist eine sehr schnelle Waffe.
items.weapon.melee.sai.typical_ability_desc=Der Duellant kann mit Sai einen _Kombinationsangriff_ ausführen. Dieser Angriff trifft garantiert und verursacht typischerweise _+%d Schaden_ für jeden Treffer des Duellanten mit einem normalen Nahkampf- oder Wurfwaffenangriff. Trifft der Duellant 5 Runden lang nicht, wird die Kombo zurückgesetzt.
items.weapon.melee.scimitar$sworddance.desc=Die Duellantin führt schnelle, schwungvolle Angriffe in einer Art Tanz aus. Solange diese Haltung aktiv ist, greift sie 60%% schneller an (genug, um genau zweimal pro Runde mit einem Krummsäbel anzugreifen) und ihre Treffsicherheit erhöht sich um 50%%. Verbleibende Runden: %s.
items.weapon.melee.scimitar$sworddance.name=Schwerttanz
items.weapon.melee.scimitar.ability_desc=Der Duellant kann mit einem Krummsäbel einen Schwerttanz ausführen. Diese Haltung wird sofort aktiviert und gewährt dem Duellanten für 2 Runden +60%% Angriffsgeschwindigkeit und +50%% Treffsicherheit.
items.weapon.melee.scimitar.ability_name=Schwerttanz
items.weapon.melee.scimitar.desc=Eine dicke, gebogene Klinge. Ihre Form ermöglicht schnellere, aber weniger kraftvolle Angriffe.
items.weapon.melee.scimitar.name=Krummsäbel
items.weapon.melee.scimitar.stats_desc=Das ist eine ziemlich schnelle Waffe.
items.weapon.melee.scimitar.typical_ability_desc=Der Duellant kann mit einem Krummsäbel einen Schwerttanz ausführen. Diese Haltung wird sofort aktiviert und verleiht dem Duellanten für typischerweise 2 Runden +60%% Angriffsgeschwindigkeit und +50%% Treffsicherheit.
items.weapon.melee.scimitar.upgrade_ability_stat_name=Fähigkeitsdauer
items.weapon.melee.shortsword.ability_desc=Der Duellant kann einen Gegner mit einem Kurzschwert spalten. Dieser Angriff verursacht _%1$d-%2$d Schaden_ und trifft garantiert. Tötet der Spaltangriff einen Gegner, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.shortsword.ability_name=spalten
items.weapon.melee.shortsword.desc=Ein recht kurzes Schwert, nur wenige Zentimeter länger als ein Dolch.
items.weapon.melee.shortsword.name=Kurzschwert
items.weapon.melee.shortsword.typical_ability_desc=Der Duellant kann einen Gegner mit einem Kurzschwert spalten. Dies verursacht typischerweise _%1$d-%2$d Schaden_ und trifft garantiert. Wenn der Gegner durch den Spaltangriff getötet wird, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.sickle.ability_desc=Der Duellant kann einen Gegner mit einer Sichel ernten. Dieser verheerende Angriff trifft garantiert und verursacht %d Schaden. Dieser Schaden wird als Blutung angewendet, falls das Ziel nicht immun ist.
items.weapon.melee.sickle.ability_name=Ernte
items.weapon.melee.sickle.desc=Ein handliches Landwirtschaftsgerät, das gleichzeitig als starke, aber unhandliche Waffe dient.
items.weapon.melee.sickle.name=Sichel
items.weapon.melee.sickle.stats_desc=Das ist eine ziemlich ungenaue Waffe.
items.weapon.melee.sickle.typical_ability_desc=Der Duellant kann einen Gegner mit einer Sichel ernten. Dieser verheerende Angriff trifft garantiert und verursacht typischerweise %d Schaden. Dieser Schaden wird als Blutung angewendet, falls das Ziel nicht immun ist.
items.weapon.melee.spear.ability_desc=Der Duellant kann die Spitze eines Speers benutzen, um einen Gegner in Reichweite, aber nicht direkt neben sich, aufzuspießen. Dies verursacht Schaden in Höhe von %1$d-%2$d, stößt den Gegner zurück und trifft garantiert.
items.weapon.melee.spear.ability_name=Spitze
items.weapon.melee.spear.desc=Ein schlanker Holzstab mit einer Spitze aus geschärftem Eisen.
items.weapon.melee.spear.name=Speer
items.weapon.melee.spear.stats_desc=Dies ist eine eher langsame Waffe.\nDiese Waffe hat eine größere Reichweite.
items.weapon.melee.spear.typical_ability_desc=Der Duellant kann die Spitze eines Speers benutzen, um einen Gegner in Reichweite, aber nicht direkt neben sich, aufzuspießen. Dies verursacht typischerweise _%1$d-%2$d Schaden_, stößt den Gegner zurück und trifft garantiert.
items.weapon.melee.sword$cleavetracker.desc=Die Duellantin ist bereit, ihren vorherigen Spaltangriff fortzusetzen. Der nächste Einsatz von Spaltangriff kostet keine Waffenfähigkeitsladung. \n\n Verbleibende Züge: %s.
items.weapon.melee.sword$cleavetracker.name=spalten
items.weapon.melee.sword.ability_desc=Der Duellant kann einen Gegner mit einem Schwert spalten. Dies verursacht _%1$d-%2$d Schaden_ und trifft garantiert. Tötet der Spaltangriff einen Gegner, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.sword.ability_name=spalten
items.weapon.melee.sword.desc=Ein schön ausbalanciertes Schwert. Nicht zu groß, aber dennoch deutlich länger als ein Kurzschwert.
items.weapon.melee.sword.name=Schwert
items.weapon.melee.sword.typical_ability_desc=Der Duellant kann einen Gegner mit einem Schwert spalten. Dies verursacht typischerweise _%1$d-%2$d Schaden_ und trifft garantiert. Wenn der Gegner durch den Spaltangriff getötet wird, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.warhammer.ability_desc=Der Duellant kann mit einem Kriegshammer einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.warhammer.ability_name=schwerer Schlag
items.weapon.melee.warhammer.desc=Nur wenige Lebewesen können dem vernichtenden Schlag dieser gewaltigen Masse aus Blei und Stahl widerstehen, doch es bedarf großer Kraft, sie effektiv einzusetzen.
items.weapon.melee.warhammer.name=Kriegshammer
items.weapon.melee.warhammer.stats_desc=Das ist eine ziemlich präzise Waffe.
items.weapon.melee.warhammer.typical_ability_desc=Der Duellant kann mit einem Kriegshammer einen schweren Schlag ausführen. Dieser konzentrierte Angriff verursacht typischerweise _%1$d-%2$d Schaden_, wenn er den Gegner überrascht, und betäubt ihn für 5 Runden, wodurch seine Treffsicherheit und Ausweichchance um 50%% reduziert werden. Ein schwerer Schlag trifft immer, verursacht aber normalen Schaden, wenn er den Gegner nicht überrascht.
items.weapon.melee.warscythe.ability_desc=Der Duellant kann einen Feind mit einer Kriegssense ernten. Dieser verheerende Angriff trifft garantiert und verursacht %d Schaden. Dieser Schaden wird als Blutung angewendet, falls das Ziel nicht immun ist.
items.weapon.melee.warscythe.ability_name=Ernte
items.weapon.melee.warscythe.desc=Dieses große und unhandliche Werkzeug wurde verstärkt, um es besser zum Zerschneiden von Feinden als zum Ernten von Nutzpflanzen geeignet zu machen.
items.weapon.melee.warscythe.name=Kriegssense
items.weapon.melee.warscythe.stats_desc=Das ist eine ziemlich ungenaue Waffe.
items.weapon.melee.warscythe.typical_ability_desc=Der Duellant kann einen Feind mit einer Kriegssense ernten. Dieser verheerende Angriff trifft garantiert und verursacht typischerweise %d Schaden. Dieser Schaden wird als Blutung angewendet, falls das Ziel nicht immun ist.
items.weapon.melee.whip.ability_desc=Die Duellantin kann alle Gegner in ihrer Nähe mit einer Peitsche angreifen. Diese Fähigkeit verursacht Schaden in Höhe von %1$d-%2$d, trifft alle Gegner in Reichweite und ist ein garantierter Treffer.
items.weapon.melee.whip.ability_name=Peitsche
items.weapon.melee.whip.desc=Während das mit Widerhaken versehene Seil am Ende dieser Waffe nur geringen Schaden anrichtet, ist ihre Reichweite unübertroffen.
items.weapon.melee.whip.name=Peitsche
items.weapon.melee.whip.stats_desc=Diese Waffe hat eine enorme Reichweite.
items.weapon.melee.whip.typical_ability_desc=Die Duellantin kann alle Gegner in ihrer Nähe mit einer Peitsche angreifen. Diese Fähigkeit verursacht typischerweise _%1$d-%2$d Schaden_, trifft alle Gegner in Reichweite und ist ein garantierter Treffer.
items.weapon.melee.wornshortsword.ability_desc=Der Duellant kann einen Gegner mit einem abgenutzten Kurzschwert spalten. Dieser Angriff verursacht _%1$d-%2$d Schaden_ und trifft garantiert. Tötet der Spaltangriff einen Gegner, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.melee.wornshortsword.ability_name=spalten
items.weapon.melee.wornshortsword.desc=Ein recht kurzes Schwert, durch häufigen Gebrauch abgenutzt. Es ist sowohl schwächer als auch etwas leichter als ein Kurzschwert in besserem Zustand.
items.weapon.melee.wornshortsword.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.melee.wornshortsword.name=abgenutztes Kurzschwert
items.weapon.melee.wornshortsword.typical_ability_desc=Der Duellant kann einen Gegner mit einem abgenutzten Kurzschwert spalten. Dies verursacht typischerweise _%1$d-%2$d Schaden_ und trifft garantiert. Tötet der Spaltangriff einen Gegner, geschieht dies sofort, und der Duellant kann den Spaltangriff innerhalb von 5 Runden kostenlos erneut einsetzen.
items.weapon.missiles.bolas.desc=Diese ungewöhnlichen Fernkampfwaffen richten zwar keinen großen Schaden an, verlangsamen ihr Ziel aber hervorragend.
items.weapon.missiles.bolas.name=Bolas
items.weapon.missiles.bolas.stats_desc=Diese Waffe fügt ihrem Ziel schwere Verletzungen zu.
items.weapon.missiles.boomerang.desc=Wird dieses flache, gebogene Holzgeschoss dem Feind zugeworfen, kehrt es in die Hände des Werfers zurück.
items.weapon.missiles.boomerang.durability=Dank seiner soliden Konstruktion wird dieser Bumerang beim Gebrauch nicht kaputtgehen.
items.weapon.missiles.boomerang.name=Boomerang
items.weapon.missiles.darts.adrenalinedart.desc=Diese Pfeile sind mit einer Substanz auf Basis der Schnelldistel bestrichen, die die Bewegungs- und Angriffsgeschwindigkeit von Verbündeten erhöht oder die Bewegungsgeschwindigkeit von Feinden kurzzeitig verringert. Der Pfeil selbst ist weiterhin schädlich für Feinde, aber nicht für Verbündete.
items.weapon.missiles.darts.adrenalinedart.name=Adrenalinpfeil
items.weapon.missiles.darts.blindingdart.desc=Diese Pfeile sind mit einer auf Blindkraut basierenden Substanz bestückt, die das Ziel kurzzeitig blendet. Sie desorientieren jedoch nicht, sodass ein Feind weiterhin weiß, wo er Sie zuletzt gesehen hat.
items.weapon.missiles.darts.blindingdart.name=blendender Pfeil
items.weapon.missiles.darts.chillingdart.desc=Diese Pfeile sind mit einer auf Eiskappen basierenden Substanz beschichtet, die ihr Ziel deutlich abkühlt.
items.weapon.missiles.darts.chillingdart.name=eisiger Pfeil
items.weapon.missiles.darts.cleansingdart.desc=Diese Pfeile sind mit einer mageren Substanz bestrichen, die Verbündete vorübergehend immun gegen alle negativen Effekte macht oder positive Effekte von Feinden entfernt. Feinde vergessen möglicherweise sogar kurzzeitig, dass sie angreifen oder fliehen. Der Pfeil selbst ist weiterhin schädlich für Feinde, aber nicht für Verbündete.
items.weapon.missiles.darts.cleansingdart.name=Reinigungspfeil
items.weapon.missiles.darts.dart.ac_tip=TIPP
items.weapon.missiles.darts.dart.desc=Diese einfachen, mit Stacheln besetzten Holzstangen sind so gewichtet, dass sie präzise fliegen und ihre Beute mit einer Handbewegung treffen. Sie können mit Samen bestückt werden, um beim Werfen zusätzliche Effekte zu erzielen.
items.weapon.missiles.darts.dart.name=Pfeil
items.weapon.missiles.darts.dart.prompt=Wähle einen Samen aus
items.weapon.missiles.darts.dart.tip_all=Spitze %1$d Darts mit %2$d Samen
items.weapon.missiles.darts.dart.tip_cancel=stornieren
items.weapon.missiles.darts.dart.tip_desc=Ein Samen kann mit einem oder zwei Pfeilen kombiniert werden, um diese zu bestücken. Jede Samenart erzeugt einen eigenen Pfeiltyp mit einzigartiger Einmalwirkung. \n\n. Die Bestückung eines Pfeils mit diesen Samen erzeugt einen _%s._
items.weapon.missiles.darts.dart.tip_one=Tipp: 1 Dart mit 1 Samen
items.weapon.missiles.darts.dart.tip_title=Tip Darts
items.weapon.missiles.darts.dart.tip_two=Tipp: 2 Darts mit 1 Samen
items.weapon.missiles.darts.dart.unlimited_uses=Aufgrund ihrer einfachen Konstruktion halten Darts praktisch ewig.
items.weapon.missiles.darts.displacingdart.desc=Diese Pfeile sind mit einer auf Blattgold basierenden Verbindung an der Spitze versehen, die ihr Ziel eine kurze Distanz weg teleportiert.
items.weapon.missiles.darts.displacingdart.name=verdrängender Pfeil
items.weapon.missiles.darts.healingdart.desc=Diese Pfeile sind mit einer Substanz auf Sonnengrasbasis bestrichen, die dem Ziel einen Heilungsschub verleiht. Der Pfeil selbst ist für Feinde weiterhin schädlich, fügt Verbündeten jedoch keinen Schaden zu.
items.weapon.missiles.darts.healingdart.name=Heilungspfeil
items.weapon.missiles.darts.holydart.desc=Diese Pfeile sind mit einer sternblumenbasierten Substanz bestrichen, die heilige Energie auf ihr Ziel überträgt. Verbündete und normale Feinde werden gesegnet, Untote und Dämonen hingegen erleiden schweren Schaden. Der Pfeil selbst ist für Feinde weiterhin schädlich, verletzt aber keine Verbündeten.
items.weapon.missiles.darts.holydart.name=Heiliger Pfeil
items.weapon.missiles.darts.incendiarydart.desc=Diese Pfeile sind mit einer auf Feuerblüte basierenden Verbindung an der Spitze versehen, die beim Aufprall in helle Flammen aufgeht.
items.weapon.missiles.darts.incendiarydart.name=Brandpfeil
items.weapon.missiles.darts.paralyticdart.desc=Diese Pfeile sind mit einer Substanz auf Erdwurzelbasis bestrichen, die ihr Ziel für kurze Zeit lähmt.
items.weapon.missiles.darts.paralyticdart.name=Lähmungspfeil
items.weapon.missiles.darts.poisondart.desc=Diese Pfeile sind mit einer Substanz auf Basis von Trauermoos bestrichen, die ihr Ziel vergiftet.
items.weapon.missiles.darts.poisondart.name=Giftpfeil
items.weapon.missiles.darts.rotdart.desc=Diese heimtückischen Pfeile sind mit einer ätzenden, auf Rotbeeren basierenden Substanz beschichtet, die alles, womit sie in Berührung kommen, aggressiv zersetzt. Starke Gegner sind größtenteils resistent gegen die Wirkung, doch die Korrosion ist stark genug, um die meisten Standardgegner mühelos zu töten. Sie halten länger als andere Pfeile mit Spitze, ihre Haltbarkeit lässt sich jedoch nicht erhöhen.
items.weapon.missiles.darts.rotdart.discover_hint=Du kannst diesen Gegenstand mithilfe eines Samens aus einer bestimmten Quest herstellen.
items.weapon.missiles.darts.rotdart.name=Rotpfeil
items.weapon.missiles.darts.shockingdart.desc=Diese Pfeile sind mit einer auf Sturmwinden basierenden Substanz bestückt, die ihrem Ziel einen heftigen Stromschlag versetzt.
items.weapon.missiles.darts.shockingdart.name=Schockierender Pfeil
items.weapon.missiles.darts.tippeddart.about_to_break=Die Spitze deines Dartpfeils ist bald abgenutzt.
items.weapon.missiles.darts.tippeddart.ac_clean=SAUBER
items.weapon.missiles.darts.tippeddart.cancel=stornieren
items.weapon.missiles.darts.tippeddart.clean_all=Alles reinigen
items.weapon.missiles.darts.tippeddart.clean_desc=Durch diese Maßnahme werden die Samenkappen an Ihren Dartpfeilen entfernt, sodass sie wieder zu normalen Dartpfeilen werden.
items.weapon.missiles.darts.tippeddart.clean_one=sauberen
items.weapon.missiles.darts.tippeddart.clean_title=Saubere Darts
items.weapon.missiles.darts.tippeddart.discover_hint=Diesen Gegenstand kann man in einem Geschäft kaufen oder mithilfe eines Samens herstellen.
items.weapon.missiles.darts.tippeddart.has_broken=Die Spitze deines Dartpfeils ist verschlissen.
items.weapon.missiles.darts.tippeddart.unlimited_uses=Aber sie sind von so hoher Qualität, dass sie praktisch ewig halten.
items.weapon.missiles.darts.tippeddart.uses_left=Dieser Stapel Dartpfeile hat noch _%d/%d_ Verwendungen übrig, bevor eine Spitze abgenutzt ist.
items.weapon.missiles.fishingspear.desc=Winzige Wurfspeere, die trotz ihrer ursprünglichen Bestimmung zum Fischen auch als improvisierte Waffe gut funktionieren.
items.weapon.missiles.fishingspear.name=Fischspeer
items.weapon.missiles.forcecube.desc=Diese seltsam geformten magischen Würfel sind klein genug, um sie in der Hand zu halten, aber unglaublich schwer.
items.weapon.missiles.forcecube.name=Kraftwürfel
items.weapon.missiles.forcecube.ondeath=Du hast dich mit deinem eigenen Machtwürfel selbst getötet...
items.weapon.missiles.forcecube.stats_desc=Diese Waffe verteilt die Wucht ihres Aufpralls auf einen kleinen Bereich und trifft alles in der Nähe.
items.weapon.missiles.heavyboomerang.desc=Dieser große Bumerang ist schwer effektiv einzusetzen, richtet aber beträchtlichen Schaden an.
items.weapon.missiles.heavyboomerang.name=schwerer Bumerang
items.weapon.missiles.heavyboomerang.stats_desc=Diese Waffe kehrt nach fünf Umdrehungen zu dem Ort zurück, von dem sie geworfen wurde.
items.weapon.missiles.javelin.desc=Diese größeren Wurfspeere sind so beschwert, dass die Spitze beim Flug stets vorne liegt.
items.weapon.missiles.javelin.name=Speer
items.weapon.missiles.kunai.desc=Diese kleinen Messer sind in den Händen eines geübten Benutzers sehr wirkungsvoll.
items.weapon.missiles.kunai.name=Kunai
items.weapon.missiles.kunai.stats_desc=Diese Waffe ist gegen ahnungslose Feinde wirksamer.
items.weapon.missiles.missileweapon$placeholder.name=Wurfwaffe
items.weapon.missiles.missileweapon.about_to_break=Deine Wurfwaffe wird gleich zerbrechen.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Wenn die letzte Wurfwaffe deines verbesserten Wurfwaffensets zerbricht, geht das Set endgültig verloren. Bist du sicher, dass du sie werfen willst?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=NEIN
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=Ja
items.weapon.missiles.missileweapon.curse_discover=Diese Wurfwaffe ist verflucht!
items.weapon.missiles.missileweapon.distance=Wurfwaffen sind auf Distanz präziser, im Nahkampf jedoch ungenauer.
items.weapon.missiles.missileweapon.durability=Wurfwaffen verschleißen und gehen mit der Zeit kaputt.
items.weapon.missiles.missileweapon.dust=Die Wurfwaffe zerfällt zu Staub, sobald man sie berührt.
items.weapon.missiles.missileweapon.has_broken=Eine deiner Wurfwaffen ist zerbrochen.
items.weapon.missiles.missileweapon.probably_too_heavy=Diese Waffe ist wahrscheinlich zu schwer für Sie.
items.weapon.missiles.missileweapon.stats_known=Dieses Set von Wurfwaffen der Stufe _tier-%1$d_ verursacht _%2$d-%3$d Schaden_ und erfordert _%4$d Stärke_ für die Benutzung.
items.weapon.missiles.missileweapon.stats_unknown=Typischerweise verursacht dieses Set von _tier-%1$d_ Wurfwaffen _%2$d-%3$d Schaden_ und erfordert _%4$d Stärke_ für die Benutzung.
items.weapon.missiles.missileweapon.unknown_uses=Normalerweise hat dieses Set von Wurfwaffen _%d_ Verwendungen, bevor eine davon kaputt geht.
items.weapon.missiles.missileweapon.unlimited_uses=Dieses Set ist von so hoher Qualität, dass es praktisch ewig halten wird.
items.weapon.missiles.missileweapon.uses_left=Dieses Set von Wurfwaffen hat noch _%d/%d_ Verwendungen übrig, bevor eine davon zerbricht.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Du hast kürzlich einen Shuriken sofort geworfen und musst warten, bevor du dies erneut tun kannst. Shuriken können weiterhin geworfen werden, jedoch mit normaler Waffengeschwindigkeit. \n\nVerbleibende Züge: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Shuriken-Abklingzeit
items.weapon.missiles.shuriken.desc=Diese sternförmigen Metallstücke mit rasiermesserscharfen Klingen richten bei einem Treffer beträchtlichen Schaden an. Sie lassen sich in sehr schneller Folge werfen.
items.weapon.missiles.shuriken.name=Shuriken
items.weapon.missiles.shuriken.stats_desc=Shuriken können sofort geworfen werden, haben aber eine Abklingzeit von 20 Runden.
items.weapon.missiles.throwingclub.desc=Eine recht einfache, aber robuste Wurfwaffe, im Wesentlichen ein großer Stein, der an einem Stock befestigt ist.
items.weapon.missiles.throwingclub.name=Wurfkeule
items.weapon.missiles.throwingclub.stats_desc=Diese Waffe bleibt nicht an Feinden haften und kann sofort eingesammelt werden.
items.weapon.missiles.throwinghammer.desc=Diese wuchtigen Hämmer sind dazu bestimmt, auf einen Feind geworfen zu werden. Ihre glatte Ganzmetallkonstruktion macht sie sehr robust.
items.weapon.missiles.throwinghammer.name=Wurfhammer
items.weapon.missiles.throwinghammer.stats_desc=Diese Waffe bleibt nicht an Feinden haften und kann sofort eingesammelt werden.
items.weapon.missiles.throwingknife.desc=Diese leichten Messer sind so ausbalanciert, dass sie in einem Bogen durch die Luft fliegen und direkt ihr Ziel treffen.
items.weapon.missiles.throwingknife.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.missiles.throwingknife.name=Wurfmesser
items.weapon.missiles.throwingknife.stats_desc=Diese Waffe ist gegen ahnungslose Feinde wirksamer.
items.weapon.missiles.throwingspear.desc=Diese leichten Speere haben dünne Rahmen, die zum Werfen und nicht zum Stoßen konzipiert sind.
items.weapon.missiles.throwingspear.name=Speerwurf
items.weapon.missiles.throwingspike.desc=Diese robusten, spitzen Metallstangen sind dazu bestimmt, auf weit entfernte Feinde geworfen zu werden.
items.weapon.missiles.throwingspike.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.missiles.throwingspike.name=Spike
items.weapon.missiles.throwingstone.desc=Diese Steine werden abgeschliffen, damit sie mit mehr Kraft geworfen werden können als normale Steine.
items.weapon.missiles.throwingstone.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.missiles.throwingstone.name=Wurfstein
items.weapon.missiles.tomahawk.desc=Diese Wurfäxte haben eine gezackte Schneide, die beim Auftreffen auf einen Feind einreißt.
items.weapon.missiles.tomahawk.name=Tomahawk
items.weapon.missiles.tomahawk.stats_desc=Diese Waffe verursacht bei ihrem Ziel _%1$d-%2$d Blutung_.
items.weapon.missiles.tomahawk.typical_stats_desc=Diese Waffe verursacht typischerweise _%1$d-%2$d Blutungen_ beim Ziel.
items.weapon.missiles.trident.desc=Gewaltige Wurfspeere mit drei tödlichen Zinken an der Spitze. Sie sind kraftvoll, aber ziemlich schwer.
items.weapon.missiles.trident.name=Dreizack
items.weapon.spiritbow.ac_shoot=SCHIESSEN
items.weapon.spiritbow.desc=Ein Bogen aus uraltem Zauberholz. Die Sehne und die Verzierungen leuchten in einem blassen Blau. Beim Spannen der Sehne beschwört der Bogen einen magischen Pfeil herauf, der auf einen Feind abgeschossen werden kann.
items.weapon.spiritbow.discover_hint=Einer der Helden beginnt mit diesem Gegenstand.
items.weapon.spiritbow.name=Geisterbogen
items.weapon.spiritbow.prompt=Wählen Sie ein Ziel aus
items.weapon.spiritbow.stats=Der Bogen kann nicht direkt verbessert werden, sondern wird mit jedem Levelaufstieg stärker. Auf deinem aktuellen Level verursachen Pfeile, die mit diesem Bogen abgeschossen werden, _%1$d-%2$d Schaden_ und benötigen _%3$d Stärke_ für eine effektive Nutzung.
items.weapon.weapon$enchantment.discover_hint=Du kannst im Dungeon zufällig einen Gegenstand mit diesem Effekt finden oder versuchen, ihn selbst auf einen Gegenstand anzuwenden.
items.weapon.weapon$enchantment.enchant=Verzauberung
items.weapon.weapon$enchantment.rankings_desc=Durch einen Zauber getötet
items.weapon.weapon.cursed=Man spürt, wie eine bösartige Magie in dieser Waffe lauert.
items.weapon.weapon.cursed_worn=Da diese Waffe verflucht ist, bist du machtlos, sie zu entfernen.
items.weapon.weapon.enchant_hardened=Es wurde gehärtet.
items.weapon.weapon.enchanted=Es hat die Kennung _%s._
items.weapon.weapon.excess_str=Aufgrund deiner übersteigerten Stärke verursachst du mit dieser Waffe _0-%d Bonusschaden_.
items.weapon.weapon.faster=Es wurde erweitert, um die Geschwindigkeit zu erhöhen.
items.weapon.weapon.hardened_no_enchant=Diese Waffe wurde gehärtet, ist aber derzeit nicht verzaubert.
items.weapon.weapon.hardening_gone=Die Härtung dieser Waffe hat nachgelassen!
items.weapon.weapon.identify=Sie kennen Ihre Waffe nun so gut, dass Sie sie identifizieren können.
items.weapon.weapon.incompatible=Durch das Zusammenwirken verschiedener Arten von Magie wurde der Zauber dieser Waffe aufgehoben!
items.weapon.weapon.not_cursed=Diese Waffe ist frei von bösartiger Magie.
items.weapon.weapon.stronger=Es wurde verstärkt, um den Schaden zu erhöhen.
items.weapon.weapon.too_heavy=Aufgrund deiner unzureichenden Stärke wird diese Waffe deine Angriffsgeschwindigkeit, Genauigkeit und Fähigkeit zum Überraschungsangriff beeinträchtigen.
items.weapon.weapon.weak_cursed=Trotz des Fluchs kannst du diese Waffe ablegen.

items.keys.skeletonkey.desc=Dieser Schlüssel sieht ernst aus: Sein Kopf ist wie ein Totenkopf geformt. Wahrscheinlich kann er eine wichtige Tür öffnen.
items.weapon.missiles.bombarrow.desc=Ein Pfeil mit einer daran befestigten Bombe. Halten Sie Abstand!
items.weapon.missiles.bombarrow.name=Bombenpfeil
items.weapon.missiles.missileweapon.damage_desc=Diese Waffe verursacht pro Treffer _%1$d_ bis _%2$d_ Schaden.
items.bags.seedpouch.desc=In diesem kleinen Samtbeutel kannst du beliebig viele Samen aufbewahren. Sehr praktisch.
items.bags.seedpouch.name=Samenbeutel
items.potions.potionofmight.desc=Diese kräftige Flüssigkeit durchströmt deine Muskeln und erhöht dauerhaft deine Stärke um einen Punkt und deine Gesundheit um fünf Punkte.
items.potions.potionofmight.name=Trank der Macht
items.rings.ringofdetection.desc=Mit diesem Ring bemerkst du versteckte Fallen und Geheimtüren, ohne Zeit mit Suchen zu verbringen. Ein verschlechterter Ring trübt deine Sinne und erschwert die Entdeckung selbst dann, wenn du gezielt suchst.
items.rings.ringofdetection.name=Detektionsring
items.rings.ringofhaggler.desc=Dieser Ring hat keine magische Wirkung. Er zeigt Händlern, dass sein Träger der Diebesgilde angehört. Für die Zusage, eine Weile verschont zu bleiben, gewähren sie meist gern einen Rabatt. Verbesserungen des Rings bringen keine weiteren Vorteile.
items.rings.ringofhaggler.name=Ring des Feilschers
items.rings.ringofherbalism.desc=Dieser Ring erhöht deine Chance, beim Niedertrampeln von Gras Tau und Samen zu finden.
items.rings.ringofherbalism.name=Ring der Kräuterkunde
items.rings.ringofmending.desc=Dieser Ring stärkt die Regeneration des Körpers, sodass verlorene Gesundheit schneller zurückkehrt. Ein verschlechterter Ring verlangsamt die natürliche Heilung oder hält sie sogar ganz auf.
items.rings.ringofmending.name=Ring der Regeneration
items.rings.ringofpower.desc=Im Energiefeld dieses Rings werden deine Zauberstäbe mächtiger. Ein verschlechterter Ring schwächt sie stattdessen.
items.rings.ringofpower.name=Ring der Macht
items.rings.ringofsatiety.desc=Mit diesem Ring kommst du länger ohne Nahrung aus. Ein verschlechterter Ring bewirkt das Gegenteil.
items.rings.ringofsatiety.name=Ring der Sättigung
items.rings.ringofshadows.desc=Feinde werden dich seltener bemerken, wenn du diesen Ring trägst. Beschädigte Schattenringe alarmieren Feinde, die deine Anwesenheit sonst vielleicht nicht bemerkt hätten.
items.rings.ringofshadows.name=Ring der Schatten
items.rings.ringofthorns.desc=Dieser Ring hat keine echten Dornen. Trotzdem erleidet jeder Feind, der dich angreift, einen Teil seines verursachten Schadens selbst. Verbesserungen des Rings bringen keine weiteren Vorteile.
items.rings.ringofthorns.name=Dornenring
items.scrolls.scrollofchallenge.desc=Wenn diese Schriftrolle laut vorgelesen wird, ertönt ein ohrenbetäubendes Gebrüll, das alle Monster erweckt und sie auf den Standort des Vorlesers aufmerksam macht.
items.scrolls.scrollofchallenge.name=Herausforderungsrolle
items.scrolls.scrollofenchantment.desc=Diese Schriftrolle kann eine Waffe oder Rüstung mit einer zufälligen Verzauberung versehen und ihr so eine besondere Kraft verleihen.
items.scrolls.scrollofenchantment.name=Schriftrolle der Verzauberung
items.scrolls.scrollofpsionicblast.desc=Diese Schriftrolle enthält zerstörerische Energie, die psionisch kanalisiert werden kann, um allen Kreaturen im Sichtfeld massiven Schaden zuzufügen. Ein begleitender Lichtblitz blendet vorübergehend alle im Wirkungsbereich, einschließlich des Lesers der Schriftrolle.
items.scrolls.scrollofpsionicblast.name=Schriftrolle des psionischen Stoßes
items.scrolls.scrollofwipeout.desc=Lies diese Schriftrolle, um den Zorn der Dungeon-Geister zu entfesseln und alles auf der aktuellen Ebene zu vernichten. Nun ja, fast alles. Einige der mächtigeren Kreaturen könnten verschont bleiben.
items.scrolls.scrollofwipeout.name=Schriftrolle der Vernichtung
items.wands.wandofblink.desc=Mit diesem Zauberstab kannst du dich in die gewählte Richtung teleportieren. Wesen und unbelebte Hindernisse blockieren die Teleportation.
items.wands.wandofblink.name=Zauberstab der Teleportation
items.wands.wandoffirebolt.desc=Dieser Zauberstab schießt magische Feuerstöße. Sie entzünden brennbares Gelände und verletzen und verbrennen getroffene Wesen.
items.wands.wandoffirebolt.name=Zauberstab des Feuerblitzes
