items.weapon.melee.meleeweapon.probably_too_heavy=Diese Waffe ist wahrscheinlich zu schwer für Sie.
items.weapon.melee.meleeweapon.prompt=Ziel auswählen
items.weapon.melee.meleeweapon.stats_known=Diese Nahkampfwaffe der Stufe _tier-%1$d_ verursacht _%2$d-%3$d Schaden_ und erfordert _%4$d Stärke_ für die richtige Anwendung.
items.weapon.melee.meleeweapon.stats_unknown=Typischerweise verursacht diese Nahkampfwaffe der Stufe _tier-%1$d_ Schaden von _%2$d-%3$d und erfordert _%4$d Stärke_ für die richtige Anwendung.
