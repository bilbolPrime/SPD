items.artifacts.talismanofforesight$foresight.desc=Вы адчуваеце моцную нервовасць, быццам побач ёсць нябачная небяспека.
items.artifacts.talismanofforesight$foresight.name=прадбачанне
items.artifacts.talismanofforesight$foresight.uneasy=Вы адчуваеце неспакой.
items.artifacts.talismanofforesight.ac_scry=СКРЫ
items.artifacts.talismanofforesight.desc=Гладкі камень з дзіўнымі гравіроўкамі. Здаецца, што ён назірае за ўсім вакол, сочыць за чымсьці схаваным.
items.artifacts.talismanofforesight.desc_cursed=Пракляты талісман уважліва глядзіць на цябе, прытупляючы твае пачуцці.
items.artifacts.talismanofforesight.desc_worn=Калі вы трымаеце талісман, вы адчуваеце, як вашы пачуцці ўзмацняюцца. Талісман паступова назапашвае зарад з цягам часу і калі вы знаходзіце схаваныя дзверы або пасткі.\n\nТалісман можа расходаваць свой зарад, каб «варажыць» у форме конусу, што адкрывае ўсе пліткі і сакрэты ў вобласці прасканавання, і дае вам бачанне ворагаў і прадметаў на кароткі час.
items.artifacts.talismanofforesight.full_charge=Ваш Талісман цалкам зараджаны!
items.artifacts.talismanofforesight.levelup=Твой талісман мацнее!
items.artifacts.talismanofforesight.low_charge=Для бачэння талісмана патрабуецца не менш за 5% зарада.
items.artifacts.talismanofforesight.name=талісман прадбачання
items.artifacts.talismanofforesight.prompt=Выберыце месца для сканавання.
items.artifacts.timekeepershourglass$sandbag.desc=Гэты невялікі мяшочак з дробным пяском павінен ідэальна падысці да вашага пясочнага гадзінніка.\n\nЗдаецца дзіўным, што ў краме ёсць менавіта гэты прадмет менавіта тады, калі ён вам патрэбны...
items.artifacts.timekeepershourglass$sandbag.levelup=Ты дадаеш пясок у свой пясочны гадзіннік.
items.artifacts.timekeepershourglass$sandbag.maxlevel=Ваш пясочны гадзіннік напоўнены чароўным пяском!
items.artifacts.timekeepershourglass$sandbag.name=мяшок чароўнага пяску
items.artifacts.timekeepershourglass$sandbag.no_hourglass=У цябе няма пясочнага гадзінніка, каб змясціць туды гэты пясок.
items.artifacts.timekeepershourglass$timefreeze.desc=Час вакол вас застывае, што дазваляе імгненна выконваць дзеянні. Эфект будзе доўжыцца, пакуль ён не будзе адменены або ваш пясочны гадзіннік не разрадзіцца. Атака або выкарыстанне магіі таксама перапыніць гэты эфект. \n\nХад да выкарыстання зарада: %s.
items.artifacts.timekeepershourglass$timefreeze.name=Замарожванне часу
items.artifacts.timekeepershourglass.ac_activate=АКТЫВАВАЦЬ
items.artifacts.timekeepershourglass.cursed=Нельга выкарыстоўваць пракляты пясочны гадзіннік.
items.artifacts.timekeepershourglass.deactivate=Вы дэактывуеце замарожванне часу.
items.artifacts.timekeepershourglass.desc=Гэты вялікі пясочны гадзіннік выглядае даволі сціпла, але ў яго вытанчана выразанай аправе адчуваецца вялікая сіла. Калі вы круціце пясочны гадзіннік і назіраеце, як сыплецца пясок, вы можаце адчуць, як яго магія цягне вас, і, безумоўна, выкарыстанне гэтай магіі дасць вам нейкі кантроль над часам.
items.artifacts.timekeepershourglass.desc_cursed=Пракляты пясочны гадзіннік прывязаны да цябе, ты адчуваеш, як ён спрабуе маніпуляваць тваім патокам часу.
items.artifacts.timekeepershourglass.desc_hint=Здаецца, пясочны гадзіннік страціў трохі пяску, калі б толькі можна было яго знайсці...
items.artifacts.timekeepershourglass.freeze=Замры час вакол мяне
items.artifacts.timekeepershourglass.name=пясочны гадзіннік
items.artifacts.timekeepershourglass.no_charge=Ваш пясочны гадзіннік яшчэ не дастаткова зарадзіўся, каб ім можна было карыстацца.
items.artifacts.timekeepershourglass.onfreeze=Усё вакол цябе раптам замірае.
items.artifacts.timekeepershourglass.onstasis=Здаецца, што свет вакол цябе імгненна змяняецца.
items.artifacts.timekeepershourglass.prompt=Як бы вы хацелі выкарыстаць магію пясочнага гадзінніка?\n\nУ стазісе час будзе рухацца нармальна, пакуль вы замарожаныя і цалкам неўразлівыя, спажываючы да 2 зарадаў адначасова.\n\nКалі час замарожаны, вы можаце рухацца так, быццам вашы дзеянні не займаюць часу. Гэта можна дэактываваць у любы час, выкарыстоўваючы пясочны гадзіннік або атакуючы.
items.artifacts.timekeepershourglass.stasis=Уводжу сябе ў застой
items.artifacts.unstablespellbook.ac_add=ДАДАЦЬ
items.artifacts.unstablespellbook.ac_read=ЧЫТАЦЬ
items.artifacts.unstablespellbook.blinded=Нельга чытаць па кнізе, калі ты сляпы.
items.artifacts.unstablespellbook.cursed=Вы не можаце чытаць з праклятай кнігі загавораў.
items.artifacts.unstablespellbook.desc=Гэты том у дзіўна добрым стане, улічваючы яго ўзрост. Ён шыпіць і патрэсквае, калі перагортваць старонкі, напаўняючыся нестабільнай энергіяй. Калі вы чытаеце па гэтай кнізе, невядома, які заклён вы можаце накласці.
items.artifacts.unstablespellbook.desc_cursed=Праклятая кніга прывязала сябе да цябе, яна перашкаджае тваёй здольнасці карыстацца большасцю скруткаў.
items.artifacts.unstablespellbook.desc_empowered=Скруткі, якія вы дадалі ў кнігу, ззяюць сілай. Вы зможаце выбраць экзатычную версію эфектаў гэтых скруткаў, але за дадатковую плату.
items.artifacts.unstablespellbook.desc_index=Кніга няпоўная. У яе індэксе зараз ёсць наступныя пустыя старонкі:
items.artifacts.unstablespellbook.infuse_scroll=Ты ўкладваеш энергію скрутка ў кнігу.
items.artifacts.unstablespellbook.name=нестабільная кніга загавораў
items.artifacts.unstablespellbook.no_charge=У тваёй кнізе загавораў пакуль што няма энергіі.
items.artifacts.unstablespellbook.prompt=Выберыце скрутак
items.artifacts.unstablespellbook.read_empowered=Скрутак, які вы дадалі ў кнігу загавораў, напаўняецца энергіяй. Вы можаце выкарыстоўваць як звычайную, так і экзатычную версію эфекту гэтага скрутка.\n\nВыбар экзатычнага варыянту будзе каштаваць 2 зарады замест 1.
items.artifacts.unstablespellbook.unable_scroll=Вы не можаце дадаць гэты скрутак у кнігу.
items.artifacts.unstablespellbook.unknown_scroll=Вы яшчэ не ўпэўненыя, які гэта тып скрутка.
items.bags.bag.discover_hint=Вы можаце купіць гэты прадмет у краме.
items.bags.bag.name=заплечнік
items.bags.magicalholster.desc=Гэтая тонкая кабура зроблена са скуры экзатычных жывёл і валодае магутнай магіяй, якая дазваляе захоўваць у ёй велізарную колькасць зброі далёкага бою.\n\nВы можаце проста дакрануцца да сумкі і заўсёды дастаць патрэбны прадмет.\n\nДзякуючы магіі кабуры, палачкі будуць зараджацца крыху хутчэй, а кідальная зброя будзе праслужыць крыху даўжэй у ёй.
items.bags.magicalholster.name=чароўная кабура
items.bags.potionbandolier.desc=Гэты тоўсты патронташ аблягае грудзі, як пояс, і мае мноства ізаляваных рамянёў для ўтрымання флаконаў з зеллямі, бурдзюка з вадой або флаконаў з вадкім металам. \n\nУнутры патронташа вашы зелля павінны быць абаронены ад холаду.
items.bags.potionbandolier.name=патронташ для зелляў
items.bags.scrollholder.desc=Гэты трубчасты кантэйнер выглядае так, быццам у ім можна захоўваць інструменты і дыяграмы астранома, але вашы скруткі таксама добра змесцяцца. Ёсць нават некалькі бакавых аддзяленняў, у якія добра змясціцца крышталі загавораў, стылусы для таемных прылад і таемная смала.\n\nТрымальнік выглядае не вельмі лёгкаўзгаральным, таму вашы скруткі павінны быць абаронены ад агню ўнутры.
items.bags.scrollholder.name=трымальнік для скруткаў
items.bags.velvetpouch.desc=У гэтым невялікім аксамітным мяшэчку можна захоўваць мноства дробных прадметаў, такіх як насенне, рунічныя камяні і некаторыя алхімічныя інгрэдыенты.
items.bags.velvetpouch.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.bags.velvetpouch.name=аксамітны мяшочак
items.bombs.arcanebomb.desc=Гэтая бомба нададзена таямнічымі ўласцівасцямі. Яна выбухне магутным выбухам, падобным да атакі Гу, нанясучы _%1$d-%2$d магічную шкоду_ усім, што знаходзіцца ў радыусе 2 клетак.
items.bombs.arcanebomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.arcanebomb.name=таемная бомба
items.bombs.bomb$doublebomb.desc=Стос з дзвюх цяжкіх бомб з чорным порахам, выглядае так, быццам адна табе бясплатная!
items.bombs.bomb$doublebomb.name=дзве бомбы
items.bombs.bomb.ac_lightthrow=СВЯТЛО І КІДАННЕ
items.bombs.bomb.desc=Даволі магутная бомба з чорным порахам. Выбух гэтай бомбы наносіць _%1$d-%2$d пашкоджанняў_ усяму, што побач з ёй, і знішчае некаторыя прылеглыя аб'екты або мясцовасць.
items.bombs.bomb.desc_burning=Запал бомбы згарае, трымайцеся на адлегласці або патушыце яе!
items.bombs.bomb.desc_fuse=Здаецца, што пасля запальвання фітыль згарыць праз пару стрэлаў.
items.bombs.bomb.name=бомба
items.bombs.bomb.ondeath=Выбух забівае цябе...
items.bombs.bomb.rankings_desc=Загінуў у выніку выбуху
items.bombs.bomb.snuff_fuse=Ты хутка задуваеш запал бомбы.
items.bombs.firebomb.desc=Гэтая бомба была мадыфікавана, каб выбухаць на большай плошчы, наносячы _%1$d-%2$d шкоду_ і распаўсюджваючы ўстойлівы агонь у межах 2 клетак.
items.bombs.firebomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.firebomb.name=запальная бомба
items.bombs.flashbangbomb.desc=Гэтая карыстальніцкая бомба пры выбуху выбухне святлом, гукам і электрычнасцю. Усё, што знаходзіцца ў межах 2 клетак, атрымае _%1$d-%2$d пашкоджанняў_ ад выбуху, дадатковыя 25%% пашкоджанняў ад электрычнасці і будзе аглушана на 10 хадоў.
items.bombs.flashbangbomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.flashbangbomb.name=флэшбэм
items.bombs.frostbomb.desc=Гэтая бомба была мадыфікавана, каб выбухаць на большай плошчы, наносячы _%1$d-%2$d шкоду_ і распаўсюджваючы ўстойлівы парыў ледзянога паветра ў межах 2 клетак.
items.bombs.frostbomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.frostbomb.name=марозная бомба
items.bombs.holybomb.desc=Гэтая бомба была мадыфікавана, каб пры выбуху выпраменьваць святое святло на большай плошчы. Усё ў радыусе 2 клетак атрымае _%1$d-%2$d пашкоджанняў_ ад выбуху, а нябожчыкі або дэманікі атрымаюць дадатковыя 50%% пашкоджанняў ад святога святла.
items.bombs.holybomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.holybomb.name=святая бомба
items.bombs.noisemaker.desc=Гэтая карыстальніцкая бомба будзе перыядычна выдаваць гук, калі яе запал скончыцца. Калі што-небудзь дакранецца да бомбы, яна выбухне і нанясе _%1$d-%2$d пашкоджанняў_ усім у межах 2 клетак!
items.bombs.noisemaker.desc_burning=Шумагенератар цокае, ён выбухне, калі што-небудзь наблізіцца!
items.bombs.noisemaker.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.noisemaker.name=шумны чалавек
items.bombs.regrowthbomb.desc=Гэтая спецыяльная бомба будзе распыляць жыватворную вадкасць у радыусе 3 клетак замест выбуху. Тэрыторыя, якая трапіла пад выбух, хутка пакрыецца травой і раслінамі. Вы і любыя саюзнікі, якія трапілі пад выбух, вылечыцеся, быццам выпілі зелле гаення.
items.bombs.regrowthbomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.regrowthbomb.name=бомба для аднаўлення росту
items.bombs.shrapnelbomb.desc=Гэтая бомба была мадыфікавана з дапамогай абрэзкаў металу DM-300, якія пры выбуху разлятаюцца на кавалкі і ляцяць паўсюль, наносячы _%1$d-%2$d шкоду_ у велізарным дыяпазоне вакол бомбы. Лепш хавацца за чым-небудзь, калі ёю карыстаешся...
items.bombs.shrapnelbomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.shrapnelbomb.name=аскепкавая бомба
items.bombs.smokebomb.desc=Гэтая бомба была мадыфікавана такім чынам, каб адначасова з выбухам вывяргаць густое воблака газу. Яна нанясе _%1$d-%2$d пашкоджанняў_ і распаўсюдзіць ахінальны туман у радыусе 2 клетак.
items.bombs.smokebomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.smokebomb.name=дымавая бомба
items.bombs.woollybomb.desc=Гэтая спецыяльная бомба пасля выбуху створыць шырокае поле з чароўных авечак. Выбух нанясе _%1$d-%2$d пашкоджанняў_ усім, што знаходзіцца ў радыусе 2 клетак. Авечкі будуць блакаваць рух і заставацца на месцы вельмі доўга! Аднак авечкі не пратрымаюцца так доўга ў прысутнасці магутных ворагаў, і іх можна хутчэй развеяць уручную, узаемадзейнічаючы з імі.
items.bombs.woollybomb.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.bombs.woollybomb.name=ваўняная бомба
items.brokenseal$warriorshield.desc_active=Зламаная пячатка Воіна дапамагае яму не збівацца з панталыку, даючы яму шчыт у дадатак да здароўя. Пасля спрацоўвання шчыта ёсць час аднаўлення, перш чым яго можна будзе выкарыстаць зноў.\n\nГэты шчыт не змяншаецца з часам, але спыняецца, калі на працягу некалькіх хадоў побач няма ворагаў. Калі ён заканчваецца, любы нявыкарыстаны шчыт скароціць час аднаўлення, максімум да 50%%.\n\nШчыта засталося: %1$d.\n\nБягучы час аднаўлення: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Воін нядаўна атрымаў абарону ад сваёй зламанай пячаткі і павінен пачакаць, пакуль зноў зможа скарыстацца яе эфектам. \n\nХодаў засталося: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Час аднаўлення шчыта Воіна зараз адмоўны, гэта значыць, што пры актывацыі яго шчыта час аднаўлення будзе меншым за звычайныя 150 хадоў. Час аднаўлення шчыта можна знізіць да -150 хадоў, што азначае, што ён будзе даступны зноў адразу пасля актывацыі. \n\nБягучы час аднаўлення: %d.
items.brokenseal$warriorshield.name=Шчыт воіна
items.brokenseal.ac_affix=АФІКС
items.brokenseal.affix=Ты прымацуеш пячатку да сваіх даспехаў!
items.brokenseal.choose_desc=І на гэтых даспехах, і на зламанай пячатцы ёсць гліф. Выберыце, які гліф захаваць. \n\nГліф даспехаў: %1$s\nГліф зламанай пячаткі: %2$s\n\nЗвярніце ўвагу, што калі вы выбераце гліф, які зараз знаходзіцца на даспехах, пячатка не зможа перанесці яго пазней.
items.brokenseal.choose_title=Выберыце гліф
items.brokenseal.cursed_armor=Пячатка не будзе дзейнічаць на праклятую браню.
items.brokenseal.desc=Васковая пячатка, прымацаваная да даспехаў як сімвал доблесці. У цэнтры выгравіравана выцвілая руна абароны, і яна разрэзана напалову пасярэдзіне.\n\nA Пячатка — гэта сувенір з дому, які дапамагае воіну не збівацца з панталыку. Насіць пячатку можна імгненна, калі воін атрымае пашкоджанні ўдвая менш за палову здароўя.\n\nПячатку можна _прымацаваць да даспехаў_ і перамяшчаць паміж даспехамі. Яна можа несці адно паляпшэнне, калі гэтае паляпшэнне было накладзена на даспехі, пакуль да іх была прымацавана пячатка.
items.brokenseal.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.brokenseal.inscribed=На пячатцы выгравіраваны сімвал _%s._.
items.brokenseal.name=пашкоджаная пячатка
items.brokenseal.prompt=Выберыце даспехі
items.brokenseal.unknown_armor=Спачатку вы павінны вызначыць, ці праклятыя гэтыя даспехі.
items.dewdrop.already_full=У цябе ўжо поўнае здароўе.
items.dewdrop.desc=Крышталёва чыстая кропля расы.
items.dewdrop.name=кропля расы
items.dewvial.ac_drink=ВЫПІЦЬ
items.dewvial.auto_drink=Раса з пузырка загаіла вашы раны. Пузырок апусцеў.
items.dewvial.collected=Вы сабралі кроплю расы ў пузырок.
items.dewvial.desc=У гэтым маленькім пузырку можна захоўваць лішнюю расу, каб выпіць яе пазней. Калі пузырок поўны, у момант смяротнай небяспекі раса будзе выпіта аўтаматычна.
