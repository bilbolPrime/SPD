items.artifacts.driedrose.desc_hint=Здаецца, у яе не хапае пялёсткаў. Магчыма, калі іх прымацаваць, ружа стане мацнейшай.
items.artifacts.driedrose.desc_no_quest=Высушаная вытрыманая ружа, якая неяк усё яшчэ трымаецца разам, нягледзячы на свой узрост. \n\nЗдаецца, яна валодае нейкай духоўнай сілай, але вы паняцця не маеце, як ёй зараз карыстацца.
