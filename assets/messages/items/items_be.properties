items.food.chargrilledmeat.desc=Выглядае як прыстойны стэйк.
items.food.chargrilledmeat.discover_hint=Вы можаце зрабіць гэта, выкарыстоўваючы іншы прадукт харчавання.
items.food.chargrilledmeat.name=мяса на грылі
items.food.food.ac_eat=Есці
items.food.food.desc=Нічога асаблівага: сушанае мяса, трохі печыва — такія рэчы.
items.food.food.eat_msg=Гэтая ежа была смачнай!
items.food.food.name=рацыён харчавання
items.food.frozencarpaccio.better=Табе лепш!
items.food.frozencarpaccio.desc=Гэта кавалак замарожанага сырога мяса. Адзіны спосаб з'есці яго — нарэзаць тонкімі лустачкамі. І ў такім выглядзе яно нечакана смачнае.
items.food.frozencarpaccio.discover_hint=Вы можаце зрабіць гэта, выкарыстоўваючы іншы прадукт харчавання.
items.food.frozencarpaccio.hard=Ты адчуваеш, як твая скура цвярдзее!
items.food.frozencarpaccio.invis=Бачыш, твае рукі становяцца нябачнымі!
items.food.frozencarpaccio.name=замарожанае карпаччо
items.food.frozencarpaccio.refresh=Асвяжальна!
items.food.meatpie.desc=Вытанчаны пірог з пікантным мясам. Ён насыціць вас значна лепш, чым любая іншая страва.
items.food.meatpie.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.food.meatpie.eat_msg=Гэтая ежа была неверагоднай!
items.food.meatpie.name=мясны пірог
items.food.mysterymeat$placeholder.name=мяса
items.food.mysterymeat.desc=Есці на свой страх і рызыку!
items.food.mysterymeat.discover_hint=Гэты прадмет можна атрымаць у выглядзе падзення з пэўных ворагаў.
items.food.mysterymeat.eat_msg=Гэтая ежа мела... дзіўны смак.
items.food.mysterymeat.hot=Ой, горача!
items.food.mysterymeat.legs=Ты ж ног не адчуваеш!
items.food.mysterymeat.name=таямнічае мяса
items.food.mysterymeat.not_well=Ты дрэнна сябе адчуваеш.
items.food.mysterymeat.stuffed=Ты наеўся.
items.food.pasty$fishleftover.desc=Трохі рыбы, што засталася з папярэдняга прыёму ежы. Можаце з'есці яе ў любы час, каб крыху здаволіць голад.
items.food.pasty$fishleftover.eat_msg=Гэтая ежа была на смак нармальнай.
items.food.pasty$fishleftover.name=рэшткі рыбы
items.food.pasty.amulet_desc=Вы нарэшце знайшлі яго, чароўны амулет... пачакайце хвілінку, гэта ж проста шакаладка, загорнутая ў фальгу, зробленая так, каб выглядаць як амулет! Ён не дасць вам неабмежаваную сілу, але прынамсі напоўніць вас і дасць невялікі зарад артэфакту. \n\nПершае красавіка!
items.food.pasty.amulet_name=амулет Ендора?
items.food.pasty.cane_desc=Вялізная салодкая цукерка-тросцінка. Яна дастаткова вялікая, каб насыціць вас, і цукар можа крыху зарадзіць вашы палачкі. \n\nЗі святамі!
items.food.pasty.cane_name=цукерка-палачка
items.food.pasty.desc=Сапраўдны карнуэльскі пірог з традыцыйнай начынкай з ялавічыны і бульбы. Вельмі смачна!
items.food.pasty.egg_desc=Вялікае шакаладнае яйка, загорнутае ў рознакаляровую жоўтую фальгу. Тут лёгка хапае шакаладу, каб насыціцца, а цукар можа надаць вашым артэфактам крыху больш стылю. \n\nЗ Вялікаднем!
items.food.pasty.egg_name=велікоднае яйка
items.food.pasty.fish_desc=Цэлая рыба на пару, чароўным чынам захаваная на ложку з зеляніны. У гэты час года існуе традыцыя захоўваць трохі рыбы на потым, каб вы захавалі рэшткі, а не з'елі ўсё адразу. \n\nЗ Новым годам па месячным календары!
items.food.pasty.fish_name=рыба на пару
items.food.pasty.name=пірагісты
items.food.pasty.pie_desc=Вялікі кавалак гарбузовага пірага. Яго салодкі і пікантны смак насыціць вас і дасць вам крыху гаючага эфекту. \n\nЗ Хэлоўінам!
items.food.pasty.pie_name=гарбузовы пірог
items.food.pasty.rainbow_desc=Гэтае маляўнічае зелле — разнавіднасць вадкай ежы. Акрамя таго, што яно задавальняе голад, яно змяшчае трохі магіі, якая супакоіць ворага, які не з'яўляецца босам, і часова прымусіць яго завагацца змагацца з вамі. \n\n З гонарам!
items.food.pasty.rainbow_name=вясёлкавае зелле
items.food.pasty.sparkling_desc=Гэтае ігрыстае зелле — разнавіднасць вадкай ежы. Яно задавальняе голад і імітуе ігрыстае віно, але насамрэч не з'яўляецца алкаголем. Цёплае адчуванне ў жываце трохі абараніць вас. \n\nЗ Новым годам!
items.food.pasty.sparkling_name=ігрыстае зелле
items.food.pasty.vanilla_desc=Гэты вялікі кавалак ванільнага торта пакрыты рознакаляровай пасыпкай і мае блакітную глазуру. Торт быў прыгатаваны ў гонар гадоў вопыту, і калі вы яго з'ясце, вы атрымаеце невялікую долю гэтага вопыту. \n\n Арыгінальная гульня Pixel Dungeon упершыню выйшла 4 снежня 2012 года. З днём нараджэння, Pixel Dungeon!
items.food.pasty.vanilla_name=сіні торт
items.food.phantommeat.desc=Вялікі бліскучы напаўпразрысты стейк, выразаны з прывіднай піраньі. Гэтае чароўнае мяса не патрабуе гатавання і дае шэраг абарончых пераваг, акрамя таго, што цалкам насычае. З'едзенае ў ежу яно дасць нябачнасць, скуру кары, частковае лячэнне і вылечвае ад многіх шкодных наступстваў.
items.food.phantommeat.discover_hint=Гэты прадмет можна атрымаць у выглядзе падзення з пэўных ворагаў.
items.food.phantommeat.name=фантомнае мяса
items.food.smallration.desc=Гэта выглядае як стандартны харчовы рацыён, але меншы па памеры.
items.food.smallration.discover_hint=Вы можаце купіць гэты прадмет у краме.
items.food.smallration.eat_msg=Гэтая ежа была на смак нармальнай.
items.food.smallration.name=невялікі харчовы рацыён
items.food.stewedmeat.desc=Тушэнне мяса ачысціла яго ад любых хвароб і паразітаў. Яно павінна быць бяспечным для ўжывання ў ежу.
items.food.stewedmeat.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.food.stewedmeat.eat_msg=Гэтая ежа была на смак нармальнай.
items.food.stewedmeat.name=тушанае мяса
items.food.supplyration.desc=Гэты рацыён быў пакінуты ў падзямеллі членамі гільдыі злодзеяў для іх. Ён спецыяльна распрацаваны для таго, каб яго ўжывалі на хаду, а таксама дапамагае ў звычайных махлярствах.\n\nХоць ён не насычае так моцна, як звычайны рацыён, яго можна хутка з'есці, ён дае невялікае лячэнне і аднаўляе зарад плашча ценяў Разбойніка.
items.food.supplyration.discover_hint=Вы можаце знайсці гэты прадмет, выкарыстоўваючы пэўны талент героя.
items.food.supplyration.name=рацыён харчавання
items.gold.desc=Куча залатых манет. Збірайце залатыя манеты, каб потым патраціць іх у краме.
items.gold.name=золата
items.heap.artifact=артэфакт
items.heap.chest=Грудзі
items.heap.chest_desc=Вы не даведаецеся, што ўнутры, пакуль не адкрыеце яго!
items.heap.crystal_chest=Крыштальны куфар
items.heap.crystal_chest_desc=Унутры вы можаце ўбачыць _%s_, але каб адкрыць куфар, вам патрэбен крыштальны ключ.
items.heap.for_sale=%1$dg: %2$s
items.heap.locked_chest=Зачынены куфар
items.heap.locked_chest_desc=Ты не даведаешся, што ўнутры, пакуль не адчыніш яго! Але каб адкрыць яго, табе патрэбен залаты ключык.
items.heap.remains=Парэшткі героя
items.heap.remains_desc=Гэта ўсё, што засталося ад аднаго з вашых папярэднікаў. Магчыма, варта праверыць, ці няма тут якіх-небудзь каштоўнасцей.
items.heap.ring=пярсцёнак
items.heap.skeleton=Шкілетныя рэшткі
items.heap.skeleton_desc=Гэта ўсё, што засталося ад нейкага няўдачлівага шукальніка прыгод. Магчыма, варта праверыць, ці няма там якіх-небудзь каштоўнасцей.
items.heap.tomb=Магіла
items.heap.tomb_desc=У гэтай старажытнай магіле можа быць нешта карыснае, але яе ўладальнік напэўна будзе пярэчыць супраць праверкі.
items.heap.wand=палачка
items.honeypot$shatteredpot.desc=Гаршчок разбіты, яго трымае толькі ліпкі мёд, які высцілае яго сценкі, і ён павольна развальваецца.\n\nНягледзячы на разбіты стан, пчала, здаецца, усё яшчэ хоча абараніць гаршчок.
items.honeypot$shatteredpot.name=разбіты гаршчок з мёдам
items.honeypot.ac_shatter=РАЗБІЦЦЁ
items.honeypot.desc=Гэты вялікі гаршчок з мёдам толькі высланы мёдам, замест гэтага ў ім жыве гіганцкая пчала! Такія велізарныя пчолы звычайна жывуць у сваіх вуллях, магчыма, гаршчок — гэта нейкая спецыялізаваная клетка для паляўнічых? Пчала здаецца даволі задаволенай унутры гаршка са сваім мёдам і насцярожана гудзе, калі вы глядзіце на яе.
items.honeypot.name=гаршчок з мёдам
items.item.ac_drop=ПАДЗЕННЕ
items.item.ac_throw=КІНУЦЬ
items.item.curse=праклён
items.item.custom_note=Гэты элемент мае ўласную заўвагу: «_%s_»
items.item.custom_note_type=Гэты тып элемента мае ўласную заўвагу: "_%s_"
items.item.discover_hint=Вы можаце знайсці гэты прадмет выпадковым чынам у падзямеллі.
items.item.prompt=Выберыце кірунак кідка
items.item.rankings_desc=Забіты: %s
items.journal.alchemypage.desc=Вырваная старонка з даведніка па алхіміі.\n\nБольшая частка тэксту занадта дробная, каб чытаць здалёк, але назву старонкі можна разабраць:\n\n_"%s"_
items.journal.alchemypage.name=парваная старонка кнігі па алхіміі
items.journal.documentpage.desc=Адзінокая старонка, напэўна, вырваная з нейкай кнігі. Вам трэба будзе ўзяць яе ў рукі, каб прачытаць.
items.journal.documentpage.name=парваная старонка
items.journal.guidebook.desc=Даведнік шукальніка прыгод, пакінуты тут чалавекам, які вырашыў, што прыгоды — не для яго! Гэтая канкрэтная кніга чароўная і можа падштурхнуць шукальнікаў прыгод прачытаць старонку ў патрэбны момант.\n\nНягледзячы на гэтую функцыянальнасць, кніга найбольш папулярная дзякуючы вялікім словам «Не панікуйце!», напісаным вялікімі прыязнымі літарамі на вокладцы.
items.journal.guidebook.hint_desktop=У вашым даведніку ёсць парады для вас! Націсніце кнопку мігцення дзённіка (%s) у правым верхнім куце, каб прачытаць яго.
items.journal.guidebook.hint_mobile=У вашым даведніку ёсць парады для вас! Націсніце на мігаючую кнопку дзённіка ў правым верхнім куце, каб прачытаць яе.
items.journal.guidebook.hint_status=Даведнік
items.journal.guidebook.name=том майстэрства падзямелля
items.journal.guidepage.desc=Вырваная старонка з даведніка па прыгодах.\n\nБольшая частка тэксту занадта дробная, каб чытаць здалёк, але назву старонкі можна разабраць:\n\n_"%s"_
items.journal.guidepage.name=парваная старонка даведніка
items.journal.regionlorepage$caves.desc=Здаецца, гэта запіс у лётным журнале даследчыка, які, нягледзячы на ўзрост, захаваўся на здзіўленне добра. Вазьміце яго, каб прачытаць.
items.journal.regionlorepage$caves.name=стары запіс у журнале
items.journal.regionlorepage$city.desc=Невялікая іржавая металічная таблічка з чароўным пасланнем, выгравіраваным на ёй. Літары ўсё яшчэ выразныя, нягледзячы на ўзрост таблічкі, але вам трэба будзе ўзяць яе ў рукі, каб прачытаць.
items.journal.regionlorepage$city.name=іржавы планшэт
items.journal.regionlorepage$halls.desc=Невялікая чорная таблічка з выгравіраванымі на ёй падсвечлівымі зялёнымі літарамі. Падсвечвальныя літары зліваюцца ў дымку на адлегласці, вам трэба будзе ўзяць яе ў рукі, каб прачытаць.
items.journal.regionlorepage$halls.name=святлівы планшэт
items.journal.regionlorepage$prison.desc=Запіс у дзённіку ці нейкі іншы дакумент, напісаны на старым аркушы паперы. Здаецца, ён захаваўся лепш, чым лісты, якія вы знайшлі ў каналізацыі, але вам усё роўна трэба будзе яго падняць, каб прачытаць.
items.journal.regionlorepage$prison.name=зношаны запіс у дзённіку
items.journal.regionlorepage$sewers.desc=Нешта падобнае на ліст, напісаны на запэцканым брудам аркушы паперы. Вам трэба будзе падняць яго, каб разабраць, што на ім напісана.
items.journal.regionlorepage$sewers.name=паношаны ліст
items.keys.crystalkey.desc=Зрэзаныя паверхні гэтага крыштальнага ключа мігцяць у цемры. Магчыма, ён адчыніць нешта зробленае з крышталю?
items.keys.crystalkey.name=Крыштальны ключ
items.keys.goldenkey.desc=Выемкі на гэтым залатым ключыку малюсенькія і мудрагелістыя. Магчыма, ён адчыніць замкнёны куфар?
items.keys.goldenkey.name=залаты ключык
items.keys.ironkey.desc=Выемкі на гэтым старажытным жалезным ключы добра паношаныя; яго скураны шнурок пацёрты ад часу. Якія дзверы ён можа адчыніць?
items.keys.ironkey.name=жалезны ключ
items.keys.skeletonkey.name=шкілетны ключ
items.keys.wornkey.desc=Гэты ключ пацёрты і збляклы, але выглядае сур'ёзна. Верагодна, ім можна адчыніць нейкія сур'ёзныя дзверы побач.
items.keys.wornkey.name=зношаны ключ
items.kindofmisc.unequip_message=Спачатку трэба зняць адзін з гэтых прадметаў. Выберыце прадмет для абмену.
items.kindofmisc.unequip_title=Зняць з экіпіроўкі адзін прадмет
items.kindofweapon.empty=пусты
items.kindofweapon.equip_cursed=Твая хватка міжволі сціскае зброю мацней.
items.kindofweapon.swift_equip=Ты хутка экіпіруеш сваю зброю.
items.kindofweapon.which_equip_msg=У які слот зброі вы хацелі б уставіць гэты прадмет?\n\nЧэмпіёнка атакуе непасрэдна сваёй асноўнай зброяй, але можа выкарыстоўваць здольнасці любой з іх. Абедзве зброі маюць аднолькавую колькасць зарадаў.\n\nЧэмпіёнка таксама можа імгненна мяняць месцамі сваю асноўную і другасную зброю.
items.kindofweapon.which_equip_primary=Асноўны (%s)
items.kindofweapon.which_equip_secondary=Другасны (%s)
items.kingscrown.ac_wear=НАСІЦЬ
items.kingscrown.desc=Карона апошняга караля гномаў, яна ззяе велізарнай магічнай энергіяй.\n\nПры надзяванні магія кароны перацячэ ў даспехі, якія вы зараз носіце, ператвараючы іх у _унікальныя эпічныя даспехі са спецыяльнымі здольнасцямі._ Новыя даспехі захаваюць усе ўласцівасці арыгінальных даспехаў.
items.kingscrown.discover_hint=Гэты прадмет можна атрымаць у выглядзе падзення з пэўных ворагаў.
items.kingscrown.naked=На жаль, карона не можа змяніць вашу ніжнюю бялізну.
items.kingscrown.name=Карона караля гномаў
items.kingscrown.ratgraded=Лапы Караля Пацукоў ярка свецяцца, калі вашы даспехі трансфармуюцца!
items.kingscrown.upgraded=Карона ярка свеціцца, а потым распадаецца, калі вашы даспехі трансфармуюцца!
items.liquidmetal.ac_apply=ПАДАЦЬ ЗАЯЎКУ
items.liquidmetal.already_fixed=Гэтая кінутая зброя ўжо ў ідэальным стане!
items.liquidmetal.apply=Вы выкарыстоўваеце вадкі метал %d для рамонту сваёй кідальнай зброі.
items.liquidmetal.desc=Гэтая чароўная вадкасць можа запоўніць расколіны і разрывы на кінутай зброі, аднаўляючы яе да ідэальнага стану! Калі ў камплекце зброі адсутнічае зброя, але яна цалкам адрамантавана, то вадкі метал можна нават выкарыстаць для замены адсутнай зброі з камплекта! \n\nA Для поўнага рамонту зброі 1-га ўзроўню патрабуецца 10 адзінак вадкага металу, а для зброі 5-га ўзроўню — 30. Кожнае паляпшэнне таксама павялічвае колькасць неабходнага металу на 35%. \n\nВадкі метал нельга выкарыстоўваць для рамонту наканечнікаў дроцікаў з наканечнікам.
items.liquidmetal.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.liquidmetal.name=вадкі метал
items.liquidmetal.prompt=Выберыце кідальную зброю
items.lostbackpack.desc=Гэта ваш страчаны інвентар. Збярыце яго, каб вярнуць усе страчаныя прадметы!
items.lostbackpack.name=згублены заплечнік
items.merchantsbeacon.ac_use=ВЫКАРЫСТАННЕ
items.merchantsbeacon.desc=Гэты дзіўны прадмет гномскай тэхналогіі дазваляе вам мець зносіны на вялікіх адлегласцях.\n\nПасля актывацыі гэты маяк дазволіць вам прадаваць прадметы ў Pixel Mart з любой кропкі падзямелля.\n\nАднак магія ўнутры маяка будзе дзейнічаць толькі адзін сеанс, таму выкарыстоўвайце яе з розумам.
items.merchantsbeacon.name=купецкі маяк
items.potions.brews.aquabrew.desc=Калі гэты напой разбіцца, ён выпусціць у месца свайго размяшчэння выбух вады пад ціскам. Яго сілы дастаткова, каб нанесці шкоду вогненным ворагам, але ён таксама распаўсюджвае ваду па бліжэйшай мясцовасці, адключае пасткі, тушыць пажары і адкідвае персанажаў паблізу выбуху.
items.potions.brews.aquabrew.name=аква-вара
items.potions.brews.blizzardbrew.desc=Калі гэты напой разбіць, ён выкліча бурную завею, якая хутка распаўсюджваецца, як газ.
items.potions.brews.blizzardbrew.name=завея
items.potions.brews.brew.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.potions.brews.causticbrew.desc=Гэты напой распаўсюдзіць каразійную жыжу па шырокай прасторы вакол месца разбурэння. Усё, што трапіла ў жыжу, павольна растане, калі яго нельга змыць вадой.
items.potions.brews.causticbrew.name=каўстычная вара
items.potions.brews.infernalbrew.desc=Калі разбіць гэты напой, ён выпусціць лютую агонь, якая хутка распаўсюджваецца, як газ.
items.potions.brews.infernalbrew.name=пякельнае варыва
items.potions.brews.shockingbrew.desc=Калі гэты напой разбіцца, ён выкліча электрычную буру ў шырокай зоне вакол месца разрыву.
items.potions.brews.shockingbrew.name=шакавальны напой
items.potions.brews.unstablebrew.desc=Гэты чароўны напой ззяе зменлівымі колерамі вясёлкі.\n\nКалі выпіць або кінуць яго, выкліча эфект выпадковага зелля. Эфект зелля заўсёды будзе карысным, калі яго выпіць, і заўсёды будзе шкодным, калі яго кінуць.
items.potions.brews.unstablebrew.name=няўстойлівы напой
items.potions.elixirs.elixir.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Вы часова атрымалі аднаўленчыя ўласцівасці, падобныя да ўласцівасцей Гу.\n\nСтоячы ў вадзе, вы будзеце аднаўляць невялікую колькасць здароўя за ход. Эфект прыпыняецца, калі ў вас поўнае здароўе або вы знаходзіцеся па-за вадой.\n\nЗасталося лячэнне: %d.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=воднае лячэнне
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Гэты эліксір утрымлівае рэшткі слізі, узмоцненыя гаючым зеллем. Хоць ён і не забяспечвае імгненнага выздараўлення, ён паступова аднаўляе большую колькасць здароўя, пакуль вы стаіце ў вадзе.
items.potions.elixirs.elixirofaquaticrejuvenation.name=эліксір воднага амаладжэння
items.potions.elixirs.elixirofarcanearmor.desc=Гэты эліксір дасць таму, хто яго вып'е, працяглую ўстойлівасць да магічнай шкоды.
items.potions.elixirs.elixirofarcanearmor.name=эліксір таемнай брані
items.potions.elixirs.elixirofdragonsblood.desc=Пасля ўжывання гэты эліксір напоўніцца агністай сілай, якая працякае па венах таго, хто выпівае. Гэты эфект зробіць таго, хто выпівае, неўспрымальным да агню і дазволіць яму падпальваць ворагаў фізічнымі атакамі.
items.potions.elixirs.elixirofdragonsblood.name=эліксір крыві дракона
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Вы знаходзіцеся пад уздзеяннем эліксіра падзення з пёраў, які дазваляе вам падаць у прорвы, не атрымліваючы пашкоджанняў!\n\nХадоў засталося: %s.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=падзенне пёраў
items.potions.elixirs.elixiroffeatherfall.desc=Гэты эліксір мае больш слабы, але больш кантраляваны эфект левітацыі, дазваляючы таму, хто яго п'е, некаторы час падаць на вялікую адлегласць без шкоды для здароўя.
items.potions.elixirs.elixiroffeatherfall.light=Адчуваеш сябе лёгкім, як пярынка!
items.potions.elixirs.elixiroffeatherfall.name=эліксір ападання пёраў
items.potions.elixirs.elixirofhoneyedhealing.desc=Гэты эліксір спалучае ў сабе гаенне з саладосцю мёду. Калі выпіць яго, ён будзе мець такі ж эфект, як і зелле гаення, і трохі здаволіць голад, але яго таксама можна кінуць, каб вылечыць саюзніка. \n\nІстоты, якія маюць схільнасць да мёду, могуць быць супакоены, калі выкарыстаць гэты прадмет на іх.
items.potions.elixirs.elixirofhoneyedhealing.name=гаючы эліксір з мёду
items.potions.elixirs.elixiroficytouch.desc=Пасля ўжывання гэты эліксір дазволіць высмоктваць цяпло з ворагаў, на якіх ён нападае. Гэты эфект зробіць чалавека неўспрымальным да холаду і дазволіць яму астуджаць ворагаў фізічнымі атакамі.
items.potions.elixirs.elixiroficytouch.name=эліксір ледзянога дотыку
items.potions.elixirs.elixirofmight$htboost.desc=Ваша цела адчувае сябе ненатуральна моцным і здаровым.\n\nВаша максімальнае здароўе павялічваецца на працяглы перыяд часу. Па меры павышэння ўзроўню павышэнне будзе паступова змяншацца.\n\nБягучая велічыня павышэння: %d.\nЗасталося ўзроўняў: %d.
items.potions.elixirs.elixirofmight$htboost.name=максімальны прырост здароўя
items.potions.elixirs.elixirofmight.desc=Гэтая магутная вадкасць будзе працякаць праз вашы мышцы, пастаянна павялічваючы вашу сілу на адзін пункт і часова павялічваючы максімальнае здароўе на %d пунктаў. Павышэнне здароўя залежыць ад вашага максімальнага здароўя, але паступова змяншаецца па меры павышэння ўзроўню.
items.potions.elixirs.elixirofmight.msg=Новаздабытая сіла пранізвае тваё цела, цяпер у цябе ёсць сіла %d!
items.potions.elixirs.elixirofmight.name=эліксір моцы
items.potions.elixirs.elixiroftoxicessence.desc=Пры ўжыванні гэты эліксір напаўняе чалавека таксічнай энергіяй. Той, хто яго выпівае, будзе бесперапынна распаўсюджваць таксічны газ па меры руху і будзе неўспрымальны да таксічнага газу і яду крыху даўжэй, чым працягласць эфекту.
items.potions.elixirs.elixiroftoxicessence.name=эліксір таксічнай эсэнцыі
items.potions.exotic.exoticpotion.amber=экзатычнае бурштынавае зелле
items.potions.exotic.exoticpotion.azure=экзатычнае блакітнае зелле
items.potions.exotic.exoticpotion.bistre=экзатычнае бістр-зелле
items.potions.exotic.exoticpotion.charcoal=экзатычнае вугальнае зелле
items.potions.exotic.exoticpotion.crimson=экзатычнае пунсовае зелле
items.potions.exotic.exoticpotion.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.potions.exotic.exoticpotion.golden=экзатычнае залатое зелле
items.potions.exotic.exoticpotion.indigo=экзатычнае зелле індыга
items.potions.exotic.exoticpotion.ivory=экзатычнае зелле са слановай косці
items.potions.exotic.exoticpotion.jade=экзатычнае нефрытавае зелле
items.potions.exotic.exoticpotion.magenta=экзатычнае пурпуровае зелле
items.potions.exotic.exoticpotion.no=Не, я перадумаў
items.potions.exotic.exoticpotion.silver=экзатычнае сярэбранае зелле
items.potions.exotic.exoticpotion.turquoise=экзатычнае бірузовае зелле
items.potions.exotic.exoticpotion.unknown_desc=Гэтая круглая бутэлька змяшчае крупчастую каляровую вадкасць. Здаецца, яна незвычайная для гэтай зямлі, хто ведае, што з ёй можа здарыцца, калі яе выпіць ці кінуць?
items.potions.exotic.exoticpotion.warning=Вы сапраўды хочаце адмяніць выкарыстанне гэтага зелля? Яно ўсё роўна будзе спажыта.
items.potions.exotic.exoticpotion.yes=Так, я ўпэўнены
items.potions.exotic.potionofcleansing$cleanse.desc=Гэты персанаж часова неўспрымальны да ўсіх шкодных статусных эфектаў!\n\nХодаў засталося: %s.
items.potions.exotic.potionofcleansing$cleanse.name=ачышчаны
items.potions.exotic.potionofcleansing.desc=Гэты магутны рэагент зробіць п'яніцу неўспрымальнай да ўсіх шкодных статусных эфектаў на некалькі хадоў, калі яе выпіць. Яго таксама можна кінуць у цэль, каб ачысціць яе.
items.potions.exotic.potionofcleansing.name=зелле ачышчэння
items.potions.exotic.potionofcorrosivegas.desc=Адкаркоўванне або разбіванне гэтай шклянкі пад ціскам прывядзе да выбуху яе змесціва, ператварыўшыся ў смяротнае воблака каразійнага газу колеру ржавіны. Газ распаўсюджваецца хутчэй, чым таксічны газ, і больш смяротны, але і не дзейнічае так доўга.
items.potions.exotic.potionofcorrosivegas.name=зелле каразійнага газу
items.potions.exotic.potionofdivineinspiration.bonus=+2 балы талентаў!
items.potions.exotic.potionofdivineinspiration.desc=Сіла святой энергіі, ператвораная ў вадкую форму, гэты напой напоўніць таго, хто вып'е, боскай сілай, даючы яму два бонусныя ачкі талентаў на ўзроўні па іх выбары. \n\nГэта зелле можна выкарыстоўваць толькі адзін раз для кожнага ўзроўню талентаў.
items.potions.exotic.potionofdivineinspiration.name=зелле боскага натхнення
items.potions.exotic.potionofdivineinspiration.no_more_points=Вы не можаце атрымаць больш бонусных ачкоў талентаў.
items.potions.exotic.potionofdivineinspiration.select_tier=Выберыце ўзровень таленту, каб атрымаць два бонусныя ачкі. Каб мець магчымасць траціць ачкі, вы павінны разблакіраваць гэты ўзровень.
items.potions.exotic.potionofdragonsbreath.desc=Гэтая колба змяшчае незвычайнае злучэнне, якое загараецца неўзабаве пасля змешвання са сліной. Хуткае выплюванне вадкасці дазволіць карыстальніку выплюнуць полымя з рота!
items.potions.exotic.potionofdragonsbreath.name=зелле дыхання дракона
items.potions.exotic.potionofdragonsbreath.prompt=Выберыце месца для спалення
items.potions.exotic.potionofearthenarmor.desc=Замест таго, каб паралізаваць, гэтая вадкасць аказвае ўмацоўвальны эфект на скуру, ператвараючы яе ў часовую натуральную браню.
items.potions.exotic.potionofearthenarmor.name=зелле земляных даспехаў
items.potions.exotic.potionofmagicalsight.desc=Пасля таго, як вы вып'еце гэта, вашы пачуцці на кароткі час абвастрыцца да неверагоднага ўзроўню, што дазволіць вам бачыць скрозь сцены ў радыусе 12 плітак!
items.potions.exotic.potionofmagicalsight.name=зелле магічнага зроку
items.potions.exotic.potionofmastery.armor_easier=Вашы даспехі лягчэй насіць!
items.potions.exotic.potionofmastery.desc=Замест таго, каб даць грубую сілу, гэта зелле наладжвае мышцы карыстальніка на пэўны прадмет. Гэта зробіць гэты прадмет лягчэйшым у выкарыстанні, як быццам той, хто яго выпіў, практыкаваўся з ім і развіў мышачную памяць.\n\nДля выкарыстання абранай зброі або даспехаў спатрэбіцца на 2 адзінкі сілы менш. Гэта зелле можна выкарыстоўваць толькі адзін раз для кожнага прадмета.
items.potions.exotic.potionofmastery.name=зелле майстэрства
items.potions.exotic.potionofmastery.prompt=Авалодайце прадметам
items.potions.exotic.potionofmastery.weapon_easier=Вашай зброяй стане лягчэй валодаць!
items.potions.exotic.potionofshielding.desc=Замест таго, каб лячыць, гэта зелле стварае трывалы шчыт вакол цела карыстальніка, блакуючы значную колькасць шкоды.
items.potions.exotic.potionofshielding.name=зелле абароны
items.potions.exotic.potionofshroudingfog.desc=Пры кантакце з паветрам вадкасць у гэтай колбе ўтварае густы дымны туман, які хутка распаўсюджваецца і блакуе зрок вашых ворагаў.
items.potions.exotic.potionofshroudingfog.name=зелле ахутаючага туману
items.potions.exotic.potionofsnapfreeze.desc=Хімічнае рэчыва, якое змяшчаецца ў гэтым зеллі, хутка рэагуе з паветрам, імгненна замарожваючы і знішчаючы ўсё, што знаходзіцца пад яго ўздзеяннем.
items.potions.exotic.potionofsnapfreeze.name=зелле хуткага замарожвання
items.potions.exotic.potionofstamina.desc=Ужыванне гэтай дзіўна салодкай вадкасці напоўніць вас працяглым прылівам энергіі, што дазволіць вам бегаць у паскораным тэмпе на працягу доўгага перыяду часу.
items.potions.exotic.potionofstamina.name=зелле цягавітасці
items.potions.exotic.potionofstormclouds.desc=Кіданне гэтага зелля створыць хутка распаўсюджваючуюся хмару канцэнтраванай пары, якая будзе кандэнсавацца і ліцца на навакольнае асяроддзе. Большая частка мясцовасці ператворыцца ў ваду, вогненныя ворагі атрымаюць пашкоджанні, агонь будзе патушаны, а пасткі будуць перагружаныя і разбураныя.
items.potions.exotic.potionofstormclouds.name=зелле навальнічных хмар
items.potions.potion$placeholder.name=зелле
items.potions.potion$seedtopotion.name=Выпадковае зелле
items.potions.potion.ac_drink=ВЫПІЦЬ
items.potions.potion.amber=бурштынавае зелле
items.potions.potion.azure=блакітнае зелле
items.potions.potion.beneficial=Карыснае зелле
items.potions.potion.bistre=бістр-зелле
items.potions.potion.charcoal=вугальнае зелле
items.potions.potion.crimson=пунсовае зелле
items.potions.potion.discover_hint=Вы можаце знайсці гэты прадмет выпадковым чынам у падзямеллі або стварыць яго з дапамогай алхіміі.
items.potions.potion.golden=залатое зелле
items.potions.potion.harmful=Шкоднае зелле!
items.potions.potion.indigo=зелле індыга
items.potions.potion.ivory=зелле са слановай косці
items.potions.potion.jade=нефрытавае зелле
items.potions.potion.magenta=пурпурнае зелле
items.potions.potion.no=Не, я перадумаў
items.potions.potion.shatter=Колба разбілася, і вадкасць бясшкодна разляцелася.
items.potions.potion.silver=сярэбранае зелле
items.potions.potion.sure_drink=Ты ўпэўнены, што хочаш гэта выпіць? У большасці выпадкаў табе варта кідаць такія зелля ў ворагаў.
items.potions.potion.sure_throw=Ты ўпэўнены, што хочаш гэта выкінуць? У большасці выпадкаў мае сэнс гэта выпіць.
items.potions.potion.turquoise=бірузовае зелле
items.potions.potion.unknown_desc=У гэтай колбе віруе вадкасць %s. Хто ведае, што будзе, калі выпіць яе ці кінуць колбу?
items.potions.potion.yes=Так, я ведаю, што раблю
items.potions.potionofexperience.desc=Гэты напой, які імгненна павысіць ваш узровень вопыту, — гэта гістарычны вопыт мноства бітваў, ператвораны ў вадкасць.
items.potions.potionofexperience.name=зелле вопыту
items.potions.potionoffrost.desc=На адкрытым паветры гэтае рэчыва выпараецца ў ледзяное воблака. Кожная істота, якая дакранецца да яго, замерзне на месцы і не зможа ні рухацца, ні дзейнічаць.
items.potions.potionoffrost.name=зелле марозу
items.potions.potionofhaste.desc=Ужыванне гэтай дзіўна салодкай вадкасці на кароткі час напоўніць вас велізарнай энергіяй, што дазволіць вам бегаць з высокай хуткасцю.
items.potions.potionofhaste.energetic=Вы адчуваеце сябе энергічным!
items.potions.potionofhaste.name=зелле паспешнасці
items.potions.potionofhealing.desc=Эліксір, які імгненна адновіць усё здароўе і вылечыць атручэнне.
items.potions.potionofhealing.heal=Твае раны пачынаюць зацягвацца.
items.potions.potionofhealing.name=зелле лячэння
items.potions.potionofinvisibility.desc=Гэтае зелле на пэўны час зробіць цябе нябачным для ворагаў. Атака на ворага ці выкарыстанне жазла або скрутка ў яго на вачах скасуе дзеянне зелля.
items.potions.potionofinvisibility.invisible=Бачыш, твае рукі становяцца нябачнымі!
items.potions.potionofinvisibility.name=зелле нябачнасці
items.potions.potionoflevitation.desc=Гэтая дзіўная вадкасць дазволіць лунаць у паветры і лёгка пералятаць праз пасткі. Але полымя і газы запаўняюць і паветра, таму так іх не абмінуць.
items.potions.potionoflevitation.float=Ты лунаеш у паветры!
items.potions.potionoflevitation.name=зелле левітацыі
items.potions.potionofliquidflame.desc=Гэтая колба змяшчае няўстойлівае злучэнне, якое можа моцна ўспыхнуць пры кантакце з адкрытым паветрам.
items.potions.potionofliquidflame.name=зелле вадкага полымя
items.potions.potionofmindvision.desc=Пасля таго, як вы вып'еце гэта, ваш розум настроіцца на псіхічныя сігналы далёкіх істот, што дазволіць вам адчуваць біялагічную прысутнасць праз сцены. Таксама гэта зелле дазволіць вам бачыць скрозь бліжэйшыя сцены і дзверы.
items.potions.potionofmindvision.name=зелле ўяўнага зроку
items.potions.potionofmindvision.see_mobs=Неяк можна адчуць прысутнасць розумаў іншых істот!
items.potions.potionofmindvision.see_none=Ты неяк можаш сказаць, што ты зараз адзін на гэтым узроўні.
items.potions.potionofparalyticgas.desc=Пры ўздзеянні на адкрытае паветра вадкасць у гэтай колбе выпараецца, ператвараючыся ў аглушальны жоўты туман. Той, хто ўдыхне гэтую хмару, імгненна паралізуецца і не зможа рухацца некаторы час пасля таго, як яна рассейваецца. Гэты прадмет можна кінуць у аддаленых ворагаў, каб злавіць іх у зоне дзеяння газу.
items.potions.potionofparalyticgas.name=зелле паралітычнага газу
items.potions.potionofpurity.desc=Гэтае рэчыва хутка абясшкоджвае ўсе шкодныя газы ў зоне дзеяння. Калі яго выпіць, яно на пэўны час абароніць ад такіх газаў.
items.potions.potionofpurity.freshness=У паветры адчуваецца незвычайная свежасць.
items.potions.potionofpurity.name=Зелле ачышчэння
items.potions.potionofpurity.protected=Ахоўная плёнка ахінае вас!
items.potions.potionofstrength.desc=Гэтая магутная вадкасць будзе праходзіць праз вашы мышцы, назаўсёды павялічваючы вашу сілу на адзін пункт.
items.potions.potionofstrength.msg=Новаздабытая сіла пранізвае тваё цела, цяпер у цябе ёсць сіла %d!
items.potions.potionofstrength.name=зелле сілы
items.potions.potionoftoxicgas.desc=Адкаркоўванне або разбіванне гэтай шклянкі пад ціскам прывядзе да выбуху яе змесціва, ператварыўшыся ў смяротнае воблака таксічнага зялёнага газу. Вы можаце кінуць гэта зелле ў далёкіх ворагаў, замест таго, каб адкаркоўваць яго ўручную.
items.potions.potionoftoxicgas.name=зелле таксічнага газу
items.quest.ceremonialcandle.desc=Набор свечак, расплаўленых і злучаных разам у выніку выкарыстання. \n\nАсобна яны нічога не вартыя, але пры выкарыстанні з іншымі свечкамі ў пэўным узоры яны могуць сканцэнтраваць энергію для рытуалу выклікання.
items.quest.ceremonialcandle.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
items.quest.ceremonialcandle.name=цырыманіяльная свечка
items.quest.corpsedust.chill=Па спіне прабягае дрыжыкі.
items.quest.corpsedust.desc=Шар трупнага пылу знешне не адрозніваецца ад звычайнага. Але ў ім хаваецца злавесная энергія.\n\nБыло б добра пазбавіцца ад яго як мага хутчэй.
items.quest.corpsedust.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
items.quest.corpsedust.name=трупны пыл
items.quest.darkgold.desc=Гэты метал называюць цёмным не з-за яго колеру (ён нічым не адрозніваецца ад звычайнага золата), а таму, што ён плавіцца пад дзённым святлом, робячы яго паверхнева непрыдатным.
items.quest.darkgold.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
items.quest.darkgold.name=цёмна-залатая руда
items.quest.darkgold.you_now_have=Цяпер у вас ёсць цёмна-залатая руда %d.
items.quest.dwarftoken.desc=Многія гномы і некаторыя з іх буйнейшых стварэнняў носяць гэтыя маленькія кавалкі металу невядомага прызначэння. Магчыма, гэта ўпрыгажэнні ці нейкія пасведчанні асобы. Гномы — дзіўны народ.
items.quest.dwarftoken.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
items.quest.dwarftoken.name=жэтон гнома
items.quest.embers.desc=Асаблівыя вуголлі, якія можна здабыць толькі з маладых элементаляў агню. Яны выпраменьваюць цеплавую энергію.
items.quest.embers.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
items.quest.embers.name=элементарныя вуголлі
items.quest.escapecrystal.ac_use=ВЫКАРЫСТАННЕ
items.quest.escapecrystal.desc=Тонкі магічны крышталь загавораў, які, здаецца, утрымлівае магію тэлепартацыі. Вы можаце выкарыстаць крышталь у любы час, каб пакінуць гномскае сховішча, але вы нічога не зможаце з сабой забраць!
items.quest.escapecrystal.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
items.quest.escapecrystal.name=крышталь уцёкаў
items.quest.gooblob.desc=Хрумсткі камяк клею, які аддзяліўся ад паміраючага Гу. Ён амаль як вялікі шар жэле, хоць вы б не адважыліся яго з'есці.\n\nСамо па сабе ён нічога не робіць, але можа быць карысным у спалучэнні з пэўнымі зеллямі або бомбай. Як мінімум, ён павінен пераўтварацца ў прыстойную колькасць энергіі.
items.quest.gooblob.discover_hint=Гэты прадмет можна атрымаць у выглядзе падзення з пэўных ворагаў.
items.quest.gooblob.name=кавалачак клею
items.quest.metalshard.desc=Асколак іржавага праклятага металу, які адламаўся ад DM-300 падчас яго знішчэння. У ім можна адчуць неактыўную злосную магію.\n\nСамо па сабе ён нічога не робіць, але можа быць карысным у спалучэнні з пэўнымі скруткамі або бомбай. Як мінімум, ён павінен пераўтварацца ў прыстойную колькасць энергіі.
items.quest.metalshard.discover_hint=Гэты прадмет можна атрымаць у выглядзе падзення з пэўных ворагаў.
items.quest.metalshard.name=пракляты металічны асколак
items.quest.pickaxe.ability_desc=Дуэлянт можа _прабіць_ ворага кіркай. Гэта гарантавана трапіць у ворага, накладвае ўразлівасць на 3 хады і наносіць _%1$d-%2$d шкоду_ ворагам з цвёрдай скурай.
items.quest.pickaxe.ability_name=прабіць
items.quest.pickaxe.desc=Гэта трывалая і цяжкая прылада для разбівання камянёў. Вам не трэба карыстацца кіркай, каб здабываць з яе дапамогай карысныя выкапні, але, верагодна, яе можна выкарыстоўваць як зброю ў крайнім выпадку.
items.quest.pickaxe.discover_hint=Вы можаце знайсці гэты прадмет падчас выканання пэўнага квэста.
items.quest.pickaxe.name=кірка
items.quest.pickaxe.upgrade_ability_stat_name=Шкода ад здольнасцей
items.quest.ratskull.desc=Дзіўна вялікі чэрап пацука. Ён быў бы выдатным паляўнічым трафеем, калі б у вас была сцяна, каб павесіць яго на яе.
items.quest.ratskull.name=чэрап гіганцкага пацука
items.remains.bowfragment.desc=Гэты зламаны кавалак дрэва калісьці быў часткай духоўнага лука згубленай Паляўнічай. Вы ўсё яшчэ можаце адчуць трохі прыроднай энергіі, якая засталася ў фрагменце, вы можаце выкарыстаць яго, каб вырасціць вакол сябе высокую траву. Аднак гэта знішчыць фрагмент.
items.remains.bowfragment.name=фрагмент лука
items.remains.brokenhilt.desc=Здаецца, гэтая зламаная рукаяць ад зброі пераможанага дуэлянта. У ёй усё яшчэ адчуваецца трохі баявой сілы, якую можна выкарыстаць, каб атрымаць невялікую дадатковую шкоду пры наступных двух ударах у блізкім бою. Аднак гэта знішчыць рукаяць.
items.remains.brokenhilt.name=зламаная рукаяць
items.remains.brokenstaff.desc=Гэты посах мага быў зламаны напалову пасля смерці яго ўладальніка. Вы ўсё яшчэ можаце адчуць некаторую магічную энергію, якая засталася ў посаху, вы можаце выкарыстоўваць яго, каб трохі павялічыць зарад сваіх палачак. Аднак гэта знішчыць посах.
items.remains.brokenstaff.name=зламаны персанал
items.remains.cloakscrap.desc=Гэты кавалачак напаўпразрыстай тканіны выглядае так, быццам ён паходзіць з плашча ценяў нябожчыка Разбойніка. У ім усё яшчэ адчуваецца трохі містычнай энергіі, якую можна выкарыстоўваць, каб трохі зарадзіць свае артэфакты. Аднак гэта знішчыць тканіну.
items.remains.cloakscrap.name=кавалачак тканіны
items.remains.remainsitem.ac_use=ВЫКАРЫСТАННЕ
items.remains.remainsitem.discover_hint=Вы можаце знайсці гэты прадмет у рэштках пэўнага героя з папярэдняга прайгранага забегу.
items.remains.sealshard.desc=Гэтыя малюсенькія аскепкі чырвонага воску выглядаюць так, быццам яны паходзяць з пячаткі загінулага воіна. Вы ўсё яшчэ можаце адчуць сілу волі, якая трымаецца за пячатку, вы можаце выкарыстаць яе, каб стварыць сабе абарону. Аднак гэта знішчыць аскепкі пячаткі.
items.remains.sealshard.name=аскепкі пячаткі
items.remains.tornpage.desc=Гэтая старонка выглядае так, быццам яе вырвалі з пратэрмінаванага святога фаліянта клірыка. На ёй усё яшчэ ёсць трохі боскай энергіі, якую можна выкарыстаць, каб аднавіць крыху здароўя. Аднак гэта знішчыць разарваную старонку.
items.remains.tornpage.name=парваная старонка
items.rings.ring.agate=агатавы пярсцёнак
items.rings.ring.amethyst=аметыставае кольца
items.rings.ring.curse_known=У гэтым пярсцёнку хаваецца злавесная магія.
items.rings.ring.cursed_worn=Паколькі гэтае кольца праклятае, ты не можаш яго зняць.
items.rings.ring.diamond=дыяментавае кольца
items.rings.ring.emerald=смарагдавы пярсцёнак
items.rings.ring.equip_cursed=Пярсцёнак балюча зацягваецца вакол пальца!
items.rings.ring.garnet=пярсцёнак з гранатам
items.rings.ring.identify=Цяпер вы дастаткова добра знаёмыя са сваім пярсцёнкам, каб яго ідэнтыфікаваць.
items.rings.ring.known=Гэта %s
items.rings.ring.not_cursed=Гэты пярсцёнак вольны ад злога магічнага ўплыву.
items.rings.ring.onyx=пярсцёнак з оніксам
items.rings.ring.opal=пярсцёнак з опалам
items.rings.ring.quartz=кварцавае кольца
items.rings.ring.ruby=рубінавае кольца
items.rings.ring.sapphire=сапфіравы пярсцёнак
items.rings.ring.topaz=пярсцёнак з тапазам
items.rings.ring.tourmaline=турмалінавы пярсцёнак
items.rings.ring.unknown_desc=Гэты металічны пярсцёнак аздоблены вялікім %s, які зіхаціць у цемры. Хто ведае, што будзе, калі яго надзець?
items.rings.ringofaccuracy.combined_stats=Вашы абсталяваныя кольцы аб'ядноўваюць сваю сілу, павялічваючы вашу дакладнасць у агульнай складанасці на _%s%%_.
