items.artifacts.etherealchains.cursed=Нельга выкарыстоўваць праклятыя ланцугі.
items.artifacts.etherealchains.desc=Гэтыя вялікія, але лёгкія ланцугі свецяцца духоўнай энергіяй. Іх можна выкарыстоўваць, каб прыцягваць вас да мясцовасці або ворагаў. Эфірная прырода ланцугоў дазваляе ім нават праходзіць скрозь сцены!
items.artifacts.etherealchains.desc_cursed=Праклятыя ланцугі прыкаваныя да цябе, пастаянна гайдаюцца, спрабуючы падчапіць ці звязаць цябе.
items.artifacts.etherealchains.desc_equipped=Ланцугі абвіваюцца вакол вас, павольна высмоктваючы духоўную энергію тых, каго вы пераможаце. Кожны зарад — гэта звяно ў ланцугу, які будзе распаўсюджвацца роўна на адну клетку.
items.artifacts.etherealchains.does_nothing=Гэта нічога не дасць.
items.artifacts.etherealchains.inside_wall=Твае ланцугі могуць працягнуць цябе толькі скрозь сцены, а не ўнутр.
