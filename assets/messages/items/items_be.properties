items.weapon.weaponeffects.weaponeffect.smite.prefix=Варварскі
items.weapon.weaponeffects.weaponeffect.smite.name=%s варвара
items.weapon.weaponeffects.weaponeffect.smite.desc=Гэта _варварская_ зброя. Пры траплянні з імавернасцю _20%_ яна ўжывае _Удар 1-га ўзроўню_.
items.weapon.weaponeffects.weaponeffect.smite.activate=Удар!

items.weapon.weaponeffects.weaponeffect.knockback.prefix=Адштурхоўвальны
items.weapon.weaponeffects.weaponeffect.knockback.name=%s адштурхоўвання
items.weapon.weaponeffects.weaponeffect.knockback.desc=Гэта _адштурхоўвальная_ зброя. Пры траплянні з імавернасцю _20%_ яна адкідае ворага на _адну клетку_. Босаў адштурхнуць нельга.
items.weapon.weaponeffects.weaponeffect.knockback.activate=Адкідванне!

items.weapon.weaponeffects.weaponeffect.venom.prefix=Змяіны
items.weapon.weaponeffects.weaponeffect.venom.name=%s змяі
items.weapon.weaponeffects.weaponeffect.venom.desc=Гэта _змяіная_ зброя. Пры траплянні з імавернасцю _20%_ яна атручвае цэль.
items.weapon.weaponeffects.weaponeffect.venom.activate=Атрута!

items.weapon.weaponeffects.weaponeffect.kneeshot.prefix=Калечны
items.weapon.weaponeffects.weaponeffect.kneeshot.name=%s калецтва
items.weapon.weaponeffects.weaponeffect.kneeshot.desc=Гэта зброя _калечыць_. Далёкія атакі, якія трапілі ў цэль, з імавернасцю _20%_ выклікаюць у ворага кульгавасць на _10 хадоў_. На босаў не дзейнічае.
items.weapon.weaponeffects.weaponeffect.kneeshot.activate=Кульгавасць!

items.weapon.weaponeffects.weaponeffect.spark.prefix=Рунічны
items.weapon.weaponeffects.weaponeffect.spark.name=%s рун
items.weapon.weaponeffects.weaponeffect.spark.desc=Гэта _рунічная_ палачка. Яе магія з імавернасцю _20%_ выклікае _Іскру_, наносячы _4–8_ дадатковага магічнага ўрону.
items.weapon.weaponeffects.weaponeffect.spark.activate=Іскра!

items.weapon.weaponeffects.weaponeffect.curse.prefix=Праклінальны
items.weapon.weaponeffects.weaponeffect.curse.name=%s праклёну
items.weapon.weaponeffects.weaponeffect.curse.desc=Гэта палачка _праклінае_. Яе магія з імавернасцю _20%_ аслабляе цэль, змяншаючы нанесены ёю ўрон на _5%_ на _10 хадоў_.
items.weapon.weaponeffects.weaponeffect.curse.activate=Праклён!

items.weapon.weaponeffects.weaponeffect.drainlife.prefix=Паглынальны
items.weapon.weaponeffects.weaponeffect.drainlife.name=%s паглынання
items.weapon.weaponeffects.weaponeffect.drainlife.desc=Гэта палачка _паглынае жыццё_. Яе магія з імавернасцю _20%_ наносіць _8–16_ дадатковага магічнага ўрону і аднаўляе вам столькі здароўя, колькі забрала ў цэлі.
items.weapon.weaponeffects.weaponeffect.drainlife.activate=Паглынанне!

items.armor.armorprefix.stalwart.name=%s стойкасці
items.armor.armorprefix.stalwart.desc=Гэтая браня дае _стойкасць_. Атакі ворагаў з імавернасцю _20%_ актывуюць _Моцнасць 5-га ўзроўню_, змяншаючы свой урон на _20%_.
items.armor.armorprefix.stalwart.activate=Моцнасць!

items.armor.armorprefix.vigilant.name=%s пільнасці
items.armor.armorprefix.vigilant.desc=Гэтая браня дае _пільнасць_. З імавернасцю _20%_ яна дазваляе ўхіліцца ад далёкай атакі ворага.
items.armor.armorprefix.vigilant.activate=Пільнасць!

items.armor.armorprefix.elusive.name=%s няўлоўнасці
items.armor.armorprefix.elusive.desc=Гэтая браня робіць вас _няўлоўным_. Атрымаўшы ўрон ад атакі ворага, вы з імавернасцю _20%_ павышаеце ўхіленне на _5_ на _5 хадоў_.
items.armor.armorprefix.elusive.activate=Ухіленне!
