items.rings.ringofevasion.name=пярсцёнак ухілення
items.rings.ringofevasion.stats=Пры нашэнні гэтага кольца вы павялічыце сваю здольнасць ухіляцца ад кідкоў на _%s%%._
items.rings.ringofevasion.typical_stats=Пры нашэнні гэты пярсцёнак звычайна павялічвае вашу здольнасць ухіляцца ад кідкоў на _%s%%._
items.rings.ringofevasion.upgrade_stat_name_1=Павышэнне ўхілення
items.rings.ringofforce$brawlersstance.desc=У гэтай стойцы звычайныя атакі Дуэлянткі будуць выкарыстоўваць экіпіраванае кольца сілы, нават калі ў яе ёсць зброя. Гэтыя атакі атрымліваюць бонусную шкоду і ўсё яшчэ выкарыстоўваюць паляпшэнне і зачараванне зброі.\n\nАднак падтрыманне гэтай стойкі патрабуе канцэнтрацыі, што зніжае хуткасць перазарадкі здольнасцей зброі на 50%.\n\nГэтую стойку можна ўключаць і выключаць з дапамогай кольца сілы, але зніжэнне хуткасці зарадкі будзе захоўвацца некаторы час, калі стойка хутка актывуецца і дэактывуецца.
items.rings.ringofforce$brawlersstance.name=пазіцыя скандаліста
items.rings.ringofforce.ability_desc=Дуэлянтка можа прыняць _стойку бойцы_ з гэтым пярсцёнкам, што прывядзе да таго, што яе звычайныя атакі заўсёды будуць выкарыстоўваць гэта пярсцёнак, нават калі яна мае зброю. Гэтыя атакі будуць наносіць _%1$d-%2$d шкоду_, а таксама атрымаюць у спадчыну зачараванне і паляпшэнне зброі. Гэтая стойнасць запавольвае хуткасць перазарадкі зброі на 50%%.
items.rings.ringofforce.ability_name=пазіцыя скандаліста
items.rings.ringofforce.combined_stats=Вашы кольцы аб'ядноўваюць сваю сілу, наносячы ў агульнай складанасці _%1$d-%2$d ўрону_ без зброі або павялічваючы ўрон на _%3$d_ з адной зброяй.
items.rings.ringofforce.desc=Гэты пярсцёнак павялічвае сілу ўдараў блізкага бою таго, хто яго носіць. Гэтая дадатковая сіла даволі слабая пры выкарыстанні зброі, але атака без зброі будзе значна мацнейшай. Пракляты пярсцёнак замест гэтага аслабіць удары таго, хто яго носіць.
items.rings.ringofforce.name=кальцо сілы
items.rings.ringofforce.stats=Калі вы без зброі, пры вашай цяперашняй сіле, гэта пярсцёнак нанясе _%1$d-%2$d ўрону._ Са зброяй у руках гэта пярсцёнак павялічыць ўрон на _%3$d._
items.rings.ringofforce.typical_ability_desc=Дуэлянтка можа прыняць _стойку бойцы_ з гэтым пярсцёнкам, што прывядзе да таго, што яе звычайныя атакі заўсёды будуць выкарыстоўваць гэта пярсцёнак, нават калі яна мае зброю. Гэтыя атакі звычайна наносяць _%1$d-%2$d шкоду_, а таксама наследуюць зачараванне і паляпшэнне зброі. Гэтая стойнасць запавольвае хуткасць перазарадкі зброі на 50%%.
items.rings.ringofforce.typical_stats=Калі вы без зброі, пры вашай цяперашняй сіле, гэтае кольца звычайна наносіць _%1$d-%2$d ўрону._ Са зброяй, якое вы маеце на руках, гэтае кольца звычайна павялічвае ўрон на _%3$d._
items.rings.ringofforce.upgrade_stat_name_1=Пашкоджанні без зброі
items.rings.ringofforce.upgrade_stat_name_2=Павышэнне ўзброенага ўрону
items.rings.ringofforce.upgrade_stat_name_3=Шкода ад здольнасцей
items.rings.ringoffuror.combined_stats=Вашы абсталяваныя кольцы аб'ядноўваюць сваю сілу, павялічваючы хуткасць вашых атак у агульнай складанасці на _%s%%_.
items.rings.ringoffuror.desc=Гэты пярсцёнак надзяляе ўладальніка ўнутранай лютасцю, што дазваляе яму атакаваць хутчэй. Пракляты пярсцёнак замест гэтага запавольвае хуткасць атакі.
items.rings.ringoffuror.name=кольца гневу
items.rings.ringoffuror.stats=Пры нашэнні гэты пярсцёнак павялічыць хуткасць вашых атак на _%s%%._
items.rings.ringoffuror.typical_stats=Пры нашэнні гэты пярсцёнак звычайна павялічвае хуткасць вашых атак на _%s%%._
items.rings.ringoffuror.upgrade_stat_name_1=Павышэнне хуткасці атакі
items.rings.ringofhaste.combined_stats=Вашы кольцы аб'ядноўваюць сваю сілу, павялічваючы хуткасць вашага перамяшчэння ў агульнай складанасці на _%s%%_.
items.rings.ringofhaste.desc=Гэты пярсцёнак паскарае плынь часу для свайго ўладальніка, дазваляючы рабіць усё крыху хутчэй.
items.rings.ringofhaste.name=пярсцёнак хуткасці
items.rings.ringofhaste.stats=Пры нашэнні гэты пярсцёнак павялічыць хуткасць вашага перамяшчэння на _%s%%._
items.rings.ringofhaste.typical_stats=Пры нашэнні гэтае кольца звычайна павялічвае хуткасць вашага перамяшчэння на _%s%%._
items.rings.ringofhaste.upgrade_stat_name_1=Паскарэнне хуткасці руху
items.rings.ringofmight.combined_stats=Вашы кольцы, якія вы абсталявалі, аб'ядноўваюць сваю моц, павялічваючы вашу сілу на _%1$d_ і максімальны запас здароўя на _%2$s%%_ у цэлым.
items.rings.ringofmight.desc=Гэты пярсцёнак узмацняе фізічныя рысы таго, хто яго носіць, надаючы яму большую фізічную сілу і целасклад. Пракляты пярсцёнак аслабіць таго, хто яго носіць.
items.rings.ringofmight.name=кальцо магутнасці
items.rings.ringofmight.stats=Пры нашэнні гэты пярсцёнак павялічыць вашу сілу на _%1$d_ і максімальны запас здароўя на _%2$s%%._
items.rings.ringofmight.typical_stats=Пры нашэнні гэты пярсцёнак звычайна павялічвае вашу сілу на _%1$d_ і максімальны запас здароўя на _%2$s%%._
items.rings.ringofmight.upgrade_stat_name_1=павышэнне сілы
items.rings.ringofmight.upgrade_stat_name_2=Максімальнае павелічэнне HP
items.rings.ringofsharpshooting.combined_stats=Вашы абсталяваныя кольцы аб'ядноўваюць сваю сілу, павышаючы эфектыўны ўзровень кідальнай зброі на _%1$d_ і павялічваючы іх трываласць на _%2$s%%_ у цэлым.
items.rings.ringofsharpshooting.desc=Гэты пярсцёнак паляпшае дакладнасць і прыцэльванне таго, хто яго носіць, што зробіць усю кідальную зброю больш разбуральнай і трывалай. Пракляты пярсцёнак будзе мець супрацьлеглы эфект.
items.rings.ringofsharpshooting.name=кальцо трапнай стральбы
items.rings.ringofsharpshooting.stats=Пры нашэнні гэты пярсцёнак павялічыць шкоду вашай кідальнай зброі, як быццам яе ўзровень павялічыўся на _%1$d_, і павялічыць яе трываласць на _%2$s%%._
items.rings.ringofsharpshooting.typical_stats=Пры нашэнні гэты пярсцёнак звычайна павялічвае ўрон вашай кідальнай зброі, як быццам яе ўзровень павышаецца на _%1$d_, і павялічвае яе трываласць на _%2$s%%._
items.rings.ringofsharpshooting.upgrade_stat_name_1=Павышэнне ўзроўню шкоды
items.rings.ringofsharpshooting.upgrade_stat_name_2=Павышэнне трываласці
items.rings.ringoftenacity.combined_stats=Вашы кольцы аб'ядноўваюць сваю сілу, памяншаючы атрыманую вамі шкоду ў агульнай складанасці да _%s%%_.
items.rings.ringoftenacity.desc=Пры нашэнні гэтага пярсцёнка той, хто яго носіць, зможа супрацьстаяць звычайным смяротным ударам. Чым больш паранены карыстальнік, тым больш ён будзе ўстойлівы да пашкоджанняў. Замест гэтага пракляты пярсцёнак дазволіць ворагам лягчэй пакараць смерцю таго, хто яго носіць.
items.rings.ringoftenacity.name=кольца упартасці
items.rings.ringoftenacity.stats=Пры нашэнні гэты пярсцёнак паменшыць атрыманую шкоду максімум на _%s%%._
items.rings.ringoftenacity.typical_stats=Пры нашэнні гэты пярсцёнак звычайна памяншае атрыманую шкоду да _%s%%._
items.rings.ringoftenacity.upgrade_stat_name_1=Максімальная ўстойлівасць да пашкоджанняў
items.rings.ringofwealth.combined_stats=Вашы кольцы, якія вы носіце, аб'ядноўваюць сваю сілу, павялічваючы вашу ўдачу ў агульнай складанасці на _%s%%_.
items.rings.ringofwealth.desc=Гэтае пярсцёнак дзейнічае як магніт для скарбаў, павялічваючы верагоднасць таго, што ворагі і кантэйнеры будуць змяшчаць каштоўныя прадметы. Пракляты пярсцёнак замест гэтага знізіць вашы шанцы на атрыманне здабычы.
items.rings.ringofwealth.name=кальцо багацця
items.rings.ringofwealth.stats=Пры нашэнні гэты пярсцёнак павялічыць вашу ўдачу на _%s%%._
items.rings.ringofwealth.typical_stats=Пры нашэнні гэты пярсцёнак звычайна павялічвае вашу ўдачу на _%s%%._
items.rings.ringofwealth.upgrade_stat_name_1=Паляпшэнне ўдачы
items.scrolls.exotic.exoticscroll.berkanan=экзатычны скрутак БЕРКАНАНА
items.scrolls.exotic.exoticscroll.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.scrolls.exotic.exoticscroll.gyfu=экзатычны скрутак GYFU
items.scrolls.exotic.exoticscroll.isaz=экзатычны скрутак ІСАА
items.scrolls.exotic.exoticscroll.kaunan=экзатычны скрутак КАУНАНА
items.scrolls.exotic.exoticscroll.laguz=экзатычны скрутак ЛАГУЗ
items.scrolls.exotic.exoticscroll.mannaz=экзатычны скрутак МАННАЗ
items.scrolls.exotic.exoticscroll.naudiz=экзатычны скрутак NAUDIZ
