items.rings.ringofelements.combined_stats=Вашы абсталяваныя кольцы аб'ядноўваюць сваю сілу, забяспечваючы ў агульнай складанасці _%s%%_ супраціў стыхіям.
items.rings.ringofelements.desc=Гэты пярсцёнак дае ўстойлівасць да агню, электрычнасці, газаў і іншых стыхій. Ён таксама скарачае працягласць шкодных эфектаў.
items.rings.ringofelements.name=пярсцёнак стыхій
items.rings.ringofelements.stats=Пры нашэнні гэтае кольца будзе забяспечваць _%s%%_ элементарную ўстойлівасць.
items.rings.ringofelements.typical_stats=Пры нашэнні гэтае кольца звычайна забяспечвае _%s%%_ элементарны супраціў.
items.rings.ringofelements.upgrade_stat_name_1=Супраціў
items.rings.ringofenergy.combined_stats=Вашы абсталяваныя кольцы аб'ядноўваюць сваю сілу, павялічваючы хуткасць зарадкі ў агульнай складанасці на _%s%%_.
items.rings.ringofenergy.desc=Ваша магічнае рыштунак будзе хутчэй зараджацца ў таямнічым полі, якое выпраменьваецца з гэтага пярсцёнка. Праклятае пярсцёнак замест гэтага запаволіць перазарадку.
items.rings.ringofenergy.name=кольца энергіі
items.rings.ringofenergy.stats=Пры нашэнні гэты пярсцёнак павялічвае хуткасць зарадкі палачкі, артэфакта і гераічнай брані на _%s%%._
items.rings.ringofenergy.typical_stats=Пры нашэнні гэты пярсцёнак звычайна павялічвае хуткасць зарадкі палачкі, артэфакта і гераічнай брані на _%s%%._
items.rings.ringofenergy.upgrade_stat_name_1=Паскарэнне зарадкі
items.rings.ringofevasion.combined_stats=Вашы кольцы аб'ядноўваюць сваю сілу, павялічваючы ваша ўхіленне ў агульнай складанасці на _%s%%_.
