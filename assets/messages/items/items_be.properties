items.rings.ringofaccuracy.upgrade_stat_name_1=Павышэнне дакладнасці
items.rings.ringofarcana.combined_stats=Вашы абсталяваныя пярсцёнкі аб'ядноўваюць сваю сілу, павялічваючы ў агульнай складанасці сілу чараў і гліфаў на _%s%%_.
items.rings.ringofarcana.desc=Гэтае кольца ўзмацняе магічныя чары на зброі і гліфы на даспехах, у тым ліку праклёны! Спачатку яно павялічвае верагоднасць актывацыі, а потым павялічвае сілу эфекту, калі верагоднасць актывацыі дасягне 100%. Праклятае кольца замест гэтага аслабляе чары, гліфы і праклёны.
items.rings.ringofarcana.name=пярсцёнак арканаў
items.rings.ringofarcana.stats=Пры нашэнні гэты пярсцёнак павялічыць сілу чараў і гліфаў на _%s%%._
items.rings.ringofarcana.typical_stats=Пры нашэнні гэты пярсцёнак звычайна павялічвае сілу чараў і гліфаў на _%s%%._
