items.artifacts.hornofplenty.desc=У гэты рог нельга дзьмуць, ён, здаецца, напаўняецца ежай па меры таго, як вы падарожнічаеце і набіраецеся вопыту. Вы можаце спажываць кожны зарад асобна ў якасці перакусу або есці, пакуль не насыціцеся.
items.artifacts.hornofplenty.desc_cursed=Пракляты рог прывязаўся да цябе, здаецца, ён імкнецца есці, а не вырабляць яе.
items.artifacts.hornofplenty.desc_hint=Магчыма, ёсць спосаб павялічыць сілу рога, даўшы яму харчовую энергію.
