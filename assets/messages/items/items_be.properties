items.artifacts.lloydsbeacon.creatures=Псіхічная аўра суседніх істот не дазваляе вам выкарыстоўваць маяк Лойда ў гэты момант.
items.artifacts.lloydsbeacon.desc=Маяк Лойда — гэта складаная магічная прылада, якая дае карыстальніку кантроль над магіяй тэлепартацыі. Маяк можна выкарыстоўваць для вяртання ў пэўнае месца, але ён таксама можа выпускаць выбухі выпадковай магіі тэлепартацыі пасля таго, як ён зарадзіўся з экіпіроўкі. Гэтая магія можа быць накіравана на цэль або на самога карыстальніка.
items.artifacts.lloydsbeacon.desc_set=Гэты маяк быў усталяваны недзе на ўзроўні %d у Pixel Dungeon.
items.artifacts.lloydsbeacon.levelup=Твой маяк мацнее!
items.artifacts.lloydsbeacon.name=маяк Лойда
items.artifacts.lloydsbeacon.no_charge=Вашаму маяку зараз недастаткова энергіі.
items.artifacts.lloydsbeacon.preventing=Моцная магічная аура гэтага месца не дазваляе вам выкарыстоўваць маяк Лойда!
items.artifacts.lloydsbeacon.prompt=Выберыце месца для ўдару.
items.artifacts.lloydsbeacon.return=Маяк Лойда паспяхова ўсталяваны ў вашым бягучым месцазнаходжанні, цяпер вы можаце вярнуцца сюды ў любы час.
