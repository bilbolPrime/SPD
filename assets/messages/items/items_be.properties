items.scrolls.exotic.exoticscroll.raido=экзатычны скрутак RAIDO
items.scrolls.exotic.exoticscroll.sowilo=экзатычны скрутак SOWILO
items.scrolls.exotic.exoticscroll.tiwaz=экзатычны скрутак TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=На гэтым чорным пергаменце напісана свяцільная неразборлівая магічная руна. Здаецца, яна чужая гэтай зямлі, хто ведае, што яна зробіць, калі яе прачытаць уголас?
items.scrolls.exotic.exoticscroll.yngvi=экзатычны скрутак YNGVI
items.scrolls.exotic.scrollofantimagic.desc=Загавор на гэтым скрутку акружыць вас магічнай аурай, якая часова блакуе ўсе магічныя эфекты, шкодныя ці карысныя. Гэта ўключае ў сябе большасць магічных прадметаў, такіх як палачкі, скруткі, пярсцёнкі, артэфакты, чары і праклёны. Аднак здольнасці гераічнай брані дастаткова моцныя, каб працаваць у любым выпадку.
items.scrolls.exotic.scrollofantimagic.name=скрутак супраць магіі
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Вакол вас з'явілася магічная арэна, пазначаная клубамі чырвонага туману.\n\nПакуль вы стаіце ў тумане, ваш голад не будзе павялічвацца, і вы будзеце атрымліваць на 33%% менш шкоды ад усіх крыніц. Калі ў вас ёсць якія-небудзь іншыя крыніцы зніжэння шкоды (напрыклад, браня), яны будуць ужывацца пасля зніжэння на 33%%.\n\nХадоў засталося: %d.
items.scrolls.exotic.scrollofchallenge$challengearena.name=арэна выклікаў
items.scrolls.exotic.scrollofchallenge.desc=Пры чытанні ўслых гэты скрутак выпусціць магутны роў, які прыцягвае ворагаў да карыстальніка, адначасова ствараючы вакол іх невялікую арэну.\n\nПакуль чытач застаецца на гэтай арэне, ён будзе атрымліваць на 33% менш шкоды ад усіх крыніц (гэта ўжываецца перад іншымі формамі зніжэння шкоды), і ён не страціць сытасці.\n\nПамер арэны будзе маштабавацца ў залежнасці ад памеру зоны, у якой знаходзіцца чытач. Яна будзе асабліва маленькай у некаторых зонах з босамі.
items.scrolls.exotic.scrollofchallenge.name=скрутак выкліку
items.scrolls.exotic.scrollofdivination$wnddivination.desc=У вашым скрутку варажбы былі выяўлены наступныя прадметы:
items.scrolls.exotic.scrollofdivination.desc=Гэты скрутак выпадковым чынам вызначыць чатыры тыпы прадметаў, якія вы пакуль не ведаеце. Вызначаныя тыпы могуць быць колерам зелля, рунай скрутка або каштоўным каменем пярсцёнка. Вызначаныя прадметы не абавязкова будуць тымі, якія вы носіце з сабой.
items.scrolls.exotic.scrollofdivination.name=скрутак варажбы
items.scrolls.exotic.scrollofdivination.nothing_left=Няма чаго больш ідэнтыфікаваць!
items.scrolls.exotic.scrollofdread.desc=Пры прачытанні гэты скрутак выпраменьвае чырвоны ўспышку святла, якая навядзе неверагодны жах на ўсіх ворагаў у вашым полі зроку. Гэты эфект настолькі моцны, што яны хутка паспрабуюць уцячы з усяго падзямелля, каб больш ніколі іх не ўбачыць!\n\nЯк і ў выпадку з жахам, гэты эфект можа скончыцца з цягам часу або ў выпадку нападу на ворага.\n\nВалявыя ворагі, такія як босы, замест гэтага будуць падвяргацца звычайнаму жаху.
items.scrolls.exotic.scrollofdread.name=скрутак жаху
items.scrolls.exotic.scrollofenchantment.armor=Выберыце гліф, які трэба ўжыць да вашай броні.
items.scrolls.exotic.scrollofenchantment.cancel=адмяніць
items.scrolls.exotic.scrollofenchantment.cancel_warn=Адмена ўсё роўна знішчыць твой скрутак зачаравання, ты ўпэўнены?
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=Не, я перадумаў
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Так, я ўпэўнены
items.scrolls.exotic.scrollofenchantment.desc=Гэты скрутак напоўніць зброю або даспехі магутнай магічнай энергіяй. Чытач нават мае пэўную ступень кантролю над тым, якую магію напаўняць.
items.scrolls.exotic.scrollofenchantment.inv_title=Зачараваць прадмет
items.scrolls.exotic.scrollofenchantment.name=скрутак зачаравання
items.scrolls.exotic.scrollofenchantment.weapon=Выберыце зачараванне, каб ужыць да вашай зброі.
items.scrolls.exotic.scrollofforesight.desc=Пасля прачытання гэтага скрутка дэталі навакольнай мясцовасці будуць пастаянна паступаць у свядомасць чытача з крышталёвай яснасцю. Гэты эфект доўжыцца значны час і адкрые ўсе схаваныя дзверы або пасткі, робячы пошукі непатрэбнымі.
items.scrolls.exotic.scrollofforesight.name=скрутак прадбачання
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Адмена ўсё роўна знішчыць ваш скрутак метамарфозы, вы ўпэўнены?
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Выберыце талент для пераўтварэння.
items.scrolls.exotic.scrollofmetamorphosis.desc=Гэты скрутак змяшчае магутную магію трансмутацыі, якая будзе ўжывацца да заклінальніка, а не да прадмета. Магія гэтага скрутка дазволіць вам выбраць адзін талент і замяніць яго адным з пяці талентаў таго ж узроўню з розных класаў герояў!\n\nГэты эфект можа ўжывацца толькі да талентаў класа, а не да талентаў, атрыманых з падкласаў або здольнасцей даспехаў. Таленты, якія вы не можаце выкарыстоўваць, не будуць прадастаўлены ў якасці опцый.
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=пераўтварыць талент
items.scrolls.exotic.scrollofmetamorphosis.name=скрутак метамарфозы
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Выберыце новы талент, каб замяніць ім свой пераўтвораны талент.
items.scrolls.exotic.scrollofmysticalenergy.desc=Неапрацаваная магічная сіла, заключаная ў гэтым пергаменце, пасля вызвалення будзе з цягам часу зараджаць артэфакты карыстальніка.
items.scrolls.exotic.scrollofmysticalenergy.name=скрутак містычнай энергіі
items.scrolls.exotic.scrollofpassage.desc=Загавор на гэтым пергаменце імгненна пераносіць чытача ў бліжэйшы рэгіён першым паверхам над ім. Вельмі зручна, каб хутка дабрацца да крамы.
items.scrolls.exotic.scrollofpassage.name=скрутак урыўка
items.scrolls.exotic.scrollofprismaticimage.desc=Заклінанне на гэтым скрутку створыць маляўнічага ілюзорнага двайніка чытача. Гэта прызматычная выява дзейнічае як слабейшы клон чытача, з падобнай абаронай, але меншымі запасамі здароўя і пашкоджаннямі.\n\nПрызматычная выява будзе адлюстроўвацца, калі прысутнічаюць ворагі, і будзе спрабаваць абараніць чытача.\n\nКалі прызматычная выява ўжо існуе, выкарыстанне гэтага скрутка цалкам яе вылечыць.
items.scrolls.exotic.scrollofprismaticimage.name=скрутак прызматычнага малюнка
items.scrolls.exotic.scrollofpsionicblast.desc=Гэты скрутак утрымлівае неверагодную разбуральную энергію, якую можна накіраваць на знішчэнне розумаў усіх бачных істот.\n\nАднак існуе значная зваротная сувязь, і чытач таксама будзе пашкоджаны, аслеплены і аслаблены. Чым больш цэляў трапляе ў скрутак, тым менш пашкоджанняў ён атрымае сам.
items.scrolls.exotic.scrollofpsionicblast.name=скрутак псіянічнага выбуху
items.scrolls.exotic.scrollofpsionicblast.ondeath=Псіянічны выбух разрывае твой розум на часткі...
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=Гэтая істота была зачаравана магіяй скрутка з песняй сірэны.\n\nЗачараваны персанаж - ваш саюзнік назаўжды і будзе змагацца з любымі ворагамі, якіх сустрэне.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=зачараваны
items.scrolls.exotic.scrollofsirenssong.cancel=Вы павінны выбраць мэту.
items.scrolls.exotic.scrollofsirenssong.desc=Пры чытанні гэтага скрутка гучыць прывабная мелодыя, якая зачароўвае абранага ворага, назаўсёды ператвараючы яго ў саюзніка! Іншыя ворагі, якія пачуюць яе, будуць часова зачараваныя. \n\n Асабліва моцныя ворагі могуць супраціўляцца эфекту зачаравання і замест гэтага будуць зачараваныя.
items.scrolls.exotic.scrollofsirenssong.name=скрутак песні сірэны
items.scrolls.exotic.scrollofsirenssong.no_target=Скрутак актывуецца без мэты.
items.scrolls.exotic.scrollofsirenssong.prompt=Выберыце мэту
items.scrolls.inventoryscroll.no=Не, я перадумаў
items.scrolls.inventoryscroll.warning=Вы сапраўды хочаце адмяніць выкарыстанне гэтага скрутка? Скрутак раней не быў ідэнтыфікаваны, таму ён усё роўна будзе выкарыстаны.
items.scrolls.inventoryscroll.yes=Так, я ўпэўнены
