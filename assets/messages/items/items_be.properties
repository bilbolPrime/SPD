items.energycrystal.desc=Калекцыя маленькіх магічных крышталяў, напоўненых алхімічнай энергіяй.\n\nГэтыя крышталі з'яўляюцца найбольш распаўсюджаным інгрэдыентам у алхімічных рэцэптах і могуць быць выраблены ў алхімічным гаршку шляхам перапрацоўкі расходных матэрыялаў.
items.energycrystal.name=энергетычны крышталь
items.equipableitem.ac_equip=АБСТАЛЯВАЦЬ
items.equipableitem.ac_unequip=ЗНЯЦЬ З РАСПРАДАЖУ
items.equipableitem.curse_detected=Вы адчуваеце, што прадмет пракляты, непасрэдна перад тым, як апранаеце яго!
items.equipableitem.unequip_cursed=Нельга выдаліць пракляты прадмет!
items.food.berry.desc=Гэтую невялікую ягаду знайшла Паляўнічая сярод расліннасці падзямелля. Яе можна хутка з'есці, яна дае невялікую колькасць сытасці і, магчыма, утрымлівае карыснае насенне!
items.food.berry.discover_hint=Вы можаце знайсці гэты прадмет, выкарыстоўваючы пэўны талент героя.
items.food.berry.eat_msg=Гэтая ягада была смачная!
items.food.berry.name=ягада падзямелля
items.food.blandfruit$chunks.desc=Ад удару мяккі фрукт выбухнуў, пакінуўшы пасля сябе інэртныя кавалкі. \n\nНягледзячы на трохі бруду, гэтыя вялікія кавалкі прыгатаванага мяккага фрукта здаюцца цалкам ядомымі.
items.food.blandfruit$chunks.name=кавалкі мяккіх садавіны
items.food.blandfruit.blindfruit=сляпы плод
items.food.blandfruit.cooked=прыгатаваныя мяккія фрукты
items.food.blandfruit.desc=Такі сухі і нязначны, што, магчыма, тушэнне з іншым інгрэдыентам палепшыць яго.
items.food.blandfruit.desc_cooked=Плод набракнуў за час замочвання ў гаршку і нават увабраў уласцівасці насення, з якім яго варылі. Ён будзе мець эфект таго зелля, якому адпавядала гэтае насенне.
items.food.blandfruit.desc_eat=Здаецца, яго можна з'есці!
items.food.blandfruit.desc_throw=Здаецца, што гэта даволі нестабільна, магчыма, лепш яго кінуць.
items.food.blandfruit.dreamfruit=магічны фрукт
items.food.blandfruit.earthfruit=земляныя садавіна
items.food.blandfruit.fadefruit=вянефрукт
