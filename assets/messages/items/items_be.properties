items.artifacts.driedrose$wndghosthero.desc=Прывід сам па сабе слабы, але яго форма дастаткова трывалая, каб яго можна было абсталяваць зброяй і даспехамі. Ён зможа выкарыстоўваць гэтыя прадметы гэтак жа, як і вы. \n\nПрывід зараз можа абсталяваць прадметамі, якія патрабуюць сілы да _%d._
