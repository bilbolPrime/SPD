items.artifacts.skeletonkey$keywall.desc=Тут шкілетны ключ усталяваў часовую магічную сцяну.
items.artifacts.skeletonkey.ac_insert=УСТАВІЦЬ
items.artifacts.skeletonkey.crystal_charges=Каб адкрыць крыштальны замак, патрабуецца 5 зарадаў.
items.artifacts.skeletonkey.cursed=Нельга выкарыстоўваць пракляты шкілетны ключ.
items.artifacts.skeletonkey.desc=Важны на выгляд ключ з галоўкай у форме чэрапа. Яго зубцы здаюцца рознымі кожны раз, калі на іх глядзіш.
items.artifacts.skeletonkey.desc_cursed=Пракляты ключ, здаецца, актыўна пазбягае ўстаўляцца ў любы замок і нават робіць цяжкім (але не немагчымым) для вас выкарыстанне іншых ключоў.
items.artifacts.skeletonkey.desc_worn=Здаецца, што гэты магічны ключ набывае сілу, калі вы выкарыстоўваеце яго замест звычайных ключоў падзямелля. Яго можна ўставіць практычна ў любы замок падзямелля, каб адкрыць або зачыніць іх, у тым ліку дзверы, якія ніколі раней не былі зачыненыя.\n\nКлюч можна нават выкарыстоўваць на пустой прасторы па баках свету або дыяганалі, каб «заблакаваць» паветра перад сабой, ствараючы суцэльную сцяну шырынёй 3 пліткі, якая дзейнічае 10 хадоў. Заблакаванне адштурхне ворагаў, калі для гэтага ёсць месца.
items.artifacts.skeletonkey.discard=Вы выкідваеце лішнія ключы.
items.artifacts.skeletonkey.force_lock=Замак аслаб без твайго шкілетнага ключа. Табе ўдаецца яго адчыніць.
items.artifacts.skeletonkey.gold_charges=Каб адкрыць залаты замок, патрабуецца 2 зарады.
items.artifacts.skeletonkey.invalid_target=Там няма чаго ні замыкаць, ні адмыкаць.
items.artifacts.skeletonkey.iron_charges=Для адкрыцця звычайнага замка патрабуецца 1 зарад.
items.artifacts.skeletonkey.levelup=Твой шкілетны ключ становіцца мацнейшым!
items.artifacts.skeletonkey.lock_charges=Для замыкання дзвярэй патрабуецца 2 зарады.
items.artifacts.skeletonkey.lock_no_space=Нельга замкнуць персанажа ўнутры дзвярэй!
