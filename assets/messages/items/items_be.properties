items.scrolls.scroll.naudiz=скрутак НАЎДЫЗ
items.scrolls.scroll.no_magic=Немагчыма прачытаць скрутак, калі ў цябе імунітэт да магіі.
items.scrolls.scroll.odal=скрутак ODAL
items.scrolls.scroll.raido=скрутак RAIDO
items.scrolls.scroll.sowilo=скрутак СОВІЛА
items.scrolls.scroll.tiwaz=скрутак TIWAZ
items.scrolls.scroll.unknown_desc=Гэты пергамент пакрыты неразборлівымі пісьмёнамі і пазначаны рунай %s. Хто ведае, што будзе, калі прачытаць яго ўголас?
items.scrolls.scroll.yngvi=скрутак YNGVI
items.scrolls.scrollofidentify.desc=Назаўсёды раскрывае ўсе сакрэты аднаго прадмета.
items.scrolls.scrollofidentify.inv_title=Вызначыць прадмет
items.scrolls.scrollofidentify.it_is=Ваш прадмет быў ідэнтыфікаваны: %s.
items.scrolls.scrollofidentify.name=скрутак распазнавання
items.scrolls.scrolloflullaby.desc=Заспакаяльная мелодыя ўвядзе ўсіх істот у поле вашага зроку ў глыбокі сон, даючы вам магчымасць уцячы або нечакана напасці на іх.
items.scrolls.scrolloflullaby.name=скрутак калыханкі
items.scrolls.scrolloflullaby.sooth=Скрутак выдае заспакаяльную мелодыю. Ты адчуваеш сябе вельмі сонным.
items.scrolls.scrollofmagicmapping.desc=Калі вы прачытаеце гэты скрутак, у вашай памяці застанецца крышталёва ясны вобраз, які папярэдзіць вас аб дакладным размяшчэнні ўзроўню і раскрые ўсе схаваныя сакрэты. Месцазнаходжанне прадметаў і істот застанецца невядомым.
items.scrolls.scrollofmagicmapping.layout=Цяпер вы ведаеце схему ўзроўняў.
items.scrolls.scrollofmagicmapping.name=скрутак магічнай карты
items.scrolls.scrollofmirrorimage.copies=Скрутак утварае люстраныя адлюстраванні цябе.
items.scrolls.scrollofmirrorimage.desc=Загавор на гэтым скрутку створыць ілюзорных двайнікоў чытача, якія будуць пераследваць яго ворагаў.
items.scrolls.scrollofmirrorimage.name=скрутак люстранога адлюстравання
items.scrolls.scrollofmirrorimage.no_copies=Скрутак спрабуе стварыць вашыя люстраныя адлюстраванні, але ім няма куды падзецца.
items.scrolls.scrollofrage.desc=Пры чытанні ўслых гэты скрутак выпусціць магутны роў, які прыцягне да чытача ўсіх ворагаў і раз'юшыць тых, хто побач.
items.scrolls.scrollofrage.name=скрутак лютасці
items.scrolls.scrollofrage.roar=Скрутак выдае шалёны роў, які адгукаецца рэхам па ўсім падзямеллі!
items.scrolls.scrollofrecharging.desc=Неапрацаваная магічная сіла, заключаная ў гэтым пергаменце, пасля вызвалення зарадзіць усе палачкі чытача да поўнай магутнасці.
items.scrolls.scrollofrecharging.name=скрутак для падзарадкі
items.scrolls.scrollofrecharging.surge=Па вашаму целу праходзіць хваля энергіі, бадзёрачы вашы палачкі!
items.scrolls.scrollofremovecurse.cleansed=Твой прадмет ззяе ачышчальным святлом, і з яго выпраменьваецца злавесная энергія!
items.scrolls.scrollofremovecurse.desc=Загавор на гэтым скрутку імгненна здымае з зброі, даспехаў, пярсцёнкаў і прадметаў, якія чытальнік носіць, любыя злыя чары, якія могуць перашкодзіць уладальніку зняць іх.
items.scrolls.scrollofremovecurse.inv_title=Ачысціць прадмет
items.scrolls.scrollofremovecurse.name=скрутак для зняцця праклёну
items.scrolls.scrollofremovecurse.not_cleansed=Ваш прадмет свеціцца ачышчальным святлом, але нічога не адбываецца.
items.scrolls.scrollofremovecurse.spirit=Твой скрутак вызваляе змучаны дух!
items.scrolls.scrollofretribution.blast=Магутная магічная энергія вывяргаецца са скрутка!
items.scrolls.scrollofretribution.desc=Гэты скрутак утрымлівае разбуральную энергію, якая ператварае пакуты чытача ў выбух сілы. Чым слабейшы чытач, тым больш шкоды ён наносіць. Пры вельмі нізкім узроўні здароўя гэты скрутак можа імгненна забіць большасць ворагаў.\n\nАднак выкарыстанне скрутка моцна ўплывае на карыстальніка, асляпляючы і аслабляючы яго.
items.scrolls.scrollofretribution.name=скрутак адплаты
items.scrolls.scrollofteleportation.cant_reach=Тэлепартавацца туды нельга.
items.scrolls.scrollofteleportation.desc=Загавор на гэтым пергаменце імгненна пераносіць чытача ў выпадковае месца на ўзроўні падзямелля. Яго можна выкарыстоўваць, каб пазбегнуць небяспечнай сітуацыі, але няўдачлівы чытач можа апынуцца ў яшчэ больш небяспечным месцы.
items.scrolls.scrollofteleportation.name=скрутак тэлепартацыі
items.scrolls.scrollofteleportation.no_tele=Магія тэлепартацыі не спрацавала.
items.scrolls.scrollofteleportation.prompt=Выберыце месца для тэлепартацыі
items.scrolls.scrollofteleportation.tele=У імгненне вока вас тэлепартавалі ў іншае месца ўзроўню.
items.scrolls.scrollofterror.desc=Успышка чырвонага святла ахапіць жахам усіх істот у вашым полі зроку, яны павернуцца і ўцякуць. Атака на ўцякаючага ворага развее эфект.
items.scrolls.scrollofterror.many=Скрутак выпраменьвае яркі ўсплёск чырвонага святла, і монстры ўцякаюць!
items.scrolls.scrollofterror.name=скрутак жаху
items.scrolls.scrollofterror.none=Скрутак выпраменьвае яркі ўсплёск чырвонага святла.
items.scrolls.scrollofterror.one=Скрутак выпраменьвае яркі ўсплёск чырвонага святла, і %s уцякае!
items.scrolls.scrolloftransmutation.desc=Гэты скрутак змяшчае магутную магію трансмутацыі. Пры выкарыстанні на адпаведным прадмеце ён пераўтворыць яго ў іншы прадмет таго ж тыпу. Магія нават захавае паляпшэнні, чары і гліфы. Скруткі і зелля будуць трансмутаваны ў іх экзатычныя эквіваленты і наадварот.
items.scrolls.scrolloftransmutation.inv_title=Пераўтварэнне прадмета
items.scrolls.scrolloftransmutation.morph=Ваш прадмет ператвараецца ў нешта іншае!
items.scrolls.scrolloftransmutation.name=скрутак трансмутацыі
items.scrolls.scrolloftransmutation.nothing=Нічога цікавага не адбываецца.
items.scrolls.scrollofupgrade.desc=Гэты скрутак палепшыць адзін прадмет, палепшыўшы яго якасць. Магутнасць і колькасць зарадаў палачкі павялічацца; зброя будзе наносіць больш шкоды або часцей трапляць у цэль; даспехі будуць адбіваць дадатковыя ўдары; уздзеянне пярсцёнка на яго ўладальніка ўзмоцніцца. Зброя і даспехі таксама будуць патрабаваць менш сілы для выкарыстання, і любыя праклёны з прадмета будуць знятыя.
items.scrolls.scrollofupgrade.inv_title=Паляпшэнне прадмета
items.scrolls.scrollofupgrade.name=скрутак паляпшэння
items.scrolls.scrollofupgrade.remove_curse=Скрутак паляпшэння здымае праклён з вашага прадмета!
items.scrolls.scrollofupgrade.weaken_curse=Скрутак паляпшэння аслабляе праклён на вашым прадмеце.
items.spells.alchemize$wndalchemizeitem.energize=Ператварыцца ў энергію %d
items.spells.alchemize$wndalchemizeitem.energize_1=Ператварыце 1 у энергію %d
items.spells.alchemize$wndalchemizeitem.energize_all=Ператварыце ўсё ў энергію %d
items.spells.alchemize$wndalchemizeitem.sell=Ператварыцеся ў %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Ператварыце 1 у %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Ператварыце ўсё ў %dg
items.spells.alchemize.desc=Гэты загавор утрымлівае трансмутатыўныя здольнасці, падобныя да тых, што ёсць у алхімічным гаршку. Кожнае загавор дазваляе карыстальніку ператварыць прадмет (або стос прадметаў) у золата або алхімічную энергію. Ператварэнне зелляў або скруткаў у энергію нават дазваляе ідэнтыфікаваць іх!\n\nA Некалькі спосабаў выкарыстання Алхіміі прадаюцца ў крамах, але значна больш можна зрабіць з дапамогай алхіміі, змяшаўшы насенне, рунічны камень і трохі алхімічнай энергіі.
items.spells.alchemize.name=алхімізаваць
items.spells.alchemize.prompt=Алхімізацыя прадмета
items.spells.beaconofreturning.creatures=Псіхічная аўра суседніх істот не дазваляе вам тэлепартавацца ў гэты момант.
items.spells.beaconofreturning.desc=Гэты складаны загавор дае карыстальніку магчымасць вяртацца ў пэўнае месца, незалежна ад адлегласці. Загавор будзе знішчаны толькі пасля вяртання, яго можна выкарыстоўваць колькі заўгодна разоў, але ён запомніць толькі апошняе месцазнаходжанне, дзе ён быў усталяваны.
items.spells.beaconofreturning.desc_set=Гэты маяк быў усталяваны недзе на паверсе %d.
items.spells.beaconofreturning.name=маяк вяртання
items.spells.beaconofreturning.preventing=Моцная магічная аура гэтага месца не дазваляе вам выкарыстоўваць загавор!
items.spells.beaconofreturning.set=Маяк быў усталяваны ў вашым бягучым месцазнаходжанні.
items.spells.beaconofreturning.wnd_body=Устаноўка перавызначыць месцазнаходжанне, дзе маяк быў усталяваны раней. \n\nВяртанне верне вас у апошняе ўсталяванае месцазнаходжанне і спажывае адно выкарыстанне загавору.
items.spells.beaconofreturning.wnd_return=ВЯРТАННЕ
items.spells.beaconofreturning.wnd_set=НАЛАД
items.spells.curseinfusion.desc=Гэты загавор напаўняе прадмет рыштунку той жа магутнай злаякаснай магіяй, што і DM-300. Прадмет, на якім ён выкарыстоўваецца, будзе неадкладна пракляты, і любыя чары або гліфы, якія на ім маглі быць, будуць адменены.\n\nУ выпадку зброі, даспехаў і палачак, прадмет будзе атрымліваць паляпшэнні ў дадатак да праклёну. Паляпшэнні ад увядзення праклёнаў не сумуюцца, і паляпшэнні губляюцца, калі прадмет становіцца праклёнам.\n\nДля змены праклёну зброі або даспехаў таксама можна выкарыстоўваць некалькі ўвядзенняў праклёнаў.
items.spells.curseinfusion.inv_title=Праклясці прадмет
items.spells.curseinfusion.name=праклён настой
items.spells.magicalinfusion.desc=Гэты загавор валодае такой жа магічнай сілай, як і скрутак паляпшэння, але ў больш стабільнай форме.\n\nАкрамя звычайнага паляпшэння прадмета, ён ніколі не сцірае загавор, гліф або праклён.
items.spells.magicalinfusion.infuse=Ваш прадмет напоўнены таемнай энергіяй!
items.spells.magicalinfusion.inv_title=Настойваць прадмет
items.spells.magicalinfusion.name=чароўны настой
items.spells.magicalporter.desc=Гэтае закляцце магічным чынам перанясе любы прадмет, на які яно накладзена. Аднак, у адрозненне ад гандлёвага маяка, прадметы будуць перанесены да ўваходу на наступны паверх боса.
items.spells.magicalporter.inv_title=Перанесці элемент
items.spells.magicalporter.name=чароўны парцье
items.spells.magicalporter.nowhere=Няма куды перанесці прадмет.
items.spells.phaseshift.desc=Гэта хаатычнае заклён тэлепартуе любога персанажа, на якога яно накіравана, у выпадковае месца на бягучым паверсе і аглушае яго на значны час. Магутныя ворагі змогуць супраціўляцца аглушальнаму эфекту. Гэта заклён можа быць накіраваны на цэль або на самога карыстальніка.
items.spells.phaseshift.name=фазавы зрух
items.spells.phaseshift.no_target=Тэлепартавацца туды няма чаго.
items.spells.reclaimtrap.desc=Гэты загавор утрымлівае рэшткі механічнай энергіі DM-300. Пры накладанні на актыўную пастку сіла пасткі будзе прымацавана да вас, што дазволіць вам выкарыстаць загавор зноў, каб выгнаць гэтую сілу і актываваць эфект пасткі ў любым месцы.\n\nАднак некаторыя пасткі могуць працаваць не ва ўсіх месцах, і адначасова можна захоўваць толькі адну пастку.
items.spells.reclaimtrap.desc_trap=Загавор гатовы да актывацыі _%s._.
items.spells.reclaimtrap.name=вярнуць пастку
items.spells.reclaimtrap.no_trap=Там няма ніякай пасткі.
items.spells.recycle.desc=Гэты загавор утрымлівае менш значную форму магіі трансмутацыі. Хоць ён і не дзейнічае на рыштунак, ён пераўтворыць скрутак, зелле, насенне, рунічны камень або дроцік з наканечнікам у выпадковы прадмет таго ж тыпу.
items.spells.recycle.inv_title=Перапрацаваць прадмет
items.spells.recycle.name=перапрацоўваць
items.spells.recycle.recycled=Ваш прадмет быў перапрацаваны ў: %s.
items.spells.spell.ac_cast=ТРАНСЛЯЦЫЯ
items.spells.spell.discover_hint=Вы можаце стварыць гэты прадмет з дапамогай алхіміі.
items.spells.spell.no_magic=Нельга чытаць загаворы, калі маеш імунітэт да магіі.
items.spells.summonelemental.ac_imbue=НАПІЦЬ
items.spells.summonelemental.desc=Гэтае закляцце выкарыстоўвае энергію стыхійных вуголляў, з якіх яно зроблена, і дазваляе заклікаць сяброўскага элементаля для барацьбы з вамі! Адначасова можна выклікаць толькі аднаго элементаля, але закляцце можна перапрацаваць, каб вярнуць вам элементаля бясплатна.
items.spells.summonelemental.desc_chaos=Заклён зараз выпраменьвае хаатычную энергію, ён выкліча _элементаля хаосу_. Вы можаце напоўніць яго іншым прадметам, але заклён страціць бягучую сілу.
items.spells.summonelemental.desc_fire=Загавор зараз гарачы навобмацак, ён выкліча _агністую стыхію_. Вы можаце надаць яму сілу іншага прадмета, але загавор страціць сваю бягучую сілу.
items.spells.summonelemental.desc_frost=Заклён зараз халодны навобмацак, ён выкліча _элементаля лёду_. Вы можаце надаць яму сілу іншага прадмета, але заклён страціць сваю бягучую сілу.
items.spells.summonelemental.desc_newborn=Загавор пакуль не мае эфекту напаўнення і выклікае _нованароджанага элементаля_ без дыстанцыйнай атакі. Вы можаце напоўніць яго вызначаным зеллем вадкага полымя, зеллем марозу, скруткам перазарадкі або скруткам трансмутацыі, каб узмацніць загавор, у выніку чаго будучыя выклікі будуць цалкам магутнымі элементалями!
items.spells.summonelemental.desc_shock=Заклён зараз выпраменьвае статычную энергію, ён выкліча _элементаля шоку_. Вы можаце надаць яму іншы прадмет, але заклён страціць бягучую сілу.
items.spells.summonelemental.imbue_prompt=Напаўненне прадмета
items.spells.summonelemental.name=выклікаць элементар
items.spells.targetedspell.inv_title=Настойваць прадмет
items.spells.targetedspell.prompt=Выберыце мэту
items.spells.telekineticgrab.cant_grab=Гэтага не схапіць.
items.spells.telekineticgrab.desc=Гэтае заклён дазваляе заклінальніку дыстанцыйна захопліваць усе прадметы ў пэўным месцы або ўсю кідальную зброю, прыліплую да ворага!\n\nЯго нельга выкарыстоўваць для захопу прадметаў, якія належаць камусьці іншаму, або для захопу кантэйнераў, такіх як скрыні.
items.spells.telekineticgrab.name=тэлекінетычнага захопу
items.spells.telekineticgrab.no_target=Там няма за што ўхапіцца.
items.spells.unstablespell.desc=Гэты маленькі чорны квадратны крышталь мае зменлівыя рунічныя сімвалы на кожнай сваёй паверхні.\n\nПры актывацыі ён выкліча эфект выпадковага скрутка. Эфект скрутка заўсёды будзе сканцэнтраваны на баі, калі ў вашым полі зроку ёсць ворагі, і заўсёды будзе сканцэнтраваны на небаявых дзеяннях у адваротным выпадку.
items.spells.unstablespell.name=нестабільны загавор
items.spells.wildenergy.desc=Гэты загавор утрымлівае частку праклятай энергіі, якая сілкавала DM-300. Пры яго выкарыстанні вашы палачкі і зношаныя артэфакты будуць зараджацца, а таксама будзе актывавацца выпадковы эфект праклятай палачкі. Аднак вы можаце выбраць кірунак, у якім будзе страляць гэтая праклятая магія.
items.spells.wildenergy.name=дзікая энергія
items.stones.inventorystone.ac_use=ВЫКАРЫСТАННЕ
items.stones.runestone$placeholder.name=рунічны камень
items.stones.runestone.discover_hint=Вы можаце знайсці гэты прадмет выпадковым чынам у падзямеллі або стварыць яго з дапамогай алхіміі.
items.stones.stoneofaggression$aggression.desc=Маніпулятыўная магія прымушае ўсіх блізкіх ворагаў атакаваць гэтага персанажа. \n\nХодаў засталося: %s.
items.stones.stoneofaggression$aggression.name=мэтанакіраваны
items.stones.stoneofaggression.desc=Калі гэты камень кінуты ў саюзніка або ворага, усе ворагі паблізу аддадуць перавагу атакаваць гэтага персанажа на працягу кароткага часу. Аднак \n\nВорагі-босы могуць супраціўляцца эфекту, значна скарачаючы яго працягласць і атрымліваючы менш шкоды ад атак сваіх паслугачоў.
items.stones.stoneofaggression.name=камень агрэсіі
items.stones.stoneofaugmentation$wndaugment.cancel=Не хвалюйцеся
items.stones.stoneofaugmentation$wndaugment.choice=Што б вы хацелі палепшыць?
items.stones.stoneofaugmentation$wndaugment.damage=Пашкоджанне
items.stones.stoneofaugmentation$wndaugment.defense=Абарона
items.stones.stoneofaugmentation$wndaugment.evasion=Ухіленне
items.stones.stoneofaugmentation$wndaugment.none=Выдаліць дапаўненне
items.stones.stoneofaugmentation$wndaugment.speed=Хуткасць
items.stones.stoneofaugmentation.desc=Гэты рунічны камень валодае магутнай магіяй, якая можа ўзмацняць рыштунак, каб палепшыць адну ўласцівасць коштам іншай.\n\nВыкарыстанне на зброі дазволіць вам павялічыць хуткасць або шкоду. Кідальная зброя таксама будзе набываць або губляць трываласць прапарцыйна сваёй хуткасці.\n\nВыкарыстанне на даспехах дазволіць вам палепшыць абарону або ўхіленне.
items.stones.stoneofaugmentation.discover_hint=Гэты прадмет можна купіць у краме або вырабіць з дапамогай алхіміі.
items.stones.stoneofaugmentation.inv_title=Палепшыць прадмет
items.stones.stoneofaugmentation.name=камень павелічэння
items.stones.stoneofblast.desc=Гэты рунічны камень імгненна выбухне ў тым месцы, куды яго кінуць. Як і бомба, выбух нанясе шкоду ўсім, што знаходзіцца побач.
items.stones.stoneofblast.name=камень выбуху
items.stones.stoneofblink.desc=Гэты рунічны камень тэлепартуе карыстальніка ў месца, куды яго кінулі.
items.stones.stoneofblink.name=камень міргання
items.stones.stoneofclairvoyance.desc=Гэты камень імгненна адкрые ўсе пліткі ў вельмі шырокай зоне вакол таго месца, куды яго кінуць. Яго эфект будзе праходзіць нават скрозь сцены.
items.stones.stoneofclairvoyance.name=камень празорлівасці
items.stones.stoneofdeepsleep.desc=Калі гэты камень кінуць у ворага, ён пагрузіць яго ў глыбокі магічны сон. Ворагі, якія заснулі магічным сном, будуць спаць вечна, пакуль іх не патурбуюць.
items.stones.stoneofdeepsleep.name=камень глыбокага сну
items.stones.stoneofdetectmagic.desc=Гэты рунічны камень здольны выяўляць магію, якая ўплывае на прадмет. Выкарыстанне гэтага каменя на неапазнаным прадмеце пакажа вам, ці знаходзіцца ён пад уздзеяннем злога праклёну, а ці знаходзіцца ён пад уздзеяннем станоўчай магіі, напрыклад, зачаравання або паляпшэнняў.
items.stones.stoneofdetectmagic.detected_bad=Вы выявілі злосную магію, якая ўплывае на гэты прадмет!
items.stones.stoneofdetectmagic.detected_both=Вы выяўляеце як станоўчую, так і злосную магію, якая ўплывае на гэты прадмет!
items.stones.stoneofdetectmagic.detected_good=Вы выявілі станоўчую магію, якая ўплывае на гэты прадмет!
items.stones.stoneofdetectmagic.detected_none=Вы не заўважаеце ніякай магіі, якая ўплывае на гэты прадмет.
items.stones.stoneofdetectmagic.inv_title=Выявіць элемент
items.stones.stoneofdetectmagic.name=камень выяўлення магіі
items.stones.stoneofdisarming.desc=Гэты рунічны камень утрымлівае магію, якая можа абясшкодзіць зламысныя пасткі, схаваныя па ўсім падзямеллі. Ён абяззброіць да 9 пастак вакол зоны, куды яго кінуць.
items.stones.stoneofdisarming.name=камень раззбройвання
items.stones.stoneofenchantment.armor=Тваі даспехі свецяцца ў цемры!
items.stones.stoneofenchantment.desc=Гэты рунічны камень валодае чароўнай магіяй. У адрозненне ад скрутка паляпшэння, ён не павялічвае непасрэдную сілу прадмета, а замест гэтага напаўняе зброю або даспехі чарамі, даючы ім новую сілу.
items.stones.stoneofenchantment.inv_title=Зачараваць прадмет
items.stones.stoneofenchantment.name=камень зачаравання
items.stones.stoneofenchantment.weapon=Твая зброя свеціцца ў цемры!
items.stones.stoneoffear.desc=Калі гэты камень кінуць у персанажа, яго ахопіць жах, ён павернецца і ўцячэ. Атака на персанажа, які ўцякае, скароціць эфект.
items.stones.stoneoffear.name=камень страху
items.stones.stoneofflock.desc=Гэты рунічны камень на кароткі час заклікае чароўных авечак вакол месца, куды яго кінулі.
items.stones.stoneofflock.name=камень з статка
items.stones.stoneofintuition$wndguess.break=Твой камень інтуіцыі рассыпаецца ў пыл...
items.stones.stoneofintuition$wndguess.correct=Правільна. Тып прадмета вызначаны!
items.stones.stoneofintuition$wndguess.incorrect=Ваша здагадка была няправільнай.
items.stones.stoneofintuition$wndguess.text=Адгадайце, які тып неапазнанага прадмета. Калі вы адгадаеце правільна, тып будзе вызначаны!
items.stones.stoneofintuition.break_info=Камяні інтуіцыі можна выкарыстоўваць двойчы, перш чым адзін з іх зламаецца, _пры наступным выкарыстанні камень не з'есць_.
items.stones.stoneofintuition.break_warn=Вы ўжо выкарыстоўвалі камень інтуіцыі раней, таму _пры наступным выкарыстанні вы спажываеце камень_.
items.stones.stoneofintuition.desc=Гэты рунічны камень утрымлівае больш слабую версію магіі, якую можна знайсці ў скрутках ідэнтыфікацыі. Замест таго, каб непасрэдна ідэнтыфікаваць прадмет, ён будзе працаваць на вашай інтуіцыі, дазваляючы вам спрабаваць вызначыць тып зелля, скрутка або пярсцёнка шляхам здагадак.
items.stones.stoneofintuition.inv_title=Выберыце элемент
items.stones.stoneofintuition.name=камень інтуіцыі
items.stones.stoneofshock.desc=Гэты рунічны камень вызваляе выбух электрычнай энергіі, які на кароткі час аглушае ўсе бліжэйшыя мэты і зараджае палачку кідальніка за кожную траплення ў цэль.
items.stones.stoneofshock.name=камень шоку
items.stylus.ac_inscribe=ЗАПІСАЦЬ
items.stylus.cursed=Магія стылуса не будзе працаваць на праклятых даспехах.
items.stylus.desc=Гэты таемны стылус зроблены з нейкага цёмнага, вельмі цвёрдага каменя. З яго дапамогай вы можаце выгравіраваць магічны гліф на сваіх даспехах, але вы не маеце ўлады выбіраць, які гэта будзе гліф, стылус вырашыць гэта за вас.
items.stylus.identify=Спачатку трэба вызначыць, ці праклятыя гэтыя даспехі.
items.stylus.inscribed=Ты нанёс надпіс на свае даспехі стылусам.
items.stylus.name=таемны стылус
items.stylus.prompt=Выберыце даспехі
items.tengusmask.ac_wear=НАСІЦЬ
items.tengusmask.desc=Гэтая маска звалілася з твару Тэнгу, калі ён паміраў, вы можаце адчуць вялікую магічную сілу, якая зыходзіла ад яе. Ці была маска крыніцай сілы Тэнгу?\n\nПры надзяванні велізарная сіла маскі перадаецца вам, што дазваляе вам _выбраць падклас для вашага героя._\n\nЯкі падклас вы абярэце?
items.tengusmask.discover_hint=Гэты прадмет можна атрымаць у выглядзе падзення з пэўных ворагаў.
items.tengusmask.name=Маска Тэнгу
items.tengusmask.used=Маска распадаецца, калі яе сіла ўліваецца ў цябе!
items.torch.ac_light=СВЯТЛО
items.torch.desc=Абавязковы элемент прыгод: калі падзямелле пагружаецца ў цемру, паходня можа дапамагчы вам пракласці шлях.
items.torch.name=факел
items.trinkets.chaoticcenser.desc=Пасля некаторага часу ў алхімічным гаршку гэтая кадзільніца, якая спальвае ладан, пачынае самастойна вылучаць дым! Гэтыя газы назапашваюцца і вывяргаюцца з кадзільніцы ў бок ворагаў праз напаўвыпадковыя прамежкі часу. Здаецца, што яна здольная выпрацоўваць розныя газы, але вы атрымаеце папярэджанне непасрэдна перад тым, як кадзільніца актывуецца.
items.trinkets.chaoticcenser.name=хаатычная кадзіла
items.trinkets.chaoticcenser.spew=Твая кадзільніца вось-вось выплюне: %s.
items.trinkets.chaoticcenser.stats_desc=На бягучым узроўні гэтая цацка будзе вылучаць небяспечны газ побач з ворагам прыкладна кожны ход _%d_. Газы будуць з'яўляцца толькі пры наяўнасці ворагаў. На больш высокіх узроўнях гэтыя газы, хутчэй за ўсё, будуць экзатычнымі і магутнымі.
items.trinkets.chaoticcenser.typical_stats_desc=Звычайна гэтая цацанка будзе вылучаць небяспечны газ побач з ворагам прыкладна кожны _%d_ ход. Газы будуць з'яўляцца толькі пры наяўнасці ворагаў. На больш высокіх узроўнях гэтыя газы, хутчэй за ўсё, будуць экзатычнымі і магутнымі.
items.trinkets.crackedspyglass.desc=Гэты партатыўны тэлескоп быў бы ўзорам выдатнай і дакладнай працы, калі б не расколіна на пярэдняй лінзе. Здаецца, падзорная труба дапамагае вам, адкрываючы новыя прадметы ў падзямеллі, але з-за яе недахопу адкрытыя прадметы даволі цяжка ўбачыць!
items.trinkets.crackedspyglass.name=трэснутае падзорная труба
items.trinkets.crackedspyglass.stats_desc=На бягучым узроўні гэтая цацка мае шанец _%1$s%%_ стварыць дадатковы схаваны прадмет на кожным паверсе, які не з'яўляецца босам.
items.trinkets.crackedspyglass.stats_desc_upgraded=На бягучым узроўні гэтая цацка мае шанец _100%%_ стварыць дадатковы схаваны прадмет на кожным паверсе, які не з'яўляецца босам, і шанец _%1$s%%_ стварыць другі дадатковы схаваны прадмет.
items.trinkets.crackedspyglass.typical_stats_desc=Звычайна гэтая цацанка мае шанец _%1$s%%_ стварыць дадатковы схаваны прадмет на кожным паверсе, які не з'яўляецца босам.
items.trinkets.dimensionalsundial.desc=Гэты маленькі партатыўны сонечны гадзіннік нейкім чынам здольны адкідваць цень у глыбіні падзямелля, нават калі вы не трымаеце яго вертыкальна. Яшчэ больш дзіўна, што становішча ценю, здаецца, не мае ніякага дачынення да сонца ў гэтым свеце. Калі ценю няма, сонечны гадзіннік, здаецца, прыцягвае небяспеку.
items.trinkets.dimensionalsundial.name=аб'ёмны сонечны гадзіннік
items.trinkets.dimensionalsundial.stats_desc=На цяперашнім узроўні гэты прадмет зробіць так, што ў рэжыме рэальнага жыцця (з 8:00 да 20:00) хуткасць з'яўлення ворагаў будзе зніжацца на _%1$d%%_ у дзённы час, а ўначы (з 20:00 да 8:00) — на _%2$d%%_.
items.trinkets.dimensionalsundial.typical_stats_desc=Звычайна гэтая цацанка зніжае частату з'яўлення ворагаў на _%1$d%%_ у дзённы час у рэальным жыцці (з 8:00 да 20:00) і павялічвае частату з'яўлення ворагаў на _%2$d%%_ уначы (з 20:00 да 8:00).
items.trinkets.dimensionalsundial.warning=Ваш сонечны гадзіннік не адкідвае цень, вам неспакойна.
items.trinkets.exoticcrystals.desc=Гэтыя маленькія ружовыя крышталі маюць такую ж форму, як і крышталі алхімічнай энергіі. Хоць іх нельга выкарыстоўваць для атрымання энергіі непасрэдна, яны, здаецца, неяк уплываюць на зелля і скруткі, якія вы знаходзіце.
items.trinkets.exoticcrystals.name=экзатычныя крышталі
items.trinkets.exoticcrystals.stats_desc=На бягучым узроўні гэты прадмет заменіць _%s%%_ з зелляў або скруткаў на іх экзатычныя эквіваленты. Гэта не ўплывае на зелля сілы, скруткі паляпшэння або прадметы, якія ствараюцца для праходжання небяспечных пакояў.
items.trinkets.exoticcrystals.typical_stats_desc=Звычайна гэтая цацка замяняе _%s%%_ з зелляў або скруткаў на іх экзатычныя эквіваленты. Гэта не ўплывае на зелля сілы, скруткі паляпшэння або прадметы, якія ствараюцца для праходжання небяспечных пакояў.
items.trinkets.eyeofnewt.desc=Гэта залаціста-чорнае вока трытона — распаўсюджаны інгрэдыент, які цяпер ператварылі ў цацанку. Здаецца, вока памяншае зрок у абмен на тое, што дазваляе бачыць рэчы па-іншаму.
items.trinkets.eyeofnewt.name=вока трытона
items.trinkets.eyeofnewt.stats_desc=На цяперашнім узроўні гэты прадмет паменшыць ваш зрок на _%1$s%%_, але таксама дасць вам зрок розуму на ворагаў у межах клетак _%2$d_.
items.trinkets.eyeofnewt.typical_stats_desc=Звычайна гэтая цацка памяншае ваш зрок на _%1$s%%_, але таксама дае вам зрок розуму на ворагаў у межах клетак _%2$d_.
items.trinkets.ferrettuft.desc=Пучок шаўкавістай белай поўсці тхара, завязаны лаймава-зялёнай стужкай у бант. Тхары вядомыя сваёй спрытнасцю, гарэзлівасцю і адсутнасцю сумленнасці. Здаецца, што частка гэтай сілы выпраменьваецца ад гэтай цацанкі, дапамагаючы ёй ухіляцца ад усяго, што знаходзіцца побач.
items.trinkets.ferrettuft.name=чубчык тхара
items.trinkets.ferrettuft.stats_desc=На цяперашнім узроўні гэтая цацка павялічыць ухіленне ўсіх персанажаў на _%1$s%%_.
items.trinkets.ferrettuft.typical_stats_desc=Звычайна гэтая цацка павялічвае ўхіленне ўсіх персанажаў на _%1$s%%_.
items.trinkets.mimictooth.desc=Гэты вялікі востры зуб, відаць, быў вырваны ў вельмі няшчаснага міміка. Здаецца, ён уплывае на мімікаў у падзямеллі, робячы іх больш частымі і небяспечнымі.
items.trinkets.mimictooth.name=імітаваць зуб
items.trinkets.mimictooth.stats_desc=На цяперашнім узроўні гэты атрыбут зробіць усе віды імітатараў _%1$sx_ больш распаўсюджанымі і значна цяжэйшымі для выяўлення, але таксама павялічыць колькасць здабычы, якую яны выпадаюць. На кожным падзямеллі таксама будзе шанец _%2$s%%_ утрымліваць дадатковую схаваную імітацыю эбаніта.
items.trinkets.mimictooth.typical_stats_desc=Звычайна гэты атрыбут робіць усе віды імітатараў _%1$sx_ больш распаўсюджанымі і значна цяжэйшымі для выяўлення, але таксама павялічвае колькасць здабычы, якую з іх выпадае. На кожным падзямеллі таксама будзе шанец _%2$s%%_ утрымліваць дадатковую схаваную імітацыю эбаніта.
items.trinkets.mossyclump.desc=Гэты камяк вільготнага моху, здаецца, утрымлівае вільгаць, як бы моцна яго ні сціскалі. Ён нібыта чароўным чынам звязаны з самім падзямеллем, таму трава і вада з'яўляюцца часцей.
items.trinkets.mossyclump.name=мохавы камяк
items.trinkets.mossyclump.stats_desc=На цяперашнім узроўні гэтая цацка прывядзе да таго, што _%d%%_ нетэматычных падлог запоўніцца вадой або травой. \n\n Паляпшэнне гэтай цацкі патрабуе больш энергіі.
items.trinkets.mossyclump.typical_stats_desc=Звычайна гэтая цацка прымушае _%d%%_ нетэматычных падлог запаўняцца вадой або травой. \n\nПаляпшэнне гэтай цацкі патрабуе больш энергіі.
items.trinkets.parchmentscrap.desc=Гэты маленькі кавалачак пергаменту выглядае так, быццам ён узяты са скрутка. Ён захаваў частку сваёй магіі і, здаецца, уплывае на зброю і даспехі, якія можна знайсці ў падзямеллі.
items.trinkets.parchmentscrap.name=абрэзак пергаменту
items.trinkets.parchmentscrap.stats_desc=На бягучым узроўні гэты трынкет зробіць чары і гліфы _%dx_ такімі ж распаўсюджанымі, а праклёны на зброі і даспехах _%sx_ — такімі ж распаўсюджанымі. Праклёны на палачках, пярсцёнках або артэфактах застануцца ў сіле.\n\nПаляпшэнне гэтага трынкета патрабуе больш энергіі.
items.trinkets.parchmentscrap.typical_stats_desc=Звычайна гэты трынкет робіць чары і гліфы _%dx_ распаўсюджанымі, а праклёны на зброі і даспехах _%sx_ — распаўсюджанымі. Праклёны на палачках, пярсцёнках або артэфактах не закранаюцца.\n\nПаляпшэнне гэтага трынкета патрабуе больш энергіі.
items.trinkets.petrifiedseed.desc=Гэтае насенне скамянела альбо ў выніку павольных геалагічных працэсаў, альбо пад уздзеяннем магіі. Здаецца, што насенне магічным чынам уплывае на флору падзямелля, часам замяняючы насенне раслін рунічнымі камянямі.
items.trinkets.petrifiedseed.name=скамянелае насенне
items.trinkets.petrifiedseed.stats_desc=На цяперашнім узроўні гэтая цацка прывядзе да таго, што з растаптанай травы замест насення _%1$s%%_ будуць выпадаць рунічныя камяні, а таксама з высокай травы часцей будуць выпадаць прадметы _%2$s%%_.
items.trinkets.petrifiedseed.typical_stats_desc=Звычайна з-за гэтай цацанкі з вытаптанай травы замест насення _%1$s%%_ будуць выпадаць рунічныя камяні, а з высокай травы часцей будуць выпадаць прадметы _%2$s%%_.
items.trinkets.ratskull.desc=Гэтая жудасная цацанка не нашмат большая за чэрап звычайнага пацука, што ў гэтым падзямеллі неяк рэдкасць. Магічны ўплыў чэрапа, здаецца, прыцягвае больш рэдкіх насельнікаў падзямелля, з-за чаго яны з'яўляюцца значна часцей.
items.trinkets.ratskull.name=чэрап пацука
items.trinkets.ratskull.stats_desc=На цяперашнім узроўні гэтая цацка зробіць рэдкіх экзатычных ворагаў _%dx_ такімі ж верагоднымі. Аднак чэрап толькі ўдвая гэтак жа эфектыўны ў прыцягненні крыштальных імітатараў і браняваных статуй.
items.trinkets.ratskull.typical_stats_desc=Звычайна гэтая цацка робіць рэдкіх экзатычных ворагаў _%dx_ такімі ж верагоднымі, як і з'яўленне. Аднак чэрап толькі ўдвая гэтак жа эфектыўны ў прыцягненні крыштальных імітатараў і браняваных статуй.
items.trinkets.saltcube.desc=Гэты вялікі крышталь солі быў разрэзаны амаль ідэальнай кубічнай формы, і яму неяк удалося зліць палову вады з алхімічнага гаршка замест таго, каб растварыцца. Здаецца, ён чароўным чынам абязводжвае і захоўвае ежу, якую вы ясце, падаўжаючы пачуццё сытасці, але таксама запавольваючы аднаўленне здароўя, калі вы не галодныя.
items.trinkets.saltcube.name=кубік солі
items.trinkets.saltcube.stats_desc=На цяперашнім узроўні гэтая цацка павялічыць час да таго, як вы прагаладаецеся, на _%1$s%%_, але таксама знізіць хуткасць рэгенерацыі здароўя на _%2$s%%_, калі падлога не заблакаваная.
items.trinkets.saltcube.typical_stats_desc=Звычайна гэтая цацка павялічвае час да таго, як вы прагаладаецеся, на _%1$s%%_, але таксама зніжае хуткасць рэгенерацыі здароўя на _%2$s%%_, калі падлога не заблакаваная.
items.trinkets.shardofoblivion$thrownusetracker.desc=Вы нядаўна выкарысталі неапазнаную кідальную зброю, што лічыцца адным адзінкам выкарыстанага неапазнанага рыштунку за асколак забыцця на некаторы час.\n\nХадоў засталося: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Выкарыстана неідэнтыфікаваная кідальная зброя
items.trinkets.shardofoblivion$wandusetracker.desc=Нядаўна вы выкарысталі неапазнаную палачку, што лічыцца адным выкарыстаным неапазнаным рыштункам за аскепак забыцця на некаторы час.\n\nЗасталося хадоў: %s.
items.trinkets.shardofoblivion$wandusetracker.name=Выкарыстана неідэнтыфікаваная палачка
items.trinkets.shardofoblivion.ac_identify=ВЫЗНАЧЫЦЬ
items.trinkets.shardofoblivion.desc=Пасля таго, як гэты маленькі асколак праклятага металу варыўся ў алхімічным катле, ён змяніўся і стаў зроблены з... нічога? Здаецца, святло ахінае яго, і ён лунае на месцы, калі вы яго не трымаеце. Асколак, здаецца, магічным чынам чэрпае сілу з вашага невуцтва, таму, напэўна, лепш не думаць пра гэта занадта шмат.
items.trinkets.shardofoblivion.identify=Вы ідэнтыфікуеце прадмет!
items.trinkets.shardofoblivion.identify_not_yet=Гэты прадмет пакуль не гатовы да ідэнтыфікацыі.
items.trinkets.shardofoblivion.identify_prompt=Вызначыць прадмет
items.trinkets.shardofoblivion.identify_ready=Прадмет гатовы да ідэнтыфікацыі: %s. Выкарыстайце на ім свой Асколак Забыцця, каб ідэнтыфікаваць яго.
items.trinkets.shardofoblivion.identify_ready_worn=Цяпер усе вашы паношаныя рэчы гатовыя да ідэнтыфікацыі. Выкарыстоўвайце свой Асколак Забыцця на прадметах, каб іх ідэнтыфікаваць.
items.trinkets.shardofoblivion.name=асколак забыцця
items.trinkets.shardofoblivion.stats_desc=На цяперашнім узроўні гэты прадмет павялічыць хуткасць выпадзення здабычы з ворагаў на 20%% за кожны неідэнтыфікаваны прадмет рыштунку, які вы экіпіравалі або нядаўна выкарыстоўвалі, да максімальнай колькасці _%d прадметаў_. Асколак таксама не дазволіць вам ідэнтыфікаваць рыштунак, але яго можна выкарыстоўваць для ручной ідэнтыфікацыі прадметаў, гатовых да яго вызначэння.
items.trinkets.shardofoblivion.typical_stats_desc=Звычайна гэты атрыбут павялічвае частату выпадзення здабычы з ворагаў на 20%% за кожны неідэнтыфікаваны прадмет рыштунку, які вы экіпіравалі або нядаўна выкарыстоўвалі, да максімальнай колькасці _%d прадметаў_. Асколак таксама не дазволіць вам ідэнтыфікаваць рыштунак, але яго можна выкарыстоўваць для ручной ідэнтыфікацыі прадметаў, гатовых да яго.
items.trinkets.thirteenleafclover.desc=Неяк гэта прывяло да таго, што канюшына, кіпячая ў алхімічным катле, вырасла кучу лішніх лістоў! Не зусім зразумела, ці прыносіць гэтая цацка шчасце, ці не, магчыма, яна зробіць вашу ўдачу больш хаатычнай?
items.trinkets.thirteenleafclover.name=трынаццацілісты канюшына
items.trinkets.thirteenleafclover.stats_desc=На цяперашнім узроўні гэты трынкет нанясе вам максімальную шкоду _%1$d%%_ часу і мінімальную шкоду _%2$d%%_ часу.
items.trinkets.thirteenleafclover.typical_stats_desc=Звычайна гэтая цацанка наносіць максімальную шкоду _%1$d%%_ часу і мінімальную шкоду _%2$d%%_ часу.
items.trinkets.trapmechanism.desc=Асноўны механізм адной з пастак падзямелля, старанна выразаны з падлогі, каб яго можна было пераносіць. Здаецца, ён магічным чынам звязаны з самім падзямеллем, што робіць небяспечную мясцовасць больш распаўсюджанай, але таксама павялічвае вашу прыхільнасць да яе.
items.trinkets.trapmechanism.name=механізм пасткі
items.trinkets.trapmechanism.stats_desc=На цяперашнім узроўні гэтая цацка прывядзе да таго, што _%1$d%%_ нетэматычных паверхаў будуць запоўненыя альбо пасткамі, альбо прорвамі. Акрамя таго, замест гэтага будуць бачнымі _%2$d%%_ з схаваных пастак падзямелля.
items.trinkets.trapmechanism.typical_stats_desc=Звычайна з-за гэтай цацанкі _%1$d%%_ нетэматычных паверхаў запаўняюцца пасткамі або прорвамі. Акрамя таго, замест гэтага будуць бачнымі _%2$d%%_ з схаваных пастак падзямелля.
items.trinkets.trinket$placeholder.name=цацанка
items.trinkets.trinket.discover_hint=Гэты прадмет мае шанец стаць варыянтам пры стварэнні цацанкі з дапамогай алхіміі.
items.trinkets.trinketcatalyst$randomtrinket.desc=Адзін прадмет паблізу затрымаўся ў мяшэчку, які вы не можаце адкрыць.\n\nАлхімічны працэс растворыць мяшэчак, але вы не даведаецеся, якую цацанку атрымаеце, пакуль не зробіце гэта!
items.trinkets.trinketcatalyst$randomtrinket.name=выпадковая цацанка
items.trinkets.trinketcatalyst.desc=Гэты шар чароўнага залатога пылу мігціць у цемры падзямелля. Гэты каталізатар можна выкарыстоўваць у алхімічным гаршку з невялікай колькасцю алхімічнай энергіі для стварэння ўнікальнай цацанкі.\n\nЦацанкі забяспечваюць розныя эфекты, якія нязначна змяняюць падзямелле або яго жыхароў. Цацанкі можна паляпшаць, павялічваючы энергію, каб зрабіць іх эфект мацнейшым, або скідаць, каб цалкам адмовіцца ад эфекту.
items.trinkets.trinketcatalyst.name=магічны каталізатар
items.trinkets.trinketcatalyst.window_text=Вада пачынае свяціцца, калі вы дадаяце каталізатар. Паблізу ёсць некалькі прадметаў, якія можна напоўніць энергіяй і ператварыць у чароўную цацанку.
items.trinkets.trinketcatalyst.window_title=стварыць цацанку
items.trinkets.vialofblood.desc=Гэтая тонкая прабірка змяшчае кроў нейкага жыхара падзямелля, яна павольна рухаецца пры кручэнні. Здаецца, што яна магічна ўзмацняе эфекты гаення, але таксама запавольвае іх.
items.trinkets.vialofblood.name=флакон крыві
items.trinkets.vialofblood.stats_desc=На цяперашнім узроўні гэтая цацка павялічыць агульны запас здароўя, які вы атрымліваеце ад ужывання зелляў лячэння, бурдзюкаў з вадой або крыніц здароўя, на _%1$s%%_. Аднак гэтыя эфекты лячэння таксама будуць праяўляцца павольней, аднаўляючы максімум _%2$s_ адзінак здароўя за ход (гэта залежыць ад узроўню героя).
items.trinkets.vialofblood.typical_stats_desc=Звычайна гэтая цацка павялічвае агульны запас здароўя, які вы атрымліваеце ад ужывання зелляў лячэння, бурдзюкаў з вадой або крыніц здароўя, на _%1$s%%_. Аднак гэтыя эфекты лячэння таксама будуць праяўляцца павольней, аднаўляючы максімум _%2$s_ адзінак здароўя за ход (гэта залежыць ад узроўню героя).
items.trinkets.wondrousresin.desc=Гэтая зіхатлівая блакітная смала, здаецца, утрымлівае дыстыляваную эсэнцыю магіі праклятай палачкі. Магія з алхімічнага гаршка, здаецца, неяк стабілізавала яе, і цяпер яна ўплывае на вашы палачкі.
items.trinkets.wondrousresin.name=цудоўная смала
items.trinkets.wondrousresin.stats_desc=На цяперашнім узроўні гэты трынкет прымусіць эфекты праклятых палачак стаць нейтральнымі або станоўчымі _%1$s%%_ часу, і прымусіць непраклятыя палачкі страляць дадатковым нейтральным або станоўчым праклятым ударам _%2$s%%_ часу.\n\n. Паляпшэнне гэтага трынкета патрабуе больш энергіі.
items.trinkets.wondrousresin.typical_stats_desc=Звычайна гэты трынкет прымушае эфекты праклятых палачак стаць нейтральнымі або станоўчымі _%1$s%%_ часу, і прымушае непраклятыя палачкі страляць дадатковым нейтральным або станоўчым праклятым ударам _%2$s%%_ часу.\n\n. Паляпшэнне гэтага трынкета патрабуе больш энергіі.
items.wands.cursedwand.disguise=Твой знешні выгляд змяняецца на тваіх вачах!
items.wands.cursedwand.fire=Ад цябе пахне гарэлым...
items.wands.cursedwand.grass=Трава прарастае вакол цябе!
items.wands.cursedwand.gravity=Гравітацыя раптам пачынае дзейнічаць у выпадковых напрамках!
items.wands.cursedwand.gravity_end=Гравітацыйны хаос заканчваецца.
items.wands.cursedwand.gravity_positive=Гравітацыя раптам пачынае дзейнічаць у выпадковых напрамках, але, здаецца, на цябе гэта не ўплывае.
items.wands.cursedwand.mass_invuln=Яскравае святло вырываецца з тваёй палачкі!
items.wands.cursedwand.nothing=Нічога не адбываецца.
items.wands.cursedwand.ondeath=Цябе забіў твой жа %s.
items.wands.cursedwand.petrify=Ты раптам застываеш на месцы!
items.wands.cursedwand.sinkhole=Зямля вакол цябе пачынае круціцца!
items.wands.cursedwand.sinkhole_positive=Зямля пачынае паддавацца, але адчуваецца дастаткова цвёрдай пад табой.
items.wands.cursedwand.supernova=Пачынае расці палаючы шар энергіі. Магчыма, вам захочацца ўцячы!
items.wands.cursedwand.supernova_positive=Палымяны шар энергіі пачынае расці, але неяк адчуваецца бяспечным.
items.wands.cursedwand.transmogrify_other=Ваш прадмет пераўтвараецца ў нешта іншае!
items.wands.cursedwand.transmogrify_wand=Ваша палачка ператвараецца ў іншы прадмет!
items.wands.damagewand.upgrade_stat_name_1=Магічная шкода
items.wands.wand$placeholder.name=палачка
items.wands.wand.ac_zap=ЗАП
items.wands.wand.curse_discover=Гэты %s пракляты!
items.wands.wand.cursed=Гэтая палачка праклятая, што робіць яе магію хаатычнай і выпадковай.
items.wands.wand.fizzles=Твая палачка шыпіць; відаць, у яе недастаткова зарада.
items.wands.wand.identify=Цяпер вы дастаткова добра знаёмыя са сваёй палачкай, каб ідэнтыфікаваць яе.
items.wands.wand.no_magic=Ваша палачка шыпіць; вы не можаце карыстацца палачкамі, пакуль маеце імунітэт да магіі.
items.wands.wand.not_cursed=Гэтая палачка не мае злога магічнага ўплыву.
items.wands.wand.prompt=Выберыце месца для ўдару электрастанцыяй
items.wands.wand.resin_many=Гэтая палачка атрымала _узроўні %d_ з дапамогай таямнічай смалы.
items.wands.wand.resin_one=Гэтая палачка атрымала _1 узровень_ з дапамогай таямнічай смалы.
items.wands.wand.self_target=Нельга нацэльвацца на сябе!
items.wands.wandofblastwave.bmage_desc=Калі _Баявы маг_ б'е па паралізаваным ворагу посахам выбуховай хвалі, ён спажывае параліч, каб нанесці выбух дадатковай магічнай шкоды. Гэта мае кароткі час аднаўлення для кожнага ворага.
items.wands.wandofblastwave.desc=Гэтая палачка зроблена з нейкага мармуровага каменя, з залатой аздабленнем і круглым чорным каштоўным каменем на кончыку. У руцэ яна адчуваецца вельмі цяжкай.
items.wands.wandofblastwave.eleblast_desc=Элементальны выбух з дапамогай кія выбуховай хвалі наносіць 67% шкоды і адкідае ўсіх ворагаў за межы зоны выбуху.
items.wands.wandofblastwave.knockback_ondeath=Сутыкненне забіла цябе...
items.wands.wandofblastwave.name=палачка выбуховай хвалі
items.wands.wandofblastwave.ondeath=Ты забіў сябе ўласнай палачкай Выбуховай Хвалі...
items.wands.wandofblastwave.staff_name=персанал выбуховай хвалі
items.wands.wandofblastwave.stats_desc=Гэтая палачка страляе стрэлай, якая моцна дэтануе ў вызначаным месцы. Сіла гэтага выбуху наносіць _%1$d-%2$d шкоду_ і дастаткова моцная, каб адправіць большасць ворагаў у палёт.
items.wands.wandofblastwave.typical_stats_desc=Гэтая палачка страляе стрэлай, якая моцна дэтануе ў вызначаным месцы. Сіла гэтага выбуху звычайна наносіць _%1$d-%2$d шкоду_ і дастаткова моцная, каб адправіць большасць ворагаў у палёт.
items.wands.wandofblastwave.upgrade_stat_name_2=Адкід
items.wands.wandofcorrosion.bmage_desc=Калі _Баявы маг_ б'е ворага посахам іржаўлення, вораг мае шанец абліцца мокротой.
items.wands.wandofcorrosion.desc=Гэтая палачка мае попельна-белага колеру цела, якое адкрываецца ў бліскучы аранжавы камень.
items.wands.wandofcorrosion.eleblast_desc=Элементальны выбух з дапамогай посаха карозіі наносіць ворагам 4 хады карозіі, пачынаючы з 6 адзінак шкоды.
items.wands.wandofcorrosion.name=палачка карозіі
items.wands.wandofcorrosion.staff_name=персанал карозіі
items.wands.wandofcorrosion.stats_desc=Гэтая палачка страляе стрэлай, якая выбухае, ператвараючыся ў воблака высокакаразійнага газу ў вызначаным месцы. Усё, што трапіла ў гэта воблака, будзе атрымліваць усё большую шкоду з цягам часу, пачынаючы з _%d._
items.wands.wandofcorrosion.upgrade_stat_name_1=Пашкоджанні ад карозіі
items.wands.wandofcorrosion.upgrade_stat_name_2=Аб'ём газу
items.wands.wandofcorruption.already_corrupted=На гэтага персанажа больш нельга паўплываць.
items.wands.wandofcorruption.bmage_desc=Калі _Баявы маг_ б'е ворага посахам псавання, вораг мае шанец ап'янець.
items.wands.wandofcorruption.desc=Гэтая палачка выпраменьвае хаатычную цёмную энергію, калі гэта яшчэ не было відавочна па невялікай дэкаратыўнай форме чэрапа на яе кончыку.
items.wands.wandofcorruption.eleblast_desc=Элементальны выбух з дапамогай посаха псавання наносіць ворагам 5 хадоў амута.
items.wands.wandofcorruption.name=палачка карупцыі
items.wands.wandofcorruption.staff_name=супрацоўнікі па барацьбе з карупцыяй
items.wands.wandofcorruption.stats_desc=Гэтая палачка выпусціць выбух разбуральнай энергіі, якая аслабіць ворагаў і ў рэшце рэшт падпарадкуе іх вашай волі. Ворагі здольныя супраціўляцца разбурэнню, але аслабленых ворагаў значна лягчэй разбэсціць, чым здаровых.
items.wands.wandofcorruption.upgrade_stat_name_1=Разбэшчваючая ўлада
items.wands.wandofcorruption.upgrade_stat_name_2=Працягласць аслаблення
items.wands.wandofdisintegration.bmage_desc=Калі _БаявыМаг_ трымае яго ў руках, посах распаду павялічвае далёкасць атакі, быццам на яго накладзены праекцыйныя чары.
items.wands.wandofdisintegration.desc=Гэтая палачка зроблена з суцэльнага гладкага кавалка абсідыяну, з цёмна-фіялетавым святлом, якое прабягае па яе баку і заканчваецца на кончыку. Яна свеціцца разбуральнай энергіяй, чакаючы, каб стрэліць наперад.
items.wands.wandofdisintegration.eleblast_desc=Элементальны выбух з посахам распаду наносіць 100% шкоды і прабівае сцены.
items.wands.wandofdisintegration.name=палачка распаду
items.wands.wandofdisintegration.staff_name=персанал распаду
items.wands.wandofdisintegration.stats_desc=Гэтая палачка страляе праменем, які пранізвае любую перашкоду, і чым больш яна паляпшаецца, тым далей ляціць. Прамень наносіць _%1$d-%2$d шкоду,_ а таксама наносіць дадатковую шкоду за кожнага ворага і сцяну, праз якія ён прабіваецца.
items.wands.wandofdisintegration.upgrade_stat_name_2=Максімальная далёкасць
items.wands.wandoffireblast.bmage_desc=Калі _Баявы маг_ б'е па ворагу посахам агністага выбуху, ёсць верагоднасць таго, што ён выбухне, нанясе шкоду ворагам і знішчыць увесь агонь паблізу! Гэтая верагоднасць павялічваецца, чым больш агню знаходзіцца побач з ворагам.
items.wands.wandoffireblast.desc=Гэтая палачка зроблена з чырвонага лакіраванага дрэва з шчодрай колькасцю залатога лісця, каб надаць ёй даволі каралеўскі выгляд. Яна трэскае і шыпіць на кончыку, імкнучыся вызваліць сваю магутную магію.
items.wands.wandoffireblast.eleblast_desc=Элементальны выбух з дапамогай кія агністага выбуху наносіць 100% шкоды, выломвае дзверы і падпальвае ворагаў і мясцовасць.
items.wands.wandoffireblast.name=палачка агністага выбуху
items.wands.wandoffireblast.staff_name=персанал агністага выбуху
items.wands.wandoffireblast.stats_desc=Пры выкарыстанні гэтая палачка выстрэльвае агністы конус. Наступная атака спажывае зарады _%1$d_ і наносіць _%2$d-%3$d шкоду._ Чым больш зарадаў выкарыстоўвае палачка, тым большы і мацнейшы эфект.
items.wands.wandoffireblast.upgrade_stat_name_1=1 зарад шкоды
items.wands.wandoffireblast.upgrade_stat_name_2=2 зарады
items.wands.wandoffireblast.upgrade_stat_name_3=3 зарады
items.wands.wandoffrost.bmage_desc=Калі _Баявы маг_ б'е астуджанага ворага посахам лёду, у яго ёсць шанец імгненна замарозіць яго. Чым больш ён астуджаны, тым большая гэтая верагоднасць.
items.wands.wandoffrost.desc=Здаецца, гэтая палачка зроблена з нейкага чароўнага лёду. Бліжэй да закругленага кончыка яна становіцца ярчэйшай. У руках яна вельмі халодная, але рука неяк застаецца цёплай.
items.wands.wandoffrost.eleblast_desc=Элементальны выбух з дапамогай посаха лёду наносіць 100% шкоды, замарожвае ворагаў і тушыць пажары.
items.wands.wandoffrost.name=палачка марозу
items.wands.wandoffrost.staff_name=персанал марозу
items.wands.wandoffrost.stats_desc=Гэтая палачка страляе ў вашых ворагаў залпамі ледзяной энергіі, наносячы _%1$d-%2$d шкоду_ і астуджаючы іх. Эфект здаецца мацнейшым у вадзе. Ворагі, якія ўжо астуджаныя або замарожаныя, атрымліваюць менш шкоды ад гэтай палачкі.
items.wands.wandoffrost.upgrade_stat_name_2=Працягласць холаду
items.wands.wandoflightning$lightningcharge.desc=Баявы маг зараз зараджаны энергіяй, што дае яму імунітэт да ягонага посаха маланак і павялічвае далёкасць выбуху маланкі. \n\nХодаў засталося: %s.
items.wands.wandoflightning$lightningcharge.name=Электрычна зараджаны
items.wands.wandoflightning.bmage_desc=Калі _Баявы маг_ б'е па ворагу посахам маланкі, у яго ёсць шанец зарадзіцца электрычнасцю на 10 хадоў. Пакуль Баявы маг зараджаны, ён неўспрымальны да ўдараў маланкі і можа працягваць сеяць дугу маланкі.
items.wands.wandoflightning.desc=Гэтая палачка зроблена з суцэльнага металу, што робіць яе нечакана цяжкай. Два зубцы выгінаюцца разам на канцы, і паміж імі праходзіць электрычная дуга.
items.wands.wandoflightning.eleblast_desc=Элементальны выбух з маланкай наносіць 100% шкоды, аглушае ворагаў на 5 хадоў і электрызуе ваду.
items.wands.wandoflightning.name=палачка маланкі
items.wands.wandoflightning.ondeath=Ты забіў сябе ўласным Жазлом Маланкі...
items.wands.wandoflightning.staff_name=персанал маланкі
items.wands.wandoflightning.stats_desc=Гэтая палачка пасылае магутную маланку праз усё, у што ёю стрэляць, наносячы _%1$d-%2$d шкоду._ Гэта электрычнасць будзе пераходзіць у бліжэйшых персанажаў і лягчэй распаўсюджваецца ў вадзе. Дугі ад гэтай палачкі могуць нанесці шкоду вам, але не вашым саюзнікам.
items.wands.wandoflivingearth$earthguardian.desc=Камяні з вашай палачкі жывой зямлі сфармаваліся ў ахоўнага землянога вартаўніка! Гэты скалісты абаронца будзе атакаваць бліжэйшых ворагаў, што прымусіць іх атакаваць вартаўніка замест вас. Калі ўсе пагрозы паблізу знікнуць, вартаўнік зноў сфарміруецца вакол вас і вернецца, калі вы наступны раз выкарыстаеце сваю палачку.
items.wands.wandoflivingearth$earthguardian.discover_hint=Вы можаце знайсці гэтага персанажа з дапамогай спецыяльнай палачкі.
items.wands.wandoflivingearth$earthguardian.name=земляны апякун
items.wands.wandoflivingearth$earthguardian.wand_info=Абарончая сіла вартаўніка звязана з узроўнем вашай палачкі. У цяперашні час яна блакуе ўрон ад _%1$d-%2$d._
items.wands.wandoflivingearth$rockarmor.desc=Ваша цела акружаюць магічныя камяні. Калі на вас нападуць, яны паспрабуюць заблакаваць вас і знізяць атрыманую вамі шкоду на 50%%. Аднак кожная заблакаваная шкода саскрабае частку скалы.\n\nАстатняя браня: %1$d.\n\nКалі вакол вас будзе дастаткова камянёў, наступны ўдар вашай палачкі жывой зямлі прымусіць іх сфармавацца ў ахоўніка, які будзе змагацца з вамі.\n\nБраня, неабходная для ахоўніка: %2$d.
items.wands.wandoflivingearth$rockarmor.desc_many=Гэты земляны ахоўнік таксама атрымлівае карысць ад «Сілы многіх». Засталося хадоў: %d.
items.wands.wandoflivingearth$rockarmor.name=каменныя даспехі
items.wands.wandoflivingearth.bmage_desc=Калі _Баявы маг_ б'е ворага посахам з жывой зямлі, частка нанесенай шкоды вяртаецца ў выглядзе каменнай брані.
items.wands.wandoflivingearth.desc=Гэтая палачка зроблена з дзіўнай пароды, з палоскамі святлівай жоўтай энергіі. Камяні нібы злёгку зрушваюцца, калі вы бярэце палачку ў рукі, быццам яны адчуваюць вашу руку.
items.wands.wandoflivingearth.eleblast_desc=Элементальны выбух з дапамогай посаха жывой зямлі наносіць 50% шкоды і лечыць актыўнага землянога ахоўніка за кожнага ўдаранага ворага.
items.wands.wandoflivingearth.name=палачка жывой зямлі
items.wands.wandoflivingearth.staff_name=персанал жывой зямлі
items.wands.wandoflivingearth.stats_desc=Гэтая палачка пасылае ў ворагаў стрэлы магічнага каменя, наносячы _%1$d-%2$d шкоду._ Затым камяні перафармуюцца вакол карыстальніка, даючы яму браню прапарцыйна нанесенай шкодзе. Калі будзе сабрана дастаткова броні, яна ператворыцца ў каменнага ахоўніка, калі палачка будзе наступны раз ударана.
items.wands.wandoflivingearth.upgrade_stat_name_2=Максімальны запас здароўя Апекуна
items.wands.wandoflivingearth.upgrade_stat_name_3=Блакіроўка апекуна
items.wands.wandofmagicmissile$magiccharge.desc=Ваша палачка з магічным снарадам вярнула энергію вашым палачкам, павялічыўшы эфектыўны ўзровень наступнага ўдару, які яны зробяць.\n\nВашы палачкі павялічаны да: +%d.\n\nХадоў магічнага зараду, што застаўся: %s.
items.wands.wandofmagicmissile$magiccharge.name=магічны зарад
items.wands.wandofmagicmissile.bmage_desc=Калі _Баявы маг_ б'е па ворагу посахам з магічнай ракеты, усе яго палачкі, акрамя яго посаха, зараджаюцца.
items.wands.wandofmagicmissile.desc=Гэтая даволі простая палачка выпускае снарады чыстай магічнай энергіі. Хоць сама палачка не мае ніякіх спецыяльных эфектаў, яна мае больш даступных зарадаў і можа ненадоўга ўзмацняць іншыя палачкі пры паляпшэнні.
items.wands.wandofmagicmissile.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.wands.wandofmagicmissile.eleblast_desc=Элементальны выбух магічнай ракетай з кіем наносіць 50% шкоды і дае магу 15 хадоў перазарадкі.
items.wands.wandofmagicmissile.name=палачка магічнай ракеты
items.wands.wandofmagicmissile.staff_name=персанал магічнай ракеты
items.wands.wandofmagicmissile.stats_desc=Кожны стрэл з гэтай палачкі наносіць _%1$d-%2$d ўрону_ і ненадоўга ўзмацняе іншыя палачкі, калі яе палепшыць.
items.wands.wandofprismaticlight.bmage_desc=Калі _Баявы маг_ б'е ворага посахам прызматычнага святла, той будзе паралізаваны на працягласць, якая залежыць ад узроўню посаха.
items.wands.wandofprismaticlight.desc=Гэтая палачка зроблена з суцэльнага кавалка напаўпразрыстага крышталю, падобнага да доўгага кавалка гладкага шкла. Маленькія кавалачкі рознакаляровага святла танчаць вакол кончыка палачкі, імкнучыся выбухнуць.
items.wands.wandofprismaticlight.eleblast_desc=Элементальны выбух з дапамогай прызматычнага святла наносіць 67% шкоды, адлюстроўвае ўсю мясцовасць пад выбухам і асляпляе ворагаў на 5 хадоў.
items.wands.wandofprismaticlight.name=палачка прызматычнага святла
items.wands.wandofprismaticlight.staff_name=персанал прызматычнага святла
items.wands.wandofprismaticlight.stats_desc=Гэтая палачка страляе прамянямі святла, якія праразаюць цемру падзямелля, выяўляючы схаваныя зоны і пасткі. Прамень можа асляпіць ворагаў і наносіць _%1$d-%2$d шкоду._ Дэманічныя і нябожчыцкія ворагі будуць гарэць у яркім святле палачкі, атрымліваючы дадатковую шкоду.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Сляпы шанец
items.wands.wandofprismaticlight.upgrade_stat_name_3=Працягласць святла
items.wands.wandofregrowth$dewcatcher.desc=Расалаўцы — цудоўныя расліны, якія напаўняюць сябе чароўнай расой. Яны спрабуюць маскіравацца пад траву, каб пазбегнуць увагі, але іх выпукласці сабранай расы выдаюць іх.
items.wands.wandofregrowth$dewcatcher.discover_hint=Гэтую расліну можна знайсці з дапамогай спецыяльнай палачкі.
items.wands.wandofregrowth$dewcatcher.name=Лавец расы
items.wands.wandofregrowth$lotus.desc=Залаты лотас — містычная расліна, якую можна выклікаць толькі магутным чарадзейным палачкам. Яго аўра ўзмацняе ўсе расліны і іх эфекты, але праз кароткі час яна выпальвае сваю энергію і гіне.
items.wands.wandofregrowth$lotus.discover_hint=Вы можаце знайсці гэтую расліну з дапамогай спецыяльнай палачкі, пасля яе некалькі разоў мадэрнізацыі.
items.wands.wandofregrowth$lotus.name=Залаты лотас
items.wands.wandofregrowth$lotus.wand_info=Гэты лотас быў створаны з дапамогай палачкі аднаўлення _+%1$d_. Усе расліны пад яго дзеяннем _імгненна спрацуюць_, калі іх пасадзіць на персанажа. Расліны таксама будуць мець _%2$d%% шанец_ выпусціць сваё насенне, а наканечнікі дроцікаў будуць выкарыстоўваць _%3$d%% меншую трываласць_.
items.wands.wandofregrowth$seedpod.desc=Насенныя струкі — гэта чароўныя расліны, якія даюць насенне з іншых відаў раслін, а не ўласнае насенне. Яны нейкім чынам распаўсюджваюцца, нягледзячы на тое, што не маюць уласнага насення.
items.wands.wandofregrowth$seedpod.discover_hint=Гэтую расліну можна знайсці з дапамогай спецыяльнай палачкі.
items.wands.wandofregrowth$seedpod.name=Насенная стручка
items.wands.wandofregrowth.bmage_desc=Калі _Баявы маг_ б'е ворага посахам аднаўлення, і абодва стаяць на траве, ён атрымлівае травяное лячэнне прапарцыйна нанесенай шкодзе.
items.wands.wandofregrowth.degradation=Пасля чарговых зарадаў _%d_ гэтая палачка перастане вырошчваць расліны і свежую траву. Гэты ліміт павялічваецца пры павышэнні ўзроўню або паляпшэнні палачкі.
items.wands.wandofregrowth.desc=Гэтая палачка зроблена з тонкага стрыжня, майстэрскі выразанага па дрэве. Неяк яна ўсё яшчэ жывая і яркая, ярка-зялёная, як асяродак маладога дрэва. «Калі жыццё спыняецца, новае жыццё заўсёды пачынае расці... Вечны цыкл заўсёды застаецца!»
items.wands.wandofregrowth.eleblast_desc=Элементальны выбух з дапамогай посаха аднаўленчага росту ўкараняе ворагаў і выпадковым чынам расце трава ў зоне выбуху.
items.wands.wandofregrowth.name=палачка адрастання
items.wands.wandofregrowth.staff_name=персанал адраджэння
items.wands.wandofregrowth.stats_desc=Пры выкарыстанні гэтая палачка выпраменьвае магічную энергію аднаўлення вонкі ў выглядзе конуса, прымушаючы траву, карані і рэдкія расліны ажываць. Наступны ўдар спажывае зарады _%1$d_. Чым больш зарадаў выкарыстоўвае палачка, тым большы і мацнейшы эфект.
items.wands.wandofregrowth.upgrade_stat_name_1=Трава на адзін зарад
items.wands.wandofregrowth.upgrade_stat_name_2=Агульны ліміт травы
items.wands.wandoftransfusion.bmage_desc=Калі _Баявы маг_ б'е па зачараваным ворагу посахам пералівання, ён атрымлівае шчыт, і яго наступны ўдар посахам не будзе каштаваць яму здароўя.
items.wands.wandoftransfusion.charged=Ваш персанал зараджаны жыццёвай энергіяй вашага ворага!
items.wands.wandoftransfusion.desc=Даволі простая па форме палачка вылучаецца сваім пурпуровым адценнем і чорным каменем на кончыку.
items.wands.wandoftransfusion.eleblast_desc=Элементальны выбух з дапамогай посаха пералівання зачароўвае ворагаў, лечыць саюзнікаў і наносіць 100% шкоды нежывым ворагам.
items.wands.wandoftransfusion.name=палачка пералівання крыві
items.wands.wandoftransfusion.ondeath=Ты забіў сябе ўласнай палачкай пералівання крыві...
items.wands.wandoftransfusion.staff_name=персанал пералівання крыві
items.wands.wandoftransfusion.stats_desc=Пры выкарыстанні на саюзніках або зачараваных ворагах гэтая палачка высмоктвае _%1$d здароўя карыстальніка_, каб вылечыць або абараніць саюзніка, надаючы яму _%2$d здароўя._ Пры выкарыстанні на ворагах палачка ненадоўга абарочвае іх, адначасова накладваючы на карыстальніка _%3$d шчыт_. Варожая нежыццё атрымлівае _%4$d-%5$d шкоду_ замест таго, каб быць зачараванай.
items.wands.wandoftransfusion.upgrade_stat_name_1=Лячэнне саюзнікаў
items.wands.wandoftransfusion.upgrade_stat_name_2=Самаабарона
items.wands.wandoftransfusion.upgrade_stat_name_3=Шкода ад нежыці
items.wands.wandofwarding$ward.desc_1=Гэты базавы варт аўтаматычна ўдарыць любым ворагам, які трапіць у яго поле зроку, наносячы _%1$d-%2$d ўрону._\n\nУдар па гэтым варце вашай палачкай ахоўнай палачкі палепшыць яго.\n\nГэты варт ударыць толькі адзін раз, перш чым рассейвацца.\n\nВаша палачка ахоўнай палачкі выкарыстоўвае _%3$d энергію_ для падтрымання гэтага варта.
items.wands.wandofwarding$ward.desc_2=Гэты палепшаны варт мае больш складаны ўзор і можа атакаваць некалькі разоў. Кожны ўдар сілай гэтага варта нанясе _%1$d-%2$d ўрону._\n\nУдар сілай гэтага варта вашай палачкай ахоўнай палачкі палепшыць яго.\n\nГэты варт ударыць сілай тры разы, перш чым рассейвацца.\n\nВаша палачка ахоўнай палачкі выкарыстоўвае _%3$d энергію_ для падтрымання гэтага варта.
items.wands.wandofwarding$ward.desc_3=Гэты цалкам палепшаны вард здольны атакаваць больш разоў, чым яго папярэднікі. Кожны ўдар сілай гэтага варда нанясе _%1$d-%2$d ўрону._\n\nУдар сілай гэтага варда вашай палачкай ахоўнай палачкі палепшыць яго.\n\nГэты вард зробіць пяць удараў сілай, перш чым знікне.\n\nВаша палачка ахоўнай палачкі выкарыстоўвае _%3$d энергію_ для падтрымання гэтага варта.
items.wands.wandofwarding$ward.desc_4=Гэты меншы вартавы мае такую ж агнявую моц, як і большы варты, але мае здароўе замест пэўнай колькасці зарадаў. Ён нагадвае каштоўны камень на кончыку вашай ахоўнай палачкі. Кожны ўдар гэтым вартавым нанясе _%1$d-%2$d ўрону._\n\nУдар па гэтым вартавым вашай ахоўнай палачкай палепшыць і вылечыць яго.\n\nГэты вартавы будзе марнаваць частку здароўя кожны раз, калі ён ударае ворага, але яго можна вылечыць, выкарыстоўваючы на ім вашу ахоўную палачку.\n\nВаша ахоўная палачка выкарыстоўвае _%3$d энергію_ для падтрымання гэтага вартавага.
items.wands.wandofwarding$ward.desc_5=Гэты палепшаны вартавы большы і больш трывалы, чым меншы вартавы. Кожны ўдар гэтым вартавым нанясе _%1$d-%2$d ўрону._\n\nУдар па гэтым вартавым вашай ахоўнай палачкай палепшыць і вылечыць яго.\n\nГэты вартавы будзе марнаваць частку здароўя кожны раз, калі ён ударае ворага, але яго можна вылечыць, выкарыстоўваючы на ім вашу ахоўную палачку.\n\nВаша ахоўная палачка выкарыстоўвае _%3$d энергію_ для падтрымання гэтага вартавога.
items.wands.wandofwarding$ward.desc_6=Гэты цалкам палепшаны вартавы значна больш трывалы, чым яго папярэднікі. Кожны ўдар гэтым вартавым нанясе _%1$d-%2$d ўрону._\n\nУдар па гэтым вартавым вашай ахоўнай палачкай вылечыць яго.\n\nГэты вартавы будзе марнаваць частку здароўя кожны раз, калі ён ударае ворага, але яго можна вылечыць, выкарыстоўваючы на ім вашу ахоўную палачку.\n\nВаша ахоўная палачка выкарыстоўвае _%3$d энергію_ для падтрымання гэтага вартавога.
items.wands.wandofwarding$ward.desc_generic_sentry=Гэты вартавы мае такую ж агнявую моц, як і варт, але замест пэўнай колькасці зарадаў мае здароўе. Ён нагадвае каштоўны камень на кончыку вашай ахоўнай палачкі.\n\nУдар па гэтым вартавым палачкай ахоўнай палачкі палепшыць і вылечыць яго.\n\nГэты вартавы будзе марнаваць частку здароўя кожны раз, калі ён параніць ворага, але яго можна вылечыць, выкарыстаўшы на ім ахоўную палачку.
items.wands.wandofwarding$ward.desc_generic_ward=Гэты вард аўтаматычна параніць любога ворага, які трапіць у яго поле зроку.\n\nПадчас паражэння гэтага варда палачкай варда ён будзе палепшаны.\n\nВарды маюць абмежаваную колькасць паражэнняў, перш чым знікнуць.
items.wands.wandofwarding$ward.discover_hint=Вы можаце знайсці гэтага персанажа з дапамогай спецыяльнай палачкі.
items.wands.wandofwarding$ward.dismiss_body=Вы можаце развеяць гэты варт, калі больш не хочаце, каб ваша палачка падтрымлівала яго. Гэта адразу ж знішчыць варт.\n\nРазвеяць гэты варт?
items.wands.wandofwarding$ward.dismiss_cancel=не
items.wands.wandofwarding$ward.dismiss_confirm=так
items.wands.wandofwarding$ward.dismiss_title=Зняць з гэтага падапечнага?
items.wands.wandofwarding$ward.name_1=меншая палата
items.wands.wandofwarding$ward.name_2=палата
items.wands.wandofwarding$ward.name_3=вялікі прыход
items.wands.wandofwarding$ward.name_4=меншы вартавы
items.wands.wandofwarding$ward.name_5=вартавы
items.wands.wandofwarding$ward.name_6=вялікі вартавы
items.wands.wandofwarding.bad_location=Там нельга паставіць варду.
items.wands.wandofwarding.bmage_desc=Калі _Баявы маг_ б'е па ворагу ахоўным посахам, усе актыўныя ахоўныя палачкі і вартавыя маюць шанец вылечыцца.
items.wands.wandofwarding.desc=Гэтая кароткая металічная палачка мае ярка-фіялетавы камень, які лунае над яе кончыкам.
items.wands.wandofwarding.eleblast_desc=Элементальны выбух з дапамогай ахоўнага посаха лечыць усе ахоўныя палі і вартавых у зоне выбуху.
items.wands.wandofwarding.name=ахоўная палачка
items.wands.wandofwarding.no_more_wards=Твая палачка больш не можа вытрымаць варты.
items.wands.wandofwarding.staff_name=персанал аховы
items.wands.wandofwarding.stats_desc=Замест таго, каб наносіць непасрэдную шкоду ворагу, гэтая палачка будзе выклікаць стацыянарныя варты і вартавых. Варты можна выклікаць дзе заўгодна, нават праз сцены, калі ў вас ёсць зрок. Гэтая палачка можа адначасова падтрымліваць варты на _%d энергію_.
items.wands.wandofwarding.upgrade_stat_name_1=Пашкоджанне варда
items.wands.wandofwarding.upgrade_stat_name_2=Уорд Энерджы
items.waterskin.ac_drink=НАПІТОК
items.waterskin.collected=Ты збіраеш расінку ў свой бурдзюк.
items.waterskin.desc=Ёмістасць для вадкасці, зробленая са скуры і вяроўкі, запячатаная коркавым коркам.
items.waterskin.desc_full=Здаецца, поўны бурдзюк для вады выпраменьвае энергію, магчыма, яго можна выкарыстаць, каб дабраславіць іншы прадмет для выжывання?
items.waterskin.desc_heal=Бурдзюк у цяперашні час выкарыстоўваецца для захоўвання гаючай вады. Чым больш напоўнены бурдзюк, тым хутчэй вы адчуеце сябе здаровым, калі будзеце з яго піць. Вы будзеце піць толькі столькі, колькі вам трэба.
items.waterskin.desc_water=Зараз у бурдзюку проста пітная вада. Напэўна, у падзямеллі ёсць нешта, што можна было б захоўваць у бурдзюку.
items.waterskin.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.waterskin.empty=Твой бурдзюк пусты!
items.waterskin.full=Твой бурдзюк поўны!
items.waterskin.name=бурдзюк для вады
items.weapon.curses.annoying.desc=Надакучлівая зброя здольная гаварыць, але яна занадта энергічная. Часта яна будзе прыцягваць да вас увагу, нават ненаўмысна.
items.weapon.curses.annoying.elestrike_desc=Элементальны ўдар з надакучлівым праклёнам мае 20% верагоднасць параніць кожнага ворага ў зоне дзеяння на 6 хадоў.
items.weapon.curses.annoying.msg_1=О-о, мы што, з чымсьці змагаемся?!
items.weapon.curses.annoying.msg_10=ДОБРА ЎДАРАЎ!
items.weapon.curses.annoying.msg_11=Я не хацеў быць зброяй, я хацеў быць сякерай лесаруба.
items.weapon.curses.annoying.msg_12=Памятайце, што празмерная самаўпэўненасць — павольны і падступны забойца.
items.weapon.curses.annoying.msg_13=УСЕ ВАШЫЯ БАЗЫ НАЛЕЖАЦЬ НАМ!
items.weapon.curses.annoying.msg_2=ТАК, ЗАБЕРЫЦЕ ІХ!
items.weapon.curses.annoying.msg_3=ГЭЙ, СЛУХАЙ!
items.weapon.curses.annoying.msg_4=МЫ ЎЖО ДАБРАЛІСЯ ДА НАЧАЛЬНІКА!?
items.weapon.curses.annoying.msg_5=ОЙ, НЕ ТАК МОЦНА МЯНЕ РАЗМАХВАЙ!
items.weapon.curses.annoying.msg_6=ЗГЫБІ, НАСЯКАЕ!
items.weapon.curses.annoying.msg_7=У-У-У-У!
items.weapon.curses.annoying.msg_8=МОЖАМ ЗРАБІЦЬ ПЕРАПЫНАК!?
items.weapon.curses.annoying.msg_9=ВАУ, ХА-ХА!
items.weapon.curses.annoying.name=раздражняльны %s
items.weapon.curses.dazzling.desc=Асляпляльная зброя часам бліскае асляпляльным святлом, асляпляючы ўсё, што можа яе ўбачыць.
items.weapon.curses.dazzling.elestrike_desc=Стыхійны ўдар з асляпляльным праклёнам мае 50% верагоднасць асляпіць кожнага ворага ў зоне дзеяння на 6 хадоў.
items.weapon.curses.dazzling.name=асляпляльны %s
items.weapon.curses.displacing.desc=Зброя, якая перамяшчаецца, напоўнена хаатычнай магіяй тэлепартацыі, якая валодае здольнасцю выпадковым чынам дэфармаваць ворагаў па падлозе.
items.weapon.curses.displacing.elestrike_desc=Элементальны ўдар з праклёнам выцяснення мае 50% верагоднасць тэлепартаваць кожнага ворага ў зоне дасяжнасці.
items.weapon.curses.displacing.name=выцясняючы %s
items.weapon.curses.explosive.desc=Выбуховая зброя паступова набірае магутнасць і выбухае, пашкоджваючы ўсё, што знаходзіцца побач.
items.weapon.curses.explosive.desc_cool=Ваша зброя зараз халодная навобмацак.
items.weapon.curses.explosive.desc_hot=Твая зброя нагрэлася! Яна зараз выбухне!
items.weapon.curses.explosive.desc_warm=Твая зброя назапашвае энергію і саграваецца...
items.weapon.curses.explosive.elestrike_desc=Элементальны ўдар з выбуховым праклёнам мае 50% верагоднасць выклікаць выбух на выпадковым праціўніку ў зоне дзеяння.
items.weapon.curses.explosive.hot=Гарача!
items.weapon.curses.explosive.name=выбуховая рэчыва %s
items.weapon.curses.explosive.warm=Цёплы...
items.weapon.curses.friendly.desc=Дружалюбная зброя найлепш падыходзіць для пацыфістаў, бо часам выклікае магію, якая робіць немагчымым бой.
items.weapon.curses.friendly.elestrike_desc=Элементальны ўдар з праклёнам сяброў мае 50% шанец зачараваць кожнага ворага ў зоне дзеяння на 6 хадоў.
items.weapon.curses.friendly.name=дружалюбны %s
items.weapon.curses.polarized.desc=На палярызаваную зброю ўздзейнічае магія, якая прымушае яе атаку наносіць на 50% больш шкоды або зусім не наносіць шкоды.
items.weapon.curses.polarized.elestrike_desc=Элементальны ўдар з палярызаваным праклёнам мае 50% верагоднасць нанесці 24-36 адзінак шкоды кожнаму ворагу ў радыусе дзеяння.
items.weapon.curses.polarized.name=палярызаваны %s
items.weapon.curses.sacrificial.desc=Ахвярная зброя патрабуе крыві ад уладальніка ў абмен на напад на ворагаў. Чым здаравейшы ўладальнік, тым больш крыві забярэ праклён.
items.weapon.curses.sacrificial.elestrike_desc=Элементальны ўдар з ахвярным праклёнам прымушае героя і кожнага ворага ў зоне дзеяння крывавіць на 12 адзінак здароўя.
items.weapon.curses.sacrificial.name=ахвярны %s
items.weapon.curses.wayward$waywardbuff.desc=Магія вашай нявернай зброі актывавалася, з-за чаго яна на кароткі час стала надзвычай недакладнай. Звярніце ўвагу, што гэта не ўплывае на атакі, якія гарантавана трапяць, такія як нечаканыя атакі. Паспяховая атака нявернай зброяй адразу ж зніме гэты эфект. \n\nХадоў засталося: %s.
items.weapon.curses.wayward$waywardbuff.name=няслушны
items.weapon.curses.wayward.desc=Зброя, якая кідаецца ў вочы, часам становіцца надзвычай недакладнай. Гэтая магія дзейнічае нядоўга пасля актывацыі, але яе можна развеяць, нанёсшы ўдар зброяй, якая кідаецца ў вочы.
items.weapon.curses.wayward.elestrike_desc=Элементальны ўдар з праклёнам «адхіленне» мае 50% верагоднасць праклясці кожнага ворага ў радыусе дзеяння на 6 хадоў.
items.weapon.curses.wayward.name=нягодны %s
items.weapon.enchantments.blazing.desc=Гэтае зачараванне прымушае зброю вывяргацца полымя, падпальваючы ворагаў і наносячы дадатковую шкоду ўжо палаючым ворагам.
items.weapon.enchantments.blazing.elestrike_desc=Элементальны ўдар з палаючымі чарамі распаўсюджвае агонь па кожнай клетцы ў зоне дзеяння, што доўжыцца 8 хадоў.
items.weapon.enchantments.blazing.name=палаючы %s
items.weapon.enchantments.blocking$blockbuff.desc=Блакуючыя чары вашай зброі далі вам кароткачасовае павышэнне абарончай сілы!\n\nШчыта засталася: %d\n\nХадоў засталося: %s.
items.weapon.enchantments.blocking$blockbuff.name=блакіроўка
items.weapon.enchantments.blocking.desc=Блакуючая зброя мае шанец ненадоўга абараніць вас пасля атакі ёю.
items.weapon.enchantments.blocking.elestrike_desc=Элементальны ўдар з блакуючым закляццем дае Дуэлянту дадатковыя 6 адзінак абароны за кожнага ворага ў зоне дзеяння.
items.weapon.enchantments.blocking.name=блакіроўка %s
items.weapon.enchantments.blooming.desc=Квітнеючая зброя ўтрымлівае магію, якая прымушае расліннасць прарастаць на або вакол тых, каго яна параніла.
items.weapon.enchantments.blooming.elestrike_desc=Стыхійны ўдар з квітнеючым зачараваннем распаўсюджвае траву на 8 клетак у радыусе дзеяння і прыгнятае ўсіх ворагаў у радыусе дзеяння на 6 хадоў.
items.weapon.enchantments.blooming.name=квітнеючы %s
items.weapon.enchantments.chilling.desc=Ворагі, па якіх накладваецца гэтае закляцце, астуджаюцца, што запавольвае іх рух і атакі.
items.weapon.enchantments.chilling.elestrike_desc=Элементальны ўдар з халодным зачараваннем распаўсюджвае халоднае паветра па кожнай клетцы ў радыусе дзеяння, што доўжыцца 8 хадоў.
items.weapon.enchantments.chilling.name=расслабляльны %s
items.weapon.enchantments.corrupting.desc=Гэта магутнае закляцце валодае здольнасцю падпарадкоўваць ворагаў вашай волі. Калі вораг забіты гэтай зброяй, ёсць верагоднасць, што ён замест смерці стане сапсаваным.
items.weapon.enchantments.corrupting.elestrike_desc=Элементальны ўдар з разбуральнымі чарамі мае 5-25% верагоднасць (у залежнасці ад адсутнага HP) разбурыць кожнага ворага ў зоне дзеяння, акрамя галоўнай цэлі.
items.weapon.enchantments.corrupting.name=разбэшчванне %s
items.weapon.enchantments.elastic.desc=Эластычная зброя мае шанец адкінуць ворагаў назад на кароткія адлегласці.
items.weapon.enchantments.elastic.elestrike_desc=Элементальны ўдар з эластычным зачараваннем адкідае ўсіх ворагаў у радыусе дзеяння на 5 клетак назад.
items.weapon.enchantments.elastic.name=эластычны %s
items.weapon.enchantments.grim.desc=Гэтае магутнае закляцце валодае сілай імгненна пакараць смерцю ворага. Эфект тым больш верагодны, чым слабейшы вораг.
items.weapon.enchantments.grim.elestrike_desc=Элементальны ўдар з змрочным зачараваннем мае 6-30% верагоднасць (у залежнасці ад адсутнага HP) забіць усіх ворагаў у зоне дзеяння, акрамя асноўнай цэлі.
items.weapon.enchantments.grim.name=змрочны %s
items.weapon.enchantments.kinetic$conserveddamage.desc=Ваша зброя назапасіла лішнюю сілу ад папярэдняга смяротнага ўдару і выкарыстае яе ў якасці дадатковай шкоды для вашай наступнай атакі. Аднак з часам энергія будзе паступова знікаць.\n\nЗахаваная шкода: %d.
items.weapon.enchantments.kinetic$conserveddamage.name=захаванае пашкоджанне
items.weapon.enchantments.kinetic.desc=Калі вораг забіваецца кінетычнай зброяй, любая лішняя сіла захоўваецца ў зброі і будзе выкарыстана для наступнай паспяховай атакі.
items.weapon.enchantments.kinetic.elestrike_desc=Элементальны ўдар з кінетычным зачараваннем наносіць 40% назапашанай шкоды кожнаму ворагу ў зоне дзеяння, акрамя асноўнай мэты.
items.weapon.enchantments.kinetic.name=кінетычны %s
items.weapon.enchantments.lucky.desc=Ворагі, забітыя ўдачлівай зброяй, маюць шанец выпасці з дадатковай здабычы.
items.weapon.enchantments.lucky.elestrike_desc=Элементальны ўдар з шчаслівым зачараваннем мае 12,5% верагоднасць з'яўлення здабычы пад кожным ворагам у зоне дзеяння. Гэты эфект можа спрацаваць толькі адзін раз на кожнага ворага.
items.weapon.enchantments.lucky.name=шчаслівы %s
items.weapon.enchantments.projecting.desc=З дапамогай гэтага зачаравання зброя блізкага бою атрымае палепшаную далёкасць дзеяння. Зброя далёкага бою будзе прабіваць сцены, калі яе накіраваць на бліжэйшыя мэты.
items.weapon.enchantments.projecting.elestrike_desc=Элементальны ўдар з праекцыйным зачараваннем наносіць 30% шкоды кожнаму ворагу ў радыусе дзеяння, акрамя галоўнай цэлі.
items.weapon.enchantments.projecting.name=праектаванне %s
items.weapon.enchantments.shocking.desc=Электрычныя дугі ад шокавай зброі, якія наносяць дадатковую шкоду ўсім ворагам паблізу.
items.weapon.enchantments.shocking.elestrike_desc=Элементальны ўдар з шакавальным зачараваннем распаўсюджвае электрычнасць па кожнай клетцы ў радыусе дзеяння, што доўжыцца 8 хадоў.
items.weapon.enchantments.shocking.name=шакавальны %s
items.weapon.enchantments.unstable.desc=Гэтае зачараванне выпраменьвае хаатычную энергію, дзейнічаючы як новае зачараванне з кожным ударам.
items.weapon.enchantments.unstable.elestrike_desc=Элементальны ўдар з нестабільным зачараваннем накладвае выпадковы эфект зачаравання на кожнага ворага ў зоне дзеяння, акрамя асноўнай мэты.
items.weapon.enchantments.unstable.name=нестабільны %s
items.weapon.enchantments.vampiric.desc=Гэта магутнае зачараванне з кожным ударам высмоктвае жыццёвую сілу з ворагаў, накіроўваючы яе назад у носьбіта. Эфект тым мацнейшы, чым меншы ўзровень здароўя носьбіта.
items.weapon.enchantments.vampiric.elestrike_desc=Элементальны ўдар з вампірскім зачараваннем аднаўляе Дуэлянту 2,5 адзінкі здароўя за кожнага ворага ў зоне дзеяння.
items.weapon.enchantments.vampiric.name=вампір %s
items.weapon.melee.assassinsblade.ability_desc=Дуэлянт можа _падкрадвацца_, трымаючы ў руках клінок забойцы. Гэтая здольнасць дазваляе дуэлянту імгненна міргнуць на адлегласці да 3 клетак і дае яму _%d хады нябачнасці._
items.weapon.melee.assassinsblade.ability_name=пракрасціся
items.weapon.melee.assassinsblade.desc=Невялікі хвалісты клінок з абсідыяну, нялёгкі ў выкарыстанні, нягледзячы на лёгкую вагу, але смяротны, калі трапляе ў патрэбную цэль.
items.weapon.melee.assassinsblade.name=лязо забойцы
items.weapon.melee.assassinsblade.stats_desc=Гэтая зброя мацнейшая супраць непадрыхтаваных ворагаў.
items.weapon.melee.assassinsblade.typical_ability_desc=Дуэлянтка можа _падкрадвацца_, трымаючы ў руках клінок забойцы. Гэтая здольнасць дазваляе дуэлянтцы імгненна міргнуць і перамяшчацца на адлегласць да 3 клетак, а звычайна яна атрымлівае _%d хады нябачнасці._
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Працягласць здольнасці
items.weapon.melee.battleaxe.ability_desc=Дуэлянт можа нанесці _моцны ўдар_ баявой сякерай. Гэтая сканцэнтраваная атака наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.battleaxe.ability_name=моцны ўдар
items.weapon.melee.battleaxe.desc=Велізарная сталёвая галоўка гэтай баявой сякеры надае значную вагу кожнаму шырокаму ўдару.
items.weapon.melee.battleaxe.name=баявая сякера
items.weapon.melee.battleaxe.stats_desc=Гэта даволі дакладная зброя.
items.weapon.melee.battleaxe.typical_ability_desc=Дуэлянт можа нанесці _моцны ўдар_ баявой сякерай. Гэтая сканцэнтраваная атака звычайна наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.crossbow$chargedshot.desc=Дуэлянтка факусуе сілу свайго арбалета. Наступная атака, якую яна зробіць ім, заўсёды прывядзе да траплення і прымянення аднаго з трох эфектаў: \n — атакі блізкага бою адкінуць ворагаў на некалькі клетак. \n — дроцікі без наканечніка нанясуць дадатковую шкоду. \n — дроцікі з наканечнікам атрымаюць дадатковае выкарыстанне і прымяняюцца да зоны 7x7. Станоўчыя эфекты дроцікаў будуць уплываць толькі на саюзнікаў, а шкодныя эфекты — толькі на ворагаў. Дуэлянтка не можа выкарыстоўваць гэтую здольнасць, каб прымяніць станоўчыя эфекты дроцікаў да сябе.
items.weapon.melee.crossbow$chargedshot.name=зараджаны
items.weapon.melee.crossbow.ability_desc=Дуэлянтка можа _зарадзіць_ свой арбалет, у выніку чаго яе наступная звычайная атака ім заўсёды будзе трапляць і ўжываць адзін з трох эфектаў: атакі ў блізкім бою адкінуць ворагаў, ненаканечныя дроцікі нанясуць _+%1$d шкоду_, а наканечныя дроцікі будуць ужываць свой эфект у зоне 7x7 і будуць дзейнічаць яшчэ _%2$d выкарыстанняў_.
items.weapon.melee.crossbow.ability_name=зараджаны стрэл
items.weapon.melee.crossbow.desc=Даволі складаная зброя, якая страляе стрэламі з выключнай хуткасцю. Хоць ён і не прызначаны для гэтага, вага і трывалая канструкцыя гэтага арбалета робяць яго таксама нядрэннай зброяй блізкага бою.
items.weapon.melee.crossbow.name=арбалет
items.weapon.melee.crossbow.stats_desc=Гэтая зброя ўзмацняе кінутыя дроцікі, каб яны наносілі _%1$d-%2$d шкоду_, калі яна ёсць у наяўнасці, і нават накладвае на іх свае зачараванні.
items.weapon.melee.crossbow.typical_ability_desc=Дуэлянтка можа _зарадзіць_ свой арбалет, у выніку чаго яе наступная звычайная атака ім заўсёды будзе трапляць і ўжываць адзін з трох эфектаў: атакі ў блізкім бою адкінуць ворагаў, ненаканечныя дроцікі звычайна нанясуць _+%1$d шкоду_, а наканечныя дроцікі будуць ужываць свой эфект у зоне 7x7 і звычайна доўжацца _%2$d больш выкарыстанняў_.
items.weapon.melee.crossbow.typical_stats_desc=Звычайна гэтая зброя ўзмацняе кінутыя дроцікі, каб наносіць _%1$d-%2$d ўрону_, калі яна ёсць у наяўнасці, і нават надае ім свае зачараванні.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Павышэнне здольнасцей
items.weapon.melee.cudgel.ability_desc=Дуэлянт можа нанесці _моцны ўдар_ дубінкай. Гэтая сканцэнтраваная атака наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.cudgel.ability_name=моцны ўдар
items.weapon.melee.cudgel.desc=Невялікая латуневая булава, зробленая хутчэй як сродак самаабароны для дваран, чым як зброя для шукальнікаў прыгод.
items.weapon.melee.cudgel.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.melee.cudgel.name=дубінка
items.weapon.melee.cudgel.stats_desc=Гэта даволі дакладная зброя.
items.weapon.melee.cudgel.typical_ability_desc=Дуэлянт можа нанесці _моцны ўдар_ дубінай. Гэтая сканцэнтраваная атака звычайна наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.dagger.ability_desc=Дуэлянтка можа _падкрадвацца_, трымаючы ў руках кінжал. Гэтая здольнасць дазваляе ёй імгненна міргнуць, перамяшчаючыся на адлегласць да 5 клетак, і дае ёй _%d хады нябачнасці._
items.weapon.melee.dagger.ability_name=пракрасціся
items.weapon.melee.dagger.desc=Просты жалезны кінжал з паношанай драўлянай ручкай.
items.weapon.melee.dagger.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.melee.dagger.name=кінжал
items.weapon.melee.dagger.stats_desc=Гэтая зброя мацнейшая супраць непадрыхтаваных ворагаў.
items.weapon.melee.dagger.typical_ability_desc=Дуэлянтка можа _падкрадвацца_, трымаючы ў руках кінжал. Гэтая здольнасць дазваляе ёй імгненна міргнуць, перамяшчаючыся на адлегласць да 5 клетак, і звычайна дае ёй _%d хады нябачнасці._
items.weapon.melee.dagger.upgrade_ability_stat_name=Працягласць здольнасці
items.weapon.melee.dirk.ability_desc=Дуэлянтка можа _падкрадвацца_, трымаючы ў руках кінжал. Гэтая здольнасць дазваляе ёй імгненна міргнуць, перамяшчаючыся на адлегласць да 4 клетак, і дае ёй _%d хады нябачнасці._
items.weapon.melee.dirk.ability_name=пракрасціся
items.weapon.melee.dirk.desc=Больш доўгі колючы кінжал дае крыху больш сталі, каб урывацца ў ворагаў.
items.weapon.melee.dirk.name=корцік
items.weapon.melee.dirk.stats_desc=Гэтая зброя мацнейшая супраць непадрыхтаваных ворагаў.
items.weapon.melee.dirk.typical_ability_desc=Дуэлянтка можа _падкрадвацца_, трымаючы ў руках кінжал. Гэтая здольнасць дазваляе ёй імгненна міргнуць, перамяшчаючыся на адлегласць да 4 клетак, і звычайна дае ёй _%d хады нябачнасці._
items.weapon.melee.dirk.upgrade_ability_stat_name=Працягласць здольнасці
items.weapon.melee.flail$spinabilitytracker.desc=Дуэлянтка круціць свой цэп, назапашваючы шкоду для наступнай звычайнай атакі. Кожнае кручэнне займае адзін ход, але павялічвае шкоду, максімум да трох кручэнняў. Цэп таксама гарантавана трапіць у цэп падчас кручэння.\n\nБягучыя кручэнні: %1$d%%.\nХадоў засталося: %2$s.
items.weapon.melee.flail$spinabilitytracker.name=спінінг
items.weapon.melee.flail.ability_desc=Дуэлянт можа _круціць_ цэп, каб на кароткі час назапасіць сілу. Кожны ход кручэння цэпа наносіць _+%d шкоду_ пры наступнай звычайнай атацы, максімум 3 разы. Круцельны цэп таксама гарантавана трапіць. Толькі пачатак кручэння цэпа каштуе зарад.
items.weapon.melee.flail.ability_name=кручэнне
items.weapon.melee.flail.desc=Шыпкі шар, прымацаваны да ручкі доўгім ланцугом. Вельмі нязграбны, але разбуральны, калі трапіць моцна.
items.weapon.melee.flail.name=цэп
items.weapon.melee.flail.spin_warn=Больш нельга круціць цэп.
items.weapon.melee.flail.stats_desc=Гэта даволі недакладная зброя. \nГэтая зброя не можа атакаваць нечакана.
items.weapon.melee.flail.typical_ability_desc=Дуэлянт можа _круціць_ цэп, каб на кароткі час назапасіць сілу. Кожны ход кручэння цэпа звычайна наносіць _+%d шкоду_ пры наступнай звычайнай атацы, максімум 3 разы. Круцельны цэп таксама гарантавана трапіць. Толькі пачатак кручэння цэпа каштуе зарад.
items.weapon.melee.gauntlet.ability_desc=Дуэлянт можа выканаць _камбінаваны ўдар_ каменнай пальчаткай. Гэтая атака гарантавана трапная і наносіць _+%d шкоду_ за кожны ўдар дуэлянта звычайнай блізкай або кідальнай зброяй. Калі дуэлянт не трапіць на працягу 5 хадоў, гэта камбінацыя скідаецца.
items.weapon.melee.gauntlet.ability_name=камбінаваны ўдар
items.weapon.melee.gauntlet.desc=Гэтая масіўная рукавіца зроблена з пунсовай тканіны, зверху якой пакрыты цяжкім магічным каменем. Тканіна аблягае цела, робячы тоўстыя каменныя пласціны амаль як другая скура. Размахванне такой цяжкай зброяй патрабуе сілы, але дадае велізарную моц вашым ударам.
items.weapon.melee.gauntlet.name=каменная пальчатка
items.weapon.melee.gauntlet.stats_desc=Гэта вельмі хуткая зброя.
items.weapon.melee.gauntlet.typical_ability_desc=Дуэлянт можа выконваць _камбінаваны ўдар_ каменнай пальчаткай. Гэтая атака гарантавана трапная і звычайна наносіць _+%d шкоду_ за кожны ўдар дуэлянта звычайнай блізкай або кідальнай зброяй. Калі дуэлянт не трапіць на працягу 5 хадоў, гэта камбінацыя скідаецца.
items.weapon.melee.glaive.ability_desc=Дуэлянт можа выкарыстаць наканечнік глефы, каб _прабіць_ ворага, які знаходзіцца ў зоне дасяжнасці, але не побач. Гэта наносіць _%1$d-%2$d шкоду_, адкідае ворага назад і гарантавана трапіць у цэль.
items.weapon.melee.glaive.ability_name=шып
items.weapon.melee.glaive.desc=Масіўная дрэўкавая зброя, якая складаецца з ляза мяча на канцы дрэўка.
items.weapon.melee.glaive.name=глефа
items.weapon.melee.glaive.stats_desc=Гэта даволі павольная зброя. \nГэтая зброя мае дадатковы радыус дзеяння.
items.weapon.melee.glaive.typical_ability_desc=Дуэлянт можа выкарыстаць наканечнік глефы, каб _прабіць_ ворага, які знаходзіцца ў зоне дасяжнасці, але не побач. Звычайна гэта наносіць _%1$d-%2$d шкоду_, адкідае ворага назад і гарантавана трапіць у цэль.
items.weapon.melee.gloves.ability_desc=Дуэлянт можа выконваць _камбінаваны ўдар_ у пальчатках з шыпамі. Гэтая атака гарантавана трапная і наносіць _+%d шкоду_ за кожны ўдар дуэлянта звычайнай блізкай або кідальнай зброяй. Калі дуэлянт не трапіць на працягу 5 хадоў, гэта камбінацыя скідаецца.
items.weapon.melee.gloves.ability_name=камбінаваны ўдар
items.weapon.melee.gloves.desc=Гэтыя пальчаткі з шыпамі не забяспечваюць рэальнай абароны, але яны выступаюць у якасці карыснай зброі, захоўваючы рукі свабоднымі.
items.weapon.melee.gloves.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.melee.gloves.name=пальчаткі з шыпамі
items.weapon.melee.gloves.stats_desc=Гэта вельмі хуткая зброя.
items.weapon.melee.gloves.typical_ability_desc=Дуэлянт можа выконваць _камбінаваны ўдар_ у пальчатках з шыпамі. Гэтая атака гарантавана трапная і звычайна наносіць _+%d шкоду_ за кожны ўдар дуэлянта звычайнай блізкай або кідальнай зброяй. Калі дуэлянт не ўдарыць на працягу 5 хадоў, гэта камбінацыя скідаецца.
items.weapon.melee.greataxe.ability_desc=Дуэлянтка можа выконваць атаку _адплаты_ вялікай сякерай, калі яе здароўе менш за 50%%. Гэтая разбуральная атака наносіць _%1$d-ZXQ2ZXQ ўрону,_ гарантавана трапляе ў ворага і дзейнічае імгненна, калі забівае яго.
items.weapon.melee.greataxe.ability_name=адплата
items.weapon.melee.greataxe.desc=Гэтая тытанічная сякера, прызначаная для нашэння праз плячо, такая ж магутная, як і цяжкая.
items.weapon.melee.greataxe.name=вялікая сякера
items.weapon.melee.greataxe.stats_desc=Гэтая зброя неверагодна цяжкая.
items.weapon.melee.greataxe.typical_ability_desc=Дуэлянтка можа выконваць атаку _адплаты_ вялікай сякерай, калі яе здароўе менш за 50%%. Гэтая разбуральная атака звычайна наносіць _%1$d-ZXQ2ZXQ ўрону,_ гарантавана трапіць у цэль і дзейнічае імгненна, калі забівае ворага.
items.weapon.melee.greatshield.ability_desc=Дуэлянт можа _абараніць_ сябе вялікім шчытом, цалкам адбіваючы ўсе фізічныя або магічныя атакі, накіраваныя супраць яго, на працягу _%d хадоў_. Пасля таго, як дуэлянт заблакуе атаку, зваротная атака або выкарыстанне магіі спыняць абарону.
items.weapon.melee.greatshield.ability_name=ахоўнік
items.weapon.melee.greatshield.desc=Хутчэй падобная на мабільную сцяну, чым на шчыт, гэтая гіганцкая маса металу дапамагае абараняцца, але не пакідае шмат месца для атакі.
items.weapon.melee.greatshield.name=вялікі шчыт
items.weapon.melee.greatshield.stats_desc=Гэтая зброя блакуе 0-%d ўрону. Блакіроўка павялічваецца з паляпшэннем.
items.weapon.melee.greatshield.typical_ability_desc=Дуэлянт можа _абараніць_ сябе вялікім шчытом, цалкам адбіваючы ўсе фізічныя або магічныя атакі, накіраваныя супраць яго, звычайна на працягу _%d хадоў_. Пасля таго, як дуэлянт заблакуе атаку, зваротная атака або выкарыстанне магіі спыніць абарону.
items.weapon.melee.greatshield.typical_stats_desc=Звычайна гэтая зброя блакуе 0-%d ўрону. Гэтая блакаванне маштабуецца з паляпшэннем.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Працягласць здольнасці
items.weapon.melee.greatsword.ability_desc=Дуэлянт можа _рассячы_ ворага двуручным мячом. Гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць у ворага. Калі "рассячэнне" забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць "рассячэнне" зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.greatsword.ability_name=расшчапляць
items.weapon.melee.greatsword.desc=Гэты велізарны клінок наносіць моцную шкоду, укладваючы ўсю сваю вагу ў кожны ўзмах.
items.weapon.melee.greatsword.name=вялікі меч
items.weapon.melee.greatsword.typical_ability_desc=Дуэлянт можа _рассячы_ ворага двуручным мячом. Звычайна гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць у ворага. Калі рассячэнне забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць рассячэнне зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.handaxe.ability_desc=Дуэлянт можа нанесці _моцны ўдар_ ручной сякерай. Гэтая сканцэнтраваная атака наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.handaxe.ability_name=моцны ўдар
items.weapon.melee.handaxe.desc=Лёгкая сякера, якая часцей за ўсё выкарыстоўваецца для валкі дрэў. Шырокае лязо таксама добра працуе супраць ворагаў.
items.weapon.melee.handaxe.name=ручная сякера
items.weapon.melee.handaxe.stats_desc=Гэта даволі дакладная зброя.
items.weapon.melee.handaxe.typical_ability_desc=Дуэлянт можа нанесці _моцны ўдар_ ручной сякерай. Гэтая сканцэнтраваная атака звычайна наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.katana.ability_desc=Дуэлянт можа _выпад_ з катанай на ворага, які знаходзіцца на адлегласці 1 клеткі. Гэта рухаецца да ворага, наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць.
items.weapon.melee.katana.ability_name=выпад
items.weapon.melee.katana.desc=Тонкі меч з вялікай металічнай гардай над дзяржальняй.
items.weapon.melee.katana.name=катана
items.weapon.melee.katana.stats_desc=Гэтая зброя блакуе 0-3 адзінкі шкоды.
items.weapon.melee.katana.typical_ability_desc=Дуэлянт можа _выпад_ з катанай на ворага, які знаходзіцца на адлегласці 1 клеткі. Гэтая атака рухаецца да ворага, звычайна наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць.
items.weapon.melee.longsword.ability_desc=Дуэлянт можа _рассячы_ ворага доўгім мячом. Гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць у цэль. Калі «рассячэнне» забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць «рассячэнне» зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.longsword.ability_name=расшчапляць
items.weapon.melee.longsword.desc=Доўгі, востры як брытва, сталёвы клінок гэтага мяча блішчыць супакойліва, хоць з-за сваіх памераў ён даволі цяжкі.
items.weapon.melee.longsword.name=доўгі меч
items.weapon.melee.longsword.typical_ability_desc=Дуэлянт можа _рассячы_ ворага доўгім мячом. Звычайна гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць. Калі рассячэнне забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць рассячэнне зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.mace.ability_desc=Дуэлянт можа нанесці _моцны ўдар_ булавой. Гэтая сканцэнтраваная атака наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.mace.ability_name=моцны ўдар
items.weapon.melee.mace.desc=Вялікая жалезная галоўка гэтай зброі наносіць значную шкоду.
items.weapon.melee.mace.name=булава
items.weapon.melee.mace.stats_desc=Гэта даволі дакладная зброя.
items.weapon.melee.mace.typical_ability_desc=Дуэлянт можа нанесці _моцны ўдар_ булавой. Гэтая сканцэнтраваная атака звычайна наносіць _%1$d-%2$d шкоду_, калі яна застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.magesstaff.ac_imbue=НАПІЦЬ
items.weapon.melee.magesstaff.ac_zap=ЗАП
items.weapon.melee.magesstaff.cursed_wand=Персаал пракляты, што робіць яго магію хаатычнай і выпадковай.
items.weapon.melee.magesstaff.desc=Гэты посах, створаны самім Магам, — унікальная магічная зброя, у якую можна ўмацаваць палачку.
items.weapon.melee.magesstaff.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.melee.magesstaff.has_wand=Персанал у цяперашні час прасякнуты _%s._
items.weapon.melee.magesstaff.imbue=Вы напаўняеце сваіх супрацоўнікаў %s.
items.weapon.melee.magesstaff.imbue_cursed=_Калі ты напоўніш праклятую палачку, то твой персанал таксама стане праклятым!_
items.weapon.melee.magesstaff.imbue_desc=Вы ўпэўненыя, што хочаце напоўніць свой персанал гэтай палачкай? \n\nКалі палачка, у якую напаўняецца палачка, таго ж або вышэйшага ўзроўню, што і персанал, персанал атрымае ў спадчыну ўзровень гэтай палачкі плюс адно з яе ўласных паляпшэнняў.
items.weapon.melee.magesstaff.imbue_level=Гэта напаўненне прывядзе да стварэння персаналу _+%d._
items.weapon.melee.magesstaff.imbue_lost=Палачка, якой зараз убудаваны ваш персанал, _будзе страчана_.
items.weapon.melee.magesstaff.imbue_talent=Палачка, якой зараз валодае ваш персанал, _будзе вернута пры +0_.
items.weapon.melee.magesstaff.imbue_unknown=Вы не ведаеце ўзровень гэтай палачкі, але гэтае напаўненне прывядзе да стварэння як мінімум жазла _+%d._
items.weapon.melee.magesstaff.name=посах мага
items.weapon.melee.magesstaff.no=Не, я перадумаў
items.weapon.melee.magesstaff.no_wand=Посах пакуль не мае магіі, яго трэба _напоўніць сілай палачкі_, перш чым яго можна будзе выкарыстоўваць для чытання загавораў.
items.weapon.melee.magesstaff.preserved=Папярэдняя палачка захавалася!
items.weapon.melee.magesstaff.prompt=Выберыце палачку
items.weapon.melee.magesstaff.yes=Так, я ўпэўнены
items.weapon.melee.meleeweapon.ability_cant_use=Вы не можаце зараз скарыстацца гэтай здольнасцю.
items.weapon.melee.meleeweapon.ability_low_str=Ты недастаткова моцны, каб скарыстацца здольнасцямі гэтай зброі.
items.weapon.melee.meleeweapon.ability_need_equip=Каб выкарыстоўваць гэтую здольнасць, вам трэба ўзброіць яе.
items.weapon.melee.meleeweapon.ability_no_charge=У цябе няма дастаткова энергіі, каб скарыстацца гэтай здольнасцю.
items.weapon.melee.meleeweapon.ability_no_target=Там няма мэты.
items.weapon.melee.meleeweapon.ability_occupied=Гэта месца занятае.
items.weapon.melee.meleeweapon.ability_target_range=Гэтая мэта не ў зоне дасяжнасці.
items.weapon.melee.meleeweapon.ac_ability=ЗДОЛЬНАСЦІ
items.weapon.melee.meleeweapon.probably_too_heavy=Напэўна, гэтая зброя занадта цяжкая для цябе.
items.weapon.melee.meleeweapon.prompt=Выберыце мэту
items.weapon.melee.meleeweapon.stats_known=Гэтая блізкая зброя _узроўню-%1$d_ наносіць _%2$d-%3$d ўрону_ і патрабуе _%4$d сілы_ для правільнага выкарыстання.
items.weapon.melee.meleeweapon.stats_unknown=Звычайна гэтая блізкабойная зброя _узроўню-%1$d_ наносіць _%2$d-%3$d ўрону_ і патрабуе _%4$d сілы_ для правільнага выкарыстання.
items.weapon.melee.meleeweapon.swap=Абмяняйцеся зброяй
items.weapon.melee.meleeweapon.swap_full=З поўным інвентарызацыяй гэтага не зробіш.
items.weapon.melee.meleeweapon.upgrade_ability_stat_name=Шкода ад здольнасцей
items.weapon.melee.quarterstaff$defensivestance.desc=Дуэлянтка выкарыстоўвае свой посах, каб адбіваць удары і снарады. Пакуль яна знаходзіцца ў гэтай стойцы, яе ўхіленне ад усіх атак павялічваецца ўтрая.\n\nХадзі засталіся: %s.
items.weapon.melee.quarterstaff$defensivestance.name=абарончая пазіцыя
items.weapon.melee.quarterstaff.ability_desc=Дуэлянтка можа прыняць _абарончую стойку_ з палкай. Гэтая стойка актывуецца імгненна і павялічвае яе ўхіленне ўтрая на працягу _%d хадоў._
items.weapon.melee.quarterstaff.ability_name=абарончая пазіцыя
items.weapon.melee.quarterstaff.desc=Кій з цвёрдых парод дрэва, канцы якога пакрытыя жалезам.
items.weapon.melee.quarterstaff.name=штатыва
items.weapon.melee.quarterstaff.stats_desc=Гэтая зброя блакуе 0-2 пашкоджанні.
items.weapon.melee.quarterstaff.typical_ability_desc=Дуэлянтка можа прыняць _абарончую стойку_ з палкай. Гэтая стойка актывуецца імгненна і звычайна ўтрая павялічвае яе ўхіленне на працягу _%d хадоў._
items.weapon.melee.quarterstaff.upgrade_ability_stat_name=Працягласць здольнасці
items.weapon.melee.rapier.ability_desc=Дуэлянт можа _выпад_ рапірай на ворага, які знаходзіцца на адлегласці 1 клеткі. Гэта рухаецца да ворага, наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць.
items.weapon.melee.rapier.ability_name=выпад
items.weapon.melee.rapier.desc=Тонкі прамы меч, які забяспечвае некаторую абарону ў абмен на меншую сілу ўдару.
items.weapon.melee.rapier.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.melee.rapier.name=рапіра
items.weapon.melee.rapier.stats_desc=Гэтая зброя блакуе 0-1 пашкоджанняў.
items.weapon.melee.rapier.typical_ability_desc=Дуэлянт можа _выпад_ рапірай на ворага, які знаходзіцца на адлегласці 1 клеткі. Гэтая рапіра рухаецца да ворага, звычайна наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць.
items.weapon.melee.roundshield$guardtracker.desc=Дуэлянтка падрыхтавала свой шчыт у чаканні будучых атак. Фізічныя або магічныя атакі, накіраваныя супраць яе, будуць цалкам адменены.\n\nХадоў засталося: %s.
items.weapon.melee.roundshield$guardtracker.guarded=ахоўваецца
items.weapon.melee.roundshield$guardtracker.name=ахова
items.weapon.melee.roundshield.ability_desc=Дуэлянт можа _абараняць_ сябе круглым шчытом, цалкам адбіваючы ўсе фізічныя або магічныя атакі, накіраваныя супраць яго, на працягу _%d хадоў_. Пасля таго, як дуэлянт заблакуе атаку, зваротная атака або выкарыстанне магіі спыняць абарону.
items.weapon.melee.roundshield.ability_name=ахоўнік
items.weapon.melee.roundshield.desc=Гэты вялікі шчыт эфектыўна блакуе атакі і з'яўляецца нядрэннай зброяй у крайнім выпадку.
items.weapon.melee.roundshield.name=круглы шчыт
items.weapon.melee.roundshield.stats_desc=Гэтая зброя блакуе 0-%d ўрону. Блакіроўка павялічваецца з паляпшэннем.
items.weapon.melee.roundshield.typical_ability_desc=Дуэлянт можа _абараняць_ сябе круглым шчытом, цалкам адбіваючы ўсе фізічныя або магічныя атакі, накіраваныя супраць яго, звычайна на працягу _%d хадоў_. Пасля таго, як дуэлянт заблакуе атаку, зваротная атака або выкарыстанне магіі спыняць абарону.
items.weapon.melee.roundshield.typical_stats_desc=Звычайна гэтая зброя блакуе 0-%d ўрону. Гэтая блакаванне маштабуецца з паляпшэннем.
items.weapon.melee.roundshield.upgrade_ability_stat_name=Працягласць здольнасці
items.weapon.melee.runicblade.ability_desc=Дуэлянт можа выканаць _рунічны ўдар_ рунічным лязом. Гэтая атака гарантавана трапная і мае сілу зачаравання _+%d%%._
items.weapon.melee.runicblade.ability_name=рунічны слэш
items.weapon.melee.runicblade.desc=Загадкавая зброя з далёкай краіны, з ярка-сінім лязом.
items.weapon.melee.runicblade.name=рунічнае лязо
items.weapon.melee.runicblade.stats_desc=Гэтая зброя атрымлівае больш карысці ад паляпшэнняў.
items.weapon.melee.runicblade.typical_ability_desc=Дуэлянт можа выканаць _рунічны ўдар_ рунічным лязом. Гэтая атака гарантавана трапная і звычайна мае сілу зачаравання _+%d%%._
items.weapon.melee.runicblade.upgrade_ability_stat_name=Сіла здольнасцей
items.weapon.melee.sai$combostriketracker.desc=Дуэлянт стварае камбінацыі, якія можна выкарыстоўваць для павелічэння шкоды ад здольнасці камбінаванага ўдару. Кожная паспяховая звычайная атака ў блізкім бою або кідальнай зброяй будзе лічыцца, але калі атака не была паспяховай на працягу 5 хадоў, гэта камбінацыя скідаецца. \n\nАпошнія ўдары: %1$d.\n\nХады да страты ўдараў: %2$s.
items.weapon.melee.sai$combostriketracker.name=камбінаваны ўдар
items.weapon.melee.sai.ability_desc=Дуэлянт можа выканаць _камбінаваны ўдар_ з дапамогай саю. Гэтая атака гарантавана трапная і наносіць _+%d шкоду_ за кожны ўдар дуэлянта звычайнай атакай блізкага бою або кідальнай зброяй. Калі дуэлянт не трапіць на працягу 5 хадоў, гэта камбінацыя скідаецца.
items.weapon.melee.sai.ability_name=камбінаваны ўдар
items.weapon.melee.sai.desc=Два тонкія ляза, прызначаныя для таго, каб трымаць іх у адной руцэ. Выдатна падыходзяць для таго, каб знішчыць ворагаў серыяй удараў.
items.weapon.melee.sai.name=сай
items.weapon.melee.sai.stats_desc=Гэта вельмі хуткая зброя.
items.weapon.melee.sai.typical_ability_desc=Дуэлянт можа выконваць _камбінаваны ўдар_ з дапамогай саю. Гэтая атака гарантавана трапная і звычайна наносіць _+%d шкоду_ за кожны ўдар дуэлянта звычайнай блізкай або кідальнай зброяй. Калі дуэлянт не трапіць на працягу 5 хадоў, гэта камбінацыя скідаецца.
items.weapon.melee.scimitar$sworddance.desc=Дуэлянтка наносіць хуткія ўдары, заснаваныя на імпульсе, у нейкім танцы. Пакуль гэтая стойка актыўная, яна атакуе на 60%% хутчэй (дастаткова, каб атакаваць роўна двойчы за ход ятаганам) і мае +50%% дакладнасць.\n\nХадзіліся хады: %s.
items.weapon.melee.scimitar$sworddance.name=танец з мячамі
items.weapon.melee.scimitar.ability_desc=Дуэлянт можа выканаць _танец мячоў_ з ятаганам. Гэтая стойка актывуецца імгненна і дае дуэлянту +60%% да хуткасці атакі і +50%% да дакладнасці на _%d хады._
items.weapon.melee.scimitar.ability_name=танец з мячамі
items.weapon.melee.scimitar.desc=Тоўсты выгнуты клінок. Яго форма дазваляе здзяйсняць больш хуткія, але менш магутныя атакі.
items.weapon.melee.scimitar.name=ятаган
items.weapon.melee.scimitar.stats_desc=Гэта даволі хуткая зброя.
items.weapon.melee.scimitar.typical_ability_desc=Дуэлянт можа выконваць _танец мячоў_ з ятаганам. Гэтая стойка актывуецца імгненна і дае дуэлянту +60%% да хуткасці атакі і +50%% да дакладнасці, як правіла, на працягу _%d хадоў._
items.weapon.melee.scimitar.upgrade_ability_stat_name=Працягласць здольнасці
items.weapon.melee.shortsword.ability_desc=Дуэлянт можа _рассячы_ ворага кароткім мячом. Гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць у цэль. Калі «рассячэнне» забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць «рассячэнне» зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.shortsword.ability_name=расшчапляць
items.weapon.melee.shortsword.desc=Даволі кароткі меч, усяго на некалькі сантыметраў даўжэйшы за кінжал.
items.weapon.melee.shortsword.name=кароткі меч
items.weapon.melee.shortsword.typical_ability_desc=Дуэлянт можа _рассячы_ ворага кароткім мячом. Звычайна гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць. Калі рассячэнне забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць рассячэнне зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.sickle.ability_desc=Дуэлянт можа _пакаштаваць_ ворага сярпом. Гэтая разбуральная атака гарантавана трапіць у ворага і нанясе _%d шкоду_. Гэтая шкода наносіцца ў выглядзе крывацёку, калі цэль не мае імунітэту.
items.weapon.melee.sickle.ability_name=ураджай
items.weapon.melee.sickle.desc=Ручная сельскагаспадарчая прылада, якая можа служыць і моцнай, але нязручнай зброяй.
items.weapon.melee.sickle.name=серп
items.weapon.melee.sickle.stats_desc=Гэта даволі недакладная зброя.
items.weapon.melee.sickle.typical_ability_desc=Дуэлянт можа _пакаштаваць_ ворага сярпом. Гэтая разбуральная атака гарантавана трапная і звычайна наносіць _%d шкоду_. Гэтая шкода наносіцца ў выглядзе крывацёку, калі цэль не мае імунітэту.
items.weapon.melee.spear.ability_desc=Дуэлянт можа выкарыстаць наканечнік дзіды, каб _праткнуць_ ворага, які знаходзіцца ў зоне дасяжнасці, але не побач. Гэта наносіць _%1$d-%2$d шкоду_, адкідае ворага назад і гарантавана трапіць у цэль.
items.weapon.melee.spear.ability_name=шып
items.weapon.melee.spear.desc=Тонкі драўляны прут з завостраным жалезным наканечнікам.
items.weapon.melee.spear.name=дзіда
items.weapon.melee.spear.stats_desc=Гэта даволі павольная зброя. \nГэтая зброя мае дадатковы радыус дзеяння.
items.weapon.melee.spear.typical_ability_desc=Дуэлянт можа выкарыстаць наканечнік дзіды, каб _праткнуць_ ворага, які знаходзіцца ў зоне дасяжнасці, але не побач. Звычайна гэта наносіць _%1$d-%2$d шкоду_, адкідае ворага назад і гарантавана трапіць у цэль.
items.weapon.melee.sword$cleavetracker.desc=Дуэлянтка гатовая працягнуць свой папярэдні разбойны ўдар. Наступнае выкарыстанне разбойнага ўдару не будзе каштаваць зарада здольнасці зброі.\n\nХадзі засталіся: %s.
items.weapon.melee.sword$cleavetracker.name=расшчапляць
items.weapon.melee.sword.ability_desc=Дуэлянт можа _рассячы_ ворага мячом. Гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць у цэль. Калі рассячэнне забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць рассячэнне зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.sword.ability_name=расшчапляць
items.weapon.melee.sword.desc=Добра збалансаваны меч. Не занадта вялікі, але ўсё ж прыкметна даўжэйшы за кароткі меч.
items.weapon.melee.sword.name=меч
items.weapon.melee.sword.typical_ability_desc=Дуэлянт можа _рассячы_ ворага мячом. Звычайна гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць у ворага. Калі рассячэнне забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць рассячэнне зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.warhammer.ability_desc=Дуэлянт можа нанесці _моцны ўдар_ баявым молатам. Гэтая сканцэнтраваная атака наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.warhammer.ability_name=моцны ўдар
items.weapon.melee.warhammer.desc=Мала якія істоты могуць вытрымаць разгромны ўдар гэтай велізарнай масы свінцу і сталі, але для эфектыўнага выкарыстання патрэбна вялікая сіла.
items.weapon.melee.warhammer.name=баявы молат
items.weapon.melee.warhammer.stats_desc=Гэта даволі дакладная зброя.
items.weapon.melee.warhammer.typical_ability_desc=Дуэлянт можа нанесці _моцны ўдар_ баявым молатам. Гэтая сканцэнтраваная атака звычайна наносіць _%1$d-%2$d шкоду_, калі застае ворага знянацку, і ашаламляе яго на 5 хадоў, што зніжае дакладнасць і ўхіленне на 50%%. Моцны ўдар заўсёды трапляе, але наносіць звычайную шкоду, калі не застае ворага знянацку.
items.weapon.melee.warscythe.ability_desc=Дуэлянт можа _зняць_ з ворага баявой касой. Гэтая разбуральная атака гарантавана трапіць у цэль і нанясе _%d шкоду_. Гэтая шкода наносіцца ў выглядзе крывацёку, калі цэль не мае імунітэту.
items.weapon.melee.warscythe.ability_name=ураджай
items.weapon.melee.warscythe.desc=Гэтая вялікая і нязграбная прылада была ўзмоцнена, каб яна лепш рэзала ворагаў, чым ураджай.
items.weapon.melee.warscythe.name=баявая каса
items.weapon.melee.warscythe.stats_desc=Гэта даволі недакладная зброя.
items.weapon.melee.warscythe.typical_ability_desc=Дуэлянт можа _збіраць_ ураджай з ворага баявой касой. Гэтая разбуральная атака гарантавана трапная і звычайна наносіць _%d шкоду_. Гэтая шкода наносіцца ў выглядзе крывацёку, калі цэль не мае імунітэту.
items.weapon.melee.whip.ability_desc=Дуэлянтка можа _пабіць_ усіх ворагаў вакол сябе пугай. Гэтая здольнасць наносіць _%1$d-%2$d шкоду_, атакуе ўсіх ворагаў у зоне дзеяння атакі і гарантавана трапіць.
items.weapon.melee.whip.ability_name=бізун
items.weapon.melee.whip.desc=Нягледзячы на тое, што калючы канец вяроўкі наносіць невялікую шкоду, яе дасяжнасць непараўнальная.
items.weapon.melee.whip.name=пуга
items.weapon.melee.whip.stats_desc=Гэтая зброя мае велізарны радыус дзеяння.
items.weapon.melee.whip.typical_ability_desc=Дуэлянтка можа _пабіць_ усіх ворагаў вакол сябе пугай. Гэтая здольнасць звычайна наносіць _%1$d-%2$d шкоду_, атакуе ўсіх ворагаў у зоне дзеяння атакі і гарантавана трапіць.
items.weapon.melee.wornshortsword.ability_desc=Дуэлянт можа _рассячы_ ворага зношаным кароткім мячом. Гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць. Калі рассячэнне забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць рассячэнне зноў на працягу 5 хадоў бясплатна.
items.weapon.melee.wornshortsword.ability_name=расшчапляць
items.weapon.melee.wornshortsword.desc=Даволі кароткі меч, зношаны ад інтэнсіўнага выкарыстання. Ён і слабейшы, і крыху лягчэйшы за кароткі меч у лепшым стане.
items.weapon.melee.wornshortsword.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.melee.wornshortsword.name=зношаны кароткі меч
items.weapon.melee.wornshortsword.typical_ability_desc=Дуэлянт можа _рассячы_ ворага зношаным кароткім мячом. Звычайна гэта наносіць _%1$d-%2$d шкоду_ і гарантавана трапіць. Калі рассячэнне забівае ворага, гэта адбываецца імгненна, і дуэлянт можа выкарыстаць рассячэнне зноў на працягу 5 хадоў бясплатна.
items.weapon.missiles.bolas.desc=Гэтая незвычайная зброя далёкага бою не наносіць вялікай шкоды, але выдатна запавольвае цэль.
items.weapon.missiles.bolas.name=болас
items.weapon.missiles.bolas.stats_desc=Гэтая зброя наносіць калецтва сваёй цэлі.
items.weapon.missiles.boomerang.desc=Кінутая ў ворага, гэтая плоская выгнутая драўляная ракета вернецца ў рукі таго, хто яе кінуў.
items.weapon.missiles.boomerang.durability=Дзякуючы трывалай канструкцыі, гэты бумеранг не зламаецца падчас выкарыстання.
items.weapon.missiles.boomerang.name=бумеранг
items.weapon.missiles.darts.adrenalinedart.desc=Гэтыя дроцікі маюць наканечнікі з фарбавальніка хуткага растаропшы, які павялічвае хуткасць перамяшчэння і атакі саюзнікаў або ненадоўга зніжае хуткасць перамяшчэння ворагаў. Сам дроцік усё яшчэ шкодны для ворагаў, але не нашкодзіць саюзнікам.
items.weapon.missiles.darts.adrenalinedart.name=адрэналінавы дартс
items.weapon.missiles.darts.blindingdart.desc=Гэтыя дроцікі маюць наканечнік з дабаўкай на аснове сляпой травы, якая на кароткі час асляпляе цэль. Аднак яны не дэзарыентуюць, таму вораг усё роўна будзе ведаць, дзе ён бачыў вас апошні раз.
items.weapon.missiles.darts.blindingdart.name=асляпляльная стрэлка
items.weapon.missiles.darts.chillingdart.desc=Гэтыя стрэлкі маюць наканечнік з ледзянога покрыва, які значна астуджае цэль.
items.weapon.missiles.darts.chillingdart.name=расслабляльны дроцік
items.weapon.missiles.darts.cleansingdart.desc=Гэтыя стрэлкі маюць наканечнікі з магерояла, які часова зробіць саюзнікаў неўспрымальнымі да ўсіх негатыўных эфектаў або ачысціць ворагаў ад станоўчых. Ворагі могуць нават ненадоўга забыць, што яны атакуюць або ўцякаюць ад вас. Сама стрэлка ўсё яшчэ шкодная для ворагаў, але не пашкодзіць саюзнікам.
items.weapon.missiles.darts.cleansingdart.name=ачышчальная стрэлка
items.weapon.missiles.darts.dart.ac_tip=ПАРАДА
items.weapon.missiles.darts.dart.desc=Гэтыя простыя драўляныя дрэўкі з калючымі наканечнікамі маюць уцяжараную форму, каб ляцець прама і джаліць ахвяру адным рухам запясця. Іх можна наканечваць насеннем, каб атрымаць бонусныя эфекты пры кідку.
items.weapon.missiles.darts.dart.name=дроцік
items.weapon.missiles.darts.dart.prompt=Выберыце насенне
items.weapon.missiles.darts.dart.tip_all=дроцікі %1$d з насеннем %2$d
items.weapon.missiles.darts.dart.tip_cancel=адмяніць
items.weapon.missiles.darts.dart.tip_desc=Насенне можна спалучаць з адным або двума стрэлкамі, каб наканечнік быў у іх. Кожны тып насення мае свой уласны тып стрэлкі з унікальным аднаразовым эфектам. \n\nНаканечнік стрэлкі гэтымі насеннем прывядзе да _%s._
items.weapon.missiles.darts.dart.tip_one=наканечнік 1 дроцік з 1 зернем
items.weapon.missiles.darts.dart.tip_title=Tip Darts
items.weapon.missiles.darts.dart.tip_two=наканечнік 2 стрэлкі з 1 зернем
items.weapon.missiles.darts.dart.unlimited_uses=Дзякуючы сваёй простай канструкцыі, дроцікі будуць служыць вечна.
items.weapon.missiles.darts.displacingdart.desc=Гэтыя дроцікі маюць наканечнікі з змешаным рэчывам на аснове бляклага лісця, якое тэлепартуе цэль на невялікую адлегласць.
items.weapon.missiles.darts.displacingdart.name=зрушваючы стрэлку
items.weapon.missiles.darts.healingdart.desc=Гэтыя дроцікі маюць наканечнік з сонечнай травы, які дае цэлі выбух лячэння. Сама дроціка ўсё яшчэ шкодная для ворагаў, але не прычыняе шкоды саюзнікам.
items.weapon.missiles.darts.healingdart.name=гаючая стрэлка
items.weapon.missiles.darts.holydart.desc=Гэтыя дроцікі маюць наканечнікі злучэння на аснове зорчатай кветкі, якое напаўняе цэль святой энергіяй. Саюзнікі і звычайныя ворагі стануць дабраславёнымі, але нябожчыкі або дэманічныя ворагі атрымаюць моцную шкоду. Сама дроціка ўсё яшчэ шкодная для ворагаў, але не пашкодзіць саюзнікам.
items.weapon.missiles.darts.holydart.name=святая стрэлка
items.weapon.missiles.darts.incendiarydart.desc=Гэтыя стрэлкі маюць наканечнік з агрэгатам на аснове агністага квету, які пры ўдары выбухае яркім полымем.
items.weapon.missiles.darts.incendiarydart.name=запальная стрэлка
items.weapon.missiles.darts.paralyticdart.desc=Гэтыя стрэлкі маюць наканечнік з даданнем рэчыва на аснове земляных кораняў, якое на кароткі час паралізуе цэль.
items.weapon.missiles.darts.paralyticdart.name=паралітычны дроцік
items.weapon.missiles.darts.poisondart.desc=Гэтыя стрэлкі маюць наканечнік злучэння на аснове сумнага моху, якое атруціць цэль.
items.weapon.missiles.darts.poisondart.name=атрутная стрэлка
items.weapon.missiles.darts.rotdart.desc=Гэтыя дзікія дроцікі маюць наканечнікі з кіслотным рэчывам на аснове гнілі, якое агрэсіўна раз'ядае ўсё, з чым яны дакранаюцца. Магутныя ворагі будуць супраціўляцца большай частцы эфекту, але карозія дастаткова моцная, каб лёгка забіць большасць звычайных ворагаў. Яны служаць даўжэй, чым іншыя дроцікі з наканечнікамі, але іх трываласць нельга павялічыць.
items.weapon.missiles.darts.rotdart.discover_hint=Вы можаце стварыць гэты прадмет, выкарыстоўваючы насенне з пэўнага квэста.
items.weapon.missiles.darts.rotdart.name=гнілая дроцік
items.weapon.missiles.darts.shockingdart.desc=Гэтыя дроцікі маюць наканечнік з кампазітам на аснове штормавай лазы, які нанясе цэлі моцны токавы эфект.
items.weapon.missiles.darts.shockingdart.name=шакуючы дроцік
items.weapon.missiles.darts.tippeddart.about_to_break=Тэрмін прыдатнасці вашага дроціка хутка скончыцца.
items.weapon.missiles.darts.tippeddart.ac_clean=ЧЫСТЫ
items.weapon.missiles.darts.tippeddart.cancel=адмяніць
items.weapon.missiles.darts.tippeddart.clean_all=ачысціць усё
items.weapon.missiles.darts.tippeddart.clean_desc=Гэта дзеянне выдаліць наканечнік зерня на вашых дроціках, вярнуўшы іх да звычайных дроцікаў.
items.weapon.missiles.darts.tippeddart.clean_one=чысты
items.weapon.missiles.darts.tippeddart.clean_title=Чыстыя дартс
items.weapon.missiles.darts.tippeddart.discover_hint=Гэты прадмет можна купіць у краме або зрабіць з насення.
items.weapon.missiles.darts.tippeddart.has_broken=Тэрмін прыдатнасці вашага дроціка скончыўся.
items.weapon.missiles.darts.tippeddart.unlimited_uses=Але яны настолькі высокай якасці, што праслужаць вечна.
items.weapon.missiles.darts.tippeddart.uses_left=Гэты набор дроцікаў можна выкарыстоўваць _%d/%d_, перш чым адзін наканечнік сцерціся.
items.weapon.missiles.fishingspear.desc=Малюсенькія кідальныя дзіды, якія добра працуюць як імправізаваная зброя, нягледзячы на тое, што прызначаныя для рыбалкі.
items.weapon.missiles.fishingspear.name=рыбалоўная дзіда
items.weapon.missiles.forcecube.desc=Гэтыя чароўныя кубікі дзіўнай формы дастаткова малыя, каб трымаць іх у руцэ, але неверагодна цяжкія.
items.weapon.missiles.forcecube.name=куб сілы
items.weapon.missiles.forcecube.ondeath=Ты забіў сябе сваім уласным Кубам Сілы...
items.weapon.missiles.forcecube.stats_desc=Гэтая зброя распаўсюджвае сілу свайго ўдару на невялікую плошчу, дзівячы ўсё, што знаходзіцца побач.
items.weapon.missiles.heavyboomerang.desc=Гэтым вялікім бумерангам цяжка эфектыўна карыстацца, але ён наносіць значную шкоду.
items.weapon.missiles.heavyboomerang.name=цяжкі бумеранг
items.weapon.missiles.heavyboomerang.stats_desc=Гэтая зброя вяртаецца ў месца, адкуль яе кінулі, праз пяць хадоў.
items.weapon.missiles.javelin.desc=Гэтыя большыя кідальныя дзіды маюць уцяжарвальнік, каб кончык іх дзіды быў наперадзе, калі яны ляцяць у паветры.
items.weapon.missiles.javelin.name=кіданне дзіды
items.weapon.missiles.kunai.desc=Гэтыя невялікія нажы вельмі магутныя ў руках умелага карыстальніка.
items.weapon.missiles.kunai.name=кунай
items.weapon.missiles.kunai.stats_desc=Гэтая зброя мацнейшая супраць непадрыхтаваных ворагаў.
items.weapon.missiles.missileweapon$placeholder.name=кінутая зброя
items.weapon.missiles.missileweapon.about_to_break=Твая кінутая зброя вось-вось зламаецца.
items.weapon.missiles.missileweapon.break_upgraded_warn_desc=Калі апошняя кідальная зброя з вашага палепшанага набору кідальнай зброі зламаецца, набор будзе страчаны назаўсёды. Вы ўпэўненыя, што хочаце кінуць яе?
items.weapon.missiles.missileweapon.break_upgraded_warn_no=не
items.weapon.missiles.missileweapon.break_upgraded_warn_yes=так
items.weapon.missiles.missileweapon.curse_discover=Гэтая кінутая зброя праклятая!
items.weapon.missiles.missileweapon.distance=Кідальная зброя больш дакладная на адлегласці, але менш дакладная зблізку.
items.weapon.missiles.missileweapon.durability=Кідальная зброя будзе зношвацца і ламацца па меры выкарыстання.
items.weapon.missiles.missileweapon.dust=Кінутая зброя рассыпаецца ў пыл, калі да яе дакранешся.
items.weapon.missiles.missileweapon.has_broken=Адна з вашых кідальных гармат зламалася.
items.weapon.missiles.missileweapon.probably_too_heavy=Напэўна, гэтая зброя занадта цяжкая для цябе.
items.weapon.missiles.missileweapon.stats_known=Гэты набор кідальнай зброі _tier-%1$d_ наносіць _%2$d-%3$d ўрону_ і патрабуе _%4$d сілы_ для выкарыстання.
items.weapon.missiles.missileweapon.stats_unknown=Звычайна гэты набор кідальнай зброі _tier-%1$d_ наносіць _%2$d-%3$d ўрону_ і патрабуе _%4$d сілы_ для выкарыстання.
items.weapon.missiles.missileweapon.unknown_uses=Звычайна гэты набор кідальнай зброі мае _%d_ выкарыстання, перш чым адно зламаецца.
items.weapon.missiles.missileweapon.unlimited_uses=Гэты набор настолькі высокай якасці, што ён праслужыць вечна.
items.weapon.missiles.missileweapon.uses_left=Гэты набор кідальнай зброі мае _%d/%d_ выкарыстанняў, перш чым адна зламаецца.
items.weapon.missiles.shuriken$shurikeninstanttracker.desc=Вы нядаўна імгненна кінулі сюрыкен і павінны пачакаць, перш чым зрабіць гэта зноў. Сюрыкены ўсё яшчэ можна кідаць, але з нармальнай хуткасцю зброі.\n\nХадоў засталося: %s.
items.weapon.missiles.shuriken$shurikeninstanttracker.name=Час аднаўлення сюрыкена
items.weapon.missiles.shuriken.desc=Металічныя зорачкі з вострымі як брытва краямі наносяць сур'ёзныя раны пры траплянні. Іх можна кідаць вельмі хутка.
items.weapon.missiles.shuriken.name=сюрыкен
items.weapon.missiles.shuriken.stats_desc=Сюрыкены можна кінуць імгненна, час аднаўлення складае 20 хадоў.
items.weapon.missiles.throwingclub.desc=Даволі простая, але трывалая кідальная зброя, па сутнасці вялікі камень, прымацаваны да палкі.
items.weapon.missiles.throwingclub.name=кідальны клуб
items.weapon.missiles.throwingclub.stats_desc=Гэтая зброя не прыліпае да ворагаў і яе можна сабраць імгненна.
items.weapon.missiles.throwinghammer.desc=Гэтыя цяжкія малаткі прызначаны для таго, каб кідаць іх у ворага. Іх гладкая суцэльнаметалічная канструкцыя робіць іх даволі трывалымі.
items.weapon.missiles.throwinghammer.name=кіданне молата
items.weapon.missiles.throwinghammer.stats_desc=Гэтая зброя не прыліпае да ворагаў і яе можна сабраць імгненна.
items.weapon.missiles.throwingknife.desc=Гэтыя лёгкія нажы збалансаваны так, каб ляцець па паветры прама ў цэль.
items.weapon.missiles.throwingknife.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.missiles.throwingknife.name=кідальны нож
items.weapon.missiles.throwingknife.stats_desc=Гэтая зброя мацнейшая супраць непадрыхтаваных ворагаў.
items.weapon.missiles.throwingspear.desc=Гэтыя лёгкія дзіды маюць тонкія рамы, прызначаныя для кідання, а не для ўдараў.
items.weapon.missiles.throwingspear.name=кіданне дзіды
items.weapon.missiles.throwingspike.desc=Гэтыя трывалыя завостраныя металічныя стрэлы прызначаны для кідання ў далёкіх ворагаў.
items.weapon.missiles.throwingspike.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.missiles.throwingspike.name=кіданне шыпа
items.weapon.missiles.throwingstone.desc=Гэтыя камяні адшліфаваны, каб іх можна было кідаць з большай сілай, чым звычайныя камяні.
items.weapon.missiles.throwingstone.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.missiles.throwingstone.name=кіданне каменя
items.weapon.missiles.tomahawk.desc=Гэтыя кідальныя сякеры маюць зубчасты край, які рвецца, калі яны ўпіваюцца ў ворага.
items.weapon.missiles.tomahawk.name=тамагаўк
items.weapon.missiles.tomahawk.stats_desc=Гэтая зброя наносіць цэлі _%1$d-%2$d крывацёк_.
items.weapon.missiles.tomahawk.typical_stats_desc=Гэтая зброя звычайна наносіць цэлі _%1$d-%2$d крывацёк_.
items.weapon.missiles.trident.desc=Масіўныя кідальныя дзіды з трыма смяротнымі зубцамі на канцы. Яны магутныя, але даволі цяжкія.
items.weapon.missiles.trident.name=трызубец
items.weapon.spiritbow.ac_shoot=СТРАЛЯЦЬ
items.weapon.spiritbow.desc=Лук, зроблены са старажытнага чароўнага дрэва. Цяціва і гравюры свецяцца бледна-блакітным святлом. Калі нацягнуць цяціву, гэты лук выкліча чароўную стралу, якую можна выпусціць у ворага.
items.weapon.spiritbow.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.weapon.spiritbow.name=духоўны лук
items.weapon.spiritbow.prompt=Выберыце мэту
items.weapon.spiritbow.stats=Лук нельга напрамую палепшыць, але замест гэтага ён будзе паступова мацнець па меры павышэння ўзроўню. На вашым бягучым узроўні стрэлы, выпушчаныя з лука, будуць наносіць _%1$d-%2$d шкоду_ і патрабуюць _%3$d сілы_ для правільнага выкарыстання.
items.weapon.weapon$enchantment.discover_hint=Вы можаце знайсці прадмет з гэтым эфектам выпадковым чынам у падзямеллі або паспрабаваць прымяніць яго да прадмета самастойна.
items.weapon.weapon$enchantment.enchant=зачараванне
items.weapon.weapon$enchantment.rankings_desc=Забіты чарамі
items.weapon.weapon.cursed=У гэтай зброі хаваецца злавесная магія.
items.weapon.weapon.cursed_worn=Паколькі гэтая зброя праклятая, ты не можаш яе зняць.
items.weapon.weapon.enchant_hardened=Яно было _загартаванае._
items.weapon.weapon.enchanted=у яго ёсць _%s._
items.weapon.weapon.excess_str=З-за вашай лішняй сілы вы нанясеце _0-%d бонусную шкоду_ гэтай зброяй.
items.weapon.weapon.faster=Гэта дапоўнена для павышэння _хуткасці._
items.weapon.weapon.hardened_no_enchant=Гэтая зброя была _загартаваная_, але пакуль што не зачараваная.
items.weapon.weapon.hardening_gone=Загартоўка гэтай зброі сцерлася!
items.weapon.weapon.identify=Цяпер вы дастаткова добра знаёмыя са сваёй зброяй, каб яе распазнаць.
items.weapon.weapon.incompatible=Узаемадзеянне розных відаў магіі зняло зачараванне гэтай зброі!
items.weapon.weapon.not_cursed=Гэтая зброя не мае злога магічнага ўплыву.
items.weapon.weapon.stronger=Яно ўзмацняецца для павелічэння _шкоды_.
items.weapon.weapon.too_heavy=З-за вашай недастатковай сілы гэтая зброя будзе перашкаджаць вашай хуткасці атакі, дакладнасці і здольнасці да нечаканай атакі.
items.weapon.weapon.weak_cursed=Нягледзячы на праклён, вы можаце зняць гэтую зброю з экіпіроўкі.

items.keys.skeletonkey.desc=Гэты ключ выглядае сур'ёзна: яго галоўка мае форму чэрапа. Напэўна, ён можа адчыніць нейкія сур'ёзныя дзверы.
items.weapon.missiles.bombarrow.desc=Страла з прымацаванай бомбай. Трымайце дыстанцыю..
items.weapon.missiles.bombarrow.name=бомбавая стрэлка
items.weapon.missiles.missileweapon.damage_desc=Гэтая зброя наносіць ад _%1$d_ да _%2$d_ адзінак шкоды за ўдар.
items.bags.seedpouch.desc=У гэтым маленькім аксамітным мяшэчку можна захоўваць колькі заўгодна насення. Вельмі зручна.
items.bags.seedpouch.name=мяшочак з насеннем
items.potions.potionofmight.desc=Гэтая моцная вадкасць разальецца па цягліцах, назаўжды павялічыўшы сілу на адзін пункт, а здароўе — на пяць.
items.potions.potionofmight.name=Зелле моцы
items.rings.ringofdetection.desc=З гэтым пярсцёнкам можна заўважаць схаваныя пасткі і таемныя дзверы, не губляючы часу на пошук. Аслабленыя пярсцёнкі выяўлення прытупляюць пачуцці, таму знаходзіць сакрэты цяжэй нават пры старанным пошуку.
items.rings.ringofdetection.name=пярсцёнак выяўлення
items.rings.ringofhaggler.desc=Насамрэч гэты пярсцёнак не мае магічных уласцівасцей. Ён паказвае гандлярам, што яго ўладальнік належыць да Гільдыі злодзеяў. Звычайна яны ахвотна даюць зніжку ў абмен на абяцанне пэўны час іх не чапаць. Паляпшэнне пярсцёнка не дае дадатковых пераваг.
items.rings.ringofhaggler.name=пярсцёнак торгу
items.rings.ringofherbalism.desc=Гэты пярсцёнак павялічвае шанец знайсці расу і насенне, вытоптваючы траву.
items.rings.ringofherbalism.name=пярсцёнак зельніцтва
items.rings.ringofmending.desc=Гэты пярсцёнак узмацняе здольнасць цела аднаўляцца, паскараючы вяртанне страчанага здароўя. Аслабленыя пярсцёнкі запавольваюць ці нават спыняюць натуральнае гаенне.
items.rings.ringofmending.name=пярсцёнак аднаўлення
items.rings.ringofpower.desc=Энергетычнае поле гэтага пярсцёнка ўзмацняе твае жазлы. Аслабленыя пярсцёнкі магутнасці, наадварот, робяць іх слабейшымі.
items.rings.ringofpower.name=пярсцёнак магутнасці
items.rings.ringofsatiety.desc=З гэтым пярсцёнкам можна даўжэй абыходзіцца без ежы. Аслабленыя пярсцёнкі сытасці дзейнічаюць наадварот.
items.rings.ringofsatiety.name=пярсцёнак сытасці
items.rings.ringofshadows.desc=Ворагі будуць менш схільныя заўважаць вас, калі вы будзеце насіць гэтае кольца. Дэградаваныя кольцы ценяў папярэдзяць ворагаў, якія інакш маглі б не заўважыць вашай прысутнасці.
items.rings.ringofshadows.name=пярсцёнак ценяў
items.rings.ringofthorns.desc=У гэтага пярсцёнка няма сапраўдных шыпоў, але вораг, які цябе атакуе, сам атрымае частку нанесенай шкоды. Паляпшэнне пярсцёнка не дае дадатковых пераваг.
items.rings.ringofthorns.name=пярсцёнак шыпоў
items.scrolls.scrollofchallenge.desc=Пры чытанні ўслых гэты скрутак выпусціць рык, які абудзіць усіх монстраў і папярэдзіць іх пра месцазнаходжанне чытача.
items.scrolls.scrollofchallenge.name=скрутак выкліку
items.scrolls.scrollofenchantment.desc=Гэты скрутак здольны напаўняць зброю або даспехі выпадковым зачараваннем, надаючы ім асаблівую сілу.
items.scrolls.scrollofenchantment.name=скрутак зачаравання
items.scrolls.scrollofpsionicblast.desc=Гэты скрутак змяшчае разбуральную энергію, якую можна накіраваць псіянічным шляхам, каб нанесці велізарную шкоду ўсім істотам у полі зроку. Суправаджальны ўспышка святла часова асляпіць усіх у зоне ўздзеяння, у тым ліку і чытача скрутка.
items.scrolls.scrollofpsionicblast.name=скрутак псіянічнага выбуху
items.scrolls.scrollofwipeout.desc=Прачытайце гэты скрутак, каб вызваліць гнеў духаў падзямелля і забіць усіх на бягучым узроўні. Ну, амаль усіх. Некаторыя з найбольш магутных істот могуць не пацярпець.
items.scrolls.scrollofwipeout.name=скрутак знішчэння
items.wands.wandofblink.desc=Гэтае жазло дазваляе тэлепартавацца ў выбраным кірунку. Істоты і нерухомыя перашкоды спыняюць тэлепартацыю.
items.wands.wandofblink.name=жазло перамяшчэння
items.wands.wandoffirebolt.desc=Гэтае жазло выпускае зарады магічнага агню. Ён падпальвае гаручую мясцовасць, раніць і запальвае істоту, у якую трапіць.
items.wands.wandoffirebolt.name=жазло вогненнай стралы
