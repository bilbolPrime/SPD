items.artifacts.masterthievesarmband.ac_steal=КРАДЗІЦЬ
items.artifacts.masterthievesarmband.cursed=Нельга выкарыстоўваць праклятую павязку.
items.artifacts.masterthievesarmband.desc=Гэтая фіялетавая аксамітная павязка мае клеймо майстра-злодзея. Яна не належыць табе, але, верагодна, не належала і папярэдняму карыстальніку.
items.artifacts.masterthievesarmband.desc_cursed=Праклятая павязка прывязана да твайго запясця, і неяк твой мяшочак з золатам павольна становіцца лягчэйшым...
items.artifacts.masterthievesarmband.desc_worn=Па меры набыцця вопыту вы адчуваеце, як у вашым запясці нарастае сіла. Вы можаце выкарыстоўваць гэтую здольнасць, каб красці з крамаў або рабаваць ворагаў! \n\nРабаванне ворагаў адбываецца імгненна, ненадоўга дэзарыентуе іх і дае вам шанец атрымаць любую здабычу, якую ў іх ёсць! Гэтая здольнасць больш эфектыўная супраць непадрыхтаваных ворагаў. Некалькі разоў рабаванне аднаго і таго ж ворага не дае больш шанцаў на здабычу.
items.artifacts.masterthievesarmband.failed_steal=Табе нічога не ўдалося скрасці.
items.artifacts.masterthievesarmband.full=Ваш наручны бранзалет цалкам зараджаны!
items.artifacts.masterthievesarmband.level_up=Твая павязка становіцца мацнейшай!
items.artifacts.masterthievesarmband.name=павязка майстра-злодзея
