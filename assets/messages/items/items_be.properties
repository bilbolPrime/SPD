items.artifacts.holytome.cursed=Вы не можаце выкарыстоўваць пракляты том.
items.artifacts.holytome.desc=Святы том, які служыць цэнтрам боскай магіі клірыка. Выкарыстанне тома дазваляе клірыку выкарыстоўваць розныя магічныя загаворы.\n\n Том будзе паступова ўзмацняцца па меры выкарыстання клірыкам, што дае яму больш максімальных зарадаў і нязначна павялічвае хуткасць перазарадкі.
items.artifacts.holytome.discover_hint=Адзін з герояў пачынае з гэтага прадмета.
items.artifacts.holytome.levelup=Твой том становіцца мацнейшым!
